language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: tl
  text: Pagkatapos, sabay-sabay na hinipan ng tatlong pangkat ang mga trumpeta at binasag ang mga banga. Hawak nila sa kaliwang kamay ang mga sulo at sa kanang kamay ang mga trumpeta upang hipan, at sumigaw sila, “Isang tabak para kay Yahweh at para kay Gideon!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang tabak ni Yahweh at ni Gideon!”
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: ang tatlong pangkat
  rationale: Sa konteksto ng hukbo, tumutukoy ito sa tatlong pangkat na binuo ni Gideon, hindi sa literal na ‘mga ulo.’ Natural at malinaw sa modernong Tagalog ang ‘mga pangkat.’
- source_word: שׁוֹפָרוֹת
  choice: mga trumpeta
  rationale: Tumutukoy ang salita sa instrumentong sungay na ginagamit sa pagbibigay-hudyat. Ang ‘mga trumpeta’ ang pinakanatural na salin sa Tagalog sa kontekstong ito.
- source_word: הַכַּדִּים
  choice: mga banga
  rationale: Ang כַּד ay sisidlang gaya ng banga o tapayan. Ang ‘mga banga’ ay malinaw, karaniwan, at akma sa salaysay.
- source_word: וַיַּחֲזִיקוּ
  choice: Hawak nila
  rationale: Ipinahihiwatig dito ang paghawak sa mga bagay sa kamay. Ang ‘Hawak nila’ ay natural at hindi nagpapasidhi nang higit sa hinihingi ng teksto.
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: sa kaliwang kamay ... sa kanang kamay
  rationale: 'Distributibo ang anyong Hebreo: bawat lalaki ay may hawak sa bawat kamay. Natural sa Tagalog ang pang-isahang ‘kamay’ sa ganitong paglalarawan.'
- source_word: לַפִּדִים
  choice: mga sulo
  rationale: Tumutukoy ito sa bagay na nagliliyab at dinadala bilang ilaw. Ang ‘mga sulo’ ang malinaw at karaniwang katumbas.
- source_word: לִתְקֹעַ
  choice: upang hipan
  rationale: 'Nagsasaad ng layunin ang pawatas: hawak nila ang mga trumpeta para hipan ang mga iyon.'
- source_word: וַיִּקְרְאוּ
  choice: sumigaw sila
  rationale: Isang malakas na sigaw-panlaban ang inilalarawan, kaya mas angkop ang ‘sumigaw’ kaysa sa payak na ‘tumawag.’
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Isang tabak para kay Yahweh at para kay Gideon!
  rationale: Walang pandiwa at sadyang maikli ang parirala. Pinananatili ng salin ang לְ bilang ‘para kay’ at ang biglaang lakas ng sigaw-panlaban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang banal na pangalan bilang ‘Yahweh’ sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapakahulugan sa sigaw na חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Isang tabak para kay Yahweh at para kay Gideon!
  alternative: Ang tabak ni Yahweh at ni Gideon!
  rationale: Elliptical at walang pandiwa ang Hebreo. Pinananatili ng pangunahing salin ang literal na direksiyon ng pang-ukol na לְ (‘para kay’), samantalang itinatala sa talababa ang tradisyonal at posible ring pagbasa upang huwag alisin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa masiglang salaysay. Ginamit ang ‘sabay-sabay’ upang natural na ipahayag ang magkakasabay na pagkilos ng tatlong pangkat. Nasa dulo ng siniping sigaw ang marker [a] upang malinaw na ang talababa ay tumutukoy sa alternatibong pagbasa ng buong sigaw.
