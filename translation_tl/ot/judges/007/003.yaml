  text: וְ/עַתָּ֗ה קְרָ֨א נָ֜א בְּ/אָזְנֵ֤י הָ/עָם֙ לֵ/אמֹ֔ר מִֽי יָרֵ֣א וְ/חָרֵ֔ד יָשֹׁ֥ב וְ/יִצְפֹּ֖ר מֵ/הַ֣ר הַ/גִּלְעָ֑ד וַ/יָּ֣שָׁב מִן הָ/עָ֗ם עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים נִשְׁאָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: tl
  text: 'Ngayon, ipahayag mo sa pandinig ng bayan: “Ang sinumang natatakot at nanginginig ay bumalik at lumisan[a] mula sa Bundok Gilead[b].” At dalawampu’t dalawang libong kabilang sa bayan ang bumalik, at sampung libo ang naiwan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi pangkaraniwan at pinagtatalunan ang pandiwang Hebreo na isinaling “lumisan” (וְיִצְפֹּר). Maaaring ipinahihiwatig nito ang “umalis nang maaga” o “palihim na umalis.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Bundok Gilead” ang tuwirang salin ng Hebreo, bagaman mahirap tukuyin ang heograpikal na tinutukoy nito sa kontekstong ito. Nauunawaan ito ng ilan bilang mas malawak na bulubunduking lupain ng Gilead.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: May tahasang temporal na וְעַתָּה (‘at ngayon/ngayon’) sa tekstong Hebreo. Likas sa Filipino ang ‘Ngayon’ sa simula ng utos; hindi kailangang piliting isalin nang hiwalay ang pang-ugnay na וְ.
- source_word: קְרָא נָא
  choice: ipahayag mo
  rationale: Ang קרא ay pampublikong pagpapahayag, at ang נָא ay nagpapalumanay sa utos. Sa makabagong Filipino, sapat na magalang at likas sa konteksto ang ‘ipahayag mo’; ang ‘pakisuyong’ ay maaaring maging labis na magalang para sa isang makapangyarihang utos.
- source_word: בְּאָזְנֵי הָעָם
  choice: sa pandinig ng bayan
  rationale: Pinananatili nito ang pandinig na larawan ng idyomang literal na ‘sa mga tainga ng bayan’ habang nananatiling malinaw at marangal sa Filipino.
- source_word: מִי יָרֵא וְחָרֵד
  choice: Ang sinumang natatakot at nanginginig
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na paglalarawan: takot at pisikal na panginginig.'
- source_word: יָשֹׁב
  choice: ay bumalik
  rationale: Sa loob ng ipinahahayag na utos, ipinapahayag nito ang jussive na tagubilin na bumalik ang taong natatakot, hindi isang payak na hula tungkol sa hinaharap.
- source_word: וְיִצְפֹּר
  choice: at lumisan
  rationale: Hindi pangkaraniwan at pinagtatalunan ang pandiwa. Ipinahahayag ng ‘lumisan’ ang malinaw na kilos ng pag-alis nang hindi tiyakang ipinapasok sa pangunahing teksto ang posibleng diwang ‘umalis nang maaga’ o ‘palihim na umalis.’
- source_word: מֵהַר הַגִּלְעָד
  choice: mula sa Bundok Gilead
  rationale: Ito ang tuwirang pagbasa sa pang-isahang הַר at sa pangalang Gilead, habang inilalagay sa talababa ang suliraning heograpikal at ang posibleng mas malawak na kahulugan.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: dalawampu’t dalawang libo
  rationale: Karaniwan at malinaw na anyo ng bilang sa makabagong Filipino.
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: at sampung libo ang naiwan
  rationale: Likas na isinasalin ng ‘naiwan’ ang kahulugang nanatili ang sampung libo matapos umalis ang iba.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pampublikong himig ng utos at ang dobleng paglalarawan sa takot. Inilipat ang mga pananda ng talababa sa mismong mga salitang tinatalakay ng bawat tala. Isinalin ang tahasang וְעַתָּה bilang ‘Ngayon,’ ayon sa tekstong WLC kahit wala ito sa ibinigay na English consultation layer.
