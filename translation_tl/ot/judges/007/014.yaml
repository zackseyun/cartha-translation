  text: וַ/יַּ֨עַן רֵעֵ֤/הוּ וַ/יֹּ֨אמֶר֙ אֵ֣ין זֹ֔את בִּלְתִּ֗י אִם חֶ֛רֶב גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ אִ֣ישׁ יִשְׂרָאֵ֑ל נָתַ֤ן הָֽ/אֱלֹהִים֙ בְּ/יָד֔/וֹ אֶת מִדְיָ֖ן וְ/אֶת כָּל הַֽ/מַּחֲנֶֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: tl
  text: Sumagot ang kasama niya at nagsabi, “Wala itong iba kundi ang tabak ni Gideon na anak ni Joas, isang lalaking Israelita. Ibinigay ng Diyos sa kanyang kamay[a] ang Midian at ang buong kampo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa kanyang kamay” ay idyomang Hebreo na nangangahulugang nasa ilalim ng kanyang kapangyarihan o pamamahala.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: Sumagot ang kasama niya at sinabi
  rationale: Pinananatili ang dalawang pandiwang nasa pormula ng salaysay sa Hebreo, habang gumagamit ng likas at marangal na ayos sa Filipino.
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: Walang iba ito kundi
  rationale: Ipinahahayag nito ang mariing pagbubukod at tiyak na pagkilala sa kahulugan ng panaginip nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: חֶרֶב גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: ang tabak ni Gideon na anak ni Joas
  rationale: Pinananatili ang larawan ng tabak at ang maikling patronimiko; sa konteksto, ang tabak ay sagisag ng kapangyarihang pandigma ni Gideon.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: isang lalaking Israelita
  rationale: Natural sa modernong Filipino at pinananatili ang tahasang panlalaking isahan at pagkakakilanlang etniko ng Hebreo.
- source_word: נָתַן הָאֱלֹהִים
  choice: Ibinigay ng Diyos
  rationale: Ang aspektong ganap sa Hebreo ay naglalarawan sa tagumpay bilang tiyak at maituturing nang ipinagkaloob; sapat ang Filipino na anyong “ibinigay” upang mapanatili ang katiyakang iyon.
- source_word: בְּיָדוֹ
  choice: sa kamay niya
  rationale: Pinananatili ang karaniwang idyomang Hebreo ng paghahatid sa kapangyarihan o pamamahala ng isang tao; nililinaw ito sa talababa.
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: ang Midian at ang buong kampo
  rationale: Pinananatili ang pangalang “Midian” bilang kolektibong tawag sa kaaway at ang kabuuang saklaw ng kanilang kampo.
theological_decisions:
- issue: Pagpapakahulugan sa tabak ni Gideon
  choice: Pinanatili bilang “ang tabak ni Gideon”
  alternative: ang kapangyarihan o hukbo ni Gideon
  rationale: Ang teksto mismo ay gumagamit ng konkretong larawan ng tabak. Hindi ito pinalitan ng interpretasyong maaaring magpaliit sa saklaw ng talinghaga.
- issue: Aspekto ng נָתַן sa tiyak na pagpapahayag
  choice: Ibinigay ng Diyos
  alternative: Ibibigay ng Diyos
  rationale: Pinananatili ng anyong naganap ang Hebreong perfect at ang pananaw ng nagsasalita na tiyak na ang pagkakaloob, sa halip na gawing payak na panghinaharap.
- issue: Kasarian sa אִישׁ יִשְׂרָאֵל
  choice: isang lalaking Israelita
  alternative: isang Israelita
  rationale: Tahasan ang panlalaking isahan sa pinagmulan at tumutukoy kay Gideon; kaya hindi ito ginawang walang tiyak na kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pormal na pag-uulit na “sumagot… at sinabi” at ang larawang “tabak” at “sa kamay” dahil mahalaga ang mga ito sa anyo at diwa ng Hebreo; ang huling idyoma ay nilinaw sa talababa.
