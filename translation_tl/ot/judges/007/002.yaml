source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל גִּדְע֔וֹן רַ֗ב הָ/עָם֙ אֲשֶׁ֣ר אִתָּ֔/ךְ מִ/תִּתִּ֥/י אֶת מִדְיָ֖ן בְּ/יָדָ֑/ם פֶּן יִתְפָּאֵ֨ר עָלַ֤/י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יָדִ֖/י הוֹשִׁ֥יעָה לִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Gideon, “Napakarami ng mga taong kasama mo para ibigay ko ang Midian sa kanilang kamay[a]. Baka magmalaki ang Israel laban sa akin at sabihin, ‘Ang sarili kong kamay ang nagligtas sa akin[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanilang mga kamay.” Madalas gamitin sa Hebreo ang isahang “kamay” bilang idyoma para sa kapangyarihan o pamamahala.
    reason: lexical_alternative
  - marker: b
    text: O “nagpalaya sa akin.” Ang pandiwang Hebreo ay maaaring mangahulugang “magligtas” o “magpalaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos ayon sa Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili nito ang karaniwang daloy ng salaysay na ipinahihiwatig ng waw-consecutive.
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: Napakarami ng mga taong kasama mo
  rationale: Ipinahihiwatig ng kasunod na sugnay na hindi lamang marami kundi sobra sa layunin ni Yahweh ang bilang nila.
- source_word: מִתִּתִּי אֶת־מִדְיָן
  choice: para ibigay ko ang Midian
  rationale: Natural na inilalahad sa Tagalog ang kaugnayan ng sobrang dami ng mga tao sa gagawing pagbibigay ni Yahweh sa Midian.
- source_word: בְּיָדָם
  choice: sa kanilang kamay
  rationale: Pinananatili ang isahang 'kamay' bilang Hebreong idyoma para sa kapangyarihan o pamamahala, samantalang ang hulaping panghalip ay maramihan.
- source_word: פֶּן
  choice: Baka
  rationale: Natural na Tagalog ito para sa sugnay na nagsasaad ng negatibong layunin o kinalabasang nais iwasan.
- source_word: יִתְפָּאֵר עָלַי
  choice: magmalaki ... laban sa akin
  rationale: Ipinapahayag nito ang pagpapataas sa sarili na nakatuon laban kay Yahweh, nang hindi pinapahina ang tensiyon ng pahayag.
- source_word: יָדִי
  choice: Ang sarili kong kamay
  rationale: Nililinaw ng 'sarili kong' ang mariing pag-angkin ng Israel sa sariling kapangyarihan.
- source_word: הוֹשִׁיעָה לִּי
  choice: ang nagligtas sa akin
  rationale: Ang pandiwa ay karaniwang nangangahulugang magligtas o magpalaya; ang 'nagligtas' ay malinaw at pinananatili ang teolohikal na kabalintunaan ng pag-angkin ng Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalan
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Pinananatili ang personal na pangalang kinakatawan ng יְהוָה sa halip na palitan ito ng titulo.
- issue: Isahang kolektibong Israel
  choice: magmalaki ang Israel ... ‘Ang sarili kong kamay ang nagligtas sa akin’
  alternative: magmalaki ang mga Israelita ... ‘Ang sarili naming mga kamay ang nagligtas sa amin’
  rationale: Itinuturing ng Hebreo ang Israel bilang isang kolektibong isahan. Pinananatili ng salin ang pananaw at mga panghalip ng pinagmulang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang Yahweh, ang isahang kolektibong pagtukoy sa Israel, at ang idyomang “sa kanilang kamay,” habang ginawang natural sa Tagalog ang negatibong layuning ipinakikilala ng פֶּן.
