id: JDG.7.22
reference: Judges 7:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: tl
  text: Nang hipan ang tatlong daang trumpeta[a], pinagbaling ni Yahweh ang espada ng bawat isa laban sa kaniyang kapuwa sa buong kampo[b]. Tumakas ang hukbo hanggang Beth-shittah[c], patungong Zererah, hanggang sa gilid[d] ng Abel-meholah, malapit sa Tabbath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang tatlong daang sungay na trumpeta.” Ang salitang Hebreo ay tumutukoy sa mga trumpetang yari sa sungay, kadalasan ay sungay ng lalaking tupa.
    reason: lexical_alternative
  - marker: b
    text: O “laban sa kaniyang kapuwa at laban sa buong kampo.” Maaaring idiin ng Hebreo na ang espada ng bawat lalaki ay ibinaling laban sa iba pa sa kampo, o na nangyari ito sa kabuuan ng kampo.
    reason: alternative_reading
  - marker: c
    text: Ang Beth-shittah, Zererah, Abel-meholah, at Tabbath ay mga pangalan ng lugar sa dinaanan ng tumatakas na hukbo.
    reason: cultural_note
  - marker: d
    text: O “pampang” o “hangganan” ng Abel-meholah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... הַשּׁוֹפָרוֹת
  choice: Nang hipan ang tatlong daang trumpeta
  rationale: Ang שׁוֹפָר ay isang trumpetang yari sa sungay, kadalasan ay sungay ng lalaking tupa. Natural sa Filipino ang “trumpeta,” habang inilalahad sa talababa ang mas tiyak na materyal nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos, hindi bilang pamagat, upang mapanatili ang tuwirang paglitaw ng Tetragrammaton sa Hebreo.
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: pinagbaling ... ang espada ng bawat lalaki laban sa kaniyang kasamahan
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma na ang espada ng bawat isa ay ibinaling laban sa kapuwa niya nasa kampo, nang hindi ginagawang mas tahasan kaysa sa teksto ang paraan ng pagkilos ni Yahweh.
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: at sa buong kampo
  rationale: Pinananatili ang posibleng hostile sense ng בְ, ngunit ang talababa ay kumikilala sa alternatibong lokatibong diwa na “sa buong kampo.”
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: Tumakas ang hukbo
  rationale: Bagaman literal ding “kampo” ang מַחֲנֶה, ang tumatakas dito ay ang puwersang militar; “hukbo” ang mas likas at malinaw na Filipino sa pangungusap na ito.
- source_word: צְרֵרָתָה
  choice: patungong Zererah
  rationale: Ipinahihiwatig ng directional ending ang pagkilos patungo sa lugar.
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: gilid ng Abel-meholah
  rationale: Ang שָׂפָה ay literal na labi at maaari ring mangahulugang gilid, pampang, o hangganan. “Gilid” ang malawak na salitang hindi labis na tumutukoy sa isang anyong-lupa.
- source_word: עַל טַבָּת
  choice: malapit sa Tabbath
  rationale: Ang עַל dito ay malamang na nagpapahiwatig ng lokasyong kaugnay o malapit sa Tabbath; pinananatili ng “malapit sa” ang heograpikong diwa nang hindi labis na tinutukoy ang eksaktong ruta.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Pagkilos ni Yahweh sa paglalaban-laban ng hukbo
  choice: pinagbaling ni Yahweh ang espada ng bawat lalaki laban sa kaniyang kasamahan
  alternative: pinaglaban-laban ni Yahweh ang bawat lalaki at ang kaniyang kasamahan
  rationale: Pinananatili ang konkretong larawan at causative force ng Hebreo, ngunit hindi ipinapaliwanag nang higit sa teksto ang mekanismo ng banal na pagkilos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “espada,” “hukbo,” at “kampo” bilang natural na kasalukuyang bokabularyo; pinanatili sa transliterasyon ang mga pangalan ng lugar at ang pangalang Yahweh.
