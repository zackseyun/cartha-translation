  text: וַ/יַּ֛חַץ אֶת שְׁלֹשׁ מֵא֥וֹת הָ/אִ֖ישׁ שְׁלֹשָׁ֣ה רָאשִׁ֑ים וַ/יִּתֵּ֨ן שׁוֹפָר֤וֹת בְּ/יַד כֻּלָּ/ם֙ וְ/כַדִּ֣ים רֵקִ֔ים וְ/לַפִּדִ֖ים בְּ/ת֥וֹךְ הַ/כַּדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/016.yaml
  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: tl
  text: Pagkatapos, hinati niya ang tatlong daang lalaki sa tatlong pangkat[a]. Binigyan niya ang bawat isa sa kanila ng tambuli[b], isang sisidlang walang laman[c], at isang sulo sa loob ng sisidlan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tatlong ulo,” isang idyomang nangangahulugang tatlong pangkat o dibisyon.
    reason: lexical_alternative
  - marker: b
    text: Ang mga tambuli ay mga sungay na hinihipan bilang hudyat.
    reason: lexical_alternative
  - marker: c
    text: O “isang bangang walang laman” o “isang pitsel na walang laman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: hinati
  rationale: Tumutukoy ang pandiwa sa paghahati ng hukbo sa magkakahiwalay na pangkat; natural at tuwiran ang “hinati” sa modernong Filipino.
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: ang tatlong daang lalaki
  rationale: Pinananatili nito ang tahasang bilang at ang literal na kahulugan ng אִישׁ nang hindi idinaragdag ang mas interpretibong “mga sundalo.”
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: tatlong pangkat
  rationale: Literal itong “tatlong ulo,” ngunit idyoma rito ang רָאשִׁים para sa mga pangkat o dibisyon. Malinaw at natural ang “tatlong pangkat.”
- source_word: וַיִּתֵּן ... בְּיַד כֻּלָּם
  choice: Binigyan niya ang bawat isa sa kanila
  rationale: Ipinahahayag ng parirala ang pamamahagi sa lahat nang paisa-isa. Mas natural ito sa Filipino kaysa sa literal na “inilagay sa kamay nilang lahat,” habang nananatili ang distributibong diwa.
- source_word: שׁוֹפָרוֹת
  choice: tambuli
  rationale: Ang שׁוֹפָר ay isang sungay na ginagamit bilang hudyat. Ang “tambuli” ay isang likas at dignidad na katawagang Filipino para sa instrumentong hinihipan bilang hudyat.
- source_word: כַדִּים רֵקִים
  choice: sisidlang walang laman
  rationale: Maaaring banga o pitsel ang כַּד. Pinananatili ng pangkalahatang “sisidlan” ang leksikal na saklaw, at tahasang isinasalin ang רֵקִים bilang “walang laman.”
- source_word: לַפִּדִים
  choice: sulo
  rationale: Ang לַפִּיד ay sulo o nagliliyab na pananglaw; “sulo” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: בְּתוֹךְ הַכַּדִּים
  choice: sa loob ng sisidlan
  rationale: Tuwirang ipinahahayag nito na nasa loob ng mga sisidlan ang mga sulo, na siyang lokasyong tinutukoy ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at dignidad ang ginamit. Pinili ang “pangkat” para sa idyomang militar nang hindi nagpapahiwatig ng tiyak na laki ng yunit. Ginamit ang isahan sa mga ipinamahaging kagamitan pagkatapos ng “bawat isa” upang malinaw na bawat lalaki ay tumanggap ng tig-iisa.
