  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: tl
  text: Ang bilang ng mga humimod ng tubig habang itinataas nila ang kanilang kamay sa kanilang bibig ay tatlong daang lalaki[a]; ngunit ang lahat ng iba pang tao ay lumuhod upang uminom ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na may kanilang kamay sa kanilang bibig.” Binibigyang-diin ng pariralang Hebreo na iniangat nila ang kanilang kamay tungo sa kanilang bibig, sa halip na lumuhod upang tuwirang uminom.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: Ang bilang ng
  rationale: Tuwirang ipinakikilala ang kabuuang dami ng isang pangkat sa natural na modernong Tagalog.
- source_word: הַמֲלַקְקִים
  choice: mga humimod ng tubig
  rationale: Pinananatili ng “humimod” ang matingkad na larawang ipinahihiwatig ng pandiwang לקק; idinagdag ang “tubig” bilang likas na layon sa Tagalog at malinaw ito sa konteksto.
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: mula sa kanilang kamay patungo sa kanilang bibig
  rationale: Ipinakikita ang galaw ng tubig na iniaahon sa kamay tungo sa bibig at pinananatili ang distributibong isahan ng Hebreo.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: tatlong daang lalaki
  rationale: Ang “lalaki” ay angkop sa kontekstong militar at tumpak sa gamit ng אִישׁ pagkatapos ng bilang.
- source_word: וְכֹל יֶתֶר הָעָם
  choice: ngunit ang lahat ng natira sa bayan
  rationale: Ginagawang malinaw ng “ngunit” ang paghahambing ng tatlong daan sa nalalabing pangkat; ang “bayan” ay karaniwang salin ng עָם para sa sama-samang mga tao.
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: lumuhod
  rationale: Likas at sapat na naihahayag ng “lumuhod” ang postura; hindi na kailangang ulitin ang “sa kanilang mga tuhod,” na magiging labis sa Tagalog.
- source_word: לִשְׁתּוֹת מָיִם
  choice: upang uminom ng tubig
  rationale: Pinananatili ang layuning ipinahihiwatig ng infinitibo at ang tahasang pagbanggit sa tubig.
