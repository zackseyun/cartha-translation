  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “humimod” upang mapanatili ang kongkretong larawan ng orihinal, at “lumuhod” bilang likas na katumbas ng buong pariralang tumutukoy sa pagluhod sa mga tuhod.
