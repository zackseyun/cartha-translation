base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: tl
  text: Kapag hihip ako at ang lahat ng kasama ko sa tambuli[a], hipan din ninyo ang mga tambuli sa palibot ng buong kampo, at sabihin ninyo, “Para kay Yahweh at para kay Gideon!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong שׁוֹפָר (shofar) ay isang tambuling karaniwang yari sa sungay ng hayop, madalas sa sungay ng lalaking tupa, at hindi isang metal na trumpeta.
    reason: cultural_note
  - marker: b
    text: Madalas na mabasa sa ilang tradisyonal na salin, “Ang tabak ni Yahweh at ni Gideon,” dahil sa kahawig na pananalita sa Hukom 7:20. Ngunit ang Hebreo ng talatang ito ay nagsasabi lamang, “Para kay Yahweh at para kay Gideon.”
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: humip / hipan
  rationale: Kapag kasama ang שׁוֹפָר, ang תּקע ay tumutukoy sa pag-ihip o pagpapatunog ng tambuli. Ang “humip” at “hipan” ang likas na anyo sa modernong Filipino at malinaw na naghahayag ng kongkretong kilos.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: tambuli / mga tambuli
  rationale: Ang שׁוֹפָר ay instrumentong hinihipan na yari karaniwan sa sungay ng hayop, madalas sa sungay ng lalaking tupa, at hindi metal na trumpeta. Ang “tambuli” ay natural at madaling maunawaang salin sa Filipino; nililinaw ng talababa ang materyal at kulturang pinagmulan nito.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: ako at ang lahat ng kasama ko
  rationale: Tuwirang pinananatili nito ang pagbanggit ni Gideon sa sarili at sa buong pangkat na kasama niya, sa natural na ayos ng Filipino.
- source_word: גַּם אַתֶּם
  choice: din ninyo
  rationale: 'Ipinahahayag ng “din” ang inklusibong diin ng גַּם: pagkatapos ng pangkat ni Gideon, sila rin ay dapat humip.'
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: sa palibot ng buong kampo
  rationale: Pinananatili nito kapwa ang ideya ng pag-ikot o pagkubkob sa סְבִיבוֹת at ang kabuuang saklaw ng כָּל.
- source_word: וַאֲמַרְתֶּם
  choice: at sabihin ninyo
  rationale: Karaniwang pandiwa para sa “sabihin” ang אָמַר. Bagaman malamang na malakas ang pagbigkas sa konteksto ng labanan, hindi tahasang sinasabi ng Hebreo na “sumigaw,” kaya hindi idinagdag ang tindi.
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: Para kay Yahweh at para kay Gideon
  rationale: Ang לְ ay nauunawaan bilang panawagan ng pagkampi o pagtatalaga—“para kay”—at inuulit sa dalawang pangalan. Pinananatili rin ang tipanang pangalan na יהוה bilang “Yahweh.”
theological_decisions:
- issue: Ang anyo ng sigaw na לַיהוָה וּלְגִדְעוֹן
  choice: Para kay Yahweh at para kay Gideon!
  alternative: Ang tabak ni Yahweh at ni Gideon!
  rationale: Walang salitang “tabak” sa Hebreo ng talatang ito. Ang mas mahabang anyo ay naiimpluwensiyahan ng Hukom 7:20; pinananatili rito ang mismong maikli at maaaring kapansin-pansing pahayag ng 7:18.
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang teksto ay tuwirang gumagamit ng Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa anyo nito bilang natatanging tipanang pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tambuli” bilang pamilyar na terminong biblikal ngunit nilinaw sa talababa. Pinanatili ang payak na “sabihin” sa halip na dagdagan ng “sumigaw,” at iningatan ang pag-uulit ng “para kay” sa sigaw.
