  text: But if you are afraid to go down[a], go down to the camp with Purah your servant.
translation:
  language: tl
  text: Ngunit kung natatakot kang bumaba, bumaba ka sa kampo kasama si Pura, na iyong lingkod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “lingkod” ay maaari ring mangahulugang “binata” o “alalay,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita nito ang pasubaling may bahagyang pagsalungat sa naunang utos; natural ito sa makabagong Tagalog.
- source_word: יָרֵא אַתָּה
  choice: natatakot ka
  rationale: Tuwirang inilalarawan ang kalagayan ni Gideon sa karaniwang makabagong pananalita.
- source_word: לָרֶדֶת ... רֵד
  choice: bumaba ... bumaba ka
  rationale: Pinananatili ang pag-uulit ng pandiwang ירד, na nagbibigay-diin sa utos.
- source_word: וּפֻרָה
  choice: kasama si Pura
  rationale: Sa konteksto, ang waw ay nagpapahiwatig na sasamahan si Gideon ni Pura; mas malinaw at natural ang 'kasama' kaysa sa literal na 'at.'
- source_word: נַעַרְךָ
  choice: iyong lingkod
  rationale: Sa kontekstong militar at personal na paglilingkod, natural ang 'lingkod,' ngunit maaaring tumukoy ang נַעַר sa isang binata o alalay; pinananatili sa talababa ang saklaw na ito.
- source_word: אֶל הַמַּחֲנֶה
  choice: sa kampo
  rationale: Likas na salin ito ng pagpunta patungo sa kampo nang hindi ipinapalagay na ang diin ay ang pagpasok sa loob nito.
