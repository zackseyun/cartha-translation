  to: 'Sinabi niya sa kanila, “Masdan ninyo ako at gayon din ang gawin ninyo.[a] Tandaan ninyo: kapag dumating ako sa gilid ng kampo, kung ano ang gawin ko, gayon din ang gawin ninyo.”'
