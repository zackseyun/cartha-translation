  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: tl
  text: 'Sinabi niya sa kanila, “Masdan ninyo ako at gayon din ang gawin ninyo.[a] Tandaan ninyo: kapag dumating ako sa gilid ng kampo, kung ano ang gawin ko, gayon din ang gawin ninyo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tingnan ninyo ako at gawin din ninyo ang gayon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: Tingnan ninyo ako
  rationale: Sa kontekstong ito ng pagbibigay ng tagubilin, ang parirala ay nangangahulugang pagmasdan si Gideon bilang huwaran na tutularan. Likas at malinaw sa modernong Tagalog ang “Tingnan ninyo ako.”
- source_word: וְכֵן תַּעֲשׂוּ
  choice: at gawin din ninyo ang gagawin ko
  rationale: Ang כֵן ay tumutukoy sa kaparaanan o pagkakatulad. Nilinaw ng “ang gagawin ko” ang likas na ipinahihiwatig na pagtulad nang hindi nagdaragdag ng bagong diwa.
- source_word: וְהִנֵּה
  choice: Pagdating ko
  rationale: Ang הִנֵּה ay pantawag-pansin, ngunit sa Tagalog ay magiging pilit ang literal na “Masdan ninyo” sa loob ng pangungusap. Naipahihiwatig ng tuwirang ayos ang diin at napipintong kilos.
- source_word: אָנֹכִי בָא
  choice: Pagdating ko
  rationale: Ang participle בָא ay nagpapahayag ng napipinto o nagpapatuloy na paglapit. Ang “pagdating ko” ay natural sa tagubilin at umaangkop sa kasunod na pangyayari.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: sa gilid ng kampo
  rationale: Ang קָצֶה ay tumutukoy sa dulo o panlabas na hangganan; “gilid ng kampo” ang pinakamaikli at natural na katumbas dito.
- source_word: וְהָיָה כַאֲשֶׁר
  choice: kung ano ang
  rationale: Ipinakikilala ng konstruksyon ang kilos ni Gideon na magiging huwaran. Natural sa Tagalog ang “kung ano ang gagawin ko” at pinananatili nito ang ugnayang pangyayari at pagtulad.
- source_word: אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: kung ano ang gagawin ko, iyon din ang gawin ninyo
  rationale: Pinananatili ng pormulang “kung ano... iyon din” ang malinaw na pagtutulad at ang puwersa ng utos sa huling pandiwa.
