translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pasalita ang daloy. Ginamit ang pangmaramihang “ninyo” ayon sa kausap na pangkat. Iniwasan ang makalumang literal na katumbas ng הִנֵּה dahil magiging hindi natural, habang pinanatili ang madalian at huwarang katangian ng utos.
