    rationale: Ang unang וְכֵן תַּעֲשׂוּ ay simpleng “gayon/ganito rin ang gawin ninyo.” Ang “kung ano ang gawin ko” ay lumilitaw sa huling bahagi ng talata at dapat panatilihing doon upang maingatan ang estruktura at pag-uulit ng pinagmulan.
  - severity: low
    issue: Hindi naipahayag ang pantawag-pansing וְהִנֵּה.
    rationale: Bagaman maaaring hindi literal na isalin ang partikula, ligtas at natural na katawanin ang diin nito sa “Tandaan ninyo:” bago ang susunod na tagubilin.
