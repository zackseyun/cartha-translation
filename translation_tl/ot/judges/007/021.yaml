  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: tl
  text: At tumayo ang bawat isa sa kanyang puwesto sa palibot ng kampo; nagtakbuhan ang buong kampo, nagsigawan sila, at tumakas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumalahaw sila at tumakas.” Ang pandiwang isinaling “nagsigawan” ay maaaring tumukoy sa malakas na sigaw sa labanan o dahil sa pagkataranta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: Nanatili
  rationale: Ang עמד ay maaaring mangahulugang tumayo o manatili sa kinatatayuan. Sa konteksto, malinaw na hindi umalis sa kani-kanilang puwesto ang mga tauhan ni Gideon; natural itong ipinapahayag ng “nanatili.”
- source_word: אִישׁ תַּחְתָּיו
  choice: ang bawat isa sa puwesto niya
  rationale: Ang idyoma ay distributibo at tumutukoy sa bawat taong nasa sarili niyang takdang lugar. Iniiwasan ng saling ito ang literal ngunit malabong “sa ilalim niya.”
- source_word: סָבִיב לַמַּחֲנֶה
  choice: sa palibot ng kampo
  rationale: Tuwirang ipinapahayag nito ang kanilang posisyon sa lahat ng panig ng kampo.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: nagtakbuhan ang buong kampo
  rationale: Ang רוץ ay “tumakbo.” Ang “nagtakbuhan” ay likas sa Filipino para sa magulong kilos ng maraming tao, nang hindi tahasang dinaragdagan ang sanhi o direksiyon.
- source_word: וַיָּרִיעוּ
  choice: nagsigawan sila
  rationale: Ang pandiwa ay tumutukoy sa malakas na pagsigaw at maaaring maging sigaw sa labanan o sigaw dahil sa pagkataranta. Pinananatili ng “nagsigawan” ang lawak na ito.
- source_word: ויניסו
  choice: tumakas
  rationale: Ang נוס ay karaniwang nangangahulugang tumakas o lumikas dahil sa panganib; “tumakas” ang malinaw at natural na katumbas.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “bawat isa” sa halip na “bawat lalaki” sapagkat malinaw sa konteksto na mga mandirigma ang tinutukoy, at mas natural ito sa kasalukuyang Tagalog. Ang “Samantala” ay nagpapalinaw sa paghahambing ng pananatili ng mga tauhan ni Gideon at ng pagtakbo ng kampo nang hindi nagdaragdag ng teolohikal na paliwanag.
