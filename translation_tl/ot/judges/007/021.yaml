  naturalness: Natural at malinaw ang karamihan ng draft. Mas tuwiran at mas angkop sa magkakasunod na pandiwang Hebreo ang pag-uugnay gamit ang “At” at tuldok-kuwit kaysa hatiing pangungusap na may “Samantala.”
  terminology: Ang “kampo” ay angkop para sa מַחֲנֶה. Ang “paghiyaw” bilang alternatibo sa “nagsigawan” ay pinananatili sa talababa upang hindi ikulong ang kahulugan sa alinman sa sigaw-pandigma o sigaw ng pagkataranta.
