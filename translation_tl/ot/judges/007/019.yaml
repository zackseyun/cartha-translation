base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: tl
  text: Dumating si Gideon at ang isandaang lalaking kasama niya sa gilid ng kampo, sa pasimula ng gitnang pagbabantay sa gabi[a], noong kakatatalaga pa lamang ng mga bantay[b]. Hinipan nila ang mga tambuli[c] at binasag ang mga bangang hawak nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gitnang pagbabantay sa gabi” o “ikalawang pagbabantay.” Tumutukoy ang Hebreo sa isang takdang hati ng gabi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “noong kapopuwesto pa lamang ng mga bantay” o “noong kakatakda pa lamang ng mga guwardiya.” Binibigyang-diin ng Hebreong konstruksyon ang pagkakatalaga ng mga bantay.
    reason: lexical_alternative
  - marker: c
    text: 'Hebreo: shofarot, mga sungay na hinihipan bilang hudyat; tradisyonal ding isinasaling “mga trumpeta.”'
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: sa gilid ng kampo
  rationale: Ang קָצֶה ay tumutukoy sa dulo o hangganan. Likas sa Filipino ang “sa gilid ng kampo” at hindi nito pinalalawak ang heograpikong diwa.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: sa simula ng kalagitnaang pagbabantay sa gabi
  rationale: Idyomatikong tumutukoy ang רֹאשׁ sa simula, at ang אַשְׁמֹרֶת ay isang takdang hati ng gabi para sa pagbabantay. Pinananatili ng “kalagitnaan” ang paglalarawan ng Hebrew nang hindi tiyak na tinatawag itong ikalawang hati.
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים
  choice: nang kapapalit pa lamang ng mga bantay
  rationale: Sa konteksto, ang Hiphil ng קום kasama ng infinitive absolute ay nagdiriin sa pagkakatalaga o pagpupuwesto sa mga bantay, at ang אַךְ ay nagpapahiwatig ng kagyat na tiyempo. Ang “kapapalit pa lamang” ay natural na Filipino para sa pagsisimula ng bagong duty ng mga bantay.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: Hinipan nila ang mga tambuli
  rationale: Ang שׁוֹפָר ay sungay na hinihipan bilang hudyat. Ang “tambuli” ang malinaw at tradisyonal ngunit nauunawaang katumbas sa Filipino, at mas tiyak kaysa pangkalahatang “trumpeta.”
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: at binasag ang mga banga
  rationale: Ang pandiwa ay nagpapahayag ng marahas na pagbasag, at ang כַּד ay banga o sisidlan. Natural at tuwiran ang “binasag ang mga banga.”
- source_word: אֲשֶׁר בְּיָדָם
  choice: na hawak nila
  rationale: Natural na ipinahahayag sa modernong Filipino ng “na hawak nila” ang literal na “nasa kanilang mga kamay,” nang walang dagdag na interpretasyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapapalit pa lamang ng mga bantay” upang natural na ipahayag ang mariing Hebreong konstruksyon at ang agarang tiyempo; iniwasan ang teknikal o makalumang pananalita maliban sa “tambuli,” na angkop sa sinaunang kasangkapang pansenyas.
