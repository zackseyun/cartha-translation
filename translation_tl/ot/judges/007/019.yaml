  source_fidelity: Kailangang iwasto ang “kapapalit pa lamang ng mga bantay.” Ang Hebreong הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים ay tumutukoy sa pagkakatalaga o pagpupuwesto ng mga bantay, hindi hayagang sa pagpapalitan o pagre-relieve sa kanila. Ang pagbibigay-diin ng infinitive absolute at ng אַךְ ay maipahahayag sa “kakatatalaga pa lamang.”
  naturalness: Malinaw at angkop sa modernong Filipino ang karamihan ng draft. Mas natural at mas tumpak ang “sa pasimula ng gitnang pagbabantay sa gabi” kaysa “sa simula ng kalagitnaang pagbabantay sa gabi.” Ang “tambuli” ay nauunawaan sa rehistrong biblikal, ngunit dapat linawin sa talababa na shofar ito, isang sungay na pantawag.
  terminology: Pinananatili ang “Gideon,” “kampo,” “mga bantay,” “tambuli,” at “mga banga.” Ang “tambuli” ay katanggap-tanggap na pantumbas ng shofar kapag may paliwanag; hindi ipinipilit na ang materyal nito ay sungay ng tupa, sapagkat hindi ito tahasang tinukoy sa talata.
