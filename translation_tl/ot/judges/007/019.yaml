revisions:
- from: Kaya dumating si Gideon at ang isandaang lalaking kasama niya sa gilid ng kampo sa simula ng kalagitnaang pagbabantay sa gabi[a], nang kapapalit pa lamang ng mga bantay. Hinipan nila ang mga tambuli[b] at binasag ang mga banga na hawak nila.
  to: Dumating si Gideon at ang isandaang lalaking kasama niya sa gilid ng kampo, sa pasimula ng gitnang pagbabantay sa gabi[a], noong kakatatalaga pa lamang ng mga bantay[b]. Hinipan nila ang mga tambuli[c] at binasag ang mga bangang hawak nila.
  rationale: Inalis ang pahiwatig na nagpapalitan ang mga bantay at pinalitan ito ng pananalitang tuwirang nagsasaad ng kanilang bagong pagkakatalaga. Inayos din ang katawagan sa oras ng pagbabantay at idinagdag ang nawawalang talababa para sa Hebreong idiom at angkla para sa shofarot.
