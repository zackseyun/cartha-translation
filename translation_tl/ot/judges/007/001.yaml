revisions:
- from: Kinaumagahan, maagang bumangon si Jerubaal—siya rin si Gideon—kasama ang buong bayang kasama niya, at nagkampo sila sa tabi ng bukal ng Harod.[a] Ang kampo ng Midian ay nasa hilaga niya, malapit sa burol ng More sa libis.
  to: Maagang bumangon si Jerubaal—siya rin si Gideon—at ang buong bayang kasama niya, at nagkampo sila sa tabi ng bukal ng Harod.[a] Ang kampo ng Midian ay nasa hilaga niya, malapit sa burol ng More sa libis.
  rationale: Inalis ang “Kinaumagahan” upang hindi magdagdag ng pagkakasunod na araw na wala sa Hebreo. Inayos ang sugnay tungkol sa bayan upang maging mas natural ang Tagalog habang pinananatili ang kahulugang sina Jerubaal at ang buong bayang kasama niya ang maagang bumangon at nagkampo. Ginawang “En-Harod” ang baybay sa talababa bilang pangalan ng lugar.
