base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: tl
  text: Maagang bumangon si Jerubaal—siya rin si Gideon—at ang buong bayang kasama niya, at nagkampo sila sa tabi ng bukal ng Harod.[a] Ang kampo ng Midian ay nasa hilaga niya, malapit sa burol ng More sa libis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tabi ng En-Harod.” Ang Hebreong pangalan ay literal na may salitang nangangahulugang “bukal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: Kinaumagahan, maagang bumangon
  rationale: Ipinahahayag ng Hiphil ng שׁכם ang maagang pagbangon. Ang parirala ay natural sa salaysay na Tagalog at pinananatili ang temporal na diwa.
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: si Jerubaal—siya rin si Gideon—
  rationale: Tinutukoy ng appositional na הוּא na iisang tao sina Jerubaal at Gideon. Ang gitling na paliwanag ay malinaw at pinananatili ang dalawang pangalan.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: kasama ang buong bayang kasama niya
  rationale: Pinananatili ang malawak na kahulugan ng עָם bilang “bayan” sa halip na gawing tahasang “mga kawal,” bagaman militar ang konteksto.
- source_word: וַיַּחֲנוּ
  choice: nagkampo sila
  rationale: Tuwirang modernong katumbas ng חנה at malinaw na tumutukoy sa pangkat.
- source_word: עַל עֵין חֲרֹד
  choice: sa tabi ng bukal ng Harod
  rationale: Ang עֵין ay nangangahulugang bukal at maaari ring bahagi ng pangalan ng lugar. Isinasalin ang kahulugan habang pinananatili ang Harod; inilalahad sa talababa ang alternatibong anyo ng pangalan.
- source_word: וּמַחֲנֵה מִדְיָן
  choice: Ang kampo ng Midian
  rationale: Tuwirang pinananatili ang construct phrase at hindi ginagawang mas tiyak na “kampo ng mga Midianita.”
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: ay nasa hilaga niya
  rationale: Pinananatili ang isahang hulaping לוֹ, na malamang ay tumutukoy kay Gideon bilang pinuno, sa halip na pakinisin bilang maramihang “nila.”
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: malapit sa burol ng More
  rationale: Sa topograpikong paglalarawan, ang מן ay nauunawaang lokatibo. Ang “malapit sa” ay natural sa Tagalog nang hindi ipinapalagay na paglayo mula sa burol.
- source_word: בָּעֵמֶק
  choice: sa libis
  rationale: Ang עֵמֶק ay karaniwang tumutukoy sa lambak o libis; ang “libis” ay maikli, dignified, at angkop sa heograpikong paglalarawan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw at marangal. Pinanatili ang “bayan” para sa עָם at ang isahang “niya” para sa לוֹ, upang hindi gawing mas tiyak o pakinisin ang Hebreo. Ginamit ang karaniwang baybay na “Jerubaal” at “More” ayon sa bigkas na angkop sa Tagalog.
