    issue: Ang ‘Kapag sinabi ko’ ay hindi wastong naghahatid ng pambungad na וְהָיָה.
    rationale: Hindi simpleng ‘when/kapag’ na pangyayaring temporal ang Hebreo, kundi isang pormulang nagtatakda ng mangyayari kasunod ng pagsubok. Ang rebisyon ay pinananatili ang lohika at pag-uulit ng teksto nang hindi nagdaragdag ng kondisyon.
  revised_text: Sinabi pa ng PANGINOON kay Gideon, “Napakarami pa rin ng mga tao. Dalhin mo sila pababa sa tubig, at doon ay susubukin ko sila para sa iyo. At mangyayari na, ang taong sasabihin ko sa iyo, ‘Ito ang sasama sa iyo,’ ay sasama sa iyo; ngunit ang bawat taong sasabihin ko sa iyo, ‘Ito ay hindi sasama sa iyo,’ ay hindi sasama.”
