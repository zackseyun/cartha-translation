revisions:
- from: Sinabi pa ng PANGINOON kay Gideon, “Napakarami pa rin ng mga tao. Dalhin mo sila pababa sa tubig, at doon ay susubukin ko sila para sa iyo. Kapag sinabi ko sa iyo tungkol sa isa, ‘Ito ang sasama sa iyo,’ sasama siya sa iyo. Ngunit kapag sinabi ko sa iyo tungkol sa isa, ‘Hindi ito sasama sa iyo,’ hindi siya sasama.”
  to: Sinabi pa ng PANGINOON kay Gideon, “Napakarami pa rin ng mga tao. Dalhin mo sila pababa sa tubig, at doon ay susubukin ko sila para sa iyo. At mangyayari na, ang taong sasabihin ko sa iyo, ‘Ito ang sasama sa iyo,’ ay sasama sa iyo; ngunit ang bawat taong sasabihin ko sa iyo, ‘Ito ay hindi sasama sa iyo,’ ay hindi sasama.”
  rationale: Pinalitan ang dalawang ‘Kapag sinabi ko’ upang maipakita ang pambungad na ‘At mangyayari na’ ng Hebreo at ang kasunod na opisyal na pagtatalaga kung sino ang sasama o hindi sasama. Pinanatili ang kahulugan, pag-uulit, at hindi tinukoy na pamantayan ng pagsubok.
