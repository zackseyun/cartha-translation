base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: tl
  text: Sinabi pa ng PANGINOON kay Gideon, “Napakarami pa rin ng mga tao. Dalhin mo sila pababa sa tubig, at doon ay susubukin ko sila para sa iyo. At mangyayari na, ang taong sasabihin ko sa iyo, ‘Ito ang sasama sa iyo,’ ay sasama sa iyo; ngunit ang bawat taong sasabihin ko sa iyo, ‘Ito ay hindi sasama sa iyo,’ ay hindi sasama.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginamit ang nakaugaliang saling Tagalog para sa banal na pangalan, na nakasulat sa malalaking titik upang maipahiwatig ang tetragrammaton.
- source_word: עוֹד הָעָם רָב
  choice: Napakarami pa rin ng mga tao
  rationale: Pinananatili ng “pa rin” ang עוֹד at ipinapahayag ng “napakarami” ang kontekstuwal na diwang higit pa sa kinakailangang bilang.
- source_word: הוֹרֵד אוֹתָם אֶל־הַמַּיִם
  choice: Dalhin mo sila pababa sa tubig
  rationale: Tuwirang pinananatili ang kilos na pababa at ang patutunguhang tubig.
- source_word: וְאֶצְרְפֶנּוּ לְךָ שָׁם
  choice: at doon ay susubukin ko sila para sa iyo
  rationale: Ang צרף ay literal na magdalisay o magsuri gaya ng metal; sa konteksto, natural na “susubukin” ang diwa ng pagpili, habang ang “para sa iyo” ay nagpapanatili sa לְךָ.
- source_word: זֶה יֵלֵךְ אִתָּךְ
  choice: Ito ang sasama sa iyo
  rationale: Natural na Filipino para sa pagtukoy sa indibidwal na pinahihintulutang sumama kay Gideon.
- source_word: זֶה לֹא יֵלֵךְ עִמָּךְ
  choice: Hindi ito sasama sa iyo
  rationale: Pinananatili ang tahasang negatibong pahayag at ang parallelism ng Hebreo.
theological_decisions:
- issue: Paglalahad sa Diyos bilang siyang sumusubok at pumipili
  choice: “susubukin ko sila para sa iyo”
  alternative: “sasalain ko sila para sa iyo”
  rationale: Ang “susubukin” ay nagpapanatili sa aktibong papel ng PANGINOON nang hindi paunang nililinaw kung anong eksaktong pamantayan ang gagamitin; ang “sasalain” ay mas madaling magpahiwatig ng tiyak na paraan ng pagpili.
translation_notes:
  register: Modernong Filipino na dignidad ang tono. Ginamit ang “mga tao” para sa pangkat ng mga mandirigma, at pinanatili ang paulit-ulit na balangkas ng sinabi ng PANGINOON, ngunit inayos sa natural na sintaks ng Tagalog.
