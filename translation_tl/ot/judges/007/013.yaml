base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: tl
  text: 'Pagdating ni Gideon, nakita niyang may isang lalaking nagkukuwento ng panaginip sa kasama nito. Sinabi ng lalaki, “May napanaginipan ako: isang bilog na tinapay na sebada[a] ay gumugulong-gulong sa kampo ng Midian. Umabot iyon sa tolda at hinampas ito kaya natumba. Itinaob nito ang tolda, at bumagsak ang tolda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang bibingkang sebada” o “isang tinapay na sebada.” Bihira ang salitang Hebreo, at malamang na tumutukoy sa isang bilog na bibingka o tinapay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גִדְעוֹן וְהִנֵּה
  choice: Pagdating ni Gideon, nakita niyang
  rationale: Isinasalin ang pagsulong ng salaysay at ang biglang pagpapansin ng וְהִנֵּה sa natural na Tagalog nang hindi nawawala ang pagiging buhay ng tagpo.
- source_word: מְסַפֵּר לְרֵעֵהוּ חֲלוֹם
  choice: nagkukuwento ng panaginip sa kasama nito
  rationale: Ipinakikita ng “nagkukuwento” ang nagpapatuloy na kilos; ang “kasama” ay angkop sa kontekstong militar at hindi nagpapahiwatig ng higit na matalik na ugnayan.
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: May napanaginipan ako
  rationale: Natural na pahayag ito sa modernong Tagalog at pinananatili ang mariing pagpapakilala sa panaginip, bagaman hindi ginagaya ang di-likas na pag-uulit ng magkaugnay na salita sa Hebreo.
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: isang bilog na tinapay na sebada
  rationale: Ang bihirang צלול ay malamang na tumutukoy sa bilog na tinapay o bibingka; pinananatili sa talababa ang kawalan ng katiyakan.
- source_word: מִתְהַפֵּךְ בְּמַחֲנֵה מִדְיָן
  choice: pagulong-gulong sa kampo ng Midian
  rationale: Ipinahihiwatig ng hitpael ang paulit-ulit na pag-ikot o paggulong. Pinananatili ng “sa kampo” ang karaniwang diwa ng בְּ nang hindi tahasang ginagawang “papasok.”
- source_word: וַיָּבֹא עַד הָאֹהֶל
  choice: Umabot iyon sa tolda
  rationale: Ipinapahayag ng עַד ang pagdating hanggang sa isang hantungan; natural itong naihahatid ng “umabot ... sa.”
- source_word: וַיַּכֵּהוּ וַיִּפֹּל
  choice: hinampas ito kaya natumba
  rationale: Ang “hinampas” ay sapat na malakas para sa וַיַּכֵּהוּ, at ang “natumba” ay angkop sa pagkabuwal ng tolda dahil sa tama.
- source_word: וַיַּהַפְּכֵהוּ לְמַעְלָה וְנָפַל הָאֹהֶל
  choice: Itinaob iyon ng tinapay, at bumagsak ang tolda
  rationale: Pinananatiling tinapay ang likas na simuno ng pandiwa at ginagawang malinaw ang tinutukoy ng mga panghalip sa Tagalog. Isinasalin nang hiwalay ang huling tahasang pagbanggit sa tolda.
