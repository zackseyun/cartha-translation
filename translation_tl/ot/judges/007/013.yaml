  register: Modernong Filipino Tagalog na malinaw at marangal ang ginamit. Iniwasan ang lipas na “masdan” at ang di-likas na “nanaginip ako ng panaginip,” habang pinanatili ang masiglang takbo at kakaibang larawan ng panaginip.
