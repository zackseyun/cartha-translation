revisions:
- from: 'Pagdating ni Gideon, nakita niyang may isang lalaking nagkukuwento ng panaginip sa kasama nito. Sinabi ng lalaki, “May napanaginipan ako: isang bilog na tinapay na sebada[a] ang pagulong-gulong sa kampo ng Midian. Umabot iyon sa tolda at hinampas ito kaya natumba. Itinaob iyon ng tinapay, at bumagsak ang tolda.”'
  to: 'Pagdating ni Gideon, nakita niyang may isang lalaking nagkukuwento ng panaginip sa kasama nito. Sinabi ng lalaki, “May napanaginipan ako: isang bilog na tinapay na sebada[a] ay gumugulong-gulong sa kampo ng Midian. Umabot iyon sa tolda at hinampas ito kaya natumba. Itinaob nito ang tolda, at bumagsak ang tolda.”'
  rationale: Inayos ang pandiwang naglalarawan sa paggulong ng tinapay at ginawang malinaw na ang tinapay ang nagtaob sa tolda. Pinanatili ang magkahiwalay na “natumba” at “bumagsak,” gaya ng magkahiwalay na pandiwa sa Hebreo, pati ang huling tahasang pagbanggit sa tolda.
