translation_notes:
  register: Gumamit ng natural at marangal na modernong Filipino. Pinanatili ang mga pangalang Neftali, Aser, Manases, at Midian sa karaniwang anyong biblikal sa Tagalog. Ang pangunahing teksto ay malinaw ngunit ang tunay na leksikal na alinlangan sa וַיִּצָּעֵק ay pinanatili sa talababa.
