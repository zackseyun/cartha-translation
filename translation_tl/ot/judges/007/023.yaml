  text: וַ/יִּצָּעֵ֧ק אִֽישׁ יִשְׂרָאֵ֛ל מִ/נַּפְתָּלִ֥י וּ/מִן אָשֵׁ֖ר וּ/מִן כָּל מְנַשֶּׁ֑ה וַֽ/יִּרְדְּפ֖וּ אַחֲרֵ֥י מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: tl
  text: Tinawag na magtipon[a] ang kalalakihan ng Israel[b] mula sa Neftali, mula sa Aser, at mula sa buong Manases, at hinabol nila ang Midian[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinipon,” “ipinatawag,” o, mas literal, “napasigaw.” Mahirap tiyakin ang pandiwang Hebreo rito; sa konteksto, tumutukoy ito sa pagtawag at pagtitipon sa Israel para sa pagtugis.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang lalaki ng Israel,” isang kolektibong pananalita na nangangahulugang “ang kalalakihan ng Israel” o “ang mga Israelita.”
    reason: lexical_alternative
  - marker: c
    text: Ang “Midian” ay tumutukoy rito sa mga hukbo o tauhan ng Midian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: Tinawag na magtipon
  rationale: Ang anyong Niphal ng צעק ay mahirap tiyakin dito. Sa konteksto ng pagtugis, tumutukoy ito sa pagtawag o pagtitipon sa mga Israelita. Pinananatili ng saling ito ang diwa ng pagtawag habang nililinaw sa natural na Tagalog na sila ay nagtipon.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ang kalalakihan ng Israel
  rationale: Bagaman isahan ang anyo ng אִישׁ, kolektibo ang gamit nito rito, gaya ng pinatutunayan ng kasunod na pandiwang maramihan. Pinananatili ng “kalalakihan” ang panlalaking pagtukoy ng Hebreo.
- source_word: מִנַּפְתָּלִי
  choice: mula sa Neftali
  rationale: Ang מן ay nagpapahayag ng pinagmulan ng mga tinawag; natural itong isalin na “mula sa.”
- source_word: וּמִן אָשֵׁר
  choice: mula sa Aser
  rationale: Ipinagpapatuloy nito ang talaan ng mga liping pinagmulan ng mga tinawag.
- source_word: וּמִן כָּל מְנַשֶּׁה
  choice: mula sa buong Manases
  rationale: Ipinahahayag ng כָּל ang kabuuan o lawak ng pakikilahok ng Manases nang hindi kailangang idagdag sa teksto ang salitang “lipi.”
- source_word: וַיִּרְדְּפוּ
  choice: hinabol nila
  rationale: Sa salaysay ng digmaan, ang רדף ay tumutukoy sa paghabol o pagtugis sa tumatakas na kaaway. Ang “hinabol” ay malinaw at likas sa modernong Tagalog.
- source_word: אַחֲרֵי מִדְיָן
  choice: ang Midian
  rationale: Kapag kasama ng רדף, ang אַחֲרֵי ay natural na ipinahahayag sa Tagalog sa pamamagitan ng tuwirang layon ng “hinabol.” Ang “Midian” ay metonimiya para sa hukbo o mga tauhan ng Midian.
