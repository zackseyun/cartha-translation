base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: tl
  text: Ang Midian, Amalek, at lahat ng mga taga-Silangan ay nakakalat sa lambak, kasindami ng mga balang; at hindi mabilang ang kanilang mga kamelyo—napakarami, gaya ng buhangin sa tabing-dagat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹפְלִים
  choice: ay nagkalat
  rationale: Ang participle ay literal na ‘bumabagsak/nakahandusay,’ ngunit sa konteksto ng hukbong nagkakampo ay inilalarawan nito ang mga taong nakahimpil o nakakalat sa lambak. Ang ‘nagkalat’ ay natural sa Filipino at pinananatili ang larawan ng hukbong lumaganap sa lugar.
- source_word: בָּעֵמֶק
  choice: sa lambak
  rationale: Tuwirang salin ng karaniwang kahulugan ng עֵמֶק.
- source_word: בְּנֵי קֶדֶם
  choice: mga taga-Silangan
  rationale: Literal itong ‘mga anak ng Silangan,’ isang etnograpiko-heograpikong tawag. Ang ‘mga taga-Silangan’ ay malinaw at natural sa modernong Filipino.
- source_word: כָּאַרְבֶּה לָרֹב
  choice: na sindami ng mga balang
  rationale: Ipinahahayag nito ang paghahambing sa napakalaking bilang ng mga balang; ang ‘sindami’ ay maikli at idiomatikong Filipino.
- source_word: לִגְמַלֵּיהֶם
  choice: ang kanilang mga kamelyo
  rationale: Tuwirang salin ng pangngalan at hulaping panghalip na pangmaramihan.
- source_word: אֵין מִסְפָּר
  choice: hindi mabilang
  rationale: Natural na katumbas ng literal na ‘walang bilang,’ at pinananatili ang hayperbolikong diin.
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם
  choice: gaya ng buhangin sa tabing-dagat
  rationale: Natural na Filipino para sa karaniwang Hebreong paghahambing na nagpapahiwatig ng di-mabilang na dami.
- source_word: לָרֹב
  choice: napakarami
  rationale: Pinananatili ang pangwakas na pag-uulit at diin sa kasaganaan o napakalaking bilang, sa halip na alisin ito bilang kalabisan.
- source_word: וּמִדְיָן וַעֲמָלֵק וְכָל בְּנֵי קֶדֶם
  choice: Ang Midian, Amalek, at ang lahat ng mga taga-Silangan
  rationale: Ang panimulang waw ay nag-uugnay sa daloy ng salaysay; hindi kailangang dagdagan ng tahasang temporal na ‘Ngayon.’ Ang serye ay natural na inihaharap sa Filipino sa pamamagitan ng mga kuwit at ‘at.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang ‘nagkalat’ upang katawanin ang kontekstuwal na diwa ng נֹפְלִים nang hindi ipinapalagay na napatay o natalo ang hukbo. Pinanatili ang pangwakas na diin ng לָרֹב sa ‘napakarami.’
