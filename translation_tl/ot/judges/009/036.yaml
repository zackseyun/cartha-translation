  source_fidelity: Tumpak ang salin sa Hebreo. Pinananatili nito ang pagkakaiba ng הָעָם/עָם bilang “mga tao,” ang kilos na “bumababa,” at ang pahayag ni Zebul na ang nakikita ni Gaal ay anino ng mga bundok na napagkakamalang mga lalaki. Hindi nito idinagdag na hukbo o mandirigma ang pangkat.
