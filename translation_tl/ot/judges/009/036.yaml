  text: וַ/יַּרְא גַּעַל֮ אֶת הָ/עָם֒ וַ/יֹּ֣אמֶר אֶל זְבֻ֔ל הִנֵּה עָ֣ם יוֹרֵ֔ד מֵ/רָאשֵׁ֖י הֶ/הָרִ֑ים וַ/יֹּ֤אמֶר אֵלָי/ו֙ זְבֻ֔ל אֵ֣ת צֵ֧ל הֶ/הָרִ֛ים אַתָּ֥ה רֹאֶ֖ה כָּ/אֲנָשִֽׁים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: tl
  text: Nang makita ni Gaal ang mga tao, sinabi niya kay Zebul, “Tingnan mo! May mga taong bumababa mula sa mga taluktok ng mga bundok.” Ngunit sinabi sa kanya ni Zebul, “Ang anino ng mga bundok ang nakikita mong parang mga lalaki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Ang Qal wayyiqtol ng ראה ay karaniwang nagsasaad ng tuwirang pagkakita sa salaysay; natural sa Tagalog ang “Nang makita” sa pagbubukas ng pangungusap.
- source_word: הָעָם / עָם
  choice: ang mga tao / mga taong
  rationale: Bagaman kolektibong pangngalan at maaaring tumukoy sa isang pangkat ng mandirigma sa konteksto, hindi tahasang sinasabi ng Hebreo na hukbo sila; pinananatili ng “mga tao” ang lawak ng kahulugan.
- source_word: הִנֵּה
  choice: Tingnan mo!
  rationale: Ito ay pantawag-pansin sa tuwirang pananalita. Ang “Tingnan mo!” ay natural at malinaw sa modernong Tagalog.
- source_word: יוֹרֵד
  choice: bumababa
  rationale: Bagaman anyong isahan sa Hebreo dahil kolektibo ang עָם, nararapat ang maramihang diwa sa Tagalog sa pariralang “mga taong bumababa.”
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: mula sa mga taluktok ng mga bundok
  rationale: Ang רֹאשׁ sa konstruksyong ito ay tumutukoy sa tuktok o taluktok; “mga taluktok” ang dignificado at malinaw na katumbas.
- source_word: צֵל הֶהָרִים
  choice: ang anino ng mga bundok
  rationale: Ang צֵל ay “anino” o “lilim.” Mas angkop ang “anino” dahil sinasabi ni Zebul na nagkamali si Gaal sa pagkilala sa kanyang nakita.
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: ang nakikita mong parang mga lalaki
  rationale: 'Pinananatili nito ang paghahambing sa Hebreo: nakikita ni Gaal ang anino na tila mga lalaki, nang hindi dinaragdagan ang paliwanag.'
- source_word: אֲנָשִׁים
  choice: mga lalaki
  rationale: Ang salita ay panlalaking maramihan at, sa tagpong may bantang militar, tumutukoy sa mga anyong inaakalang mga lalaki.
theological_decisions: []
