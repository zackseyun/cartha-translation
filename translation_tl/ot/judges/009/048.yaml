translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kaniya” at “iyon” para sa malinaw na publikasyong estilo, at iniwasang tukuyin bilang mga kawal ang עָם sapagkat “mga tao” lamang ang tahasang sinasabi ng Hebreo.
