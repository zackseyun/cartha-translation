  text: וַ/יַּ֨עַל אֲבִימֶ֜לֶךְ הַר צַלְמ֗וֹן הוּא֮ וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ/וֹ֒ וַ/יִּקַּח֩ אֲבִימֶ֨לֶךְ אֶת הַ/קַּרְדֻּמּ֜וֹת בְּ/יָד֗/וֹ וַ/יִּכְרֹת֙ שׂוֹכַ֣ת עֵצִ֔ים וַ/יִּ֨שָּׂאֶ֔/הָ וַ/יָּ֖שֶׂם עַל שִׁכְמ֑/וֹ וַ/יֹּ֜אמֶר אֶל הָ/עָ֣ם אֲשֶׁר עִמּ֗/וֹ מָ֤ה רְאִיתֶם֙ עָשִׂ֔יתִי מַהֲר֖וּ עֲשׂ֥וּ כָמֽוֹ/נִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: tl
  text: Pagkatapos, umakyat si Abimelec sa Bundok Zalmon, kasama niya ang lahat ng taong naroon. Kinuha ni Abimelec ang mga palakol sa kaniyang kamay, pumutol siya ng isang bungkos ng mga sanga[a], binuhat ito, at ipinatong sa kaniyang balikat. Pagkatapos ay sinabi niya sa mga taong kasama niya, “Kung ano ang nakita ninyong ginawa ko, magmadali kayo at gawin din ninyo ang ginawa ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang malaking sanga,” “isang kumpol ng mga sanga,” o “isang palumpong.” Bihira ang salitang Hebreo at tumutukoy sa isang masa ng mga sanga o palumpong.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Karaniwang kahulugan ng עלה sa salaysay ang pag-akyat; likas at tuwiran ito sa Filipino.
- source_word: הַר צַלְמוֹן
  choice: Bundok Zalmon
  rationale: Isinalin ang הַר bilang “Bundok” at tinumbasan sa baybay-Filipino ang pangalang Zalmon.
- source_word: הוּא וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: kasama ang lahat ng taong naroon sa kaniya
  rationale: Pinanatili ang malawak na kahulugan ng עָם bilang “mga tao” sa halip na tukuying mga kawal o mga lalaki.
- source_word: הַקַּרְדֻּמּוֹת
  choice: ang mga palakol
  rationale: Maramihan ang anyong Hebreo; ang “mga palakol” ang tuwiran at madaling maunawaang katumbas.
- source_word: בְּיָדוֹ
  choice: sa kaniyang kamay
  rationale: Pinananatili ang tahasang pagbanggit sa kamay, bagaman hindi ito lubos na kailangan sa likas na Filipino.
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: pumutol siya ng isang bungkos ng mga sanga
  rationale: Ang bihirang שׂוֹכָה ay tumutukoy sa isang masa o kumpol ng mga sanga o palumpong; ipinahihiwatig ng konteksto na maaari itong buhatin.
- source_word: וַיִּשָּׂאֶהָ
  choice: binuhat iyon
  rationale: 'Sinasalamin ang pagkakasunod-sunod: binuhat muna bago ipinatong sa balikat.'
- source_word: וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: ipinatong sa kaniyang balikat
  rationale: Likas na Filipino para sa paglalagay ng pasan sa balikat.
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: Kung ano ang nakita ninyong ginawa ko
  rationale: Natural na paglalahad sa Filipino ng siksik na pariralang Hebreo nang hindi binabago ang diwa.
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: magmadali kayo at gawin din iyon gaya ko
  rationale: Pinananatili ang maramihang pautos, ang pagkaapurahan, at ang utos na tularan ang ginawa ni Abimelec.
