revisions:
- from: Pagkatapos, umakyat si Abimelec sa Bundok Zalmon, kasama ang lahat ng taong naroon sa kaniya. Kinuha ni Abimelec sa kaniyang kamay ang mga palakol, pumutol siya ng isang bungkos ng mga sanga[a], binuhat iyon, at ipinatong sa kaniyang balikat. Pagkatapos ay sinabi niya sa mga taong kasama niya, “Kung ano ang nakita ninyong ginawa ko, magmadali kayo at gawin din iyon gaya ko.”
  to: Pagkatapos, umakyat si Abimelec sa Bundok Zalmon, kasama niya ang lahat ng taong naroon. Kinuha ni Abimelec ang mga palakol sa kaniyang kamay, pumutol siya ng isang bungkos ng mga sanga[a], binuhat ito, at ipinatong sa kaniyang balikat. Pagkatapos ay sinabi niya sa mga taong kasama niya, “Kung ano ang nakita ninyong ginawa ko, magmadali kayo at gawin din ninyo ang ginawa ko.”
  rationale: Inayos ang parirala para sa mga taong kasama ni Abimelec at ang pangwakas na utos upang maging malinaw at likas sa Filipino habang pinananatili ang maramihang pautos at ang pagtulad sa kaniyang kilos. Inalis din sa talababa ang ‘tuyong,’ na walang tahasang batayan sa Hebreo.
