base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: tl
  text: Muling nagsalita si Gaal at sinabi, “Tingnan ninyo! May mga taong bumababa mula sa gitna ng lupain[a], at may isang pangkat na dumarating mula sa daan ng Punong Ensina ng mga Manghuhula.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pusod ng lupain,” isang matalinghagang tawag sa gitnang bahagi ng lupain.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Punong Terebinto ng mga Manghuhula” o “punong Elon Meonenim.” Hindi tiyak ang uri ng puno at ang huling bahagi ng pangalang-pook; maaaring tumukoy ito sa mga manghuhula o tagapagmasid ng mga tanda.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר
  choice: Muling nagsalita si Gaal
  rationale: Ang literal na ideya na ‘muling nagdagdag upang magsalita’ ay isang Hebreong idyoma para sa muling pagsasalita. Likas at malinaw sa makabagong Tagalog ang ‘muling nagsalita.’
- source_word: הִנֵּה
  choice: Tingnan ninyo!
  rationale: Panawag ito ng pansin sa nakikitang pangyayari. Pinananatili ng ‘Tingnan ninyo!’ ang agarang puwersa nito sa natural na Tagalog.
- source_word: עָם יֹרְדִים
  choice: May mga taong bumababa
  rationale: Ang עָם ay pangkalahatang tumutukoy sa mga tao; hindi ito tahasang nagsasabing mga kawal sila. Ipinahihiwatig ng participle na kasalukuyang nakikita ang kanilang pagbaba.
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: mula sa gitna ng lupain
  rationale: Literal na ‘mula sa pusod ng lupain.’ Heograpikong metapora ang טַבּוּר para sa gitnang bahagi; malinaw sa karaniwang mambabasa ang ‘gitna,’ habang inilalahad sa talababa ang literal na larawan.
- source_word: וְרֹאשׁ אֶחָד
  choice: may isang pangkat
  rationale: Bagaman literal na ‘isang ulo,’ sa konteksto ay tumutukoy ang רֹאשׁ sa isang hiwalay na pangkat o hanay ng mga paparating. Iniiwasan ng ‘pangkat’ ang hindi likas at mapanlinlang na literalismo.
- source_word: בָּא מִדֶּרֶךְ
  choice: dumarating sa daang mula sa
  rationale: Ipinapakita ng parirala ang rutang o direksiyong pinanggagalingan ng pangkat. Ang aspektong nagaganap ay pinananatili sa ‘dumarating.’
- source_word: אֵלוֹן מְעוֹנְנִים
  choice: Punong Ensina ng mga Manghuhula
  rationale: Maaaring tumukoy ang אֵלוֹן sa ensina, terebinto, o isang malaking puno, at malamang na bahagi ito ng isang pangalang-pook. Ang מְעוֹנְנִים ay karaniwang iniuugnay sa panghuhula, ngunit hindi tiyak ang eksaktong anyo at kahulugan; kaya pinananatili sa talababa ang mga alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang maramihang ‘Tingnan ninyo’ bilang likas na panawag ng pansin sa mga kausap. Isinalin ang idyomang ‘pusod ng lupain’ ayon sa kahulugan sa pangunahing teksto at pinanatili ang literal na metapora sa talababa. Ginawang pantanging pangalan ang ‘Punong Ensina ng mga Manghuhula’ dahil malamang na pangalang-pook ito.
