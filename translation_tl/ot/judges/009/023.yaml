  text: וַ/יִּשְׁלַ֤ח אֱלֹהִים֙ ר֣וּחַ רָעָ֔ה בֵּ֣ין אֲבִימֶ֔לֶךְ וּ/בֵ֖ין בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּבְגְּד֥וּ בַעֲלֵי שְׁכֶ֖ם בַּ/אֲבִימֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: tl
  text: Pagkatapos, nagpadala ang Diyos ng isang masamang espiritu[a] sa pagitan ni Abimelec at ng mga pinuno ng Shekem[b], at nagtaksil kay Abimelec ang mga pinuno ng Shekem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang mapaminsalang espiritu.” Maaaring idiin ng salitang Hebreo ang moral na kasamaan o ang nakapipinsalang epekto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga panginoon” o “mga may kapangyarihan sa Shekem”; malamang na tumutukoy rito sa mga pangunahing lalaki o pinunong sibiko ng lungsod.
    reason: lexical_alternative
  - marker: c
    text: O “kumilos nang may pagtataksil laban kay Abimelec.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpadala
  rationale: Tuwirang ipinahahayag ng pandiwa ang pagkilos ng Diyos; natural sa makabagong Tagalog ang “nagpadala.”
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Sa kontekstong ito, tumutukoy ang אֱלֹהִים sa Diyos na kumikilos sa paghatol.
- source_word: רוּחַ רָעָה
  choice: isang masamang espiritu
  rationale: Pinananatili nito ang tuwirang kahulugan ng רָעָה at ang tunay na posibilidad na moral na kasamaan o nakapipinsalang epekto ang diin.
- source_word: בֵּין ... וּבֵין
  choice: sa pagitan ni ... at ng
  rationale: Tumpak nitong inilalarawan ang paglalagay ng alitan o pagkakahati sa dalawang panig.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: mga pinuno ng Shekem
  rationale: Bagaman literal na “mga panginoon/may-ari ng Shekem,” sa kontekstong pampolitika ay malamang na tumutukoy ito sa mga pangunahing lalaki o pinunong sibiko ng lungsod.
- source_word: וַיִּבְגְּדוּ
  choice: nagtaksil
  rationale: Likas at malinaw sa Tagalog ang “nagtaksil,” at ipinahahayag nito ang di-matapat at mapanlinlang na pagkilos na tinutukoy ng בגד.
- source_word: בַּאֲבִימֶלֶךְ
  choice: kay Abimelec
  rationale: Kasama ng pandiwang “nagtaksil,” ang “kay Abimelec” ang likas na konstruksiyon sa Tagalog at malinaw na nagpapakilalang siya ang pinagtaksilan.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagpapadala ng masamang espiritu
  choice: “Nagpadala ang Diyos ng isang masamang espiritu.”
  alternative: “Pinahintulutan ng Diyos ang isang masamang espiritu” o “nagpasapit ang Diyos ng espiritu ng masamang kalooban.”
  rationale: Tuwirang iniuugnay ng pandiwa at sintaks ng Hebreo sa Diyos ang pagpapadala. Hindi ito pinalalambot tungo sa pahintulot lamang, kaya nananatili ang teolohikal na tensiyon ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tuwirang banal na pagkilos at nilagyan ng talababa ang leksikal na kalabuan. Ginamit ang baybay na “Abimelec” at “Shekem” bilang madaling basahing transliterasyon ng mga pangalang Hebreo.
