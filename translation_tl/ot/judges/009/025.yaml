  text: וַ/יָּשִׂ֣ימוּ ל/וֹ֩ בַעֲלֵ֨י שְׁכֶ֜ם מְאָרְבִ֗ים עַ֚ל רָאשֵׁ֣י הֶ/הָרִ֔ים וַ/יִּגְזְל֗וּ אֵ֛ת כָּל אֲשֶׁר יַעֲבֹ֥ר עֲלֵי/הֶ֖ם בַּ/דָּ֑רֶךְ וַ/יֻּגַּ֖ד לַ/אֲבִימֶֽלֶךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: tl
  text: Pagkatapos, naglagay ang mga pinuno ng Shekem[a] ng mga taong nakaabang upang tambangan siya sa mga taluktok ng mga bundok. Ninakawan nila ang bawat dumaraan sa kanila sa daan, at iniulat ito kay Abimelec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga mamamayan ng Shekem” o “mga panginoon ng Shekem.” Literal na tumutukoy ang salitang Hebreo sa “mga baal ng Shekem” at maaaring mangahulugan ng mga pangunahing lalaki o mga taong may kapangyarihan sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: mga pinuno ng Shekem
  rationale: Ang בַעֲלֵי ay literal na maaaring tumukoy sa mga may-ari, panginoon, o may kapangyarihan; sa kontekstong pampolitika ng lungsod, likas na ipinahahayag ng “mga pinuno” ang mga pangunahing taong may kapangyarihan nang hindi nag-aangkat ng piyudal na kahulugan.
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: naglagay ... ng mga lalaking tatambang sa kanya
  rationale: Pinananatili nito ang personal na puwersa ng maramihang participle מְאָרְבִים at ang diwang paglalagay ng mga taong nag-aabang upang sumalakay.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: sa mga taluktok ng mga bundok
  rationale: Malapit ito sa literal na “mga ulo ng mga bundok” at natural na tumutukoy sa matataas na puwestong pinagtambangan.
- source_word: וַיִּגְזְלוּ
  choice: Ninakawan nila
  rationale: Ang גזל ay pag-agaw o pagnanakaw, kadalasan sa pamamagitan ng dahas; ang “ninakawan” ay angkop sa mga manlalakbay na dumaraan sa daan.
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: ang bawat dumaraan sa kanila sa daan
  rationale: Ipinapakita ng “bawat” ang distributibong diwa ng כָּל kasabay ng pandiwang nasa isahan, at pinananatili ang pagtukoy sa daan.
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: iniulat ito kay Abimelec
  rationale: Pinananatili ng balintiyak na anyo ang hindi pagkakakilanlan ng nag-ulat at maayos ang daloy sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Shekem” at “Abimelec” bilang malinaw na anyong Filipino ng mga pangalang Hebreo. Hinati sa dalawang pangungusap upang maging natural ang salaysay nang hindi binabago ang mga ugnayang lohikal ng teksto.
