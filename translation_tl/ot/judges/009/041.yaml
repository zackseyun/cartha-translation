base_translation:
  language: en
  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: tl
  text: Nanatili si Abimelec sa Aruma. Pinalayas naman ni Zebul si Gaal at ang mga kapatid nito upang hindi na sila manirahan sa Shekem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinalayas ni Zebul si Gaal at ang mga kapatid nito mula sa paninirahan sa Shekem.” Ipinapahayag ng anyong pawatas sa Hebreo na hindi na sila pinayagang manatili roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Nanatili
  rationale: Sa konteksto ng salaysay, ang יׁשב ay tumutukoy sa pananatili ni Abimelec sa isang lugar, hindi kinakailangang sa pangmatagalang paninirahan. Likas at malinaw sa makabagong Tagalog ang “nanatili.”
- source_word: בָּארוּמָה
  choice: sa Aruma
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon; ang “sa” ang likas na panandang panlunan sa Tagalog.
- source_word: וַיְגָרֶשׁ
  choice: Pinalayas
  rationale: 'Malakas ang diwa ng גרשׁ: sapilitang pagpapaalis o pagtataboy. Ang “pinalayas” ay tuwiran, natural, at hindi nagdaragdag ng pormal na hatol na maaaring ipahiwatig ng “ipinatapon.”'
- source_word: זְבֻל
  choice: Zebul
  rationale: Isinatranslitera ang pangalang pantangi ayon sa tunog ng Hebreo.
- source_word: גַּעַל
  choice: Gaal
  rationale: Isinatranslitera ang pangalang pantangi sa payak at madaling basahing anyo sa Tagalog.
- source_word: אֶחָיו
  choice: ang mga kapatid nito
  rationale: Karaniwang kahulugan ng אחים ang mga kapatid na lalaki. Pinananatili ng “mga kapatid” ang ugnayang pampamilya nang hindi ito ginagawang mas malawak na “mga kamag-anak” o “mga kasamahan.” Ginamit ang “nito” upang malinaw na si Gaal ang tinutukoy.
- source_word: מִשֶּׁבֶת
  choice: upang hindi na sila manirahan
  rationale: Ang מן na kasunod ng infinitive construct ng ישׁב ay nagpapahayag ng pagpigil o pagbubukod mula sa paninirahan. Inihahatid ng pariralang ito ang resulta sa natural na Tagalog, samantalang itinatala sa talababa ang mas pormal na posibleng anyo.
- source_word: בִּשְׁכֶם
  choice: sa Shekem
  rationale: Isinatranslitera ang pangalan ng lugar nang malapit sa Hebreong שְׁכֶם; ang “sa” ang likas na katumbas ng lokatibong pang-ukol.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal ang rehistro. Hinati sa dalawang pangungusap upang maging natural sa Tagalog, at ginamit ang “naman” upang mapanatili ang paglipat mula sa kilos ni Abimelec tungo sa kilos ni Zebul. Ang talababa ay ikinabit sa pariralang talagang pinaglilinaw nito, hindi sa pangalang Aruma.
