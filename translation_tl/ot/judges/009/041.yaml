  source_fidelity: Tumpak ang pagsasalin sa Hebreo. Ang “Nanatili” ay angkop para sa וַיֵּשֶׁב; ang “pinalayas” ay naihahatid ang sapilitang diwa ng וַיְגָרֶשׁ; at ang “upang hindi na sila manirahan sa Shekem” ay natural na pagpapahayag ng pagbubukod mula sa paninirahan na ipinahihiwatig ng מִשֶּׁבֶת בִּשְׁכֶם.
  naturalness: Likas, malinaw, at marangal ang makabagong Tagalog. Ang paghahati sa dalawang pangungusap ay hindi nakapipinsala sa ugnayan ng mga kilos, at ang “naman” ay katamtamang pang-ugnay na angkop sa salaysay.
  terminology: Konsistent at angkop ang mga anyong Abimelec, Aruma, Zebul, Gaal, at Shekem. Ang “mga kapatid nito” ay malinaw na tumutukoy kay Gaal sa ayos ng pangungusap at pinananatili ang kahulugang pampamilya ng Hebreo.
