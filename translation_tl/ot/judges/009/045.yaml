base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: tl
  text: Nakipaglaban si Abimelec laban sa lunsod sa buong araw na iyon[a]. Sinakop niya ang lunsod at pinatay ang mga taong naroon. Pagkatapos, giniba niya ang lunsod at hinasikan iyon ng asin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinalakay ang lunsod.” Literal na “nakipaglaban” ang pandiwang Hebreo; kasama ng pang-ukol na ginamit dito, malamang na tumutukoy ito sa pakikidigma laban sa lunsod.
    reason: lexical_alternative
  - marker: b
    text: Ang “paghahasik ng asin” ay sagisag ng ganap na pagkawasak at sumpa, na nagmamarka sa pagkaguho ng lunsod.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: nakipaglaban sa lunsod
  rationale: Pinananatili nito ang literal na diwa ng pandiwang 'nakipaglaban,' habang ipinahihiwatig ng konteksto na ang lunsod ang sinalakay ni Abimelec. Posible rin ang mas tuwirang 'sinalakay,' ngunit mas interpretatibo iyon.
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: nang buong araw na iyon
  rationale: Natural na modernong Tagalog ito at pinananatili ang diin sa tagal ng labanan sa tiyak na araw na iyon.
- source_word: וַיִּלְכֹּד
  choice: sinakop niya
  rationale: Sa konteksto ng digmaan at isang lunsod, ang pandiwa ay nangangahulugang bihagin o sakupin; 'sinakop' ang pinakanatural na katumbas sa Tagalog.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: ang mga taong naroon
  rationale: Malinaw nitong tinutukoy ang mga taong nasa loob ng lunsod nang hindi nagdaragdag ng mas tiyak na ideyang wala sa Hebreo.
- source_word: הָרָג
  choice: pinatay
  rationale: Tuwiran at malinaw na katumbas ito ng pandiwang Hebreo para sa pagpatay.
- source_word: וַיִּתֹּץ
  choice: giniba niya
  rationale: Ang 'giniba' ay likas at malinaw na paglalarawan sa pagwasak o pagpapabagsak sa mga gusali ng isang lunsod.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: hinasikan iyon ng asin
  rationale: Pinananatili ng 'hinasikan' ang larawang literal ng paghahasik sa Hebreo, sa halip na paikliin lamang bilang 'inasinan.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'lunsod' para sa dignified biblical register, 'sinakop' para sa kontekstong militar, at 'hinasikan ng asin' upang mapanatili ang kongkretong larawang Hebreo.
