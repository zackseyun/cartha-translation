  text: וַ/יִּשְׁמַ֗ע זְבֻל֙ שַׂר הָ/עִ֔יר אֶת דִּבְרֵ֖י גַּ֣עַל בֶּן עָ֑בֶד וַ/יִּ֖חַר אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: tl
  text: Nang marinig ni Zebul, na pinuno ng lungsod, ang mga sinabi ni Gaal na anak ni Ebed, nag-alab ang galit niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nang marinig
  rationale: Isinasalaysay ng anyong pandiwa ang kasunod na pangyayari; natural sa Tagalog ang sugnay na “Nang marinig” upang iugnay ang pagkarinig sa pag-aalab ng galit.
- source_word: זְבֻל
  choice: Zebul
  rationale: Isinalin sa baybay-Latin ang pangalang pantangi ayon sa karaniwang transliterasyon.
- source_word: שַׂר הָעִיר
  choice: ang pinuno ng lungsod
  rationale: Malawak ang saklaw ng שַׂר bilang pinuno o mataas na opisyal. Ang “pinuno” ay natural at hindi nagtatakda ng isang makabagong tiyak na katungkulan gaya ng gobernador.
- source_word: אֶת דִּבְרֵי
  choice: ang mga sinabi ni
  rationale: Bagaman literal na “ang mga salita ni,” mas natural sa makabagong Tagalog ang “ang mga sinabi ni” at malinaw nitong ipinahahayag na narinig ni Zebul ang pahayag ni Gaal.
- source_word: גַּעַל בֶּן עָבֶד
  choice: Gaal na anak ni Ebed
  rationale: Pinanatili ang mga pangalang pantangi at natural na isinalin ang Hebreong patronimiko bilang “anak ni Ebed.”
- source_word: וַיִּחַר אַפּוֹ
  choice: nag-alab ang galit niya
  rationale: Pinananatili nito ang masiglang metapora ng Hebreong idyoma habang iniiwasan ang malabo at sobrang literal na “nag-alab ang ilong niya.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at natural sa salaysay. Pinanatili ang metapora ng nag-aalab na galit nang hindi isinasalin nang mekanikal ang Hebreong idyoma.
