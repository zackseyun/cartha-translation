base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: tl
  text: Sa umaga, sa pagsikat ng araw, bumangon ka nang maaga at lumusob sa lungsod. At tingnan mo, kapag lumabas siya at ang mga taong kasama niya papunta sa iyo, gawin mo sa kanya ang anumang makakaya mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ayon sa masusumpungan ng iyong kamay,” isang idyomang Hebreo na nangangahulugang ayon sa abot ng iyong kakayahan o pagkakataon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: Kinaumagahan
  rationale: Ang וְהָיָה ay nagsusulong ng pagkakasunod-sunod ng tagubilin, at ang בַבֹּקֶר ay tumutukoy sa umaga. Likas sa salaysay na Tagalog ang “Kinaumagahan.”
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: pagsikat ng araw
  rationale: Nananatili ang temporal na diwa ng כ + infinitive construct nang hindi dinaragdagan ang antas ng pagmamadali na hindi tahasang nakasaad.
- source_word: תַּשְׁכִּים
  choice: bumangon ka nang maaga
  rationale: Ang Hiphil ng שׁכם ay nangangahulugang bumangon o magsimula nang maaga; ang anyong pautos ay angkop sa planong pandigma.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: at lumusob sa lungsod
  rationale: Sa kontekstong militar, ang פשׁט ay maaaring tumukoy sa pagdaluhong, pagsalakay, o pagkalat laban sa isang lugar. Ang “lumusob” ay natural at hindi nagsasaad ng mas tiyak na taktika kaysa sa konteksto.
- source_word: וְהִנֵּה
  choice: At masdan mo
  rationale: Pinananatili nito ang pantawag-pansing puwersa ng הִנֵּה sa isang marangal ngunit nauunawaang modernong paraan.
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: siya at ang mga taong kasama niya
  rationale: Pinananatili ng “mga tao” ang lawak ng עָם at hindi ito pinakikitid agad sa “mga kawal.”
- source_word: יֹצְאִים אֵלֶיךָ
  choice: lumabas ... papunta sa iyo
  rationale: Ang “papunta sa iyo” ay malapit sa direksiyonal na אֵלֶיךָ at hinahayaang ang kontekstong pandigma ang magpahiwatig ng masamang layunin.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: gawin mo sa kanya
  rationale: Sinusunod ang panlalaking isahan na hulapi sa לּוֹ, na pangunahing tumutukoy sa pinuno bagaman maaari siyang kumatawan sa pangkat.
- source_word: כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: ang anumang makakaya mo
  rationale: Ipinahahayag nito sa natural na Tagalog ang idyomang tumutukoy sa abot ng kapangyarihan o pagkakataon ng isang tao; ipinaliliwanag sa talababa ang literal na larawan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Pinanatili ang pantawag-pansing “masdan mo,” ang malawak na “mga tao,” ang direksiyonal na “papunta sa iyo,” at ang isahang “sa kanya” upang hindi lutasin nang di-kailangan ang mga bahaging maaaring bigyang-kahulugan sa higit sa isang paraan.
