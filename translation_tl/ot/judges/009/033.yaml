  to: Sa umaga, sa pagsikat ng araw, bumangon ka nang maaga at lumusob sa lungsod. At tingnan mo, kapag lumabas siya at ang mga taong kasama niya papunta sa iyo, gawin mo sa kanya ang anumang makakaya mo.[a]
