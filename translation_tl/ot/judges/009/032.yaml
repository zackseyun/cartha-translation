  yaml_path: translation/ot/judges/009/032.yaml
  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: tl
  text: “Ngayon nga, bumangon ka sa gabi—ikaw at ang mga taong kasama mo—at maghintay nang nakatago sa parang.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: O “manambang.” Ang pandiwang Hebreo ay tumutukoy sa lihim na paghihintay o pagpuwesto para sa isang pananambang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ginamit bilang panandang nag-uugnay sa naunang sinabi at nagpapakilala ng agarang tagubilin.
- source_word: קוּם
  choice: bumangon ka
  rationale: Tuwirang pautos sa iisang kausap; sa kontekstong militar, tumutukoy ito sa pagkilos o paghahanda, hindi lamang sa pisikal na pagtayo.
- source_word: לַיְלָה
  choice: sa gabi
  rationale: Ipinapahayag ang panahong dapat kumilos nang hindi tiyak na nililimitahan ito sa ‘ngayong gabi.’
- source_word: אַתָּה וְהָעָם אֲשֶׁר אִתָּךְ
  choice: ikaw at ang mga taong kasama mo
  rationale: Pinananatili ang tahasang ‘ikaw’ at ang malawak na kahulugan ng עָם, sa halip na ipakahulugang ‘mga kawal’ o ‘mga lalaki.’
- source_word: וֶאֱרֹב
  choice: at mag-abang
  rationale: Isinasalin ang kilos ng lihim na paghihintay upang manambang, sa halip na ipalagay na nagsimula na ang mismong paglusob.
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Ang שָׂדֶה ay maaaring tumukoy sa bukid o lantad na lupain; ang ‘parang’ ay natural sa taktikal na konteksto at hindi nagpapahiwatig ng sinasakang bukid lamang.
