  register: Makabago at marangal na Filipino, na may tuwirang himig ng utos. Pinanatili ang isahang anyo ng mga pautos dahil isang tao ang tuwirang kinakausap, kahit kasama niyang kikilos ang kaniyang mga tauhan.
