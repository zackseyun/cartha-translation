  yaml_path: translation/ot/judges/009/052.yaml
  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: tl
  text: Umakyat si Abimelec sa tore at nakipaglaban dito. Lumapit siya sa pasukan ng tore upang sunugin ito sa apoy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד־הַמִּגְדָּל
  choice: Umakyat ... sa tore
  rationale: Sa konteksto, ang tore ay nasa mataas na bahagi ng Tebez; kaya natural na ipinahihiwatig ng “umakyat” ang paglapit sa tore nang hindi dinaragdagan ang salaysay.
- source_word: וַיִּלָּחֶם בּוֹ
  choice: sinalakay iyon
  rationale: Ang pandiwa ay literal na “nakipaglaban,” ngunit ang bagay nito ay ang tore; “sinalakay” ang natural na Filipino para sa pakikipaglaban laban sa isang tanggulan.
- source_word: פֶּתַח הַמִּגְדָּל
  choice: pasukan ng tore
  rationale: Ang פֶּתַח ay bukana o pasukan; “pasukan” ang malinaw at karaniwang tawag dito.
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: upang sunugin iyon
  rationale: Ang “sunugin” ay likas nang nagpapahiwatig ng apoy sa Filipino, kaya hindi na kailangang ulitin ang “sa pamamagitan ng apoy.”
