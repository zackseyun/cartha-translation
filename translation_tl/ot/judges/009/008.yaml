  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: tl
  text: Minsan, humayo ang mga punongkahoy upang pahiran ng langis ang isang hari na mamumuno sa kanila.[a] Sinabi nila sa punong olibo, “Maghari ka sa amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit sa magkaugnay na anyo ang pandiwang “humayo” (“humayong humayo”) upang bigyang-diin ang pagkilos. Maaari ring isalin: “Talagang humayo ang mga punongkahoy” o “Nagtungo ang mga punongkahoy upang pahiran ng langis ang isang hari na mamumuno sa kanila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ הָלְכוּ
  choice: Minsan, humayo
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa pagkilos. Sa makabagong Tagalog, likas na ipinakikilala ng “Minsan, humayo” ang pabula at pinananatili sa talababa ang posibleng mas tahasang diin.
- source_word: הָעֵצִים
  choice: ang mga punongkahoy
  rationale: Tumutukoy ang pangmaramihang pangngalan sa mga punong isinatao sa talinghaga; malinaw at marangal ang “mga punongkahoy.”
- source_word: לִמְשֹׁחַ
  choice: upang magpahid ng langis
  rationale: Pinananatili nito ang kongkretong larawan ng ritwal na pagpapahid para sa pagtatalaga sa paghahari, sa halip na gawing simpleng “humirang.”
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: sa isang hari na mamumuno sa kanila
  rationale: Ipinahahayag nito ang isang haring itatalaga upang mamahala sa mga punongkahoy. Ang “sa kanila” ay natural na Tagalog para sa pamamahalang nakapaloob sa Hebrew na על.
- source_word: וַיֹּאמְרוּ
  choice: Sinabi nila
  rationale: Tuwirang salin ng karaniwang pandiwang pasalaysay, na natural sa Tagalog nang hindi kailangang ulitin ang pangatnig.
- source_word: לַזַּיִת
  choice: sa punong olibo
  rationale: Bagaman maaaring tumukoy ang זית sa olibo o punong olibo, ang isinataong kausap sa pabula ay malinaw na isang puno.
- source_word: מְלֹכָה עָלֵינוּ
  choice: Maghari ka sa amin
  rationale: Ang pautos ng מלך ay tumutukoy sa paghahari. Sa Tagalog, ang “maghari sa amin” ay likas at nagpapahiwatig ng kapamahalaan sa mga sakop.
