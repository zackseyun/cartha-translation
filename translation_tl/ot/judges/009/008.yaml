translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “punongkahoy” para sa malinaw na personipikasyon at “magpahid ng langis” upang mapanatili ang konkretong imahen ng משׁח. Ang “Minsan” ay angkop na panimula sa isang pabula, habang ipinaliliwanag sa talababa ang idiomatikong diin ng Hebreo.
