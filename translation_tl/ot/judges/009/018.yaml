base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: tl
  text: Ngunit kayo ay bumangon laban sa sambahayan ng aking ama sa araw na ito at pinatay ninyo ang pitumpung anak niyang lalaki sa iisang bato. Pagkatapos, ginawa ninyong hari ng mga pinuno ng Shekem si Abimelek, na anak ng aliping babae ng aking ama[a], dahil kapatid ninyo siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaeng alipin” o “babaeng lingkod”; sa mas interpretibong salin, “concubina.” Literal na sinasabi ng Hebreo, “anak ng kaniyang aliping babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: bumangon kayo laban sa
  rationale: Pinananatili nito ang metapora at mapanumbat na diin ng idyomang Hebreo, na nagpapahiwatig ng masamang pagtindig o pagkilos laban sa isang tao.
- source_word: בֵּית אָבִי
  choice: sambahayan ng aking ama
  rationale: Ang בֵּית ay tumutukoy dito sa pamilya o angkan, hindi lamang sa isang gusali; malinaw at natural ito sa modernong Tagalog.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Tinutukoy nito ang kasalukuyang pagkakataon ng pahayag ni Jotam; mas natural sa pangungusap na Tagalog kaysa sa literal na “sa araw na ito.”
- source_word: וַתַּהַרְגוּ
  choice: pinatay ninyo
  rationale: Tuwirang inilalarawan ng pandiwa ang pagpatay. Hindi ginamit ang “pinaslang” o “minasaker” upang hindi magdagdag ng legal o retorikal na kahulugang wala mismo sa pandiwa.
- source_word: בָּנָיו
  choice: kaniyang ... anak na lalaki
  rationale: Ang hulapi ay pinakamalamang na tumutukoy sa ama ni Jotam, hindi sa sambahayan; nilinaw rin ang kasarian ayon sa konteksto.
- source_word: שִׁבְעִים אִישׁ
  choice: pitumpung anak na lalaki
  rationale: Bagaman literal na “pitumpung lalaki,” tinutukoy ng אִישׁ dito ang mga anak na lalaki na kababanggit lamang; natural sa Tagalog na huwag ulitin ang “lalaki” bilang hiwalay na bilang.
- source_word: עַל אֶבֶן אֶחָת
  choice: sa ibabaw ng iisang bato
  rationale: Pinananatili ang tahasan at malagim na larawan ng isang batong pinagdausan ng magkakasunod na pagpatay.
- source_word: וַתַּמְלִיכוּ
  choice: ginawa ninyong hari
  rationale: 'Malinaw na ipinahahayag ang causative na anyo ng מלך: sila ang nagluklok sa kaniya bilang hari.'
- source_word: בֶּן אֲמָתוֹ
  choice: anak ng kaniyang alilang babae
  rationale: Ang אָמָה ay babaeng alipin o lingkod. Pinananatili ng “alilang babae” ang katayuang panlipunan nang hindi agad ipinapalagay ang mas tiyak na kahulugang “kinakasama.”
- source_word: בַּעֲלֵי שְׁכֶם
  choice: mga pinuno ng Shekem
  rationale: Sa kontekstong pampolitika, tumutukoy ito sa mga pangunahing mamamayan o may kapangyarihan sa lunsod; “mga pinuno” ang pinakamalinaw na modernong katumbas.
- source_word: כִּי אֲחִיכֶם הוּא
  choice: dahil kapatid ninyo siya
  rationale: Pinananatili ang sanhi at ang mapait na ironya ng paratang ni Jotam.
theological_decisions:
- issue: Katayuang panlipunan ng אֲמָתוֹ sa paglalarawan sa ina ni Abimelek
  choice: alilang babae
  alternative: babaeng alipin; babaeng lingkod; kinakasama
  rationale: Ang pangngalang Hebreo ay tumutukoy sa isang babaeng alipin o lingkod at ginagamit dito upang idiin ang mababang katayuan ng ina ni Abimelek. Hindi ginamit sa pangunahing teksto ang “kinakasama” sapagkat mas tiyak iyon kaysa sa mismong salita; inilagay sa talababa ang leksikal at interpretibong mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” para sa angkan o pamilya, “Shekem” bilang transliterasyon ng pangalang Hebreo, at “alilang babae” upang mapanatili ang panlipunang diin nang hindi labis na nililinaw ang eksaktong relasyon.
