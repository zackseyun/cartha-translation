base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: tl
  text: At kung sa araw na ito ay nakitungo kayo nang may katapatan at integridad kina Jerubaal at sa sambahayan niya[a], ikagalak ninyo si Abimelec, at ikagalak din niya kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sambahayan” ay maaari ring tumukoy sa pamilya o angkan niya.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang pang-ugnay at kondisyong nagpapatuloy sa retorika ng naunang talata.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: nang tapat at may integridad
  rationale: Ipinahahayag ang katapatan o pagiging maaasahan ng אֱמֶת at ang moral na kabuuan ng תָמִים sa natural at marangal na modernong Tagalog.
- source_word: עֲשִׂיתֶם עִם
  choice: kumilos kayo ... kay
  rationale: Natural na inilalarawan ang pakikitungo o pagkilos ng isang tao sa iba.
- source_word: יְרֻבַּעַל
  choice: Jerubaal
  rationale: Tinatagalog ang baybay ng pangalang Hebreo nang hindi isinasalin ang pangalan.
- source_word: בֵּיתוֹ
  choice: sambahayan niya
  rationale: Mas malinaw kaysa literal na 'bahay niya' na ang tinutukoy ay maaaring pamilya, sambahayan, o angkan; pinananatili sa talababa ang lawak ng kahulugan.
- source_word: הַיּוֹם הַזֶּה
  choice: ngayon
  rationale: Natural na katumbas sa Tagalog ng literal na 'sa araw na ito.'
- source_word: שִׂמְחוּ בַּאֲבִימֶלֶךְ
  choice: magalak kayo kay Abimelec
  rationale: Pinananatili ang pautos at ang ugnayang ipinahihiwatig ng pang-ukol ב nang hindi gumagamit ng di-natural na 'sa loob ni.'
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: at magalak din siya sa inyo
  rationale: Ipinapakita ang jussive o pahintulot na diwa at ang katumbas na gantihang pagkagalak.
