revisions:
- from: At kung kumilos kayo ngayon nang tapat at may integridad kay Jerubaal at sa sambahayan niya[a], magalak kayo kay Abimelec, at magalak din siya sa inyo.
  to: At kung sa araw na ito ay nakitungo kayo nang may katapatan at integridad kina Jerubaal at sa sambahayan niya[a], ikagalak ninyo si Abimelec, at ikagalak din niya kayo.
  rationale: Inayos ang idyoma para sa “pakikitungo” sa Jerubaal at sa kaniyang sambahayan, ginawang magkatugma ang “katapatan at integridad,” at ginamit ang mas natural na magkatugong pananalita para sa utos na magalak. Pinananatili ang “sa araw na ito” upang malapit na maipakita ang temporal na pariralang Hebreo at ang saklaw ng “sambahayan.”
