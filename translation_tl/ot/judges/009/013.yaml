base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: tl
  text: Ngunit sinabi sa kanila ng puno ng ubas, “Ititigil ko ba ang paggawa ng aking bagong alak, na nagpapagalak sa mga diyos at sa mga tao,[a] at magpunta upang umindayog sa ibabaw ng mga puno?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Diyos at sa mga tao.”
    reason: Pinananatili ang alternatibong pagbasa sa אֱלֹהִים, na maaari ring unawain bilang singular na “Diyos.”
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: puno ng ubas
  rationale: Mas malinaw at likas sa modernong Filipino kaysa sa payak na “ubas,” at pinananatili ang larawan ng halamang nagsasalita sa talinghaga.
- source_word: הֶחֳדַלְתִּי
  choice: Iiwan ko ba
  rationale: Ang unang panauhang perfect ay gumaganap bilang retorikal na tanong sa konteksto. Ipinahihiwatig nito ang pagtigil o pagtalikod sa kasalukuyang bunga ng puno ng ubas nang hindi kailangang magdagdag ng tahasang pandiwang “gumawa.”
- source_word: תִּירוֹשִׁי
  choice: aking bagong alak
  rationale: Ang תִּירוֹשׁ ay sariwa o bagong alak; pinananatili ng “bagong alak” ang pagkakaibang leksikal nito sa pangkalahatang salita para sa alak.
- source_word: הַמְשַׂמֵּחַ
  choice: na nagpapagalak
  rationale: 'Tumpak na inilalarawan ang causative participle: ang alak ang nagdudulot ng galak.'
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: sa mga diyos at sa mga tao
  rationale: Ang אֱלֹהִים ay anyong maramihan at, sa sinaunang konteksto ng talinghaga, maaaring tumukoy sa mga diyos. Ang “mga tao” ay mas natural at inklusibong katumbas ng אֲנָשִׁים sa Filipino kaysa “mga lalaki.”
- source_word: וְהָלַכְתִּי
  choice: upang humayo
  rationale: Ipinapahayag ang kasunod na kilos na isinasaalang-alang sa retorikal na tanong at nagpapanatili ng marangal na himig.
- source_word: לָנוּעַ
  choice: umindayog
  rationale: Pinananatili ang pisikal na larawan ng paggalaw ng puno habang ipinahihiwatig ng pariralang “sa ibabaw” ang posisyon nito sa mga puno; hindi tahasang pinapalitan ng “maghari” ang matalinghagang salita.
- source_word: עַל הָעֵצִים
  choice: sa ibabaw ng mga puno
  rationale: Pinananatili ang spatial na larawan at ang pahiwatig ng pamumuno o pagiging nakakataas sa mga puno.
theological_decisions:
- issue: Kahulugan ng אֱלֹהִים sa pariralang הַמְשַׂמֵּחַ אֱלֹהִים וַאֲנָשִׁים
  choice: mga diyos
  alternative: Diyos
  rationale: Morphologically plural ang אֱלֹהִים, at ang konteksto ng sinaunang talinghaga ay nagpapahintulot sa plural na pagbasa. Hindi dapat tahimik na gawing singular ang tunay na kalabuan; inilalahad sa talababa ang tradisyonal na pagbasa na “Diyos.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “puno ng ubas” para sa agarang linaw, “bagong alak” upang panatilihin ang agrikultural na katawagan, at “umindayog sa ibabaw” upang mapanatili ang pisikal at makaharing dalawang pahiwatig ng talinghaga.
