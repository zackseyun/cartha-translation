  text: Pagkatapos, sinabi ng mga puno sa puno ng igos, “Halika at maghari ka sa amin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa sunod-sunod na salaysay; natural na ipinahahayag ito ng “Pagkatapos,” samantalang pinananatili ng “sinabi” ang payak na diwa ng אמר.
- source_word: הָעֵצִים
  choice: mga puno
  rationale: Sa konteksto ng talinghagang ito, ang עֵצִים ay tumutukoy sa mga punong nagsasalita, hindi sa kahoy bilang materyal.
- source_word: לַתְּאֵנָה
  choice: sa puno ng igos
  rationale: Ang תְּאֵנָה rito ay ang punong igos, at ang ל ay nagmamarka sa kinakausap.
- source_word: לְכִי אַתְּ
  choice: Ikaw naman ang pumarito
  rationale: Ang pambabaeng pang-isahang pautos na לְכִי at ang tahasang panghalip na אַתְּ ay magkasamang nagbibigay-diin sa bagong kinakausap. Ang “Ikaw naman” ay likas na Filipino sa pagkakasunod ng mga nilalapitan, at ang “pumarito” ay naghahatid ng paanyayang lumapit upang tanggapin ang paghahari.
- source_word: מָלְכִי
  choice: maghari
  rationale: Ang pambabaeng pang-isahang pautos mula sa מלך ay pandiwang nangangahulugang mamahala bilang hari; “maghari” ang tuwiran at matipid na katumbas sa Filipino.
- source_word: עָלֵינוּ
  choice: sa amin
  rationale: Kapag kasama ng מלך, ang עַל ay nagpapahiwatig ng pamamahala sa mga nasasakupan. Sa Filipino, natural ang pariralang “maghari sa amin.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang personipikasyon ng mga puno at ang diin ng tahasang panghalip, nang hindi pilit na ginagawang pambabae ang pautos sapagkat walang gramatikal na kasarian ang pandiwang Filipino.
