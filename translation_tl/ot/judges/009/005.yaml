  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak ngunit marahas na paglalarawan ng Hebreo at ang konkretong larawan ng iisang bato. Ginamit ang “Ofra,” “Jerubaal,” at “Jotam” bilang likas na anyong Filipino ng mga pangalang pantangi.
