base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: tl
  text: Pagkatapos, pumunta siya sa bahay ng kanyang ama sa Ofra at pinatay ang kanyang mga kapatid—pitumpung lalaki na mga anak ni Jerubaal—sa isang bato.[a] Ngunit nakaligtas[b] si Jotam, ang bunsong anak ni Jerubaal, dahil nagtago siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa isang bato” ay maaaring tumukoy sa isang batong pinagdausan ng mga pagpatay o sa iisang lugar na may bato; hindi tiyak kung paano eksaktong ginamit ang bato.
    reason: cultural_note
  - marker: b
    text: Sa literal, “naiwan” o “natira”; sa konteksto, naiwan siyang buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: pumunta siya sa bahay ng kanyang ama sa Ofra
  rationale: Isinasalaysay ng waw-consecutive ang kasunod na pangyayari. Ipinahihiwatig ng hulaping patungo sa עָפְרָתָה ang direksiyon tungo sa Ofra; natural itong naipapahayag sa Filipino sa kabuuang pariralang “pumunta ... sa bahay ... sa Ofra.”
- source_word: וַיַּהֲרֹג
  choice: pinatay
  rationale: Ito ang tuwiran at karaniwang katumbas ng pandiwa, nang hindi nagdaragdag ng legal na pagpapakahulugang hindi tahasang nasa salitang Hebreo.
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל שִׁבְעִים אִישׁ
  choice: ang kanyang mga kapatid—ang pitumpung anak na lalaki ni Jerubaal
  rationale: Pinananatili ang appositional na pagkakakilanlan ng mga kapatid bilang mga anak ni Jerubaal. Ang “anak na lalaki” ay malinaw at angkop sa kasarian ng mga tinutukoy.
- source_word: עַל אֶבֶן אֶחָת
  choice: sa ibabaw ng iisang bato
  rationale: Pinananatili ang matindi at kongkretong larawan ng Hebreo nang hindi tiyakang ipinapaliwanag kung paano ginamit ang bato.
- source_word: וַיִּוָּתֵר
  choice: nakaligtas
  rationale: Sa konteksto ng pagpatay, natural na ipinapahayag nito na si Jotam ang natirang buhay. Iniiwasan nito ang malabong Filipino na “naiwan,” na maaaring magpahiwatig lamang ng lokasyon.
- source_word: הַקָּטֹן
  choice: ang bunso
  rationale: Sa konteksto ng magkakapatid, ito ang natural na katumbas ng “maliit/bata” at tumutukoy sa pinakabata.
- source_word: כִּי נֶחְבָּא
  choice: dahil nagtago siya
  rationale: Malinaw nitong ipinapahayag ang dahilan ng kanyang pagkaligtas at ang kontekstuwal na reflexive na diwa ng Niphal.
