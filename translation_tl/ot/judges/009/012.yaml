  yaml_path: translation/ot/judges/009/012.yaml
  text: Then the trees said to the vine[a], ‘Come, reign over us.’
translation:
  language: tl
  text: Pagkatapos, sinabi ng mga puno sa punong ubas, “Halika, maghari ka sa amin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay. Likas sa modernong Filipino ang “Pagkatapos” dito, samantalang posible rin ang “At sinabi.”
- source_word: הָעֵצִים
  choice: mga puno
  rationale: Sa konteksto ng talinghaga ni Jotam, ang pangmaramihang עֵץ ay tumutukoy sa mga puno, hindi sa kahoy bilang materyal.
- source_word: לַגָּפֶן
  choice: sa punong ubas
  rationale: Ang גֶּפֶן ay halamang ubas o grapevine. Ang “punong ubas” ay karaniwan at madaling maunawaang katawagan sa Filipino sa kontekstong ito.
- source_word: לְכִי
  choice: Halika
  rationale: Bagaman literal na kaugnay ng “humayo,” ang לְכִי na sinusundan ng isa pang pautos ay isang panawagan upang kumilos; likas itong ipahayag bilang “Halika” sa Filipino.
- source_word: אַתְּ
  choice: ka
  rationale: Ang panghalip ay ikalawang panauhang pambabae na isahan, kaayon ng pambalarilang kasarian ng גֶּפֶן. Walang ganitong pagtatangi ng kasarian sa Filipino, at likas na naipahahayag ang paksa sa “maghari ka.”
- source_word: מְלֹכִי
  choice: maghari
  rationale: Pautos itong anyo ng מלך na nangangahulugang mamahala bilang hari. Tumpak at likas sa Filipino ang “maghari” nang hindi kinakailangang tawaging lalaki ang personipikadong punong ubas.
- source_word: עָלֵינוּ
  choice: sa amin
  rationale: Kasama ng מלך, ipinakikita ng עַל ang mga sakop ng paghahari. Ang idyomatikong Filipino ay “maghari sa amin”; magiging di-likas ang literal na “sa ibabaw namin.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pasalaysay na talinghaga. Pinanatili ang personipikasyon at ang maikling pautos ng Hebreo. Hindi kailangan ang talababa sapagkat ang “Halika, maghari ka sa amin” ay parehong tumpak at natural.
