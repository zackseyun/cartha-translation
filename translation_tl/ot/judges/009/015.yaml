base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: tl
  text: Sinabi ng matinik na palumpong sa mga puno, “Kung talagang pinapahiran ninyo ako ng langis upang maging hari ninyo, lumapit kayo at manganlong sa aking lilim.[a] Ngunit kung hindi, lumabas nawa ang apoy mula sa matinik na palumpong at tupukin ang mga sedro ng Lebanon.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “manganlong” ay maaari ring isaling “humanap ng kanlungan.” Maaaring may mapanuyang diin ang pananalita, sapagkat kakaunti lamang ang lilim na maibibigay ng isang matinik na palumpong.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “lalabas ang apoy mula sa matinik na palumpong.” Maaaring magpahayag ang pandiwang Hebreo ng isang hangarin o sumpa, o ng isang mangyayaring bunga.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הָאָטָד
  choice: matinik na palumpong
  rationale: Tumutukoy ang Hebreo sa isang palumpong na may tinik. Likas at madaling maunawaan ang saling ito, habang iniiwasan ang labis na tiyak na pagkilala sa uri ng halaman.
- source_word: אִם בֶּאֱמֶת
  choice: Kung talagang
  rationale: Natural na ipinahahayag nito sa modernong Tagalog ang kondisyon tungkol sa katapatan o pagiging tunay ng kanilang gagawin.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: pinapahiran ninyo ako ng langis upang maging hari ninyo
  rationale: Pinananatili nito ang kongkretong larawan ng ritwal na pagpapahid ng langis at ang layunin nitong italaga siya bilang hari.
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  choice: lumapit kayo at manganlong sa aking lilim
  rationale: Ang 'manganlong' ay malinaw na naghahatid ng paghahanap ng proteksiyon, at pinananatili ng 'lilim' ang kabalintunaang kakaunti lamang ang maibibigay na silong ng matinik na palumpong.
- source_word: וְאִם אַיִן
  choice: Ngunit kung hindi
  rationale: Malinaw at natural nitong ipinakikita ang salungat na bunga kapag hindi tunay ang kanilang pagpapahari.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: lumabas nawa ang apoy mula sa matinik na palumpong
  rationale: Pinananatili ng 'nawa' ang maaaring jussive o sumpang himig ng pandiwang Hebreo sa halip na basta gawin itong tiyak na hula.
- source_word: וְתֹאכַל
  choice: at tupukin
  rationale: Ang 'tupukin' ay likas na gamit sa apoy na lubusang umuubos o sumisira.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: mga sedro ng Lebanon
  rationale: Pinananatili ang kilalang larawang pampanitikan ng mariringal na sedro ng Lebanon.
theological_decisions:
- issue: Puwersa ng תֵּצֵא sa pahayag tungkol sa apoy
  choice: 'Isinalin bilang hangarin o sumpa: “lumabas nawa.”'
  alternative: 'Maaaring isalin bilang hula: “lalabas ang apoy.”'
  rationale: Maaaring unawain ang imperfect bilang jussive sa kontekstong ito, ngunit tunay ang gramatikal na posibilidad ng prediktibong pagbasa; kaya hindi dapat ituring na ganap na sarado ang usapin.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “matinik na palumpong” sa halip na teknikal o di-pamilyar na pangalan ng halaman; pinanatili ang maharlikang pagpapahid ng langis, ang ironikong lilim, at ang ambiguwidad ng pahayag tungkol sa apoy.
