  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם בֶּ/אֱמֶ֤ת וּ/בְ/תָמִים֙ עֲשִׂיתֶ֔ם וַ/תַּמְלִ֖יכוּ אֶת אֲבִימֶ֑לֶךְ וְ/אִם טוֹבָ֤ה עֲשִׂיתֶם֙ עִם יְרֻבַּ֣עַל וְ/עִם בֵּית֔/וֹ וְ/אִם כִּ/גְמ֥וּל יָדָ֖י/ו עֲשִׂ֥יתֶם לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: tl
  text: Kaya ngayon, kung kumilos kayo nang may katapatan at integridad at ginawa ninyong hari si Abimelec, at kung naging mabuti ang pakikitungo ninyo kay Jerubaal at sa kanyang sambahayan, at kung pinakitunguhan ninyo siya ayon sa kabayarang nararapat sa kanyang mga ginawa[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ayon sa kabayaran ng kanyang mga ginawa.” Ang idyomang Hebreo ay tumutukoy sa pagtrato sa isang tao ayon sa kanyang mga ginawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahahayag ang paglipat at paghinuha sa hamon ni Jotam; natural itong katumbas ng temporal at inferensiyal na puwersa ng Hebreo.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: nang may katapatan at integridad
  rationale: Pinananatili ang magkaparis na diwa ng pagiging tapat at buo o matuwid sa asal, sa malinaw na modernong Filipino.
- source_word: וַתַּמְלִיכוּ אֶת אֲבִימֶלֶךְ
  choice: at ginawa ninyong hari si Abimelec
  rationale: 'Tuwirang ipinapahayag ang causative na anyo ng pandiwang Hebreo: pinaghari nila si Abimelec.'
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: naging mabuti ang pakikitungo ninyo kay
  rationale: Natural na Filipino para sa idyomang Hebreo na literal na ‘gumawa ng mabuti sa/kasama ng,’ habang pinananatili ang moral na pagtatasa.
- source_word: יְרֻבַּעַל
  choice: Jerubaal
  rationale: Pinananatili ang pangalang ginamit sa tekstong Hebreo sa halip na palitan ito ng Gideon.
- source_word: בֵּיתוֹ
  choice: kanyang sambahayan
  rationale: Ipinahahayag ang pamilyal at sambahayang saklaw ng Hebreong ‘bahay’ nang hindi ito mapagkamalang gusali lamang.
- source_word: כִּגְמוּל יָדָיו עֲשִׂיתֶם לוֹ
  choice: pinakitunguhan ninyo siya ayon sa nararapat sa ginawa ng kanyang mga kamay
  rationale: Pinananatili ang kongkretong larawan ng ‘mga kamay’ at ang diwa ng pagtrato sa isang tao ayon sa naibunga o nararapat sa kanyang ginawa, nang hindi awtomatikong ginagawang negatibong paghihiganti.
theological_decisions:
- issue: Kung positibo o negatibo ang ‘kabayaran’ sa idyomang כִּגְמוּל יָדָיו
  choice: ayon sa nararapat sa ginawa ng kanyang mga kamay
  alternative: ayon sa gantimpala ng kanyang mga kamay
  rationale: Hindi likas na nilulutas ng parirala kung gantimpala o pagganti ang tinutukoy. Pinananatili ng salin ang bukas na moral na pagsusuri sa retorikal na kondisyong ipinahayag ni Jotam.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang sunod-sunod na mga sugnay na ‘kung’ at ang bitin na pangungusap sa hulihan, sapagkat nagpapatuloy ang kondisyong retorikal sa mga kasunod na talata.
