  to: Agad niyang tinawag ang binatang tagapagdala ng kanyang mga sandata[a] at sinabi rito, “Bunutin mo ang iyong espada at patayin mo ako, para hindi nila sabihin tungkol sa akin, ‘Isang babae ang pumatay sa kanya.’” Kaya inulos ng binatang iyon si Abimelec, at namatay siya.
