base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: tl
  text: Agad niyang tinawag ang binatang tagapagdala ng kanyang mga sandata[a] at sinabi rito, “Bunutin mo ang iyong espada at patayin mo ako, para hindi nila sabihin tungkol sa akin, ‘Isang babae ang pumatay sa kanya.’” Kaya inulos ng binatang iyon si Abimelec, at namatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas idiomatikong, “kanyang tagapagdala ng sandata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: Agad niyang tinawag
  rationale: Isinasalaysay nito ang kasunod na kilos at ang pagmamadali; natural sa modernong Tagalog ang “agad niyang tinawag.”
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Pinananatili ang karaniwang kahulugan ng נַעַר bilang batang lalaki o binata, sa halip na agad itong gawing “alipin” o “lingkod.”
- source_word: נֹשֵׂא כֵלָיו
  choice: tagapagdala ng kanyang mga sandata
  rationale: Malinaw na inilalarawan ang taong nagdadala ng kanyang kagamitan o mga sandata; hindi nito ikinukulong ang malawak na כֵלִים sa baluti lamang.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Bunutin mo ang iyong espada
  rationale: Ang pandiwa ay tumutukoy sa pagbunot ng espada, at ang parirala ay tuwiran at natural sa Tagalog.
- source_word: וּמוֹתְתֵנִי
  choice: at patayin mo ako
  rationale: Tuwirang ipinahahayag ang utos na maging sanhi ng kanyang kamatayan.
- source_word: פֶּן יֹאמְרוּ לִי
  choice: para hindi nila sabihin tungkol sa akin
  rationale: Ipinapahayag ng פֶּן ang layuning maiwasan ang mangyayari; sa konteksto, ang לִי ay tumutukoy sa sasabihin tungkol sa kanya.
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: ‘Isang babae ang pumatay sa kanya’
  rationale: Pinananatili ang pag-una sa “babae” at ang tuwirang pananalita, na mahalaga sa ipinahihiwatig na kahihiyan sa salaysay.
- source_word: וַיִּדְקְרֵהוּ
  choice: inulos siya
  rationale: Tiyak at likas na salin ng pagtusok o pagtarak sa kanya gamit ang espada.
- source_word: נַעֲרוֹ
  choice: kanyang binata
  rationale: Pinananatili ang pagkakatugma sa naunang נַעַר, samantalang nililinaw ng talababa ang tungkulin nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang “espada” bilang pangkaraniwang modernong katawagan at “binata” upang mapanatili ang leksikal na diwa ng נַעַר; inilagay sa talababa ang mas idiomatikong katawagan sa tungkulin.
