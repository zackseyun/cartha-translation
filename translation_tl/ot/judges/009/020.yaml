  naturalness: Natural at marangal ang modernong Filipino. Ang “lumabas nawa” at “tupukin” ay malinaw na naghahayag ng imprecatory/jussive na puwersa. Isang maliit na pagbabago sa talababa ang kailangan upang maging mas tuwiran at di-mapagpasyang katumbas ng literal na alternatibo.
  terminology: Pare-pareho at angkop ang mga pangalang Abimelec, Shekem, at Bet-milo. Ang “apoy,” “pinuno,” at “tupukin” ay angkop sa larawan at rehistro ng talata. Sa talababa, mas tumpak ang “bahay ng Milo” kaysa “sambahayan ng Milo” bilang literal na alternatibo para sa beth.
