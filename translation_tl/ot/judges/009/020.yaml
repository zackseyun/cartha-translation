base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: tl
  text: Ngunit kung hindi, lumabas nawa ang apoy mula kay Abimelec at tupukin ang mga pinuno ng Shekem[a] at ang Bet-milo[b]; at lumabas nawa ang apoy mula sa mga pinuno ng Shekem at mula sa Bet-milo at tupukin si Abimelec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga panginoon ng Shekem.” Ang pananalitang Hebreo ay tumutukoy sa mga makapangyarihang lalaki o pangunahing pinuno ng lunsod.
    reason: lexical_alternative
  - marker: b
    text: Ang Bet-milo ay maaari ring isaling “bahay ng Milo,” at malamang na tumutukoy sa isang lugar o namumunong pangkat na kaugnay ng Shekem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: Ngunit kung hindi
  rationale: Likas na kondisyunal na pagpapatuloy ito ng sumpa ni Jotam mula sa naunang talata at pinananatili ang pagsalungat ng וְ at ang negatibong diwa ng kondisyon.
- source_word: תֵּצֵא אֵשׁ
  choice: lumabas nawa ang apoy
  rationale: Ang yiqtol ay may puwersang jussive sa pahayag na sumpa. Ipinahahayag ng “nawa” ang hiling o sumpa nang hindi ito ginagawang payak na prediksiyon lamang.
- source_word: מֵאֲבִימֶלֶךְ
  choice: mula kay Abimelec
  rationale: Pinananatili nito ang pinagmulan ng mapanirang apoy at gumagamit ng likas na anyong Filipino para sa pangalan ng tao.
- source_word: וְתֹאכַל
  choice: at tupukin
  rationale: Kapag apoy ang simuno, ang אכל ay nangangahulugang “tupukin” o “lamunin.” Ang “tupukin” ay malinaw, natural, at nagpapanatili sa larawang apoy.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ang mga pinuno ng Shekem
  rationale: Sa kontekstong ito, tumutukoy ang בַּעֲלִים sa mga makapangyarihang lalaki o pangunahing tagapamahala ng lunsod, hindi lamang sa lahat ng mamamayan.
- source_word: בֵּית מִלּוֹא
  choice: Bet-milo
  rationale: Itinuturing itong pangalang pantangi ng isang lugar o pangkat na kaugnay ng Shekem, kaya tinumbasan sa pamamagitan ng transliterasyon habang inilalahad sa talababa ang posibleng literal na anyo.
- source_word: וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: at lumabas nawa ang apoy mula sa mga pinuno ng Shekem at mula sa Bet-milo
  rationale: Iningatan ang pagkakapantay at pag-uulit ng dalawang sugnay upang luminaw ang sumpa ng kapwa paglipol.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: si Abimelec
  rationale: Tuwirang layon ito ng huling pandiwa; ang pagwawakas sa pangalan ni Abimelec ay nagpapanatili sa simetriya ng kapwa pagkapuksa.
theological_decisions:
- issue: Ang katangian ng larawang “apoy”
  choice: Pinanatili ang kongkretong salitang “apoy” sa loob ng sumpa nang hindi ipinapaliwanag sa pangunahing teksto kung ito ay literal o metaporikal.
  alternative: Isalin ito bilang marahas na alitan, o tahasang tukuyin bilang apoy ng hatol ng Diyos.
  rationale: Apoy ang mismong larawan sa Hebreo. Maaaring ipinahihiwatig nito ang kapwa marahas na paglipol, ngunit hindi nililinaw ng talata kung literal, metaporikal, o kapwa ito; kaya pinananatili ang tensiyong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nawa” upang ihayag ang puwersa ng sumpa, at iningatan ang paulit-ulit at simetrikong ayos ng Hebreo. Inilagay ang mga talababa sa mismong mga salitang tinatalakay ng mga ito.
