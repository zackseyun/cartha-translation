  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: tl
  text: Ngunit sinabi sa kanila ng puno ng igos, “Ihihinto ko ba ang pagbibigay ng aking tamis at ng aking mabuting bunga, at hahayo upang umindayog sa ibabaw ng mga puno?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maghari sa mga puno.” Ang pandiwang Hebreo ay literal na nangangahulugang “umindayog” o “gumalaw”; pinananatili nito ang larawan ng mga puno habang ipinahihiwatig sa pabula ang paghahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit ang “Ngunit” ay natural na naghahayag ng pagtutol ng puno ng igos bilang tugon sa alok.
- source_word: הַתְּאֵנָה
  choice: puno ng igos
  rationale: Ang pangngalan ay tumutukoy sa puno ng igos na ginawang tauhang nagsasalita sa talinghaga.
- source_word: הֶחֳדַלְתִּי
  choice: Dapat ko bang talikuran
  rationale: Ang anyong perfect ay may deliberatibong puwersa sa retorikal na tanong. Ipinahihiwatig ng “talikuran” ang paghinto sa kasalukuyang mabuting gawain nang hindi kailangang idagdag ang “paglikha.”
- source_word: מָתְקִי
  choice: aking tamis
  rationale: Pinananatili nito ang tuwirang diwa at personipikadong pananalita ng Hebreo sa halip na gawing “matamis na bunga.”
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: aking mabuting bunga
  rationale: Sa konteksto ng puno ng igos, ang “bunga” ang pinakanatural na katumbas ng ani o produkto, at tuwirang pinananatili ang pang-uring “mabuti.”
- source_word: וְהָלַכְתִּי
  choice: at humayo
  rationale: Ipinagpapatuloy nito ang deliberatibong tanong sa natural at marangal na Filipino.
- source_word: לָנוּעַ
  choice: maghari
  rationale: Sa konteksto ng pabula tungkol sa paghahari sa mga puno, ipinahihiwatig ng pandiwa ang pamumuno. Ang literal na diwang “umindayog” ay inilagay sa talababa upang mapanatili ang larawang-puno at tunay na leksikal na ambiguwidad.
- source_word: עַל הָעֵצִים
  choice: sa mga puno
  rationale: Kasama ng “maghari,” natural na ipinahahayag ng “sa” ang awtoridad sa iba pang mga puno.
