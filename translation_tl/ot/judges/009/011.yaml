  register: Modernong Filipino na natural at marangal. Ginamit ang “puno ng igos,” “tamis,” at “mabuting bunga” para sa malinaw ngunit malapit-sa-anyo na salin. Pinili sa pangunahing teksto ang mas madaling maunawaang “maghari,” habang pinananatili sa talababa ang literal na larawang “umindayog.”
