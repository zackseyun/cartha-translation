base_translation:
  language: en
  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: tl
  text: Pagkatapos, pumunta si Abimelec sa Tebez at nagkampo laban dito[a]. Sinakop niya ang lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkampo sa Tebez.” Karaniwang nangangahulugang “sa” o “loob ng” ang pang-ukol sa Hebreo, ngunit sa kontekstong militar dito ay malamang na tumutukoy ito sa pagkakampo laban sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Karaniwang salaysay ang gamit ng הלך; ang “pumunta” ay natural at hindi nagdaragdag ng di-tahasang kulay-militar gaya ng “nagmartsa.”
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Hebreo.
- source_word: אֶל תֵּבֵץ
  choice: sa Tebez
  rationale: Ipinahihiwatig ng אֶל ang paglapit o pagpunta sa isang lugar; hindi kailangang gawing “laban sa” dahil malinaw na ang pagsalakay sa kasunod na sugnay.
- source_word: וַיִּחַן בְּתֵבֵץ
  choice: nagkampo laban dito
  rationale: Ang חנה ay “magkampo.” Bagaman karaniwang “sa/loob ng” ang בְּ, sa kontekstong militar ay maaaring tumukoy sa pagkakampo laban sa isang lungsod.
- source_word: וַיִּלְכְּדָהּ
  choice: Sinakop niya ang lungsod
  rationale: Ang לכד ay karaniwang tumutukoy sa pagsakop o pagbihag sa isang lungsod. Nilinaw bilang “ang lungsod” ang pambabaeng hulapi na tumutukoy sa Tebez, upang maging natural sa Filipino.
