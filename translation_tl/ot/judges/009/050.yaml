  source_fidelity: 'Tumpak na naipapahayag ng salin ang tatlong magkakasunod na kilos sa Hebreo: pumunta si Abimelec sa Tebez, nagkampo siya laban dito, at sinakop niya ang lungsod. Ang “laban dito” ay isang makatwirang pagsasalin sa kontekstong pagkubkob, bagaman ang בְּ ay maaari ring unawain bilang “sa.”'
