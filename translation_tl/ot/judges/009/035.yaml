base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: tl
  text: Pagkatapos, lumabas si Gaal na anak ni Ebed at tumayo sa pasukan ng pintuang-bayan. Bumangon naman si Abimelec at ang mga taong kasama niya mula sa pananambang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa puwesto ng pananambang” o “mula sa kanilang pinagtaguan.” Maaaring tumukoy ang salitang Hebreo sa pananambang mismo o sa lugar na pinagtaguan ng mga mananambang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Ang יצא ay tumutukoy sa pagkilos palabas. Likas sa Filipino ang “lumabas” at hindi nito ipinapalagay kung papunta o papalayo ang kilos mula sa pananaw ng tagapagsalaysay.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: si Gaal na anak ni Ebed
  rationale: Pinanatili ang mga pangalang pantangi sa transliterasyon at isinalin nang tuwiran ang patronimikong parirala.
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Karaniwang kahulugan ng עמד ang “tumayo.” Hindi idinagdag ang posibleng diwang militar na “pumuwesto,” sapagkat hindi iyon tahasang nakasaad.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: sa pasukan ng pintuang-bayan
  rationale: Ang פתח ay “pasukan/bukana,” at ang שער העיר ay pintuan ng lungsod o bayan. Ang “pintuang-bayan” ay malinaw at likas na tawag sa tarangkahang pasukan ng isang sinaunang bayang napapaderan.
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Ang קום ay “bumangon/tumindig” at dito ay nagpapahiwatig ng pagsisimula nilang kumilos mula sa pagkakatago, nang hindi dinaragdagan ang salaysay.
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: at ang mga taong kasama niya
  rationale: Pinanatili ang literal na saklaw ng עם bilang “mga tao,” bagaman sa konteksto ay sila ang armadong pangkat ni Abimelec.
- source_word: מִן הַמַּאְרָב
  choice: mula sa kanilang pinagtaguan upang tumambang
  rationale: Maaaring tukuyin ng מַאְרָב ang mismong pananambang o ang lugar/puwestong pinagtaguan ng mga mananambang. Nililinaw ng salin ang taktikal na diwa habang pinananatili sa talababa ang tunay na alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “pintuang-bayan” upang malinaw na tumukoy sa tarangkahang pasukan ng sinaunang bayang napapaderan. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
