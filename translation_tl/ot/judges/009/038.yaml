base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: tl
  text: Pagkatapos, sinabi sa kanya ni Zebul, “Nasaan na ang bibig mong[a] nagsabi, ‘Sino ba si Abimelec para paglingkuran namin siya?’ Hindi ba ito ang mga taong hinamak mo? Lumabas ka ngayon at labanan mo siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “Nasaan na ang bibig mo?” Isa itong panunuya sa nauna niyang matapang na pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: Nasaan na ang bibig mo
  rationale: Pinananatili ang matingkad na larawang Hebreo at ang mapanuyang tanong. Sa konteksto, ang “bibig” ay tumutukoy sa naunang matapang at mapaghamong pananalita ni Gaal.
- source_word: אֲשֶׁר תֹּאמַר
  choice: mong nagsabi
  rationale: Natural itong nag-uugnay sa “bibig mo” at malinaw na ibinabalik kay Gaal ang sarili niyang sinabi.
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: Sino ba si Abimelec para paglingkuran namin siya?
  rationale: Ang “Sino ba” ay naghahatid ng mapanghamak na puwersa ng retorikal na tanong, habang ang “paglingkuran” ay tumpak sa עבד at hindi nagdaragdag ng denominasyonal na pakahulugan.
- source_word: הֲלֹא זֶה הָעָם
  choice: Hindi ba ito ang mga taong
  rationale: Pinananatili ang anyong retorikal. Bagaman kolektibong pangngalan ang הָעָם, mas natural sa Tagalog ang “mga taong” dahil tumutukoy ito sa pangkat na nasa harap nila.
- source_word: מָאַסְתָּה בּוֹ
  choice: hinamak mo
  rationale: Ipinahahayag ng “hinamak” ang paghamak at pagtatakwil na taglay ng מאס, at akma sa mapanuyang tono ni Zebul.
- source_word: צֵא נָא עַתָּה
  choice: Lumabas ka ngayon
  rationale: Ang צֵא ay utos na lumabas upang humarap sa labanan. Ang נָא ay nagbibigay rito ng mapanuyang paghimok, hindi ng magalang na “pakiusap,” kaya hindi isinaling “pakiusap.”
- source_word: וְהִלָּחֶם בּוֹ
  choice: at labanan mo sila
  rationale: Ang pandiwa ay nangangahulugang makipaglaban. Singular ang gramatikal na panghalip sa Hebreo dahil kolektibong singular ang “bayan/mga tao,” ngunit natural na maramihan sa Tagalog ang pagtukoy sa pangkat.
