translation_notes:
  register: Makabago at marangal na Filipino, na may tuwirang mapanuyang tono. Ginamit ang karaniwang anyong “Abimelec” at pinanatili ang literal na idyomang “Nasaan na ang bibig mo,” na ipinaliwanag sa talababa.
