  source_fidelity: 'Tumpak ang pangunahing diwa: isang di-pinangalanang babae ang naghagis ng pang-ibabaw na bato ng gilingan sa ulo ni Abimelec, na nagdurog sa kanyang bungo. Napananatili rin ng talababa ang leksikal na posibilidad na ang פֶּלַח ay tumutukoy sa isang piraso o tipak.'
  naturalness: Nauunawaan ang draft, ngunit mas likas at mas malinaw sa modernong Filipino ang “pang-ibabaw na bato ng gilingan” kaysa “pang-ibabaw na batong gilingan.” Ang tahasang “bungo ni Abimelec” ay nag-aalis din ng anumang bahagyang kalabuan sa panghalip na “kanyang.”
