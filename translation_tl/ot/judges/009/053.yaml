  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: tl
  text: Ngunit isang babae ang naghagis ng isang pang-ibabaw na bato ng gilingan[a] sa ulo ni Abimelec at dinurog ang bungo ni Abimelec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang piraso ng pang-ibabaw na bato ng gilingan”; maaaring idinidiin ng pariralang Hebreo na bahagi o tipak ito ng pang-ibabaw na bato.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: naghagis
  rationale: Aktibong paghagis ang ipinapahayag ng שׁלך; natural at malinaw ang “naghagis” sa makabagong Filipino, at hindi ito kasinghina ng “nahulog.”
- source_word: אִשָּׁה אַחַת
  choice: isang babae
  rationale: Tuwirang katumbas ito ng “one woman” at natural ding ginagamit sa salaysay upang ipakilala ang isang di-pinangalanang babae.
- source_word: פֶּלַח רֶכֶב
  choice: pang-ibabaw na batong gilingan
  rationale: Ang רֶכֶב ay tumutukoy sa pang-ibabaw na bato ng gilingan. Maaaring idiin ng פֶּלַח na ito ay isang bahagi o piraso, kaya pinanatili ang posibilidad na iyon sa talababa.
- source_word: עַל רֹאשׁ
  choice: sa ulo
  rationale: Likas na Filipino para sa tuwirang lokasyon ng pagtama.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Transliterasyong angkop sa baybay at bigkas sa Filipino.
- source_word: וַתָּרִץ
  choice: dinurog
  rationale: Ipinahahayag ng רצץ ang pagdurog o matinding pagbasag; malinaw at sapat ang tindi ng “dinurog” sa konteksto.
- source_word: גֻּלְגָּלְתּוֹ
  choice: ang kanyang bungo
  rationale: Partikular na tumutukoy ang pangngalan sa bungo, hindi lamang sa ulo.
