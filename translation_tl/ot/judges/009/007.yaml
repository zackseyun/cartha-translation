  to: Nang sabihin nila ito kay Jotam, pumunta siya at tumayo sa tuktok ng Bundok Gerizim. Nilakasan niya ang kanyang tinig, sumigaw, at sinabi sa kanila, “Makinig kayo sa akin, kayong mga pinuno ng Shekem,[a] upang makinig sa inyo ang Diyos.”[b]
