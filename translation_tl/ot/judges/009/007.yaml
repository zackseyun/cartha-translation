  text: וַ/יַּגִּ֣דוּ לְ/יוֹתָ֗ם וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲמֹד֙ בְּ/רֹ֣אשׁ הַר גְּרִזִ֔ים וַ/יִּשָּׂ֥א קוֹל֖/וֹ וַ/יִּקְרָ֑א וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְע֤וּ אֵלַ/י֙ בַּעֲלֵ֣י שְׁכֶ֔ם וְ/יִשְׁמַ֥ע אֲלֵי/כֶ֖ם אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: tl
  text: Nang sabihin nila ito kay Jotam, pumunta siya at tumayo sa tuktok ng Bundok Gerizim. Nilakasan niya ang kanyang tinig, sumigaw, at sinabi sa kanila, “Makinig kayo sa akin, kayong mga pinuno ng Shekem,[a] upang makinig sa inyo ang Diyos.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga panginoon” o “mga may-ari ng Shekem.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at makinig nawa sa inyo ang Diyos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: Nang sabihin nila ito kay Jotam
  rationale: Ang Hiphil ng נגד ay karaniwang nangangahulugang magsabi o magbalita. Idinagdag ang “ito” bilang likas na layon sa Tagalog na malinaw mula sa konteksto, samantalang pinanatili ang di-tiyak na maramihang simuno.
- source_word: וַיֵּלֶךְ וַיַּעֲמֹד
  choice: pumunta siya at tumayo
  rationale: Payak at likas na salaysay sa Tagalog na tapat sa sunod-sunod na kilos sa Hebreo.
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: sa tuktok ng Bundok Gerizim
  rationale: Ang רֹאשׁ sa heograpikong gamit ay “tuktok,” at ang “Bundok Gerizim” ang malinaw na anyo ng pangalan ng lugar.
- source_word: וַיִּשָּׂא קוֹלוֹ
  choice: Nilakasan niya ang kanyang tinig
  rationale: Likas na modernong Tagalog para sa idyomang Hebreo na literal na “itinaas niya ang kanyang tinig,” ibig sabihin ay nagsalita siya nang malakas.
- source_word: וַיִּקְרָא וַיֹּאמֶר לָהֶם
  choice: at sumigaw sa kanila
  rationale: Ipinahahayag ng קרא ang malakas na pampublikong pagtawag. Ang kasunod na tuwirang sipi ang gumaganap sa diwa ng “sinabi,” kaya iniiwasan ang mabigat na “sumigaw at sinabi sa kanila.”
- source_word: שִׁמְעוּ אֵלַי
  choice: Makinig kayo sa akin
  rationale: Tuwiran at kasalukuyang Tagalog para sa pautos na שמע na may אֵלַי.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: mga pinuno ng Shekem
  rationale: Literal na tumutukoy ang בַּעֲלֵי sa mga panginoon, may-ari, o makapangyarihang tao. Sa konteksto, “mga pinuno” ang pinakamalinaw at likas na tawag sa mga may kapangyarihan sa Shekem; inilagay sa talababa ang mas literal na saklaw.
- source_word: וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: upang makinig din sa inyo ang Diyos
  rationale: Binabasa ang waw at imperfect bilang layunin o resulta ng panawagan. Ang “makinig” ay inuulit upang mapanatili ang retorikal na ugnayan sa naunang שמע; ipinakikita ng “din” ang katumbasang ipinahihiwatig ng pahayag.
theological_decisions:
- issue: Lakas ng panghuling sugnay ni Jotam
  choice: upang makinig din sa inyo ang Diyos
  alternative: at makinig nawa sa inyo ang Diyos
  rationale: 'Maaaring ipahayag ng Hebreong waw na sinusundan ng imperfect ang layunin/resulta, o isang kahilingang kahawig ng jussive. Pinili sa teksto ang layunin/resulta dahil malinaw nitong ipinakikita ang retorikal na ugnayan: makinig sila kay Jotam upang makinig ang Diyos sa kanila. Inilalagay sa talababa ang tunay na posibleng pagbasa bilang kahilingan.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Gumamit ng “mga pinuno” sa pangunahing teksto para sa likas at kontekstuwal na linaw, habang pinanatili sa talababa ang mas literal na kahulugan. Hindi pinawi ang sintaktikong ambiguwidad ng huling sugnay.
