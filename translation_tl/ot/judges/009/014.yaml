base_translation:
  language: en
  yaml_path: translation/ot/judges/009/014.yaml
  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: tl
  text: Pagkatapos, sinabi ng lahat ng puno sa matinik na palumpong[a], “Halika, maghari ka sa amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palumpong na tinik.” Ang salitang Hebreo na אָטָד ay tumutukoy sa isang matinik na palumpong; hindi tiyak ang mismong uri ng halaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: כָל הָעֵצִים
  choice: ng lahat ng puno
  rationale: Tuwirang isinasalin ang kolektibong simuno at pinananatili ang kabuuang saklaw ng כָל.
- source_word: אֶל הָאָטָד
  choice: sa matinik na palumpong
  rationale: Ang אָטָד ay isang matinik na palumpong o mababang halamang-kahoy; hindi tinutukoy nang labis ang tiyak na uri ng halaman.
- source_word: לֵךְ אַתָּה
  choice: Halika
  rationale: Sa kontekstong ito, ang imperatibong לֵךְ bago ang isa pang pautos ay isang masidhing pag-anyaya o pagtatalaga. Likas sa Tagalog ang “Halika,” habang ang diin ng אַתָּה ay naipahihiwatig ng kasunod na “ka.”
- source_word: מְלָךְ עָלֵינוּ
  choice: maghari ka sa amin
  rationale: Pinananatili ng “maghari” ang maharlikang diwa ng pandiwa at natural itong ginagamit kasama ng “sa amin.”
