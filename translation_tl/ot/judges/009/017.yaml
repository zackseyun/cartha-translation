  text: אֲשֶׁר נִלְחַ֥ם אָבִ֖/י עֲלֵי/כֶ֑ם וַ/יַּשְׁלֵ֤ךְ אֶת נַפְשׁ/וֹ֙ מִ/נֶּ֔גֶד וַ/יַּצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/017.yaml
  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: tl
  text: sapagkat nakipaglaban ang aking ama para sa inyo, isinapanganib niya ang kanyang buhay[a], at iniligtas kayo mula sa kamay ng Midian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “inihagis niya ang kanyang buhay sa harapan,” isang idyomang nangangahulugang inilantad niya ang sarili sa panganib na maaaring ikamatay.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa kapangyarihan ng Midian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: sapagkat
  rationale: Sa konteksto, ang pang-ugnay ay nagbibigay ng dahilan na sumusuporta sa paratang ni Jotam sa naunang talata; malinaw at natural ang “sapagkat” sa Filipino.
- source_word: נִלְחַם אָבִי עֲלֵיכֶם
  choice: nakipaglaban ang aking ama para sa inyo
  rationale: Ang pandiwa ay nangangahulugang makipaglaban, at ang עֲלֵיכֶם dito ay tumutukoy sa pakinabang ng mga kausap, hindi sa pakikipaglaban laban sa kanila.
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: isinapanganib niya ang kanyang buhay
  rationale: Ang literal na larawan ng paghahagis ng sariling buhay sa harapan ay isang idyoma para sa pagharap sa panganib na maaaring ikamatay. Inihahatid ng salin ang kahulugan nang natural, habang inilalagay sa talababa ang literal na larawan.
- source_word: וַיַּצֵּל
  choice: iniligtas
  rationale: Ang Hiphil ng נצל ay nangangahulugang sagipin o iligtas mula sa kapangyarihan o panganib; ang “iniligtas” ay angkop sa kontekstong militar.
- source_word: מִיַּד מִדְיָן
  choice: mula sa kamay ng Midian
  rationale: Pinananatili nito ang Hebreong larawang “kamay,” na tumutukoy sa kapangyarihan o kontrol, at nananatiling malinaw sa Filipino.
