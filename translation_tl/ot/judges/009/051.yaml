  text: וּ/מִגְדַּל עֹז֮ הָיָ֣ה בְ/תוֹךְ הָ/עִיר֒ וַ/יָּנֻ֨סוּ שָׁ֜מָּ/ה כָּל הָ/אֲנָשִׁ֣ים וְ/הַ/נָּשִׁ֗ים וְ/כֹל֙ בַּעֲלֵ֣י הָ/עִ֔יר וַֽ/יִּסְגְּר֖וּ בַּעֲדָ֑/ם וַֽ/יַּעֲל֖וּ עַל גַּ֥ג הַ/מִּגְדָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: tl
  text: Ngunit may isang matibay na tore sa gitna ng lungsod[a]. Tumakas papunta roon ang lahat ng lalaki at babae, pati ang lahat ng pinuno ng lungsod[b]. Nagkulong sila roon at umakyat sa bubong ng tore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang toreng tanggulan.” Literal na pinagsasama sa Hebreo ang “tore” at “lakas,” na nagdidiin sa gamit nito bilang depensa.
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng mga pangunahing tao ng lungsod.” Ang Hebreong parirala ay literal na “mga may-ari” o “mga panginoon ng lungsod” at sa kontekstong ito ay tumutukoy sa mga pangunahing tao nito, hindi kinakailangang sa lahat ng mamamayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: matibay na tore
  rationale: Tuwirang pinagsasama nito ang 'tore' at ang diwa ng lakas o tanggulan, habang nananatiling natural sa makabagong Tagalog.
- source_word: בְּתוֹךְ הָעִיר
  choice: sa gitna ng lungsod
  rationale: Pinananatili ang tiyak na diwang panlunan ng בְּתוֹךְ bilang 'sa gitna,' hindi lamang 'sa loob.'
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: Tumakas papunta roon
  rationale: Ang נוּס ay 'tumakas'; ipinahahayag ng 'papunta roon' ang direksiyong taglay ng שָׁמָּה nang hindi idinaragdag na doon sila sumilong.
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: ang lahat ng lalaki at babae
  rationale: Pinananatili ang hayagang pagbanggit ng Hebreo sa kapwa mga lalaki at mga babae.
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: pati ang lahat ng pinuno ng lungsod
  rationale: Sa kontekstong sibiko, ang בַּעֲלֵי הָעִיר ay malamang na tumutukoy sa mga pangunahing tao o pinuno ng lungsod; inilalahad sa talababa ang mas literal na katawagan.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: Nagkulong sila roon
  rationale: Natural na Tagalog ito para sa literal na diwang 'isinara nila sa likuran/para sa kanilang sarili,' nang hindi nagdaragdag ng tahasang pintuan na wala sa teksto.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: umakyat sa bubong ng tore
  rationale: Tumpak na pinananatili ang kilos na pag-akyat at ang גַּג bilang 'bubong,' hindi lamang 'tuktok.'
theological_decisions: []
