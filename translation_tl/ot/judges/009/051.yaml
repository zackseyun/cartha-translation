  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod” at “tore” bilang karaniwang salitang madaling maunawaan; hinati sa tatlong pangungusap ang mahabang sugnay na Hebreo para sa likas na daloy nang hindi binabago ang pagkakasunod-sunod ng mga pangyayari.
