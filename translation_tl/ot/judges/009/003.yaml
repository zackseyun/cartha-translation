base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: tl
  text: At sinabi ng mga kapatid na lalaki ng kanyang ina ang lahat ng salitang ito[b] tungkol sa kanya sa pandinig ng lahat ng pinuno ng Shekem[a]. Ang kanilang mga puso ay kumiling kay Abimelec, sapagkat sinabi nila, “Kapatid natin siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng mga panginoon ng Shekem” o “lahat ng mga pangunahing lalaki ng Shekem.” Ang pananalitang Hebreo ay tumutukoy sa mga maimpluwensiyang lalaki ng lunsod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng bagay na ito” o “lahat ng usaping ito.” Ang salitang Hebreo ay maaaring mangahulugang mga salita o mga bagay/usapin, ngunit dito ay malamang na tumutukoy sa panukalang iniulat sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: sinabi
  rationale: Sa kontekstong pasalaysay, ang piel ng דבר na may tuwirang layon na “mga salita” ay likas na maisasalin na “sinabi” sa modernong Tagalog.
- source_word: אֲחֵי אִמּוֹ
  choice: mga kapatid na lalaki ng kanyang ina
  rationale: Tiyak na tumutukoy ang parirala sa mga lalaking kapatid ng ina ni Abimelec, hindi lamang sa malawak na kamag-anakan.
- source_word: עָלָיו
  choice: tungkol sa kanya
  rationale: Pinananatili nito ang lantad na kahulugang “hinggil sa kanya” nang hindi ipinapasok ang mas interpretibong “alang-alang sa kanya.”
- source_word: בְּאָזְנֵי
  choice: sa pandinig ng
  rationale: Inililipat nito nang malinaw ang idyomang Hebreo na literal na “sa mga tainga ng,” ibig sabihin ay sinabi upang marinig ng isang pangkat.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: lahat ng mga pinuno ng Shekem
  rationale: Sa pampolitikang konteksto, ang בעלי ay tumutukoy sa mga maimpluwensiya o namumunong lalaki ng lunsod, hindi kinakailangang sa lahat ng naninirahan doon.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ang lahat ng salitang ito
  rationale: Bagaman maaaring mangahulugang “mga bagay” o “mga usapin” ang דברים, dito ay tumutukoy ito sa panukalang ipinahayag sa naunang talata.
- source_word: וַיֵּט לִבָּם
  choice: kumiling ... ang kanilang mga puso
  rationale: Pinananatili nito ang metapora ng Hebreo para sa panloob na pagkiling o pagpapasya, habang natural pa rin sa marangal na Tagalog.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: kay Abimelec
  rationale: Kasama ng “kumiling,” ipinahahayag nito ang pagkiling ng loob at pagsuporta kay Abimelec; ang literal na “sumunod kay” ay maaaring magpahiwatig agad ng aktuwal na pagkilos.
- source_word: כִּי אָמְרוּ
  choice: sapagkat sinabi nila
  rationale: Dito, ang כִּי ay nagbibigay ng dahilan kung bakit sila kumiling kay Abimelec.
- source_word: אָחִינוּ הוּא
  choice: Kapatid natin siya
  rationale: Pinananatili ang tuwirang panawagan sa pagkakaugnay ng angkan; sa konteksto, ang “kapatid” ay mas malawak na pagkakamag-anak sa pamamagitan ng kanyang inang taga-Shekem.
