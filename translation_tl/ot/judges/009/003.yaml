translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga kapatid na lalaki ng kanyang ina” para sa eksaktong ugnayang pampamilya at “kumiling ... ang kanilang mga puso” upang mapanatili ang Hebreong metapora. Ang baybay na “Shekem” at “Abimelec” ay madaling basahin sa Tagalog.
