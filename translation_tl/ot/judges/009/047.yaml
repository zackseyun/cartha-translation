  yaml_path: translation/ot/judges/009/047.yaml
  text: And it was reported to Abimelech that all the leaders of the tower of Shechem had gathered together.
translation:
  language: tl
  text: Ibinalita kay Abimelec na nagtipon ang lahat ng pinuno ng tore ng Shekem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד (wayyuggad)
  choice: Ibinalita
  rationale: Ang pasibong anyo ay nangangahulugang ipinaalam o iniulat; pinananatili ng “Ibinalita” ang di-tinukoy na tagapagbalita at natural ito sa modernong Tagalog.
- source_word: בַּעֲלֵי (baʿalê)
  choice: mga pinuno
  rationale: Sa kontekstong pampolitika ng salaysay, tumutukoy ito sa mga pangunahing tao o namumuno sa pamayanan, hindi sa mga diyos o literal na mga may-ari.
- source_word: מִגְדַּל שְׁכֶם (migdal šĕkem)
  choice: tore ng Shekem
  rationale: Tuwirang pinananatili ang pangalang heograpiko at ang karaniwang kahulugan ng מִגְדָּל bilang tore.
- source_word: הִתְקַבְּצוּ (hitqabbĕṣû)
  choice: nagtipon
  rationale: Likas na katumbas ng kusang sama-samang pagtitipon na ipinahihiwatig ng hitpael na anyo.
