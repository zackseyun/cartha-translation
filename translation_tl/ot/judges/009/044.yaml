  text: וַ/אֲבִימֶ֗לֶךְ וְ/הָ/רָאשִׁים֙ אֲשֶׁ֣ר עִמּ֔/וֹ פָּשְׁט֕וּ וַ/יַּ֣עַמְד֔וּ פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וּ/שְׁנֵ֣י הָֽ/רָאשִׁ֗ים פָּֽשְׁט֛וּ עַֽל כָּל אֲשֶׁ֥ר בַּ/שָּׂדֶ֖ה וַ/יַּכּֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: tl
  text: At mabilis na sumalakay si Abimelec at ang mga pinunong kasama niya, at pumuwesto sila sa pasukan ng pintuang-bayan. Samantala, sumalakay ang dalawa pang pangkat[a] sa lahat ng nasa bukid at pinabagsak sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang dalawang pinuno.” Sa konteksto, malamang na tumutukoy ito sa dalawa pang pangkat o dibisyon sa tatlong pangkat na binanggit sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: mabilis na sumalakay / sumalakay
  rationale: Sa kontekstong militar, tumutukoy ito sa mabilis na pagsulong upang umatake, hindi lamang sa pagkalat.
- source_word: הָרָאשִׁים
  choice: mga pinuno
  rationale: Literal na “mga ulo”; dito ay tumutukoy sa mga namumuno sa mga pangkat ng hukbo ni Abimelec.
- source_word: וַיַּעַמְדוּ
  choice: pumuwesto sila
  rationale: Ipinahihiwatig ng pandiwa ang sinasadyang paglalagay ng sarili sa isang estratehikong lugar, hindi lamang basta pagtayo.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: sa pasukan ng pintuang-bayan
  rationale: Natural na Filipino para sa bukana o pasukan ng tarangkahang nagbibigay-daan papasok sa lungsod.
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: ang dalawa pang pangkat
  rationale: Bagaman literal na inuulit ng Hebreo ang “dalawang pinuno,” ipinakikita ng naunang talata na hinati ni Abimelec ang kanyang mga tauhan sa tatlong pangkat; kaya malamang na ang dalawang natitirang pangkat ang tinutukoy.
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: sa lahat ng nasa bukid
  rationale: Pinananatili ang malawak na pananalita ng Hebreo, habang ipinahihiwatig ng kasunod na panghalip na mga tao ang tinutukoy.
- source_word: וַיַּכּוּם
  choice: pinabagsak sila
  rationale: Ipinapahayag ang marahas na pananakit o pagpatay nang hindi tiyak na sinasabing namatay ang bawat isa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pintuang-bayan” para sa sinaunang tarangkahan ng lungsod at “pumuwesto” para sa sinasadyang taktikal na paglalagay. Ang pangalang Abimelech ay isina-Filipino bilang “Abimelec.”
