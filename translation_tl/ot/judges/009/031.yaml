  text: וַ/יִּשְׁלַ֧ח מַלְאָכִ֛ים אֶל אֲבִימֶ֖לֶךְ בְּ/תָרְמָ֣ה לֵ/אמֹ֑ר הִנֵּה֩ גַ֨עַל בֶּן עֶ֤בֶד וְ/אֶחָי/ו֙ בָּאִ֣ים שְׁכֶ֔מָ/ה וְ/הִנָּ֛/ם צָרִ֥ים אֶת הָ/עִ֖יר עָלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: tl
  text: At palihim[a] na nagpadala si Zebul ng mga mensahero kay Abimelek upang sabihin, “Narito, dumating sa Shekem si Gaal na anak ni Ebed kasama ang kanyang mga kapatid, at ngayon ay inuudyukan nila ang lungsod laban sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “nang may panlilinlang.” Mahirap tiyakin ang kahulugan ng salitang Hebreo rito. Posible rin ang pagbasa sa huling bahagi: “kinukubkob nila ang lungsod laban sa iyo.” Sa konteksto, malamang na ang diwa ay inuudyukan ni Gaal at ng kanyang pangkat ang Shekem laban kay Abimelek.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: At nagpadala si Zebul
  rationale: Ang wayyiqtol ay ipinahayag bilang payak na nagdaang kilos. Tahasang pinangalanan si Zebul mula sa agarang konteksto upang maging likas at malinaw sa Tagalog ang panghalip na nasa Hebreo.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Mga taong tagapagdala ng lihim na mensahe ang tinutukoy sa kontekstong pampolitika at militar.
- source_word: בְּתָרְמָה
  choice: palihim
  rationale: Ipinahahayag nito ang patago o mapanlinlang na paraan ng pagpapadala. Ang “palihim” ay malinaw ngunit hindi labis na nagtatakda ng moral na kulay.
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pantawag-pansing lakas ng kataga sa isang marangal ngunit kasalukuyang paraan ng pagsasalita.
- source_word: גַעַל בֶּן עֶבֶד וְאֶחָיו
  choice: si Gaal na anak ni Ebed kasama ang kanyang mga kapatid
  rationale: Tuwirang pinananatili ang ugnayang “anak ni” at ang literal na “mga kapatid,” bagaman maaaring mas malawak ang saklaw nito sa konteksto.
- source_word: בָּאִים שְׁכֶמָה
  choice: dumating sa Shekem
  rationale: Ipinakikita ng participle at directional ending ang pagdating na may kasalukuyang kabuluhan; natural itong naipahahayag sa Tagalog sa aspektong naganap.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: inuudyukan nila ang lungsod laban sa iyo
  rationale: Mahirap ang pandiwang צור dito. Ang bagay na “lungsod” at ang pariralang “laban sa iyo” ay umaangkop sa pag-uudyok sa mga mamamayan laban kay Abimelek; inilalagay sa talababa ang mas literal na posibleng pagbasa.
