translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang baybay na “Shekem” at pinanatili ang bigat ng pampolitikang ulat nang hindi nilulutas nang tahasan ang kahirapang leksikal ng Hebreo.
