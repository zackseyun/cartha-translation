id: JDG.9.26
reference: Judges 9:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֞א גַּ֤עַל בֶּן עֶ֨בֶד֙ וְ/אֶחָ֔י/ו וַ/יַּעַבְר֖וּ בִּ/שְׁכֶ֑ם וַ/יִּבְטְחוּ ב֖/וֹ בַּעֲלֵ֥י שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: tl
  text: Pagkatapos, dumating si Gaal na anak ni Ebed kasama ang mga kapatid niya, at pumasok sila sa Shekem.[a] Nagtiwala naman sa kanya ang mga pinuno ng Shekem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumaan sila sa Shekem” o “tumawid sila papasok sa Shekem.” Maaaring mangahulugan ang pandiwang Hebreo ng pagtawid o pagdaan, at hindi tiyak ang eksaktong diwa rito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga panginoon ng Shekem”; tumutukoy ito sa mga pangunahing lalaki o may hawak ng kapangyarihan sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, dumating
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Pagkatapos” upang ihayag ang pagkakasunod-sunod.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: si Gaal na anak ni Ebed
  rationale: Isinalin ang karaniwang patronymic construction habang tina-transliterate ang mga pangalang pantangi.
- source_word: וְאֶחָיו
  choice: kasama ang mga kapatid niya
  rationale: Bagaman payak na “at” ang pang-ugnay sa Hebreo, ipinahihiwatig ng ayos na kasama ni Gaal ang kanyang mga kapatid; natural itong ipahayag sa Tagalog bilang “kasama.”
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: pumasok sila sa Shekem
  rationale: Ang עבר ay may diwang tumawid o dumaan. Sa kontekstong ito, malinaw at natural ang “pumasok,” habang inilalagay sa talababa ang tunay na leksikal na kalabuan.
- source_word: וַיִּבְטְחוּ בוֹ
  choice: Nagtiwala naman sa kanya
  rationale: Ang בטח na may בְּ ay nagsasaad ng pagtitiwala o paglalagak ng kumpiyansa sa isang tao.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ang mga pinuno ng Shekem
  rationale: Dito, ang בעלי ay tumutukoy sa mga pangunahing lalaki o may hawak ng kapangyarihan sa lungsod, hindi kinakailangang sa lahat ng mamamayan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Shekem” bilang tuwirang transliterasyon ng שְׁכֶם. Iniwasan ang lipas na “mga panginoon” sa pangunahing teksto dahil maaaring magbigay iyon ng maling diwa, ngunit pinanatili ito bilang literal na alternatibo sa talababa.
