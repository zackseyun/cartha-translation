  source_fidelity: 'Tumpak na naihahatid ng salin ang sunod-sunod na kilos sa Hebreo: dumating si Gaal, kasama ang kaniyang mga kapatid, naglakbay/pumasok sila sa Shekem, at nagtiwala sa kaniya ang mga pinuno ng lungsod. Ang “pumasok sila sa Shekem” ay isang katanggap-tanggap na kontekstuwal na pagpili para sa וַיַּעַבְרוּ בִּשְׁכֶם, habang maayos na pinananatili ng talababa ang pinagdedebatihang diwa ng pagtawid o pagdaan.'
