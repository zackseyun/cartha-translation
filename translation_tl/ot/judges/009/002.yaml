  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: tl
  text: '“Sabihin ninyo, pakisuyo, sa lahat ng pinuno ng Shekem: ‘Alin ang mas mabuti para sa inyo: na pamunuan kayo ng pitumpung lalaki—lahat ng anak ni Jerubaal—o na pamunuan kayo ng isang lalaki? At alalahanin ninyo na ako ay sarili ninyong buto at laman[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idyomang Hebreo ang “buto at laman,” na nangangahulugang malapit na kamag-anak o sariling kadugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  choice: Pakisabi ninyo
  rationale: Ang maramihang pautos na may נָא ay isang magalang ngunit tuwirang pakiusap; natural itong ipinahahayag sa modernong Tagalog sa pamamagitan ng “Pakisabi ninyo.”
- source_word: בְּאָזְנֵי
  choice: sa pandinig ng
  rationale: Pinananatili nito ang larawang Hebreo ng pagsasalita upang marinig ng mga kinauukulan, pati ang diwa ng hayagang paghaharap ng mensahe.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: mga pinuno ng Shekem
  rationale: Maaaring tumukoy ang בַּעֲלֵי sa mga may-ari, mga panginoon, o mga pangunahing mamamayan. Sa kontekstong pampolitika, ang “mga pinuno” ay malinaw at natural, bagaman hindi nito nilalayong tukuyin ang isang tiyak na opisyal na ranggo.
- source_word: מַה טּוֹב לָכֶם
  choice: Alin ang mas mabuti para sa inyo
  rationale: Ipinahihiwatig ng dalawang kasunod na pagpipilian ang paghahambing; malinaw itong naipapahayag ng “alin ang mas mabuti.”
- source_word: הַמְשֹׁל בָּכֶם ... מְשֹׁל בָּכֶם
  choice: ang pamunuan kayo ... ang pamunuan kayo
  rationale: Ang משל dito ay tumutukoy sa paggamit ng kapangyarihang pampolitika. Pinananatili ang pag-uulit ng Hebreo sa parehong parirala.
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: pitumpung lalaki—lahat ng anak ni Jerubaal
  rationale: Tiyak na mga lalaking anak ni Jerubaal ang tinutukoy, kaya pinananatili ang kasarian at ang retorikal na diin sa dami.
- source_word: אִישׁ אֶחָד
  choice: isang lalaki
  rationale: Tumpak nitong pinananatili ang paghahambing ng pitumpung lalaki sa iisang lalaki.
- source_word: וּזְכַרְתֶּם
  choice: At alalahanin ninyo
  rationale: Ang anyo ay may puwersang humihimok sa kontekstong ito; ang “alalahanin” ay natural at may sapat na bigat.
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: sarili ninyong buto at laman
  rationale: Pinananatili ang kongkretong idyomang Hebreo tungkol sa malapit na pagkakamag-anak sa halip na agad itong gawing paliwanag lamang.
theological_decisions:
- issue: Idyoma ng pagkakamag-anak at posibleng labis na pagpapakahulugan
  choice: Panatilihin sa pangunahing teksto ang “sarili ninyong buto at laman.”
  alternative: “Kadugo ninyo ako” o “kamag-anak ninyo ako.”
  rationale: Ang literal na larawan ay may relasyonal at retorikal na bigat. Nililinaw ng talababa ang kahulugan nang hindi pinapawi ang anyo ng pahayag sa Hebreo.
- issue: Kasariang tinutukoy sa mga anak ni Jerubaal at kay Abimelek
  choice: Gamitin ang “pitumpung lalaki” at “isang lalaki.”
  alternative: “Pitumpung tao” at “isang tao.”
  rationale: Ang אִישׁ ay tumutukoy rito sa mga lalaking anak ni Jerubaal at sa lalaking nagsasalita; ang neutral na katawagan ay magpapalabo sa tiyak na sanggunian.
- issue: Saklaw ng בַּעֲלֵי שְׁכֶם
  choice: “mga pinuno ng Shekem”
  alternative: “mga mamamayan ng Shekem,” “mga may-ari sa Shekem,” o “mga panginoon ng Shekem.”
  rationale: Hindi ganap na tiyak ang katayuang panlipunan ng pangkat. Pinipili ang “mga pinuno” dahil akma ito sa kanilang kapangyarihang sibiko sa salaysay, nang hindi nag-aangkin ng tiyak na titularyong wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang magalang na maramihang “ninyo,” pinanatili ang retorikal na tanong at pag-uulit, at iniwasan ang sobrang pormal o makalumang pananalita. Ang baybay na “Shekem” at “Jerubaal” ay malapit sa mga pangalang Hebreo.
