base_translation:
  language: en
  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: tl
  text: Kinabukasan, lumabas ang mga tao papunta sa bukid, at ibinalita ito kay Abimelec.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at sinabi nila kay Abimelec”; pangmaramihan ang pandiwa ngunit walang tiyak na tinutukoy na simuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Kinabukasan
  rationale: Ang pariralang Hebreo ay nag-uugnay sa susunod na pangyayari at tumutukoy sa araw pagkatapos. Likas at malinaw sa makabagong Tagalog ang “Kinabukasan,” nang hindi gumagamit ng mabigat na “At nangyari.”
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Karaniwang pandiwa ito para sa paglabas mula sa isang lugar; ang konteksto ay paglabas ng mga tao mula sa lungsod.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Kolektibong tumutukoy ang עָם sa mamamayan o pangkat ng mga tao at hindi lamang sa mga lalaki.
- source_word: הַשָּׂדֶה
  choice: patungo sa bukid
  rationale: Ang שָׂדֶה ay bukas o sinasakang lupain sa labas ng lungsod. Ipinahahayag ng “patungo sa bukid” ang direksiyon ng paglabas nang natural sa Tagalog.
- source_word: וַיַּגִּדוּ
  choice: at ibinalita ito
  rationale: Pangmaramihan ang pandiwang Hebreo ngunit walang tinukoy na gumaganap. Ang pasibong ayos sa Tagalog ay natural na naghahatid ng di-tiyak na tagapagbalita nang hindi nagdaragdag ng partikular na simuno.
- source_word: לַאֲבִימֶלֶךְ
  choice: kay Abimelec
  rationale: Ginamit ang anyong “Abimelec,” isang malinaw at karaniwang baybay-Filipino ng pangalang Hebreo, kasama ang pantukoy na “kay” para sa taong pinagbalitaan.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na salaysay. Pinili ang likas na “Kinabukasan” at pasibong “ibinalita ito” upang mapanatili ang daloy at ang di-tiyak na tagapagbalita sa Hebreo.
