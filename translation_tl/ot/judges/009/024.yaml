base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: tl
  text: upang dumating[a] ang karahasang ginawa sa pitumpung anak ni Jerubaal, at upang maipatong ang kanilang dugo kay Abimelec, na kapatid nila at siyang pumatay sa kanila, at sa mga pinuno ng Shekem,[b] na sumuporta sa kanya[c] upang patayin ang kanyang mga kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “upang dumating ang karahasang ginawa sa pitumpung anak ni Jerubaal.” Idyomatikong ipinahihiwatig nito na ang marahas na kamaliang ginawa sa kanila ay darating sa mga may pananagutan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga panginoon ng Shekem”; tumutukoy ang Hebreo sa mga nangunguna o makapangyarihang lalaki ng lungsod.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “nagpalakas sa kanyang mga kamay,” isang idyoma para sa pagsuporta o pagtangkilik sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא חֲמַס שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: upang dumating ang kaparusahan sa karahasang ginawa sa pitumpung anak ni Jerubaal
  rationale: Ang לָבוֹא ay nagpapahayag ng layunin o bunga kasunod ng naunang talata. Ang חֲמַס ay marahas na kasalanan o karahasang ginawa laban sa mga anak ni Jerubaal. Idinagdag ang “kaparusahan sa” upang maging likas at malinaw sa Filipino ang diwang ang karahasang ito ay babalik bilang pananagutan, habang itinatala sa talababa ang mas literal na anyo.
- source_word: שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: pitumpung anak ni Jerubaal
  rationale: Tuwirang salin ng pariralang konstrak; pinanatili ang pangalang Jerubaal.
- source_word: וְדָמָם לָשׂוּם עַל
  choice: ipataw ... ang pananagutan sa kanilang dugo
  rationale: Ang literal na “ilagay ang kanilang dugo sa” ay isang idyomang tumutukoy sa pagpapanagot dahil sa dugong dumanak. Ginawang malinaw sa modernong Filipino ang legal at moral na diwa, ngunit pinanatili ang larawan ng dugo.
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: kay Abimelec na kapatid nila
  rationale: Pinananatili ang appositional na pagkakakilanlan at ang retorikal na bigat na kapatid nila ang pumatay sa kanila.
- source_word: הָרַג
  choice: pumatay
  rationale: Karaniwang pandiwa para sa pagpatay; hindi ipinilit ang mas tiyak na legal na katawagang “pumaslang” o “murder” na hindi likas sa mismong lexeme.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: mga pinuno ng Shekem
  rationale: Sa konteksto, tumutukoy ito sa mga makapangyarihan o nangungunang lalaki ng lungsod, hindi sa lahat ng naninirahan doon.
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: sumuporta sa kanya
  rationale: Ang literal na “pinalakas ang kanyang mga kamay” ay isang idyoma para sa pagbibigay ng suporta o pagtangkilik. Ang tuwirang kahulugan ang ginamit sa pangunahing teksto para sa likas na modernong Filipino.
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: sa pagpatay sa kanyang mga kapatid
  rationale: Tuwirang pariralang nagpapahayag ng layunin; ang tinutukoy ay mga kapatid na lalaki ni Abimelec.
theological_decisions:
- issue: Larawan ng dugo at pananagutan sa pagdanak nito
  choice: “ipataw ... ang pananagutan sa kanilang dugo”
  alternative: “ilagay sa ... ang kanilang dugo”
  rationale: Pinananatili ng salin ang larawan ng dugo ngunit ipinapahayag nang malinaw ang idyomatikong diwa ng pananagutan. Hindi nito tinutukoy kung ang pagdating ng kaparusahan ay awtomatikong paghihiganti o isang hiwalay na legal na hatol.
- issue: Karahasan na “dumarating”
  choice: “dumating ang kaparusahan sa karahasang ginawa”
  alternative: “dumating ang karahasang ginawa”
  rationale: Sa Filipino, hindi malinaw kung basta “dumarating” ang isang nagawang karahasan. Ipinahahayag ng salin ang bunga o kaparusahang bumabalik dahil dito, habang ipinakikita sa talababa ang mas literal na anyo at pinananatili ang ugnayang layunin/bunga sa konteksto.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “kaparusahan” at “pananagutan” upang maging natural ang mga Hebreong idyoma, samantalang ang mas literal na mga larawan ay inilagay sa mga talababa. Ang baybay na “Shekem” at “Abimelec” ay malinaw at madaling basahin sa Filipino.
