base_translation:
  language: en
  yaml_path: translation/ot/judges/009/039.yaml
  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: tl
  text: Kaya lumabas si Gaal sa unahan ng mga pinuno ng Shekem at nakipaglaban kay Abimelec.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa harap ng mga pinuno ng Shekem”; maaaring tumukoy ang pananalita sa posisyon ni Gaal sa harapan o sa pangunguna niya sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Karaniwang salaysay na anyo ng יצא; natural na ipinahihiwatig na lumabas siya upang humarap sa labanan.
- source_word: גַעַל
  choice: Gaal
  rationale: Transliterasyon ng pangalang pantangi ayon sa bigkas ng Hebreo.
- source_word: לִפְנֵי
  choice: sa unahan ng
  rationale: Pinananatili ang pangunahing larawang lokatibo ng 'nasa harap ng' habang natural na ipinahihiwatig sa kontekstong militar na nanguna si Gaal.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: mga pinuno ng Shekem
  rationale: Sa konteksto, tumutukoy ang בַּעֲלֵי sa mga pangunahing mamamayan o may kapangyarihan sa lunsod; malinaw at kasalukuyang Filipino ang 'mga pinuno.'
- source_word: וַיִּלָּחֶם
  choice: nakipaglaban
  rationale: Natural na salin ng Niphal ng לחם na nangangahulugang lumaban o makipagdigma.
- source_word: בַּאֲבִימֶלֶךְ
  choice: kay Abimelec
  rationale: Sa konstruksiyong kasama ng לחם, minamarkahan ng ב ang kalaban; sapat na malinaw sa Filipino ang 'nakipaglaban kay Abimelec.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sa unahan ng' upang maipahayag ang idiomatikong puwersa ng לִפְנֵי nang hindi lubusang inaalis ang posibleng literal na kahulugang lokatibo; inilagay sa talababa ang tunay na ambiguwidad.
