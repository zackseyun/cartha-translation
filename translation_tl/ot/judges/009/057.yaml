  text: וְ/אֵ֗ת כָּל רָעַת֙ אַנְשֵׁ֣י שְׁכֶ֔ם הֵשִׁ֥יב אֱלֹהִ֖ים בְּ/רֹאשָׁ֑/ם וַ/תָּבֹ֣א אֲלֵי/הֶ֔ם קִֽלֲלַ֖ת יוֹתָ֥ם בֶּן יְרֻבָּֽעַל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: tl
  text: At ibinalik ng Diyos sa sarili nilang ulo ang lahat ng kasamaan ng mga taga-Siquem, at sumapit sa kanila ang sumpa ni Jotam na anak ni Jerubaal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: ibinalik
  rationale: Sa Hiphil ng שוב, ang Diyos ang aktibong sanhi ng pagbabalik ng kasamaan sa mga gumawa nito. Pinananatili ng “ibinalik” ang kongkretong larawan ng Hebreo at ang diwa ng makatarungang pagganti.
- source_word: רָעַת
  choice: kasamaan
  rationale: Tumutukoy ito sa moral na kasamaang ginawa ng mga taga-Siquem, hindi lamang sa kapahamakan o masamang pangyayari.
- source_word: בְּרֹאשָׁם
  choice: sa sarili nilang ulo
  rationale: Pinananatili nito ang idyomatikong larawan ng Hebreo na ang bunga ng ginawa nila ay bumalik mismo sa kanila.
- source_word: קִלֲלַת
  choice: ang sumpa
  rationale: Tumutukoy ito sa sumpang binigkas ni Jotam sa naunang bahagi ng salaysay.
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: sumapit sa kanila
  rationale: Likas itong Filipino para sa isang ipinahayag na hatol na nagkabisa, habang pinananatili ang kilos ng pagdating sa Hebreo.
- source_word: אַנְשֵׁי שְׁכֶם
  choice: mga taga-Siquem
  rationale: Ang parirala ay tumutukoy nang sama-sama sa mga lalaking mamamayan ng Siquem. Ang “mga taga-Siquem” ay natural sa Filipino at hindi ito ginagawang partikular na mga pinuno.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang pang-isahang pandiwa at konteksto ay malinaw na tumutukoy sa Diyos na kumikilos bilang hukom.
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: Jotam na anak ni Jerubaal
  rationale: Ginagamit ang karaniwang anyong Filipino ng mga pangalang biblikal at tuwirang pinananatili ang pagkakakilanlan sa pamamagitan ng ama.
theological_decisions:
- issue: Aktibong pagganti ng Diyos
  choice: Aktibong ibinalik ng Diyos sa kanila ang kanilang kasamaan.
  alternative: Hinayaan lamang ng Diyos na bumalik sa kanila ang kanilang kasamaan.
  rationale: Ang Diyos ang tahasang simuno ng causative na pandiwang הֵשִׁיב. Hindi dapat palambutin ang ahensiya ng Diyos bilang pahintulot lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong larawan na “sa sarili nilang ulo,” samantalang ginamit ang natural na “sumapit” para sa pagsasakatuparan ng sumpa.
