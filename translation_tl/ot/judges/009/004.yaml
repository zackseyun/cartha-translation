base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: tl
  text: At binigyan nila siya ng pitumpung pirasong pilak[b] mula sa bahay ni Baal-berit[a]. Ginamit ni Abimelek ang pilak upang umupa ng mga lalaking walang halaga at padalos-dalos[c], at sumunod sila sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa templo ni Baal-berit.” Ang salitang Hebreo ay “bahay,” na sa kontekstong panrelihiyon ay maaaring tumukoy sa isang dambana o templo.
    reason: lexical_alternative
  - marker: b
    text: 'O “pitumpung siklong pilak.” Literal sa Hebreo: “pitumpung pilak,” isang halagang salapi na sinusukat ayon sa timbang.'
    reason: lexical_alternative
  - marker: c
    text: Literal na “mga lalaking walang laman at padalos-dalos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: pitumpung pirasong pilak
  rationale: Ang כֶּסֶף ay literal na “pilak” at maaari ring tumukoy sa salaping sinusukat ayon sa timbang. Natural sa Tagalog ang “pirasong pilak” at hindi nito ipinapalagay na tahasang binanggit ang siklo.
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: mula sa bahay ni Baal-berit
  rationale: Pinananatili ng “bahay” ang larawan ng Hebreo, samantalang nililinaw sa talababa na sa kontekstong panrelihiyon maaari itong mangahulugang templo o dambana. Ang Baal-berit ay isinalin sa baybay bilang pangalang pantangi.
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: Ginamit ... ang pilak upang umupa
  rationale: Ang panghalip na nakakabit sa ב ay tumutukoy sa pilak bilang ipinambayad. Ang pagbubuo ay natural sa Tagalog at malinaw ang kaugnayan nito sa salapi.
- source_word: אֲנָשִׁים רֵיקִים
  choice: mga lalaking walang kabuluhan
  rationale: Bagaman literal na “walang laman,” inilalarawan dito ng רֵיקִים ang mga taong walang saysay o mabuting katangian. Pinananatili ng “walang kabuluhan” ang matinding negatibong paglalarawan nang hindi nagdaragdag ng tiyak na krimen.
- source_word: וּפֹחֲזִים
  choice: walang ingat
  rationale: Ipinahihiwatig ng salita ang pagiging padalos-dalos, hindi mapigil, at di-maaasahan. Ang “walang ingat” ay payak at nauunawaan, habang nasa talababa ang mas literal na pagkakabuo ng buong parirala.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: sumunod sila sa kanya
  rationale: Ang literal na “lumakad sa likuran niya” ay isang idyomang nangangahulugang pumanig o sumama bilang mga tagasunod; natural itong ipinapahayag sa Tagalog bilang “sumunod sila sa kanya.”
