  yaml_path: translation/ot/judges/009/022.yaml
  text: Abimelech ruled over Israel for three years.
translation:
  language: tl
  text: Tatlong taong namahala si Abimelec sa Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: namahala
  rationale: Ang pandiwang mula sa שׂרר ay tumutukoy sa paggamit ng kapangyarihan o pamumuno. Natural sa modernong Filipino ang “namahala” at hindi nito ipinahihiwatig na lehitimong hari si Abimelec.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: עַל
  choice: sa
  rationale: Kasama ng “namahala,” natural na ipinahahayag ng “sa Israel” ang saklaw ng kanyang kapangyarihan; ang mas literal na “namahala sa ibabaw ng” ay hindi idiomatiko sa Filipino.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinanatili ang nakaugaliang anyo ng pangalan ng bansa sa Filipino.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: tatlong taon
  rationale: Tuwirang salin ng pariralang nagsasaad ng tagal; inilagay sa unahan upang maging natural at malinaw sa Filipino.
theological_decisions:
- issue: Uri at pagiging lehitimo ng pamumuno ni Abimelec
  choice: namahala
  alternative: naghari
  rationale: Hindi tahasang tinatawag ng Hebreong pandiwa si Abimelec na hari. Pinananatili ng “namahala” ang pampolitikang diwa nang hindi dinaragdagan ang teksto ng pahiwatig tungkol sa pagiging lehitimo o maharlika ng kanyang kapangyarihan.
translation_notes:
  register: Maikli, natural, at marangal na modernong Filipino. Pinanatili ang payak na ayos at hindi nilagyan ng paliwanag na wala sa Hebreo.
