  source_fidelity: Tapat ang salin sa Hebreo. Ang "Nang marinig ito" ay likas na pagsasalin ng וַיִּשְׁמְעוּ na may kontekstuwal na layon; ang "mga pinuno," "tore ng Shekem," at "pumasok sila sa" ay mahusay na tumutugma sa mga parirala ng pinagmulan. Ang "pinakaloob na silid" ay maingat na pagsasalin ng צְרִיחַ, at ang "templo ni El-berit" ay angkop sa kultikong gamit ng בֵּית nang hindi pinipilit ang pagkakakilanlan ng El-berit sa Baal-berit.
