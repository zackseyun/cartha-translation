base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: tl
  text: Nang marinig ito ng lahat ng pinuno ng tore ng Shekem[a], pumasok sila sa pinakaloob na silid[b] ng templo ni El-berit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Migdal-Shekem,” kung ituturing na pangalan ng lugar ang parirala sa halip na “tore ng Shekem.”
    reason: alternative_reading
  - marker: b
    text: O “matibay na silid,” “tanggulan,” o “silid sa loob.” Inilalarawan ng salitang Hebreo ang isang protektadong bahagi sa loob ng gusali.
    reason: lexical_alternative
  - marker: c
    text: Ang El-berit ay maaaring mangahulugang “Diyos ng tipan.” Ihambing ang kaugnay na pangalang “Baal-berit” sa ibang bahagi ng kabanatang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Nang marinig ito
  rationale: Ang pandiwa ay nangangahulugang “marinig.” Ipinahihiwatig ng konteksto na ang narinig nila ay ang naunang mga pangyayari, kaya likas sa Tagalog ang paglalagay ng “ito.”
- source_word: בַּעֲלֵי
  choice: mga pinuno
  rationale: Bagaman literal na “mga panginoon” o “mga may-ari,” tumutukoy ito rito sa mga pangunahing lalaki o namumuno sa pamayanan; malinaw at likas sa makabagong Tagalog ang “mga pinuno.”
- source_word: מִגְדַּל שְׁכֶם
  choice: tore ng Shekem
  rationale: Ang מִגְדַּל ay “tore.” Pinananatili sa pangunahing teksto ang malinaw na paglalarawang ito, habang inilalagay sa talababa ang posibilidad na ang buong parirala ay pangalan ng lugar.
- source_word: וַיָּבֹאוּ אֶל
  choice: pumasok sila sa
  rationale: Ipinapahayag ng pandiwa kasama ng pang-ukol ang pagkilos papasok sa pinangalanang kanlungan; likas itong naipahahayag sa Tagalog bilang “pumasok sila sa.”
- source_word: צְרִיחַ
  choice: pinakaloob na silid
  rationale: Tumutukoy ang salita sa isang protektadong silid sa loob, na maaari ring unawaing isang tanggulan o silid na may matibay na bubong. Hindi labis na tiyak ang “pinakaloob na silid.”
- source_word: בֵּית אֵל בְּרִית
  choice: templo ni El-berit
  rationale: Ang בֵּית ay literal na “bahay” ngunit karaniwang tumutukoy sa templo o dambana kapag tahanan ng isang diyos ang tinutukoy. Ang “templo” ay malinaw sa Tagalog, at pinananatili ang El-berit bilang pangalan o titulo.
theological_decisions:
- issue: Paglalarawan sa lugar ng pagsamba na בֵּית
  choice: templo
  alternative: bahay
  rationale: Sa kontekstong kultiko, ang “templo” ang likas at malinaw na katumbas sa Tagalog ng “bahay” ng isang diyos, nang hindi nagdaragdag ng denominasyonal na kahulugan.
- issue: Paglilipat ng pangalang o titulong אֵל בְּרִית
  choice: El-berit
  alternative: Diyos ng tipan
  rationale: Pinananatili ng transliterasyon ang tunay na kalabuan kung ito ba ay isang pantanging pangalan o titulong nangangahulugang “Diyos ng tipan,” at iniiwasan ang paghaharmonisa rito sa Baal-berit sa ibang talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Shekem” at “El-berit” bilang madaling basahing transliterasyon. Ang ayos na “Nang marinig ito…” ay likas sa salaysay na Tagalog at tapat sa ugnayan ng mga sugnay sa Hebreo.
