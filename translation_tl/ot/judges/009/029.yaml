base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: tl
  text: Kung nasa kamay ko lamang ang bayang ito[a], aalisin ko si Abimelec! At sinabi niya kay Abimelec[b], “Paramihin mo ang iyong hukbo at lumabas ka!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na salin, “Sino ang magbibigay ng bayang ito sa aking kamay? Aalisin ko si Abimelec.” Ang Hebreo ay gumagamit ng idyoma ng pagnanais: “Sino ang magbibigay...?”'
    reason: lexical_alternative
  - marker: b
    text: Ang hamong “Paramihin mo ang iyong hukbo at lumabas ka” ay malamang na panunuya kay Abimelec, tuwiran man itong sinabi sa kanya o binigkas bilang retorikal na hamon.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: Kung ... lamang
  rationale: Ang idyomang Hebreo ay nagpapahayag ng matinding pagnanais, hindi karaniwang literal na tanong. Likas sa modernong Tagalog ang hulma na “Kung ... lamang.”
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang עָם ay isang kolektibong pangngalan para sa pangkat ng mga tao. Pinananatili ng “bayang ito” ang kolektibong diwa nang hindi ito pinakikitid sa hukbo lamang.
- source_word: בְּיָדִי
  choice: nasa kamay ko
  rationale: Pinananatili nito ang metapora ng Hebreo para sa kapangyarihan o pamamahala; malinaw din ang idyoma sa Tagalog.
- source_word: וְאָסִירָה
  choice: aalisin ko
  rationale: Ang Hiphil ng סוּר ay nangangahulugang mag-alis. Hindi tinutukoy ng salita kung ito ay pagpapatalsik, pagtataboy, o pagpatay, kaya hindi iyon nilinaw nang higit sa teksto.
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: At sinabi niya kay Abimelec
  rationale: Karaniwang minamarkahan ng ל ang pinatutungkulan. Pinananatili ng salin na kay Abimelec nakatuon ang hamon, tuwiran man siyang kaharap o patuyang tinutukoy.
- source_word: רַבֶּה
  choice: Paramihin mo
  rationale: Ang pautos na anyo mula sa רבה ay tumatawag sa pagpaparami o pagpapalaki; sa hukbo, natural ang “paramihin.”
- source_word: צְבָאֲךָ
  choice: ang iyong hukbo
  rationale: Ang צָבָא ay karaniwang tumutukoy sa hukbo o puwersang pandigma; “hukbo” ang malinaw at dignified na katumbas.
- source_word: וָצֵאָה
  choice: at lumabas ka
  rationale: Ang pautos ng יצא ay “lumabas.” Ang ekspresyon ay angkop sa hamon sa isang kalaban na humarap sa labanan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Abimelec” bilang karaniwang anyong Tagalog ng pangalan. Pinanatili ang metaporang “nasa kamay ko” at ang hindi tiyak na saklaw ng “aalisin.”
