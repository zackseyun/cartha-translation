revisions:
- from: Sinabi ni Gaal na anak ni Ebed, “Sino ba si Abimelek, at sino ba ang Shekem[a], para maglingkod tayo sa kanya? Hindi ba’t anak siya ni Jerubaal, at si Zebul ang kanyang opisyal[b]? Paglingkuran ninyo ang mga tauhan ni Hamor[c], na ama ni Shekem! Ngunit bakit tayo maglilingkod sa kanya?”
  to: Sinabi ni Gaal na anak ni Ebed, “Sino ba si Abimelek, at sino ba ang Shekem[a], para maglingkod tayo sa kanya? Hindi ba’t anak siya ni Jerubaal, at si Zebul ang opisyal ni Abimelek[b]? Paglingkuran ninyo ang mga tao ni Hamor[c], na ama ni Shekem! Ngunit bakit tayo maglilingkod sa kanya?”
  rationale: Nilinaw ang ugnayan ni Zebul kay Abimelek upang maiwasan ang maling pagbasa ng panghalip. Pinalitan ang “mga tauhan” ng mas neutral na “mga tao” at inayos ang talababa upang maipaliwanag ang alusyon sa Genesis 34 nang hindi isinasara ang metonimikong kalabuan ng “Shekem.”
