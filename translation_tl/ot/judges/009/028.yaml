  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: tl
  text: Sinabi ni Gaal na anak ni Ebed, “Sino ba si Abimelek, at sino ba ang Shekem[a], para maglingkod tayo sa kanya? Hindi ba’t anak siya ni Jerubaal, at si Zebul ang opisyal ni Abimelek[b]? Paglingkuran ninyo ang mga tao ni Hamor[c], na ama ni Shekem! Ngunit bakit tayo maglilingkod sa kanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at ano ba ang Shekem?” Tuwirang binabanggit sa Hebreo ang pangalang “Shekem,” na malamang na kumakatawan sa lungsod o sa pamayanang namumuno rito.
    reason: lexical_alternative
  - marker: b
    text: Ang “opisyal ni Abimelek” ay maaari ring isaling “kinatawan ni Abimelek” o “itinalagang tagapangasiwa ni Abimelek.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, mga taong nagmula o nauugnay kay Hamor. Ang “ama ni Shekem” ay maaaring tumukoy sa Hamor na ama ng taong Shekem sa Genesis 34 at maaaring umalingawngaw rin sa kaugnayan niya sa Shekem bilang lungsod o pamayanan; ihambing sa Genesis 34.
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: Sino ba si Abimelek, at sino ba ang Shekem
  rationale: Pinananatili ang dalawang retorikal na tanong at ang mapanghamak na paghamon sa katayuan o karapatang mamuno nina Abimelek at Shekem. Tuwirang pangalan ang Shekem sa Hebreo, bagaman malamang na kumakatawan ito sa lungsod o pamayanang namumuno rito.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: para maglingkod tayo sa kanya
  rationale: Sa konteksto, ang עבד ay tumutukoy sa paglilingkod o pagpapasakop sa isang pinuno, hindi lamang sa karaniwang paggawa. Likas sa Tagalog ang sugnay na ito at napananatili ang pulitikal na diwa.
- source_word: הֲלֹא בֶן יְרֻבַּעַל
  choice: Hindi ba’t anak siya ni Jerubaal
  rationale: Ang הֲלֹא ay nagpapakilala ng retorikal na tanong na umaasang sasang-ayon ang mga nakikinig. Ang tahasang pagtukoy sa pagiging anak ni Jerubaal ay nagpapanatili sa diin sa angkan ni Abimelek.
- source_word: פְּקִידוֹ
  choice: ang kanyang opisyal
  rationale: Ang פָּקִיד ay isang itinalagang opisyal o nakabababang tagapangasiwa. Hindi labis na tinutukoy ng “opisyal” ang eksaktong tungkulin ni Zebul.
- source_word: עִבְדוּ
  choice: Paglingkuran ninyo
  rationale: Pinananatili ang tuwirang utos sa maramihang tagapakinig at ang matalim na himig ng pananalita ni Gaal.
- source_word: אַנְשֵׁי חֲמוֹר
  choice: mga tauhan ni Hamor
  rationale: Ang אַנְשֵׁי ay literal na “mga lalaki ng” at maaaring tumukoy sa mga taong nauugnay o nagmula kay Hamor. Ang “mga tauhan” ay likas sa modernong Tagalog, samantalang nililinaw sa talababa ang posibleng ugnayang lahi o pangkat.
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: Ngunit bakit tayo maglilingkod sa kanya?
  rationale: Ipinahahayag ng “Ngunit bakit” ang pasukdol na pagtutol, at ng “tayo” ang tahasang unang panauhang maramihan sa Hebreo nang hindi nagiging mabigat ang pangungusap.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sino ba” upang ihatid ang mapanghamak na retorika ni Gaal nang hindi nagiging labis na kolokyal. Pinanatili ang mga pangalang Hebreo sa anyong malapit sa tunog ng pinagmulan at hindi nilutas sa pangunahing teksto ang metonimiya ng “Shekem.”
