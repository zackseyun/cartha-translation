base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: tl
  text: Kinuha niya ang mga tao, hinati niya sila sa tatlong pangkat[a], at nag-abang sa parang. Nang makita niyang lumalabas mula sa lunsod ang mga tao, sumalakay siya sa kanila at pinabagsak sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinati niya sila sa tatlong pangkat o pangkat ng mga mandirigma”; literal na “sa tatlong ulo,” isang Hebreong idyoma para sa mga dibisyon o pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֶת־הָעָם
  choice: Isinama niya ang kanyang mga tauhan
  rationale: Literal na “kinuha niya ang mga tao,” ngunit sa kontekstong militar ang עָם ay tumutukoy sa puwersang nasa ilalim ni Abimelec. Likas sa modernong Tagalog ang “isinama ... ang kanyang mga tauhan” at hindi nito ipinagkakamali ang mga ito sa mga taong lumalabas sa lunsod.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: hinati sila sa tatlong pangkat
  rationale: Ang חצה ay “hatiin,” at ang literal na “tatlong ulo” ay isang idyomang Hebreo para sa tatlong pangkat o dibisyon. Malinaw at natural ang “tatlong pangkat” sa Tagalog.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: at nag-abang sa parang
  rationale: Ang ארב ay paghihintay nang palihim upang tambangan. Ipinahihiwatig ng “nag-abang” ang pananambang nang hindi ginagawang pangngalan ang kilos; ang שׂדה ay “parang” o bukas na lupain.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Nang makita niyang
  rationale: Pinagsasama nito sa natural na salaysay sa Tagalog ang pagkakita at ang masiglang pantukoy na הִנֵּה, nang hindi gumagamit ng pilit na literal na “narito.”
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: lumalabas mula sa lunsod ang mga tao
  rationale: Ang participle na יֹצֵא ay naglalarawan ng kilos na kasalukuyang nagaganap nang makita niya ito. Pinananatili ng “mga tao” ang karaniwang kahulugan ng עָם at ang pagkakaiba nila sa mga tauhan ni Abimelec.
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: sumalakay siya sa kanila
  rationale: Ang קום על ay idyomang nangangahulugang bumangon laban o sumalakay. Mas natural at malinaw sa kasalukuyang Tagalog ang “sumalakay” kaysa sa literal na “tumindig laban.”
- source_word: וַיַּכֵּם
  choice: at pinabagsak sila
  rationale: Ang נכה ay maaaring mangahulugang hampasin, salakayin, o talunin, at hindi laging tahasang nagsasaad na pinatay. Ipinahahayag ng “pinabagsak” ang marahas at mapagpasiyang paglusob nang hindi labis na tinutukoy ang kamatayan.
