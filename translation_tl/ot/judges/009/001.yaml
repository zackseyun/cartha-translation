translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang mga tiyak na ugnayang pampamilya at ang sinaunang konsepto ng sambahayan/angkan nang hindi nagdaragdag ng denominasyonal o interpretatibong paliwanag.
