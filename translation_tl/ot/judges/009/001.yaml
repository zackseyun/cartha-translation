  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ אֲבִימֶ֤לֶךְ בֶּן יְרֻבַּ֨עַל֙ שְׁכֶ֔מָ/ה אֶל אֲחֵ֖י אִמּ֑/וֹ וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֔ם וְ/אֶל כָּל מִשְׁפַּ֛חַת בֵּית אֲבִ֥י אִמּ֖/וֹ לֵ/אמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: tl
  text: Pumunta si Abimelec na anak ni Jerubaal sa Shekem, sa mga kapatid na lalaki ng kanyang ina, at kinausap niya sila at ang buong angkan ng sambahayan ng ama ng kanyang ina.[a] Sinabi niya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “sambahayan ng ama ng kanyang ina” ay tumutukoy sa sambahayan o angkan sa panig ng kanyang ina.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Pumunta
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa Tagalog ang simpleng “Pumunta” at hindi na kailangang dagdagan ng tahasang “At” o “Pagkatapos,” na wala namang hiwalay na katumbas sa Hebreo.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Isinalin-titik ang pangalang pantangi sa anyong madaling basahin sa modernong Filipino.
- source_word: בֶּן יְרֻבַּעַל
  choice: na anak ni Jerubaal
  rationale: Tuwirang pinananatili ang kaugnayang ama at anak, gamit ang likas na ayos sa Tagalog.
- source_word: שְׁכֶמָה
  choice: sa Shekem
  rationale: Ipinahihiwatig ng directional he ang pagpunta patungo sa lungsod; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “sa.”
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: sa mga kapatid na lalaki ng kanyang ina
  rationale: Pinananatili ang literal na panlalaking katawagang אֲחֵי, sa halip na agad itong gawing “mga tiyuhin,” kaya malinaw ang eksaktong ugnayang pampamilya.
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: at kinausap niya sila
  rationale: Ang דבר ay nangangahulugang magsalita. Ang “kinausap” ay natural sa Tagalog at iniiwasan ang paulit-ulit na “sinabi” bago ang לֵאמֹר.
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: at ang buong angkan
  rationale: Ang מִשְׁפָּחָה ay mas malawak na pangkat ng magkakamag-anak kaysa nuklear na pamilya; ang “angkan” ang angkop na katumbas, at ang “buong” ay kumakatawan sa כָּל.
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: ng sambahayan ng ama ng kanyang ina
  rationale: Pinananatili ang estruktura at larawang “bahay/sambahayan” ng Hebreo. Mas malinaw ang “sambahayan” sa kontekstong tumutukoy sa pamilya o linya ng lahi, habang hindi ginagawang tahasang “lolo sa ina” ang parirala.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ipinakikilala nito ang tuwirang pananalita sa susunod na talata. Sa Tagalog, mas natural ang isang bagong sugnay na “Sinabi niya,” kaysa sa mabigat na “na sinasabi.”
