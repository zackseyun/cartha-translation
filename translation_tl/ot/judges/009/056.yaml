  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: tl
  text: Kaya ibinalik ng Diyos kay Abimelec ang kasamaang ginawa niya sa kanyang ama sa pagpatay niya sa kanyang pitumpung kapatid na lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ginantihan ng Diyos si Abimelec dahil sa kanyang kasamaan.” Ang idyomang Hebreo ay nagsasabing ginawa ng Diyos na bumalik kay Abimelec ang sarili niyang kasamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: ibinalik
  rationale: 'Tuwirang pinananatili nito ang causative na idyomang Hebreo: pinapangyari ng Diyos na bumalik kay Abimelec ang sarili niyang kasamaan. Natural din ito sa makabagong Filipino at hindi ikinukubli ang larawan ng orihinal.'
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang kilos at tumutukoy ito sa Diyos ng Israel.
- source_word: רָעַת
  choice: ang kasamaan
  rationale: Ipinahahayag nito ang moral na bigat ng ginawa ni Abimelec, hindi lamang ang pinsala o masamang bunga nito.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Likas na sugnay na Filipino ito para sa naunang gawaing binubuod ng talata.
- source_word: לְאָבִיו
  choice: sa kanyang ama
  rationale: Pinananatili ang malawak na ugnayang ipinahahayag ng ל, kung saan ang ama ang taong pinag-ukulan o naapektuhan ng kasamaan.
- source_word: לַהֲרֹג
  choice: nang patayin niya
  rationale: Malinaw nitong ipinapaliwanag ang nilalaman o paraan ng kasamaang ginawa sa ama, habang nananatiling natural sa Filipino.
- source_word: שִׁבְעִים אֶחָיו
  choice: kanyang pitumpung kapatid
  rationale: Tuwirang inililipat ang bilang at ugnayang pampamilya; sa konteksto, tumutukoy ito sa mga kapatid na lalaki ni Abimelec.
- source_word: וַ
  choice: Kaya
  rationale: Sa pangwakas na buod ng salaysay, natural na ipinapakita ng “Kaya” ang resultang ugnayan, bagaman payak na “at” ang pangunahing halaga ng pang-ugnay.
theological_decisions:
- issue: Aktibong pagkilos ng Diyos sa paghatol
  choice: Ang Diyos ang aktibong nagpabalik kay Abimelec ng sarili niyang kasamaan.
  alternative: Pinahintulutan lamang ng Diyos na bumalik kay Abimelec ang kanyang kasamaan.
  rationale: Tahasan sa Hebreo na ang Diyos ang simuno ng causative na pandiwa. Hindi dapat palambutin ang pahayag tungo sa pahintulot lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “ibinalik” upang mapanatili ang kongkretong idyomang Hebreo, samantalang inilagay sa talababa ang mas interpretatibo ngunit natural na “ginantihan.”
