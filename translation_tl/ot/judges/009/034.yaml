  text: וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּ֖/וֹ לָ֑יְלָה וַ/יֶּאֶרְב֣וּ עַל שְׁכֶ֔ם אַרְבָּעָ֖ה רָאשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: tl
  text: Kaya bumangon nang gabi si Abimelec at ang lahat ng taong kasama niya, at nagtambang sila laban sa Sichem sa apat na pangkat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “apat na ulo,” isang idyoma para sa apat na pangkat o dibisyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Ang קום sa salaysay ay tumutukoy sa pagbangon upang kumilos; natural ang “bumangon” at hindi nito nililimitahan ang diwa sa pag-alis lamang.
- source_word: לָיְלָה
  choice: nang gabi
  rationale: Ginamit bilang panandang pamanahon; malinaw at likas sa modernong Tagalog ang “nang gabi” para sa pagkilos sa oras ng gabi.
- source_word: וַיֶּאֶרְבוּ
  choice: nagtambang sila
  rationale: Ang ארב ay pag-aabang nang palihim upang sumalakay; tuwiran at angkop sa kontekstong militar ang “nagtambang.”
- source_word: עַל שְׁכֶם
  choice: laban sa Sichem
  rationale: Kasama ng pandiwang tumutukoy sa pananambang, maaaring ipahiwatig ng עַל ang target o kaaway, hindi lamang ang lokasyon.
- source_word: אַרְבָּעָה רָאשִׁים
  choice: sa apat na pangkat
  rationale: Literal itong “apat na ulo,” ngunit idyoma ito para sa apat na magkakahiwalay na grupo o dibisyon; malinaw at hindi labis na teknikal ang “apat na pangkat.”
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: ang lahat ng taong kasama niya
  rationale: Pinananatili nito ang malawak na kahulugan ng עָם at hindi tahasang ginagawang “mga kawal” o “mga lalaki” ang hindi espesipiko sa Hebreo.
