base_translation:
  language: en
  yaml_path: translation/ot/judges/009/021.yaml
  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: tl
  text: Pagkatapos, tumakas si Jotam at nakaligtas. Pumunta siya sa Beer[a] at nanirahan doon, malayo sa kapatid niyang si Abimelek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Beera.” Ang Hebreong pangalan ng lugar na בְּאֵרָה ay maaaring isulat bilang “Beer” o “Beera.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: tumakas
  rationale: Ang pandiwang נוס ay tumutukoy sa pagtakas mula sa panganib; natural at tuwiran ang “tumakas” sa makabagong salaysay.
- source_word: וַיִּבְרַח
  choice: nakaligtas
  rationale: Ang ברח ay isa ring pandiwa ng pagtakas. Pinananatili ng “tumakas … at nakaligtas” ang magkasunod na halos magkasingkahulugang pandiwa nang hindi alanganing inuulit ang parehong salita.
- source_word: בְּאֵרָה
  choice: Beer
  rationale: Pangalan ito ng lugar. Ang anyong בְּאֵרָה ay maaaring unawaing direksiyonal na “patungong Beer”; kaya “sa Beer” ang likas na salin, habang inilalahad sa talababa ang alternatibong transliterasyong “Beera.”
- source_word: וַיֵּשֶׁב שָׁם
  choice: nanirahan doon
  rationale: Sa konteksto, ang ישׁב ay nagpapahiwatig ng pananatili o pagtira, kaya mas angkop ang “nanirahan doon” kaysa sa literal na “umupo roon.”
- source_word: מִפְּנֵי
  choice: malayo sa
  rationale: Literal itong may diwang “mula sa harapan/presensiya ni.” Sa kontekstong pagtakas, malinaw na ipinahihiwatig nitong nanatili si Jotam na malayo kay Abimelek, nang hindi idinaragdag ang tahasang “dahil sa takot.”
- source_word: אָחִיו
  choice: kapatid niyang
  rationale: Pinananatili ang tahasang ugnayang pampamilya, na nagpapatingkad sa tensiyon ng salaysay.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Pagkatapos” bilang likas na panandang pasalaysay para sa sunod-sunod na waw-consecutive, at hinati sa dalawang pangungusap upang maging malinaw ang retorikal na dobleng kilos ng pagtakas at pagkaligtas.
