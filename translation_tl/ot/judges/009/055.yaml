  text: וַ/יִּרְא֥וּ אִֽישׁ יִשְׂרָאֵ֖ל כִּ֣י מֵ֣ת אֲבִימֶ֑לֶךְ וַ/יֵּלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: tl
  text: Nang makita ng mga lalaki ng Israel na patay na si Abimelec, nagpunta ang bawat isa sa kani-kaniyang lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang lalaki ng Israel … bawat lalaki sa kanyang lugar.” Kolektibo ang unang “lalaki,” at ipinamahagi naman ng ikalawa ang kilos sa bawat kabilang sa pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: makita
  rationale: Pinananatili ang pangunahing diwa ng ראה bilang aktuwal na pagkakita na humahantong sa pagkilala sa kalagayan ni Abimelec.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: mga lalaki ng Israel
  rationale: Bagaman anyong isahan ang אִישׁ, kolektibo ang gamit nito ayon sa maramihang pandiwa; pinananatili rin ng salin ang panlalaking pagtukoy ng Hebreo.
- source_word: כִּי מֵת אֲבִימֶלֶךְ
  choice: na patay na si Abimelec
  rationale: Ang כִּי ay nagpapakilala sa nilalaman ng kanilang nakita, at ang מֵת ay naglalarawan sa kalagayan ni Abimelec bilang patay.
- source_word: וַיֵּלְכוּ
  choice: umuwi
  rationale: Sa konteksto ng pagpunta ng bawat isa sa sarili niyang lugar, natural sa Tagalog ang 'umuwi'; ipinahihiwatig nito ang pag-alis patungo sa kinauukulang lugar nang hindi dinaragdagan ang salaysay.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: ang bawat isa sa kani-kaniyang lugar
  rationale: Ipinapahayag ng 'bawat isa' at 'kani-kaniyang' ang distributibong isahan ng אִישׁ, habang pinananatili ng 'lugar' ang mas malawak na kahulugan ng מָקוֹם kaysa 'tahanan'.
theological_decisions: []
translation_notes:
  register: Makabagong, natural, at marangal na Filipino. Ginamit ang “mga lalaki ng Israel” upang tumpak na katawanin ang kolektibo ngunit panlalaking אִישׁ יִשְׂרָאֵל; ang “kani-kaniyang lugar” ay idiomatikong naghahayag ng distributibong anyo.
