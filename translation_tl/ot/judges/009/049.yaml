translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Abimelec” at “Shekem” bilang tuwirang anyong Filipino mula sa mga pangalang Hebreo. Iniwasan ang sobrang teknikal na paglalarawan sa estruktura upang mapanatili ang leksikal at pansakaunang kawalang-katiyakan ng Hebreo.
