base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: tl
  text: Kaya bawat isa sa buong bayan ay pumutol ng isang sanga, at sumunod sila kay Abimelec. Ipinatong nila ang mga sanga sa ibabaw ng panloob na silid[a] at sinunog nila ang panloob na silid sa ibabaw nila. Kaya namatay rin ang lahat ng tao sa tore ng Shekem—humigit-kumulang isang libong lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kuta” o “panloob na kanlungan.” Hindi tiyak ang eksaktong kahulugan ng salitang Hebreo, ngunit malamang na tumutukoy ito sa nakasarang kanlungan sa loob ng tore, hindi sa buong tore.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: pumutol
  rationale: Ang כרת ay tumutukoy rito sa pagputol ng mga sanga. Sapat na likas at tiyak ang “pumutol” sa konteksto.
- source_word: אִישׁ שׂוֹכֹה
  choice: bawat isa ng isang sanga
  rationale: Pinananatili nito ang distributibong diwa ng literal na “bawat lalaki, ang kaniyang sanga” at ang pang-isahang “sanga,” ngunit natural sa modernong Tagalog.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: sumunod sila kay Abimelec
  rationale: Ang literal na “lumakad sa likuran” ay idyomang nagsasaad ng pagsunod sa pangunguna ni Abimelec.
- source_word: הַצְּרִיחַ
  choice: silid-kuta
  rationale: Ipinakikita ng konteksto na ito ay isang nakukubling, pinatibay na bahagi ng tore, hindi ang buong tore. Pinananatili ng “silid-kuta” ang pagkakaiba nito sa מִגְדַּל, “tore,” at ang kawalang-katiyakan sa eksaktong anyo nito ay inilagay sa talababa.
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: itinambak nila ang mga sanga sa silid-kuta
  rationale: Mula sa konteksto ang layon na “mga sanga.” Ang “itinambak” ay likas na paglalarawan sa sama-samang paglalagay ng mga ito sa ibabaw o laban sa gusali upang sunugin.
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת הַצְּרִיחַ בָּאֵשׁ
  choice: sinunog ang silid-kuta sa ibabaw ng mga tao
  rationale: Pinananatili nito ang puwersang pansaan ng עֲלֵיהֶם, “sa ibabaw nila,” nang hindi lubusang tinutukoy ang ayos ng silid o kuta.
- source_word: אַנְשֵׁי מִגְדַּל שְׁכֶם
  choice: lahat ng tao sa tore ng Shekem
  rationale: Bagaman panlalaki ang anyong אַנְשֵׁי, saklaw rito ang mga naninirahan o nagsisilikas sa tore, sapagkat tahasang binabanggit pagkatapos ang mga lalaki at babae.
- source_word: כְּאֶלֶף
  choice: humigit-kumulang isang libo
  rationale: Ang unlaping כ־ ay nagpapahiwatig ng pagtataya; malinaw at natural ang “humigit-kumulang.”
- source_word: אִישׁ וְאִשָּׁה
  choice: lalaki at babae
  rationale: Direkta at natural nitong ipinahahayag na kabilang sa bilang ng mga namatay ang kapuwa lalaki at babae.
