revisions:
- from: Kaya pumutol din ang buong bayan, bawat isa ng isang sanga, at sumunod sila kay Abimelec. Itinambak nila ang mga sanga sa silid-kuta[a] at sinunog ang silid-kuta sa ibabaw ng mga tao. Kaya namatay rin ang lahat ng tao sa tore ng Shekem—humigit-kumulang isang libong lalaki at babae.
  to: Kaya bawat isa sa buong bayan ay pumutol ng isang sanga, at sumunod sila kay Abimelec. Ipinatong nila ang mga sanga sa ibabaw ng panloob na silid[a] at sinunog nila ang panloob na silid sa ibabaw nila. Kaya namatay rin ang lahat ng tao sa tore ng Shekem—humigit-kumulang isang libong lalaki at babae.
  rationale: Inayos ang distributibong unang sugnay upang maging gramatikal at tapat sa Hebreo. Pinalitan ang malabong “sa silid-kuta” ng “sa ibabaw ng panloob na silid” upang maipakita ang עַל nang hindi inaangking tiyak ang estruktura. Itinama rin ang talababa upang ilarawan ang leksikal na kawalang-katiyakan, hindi isang kawalang-katiyakan sa anyo ng salitang Hebreo.
