base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: tl
  text: Pagkatapos, nagtipon ang lahat ng mga pinuno ng Shekem at ang buong Bet-milo[a]. Pumunta sila at ginawa nilang hari si Abimelec sa tabi ng malaking punong may nakatayong batong-palantandaan[b] na nasa Shekem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bet-milo ay maaaring mangahulugang “sambahayan ni Milo,” ngunit malamang na pangalan ito ng isang lugar o pangkat.
    reason: cultural_note
  - marker: b
    text: O “sa tabi ng malaking punong nagsisilbing palatandaan.” Mahirap unawain ang pariralang Hebreo, at hindi tiyak ang eksaktong kahulugan ng salitang isinaling “nakatayong batong-palantandaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: mga pinuno ng Shekem
  rationale: Literal itong tumutukoy sa mga may-ari, panginoon, o makapangyarihang lalaki ng lunsod. Sa kontekstong pampolitika, likas na ipinahahayag ng “mga pinuno” ang kanilang katayuan nang hindi ipinapalagay na lahat ng mamamayan ang tinutukoy.
- source_word: בֵּית מִלּוֹא
  choice: Bet-milo
  rationale: Hindi tiyak kung ito ay pangalan ng isang lugar, pangkat, o sambahayan. Pinananatili ng transliterasyon ang anyong pangalang pantangi at iniiwasang magtakda ng kahulugang hindi tiyak.
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  choice: ginawa nilang hari si Abimelec
  rationale: Tuwirang ipinahahayag ng Hiphil ng מלך na pinaghari o ginawang hari ang isang tao; hindi idinaragdag ang seremonya ng pagpuputong na hindi tahasang binanggit.
- source_word: עִם
  choice: sa tabi ng
  rationale: Sa ugnay nito sa isang palatandaang pook, ipinahahayag nito ang kalapitan; natural at malinaw sa Tagalog ang “sa tabi ng.”
- source_word: אֵלוֹן
  choice: malaking puno
  rationale: Maaaring oak o terebinto ang tinutukoy, ngunit hindi tiyak ang uri. Ang “malaking puno” ay nag-iingat sa katiyakang leksikal nang hindi nagpapasok ng espesyeng hindi matitiyak.
- source_word: מֻצָּב
  choice: nakatayong bato
  rationale: Mula ito sa ugat na nangangahulugang tumayo o maglagay. Sa konteksto, malamang na isang itinayong palatandaan o bato ang tinutukoy, ngunit nananatiling mahirap ang eksaktong kahulugan.
- source_word: וַיֵּאָסְפוּ
  choice: nagtipon
  rationale: Natural at sapat na katumbas ito ng pandiwang nangangahulugang magtipon o magkatipon.
