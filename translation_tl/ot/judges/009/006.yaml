translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong Tagalog ng mga pangalang Shekem, Bet-milo, at Abimelec. Hinati sa dalawang pangungusap para sa likas na daloy, habang pinananatili ang sunod-sunod na kilos ng salaysay at ang tunay na kalabuan ng pariralang אֵלוֹן מֻצָּב.
