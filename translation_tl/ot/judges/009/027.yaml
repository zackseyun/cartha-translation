base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: tl
  text: Lumabas sila papunta sa bukid, namitas ng mga ubas sa kanilang mga ubasan, at tinapakan ang mga ito. Nagdaos sila ng pagdiriwang[a]. Pagkatapos, pumasok sila sa bahay ng kanilang diyos[b], kumain at uminom, at isinumpa si Abimelec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagdiwang sila para sa anihan” o “nagpakasaya sila.” Ang salitang Hebreo ay tumutukoy sa masayang pagdiriwang, malamang na kaugnay ng pag-aani ng ubas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bahay ng kanilang mga diyos.” Maaaring basahing maramihan ang anyong Hebreo, bagaman malamang na iisang diyos na sinasamba sa dambanang iyon ang tinutukoy dito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: Lumabas sila sa bukid
  rationale: Ipinahihiwatig ng hulaping paturol sa הַשָּׂדֶה ang pagpunta sa bukid o lantad na lupain. Likas sa Tagalog ang “lumabas sila sa bukid” at pinananatili nito ang paglabas mula sa pamayanan.
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: namitas ng mga ubas sa kanilang mga ubasan
  rationale: Sa konteksto ng ubasan, ang בצר ay tumutukoy sa pamimitas ng ubas, hindi lamang sa pangkalahatang pag-aani.
- source_word: וַיִּדְרְכוּ
  choice: pinisa ang mga iyon sa pamamagitan ng pagtapak
  rationale: Tumutukoy dito ang דרך sa tradisyonal na pagpisa sa mga ubas sa pamamagitan ng pagtapak. Nililinaw ng “ang mga iyon” na mga ubas ang tinutukoy nang hindi dinaragdagan ang pangyayari.
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: Nagdaos sila ng pagdiriwang
  rationale: Ang הִלּוּלִים ay tumutukoy sa masayang kapistahang malamang na kaugnay ng pag-aani ng ubas. Ang “pagdiriwang” ay natural at hindi nagpapasya sa eksaktong ritwal o anyo nito.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: bahay ng kanilang diyos
  rationale: Pinananatili ng “bahay” ang kongkretong larawan ng בֵּית at iniiwasang ipalagay agad ang mas tiyak na “templo.” Bagaman maaaring basahing maramihan ang anyo ng אֱלֹהֵיהֶם, malamang na iisang diyos ng dambanang iyon ang tinutukoy.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: kumain at uminom
  rationale: Tuwirang salin ito na pinananatili ang pagkakasunod-sunod nang hindi idinaragdag ang pahiwatig na piging.
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: isinumpa si Abimelec
  rationale: Ang piel na anyo ng קלל ay karaniwang nangangahulugang sumpain, na higit na matindi kaysa insultuhin lamang.
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהֵיהֶם sa kontekstong pagano
  choice: kanilang diyos
  alternative: kanilang mga diyos
  rationale: Maaaring maramihan ang anyo sa morpolohiya, ngunit malamang na tumutukoy ang tagpo sa partikular na diyos na sinasamba sa bahay o dambanang pinasok nila. Inilalahad sa talababa ang tunay na alternatibo sa halip na tuluyang alisin ang kalabuan.
translation_notes:
  register: Gumamit ng makabagong, dignidadong Tagalog na madaling maunawaan. Ang “pinisa … sa pamamagitan ng pagtapak” ay mas malinaw sa karaniwang mambabasa kaysa sa teknikal o lipas na pananalita. Ginamit ang maliit na titik sa “diyos” dahil paganong diyos ang tinutukoy, at “Abimelec” bilang likas na anyong transliterasyon sa Filipino.
