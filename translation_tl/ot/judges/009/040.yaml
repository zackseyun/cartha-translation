    issue: Hindi angkop ang panghalip na "nito" para kay Abimelec.
    rationale: Ang "nito" ay karaniwang ginagamit para sa bagay, hayop, o di-tao; si Abimelec ay tao. Ang "kanya" ang wastong anyo.
  - severity: low
    issue: Ang "pintuang-bayan" ay nagdaragdag ng espesipikasyong wala sa Hebreo.
    rationale: שער ay "gate"; bagaman maaaring pintuang-lungsod ito sa konteksto, hindi ito tahasang sinasabi sa talata. Ang "tarangkahan" ay mas neutral.
