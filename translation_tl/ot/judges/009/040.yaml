  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: tl
  text: Hinabol siya ni Abimelec, at tumakas siya palayo sa kanya. Maraming napatay ang bumagsak hanggang sa pasukan ng tarangkahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Marami ang napatay hanggang sa pasukan ng tarangkahan.” Pinananatili ng pangunahing salin ang matingkad na pananalita ng Hebreo na ang “mga napatay” ay “bumagsak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: Hinabol siya
  rationale: Ang רדף ay tumutukoy sa paghabol sa isang kaaway. Natural sa modernong Tagalog ang “hinabol siya” at pinananatili nito ang diwang militar.
- source_word: וַיָּנָס
  choice: tumakas siya
  rationale: Ang נוס ay nangangahulugang tumakas. Ang pang-isahang pandiwa ay tumutukoy kay Gaal mula sa naunang talata.
- source_word: מִפָּנָיו
  choice: mula sa harap nito
  rationale: Literal itong “mula sa kanyang mukha/harap” at sa kontekstong ito ay paglalarawan ng pagtakas sa harap ng humahabol. Ginamit ang “nito” upang malinaw na si Abimelec ang tinutukoy.
- source_word: וַיִּפְּלוּ
  choice: bumagsak
  rationale: Ang נפל ay literal na “bumagsak.” Pinananatili nito ang matingkad na larawang pandigma ng Hebreo.
- source_word: חֲלָלִים
  choice: mga napatay
  rationale: Ang חֲלָלִים ay mga taong napatay o nasugatan nang nakamamatay sa labanan. Ang “mga napatay” ay malinaw at likas sa Tagalog nang hindi nawawala ang diwang pandigma.
- source_word: רַבִּים
  choice: marami
  rationale: Tuwirang katumbas ng רַבִּים ang “marami.”
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: hanggang sa pasukan ng pintuang-bayan
  rationale: Ang פתח ay “pasukan/bukana,” at ang שער ay pintuang-bayan o tarangkahan ng lungsod. Nililinaw ng “pintuang-bayan” na hindi ito karaniwang pinto ng bahay.
