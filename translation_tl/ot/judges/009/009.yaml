base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: tl
  text: Ngunit sinabi sa kanila ng punong olibo, “Hihinto ba ako sa pagbibigay ng aking langis,[a] na ginagamit upang parangalan ang mga diyos at mga tao,[b] at mag-ugoy sa ibabaw ng mga puno?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “aking katabaan” o “aking kasaganaan,” isang matalinghagang pagtukoy sa saganang ani ng olibo, lalo na sa langis nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang Diyos at ang mga tao.” Maramihan ang anyo at pandiwa sa Hebreo, ngunit inuunawa ito ng maraming salin bilang pagtukoy sa Diyos dahil ginagamit ang langis ng olibo sa pagsamba.
    reason: alternative_reading
lexical_decisions:
- source_word: הַזַּיִת
  choice: punong olibo
  rationale: Sa pabula, ang olibo ay isang punong nagsasalita; malinaw at natural sa modernong Tagalog ang “punong olibo.”
- source_word: הֶחֳדַלְתִּי
  choice: Iiwan ko ba
  rationale: Retorikal ang anyo sa konteksto. Ipinahihiwatig nito ang pagtigil o pagtalikod sa kasalukuyang mabuting bunga, hindi lamang isang tanong tungkol sa nakaraan.
- source_word: דִּשְׁנִי
  choice: aking masaganang langis
  rationale: Literal itong “aking katabaan/kasaganaan,” ngunit sa punong olibo ay tumutukoy sa saganang langis nito. Pinananatili ng “masaganang” ang metapora ng kayamanan habang nililinaw ng “langis” ang tinutukoy.
- source_word: אֲשֶׁר בִּי
  choice: na sa pamamagitan nito
  rationale: Ipinahahayag ang gamit ng langis bilang kasangkapan sa pagbibigay-parangal.
- source_word: יְכַבְּדוּ
  choice: ay pinararangalan
  rationale: Bagaman aktibo ang pandiwang Hebreo at hindi tahasang binanggit ang simuno, natural sa Tagalog ang balintiyak na anyo at hindi nito dinaragdagan ang teksto ng isang tiyak na gumagawa.
- source_word: אֱלֹהִים
  choice: mga diyos
  rationale: Ang anyo ng pangngalan at ang kaugnay na pandiwa ay kapwa maramihan. Pinananatili ito sa pangunahing teksto, habang inilalahad sa talababa ang tradisyonal na pagbasa na “Diyos.”
- source_word: וַאֲנָשִׁים
  choice: at mga tao
  rationale: Natural at pangkalahatang katumbas ito sa modernong Tagalog para sa maramihang Hebreong “mga lalaki/mga tao.”
- source_word: לָנוּעַ עַל הָעֵצִים
  choice: maghari-harian sa mga puno
  rationale: 'May larong-kahulugan ang pandiwa: pag-ugoy o paggalaw sa ibabaw ng mga puno at pag-aangking mamuno sa kanila. Ang “maghari-harian” ay likas sa Tagalog at nagpapanatili sa mapanuyang diwa ng pabula.'
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים
  choice: mga diyos
  alternative: Diyos
  rationale: Pinapaboran ng maramihang anyo ng אֱלֹהִים at ng pandiwang יְכַבְּדוּ ang “mga diyos.” Gayunman, maaaring unawain ang parirala bilang pagtukoy sa tunay na Diyos dahil ginagamit ang langis ng olibo sa pagsamba; pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “para lamang” at “maghari-harian” upang ihatid ang retorikal at bahagyang mapanuyang tono ng pabula nang hindi nawawala ang larawan ng pamumuno sa mga puno.
