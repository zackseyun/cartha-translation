  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: tl
  text: Kaya naupo silang dalawa at magkasamang kumain at uminom. Pagkatapos, sinabi ng ama ng dalaga sa lalaki, “Pakiusap, pumayag kang magpalipas ng gabi, at magalak ang puso mo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at magsaya ka.”
    reason: Ipinapakita ang mas idyomatikong salin ng pariralang literal na tumutukoy sa pagiging mabuti o kaaya-aya ng puso.
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: naupo
  rationale: Sa sunod-sunod na salaysay na humahantong sa pagkain, natural na tumutukoy ang ישׁב sa pag-upo.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: silang dalawa at magkasamang
  rationale: Pinananatili nito ang diin ng parehong שְׁנֵיהֶם at יַחְדָּו habang natural pa rin sa modernong Tagalog.
- source_word: וַיֹּאכְלוּ ... וַיִּשְׁתּוּ
  choice: kumain at uminom
  rationale: Tuwirang salin ng dalawang pandiwa; walang idinagdag na layon sa “uminom” sapagkat wala rin nito sa Hebreo.
- source_word: אֲבִי הַנַּעֲרָה
  choice: ama ng dalaga
  rationale: Ang נַעֲרָה ay isang kabataang babae; ang “dalaga” ay maikli, dignipikado, at natural sa kontekstong ito.
- source_word: הָאִישׁ
  choice: lalaki
  rationale: Bagaman mas tiyak ang pagkakakilanlan niya sa mas malawak na konteksto, “ang lalaki” lamang ang sinasabi ng Hebreo rito.
- source_word: הוֹאֶל נָא
  choice: Pakiusap, pumayag kang
  rationale: Ipinahahayag ng יאל ang pagkukusa o pagsang-ayon, at nagbibigay ang נָא ng magalang na pakiusap.
- source_word: וְלִין
  choice: magpalipas ng gabi rito
  rationale: Ang לון ay tumutukoy sa pananatili nang magdamag. Nililinaw ng “rito” ang hinihiling na pananatili sa bahay ayon sa agarang konteksto.
- source_word: וְיִטַב לִבֶּךָ
  choice: at magalak ang puso mo
  rationale: Pinananatili ang larawan ng “puso” sa Hebreo at natural na ipinahahayag ang kasiyahang kaugnay ng pagtanggap at pagsasalo.
