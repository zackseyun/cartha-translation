translation_notes:
  register: Modernong Filipino na malinaw at magalang, na may dignipikadong himig ng salaysay. Pinanatili ang pagbanggit sa “puso” sa pangunahing teksto, habang ibinigay sa talababa ang mas malayang idyomatikong kahulugan.
