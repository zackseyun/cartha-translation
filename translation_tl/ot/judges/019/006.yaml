  naturalness: Natural at malinaw ang modernong Filipino. Ang “magalak ang puso mo” ay bahagyang matayog ngunit angkop sa salaysay at mahusay na pinananatili ang larawan ng Hebreo.
  terminology: Ang “dalaga,” “lalaki,” at “pumayag kang magpalipas ng gabi” ay angkop at hindi nagpapasok ng di-nakasulat na pagkakakilanlan o interpretasyon. Ang talababa ay nagbibigay ng likas na idyomatikong alternatibo.
