translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo” at “ka” upang maipakita ang mahalagang pagbabago mula sa maramihang utos para sa pangkat tungo sa isahang utos para sa lalaki. Iniwasan ang sobrang literal ngunit di-natural na parirala sa pangunahing teksto, habang pinanatili sa talababa ang pambihirang larawan ng Hebreo.
