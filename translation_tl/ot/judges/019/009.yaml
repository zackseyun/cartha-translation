base_translation:
  language: en
  yaml_path: translation/ot/judges/019/009.yaml
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: tl
  text: Nang tumayo ang lalaki upang umalis kasama ang kanyang kalunya at tagapaglingkod, sinabi sa kanya ng kanyang biyenan—ang ama ng kabataang babae—“Tingnan mo, humihina na ang araw habang papalapit ang gabi. Pakiusap, magpalipas kayo ng gabi. Tingnan mo, malapit nang matapos ang araw[a]. Magpalipas ka ng gabi rito at sumaya ang puso mo. Bumangon kayo nang maaga bukas para sa inyong paglalakbay[b], at umuwi ka[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nagkakampo ang araw”—isang larawan ng araw na tila tumitigil o namamahinga habang papalapit sa wakas nito.
    reason: source_image
  - marker: b
    text: Maramihan ang “bumangon kayo” at “inyong paglalakbay,” kaya ang buong pangkat na naglalakbay ang kinakausap dito.
    reason: grammar
  - marker: c
    text: Sa literal, “pumunta ka sa iyong tolda,” isang karaniwang pahayag dito para sa pag-uwi. Isahan ang “ka,” kaya ang lalaki mismo ang tuwirang kinakausap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Karaniwang tawag itong “lalaki”; pinananatili nito ang paraan ng pagkukuwento nang hindi ipinapasok ang mas tiyak na katawagang “asawa.”
- source_word: פִילַגְשׁוֹ
  choice: kanyang kalunya
  rationale: Pinananatili ang natatanging panlipunan at legal na kategorya ng פִילֶגֶשׁ sa salaysay, sa halip na palambutin bilang “asawa” lamang.
- source_word: נַעֲרוֹ
  choice: tagapaglingkod
  rationale: Sa konteksto, tumutukoy ito sa kabataang lalaking naglilingkod at kasama sa paglalakbay; hindi pangunahing punto ang kanyang edad.
- source_word: חֹתְנוֹ אֲבִי הַנַּעֲרָה
  choice: kanyang biyenan, na ama ng kabataang babae
  rationale: Nililinaw ng kasunod na parirala na ang kamag-anak sa pag-aasawa ay ang ama ng babae; pinananatili rin ang pagtukoy sa kanya bilang kabataang babae.
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: papalapit na sa gabi ang araw
  rationale: Natural na Filipino itong nagsasaad na humihina o lumilipas na ang araw habang papalapit ang gabi, nang hindi nagdaragdag ng ideya tungkol sa paglubog ng araw na hindi tahasang nasa Hebreo.
- source_word: לִינוּ נָא
  choice: Pakiusap, magpalipas muna kayo ng gabi
  rationale: Ipinahahayag ang magalang at mapilit na paanyaya at ang maramihang utos sa buong pangkat.
- source_word: חֲנוֹת הַיּוֹם
  choice: malapit nang matapos ang araw
  rationale: Ibinibigay sa pangunahing teksto ang kahulugang pangpanahon ng pambihirang larawan; ipinaliliwanag sa talababa ang literal na larawang “nagkakampo ang araw.”
- source_word: וְיִיטַב לְבָבֶךָ
  choice: at sumaya ang puso mo
  rationale: Pinananatili ang larawang Hebreo tungkol sa puso at ang diwa ng kasiyahan o kaginhawahan.
- source_word: וְהִשְׁכַּמְתֶּם מָחָר
  choice: Bumangon kayo nang maaga bukas
  rationale: Pinananatili ng “kayo” ang maramihang anyo na tumutukoy sa pangkat na naglalakbay.
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  choice: at umuwi ka
  rationale: Ang literal na “pumunta sa iyong tolda” ay karaniwang pahayag para sa pag-uwi; malinaw na ipinakikita ng “ka” ang biglang pagbabalik sa isahang kausap.
