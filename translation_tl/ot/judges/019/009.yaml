revisions:
- from: Nang tumayo ang lalaki upang umalis kasama ang kanyang kalunya at tagapaglingkod, sinabi sa kanya ng kanyang biyenan, na ama ng kabataang babae, “Tingnan mo, papalapit na sa gabi ang araw. Pakiusap, magpalipas muna kayo ng gabi. Tingnan mo, malapit nang matapos ang araw[a]. Magpalipas kayo ng gabi rito, at sumaya ang puso mo. Bumangon kayo nang maaga bukas para sa inyong paglalakbay[b], at umuwi ka[c].”
  to: Nang tumayo ang lalaki upang umalis kasama ang kanyang kalunya at tagapaglingkod, sinabi sa kanya ng kanyang biyenan—ang ama ng kabataang babae—“Tingnan mo, humihina na ang araw habang papalapit ang gabi. Pakiusap, magpalipas kayo ng gabi. Tingnan mo, malapit nang matapos ang araw[a]. Magpalipas ka ng gabi rito at sumaya ang puso mo. Bumangon kayo nang maaga bukas para sa inyong paglalakbay[b], at umuwi ka[c].”
  rationale: Itinama ang ikalawang utos na magpalipas ng gabi mula maramihan tungo sa isahan, ayon sa לִין sa Hebreo. Pinakinis din ang unang paglalarawan ng papalapit na gabi at inalis ang “muna,” na hindi kinakailangan sa pinagmulan. Napanatili ang mga footnote anchor at ang mahahalagang pagkakaiba ng maramihan at isahan.
