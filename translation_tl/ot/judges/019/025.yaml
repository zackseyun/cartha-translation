base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: tl
  text: Ngunit ayaw nilang makinig sa kanya. Kaya sapilitang kinuha ng lalaki ang kanyang babaeng kinakasama at inilabas siya sa kanila. Pinagsamantalahan nila siya[a] at inabuso buong magdamag hanggang umaga. Pagbukang-liwayway, pinakawalan nila siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “nakilala nila siya,” isang Hebreong eupemismo para sa pakikipagtalik; sa kontekstong ito, tumutukoy ito sa seksuwal na pagsiil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּ
  choice: ayaw
  rationale: Ipinapahayag nito ang kusang pagtanggi o kawalan ng pagnanais, gaya ng diwang volitional ng pandiwa.
- source_word: לִשְׁמֹעַ לוֹ
  choice: makinig sa kanya
  rationale: Ang שׁמע na may ל ay maaaring mangahulugang makinig o sumunod; sa konteksto, tinanggihan nila ang kanyang pakiusap, kaya natural at hindi labis ang 'makinig sa kanya.'
- source_word: וַיַּחֲזֵק
  choice: sapilitang hinawakan
  rationale: Ipinakikita ng חזק dito ang marahas o mapuwersang paghawak; nililinaw ng 'sapilitang' ang pamimilit nang hindi nagdaragdag ng diwa na wala sa teksto.
- source_word: פִּילַגְשׁוֹ
  choice: kanyang kinakasama
  rationale: Ang פילגש ay babaeng kinakasama sa isang kinikilalang ugnayan ngunit hindi kapantay ng pangunahing asawa. Mas nauunawaan sa modernong Filipino ang 'kinakasama' kaysa sa teknikal at di-karaniwang 'kalunya,' bagaman hindi nito lubos na naipapakita ang sinaunang katayuang panlipunan.
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: inilabas ito sa kanila
  rationale: Ang Hiphil ng יצא ay 'ilabas.' Hindi na inuulit ang 'sa labas' sapagkat likas na kasama na ito sa 'inilabas,' habang nananatili ang direksiyong 'sa kanila.'
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: siniil nila ito
  rationale: Literal na 'nakilala nila siya,' isang eupemismo para sa pakikipagtalik. Dahil malinaw na sapilitan at maramihan ang kilos sa konteksto, ipinahahayag ng 'siniil' ang seksuwal na karahasan nang hindi ito pinahihina; inilalagay sa talababa ang literal na idyoma.
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: inabuso
  rationale: Ang Hitpael ng עלל ay tumutukoy sa mapanghamak at marahas na pagmamaltrato. Malinaw at malawak ang 'inabuso' para sa kasunod na karahasan.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: buong magdamag ... hanggang umaga
  rationale: Natural na Filipino itong naghahayag ng tagal ng pang-aabuso mula gabi hanggang umaga.
- source_word: וַיְשַׁלְּחוּהָ
  choice: pinakawalan nila
  rationale: Ang שלח ay maaaring mangahulugang paalisin o pakawalan; ang konteksto ay pagbitaw sa biktima matapos ang karahasan.
- source_word: בַּעֲלוֹת הַשָּׁחַר
  choice: pagbukang-liwayway
  rationale: Natural at marangal na katumbas ng literal na 'sa pagsikat ng bukang-liwayway.'
