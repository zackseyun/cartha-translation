revisions:
- from: Ngunit ayaw makinig sa kanya ng mga lalaki. Kaya sapilitang hinawakan ng lalaki ang kanyang kinakasama at inilabas ito sa kanila. Siniil nila ito[a] at buong magdamag na inabuso hanggang umaga. Pagbukang-liwayway, pinakawalan nila ito.
  to: Ngunit ayaw nilang makinig sa kanya. Kaya sapilitang kinuha ng lalaki ang kanyang babaeng kinakasama at inilabas siya sa kanila. Pinagsamantalahan nila siya[a] at inabuso buong magdamag hanggang umaga. Pagbukang-liwayway, pinakawalan nila siya.
  rationale: 'Inayos ang mga panghalip at ilang salita upang maging mas malinaw at natural sa modernong Filipino. Pinanatili ang dalawang magkaibang pandiwa ng Hebreo: ang seksuwal na eupemismo sa unang kilos, na ipinaliliwanag sa talababa ayon sa marahas na konteksto, at ang kasunod na patuloy na pang-aabuso. Hindi idinagdag ang anumang doktrinal o interpretibong pahayag.'
