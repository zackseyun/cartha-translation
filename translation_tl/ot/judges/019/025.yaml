  register: Modernong Filipino na tuwiran, marangal, at malinaw. Ginamit ang 'ito' sa pagtukoy sa babae bilang natural na panghalip sa Filipino at hindi bilang pag-aalis ng kanyang pagkatao. Pinanatili ang magkahiwalay na diwa ng seksuwal na pagsiil at patuloy na pang-aabuso.
