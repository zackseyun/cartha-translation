revisions:
- from: Nang ikaapat na araw, maaga silang bumangon. Tumayo ang lalaki upang umalis, ngunit sinabi sa kanya ng ama ng kabataang babae, “Magpalakas ka muna sa pamamagitan ng kaunting tinapay, at pagkatapos ay makaaalis na kayo.[a]”
  to: Noong ikaapat na araw, maaga silang bumangon nang umagang iyon, at tumayo ang lalaki upang umalis. Ngunit sinabi ng ama ng kabataang babae sa manugang niyang lalaki, “Kumain ka muna ng kaunting tinapay para lumakas, at pagkatapos ay maaari na kayong umalis.[a]”
  rationale: Ibinalik ang hayag na relasyong “manugang niyang lalaki” upang tumugma sa Hebreong חֲתָנוֹ. Pinakinis din ang mga temporal at idyomatikong parirala para sa likas na modernong Tagalog, nang hindi nagdaragdag ng detalye o binabago ang pagbabago ng bilang sa huling pandiwa.
