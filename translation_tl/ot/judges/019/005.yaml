base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: tl
  text: Noong ikaapat na araw, maaga silang bumangon nang umagang iyon, at tumayo ang lalaki upang umalis. Ngunit sinabi ng ama ng kabataang babae sa manugang niyang lalaki, “Kumain ka muna ng kaunting tinapay para lumakas, at pagkatapos ay maaari na kayong umalis.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maramihan ang huling pandiwa sa Hebreo: “maaari na kayong umalis.” Malamang na tumutukoy ito sa buong pangkat na maglalakbay, bagaman ang manugang na lalaki ang tuwirang kinakausap ng ama.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: Nang ikaapat na araw
  rationale: Tuwirang temporal na parirala ito at hindi dinaragdagan ng di-binanggit na detalye tungkol sa pamamalagi.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: maaga silang bumangon
  rationale: Pinananatili ang pandiwang maramihan at ang diin sa maagang paggising; likas ito sa makabagong Tagalog.
- source_word: וַיָּקָם לָלֶכֶת
  choice: Tumayo ang lalaki upang umalis
  rationale: Ipinakikita ang paglipat mula sa maramihang simuno tungo sa iisang lalaki at ang layunin niyang umalis.
- source_word: אֲבִי הַנַּעֲרָה
  choice: ama ng kabataang babae
  rationale: Ang נַעֲרָה ay tumutukoy sa isang kabataang babae; malinaw at angkop sa kasalukuyang Tagalog ang salin.
- source_word: אֶל חֲתָנוֹ
  choice: sa kanya
  rationale: Malinaw na ang tinutukoy ay ang lalaking naghahandang umalis; iniiwasan ng natural na panghalip ang mabigat na pag-uulit ng relasyong naitatag na sa salaysay.
- source_word: סְעָד לִבְּךָ
  choice: Magpalakas ka muna
  rationale: Idyoma itong literal na ‘palakasin/alalayan ang iyong puso’ ngunit sa konteksto ay nangangahulugang kumain upang manumbalik ang lakas. Ang ‘muna’ ay likas na naghahayag ng pagkakasunod-sunod nang hindi binabago ang diwa.
- source_word: פַּת לֶחֶם
  choice: sa pamamagitan ng kaunting tinapay
  rationale: Pinananatili ang kongkretong larawan ng tinapay at ang maliit na dami, habang natural ang pagkakaugnay sa pandiwang ‘magpalakas.’
- source_word: וְאַחַר תֵּלֵכוּ
  choice: at pagkatapos ay makaaalis na kayo
  rationale: Pinananatili ang pandiwang maramihan sa Hebreo, na malamang ay sumasaklaw sa buong pangkat ng mga manlalakbay bagaman ang lalaki ang tuwirang kinakausap.
