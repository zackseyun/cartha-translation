  source_fidelity: 'Tumpak ang salin sa pangunahing daloy ng Hebreo: ang kawalan ng kusang-loob na magpalipas ng gabi, ang magkakasunod na pagkilos na bumangon/umalis/dumating, ang pagdating sa tapat ng Jebus, ang paliwanag na Jerusalem ito, at ang dalawang asnong may siyahan kasama ang kanyang kalunya. Hindi ipinapalagay ng teksto na nakapasok sila sa lungsod.'
  naturalness: Malinaw at natural ang makabagong Filipino. Ang “magpalipas ng gabi,” “nakarating sa tapat ng,” at “may siyahan” ay angkop sa salaysay. Ang bahagyang pormal na “tumindig” at ang terminong “kalunya” ay katanggap-tanggap sa marangal na rehistro ng pagsasalin at tumpak sa historikal na katawagan.
  terminology: Ang “Jebus,” “Jerusalem,” “asno,” “siyahan,” at “kalunya” ay angkop. Pinananatili ng “kalunya” ang natatanging katayuang ipinahihiwatig ng פילגש nang hindi ito binibigyan ng makabagong pagpapakahulugang doktrinal.
