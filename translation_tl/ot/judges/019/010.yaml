base_translation:
  language: en
  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: tl
  text: Ngunit hindi pumayag ang lalaki na magpalipas ng gabi. Tumindig siya, umalis, at nakarating sa tapat ng Jebus[a] (iyon ay Jerusalem). Kasama niya ang dalawang asnong may siyahan at ang kanyang kalunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa may Jebus” o “sa isang lugar na nakaharap sa Jebus.” Ipinahihiwatig ng Hebreo na nasa tapat o harapan sila ng lungsod, ngunit hindi malinaw na nasa loob na sila nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: hindi pumayag
  rationale: Ipinahahayag nito ang kawalan ng pagsang-ayon o kusang-loob, hindi lamang ang kawalan ng pagnanais.
- source_word: לָלוּן
  choice: magpalipas ng gabi
  rationale: Likas at malinaw na Filipino para sa pananatili sa isang lugar nang magdamag.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: Tumindig siya, umalis, at nakarating
  rationale: Pinananatili ang tatlong sunod-sunod na kilos ng salaysay habang gumagamit ng natural na daloy sa Filipino.
- source_word: עַד נֹכַח
  choice: nakarating sa tapat ng
  rationale: Ipinapakita nitong dumating siya sa isang lugar na kaharap o katapat ng lungsod, nang hindi sinasabing pumasok siya roon.
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: Jebus (iyon ay Jerusalem)
  rationale: Pinananatili ang paliwanag ng tekstong Hebreo na ang Jebus ang lungsod na kilala bilang Jerusalem.
- source_word: צֶמֶד חֲמוֹרִים
  choice: dalawang asno
  rationale: Ang צֶמֶד ay tumutukoy sa isang pares; mas natural sa Filipino ang tahasang bilang na “dalawa.”
- source_word: חֲבוּשִׁים
  choice: may siyahan
  rationale: Sa konteksto ng paglalakbay, tumutukoy ito sa mga asnong inihanda o nilagyan ng kagamitan, malamang na mga siyahan.
- source_word: פִּילַגְשׁוֹ
  choice: kanyang kalunya
  rationale: Ang “kalunya” ang maikli at kinikilalang salin para sa babaeng may katayuang konkubina o pangalawahing asawa, nang hindi pinapantay ang katayuan niya sa pangunahing asawa.
