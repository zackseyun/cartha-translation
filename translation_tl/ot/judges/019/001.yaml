id: JDG.19.1
reference: Judges 19:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מֶ֖לֶךְ אֵ֣ין בְּ/יִשְׂרָאֵ֑ל וַ/יְהִ֣י אִ֣ישׁ לֵוִ֗י גָּ֚ר בְּ/יַרְכְּתֵ֣י הַר אֶפְרַ֔יִם וַ/יִּֽקַּֽח ל/וֹ֙ אִשָּׁ֣ה פִילֶ֔גֶשׁ מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: tl
  text: Noong mga araw na iyon[a], nang walang hari sa Israel, may isang lalaking Levita na naninirahan sa liblib na bahagi ng kabundukan ng Efraim. Kumuha siya para sa sarili niya ng isang babae bilang asawang-babae[b] mula sa Betlehem sa Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Noong mga araw na iyon, walang hari sa Israel.” Gumagamit ang Hebreo ng magkaugnay na sugnay na maaaring basahin bilang hiwalay na pahayag o bilang kaligirang tumutukoy sa panahon.'
    reason: alternative_reading
  - marker: b
    text: Ang “asawang-babae” rito ay isang babaeng nasa kinikilalang ugnayan ngunit mas mababa ang katayuang panlipunan kaysa sa ganap na asawa; hindi lamang siya isang kaswal na kapareha.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Nang mga araw na iyon
  rationale: Natural na panimulang salaysay sa modernong Tagalog na pinananatili ang pormulang temporal ng Hebreo nang hindi gumagamit ng makalumang pananalita.
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: nang walang hari sa Israel
  rationale: Ginagawang temporal na kaligiran ang koordinadong sugnay, gaya ng pinahihintulutan ng sintaks, habang minamarkahan sa talababa ang literal na alternatibo.
- source_word: אִישׁ לֵוִי
  choice: isang lalaking Levita
  rationale: Pinananatili kapwa ang אִישׁ at ang pagkakakilanlang Levitiko sa malinaw at likas na Tagalog.
- source_word: גָּר
  choice: naninirahan
  rationale: Malinaw na salitang Tagalog para sa paninirahan; hindi nito ipinipilit kung pansamantala o permanenteng residente ang lalaki.
- source_word: בְּיַרְכְּתֵי הַר אֶפְרַיִם
  choice: sa liblib na bahagi ng kabundukan ng Efraim
  rationale: Ipinahahayag ng 'liblib na bahagi' ang heograpikong dulo o malayong bahagi, at ang 'kabundukan' ay tumutukoy sa rehiyon, hindi sa iisang bundok.
- source_word: וַיִּקַּח לוֹ
  choice: Kumuha siya para sa sarili niya
  rationale: Pinananatili ang reflexive na diwa ng לוֹ at ang kilos ng pagkuha sa isang kinikilalang ugnayan.
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: isang babae bilang kinakasama
  rationale: Pinananatili ang parehong 'babae' at ang espesipikong katayuang panlipunan. Ang 'kinakasama' ay mas madaling maunawaan sa kasalukuyang Tagalog kaysa 'kalunya,' ngunit nililinaw sa talababa na kinikilalang ugnayang mas mababa ang katayuan kaysa ganap na asawa ang tinutukoy.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: mula sa Betlehem sa Juda
  rationale: Malinaw na heograpikong pagtukoy na ipinagkaiba ang Betlehem na nasa Juda.
theological_decisions:
- issue: Paulit-ulit na pahayag sa Mga Hukom tungkol sa kawalan ng hari
  choice: nang walang hari sa Israel
  alternative: at walang hari sa Israel
  rationale: Inilalahad ito bilang kaligirang pangsalaysay at hindi bilang tahasang pagsang-ayon o pagtutol sa monarkiya; pinananatili sa talababa ang pormal na koordinadong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pangkaraniwang mauunawaan. Iniwasan ang makalumang 'kalunya' sa pangunahing teksto dahil maaari itong maging malabo o magpahiwatig ng pangangalunya sa kasalukuyang gamit; inilagay sa talababa ang kinakailangang paliwanag sa sinaunang katayuan.
