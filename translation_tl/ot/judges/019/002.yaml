review_pass:
  verdict: revise
  source_fidelity: Ang pangunahing diwa ay naipapahayag, kabilang ang seksuwal na pagtataksil, pag-alis ng babae, pagpunta sa bahay ng ama, Bethlehem ng Juda, at apat na buwang pananatili. Gayunman, ang “kinakasama” sa makabagong Filipino ay karaniwang tumutukoy sa live-in partner at hindi sapat na naihahayag ang natatanging katayuang ipinapahiwatig ng פילגש.
  naturalness: Natural ang daloy sa pangkalahatan, ngunit mas malinaw at mas maayos ang pagtukoy sa babae sa pamamagitan ng “kanyang asawang-babae” kaysa sa “kanyang kinakasama.” Ang “umalis mula sa kanya patungo” ay pinananatili ang dalawang aspekto ng Hebreo—paghihiwalay at pagpunta—nang hindi nagpapahiwatig ng “pag-uwi” na wala sa mismong pandiwa.
  terminology: Pinalitan ang “kinakasama” ng “asawang-babae,” isang matagal nang gamit sa Filipino para sa concubine/secondary wife at hindi nagdadala ng karaniwang kontemporaryong implikasyon ng impormal na live-in union. Pinanatili ang “naging di-tapat” para sa זנה, habang iniingatan ng talababa ang mas literal at sinaunang alternatibong pagbasa.
  issues:
  - severity: medium
    issue: Ang “kinakasama” ay hindi sapat na katumbas ng פילגש.
    rationale: Sa modernong Filipino, madalas itong nangangahulugang impormal na live-in partner. Hindi nito malinaw na naipapakita ang kinikilalang ngunit mababang-katayuang pagsasamang ipinahihiwatig ng terminong Hebreo.
  - severity: low
    issue: Ang “Umuwi” ay bahagyang mas interpretatibo kaysa sa Hebreo.
    rationale: Ang וַתֵּלֶךְ ay simpleng “pumunta/umalis.” Bagaman malamang na tahanan niya ang bahay ng ama, mas ligtas na huwag idagdag ang ideya ng pag-uwi.
