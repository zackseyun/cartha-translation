revisions:
- from: Ngunit nagtaksil sa kanya ang kanyang kinakasama[a] at iniwan siya nito. Umuwi ito sa bahay ng kanyang ama sa Bethlehem, sa Juda, at nanatili roon nang apat na buwan.
  to: Ngunit naging di-tapat sa kanya ang kanyang asawang-babae[a], at umalis siya mula sa kanya patungo sa bahay ng kanyang ama, sa Bethlehem ng Juda. Nanatili siya roon nang apat na buwan.
  rationale: Inayos ang katumbas ng פילגש upang maipakita ang sinaunang katayuang marital ngunit pangalawa, nang hindi gumagamit ng “kinakasama,” na may naiibang karaniwang kahulugan sa kontemporaryong Filipino. Ginawang mas malapit sa Hebreo ang kilos ng babae sa pamamagitan ng “umalis ... patungo,” at pinanatili ang maingat na pangunahing pagbasa at talababa para sa pinagtatalunang kahulugan ng וַתִּזְנֶה.
  reviewer_model: gpt-5.6-terra
