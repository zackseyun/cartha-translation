  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: tl
  text: Ngunit naging di-tapat sa kanya ang kanyang asawang-babae[a], at umalis siya mula sa kanya patungo sa bahay ng kanyang ama, sa Bethlehem ng Juda. Nanatili siya roon nang apat na buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “nagpatutot laban sa kanya.” Iba ang pagkaunawa rito ng ilang sinaunang tagapagpaliwanag, gaya ng “nagalit siya sa kanya” o “nakipag-away siya sa kanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה עָלָיו
  choice: nagtaksil sa kanya
  rationale: Karaniwang tumutukoy ang זנה sa seksuwal na pagtataksil o pakikiapid. Likas sa modernong Tagalog ang “nagtaksil sa kanya” at hindi nito ipinapalagay na komersiyal na prostitusyon ang tinutukoy.
- source_word: פִּילַגְשׁוֹ
  choice: ang kanyang kinakasama
  rationale: Tumutukoy ang פילגש sa isang babaeng kinikilalang kabiyak ngunit mas mababa ang katayuan kaysa pangunahing asawa. Mas madaling maunawaan ng karaniwang mambabasa ang “kinakasama,” bagaman hindi nito ganap na naipapakita ang sinaunang legal at panlipunang katayuan.
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: at iniwan siya nito
  rationale: Malinaw at natural na ipinapahayag nito kapuwa ang pag-alis at ang paghihiwalay na nasa Hebreong parirala.
- source_word: אֶל בֵּית אָבִיהָ
  choice: Umuwi ito sa bahay ng kanyang ama
  rationale: Ipinahihiwatig ng pagpunta sa sambahayan ng ama ang pag-uwi; pinananatili rin ng “bahay ng kanyang ama” ang pampamilyang diwa ng Hebreo.
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: sa Bethlehem, sa Juda
  rationale: Malinaw na kinikilala nito ang Bethlehem na nasa teritoryo ng Juda.
- source_word: וַתְּהִי שָׁם
  choice: at nanatili roon
  rationale: Natural na salaysay sa Tagalog para sa literal na “at naroon siya,” lalo na dahil sinusundan ito ng tagal ng panahon.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: nang apat na buwan
  rationale: Ang Hebreong idyoma ay tumutukoy sa tagal na apat na buwan; ito ang malinaw at likas na katumbas sa Tagalog.
theological_decisions:
- issue: Kahulugan ng וַתִּזְנֶה sa isang salaysay na may mabigat na paratang sa moralidad
  choice: seksuwal na pagtataksil (“nagtaksil sa kanya”)
  alternative: “nagpatutot laban sa kanya”; ayon sa ilang sinaunang pagpapakahulugan, “nagalit sa kanya” o “nakipag-away sa kanya”
  rationale: Sinusuportahan ng Masoretikong pagbigkas at ng karaniwang kahulugan ng זנה ang seksuwal na pagtataksil. Gayunman, inilalahad sa talababa ang naiibang sinaunang pagkaunawa upang mapanatili ang tunay na tensiyong tekstuwal at interpretatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng “ito/nito” upang maiwasan ang sunod-sunod na malabong panghalip, at ng “kinakasama” bilang madaling maunawaang katumbas ng sinaunang mababang-katayuang kabiyak; ang natatanging katayuan nito ay ipinaliliwanag sa leksikal na tala.
