base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: tl
  text: Maaga siyang bumangon noong umaga ng ikalimang araw upang umalis. Ngunit sinabi ng ama ng dalaga, “Pakiusap, palakasin mo muna ang iyong puso[a], at magtagal kayo hanggang sa kumiling ang araw.” Kaya kumain silang dalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “palakasin ang iyong puso.” Ito ay idyomang nangangahulugang kumain upang magkalakas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Maaga siyang bumangon kinaumagahan
  rationale: Ang Hiphil ng שׁכם ay tumutukoy sa maagang pagbangon o pagsisimula. Likas sa modernong Tagalog ang pariralang ito at pinananatili nito ang diin sa pagiging maaga.
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: nang ikalimang araw
  rationale: Tuwirang temporal na parirala na malinaw at natural sa salaysay.
- source_word: לָלֶכֶת
  choice: upang umalis
  rationale: Pangunahing nangangahulugang “pumunta” ang הלך, ngunit sa kontekstong naghahanda siyang maglakbay mula sa bahay, malinaw at natural ang “umalis.”
- source_word: אֲבִי הַנַּעֲרָה
  choice: ama ng dalaga
  rationale: Ang נַעֲרָה ay maaaring dalagita o dalaga; ang “dalaga” ay angkop sa babaeng nasa konteksto ng pag-aasawa at hindi labis na mapagpaliit.
- source_word: סְעָד נָא לְבָבְךָ
  choice: Pakiusap, palakasin mo muna ang iyong puso
  rationale: Pinananatili ang konkretong larawang Hebreo tungkol sa pagpapalakas ng puso. Ipinapaliwanag sa talababa ang idyomatikong kahulugan nito sa konteksto ng pagkain.
- source_word: וְהִתְמַהְמְהוּ
  choice: at magtagal kayo
  rationale: Ang Hitpael na anyo ay nangangahulugang magtagal o maantala. Pinananatili ng “kayo” ang maramihang utos sa Hebreo, sa halip na tahimik itong gawing isahan.
- source_word: עַד נְטוֹת הַיּוֹם
  choice: hanggang sa kumiling ang araw
  rationale: Pinananatili nito ang larawang ang araw o maghapon ay kumikiling patungo sa hapon, nang hindi ito ginagawang tiyak na paglubog ng araw.
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: Kaya kumain silang dalawa
  rationale: Pinananatili ang tahasang pagbanggit sa dalawa at ipinakikita ng “Kaya” ang bunga ng paanyaya ng ama.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang larawang “palakasin ang puso” at “kumiling ang araw,” habang ipinaliwanag sa talababa ang unang idyoma. Iniwasan ang pagpapangalan sa hindi binanggit na simuno at pinanatili ang maramihang anyo ng utos na “magtagal kayo.”
