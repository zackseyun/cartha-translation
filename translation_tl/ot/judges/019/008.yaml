  to: Maaga siyang bumangon noong umaga ng ikalimang araw upang umalis. Ngunit sinabi ng ama ng dalaga, “Pakiusap, palakasin mo muna ang iyong puso[a], at magtagal kayo hanggang sa kumiling ang araw.” Kaya kumain silang dalawa.
  rationale: Inayos ang pagkakasunod at anyo ng mga panahong parirala upang malinaw na ang maagang pagbangon ay naganap noong umaga ng ikalimang araw. Pinakinis din ang talababa. Pinanatili ang literal na larawan ng Hebreo, ang maramihang “magtagal kayo,” at ang hindi-tiyak na larawang “kumiling ang araw.”
