  - severity: low
    issue: Medyo di-likas ang pahayag ng talababa na “Idyoma para sa pagkain upang muling lumakas.”
    rationale: Mas malinaw sa modernong Tagalog na sabihing ang idyoma ay nangangahulugang kumain upang magkalakas.
