  to: Sinabi niya sa kaniya, “Bumangon ka at umalis na tayo.” Ngunit walang sumagot.[a] Pagkatapos, isinakay niya siya sa asno.[b] Bumangon ang lalaki at pumunta sa kaniyang lugar.[c]
