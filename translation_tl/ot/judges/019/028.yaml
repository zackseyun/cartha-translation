  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ ק֥וּמִי וְ/נֵלֵ֖כָה וְ/אֵ֣ין עֹנֶ֑ה וַ/יִּקָּחֶ֨/הָ֙ עַֽל הַ/חֲמ֔וֹר וַ/יָּ֣קָם הָ/אִ֔ישׁ וַ/יֵּ֖לֶךְ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: tl
  text: Sinabi niya sa kaniya, “Bumangon ka at umalis na tayo.” Ngunit walang sumagot.[a] Pagkatapos, isinakay niya siya sa asno.[b] Bumangon ang lalaki at pumunta sa kaniyang lugar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “walang sumasagot” o “walang sinumang sumasagot.”
    reason: lexical_alternative
  - marker: b
    text: O “kinuha niya siya at inilagay sa asno.” Ang pandiwang Hebreo ay literal na “kinuha,” ngunit sa kontekstong ito ay tumutukoy sa paglalagay o pagsakay sa kaniya sa hayop.
    reason: lexical_alternative
  - marker: c
    text: O “pumunta sa kaniyang tahanan.” Sa Hebreo, “sa kaniyang lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Sinabi niya rito
  rationale: Likas sa makabagong Tagalog ang “rito” bilang pantukoy sa babaeng kausap; hindi kailangang ulitin ang pangngalan mula sa konteksto.
- source_word: קוּמִי
  choice: Bumangon ka
  rationale: Pautos na pambabaeng isahan ito mula sa קום. Bagaman walang kasariang gramatikal ang pandiwang Tagalog, malinaw sa konteksto kung sino ang kinakausap.
- source_word: וְנֵלֵכָה
  choice: at umalis na tayo
  rationale: Ang cohortative na unang panauhang maramihan ay nagpapahayag ng paghimok o pasiya. Natural na naihahatid ng “tayo” ang inklusibong “let us,” at ng “na” ang agarang paghimok.
- source_word: וְאֵין עֹנֶה
  choice: Ngunit walang sumagot
  rationale: Ang Hebreo ay literal na nagsasaad na walang sumasagot. Ginagawang malinaw ng “ngunit” ang salungat na bunga pagkatapos ng utos, nang hindi sinasabi kung patay na ang babae sa sandaling iyon.
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: Pagkatapos, isinakay niya ito sa asno
  rationale: Pangunahing kahulugan ng לקח ang “kunin,” ngunit kasunod ng עַל הַחֲמוֹר, malinaw na ang kilos ay ang paglalagay o pagsakay sa kaniya sa hayop. Natural at tiyak sa Tagalog ang “isinakay.”
- source_word: וַיָּקָם הָאִישׁ
  choice: Bumangon ang lalaki
  rationale: Pinananatili ang hiwalay na kilos ng קום bago ang sumunod na paglakad, at inuulit ang parehong salitang-ugat na ginamit sa utos sa babae.
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: at pumunta sa kaniyang lugar
  rationale: Pinananatili ng “kaniyang lugar” ang malawak na kahulugan ng מָקוֹם at hindi tiyak na ginagawang “tahanan,” bagaman malamang iyon ang tinutukoy sa konteksto.
theological_decisions:
- issue: Kalagayan ng babae nang hindi siya sumagot
  choice: Hindi tahasang sinabing patay na siya
  alternative: Isalin sa paraang nagpapahiwatig na patay na siya noon
  rationale: Sinasabi lamang ng talata na walang sumagot; hindi nito tahasang nilulutas ang oras ng kaniyang kamatayan. Pinananatili ng salin ang gayong pagkukulang ng detalye.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “asno” bilang karaniwang terminong biblikal na nauunawaan pa rin sa Filipino. Iniwasang gawing mas tahasan kaysa sa Hebreo ang kalagayan ng babae at ang eksaktong kahulugan ng “kaniyang lugar.”
