base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: tl
  text: Sinabi niya sa kanyang tagapaglingkod[a], “Halika[b], lumapit tayo sa isa sa mga lugar na iyon at magpalipas ng gabi sa Gibea o sa Rama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanyang binata” o “sa kanyang lingkod.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Humayo ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: sa kanyang binatang tagapaglingkod
  rationale: Maaaring tumukoy ang נַעַר sa isang binata, lingkod, o tagapaglingkod. Pinagsasama ng salin ang kabataan at tungkulin ng lalaking kasama ng Levita nang hindi ipinapalagay na alipin siya.
- source_word: לְךָ
  choice: Halika
  rationale: Bagaman ang payak na kahulugan ng pautos na לְךָ ay “Humayo ka,” ang kasunod na cohortative na “lumapit tayo” ay paanyayang sabay silang magpatuloy, kaya natural sa Filipino ang “Halika.”
- source_word: וְנִקְרְבָה
  choice: lumapit tayo
  rationale: Ipinahahayag ng cohortative ang mungkahi o pasiyang kumilos nang sama-sama, at pinananatili ng “lumapit” ang diwa ng paglapit sa pupuntahang lugar.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: sa isa sa mga lugar na iyon
  rationale: Tumutukoy ito sa isa sa mga kalapit na lugar na pinagpipilian, na agad tinukoy bilang Gibea o Rama. Natural sa Filipino ang “mga lugar na iyon” sa kontekstong ito.
- source_word: וְלַנּוּ
  choice: at magpalipas ng gabi
  rationale: Ang לון ay nangangahulugang manatili o tumuloy nang magdamag. Ang “magpalipas ng gabi” ay malinaw at natural sa modernong Filipino.
- source_word: בַגִּבְעָה
  choice: sa Gibea
  rationale: Isinalin ang pangalan ng lugar ayon sa karaniwang anyong Filipino; natural ang pang-ukol na “sa” para sa bayan na tutuluyan.
- source_word: בָרָמָה
  choice: sa Rama
  rationale: Pinanatili ang pangalan ng lugar sa karaniwang anyong Filipino at ang paralelismo nito sa Gibea.
