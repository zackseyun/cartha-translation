  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֛רְא אֶת הָ/אִ֥ישׁ הָ/אֹרֵ֖חַ בִּ/רְחֹ֣ב הָ/עִ֑יר וַ/יֹּ֨אמֶר הָ/אִ֧ישׁ הַ/זָּקֵ֛ן אָ֥נָה תֵלֵ֖ךְ וּ/מֵ/אַ֥יִן תָּבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: tl
  text: Tumingala siya at nakita niya ang lalaking naglalakbay[a] sa liwasan ng lungsod.[b] Sinabi ng matandang lalaki, “Saan ka pupunta, at saan ka nanggaling?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lalaking manlalakbay” o “panauhin.” Ang salitang Hebreo ay tumutukoy sa isang taong naglalakbay at, sa konteksto ng pagpapatuloy, maaari ring tumukoy sa isang panauhin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa maluwang na pampublikong lugar ng lungsod.” Ang salitang Hebreo ay mas tiyak na tumutukoy sa isang maluwang na pampublikong lugar o liwasan kaysa sa isang karaniwang lansangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Tumingala siya
  rationale: Ang literal na idyomang Hebreo ay “itinaas niya ang kanyang mga mata.” Likas na ipinahahayag ng “tumingala” sa modernong Tagalog ang pag-angat ng tingin.
- source_word: וַיַּרְא
  choice: nakita niya
  rationale: Tuwirang ipinapahayag nito ang pandiwang Hebreo para sa pagkakita nang hindi dinaragdagan ng interpretasyong gaya ng “napansin.”
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: ang lalaking naglalakbay
  rationale: Tinutukoy ng אֹרֵחַ ang isang taong nasa paglalakbay at maaari ring tumukoy sa isang panauhin sa konteksto ng pagpapatuloy. Malinaw at natural ang “lalaking naglalakbay” at hindi nito ipinapalagay na natanggap na siya bilang panauhin.
- source_word: בִּרְחֹב הָעִיר
  choice: sa liwasan ng lungsod
  rationale: Ang רְחוֹב ay karaniwang isang maluwang at pampublikong lugar o plasa, hindi lamang isang karaniwang makitid na lansangan. Ang “liwasan” ang likas at tiyak na katumbas sa Tagalog.
- source_word: הָאִישׁ הַזָּקֵן
  choice: ang matandang lalaki
  rationale: Tuwiran at likas nitong inilalarawan ang nagsasalita bilang isang lalaking matanda na.
- source_word: אָנָה תֵלֵךְ
  choice: Saan ka pupunta
  rationale: Ang tanong ay tungkol sa patutunguhan. Likas sa usapang Tagalog ang aspektong magaganap na “pupunta” para sa kasalukuyang paglalakbay.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: at saan ka nanggaling
  rationale: Ang parirala ay nagtatanong tungkol sa pinanggalingan. Ang “saan ka nanggaling” ang natural na paraan sa Tagalog upang ipahayag ito sa agarang konteksto ng paglalakbay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “liwasan” upang mapanatili ang tiyak na larawan ng pampublikong lugar, at ang “lalaking naglalakbay” upang mapanatili ang maaaring saklaw ng אֹרֵחַ nang hindi agad ipinapalagay ang katayuan niya bilang panauhin.
