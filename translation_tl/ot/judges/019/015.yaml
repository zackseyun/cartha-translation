  source_fidelity: 'Ang pangkalahatang pagsasalin ay tapat sa Hebreo: napananatili ang paglihis ng pangkat, ang paglipat sa isahang paksa, ang liwasang pampubliko, at ang kawalan ng taong magbibigay ng matutuluyan. Gayunman, ang וְ ay payak na pangatnig na “at,” hindi ang salungatang “ngunit.” Ang “bahay nito” ay hindi angkop na pantukoy sa isang lalaking tao; kailangan ang “kanyang bahay.”'
  naturalness: Makabago at malinaw ang “Lumihis sila,” “magpalipas ng gabi,” at “liwasan ng lunsod.” Mas natural at wastong Tagalog ang “sa kanyang bahay” kaysa “sa bahay nito.”
  terminology: Ang “Gibea,” “liwasan,” at “lalaki” ay angkop. Ang “tumanggap sa kanila sa kanyang bahay” ay isang natural na pagpapahayag ng pag-anyaya/pagtanggap ng mga manlalakbay bilang panauhin, na sumasaklaw sa pandiwang מְאַסֵּף sa konteksto ng pagkamapagpatuloy.
