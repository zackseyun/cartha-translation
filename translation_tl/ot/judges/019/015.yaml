  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: tl
  text: Lumihis sila roon upang pumasok at magpalipas ng gabi sa Gibea. Pumasok siya at umupo sa liwasan ng lunsod[a], at walang sinumang lalaki[b] na tumanggap sa kanila sa kanyang bahay upang magpalipas ng gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lansangan ng lunsod.” Ang salitang Hebreo ay maaaring tumukoy sa isang maluwang na pampublikong lugar o liwasan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “walang lalaki”; ibig sabihin, walang residenteng tumanggap sa kanila sa kanyang bahay upang magpalipas ng gabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: Lumihis sila
  rationale: Ipinahihiwatig ng סור na lumihis sila mula sa kanilang dinaraanan, hindi lamang na huminto.
- source_word: לָבוֹא לָלוּן
  choice: upang pumasok at magpalipas ng gabi
  rationale: Pinananatili nito ang magkasunod na diwa ng pagpasok sa lugar at pananatili roon nang magdamag.
- source_word: בַּגִּבְעָה
  choice: sa Gibea
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan ng lugar na Gibeah.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: Pumasok siya at umupo
  rationale: Pinananatili ang paglipat ng Hebreo mula sa maramihang paksa tungo sa isahang lalaki, na kumakatawan sa pangkat.
- source_word: בִּרְחוֹב הָעִיר
  choice: sa liwasan ng lunsod
  rationale: Ang רְחוֹב ay maaaring tumukoy sa maluwang na pampublikong lugar o liwasan; natural at angkop sa tagpo ang 'liwasan ng lunsod.'
- source_word: וְאֵין אִישׁ
  choice: ngunit walang sinumang lalaki
  rationale: Pinananatili ang tahasang אִישׁ ('lalaki'), habang malinaw na ang tinutukoy ay kawalan ng residenteng mag-aalok ng matutuluyan.
- source_word: מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: na tumanggap sa kanila sa bahay nito
  rationale: Bagaman literal na may diwang 'tipunin' o 'papasukin,' sa konteksto ng pagkamapagpatuloy ay natural na ipinahahayag ito bilang pagtanggap sa mga manlalakbay sa bahay.
