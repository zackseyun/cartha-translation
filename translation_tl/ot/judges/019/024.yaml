reference: Judges 19:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִנֵּה֩ בִתִּ֨/י הַ/בְּתוּלָ֜ה וּ/פִֽילַגְשֵׁ֗/הוּ אוֹצִֽיאָה נָּ֤א אוֹתָ/ם֙ וְ/עַנּ֣וּ אוֹתָ֔/ם וַ/עֲשׂ֣וּ לָ/הֶ֔ם הַ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם וְ/לָ/אִ֤ישׁ הַ/זֶּה֙ לֹ֣א תַעֲשׂ֔וּ דְּבַ֖ר הַ/נְּבָלָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: tl
  text: “Narito ang birhen kong anak na babae at ang kanyang kalunya. Pakiusap, hayaan ninyong ilabas ko sila. Pagsamantalahan ninyo sila[a] at gawin ninyo sa kanila ang mabuti sa inyong paningin.[b] Ngunit huwag ninyong gawin sa lalaking ito ang karumal-dumal na gawaing ito.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gahasain ninyo sila.” Sa kontekstong ito, ang pandiwang Hebreo ay maaaring tumukoy sa seksuwal na pananakit o marahas na pagpapahiya.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang mabuti sa inyong paningin,” isang idyomang nangangahulugang anumang inaakala nilang mabuti o maibigan nilang gawin.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “kasuklam-suklam na bagay na ito” o “kahiya-hiyang gawaing ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Likas at agarang panawag-pansin sa modernong Tagalog, nang hindi gumagamit ng makalumang anyo.
- source_word: בִתִּי הַבְּתוּלָה
  choice: ang anak kong dalaga, na isang birhen
  rationale: Pinananatili ang tahasang pahayag na birhen ang anak at hindi lamang walang asawa.
- source_word: וּפִילַגְשֵׁהוּ
  choice: at ang kanyang pangalawahing asawa
  rationale: Ipinahahayag ang kinikilalang relasyong tulad-asawa ngunit mas mababa ang katayuan; iniiwasan ang “kalaguyo,” na sa kasalukuyang Tagalog ay karaniwang nagpapahiwatig ng lihim o bawal na relasyon.
- source_word: אוֹצִיאָה נָּא
  choice: Pakiusap, hayaan ninyong ilabas ko sila
  rationale: Naihahatid ang kusang-loob na cohortative at ang pakiusap na ipinahihiwatig ng נָא.
- source_word: וְעַנּוּ אוֹתָם
  choice: Lapastanganin ninyo sila
  rationale: Ipinapakita ang marahas at seksuwal na paghamak sa konteksto nang hindi ginagawang mas tiyak kaysa sa saklaw ng pandiwang Hebreo; nililinaw sa talababa ang posibleng saling “gahasain.”
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: at gawin sa kanila ang mabuti sa inyong paningin
  rationale: Pinananatili ang matinding literal na idyoma ng Hebreo at ang nakapanghihilakbot na tensiyon nito sa konteksto.
- source_word: וְלָאִישׁ הַזֶּה לֹא תַעֲשׂוּ
  choice: Ngunit huwag ninyong gawin sa lalaking ito
  rationale: Pinananatili ang tahasang paghahambing at ang pangmaramihang pagbabawal.
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: ang ganitong karumal-dumal na gawa
  rationale: Ipinahahayag ang matinding moral na pagkasuklam ng נְבָלָה, hindi lamang ang kahulugan ng kamangmangan.
theological_decisions:
- issue: Kalinawan ng seksuwal na karahasan nang hindi lumalabis sa tiyak na leksikal na saklaw
  choice: Lapastanganin ninyo sila
  alternative: Gahasain ninyo sila
  rationale: Sa konteksto, malinaw na seksuwal at marahas ang balak, ngunit maaari ring saklawin ng pandiwang ענה sa Piel ang mas malawak na ideya ng marahas na paghamak o pagpapahiya. Pinananatili ng pangunahing teksto ang saklaw na iyon at inilalahad sa talababa ang mas tiyak na alternatibo.
- issue: Pagpapanatili sa moral na tensiyon ng sinabi ng matandang lalaki
  choice: Panatilihin ang literal na “ang mabuti sa inyong paningin”
  alternative: Gawin ninyo sa kanila ang anumang maibigan ninyo
  rationale: Hindi pinapawalang-sala ng tagapagsalaysay ang mungkahi. Ang literal na idyoma ay nagpapanatili sa nakakagimbal na agwat sa pagitan ng tawag ng nagsasalita na “mabuti” at ng karahasang iniaalok niya.
- issue: Kahulugan ng נְבָלָה bilang matinding paglabag sa moral at panlipunang kaayusan
  choice: karumal-dumal na gawa
  alternative: kahiya-hiyang gawa; kasuklam-suklam na bagay
  rationale: Ang parirala ay nagpapahayag ng matinding moral na pagkondena, hindi simpleng kahangalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Hindi pinalalambot ang seksuwal na karahasan o ang moral na pagkasuklam ng talata. Ginamit ang “pangalawahing asawa” bilang mas madaling maunawaang katumbas ng relasyong ipinahihiwatig ng פִּילֶגֶשׁ, sa halip na “kalaguyo,” na may naiibang karaniwang pahiwatig sa kasalukuyang gamit.
