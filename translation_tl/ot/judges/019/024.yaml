revisions:
- from: “Narito ang anak kong dalaga, na isang birhen, at ang kanyang pangalawahing asawa. Pakiusap, hayaan ninyong ilabas ko sila. Lapastanganin ninyo sila[a] at gawin sa kanila ang mabuti sa inyong paningin.[b] Ngunit huwag ninyong gawin sa lalaking ito ang ganitong karumal-dumal na gawa.[c]”
  to: “Narito ang birhen kong anak na babae at ang kanyang kalunya. Pakiusap, hayaan ninyong ilabas ko sila. Pagsamantalahan ninyo sila[a] at gawin ninyo sa kanila ang mabuti sa inyong paningin.[b] Ngunit huwag ninyong gawin sa lalaking ito ang karumal-dumal na gawaing ito.[c]”
  rationale: Pinalitan ang hindi natural at posibleng mapanlinlang na “pangalawahing asawa” ng “kalunya,” at ginawang mas malinaw sa konteksto ang pandiwa para sa seksuwal na pananakit. Inayos din ang parirala para sa anak na babae at ang pangwakas na demonstrative upang maging natural na modernong Tagalog habang pinananatili ang diin, kaayusan, at moral na pagkondena ng Hebreo.
