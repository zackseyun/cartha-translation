  source_fidelity: Ang pangunahing kahulugan at pagkakasunod ng Hebreo ay naipapasa, kabilang ang marahas na mungkahi at ang kasunod na pagbabawal. Ngunit ang “pangalawahing asawa” ay maaaring magpahiwatig na siya ay ikalawang asawa ayon sa pagkakasunod, samantalang ang פִּילֶגֶשׁ ay isang concubine/secondary-wife status. Ang “lapastanganin” ay maaari ring tumukoy sa paglapastangan sa banal o sa pangkalahatang pag-insulto at hindi sapat na malinaw ang seksuwal na pananakit sa kontekstong ito.
  naturalness: 'May ilang di-likas o hindi matatag na pagpili ng salita: “pangalawahing asawa” ay hindi karaniwang modernong anyo; mas tuwiran at kinikilalang termino ang “kalunya.” Ang “birhen kong anak na babae” ay mas natural at hindi paulit-ulit kaysa “anak kong dalaga, na isang birhen.”'
  terminology: “Kalunya” ang tumpak na modernong katumbas ng פִּילֶגֶשׁ nang hindi ipinahihiwatig na lihim o bawal na relasyon gaya ng “kalaguyo,” o simpleng pagkakasunod ng asawa gaya ng “pangalawang asawa.” “Pagsamantalahan” ay natural sa konteksto ng seksuwal na pananakit; pinananatili ng talababa ang mas tiyak na “gahasain.”
