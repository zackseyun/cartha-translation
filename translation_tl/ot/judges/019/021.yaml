  source_fidelity: Ang pandiwang וַיָּבָול ay tumutukoy sa pagbibigay/paghahanda ng pakain para sa mga asno, hindi sa pagkain ng mga asno mismo. Mas tuwirang naihahayag ito ng “binigyan ng pakain ang mga asno.” Ang magkakasunod na kilos at ang maramihang “sila” sa paghuhugas, pagkain, at pag-inom ay napapanatili.
  naturalness: Maiintindihan ang draft, ngunit ang “ipinaghanda ng pagkain ang mga asno” ay maaaring pansamantalang mabasa na ang mga asno ang naghanda o kaugnay ng pagkain sa di-likas na paraan. Ang rebisyon ay mas natural at malinaw sa makabagong Filipino. Pinalitan din ang inferential na “Kaya” ng payak na “At,” na mas tapat sa sunod-sunod na salaysay.
  terminology: Ang “asno” ay angkop na modernong katumbas ng חֲמוֹרִים. Ang “pakain” ay mas angkop kaysa pangkalahatang “pagkain” sa hayop. Ang kultural na talababa tungkol sa paghuhugas ng paa ay tumpak at maayos ang pagkakaangkla.
