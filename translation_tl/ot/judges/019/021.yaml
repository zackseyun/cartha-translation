- from: Kaya ipinasok niya ang lalaki sa kanyang bahay at ipinaghanda ng pagkain ang mga asno.[a] Pagkatapos, naghugas sila ng kanilang mga paa[b] at kumain at uminom.
  to: At dinala niya ang lalaki sa loob ng kanyang bahay at binigyan ng pakain ang mga asno.[a] Pagkatapos, naghugas sila ng kanilang mga paa[b] at kumain at uminom.
  rationale: Binago ang salin ng וַיָּבָול upang malinaw na ang may-bahay ang nagbigay ng pakain sa mga asno. Pinanatili ang “ang lalaki,” na ligtas batay sa agarang konteksto ng Levita, at ang di-tiyak na maramihang “sila” sa sumunod na mga kilos. Nananatili ang mga talababa sa wastong mga angkla at hindi binabago ang kahulugan ng talata.
