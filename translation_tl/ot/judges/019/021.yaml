  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: tl
  text: At dinala niya ang lalaki sa loob ng kanyang bahay at binigyan ng pakain ang mga asno.[a] Pagkatapos, naghugas sila ng kanilang mga paa[b] at kumain at uminom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “naghalo siya ng pakain para sa mga asno.”
    reason: lexical_alternative
  - marker: b
    text: Ang paghuhugas ng mga paa ay karaniwang bahagi ng pagtanggap sa mga panauhin sa sinaunang Malapit na Silangan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ
  choice: ipinasok niya ang lalaki
  rationale: Ang Hiphil ng בוא ay nagpapahayag ng pagpapapasok o pagdadala sa loob. Nilinaw ng “ang lalaki” ang panlalaking panghalip sa natural na Tagalog.
- source_word: לְבֵיתוֹ
  choice: sa kanyang bahay
  rationale: Kasunod ng pandiwang nagpapahiwatig ng pagpasok, natural na ipinahahayag nito ang hantungan sa loob ng bahay.
- source_word: וַיָּבָול
  choice: ipinaghanda ng pagkain
  rationale: Ang anyo mula sa בלל ay literal na tumutukoy sa paghahalo o paghahanda ng pakain para sa mga hayop. Pinananatili ng salin ang ideya ng paghahanda, hindi lamang ang pagpapakain.
- source_word: לַחֲמוֹרִים
  choice: ang mga asno
  rationale: Karaniwan at tuwirang katumbas ng חֲמוֹרִים sa makabagong Filipino.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: naghugas sila ng kanilang mga paa
  rationale: Tuwirang isinasalin ang kilos at pinananatili ang maramihang simuno at panghalip ng Hebreo, na hindi tahasang tinutukoy kung sino-sino ang kabilang sa pangkat.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: kumain at uminom
  rationale: Pinananatili ang maikli at sunod-sunod na estilo ng salaysay sa Hebreo.
