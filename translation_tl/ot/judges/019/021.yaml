translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinasok” upang natural na maipahayag ang pagdadala sa loob ng bahay, at “ipinaghanda ng pagkain” upang mapanatili ang diwa ng paghahalo o paghahanda ng pakain sa mga asno. Inayos ang mga talababa upang ang leksikal na paliwanag ay nakadikit sa pagkain ng mga asno at ang kultural na tala ay nakadikit sa paghuhugas ng paa.
