translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “asno,” “dayami,” at “pakain” bilang malinaw at karaniwang mga salitang angkop sa sinaunang tagpo. Pinanatili ang magalang na pananalita at ang bahagyang di-karaniwang mga panghalip ng tekstong Hebreo, na ipinaliwanag sa talababa sa halip na tahimik na baguhin.
