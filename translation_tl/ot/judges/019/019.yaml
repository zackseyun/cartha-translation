  - severity: low
    issue: Ang talababa a ay nagdaragdag ng “dala na nila.”
    rationale: Ipinahihiwatig ng konteksto ang pagkakaroon ng mga panustos, ngunit ang Hebreo ay nagsasaad lamang na mayroon sila nito. Mas maingat na ituon ang nota sa inuulit na panandang pandagdag.
