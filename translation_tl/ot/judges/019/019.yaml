base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: tl
  text: Mayroon din kaming dayami at pakain para sa aming mga asno, at mayroon ding tinapay at alak[a] para sa akin, sa iyong lingkod na babae,[b] at sa binatang kasama ng iyong mga lingkod.[c] Wala kaming anumang kulang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, inuulit ang panandang “din” upang idiin na mayroon silang kapuwa panustos para sa mga hayop at pagkain para sa mga tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “iyong lingkod na babae” ay magalang at mapagpakumbabang pagtukoy sa babaeng kasama sa paglalakbay.
    reason: cultural_note
  - marker: c
    text: Literal na “iyong mga lingkod.” Hindi ganap na malinaw ang eksaktong ugnayang tinutukoy ng pariralang ito sa konteksto.
    reason: textual_clarification
lexical_decisions:
- source_word: וְגַם ... גַּם ... וְגַם
  choice: din ... ding
  rationale: Pinananatili ang inuulit na panandang pandagdag na גַּם, ngunit isinasaayos sa likas na balangkas ng modernong Tagalog.
- source_word: תֶּבֶן
  choice: dayami
  rationale: Karaniwang katawagan sa tuyong tangkay na ginagamit bilang pagkain o sapin ng hayop.
- source_word: מִסְפּוֹא
  choice: pakain
  rationale: Tumutukoy sa pagkaing inilaan sa mga hayop at malinaw itong naiiba sa tinapay at alak para sa mga tao.
- source_word: לַחֲמוֹרֵינוּ
  choice: para sa aming mga asno
  rationale: Pinananatili ang pangmaramihan at ang unang panauhang pangmaramihang pagmamay-ari.
- source_word: לֶחֶם וָיַיִן
  choice: tinapay at alak
  rationale: Tahasang isinasalin ang dalawang tiyak na panustos na binanggit sa Hebreo.
- source_word: יֶשׁ לִי
  choice: mayroon ... para sa akin
  rationale: Sinasalamin ang eksistensiyal na kayarian ng Hebreo sa paraang natural sa Tagalog.
- source_word: אֲמָתֶךָ
  choice: iyong lingkod na babae
  rationale: Pinananatili ang pambabaeng anyo at ang magalang na pagpapakumbaba ng katawagan nang hindi gumagamit ng makalumang salita.
- source_word: לַנַּעַר
  choice: sa binata
  rationale: Ang נַעַר ay maaaring tumukoy sa isang binata o batang tagapaglingkod; pinananatili ng “binata” ang malawak na diwa ayon sa konteksto.
- source_word: עִם עֲבָדֶיךָ
  choice: kasama ng iyong mga lingkod
  rationale: Mahigpit na pinananatili ang ikalawang panauhang hulapi ng tekstong Masoretiko, kahit hindi pangkaraniwan ang pagtukoy sa pangkat ng nagsasalita bilang mga lingkod ng kausap.
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: Wala kaming kulang na anuman
  rationale: Likas na idyomang Tagalog para sa ganap na kasapatan, habang pinananatili ang diwa ng kawalan ng anumang kakulangan.
