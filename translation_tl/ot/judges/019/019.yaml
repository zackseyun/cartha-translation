  to: Mayroon din kaming dayami at pakain para sa aming mga asno, at mayroon ding tinapay at alak[a] para sa akin, sa iyong lingkod na babae,[b] at sa binatang kasama ng iyong mga lingkod.[c] Wala kaming anumang kulang.
