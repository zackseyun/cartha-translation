base_translation:
  language: en
  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ng kanyang panginoon, “Hindi tayo liliko papasok sa isang lungsod ng mga dayuhan, na ang mga naninirahan ay hindi kabilang sa mga anak ni Israel[a]. Magpapatuloy tayo hanggang sa Gibea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel.” Karaniwang katawagan ito sa bayang Israel; maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: kanyang panginoon
  rationale: Tumutukoy ito sa taong may awtoridad sa lingkod, hindi sa Diyos. Ang “panginoon” ay angkop sa marangal na salaysay at malinaw sa konteksto.
- source_word: נָסוּר
  choice: liliko papasok
  rationale: Ipinahihiwatig ng pandiwa ang paglihis mula sa dinaraanan upang pumasok at tumigil sa lungsod; natural na naipapahayag ito ng “liliko papasok.”
- source_word: עִיר נָכְרִי
  choice: isang lungsod ng mga dayuhan
  rationale: Ang נָכְרִי ay tumutukoy sa mga taong banyaga o hindi kabilang sa Israel. Mas malinaw sa Filipino ang “lungsod ng mga dayuhan” kaysa sa maaaring heograpikal lamang na “dayuhang lungsod.”
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: na hindi kabilang sa mga anak ni Israel
  rationale: Pinananatili nito ang pormang etniko ng Hebreo at inilalarawan ang lungsod ayon sa mga naninirahan dito, nang hindi labis na ipinapaliwanag ang kolektibong konstruksiyon.
- source_word: וְעָבַרְנוּ
  choice: magpapatuloy tayo
  rationale: Sa konteksto ng paglalakbay, nangangahulugan itong lampasan ang kasalukuyang pagpipilian at magpatuloy sa daan.
- source_word: עַד גִּבְעָה
  choice: hanggang sa Gibea
  rationale: Ang עַד ay nagsasaad ng hangganan o destinasyong aabutin; natural at tumpak ang “hanggang sa.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “panginoon” para sa ugnayang panlipunan sa pagitan ng amo at lingkod, habang nililinaw ng konteksto na hindi ito banal na titulo. Pinanatili sa pangunahing teksto ang “mga anak ni Israel,” kalakip ang mas natural na alternatibo sa talababa.
