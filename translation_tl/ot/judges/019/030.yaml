base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: tl
  text: At ang bawat nakakita nito ay nagsabi, “Wala pang ganitong nangyari o nakita mula nang umahon ang mga anak ni Israel[a] mula sa lupain ng Ehipto hanggang sa araw na ito. Pag-isipan ninyo ito, magsanggunian kayo, at magsalita kayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: At sinabi ng bawat nakakita nito
  rationale: Ang וְהָיָה ay nagbubukas ng naging kalagayan o bunga, at hindi kailangang isalin nang kahoy bilang “at nangyari.” Ang payak na nakaraang “sinabi” ay natural sa salaysay at ang “bawat” ay nagpapanatili sa saklaw ng כָל.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: Wala pang nangyaring o nakitang ganito
  rationale: Pinananatili ang dalawang pandiwang “nangyari” at “nakita,” pati ang diin na walang kapantay ang pangyayari, sa likas na ayos ng modernong Tagalog.
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: mula noong araw na umahon ang mga anak ni Israel mula sa lupain ng Ehipto
  rationale: Ang “umahon” ay malapit sa עֲלוֹת at nagpapanatili sa karaniwang pananalita tungkol sa paglabas mula sa Ehipto. Ang “mga anak ni Israel” ay tuwirang kumakatawan sa בְּנֵי יִשְׂרָאֵל.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Tuwirang pinananatili ang hangganang panahong umaabot sa kasalukuyan ng tagapagsalaysay.
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: Pag-isipan ninyo ito
  rationale: Ang idyoma ay panawagang ituon dito ang isip o pansin; ang saling ito ay malinaw at natural nang hindi dinaragdagan ang kahulugan.
- source_word: עֻצוּ
  choice: magpayo-payo kayo
  rationale: Ipinahahayag nito ang sama-samang pagsangguni at deliberasyon na hinihingi ng pangmaramihang pautos.
- source_word: וְדַבֵּרוּ
  choice: at magsalita
  rationale: Pinananatili ang maigsi at malawak na huling pautos, nang hindi nilalagyan ng tahasang layon na wala sa Hebreo.
theological_decisions:
- issue: Pagsasalin ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang anyong pampamilya ng Hebreo, samantalang inilalagay sa talababa ang natural na etnikong katawagan. Walang ipinapasok na natatanging doktrinal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matinding pag-uulit ng “nangyari” at “nakita,” ang tatlong sunod-sunod na pautos, at ang kawalan ng tahasang layon ng “magsalita.”
