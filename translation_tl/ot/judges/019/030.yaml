  to: At ang bawat nakakita nito ay nagsabi, “Wala pang ganitong nangyari o nakita mula nang umahon ang mga anak ni Israel[a] mula sa lupain ng Ehipto hanggang sa araw na ito. Pag-isipan ninyo ito, magsanggunian kayo, at magsalita kayo.”
