  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֤ישׁ הַ/זָּקֵן֙ שָׁל֣וֹם לָ֔/ךְ רַ֥ק כָּל מַחְסוֹרְ/ךָ֖ עָלָ֑/י רַ֥ק בָּ/רְח֖וֹב אַל תָּלַֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: tl
  text: Sinabi ng matandang lalaki, “Kapayapaan sa iyo. Ako na ang bahala sa lahat ng kailangan mo; huwag ka lamang magpalipas ng gabi sa liwasan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa lansangan.” Ang salitang Hebreo ay mas tiyak na tumutukoy sa isang bukás na pampublikong lugar o liwasan sa loob ng bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: ang matandang lalaki
  rationale: Likas at malinaw na salaysay sa modernong Filipino; pinananatili nito ang kapwa pangngalan at panuring ng Hebreo.
- source_word: שָׁלוֹם לָךְ
  choice: Kapayapaan sa iyo
  rationale: Pinananatili ang leksikal na diwa ng שָׁלוֹם bilang pormula ng pagbati o pagtiyak, nang hindi ito nilulutas bilang simpleng “Huwag kang mag-alala.”
- source_word: רַק
  choice: lamang
  rationale: Ipinahahayag ng “lamang” ang pagtatakda o pagbibigay-diin ng partikula, lalo na sa kundisyong huwag magpalipas ng gabi sa liwasan. Ang unang paglitaw nito ay likas na naihahatid ng ayos na nag-uugnay sa alok at sa tanging kundisyon.
- source_word: כָּל מַחְסוֹרְךָ
  choice: lahat ng kailangan mo
  rationale: Natural na katumbas sa Filipino ng lahat ng kakulangan o pangangailangan ng kausap sa konteksto ng pagpapatuloy.
- source_word: עָלַי
  choice: Ako na ang bahala
  rationale: Malinaw at karaniwang idyomang Filipino para sa literal na “nasa akin,” na nagsasaad na inaako ng nagsasalita ang pananagutan sa mga pangangailangan.
- source_word: בָּרְחוֹב
  choice: sa liwasan
  rationale: Ang רְחוֹב ay bukás na pampublikong lugar sa bayan, hindi lamang daanang lansangan. Ang “liwasan” ang pinakamaikli at natural na katumbas, habang inilalahad sa talababa ang posibleng alternatibo.
- source_word: אַל תָּלַן
  choice: huwag ka lamang magpalipas ng gabi
  rationale: Likas na Filipino para sa pagbabawal na manatili o matulog doon nang magdamag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang “Kapayapaan sa iyo” upang huwag sobrang ipaliwanag ang שָׁלוֹם. Inilagay ang panandang [a] pagkatapos ng “liwasan,” ang mismong salitang tinatalakay ng talababa.
