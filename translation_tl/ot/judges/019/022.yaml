base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: tl
  text: Habang nagsasaya sila, narito, pinaligiran ng mga lalaki sa lungsod—mga lalaking walang kabuluhan[a]—ang bahay, at malakas nilang kinakalampag ang pinto. Sinabi nila sa matandang may-ari ng bahay, “Ilabas mo ang lalaking pumasok sa bahay mo upang makilala namin siya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “mga anak ng kawalang-kabuluhan”; ibig sabihin, mga taong masama at walang kinikilalang batas.
    reason: lexical_alternative
  - marker: b
    text: Ang “makilala siya” ay isang seksuwal na eupemismo rito; nilalayon nilang seksuwal na pagsamantalahan ang lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: nagsasaya
  rationale: Ang idyoma ay literal na tumutukoy sa ‘pagpapabuti sa puso’ at sa konteksto ay nangangahulugang masayang pagsasalo. Ang “nagsasaya” ay likas at malinaw sa makabagong Tagalog.
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili nito ang biglaan at mariing pagbabago ng tagpo na ipinahihiwatig ng Hebreong panandang pangdiskurso.
- source_word: אַנְשֵׁי הָעִיר
  choice: mga lalaki sa lungsod
  rationale: Tuwirang katumbas ito ng pariralang Hebreo at hindi nito nililimitahan ang tinutukoy sa isang pormal na pangkat.
- source_word: אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: mga lalaking walang kabuluhan
  rationale: Pinananatili nito ang larawan ng kawalang-halaga o kawalang-kabuluhan habang ipinakikita ng konteksto ang kanilang kasamaan; inilalagay sa talababa ang mas literal na anyo at malinaw na diwa.
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: pinaligiran ... ang bahay
  rationale: Malinaw at natural nitong ipinahahayag ang pagkubkob o pagpalibot sa bahay.
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: malakas na kinakalampag ang pinto
  rationale: Ipinahihiwatig ng anyong pandiwa ang paulit-ulit at marahas na paghampas; ang “kinakalampag” ay natural na Tagalog para sa puwersahang pagkatok.
- source_word: בַּעַל הַבַּיִת
  choice: may-ari ng bahay
  rationale: Sa konteksto, tumutukoy ito sa lalaking namamahala at nagmamay-ari ng sambahayan. Mas natural ito kaysa sa literal ngunit di-likas na “panginoon ng bahay.”
- source_word: הַזָּקֵן
  choice: matanda
  rationale: Ang salita rito ay naglalarawan sa edad ng punong-abala, hindi kinakailangang sa isang pormal na katungkulan bilang nakatatanda.
- source_word: הוֹצֵא
  choice: Ilabas mo
  rationale: Tuwiran at natural nitong ipinapahayag ang pautos na dalhin ang panauhin sa labas.
- source_word: וְנֵדָעֶנּוּ
  choice: upang makilala namin siya
  rationale: Pinananatili nito ang Hebreong eupemismo at ang pampanitikang kaugnayan sa Genesis 19; nililinaw sa talababa ang seksuwal at marahas na layunin.
theological_decisions:
- issue: Paglilipat sa seksuwal na eupemismong וְנֵדָעֶנּוּ
  choice: Pinanatili sa pangunahing teksto ang “upang makilala namin siya,” na may paglilinaw sa talababa.
  alternative: “upang makipagtalik kami sa kanya” o “upang gahasain namin siya”
  rationale: Sadyang gumagamit ang Hebreo ng pandiwang “makilala” bilang eupemismo. Ang pagpapanatili nito ay gumagalang sa anyo at alusyon ng teksto, samantalang iniiwasan ng talababa ang maling pagkaunawa at nililinaw ang marahas na layunin sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang biglang “narito” at ang eupemismong “makilala” upang maingatan ang anyo at tensiyon ng Hebreo, habang nililinaw sa mga talababa ang mga idyomang maaaring hindi agad maunawaan.
