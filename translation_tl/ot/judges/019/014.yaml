  text: וַ/יַּעַבְר֖וּ וַ/יֵּלֵ֑כוּ וַ/תָּבֹ֤א לָ/הֶם֙ הַ/שֶּׁ֔מֶשׁ אֵ֥צֶל הַ/גִּבְעָ֖ה אֲשֶׁ֥ר לְ/בִנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: tl
  text: Kaya nagdaan sila at nagpatuloy sa kanilang paglalakbay. Inabutan sila ng paglubog ng araw malapit sa Gibea, na sakop ng lipi ni Benjamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa lupain ng Benjamin.” Ipinakikilala ng pariralang Hebreo ang Gibea bilang kaugnay ng lipi o teritoryo ng Benjamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: nagdaan sila
  rationale: Ipinahihiwatig ng עבר sa sunod-sunod na salaysay na hindi sila huminto sa naunang lugar kundi nagpatuloy lampas dito. Pinananatili ng “nagdaan sila” ang unang pandiwa ng paggalaw nang hindi nagdaragdag ng tiyak na layon.
- source_word: וַיֵּלֵכוּ
  choice: nagpatuloy sa kanilang paglalakbay
  rationale: Karaniwang nangangahulugang ‘pumunta/lumakad’ ang הלך. Ang pariralang ito ay natural sa modernong Tagalog at pinananatili ang ikalawang pandiwa ng paggalaw sa Hebreo.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: inabutan sila ng paglubog ng araw
  rationale: Literal itong ‘dumating sa kanila ang araw,’ isang idyomang nagsasaad na naabutan sila ng takipsilim habang naglalakbay. Natural at malinaw sa Tagalog ang napiling katumbas.
- source_word: אֵצֶל
  choice: malapit sa
  rationale: Nagsasaad ang pang-ukol ng pagiging malapit o nasa tabi; “malapit sa” ang pinakamalinaw na katumbas sa konteksto ng paglalakbay.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Bagaman maaari itong mangahulugang ‘burol,’ pangalan ito ng lugar sa kontekstong ito. Ginamit ang karaniwang anyong Tagalog na “Gibea.”
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: na sakop ng lipi ni Benjamin
  rationale: Malawak ang gamit ng לְ at dito ay nagpapakilala ng kaugnayan o pagkakasakop ng Gibea sa tribo o teritoryo ng Benjamin. Nilinaw ng “lipi” na ang tinutukoy ay ang tribo, hindi lamang ang indibidwal.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Pangalan ito ng tribo; ginamit ang nakaugaliang transliterasyon sa Tagalog.
