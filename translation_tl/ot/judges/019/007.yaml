translation:
  language: tl
  text: Bumangon ang lalaki upang umalis, ngunit mariin siyang hinimok ng kanyang biyenang lalaki[a]. Kaya't bumalik siya at nagpalipas ng gabi roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mariin siyang pinakiusapan”; ang pandiwang Hebreo ay nagpapahiwatig ng mapilit at patuloy na panghihimok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Tumindig
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad na bumangon o tumindig siya bilang paghahanda sa pag-alis. Dignified at natural sa salaysay ang “tumindig.”
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Literal na “ang lalaki” ang אִישׁ. Bagaman ang tinutukoy ay ang Levita, hindi tahasang ginamit ng Hebreo ang titulong iyon sa talatang ito.
- source_word: לָלֶכֶת
  choice: upang umalis
  rationale: Ang infinitive construct ng הלך pagkatapos ng קום ay nagpapahayag ng layunin. Sa konteksto, natural na ipinahihiwatig ng paglakad ang pag-alis, kaya malinaw at hindi labis ang “upang umalis.”
- source_word: וַיִּפְצַר בּוֹ
  choice: mapilit siyang hinimok
  rationale: Ang פצר ay nagpapahiwatig ng mariin at patuloy na panghihimok. Pinananatili ng “mapilit siyang hinimok” ang lakas ng pandiwa nang hindi ipinahihiwatig ang pisikal na pamimilit.
- source_word: חֹתְנוֹ
  choice: kaniyang biyenang lalaki
  rationale: Ang חֹתֵן ay kamag-anak na lalaki sa pamamagitan ng pag-aasawa at dito ay tumutukoy sa ama ng babae. Nililinaw ng “biyenang lalaki” ang kasarian na maaaring hindi malinaw sa salitang “biyenan” lamang.
- source_word: וַיָּשָׁב
  choice: bumalik siya
  rationale: Ang שׁוב ay nangangahulugang bumalik o tumalikod pabalik. Ang “bumalik siya” ay tuwiran at natural na nagpapakita ng pagbawi sa balak niyang umalis.
- source_word: וַיָּלֶן שָׁם
  choice: nagpalipas ng gabi roon
  rationale: Ang לון ay nangangahulugang manatili o tumuloy nang magdamag. Ang pariralang ito ay malinaw na nagpapanatili sa temporal na diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “biyenang lalaki” para sa tiyak na reperensiya at ang “mapilit siyang hinimok” upang maipahayag ang tindi ng Hebreong pandiwa nang hindi ito ginagawang pisikal na pamimilit.
