  to: Kinaumagahan, bumangon ang panginoon niya, binuksan ang mga pinto ng bahay, at lumabas upang magpatuloy sa kanyang paglalakbay. At naroon ang babae, ang kanyang kalunya, na nakabuwal[a] sa pasukan ng bahay, at ang mga kamay niya ay nasa pasimano.
