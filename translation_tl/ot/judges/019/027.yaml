base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: tl
  text: Kinaumagahan, bumangon ang panginoon niya, binuksan ang mga pinto ng bahay, at lumabas upang magpatuloy sa kanyang paglalakbay. At naroon ang babae, ang kanyang kalunya, na nakabuwal[a] sa pasukan ng bahay, at ang mga kamay niya ay nasa pasimano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakahandusay.” Mas literal, “nakabuwal” o “nakalagak na bumagsak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: ang panginoon niya
  rationale: Tuwirang pinananatili ang di-pantay na ugnayang ipinahihiwatig ng אֲדוֹן, nang hindi ito pinapakahulugang basta 'asawa.' Sa kontekstong ito, ang 'panginoon' ay dignified at nauunawaan bilang taong may kapangyarihan sa kanya.
- source_word: בַּבֹּקֶר
  choice: kinaumagahan
  rationale: Likas na salaysay na Tagalog para sa pangyayari sa umaga kasunod ng nagdaang gabi.
- source_word: דַּלְתוֹת הַבַּיִת
  choice: ang mga pinto ng bahay
  rationale: Pinananatili ang pangmaramihang דַּלְתוֹת at ang konkretong 'bahay.'
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: lumabas upang magpatuloy sa kanyang paglalakbay
  rationale: Ipinahahayag ang layunin ng infinitive construction sa natural na Tagalog; ang idiomang 'pumunta sa kanyang daan' ay magiging pilit.
- source_word: וְהִנֵּה
  choice: At naroon
  rationale: Nagbibigay ng bigla at matingkad na pagtutuon sa natuklasang tanawin, gaya ng הִנֵּה, ngunit mas natural kaysa 'narito' sa modernong salaysay.
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: ang babae, ang kanyang kalunya
  rationale: Pinananatili ang appositional na ayos at isinasalin ang פִילֶגֶשׁ bilang 'kalunya,' ang karaniwang terminong biblikal para sa babaeng nasa kinikilalang ngunit mas mababang uring ugnayan kaysa pangunahing asawa.
- source_word: נֹפֶלֶת
  choice: nakahandusay
  rationale: Likas at matingkad na inilalarawan ang resultang kalagayan ng babaeng nakalugmok o nakabulagta sa pasukan, habang ang mas literal na 'nakabulagta/nabuwal' na diwa ay tinatalakay sa talababa.
- source_word: פֶּתַח הַבַּיִת
  choice: sa pasukan ng bahay
  rationale: Malinaw at konkretong katumbas ng פֶּתַח bilang pasukan o bukana.
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: at ang mga kamay nito ay nasa ibabaw ng bungad
  rationale: Pinananatili ang hiwalay at matingkad na verbless clause. Ang 'bungad' ay natural na Tagalog para sa threshold sa konteksto ng pintuan.
theological_decisions:
- issue: Katayuan ng lalaki kaugnay ng babae
  choice: panginoon niya
  alternative: asawa niya
  rationale: Hindi pinapantay sa 'asawa' ang אֲדֹנֶיהָ, sapagkat binibigyang-diin ng salitang Hebreo ang awtoridad at panlipunang di-pagkakapantay, isang tensiyong mahalaga sa salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mabigat at malamig na tono ng salaysay, ang maramihang 'mga pinto,' at ang di-pantay na ugnayang nakapaloob sa 'panginoon niya.'
