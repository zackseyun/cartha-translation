  to: Lumabas ang lalaki, na siyang pinuno ng sambahayan, upang harapin sila, at sinabi sa kanila, “Huwag, mga kapatid ko! Nakikiusap ako, huwag kayong gumawa ng masama. Yamang pumasok sa bahay ko ang lalaking ito, huwag ninyong gawin ang karumal-dumal na gawaing ito.[a]”
