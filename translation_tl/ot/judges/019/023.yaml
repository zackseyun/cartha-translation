base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: tl
  text: Lumabas ang lalaki, na siyang pinuno ng sambahayan, upang harapin sila, at sinabi sa kanila, “Huwag, mga kapatid ko! Nakikiusap ako, huwag kayong gumawa ng masama. Yamang pumasok sa bahay ko ang lalaking ito, huwag ninyong gawin ang karumal-dumal na gawaing ito.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasuklam-suklam na bagay” o “kahiya-hiyang gawa.” Ang salitang Hebreo ay tumutukoy sa isang malubhang kahiya-hiya at masamang gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: pinuno ng sambahayan
  rationale: Tumutukoy ito sa lalaking may kapangyarihan at pananagutan sa bahay. Mas malinaw na naihahayag ng “pinuno ng sambahayan” ang panlipunang tungkulin kaysa sa “may-ari ng bahay,” na maaaring tumukoy lamang sa pagmamay-ari.
- source_word: אַחַי
  choice: mga kapatid ko
  rationale: Literal itong panawag na panlalaki, “mga kapatid ko,” ngunit dito ay ginagamit sa mga kapuwa lalaki sa bayan. Pinananatili ng salin ang anyo at pakiusap ng Hebreo.
- source_word: תָּרֵעוּ
  choice: gumawa ng masama
  rationale: Ang pandiwa ay isang mariing pagbabawal sa masamang asal. Natural at tuwiran sa makabagong Tagalog ang “gumawa ng masama.”
- source_word: נָא
  choice: nakikiusap ako
  rationale: Nagdaragdag ito ng matinding pakiusap at pagmamakaawa. Mas malinaw sa Tagalog ang “nakikiusap ako” kaysa sa simpleng “pakiusap.”
- source_word: אַחֲרֵי אֲשֶׁר בָּא ... אֶל־בֵּיתִי
  choice: Yamang pumasok sa bahay ko
  rationale: 'Sa konteksto, ipinapakita ng parirala ang kalagayang nagpapabigat sa gagawing paglabag: ang lalaki ay nasa ilalim na ng pagkupkop ng maybahay. Ang “yamang” ay natural na naghahatid ng kaugnayang pansanhi nang hindi labis na nagpapaliwanag.'
- source_word: הַנְּבָלָה הַזֹּאת
  choice: ang karumal-dumal na gawaing ito
  rationale: Ang נְבָלָה ay isang kahiya-hiya at lubhang kasuklam-suklam na gawa, hindi lamang karaniwang kamangmangan. Napananatili ng “karumal-dumal na gawain” ang bigat ng moral na pagkasuklam.
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: Lumabas sa kanila
  rationale: Tuwirang salin ito ng kilos ng lalaki patungo sa mga taong nasa labas, at natural sa daloy ng salaysay.
