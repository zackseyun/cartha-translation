  - severity: low
    issue: Medyo di-natural ang huling pangungusap ng talababa.
    rationale: Mas idiomatiko sa modernong Tagalog ang “malubhang kahiya-hiya at masamang gawa” kaysa “lubhang labag sa moralidad,” habang pinananatili ang moral na bigat ng נְבָלָה.
