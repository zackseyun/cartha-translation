source:
  edition: WLC
  text: הֵ֣ם עִם יְב֔וּס וְ/הַ/יּ֖וֹם רַ֣ד מְאֹ֑ד וַ/יֹּ֨אמֶר הַ/נַּ֜עַר אֶל אֲדֹנָ֗י/ו לְכָ/ה נָּ֛א וְ/נָס֛וּרָה אֶל עִֽיר הַ/יְבוּסִ֥י הַ/זֹּ֖את וְ/נָלִ֥ין בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: tl
  text: Nang malapit na sila sa Jebus[a] at halos lumubog na ang araw, sinabi ng binata[b] sa kanyang amo, “Halika po, lumihis tayo papunta sa lungsod na ito ng mga Jebuseo at magpalipas tayo roon ng gabi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Jebus ang naunang pangalan ng Jerusalem.
    reason: cross_reference
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “batang lalaki” o “tagapaglingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: Nang malapit na sila sa Jebus
  rationale: Sa konteksto ng paglalakbay, ang עִם kasama ng pangalan ng lugar ay nagpapahiwatig na nasa tabi o malapit sila rito. Natural sa Tagalog ang “malapit na sila sa Jebus.”
- source_word: יְבוּס
  choice: Jebus
  rationale: Pinanatili ang mas matandang pangalan ng lugar na nasa Hebreo sa halip na palitan ito agad ng “Jerusalem.”
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: at halos lumubog na ang araw
  rationale: Ipinahahayag ng parirala ang matinding pag-usad ng araw patungo sa paglubog. Pinananatili ng salin ang larawang kaugnay ng araw habang gumagamit ng likas na modernong Tagalog.
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Maaaring tumukoy ang נַעַר sa isang batang lalaki, binata, o tagapaglingkod. Ang “binata” ay nagpapanatili sa pangunahing kahulugang nauukol sa edad; nililinaw sa talababa ang posibleng kahulugang pang-gampanin.
- source_word: אֲדֹנָיו
  choice: sa kanyang amo
  rationale: Sa ugnayang panlipunan sa talata, tumutukoy ito sa nakatataas na pinaglilingkuran ng binata. Mas natural at tiyak dito ang “amo” kaysa “panginoon.”
- source_word: לְכָה נָּא
  choice: Halika po
  rationale: Ang pautos na anyo ay paanyaya sa pagkilos, at ang נָא ay nagpapalumanay sa pakiusap. Ang “po” ay natural na nagpapakita ng magalang na pakikiusap sa Tagalog.
- source_word: וְנָסוּרָה
  choice: lumihis tayo
  rationale: Ipinahihiwatig ng pandiwa ang paglihis mula sa kanilang ruta upang pumasok sa lungsod, at pinananatili ng “tayo” ang cohortative na diwa.
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: sa lungsod na ito ng mga Jebuseo
  rationale: Ginamit nang kolektibo ang katawagang Jebuseo para sa pangkat ng mga taong kaugnay ng lungsod; pinananatili rin ang demonstratibong “ito.”
- source_word: וְנָלִין בָּהּ
  choice: at doon magpalipas ng gabi
  rationale: Malinaw at natural nitong ipinapahayag ang pananatili roon nang magdamag nang hindi nagdaragdag ng diwa na wala sa pinagmulan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lungsod,” “amo,” at “magpalipas ng gabi” bilang karaniwang nauunawaang mga salita. Ang “Halika po” ay nagpapahayag ng magalang na pakiusap nang hindi ginagawang sobrang pormal ang pananalita.
