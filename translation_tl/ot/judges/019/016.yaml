revisions:
- from: At narito, isang matandang lalaki ang dumating mula sa kaniyang trabaho sa bukid nang gabing iyon. Ang lalaki ay mula sa bulubundukin ng Efraim, at naninirahan siya bilang dayuhan sa Gibea[a]; ngunit ang mga tagaroon ay mga Benjaminita.
  to: At narito, may isang matandang lalaking dumarating mula sa kaniyang gawain sa bukid nang dapit-hapon. Ang lalaking ito ay mula sa bulubunduking lupain ng Efraim at isang dayong naninirahan sa Gibea[a], ngunit ang mga tagaroon ay mga Benjaminita.
  rationale: Pinalitan ang panahong “nang gabing iyon” ng “nang dapit-hapon” upang mas malapit sa בָּעֶרֶב at maiwasan ang idinagdag na demonstratibo. Inayos ang paglalarawan sa paninirahan sa Gibea upang maging natural sa Filipino habang pinananatili ang nuwansang ang lalaki ay hindi katutubo roon. Napanatili ang pandiwang nasa aspektong nagaganap (“dumarating”) na angkop sa paglalarawan sa kaniyang pagdating sa tagpo.
