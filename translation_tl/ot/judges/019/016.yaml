  text: וְ/הִנֵּ֣ה אִ֣ישׁ זָקֵ֗ן בָּ֣א מִֽן מַעֲשֵׂ֤/הוּ מִן הַ/שָּׂדֶה֙ בָּ/עֶ֔רֶב וְ/הָ/אִישׁ֙ מֵ/הַ֣ר אֶפְרַ֔יִם וְ/הוּא גָ֖ר בַּ/גִּבְעָ֑ה וְ/אַנְשֵׁ֥י הַ/מָּק֖וֹם בְּנֵ֥י יְמִינִֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: tl
  text: At narito, may isang matandang lalaking dumarating mula sa kaniyang gawain sa bukid nang dapit-hapon. Ang lalaking ito ay mula sa bulubunduking lupain ng Efraim at isang dayong naninirahan sa Gibea[a], ngunit ang mga tagaroon ay mga Benjaminita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “dayong naninirahan” ay maaari ring tumukoy sa isang taong naninirahan o nakikipamayan sa isang lugar na hindi niya katutubong pinagmulan; hindi nito nililinaw kung pansamantala o matagal ang paninirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang panandang pasalaysay na nagpapakilala sa isang kapansin-pansing bagong pangyayari.
- source_word: אִישׁ זָקֵן
  choice: isang matandang lalaki
  rationale: Tuwiran, natural, at malinaw na salin ng pangngalan at panuring.
- source_word: בָּא מִן מַעֲשֵׂהוּ מִן הַשָּׂדֶה
  choice: dumating mula sa kaniyang trabaho sa bukid
  rationale: Pinagsasama nang natural sa Tagalog ang dalawang pariralang may מִן habang pinananatili ang diwang galing siya sa paggawa sa bukid.
- source_word: בָּעֶרֶב
  choice: nang gabing iyon
  rationale: Natural na panandang temporal sa salaysay; tumutukoy sa oras ng kaniyang pagdating.
- source_word: מֵהַר אֶפְרַיִם
  choice: mula sa bulubundukin ng Efraim
  rationale: Ang הַר אֶפְרַיִם ay pangheograpiyang katawagan sa maburol o bulubunduking lupain ng Efraim, hindi kinakailangang isang bundok lamang.
- source_word: גָר בַּגִּבְעָה
  choice: naninirahan siya bilang dayuhan sa Gibea
  rationale: Ipinahahayag ng גור ang paninirahan ng isang taong hindi katutubo sa lugar; mas tumpak ito kaysa sa payak na 'nakatira' lamang.
- source_word: וְאַנְשֵׁי הַמָּקוֹם
  choice: ngunit ang mga tagaroon
  rationale: Ginagawang lantad ng 'ngunit' ang contrast sa pagitan ng pinagmulan ng matanda at ng tribong kinabibilangan ng mga lokal.
- source_word: בְּנֵי יְמִינִי
  choice: mga Benjaminita
  rationale: Karaniwan at malinaw na katawagan sa mga kabilang sa lipi ni Benjamin.
