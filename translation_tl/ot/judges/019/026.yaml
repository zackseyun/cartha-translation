base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: tl
  text: Dumating ang babae nang magbukang-liwayway[a] at bumagsak sa pasukan ng bahay ng lalaki kung saan naroon ang kanyang panginoon[b], at nanatili roon hanggang lumiwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa pagbaling ng umaga”; maaari ring “sa pagsapit ng umaga” o, ayon sa konteksto, “bago mag-umaga.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kanyang amo.” Ang Hebreo ay katawagang nagpapahayag ng awtoridad at hindi tahasang nangangahulugang “kanyang asawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: nang magbukang-liwayway
  rationale: Ipinahahayag ng idyomang Hebreo ang pagdating o pagbaling ng umaga. Natural sa makabagong Filipino ang “nang magbukang-liwayway,” habang ang mas literal na mga posibilidad ay inilagay sa talababa.
- source_word: וַתָּבֹא
  choice: Dumating
  rationale: Pangunahing diwa ng בוא ang pagdating o pagparito. Hindi idinagdag ang diwang “bumalik,” na maaaring mahinuha sa salaysay ngunit hindi tahasang nasa pandiwa.
- source_word: וַתִּפֹּל
  choice: bumagsak
  rationale: Tuwirang katumbas ito ng נפל at pinananatili ang marahas at payak na paglalahad. Ang “nawalan ng malay” o “nanghina” ay magdaragdag ng paliwanag na wala sa salita.
- source_word: פֶּתַח בֵּית
  choice: sa pasukan ng bahay
  rationale: Ang פֶּתַח ay bukana o pasukan. Malinaw at natural ang parirala sa Filipino nang hindi ipinapalagay na mismong pinto ang tinutukoy.
- source_word: הָאִישׁ
  choice: ng lalaki
  rationale: Karaniwang pangngalang “lalaki” ang אִישׁ. Hindi ito ginawang “matandang lalaki” o “may-ari ng bahay,” kahit makikilala siya sa konteksto, upang hindi lumampas sa mismong teksto.
- source_word: אֲדוֹנֶיהָ
  choice: kanyang panginoon
  rationale: Ang אֲדוֹן na may hulaping pambabae ay literal na “kanyang panginoon.” Pinananatili nito ang ugnayang may awtoridad at hindi ito tahasang ginagawang “asawa,” sapagkat hindi iyon ang salitang ginamit dito.
- source_word: אֲשֶׁר ... שָׁם
  choice: kinaroroonan
  rationale: 'Natural na pinagsasama ng “kinaroroonan” ang kamag-anak na parirala at ang pang-abay na “doon”: ang bahay kung saan naroon ang kanyang panginoon.'
- source_word: עַד הָאוֹר
  choice: hanggang lumiwanag
  rationale: Ipinakikita ng parirala ang pagpapatuloy hanggang sa pagsapit ng liwanag ng araw. Idinagdag ang “nanatili roon” bilang kailangang panandang pandiwa sa Filipino para sa duratibong gamit ng עַד, nang hindi tinutukoy kung buhay o patay na siya.
theological_decisions:
- issue: Pagkakakilanlan ng אֲדוֹנֶיהָ
  choice: kanyang panginoon
  alternative: kanyang asawa
  rationale: Hindi tahasang tinatawag ng Hebreo na asawa ang lalaki sa talatang ito. Pinananatili ng salin ang katawagang nagpapahiwatig ng awtoridad at ang tensiyon sa ugnayan ng mga tauhan.
- issue: Kalagayan ng babae hanggang lumiwanag
  choice: nanatili roon hanggang lumiwanag
  alternative: nakahandusay siya roon hanggang lumiwanag
  rationale: Hindi nililinaw ng talata kung siya ay nakahandusay, walang malay, o patay na. Ang neutral na “nanatili roon” ay naghahayag ng tagal nang hindi inuunahan ang susunod na salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magbukang-liwayway” bilang pamilyar ngunit dignified na idyoma; iniwasan ang labis na arkaikong ayos at ang mga detalyeng hindi tahasang nasa Hebreo.
