reference: Judges 19:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Naglalakbay kami mula sa Betlehem sa Juda patungo sa malalayong bahagi ng kabundukan ng Efraim. Taga-roon ako, at pumunta ako sa Betlehem sa Juda. Papunta ako sa bahay ni Yahweh[a], ngunit walang lalaking tumatanggap sa akin sa kanyang bahay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “papauwi ako” o “papunta ako sa aking bahay.” Ganito inuunawa ng ilan ang Hebreo bilang isang idyoma o bilang bakas ng ibang pagbasa, sapagkat hindi inaasahan sa konteksto ang “bahay ni Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: Naglalakbay kami
  rationale: Ipinahahayag ng participle kasama ng panghalip ang kasalukuyang paglalakbay. Natural ito sa Tagalog at hindi ipinapalagay na daraan lamang sila sa Betlehem.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: mula sa Betlehem sa Juda
  rationale: Natural na pahayag sa modernong Tagalog para sa heograpikong pagtukoy sa Betlehem na nasa Juda.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: malalayong bahagi ng kabundukan ng Efraim
  rationale: Pinananatili ng “malalayong bahagi” ang diwa ng mga dulo o liblib na bahagi, at ang “kabundukan” ay natural na tawag sa rehiyong הַר אֶפְרַיִם.
- source_word: מִשָּׁם אָנֹכִי
  choice: Taga-roon ako
  rationale: Tuwirang ipinahahayag ang pinagmulan ng nagsasalita sa natural at maikling Tagalog.
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: at pumunta ako sa Betlehem sa Juda
  rationale: Pinananatili ang pinakanatural na nakaraang saysay ng wayyiqtol ng הלך sa halip na pakinisin ito bilang kasalukuyang kilos.
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: Ngayon ay papunta ako sa bahay ni Yahweh
  rationale: Sinusunod ang tahasang pagbasa ng Masoretic Text na “bahay ni Yahweh.” Ang “ngayon” ay nagpapalinaw sa pagbalik mula sa nakaraang “pumunta ako” tungo sa kasalukuyang patutunguhan nang hindi binabago ang kahulugan.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: ngunit walang lalaking nagpapatuloy sa akin sa kanyang bahay
  rationale: Sa konteksto ng pagtanggap sa panauhin, ang אסף ay nangangahulugang tanggapin o patuluyin sa bahay. Pinananatili ng “lalaki” ang panlalaking isahan na אִישׁ, at nililinaw ng “kanyang bahay” ang pahiwatig ng hospitality.
theological_decisions:
- issue: Pagpapakahulugan sa וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: papunta ako sa bahay ni Yahweh
  alternative: papauwi ako / papunta ako sa aking bahay
  rationale: Tahasan sa tekstong Masoretiko ang “bahay ni YHWH,” kaya iyon ang pinanatili sa pangunahing teksto. Dahil hindi inaasahan ang parirala sa konteksto at may mga nagmumungkahing idiomatiko o ibang pagbasa, inilagay ang alternatibo sa talababa sa halip na tahimik na ipalit.
- issue: Banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginamit ang transliterasyong “Yahweh” upang katawanin ang personal na banal na pangalan sa Hebreo at maging kaayon ng ibinigay na patakaran sa salin.
- issue: Panlalaking isahan na אִישׁ
  choice: walang lalaking
  alternative: walang sinuman
  rationale: Pinananatili ang kasariang tahasang nasa Hebreo; ang konteksto ay tungkol din sa lalaking puno ng sambahayan na maaaring magpatuloy sa manlalakbay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “naglalakbay,” “malalayong bahagi,” at “nagpapatuloy” bilang natural na mga salitang angkop sa salaysay at sa sinaunang kaugalian ng pagtanggap sa panauhin. Ang tandang talababa [a] ay inilagay agad pagkatapos ng pinagtatalunang parirala.
