revisions:
- from: Sinabi niya sa kanya, “Naglalakbay kami mula sa Betlehem sa Juda patungo sa malalayong bahagi ng kabundukan ng Efraim. Taga-roon ako, at pumunta ako sa Betlehem sa Juda. Ngayon ay papunta ako sa bahay ni Yahweh[a], ngunit walang lalaking nagpapatuloy sa akin sa kanyang bahay.”
  to: Sinabi niya sa kanya, “Naglalakbay kami mula sa Betlehem sa Juda patungo sa malalayong bahagi ng kabundukan ng Efraim. Taga-roon ako, at pumunta ako sa Betlehem sa Juda. Papunta ako sa bahay ni Yahweh[a], ngunit walang lalaking tumatanggap sa akin sa kanyang bahay.”
