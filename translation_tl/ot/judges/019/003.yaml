base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: tl
  text: Pagkatapos, tumindig ang kanyang asawa at sinundan siya upang kausapin siya nang buong lambing[a] at iuwi siyang muli[b]. Kasama niya ang kanyang batang lingkod at isang pares ng mga asno. Dinala siya ng babae sa bahay ng kanyang ama. Nang makita siya ng ama ng dalaga, masaya itong sumalubong sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “magsalita sa kanyang puso,” isang idyoma para sa magiliw o mapanghikayat na pagsasalita.'
    reason: lexical_alternative
  - marker: b
    text: 'Mahirap tiyakin ang anyong tekstuwal ng Hebreo rito: ang nakasulat na hulapi ay panlalaki, ngunit ipinahihiwatig ng konteksto na ang babae ang nais niyang iuwi muli.'
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: kanyang asawa
  rationale: Bagaman literal na “kanyang lalaki,” tumutukoy ito rito sa lalaking kinakasama niya sa ugnayang itinuturing na pag-aasawa; “asawa” ang likas na salin sa makabagong Tagalog.
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: kausapin siya nang buong lambing
  rationale: Ang literal na idyomang Hebreo ay “magsalita sa/ukol sa kanyang puso.” Ipinahihiwatig nito ang magiliw at mapanghikayat na pakikipag-usap; iniiwasan ng salin na ipako ang diwa sa pamimilit lamang.
- source_word: ל/השיב/ו
  choice: iuwi siyang muli
  rationale: Sa konteksto, layunin ng lalaki na maibalik ang babae mula sa bahay ng ama nito. Likas sa Tagalog ang “iuwi siyang muli,” habang ang suliranin sa anyong Hebreo ay inilalahad sa talababa.
- source_word: נַעֲרוֹ
  choice: kanyang batang lingkod
  rationale: Maaaring mangahulugan ang נַעַר ng binata o tagapaglingkod. Dahil kasama siya sa paglalakbay bilang alalay, pinananatili ng “batang lingkod” ang edad at tungkulin.
- source_word: צֶמֶד חֲמֹרִים
  choice: isang pares ng mga asno
  rationale: Ang צֶמֶד ay tumutukoy sa pares. Hindi ipinapalagay ng salin na talagang nakasingkaw ang mga asno.
- source_word: וַתְּבִיאֵהוּ
  choice: Dinala siya ng babae
  rationale: Pambabae at isahan ang simuno ng pandiwa sa Hebreo, kaya ang babae ang nagdala sa lalaki sa bahay ng kanyang ama.
- source_word: הַנַּעֲרָה
  choice: dalaga
  rationale: Tumutukoy ang salita sa isang batang babae o kabataang babae. Ang “dalaga” ay maikli, natural, at marangal sa kontekstong ito.
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: masaya itong sumalubong sa kanya
  rationale: Ipinahahayag ng Hebreo ang tuwa ng ama sa pagsalubong sa lalaki. Likas sa Tagalog ang pariralang ito at pinananatili ang kilos at damdamin.
