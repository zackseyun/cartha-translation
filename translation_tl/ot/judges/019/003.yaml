translation_notes:
  register: Makabago at marangal na Filipino; pinili ang mga karaniwang salitang “asawa,” “batang lingkod,” at “sumalubong.” Isinalin nang malinaw ang idyomang Hebreo ngunit pinanatili sa talababa ang literal na anyo at ang tekstuwal na kahirapan.
