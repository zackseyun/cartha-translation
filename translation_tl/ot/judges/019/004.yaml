translation_notes:
  register: Makabago at dignified na Filipino na madaling maunawaan. Ginamit ang ‘biyenan niyang lalaki’ upang tukuyin nang malinaw ang father-in-law, at pinanatili sa talababa ang lawak ng idyomang Hebreo mula sa mapilit na paghikayat hanggang sa posibleng pagpigil.
