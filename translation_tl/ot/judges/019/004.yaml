  to: Mahigpit siyang hinikayat[a] ng kaniyang biyenan, ang ama ng dalaga, na manatili. Nanatili siya roon kasama ng kaniyang biyenan nang tatlong araw; kumain sila, uminom, at doon nagpalipas ng mga gabi.
