  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: tl
  text: Mahigpit siyang hinikayat[a] ng kaniyang biyenan, ang ama ng dalaga, na manatili. Nanatili siya roon kasama ng kaniyang biyenan nang tatlong araw; kumain sila, uminom, at doon nagpalipas ng mga gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinilit,” “mapilit na hinikayat,” o “pinigilang umalis.” Literal na sinasabi ng idyomang Hebreo na ang biyenan niya ay “naging malakas sa/laban sa kaniya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: Mahigpit siyang hinimok ... na manatili
  rationale: Ang idyomang Hebreo ay literal na nagsasabing ‘naging malakas siya sa/laban sa kaniya.’ Sa konteksto, ipinahihiwatig nito ang mapilit na paghikayat na manatili, ngunit hindi tiyak na sapilitang pagpigil.
- source_word: חֹתְנוֹ
  choice: biyenan niyang lalaki
  rationale: Tumutukoy ito sa ama ng kinakasama ng Levita; nililinaw rin ito ng kasunod na pariralang ‘ama ng dalaga.’
- source_word: אֲבִי הַנַּעֲרָה
  choice: ama ng dalaga
  rationale: Tuwirang panuring ito sa biyenan. Ang ‘dalaga’ ay likas at marangal na katumbas ng נַעֲרָה sa konteksto ng isang kabataang babae.
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: nanatili siya roon kasama nito
  rationale: Sa salaysay na ito, ang יָשַׁב ay nangangahulugang manatili o tumuloy, hindi lamang literal na umupo.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: nang tatlong araw
  rationale: Tuwirang pahayag ng haba ng panahon.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: kumain sila at uminom
  rationale: Pinananatili ang dalawang payak na pandiwa sa Hebreo sa halip na ibuod bilang ‘nagpista.’
- source_word: וַיָּלִינוּ שָׁם
  choice: doon nagpalipas ng mga gabi
  rationale: Ang לון ay tumutukoy sa pagpapalipas ng gabi o pagtuloy. Ang maramihang ‘mga gabi’ ay angkop sa tatlong-araw na pananatili.
