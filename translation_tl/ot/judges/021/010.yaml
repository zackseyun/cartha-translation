  text: וַ/יִּשְׁלְחוּ שָׁ֣ם הָ/עֵדָ֗ה שְׁנֵים עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ מִ/בְּנֵ֣י הֶ/חָ֑יִל וַ/יְצַוּ֨וּ אוֹתָ֜/ם לֵ/אמֹ֗ר לְ֠כוּ וְ/הִכִּיתֶ֞ם אֶת יוֹשְׁבֵ֨י יָבֵ֤שׁ גִּלְעָד֙ לְ/פִי חֶ֔רֶב וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: tl
  text: Kaya nagsugo roon ang kapulungan ng labindalawang libong magigiting na mandirigma. Iniutos nila sa mga ito, “Humayo kayo at patayin sa pamamagitan ng espada ang mga naninirahan sa Jabes-Gilead, pati ang mga babae at mga bata.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: ang kapulungan
  rationale: Likas at marangal na salin para sa nagkakatipong pamayanan ng Israel sa kontekstong ito.
- source_word: מִבְּנֵי הֶחָיִל
  choice: mga magigiting na mandirigma
  rationale: Ang idyomang Hebreo ay tumutukoy sa mga lalaking may lakas at kakayahang pandigma; mas natural ito kaysa sa literal na “mga anak ng kagitingan.”
- source_word: וְהִכִּיתֶם
  choice: patayin
  rationale: Sa konteksto ng utos na gamitin ang espada at isama ang mga babae at bata, ang pandiwa ay may nakamamatay na diwa, hindi simpleng pananakit.
- source_word: לְפִי חֶרֶב
  choice: sa pamamagitan ng espada
  rationale: Isinasalin ang idyomang literal na “sa bibig/talim ng espada” sa malinaw na modernong Tagalog nang hindi binabawasan ang marahas na kahulugan.
- source_word: הַטָּף
  choice: mga bata
  rationale: Karaniwang tumutukoy sa maliliit na anak o mga dependent; “mga bata” ang natural at sapat na malawak na salin dito.
theological_decisions:
- issue: Paglalahad ng marahas na utos
  choice: Inilahad bilang utos ng kapulungan, hindi bilang tuwirang utos ng Diyos.
  alternative: Ipakahulugan o ipaliwanag sa teksto na sinang-ayunan o hinatulan ito ng Diyos.
  rationale: Ang talata mismo ay ang kapulungan ang nagsugo at nag-utos; hindi dapat magdagdag ng teolohikal na paghatol o pagsang-ayon na wala sa tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignified, at madaling maunawaan. Pinanatili ang bigat at saklaw ng marahas na utos nang walang pagpapalambot o dagdag na interpretasyon.
