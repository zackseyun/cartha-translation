  - severity: low
    issue: Hindi ganap na natural ang pambungad at ang pangkasariang saklaw ng “mga kapatid.”
    rationale: Ang “At mangyayari, kapag” ay mas maayos na salin ng וְהָיָה כִּי, at ang “mga kapatid na lalaki” ay malinaw na tumutugma sa אֲחֵיהֶם.
  - severity: medium
    issue: Ang talababa d ay inuulit ang nabaligtad na pagbasa.
    rationale: Kailangang itama rin ang paliwanag at alternatibong salin upang huwag ipakahulugang magkakasala sila dahil hindi sila nagbigay.
