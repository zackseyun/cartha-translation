revisions:
- from: At kapag dumating ang kanilang mga ama o mga kapatid upang makipagtalo sa amin,[a] sasabihin namin sa kanila, “Pagbigyan ninyo kami tungkol sa kanila,[b] sapagkat hindi kami nakakuha sa digmaan ng asawa para sa bawat lalaki.[c] Hindi naman kayo ang nagbigay sa kanila ng mga babae; kung gayon, ngayon ay magkakasala kayo.”[d]
  to: At mangyayari, kapag dumating ang kanilang mga ama o mga kapatid na lalaki upang makipagtalo sa amin,[a] sasabihin namin sa kanila, “Pagbigyan ninyo kami alang-alang sa kanila,[b] sapagkat hindi kami nakakuha sa digmaan ng asawa para sa bawat lalaki.[c] Hindi naman kayo ang nagbigay sa kanila ng mga babae; kung hindi, ngayon ay magkakasala kayo.”[d]
  rationale: Itinama ang pangwakas na lohika upang maipahayag ang ipinahihiwatig na kondisyunal na bunga ng Hebreo nang hindi inaangking tiyak ang isang pinagtatalunang sintaktikong pagsusuri. Pinakinis din ang Tagalog at nilinaw ang panlalaking “mga kapatid” ng pinagmulan. Ang natitirang kalabuan sa חָנּוּנוּ אֹתָם at sa masiksik na mga panghalip ay pinanatili sa salin at ipinaliwanag sa mga talababa.
