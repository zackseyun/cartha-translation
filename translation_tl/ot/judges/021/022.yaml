  text: וְ/הָיָ֡ה כִּֽי יָבֹ֣אוּ אֲבוֹתָ/ם֩ א֨וֹ אֲחֵי/הֶ֜ם ל/רוב אֵלֵ֗י/נוּ וְ/אָמַ֤רְנוּ אֲלֵי/הֶם֙ חָנּ֣וּ/נוּ אוֹתָ֔/ם כִּ֣י לֹ֥א לָקַ֛חְנוּ אִ֥ישׁ אִשְׁתּ֖/וֹ בַּ/מִּלְחָמָ֑ה כִּ֣י לֹ֥א אַתֶּ֛ם נְתַתֶּ֥ם לָ/הֶ֖ם כָּ/עֵ֥ת תֶּאְשָֽׁמוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: tl
  text: At mangyayari, kapag dumating ang kanilang mga ama o mga kapatid na lalaki upang makipagtalo sa amin,[a] sasabihin namin sa kanila, “Pagbigyan ninyo kami alang-alang sa kanila,[b] sapagkat hindi kami nakakuha sa digmaan ng asawa para sa bawat lalaki.[c] Hindi naman kayo ang nagbigay sa kanila ng mga babae; kung hindi, ngayon ay magkakasala kayo.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang magreklamo sa amin” o “upang magharap ng usapin laban sa amin.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “Magmagandang-loob kayo sa amin tungkol sa kanila.” Ang pakiusap ay maaaring unawaing humihingi ng pagpapahinuhod para sa mga nagsasalita may kinalaman sa mga babae.
    reason: lexical_alternative
  - marker: c
    text: 'Maikli at alanganin ang Hebreo: “hindi kami kumuha, bawat lalaki ng kanyang asawa, sa digmaan.” Malamang na ang ibig sabihin ay hindi sapat ang mga babaeng nakuha sa digmaan upang magkaroon ng asawa ang bawat lalaki ng Benjamin.'
    reason: cultural_note
  - marker: d
    text: 'Mahirap ang huling sugnay sa Hebreo. Ang diwa sa konteksto ay: dahil hindi pormal na ibinigay ng mga pamilya ang mga babae, hindi sila mananagot sa paglabag sa kanilang panunumpa. Ang “kung hindi” ay naghahayag ng ipinahihiwatig na bunga. Maaari ring isalin: “sapagkat hindi ninyo sila ibinigay sa kanila; ngayon ay magkakasala sana kayo.”'
    reason: textual_difficulty
lexical_decisions:
- source_word: לָרִיב
  choice: upang makipagtalo sa amin
  rationale: Ang ריב ay maaaring tumukoy sa pakikipagtalo, pagrereklamo, o paghaharap ng usapin. Pinananatili ng “makipagtalo” ang salungatang diwa nang hindi ipinapalagay na pormal na usaping legal ito.
- source_word: חָנּוּנוּ אוֹתָם
  choice: Pagbigyan ninyo kami tungkol sa kanila
  rationale: Ang pautos na חנן na may hulaping unang panauhang maramihan ay literal na humihiling na pakitaan ng awa o pabor ang mga nagsasalita. Ang kasunod na “sila” ay iniuugnay ang pakiusap sa mga babae nang hindi tiyak na ginagawang tuwirang layon ng pandiwa ang mga babae.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: hindi kami nakakuha sa digmaan ng asawa para sa bawat lalaki
  rationale: Siksik at alanganin ang Hebreo. Likas sa Tagalog ang ayos na ito at malinaw nitong ipinahihiwatig na hindi sapat ang mga asawang nakuha sa digmaan para sa bawat lalaking Benjaminita.
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: Hindi naman kayo ang nagbigay sa kanila ng mga babae
  rationale: Pinananatili nito ang diin sa אַתֶּם (“kayo”) at nililinaw ang tinutukoy ng unang panghalip na maramihan upang maiwasan ang nakalilitong pag-uulit ng “sila” sa Tagalog.
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: kung gayon, ngayon ay magkakasala kayo
  rationale: Mahirap at maikli ang huling parirala. Pinananatili ng salin ang temporal na כָּעֵת (“ngayon”) at ang diwa ng pagkakaroon ng pananagutan o sala, habang ang “kung gayon” ay naghahayag ng ipinahihiwatig na bunga sa konteksto.
theological_decisions:
- issue: Pananagutan ng mga ama at kapatid sa panunumpa ng Israel
  choice: Inilalarawan ang kawalan nila ng sala bilang nakasalalay sa hindi nila tuwirang pagbibigay sa mga babae.
  alternative: Sabihing tahasan at walang pasubali na wala silang anumang sala.
  rationale: Ang Hebreo ay nakatuon sa pagkakaiba ng tuwirang pagbibigay at pagkuha sa mga babae. Hindi dapat dagdagan ang teksto ng mas malawak na hatol na moral o denominasyonal.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Iniwasan ang sobrang literal na pag-uulit ng mga panghalip kapag magiging malabo ito sa Tagalog, ngunit pinanatili sa mga talababa ang siksik at mahirap na anyo ng Hebreo.
