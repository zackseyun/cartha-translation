  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: tl
  text: Pagkatapos, nagpadala ng mensahe ang buong kapulungan at nagsalita sa mga anak ni Benjamin na nasa bato ng Rimon[a], at ipinahayag sa kanila ang kapayapaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “na nasa Sela-Rimon.” Maaaring unawain ang Hebreo bilang paglalarawang “bato ng Rimon” o bilang isang mas nakapirming pangalan ng lugar.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: nagpadala ng mensahe
  rationale: Ang pandiwa ay payak na ‘nagpadala,’ ngunit ang kasunod na ‘nakipag-usap’ ay nagpapakitang isang mensaheng pakikipag-ugnayan ang ipinadala; hindi tahasang binabanggit sa Hebreo ang mga sugo.
- source_word: כָּל הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanan o pagtitipon ng Israel; natural at marangal sa modernong Tagalog ang ‘kapulungan.’
- source_word: וַיְדַבְּרוּ אֶל
  choice: nakipag-usap sa
  rationale: Ipinapahayag nito ang direktang pakikipag-usap sa mga Benjaminita at maayos na umuugnay sa ipinadalang mensahe.
- source_word: בְּנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang literal na pantribong pananalita ng Hebreo nang hindi ito ginagawang mas pangkalahatan kaysa sa pinagmulan.
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: na nasa Bato ng Rimon
  rationale: Ang סֶלַע ay ‘bato’ o ‘batuhan,’ samantalang ang רִמּוֹן ay bahagi ng katawagan sa lugar. Pinananatili sa talababa ang posibilidad na isang nakapirming pangalang-pook ang buong parirala.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: ipinahayag sa kanila ang kapayapaan
  rationale: Ang kayarian ay nagpapahiwatig ng pormal na pagpapahayag ng mapayapang ugnayan, hindi lamang isang karaniwang pagbati.
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Sa konteksto, tumutukoy ito sa pagpapanumbalik ng mapayapang ugnayan o pakikipagkasundo.
