  terminology: Ang “buong kapulungan,” “mga anak ni Benjamin,” at “kapayapaan” ay angkop. Pinananatili ang “Rimon” bilang anyong pangalan na gamit sa draft at ang alternatibong “Sela-Rimon” sa talababa.
