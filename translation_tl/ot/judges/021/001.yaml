  text: וְ/אִ֣ישׁ יִשְׂרָאֵ֔ל נִשְׁבַּ֥ע בַּ/מִּצְפָּ֖ה לֵ/אמֹ֑ר אִ֣ישׁ מִמֶּ֔/נּוּ לֹא יִתֵּ֥ן בִּתּ֛/וֹ לְ/בִנְיָמִ֖ן לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: tl
  text: 'Ang mga lalaki ng Israel ay nanumpa na sa Mizpa: “Walang lalaki sa amin ang magbibigay ng kanyang anak na babae sa isang Benjaminita[a] bilang asawa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kay Benjamin”; maaaring tumukoy sa lipi ni Benjamin bilang kabuuan o sa isang Benjaminita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Ang mga lalaki ng Israel
  rationale: Bagaman anyong isahan ang אִישׁ, kolektibo ang gamit nito rito para sa mga lalaking Israelita. Hindi na isinalin nang hiwalay ang pang-ugnay na וְ sapagkat natural na naipagpapatuloy ng talata ang salaysay sa Filipino.
- source_word: נִשְׁבַּע
  choice: ay nanumpa na
  rationale: Ang Niphal ng שׁבע ay nangangahulugang ‘manumpa’ o ‘sumumpa.’ Ipinahihiwatig ng ‘na’ na nauna ang panunumpa sa mga pangyayaring kasunod.
- source_word: בַּמִּצְפָּה
  choice: sa Mizpa
  rationale: Karaniwang gamit sa Filipino ang ‘sa’ upang tukuyin ang lugar kung saan ginawa ang panunumpa.
- source_word: לֵאמֹר
  choice: ipinakilala sa pamamagitan ng tutuldok
  rationale: Ang karaniwang Hebreong pormula para ipakilala ang tuwirang sinabi ay natural na naihahayag sa modernong Filipino sa pamamagitan ng tutuldok, sa halip na idagdag ang mabigat na ‘na sinasabi.’
- source_word: אִישׁ מִמֶּנּוּ
  choice: Walang lalaki sa amin
  rationale: 'Pinananatili nito ang panlalaki at pamahaging diwa ng Hebreo: walang isa man sa mga lalaking kabilang sa kanila.'
- source_word: לֹא יִתֵּן
  choice: ang magbibigay
  rationale: Sa loob ng panunumpa, ang negatibong imperfect ay isang mahigpit na pangako tungkol sa gagawin sa hinaharap. Natural na naipapahayag ito ng ‘walang … ang magbibigay.’
- source_word: בִּתּוֹ
  choice: ng kanyang anak na babae
  rationale: Tuwirang pinananatili ang isahang anak na babae at ang kaugnayan niya sa bawat lalaking nanumpa.
- source_word: לְבִנְיָמִן
  choice: sa isang Benjaminita[a]
  rationale: Ang pangalang Benjamin ay maaaring kumatawan sa lipi bilang kabuuan o sa isang kasapi nito. Dahil isang indibidwal ang magiging asawa, malinaw at natural sa Filipino ang ‘isang Benjaminita,’ habang itinatala sa talababa ang mas literal at kolektibong posibilidad.
- source_word: לְאִשָּׁה
  choice: bilang asawa
  rationale: Malinaw nitong ipinahahayag ang idyomang Hebreo tungkol sa pagbibigay ng anak na babae upang maging asawa.
