  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: tl
  text: At sinabi nila, “Alin sa mga lipi ng Israel ang hindi umakyat kay Yahweh sa Mizpa[a]?” At narito, walang kahit isang lalaki[b] mula sa Jabes-gilead ang dumating sa kampo, sa kapulungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa harap ni Yahweh sa Mizpa.” Maaaring unawain ang Hebreo bilang pagharap kay Yahweh sa lugar ng kapulungan.'
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “hindi dumating ang isang lalaki”; ang isahang anyo sa ilalim ng pagtanggi ay nagbibigay-diin na wala ni isang indibidwal mula sa Jabes-gilead ang dumalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Pinananatili ang karaniwang pagsulong ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ng mas tiyak na pagkakasunod-sunod sa panahon.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: Alin sa mga lipi ng Israel
  rationale: Natural na tanong sa Filipino para tukuyin ang isang pangkat mula sa kabuuan; napananatili ang pagpili ng iisang lipi bagaman ang sagot sa konteksto ay isang bayan.
- source_word: לֹא עָלָה
  choice: hindi umakyat
  rationale: Tuwirang pinananatili ang karaniwang Hebreong paglalarawan sa pagpunta sa isang banal o pampublikong pagtitipon.
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: kay Yahweh sa Mizpa
  rationale: Inilalarawan ang paglapit kay Yahweh at ang lugar ng pagtitipon nang hindi ginagawang dalawang magkahiwalay na destinasyon ang parirala.
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang pansin at bigat ng bigla o kapansin-pansing natuklasan sa salaysay.
- source_word: לֹא בָא אִישׁ
  choice: walang kahit isang lalaki ang dumating
  rationale: Ang isahang אִישׁ sa ilalim ng pagtanggi ay binigyang-diin bilang ganap na kawalan ng sinumang lalaki, sa natural na Filipino.
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: mula sa Jabes-gilead
  rationale: Malinaw na ipinahahayag ng “mula sa” ang pinagmulan; ginamit ang nakagawiang anyong Filipino ng pangalan ng lugar.
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: sa kampo, sa kapulungan
  rationale: Pinananatili ang magkatabing pagtukoy ng Hebreo sa kampo at sa nagkakatipong pamayanan, pati ang bahagyang pag-uulit nito.
theological_decisions:
- issue: Paglalarawan sa pagpunta אֶל יְהוָה sa Mizpa
  choice: kay Yahweh sa Mizpa
  alternative: sa harap ni Yahweh sa Mizpa
  rationale: Ang אֶל ay tuwirang nangangahulugang paglapit o pagpunta “kay,” ngunit maaaring ang diwa ay pagharap sa presensiya ni Yahweh sa pook ng kapulungan; pinanatili sa talababa ang tunay na posibilidad na iyon.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo, nang hindi pinapalitan ng isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang “umakyat,” “At narito,” at ang magkatabing “sa kampo, sa kapulungan” upang maipakita ang daloy at diin ng Hebreo, habang ginawang natural ang tanong sa pamamagitan ng “Alin sa mga lipi.”
