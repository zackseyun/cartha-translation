  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: tl
  text: Pagkatapos, sinabi ng mga nakatatanda ng kapulungan, “Ano ang gagawin natin para sa mga natitira upang magkaroon sila ng mga asawa, yamang nalipol ang mga babae ng Benjamin?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sapagkat mula sa Benjamin ay nalipol ang isang babae”; ginamit nang kolektibo ang isahang “babae” para sa mga babae ng Benjamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: matatandang pinuno ng kapulungan
  rationale: Ang זִקְנֵי ay tumutukoy sa mga kinikilalang nakatatandang pinuno, at ang הָעֵדָה ay sa buong nagkakatipong sambayanan. Nililinaw ng “pinuno” ang tungkulin nila, habang likas sa modernong Filipino ang “kapulungan.”
- source_word: מַה נַּעֲשֶׂה
  choice: Ano ang gagawin natin
  rationale: Ang tanong at unang panauhang maramihang imperfect ay nagpapahayag ng sama-samang pag-iisip tungkol sa susunod na gagawin.
- source_word: לַנּוֹתָרִים
  choice: ang mga natitirang lalaki
  rationale: Ang participle ay tumutukoy sa mga natira matapos ang paglipol. Idinagdag ang “lalaki” dahil malinaw sa konteksto na ang pinag-uusapan ay ang mga lalaking Benjaminita na nangangailangan ng mapapangasawa.
- source_word: לְנָשִׁים
  choice: upang magkaroon ng mga asawa
  rationale: Sa konteksto, ang נָשִׁים ay mga babaeng magiging asawa, hindi basta mga babae. Ang pariralang ito ay natural na Filipino at malinaw na nagpapahayag ng layuning pangmag-asawa.
- source_word: כִּי
  choice: yamang
  rationale: Ipinakikilala nito ang dahilan ng tanong; pinananatili ng “yamang” ang sanhi at ang marangal na himig.
- source_word: נִשְׁמְדָה
  choice: nalipol
  rationale: Ang Niphal ng שׁמד ay nagpapahayag ng pagkawasak o pagkalipol. Ang “nalipol” ay maikli, matindi, at angkop sa lawak ng karahasang nasa konteksto.
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: ang mga babae ng Benjamin
  rationale: Bagaman isahan ang אִשָּׁה sa Hebreo, kolektibo ang gamit nito. Ang maramihang “mga babae” ang malinaw at natural na katumbas sa Filipino; ang literal na anyo ay inilagay sa talababa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “matatandang pinuno” upang maiwasan ang pag-unawa sa “matatanda” bilang edad lamang, at “kapulungan” para sa korporatibong sambayanan. Pinanatili ang bigat ng karahasan sa salitang “nalipol.”
