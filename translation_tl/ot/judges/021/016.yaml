  naturalness: Natural at malinaw sa modernong Filipino ang rebisyon. Ang “mga nakatatanda ng kapulungan” ay marangal ngunit hindi lipas, at ang “para sa mga natitira upang magkaroon sila ng mga asawa” ay maayos na naghahatid ng idiomatikong puwersa ng Hebreo.
  terminology: Ang “kapulungan” ay angkop para sa הָעֵדָה. Ang “mga nakatatanda” ay mas malapit sa זִקְנֵי kaysa “matatandang pinuno,” habang hindi inaalis ang kinikilalang katayuan nila sa salaysay. Ang “nalipol” ay angkop at sapat na mabigat para sa נִשְׁמְדָה. Pinananatili ng talababa ang kolektibong gamit ng isahang אִשָּׁה.
