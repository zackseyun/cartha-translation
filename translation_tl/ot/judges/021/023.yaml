revisions:
- from: Kaya gayon ang ginawa ng mga anak ni Benjamin. Kumuha sila ng mga mapapangasawa, ayon sa bilang nila, mula sa mga babaeng sumasayaw na sapilitan nilang inagaw.[a] Pagkatapos, umalis sila at bumalik sa kanilang mana. Muli nilang itinayo ang mga lungsod[b] at nanirahan sa mga iyon.
  to: Gayon nga ang ginawa ng mga anak ni Benjamin. Kumuha sila ng mga asawa, ayon sa kanilang bilang, mula sa mga babaeng sumasayaw na kanilang inagaw.[a] Pagkatapos, umalis sila at bumalik sa minana nilang lupain. Muli nilang itinayo ang mga lungsod[b] at nanirahan sa mga iyon.
  rationale: Inayos ang mga pahayag para maging mas likas at mas tiyak sa modernong Tagalog, habang pinanatili ang pamilyar na pantribong katawagang “mga anak ni Benjamin,” ang sapilitang puwersa ng pag-agaw, at ang kahulugang minanang lupain. Nanatili ang “muli” na kontekstuwal na paglilinaw at malinaw itong tinatala sa talababa.
