language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: tl
  text: Gayon nga ang ginawa ng mga anak ni Benjamin. Kumuha sila ng mga asawa, ayon sa kanilang bilang, mula sa mga babaeng sumasayaw na kanilang inagaw.[a] Pagkatapos, umalis sila at bumalik sa minana nilang lupain. Muli nilang itinayo ang mga lungsod[b] at nanirahan sa mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay tumutukoy sa pag-agaw o sapilitang pagkuha; maaari ring isaling “na kanilang sapilitang kinuha” o “na kanilang tinangay.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “itinayo ang mga lungsod.” Ang “muli” ay batay sa konteksto ng mga lungsod ng Benjamin na nawasak sa naunang salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Kaya gayon ang ginawa
  rationale: Natural na pormulang pasalaysay sa Tagalog na nagsasaad na isinagawa nila ang planong inilahad sa naunang talata.
- source_word: בְּנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang pampamilya at pantribong anyo ng Hebreo at malinaw na tumutukoy sa mga lalaking kabilang sa lipi.
- source_word: וַיִּשְׂאוּ נָשִׁים
  choice: Kumuha sila ng mga mapapangasawa
  rationale: Ipinahahayag ang Hebreong idyoma ng pagkuha ng asawa nang hindi ipinapalagay na kusang-loob o karaniwang seremonya ng kasal ang pangyayari.
- source_word: לְמִסְפָּרָם
  choice: ayon sa bilang nila
  rationale: Malapit sa Hebreo at ipinahihiwatig na ang bilang ng mga babaeng kinuha ay tumugma sa bilang ng mga lalaking nangangailangan ng asawa.
- source_word: מִן הַמְּחֹלְלוֹת
  choice: mula sa mga babaeng sumasayaw
  rationale: Ginagawang lantad ang pambabaeng maramihan ng participle at gumagamit ng natural na modernong Tagalog.
- source_word: אֲשֶׁר גָּזָלוּ
  choice: na sapilitan nilang inagaw
  rationale: Pinananatili ang puwersa ng גזל bilang marahas o sapilitang pagkuha at hindi pinapahina ang moral na bigat ng salaysay.
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: umalis sila at bumalik
  rationale: 'Pinananatili ang dalawang pandiwa: pag-alis mula sa lugar ng pagdiriwang at pagbabalik sa sariling lupain.'
- source_word: אֶל נַחֲלָתָם
  choice: sa kanilang mana
  rationale: Ang 'mana' ay maikli at natural, habang pinananatili ang diwa ng lupaing minana o inilaan sa lipi.
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: Muli nilang itinayo ang mga lungsod
  rationale: Bagaman literal na 'itinayo,' ipinakikita ng 'muli' ang konteksto ng mga lungsod ng Benjamin na nawasak sa digmaan; itinatala sa talababa ang literal na anyo.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: nanirahan sa mga iyon
  rationale: Natural na modernong Tagalog para sa paninirahan sa mga lungsod, na may malinaw na panghalip na tumutukoy sa mga ito.
theological_decisions:
- issue: Moral na puwersa ng גָּזָלוּ sa paraan ng pagkuha sa mga babae
  choice: Isinalin bilang 'sapilitan nilang inagaw.'
  alternative: '''kinuha nila'' o ''dinala nila'''
  rationale: Hindi dapat pagaanin ng salin ang marahas at mapamilit na terminong Hebreo. Inilalahad ng teksto ang ginawa ngunit hindi nito hinihinging bigyang-matwid iyon ng tagapagsalin.
- issue: Pagpapanatili ng pantribo at panglupaing wika
  choice: Ginamit ang 'mga anak ni Benjamin' at 'kanilang mana.'
  alternative: '''mga Benjaminita'' at ''kanilang teritoryo'''
  rationale: Pinananatili ng mga pariralang ito ang pampamilya, pantribo, at minanang-lupaing himig ng Hebreo nang hindi gumagamit ng labis na arkaikong pananalita.
- issue: Kung gagawing tahasan ang muling pagtatayo ng mga lungsod
  choice: Muli nilang itinayo ang mga lungsod.
  alternative: Itinayo nila ang mga lungsod.
  rationale: Ang 'muli' ay angkop sa konteksto ng pagkawasak ng mga lungsod ng Benjamin, ngunit nililinaw sa talababa na walang hiwalay na katumbas ang salitang ito sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pasalaysay. Iniwasan ang pagpapalambot sa sapilitang pagkuha sa mga babae, at pinanatili ang mga katawagang pantribo at pangmana. Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
