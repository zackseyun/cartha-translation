  naturalness: 'May ilang bahagyang di-natural na pahayag: “Kaya gayon ang ginawa” ay mas maayos bilang “Gayon nga ang ginawa,” at mas malinaw sa modernong Tagalog ang “minana nilang lupain” para sa kontekstong ito.'
  terminology: Pinananatili ang “mga anak ni Benjamin” para sa בְּנֵי בִנְיָמִן. Ang “mga babaeng sumasayaw” ay wastong nagpapakita ng pambabaeng pangmaramihang participle. Ang “kanilang inagaw” ay sapat na marahas at hindi nagpapalambot sa גזל.
