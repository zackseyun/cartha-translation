  - severity: low
    issue: Medyo alanganin ang pambungad na “Kaya gayon ang ginawa.”
    rationale: Mas likas at tuwirang katumbas ng pormulang Hebreo ang “Gayon nga ang ginawa.”
  - severity: low
    issue: Malabo sa modernong Tagalog ang “bumalik sa kanilang mana.”
