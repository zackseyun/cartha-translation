  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: tl
  text: At sinabi nila, “Bakit, O Yahweh, Diyos ng Israel, nangyari ito sa Israel, na sa araw na ito ay mawalan ang Israel ng isang lipi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Pinananatili ang sunod-sunod na daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ang temporal na diwa.
- source_word: לָמָה
  choice: Bakit
  rationale: Likas at tuwirang katumbas ng tanong na nagpapahayag ng panaghoy at paghahanap ng dahilan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Malinaw at karaniwang salin ng construct chain na tumutukoy kay Yahweh bilang Diyos ng Israel.
- source_word: הָיְתָה זֹּאת
  choice: nangyari ito
  rationale: Bagaman literal na ‘naging ganito,’ ang parirala ay idyomatikong tumutukoy sa isang pangyayaring naganap; natural sa modernong Tagalog ang ‘nangyari ito.’
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Pinananatili ang lokatibo at kolektibong saklaw ng pang-ukol.
- source_word: לְהִפָּקֵד
  choice: mawawala
  rationale: Sa konteksto, ang Niphal ng פקד ay nagpapahiwatig na ang isang lipi ay magiging absent o hindi na mabibilang bilang bahagi ng Israel. Ang ‘mawawala’ ay natural at nagpapanatili sa inaasahang kalagayan, hindi nagsasabing naganap na ito.
- source_word: הַיּוֹם
  choice: sa araw na ito
  rationale: Bahagyang marangal na anyo na pinananatili ang diin ng tiyak na panahong tinutukoy.
- source_word: מִיִּשְׂרָאֵל
  choice: sa Israel
  rationale: Sa pandiwang ‘mawawala,’ natural na ipinahahayag ng ‘sa Israel’ ang pagkakahiwalay o pagkawala mula sa kabuuang bayan.
- source_word: שֵׁבֶט אֶחָד
  choice: isang lipi
  rationale: Tuwirang tumutukoy sa isang yunit ng mga lipi ng Israel; ‘lipi’ ang karaniwang terminong biblikal sa Tagalog.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Katayuan ng pagkawala ng isang lipi
  choice: “mawawala” bilang kinatatakutang kalalabasan
  alternative: “nawawala” bilang kasalukuyan nang kalagayan
  rationale: Ang infinitive na לְהִפָּקֵד kasunod ng panaghoy ay maaaring ilarawan ang resultang kinakaharap. Ang anyong ‘mawawala’ ay tumutugma sa diwang ‘that ... should be missing’ at hindi higit na nilulutas ang retorikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang bokatibong “O Yahweh” upang mapanatili ang taimtim na panaghoy. Ang gitling na mahaba ay naghihiwalay sa resultang sugnay nang hindi nangangailangan ng dagdag na paliwanag.
