  yaml_path: translation/ot/judges/021/020.yaml
  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: tl
  text: 'At inutusan nila ang mga anak ni Benjamin: “Humayo kayo at mag-abang sa mga ubasan.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: At inutusan nila
  rationale: Ang צוה ay nangangahulugang ‘mag-utos’ o ‘magbilin.’ Bagaman mukhang isahan ang nakasulat na anyo sa WLC, maramihan ang mga tagapagsalita sa konteksto (tingnan ang 21:19), kaya pinanatili ang ‘nila’ bilang natural na pagtukoy sa mga matatanda ng kapulungan.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: ang mga anak ni Benjamin
  rationale: Tuwirang inililipat ang Hebreong katawagang pampangkan na ‘mga anak ni Benjamin,’ na malinaw at likas pa rin sa Filipino.
- source_word: לֵאמֹר
  choice: '[ipinakikita sa tutuldok]'
  rationale: Ang karaniwang Hebreong panandang pambanggit ay natural na naipahahayag sa Filipino sa pamamagitan ng tutuldok bago ang tuwirang sinabi, sa halip na ng mabigat na ‘na sinasabi.’
- source_word: לְכוּ
  choice: Humayo kayo
  rationale: Maramihang pautos ng הלך. Ang ‘humayo kayo’ ay malinaw, marangal, at angkop sa salaysay.
- source_word: וַאֲרַבְתֶּם
  choice: at mag-abang
  rationale: Ang ארב ay tumutukoy sa pagtatago habang naghihintay upang sumalakay o dumakip. Natural sa Filipino ang ‘mag-abang’ sa kontekstong ito at hindi nito dinaragdagan ang layunin na hindi tahasang nasa pandiwa.
- source_word: בַּכְּרָמִים
  choice: sa mga ubasan
  rationale: Tuwirang katumbas ng pangmaramihang כרמים; natural sa Filipino ang ‘sa mga ubasan.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘mga anak ni Benjamin’ upang mapanatili ang Hebreong katawagang pampangkan, at ang tutuldok upang likas na ipakilala ang tuwirang pananalita.
