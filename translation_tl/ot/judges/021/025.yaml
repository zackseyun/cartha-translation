base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: tl
  text: Noong mga araw na iyon, walang hari sa Israel. Ginawa ng bawat isa[a] kung ano ang tama sa sarili niyang paningin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bawat lalaki”; panlalaking isahan ang Hebreo ngunit distributibo ang gamit nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Noong mga araw na iyon
  rationale: Likas at malinaw na pananalita sa makabagong Filipino para sa karaniwang pormulang Hebreo na tumutukoy sa isang nagdaang panahon.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: walang hari sa Israel
  rationale: Tuwirang inilalarawan ng eksistensiyal na negatibo ang kawalan ng hari sa bansang Israel.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Ang pangngalang panlalaking isahan ay ginagamit dito nang distributibo. Ang “bawat isa” ang natural na katumbas sa Filipino at saklaw nito ang buong populasyong tinutukoy, habang nililinaw sa talababa ang anyong panlalaki ng Hebreo.
- source_word: הַיָּשָׁר
  choice: kung ano ang tama
  rationale: Ang pang-uri na may pantukoy ay ginagamit bilang pangngalan, “ang tama/matuwid na bagay.” Natural sa Filipino ang “kung ano ang tama” at nananatili ang moral na diwa.
- source_word: בְּעֵינָיו
  choice: sa sarili niyang paningin
  rationale: Pinananatili nito ang idyomang Hebreo para sa pansariling paghatol nang hindi dinaragdagan ang pahayag ng tekstong pinagmulan.
- source_word: יַעֲשֶׂה
  choice: Ginagawa
  rationale: Bagaman imperfect ang anyong Hebreo, tumutukoy ito sa nakagawiang kilos sa nagdaang panahong inilalarawan. Sa Filipino, naipahihiwatig ng “ginagawa” sa kontekstong ito ang paulit-ulit o kinaugaliang pagkilos.
theological_decisions:
- issue: Panlalaking kinatawang pananalita sa אִישׁ
  choice: bawat isa, na may talababa tungkol sa literal na anyo
  alternative: bawat lalaki
  rationale: Ang Hebreo ay panlalaking isahan ngunit distributibo ang gamit. Inihahatid ng “bawat isa” ang saklaw ng pahayag sa natural na Filipino, samantalang pinananatili ng talababa ang impormasyong panggramatika.
- issue: Ipinahihiwatig na paghatol ng pangwakas na pahayag
  choice: Panatilihin ang pahayag nang walang idinagdag na mapanghusgang paglalarawan
  alternative: ginagawa ng bawat isa ang anumang maibigan niya
  rationale: Madalas unawain ang talata bilang negatibong pagsusuri sa kaguluhan ng Israel, ngunit sinasabi mismo ng Hebreo na ginagawa ng bawat isa ang tama sa sarili niyang paningin. Hindi ito dapat palalain o ipaliwanag sa mismong salin.
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Pinanatili ang idyomang “sa sarili niyang paningin” upang hindi mawala ang pansariling pamantayang ipinahihiwatig ng Hebreo.
