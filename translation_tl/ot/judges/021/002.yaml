  source_fidelity: Kailangang iwasan ang “humagulgol,” dahil mas tiyak ito kaysa sa Hebreong pandiwang para sa pag-iyak; hindi tahasang sinasabi ng pinagmulan na paghagulgol o pag-iyak nang malakas. Ang “dumating” ay mas malinaw ding naghahayag ng pagdating na isinasaad ng וַיָּבֹא. Ang “hanggang pagsapit ng gabi” ay mas tumpak sa עַד הָעֶרֶב kaysa sa “hanggang gabi,” na maaaring maunawaan bilang hanggang sa buong gabi.
  naturalness: Natural at marangal sa makabagong Filipino ang “naupo roon sa harapan ng Diyos,” “Itinaas nila ang kanilang tinig,” at “umiyak nang husto.” Mas maayos ang magkakahiwalay na mga sugnay upang mapanatili ang daloy ng salaysay.
  terminology: Ang “bayan,” “Bethel,” at “Diyos” ay angkop. Pinananatili ng “Diyos” ang הָאֱלֹהִים at hindi ipinapasok ang pangalang “PANGINOON.”
