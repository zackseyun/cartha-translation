base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: tl
  text: Pagkatapos, dumating ang bayan sa Bethel at naupo roon sa harapan ng Diyos hanggang pagsapit ng gabi. Itinaas nila ang kanilang tinig at umiyak nang husto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “umiyak sila ng matinding pag-iyak”; gumagamit ang Hebreo ng magkaugnay na pandiwa at pangngalan upang idiin ang tindi ng kanilang pagdadalamhati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumunta
  rationale: Isinasalaysay ng בוא ang pagdating sa isang pook. Sa natural na pananaw ng Tagalog na salaysay, ang “pumunta” ay angkop; hindi kailangang tukuying “pumasok.”
- source_word: הָעָם
  choice: ang bayan
  rationale: Tumutukoy ang עם sa nagkakatipong mga Israelita bilang isang kabuuan, hindi lamang sa hukbo. Pinananatili ng “bayan” ang kolektibong diwa.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Pangalan ito ng lugar, kaya ginamit ang nakasanayang transliterasyon sa halip na isaling “Bahay ng Diyos.”
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: naupo roon
  rationale: Maaaring mangahulugan ang ישב na umupo, manirahan, o manatili. Ang “naupo roon” ay nagpapanatili sa konkreto at nagtatagal na kilos sa kontekstong ito.
- source_word: עַד הָעֶרֶב
  choice: hanggang gabi
  rationale: Tuwiran at natural na salin ng pariralang panahunan.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: sa harap ng Diyos
  rationale: Pinananatili ang אֱלֹהִים bilang “Diyos,” hindi “PANGINOON,” at ang pormulang לִפְנֵי bilang “sa harap ng.”
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: nagtaas sila ng kanilang tinig
  rationale: Pinananatili nito ang idyomang Hebreo at malinaw na nagpapahiwatig ng malakas na pagdaing.
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: humagulgol nang matindi
  rationale: Ang magkaugnay na pandiwa at pangngalan sa Hebreo ay nagpapalakas sa tindi ng pag-iyak. Natural na ipinahahayag ito ng “humagulgol nang matindi,” habang inilalahad sa talababa ang mas pormal na anyo.
theological_decisions:
- issue: Paglalapat ng הָאֱלֹהִים sa isang konteksto ng pagsamba
  choice: Diyos
  alternative: PANGINOON
  rationale: אֱלֹהִים ang nasa tekstong Hebreo, hindi ang banal na pangalang YHWH; kaya hindi ito iniaangkop sa “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong Israel at “humagulgol nang matindi” upang natural na maihatid ang pinatinding pag-iyak; pinanatili sa talababa ang anyo ng idyomang Hebreo.
