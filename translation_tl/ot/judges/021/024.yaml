  text: וַ/יִּתְהַלְּכ֨וּ מִ/שָּׁ֤ם בְּנֵֽי יִשְׂרָאֵל֙ בָּ/עֵ֣ת הַ/הִ֔יא אִ֥ישׁ לְ/שִׁבְט֖/וֹ וּ/לְ/מִשְׁפַּחְתּ֑/וֹ וַ/יֵּצְא֣וּ מִ/שָּׁ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: tl
  text: Nang panahong iyon, umalis doon ang mga Israelita, bawat lalaki patungo sa kanyang lipi at angkan[a]. Umalis sila roon, bawat lalaki patungo sa kanyang minanang lupain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pamilya.” Ang salitang Hebreo ay maaaring tumukoy sa isang mas malawak na pangkat ng magkakamag-anak kaysa sa karaniwang sambahayan.
    reason: lexical_alternative
  - marker: b
    text: O “mana.” Dito, ang tinutukoy ay ang lupaing minana o inilaan sa bawat Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: umalis
  rationale: Sa kontekstong ito, ang hitpael ng הלך ay tumutukoy sa pag-alis o pagkakanya-kanyang lakad mula sa lugar, hindi sa paraan ng paglalakad.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang likas at malinaw na modernong Tagalog para sa kolektibong katawagang Hebreo na literal na ‘mga anak na lalaki ni Israel,’ nang hindi binabago ang tinutukoy na bayan.
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Tuwirang isinasalin nito ang panandang temporal at natural ang daloy sa salaysay.
- source_word: אִישׁ
  choice: bawat lalaki
  rationale: 'Distributibo ang gamit ng pangngalang panlalaki: isa-isa ang mga lalaking kabilang sa Israel na bumalik sa kani-kanilang pangkat at lupain.'
- source_word: לְשִׁבְטוֹ
  choice: patungo sa kanyang lipi
  rationale: Ang ‘lipi’ ang karaniwang katawagan sa pangunahing tribong pangkat sa Israel at malinaw sa modernong Tagalog.
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: at angkan
  rationale: Ang מִשְׁפָּחָה ay maaaring tumukoy sa pangkat ng magkakamag-anak na mas malawak kaysa sa sambahayan; ‘angkan’ ang pinakatumpak at natural dito.
- source_word: וַיֵּצְאוּ
  choice: Umalis sila
  rationale: Ipinapanatili nito ang ikalawang pahayag ng pag-alis sa Hebreo nang hindi ipinapalagay na tahasang sinasabi ng pandiwa ang pagbalik.
- source_word: לְנַחֲלָתוֹ
  choice: patungo sa kanyang minanang lupain
  rationale: Pinagsasama nito ang legal na diwa ng mana at ang kontekstuwal na kahulugan ng nakalaang teritoryal na pag-aari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang ‘mga Israelita’ sa halip na ang mas literal ngunit di-likas na ‘mga anak na lalaki ni Israel.’ Pinanatili ang pag-uulit ng dalawang pandiwa ng pag-alis at ang distributibong ‘bawat lalaki.’
