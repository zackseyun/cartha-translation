  source_fidelity: Tapat ang salin sa dalawang magkasunod na pandiwa ng pag-alis (ויתהלכו at ויצאו), sa panandang panahon, at sa distributibong pag-uwi ng bawat lalaki sa kanyang tribo/pangkat-kamag-anak at minanang lupain. Hindi nito idinadagdag na sila ay 'bumalik,' na hindi tahasang sinasabi ng Hebreo.
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang pag-uulit ng “umalis” ay katanggap-tanggap at mahalaga upang maipakita ang pag-uulit ng dalawang pandiwang Hebreo. Ang “lipi at angkan” ay maayos na pares sa kontekstong panlipunan ng Israel.
  terminology: Ang “mga Israelita,” “lipi,” “angkan,” at “minanang lupain” ay angkop, malinaw, at may wastong rehistrong pampanitikan. Wasto ring ipinaliwanag ng mga talababa ang mas malawak na saklaw ng angkan at ang teritoryal na diwa ng mana.
