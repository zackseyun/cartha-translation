  text: וַ/יֹּאמְר֡וּ הִנֵּה֩ חַג יְהוָ֨ה בְּ/שִׁל֜וֹ מִ/יָּמִ֣ים יָמִ֗ימָ/ה אֲשֶׁ֞ר מִ/צְּפ֤וֹנָ/ה לְ/בֵֽית אֵל֙ מִזְרְחָ֣/ה הַ/שֶּׁ֔מֶשׁ לִ/מְסִלָּ֔ה הָ/עֹלָ֥ה מִ/בֵּֽית אֵ֖ל שְׁכֶ֑מָ/ה וּ/מִ/נֶּ֖גֶב לִ/לְבוֹנָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: tl
  text: Sinabi nila, “Tingnan ninyo, may kapistahan ni Yahweh sa Shilo taun-taon.[a] Ang Shilo ay nasa hilaga ng Bethel, sa silangan ng lansangang umaahon mula Bethel patungong Shekem, at sa timog ng Lebona.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa mga araw hanggang sa mga araw,” isang idyomang nangangahulugang “taun-taon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Likas na panawag-pansin sa makabagong Filipino na pinananatili ang deiktikong diin ng Hebreo.
- source_word: חַג יְהוָה
  choice: kapistahan para kay Yahweh
  rationale: Ang חַג ay isang kapistahan, kadalasa’y kaugnay ng paglalakbay para sumamba. Ipinahahayag ng “para kay” ang kaugnayan nito kay Yahweh nang natural sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בְּשִׁלֹה
  choice: sa Shilo
  rationale: Tuwirang lokatibong parirala at makikilalang transliterasyon ng pangalan ng lugar.
- source_word: מִיָּמִים יָמִימָה
  choice: taun-taon
  rationale: Natural at malinaw na katumbas ng idyomang Hebreo para sa regular na taunang pagdiriwang.
- source_word: מִצְּפוֹנָה לְבֵית אֵל
  choice: nasa hilaga ng Bethel
  rationale: Malinaw na modernong paglalarawan ng lokasyon.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ
  choice: sa silangan
  rationale: Ang literal na “sa dakong sikatan ng araw” ay karaniwang panandang heograpiko para sa silangan.
- source_word: לִמְסִלָּה הָעֹלָה
  choice: ng lansangang paahon
  rationale: Ang מְסִלָּה ay isang pangunahing lansangan, at pinananatili ng “paahon” ang topograpikong diwa ng participle.
- source_word: מִבֵּית אֵל שְׁכֶמָה
  choice: mula Bethel patungong Shekem
  rationale: Ipinapakita ng hulaping direksiyonal sa שְׁכֶמָה ang pagpunta sa direksiyon ng Shekem.
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: at sa timog ng Lebona
  rationale: Kinukumpleto nito ang heograpikong paglalarawan ng kinaroroonan ng Shilo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Hindi pinagtatalunan sa kontekstong ito ang pagbasa, kaya pinananatili ang personal na pangalan sa transliterasyong Yahweh.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang hiwalay na pangungusap ang paglalarawan sa lokasyon ng Shilo upang maiwasan ang malabong pagkakabit ng mahabang sugnay, habang pinananatili ang lahat ng heograpikong detalye ng Hebreo.
