    issue: Ang “sumumpa tayo kay Yahweh” ay hindi sapat na malinaw na katumbas ng “sumumpa tayo sa pamamagitan ng/panunumpa kay Yahweh” sa Hebreo.
    rationale: Ang בַּיהוָה ay bahagi ng pormula ng panunumpa at karaniwang nagpapahiwatig ng pagpanunumpa sa ngalan ni Yahweh. Maaaring mabasa ang “sumumpa kay Yahweh” bilang simpleng pangakong ginawa sa kanya, samantalang ang pinagmulang teksto ay tumutukoy sa pangalang ipinananawagan sa panunumpa.
  - severity: low
    issue: Ang “upang maging asawa nila” ay bahagyang mas hindi tuwiran kaysa kinakailangan.
    rationale: Ang “bilang kanilang mga asawa” ay mas likas na Tagalog na paglalahad ng pagbibigay ng mga anak na babae sa kasal at mas malapit sa tungkuling ipinahihiwatig ng לְנָשִׁים.
