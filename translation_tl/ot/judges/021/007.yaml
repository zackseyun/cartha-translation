base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: tl
  text: Ano ang gagawin natin para sa mga natira[b] upang magkaroon sila ng mga asawa?[a] Sapagkat nanumpa tayo sa ngalan ni Yahweh na hindi natin ibibigay sa kanila ang alinman sa ating mga anak na babae bilang kanilang mga asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “para sa mga asawa”; ipinahihiwatig ng konteksto ang pagkakaroon ng mga asawa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga nakaligtas.”
    reason: alternative_reading
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה
  choice: Ano ang gagawin natin
  rationale: Ipinapahayag ng tanong at ng unang panauhang maramihang anyo ng pandiwa ang sama-samang pag-iisip tungkol sa dapat gawin; natural at tuwiran ito sa makabagong Tagalog.
- source_word: לָהֶם לַנּוֹתָרִים
  choice: para sa mga natira
  rationale: Pinagsasama nito ang diwang ‘para sa kanila’ at ang pagtukoy sa kanila bilang mga natira, nang hindi inuulit nang alanganin ang panghalip sa Tagalog.
- source_word: לְנָשִׁים
  choice: upang magkaroon sila ng mga asawa
  rationale: Elliptical ang Hebreo, na literal na ‘para sa mga asawa.’ Ginagawang malinaw ng salin ang ipinahihiwatig na layunin, habang minamarkahan sa talababa ang mas literal na anyo.
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ
  choice: Sapagkat sumumpa tayo
  rationale: Ang pangatnig ay nagbibigay ng dahilan sa suliraning binanggit sa tanong. Ang ‘sumumpa tayo’ ay natural na nagpapahayag ng naganap na sumpang nananatiling may bisa.
- source_word: בַיהוָה
  choice: kay Yahweh
  rationale: Sa Tagalog, ang ‘sumumpa kay Yahweh’ ay malinaw na pormula para sa panunumpang gumagamit sa banal na pangalan bilang saksi o panagot.
- source_word: לְבִלְתִּי תֵּת
  choice: na hindi natin ibibigay
  rationale: Ipinapahayag nito nang malinaw ang nilalaman ng kanilang sumpa.
- source_word: מִבְּנוֹתֵינוּ
  choice: ang sinuman sa ating mga anak na babae
  rationale: 'Ipinakikita ng ‘sinuman sa’ ang partitive na diwa ng מִן: walang isa man mula sa kanilang mga anak na babae ang ibibigay.'
- source_word: לְנָשִׁים
  choice: upang maging asawa nila
  rationale: Sa ikalawang paglitaw, ipinapahayag ng parirala ang layunin o katayuang pangmag-asawa ng mga anak na babaeng ibibigay.
theological_decisions:
- issue: Paglalapat ng moral na paghatol sa kilos ng Israel
  choice: Inilahad ang sumpa at suliranin nang walang idinagdag na pagsang-ayon o paghatol
  alternative: Lagyan ng salitang nagpapahiwatig na tama o mali ang kanilang pasiya
  rationale: Ang talata mismo ay nagsasalaysay ng kanilang deliberasyon at sumpa; hindi dapat ipasok ng salin ang isang teolohikal o moral na pasiyang hindi tahasang nasa pangungusap.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangngalang pantangi ang Tetragrammaton sa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang pagkakakilanlan nito bilang banal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘mga natira’ upang manatiling malapit sa participial na Hebreo, at nilinaw lamang sa pangunahing teksto ang elliptical na pariralang tungkol sa mga asawa; ang literal na anyo ay pinanatili sa talababa.
