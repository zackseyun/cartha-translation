- from: Ano ang gagawin natin para sa mga natira[b] upang magkaroon sila ng mga asawa?[a] Sapagkat sumumpa tayo kay Yahweh na hindi natin ibibigay sa kanila ang sinuman sa ating mga anak na babae upang maging asawa nila.
  to: Ano ang gagawin natin para sa mga natira[b] upang magkaroon sila ng mga asawa?[a] Sapagkat nanumpa tayo sa ngalan ni Yahweh na hindi natin ibibigay sa kanila ang alinman sa ating mga anak na babae bilang kanilang mga asawa.
  rationale: Pinanatili ang ligtas na kontekstuwal na paglilinaw sa unang “para sa mga asawa,” kasama ang talababa na nagpapakita ng elliptical na anyong Hebreo. Binago ang pormula ng panunumpa sa “nanumpa tayo sa ngalan ni Yahweh” upang maipakita ang gamit ng בַּיהוָה, at ginawang “bilang kanilang mga asawa” ang huling parirala para sa mas natural at tuwirang Tagalog.
