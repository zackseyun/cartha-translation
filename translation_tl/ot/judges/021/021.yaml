  - severity: medium
    issue: Ang "isang mapapangasawa" ay nagdaragdag ng kahulugang prospective.
    rationale: Ang Hebreo ay "ang kaniyang asawa" sa distributibong pahayag. Bagaman ipinahihiwatig ng konteksto ang pag-aasawa, hindi kailangang gawing "mapapangasawa" ang pangngalan.
  - severity: low
