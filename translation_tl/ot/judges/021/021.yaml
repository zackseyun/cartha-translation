  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: tl
  text: 'Magmasid kayo: kapag lumabas ang mga anak na babae ng Shilo upang sumayaw sa mga sayawan, lumabas kayo mula sa mga ubasan at agawin[a] ng bawat lalaki sa inyo para sa sarili ang isang asawa mula sa mga anak na babae ng Shilo; pagkatapos ay pumunta kayo sa lupain ng Benjamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dukutin” o “tangayin”; ang pandiwang Hebreo ay tumutukoy sa sapilitang pagkuha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם וְהִנֵּה
  choice: Magmasid kayo
  rationale: Sa konteksto ng pagtatago at paghihintay, ang parirala ay nagsisilbing utos na magbantay at maging handa. Natural itong pahayag sa makabagong Tagalog nang hindi pinananatili ang artipisyal na literal na “at narito.”
- source_word: אִם יֵצְאוּ
  choice: Kapag lumabas
  rationale: Bagaman kondisyonal ang אִם, inaasahan sa planong ito ang paglabas ng mga dalaga. Ang “kapag” ay natural na naghahayag ng kondisyon at panahon nang hindi ginagawang tiyak ang pangyayari.
- source_word: בְנוֹת שִׁילוֹ
  choice: mga dalaga ng Shilo
  rationale: Ang “mga dalaga” ay malinaw at natural sa konteksto ng pagpili ng mapapangasawa. Pinananatili ng “ng Shilo” ang panlipunan at panlugar na kaugnayan ng Hebreong idyoma.
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: upang sumayaw sa mga sayawan
  rationale: Pinananatili nito kapwa ang pandiwang “sumayaw” at ang pangmaramihang pangngalan para sa mga sayawan, nang hindi ipinapalagay na bilog ang anyo ng sayaw.
- source_word: וִיצָאתֶם מִן הַכְּרָמִים
  choice: lumabas kayo mula sa mga ubasan
  rationale: Tuwirang inilalarawan nito ang paglabas nila mula sa pinagtataguan sa mga ubasan.
- source_word: וַחֲטַפְתֶּם
  choice: dumakma
  rationale: Ang “dumakma” ay nagpapahayag ng biglaan at sapilitang pagkuha. Hindi nito pinahihina ang karahasan ng kilos at hindi rin ito dinaragdagan ng makabagong terminong legal.
- source_word: אִישׁ אִשְׁתּוֹ
  choice: bawat isa sa inyo ay ... ng isang mapapangasawa
  rationale: Ipinapakita nito ang distributibong diwa—tig-iisang babae ang kukunin ng bawat lalaki—sa natural na Tagalog. Nililinaw ng “mapapangasawa” ang layunin ng pagkuha.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: lupain ng Benjamin
  rationale: Pormal ngunit malinaw na katumbas ito ng heograpikong parirala sa Hebreo.
theological_decisions:
- issue: Paglalarawan sa sapilitang pagkuha sa mga babae
  choice: dumakma
  alternative: dukutin; tangayin; agawin
  rationale: Hindi ipinapakitang kusang-loob ang kilos at hindi rin pinapaganda ang moral na katangian nito. Gayunman, iniiwasan sa pangunahing teksto ang pagpasok ng isang tiyak na makabagong kategoryang legal na higit sa mismong salitang Hebreo.
- issue: Distributibong panlalaking pananalita
  choice: bawat isa sa inyo ... isang mapapangasawa
  alternative: bawat lalaki ang kaniyang asawa
  rationale: Ang kausap ay mga lalaki at ang Hebreo ay tahasang distributibo. Pinananatili ang kahulugan sa natural na Tagalog nang hindi ginagawang neutral ang kasarian.
- issue: Kondisyon o inaasahang panahon
  choice: Kapag
  alternative: Kung
  rationale: Ang eksena ay isang planong nakasalalay sa inaasahang paglabas ng mga dalaga. Ang “kapag” ay nagpapanatili ng pansamantalang kondisyon nang hindi ipinapahayag na naganap na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Shilo” at “Benjamin” ayon sa karaniwang anyong biblikal. Sadyang tuwiran ang “dumakma” upang hindi mapahina ang marahas na kilos na inilalarawan ng talata.
