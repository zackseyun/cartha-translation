  source_fidelity: Tumpak na naisasalin ng draft ang pagkakasunod ng mga kilos, ang tahasang “roon,” at ang maagang pagbangon. Gayunman, ang “mga handog para sa mabuting ugnayan” para sa שְׁלָמִים ay masyadong nagpapakitid sa saklaw ng terminong panghandog at maaaring magmukhang handog na may layuning ayusin ang relasyon. Ang “mga handog pangkapayapaan” ay mas malapit sa kinikilalang katawagang sakripisyal at pinananatili ang leksikal na kalabuan sa talababa.
  naturalness: Natural at malinaw ang ayos ng pangungusap sa modernong Filipino. Ang “altar” at “maagang bumangon” ay angkop sa marangal ngunit di-arkaykong rehistro. Mas natural at mas maigsi rin ang “mga handog pangkapayapaan” kaysa “mga handog para sa mabuting ugnayan.”
  terminology: Ang “mga handog na sinusunog” ay wastong salin ng עֹלוֹת. Pinalitan ang pangunahing salin ng שְׁלָמִים ng “mga handog pangkapayapaan,” habang ang mga dimensiyon nitong kagalingan at sama-samang pakikibahagi ay inilagay sa talababa, hindi idinagdag bilang interpretasyon sa teksto.
