base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: tl
  text: Kinabukasan, maagang bumangon ang mga tao. Nagtayo sila roon ng isang altar at naghandog ng mga handog na sinusunog at mga handog pangkapayapaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa mabuting kalagayan” o “mga handog ng pakikisalo.” Ang terminong Hebreo ay tumutukoy sa isang uri ng handog na kaugnay ng kapayapaan, kagalingan, at sama-samang pakikibahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Kinabukasan
  rationale: Likas at maikli itong salin ng pormulang pasalaysay at ng temporal na diwang “sa sumunod na araw,” nang hindi pinatitigas ang Filipino sa literal na “at nangyari.”
- source_word: וַיַּשְׁכִּימוּ
  choice: maagang bumangon
  rationale: Tuwirang pinananatili nito ang diin ng pandiwa sa maagang pagbangon.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Karaniwang kahulugan ito ng pangngalan. Bagaman Israel ang tinutukoy sa konteksto, hindi tahasang sinasabi rito ng Hebreo na “mga Israelita.”
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: Nagtayo sila roon ng isang altar
  rationale: Pinananatili ang tahasang שָׁם (“roon”) at gumagamit ng natural na ayos ng pangungusap sa modernong Filipino.
- source_word: וַיַּעֲלוּ
  choice: naghandog
  rationale: Sa konteksto ng paghahain, malinaw at natural na ipinapahayag ng “naghandog” ang idyomatikong kilos na tinutukoy ng Hebreo.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Malinaw itong katawagan sa karaniwang mambabasa para sa handog na inihahain sa pamamagitan ng pagsunog; hindi na idinagdag sa pangunahing teksto ang “buong” dahil hindi iyon tahasang nakasaad sa anyo ng salita rito.
- source_word: וּשְׁלָמִים
  choice: mga handog para sa mabuting ugnayan
  rationale: Naipahahayag nito sa natural na Filipino ang saklaw ng שְׁלָמִים na may kaugnayan sa kapayapaan, kabuuang kalagayan, at pakikipag-ugnayan, habang inilalagay sa talababa ang leksikal na mga alternatibo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa mga terminong panghandog
  choice: mga handog na sinusunog at mga handog para sa mabuting ugnayan
  alternative: mga handog na sinusunog at mga handog para sa kapayapaan / mga handog para sa mabuting kalagayan
  rationale: Pinangalanan lamang ng talata ang dalawang kinikilalang uri ng handog at hindi nito ipinaliliwanag ang teolohiya ng mga iyon. Kaya pinili ang malinaw na modernong katawagan at pinanatili sa talababa ang tunay na lawak ng kahulugan ng שְׁלָמִים, nang hindi ito ikinukulong sa isang doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Hinati sa dalawang pangungusap ang mahabang sunod-sunod na mga sugnay ng Hebreo para sa madaling pagbasa, ngunit pinanatili ang pagkakasunod ng mga kilos. Ginamit ang “altar,” isang laganap at madaling maunawaang katawagan sa Filipino.
