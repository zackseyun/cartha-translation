base_translation:
  language: en
  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: tl
  text: At sinabi nila, “Dapat may mana para sa mga nakaligtas mula sa lipi ni Benjamin[a], upang hindi mapawi ang isang lipi mula sa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang nalabi para sa Benjamin” o “mana para sa mga nakaligtas sa lipi ni Benjamin.” Magkatabing inilalagay sa Hebreo ang “mana” at “mga nakaligtas/nalabi,” kaya maaaring ipahayag sa higit sa isang likas na paraan ang eksaktong ugnayan ng dalawang pangngalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Pinananatili nito ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ng tiyak na temporal na kahulugan.
- source_word: יְרֻשַּׁת
  choice: mana
  rationale: Tumutukoy ito sa minanang bahagi o pag-aari; ang “mana” ay natural at malinaw sa konteksto ng pagpapanatili ng lupain at pagpapatuloy ng lipi.
- source_word: פְּלֵיטָה
  choice: mga nakaligtas
  rationale: Malinaw nitong tinutukoy ang mga Benjaminita na nakaligtas sa halos pagkalipol ng kanilang lipi, nang walang dagdag na teolohikal na pahiwatig na maaaring taglayin ng “nalabi.”
- source_word: לְבִנְיָמִן
  choice: sa Benjamin
  rationale: Ipinahahayag nito ang kaugnayan ng mga nakaligtas sa lipi ni Benjamin; kasabay nito, hindi lubusang nilulutas ang siksik na ugnayan ng mga pangngalan sa Hebreo.
- source_word: וְלֹא יִמָּחֶה
  choice: upang hindi mapawi
  rationale: Ang Niphal ng מחה ay nagsasaad ng pagkapawi o pagkabura. Ang “upang” ay likas na nagpapahayag ng layuning ipinahihiwatig ng konteksto.
- source_word: שֵׁבֶט
  choice: isang lipi
  rationale: Tumutukoy ito sa isa sa mga lipi ng Israel; pinananatili ng “isang” ang di-tiyak na anyo ng Hebreo.
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: 'Pinananatili nito ang separative na diwa ng מן: ang isang lipi ay hindi dapat mawala mula sa kabuuan ng Israel.'
