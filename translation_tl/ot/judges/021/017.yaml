translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lipi” para sa tribong bumubuo sa Israel at ang “mapawi” upang mapanatili ang bigat ng ganap na pagkawala nang hindi nagiging lipas o teknikal ang pananalita.
