base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: tl
  text: 'Ngunit hindi namin maaaring ibigay sa kanila bilang mga asawa ang aming mga anak na babae, sapagkat nanumpa ang mga anak ni Israel: “Sumpain ang sinumang magbigay ng asawa sa Benjamin[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tahasan, “sa lipi ni Benjamin” o “sa isang Benjaminita.” Tuwirang ginagamit sa Hebreo ang pangalang pantribo na “Benjamin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Ngunit hindi namin
  rationale: Ang pangatnig at tahasang panghalip ay nagbibigay-diin sa nagsasalita at nagpapakita ng pagsalungat sa naunang mungkahi; natural itong naihahayag sa Filipino sa “Ngunit ... namin.”
- source_word: לֹא נוּכַל
  choice: hindi ... maaaring
  rationale: Tumutukoy ang יכל sa kakayahan o posibilidad. Hindi idinagdag ang “ayon sa batas,” sapagkat ang tekstong Hebreo ay tuwirang nagsasaad lamang ng kawalan ng kakayahan, bagaman ang sumpa ang dahilan nito.
- source_word: לָתֵת לָהֶם נָשִׁים מִבְּנוֹתֵינוּ
  choice: ibigay sa kanila bilang mga asawa ang aming mga anak na babae
  rationale: Nililinaw ng “bilang mga asawa” na ang נָשִׁים ay nangangahulugang mga asawa sa konteksto, habang pinananatili ang aming mga anak na babae bilang pinagmumulan ng mga asawang ibibigay.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kanilang sinabing hindi nila magagawa; ang “sapagkat” ay malinaw, dignificado, at likas sa salaysay.
- source_word: נִשְׁבְּעוּ בְנֵי יִשְׂרָאֵל
  choice: nanumpa ang mga anak ni Israel
  rationale: Ang “nanumpa” ay natural na salin ng Niphal ng שׁבע. Pinananatili ng “mga anak ni Israel” ang pormal na panlalaking anyo ng Hebreo sa halip na gawing pangkalahatang “mga Israelita.”
- source_word: לֵאמֹר
  choice: ':'
  rationale: Sa modernong Filipino, sapat at mas natural ang tutuldok upang ipakilala ang mismong nilalaman ng sumpa; hindi kailangang ulitin ang literal na “na sinasabi.”
- source_word: אָרוּר נֹתֵן אִשָּׁה
  choice: Sumpain ang sinumang magbigay ng asawa
  rationale: Ang “Sumpain” ay nagpapanatili sa pormulang panghukuman o pangtipan ng אָרוּר. Ang “sinumang” ay natural na kumakatawan sa pangkalahatang gamit ng isahang participle נֹתֵן.
- source_word: לְבִנְיָמִן
  choice: sa Benjamin
  rationale: Tuwirang ginagamit ng Hebreo ang pangalang pantribo na Benjamin. Pinananatili ito sa pangunahing teksto upang hindi tahimik na lutasin kung ang tinutukoy ay ang tribo bilang kabuuan o isang Benjaminita.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sapagkat” at “Sumpain” upang mapanatili ang bigat ng panunumpa nang hindi nagiging lipas ang wika. Inilipat ang pariralang “bilang mga asawa” upang maging malinaw at natural ang ugnayan ng “ibigay” at “aming mga anak na babae.”
