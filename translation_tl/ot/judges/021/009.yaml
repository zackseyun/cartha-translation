  text: וַ/יִּתְפָּקֵ֖ד הָ/עָ֑ם וְ/הִנֵּ֤ה אֵֽין שָׁם֙ אִ֔ישׁ מִ/יּוֹשְׁבֵ֖י יָבֵ֥שׁ גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: tl
  text: Nang bilangin ang mga tao, napag-alamang wala roong kahit isang lalaki mula sa mga naninirahan sa Jabes-Gilead.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “wala roong sinuman mula sa mga naninirahan sa Jabes-Gilead.” Mas literal sa Hebreo ang “wala roong kahit isang lalaki”; maaaring sumasalamin ang panlalaking pananalita sa konteksto ng pagtitipon o hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: Nang bilangin
  rationale: Ang anyong ito ng פקד ay tumutukoy sa pagbilang o pagtala sa nagkakatipong bayan. Natural sa modernong Tagalog ang “bilangin,” at hindi nito labis na nililimitahan ang tagpo sa hukbo lamang.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Karaniwang kahulugan ng עָם ang bayan o mga tao. Sa konteksto, ito ang nagkakatipong pangkat ng Israel, ngunit hindi tahasang tinawag na hukbo sa Hebreo.
- source_word: וְהִנֵּה
  choice: napag-alamang
  rationale: Ipinahihiwatig ng וְהִנֵּה ang kapansin-pansing natuklasan matapos ang pagbilang. Ang “napag-alamang” ay likas na salaysay sa Tagalog at pinananatili ang biglang pagkatuklas, bagaman hindi literal na “narito.”
- source_word: אֵין שָׁם אִישׁ
  choice: wala roong kahit isang lalaki
  rationale: Pinananatili ang panlalaking isahan na אִישׁ bilang “lalaki,” at ang “kahit isang” ay malinaw na naghahayag ng lubos na kawalan sa talaan.
- source_word: מִיּוֹשְׁבֵי
  choice: mula sa mga naninirahan sa
  rationale: Ang participle ng ישב ay tumutukoy sa mga taong nakatira sa isang lugar. Karaniwan at malinaw sa modernong Tagalog ang “mga naninirahan sa.”
- source_word: יָבֵשׁ גִּלְעָד
  choice: Jabes-Gilead
  rationale: Isinalin sa karaniwang anyong Tagalog ng pangalan ng lugar at ginamitan ng gitling upang katawanin ang iisang toponimo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “napag-alamang” upang maipahayag nang idiomatiko ang puwersa ng וְהִנֵּה sa konteksto ng pagbilang. Pinanatili sa pangunahing teksto ang tahasang panlalaking אִישׁ, habang inilagay sa talababa ang posibleng mas pangkalahatang salin.
