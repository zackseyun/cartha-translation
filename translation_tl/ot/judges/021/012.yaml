translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Isinalin ang seksuwal na idyomang Hebreo ayon sa malinaw nitong kahulugan, nang hindi gumagamit ng malabo o lipas na pananalita. Ginamit ang mga anyong pangalang Jabes-Gilead, Shilo, at Canaan.
