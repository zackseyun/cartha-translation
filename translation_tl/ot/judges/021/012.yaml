base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: tl
  text: Sa mga naninirahan sa Jabes-Gilead ay nakatagpo sila ng apatnaraang kabataang babae na birhen, na hindi pa nakipagtalik sa sinumang lalaki. Dinala nila ang mga ito sa kampo sa Silo, na nasa lupain ng Canaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: mula sa mga naninirahan sa Jabes-Gilead
  rationale: Pinananatili ang pang-ukol na מִן (“mula sa”) at malinaw na tinutukoy ang mga naninirahan sa lugar.
- source_word: אַרְבַּע מֵאוֹת נַעֲרָה בְתוּלָה
  choice: apatnaraang dalagang birhen
  rationale: Ang נַעֲרָה ay isang batang babae o dalaga, at ang בְתוּלָה ay tahasang nagsasaad na birhen; pinananatili ang dalawang diwa nang natural sa Tagalog.
- source_word: אֲשֶׁר לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: na hindi pa nakipagtalik sa isang lalaki
  rationale: Ang literal na idyomang “hindi nakakilala ng lalaki sa paghiga ng isang lalaki” ay tumutukoy sa pakikipagtalik; ang salin ay malinaw at dignified sa modernong Tagalog.
- source_word: וַיָּבִיאוּ אוֹתָם
  choice: Dinala nila ang mga ito
  rationale: Ang panlalaking panghalip sa Masoretic Text ay ginagamit dito para sa grupong nabanggit; ang “mga ito” ay natural at hindi nagdaragdag ng interpretasyon.
- source_word: הַמַּחֲנֶה שִׁלֹה
  choice: kampo sa Shilo
  rationale: Ang sintaks ay natural na nauunawaan bilang kampong nasa Shilo, hindi bilang “kampo ng Shilo.”
