base_translation:
  language: en
  yaml_path: translation/ot/judges/021/006.yaml
  text: And the sons of Israel grieved over Benjamin their brother[a], and they said, “Today one tribe has been cut off from Israel.”
translation:
  language: tl
  text: At nalungkot ang mga Israelita dahil sa kapatid nilang si Benjamin[a], at sinabi nila, “Ngayon ay naputol mula sa Israel ang isang lipi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nahabag sa kapatid nilang si Benjamin” o “nalungkot para sa kapatid nilang si Benjamin.” Ang pandiwang Hebreo ay maaaring magpahayag ng kalungkutan, pagkahabag, o, sa ibang konteksto, pagbabago ng pasiya hinggil sa isang tao o bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: nalungkot
  rationale: Ang Niphal ng נחם ay maaaring magpahayag ng kalungkutan, pagkahabag, o pagbabago ng pasiya. Sa konteksto ng halos pagkalipol ng Benjamin, likas at malinaw ang “nalungkot,” habang pinananatili sa talababa ang iba pang posibleng diwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Ito ang natural at kasalukuyang katawagan sa modernong Filipino para sa kolektibong “mga anak ni Israel,” at hindi nito binabago ang korporatibong kahulugan.
- source_word: אֶל
  choice: dahil sa
  rationale: Kasama ng נחם, ipinakikilala nito ang pinatutungkulan o sanhi ng kalungkutan/pagkahabag. Ang “dahil sa” ay natural na kaugnay ng “nalungkot” sa Filipino.
- source_word: בִּנְיָמִן אָחִיו
  choice: kapatid nilang si Benjamin
  rationale: Ang isahang hulaping “kanyang” ay ginagamit nang kolektibo kaugnay ng maramihang Israelita; malinaw na ipinahahayag ng salin ang pagkakapatid ng mga lipi.
- source_word: נִגְדַּע
  choice: naputol
  rationale: Pinananatili nito ang larawang literal ng גדע, “putulin/pumutol,” at ang malubhang pagkawala ng isang lipi nang hindi tahasang pinalalabis bilang ganap na pagkalipol.
- source_word: הַיּוֹם
  choice: Ngayon
  rationale: Natural na katumbas sa modernong Filipino at pinananatili ang agarang panahon ng panaghoy.
- source_word: שֵׁבֶט אֶחָד
  choice: isang lipi
  rationale: Ang “lipi” ang karaniwang terminong Filipino para sa isang yunit ng mga tribo ng Israel.
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: Tumpak na ipinahahayag ang paghihiwalay o pagkawala mula sa kabuuan ng Israel.
