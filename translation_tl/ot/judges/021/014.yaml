base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: tl
  text: Noong panahong iyon, bumalik ang mga Benjamita, at ibinigay sa kanila ang mga babaeng pinanatili nilang buhay mula sa mga babae ng Jabes-Gilead; ngunit hindi sila nakahanap ng sapat na babae para sa kanila sa paraang iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ngunit hindi sila nakasumpong nang gayon para sa kanila.” Elliptical ang pahayag sa Hebreo; ipinahihiwatig ng konteksto na hindi sapat ang mga babae para sa mga Benjamita sa paraang ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Ang שׁוב sa anyong pasalaysay ay likas na nangangahulugang “bumalik”; kolektibo ang paksa nito rito.
- source_word: בִּנְיָמִן
  choice: ang Benjamin
  rationale: Pangalan ng lipi ang nasa Hebreo at ginagamit nang kolektibo. Pinananatili ng “ang Benjamin” ang anyo ng pinagmulan habang malinaw sa konteksto na tumutukoy ito sa mga Benjamita.
- source_word: בָּעֵת הַהִיא
  choice: nang panahong iyon
  rationale: Natural at malinaw na katumbas ng karaniwang pariralang temporal sa Hebreo.
- source_word: וַיִּתְּנוּ לָהֶם
  choice: ibinigay sa kanila
  rationale: Tuwirang sinasalamin ang pandiwang נתן at ang di-tuwirang layon; hindi pinapangalanan ang paksang ipinahiwatig lamang sa Hebreo.
- source_word: הַנָּשִׁים
  choice: mga babae
  rationale: “Mga babae” ang literal na kahulugan. Bagaman magiging mga asawa sila ayon sa konteksto, hindi ginagamit rito ang mas tiyak na salitang “mga asawa.”
- source_word: אֲשֶׁר חִיּוּ
  choice: pinanatili nilang buhay
  rationale: 'Ipinapahayag nito ang causative na diwa ng piel ng חיה: hindi nila pinatay ang mga babaeng ito at hinayaan silang manatiling buhay.'
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: mula sa mga babae ng Jabes-Gilead
  rationale: Ang מִן ay nagsasaad ng pinagmulan o pangkat na pinanggalingan; malinaw at maikli ang salin.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: Ngunit hindi sapat para sa kanila ang nakuha nila sa paraang iyon
  rationale: Elliptical ang Hebreo, na literal na malapit sa “ngunit hindi sila nakasumpong nang gayon para sa kanila.” Ipinahihiwatig ng konteksto na kulang ang mga babaeng nakuha sa paraang ito; nililinaw ng salin ang ipinahiwatig na diwa nang hindi dinaragdagan ang teolohikal na interpretasyon.
