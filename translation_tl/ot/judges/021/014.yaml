translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “Jabes-Gilead” bilang karaniwang anyong Filipino ng pangalan. Pinanatili ang kolektibong “Benjamin” sa halip na gawing tahasang “mga Benjamita,” at nilinaw lamang sa pangunahing teksto ang elliptical na huling sugnay.
