  text: And the people grieved for Benjamin, because the LORD had made a breach among the tribes of Israel.
translation:
  language: tl
  text: At ang nangyari sa Benjamin ang ikinalungkot ng bayan, sapagkat gumawa ang PANGINOON ng puwang sa hanay ng mga lipi ng Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחָם לְבִנְיָמִן
  choice: nalungkot ... dahil sa Benjamin
  rationale: Sa konteksto, ipinahahayag ng nifal na נִחָם ang pagdadalamhati o matinding panghihinayang ng bayan sa sinapit ng Benjamin; iniiwasan nitong ipakahulugan agad bilang habag lamang.
- source_word: עָשָׂה יְהוָה פֶּרֶץ
  choice: gumawa ang PANGINOON ng puwang
  rationale: Pinananatili ang kongkretong larawan ng פֶּרֶץ bilang pagkakabutas o puwang na nalikha sa kabuuan ng Israel, sa halip na palitan ito ng paliwanag lamang gaya ng 'winakasan ang isang lipi.'
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: sa mga lipi ng Israel
  rationale: Tuwirang katumbas ng maramihang 'mga lipi,' habang ipinahihiwatig ng parirala na nagkaroon ng puwang sa hanay ng mga lipi.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang anyong malalaking titik para sa banal na pangalang YHWH.
theological_decisions:
- issue: Pag-uugnay sa PANGINOON ng puwang na nalikha sa Israel
  choice: sapagkat gumawa ang PANGINOON ng puwang
  alternative: sapagkat nagkaroon ng puwang sa mga lipi ng Israel
  rationale: Pinananatili ang tahasang pagkilos na iniuugnay ng tekstong Hebreo kay YHWH, kahit may tensiyon ito sa pananagutan ng mga taong sangkot.
translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Pinanatili ang metaporang 'puwang' upang katawanin ang isang naputol o halos nawalang lipi sa kabuuan ng Israel.
