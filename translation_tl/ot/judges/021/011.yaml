review_pass:
  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing salin: pinananatili nito ang saklaw na “bawat lalaki” at “bawat babae,” ang seksuwal na kahulugan ng Hebreong idyoma, ang maramihang utos, at ang teknikal na diwa ng חרם bilang pagtatalaga sa paglipol. Gayunman, mali ang pagkakalagay ng talababa a: ang paliwanag nito ay para sa pariralang tungkol sa babaeng nakipagtalik, hindi para sa “isang lalaki.”'
  naturalness: Natural at marangal ang modernong Filipino. Ang “nakipagtalik na sa isang lalaki” ay malinaw at angkop sa konteksto; ang “italaga ninyo sa paglipol” ay maingat na salin para sa teknikal na pandiwa.
  terminology: Ang “italaga ... sa paglipol” ay angkop para sa חרם at ang talababa b ay kapaki-pakinabang na paglilinaw. Ang “nakipagtalik” ay wastong tahasang pagsasalin ng eupemismong Hebreo, habang pinananatili sa talababa ang literal na larawan.
  issues:
  - severity: medium
    issue: Maling footnote anchor para sa talababa a.
    rationale: Ang marker a ay kasalukuyang nakakabit sa “isang lalaki,” ngunit ang tala ay nagpapaliwanag sa Hebreong “nakakilala sa higaan ng isang lalaki,” na tumutukoy sa buong pariralang naglalarawan sa babae. Dapat ilagay ang marker pagkatapos ng “isang lalaki” bilang dulo ng buong seksuwal na parirala, bago ang pandiwang “ay,” upang malinaw na iyon ang saklaw nito.
  revised_text: 'At ito ang gagawin ninyo: ang bawat lalaki at ang bawat babaeng nakipagtalik na sa isang lalaki[a] ay italaga ninyo sa paglipol.[b]'
  revised_footnotes:
  - marker: a
    text: Sa literal na Hebreo, “nakakilala sa higaan ng isang lalaki,” isang idyoma para sa pakikipagtalik.
    reason: lexical_alternative
  - marker: b
    text: Ang “italaga sa paglipol” ay tumutukoy sa paglalagay sa ilalim ng pagbabawal para sa lubusang pagkawasak, hindi lamang sa karaniwang pagpatay.
    reason: cultural_note
  revision_rationale: Inilipat ang marker a upang malinaw na iugnay ang talababa sa buong pariralang “babaeng nakipagtalik na sa isang lalaki,” na siyang isinasalin nito. Walang binago sa kahulugan ng talata o sa marker b.
