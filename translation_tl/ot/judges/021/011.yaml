base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: tl
  text: 'At ito ang gagawin ninyo: ang bawat lalaki at ang bawat babaeng nakipagtalik na sa isang lalaki[a] ay italaga ninyo sa paglipol.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “nakakilala sa higaan ng isang lalaki,” isang idyoma para sa pakikipagtalik.
    reason: lexical_alternative
  - marker: b
    text: Ang “italaga sa paglipol” ay tumutukoy sa paglalagay sa ilalim ng pagbabawal para sa lubusang pagkawasak, hindi lamang sa karaniwang pagpatay.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה הַ/דָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: At ito ang gagawin ninyo
  rationale: Natural na Filipino para sa Hebreong panimulang pormula, habang pinananatili ang pang-ugnay at ang tuwirang tagubilin sa maramihang kausap.
- source_word: כָּל זָכָר
  choice: ang bawat lalaki
  rationale: Ipinahihiwatig ng זָכָר ang kasariang lalaki at hindi lamang ang katayuan ng isang nasa hustong gulang. Sa Filipino, ang “bawat lalaki” ang pinakanatural na pangkalahatang katumbas sa kontekstong ito.
- source_word: וְ/כָל אִשָּׁה
  choice: at ang bawat babae
  rationale: Ang אִשָּׁה rito ay “babae,” hindi kinakailangang “asawa,” at nililinaw pa ng kasunod na parirala tungkol sa karanasang seksuwal.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: nakipagtalik na sa isang lalaki
  rationale: Ang literal na idyomang Hebreo ay tumutukoy sa babaeng nagkaroon na ng pakikipagtalik sa lalaki. Ang tahasang salin ay malinaw at natural sa modernong Filipino; pinananatili sa talababa ang anyo ng idyoma.
- source_word: תַּחֲרִימוּ
  choice: italaga ninyo sa paglipol
  rationale: Ang Hiphil ng חרם ay teknikal na paglalagay sa ilalim ng pagbabawal na humahantong sa lubusang paglipol, hindi lamang karaniwang pagpatay. Pinananatili ng saling ito ang ideya ng pagtatalaga at pagkawasak.
theological_decisions:
- issue: Kahulugan ng חרם sa konteksto ng digmaan at paghatol
  choice: italaga ninyo sa paglipol
  alternative: lipulin ninyo nang lubusan; ilagay ninyo sa ilalim ng pagbabawal
  rationale: 'May legal at panrelihiyong bigat ang pandiwa: ang mga tao ay inilalagay sa ilalim ng חרם para sa pagkawasak. Hindi ito binawasan sa simpleng “patayin,” ngunit iniwasan din ang isang malabo o lipas na ekspresyon.'
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at tuwiran. Ginamit ang “nakipagtalik” upang ihatid nang natural ang tiyak na kahulugan ng Hebreong eupemismo, at ang mas literal na larawan ay inilagay sa talababa. Pinanatili ang maramihang “ninyo” at ang teknikal na bigat ng חרם.
