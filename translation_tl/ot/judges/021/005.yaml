revisions:
- from: 'Sinabi ng mga anak ni Israel[a], “Sino mula sa lahat ng lipi ng Israel ang hindi umahon patungo kay Yahweh sa kapulungan?” Sapagkat may ginawa silang dakilang panunumpa tungkol sa sinumang hindi umahon patungo kay Yahweh sa Mizpa: “Tiyak na papatayin siya.”'
  to: 'Sinabi ng mga anak ni Israel[a], “Sino sa lahat ng lipi ng Israel ang hindi umahon tungo kay Yahweh sa kapulungan?” Sapagkat may dakilang panunumpa laban sa sinumang hindi umahon tungo kay Yahweh sa Mizpa: “Tiyak na papatayin siya.”'
  rationale: Inayos ang di-likas na ayos ng tanong at pinalitan ang pananalitang nagpapahiwatig na tahasang “ginawa nila” ang panunumpa. Ang “may dakilang panunumpa laban sa” ay mas malapit sa Hebreong legal na pahayag, habang hindi labis na itinatakda ang eksaktong mekanismo nito. Pinanatili ang lahat ng mahahalagang termino at ang kahulugang hudisyal ng pangwakas na pahayag.
