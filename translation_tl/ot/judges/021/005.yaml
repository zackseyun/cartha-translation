  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: tl
  text: 'Sinabi ng mga anak ni Israel[a], “Sino sa lahat ng lipi ng Israel ang hindi umahon tungo kay Yahweh sa kapulungan?” Sapagkat may dakilang panunumpa laban sa sinumang hindi umahon tungo kay Yahweh sa Mizpa: “Tiyak na papatayin siya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang Hebreong idyomang literal at ang panlalaking kolektibong katawagan, habang natural pa rin sa marangal na Tagalog.
- source_word: מִי אֲשֶׁר
  choice: Sino ... ang
  rationale: Natural na Tagalog na tanong para tukuyin ang taong tumutugon sa kasunod na paglalarawan.
- source_word: לֹא עָלָה
  choice: hindi umahon
  rationale: Pinananatili ang karaniwang diwa ng עלה na ‘umahon/pumaitaas’; ang konteksto ang nagpapakitang tumutukoy ito sa pagpunta sa pagtitipon.
- source_word: בַקָּהָל
  choice: sa kapulungan
  rationale: Ang קהל ay ang nagkakatipong pamayanan; ang ‘kapulungan’ ay malinaw at hindi labis na eklesyastikal.
- source_word: אֶל יְהוָה
  choice: patungo kay Yahweh
  rationale: Tuwirang ipinapahayag ang direksiyon ng אֶל at ginagamit ang personal na pang-ukol na ‘kay’ para sa banal na pangalan.
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: dakilang panunumpa
  rationale: Tuwirang pinananatili ang pang-uri na ‘dakila/malaki’ sa halip na ipakahulugang ‘taimtim’ lamang.
- source_word: הָיְתָה לַאֲשֶׁר
  choice: may ginawa silang ... tungkol sa sinumang
  rationale: Isinasalin nang natural ang umiiral na panunumpang nauukol sa sinumang lumabag, nang hindi labis na tinutukoy ang legal na mekanismo.
- source_word: הַמִּצְפָּה
  choice: sa Mizpa
  rationale: Ginagamit ang karaniwang anyong Tagalog ng pangalan ng lugar at ipinahihiwatig ng ‘sa’ ang lokasyon/patunguhan ayon sa konteksto.
- source_word: לֵאמֹר
  choice: ipinakilala sa pamamagitan ng tutuldok
  rationale: Sa Tagalog, natural na maipakilala ang mismong nilalaman ng panunumpa sa pamamagitan ng tutuldok sa halip na paulit-ulit na ‘na sinasabi.’
- source_word: מוֹת יוּמָת
  choice: Tiyak na papatayin siya
  rationale: Ipinahahayag ang mariing infinitive absolute at ang pasibong, hudisyal na kahulugan ng pandiwa.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang banal na pangalan ang nasa Hebreo; pinananatili ng ‘Yahweh’ ang pangalang YHWH sa halip na palitan ito ng isang titulo.
- issue: Panlalaking kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ang pormal na anyo ng pinagmulan at ang kolektibong panlalaking ekspresyon, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na ‘mga anak ni Israel,’ habang inilagay sa talababa ang mas madulas na ‘mga Israelita.’ Ginamit ang ‘Yahweh’ bilang tuwirang representasyon ng YHWH; walang talababa rito dahil hindi kailangan ng alternatibong pagbasa sa mismong teksto.
