  text: Then the sons of Israel went up against the sons of Benjamin on the third day[a], and they drew up against Gibeah as before.
translation:
  language: tl
  text: Noong ikatlong araw, sumulong ang mga Israelita laban sa mga Benjaminita[a], at nag-ayos sila ng hanay laban sa Gibea, gaya ng dati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga anak ni Israel” at “mga anak ni Benjamin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: muling sumalakay
  rationale: Ang עלה ay literal na ‘umakyat/pumunta paitaas,’ ngunit sa salaysay ng labanan ay tumutukoy sa pagsulong laban sa kaaway. Ang ‘sumalakay’ ay likas sa Filipino at nililinaw ng konteksto ang kilos-militar; ipinahihiwatig ng ‘muling’ ang pag-uulit na hayag sa hulíng idyoma ng talata.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Bagaman literal na ‘mga anak ni Israel,’ ang ‘mga Israelita’ ang natural at malinaw na katawagan sa modernong Filipino para sa pangkat-etniko.
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: sa mga Benjaminita
  rationale: Ang אֶל ay karaniwang ‘sa/patungo sa,’ ngunit dahil sa konteksto ng pakikipagdigma at sa pandiwang ‘sumalakay,’ malinaw na laban sa mga Benjaminita ang pagkilos.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Nang ikatlong araw
  rationale: Natural na temporal na pahayag sa Filipino na tumpak na kumakatawan sa ‘sa ikatlong araw.’
- source_word: וַיַּעַרְכוּ
  choice: pumuwesto sila para makipaglaban
  rationale: Sa kontekstong militar, ang ערך ay pag-aayos o paghanay ng hukbo para sa labanan. Mas malinaw at natural ito kaysa sa literal na ‘inihanay nila ang kanilang sarili.’
- source_word: אֶל הַגִּבְעָה
  choice: sa Gibea
  rationale: Kasama ng ‘pumuwesto ... para makipaglaban,’ ang pariralang ito ay nagsasaad ng lugar o tudlaan ng kanilang paghanay. Hindi dinaragdagan ng salin ang di-tiyak na ugnayang espacial ng אֶל.
- source_word: כְּפַעַם בְּפָעַם
  choice: gaya ng mga naunang pagkakataon
  rationale: Ang idyoma ay nangangahulugang ‘gaya ng dati’ o ‘tulad ng mga nakaraang pagkakataon.’ Pinananatili ng maramihang anyo ang pahiwatig na ito ay naulit na.
