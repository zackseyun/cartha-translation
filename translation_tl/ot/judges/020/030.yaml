  naturalness: Natural at malinaw sa modernong Filipino ang "sumulong," "nag-ayos ng hanay," at "gaya ng dati." Ang "nag-ayos ng hanay" ay sapat na nagpapahiwatig ng paglalagay sa ayos para sa labanan nang hindi nagdadagdag ng isang aktuwal na pagsalakay.
  terminology: Ang "mga Israelita" at "mga Benjaminita" ay angkop at karaniwang modernong katawagan. Pinananatili ng talababa ang magkatugmang literal na mga pariralang Hebreo. Ang "Gibea" ay pare-pareho at wastong anyo ng pangalan sa Filipino.
