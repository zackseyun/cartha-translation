base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: tl
  text: Lumabas ang mga lalaki ng Israel upang makipaglaban sa Benjamin[a], at ang mga lalaki ng Israel ay pumuwesto para sa labanan laban sa kanila sa Gibea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pumuwesto para sa labanan kasama nila sa Gibea.” Ang pananalita sa Hebreo sa ikalawang sugnay ay maaaring unawain nang mas literal na “kasama nila,” bagaman ipinahihiwatig ng konteksto na magkakalaban ang mga hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Lumabas
  rationale: Sa kontekstong militar, ang יצא ay tumutukoy sa paglabas upang sumabak; pinananatili ng “lumabas” ang kilos nang hindi nagdaragdag ng di-tiyak na detalye.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ang mga lalaki ng Israel
  rationale: Bagaman anyong isahan ang אִישׁ, kolektibo ang gamit nito rito para sa mga lalaking mandirigma ng Israel.
- source_word: לַמִּלְחָמָה
  choice: upang makipaglaban
  rationale: Ipinahahayag ng parirala ang layunin ng paglabas; natural at malinaw ito sa makabagong Filipino.
- source_word: עִם בִּנְיָמִן
  choice: sa Benjamin
  rationale: Sa konteksto ng digmaan, ang עִם ay nagpapahiwatig ng pakikipaglaban sa kalabang Benjamin; naihahatid ito ng pandiwang “makipaglaban” kasama ng “sa.”
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: pumuwesto sila sa hanay ng labanan
  rationale: Ang ערך sa gamit militar ay pag-aayos o pagpuwesto ng hukbo sa pormasyon para sa labanan.
- source_word: אִתָּם
  choice: laban sa kanila
  rationale: Bagaman karaniwang nangangahulugang “kasama nila” ang anyo, malinaw sa kontekstong militar na ang Benjamin ang katunggali; iniiwasan ng “laban sa kanila” ang maling pahiwatig na magkakampi sila.
- source_word: אֶל הַגִּבְעָה
  choice: sa Gibea
  rationale: Sa konteksto, itinatakda ng אֶל ang kinaroroonan o kaugnayan ng pagkakahilera sa lunsod; natural sa Filipino ang “sa Gibea.”
theological_decisions:
- issue: Kolektibong panlalaking katawagan sa אִישׁ יִשְׂרָאֵל
  choice: ang mga lalaki ng Israel
  alternative: ang hukbo ng Israel / ang Israel
  rationale: Pinananatili ang tiyak na panlalaking sanggunian sa mga mandirigma sa halip na gawing neutral o abstrakto.
- issue: Adbersatibong diwa ng אִתָּם sa konteksto ng digmaan
  choice: laban sa kanila
  alternative: kasama nila
  rationale: Ang literal na “kasama nila” ay maaaring magpahiwatig ng alyansa sa Filipino, samantalang ang salaysay ay malinaw na naglalarawan ng magkalabang hukbo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumuwesto sa hanay ng labanan” upang maipahayag ang pormasyong militar nang hindi nagiging lipas o labis na teknikal.
