  text: וַֽ/יִּשְׁלְח֞וּ שִׁבְטֵ֤י יִשְׂרָאֵל֙ אֲנָשִׁ֔ים בְּ/כָל שִׁבְטֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר מָ֚ה הָ/רָעָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר נִהְיְתָ֖ה בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: tl
  text: Kaya nagsugo ang mga lipi ng Israel ng mga lalaki sa lahat ng angkan ng Benjamin[a] upang sabihin, “Ano itong kasamaang nangyari sa gitna ninyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa lahat ng mga lipi ng Benjamin.” Maaaring unawain nang distributibo ang pang-ukol sa Hebreo; bagaman iisang lipi ang Benjamin, ang maramihang anyo rito ay maaaring tumukoy sa mga pangkat o angkan sa loob nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: nagsugo
  rationale: Tuwirang ipinahahayag ng pandiwang שלח ang pagpapadala ng mga tao; natural at marangal sa Filipino ang “nagsugo” sa konteksto ng mga kinatawan.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ang mga lipi ng Israel
  rationale: Pinananatili ang maramihang paksa at ang karaniwang biblikal na kahulugan ng שֵׁבֶט bilang lipi.
- source_word: אֲנָשִׁים
  choice: mga lalaki
  rationale: Literal na “mga lalaki” ang nasa Hebreo; hindi tahasang tinatawag ng teksto na mga sugo o kinatawan ang mga ito.
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: sa lahat ng angkan ng Benjamin
  rationale: Bagaman שִׁבְטֵי ay karaniwang “mga lipi,” iisang lipi ang Benjamin; dito ay likas na tumutukoy ang maramihan sa mga panloob na pangkat o angkan nito. Pinananatili ng “sa” ang posibilidad na distributibo o patungo sa kanila.
- source_word: לֵאמֹר
  choice: upang sabihin
  rationale: Natural na Filipino para sa infinitibong nagpapakilala ng tuwirang sinabi.
- source_word: מָה הָרָעָה הַזֹּאת
  choice: Ano itong kasamaan
  rationale: Ang מָה ay humihingi ng pagkilala sa ginawa, at ang רָעָה ay may malinaw na bigat na moral; ang “kasamaan” ay natural at hindi pinahihina iyon.
- source_word: אֲשֶׁר נִהְיְתָה
  choice: nangyari
  rationale: Ang Niphal ng היה ay nagsasaad ng pangyayaring naganap; sapat at idiomatiko ang “nangyari.”
- source_word: בָּכֶם
  choice: sa gitna ninyo
  rationale: Ipinahahayag nito na naganap ang kasamaan sa loob ng pamayanan ng Benjamin, habang malapit sa larawan ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na ayos ng pangungusap. Ginamit ang “angkan” sa pangunahing teksto upang maiwasan ang nakalilitong “mga lipi ng Benjamin,” ngunit inilagay sa talababa ang mas pormal na anyo at ang tunay na gramatikal na kalabuan.
