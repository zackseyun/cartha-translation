  source_fidelity: 'Tapat ang salin sa Hebreo: ang mga lipi ng Israel ay nagsugo ng mga lalaki sa mga panloob na pangkat ng Benjamin at nagtanong tungkol sa kasamaang naganap sa loob ng kanilang pamayanan. Ang “sa lahat ng angkan ng Benjamin” ay isang makatuwirang kontekstuwal na pagsasalin ng maramihang שִׁבְטֵי, at maayos na pinananatili ng talababa ang alternatibo at ang distributibong posibilidad ng בְּ.'
