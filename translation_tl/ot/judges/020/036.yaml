base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: tl
  text: Kaya nakita ng mga anak ni Benjamin na natalo sila. Nagbigay ng puwang ang mga tauhan ng Israel sa Benjamin[a], sapagkat umasa sila sa pagtambang[b] na inihanda nila laban sa Gibea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagparaya ng puwang sa Benjamin” o “umatras sa harap ng Benjamin.” Ang idyomang Hebreo ay tumutukoy sa sinadyang pagbigay ng puwang bilang taktika sa labanan.
    reason: lexical_alternative
  - marker: b
    text: O “sa pangkat na ipinuwesto nilang nakaabang sa Gibea.” Ang salitang Hebreo ay maaaring tumukoy sa mismong pagtambang o sa mga mandirigmang nakaabang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: nakita
  rationale: Pinananatili ang payak at kongkretong diwa ng ראה, habang likas na ipinahihiwatig sa konteksto na napagtanto rin nila ang nangyari.
- source_word: בְנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang pananalitang pangkamag-anakan ng Hebreo at malinaw pa rin ito sa karaniwang mambabasang Filipino.
- source_word: כִּי נִגָּפוּ
  choice: na natalo sila
  rationale: Sa konteksto ng labanan, ang Niphal ng נגף ay likas na tumutukoy sa pagkatalo, hindi lamang sa pisikal na paghampas.
- source_word: וַיִּתְּנוּ ... מָקוֹם
  choice: sadyang nagbigay-daan
  rationale: 'Ipinahahayag nito ang idyomang taktikal: kusang nagparaya o umatras ang Israel upang mailabas ang Benjamin. Ang “sadyang” ay nililinaw na bahagi ito ng plano, hindi tunay na pagkatalo.'
- source_word: אִישׁ יִשְׂרָאֵל
  choice: mga tauhan ng Israel
  rationale: Ang anyong pang-isahan ay kolektibo rito; ang “mga tauhan” ay natural sa salaysay ng labanan at hindi limitado sa kahulugang sibilyang kalalakihan.
- source_word: כִּי בָטְחוּ
  choice: sapagkat umasa sila
  rationale: Ang בטח ay nagsasaad ng pagtitiwala o pag-asa sa bisa ng inihandang pagtambang.
- source_word: אֶל הָאֹרֵב
  choice: sa pagtambang
  rationale: Maaaring tumukoy ang אֹרֵב sa mismong taktika ng pagtambang o sa pangkat na nakaabang; pinili sa teksto ang natural na abstraktong diwa at iniingatan sa talababa ang alternatibo.
- source_word: אֲשֶׁר שָׂמוּ
  choice: na inihanda nila
  rationale: Sa Filipino, natural na “inihanda” ang isang pagtambang, bagaman literal na “inilagay” o “ipinuwesto” ang שׂים.
- source_word: אֶל הַגִּבְעָה
  choice: laban sa Gibea
  rationale: Ipinakikita nito ang taktikal na tuon ng pagtambang laban sa lunsod; maaari ring unawain ang pang-ukol bilang lokasyong “sa Gibea.”
