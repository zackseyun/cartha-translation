translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “mga anak ni Benjamin” bilang malinaw na bakas ng pormang Hebreo, ngunit gumamit ng likas na bokabularyong militar gaya ng “nagbigay-daan” at “pagtambang.”
