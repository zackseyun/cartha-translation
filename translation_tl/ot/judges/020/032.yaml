  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay ng digmaan. Ginamit ang “mga Benjaminita” at “mga Israelita” bilang likas na katawagan sa mga pangkat, at iniwasan ang sobrang teknikal o makalumang pananalita.
