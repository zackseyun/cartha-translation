  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י בִנְיָמִ֔ן נִגָּפִ֥ים הֵ֛ם לְ/פָנֵ֖י/נוּ כְּ/בָ/רִאשֹׁנָ֑ה וּ/בְנֵ֧י יִשְׂרָאֵ֣ל אָמְר֗וּ נָנ֨וּסָה֙ וּֽ/נְתַקְּנֻ֔/הוּ מִן הָ/עִ֖יר אֶל הַֽ/מְסִלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: tl
  text: Sinabi ng mga Benjaminita, “Nalulupig sila sa harap natin, gaya noong una.”[a] Ngunit sinabi ng mga Israelita, “Tumakas tayo at ilayo natin sila[b] mula sa lungsod patungo sa mga pangunahing daan.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “gaya noong una” ay tumutukoy sa mga naunang labanan sa kabanatang ito; maaari ring isalin na “gaya ng dati.”
    reason: cross_reference
  - marker: b
    text: 'Sa Hebreo, isahan ang layon: “ilayo natin siya.” Malamang na kolektibong tumutukoy ito sa Benjamin o sa hukbo nito; kaya “sila” ang ginamit sa teksto.'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “mga daan” o “mga lansangan.” Ang salitang Hebreo ay maaaring tumukoy sa mga maayos o pangunahing daan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: nalulupig
  rationale: Ang pasibong anyo ay tumutukoy sa pagkatalo o pagbagsak sa labanan. Pinananatili ng “nalulupig” ang diwang militar at ang pasibong paglalarawan nang hindi ipinapalagay na napatay silang lahat.
- source_word: לְפָנֵינוּ
  choice: sa harap natin
  rationale: Tuwirang katumbas ng idyomang Hebreo sa konteksto ng labanan; maaari itong magpahiwatig na natatalo sila sa mismong harapan o kamay ng mga Benjaminita.
- source_word: כְּבָרִאשֹׁנָה
  choice: gaya noong una
  rationale: Pinananatili ang pagtukoy sa naunang sagupaan nang hindi idinaragdag sa pangunahing teksto ang salitang “labanan,” na ipinahihiwatig lamang ng konteksto.
- source_word: נָנוּסָה
  choice: Tumakas tayo
  rationale: Sinasalamin ang cohortative o kusang panukalang “tayo ay tumakas.” Bagaman bahagi ito ng taktikang pag-urong, hindi tahasang sinasabi ng pandiwa ang teknikal na “umurong.”
- source_word: וּנְתַקְּנֻהוּ
  choice: at ilayo natin sila
  rationale: Ang ugat ay nangangahulugang hilahin o ilayo. Ginamit ang maramihang “sila” sa natural na Tagalog sapagkat ang tinutukoy ay ang mga Benjaminita o ang kanilang hukbo, habang ipinaliliwanag sa talababa ang isahang hulapi sa Hebreo.
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Karaniwang salin ng עִיר at tumutukoy rito sa sentrong urban ng Gibea.
- source_word: הַמְסִלּוֹת
  choice: mga pangunahing daan
  rationale: Ang מְסִלָּה ay maaaring tumukoy sa isang maayos, mataas, o pangunahing lansangan. Mas natural sa modernong Tagalog ang “mga pangunahing daan” kaysa “mga haywey” sa sinaunang tagpo.
