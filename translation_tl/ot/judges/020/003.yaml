translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pormal na pag-uulit ng “mga anak ni Benjamin/Israel,” habang ginawang likas ang pandiwang “nabalitaan.” Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
