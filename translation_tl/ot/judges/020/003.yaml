  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: tl
  text: 'Nabalitaan ng mga anak ni Benjamin na umakyat sa Mizpa ang mga anak ni Israel.[a] Sinabi ng mga anak ni Israel, “Sabihin ninyo sa amin: paano nangyari ang kasamaang ito?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “mga anak ni Benjamin” at “mga anak ni Israel” bilang “mga Benjaminita” at “mga Israelita.” Paulit-ulit na ginagamit sa Hebreo ang literal na mga pariralang “mga anak ni Benjamin” at “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kasamaang ito” ay maaari ring isalin bilang “kabuktutang ito” o “masamang gawang ito.” Malakas ang moral na diwa ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Nabalitaan
  rationale: Sa kontekstong pasalaysay, ang שׁמע ay tumutukoy sa pagkatanggap ng balita. Mas likas sa modernong Filipino ang “nabalitaan” kaysa literal na “narinig” dito.
- source_word: בְּנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang Hebreong anyo at ang pagkakatimbang nito sa “mga anak ni Israel,” habang nananatiling malinaw sa Filipino.
- source_word: כִּי עָלוּ
  choice: na umahon
  rationale: Tuwirang inilalarawan ng עלה ang pag-akyat o pagpunta paitaas. Hindi ito pinalawak bilang “nagtipon,” bagaman iyon ang layunin sa konteksto.
- source_word: הַמִּצְפָּה
  choice: sa Mizpa
  rationale: Pangalan ito ng lugar; “Mizpa” ang likas na transliterasyon sa Filipino, at hindi na inililipat ang pantukoy na Hebreo.
- source_word: וַיֹּאמְרוּ
  choice: Sinabi
  rationale: Pinananatili ang payak na kahulugan ng אמר sa halip na gawing “nagtanong,” na magpapakahulugan nang higit kaysa sa anyong Hebreo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal na pananalita at ang pormal na pag-uulit na katapat ng “mga anak ni Benjamin.”
- source_word: דַּבְּרוּ
  choice: Sabihin ninyo sa amin
  rationale: Bagaman literal na “magsalita,” hinihingi rito ang isang salaysay; likas at tumpak sa Filipino ang “Sabihin ninyo sa amin.”
- source_word: אֵיכָה
  choice: paano
  rationale: Tuwirang katumbas ng tanong tungkol sa paraan kung paano naganap ang pangyayari.
- source_word: נִהְיְתָה
  choice: nangyari
  rationale: Sa konstruksiyong ito, ang היה ay pangyayaring “naganap” o “nangyari,” at ito ang pinakanatural sa Filipino.
- source_word: הָרָעָה הַזֹּאת
  choice: ang kasamaang ito
  rationale: Ang רָעָה rito ay may matinding moral na puwersa dahil sa krimen sa Gibea. Iniiwasan ng “kasamaan” na paliitin ito bilang sakuna lamang.
