base_translation:
  language: en
  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: tl
  text: Ang napagkasunduang hudyat[a] ng mga Israelita at ng mga kawal na nakatambang[b] ay magpaakyat sila mula sa lungsod ng isang malaking ulap ng usok[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang itinakdang kaayusan” o “ang napagkasunduang palatandaan.” Ang salitang Hebreo ay madalas mangahulugang takdang panahon, ngunit dito ay tumutukoy sa patiunang isinaayos na hudyat sa labanan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “para sa mga lalaki ng Israel kasama ng mga nakatambang.” Ang diwa ay isang kasunduan sa pagitan ng mga Israelita at ng pangkat na nakatambang.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “malaking masa” o “haligi ng usok.” Tumutukoy ang pariralang Hebreo sa kapansin-pansing usok na pumapaitaas mula sa lungsod bilang hudyat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: Ang napagkasunduang hudyat
  rationale: Bagaman ang מוֹעֵד ay karaniwang tumutukoy sa takdang panahon o pagtitipon, sa kontekstong militar dito ay isa itong hudyat na patiunang napagkasunduan. Hindi ginawang hiwalay na “at” ang וְ sapagkat natural na naiuugnay ang pangungusap sa konteksto nang walang tahasang pang-ugnay sa Filipino.
- source_word: לְאִישׁ יִשְׂרָאֵל עִם הָאֹרֵב
  choice: ng mga Israelita at ng mga kawal na nakatambang
  rationale: Ang לְ ... עִם ay tumutukoy sa dalawang panig na kabilang sa kasunduan. Ginawang “mga kawal na nakatambang” ang kolektibong participle na אֹרֵב upang malinaw na mga taong nakahimpil sa pananambang ang tinutukoy, hindi ang kilos lamang.
- source_word: הֶרֶב לְהַעֲלוֹתָם
  choice: ay magpaakyat sila ng makapal
  rationale: Ang Hiphil ng עלה ay nangangahulugang magpaakyat o magpataas, at ang masidhing anyo mula sa רבה ay ipinahayag sa kapal at kapansin-pansing dami ng usok.
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: bugso ng usok
  rationale: Ang מַשְׂאַת ay bagay o masa na itinataas; sa konteksto, ito ang kapansin-pansing pag-akyat ng usok bilang hudyat. Ang “bugso ng usok” ay likas sa modernong Filipino at hindi labis na nagtatakda kung ulap o haligi ang hugis nito.
- source_word: מִן הָעִיר
  choice: mula sa lungsod
  rationale: Tuwirang ipinahahayag ang pinagmulan ng usok.
