translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “hudyat” para sa malinaw na tungkuling militar ng napagkasunduan, at “mga kawal na nakatambang” upang maiwasan ang malabong abstraktong “pananambang.” Pinanatili sa “bugso ng usok” ang hindi tiyak na hugis ng pumapaitaas na masa ng usok.
