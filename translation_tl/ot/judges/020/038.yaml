- from: Ang napagkasunduang hudyat[a] ng mga Israelita at ng mga kawal na nakatambang[b] ay magpaakyat sila ng makapal na bugso ng usok mula sa lungsod[c].
  to: Ang napagkasunduang hudyat[a] ng mga Israelita at ng mga kawal na nakatambang[b] ay magpaakyat sila mula sa lungsod ng isang malaking ulap ng usok[c].
  rationale: Pinalitan ang “makapal na bugso ng usok” ng “isang malaking ulap ng usok” upang maipahayag nang mas natural ang kapansin-pansing tumataas na masa ng usok at ang pagpapasidhi ng pandiwang Hebreo, nang hindi itinatakda ang eksaktong hugis nito. Inayos din ang pagkakasunod upang maging mas malinaw ang “mula sa lungsod.”
