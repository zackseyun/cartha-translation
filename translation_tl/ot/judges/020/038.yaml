  naturalness: Natural ang karamihan ng pangungusap, ngunit ang “magpaakyat sila ng makapal na bugso ng usok” ay medyo mabigat at hindi pangkaraniwan sa modernong Filipino. Mas malinaw at likas ang “magpaakyat sila mula sa lungsod ng isang malaking ulap ng usok.”
  terminology: Ang “napagkasunduang hudyat” at “mga kawal na nakatambang” ay angkop sa kontekstong militar. Pinananatili ng “malaking ulap ng usok” ang hindi pagtukoy nang labis kung haligi, ulap, o iba pang tiyak na hugis ang usok.
