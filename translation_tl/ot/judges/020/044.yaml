  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
translation:
  language: tl
  text: At napatay ang labingwalong libong lalaki mula sa lipi ni Benjamin; lahat sila ay magigiting na mandirigma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: ang napatay
  rationale: Literal itong “nahulog/buwal,” ngunit sa konteksto ng labanan ay tumutukoy sa pagkamatay. Ang “napatay” ay likas at malinaw sa modernong Tagalog nang hindi inilalabo ang kinalabasan.
- source_word: מִבִּנְיָמִן
  choice: mula sa Benjamin
  rationale: 'Ipinahahayag ng מִן ang pinagmulan o pagiging kabilang: ang mga napatay ay mula sa lipi ni Benjamin.'
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: labingwalong libong lalaki
  rationale: Tahasang kasama sa Hebreo ang אִישׁ (“lalaki”), kaya pinanatili ito sa salin sa halip na idagdag ang mas interpretatibong “sundalo.”
- source_word: אֶת כָּל אֵלֶּה
  choice: lahat sila
  rationale: Binubuod nito ang buong pangkat na kababanggit lamang. Mas natural sa Tagalog ang “lahat sila” kaysa sa literal na “lahat ng mga ito” kapag mga tao ang tinutukoy.
- source_word: אַנְשֵׁי חָיִל
  choice: magigiting na mandirigma
  rationale: Sa kontekstong militar, inilalarawan ng parirala ang mga lalaking may tapang at husay sa pakikipaglaban. Malinaw at marangal sa kasalukuyang Tagalog ang “magigiting na mandirigma.”
