  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: tl
  text: Mula sa lahat ng lipi ng Israel, kukuha tayo ng sampung lalaki sa bawat sandaan, isang daan sa bawat sanlibo, at isang libo sa bawat sampung libo, upang kumuha ng mga panustos para sa bayan, upang, pagdating nila sa Gibea ng Benjamin, gawin nila ang nararapat ayon sa buong karumal-dumal na gawa na ginawa nito sa Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “upang kumuha ng mga panustos para sa bayan, upang sa pagdating nila sa Gibea ng Benjamin ay gawin nila ayon sa buong karumal-dumal na gawa na ginawa nito sa Israel.” Siksik ang pananalita sa Hebreo at hindi tahasang sinasabi kung ano ang gagawin nila sa Gibea.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: Kukuha tayo
  rationale: Ang Qal perfect na 1cp na may pang-ugnay ay prospektibo sa konteksto ng pinagpaplanuhang sama-samang pagkilos; likas sa modernong Tagalog ang anyong panghinaharap.
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: sampung lalaki sa bawat sandaan ... isang daan sa bawat sanlibo, at isang libo sa bawat sampung libo
  rationale: Malinaw na ipinahahayag ng 'sa bawat' ang proporsiyonal na pagpili at pinananatili ang sunod-sunod na bilang sa Hebreo.
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: mula sa lahat ng lipi ng Israel
  rationale: Sa konteksto ng proporsiyonal na pagpili, ang mga lalaki ay kinukuha mula sa kabuuan ng mga lipi.
- source_word: לָקַחַת צֵדָה
  choice: Kukuha sila ng mga panustos
  rationale: Ang צֵדָה ay mga pagkaing baon o iba pang panustos para sa paglalakbay o kampanya; hindi ito nilimitahan sa pagkain lamang.
- source_word: לָעָם
  choice: para sa bayan
  rationale: Pinananatili ng 'bayan' ang karaniwang kahulugan ng עָם, bagaman sa kontekstong ito ang tinutukoy ay ang nagkatipong hukbo.
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: upang pagdating ng bayan ... gawin nila ang nararapat
  rationale: Siksik at eliptikal ang magkakasunod na infinitive sa Hebreo. Nililinaw ng salin ang layunin at pagdating nang hindi tinutukoy nang labis ang eksaktong uri ng aksiyon.
- source_word: לְגֶבַע בִּנְיָמִן
  choice: sa Gibea ng Benjamin
  rationale: Inilalarawan nito ang patutunguhan; ang konteksto ang nagpapahiwatig na may gagawing aksiyong panghukuman o pandigma roon.
- source_word: כְּכָל הַנְּבָלָה
  choice: dahil sa lahat ng karumal-dumal
  rationale: Sa kontekstong ito, ang נְבָלָה ay isang nakagigimbal at kahiya-hiyang kasamaan. Ang 'karumal-dumal' ay natural at mabigat sa modernong Filipino nang hindi nagdaragdag ng teknikal na kategoryang teolohikal.
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: na ginawa nito sa Israel
  rationale: Pinananatili ang aktibong pandiwang panlalaking isahan at ang posibleng pagtukoy sa Gibea bilang kolektibong gumagawa, nang hindi ito tahasang ipinapalit sa 'mga lalaki ng Gibea.'
theological_decisions:
- issue: Moral na bigat ng נְבָלָה nang walang idinadagdag na doktrinal na katawagan
  choice: karumal-dumal
  alternative: kahiya-hiyang gawa; napakasamang gawa; kahangalan
  rationale: Ipinahihiwatig ng salita rito ang isang nakagigimbal at lubhang kahiya-hiyang kasamaan. Napananatili ng 'karumal-dumal' ang tindi ng paghatol sa gawa nang hindi nag-aangkat ng denominasyonal na paliwanag.
- issue: Hindi tiyak na simuno ng panlalaking isahang עָשָׂה
  choice: ginawa nito
  alternative: ginawa nila; ginawa roon
  rationale: Maaaring personipikasyon ng Gibea o kolektibong pananagutan ang panlalaking isahan. Pinananatili ng 'nito' ang anyong isahan at ang tensiyon sa teksto, sa halip na tahasang tukuyin ang isang tao o grupo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sanlibo” sa pormal na bilang at “mga panustos” bilang malawak na tawag sa kailangan ng nagkatipong bayan. Iniwasan ang masyadong espesipikong “parusahan” o “gumanti” sapagkat hindi iyon tahasang nakasaad sa siksik na pariralang Hebreo.
