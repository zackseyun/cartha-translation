revisions:
- from: Kukuha tayo ng sampung lalaki sa bawat sandaan mula sa lahat ng lipi ng Israel, isang daan sa bawat sanlibo, at isang libo sa bawat sampung libo. Kukuha sila ng mga panustos para sa bayan, upang pagdating ng bayan sa Gibea ng Benjamin, gawin nila ang nararapat dahil sa lahat ng karumal-dumal na ginawa nito sa Israel.[a]
  to: Mula sa lahat ng lipi ng Israel, kukuha tayo ng sampung lalaki sa bawat sandaan, isang daan sa bawat sanlibo, at isang libo sa bawat sampung libo, upang kumuha ng mga panustos para sa bayan, upang, pagdating nila sa Gibea ng Benjamin, gawin nila ang nararapat ayon sa buong karumal-dumal na gawa na ginawa nito sa Israel.[a]
  rationale: Inayos ang mga sanggunian ng simuno at ang ugnayan ng mga sugnay. Pinalitan ang “dahil sa” ng “ayon sa” upang maipakita ang כְּכָל, habang ang “gawin ang nararapat” ay minimal na idiomatikong pagpapalinaw sa eliptikal na infinitive chain at hindi nagtatakda ng uri ng kaparusahan o aksiyon.
