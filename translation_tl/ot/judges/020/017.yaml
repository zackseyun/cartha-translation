base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: tl
  text: 'Ang mga lalaki ng Israel, bukod sa Benjamin,[a] ay tinipon: apatnaraang libong lalaking humuhugot ng tabak.[c] Lahat sila ay mga mandirigma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi kabilang ang Benjamin.”
    reason: lexical_alternative
  - marker: c
    text: Literal na “humuhugot ng tabak,” isang idyomang Hebreo para sa mga armadong lalaking nakikipaglaban.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Ang mga lalaki ng Israel
  rationale: Bagaman isahan ang אִישׁ sa anyo, kolektibo ang gamit nito at may kasamang pandiwang maramihan. Pinananatili ng salin ang tiyak na pagtukoy sa mga lalaking kabilang sa hukbo.
- source_word: הִתְפָּקְדוּ
  choice: ay tinipon at binilang
  rationale: Sa kontekstong militar, ang hitpael ng פקד ay maaaring tumukoy sa pagtitipon o pagtatala at pagbibilang para sa paglilingkod. Ang tambalang parirala ay likas sa Filipino at pinananatili ang saklaw ng kahulugan.
- source_word: לְבַד מִבִּנְיָמִן
  choice: bukod sa Benjamin
  rationale: Malinaw nitong ipinahihiwatig na hindi kasama ang Benjamin sa kabuuang bilang, habang pinananatili ang maikling anyo ng Hebreo.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: apatnaraang libong lalaki
  rationale: Pinananatili ang tahasang אִישׁ pagkatapos ng bilang at ang konteksto ng sensus militar.
- source_word: שֹׁלֵף חָרֶב
  choice: humuhugot ng tabak
  rationale: Ito ang malapit at matingkad na katumbas ng literal na idyomang Hebreo, na tumutukoy sa mga armadong lalaking handang makipaglaban.
- source_word: כָּל זֶה
  choice: Lahat ng ito
  rationale: Ang parirala ay tumutukoy sa buong pangkat na kababanggit lamang. Likas sa Filipino ang paggamit ng 'ito' bilang kolektibong pantukoy.
- source_word: אִישׁ מִלְחָמָה
  choice: mga lalaking pandigma
  rationale: Pinananatili nito ang panlalaking kolektibong diwa at ang pormal na rehistrong militar ng pariralang Hebreo nang hindi ito ginagawang mas malawak kaysa sa teksto.
