lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Isang natural ngunit dignified na pantawag-pansin na angkop sa harap ng kapulungan.
- source_word: כֻּלְכֶם בְּנֵי יִשְׂרָאֵל
  choice: kayong lahat, mga anak ni Israel
  rationale: Pinananatili ang kabuuan ng kausap at ang tradisyonal na katawagang pangtipan na “mga anak ni Israel.”
- source_word: הָבוּ לָכֶם דָּבָר וְעֵצָה
  choice: Magbigay kayo ... ng inyong pasiya at payo
  rationale: Sa konteksto ng kapulungang hinihingan ng tugon, ang דָּבָר ay tumutukoy sa ihahayag na pasiya o pananaw, samantalang ang עֵצָה ay payo. Ang “inyong” ay natural na kumakatawan sa reflexive na לָכֶם.
- source_word: הֲלֹם
  choice: rito
  rationale: Tuwirang ipinahihiwatig ang agarang lugar at pagkakataon ng kapulungan.
