base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: tl
  text: Pagkatapos, bumuwelta sa labanan ang mga tauhan ng Israel, at nagsimulang pumatay ang mga Benjaminita ng humigit-kumulang tatlumpung tauhan ng Israel.[a] Sinabi kasi nila, “Tiyak na talong-talo na siya[b] sa harap natin, gaya noong unang labanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “nagsimulang manakit sa mga tauhan ng Israel, na ikinamatay ng humigit-kumulang tatlumpu.” Maikli at idyomatiko sa Hebreo ang pariralang tumutukoy sa mga napatay sa labanan.'
    reason: lexical_alternative
  - marker: b
    text: Pang-isahan ang “siya” sa Hebreo at malamang na tumutukoy sa Israel bilang isang kabuuan. Maaari ring isalin na “talong-talo na sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: bumuwelta
  rationale: Sa konteksto ng kunwaring pag-urong at kasunod na pagharap sa kaaway, malinaw at natural na ipinahihiwatig ng “bumuwelta” ang pagbaling ng mga Israelita upang muling lumaban.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ang mga tauhan ng Israel
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo ang gamit nito para sa mga lalaking nakikipaglaban para sa Israel.
- source_word: וּבִנְיָמִן
  choice: ang mga Benjaminita
  rationale: Ginagamit sa Hebreo ang pangalan ng lipi bilang pantukoy sa mga kabilang dito; nililinaw ng salin ang kolektibong kahulugan nang hindi nagdaragdag ng tiyak na tungkulin.
- source_word: לְהַכּוֹת חֲלָלִים
  choice: makapatay
  rationale: Ang literal na pariralang tumutukoy sa pagpabagsak ng mga napatay ay isang maikli at idyomatikong paglalarawan ng mga nasawi sa labanan. “Makapatay” ang natural na katumbas sa kontekstong ito.
- source_word: כִּשְׁלֹשִׁים אִישׁ
  choice: humigit-kumulang tatlumpung tauhan
  rationale: Ipinahihiwatig ng כ ang pagtatantiya; malinaw itong naihahayag ng “humigit-kumulang.”
- source_word: נִגּוֹף נִגָּף הוּא
  choice: Tiyak na talung-talô na siya
  rationale: Ang infinitive absolute na kasunod ng pandiwang may iisang ugat ay nagpapalakas sa pahayag. Pinananatili ng “siya” ang pang-isahang anyo na malamang ay tumutukoy sa Israel bilang isang kabuuan.
theological_decisions:
- issue: Pang-isahang panghalip para sa kolektibong Israel
  choice: Pinanatili ang “siya.”
  alternative: “Talung-talô na sila” o “talung-talô na ang Israel.”
  rationale: Pang-isahan ang panghalip sa Hebreo, malamang dahil itinuturing na isang kabuuan ang Israel. Hindi ito ginawang tahasang maramihan upang mapanatili ang anyo at bahagyang kalabuan ng pinagmulan.
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Natural sa salaysay ng labanan ang “bumuwelta,” samantalang iniiwasan ng kabuuang pangungusap ang labis na teknikal o makalumang pananalita.
