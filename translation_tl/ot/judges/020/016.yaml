revisions:
- from: Mula sa buong bayang ito ay may pitong daang piling lalaki na kaliwete.[a] Bawat isa sa kanila ay kayang maghilagpos ng bato sa isang hibla ng buhok nang hindi sumasablay.
  to: Mula sa buong bayang ito, may pitong daang piling lalaking kaliwete.[a] Bawat isa sa kanila ay nakapaghahagis ng bato gamit ang tirador sa isang hibla ng buhok nang hindi sumasablay.
  rationale: Inayos ang ayos ng pangungusap para sa mas natural na Filipino at pinalitan ang “maghilagpos ng bato” ng malinaw na pagpapahayag na nagsasaad ng paggamit ng tirador. Pinanatili ang “kaliwete” sa pangunahing teksto, habang inilalahad ng talababa ang mas literal at idyomatikong anyo ng Hebreo nang hindi ipinagpapalagay na tiyak ang eksaktong pisikal na kalagayan.
