  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: tl
  text: Mula sa buong bayang ito, may pitong daang piling lalaking kaliwete.[a] Bawat isa sa kanila ay nakapaghahagis ng bato gamit ang tirador sa isang hibla ng buhok nang hindi sumasablay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin mula sa Hebreo, “napipigilan o may kapansanan ang kanilang kanang kamay,” na malamang ay nangangahulugang ginagamit nila ang kaliwang kamay sa pakikipaglaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: Mula sa buong bayang ito
  rationale: Pinananatili ang partitive na diwa ng מִן at ang malawak na kahulugan ng עָם bilang bayan o pangkat ng mga tao, nang hindi ito nililimitahan sa “mga kawal.”
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: pitong daang piling lalaki
  rationale: Ang אִישׁ ay tuwirang bilang ng mga lalaking nasa hukbo, at ang בָּחוּר ay tumutukoy sa mga pinili o piling lalaki.
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: kaliwete
  rationale: Bagaman literal na inilalarawan ng Hebreo ang kanang kamay bilang napipigilan o may sagabal, sa kontekstong pandigma ang likas na kahulugan ay mga lalaking gumagamit ng kaliwang kamay. Inilalahad sa talababa ang mas literal na anyo upang mapanatili ang posibleng pahiwatig ng kapansanan o restriksiyon.
- source_word: כָּל זֶה
  choice: Bawat isa sa kanila
  rationale: 'Ipinahahayag nito ang distributibong diin: taglay ng bawat isa sa pitong daan ang kasanayang binanggit.'
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: kayang maghilagpos ng bato
  rationale: Ang participle ay naglalarawan ng palagiang kakayahan, hindi lamang ng isang kasalukuyang kilos. Ang “maghilagpos” ay angkop sa paghahagis ng bato sa pamamagitan ng panghilagpos.
- source_word: אֶל הַשַּׂעֲרָה
  choice: sa isang hibla ng buhok
  rationale: Pinananatili ang kongkretong larawan ng iisang buhok bilang napakaliit na puntirya at ginagawang malinaw sa natural na Filipino.
- source_word: וְלֹא יַחֲטִא
  choice: nang hindi sumasablay
  rationale: Sa kontekstong ito, ang חטא ay nangangahulugang hindi pagtama sa puntirya, hindi moral na pagkakasala.
