  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: tl
  text: Pinaligiran nila ang mga Benjaminita, hinabol nila sila nang walang tigil[a], at niyurakan[b] hanggang sa tapat ng Gibea, sa gawing silangan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinabol nila sila sa Menucha,” kung ang מְנוּחָה ay pangalang-pook at hindi ginamit bilang pang-abay.
    reason: alternative_reading
  - marker: b
    text: O “itinaboy nila”; maaaring tumukoy ang pandiwang Hebreo sa marahas na pagyurak o sa pagpapakilos sa isang tao patungo sa isang direksiyon.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mula sa silangan ng araw,” ibig sabihin, “sa gawing silangan” o “sa silangang panig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: Pinaligiran
  rationale: Ipinahahayag ng pandiwa ang pag-ikot at pagkulong sa kalaban; natural at malinaw ang “pinaligiran” sa kontekstong militar.
- source_word: אֶת בִּנְיָמִן
  choice: ang mga Benjaminita
  rationale: Ginagamit ang pangalang Benjamin bilang kolektibong tawag sa lipi o hukbo nito. Mas natural sa modernong Tagalog ang “mga Benjaminita” kaysa sa literal ngunit alanganing “ang Benjamin.”
- source_word: הִרְדִיפֻהוּ
  choice: silang hinabol
  rationale: Karaniwang tumutukoy ang רדף sa pagtugis o paghabol sa kalaban. Inangkop sa maramihang “mga Benjaminita” ang panghalip.
- source_word: מְנוּחָה
  choice: walang tigil
  rationale: Bagaman literal na nangangahulugang “pahinga” o “pahingahan,” mahirap ang gamit nito rito. Ang adberbiyal na “walang tigil” ay naghahatid ng malamang na diwang hindi sila binigyan ng pahinga, habang inilalahad sa talababa ang posibleng pangalang-pook.
- source_word: הִדְרִיכֻהוּ
  choice: niyurakan
  rationale: Maaaring mangahulugan ang Hiphil ng דרך ng pagtapak o pagpapalakad. Sa sunod-sunod na mararahas na kilos sa labanan, pinananatili ng “niyurakan” ang malakas na diwa nang hindi ito ginagawang tiyak na “pinuksa.”
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: hanggang sa tapat ng Gibea
  rationale: Ang נֹכַח ay nagsasaad ng lugar na kaharap o katapat ng isa pang lugar; malinaw at likas sa Tagalog ang “sa tapat ng Gibea.”
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: sa gawing silangan
  rationale: Ang literal na larawan ay “mula sa silangan ng araw,” isang Hebreong pahayag na tumutukoy sa silangan o silangang panig. Natural sa Tagalog ang “sa gawing silangan,” at pinananatili sa talababa ang literal na anyo.
