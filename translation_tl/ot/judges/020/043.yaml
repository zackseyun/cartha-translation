translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang “mga Benjaminita” at “sila” upang likas na maipahayag ang kolektibong Benjamin ng Hebreo. Hindi pinawi ang tekstuwal at leksikal na hirap ng מְנוּחָה at הִדְרִיכֻהוּ; inilalahad sa mga talababa ang tunay na mga alternatibo.
