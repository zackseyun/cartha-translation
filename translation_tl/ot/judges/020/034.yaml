base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: tl
  text: Dumating ang sampung libong piling mandirigma mula sa buong Israel upang salakayin ang Gibea, at naging matindi ang labanan. Ngunit hindi alam ng mga Benjaminita na papalapit na sa kanila ang kapahamakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “na umaabot na sa kanila ang kapahamakan.” Literal sa Hebreo: “na humihipo/umaabot sa kanila ang kapahamakan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: upang salakayin ang Gibea
  rationale: Ang מִנֶּגֶד ay literal na tumutukoy sa pagharap o pagiging nasa tapat, ngunit sa konteksto ng labanan ay nagpapahiwatig ito ng pagdating laban sa Gibea. Likas sa modernong Tagalog ang “upang salakayin” at malinaw ang diwang militar.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: sampung libong piling mandirigma
  rationale: Ang בָּחוּר dito ay tumutukoy sa mga pinili o mahuhusay na lalaking panlaban, hindi lamang sa mga kabataang lalaki. Nililinaw ng “mandirigma” ang kolektibo at militar na gamit ng אִישׁ.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: mula sa buong Israel
  rationale: Ipinahihiwatig ng parirala na ang mga mandirigma ay kinuha mula sa kabuuan ng Israel.
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: at naging matindi ang labanan
  rationale: Sa konstruksiyong ito, ang כָּבֵד ay nagsasaad ng bigat sa diwang matindi o mabagsik, hindi literal na timbang.
- source_word: וְהֵם לֹא יָדְעוּ
  choice: Ngunit hindi alam ng mga Benjaminita
  rationale: Ang waw ay natural na isinaling “Ngunit” dahil may paghahambing sa tindi ng labanan at sa kawalan nila ng kamalayan. Tahasang tinukoy ang mga Benjaminita ayon sa malinaw na referent sa konteksto upang maiwasan ang malabong panghalip.
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: na papalapit na sa kanila ang kapahamakan
  rationale: Literal na nangangahulugan ang נגע ng paghipo o pag-abot. Sa konteksto, inilalarawan nito ang kapahamakang dumarating at halos umabot na sa kanila; ang הָרָעָה ay kalamidad o kapahamakan, hindi moral na kasamaan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “piling mandirigma” sa halip na literal na “piling lalaki” upang maipakita ang kontekstong militar, at “kapahamakan” upang ipahayag ang kalamidad sa halip na moral na kasamaan.
