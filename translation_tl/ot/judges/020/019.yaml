  yaml_path: translation/ot/judges/020/019.yaml
  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: tl
  text: Kinaumagahan, bumangon ang mga Israelita at nagkampo laban sa Gibea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֥וּמוּ
  choice: bumangon
  rationale: Ang wayyiqtol ng קום ay nagsasalaysay ng sumunod na kilos. Likas sa modernong Tagalog ang “bumangon” at hindi nito labis na nililinaw kung sila ay agad na humayo.
- source_word: בְנֵֽי יִשְׂרָאֵ֖ל
  choice: ang mga Israelita
  rationale: Ang literal na idyomang “mga anak na lalaki ni Israel” ay tumutukoy rito sa bayang Israel bilang isang pangkat. Ang “mga Israelita” ang malinaw, likas, at tumpak na katumbas sa kasalukuyang Tagalog.
- source_word: בַּבֹּ֑קֶר
  choice: Kinaumagahan
  rationale: Ipinapahayag ng parirala ang oras ng kasunod na pangyayari sa salaysay. Ang “Kinaumagahan” ay natural na salaysay na katumbas ng “sa umaga” sa kontekstong ito.
- source_word: וַיַּֽחֲנ֖וּ
  choice: nagkampo
  rationale: Ang חנה ay nangangahulugang humimpil o magtayo ng kampo. Karaniwan at malinaw sa modernong Filipino ang “nagkampo.”
- source_word: עַל
  choice: laban sa
  rationale: Sa kontekstong militar, ipinahihiwatig ng עַל ang mapanlabang pagpuwesto tungo sa Gibea, hindi lamang ang pagiging malapit dito.
- source_word: הַגִּבְעָֽה
  choice: Gibea
  rationale: Pangalan ito ng lugar. Ginamit ang karaniwang anyong Filipino na “Gibea”; hindi isinalin nang hiwalay ang artikulong Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” sa halip na literal na “mga anak na lalaki ni Israel” sapagkat ang Hebreong idyoma ay tumutukoy sa buong pangkat; hindi kailangan ng talababa dahil walang mahalagang ambiguwidad na nawawala.
