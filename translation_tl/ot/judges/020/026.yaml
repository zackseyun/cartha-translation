source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: tl
  text: Pagkatapos, umakyat ang lahat ng anak ng Israel—ang buong bayan[a]—at pumunta sa Bethel. Umiyak sila at naupo roon sa harap ni Yahweh. Nag-ayuno sila nang araw na iyon hanggang gabi. Pagkatapos, naghandog sila sa harap ni Yahweh ng mga handog na sinusunog nang buo at mga handog pangkapayapaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ng Israelita at ang buong bayan.”
    reason: lexical_alternative
  - marker: b
    text: O “mga handog ng pakikipag-isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: umakyat
  rationale: Pinananatili nito ang diwa ng pataas na paglalakbay na karaniwang ipinahihiwatig ng עלה sa salaysay.
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: ang lahat ng anak ng Israel—ang buong bayan
  rationale: Ang “anak ng Israel” ay likas na hindi tiyak sa kasarian sa Tagalog at napapanatili ang pampamilya at pambansang katawagan ng Hebreo. Ginamit ang gitling upang ipakitang ang “buong bayan” ay isang mariing paglilinaw, hindi ibang pangkat.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Ito ang nakaugaliang anyo ng pangalan ng lugar; hindi ito isinaling literal bilang “bahay ng Diyos.”
- source_word: וַיִּבְכּוּ
  choice: umiyak sila
  rationale: Malinaw at natural itong nagpapahayag ng pagdadalamhati sa konteksto.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: naupo roon sa harap ni Yahweh
  rationale: Pinananatili ang kongkretong kahulugan ng ישב bilang pag-upo, bagaman maaari rin itong mangahulugang pananatili.
- source_word: וַיָּצוּמוּ בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: nag-ayuno sila nang araw na iyon hanggang gabi
  rationale: Natural na Filipino ito at malinaw na pinananatili ang itinakdang haba ng pag-aayuno.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: naghandog ... ng mga handog na sinusunog nang buo
  rationale: Sa konteksto ng paghahandog, ang anyo ng עלה ay tumutukoy sa pag-aalay. Nililinaw ng “nang buo” ang natatanging katangian ng עֹלוֹת.
- source_word: שְׁלָמִים
  choice: mga handog pangkapayapaan
  rationale: Pinananatili nito ang tradisyonal at leksikal na kaugnayan ng שלמים sa kapayapaan o kabuuan, nang hindi ikinukulong ang handog sa isang interpretasyon lamang.
theological_decisions:
- issue: Paglalarawan sa pambansang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  alternative: mga Israelita
  rationale: Napapanatili ng pangunahing salin ang talinghagang pampamilya ng Hebreo. Hindi kailangang magdagdag ng panlalaking kasarian sapagkat maaaring tumukoy sa alinmang kasarian ang “anak” sa Filipino.
- issue: Paglilipat sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya ginamit ang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog pangkapayapaan
  alternative: mga handog ng pakikipag-isa
  rationale: Ang pangunahing salin ay mas malapit sa leksikal na anyo, samantalang inilalagay sa talababa ang alternatibong nagtatampok sa pinagsasaluhang pakikipag-isa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” bilang pantanging pangalan, “naupo” upang mapanatili ang kongkretong kilos, at “sinusunog nang buo” upang maging malinaw sa karaniwang mambabasa ang uri ng handog. Ang pag-uulit ng “Pagkatapos” ay sumasalamin sa sunod-sunod na kilos ng salaysay nang hindi nagiging matigas ang daloy.
