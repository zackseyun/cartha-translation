  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: tl
  text: Lumabas ang lahat ng mga anak ni Israel[a], at nagtipon ang kapulungan na parang iisang lalaki[b]—mula sa Dan hanggang Beer-seba at mula sa lupain ng Gilead—kay Yahweh sa Mizpa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak ni Israel.” Kolektibong tumutukoy ang Hebreong pananalita sa sambayanang Israel, hindi lamang sa mga lalaking indibidwal.
    reason: lexical_alternative
  - marker: b
    text: Literal na “parang iisang lalaki”; isang idyoma para sa nagkakaisang pasiya at pagkilos.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “sa harap ni Yahweh sa Mizpa.” Maaaring ipahiwatig ng Hebreo na nagtipon ang kapulungan sa presensiya ni Yahweh roon.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Lumabas
  rationale: Karaniwang kahulugan ng יצא ang paglabas. Hindi tinutukoy ng Hebreo kung ang pananaw ay ‘pumarito’ o ‘pumaroon,’ kaya pinananatili ng ‘lumabas’ ang direksiyonal na kalabuan.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ang lahat ng mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawang ‘mga anak ni Israel,’ habang nililinaw sa talababa na kolektibong tumutukoy ito sa sambayanang Israel.
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: nagtipon ang buong kapulungan
  rationale: Ang קהל ay nagsasaad ng pagtitipon, at ang עֵדָה ay ang buong katawang-bayan o kapulungan. Ang ‘kapulungan’ ay marangal at likas nang hindi kinakailangang magpahiwatig ng isang partikular na organisasyong panrelihiyon.
- source_word: כְּאִישׁ אֶחָד
  choice: bilang iisang tao
  rationale: Pinananatili ang Hebreong idyoma at ang diwa ng nagkakaisang pagkilos; ipinaliliwanag ang idyoma sa talababa.
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: mula sa Dan hanggang Beer-seba
  rationale: Likas na katumbas ito ng heograpikong saklaw na ipinahihiwatig ng Hebreo, mula sa hilaga hanggang timog.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: gayundin mula sa lupain ng Gilead
  rationale: Ibinubukod ngunit isinasama ng parirala ang rehiyon sa silangan ng Jordan. Ang pag-uulit ng diwang ‘mula sa’ ay nagpapalinaw sa saklaw nang hindi binabago ang kahulugan.
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: kay Yahweh sa Mizpa
  rationale: Pinananatili ng ‘kay’ ang tuwirang lakas ng אֶל bilang paglapit o pagtungo kay Yahweh, samantalang ang ‘sa Mizpa’ ang nagsasaad ng lugar. Dahil maaari rin itong unawain bilang pagtitipon sa presensiya ni Yahweh, inilalahad ang alternatibo sa talababa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Ginagamit ng talata ang mismong tipanang pangalan. Ang ‘Yahweh’ ay tuwirang transliterasyon na hindi pinapalitan ang pangalan ng isang titulo.
- issue: Lalaking anyo sa בְּנֵי יִשְׂרָאֵל at כְּאִישׁ אֶחָד
  choice: Panatilihin ang ‘mga anak ni Israel’ at ‘bilang iisang tao’
  alternative: mga Israelita; na nagkakaisa
  rationale: Pinananatili ng salin ang anyo at larawan ng Hebreo, ngunit nililinaw sa mga talababa ang kolektibo at idyomatikong gamit upang hindi ipakahulugang mga lalaking indibidwal lamang.
- issue: Ugnayan ng kapulungan kay Yahweh sa Mizpa
  choice: kay Yahweh sa Mizpa
  alternative: sa harap ni Yahweh sa Mizpa
  rationale: Ang אֶל ay karaniwang ‘kay/patungo kay,’ ngunit sa kontekstong ito maaari rin nitong ipahiwatig ang pagharap o pagtitipon sa presensiya ni Yahweh. Hindi tuluyang nilulutas ng pangunahing teksto ang kalabuan, at itinatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga Hebreong larawang may mahalagang tekstuwal na kulay, ngunit nilinaw sa mga talababa ang kolektibo at idyomatikong kahulugan. Ginamit ang mga anyong pangalang ‘Beer-seba’ at ‘Mizpa’ na madaling bigkasin sa Filipino.
