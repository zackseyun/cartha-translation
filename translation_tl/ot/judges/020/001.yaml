- from: Lumabas ang lahat ng mga anak ni Israel[a], at nagtipon ang buong kapulungan bilang iisang tao[b]—mula sa Dan hanggang Beer-seba, gayundin mula sa lupain ng Gilead—kay Yahweh sa Mizpa.[c]
