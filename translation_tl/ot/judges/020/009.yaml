translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palabunutan” bilang karaniwang salitang nauunawaan para sa pagpapasiya sa pamamagitan ng lots; pinanatili sa talababa ang pagiging maigsi at malabo ng Hebreong parirala.
