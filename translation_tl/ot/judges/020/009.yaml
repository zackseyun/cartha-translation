  yaml_path: translation/ot/judges/020/009.yaml
  text: 'But now this is what we will do to Gibeah: against it by lot[a].'
translation:
  language: tl
  text: 'Ngunit ngayon, ito ang gagawin natin sa Gibea: laban dito sa pamamagitan ng palabunutan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kikilos tayo laban dito sa pamamagitan ng palabunutan.” Maikli at hindi tahasan ang Hebreo; maaaring ipinahihiwatig nito na ang pagkilos laban sa Gibea ay pagpapasiyahan o itatalaga sa pamamagitan ng palabunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Ipinapakita ang paglipat mula sa naunang pasiya tungo sa susunod na hakbang, habang pinananatili ang banayad na panalungat at temporal na diwa.
- source_word: זֶה הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: ito ang gagawin natin
  rationale: Natural na Filipino para sa demonstrative-noun-relative construction at sa unang panauhang maramihang imperfect na nagpapahayag ng nilalayong pagkilos.
- source_word: לַגִּבְעָה
  choice: sa Gibea
  rationale: Minamarkahan ng ל ang Gibea bilang tudlaan ng planong pagkilos; pinananatili ng payak na 'sa' ang pagiging maigsi ng Hebreo.
- source_word: עָלֶיהָ
  choice: sasalakayin natin ito
  rationale: Sa kontekstong militar, ang עַל ay nagpapahiwatig ng pagkilos laban sa lungsod. Ginawang hayag ang pandiwang ipinapalagay sa maikling Hebreo upang maging malinaw at natural sa Filipino.
- source_word: בְּגוֹרָל
  choice: ayon sa palabunutan
  rationale: Ipinahihiwatig na ang pagkilos o pagtatalaga ay pagpapasiyahan sa pamamagitan ng palabunutan, nang hindi tinutukoy kung aling eksaktong bahagi ng plano ang iaatas.
