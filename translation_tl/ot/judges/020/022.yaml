base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: tl
  text: Ngunit nagpatatag ang bayan, ang mga lalaking Israelita, at muli silang pumuwesto upang makipaglaban sa lugar kung saan sila pumuwesto noong unang araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpalakas ng loob.” Maaaring tumukoy ang Hebreo sa panibagong tatag matapos silang matalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: nagpalakas ng loob
  rationale: Ang Hitpael ng חזק ay nagsasaad dito ng panibagong tatag o lakas ng loob matapos matalo. Likas ito sa modernong Tagalog at pinananatili ang reflexive na diwa.
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: ang bayan—ang mga lalaki ng Israel
  rationale: 'Pinananatili ang appositional na pagkakabuo: ang kolektibong “bayan” ay nililinaw bilang mga lalaking Israelita na nakikipaglaban, nang hindi ipinapalit ang mas interpretibong “hukbo.”'
- source_word: וַיֹּסִפוּ
  choice: muli silang
  rationale: Kasama ng kasunod na infinitive, ipinahihiwatig ng יסף ang pag-uulit o pagpapatuloy ng kilos; natural itong ipinapahayag ng “muli” sa Tagalog.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: pumuwesto para sa labanan
  rationale: Ang ערך kasama ng מלחמה ay tumutukoy sa pag-aayos o pagkuha ng puwesto sa hanay ng labanan. Ang “pumuwesto para sa labanan” ay malinaw at natural nang hindi pinalalawak sa pangkalahatang paghahanda sa digmaan.
- source_word: בַּמָּקוֹם אֲשֶׁר עָרְכוּ שָׁם
  choice: sa lugar na pinagpuwestuhan nila
  rationale: Pinananatili ang lokatibong diwa at ang pag-uulit ng pandiwang ערך, habang iniiwasan ang di-natural na tahasang pag-uulit ng “doon” sa Tagalog.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: noong unang araw
  rationale: Natural na temporal na parirala sa Tagalog para sa naunang araw ng pakikipaglaban.
