translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagpalakas ng loob” para sa likas na pagpapahayag ng muling pagtibay, at pinanatili ang “bayan—ang mga lalaki ng Israel” upang katawanin ang appositional na anyo ng Hebreo.
