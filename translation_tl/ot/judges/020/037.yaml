base_translation:
  language: en
  yaml_path: translation/ot/judges/020/037.yaml
  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: tl
  text: Mabilis na sumalakay sa Gibea ang mga lalaking nakatambang, at sumulong[a] ang pangkat na nakatambang at pinuksa sa talim ng espada ang buong lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “humatak” o “umunat” ang pangkat na nakatambang; maaaring ipinahihiwatig ng pandiwa na umabante o kumalat pasulong ang puwersa patungo sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: mga lalaking nakatambang / pangkat na nakatambang
  rationale: 'Kolektibo ang tinutukoy ng anyong isahan: ang puwersang militar na nag-abang upang sumalakay. Nilinaw muna ang mga kasapi at saka ginamit ang natural na kolektibong katawagan.'
- source_word: הֵחִישׁוּ
  choice: mabilis
  rationale: Ipinahahayag ng pandiwa ang pagmamadali; sa pagsama sa “sumalakay,” malinaw ang biglaan at apurahang kilos militar.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: sumalakay sa
  rationale: Sa konteksto ng labanan, inilalarawan nito ang mabilis na paglusob patungo sa o laban sa Gibea, hindi lamang ang karaniwang kahulugang “kumalat.”
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng lugar.
- source_word: וַיִּמְשֹׁךְ
  choice: sumulong
  rationale: Malamang na tumutukoy sa pagpapatuloy o pag-abante ng puwersang nakatambang. Dahil siksik at maaaring literal na “humatak/umunat” ang Hebreo, inilagay sa talababa ang alternatibo.
- source_word: וַיַּךְ
  choice: pinuksa
  rationale: Sa pagsunod ng idyomang “sa talim ng espada,” nakamamatay na pananakit ang malinaw na diwa; ang “pinuksa” ay natural sa salaysay ng digmaan.
- source_word: כָּל הָעִיר
  choice: ang buong lungsod
  rationale: Pinananatili ang metonimikong pahayag ng Hebreo nang hindi tahasang nililimitahan sa mga naninirahan lamang.
- source_word: לְפִי חָרֶב
  choice: sa talim ng espada
  rationale: Natural na katumbas sa Filipino ng idyomang Hebreo na literal na “sa bibig ng espada,” habang pinananatili ang larawan ng sandata.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mabilis na daloy ng salaysay at ang kolektibong diwa ng puwersang nakatambang; iniwasan ang labis na paglilinaw sa “buong lungsod.”
