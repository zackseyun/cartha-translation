base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: tl
  text: 'At ang mga lalaki ng Israel ay bumalik laban sa mga Benjaminita[a] at pinuksa sila sa talim ng tabak: sa bawat lunsod, mula sa mga tao hanggang sa mga hayop, pati na ang lahat ng natagpuan[b]. Sinunog din nila ang lahat ng lunsod na kanilang natagpuan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Benjamin,” ibig sabihin, ang mga Benjaminita.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang pariralang Hebreo na isinaling “sa bawat lunsod, mula sa mga tao.” Maaaring tumukoy ito sa ganap na pagpatay sa mga naninirahan sa mga lunsod, kasama ang mga hayop at lahat ng iba pang natagpuan doon.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: ang mga lalaki ng Israel
  rationale: Bagaman isahan ang אִישׁ, kolektibo ang gamit nito sa harap ng pandiwang maramihan at tumutukoy sa mga lalaking mandirigma sa konteksto.
- source_word: שָׁבוּ אֶל בְּנֵי בִנְיָמִן
  choice: bumalik laban sa mga Benjaminita
  rationale: Ipinahihiwatig ng שוב ang pagbabalik o pagbaligtad ng direksiyon, at dahil marahas ang kasunod na kilos, likas sa Tagalog ang 'laban sa.'
- source_word: בְּנֵי בִנְיָמִן
  choice: mga Benjaminita
  rationale: Likas at malinaw na katumbas ito ng Hebreong katawagang pampangkan na literal na 'mga anak ni Benjamin'; inilalagay sa talababa ang literal na anyo.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: pinuksa sila sa talim ng tabak
  rationale: Sa konteksto ng ganap na pagpatay, ipinahahayag ng 'pinuksa' ang nakamamatay na diwa ng נכה, samantalang pinananatili ng 'sa talim ng tabak' ang kongkretong idyomang Hebreo.
- source_word: מֵעִיר מְתֹם
  choice: mula sa bawat lunsod—mga tao
  rationale: Mahirap at hindi tiyak ang parirala. Ipinapakita ng salin ang malamang na saklaw na lunsod-lunsod at ang pahiwatig na mga taong naninirahan doon, habang ipinaliliwanag sa talababa ang suliraning tekstuwal.
- source_word: עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: hanggang sa mga hayop, pati ang lahat ng natagpuan
  rationale: Pinalalawak ng magkakasunod na עַד ang saklaw ng pagpuksa mula sa mga tao tungo sa mga hayop at sa lahat ng naroon.
- source_word: גַּם כָּל הֶעָרִים הַנִּמְצָאוֹת שִׁלְּחוּ בָאֵשׁ
  choice: Sinunog din nila ang lahat ng lunsod na kanilang natagpuan
  rationale: Ang idyomang 'ipadala sa apoy' ay likas na isinasalin bilang 'sinunog'; ang participle ng מצא ay nauunawaan bilang mga lunsod na kanilang natagpuan o nadaanan.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'lunsod' at 'tabak' upang mapanatili ang dignidad ng salaysay, ngunit iniwasan ang lipas o labis na literal na pananalita. Hindi pinakinis nang tahimik ang mahirap na מֵעִיר מְתֹם; minarkahan at ipinaliwanag ang tunay na kalabuan nito.
