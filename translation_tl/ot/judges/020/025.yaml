  register: Makabago ngunit marangal na Filipino. Ginamit ang 'Gibea' at 'mga anak ni Israel' bilang mga anyong angkop sa saling biblikal. Hindi nilagyan ng talababa sapagkat maipahahayag nang natural sa pangunahing teksto ang mga leksikal na posibilidad nang walang mahalagang pagkawala ng kahulugan.
