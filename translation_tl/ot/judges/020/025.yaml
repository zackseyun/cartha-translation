base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: tl
  text: Noong ikalawang araw, lumabas ang Benjamin mula sa Gibea upang salubungin sila[a], at nakapatay sila ng karagdagang labingwalong libong lalaki mula sa mga anak ni Israel[b]; lahat sila ay mga bumubunot ng tabak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, "upang harapin sila" o "laban sa kanila." Ang Hebreong parirala ay maaaring tumukoy sa isang pagalit na pagsalubong sa kontekstong militar.
    reason: lexical_alternative
  - marker: b
    text: O, "mga Israelita." Literal na "mga anak ni Israel" ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא בִנְיָמִן
  choice: lumabas ... ang Benjamin
  rationale: Ang singular na 'Benjamin' ay kolektibong tumutukoy sa lipi o hukbo nito; pinanatili ang anyong kolektibo sa halip na tahasang idagdag ang 'mga Benjaminita.'
- source_word: לִקְרָאתָם
  choice: upang harapin sila
  rationale: Sa kontekstong militar, malinaw na salubong na palaban ang tinutukoy. Ang 'harapin' ay natural sa Filipino at hindi labis na nilulutas kung paglusob o pagsalubong ang eksaktong larawan.
- source_word: מִן הַגִּבְעָה
  choice: mula sa Gibea
  rationale: Tuwirang ipinahahayag ang pinanggalingang lugar at isinasalin ang pangalang pantangi sa karaniwang anyong Filipino.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Nang ikalawang araw
  rationale: Pinananatili ang tahasang ordinal ng Hebreo, hindi ginagawang 'kinabukasan.'
- source_word: וַיַּשְׁחִיתוּ
  choice: pinabagsak
  rationale: Ang Hiphil ng שׁחת ay nagsasaad ng pagwasak o pagpatay; sa ulat ng labanan at kasama ng 'sa lupa,' ang 'pinabagsak' ay natural at malinaw na tumutukoy sa nakamamatay na pagkatalo.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang literal na familial-national na pariralang 'mga anak ni Israel,' habang ang 'sa' ay likas na nagpapahayag ng pangkat na tinamaan.
- source_word: עוֹד
  choice: muli
  rationale: Ipinahihiwatig nito ang karagdagang pagkalugi pagkatapos ng naunang araw; ang 'muli' ay idiomatiko at malinaw sa konteksto.
- source_word: שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: labingwalong libong lalaki
  rationale: Tuwirang salin ng bilang at איש; hindi pinalitan ng mas interpretibong 'kawal.'
- source_word: אָרְצָה
  choice: sa lupa
  rationale: Pinananatili ang direksiyonal na larawan ng mga napatumba o napatay sa lupa.
- source_word: שֹׁלְפֵי חָרֶב
  choice: mga humahawak ng tabak
  rationale: Ang participle ay literal na tumutukoy sa mga bumubunot o may hawak na tabak, isang idyomang militar para sa mga lalaking handang makipaglaban. Ang 'humahawak' ay nagpapanatili ng konkretong larawan nang hindi ginagawang pangkalahatang 'mga kawal.'
