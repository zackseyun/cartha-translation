  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: tl
  text: Ngunit nagsimulang pumailanlang mula sa lungsod ang hudyat—isang haligi ng usok.[a] Lumingon sa kanilang likuran ang mga Benjaminita,[b] at nakita nilang ang buong lungsod ay umaakyat hanggang langit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang siga.” Ang salitang Hebreo ay maaaring tumukoy sa isang bagay na itinaas; dito, malamang na ito ang napagkasunduang hudyat sa labanan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Lumingon si Benjamin sa kaniyang likuran.” Ang “Benjamin” ay kolektibong tumutukoy sa mga Benjaminita; maaari ring maunawaan ang kilos bilang pagtalikod o pagtingin sa likuran.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ang buong lungsod ay umaakyat tungo sa langit,” ibig sabihin, sa apoy at usok.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: ang hudyat
  rationale: Sa konteksto ng planadong pananambang, tumutukoy ito sa napagkasunduang palatandaan mula sa lungsod. Likas at malinaw sa makabagong Filipino ang “hudyat,” habang naipapakita ng kasunod na parirala na usok ang anyo nito.
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: nagsimulang pumailanlang
  rationale: Pinananatili nito ang aspektong pasimula at ang paitaas na pagkilos. Ang “pumailanlang” ay angkop sa haligi ng usok at nagbibigay ng malinaw na larawang biswal.
- source_word: עַמּוּד עָשָׁן
  choice: isang haligi ng usok
  rationale: Tumpak at pamilyar na katumbas ito ng Hebreong parirala para sa isang patayong bugso o hanay ng usok.
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: Lumingon sa kanilang likuran ang mga Benjaminita
  rationale: Ang “Benjamin” ay kolektibong katawagan sa lipi o hukbo. Ginawang maramihan sa Filipino upang maging natural, habang pinananatili ng “lumingon sa kanilang likuran” ang kilos at direksiyon ng Hebreo.
- source_word: וְהִנֵּה
  choice: at nakita nilang
  rationale: Ipinahahayag ng marker ang biglaang pagkatuklas sa tanawin. Sa Filipino, likas na naihahatid ng “nakita nilang” ang dramatikong pagkamulat nang hindi gumagamit ng lipas na ekspresyon.
- source_word: כְלִיל הָעִיר
  choice: ang buong lungsod
  rationale: Ipinahahayag ng כְלִיל ang kabuuan; “ang buong lungsod” ang pinakanatural at tuwirang katumbas.
- source_word: עָלָה ... הַשָּׁמָיְמָה
  choice: umaakyat hanggang langit
  rationale: Pinananatili nito ang masidhing larawan ng lungsod na tila umaakyat paitaas, nang hindi tahasang nilulutas sa pangunahing teksto kung apoy, usok, o kapuwa ang tinutukoy.
