translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Benjaminita” upang natural na maipahayag ang kolektibong singular ng Hebreo. Pinanatili sa pangunahing teksto ang matingkad at bahagyang di-tahasang larawan ng lungsod na “umaakyat hanggang langit,” at ipinaliwanag lamang sa talababa ang pahiwatig na apoy at usok.
