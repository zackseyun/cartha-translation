base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: tl
  text: 'At pumuwesto ang mga pinuno ng buong bayan[a]—ng lahat ng lipi ng Israel—sa kapulungan ng bayan ng Diyos: apatnaraang libong kawal na naglalakad, na humuhugot ng tabak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga sulok ng buong bayan,” isang idyoma para sa mga pinuno o pangunahing tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: pumuwesto
  rationale: Ipinahahayag ng anyong hitpael ang sadyang pagtayo o paglagay sa isang posisyon; natural sa makabagong Filipino at angkop sa kontekstong militar at pampublikong pagtitipon.
- source_word: פִּנּוֹת
  choice: mga pinuno
  rationale: Literal itong “mga sulok,” ngunit idyoma para sa mga pangunahing tao o lider na nagsisilbing sandigan ng bayan. Isinama ang talababa upang mapanatili ang larawang Hebreo.
- source_word: כָּל הָעָם
  choice: buong bayan
  rationale: Natural na kolektibong katumbas na nagpapanatili sa saklaw ng “lahat” nang hindi nagmumukhang tumutukoy sa bawat indibidwal.
- source_word: כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: lahat ng lipi ng Israel
  rationale: Tuwirang salin ng katawagang panlipi at nagpapanatili sa paliwanag na nakapaloob sa parirala.
- source_word: בִּקְהַל
  choice: sa kapulungan
  rationale: Ang קהל ay isang nagkatipong kapulungan. Dignified at malinaw ang “kapulungan” nang hindi nagdaragdag ng eksklusibong eklesiastikong kahulugan.
- source_word: עַם הָאֱלֹהִים
  choice: bayan ng Diyos
  rationale: Pinananatili ang anyong construct at ang solemneng pagkakakilanlan ng Israel bilang bayan na kaugnay ng Diyos.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף
  choice: apatnaraang libo
  rationale: Tuwirang salin ng bilang sa natural na Filipino.
- source_word: אִישׁ רַגְלִי
  choice: kawal na naglalakad
  rationale: Literal na tumutukoy sa mga lalaking nakikipaglaban nang naglalakad, bilang kaibahan sa mga nakasakay. Mas madaling maunawaan kaysa sa teknikal na “impanterya.”
- source_word: שֹׁלֵף חָרֶב
  choice: na humuhugot ng tabak
  rationale: Pinananatili ang masiglang larawang militar ng participle at ang singular na idyomang “tabak,” nang hindi tahasang idinaragdag ang distributibong “bawat isa.”
theological_decisions:
- issue: Paglalarawan sa Israel bilang עַם הָאֱלֹהִים
  choice: bayan ng Diyos
  alternative: mga tao ng Diyos
  rationale: Ang “bayan ng Diyos” ay natural at marangal sa Filipino at pinananatili ang kolektibo at tipanang diwa nang hindi nagdaragdag ng denominasyonal na interpretasyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang mga gitling na em upang luminaw na ang “lahat ng lipi ng Israel” ay nagpapaliwanag sa “buong bayan,” at ang tutuldok upang ipakilala ang bilang ng mga kawal. Iniwasan ang sobrang teknikal o eklesiastikong pananalita.
