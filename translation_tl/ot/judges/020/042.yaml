translation_notes:
  register: Makabago at marangal na Tagalog na madaling maunawaan. Ginamit ang “mga tauhan ng Israel” upang panatilihin ang militar at panlalaking diwa ng אִישׁ sa konteksto. Iningatan ang siksik at bahagyang malabong huling sugnay sa pangunahing teksto, at ipinaliwanag ang malamang na taktikal na kahulugan sa talababa.
