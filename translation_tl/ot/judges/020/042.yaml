base_translation:
  language: en
  yaml_path: translation/ot/judges/020/042.yaml
  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: tl
  text: Kaya tumalikod sila mula sa harap ng mga tauhan ng Israel at nagtungo sa daan patungo sa ilang[a], ngunit inabutan sila ng labanan[b]; at nililipol sila ng mga mula sa mga lungsod sa gitna nila[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa harap ng mga tauhan ng Israel.” Maaari rin itong unawain nang idiomatiko bilang “mula sa harap ng mga tauhan ng Israel,” ibig sabihin, umurong sila mula sa mga ito.
    reason: lexical_alternative
  - marker: b
    text: O “nahabol sila ng labanan.”
    reason: lexical_alternative
  - marker: c
    text: Siksik at mahirap unawain ang huling sugnay sa Hebreo. Malamang na tumutukoy ito sa mga puwersa ng Israel na lumabas mula sa mga lungsod o sa mga puwestong tambangan at lumipol sa Benjamin mula sa loob ng kanilang hanay.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: tumalikod sila
  rationale: Ang פנה ay pangunahing nangangahulugang bumaling o tumalikod. Sa konteksto ng labanan, ipinahihiwatig nito ang pag-urong nang hindi tahasang dinaragdagan ang diwa bilang “tumakas.”
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: sa harap ng mga tauhan ng Israel
  rationale: Pinananatili nito ang literal na larawan ng puwersang militar na kaharap nila; maaaring idiomatikong mangahulugan ang parirala na umalis o umurong mula sa harap ng Israel.
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: sa daan patungo sa ilang
  rationale: Likas sa makabagong Tagalog at malinaw na ipinahahayag na ang daan ay patungo sa ilang, habang pinananatili ang kahulugan ng דֶּרֶךְ bilang daan.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: ngunit inabutan sila ng labanan
  rationale: Ang causative na anyo ng דבק ay nagpapahiwatig ng paghabol na nakaabot sa kanila. Ang “sila” ay natural na salin ng kolektibong isahan na tumutukoy sa hukbo ng Benjamin.
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: ng mga nagmula sa mga lungsod
  rationale: Pinananatili ang maigsi at di-tiyak na pagkakabuo ng Hebreo, nang hindi tahasang ipinapalagay sa pangunahing teksto na sila ay mula sa mga lungsod mismo o sa mga puwestong-tambang malapit sa mga iyon.
- source_word: מַשְׁחִיתִים
  choice: nililipol
  rationale: Sa kontekstong militar, ang participle ng שׁחת ay tumutukoy sa mapangwasak na pagpatay. Ang “nililipol” ay natural, mariin, at angkop sa patuloy na kilos.
- source_word: אוֹתוֹ
  choice: sila
  rationale: Bagaman isahan ang panghalip sa Hebreo, kolektibo ang tinutukoy nito—ang puwersa ng Benjamin—kaya mas malinaw sa Tagalog ang maramihang “sila.”
- source_word: בְּתוֹכוֹ
  choice: sa gitna nila
  rationale: Ang hulaping isahan ay kolektibo rin. Pinananatili ng parirala ang posibleng taktikal na diwa na nagaganap ang paglipol sa loob o sa kalagitnaan ng kanilang hanay.
