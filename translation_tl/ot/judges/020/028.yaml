    issue: Hindi likas ang “Umahon kayo” bilang utos sa paglusob o paggalaw sa labanan.
    rationale: Ang עֲלוּ ay literal na “umakyat” at maaari ring mangahulugang sumulong sa kontekstong militar. Ang “Umakyat kayo” ay likas na Filipino at hindi nagdaragdag ng interpretasyong taktikal.
  - severity: low
    issue: Maaaring malabo ang “mga anak ni Benjamin na kapatid ko.”
    rationale: Ang walang kuwit ay maaaring magpahiwatig na ang pariralang “kapatid ko” ay direktang naglalarawan sa plural na “mga anak.” Ang kuwit at “aking kapatid” ay mas malinaw na nagpapanatili ng Hebreong wikang pangkamag-anak nang hindi ginagawang plural ang “kapatid.”},{
