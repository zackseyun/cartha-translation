  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ֠/פִינְחָס בֶּן אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן עֹמֵ֣ד לְ/פָנָ֗י/ו בַּ/יָּמִ֣ים הָ/הֵם֮ לֵ/אמֹר֒ הַ/אוֹסִ֨ף ע֜וֹד לָ/צֵ֧את לַ/מִּלְחָמָ֛ה עִם בְּנֵֽי בִנְיָמִ֥ן אָחִ֖/י אִם אֶחְדָּ֑ל וַ/יֹּ֤אמֶר יְהוָה֙ עֲל֔וּ כִּ֥י מָחָ֖ר אֶתְּנֶ֥/נּוּ בְ/יָדֶֽ/ךָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: tl
  text: At si Finehas, na anak ni Eleazar, anak ni Aaron, ay nakatayo sa harap nito noong mga araw na iyon.[a] Sinabi niya, “Muli pa ba akong lalabas upang makipagdigma laban sa mga anak ni Benjamin, na aking kapatid,[b] o titigil na ako?” Sinabi ni Yahweh, “Umakyat kayo, sapagkat bukas ay ibibigay ko siya sa iyong kamay.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatayo sa harap niya,” kung si Yahweh, sa halip na ang kaban na binanggit sa naunang talata, ang tinutukoy ng panghalip.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “mga anak ni Benjamin, aking kapatid.” Pinananatili nito ang wika ng pagkakamag-anak kahit nagaganap ang digmaang sibil.
    reason: cultural_note
  - marker: c
    text: Maaari ring “ipapasailalim ko siya sa kapangyarihan mo.” Ang isahang “siya” ay malamang na tumutukoy sa lipi ni Benjamin bilang isang kabuuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: si Finehas na anak ni Eleazar at apo ni Aaron
  rationale: Pinananatili ang dalawang salinlahi ng angkang saserdote, habang ginagamit ang likas na Tagalog na “apo ni Aaron” upang luminaw ang ugnayan.
- source_word: עֹמֵד לְפָנָיו
  choice: nakatayo sa harap nito
  rationale: Ang participle ay inilalarawang patuloy na kalagayan noong panahong iyon. Ang “nito” ay tumutukoy sa kaban na binanggit sa naunang talata, ngunit inilalahad sa talababa ang tunay na posibilidad na si Yahweh ang tinutukoy.
- source_word: בַּיָּמִים הָהֵם
  choice: Noong mga araw na iyon
  rationale: Likas at malapit na katumbas ng karaniwang Hebreong panandang pangpanahon.
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: Muli pa ba akong lalabas upang makipagdigma
  rationale: Ipinahahayag ng הוסיף עוד ang muling paggawa matapos ang mga naunang labanan; pinananatili rin ang larawan ng “paglabas” sa digmaan.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: sa mga anak ni Benjamin na kapatid ko
  rationale: Sa konteksto ng digmaan, ang עִם ay tumutukoy sa pakikipaglaban sa kalaban. Pinananatili ang “mga anak ni Benjamin” at “kapatid ko” upang manatili ang masakit na wikang pampamilya sa gitna ng digmaang sibil.
- source_word: אִם אֶחְדָּל
  choice: o titigil na ako?
  rationale: Malinaw at makabagong Tagalog para sa tanong kung dapat nang huminto o umiwas sa pagpapatuloy.
- source_word: עֲלוּ
  choice: Umahon kayo
  rationale: Maramihan ang utos sa Hebreo. Ang “umahon” ay nagpapanatili sa karaniwang larawan ng pag-akyat o pagsulong sa labanan.
- source_word: כִּי מָחָר אֶתְּנֶנּוּ בְיָדֶךָ
  choice: sapagkat bukas ay ibibigay ko siya sa iyong kamay
  rationale: Pinananatili ang isahang “siya” at “iyong kamay” ng Hebreo, pati ang idyomang nagsasaad ng pagpapasailalim sa kapangyarihan ng Israel.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa לְפָנָיו
  choice: Ang kaban ng tipan na binanggit sa naunang talata, kaya “sa harap nito.”
  alternative: Si Yahweh, kaya “sa harap niya.”
  rationale: Ang kaban ang pinakamalapit na tahasang binanggit na bagay sa konteksto, ngunit maaari ring tukuyin ng panghalip si Yahweh. Hindi nilulutas nang tahimik ang tunay na kalabuan; inilalahad ang alternatibo sa talababa.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang transliterasyong “Yahweh” upang katawanin ang personal na pangalan sa tekstong Hebreo nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
- issue: Pagbabago ng bilang sa utos at pangako
  choice: “Umahon kayo” ngunit “sa iyong kamay”
  alternative: Gawing pare-parehong maramihan ang mga panghalip sa Tagalog
  rationale: Maramihan ang עֲלוּ ngunit isahan ang hulapi sa בְיָדֶךָ. Pinananatili ang tensiyong gramatikal sa halip na pakinisin ito, yamang maaaring kinakausap ang buong Israel at pagkatapos ay ituring itong isang kolektibong kausap.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Iniwasan ang labis na arkaikong pananalita, ngunit pinanatili ang mahahalagang larawang Hebreo gaya ng “umahon” at “sa iyong kamay,” pati ang mga pagbabago sa isahan at maramihan.
