translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang personal na diwa ng אֹרְבִים bilang mga taong tatambang, at nilinaw sa talababa ang literal na saklaw ng pariralang אֶל ... סָבִיב.
