  text: So Israel set men in ambush around Gibeah[a].
translation:
  language: tl
  text: Kaya naglagay ang Israel ng mga mananambang sa palibot ng Gibea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “naglagay ng mga mananambang patungo sa/palibot ng Gibea.” Tumutukoy ang pahayag sa pagpuwesto ng pangkat na tatambang sa paligid ng lungsod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: naglagay
  rationale: Ang שׂוּם ay nangangahulugang maglagay o magpuwesto. Ang “naglagay” ay tuwiran at natural, at hindi nito dinaragdagan ang tiyak na paraang hindi naman binanggit sa Hebreo.
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Tumutukoy ito nang kolektibo sa hukbo o bayan ng Israel; pinananatili ang karaniwang pangalang “Israel.”
- source_word: אֹרְבִים
  choice: mga lalaking tatambang
  rationale: Ang participle mula sa ארב ay tumutukoy sa mga taong nag-aabang nang palihim upang sumalakay, hindi lamang sa abstraktong planong pananambang. Ang “mga lalaking tatambang” ay malinaw at likas sa modernong Filipino.
- source_word: אֶל ... סָבִיב
  choice: sa palibot ng
  rationale: Bagaman karaniwang nangangahulugang “patungo sa” ang אֶל, kasama ng סָבִיב at sa kontekstong militar ay inilalarawan nito ang pagpuwesto ng pangkat sa paligid ng Gibea.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Pangalan ito ng lugar. Ginamit ang anyong “Gibea,” na madaling basahin sa Filipino, at hindi isinalin ang artikulong Hebreo bilang hiwalay na pantukoy.
