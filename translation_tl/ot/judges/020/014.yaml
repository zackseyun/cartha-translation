  text: וַ/יֵּאָסְפ֧וּ בְנֵֽי בִנְיָמִ֛ן מִן הֶ/עָרִ֖ים הַ/גִּבְעָ֑תָ/ה לָ/צֵ֥את לַ/מִּלְחָמָ֖ה עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/014.yaml
  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: tl
  text: At nagtipon ang mga anak ni Benjamin mula sa mga lungsod patungong Gibea upang lumabas upang makidigma laban sa mga anak ni Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kasama ng mga anak ni Israel”; sa konteksto ng labanan, ang diwa nito ay “laban sa mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ang mga Benjaminita … laban sa mga Israelita.” Pinananatili sa pangunahing teksto ang Hebreong idyomang pantribo na “mga anak ni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: nagtipon
  rationale: Ang Niphal na anyo ng אסף ay tumutukoy sa sama-samang pagtitipon. Natural sa makabagong Tagalog ang “nagtipon” at hindi nito ipinipilit kung kusang nagtipon o tinipon sila.
- source_word: בְנֵי בִנְיָמִן
  choice: ang mga anak ni Benjamin
  rationale: Pinananatili nito ang Hebreong idyomang pantribo at pampamilya, habang malinaw pa rin sa Tagalog.
- source_word: מִן הֶעָרִים
  choice: mula sa mga lungsod
  rationale: Ang מִן ay nagsasaad ng pinagmulan. Ang “mga lungsod” ay tuwirang katumbas ng plural na הֶעָרִים, bagaman maaari ring sabihing “mga bayan.”
- source_word: הַגִּבְעָתָה
  choice: patungong Gibea
  rationale: Ang hulaping directional he ay nagpapahayag ng pagkilos tungo sa Gibea; malinaw itong naihahayag ng “patungong.”
- source_word: לָצֵאת לַמִּלְחָמָה
  choice: upang lumabas sa labanan
  rationale: Pinananatili ng “lumabas” ang literal na diwa ng יצא, at ipinahahayag ng “sa labanan” ang kontekstong militar ng מִלְחָמָה nang hindi dinaragdagan ng ideyang “nagmartsa.”
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: laban sa mga anak ni Israel
  rationale: 'Karaniwang “kasama” ang עִם, ngunit sa konteksto ng pakikipaglaban ay adversative ang diwa nito: “laban sa.” Pinananatili rin ang Hebreong idyomang “mga anak ni Israel.”'
