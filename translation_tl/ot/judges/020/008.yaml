  rationale: Pinananatili ang Hebreong idyoma at ang diin nito sa lubos na pagkakaisa.
- source_word: לֹא נֵלֵךְ אִישׁ לְאָהֳלוֹ
  choice: Walang sinuman sa atin ang pupunta sa kanyang tolda
  rationale: Ipinahahayag sa natural na Filipino ang distributibong אִישׁ at pinananatili ang literal na 'tolda.'
- source_word: וְלֹא נָסוּר אִישׁ לְבֵיתוֹ
  choice: at walang sinuman sa atin ang uuwi sa kanyang bahay
  rationale: Sa konteksto, ang סוּר אֶל ay paglihis o pagpunta patungo sa tahanan; 'uuwi' ang malinaw at likas na katumbas sa Filipino.
