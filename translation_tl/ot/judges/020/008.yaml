lexical_decisions:
- source_word: וַיָּקָם
  choice: At tumindig
  rationale: Tuwirang inilalarawan ang sama-samang pagtayo at pagkilos ng bayan; natural at marangal sa modernong Filipino.
- source_word: כָּל־הָעָם
  choice: ang buong bayan
  rationale: Ang עָם ay tumutukoy sa nagkakatipong sambayanan, hindi lamang sa isang di-tiyak na grupo ng mga tao.
- source_word: כְּאִישׁ אֶחָד
