translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang tahasang “ginahasa” dahil malinaw ang seksuwal na karahasan sa konteksto, sa halip na isang malabong eupemismo.
