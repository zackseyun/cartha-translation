base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: tl
  text: Ang mga lalaki ng Gibea ay bumangon laban sa akin at pinalibutan ang bahay sa gabi. Balak nila akong patayin, at ginahasa nila ang aking konkubina[a], at namatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “konkubina” ay babaeng may kinikilalang ugnayang pagsasama sa isang lalaki ngunit karaniwang may mas mababang katayuang panlipunan kaysa sa pangunahing asawa.
    reason: cultural_clarification
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: mga lalaki ng Gibea
  rationale: Sa konstruksiyong ito, ang בַּעֲלֵי ay tumutukoy sa mga lalaking naninirahan o pangunahing lalaki ng bayan, hindi sa mga pormal na panginoon o may-ari.
- source_word: וַיָּקֻמוּ עָלַי
  choice: bumangon laban sa akin
  rationale: Pinananatili nito ang larawang pandiwa ng קום על at malinaw na ipinahahayag ang kanilang pagkapoot.
- source_word: וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת
  choice: pinalibutan ang bahay
  rationale: Likas na salin ito ng pag-ikot o pagkubkob sa bahay; hindi kailangang ulitin ang 'sa paligid ko' sa Tagalog.
- source_word: לָיְלָה
  choice: nang gabing iyon
  rationale: Ipinahahayag ang panahong naganap ang pagkubkob sa natural na modernong Tagalog.
- source_word: דִּמּוּ לַהֲרֹג
  choice: balak nila akong patayin
  rationale: Ang דמה sa kontekstong ito ay nagpapahayag ng hangarin o balak, hindi lamang ng pag-iisip.
- source_word: פִּילַגְשִׁי
  choice: aking kinakasama
  rationale: Ang 'kinakasama' ay madaling maunawaan sa modernong Tagalog at nagpapahiwatig ng relasyong hindi kapantay ng ganap na asawa; nililinaw sa talababa ang tiyak na katayuang panlipunan.
- source_word: עִנּוּ
  choice: ginahasa
  rationale: Bagaman maaaring mangahulugan ang piel ng ענה ng pagpapahirap, paghamak, o paglapastangan, malinaw sa konteksto ng salaysay na seksuwal na panghahalay ang tinutukoy.
- source_word: וַתָּמֹת
  choice: at namatay siya
  rationale: Pinananatili ang payak na pagkakasunod ng mga pangyayari sa Hebreo nang hindi nagdaragdag ng tahasang ugnayang sanhi.
