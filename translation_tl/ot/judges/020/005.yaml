  naturalness: Natural ang pangungusap, ngunit mas idiomatiko ang “sa gabi” kaysa “nang gabing iyon,” dahil walang pantukoy na “iyon” sa Hebreo. Ang “konkubina” ay mas tiyak at angkop sa historikal na rehistro ng salaysay.
  terminology: Ang “Gibea,” “bumangon laban sa akin,” “balak nila akong patayin,” at “ginahasa” ay angkop. Pinalitan ang “kinakasama” ng “konkubina” upang hindi maipantay sa isang kontemporaryong di-pormal na pagsasama ang terminong historikal na פילגש.
