base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: tl
  text: Pagkatapos, umakyat ang mga anak ni Israel at umiyak sa harap ni Yahweh hanggang gabi. Sumangguni sila kay Yahweh at sinabi, “Lalapit pa ba ako upang makipaglaban sa mga anak ng aking kapatid na si Benjamin?” Sinabi ni Yahweh, “Umakyat kayo laban sa kanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: umahon
  rationale: Pinananatili ang direksiyonal na diwa ng עלה nang hindi tinutukoy kung sa santuwaryo o sa mas mataas na lugar sila pumunta.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilya at pangkalahatang katawagan ng Hebreo sa natural na Tagalog.
- source_word: וַיִּבְכּוּ
  choice: umiyak
  rationale: Likas at malinaw na katumbas ng pag-iyak o pagtangis sa kontekstong ito.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Malapit sa literal na anyo at likas sa Tagalog bilang paglalarawan ng pagharap sa presensiya ng Diyos.
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: sumangguni sila kay Yahweh
  rationale: Ipinahihiwatig ng שׁאל na may ב ang paghingi ng pasiya o patnubay mula sa Diyos, hindi lamang pangkaraniwang pagtatanong.
- source_word: הַאוֹסִיף
  choice: Lalapit pa ba
  rationale: Ang יסף ay maaaring tumukoy sa pagpapatuloy o muling paggawa; ang “pa ba” ay natural at sadyang hindi nagpapasiya nang lubos sa dalawang diwa.
- source_word: לָגֶשֶׁת לַמִּלְחָמָה
  choice: lalapit ... upang makipaglaban
  rationale: Pinananatili ang larawan ng paglapit sa נגשׁ at nililinaw ng kasunod na parirala ang layuning militar.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: sa mga anak ni Benjamin
  rationale: Sa pariralang Tagalog na “makipaglaban sa,” natural na ipinahahayag ang pakikipagsagupa kahit ang עִם ay pormal na “kasama/kasabay.”
- source_word: אָחִי
  choice: na aking kapatid
  rationale: Pinananatili ang isahang unang panauhan at ang masidhing pagkilala kay Benjamin bilang kapatid.
- source_word: עֲלוּ אֵלָיו
  choice: Umahon kayo laban sa kanya
  rationale: Pinananatili ang direksiyonal na pandiwa at malinaw na ipinahahayag ang salungatang militar sa konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Pagkakaiba ng maramihang nagsasalita at isahang אָחִי
  choice: “ako” na ipinahiwatig sa tanong at “aking kapatid”
  alternative: “kami” at “aming kapatid”
  rationale: Bagaman maramihan ang pangkat na sumasangguni, isahan ang anyong Hebreo sa אָחִי at maaaring magsalita ang Israel bilang isang kolektibong persona. Hindi ito pinapantay sa maramihan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “umahon” upang mapanatili ang kilos na paitaas, “sumangguni” para sa orakular na pagtatanong, at “makipaglaban sa” bilang natural na pariralang militar. Walang talababa dahil naipahahayag ng “pa ba” ang tunay na kalabuan sa pagitan ng pagpapatuloy at pag-uulit nang hindi mabigat ang pangungusap.
