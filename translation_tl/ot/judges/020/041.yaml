  text: וְ/אִ֤ישׁ יִשְׂרָאֵל֙ הָפַ֔ךְ וַ/יִּבָּהֵ֖ל אִ֣ישׁ בִּנְיָמִ֑ן כִּ֣י רָאָ֔ה כִּֽי נָגְעָ֥ה עָלָ֖י/ו הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: tl
  text: Pagkatapos, humarap ang mga Israelita[a], at nasindak ang mga Benjaminita, sapagkat nakita nilang sumapit na sa kanila ang kapahamakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pang-isahan ang mga pananalitang “lalaki ng Israel,” “lalaki ng Benjamin,” “nakita niya,” at “sa kanya,” ngunit kolektibo itong tumutukoy sa magkalabang hukbo. Kaya pangmaramihan ang ginamit sa salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: Pagkatapos, ... ang mga Israelita
  rationale: Ang pang-isahang אִישׁ ay kolektibong tumutukoy sa hukbo ng Israel. Ang “Pagkatapos” ay likas na naghahayag ng kasunod na pangyayari sa salaysay.
- source_word: הָפַךְ
  choice: humarap
  rationale: Sa konteksto ng labanan, tumutukoy ito sa taktikal na pag-ikot upang harapin ang kalaban. Pinananatili nitong maikli ang pahayag nang hindi idinaragdag ang mas tiyak na “bumalik.”
- source_word: וַ/יִּבָּהֵל
  choice: nasindak
  rationale: Ipinahahayag ng בהל ang bigla at matinding takot o pangamba; natural at marangal sa Filipino ang “nasindak.”
- source_word: אִישׁ בִּנְיָמִן
  choice: ang mga Benjaminita
  rationale: Ang pang-isahang anyo ay kolektibong tumutukoy sa mga mandirigma ng Benjamin; likas sa Filipino ang pangmaramihang “mga Benjaminita.”
- source_word: כִּי רָאָה
  choice: sapagkat nakita nila
  rationale: Ang pandiwang pang-isahan ay umaayon sa kolektibong paksa. Ginamit ang pangmaramihang Filipino upang maging malinaw at natural.
- source_word: כִּי
  choice: -ng
  rationale: Ang ikalawang כִּי ay nagpapakilala sa nilalaman ng kanilang nakita; natural itong ipinapahayag sa Filipino sa pamamagitan ng pang-angkop matapos ang “nakita nila.”
- source_word: נָגְעָה עָלָיו
  choice: sumapit na sa kanila
  rationale: Ang pariralang ito ay nagsasaad na dumating o bumagsak sa kanila ang kalamidad. Malapit sa larawan ng Hebreo at natural ang “sumapit ... sa kanila”; ang pang-isahang hulapi ay inunawang kolektibo.
- source_word: הָרָעָה
  choice: kapahamakan
  rationale: Dito, ang רָעָה ay hindi moral na kasamaan kundi mapaminsalang kalamidad sa labanan; malinaw itong naihahayag ng “kapahamakan.”
