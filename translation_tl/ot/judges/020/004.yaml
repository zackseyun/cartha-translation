  source_fidelity: Kailangang itama ang "asawang kinakasama". Ang פִּילֶגֶשׁ ay tumutukoy sa konkubina/secondary wife sa sinaunang kaayusan; ang kasalukuyang parirala ay maaaring mangahulugang live-in spouse at hindi sapat na natatangi ang kahulugan. Mas malapit din sa pagdidiin ng Hebreo ang "Pumunta ako at ang aking konkubina" kaysa sa sama-samang "Pumunta kami."
  naturalness: Natural at marangal ang karamihan ng draft. Ang "konkubina" ay isang nauunawaang, pampanitikan, at wastong katawagan sa modernong Filipino para sa historikal na institusyong tinutukoy rito. Ang inayos na pangungusap ay malinaw na nananatiling unang panauhan at hindi nagpapasok ng modernong pagpapakahulugan sa relasyon.
  terminology: Panatilihin ang "Levita," "Gibea," at "Benjamin." Ang "pinaslang" ay angkop para sa passive participle na הַנִּרְצָחָה at pinananatili ang bigat ng marahas na pagpatay. Ang "na sakop ng Benjamin" ay katanggap-tanggap, na may talababa para sa alternatibong lokatibong pagbasa.
