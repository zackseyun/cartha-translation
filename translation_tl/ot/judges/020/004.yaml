base_translation:
  language: en
  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: tl
  text: Sumagot ang Levita, ang asawa ng babaeng pinaslang, at sinabi, “Pumunta ako at ang aking konkubina sa Gibea, na sakop ng Benjamin[a], upang magpalipas ng gabi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa teritoryo ng Benjamin.”
    reason: Maaaring ipahayag ng אֲשֶׁר לְבִנְיָמִן ang pag-aari o pagkakaugnay sa Benjamin, o ang lokasyon sa teritoryo nito.
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang pananalitang pasalaysay na nagpapakilala ng tugon; pinananatili ang Hebreong idyoma kahit walang tahasang tanong sa naunang konteksto.
- source_word: הָאִישׁ הַלֵּוִי
  choice: ang Levita
  rationale: Likas at maikling tawag sa Filipino para sa lalaking kabilang sa mga Levita.
- source_word: אִישׁ הָאִשָּׁה
  choice: ang asawa ng babae
  rationale: Bagaman literal na ‘lalaki ng babae,’ ang parirala ay tumutukoy sa kaniyang lalaking asawa o kapareha; ‘asawa’ ang natural na katumbas sa konteksto.
- source_word: הַנִּרְצָחָה
  choice: pinaslang
  rationale: Ipinahahayag ang marahas at kriminal na diwa ng רצח nang mas tiyak kaysa sa pangkalahatang ‘pinatay.’
- source_word: הַגִּבְעָתָה
  choice: sa Gibea
  rationale: Ang hulaping paturol ng direksiyon ay nagpapahiwatig ng pagpunta sa lugar; natural itong ipinahahayag ng ‘sa’ kasunod ng pandiwang ‘pumunta.’
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: na sakop ng Benjamin
  rationale: Ipinapakita ang kaugnayan ng Gibea sa lipi o teritoryo ng Benjamin nang hindi lubusang isinasara ang posibilidad na ang diin ay lokasyon.
- source_word: בָּאתִי אֲנִי וּפִילַגְשִׁי
  choice: Pumunta kami ng aking asawang kinakasama
  rationale: Natural na Filipino ang ‘kami ng…’ para sa literal na ‘ako at ang aking…’. Ang ‘asawang kinakasama’ ay naghahatid ng relasyong פילגש nang hindi gumagamit ng ‘kalunya,’ na sa makabagong Filipino ay karaniwang nagpapahiwatig ng pangangalunya.
- source_word: לָלוּן
  choice: upang doon magpalipas ng gabi
  rationale: Malinaw at kasalukuyang Filipino para sa panunuluyan nang magdamag.
theological_decisions:
- issue: Katayuan ng פילגש
  choice: asawang kinakasama
  alternative: konkubina; pangalawang asawa; kalunya
  rationale: Hindi ganap na katumbas ng alinman sa mga modernong katawagang Filipino ang sinaunang relasyong ito. Iniiwasan ng piniling anyo ang di-kinakailangang pahiwatig ng pangangalunya o ang tiyak na palagay na siya ay pangalawang asawa, habang kinikilala ang relasyong pangmag-asawa sa konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘pinaslang’ upang mapanatili ang bigat ng salaysay, at iniwasan ang ‘kalunya’ dahil mas makitid at mapanghusga ang karaniwang kahulugan nito ngayon.
