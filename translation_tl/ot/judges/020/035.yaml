- from: At nilupig ni Yahweh ang Benjamin sa harap ng Israel,[a] at nang araw na iyon ay pinuksa ng mga anak ni Israel ang 25,100 lalaki ng Benjamin,[b] na pawang mga humuhugot ng espada.
  to: At nilupig ni Yahweh ang tribo ni Benjamin sa harap ng Israel,[a] at nang araw na iyon ay pinuksa ng mga anak ni Israel ang 25,100 lalaking mula sa Benjamin,[b] na pawang mga humuhugot ng espada.
  rationale: Nilinaw ang paggamit ng Benjamin bilang pangalang pangtribo at ang kaugnayan ng mga nabilang na lalaki sa tribong Benjamin. Hindi binago ang diwa ng tagumpay sa labanan, ang banal at pantaong pagkilos, ang bilang, o ang paglalarawan sa mga mandirigma.
