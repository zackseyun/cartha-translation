  text: וַ/יִּגֹּ֨ף יְהוָ֥ה אֶֽת בִּנְיָמִן֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּשְׁחִיתוּ֩ בְנֵ֨י יִשְׂרָאֵ֤ל בְּ/בִנְיָמִן֙ בַּ/יּ֣וֹם הַ/ה֔וּא עֶשְׂרִ֨ים וַ/חֲמִשָּׁ֥ה אֶ֛לֶף וּ/מֵאָ֖ה אִ֑ישׁ כָּל אֵ֖לֶּה שֹׁ֥לֵף חָֽרֶב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: tl
  text: At nilupig ni Yahweh ang tribo ni Benjamin sa harap ng Israel,[a] at nang araw na iyon ay pinuksa ng mga anak ni Israel ang 25,100 lalaking mula sa Benjamin,[b] na pawang mga humuhugot ng espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinabagsak ni Yahweh ang tribo ni Benjamin sa harap ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: nilupig
  rationale: Sa konteksto ng digmaan, ang נָגַף ay tumutukoy sa paghampas o paggapi. Natural sa modernong Tagalog ang “nilupig” at pinananatili nito ang diwang militar nang hindi ipinapalagay na ang bawat isa ay tuwirang pinatay sa unang sugnay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: sa harap ng Israel
  rationale: Pinananatili ang Hebreong idyoma na maaari ring mangahulugang natalo ang Benjamin sa pakikipaglaban sa Israel.
- source_word: וַיַּשְׁחִיתוּ
  choice: pinuksa
  rationale: Ang Hiphil ng שׁחת ay may diwang winasak o nilipol; sa ulat ng labanan, ang “pinuksa” ay malinaw na nagpapahayag ng nakamamatay na pagkawasak.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pormal na pinananatili ang “mga anak ni Israel,” na angkop din sa konteksto ng mga lalaking mandirigma.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: 25,100 lalaki
  rationale: Tuwirang paglalahad ng bilang at ng אִישׁ bilang mga lalaking mandirigma.
- source_word: כָּל אֵלֶּה שֹׁלֵף חָרֶב
  choice: na pawang mga humuhugot ng espada
  rationale: Pinananatili ang larawan ng literal na “humuhugot ng espada,” isang idyoma para sa mga armadong mandirigma.
theological_decisions:
- issue: Pagkilos ng Diyos at ng tao sa kinalabasan ng labanan
  choice: Tahasan kapwa ang pagkilos ni Yahweh sa paggapi sa Benjamin at ang pagkilos ng mga anak ni Israel sa pagpuksa sa mga mandirigma nito.
  alternative: Idiing Diyos lamang o mga mandirigma lamang ang sanhi ng tagumpay.
  rationale: Magkasunod na inilalahad ng Hebreo ang banal at pantaong pagkilos nang hindi pinagsasanib o ipinapaliwanag ang ugnayan ng mga ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ang Benjamin” bilang kolektibong tawag sa tribo, at pinanatili ang pangalan na Yahweh. Ang mga bilang ay nasa numerals para sa mabilis na pagbasa.
