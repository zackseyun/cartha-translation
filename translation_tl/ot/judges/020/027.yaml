  text: וַ/יִּשְׁאֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּֽ/יהוָ֑ה וְ/שָׁ֗ם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים בַּ/יָּמִ֖ים הָ/הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: tl
  text: At sumangguni ang mga anak ni Israel[a] kay Yahweh—sapagkat naroon noong mga araw na iyon ang kaban ng tipan ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga Israelita.” Literal sa Hebreo, “ang mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang sugnay na “sapagkat naroon noong mga araw na iyon ang kaban ng tipan ng Diyos” ay nagpapaliwanag sa tagpuan ng kanilang pagsangguni.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: At sumangguni
  rationale: Sa konstruksiyong שׁאל ב na sinusundan ng pangalan ng Diyos, ang diwa ay humingi ng patnubay o kasagutan mula sa Diyos, hindi basta magtanong lamang. Likas sa makabagong Tagalog ang “sumangguni kay” para sa pormal at panrelihiyong diwang ito.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang konkretong Hebreong pananalitang “mga anak ni Israel,” na dito ay tumutukoy sa sambayanan o mga inapo ni Israel. Ibinibigay sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ang ב kasunod ng שׁאל ay likas na naipapahayag sa Tagalog bilang “sumangguni kay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: וְשָׁם
  choice: —sapagkat naroon
  rationale: Ang sugnay ay nagsisilbing paliwanag sa tagpuan ng kanilang pagsangguni. Ang gitling at “sapagkat” ay malinaw na naghahayag ng ugnayang ito sa natural na Tagalog.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: ang kaban ng tipan ng Diyos
  rationale: Malapit nitong pinananatili ang buong construct chain ng Hebreo habang malinaw at pamilyar sa Tagalog na biblikal na gamit.
- source_word: בַּיָּמִים הָהֵם
  choice: noong mga araw na iyon
  rationale: Ito ang natural at tapat na katumbas ng karaniwang Hebreong idyomang pangpanahon.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng interpretasyong pangdenominasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sumangguni” upang ihatid ang pormal na paghingi ng sagot o patnubay mula sa Diyos; pinanatili ang “mga anak ni Israel” sa pangunahing teksto at ipinaliwanag ang idyomatikong alternatibo sa talababa.
