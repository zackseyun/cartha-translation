  verdict: revise
  source_fidelity: Ang draft ay wasto sa pangunahing bilang, paghihiwalay ng kontingente ng Gibea, at kahulugang militar ng dalawang anyo ng פקד. Gayunman, ang “tinipon at binilang” ay nagdaragdag ng malinaw na ideya ng pagtitipon na hindi kailangang igiit ng Hebreo, at ang “Mula sa kanila” ay may di-gaanong malinaw na pantukoy. Ang rebisyon ay nagpapanatili ng pag-uulit ng pandiwa at mas tuwirang inilalahad ang hiwalay na bilang ng mga taga-Gibea.
  naturalness: Mas likas ang “Noong araw na iyon” at ang dalawang sugnay na may malinaw na paksa. Ang “nakabunot ng tabak” ay mas malapit sa idyomang Hebreo kaysa “humahawak ng tabak,” na maaari lamang mangahulugang may tangan silang sandata.
  terminology: Pinanatili ang “mga anak ni Benjamin” upang maipakita ang pantribo/pampamilyang idyoma ng Hebreo. Ginamit ang “binilang para sa pakikidigma” para sa military muster, at “piling lalaki” para sa בָּחוּר, na may talababa para sa posibleng kahulugang may kinalaman sa edad.
