base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: tl
  text: 'Noong araw na iyon, binilang para sa pakikidigma ang mga anak ni Benjamin mula sa mga lungsod: dalawampu''t anim na libong lalaking nakabunot ng tabak[a]. Bukod sa mga naninirahan sa Gibea, pitong daang piling lalaki[b] ang binilang para sa pakikidigma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may hawak na tabak”; idyomang Hebreo ito para sa mga lalaking nasasandatahan at handang makipagdigma.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “kabataang lalaki,” ngunit sa kontekstong ito ay malamang na tumutukoy sa mga piling mandirigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: tinipon at binilang para sa pakikipagdigma
  rationale: Ipinahahayag ng hitpael ng פקד sa kontekstong ito ang pagbilang o pagpapatala ng mga tauhan para sa paglilingkod militar. Pinananatili rin ang pag-uulit sa dalawang paglitaw ng pandiwa.
- source_word: בְנֵי בִנְיָמִן
  choice: ang mga anak ni Benjamin
  rationale: Pinananatili ang pantribo at pampamilyang idyoma ng Hebreo sa paraang malinaw at likas sa Tagalog.
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw na iyon
  rationale: Likas na temporal na parirala sa Tagalog na nagpapanatili sa demonstratibong diin.
- source_word: מֵהֶעָרִים
  choice: mula sa mga lungsod
  rationale: Tinutukoy ang mga lugar na pinagmulan ng mga tauhang binilang.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: dalawampu't anim na libong lalaki
  rationale: Tuwirang inililipat ang bilang at ang pangkalahatang salitang אִישׁ nang hindi inuulit ang impormasyong militar na nasa kasunod na parirala.
- source_word: שֹׁלֵף חָרֶב
  choice: humahawak ng tabak
  rationale: Pinananatili ang kongkretong larawan ng mga lalaking nasasandatahan at handang makipaglaban, habang iniiwasan ang Tagalog na maaaring magpahiwatig lamang ng mismong sandali ng pagbunot.
- source_word: לְבַד
  choice: bukod pa sa
  rationale: Malinaw na ipinakikitang hiwalay at idinaragdag sa naunang bilang ang pangkat mula sa Gibea.
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: mga naninirahan sa Gibea
  rationale: Likas at malinaw na salin ng participial na parirala para sa mga residente ng lugar.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: pitong daang lalaki
  rationale: Tuwirang salin ng bilang at ng אִישׁ.
- source_word: בָּחוּר
  choice: piling
  rationale: Sa kontekstong militar, malamang na tumutukoy sa mga pinili o pinakamahusay na mandirigma, bagaman maaari rin itong tumukoy sa kabataang lalaki; pinananatili sa talababa ang leksikal na posibilidad.
