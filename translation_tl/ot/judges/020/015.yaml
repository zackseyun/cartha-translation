  to: 'Noong araw na iyon, binilang para sa pakikidigma ang mga anak ni Benjamin mula sa mga lungsod: dalawampu''t anim na libong lalaking nakabunot ng tabak[a]. Bukod sa mga naninirahan sa Gibea, pitong daang piling lalaki[b] ang binilang para sa pakikidigma.'
