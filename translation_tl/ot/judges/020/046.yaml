  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: tl
  text: Kaya ang lahat ng napatay mula sa lipi ni Benjamin nang araw na iyon ay dalawampu't limang libong lalaking may hawak na tabak; lahat sila ay magigiting na mandirigma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Kaya ... ay
  rationale: Ipinakikita ng anyong pasalaysay ang buod o kinalabasan ng naunang ulat. Ang “Kaya” ay likas sa Filipino at malinaw na nag-uugnay sa naunang pangyayari.
- source_word: כָל הַנֹּפְלִים
  choice: ang lahat ng napatay
  rationale: Ang substantibong participle ng נפל ay tumutukoy sa mga nasawi sa labanan. Mas tiyak sa konteksto ang “napatay” kaysa sa literal na “nabuwal.”
- source_word: מִבִּנְיָמִן
  choice: sa lipi ni Benjamin
  rationale: Ipinahihiwatig ng מן ang pagkamiyembro o pinagmulan. Nililinaw ng “lipi” ang tinutukoy sa konteksto nang hindi binabago ang kahulugan.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: dalawampu't limang libong lalaki
  rationale: Tuwirang inililipat ang bilang at ang pangngalang אִישׁ, nang hindi nagdaragdag ng katawagang militar na nasa kasunod na mga parirala.
- source_word: שֹׁלֵף חֶרֶב
  choice: mga lalaking humahawak ng tabak
  rationale: Ang literal na larawan ay paghubog o paglabas ng tabak, ngunit ginagamit ang parirala bilang katawagan sa mga lalaking armado at nakikipaglaban. Pinananatili ng “humahawak ng tabak” ang larawan at likas itong mabasa sa Filipino.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Likas na panandang temporal sa Filipino na tumpak na tumutukoy sa nasabing araw.
- source_word: אֶת כָּל אֵלֶּה
  choice: lahat sila
  rationale: Muling tinutukoy at binibigyang-diin ng parirala ang buong bilang na kababanggit lamang. Ang “lahat sila” ang likas na resumptibong anyo sa Filipino.
- source_word: אַנְשֵׁי חָיִל
  choice: magigiting na mandirigma
  rationale: Sa kontekstong militar, ang חַיִל ay nagpapahiwatig ng tapang, kakayahan, at lakas. Malinaw at natural na inilalahad ng “magigiting na mandirigma” ang gamit dito.
