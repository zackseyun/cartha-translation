revisions:
- from: Pagkatapos, bumaling sila at tumakas patungo sa ilang, sa Bato ng Rimon. Sa mga pangunahing daan, pinuksa nila[a] ang limang libong lalaki sa mga ito. Hinabol nila ang mga ito hanggang sa Gidom[b] at pinatay ang dalawang libong lalaki sa kanila.
  to: Pagkatapos, bumaling sila at tumakas patungo sa ilang, sa Bato ng Rimon. Sa mga pangunahing daan, pinatay nila[a] ang limang libong lalaki mula sa kanila. Hinabol nila ang mga ito hanggang sa Gidom[b] at pinatay ang dalawang libong lalaki mula sa kanila.
