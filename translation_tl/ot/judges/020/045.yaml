base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: tl
  text: Pagkatapos, bumaling sila at tumakas patungo sa ilang, sa Bato ng Rimon. Sa mga pangunahing daan, pinatay nila[a] ang limang libong lalaki mula sa kanila. Hinabol nila ang mga ito hanggang sa Gidom[b] at pinatay ang dalawang libong lalaki mula sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “namulot sa kanya”—isang idyoma rito para sa pagpatay o isa-isang pagpatay sa mga natitirang tumatakas.
    reason: lexical_alternative
  - marker: b
    text: 'Gumagamit dito ang Hebreo ng mga hulaping panghalip na isahan sa mga pariralang may diwang “habol sa kanya” at “mula sa kanya,” ngunit kolektibo ang tinutukoy nito: ang tumatakas na pangkat ng mga Benjaminita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: bumaling sila
  rationale: Ipinahihiwatig ng פנה ang pagbabago ng direksiyon; natural ang “bumaling” nang hindi idinaragdag na bumalik sila sa pinanggalingan.
- source_word: וַיָּנֻסוּ
  choice: tumakas
  rationale: Karaniwang kahulugan ng נוס ang pagtakas, lalo na mula sa labanan.
- source_word: הַמִּדְבָּרָה
  choice: patungo sa ilang
  rationale: Pinananatili ng “patungo” ang direksiyonal na hulapi, at ang “ilang” ang likas at marangal na katumbas ng מִדְבָּר.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: sa Bato ng Rimon
  rationale: Isinasalin ang karaniwang pangngalang סֶלַע bilang “Bato” at tinutumbasan sa baybay-Tagalog ang pangalang Rimon.
- source_word: וַיְעֹלְלֻהוּ
  choice: pinuksa nila
  rationale: Sa kontekstong militar, ang pandiwa ay tumutukoy sa walang-awang pagpatay sa mga natitirang tumatakas. Inilalagay sa talababa ang literal na larawang “namulot” upang mapanatili ang idyoma ng Hebreo.
- source_word: בַּמְסִלּוֹת
  choice: sa mga pangunahing daan
  rationale: Ang מְסִלּוֹת ay mga itinayong o nakaangat na daan; mas malinaw sa modernong Tagalog ang “mga pangunahing daan” kaysa “mga lansangan” sa tagpong nasa labas ng lungsod.
- source_word: חֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: limang libong lalaki
  rationale: Tuwirang pinananatili ang bilang at ang panlalaking katawagang אִישׁ nang hindi ito dinaragdagang pakahulugang “mga kawal.”
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: hinabol nila ang mga ito
  rationale: Ipinahihiwatig ng Hiphil ng דבק ang malapit na pagtugis. Ang panghalip na isahan sa Hebreo ay kolektibo, kaya maramihan ang natural na salin sa Tagalog.
- source_word: עַד גִּדְעֹם
  choice: hanggang sa Gidom
  rationale: Itinatakda ng עַד ang hangganan ng pagtugis; tinutumbasan sa baybay-Tagalog ang pangalan ng lugar.
- source_word: וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ
  choice: pinatay ang dalawang libong lalaki sa kanila
  rationale: Sa labanan, ang נכה ay pagpatay o pagpapabagsak. Pinananatili ng “sa kanila” ang partitive na diwa ng מִמֶּנּוּ, at hindi idinaragdag ang “pa” sapagkat hindi iyon tahasang nasa Hebreo.
