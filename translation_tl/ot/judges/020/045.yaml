  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “ilang” at “pinuksa” bilang mga salitang pamilyar sa salaysay-biblikal ngunit nauunawaan pa rin ng karaniwang mambabasa. Inilagay ang [a] sa mismong pandiwang pinapaliwanag nito, at ang [b] sa sugnay na may kolektibong panghalip.
