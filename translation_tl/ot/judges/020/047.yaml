base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: tl
  text: Ngunit bumaling ang animnaraang lalaki at tumakas patungo sa ilang[a], hanggang sa Bato ng Rimon[b], at nanatili sila roon nang apat na buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papasok sa ilang.” Maaaring magpahiwatig ang hulaping pandireksiyon sa Hebreo ng pagkilos patungo sa ilang o papasok sa rehiyon nito.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang bato ng Rimon”; maaari ring isaling “Batong Rimon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: tumalikod
  rationale: Ipinahahayag ng pandiwa ang pagbabago ng direksiyon; sa konteksto ng labanan, natural na ipinahihiwatig ng “tumalikod” ang pagtalikod nila upang tumakas.
- source_word: וַיָּנֻסוּ
  choice: tumakas
  rationale: Tumpak nitong ipinapahayag ang agarang pagtakas sa kontekstong militar.
- source_word: הַמִּדְבָּרָה
  choice: patungo sa ilang
  rationale: Pinananatili nito ang direksiyonal na anyong Hebreo nang hindi tiyakang nagpapasya kung papunta lamang o papasok sa rehiyon ng ilang.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: sa Bato ng Rimon
  rationale: Pinananatili ang kayariang “bato ng Rimon” habang natural itong tinatrato bilang pangalan ng pook sa Filipino.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: animnaraang lalaki
  rationale: Ang אִישׁ pagkatapos ng bilang ay tumutukoy rito sa mga lalaking kabilang sa hukbo.
- source_word: וַיֵּשְׁבוּ
  choice: nanatili sila roon
  rationale: Ang pansamantalang pananatili sa kanlungan sa loob ng apat na buwan ang pinakamalinaw na diwa sa konteksto.
- source_word: בְּסֶלַע רִמּוֹן
  choice: roon
  rationale: Malinaw na ang tinutukoy ay ang Bato ng Rimon na kababanggit lamang; iniiwasan ng panghalip-pook ang mabigat na pag-uulit sa Filipino.
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: nang apat na buwan
  rationale: Natural na pahayag sa Filipino para sa tagal ng kanilang pananatili.
- source_word: וַ
  choice: Ngunit
  rationale: Bagaman karaniwang pang-ugnay na pasalaysay ang waw, ang “Ngunit” ay angkop sa kaibahan sa naunang pagkalipol ng karamihan at sa pagkaligtas ng animnaraan.
