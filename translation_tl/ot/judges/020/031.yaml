translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Pinanatili ang Hebreong “mga anak ni Benjamin” sa pangunahing teksto, habang inilagay sa talababa ang mas natural na katawagang “mga Benjaminita.” Inilapit ang mga talababa sa mismong pariralang tinutukoy ng bawat isa.
