  text: וַ/יֵּצְא֤וּ בְנֵֽי בִנְיָמִן֙ לִ/קְרַ֣את הָ/עָ֔ם הָנְתְּק֖וּ מִן הָ/עִ֑יר וַ/יָּחֵ֡לּוּ לְ/הַכּוֹת֩ מֵ/הָ/עָ֨ם חֲלָלִ֜ים כְּ/פַ֣עַם בְּ/פַ֗עַם בַּֽ/מְסִלּוֹת֙ אֲשֶׁ֨ר אַחַ֜ת עֹלָ֣ה בֵֽית אֵ֗ל וְ/אַחַ֤ת גִּבְעָ֨תָ/ה֙ בַּ/שָּׂדֶ֔ה כִּ/שְׁלֹשִׁ֥ים אִ֖ישׁ בְּ/יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: tl
  text: Lumabas ang mga anak ni Benjamin upang harapin ang bayan[a], at nailayo sila sa lungsod[b]. Nagsimula silang pumatay ng ilan sa bayan, gaya ng mga naunang pagkakataon[c], sa mga pangunahing daan—ang isa ay paahon patungong Bethel at ang isa naman ay patungong Gibea sa bukas na lupain[d]—mga tatlumpung lalaki ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Benjaminita.” Sa Hebreo, “mga anak ni Benjamin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nahiwalay sila sa lungsod” o “naakit silang lumayo sa lungsod.” Ipinahihiwatig na nailabas sila mula sa proteksiyon ng lungsod.
    reason: lexical_alternative
  - marker: c
    text: O “gaya ng dati.” Inihahambing ng idyomang Hebreo ang pagsalakay na ito sa mga naunang labanan.
    reason: lexical_alternative
  - marker: d
    text: O “sa parang.” Malamang na inilalarawan nito ang rutang dumaraan sa bukas na lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Lumabas
  rationale: Karaniwang pandiwang pasalaysay para sa paglabas mula sa lungsod; natural at tuwiran sa Tagalog.
- source_word: בְנֵי בִנְיָמִן
  choice: ang mga anak ni Benjamin
  rationale: Pinananatili ang Hebreong pananalitang pangkamag-anakan at ang pagkakakilanlan ng lipi; maaari ring unawain bilang mga Benjaminita.
- source_word: לִקְרַאת הָעָם
  choice: upang harapin ang bayan
  rationale: Sa konteksto, ang עָם ay hukbong Israelita; ipinahihiwatig ng “harapin” ang pakikipagsagupa nang hindi pinapalitan ang bayan ng mas tiyak na “hukbo.”
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: nailayo sila sa lungsod
  rationale: Ipinapahayag ang taktikal na pagkakahiwalay nila sa lungsod habang pinananatili ang bahagyang kalabuan kung sila ay nahatak, naakit, o nahiwalay.
- source_word: וַיָּחֵלּוּ לְהַכּוֹת ... חֲלָלִים
  choice: Nagsimula silang pumatay ng ilan sa bayan
  rationale: Ang ingressive na וַיָּחֵלּוּ ay “nagsimula,” at nililinaw ng חֲלָלִים na ang mga tinamaan ay napatay; “pumatay” ang natural na Tagalog na hindi lumilikha ng alanganing pag-uulit.
- source_word: כְּפַעַם בְּפַעַם
  choice: gaya ng mga naunang pagkakataon
  rationale: Idyomatikong paghahambing sa mga naunang labanan sa salaysay.
- source_word: בַּמְסִלּוֹת
  choice: sa mga lansangan
  rationale: Ang מְסִלּוֹת ay mga pangunahing daan o lansangan; ang “lansangan” ay dignified at madaling maunawaan.
- source_word: אַחַת עֹלָה בֵית אֵל
  choice: ang isa ay paahon patungong Bethel
  rationale: Pinananatili ang topograpikong diwa ng עֹלָה, hindi lamang ang direksiyon.
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: ang isa naman ay patungong Gibea sa kaparangan
  rationale: Natural na binabasa ang בַּשָּׂדֶה bilang paglalarawan sa rutang nasa bukas na lupain, bagaman maaari rin itong isaling “sa parang.”
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: mga tatlumpung lalaki ng Israel
  rationale: Tuwirang pinananatili ang tinatayang bilang at pagkakakilanlan ng mga napatay.
