  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: tl
  text: At lumapit[a] ang mga anak ni Israel sa mga anak ni Benjamin sa ikalawang araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumulong patungo sa” o, sa konteksto ng labanan, “sumulong laban sa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang mga anak ni Israel” at “ang mga anak ni Benjamin”; maaari ring isaling “ang mga Israelita” at “ang mga Benjaminita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: At lumapit
  rationale: Ang qal na קרב ay nangangahulugang lumapit. Bagaman maaaring ipahiwatig ng konteksto ng labanan ang pagsulong laban sa kaaway, hindi tahasang nagsasaad ng paglusob ang pandiwa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang literal at pampamilyang katawagan sa tribo, na dito ay tumutukoy sa mga hukbo ng Israel bilang isang kabuuan.
- source_word: אֶל
  choice: sa
  rationale: Karaniwang nagsasaad ang pang-ukol ng direksiyon patungo sa isang tao o pangkat. Sapat nang ipinahihiwatig ng konteksto ang paglalaban nang hindi ito ginagawang tahasang “laban sa.”
- source_word: בְנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang literal na katawagang pantribo at ang pagkakapantay ng anyo nito sa “mga anak ni Israel.”
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: sa ikalawang araw
  rationale: Tuwirang isinasalin ang tiyak na bilang na ordinal sa Hebreo sa halip na gawing “kinabukasan.”
