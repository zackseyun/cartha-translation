base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: tl
  text: Pagkatapos, tumindig mula sa kanilang kinalalagyan ang lahat ng kalalakihan ng Israel at humanay para sa labanan sa Baal-tamar. Samantala, biglang sumugod mula sa kanilang kinalalagyan ang pangkat ng Israel na nakatambang, mula sa Maareh-geba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong Maareh-geba ay maaaring unawain bilang pangalan ng lugar, gaya ng pagkakasalin dito. Maaari rin itong basahin bilang “maluwang na lugar ng Geba” o “parang ng Geba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: ang lahat ng kalalakihan ng Israel
  rationale: Bagaman isahan ang אִישׁ, kasama ng כֹל ay kolektibo o distributibo ang diwa. Ang “lahat ng kalalakihan” ay natural sa kontekstong militar at pinananatili ang panlalaking tinutukoy ng Hebreo.
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: tumindig mula sa kanilang kinalalagyan
  rationale: Maramihan ang pandiwa, samantalang distributibo ang hulaping isahan sa “lugar.” Ang maramihang “kanilang kinalalagyan” ang likas sa Filipino para sa kolektibong simuno.
- source_word: וַיַּעַרְכוּ
  choice: humanay para sa labanan
  rationale: Sa salaysay-militar, ang ערך ay tumutukoy sa pag-aayos ng mga hukbo sa hanay na pandigma. Malinaw at natural sa Filipino ang “humanay para sa labanan” nang hindi labis na nagpapaliwanag.
- source_word: בְּבַעַל תָּמָר
  choice: sa Baal-tamar
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin ang mga bahagi ng pangalan.
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: ang pangkat ng Israel na nakatambang
  rationale: Ang אֹרֵב ay tumutukoy sa isa o pangkat na nag-aabang sa pananambang. Ipinakikita ng konstruksiyon na ito ang nakatambang pangkat na kabilang sa Israel, hindi isang pangkat na tumatambang laban sa Israel.
- source_word: מֵגִיחַ
  choice: biglang sumugod
  rationale: Ipinahihiwatig ng anyo rito ang mabilis at biglaang paglabas mula sa pagkakatago. Ang “biglang sumugod” ay angkop sa pananambang at sa galaw ng salaysay.
- source_word: מִמְּקוֹמוֹ
  choice: mula sa kanilang kinalalagyan
  rationale: Ang isahang hulapi ay nauunawaan nang distributibo o kolektibo. Ginamit ang maramihang panghalip upang maging natural sa Filipino kaugnay ng pangkat.
- source_word: מִמַּעֲרֵה גָבַע
  choice: mula sa Maareh-geba
  rationale: Hindi tiyak ang parirala at maaaring nag-iingat ng pangalan ng lugar. Pinanatili ang transliterasyon sa pangunahing teksto at inilagay sa talababa ang mga posibleng deskriptibong pagbasa.
