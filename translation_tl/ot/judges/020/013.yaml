  naturalness: May ilang di-natural na parirala sa draft, lalo na ang “ayaw makinig ng Benjamin.” Mas natural at malinaw sa modernong Filipino ang “tumangging makinig ang lipi ni Benjamin.”
  terminology: Pinanatili ang Gibea, Israel, Benjamin, at ang pormal na “mga anak ni Israel.” Ang “mga taong walang dangal” ay isang natural na moral na katumbas ng idiomatikong “mga anak ng kawalang-kabuluhan,” nang hindi ipinapalagay na pangalan ang Belial.
