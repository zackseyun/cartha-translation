base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: tl
  text: Ibigay ninyo ang mga lalaking nasa Gibea—ang mga taong walang dangal[a]—upang patayin namin sila at alisin ang kasamaan sa Israel. Ngunit tumangging makinig ang lipi ni Benjamin sa tinig ng kanilang mga kapatid, ang mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal, “mga anak ng kawalang-kabuluhan”; maaari ring isaling “mga hamak na tao.” Tradisyonal na salin: “mga anak ni Belial.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “makinig sa tinig” ay idyomang Hebreo na maaari ring mangahulugang “dinggin” o “sumunod.” Ang “mga anak ni Israel” ay maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Ibigay ninyo sa amin
  rationale: Sa kontekstong ito, hinihingi ang pagsuko ng mga salarin sa kapulungan. Natural sa Filipino ang “ibigay ninyo sa amin” at malinaw ang legal na diwa.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaking
  rationale: Tiyak na mga lalaki ang tinutukoy ng panlalaking pangmaramihang anyo at ng konteksto.
- source_word: בְּנֵי בְלִיַּעַל
  choice: mga taong walang kabuluhan
  rationale: Pinananatili nito ang literal na larawan ng idyomang Hebreo nang hindi ginagawang pangalang pantangi ang Belial; sa konteksto, moral na kasamaan ang ipinahihiwatig.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: na nasa Gibea
  rationale: Tinutukoy ng sugnay ang mga salarin ayon sa kanilang kinaroroonang bayan.
- source_word: וּנְמִיתֵם
  choice: upang patayin namin sila
  rationale: Ipinahahayag ng cohortative ang layuning isagawa ang parusang kamatayan kapag naisuko ang mga lalaki.
- source_word: וּנְבַעֲרָה רָעָה
  choice: at alisin ang kasamaan
  rationale: Ang בער sa pormulang panghukuman ay nangangahulugang alisin o pawiin ang kasamaan mula sa pamayanan.
- source_word: מִיִּשְׂרָאֵל
  choice: sa Israel
  rationale: Natural na Filipino para sa pag-aalis ng kasamaan mula sa saklaw o pamayanan ng Israel.
- source_word: וְלֹא אָבוּ
  choice: Ngunit ayaw
  rationale: Tuwirang ipinapahayag ang kawalan ng pagsang-ayon o kusang pagtanggi.
- source_word: בִּנְיָמִן
  choice: ang Benjamin
  rationale: Ginagamit ang pangalan bilang kolektibong katawagan sa lipi, gaya ng Hebreo.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: makinig ... sa tinig
  rationale: Pinananatili ang kongkretong idyomang Hebreo, na maaari ring mangahulugang sumunod o dinggin.
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Pinananatili ang mahalagang wikang pampamilya at panlipi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang pormal na katawagang Hebreo at ang pagkakaugnay nito sa “mga kapatid.”
theological_decisions:
- issue: Paglalarawan sa בְּנֵי בְלִיַּעַל
  choice: mga taong walang kabuluhan
  alternative: mga anak ng kawalang-kabuluhan; mga walang-kuwentang tao; mga anak ni Belial
  rationale: Moral na paglalarawan ang parirala rito at hindi kinakailangang tumukoy sa isang personal na demonyong nagngangalang Belial. Iniiwasan ng salin ang pagpasok ng mas huling teolohikal na pakahulugan.
- issue: Lakas na panghukuman ng mga cohortative
  choice: upang patayin namin sila at alisin ang kasamaan sa Israel
  alternative: at papatayin namin sila at aalisin ang kasamaan sa Israel
  rationale: Inilalahad ng teksto ang layunin ng kahilingan—pagpaparusa at paglilinis sa pamayanan—nang hindi nagdaragdag ng paliwanag.
- issue: Kahulugan ng “makinig sa tinig”
  choice: makinig ... sa tinig
  alternative: sumunod; dinggin
  rationale: Pinananatili ang idyomang Hebreo at ang ambiguwidad nito sa pagitan ng pakikinig, pagdinig, at pagsunod.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang wikang pampamilya na “mga kapatid” at “mga anak ni Israel,” gayundin ang idyomang “makinig sa tinig.” Ginamit ang “Gibea” bilang karaniwang anyong Filipino ng pangalan. Ang gitling-panaklong ay tumutulong upang malinaw na ang “mga taong walang kabuluhan” ay paglalarawan sa mga lalaking hinihinging isuko.
