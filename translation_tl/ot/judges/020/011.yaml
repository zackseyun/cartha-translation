translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kalalakihan” upang tumpak na katawanin ang lalaking pangkat-militar sa konteksto, at pinanatili ang larawang “iisang tao” ng Hebreong idyoma.
