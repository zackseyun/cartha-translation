    issue: Ang “laban sa lunsod” ay mas matibay kaysa sa ipinahihintulot ng pang-ukol na אֶל sa talatang ito.
    rationale: Ang Hebreo ay nagsasabing nagtipon sila sa/patungo sa lunsod; ang pagkapoot o pagsalakay ay maaaring mahinuha sa konteksto, ngunit hindi ito tuwirang isinasaad dito.
  - severity: low
    issue: Ang talababa ay nagpapanatili ng isang hindi kailangang mapanlabang pangunahing pagbasa.
    rationale: Kapag isinalin nang neutral ang pangunahing teksto, hindi na kailangan ang talababa upang ipaglaban ang “laban sa”; mas mainam na huwag gumawa ng artipisyal na ambigwidad.
  - severity: low
    issue: Ang “sama-samang nagkakaisa na parang iisang tao” ay bahagyang paulit-ulit at ang “parang” ay mas mahina kaysa sa idyomatikong diwa ng lubos na pagkakaisa.
    rationale: Ang “na nagkakaisa na tila iisang tao” ay mas maayos at pinananatili ang parehong mga bahagi ng Hebreong pananalita.
  revised_text: Kaya nagtipon sa lunsod ang lahat ng kalalakihan ng Israel, na nagkakaisa na tila iisang tao.
