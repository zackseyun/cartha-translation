    rationale: Sa kontekstong ito, בֵּית־אֵל ay pangalang-pook. Bagaman ang pangalan ay etimolohikong nangangahulugang “bahay ng Diyos,” hindi ito isang kinakailangang tekstuwal na alternatibo rito.
