  text: וַ/יָּקֻ֜מוּ וַ/יַּעֲל֣וּ בֵֽית אֵל֮ וַ/יִּשְׁאֲל֣וּ בֵ/אלֹהִים֒ וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֚י יַעֲלֶה לָּ֣/נוּ בַ/תְּחִלָּ֔ה לַ/מִּלְחָמָ֖ה עִם בְּנֵ֣י בִנְיָמִ֑ן וַ/יֹּ֥אמֶר יְהוָ֖ה יְהוּדָ֥ה בַ/תְּחִלָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: tl
  text: Pagkatapos, bumangon sila at umahon sa Bethel, at sumangguni sila sa Diyos. Sinabi ng mga anak ni Israel, “Sino ang unang aahon para sa atin upang lumaban sa mga anak ni Benjamin?” Sinabi ni Yahweh, “Juda ang mauuna.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיַּעֲלוּ
  choice: tumindig sila at umahon
  rationale: Pinananatili ang magkasunod na kilos ng קום at עלה. Ang “umahon” ay natural na katumbas ng pagpunta paitaas, posibleng dahil sa lokasyon o banal na pook.
- source_word: בֵית אֵל
  choice: Bethel
  rationale: Binabasa bilang pangalang-pook, ayon sa karaniwang pagkaunawa sa konteksto; inilalagay sa talababa ang literal at posibleng alternatibong pagbasa.
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: upang sumangguni sa Diyos
  rationale: Ang שׁאל na may בְּ ay tumutukoy rito sa paghingi ng patnubay o pasiya mula sa Diyos, hindi lamang sa karaniwang pagtatanong.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang Hebreong katawagang pangkamag-anakan para sa bayang nagmula kay Israel, habang nananatiling malinaw sa makabagong Tagalog.
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה לַמִּלְחָמָה
  choice: Sino sa atin ang unang sasalakay
  rationale: Ipinahahayag nang natural sa Tagalog ang tanong kung sino ang mauunang pumasok sa labanan. Ang לָּנוּ ay nauunawaan bilang kumakatawan o kumikilos para sa buong Israel.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: sa mga anak ni Benjamin
  rationale: Bagaman karaniwang nangangahulugang “kasama” ang עִם, malinaw na nangangahulugan itong pakikipaglaban laban sa Benjamin sa kontekstong militar; naipahihiwatig na ng pandiwang “sasalakay” ang pagsalungat.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Sinabi ni Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang tipan na יהוה bilang “Yahweh.”
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: Ang Juda ang mauuna
  rationale: Pinananatili ang maikli at mariing sagot, habang likas na ipinapahayag sa Tagalog ang elipsis ng Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang transliterasyong “Yahweh” ay malinaw na nagtatangi rito sa titulong “Panginoon” nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Korporatibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili nito ang anyong pangkamag-anakan ng Hebreo. Sa konteksto, kolektibo itong tumutukoy sa bayan ng Israel at hindi kailangang ipakahulugang mga lalaki lamang.
- issue: Maikling sagot na יְהוּדָה בַתְּחִלָּה
  choice: Ang Juda ang mauuna
  alternative: Juda muna
  rationale: Hindi dinaragdagan ang sagot ng tahasang pandiwang wala sa Hebreo, ngunit ginagawang malinaw at marangal sa Tagalog ang ipinahihiwatig na pagkakasunod sa pagsalakay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga Hebreong katawagang pangkamag-anakan kung natural, ngunit ginawang idyomatiko ang wikang militar. Ang tanging talababa ay tumutukoy sa tunay na leksikal na kalabuan ng בֵית אֵל.
