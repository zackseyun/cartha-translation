  yaml_path: translation/ot/judges/020/021.yaml
  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: tl
  text: Pagkatapos, lumabas mula sa Gibea ang mga anak ni Benjamin, at nang araw na iyon ay ipinabuwal nila hanggang sa lupa ang dalawampu't dalawang libong lalaki ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumatay sila ng dalawampu't dalawang libong lalaki ng Israel nang araw na iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: lumabas
  rationale: Isinasalaysay ng wayyiqtol ng יצא ang kasunod na kilos; likas ang “lumabas” para sa pagsalakay mula sa lungsod at hindi kailangang tukuyin sa Filipino ang perspektibang “came/went.”
- source_word: בְנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili nito ang Hebreong katawagang pampagkamag-anak at malinaw pa ring tumutukoy sa tribo ni Benjamin.
- source_word: מִן הַגִּבְעָה
  choice: mula sa Gibea
  rationale: Tumpak at natural na ipinahahayag ang pinagmulan ng pagkilos mula sa lungsod na Gibea.
- source_word: וַיַּשְׁחִיתוּ
  choice: pinabagsak nila
  rationale: Sa konteksto ng labanan at bilang ng nasawi, ang Hiphil ng שׁחת ay tumutukoy sa nakamamatay na paglipol; ang “pinabagsak” ay nagpapanatili ng militar na diwa at umaangkop sa kasunod na “sa lupa.”
- source_word: בְיִשְׂרָאֵל
  choice: ng Israel
  rationale: Kasama ng אִישׁ, natural itong bumubuo sa “mga lalaki ng Israel,” ang mga pinaslang sa labanan.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Likas na makabagong Filipino para sa panandang temporal na “sa araw na iyon.”
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף
  choice: dalawampu't dalawang libo
  rationale: Karaniwang Filipino na anyo ng bilang na 22,000.
- source_word: אִישׁ
  choice: lalaki
  rationale: Bagaman isahan ang anyong Hebreo pagkatapos ng bilang, ang “dalawampu't dalawang libong lalaki” ang wastong gamit sa Filipino at hindi nagdaragdag ng hindi tahasang salitang “kawal.”
- source_word: אָרְצָה
  choice: sa lupa
  rationale: Pinananatili ang direksiyonal na larawan ng pagbagsak tungo sa lupa, na sa konteksto ay nagpapahiwatig ng pagkamatay.
