  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang Hebreong ekspresyong pantribo na “mga anak ni Benjamin” at ang larawang “sa lupa,” habang inilagay sa talababa ang mas tuwirang kahulugang “pumatay.”
