  text: וַ/יֵּ֨שֶׁב֙ הָ/אָ֣שֵׁרִ֔י בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּ֖י לֹ֥א הוֹרִישֽׁ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: tl
  text: Kaya nanirahan ang mga taga-Asher sa gitna ng mga Cananeo[a], na mga naninirahan sa lupain, sapagkat hindi nila pinalayas ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal na mga kolektibong anyong isahan ang ginamit: “ang taga-Asher … ang Cananeo … hindi niya ito pinalayas.” Isinalin dito sa maramihan upang maipahayag ang kolektibong diwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Kaya nanirahan
  rationale: Ang ישׁב ay tumutukoy sa paninirahan o pagtira. Ginamit ang “nanirahan” bilang natural at malinaw na salin; ipinahihiwatig ng “kaya” ang ugnayan nito sa naunang konteksto.
- source_word: הָאָשֵׁרִי
  choice: ang mga taga-Asher
  rationale: Bagaman anyong isahan ang gentiliko sa Hebreo, kolektibo itong tumutukoy sa lipi ni Asher. Ang “mga taga-Asher” ay likas at malinaw sa makabagong Tagalog.
- source_word: בְּקֶרֶב
  choice: sa gitna ng
  rationale: Tumpak na ipinapahayag nito ang paninirahan sa loob o kasama ng ibang pangkat, habang pinananatili ang diin ng Hebreo.
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Ang anyong isahan sa Hebreo ay ginagamit nang kolektibo, gaya ng pinatutunayan ng kasunod na pariralang nasa maramihan.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: mga naninirahan sa lupain
  rationale: Malinaw at natural na salin ng participial phrase na tumutukoy sa mga Cananeo bilang mga naninirahan sa lupain.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito rito ng dahilan. Ang “sapagkat” ay malinaw, dignificado, at angkop sa register ng salin.
- source_word: לֹא הוֹרִישׁוֹ
  choice: hindi nila pinalayas ang mga iyon
  rationale: Sa konteksto ng Mga Hukom, ang Hiphil ng ירשׁ ay nangangahulugang paalisin o agawan ng tirahan ang mga naninirahan. Ang mga panghalip na maramihan ay naghahayag ng kolektibong diwa ng mga anyong isahan sa Hebreo.
theological_decisions:
- issue: Mga kolektibong anyong isahan para sa lipi at pangkat-etniko
  choice: 'Isinalin sa maramihan: “mga taga-Asher,” “mga Cananeo,” at “hindi nila pinalayas ang mga iyon.”'
  alternative: 'Panatilihin ang gramatikal na isahan: “ang taga-Asher … ang Cananeo … hindi niya ito pinalayas.”'
  rationale: Karaniwang ginagamit sa Hebreo ang anyong isahan upang kumatawan sa buong lipi o bayan. Ang literal na isahan sa Tagalog ay maaaring magmukhang tumutukoy sa tig-isang indibidwal at mailihis ang diwa ng konteksto.
translation_notes:
  register: Makabago, malinaw, at dignipikadong Tagalog. Pinanatili ang pangalang “Asher” at ginamit ang nakaugaliang katawagang “Cananeo.” Ang footnote marker na [a] ay inilagay agad pagkatapos ng “mga Cananeo.”
