  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: tl
  text: At ang hangganan ng mga Amoreo ay mula sa Paahon ng Akrabim[a], mula sa Sela[b] at pataas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Akrabim ay nangangahulugang “mga alakdan”; maaari ring isalin na “paahon ng mga alakdan.”
    reason: lexical_alternative
  - marker: b
    text: O “mula sa bato,” kung ang salitang Hebreo ay inuunawang karaniwang pangngalan sa halip na pangalan ng lugar na Sela.
    reason: alternative_reading
lexical_decisions:
- source_word: גְבוּל
  choice: hangganan
  rationale: Karaniwang tumutukoy ang salita sa guhit o saklaw ng hangganan; natural at tumpak dito ang “hangganan.”
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Bagaman isahan ang anyong Hebreo, kolektibo ang gamit nito para sa pangkat-etniko, kaya likas sa Tagalog ang maramihang “mga Amoreo.”
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: mula sa Akyatan ng Akrabim
  rationale: Ang מַעֲלֵה ay isang paakyat na daan o lugar ng pag-ahon. Pinanatili bilang pangalang pantangi ang Akrabim, habang ibinigay sa talababa ang literal na kahulugan nito.
- source_word: מֵהַסֶּלַע
  choice: mula sa Sela
  rationale: Sa heograpikong pahayag na ito, maaaring pangalan ng lugar ang Sela, bagaman maaari ring unawain ang anyong Hebreo bilang karaniwang pangngalang “bato”; pinanatili ang alternatibo sa talababa.
- source_word: וָמָעְלָה
  choice: at paitaas
  rationale: Ipinahihiwatig ng pang-abay ang pagpapatuloy mula sa puntong binanggit tungo sa mas mataas o higit pang dako; maikli at likas ang “at paitaas.”
- source_word: וּ
  choice: At
  rationale: Payak nitong iniuugnay ang heograpikong pahayag sa naunang konteksto.
