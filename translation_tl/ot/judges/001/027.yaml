  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: tl
  text: Ngunit hindi pinaalis ng Manases ang mga naninirahan sa Bet-sean at sa mga bayang sakop nito[a], ni sa Taanac at sa mga bayang sakop nito, ni sa Dor at sa mga bayang sakop nito, ni sa Ibleam at sa mga bayang sakop nito, ni sa Megido at sa mga bayang sakop nito. Nagpumilit ang mga Cananeo na manatili sa lupaing ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na babae nito,” na tumutukoy sa mas maliliit na bayan o pamayanang sakop ng pangunahing lungsod.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “Nagpasiyang manirahan ang mga Cananeo sa lupaing ito.” Ang pandiwang Hebreo ay maaaring magpahayag ng pagkukusa o matibay na pasiya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: pinaalis
  rationale: Ang Hiphil ng ירשׁ sa kontekstong ito ay tumutukoy sa pagpapaalis sa mga dating naninirahan at sa pagkawala ng kanilang hawak sa lupain. Natural sa modernong Tagalog ang “pinaalis,” habang malinaw sa kasunod na talaan kung sino ang hindi napaalis.
- source_word: בְּנוֹתֶיהָ
  choice: mga bayang sakop nito
  rationale: Literal itong “mga anak na babae nito,” isang idyoma para sa maliliit o nakapailalim na pamayanang kaugnay ng pangunahing lungsod. Mas malinaw at natural sa Tagalog ang “mga bayang sakop nito”; pinananatili sa talababa ang literal na larawan.
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: mga naninirahan sa Dor ... Ibleam ... Megido
  rationale: Ang mga anyong participle ng ישׁב ay tumutukoy sa mga taong nakatira sa mga lugar na ito. Inilapat ang “mga naninirahan” sa buong magkakasunod na talaan upang likas at malinaw ang Tagalog.
- source_word: וַיּוֹאֶל
  choice: nagpumilit
  rationale: Maaaring magpahiwatig ang יאל ng pagkukusa, pagpayag, o matibay na pasiya. Sa konteksto ng hindi pagpapaalis sa kanila, ipinahahayag ng “nagpumilit” ang kanilang determinasyong manatili nang hindi itinatago ang posibleng ibang pagbasa.
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo itong tumutukoy sa grupong bayan; kaya natural ang pangmaramihang “mga Cananeo” sa Tagalog.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: na manatili sa lupaing iyon
  rationale: Ang infinitive na may ל ay nagsasaad ng gawaing ipinasiya ng mga Cananeo. Natural na katambal ng “nagpumilit” ang “na manatili,” at ang “lupaing iyon” ay angkop na deiktikong pagtukoy sa lupaing inilalarawan ng salaysay.
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: Bet-sean, Taanac, Dor, Ibleam, Megido
  rationale: Isinalin sa baybay na madaling basahin at bigkasin sa modernong Filipino, habang nananatiling makikilala ang mga pangalang Hebreo.
