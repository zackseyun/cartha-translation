translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga bayang sakop nito” sa halip na literal na “mga anak na bayan” upang madaling maunawaan, habang ipinaliwanag ang idyomang Hebreo sa talababa. Inayos ang sintaks upang malinaw na ang mga naninirahan sa bawat pangunahing lungsod at mga bayang sakop nito ang hindi napaalis.
