  to: Hindi pinalayas ng Neftali ang mga naninirahan sa Bet-semes ni ang mga naninirahan sa Bet-anat. At nanirahan ang mga Neftalita sa gitna ng mga Cananeo, na mga naninirahan sa lupain. At ang mga naninirahan sa Bet-semes at Bet-anat ay napasailalim sa sapilitang paggawa[a] para sa kanila.
