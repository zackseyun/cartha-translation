  source_fidelity: Tumpak sa kabuuan ang pagpapahayag ng hindi pagpapalayas, ng kolektibong katayuan ng mga Cananeo bilang naninirahan sa lupain, at ng מַס bilang sapilitang paggawa. Gayunman, ang “Sa halip” ay mas matindi kaysa sa simpleng pangatnig na waw ng Hebreo at maaaring magmungkahi ng eksklusibong pagpapalit. Mas ligtas ang “At,” na pinananatili ang daloy ng salaysay nang walang dagdag na lohikal na diin. Ang “sa gitna ng” ay mas malapit din sa בְּקֶרֶב kaysa “kasama ng.”
  naturalness: Natural ang karamihan ng Tagalog. Ang “mga Neftalita” ay isang malinaw at likas na paraan upang ipahayag ang kolektibong lipi. Ang “sa gitna ng mga Cananeo” ay kapwa natural at mas tiyak sa kahulugan ng pinagmulan.
  terminology: Ang “Neftali,” “Bet-semes,” “Bet-anat,” at “mga Cananeo” ay angkop na mga transliterasyon. Ang “sapilitang paggawa” ay wastong salin ng מַס sa kontekstong ito, at maayos na nililinaw ng talababa na hindi ito simpleng tributo.
