base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: tl
  text: Hindi pinalayas ng Neftali ang mga naninirahan sa Bet-semes ni ang mga naninirahan sa Bet-anat. At nanirahan ang mga Neftalita sa gitna ng mga Cananeo, na mga naninirahan sa lupain. At ang mga naninirahan sa Bet-semes at Bet-anat ay napasailalim sa sapilitang paggawa[a] para sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa sapilitang paglilingkod o paggawa, hindi lamang sa pagbabayad ng tributo.
    reason: lexical_clarification
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: pinalayas
  rationale: Sa Hiphil, tumutukoy ito sa pagpapaalis sa dating mga naninirahan sa lupain. Natural at malinaw sa modernong Tagalog ang “pinalayas,” habang pinananatili ang diwa ng sapilitang pagpapaalis.
- source_word: יֹשְׁבֵי
  choice: mga naninirahan
  rationale: Ang participle ng ישב ay tumutukoy sa mga taong naninirahan sa isang lugar. Ang “mga naninirahan” ay malinaw at angkop sa paulit-ulit na pormula ng kabanata.
- source_word: בֵית שֶׁמֶשׁ
  choice: Bet-semes
  rationale: Isinalin sa baybay-Tagalog ang transliterasyon ng pangalan ng lugar, sa halip na isalin ang literal na kahulugan nito.
- source_word: בֵית עֲנָת
  choice: Bet-anat
  rationale: Pinanatili bilang transliteradong pangalan ng lugar sa baybay na madaling basahin sa Tagalog.
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: Sa halip, nanirahan ang mga Neftalita kasama ng
  rationale: Ang Neftali ay kolektibong pangalan ng lipi. Ginawang hayag na “mga Neftalita” upang maging natural ang Tagalog at maiwasan ang maling pagkaunawa na isang indibidwal lamang ang tinutukoy. Ipinahihiwatig ng “Sa halip” ang malinaw na paghahambing sa hindi nila pagpapaalis, nang hindi nagdaragdag ng tiyak na sanhi.
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibong katawagan ito sa isang pangkat etniko; kaya likas na maramihan sa Tagalog.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: na mga naninirahan sa lupain
  rationale: Pinanatili ang pariralang appositional na kumikilala sa mga Cananeo bilang mga naninirahan sa lupain.
- source_word: הָיוּ לָהֶם לָמַס
  choice: ay napasailalim sa sapilitang paggawa para sa kanila
  rationale: Ang מַס ay tumutukoy sa obligadong paglilingkod o paggawa, hindi lamang sa pagbabayad ng buwis o tributo. Ipinahahayag ng “napasailalim” ang kalagayang ipinataw sa kanila.
- source_word: לָהֶם
  choice: para sa kanila
  rationale: Pinananatili ang maramihang panghalip na malamang tumutukoy sa mga kabilang sa lipi ni Neftali.
