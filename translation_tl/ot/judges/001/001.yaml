  naturalness: Natural ang karamihan ng Tagalog, ngunit mas malinaw at mas malapit sa daloy ng Hebreo ang “Nangyari ito pagkamatay ni Josue” at “Sino ang unang susugod para sa amin.” Ang “mga anak ni Israel” ay katanggap-tanggap sa marangal na rehistrong biblikal.
  terminology: Wasto at pare-pareho ang “Yahweh,” “Josue,” at “mga Cananeo.” Ang mga talababa ay wastong nakakabit sa “mga anak ni Israel” at “mga Cananeo.”
