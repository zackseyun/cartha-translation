  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: tl
  text: 'Nangyari ito pagkamatay ni Josue: nagtanong kay Yahweh ang mga anak ni Israel[a], “Sino ang unang susugod para sa amin laban sa mga Cananeo[b] upang makipaglaban sa kanila?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel”; maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: Isahan ang anyong Hebreo, “ang Cananeo,” ngunit kolektibo ang kahulugan nito; kaya “mga Cananeo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: Pagkamatay ni Josue
  rationale: Likas na panimulang pangsalaysay sa modernong Tagalog; malinaw nitong ipinahahayag ang panahong tinutukoy nang hindi gumagamit ng mabigat na “at nangyari.”
- source_word: וַיִּשְׁאֲלוּ בַּיהוָה
  choice: nagtanong kay Yahweh
  rationale: Sa konteksto, ang שׁאל בְּ ay paghingi ng patnubay sa Diyos. Ang “nagtanong kay” ay tuwiran at likas, samantalang pinananatili ang pangalang tipan na Yahweh.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ng Israel
  rationale: Malapit ito sa anyong Hebreo at nauunawaan bilang sambayanan o mga inapo ni Israel; nililinaw sa talababa ang mas idyomatikong alternatibo.
- source_word: מִי יַעֲלֶה לָּנוּ ... בַּתְּחִלָּה
  choice: Sino ang unang sasalakay para sa amin
  rationale: Ang עלה sa kontekstong militar ay pagsulong upang lumaban. Mas natural sa Tagalog ang “sasalakay” kaysa literal na “aahon,” habang ang “para sa amin” ay nagpapanatili sa לָּנוּ.
- source_word: אֶל הַכְּנַעֲנִי
  choice: laban sa mga Cananeo
  rationale: Bagaman isahan ang anyong Hebreo, kolektibo ang kahulugan nito rito. Ipinahihiwatig ng konteksto ng digmaan ang diwang “laban sa.”
- source_word: לְהִלָּחֶם בּוֹ
  choice: upang makipaglaban sa kanila
  rationale: Tuwirang ipinapahayag ang layunin ng pagsalakay. Ang panghalip na maramihan ay umaayon sa kolektibong “mga Cananeo.”
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Josue” at “Cananeo,” na pamilyar na mga anyong Tagalog. Iniwasan ang arkaikong “at nangyari” at ang sobrang literal na militar na “aahon,” ngunit pinanatili ang ayos ng tanong, ang “una,” at ang layuning makipaglaban.
