base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: tl
  text: Sinabi ni Adoni-bezek, “Pitumpung hari na pinutulan ng mga hinlalaki ng kanilang mga kamay at malalaking daliri ng kanilang mga paa[a] ang namumulot noon sa ilalim ng aking hapag. Kung ano ang ginawa ko, gayon din ang iginanti sa akin ng Diyos.[b]” Pagkatapos, dinala nila siya sa Jerusalem, at namatay siya roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na anyo ng Hebreo, “mga hinlalaki ng kanilang mga kamay at paa.” Ang salitang ginamit ay tumutukoy sa hinlalaki ng kamay at, kapag paa ang tinutukoy, sa malaking daliri ng paa.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na אֱלֹהִים ay anyong maramihan, ngunit isahan ang pandiwang kasama nito rito; kaya “Diyos,” hindi “mga diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-bezek
  rationale: Itinuring itong pantanging pangalan ng nagsasalita at isinalin sa pamamagitan ng transliterasyon; hindi ito isinaling “Panginoon ng Bezek,” bagaman iyon ang posibleng kahulugan ng pangalan.
- source_word: שִׁבְעִים מְלָכִים
  choice: Pitumpung hari
  rationale: Tuwirang katumbas ng bilang at pangngalan sa Hebreo.
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: mga hinlalaki sa kamay at hinlalaki sa paa
  rationale: Ang בֹּהֶן ay tumutukoy sa hinlalaki sa kamay o sa malaking daliri ng paa, depende sa bahaging tinutukoy. Ginawang malinaw at natural sa Tagalog ang dalawang anatomikong kahulugan.
- source_word: מְקֻצָּצִים
  choice: pinutulan
  rationale: Ipinahahayag ng pasibong anyo ng קצץ ang pagputol at pag-alis sa mga daliri.
- source_word: הָיוּ מְלַקְּטִים
  choice: namumulot noon
  rationale: Ipinahihiwatig ng konstruksiyon ang nakagawiang kilos sa nakaraan. Hindi tinukoy sa Hebreo ang bagay na pinupulot, kaya hindi tahasang idinagdag ang “mga tira.”
- source_word: תַּחַת שֻׁלְחָנִי
  choice: sa ilalim ng aking hapag
  rationale: Pinanatili ang tuwirang pahayag ng lugar; ang “hapag” ay dignified ngunit karaniwang nauunawaan sa modernong Tagalog.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן
  choice: Kung ano ang ginawa ko, gayon din
  rationale: Pinananatili ang paghahambing at ang pagkakatumbas ng ginawa niya at ng naging ganti sa kaniya.
- source_word: שִׁלַּם לִי אֱלֹהִים
  choice: ang iginanti sa akin ng Diyos
  rationale: Ang piel ng שׁלם ay nagsasaad ng pagganti o pagbabayad ayon sa ginawa. Isahan ang pandiwa, kaya “Diyos” ang ginamit.
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם
  choice: Pagkatapos, dinala nila siya sa Jerusalem
  rationale: Natural na isinalaysay sa Tagalog ang kasunod na pangyayari, habang pinananatili ang maramihang gumagawa at isahang layon.
- source_word: וַיָּמָת שָׁם
  choice: at namatay siya roon
  rationale: Tuwirang pinanatili ang pagkamatay niya sa lugar na nabanggit.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים sa pahayag ni Adoni-bezek
  choice: Diyos
  alternative: mga diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, isahan ang pandiwang שִׁלַּם. Kaya pinakamalakas ang batayan para sa “Diyos,” nang hindi ipinapalagay na nagpapahayag si Adoni-bezek ng higit na ganap na teolohikong pagkilala kaysa sa mismong sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “hapag” bilang pamilyar na salitang may dignified na himig. Iniwasang idagdag sa pangunahing teksto ang “mga tira” dahil walang tahasang layon ang pandiwang “namumulot” sa Hebreo. Inilagay ang bawat talababa sa mismong salitang o pariralang ipinaliliwanag nito.
