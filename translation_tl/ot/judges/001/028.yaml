id: JDG.1.28
reference: Judges 1:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי חָזַ֣ק יִשְׂרָאֵ֔ל וַ/יָּ֥שֶׂם אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖ישׁ לֹ֥א הוֹרִישֽׁ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: tl
  text: Nang lumakas ang Israel, isinailalim nito ang mga Cananeo sa sapilitang paggawa,[a] ngunit hindi nito lubusang pinalayas ang mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa trabahong ipinataw bilang tributo” o “sa corvée.” Ang salitang Hebreo ay tumutukoy sa sapilitang paggawa na ipinapataw ng isang naghaharing kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, nasa isahan ang layon—“hindi niya lubusang pinalayas siya”—ngunit kolektibo itong tumutukoy sa mga Cananeo. Ang anyong Hebreo ay nagbibigay-diin din na hindi sila lubusang pinalayas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Nang
  rationale: Ang pormulang Hebreo ay nagpapasimula ng sugnay na temporal. Likas sa modernong Tagalog ang “Nang” at naipapakita nito ang panahon at pagkakasunod ng pangyayari nang hindi literal na ginagaya ang idyomang “at nangyari.”
- source_word: חָזַק
  choice: lumakas
  rationale: Ipinahihiwatig ng pandiwa na nagkaroon ang Israel ng higit na lakas o kapangyarihan; malinaw na naihahayag ng “lumakas” ang pagbabagong ito.
- source_word: וַיָּשֶׂם ... לָמַס
  choice: isinailalim ... sa sapilitang paggawa
  rationale: Ang parirala ay tumutukoy sa pagpapataw ng sapilitang paglilingkod o corvée ng isang nakapangyayaring kapangyarihan. Malinaw at natural sa Tagalog ang “isinailalim ... sa sapilitang paggawa,” at pinananatili nito ang mapilit na diwa.
- source_word: הַכְּנַעֲנִי
  choice: ang mga Cananeo
  rationale: Bagaman nasa anyong isahan sa Hebreo, kolektibong katawagan ito sa isang pangkat ng mga tao. Ang maramihang “mga Cananeo” ang natural at malinaw sa Tagalog.
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: ngunit hindi nito lubusang pinalayas ang mga ito
  rationale: Ang infinitive absolute na kasunod ng pandiwang may pagtanggi ay nagbibigay-diin sa hindi ganap na pagpapaalis. Kaya ang “hindi ... lubusang pinalayas” ay nagpapahayag ng diin, habang ang “mga ito” ay tumutukoy sa kolektibong populasyon ng mga Cananeo.
theological_decisions:
- issue: Ang ginawa ng Israel sa mga Cananeo
  choice: Inilalarawan ng talata na pinasailalim ng Israel ang mga Cananeo sa sapilitang paggawa sa halip na lubusang palayasin sila.
  alternative: Maaaring palambutin ang pahayag bilang pagbabayad lamang ng buwis o tributo.
  rationale: Ang Hebreong לָמַס sa kontekstong ito ay nagpapahiwatig ng sapilitang paggawa na ipinataw ng mas makapangyarihang pangkat. Hindi dapat alisin sa salin ang mapilit na katangian ng ginawa.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang “isinailalim ... sa sapilitang paggawa” ay mas natural at tiyak kaysa sa isang literal ngunit malabong salin ng idyomang Hebreo. Ginamit ang “nito” para sa kolektibong Israel at “mga ito” para sa kolektibong mga Cananeo.
