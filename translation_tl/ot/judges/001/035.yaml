base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: tl
  text: Ngunit nagpumilit ang mga Amoreo na manatili sa Bundok Heres, sa Aijalon, at sa Shaalbim. Pagkatapos, lumakas[a] ang kapangyarihan ng sambahayan ni Jose, at napasailalim sila sa sapilitang paggawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bumigat ang kamay ng sambahayan ni Jose.” Maaari rin itong isaling “manaig” o “naging mapaniil ang kapangyarihan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “naging mga manggagawang nagbibigay-tributo.” Ang salitang Hebreo ay tumutukoy sa sapilitang paglilingkod o paggawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: nagpumilit
  rationale: Sa konteksto, ipinahihiwatig ng יאל kasama ng pawatas na ang mga Amoreo ay determinadong manatili, hindi lamang pumayag o nagsimulang manirahan.
- source_word: הָאֱמֹרִי
  choice: ang mga Amoreo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang gamit nito para sa pangkat ng mga tao, gaya ng pinatutunayan ng kasunod na pandiwang maramihan.
- source_word: לָשֶׁבֶת
  choice: na manatili
  rationale: Ipinahihiwatig dito ang patuloy na paninirahan sa mga lugar na binanggit; natural itong kaagapay ng “nagpumilit” sa Filipino.
- source_word: בְּהַר חֶרֶס
  choice: sa Bundok Heres
  rationale: Pinananatili ang pangalang pook na Heres at isinasalin ang הַר bilang “Bundok,” nang hindi tiyakang nilulutas kung iisang bundok o mas malawak na bulubunduking distrito ang tinutukoy.
- source_word: בְּאַיָּלוֹן
  choice: sa Aijalon
  rationale: Transliterasyon ng pangalang pook.
- source_word: וּבְשַׁעַלְבִים
  choice: at sa Shaalbim
  rationale: Transliterasyon ng pangalang pook habang pinananatili ang pang-ugnay.
- source_word: וַתִּכְבַּד יַד
  choice: nang manaig
  rationale: Literal na “bumigat ang kamay,” isang idyomang tumutukoy sa lumalakas o mapaniil na kapangyarihan. Ang “manaig” ay malinaw at natural, habang inilalagay sa talababa ang literal na larawan at saklaw ng kahulugan.
- source_word: בֵּית יוֹסֵף
  choice: ang sambahayan ni Jose
  rationale: Pinananatili ang Hebreong katawagang pampagkamag-anak at pampolitika; tumutukoy ito sa mga liping nagmula kay Jose.
- source_word: וַיִּהְיוּ לָמַס
  choice: napasailalim sila sa sapilitang paggawa
  rationale: Ang מַס ay tumutukoy sa sapilitang paglilingkod o paggawa bilang tributo. Iniiwasan ng parirala ang di-natural na pahayag na para bang ang mga tao mismo ay “naging paggawa.”
