translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “mga Amoreo” bilang kolektibong katawagan, “sambahayan ni Jose” upang mapanatili ang anyong pampagkamag-anak, at “sapilitang paggawa” para sa madaling maunawaang paglalarawan ng compulsory labor service.
