base_translation:
  language: en
  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: tl
  text: Sinabi niya sa kanya, “Bigyan mo sana ako ng isang pagpapala. Yamang ibinigay mo sa akin ang lupain ng Negev[a], bigyan mo rin ako ng mga bukal ng tubig[b].” Kaya ibinigay ni Caleb sa kanya ang mga bukal sa itaas at ang mga bukal sa ibaba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupain sa timog.” Ang Hebreong negev ay maaaring tumukoy sa rehiyong tinatawag na Negev o sa tuyong lupain sa timog.
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang Hebreo ay maaaring tumukoy sa mga bukal, tipunan ng tubig, o iba pang pinagmumulan ng tubig. Ang “mga bukal” ang pinakaangkop sa konteksto ng tuyong rehiyong nangangailangan ng maaasahang suplay ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִּי
  choice: Bigyan mo sana ako
  rationale: Ang הָבָה kasama ng לִּי ay isang tuwirang pakiusap. Ipinahahayag ng “sana” ang magalang na paghiling nang hindi ginagawang pormal o labis ang pananalita.
- source_word: בְרָכָה
  choice: isang pagpapala
  rationale: Literal na nangangahulugang “pagpapala.” Bagaman tumutukoy rito sa isang kapaki-pakinabang na kaloob mula sa ama, pinananatili ng salin ang mismong larawan at ugnayang pampamilya sa Hebreo.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: ang lupain ng Negev
  rationale: Maaaring pangalan ng rehiyon o paglalarawan sa tuyong lupain sa timog ang נֶגֶב. Ginamit ang kilalang pangalang heograpiko at inilagay sa talababa ang tunay na alternatibo.
- source_word: גֻּלֹּת מָיִם
  choice: mga bukal ng tubig
  rationale: Tumutukoy ang parirala sa mga pinagmumulan ng tubig. Ang “mga bukal ng tubig” ay kongkreto, natural sa Tagalog, at angkop sa konteksto ng tuyong lupain, habang kinikilala sa talababa ang posibleng mas malawak na kahulugan.
- source_word: גֻּלֹּת עִלִּית
  choice: mga bukal sa itaas
  rationale: Ang עִלִּית ay “nasa itaas” o “mataas.” Pinananatili ang topograpikong pagtutugma nito sa mga bukal sa ibaba.
- source_word: גֻּלֹּת תַּחְתִּית
  choice: mga bukal sa ibaba
  rationale: Ang תַּחְתִּית ay “nasa ibaba” o “mababang bahagi.” Ang salin ay likas na katambal ng “mga bukal sa itaas.”
- source_word: וַיִּתֶּן לָהּ כָּלֵב
  choice: Kaya ibinigay sa kanya ni Caleb
  rationale: Isinusulong ng waw-consecutive ang salaysay at dito ay malinaw na tugon ang pagkakaloob sa naunang kahilingan; ang “Kaya” ay maayos na naghahayag ng daloy na iyon.
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mo” sapagkat nakikipag-usap ang anak sa kanyang ama at walang hiwalay na pangmaramihang/pormal na panghalip sa Hebreo; ang “sana” ang nagpapalambot sa pakiusap. Itinama ang pagkakalagay ng mga marker ayon sa nilalaman ng mga talababa: [a] sa “Negev” at [b] sa “mga bukal ng tubig.”'
