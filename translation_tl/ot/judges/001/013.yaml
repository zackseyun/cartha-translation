base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: tl
  text: Nasakop ni Otniel na anak ni Kenaz[a], ang nakababatang kapatid ni Caleb, ang lungsod. Ibinigay ni Caleb sa kanya ang kanyang anak na si Acsa upang maging asawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring: “Si Otniel na anak ni Kenaz, ang nakababatang kapatid ni Caleb,” o “ang nakababatang kamag-anak ni Caleb.” Pinakanatural na mabasa ang Hebreo bilang “kapatid ni Caleb, na mas bata sa kanya,” ngunit maaaring mas malawak ang kahulugan ng salitang tumutukoy sa kaugnayang pampamilya.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: Nabihag iyon
  rationale: Ang לָכַד ay karaniwang tumutukoy sa pagbihag o pagsakop sa isang lungsod. Ang hulaping pambabae ay tumutukoy sa lungsod na binanggit sa naunang talata; natural sa Tagalog ang “iyon” bilang pabalik na pagtukoy.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Transliterasyon ng pangalang Hebreo sa anyong madaling basahin sa modernong Tagalog.
- source_word: בֶּן קְנַז
  choice: anak ni Kenaz
  rationale: Tuwirang salin ng karaniwang pormulang pangangkanan na בֶּן, “anak ni.”
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: ang nakababatang kapatid ni Caleb
  rationale: 'Pinananatili ang pinakanatural na pagbasa ng Hebreo: “kapatid ni Caleb, na mas bata sa kanya.” Inilalagay sa talababa ang posibleng mas malawak na kahulugan ng terminong pangkamag-anakan.'
- source_word: וַיִּתֶּן לוֹ
  choice: Kaya ibinigay sa kanya ni Caleb
  rationale: Bagaman panghalip lamang ang paksa sa Hebreo, nilinaw bilang “ni Caleb” upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog. Ang “kaya” ay naghahayag ng bunga ng tagumpay ayon sa pangako sa naunang talata.
- source_word: עַכְסָה
  choice: Acsa
  rationale: Transliterasyon ng pangalang Hebreo sa anyong angkop sa ortograpiyang Tagalog.
- source_word: בִתּוֹ
  choice: ang anak nitong si Acsa
  rationale: Ang anak na tinutukoy ay anak ni Caleb. Ginamit ang “nitong” upang malinaw ang kaugnayan nang hindi paulit-ulit ang pangalan.
- source_word: לְאִשָּׁה
  choice: upang maging asawa niya
  rationale: Natural at marangal na Tagalog para sa idyomang nangangahulugang ibinigay sa pag-aasawa.
theological_decisions:
- issue: Kaugnayang pampamilya ni Otniel kay Caleb
  choice: Inilalarawan si Otniel sa pangunahing teksto bilang nakababatang kapatid ni Caleb.
  alternative: Maaaring unawain si Otniel bilang nakababatang kamag-anak ni Caleb; may mga pagbasa ring inuugnay ang “anak ni Kenaz” sa kapatid ni Caleb.
  rationale: Pinakanatural sa sintaks ng Hebreo ang “kapatid ni Caleb, na mas bata sa kanya.” Gayunman, maaaring gamitin nang mas malawak ang salitang pangkamag-anakan, kaya pinananatili sa talababa ang tunay na kalabuan sa halip na lutasin ito nang tahimik.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “nabihag” para sa militar na pagsakop at nilinaw ang paksa bilang Caleb upang maiwasan ang kalituhan sa mga panghalip. Ang mga pangalang Otniel, Kenaz, Caleb, at Acsa ay isinaayos sa madaling basahing anyong Tagalog.
