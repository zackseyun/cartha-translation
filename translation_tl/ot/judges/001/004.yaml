id: JDG.1.4
reference: Judges 1:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֣עַל יְהוּדָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת הַ/כְּנַעֲנִ֥י וְ/הַ/פְּרִזִּ֖י בְּ/יָדָ֑/ם וַ/יַּכּ֣וּ/ם בְּ/בֶ֔זֶק עֲשֶׂ֥רֶת אֲלָפִ֖ים אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: tl
  text: Umakyat ang Juda, at ibinigay ni Yahweh ang mga Cananeo at mga Perezeo[a] sa kanilang kamay[b]. Pinabagsak nila sa Bezek ang sampung libong lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pang-isahan ang “Cananeo” at “Perezeo,” ngunit ginagamit ang mga ito bilang kolektibong katawagan sa mga bayan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa kanilang kamay,” isang idyomang nangangahulugang nasa ilalim ng kanilang kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Umakyat
  rationale: Pinananatili ang karaniwang diwa ng עלה na pag-akyat o pagpunta paitaas, na maaari ring tumukoy sa pagsulong ng hukbo, nang hindi tahasang ipinapalit ang mas interpretatibong “sumalakay.”
- source_word: יְהוּדָה
  choice: ang Juda
  rationale: Pangalan ng lipi na itinuturing na kolektibong pangkat; ang “Juda” ang karaniwang anyong Tagalog ng pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Tagalog ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: ang mga Cananeo at mga Perezeo
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo ang gamit ng mga katawagang etniko sa konteksto; natural itong ipinahahayag sa Tagalog sa anyong maramihan.
- source_word: בְּיָדָם
  choice: sa kanilang kamay
  rationale: Pinananatili ang larawang Hebreo ng pagbibigay sa “kamay,” na sa konteksto ay nangangahulugang pagpapasailalim sa kapangyarihan nila.
- source_word: וַיַּכּוּם
  choice: Pinabagsak nila
  rationale: Ipinahahayag ang puwersa ng נכה sa labanan nang hindi lubusang nililimitahan ang kahulugan sa “pinatay” o pinahihina ito bilang “tinalo” lamang.
- source_word: בְּבֶזֶק
  choice: sa Bezek
  rationale: Natural na pananda sa Tagalog para sa lugar na pinangyarihan ng labanan.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: ang sampung libong lalaki
  rationale: Malapit sa tahasang bilang at kasariang ipinahahayag ng Hebreo; hindi idinaragdag ang interpretatibong “kawal.”
theological_decisions:
- issue: Pagpapahayag sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Ugnayan ng pagkilos ng Diyos at ng mga mandirigma
  choice: Si Yahweh ang nagbigay sa mga kaaway sa kanilang kamay; ang pangkat ng Juda ang nagpabagsak sa kanila.
  alternative: Gawing iisang ahente lamang ang Juda sa buong pangungusap o gawing balintiyak ang huling sugnay.
  rationale: Pinananatili ang pagkakaiba sa Hebreo sa pagitan ng pagkilos ni Yahweh na nagbibigay ng tagumpay at ng pagkilos ng mga tao sa labanan.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang “umakyat” bilang larawan ng pagkilos ng hukbo at ang “sa kanilang kamay” bilang idyomang Hebreo, habang nililinaw sa talababa ang kolektibong anyo ng mga katawagang etniko at ang kahulugan ng idyoma.
