  source_fidelity: 'Tumpak na naipapahayag ang pagkakasunod at mga ahente sa Hebreo: umakyat ang Juda; ibinigay ni Yahweh ang mga pangkat ng kaaway sa kanilang kapangyarihan; at sila ang nagpabagsak sa sampung libong lalaki sa Bezek. Hindi nito pinipilit ang וַיַּכּוּם na mangahulugang tiyak na ‘pinatay.’'
  naturalness: Makabago, malinaw, at angkop ang marangal na rehistro. Ang ‘Umakyat ang Juda’ ay bahagyang literal ngunit natural at nararapat, sapagkat pinananatili nito ang larawan ng Hebreo nang walang labis na interpretasyon. Ang ‘Pinabagsak nila’ ay katanggap-tanggap na pagpapahayag ng kilos sa labanan.
  terminology: Wasto at pare-pareho ang ‘Juda,’ ‘Yahweh,’ ‘Cananeo,’ ‘Perezeo,’ at ‘Bezek.’ Ang pangmaramihang mga katawagang etniko ay angkop sa kolektibong gamit ng mga pang-isahang anyong Hebreo. Maayos ding napanatili ang idyomang ‘sa kanilang kamay,’ at sapat ang paliwanag sa talababa.
