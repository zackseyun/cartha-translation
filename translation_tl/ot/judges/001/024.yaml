base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: tl
  text: Nakita ng mga nagmamanman ang isang lalaking lumalabas sa lungsod. Sinabi nila sa kanya, “Pakipakita mo sa amin ang pasukan sa lungsod[a], at pakikitunguhan ka namin nang mabuti[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang daan papasok sa lungsod.”
    reason: lexical_alternative
  - marker: b
    text: Hebreo, hesed; maaari itong mangahulugang “kabutihan,” “katapatan,” o “matatag na pag-ibig,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: mga nagmamanman
  rationale: Ang participle mula sa שמר ay tumutukoy sa mga taong nagbabantay o nagmamasid sa labas ng lungsod. Ang “mga nagmamanman” ay likas sa kontekstong militar at hindi nagpapahiwatig na sila ang mga bantay ng lungsod.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tuwirang tumutukoy ang pangngalang panlalaki sa isang indibidwal na lalaki.
- source_word: יוֹצֵא
  choice: lumalabas
  rationale: Ipinahihiwatig ng participle ng יצא ang paggalaw mula sa loob ng lungsod patungo sa labas; natural itong ipinapahayag sa Filipino bilang “lumalabas.”
- source_word: מְבוֹא
  choice: pasukan
  rationale: Ang מְבוֹא ay isang pasukan o daang mapapasukan. Maikli at kongkreto ang “pasukan,” habang pinananatili ng talababa ang posibleng diwang “daan papasok.”
- source_word: נָא
  choice: paki- sa “Pakipakita”
  rationale: Ang נָא ay nagpapalumanay sa utos. Likas na naihahatid sa modernong Filipino ang magalang na pakiusap sa pamamagitan ng unlaping “paki-.”
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: pagpapakitaan ka namin ng kabutihan
  rationale: Sa usapang ito, ang חֶסֶד ay tumutukoy sa ipinangakong mabuting pakikitungo o awa kapalit ng impormasyon. Hindi nito kailangang ipahiwatig dito ang mas teknikal na diwa ng katapatan sa tipan.
theological_decisions:
- issue: Pagkakasalin ng חֶסֶד
  choice: kabutihan o mabuting pakikitungo
  alternative: tapat na pag-ibig; katapatan sa tipan
  rationale: Bagaman maaaring magtaglay ang חֶסֶד ng diwa ng matatag na pag-ibig o katapatan sa tipan sa ibang konteksto, sa salaysay na ito ay pinakanatural itong unawain bilang awa o mabuting pakikitungo sa lalaki. Iniiwasan ng salin ang pagpasok ng mas mabigat na teolohikal na kahulugan kaysa sa hinihingi ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga nagmamanman” sa halip na “mga bantay” upang hindi mapagkamalang mga tagapagtanggol sila ng lungsod. Isinama ang paggalang ng נָא sa likas na anyong “Pakipakita.”
