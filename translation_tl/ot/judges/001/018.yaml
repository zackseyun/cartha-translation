  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
translation:
  language: tl
  text: Sinakop ng Juda ang Gaza at ang teritoryo nito[a], ang Ascalon at ang teritoryo nito, at ang Ekron at ang teritoryo nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hangganan nito” sa bawat paglitaw ng “teritoryo nito”; ang salitang Hebreo ay maaaring tumukoy sa hangganan o sa teritoryong nasa loob nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: Sinakop
  rationale: Ang pandiwang לכד ay tumutukoy sa pagkuha o pagbihag sa isang lungsod o lugar, karaniwan sa pamamagitan ng puwersang militar. Ang “sinakop” ay natural at malinaw sa kontekstong ito.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ang pangalang pantangi ay kumakatawan dito sa lipi bilang isang pangkat. Pinananatili ng “Juda” ang anyo ng Hebreo nang hindi idinaragdag sa pangunahing teksto ang paliwanag na “lipi ng Juda.”
- source_word: גְּבוּלָהּ
  choice: ang nasasakupan nito
  rationale: Ang גְּבוּל ay maaaring mangahulugang hangganan o teritoryong saklaw ng hangganan. Sa talaan ng mga nasakop na lungsod, natural na ipinahihiwatig ng “nasasakupan” ang lupaing kaugnay at nasa ilalim ng lungsod, habang pinananatili sa talababa ang alternatibong “hangganan.”
- source_word: עַזָּה
  choice: Gaza
  rationale: Karaniwang anyo ng pangalan ng lugar sa makabagong Filipino.
- source_word: אַשְׁקְלוֹן
  choice: Ascalon
  rationale: Nakaugaliang anyo ng pangalan ng lugar sa Filipino; malinaw at madaling basahin.
- source_word: עֶקְרוֹן
  choice: Ekron
  rationale: Tuwirang transliterasyon na natural sa Filipino.
