  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ יְהוּדָה֙ אֶת שִׁמְע֣וֹן אָחִ֔י/ו וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב צְפַ֑ת וַ/יַּחֲרִ֣ימוּ אוֹתָ֔/הּ וַ/יִּקְרָ֥א אֶת שֵׁם הָ/עִ֖יר חָרְמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: tl
  text: Pagkatapos, sumama ang Juda sa kapatid niyang si Simeon. Nilupig nila ang mga Cananeo na naninirahan sa Zefat at itinalaga ang lunsod sa ganap na paglipol.[a] Kaya tinawag niya itong Horma.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lubusang winasak ang lunsod” o “isinailalim ang lunsod sa pagbabawal.” Ang pandiwang Hebreo ay tumutukoy sa di-mababawing pagtatalaga ng isang bagay, na madalas isinasagawa sa pamamagitan ng paglipol.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “tinawag niya.” Maaaring tumukoy ang isahang pandiwa sa Juda bilang isang kolektibong pangkat o sa kinatawan nito. Kaya isinasalin din ng ilan na “tinawag nila.”
    reason: alternative_reading
  - marker: c
    text: Ang Horma ay katunog ng salitang Hebreo para sa isang bagay na itinalaga sa paglipol (ḥerem), kaya ipinapaliwanag nito ang pangalan ng lunsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: sumama ang Juda sa kapatid niyang si Simeon
  rationale: Ang אֶת kasunod ng הלך ay nagpapahayag dito ng pagsama. Natural sa modernong Tagalog ang “sumama ... sa,” at pinananatili ang “Juda” bilang kolektibong pangalan nang hindi idinaragdag sa teksto ang “lipi.”
- source_word: וַיַּכּוּ
  choice: nilupig nila
  rationale: Sa salaysay ng digmaan, ang נכה ay tumutukoy sa mapagpasyang pananakit o pagkatalo ng kaaway. Ang “nilupig” ay malinaw at hindi nagpapalagay na bawat indibidwal ay tahasang pinatay ng pandiwang ito lamang.
- source_word: הַכְּנַעֲנִי יֹשֵׁב צְפַת
  choice: ang mga Cananeo na naninirahan sa Zefat
  rationale: Bagaman anyong isahan ang gentiliko sa Hebreo, kolektibo ang gamit nito rito, gaya ng ipinahihiwatig ng pandiwang maramihan. Ang participle na יֹשֵׁב ay likas na isinaling “naninirahan.”
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: itinalaga ang lunsod sa ganap na paglipol
  rationale: 'Pinananatili ng “itinalaga ... sa ganap na paglipol” ang dalawang sangkap ng חרם: ang di-mababawing pagtatalaga at ang pagwasak. Nilinaw na “ang lunsod” ang tinutukoy ng pambabaeng panghalip sa Hebreo.'
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: tinawag niya itong
  rationale: Isahan ang anyo ng pandiwa sa Hebreo. Ang “niya” ay nagpapanatili nito at maaaring tumukoy sa Juda bilang kolektibong paksa o kinatawan nito; ang mas mahabang pormulang “tinawag ang pangalan ng lunsod” ay pinaikli upang maging likas sa Tagalog.
- source_word: חָרְמָה
  choice: Horma
  rationale: Isinalin bilang pangalang pantangi ayon sa karaniwang anyong Filipino, habang ipinaliliwanag sa talababa ang tunog-kaugnayan nito sa salitang Hebreo para sa bagay na itinalaga sa paglipol.
theological_decisions:
- issue: Kahulugan ng חרם sa konteksto ng banal na digmaan
  choice: itinalaga ang lunsod sa ganap na paglipol
  alternative: lubusang winasak ang lunsod / isinailalim ang lunsod sa pagbabawal
  rationale: Hindi pinapantay ang חרם sa karaniwang pagwasak lamang. Pinananatili ng salin ang tensiyon sa pagitan ng sagradong pagtatalaga at ng aktuwal na paglipol, nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Isahang pandiwa sa pagbibigay ng pangalan matapos ang maramihang pagkilos
  choice: tinawag niya
  alternative: tinawag nila
  rationale: Ang וַיִּקְרָא ay morpolohikal na isahan, kaya pinanatili ito sa pangunahing teksto. Ipinaliliwanag sa talababa na maaaring kolektibong tumukoy ito sa Juda, sa halip na tahimik na gawing maramihan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lunsod” at “naninirahan” para sa dignidad ng salaysay, ngunit iniwasan ang labis na pormal o teknikal na pananalita. Ang mga pangalang “Juda,” “Simeon,” “Zefat,” at “Horma” ay nasa karaniwang anyong Filipino.
