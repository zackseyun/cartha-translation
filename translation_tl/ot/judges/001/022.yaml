id: JDG.1.22
reference: Judges 1:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעֲל֧וּ בֵית יוֹסֵ֛ף גַּם הֵ֖ם בֵּֽית אֵ֑ל וַֽ/יהוָ֖ה עִמָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: tl
  text: Umahon din ang sambahayan ni Jose laban sa Bethel[a], at kasama nila si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungong Bethel.” Literal na “umahon” ang pandiwang Hebreo, ngunit sa kontekstong militar ay malamang na tumutukoy ito sa pagsulong laban sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Umahon ... laban sa
  rationale: Ang עָלָה ay literal na “umahon,” ngunit sa kontekstong militar ay tumutukoy sa pagsulong laban sa isang lugar. Pinananatili ng salin ang larawan ng pag-ahon at nililinaw ang paglusob sa pamamagitan ng “laban sa.”
- source_word: בֵית יוֹסֵף
  choice: ang sambahayan ni Jose
  rationale: Pormal na katawagang panlipi ang parirala. Ang “sambahayan ni Jose” ay natural sa Filipino at hindi ito nililimitahan sa agarang pamilya lamang.
- source_word: גַּם הֵם
  choice: din
  rationale: Iniuugnay nito ang kilos ng sambahayan ni Jose sa mga naunang kampanyang isinalaysay; natural itong ipinahahayag sa Filipino sa pamamagitan ng “din.”
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Ginamit ang nakasanayang transliterasyon ng pangalan ng lugar.
- source_word: וַיהוָה
  choice: si Yahweh
  rationale: Direktang pinananatili ang pangalang tipan na יהוה sa halip na palitan ito ng isang titulo.
- source_word: עִמָּם
  choice: kasama nila
  rationale: Tuwirang ipinahahayag ang presensiya at pagsuporta ng Diyos nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” upang hindi ito gawing titulo.
- issue: Kahulugan ng pagsama ni Yahweh
  choice: kasama nila si Yahweh
  alternative: kakampi nila si Yahweh
  rationale: Pinananatili ng “kasama nila” ang saklaw ng עִמָּם—presensiya at pahiwatig ng pagtulong—nang hindi tahasang nilulutas ito bilang suporta lamang sa digmaan.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Pinanatili ang pormal na katawagang panlipi na “sambahayan ni Jose,” ang larawang “umahon,” at ang pangalang “Yahweh.”
