  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: tl
  text: Ngunit tumakas si Adoni-bezek. Hinabol nila siya, dinakip, at pinutol ang mga hinlalaki sa kanyang mga kamay at ang malalaking daliri sa kanyang mga paa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang mga hinlalaki ng kanyang mga kamay at mga paa”; ang salita ay tumutukoy sa mga hinlalaki ng kamay at sa malalaking daliri ng paa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: tumakas
  rationale: Ang נוּס ay tumutukoy sa pagtakas o paglayo upang makaiwas; ang “tumakas” ay natural at hindi nagpapahiwatig na matagumpay siyang nakaligtas.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-bezek
  rationale: Pinanatili bilang pangalan o titulong ginagamit na pangalan sa konteksto, sa halip na isalin bilang “Panginoon ng Bezek.”
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: Hinabol nila siya
  rationale: Likas na salin sa modernong Tagalog ng רדף + אַחַר, na malinaw na nagpapahayag ng pagtugis.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: dinakip
  rationale: Ipinahihiwatig ng אחז ang sapilitang paghawak o pagsunggab; sa kontekstong ito, ang “dinakip” ang malinaw na katumbas.
- source_word: וַיְקַצְּצוּ
  choice: pinutol
  rationale: Sa konteksto ng mga bahagi ng katawan, ang קצץ ay nangangahulugang putulin o tanggalin sa pamamagitan ng pagputol.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: mga hinlalaki niya sa kamay at paa
  rationale: Ang בֹּהֶן ay tumutukoy sa hinlalaki kapag kamay ang tinutukoy at sa malaking daliri kapag paa; ang literal na anyo ng Hebreo ay pinanatili sa pangunahing teksto nang natural sa Tagalog, habang nililinaw sa talababa ang eksaktong kahulugan.
