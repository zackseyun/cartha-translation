translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignified, at angkop sa salaysay. Ginamit ang maiikling pandiwang “tumakas,” “hinabol,” “dinakip,” at “pinutol” upang mapanatili ang mabilis na daloy ng magkakasunod na kilos sa Hebreo.
