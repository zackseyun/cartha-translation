base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: tl
  text: Hindi pinalayas ng lipi ni Aser ang mga naninirahan sa Aco[a], ni ang mga naninirahan sa Sidon, ni ang mga taga-Ahlab, Akzib, Helbah, Afek, at Rehob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi inagawan ng lupain” o “hindi itinaboy.” Ang pandiwang Hebreo ay tumutukoy sa pagpapaalis sa mga dating naninirahan upang mawalan sila ng paghawak sa lupain. Ang Aco ay ang sinaunang lungsod sa baybayin na nakilala nang dakong huli bilang Acre.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: אָשֵׁר
  choice: ang lipi ni Aser
  rationale: Bagaman pangalan lamang na “Aser” ang nasa Hebreo, sa konteksto ng talaan ng mga lipi ang tinutukoy ay ang lipi ni Aser; natural at malinaw ito sa modernong Tagalog.
- source_word: לֹא הוֹרִישׁ
  choice: Hindi pinalayas
  rationale: Ang Hiphil ng ירש sa konteksto ng pagsakop sa lupain ay tumutukoy sa pagpapaalis sa dating mga naninirahan at pagkawala ng kanilang pag-aari sa lupain. Ang “pinalayas” ay natural at tuwiran sa Tagalog, habang inilalahad sa talababa ang alternatibong diwa na “hindi inalisan ng pag-aari.”
- source_word: יֹשְׁבֵי
  choice: mga naninirahan sa
  rationale: Tinutukoy ng participle ng ישב ang mga taong nananahan sa isang lugar; ang pariralang ito ay malinaw at likas sa modernong Tagalog.
- source_word: עַכּוֹ
  choice: Aco
  rationale: Pangalan ng lugar na isina-Tagalog ang baybay ayon sa tunog; hindi ginamit ang mas huling pangalang Acre.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Karaniwang anyong Tagalog ng pangalan ng sinaunang lungsod.
- source_word: אַחְלָב
  choice: Ahlab
  rationale: Pangalan ng lugar na tinumbasan sa transliterasyon.
- source_word: אַכְזִיב
  choice: Aczib
  rationale: Pangalan ng lugar; pinanatili ang tunog ng Hebreong כז sa anyong madaling basahin sa Tagalog.
- source_word: חֶלְבָּה
  choice: Helba
  rationale: Sinusunod ang anyong Hebreo sa talatang ito sa halip na ang baryanteng Heleb.
- source_word: אֲפִיק
  choice: Afek
  rationale: Transliterasyon ng pangalan ng lugar sa anyong likas basahin sa Tagalog.
- source_word: רְחֹב
  choice: Rehob
  rationale: Transliterasyon ng pangalan ng lugar; pinanatili ang nakaugaliang h upang katawanin ang katinig na Hebreo.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: ni ang ... at ...
  rationale: Sa ilalim ng negatibong pandiwa, ang “ni ang” ay malinaw na nagpapakitang saklaw din ng hindi pagpapaalis ang ikalawang pangkat; pagkatapos nito, natural na listahan sa Tagalog ang pinag-uugnay ng mga kuwit at panghuling “at.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “lipi ni Aser” upang maging malinaw ang kolektibong tinutukoy sa konteksto. Pinagsama sa iisang talababa sa Aco ang leksikal na paliwanag at maikling tala tungkol sa lugar, sapagkat ang ibinigay na English consultation layer ay may hindi nagtutugmang marker at footnote assignment.
