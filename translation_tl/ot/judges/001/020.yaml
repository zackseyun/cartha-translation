base_translation:
  language: en
  yaml_path: translation/ot/judges/001/020.yaml
  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: tl
  text: Ibinigay nila kay Caleb ang Hebron, gaya ng sinabi ni Moises, at pinalayas niya mula roon ang tatlong anak ni Anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang tatlong inapo ni Anak” o “ang tatlong Anakim.” Sa Hebreo, “mga anak ni Anak,” na maaaring tumukoy sa mga inapo o kasapi ng angkan, hindi lamang sa mismong mga anak niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ibinigay nila
  rationale: Ang wayyiqtol ng נתן ay payak na salaysay ng nakaraang pangyayari. Natural sa modernong Tagalog ang “Ibinigay nila,” at hindi kailangang isalin nang hiwalay ang panimulang וַ bilang “At.”
- source_word: לְכָלֵב
  choice: kay Caleb
  rationale: Tinutukoy ng לְ ang di-tuwirang layon; pinanatili ang personal na pangalang Caleb sa karaniwang anyo nito.
- source_word: אֶת חֶבְרוֹן
  choice: ang Hebron
  rationale: Ang אֶת ay pananda ng tiyak na tuwirang layon at ang חֶבְרוֹן ay pangalan ng lugar. Sapat at natural ang payak na “ang Hebron.”
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: gaya ng sinabi ni Moises
  rationale: Ang כַּאֲשֶׁר ay naghahayag ng paghahambing, at ang דִּבֶּר ay “nagsalita/nagsabi.” Hindi ginamit ang “ipinangako” sapagkat mas tiyak iyon kaysa sa mismong Hebreo.
- source_word: וַיּוֹרֶשׁ
  choice: at pinalayas niya
  rationale: Ang Hiphil ng ירש ay maaaring mangahulugang magtaboy o magpaalis upang maagaw ang pag-aari. Dahil mga tao ang layon dito, malinaw at natural ang “pinalayas.” Pinanatili ang pagkakasunod ng salaysay sa pamamagitan ng “at.”
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Tumutukoy ang pariralang ito pabalik sa Hebron at tuwirang pinananatili ang di-tiyak na pagtukoy ng Hebreo.
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: ang tatlong anak ni Anak
  rationale: Literal na “mga anak ni Anak” ang בְּנֵי הָעֲנָק. Pinanatili ang anyong ito sa pangunahing teksto, habang inilalahad sa talababa na maaari itong tumukoy sa mga inapo o kasapi ng angkan.
