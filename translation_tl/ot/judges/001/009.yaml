  text: וְ/אַחַ֗ר יָֽרְדוּ֙ בְּנֵ֣י יְהוּדָ֔ה לְ/הִלָּחֵ֖ם בַּֽ/כְּנַעֲנִ֑י יוֹשֵׁ֣ב הָ/הָ֔ר וְ/הַ/נֶּ֖גֶב וְ/הַ/שְּׁפֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: tl
  text: Pagkatapos nito, bumaba ang mga anak ni Juda upang makipaglaban sa mga Cananeo na naninirahan sa kaburulan, sa Negev, at sa mababang lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Shephelah,” ang rehiyon ng paanan ng mga burol ng Juda, sa pagitan ng kaburulan at ng kapatagang baybayin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Pagkatapos nito
  rationale: Ipinapahayag ang kasunod na pangyayari nang hindi tinutukoy kung gaano katagal ang pagitan.
- source_word: יָרְדוּ
  choice: bumaba
  rationale: Pinananatili ang tahasang direksiyong heograpikal ng pandiwang ירד, hindi lamang ang pangkalahatang diwang ‘pumunta.’
- source_word: בְּנֵי יְהוּדָה
  choice: mga anak ni Juda
  rationale: Malapit ito sa literal na anyo at tumutukoy nang pangkatan sa mga kabilang sa lipi ni Juda.
- source_word: לְהִלָּחֵם
  choice: upang makipaglaban
  rationale: Likas na modernong Tagalog para sa layuning ipinahahayag ng pawatas na Niphal ng לחם.
- source_word: בַּכְּנַעֲנִי
  choice: sa mga Cananeo
  rationale: Bagaman pang-isahan ang anyong Hebreo, pangkatan ang tinutukoy nitong bansang Cananeo; malinaw na ipinahihiwatig ng ‘makipaglaban sa’ ang labanang salungatan.
- source_word: יוֹשֵׁב
  choice: na naninirahan
  rationale: Ipinahahayag ang patuloy na paninirahan na tinutukoy ng participle ng ישב.
- source_word: הָהָר
  choice: kaburulan
  rationale: Sa heograpikong talaang ito, tumutukoy ang salita sa upland o hill-country region, hindi lamang sa isang bundok.
- source_word: הַנֶּגֶב
  choice: Negev
  rationale: Pangalan ito rito ng isang tiyak na heograpikong rehiyon, kaya mas eksakto ang transliterasyon kaysa sa pangkalahatang ‘timog.’
- source_word: הַשְּׁפֵלָה
  choice: mababang lupain
  rationale: Madaling maunawaang salin ng rehiyong mababa o paanan ng kaburulan; inilalahad sa talababa ang teknikal na pangalang Shephelah.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang topograpikong ‘bumaba,’ ang kolektibong ‘mga anak ni Juda,’ at ang pangalang Negev. Inilagay ang marker [a] kaagad pagkatapos ng pariralang tinutukoy nito.
