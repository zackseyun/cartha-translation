  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/הּ וַ/תְּסִיתֵ֨/הוּ֙ לִ/שְׁא֤וֹל מֵֽ/אֵת אָבִ֨י/הָ֙ הַ/שָּׂדֶ֔ה וַ/תִּצְנַ֖ח מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/יֹּֽאמֶר לָ֥/הּ כָּלֵ֖ב מַה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: tl
  text: Nang dumating siya, hinimok niya ang asawa niya[a] na humingi ng bukid sa kanyang ama. Pagkatapos, bumaba siya mula sa asno[b]. Tinanong siya ni Caleb, “Ano ang kailangan mo?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay maaari ring isaling “hinikayat” o “inudyukan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lumusong siya mula sa asno”; maaaring magpahiwatig ang pandiwang Hebreo ng bigla o mariing pagbaba.
    reason: lexical_alternative
  - marker: c
    text: Literal sa Hebreo, “Ano ang sa iyo?” Maaari rin itong mangahulugang “Ano ang gusto mo?” o “Ano ang problema?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: Nang dumating siya
  rationale: 'Ang ב na ikinabit sa infinitive construct, kasama ang hulaping 3fs, ay bumubuo ng temporal na sugnay: “nang dumating siya.”'
- source_word: וַתְּסִיתֵהוּ
  choice: hinimok niya ang asawa niya
  rationale: Maaaring mangahulugan ang סות ng paghimok, paghikayat, o pag-udyok. Ang “hinimok” ay likas at hindi kinakailangang may negatibong pahiwatig. Ginawang hayag ang lalaking tinutukoy ng panghalip bilang “asawa niya” ayon sa agarang konteksto ng salaysay.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ הַשָּׂדֶה
  choice: na humingi ng bukid sa kanyang ama
  rationale: Sa kontekstong ito, ang שאל ... מֵאֵת ay paghiling ng isang bagay mula sa isang tao. Likas sa Filipino ang ayos na “humingi ng bukid sa kanyang ama.” Pinanatili ang tiyak na bukid na tinutukoy ng artikulo sa Hebrew.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: bumaba siya mula sa asno
  rationale: Ang צנח ay maaaring tumukoy sa pagbaba o biglang paglusong. Ang “bumaba” ang malinaw at natural na paglalarawan sa pagbaba mula sa sinasakyang asno, habang inilalagay sa talababa ang mas literal na posibilidad.
- source_word: מַה לָּךְ
  choice: Ano ang kailangan mo?
  rationale: Literal na “Ano ang sa iyo?” ang idyoma, ngunit sa konteksto ay tanong ito tungkol sa kanyang kailangan, suliranin, o kahilingan. Pinananatili ng “Ano ang kailangan mo?” ang bukas na saklaw nito nang hindi nililimitahan sa isang tahasang kagustuhan.
- source_word: כָּלֵב
  choice: Caleb
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “asno” bilang karaniwang terminong biblikal at ang “bukid” para sa tiyak na parsela ng lupa. Isinaayos ang mga marker ayon sa mismong salita o pariralang nililinaw ng bawat talababa.
