  source_fidelity: 'Tapat ang salin sa Hebreo: ang temporal na "Nang dumating siya," ang paghimok sa lalaki na humiling sa ama nito ng tiyak na bukid, ang pagbaba mula sa asno, at ang tanong ni Caleb ay lahat naipahayag. Ang pagtukoy sa lalaki bilang "asawa niya" ay sinusuportahan ng agarang konteksto (1:13) at hindi binabago ang kahulugan.'
