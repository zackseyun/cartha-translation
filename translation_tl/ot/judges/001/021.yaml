  text: וְ/אֶת הַ/יְבוּסִי֙ יֹשֵׁ֣ב יְרֽוּשָׁלִַ֔ם לֹ֥א הוֹרִ֖ישׁוּ בְּנֵ֣י בִנְיָמִ֑ן וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י בִנְיָמִן֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: tl
  text: Ngunit hindi pinalayas ng mga anak ni Benjamin ang mga Jebuseong naninirahan sa Jerusalem. Kaya hanggang sa araw na ito ay naninirahan ang mga Jebuseo kasama ng mga anak ni Benjamin sa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: mga Jebuseo
  rationale: Bagaman pang-isahang kolektibo ang anyong Hebreo, tumutukoy ito sa buong pangkat-etniko; natural sa Filipino ang pangmaramihang “mga Jebuseo.”
- source_word: יֹשֵׁב יְרוּשָׁלַם
  choice: naninirahan sa Jerusalem
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na paninirahan; malinaw at natural ang “naninirahan.”
- source_word: הוֹרִישׁוּ
  choice: pinalayas
  rationale: Sa konteksto ng pagsakop at paninirahan, ang pandiwa ay nangangahulugang paalisin o itaboy ang mga dating naninirahan.
- source_word: בְּנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili nito ang Hebreong anyong angkanin at tribo habang nananatiling malinaw sa modernong Filipino.
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Inilalarawan nito ang paninirahang nagsimula noon at, ayon sa kasunod na pormula, umabot sa panahon ng tagapagsalaysay.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: kasama ng mga anak ni Benjamin
  rationale: Dito ang אֶת ay nagpapahayag ng pakikisama o kapwa paninirahan, hindi pananda ng tuwirang layon.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Tapat at likas na salin ng pormulang tumutukoy sa pagpapatuloy hanggang sa panahon ng tagapagsalaysay.
- source_word: וְ
  choice: Ngunit
  rationale: Ang pangatnig ay may kontras na puwersa sa konteksto ng mga ulat tungkol sa pagsakop.
