revisions:
- from: Ngunit hindi pinalayas ng mga anak ni Benjamin ang mga Jebuseong naninirahan sa Jerusalem. Kaya nanirahan ang mga Jebuseo kasama ng mga anak ni Benjamin sa Jerusalem hanggang sa araw na ito.
  to: Ngunit hindi pinalayas ng mga anak ni Benjamin ang mga Jebuseong naninirahan sa Jerusalem. Kaya hanggang sa araw na ito ay naninirahan ang mga Jebuseo kasama ng mga anak ni Benjamin sa Jerusalem.
  rationale: Inayos lamang ang aspekto at ayos ng ikalawang pangungusap upang malinaw na maipakita ang patuloy na paninirahan hanggang sa panahon ng tagapagsalaysay, nang hindi binabago ang kahulugan, mga pangalan, o ang kolektibong pagtukoy sa mga Jebuseo.
