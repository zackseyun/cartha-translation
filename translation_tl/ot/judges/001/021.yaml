  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga anak ni Benjamin” upang mapanatili ang tribo at angkaning himig ng Hebreo; isinalin nang pangmaramihan ang kolektibong pang-isahang “Jebuseo” nang hindi na kailangan ng talababa.
