base_translation:
  language: en
  yaml_path: translation/ot/judges/001/002.yaml
  text: And the LORD said, “Judah shall go up. Look, I have given the land into his hand.”
translation:
  language: tl
  text: Sinabi ng PANGINOON, “Ang Juda ang aahon. Narito, ibinigay ko na ang lupain sa kamay niya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginamit ang nakaugaliang salin sa malaking titik para sa banal na pangalang YHWH, nang hindi nagpapasok ng isang tiyak na bigkas.
- source_word: יְהוּדָה יַעֲלֶה
  choice: Ang Juda ang aahon
  rationale: Pinananatili ang pandiwang 'aahon,' na sa kontekstong militar ay tumutukoy sa paglusob o pagsulong, habang ang 'ang' ay natural na nagbibigay-diin na Juda ang unang kikilos.
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Inihahayag ang pantawag-pansing puwersa ng Hebreong salita sa natural na modernong Tagalog.
- source_word: נָתַתִּי
  choice: ibinigay ko na
  rationale: Ang hulaping 'na' ay natural na naghahayag ng ganap na aspekto at ng katiyakan ng pagkakaloob.
- source_word: בְּיָדוֹ
  choice: sa kamay niya
  rationale: Pinananatili ang konkretong idyomang Hebreo na nagpapahiwatig ng kapangyarihan o pagkakaloob sa pagkontrol niya.
theological_decisions:
- issue: Ang banal na pangalang tetragrammaton
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ang malaking-titik na PANGINOON ay isang malinaw at malawak na kinikilalang kumbensiyon sa saling Bibliya; hindi nito ipinipilit ang pinagtatalunang eksaktong bigkas.
- issue: Ugnayan ng banal na pagkakaloob at nalalapit na pagsakop
  choice: “ibinigay ko na” kasabay ng utos na “aahon”
  alternative: “ibibigay ko”
  rationale: 'Pinananatili ang tensiyon ng orihinal: inihahayag ng Diyos na naibigay na ang lupain kahit kailangan pa itong sakupin ng Juda.'
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “aahon” upang mapanatili ang larawan ng Hebreo at ang kontekstong militar; ginamit ang “kamay niya” sa halip na ipaliwanag bilang “kapangyarihan niya,” upang hindi mawala ang idyoma ng pinagmulan.
