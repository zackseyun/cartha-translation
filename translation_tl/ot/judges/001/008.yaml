base_translation:
  language: en
  yaml_path: translation/ot/judges/001/008.yaml
  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: tl
  text: Nakipaglaban ang mga anak ni Juda[a] laban sa Jerusalem[b] at sinakop nila ito. Sinaktan nila ito sa pamamagitan ng talim ng tabak at sinunog ang lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak ni Juda”; kolektibong tumutukoy ito sa mga kabilang sa lipi ni Juda.
    reason: lexical_clarification
  - marker: b
    text: Maaari ring “sa Jerusalem,” ngunit mas ipinahihiwatig ng kasunod na pagsakop sa lungsod na ang kahulugan ay “laban sa Jerusalem.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ
  choice: Nakipaglaban ... laban sa
  rationale: Ang nifal ng לחם sa salaysay ay tumutukoy sa pakikipagdigma; kasama ng ב bago ang Jerusalem, ipinahihiwatig ng konteksto na ang lungsod ang tudlaan ng paglusob.
- source_word: בְנֵי יְהוּדָה
  choice: ang mga anak ni Juda
  rationale: Pinananatili ang literal na larawang pampamilya ng Hebreong 'mga anak ni Juda,' habang nililinaw sa talababa na kolektibong tumutukoy ito sa pangkat ng lipi ni Juda.
- source_word: וַיִּלְכְּדוּ אֹתָהּ
  choice: sinakop nila ito
  rationale: Ang לכד ay karaniwang nangangahulugang bihagin o sakupin ang isang lungsod; natural sa makabagong Tagalog ang 'sinakop' sa kontekstong militar.
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: Pinuksa nila ito sa talim ng tabak
  rationale: Ipinahahayag ng נכה ang marahas na pananakit o paglipol, at ang idyomang לְפִי חָרֶב, literal na 'sa bibig ng tabak,' ay natural na naihahatid bilang 'sa talim ng tabak.'
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: sinunog ang lungsod
  rationale: Ang idyomang שלח באש ay nangangahulugang ibigay sa apoy o sunugin; malinaw at natural ang 'sinunog' sa Tagalog.
