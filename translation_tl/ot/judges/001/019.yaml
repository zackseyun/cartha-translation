id: JDG.1.19
reference: Judges 1:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶתּ יְהוּדָ֔ה וַ/יֹּ֖רֶשׁ אֶת הָ/הָ֑ר כִּ֣י לֹ֤א לְ/הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י הָ/עֵ֔מֶק כִּי רֶ֥כֶב בַּרְזֶ֖ל לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: tl
  text: Kasama ng Juda si Yahweh, at nasakop ng Juda ang bulubunduking lupain. Ngunit hindi nito nagawang palayasin ang mga naninirahan sa lambak[a], sapagkat mayroon silang mga karwaheng bakal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapatagan” o “mababang lupain”; maaaring tumukoy ang salitang Hebreo sa isang malawak na mababang rehiyon.
    reason: Pinananatili ang posibleng heograpikong lawak ng עֵמֶק, na hindi laging nangangahulugang isang makitid na lambak.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos na kinakatawan ng YHWH sa tekstong Hebreo.
- source_word: אֶת־יְהוּדָה
  choice: kasama ng Juda
  rationale: Ang אֵת dito ay nagpapahayag ng pagsama. Pinanatili ang payak na “Juda,” na sa konteksto ay tumutukoy sa lipi ng Juda.
- source_word: וַיֹּרֶשׁ
  choice: nasakop ng Juda
  rationale: Ang Hiphil ng ירש ay maaaring mangahulugang angkinin, sakupin, o paalisin ang dating naninirahan. Dahil ang tuwirang layon ay ang bulubunduking lupain, natural dito ang “nasakop.” Inulit ang “Juda” upang maging malinaw ang tinutukoy na gumaganap.
- source_word: הָהָר
  choice: ang bulubunduking lupain
  rationale: Sa heograpikong konteksto, tumutukoy ito sa mataas at mabundok na rehiyon, hindi sa iisang bundok.
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: Ngunit hindi nito nagawang palayasin
  rationale: Pinaikli at eliptikal ang Hebreo. Ipinahihiwatig ng kasunod na dahilan ang kabiguang mapaalis ang mga naninirahan; ginamit ang “ngunit” upang ipakita ang kaibahan sa naunang tagumpay.
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: ang mga naninirahan sa lambak
  rationale: Natural na salin ito ng participial na parirala. Ang עֵמֶק ay karaniwang “lambak,” bagaman maaari rin itong tumukoy sa malawak na kapatagan o mababang lupain.
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: sapagkat mayroon silang mga karwaheng bakal
  rationale: Malinaw na ipinahahayag nito sa modernong Tagalog ang pag-aari at ang dahilan ng kanilang kalamangan sa labanan, habang pinananatili ang maigsi at literal na paglalarawan ng Hebreo.
theological_decisions:
- issue: Ang gumaganap at ang ipinahihiwatig na kawalan ng kakayahan sa ikalawang sugnay
  choice: Itinuring ang Juda bilang hindi nagawang magpalayas sa mga naninirahan sa lambak.
  alternative: Isalin lamang na “ngunit hindi pinalayas ng Juda,” nang hindi tahasang ipinahihiwatig ang kawalan ng kakayahan.
  rationale: Bagaman eliptikal ang Hebreo, ang kasunod na dahilan—ang kanilang mga karwaheng bakal—ay likas na nagpapahiwatig na hindi nagtagumpay ang Juda. Pinananatili nito ang tensiyon sa pagitan ng pahayag na kasama ng Juda si Yahweh at ng kabiguan nitong sakupin ang lambak, sa halip na lutasin o pagaanin iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bulubunduking lupain” bilang likas na heograpikong katawagan at ang “karwaheng bakal” upang manatiling malapit sa maikli at matinding paglalarawan ng Hebreo. Inilipat ang talababa sa “lambak,” ang salitang aktuwal na tinutukoy ng leksikal na paliwanag.
