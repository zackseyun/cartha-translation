  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “mga Heteo” bilang nakagawiang katawagan sa pangkat-etniko, at hinati ang mahabang daloy ng Hebreo sa dalawang pangungusap upang maging natural sa Filipino habang pinananatili ang ugnayan ng mga pangyayari.
