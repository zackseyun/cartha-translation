base_translation:
  language: en
  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: tl
  text: At pumunta ang lalaki sa lupain ng mga Heteo. Nagtayo siya roon ng isang lungsod at pinangalanan niya itong Luz[a]; iyon ang pangalan nito hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tinawag niyang Luz ang pangalan nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Karaniwang anyong pasalaysay ng הלך; natural na ipinahahayag ng “pumunta” ang pagkilos patungo sa lupain ng mga Heteo.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Tiyak at panlalaking pangngalan ito na tumutukoy sa lalaking nabanggit sa naunang talata.
- source_word: אֶרֶץ הַחִתִּים
  choice: sa lupain ng mga Heteo
  rationale: Pinananatili ang literal na heograpiko-etnikong diwa ng “lupain ng mga Heteo” nang hindi tinutukoy nang higit sa teksto ang katayuang politikal ng lugar.
- source_word: וַיִּבֶן עִיר
  choice: Nagtayo siya roon ng isang lungsod
  rationale: Tuwirang katumbas ng בנה at עִיר ang “nagtayo” at “lungsod.” Idinagdag ang “roon” bilang likas na pang-ugnay sa Filipino, na tumutukoy lamang sa nabanggit na lupain.
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: pinangalanan niya itong Luz
  rationale: Likas na salin sa Filipino ng Hebreong idyomang literal na “tinawag niya ang pangalan nito na Luz.”
- source_word: לוּז
  choice: Luz
  rationale: Isinalin sa baybay-transliterasyon ang pangalan ng lugar sa halip na bigyan ito ng kahulugang wala sa mismong pahayag.
- source_word: הוּא שְׁמָהּ
  choice: iyon ang pangalan nito
  rationale: Ang panghalip na הוּא ay gumaganap nang paturol o madiin sa sugnay na walang pandiwa; pinananatili ng “iyon” ang diin sa pangalang Luz.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Malapit sa anyo ng Hebreo at malinaw na karaniwang pahayag sa salaysay na Filipino.
