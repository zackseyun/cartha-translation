  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: tl
  text: Mula roon ay nagpunta siya upang labanan ang mga naninirahan sa Debir[a]. (Kiryat-Sefer ang dating pangalan ng Debir.)[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungo sa mga naninirahan sa Debir.” Ang salitang Hebreo ay literal na “sa/patungo sa,” ngunit sa salaysay na ito ng pananakop, ipinahihiwatig ng konteksto ang pagkilos laban sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Ang Kiryat-Sefer ang naunang pangalan ng Debir. Maaaring mangahulugan ang pangalan na “Lungsod ng Aklat,” “Lungsod ng Tagapagsulat,” o “Lungsod ng mga Tagapagsulat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: lumakad siya
  rationale: Payak na salaysay ng pagpunta o pagkilos mula sa isang lugar. Hindi ginawang “nagmartsa” upang hindi dagdagan ang tiyak na diwang militar na wala sa mismong pandiwa.
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Likas at tuwirang katumbas ng pariralang nagsasaad ng pinanggalingang lugar.
- source_word: אֶל
  choice: laban sa
  rationale: Karaniwan itong nangangahulugang “sa/patungo sa,” ngunit sa konteksto ng pananakop, ang pagkilos ay mapanlaban. Pinananatili sa talababa ang mas literal na posibilidad.
- source_word: יוֹשְׁבֵי
  choice: mga naninirahan sa
  rationale: Ang pandiwaring ginamit bilang pangngalan ay tumutukoy sa mga residente ng isang lugar; natural at malinaw ito sa modernong Filipino.
- source_word: דְּבִיר
  choice: Debir
  rationale: Isinalin-titik bilang pangalan ng lugar.
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: ang dating pangalan ng Debir
  rationale: Malinaw at likas na Filipino para sa sugnay na nagsasaad ng naunang pangalan ng lungsod.
- source_word: לְפָנִים
  choice: dating
  rationale: Ipinahahayag ang temporal na kahulugang “noong una” o “dati” sa natural na anyo.
- source_word: קִרְיַת סֵפֶר
  choice: Kiryat-Sefer
  rationale: Isinalin-titik bilang pangalan ng lugar; ang posibleng kahulugan nito ay inilagay sa talababa sa halip na ipalit sa pangalan.
