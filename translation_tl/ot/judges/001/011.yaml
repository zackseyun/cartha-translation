translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lumakad” upang manatiling malapit sa payak na pandiwang Hebreo, at “laban sa” upang maipakita ang kontekstong mapanlaban nang hindi ginagawang mas tiyak ang kilos kaysa sa pinagmulan. Ang panaklong ay pinanatili para sa paliwanag tungkol sa dating pangalan.
