translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “Cananeo” at mga baybay na “Juda,” “Kiriat-arba,” at “Sesai” na angkop sa ponolohiya at nakasanayang anyo sa Filipino. Inilagay ang paliwanag sa dating pangalan sa gitling na sugnay upang mapanatili ang daloy ng salaysay.
