base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: tl
  text: Pagkatapos, humayo ang Juda laban sa mga Cananeong naninirahan sa Hebron—Kiriat-arba ang dating pangalan ng Hebron[a]—at tinalo nila sina Sesai, Ahiman, at Talmai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Hebron ay dating tinatawag na Kiriat-arba.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tinalo” ay maaari ding isaling “pinabagsak” o “pinatay” sa kontekstong militar na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶל
  choice: sinalakay ng Juda
  rationale: Bagaman literal na “pumunta ang Juda laban sa,” ipinahihiwatig ng אֶל na may kalabang tinutungo sa salaysay-militar. Ang “sinalakay” ay natural sa Filipino at malinaw na naghahatid ng diwang militar.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ginamit ang pangalang “Juda” bilang kolektibong katawagan sa lipi, gaya ng singular na anyo sa Hebreo; ipinakikita naman ng “nila” sa kasunod na sugnay ang kolektibong diwa.
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Singular ang anyo sa Hebreo ngunit kolektibo ang gamit para sa pangkat ng mga tao; natural itong ipinahahayag sa Filipino sa maramihan.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: na naninirahan sa Hebron
  rationale: Ang participle ay tumutukoy sa patuloy o nakatatag na paninirahan; malinaw at kasalukuyang gamit ang “naninirahan.”
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע
  choice: Kiriat-arba ang dating pangalan ng Hebron
  rationale: Natural nitong ipinahahayag ang paliwanag tungkol sa naunang pangalan habang pinananatili ang pangalang-pook bilang transliterasyon.
- source_word: וַיַּכּוּ
  choice: tinalo nila
  rationale: Sa kontekstong militar, maaaring mangahulugan ang נכה ng pagdaig, pananakit, o pagpatay. Pinananatili ng “tinalo” ang saklaw nang hindi tiyak na ipinapalagay na pinatay ang tatlo.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: sina Sesai, Ahiman, at Talmai
  rationale: Isinalin sa karaniwang baybay-Filipino ang mga pangalang pantangi at ginamit ang pantukoy na “sina” para sa tatlong tao.
