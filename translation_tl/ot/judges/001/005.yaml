  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga tradisyonal at madaling makilalang anyong Filipino ng mga pangkat na Cananeo at Perezeo; ginamit ang Adoni-bezek bilang pangalang pantangi at inilagay ang leksikal na alternatibo sa talababa.
