base_translation:
  language: en
  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: tl
  text: Natagpuan nila si Adoni-bezek sa Bezek[a]. Nakipaglaban sila sa kanya at tinalo ang mga Cananeo at mga Perezeo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Adoni-bezek ay maaari ring unawain, batay sa pinagmulan ng pangalan, bilang “panginoon ng Bezek”; dito ay itinuring itong pangalan ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: Natagpuan nila
  rationale: Tuwirang ipinapahayag ng salitang מצא ang pagkakatagpo sa isang tao at natural ito sa salaysay na Filipino.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-bezek
  rationale: Pinanatili bilang pangalang pantangi ayon sa gamit nito sa salaysay, habang ipinaliliwanag sa talababa ang posibleng kahulugang batay sa mga sangkap ng pangalan.
- source_word: בְּבֶזֶק
  choice: sa Bezek
  rationale: Ang ב ay tumutukoy rito sa lokasyon; ang “sa” ang natural at hindi labis na tiyak na katumbas sa Filipino.
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: Nakipaglaban sila sa kanya
  rationale: Ipinahihiwatig ng Niphal ng לחם na may ב ang pakikipaglaban laban sa isang kalaban; malinaw ito sa konteksto nang hindi nagiging mabigat ang pananalita.
- source_word: וַיַּכּוּ
  choice: tinalo
  rationale: Sa kontekstong militar, maaaring mangahulugan ang נכה ng paghampas o pagdaig. Ang “tinalo” ay natural sa Filipino at hindi nagpapalagay na bawat isa ay agad na pinatay.
- source_word: הַכְּנַעֲנִי
  choice: ang mga Cananeo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang gamit ng katawagang etniko; ginawang maramihan sa Filipino.
- source_word: הַפְּרִזִּי
  choice: mga Perezeo
  rationale: Kolektibo rin ang anyong isahang katawagang etniko, kaya likas na isinalin sa maramihan.
