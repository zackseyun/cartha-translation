revisions:
- from: Kaya itinuro niya sa kanila ang pasukan ng lungsod. Pinuksa nila ang lungsod sa talim ng tabak[a], ngunit pinakawalan nila ang lalaki at ang buong pamilya nito.[b]
  to: Kaya itinuro niya sa kanila ang pasukan ng lungsod, at pinabagsak nila ang lungsod sa talim ng tabak[a]; ngunit pinakawalan nila ang lalaki at ang buong pamilya niya.[b]
  rationale: Pinalitan ang “pinuksa” ng “pinabagsak” upang hindi mas higit na tukuyin ang saklaw ng Hebreong pandiwa kaysa sa pinahihintulutan nito, habang nananatili ang marahas na kontekstong ipinahihiwatig ng idyomang “sa talim ng tabak.” Inayos din ang panghalip sa “pamilya niya” para sa mas natural na Filipino at inayos ang talababa upang tumugma rito.
