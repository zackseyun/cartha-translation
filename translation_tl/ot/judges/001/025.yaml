  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod” at “tabak” bilang pormal ngunit karaniwang bokabularyo sa salaysay. Pinanatili sa talababa ang literal na larawan ng Hebreong idyoma at ang lawak ng kahulugan ng מִשְׁפָּחָה.
