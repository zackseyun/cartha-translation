  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: tl
  text: Kaya itinuro niya sa kanila ang pasukan ng lungsod, at pinabagsak nila ang lungsod sa talim ng tabak[a]; ngunit pinakawalan nila ang lalaki at ang buong pamilya niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa bibig ng tabak,” isang idyomang nangangahulugang “sa talim ng tabak.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang buo niyang sambahayan” o “ang buo niyang angkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: itinuro niya sa kanila
  rationale: 'Ang anyo ng ראה ay may diwang causative sa kontekstong ito: ipinakita o itinuro ng lalaki sa kanila ang daan papasok. Natural sa Filipino ang “itinuro niya sa kanila.”'
- source_word: מְבוֹא הָעִיר
  choice: ang pasukan ng lungsod
  rationale: Ang מָבוֹא ay tumutukoy sa pasukan, daan papasok, o lapitan. Ang “pasukan ng lungsod” ay malinaw at angkop sa kontekstong militar.
- source_word: וַיַּכּוּ
  choice: pinuksa nila
  rationale: Ang נכה ay maaaring mangahulugang hampasin, salakayin, o talunin. Kasama ng idyomang לְפִי חָרֶב, ipinahihiwatig rito ang marahas na paglipol sa lungsod sa pamamagitan ng tabak; ipinapahayag ito nang natural ng “pinuksa nila.”
- source_word: לְפִי חָרֶב
  choice: sa talim ng tabak
  rationale: Literal itong “sa bibig ng tabak,” isang Hebreong idyoma para sa pagpatay o paglipol gamit ang talim ng tabak. Pinananatili ng salin ang larawan ng talim habang malinaw sa makabagong mambabasa.
- source_word: שִׁלֵּחוּ
  choice: pinakawalan nila
  rationale: Sa konteksto, iniligtas at hinayaang makaalis ang lalaki at ang kanyang pamilya. Mas malinaw rito ang “pinakawalan” kaysa sa simpleng “pinaalis.”
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: ang buong pamilya nito
  rationale: Maaaring tumukoy ang מִשְׁפָּחָה sa pamilya, sambahayan, o mas malawak na angkan. “Buong pamilya” ang pinakanatural at madaling maunawaan, habang inilalahad sa talababa ang lawak ng posibleng kahulugan.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Tumutukoy ang tiyak na pangngalan sa lalaking nabanggit sa naunang talata. Sapat at natural sa salaysay ang “ang lalaki.”
