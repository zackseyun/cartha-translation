source:
  edition: WLC
  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: tl
  text: Hindi pinalayas ng Zebulun ang mga naninirahan sa Kitron o ang mga naninirahan sa Nahalol[a]. Kaya nanirahan ang mga Cananeo sa gitna nila[b] at napasailalim sa sapilitang paggawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nahalal”; ganito ang anyo ng pangalan sa ilang tradisyon at kaugnay na mga talata.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “nanirahan ang Cananeo sa gitna nito.” Ginagamit dito ang isahan bilang kolektibong tawag sa mga Cananeo, at malamang na tumutukoy ang “nito” sa Zebulun bilang isang tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: pinalayas
  rationale: Ang Hiphil ng ירש sa kontekstong ito ay tumutukoy sa pagpapaalis sa dating mga naninirahan sa lupain. Natural at tuwiran sa modernong Filipino ang “pinalayas.”
- source_word: יוֹשְׁבֵי
  choice: mga naninirahan sa
  rationale: Ipinahahayag ng participle ng ישב ang mga taong naninirahan sa isang lugar; malinaw at natural ang pariralang ito sa Filipino.
- source_word: קִטְרוֹן
  choice: Kitron
  rationale: Isinalin sa baybay-Filipino sa pamamagitan ng transliterasyon ang pangalang pantangi ayon sa pagbigkas ng tekstong Hebreo.
- source_word: נַהֲלֹל
  choice: Nahalol
  rationale: Sinusunod nito ang Masoretikong patinig sa talatang ito; ang “Nahalal” ay itinala bilang alternatibong anyo.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: nanirahan ang mga Cananeo sa gitna nila
  rationale: Kolektibong isahan ang הַכְּנַעֲנִי, at ang isahang hulapi ay malamang na tumutukoy sa Zebulun bilang tribo. Ginawang maramihan sa Filipino upang maging natural habang pinananatili sa talababa ang anyong Hebreo.
- source_word: לָמַס
  choice: napasailalim sa sapilitang paggawa
  rationale: Ang מַס dito ay sapilitang paglilingkod o paggawa ng isang nasakop na pangkat, hindi lamang pagbabayad ng buwis. Iniiwasan din ng “napasailalim” ang di-natural na pahayag na sila mismo ay ‘naging paggawa.’
theological_decisions:
- issue: Kolektibong isahan na הַכְּנַעֲנִי at isahang hulapi sa בְּקִרְבּוֹ
  choice: “ang mga Cananeo ... sa gitna nila”
  alternative: “ang Cananeo ... sa gitna nito/kaniya”
  rationale: Karaniwang ginagamit ng Hebreo ang isahan para sa isang buong bayan at para sa isang tribo bilang korporatibong yunit. Ang maramihang Filipino ay malinaw at natural, samantalang ang talababa ay nagpapanatili sa tunay na anyong gramatikal ng pinagmulan.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “Cananeo,” karaniwang anyong Filipino ng pangalan ng bayan, at “sapilitang paggawa” para sa malinaw na diwang mapamilit ng מַס. Inilagay ang mga pananda ng talababa sa mismong teksto.
