  text: Sinabi ni Caleb, “Ang sinumang[a] sumalakay sa Kiriat-sefer at sumakop dito, ibibigay ko sa kanya bilang asawa ang anak kong si Acsa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang [taong] sasalakay sa Kiriat-sefer at sasakop dito.”
    reason: Ang אֲשֶׁר ay maaaring isalin bilang “ang sinumang” o bilang isang payak na pariralang kamag-anak, “ang [taong] sasalakay.”
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pagsulong ng salaysay sa modernong Filipino; hindi kailangang laging katawanin ang waw sa pamamagitan ng “at.”
- source_word: כָּלֵב
  choice: Caleb
  rationale: Ginamit ang karaniwang anyo ng pangalang personal sa Bibliyang Filipino.
- source_word: אֲשֶׁר
  choice: ang sinuman
  rationale: Ipinahahayag ang di-tiyak at bukás na hamon; likas itong katumbas ng indefinite relative sa Hebreo.
- source_word: יַכֶּה
  choice: sumalakay sa
  rationale: Sa kontekstong militar, ang Hiphil ng נכה ay tumutukoy sa paglusob o pagsalakay; iniiwasan nitong ipakahulugang tapos na ang pananakop bago ang kasunod na pandiwa.
- source_word: קִרְיַת סֵפֶר
  choice: Kiriat-sefer
  rationale: Tinumbasan sa baybay na angkop sa tunog at ortograpiyang Filipino ang pangalang-lugar.
- source_word: וּלְכָדָהּ
  choice: at makabihag nito
  rationale: Ang לכד sa kontekstong militar ay pagkuha o pagbihag sa isang lunsod; malinaw na ipinahahayag ang matagumpay na pananakop.
- source_word: וְנָתַתִּי לוֹ
  choice: ibibigay ko sa kanya
  rationale: Pinananatili ang pangako ni Caleb na nakasalalay sa pagtupad sa hamon.
- source_word: עַכְסָה
  choice: Acsa
  rationale: Anyong transliterado na madaling basahin sa Filipino.
- source_word: בִתִּי
  choice: ang anak kong
  rationale: Malinaw at natural na pagpapahayag ng ugnayang ama-anak sa Filipino; babae ang tinutukoy ayon sa pangalan at sa alok na pag-aasawa.
- source_word: לְאִשָּׁה
  choice: bilang asawa
  rationale: Natural na katumbas ng idyomang Hebreo para sa pagbibigay ng isang babae upang mapangasawa.
