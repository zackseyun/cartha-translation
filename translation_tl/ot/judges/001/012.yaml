  source_fidelity: Tumpak na naipapahayag ng draft ang hamon ni Caleb, ang dalawang kilos laban sa Kiriat-sefer, at ang pangakong ibibigay niya si Acsa upang maging asawa. Gayunman, ang “makabihag nito” ay hindi likas na pagtukoy sa lunsod sa Filipino; mas malinaw at tapat sa לכד ang “sumakop dito.”
  naturalness: Kailangan ng maliit na pag-aayos para maging idiomatiko ang sugnay na may magkakaugnay na kilos. Ang “sumalakay sa ... at sumakop dito” ay malinaw na naghihiwalay sa paglusob at matagumpay na pagsakop.
  terminology: Ang mga pangalang Caleb, Kiriat-sefer, at Acsa ay katanggap-tanggap na modernong Filipino transliterasyon. Ang “bilang asawa” ay angkop para sa לְאִשָּׁה. Inilipat ang talababa sa “sinumang,” ang salitang tinutukoy ng alternatibong pagbasa.
  issues:
  - severity: medium
    issue: Hindi likas ang “makabihag nito” bilang pagtukoy sa Kiriat-sefer.
    rationale: Sa Filipino, ang “nito” pagkatapos ng “makabihag” ay maaaring hindi malinaw ang tinutukoy at hindi natural para sa pagsakop sa isang lunsod. Ang “sumakop dito” ay malinaw na tumutukoy sa lunsod at naipapahayag ang matagumpay na pagkuha.
  - severity: low
    issue: Hindi tumutugma ang kinalalagyan ng talababa sa alternatibong leksikal na ibinibigay nito.
    rationale: Ang talababa ay tungkol sa אֲשֶׁר, kaya dapat nakaangkla ito sa “sinumang,” hindi sa pangalang Caleb.
  revised_text: Sinabi ni Caleb, “Ang sinumang[a] sumalakay sa Kiriat-sefer at sumakop dito, ibibigay ko sa kanya bilang asawa ang anak kong si Acsa.”
