  yaml_path: translation/ot/judges/001/023.yaml
  text: And the house of Joseph spied out Bethel[a]; formerly the name of the city was Luz.
translation:
  language: tl
  text: At minanmanan ng sambahayan ni Jose ang Bethel[a]. Dati, Luz ang pangalan ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “siniyasat,” “ginalugad,” o “nagsagawa ng pagmamanman sa Bethel.” Ang pandiwang Hebreo sa kontekstong ito ay tumutukoy sa pagmamanman o masusing pagsisiyasat sa isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: lihim na siniyasat
  rationale: Sa kontekstong militar, tumutukoy ang pandiwa sa pagmanman o maingat na pagsisiyasat sa isang lugar. Likas sa modernong Tagalog ang “lihim na siniyasat” at malinaw nitong ipinahihiwatig ang gawain ng mga espiya nang hindi gumagamit ng teknikal na salita.
- source_word: בֵית יוֹסֵף
  choice: ang sambahayan ni Jose
  rationale: Pinananatili nito ang kolektibong katawagang Hebreo para sa pangkat na nagmula kay Jose, nang hindi nililimitahan ang eksaktong saklaw nito sa isang angkan o tribo lamang.
- source_word: בְּבֵית אֵל
  choice: ang Bethel
  rationale: Sa kasunod ng pandiwang tumutukoy sa pagmanman, ang pariralang may בְּ ay likas na isinasalin bilang layon ng pagsisiyasat.
- source_word: וְשֵׁם הָעִיר לְפָנִים
  choice: Luz ang dating pangalan ng lungsod
  rationale: Natural na ayos ito sa Tagalog at tumpak na ipinapahayag na iyon ang pangalan ng lungsod noong una.
- source_word: לוּז
  choice: Luz
  rationale: Isinatinig ang pangalang pantangi alinsunod sa karaniwang anyo nito sa mga saling Filipino.
