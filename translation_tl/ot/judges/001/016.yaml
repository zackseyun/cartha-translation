source:
  edition: WLC
  text: וּ/בְנֵ֣י קֵינִי֩ חֹתֵ֨ן מֹשֶׁ֜ה עָל֨וּ מֵ/עִ֤יר הַ/תְּמָרִים֙ אֶת בְּנֵ֣י יְהוּדָ֔ה מִדְבַּ֣ר יְהוּדָ֔ה אֲשֶׁ֖ר בְּ/נֶ֣גֶב עֲרָ֑ד וַ/יֵּ֖לֶךְ וַ/יֵּ֥שֶׁב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: tl
  text: Ang mga inapo ng Keneo, na biyenang lalaki[a] ni Moises, ay umahon mula sa Lungsod ng mga Palma[b] kasama ng mga inapo ni Juda, patungo sa ilang ng Juda na nasa Negev ng Arad.[c] Pagkatapos, siya[d] ay humayo at nanirahang kasama ng mga tao.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kamag-anak ni Moises sa pamamagitan ng pag-aasawa.” Mas malawak kung minsan ang saklaw ng salitang Hebreo kaysa “biyenang lalaki,” bagaman iyon ang karaniwang kahulugan dito.
    reason: lexical_alternative
  - marker: b
    text: Karaniwang ipinapalagay na ang “Lungsod ng mga Palma” ay Jerico.
    reason: cross_reference
  - marker: c
    text: Maaari ring “na nasa timog ng Arad.” Ang Negev ay pangalan ng isang rehiyon at maaari ring mangahulugang “timog.”
    reason: lexical_alternative
  - marker: d
    text: 'Biglang lumilipat sa isahan ang Hebreo: “siya ay humayo at nanirahan.” Maaaring kolektibong tumukoy ang “siya” sa angkan ng Keneo, bagaman inuunawa ito ng ilan sa diwang maramihan.'
    reason: grammatical_ambiguity
  - marker: e
    text: Maaari ring “sa gitna ng mga tao.” Ang ilang sinaunang saksi ay may pagbasa na “kasama ng Amalek” sa halip na “kasama ng mga tao.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: Ang mga inapo ng Keneo
  rationale: Sa pananalitang panlipi, ang בְּנֵי ay tumutukoy sa mga inapo o kasapi ng angkan, hindi lamang sa mga tuwirang anak na lalaki. Ang “Keneo” ay likas na anyong Filipino ng pangalang panlipi.
- source_word: חֹתֵן מֹשֶׁה
  choice: biyenang lalaki ni Moises
  rationale: Ang חֹתֵן ay karaniwang tumutukoy sa biyenang lalaki, ngunit maaari ring magkaroon ng mas malawak na kahulugang kamag-anak sa pamamagitan ng pag-aasawa; pinanatili sa talababa ang saklaw na iyon.
- source_word: עָלוּ
  choice: umahon
  rationale: Pinananatili nito ang pangunahing kahulugan ng עלה at ang posibleng topograpikong diwa ng pag-akyat.
- source_word: מֵעִיר הַתְּמָרִים
  choice: mula sa Lungsod ng mga Palma
  rationale: Isinalin ang mismong bansag sa Hebreo sa halip na palitan agad ng “Jerico”; nasa talababa ang karaniwang pagkakakilanlan sa lugar.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: kasama ng mga inapo ni Juda
  rationale: Dito, ang אֶת ay may diwang pakikisama, at ang בְּנֵי ay tumutukoy sa mga inapo o lipi ni Juda.
- source_word: מִדְבַּר יְהוּדָה
  choice: patungo sa ilang ng Juda
  rationale: Ipinapakita ng “patungo sa” na ang ilang ang destinasyon, samantalang likas at malinaw sa modernong Filipino ang “ilang” para sa rehiyong tigang o ilang.
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: na nasa Negev ng Arad
  rationale: Pinananatili ang heograpikong pangalang Negev at ang siksik na ugnayan nito sa Arad, nang hindi sapilitang nilulutas kung rehiyon o direksiyong timog ang tinutukoy.
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: Pagkatapos, siya ay humayo at nanirahan
  rationale: Pinananatili ang biglang paglipat ng mga pandiwa mula sa maramihan tungo sa isahan. Ang “nanirahan” ay angkop sa konteksto ng paglipat at paninirahan.
- source_word: אֶת הָעָם
  choice: kasama ng mga tao
  rationale: Pinananatili ang Masoretikong teksto at ang malabong tinutukoy ng “mga tao”; inilalahad sa talababa ang iba pang pagbasa.
theological_decisions:
- issue: Ang bilang ng simuno sa huling sugnay
  choice: Pinanatili ang isahang “siya.”
  alternative: “sila” bilang pagtukoy sa buong angkan
  rationale: Isahan ang anyo ng mga pandiwang Hebreo. Maaaring kolektibong tumukoy ito sa angkan ng Keneo, ngunit hindi dapat tahimik na gawing maramihan ang tekstong Masoretiko.
- issue: Ang pagkakakilanlan ng mga taong kasama niyang nanirahan
  choice: “kasama ng mga tao”
  alternative: “kasama ng Amalek” o “sa gitna ng mga tao”
  rationale: Hindi tahasang tinutukoy ng Masoretikong teksto kung sino ang “mga tao.” Pinanatili ang kalabuan at inilagay sa talababa ang sinaunang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “biyenang lalaki,” “umahon,” “ilang,” at “nanirahan” upang mapanatili ang mahahalagang detalye ng Hebreo nang hindi nagiging lipas o labis na teknikal. Pinanatili sa pangunahing teksto ang pagbabago mula maramihan tungo sa isahan at ang malabong tinutukoy ng “mga tao.”
