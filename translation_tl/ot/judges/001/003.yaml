  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/שִׁמְע֨וֹן אָחִ֜י/ו עֲלֵ֧ה אִתִּ֣/י בְ/גוֹרָלִ֗/י וְ/נִֽלָּחֲמָה֙ בַּֽ/כְּנַעֲנִ֔י וְ/הָלַכְתִּ֧י גַם אֲנִ֛י אִתְּ/ךָ֖ בְּ/גוֹרָלֶ֑/ךָ וַ/יֵּ֥לֶךְ אִתּ֖/וֹ שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: tl
  text: Sinabi ng Juda kay Simeon na kapatid niya, “Umakyat kang kasama ko sa lupaing itinalaga sa akin[a], at labanan natin ang mga Cananeo. Sasama rin ako sa iyo sa lupaing itinalaga sa iyo.” Kaya sumama sa kanya si Simeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa aking palabunot” at “sa iyong palabunot”; ibig sabihin, ang lupaing itinalaga sa pamamagitan ng palabunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוּדָה
  choice: Sinabi ng Juda
  rationale: Likas na panimulang salaysay sa Filipino; pinananatili ang Juda bilang pangalan ng tribong inilalarawan na kumikilos at nagsasalita.
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: kay Simeon na kapatid niya
  rationale: Tuwirang pinananatili ang אָחִיו na ‘kapatid niya,’ na angkop kapuwa sa ugnayan ng mga anak ni Jacob at ng mga tribong nagmula sa kanila.
- source_word: עֲלֵה אִתִּי
  choice: Sumama ka sa akin
  rationale: Ang עֲלֵה ay literal na ‘umahon/umakyat,’ ngunit sa kontekstong militar ay maaari itong tumukoy sa pagsulong. Ang ‘sumama ka sa akin’ ay natural na paanyaya sa Filipino at hindi nagpapahiwatig ng tiyak na topograpiyang hindi naman hayag sa talata.
- source_word: בְגוֹרָלִי / בְגוֹרָלֶךָ
  choice: sa lupaing itinalaga sa akin / sa iyo
  rationale: Ang גוֹרָל ay literal na ‘palabunot’ ngunit dito ay metonimiya para sa lupaing napunta sa isang tribo sa pamamagitan ng palabunutan. Nililinaw ng salin ang tinutukoy habang inilalagay sa talababa ang literal na larawan.
- source_word: וְנִלָּחֲמָה
  choice: at labanan natin
  rationale: Ipinahahayag ng cohortative na anyo ang paanyaya sa sama-samang pagkilos; malinaw itong naihahatid ng ‘labanan natin.’
- source_word: בַּכְּנַעֲנִי
  choice: ang mga Cananeo
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo itong tumutukoy sa pangkat ng mga tao; natural sa Filipino ang maramihang ‘mga Cananeo.’
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: Sasama rin ako sa iyo
  rationale: Pinananatili ng ‘rin’ ang diin ng גַם אֲנִי at malinaw na ipinapahayag ang katumbas na pangako ng Juda.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: Kaya sumama sa kanya si Simeon
  rationale: Ipinakikita ng ‘kaya’ na tinanggap ni Simeon ang paanyaya, habang nananatiling tapat sa sunod-sunod na daloy ng salaysay.
theological_decisions:
- issue: Pagpapakahulugan sa אָחִיו bilang ugnayang magkapatid
  choice: kapatid niya
  alternative: kamag-anak niya
  rationale: Hayagang ‘kapatid’ ang salita sa Hebreo. Hindi kailangang gawing mas malawak na ‘kamag-anak,’ sapagkat ang Juda at Simeon ay magkapatid sa salaysay ng mga ninuno at ang kanilang mga tribo ay inilalarawan ayon sa ugnayang iyon.
- issue: Pagpapakahulugan sa גוֹרָל sa konteksto ng paghahati ng lupain
  choice: lupaing itinalaga
  alternative: palabunot
  rationale: Ang agarang tinutukoy ay ang teritoryong naibahagi sa bawat tribo. Iniiwasan ng ‘lupaing itinalaga’ ang kalabuan sa modernong mambabasa, samantalang pinananatili ng talababa ang konkretong larawan ng palabunutan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong biblikal na mga pangalang Juda, Simeon, at Cananeo. Iniwasan ang sobrang literal na ‘umakyat’ dahil maaaring magpahiwatig iyon ng tiyak na pag-ahon sa heograpiya; pinanatili naman ang diwa ng magkatuwang na pagsulong sa pamamagitan ng ‘sumama.’
