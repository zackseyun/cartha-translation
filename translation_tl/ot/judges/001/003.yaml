  naturalness: Natural at marangal ang kabuuang Filipino. Ang “Umakyat kang kasama ko” ay karaniwang Filipino at mas tumpak kaysa “Sumama ka sa akin” dahil napapanatili nito ang pandiwa ng pinagmulan. Ang “lupaing itinalaga” ay malinaw sa konteksto.
