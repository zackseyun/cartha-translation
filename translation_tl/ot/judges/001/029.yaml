translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit sa Gezer at ang payak na pang-ugnay na “at” upang hindi magdagdag ng ugnayang sanhi na hindi tahasang nakasaad sa Hebreo.
