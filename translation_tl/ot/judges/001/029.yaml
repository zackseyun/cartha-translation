  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: tl
  text: Hindi pinalayas ng Efraim ang mga Cananeong naninirahan sa Gezer, at nanirahan ang mga Cananeo kasama nila[a] sa Gezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa gitna niya.” Ang panghalip na isahan ay tumutukoy sa Efraim bilang isang buong lipi; isinalin itong “kasama nila” upang ipahayag ang kolektibong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: pinalayas
  rationale: Sa Hiphil ng ירשׁ, ipinahihiwatig dito ang pagpapaalis sa mga dating naninirahan mula sa lupaing hawak nila. Natural at malinaw sa makabagong Filipino ang “pinalayas,” at pinananatili nito ang diwa ng kabiguan ng Efraim na alisin sila.
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang gamit ng katawagang etniko rito. Ang “mga Cananeo” ang natural na katumbas sa Filipino.
- source_word: הַיּוֹשֵׁב
  choice: naninirahan
  rationale: Ang participle ng ישׁב ay tumutukoy sa patuloy at nakapirming paninirahan. Ang “naninirahan” ay natural at angkop sa paglalarawan sa mga residente ng Gezer.
- source_word: בְּגָזֶר
  choice: sa Gezer
  rationale: Ang בְּ ay panandang panlunan; ang “sa Gezer” ang karaniwang anyo sa Filipino para sa paninirahan sa isang lungsod o pook.
- source_word: וַיֵּשֶׁב
  choice: at nanirahan
  rationale: Ipinagpapatuloy ng wayyiqtol ang salaysay. Pinananatili ng “at” ang payak na pang-ugnay ng Hebreo at hindi tahasang nagdaragdag ng ugnayang sanhi gaya ng “kaya.”
- source_word: בְּקִרְבּוֹ
  choice: sa gitna nila
  rationale: Literal itong “sa gitna niya,” na ang hulaping isahan ay tumutukoy sa Efraim bilang isang kolektibong lipi. Mas natural sa Filipino ang maramihang “sa gitna nila” para sa mga kabilang sa lipi.
