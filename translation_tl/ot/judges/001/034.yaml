  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: tl
  text: Itinulak ng mga Amoreo ang mga anak ni Dan pabalik sa kabundukan[a], sapagkat hindi nila pinayagang bumaba ang mga ito sa lambak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Itinulak ng Amoreo ang mga anak ni Dan patungo sa kabundukan, sapagkat hindi niya siya pinayagang bumaba sa lambak.” Isahan ang “Amoreo” at ang mga anyo sa huling sugnay sa Hebreo, ngunit kolektibo ang tinutukoy sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: Ginigipit ... papunta
  rationale: Ang pandiwang לחץ ay nagpapahiwatig ng pagdiin, panggigipit, o sapilitang pagkulong sa isang lugar. Ipinahahayag ng “ginigipit ... papunta” ang puwersahang pagkakataboy nang hindi labis na nagpapaliwanag.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang katawagan sa pangkat-etnikong ito; likas sa Filipino ang maramihang “mga Amoreo.”
- source_word: בְּנֵי דָן
  choice: mga anak ni Dan
  rationale: Pinananatili nito ang pampamilya at pantribong larawan ng Hebreong parirala habang malinaw at natural pa rin sa Filipino.
- source_word: הָהָרָה
  choice: papunta sa kabundukan
  rationale: Ang hulaping patungo sa Hebreo ay nagsasaad ng direksiyon. Ang “kabundukan” ay likas na panumbas sa rehiyong mataas at malinaw na kasalungat ng lambak.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pangyayari; ang “sapagkat” ay malinaw, marangal, at angkop sa salaysay.
- source_word: לֹא נְתָנוֹ
  choice: hindi nila pinahintulutang ... ang mga ito
  rationale: Isahan ang mga anyo sa Hebreo dahil kolektibo ang mga tinutukoy, ngunit maramihan ang diwa sa konteksto. Nililinaw ng Filipino ang Amorita bilang gumagawa at ang mga anak ni Dan bilang pinipigilan.
- source_word: לָרֶדֶת
  choice: bumaba
  rationale: Natural na ipinahahayag ng “bumaba” ang topograpikong kilos mula sa kabundukan patungo sa lambak.
- source_word: לָעֵמֶק
  choice: sa lambak
  rationale: Direkta at angkop sa konteksto ang “lambak” para sa עֵמֶק, lalo na bilang kabaligtaran ng kabundukan.
