translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na daloy ng salaysay. Pinanatili ang “mga anak ni Dan” upang maingatan ang pantribong larawang nasa Hebreo. Ang “ginigipit” ay nagpapahiwatig ng patuloy at mapuwersang paghadlang; iniwasan ang mas interpretatibong “itinaboy pabalik.”
