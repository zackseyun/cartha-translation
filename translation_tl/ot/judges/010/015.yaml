id: JDG.10.15
reference: Judges 10:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: tl
  text: At sinabi ng mga anak ni Israel kay Yahweh[a], “Nagkasala kami. Pakitunguhan mo kami ayon sa anumang minamabuti mo.[b] Iligtas mo lamang sana kami sa araw na ito.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Israel” ay maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa lahat ng mabuti sa iyong paningin”; ibig sabihin, ayon sa anumang minamabuti mo.
    reason: lexical_alternative
  - marker: c
    text: Ang “iligtas” ay maaari ring isaling “sagipin” o “hanguin sa panganib.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi
  rationale: Pinananatili ang pagpapatuloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ng tiyak na temporal na kahulugan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tapat ito sa Hebreong idyoma at malinaw pa rin sa karaniwang makabagong Tagalog; tumutukoy ito sa sambayanang Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: חָטָאנוּ
  choice: Nagkasala kami
  rationale: Natural na pagpapahayag sa Tagalog ng natapos na gawa at taimtim na pag-amin ng bayan.
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: Gawin mo sa amin
  rationale: Pinananatili ang tuwiran at matinding pagpapasakop ng kanilang pakiusap.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: ang anumang mabuti sa iyong paningin
  rationale: Pinananatili ang larawang Hebreo na “sa iyong paningin” habang natural na ipinahahayag ang diwang anumang minamabuti ng Diyos.
- source_word: אַךְ
  choice: lamang
  rationale: 'Ipinakikita ang restriktibong pakiusap: tinatanggap nila ang gagawin ng Diyos ngunit humihiling ng isang bagay—ang pagliligtas ngayon.'
- source_word: הַצִּילֵנוּ
  choice: Iligtas mo kami
  rationale: Ang Hiphil ng נצל ay tumutukoy sa pagligtas o pagsagip mula sa panganib; ang “iligtas” ay natural at angkop sa konteksto.
- source_word: נָא
  choice: sana
  rationale: Ipinahahayag ang magalang at taimtim na pakiusap na taglay ng Hebreong partikula.
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili ang mariing anyo at agarang pangangailangan ng Hebreong parirala.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang ginagamit sa pinagmulan, kaya pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Pagpapahayag sa בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ang anyo ng Hebreong pananalita nang hindi ipinapalagay na mga lalaki lamang ang tinutukoy; sa konteksto, ito ang kolektibong katawagan sa bayan.
- issue: Saklaw ng כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: ang anumang mabuti sa iyong paningin
  alternative: ayon sa lahat ng mabuti sa iyong paningin; anumang minamabuti mo
  rationale: Pinananatili ang idyomatikong larawan at ang pagpapasakop nila sa pasiya ng Diyos, nang hindi tinutukoy nang higit sa sinasabi ng teksto kung parusa, awa, o kapwa ang kasama rito.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang Hebreong larawang “sa iyong paningin,” ang tuwirang pag-amin, at ang maigting na pakiusap. Ginamit ang “mga anak ni Israel” bilang pormal na katumbas ng idyoma, na nilinaw sa talababa. Ang marker [c] ay inilagay pagkatapos ng pangungusap na naglalaman ng “Iligtas” upang malinaw ang tinutukoy nito.
