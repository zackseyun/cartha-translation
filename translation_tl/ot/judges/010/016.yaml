id: JDG.10.16
reference: Judges 10:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: tl
  text: Kaya inalis nila sa kanilang kalagitnaan ang mga banyagang diyos at naglingkod sila kay Yahweh. At hindi na niya matiis ang paghihirap ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nainip siya dahil sa paghihirap ng Israel.” Literal sa Hebreo, “umiksi ang kanyang kaluluwa dahil sa paghihirap ng Israel,” isang idyomang maaaring magpahayag ng pagkainip o ng hindi na makayang magtiis pa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: inalis
  rationale: Ang Hiphil ng סור ay nangangahulugang paalisin o alisin. Ang “inalis” ay tuwiran at natural sa makabagong Tagalog.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: mga banyagang diyos
  rationale: Tumutukoy ito sa mga diyos na hindi kabilang sa pagsamba ng Israel; malinaw at karaniwan ang “mga banyagang diyos.”
- source_word: מִקִּרְבָּם
  choice: sa kanilang kalagitnaan
  rationale: Pinananatili nito ang kolektibong diwa ng literal na “mula sa gitna nila.”
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  choice: naglingkod sila kay Yahweh
  rationale: Ang עבד ay maaaring mangahulugang maglingkod o sumamba. Pinananatili ng “naglingkod” ang mas malawak na diwa ng katapatan, pagsunod, at pagsamba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos ayon sa anyo ng Hebreo at sa pamantayan ng proyekto.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: hindi na niya matiis
  rationale: Ang literal na idyomang “umiksi ang kanyang kaluluwa” ay nagpapahayag na naubos na ang pagtitiis o hindi na makayang tiisin pa. Natural sa Tagalog ang pangunahing salin, habang inilalahad sa talababa ang posibleng diwang “nainip.”
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: ang paghihirap ng Israel
  rationale: Sa konteksto, ang עָמָל ay tumutukoy sa hirap, dalamhati, o pagdurusang dinaranas ng Israel. Sapat na malawak at natural ang “paghihirap.”
theological_decisions:
- issue: Ang antropopatikong paglalarawan kay Yahweh sa וַתִּקְצַר נַפְשׁוֹ
  choice: Hindi na niya matiis ang paghihirap ng Israel
  alternative: Nainip siya dahil sa paghihirap ng Israel
  rationale: Inilalarawan ng Hebreo ang personal at masidhing pagtugon ni Yahweh sa paghihirap ng Israel. Hindi ito ginawang abstraktong pahayag tungkol sa habag, at hindi rin nilutas ang tensiyon sa pagitan ng pagkainip at kawalan ng kakayahang magtiis pa; nakatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalagitnaan” upang mapanatili ang kolektibong larawan ng Hebreo, at “naglingkod” upang huwag paliitin ang עבד tungo lamang sa ritwal na pagsamba.
