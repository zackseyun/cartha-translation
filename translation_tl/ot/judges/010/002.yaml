translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pinamunuan ... bilang hukom” upang maipakita ang saklaw ng tungkuling שׁפט sa konteksto ng Mga Hukom at maiwasan ang impresyong gawaing pangkorte lamang.
