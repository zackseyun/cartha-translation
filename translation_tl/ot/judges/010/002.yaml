  yaml_path: translation/ot/judges/010/002.yaml
  text: He judged Israel twenty-three years. Then he died and was buried in Shamir.
translation:
  language: tl
  text: Pinamunuan niya ang Israel bilang hukom sa loob ng dalawampu't tatlong taon. Pagkatapos, namatay siya at inilibing sa Shamir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: Pinamunuan niya ... bilang hukom
  rationale: Sa aklat ng Mga Hukom, ang שׁפט ay tumutukoy sa pagganap ng isang hukom bilang pinuno ng Israel. Iniiwasan ng parirala ang makitid na kahulugang panghukuman lamang ng “humatol,” habang pinananatili ang mahalagang katawagang “hukom.”
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Tuwirang tumutukoy sa bayang Israel bilang layon ng pandiwa.
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: sa loob ng dalawampu't tatlong taon
  rationale: Likas na modernong Tagalog para sa eksaktong tagal na dalawampu't tatlong taon.
- source_word: וַיָּמָת
  choice: Pagkatapos, namatay siya
  rationale: Ipinahahayag ng waw-consecutive ang kasunod na pangyayari sa salaysay; natural itong ipinakita sa “Pagkatapos” nang hindi nagpapahiwatig ng pagsalungat.
- source_word: וַיִּקָּבֵר
  choice: inilibing
  rationale: Pinananatili ang pasibong diwa ng Nifal at hindi nagdaragdag kung sino ang naglibing.
- source_word: בְּשָׁמִיר
  choice: sa Shamir
  rationale: Ang בְּ ay lokatibo, at ang pangalang-pook na שָׁמִיר ay tinumbasan sa karaniwang transliterasyong “Shamir.”
