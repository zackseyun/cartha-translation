revisions:
- from: At nang taong iyon, niluray at dinurog nila ang mga Israelita[a]; labingwalong taon nilang pinahirapan ang lahat ng Israelita[b] na nasa ibayo ng Jordan, sa lupain ng mga Amoreo na nasa Gilead.
  to: Noong taóng iyon, niluray at dinurog nila ang mga Israelita[a]; labingwalong taon nilang pinahirapan ang lahat ng Israelita[b] na nasa ibayo ng Jordan, sa lupain ng mga Amoreo na nasa Gilead.
  rationale: Pinalitan ang “nang taong iyon” ng “Noong taóng iyon” upang maging idiomatiko at wasto sa modernong Filipino. Walang binago sa kahulugan, tindi ng dalawang pandiwa, tagal, saklaw, o heograpikong paglalarawan.
