  text: וַֽ/יִּרְעֲצ֤וּ וַ/יְרֹֽצְצוּ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/שָּׁנָ֖ה הַ/הִ֑יא שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה שָׁנָ֗ה אֶֽת כָּל בְּנֵ֤י יִשְׂרָאֵל֙ אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן בְּ/אֶ֥רֶץ הָ/אֱמֹרִ֖י אֲשֶׁ֥ר בַּ/גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: tl
  text: Noong taóng iyon, niluray at dinurog nila ang mga Israelita[a]; labingwalong taon nilang pinahirapan ang lahat ng Israelita[b] na nasa ibayo ng Jordan, sa lupain ng mga Amoreo na nasa Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “winasak at pinahirapan nila ang mga Israelita.” Gumagamit ang Hebreo ng dalawang matitindi at halos magkasingkahulugang pandiwa upang idiin ang bigat ng kanilang dinanas.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Israel”; iyon din ang pariralang ginamit sa unang bahagi ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֲצוּ וַיְרֹצְצוּ
  choice: niluray at dinurog
  rationale: Pinananatili ang dalawang matitindi at halos magkasingkahulugang pandiwa upang maipahayag ang tindi ng marahas na pagdurusa, sa halip na gawing isang abstraktong pandiwang gaya ng “pinahirapan” lamang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at malinaw na katumbas sa makabagong Filipino; inuulit ito ayon sa pag-uulit ng parirala sa Hebreo, habang inilalagay sa talababa ang literal na anyo.
- source_word: בַּשָּׁנָה הַהִיא
  choice: nang taong iyon
  rationale: Natural na Filipino para sa panahong tinutukoy ng Hebreo at maayos na inuugnay sa unang kilos.
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: labingwalong taon nilang pinahirapan
  rationale: Ginagawang malinaw sa Filipino na ang paghihirap ay nagpatuloy nang labingwalong taon; ang pandiwang “pinahirapan” ay ipinahihiwatig ng konteksto at iniiwasang ulitin nang alanganin ang dalawang matalinghagang pandiwa.
- source_word: אֶת כָּל בְּנֵי יִשְׂרָאֵל
  choice: ang lahat ng Israelita
  rationale: Pinananatili ang saklaw ng כָּל at ang pag-uulit ng tinutukoy na pangkat.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: na nasa ibayo ng Jordan
  rationale: Malapit sa heograpikong idyoma ng Hebreo at hindi labis na tinutukoy kung silangan o kanluran ang perspektiba.
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: sa lupain ng mga Amoreo
  rationale: Tuwirang pinananatili ang pormal na katawagang panteritoryo.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: na nasa Gilead
  rationale: Pinananatili ang tahasang sugnay na naglalarawan sa lokasyon ng lupain.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” bilang likas na katawagan sa Filipino, ngunit pinanatili ang pag-uulit ng Hebreo. Ang “niluray at dinurog” ay masidhi ngunit nauunawaan, samantalang ang “pinahirapan” sa ikalawang sugnay ay nagpapalinaw sa pagpapatuloy ng pang-aapi sa loob ng labingwalong taon.
