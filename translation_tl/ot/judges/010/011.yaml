source:
  edition: WLC
  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: tl
  text: Sinabi ni Yahweh sa mga anak ni Israel[a], “Hindi ba iniligtas ko kayo mula sa Ehipto, sa mga Amoreo, sa mga Ammonita, at sa mga Filisteo?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “mga anak ni Israel”; tumutukoy ito sa mga Israelita.'
    reason: lexical_alternative
  - marker: b
    text: Eliptiko o bitin ang sugnay sa Hebreo. Ang mga salitang “iniligtas ko kayo” ay ipinahihiwatig ng nakapaligid na konteksto at inilagay dito upang luminaw ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang panumbas sa makabagong salaysay para sa pambungad ng tuwirang pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang Hebreong pananalitang pampamilya; likas din itong nauunawaan sa Filipino bilang mga inapo o sambayanan ni Israel.
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Likas na Filipino para sa retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Ipinapahayag ng מִן ang pinagmulan o kapangyarihang pinanggalingan ng pagliligtas.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Bagaman kolektibong isahan sa Hebreo, tinutukoy nito ang pangkat-etniko at natural na maramihan sa Filipino.
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Karaniwang pangalan sa Filipino para sa bayang nagmula kay Ammon; mas natural dito kaysa sa literal na “mga anak ni Ammon.”
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang Filipino na pangalan para sa pangkat-etnikong ito.
- source_word: '[pandiwang ipinahihiwatig ng konteksto]'
  choice: iniligtas ko kayo
  rationale: Bitin ang sugnay sa Hebreo kapag ibinukod sa konteksto. Ipinahihiwatig ng kasunod na talata at ng daloy ng pahayag ang pagliligtas; ang “iniligtas” ay malinaw at natural nang hindi nagdaragdag ng espirituwal na pakahulugang wala sa konteksto.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Literal o idyomatikong paglilipat sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang literal na larawang pampamilya ay malinaw at marangal sa Filipino at pinananatili ang anyo ng Hebreo nang hindi nagiging di-natural.
- issue: Pagdaragdag ng ipinahihiwatig na pandiwa sa eliptikong tanong
  choice: iniligtas ko kayo
  alternative: Iwan ang talata bilang putol na talaan ng mga bayan
  rationale: Kailangan ang ipinahihiwatig na pandiwa upang maging malinaw ang pangungusap sa Filipino. Minamarkahan ito sa talababa upang hindi maitago na wala itong tahasang katumbas sa talatang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sinabi ni” bilang natural na pambungad sa pananalita, habang pinanatili ang Hebreong idyomang “mga anak ni Israel.” Ang retorikal na tanong ay inayos sa karaniwang hulma ng Filipino nang hindi binabago ang diin nito.
