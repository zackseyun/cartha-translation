base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: tl
  text: Kaya nag-alab ang galit ni Yahweh laban sa Israel[a], at ipinagbili niya sila[b] sa kamay ng mga Filisteo at sa kamay ng mga Ammonita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagningas ang galit ni Yahweh laban sa Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ipinagbili niya sila” ay paulit-ulit na pananalita sa Mga Hukom para sa pagpapasailalim ni Yahweh sa Israel sa kapangyarihan ng mga kaaway bilang hatol.
    reason: cross_reference
  - marker: c
    text: Sa literal, “mga anak ni Ammon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: nag-alab ang galit
  rationale: Pinananatili nito ang konkretong larawang Hebreo ng galit na nagliliyab o nag-aalab, at natural pa rin itong pakinggan sa makabagong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay-Filipino ang personal na pangalang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: בְּיִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa idyoma ng galit, ipinahihiwatig ng pang-ukol na בְּ ang pinatutungkulan ng galit; malinaw at natural itong naipapahayag ng “laban sa.”
- source_word: וַיִּמְכְּרֵם
  choice: ipinagbili niya sila
  rationale: Pinananatili ng “ipinagbili” ang karaniwang kahulugan ng מכר at ang paulit-ulit na metapora sa Mga Hukom para sa pagpapasailalim ng Israel sa mga kaaway bilang hatol.
- source_word: בְּיַד
  choice: sa kamay ng
  rationale: Nananatili rito ang konkretong idyomang Hebreo para sa kapangyarihan o pamamahala; nauunawaan din sa Filipino ang mapunta “sa kamay” ng isang kaaway.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang nakasanayan at malinaw na pangalang Filipino para sa pangkat na ito.
- source_word: בְּנֵי עַמּוֹן
  choice: mga anak ni Ammon
  rationale: Pinananatili nito ang anyong Hebreo na “mga anak ni Ammon” at ang pagkakaugnay ng bayan sa ninunong si Ammon; ang mas karaniwang katawagang “mga Ammonita” ay inilagay bilang alternatibo sa talababa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito sa halip na palitan ng titulong “PANGINOON.”
- issue: Paglalarawan sa hatol ng Diyos sa וַיִּמְכְּרֵם
  choice: ipinagbili niya sila
  alternative: ibinigay niya sila o ipinaubaya niya sila
  rationale: Tahasan sa talata ang pagkilos ni Yahweh na ipailalim ang Israel sa mga kaaway. Pinananatili ng “ipinagbili” ang mabigat na metapora at ang temang paulit-ulit sa Mga Hukom nang hindi pinahihina ang kaniyang pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga larawang “nag-alab,” “ipinagbili,” at “sa kamay” dahil natural pa ring maunawaan ang mga ito at mahalaga ang mga ito sa pananalita at tema ng tekstong Hebreo.
