base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: tl
  text: Ang mga taga-Sidon, ang Amalek[a], at ang Maon[b] ay umapi sa inyo. Dumaing kayo sa akin, at iniligtas ko kayo mula sa kanilang kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga Amalekita.” “Amalek” ang nasa Hebreo at maaaring kumatawan sa buong bayan.
    reason: lexical_alternative
  - marker: b
    text: O, “ang mga Maonita.” “Maon” ang nasa Hebreo at malamang na tumutukoy sa isang pangkat ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: mga taga-Sidon
  rationale: Pangmaramihang katawagan ito sa mga taong mula sa Sidon. Ang “mga taga-Sidon” ay likas at malinaw sa makabagong Filipino habang pinananatili ang pangalan ng lugar.
- source_word: עֲמָלֵק
  choice: ang Amalek
  rationale: Pangngalang pantangi ang anyong Hebreo at maaari itong kumatawan sa buong pangkat ng mga tao. Pinanatili ang “Amalek” sa pangunahing teksto upang hindi tahasang idagdag ang interpretasyong “mga Amalekita.”
- source_word: מָעוֹן
  choice: ang Maon
  rationale: “Maon” ang pangngalang pantangi sa tekstong Hebreo. Bagaman malamang na tumutukoy ito sa isang pangkat ng mga tao, pinanatili ang pangalan at inilagay sa talababa ang mas tahasang alternatibo.
- source_word: לָחֲצוּ
  choice: umapi
  rationale: Ipinahihiwatig ng pandiwa ang marahas na panggigipit o paniniil. Ang “umapi” ay maikli, natural, at angkop sa konteksto ng pananakop.
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: Dumaing kayo sa akin
  rationale: Naglalarawan ang parirala ng desperadong paghingi ng tulong. Ipinahahayag ng “dumaing” ang bigat ng panawagan nang natural sa Filipino.
- source_word: וָאוֹשִׁיעָה
  choice: iniligtas ko
  rationale: Ang pandiwang mula sa ישׁע ay nangangahulugang magligtas o magpalaya. Ang “iniligtas” ay tuwiran at pinananatili ang malawak na bokabularyong biblikal tungkol sa pagliligtas.
- source_word: מִיָּדָם
  choice: mula sa kanilang kamay
  rationale: Literal na “mula sa kanilang kamay” ang idyomang Hebreo, na tumutukoy sa kapangyarihan o kontrol. Nauunawaan din sa Filipino ang tayutay kaya pinanatili ito.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Ginamit ang “mga taga-Sidon” bilang natural na katawagan sa mga Sidonio, samantalang pinanatili ang kolektibong mga pangalang “Amalek” at “Maon” upang maingatan ang anyo at bahagyang kalabuan ng Hebreo. Ang “mula sa kanilang kamay” ay sadyang nagpapanatili sa biblikal na idyoma.
