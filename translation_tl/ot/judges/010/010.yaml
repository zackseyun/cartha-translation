base_translation:
  language: en
  yaml_path: translation/ot/judges/010/010.yaml
  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: tl
  text: 'At dumaing ang mga Israelita sa PANGINOON: “Nagkasala kami sa iyo, sapagkat tinalikuran namin ang aming Diyos at naglingkod kami sa mga Baal.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: At dumaing
  rationale: Ipinahahayag ang matinding paghingi ng tulong sa Diyos; likas at marangal ang “dumaing” sa makabagong Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Likas na kolektibong tawag sa modernong Tagalog para sa literal na “mga anak na lalaki ng Israel.”
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Sinusunod ang kinikilalang tradisyon sa salin ng banal na pangalang YHWH nang hindi nagdaragdag ng paliwanag na wala sa talata.
- source_word: כִּי עָזַבְנוּ
  choice: sapagkat tinalikuran namin
  rationale: Pinananatili ang tahasang sanhi ng pagkakasala at ang diwa ng pagtalikod o pag-iwan sa Diyos.
- source_word: הַבְּעָלִים
  choice: mga Baal
  rationale: Pinananatili ang anyong maramihan, na tumutukoy sa mga lokal na anyo o pagsamba sa mga Baal.
theological_decisions:
- issue: Ugnayan ng ikalawang sugnay sa pag-amin ng kasalanan
  choice: sapagkat
  alternative: at tunay na / anupat
  rationale: 'Sa konteksto, ang כִּי ay pinakaangkop na nagpapahayag ng dahilan o nilalaman ng kanilang pagkakasala: tinalikuran nila ang Diyos at naglingkod sa mga Baal.'
- issue: Paglalahad sa banal na pangalan
  choice: PANGINOON
  alternative: Yahweh
  rationale: Pinananatili ang tradisyonal at madaling makilalang anyo sa Tagalog, nang walang denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Inalis ang literal na “na sinasabi” sapagkat sapat at mas natural ang tutuldok matapos ang pandiwang nagsasaad ng pagdaing; napanatili ang tuwirang pag-amin at paralelismo ng dalawang kilos.
