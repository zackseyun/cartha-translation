  source_fidelity: 'Tumpak ang salin sa Hebreo: naipahayag ang pagdaing ng mga Israelita kay YHWH, ang kanilang pag-amin ng kasalanan laban sa kanya, at ang dalawang magkaugnay na pagkakasala—pag-iwan sa kanilang Diyos at paglilingkod sa mga Baal. Ang “sapagkat” ay isang likas at katanggap-tanggap na paglalapat ng כִּי sa kontekstong ito.'
