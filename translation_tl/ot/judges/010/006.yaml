source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: tl
  text: Muling gumawa ang mga Israelita ng masama sa paningin ni Yahweh[a]. Naglingkod sila sa mga Baal at mga Astarot, at sa mga diyos ng Aram, mga diyos ng Sidon, mga diyos ng Moab, mga diyos ng mga Ammonita[b], at mga diyos ng mga Filisteo. Tinalikuran nila si Yahweh at hindi sila naglingkod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nagpatuloy ang mga Israelita sa paggawa ng masama sa paningin ni Yahweh.” Ang pandiwang Hebreo ay maaaring magpahiwatig ng pag-uulit o pagpapatuloy.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga diyos ng mga anak ni Ammon,” ibig sabihin, mga diyos na sinasamba ng mga Ammonita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: Muling gumawa
  rationale: Ang יסף na sinusundan ng pawatas ay maaaring magpahiwatig ng pag-uulit o pagpapatuloy. Ang “muling gumawa” ay natural sa Tagalog at pinananatili ang paikot na padron sa Mga Hukom; inilalahad sa talababa ang alternatibong diwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Mas natural at malinaw sa modernong Tagalog kaysa sa literal na “mga anak ng Israel,” habang tama pa ring tumutukoy sa bayan ng Israel.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: gumawa ng masama sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong larawang “sa paningin” at gumagamit ng likas na pariralang Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: naglingkod / naglingkod sa kanya
  rationale: 'Pinananatili ang pangunahing kahulugan ng עבד at ang retorikal na paghahambing: naglingkod sila sa ibang mga diyos ngunit hindi kay Yahweh.'
- source_word: הַבְּעָלִים
  choice: mga Baal
  rationale: Pinananatili ang pangkultong pangalan at ang anyong maramihan, na maaaring tumukoy sa iba't ibang lokal na pagpapakita o sentro ng pagsamba kay Baal.
- source_word: הָעַשְׁתָּרוֹת
  choice: mga Astarot
  rationale: Transliterasyon ng pangkultong pangalan sa maramihan, kaagapay ng “mga Baal.”
- source_word: אֱלֹהֵי אֲרָם / צִידוֹן / מוֹאָב / פְלִשְׁתִּים
  choice: mga diyos ng Aram, Sidon, Moab, at ng mga Filisteo
  rationale: Direkta at natural na isinasalin ang mga ugnayang heograpiko at etniko; pinananatili ang Aram bilang sinaunang pangalang pantangi.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: mga diyos ng mga Ammonita
  rationale: Idyomatikong Tagalog para sa literal na “mga diyos ng mga anak ni Ammon,” nang hindi binabago ang tinutukoy.
- source_word: וַיַּעַזְבוּ
  choice: Tinalikuran nila
  rationale: Malinaw na ipinahahayag ang pag-iwan at pagtatakwil kay Yahweh sa konteksto ng tipan at pagsamba.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalan ang nasa Hebreong teksto, kaya pinananatili itong pangalan sa salin sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng עבד sa konteksto ng idolatriya
  choice: naglingkod
  alternative: sumamba
  rationale: Bagaman kasama sa paglilingkod ang pagsamba, pinananatili ng “naglingkod” ang mas malawak na diwa ng katapatan at ang sadyang pagkakatulad ng dalawang sugnay.
- issue: Pag-uulit o pagpapatuloy sa וַיֹּסִפוּ
  choice: muling gumawa
  alternative: nagpatuloy sa paggawa
  rationale: Ang gramatika ay maaaring magpahayag ng alinman sa pag-uulit o pagpapatuloy. Ginamit sa teksto ang natural na diwa ng pag-uulit, ngunit hindi ikinubli ang alternatibo at inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “mga Israelita” at “mga Ammonita” sa halip na literal ngunit di-likas na mga pariralang “mga anak ng Israel/Ammon.” Pinanatili ang mga pangkultong pangalan, ang banal na pangalang Yahweh, at ang pag-uulit ng “naglingkod” upang maipakita ang Hebreong paghahambing.
