revisions:
- from: Muling gumawa ang mga Israelita ng masama sa paningin ni Yahweh[a]. Naglingkod sila sa mga Baal at mga Astarot, gayundin sa mga diyos ng Aram, Sidon, Moab, ng mga Ammonita[b], at ng mga Filisteo. Tinalikuran nila si Yahweh at hindi na naglingkod sa kanya.
  to: Muling gumawa ang mga Israelita ng masama sa paningin ni Yahweh[a]. Naglingkod sila sa mga Baal at mga Astarot, at sa mga diyos ng Aram, mga diyos ng Sidon, mga diyos ng Moab, mga diyos ng mga Ammonita[b], at mga diyos ng mga Filisteo. Tinalikuran nila si Yahweh at hindi sila naglingkod sa kanya.
  rationale: Inalis ang “na” sa huling sugnay upang hindi maidaragdag ang diwang “hindi na.” Inulit ang “mga diyos ng” sa talaan para malinaw na maipakita ang saklaw at ang paulit-ulit na konstruksiyon ng Hebreo. Walang binagong pangalan, terminong teolohikal, o kahulugan ng talata.
