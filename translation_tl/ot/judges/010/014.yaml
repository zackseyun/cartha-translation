  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: tl
  text: Humayo kayo at dumaing sa mga diyos na pinili ninyo; sila ang magligtas sa inyo[a] sa panahon ng inyong kagipitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sila ang magliligtas sa inyo.” Maaaring unawain ang anyong Hebreo bilang payak na panghinaharap, ngunit sa konteksto ay ginagamit ito bilang mapanuyang hamon.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Humayo kayo
  rationale: Maramihang pautos na may himig ng matalim na pagpapaalis. Dignificado at malinaw sa makabagong Filipino ang “Humayo kayo.”
- source_word: וְזַעֲקוּ
  choice: at dumaing
  rationale: Ang זעק ay malakas at apurahang paghingi ng tulong sa gitna ng panganib. Likas sa Filipino ang “dumaing” sa ganitong konteksto.
- source_word: אֶל הָאֱלֹהִים
  choice: sa mga diyos
  rationale: Bagaman maaaring magkaiba ang bilang ng אֱלֹהִים ayon sa konteksto, malinaw rito ang maramihang tinutukoy dahil sa mga banyagang diyos at sa sumusunod na maramihang panghalip at pandiwa.
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: na pinili ninyo
  rationale: Natural na Filipino para sa idyomatikong gamit ng בחר ב; hindi kailangang isalin nang literal ang pang-ukol.
- source_word: הֵמָּה
  choice: sila ang
  rationale: 'Pinananatili nito ang diin ng hiwalay na panghalip sa Hebreo: ang mismong mga diyos na pinili nila ang hinahamon na magligtas.'
- source_word: יוֹשִׁיעוּ
  choice: magligtas sa inyo
  rationale: Ang Hiphil ng ישׁע ay “magligtas” o “magpalaya.” Kasama ng “sila ang,” nagpapahayag ito ng mapanuyang hamon sa halip na tuwirang pangako.
- source_word: בְּעֵת
  choice: sa panahon ng
  rationale: Pinananatili ang nominal na temporal na parirala at natural itong pakinggan sa Filipino.
- source_word: צָרַתְכֶם
  choice: inyong kagipitan
  rationale: Ang צָרָה ay matinding problema o panganib. Ang “kagipitan” ay malinaw, natural, at angkop sa sitwasyong nangangailangan ng pagliligtas.
theological_decisions:
- issue: Lakas o gamit ng panghuling pandiwang יוֹשִׁיעוּ
  choice: 'Isinalin bilang mapanuyang hamon: “sila ang magligtas sa inyo.”'
  alternative: 'Payak na panghinaharap: “sila ang magliligtas sa inyo.”'
  rationale: Sa konteksto, sinasaway ng PANGINOON ang Israel dahil bumaling sila sa ibang mga diyos. Ang pangungusap ay hamon na sa mga iyon sila humingi ng saklolo, hindi pangakong talagang ililigtas sila ng mga iyon. Gayunman, itinatala sa talababa ang posibleng payak na panghinaharap.
translation_notes:
  register: Makabagong Filipino na dignificado at madaling maunawaan. Ginamit ang “Humayo” at “kagipitan” upang mapanatili ang matalim ngunit mataas na tono ng pagsaway; ang “dumaing” ay naghahatid ng apurahang paghingi ng saklolo.
