base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: tl
  text: At ang bayan—ang mga pinuno ng Gilead—ay nagsabi sa isa't isa, “Sino ang lalaking magsisimulang lumaban sa mga Ammonita? Siya ang magiging pinuno ng lahat ng naninirahan sa Gilead.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: ang bayan—ang mga pinuno ng Gilead
  rationale: Magkatabing inilalagay ng Hebreo ang “bayan” at “mga pinuno ng Gilead” nang walang tahasang pangatnig. Ginamit ang gitling upang ipakitang ang ikalawa ay paglilinaw sa unang parirala habang kapwa pinananatili.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: sa isa't isa
  rationale: Likas na katumbas sa modernong Tagalog ng pamamahaging idyomang “bawat lalaki sa kaniyang kasama,” at malinaw ang katumbalikang diwa.
- source_word: מִי הָאִישׁ
  choice: Sino ang lalaking
  rationale: Pinananatili ang tahasang panlalaking אִישׁ sa konteksto ng pagpili ng isang pinunong militar.
- source_word: יָחֵל לְהִלָּחֵם
  choice: unang makikipaglaban
  rationale: Ang Hiphil na יָחֵל ay “magsimula.” Sa Tagalog, ang “unang makikipaglaban” ay natural na nagpapahayag kung sino ang magpapasimula o mangunguna sa pakikipaglaban, nang hindi ipinapalagay na siya lamang ang lalaban.
- source_word: בִּבְנֵי עַמּוֹן
  choice: sa mga Ammonita
  rationale: Ang literal na “mga anak ni Ammon” ay karaniwang etnonimo; “mga Ammonita” ang malinaw at likas na tawag sa pangkat ng mga taong tinutukoy.
- source_word: יִהְיֶה לְרֹאשׁ
  choice: Siya ang magiging pinuno
  rationale: Ipinahahayag ang resulta ng pangako at ang diwang pampamahalaan ng metaporang Hebreong “ulo” sa natural na Tagalog.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: ng lahat ng naninirahan sa Gilead
  rationale: Malinaw na saklaw nito ang buong populasyong nakatira sa Gilead.
theological_decisions:
- issue: Tahasang panlalaking wika sa pagpili ng lider militar
  choice: lalaki
  alternative: tao / sino
  rationale: Tahasang ginagamit ng Hebreo ang אִישׁ, at ang konteksto ay pagpili ng isang pinunong militar. Pinananatili ito nang hindi dinaragdagan ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang gitling na paningit upang maipakita ang malamang na apposisyon sa mahirap na pariralang Hebreo. Walang talababa dahil walang alternatibong pagbasa na kailangang ilagay upang luminaw ang talata.
