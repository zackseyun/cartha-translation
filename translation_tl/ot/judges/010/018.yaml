  to: At ang bayan—ang mga pinuno ng Gilead—ay nagsabi sa isa't isa, “Sino ang lalaking magsisimulang lumaban sa mga Ammonita? Siya ang magiging pinuno ng lahat ng naninirahan sa Gilead.”
  rationale: Pinalitan ang “unang makikipaglaban” ng “magsisimulang lumaban” upang malinaw na maipahayag ang pandiwang יָחֵל (“magsimula”) nang walang dagdag na pahiwatig na siya ang unang kikilos ayon sa pagkakasunod-sunod. Pinanatili ang iba pang mga salin dahil tapat ang mga ito sa Hebreo at natural sa modernong Filipino Tagalog.
