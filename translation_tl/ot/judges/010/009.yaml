base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: tl
  text: Tumawid din sa Jordan ang mga Ammonita upang makipaglaban laban sa Juda, Benjamin, at sa sambahayan ni Efraim. Dahil dito, lubhang nalagay sa kagipitan ang Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lubhang nagipit ang Israel.”
    reason: Pinananatili ang saklaw ng Hebreong וַתֵּצֶר, na maaaring maglarawan sa pagkapasok sa matinding kagipitan o sa mismong pagkagipit/pagkabalisa.
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: Tumawid
  rationale: Tiyak na pagtawid sa isang anyong-tubig ang ipinahihiwatig ng pandiwa dahil ang Jordan ang tuwirang layon.
- source_word: בְנֵי עַמּוֹן
  choice: ang mga Ammonita
  rationale: Ito ang natural at makabagong tawag sa pangkat-etniko, sa halip na literal na “mga anak ni Ammon.”
- source_word: אֶת הַיַּרְדֵּן
  choice: sa Jordan
  rationale: Karaniwang pangalan ng ilog sa salaysay na biblikal; malinaw na sa ilog tumawid ang mga Ammonita kahit hindi idagdag ang salitang “Ilog.”
- source_word: לְהִלָּחֵם
  choice: upang makipaglaban
  rationale: Ipinapahayag ng anyong pawatas ang layunin ng pagtawid—ang makibaka o makipagdigma.
- source_word: גַּם
  choice: din
  rationale: 'Pinananatili ang diwang pandagdag: bukod sa naunang pananalakay sa silangan ng Jordan, tumawid sila upang lumaban sa iba pang mga lipi.'
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: sa Juda, Benjamin, at sa sambahayan ni Efraim
  rationale: Sa konteksto ng pakikipaglaban, ang בְּ ay tumutukoy sa mga pinuntirya. Pinanatili ang בֵּית bilang “sambahayan” upang hindi ipantay lamang ito sa pangalang Efraim.
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: Dahil dito, lubhang nalagay sa kagipitan ang Israel
  rationale: Inilalarawan ng sugnay ang matinding kasalatan, panganib, o pagkagipit na sinapit ng Israel. Ginawang tahasang pang-ugnay ang natural na bunga sa Filipino nang hindi nagdaragdag ng tiyak na ahente.
