translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Ginamit ang “makipaglaban” at “kagipitan” bilang mga salitang madaling maunawaan, at pinanatili ang “sambahayan ni Efraim” upang kumatawan sa Hebreong בית אפרים.
