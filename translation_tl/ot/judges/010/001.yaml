base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: tl
  text: Pagkatapos ni Abimelec, bumangon si Tola, anak ni Pua, anak ni Dodo[a], mula sa lipi ni Isacar, upang iligtas ang Israel. Naninirahan siya sa Samir, sa kaburulan ng Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anak ng kaniyang tiyuhin.” Maaaring basahin ang Hebreong בֶּן־דּוֹדוֹ bilang “anak ni Dodo,” na itinuturing na pangalang pantangi ang Dodo, o bilang pariralang nangangahulugang “anak ng kaniyang tiyuhin.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Pinananatili nito ang salaysay na diwa ng paglitaw ng isang pinuno, nang hindi ipinapalagay na pormal siyang hinirang.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: Pagkatapos ni Abimelec
  rationale: Likas at tuwirang panandang temporal sa modernong Tagalog.
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: upang iligtas ang Israel
  rationale: Saklaw ng 'iligtas' ang pagliligtas mula sa panganib nang hindi nililimitahan ang kahulugan sa gawaing militar.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: בֶּן־פּוּאָה
  choice: anak ni Pua
  rationale: Likas na anyo sa Tagalog ng karaniwang konstruksiyong pangangkanan.
- source_word: בֶּן־דּוֹדוֹ
  choice: apo ni Dodo
  rationale: Sa sunod-sunod na talaangkanan, ang ikalawang ben ay likas na ipinahahayag sa Tagalog bilang 'apo ni'; pinananatili ang Masoretikong pagbasa kay Dodo bilang pangalang pantangi, habang inilalagay sa talababa ang tunay na alternatibong pagbasa.
- source_word: אִישׁ יִשָּׂשכָר
  choice: mula sa lipi ni Isacar
  rationale: Malinaw at likas na ipinahahayag ang pagkakaugnay niya sa tribo ni Isacar.
- source_word: וְהוּא יֹשֵׁב
  choice: Nanirahan siya
  rationale: Idyomatikong paglalarawan sa lugar ng tirahan, na walang makalumang himig.
- source_word: בְּשָׁמִיר
  choice: sa Samir
  rationale: Transliterasyon ng pangalan ng lugar ayon sa karaniwang tunog sa Filipino.
- source_word: בְּהַר אֶפְרָיִם
  choice: sa kaburulan ng Efraim
  rationale: Ipinahahayag ang heograpikong rehiyon nang mas tumpak kaysa sa maaaring mapanlinlang na 'mga bundok.'
