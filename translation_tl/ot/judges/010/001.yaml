  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang Filipino biblical forms ng mga pangalan: Abimelec, Pua, Isacar, Samir, at Efraim. Hinati sa tatlong pangungusap upang maging natural at madaling maunawaan nang hindi binabago ang impormasyong nasa Hebreo.'
