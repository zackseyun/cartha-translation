  text: וַ/יִּצָּֽעֲקוּ֙ בְּנֵ֣י עַמּ֔וֹן וַֽ/יַּחֲנ֖וּ בַּ/גִּלְעָ֑ד וַ/יֵּאָֽסְפוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/מִּצְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/017.yaml
  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: tl
  text: Pagkatapos, tinipon ang mga Ammonita at nagkampo sila sa Gilead.[a] Nagtipon naman ang mga Israelita at nagkampo sa Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumigaw ang mga Ammonita at nagkampo sila sa Gilead.” Maaaring mangahulugang “sumigaw” ang pandiwang Hebreo, ngunit sa kontekstong ito malamang na tumutukoy ito sa pagtitipon o pagtawag sa kanila para sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: tinipon
  rationale: Karaniwang nangangahulugang “sumigaw” ang צעק, ngunit sa kontekstong militar at kasunod na pagkakampo, malamang na tumutukoy ito sa pagtawag o pagtitipon para sa labanan. Pinananatili sa talababa ang literal na posibleng kahulugan.
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Ang literal na “mga anak ni Ammon” ay katawagan sa pangkat-etniko; “mga Ammonita” ang malinaw at likas na anyo sa modernong Filipino.
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Tuwirang ipinahahayag ang pagtatayo o pananatili sa kampo at ang kontekstong militar sa natural na Filipino.
- source_word: בַּגִּלְעָד
  choice: sa Gilead
  rationale: Ang Gilead ay isang rehiyon; sapat at natural sa Filipino ang pang-ukol na “sa.”
- source_word: וַיֵּאָסְפוּ
  choice: nagtipon
  rationale: Ipinahahayag ng אסף ang sama-samang pagtitipon o pag-assemble; malinaw at natural ang “nagtipon.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak ni Israel,” tumutukoy ang parirala sa bayang Israel bilang isang pangkat. Ang “mga Israelita” ay tumpak, maikli, at karaniwan sa modernong Filipino.
- source_word: בַּמִּצְפָּה
  choice: sa Mizpa
  rationale: Natural na gamit sa Filipino ang “sa” para sa lugar na pinagkampuhan; “Mizpa” ang pamilyar na anyong Tagalog ng pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang maiikling pandiwang “tinipon,” “nagtipon,” at “nagkampo” upang mapanatili ang mabilis na takbo at magkatulad na estruktura ng salaysay. Ang “naman” ay nagpapakita ng pagtutumbas sa pagkilos ng dalawang panig nang hindi nagdaragdag ng teolohikal na pagpapakahulugan.
