base_translation:
  language: en
  yaml_path: translation/ot/judges/010/003.yaml
  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: tl
  text: Pagkatapos niya, bumangon si Jair na taga-Gilead[a] at namuno bilang hukom sa Israel sa loob ng dalawampu't dalawang taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “humalili sa kanya si Jair na taga-Gilead,” ayon sa pormula ng pagkakasunod sa simula ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Pinananatili nito ang karaniwang pormula ng salaysay para sa paglitaw ng kasunod na pinuno, nang hindi ito nililimitahan sa literal na pagtayo.
- source_word: אַחֲרָיו
  choice: Pagkatapos niya
  rationale: Tuwirang tumutukoy ito sa naunang hukom at malinaw na naghuhudyat ng pagkakasunod sa salaysay.
- source_word: יָאִיר
  choice: Jair
  rationale: Ginamit ang karaniwang transliterasyon ng pangalang Hebreo sa Filipino.
- source_word: הַגִּלְעָדִי
  choice: taga-Gilead
  rationale: Natural at malinaw sa modernong Filipino ang anyong ito para sa panrehiyong pinagmulan o kaugnayan ni Jair.
- source_word: וַיִּשְׁפֹּט
  choice: namuno bilang hukom
  rationale: Ipinahahayag nito ang mas malawak na tungkuling pamumuno ng שפט sa aklat ng Mga Hukom, habang pinananatili ang mahalagang katawagang 'hukom' at iniiwasan ang makitid na modernong kahulugang panghukuman lamang.
- source_word: אֶת יִשְׂרָאֵל
  choice: sa Israel
  rationale: Natural na minamarkahan ng 'sa' ang bayang pinamunuan ni Jair bilang hukom.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: sa loob ng dalawampu't dalawang taon
  rationale: Ito ang natural na modernong Filipino para sa tiyak na tagal na dalawampu't dalawang taon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “namuno bilang hukom” upang maipakita ang kontekstuwal na saklaw ng tungkulin sa Mga Hukom nang hindi nawawala ang terminong “hukom.”
