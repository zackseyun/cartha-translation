base_translation:
  language: en
  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: tl
  text: Ngunit tinalikuran ninyo ako at naglingkod kayo sa ibang mga diyos. Kaya hindi ko na kayo ililigtas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sasagipin” o “palalayain.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagliligtas mula sa mga kaaway, gayundin sa pagliligtas sa mas malawak na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Ngunit … ninyo
  rationale: Ang pangatnig na may tahasang panghalip ay nagbibigay ng diin at pagsalungat sa naunang pahayag; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “Ngunit” at ng pangmaramihang “ninyo.”
- source_word: עֲזַבְתֶּם
  choice: tinalikuran
  rationale: Ipinahahayag nito ang sinadyang pag-iwan o pagtatakwil sa isang ugnayan. Mas angkop ang “tinalikuran” kaysa sa payak na “iniwan” dahil napapanatili nito ang bigat ng pagtataksil sa Diyos.
- source_word: אוֹתִי
  choice: ako
  rationale: Tuwirang katumbas ng panghalip na layon; sa natural na ayos ng Tagalog pagkatapos ng “tinalikuran,” ginagamit ang “ako.”
- source_word: וַ/תַּעַבְדוּ
  choice: at naglingkod kayo
  rationale: Ang עבד kapag mga diyos ang layon ay tumutukoy sa paglilingkod na may kasamang pagsamba at katapatan. Pinananatili ng “naglingkod” ang lawak ng salitang Hebreo kaysa limitahan ito sa gawaing pagsamba lamang.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang ipinakikita ng parirala ang pagsunod sa mga diyos na iba sa Diyos ng Israel. Ang “mga” ay natural na panandang pangmaramihan sa Tagalog.
- source_word: לָכֵן
  choice: Kaya
  rationale: Malinaw at natural na ipinahahayag ng “Kaya” ang bunga o hatol na nagmumula sa naunang ginawa ng Israel.
- source_word: לֹא אוֹסִיף
  choice: hindi ko na
  rationale: Ang יסף na may pagtanggi ay nagpapahayag ng hindi na pagpapatuloy o hindi na muling paggawa. Ang “hindi ko na” ang maikli at likas na katumbas nito sa Tagalog.
- source_word: לְ/הוֹשִׁיעַ
  choice: ililigtas
  rationale: Maaaring mangahulugan ang ישע ng iligtas, sagipin, o palayain. Ang “ililigtas” ay angkop sa agarang paglaya mula sa mga maniniil at pinananatili rin ang mas malawak na diwa ng pagliligtas.
- source_word: אֶתְ/כֶם
  choice: kayo
  rationale: Tumutukoy ito sa buong bayan sa pangmaramihan; ang “kayo” ang natural na layon sa konstruksiyong “hindi ko na kayo ililigtas.”
theological_decisions:
- issue: Kahulugan ng ישע sa konteksto ng mga hukom
  choice: ililigtas
  alternative: sasagipin; palalayain
  rationale: Ang agarang konteksto ay pagliligtas ng Diyos sa Israel mula sa pang-aapi, ngunit mas malawak ang saklaw ng pandiwang Hebreo. Hindi nililimitahan ng “ililigtas” ang salita sa espirituwal na kaligtasan lamang, at inilalahad sa talababa ang mga alternatibong nagpapalinaw sa kontekstuwal na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tinalikuran” upang mapanatili ang bigat ng nasirang ugnayan, samantalang ang “naglingkod” ay sadyang hindi pinalitan ng mas makitid na “sumamba.” Inilipat ang pananda ng talababa sa “ililigtas,” ang salitang aktuwal na tinatalakay nito.
