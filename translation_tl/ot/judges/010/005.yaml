lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Ang pandiwang מות ay tuwirang nagsasaad ng pagkamatay; ang “namatay” ang karaniwan, malinaw, at angkop na salin sa salaysay.
- source_word: יָאִיר
  choice: Jair
  rationale: Isinalin sa baybay na “Jair,” ang kinagawiang transliterasyon ng pangalang Hebreo sa modernong saling Tagalog.
- source_word: וַיִּקָּבֵר
  choice: inilibing
  rationale: Ang Niphal ng קבר ay pasibong anyo. Sa natural na Tagalog, ang “inilibing” ay maaaring gamitin nang hindi tahasang binabanggit ang gumawa at malinaw na naghahatid ng diwang “was buried.”
- source_word: בְּקָמוֹן
  choice: sa Kamon
  rationale: Ang בְּ ay lokatibo rito; “sa Kamon” ang natural na katumbas sa Tagalog para sa lugar ng paglilibing.
