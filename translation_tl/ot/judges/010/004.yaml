base_translation:
  language: en
  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: tl
  text: May tatlumpung anak na lalaki si Jair na nakasakay sa tatlumpung asno, at mayroon silang tatlumpung bayan. Hanggang sa araw na ito, ang mga bayang iyon ay tinatawag na Havot-Jair, at ang mga ito ay nasa lupain ng Gilead.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנִים
  choice: mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebreo, kaya hindi sapat ang mas malawak na “mga anak.”
- source_word: רֹכְבִים עַל שְׁלֹשִׁים עֲיָרִים
  choice: nakasakay sa tatlumpung asno
  rationale: Ang עַיִר sa kontekstong ito ay batang lalaking asno; natural sa Filipino ang “asno,” at hindi kailangang idiin ang edad o kasarian ng hayop.
- source_word: שְׁלֹשִׁים עֲיָרִים לָהֶם
  choice: mayroon silang tatlumpung bayan
  rationale: Pinananatili ang wordplay ng Hebreo sa magkatunog na עֲיָרִים (mga asno) at עֲיָרִים (mga bayan) hangga't maaari sa magkatabing sugnay, bagaman hindi ito matutumbasan sa Filipino.
- source_word: חַוֹּת יָאִיר
  choice: Havot-Jair
  rationale: Isinalin-baybay ang pangalang pantangi sa halip na bigyan ng interpretatibong salin; ang anyong ito ay malapit sa bigkas ng Hebreo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Hanggang ngayon
  rationale: Natural at tumpak na katumbas ng pormulang Hebreo na tumutukoy sa panahon ng tagapagsalaysay.
- source_word: אֲשֶׁר בְּאֶרֶץ הַגִּלְעָד
  choice: at nasa lupain ng Gilead
  rationale: Nililinaw sa natural na Filipino na ang mga bayan ang nasa Gilead, nang hindi binabago ang referent.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tahasang pangalang “Jair,” na implicit sa panghalip ng Hebreo ngunit malinaw mula sa naunang talata, upang maiwasan ang malabong simula sa Filipino. Walang idinagdag na paliwanag na ang pagsakay sa asno o pagmamay-ari ng mga bayan ay tanda ng katayuan, bagaman maaaring ipinahihiwatig iyon ng salaysay.
