source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: tl
  text: Kaya tinipon ni Jefte ang lahat ng kalalakihan ng Gilead at nakipaglaban sa Efraim. Tinalo ng mga taga-Gilead ang Efraim dahil sinabi ng Efraim, “Kayong mga taga-Gilead ay mga takas ng Efraim, sa gitna ng Efraim at sa gitna ng Manases.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap unawain ang Hebreo sa panghuling paratang. Maaari ring isalin: “Kayo ay mga takas ng Efraim, O Gilead, sa gitna ng Efraim at sa gitna ng Manases.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: tinipon
  rationale: Karaniwang kahulugan ng קבץ ang tipunin o pagtipunin. Ang “tinipon” ay likas sa modernong Tagalog at angkop sa pagtawag sa mga lalaki para sa labanan nang hindi labis na tinutukoy ang paraan ng mobilisasyon.
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: ang lahat ng kalalakihan ng Gilead
  rationale: Malapit ito sa literal na “lahat ng mga lalaki ng Gilead.” Ipinahihiwatig ng konteksto na sila ang mga lalaking lumaban, ngunit hindi idinagdag ang “mandirigma,” na wala sa mismong parirala.
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: nakipaglaban sa Efraim
  rationale: Ang Niphal ng לחם ay nangangahulugang makipaglaban. Likas sa Tagalog ang “nakipaglaban sa” at malinaw sa konteksto na magkalaban ang dalawang panig.
- source_word: וַיַּכּוּ
  choice: nilupig
  rationale: Maaaring mangahulugan ang נכה ng hampasin, pabagsakin, o gapiin sa labanan. Inihahatid ng “nilupig” ang matagumpay at marahas na pagkatalo ng Efraim nang hindi ipinapalagay na pinatay ang bawat isa.
- source_word: כִּי
  choice: dahil
  rationale: Ipinakikilala nito ang dahilan ng labanan o paglipol; malinaw at natural ang “dahil” sa kasalukuyang Tagalog.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: mga takas mula sa Efraim
  rationale: Ang פְּלִיטִים ay mga tumakas o nakaligtas sa pagtakas. Pinananatili ng “mga takas” ang mapanlait na puwersa ng salita, samantalang ang “mula sa” ay isang natural ngunit hindi ganap na mapagpasiyang pagsasalin ng ugnayan sa Efraim.
- source_word: אַתֶּם גִּלְעָד
  choice: kayong mga taga-Gilead
  rationale: Ginagamit ng Hebreo ang pangalan ng lupain para sa mga mamamayan nito. Ang “mga taga-Gilead” ang likas na katumbas sa Tagalog.
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: sa gitna ng Efraim at sa gitna ng Manases
  rationale: Ang בְּתוֹךְ ay “sa gitna ng” o “kabilang sa.” Pinanatili ang pag-uulit upang katawanin ang anyo at di-tiyak na heograpikong pahiwatig ng Hebreo.
theological_decisions:
- issue: Mahirap at siksik na sintaks ng panghuling panlalait
  choice: “Kayong mga taga-Gilead ay mga takas mula sa Efraim, sa gitna ng Efraim at sa gitna ng Manases.”
  alternative: “Mga takas kayo ng Efraim, O Gilead, sa gitna ng Efraim at sa gitna ng Manases.”
  rationale: Hindi tiyak kung paano eksaktong kaugnay ng “mga takas ng Efraim” ang “kayo” at “Gilead.” Pinananatili ng pangunahing salin ang tuwirang panlalait at ang leksikal na kahulugan ng פְּלִיטֵי, habang inilalahad sa talababa ang mas pormal na alternatibo sa halip na tahimik na lutasin ang kalabuan.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga kinikilalang anyong Filipino ng mga pangalan: Jefte, Efraim, at Manases. Pinanatili ang pag-uulit sa panghuling parirala at minarkahan ang tunay na kalabuan ng Hebreo sa talababa.'
