revisions:
- from: Kaya tinipon ni Jefte ang lahat ng kalalakihan ng Gilead at nakipaglaban sa Efraim. Nilupig ng mga taga-Gilead ang Efraim dahil sinabi ng mga ito, “Kayong mga taga-Gilead ay mga takas mula sa Efraim, sa gitna ng Efraim at sa gitna ng Manases.”[a]
  to: Kaya tinipon ni Jefte ang lahat ng kalalakihan ng Gilead at nakipaglaban sa Efraim. Tinalo ng mga taga-Gilead ang Efraim dahil sinabi ng Efraim, “Kayong mga taga-Gilead ay mga takas ng Efraim, sa gitna ng Efraim at sa gitna ng Manases.”[a]
  rationale: Nilinaw ang Efraim bilang nagsalita, pinalitan ang “nilupig” ng mas maingat na “tinalo,” at ginawang “mga takas ng Efraim” ang pangunahing salin upang huwag magpasiya sa ugnayang malabo sa Hebreo. Pinanatili ang pag-uulit ng “sa gitna ng” at ang talababa para sa alternatibong pagbasa.
