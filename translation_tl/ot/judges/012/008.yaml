  text: וַ/יִּשְׁפֹּ֤ט אַֽחֲרָי/ו֙ אֶת יִשְׂרָאֵ֔ל אִבְצָ֖ן מִ/בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/008.yaml
  text: After him[a], Ibzan from Bethlehem judged Israel.
translation:
  language: tl
  text: Pagkatapos niya, si Ibzan mula sa Bethlehem[a] ay naging hukom sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “si Ibzan ng Bethlehem.” Ang pang-ukol sa Hebreo ay maaaring magpahiwatig ng pinagmulan o kaugnayan sa isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: ay naging hukom
  rationale: Sa aklat ng Mga Hukom, ang שׁפט ay tumutukoy sa paglilingkod bilang hukom at pinuno ng Israel. Pinananatili ng “naging hukom” ang paulit-ulit na katawagan ng aklat at mas natural ito sa makabagong Tagalog kaysa sa “hinatulan ang Israel.”
- source_word: אַחֲרָיו
  choice: Pagkatapos niya
  rationale: Ipinahihiwatig ng pang-ukol at hulaping panghalip ang paghalili sa naunang hukom. Malinaw sa konteksto ang tinutukoy ng “niya,” kaya hindi kailangang idagdag ang pangalan ni Jefta.
- source_word: אֶת יִשְׂרָאֵל
  choice: sa Israel
  rationale: Ang Israel ang saklaw ng paglilingkod ni Ibzan bilang hukom. Dahil isinalin ang pandiwa bilang “naging hukom,” likas sa Tagalog ang pariralang “sa Israel.”
- source_word: אִבְצָן
  choice: Ibzan
  rationale: Isinalin ang pangalang pantangi ayon sa karaniwang transliterasyon sa Tagalog.
- source_word: מִבֵּית לָחֶם
  choice: mula sa Bethlehem
  rationale: Karaniwang ipinahihiwatig ng מִן ang pinagmulan, kaya natural ang “mula sa Bethlehem.” Maaari rin itong magpahiwatig ng kaugnayan sa lugar, kaya inilakip ang alternatibo sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naging hukom sa Israel” upang mapanatili ang katawagan ng aklat habang umiiwas sa maling dating na si Ibzan ay humatol laban sa Israel. Inilagay ang talababa sa “Bethlehem,” ang mismong pariralang may leksikal na pagkakaiba.
