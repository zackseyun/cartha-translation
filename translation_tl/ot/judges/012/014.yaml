base_translation:
  language: en
  yaml_path: translation/ot/judges/012/014.yaml
  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: tl
  text: Mayroon siyang apatnapung anak na lalaki at tatlumpung apo, at ang mga ito ay nakasakay sa pitumpung asno. Naging hukom siya ng Israel sa loob ng walong taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנִים
  choice: mga anak na lalaki
  rationale: Tiyak na mga lalaking anak ang tinutukoy ng Hebreo, kaya nilinaw ang kasarian sa natural na Tagalog.
- source_word: בְּנֵי בָנִים
  choice: mga apo
  rationale: Literal itong “mga anak ng mga anak,” ngunit “mga apo” ang likas at eksaktong katumbas sa Tagalog; hindi nililimitahan ang kasarian nang higit sa tahasang sinasabi ng parirala.
- source_word: עֲיָרִם
  choice: mga asno
  rationale: Tumutukoy ito sa mga asno, mas partikular sa mga lalaking asno; sapat at natural ang pangkalahatang “asno” sa kontekstong ito.
- source_word: וַיִּשְׁפֹּט
  choice: Naging hukom siya
  rationale: Sa Aklat ng Mga Hukom, ang pandiwang ito ay tumutukoy sa paglilingkod bilang hukom o pinuno, hindi lamang sa paghatol ng mga kaso.
theological_decisions:
- issue: Saklaw ng pariralang “sumasakay sa pitumpung asno”
  choice: Pinanatiling kasunod ng pinagsamang apatnapung anak at tatlumpung apo
  alternative: Iugnay lamang sa mga apo
  rationale: Ang panlalaking maramihang participle na רֹכְבִים ay pinaka-natural na tumutukoy sa pinagsamang pitumpung inapo; hindi kailangang lutasin nang higit pa ang sintaktikong pagkakaugnay.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “sa loob ng walong taon” para sa malinaw at natural na pagpapahayag ng tagal.
