base_translation:
  language: en
  yaml_path: translation/ot/judges/012/010.yaml
  text: Then Ibzan died and was buried in Bethlehem.
translation:
  language: tl
  text: Pagkatapos, namatay si Ibzan at inilibing siya sa Bethlehem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Pagkatapos, namatay
  rationale: Ang waw-consecutive ay nagpapatuloy sa sunod-sunod na salaysay. Likas sa modernong Tagalog ang “Pagkatapos” upang ipakita ang kasunod na pangyayari, at ang pandiwa ay nangangahulugang “namatay.”
- source_word: אִבְצָן
  choice: Ibzan
  rationale: Isinatinig ang pangalang pantangi ayon sa nakagawiang anyo sa Bibliyang Tagalog sa halip na isalin ang posibleng kahulugan nito.
- source_word: וַיִּקָּבֵר
  choice: inilibing
  rationale: Ang anyong Niphal ay may diwang balintiyak dito. Ang “inilibing” ang malinaw at karaniwang katumbas sa Tagalog; nauunawaan mula sa balarila na si Ibzan ang inilibing.
- source_word: בְּבֵית לָחֶם
  choice: sa Bethlehem
  rationale: Ang בְּ ay tumutukoy sa lokasyon, na likas na isinasalin bilang “sa,” at pinanatili ang kinagawiang anyo ng pangalan ng lugar na “Bethlehem.”
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at likas na salaysay sa modernong Filipino Tagalog. Pinanatili ang payak na pagkakasunod ng dalawang pangyayari nang walang idinagdag na paliwanag.
