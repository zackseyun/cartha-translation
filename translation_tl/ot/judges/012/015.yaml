base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: tl
  text: At namatay si Abdon, na anak ni Hillel at taga-Piraton. Inilibing siya sa Piraton, sa lupain ng Efraim, sa kaburulan ng mga Amalekita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na salin, “sa bundok ng Amalekita.” Pang-isahan ang anyong Hebreo, ngunit malamang na kolektibo o panteritoryo ang gamit nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: At namatay
  rationale: Tuwirang isinasalin ang pandiwang מות bilang “namatay,” nang walang eupemismo; pinananatili rin ng “At” ang pang-ugnay na וַ.
- source_word: עַבְדּוֹן בֶּן הִלֵּל
  choice: si Abdon na anak ni Hillel
  rationale: Isinalin ang ugnayang בֶּן sa likas na Filipino na “anak ni,” at tinumbasan ang mga pangalang pantangi ayon sa karaniwang transliterasyon.
- source_word: הַפִּרְעָתוֹנִי
  choice: na taga-Piraton
  rationale: Ang gentilic ay tumutukoy sa pinagmulan ni Abdon; mas natural at malinaw sa modernong Filipino ang “taga-Piraton” kaysa sa isang ginawang pangngalang anyo gaya ng “Piratonita.”
- source_word: וַיִּקָּבֵר
  choice: Inilibing siya
  rationale: Ang Niphal ng קבר ay pasibo rito. Malinaw at natural na ipinahahayag ng “Inilibing siya” ang pangyayari.
- source_word: בְּפִרְעָתוֹן
  choice: sa Piraton
  rationale: Lokasyonal ang בְּ, kaya “sa”; transliterado ang pangalan ng lugar.
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: sa lupain ng Efraim
  rationale: Pinananatili ang tahasang אֶרֶץ (“lupain”) sa heograpikong parirala.
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: sa kaburulan ng mga Amalekita
  rationale: Sa ganitong heograpikong gamit, maaaring tumukoy ang הַר sa bulubundukin o kaburulan, hindi lamang sa iisang bundok. Ang pang-isahang gentilic ay malamang na kolektibo o panteritoryo ang diwa, kaya likas sa Filipino ang maramihang “mga Amalekita.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng “taga-Piraton” para sa likas na pagpapahayag ng gentilic at “kaburulan” para sa panrehiyong kahulugan ng הַר. Inilagay ang talababa sa pariralang heograpiko na tinutukoy nito.
