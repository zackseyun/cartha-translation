base_translation:
  language: en
  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: tl
  text: Pagkatapos, namatay si Elon na mula sa lipi ni Zebulun, at inilibing siya sa Ayalon, sa lupain ng Zebulun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa teritoryo ng Zebulun.”
    reason: Pinananatili ang leksikal na alternatibo ng אֶרֶץ, na maaaring mangahulugang “lupain” o “teritoryo” sa kontekstong heograpiko.
lexical_decisions:
- source_word: וַיָּמָת
  choice: Pagkatapos, namatay
  rationale: Ang wayyiqtol ng מות ay nagsasaad ng kasunod na pangyayari sa salaysay. Likas sa modernong Filipino ang “Pagkatapos” habang pinananatili ang payak na diwang “namatay.”
- source_word: אֵלוֹן
  choice: Elon
  rationale: Isinalin sa titik-Latin ang pangalang pantangi sa paraang malapit sa anyong Hebreo.
- source_word: הַזְּבוּלֹנִי
  choice: na mula sa lipi ni Zebulun
  rationale: Ang gentilic na may pantukoy ay nagpapakilala sa ugnayang pantribo ni Elon. Mas malinaw at natural ito sa karaniwang Filipino kaysa sa hiram na katawagang “Zebulunita.”
- source_word: וַיִּקָּבֵר
  choice: at inilibing siya
  rationale: 'Ang Nifal ng קבר ay pasibo: “inilibing.” Ginagawang lantad ng “siya” ang tinutukoy nang walang idinaragdag na bagong kahulugan.'
- source_word: בְּאַיָּלוֹן
  choice: sa Ayalon
  rationale: Ang בְּ ay tumutukoy sa lugar ng libing. Ang “Ayalon” ay tuwirang transliterasyon ng pangalang Hebreo אַיָּלוֹן at natural na ginagamit kasunod ng “sa.”
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: sa lupain ng Zebulun
  rationale: Ang אֶרֶץ ay maaaring tumukoy sa lupain o teritoryo. Pinananatili ng “lupain” ang konkretong heograpikong diwa at ang pagiging malapit sa anyo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “mula sa lipi ni Zebulun” upang maging malinaw sa ordinaryong mambabasa ang gentilic, at “Ayalon” bilang transliterasyong nakabatay sa Hebreo. Inilagay ang talababa pagkatapos ng pariralang tinutukoy nito.
