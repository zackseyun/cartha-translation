    issue: “Pinatay” para sa וַיִּשְׁחָטוּהוּ
    rationale: Ang שׁחט ay mas tiyak at masidhi kaysa sa pangkalahatang “patayin.” Ang “kinatay” ay likas sa salaysay na rehistro at mas tapat sa lakas ng pandiwa.
  - severity: low
    issue: Walang talababa para sa Shibbólet
    rationale: Ang terminong ito ay isang salitang panubok sa pagbigkas at may mga leksikal na kahulugang hindi ginagamit sa talata. Ang maikling talababa, na may marker sa salita, ay kapaki-pakinabang at maayos ang pagkakaangkla.
  - severity: low
    issue: Bahagyang di-natural na “Pakisabi” at “nang gayon”
    rationale: Ang “Sabihin mo nga” at “nang ganoon” ay mas likas na modernong Filipino habang pinananatili ang magalang na puwersa ng נָא at ang kahulugang hindi niya mabigkas sa hinihinging paraan.
