- from: Pagkatapos ay sinabi nila sa kanya, “Pakisabi ang ‘Shibbólet.’” Sinabi naman niya, “Sibbólet,” sapagkat hindi niya iyon mabigkas nang gayon. Kaya sinunggaban nila siya at pinatay sa mga tawiran ng Jordan. Nang panahong iyon, apatnapu't dalawang libo mula sa Efraim ang nasawi.
  to: Pagkatapos ay sinabi nila sa kanya, “Sabihin mo nga ang ‘Shibbólet.’”[a] Ngunit sinabi niya, “Sibbólet,” sapagkat hindi niya iyon mabigkas nang ganoon. Kaya dinakip nila siya at kinatay sa mga tawiran sa Jordan. Nang panahong iyon, apatnapu’t dalawang libong taga-Efraim ang nasawi.
