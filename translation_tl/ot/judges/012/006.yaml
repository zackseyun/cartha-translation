translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang tunog-kontrast ng Shibbólet/Sibbólet sa transliterasyon. Walang talababa sapagkat ang marker sa ibinigay na English consultation text ay nakakabit sa panghalip sa halip na sa terminong ipinapaliwanag; upang masunod ang tuntuning ang bawat marker ay dapat nasa pangunahing teksto at maiwasan ang maling pagkakabit, hindi isinama ang di-kailangang leksikal na talababa.
