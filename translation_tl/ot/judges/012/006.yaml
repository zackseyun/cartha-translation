  verdict: revise
  source_fidelity: Kailangang palakasin ang salin ng וַיִּשְׁחָטוּהוּ. Ang “pinatay” ay tama sa pangkalahatan ngunit pinapahina ang tiyak na marahas na pandiwang Hebreo, na mas malapit sa “kinatay” o “pinatay nang malupit.” Ang “kinatay” ay tapat at hindi nagdaragdag ng paraan ng pagpatay. Ang pagsubok sa pagbigkas, mga tawiran ng Jordan, at bilang na 42,000 ay napanatili.
  naturalness: Mas natural ang “Sabihin mo nga” kaysa “Pakisabi” sa tuwirang utos na may kasunod na salitang dapat bigkasin. Ang “nang ganoon” ay mas karaniwang modernong Filipino kaysa “nang gayon” sa kontekstong ito. Ang “mga tawiran sa Jordan” ay malinaw na tumutukoy sa mga tawiran ng ilog.
  terminology: Ang Shibbólet/Sibbólet ay angkop na transliterasyon at malinaw na ipinakikita ang mahalagang pagkakaiba ng sh at s. Dapat may talababa ang Shibbólet upang mapanatili ang leksikal na impormasyong nasa audit trail; ang marker ay ikakabit sa mismong salitang ipinaliliwanag, hindi sa panghalip.
  issues:
