  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אֱמָר נָ֨א שִׁבֹּ֜לֶת וַ/יֹּ֣אמֶר סִבֹּ֗לֶת וְ/לֹ֤א יָכִין֙ לְ/דַבֵּ֣ר כֵּ֔ן וַ/יֹּאחֲז֣וּ אוֹת֔/וֹ וַ/יִּשְׁחָט֖וּ/הוּ אֶל מַעְבְּר֣וֹת הַ/יַּרְדֵּ֑ן וַ/יִּפֹּ֞ל בָּ/עֵ֤ת הַ/הִיא֙ מֵֽ/אֶפְרַ֔יִם אַרְבָּעִ֥ים וּ/שְׁנַ֖יִם אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: tl
  text: Pagkatapos ay sinabi nila sa kanya, “Sabihin mo nga ang ‘Shibbólet.’”[a] Ngunit sinabi niya, “Sibbólet,” sapagkat hindi niya iyon mabigkas nang ganoon. Kaya dinakip nila siya at kinatay sa mga tawiran sa Jordan. Nang panahong iyon, apatnapu’t dalawang libong taga-Efraim ang nasawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong Shibbólet ay malamang na nangangahulugang “uhay ng butil” o “agos/baha,” ngunit dito ay ginamit bilang salitang panubok sa pagbigkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: Pakisabi
  rationale: Ang pautos na אֱמָר kasama ng נָא ay may magalang na pakiusap; natural at maikli sa modernong Tagalog ang “Pakisabi.”
- source_word: שִׁבֹּלֶת
  choice: Shibbólet
  rationale: Ginamit ang salita bilang pagsubok sa pagbigkas, kaya transliterasyon ang pinakamalinaw. Nilagyan ng tuldik upang gabayan ang mambabasang Tagalog sa diin.
- source_word: סִבֹּלֶת
  choice: Sibbólet
  rationale: Pinananatili ng transliterasyon ang mahalagang pagkakaiba ng unang tunog na “sh” at “s.”
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: sapagkat hindi niya iyon mabigkas nang gayon
  rationale: Bagaman literal na tumutukoy sa hindi niya maihandang sabihin nang gayon, malinaw sa konteksto na ang suliranin ay ang pagbigkas. Iniiwasan ng “nang gayon” ang mapanghusgang dagdag na “nang tama.”
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: sinunggaban nila siya
  rationale: Ipinapahayag ng אחז ang biglaan at marahas na pagdakip; ang “sinunggaban” ay natural at masinsin kaysa simpleng “hinuli.”
- source_word: וַיִּשְׁחָטוּהוּ
  choice: pinatay
  rationale: Ang שׁחט ay maaaring mangahulugang katayin o patayin. Sa Tagalog, ang “kinatay” para sa tao ay maaaring maging labis na kolokyal o magdagdag ng tiyak na paraang hindi kailangan; pinananatili ng “pinatay” ang malinaw na kahulugan sa marangal na rehistro.
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: sa mga tawiran ng Jordan
  rationale: Ang מַעְבְּרוֹת ay mga lugar na tinatawiran sa ilog. Ang “mga tawiran” ay natural at hindi nag-aakalang pamilyar ang mambabasa sa teknikal na “tawiran na mababaw.”
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: mula sa Efraim ang nasawi
  rationale: Sa konteksto ng labanan, ang נפל ay tumutukoy sa pagkamatay. Mas natural sa Tagalog ang “nasawi” kaysa literal na “nabuwal,” habang pinananatili ng “mula sa Efraim” ang anyo ng Hebreo.
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: apatnapu't dalawang libo
  rationale: Tuwirang salin ng bilang.
