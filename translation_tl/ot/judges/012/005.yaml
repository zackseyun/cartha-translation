base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: tl
  text: Kinuha ng mga taga-Gilead ang mga tawiran[a] sa Ilog Jordan laban sa Efraim. Sa tuwing sasabihin ng isang takas mula sa Efraim, “Hayaan ninyo akong tumawid,” tatanungin siya ng mga taga-Gilead, “Efraimita ka ba?” Kapag sumagot siya, “Hindi,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa mabababaw na bahagi ng ilog na ginagamit sa pagtawid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: Sinakop
  rationale: Ipinahihiwatig ng לכד ang pag-agaw o pagkuha sa isang lugar sa kontekstong militar; malinaw na ipinapakita ng “sinakop” na kinontrol ng Gilead ang mahahalagang tawiran.
- source_word: מַעְבְּרוֹת
  choice: mga tawiran
  rationale: Tumutukoy ito sa mabababaw na bahagi ng ilog na maaaring tawirin. Mas karaniwan at madaling maunawaan sa modernong Filipino ang “mga tawiran” kaysa sa isang teknikal na katawagan.
- source_word: לְאֶפְרָיִם
  choice: upang harangan ang Efraim
  rationale: Sa konteksto, kinuha ng Gilead ang mga tawiran para gamitin laban sa Efraim at pigilan ang pagtakas nila. Likas sa Filipino ang ganitong pagpapahayag ng layuning salungat sa Efraim.
- source_word: וְהָיָה כִּי
  choice: Sa tuwing
  rationale: Ipinakikilala ng idyoma ang isang paulit-ulit na pangyayari; malinaw na naihahatid ng “Sa tuwing” ang aspektong ito.
- source_word: פְּלִיטֵי אֶפְרָיִם
  choice: isang takas mula sa Efraim
  rationale: Ang פָּלִיט ay taong nakatakas, lalo na mula sa labanan. Ginawang pang-isahan ang generic na kalahok upang maging malinaw ang kasunod na pang-isahang pagtukoy sa kaniya.
- source_word: אֶעֱבֹרָה
  choice: Hayaan ninyo akong tumawid
  rationale: Ang cohortative ay nagpapahayag dito ng kahilingan o pagnanais; natural na naihahatid ito ng “Hayaan ninyo akong tumawid.”
- source_word: הַאֶפְרָתִי
  choice: Efraimita
  rationale: Ang anyo ay katawagan sa kasapi ng lipi o pangkat ng Efraim; “Efraimita” ang malinaw at nakagawiang katumbas sa Filipino.
- source_word: וַיֹּאמְרוּ לוֹ ... אַתָּה
  choice: tatanungin siya ... “Efraimita ka ba?”
  rationale: Bagaman literal na “sasabihin sa kaniya,” ang nilalaman ay tuwirang tanong. Pinananatili ng anyong panghinaharap sa kontekstong “Sa tuwing” ang paulit-ulit na pamamaraan.
- source_word: וַיֹּאמֶר לֹא
  choice: Kapag sumagot siya, “Hindi,”
  rationale: Sa paulit-ulit na prosesong inilalarawan, may kondisyunal na diwa ang sugnay. Nililinaw ng “Kapag” ang ugnayan nito sa susunod na hakbang nang hindi binabago ang kahulugan.
