    rationale: Ang Hebreo ay literal na nagsasabing kinuha ng Gilead ang mga tawiran ng Jordan “laban sa Efraim.” Ipinahihiwatig ng konteksto ang pagpigil sa pagtakas, ngunit hindi ito kailangang gawing hayag na layunin sa mismong salin.
  - severity: low
