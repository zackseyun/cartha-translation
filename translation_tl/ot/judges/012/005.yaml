  source_fidelity: Ang “upang harangan ang Efraim” ay nagpapalit sa לְאֶפְרַיִם, na ‘laban sa Efraim,’ tungo sa isang hayag na layunin. Bagaman sinusuportahan ito ng konteksto, mas tapat na panatilihin ang mas maigsi at hindi labis na ipinaliliwanag na ugnayang laban sa Efraim. Ang “sinakop” ay maaari ring magpahiwatig ng pagsakop sa lupain; mas akma ang “kinuha” para sa pagkontrol sa mga tawiran.
  naturalness: Natural at malinaw ang natitirang salin. Ang paulit-ulit na sitwasyong ipinahihiwatig ng “Sa tuwing,” pati ang pang-isahang pangkalahatang halimbawa na “isang takas,” ay maayos sa modernong Filipino.
  terminology: Ang “mga tawiran,” “Ilog Jordan,” at “Efraimita” ay angkop. Nililinaw ng talababa na mga mabababaw na tawiran sa ilog ang tinutukoy.
  issues:
