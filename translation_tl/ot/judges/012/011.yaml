  yaml_path: translation/ot/judges/012/011.yaml
  text: After him, Elon the Zebulunite judged Israel ten years.
translation:
  language: tl
  text: Pagkatapos niya, si Elon, na mula sa lipi ni Zebulun, ay namuno bilang hukom sa Israel. Namuno siya bilang hukom sa Israel sa loob ng sampung taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: namuno ... bilang hukom
  rationale: Sa aklat ng Mga Hukom, ang pandiwa ay tumutukoy sa pagganap ng tungkulin ng isang hukom sa Israel. Iniiwasan ng saling ito ang di-likas at maaaring mapagkamalang mapanghatol na “hinatulan ang Israel,” habang pinananatili ang natatanging papel ng hukom at hindi ito nililimitahan sa pamamahalang militar o administratibo.
- source_word: אַחֲרָיו
  choice: Pagkatapos niya
  rationale: Pinananatili ang panghalip ng Hebreo at ang pagtukoy nito sa naunang hukom sa konteksto, nang hindi tahasang idinaragdag ang pangalang Ibzan.
- source_word: אֵילוֹן
  choice: Elon
  rationale: Karaniwang transliterasyon ng pangalang pantangi sa modernong Filipino.
- source_word: הַזְּבוּלֹנִי
  choice: mula sa lipi ni Zebulun
  rationale: Ipinahahayag nang natural sa Filipino ang gentiliko o pagkakaugnay ni Elon sa tribo ni Zebulun; mas malinaw ito sa ordinaryong mambabasa kaysa sa “Zebulunita.”
- source_word: עֶשֶׂר שָׁנִים
  choice: sa loob ng sampung taon
  rationale: Natural na Filipino para sa pahayag ng tagal.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: namuno sa Israel bilang hukom. Namuno siya sa Israel
  rationale: 'Pinananatili ang pag-uulit ng pandiwa sa Hebreo: unang ipinakikilala ang paglilingkod ni Elon, at pagkatapos ay inilalahad ang tagal nito. Ang dalawang pangungusap ay malinaw at natural sa Filipino.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng estrukturang Hebreo nang hindi gumagamit ng pariralang “hinatulan ang Israel,” na sa kasalukuyang Filipino ay madaling maunawaang pagpaparusa sa Israel.
