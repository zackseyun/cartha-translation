base_translation:
  language: en
  yaml_path: translation/ot/judges/012/007.yaml
  text: Jephthah judged Israel six years[a]. Then Jephthah the Gileadite died and was buried in the cities of Gilead.
translation:
  language: tl
  text: Naging hukom si Jefte sa Israel sa loob ng anim na taon. Pagkatapos, namatay si Jefte na taga-Gilead at inilibing sa mga bayan ng Gilead.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa mga bayan ng Gilead.” Maaaring idyomatikong tumukoy ang anyong maramihan sa isang hindi tinukoy na bayan sa rehiyong iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: naging hukom
  rationale: Sa aklat ng Mga Hukom, ang pandiwang שׁפט ay tumutukoy sa gawain ng isang hukom-tagapagligtas ng Israel. Pinananatili ng “naging hukom” ang mahalagang katawagan ng aklat nang hindi nililimitahan ang tungkulin sa pamumuno lamang o sa paghatol sa mga usapin.
- source_word: שֵׁשׁ שָׁנִים
  choice: anim na taon
  rationale: Tuwirang parirala ng tagal; natural at tapat na salin.
- source_word: הַגִּלְעָדִי
  choice: na taga-Gilead
  rationale: Ipinakikilala ng anyong gentilic si Jefte ayon sa kaniyang rehiyong pinagmulan. Mas natural sa makabagong Tagalog ang “taga-Gilead” kaysa sa isang hiniram na katawagang etniko.
- source_word: וַיִּקָּבֵר
  choice: inilibing
  rationale: Karaniwang katumbas sa Tagalog ng pasibong anyo sa Hebreo sa isang pahayag tungkol sa kamatayan at paglilibing.
- source_word: בְּעָרֵי גִלְעָד
  choice: sa mga lungsod ng Gilead
  rationale: Pinananatili sa pangunahing teksto ang tunay na anyong maramihan ng Hebreo. Dahil hindi pangkaraniwan ang paglilibing sa iisang tao sa maraming lungsod, inilalahad sa talababa ang posibleng idyomatikong diwa nang hindi ito ipinapalit sa teksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naging hukom” upang mapanatili ang paulit-ulit na katawagan sa aklat, at “taga-Gilead” bilang likas na paraan ng pagtukoy sa rehiyong pinagmulan. Inilipat ang talababa sa pariralang aktuwal nitong ipinapaliwanag.
