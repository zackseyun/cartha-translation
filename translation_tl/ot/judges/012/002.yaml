  to: Sinabi ni Jefte sa kanila[a], “Ako at ang aking bayan ay may matinding tunggalian sa mga Ammonita. Nanawagan ako sa inyo, ngunit hindi ninyo ako iniligtas mula sa kanilang kamay.”
  rationale: Pinalitan ang “labanan” ng “tunggalian” upang hindi gawing mas tiyak kaysa sa Hebreong אִישׁ רִיב, habang pinananatili ang tindi ng מְאֹד. Pinalitan ang “Humingi ako ng tulong” ng “Nanawagan ako” upang mas malapit na maipahayag ang זעק nang hindi nagdaragdag ng paliwanag. Napanatili ang footnote anchor at ang mas literal na alternatibo.
