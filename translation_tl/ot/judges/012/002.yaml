base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: tl
  text: Sinabi ni Jefte sa kanila[a], “Ako at ang aking bayan ay may matinding tunggalian sa mga Ammonita. Nanawagan ako sa inyo, ngunit hindi ninyo ako iniligtas mula sa kanilang kamay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Ako ay isang taong may matinding alitan—ako at ang aking bayan—sa mga Ammonita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ רִיב ... מְאֹד
  choice: nasa matinding labanan
  rationale: Ang literal na idyomang ‘isang taong may alitan’ ay predikatibong naglalarawan sa kalagayan ni Jefte at ng kanyang bayan, hindi lamang sa kanyang pagkatao. Pinagsama sa מְאֹד, ang ‘nasa matinding labanan’ ay natural sa Filipino at pinananatili ang tindi ng tunggalian.
- source_word: וְעַמִּי
  choice: kami ng aking bayan
  rationale: Ang עַם ay karaniwang ‘bayan’ o ‘mga tao.’ Ginamit ang ‘kami ng aking bayan’ upang likas na maipahayag sa Filipino ang ‘ako at ang aking bayan’ nang hindi ito pinakikitid sa hukbo o mga kamag-anak.
- source_word: וּבְנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Ito ang karaniwan at malinaw na katawagang Filipino sa etnikong בני עמון.
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: Humingi ako ng tulong sa inyo
  rationale: Sa konteksto, ang זעק ay pagdaing o pagtawag upang humingi ng saklolo. Nililinaw ng natural na pariralang Filipino ang layon ng kanyang pagtawag nang hindi nagdaragdag ng tiyak na paraang hindi sinabi sa teksto.
- source_word: וְלֹא הוֹשַׁעְתֶּם אֹתִי
  choice: hindi ninyo ako iniligtas
  rationale: Tuwirang ipinapahayag ng ‘iniligtas’ ang Hiphil ng ישׁע at ang militar na pagliligtas sa konteksto, nang hindi ito labis na ginagawang teknikal na teolohikal na termino.
- source_word: מִיָּדָם
  choice: mula sa kanilang kamay
  rationale: Pinananatili nito ang Hebreong larawan ng ‘kamay’ bilang kapangyarihan o kontrol; malinaw rin ang idyoma sa marangal na wikang biblikal na Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Jefte’ at ‘mga Ammonita’ bilang natural na mga anyong Filipino. Ang di-karaniwang Hebreong kayarian sa אִישׁ רִיב ay isinalin nang idyomatiko sa pangunahing teksto at pinanatili sa mas literal na anyo sa talababa.
