  yaml_path: translation/ot/judges/012/013.yaml
  text: After him, Abdon son of Hillel the Pirathonite judged Israel.
translation:
  language: tl
  text: Pagkatapos niya, si Abdon na anak ni Hillel na taga-Piraton ang humatol sa Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: humatol
  rationale: Pinananatili nito ang paulit-ulit na terminolohiya ng aklat para sa gawain ng mga hukom, habang hindi nililimitahan ang mas malawak na diwa ng pamamahala o pamumuno.
- source_word: אַחֲרָיו
  choice: Pagkatapos niya
  rationale: Tuwirang ipinahihiwatig ng parirala ang paghalili kay Elon, ang naunang hukom.
- source_word: אֶת יִשְׂרָאֵל
  choice: sa Israel
  rationale: Ginagamit ang pang-ukol na “sa” upang likas na ipahayag sa Tagalog ang Israel bilang bayan na hinatulan o pinamahalaan niya.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalan.
- source_word: בֶּן הִלֵּל
  choice: anak ni Hillel
  rationale: Likas at tuwirang pagpapahayag sa Tagalog ng ugnayang ama at anak.
- source_word: הַפִּרְעָתוֹנִי
  choice: taga-Piraton
  rationale: Malinaw at natural na inilalarawan sa modernong Tagalog ang isang taong nagmula sa Piraton.
