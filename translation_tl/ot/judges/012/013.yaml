  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang “humatol” upang mapanatili ang mahalagang terminolohiya ng aklat, at ang “taga-Piraton” bilang mas likas kaysa sa isang hiniram na katawagang gentiliko.
