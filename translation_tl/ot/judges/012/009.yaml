base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: tl
  text: Mayroon siyang tatlumpung anak na lalaki, at ipinadala niya sa labas ang tatlumpung anak na babae. Nagdala siya mula sa labas ng tatlumpung anak na babae para sa kanyang mga anak na lalaki.[a] Naglingkod siya bilang hukom ng Israel sa loob ng pitong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “ipinadala niya sa labas ang tatlumpung anak na babae, at nagdala siya mula sa labas ng tatlumpung anak na babae para sa kanyang mga anak na lalaki.” Malamang na tumutukoy ito sa pagpapakasal ng kanyang mga anak na babae sa labas ng sambahayan at pagkuha ng mga babae mula sa labas para sa kanyang mga anak na lalaki, ngunit literal na “mga anak na babae” ang gamit ng Hebreo sa dalawang sugnay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Mayroon siyang
  rationale: Ang idyomang היה + ל ay nagpapahayag ng pag-aari; natural sa modernong Tagalog ang “Mayroon siyang.”
- source_word: שְׁלֹשִׁים בָּנִים
  choice: tatlumpung anak na lalaki
  rationale: Tuwirang salin ng bilang at tahasang panlalaking katawagan.
- source_word: וּשְׁלֹשִׁים בָּנוֹת שִׁלַּח הַחוּצָה
  choice: tatlumpung anak na babae. Ang kanyang mga anak na babae ay ipinag-asawa niya sa mga taga-labas
  rationale: Bagaman literal na “ipinadala niya sa labas,” malinaw sa katapat na sugnay na pag-aasawa ang konteksto. Ang “sa mga taga-labas” ay nagpapanatili sa ideya ng paglabas sa sariling pangkat nang hindi nagpapalagay ng tiyak na heograpiya.
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: kumuha siya mula sa labas ng tatlumpung babae upang mapangasawa ng kanyang mga anak na lalaki
  rationale: Literal na inuulit ng Hebreo ang “mga anak na babae,” ngunit dito ay tumutukoy ito sa mga babaeng kinuha bilang asawa ng kanyang mga anak. Ginawang malinaw sa natural na Tagalog ang ipinahihiwatig na ugnayang pag-aasawa.
- source_word: מִן הַחוּץ
  choice: mula sa labas
  rationale: Malapit sa literal na “mula sa labas” at hindi pinalalawak tungo sa “mula sa ibang bansa.”
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Hinatulan niya ang Israel
  rationale: Pinananatili ang paulit-ulit na terminolohiya ng aklat para sa tungkulin ng isang hukom; ang konteksto ay mas malawak kaysa paghatol lamang sa mga kaso.
- source_word: שֶׁבַע שָׁנִים
  choice: sa loob ng pitong taon
  rationale: Natural na ekspresyong temporal sa Tagalog.
theological_decisions:
- issue: Kung tahasang ilalahad ang pag-aasawa sa dalawang sugnay
  choice: Inilahad sa pangunahing teksto na ipinag-asawa ang mga anak na babae at kinuha ang mga babae bilang asawa ng mga anak na lalaki.
  alternative: Literal na “ipinadala niya sa labas” at “nagdala siya ng tatlumpung anak na babae mula sa labas para sa kanyang mga anak na lalaki.”
  rationale: Ang magkatugmang mga sugnay at sinaunang kontekstong pampamilya ay matibay na nagpapahiwatig ng mga kasunduang pag-aasawa. Gayunman, itinala sa talababa ang literal na anyo upang hindi maitago ang paraan ng pagpapahayag ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “anak na lalaki/babae” sa halip na mas kolokyal na “lalaking/babaeng anak.” Ang “Hinatulan” ay sadyang nagpapanatili sa bokabularyo ng aklat ng Mga Hukom, samantalang ipinaliliwanag ng konteksto ang mas malawak na pamumuno ng hukom.
