  to: Nang makita kong hindi mo kami sinasagip, inilagay ko ang buhay ko sa aking palad[a] at tumawid ako upang lumaban sa mga Ammonita. Ibinigay sila ni Yahweh sa aking kamay. Kaya bakit kayo lumusob laban sa akin ngayon upang makipaglaban sa akin?
  rationale: Pinalitan lamang ang hindi likas na “umaahon laban sa akin” ng “lumusob laban sa akin.” Pinananatili nito ang puwersang militar ng Hebreo, ang maramihang kausap, at ang retorikal na tanong, habang mas natural sa makabagong Filipino.
