source:
  edition: WLC
  text: וָֽ/אֶרְאֶ֞ה כִּֽי אֵינְ/ךָ֣ מוֹשִׁ֗יע וָ/אָשִׂ֨ימָ/ה נַפְשִׁ֤/י בְ/כַפִּ/י֙ וָֽ/אֶעְבְּרָ/ה֙ אֶל בְּנֵ֣י עַמּ֔וֹן וַ/יִּתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדִ֑/י וְ/לָ/מָ֞ה עֲלִיתֶ֥ם אֵלַ֛/י הַ/יּ֥וֹם הַ/זֶּ֖ה לְ/הִלָּ֥חֶם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: tl
  text: Nang makita kong hindi mo kami sinasagip, inilagay ko ang buhay ko sa aking palad[a] at tumawid ako upang lumaban sa mga Ammonita. Ibinigay sila ni Yahweh sa aking kamay. Kaya bakit kayo lumusob laban sa akin ngayon upang makipaglaban sa akin?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “inilagay ko ang buhay ko sa aking palad,” isang idyomang nangangahulugang “isinapanganib ko ang buhay ko.”
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶרְאֶה כִּי אֵינְךָ מוֹשִׁיעַ
  choice: Nang makita kong hindi mo kami sinasagip
  rationale: Pinananatili ang temporal at sanhi-bungang daloy ng pangungusap, pati ang isahang kausap sa אֵינְךָ. Ang “kami” ay likas na ipinahihiwatig na layon ng pagliligtas sa konteksto.
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: inilagay ko ang buhay ko sa aking palad
  rationale: Pinananatili ang matingkad na larawang Hebreo; ipinaliliwanag sa talababa na idyoma ito ng pagsasapanganib ng buhay.
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: at tumawid ako upang lumaban sa mga Ammonita
  rationale: Ang עבר na may אֶל sa salaysay ng digmaan ay tumutukoy sa pagtawid o pagsulong patungo sa kalaban. Nililinaw ng “upang lumaban” ang pagalit na konteksto nang hindi dinaragdagan ang antas ng puwersa.
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Ito ang natural at kinikilalang katawagan sa Filipino para sa bayang tinutukoy ng Hebreong parirala.
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: Ibinigay sila ni Yahweh sa aking kamay
  rationale: Pinananatili ang karaniwang pormula ng tagumpay at ang larawang “sa aking kamay,” na nangangahulugang ipinasailalim sa kapangyarihan ng nagsasalita.
- source_word: וְלָמָה עֲלִיתֶם אֵלַי הַיּוֹם הַזֶּה
  choice: Kaya bakit kayo umahon laban sa akin ngayon
  rationale: Ang maramihang עֲלִיתֶם ay isinaling “kayo,” kaya napapanatili ang paglipat mula sa isahang kausap tungo sa maramihan. Sa kontekstong militar, ang “umahon laban” ay nagpapahayag ng paglusob.
- source_word: לְהִלָּחֶם בִּי
  choice: upang makipaglaban sa akin
  rationale: Tuwirang ipinapahayag ang layunin ng pag-ahon at pinananatili ang pag-uulit ng “laban sa akin” sa Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng talata ang Tetragrammaton mismo. Ang “Yahweh” ay tuwirang transliterasyon na nagpapanatili sa personal na pangalang tipan nang hindi nag-aangkat ng partikular na denominasyonal na pagpapakahulugan.
- issue: Pagpapahayag na ibinigay ni Yahweh ang mga Ammonita sa kamay ni Jefte
  choice: Ibinigay sila ni Yahweh sa aking kamay
  alternative: Pinagtagumpay ako ni Yahweh laban sa kanila
  rationale: Pinananatili ang kongkretong pormula ng tekstong Hebreo at hindi pinalalawak ang pahayag lampas sa sinasabi nito.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pagbabago mula sa isahang “mo” tungo sa maramihang “kayo” sapagkat gayon ang Hebreo, gayundin ang mga larawang “buhay sa palad” at “sa aking kamay.”
