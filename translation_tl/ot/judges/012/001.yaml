translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga Efraimita’ at ‘mga Ammonita’ bilang natural na katawagan sa mga pangkat; pinanatili ang marahas at tuwirang himig ng banta nang hindi nagdaragdag ng denominasyonal o teolohikal na interpretasyon.
