base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: tl
  text: Pagkatapos, ipinatawag ang mga Efraimita[a], at tumawid sila patungong Zafon.[b] Sinabi nila kay Jefte, “Bakit ka tumawid upang makipaglaban sa mga Ammonita nang hindi mo kami tinawag upang sumama sa iyo? Susunugin namin sa apoy ang bahay mo sa ibabaw mo!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “lalaki ng Efraim,” ngunit kolektibo ang diwa nito, gaya ng ipinakikita ng kasunod na pandiwang maramihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “pahilaga” kung ang צָפוֹנָה ay inuunawang pang-abay na nagsasaad ng direksiyon sa halip na pangalang Zafon.
    reason: alternative_reading
  - marker: c
    text: Sa Hebreo, literal na “Susunugin namin sa apoy ang bahay mo sa ibabaw mo.” Malamang na ipinahihiwatig ng banta na susunugin nila ang bahay habang nasa loob o nasa ilalim nito si Jefte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: nagtipon ang mga Efraimita
  rationale: Bagaman anyong isahan ang אִישׁ, ipinakikita ng kasunod na pandiwang maramihan na kolektibo ang tinutukoy. Sa konteksto, ang צעק ay tumutukoy sa pagtitipon o pagpapatawag ng pangkat para sa pagkilos.
- source_word: וַיַּעֲבֹר
  choice: tumawid
  rationale: Pinananatili ang diwa ng עבר at natural na iniuugnay sa kolektibong paksa, kahit isahan ang anyong Hebreo.
- source_word: צָפוֹנָה
  choice: patungong Zafon
  rationale: Itinuturing itong pangalan ng lugar, na ang hulaping -ָה ay nagsasaad ng direksiyon patungo roon. Gayunman, posible rin ang pagbasa na pang-abay na ‘pahilaga.’
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: upang makipaglaban sa mga Ammonita
  rationale: Natural na salin sa modernong Filipino ng pakikipagdigma laban sa ‘mga anak ni Ammon.’
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: nang hindi mo kami tinawag na sumama sa iyo
  rationale: Ang קרא ay pagpapatawag upang makibahagi sa labanan; malinaw at natural dito ang ‘tinawag na sumama.’
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: Susunugin namin ang bahay mo habang nasa loob ka!
  rationale: Ipinahahayag nito sa natural na Filipino ang malinaw na banta na susunugin ang bahay habang naroon si Jefte. Iniiwasan ang di-natural na literal na ‘sa ibabaw mo sa apoy.’
