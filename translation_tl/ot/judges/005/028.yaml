- from: 'Sa may bintana ay dumungaw ang ina ni Sisera at nanaghoy sa likod ng sala-sala: “Bakit napakatagal dumating ng kanyang karwahe? Bakit nahuhuli ang mga yabag ng kanyang mga karwahe?”[a][b]'
  to: 'Sa pamamagitan ng bintana ay dumungaw ang ina ni Sisera at nanaghoy sa pamamagitan ng sala-sala: “Bakit napakatagal dumating ng kanyang karwahe? Bakit nagtatagal ang mga yabag ng kanyang mga karwahe?”[a][b]'
