translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “karwahe” bilang madaling maunawaang tawag sa sasakyang pandigma sa konteksto. Ang bahagyang matalinghagang “mga yabag ng mga karwahe” ay sadyang pinanatili upang huwag lutasin ang kalabuan ng Hebreo.
