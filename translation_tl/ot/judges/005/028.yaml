base_translation:
  language: en
  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: tl
  text: 'Sa pamamagitan ng bintana ay dumungaw ang ina ni Sisera at nanaghoy sa pamamagitan ng sala-sala: “Bakit napakatagal dumating ng kanyang karwahe? Bakit nagtatagal ang mga yabag ng kanyang mga karwahe?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “humiyaw” para sa bihirang pandiwang isinaling “nanaghoy.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga hakbang” o “mga yabag ng kanyang mga karwahe”; maaaring tumukoy sa tunog ng pagdating ng mga karwahe, ngunit hindi tahasang binabanggit sa Hebreo ang mga paa ng kabayo o mga gulong.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: Sa may bintana
  rationale: Ipinahihiwatig ng בְּעַד ang pagtingin sa pamamagitan ng o mula sa likod ng isang bukasan. Likas sa Filipino ang “sa may bintana” at iniiwasang gawing mekanikal ang parirala.
- source_word: נִשְׁקְפָה
  choice: dumungaw
  rationale: Ang pandiwa ay tumutukoy sa pagtingin palabas, karaniwan mula sa bintana o mataas na lugar. Eksaktong likas dito ang “dumungaw.”
- source_word: וַתְּיַבֵּב
  choice: nanaghoy
  rationale: Bihira ang pandiwang Hebreo at malamang na tumutukoy sa malakas at balisang pagdaing. Pinananatili ng “nanaghoy” ang emosyon nang hindi tinutukoy nang labis ang eksaktong uri ng tinig.
- source_word: אֵם סִיסְרָא
  choice: ang ina ni Sisera
  rationale: Natural na anyo sa Filipino para sa ugnayang construct sa Hebreo.
- source_word: בְּעַד הָאֶשְׁנָב
  choice: sa likod ng sala-sala
  rationale: Ang אֶשְׁנָב ay isang bukasang may sala-sala. Ipinakikita ng parirala na mula sa likod nito nanggagaling ang pagtanaw at paghiyaw.
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: napakatagal dumating ng kanyang karwahe
  rationale: Ipinahahayag ng בֹּשֵׁשׁ ang pagkaantala o labis na tagal. Ang ayos na ito ay natural na balisang tanong sa Filipino.
- source_word: פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: mga yabag ng kanyang mga karwahe
  rationale: Ang פַּעֲמֵי ay literal na “mga hakbang/yabag.” Pinananatili ng “mga yabag” ang matalinghagang larawan at tunay na kalabuan sa halip na tahasang gawing mga yabag ng kabayo o mga gulong.
