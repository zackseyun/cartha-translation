  source_fidelity: Tumpak na naipapasa ng salin ang pag-uulit ng יְרַד sa “bumaba,” ang kolektibong diwa ng שָׂרִיד sa “ang nalabi,” ang unang-panauhang לִי sa “para sa akin,” at ang banal na pangalan na יְהוָה bilang “Yahweh.” Ang salungatang pagbasa ng mga pang-ukol (“laban sa”) ay isang maaaring pagbasa sa kontekstong pandigma at maayos na nilalagyan ng talababa ang hindi tiyak na sintaks.
  naturalness: Likas at malinaw ang makabagong Filipino, habang napapanatili ang maikli at paralelong anyo ng tulang Hebreo. Ang “Nang magkagayon” ay bahagyang marangal ngunit angkop sa awit ng Hukom 5.
