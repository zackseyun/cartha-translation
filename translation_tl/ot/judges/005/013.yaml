id: JDG.5.13
reference: Judges 5:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: tl
  text: Nang magkagayon, bumaba ang nalabi laban sa mga maharlika[a]; bumaba para sa akin[b] ang bayan ni Yahweh laban sa mga mandirigma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “bumaba ang isang nakaligtas patungo sa mga maharlika.” Mahirap unawain ang Hebreo ng makatang taludtod na ito, at ang mga pang-ukol ay maaari ring mangahulugang “patungo sa,” “para sa,” o “kasama ng,” sa halip na “laban sa.”'
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “para sa akin”; malamang na makatang pagtukoy ito ni Debora sa sarili niya.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: Nang magkagayon
  rationale: Maikli at likas na panandang pamanahon na angkop sa marangal na himig ng awit.
- source_word: יְרַד / יְרַד
  choice: bumaba / bumaba
  rationale: Pinananatili ang literal na kilos at ang makatang pag-uulit ng pandiwa sa dalawang hati ng taludtod.
- source_word: שָׂרִיד
  choice: ang nalabi
  rationale: Pinananatili ang anyong isahan at ang maaaring kolektibong diwa ng isang pangkat na natira o nakaligtas.
- source_word: לְאַדִּירִים
  choice: laban sa mga maharlika
  rationale: Ipinapahayag ang malamang na salungatang diwa ng pang-ukol sa konteksto ng labanan; ang “maharlika” ay nagpapahiwatig ng mga taong dakila o makapangyarihan at inihihiwalay ang termino sa גִּבּוֹרִים.
- source_word: עָם יְהוָה
  choice: ang bayan ni Yahweh
  rationale: Natural sa modernong Filipino at malinaw na nagpapahayag na ang bayan ay nabibilang kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לִי
  choice: para sa akin
  rationale: Tuwirang salin na nagpapanatili sa unang panauhang tinig ng makata, na malamang ay tumutukoy kay Debora.
- source_word: בַּגִּבּוֹרִים
  choice: laban sa mga mandirigma
  rationale: Ang גִּבּוֹרִים ay maaaring tumukoy sa malalakas na tao o mga mandirigma; sa kontekstong pandigma, natural ang “mga mandirigma,” habang ang “laban sa” ay kumakatawan sa malamang na salungatang diwa ng pang-ukol.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Diwa ng mga pang-ukol sa dalawang hati ng taludtod
  choice: 'salungatan: “laban sa”'
  alternative: patungo, para sa, kasama, o kabilang sa
  rationale: Pinapaboran ng konteksto ng awit ng tagumpay at ng paralelismo ang diwang salungatan, ngunit hindi lubos na tiyak ang mahirap na sintaks ng makatang Hebreo; kaya inilalahad sa talababa ang ibang pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit, na may bahagyang makatang ayos upang mapanatili ang paralelismo at pag-uulit ng orihinal. Sadyang hindi nilutas nang tahimik ang mahirap at malabong sintaks; nakatala sa talababa ang mahahalagang alternatibong pagbasa.
