lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: Mula sa langit
  rationale: Likas at tuwirang katumbas sa modernong Tagalog; hindi kailangang gawing pormal na maramihan ang Hebreong שָׁמַיִם.
- source_word: נִלְחָמוּ / נִלְחֲמוּ
  choice: nakipaglaban
  rationale: Tumpak na naghahayag ng pakikibaka at pinananatili ang makatang pag-uulit ng pandiwa.
- source_word: הַכּוֹכָבִים
  choice: ang mga bituin
  rationale: Tuwirang kahulugan ng salita at pinananatili ang matayog na larawang makata nang hindi ipinapaliwanag ang mekanismo ng kanilang pakikibaka.
- source_word: מִמְּסִלּוֹתָם
  choice: mula sa kanilang mga landas
  rationale: Ang מְסִלּוֹת ay maaaring tumukoy sa mga daan o landas; sa konteksto ng mga bituin, ipinahihiwatig nito ang kanilang mga itinakdang landas sa langit nang hindi gumagamit ng mas modernong konseptong 'orbit.'
- source_word: עִם סִיסְרָא
  choice: kay Sisera
  rationale: Sa Tagalog, ang 'nakipaglaban kay Sisera' ay karaniwang nangangahulugang nakipaglaban laban sa kaniya, habang nananatiling malapit sa literal na Hebreong עִם, 'kasama/kay.'
theological_decisions:
- issue: Uri ng pakikibahagi ng mga bituin sa labanan
  choice: Panatilihin ang makatang pahayag na nakipaglaban ang mga bituin mula sa langit.
  alternative: Ipaliwanag ito bilang literal na pagkilos ng kalawakan, mga anghel o hukbo ng langit, o talinghaga para sa mga puwersa ng kalikasan sa ilalim ng pagkasi ng Diyos.
  rationale: Hindi tinutukoy ng Awit ni Debora kung paano nakipaglaban ang mga bituin. Ang diwa ay pinananatiling bukas upang hindi ipasok sa salin ang isang makitid na interpretasyon.
translation_notes:
  register: Makata, marangal, at madaling maunawaan sa modernong Filipino. Pinanatili ang magkatulad na ayos at pag-uulit ng dalawang hati ng taludtod. Ginamit ang “nakipaglaban kay Sisera” bilang natural na Tagalog; nilinaw sa talababa ang literal na anyo ng Hebreo.
