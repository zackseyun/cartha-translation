  - severity: low
    issue: Hindi ganap na natural ang “gayundin ang Isacar kay Barak.”
    rationale: Bagaman matapat ito sa elipsis ng Hebreo, ang pagdaragdag ng “ay kasama ni” ay nananatiling maikli at makata ngunit mas malinaw sa Filipino.
  - severity: low
