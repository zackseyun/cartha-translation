base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: tl
  text: At ang mga pinuno ng Isacar ay kasama ni Debora[a]; gayundin, ang Isacar ay kasama ni Barak. Isinugo sila sa lambak, kasunod sa kanyang mga yapak[b]. Sa mga pangkat ni Ruben ay may malalalim na pagninilay ng puso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga prinsipe ng Isacar” o “mga pinunong Isacarita.” Makata ang pahayag sa Hebreo at maaaring idiomatiko, sa halip na mahigpit na literal na pagmamay-ari.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa kanyang mga paa,” ibig sabihin, malapit na sumusunod sa kanya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mahahalagang kapasiyahan ng puso” o “masinsing pagninilay ng kalooban.” Mahirap ang pariralang Hebreo; sa konteksto, malamang na itinatampok nito ang panloob na pag-aalinlangan ng Ruben sa halip na pagkilos.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי
  choice: mga pinuno ng
  rationale: Ang anyo ay makatang pahayag na pinakamainam unawain bilang mga pinuno o mga nakatataas ng Isacar, hindi bilang literal na “aking mga pinuno.” Natural at marangal sa modernong Filipino ang “mga pinuno.”
- source_word: עִם
  choice: kasama ni
  rationale: Tuwirang ipinapahayag ang pakikiisa at pagpanig ng mga pinuno kay Debora.
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: gayundin ang Isacar kay Barak
  rationale: Pinananatili ang elipsis at paralelismo ng tulang Hebreo habang malinaw na ipinahihiwatig na kasama rin ni Barak ang Isacar.
- source_word: בָּעֵמֶק
  choice: sa lambak
  rationale: Sa konteksto ng pagkakasugo at paglusob, ang “sa lambak” ay natural na Filipino at maaaring magpahiwatig ng patungong pagtalima nang hindi labis na nililinaw ang direksiyon.
- source_word: שֻׁלַּח
  choice: isinugo sila
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo ang Isacar bilang tribo o hukbo; kaya plural ang diwa sa Filipino.
- source_word: בְּרַגְלָיו
  choice: kasunod sa kanyang mga yapak
  rationale: Ipinapahayag nito ang literal na larawang “sa kanyang mga paa” at ang idyomatikong diwang malapit na pagsunod kay Barak.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: sa mga pangkat ng Ruben
  rationale: Maaaring tumukoy ang פְּלַגּוֹת sa mga bahagi, pangkat, o pagkakahati sa loob ng tribo. Mas natural ang “mga pangkat” sa Filipino, habang inilalagay sa talababa ang alternatibong “mga pagkakahati.”
- source_word: גְּדֹלִים
  choice: matinding
  rationale: Ginagawang natural sa Filipino ang pagpapalakas ng pangngalang kasunod; ang “matinding” ay angkop sa panloob na pagtatalo o pagsusuri.
- source_word: חִקְקֵי לֵב
  choice: pagsisiyasat ng puso
  rationale: Mahirap at makata ang parirala. Pinananatili ng salin ang larawang panloob at hindi tiyak kung ito ay masusing pag-iisip, pagpapasya, o pag-aatubili.
