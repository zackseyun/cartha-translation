  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: tl
  text: 'Mula sa ingay ng mga mamamana sa may mga lugar ng pag-iigib,[a]

    doon nila isinasalaysay ang matuwid na mga gawa ni Yahweh,

    ang matuwid na mga gawa ng kanyang mga taganayon sa Israel.[b]

    Noon ay bumaba sa mga tarangkahan ng bayan[c] ang bayan ni Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sa ingay ng mga mamamana sa pagitan ng mga lugar ng pag-iigib.” Mahirap ang pambungad na parirala; maaaring inilalarawan nito kung saan naririnig ang awit sa halip na sabihing nagmumula ito sa ingay.'
    reason: alternative_reading
  - marker: b
    text: Mahirap ang salitang Hebreo na isinaling “mga taganayon.” Maaari rin itong tumukoy sa buhay-nayon, mga pamayanang walang pader, o mga taong naninirahan sa mga ito. Posible ring unawain ang parirala bilang “ang matuwid na mga gawa para sa kanyang mga taganayon”; mas di-malamang ang saling “mga pinuno.”
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: Ang mga tarangkahan ng bayan ang karaniwang lugar ng pagtitipon ng pamayanan, paghatol, pamamahala, at pagbabantay sa seguridad.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: Mula sa ingay ng mga mamamana
  rationale: Pinananatili ng “mula sa” ang karaniwang pansimula o pinagmumulang diwa ng מִן, samantalang ang מְחַצְצִים ay inuunawa ayon sa konteksto bilang mga mamamana. Dahil mahirap ang parirala, inilalahad sa talababa ang isa pang posibleng ugnayan ng ingay at ng salukan ng tubig.
- source_word: בֵּין מַשְׁאַבִּים
  choice: sa mga lugar na salukan ng tubig
  rationale: Ang מַשְׁאַבִּים ay mga lugar kung saan sumasalok ng tubig, gaya ng mga balon o inuman. Mas natural sa Filipino ang “sa mga lugar” kaysa sa literal na “sa pagitan,” ngunit hindi nito nililinaw nang higit sa pinagmulan ang tiyak na ayos ng tagpo.
- source_word: יְתַנּוּ
  choice: isinasalaysay nila
  rationale: Ipinahihiwatig ng pandiwa rito ang pagbigkas o muling pagsasalaysay nang malakas. Hindi tahasang ginawang “inaawit” upang hindi ipasok ang paraang musikal na posible ngunit hindi tiyak.
- source_word: צִדְקוֹת יְהוָה
  choice: ang matuwid na mga gawa ni Yahweh
  rationale: Tumutukoy ang צִדְקוֹת sa kongkretong mga gawang nagpapakita ng pagiging matuwid at makatarungan ni Yahweh. Pinananatili ng salin ang saklaw nito sa halip na paliitin sa “mga pagliligtas” o “mga tagumpay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng titulong “Panginoon.”
- source_word: צִדְקֹת פִּרְזֹנוֹ
  choice: ang matuwid na mga gawa ng kanyang mga taganayon
  rationale: Ang kaugnay na salita sa Hukom 5:7 ay tumutukoy sa buhay-nayon o mga taong naninirahan sa mga nayong walang pader. Ang “kanyang mga taganayon” ay maikli at likas sa Filipino, habang kinikilala sa talababa na mahirap at pinagtatalunan ang salita at ang relasyon ng parirala.
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: Pagkatapos, bumaba sa mga pintuang-bayan
  rationale: Ang אָז ay naghuhudyat ng sumunod na pangyayari, at pinananatili ng “bumaba” ang karaniwang kahulugan ng ירד. Nililinaw ng “pintuang-bayan” na mga tarangkahan ng pamayanan ang tinutukoy, hindi karaniwang pinto lamang.
- source_word: עַם יְהוָה
  choice: ang bayan ni Yahweh
  rationale: Ang “bayan ni Yahweh” ay natural na salin ng pariralang tipan na tumutukoy sa mga taong kinikilala bilang kanya.
theological_decisions:
- issue: Paglalarawan sa צִדְקוֹת sa awit ng tagumpay
  choice: matuwid na mga gawa
  alternative: mga gawa ng pagliligtas; mga tagumpay
  rationale: Ang konteksto ay may kinalaman sa pagliligtas at tagumpay, ngunit mas malawak ang salitang Hebreo. Pinananatili ng “matuwid na mga gawa” ang ugnayan sa katuwiran at hinahayaang ang konteksto ang magpahiwatig ng pagliligtas.
- issue: Kahulugan at kaugnayan ng צִדְקֹת פִּרְזֹנוֹ
  choice: ang matuwid na mga gawa ng kanyang mga taganayon
  alternative: ang matuwid na mga gawa para sa kanyang mga taganayon; ang matuwid na mga gawa sa kanyang mga pamayanang walang pader; ang matuwid na mga gawa ng kanyang mga pinuno
  rationale: Hindi tiyak ang פִּרְזוֹן at maaaring tumukoy sa mga taganayon, buhay-nayon, o mga pamayanang walang pader. Hindi pinipili sa pangunahing teksto ang mas malayong pagbasa na “mga pinuno,” at inilalantad sa talababa ang tunay na leksikal at sintaktikong hirap.
- issue: Paggamit sa pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon na hindi pinapalitan ang pangalan ng isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “salukan ng tubig,” “taganayon,” at “pintuang-bayan” ay madaling maunawaan habang inilalapit ang mambabasa sa sinaunang tagpo. Pinanatili ang mga linyang patula at ang pag-uulit ng “matuwid na mga gawa” upang maipakita ang paralelismo ng Hebreo.
