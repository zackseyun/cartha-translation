  text: 'Her wisest princesses answer her; indeed, she herself repeats her words to herself:'
translation:
  language: tl
  text: 'Ang pinakamapapantas sa kanyang mga babaeng maharlika ay sumasagot sa kanya; oo, inuulit niya sa sarili ang sarili niyang mga salita:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: ang pinakamayayaman sa karunungan sa kanyang mga prinsesa
  rationale: 'Ang חַכְמוֹת ay pambabaeng maramihan at maaaring unawaing superlatibo sa construct phrase: ang pinakamarurunong sa mga babaeng maharlika niya. Ginawang natural ngunit dignified sa Filipino.'
- source_word: תַּעֲנֶינָּה
  choice: Sumasagot sa kanya
  rationale: Pambabaeng maramihang pandiwa na tumutukoy sa mga prinsesa at may layong panghalip na 'sa kanya.'
- source_word: אַף הִיא
  choice: oo, ... din niya
  rationale: Pinananatili ang nagpapalakas at nagdaragdag na diwa ng אַף, habang malinaw na ang ina ni Sisera mismo ang kasunod na paksa.
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: inuulit ... sa kanyang sarili ang kanyang mga sinabi
  rationale: Bagaman literal na maaaring 'sinasagot niya ang kanyang mga salita sa kanyang sarili,' ipinahihiwatig ng idiom sa konteksto na inuulit o binibigkas niyang muli sa sarili ang nakaaaliw na sagot; pinananatili ang reflexive na לָהּ.
theological_decisions:
- issue: Kung ang ina ni Sisera ay sumasagot lamang sa sarili o inuulit sa sarili ang mga sinabi
  choice: inuulit niya sa kanyang sarili ang kanyang mga sinabi
  alternative: sinasagot niya sa sarili ang sarili niyang mga salita
  rationale: Ang pagpili ay sumusunod sa diskursong patula at sa reflexive na parirala, nang hindi nagdaragdag ng teolohikal na interpretasyon.
translation_notes:
  register: Makabagong Filipino na patula at marangal. Ang 'mga prinsesa' ay pinanatili para sa mga babaeng maharlika o mataas ang katayuan; iniwasan ang sobrang teknikal o makalumang pananalita.
