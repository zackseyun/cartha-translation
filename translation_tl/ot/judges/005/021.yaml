id: JDG.5.21
reference: Judges 5:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: נַ֤חַל קִישׁוֹן֙ גְּרָפָ֔/ם נַ֥חַל קְדוּמִ֖ים נַ֣חַל קִישׁ֑וֹן תִּדְרְכִ֥י נַפְשִׁ֖/י עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: tl
  text: 'Tinangay sila ng rumaragasang Ilog Kishon—

    ang sinaunang ilog[a], ang Ilog Kishon.

    Sumulong ka, kaluluwa ko[b], nang buong lakas!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ilog mula pa noong una” o “napakatandang ilog.” Ang Hebreong קְדוּמִים ay maaaring tumukoy sa sinaunang panahon; maaari rin itong marinig bilang pinatinding makatang paglalarawan, hindi lamang bilang pagtukoy sa edad ng ilog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Humakbang ka, kaluluwa ko, nang buong lakas” o “Tumapak ka, kaluluwa ko, nang buong puwersa.” Maikli at makata ang Hebreo, at ang pandiwa ay maaaring magpahiwatig ng pagyapak o pagtapak nang mariin, gayundin ng pagsulong.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: rumaragasang ilog
  rationale: Maaaring tumukoy ang נַחַל sa batis, ilog, o daluyang biglang rumaragasa kapag bumaha. Sa tagpong ito ng labanan, malinaw na malakas na agos ang tumangay sa mga kaaway; kaya likas sa Filipino ang “rumaragasang ilog” at naipapahayag nito ang puwersa ng tubig.
- source_word: קִישׁוֹן
  choice: Kishon
  rationale: Pangalan ito ng daluyan ng tubig, kaya tinumbasan sa karaniwang transliterasyong “Kishon.”
- source_word: גְּרָפָם
  choice: tinangay sila
  rationale: Ang pandiwang גרף ay nangangahulugang tangayin o anurin. Ipinahahayag ng “tinangay sila” ang marahas na pagkilos ng rumaragasang tubig at malinaw na pinananatili ang pangmaramihang layon.
- source_word: נַחַל קְדוּמִים
  choice: ang sinaunang ilog
  rationale: Ang קְדוּמִים ay maaaring magpahiwatig ng sinaunang panahon o mga panahong nagdaan. Ang “sinaunang ilog” ay marangal at maikli, at hindi nito dinaragdagan ang taludtod ng tiyak na mitolohikong kahulugan.
- source_word: תִּדְרְכִי
  choice: Sumulong ka
  rationale: Ang דרך ay maaaring mangahulugang humakbang, yumapak, o tumapak nang mariin. Sa matagumpay na himig ng awit, likas na naihahatid ng “Sumulong ka” ang masiglang paghimok sa sarili, habang inilalahad sa talababa ang mas literal na mga posibilidad.
- source_word: נַפְשִׁי
  choice: kaluluwa ko
  rationale: Sa tuwirang pakikipag-usap ng makata sa sarili, pinananatili ng “kaluluwa ko” ang tayutay at matinding damdamin ng נַפְשִׁי sa halip na payaking “ako.”
- source_word: עֹז
  choice: nang buong lakas
  rationale: Ang עֹז ay lakas o kapangyarihan. Ang “nang buong lakas” ay malinaw na pang-abay sa Filipino at angkop sa masiglang paghimok ng pangwakas na linya.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Pinanatili ang pag-uulit sa “Ilog Kishon” at ang tuwirang pakikipag-usap sa “kaluluwa ko.” Ginamit ang “rumaragasang” upang maipakita ang lakas ng נַחַל sa konteksto, yamang ang payak na “batis” ay maaaring magbigay ng napakahinang larawan sa karaniwang Filipino.
