  text: בָּ֤אוּ מְלָכִים֙ נִלְחָ֔מוּ אָ֤ז נִלְחֲמוּ֙ מַלְכֵ֣י כְנַ֔עַן בְּ/תַעְנַ֖ךְ עַל מֵ֣י מְגִדּ֑וֹ בֶּ֥צַע כֶּ֖סֶף לֹ֥א לָקָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: tl
  text: Dumating ang mga hari; nakipaglaban sila. Noon ay nakipaglaban ang mga hari ng Canaan sa Taanac, sa tabi ng mga tubig ng Megido; wala silang nakuhang samsam na pilak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pakinabang na pilak” o “tubong pilak.” Maaaring tumukoy ang Hebreong parirala sa materyal na pakinabang sa pangkalahatan, ngunit sa konteksto ng labanang ito, pinakamalamang ang “samsam na pilak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ מְלָכִים
  choice: Dumating ang mga hari
  rationale: Pinananatili ang maikli at makatang pambungad. Likas sa Filipino ang pantukoy na “ang” kahit walang artikulo ang pangngalang Hebreo.
- source_word: נִלְחָמוּ
  choice: nakipaglaban sila
  rationale: Tuwirang ipinapahayag ang karaniwang diwa ng Niphal ng לחם at angkop sa konteksto ng labanan.
- source_word: אָז
  choice: Noon ay
  rationale: Ipinahihiwatig ang paglipat sa eksena o panahong tinutukoy nang hindi labis na nililinaw kung mahigpit na sunod-sunod ang mga pangyayari.
- source_word: מַלְכֵי כְנַעַן
  choice: ang mga hari ng Canaan
  rationale: Malinaw at pormal na inililipat ang ugnayan ng construct chain.
- source_word: בְּתַעְנַךְ
  choice: sa Taanac
  rationale: Ang “sa” ang likas na panandang Filipino para sa lugar ng labanan; ginamit ang anyong pangalang “Taanac” na madaling basahin sa Filipino.
- source_word: עַל מֵי מְגִדּוֹ
  choice: sa tabi ng mga tubig ng Megido
  rationale: Inililipat ang topograpikong diwa ng עַל bilang kalapitan sa mga daluyan o bukal ng tubig, habang pinananatili ang kolektibong larawang “mga tubig.”
- source_word: בֶּצַע כֶּסֶף
  choice: samsam na pilak
  rationale: Maaaring mangahulugan ang parirala ng pakinabang o tubo, ngunit sa konteksto ng digmaan ay pinakamalamang ang samsam; pinananatili sa talababa ang tunay na leksikal na saklaw.
- source_word: לֹא לָקָחוּ
  choice: wala silang nakuhang
  rationale: Likas na Filipino para sa payak na pagtanggi at pinananatili ang diin na walang samsam na nakuha.
