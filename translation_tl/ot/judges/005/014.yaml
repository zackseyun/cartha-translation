  text: מִנִּ֣י אֶפְרַ֗יִם שָׁרְשָׁ/ם֙ בַּ/עֲמָלֵ֔ק אַחֲרֶ֥י/ךָ בִנְיָמִ֖ין בַּֽ/עֲמָמֶ֑י/ךָ מִנִּ֣י מָכִ֗יר יָֽרְדוּ֙ מְחֹ֣קְקִ֔ים וּ/מִ֨/זְּבוּלֻ֔ן מֹשְׁכִ֖ים בְּ/שֵׁ֥בֶט סֹפֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: tl
  text: Mula sa Efraim, ang mga may ugat sa Amalek[a]; kasunod mo, Benjamin, sa gitna ng iyong mga mamamayan[b]. Mula sa Makir[c] ay bumaba ang mga pinuno[d], at mula sa Zebulun, ang mga may hawak na tungkod ng eskriba[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanilang ugat ay laban sa Amalek” o “ang kanilang ugat ay nasa bulubundukin ng Amalek.” Mahirap unawain ang linyang Hebreo at malamang na patula at heograpikal ang pahayag.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sinundan ka ng Benjamin, kasama ng iyong mga lipi/kamag-anak.” Ang “sa gitna ng iyong mga mamamayan” ay malapit na salin ng isang di-pangkaraniwang pahayag sa Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Ang Makir ang pangunahing angkan sa loob ng lipi ni Manases; kaya sa ilang salin, “Manases” ang ginagamit dito.
    reason: cultural_note
  - marker: d
    text: Maaari ring “mga tagapagbatas” o “mga tagapamahala.” Ang salitang Hebreo ay maaaring tumukoy sa mga namumuno o nagtatakda ng kautusan.
    reason: lexical_alternative
  - marker: e
    text: Maaari ring “ang mga humihila gamit ang tungkod ng eskriba” o “ang mga may dalang tungkod ng pinunong nagtitipon ng hukbo.” Bihira ang pahayag sa Hebreo at maaaring tumukoy sa pagtitipon o pagtatala ng mga kawal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי אֶפְרַיִם
  choice: Mula sa Efraim
  rationale: Ipinahahayag ng pang-ukol ang pinagmulan; likas sa Tagalog ang “mula sa” at napapanatili nito ang patulang talaan ng mga lipi.
- source_word: שָׁרְשָׁם
  choice: ang mga may ugat
  rationale: Pinananatili ang konkretong talinghaga ng “ugat” habang ginagawang natural ang parirala sa Tagalog at hindi ito nililimitahan sa kahulugang “mga inapo.”
- source_word: בַּעֲמָלֵק
  choice: sa Amalek
  rationale: Pinakamalapit na pagbasa rito ang lokatibong “sa,” ngunit mahirap at maaaring heograpikal ang patulang linya; inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: kasunod mo, Benjamin
  rationale: Napapanatili ang maikli at patulang ayos ng Hebreo nang hindi nagdaragdag ng tahasang pandiwang wala sa teksto.
- source_word: בַּעֲמָמֶיךָ
  choice: sa gitna ng iyong mga bayan
  rationale: Ang “mga bayan” ay malapit sa pangmaramihang “mga sambayanan/peoples,” at pinananatili ang di-pangkaraniwang pahayag; nililinaw sa talababa ang posibleng kahulugang mga lipi o kamag-anak.
- source_word: מִנִּי מָכִיר
  choice: Mula sa Makir
  rationale: Pinananatili ang mismong pangalang nasa Hebreo sa halip na palitan ito ng mas malawak na pangalang Manases.
- source_word: יָרְדוּ
  choice: bumaba
  rationale: Tuwirang katumbas ng pandiwang nangangahulugang bumaba o nanaog at angkop sa pananaw ng awit.
- source_word: מְחֹקְקִים
  choice: mga pinuno
  rationale: Sa konteksto ng pagtitipon para sa labanan, malinaw at natural ang “mga pinuno,” habang ang ugat ng salita ay maaari ring tumukoy sa mga nag-uutos o nagtatakda ng kautusan.
- source_word: וּמִזְּבוּלֻן
  choice: at mula sa Zebulun
  rationale: Tuwirang ipinagpapatuloy ang talaan ng mga liping pinagmulan.
- source_word: מֹשְׁכִים
  choice: ang mga may hawak
  rationale: Natural sa Tagalog ang pahayag at ipinahihiwatig ang pagdadala o paggamit ng kasangkapang kasunod, nang hindi pilit na isinasalin bilang “humihila.”
- source_word: בְּשֵׁבֶט סֹפֵר
  choice: tungkod ng eskriba
  rationale: 'Pinananatili ang pambihira at malabong larawan ng Hebreo: ang שֵׁבֶט ay tungkod/pamalo/setro at ang סֹפֵר ay eskriba. Hindi ito tahasang ginawang tungkod ng pinunong-militar.'
