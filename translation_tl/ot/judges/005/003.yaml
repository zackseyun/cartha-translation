  source_fidelity: Kailangang baguhin ang “tutugtog ako.” Ang זמר ay tumutukoy sa pag-awit o paggawa ng musika, ngunit ang “tumugtog” sa modernong Filipino ay karaniwang tumutukoy sa pagtugtog ng instrumento at kaya ay nagdaragdag ng hindi tahasang nasa Hebreo. Ang “lilikha ako ng musika” ay sumasaklaw sa kahulugan nang hindi nagsasaad ng instrumento at pinananatili ang kaibahan nito sa “aawit.”
  naturalness: Natural at marangal ang magkatambal na “Makinig kayo ... dinggin ninyo.” Bahagyang matayog ngunit katanggap-tanggap sa panulang patula ang mariing “Ako—para kay Yahweh, ako ay aawit.”
  terminology: Tumpak ang “mga hari,” “mga pinuno,” “Yahweh,” at “ang Diyos ng Israel.” Ang “para kay Yahweh” ay isang katanggap-tanggap na pagpapahayag ng pinag-uukulan/pinatutungkulan ng awit; hindi nito nililimitahan nang labis ang gamit ng ל.
