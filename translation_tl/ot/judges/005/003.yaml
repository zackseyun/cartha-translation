base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: tl
  text: Makinig kayo, mga hari; dinggin ninyo, mga pinuno. Ako—para kay Yahweh, ako ay aawit; lilikha ako ng musika para kay Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Makinig kayo
  rationale: Pautos na maramihan; natural at malinaw na panawagan sa makabagong Filipino.
- source_word: מְלָכִים
  choice: mga hari
  rationale: Tuwirang katumbas ng pangngalang maramihan at pinananatili ang tiyak na pagtukoy sa mga hari.
- source_word: הַאֲזִינוּ
  choice: dinggin ninyo
  rationale: Pinananatili ang ikalawang, halos kasingkahulugang pautos at ang marangal na paralelismong patula nang hindi inuulit lamang ang “makinig.”
- source_word: רֹזְנִים
  choice: mga pinuno
  rationale: Malinaw at pangkasalukuyang katawagan para sa matataas na tagapamahala o makapangyarihang opisyal.
- source_word: אָנֹכִי ... אָנֹכִי
  choice: Ako ... ako
  rationale: Pinananatili ang kapansin-pansing pag-uulit ng malayang panghalip at ang diin ng Hebreo.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Sa mga pandiwa ng pag-awit at pagtugtog, maaaring ipahayag ng ל ang pag-uukol o pinatutungkulan; natural itong naihahayag ng “para kay.”
- source_word: יהוה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalang tipan na nasa tekstong Hebreo.
- source_word: אָשִׁירָה
  choice: ako ay aawit
  rationale: Ipinahahayag ang kusang pasiya o matibay na layunin ng anyong cohortative sa natural na Filipino.
- source_word: אֲזַמֵּר
  choice: tutugtog ako
  rationale: Pinananatili ang pagkakaiba sa naunang “aawit.” Maaaring saklawin ng זמר ang paggawa ng musika o pag-awit ng papuri; ang “tutugtog” ay maikli at patula ngunit hindi tahasang nagtatakda ng instrumento.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at karaniwang salin ng pariralang construct na kumikilala kay Yahweh bilang Diyos ng Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ginagamit mismo ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng isang titulo.
- issue: Ugnayan ng ל sa mga pandiwa ng musika
  choice: para kay Yahweh
  alternative: kay Yahweh
  rationale: Maaaring ipahiwatig ng ל ang pinatutungkulan o pinag-uukulan ng awit. Ang “para kay” ay natural sa Filipino at hindi nilulutas nang labis kung ito ay direksiyon o pag-aalay.
translation_notes:
  register: Makabago ngunit marangal at patula. Pinanatili ang magkatugmang mga pautos at ang mariing pag-uulit ng “Ako ... ako.” Ginamit ang gitling-pahaba upang maging malinaw ang biglang mariing pagpapahayag nang hindi binabago ang estruktura ng Hebreo.
