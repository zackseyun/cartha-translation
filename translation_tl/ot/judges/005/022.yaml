  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: tl
  text: Noon ay dumagundong ang mga kuko ng mga kabayo dahil sa paghagibis[a]—sa paghagibis ng kanyang mga malalakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling parirala bilang “sa paghagibis ng kanyang malalakas na kabayo” o “sa paglusob ng kanyang magigiting na mandirigma.” Maaaring tumukoy ang pananalitang Hebreo sa malalakas na kabayo o sa mga mandirigmang kaugnay ng mga ito.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Noon
  rationale: Likas na panandang temporal sa salaysay-awit at pinananatili ang mabilis na pagkakasunod ng mga tagpo.
- source_word: הָלְמוּ
  choice: dumagundong
  rationale: Ipinahihiwatig ng pandiwa ang malakas at paulit-ulit na paghampas; sa konteksto ng mga paa ng kabayo, ipinapahayag ng “dumagundong” ang tunog at lakas nang natural sa Filipino.
- source_word: עִקְּבֵי סוּס
  choice: mga paa ng mga kabayo
  rationale: Bagaman literal na maaaring tumukoy sa mga sakong o kuko ng kabayo, “mga paa ng mga kabayo” ang malinaw at likas na tawag sa karaniwang Filipino; kolektibo ang isahang “kabayo” sa Hebreo.
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: sa paghagibis—sa paghagibis
  rationale: Ang “sa” ay naghahayag ng sanhi o kalagayan ng pagdagundong, at pinananatili ang pag-uulit ng Hebreo para sa matinding kilos at tulin ng tula.
- source_word: אַבִּירָיו
  choice: kanyang malalakas
  rationale: Pinananatili ng malawak na katawagang ito ang tunay na kalabuan kung ang tinutukoy ay malalakas na kabayo o mga makapangyarihang mandirigmang kaugnay ng mga ito.
theological_decisions:
- issue: Tinutukoy ng panlalaking isahang hulaping “kanyang” at ng אַבִּירָיו
  choice: Hindi tinukoy nang tahasan; isinalin bilang “kanyang malalakas.”
  alternative: “kanyang malalakas na kabayo” o “kanyang magigiting na mandirigma”
  rationale: Maaaring ipahiwatig ng konteksto ang mga kabayo o ang mga mandirigmang nakasakay o kaugnay ng mga ito. Hindi nilulutas ng salin ang kalabuang nananatili sa Hebreong tula.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa isang awit ng tagumpay. Ginamit ang “dumagundong” at “paghagibis” upang mapanatili ang pandinig at galaw ng Hebreong tula, kasama ang sadyang pag-uulit nito.
