  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: tl
  text: ‘Hindi ba sila nakasusumpong at naghahati ng samsam? Isang sinapupunan[a], dalawang sinapupunan para sa bawat lalaki; samsam na mga telang tinina para kay Sisera, samsam na mga telang tinina, telang may burda, telang tinina[b], dalawang burda para sa mga leeg ng samsam.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang sinapupunan, dalawang sinapupunan”—isang marahas na metonimiya para sa mga babaeng kinukuha bilang seksuwal na samsam.
    reason: lexical_alternative
  - marker: b
    text: O “para sa mga leeg ng mga bihag / mga kinuha bilang samsam.” Mahirap unawain ang pangwakas na parirala sa Hebreo at maaaring tumukoy sa mga telang may burda na isinusuot ng mga babaeng bihag.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ
  choice: Hindi ba’t nakakasumpong sila at naghahati-hati
  rationale: Pinananatili ang retorikal na tanong at ang masiglang paglalarawan sa inaasahang paghahanap at pamamahagi ng nasamsam.
- source_word: שָׁלָל
  choice: samsam
  rationale: Karaniwan at angkop na salitang Filipino para sa ari-ariang kinuha sa digmaan.
- source_word: רַחַם רַחֲמָתַיִם
  choice: isang sinapupunan, dalawang sinapupunan
  rationale: Literal na pinananatili ang marahas at mapanghamak na metonimiya ng Hebreo para sa mga babaeng itinuturing na samsam na seksuwal.
- source_word: לְרֹאשׁ גֶּבֶר
  choice: para sa bawat lalaki
  rationale: Natural na ipinahahayag ang distributibong idyomang literal na ‘para sa ulo ng isang lalaki,’ habang pinananatili ang panlalaking tukoy ng גֶּבֶר.
- source_word: צְבָעִים
  choice: mga telang tinina
  rationale: Malinaw na tumutukoy sa makukulay o tinang tela sa talaan ng samsam at akma sa poetikong pag-uulit.
- source_word: רִקְמָה / רִקְמָתַיִם
  choice: telang may burda / dalawang burda
  rationale: Pinananatili ang larawan ng binurdahang tela at ang dual na bilang sa ikalawang anyo nang hindi lubusang pinapakinis ang siksik na Hebreong parirala.
- source_word: לְצַוְּארֵי שָׁלָל
  choice: para sa mga leeg ng samsam
  rationale: Malapit na salin ng mahirap at siksik na parirala; inilalahad sa talababa ang pangunahing alternatibong pagbasa.
theological_decisions:
- issue: Kung palalambutin ang seksuwalisado at mapanghamak na idyomang רַחַם רַחֲמָתַיִם
  choice: Panatilihin ang literal na ‘isang sinapupunan, dalawang sinapupunan’
  alternative: ‘isang babae, dalawang babae’ o ‘isa o dalawang babae para sa bawat lalaki’
  rationale: Ang pananalita ay nagpapakita ng malupit na inaasahan ng sambahayan ni Sisera, hindi ng pagsang-ayon ng tagapagsalaysay. Pinananatili ng literal na metonimiya ang moral na bigat at pagkagimbal ng awit.
- issue: Kahulugan ng mahirap na pangwakas na pariralang לְצַוְּארֵי שָׁלָל
  choice: Malapit na salin sa pangunahing teksto, na may alternatibo sa talababa
  alternative: ‘para sa mga leeg ng mga bihag / mga kinuha bilang samsam’
  rationale: Hindi tiyak ang sintaks ng Hebreo; hindi ito dapat lutasin nang labis ang katiyakan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit tuwiran. Sinasadyang panatilihin ang nakakagimbal na ‘sinapupunan’ at ang hindi ganap na malinaw na pangwakas na parirala, habang gumagamit ng likas na ‘para sa bawat lalaki’ para sa distributibong idyoma.
