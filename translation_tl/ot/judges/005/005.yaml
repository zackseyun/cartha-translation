  text: הָרִ֥ים נָזְל֖וּ מִ/פְּנֵ֣י יְהוָ֑ה זֶ֣ה סִינַ֔י מִ/פְּנֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/005.yaml
  text: The mountains quaked before Yahweh[a], this Sinai before Yahweh[b], the God of Israel.
translation:
  language: tl
  text: 'Ang mga bundok ay umagos[a] sa harap ni Yahweh—

    ang Sinai na ito—sa harap ni Yahweh,

    ang Diyos ng Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “natunaw.” Ang pandiwang Hebreo ay nangangahulugang umagos o tumulo; inilalarawan ng maraming salin ang larawang ito bilang pagkatunaw ng mga bundok.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: ang mga bundok
  rationale: May tiyak na pantukoy ang pangngalang Hebreo, at karaniwang kahulugan ng הָרִים ang “mga bundok.”
- source_word: נָזְלוּ
  choice: umagos
  rationale: Ang pandiwa ay pangunahing tumutukoy sa pag-agos o pagtulo. Pinananatili ng “umagos” ang matapang na larawang patula sa halip na agad itong ipaliwanag bilang “natunaw” o palitan ng “nayanig.”
- source_word: מִפְּנֵי
  choice: sa harap ni
  rationale: Likas na salin ito sa Tagalog ng idyomang literal na “mula sa harap/presensiya ni,” at malinaw nitong ipinahihiwatig ang pagtugon ng mga bundok sa presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang banal sa halip na palitan iyon ng isang titulo.
- source_word: זֶה סִינַי
  choice: ang Sinai na ito
  rationale: Pinananatili nito ang biglaan at mariing demonstratibong anyo ng tulang Hebreo nang hindi idinaragdag ang salitang “Bundok,” na wala sa parirala.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Natural na Tagalog ito para sa pariralang konstruktong kumikilala kay Yahweh bilang Diyos ng Israel.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Larawang teopanikong נָזְלוּ
  choice: umagos
  alternative: natunaw; nayanig; tumulo
  rationale: Ang “umagos” ang pinakamalapit sa leksikal na larawan. Ang “natunaw” ay posibleng pagpapakahulugan sa larawang patula, samantalang ang “nayanig” ay akma sa mas malawak na tagpo ngunit hindi pangunahing kahulugan ng pandiwa.
translation_notes:
  register: Makabagong, marangal, at patulang Tagalog. Ang paghahati ng mga linya at mga gitling ay nagpapanatili sa mariing pariralang “ang Sinai na ito” at sa pag-uulit ng “sa harap ni Yahweh.”
