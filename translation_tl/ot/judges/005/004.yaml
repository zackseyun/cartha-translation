source:
  edition: WLC
  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: tl
  text: 'Yahweh, nang lumabas ka mula sa Seir,

    nang humakbang ka mula sa kaparangan ng Edom[a],

    yumanig ang lupa[b];

    tumulo rin ang kalangitan,

    tumulo rin ng tubig ang mga ulap.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa bukid ng Edom”; maaari ring “mula sa lupain ng Edom.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “yumanig ang lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na YHWH sa paraang malinaw at kilala sa makabagong Filipino.
- source_word: בְּצֵאתְךָ
  choice: nang lumabas ka
  rationale: Ang בְּ na kasunod ng infinitive construct at hulaping ikalawang panauhan ay temporal; natural itong ipinapahayag sa Filipino bilang “nang lumabas ka.”
- source_word: מִשֵּׂעִיר
  choice: mula sa Seir
  rationale: Pangalan ng lugar ang Seir, at malinaw na ipinahahayag ng מִן ang pinagmulan.
- source_word: בְּצַעְדְּךָ
  choice: nang humakbang ka
  rationale: Pinananatili ng “humakbang” ang larawang nasa pandiwang צעד at ang maringal na pagkilos ng Diyos, nang hindi dinaragdagan ang kahulugan bilang kilos-militar.
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: mula sa malawak na lupain ng Edom
  rationale: Maaaring tumukoy ang שָׂדֶה sa bukid o sa lantad at malawak na lupain. Mas natural sa kontekstong heograpiko ang “malawak na lupain,” habang inilalagay sa talababa ang mas literal na anyo.
- source_word: אֶרֶץ רָעָשָׁה
  choice: yumanig ang lupa
  rationale: Dahil katambal nito ang kalangitan at mga ulap, ang אֶרֶץ ay pinakamalamang na “lupa/daigdig” dito; malinaw na ipinahahayag ng רָעַשׁ ang pagyanig.
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: nagpatak din ang kalangitan
  rationale: Pinananatili ng “nagpatak” ang konkretong larawan ng נָטַף at inihahanda ang pagbanggit sa tubig sa kasunod na linya.
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: nagpatak din ng tubig ang mga ulap
  rationale: Pinananatili ang pag-uulit ng נָטַף at ang tahasang layon nitong מָיִם, pati ang paralelismo ng Hebreong tula.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang gamit ng Hebreo. Ang “Yahweh” ay nagpapanatili sa katangian nito bilang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng אֶרֶץ sa larawan ng teofaniya
  choice: lupa
  alternative: lupain
  rationale: Pinapaboran ng pagkakatambal sa kalangitan at mga ulap ang malawak o kosmikong kahulugang “lupa,” ngunit pinananatili sa talababa ang tunay na posibilidad na “lupain.”
translation_notes:
  register: Makabagong Filipino na may maringal at patulang himig. Pinanatili ang magkakatugmang mga sugnay at ang pag-uulit ng “nagpatak,” ngunit iniwasan ang mga salitang lipas o labis na teknikal.
