base_translation:
  language: en
  yaml_path: translation/ot/judges/005/018.yaml
  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: tl
  text: Ang Zabulon ay isang bayang itinaya ang buhay nito hanggang sa kamatayan[a], at gayundin ang Neftali, sa matataas na bahagi ng parang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi pinahalagahan ang buhay nito hanggang sa kamatayan,” ibig sabihin, itinaya nito ang buhay kahit humantong sa kamatayan. Kolektibong isahan ang gamit sa Hebreo para sa Zabulon, at ang pandiwa ay may diwang paghamak o pagwawalang-halaga.
    reason: lexical_alternative
  - marker: b
    text: O “sa matataas na bahagi ng bukas na lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבֻלוּן
  choice: Zebulun
  rationale: Pinanatili ang nakaugaliang transliterasyon sa Filipino para sa pangalan ng lipi.
- source_word: עַם
  choice: isang bayan
  rationale: Pinananatili ang kolektibong pangngalang tumutukoy sa lipi; natural at marangal ang 'bayan' sa modernong Filipino.
- source_word: חֵרֵף נַפְשׁוֹ
  choice: itinaya ang buhay nito
  rationale: Sa konteksto ng labanan, ipinahihiwatig ng parirala ang pagwawalang-bahala sa sariling buhay at pagharap sa matinding panganib. Ang 'itinaya' ay natural sa Filipino, habang inilalagay sa talababa ang mas literal na diwa ng paghamak o hindi pagpapahalaga sa buhay.
- source_word: לָמוּת
  choice: hanggang kamatayan
  rationale: Ipinapahayag ang sukdulang lawak ng paglalagay sa panganib—hanggang sa posibilidad ng kamatayan—nang hindi pinapakinis ang matinding pananalita ng Hebreo.
- source_word: וְנַפְתָּלִי
  choice: at gayundin ang Neftali
  rationale: Ginagawang malinaw sa natural na Filipino na kasama ang Neftali sa parehong papuri, gaya ng ipinahihiwatig ng paralelismo.
- source_word: עַל מְרוֹמֵי שָׂדֶה
  choice: sa matataas na bahagi ng parang
  rationale: Pinananatili ang topograpikong larawan ng mga mataas na lugar sa bukas na lupain at iniiwasang ipakahulugang tiyak na 'larangan ng digmaan.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'bayan' bilang kolektibong katawagan sa lipi, ang panghalip na 'nito' upang sundan ang kolektibong isahan, at 'parang' para sa bukas na lupa nang hindi labis na tinutukoy itong larangan ng digmaan.
