translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang pag-uulit ng “nang panahon ni” at ang kaibahan ng pangunahing mga daan sa paliku-likong mga ruta, nang hindi ginagawang moral ang larawang “paliku-liko.”
