  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: tl
  text: Sa panahon ni Samgar na anak ni Anat, sa panahon ni Jael, nawalan ng mga dumaraan ang mga pangunahing daan[a], at ang mga naglalakbay sa mga landas ay dumaraan sa mga daang paliku-liko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumigil ang mga daan”—ibig sabihin, tumigil ang karaniwang paglalakbay sa mga pangunahing ruta.
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang “mga daang paliku-liko” ay mga di-tuwirang rutang dinaanan para sa kaligtasan, hindi larawan ng masamang asal.
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: nang panahon ni
  rationale: Likas na makabagong Tagalog para sa Hebreong idyomang tumutukoy sa panahong kaugnay ng isang tao; inuulit upang mapanatili ang paralelismo ng awit.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Samgar na anak ni Anat
  rationale: Isinasalin ang בֶּן bilang “anak ni” at ginagamit ang malinaw na transliterasyong Filipino ng mga pangalang Hebreo.
- source_word: יָעֵל
  choice: Jael
  rationale: Ginagamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: חָדְלוּ אֳרָחוֹת
  choice: nawalan ng mga dumaraan ang malalaking daan
  rationale: Ang חָדְלוּ ay literal na “tumigil/naglaho,” ngunit kapag mga daan ang simuno, ang diwa ay tumigil ang karaniwang paggamit sa mga pangunahing ruta. Pinananatili ng talababa ang mas literal na anyo.
- source_word: אֳרָחוֹת
  choice: malalaking daan
  rationale: Tumutukoy sa karaniwang mga rutang dinaraanan; ipinakikita ng “malalaking daan” ang kaibahan sa mga di-tuwiran at paliku-likong rutang kasunod.
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: mga manlalakbay
  rationale: Literal na “mga lumalakad sa mga landas.” Ang “mga manlalakbay” ay likas at maikli sa Tagalog, habang ang kasunod na parirala ang nagsasaad kung saang mga daan sila dumaan.
- source_word: יֵלְכוּ
  choice: dumaan
  rationale: Ang imperfect sa konteksto ng awit tungkol sa nakaraan ay naglalarawan ng nakaugaliang kilos; ang aspektong naganap ay angkop sa Tagalog.
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: mga daang paliku-liko
  rationale: Inilalarawan ng עֲקַלְקַלּוֹת ang baluktot, paikot, o di-tuwirang ruta. Ang “paliku-liko” ay nagpapanatili sa konkretong larawan nang hindi nagpapahiwatig ng moral na kasamaan.
