  source_fidelity: 'Tapat ang salin sa Hebreo: napananatili ang apat na inuulit na pautos sa Debora, ang panawagan kay Barak na bumangon, ang sadyang paulit na pariralang “bihagin mo ang iyong mga bihag,” at ang patronimikong “anak ni Abinoam.” Ang “bigkasin mo ang isang awit” ay isang ligtas at patulang pagsasalin ng דַּבְּרִי שִׁיר; hindi nito ipinipilit na ang pandiwa ay ang karaniwang “umawit.”'
