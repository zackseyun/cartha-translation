  text: עוּרִ֤י עוּרִי֙ דְּבוֹרָ֔ה ע֥וּרִי ע֖וּרִי דַּבְּרִי שִׁ֑יר ק֥וּם בָּרָ֛ק וּֽ/שֲׁבֵ֥ה שֶׁבְיְ/ךָ֖ בֶּן אֲבִינֹֽעַם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: tl
  text: Gumising ka, gumising ka, Debora! Gumising ka, gumising ka, bigkasin mo ang isang awit![a] Bumangon ka, Barak, at bihagin mo ang iyong mga bihag,[b] anak ni Abinoam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “magsalita ka ng awit”; maaari ring isalin na “umawit ka.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “bihagin mo ang iyong mga bihag,” isang idyomang Hebreo tungkol sa pagtatagumpay sa mga kaaway sa pamamagitan ng pagkuha sa kanila bilang mga bihag.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Gumising ka
  rationale: Pautos na pambabaeng isahan mula sa עור. Ang apat na ulit na “Gumising ka” ay nagpapanatili sa masidhi at patulang panawagan.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: דַּבְּרִי שִׁיר
  choice: bigkasin mo ang isang awit
  rationale: Ang pandiwa ay literal na “magsalita,” hindi ang karaniwang pandiwa para sa “umawit.” Ang “bigkasin” ay likas sa kontekstong patula at pinananatili ang natatanging pananalita ng Hebreo nang hindi nagiging labis na asiwa.
- source_word: קוּם
  choice: Bumangon ka
  rationale: Pautos na panlalaking isahan na nakatuon kay Barak; ang “bumangon” ay angkop sa panawagang kumilos sa konteksto ng labanan.
- source_word: בָּרָק
  choice: Barak
  rationale: Tuwirang transliterasyon ng personal na pangalan.
- source_word: וּשֲׁבֵה
  choice: at bihagin mo
  rationale: Pautos mula sa שבה na tumutukoy sa pagdakip at pagdadala ng mga bihag; malinaw na pinananatili ng “bihagin” ang diwang militar.
- source_word: שֶׁבְיְךָ
  choice: ang iyong mga bihag
  rationale: Maaaring tumukoy ang שֶׁבִי sa mga bihag bilang isang pangkat o sa pagkabihag. Pinananatili rito ang sadyang pag-uulit ng salitang-ugat sa Hebreong parirala.
- source_word: בֶּן אֲבִינֹעַם
  choice: anak ni Abinoam
  rationale: Likas na pormang Filipino para sa pormal na pagkakakilanlan sa pamamagitan ng ama.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may patulang pag-uulit at maiikling pautos upang mapanatili ang sigla ng awit ng tagumpay. Ginamit ang “bigkasin” upang panatilihin ang leksikal na kakaiba ng Hebreo habang nananatiling nauunawaan sa Filipino.
