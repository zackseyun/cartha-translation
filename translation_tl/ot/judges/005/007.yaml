  text: חָדְל֧וּ פְרָז֛וֹן בְּ/יִשְׂרָאֵ֖ל חָדֵ֑לּוּ עַ֤ד שַׁ/קַּ֨מְתִּי֙ דְּבוֹרָ֔ה שַׁ/קַּ֥מְתִּי אֵ֖ם בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: tl
  text: Naglaho sa Israel ang pamumuhay sa mga nayon[a]; naglaho ito hanggang sa bumangon ako, si Debora—hanggang sa bumangon ako bilang isang ina sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nawala ang mga taganayon sa Israel,” o “nawala ang populasyon sa kanayunan ng Israel.” Mahirap tiyakin ang kahulugan ng pangngalang Hebreo; maaari itong tumukoy sa mga naninirahan sa mga nayon o, nang mas malawak, sa pamumuhay sa mga nayon.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: naglaho / naglaho
  rationale: Ipinahahayag ng inuulit na pandiwa ang pagkawala o paghinto ng dating kalagayan. Pinananatili ng pag-uulit ang paralelismo at panaghoy ng awit.
- source_word: פְרָזוֹן
  choice: pamumuhay sa mga nayon
  rationale: Mahirap tiyakin ang tiyak na saklaw ng pangngalan; maaari itong tumukoy sa mga taganayon o, nang mas malawak, sa buhay sa mga pamayanang walang pader. Natural sa Filipino ang napiling parirala at hindi ito nililimitahan sa mga gusali o lugar lamang.
- source_word: בְּיִשְׂרָאֵל
  choice: ng Israel / sa Israel
  rationale: Sa unang sugnay, natural na Filipino ang 'mga nayon ng Israel' para sa lokatibong diwa; sa hulí, pinananatili ang tuwirang 'sa Israel.'
- source_word: עַד
  choice: hanggang sa
  rationale: Malinaw nitong minamarkahan ang pagbabagong naganap nang bumangon si Debora.
- source_word: שַׁקַּמְתִּי
  choice: bumangon ako
  rationale: Ipinahihiwatig ng קום ang pagbangon upang kumilos. Ang 'bumangon' ay natural ngunit marangal, at pinananatili ang unang-panauhang pag-uulit.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: אֵם
  choice: isang ina
  rationale: Pinananatili ang larawang maternal at ang diwang papel o pagkakakilanlan sa pariralang 'bilang isang ina,' nang hindi ito ginagawang literal na pagiging ina ng buong Israel.
theological_decisions:
- issue: Metaporikal na diwa ng אֵם בְּיִשְׂרָאֵל
  choice: bilang isang ina sa Israel
  alternative: ina ng Israel
  rationale: Ang Hebreo ay literal na 'ina sa Israel,' hindi 'ina ng Israel.' Pinananatili nito ang tunay na anyo ng pahayag at hinahayaang marinig ang diwa ng mapagkalinga at mapagtanggol na pamumuno nang hindi pinalalakas bilang isang tiyak na titulo.
translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Pinanatili ang pag-uulit at ang biglang paglitaw ng unang panauhan. Ginamit ang 'pamumuhay sa mga nayon' bilang malinaw na pangunahing salin, habang inilagay sa talababa ang tunay na leksikal na kalabuan.
