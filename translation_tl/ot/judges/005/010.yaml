base_translation:
  language: en
  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: tl
  text: Kayong nakasakay sa mga puting babaeng asno, kayong nakaupo sa mga alpombra[a], at kayong naglalakad sa daan—magsalita kayo![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga telang pansapin sa upuan” o “mga banig.” Bihira at hindi tiyak ang salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “isalaysay ninyo” o “ikuwento ninyo.” Maaari ring tumukoy ang pandiwang Hebreo sa pagsasalita nang hayagan o paglalahad ng isang pangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: kayong nakasakay
  rationale: Ang Qal participle na maramihan ay ginagamit bilang tuwirang pagtawag; natural sa Filipino ang “kayong nakasakay.”
- source_word: אֲתֹנוֹת
  choice: mga babaeng asno
  rationale: Tiyak na tumutukoy ang pangngalang Hebreo sa mga inahing asno; pinanatili ang detalyeng ito dahil malinaw ito sa pinagmulang teksto.
- source_word: צְחֹרוֹת
  choice: mapuputi
  rationale: Pinakamalapit na kahulugan nito ang puti o maliwanag na kulay; ang “mapuputi” ay natural na panuring sa maramihan.
- source_word: יֹשְׁבֵי
  choice: kayong nakaupo
  rationale: Isa pang participle na ginagamit bilang tuwirang pagtawag; ipinahihiwatig ng kasunod na parirala na pag-upo, hindi paninirahan, ang tinutukoy.
- source_word: מִדִּין
  choice: mga alpombra
  rationale: Bihira at hindi tiyak ang salitang Hebreo. Sa konteksto ng mga nakasakay at naglalakbay, malamang na tumutukoy ito sa mamahaling sapin, alpombra, o telang pansapin sa upuan; inilagay sa talababa ang kawalang-katiyakan.
- source_word: וְהֹלְכֵי
  choice: at kayong naglalakad
  rationale: Pinananatili nito ang konkretong larawan at ang ikatlong tuwirang pagtawag sa magkakatulad na participle.
- source_word: דֶּרֶךְ
  choice: sa daan
  rationale: Karaniwan at natural na katumbas ng Hebreong salita para sa daan o landas sa konteksto ng paglalakbay.
- source_word: שִׂיחוּ
  choice: magsalita kayo
  rationale: Ang pautos na pandiwa ay maaaring mangahulugang magsalita, maglahad, o magbulay. Pinananatili ng “magsalita kayo” ang malawak na saklaw nito, habang nasa talababa ang mas tiyak na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang patulang tatluhang pagtawag at ang pangwakas na pautos. Ginamit ang “asno” sa halip na “donkey” at ang tiyak na kasariang “babaeng” dahil malinaw ito sa Hebreo; ang dalawang tunay na kahinaang leksikal ay hayagang inilagay sa mga talababa.
