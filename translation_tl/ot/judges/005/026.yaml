source:
  edition: WLC
  text: יָדָ/הּ֙ לַ/יָּתֵ֣ד תִּשְׁלַ֔חְנָה וִֽ/ימִינָ֖/הּ לְ/הַלְמ֣וּת עֲמֵלִ֑ים וְ/הָלְמָ֤ה סִֽיסְרָא֙ מָחֲקָ֣ה רֹאשׁ֔/וֹ וּ/מָחֲצָ֥ה וְ/חָלְפָ֖ה רַקָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: tl
  text: 'Iniunat niya ang kamay niya sa tulos ng tolda,

    at ang kanang kamay niya sa maso ng mga manggagawa.[a]

    Hinampas niya si Sisera at dinurog ang ulo nito;[b]

    winasak at tinagos niya ang sentido nito.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “martilyo ng mga manggagawa” o “pamukpok ng mga trabahador.” Hindi pangkaraniwan ang pariralang Hebreo, kaya hindi ganap na tiyak ang eksaktong uri ng kasangkapang pamukpok.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “binasag ang ulo nito.” Sunod-sunod na gumamit ang tulang Hebreo ng mararahas na pandiwa upang patindihin ang paglalarawan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “pinalagusan niya ang sentido nito” o “dumaan sa sentido nito.” Malamang na ipinahihiwatig ng huling pandiwa ang pagtagos, ngunit maaari rin itong unawain nang mas literal bilang pagdaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... וִימִינָהּ
  choice: ang kamay niya ... ang kanang kamay niya
  rationale: Pinananatili ang kongkretong kahulugang “kamay” at ang paralelismong patula sa “kanang kamay,” nang hindi ipinapalagay na ang una ay tiyak na kaliwang kamay.
- source_word: לַיָּתֵד
  choice: sa tulos ng tolda
  rationale: Sa konteksto ng salaysay tungkol kay Jael, ang יָתֵד ay tulos na ginagamit sa tolda; nililinaw ng “ng tolda” ang tinutukoy.
- source_word: תִּשְׁלַחְנָה
  choice: iniunat niya
  rationale: Ipinahihiwatig ng pandiwa ang pag-uunat o pag-abot ng kamay patungo sa isang bagay. Ang “iniunat” ay malinaw at likas sa Filipino.
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: sa maso ng mga manggagawa
  rationale: Ang di-karaniwang parirala ay tumutukoy sa kasangkapang pamukpok. Ang “maso” ay angkop sa mabigat na pamukpok at pinananatili ng “ng mga manggagawa” ang ugnayang nasa Hebreo.
- source_word: וְהָלְמָה
  choice: hinampas niya
  rationale: Tuwirang ipinapahayag ang malakas na paghampas at iniuugnay ang kilos kay Sisera.
- source_word: מָחֲקָה
  choice: dinurog
  rationale: Inihahatid ang marahas na pagdurog o pagwasak na ipinahihiwatig ng pandiwa, habang nananatiling patula at hindi klinikal.
- source_word: וּמָחֲצָה
  choice: winasak
  rationale: Gumagamit ng ibang malakas na pandiwa upang mapanatili ang sunod-sunod na magkakalapit ngunit hindi magkaparehong pandiwa sa tulang Hebreo.
- source_word: וְחָלְפָה
  choice: tinagos
  rationale: Sa kontekstong ito, malamang na inilalarawan ng pandiwa ang pagdaan o pagbaon nang lampas sa sentido. Ang “tinagos” ay natural ngunit hindi nagdaragdag ng tahasang “tagos sa kabila.”
- source_word: רַקָּתוֹ
  choice: ang sentido nito
  rationale: Ang “sentido” ang karaniwan at tiyak na tawag sa gilid ng ulo na tinutukoy rito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang maiikling linyang patula, ang paralelismo ng dalawang kamay, at ang mabilis na pagkakasunod-sunod ng mararahas na pandiwa. Ginamit ang “nito” para kay Sisera upang maiwasan ang malabong sunod-sunod na “niya” sa mga kilos ni Jael.
