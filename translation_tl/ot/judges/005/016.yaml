translation_notes:
  register: Makabagong Filipino Tagalog na patula ngunit madaling maunawaan. Pinanatili ang retorikal na tanong, ang larawang pastoral, at ang matalinghagang “pagsisiyasat ng puso.” Inilagay ang pananda ng talababa sa mismong salitang may leksikal na kalabuan.
