base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: tl
  text: Bakit ka nanatili sa gitna ng mga kulungan ng tupa upang pakinggan ang mga sipol para sa mga kawan? Sa mga pangkat[a] ni Ruben ay may malalalim na pagsisiyasat ng puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa mga batis ni Ruben.” Ang salitang Hebreo ay maaaring tumukoy sa mga pagkakahati o pangkat, o sa mga daluyan ng tubig o batis.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Tuwirang tanong ito tungkol sa dahilan ng hindi pagkilos ni Ruben; likas at tiyak ang “Bakit” sa modernong Tagalog.
- source_word: יָשַׁבְתָּ
  choice: ka nanatili
  rationale: Maaaring mangahulugang umupo, manirahan, o manatili ang pandiwa. Sa konteksto ng pagsaway sa hindi pakikibaka, mas malinaw at natural ang “nanatili” nang hindi inaalis ang diwa ng pananatili sa lugar.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: sa gitna ng mga kulungan ng tupa
  rationale: Ang tradisyonal at malamang na kahulugan sa kontekstong pastoral ay mga kulungan ng tupa; tumutugma ito sa kasunod na pagbanggit sa mga kawan.
- source_word: לִשְׁמֹעַ
  choice: upang pakinggan
  rationale: Ipinahahayag ng pawatas ang layunin. Ang “pakinggan” ay natural sa Tagalog para sa sinasadyang pakikinig sa isang tunog.
- source_word: שְׁרִקוֹת עֲדָרִים
  choice: mga sipol para sa mga kawan
  rationale: Ang שְׁרִקוֹת ay mga sipol o tunog na pantawag, at ang עֲדָרִים ay mga kawan. Ipinahihiwatig ng “para sa” na ang mga sipol ay pantawag sa mga hayop, nang hindi tahasang nagdaragdag ng mga pastol sa teksto.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: Sa mga pangkat ni Ruben
  rationale: Maaaring tumukoy ang פְּלַגּוֹת sa mga pagkakahati o pangkat. Ang “mga pangkat” ay malinaw sa ordinaryong mambabasa at angkop sa tribong nag-aatubili, habang inilalagay sa talababa ang tunay na alternatibong “mga batis.”
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: malalalim na pagsisiyasat ng puso
  rationale: Pinananatili ng “pagsisiyasat ng puso” ang matalinghagang panloob na pagsusuri, at ipinahahayag ng “malalalim” ang diin ng גְּדוֹלִים sa natural at marangal na Tagalog.
