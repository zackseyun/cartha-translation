base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: tl
  text: Nanatili ang Gilead sa ibayo ng Jordan; at ang Dan—bakit ito nanatili sa piling ng mga barko?[a] Ang Asher ay naupo sa baybayin ng dagat at nanatili sa mga daungan nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bakit ito namalagi sa piling ng mga barko?” Ang pandiwang Hebreo ay maaaring mangahulugang “manirahan” o “pansamantalang mamalagi.”
    reason: lexical_alternative
  - marker: b
    text: O “sa mga look/bukana nito.” Ang salitang Hebreo ay tumutukoy sa mga siwang o pasukan at, sa kontekstong ito ng baybayin, malamang na nangangahulugang mga daungan, look, o bukana.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: ang Gilead
  rationale: Pinanatili ang pangalang heograpiko-tribal; sa konteksto, kumakatawan ito sa mga taong nasa Gilead nang hindi tahasang dinaragdagan ang Hebreo ng 'mga Gileadita.'
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: sa ibayo ng Jordan
  rationale: Likas at marangal na pananalitang Filipino para sa kabilang panig ng Jordan, ayon sa pananaw ng nagsasalita.
- source_word: שָׁכֵן
  choice: nanatili
  rationale: Saklaw nito ang paninirahan o pananatili at, sa awit na nanunumbat, ipinahihiwatig din ang hindi pagsama sa labanan.
- source_word: וְדָן
  choice: at ang Dan
  rationale: Pinanatili ang pangalang pantribo; ginamit ang pantukoy para maging natural sa Filipino.
- source_word: לָמָּה
  choice: bakit
  rationale: Tuwirang pinanatili ang retorikal na tanong.
- source_word: יָגוּר
  choice: nanatili
  rationale: Ang pandiwa ay maaaring mangahulugang manirahan o pansamantalang mamalagi. Ang 'nanatili' ay natural sa Filipino at nagpapanatili sa di-tiyak na tagal habang naihahatid ang himig ng pagsaway.
- source_word: אֳנִיּוֹת
  choice: mga barko
  rationale: Karaniwang makabagong tawag sa mga sasakyang-dagat; walang idinagdag na espesipikong uri.
- source_word: אָשֵׁר
  choice: ang Asher
  rationale: Pinanatili ang pangalang pantribo at ginamitan ng pantukoy para sa natural na daloy.
- source_word: יָשַׁב
  choice: naupo
  rationale: Pinananatili ang matingkad na literal na larawan ng pag-upo at kawalang-kilos sa tulang mapanumbat.
- source_word: לְחוֹף יַמִּים
  choice: sa baybayin ng dagat
  rationale: Natural na Filipino para sa pampang o baybay; ang pangmaramihang Hebreong 'mga dagat' ay maaaring idiomatikong tumukoy sa katubigan o baybayin.
- source_word: מִפְרָצָיו
  choice: mga daungan nito
  rationale: Sa kontekstong pandagat, ang mga siwang o pasukan sa baybay ay malamang na mga look, bukana, o daungan; malinaw ang 'daungan' ngunit itinala ang alternatibo sa talababa.
- source_word: יִשְׁכּוֹן
  choice: nanatili
  rationale: Inihahatid ang kahulugang tumira o manatili at ang paralelismong nagbibigay-diin sa hindi pagkilos.
