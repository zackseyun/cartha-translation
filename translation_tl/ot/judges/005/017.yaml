translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Pinanatili ang retorikal na pagsaway at ang paralelismo ng tatlong tribo. Ang mga panghalip na “ito/nito” ay tumutukoy sa tribong pinangalanan, kaya iniiwasan ang di-kinakailangang pagtatalaga ng kasarian.
