  terminology: Ang “mga bagong diyos,” “kalasag,” at “sibat” ay wasto, malinaw, at angkop sa rehistrong patula. Napananatili ng talababa ang mahalagang gramatikal na ambigwidad ng pambungad na pandiwa at ang leksikal/sintaktikong hirap ng ikalawang sugnay.
