base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: tl
  text: Pumili sila ng mga bagong diyos[a]; noon ay nagkaroon ng digmaan sa mga tarangkahan ng mga bayan.[b] May nakita bang kalasag o sibat sa gitna ng apatnapung libo sa Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Pumili siya” o “Pumili ang isa ng mga bagong diyos.” Isahan ang pandiwang Hebreo, ngunit karaniwang inuunawa rito na kolektibong tumutukoy ito sa Israel.
    reason: alternative_reading
  - marker: b
    text: Mahirap tiyakin ang Hebreo sa linyang ito. Maaari ring isalin, “noon ay may labanan sa mga tarangkahan ng mga bayan,” o katulad nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: Pumili sila
  rationale: Bagaman pangatlong panauhang panlalaking isahan ang anyo ng pandiwa, pinakamalamang na di-tiyak o kolektibo ang paksa nito sa konteksto—ang Israel o ang bayan. Ang maramihang “sila” ay natural sa Tagalog, habang ipinaliliwanag sa talababa ang pormal na isahang anyo.
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: mga bagong diyos
  rationale: Tumutukoy ang parirala sa mga bagong sinasambang diyos, hindi sa Diyos ng Israel. Tuwiran at malinaw sa modernong Tagalog ang “mga bagong diyos.”
- source_word: אָז
  choice: noon
  rationale: Ipinahahayag nito ang panahong kasunod o kaugnay ng pagpili sa mga bagong diyos; maikli at angkop sa anyong patula ang “noon.”
- source_word: לָחֶם שְׁעָרִים
  choice: umabot ang digmaan sa mga pintuang-bayan
  rationale: Siksik at mahirap ang Hebreo. Ipinahahayag ng salin na ang labanan ay nasa mismong mga tarangkahan ng mga pamayanan, habang iniiwasan ang di-natural na literal na anyo. Nananatili sa talababa ang kawalang-katiyakan.
- source_word: מָגֵן
  choice: kalasag
  rationale: Karaniwan at tiyak na katawagan sa sandatang pananggalang.
- source_word: אִם יֵרָאֶה
  choice: May nakita bang
  rationale: Natural na retorikal na tanong sa Tagalog na nagpapahiwatig na walang nakitang sandata.
- source_word: וָרֹמַח
  choice: o sibat
  rationale: Ang “sibat” ang malinaw at karaniwang katumbas ng sandatang tinutukoy.
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: sa gitna ng apatnapung libo
  rationale: Ipinakikita ng “sa gitna ng” ang pangkat na kinabibilangan o pinaghahanapan, at natural itong pakinggan sa Tagalog.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Pinananatili ang pambansa at panlipunang saklaw ng pahayag sa payak na modernong Tagalog.
theological_decisions:
- issue: Paksa ng pambungad na pandiwa
  choice: 'Ang Israel o ang bayan bilang kolektibong paksa: “Pumili sila ng mga bagong diyos.”'
  alternative: “Pumili siya ng mga bagong diyos” o “Pumili ang isa ng mga bagong diyos”; maaari ring ipalagay sa gramatika na Diyos ang paksa, ngunit hindi ito ang pinakamalamang sa konteksto.
  rationale: Ang konteksto ay tumutuligsa sa pagtalikod ng Israel at inilalarawan ang kasunod na kapahamakan. Hindi angkop sa konteksto na sabihing ang Diyos ng Israel ang pumili ng “mga bagong diyos.” Gayunman, hindi ikinukubli ang isahang anyo ng pandiwa at inilalahad ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at patulang daloy ng awit. Ginamit ang “pintuang-bayan” upang malinaw na tumukoy sa mga tarangkahan ng mga pamayanan, at inilagay sa mga talababa ang tunay na gramatikal at leksikal na kawalang-katiyakan.
