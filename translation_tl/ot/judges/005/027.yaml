base_translation:
  language: en
  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: tl
  text: Sa pagitan ng kanyang mga paa, siya’y napaluhod, bumagsak, at nahandusay; sa pagitan ng kanyang mga paa, siya’y napaluhod, bumagsak; kung saan siya napaluhod, doon siya bumagsak—napuksa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa paanan niya.” Mas literal ang “sa pagitan ng kanyang mga paa.”
    reason: lexical_alternative
  - marker: b
    text: O “wasak” o “lubusang napuksa.” Ang salitang Hebreo ay naglalarawan sa kanya bilang ganap na dinaig o napuksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: sa pagitan ng kanyang mga paa
  rationale: Pinananatili ang kongkretong larawan at pag-uulit ng Hebreo. Posible rin ang mas idyomatikong “sa paanan niya,” ngunit hindi nito ganap na naihahatid ang literal na puwesto.
- source_word: כָּרַע
  choice: bumagsak
  rationale: Sa tagpong ito ng kamatayan, ipinahihiwatig ng pandiwa ang pagluhod, pagyuko, o pagbulusok pababa. Ang “bumagsak” ay natural at hindi nagpapahiwatig ng kusang paggalang.
- source_word: נָפַל
  choice: nalugmok
  rationale: Karaniwang nangangahulugang “nahulog” o “bumagsak.” Ginamit ang “nalugmok” upang mapanatili sa Filipino ang pagkakaiba nito sa כָּרַע at maipakita ang tuluyang pagbagsak.
- source_word: שָׁכָב
  choice: nahandusay
  rationale: Inihahatid ang maikli at matinding larawan ng pagkalatag ng katawan sa lupa.
- source_word: בַּאֲשֶׁר ... שָׁם
  choice: kung saan ... doon
  rationale: Natural na katumbas sa Filipino na pinananatili ang magkatugmang diin ng lokasyon sa Hebreo.
- source_word: שָׁדוּד
  choice: walang buhay
  rationale: Sa konteksto, ang pasibong anyo ay naglalarawan kay Sisera bilang ganap na napuksa o nalipol. Ang “walang buhay” ay natural para sa taong napatay, bagaman mas tuwirang tumutukoy sa bunga kaysa sa literal na ideya ng pagkawasak.
