  text: מַ֥יִם שָׁאַ֖ל חָלָ֣ב נָתָ֑נָה בְּ/סֵ֥פֶל אַדִּירִ֖ים הִקְרִ֥יבָה חֶמְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/025.yaml
  text: He asked for water[a]; she gave milk[b]. In a bowl fit for nobles she brought him curds.
translation:
  language: tl
  text: Humingi siya ng tubig; gatas ang ibinigay niya. Sa mangkok ng mga maharlika[b], inihain niya ang namuong gatas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mantikilya” o “krema”; ang salitang Hebreo ay tumutukoy sa isang malinamnam na produktong gatas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mangkok na angkop sa mga maharlika” o “mangkok ng mga makapangyarihan”; literal na “mangkok ng mga mararangal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: tubig
  rationale: Karaniwang literal na kahulugan; pinananatili ang paghahambing sa gatas na ibinigay kay Sisera.
- source_word: שָׁאַל
  choice: humingi
  rationale: Likas na salin ng Qal perfect na nangangahulugang humingi o humiling ng isang bagay.
- source_word: חָלָב
  choice: gatas
  rationale: Pangunahing kahulugan ng salita at malinaw na kaibahan sa tubig na hiningi.
- source_word: נָתָנָה
  choice: ibinigay niya
  rationale: Ipinahihiwatig ng anyong pambabae sa Hebreo na si Jael ang gumawa; natural sa Tagalog ang panghalip dahil malinaw siya sa konteksto.
- source_word: בְּסֵפֶל
  choice: sa mangkok
  rationale: Ang סֵפֶל ay sisidlang tulad ng mangkok o palanggana; 'mangkok' ang pinakanatural sa tagpong ito.
- source_word: אַדִּירִים
  choice: ng mga maharlika
  rationale: Pinananatili ang literal at bahagyang malabong construct na maaaring tumukoy sa mangkok na pag-aari, ginagamit, o angkop para sa mga maharlika o makapangyarihan.
- source_word: הִקְרִיבָה
  choice: inihain niya
  rationale: Ang Hiphil ng קרב ay 'inilapit/dinala'; sa konteksto ng pagtanggap sa panauhin, malinaw at natural ang 'inihain.'
- source_word: חֶמְאָה
  choice: namuong gatas
  rationale: Tumutukoy sa malinamnam na produktong gatas na maaaring unawaing curds, mantikilya, o krema; 'namuong gatas' ang malinaw na modernong katumbas habang inilalagay sa talababa ang ibang posibilidad.
