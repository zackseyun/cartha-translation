  source_fidelity: 'Tumpak ang salin sa Hebreo: ang tubig ay hiniling niya, gatas ang ibinigay niya, at ang חֶמְאָה ay inihain sa isang סֵפֶל na kaugnay ng mga אַדִּירִים. Napananatili ang maikling magkatimbang na anyo ng tula at ang hindi tahasang binanggit na mga referent na malinaw sa konteksto.'
