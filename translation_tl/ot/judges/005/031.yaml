base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: tl
  text: 'Gayon nawa malipol ang lahat ng iyong mga kaaway, Yahweh,

    ngunit ang mga umiibig sa kanya ay maging tulad ng araw

    kapag sumisikat ito sa buong lakas nito.


    At nagpahinga ang lupain nang apatnapung taon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: Gayon nawa malipol
  rationale: Ipinahahayag ng כֵּן ang paghahambing o konklusyon mula sa naunang awit, at ang diwang panawagan ng imperfect na יֹאבְדוּ ay likas na naihahatid ng “nawa.”
- source_word: כָל אוֹיְבֶיךָ
  choice: ang lahat ng iyong mga kaaway
  rationale: Tuwirang pinananatili ang ikalawang panauhang pantukoy sa mga kaaway ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְאֹהֲבָיו
  choice: ngunit ang mga umiibig sa kanya
  rationale: Ang “ngunit” ay malinaw na naghahatid ng pagsalungat sa kapalaran ng mga kaaway; pinananatili ng “sa kanya” ang biglang paglipat ng Hebreo mula sa tuwirang pakikipag-usap tungo sa ikatlong panauhan.
- source_word: כְּצֵאת הַשֶּׁמֶשׁ בִּגְבֻרָתוֹ
  choice: maging tulad ng araw kapag sumisikat ito sa buong lakas nito
  rationale: Ang יצא kaugnay ng araw ay tumutukoy sa paglitaw o pagsikat nito; ang “sa buong lakas nito” ay likas na Filipino para sa makapangyarihang ningning ng araw.
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: At nagpahinga ang lupain
  rationale: Sa paulit-ulit na pormula ng Mga Hukom, ang katahimikan ng lupain ay nagpapahiwatig ng pahinga at kapayapaan matapos ang labanan, hindi lamang kawalan ng ingay.
- source_word: אַרְבָּעִים שָׁנָה
  choice: nang apatnapung taon
  rationale: Karaniwang Filipino para sa tagal ng panahon.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Tinutukoy ng hulaping panghalip sa וְאֹהֲבָיו
  choice: “kanya” = Yahweh
  alternative: 'Gawing ikalawang panauhan: “mga umiibig sa iyo”'
  rationale: Ang hulaping ikatlong panauhang panlalaki ay natural na tumutukoy kay Yahweh. Pinananatili ng salin ang tensiyon ng paglipat mula “iyong mga kaaway” tungo sa “umiibig sa kanya.”
- issue: Diwa ng ikalawang sugnay
  choice: “ay maging tulad” bilang hangad o pagpapala
  alternative: “ay tulad” bilang payak na pahayag
  rationale: Bagaman walang hiwalay na pandiwa sa Hebreo sa ikalawang sugnay, ang hangad na ipinahayag ng naunang יֹאבְדוּ ay maaaring umabot sa katambal na sugnay. Ang “maging” ay naghahatid nito nang hindi nagdaragdag ng tiyak na paraan ng katuparan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang personal na pangalang “Yahweh,” ang paglipat mula ikalawa tungo sa ikatlong panauhan, at ang matalinghagang larawan ng araw. Walang talababa sapagkat malinaw na maihahatid sa pangunahing teksto ang mahahalagang pahiwatig ng Hebreo.
