  text: 'Noong araw na iyon, umawit sina Debora at Barak na anak ni Abinoam, at sinabi nila:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשַׁר
  choice: umawit si Debora
  rationale: Ang pandiwa ay pang-isahan at pambabae, kaya tahasang iniuugnay kay Debora. Ang payak na “umawit” ay hindi nagdaragdag ng salitang “awit,” na hindi hayag sa talata.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Karaniwang anyo ng pangalang Hebreo sa makabagong salin sa Filipino.
- source_word: וּבָרָק
  choice: kasama si Barak
  rationale: Ipinahihiwatig ng waw na kasama ring paksa si Barak, ngunit pinananatili ng pagkakasaling ito ang pambabaeng pang-isahang pandiwa na unang tumutukoy kay Debora.
- source_word: בֶּן אֲבִינֹעַם
  choice: na anak ni Abinoam
  rationale: Likas na salin sa Filipino ng patronimikong pariralang Hebreo.
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw na iyon
  rationale: Likas at marangal na panandang temporal sa Filipino para sa tiyak na araw ng pangyayari.
- source_word: לֵאמֹר
  choice: 'na sinasabi:'
  rationale: Malapit sa karaniwang Hebreong pambungad sa tuwirang pananalita o awit at malinaw na ipinakikilalang sumusunod ang mga salita.
