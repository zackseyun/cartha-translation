  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: tl
  text: “Sumpain ninyo ang Meroz,” sabi ng anghel ni Yahweh. “Sumpain ninyo nang lubos ang mga naninirahan doon, sapagkat hindi sila dumating upang tumulong kay Yahweh—upang tumulong kay Yahweh laban sa mga makapangyarihan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “anghel” ay maaari ring isaling “sugo.” Sa Hebreo, ang huling parirala ay literal na “sa pagtulong kay Yahweh … sa gitna ng mga makapangyarihan”; maaari rin itong unawain na “laban sa mga makapangyarihan” o “kasama ng magigiting na mandirigma.”
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: Sumpain ninyo / Sumpain ninyo nang lubos
  rationale: Ang inuulit na utos mula sa ארר ay isang matinding panawagan ng sumpa. Ipinahahayag ng “nang lubos” ang pagpapatindi ng infinitive absolute אָרוֹר nang hindi labis na nagpapaliwanag.
- source_word: מֵר֗וֹז
  choice: Meroz
  rationale: Pangngalang pantangi ito at isinalin sa pamamagitan ng transliterasyon; hindi na tinukoy sa salin kung ito ay bayan o ibang uri ng lugar.
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאָךְ na “anghel” o “sugo.” Ang “anghel ni Yahweh” ang natural na salin sa pormulang ito, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: יֹשְׁבֶ֑י/הָ
  choice: mga naninirahan doon
  rationale: Tumutukoy ang parirala sa mga taong naninirahan sa Meroz. Natural ito sa modernong Tagalog at iniiwasan ang malabong panghalip na “nito.”
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: sapagkat hindi sila dumating
  rationale: Ipinakikita ng כִּי ang dahilan ng sumpa; pinananatili rin ng “dumating” ang pandiwa ng tekstong Hebreo.
- source_word: לְ/עֶזְרַ֣ת יְהוָ֔ה
  choice: upang tumulong kay Yahweh
  rationale: Natural na Tagalog ito para sa nominal na idyomang Hebreo at pinananatili ang retorikal na pag-uulit ng parirala.
- source_word: בַּ/גִּבּוֹרִֽים
  choice: laban sa mga makapangyarihan
  rationale: Sa konteksto ng labanan, malinaw at makatwirang pagbasa ito sa mahirap na pariralang may בְּ. Gayunman, tunay na malabo ang sintaks, kaya nakatala sa talababa ang mas pormal na “sa gitna ng mga makapangyarihan” at ang posibleng “kasama ng magigiting na mandirigma.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Pag-unawa sa מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Hindi nilulutas ng salin kung ang tauhan ay isang nilikhang anghel, taong sugo, o natatanging pagpapakita ng Diyos. Pinananatili ang tradisyonal at pampanitikang anyo, at inilalahad ang leksikal na alternatibo sa talababa.
- issue: Kaugnayan ng בַּגִּבּוֹרִים sa pagtulong kay Yahweh
  choice: laban sa mga makapangyarihan
  alternative: sa gitna ng mga makapangyarihan / kasama ng magigiting na mandirigma
  rationale: Pinili ang pagbasa na ang mga makapangyarihan ang kalabang kinakaharap sa digmaan, ngunit hindi itinago ang sintaktikong kalabuan ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sapagkat” para sa estilong patula at solemne ng Awit ni Debora, ngunit nanatiling tuwiran at madaling maunawaan. Ang panipi at gitling ay nagpapalinaw sa pahayag at sa mariing pag-uulit.
