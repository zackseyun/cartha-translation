  text: בִּ/פְרֹ֤עַ פְּרָעוֹת֙ בְּ/יִשְׂרָאֵ֔ל בְּ/הִתְנַדֵּ֖ב עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/002.yaml
  text: When leaders took the lead in Israel, when the people volunteered, bless the LORD!
translation:
  language: tl
  text: 'Nang manguna ang mga pinuno sa Israel,

    nang kusang-loob na lumahok ang bayan,

    purihin ninyo si Yahweh!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: Nang manguna ang mga pinuno
  rationale: Ang pariralang Hebreo ay lubhang bihira at pinagtatalunan, ngunit sa konteksto ng awit at sa tradisyonal na pag-unawa, natural na ipinahahayag nito ang pamumuno ng mga pinuno. Pinananatili ng salin ang pag-uulit ng ugat sa pamamagitan ng “manguna” at “mga pinuno.”
- source_word: בְּהִתְנַדֵּב עָם
  choice: nang kusang-loob na lumahok ang bayan
  rationale: Ang hitpael ng נדב ay nagpapahiwatig ng kusang paghahandog ng sarili o boluntaryong pakikilahok; idinagdag ang “lumahok” upang maging malinaw at natural sa Filipino nang hindi nililimitahan ang gawa sa isang tiyak na uri ng paglilingkod.
- source_word: בָּרֲכוּ
  choice: purihin ninyo
  rationale: Bagaman karaniwang nangangahulugang “pagpalain,” kapag ang Diyos ang tuwirang layon, natural itong tumutukoy sa pagpuri o pagbibigay-puri sa kanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang pagtutumbas sa tetragrammaton sa tekstong Hebreo.
theological_decisions:
- issue: Ang paksa ng בִּפְרֹעַ פְּרָעוֹת
  choice: mga pinuno na nanguna
  alternative: maluwag na buhok / pagkakalag ng buhok o iba pang larawan ng paglaya
  rationale: Pinili ang malawak na kinikilalang pagbasa na kaugnay ng pamumuno, habang hindi dinaragdagan ang talata ng tiyak na tungkulin, ranggo, o doktrinal na implikasyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino, may maikling paralelismong angkop sa anyong patula ng Awit ni Debora. Ang “bayan” ay mas kolektibo at mas dignified kaysa “mga tao,” at ang pautos na maramihang “purihin ninyo” ay tumutugma sa Hebreo.
