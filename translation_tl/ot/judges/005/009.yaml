- from: Ang puso ko ay nasa mga pinuno ng Israel[a], na kusang-loob na naghandog ng kanilang sarili kasama ng bayan. Purihin ninyo si Yahweh!
  to: Ang puso ko ay para sa mga pinuno ng Israel[a], na kusang-loob na naghandog ng kanilang sarili sa gitna ng bayan. Purihin ninyo si Yahweh!
  rationale: Inayos ang idyomang Tagalog para maging natural habang pinananatili ang pagpapahayag ng pagkiling o paghanga sa “puso ko.” Pinalitan ang “kasama ng bayan” ng “sa gitna ng bayan” upang masaklaw ang kahulugan ng בָּעָם nang hindi ito pinapakitid sa mga kawal o ginagawang simpleng pagsama. Inayos din ang leksikal na alternatibo sa talababa.
