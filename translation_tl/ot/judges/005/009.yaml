  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: tl
  text: Ang puso ko ay para sa mga pinuno ng Israel[a], na kusang-loob na naghandog ng kanilang sarili sa gitna ng bayan. Purihin ninyo si Yahweh!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang puso ko ay para sa mga tagapagbigay ng kautusan ng Israel, yaong kusang-loob na naghandog ng kanilang sarili sa gitna ng bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: Ang puso ko
  rationale: Pinananatili ang konkretong idyomang Hebreo para sa panloob na pagkiling, katapatan, at paghanga ng mang-aawit.
- source_word: לְחוֹקְקֵי
  choice: ay nasa mga pinuno
  rationale: Ang anyo mula sa חקק ay maaaring tumukoy sa mga nagtatakda o nagpapasiya, kaya sa konteksto ay mga pinunong umaako ng pananagutan. Likas sa Filipino ang 'nasa' upang ipahayag ang pagkiling ng puso.
- source_word: יִשְׂרָאֵל
  choice: ng Israel
  rationale: 'Karaniwang ugnayang paari o pagkakakilanlan: ang mga pinuno ay mula sa Israel.'
- source_word: הַמִּתְנַדְּבִים
  choice: na kusang-loob na naghandog ng kanilang sarili
  rationale: Malinaw na ipinahahayag ang kusang pagbibigay ng sarili na nasa Hitpael participle ng נדב; mas angkop ito sa marangal at makatang rehistro kaysa sa mas administratibong 'nagboluntaryo.'
- source_word: בָּעָם
  choice: kasama ng bayan
  rationale: Pinananatili ang malawak na kahulugan ng עם bilang bayan at iniiwasang paliitin ito sa 'hukbo.' Ang בְּ ay nauunawaan bilang pakikilahok sa gitna o kasama ng bayan.
- source_word: בָּרֲכוּ
  choice: Purihin ninyo
  rationale: Bagaman literal na 'pagpalain,' kapag ang Diyos ang tuwirang layon, likas na ipinahahayag sa Filipino bilang pagpuri. Pinananatili ng 'ninyo' ang maramihang pautos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo; ang 'Yahweh' ang mas malapit na karaniwang rekonstruksiyon ng bigkas.
- issue: Kahulugan ng לְחוֹקְקֵי
  choice: mga pinuno
  alternative: mga tagapagpanukala ng kautusan
  rationale: Maaaring magpahiwatig ang ugat ng pag-uutos o pagtatakda, ngunit sa awit ay malamang na tumutukoy sa mga namumuno at umaako ng pananagutan. Inilalagay sa talababa ang mas literal na alternatibo upang mapanatili ang leksikal na lawak.
translation_notes:
  register: Makabago, marangal, at bahagyang makata ang Filipino. Pinanatili ang idyomang 'Ang puso ko' at ang masinsing diwa ng kusang paghahandog ng sarili; ginamit ang 'bayan' sa halip na mas makitid na 'mga kawal.'
