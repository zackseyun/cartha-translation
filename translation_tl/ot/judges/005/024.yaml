base_translation:
  language: en
  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: tl
  text: Pinakapinagpala sa mga babae si Jael[a], ang asawa ni Heber na Kenita; sa mga babaeng nasa tolda[b], siya ang pinakapinagpala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Higit na pinagpala kaysa sa mga babae si Jael … higit na pinagpala kaysa sa mga babaeng nasa tolda.” Ang konstruksiyong Hebreo ay maaaring isalin bilang “sa mga babae” o “higit kaysa sa mga babae.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “sa tolda.” Maaaring tumukoy ito sa mga babaeng kaugnay ng pamumuhay sa tolda, ngunit isahan ang salitang Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ / תְּבֹרָךְ
  choice: pinakapinagpala
  rationale: Ang Pual na anyo ng ברך, kasama ng paghahambing na may מִן, ay nagpapahayag ng pagiging lubhang pinagpala o pinupuri. Ang “pinakapinagpala” ay natural sa Tagalog at pinananatili ang matinding ποιetikong diin at pag-uulit.
- source_word: מִנָּשִׁים
  choice: sa mga babae
  rationale: Sa konstruksiyong ito, maaaring ipahiwatig ng מִן ang superlatibong “sa mga babae” o ang komparatibong “higit kaysa sa mga babae.” Pinili ang natural na superlatibong anyo sa pangunahing teksto, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: יָעֵל
  choice: Jael
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: ang asawa ni Heber na Kenita
  rationale: Malinaw at natural nitong pinananatili ang pagkakakilanlan kay Jael ayon sa kaniyang asawa at sa angkan nito.
- source_word: בָּאֹהֶל
  choice: nasa tolda
  rationale: Pinananatili ang larawan at isahan ng Hebreong “tolda,” nang hindi tahasang pinalalawak ito bilang maraming tolda o bilang isang tiyak na pangkat ng mga babaeng lagalag.
