  text: וַ/יִּשְׁמַ֥ע בָּלָ֖ק כִּ֣י בָ֣א בִלְעָ֑ם וַ/יֵּצֵ֨א לִ/קְרָאת֜/וֹ אֶל עִ֣יר מוֹאָ֗ב אֲשֶׁר֙ עַל גְּב֣וּל אַרְנֹ֔ן אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/גְּבֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: tl
  text: Nang marinig ni Balak na dumating si Balaam, lumabas siya upang salubungin siya sa lunsod ng Moab[a], na nasa hangganan ng Arnon, sa dulo ng hangganan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang lunsod ng Moab.” Maaaring tumukoy ang pariralang Hebreo sa isang tiyak at kilalang lunsod ng Moab o, sa mas pangkalahatang diwa, sa isang lunsod na sakop ng Moab.
    reason: lexical_alternative
  - marker: b
    text: O “sa dulo ng nasasakupan.” Sa ilang konteksto, ang salitang Hebreo para sa “hangganan” ay maaari ring mangahulugang “nasasakupan” o “teritoryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nang marinig
  rationale: Karaniwang kahulugan ng שׁמע ang “marinig.” Ang anyong “Nang marinig ni Balak” ay natural sa salaysay at hindi nagdaragdag kung kanino o paano niya nalaman ang balita.
- source_word: כִּי בָא בִלְעָם
  choice: na dumating si Balaam
  rationale: Inihahayag ng sugnay ang nilalaman ng narinig ni Balak. Sapat na sa Filipino ang aspektong “dumating” upang ipakitang nauna ang pagdating ni Balaam sa paglabas ni Balak.
- source_word: וַיֵּצֵא
  choice: lumabas siya
  rationale: Tuwirang katumbas ito ng יצא at pinananatili ang kilos ni Balak mula sa kaniyang kinaroroonan patungo kay Balaam.
- source_word: לִקְרָאתוֹ
  choice: upang salubungin ito
  rationale: Ipinahihiwatig ng לִקְרָאת ang pagkilos patungo sa isang tao upang makipagtagpo. Natural sa Filipino ang “salubungin,” nang hindi kinakailangang magpahiwatig ng magiliw na pagbati.
- source_word: אֶל עִיר מוֹאָב
  choice: sa lunsod ng Moab
  rationale: Bagaman maaaring literal na “patungo sa,” natural na ipinapahayag dito ng “sa” ang lugar ng pagsalubong matapos ang pandiwang “lumabas.” Maaaring tiyak na kilalang lunsod ang construct phrase, ngunit nananatiling posible ang di-tiyak na pagbasa kaya nilagyan ng talababa.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: na nasa hangganan ng Arnon
  rationale: Pinananatili nito ang heograpikong pahayag at ang karaniwang kahulugan ng גְבוּל bilang “hangganan,” nang hindi idinaragdag sa pangunahing teksto ang salitang “ilog,” na wala mismo sa Hebreo.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: sa dulo ng hangganan
  rationale: Ang קצה ay “dulo” o “kadulu-duluhan.” Inuulit ang “hangganan” gaya ng pag-uulit ng גְבוּל sa Hebreo, habang itinatala sa talababa ang posibleng kahulugang “nasasakupan.”
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinili ang “lunsod” at “hangganan” bilang malinaw at karaniwang mga salitang heograpiko. Ginamit ang “ito” para kay Balaam upang maging natural ang pagtukoy sa taong nabanggit na, at iniwasang gawing tahasang “Ilog Arnon” sa pangunahing teksto dahil pangalan lamang na Arnon ang nasa Hebreo.
