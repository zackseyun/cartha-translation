base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: tl
  text: Dumating ang Diyos kay Balaam nang gabi at sinabi sa kanya, “Kung dumating ang mga lalaki upang tawagin ka[a], bumangon ka at sumama sa kanila. Ngunit ang salita lamang na sasabihin ko sa iyo[b]—iyon ang gagawin mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang ipatawag ka.”
    reason: lexical_alternative
  - marker: b
    text: O “ang bagay lamang na ipahahayag ko sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Karaniwang salaysay na kahulugan ng בוא; hindi ginawang “nagpakita” sapagkat hindi tinukoy ng teksto ang paraan ng pagdating ng Diyos.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Pinananatili ang mismong katawagang אֱלֹהִים sa talatang ito at hindi ito ipinapalit sa “PANGINOON.”
- source_word: לַיְלָה
  choice: nang gabi
  rationale: Likas at malinaw na panandang pamanahon sa modernong Tagalog.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: Kung naparito ang mga lalaki upang tawagin ka
  rationale: Pinananatili ang kondisyon at ang literal na diwa ng קרא, habang natural ang “naparito” para sa layuning ipinahahayag ng sugnay.
- source_word: קוּם לֵךְ אִתָּם
  choice: bumangon ka at sumama sa kanila
  rationale: Ang “bumangon” ay kumakatawan sa קום, at ang “sumama sa kanila” ay natural na Tagalog para sa utos na humayo kasama nila.
- source_word: וְאַךְ
  choice: Ngunit ... lamang
  rationale: Magkasamang ipinahahayag ng “ngunit” at “lamang” ang pagsalungat at mahigpit na pagtatakda ng אַךְ.
- source_word: הַדָּבָר
  choice: ang salita
  rationale: Sa konteksto ng pandiwang “sasabihin,” ang “salita” ang pinakamalinaw na katumbas at pinananatili ang propetikong diin, bagaman maaari ring mangahulugang “bagay” o “utos.”
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: na sasabihin ko sa iyo
  rationale: Ang anyong di-ganap ay natural na may hinaharap na diwa rito dahil tumutukoy ito sa ipahahayag pa ng Diyos.
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: iyon ang gagawin mo
  rationale: Ang “iyon” ay inilagay sa unahan upang mapanatili ang diin ng Hebreong inuunang layon.
theological_decisions:
- issue: Tawag sa Diyos sa talatang ito
  choice: ang Diyos
  alternative: ang PANGINOON
  rationale: אֱלֹהִים ang nasa Hebreong teksto, hindi ang pangalang YHWH; pinananatili ang pagkakaibang ito sa halip na itugma sa mga kalapit na talata.
- issue: Saklaw ng pahintulot kay Balaam
  choice: Pahintulutan siyang sumama, ngunit gawin lamang ang sasabihin ng Diyos
  alternative: Ipakahulugang lubos at walang pasubali ang pahintulot
  rationale: Pinananatili ng “Ngunit ... lamang” ang tahasang limitasyon sa pahintulot, nang hindi nilulutas ang tensiyon nito sa kasunod na salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang “Diyos,” “bumangon,” at “sumama” sa halip na mga makalumang anyo. Ang gitling na em dash sa huling sugnay ay nagpapanatili sa diin ng Hebreong inuunang layon.
