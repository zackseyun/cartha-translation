  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: tl
  text: Ngayon, manatili rin kayo rito ngayong gabi, pakiusap, upang malaman ko kung ano pa ang sasabihin sa akin ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung ano pa ang sasalitain sa akin ni Yahweh.”
    reason: Alternatibong salin ng pandiwang “magsalita”; ang pangunahing teksto ay mas likas na Tagalog sa kontekstong tumutukoy sa mensaheng tatanggapin ni Balaam.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Nagsisilbing panandang pandiskurso na nagpapakilala sa susunod na tagubilin ni Balaam; natural sa makabagong Tagalog ang “Ngayon.”
- source_word: שְׁבוּ נָא
  choice: pakiusap, manatili
  rationale: Ang יָשַׁב ay may idyomatikong diwang “manatili” sa kontekstong ito, hindi lamang literal na “umupo”; ipinahahayag ng נָא ang magalang na pakiusap.
- source_word: בָזֶה
  choice: rito
  rationale: Lokativong pagtukoy sa kinaroroonan ng nagsasalita; ang “rito” ay natural dahil malapit ang lugar kay Balaam.
- source_word: גַּם אַתֶּם
  choice: rin kayo
  rationale: 'Pinananatili ang diwang pandagdag: ang delegasyong ito, gaya ng nauna, ay pinatutuloy nang magdamag.'
- source_word: הַלָּיְלָה
  choice: ngayong gabi
  rationale: Tumutukoy sa gabing darating; malinaw at natural itong temporal na pahayag sa Tagalog.
- source_word: וְאֵדְעָה
  choice: upang malaman ko
  rationale: Ipinahahayag ng cohortative ang layunin ng pananatili nila, kaya ang “upang” ay angkop kaysa payak na panghinaharap.
- source_word: מַה יֹּסֵף
  choice: kung ano pa
  rationale: Ang konstruksyon sa יסף ay tumutukoy sa karagdagan o iba pang sasabihin; pinananatili ng “kung ano pa” ang bukas na saklaw nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na banal na pangalang YHWH sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: דַּבֵּר עִמִּי
  choice: ang sasabihin sa akin
  rationale: Bagaman maaaring literal na “magsasalita sa akin/kasama ko,” nakatuon dito ang parirala sa mensaheng ipahahayag kay Balaam; natural sa Tagalog ang “sasabihin sa akin.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pakiusap” upang ipakita ang magalang na נָא nang hindi ginagawang utos na marahas, at “manatili” upang maiwasan ang sobrang literal na “umupo.”
