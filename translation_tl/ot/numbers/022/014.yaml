  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: tl
  text: Kaya bumangon ang mga pinuno ng Moab at pumunta kay Balak, at sinabi nila, “Tumanggi si Balaam na sumama sa amin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: mga pinuno ng Moab
  rationale: Ang שָׂרִים ay tumutukoy sa mga taong may mataas na katungkulan o awtoridad; mas natural at sapat na malawak sa modernong Tagalog ang “mga pinuno” kaysa “mga prinsipe.”
- source_word: וַיָּקֻמוּ
  choice: tumindig
  rationale: Pinananatili nito ang literal na kilos ng pagbangon bago umalis, habang nananatiling marangal at malinaw sa Tagalog.
- source_word: מֵאֵן
  choice: tumanggi
  rationale: Tuwirang ipinahahayag ng pandiwa ang tahasang pagtanggi ni Balaam.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: sumama sa amin
  rationale: Natural na Tagalog para sa Hebreong pariralang literal na “lumakad/pumunta kasama namin.”
