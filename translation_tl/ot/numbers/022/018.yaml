    rationale: Ang “upang” ay karaniwang nagpapahayag ng layunin sa Tagalog; ang Hebreo ay nagsasaad ng hangganan ng magagawa ni Balaam—kahit maliit o malaki. Ang “sa paggawa ng” ay mas malinaw at idiomatiko.
