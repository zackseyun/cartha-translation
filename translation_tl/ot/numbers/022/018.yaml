base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: tl
  text: Sumagot si Balaam sa mga lingkod ni Balak, “Kahit ibigay sa akin ni Balak ang kanyang bahay na punô ng pilak at ginto, hindi ko kayang lumampas sa salita ni Yahweh na aking Diyos[a][b] sa paggawa ng maliit man o malaking bagay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lumampas sa bibig ni Yahweh na aking Diyos,” isang idyoma para sa paglampas o paglabag sa sinabi niya.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “suwayin ang utos ni Yahweh na aking Diyos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר
  choice: Sumagot si Balaam
  rationale: Ang magkasamang pandiwang Hebreo ay karaniwang pormula sa pagsasalaysay na nagpapakilala ng tugon; natural sa modernong Tagalog ang payak na “sumagot.”
- source_word: עַבְדֵי בָלָק
  choice: mga lingkod ni Balak
  rationale: Tumutukoy ito sa mga tauhan o sugo ni Balak. Pinananatili ng “mga lingkod” ang lawak ng עבד nang hindi ipinapalagay na sila ay mga alipin o pormal na opisyal.
- source_word: אִם יִתֶּן לִי בָלָק
  choice: Kahit ibigay sa akin ni Balak
  rationale: 'Bagaman literal na kondisyon ang אִם, retorikal at konsesibo ang puwersa nito sa konteksto: hindi magbabago ang sagot kahit napakalaki ng ialok.'
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: ang kanyang bahay na punô ng pilak at ginto
  rationale: Pinananatili nito ang konkretong larawan ng isang bahay na punô ng napakalaking kayamanan.
- source_word: לֹא אוּכַל
  choice: hindi ko kayang
  rationale: Ipinahahayag ng יכל ang kawalan ng kakayahan, hindi lamang ang pagtangging gawin ang isang bagay.
- source_word: לַעֲבֹר אֶת פִּי
  choice: lumampas sa sinabi
  rationale: Literal itong “lumampas sa bibig,” isang idyoma para sa paglampas o pagsuway sa ipinahayag na salita. Ang “sinabi” ay malinaw sa Tagalog habang pinananatili ang diwa ng pananalita, sa halip na agad itong paliitin sa “utos.”
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh na aking Diyos
  rationale: Tuwirang isinasalin ang banal na pangalan at ang unang panauhang pag-aari sa pahayag ni Balaam, nang walang idinadagdag na implikasyong teolohikal.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: upang gumawa ng maliit man o malaking bagay
  rationale: Pinananatili ang Hebreong tambalang “maliit o malaki,” na saklaw ang anumang bagay, gaano man kaliit o kalaki.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Hayagang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalang pantangi ng isang titulo.
- issue: Puwersa ng pahayag ni Balaam
  choice: hindi niya kayang lumampas sa sinabi ni Yahweh
  alternative: ayaw niyang suwayin ang utos ni Yahweh
  rationale: Pinananatili ng salin ang pandiwang nagsasaad ng kakayahan at ang idyoma tungkol sa paglampas sa ipinahayag na salita. Hindi nito ginagawang simpleng kusang pagtanggi ang ipinahayag na kawalan ng kakayahan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lingkod” sa halip na mas teknikal na “opisyal,” at pinanatili ang konkretong larawan ng bahay na punô ng pilak at ginto. Ang “maliit man o malaking bagay” ay natural na Tagalog na nagpapanatili sa Hebreong merismo.
