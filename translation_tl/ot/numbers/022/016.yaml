base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: tl
  text: 'Dumating sila kay Balaam at sinabi sa kanya, “Ganito ang sabi ni Balak na anak ni Zipor: Nakikiusap ako, huwag kang mag-atubiling pumunta sa akin.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־בִּלְעָם
  choice: Pumunta sila kay Balaam
  rationale: Ang בוא ay karaniwang ‘pumarito/dumating,’ ngunit sa salaysay na nakatuon sa mga sugo, natural sa modernong Tagalog ang ‘pumunta ... kay Balaam’ para sa paglapit nila sa kanya.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: at sinabi sa kanya
  rationale: Tuwirang inilalarawan ang pagpapahayag ng mensahe sa taong kausap.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Pinananatili ang pormal na pormula ng mensahero sa natural at dignified na Tagalog.
- source_word: בָּלָק בֶּן־צִפּוֹר
  choice: Balak na anak ni Zipor
  rationale: Isinasalin nang natural ang ugnayang construct at tinutumbasan sa Tagalog ang mga pangalang pantangi.
- source_word: אַל־נָא
  choice: Nakikiusap ako, huwag
  rationale: Ang אַל ay pagbabawal at ang נָא ay nagpapahayag ng magalang o mariing pakiusap; malinaw na naihahatid ng pariralang ito ang dalawang sangkap.
- source_word: תִמָּנַע מֵהֲלֹךְ
  choice: kang tumangging pumunta
  rationale: Ang מנע na may infinitive ay tumutukoy sa pagpipigil o pagtangging gawin ang kilos. Sa konteksto, ang ‘tumangging pumunta’ ay natural at malinaw sa Tagalog.
- source_word: אֵלָי
  choice: sa akin
  rationale: Payak na katumbas ng panandang patungo na may hulaping unang panauhan.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw, magalang, at may bahagyang pormal na himig na angkop sa pormula ng mensahero. Hindi kailangan ang talababa: kayang panatilihin ng ‘pumunta sa akin’ ang karaniwang kahulugan ng הלך at natural din ito sa Tagalog.'
