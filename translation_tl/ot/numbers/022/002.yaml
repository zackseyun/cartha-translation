lexical_decisions:
- source_word: וַיַּרְא
  choice: Nakita
  rationale: Ang wayyiqtol ng ראה ay nagpapatuloy sa salaysay. Natural sa Tagalog ang aspektong kontemplatibo na “nakita” para sa pangyayaring ito, nang hindi nagdaragdag ng tahasang panandang gaya ng “ngayon.”
- source_word: בָּלָק
  choice: Balak
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalang pantangi.
- source_word: בֶּן צִפּוֹר
  choice: na anak ni Zipor
  rationale: Likas na paraan sa Tagalog upang ipahayag ang ugnayang angkan sa Hebreong construct chain.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Ipinahahayag nito ang kabuuan ng kasunod na tuwirang layon sa natural at malinaw na Tagalog.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Ang aspektong kontemplatibo ay angkop sa gawaing natapos na bago ito nakita ni Balak; hindi kailangang magdagdag ng katumbas ng English past perfect.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pamantayang anyo sa Tagalog para sa pangalan ng bayan o bansang Israel.
- source_word: לָאֱמֹרִי
  choice: sa mga Amoreo
  rationale: Pinananatili ng “sa” ang malawak na ugnayang ipinahahayag ng ל, samantalang ang maramihang “mga Amoreo” ay natural na Tagalog para sa kolektibong katawagang etniko.
