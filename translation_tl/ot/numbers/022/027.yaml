  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: tl
  text: Nang makita ng babaeng asno ang anghel ni Yahweh[a], humiga ito sa ilalim ni Balaam. Nagalit si Balaam at hinampas niya ng tungkod ang asno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: babaeng asno
  rationale: Ang אָתוֹן ay tiyak na babaeng asno. Likas at malinaw sa modernong Tagalog ang “babaeng asno,” at napapanatili nito ang impormasyong gramatikal at leksikal ng Hebreo.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאָךְ ng “sugo” o “anghel,” ngunit malinaw sa salaysay na isang makalangit na sugo ang tinutukoy; kaya “anghel” ang pinakamalinaw na pangunahing salin, habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַתִּרְבַּץ
  choice: humiga
  rationale: Karaniwang kahulugan ng רבץ ang humiga o dumapa. Ang “humiga” ay tuwiran at hindi nagdaragdag ng ideya ng biglang pagbagsak na hindi tahasang sinasabi ng teksto.
- source_word: תַּחַת בִּלְעָם
  choice: sa ilalim ni Balaam
  rationale: Tuwirang pinananatili nito ang kahulugan ng תַּחַת at ang larawan ng asnong humiga sa ilalim ng nakasakay na si Balaam.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: Nagalit si Balaam
  rationale: Ang Hebreong idyoma ay literal na naglalarawan sa pagliyab ng galit. Ang “nagalit” ay natural at malinaw sa Tagalog nang hindi labis na pinatitindi ang sinabi.
- source_word: וַיַּךְ
  choice: hinampas
  rationale: Ang נכה ay nangangahulugang humampas o manakit. Sa konteksto ng paggamit ng tungkod laban sa hayop, natural at tiyak ang “hinampas.”
- source_word: בַּמַּקֵּל
  choice: ng tungkod
  rationale: Ang מַקֵּל ay maaaring tungkod o pamalo. Ang “tungkod” ay akma sa isang naglalakbay at hindi ipinapalagay na ang gamit ay ginawa lamang bilang pamalo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng מַלְאָךְ sa pariralang מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Tunay ang leksikal na saklaw na “sugo,” ngunit ipinakikita ng konteksto na hindi karaniwang taong sugo ang nilalang. Pinipili ang “anghel” sa pangunahing teksto at pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ito” para sa asno sapagkat hindi karaniwang minamarkahan ng panghalip sa Tagalog ang kasarian ng hayop; hayagang pinanatili naman ang kasarian sa pariralang “babaeng asno.”
