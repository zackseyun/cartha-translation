  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang matingkad na larawang Hebreo ng pagdila, ngunit idinagdag ang “hanggang maubos” upang maging malinaw at likas ang ipinahihiwatig na ganap na paglamon. Ginamit ang “matatandang pinuno” para sa malinaw na tungkulin ng mga elder at “kapulungan” para sa kolektibong sambayanan.
