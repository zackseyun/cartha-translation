base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: tl
  text: Sinabi ng Moab sa mga nakatatanda ng Midian, “Ngayon, didilaan ng kapulungang ito ang lahat ng nasa paligid natin[a], gaya ng pagdila ng baka sa luntiang halaman sa bukid[b].” Nang panahong iyon, si Balak na anak ni Zipor ang hari ng Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lalamunin ng kapulungang ito ang lahat ng nasa paligid natin.” Literal na “didilaan” ang pandiwang Hebreo; pinananatili sa teksto ang larawan ng paghahambing.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “luntiang pananim sa bukid” o “damo sa bukid.” Mas malawak kaysa damo lamang ang saklaw ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹאָב
  choice: Moab
  rationale: Pinanatili ang pambansang pangalan bilang personipikadong nagsasalita, ayon sa anyong isahan ng Hebreo.
- source_word: זִקְנֵי מִדְיָן
  choice: matatandang pinuno ng Midian
  rationale: Ang זִקְנֵי ay mga elder na may tungkuling mamuno; nililinaw ng “matatandang pinuno” ang diwa sa likas na modernong Filipino.
- source_word: יְלַחֲכוּ
  choice: didilaan hanggang maubos
  rationale: Pinananatili ang literal na larawan ng pagdila at ipinahahayag din ang resultang pagkaubos na likas sa konteksto.
- source_word: הַקָּהָל
  choice: kapulungang ito
  rationale: Tumutukoy sa nagkakatipong sambayanan ng Israel; pinananatili ng “kapulungan” ang kolektibong diwa nang hindi ito ginagawang katawagang pansimbahan.
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: ang lahat ng nasa paligid natin
  rationale: Likas na salin ng literal na “lahat ng ating kapaligiran,” na tumutukoy sa lahat ng nasa kalapit na lugar.
- source_word: כִּלְחֹךְ הַשּׁוֹר
  choice: gaya ng pagdila ng baka
  rationale: Pinananatili ang paghahambing at ang pag-uulit ng ugat na לחך. Ang “baka” ay natural at hindi labis na nagtatakda ng kasarian o gamit ng hayop.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: luntiang halaman sa bukid
  rationale: Ang יֶרֶק ay malawak na tumutukoy sa berdeng pananim o halaman, hindi lamang sa damo.
- source_word: וּבָלָק בֶּן צִפּוֹר מֶלֶךְ לְמוֹאָב בָּעֵת הַהִוא
  choice: Nang panahong iyon, si Balak na anak ni Zipor ang hari ng Moab
  rationale: Inihaharap ito bilang impormasyong nagbibigay ng tagpuan, hindi lamang bilang kasunod na pangyayari.
