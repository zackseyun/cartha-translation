revisions:
- from: Sinabi ng Moab sa matatandang pinuno ng Midian, “Ngayon, didilaan hanggang maubos ng kapulungang ito ang lahat ng nasa paligid natin[a], gaya ng pagdila ng baka sa luntiang halaman sa bukid[b].” Nang panahong iyon, si Balak na anak ni Zipor ang hari ng Moab.
  to: Sinabi ng Moab sa mga nakatatanda ng Midian, “Ngayon, didilaan ng kapulungang ito ang lahat ng nasa paligid natin[a], gaya ng pagdila ng baka sa luntiang halaman sa bukid[b].” Nang panahong iyon, si Balak na anak ni Zipor ang hari ng Moab.
  rationale: Inalis ang “hanggang maubos” upang hindi magdagdag ng ipinahihiwatig na resulta sa pangunahing teksto. Pinalitan ang “matatandang pinuno” ng “mga nakatatanda” para sa mas tuwirang katumbas ng “elders,” at inayos ang sintaks upang maging mas natural sa modernong Filipino. Iningatan ang mga talababa at inilagay ang mga angkla sa mga salitang ipinaliliwanag.
