translation_notes:
  register: Gumamit ng natural at marangal na modernong Tagalog. Pinanatili ang tradisyonal ngunit madaling maunawaang “mga anak ni Israel,” at nilinaw sa talababa ang gamit nito bilang pambansang katawagan. Ang “sa tapat ng Jerico” ay nagbibigay ng kinakailangang heograpikong linaw nang hindi nagpapasok ng teolohikal na interpretasyon.
