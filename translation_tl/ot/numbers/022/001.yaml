  terminology: Ang “mga anak ni Israel” ay wastong literal na katapat ng בני ישראל at ang talababa ay sapat na nagpapaliwanag sa pambansang gamit nito. Wasto at pare-pareho ang mga pangalang Moab, Jordan, at Jerico. Ang mga talababa ay nakaangkla nang malinaw sa mga kaugnay na salita o parirala.
