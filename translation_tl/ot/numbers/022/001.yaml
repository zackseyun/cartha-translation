  source_fidelity: 'Tumpak na naihahatid ng salin ang sunod-sunod na pagkilos: umalis/naglakbay ang בני ישראל at nagkampo sila sa kapatagan ng Moab. Ang “sa kabila ng Jordan” ay pinananatiling relatibo, gaya ng מֵעֵבֶר לַיַּרְדֵּן, at ang “sa tapat ng Jerico” ay angkop na paglalahad ng heograpikong ugnayang ipinahihiwatig ng pangwakas na יְרֵחוֹ. Walang idinagdag na doktrinal na pagpapakahulugan.'
