  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְב֣וֹת מוֹאָ֔ב מֵ/עֵ֖בֶר לְ/יַרְדֵּ֥ן יְרֵחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: tl
  text: Pagkatapos, naglakbay ang mga anak ni Israel[a] at nagkampo sa kapatagan ng Moab, sa kabila ng Jordan[b], sa tapat ng Jerico[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita.” Sa Hebreo, literal itong “mga anak ni Israel,” isang karaniwang katawagan sa buong bansa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa ibayo ng Jordan” o “sa kabilang panig ng Jordan.” Ang pananalitang ito ay nakabatay sa heograpikong pananaw ng tagapagsalaysay.
    reason: lexical_alternative
  - marker: c
    text: Ang Jerico ang palatandaang tumutukoy sa lokasyon ng kapatagan ng Moab sa silangang panig ng Jordan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: naglakbay
  rationale: Ang pandiwang נסע sa salaysay ng paglalakbay sa ilang ay tumutukoy sa pag-alis ng kampo upang magpatuloy sa paglalakbay. Likas at malinaw sa modernong Tagalog ang “naglakbay” sa kontekstong ito.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang anyong Hebreo na literal na “mga anak ni Israel,” habang nauunawaan bilang kolektibong tawag sa bansang Israel at hindi lamang sa mga tuwirang anak ng patriyarka.
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Tuwirang ipinahahayag ng חנה ang pagtigil at pananatili sa isang kampo. Ang “nagkampo” ay pangkaraniwan at malinaw sa kasalukuyang Tagalog.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: sa kapatagan ng Moab
  rationale: Ang עֲרָבוֹת ay tumutukoy sa malalawak at patag na lupaing steppe. Ang “kapatagan ng Moab” ay malinaw, natural, at angkop bilang pangalan ng rehiyon.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Ipinahahayag ng parirala ang lugar sa kabilang panig ng Jordan mula sa heograpikong pananaw ng tagapagsalaysay. Pinananatili ng “sa kabila” ang relatibong pananaw na iyon nang hindi ito nilulutas nang tahasan.
- source_word: יְרֵחוֹ
  choice: sa tapat ng Jerico
  rationale: 'Nagsisilbing palatandaang heograpiko ang Jerico: ang kampo ay nasa kapatagan ng Moab sa silangang panig ng Jordan, katapat ng Jerico. Ginagawang malinaw ng “sa tapat” ang ugnayang heograpiko na ipinahihiwatig ng maikling pariralang Hebreo.'
