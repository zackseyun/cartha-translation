base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: tl
  text: “Narito[a], tinakpan ng bayang lumabas sa Ehipto ang ibabaw ng lupain. Halika ngayon at sumpain mo sila para sa akin. Baka makaya kong labanan sila at palayasin sila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “tinakpan ang mata ng lupain,” isang idyoma para sa pagtatakip sa nakikitang ibabaw ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Likas at marangal na panawag-pansin sa Filipino na nagpapanatili sa agarang diin ng Hebreo.
- source_word: הָעָם
  choice: ang bayan
  rationale: Tumutukoy sa Israel bilang isang kolektibong pangkat; ang “bayan” ay natural sa kontekstong ito.
- source_word: הַיֹּצֵא מִמִּצְרַיִם
  choice: na lumabas sa Ehipto
  rationale: Ginagawang malinaw na sugnay na panuring ang participle upang tukuyin ang bayan sa pamamagitan ng paglabas nila sa Ehipto.
- source_word: וַיְכַס
  choice: tinakpan
  rationale: Inilalarawan ang pagkalat ng kolektibong bayan sa nakikitang ibabaw ng lupain; natural ang pang-isahang anyo kasunod ng “bayan.”
- source_word: עֵין הָאָרֶץ
  choice: ang ibabaw ng lupain
  rationale: Ang literal na “mata ng lupain” ay idyomang tumutukoy sa nakikitang ibabaw nito; malinaw sa modernong Filipino ang “ibabaw ng lupain.”
- source_word: עַתָּה לְכָה
  choice: Kaya pumarito ka ngayon
  rationale: Pinananatili ang agarang paglipat tungo sa pakiusap at ang puwersa ng panawagang kumilos.
- source_word: קָבָה
  choice: sumpain
  rationale: Tuwirang ipinahahayag ang pagbigkas o pagpapataw ng sumpa.
- source_word: לִּי
  choice: para sa akin
  rationale: Ipinapakita ang kapakinabangan o layuning kumilos si Balaam alang-alang kay Balak.
- source_word: אֹתוֹ
  choice: sila
  rationale: Bagaman pang-isahan sa anyong Hebreo dahil sa kolektibong “bayan,” pangmaramihan ang natural na pagtukoy sa mga taong bumubuo rito sa Filipino.
- source_word: אוּלַי אוּכַל
  choice: Baka makaya ko
  rationale: Pinananatili ang di-tiyak na pag-asa o posibilidad na ipinahahayag ng Hebreo.
- source_word: לְהִלָּחֶם בּוֹ
  choice: labanan sila
  rationale: Natural at tuwirang katumbas ng pakikipagdigma laban sa kolektibong bayan.
- source_word: וְגֵרַשְׁתִּיו
  choice: at palayasin
  rationale: Ipinahahayag ang layuning itaboy ang bayan mula sa lupain; likas sa Filipino na hindi na ulitin ang layong “sila.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Narito” bilang natural na panawag-pansin at “ibabaw ng lupain” upang ihatid ang kahulugan ng idyomang Hebreo nang hindi nagiging malabo.
