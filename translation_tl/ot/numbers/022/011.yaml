    rationale: Ang Hebreo ay pang-abay na “ngayon,” na nagmamarka ng agarang paglipat sa utos; ang “Kaya” ay nagdaragdag ng ugnayang konklusibo.
  - severity: low
    issue: Hindi tahasang binanggit ang layon sa “palayasin.”
    rationale: Ang וְגֵרַשְׁתִּיו ay may pronominal na layon na tumutukoy sa bayan. Ang pag-ulit ng “sila” ay higit na malinaw at tapat sa Filipino.
  - severity: low
    issue: Ang “pumarito ka” ay mas mataas ang rehistro kaysa kinakailangan.
    rationale: Ang “Halika ngayon” ay mas likas sa modernong Filipino habang pinananatili ang panawagang לְכָה.
