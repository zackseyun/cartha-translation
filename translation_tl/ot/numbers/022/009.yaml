  text: וַ/יָּבֹ֥א אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֕אמֶר מִ֛י הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: tl
  text: Pagkatapos, dumating ang Diyos kay Balaam at sinabi, “Sino ang mga lalaking ito na kasama mo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Ang Qal wayyiqtol ng בוא ay nagsasaad ng kasunod na pangyayari sa salaysay; likas na katumbas dito ang “dumating,” nang hindi dinaragdagan ng ideya ng pagpasok.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Ang anyong pandiwang isahan at ang konteksto ng salaysay ay tumutukoy sa Diyos na personal na kumausap kay Balaam.
- source_word: אֶל בִּלְעָם
  choice: kay Balaam
  rationale: Ang אֶל ay nagpapahayag ng direksiyon patungo sa isang tao; ang “kay Balaam” ang natural na anyo sa Tagalog.
- source_word: וַיֹּאמֶר
  choice: at sinabi
  rationale: Karaniwang panimula ito sa tuwirang pananalita. Ang “sinabi” ay malinaw at natural sa makabagong Tagalog.
- source_word: מִי
  choice: Sino
  rationale: Humihingi ang panghalip na pananong ng pagkakakilanlan ng mga tao.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: ang mga lalaking ito
  rationale: Tumutukoy ang parirala sa tiyak na mga lalaking sugo na naroon; pinananatili ng “ito” ang malapit na demonstratibong diwa.
- source_word: עִמָּךְ
  choice: na kasama mo
  rationale: Ang עִם na may hulaping panghalip ay nagsasaad ng pagsama o pakikisama; natural sa tanong ang “na kasama mo.”
- source_word: וַ
  choice: Pagkatapos
  rationale: Ang panimulang waw sa wayyiqtol ay nagsusulong sa pagkakasunod-sunod ng salaysay; malinaw itong ipinahahayag ng “Pagkatapos.”
theological_decisions:
- issue: Tinutukoy ng אֱלֹהִים sa salaysay tungkol kay Balaam
  choice: ang Diyos
  alternative: isang diyos / isang banal na nilalang
  rationale: Bagaman maaaring magkaroon ng ibang gamit ang אֱלֹהִים, ang pandiwang isahan at ang konteksto rito ay tumutukoy sa Diyos na kumausap kay Balaam. Hindi na dinaragdagan ng salin ang pagkakakilanlang ibinibigay ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lalaking ito” upang tumpak na tukuyin ang mga lalaking sugo, at pinanatiling tuwiran at payak ang tanong.
