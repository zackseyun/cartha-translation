  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: tl
  text: Sinabi ng anghel ni Yahweh[a] kay Balaam, “Sumama ka sa mga lalaki. Ngunit ang salitang sasabihin ko sa iyo—iyon lamang ang sasabihin mo.” Kaya sumama si Balaam sa mga pinuno ni Balak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ ng sugo o anghel; sa salaysay na ito, isang makalangit na nilalang ang humaharap kay Balaam, kaya natural ang “anghel.” Pinanatili ang personal na pangalang Yahweh para sa יְהוָה.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: Sumama ka sa mga lalaking ito
  rationale: Ang לֵךְ עִם ay pahintulot o utos na sumama, at ang הָאֲנָשִׁים ay tumutukoy sa tiyak na mga lalaking kasama ni Balaam. Idinagdag ang “ito” bilang likas na pantukoy sa Tagalog ayon sa konteksto.
- source_word: וְאֶפֶס
  choice: Ngunit ... lamang
  rationale: Ipinahihiwatig ng parirala ang mahigpit na limitasyon sa ibinigay na pahintulot; malinaw itong naipapahayag sa Tagalog sa tambalang “Ngunit ... lamang.”
- source_word: הַדָּבָר
  choice: ang salita
  rationale: Sa konteksto ng pagsasalita, ang דָּבָר ay natural na “salita,” habang pinananatili ang ugnayan nito sa magkasunod na anyo ng pandiwang דבר.
- source_word: אֲדַבֵּר אֵלֶיךָ
  choice: sasabihin ko sa iyo
  rationale: Ang anyo ay may hinaharap na diwa sa kontekstong ito. Ang “sasabihin ko sa iyo” ay natural at tumpak sa modernong Tagalog.
- source_word: אֹתוֹ תְדַבֵּר
  choice: iyon lamang ang sasabihin mo
  rationale: 'Ang iniharap na layon na אֹתוֹ ay binibigyang-diin: iyon, at wala nang iba, ang dapat sabihin ni Balaam. Pinananatili ng ayos na ito ang diin nang hindi nagdaragdag ng salitang “dapat.”'
- source_word: שָׂרֵי בָלָק
  choice: mga pinuno ni Balak
  rationale: Ang שָׂרִים ay maaaring mga pinuno, opisyal, o prinsipe. Ang “mga pinuno” ay natural at hindi nagpapahiwatig na mga anak sila ng hari.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Pinili ang “anghel” dahil makalangit at higit-sa-taong nilalang ang inilalarawan sa salaysay, ngunit kinikilala sa talababa ang leksikal na posibilidad na “sugo.”
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang em dash upang mapanatili ang mariing pag-uulit ng Hebreo: ang salitang ibibigay kay Balaam, iyon lamang ang sasabihin niya.'
