  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: tl
  text: Labis na natakot ang Moab sa bayan dahil napakarami nila; at kinilabutan[a] ang Moab dahil sa mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasuklam” o “lubhang nabagabag.” Maaaring magpahiwatig ang pandiwang Hebreo ng pagkasuklam, pagkayamot o pagkabagabag, at takot na may kasamang pangingilabot; sa kontekstong ito, nangingibabaw ang takot na may bahid ng pagkasuklam.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Israel” ay tumutukoy sa mga Israelita.
    reason: clarification
lexical_decisions:
- source_word: וַיָּגָר ... מְאֹד
  choice: labis na natakot
  rationale: Ipinahahayag ng pandiwang גּוּר sa kontekstong ito ang matinding takot o pangamba, at pinatitindi ito ng מְאֹד. Likas at malinaw sa modernong Filipino ang “labis na natakot.”
- source_word: מִפְּנֵי
  choice: sa / dahil sa
  rationale: Bagaman literal na tumutukoy sa pagiging “mula sa harap ng,” ginagamit ito rito bilang idyoma para sa sanhi ng takot at pagkikilabot.
- source_word: הָעָם
  choice: bayang iyon
  rationale: Ang pangngalan ay kolektibong tumutukoy sa Israel bilang isang bayan. Ginagawang malinaw ng “iyon” ang tinutukoy sa salaysay nang hindi ito ginagawang isang karaniwang pulutong lamang.
- source_word: כִּי רַב הוּא
  choice: dahil napakarami nila
  rationale: Ang רַב ay tumutukoy rito sa malaking bilang ng bayan. Kahit isahan ang anyong Hebreo dahil kolektibo ang pangngalan, likas sa Filipino ang pangmaramihang “nila.”
- source_word: וַיָּקָץ
  choice: kinilabutan
  rationale: Maaaring magpahayag ang קוץ ng pagkasuklam, matinding pagkabagabag, o takot na may kasamang pangingilabot. Ang “kinilabutan” ay nagpapanatili sa visceral at may-takot na puwersa ng salita nang hindi lubusang inaalis ang bahid ng pagkasuklam.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malinaw at pormal na sinasalamin nito ang literal na pariralang “mga anak ni Israel,” habang nananatiling nauunawaan sa Filipino.
- source_word: מוֹאָב
  choice: Moab
  rationale: Karaniwang transliterasyon ng pangalan ng lupain at bayan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Pinanatili ang kolektibong “bayan,” ang matinding antas ng takot, at ang leksikal na tensiyon sa וַיָּקָץ sa pamamagitan ng “kinilabutan” at isang talababa.
