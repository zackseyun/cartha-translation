base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: tl
  text: Sinabi ni Balaam sa Diyos, “Si Balak na anak ni Zipor, na hari ng Moab, ay nagpadala sa akin[a]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, nagpasundo sa akin. Mas literal, “nagpadala sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang simpleng “Sinabi” sa kontekstong ito.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa mga saling Tagalog.
- source_word: אֶל הָאֱלֹהִים
  choice: sa Diyos
  rationale: Bagaman maaaring maramihan ang anyo sa ibang konteksto, malinaw sa kasalukuyang salaysay na ang Diyos na nakipag-usap kay Balaam ang tinutukoy.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: si Balak na anak ni Zipor
  rationale: Natural at tapat na ipinapahayag sa Tagalog ang ugnayang construct sa pamamagitan ng “anak ni.”
- source_word: מֶלֶךְ מוֹאָב
  choice: na hari ng Moab
  rationale: Ang pariralang ito ay paglalarawan sa tungkulin ni Balak; malinaw na ikinakabit ito sa kaniya sa pamamagitan ng “na.”
- source_word: שָׁלַח אֵלַי
  choice: Nagpadala sa akin
  rationale: Pinananatili nito ang literal na direksiyon ng אֵלַי, “sa akin,” nang hindi ipinapalagay sa mismong pandiwa kung tao o mensahe ang ipinadala; ipinahihiwatig ng kasunod na talata ang nilalaman.
theological_decisions:
- issue: Tinutukoy ng הָאֱלֹהִים
  choice: ang Diyos na kausap ni Balaam
  alternative: isang diyos o mga diyos sa pangkalahatan
  rationale: Itinuturo ng agarang konteksto sa nag-iisang Diyos na kumausap kay Balaam sa naunang talata, nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Makabagong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang tutuldok dahil ipinagpapatuloy sa susunod na talata ang mensaheng ipinadala ni Balak.
