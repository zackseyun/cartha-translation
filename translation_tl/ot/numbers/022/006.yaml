base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: tl
  text: Kaya ngayon, pumarito ka sana at sumpain mo para sa akin ang bayang ito,[a] sapagkat mas malakas sila kaysa sa akin. Baka sakaling makaya ko silang salakayin[b] at palayasin mula sa lupain, sapagkat alam kong ang sinumang pagpalain mo ay pinagpala, at ang sinumang sumpain mo ay isinumpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo para sa “bayan” ay isahang pangngalang kolektibo; maaari rin itong isalin na “mga taong ito.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang panghalip na tumutukoy sa bayan ay isahang kolektibo; sa Filipino, likas na gamitin ang maramihang “sila” para sa mga taong bumubuo nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinananatili ang ugnayan sa naunang pahayag at ang agarang paglipat sa pakiusap ni Balak.
- source_word: לְכָה נָּא
  choice: pumarito ka sana
  rationale: Ipinahahayag ng pautos kasama ng נָא ang mariing pakiusap; natural at magalang sa makabagong Filipino ang “sana” sa kontekstong ito.
- source_word: אָרָה לִּי
  choice: sumpain mo para sa akin
  rationale: Ang אָרָה ay tumutukoy sa pagbigkas o pagpapataw ng sumpa; pinananatili ng “para sa akin” ang interes ni Balak na ipinahahayag ng לִּי.
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang “bayan” ay likas na pangngalang kolektibo sa Filipino at napapanatili ang isahang anyo ng Hebreo nang hindi nagiging asiwa ang pananalita.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: sapagkat mas malakas sila kaysa sa akin
  rationale: Ipinahahayag ang paghahambing at banta ng lakas; ginamit ang maramihang panghalip ayon sa likas na pagtukoy sa kolektibong bayan sa Filipino.
- source_word: אוּלַי אוּכַל נַכֶּה בּוֹ
  choice: Baka sakaling makaya natin silang salakayin
  rationale: Pinananatili ang kawalang-katiyakan ng אוּלַי at ang diwa ng kakayahang manaig. Isinaad sa talababa ang kapansin-pansing paglipat ng Hebreo mula unang panauhang isahan tungo sa maramihan.
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: at palayasin sa lupain
  rationale: Ang גרש ay “magpalayas” o “magtaboy”; ang “lupain” ay nagpapanatili ng teritoryal na diwa ng הָאָרֶץ.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: ang sinumang pagpalain mo ay pinagpapala
  rationale: Ang “sinuman” ay natural na katumbas ng pangkalahatang sugnay na may אֲשֶׁר, at pinananatili ng “pinagpapala” ang pasibo o resultang diwa ng participle.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: at ang sinumang sumpain mo ay sinusumpa
  rationale: Pinananatili ang mahigpit na paralelismo sa naunang sugnay at ang pasibong diwa ng יוּאָר.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayang ito” upang mapanatili ang kolektibong isahan ng Hebreo, ngunit ginamit ang “sila” kung iyon ang mas natural sa Filipino. Iniwasan ang mga salitang makaluma gaya ng “paroon” at “lipulin,” at hindi ginawang tiyak na “talunin” ang mas malawak na נכה (“salakayin/hampasin”).
