  naturalness: Malinaw at marangal ang pangkalahatang Filipino. Mas natural at mas tumpak ang resultative na “pinagpala” at “isinumpa” kaysa sa mga anyong progresibong “pinagpapala” at “sinusumpa” sa pangwakas na paralelismo.
  terminology: Ang “bayang ito,” “sumpain,” at “lupain” ay angkop. Pinananatili ng “bayang ito” ang kolektibong isahan, samantalang ang “sila” ay likas na pagtukoy sa mga tao sa Filipino.
