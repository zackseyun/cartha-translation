id: NUM.22.31
reference: Numbers 22:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: tl
  text: Pagkatapos, inalis ni Yahweh ang takip sa mga mata ni Balaam[a]. Nakita niya ang anghel ni Yahweh[b] na nakatayo sa daan, na may hawak na nakabunot na espada. Yumukod si Balaam at nagpatirapa, na nakasubsob ang mukha sa lupa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “binuksan ni Yahweh ang mga mata ni Balaam.” Literal na tumutukoy ang pandiwang Hebreo sa pag-aalis ng takip.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sugo ni Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, ang parirala ay may kongkretong diwang “sa kanyang mukha”; inilalarawan nito ang pagpapatirapa nang nakaharap sa lupa.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיְגַל
  choice: inalis ... ang takip
  rationale: Pinananatili nito ang kongkretong diwa ng גלה na ‘alisan ng takip’ habang malinaw na ipinahihiwatig na inalis ni Yahweh ang humahadlang sa paningin ni Balaam.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Ang מַלְאָךְ ay maaaring mangahulugang ‘sugo,’ ngunit sa tagpong ito ang ‘anghel’ ang natural na tawag sa makalangit na nilalang; pinananatili sa talababa ang leksikal na alternatibo.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: nakatayo sa daan
  rationale: Tuwirang ipinapakita ang nakapirming tindig ng anghel sa dinaraanan ni Balaam.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: na may hawak na nakabunot na espada
  rationale: Natural na Filipino ito para sa larawang ang espada ay nakabunot at nasa kamay niya, nang hindi dinaragdagan ang kahulugan.
- source_word: וַיִּקֹּד
  choice: yumukod
  rationale: Inilalarawan nito ang unang kilos ng pagyuko nang hindi labis na tinutukoy ang eksaktong posisyon ng katawan.
- source_word: וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: nagpatirapa, na nakasubsob ang mukha sa lupa
  rationale: Pinananatili ang pisikal na kilos at kongkretong larawan ng mukha sa lupa, sa halip na ipakahulugan agad ang kilos bilang pagsamba.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang ‘Yahweh’ ay nagpapanatili rito sa halip na palitan ng titulong ‘PANGINOON.’
- issue: Kung ang וַיִּשְׁתַּחוּ ay dapat tahasang isaling ‘sumamba’
  choice: nagpatirapa
  alternative: sumamba
  rationale: Maaaring tumukoy ang pandiwa sa pagsamba, ngunit ang talata ay malinaw na naglalarawan ng pisikal na tugon ni Balaam. Ang ‘nagpatirapa’ ay nagpapanatili sa kilos at sa teolohikal na puwang ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “espada” bilang karaniwang salitang nauunawaan ng mga mambabasa, at iniwasan ang tahasang “sumamba” upang hindi lutasin ang ambiguwidad ng kilos na inilalarawan ng Hebreo.
