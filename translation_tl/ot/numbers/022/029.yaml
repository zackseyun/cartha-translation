translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “asnong babae” upang tahasang katawanin ang kasariang nasa salitang Hebreo, at “ginawa mo akong katawa-tawa” upang mapanatili ang diin sa kahihiyang nadama ni Balaam. Inilagay ang [c] pagkatapos ng buong banta sapagkat tumutukoy ito sa alternatibong pagbasa ng pangwakas na sugnay.
