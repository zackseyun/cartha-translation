  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: tl
  text: At sinabi ni Balaam sa babaeng asno[a], “Dahil ginawa mo akong katatawanan![b] Kung may tabak lamang sana sa kamay ko, papatayin sana kita ngayon din.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, tiyak na babaeng asno ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inalipusta mo ako” o “pinaglaruan mo ako.” Ang pandiwang Hebreo ay maaaring tumukoy sa mapang-abuso o mapanuyang pakikitungo na nagpapahiya sa isang tao.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “napatay na sana kita ngayon din.” Ipinahahayag ng Hebreo ang isang hangaring salungat sa aktuwal na kalagayan at ang agarang balak ni Balaam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng Hebrew wayyiqtol nang hindi labis na binibigyang-kahulugan ang pagkakasunod-sunod.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: לָאָתוֹן
  choice: sa asnong babae
  rationale: Tiyak na babaeng asno ang אָתוֹן; natural at malinaw sa modernong Filipino ang “asnong babae.”
- source_word: כִּי
  choice: Dahil
  rationale: Ipinakikilala nito ang dahilan ng galit na tugon ni Balaam; ang “Dahil” ay likas sa tuwirang pananalita.
- source_word: הִתְעַלַּלְתְּ בִּי
  choice: ginawa mo akong katawa-tawa
  rationale: Ipinahahayag ng Hitpael ng עלל sa kontekstong ito ang mapang-abuso o mapanuyang pakikitungo na humihiya o ginagawang mangmang ang isang tao.
- source_word: לוּ
  choice: Kung ... lamang sana
  rationale: Nagpapahayag ng hangaring salungat sa kasalukuyang katotohanan; likas itong anyo sa Filipino.
- source_word: יֶשׁ חֶרֶב בְּיָדִי
  choice: may tabak ... sa kamay ko
  rationale: Pinananatili ang larawang nasa Hebrew tungkol sa tabak na nasa kamay, sa halip na gawing payak na pagmamay-ari lamang.
- source_word: חֶרֶב
  choice: tabak
  rationale: Tuwirang katumbas na marangal at madaling maunawaang salita sa kontekstong biblikal.
- source_word: כִּי עַתָּה
  choice: ngayon din
  rationale: Ipinakikita ang agarang banta ni Balaam—papatayin niya ang asno sa mismong sandaling iyon.
- source_word: הֲרַגְתִּיךְ
  choice: papatayin kita
  rationale: Kasama ng לוּ at ng di-totoong kondisyon, ipinahahayag nito ang agarang gagawin sana ni Balaam; mas natural sa Filipino kaysa sa mas retrospektibong “napatay na sana kita.”
