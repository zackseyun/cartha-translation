revisions:
- from: At sinabi ni Balaam sa asnong babae[a], “Dahil ginawa mo akong katawa-tawa![b] Kung may tabak lamang sana sa kamay ko, papatayin kita ngayon din.”[c]
  to: At sinabi ni Balaam sa babaeng asno[a], “Dahil ginawa mo akong katatawanan![b] Kung may tabak lamang sana sa kamay ko, papatayin sana kita ngayon din.”[c]
  rationale: Pinalitan ang mga di-idiomatikong parirala ng mas likas na modernong Filipino. Idinagdag ang “sana” sa “papatayin sana kita” upang malinaw na maipahayag ang contrary-to-fact na hangarin na minamarkahan ng לוּ, nang hindi ipinipilit ang mas retrospektibong pagbasa na “napatay na sana.”
