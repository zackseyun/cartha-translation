  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּקַּ֤ח בָּלָק֙ אֶת בִּלְעָ֔ם וַֽ/יַּעֲלֵ֖/הוּ בָּמ֣וֹת בָּ֑עַל וַ/יַּ֥רְא מִ/שָּׁ֖ם קְצֵ֥ה הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: tl
  text: Kinaumagahan, isinama ni Balak si Balaam at dinala niya ito paakyat sa Bamot-baal[a]. Mula roon ay nakita niya ang dulo ng sambayanan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa matataas na lugar ni Baal,” kung deskriptibong parirala ito at hindi pangalang-pook na Bamot-baal.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang pinakadulong bahagi lamang ng Israel ang makikita mula roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Kinaumagahan
  rationale: Likas itong panandang panahon sa makabagong Tagalog at malinaw na ipinagpapatuloy ang pagkakasunod-sunod ng salaysay nang hindi pilit na isinasalin ang pormulang Hebreo.
- source_word: וַיִּקַּח
  choice: isinama
  rationale: Sa konteksto, dinala ni Balak si Balaam na kasama niya patungo sa ibang lugar. Mas natural sa Tagalog ang “isinama” kaysa sa literal na “kinuha,” habang pinananatili ang diwang ipinahahayag ng לָקַח.
- source_word: וַיַּעֲלֵהוּ
  choice: paakyat
  rationale: Ipinahihiwatig ng Hiphil ng עָלָה na pinapunta o dinala niya si Balaam sa mataas na lugar. Kasama ng “isinama,” malinaw na naipapahayag ng “paakyat” ang sanhi at direksiyon ng kilos.
- source_word: בָּמוֹת בָּעַל
  choice: Bamot-baal
  rationale: Dito ay malamang na pangalang-pook ang parirala, kaya tinumbasan ito sa pamamagitan ng transliterasyon. Pinananatili sa talababa ang posibleng deskriptibong pagbasa.
- source_word: וַיַּרְא
  choice: nakita niya
  rationale: Karaniwang kahulugan ng רָאָה ang “makita.” Hindi pinangalanan sa Hebreo ang simuno; pinananatili ng panghalip ang gayong anyo, bagaman sa konteksto ay malamang na si Balaam ang tinutukoy.
- source_word: מִשָּׁם
  choice: Mula roon
  rationale: Tuwirang ipinapahayag nito ang lugar na pinagmulan ng pagtanaw.
- source_word: קְצֵה הָעָם
  choice: ang dulo ng sambayanan
  rationale: Ang קָצֶה ay “dulo,” “gilid,” o “pinakahangganan.” Hindi tahasang sinasabi ng Hebreo na kampo ang nakita, kaya pinanatili ang “sambayanan” at ipinaliwanag sa talababa na ang nakikita ay ang nasa pinakadulong bahagi lamang.
theological_decisions:
- issue: Ang hindi tahasang pinangalanang simuno ng וַיַּרְא
  choice: Pinanatili bilang “niya” sa pangunahing teksto
  alternative: “Nakita ni Balaam”
  rationale: Bagaman malamang na si Balaam ang simuno ayon sa konteksto, hindi ito inuulit ng tekstong Hebreo. Ang panghalip ay nagpapanatili sa pormal na kalabuan nang hindi nagiging di-likas sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sambayanan” para sa עָם upang tukuyin ang sama-samang bayan ng Israel nang hindi idinaragdag ang salitang “kampo,” na wala sa Hebreo.
