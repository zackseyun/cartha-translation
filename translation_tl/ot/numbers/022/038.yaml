  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: tl
  text: Sinabi ni Balaam kay Balak, “Narito, nakarating na ako sa iyo ngayon. Talaga bang kaya kong magsabi ng anuman? Ang salitang ilalagay ng Diyos sa bibig ko, iyon ang sasabihin ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pansin at diin ng deiktikong pananalita, sa likas at marangal na modernong Tagalog.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: nakarating na ako sa iyo ngayon
  rationale: Likas na ipinapahayag sa Tagalog ang natapos na pagdating at ang agarang panahon na tinutukoy ng עַתָּה.
- source_word: הֲיָכוֹל אוּכַל
  choice: Talaga bang kaya kong
  rationale: Ang tanong at magkasunod na anyo ng pandiwa ay nagbibigay-diin sa kakayahan; ipinahahayag ito ng “talaga bang kaya kong” nang hindi pinapakinis ang retorikal na puwersa.
- source_word: דַּבֵּר מְאוּמָה
  choice: magsabi ng anuman
  rationale: Tumpak at likas na katumbas ng pagsasalita ng anumang bagay; kasama ng mariing tanong, naipahihiwatig ang “kahit ano man.”
- source_word: הַדָּבָר
  choice: ang salitang
  rationale: Pinananatili ang kongkretong pang-isahang “salita,” na sa konteksto ay ang pahayag na ibibigay ng Diyos.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: ilalagay ng Diyos sa bibig ko
  rationale: Pinananatili ang Hebreong metapora para sa pananalitang ibinibigay ng Diyos at natural pa rin itong nauunawaan sa Tagalog.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: iyon ang sasabihin ko
  rationale: Ang nauunang layon ay binibigyang-diin sa pamamagitan ng “iyon,” kaya malinaw na ang ibinigay na salita ang siya lamang niyang sasabihin nang hindi nagdaragdag ng hiwalay na salitang wala sa teksto.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang kasamang pandiwa ay pang-isahan at sa konteksto ay tumutukoy sa Diyos na nagbibigay kay Balaam ng sasabihin.
theological_decisions:
- issue: Pamamahala ng Diyos sa sasabihin ni Balaam
  choice: Inilalarawan ni Balaam na hindi siya malayang magsabi ng anuman kundi ang salitang inilalagay ng Diyos sa kanyang bibig.
  alternative: May kakayahan si Balaam na sabihin ang anumang nais niya ngunit kusang pinipili lamang niyang limitahan ang sarili.
  rationale: Ang mariing tanong tungkol sa kakayahan at ang nakadiing “iyon ang sasabihin ko” ay nagpapakita ng napipigilang propetikong pananalita. Pinananatili ng salin ang tensiyong ito nang hindi ipinapaliwanag ang eksaktong mekanismo ng inspirasyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Narito” sa halip na mas kolokyal na “Tingnan mo” upang mapanatili ang deiktikong diin at ang angkop na rehistro. Walang talababa dahil mailalahad nang tuwiran sa pangunahing teksto ang diin ng הֲיָכוֹל אוּכַל.
