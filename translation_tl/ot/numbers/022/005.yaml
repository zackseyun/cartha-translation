translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “Tingnan mo” para sa diin, gayundin ang tunay na kahirapan ng pariralang tumutukoy sa lupain at bayan. Ginamit ang “mensahero” sa diwang pantao at diplomatiko.
