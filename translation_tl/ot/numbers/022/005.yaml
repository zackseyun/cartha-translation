revisions:
- from: Kaya nagsugo siya ng mga mensahero kay Balaam na anak ni Beor, sa Petor, na nasa tabi ng Ilog[a], sa lupain ng mga anak ng kanyang bayan[b], upang tawagin siya. Sinabi niya, “Tingnan mo, may isang bayang lumabas mula sa Ehipto. Tingnan mo, natakpan nito ang ibabaw ng lupain[c], at naninirahan sila sa tapat ko.”
  to: 'At nagsugo siya ng mga mensahero kay Balaam na anak ni Beor, sa Petor, na nasa tabi ng Ilog[a], sa lupain ng mga anak ng kanyang bayan[b], upang tawagin siya at sabihin sa kanya: “Tingnan mo, may isang bayang lumabas mula sa Ehipto. Tingnan mo, natakpan nito ang ibabaw ng lupain[c], at ito ay naninirahan sa tapat ko.”'
  rationale: Iniuugnay ng rebisyon ang pagpapatawag kay Balaam sa mensaheng ipinadala sa kanya, alinsunod sa estruktura ng Hebreo. Pinalitan din ang maramihang panghalip ng isahang kolektibong panghalip upang mapanatili ang pagtukoy sa “bayan,” nang hindi isinasakripisyo ang natural na Tagalog.
