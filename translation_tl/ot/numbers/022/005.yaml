  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: tl
  text: 'At nagsugo siya ng mga mensahero kay Balaam na anak ni Beor, sa Petor, na nasa tabi ng Ilog[a], sa lupain ng mga anak ng kanyang bayan[b], upang tawagin siya at sabihin sa kanya: “Tingnan mo, may isang bayang lumabas mula sa Ehipto. Tingnan mo, natakpan nito ang ibabaw ng lupain[c], at ito ay naninirahan sa tapat ko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang Ilog”; malamang na ang Ilog Eufrates.
    reason: cross_reference
  - marker: b
    text: Maaari ring “sa lupain ng kanyang bayan.” Mahirap unawain ang pariralang Hebreo na “lupain ng mga anak ng kanyang bayan,” at hindi tiyak kung kanino tumutukoy ang “kanyang.”
    reason: alternative_reading
  - marker: c
    text: Sa literal, “natakpan nito ang mata ng lupain,” isang paglalarawan sa nakikitang ibabaw ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kaya nagsugo siya
  rationale: Isinusulong ng wayyiqtol ang salaysay; likas sa Tagalog ang “Kaya nagsugo siya” at naipapakita ang kaugnayan sa naunang pangyayari.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Mga taong sugo sa kontekstong diplomatiko ang tinutukoy, hindi mga anghel.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaam na anak ni Beor
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal at ang likas na pariralang “anak ni.”
- source_word: פְּתוֹרָה
  choice: sa Petor
  rationale: May panlaping patungo sa pangalan ng lugar, ngunit inilalarawan ng kasunod na sugnay ang kinaroroonan ni Balaam; sapat na bukas ang “sa Petor” sa dalawang himig.
- source_word: אֲשֶׁר עַל־הַנָּהָר
  choice: na nasa tabi ng Ilog
  rationale: Pinanatili ang literal na “Ilog” sa pangunahing teksto, habang inilagay sa talababa ang malamang na pagkakakilanlan dito bilang Eufrates.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: sa lupain ng mga anak ng kanyang bayan
  rationale: Pinanatili ang mahirap at di-tiyak na anyo ng Hebreo sa halip na tahimik na pakinisin bilang “sarili niyang bayan.”
- source_word: לִקְרֹא לוֹ
  choice: upang tawagin siya
  rationale: Tuwirang ipinahahayag ang layunin ng pagpapadala nang hindi pinatitindi bilang sapilitang pagpapatawag.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinanatili sa dalawang paglitaw ang panawag-pansing diin ng Hebreo sa natural na makabagong Tagalog.
- source_word: עַם יָצָא מִמִּצְרַיִם
  choice: may isang bayang lumabas mula sa Ehipto
  rationale: Ang “bayan” ay tumutukoy dito sa isang malaking pangkat ng tao, at ang “lumabas mula” ay tuwirang kumakatawan sa kilos at pinagmulan.
- source_word: כִסָּה אֶת עֵין הָאָרֶץ
  choice: natakpan nito ang ibabaw ng lupain
  rationale: Ang literal na “mata ng lupain” ay isang idyoma para sa nakikitang ibabaw; “ibabaw” ang malinaw at natural na katumbas sa Tagalog, habang itinatala sa talababa ang literal na larawan.
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: at naninirahan sila sa tapat ko
  rationale: Isahan sa gramatika ang kolektibong עַם at ang panghalip nito, ngunit likas sa Tagalog ang maramihang “sila” kapag ang tinutukoy ay isang bayan bilang mga tao.
