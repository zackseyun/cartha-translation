  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: tl
  text: Nang makita ng babaeng asno ang anghel ni Yahweh na nakatayo sa daan at may hawak na nakabunot na espada[a], lumihis ito mula sa daan at pumasok sa bukid. Kaya hinampas ni Balaam ang asno upang ibalik ito sa daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa kamay niya ang nakabunot niyang espada.”
    reason: Pinananatili ng alternatibo ang mas lantad na kayarian ng pariralang Hebreo; pareho nitong ipinahahayag na nabunot na ang espada at hawak ito ng anghel.
lexical_decisions:
- source_word: הָאָתוֹן
  choice: babaeng asno
  rationale: Tiyak na tumutukoy ang אָתוֹן sa isang babaeng asno; natural at malinaw sa modernong Tagalog ang “babaeng asno,” at naiiwasan ang hindi gaanong karaniwang “asna.”
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugang “sugo” o “anghel” ang מַלְאָךְ. Sa tagpong ito, ang nilalang na may nakabunot na espada ay malinaw na makalangit, kaya “anghel” ang pinakanatural na salin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: nakatayo sa daan
  rationale: Tuwirang inilalarawan ng participle ang puwesto ng anghel sa mismong daraanan; likas sa Tagalog ang “nakatayo sa daan.”
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: na may hawak na nakabunot na espada
  rationale: Pinananatili nito ang larawang ang espada ay nabunot na at nasa kamay ng anghel, gamit ang natural na ayos sa Tagalog.
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: lumihis ito sa daan
  rationale: Ipinapahayag ng נָטָה ang paglihis mula sa landas; maikli at idiomatiko ang “lumihis sa daan.”
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: pumunta sa bukid
  rationale: Konkretong katumbas ng שָׂדֶה sa tagpong ito ang “bukid,” at ipinahihiwatig ng konteksto ang pagpasok mula sa daan patungo roon.
- source_word: וַיַּךְ
  choice: hinampas
  rationale: Ang נכה ay nangangahulugang manakit o humampas. Hindi ipinapalagay ng salin na paulit-ulit ang kilos.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: upang ibalik ito sa daan
  rationale: Dahil lumihis na ang asno, natural na ipinapahayag ng “ibalik sa daan” ang layunin ni Balaam nang hindi nagdaragdag ng bagong pangyayari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng מַלְאַךְ sa pariralang מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: May leksikal na saklaw na “sugo” at “anghel” ang salita. Ang makalangit na anyo at nakabunot na espada sa salaysay ay sumusuporta sa “anghel,” habang pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “babaeng asno” para mapanatili ang kasarian ng hayop nang hindi umasa sa di-karaniwang salitang “asna.” Ang mga panghalip na “ito” ay natural sa Tagalog para sa hayop at umiiwas sa kalituhan ng kasariang gramatikal.
