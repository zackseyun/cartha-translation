base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: tl
  text: Noong umaga, bumangon si Balaam at sinabi sa mga opisyal ni Balak[a], “Pumunta kayo sa inyong lupain, sapagkat tumanggi si Yahweh na payagan akong sumama sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga prinsipe ni Balak” o “mga pinuno ni Balak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Karaniwang katumbas ng Qal wayyiqtol ng קום sa pagsasalaysay; natural ito kasunod ng χρονological na pariralang “kinaumagahan.”
- source_word: בַּבֹּקֶר
  choice: kinaumagahan
  rationale: Likas na modernong Tagalog para sa panandang-panahon sa pagpapatuloy ng salaysay, nang hindi nagdaragdag ng diwa ng pagiging napakaaga.
- source_word: שָׂרֵי בָלָק
  choice: mga opisyal ni Balak
  rationale: Ang שָׂרִים ay maaaring tumukoy sa mga opisyal, pinuno, o prinsipe. Sa konteksto, sila ay mga kinatawan ng hari, kaya malinaw at hindi labis na tiyak ang “mga opisyal.”
- source_word: לְכוּ
  choice: Bumalik kayo
  rationale: Bagaman literal na “humayo kayo,” ipinahihiwatig ng kasunod na “sa inyong lupain” na pinauuwi ang mga sugo; natural na ipinapahayag ito sa Tagalog bilang “Bumalik kayo.”
- source_word: אֶל אַרְצְכֶם
  choice: sa inyong lupain
  rationale: Pinananatili ng “lupain” ang malawak na kahulugan ng אֶרֶץ at ang marangal na register ng teksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng utos, sa dignified ngunit nauunawaang Tagalog.
- source_word: מֵאֵן
  choice: tumanggi
  rationale: Tuwirang ipinapahayag ang Piel perfect ng מאן bilang isang tiyak na pagtanggi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa transliterasyon ang personal na pangalang banal na tahasang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: לְתִתִּי
  choice: na payagan akong
  rationale: Ang נתן na sinusundan ng infinitive ay idyomatikong nangangahulugang magpahintulot; hindi natural sa Tagalog ang literal na “ibigay akong humayo.”
- source_word: לַהֲלֹךְ עִמָּכֶם
  choice: sumama sa inyo
  rationale: Sa konteksto, ang הלך עם ay paglakad o paglalakbay kasama ng delegasyon; “sumama sa inyo” ang pinakanatural at tumpak na Tagalog.
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Karaniwang pandiwa ng pagsasalita sa salaysay at natural sa modernong Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa tekstong pinagmulan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kinaumagahan” at “sapagkat” para sa maayos na daloy ng salaysay; ang “mga opisyal” ay madaling maunawaan habang ang talababa ay nagpapanatili sa iba pang tunay na kahulugan ng שָׂרִים.
