base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: tl
  text: Sa umaga, bumangon si Balaam, nilagyan ng siyahan ang kanyang babaeng asno, at sumama sa mga pinuno ng Moab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Likas na katumbas sa makabagong Filipino ng Qal wayyiqtol ng קום sa sunod-sunod na salaysay.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: בַּבֹּקֶר
  choice: kinaumagahan
  rationale: Tumpak at natural na temporal na pahayag; hindi idinagdag ang di-tahasang diwang 'maagang-maaga.'
- source_word: וַיַּחֲבֹשׁ
  choice: nilagyan niya ng siyahan
  rationale: Sa konteksto ng asno, ang חבש ay tumutukoy sa paghahanda rito para sakyan sa pamamagitan ng paglalagay ng siyahan.
- source_word: אֶת אֲתֹנוֹ
  choice: ang kanyang asnong babae
  rationale: Ang אָתוֹן ay tahasang babaeng asno; natural at malinaw sa Filipino ang 'asnong babae' at napapanatili nito ang espesipikong kasarian sa pangunahing teksto.
- source_word: וַיֵּלֶךְ
  choice: sumama siya
  rationale: Sa pariralang וילך עם, ipinahahayag ng natural na Filipino ang pagpunta na kasama ng iba bilang 'sumama'; hindi nito dinaragdagan ang kilos ng paglalakbay.
- source_word: עִם
  choice: sa
  rationale: Kasama ng pandiwang 'sumama,' ang 'sa' ang idiomatikong pananda ng pakikisama sa mga taong binanggit.
- source_word: שָׂרֵי מוֹאָב
  choice: mga pinuno ng Moab
  rationale: Saklaw ng שָׂרִים ang mga may mataas na katungkulang pampolitika. Ang 'mga pinuno' ay dignified, malinaw, at hindi nagpapalagay ng namamanang titulong maharlika.
