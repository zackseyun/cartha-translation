  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: tl
  text: Naghandog si Balak ng mga baka at mga tupa[a], at nagpadala siya kay Balaam at sa mga pinunong kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring tumukoy nang mas malawak sa maliliit na alagang hayop, kabilang ang mga tupa at kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: naghandog
  rationale: Ipinahihiwatig ng זבח ang pagkatay bilang handog; natural sa Filipino ang “naghandog” at pinananatili nito ang kontekstong pansakripisyo.
- source_word: בָּקָר
  choice: mga baka
  rationale: Kolektibong tumutukoy ang בָּקָר sa mga hayop na bovine; malinaw at likas sa modernong Filipino ang “mga baka.”
- source_word: צֹאן
  choice: mga tupa
  rationale: Maikli at karaniwang katumbas ang “mga tupa,” bagaman maaaring mas malawak ang Hebreo at isama ang mga kambing; itinala ang saklaw na ito sa talababa.
- source_word: וַיְשַׁלַּח
  choice: nagpadala siya ng bahagi nito
  rationale: Ang pandiwa ay literal na “nagpadala,” ngunit hindi tahasang sinasabi ang ipinadala. Dahil kasunod ito ng paghahandog ng mga hayop, malamang na mga bahagi ng handog ang ipinadala; minarkahan ang pagpapalinaw sa talababa.
- source_word: לְבִלְעָם
  choice: kay Balaam
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Balaam.
- source_word: לַשָּׂרִים
  choice: sa mga pinuno
  rationale: Ang שׂרים ay mga taong may mataas na katungkulan. Natural at hindi labis na espesipiko ang “mga pinuno,” kumpara sa “mga prinsipe.”
- source_word: אֲשֶׁר אִתּוֹ
  choice: kasama niya
  rationale: Pinananatili ang panghalip ng Hebreo; pinakamalapit na likas na tinutukoy nito si Balaam.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “naghandog” para sa kultikong diwa, “mga pinuno” bilang malinaw na katawagan sa matataas na opisyal, at mga talababa upang mapanatili ang mas malawak na saklaw ng צֹאן at ang tunay na elipsis sa וַיְשַׁלַּח.
