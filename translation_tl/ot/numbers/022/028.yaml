base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: tl
  text: Pagkatapos, binuksan ni Yahweh ang bibig ng babaeng asno[a], at sinabi nito kay Balaam, “Ano ang ginawa ko sa iyo at hinampas mo ako sa tatlong pagkakataong ito[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang bibig ng babaeng asno”; pambabae ang pangngalang ginamit para sa asno.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “itong tatlong paa,” isang idyomang nangangahulugang “sa tatlong pagkakataong ito” o “tatlong beses na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: binuksan
  rationale: Tuwirang ipinahahayag ng qal wayyiqtol ng פתח ang ginawa ni Yahweh; natural at tumpak sa Filipino ang “binuksan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: פִּי הָאָתוֹן
  choice: ang bibig ng asnong babae
  rationale: Pinananatili ang konkretong pariralang “bibig ng asno,” at isinasaad ang kasariang pambabae na taglay ng pangngalang Hebreo אָתוֹן.
- source_word: וַתֹּאמֶר
  choice: at sinabi nito
  rationale: Ang pandiwa ay pambabaeng isahan at ang asno ang malinaw na nagsasalita. Ang “nito” ay natural sa Filipino para sa hayop at hindi nagpapataw ng di-likas na panghalip na pantao.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: Ano ba ang ginawa ko sa iyo
  rationale: Natural na tanong sa makabagong Filipino ang anyong ito; ipinahihiwatig ng “ba” ang himig ng pagtutol nang hindi dinaragdagan ang diwa.
- source_word: הִכִּיתַנִי
  choice: hinampas mo ako
  rationale: Sa konteksto ng pagtrato sa hayop, malinaw at karaniwan ang “hinampas,” na tumpak na nagpapahayag ng נכה.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: nang tatlong beses na
  rationale: Idyomatiko rito ang רְגָלִים at nangangahulugang tatlong pagkakataon, hindi literal na tatlong paa. Ipinapakita ng “na” ang demonstratibo at kasalukuyang diin ng reklamo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “asnong babae” upang mapanatili ang kasariang hayagang nakapaloob sa Hebreo, at ang “sinabi nito” upang maging natural ang pagtukoy sa hayop.
