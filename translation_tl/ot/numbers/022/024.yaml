  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: tl
  text: At tumayo ang anghel[a] ni Yahweh sa isang makitid na landas sa pagitan ng mga ubasan, na may pader sa isang panig at pader sa kabila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.” Ang salitang Hebreo ay maaaring mangahulugang “sugo” o “anghel,” ngunit mas angkop dito ang “anghel” dahil sa konteksto ng salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Pagkatapos, tumayo
  rationale: Ang wayyiqtol ng עמד ay nagpapatuloy sa salaysay; natural sa Tagalog ang “Pagkatapos” bilang panandang pagkakasunod-sunod, habang pinananatili ng “tumayo” ang payak na diwa.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugang “sugo” o “anghel” ang מַלְאָךְ, ngunit malinaw sa konteksto ng salaysay na isang makalangit na nilalang ang tinutukoy. Pinananatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: בְּמִשְׁעוֹל הַכְּרָמִים
  choice: sa isang makitid na landas sa pagitan ng mga ubasan
  rationale: Ang מִשְׁעוֹל ay isang makipot o makitid na daan; ipinahihiwatig ng mga pader sa magkabilang panig na ang landas ay nasa pagitan ng mga ubasan.
- source_word: גָּדֵר מִזֶּה וְגָדֵר מִזֶּה
  choice: na may pader sa magkabilang panig
  rationale: Likas at malinaw sa modernong Tagalog ang pariralang ito at tapat nitong ipinahahayag na may pader sa bawat panig. Hindi tinukoy na bato ang materyal sapagkat hindi iyon tahasang sinabi ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah / ang PANGINOON
  rationale: Personal na pangalan ang יהוה sa teksto; ang “Yahweh” ay direktang transliterasyon at hindi pamalit na titulo.
- issue: Kahulugan ng מַלְאָךְ sa pariralang מַלְאַךְ יְהוָה
  choice: anghel
  alternative: sugo
  rationale: Tunay na saklaw ng salitang Hebreo ang dalawang kahulugan, ngunit ang makapangyarihan at di-pangkaraniwang tauhan sa konteksto ng salaysay ang pumapabor sa “anghel.” Pinananatili sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa magkabilang panig” sa halip na ulitin ang “sa panig na ito ... sa panig na iyon” upang maging natural sa Tagalog nang hindi nawawala ang spatial na diwa ng Hebreo.
