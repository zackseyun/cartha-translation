  text: וַ/תִּרְאַ֨/נִי֙ הָֽ/אָת֔וֹן וַ/תֵּ֣ט לְ/פָנַ֔/י זֶ֖ה שָׁלֹ֣שׁ רְגָלִ֑ים אוּלַי֙ נָטְתָ֣ה מִ/פָּנַ֔/י כִּ֥י עַתָּ֛ה גַּם אֹתְ/כָ֥ה הָרַ֖גְתִּי וְ/אוֹתָ֥/הּ הֶחֱיֵֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: tl
  text: Nakita ako ng asno at tatlong beses siyang lumihis sa harap ko. Kung hindi siya lumihis palayo sa akin[a], tiyak na napatay na sana kita ngayon at hinayaan ko siyang mabuhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “marahil ay lumihis siya mula sa harap ko.” Karaniwang inuunawa ang sugnay bilang kondisyong salungat sa nangyari—“kung hindi siya lumihis palayo sa akin”—ayon sa konteksto at sa kasunod na pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: Nakita ako
  rationale: Ang ראה ay tumutukoy rito sa tuwirang pagkakita; ito ang pinakapayak at natural na salin sa modernong Tagalog.
- source_word: הָאָתוֹן
  choice: ang asno
  rationale: Ang אָתוֹן ay babaeng asno. Hindi karaniwang minamarkahan sa Tagalog ang kasarian ng hayop kapag hindi ito kailangang idiin, kaya natural ang “asno”; makikita naman sa konteksto na ang tinutukoy ay ang partikular na asno ni Balaam.
- source_word: וַתֵּט לְפָנַי
  choice: lumihis sa harap ko
  rationale: Ang נטה ay nangangahulugang lumihis o kumabig. Pinananatili ng “sa harap ko” ang ugnayang panlunan ng לְפָנַי nang hindi nagdaragdag ng paliwanag.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: tatlong beses
  rationale: Ang parirala ay idyomatikong tumutukoy sa tatlong pagkakataon; “tatlong beses” ang malinaw at likas na katumbas sa Tagalog.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: Kung hindi siya lumihis palayo sa akin
  rationale: 'Bagaman karaniwang nangangahulugang “marahil” ang אוּלַי at walang hayag na negasyon sa tekstong Masoretiko, hinihingi ng daloy ng salaysay ang isang kondisyong salungat sa nangyari: ang paglihis ng asno ang pumigil sa pagkamatay ni Balaam. Itinatala sa talababa ang literal na anyo.'
- source_word: כִּי עַתָּה
  choice: tiyak na … ngayon
  rationale: Ipinahahayag ng parirala ang mariing bunga at ang agarang panahong tinutukoy; natural itong naipapahayag sa Tagalog sa pamamagitan ng “tiyak na” at “ngayon.”
- source_word: גַּם אֹתְכָה הָרַגְתִּי
  choice: napatay na sana kita
  rationale: Ang ganap na pandiwa ay bahagi ng bungang salungat sa nangyari, kaya ang “sana” at “na” ay nagpapahayag na mangyayari sana ang pagpatay ngunit hindi nangyari. Hindi na hiwalay na isinalin ang גַּם dahil malinaw na sa paghahambing ang diin sa “kita.”
- source_word: וְאוֹתָהּ הֶחֱיֵיתִי
  choice: at hinayaan ko siyang mabuhay
  rationale: Ang Hiphil ng חיה ay “panatilihing buhay” o “hayaang mabuhay.” Ang napiling salin ay malinaw at pinananatili ang tuwirang kaibahan sa pagpatay kay Balaam.
theological_decisions:
- issue: Kondisyong salungat sa nangyari kahit walang hayag na negasyon pagkatapos ng אוּלַי
  choice: “Kung hindi siya lumihis palayo sa akin”
  alternative: “Marahil ay lumihis siya mula sa harap ko”
  rationale: Ipinakikita ng konteksto na ang paglihis ng asno ang dahilan kaya hindi napatay si Balaam. Kaya ipinahahayag sa pangunahing teksto ang kinakailangang diwang pasalungat, habang pinananatili sa talababa ang tunay na pormal na hirap at posibleng literal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang “asno” sa halip na ang mas mabigat na “babaeng asno,” at pinanatili sa talababa ang mahalagang kalabuan ng Hebreo.
