id: NUM.22.25
reference: Numbers 22:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: tl
  text: Nang makita ng babaeng asno ang anghel ni Yahweh[a], sumiksik ito sa pader at idiniin ang paa ni Balaam sa pader. Kaya muli itong hinampas ni Balaam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.” Sa kontekstong ito, malinaw na sobrenatural ang nilalang, kaya “anghel” ang ginamit sa pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: babaeng asno
  rationale: Tiyak na babaeng asno ang tinutukoy ng אָתוֹן. Likas at malinaw sa modernong Tagalog ang “babaeng asno,” at nakatutulong itong linawin ang kasarian ng hayop nang hindi umaasa sa mga panghalip na walang kasarian sa Tagalog.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugang “sugo” o “anghel” ang מַלְאַךְ, ngunit malinaw sa salaysay na sobrenatural ang nilalang; kaya “anghel” ang ginamit sa pangunahing teksto habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang natatanging pangalan ng Diyos na יהוה bilang “Yahweh,” alinsunod sa patakaran ng proyekto at upang mapanatili ang pagkakaiba nito sa isang karaniwang titulong gaya ng “Panginoon.”
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: sumiksik ito sa pader
  rationale: Ipinahihiwatig ng anyo ng pandiwa na ang asno ay gumalaw nang dikit na dikit sa pader. Natural na ipinahahayag ito ng “sumiksik … sa pader.”
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: idiniin ang paa ni Balaam sa pader
  rationale: 'Dito ay tuwirang layon ng pandiwa ang paa ni Balaam: dahil sa kilos ng asno, naipit o naidiin ang paa sa pader. Ang “idiniin” ay malinaw at pisikal nang hindi pinalalabis ang pinsala.'
- source_word: רֶגֶל
  choice: paa
  rationale: Ang “paa” ang karaniwan at angkop na kahulugan ng רֶגֶל sa kontekstong ito.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: muli itong hinampas ni Balaam
  rationale: Ang יָסַף na sinusundan ng pawatas ay nagpapahayag ng pag-uulit o pagpapatuloy. Ang “muli … hinampas” ay maikli at natural, at ang tahasang pagbanggit kay Balaam ay umiiwas sa kalituhan ng panghalip sa Tagalog.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng isang titulo. Hindi nito ipinapasok ang anumang natatanging denominasyonal na pagbasa.
- issue: Kahulugan ng מַלְאַךְ sa pariralang מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Totoo ang dalawang posibleng kahulugang leksikal, ngunit sa kontekstong ito ay malinaw na sobrenatural ang tauhan. Pinili ang “anghel” sa teksto at pinanatili ang “sugo” bilang alternatibo sa talababa, nang hindi higit na tinutukoy ang ontolohikal na identidad ng tauhan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ito” para sa asno dahil walang kasariang panghalip sa Tagalog, at tahasang inulit ang pangalang Balaam sa huling sugnay upang maiwasan ang kalituhan.
