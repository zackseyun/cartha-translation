- from: Sinabi ng asnong babae kay Balaam[a], “Hindi ba ako ang iyong asno na sinasakyan mo mula pa noon hanggang sa araw na ito? Nakaugalian ko na bang gawin ito sa iyo?” Sumagot siya, “Hindi.”
  to: Sinabi ng babaeng asno kay Balaam[a], “Hindi ba ako ang iyong asno na sinasakyan mo mula pa noong una hanggang ngayon? Nakaugalian ko na bang gawin sa iyo ang ganito?” Sumagot siya, “Hindi.”
  rationale: Pinalitan ang hindi gaanong natural na “asnong babae” ng “babaeng asno,” nilinaw ang saklaw ng panahon sa “mula pa noong una hanggang ngayon,” at inayos ang huling tanong upang mas tapat na maipahayag ang tanong tungkol sa nakaugaliang pagkilos. Napanatili ang retorikal na puwersa, ang kasarian ng hayop sa talababa, at ang maikling negatibong tugon ni Balaam.
