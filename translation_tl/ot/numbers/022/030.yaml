base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: tl
  text: Sinabi ng babaeng asno kay Balaam[a], “Hindi ba ako ang iyong asno na sinasakyan mo mula pa noong una hanggang ngayon? Nakaugalian ko na bang gawin sa iyo ang ganito?” Sumagot siya, “Hindi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang salitang ginamit ay tiyak na tumutukoy sa isang babaeng asno.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: asnong babae / iyong asno
  rationale: Ang אָתוֹן ay tahasang tumutukoy sa babaeng asno. Binanggit ang kasarian sa unang pagtukoy, ngunit ginamit ang mas natural na “iyong asno” sa kasunod na personal na pahayag.
- source_word: הֲלוֹא אָנֹכִי
  choice: Hindi ba ako
  rationale: Likas na anyong Filipino para sa retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: na sinasakyan mo
  rationale: Malinaw at natural na ipinahahayag ang patuloy na paggamit kay Balaam bilang kanyang sinasakyang hayop.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: mula pa noon hanggang sa araw na ito
  rationale: Pinananatili ang malawak ngunit hindi lubusang tiyak na panahong ipinahihiwatig ng idyomang Hebreo, sa halip na tahasang gawing “buong buhay mo.”
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: Nakaugalian ko na ba
  rationale: Ipinahahayag ang mariing retorikal na tanong tungkol sa nakasanayang asal; ang “na ba” ay natural sa modernong Filipino.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: gawin ito sa iyo
  rationale: Ang “ito” ay tumutukoy sa di-pangkaraniwang ginawa ng asno sa kasalukuyang pangyayari at mas natural kaysa sa literal na “ganito.”
- source_word: וַיֹּאמֶר לֹא
  choice: Sumagot siya, “Hindi.”
  rationale: Bagaman literal na “at sinabi niya,” ang “sumagot” ay natural na salaysay at malinaw na ipinakikitang tugon ito ni Balaam.
