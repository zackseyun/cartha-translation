  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: tl
  text: At sinabi ng Diyos kay Balaam, “Huwag kang sumama sa kanila. Huwag mong sumpain ang bayan, sapagkat pinagpala ito.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sapagkat pinagpala sila.” Pang-isahan sa Hebreo ang “pinagpala ito/siya,” na tumutukoy sa bayan bilang isang kabuuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas at marangal sa salaysay na Tagalog ang “At sinabi.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang tinutukoy rito ay ang Diyos na tuwirang nakikipag-usap kay Balaam.
- source_word: לֹא תֵלֵךְ עִמָּהֶם
  choice: Huwag kang sumama sa kanila
  rationale: Ang imperfect na may לֹא ay pagbabawal. Mas likas sa Tagalog ang “sumama sa kanila” kaysa sa literal na “pumunta kasama nila,” habang pinananatili ang diwang huwag makiisa sa kanilang paglalakbay.
- source_word: לֹא תָאֹר
  choice: Huwag mong sumpain
  rationale: Ang אָרַר ay “sumpain,” at malinaw na naihahayag ng “Huwag” ang puwersa ng pagbabawal.
- source_word: אֶת הָעָם
  choice: ang bayan
  rationale: Tumutukoy ito sa Israel bilang isang sama-samang bayan; hindi nagdaragdag ang salin ng demonstratibong wala sa Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabawal; ang “sapagkat” ay malinaw at angkop sa marangal na modernong Tagalog.
- source_word: בָרוּךְ הוּא
  choice: pinagpala ito
  rationale: Kapuwa pang-isahan ang panaguri at panghalip sa Hebreo, na bumabalik sa kolektibong pangngalang “bayan.” Pinananatili ng “ito” ang kolektibong pang-isahan nang hindi ginagawang isang indibidwal ang tinutukoy.
theological_decisions:
- issue: Tinutukoy at bilang sa pariralang בָרוּךְ הוּא
  choice: “sapagkat pinagpala ito,” na tumutukoy sa Israel bilang isang kolektibong bayan
  alternative: “sapagkat pinagpala sila”
  rationale: Pang-isahan ang gramatika ng Hebreo bagaman kolektibo ang הָעָם. Pinananatili sa pangunahing teksto ang tunay na anyong pang-isahan, samantalang inilalahad sa talababa ang likas na alternatibong pangmaramihan sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang tuwirang anyong pagbabawal na “Huwag,” at ang “bayan” para sa Israel bilang kolektibong sambayanan. Inilagay ang panandang [a] sa mismong pariralang tinatalakay ng talababa.
