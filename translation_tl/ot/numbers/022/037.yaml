base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: tl
  text: At sinabi ni Balak kay Balaam, “Hindi ba't talagang nagpadala ako sa iyo upang ipatawag ka?[a] Bakit hindi ka pumunta sa akin?[b] Talaga bang hindi ko kayang parangalan ka?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hindi ba't tiyak na nagpadala ako sa iyo upang ipatawag ka?” Gumagamit ang Hebreo ng infinitive absolute kasama ng pandiwang may banghay upang magbigay-diin; ayon sa konteksto, maaari rin itong unawain bilang paulit-ulit o apurahang pagpapadala.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Bakit hindi ka nagpunta sa akin?”
    reason: lexical_alternative
  - marker: c
    text: Ang “parangalan ka” ay maaaring sumaklaw sa pagbibigay ng gantimpala o mataas na katayuan, hindi lamang sa pagpapakita ng paggalang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Likas na salin ng Hebrew wayyiqtol sa tuloy-tuloy na salaysay, nang hindi dinaragdagan ang ugnayang pandiskurso.
- source_word: הֲלֹא שָׁלֹחַ שָׁלַחְתִּי
  choice: Hindi ba't talagang nagsugo ako
  rationale: Ang retorikal na tanong ay umaasang sasang-ayon ang kausap, at ipinapahayag ng “talagang” ang diin ng infinitive absolute na kasama ng finite verb nang hindi ito nililimitahan sa pagkaapurahan o pag-uulit.
- source_word: לִקְרֹא לָךְ
  choice: para ipatawag ka
  rationale: Sa konteksto, ang קרא ay isang pagpapatawag o pagsugo upang kunin si Balaam; natural at malinaw sa modernong Tagalog ang “ipatawag ka.”
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: Bakit hindi ka pumunta sa akin?
  rationale: Pinananatili ng “pumunta” ang karaniwang diwa ng הלך at natural ito sa Tagalog kahit ang patutunguhan ay ang nagsasalita.
- source_word: הַאֻמְנָם
  choice: Talaga bang
  rationale: Ipinahahayag nito ang mariin at bahagyang di-makapaniwalang tono ng tanong ni Balak.
- source_word: לֹא אוּכַל כַּבְּדֶךָ
  choice: hindi ko kayang parangalan ka
  rationale: Pinananatili ang kakayahang ipinahahayag ng יכל at ang malawak na diwa ng piel ng כבד, na maaaring sumaklaw sa pagkakaloob ng gantimpala o mataas na katayuan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Hindi ba't” at “Talaga bang” upang likas na maipakita ang dalawang retorikal na tanong. Iniwasang gawing “gantimpalaan” lamang ang כַּבְּדֶךָ upang mapanatili ang mas malawak na kahulugan nito.
