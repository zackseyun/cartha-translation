  to: At sinabi ni Balak kay Balaam, “Hindi ba't talagang nagpadala ako sa iyo upang ipatawag ka?[a] Bakit hindi ka pumunta sa akin?[b] Talaga bang hindi ko kayang parangalan ka?”[c]
