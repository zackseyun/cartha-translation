  source_fidelity: Ang “nagsugo ako para ipatawag ka” ay nakapagpapahiwatig ng pagpapadala ng mga sugo, ngunit hindi nito gaanong tahasang naihahayag ang אֵלֶיךָ (“sa iyo”). Ang “nagpadala ako sa iyo upang ipatawag ka” ay mas malinaw na tumutugma sa direksiyon at layon ng Hebreo, habang pinananatili ang diin ng infinitive absolute sa “talagang.”
  naturalness: Natural at marangal ang kabuuang Tagalog. Mas malinaw at mas tuwiran ang “nagpadala ako sa iyo upang ipatawag ka” kaysa sa konstruksiyong “nagsugo ako para ipatawag ka.”
  terminology: Wasto ang mga pangalang Balak at Balaam. Ang “parangalan ka” ay angkop para sa כבד at hindi isinasara ang kahulugang maaaring may kasamang gantimpala o mataas na katayuan. Ang “Talaga bang” ay maayos para sa mariing tanong na הַאֻמְנָם.
