  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לִ֤ינוּ פֹה֙ הַ/לַּ֔יְלָה וַ/הֲשִׁבֹתִ֤י אֶתְ/כֶם֙ דָּבָ֔ר כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/יֵּשְׁב֥וּ שָׂרֵֽי מוֹאָ֖ב עִם בִּלְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: tl
  text: Sinabi niya sa kanila, “Magpalipas kayo ng gabi rito, at ibibigay ko sa inyo ang sagot[a] ayon sa sasabihin sa akin ni Yahweh.” Kaya nanatili ang mga pinuno ng Moab kasama ni Balaam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ibabalik ko sa inyo ang salita” o “dadalhan ko kayo ng mensahe.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga opisyal ng Moab” o “mga prinsipe ng Moab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: Magpalipas kayo ng gabi rito
  rationale: Natural na paanyayang manatili roon nang magdamag; pinananatili ang lugar at panahon na nasa Hebreo.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: ibibigay ko sa inyo ang sagot
  rationale: Ipinahahayag ang idyomatikong diwa ng pagbabalik ng salita o tugon sa kanila nang hindi gumagamit ng di-natural na pariralang Tagalog.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: ayon sa sasabihin sa akin ni Yahweh
  rationale: Pinananatili ng “ayon sa” ang ugnayang ipinapahiwatig ng כַּאֲשֶׁר, at ang panghinaharap na “sasabihin” ay angkop sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: וַיֵּשְׁבוּ
  choice: nanatili
  rationale: Sa konteksto ng paanyayang magpalipas ng gabi, ang pandiwa ay nangangahulugang nanatili sila roon.
- source_word: שָׂרֵי מוֹאָב
  choice: mga pinuno ng Moab
  rationale: Malawak at natural na salin ng שָׂרִים para sa matataas na kinatawan ng Moab, nang hindi ipinapalagay na mga prinsipe silang lahat.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Karaniwang anyo ng pangalan sa Tagalog na tradisyong biblikal.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan sa halip na gawin itong titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpalipas ng gabi” bilang natural na katumbas ng utos na manatili nang magdamag, at “mga pinuno” upang mapanatili ang lawak ng kahulugan ng שָׂרִים.
