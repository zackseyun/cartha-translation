base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: tl
  text: Kaya nagpunta ang mga matatanda ng Moab at ang mga matatanda ng Midian, na may dalang bayad para sa panghuhula.[a] Dumating sila kay Balaam at sinabi sa kanya ang mga salita ni Balak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na may dalang mga gamit o palatandaan para sa panghuhula.” Maaaring tumukoy ang Hebreong pananalita sa mga gamit, palatandaan, o mga gawaing panghuhula, ngunit sa kontekstong ito ay mas malamang na tumutukoy ito sa bayad para sa panghuhula.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: matatandang pinuno ng
  rationale: Ang זִקְנֵי sa construct na may pangalan ng bayan ay tumutukoy sa kinikilalang matatanda o nakatatandang pinuno. Ang “matatandang pinuno” ay natural sa modernong Filipino at nililinaw ang kanilang tungkuling panlipunan at pampolitika.
- source_word: וּקְסָמִים בְּיָדָם
  choice: dala ang bayad para sa panghuhula
  rationale: Maaaring tumukoy ang קְסָמִים sa mga panghuhula, gamit, o tanda, ngunit sa konteksto ay malamang na metonimikong tumutukoy sa bayad na dala upang kunin ang paglilingkod ni Balaam bilang manghuhula. Ang “dala” ay likas na katumbas ng idyomang “nasa kanilang kamay.”
- source_word: וַיָּבֹאוּ אֶל
  choice: Dumating sila kay
  rationale: Ang בוא אֶל ay nangangahulugang pumunta o dumating sa isang tao. Pagkatapos ng “umalis,” malinaw at natural ang “dumating sila kay.”
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: sinabi sa kanya
  rationale: Ang דבר אֶל ay literal na “nagsalita sa kanya,” ngunit sa Filipino, ang “sinabi sa kanya ang mga salita” ay mas natural kaysa “nagsalita sa kanya ng mga salita” at nananatiling malapit sa diwa ng Hebreo.
- source_word: דִּבְרֵי בָלָק
  choice: ang mga salita ni Balak
  rationale: Pinananatili nito ang pormal na anyo ng construct phrase at hindi ipinapalagay kung tuwirang sipi o ipinagkatiwalang mensahe ang nilalaman.
- source_word: וַיֵּלְכוּ
  choice: Kaya umalis
  rationale: Ang waw-consecutive ay nagpapasulong sa salaysay at may kaugnayang bunga sa naunang talata. Ipinahahayag ito nang natural ng “Kaya,” habang ang “umalis” ay akma sa paglalakbay mula sa kanilang pinanggalingan.
