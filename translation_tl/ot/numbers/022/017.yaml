  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: tl
  text: Sapagkat pararangalan kita nang lubos[a], at gagawin ko ang anumang sabihin mo sa akin. Kaya pumarito ka at pakisumpain mo para sa akin ang bayang ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tiyak na pararangalan kita nang labis” o “gagantimpalaan kita nang sagana.” Gumagamit ang Hebreo ng infinitive absolute kasama ng pandiwang may banghay upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang pangako ni Balak bilang dahilan ng muli niyang pakiusap; likas sa Filipino ang “sapagkat” sa ganitong ugnayan.
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: pararangalan kita nang lubos
  rationale: Pinananatili ng “pararangalan” ang tuwirang diwa ng ugat na כבד, habang ipinahahayag ng “nang lubos” ang diin ng infinitive absolute at ng מְאֹד.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: at gagawin ko ang anumang sabihin mo sa akin
  rationale: Natural na ayos sa modernong Filipino na pinananatili ang malawak na saklaw ng כֹל אֲשֶׁר at ang literal na diwang “sabihin mo sa akin.”
- source_word: וּלְכָה נָּא
  choice: Kaya pumarito ka, paki-
  rationale: Ang “pumarito ka” ay malinaw na pautos ng paglapit, at ang “paki-” sa kasunod na pandiwa ay natural na naghahatid ng magalang o mapilit na pakiusap na dala ng נָא.
- source_word: קָבָה לִּי
  choice: pakisumpain mo para sa akin
  rationale: Ang “sumpain” ay payak at tuwirang katumbas ng pagbigkas o pagtawag ng sumpa; pinananatili ng “para sa akin” ang personal na kapakinabangan ni Balak.
- source_word: אֵת הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang “bayan” ay natural na kolektibong katawagan sa isang pangkat ng mga tao at pinananatili ang isahang anyo ng עָם.
