translation_notes:
  register: Modernong Filipino na magalang at marangal ngunit madaling maunawaan. Ginamit ang “pararangalan” upang manatili sa honor-language ng Hebreo; inilagay ang diwa ng נָא sa “paki-” upang maging likas ang pakiusap sa Filipino.
