  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang anghel ni Yahweh ay sumasaway kay Balaam dahil sa paghampas niya sa asno at nagsasabing lumabas siya bilang isang kalaban. Gayunman, ang “kalaban mo” ay nagdaragdag ng tahasang layon na wala sa Hebreo, bagaman ipinahihiwatig ito ng konteksto. Mas maingat ang “bilang isang kalaban.”'
  naturalness: Marangal at nauunawaan ang Tagalog, ngunit mas idiomatiko ang “sa tatlong pagkakataong ito” kaysa “nitong tatlong ulit.” Inilipat din ang mga panandang talababa sa mismong salitang o pariralang nililinaw nila.
  terminology: Ang “anghel ni Yahweh” at “asno” ay angkop. Ang “Satanas” ay wastong itinatabi lamang bilang posibleng ngunit hindi kinakailangang pagbasa sa talababa. Ang “padalus-dalos” ay isang katanggap-tanggap na pangunahing salin para sa mahirap na יָרַט kung malinaw na pinananatili ang alternatibo sa talababa.
