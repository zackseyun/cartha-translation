  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מַלְאַ֣ךְ יְהוָ֔ה עַל מָ֗ה הִכִּ֨יתָ֙ אֶת אֲתֹ֣נְ/ךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְ/שָׂטָ֔ן כִּֽי יָרַ֥ט הַ/דֶּ֖רֶךְ לְ/נֶגְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: tl
  text: At sinabi sa kanya ng anghel ni Yahweh, “Bakit mo hinampas ang iyong asno sa tatlong pagkakataong ito? Narito, lumabas ako bilang isang kalaban[a], sapagkat padalus-dalos[b] ang landas na tinatahak mo sa harap ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na שָׂטָן dito ay nangangahulugang “kalaban” o “katunggali”; hindi ito kinakailangang tumukoy sa pantanging pangalang “Satanas.”
    reason: lexical_alternative
  - marker: b
    text: Bihira at hindi tiyak ang pandiwang Hebreo na isinaling “padalus-dalos.” Maaari rin itong unawain bilang “baluktot,” “mapusok,” o “salungat.”
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Sa salaysay, isang makalangit na nilalang ang humaharap kay Balaam, kaya ang natural na salin ng מַלְאַךְ ay “anghel.” Pinananatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: עַל מָה הִכִּיתָ
  choice: Bakit mo hinampas
  rationale: Ang עַל מָה ay likas na tanong na “bakit,” at ang נכה ay nangangahulugang humampas o tumama. Ang “hinampas” ay tuwiran at angkop sa konteksto.
- source_word: אֲתֹנְךָ
  choice: ang iyong asno
  rationale: Tiyak na babaeng asno ang tinutukoy ng Hebreo, ngunit sapat at mas natural sa modernong Tagalog ang “asno” sapagkat hindi binibigyang-diin dito ang kasarian nito.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: nitong tatlong ulit
  rationale: Idyoma ito na nangangahulugang “sa tatlong pagkakataong ito,” hindi literal na tatlong paa. Ang “nitong tatlong ulit” ay natural at malinaw.
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: Narito, lumabas ako
  rationale: Pinananatili ng “Narito” ang pantawag-pansing bisa ng הִנֵּה, at ang “lumabas ako” ay malapit sa payak na kahulugan ng יָצָאתִי.
- source_word: לְשָׂטָן
  choice: bilang kalaban mo
  rationale: Karaniwang pangngalan dito ang שָׂטָן, na tumutukoy sa isang kalaban o humahadlang, hindi kinakailangang sa pangalang Satanas. Ipinahihiwatig ng konteksto na si Balaam ang kinakalaban.
- source_word: כִּי יָרַט הַדֶּרֶךְ לְנֶגְדִּי
  choice: sapagkat padalus-dalos ang landas na tinatahak mo sa harap ko
  rationale: Bihira at mahirap tiyakin ang יָרַט. Ang “padalus-dalos” ay kumakatawan sa malamang na diwa ng isang mapanganib at di-wastong pagtahak, habang ang talababa ay nagpapanatili sa ibang posibleng pagbasa. Ginawang “landas na tinatahak mo” ang הַדֶּרֶךְ upang maging likas sa Tagalog nang hindi inaalis ang talinghagang “landas.”
theological_decisions:
- issue: Kung pangalan o karaniwang pangngalan ang שָׂטָן
  choice: 'karaniwang pangngalan: “bilang kalaban mo”'
  alternative: “bilang Satanas” o “upang hadlangan ka”
  rationale: Inilalarawan ng teksto ang ginagampanang papel ng anghel ni Yahweh bilang kalaban ni Balaam. Ang paggamit ng “Satanas” bilang pantanging pangalan ay magpapasok ng pagkakakilanlang hindi hinihingi ng konteksto.
- issue: Kahulugan ng bihirang pandiwang יָרַט
  choice: “padalus-dalos”
  alternative: “baluktot,” “salungat,” o “mapusok”
  rationale: Hindi ganap na tiyak ang kahulugan ng bihirang anyo. Pinili ang malinaw ngunit hindi sobrang tiyak na “padalus-dalos,” at tahasang itinabi sa talababa ang mga pangunahing alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Yahweh” bilang personal na pangalan ng Diyos, “Narito” upang mapanatili ang diin ng Hebreo, at maiikling talababa upang hindi itago ang tunay na leksikal na kalabuan.
