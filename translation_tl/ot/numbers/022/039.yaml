base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/039.yaml
  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: tl
  text: At sumama si Balaam kay Balak, at dumating sila sa Kiriat-Huzot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kiriat-Huzot ay malamang na nangangahulugang “lunsod ng mga lansangan” o “lunsod ng mga bukas na lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: sumama
  rationale: Bagaman pangunahing nangangahulugang “pumunta” ang הלך, malinaw na ipinahihiwatig ng kasunod na עִם בָּלָק ang pagsama ni Balaam kay Balak; natural at tumpak sa Filipino ang “sumama ... kay.”
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Karaniwang anyong Filipino ng personal na pangalang Hebreo.
- source_word: עִם בָּלָק
  choice: kay Balak
  rationale: Sa konstruksiyong “sumama ... kay,” natural na naihahayag ang pakikisama o accompaniment na tinutukoy ng עִם.
- source_word: וַיָּבֹאוּ
  choice: nakarating sila
  rationale: Ang plural na wayyiqtol ng בוא ay nagsasaad ng susunod na kilos sa salaysay. Ang “nakarating sila” ay natural sa Filipino at hindi nagpapahiwatig nang higit sa pagdating sa lugar.
- source_word: קִרְיַת חֻצוֹת
  choice: Kiriat-Huzot
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon; inilalahad sa talababa ang posibleng kahulugan ng mga sangkap ng pangalan.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “sumama ... kay” upang natural na pagsamahin ang kilos ng pagpunta at ang ideya ng pakikisama, habang pinanatiling transliterado ang pangalan ng lugar.
