  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: tl
  text: Pagkatapos, muling nagpadala si Balak ng mas maraming pinuno na mas marangal kaysa sa mga nauna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: Pagkatapos, muling nagpadala
  rationale: Ang idyomang יָסַף + infinitive, na pinatitindi ng עוֹד, ay nagsasaad ng pag-uulit. Likas sa modernong Tagalog ang “muling nagpadala,” habang ipinapakita ng “Pagkatapos” ang pagsulong ng salaysay.
- source_word: בָּלָק
  choice: Balak
  rationale: Isinalin sa karaniwang transliterasyong Tagalog ang pangalan.
- source_word: שָׂרִים
  choice: mga pinuno
  rationale: Tumutukoy ito sa mga taong may mataas na katungkulan na isinugo bilang mga kinatawan. Malinaw at dignified sa konteksto ang “mga pinuno.”
- source_word: רַבִּים
  choice: mas marami
  rationale: Ginawang tahasan ang paghahambing na ipinahihiwatig ng kasunod na מֵאֵלֶּה.
- source_word: וְנִכְבָּדִים
  choice: mas marangal
  rationale: Ipinahahayag ng anyo mula sa כבד ang mataas na katayuan, dangal, o prestihiyo. Ang “mas marangal” ay natural at pinananatili ang saklaw na ito.
- source_word: מֵאֵלֶּה
  choice: kaysa sa mga nauna
  rationale: Bagaman literal na “kaysa sa mga ito,” malinaw na tumutukoy ang demonstratibo sa naunang pangkat ng mga sugo; mas natural at hindi malabo sa Tagalog ang “mga nauna.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Iniwasan ang mas lumang “mga prinsipe” dahil ang konteksto ay mga mataas na pinuno o kinatawan, hindi kinakailangang mga anak ng hari.
