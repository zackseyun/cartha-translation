source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף אֱלֹהִים֮ כִּֽי הוֹלֵ֣ךְ הוּא֒ וַ/יִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהוָ֛ה בַּ/דֶּ֖רֶךְ לְ/שָׂטָ֣ן ל֑/וֹ וְ/הוּא֙ רֹכֵ֣ב עַל אֲתֹנ֔/וֹ וּ/שְׁנֵ֥י נְעָרָ֖י/ו עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: tl
  text: Ngunit nag-alab ang galit ng Diyos dahil naglalakbay siya, at pumuwesto sa daan ang anghel ni Yahweh bilang kalaban[a] niya. Nakasakay siya sa kaniyang asno,[b] at kasama niya ang dalawa niyang kabataang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong שָׂטָן (satan) dito ay nangangahulugang “kalaban” o “sumasalungat,” at hindi kinakailangang pantanging pangalang Satanas.
    reason: lexical_alternative
  - marker: b
    text: O “babaeng asno”; tiyak na babaeng asno ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: nag-alab ang galit ng Diyos
  rationale: Pinananatili nito ang matingkad na Hebreong idyoma ng nag-aalab na galit, ngunit natural pa rin sa makabagong Tagalog.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: dahil naglalakbay siya
  rationale: Ipinapakita ng “dahil” ang sanhi at ng aspektong di-ganap ng “naglalakbay” ang nagpapatuloy na kilos, nang hindi nilulutas ang tensiyon kung bakit ikinagalit ng Diyos ang kaniyang pagpunta.
- source_word: וַיִּתְיַצֵּב
  choice: pumuwesto
  rationale: Ipinahihiwatig ng anyong Hitpael ang sinasadya at matatag na paglalagay ng sarili sa isang posisyon.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Ang “anghel” ay angkop sa makalangit na sugo sa salaysay, at tuwirang pinananatili ang pangalang Yahweh.
- source_word: בַּדֶּרֶךְ
  choice: sa daan
  rationale: Natural at kongkretong inilalarawan nito ang lugar kung saan pumuwesto ang anghel.
- source_word: לְשָׂטָן לוֹ
  choice: bilang kalaban niya
  rationale: Pinananatili ang pangngalang diwa ng שָׂטָן bilang isang sumasalungat o kalaban, sa halip na gawing pantanging pangalan.
- source_word: וְהוּא רֹכֵב
  choice: Nakasakay siya
  rationale: Natural na nagbibigay ito ng impormasyong panlikuran sa tagpo nang hindi dinaragdagan ang kahulugan.
- source_word: אֲתֹנוֹ
  choice: kaniyang asno
  rationale: Karaniwang tawag sa Tagalog ang “asno”; inilalagay sa talababa ang mas tiyak na kasarian ng hayop sa Hebreo.
- source_word: שְׁנֵי נְעָרָיו
  choice: dalawa niyang kabataang lalaki
  rationale: Tuwirang pinananatili ang malawak na kahulugan ng נַעַר bilang mga kabataang lalaki, nang hindi tiyak na tinatawag silang mga alipin o lingkod.
theological_decisions:
- issue: Kahulugan ng שָׂטָן sa kontekstong ito
  choice: 'karaniwang pangngalan: “kalaban”'
  alternative: 'pantanging pangalan: “Satanas”'
  rationale: Sa pangungusap, inilalarawan ng salita ang papel ng anghel bilang sumasalungat kay Balaam. Hindi hinihingi ng balarila o konteksto na tukuyin ito bilang pantanging pangalang Satanas.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pinananatili ang personal at tipanang pangalan na tahasang nasa tekstong Hebreo.
- issue: Dahilan ng galit ng Diyos kahit pinahintulutan si Balaam na humayo
  choice: 'panatilihin ang payak na ugnayang sanhi: “dahil naglalakbay siya”'
  alternative: dagdagan ng paliwanag gaya ng “dahil determinado siyang humayo”
  rationale: Hindi ipinapahayag ng talata ang gayong paliwanag. Pinananatili ng salin ang tunay na tensiyon ng salaysay sa halip na lutasin ito sa pamamagitan ng dagdag na motibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matingkad na idyoma ng galit, ang sinadyang pagpuwesto ng anghel, at ang di-nilulutas na tensiyon sa dahilan ng galit ng Diyos. Inilagay ang bawat talababa sa salitang aktuwal nitong ipinapaliwanag.
