base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: tl
  text: Pagkatapos, nagpatuloy pa[a] ang anghel ni Yahweh at tumayo sa isang makitid na lugar, kung saan walang daan upang lumiko sa kanan o sa kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpatuloy sa pag-usad” o “dumaan pa.” Sa Hebreo, literal na ipinahihiwatig ng idyoma ang pagdaragdag o pagpapatuloy sa pag-usad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבֹר
  choice: Pagkatapos, nagpatuloy pa
  rationale: Ang יָסַף na sinusundan ng pawatas na עֲבֹר ay isang idyomang nagsasaad ng pagpapatuloy o muling pag-usad. Likas sa modernong Tagalog ang “nagpatuloy pa,” habang ipinahihiwatig ng “Pagkatapos” ang sunod-sunod na kilos sa salaysay.
- source_word: מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ ng mensahero o anghel; sa sobrenatural na tagpong ito, “anghel” ang malinaw at likas na salin. Pinanatili ang personal na pangalang Yahweh para sa יְהוָה.
- source_word: וַיַּעֲמֹד
  choice: at tumayo
  rationale: Tuwirang ipinahahayag ng עמד ang pagtayo o pagpuwesto. Ang “tumayo” ay payak at hindi nagdaragdag ng di-tiyak na layunin.
- source_word: בְּמָקוֹם צָר
  choice: sa isang makitid na lugar
  rationale: Pinananatili nito ang konkretong larawan ng isang lugar na masikip o makitid.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: kung saan walang daan upang lumiko
  rationale: Ang דֶּרֶךְ ay maaaring daan, landas, o paraan; dito, ang “walang daan upang lumiko” ay nagpapanatili sa salitang daan at malinaw na tumutukoy sa kawalan ng mapaglilihisan.
- source_word: יָמִין וּשְׂמֹאול
  choice: sa kanan o sa kaliwa
  rationale: Natural na pagpapahayag sa Tagalog ng dalawang posibleng direksiyon ng pagliko.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo; pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Kahulugan ng מַלְאַךְ sa pariralang מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: mensahero ni Yahweh
  rationale: Bagaman leksikal na posible ang “mensahero,” inilalarawan ng nakapaligid na salaysay ang isang sobrenatural na sugo, kaya “anghel” ang pinakanatural nang hindi nagpapasok ng karagdagang doktrina tungkol sa kaniyang identidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpatuloy pa” para sa likas na daloy ng salaysay, ngunit pinanatili sa talababa ang anyong mas malapit sa idyomang Hebreo.
