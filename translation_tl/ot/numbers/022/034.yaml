id: NUM.22.34
reference: Numbers 22:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: tl
  text: Sinabi ni Balaam sa anghel ni Yahweh[a], “Nagkasala ako, sapagkat hindi ko alam na nakatayo ka sa daan upang harapin ako. Ngayon, kung masama ito sa paningin mo[b], babalik ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “kung masama sa iyong mga mata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ ng ‘mensahero’ o ‘anghel.’ Sa salaysay, isang makalangit na nilalang na may hawak na tabak ang humaharang kay Balaam, kaya likas at angkop sa modernong Tagalog ang ‘anghel.’ Pinanatili ang personal na pangalang Yahweh para sa יְהוָה.
- source_word: חָטָאתִי
  choice: Nagkasala ako
  rationale: Tuwirang pagpapahayag ito ng pagkakasala ni Balaam; natural at malinaw sa Tagalog ang aspektong perpektibo na ‘nagkasala.’
- source_word: כִּי לֹא יָדַעְתִּי
  choice: sapagkat hindi ko alam
  rationale: Ang כִּי ay nagbibigay ng dahilan sa naunang pahayag. Ang ‘sapagkat’ ay dignificado ngunit madaling maunawaan.
- source_word: נִצָּב לִקְרָאתִי
  choice: nakatayo ka sa daan upang harapin ako
  rationale: Ipinahihiwatig ng נִצָּב ang matatag na pagtayo, at may salungat na diwa ang לִקְרָאתִי sa konteksto ng nakabunot na tabak. Naipapahayag ng ‘upang harapin ako’ ang pagsalubong bilang paghadlang nang hindi labis na nagpapaliwanag.
- source_word: בַּדָּרֶךְ
  choice: sa daan
  rationale: Payak at natural na panandang-lunan para sa tagpo ng paglalakbay.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: kung masama ito sa paningin mo
  rationale: Pinananatili nito ang literal na idyomang Hebreo at ang moral na bigat ng רַע, sa halip na palambutin bilang ‘hindi mo nagugustuhan.’
- source_word: אָשׁוּבָה לִּי
  choice: babalik ako
  rationale: Ipinapahayag ng cohortative ang kusang pasiya o kahandaang bumalik. Natural itong isinasalin sa Tagalog bilang ‘babalik ako’; hindi kailangang katawanin nang hiwalay ang etikong datibo na לִּי.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulong ‘PANGINOON,’ nang hindi nagdaragdag ng sektaryong pagpapakahulugan.
- issue: Diwa ng לִקְרָאתִי sa tagpong ito
  choice: upang harapin ako
  alternative: upang salubungin ako
  rationale: Ang pandiwa ay maaaring tumukoy sa pagsalubong, ngunit ang nakabunot na tabak at pagharang sa daan ay nagbibigay rito ng salungat na diwa. Ang ‘harapin’ ay nagpapanatili sa tensiyong iyon nang hindi sinasabing higit sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na may dignificado at malinaw na himig. Ginamit ang ‘sapagkat’ at ‘sa paningin mo’ upang mapanatili ang pormal na tono at ang idyoma ng pinagmulan, habang nananatiling madaling maunawaan. Lahat ng panandang talababa ay nasa pangunahing teksto.
