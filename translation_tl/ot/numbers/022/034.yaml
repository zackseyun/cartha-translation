  source_fidelity: 'Tumpak na naisasalin ang pangunahing mga bahagi ng Hebreo: ang pag-amin ni Balaam ng kasalanan, ang dahilan na hindi niya nalaman, ang anghel na nakatayo sa daan upang salubungin o harapin siya, ang idyomang “masama ... sa paningin mo,” at ang kusang pagbabalik. Ang “upang harapin ako” ay isang makatuwirang kontekstuwal na pagsasalin ng לִקְרָאתִי nang hindi lumalayo sa teksto.'
