id: NUM.3.10
reference: Numbers 3:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: tl
  text: Italaga mo si Aaron at ang kanyang mga anak, at pangangalagaan nila ang kanilang tungkulin bilang mga pari. Ngunit ang sinumang tagalabas[a] na lalapit ay papatayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taong hindi awtorisado.” Ang Hebreong “tagalabas” ay tumutukoy rito sa sinumang walang pahintulot na lumapit o gumanap sa gawaing nakalaan sa mga pari, hindi partikular sa isang dayuhan ayon sa lahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: Italaga mo
  rationale: Sa kontekstong ito, ang פקד ay tumutukoy sa pag-aatas o pagtatalaga kina Aaron at sa kanyang mga anak sa katungkulan, hindi sa pagbibilang sa kanila.
- source_word: וְשָׁמְרוּ
  choice: pangangalagaan nila
  rationale: Ipinahihiwatig ng שׁמר ang pag-iingat, pagbabantay, at tapat na pagganap sa ipinagkatiwalang pananagutan; likas sa modernong Tagalog ang “pangangalagaan” sa kontekstong ito.
- source_word: כְּהֻנָּתָם
  choice: ang kanilang tungkulin bilang mga pari
  rationale: Ang כְּהֻנָּה ay tumutukoy sa katungkulan at gawaing pansaserdote, hindi lamang sa abstraktong kalagayan ng pagiging pari. Mas malinaw at natural ito kaysa “kanilang pagkapari.”
- source_word: הַזָּר
  choice: tagalabas
  rationale: Dito, ang זָר ay sinumang wala sa awtorisadong pangkat ng mga pari, hindi partikular na isang dayuhan ayon sa lahi. Pinananatili ng “tagalabas” ang maikli at konkretong anyo ng Hebreo, habang nililinaw sa talababa ang saklaw nito.
- source_word: הַקָּרֵב
  choice: na lalapit
  rationale: Ang participle ng קרב ay tumutukoy sa paglapit sa ipinagbabawal na banal na saklaw o paglilingkod; tuwiran at natural ang “na lalapit.”
- source_word: יוּמָת
  choice: ay papatayin
  rationale: 'Ang Hophal ng מות ay pasibo at may legal na puwersa: ang lumabag ay ipapapatay, hindi lamang basta mamamatay.'
theological_decisions:
- issue: Saklaw ng ipinagbabawal na paglapit sa gawaing pansaserdote
  choice: Ang talata ay nag-aatas kina Aaron at sa kanyang mga anak na pangalagaan ang katungkulan ng mga pari at nagbabala na papatayin ang sinumang hindi kabilang sa awtorisadong pangkat ngunit lalapit.
  alternative: Maaari itong unawain nang mas pangkalahatan bilang pagbabawal sa sinumang hindi pari na lumapit sa banal na dako, nang hindi tinutukoy sa talatang ito lamang ang eksaktong hangganan ng ipinagbabawal na paglapit.
  rationale: Pinananatili ng salin ang natatanging pananagutan ng mga pari at ang mabigat na kaparusahan, ngunit hindi nito dinaragdagan ang teksto ng mga detalyeng ritwal na hindi tahasang narito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “tungkulin bilang mga pari” upang ihayag nang natural ang aktibong diwa ng כְּהֻנָּה, at pinanatili ang legal na bigat ng יוּמָת sa “papatayin.”
