  register: Makabagong Filipino na malinaw at marangal. Pinanatili ang literal na pagpapahayag ng pinagmulang Hebreo sa “mga anak ni Kohat,” at ginamit ang natural na anyong panghinaharap para sa itinakdang kaayusan ng kampo.
