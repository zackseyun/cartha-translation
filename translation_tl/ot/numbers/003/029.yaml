  yaml_path: translation/ot/numbers/003/029.yaml
  text: The clans of the sons of Kohath shall camp on the south side of the tabernacle[a].
translation:
  language: tl
  text: Ang mga angkan ng mga anak ni Kohat ay magkakampo sa timog na bahagi ng tabernakulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga inapo ni Kohat” o “mga Kohatita.” Literal sa Hebreo: “mga anak ni Kohat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa konteksto ng sensus at pagkakaayos ng kampo, tumutukoy ito sa mga pangkat na magkakamag-anak, hindi lamang sa maliliit na sambahayan; malinaw at natural dito ang “mga angkan.”
- source_word: בְּנֵי קְהָת
  choice: mga anak ni Kohat
  rationale: Pinananatili nito ang literal na pananalitang Hebreo tungkol sa angkan o lipi, habang ang mga posibleng kahulugang “mga inapo ni Kohat” at “mga Kohatita” ay inilalagay sa talababa.
- source_word: יַחֲנוּ
  choice: magkakampo
  rationale: Ang imperfect ay nagpapahayag dito ng itinakdang kaayusan ng pagkakampo; natural na ipinahahayag ito sa Filipino sa anyong panghinaharap.
- source_word: עַל יֶרֶךְ
  choice: sa ... bahagi
  rationale: Ang pinagsamang parirala ay tumutukoy sa lokasyon sa isang panig ng tabernakulo; ang “sa ... bahagi” ay malinaw at idiomatiko sa Filipino.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Tumutukoy ito sa banal na toldang santuwaryo sa Aklat ng Mga Bilang; ang “tabernakulo” ang kinikilalang terminong Filipino para rito.
- source_word: תֵּימָנָה
  choice: timog
  rationale: Ipinapahiwatig ng anyong patunguhan ang lokasyon sa dakong timog; kasama ng “bahagi,” natural ang pariralang “timog na bahagi.”
theological_decisions: []
