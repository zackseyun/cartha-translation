base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/018.yaml
  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: tl
  text: 'At ito ang mga pangalan ng mga anak na lalaki ni Gershon ayon sa kani-kanilang angkan: sina Libni at Shimei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ng “At” ang pang-ugnay na ו, habang likas sa Filipino ang “ito ang” bilang panimula ng talaan.
- source_word: שְׁמוֹת
  choice: mga pangalan ng
  rationale: Ang anyong construct ay nag-uugnay sa “mga pangalan” at sa kasunod na pariralang tumutukoy sa mga anak ni Gershon.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: mga anak na lalaki ni Gershon
  rationale: Tiyak na mga lalaking anak ang inililista, kaya mas eksakto rito ang “mga anak na lalaki” kaysa sa mas malawak na “mga inapo.”
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa kontekstong pangsenso at talaangkanan, ang מִשְׁפָּחָה ay tumutukoy sa angkan; ipinahahayag ng parirala ang pagsasaayos ayon sa mga angkan nila.
- source_word: לִבְנִי
  choice: Libni
  rationale: Isinalin sa pamamagitan ng transliterasyon bilang pangalang pantangi.
- source_word: וְ/שִׁמְעִי
  choice: at Shimei
  rationale: Isinalin sa pamamagitan ng transliterasyon ang pangalang pantangi at pinanatili ang pang-ugnay na ו bilang “at.”
