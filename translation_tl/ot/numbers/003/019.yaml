  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: tl
  text: 'At ang mga anak ni Kohat, ayon sa kani-kanilang angkan: sina Amram, Izhar, Hebron, at Uzziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְּנֵי ay construct plural na literal na “mga anak ni.” Bagaman maaari itong tumukoy sa mas malawak na mga inapo sa talaangkanan, ang mga pangalang kasunod ay inilalahad bilang mga anak at pinagmulan ng mga angkan; pinananatili rin ng “At” ang dugtong sa naunang listahan.
- source_word: קְהָת
  choice: Kohat
  rationale: Pangalang pantangi; ginamit ang anyong karaniwan at madaling bigkasin sa modernong Filipino.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה ay tumutukoy sa angkan bilang pangkat sa loob ng tribo, hindi lamang sa sambahayang pamilya. Ipinahihiwatig ng hulaping pangmaramihan na ang tala ay inayos ayon sa mga angkang nauukol sa kanila.
- source_word: עַמְרָם
  choice: Amram
  rationale: Pangalang pantangi; tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: וְיִצְהָר
  choice: Izhar
  rationale: Pangalang pantangi; ang pang-ugnay ay likas na isinama sa bantas at sa “at” bago ang huling pangalan sa listahan.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Pangalang pantao sa kontekstong ito, bagaman kapareho ng anyo ng pangalan ng isang lugar.
- source_word: וְעֻזִּיאֵל
  choice: at Uziel
  rationale: Pangalang pantangi; tahasang isinalin ang pang-ugnay na וְ bilang “at” sa hulihan ng listahan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” upang maipakita ang panlipunan at pangkanunu-nunuang diwa ng מִשְׁפָּחָה; ginamit ang “sina” bago ang talaan ng mga pangalan para sa natural na balarilang Filipino.
