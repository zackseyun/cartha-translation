base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: tl
  text: Ibibigay mo ang mga Levita kay Aaron at sa kanyang mga anak; sila mismo ay lubusang ibinigay[a] sa kanya mula sa gitna ng mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Inuulit sa Hebreo ang “ibinigay” upang magbigay-diin: “ibinigay, ibinigay,” o “tiyak na ibinigay.”'
    reason: lexical_alternative
  - marker: b
    text: 'O “mula sa mga Israelita.” Sa Hebreo: “mula sa mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Ibibigay mo
  rationale: Ang Qal perfect na may waw sa kontekstong nagbibigay ng tagubilin ay may puwersa ng utos; natural sa modernong Tagalog ang anyong panghinaharap bilang direktiba.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Ito ang karaniwan at kinikilalang tawag sa mga kabilang sa lipi ni Levi na itinalaga sa paglilingkod sa santuwaryo.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kay Aaron at sa kanyang mga anak
  rationale: Ipinahihiwatig ng ל ang pinagbigyan o pinakinabangan; pinananatili ng salin ang diwa ng paglilipat o pagtatalaga.
- source_word: נְתוּנִם נְתוּנִם
  choice: lubos na ibinigay
  rationale: Ang pag-uulit ng passive participle ay nagbibigay-diin. Mas natural sa Tagalog ang “lubos na ibinigay,” habang inilalahad sa talababa ang literal na pag-uulit.
- source_word: הֵמָּה
  choice: sila ay
  rationale: Pinananatili ang hiwalay na panghalip upang maipakita ang diin ng Hebreo nang hindi nagiging pilit.
- source_word: לוֹ
  choice: sa kanya
  rationale: Tumutukoy ito kay Aaron sa pinakamalapit na konteksto at angkop sa diwa ng pagkakaloob o pagtatalaga.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  rationale: 'Ipinapakita ng parirala ang pinagmulan: ang mga Levita ay ibinukod mula sa mas malawak na sambayanan. Pinananatili rin nito ang pampamilya at pangtipang ekspresyon ng Hebreo.'
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Literal na “mga anak ni Israel” ang pananalita ng Hebreo at may pampamilya at pangtipang kulay. Inilalagay sa talababa ang mas maikli at likas na kolektibong alternatibo nang hindi inaalis ang anyo ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “mga Levita” bilang nakaugaliang katawagan, “Ibibigay mo” para sa utos na nakasaad sa anyong panghinaharap, at “lubos na ibinigay” upang natural na maihatid ang diin ng pag-uulit sa Hebreo. Ang mga pananda ng talababa ay parehong lumilitaw sa pangunahing teksto.
