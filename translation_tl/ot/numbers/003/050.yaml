base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: tl
  text: 'Mula sa mga panganay na anak na lalaki ng Israel[a] ay kinuha niya ang pilak: 1,365 siklo, ayon sa siklo ng santuwaryo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga panganay ng mga anak ni Israel.” Literal na “panganay ng mga anak na lalaki ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O, “ayon sa pamantayang siklo ng santuwaryo.” Tinutukoy ng parirala ang pamantayang timbang na ginagamit sa santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: Mula sa
  rationale: Ipinakikilala nito ang pangkat na pinagmulan ng pilak; natural sa Tagalog ang “mula sa” nang hindi dinaragdagan ang diwa.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: mga panganay na anak ng Israel
  rationale: Kolektibo ang anyong isahan ng בְּכוֹר sa kontekstong ito. Pinananatili ng “mga panganay na anak ng Israel” ang pagtukoy sa mga anak na lalaki sa konteksto ng sensus at pagtubos.
- source_word: לָקַח
  choice: kinuha niya
  rationale: Tuwirang katumbas ito ng karaniwang kahulugang “kumuha,” at ang nakaraang konteksto ang nagpapalinaw na ito ay pagtanggap ng salaping pantubos.
- source_word: הַכָּסֶף
  choice: ang pilak
  rationale: Ang כֶּסֶף ay literal na “pilak” at maaari ring tumukoy sa salapi. Ang “pilak” ay nagpapanatili sa materyal na termino at ang kasunod na bilang ng mga siklo ang nagpapalinaw sa gamit nito bilang salapi.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: 1,365
  rationale: Isinaayos bilang karaniwang bilang sa modernong Tagalog upang maging malinaw at madaling basahin.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Ipinahihiwatig ng parirala ang pamantayang timbang na kaugnay ng santuwaryo. Natural at tumpak sa Tagalog ang “ayon sa siklo ng santuwaryo.”
