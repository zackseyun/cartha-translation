base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: tl
  text: At binilang ni Moises ang bawat panganay sa gitna ng mga anak ni Israel[a], ayon sa iniutos ni Yahweh sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel”; maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: binilang
  rationale: Sa konteksto ng sensus, ang pandiwang פקד ay tumutukoy sa pagbilang ng mga tao. Ang “binilang” ay malinaw at likas sa makabagong Tagalog.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Ipinapahayag ng parirala na ang ginawa ni Moises ay kasunod at kaayon mismo ng utos ni Yahweh.
- source_word: צִוָּה
  choice: iniutos
  rationale: Likas sa Tagalog ang “gaya ng iniutos” at malinaw na nauna ang utos sa isinagawang pagbilang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֹתוֹ
  choice: sa kanya
  rationale: Tumutukoy ang panghalip kay Moises bilang tumanggap ng utos.
- source_word: אֶת כָּל בְּכֹר
  choice: ang bawat panganay
  rationale: Pinananatili ng “bawat panganay” ang distributibong diwa ng כָּל. Hindi idinagdag ang “lalaki” sapagkat wala itong tahasang katumbas sa talatang ito.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili nito ang kinship expression ng Hebreo, habang ang “sa” ay likas na nagpapahayag ng saklaw ng pagbilang sa Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tahasan sa tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay transliterasyon ng personal na pangalan at hindi pagpapalit nito ng titulo.
- issue: Paglilipat ng pariralang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng napiling anyo ang larawan ng pinagmulang angkan sa Hebreo. Sa Tagalog, ang “mga anak” ay hindi kailangang tumukoy lamang sa mga lalaki, kaya hindi idinagdag ang “na lalaki.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang payak na “binilang” sa halip na mas teknikal na “nagsagawa ng sensus,” at pinanatili ang tradisyonal na biblikal na pariralang “mga anak ni Israel” na may paliwanag sa talababa.
