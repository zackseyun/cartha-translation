translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignipikado, at madaling maunawaan. Ginamit ang “sambahayan ng kanilang mga ninuno” upang likas na maipahayag ang sinaunang genealogical na yunit, habang inilagay sa talababa ang mas literal na “sambahayan ng kanilang mga ama.”
