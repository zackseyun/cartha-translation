  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: tl
  text: Bilangin mo ang mga anak ni Levi ayon sa mga sambahayan ng kanilang mga ama[a] at ayon sa kanilang mga angkan. Bilangin mo ang bawat lalaking isang buwang gulang pataas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa mga sambahayan ng kanilang mga ninuno.” Literal na “ayon sa bahay ng kanilang mga ama,” isang yunit ng angkan na sinusundan sa panig ng ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: Bilangin mo / Bilangin mo
  rationale: Sa kontekstong administratibo, ang pandiwa ay tumutukoy sa pagbilang o pagtatala. Malinaw at likas sa modernong Tagalog ang “bilangin,” at pinananatili nito ang pautos na anyo nang walang idinadagdag na pahiwatig na militar.
- source_word: בְּנֵי לֵוִי
  choice: ang mga anak ni Levi
  rationale: Literal itong “mga anak ni Levi” at hayagang pinananatili ang genealogical na balangkas. Bagaman maaaring sabihing “mga Levita,” mas angkop dito ang literal na anyo dahil kasunod na binabanggit ang mga sambahayan ng mga ninuno at mga angkan.
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa sambahayan ng kanilang mga ninuno
  rationale: Ang parirala ay tumutukoy sa yunit ng angkan na nakabatay sa sambahayan ng ama. Ang “sambahayan ng kanilang mga ninuno” ay natural at marangal sa Tagalog, habang pinananatili ang pagkakaiba nito sa kasunod na “mga angkan.”
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Ang “mga angkan” ay nagpapahayag ng yunit ng pagkakamag-anak at hindi inuulit ang “sambahayan,” kaya malinaw ang dalawang antas ng kaayusang genealogical.
- source_word: כָּל זָכָר
  choice: ang bawat lalaki
  rationale: Tinutukoy ng Hebreo ang kasariang lalaki, hindi ang pagiging nasa hustong gulang. Sa Tagalog, maaaring tumukoy ang “lalaki” sa batang lalaki o sanggol na lalaki ayon sa konteksto, at nililinaw ng kasunod na takdang edad ang saklaw.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: na isang buwang gulang pataas
  rationale: Natural at eksaktong ipinahahayag nito ang pinakamababang edad na kasama sa bilang, habang nananatiling malapit sa Hebreong idyoma.
