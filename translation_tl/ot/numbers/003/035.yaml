  naturalness: Marangal at malinaw sa kabuuan ang draft. Gayunman, ang “sambahayan ng mga ninuno para sa mga angkan” ay mabigat at hindi gaanong likas. Ang “sambahayan ng ama” ay isang teknikal na katawagang mas malapit sa Hebreo at nililinaw ng talababa.
