base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: tl
  text: At ang pinunong[a] namamahala sa sambahayan ng ama[b] ng mga angkan ni Merari ay si Zuriel na anak ni Abihail. Magkakampo sila sa hilagang panig ng tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinuno” o “prinsipe”; ang salitang Hebreo ay tumutukoy sa isang kinikilalang pinuno.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sambahayan ng ama,” isang katawagan sa pangkat ng magkakamag-anak na nagmula sa iisang ninuno sa panig ng ama.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: Ang pinuno
  rationale: Sa kontekstong ito ng kaayusan ng mga Levita, ang נָשִׂיא ay kinikilalang pinuno; iniiwasan ng “pinuno” ang maharlikang pahiwatig ng “prinsipe.” Hindi kailangang tahasang isalin ang וּ bilang “at” sa Filipino sa simula ng isang talaan.
- source_word: בֵית אָב
  choice: sambahayan ng mga ninuno
  rationale: Tumutukoy ito sa yunit ng kamag-anakang nakabatay sa angkan ng ama, hindi lamang sa isang bahay o nuklear na pamilya.
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: para sa mga angkan ni Merari
  rationale: Ang מִשְׁפָּחוֹת dito ay mga sangay ng angkan, at ang לְ ay pinananatili bilang ugnayang “para sa,” na nagpapahayag ng saklaw ng pamumuno.
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: si Zuriel na anak ni Abihail
  rationale: Ginamit ang likas na anyong Filipino para sa pangalan at ugnayang genealogical.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: sa ... panig ng tabernakulo
  rationale: Ang יֶרֶךְ ay literal na tagiliran o panig; sa paglalarawan ng puwesto ng kampo, natural ang “panig.” Ang מִשְׁכָּן ay isinaling “tabernakulo,” ang nakaugaliang katawagan sa santuwaryong tolda.
- source_word: יַחֲנוּ צָפֹנָה
  choice: Magkakampo sila sa hilagang panig
  rationale: Ang imperfect ay nagpapahayag ng itinakdang kaayusan ng pagkakampo. Ang צָפֹנָה ay direksiyonal at likas na isinasama sa pariralang “sa hilagang panig.”
