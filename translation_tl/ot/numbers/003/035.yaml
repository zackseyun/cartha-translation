translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinili ang “angkan” para sa mas malawak na yunit ng kamag-anakan at “sambahayan ng mga ninuno” upang mapanatili ang sinaunang istrukturang panlipunan nang hindi tunog-sobrang literal.
