  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh[a] kay Moises sa ilang ng Sinai at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: Ipinababatid ang anyong Hebreo at ang tradisyonal na salin ng banal na pangalan.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive imperfect ng דבר ay bahagi ng karaniwang pormula sa pagsisimula ng banal na pahayag; natural at tumpak sa modernong Tagalog ang “Nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa taong kinakausap, at natural itong ipinapahayag sa Tagalog sa pamamagitan ng “kay.”
- source_word: בְּמִדְבַּר סִינַי
  choice: sa ilang ng Sinai
  rationale: Ang מִדְבָּר ay lupaing ilang o di-tinatahanang kaparangan, hindi kinakailangang lubhang tigang; ang “ilang ng Sinai” ay maikli at angkop sa gamit ng Pentateuco.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ipinahihiwatig ng infinitive construct na kasunod ang mismong nilalaman ng pahayag. Mas natural sa Tagalog ang hiwalay na “Sinabi niya,” kaysa sa literal ngunit mabigat na “na sinasabi.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” at hindi ipinapalit ang tradisyonal na anyong “Jehovah.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Hinati sa dalawang pangungusap ang pormulang Hebreo upang maging natural ang daloy habang malinaw na ipinakikilalang kasunod ang nilalaman ng pahayag.
