base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: tl
  text: Ang bilang ng lahat ng lalaking mula isang buwang gulang pataas ay 8,600; sila ang inatasang magbantay sa santuwaryo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mga banal na bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: Ang bilang ng lahat ng lalaki
  rationale: Ang pariralang Hebreo ay pormula ng sensus. Likas sa modernong Filipino ang “ang bilang ng lahat ng lalaki” at pinananatili nito ang tiyak na pagtukoy sa mga lalaki.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: isang buwang gulang pataas
  rationale: Ito ang natural at maikling katumbas ng Hebreong pananalita para sa takdang edad na nagsisimula sa isang buwan.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 8,600
  rationale: Eksaktong inilalahad ang bilang sa paraang madaling mabasa sa isang talata ng sensus.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: may pananagutang mag-ingat
  rationale: Ang magkaugnay na mga salitang Hebreo ay tumutukoy sa patuloy na pagtupad sa ipinagkatiwalang tungkulin. Iniiwasan ng saling ito ang alanganing pag-uulit ngunit pinananatili ang diwa ng pangangalaga at pananagutan.
- source_word: הַקֹּדֶשׁ
  choice: santuwaryo
  rationale: Sa kontekstong Levitico, maaaring tumukoy ang termino sa sagradong saklaw na ipinagkatiwala sa mga Kohatita. Ang “santuwaryo” ay natural at marangal, habang kinikilala sa talababa ang posibleng pagtukoy sa mga banal na bagay.
theological_decisions:
- issue: Saklaw ng הַקֹּדֶשׁ
  choice: santuwaryo
  alternative: mga banal na bagay
  rationale: Maaaring tumukoy ang pangngalan sa banal na lugar o, bilang kolektibong katawagan, sa mga sagradong kagamitan. Hindi nilulutas nang tahimik ang leksikal na kalabuan; inilalagay ang makabuluhang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lalaki” sa halip na mas pormal na “lalaking anak,” at ang mga digit para madaling makita ang bilang sa konteksto ng sensus. Ang pangalawang pangungusap ay nagpapalinaw sa relasyon ng participial clause nang hindi nagdaragdag ng bagong paksa.
