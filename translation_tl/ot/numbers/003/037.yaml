translation:
  language: tl
  text: at ang mga haligi sa palibot ng looban, at ang mga patungan[a] nito, at ang mga tulos nito, at ang mga tali[b] nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga salalayan.” Ang salitang Hebreo ay maaaring tumukoy sa mga base, lalo na sa mga paglalarawan ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga lubid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: mga haligi
  rationale: Tumutukoy sa mga patayong suporta ng bakod ng looban; ang “mga haligi” ay malinaw, likas, at angkop sa paglalarawan ng tabernakulo.
- source_word: הֶחָצֵר
  choice: looban
  rationale: Tumutukoy sa court o bakurang nakapaligid sa tabernakulo. Ang “looban” ay karaniwang salitang Filipino para sa ganitong nakapaloob na lugar.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Pinananatili ang diwang ang mga haligi ay nasa buong paligid ng looban.
- source_word: אַדְנֵיהֶם
  choice: mga patungan ng mga ito
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa mga baseng kinalalagyan o kinasasalpakan ng mga haligi. Mas madaling maunawaan ang “patungan” kaysa sa teknikal na hiram na salita.
- source_word: יְתֵדֹתָם
  choice: mga tulos ng mga ito
  rationale: Tumutukoy sa mga tulos na ipinapako sa lupa upang mapirmi ang kayarian; maikli at likas itong katumbas sa Filipino.
- source_word: מֵיתְרֵיהֶם
  choice: mga tali ng mga ito
  rationale: Tumutukoy sa mga panaling ginagamit kasama ng mga tulos upang patatagin ang kayarian. Ang “mga tali” ay malinaw at pangkaraniwan.
- source_word: וְ
  choice: at
  rationale: Inulit ang “at” upang mapanatili ang anyong patuloy at sunod-sunod na talaan sa Hebreo.
