translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang panimulang “at” at ang paulit-ulit na pangatnig upang ipakitang pagpapatuloy ito ng talaan sa naunang talata. Inilagay ang mga talababa sa mismong mga salitang tinatalakay ng mga ito.
