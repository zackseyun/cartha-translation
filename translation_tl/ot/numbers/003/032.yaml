  text: וּ/נְשִׂיא֙ נְשִׂיאֵ֣י הַ/לֵּוִ֔י אֶלְעָזָ֖ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֑ן פְּקֻדַּ֕ת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/032.yaml
  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: tl
  text: Ang punong namamahala sa mga pinuno ng mga Levita ay si Eleazar na anak ng paring si Aaron. Siya ang nangangasiwa sa mga tumutupad sa tungkuling pangalagaan ang santuwaryo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga banal na bagay.” Ang salitang Hebreo ay maaaring tumukoy sa santuwaryo mismo o sa mga sagradong bagay na kaugnay nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: Ang punong namamahala sa mga pinuno ng mga Levita
  rationale: Ang נָשִׂיא ay pinuno o nakatataas na opisyal, hindi kinakailangang maharlika. Nililinaw ng “namamahala sa” ang ugnayan ng nakatataas na pinuno sa iba pang mga pinunong Levita, ayon sa gamit sa kontekstong pang-organisasyon.
- source_word: אֶלְעָזָר בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: si Eleazar na anak ng paring si Aaron
  rationale: Pinananatili ang ugnayang mag-ama at nililinaw sa natural na Tagalog na ang “pari” ay tumutukoy kay Aaron.
- source_word: פְּקֻדַּת
  choice: Siya ang nangangasiwa
  rationale: Dito, ang פְּקֻדָּה ay tumutukoy sa pananagutan o pangangasiwa ni Eleazar. Ginawang hiwalay na pangungusap upang maging malinaw at natural sa modernong Tagalog.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: mga tumutupad sa tungkuling pangalagaan
  rationale: Ang magkaugnay na pandiwa at pangngalan ay nagpapahayag ng ipinagkatiwalang pananagutang bantayan o ingatan, hindi lamang ng pagiging mga bantay.
- source_word: הַקֹּדֶשׁ
  choice: ang santuwaryo
  rationale: Sa konteksto ng tabernakulo, maaaring tumukoy ang salita sa banal na dako o sa mga banal na bagay. Ang “santuwaryo” ang pinakamalinaw na pangunahing salin, habang inilalahad sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Ang saklaw ng הַקֹּדֶשׁ
  choice: santuwaryo
  alternative: mga banal na bagay
  rationale: Kapuwa posible sa Hebreo ang banal na dako at ang mga sagradong bagay na kaugnay nito. Pinili sa teksto ang lokatibong kahulugan dahil sa konteksto, ngunit hindi inalis ang leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “punong namamahala” upang ipahayag ang ranggo nang hindi nagpapahiwatig ng pagkamaharlika, at “santuwaryo” bilang pamilyar na terminong panrelihiyon.
