translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Gumamit ng tuwirang pautos na “Bilangin mo” at “itala mo,” at pinanatili ang “mga anak ni Israel” upang manatiling malapit sa anyo ng Hebreo.
