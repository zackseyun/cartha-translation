  to: Pagkatapos, sinabi ni Yahweh kay Moises, “Bilangin mo ang bawat panganay na lalaki sa mga anak ni Israel, mula sa isang buwang gulang pataas, at itala mo ang bilang ayon sa kanilang mga pangalan.[a]”
