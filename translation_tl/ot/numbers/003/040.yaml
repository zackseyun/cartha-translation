base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Bilangin mo ang bawat panganay na lalaki sa mga anak ni Israel, mula sa isang buwang gulang pataas, at itala mo ang bilang ayon sa kanilang mga pangalan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “kunin mo ang bilang ng kanilang mga pangalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural sa modernong Tagalog ang “Pagkatapos” bilang panandang sunuran.
- source_word: פְּקֹד
  choice: Bilangin mo
  rationale: Sa konteksto ng sensus, ang pautos na pandiwa ay nangangahulugang bilangin o magsagawa ng pagbilang.
- source_word: כָּל בְּכֹר זָכָר
  choice: ang bawat panganay na lalaki
  rationale: Pinananatili ng “panganay” ang katayuan sa kapanganakan at ng “lalaki” ang tahasang pagtukoy sa kasarian.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Malapit ito sa literal na “mga anak ni Israel” at likas ding nagpapahayag ng pangkat na pagmumulan ng mga bibilangin.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: mula sa isang buwang gulang pataas
  rationale: Malinaw at natural nitong ipinapahayag ang pinakamababang edad na saklaw ng pagbilang.
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: at itala mo sila ayon sa pangalan
  rationale: Ang literal na idyomang “kunin/dalhin ang bilang ng kanilang mga pangalan” ay tumutukoy sa pagbilang na nakapangalan; ipinapahayag ito nang malinaw sa natural na Tagalog.
