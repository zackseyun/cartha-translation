  text: הַקְרֵב֙ אֶת מַטֵּ֣ה לֵוִ֔י וְֽ/הַעֲמַדְתָּ֣ אֹת֔/וֹ לִ/פְנֵ֖י אַהֲרֹ֣ן הַ/כֹּהֵ֑ן וְ/שֵׁרְת֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: tl
  text: Ilapit mo ang lipi ni Levi at iharap mo sila kay Aaron na pari; paglilingkuran nila siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magsisilbi sila sa kaniya.” Ang pandiwang Hebreo ay maaaring tumukoy sa paglilingkod bilang tagapaglingkod o sa paglilingkod na kaugnay ng banal na gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: Ilapit mo
  rationale: Ang Hiphil na pautos ng קרב ay nangangahulugang papalapitin o ilapit. Pinananatili ng “ilapit mo” ang kongkretong diwa ng pagdadala sa malapit.
- source_word: מַטֵּה לֵוִי
  choice: ang lipi ni Levi
  rationale: Bagaman maaaring literal na mangahulugang “tungkod” ang מַטֶּה, tumutukoy ito rito sa pangkat-panlipi ni Levi. Ang “lipi” ang likas at malinaw na katumbas sa Filipino.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: at iharap mo sila
  rationale: Ang Hiphil ng עמד ay ‘patayuin,’ ‘ilagay,’ o ‘iharap.’ Ang “iharap” ay natural sa pormal na paghaharap kay Aaron. Ginamit ang maramihang “sila” dahil mga Levita ang tinutukoy ng kolektibong “lipi.”
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: kay Aaron na pari
  rationale: Ipinahihiwatig na ng pandiwang “iharap” ang לִפְנֵי (‘sa harap ni’), kaya malinaw at likas ang “iharap ... kay Aaron.” Ang katungkulan niyang pari ay tahasang pinanatili.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: paglilingkuran nila siya
  rationale: Ang שרת ay tumutukoy sa paglilingkod bilang tagapaglingkod o sa ministeryal/liturgikal na paglilingkod. Pinananatili ng “paglilingkuran nila siya” ang tahasang layon na si Aaron at ang panghinaharap na diwa ng sugnay.
theological_decisions:
- issue: Ang uri at layon ng paglilingkod ng mga Levita
  choice: Ang mga Levita ay ihaharap kay Aaron upang maglingkod sa kaniya sa kaniyang tungkulin bilang pari.
  alternative: Ang mga Levita ay maglilingkod kasama ni Aaron sa halip na maglingkod sa kaniya.
  rationale: Ang tuwirang layon na panghalip sa וְשֵׁרְתוּ אֹתוֹ ay pinakanatural na tumutukoy kay Aaron. Kaya hindi ito pinalabo bilang paglilingkod lamang na kasama niya, habang hindi rin nililimitahan ang eksaktong anyo ng kanilang serbisyo.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginawang maramihan ang panghalip para sa kolektibong “lipi,” alinsunod sa maramihang pandiwa sa Hebreo. Ang semicolon ay nagpapakita ng paglipat mula sa dalawang utos tungo sa magiging tungkulin ng mga Levita.
