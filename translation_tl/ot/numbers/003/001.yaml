  terminology: Ang “mga salinlahi” ay angkop para sa pormal na heading at hindi nito nililimitahan ang kahulugan sa mga literal na inapo lamang. Wasto at pare-pareho ang “Yahweh,” “Moises,” at “Bundok Sinai.” Ang mga talababa ay wastong nakakabit at kapaki-pakinabang sa mga alternatibong pagbasa.
