  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili nito ang pormulang pambungad na “Ito ang,” ang malawak na saklaw ng תּוֹלְדֹת sa “mga salinlahi,” kapwa Aaron at Moises, ang temporal na idyomang בְּיוֹם, ang pangalang Yahweh, at ang lokasyong Bundok Sinai. Ang “kinausap ni Yahweh si Moises” ay isang katanggap-tanggap na modernong Tagalog na paglalapat ng דִּבֶּר ... אֶת מֹשֶׁה, nang hindi ipinipilit ang ganap na reciprocity ng pag-uusap.'
