id: NUM.3.1
reference: Numbers 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה בְּ/י֗וֹם דִּבֶּ֧ר יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: tl
  text: Ito ang mga salinlahi nina Aaron at Moises[a] noong panahong[b] kinausap ni Yahweh si Moises[c] sa Bundok Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga inapo nina Aaron at Moises.” Ang salitang Hebreo ay isang karaniwang pormula ng pamagat na maaaring magpakilala ng angkan o ng nagmula sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa araw nang”; isang idyomang Hebreo na maaaring mangahulugang “noong panahong” o “nang.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nakipag-usap si Yahweh kay Moises” o “nagsalita si Yahweh kay Moises.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Likas na pormula sa modernong Tagalog para sa pagpapakilala ng bagong bahagi; hindi kailangang isalin nang tahasan ang pang-ugnay na וְ.
- source_word: תּוֹלְדֹת
  choice: mga salinlahi
  rationale: Pinananatili ang pormal at malawak na saklaw ng terminong Hebreo, na maaaring tumukoy sa angkan, mga inapo, o sa nagmula sa isang tao. Hindi nito nilulutas ang tensiyon na kapwa pinangalanan sina Aaron at Moises bagaman ang kasunod ay nakatuon sa mga anak ni Aaron.
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: Aaron at Moises
  rationale: Kapwa pangalan ay pinanatili gaya ng nasa Hebreo; ginamit ang karaniwang anyong Tagalog ng Moises at ang malaganap na anyo ng Aaron.
- source_word: בְּיוֹם
  choice: noong panahong
  rationale: Idyomatikong ipinahahayag sa Tagalog ang Hebreong literal na 'sa araw nang'; tumutukoy ito rito sa panahon o pagkakataon, hindi kinakailangang sa iisang araw lamang.
- source_word: דִּבֶּר ... אֶת מֹשֶׁה
  choice: kinausap ... si Moises
  rationale: Natural na Tagalog para sa pagsasalita ni Yahweh kay Moises. Hindi ipinapalagay ng salin na isang panig lamang o ganap na kapwa ang usapan; inilalahad sa talababa ang posibleng 'nakipag-usap.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּהַר סִינָי
  choice: sa Bundok Sinai
  rationale: Karaniwan at malinaw na heograpikong pagpapahayag sa modernong Tagalog.
theological_decisions:
- issue: Ang banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; ang 'Yahweh' ay mas tuwirang kumakatawan rito kaysa sa pagpapalit ng titulo.
- issue: Saklaw ng תּוֹלְדֹת sa pamagat na kapwa bumabanggit kina Aaron at Moises
  choice: mga salinlahi nina Aaron at Moises
  alternative: mga inapo nina Aaron at Moises; angkan nina Aaron at Moises
  rationale: Pinananatili ang dalawang pangalang nasa pinagmulan at ang malawak na pormula ng pamagat, sa halip na ipakahulugang si Aaron lamang ang tinutukoy dahil sa kasunod na talaan.
- issue: Ugnayan ng pagsasalita sa pariralang דִּבֶּר ... אֶת
  choice: kinausap ni Yahweh si Moises
  alternative: nakipag-usap si Yahweh kay Moises; nagsalita si Yahweh kay Moises
  rationale: Ang 'kinausap' ay natural at sapat na malapit sa konstruksiyong Hebreo. Ang posibleng diin sa pakikipag-usap ay pinananatili sa talababa nang hindi ipinipilit sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na himig ng pambungad na pormula, habang ginawang likas ang idyomang temporal at ang pandiwa ng pagsasalita.
