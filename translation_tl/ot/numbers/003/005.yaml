base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh kay Moises[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring isaling “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at Piel na anyo ng דבר ay nagpapatuloy sa salaysay at bumubuo ng karaniwang panimula sa banal na pahayag. Ang “nagsalita” ay mas tuwirang katumbas kaysa “nagsabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang likas na anyo sa modernong Tagalog bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ang infinitive construct ay pormulang nagpapakilala sa susunod na mismong pahayag. Pinananatili ng “na sinasabi” ang istruktura at bahagyang pormal na himig ng Hebreo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan, samantalang ang “Jehovah” ay alternatibong nakaugaliang anyo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang pormulang “na sinasabi” dahil ang nilalaman ng pahayag ay sumusunod sa susunod na talata; sadyang mas pormal ito kaysa sa karaniwang usapan.
