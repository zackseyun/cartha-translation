  naturalness: Likas at marangal sa modernong Filipino ang “Ingatan nila ... at tuparin ang tungkulin ... upang maisagawa ...” Ang “tungkulin ng mga anak ni Israel” ay mas tuwiran kaysa “tungkuling iniatas sa mga anak ni Israel.”
  terminology: Ang “kagamitan,” “tolda ng pagpupulong,” “mga anak ni Israel,” “paglilingkod,” at “tabernakulo” ay angkop at magkakatugma sa kontekstong pangsantuwaryo. Ang dalawang katawagang pangsantuwaryo ay wastong kumakatawan sa magkaibang Hebreong termino, אֹהֶל מוֹעֵד at מִשְׁכָּן.
