  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: tl
  text: Ingatan nila ang lahat ng kagamitan sa tolda ng pagpupulong at tuparin ang tungkulin ng mga anak ni Israel[a], upang maisagawa ang paglilingkod sa tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang tungkuling para sa mga anak ni Israel.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Ingatan nila
  rationale: Sa kontekstong pangsantuwaryo, ang שׁמר ay tumutukoy sa pagbabantay at maingat na pagtupad sa ipinagkatiwalang pananagutan; likas at sapat na malawak ang “ingatan” sa Tagalog.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: ang lahat ng kagamitan sa tolda ng pagpupulong
  rationale: Ang כְּלִים ay pangkalahatang tawag sa mga kasangkapan, sisidlan, at iba pang gamit; hindi ito di-kinakailangang nililimitahan ng “kagamitan.”
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagpupulong
  rationale: Pinananatili nito kapwa ang larawan ng tolda at ang diwa ng itinakdang pakikipagtagpo.
- source_word: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: ang tungkuling iniatas sa mga anak ni Israel
  rationale: Ang מִשְׁמֶרֶת ay isang ipinagkatiwala o iniatas na pananagutan. Nililinaw ng parirala ang relasyon nito sa Israel habang pinananatili sa talababa ang posibleng pagkakaunawang ang tungkulin ay para sa kapakanan nila.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Ito ang natural at tradisyonal na salin ng Hebreong pananalitang panlalaking ginagamit bilang kolektibong katawagan sa bansa.
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: upang maisagawa ang paglilingkod sa tabernakulo
  rationale: Ipinahihiwatig ng ל ang layunin, at ang עבד/עֲבֹדָה rito ay nakatuon sa gawaing pangsantuwaryo. Ang “paglilingkod” ay mas angkop kaysa pangkalahatang “trabaho.”
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Karaniwang terminong Filipino para sa naililipat na santuwaryo sa ilang; naiiba rin ito sa mas malawak na katawagang “tolda ng pagpupulong.”
theological_decisions:
- issue: Ugnayan ng מִשְׁמֶרֶת sa mga anak ni Israel
  choice: tungkuling iniatas sa mga anak ni Israel
  alternative: tungkuling ginagampanan para sa mga anak ni Israel
  rationale: Maaaring ipakahulugan ang genitibong parirala bilang tungkuling nagmumula o ipinagkakatiwala mula sa Israel, o tungkuling ginagampanan alang-alang sa kanila. Pinili sa teksto ang mas malapit na anyong “iniatas sa,” ngunit hindi inalis ang alternatibo.
- issue: Panlalaking kolektibong katawagan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng “mga anak ni Israel” ang tahasang anyo ng Hebreo, habang nauunawaan pa rin bilang katawagan sa buong bayang Israel.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “tolda ng pagpupulong” at “tabernakulo” bilang magkaibang katawagang pangsantuwaryo; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
