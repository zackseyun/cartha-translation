base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/047.yaml
  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: tl
  text: Kumuha ka ng tig-lilimang siklo para sa bawat isa[a], ayon sa siklo ng santuwaryo[b]; ang isang siklo ay dalawampung gera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “tig-lilimang siklo sa bawat ulo.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ayon sa pamantayang timbang ng santuwaryo; ang isang siklo ay katumbas ng dalawampung gera.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kumuha ka
  rationale: Ang Qal perfect na may prefixed conjunction ay gumaganap bilang utos sa kontekstong ito. Natural at malinaw sa makabagong Tagalog ang anyong pautos.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים
  choice: tig-lilimang siklo
  rationale: Ang pag-uulit ng bilang sa Hebreo ay distributibo. Ipinahahayag ng “tig-lilima” ang halagang kukunin mula sa bawat isa nang hindi ginagaya nang mekanikal ang pag-uulit.
- source_word: לַגֻּלְגֹּלֶת
  choice: para sa bawat isa
  rationale: Literal itong “sa bawat ulo,” ngunit idyoma ito para sa bawat tao. Pinananatili sa talababa ang mas literal na anyo.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Tinutukoy nito ang pamantayang timbang na kaugnay ng santuwaryo. Ang “ayon sa” ay malinaw na naghahayag ng batayan ng pagsukat.
- source_word: תִּקָּח ... הַשָּׁקֶל
  choice: ang isang siklo ay
  rationale: Bagaman pandiwa rin ang תִּקָּח, ang sugnay ay natural na nauunawaan bilang paglilinaw sa halaga ng pamantayang siklo; iniiwasan nito ang di-likas na literal na ayos sa Tagalog.
- source_word: עֶשְׂרִים גֵּרָה
  choice: dalawampung gera
  rationale: Pinananatili ang teknikal na Hebreong yunit ng timbang sa transliterasyong “gera,” kasunod ng bilang.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “siklo” at “gera” bilang nakaugaliang transliterasyon ng mga sinaunang yunit, at ang “santuwaryo” upang mapanatili ang kultikong sanggunian nang walang dagdag na interpretasyong denominasyonal.
