source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: tl
  text: Kunin mo ang mga Levita bilang kapalit ng bawat panganay na kabilang sa mga anak ni Israel[a], at ang mga alagang hayop ng mga Levita bilang kapalit ng kanilang mga alagang hayop. Ang mga Levita ay magiging akin. Ako si Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga Israelita.” Ang literal na Hebreo ay “sa mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Kunin mo
  rationale: Tuwirang utos ito kay Moises. Likas sa modernong Tagalog ang “kunin mo” at napananatili nito ang lakas ng imperatibo.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa Tagalog para sa mga kabilang sa lipi ni Levi.
- source_word: תַּחַת
  choice: bilang kapalit ng
  rationale: Sa kontekstong ito, nagpapahayag ang salita ng pagpapalit o representasyong pamalit, hindi ng lokasyong “sa ilalim ng.”
- source_word: כָּל בְּכוֹר
  choice: bawat panganay
  rationale: Naipahahayag ng “bawat” ang distributibong diwa ng כָּל na kasama ng pang-isahang בְּכוֹר.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili nito ang Hebreong idyoma habang nananatiling malinaw sa Tagalog; ang “sa” ay nagpapakita na ang mga panganay ay kabilang sa pangkat na tinutukoy.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: ang mga alagang hayop ng mga Levita
  rationale: Ang בְּהֵמָה ay kolektibong tumutukoy rito sa mga hayop na pag-aari at inaalagaan. Mas karaniwan at malinaw sa Tagalog ang “mga alagang hayop” kaysa “mga kawan” o “mga bakahan.”
- source_word: בְּהֶמְתָּם
  choice: kanilang mga alagang hayop
  rationale: Pinananatili ng panghalip ang pagkakaugnay sa naunang “mga anak ni Israel” at ang paralelismo ng pagpapalit.
- source_word: וְהָיוּ לִי
  choice: Ang mga Levita ay magiging akin
  rationale: Malinaw na ipinahahayag ang pag-aari o natatanging paglalaan sa Diyos, habang pinananatili ang hinaharap na anyo ng Hebreo.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Pinananatili ang personal na pangalang banal na YHWH at ang mariing pormula ng pagkakakilanlan at awtoridad.
theological_decisions:
- issue: Ang mga Levita bilang pamalit sa mga panganay
  choice: bilang kapalit ng
  alternative: sa halip ng
  rationale: Parehong maaaring magpahayag ng substitution, ngunit mas malinaw na ipinakikita ng “bilang kapalit ng” ang itinakdang representasyong pamalit nang hindi ipinapaliwanag nang lampas sa teksto.
- issue: Paglalapat ng panghalip sa בְּהֶמְתָּם
  choice: kanilang mga alagang hayop
  alternative: mga alagang hayop ng mga Israelita
  rationale: Ang tahasang kahulugan ay tumutukoy sa mga anak ni Israel, ngunit pinananatili ng panghalip ang anyo at bahagyang implisitong pagkakaugnay ng Hebreo.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang YHWH sa pinagmulang teksto. Inilalagay sa talababa ang tradisyonal na salin upang maging malinaw ang alternatibong nakasanayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga alagang hayop” bilang likas na kolektibong katumbas ng livestock, at pinanatili ang Hebreong paralelismo sa dalawang pariralang “bilang kapalit ng.”
