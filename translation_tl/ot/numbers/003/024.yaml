  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: tl
  text: At ang pinuno ng sambahayan ng mga Gersonita ay si Eliasaf na anak ni Lael.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sambahayan ng ama,” isang katawagang Israelita para sa isang yunit ng angkan o pangkat ng mga pamilyang nagmula sa iisang ninuno.
