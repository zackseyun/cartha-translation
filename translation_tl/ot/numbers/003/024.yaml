lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: At ang pinuno
  rationale: Ang נָשִׂיא ay tumutukoy sa isang kinikilalang pinuno o pangulo ng pangkat; ang “pinuno” ay malinaw at hindi nagpapahiwatig ng pagkahari. Isinalin ang ו bilang “At” upang mapanatili ang daloy ng talaan.
- source_word: בֵית אָב
  choice: ng sambahayan ng mga ninuno
  rationale: Literal itong “sambahayan ng ama,” isang katawagang Israelita para sa pangkat ng magkakamag-anak na nagmula sa iisang ninuno. Iniiwasan ng salin ang maling impresyong isang gusali lamang ang tinutukoy.
- source_word: לַ/גֵּרְשֻׁנִּי
  choice: ng mga Gersonita
  rationale: Ang anyong may ל ay nagsasaad ng kaugnayan sa pangkat na nagmula kay Gerson; natural sa Tagalog ang kolektibong “mga Gersonita.”
- source_word: אֶלְיָסָף
  choice: Eliasaf
  rationale: Isinatinig ang pangalang Hebreo sa paraang malinaw at likas sa makabagong Tagalog.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang paraan sa Tagalog ng pagpapahayag ng ugnayang genealogical.
- source_word: לָאֵל
  choice: Lael
  rationale: Isinatinig ang personal na pangalan nang malapit sa anyong Hebreo.
