base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: tl
  text: 'At ang mga anak ni Merari, ayon sa kanilang mga angkan: sina Mahli at Mushi. Ito ang mga angkan ng mga Levita[a], ayon sa mga sambahayan ng kanilang mga ama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga angkan ni Levi.” Nasa anyong isahan ang katawagang Hebreo na “ang Levita”; maaari itong tumukoy nang sama-sama sa mga Levita o pabalik kay Levi bilang ninuno ng lipi.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: At ang mga anak ni Merari
  rationale: Pinananatili ng “mga anak” ang tuwirang pananalita tungkol sa angkan, at isinasalin ang pang-ugnay na וּ bilang “At,” na likas sa pagpapatuloy ng talaan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Ipinahihiwatig ng parirala ang pag-uuri sa mga pangkat ng magkakamag-anak; malinaw at angkop sa konteksto ng talaangkanan ang “mga angkan.”
- source_word: מַחְלִי וּמוּשִׁי
  choice: sina Mahli at Mushi
  rationale: Isinalin ang mga pangalang pantangi sa nakaugaliang transliterasyon at ginamit ang “sina” para sa natural na Tagalog.
- source_word: אֵלֶּה הֵם
  choice: Ito ang
  rationale: Natural na pangkilalang pahayag sa Tagalog na tumutumbas sa demonstratibo at panghalip ng Hebreo.
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  choice: mga angkan ng mga Levita
  rationale: Ang pangmaramihang “mga Levita” ay malinaw at natural ayon sa konteksto, samantalang inilalahad sa talababa ang tunay na kalabuan ng isahang gentilic sa Hebreo.
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa mga sambahayan ng kanilang mga ama
  rationale: Pinananatili ng “mga sambahayan ng kanilang mga ama” ang patriyarkal at pang-administratibong larawan ng בית אבות, habang ang “ayon sa” ay nagpapakita ng pag-uuri.
