base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: tl
  text: Ang mga nabilang sa kanila[a], ayon sa bilang ng bawat lalaking mula sa edad na isang buwan pataas, ay anim na libo at dalawang daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga nakatala sa kanila” o “ang kanilang mga nabilang.” Tumutukoy ang Hebreo sa mga kabilang sa kabuuang bilang ng sensus para sa pangkat na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: Ang mga nabilang sa kanila
  rationale: Ipinahahayag ng anyong nominal mula sa פקד ang mga taong naisama sa sensus ng pangkat. Pinananatili ng “mga nabilang sa kanila” ang diwang tumutukoy sa mga tao, hindi lamang sa abstraktong kabuuang bilang.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: ang lahat ng lalaki
  rationale: Sa konteksto ng pormula ng sensus, ipinakikilala ng בְּמִסְפַּר ang saklaw ng pagbibilang. Likas sa Tagalog na ilahad ito bilang paliwanag sa kung sino ang nabilang; ang כָּל זָכָר ay tahasang tumutukoy sa lahat ng lalaki.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: mula isang buwang gulang pataas
  rationale: Natural at malinaw na pahayag ito ng pinakamababang edad na kasama sa bilang, habang pinananatili ang kahulugan ng “mula ... pataas.”
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: anim na libo at dalawang daan
  rationale: Tuwirang paglilipat ng kabuuang bilang na 6,200, na binaybay sa tekstong pampanitikan.
