  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: tl
  text: pati ang mga tabing ng patyo[a], ang pantabing sa pasukan ng patyong nakapalibot sa tabernakulo at sa altar, at ang mga tali nito[b], para sa lahat ng gawain nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kurtina ng patyo.”
    reason: lexical_alternative
  - marker: b
    text: O “mga lubid nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: mga tabing
  rationale: Tumutukoy sa mga telang bumubuo sa nakapalibot na hangganan ng patyo; natural at malinaw ang “mga tabing” sa modernong Filipino.
- source_word: חָצֵר
  choice: patyo
  rationale: Karaniwang salitang Filipino para sa nakabakod o napalilibutang lugar sa paligid ng santuwaryo.
- source_word: מָסַךְ
  choice: pantabing
  rationale: Isang telang nakatakip sa pasukan; inihihiwalay ng “pantabing” ang gamit nito sa mga tabing na bumubuo sa paligid ng patyo.
- source_word: פֶּתַח
  choice: pasukan
  rationale: Likas na salin para sa bukana o daanan papasok at hindi nagpapahiwatig ng matigas na tarangkahan.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: nakapalibot sa tabernakulo at sa altar
  rationale: Ipinahahayag nang natural ang ayos na ang patyo ang nakapalibot sa tabernakulo at altar, habang pinananatili ang iisang pang-abay na סָבִיב.
- source_word: מִשְׁכָּן
  choice: tabernakulo
  rationale: Kinikilalang terminong Filipino para sa sagradong toldang tirahan sa konteksto ng Bilang.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Pamantayan at madaling maunawaang salin para sa dakong pinaghahandugan.
- source_word: מֵיתָרָיו
  choice: mga tali nito
  rationale: Kongkreto at natural na tumutukoy sa mga lubid o kordong sumusuporta sa estruktura.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: kasama ang lahat ng gawaing kaugnay ng mga ito
  rationale: Iniiwasan ang alanganing literal na “para sa lahat ng paglilingkod nito” at malinaw na binubuod ang lahat ng nakatalagang gawain para sa mga kagamitang binanggit.
