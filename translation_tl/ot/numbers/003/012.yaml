  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: tl
  text: At ako—narito—kinuha ko na ang mga Levita mula sa gitna ng mga anak ni Israel[a] bilang kapalit ng bawat panganay na nagbubukas ng sinapupunan sa mga anak ni Israel; at ang mga Levita ay magiging akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal na “mga anak ni Israel,” isang pormularyong pananalita sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: At ako
  rationale: Pinananatili ang pang-ugnay at ang tahasang panghalip na nagbibigay-diin sa nagsasalita.
- source_word: הִנֵּה
  choice: narito
  rationale: Pinananatili ang pantawag-pansin at mariing bisa ng Hebreong kataga sa isang marangal ngunit nauunawaang anyo.
- source_word: לָקַחְתִּי
  choice: kinuha ko na
  rationale: Ipinahahayag ang ganap nang kilos na may nagpapatuloy na bisa sa kasalukuyan.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagang Filipino para sa pangkat na mula sa lipi ni Levi.
- source_word: מִתּוֹךְ
  choice: mula sa
  rationale: Likas na Filipino para sa pagpili mula sa loob ng isang mas malaking pangkat; ang kasunod na parirala ang nagbibigay ng diwang 'mula sa gitna ng.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pormularyong larawan ng Hebreo at ang kaugnayan kay Israel bilang ninuno, nang hindi ito ginagawang di-likas na 'mga anak na lalaki.'
- source_word: תַּחַת
  choice: bilang kapalit ng
  rationale: Malinaw na ipinahahayag ang pagpapalit sa kontekstong legal at pangkulto.
- source_word: כָּל בְּכוֹר
  choice: bawat panganay
  rationale: Likas at tumpak na distributibong katumbas sa Filipino.
- source_word: פֶּטֶר רֶחֶם
  choice: na nagbubukas ng sinapupunan
  rationale: Pinananatili ang kongkretong idyomang Hebreo para sa unang lumalabas sa sinapupunan, sa halip na palitan ito ng mas malayang paliwanag.
- source_word: וְהָיוּ לִי
  choice: at ang mga Levita ay magiging akin
  rationale: Tuwirang ipinahahayag ang magiging pag-aari o nakatalagang pag-aangkin ng Diyos nang hindi nagdaragdag ng teolohikal na kategorya.
theological_decisions:
- issue: Pagpapakahulugan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang napiling anyo ay nagpapanatili sa pormularyong pananalita at larawang ang bayan ay mga inapo ni Israel; inilalagay sa talababa ang mas idyomatikong katawagan.
- issue: Ugnayan ng mga Levita sa Diyos sa וְהָיוּ לִי
  choice: ang mga Levita ay magiging akin
  alternative: ang mga Levita ay mapapabilang sa akin
  rationale: Pinananatili ang tuwirang pahayag ng banal na pag-aangkin sa konteksto ng pagtatalaga, nang hindi nilalagyan ng mas tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang mataas na himig na angkop sa banal na pahayag. Ginamit ang “narito” upang mapanatili ang diin ng הִנֵּה, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
