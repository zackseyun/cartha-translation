base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: tl
  text: Kay Gershon kabilang ang angkan ng mga Libnita at ang angkan ng mga Simeita. Ang mga ito ang mga angkan ng mga Gershonita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: Kay Gershon kabilang
  rationale: Ang לְ ay nagpapahayag ng kaugnayan o pagkabilang sa talaangkanang ito. Likas sa modernong Filipino ang “Kay Gershon kabilang” at malinaw nitong ipinakikitang ang sumusunod na mga angkan ay sakop ng sangay ni Gershon.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: angkan / mga angkan
  rationale: Sa konteksto ng talaangkanan at sensus, tumutukoy ito sa pangkat ng magkakamag-anak na mas malawak kaysa isang sambahayan ngunit mas maliit kaysa isang lipi. Ang “angkan” ang pinakanatural at tumpak na katumbas sa Filipino.
- source_word: הַלִּבְנִי
  choice: mga Libnita
  rationale: Ang anyong gentiliko ay tumutukoy sa pangkat na nagmula kay Libni. Pinananatili ng “mga Libnita” ang maikli at karaniwang anyo ng pangalan ng pangkat.
- source_word: הַשִּׁמְעִי
  choice: mga Simeita
  rationale: Ang gentiliko ay tumutukoy sa mga inapo ni Simei. Ginamit ang “mga Simeita” bilang natural na anyong Filipino ng pangalan ng pangkat.
- source_word: אֵלֶּה הֵם
  choice: Ang mga ito ang
  rationale: Ito ay pormula ng pagkakakilanlan sa isang tala. Ang kasalukuyang anyo ay tumutugma sa Hebreo at natural sa Filipino.
- source_word: הַגֵּרְשֻׁנִּי
  choice: mga Gershonita
  rationale: Tinutukoy ng gentiliko ang mas malaking sangay ng mga Levita na nagmula kay Gershon. Ang “mga Gershonita” ay malinaw at maikli.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “angkan” sa halip na “pamilya” upang maiwasan ang makitid na kahulugan ng sambahayan, at pinanatili ang mga pangalang gentiliko sa karaniwang anyong Filipino.
