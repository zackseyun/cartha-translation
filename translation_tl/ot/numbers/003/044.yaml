lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagsusulong ng salaysay at pinananatili ang pormulang naiiba sa אמר; likas sa Tagalog ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan ng אֶל ang taong pinatutungkulan ng pagsasalita; “kay” ang likas na panandang Tagalog bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang kinagawiang anyo sa modernong Tagalog ng pangalang Hebreo na מֹשֶׁה.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ipinakikilala ng infinitive construct ang kasunod na nilalaman ng banal na pahayag; pinananatili ng “na sinasabi” ang pormal na pormula ng Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “ang PANGINOON,” samantalang ang “Jehovah” ay isang tradisyonal ngunit hibridong anyo.
translation_notes:
  register: Makabago at marangal na Tagalog. Pinanatili ang maikli at pormal na pormula ng Hebreo, pati ang bahagyang di-likas ngunit makahulugang “na sinasabi,” dahil ipinagpapatuloy nito ang pangungusap sa kasunod na talata.
