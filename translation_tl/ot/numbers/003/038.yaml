reference: Numbers 3:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: tl
  text: Ang mga nagkampo sa harap ng tabernakulo sa gawing silangan[a]—sa harap ng tolda ng pagpupulong, sa dakong sikatan ng araw—ay sina Moises, Aaron, at ang mga anak niyang lalaki. Tinutupad nila ang tungkulin ng santuwaryo para sa mga anak ni Israel. Ngunit ang sinumang hindi awtorisadong lumapit[b] ay papatayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “pasilangan ... sa gawing silangan.” Gumagamit ang Hebreo ng dalawang magkaugnay na pahayag ng direksiyon upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Ang tinutukoy na hindi awtorisado ay isang taong walang pahintulot na lumapit sa paglilingkod sa santuwaryo, hindi partikular na isang dayuhan sa lahi.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: ang mga nagkampo
  rationale: Ang substantival na participle ay tumutukoy sa mga taong nakatalaga sa lugar; ang anyong nakaraan ay angkop sa paglalarawan ng ayos ng kampamento.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: sa harap ng tabernakulo
  rationale: Tuwirang ipinapahayag ang lokasyon at pinananatiling naiiba ang מִשְׁכָּן sa kasunod na 'tolda ng pagpupulong.'
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: sa gawing silangan ... sa dakong sikatan ng araw
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong pahayag ng direksiyon sa Hebreo at ang pagbibigay-diin sa silangan.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagpupulong
  rationale: Natural at malinaw na salin ng pangalan ng banal na tolda kung saan nagaganap ang itinakdang pakikipagtagpo.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: sina Moises, Aaron, at ang mga anak niyang lalaki
  rationale: Ang panlalaking isahang hulapi sa 'mga anak' ay pinakamalapit na tumutukoy kay Aaron; nililinaw ng 'lalaki' ang בנים nang hindi ipinapalagay na anak din sila ni Moises.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: nangangasiwa
  rationale: Ipinahahayag ng magkaugnay na pandiwa at pangngalan ang pagtupad sa ipinagkatiwalang pagbabantay at pananagutan; natural itong ipinapahayag sa Filipino bilang 'nangangasiwa.'
- source_word: הַמִּקְדָּשׁ
  choice: santuwaryo
  rationale: Tumutukoy ito sa banal na pook o nasasakupan, hindi lamang sa isang silid; ang 'santuwaryo' ang maikli at angkop na katumbas.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: para sa kapakanan ng mga anak ni Israel
  rationale: Ipinakikita ang kinatawang pananagutan nila kaugnay ng buong Israel nang hindi ginagawang isang teknikal na tungkulin lamang ang parirala.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilyang katawagan ng Hebreo para sa bayang tipan.
- source_word: וְהַזָּר הַקָּרֵב
  choice: ang sinumang hindi awtorisadong lumapit
  rationale: Sa konteksto ng paglilingkod sa santuwaryo, ang זָר ay isang taong walang pahintulot o karapatang lumapit, hindi kinakailangang isang dayuhan sa lahi.
- source_word: יוּמָת
  choice: papatayin
  rationale: Ang Hophal ay pasibo at causative, kaya kaparusahang kamatayan ang ipinahahayag, hindi lamang na mamamatay ang tao.
theological_decisions:
- issue: Tinutukoy ng 'mga anak niyang lalaki'
  choice: Mga anak na lalaki ni Aaron
  alternative: Mga anak o sambahayang kaugnay nina Moises at Aaron
  rationale: Ang hulaping panlalaking isahan ay natural na tumutukoy sa pinakamalapit na antecedent na si Aaron, at ang tungkuling saserdotal sa konteksto ay kina Aaron at sa kaniyang mga anak.
- issue: Kahulugan ng זָר sa batas ng santuwaryo
  choice: Sinumang hindi awtorisadong lumapit sa banal na paglilingkod
  alternative: Dayuhan sa lahi o karaniwang estranghero
  rationale: Ang agarang konteksto ay pahintulot na lumapit at tungkuling saserdotal, kaya katayuan sa banal na paglilingkod ang usapin, hindi etnisidad.
- issue: Diwa ng לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: Pangangasiwa para sa kapakanan ng Israel
  alternative: Pagtupad sa tungkuling mismong pag-aari ng Israel
  rationale: Maaaring magpahiwatig ang parirala ng kinatawang tungkulin o kapakinabangan; pinili ang natural na Filipino nang hindi naglalagay ng mas tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang mga pamilyar na terminong biblikal na 'tabernakulo' at 'santuwaryo'; pinanatili ang dalawang pahayag ukol sa silangan at nilinaw ang reperensiya sa mga anak ni Aaron.
