    rationale: Ang “kapakanan” ay nagpapahiwatig lamang ng pakinabang o kabutihan at hindi naipahahayag ang מִשְׁמֶרֶת bilang isang iniatas na tungkulin/pagbabantay. Dapat panatilihin ang aspektong ito nang hindi ipinipilit ang isang mas tiyak na interpretasyon.
  - severity: low
