  verdict: revise
  source_fidelity: Tumpak ang pangunahing ayos, mga tauhan, lokasyon sa silangan, at parusang ipinahahayag. Gayunman, ang “para sa kapakanan ng mga anak ni Israel” ay masyadong pangkalahatan para sa לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל, na tumutukoy sa isang iniatas na pagbabantay o tungkuling ginagampanan kaugnay/para sa Israel.
  naturalness: Natural at marangal ang Filipino. Mas malinaw at mas malapit sa diwa ang “tumutupad sa tungkulin ng santuwaryo para sa mga anak ni Israel” kaysa “nangangasiwa ... para sa kapakanan.”
  terminology: Ang “tabernakulo,” “tolda ng pagpupulong,” at “santuwaryo” ay magkakaugnay at angkop. Ang “hindi awtorisadong lumapit” ay wastong nagpapahiwatig na ang זָר ay hindi isang dayuhan ayon sa lahi. Inilipat ang panandang [b] upang tuwirang ikabit sa terminong ipinaliliwanag nito.
  issues:
