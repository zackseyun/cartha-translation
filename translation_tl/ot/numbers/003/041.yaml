id: NUM.3.41
reference: Numbers 3:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: tl
  text: At kukunin mo para sa akin ang mga Levita—ako si Yahweh—kapalit ng bawat panganay sa mga anak ni Israel[a], at ang mga alagang hayop ng mga Levita kapalit ng bawat panganay sa mga alagang hayop ng mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga Israelita.” Sa Hebreo, “sa mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: At kukunin mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki na may pang-ugnay ay gumaganap bilang utos kay Moises sa kontekstong ito. Pinananatili ng anyong hinaharap ang pormal at nag-aatas na himig.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Ito ang karaniwang katawagan sa Filipino para sa pangkat na nagmula kay Levi, at ipinahahayag ng “ang mga” ang tiyak at maramihang anyo.
- source_word: לִי
  choice: para sa akin
  rationale: Ipinahihiwatig ng pang-ukol ang pag-aari o pagtatalaga; natural na ipinapahayag ito ng “para sa akin” sa kontekstong pagtatalaga sa Diyos.
- source_word: אֲנִי יְהוָה
  choice: ako si Yahweh
  rationale: Pinananatili nito ang mariing pagpapakilala ng Diyos at natural na ginagamit ang “si” sa Filipino bago ang personal na pangalan.
- source_word: תַּחַת
  choice: kapalit ng
  rationale: Sa konteksto ng paghalili sa mga panganay, ang salita ay tumutukoy sa pagkuha ng isa bilang kahalili ng iba; malinaw at natural dito ang “kapalit ng.”
- source_word: כָּל בְּכֹר
  choice: bawat panganay
  rationale: Ang כָּל na kasama ng pangngalang isahan ay distributibo, na tumpak na naihahayag ng “bawat.”
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili nito ang mas literal na larawan ng Hebreong “mga anak ni Israel” nang hindi inaalis ang pambansang kahulugan; ibinibigay sa talababa ang natural na alternatibong “mga Israelita.”
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: ang mga alagang hayop ng mga Levita
  rationale: Ang בְּהֵמָה ay malawak na tumutukoy sa mga domestikadong hayop, kaya mas angkop ang “mga alagang hayop” kaysa sa mas makitid na “mga baka.”
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: bawat panganay sa mga alagang hayop ng mga anak ni Israel
  rationale: Pinananatili ng parirala ang pagkakatulad sa naunang sugnay at malinaw na tumutukoy sa bawat panganay na kabilang sa mga hayop ng Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton bilang personal na pangalan ng Diyos. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Pagsasalin sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang Hebreo ay literal na “mga anak ni Israel” at may pambansang kinatawang diwa. Pinananatili ito sa pangunahing teksto, habang ang mas idyomatikong katumbas ay inilalagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang pormal na himig ng utos, ang simetrikong paghalili ng mga Levita at kanilang mga hayop sa mga panganay ng Israel, at ang personal na pangalang Yahweh.
