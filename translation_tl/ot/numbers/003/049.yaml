base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: tl
  text: At kinuha ni Moises ang salaping pantubos[a] mula sa mga lumabis sa bilang ng mga tinubos ng mga Levita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “halagang pantubos.” Ang salitang Hebreo ay tumutukoy sa halagang ibinabayad para sa pagtubos.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, kinuha ang salapi mula sa mga panganay na Israelita na lumabis sa bilang ng mga Levita, sapagkat ang mga Levita ang ibinilang na kapalit ng ibang mga panganay.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Karaniwang salaysay na anyo ng לקח; tuwirang ipinahahayag ng “kinuha” ang kilos nang hindi idinaragdag ang di-tiyak na diwang “tinanggap.”
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: salaping pantubos
  rationale: Likas sa modernong Filipino at pinananatili ang legal at pangritwal na diwa ng halagang ibinabayad para sa pagtubos.
- source_word: מֵאֵת
  choice: mula sa
  rationale: Ipinapakita rito ang pinagmulan ng salapi; hindi kailangang gawing literal na “mula sa kamay ng.”
- source_word: הָעֹדְפִים
  choice: mga lumabis sa bilang
  rationale: Ipinapahayag ang paghahambing na pansobrang bilang, habang iniiwasang idagdag sa pangunahing teksto ang kontekstuwal ngunit hindi tahasang salitang “mga panganay.”
- source_word: עַל
  choice: sa bilang ng
  rationale: Sa konteksto, naghahayag ito ng numerikal na kalabisan kaugnay ng kasunod na pangkat; mas malinaw sa Filipino kaysa sa literal na “sa ibabaw ng.”
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: mga tinubos ng mga Levita
  rationale: Pinananatili ang malawak na ugnayan ng construct phrase. Likas itong basahin sa Filipino, bagaman maaaring mapagkamalang tuwirang instrumental; nililinaw ng talababa ang konteksto ng pagpapalit at pagbibilang.
theological_decisions:
- issue: Ugnayan ng mga Levita sa mga tinubos sa pariralang פְּדוּיֵי הַלְוִיִּם
  choice: mga tinubos ng mga Levita
  alternative: mga tinubos sa pamamagitan ng mga Levita / mga tinubos na katumbas ng bilang ng mga Levita
  rationale: Hindi tahasang tinutukoy ng Hebrew construct ang eksaktong uri ng ugnayan. Pinanatili sa teksto ang mas maikli at bahagyang malawak na anyo, at inilagay sa talababa ang paliwanag mula sa konteksto upang hindi labis na resolbahin ang gramatikal na tensiyon.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “salaping pantubos” at “lumabis sa bilang” upang maging malinaw sa karaniwang mambabasa nang mapanatili ang legal-pangritwal na diwa at ang bahagyang kaluwagan ng pariralang Hebreo.
