  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: tl
  text: At para sa pantubos sa 273 mula sa mga panganay ng mga anak ni Israel na labis sa bilang ng mga Levita,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang 273 na tinubos.” Maaaring unawain nang mas literal sa ganitong paraan ang anyong Hebreo, ngunit ang agarang konteksto ay tungkol sa halagang kailangang ibayad para sa mga sobrang panganay (tal. 47–48); kaya “pantubos” ang pinakamalinaw na diwa rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: pantubos sa
  rationale: Ang anyo ay maaaring tumukoy nang mas literal sa mga tinubos, ngunit ipinakikita ng kasunod na konteksto na ang pinag-uusapan ay ang halagang ibabayad upang tubusin ang mga sobrang panganay. Ang “pantubos” ay natural at hindi labis na nagpapaliwanag.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: '273'
  rationale: Additibo ang pagkakabuo ng bilang sa Hebreo; malinaw at eksaktong naihahayag ito sa karaniwang numerong Filipino.
- source_word: הָעֹדְפִים עַל הַלְוִיִּם
  choice: na labis sa bilang ng mga Levita
  rationale: Tinutukoy ng participle at ng kasunod na parirala ang mga panganay na humihigit sa bilang ng mga Levitang maihahalili sa kanila. Nililinaw ng “sa bilang” ang paghahambing nang hindi binabago ang diwa.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga panganay ng mga anak ni Israel
  rationale: Pinananatili ng “mula sa” ang partitive na diwa at ng “mga anak ni Israel” ang pormal na katawagang tipan ng בני ישראל.
