base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/023.yaml
  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: tl
  text: Ang mga angkan ng mga Gershonita ay magkakampo sa likuran ng tabernakulo, sa gawing kanluran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “patungo sa dagat,” isang karaniwang idyoma para sa “patungo sa kanluran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa konteksto ng pagkakahati-hati ng mga Levita, tumutukoy ito sa malalaking pangkat na magkakamag-anak, hindi lamang sa mga sambahayan; malinaw at likas dito ang “mga angkan.”
- source_word: הַגֵּרְשֻׁנִּי
  choice: mga Gershonita
  rationale: Ang anyong pangkat sa Hebreo ay tumutukoy nang sama-sama sa mga inapo ni Gershon; natural itong ipinahahayag sa Filipino bilang “mga Gershonita.”
- source_word: אַחֲרֵי
  choice: sa likuran ng
  rationale: Pook, hindi panahon, ang kahulugan ng pang-ukol dito. Ang “sa likuran ng” ay malinaw sa paglalarawan ng ayos ng kampo.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Tumutukoy ito sa banal na toldang santuwaryo. Ang “tabernakulo” ay kinikilalang katawagan sa Bibliyang Filipino at angkop sa marangal na rehistro.
- source_word: יַחֲנוּ
  choice: ay magkakampo
  rationale: Ang imperfect ay nagsasaad dito ng itinakdang ayos ng kampamento. Naipahahayag ng “magkakampo” ang panghinaharap at iniaatas na pagkakalagay nang natural sa Filipino.
- source_word: יָמָּה
  choice: sa gawing kanluran
  rationale: Literal itong anyong patungo sa “dagat,” ngunit karaniwang idyoma ito para sa kanluran. Pinananatili ng “sa gawing kanluran” ang direksiyonal na diwa nang hindi nagiging malabo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “angkan” para sa pangkat na magkakamag-anak at “tabernakulo” bilang kinikilalang katawagang biblikal. Inilagay ang panandang talababa [a] matapos ang pariralang “sa gawing kanluran,” na siyang ipinaliliwanag nito.
