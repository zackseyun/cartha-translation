  yaml_path: translation/ot/numbers/003/011.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Pagkatapos ay nagsalita si Yahweh kay Moises[a], na nagsasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “At nagsalita si Yahweh kay Moises, na nagsasabi.” Maaari ring isalin ang unang pang-ugnay bilang “At.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Filipino ang “Pagkatapos,” samantalang pinananatili ng “nagsalita” ang diwa ng דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay nagpapahayag ng patutunguhan ng pagsasalita; “kay” ang natural na anyo bago ang pangalan ng tao.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang pamantayan at madaling makilalang anyo ng pangalan sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ipinakikilala ng pawatas ang mismong pahayag na susunod. Pinananatili ng “na sinasabi” ang pormal na pormula at kaugnayan nito sa kasunod na talata.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong pangalan sa pamamagitan ng malapit na transliterasyong “Yahweh,” hindi pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tradisyonal na pormal na pormulang “na sinasabi” dahil panimulang pahayag ito na nagpapatuloy sa susunod na talata; pinanatili rin ang tunay na alternatibo sa unang pang-ugnay sa talababa.
