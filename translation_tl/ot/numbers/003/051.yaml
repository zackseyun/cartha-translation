base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: At ibinigay ni Moises kay Aaron at sa mga anak ni Aaron ang salaping pantubos[a], ayon sa utos ni Yahweh, gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pilak ng mga tinubos”; samakatuwid, ang bayad na nakolekta para sa pagtubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: At ibinigay
  rationale: Ang waw-consecutive ng נתן ay likas na isinasalin bilang nagdaang kilos sa salaysay; pinananatili ng “At” ang pagkakaugnay sa naunang talata.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: ang salaping pantubos
  rationale: Literal itong “pilak ng mga tinubos,” ngunit sa konteksto ay tumutukoy sa salaping ibinayad para sa pagtubos. Ang “salaping pantubos” ay malinaw, natural, at pinananatili ang legal at panrelihiyong diwa.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kay Aaron at sa mga anak nito
  rationale: Ang inuulit na pang-ukol ay ipinakikita sa “kay ... at sa ...”; nililinaw ng “nito” na mga anak ni Aaron ang tinutukoy.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang idyomang literal na “ayon sa bibig ni Yahweh” ay nangangahulugang alinsunod sa kaniyang utos; ito ang natural na katumbas sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Ipinahahayag ng כַּאֲשֶׁר ang pagtutugma ng ginawa ni Moises sa naunang utos; natural itong naihahatid ng “gaya ng iniutos.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan at hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng כֶּסֶף הַפְּדֻיִם
  choice: salaping pantubos
  alternative: pilak ng mga tinubos
  rationale: Bagaman maaaring sundan nang literal ang anyo, ipinakikita ng konteksto na ito ang bayad na nakolekta para sa pagtubos. Hindi binabago ng idyomatikong salin ang ritwal at legal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salaping pantubos” bilang natural na katawagan sa bayad para sa pagtubos, habang inilagay sa talababa ang literal na anyong Hebreo.
