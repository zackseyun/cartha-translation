base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: tl
  text: Ito ang mga pangalan ng mga anak ni Aaron, ang mga paring pinahiran, na pinuno niya ang kanilang kamay[a] upang maglingkod bilang mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pinuno niya ang kanilang kamay.” Isa itong Hebreong idyoma na nangangahulugang itinalaga o iniluklok sila sa paglilingkod bilang mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Ito ang mga pangalan
  rationale: Likas na pormulang Filipino para sa Hebreong pagpapakilala; ang copula ay ipinahihiwatig sa Filipino.
- source_word: בְּנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Tumutukoy ang בְּנֵי sa mga lalaking anak ni Aaron sa kontekstong ito; natural sa Filipino ang anyong genitibo na “ni Aaron.”
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Pinananatili ang tiyak at panuring na gamit ng parirala, na tumutukoy sa katungkulan ng mga anak ni Aaron.
- source_word: הַמְּשֻׁחִים
  choice: mga paring pinahiran
  rationale: Direktang pinananatili ng “pinahiran” ang ritwal na kilos ng משׁח sa halip na palitan ito ng mas malawak na salitang “itinalaga.”
- source_word: מִלֵּא יָדָם
  choice: pinuspos niya ang kanilang mga kamay
  rationale: Pinananatili ang kongkretong Hebreong idyoma at ang aktibong pandiwang may di-tinukoy na panlalaking simuno. Ginawang maramihan ang “mga kamay” para sa natural na Filipino, bagaman kolektibo o distributibong isahan ang Hebreo.
- source_word: לְכַהֵן
  choice: upang maglingkod bilang mga pari
  rationale: Ipinapahayag ang layunin ng pagtatalaga at ang aktibong paglilingkod sa katungkulan ng pari.
theological_decisions:
- issue: Ang idyoma ng pagtatalaga na מִלֵּא יָדָם
  choice: Panatilihin sa pangunahing teksto ang “pinuspos niya ang kanilang mga kamay,” at ipaliwanag sa talababa na idyoma ito ng pagtatalaga sa pagkapari.
  alternative: “itinalaga niya sila upang maglingkod bilang mga pari”
  rationale: Hindi ikinukubli ang natatanging ritwal na pananalita ng Hebreo, ngunit nililinaw ng talababa ang kahulugan nito sa ordinaryong mambabasa.
- issue: Ang hindi tahasang pinangalanang simuno ng מִלֵּא
  choice: Gamitin ang “niya” nang hindi pinapangalanan kung sino ang tinutukoy.
  alternative: “pinuspos ni Moises ang kanilang mga kamay” o pasibong “pinuspos ang kanilang mga kamay”
  rationale: Aktibong ikatlong panauhang panlalaki ang anyong Hebreo, ngunit walang tahasang pangngalan sa talata. Ang “niya” ay nagpapanatili kapwa sa gramatika at sa di-tahasang pagkakakilanlan ng simuno.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang ritwal na “pinahiran” at ang kongkretong idyoma ng pagpupuspos ng kamay; inilagay ang pananda ng talababa kaagad pagkatapos ng idyomang ipinaliliwanag nito.
