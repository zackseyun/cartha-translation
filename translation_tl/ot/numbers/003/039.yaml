  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: tl
  text: Lahat ng Levitang binilang nina Moises at Aaron[a] ayon sa utos ni Yahweh[b], ayon sa kani-kanilang angkan—bawat lalaking mula isang buwang gulang pataas—ay 22,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa tekstong Hebreo, may pambihirang mga tuldok sa ibabaw ng mga titik ng “at Aaron.” Sinaunang tanda ito ng mga tagapagsulat na maaaring nagpapahiwatig ng pag-aalinlangan tungkol sa mga salitang iyon, ngunit nananatili ang mga ito sa tekstong Masoretiko.
    reason: textual_note
  - marker: b
    text: Sa literal na Hebreo, “ayon sa bibig ni Yahweh,” isang idyomang nangangahulugang “ayon sa utos ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  choice: binilang / binilang
  rationale: Tumutukoy ang magkaugnay na anyo ng פקד sa sensus at sa mga isinama sa bilang. Ang “binilang” ay malinaw at hindi nagdaragdag ng pahiwatig na militar.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang makabagong Tagalog na katawagan sa pangkat ng lahi ni Levi.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang literal na “ayon sa bibig ni Yahweh” ay isang idyomang Hebreo para sa pagsunod sa utos o kapahintulutan niya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang natatanging banal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa konteksto ng sensus, ang מִשְׁפָּחָה ay mas malawak na yunit ng pagkakamag-anak kaysa sa karaniwang makabagong kahulugan ng “pamilya.”
- source_word: כָּל זָכָר
  choice: bawat lalaki
  rationale: Tahasang tumutukoy ang Hebreo sa kasariang lalaki; natural ang “bawat lalaki” sa pormula ng sensus.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: mula isang buwang gulang pataas
  rationale: Natural na Tagalog para sa pormulang nagsasaad ng pinakamababang edad habang pinananatili ang saklaw ng Hebreo.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: 22,000
  rationale: Tuwirang paglalahad ng bilang na dalawampu't dalawang libo; ang mga numerong digit ay madaling basahin sa modernong publikasyon.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na tahimik itong gawing titulo.
- issue: Mga pambihirang tuldok sa וְאַהֲרֹן (“at Aaron”)
  choice: Panatilihin sa teksto ang “at Aaron” at ipaliwanag ang tanda sa talababa
  alternative: Alisin o ikulong sa panaklong ang “at Aaron”
  rationale: Kasama ang mga salita sa tekstong Masoretiko, ngunit minarkahan ang mga ito ng sinaunang tuldok na maaaring magpahiwatig ng pag-aalinlangan ng tagapagsulat. Hindi nararapat lutasin ng salin ang tekstuwal na tensiyong iyon sa pamamagitan ng pag-aalis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” para sa yunit ng pagkakamag-anak sa sensus, at em dash upang malinaw na maihiwalay ang paglalarawan sa saklaw ng mga lalaking binilang.
