  text: לִ/מְרָרִ֕י מִשְׁפַּ֨חַת֙ הַ/מַּחְלִ֔י וּ/מִשְׁפַּ֖חַת הַ/מּוּשִׁ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: tl
  text: 'Kay Merari: ang angkan ng mga Mahli at ang angkan ng mga Mushi. Ang mga ito ang mga angkan ni Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: Kay Merari
  rationale: Ang unlaping לְ ay nagpapakilala sa pangkat na inililista. Likas sa Filipino ang “Kay Merari” bilang panimulang heading at pinananatili nito ang ugnayang genealogical.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: angkan / mga angkan
  rationale: Sa konteksto ng talaangkanan at sensus, tumutukoy ang מִשְׁפָּחָה sa mas malawak na pangkat ng magkakamag-anak kaysa sambahayan; “angkan” ang tumpak at likas na salin.
- source_word: הַמַּחְלִי
  choice: mga Mahli
  rationale: Ito ay katawagang gentiliko para sa pangkat ng mga inapo o kaangkan ni Mahli. Ang “mga Mahli” ay maikli at madaling maunawaan sa Filipino.
- source_word: וּמִשְׁפַּחַת
  choice: at ang angkan ng
  rationale: Tuwirang pinag-uugnay ng וּ ang ikalawang angkan sa una; ang pag-uulit ng “ang angkan ng” ay nagpapanatili sa pormal at malinaw na ayos ng Hebreo.
- source_word: הַמּוּשִׁי
  choice: mga Mushi
  rationale: Ito ay katawagang gentiliko para sa mga inapo o kaangkan ni Mushi; likas sa Filipino ang kolektibong “mga Mushi.”
- source_word: אֵלֶּה הֵם
  choice: Ang mga ito ang
  rationale: Pinagsasama ng Hebreo ang demonstratibo at panghalip upang magbigay-diin sa pagkakakilanlan. Ang “Ang mga ito ang” ay natural na Filipino at nagpapanatili ng diin.
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: mga angkan ni Merari
  rationale: Binubuod ng parirala ang dalawang pangkat na kababanggit lamang. Ang “ni Merari” ay natural na paraan sa Filipino upang ipahayag ang ugnayang genealogical.
