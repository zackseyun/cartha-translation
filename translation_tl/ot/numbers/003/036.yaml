translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Inulit ang “sa” sa talaan upang maging malinaw na ang pangangalaga sa bawat nabanggit na bahagi ang tungkuling ipinagkatiwala sa mga anak ni Merari. Pinanatili ang teknikal na “tabernakulo” ngunit ginawang madaling maunawaan ang ibang terminong pangkonstruksiyon.
