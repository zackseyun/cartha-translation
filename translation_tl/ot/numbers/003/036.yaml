  naturalness: Malinaw, moderno, at angkop ang rehistro. Natural ang “mga pahalang na biga,” “mga haligi,” at “mga tuntungan” sa isang teknikal na talaan. Mas natural at mas tapat ang “gawaing may kaugnayan dito” kaysa “gawaing kaugnay ng mga ito.”
  terminology: Ang “tabernakulo,” “mga balangkas,” “mga haligi,” at “mga kagamitan” ay angkop. Pinanatili ang “mga tuntungan,” habang ang talababa ay nagbibigay ng teknikal na alternatibong “mga soket.”
