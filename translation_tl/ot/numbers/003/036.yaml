base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: tl
  text: Ang tungkuling ipinagkatiwala sa mga anak ni Merari ay ang pangangalaga sa mga balangkas ng tabernakulo[a], sa mga pahalang na biga nito, sa mga haligi nito, sa mga tuntungan nito[b], sa lahat ng kagamitan nito, at sa lahat ng gawaing may kaugnayan dito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabla ng tabernakulo.”
    reason: lexical_alternative
  - marker: b
    text: O “mga soket nito,” na kinasasaksakan ng mga haligi o balangkas.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “at sa lahat ng gawain nito”; maaari ring unawain na “at sa lahat ng paglilingkod na nauukol dito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: tungkuling ipinagkatiwala … pangangalaga
  rationale: Magkaugnay na ipinahihiwatig ng dalawang pangngalan ang opisyal na iniatas at pananagutang dapat tuparin. Ang pariralang ito ay natural sa modernong Tagalog at pinananatili ang diwa ng isang ipinagkatiwalang tungkulin.
- source_word: בְּנֵי מְרָרִי
  choice: mga anak ni Merari
  rationale: Tuwirang sinasalamin nito ang Hebreong parirala at malinaw na tumutukoy sa angkan ni Merari.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: mga balangkas ng tabernakulo
  rationale: Ang קֶרֶשׁ ay mga estruktural na bahaging patayo; ipinahahayag ng “balangkas” ang gamit ng mga ito nang hindi masyadong nililimitahan ang hugis o materyal. Nasa talababa ang posibleng “mga tabla.”
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang kinikilalang terminong Filipino para sa santuwaryong naililipat, at angkop sa kontekstong teknikal at panrelihiyon.
- source_word: בְרִיחָיו
  choice: mga pahalang na biga nito
  rationale: Tumutukoy ito sa mga baras o bigang nagdurugtong at nagpapatatag sa mga balangkas. Mas malinaw sa karaniwang mambabasa ang tungkulin ng mga ito sa saling ito.
- source_word: עַמֻּדָיו
  choice: mga haligi nito
  rationale: Natural at marangal na tawag ito sa mga patayong suporta ng tabernakulo.
- source_word: אֲדָנָיו
  choice: mga tuntungan nito
  rationale: Tumutukoy ito sa mga bahaging pundasyon na kinasasaksakan o kinatatayuan ng mga haligi at balangkas. Ang “tuntungan” ay madaling maunawaan; inilalagay sa talababa ang mas teknikal na “mga saket.”
- source_word: כָל כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa iba't ibang kasangkapan o kagamitan; hindi ito nililimitahan ng salin sa maliliit na sisidlan lamang.
- source_word: כֹל עֲבֹדָתוֹ
  choice: lahat ng gawaing kaugnay ng mga ito
  rationale: Saklaw ng עֲבֹדָה ang paggawa o paglilingkod na kailangan para sa mga nabanggit na bahagi. Nililinaw ng salin ang ugnayan nang hindi ito ginagawang isang tiyak na ritwal na serbisyo.
