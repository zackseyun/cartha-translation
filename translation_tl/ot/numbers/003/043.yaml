base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: tl
  text: At ang lahat ng panganay na lalaki, mula isang buwang gulang pataas, na isa-isang itinala ayon sa bilang ng mga pangalan[a], ayon sa kanilang bilang[b], ay umabot sa dalawampu't dalawang libo, tatlong daan at pitumpu't tatlo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang Hebreo na literal na “ayon sa bilang ng mga pangalan” ay isang pananalitang ginagamit sa sensus; nangangahulugan itong isa-isa silang itinala o binilang ayon sa pangalan.
    reason: cultural_note
  - marker: b
    text: O “ayon sa kanilang opisyal na pagkakatala.” Tumutukoy ang Hebreo sa opisyal na pagbilang sa grupong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay umabot sa
  rationale: Ipinahahayag ng anyong ito ang kinalabasan ng sensus; natural sa Filipino ang “umabot sa” para sa kabuuang bilang.
- source_word: כָל בְּכוֹר זָכָר
  choice: ang lahat ng panganay na lalaki
  rationale: Pinananatili ang kabuuang saklaw, kasarian, at katayuan bilang panganay.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: na isa-isang itinala ayon sa pangalan
  rationale: 'Inilalahad nang natural ang idyomang pansenso: indibidwal na pagtatala o pagbilang ayon sa pangalan.'
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: na isang buwang gulang pataas
  rationale: Malinaw at karaniwang Filipino para sa itinakdang pinakamababang edad.
- source_word: לִפְקֻדֵיהֶם
  choice: sa kanilang opisyal na bilang
  rationale: Tumutukoy sa opisyal na tala o bilang ng grupong isinailalim sa sensus; ipinapaliwanag sa talababa upang hindi maging mabigat ang pangunahing teksto.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: dalawampu't dalawang libo at tatlong daan at pitumpu't tatlo
  rationale: Tumpak na inililipat ang bilang na 22,373 sa karaniwang ayos ng bilang sa Filipino.
