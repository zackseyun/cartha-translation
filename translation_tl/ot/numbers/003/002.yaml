lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Likas na panimulang Filipino para sa pagpapakilala ng isang talaan; hindi kailangang isalin nang hiwalay ang pambungad na pangatnig na וְ.
- source_word: שְׁמוֹת
  choice: mga pangalan
  rationale: Tuwirang katumbas ng pangmaramihang anyo at natural sa Filipino.
- source_word: בְּנֵי אַהֲרֹן
  choice: ng mga anak ni Aaron
  rationale: Natural na pagpapahayag sa Filipino ng ugnayang ipinakikita ng Hebrew construct chain.
- source_word: הַבְּכֹר
  choice: ang panganay
  rationale: Pinananatili ang kahulugang katayuan bilang unang ipinanganak, hindi lamang pinakamatanda, at inilalagay bago ang Nadab ayon sa ayos ng Hebreo.
- source_word: נָדָב
  choice: Nadab
  rationale: Karaniwang transliterasyon ng pangalang Hebreo sa Filipino.
- source_word: וַאֲבִיהוּא
  choice: at sina Abihu
  rationale: Pinananatili ang pangatnig; ginagamit ang “sina” upang natural na ipakilala ang natitirang magkakasunod na pangalan ng mga tao sa Filipino.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Karaniwang transliterasyon ng pangalang Hebreo sa Filipino.
- source_word: וְאִיתָמָר
  choice: at Itamar
  rationale: Pinananatili ang huling pangatnig ng talaan at ginagamit ang anyong Itamar na angkop sa modernong Filipino.
