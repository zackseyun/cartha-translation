  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: tl
  text: Tutuparin nila ang kanyang tungkulin[a] at ang tungkulin ng buong kapulungan[b] sa harap ng Tolda ng Tagpuan, upang gampanan ang paglilingkod na nauukol sa tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “babantayan ang kanyang tungkulin” o “pangangalagaan ang kanyang tungkulin.” Ang magkaugnay na pandiwa at pangngalan sa Hebreo ay maaaring magdiin kapwa sa maingat na pangangalaga at sa tapat na pagtupad sa iniatas. Sa agarang konteksto, ang “kanyang” ay malamang na tumutukoy kay Aaron.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ginagampanan ng mga Levita ang mga pananagutang kaugnay ni Aaron at ng buong kapulungan hinggil sa santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתּוֹ
  choice: Tutuparin nila ang tungkuling ipinagkatiwala sa kanya
  rationale: Ang tambalang שׁמר at מִשְׁמֶרֶת ay tumutukoy sa tapat na pagtupad at pangangalaga sa isang iniatas na pananagutan. Natural sa modernong Tagalog ang “tutuparin ... ang tungkuling ipinagkatiwala,” at hindi nito nililimitahan ang diwa sa pisikal na pagbabantay lamang.
- source_word: מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: ang tungkulin ng buong kapulungan
  rationale: Inuulit ang “tungkulin” upang mapanatili ang paralelismo ng dalawang paglitaw ng מִשְׁמֶרֶת. Ang “kapulungan” ay ang buong pamayanan ng Israel sa kontekstong ito.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: sa harap ng toldang tipanan
  rationale: Ang לִפְנֵי ay may literal na diwang “sa harap ng,” samantalang ang אֹהֶל מוֹעֵד ay ang toldang itinakdang lugar ng pakikipagtagpo ng Diyos sa Israel; “toldang tipanan” isinasalin ang pormula nang maikli at marangal.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת הַמִּשְׁכָּן
  choice: upang gampanan ang paglilingkod sa tabernakulo
  rationale: Ipinapahayag ng infinitibong לַעֲבֹד ang layunin, at ang עֲבֹדָה rito ay ang nakatalagang paglilingkod na kaugnay ng santuwaryo. Ang “gampanan ang paglilingkod” ay natural at naiiwasan ang alanganing literal na pag-uulit.
theological_decisions:
- issue: Tinutukoy ng hulaping panlalaking isahan sa מִשְׁמַרְתּוֹ
  choice: Pinananatili ang panghalip na “kanya,” na sa agarang konteksto ay likas na tumutukoy kay Aaron.
  alternative: Maaaring unawain ito nang mas pangkalahatan bilang tungkulin ng santuwaryo o sama-samang tungkuling makasaserdote.
  rationale: Sa Mga Bilang 3, iniuukol ang mga Levita kay Aaron at sa kanyang mga anak, kaya si Aaron ang pinakamalapit at pinakalikas na tinutukoy. Gayunman, ang paggamit ng panghalip sa teksto ay hindi nagdaragdag ng pangalan na wala sa Hebreo.
- issue: Ugnayan ng tungkulin ng buong kapulungan sa gawain ng mga Levita
  choice: Ang mga Levita ang gumaganap ng tungkuling nauukol sa buong kapulungan kaugnay ng santuwaryo.
  alternative: Maaaring basahin ang parirala na para bang pinangangasiwaan lamang nila ang mga tungkuling personal na gagawin ng kapulungan.
  rationale: Ipinakikita ng konteksto na itinalaga ang mga Levita upang gumanap sa harap ng toldang tipanan alang-alang sa buong pamayanan, nang hindi ipinapasok ang mas tiyak na paliwanag sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tungkulin,” “kapulungan,” “toldang tipanan,” at “tabernakulo” upang mapanatili ang bokabularyong pangsantuwaryo nang hindi nagiging lipas o labis na teknikal. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
