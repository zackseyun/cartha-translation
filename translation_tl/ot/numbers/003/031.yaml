  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: tl
  text: At ang kanilang tungkulin ay ang kaban, ang mesa, ang patungan ng ilawan, ang mga altar, ang mga kagamitan sa santuwaryo na ginagamit sa paglilingkod, ang tabing[a], at lahat ng paglilingkod na kaugnay nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay tabing o kurtina sa pasukan, hindi ang panloob na tabing.
    reason: cultural_note
  - marker: b
    text: Sa Hebreo, “at ang lahat ng paglilingkod nito”; hindi ganap na tiyak kung ano ang tuwirang tinutukoy ng “nito.”
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: At ito ang pananagutan nila
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang מִשְׁמֶרֶת sa iniatas na tungkulin o responsibilidad. Likas at malinaw sa makabagong Filipino ang “pananagutan,” at ipinakikita ng “ito” na kasunod ang talaan ng mga ipinagkatiwala sa kanila.
- source_word: הָאָרֹן
  choice: ang kaban
  rationale: Ang אָרוֹן sa kontekstong ito ay ang sagradong kaban. Hindi idinagdag ang “ng tipan” o “ng patotoo” sapagkat wala ang mga iyon sa tekstong Hebreo ng talatang ito.
- source_word: הַשֻּׁלְחָן
  choice: ang mesa
  rationale: Payak na “ang mesa” ang nasa Hebreo; sapat ito sa konteksto ng mga kagamitan ng tabernakulo at hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: הַמְּנֹרָה
  choice: ang patungan ng ilawan
  rationale: Isinasalin ang kahulugan ng מְנוֹרָה bilang kultikong lampstand sa halip na hiramin lamang ang “menorah.” Mas madaling maunawaan ito ng karaniwang mambabasa kaysa “kandelero,” na maaaring magpahiwatig ng kandila.
- source_word: הַמִּזְבְּחֹת
  choice: ang mga altar
  rationale: Maramihan ang anyong Hebreo, kaya pinanatili ang “mga altar.” Karaniwan at nauunawaang terminong Filipino ang “altar.”
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: ang mga kagamitan sa santuwaryo
  rationale: Malawak ang saklaw ng כְּלִים—mga kasangkapan, sisidlan, o kagamitan—kaya ang “mga kagamitan” ang pinakanatural na pangkalahatang salita. Sa kontekstong ito, ang הַקֹּדֶשׁ ay tumutukoy sa banal na dako o santuwaryo.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: na ginagamit nila sa paglilingkod
  rationale: Ipinahihiwatig ng בָהֶם na ang mga kagamitan ang ginagamit bilang instrumento sa sagradong paglilingkod. Pinananatili ng “paglilingkod” ang kultikong diwa ng שׁרת nang hindi gumagamit ng makitid na terminong eklesiastikal.
- source_word: הַמָּסָךְ
  choice: ang tabing sa pasukan
  rationale: Ang מָסָךְ ay tabing o nakasabit na takip sa isang pasukan, at naiiba sa panloob na tabing na karaniwang tinutukoy ng פָּרֹכֶת. Ang “sa pasukan” ay isang maikling paglilinaw ng tinutukoy sa konteksto.
- source_word: וְכָל עֲבֹדָתוֹ
  choice: at ang lahat ng paglilingkod na kaugnay ng mga iyon
  rationale: Ang עֲבֹדָה rito ay gawaing paglilingkod sa santuwaryo. Malabo ang tiyak na antecedent ng panlalaking isahang hulapi; ang idiomatikong Filipino ay nagpapahayag ng kaugnayan sa buong talaan nang hindi tahasang itinatakda sa iisang bagay.
theological_decisions:
- issue: Kultikong katawagan para sa gawain sa tabernakulo
  choice: Gamitin ang “paglilingkod” para sa שׁרת at עֲבֹדָה
  alternative: Gamitin ang mas pangkalahatang “pagsisilbi” at “gawain”
  rationale: Ang bokabularyo ng talata ay nauukol sa sagradong paglilingkod sa tabernakulo. Pinananatili ng “paglilingkod” ang kontekstong pansamba ngunit hindi nag-aangkat ng katawagang natatangi sa anumang denominasyon.
- issue: Tinutukoy ng hulapi sa עֲבֹדָתוֹ
  choice: Isalin bilang “paglilingkod na kaugnay ng mga iyon” upang mapanatili ang pangkalahatang ugnayan sa mga nakalistang bagay
  alternative: Isalin nang mas literal na “lahat ng paglilingkod nito,” na maaaring magmukhang may malinaw na iisang antecedent
  rationale: Panlalaking isahan ang hulapi sa Hebreo, ngunit hindi lubos na tiyak kung alin ang tuwirang tinutukoy nito sa daloy ng pangungusap. Iniiwasan ng salin ang di-makatwirang paglutas sa tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga karaniwang terminong “kaban,” “mesa,” “altar,” at “santuwaryo.” Iniwasan ang lipas na “kandelero” at ang transliterasyong “menorah.” Ang ayos na may tutuldok ay natural na nagpapakilala sa talaan habang pinananatili ang administratibo at sagradong himig ng talata.
