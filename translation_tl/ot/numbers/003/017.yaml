  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: tl
  text: 'Ito ang mga anak ni Levi ayon sa kani-kanilang pangalan: sina Gershon, Kohat, at Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ אֵלֶּה
  choice: Ito ang
  rationale: Sa talaan ng angkan, natural na modernong Tagalog ang hulmaing “Ito ang” upang ipakilala ang mga pangalang kasunod; ang וַיִּהְיוּ ay payak na panandang pasalaysay at hindi nagpapahiwatig ng pagbabago ng kalagayan.
- source_word: בְנֵי לֵוִי
  choice: mga anak ni Levi
  rationale: Tumutukoy rito sa tatlong tuwirang lalaking anak ni Levi, kaya tumpak at natural ang “mga anak,” sa halip na mas malawak na “mga inapo.”
- source_word: בִּשְׁמֹתָם
  choice: ayon sa kani-kanilang pangalan
  rationale: Pinananatili nito ang kahulugan ng בְּ bilang “ayon sa” at ang maramihang hulaping “kanilang,” habang likas sa Tagalog ang “kani-kanilang” sa pagpapakilala ng hiwa-hiwalay na pangalan.
- source_word: גֵּרְשׁוֹן
  choice: Gershon
  rationale: Transliterasyon ng pangalang Hebreo na sumusunod sa karaniwang anyong ginagamit sa Filipino.
- source_word: קְהָת
  choice: Kohat
  rationale: Malapit sa tunog ng Hebreong Qĕhāt at umaayon sa karaniwang baybay sa Filipino.
- source_word: מְרָרִי
  choice: Merari
  rationale: Tuwirang transliterasyon ng personal na pangalan sa anyong madaling basahin sa Filipino.
