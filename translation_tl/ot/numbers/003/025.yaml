  text: וּ/מִשְׁמֶ֤רֶת בְּנֵֽי גֵרְשׁוֹן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד הַ/מִּשְׁכָּ֖ן וְ/הָ/אֹ֑הֶל מִכְסֵ֕/הוּ וּ/מָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: tl
  text: Ang tungkulin[a] ng mga anak ni Gershon sa toldang tipanan ay ang tabernakulo, ang tolda, ang pantakip nito, at ang tabing[b] sa pasukan ng toldang tipanan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pananagutan” o “atas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kurtina”; tumutukoy ito sa nakasabit na pantakip sa pasukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: pananagutan
  rationale: Sa konteksto ng atas sa mga Levita, tumutukoy ito sa mga bagay na ipinagkatiwala sa mga anak ni Gershon upang asikasuhin at pangalagaan. Likas sa makabagong Filipino ang “pananagutan” at malinaw nitong ipinakikilala ang kasunod na talaan.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: mga anak ni Gershon
  rationale: Pinananatili nito ang tahasang pananalitang pampamilya ng Hebreo sa natural na Filipino; maaari rin sanang gamitin ang “mga Gershonita.”
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa toldang tipanan
  rationale: Ang בְּ ay tumutukoy rito sa lugar o saklaw ng paglilingkod. Ang “toldang tipanan” ay malinaw at nakaugat sa kahulugan ng pariralang Hebreo.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ginagamit ang nakasanayang teknikal na katawagan sa sagradong tirahan, habang iniiwasang ipagkamali ito sa kasunod na “tolda.”
- source_word: וְהָאֹהֶל
  choice: ang tolda
  rationale: Pinananatili ang pagkakaiba ng tolda at ng tabernakulo sa talaan ng mga bahaging ipinagkatiwala sa kanila. Hindi na inulit ang “at” upang maging natural ang listahan sa Filipino.
- source_word: מִכְסֵהוּ
  choice: ang pantakip nito
  rationale: Ang hulaping panghalip ay tumutukoy sa tolda o sa kabuuang estruktura; sapat na tiyak at maikli ang “pantakip nito.”
- source_word: מָסַךְ
  choice: ang tabing
  rationale: Tumutukoy ito sa nakasabit na pantakip sa isang pasukan. Natural sa Filipino ang “tabing,” at maaari rin itong tawaging “kurtina.”
- source_word: פֶּתַח
  choice: sa pasukan
  rationale: Ipinahahayag nito nang natural ang kinalalagyan at gamit ng tabing sa bungad.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Pareho ang salin sa dalawang paglitaw ng pariralang Hebreo sa talata.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormang “mga anak ni Gershon” at ang pagkakaiba ng “tabernakulo” at “tolda.” Pinanatili rin ang kuwit sa hulihan dahil nagpapatuloy sa kasunod na talata ang pangungusap at talaan.
