  text: וְ/לִ/קְהָ֗ת מִשְׁפַּ֤חַת הַֽ/עַמְרָמִי֙ וּ/מִשְׁפַּ֣חַת הַ/יִּצְהָרִ֔י וּ/מִשְׁפַּ֨חַת֙ הַֽ/חֶבְרֹנִ֔י וּ/מִשְׁפַּ֖חַת הָֽ/עָזִּיאֵלִ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת הַ/קְּהָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: tl
  text: 'At kay Kohat: ang angkan ng mga Amramita, ang angkan ng mga Izharita, ang angkan ng mga Hebronita, at ang angkan ng mga Uzielita—ito ang mga angkan ng mga Kohatita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: At kay Kohat
  rationale: Ipinakikilala ng pang-ukol ang susunod na pangkat na nagmula kay Kohat; natural sa Tagalog ang “kay Kohat” habang pinananatili ang pag-uuring genealogical.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa konteksto ng talaan at sensus, tumutukoy ang מִשְׁפָּחָה sa isang pangkat na magkakamag-anak sa loob ng mas malaking lipi; ang “angkan” ang malinaw at likas na katumbas.
- source_word: הַֽ/עַמְרָמִי
  choice: mga Amramita
  rationale: Ang anyong gentiliko ay tumutukoy sa mga inapo ni Amram; ang hulaping “-ita” ay natural na paraan sa tradisyong Tagalog ng pagtukoy sa gayong pangkat.
- source_word: הַ/יִּצְהָרִי
  choice: mga Izharita
  rationale: Tumutukoy ang gentiliko sa mga inapo ni Izhar; pinananatili ng “Izharita” ang malinaw na ugnayan sa personal na pangalang Izhar.
- source_word: הַֽ/חֶבְרֹנִי
  choice: mga Hebronita
  rationale: Tumutukoy ang gentiliko sa mga inapo ni Hebron; ang “Hebronita” ay maikli, malinaw, at kaayon ng mga katabing katawagan.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: mga Uzielita
  rationale: Tumutukoy ang gentiliko sa mga inapo ni Uziel; ang baybay na “Uzielita” ay madaling basahin sa Filipino at malinaw na nagmula sa pangalang Uziel.
- source_word: אֵלֶּה הֵם
  choice: ito ang
  rationale: Ang demonstratibo at panghalip ay bumubuo ng pahayag na pagkakakilanlan; ang “ito ang” ay natural sa Tagalog para sa pagbubuod ng naunang talaan.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: mga angkan ng mga Kohatita
  rationale: Binubuod ng parirala ang nakalistang mga sangay bilang mga pangkat na nagmula kay Kohat; pinananatili ang “angkan” at ang gentiliko para sa Kohatita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “angkan” para sa administratibo at genealogical na kahulugan ng מִשְׁפָּחָה, at magkakatugmang anyong “-ita” para sa mga pangkat ng inapo. Walang kinakailangang talababa.
