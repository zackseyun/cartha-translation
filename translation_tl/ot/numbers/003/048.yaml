translation_notes:
  register: Gumamit ng makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang “pilak” bilang kongkretong katawagan sa bayad at ang bahagyang pagiging masiksik ng Hebreo ay nilinaw nang hindi dinaragdagan ang nilalaman.
