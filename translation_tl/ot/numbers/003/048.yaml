  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: tl
  text: At ibibigay mo kay Aaron at sa kanyang mga anak ang pilak bilang pantubos sa mga labis sa bilang nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na salin, “para sa mga tinubos na kabilang sa mga lumabis sa kanila.” Masiksik ang pagkakaugnay ng mga salita sa Hebreo; nililinaw sa pangunahing teksto na ang pilak ang halagang pantubos para sa mga lumabis sa bilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: At ibibigay mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki na may pang-ugnay ay nagsisilbing tagubilin sa kontekstong ito. Pinananatili ng “At ibibigay mo” ang pagkakasunod mula sa naunang talata.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Ang כֶּסֶף ay literal na “pilak” at maaari ring tumukoy sa salapi. Ang “pilak” ay malapit sa Hebreo at malinaw pa rin bilang halagang ibinabayad.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kay Aaron at sa kanyang mga anak
  rationale: Likas sa modernong Tagalog ang magkaibang panandang “kay” at “sa.” Ang “mga anak” ay tumutukoy sa mga anak na lalaki ni Aaron ayon sa konteksto ng pagkasaserdote, nang hindi kailangang gawing mabigat ang pangunahing teksto.
- source_word: פְּדוּיֵי
  choice: bilang pantubos sa
  rationale: Ang anyong construct ay masiksik at maaaring tumukoy sa mga tinubos o sa halagang kaugnay ng pagtubos. Dahil “ang pilak” ang tuwirang layon, natural na ipinapahayag ito bilang halagang pantubos.
- source_word: הָעֹדְפִים
  choice: mga labis sa bilang
  rationale: Ang participle mula sa עודף ay tumutukoy sa mga lumampas sa katumbas na bilang—ang sobrang mga panganay ng Israel kung ihahambing sa mga Levita.
- source_word: בָּהֶם
  choice: nila
  rationale: Ipinapahayag nito ang ugnayan ng mga lumabis sa loob ng grupong binilang. Sa pariralang “mga labis sa bilang nila,” malinaw at likas sa Tagalog ang diwa ng “among them.”
