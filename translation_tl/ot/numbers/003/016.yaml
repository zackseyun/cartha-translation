  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: tl
  text: Kaya binilang sila ni Moises ayon sa utos ni Yahweh[a], gaya ng iniutos sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ayon sa bibig ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: binilang
  rationale: Sa konteksto ng sensus sa mga Levita, ang פקד ay tumutukoy sa pagbilang o pagtatala ng mga tao. Likas at malinaw sa modernong Tagalog ang “binilang.”
- source_word: אֹתָם
  choice: sila
  rationale: Tuwirang layon ito na tumutukoy sa mga Levita sa naunang konteksto; natural sa Tagalog ang “sila” pagkatapos ng pandiwang pokus sa layon na “binilang.”
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang idyomang עַל־פִּי, na literal na “ayon sa bibig ni,” ay nangangahulugang pagkilos alinsunod sa isang utos. Pinananatili ng “ayon sa utos” ang awtoridad ng pahayag sa natural na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Ipinahahayag nito ang pagtutugma ng ginawa ni Moises sa naunang iniutos sa kanya; natural at sapat sa Tagalog ang “gaya ng.”
- source_word: צֻוָּה
  choice: iniutos sa kanya
  rationale: Ang pandiwa ay Pual na pasibo, “siya ay inutusan.” Ang “iniutos sa kanya” ay natural na anyong Tagalog at pinananatiling di-binabanggit ang tagapag-utos sa huling sugnay, gaya ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Hindi tahasang binanggit ang gumagawa ng pag-uutos sa צֻוָּה
  choice: iniutos sa kanya
  alternative: iniutos sa kanya ni Yahweh
  rationale: Pasibo ang Hebreo at hindi inuulit ang tahasang tagapag-utos sa huling sugnay. Hindi ito dinagdagan sa salin, bagaman malinaw sa konteksto na si Yahweh ang nag-utos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “binilang” at ang natural na idyomang “ayon sa utos,” habang inilagay sa talababa ang literal na larawang Hebreo.
