  text: At ang pinuno[a] ng sambahayan ng ama[b] ng mga angkan ng mga Kohatita ay si Elizafan, anak ni Uziel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “puno” o “prinsipe” (Hebreo: נָשִׂיא).'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sambahayan ng ama,” isang idyoma para sa sambahayan o pangkat ng magkakamag-anak na nagmula sa iisang ninuno sa linya ng ama.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: At ang pinuno
  rationale: Ang נָשִׂיא ay tumutukoy sa kinikilalang pinuno ng isang pangkat; natural ang “pinuno” sa kontekstong pantribo at hindi ito nagpapahiwatig ng pagiging hari. Isinalin ang ו bilang “At” upang ipagpatuloy ang talaan.
- source_word: בֵית אָב
  choice: sambahayan ng mga ninuno
  rationale: Isang idyomang Hebreo para sa yunit ng magkakamag-anak na nakabatay sa angkan ng ama. Inihahayag ng saling ito ang kahulugang panlipunan sa likas na Tagalog.
- source_word: לְ/מִשְׁפְּחֹת
  choice: para sa mga angkan
  rationale: Ang לְ ay may diwang kaugnayan o pananagutan sa mga מִשְׁפָּחוֹת. Pinili ang “mga angkan” upang maiba sa mas malawak na “sambahayan ng mga ninuno” at maipakita ang patong-patong na kaayusang pampamilya.
- source_word: הַ/קְּהָתִי
  choice: ng mga Kohatita
  rationale: Ang anyong gentilic na isahan ay ginagamit nang kolektibo para sa mga inapo o pangkat ni Kohat; ang “mga Kohatita” ay malinaw na katawagang pang-angkan.
- source_word: אֶלִיצָפָן
  choice: Elizafan
  rationale: Isinatinig ang pangalang pantangi sa paraang madaling basahin sa modernong Filipino.
- source_word: בֶּן עֻזִּיאֵל
  choice: na anak ni Uziel
  rationale: Natural na salin ng karaniwang pormulang pangangkan na “anak ni.”
