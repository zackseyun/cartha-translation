reference: Numbers 3:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֣מָת נָדָ֣ב וַ/אֲבִיה֣וּא לִ/פְנֵ֣י יְהוָ֡ה בְּֽ/הַקְרִבָ/ם֩ אֵ֨שׁ זָרָ֜ה לִ/פְנֵ֤י יְהוָה֙ בְּ/מִדְבַּ֣ר סִינַ֔י וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַ/יְכַהֵ֤ן אֶלְעָזָר֙ וְ/אִ֣יתָמָ֔ר עַל פְּנֵ֖י אַהֲרֹ֥ן אֲבִי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: tl
  text: Ngunit namatay sina Nadab at Abihu sa harap ni Yahweh nang maghandog sila ng apoy na hindi pinahintulutan[a] sa harap ni Yahweh sa ilang ng Sinai. Wala silang mga anak na lalaki; at naglingkod bilang mga pari sina Eleazar at Itamar sa harap ng kanilang amang si Aaron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “kakaibang apoy” o “dayuhang apoy.” Malamang na tumutukoy ang Hebreo sa apoy na hindi itinakda o pinahintulutan para sa handog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain na naglingkod sina Eleazar at Itamar bilang mga pari habang nabubuhay ang kanilang amang si Aaron.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: namatay
  rationale: Tuwirang nagsasalaysay ang pandiwa ng kanilang pagkamatay; ipinahihiwatig ng panandang “sina” na dalawa ang simuno kahit isahan ang anyo ng pandiwa sa Hebreo.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang Hebreong idyoma na maaaring tumukoy sa pagiging nasa harapan o presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: בְּהַקְרִבָם
  choice: nang maghandog sila
  rationale: Ipinahahayag ng pariralang infinitibo ang pangyayaring kasabay o sanhi ng salaysay, at ang “maghandog” ang likas na katumbas sa kontekstong pangsakripisyo.
- source_word: אֵשׁ זָרָה
  choice: apoy na hindi pinahintulutan
  rationale: Sa kontekstong panritwal, ang זָרָה ay tumutukoy sa apoy na hindi nararapat o hindi awtorisado. Mas malinaw ito sa karaniwang mambabasa kaysa sa literal ngunit malabong “kakaibang apoy,” habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: בְּמִדְבַּר סִינַי
  choice: sa ilang ng Sinai
  rationale: Likas at maikling salin ng pariralang heograpiko, na pinananatili ang pangalan ng lugar.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: Wala silang mga anak na lalaki
  rationale: Partikular na nangangahulugang “mga anak na lalaki” ang בָנִים, na mahalaga sa konteksto ng paghalili sa pagkapari.
- source_word: וַיְכַהֵן
  choice: naglingkod bilang mga pari
  rationale: Ipinahahayag ng pandiwa ang pagganap ng tungkuling makapari; ginawang maramihan ang parirala dahil dalawa ang simuno.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: sa harap ng kanilang amang si Aaron
  rationale: Pinananatili ang larawan at kalabuan ng Hebreong idyoma, na maaaring mangahulugang nasa presensiya ni Aaron o naglingkod habang nabubuhay siya.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng אֵשׁ זָרָה sa pagsamba
  choice: apoy na hindi pinahintulutan
  alternative: kakaibang apoy / dayuhang apoy
  rationale: Ipinakikita ng konteksto na hindi katanggap-tanggap ang apoy, ngunit hindi dinaragdagan ng salin ang teksto ng tiyak na paliwanag kung ano mismo ang paglabag.
- issue: Ugnayan nina Eleazar at Itamar kay Aaron sa עַל פְּנֵי
  choice: sa harap ng kanilang amang si Aaron
  alternative: habang nabubuhay ang kanilang amang si Aaron
  rationale: Hindi tahasang nilulutas ng salin kung ang diin ay presensiya, pangangasiwa, o kapanahunan; inilalahad sa talababa ang posibleng temporal na diwa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ilang” bilang pamilyar na katawagang biblikal, at pinanatili ang Hebreong pag-uulit ng “sa harap ni Yahweh.” Iniwasan ang pagdaragdag ng ugnayang sanhi sa pagitan ng kawalan ng mga anak na lalaki at ng paglilingkod ng magkapatid.
