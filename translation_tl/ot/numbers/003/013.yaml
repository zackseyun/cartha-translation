  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: tl
  text: Sapagkat akin ang bawat panganay.[a] Noong araw na pinuksa ko ang bawat panganay sa lupain ng Ehipto, itinalaga kong banal para sa aking sarili ang bawat panganay sa Israel, mula sa tao hanggang sa hayop.[b] Sila ay magiging akin. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa akin nauukol” ang inuulit na pariralang “akin / para sa aking sarili / magiging akin.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa tao hanggang sa hayop,” isang ekspresyong sumasaklaw sa mga tao at mga hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag tungkol sa mga Levita.
- source_word: לִי
  choice: akin / para sa aking sarili / magiging akin
  rationale: Pinananatili ang tatlong ulit na diin sa pag-aari ng Diyos, habang gumagamit ng likas na mga anyo sa Tagalog.
- source_word: כָּל בְּכוֹר
  choice: bawat panganay
  rationale: Tumpak at likas na tumutukoy sa bawat unang isinilang; hindi idinaragdag ang kasariang hindi hayag sa Hebreo.
- source_word: בְּיוֹם הַכֹּתִי
  choice: Nang araw na lipulin ko
  rationale: Pinananatili ang tahasang panandang temporal at ipinahahayag ang nakamamatay na paghampas sa mga panganay sa Ehipto.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang buong pariralang nasa Hebreo at ang maringal na himig nito.
- source_word: הִקְדַּשְׁתִּי
  choice: ibinukod ko para sa aking sarili
  rationale: Ipinahahayag ang pagtatangi bilang banal at pag-aangkin ng Diyos sa paraang malinaw sa karaniwang mambabasa.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: mula sa tao hanggang sa hayop
  rationale: Pinananatili ang saklaw ng Hebreong ekspresyon mula sa mga tao hanggang sa mga hayop.
- source_word: יִהְיוּ
  choice: Sila ay magiging
  rationale: Ipinahahayag ang panghinaharap at nagpapatuloy na pag-aangkin ng Diyos.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na tuwirang nasa tekstong Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa natatanging pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng הִקְדַּשְׁתִּי
  choice: ibinukod ko para sa aking sarili
  alternative: pinabanal ko / itinalaga ko
  rationale: Malinaw nitong pinagsasama ang banal na pagbubukod at ang pag-aangkin ng Diyos nang hindi nagpapasok ng karagdagang doktrinal na paliwanag.
- issue: Paglalahad sa אָדָם sa merismong tao-hayop
  choice: tao
  alternative: sangkatauhan / mga tao
  rationale: Ang kolektibong “tao” ay angkop sa nakapirming ekspresyong sumasaklaw sa kategoryang pantao at panghayop.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng pag-aangkin ng Diyos at ang pormal na temporal na parirala. Ginamit ang “lipulin” upang maging malinaw ang nakamamatay na kahulugan ng נכה sa konteksto, at “ibinukod” upang maipahayag nang natural ang kultikong diwa ng הקדישׁ.
