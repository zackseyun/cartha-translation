  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: tl
  text: At maghanda ka ng sangkapat na hin ng alak bilang handog na inumin, kasama ng handog na sinusunog[a] o para sa hain, para sa bawat kordero.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sa ibabaw ng handog na sinusunog.” Ito ang mas literal na kahulugan ng pang-ukol na Hebreo, ngunit dito ay malamang na tumutukoy ito sa pagsama ng handog na inumin sa ritwal.
    reason: lexical_alternative
  - marker: b
    text: Literal, “para sa isang kordero.” Ipinahahayag ng “para sa bawat kordero” ang diwang pamahagi ng tagubilin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: At ... alak
  rationale: Ipinagdurugtong ng וְ ang tagubiling ito sa nauna, at ang יַיִן ay karaniwang salitang Hebreo para sa alak.
- source_word: לַ/נֶּסֶךְ
  choice: bilang handog na inumin
  rationale: Sa konteksto ng paghahain, ang נֶסֶךְ ay handog na alak na ibinubuhos. Ang 'handog na inumin' ay malinaw at nakaugaliang salin sa Filipino.
- source_word: רְבִיעִית הַ/הִין
  choice: sangkapat na hin
  rationale: Tumpak nitong pinananatili ang takdang dami at ang sinaunang yunit na 'hin' nang hindi gumagawa ng di-tiyak na modernong konbersiyon.
- source_word: תַּעֲשֶׂה
  choice: maghanda ka
  rationale: Bagaman literal na 'gawin' ang עָשָׂה, sa tagubiling pangritwal ay natural itong tumukoy sa paghahanda ng ihahandog.
- source_word: עַל הָ/עֹלָה
  choice: kasama ng handog na sinusunog
  rationale: Maaaring literal na 'sa ibabaw ng' ang עַל, ngunit sa kontekstong ito malamang na ipinahihiwatig nito ang pagsama ng handog na inumin sa handog na sinusunog.
- source_word: א֣וֹ לַ/זָּבַח
  choice: o ng hain
  rationale: Ang זֶבַח ay pangkalahatang katawagan sa haing kinakatay at nananatiling naiiba sa עֹלָה. Ang maikling 'hain' ay natural at hindi nagdaragdag ng di-hayag na uri.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: para sa bawat kordero
  rationale: 'Literal itong ''para sa isang kordero,'' ngunit sa tagubiling nagtatakda ng dami, malinaw na pamahagi ang diwa: ang takdang dami ay para sa bawat indibiduwal na kordero.'
