  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: tl
  text: Ang lalaking natagpuan nilang namumulot ng kahoy ay dinala nila kay Moises, kay Aaron, at sa buong kapulungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namumulot ng mga patpat.” Ang salitang Hebreo ay maaaring tumukoy sa kahoy sa pangkalahatan o sa mga piraso nito, gaya ng mga patpat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ אֹתוֹ
  choice: dinala ... ang lalaki
  rationale: Ang Hiphil ng קרב ay nangangahulugang ilapit o iharap. Sa kontekstong ito, natural na ipinapahayag ng “dinala ... ang lalaki” na iniharap nila siya sa mga pinuno at sa kapulungan; nililinaw rin ng “ang lalaki” ang reperente ng panghalip sa natural na Tagalog.
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: mga nakakita sa kanya
  rationale: Ang may-artikulong participle ay substantibo at tumutukoy sa mga taong nakatagpo sa lalaki habang ginagawa niya ang kilos.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: namumulot ng kahoy
  rationale: Ipinapakita ng participle ang patuloy na kilos nang matagpuan siya. Ang “namumulot” ay natural para sa pangangalap ng maliliit na piraso ng kahoy, samantalang pinananatili ng “kahoy” ang mas malawak na saklaw ng עֵצִים.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: kay Moises, kay Aaron, at sa buong kapulungan
  rationale: Ang אֶל ay nagpapahiwatig ng patutunguhan. Ang pag-uulit ng “kay” bago sa dalawang pangalan at “sa” bago sa kapulungan ay natural sa Tagalog at bahagyang sumasalamin sa inuulit na pang-ukol sa Hebreo.
- source_word: עֵדָה
  choice: kapulungan
  rationale: Ang “kapulungan” ay dignificado at malinaw na tumutukoy sa sama-samang pamayanan ng Israel sa legal at salaysay na konteksto.
