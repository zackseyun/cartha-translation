  register: Makabago, natural, at dignipikadong Filipino. Ginamit ang “kapulungan” para sa pormal na katawagan sa nagkakatipong pamayanan ng Israel, at iniwasan ang labis na literal na “inilapit” na maaaring maging di-likas sa salaysay.
