  - severity: medium
    issue: Ang "magpakailanman" ay mas malakas kaysa sa Hebreong saklaw na "at magmula noon/paabante, sa inyong mga salinlahi."
    rationale: Maaaring magpahiwatig ang "magpakailanman" ng walang hanggang panahon. Ang teksto ay partikular na nagmamarka ng pagpapatuloy sa mga salinlahi ng kausap.
