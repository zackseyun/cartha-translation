lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Likas sa Tagalog at pinananatili ang saklaw ng kabuuan na ipinahihiwatig ng כָּל אֲשֶׁר.
- source_word: צִוָּה יְהוָה אֲלֵיכֶם
  choice: iniutos sa inyo ni Yahweh
  rationale: Malinaw na ipinahahayag ang nilalaman ng utos, ang mga pinag-utusang kausap, at ang Diyos bilang tagapag-utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang tetragramaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ipinahahayag nito sa natural na Tagalog ang Hebreong idyoma ng pamamagitan o ahensiya; ang literal na anyo ay inilagay sa talababa.
- source_word: מִן הַיּוֹם אֲשֶׁר צִוָּה יְהוָה
  choice: mula nang araw na mag-utos si Yahweh
  rationale: Pinananatili ang panimulang punto sa panahon at ang pag-uulit ng pandiwang צִוָּה, habang gumagamit ng natural na aspektong Tagalog.
- source_word: וָהָלְאָה לְדֹרֹתֵיכֶם
  choice: at magpakailanman sa lahat ng inyong salinlahi
  rationale: Ipinahahayag ang pagpapatuloy mula sa tinukoy na araw hanggang sa sunod-sunod na mga salinlahi; ang 'magpakailanman' dito ay binibigyang-hangganan ng kasunod na pariralang pangsalinlahi.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalang pantangi ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh at hindi pinapalitan ng titulong 'PANGINOON.'
- issue: Tagapamagitan ng mga utos
  choice: sa pamamagitan ni Moises
  alternative: sa kamay ni Moises
  rationale: Ang בְּיַד ay idyoma ng ahensiya o pamamagitan. Iniiwasan ng pangunahing teksto ang maling impresyon na pisikal na kamay lamang ang tinutukoy, habang iniingatan sa talababa ang literal na larawan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang em dash dahil bahagi ang talata ng nagpapatuloy na pangungusap mula sa naunang konteksto; ginamit ang 'salinlahi' bilang karaniwan ngunit dignified na terminong biblikal.
