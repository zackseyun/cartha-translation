  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: tl
  text: ang lahat ng iniutos ni Yahweh sa inyo sa pamamagitan ni Moises[a], mula noong araw na nag-utos si Yahweh at magmula noon, sa bawat salinlahi ninyo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “sa kamay ni Moises,” isang idyomang nangangahulugang “sa pamamagitan ni Moises.”'
