id: NUM.15.30
reference: Numbers 15:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: tl
  text: Ngunit ang taong gumagawa nang may nakataas na kamay[a]—katutubo man o dayuhang naninirahan—ay lumalait kay Yahweh. Ang taong iyon ay ihihiwalay mula sa kanyang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang may kapangahasan” o “nang hayagang sumusuway”; literal, “nang may nakataas na kamay.”
    reason: Ipinapaliwanag ang idyomang Hebreo at inilalahad ang mga natural na katumbas nito sa Filipino.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: ang tao / ang taong iyon
  rationale: Sa kontekstong legal, ang נֶפֶשׁ ay tumutukoy sa buong tao, hindi lamang sa kaluluwa. Natural at malinaw sa makabagong Filipino ang “tao.”
- source_word: תַּעֲשֶׂה
  choice: gumagawa
  rationale: Malawak ang kahulugan ng עשה (“gumawa”). Hindi tinutukoy ng talata ang isang partikular na kasalanan, kaya hindi ito dapat gawing mas tiyak sa salin.
- source_word: בְּיָד רָמָה
  choice: nang may nakataas na kamay
  rationale: Pinananatili nito ang matingkad na literal na idyomang Hebreo, na nagpapahiwatig ng hayagan at mapangahas na pagsuway. Ipinaliliwanag sa talababa ang kahulugan.
- source_word: הָאֶזְרָח
  choice: katutubo
  rationale: Tumutukoy sa taong likas na kabilang sa bayang Israel, bilang kabaligtaran ng dayuhang naninirahan.
- source_word: הַגֵּר
  choice: dayuhang naninirahan
  rationale: Ang גֵּר ay hindi basta banyaga kundi isang hindi katutubong naninirahan sa gitna ng Israel. Mas malinaw ito sa modernong Filipino kaysa sa “manlalakbay” o “pansamantalang naninirahan.”
- source_word: אֶת יְהוָה הוּא מְגַדֵּף
  choice: ay lumalait kay Yahweh
  rationale: Ang גדף ay nagpapahayag ng paghamak o panlalait sa Diyos. Ang “lumalait” ay tuwiran at hindi nililimitahan ang kilos sa pasalitang pamumusong lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pantanging pangalan ng Diyos ayon sa anyong kinakatawan ng tetragrammaton.
- source_word: וְנִכְרְתָה
  choice: ay ihihiwalay
  rationale: Ipinahahayag ng Niphal ng כרת ang mabigat na pag-aalis mula sa sambayanan. Hindi tinutukoy ng salin kung ito ay pagpatay, pagpapatalsik, o tuwirang hatol ng Diyos.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: mula sa kanyang bayan
  rationale: Ipinahahayag nito ang pag-aalis mula sa sariling sambayanan. Ang “kanyang” ay natural at hindi nakatali sa kasarian sa Filipino.
theological_decisions:
- issue: Saklaw ng kasalanan at kahulugan ng kaparusahan
  choice: Inilalarawan ang hayagan at mapangahas na pagkilos bilang paglapastangan kay Yahweh, at sinasabing ihihiwalay ang nagkasala mula sa kanyang bayan nang hindi tinutukoy ang eksaktong paraan.
  alternative: Maaaring unawain ang “ihihiwalay” bilang pagpatay, pagpapatalsik sa sambayanan, o tuwirang hatol ng Diyos.
  rationale: Hindi nililinaw ng talata mismo kung aling mekanismo ng kaparusahan ang tinutukoy. Pinananatili ng salin ang bigat at tensiyong teolohikal ng pormulang legal nang hindi nagpapasok ng mas makitid na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na larawan ng idyomang Hebreo sa pangunahing teksto, habang ang kahulugan nito ay nilinaw sa talababa. Ginamit ang “dayuhang naninirahan” upang ihayag ang legal at panlipunang katayuan ng גֵּר.
