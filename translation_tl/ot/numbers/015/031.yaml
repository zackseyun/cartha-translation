  naturalness: Marangal at natural ang pangkalahatang daloy. Mas maingat at sapat na natural ang “tiyak na ihihiwalay” bilang pagpapanatili ng legal na idyom nang hindi ito nililimitahan sa pagtiwalag. Ang “nasa kanya ang kanyang kasalanan” ay may bahagyang pormal na register ngunit angkop sa legal at pangtipang pahayag.
  terminology: Ang “Yahweh” ay wastong pinananatili. Ang “utos” ay angkop para sa isahang מִצְוָתוֹ. Pinalitan ang “ititiwalag” upang huwag magpasiya sa pinagtatalunang anyo ng karet, at inalis ang “sarili niyang” upang huwag magdagdag sa kahulugan ng עָוֹן.
