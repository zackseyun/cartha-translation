base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: tl
  text: Sapagkat hinamak niya ang salita ni Yahweh at nilabag ang kanyang utos, ang taong iyon ay tiyak na ihihiwalay[a]; nasa kanya ang kanyang kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tiyak na ihihiwalay” ay nagpapanatili sa mariing idyom ng Hebreo; hindi tinutukoy rito ang eksaktong anyo ng hatol.
    reason: cultural_note
  - marker: b
    text: O “nasa kanya ang kanyang pananagutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng hatol sa naunang pahayag; natural at marangal itong panandang sanhi sa Filipino.
- source_word: דְבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Ang דָּבָר ay tumutukoy rito sa ipinahayag na salita o utos, at pinananatili ang pangalang tipan na Yahweh.
- source_word: בָּזָה
  choice: hinamak
  rationale: Ipinahahayag nito ang aktibong paghamak, hindi lamang pagpapabaya.
- source_word: מִצְוָתוֹ
  choice: ang Kanyang utos
  rationale: Pinananatili ang isahan ng Hebreo at ang bigat nitong legal at pangtipan.
- source_word: הֵפַר
  choice: nilabag
  rationale: Sa konteksto ng utos ng Diyos, malinaw at natural na ipinahahayag ng 'nilabag' ang paglabag o pagsira sa bisa nito.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: tiyak na ititiwalag
  rationale: Ang 'tiyak' ay kumakatawan sa mariing Hebreong infinitive absolute at pandiwa; ang 'ititiwalag' ay nagpapanatili sa legal na idyom nang hindi tinutukoy ang eksaktong paraan ng hatol.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ang taong iyon
  rationale: Sa legal na konteksto, ang נֶפֶשׁ ay tumutukoy sa indibidwal na tao, hindi sa 'kaluluwa' bilang hiwalay na bahagi ng pagkatao.
- source_word: עֲוֺנָהּ בָּהּ
  choice: nasa kanya ang sarili niyang kasamaan
  rationale: Pinananatili nito ang posibleng saklaw ng עָוֹן bilang kasamaan at pananagutang bunga nito, pati ang mariing pambabaeng hulapi na tumutukoy sa taong nabanggit.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang ipinahayag na pangalang pangtipan.
- issue: Kahulugan ng הִכָּרֵת תִּכָּרֵת sa batas ng tipan
  choice: tiyak na ititiwalag
  alternative: tiyak na lilipulin / papatayin / aalisin sa sambayanan
  rationale: Hindi tinutukoy ng talata kung ang hatol ay kamatayan, pagpapaalis sa komunidad, o ibang kaparusahan; kaya pinananatili ang saklaw at tensiyon ng idyom.
- issue: Saklaw ng עָוֹן
  choice: kasamaan
  alternative: kasalanan / pananagutan
  rationale: Maaaring tumukoy ang salita kapwa sa kasamaan at sa kaakibat nitong pananagutan o kaparusahan. Ang pangunahing teksto ay hindi lubusang nilulutas ang ugnayang ito, at inilalahad sa talababa ang kahalili.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang 'Sapagkat' para sa pormal ngunit natural na daloy, at iniwasang tukuyin nang lampas sa Hebreo ang eksaktong anyo ng pagtiwalag. Ang malaking titik sa 'Kanyang' ay estilistikong paggalang at hindi nagdaragdag ng teolohikal na kahulugan.
