  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: tl
  text: Iisang kautusan ang para sa inyo—para sa katutubong Israelita at sa dayuhang naninirahan[a] sa gitna ninyo—sa sinumang kumikilos nang di-sinasadya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dayuhang naninirahan” ay isang taong hindi katutubo ngunit nakatira sa loob ng pamayanan ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: katutubong Israelita
  rationale: Malinaw at likas na ipinahahayag nito ang isang taal na miyembro ng Israel, nang hindi gumagamit ng salitang maaaring ipakahulugang katutubong pangkat-etniko sa makabagong gamit.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: at sa dayuhang naninirahan sa gitna ninyo
  rationale: Ang גֵּר sa kontekstong legal ay isang di-katutubong residenteng nakatira sa pamayanan, hindi isang dumaraang estranghero. Pinananatili ng “sa gitna ninyo” ang tuwirang pakikipag-usap sa Israel.
- source_word: תּוֹרָה אַחַת
  choice: Iisang kautusan
  rationale: Ipinakikita ng parirala na pareho ang tuntuning legal para sa dalawang pangkat. Ang “kautusan” ay angkop sa agarang kontekstong legal, samantalang ang “iisang” ay nagpapanatili sa diin ng אַחַת.
- source_word: יִהְיֶה לָכֶם
  choice: ang para sa inyo
  rationale: Natural na Filipino itong katumbas ng literal na “magiging para sa inyo” at malinaw na tumutukoy sa bisa ng kautusan sa buong pamayanan.
- source_word: לָעֹשֶׂה בִּשְׁגָגָה
  choice: kapag hindi sinasadya ang ginawa ng sinuman sa kanila
  rationale: Ang isahang participle ay pangkalahatan at maaaring tumukoy sa isang tao mula sa alinmang pangkat. Ang “hindi sinasadya” ay malinaw na naghahayag ng di-sinasadyang pagkilos sa kontekstong legal at panghandog.
theological_decisions:
- issue: Saklaw ng pantay na paglalapat ng kautusan sa katutubong Israelita at residenteng dayuhan
  choice: Iisang kautusan ang umiiral para sa dalawang pangkat kapag di-sinasadya ang ginawa ng isang tao.
  alternative: Maaaring isalin ang תּוֹרָה bilang “tagubilin” sa halip na “kautusan.”
  rationale: Binibigyang-diin ng Hebreo ang magkaparehong legal na tuntunin sa agarang usapin ng di-sinasadyang pagkilos, nang hindi pinalalawak ang pahayag tungo sa lahat ng posibleng larangan ng batas o teolohiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang hulma ng pangungusap na natural sa Tagalog habang pinananatili ang diin sa iisang kautusan, ang dalawang pangkat, at ang di-sinasadyang pagkilos.
