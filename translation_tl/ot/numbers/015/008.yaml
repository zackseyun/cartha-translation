base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: tl
  text: At kapag naghanda ka ng isang toro bilang handog na sinusunog o hain, upang tuparin ang isang panata o bilang mga handog para sa kapayapaan[a] kay Yahweh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga handog para sa mabuting ugnayan” o “mga handog para sa kaginhawaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִּי
  choice: Kapag
  rationale: Sa konteksto ng sunod-sunod na tuntunin tungkol sa paghahandog, ipinakikilala nito ang isang kalagayang maaaring mangyari. Likas sa Tagalog ang “Kapag” at hindi nito ginagawang tiyak na mangyayari ang kaso.
- source_word: תַעֲשֶׂה
  choice: naghanda ka
  rationale: Karaniwang nangangahulugang “gumawa” ang pandiwa, ngunit sa tagubiling panghain, malinaw at likas ang “naghanda” nang hindi labis na ipinapakahulugang ito mismo ang buong gawa ng paghahandog.
- source_word: בֶן בָּקָר
  choice: isang toro
  rationale: Ang literal na idyomang “anak ng bakahan” ay tumutukoy sa isang hayop mula sa bakahan. “Toro” ang malinaw at maikling katumbas; hindi tahasang itinatakda rito ang edad kaya hindi idinagdag ang “batang.”
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Tumpak at madaling maunawaang katawagan para sa haing ganap na sinusunog sa altar.
- source_word: אוֹ זָבַח
  choice: o bilang hain
  rationale: Malawak na katawagan ang זֶבַח para sa hayop na kinakatay bilang hain. Pinananatili ng “hain” ang pangkalahatang saklaw nito.
- source_word: לְפַלֵּא נֶדֶר
  choice: upang tuparin ang isang panata
  rationale: Sa kontekstong ito, tumutukoy ang idyoma sa pagsasagawa o pagtupad sa ipinangakong handog. Likas sa modernong Tagalog ang “tuparin ang isang panata,” habang inilalahad sa talababa ang mas literal na posibilidad.
- source_word: אוֹ שְׁלָמִים
  choice: o bilang handog para sa kapayapaan
  rationale: Pinananatili nito ang kinikilalang kategorya ng hain at ang ugnayan ng salita sa kapayapaan o kabutihan, nang hindi nililimitahan ang kahulugan sa pakikisalo lamang.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol ay nagpapahayag kung kanino inihahandog ang hain. Ginamit ang personal na pangalang “Yahweh” para sa יהוה.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang pangalan ng Diyos. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng kahulugan ng שְׁלָמִים
  choice: handog para sa kapayapaan
  alternative: handog para sa mabuting ugnayan o handog para sa kagalingan
  rationale: May saklaw ang katawagan na kapayapaan, kabutihan, at pakikisalo. Ang pangunahing salin ay hindi nagtatakda na pakikisama lamang ang teolohikal na diwa, at ang ibang posibilidad ay inilagay sa talababa.
- issue: Kahulugan ng לְפַלֵּא נֶדֶר
  choice: upang tuparin ang isang panata
  alternative: upang magsagawa ng isang natatanging panata
  rationale: Sa konteksto ng handog na inihahanda, pinakamalamang na tinutukoy ang pagsasakatuparan ng ipinangako. Gayunman, may diwang “natatangi” o “espesyal” ang pandiwa sa ibang gamit, kaya hindi ito itinuring na ganap na walang ibang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pang-isahang “ka” ng tekstong Hebreo at ang di-tapos na pangungusap na may kuwit sapagkat nagpapatuloy ang tagubilin sa kasunod na talata. Ginamit ang mga katawagang madaling maunawaan nang hindi inaalis ang teknikal na katangian ng mga uri ng hain.
