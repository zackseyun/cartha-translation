  source_fidelity: Kailangang linawin ang pag-uugnay ng mga parirala. Sa Hebreo, ang “upang tuparin ang isang panata” at “bilang mga handog para sa kapayapaan” ay kapwa naglalarawan sa layunin/kategorya ng handog na naunang binanggit; sa kasalukuyang ayos, ang una ay maaaring mabasa na tanging tumutukoy sa “hain.” Ang pangmaramihang שְׁלָמִים ay dapat ding makita sa salin.
  naturalness: Likas at marangal ang karamihan ng pananalita. Mas malinaw sa modernong Filipino ang pagtanggal sa ikalawang “bilang” bago ang “hain” at ang paglalagay ng kuwit bago sa dalawang magkatambal na pariralang layunin.
  terminology: Ang “handog na sinusunog,” “hain,” “panata,” at “Yahweh” ay angkop. Ginawang pangmaramihan ang “mga handog para sa kapayapaan” upang tumugma sa terminong Hebreo. Ang “kagalingan” sa talababa ay maaaring maunawaan bilang pagpapagaling; “kaginhawaan” ay mas malapit sa diwang well-being, bagaman hindi nito inuubos ang saklaw ng termino.
