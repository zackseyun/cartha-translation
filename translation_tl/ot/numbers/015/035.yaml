  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָ/אִ֑ישׁ רָג֨וֹם אֹת֤/וֹ בָֽ/אֲבָנִים֙ כָּל הָ֣/עֵדָ֔ה מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Dapat talagang patayin ang lalaki.[a] Batuhin siya[b] ng buong sambayanan sa labas ng kampo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas pormal, “Tiyak na papatayin ang lalaki.” Mariin ang anyo ng pananalita sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “Batuhin siya ng mga bato,” isang mariing pahayag na tumutukoy sa pagpatay sa pamamagitan ng pagbato.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מוֹת יוּמַת
  choice: Dapat talagang patayin
  rationale: Ipinahahayag ng infinitive absolute na kasama ng pandiwang passive ang mariing katiyakan o bisa ng hatol. Natural sa modernong Tagalog ang “dapat talagang patayin” at hindi nito ikinukubli ang puwersang pasibo ng Hebreo.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Tumutukoy ang tiyak na pangngalan sa lalaking binanggit sa naunang konteksto.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: Batuhin siya
  rationale: Ang “batuhin” ay malinaw na tumutukoy sa pagpatay sa pamamagitan ng pagbato. Hindi na inuulit ang literal na “ng mga bato” sa pangunahing teksto dahil likas na nakapaloob na iyon sa pandiwang Tagalog; itinala sa talababa ang mariing anyo ng Hebreo.
- source_word: כָּל הָעֵדָה
  choice: ang buong sambayanan
  rationale: Ipinahahayag ng עֵדָה ang buong nagkakatipong pamayanan ng Israel; malinaw at marangal sa kasalukuyang Tagalog ang “buong sambayanan.”
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Natural at tumpak na pook na katumbas ng Hebreong pariralang lokatibo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Puwersa ng hatol na מוֹת יוּמַת
  choice: Dapat talagang patayin
  alternative: Tiyak na papatayin
  rationale: Maaaring idiin ng Hebreong konstruksyon ang katiyakan at pormal na bisa ng hatol. Pinagsasama ng napiling salin ang obligasyon ng utos at ang mariing puwersa nito nang hindi nagdaragdag ng paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang pormal na himig ng hatol, ngunit iniwasan ang di-likas na pag-uulit na “batuhin ng mga bato” sa pangunahing teksto; inilagay ang literal na anyo sa talababa.
