  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: tl
  text: Ngunit kung ang isang tao ay magkasala nang hindi sinasadya, maghahandog siya ng isang babaeng kambing na isang taóng gulang bilang handog para sa kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Ang salitang Hebreo ay maaaring tumukoy sa handog na tumutugon sa kasalanan o karumihan, hindi lamang sa kasalanan mismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ng pangatnig at kondisyon ang bahagyang pagsalungat sa naunang tuntunin habang ipinagpapatuloy ang batas.
- source_word: נֶפֶשׁ אַחַת
  choice: ang isang tao
  rationale: Sa kontekstong legal, ang נֶפֶשׁ ay tumutukoy sa isang tao o indibidwal, hindi lamang sa 'kaluluwa.'
- source_word: תֶּחֱטָא בִשְׁגָגָה
  choice: ay magkasala nang hindi sinasadya
  rationale: Malinaw na ipinahahayag nito ang pagkakasalang nagawa dahil sa pagkakamali o kawalan ng layunin, kaiba sa hayagang sinasadyang pagsuway.
- source_word: וְהִקְרִיבָה
  choice: maghahandog siya
  rationale: Sa kontekstong paghahandog, ang Hiphil ng קרב ay nangangahulugang dalhin o iharap bilang handog; natural sa Filipino ang 'maghahandog.'
- source_word: עֵז
  choice: babaeng kambing
  rationale: Tiyak na babaeng kambing ang tinutukoy ng pangngalang Hebreo, kaya pinanatili ang kasarian ng hayop.
- source_word: בַּת שְׁנָתָהּ
  choice: na isang taóng gulang
  rationale: Ang idyomang Hebreo ay tumutukoy sa hayop na nasa unang taon nito; ito ang malinaw at natural na katumbas sa Filipino.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa batas tungkol sa mga hain, ang חַטָּאת ay karaniwang pangalan ng handog na tumutugon sa kasalanan o karumihan.
theological_decisions:
- issue: Kasarian ng nagkasala sa isahan
  choice: Ginamit ang likas na neutral-sa-kasariang 'ang isang tao' at ang panghalip na 'siya.'
  alternative: Tahasan itong isalin bilang isang babae dahil pambabae ang mga anyong gramatikal sa Hebreo.
  rationale: Pambabae sa gramatika ang נֶפֶשׁ at ang mga pandiwang umaayon dito, ngunit malamang na gramatikal na pagtutugma ito at hindi paghihigpit ng batas sa mga babae. Hindi kailangang magtakda ng kasarian ang natural na Filipino na 'tao' at 'siya,' kaya napapanatili ang saklaw ng orihinal nang hindi nagdaragdag ng kahulugang wala roon.
- issue: Kahulugan ng חַטָּאת sa batas ng paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang tradisyonal at madaling maunawaang katawagan ay 'handog para sa kasalanan,' ngunit maaaring idiin ng terminong Hebreo ang ritwal na paglilinis; pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong panrelihiyon nang hindi nagiging lipas o labis na teknikal. Ang pambabaeng gramatika ng Hebreo ay hindi ginawang tahasang babae sa Filipino sapagkat ang 'tao' at 'siya' ay likas na walang tinutukoy na kasarian.
