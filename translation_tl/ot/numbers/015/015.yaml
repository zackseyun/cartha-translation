base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: tl
  text: 'Para sa kapulungan, iisa ang tuntunin para sa inyo at sa dayuhang naninirahan[a]: isang tuntuning mananatili[b] sa lahat ng inyong salinlahi. Magiging gaya ninyo ang dayuhang naninirahan sa harap ni Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakikipamayang dayuhan” o “dayuhang residente.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tuntuning panghabang-panahon” o “palagiang tuntunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  choice: kapulungan
  rationale: Tumutukoy ang קָהָל sa nagkakatipong pamayanan. Likas at marangal sa Filipino ang “kapulungan” at hindi nito ipinapalagay na isang institusyong pansimbahan ang tinutukoy.
- source_word: חֻקָּה אַחַת
  choice: iisa ang tuntunin
  rationale: Pinananatili nito ang legal na diwa ng חֻקָּה at ang diin ng אַחַת sa iisang pamantayang umiiral para sa dalawang pangkat.
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: para sa inyo at sa dayuhang naninirahan
  rationale: Ang גֵּר ay isang di-katutubong naninirahan sa gitna ng Israel, hindi lamang isang di-kilala o panandaliang bisita. Ginagawang natural sa Filipino ng pariralang ito ang pag-uulit ng ugat ג־ו־ר nang hindi inaalis ang patuloy na paninirahan.
- source_word: חֻקַּת עוֹלָם
  choice: isang tuntuning mananatili
  rationale: Sa pormulang legal, ipinahihiwatig ng עוֹלָם ang patuloy at di-pansamantalang bisa. Iniiwasan ng “mananatili” ang di-kinakailangang pagpapasya kung pilosopikal na walang hanggan ang saklaw nito.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Malinaw nitong ipinapahayag ang patuloy na bisa sa magkakasunod na salinlahi.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: Kung ano kayo, gayon din ang dayuhang naninirahan
  rationale: Pinananatili ng balanseng paghahambing ang diin ng Hebreo sa pagkakapantay ng dalawang pangkat sa usaping legal na ito.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Direktang ipinapahayag nito ang kahulugang “sa harap/sa presensiya” at pinananatili ang personal na pangalang Yahweh.
theological_decisions:
- issue: Saklaw ng pagkakapantay ng katutubong Israelita at dayuhang naninirahan
  choice: Ipinahahayag ng talata na iisa ang tuntunin para sa dalawang pangkat sa harap ni Yahweh.
  alternative: Maaaring unawain ang pahayag nang mas makitid bilang tumutukoy lamang sa mga alituntunin sa paghahandog sa agarang konteksto.
  rationale: Malinaw ang diin ng teksto sa iisang tuntunin at magkatulad na katayuan, ngunit hindi pinalalawak ng salin ang pahayag nang lampas sa legal at panrelihiyong konteksto nito.
- issue: Tagal ng חֻקַּת עוֹלָם
  choice: “tuntuning mananatili” na may paliwanag na patuloy itong umiiral sa lahat ng salinlahi
  alternative: “tuntuning walang hanggan” o “panghabang-panahong tuntunin”
  rationale: Pinananatili nito ang pangmatagalang lakas ng pormula habang hindi ipinapasya nang higit sa teksto kung nangangahulugan ito ng abstrakto at walang-katapusang tagal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapulungan” sa halip na terminong may labis na pansimbahang dating, at “dayuhang naninirahan” upang malinaw na maiba ang residenteng dayuhan sa karaniwang bisita. Ang estruktura ng paghahambing sa hulihan ay sadyang pinanatili upang madama ang diin sa pagkakapantay sa harap ni Yahweh.
