  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: tl
  text: '“Magsalita ka sa mga anak ni Israel at sabihin mo sa kanila: ‘Kapag pumasok kayo sa lupaing dinadala ko kayo,[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “na dinadala ko kayo roon.”'
    reason: Ipinakikita ang mas pormal na kayarian ng Hebreo at ang tahasang שָׁמָּה (“roon”), na pinakinis sa pangunahing teksto.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Ang Piel imperative ng דבר ay tuwirang utos kay Moises na ihatid ang tagubilin ng Diyos; natural at marangal sa Filipino ang “Magsalita ka.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal at pampamilyang anyo ng Hebreo, sa halip na patagin bilang “mga Israelita.” Sa Filipino, maaaring saklawin ng “mga anak” ang mga inapo bilang isang bayan.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: at sabihin mo sa kanila
  rationale: Pinananatili ang karaniwang sunod na pormula ng utos sa Hebreo at natural itong pakinggan sa Filipino.
- source_word: בְּבֹאֲכֶם אֶל הָאָרֶץ
  choice: Kapag pumasok kayo sa lupain
  rationale: Ang בְּ + infinitive construct ay temporal, at sa kontekstong ito ang pagpasok sa lupain ang diwa ng בוא na sinusundan ng אֶל.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: pagdadalhan ko sa inyo
  rationale: Ipinahahayag ng participle ang nakatuon-sa-hinaharap na pagkilos ng Diyos. Isinasama ng “pagdadalhan” ang direksiyong ipinahihiwatig ng שָׁמָּה nang hindi lumilikha ng alanganing pag-uulit ng “doon.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormulang “mga anak ni Israel,” samantalang ginawang likas sa Filipino ang sugnay tungkol sa lupain. Ang pambungad at pangwakas na panipi ay nagpapakitang nagsisimula rito ang mensaheng ipasasabi, kahit nagpapatuloy ang pangungusap sa susunod na talata.
