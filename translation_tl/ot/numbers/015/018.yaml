    issue: Mali ang pagmamarka ng kalahok sa “lupaing pagdadalhan ko sa inyo.”
    rationale: Ang Hebreong אֶתְכֶם ay “kayo” bilang tuwirang layon ng “dinadala,” samantalang ang “sa inyo” ay nagpapahiwatig na may ibang bagay na dinadala para sa kanila. Nababaligtad nito ang kahulugan ng sugnay.
  - severity: medium
    issue: Mali rin ang literal na footnote na “na dinadalhan ko sa inyo roon.”
    rationale: 'Dapat nitong tukuyin na ang mga Israelita mismo ang dinadala: “na dinadala ko kayo roon.”'
