  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Gagawin ng bawat katutubong Israelita ang mga ito sa ganitong paraan, upang maghandog kay Yahweh ng isang handog na pinaraan sa apoy[a], isang samyong kalugud-lugod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na pagkain” o “handog sa pamamagitan ng apoy.” Ang salitang Hebreo ay isang teknikal na terminong pangsakripisyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: bawat katutubong Israelita
  rationale: Ang כָּל ay distributibo rito, at ang הָאֶזְרָח ay tumutukoy sa taal na kasapi ng Israel sa kaibahan sa dayuhang naninirahan na binabanggit sa kasunod na konteksto. Hindi eksklusibong lalaki ang diwa ng gramatikal na panlalaking anyo.
- source_word: יַעֲשֶׂה כָּכָה אֶת אֵלֶּה
  choice: Ganito gagawin ... ang mga ito
  rationale: Pinananatili ang preskriptibong diwa ng imperfect sa legal na konteksto at ang pagtukoy ng אֵלֶּה sa mga naunang itinakdang bagay o paghahandog, nang hindi nagdaragdag ng mas tiyak na pangngalan kaysa sa Hebreo.
- source_word: לְהַקְרִיב
  choice: sa paghahandog
  rationale: Sa kontekstong pangsakripisyo, ang pandiwa ay nangangahulugang maglapit o magharap bilang handog; natural at malinaw sa makabagong Filipino ang 'paghahandog.'
- source_word: אִשֵּׁה
  choice: handog na pinaraan sa apoy
  rationale: Ang teknikal na terminong pangsakripisyo ay may kaugnayan sa handog na inihahain sa pamamagitan ng apoy. Iniiwasan nitong ipasok sa pangunahing teksto ang mas pinagtatalunang pagbasa na 'handog na pagkain.'
- source_word: רֵיחַ נִיחֹחַ
  choice: kalugod-lugod ang samyo
  rationale: Ipinahahayag ang nakaugaliang idyomang pangsakripisyo bilang handog na nakalulugod o katanggap-tanggap sa Diyos, habang pinananatili ang imahen ng samyo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ng 'Yahweh' ang pangalang tipan na יהוה.
theological_decisions:
- issue: Gramatikal na panlalaking anyo ng הָאֶזְרָח
  choice: katutubong Israelita
  alternative: katutubong lalaki
  rationale: Panlalaking isahan ang anyong Hebreo ngunit kinatawan ang puwersa nito sa batas; hindi nililimitahan ng talata ang utos sa mga lalaki. Nililinaw rin ng 'Israelita' ang kaibahan sa dayuhang naninirahan sa konteksto.
- issue: Kahulugan ng אִשֵּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Tunay na may leksikal na pagtatalo sa teknikal na termino. Ang pangunahing salin ay pinananatili ang malinaw na kaugnayan nito sa apoy, at inilalagay sa talababa ang alternatibong 'handog na pagkain.'
- issue: Pangalan ng Diyos יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'bawat katutubong Israelita' upang natural na maipahayag ang distributibo at kinatawang diwa ng Hebreo. Pinanatili ang bahagyang maluwag na reperensiya ng 'mga ito' sa naunang mga tagubiling panghandog.
