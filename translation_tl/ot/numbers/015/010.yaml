  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: tl
  text: At maghahandog ka ng alak bilang handog na inumin, kalahating hin—isang handog na inihain sa pamamagitan ng apoy, isang mabangong samyo na kalugod-lugod kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog sa pamamagitan ng apoy” o “handog na apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: At ... ng alak
  rationale: Ang יַיִן ay karaniwang nangangahulugang “alak.” Isinama ang pang-ugnay na וְ bilang “At,” habang inayos ang ayos ng pangungusap upang maging likas sa Tagalog.
- source_word: תַּקְרִיב
  choice: maghahandog ka
  rationale: Ang Hiphil ng קרב ay tumutukoy sa paglalapit o paghahandog ng isang handog. Likas at malinaw sa kontekstong pansakripisyo ang “maghahandog ka.”
- source_word: לַ/נֶּסֶךְ
  choice: bilang handog na inumin
  rationale: Ang נֶסֶךְ ay likidong ibinubuhos bilang handog. Mas madaling maunawaan ng karaniwang mambabasa ang “handog na inumin” kaysa sa teknikal na “libasyon.”
- source_word: חֲצִי הַ/הִין
  choice: kalahating hin
  rationale: Pinanatili ang sinaunang yunit na “hin” sa halip na magbigay ng di-tiyak na makabagong katumbas.
- source_word: אִשֵּׁה
  choice: isang handog na pinaraan sa apoy
  rationale: Inilalarawan nito ang handog na inihahain sa pamamagitan ng apoy. Pinananatili ng salin ang kaugnayan nito sa apoy nang hindi ipinapalagay na pagkain lamang ang pangunahing diwa.
- source_word: רֵיחַ נִיחֹחַ
  choice: mabangong kalugod-lugod
  rationale: Ang takdang pariralang pansakripisyo ay nagpapahayag na ang handog ay kaaya-aya at katanggap-tanggap sa Diyos; natural at marangal sa Tagalog ang “mabangong kalugod-lugod.”
- source_word: לַ/יהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na banal na pangalan na Yahweh, at ang “kay” ay likas na nagpapahayag kung kanino inihahandog at kalugod-lugod ang handog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang pinananatili ang personal na banal na pangalan at iniiwasang palitan ito ng isang titulo.
- issue: Kahulugan ng אִשֵּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain; handog na sinusunog
  rationale: Pinananatili ang malinaw na kaugnayan ng terminong Hebreo sa apoy, ngunit hindi sinasabing kinakailangang lubusang sinusunog ang handog. Ang “handog na pagkain” ay posibleng kontekstuwal na pagbasa ngunit hindi tahasang nakikita sa anyo ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang karaniwang bokabularyong pansamba at pinanatili ang sinaunang sukat na “hin.”
