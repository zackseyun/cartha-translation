id: NUM.15.3
reference: Numbers 15:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: tl
  text: at maghahandog kayo kay Yahweh ng handog na inihahandog sa pamamagitan ng apoy[a]—maging handog na sinusunog nang buo o hain—upang tuparin ang isang panata, bilang kusang-loob na handog, o sa mga itinakda ninyong panahon[b], upang maging kalugod-lugod na samyo kay Yahweh, mula sa mga baka o mula sa kawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na apoy.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa mga itinakda ninyong kapistahan.” Ang salitang Hebreo ay maaaring tumukoy sa mga takdang panahon sa pangkalahatan o, nang mas tiyak, sa mga kapistahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: maghahandog kayo
  rationale: Bagaman literal na “gagawa kayo,” ang pandiwa kasama ng terminong pansakripisyo na אִשֶּׁה ay likas na nangangahulugang paghahandog.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Ipinapahayag ang teknikal na katawagang pansakripisyo para sa handog na inihaharap sa pamamagitan ng apoy, nang hindi ipinapalagay na ang buong handog ay laging sinusunog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang יהוה at ginagamit ang likas na panandang Tagalog para sa pinag-uukulan ng handog.
- source_word: עֹלָה
  choice: handog na sinusunog nang buo
  rationale: Malinaw na ipinahihiwatig ang handog na lubos na sinusunog, sa halip na ang mas malabong “sinunog na handog.”
- source_word: זֶבַח
  choice: iba pang hain
  rationale: Ang זֶבַח ay pangkalahatang hain na kinasasangkutan ng pagkatay; nililinaw ng “iba pang” ang pagkakaiba nito sa naunang handog na sinusunog nang buo nang hindi nagdaragdag ng tiyak na uri.
- source_word: לְפַלֵּא נֶדֶר
  choice: upang tuparin ang isang panata
  rationale: Tumutukoy sa pagsasagawa o pagtupad sa ipinangakong handog.
- source_word: בִנְדָבָה
  choice: bilang kusang-loob na handog
  rationale: Pinananatili ang teknikal na diwa ng handog na hindi bunga ng panata o sapilitang tungkulin.
- source_word: בְּמֹעֲדֵיכֶם
  choice: sa mga itinakda ninyong panahon
  rationale: Pinananatili ang malawak na saklaw ng מוֹעֵד, na maaaring tumukoy sa mga takdang panahon o, sa kontekstong panrelihiyon, sa mga takdang kapistahan.
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: upang maging kalugod-lugod na samyo
  rationale: Likas at marangal na Tagalog na nagpapanatili sa metaporang pansakripisyo nang hindi ito binibigyan ng mekanistikong paliwanag.
- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: mula man ito sa bakahan o sa kawan
  rationale: Pinananatili ang kolektibong pagtukoy sa malalaking hayop at sa maliliit na alagang hayop, lalo na sa mga tupa at kambing.
theological_decisions:
- issue: Paglalarawan sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalan sa halip na palitan ito ng titulo.
- issue: Antropomorpikong idyomang רֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  alternative: nakapapawing samyo; mabangong samyo
  rationale: Pinananatili nito ang metaporang ang handog ay kalugod-lugod kay Yahweh, ngunit hindi ipinahihiwatig na ang Diyos ay literal na nangangailangan ng amoy o na awtomatikong napapawi ang galit niya.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang sugnay na Hebreo upang maging malinaw ang ugnayan ng pinagmumulan ng hayop at ng layunin ng paghahandog. Ginamit ang “bakahan” at “kawan” bilang kolektibong katawagan; kabilang sa “kawan” ang mga tupa at kambing.
