  choice: Sinabi
  rationale: Likas at tuwirang salin ng karaniwang pormulang Hebreo sa pagsasalaysay; ipinahihiwatig na rin ng pandiwa ang pagpapakilala sa kasunod na pahayag.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Sinusunod ang nakatalagang tradisyon sa tekstong konsultasyon na kumakatawan sa banal na pangalang YHWH sa pamamagitan ng PANGINOON.
- source_word: אֶל־מֹשֶׁה
