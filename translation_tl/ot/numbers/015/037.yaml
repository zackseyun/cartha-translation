  rationale: Natural na modernong Tagalog para sa pinatutungkulan ng pagsasalita.
- source_word: לֵאמֹר
  choice: '[hindi hiwalay na isinalin]'
  rationale: Sa Hebreo, pormulang naghahatid ito ng tuwirang pananalita. Ang literal na “na sinasabi” ay paulit-ulit at hindi natural sa Tagalog; sapat na ang kuwit upang ipakilala ang kasunod na sinabi.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
