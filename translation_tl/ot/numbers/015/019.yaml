  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: tl
  text: At kapag kumain kayo ng tinapay mula sa lupain, maghahandog kayo ng isang kaloob[a] kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal, “mag-aangat kayo ng isang kaloob kay Yahweh.” Wika ito ng paghahandog: ang kaloob ay ibinubukod at inihaharap sa kanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: At kapag kumain kayo
  rationale: 'Ang וְהָיָה kasama ng temporal na infinitive construct na בַּאֲכָלְכֶם ay likas na nagpapakilala ng pangyayari sa hinaharap: “at kapag kumain kayo,” sa halip na literal ngunit mabigat na “at mangyayari sa pagkain ninyo.”'
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: mula sa tinapay ng lupain
  rationale: Pinananatili ng “mula sa” ang source/partitive na diwa ng מִן, at ng “tinapay ng lupain” ang konkretong larawan ng pagkaing mula sa lupaing papasukan nila.
- source_word: תָּרִימוּ תְרוּמָה
  choice: maghahandog kayo ng isang kaloob
  rationale: Sa kontekstong pangkulto, ang Hiphil ng רום kasama ng תְרוּמָה ay isang pormulang tumutukoy sa pagbubukod at paghaharap ng kaloob. Natural sa modernong Tagalog ang “maghahandog ... ng isang kaloob,” habang inilalagay sa talababa ang literal na larawan ng “pag-aangat.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay tumutukoy sa pinag-uukulan ng kaloob, at ang pangalang tipan na יהוה ay isinasalin bilang “Yahweh.”
theological_decisions:
- issue: Paglalarawan sa gawaing ipinahihiwatig ng תָּרִימוּ תְרוּמָה
  choice: maghahandog kayo ng isang kaloob
  alternative: mag-aangat kayo ng isang kaloob
  rationale: Hindi ginagawang isang tiyak na denominasyonal na uri ng handog ang parirala. Ang pangunahing teksto ay natural, samantalang pinananatili ng talababa ang konkretong wikang pangkulto at ang posibleng mas literal na pagbasa.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tinapay” upang mapanatili ang konkretong salita ng Hebreo, bagaman maaari rin itong tumukoy nang mas malawak sa pagkaing mula sa ani. Inilagay ang marker [a] pagkatapos ng buong pahayag na nililinaw nito.
