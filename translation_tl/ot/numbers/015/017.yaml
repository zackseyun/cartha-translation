  text: 'At nagsalita si Yahweh[a] kay Moises at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon ay isinasaling “ang PANGINOON.”'
