lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagpapasimula ng panibagong pangyayari ng pagsasalita; natural at marangal sa Filipino ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa taong kinakausap, at ang “kay Moises” ang likas na katumbas nito sa modernong Filipino.
- source_word: לֵאמֹר
  choice: na sinabi
  rationale: Karaniwang pormula ito na nagpapakilala sa nilalaman ng kasunod na pahayag; pinananatili ng “na sinabi” ang ugnayan sa pormulang Hebreo nang hindi nagiging lipas ang wika.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi bilang pamalit na titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormula ng banal na pagsasalita at inilagay ang talababa matapos ang “Moises” upang tumugma sa ibinigay na marker, bagaman tumutukoy ang tala sa pangalang “Yahweh.”
