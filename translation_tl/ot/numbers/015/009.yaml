  text: וְ/הִקְרִ֤יב עַל בֶּן הַ/בָּקָר֙ מִנְחָ֔ה סֹ֖לֶת שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֑ים בָּל֥וּל בַּ/שֶּׁ֖מֶן חֲצִ֥י הַ/הִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/009.yaml
  text: then he shall present with the bull a grain offering of fine flour[a], three-tenths of an ephah, mixed with half a hin of oil.
translation:
  language: tl
  text: at ihahandog niya kasama ng toro ang handog na butil na pinong harina—tatlong ikasampu ng isang efa[a]—na hinaluan ng kalahating hin ng langis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “tatlong ikasampu”; sa kontekstong ito ng paghahandog, nauunawaan itong tatlong ikasampu ng isang efa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: at ihahandog niya
  rationale: Ang Hiphil ng קרב sa konteksto ng paghahandog ay nangangahulugang ilapit o ihandog. Pinananatili ng “at” ang waw na nag-uugnay sa sunod-sunod na tagubilin.
- source_word: עַל
  choice: kasama ng
  rationale: Dito, ipinahihiwatig ng עַל na ang handog na butil ay kaakibat ng toro, hindi na inilalagay ito sa ibabaw nito.
- source_word: בֶּן הַבָּקָר
  choice: ang toro
  rationale: Ang literal na idyomang “anak ng bakahan” ay tumutukoy sa isang hayop na baka para sa paghahandog; malinaw at likas sa Filipino ang “toro” sa kontekstong ito.
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa batas tungkol sa mga handog, tumutukoy ang מִנְחָה sa handog na mula sa butil, hindi lamang sa isang pangkalahatang regalo o handog.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Tumpak at karaniwang salin ito para sa pinong harinang ginagamit sa mga handog.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tatlong ikasampu ng isang efa
  rationale: Literal itong “tatlong ikasampu,” ngunit sa mga sukat ng handog ay nauunawaang tatlong ikasampu ng isang efa. Isinama ang yunit sa teksto upang maging malinaw.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: hinaluan ng ... langis
  rationale: Inilalarawan nito ang harinang inihalo sa langis; natural sa modernong Filipino ang “hinaluan ng langis.”
- source_word: חֲצִי הַהִין
  choice: kalahating hin
  rationale: Pinananatili ang sinaunang yunit ng likidong panukat sa transliterasyon upang hindi magbigay ng tiyak ngunit mapagtatalunang modernong katumbas.
