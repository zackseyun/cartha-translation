  source_fidelity: 'Tumpak na naipapahayag ang pagkakasunod ng tagubilin at ang mahahalagang elemento ng Hebreo: ang paghahandog na kaakibat ng toro, handog na butil na pinong harina, tatlong ikasampu ng efa, at langis na kalahating hin. Ang “kasama ng” para sa עַל ay angkop sa kontekstong panghandog.'
