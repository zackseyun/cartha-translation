  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: tl
  text: 'O, para sa isang lalaking tupa, maghahanda ka ng handog na butil: dalawang ikasampu[a] ng pinong harina, na hinaluan ng sangkatlo ng isang hin ng langis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “dalawang ikasampu.” Mula sa sistema ng mga panukat para sa paghahandog, nauunawaang ikasampung bahagi ito ng isang ephah; sa ibang talata, buo itong sinasabing “dalawang ikasampu ng isang ephah.”
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: O
  rationale: Payak na pang-ugnay ito sa naunang mga tuntunin at nagpapakilala ng isa pang maaaring handog.
- source_word: לָ/אַ֨יִל֙
  choice: para sa isang lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa; ang ל ay nagsasaad dito ng kaugnayan o layon. Ang “isang” ay likas sa Filipino para sa di-tiyak na halimbawa.
- source_word: תַּעֲשֶׂ֣ה
  choice: maghahanda ka
  rationale: Bagaman malawak ang kahulugan ng עשה na “gawin,” ang “maghanda” ang likas na pandiwa sa konteksto ng paghahanda ng handog.
- source_word: מִנְחָ֔ה
  choice: handog na butil
  rationale: Sa kontekstong pangsakripisyo, tumutukoy ito sa handog na mula sa butil, hindi lamang sa pangkalahatang handog o kaloob.
- source_word: סֹ֖לֶת
  choice: pinong harina
  rationale: Ito ang karaniwang kahulugan ng סֹלֶת bilang mataas na uri o pinong harina na ginagamit sa handog.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: dalawang ikasampung takal
  rationale: Literal itong “dalawang ikasampu.” Idinagdag ang “takal” upang maging malinaw na sukat ang tinutukoy, ngunit hindi isinisingit sa pangunahing teksto ang yunit na ephah na hindi tahasang nakasulat sa talata.
- source_word: בְּלוּלָ֥ה
  choice: hinaluan
  rationale: Pasibong anyo ito na naglalarawan sa harina bilang inihalo sa langis; natural at malinaw sa modernong Filipino ang “hinaluan.”
- source_word: בַ/שֶּׁ֖מֶן
  choice: ng langis
  rationale: Kasunod ng “hinaluan,” likas sa Filipino ang “ng langis” upang ipahayag ang sangkap na inihalo.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: sangkatlong hin
  rationale: Pinananatili ang sinaunang yunit na hin at isinasalin nang maikli at natural ang bahaging isang-katlo.
