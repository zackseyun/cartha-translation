  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: tl
  text: Mula sa unang bahagi ng inyong masa[a], magbibigay kayo kay Yahweh ng isang handog[b] sa bawat salinlahi ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga sisidlan ng pagmamasa ninyo”; ang salitang Hebreo ay maaaring tumukoy sa masa o, kaugnay nito, sa sisidlan ng pagmamasa.
    reason: lexical_alternative
  - marker: b
    text: O, “ambag na ibinukod”; ayon sa tradisyon, “handog na itinaas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: Mula sa unang bahagi ng
  rationale: Ipinahihiwatig ng רֵאשִׁית dito ang unang bahaging kinukuha mula sa kabuuan, hindi lamang ang pasimula sa panahon. Nililinaw ng “unang bahagi” ang partitive na diwa sa kontekstong rituwal.
- source_word: עֲרִסֹתֵיכֶם
  choice: inyong masa
  rationale: Maaaring tumukoy ang עֲרִסָה sa minasa o masa, at sa pamamagitan ng metonimiya ay sa sisidlang pinagmamasahan. Ang “masa” ang pinakamalinaw na tumutukoy sa sangkap na pinaghahanguan ng handog.
- source_word: תִּתְּנוּ
  choice: magbibigay kayo
  rationale: Karaniwang kahulugan ng נתן ang “magbigay.” Pinananatili nito ang tuwiran at nag-uutos na himig ng Hebreo nang hindi dinaragdagan ang teknikal na kahulugang rituwal.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang tipanang pangalan na יהוה bilang “Yahweh.” Ginamit ang “kay” dahil personal na pangalan ang kasunod at si Yahweh ang tumatanggap.
- source_word: תְּרוּמָה
  choice: isang handog
  rationale: Ang תְּרוּמָה ay bahaging ibinukod o itinaas bilang kaloob. Ang “handog” ay likas at malinaw sa modernong Filipino; inilalagay sa talababa ang mas literal at tradisyonal na mga alternatibo.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng salinlahi ninyo
  rationale: Ipinahihiwatig ng pormula ang patuloy na bisa ng utos sa magkakasunod na salinlahi. Likas sa Filipino ang “sa lahat ng salinlahi ninyo” at pinananatili nito ang saklaw ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Personal na tipanang pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng תְּרוּמָה
  choice: handog
  alternative: ambag; handog na itinaas
  rationale: Hindi nililimitahan ng salin ang salita sa isang denominasyonal na teknikal na kategorya. Ang talababa ay nagpapanatili sa diwa ng bahaging ibinukod o itinaas.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang tuwirang utos na “magbibigay kayo,” ang personal na pangalang “Yahweh,” at ang tunay na leksikal na kalabuan ng עֲרִסָה at תְּרוּמָה sa pamamagitan ng mga talababa.
