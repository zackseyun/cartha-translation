  text: וְ/הָיָ֣ה לָ/כֶם֮ לְ/צִיצִת֒ וּ/רְאִיתֶ֣ם אֹת֗/וֹ וּ/זְכַרְתֶּם֙ אֶת כָּל מִצְוֺ֣ת יְהוָ֔ה וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹֽא תָתֻ֜רוּ אַחֲרֵ֤י לְבַבְ/כֶם֙ וְ/אַחֲרֵ֣י עֵֽינֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם זֹנִ֖ים אַחֲרֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: tl
  text: At magiging borlas ito para sa inyo[a]. Kapag nakita ninyo ito, aalalahanin ninyo ang lahat ng utos ni Yahweh at tutuparin ninyo ang mga iyon. At huwag ninyong habulin ang sarili ninyong puso at mga mata[b], na inyong hinahabol sa pakikiapid[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palawit.” Ang salitang Hebreo ay tumutukoy sa tila-borlas na palawit na ikinakabit sa sulok ng kasuotan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “huwag ninyong sundin ang sarili ninyong puso at mga mata.” Ang pandiwang Hebreo ay may diwa ng paghahanap, paggala, o masidhing paghahabol sa mga iyon.
    reason: lexical_alternative
  - marker: c
    text: Mas literal, “na inyong pinakikiapiran.” Gumagamit ang Hebreo ng larawan ng seksuwal na pagtataksil bilang metapora ng kawalang-katapatan sa tipan; maaari ring isaling “na inyong sinusundan sa pakikiapid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצִת
  choice: palawit
  rationale: Sa kontekstong ito, tumutukoy ito sa tila-borlas na palawit sa mga sulok ng kasuotan. Natural at malinaw sa makabagong Filipino ang “palawit,” habang inilalahad sa talababa ang alternatibong “palawit na borlas.”
- source_word: וְהָיָה לָכֶם לְצִיצִת
  choice: At magiging palawit iyon para sa inyo
  rationale: Pinananatili ang payak na panaguring Hebreo at ang isahang bagay na tinutukoy mula sa naunang talata.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: Kapag nakita ninyo iyon
  rationale: 'Ang magkakasunod na kilos ay natural na naipahahayag sa Filipino bilang panahong sugnay: ang pagkakita ang mag-uudyok sa pag-alaala.'
- source_word: מִצְוֺת
  choice: mga utos
  rationale: Karaniwan, malinaw, at sapat ang bigat na legal at tipan ng “mga utos” sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang pangalang tipan na kinakatawan ng Tetragrammaton.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: tutuparin ang mga iyon
  rationale: Sa kaugnayan ng עשה sa mga utos, likas sa Filipino ang “tuparin”; ipinahahayag nito ang aktuwal na pagsasagawa nang hindi dinaragdagan ang diwa.
- source_word: תָתֻרוּ
  choice: susundan
  rationale: Sa kontekstong moral, tumutukoy ang pandiwa sa paghahabol o pagsunod sa sariling pagnanasa. Ang “susundan” ay natural, at pinananatili sa talababa ang mas masiglang diwang “hahabulin/paghahanap-hanapin.”
- source_word: לְבַבְכֶם
  choice: sarili ninyong puso
  rationale: Pinananatili ng “puso” ang biblikal na saklaw ng panloob na hangarin at pagpapasiya; itinatampok ng “sarili ninyong” ang kaibahan sa mga utos ni Yahweh.
- source_word: עֵינֵיכֶם
  choice: mga mata
  rationale: Pinananatili ang konkretong metapora ng Hebreo. Ang kaakibat na “sarili ninyong” ay likas na sumasaklaw sa magkatambal na “puso at mga mata.”
- source_word: זֹנִים
  choice: pinagnanasaan ninyo nang may pagtataksil
  rationale: Pinananatili ang tahasang diwa ng pagtataksil na seksuwal/tipan, ngunit inihahabi ito sa natural na Filipino. Nililinaw ng talababa ang literal at mas matinding metapora.
- source_word: אֲשֶׁר אַתֶּם זֹנִים אַחֲרֵיהֶם
  choice: na pinagnanasaan ninyo nang may pagtataksil
  rationale: Ikinakabit ang panghalip na maramihan sa “puso at mga mata” habang pinananatili ang larawan ng di-tapat na paghahabol. Hindi ito pinalalambot tungo lamang sa “naliligaw.”
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Lakas ng metapora ng זנה sa konteksto ng katapatan sa tipan
  choice: panatilihin ang larawan ng pagtataksil sa “pinagnanasaan ninyo nang may pagtataksil,” na may literal na paliwanag sa talababa
  alternative: naliligaw kayo / nagiging di-tapat kayo
  rationale: Ang זנה ay hindi lamang karaniwang pagkaligaw kundi gumagamit ng larawan ng pakikiapid o prostitusyon para sa pagtataksil sa tipan. Pinananatili ng salin at talababa ang bigat nito nang hindi nag-aangkat ng karagdagang doktrina.
translation_notes:
  register: Makabago, dignified, at madaling maunawaan na Filipino. Gumamit ng “ninyo” para sa maramihang kausap, maiikling sugnay para sa likas na daloy, at talababa upang mapanatili ang leksikal na lawak at matinding metapora ng Hebreo.
