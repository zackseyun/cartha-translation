  naturalness: Natural at marangal sa makabagong Filipino ang “borlas,” “Kapag nakita ninyo ito,” at “huwag ninyong habulin.” Ang “na inyong hinahabol sa pakikiapid” ay sadyang matindi ngunit malinaw at pinananatili ang metaporang Hebreo nang hindi nagdaragdag ng doktrina.
  terminology: “Borlas” ang mas tiyak na pangunahing salin ng ציצית; maaaring ilahad ang “palawit” bilang alternatibo sa talababa. Pinananatili ang “Yahweh,” “mga utos,” at “tuparin.”
