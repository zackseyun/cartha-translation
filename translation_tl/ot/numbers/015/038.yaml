translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang teknikal na bokabularyo, ngunit pinanatili ang katawagang ‘mga anak ni Israel’ upang maging hayag ang anyong pampag-anak ng orihinal. Inilagay ang mga pananda ng talababa kaagad sa mga salitang tinutukoy ng mga ito.
