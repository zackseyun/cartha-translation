base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: tl
  text: Kausapin mo ang mga anak ni Israel at sabihin mo sa kanila na gumawa sila ng mga palawit[a] para sa kanilang sarili sa mga sulok ng kanilang mga kasuotan, sa lahat ng kanilang salinlahi, at maglagay sila ng taling bughaw[b] sa palawit ng bawat sulok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga hibla sa gilid” (Hebreo: צִיצִת).'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na תְּכֵלֶת ay tumutukoy sa isang bughaw o bughaw-lilang tina o kulay na ginagamit sa mga sagradong kagamitan ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם
  choice: Sabihin mo sa mga anak ni Israel
  rationale: Pinagsama sa likas na Filipino ang magkatambal na utos na literal na ‘magsalita ka ... at sabihin mo sa kanila,’ nang hindi binabago ang nilalaman ng utos. Pinanatili ng ‘mga anak ni Israel’ ang katawagang pampag-anak ng Hebreo.
- source_word: וְעָשׂוּ לָהֶם
  choice: na gumawa sila para sa kanilang sarili
  rationale: Malinaw na ipinapahayag ang utos at pinananatili ang לָהֶם, na nagsasaad na para sa kanila mismo ang gagawing mga palawit.
- source_word: צִיצִת
  choice: mga palawit
  rationale: Ang ‘palawit’ ay natural at madaling maunawaang tawag sa nakabiting kumpol o ayos ng mga sinulid sa kasuotan; inilagay sa talababa ang alternatibong ‘palawit na mga hibla.’
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: sa mga sulok ng kanilang mga kasuotan
  rationale: Bagaman literal na ‘mga pakpak,’ ang כָּנָף ay tumutukoy rito sa mga dulo o sulok ng kasuotan. Ang ‘sulok’ ang pinakatiyak sa kontekstong ito.
- source_word: לְדֹרֹתָם
  choice: sa bawat salinlahi nila
  rationale: Natural sa Filipino at ipinahahayag ang patuloy na bisa ng utos sa magkakasunod na salinlahi.
- source_word: עַל צִיצִת הַכָּנָף
  choice: sa palawit ng bawat sulok
  rationale: Ang isahang anyo sa Hebreo ay distributibo sa konteksto; ipinakikita ng ‘bawat sulok’ na ang bawat sulok ng kasuotan ay may palawit.
- source_word: פְּתִיל
  choice: tali
  rationale: Tumutukoy ang salita sa isang pinilipit na hibla o kordong ikinakabit; ang ‘tali’ ay maikli, natural, at sapat na kongkreto sa Filipino.
- source_word: תְּכֵלֶת
  choice: bughaw
  rationale: Ang ‘bughaw’ ay malinaw at marangal na katawagan sa kulay, samantalang pinananatili sa talababa ang posibleng bughaw-lilang saklaw ng sinaunang tina.
