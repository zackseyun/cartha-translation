base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: At nagsalita si Yahweh kay Moises[a] at sinabi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; kinaugaliang isalin na “ang PANGINOON.”'
    reason: Ipinababatid ang anyong Hebreo at ang tradisyonal na alternatibong salin ng banal na pangalan.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagsusulong ng salaysay. Pinananatili ng “nagsalita” ang pormularyong pananalita ng banal na pahayag at naiiwasan ang pag-uulit ng “sinabi ... na sinasabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalang YHWH sa tekstong Hebreo, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Ang “kay” ang likas na panandang Filipino para sa taong pinatutungkulan ng pagsasalita.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang kinagawiang anyo ng pangalang משה sa modernong Filipino at madaling makilala ng mga mambabasa.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormularyong infinitive ng Hebreo na naghuhudyat na susunod ang nilalaman ng pahayag, bagaman mas pormal ito kaysa karaniwang usapan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon nang hindi ito pinapalitan ng isang titulo o ng ibang tradisyonal na anyo.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig. Pinanatili ang pormularyong estruktura ng Hebreo dahil panimulang sugnay ito sa direktang pahayag sa kasunod na talata.
