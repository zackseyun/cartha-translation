base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: tl
  text: Mula sa unang bahagi ng inyong masa, magbukod kayo ng isang tinapay bilang handog[a]. Kung paanong ibinubukod ang handog mula sa giikan[b], gayon din ninyo ito ibukod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa unang bahagi ng inyong minamasang masa.” Ang salitang Hebreo ay maaaring tumukoy sa masa mismo o, sa pamamagitan ng metonimiya, sa masahan o lalagyan ng minamasang masa.
    reason: lexical_alternative
  - marker: b
    text: Ayon sa tradisyon, “handog na itinataas.” Ang salitang Hebreo ay tumutukoy sa ambag na ibinukod at iniharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: mula sa unang bahagi
  rationale: Ipinahahayag ang pasimulang bahagi o unang porisyong kinukuha mula sa kabuuan, nang hindi ipinapalagay na ani mismo ang tinutukoy.
- source_word: עֲרִסֹתֵיכֶם
  choice: inyong masa
  rationale: Sa konteksto, tumutukoy ito sa minasa o masa ng tinapay, bagaman maaari ring tumukoy ang Hebreo sa lalagyan o masahan sa pamamagitan ng metonimiya.
- source_word: חַלָּה
  choice: isang tinapay
  rationale: Tumutukoy sa isang binuo o inihandang piraso ng tinapay; natural ito sa modernong Filipino at hindi nagpapahiwatig ng matamis na keyk.
- source_word: תָּרִימוּ
  choice: magbukod / ibukod
  rationale: Sa konteksto ng handog, ang literal na 'itaas' ay nagsasaad ng pag-aalis at paghahain ng isang bahaging inilaan; mas malinaw sa Filipino ang 'ibukod' habang pinananatili ang kaugnayan sa handog na inilalaan.
- source_word: תְרוּמָה
  choice: handog
  rationale: Tumutukoy sa ambag o bahaging ibinukod at iniharap para sa Diyos o gamit ng mga pari. Ang 'handog' ay natural at malinaw sa Filipino.
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: kung paanong ibinubukod ang handog mula sa giikan
  rationale: Pinananatili ang paghahambing sa handog na kinukuha mula sa ani sa giikan at nililinaw ang ugnayan ng pinagmulan.
- source_word: גֹּרֶן
  choice: giikan
  rationale: Karaniwang salitang Filipino para sa lugar kung saan ginigiik o pinoproseso ang butil.
- source_word: כֵּן
  choice: gayon din
  rationale: Likas na panandang Filipino para sa resulta ng paghahambing.
- source_word: אֹתָהּ
  choice: ito
  rationale: Tumutukoy pabalik sa tinapay o handog; sadyang pinananatili ang bahagyang kalabuan ng panghalip sa Hebreo.
