reference: Numbers 15:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: tl
  text: At ang pari ay gagawa ng pagtubos para sa buong kapulungan ng mga Israelita, at patatawarin sila, sapagkat iyon ay pagkakamaling hindi sinasadya at dinala nila ang kanilang handog, isang handog na inihahandog sa pamamagitan ng apoy para kay Yahweh[a], at ang kanilang handog para sa kasalanan[b] sa harap ni Yahweh, dahil sa kanilang pagkakamaling hindi sinasadya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog na sinusunog para kay Yahweh” o “handog sa pamamagitan ng apoy.” Ang salitang Hebreo ay tumutukoy sa handog na iniaalay sa pamamagitan ng apoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “handog para sa paglilinis.” Sa kontekstong panghandog, ang salitang Hebreo ay maaaring tumukoy sa handog na humaharap sa kasalanan o nagdudulot ng ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: gagawa ng pagtubos
  rationale: 'Ipinapanatili nito ang teknikal na diwa ng Piel ng כפר sa kontekstong panghandog: pagsasagawa ng ritwal na pagtubos para sa kapulungan.'
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: para sa buong kapulungan ng mga Israelita
  rationale: Ang עַל kasunod ng כפר ay nangangahulugang para sa o alang-alang sa; ang 'kapulungan ng mga Israelita' ay likas na makabagong Tagalog para sa kolektibong parirala.
- source_word: וְנִסְלַח לָהֶם
  choice: at patatawarin sila
  rationale: Natural na inilalahad sa Tagalog ang Niphal na pasibo habang hindi nagdaragdag ng tahasang tagaganap na wala sa Hebreo.
- source_word: כִּי שְׁגָגָה הִוא
  choice: sapagkat iyon ay pagkakamaling hindi sinasadya
  rationale: Sinasaklaw ng שְׁגָגָה ang pagkakamali o kasalanang nagawa nang di-sinasadya; hindi nito ipinapalagay na walang moral na bigat ang pangyayari.
- source_word: אֶת קָרְבָּנָם
  choice: ang kanilang handog
  rationale: Ang 'handog' ang malinaw at malawak na katumbas ng קָרְבָּן bilang bagay na inihaharap sa Diyos.
- source_word: אִשֶּׁה לַיהוָה
  choice: isang handog na pinaraan sa apoy para kay Yahweh
  rationale: Ipinakikita ang malinaw na kaugnayan ng אִשֶּׁה sa apoy nang hindi ginagamit ang posibleng nakalilitong literal na 'pagkaing handog.'
- source_word: וְחַטָּאתָם
  choice: at ang kanilang handog para sa kasalanan
  rationale: Dahil ito ay isang bagay na dinala sa harap ni Yahweh, ang salita ay tumutukoy rito sa handog, hindi lamang sa abstraktong kasalanan.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas na Tagalog para sa idyomang tumutukoy sa paghaharap sa presensiya ng Diyos.
- source_word: עַל שִׁגְגָתָם
  choice: dahil sa kanilang pagkakamaling hindi sinasadya
  rationale: Pinananatili ang pag-uulit ng ugat na שׁגג at ang dahilan kung bakit inihandog ang hain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng titulong 'Panginoon.'
theological_decisions:
- issue: Kahulugan ng כפר sa ritwal na konteksto
  choice: pagtubos
  alternative: pagbabayad-sala
  rationale: Ang 'pagtubos' ay dignified at nauunawaan bilang gawaing ritwal para sa kapulungan; iniiwasan ng teksto na tukuyin nang labis ang eksaktong mekanismo ng bisa nito.
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili bilang pangalan.
- issue: Sakripisyal na kahulugan ng חַטָּאת
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Hinihingi ng sintaks ang isang handog na dinala; parehong may batayang leksikal ang pagharap sa kasalanan at paglilinis, kaya inilalagay sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kapulungan' upang mapanatili ang kolektibo at pormal na katangian ng batas, ngunit 'mga Israelita' sa halip na literal na 'mga anak na lalaki ni Israel' para sa natural at tumpak na pagtukoy sa buong pamayanan. Ang mga gitling-pahaba ay nagpapalinaw na ang handog na pinaraan sa apoy ay paglalarawan sa kanilang handog.
