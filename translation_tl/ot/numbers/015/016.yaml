source:
  edition: WLC
  text: תּוֹרָ֥ה אַחַ֛ת וּ/מִשְׁפָּ֥ט אֶחָ֖ד יִהְיֶ֣ה לָ/כֶ֑ם וְ/לַ/גֵּ֖ר הַ/גָּ֥ר אִתְּ/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: tl
  text: Iisang kautusan at iisang tuntunin ang iiral para sa inyo at sa dayuhang naninirahang kasama ninyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dayuhang nakikipamayan.” Ang Hebreong גֵּר ay tumutukoy sa isang hindi katutubong naninirahan sa Israel sa ilalim ng kaayusan ng pamayanan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: kautusan
  rationale: Sa kontekstong legal, tumutukoy ito sa isang may-bisang tagubilin. Likas at malinaw sa modernong Filipino ang “kautusan,” at naihihiwalay ito sa kasunod na מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: tuntunin
  rationale: Dito ay tumutukoy ito sa itinakdang pamantayan o alituntuning legal. Ang “tuntunin” ay mas madaling maunawaan kaysa “ordinansa” at hindi nagpapahiwatig lamang ng hatol ng hukuman.
- source_word: אַחַת / אֶחָד
  choice: iisang … at iisang
  rationale: Pinananatili ng pag-uulit ang diin ng Hebreo sa pagiging isa at magkakapareho ng pamantayang umiiral sa dalawang pangkat.
- source_word: יִהְיֶה
  choice: ang iiral
  rationale: Ang anyong ito ay may puwersang normatibo sa kontekstong legal. Ipinahahayag ng “iiral” na ang nasabing kautusan at tuntunin ang dapat masunod, hindi lamang na mangyayari ito sa hinaharap.
- source_word: גֵּר
  choice: dayuhan
  rationale: Tumutukoy ito sa isang hindi katutubong naninirahan sa loob ng pamayanan ng Israel. Natural sa pangunahing teksto ang “dayuhan,” habang nililinaw sa talababa ang natatanging katayuan nito.
- source_word: הַגָּר
  choice: naninirahan
  rationale: Isinasalin nito ang kasunod na pandiwaring naglalarawan sa גֵּר bilang isang dayuhang aktuwal na nananahan sa pamayanan. Iniiwasan nito ang di-likas na pag-uulit na “dayuhang nakikipamayan.”
- source_word: אִתְּכֶם
  choice: kasama ninyo
  rationale: Malapit ito sa literal na “with you” at natural sa Filipino, habang ipinahihiwatig pa rin ang paninirahan sa loob ng kanilang pamayanan.
theological_decisions:
- issue: Pagkakapantay ng katutubong Israelita at naninirahang dayuhan sa ilalim ng legal na pamantayan
  choice: Ipinahahayag ng salin na iisang legal na pamantayan ang iiral para sa Israel at sa dayuhang naninirahang kasama nila.
  alternative: Maaaring unawain na ang pagkakapantay na ito ay tuwirang nakatuon lamang sa mga alituntunin tungkol sa paghahandog sa kalapit na konteksto.
  rationale: Malawak ang mismong pananalita ng talata, ngunit bahagi ito ng isang tiyak na seksiyong legal. Pinananatili ng salin ang malawak na pahayag nang hindi ipinapasya kung hanggang saan ito mailalapat sa labas ng agarang konteksto.
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “iisang … at iisang” upang mapanatili ang pag-uulit at diin ng Hebreo; ang “iiral para sa” ay naghahatid ng legal at normatibong puwersa nang hindi nagiging lipas o labis na teknikal.
