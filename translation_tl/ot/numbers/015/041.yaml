base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: tl
  text: Ako si Yahweh, ang inyong Diyos, na naglabas sa inyo mula sa lupain ng Ehipto upang maging Diyos ninyo.[a] Ako si Yahweh, ang inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “upang maging Diyos sa inyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyong “Yahweh” upang mapanatili ang personal at tipanang pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman pangmaramihan ang anyong אֱלֹהִים, iisang Diyos ng Israel ang tinutukoy rito; ang hulaping pangmaramihang ikalawang panauhan ay angkop na isinalin bilang “inyong.”
- source_word: אֲשֶׁר
  choice: na
  rationale: Ang “na” ay natural na pang-ugnay sa Filipino para sa sugnay na naglalarawan sa personal na antecedent na si Yahweh.
- source_word: הוֹצֵאתִי
  choice: naglabas
  rationale: Ang Hiphil ng יצא ay may diwang sanhi, “ilabas”; malinaw at tuwirang ipinahahayag ng “naglabas” ang ginawa ni Yahweh.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ng “lupain ng Ehipto” ang tahasang אֶרֶץ at ang pormal na himig ng pormulang tumutukoy sa Exodo.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: upang maging Diyos ninyo
  rationale: Ipinahahayag nito ang layunin at tipanang kaugnayan sa natural na modernong Filipino, habang hindi dinaragdagan ang sinasabi ng Hebreo.
- source_word: אֲנִי
  choice: Ako si
  rationale: Sa sugnay na walang tahasang pandiwa sa Hebreo, natural sa Filipino ang “Ako si” bago ang personal na pangalang Yahweh at pinananatili nito ang diin ng dalawang paglitaw.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pormulang tipan na לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: upang maging Diyos ninyo
  alternative: upang maging Diyos para sa inyo; upang maging Diyos sa inyo
  rationale: Natural sa Filipino ang napiling anyo at malinaw nitong ipinahahayag ang layunin at kaugnayang tipan nang hindi nilulutas nang lampas sa teksto ang saklaw ng parirala.
translation_notes:
  register: Modernong Filipino na marangal at tuwiran. Ginamit ang “inyong/inyo” dahil buong Israel ang kinakausap, at pinanatili ang pag-uulit sa hulihan para sa diin at tipanang himig ng orihinal.
