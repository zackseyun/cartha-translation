translation:
  language: tl
  text: Ayon sa bilang ng ihahanda ninyo[a], gayon ang ihahanda ninyo para sa bawat isa ayon sa kanilang bilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ayon sa bilang ng gagawin ninyo, gayon ang gagawin ninyo para sa bawat isa ayon sa kanilang bilang.” Karaniwang nangangahulugang “gawin” o “gumawa” ang pandiwang Hebreo na עשה; ginamit dito ang “ihahanda” upang luminaw ang konteksto ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמִּסְפָּר
  choice: Ayon sa bilang
  rationale: Ang prefiks na כ־ ay nagpapahayag ng pagsunod o pag-aayon, at ang מִסְפָּר ay nangangahulugang “bilang.” Pinananatili ng parirala ang pormal na ugnayan sa pangalawang pagbanggit sa bilang.
- source_word: אֲשֶׁר תַּעֲשׂוּ
  choice: ng ihahanda ninyo
  rationale: Malawak ang kahulugan ng עשה—“gawin” o “likhain”—ngunit sa konteksto ng paghahandog, malinaw at likas sa Tagalog ang “ihahanda.” Itinatala sa talababa ang mas literal na alternatibo.
- source_word: כָּכָה
  choice: gayon din
  rationale: Ipinapakita nito ang pagtutugma ng paraan o sukat sa naunang pariralang “ayon sa bilang,” habang nananatiling natural sa makabagong Tagalog.
- source_word: תַּעֲשׂוּ
  choice: ihahanda ninyo
  rationale: Ang pangalawang pandiwa ay tagubilin at inuulit ang kilos sa unang sugnay; pinananatili ang pare-parehong salin sa konteksto ng mga handog.
- source_word: לָאֶחָד
  choice: para sa bawat isa
  rationale: Bagaman literal na “para sa isa,” distributibo ang gamit nito rito at tumutukoy sa bawat hayop o yunit ng handog na binibilang.
- source_word: כְמִסְפָּרָם
  choice: ayon sa bilang ng mga iyon
  rationale: Pinananatili ang pangmaramihang hulaping “kanila” nang hindi tahasang dinaragdagan ang Hebreo ng isang tiyak na pangngalang gaya ng “mga hayop.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit at ugnayang “ayon sa bilang … gayon din … ayon sa bilang” mula sa Hebreo, ngunit ginamit ang “ihahanda” upang maging malinaw ang ritwal na konteksto nang hindi labis na tinutukoy ang uri ng handog.
