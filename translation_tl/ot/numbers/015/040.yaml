  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: tl
  text: upang maalala ninyo at gawin ang lahat ng aking mga utos, at maging banal kayo sa inyong Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o nilalayong bunga.
- source_word: תִּזְכְּרוּ
  choice: inyong maalaala
  rationale: Pinananatili ang diwang modal ng imperpektibo sa sugnay na nagsasaad ng layunin at ang pangmaramihang kausap.
- source_word: וַעֲשִׂיתֶם
  choice: at gawin
  rationale: Tuwirang tumutukoy sa pagsasagawa ng mga utos; hindi ipinapalit ang kahulugang mas malapit sa 'ingatan.'
- source_word: אֶת כָּל מִצְוֺתָי
  choice: ang lahat ng aking mga utos
  rationale: Pinananatili ang כָּל at ang unang panauhang hulapi; natural at malinaw sa makabagong Filipino.
- source_word: וִהְיִיתֶם
  choice: at maging ... kayo
  rationale: Ipinahahayag ang kalagayang bunga nang hindi ipinipilit ang kahulugang proseso na 'magpakabanal' o 'maging ganap.'
- source_word: קְדֹשִׁים
  choice: banal
  rationale: Pinananatili ang malawak na saklaw ng kabanalan—etikal, tipanan, at panritwal—sa halip na paliitin ito sa pagiging bukod lamang.
- source_word: לֵאלֹהֵיכֶם
  choice: sa inyong Diyos
  rationale: Ang 'sa' ay natural na Filipino para sa relasyong ipinahahayag ng ל, habang iniiwasang labis na tukuyin kung ito ay 'para sa' o 'nakalaan sa.'
theological_decisions:
- issue: Kahulugan ng kabanalan sa konteksto ng tipan
  choice: banal kayo sa inyong Diyos
  alternative: nakatalaga kayo sa inyong Diyos
  rationale: Ang 'banal' ay nagpapanatili sa buong teolohikal na saklaw ng קְדֹשִׁים at hindi ito nililimita sa ritwal na pagbubukod o moral na pagsunod lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'inyong/inyong/kayo' upang malinaw ang pangmaramihang kausap at mapanatili ang bahagyang pormal na himig ng tekstong tipanan.
