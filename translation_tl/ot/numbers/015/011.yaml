  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: tl
  text: Ganito ang gagawin para sa bawat toro, o para sa bawat lalaking tupa, o para sa isang hayop mula sa kawan[a], maging tupa man o kambing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na שֶׂה ay maaaring tumukoy sa isang maliit na alagang hayop mula sa kawan, hindi lamang sa kordero; nililinaw ng kasunod na parirala na maaari itong tupa o kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  choice: Ganito
  rationale: Natural at maikli itong panimula sa itinakdang paraan ng paghahandog.
- source_word: יֵעָשֶׂה
  choice: ang gagawin
  rationale: Pinananatili nito ang pasibo at mapag-utos na diwa ng Nifal imperfect nang hindi nagdaragdag ng tahasang gumagawa.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: para sa bawat toro
  rationale: Ang isahang hayop na may הָאֶחָד ay tumutukoy sa paglalapat ng tuntunin sa bawat indibiduwal na toro; mas natural sa Filipino ang 'bawat' kaysa literal na 'ang isang toro.'
- source_word: אַיִל הָאֶחָד
  choice: bawat lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa; ang 'bawat' ay nagpapahayag ng indibiduwal na paglalapat ng tuntunin.
- source_word: שֶׂה
  choice: isang hayop mula sa kawan
  rationale: Mas malawak ang שֶׂה kaysa 'kordero' at maaari itong tumukoy sa maliit na alagang hayop na tupa o kambing; pinananatili ng salin ang saklaw na nililinaw ng kasunod na parirala.
- source_word: בַכְּבָשִׂים ... בָעִזִּים
  choice: maging tupa man o kambing
  rationale: Likas na Filipino itong pagpapahayag sa dalawang uri ng hayop na saklaw ng שֶׂה, habang pinananatili ang alternatibong ugnayan.
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: o ... o ... o ... maging ... man o
  rationale: Pinananatili ang listahan ng mga alternatibong hayop, ngunit ginawang natural sa Filipino ang huling pares.
