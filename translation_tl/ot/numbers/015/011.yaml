translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa tekstong legal. Ginamit ang 'lalaking tupa' sa halip na mas teknikal o di-gaanong karaniwang 'barakong tupa,' at iniwasan ang 'kordero' dahil maaaring kabilang ang kambing sa saklaw ng שֶׂה.
