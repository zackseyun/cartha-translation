  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: tl
  text: At maghahandog ka ng sangkatlo ng isang hin[b] ng alak bilang handog na inumin[a], bilang isang samyong kalugod-lugod kay Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang libasyon”; tumutukoy ang salitang Hebreo sa handog na inuming ibinubuhos kasama ng hain.
    reason: lexical_alternative
  - marker: b
    text: Ang hin ay isang sinaunang yunit ng panukat para sa likido.
    reason: cultural_note
  - marker: c
    text: Maaari ring “isang samyong nagbibigay-ginhawa” o “isang mabangong samyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: At … ng alak
  rationale: Ang יַיִן ay karaniwang salitang Hebreo para sa alak. Pinananatili ng “At” ang ugnayan sa naunang tagubilin, samantalang inayos ang puwesto ng “alak” upang maging likas sa Tagalog.
- source_word: לַ/נֶּסֶךְ
  choice: bilang handog na inumin
  rationale: Ang נֶסֶךְ ay likidong ibinubuhos bilang handog na kasama ng hain. Malinaw at madaling maunawaan ang “handog na inumin,” samantalang inilalahad sa talababa ang mas teknikal na “libasyon.”
- source_word: שְׁלִשִׁית הַ/הִין
  choice: sangkatlo ng isang hin
  rationale: Tuwirang pinananatili ang dami at ang sinaunang yunit na “hin” sa halip na gumamit ng hindi tiyak na makabagong katumbas.
- source_word: תַּקְרִיב
  choice: maghahandog ka
  rationale: Sa konteksto ng paghahain, ang Hiphil ng קרב ay nangangahulugang magharap o maghandog. Ang “maghahandog ka” ay natural, malinaw, at angkop sa kultikong konteksto.
- source_word: רֵיחַ נִיחֹחַ
  choice: isang kalugod-lugod na samyo
  rationale: Pinananatili nito ang larawang pandama at ang diwa ng pagtanggap sa handog nang hindi ipinapaliwanag nang lampas sa teksto. Ang gitling ay nagpapakitang ang parirala ay paglalarawan sa inihandog.
- source_word: לַ/יהוָה
  choice: para kay Yahweh
  rationale: Ang לְ ay nagpapahiwatig na ang handog ay iniuukol kay Yahweh. Ginamit ang “Yahweh” upang katawanin nang tuwiran ang pangalang tipan na יהוה.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang pansariling pangalan nang hindi pinapalitan ng isang titulo.
- issue: Diwa ng רֵיחַ נִיחֹחַ sa pananalita tungkol sa paghahain
  choice: isang kalugod-lugod na samyo
  alternative: isang samyong nagbibigay-ginhawa; isang mabangong samyo
  rationale: Pinananatili ng salin ang tunay na larawang samyo at ang diwa ng pagiging kalugod-lugod, ngunit hindi nito nilulutas kung ang נִיחֹחַ ay pangunahing tumutukoy sa pagpapalugod, pagpapaginhawa, o mabangong katangian.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang karaniwang “alak” at “handog na inumin,” pinanatili ang sinaunang “hin” na may paliwanag, at iniwasan ang masyadong teknikal na “libasyon” sa pangunahing teksto.
