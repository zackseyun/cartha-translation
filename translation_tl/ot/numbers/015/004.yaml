base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: tl
  text: Pagkatapos, ang naghahandog ng kaniyang handog kay Yahweh ay maghahandog ng handog na butil na isang ikasampu ng isang efa ng pinong harina, na hinaluan ng sangkapat ng isang hin ng langis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang ikasampu”; sa kontekstong ito ng paghahandog, nangangahulugan itong ikasampu ng isang efa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ay maghahandog
  rationale: Ipinagpapatuloy ng waw at perfect ang takbo ng mga tuntunin mula sa naunang talata. Ang “maghahandog” ay likas sa makabagong Tagalog at angkop sa panritwal na gamit ng pandiwa.
- source_word: הַמַּקְרִיב
  choice: ang naghahandog
  rationale: 'Pinananatili nito ang participial na diwa: ang taong naghaharap ng handog.'
- source_word: קָרְבָּנוֹ
  choice: ng kaniyang handog
  rationale: Ang קָרְבָּן ay pangkalahatang tawag sa handog na inihaharap sa Diyos; malinaw at karaniwan ang “handog” sa Tagalog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginamit ang “kay” bilang likas na pananda sa tiyak na personal na pangalan, at tuwirang isinalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa batas tungkol sa paghahandog, tumutukoy ito sa handog na mula sa harina o butil, bagaman maaari itong mangahulugang handog o tributo sa ibang konteksto.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Tumutukoy ito sa de-kalidad at pinong giniling na harinang ginagamit sa paghahandog.
- source_word: עִשָּׂרוֹן
  choice: ikasampu ng isang efa
  rationale: Literal itong “isang ikasampu,” ngunit sa kontekstong panritwal ay pinaikling pagtukoy sa ikasampu ng isang efa. Nilinaw sa teksto ang yunit at itinabi sa talababa ang literal na anyo.
- source_word: בָּלוּל
  choice: hinaluan
  rationale: Ipinahihiwatig ng passive participle na ang harina ay hinaluan ng langis; natural ito sa Tagalog.
- source_word: בִּרְבִעִית הַהִין
  choice: ng sangkapat ng isang hin
  rationale: Tumpak na pinananatili ang dami at ang sinaunang yunit na “hin” nang hindi ito pinapalitan ng di-tiyak na makabagong katumbas.
- source_word: שָׁמֶן
  choice: langis
  rationale: “Langis” lamang ang sinasabi ng Hebreo. Hindi idinagdag ang “olibo,” kahit malamang na iyon ang tinutukoy sa konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalang יהוה mismo ang nasa talata. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo, nang hindi nagpapasok ng dagdag na paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit ng “handog/maghahandog” dahil mahalaga ito sa legal at panritwal na estilo ng pinagmulan. Ginamit ang sinaunang mga yunit na “efa” at “hin” upang hindi magbigay ng huwad na eksaktong modernong conversion.
