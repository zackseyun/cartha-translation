source:
  edition: WLC
  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: tl
  text: Kung nagawa iyon nang hindi sinasadya at hindi napansin ng kapulungan, maghahandog ang buong kapulungan ng isang toro mula sa kawan bilang handog na sinusunog, na may kalugod-lugod na samyo para kay Yahweh, kasama ang handog na butil at handog na inumin nito ayon sa itinakdang tuntunin, at isang lalaking kambing bilang handog para sa kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Ang Hebreong חַטָּאת ay maaaring tumukoy sa handog na may kaugnayan sa kasalanan at sa epekto nitong ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: hindi napansin ng kapulungan
  rationale: Likas na salin sa Filipino ng idyomang literal na “mula sa mga mata ng kapulungan”; ipinahihiwatig nitong hindi ito namalayan o napansin ng pamayanan.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: nagawa iyon nang hindi sinasadya
  rationale: Pinananatili ang legal at ritwal na pagkakaiba ng di-sinasadyang pagkakamali sa sadyang pagsuway.
- source_word: כָל הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa nagkakatipong pamayanan ng Israel; natural at marangal ang “kapulungan” sa makabagong Filipino.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: isang toro mula sa bakahan
  rationale: Ipinapahayag nang natural ang isang torong kabilang sa mga baka nang hindi ginagawang literal at mabigat ang Hebreong parirala.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Maliwanag na katawagan sa handog na ganap na sinusunog, at angkop sa karaniwang mambabasa.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: na may kalugod-lugod na samyo
  rationale: Pinananatili ang ritwal na talinghaga ng handog na kalugod-lugod at katanggap-tanggap sa Diyos.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Tuwirang inililipat ang tipanang pangalan na יהוה bilang Yahweh.
- source_word: וּמִנְחָתוֹ
  choice: kasama ang handog na butil nito
  rationale: Sa kontekstong pansakripisyo, ang מִנְחָה ay kasamang handog na butil; ipinakikita ng “kasama” ang kaugnayan nito sa toro.
- source_word: וְנִסְכּוֹ
  choice: at handog na inumin nito
  rationale: Malinaw at nakikilalang salin ng kasamang libasyon.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa itinakdang tuntunin
  rationale: Ipinahahayag ang iniresetang ritwal na kaayusan nang mas natural kaysa sa isang labis na teknikal na salita.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: at ng isang lalaking kambing
  rationale: Pinananatili ang tiyak na kasarian ng hayop sa Hebreo.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Pamilyar at angkop na pangunahing katawagan, habang inilalagay sa talababa ang posibleng diin sa ritwal na paglilinis.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa kontekstong pansakripisyo
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring itampok ng terminong Hebreo ang kaugnayan sa kasalanan o ang epekto nitong ritwal na paglilinis. Ginamit sa pangunahing teksto ang mas madaling makilalang katawagan, ngunit pinanatili sa talababa ang tunay na leksikal at ritwal na alternatibo.
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginamit ang personal at tipanang pangalan sa pinagmulang teksto; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” para sa pamayanang Israelita at magkakatugmang katawagang pansakripisyo. Inilagay ang tandang [a] pagkatapos mismo ng terminong tinutukoy nito.
