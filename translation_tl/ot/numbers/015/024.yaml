revisions:
- from: At kung nagawa iyon nang hindi sinasadya at hindi napansin ng kapulungan, maghahandog ang buong kapulungan ng isang toro mula sa bakahan bilang handog na sinusunog, na may kalugod-lugod na samyo para kay Yahweh, kasama ang handog na butil at handog na inumin nito ayon sa itinakdang tuntunin, at ng isang lalaking kambing bilang handog para sa kasalanan.[a]
  to: Kung nagawa iyon nang hindi sinasadya at hindi napansin ng kapulungan, maghahandog ang buong kapulungan ng isang toro mula sa kawan bilang handog na sinusunog, na may kalugod-lugod na samyo para kay Yahweh, kasama ang handog na butil at handog na inumin nito ayon sa itinakdang tuntunin, at isang lalaking kambing bilang handog para sa kasalanan.[a]
  rationale: Pinalitan ang “bakahan” ng “kawan” upang wastong tukuyin ang pinagmumulan ng toro, at inayos ang sintaks ng magkabilang handog. Walang binagong kahulugan, antas ng katiyakan, o teolohikal na pagpapakahulugan.
