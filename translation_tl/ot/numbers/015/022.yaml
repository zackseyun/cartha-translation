base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: tl
  text: Ngunit kung magkamali kayo nang hindi sinasadya at hindi ninyo gawin ang lahat ng utos na ito na sinabi ni Yahweh kay Moises,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maligaw kayo” o “magkasala kayo nang hindi sinasadya.” Ang pandiwang Hebreo ay tumutukoy sa pagkaligaw o pagkakamali; sa kontekstong ito, tumutukoy ito sa hindi sinasadyang pagkukulang tungkol sa mga utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Ngunit kung
  rationale: Ipinakikilala nito ang isang pasubaling kalagayan na nagpapatuloy sa naunang tagubiling legal; ang “Ngunit kung” ay natural sa Filipino at nagpapahiwatig ng bahagyang pag-iiba ng sitwasyon.
- source_word: תִשְׁגּוּ
  choice: magkamali kayo nang hindi sinasadya
  rationale: Ang שׁגה ay tumutukoy sa pagkakamali o pagkaligaw, at sa kontekstong legal na ito ay may diwang hindi sinasadya. Nililinaw ng salin ang kaibahan nito sa sadyang pagsuway nang hindi ito basta tinatawag na “kasalanan.”
- source_word: וְלֹא תַעֲשׂוּ
  choice: at hindi ninyo gawin
  rationale: Tuwirang katumbas ito ng malawak na pandiwang עשה at natural na ginagamit sa Filipino kaugnay ng mga utos.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: ang lahat ng utos na ito
  rationale: Pinananatili nito ang kabuuang saklaw ng כָּל at ang pagtukoy ng הָאֵלֶּה, habang gumagamit ng karaniwang salitang Filipino para sa מִצְוֺת.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: na sinabi ni Yahweh kay Moises
  rationale: Malinaw at natural nitong ipinakikita na ang mga utos ay yaong ipinahayag ni Yahweh kay Moises.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang kinagawiang anyo ng pangalang Moses sa modernong Filipino.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Diwa ng שׁגה sa kontekstong legal at panghandog
  choice: pagkakamaling hindi sinasadya
  alternative: pangkalahatang pagkakamali, pagkaligaw, o pagkakasala nang hindi sinasadya
  rationale: Ang kasunod na konteksto ay tungkol sa paglabag nang hindi sinasadya at inihahambing ito sa mapangahas na pagsuway. Pinananatili ng salin ang pagkakaibang iyon nang hindi nagdaragdag ng mas tiyak na terminolohiyang teolohikal kaysa sa hinihingi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong pasubali at ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
