  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֣י תָבֹ֗אוּ אֶל אֶ֨רֶץ֙ מוֹשְׁבֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֥ן לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: tl
  text: “Magsalita ka sa mga anak ni Israel[a] at sabihin mo sa kanila, ‘Kapag pumasok kayo sa lupaing inyong titirhan[b], na ibinibigay ko sa inyo,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal sa Hebreo, “mga anak na lalaki ni Israel”; ang parirala ay tumutukoy sa sambayanan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: O “lupain ng inyong mga tirahan” o “lupain ng inyong mga pamayanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Ang Piel imperative ng דבר ay karaniwang pormula ng utos sa paghahatid ni Moises ng tagubilin ng Diyos. Pinananatili ng “Magsalita ka” ang pormal na himig ng utos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Literal itong “mga anak na lalaki ni Israel,” ngunit sa Filipino, ang “mga anak ni Israel” ay likas at marangal na pariralang nagpapanatili sa ugnayang pampamilya nang hindi ipinahihiwatig na mga lalaki lamang ang buong tinutukoy na sambayanan.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: at sabihin mo sa kanila
  rationale: Ito ang tuwirang katumbas ng karaniwang sunod na utos na nagpapakilala sa mensaheng ipahahayag.
- source_word: כִּי
  choice: Kapag
  rationale: Ipinakikilala rito ng כִּי ang inaasahang kalagayan kung kailan magiging angkop ang kasunod na tuntunin; mas natural at tiyak ang “Kapag” kaysa sa kondisyunal na “Kung.”
- source_word: תָבֹאוּ
  choice: pumasok kayo
  rationale: Maaaring mangahulugang “dumating” o “pumasok” ang בוא. Sa pariralang tumutukoy sa lupain, malinaw at likas sa Filipino ang “pumasok kayo.”
- source_word: אֶרֶץ
  choice: lupain
  rationale: Ang “lupain” ang karaniwang salitang Filipino para sa teritoryong ipinagkakaloob sa konteksto ng tipan at mas angkop dito kaysa sa “bansa.”
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: inyong titirhan
  rationale: Ang מוֹשָׁב ay maaaring tumukoy sa tirahan, paninirahan, o pamayanan. Ginagawang likas sa Filipino ng “lupaing inyong titirhan” ang di-pangkaraniwang konstruksiyong Hebreo habang pinananatili ang ideya ng paninirahan.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: na ibinibigay ko sa inyo
  rationale: Pinananatili ng progresibong “ibinibigay ko” ang participial na anyo ng נֹתֵן at ang kasalukuyan o nalalapit na katiyakan ng kaloob ng Diyos.
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng napiling salin ang pampamilyang larawan ng Hebreo. Sa gamit na Filipino, ang “mga anak” ay maaaring tumukoy sa buong sambayanan at hindi kailangang limitahan sa mga lalaki.
- issue: Aspekto ng kaloob ng Diyos sa נֹתֵן
  choice: na ibinibigay ko sa inyo
  alternative: na ibibigay ko sa inyo
  rationale: Hindi ginagawang payak na panghinaharap ang participle. Sa gayon, nananatili ang tensiyon sa pagitan ng pangakong matutupad pa at ng kaloob na inilalarawang tiyak at kasalukuyang nagmumula sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na utos at ang pampamilyang katawagan sa Israel, ngunit iniwasan ang sobrang literal na ayos na magiging alanganin sa karaniwang mambabasa.
