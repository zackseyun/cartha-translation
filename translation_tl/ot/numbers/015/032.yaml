id: NUM.15.32
reference: Numbers 15:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וַֽ/יִּמְצְא֗וּ אִ֛ישׁ מְקֹשֵׁ֥שׁ עֵצִ֖ים בְּ/י֥וֹם הַ/שַּׁבָּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: tl
  text: Habang nasa ilang ang mga anak ni Israel, may nakita silang isang lalaking namumulot ng kahoy[a] sa araw ng Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga patpat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Habang nasa
  rationale: Ang anyong pasalaysay ng היה ay naglalatag ng kalagayan o tagpo. Likas sa Filipino ang sugnay na “Habang nasa…” bilang panimula sa kasunod na pangyayari.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang anyo ng katawagang Hebreo para sa bayang nagmula kay Israel, at malinaw pa rin ito sa karaniwang wikang biblikal na Filipino.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay natural at maikli para sa lupaing hindi matao o masukal na pinagtalagahan ng Israel, nang hindi ipinapalagay na puro buhangin itong disyerto.
- source_word: וַיִּמְצְאוּ
  choice: may nakita silang
  rationale: Tuwirang ipinapahayag nito na natagpuan o namataan nila ang lalaki, sa likas na ayos ng pangungusap sa Filipino.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tiyak na lalaking indibidwal ang tinutukoy ng pangngalan dito, kaya hindi ito ginawang pangkalahatang “isang tao.”
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: namumulot ng kahoy
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na pagkolekta ng mga piraso ng kahoy. Natural sa Filipino ang “namumulot ng kahoy,” habang pinananatili sa talababa ang mas tiyak na posibleng “mga patpat.”
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: sa araw ng Sabat
  rationale: Pinananatili ang tahasang salitang “araw” at ang pangalan ng ikapitong araw na pamamahinga, gamit ang baybay na madaling basahin sa Filipino.
theological_decisions:
- issue: Katawagan sa bayang tipan sa בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Pinananatili ng napiling salin ang pormang pampamilya ng Hebreo nang hindi nagdaragdag ng paliwanag o doktrinal na kahulugan. Posible at mas idyomatiko ang “mga Israelita,” ngunit mas malayo ito sa anyo ng pinagmulan.
- issue: Katawagan sa Sabbath
  choice: sa araw ng Sabat
  alternative: sa Sabat; sa araw ng pamamahinga
  rationale: Tahasan nitong pinananatili ang יוֹם at ang terminong שַׁבָּת, nang hindi ginagawang interpretatibong paliwanag ang pangalan ng araw o nagdaragdag ng komentaryo tungkol sa kautusan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa ilang” at “namumulot” para sa natural na daloy, habang pinanatili ang biblikal na katawagang “mga anak ni Israel.” Inilagay ang talababa pagkatapos ng “kahoy,” ang salitang may leksikal na alternatibo.
