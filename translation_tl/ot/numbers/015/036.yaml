  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Kaya dinala siya ng buong kapulungan palabas ng kampo, at binato nila siya ng mga bato, at namatay siya, ayon sa iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa nagkakatipong sambayanan ng Israel; pinananatili ng “kapulungan” ang kolektibo at tipanang diwa, at ng “buong” ang כָּל.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: inilabas siya
  rationale: Ang Hiphil ng יצא ay “ilabas” o “dalhin palabas.” Natural at tuwiran sa Filipino ang “inilabas siya.”
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Ipinahihiwatig ng parirala ang pagdadala sa lugar na nasa labas ng kampo; malinaw at idiomatiko ito sa Filipino.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: binato nila siya hanggang sa mamatay
  rationale: Ang רגם ay pagbato bilang paraan ng paglalapat ng hatol. Sa modernong Filipino, nililinaw ng “hanggang sa mamatay” ang nakamamatay na pagbato at iniiwasan ang posibleng pagkaunawa na karaniwang paghagis lamang ng bato; kasunod din nito ang tahasang וַיָּמֹת.
- source_word: וַיָּמֹת
  choice: hanggang sa mamatay
  rationale: Ang מות ay karaniwang pandiwang “mamatay.” Isinama ito sa natural na konstruksiyong Filipino nang hindi dinaragdagan ang sanhi ng kamatayan.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ayon sa iniutos ni Yahweh kay Moises
  rationale: Ang כַּאֲשֶׁר ay nagpapahayag ng pagtutugma sa naunang utos. Ipinahihiwatig ng “iniutos” ang nauna nang ibinigay na utos, at pinananatili ang personal na pangalang Yahweh.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kapulungan” para sa pormal at kolektibong diwa ng sambayanan, habang nananatiling natural ang ayos ng pangungusap.
