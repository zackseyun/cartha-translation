  source_fidelity: 'Ang kasalukuyang salin ay wastong naghahatid ng mga pangunahing elemento ng Hebreo: ang buong kapulungan, paglalabas sa labas ng kampo, pagbato, kamatayan, at pagsunod sa utos ni Yahweh kay Moises. Gayunman, pinagsasama nito ang magkahiwalay na pandiwang וַיִּרְגְּמוּ (''binato'') at וַיָּמֹת (''at namatay'') sa ''binato nila siya hanggang sa mamatay.'' Ligtas at mas tapat na panatilihing hiwalay ang tahasang pahayag na siya ay namatay, at isalin ang tahasang instrumentong ''sa pamamagitan ng mga bato.'''
