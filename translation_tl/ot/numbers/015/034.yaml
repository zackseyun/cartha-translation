base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: tl
  text: Kaya inilagay nila siya sa ilalim ng pagbabantay, sapagkat hindi pa malinaw[a] kung ano ang dapat gawin sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi pa itinakda kung ano ang gagawin sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: inilagay nila
  rationale: Ang Hiphil ng נוח ay maaaring mangahulugang ilagay o iwan. Ang “inilagay nila” ay natural sa salaysay at malinaw na nagpapahiwatig na ipinasailalim nila ang lalaki sa pagbabantay.
- source_word: אֹתוֹ
  choice: siya
  rationale: Panlalaking pang-isahang tuwirang layon na tumutukoy sa lalaking nahuling namumulot ng kahoy sa naunang konteksto.
- source_word: בַּמִּשְׁמָר
  choice: sa ilalim ng pagbabantay
  rationale: Ang מִשְׁמָר ay maaaring tumukoy sa pagbabantay, kustodiya, o lugar ng pansamantalang pagkakapiit. Iniiwasan ng saling ito ang masyadong tiyak na “bilangguan” at pinananatili ang diwang legal na pansamantalang pagpigil.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit siya pinabantayan. Ang “sapagkat” ay malinaw, marangal, at angkop sa kasalukuyang salin ng Kasulatan.
- source_word: לֹא פֹרַשׁ
  choice: hindi pa malinaw
  rationale: Ang pasibong anyo ng פרש ay nagpapahiwatig na hindi pa malinaw na naipahayag o natutukoy ang bagay. Natural sa Filipino ang “hindi pa malinaw,” samantalang inilalahad sa talababa ang mas tiyak na posibleng kahulugang “hindi pa itinakda.”
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: kung ano ang dapat gawin sa kanya
  rationale: Ipinahahayag ng sugnay ang kinakailangang pasiya tungkol sa gagawin sa lalaki. Ang “dapat gawin” ay likas sa Filipino at nagpapanatili ng deliberatibo at legal na diwa.
theological_decisions:
- issue: Uri ng kawalang-linaw sa prosesong legal
  choice: Sinasabi ng teksto na hindi pa malinaw kung ano ang dapat gawin sa lalaki.
  alternative: Maaaring unawain nang mas makitid na hindi pa natutukoy o naipahahayag ang tiyak na parusa sa kanya.
  rationale: Nakatuon ang לֹא פֹרַשׁ sa kawalan ng malinaw na pahayag o pagtukoy. Hindi idinaragdag ng salin na hindi nila alam ang kautusan sa pangkalahatan, ni nililimitahan nito ang kahulugan sa isang tiyak na uri ng parusa.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Pinili ang “sa ilalim ng pagbabantay” sa halip na “nasa kustodiya” o “sa bilangguan” upang maging madaling maunawaan at hindi magdagdag ng pormal na konseptong penal na wala sa Hebreo. Inilagay ang talababa pagkatapos ng “hindi pa malinaw” dahil iyon ang mismong pariralang may leksikal na alternatibo.
