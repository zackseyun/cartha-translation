  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: tl
  text: At patatawarin ang buong kapulungan ng mga anak ni Israel, pati ang dayuhang naninirahan sa gitna nila[a], sapagkat ang buong bayan ay nagkamali nang hindi sinasadya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dayuhang naninirahan” ay isang hindi Israelitang residente na nakatira sa gitna ng Israel at sakop ng mga batas at proteksiyon ng pamayanan.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “sapagkat para sa buong bayan ay sa pagkakamali.” Maaari rin itong isalin: “sapagkat hindi sinasadyang nagawa ito ng buong bayan.” Maigsi at eliptiko ang Hebreo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: At patatawarin
  rationale: Ang Nifal na anyo ay may pasibo/impersonal na diwa; likas sa Tagalog ang pasibong “patatawarin” upang ihayag na ipinagkakaloob ang kapatawaran sa mga tao.
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ang buong kapulungan ng mga anak ni Israel
  rationale: Pinananatili ng “kapulungan” ang kolektibo at pormal na diwa ng עֵדָה sa kontekstong legal at pangsamba, at tuwirang isinasalin ang בְּנֵי יִשְׂרָאֵל bilang “mga anak ni Israel.”
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: pati ang dayuhang naninirahan sa gitna nila
  rationale: Ang גֵּר ay residenteng dayuhan sa loob ng pamayanan, hindi panandaliang bisita. Ipinahahayag ng “dayuhang naninirahan” ang legal at panlipunang katayuang iyon sa malinaw na makabagong Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit saklaw ng kapatawaran ang buong pamayanan.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: ang buong bayan ay nagkasala nang hindi sinasadya
  rationale: Ang maigsi at eliptikong Hebreo ay tumutukoy sa kamaliang sumasaklaw sa buong bayan. Idinagdag ang “nagkasala” mula sa agarang kontekstong legal upang maging likas sa Tagalog, habang pinananatili ng talababa ang mas literal na posibilidad.
theological_decisions:
- issue: Saklaw ng kapatawaran sa buong pamayanan
  choice: Ang kapatawaran ay para sa buong kapulungan ng Israel at sa residenteng dayuhan na kasama nila.
  alternative: Maaaring ipahayag ang huling sugnay nang mas literal bilang “sapagkat hindi sinasadya iyon ng buong bayan.”
  rationale: Pinananatili ng salin ang kolektibong saklaw, ang pagkabilang ng residenteng dayuhan, at ang legal na kategorya ng kasalanang hindi sinasadya nang walang idinadagdag na doktrinal na paliwanag.
- issue: Likas na kalabuan ng huling sugnay
  choice: “ang buong bayan ay nagkasala nang hindi sinasadya”
  alternative: “para sa buong bayan, iyon ay hindi sinasadya” o “ang buong bayan ay nagkamali”
  rationale: Eliptiko ang לְכָל הָעָם בִּשְׁגָגָה. Ang pangunahing salin ay malinaw sa Tagalog at naaayon sa konteksto, ngunit itinatala ang mas literal na pagbasa upang hindi maitago ang kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kapulungan” para sa pormal at kolektibong diwa, “dayuhang naninirahan” upang maging malinaw ang sinaunang kategoryang panlipunan, at “nang hindi sinasadya” para sa legal na pagkakaiba ng di-sinasadyang kasalanan.
