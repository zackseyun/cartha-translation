  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: tl
  text: At kung may dayuhang naninirahan sa inyo, o sinumang nasa gitna ninyo sa buong panahon ng inyong mga salinlahi, at maghahandog siya ng handog na iniaalay sa apoy[a], isang samyong kalugud-lugod kay Yahweh, kung paano kayo naghahandog ay gayon din siya maghahandog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog na pagkain.” Literal na tumutukoy ang terminong Hebreo sa handog na iniaalay sa apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na וְ at ang kondisyunal na gamit ng כִּי, habang natural sa Filipino.
- source_word: יָגוּר ... גֵּר
  choice: may dayuhang naninirahan
  rationale: Ipinahahayag ang legal at panlipunang kalagayan ng גֵּר bilang isang hindi katutubong naninirahan sa pamayanan, hindi lamang isang panandaliang bisita.
- source_word: אִתְּכֶם ... בְּתוֹכְכֶם
  choice: kasama ninyo ... nasa gitna ninyo
  rationale: 'Pinananatili ang pagkakaiba ng dalawang pariralang Hebreo: pakikisamang ''kasama'' at presensiyang ''nasa gitna'' ng pamayanan.'
- source_word: לְדֹרֹתֵיכֶם
  choice: sa mga salinlahi ninyo
  rationale: Ipinakikita ang patuloy na bisa ng tuntunin sa magkakasunod na salinlahi.
- source_word: וְעָשָׂה
  choice: at maghandog siya
  rationale: Bagaman literal na 'gumawa,' ang pandiwa ay tumutukoy rito sa pagsasagawa o paghahandog ng sakripisyo.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Malapit ito sa karaniwang sakripisyong gamit ng termino at malinaw sa modernong Filipino; inilalahad sa talababa ang isa pang posibleng salin.
- source_word: רֵיחַ נִיחֹחַ
  choice: isang samyong kalugod-lugod
  rationale: Pinananatili ang metapora ng samyo at ang diwa ng pagiging katanggap-tanggap o nakalulugod.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang ginagamit ang personal na pangalang kinakatawan ng tetragrammaton sa tekstong Hebreo.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: kung ano ang ginagawa ninyo ay gayon din ang gagawin niya
  rationale: Pinananatili ang pormulang paghahambing na nag-uutos ng parehong paraan ng paghahandog.
theological_decisions:
- issue: Kalagayan ng hindi Israelitang kalahok sa paghahandog
  choice: Ipinatutupad sa dayuhang naninirahan o sinumang nasa gitna ng Israel ang parehong paraan ng paghahandog na ginagawa ng kausap na pamayanan.
  alternative: Maaaring unawain nang mas makitid na tumutukoy lamang ito sa dayuhang naninirahang nakaugnay na sa buhay-tipanan ng Israel.
  rationale: Binibigyang-diin ng pormulang Hebreo na 'gayon din ang gagawin niya' ang pagkakapareho ng gawaing ritwal sa kasong ito, nang hindi nagpapasya sa mas malawak na katayuang pangtipan na hindi tahasang tinatalakay ng talata.
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “dayuhang naninirahan” upang maging malinaw ang natatanging katayuan ng גֵּר, at pinanatili ang legal na paghahambing sa hulihan nang hindi nagdaragdag ng konklusyong teolohikal.
