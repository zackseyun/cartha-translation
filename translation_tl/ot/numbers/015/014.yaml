review_pass:
  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: ang residenteng dayuhan o sinumang nasa pamayanan sa mga salinlahi ay dapat maghandog sa paraang ginagawa rin ng mga Israelita. Gayunman, ang “handog na pinaraan sa apoy” ay hindi ligtas na paglalarawan ng אִשֶּׁה; mas natural at mas tumpak ang “handog na iniaalay sa apoy.”'
  naturalness: Pormal at pangkalahatang malinaw ang Tagalog. Ang “pinaraan sa apoy” ay hindi natural sa kontekstong sakripisyal at maaaring magpahiwatig ng ibang ritwal. Ang rebisyon ay nagpapakinis din sa huling pormulang legal sa pamamagitan ng tahasang pagtukoy sa paghahandog.
  terminology: Ang “dayuhang naninirahan” ay angkop para sa גֵּר nang hindi binubura ang natatanging katayuang legal nito. Ang “Yahweh” ay pare-pareho sa draft. Pinananatili ang “samyong kalugud-lugod” para sa רֵיחַ נִיחֹחַ at nililinaw sa talababa ang literal na fire-offering sense ng אִשֶּׁה.
  issues:
  - severity: medium
    issue: Ang “handog na pinaraan sa apoy” para sa אִשֶּׁה ay maaaring maling maunawaan.
    rationale: Ang terminong Hebreo ay tumutukoy sa handog na iniaalay o inihahandog sa pamamagitan ng apoy. Sa modernong Filipino, ang “pinaraan sa apoy” ay hindi idiomatiko rito at maaari pang magpahiwatig ng ibang gawain.
  - severity: low
    issue: Ang huling paghahambing ay mas malinaw kung ang pandiwang “maghandog” ay inuulit.
    rationale: Ang כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה ay legal na pormula ng pagkakapareho ng ritwal. Ang “kung paano kayo naghahandog, gayon din siya maghahandog” ay nananatiling tapat at mas tuwiran sa Tagalog.
  revised_text: At kung may dayuhang naninirahan sa inyo, o sinumang nasa gitna ninyo sa buong panahon ng inyong mga salinlahi, at maghahandog siya ng handog na iniaalay sa apoy[a], isang samyong kalugud-lugod kay Yahweh, kung paano kayo naghahandog ay gayon din siya maghahandog.
  revised_footnotes:
  - marker: a
    text: O “handog na pagkain.” Literal na tumutukoy ang terminong Hebreo sa handog na iniaalay sa apoy.
    reason: lexical_alternative
  revision_rationale: Pinalitan ang hindi idiomatikong “pinaraan sa apoy” ng “iniiaalay sa apoy,” na mas angkop sa sakripisyong kahulugan ng אִשֶּׁה at hindi nagdaragdag ng tiyak na anyo ng handog. Inayos din ang hulihan upang malinaw na ang parehong paraan ng paghahandog ang hinihingi, habang pinananatili ang saklaw at ambigwidad ng Hebreo.
