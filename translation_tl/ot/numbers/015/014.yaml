revisions:
- from: At kung may dayuhang naninirahang kasama ninyo, o sinumang nasa gitna ninyo sa mga salinlahi ninyo, at maghandog siya ng handog na pinaraan sa apoy[a], isang samyong kalugod-lugod kay Yahweh, kung ano ang ginagawa ninyo ay gayon din ang gagawin niya.
  to: At kung may dayuhang naninirahan sa inyo, o sinumang nasa gitna ninyo sa buong panahon ng inyong mga salinlahi, at maghahandog siya ng handog na iniaalay sa apoy[a], isang samyong kalugud-lugod kay Yahweh, kung paano kayo naghahandog ay gayon din siya maghahandog.
  rationale: Pinalitan ang hindi idiomatikong “pinaraan sa apoy” ng “iniiaalay sa apoy,” na mas angkop sa sakripisyong kahulugan ng אִשֶּׁה at hindi nagdaragdag ng tiyak na anyo ng handog. Inayos din ang hulihan upang malinaw na ang parehong paraan ng paghahandog ang hinihingi, habang pinananatili ang saklaw at ambigwidad ng Hebreo.
  reviewer_model: gpt-5.6-terra
