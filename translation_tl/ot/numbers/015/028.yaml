  source_fidelity: 'Tumpak ang pangunahing diwa: ang pari ang nagsasagawa ng pagbabayad-sala sa harap ni Yahweh para sa taong nagkasala nang hindi sinasadya, at ang resulta ay kapatawaran. Gayunman, ang “dahil sa kasalanang” ay mas malinaw na nagpapahiwatig ng sanhi kaysa sa saklaw/circumstance ng Hebreong parirala. Maaaring panatilihin ang pag-uulit nang mas malapit sa pinagmulan sa pamamagitan ng “ukol sa di-sinasadya nitong pagkakasala.”'
  naturalness: Marangal at madaling maintindihan ang register. Ang “ito/nito” para sa isang tao ay posible ngunit medyo impersonal sa modernong Tagalog; gayunman, ang “nitong” ay katanggap-tanggap kapag tumutukoy sa “taong iyon.” Ang rebisyon ay nagpapakinis sa ugnayan ng mga sugnay nang hindi inaalis ang sinadyang pag-uulit ng Hebreo.
  terminology: Ang “magbabayad-sala,” “pari,” at “Yahweh” ay angkop at magkakatugma sa terminolohiyang pangritwal at sa pagsasalin ng banal na pangalan. Ang “patatawarin” ay wastong nagpapahayag ng pasibong וְנִסְלַח לוֹ.
