  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: tl
  text: At magbabayad-sala ang pari sa harap ni Yahweh para sa taong nagkasala nang hindi sinasadya. Magbabayad-sala siya para sa taong iyon ukol sa di-sinasadya nitong pagkakasala, at patatawarin ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר / לְכַפֵּר
  choice: magbabayad-sala / magbabayad-sala
  rationale: Ang Piel ng כפר sa kontekstong pangpari ay tumutukoy sa pagsasagawa ng ritwal na nagdudulot ng kapatawaran. Ang “magbayad-sala” ay maikli, likas sa wikang biblikal na Tagalog, at hindi nagtatakda ng isang partikular na teorya tungkol sa pagtubos. Inulit ito upang mapanatili ang dalawang paglitaw ng כפר sa Hebreo.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Tuwirang katawagan sa tagapangasiwa ng ritwal.
- source_word: עַל הַנֶּפֶשׁ
  choice: para sa taong
  rationale: Ang נֶפֶשׁ dito ay ang mismong tao o indibidwal, hindi isang hiwalay na di-materyal na “kaluluwa.”
- source_word: הַשֹּׁגֶגֶת ... בְּחֶטְאָה בִשְׁגָגָה
  choice: taong nagkasala nang hindi sinasadya ... dahil sa kasalanang nagawa nito nang hindi sinasadya
  rationale: Pinananatili ang pag-uulit ng ideya ng שׁגג at שׁגָגָה habang inaayos ang pangungusap upang maging malinaw at natural sa modernong Tagalog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ipinahahayag ng לִפְנֵי ang kaugnayang “sa harap” o “sa presensiya,” at pinananatili ang personal na pangalang Yahweh.
- source_word: וְנִסְלַח לוֹ
  choice: at patatawarin ito
  rationale: 'Pinananatili ang diwang pasibo ng pandiwa: ang tao ang tumatanggap ng kapatawaran bilang bunga ng pagbabayad-sala.'
theological_decisions:
- issue: Paglalarawan sa bisa ng ritwal na כפר
  choice: magbabayad-sala ... at patatawarin ito
  alternative: tutubusin ... at patatawarin ito
  rationale: Pinananatili ang ugnayan ng gawaing pangpari at kapatawaran nang hindi ipinapaliwanag ang tiyak na mekanismo nito o nag-aangkat ng isang makitid na teoryang teolohikal.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang tinutukoy ng tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalang tipan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ito/nito” para sa taong tinutukoy upang maiwasang lagyan ng kasariang hindi kailangang ipahayag sa Tagalog. Hinati sa dalawang pangungusap ang mahabang sugnay upang maging malinaw, habang pinananatili ang pag-uulit ng pagbabayad-sala at ng di-sinasadyang pagkakasala.
