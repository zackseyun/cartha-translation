  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: tl
  text: Ang sinumang humipo sa bangkay ng sinumang tao[a] ay magiging marumi nang pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa patay ng sinumang taong tao”; tumutukoy ito sa bangkay ng sinumang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: Ang sinumang humipo
  rationale: Ang participle na may pantukoy ay ginagamit bilang pangngalan at may pangkalahatang diwa. Likas sa modernong Tagalog ang “ang sinumang humipo” at angkop ito sa tuntuning legal.
- source_word: בְּמֵת
  choice: sa bangkay
  rationale: Ang מֵת ay literal na tumutukoy sa taong patay. Sa konteksto ng paghipo at ritwal na karumihan, malinaw at natural ang “bangkay.”
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: ng sinumang tao
  rationale: Tinutukoy ng parirala ang sinumang taong namatay, hindi lamang lalaki. Pinananatili ng “sinumang tao” ang pangkalahatang saklaw ng Hebreo.
- source_word: וְטָמֵא
  choice: ay magiging marumi
  rationale: Ipinapahayag ng anyong pandiwa ang kalagayang ibinubunga ng paghipo. Ang “magiging marumi” ay natural sa Tagalog at malinaw na ritwal na resulta, hindi utos.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Ang “sa loob ng” ay likas na paraan sa Tagalog upang ipahayag ang tagal ng kalagayan.
theological_decisions:
- issue: Saklaw ng אָדָם sa kontekstong legal
  choice: tao
  alternative: lalaki; taong nilalang
  rationale: Ang אָדָם dito ay pangkalahatan at tumutukoy sa sinumang tao, hindi partikular sa isang lalaki. Kaya hindi dapat lagyan ng kasariang wala sa pinagmulan.
- issue: Kahulugan ng טָמֵא
  choice: marumi
  alternative: ritwal na marumi; di-malinis
  rationale: Ang “marumi” ang karaniwang terminong biblikal sa Tagalog para sa ritwal na kalagayan. Hindi idinagdag sa pangunahing teksto ang “ritwal” sapagkat malinaw ito sa konteksto at wala itong hiwalay na katumbas sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang “bangkay” sa halip na mas malabong “patay,” at pinanatili ang pangkalahatang saklaw ng tuntunin.
