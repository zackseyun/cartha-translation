  source_fidelity: Tumpak na naipapahayag ng draft ang sunod-sunod na tagubilin, ang pagkuha at pagwiwisik ng bahagi ng dugo sa pamamagitan ng daliri, ang pitong pagwiwisik, at ang direksiyong nakaharap sa Tolda ng Tipanan. Gayunman, ang pangunahing parirala para sa direksiyon at ang paulit na bahagi ng dugo ay maaaring ayusin upang maging higit na natural nang hindi nawawala ang diin ng Hebreo.
  naturalness: 'May ilang hindi likas na parirala sa modernong Filipino: ang “sa direksiyon ng harapan ng” ay mabigat at paulit ang ideya ng direksiyon/harapan; ang “iwiwisik niya nang pitong ulit ang kaunti sa dugo nito” ay hindi maayos ang ayos ng layon at pang-abay. Ang “Tolda ng Tipanan” ay mas karaniwan at mas malinaw na anyong Filipino kaysa “Toldang Tipanan.”'
  terminology: Pinanatili ang “paring si Eleazar,” “dugo,” “iwiwisik,” at “Tolda ng Tipanan.” Walang doktrinal na dagdag o pagbawas. Ang “gamit ang kaniyang daliri” ay malinaw na instrumental para sa בְּאֶצְבָּעוֹ.
