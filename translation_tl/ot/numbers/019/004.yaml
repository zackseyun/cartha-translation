base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: tl
  text: Pagkatapos, kukuha ang paring si Eleazar ng kaunti sa dugo nito gamit ang kaniyang daliri, at iwiwisik niya ang ilan sa dugo nito nang pitong ulit patungo sa harapan ng Tolda ng Tipanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng Tolda ng Tipanan.” Ipinahihiwatig ng pariralang Hebreo ang direksiyong nakatuon sa harapang bahagi ng tolda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Pagkatapos, kukuha
  rationale: Ang waw + qatal sa sunod-sunod na tagubilin sa ritwal ay nagpapahayag ng kasunod na hakbang; natural itong ipinahahayag sa Filipino sa pamamagitan ng “Pagkatapos” at aspektong kontemplatibo.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ang paring si Eleazar
  rationale: Natural na ayos sa modernong Filipino para sa pangalan at katungkulan, habang pinananatili ang tahasang pagkakakilanlan sa kanya bilang pari.
- source_word: מִדָּמָהּ
  choice: ng kaunti sa dugo nito
  rationale: 'Pinananatili ang partitive na diwa ng מִן: bahagi lamang ng dugo ng dumalagang baka ang kukunin at iwiwisik.'
- source_word: בְּאֶצְבָּעוֹ
  choice: sa pamamagitan ng kanyang daliri
  rationale: Ang בְּ ay instrumental dito. Iniiwasan ng saling ito ang posibleng pakahulugang nakapatong lamang ang dugo sa daliri, at malinaw na ang daliri ang ginagamit sa ritwal na pagkilos.
- source_word: וְהִזָּה
  choice: at iwiwisik niya
  rationale: Ang נזה sa kontekstong pangpari ay tumutukoy sa ritwal na pagwiwisik ng dugo o tubig; “iwiwisik” ang malinaw at karaniwang katumbas.
- source_word: אֶל נֹכַח פְּנֵי
  choice: sa direksiyon ng harapan ng
  rationale: Ipinapahayag ang oryentasyong patungo sa harapang bahagi ng tolda, nang hindi ipinahihiwatig na ginawa ang kilos sa loob nito.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Ang “Toldang Tipanan” ay isang natural at dignified na katawagan sa Filipino para sa itinalagang santuwaryong אֹהֶל מוֹעֵד; ipinahihiwatig nito ang banal na lugar ng pakikipagtagpo nang hindi gumagamit ng mas malawak na interpretibong katawagang “tabernakulo.”
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong ulit
  rationale: Tuwirang pinananatili ang tiyak na bilang at pag-uulit ng ritwal.
theological_decisions:
- issue: Direksiyon ng pagwiwisik kaugnay ng Toldang Tipanan
  choice: sa direksiyon ng harapan ng Toldang Tipanan
  alternative: sa harap ng Toldang Tipanan
  rationale: Pinananatili ng pangunahing salin ang direksiyonal na lakas ng אֶל נֹכַח פְּנֵי; inilalagay sa talababa ang mas maikli ngunit bahagyang hindi gaanong tiyak na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong ritwal. Pinanatili ang pag-uulit ng “dugo nito” dahil binibigyang-diin ito sa Hebreo, sa halip na palitan ng panghalip lamang.
