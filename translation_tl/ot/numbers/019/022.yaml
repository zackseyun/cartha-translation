  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: tl
  text: At ang anumang hipuin ng taong marumi ay magiging marumi. Ang taong humipo rito[a] ay magiging marumi hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, hindi tahasang binanggit ang bagay na hinihipo sa ikalawang pangungusap. Maaari ring isalin: “Ang taong humihipo ay magiging marumi hanggang sa gabi.”'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: At ang anumang
  rationale: Ipinahahayag ng כֹל אֲשֶׁר ang isang saklaw na walang itinatangi. Likas sa makabagong Tagalog ang “ang anumang” at malinaw nitong pinananatili ang pangkalahatang diwa.
- source_word: יִגַּע בּוֹ
  choice: hipuin
  rationale: Ang נגע ay tumutukoy sa paghipo o pagkakadikit. Sapat at natural ang “hipuin” sa konteksto ng ritwal na karumihan; nakapaloob na sa pandiwang Tagalog ang kaugnayan sa layon.
- source_word: הַטָּמֵא
  choice: taong marumi
  rationale: Ginagamit bilang pangngalang pantukoy sa isang taong nasa kalagayan ng ritwal na karumihan ang pang-uri. Nililinaw ng “taong marumi” ang tinutukoy nang hindi ito ginagawang pahayag tungkol sa moral na kasalanan.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Ipinahihiwatig ng pandiwa ang pagpasok o pagkakalagay sa kalagayan ng ritwal na karumihan. Malinaw na ipinakikita ng “magiging marumi” ang pagbabagong bunga ng paghipo.
- source_word: וְהַנֶּפֶשׁ
  choice: Ang taong
  rationale: Sa mga tekstong legal at ritwal, ang נֶפֶשׁ ay karaniwang tumutukoy sa buong tao, hindi lamang sa “kaluluwa.” Kaya “tao” ang malinaw at hindi mapanlinlang na salin.
- source_word: הַנֹּגַעַת
  choice: humipo rito
  rationale: Ang participle ay naglalarawan sa taong humihipo. Hindi tahasang inuulit sa Hebreo ang layon; ang “rito” ay natural na tumutukoy sa bagay na naging marumi sa naunang sugnay, habang itinatala sa talababa ang pagiging implicit nito.
- source_word: תִּטְמָא
  choice: ay magiging marumi
  rationale: Inilalahad ang kalagayang idudulot ng paghipo. Ang “magiging marumi” ay malinaw at pare-pareho sa gamit ng salitang-ugat sa unang sugnay.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Ito ang natural at karaniwang salin ng takdang-panahong pormula sa mga kautusan tungkol sa ritwal na kalinisan.
theological_decisions:
- issue: Kalikasan ng karumihang tinutukoy ng טמא
  choice: Isinalin bilang “marumi” sa kahulugang ritwal.
  alternative: “nadungisan” o “makasalanan”
  rationale: Ang talata ay tungkol sa ritwal na karumihang naipapasa sa paghipo, hindi isang tahasang hatol tungkol sa moral na pagkakasala. Iniiwasan ng saling ito ang pagdaragdag ng teolohikong pahayag na wala sa teksto.
- issue: Hindi tahasang layon ng הַנֹּגַעַת
  choice: Ginamit ang “rito” bilang natural na pagtukoy sa bagay na naging marumi sa unang sugnay, na may talababa.
  alternative: “ang taong humihipo” nang walang binanggit na layon
  rationale: Walang tahasang layon ang participle sa Hebreo. Malamang na ipinagpapatuloy nito ang ideya ng paghipo sa bagay na naging marumi, ngunit pinananatili ng talababa ang pormal na kalabuan ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “marumi” bilang karaniwang terminong biblikal para sa ritwal na karumihan, at iniwasan ang mas moralistikong “nadungisan.”
