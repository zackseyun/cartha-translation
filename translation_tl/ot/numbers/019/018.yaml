  terminology: Pinananatili ang “hisopo,” “tolda,” “mga kagamitan,” “libingan,” at ang ritwal na “malinis.” Ang “bangkay ng pinaslang” / “patay” ay naghahatid ng pagkakaiba ng חָלָל at מֵת nang hindi gumagamit ng di-likas na Tagalog.
