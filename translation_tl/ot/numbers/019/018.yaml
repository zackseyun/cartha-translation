id: NUM.19.18
reference: Numbers 19:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: tl
  text: Pagkatapos, kukuha ng hisopo ang isang lalaking malinis ayon sa ritwal[a], isasawsaw niya ito sa tubig, at iwiwisik niya ang tubig sa tolda, sa lahat ng kagamitan, sa mga taong naroon, at sa sinumang humipo sa buto, sa bangkay ng pinaslang[b], sa patay, o sa libingan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lalaking nasa kalagayang malinis ayon sa ritwal.” Panlalaking isahan ang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “ang pinaslang.” Ang salitang Hebreo ay partikular na tumutukoy sa isang marahas na pinatay, na naiiba sa mas pangkalahatang “patay” sa kasunod na parirala.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  choice: hisopo
  rationale: Ito ang kinagawiang katawagang biblikal sa halamang ginagamit sa mga ritwal ng paglilinis; mas tiyak ito kaysa sa pangkalahatang “halaman” o “sanga.”
- source_word: בַּמַּיִם
  choice: sa tubig
  rationale: Tinutukoy ng anyong may pantukoy sa Hebreo ang tubig na inihanda sa naunang konteksto para sa paglilinis.
- source_word: אִישׁ טָהוֹר
  choice: isang lalaking malinis
  rationale: Pinananatili nito ang panlalaking isahan ng Hebreo at ang bokabularyo ng ritwal na kalinisan, nang hindi ito ginagawang pahayag tungkol sa moralidad.
- source_word: וְהִזָּה
  choice: iwiwisik
  rationale: Natural na salitang Filipino ito para sa ritwal na paglalagay ng tubig sa pamamagitan ng maliliit na patak.
- source_word: הָאֹהֶל
  choice: tolda
  rationale: Ang tinutukoy ay ang toldang kinaroroonan ng namatay, hindi ang tabernakulo.
- source_word: הַכֵּלִים
  choice: mga kagamitan
  rationale: Malawak ang saklaw ng salitang Hebreo para sa mga kasangkapan, sisidlan, o iba pang gamit; “mga kagamitan” ang pinakanatural at hindi labis na makitid.
- source_word: הַנְּפָשׁוֹת
  choice: mga taong naroon
  rationale: Bagaman maaaring literal na tumukoy sa “mga buhay” o “mga kaluluwa,” malinaw na mga taong nasa tolda ang tinutukoy rito.
- source_word: הַנֹּגֵעַ
  choice: sinumang humipo
  rationale: Natural na naihahayag sa Filipino ang substantibong pandiwaring Hebreo habang pinananatili ang pagtukoy sa taong nagkaroon ng paghipo.
- source_word: בָּעֶצֶם
  choice: sa buto
  rationale: Pinananatili ang isahang anyo; ipinahihiwatig ng konteksto na buto ng tao ang pinagmumulan ng ritwal na karumihan.
- source_word: בֶחָלָל
  choice: sa bangkay ng pinaslang
  rationale: Ang חָלָל ay tumutukoy lalo na sa isang napatay o pinaslang. Ginagawang malinaw ng “bangkay” na labi ng patay ang tinutukoy, habang pinananatili ang pagkakaiba nito sa mas pangkalahatang kasunod na termino.
- source_word: בַמֵּת
  choice: sa bangkay ng namatay
  rationale: Mas pangkalahatan ang מֵת kaysa חָלָל; ipinakikita ng “namatay” ang kaibhang ito mula sa isang partikular na pinaslang.
- source_word: בַקָּבֶר
  choice: sa libingan
  rationale: Karaniwan at malinaw na katumbas ito ng salitang Hebreo para sa pinaglibingan.
theological_decisions:
- issue: Terminolohiya ng ritwal na kalinisan
  choice: malinis
  alternative: dalisay
  rationale: Ang talata ay tungkol sa ritwal na karumihang dulot ng pakikipag-ugnayan sa patay, hindi tuwirang tungkol sa moral na kadalisayan.
- issue: Panlalaking katawagan sa אִישׁ
  choice: lalaki
  alternative: tao
  rationale: Tahasang panlalaking isahan ang אִישׁ sa Hebreo, kaya hindi ito ginawang walang kasarian; ang pangunahing kwalipikasyon sa konteksto ay ang pagiging malinis ayon sa ritwal.
- issue: Pagkakaiba ng חָלָל at מֵת
  choice: bangkay ng pinaslang / bangkay ng namatay
  alternative: bangkay / taong patay
  rationale: 'Pinananatili ng salin ang tunay na leksikal na pagkakaiba: ang una ay partikular na isang pinaslang, samantalang ang ikalawa ay mas pangkalahatang namatay.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda” sa halip na “tabernakulo,” “mga kagamitan” para sa malawak na kahulugan ng כְּלִי, at magkatugmang parirala upang luminaw ang talaan ng mga pinagmumulan ng ritwal na karumihan. Inilipat ang panandang [a] sa pariralang talagang ipinaliliwanag nito.
