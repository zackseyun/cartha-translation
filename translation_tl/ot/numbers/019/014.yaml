  text: זֹ֚את הַ/תּוֹרָ֔ה אָדָ֖ם כִּֽי יָמ֣וּת בְּ/אֹ֑הֶל כָּל הַ/בָּ֤א אֶל הָ/אֹ֨הֶל֙ וְ/כָל אֲשֶׁ֣ר בָּ/אֹ֔הֶל יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: tl
  text: 'Ito ang kautusan: Kapag may taong namatay sa isang tolda, ang bawat papasok sa tolda at ang bawat nasa tolda[a] ay magiging marumi sa loob ng pitong araw.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ng nasa tolda.” Maaaring mas malawak ang saklaw ng pananalitang Hebreo, ngunit ang pagkakatulad nito sa “bawat papasok” at ang pandiwang nasa isahan ay pumapabor sa pagtukoy sa mga taong naroon. Tahasang binabanggit sa kasunod na talata ang mga sisidlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Ito ang kautusan
  rationale: Sa kontekstong ito, ipinakikilala ng תּוֹרָה ang umiiral na tuntunin tungkol sa ritwal na karumihan dahil sa bangkay. Likas at marangal sa modernong Filipino ang “kautusan.”
- source_word: אָדָם כִּי יָמוּת
  choice: Kapag may taong namatay
  rationale: Ang אָדָם ay pangkalahatang tumutukoy sa isang tao, at ang כִּי kasama ng pandiwang di-ganap ay naglalahad ng kasong maaaring mangyari. Pinananatili ng “kapag” ang estilong legal nang hindi nililimitahan ang kasarian.
- source_word: בְּאֹהֶל
  choice: sa isang tolda
  rationale: Walang pantukoy ang unang pagbanggit sa tolda, kaya ang “isang tolda” angkop na nagpapakilala sa sitwasyon.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: ang bawat papasok sa tolda
  rationale: Ang participle na הַבָּא kasama ng כָּל ay tumutukoy sa sinumang pumapasok. Ang “bawat papasok” ay maikli, natural, at nagpapanatili sa pangkalahatang bisa ng tuntunin.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: at ang bawat nasa tolda
  rationale: 'Sadyang pinananatili ng “bawat nasa tolda” ang lawak at bahagyang kalabuan ng אֲשֶׁר: sa konteksto ay malamang na mga taong naroon, ngunit maaari itong maunawaang mas malawak.'
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Tumutukoy ito sa ritwal na kalagayan, hindi sa pisikal na dumi. Ang “magiging marumi” ay malinaw na naghahayag ng pagpasok sa gayong kalagayan at natural sa Filipino.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural na Filipino para sa itinakdang tagal ng ritwal na karumihan.
theological_decisions:
- issue: Kung ang וְכָל אֲשֶׁר בָּאֹהֶל ay tumutukoy lamang sa mga tao o maaari ring sumaklaw sa mga bagay
  choice: Isinalin sa pangunahing teksto bilang “ang bawat nasa tolda,” na sa karaniwang pagbasa ay tumutukoy sa mga tao ngunit hindi lubusang isinasara ang mas malawak na saklaw.
  alternative: “ang lahat ng nasa tolda” o tahasang “ang bawat taong nasa tolda”
  rationale: Ang paralelismo sa “bawat papasok” at ang pandiwang nasa isahan ay pumapabor sa pagtukoy sa mga tao; gayunman, maaaring mas malawak ang אֲשֶׁר. Tahasang tinatalakay sa kasunod na talata ang mga sisidlan, kaya hindi nararapat na gawing tiyak dito ang isang interpretasyong hindi ganap na tiyak sa Hebreo.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na estilong legal. Ginamit ang “tolda” bilang karaniwang katumbas ng אֹהֶל at “marumi” sa teknikal na kahulugan ng ritwal na karumihan. Ang pangungusap ay inayos nang natural sa Filipino habang pinananatili ang pagkakasunod ng mga sugnay sa Hebreo.
