  to: Ang sinumang humipo sa isang patay—sa bangkay ng isang taong namatay—at hindi sumailalim sa ritwal na paglilinis ay dumungis sa tabernakulo ni Yahweh; ang taong iyon ay ihihiwalay mula sa Israel. Sapagkat hindi siya winisikan ng tubig na panlinis[a], siya ay marumi; nanatili pa rin sa kanya ang kanyang karumihan.
