id: NUM.19.13
reference: Numbers 19:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: tl
  text: Ang sinumang humipo sa isang patay—sa bangkay ng isang taong namatay—at hindi sumailalim sa ritwal na paglilinis ay dumungis sa tabernakulo ni Yahweh; ang taong iyon ay ihihiwalay mula sa Israel. Sapagkat hindi siya winisikan ng tubig na panlinis[a], siya ay marumi; nanatili pa rin sa kanya ang kanyang karumihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tubig ng karumihan”; tumutukoy ito sa tubig na ginagamit upang alisin ang karumihang dulot ng bangkay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת
  choice: humipo sa patay
  rationale: Tuwirang ipinapahayag ng pandiwang נגע ang pisikal na paghipo; nililinaw ng kasunod na parirala na bangkay ng tao ang tinutukoy.
- source_word: בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: sa bangkay ng isang taong namatay
  rationale: Sa konteksto ng karumihang dulot ng patay, ang נֶפֶשׁ ay tumutukoy sa bangkay. Ang “tao” ay natural at wastong panumbas sa generic na אָדָם.
- source_word: יִתְחַטָּא
  choice: nagpakalinis
  rationale: Ipinahihiwatig ng anyong hitpael ang pagpapailalim sa ritwal na paglilinis, hindi pagsisisi sa kasalanan. Natural sa Tagalog ang “nagpakalinis” para rito.
- source_word: מִשְׁכַּן יְהוָה
  choice: tabernakulo ni Yahweh
  rationale: Ang מִשְׁכָּן ay ang banal na toldang tahanan; pinananatili ng “tabernakulo” ang tiyak na katawagang pangkulto, at tuwirang inililipat ang banal na pangalang יהוה bilang Yahweh.
- source_word: טִמֵּא
  choice: dumungis
  rationale: Ang piel ay nagsasaad na ginawa niyang marumi ang santuwaryo. Ang “dumungis” ay malinaw, mariin, at angkop sa ritwal na konteksto.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִיִּשְׂרָאֵל
  choice: Ang taong iyon ay aalisin sa Israel
  rationale: Ang נֶפֶשׁ dito ay ang indibiduwal. Ang “aalisin” ay nagpapanatili sa bigat at di-tiyak na paraan ng kaparusahang nakapaloob sa pormulang כרת, nang hindi ito nililimitahan sa kamatayan o pormal na pagtitiwalag.
- source_word: מֵי נִדָּה
  choice: tubig na panlinis
  rationale: Ito ang inihandang tubig na ginagamit upang alisin ang karumihang dulot ng bangkay. Natural sa Tagalog ang “tubig na panlinis”; inilalagay sa talababa ang literal at sadyang tensiyong pariralang Hebreo.
- source_word: זֹרַק עָלָיו
  choice: hindi siya winisikan
  rationale: Ang ritwal na kilos ay pagwiwisik ng tubig sa tao; ang pasibong “winisikan” ay malinaw at natural.
- source_word: טָמֵא יִהְיֶה
  choice: mananatili siyang marumi
  rationale: Ipinapahayag ng sugnay ang nagpapatuloy niyang katayuang ritwal, na pinagtitibay ng kasunod na עוֹד.
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: nasa kanya pa rin ang kanyang karumihan
  rationale: Pinananatili nito ang larawan ng karumihang nananatili sa tao at ang diin ng עוֹד sa pagpapatuloy.
theological_decisions:
- issue: Kahulugan ng kaparusahang וְנִכְרְתָה (“aalisin”)
  choice: Panatilihin ang pormulang “aalisin sa Israel” nang hindi tinutukoy ang eksaktong paraan ng kaparusahan.
  alternative: “papatayin” o “ititiwalag sa sambayanan”
  rationale: Hindi tahasang nililinaw ng talata kung kamatayan, banal na paghatol, o pag-aalis sa komunidad ang mekanismo. Hindi dapat lutasin sa salin ang tunay na di-katiyakan ng Hebreo.
- issue: Ritwal laban sa moral na kahulugan ng paglilinis
  choice: Gamitin ang “nagpakalinis” bilang ritwal na paglilinis.
  alternative: “nagsisi” o “nilinis ang sarili sa kasalanan”
  rationale: Ang konteksto ay karumihang ritwal mula sa paghipo sa bangkay, hindi tuwirang moral na pagsisisi.
- issue: Banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang “Yahweh” ay tuwirang kumakatawan sa personal na banal na pangalan sa tekstong Hebreo at iniiwasang palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabernakulo” bilang pamilyar na katawagang biblikal, ngunit pinanatiling payak ang balangkas ng pangungusap. Ang mga gitling-pahaba ay nagpapakitang ang “bangkay ng isang taong namatay” ay paglilinaw sa “patay.”
