  source_fidelity: 'Ang salin ay tumpak sa pangunahing daloy ng Hebreo: paghipo sa bangkay ng tao, kabiguang sumailalim sa ritwal na paglilinis, pagdungis sa tabernakulo ni Yahweh, kaparusahang covenantal, at nagpapatuloy na karumihan. Gayunman, ang “aalisin sa Israel” ay masyadong pangkalahatan at hindi gaanong naipapakita ang pormulang legal na וְנִכְרְתָה. Ang “ihihiwalay mula sa Israel” ay mas malinaw na nagpapanatili ng paghihiwalay habang hindi nagtatakda kung kamatayan ba ito o pormal na pagtitiwalag.'
  naturalness: Natural at marangal ang kabuuan. Mas malinaw sa makabagong Filipino ang “hindi sumailalim sa ritwal na paglilinis” kaysa “hindi nagpakalinis,” na maaari ring unawain bilang karaniwang paglilinis ng sarili. Ang “nanatili pa rin sa kanya” ay mas idiomatiko kaysa “nasa kanya pa rin” para sa nagpapatuloy na ritwal na karumihan.
  terminology: Ang “tabernakulo ni Yahweh,” “dumungis,” at “tubig na panlinis” ay angkop. Pinananatili ng talababa ang literal na “tubig ng karumihan” at nililinaw ang teknikal na gamit nito. Ang “ritwal na paglilinis” ay mahalaga upang hindi maipakahulugang moral na pagsisisi ang יִתְחַטָּא.
  issues:
