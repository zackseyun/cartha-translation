    issue: Ang “aalisin sa Israel” ay kulang sa pahiwatig ng pormulang “shall be cut off.”
    rationale: Bagaman wastong hindi tukuyin ang eksaktong paraan ng kaparusahan, ang “aalisin” ay maaaring mangahulugan lamang ng ordinaryong pag-alis. Ang “ihihiwalay mula sa Israel” ay mas malinaw na naghahatid ng covenantal na paghihiwalay nang hindi ipinipilit ang isang pinagtatalunang mekanismo.
  - severity: low
    issue: Maaaring malabo ang “hindi nagpakalinis” kung ritwal o karaniwang paglilinis ang tinutukoy.
    rationale: Ang hitpael ng חטא sa kontekstong ito ay ritwal na pagpapadalisay mula sa karumihang dulot ng bangkay. Ang tahasang pagbanggit ng ritwal na paglilinis ay naglilinaw nito.
