base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: tl
  text: Pagkatapos, kukuha ang pari ng kahoy na sedro, isopo, at sinulid na matingkad na pula, at ihahagis niya ang mga iyon sa gitna ng pagsunog sa baka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumalaga.” Ang Hebreong פָּרָה ay tumutukoy sa babaeng baka; madalas itong isalin bilang “dumalaga” sa ritwal na ito.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Pagkatapos, kukuha
  rationale: Ang waw na kasunod ng qatal ay nagpapatuloy sa pagkakasunod-sunod ng itinakdang ritwal. Likas sa modernong Filipino ang “Pagkatapos, kukuha” para sa preskriptibong hakbang sa hinaharap.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na katumbas ng כֹּהֵן sa kontekstong panritwal; napananatili rin ang pagiging tiyak ng pangngalan.
- source_word: עֵץ אֶרֶז
  choice: kahoy na sedro
  rationale: Natural na katumbas ng pariralang konstrukto na literal na “kahoy ng sedro,” at malinaw na tumutukoy sa materyal.
- source_word: וְאֵזוֹב
  choice: isopo
  rationale: Nakaugaliang katawagang biblikal sa halamang אֵזוֹב. Hindi tiyak ang eksaktong pagkakakilanlang botanikal, kaya hindi ito ginawang mas espesipiko.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: sinulid na matingkad na pula
  rationale: Tumutukoy ang parirala sa materyal na kinulayan ng matingkad na pula. Ang “sinulid” ay angkop sa kagamitang panritwal, at iniiwasan ang nakalilitong literal na pagtukoy sa uod na pinagmumulan ng tina.
- source_word: וְהִשְׁלִיךְ
  choice: at ihahagis niya
  rationale: Malinaw at kasalukuyang Filipino para sa Hiphil ng שלך, na nangangahulugang ihagis o itapon. Ang “niya” ay nilinaw lamang ang patuloy na simuno, ang pari.
- source_word: אֶל תּוֹךְ
  choice: sa gitna ng
  rationale: Pinananatili ang diin ng parirala sa paglalagay sa loob o kalagitnaan, hindi lamang malapit sa pinagsusunugan.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: pagsunog sa baka
  rationale: Ang שְׂרֵפָה ay ang proseso ng pagsunog, hindi lamang ang apoy. Ang פָּרָה ay babaeng baka; “baka” ang pinakakaraniwan at madaling maunawaang katawagan sa Filipino.
theological_decisions:
- issue: Paglalarawan sa פָּרָה sa ritwal ng paglilinis
  choice: baka
  alternative: dumalaga
  rationale: Ang salitang Hebreo ay tumutukoy sa babaeng hayop ng lahing baka at maaaring isaling “dumalaga” sa tradisyunal na pagbasa. Pinili ang mas karaniwang “baka” dahil hindi hinihingi ng salita mismo na idiin ang edad o ang hindi pa panganganak; inilagay sa talababa ang mas espesipikong alternatibo upang mapanatili ang tunay na saklaw ng salita.
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang payak na bokabularyo at malinaw na ayos ng pangungusap, habang pinananatili ang preskriptibong pagkakasunod-sunod at panritwal na tono ng Hebreo.
