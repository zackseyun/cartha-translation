id: NUM.19.3
reference: Numbers 19:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/נְתַתֶּ֣ם אֹתָ֔/הּ אֶל אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן וְ/הוֹצִ֤יא אֹתָ/הּ֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/שָׁחַ֥ט אֹתָ֖/הּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: tl
  text: Ibibigay ninyo ito kay Eleazar na pari, at ilalabas niya ito sa labas ng kampo, at kakatayin ito sa harap niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at kakatayin niya ito sa harap niya,” kung si Eleazar ang ituturing na patuloy na paksa ng pandiwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: Ibibigay ninyo
  rationale: Ang Qal perfect na may waw sa kontekstong legal ay may puwersang pautos; natural sa Filipino ang anyong panghinaharap bilang tagubilin.
- source_word: אֹתָהּ
  choice: ito
  rationale: Ang pambabaeng panghalip ay tumutukoy sa dumalagang baka; hindi karaniwang minamarkahan sa Filipino ang kasarian ng hayop sa panghalip.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: kay Eleazar na pari
  rationale: Likas na Filipino para sa pang-ukol, pangalang pantangi, at titulong הכהן.
- source_word: וְהוֹצִיא אֹתָהּ
  choice: at ilalabas niya ito
  rationale: Pinananatili ng causative na 'ilalabas' ang Hiphil ng יצא at malinaw na si Eleazar ang paksa ng sugnay.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Natural at tumpak na katumbas ng patungong-labas na parirala sa Hebreo.
- source_word: וְשָׁחַט אֹתָהּ
  choice: at kakatayin ito
  rationale: Ang di-aktibong ayos sa Filipino ay hindi tahasang nagpapakilala sa implicit na 3ms na tagagawa, kaya napapanatili ang kalabuan kung si Eleazar o ibang tao ang kakatay.
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Direkta at likas na salin na maaaring mangahulugang nasa harapan o presensiya niya.
theological_decisions:
- issue: Pagkakakilanlan ng kakatay sa huling sugnay
  choice: 'Hindi tahasang pinangalanan ang tagagawa: “kakatayin ito sa harap niya.”'
  alternative: “kakatayin niya ito sa harap niya,” na itinuturing na si Eleazar pa rin ang paksa
  rationale: Nasa 3ms ang pandiwa ngunit implicit ang paksa. Maaaring si Eleazar ang nagpapatuloy na paksa, subalit ang “sa harap niya” ay maaari ring magpahiwatig na ibang tao ang kakatay sa presensiya niya. Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Ginamit ang “kampo” bilang karaniwang katawagan sa Israelitang himpilan at ang anyong pautos na panghinaharap na angkop sa batas o ritwal na tagubilin.
