  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: tl
  text: Ngunit ang taong naging marumi at hindi nagpadalisay—ang taong iyon ay puputulin mula sa gitna ng kapulungan[a], sapagkat dinungisan niya ang santuwaryo ni Yahweh. Hindi siya nawisikan ng tubig na panlinis sa karumihan[b]; marumi siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang kaluluwang iyon ay puputulin.” Sa pormulang legal na Hebreo, ang “kaluluwa” ay maaaring tumukoy sa buong tao, hindi lamang sa di-materyal na bahagi niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tubig ng karumihan”; ayon sa tradisyon, “tubig ng pagbubukod.” Tumutukoy ito sa tubig na panlinis na inihanda sa kabanatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ang taong
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, pangkalahatan ang gamit nito rito para sa sinumang kabilang sa Israel; natural at tumpak sa Filipino ang “taong.”
- source_word: יִטְמָא
  choice: naging marumi
  rationale: Ipinahihiwatig ng Qal na pumasok ang tao sa kalagayan ng ritwal na karumihan, hindi na gumawa siya ng moral na kasalanan.
- source_word: יִתְחַטָּא
  choice: naglinis ng sarili
  rationale: Sa konteksto ng ritwal, tumutukoy ang hitpael ng חטא sa pagpapadalisay mula sa karumihan, hindi sa ordinaryong kahulugan ng pagkakasala.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ang taong iyon ay ititiwalag
  rationale: Sa pormulang legal, ang נֶפֶשׁ ay tumutukoy sa buong tao. Pinananatili ng “ititiwalag” ang ideya ng pagkaputol mula sa sambayanan nang hindi tinutukoy kung kamatayan, pagpapaalis, o hatol ng Diyos ang paraan.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: mula sa kapulungan
  rationale: Ang קָהָל ay ang nagkakatipong sambayanan ng tipan; malinaw at marangal sa makabagong Filipino ang “kapulungan.”
- source_word: מִקְדַּשׁ יְהוָה
  choice: ang santuwaryo ni Yahweh
  rationale: Ang מִקְדָּשׁ ay banal na lugar o santuwaryo. Isinalin nang tahasan ang banal na pangalang יהוה bilang “Yahweh,” gaya ng consultation text.
- source_word: טִמֵּא
  choice: dinungisan
  rationale: Ang piel ay nagsasaad na ang santuwaryo ay ginawang marumi sa ritwal na diwa; ipinahahayag ng “dinungisan” ang bigat ng gawa.
- source_word: מֵי נִדָּה
  choice: tubig na panlinis sa karumihan
  rationale: Tumutukoy ito sa tubig na inihanda sa kabanatang ito upang alisin ang karumihang dulot ng bangkay. Nililinaw ng salin ang gamit nito nang hindi gumagamit ng malabong tradisyonal na katawagan.
- source_word: זֹרַק עָלָיו
  choice: nawisikan
  rationale: Sa ritwal na konteksto, ang זָרַק ay pagwiwisik o pagsasaboy ng likido sa isang tao.
- source_word: טָמֵא הוּא
  choice: marumi siya
  rationale: Tuwirang pinananatili ang legal na pahayag tungkol sa kanyang kasalukuyang kalagayan.
theological_decisions:
- issue: Kalikasan ng parusang ipinahihiwatig ng וְנִכְרְתָה
  choice: ititiwalag
  alternative: papatayin; paaalisin sa sambayanan; puputulin mula sa bayan
  rationale: Hindi espesipikong sinasabi ng pormulang Hebreo rito kung kamatayan, ekskomunikasyon, o tuwirang hatol ng Diyos ang paraan. Ang “ititiwalag” ay nagpapanatili sa legal at pangtipang bigat nang hindi lubusang nilulutas ang usapin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga terminong “marumi,” “panlinis,” at “santuwaryo” upang mapanatili ang ritwal at legal na diwa nang hindi ito ipinagkakamaling karaniwang dumi o moral na kasalanan. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
