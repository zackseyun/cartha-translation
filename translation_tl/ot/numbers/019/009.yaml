id: NUM.19.9
reference: Numbers 19:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: tl
  text: Pagkatapos, titipunin ng isang lalaking malinis ang abo ng dumalagang baka at ilalagay iyon sa isang malinis na lugar sa labas ng kampo. Iingatan iyon para sa kapulungan ng mga Israelita, upang gamitin sa tubig na panlinis sa karumihan.[a] Ito ay handog para sa kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tubig para sa pag-aalis ng karumihan” o, mas literal, “tubig ng karumihan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Ito ay handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa handog para sa kasalanan at, sa mga ritwal na makasaserdote, sa handog na nagdudulot ng paglilinis.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: isang lalaking malinis
  rationale: Pinananatili ang tahasang panlalaking אִישׁ at ang ritwal na diwa ng טָהוֹר; sa konteksto, ang “malinis” ay tumutukoy sa kalagayang malinis ayon sa ritwal.
- source_word: וְאָסַף
  choice: titipunin
  rationale: Ang waw na kasunod ng qatal ay nagpapatuloy sa serye ng mga tagubiling panritwal; natural sa Filipino ang aspektong kontemplatibo para sa iniutos na kilos.
- source_word: אֵפֶר הַפָּרָה
  choice: ang abo ng dumalagang baka
  rationale: Ang אֵפֶר ay kolektibong “abo,” at ang פָּרָה ay babaeng baka; “dumalagang baka” ang karaniwang tumpak na katawagan sa hayop na ito sa ritwal.
- source_word: וְהִנִּיחַ
  choice: at ilalagay iyon
  rationale: Tuwirang ipinapahayag ang paglalagay o pag-iwan ng abo sa itinakdang lugar; ang “iyon” ay malinaw na tumutukoy sa abo.
- source_word: מִחוּץ לַמַּחֲנֶה בְּמָקוֹם טָהוֹר
  choice: sa isang malinis na lugar sa labas ng kampo
  rationale: Natural na ayos sa Filipino habang pinananatili ang lokasyon at ang ritwal na kalinisan ng lugar.
- source_word: וְהָיְתָה ... לְמִשְׁמֶרֶת
  choice: Iingatan iyon
  rationale: Ang pambabaeng isahan ay tumutukoy sa kolektibong abo, at ang לְמִשְׁמֶרֶת ay nagpapahiwatig ng pag-iingat bilang nakalaang reserba.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: para sa kapulungan ng mga Israelita
  rationale: Ang “kapulungan” ay angkop sa legal-panritwal na עֲדָה; ang “mga Israelita” ay natural na modernong salin ng idiomatikong בְּנֵי יִשְׂרָאֵל nang hindi nililimitahan sa mga anak na lalaki.
- source_word: לְמֵי נִדָּה
  choice: upang gamitin sa tubig na panlinis sa karumihan
  rationale: Ipinahahayag ang layunin ng tubig sa ritwal nang malinaw, ngunit hindi binubura ang ugnayan nito sa נִדָּה, ritwal na karumihan.
- source_word: חַטָּאת הִוא
  choice: Ito ay handog para sa kasalanan
  rationale: Pinananatili ang karaniwang sakripisyal na kahulugan ng חַטָּאת, habang inilalagay sa talababa ang posibleng diin sa paglilinis.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa ritwal ng paglilinis
  choice: Ito ay handog para sa kasalanan
  alternative: Ito ay handog para sa paglilinis
  rationale: Maaaring tumukoy ang חַטָּאת sa kasalanan o sa handog na kaugnay nito, at sa mga tekstong makasaserdote ay maaari nitong idiin ang tungkuling maglinis. Pinananatili sa pangunahing teksto ang tradisyonal at leksikal na kahulugan, ngunit hindi itinatago ang alternatibong diin.
- issue: Kahulugan ng מֵי נִדָּה
  choice: tubig na panlinis sa karumihan
  alternative: tubig ng karumihan; tubig para sa pag-aalis ng karumihan
  rationale: Maaaring pormal na basahin ang parirala bilang “tubig ng karumihan,” ngunit ipinakikita ng ritwal na ginagamit ang tubig sa paglilinis mula sa karumihan. Ang pangunahing salin ay malinaw sa gamit habang ang pormal na alternatibo ay nasa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang mga terminong “malinis” at “karumihan” sa kanilang ritwal na diwa, at pinanatili sa mga talababa ang tunay na leksikal at teolohikal na kalabuan.
