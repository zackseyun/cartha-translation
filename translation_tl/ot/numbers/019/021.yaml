  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: tl
  text: 'At ito ay magiging tuntuning panghabang-panahon para sa kanila: Ang nagwiwisik ng tubig ng karumihan[a] ay maglalaba ng kanyang mga damit, at ang humipo sa tubig ng karumihan ay magiging marumi hanggang sa gabi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tubig na panlinis mula sa karumihan”; ayon sa tradisyon, “tubig ng pagkakahiwalay.” Sa Hebreo, “mga tubig ng karumihan.”
    reason: Ipinapakita ang literal na anyo ng Hebreo at ang posibleng paliwanag batay sa ritwal na gamit nito.
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: At ito ay magiging tuntuning panghabang-panahon para sa kanila
  rationale: Ipinahihiwatig ng pambabaeng pandiwang וְהָיְתָה ang tuntunin mula sa konteksto. Ang “tuntuning panghabang-panahon” ay natural sa modernong Tagalog at pinananatili ang diwa ng patuloy na bisa ng batas.
- source_word: וּמַזֵּה
  choice: ang nagwiwisik
  rationale: Ang participle ay tumutukoy sa taong nagsasagawa ng ritwal na pagwiwisik.
- source_word: מֵי הַנִּדָּה
  choice: tubig ng karumihan
  rationale: Malapit ito sa literal na Hebreong “mga tubig ng karumihan” at hindi nito tahasang nilulutas ang ugnayan ng tubig at ritwal na karumihan. Nililinaw sa talababa ang posibleng kahulugang panlinis.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: ay maglalaba ng kanyang mga damit
  rationale: Karaniwang tumutukoy ang כִּבֵּס sa paglalaba o paghuhugas ng mga damit; malinaw at natural ang “maglalaba” sa kasalukuyang Tagalog.
- source_word: וְהַנֹּגֵעַ
  choice: at ang humipo
  rationale: Isinasalin ang ikalawang substantival participle nang kaagapay ng “ang nagwiwisik.”
- source_word: יִטְמָא עַד הָעָרֶב
  choice: ay magiging marumi hanggang sa gabi
  rationale: Pinananatili ng “magiging marumi” ang terminolohiya ng ritwal na karumihan, at ang “hanggang sa gabi” ay natural na katumbas ng takdang hangganan ng panahon.
theological_decisions:
- issue: Pagpapahayag ng ritwal na karumihan sa Bilang 19
  choice: Gamitin ang “marumi” at “tubig ng karumihan” bilang mga terminong ritwal, kalakip ang paliwanag sa talababa.
  alternative: “Tubig na panlinis mula sa karumihan” o tradisyonal na “tubig ng pagkakahiwalay.”
  rationale: Tungkol ang talata sa ritwal na kalagayan, hindi sa moral na pagkakasala. Pinananatili ng pangunahing salin ang anyo at tensiyon ng Hebreo, habang inilalahad sa talababa ang paglilinis na gamit ng tubig ayon sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tuntunin” sa legal-ritwal na konteksto at iniwasan ang mga salitang maaaring magpahiwatig ng moral na kasalanan sa halip na seremonyal na karumihan.
