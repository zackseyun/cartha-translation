base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: tl
  text: Ang nagsunog nito ay dapat maglaba ng kanyang mga damit sa tubig at maligo sa tubig[a], at magiging marumi siya[b] hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gamit ang tubig” sa dalawang pagbanggit. Literal na “sa tubig” ang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “marumi” rito ay tumutukoy sa ritwal na karumihan, hindi kinakailangang sa moral na pagkakasala.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף אֹתָהּ
  choice: ang nagsunog nito
  rationale: Ang may artikulong participle ay tumutukoy sa taong nagsasagawa ng pagsunog. Natural sa Tagalog ang nakaraang-aspeto rito dahil ang paghuhugas at pagkaligo ay kasunod ng pagsunog; ang “nito” ay tumutukoy sa dumalagang baka.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: ay dapat maglaba ng kanyang mga damit
  rationale: May puwersang nag-uutos ang imperfect sa batas na ritwal. Ang “maglaba” ay ang karaniwang pandiwa para sa paghuhugas ng damit at pinananatili ang kaibahan nito sa pagligo ng katawan.
- source_word: בַּמַּיִם
  choice: sa tubig
  rationale: Malapit ito sa Hebreong beth na may pantukoy, ngunit natural sa modernong Tagalog. Maaari rin itong maunawaang “gamit ang tubig,” kaya itinala ang alternatibo sa talababa.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: at maligo
  rationale: Sa kontekstong ito, ang רחץ kasama ng בשר ay tumutukoy sa paghuhugas o pagpapaligo ng katawan. Sapat at natural ang “maligo” sa Tagalog, nang hindi na inuulit ang “kanyang katawan.”
- source_word: וְטָמֵא
  choice: at mananatili siyang marumi
  rationale: Ipinahahayag nito ang nagpapatuloy na kalagayang ritwal hanggang gabi. Ang “mananatili” ay umaangkop sa durasyong ipinakikita ng עַד, nang sabihing moral na kasalanan ito.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Tuwirang ipinahahayag ang hangganan ng kalagayang ritwal nang hindi pinakikitid sa interpretasyong “paglubog ng araw.”
theological_decisions:
- issue: Pagpapahayag ng טמא bilang ritwal na karumihan
  choice: marumi, na nililinaw sa talababa bilang ritwal na kalagayan
  alternative: ritwal na marumi
  rationale: Ang maikling “marumi” ay likas at tradisyonal sa pangunahing teksto, habang pinipigilan ng talababa ang maling pagkaunawang tumutukoy ito sa moral na pagkakasala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “damit,” “maglaba,” at “maligo” sa halip na mas makaluma o teknikal na pananalita; pinanatili sa talababa ang ritwal na kahulugan ng “marumi.”
