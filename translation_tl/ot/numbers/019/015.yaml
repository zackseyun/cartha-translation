translation:
  language: tl
  text: At ang bawat bukás na sisidlan na walang takip na nakatali rito[a] ay marumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “takip na nakaseguro” o “pantakip na nakatali”; tumutukoy ang tambalang Hebreo sa isang pantakip na ikinabit o itinali sa sisidlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: At ang bawat
  rationale: Ipinagdurugtong ng וְ ang tuntuning ito sa naunang konteksto, at ang כֹל na kasama ng pangngalang isahan ay likas na naipapahayag bilang “bawat.”
- source_word: כְּלִי
  choice: sisidlan
  rationale: Malawak ang saklaw ng כְּלִי, ngunit sa kontekstong ito ng isang bagay na maaaring maiwang bukás at maging marumi, ang “sisidlan” ang pinakanatural at tumpak.
- source_word: פָתוּחַ
  choice: bukás
  rationale: Tuwirang katumbas ito ng pang-uring nangangahulugang bukás; nililinaw ng kasunod na parirala ang kawalan ng nakasegurong takip.
- source_word: אֲשֶׁר אֵין
  choice: na walang
  rationale: Natural at maikli itong paraan sa Tagalog upang ipahayag ang kundisyong may kulang o wala sa sisidlan.
- source_word: צָמִיד פָּתִיל
  choice: nakataling takip
  rationale: Ipinahihiwatig ng tambalang Hebreo ang isang pantakip na ikinabit o isineguro sa pamamagitan ng pagtali. Pinananatili ng “nakataling takip” ang kongkretong larawan nang hindi labis na tinutukoy ang eksaktong sinaunang mekanismo.
- source_word: עָלָיו
  choice: dito
  rationale: Tumutukoy ito sa takip na nakalagay sa sisidlan; natural sa Tagalog ang “dito” matapos banggitin ang sisidlan.
- source_word: טָמֵא הוּא
  choice: ay marumi
  rationale: Pinananatili nito ang payak na pahayag ng Hebreo tungkol sa kalagayang marumi, nang hindi idinaragdag sa pangunahing teksto ang paliwanag na “ayon sa ritwal.”
theological_decisions:
- issue: Kalikasan ng karumihan
  choice: marumi
  alternative: marumi ayon sa ritwal
  rationale: Ang konteksto ay tungkol sa seremonyal na kalinisan, ngunit ang Hebreo ay payak na nagsasabing “marumi.” Pinananatili ng salin ang mismong pahayag at hindi nagsisingit ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sisidlan” bilang karaniwang salitang angkop sa konteksto ng kautusang pangkalinisan, at pinanatili ang “marumi” upang hindi palawakin ang sinasabi ng Hebreo.
