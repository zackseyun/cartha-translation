  to: '“Ito ang tuntunin ng kautusan na iniutos ni Yahweh: Sabihin mo sa mga Israelita na dalhan ka nila ng isang pulang bakang babae na buo, walang anumang kapintasan, at hindi pa napapatungan ng pamatok.”'
