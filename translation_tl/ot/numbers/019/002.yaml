reference: Numbers 19:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: tl
  text: '“Ito ang tuntunin ng kautusan na iniutos ni Yahweh: Sabihin mo sa mga Israelita na dalhan ka nila ng isang pulang bakang babae na buo, walang anumang kapintasan, at hindi pa napapatungan ng pamatok.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: tuntunin ng kautusan
  rationale: Pinananatili ang ugnayan ng חֻקָּה bilang itinakdang tuntunin at תּוֹרָה bilang kautusan o tagubilin, sa likas at marangal na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang natatanging personal na pangalan sa Hebreo sa malinaw na transliterasyon sa halip na ipalit ang isang titulo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Natural na kolektibong katawagan sa modernong Tagalog para sa literal na 'mga anak ni Israel.'
- source_word: פָרָה אֲדֻמָּה
  choice: pulang dumalagang baka
  rationale: Ang פָרָה ay babaeng baka; ipinahihiwatig ng 'dumalagang baka' ang heifer, samantalang pinananatili ng 'pula' ang kulay na אֲדֻמָּה.
- source_word: תְּמִימָה
  choice: buo
  rationale: Pinananatili ang positibong paglalarawan na 'kumpleto/buo' at hindi ito isinasanib sa kasunod na hiwalay na pariralang tungkol sa kapintasan.
- source_word: מוּם
  choice: kapintasan
  rationale: Karaniwang salitang Tagalog para sa pisikal na depektong nagpapawalang-karapat-dapat sa hayop sa kontekstong ritwal.
- source_word: עֹל
  choice: pamatok
  rationale: Tuwirang katumbas ng yoke na ipinapasan sa hayop para sa paggawa.
theological_decisions:
- issue: Paglalahad sa pangalan ng Diyos
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang tekstong pinagmulan ay may tetragrammaton na יְהוָה; ang transliterasyon ay nagpapakitang personal na pangalan ito, nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Kahulugan ng תְּמִימָה kaugnay ng מוּם
  choice: “buo, walang anumang kapintasan” bilang dalawang magkaugnay ngunit magkahiwalay na paglalarawan
  alternative: “walang kapintasan” lamang
  rationale: Pinananatili nito ang dalawang elemento ng Hebreo at iniiwasang burahin ang posibleng lawak ng תְּמִימָה.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “Sabihin mo” upang likas na katawanin ang לֵאמֹר kasunod ng utos, at “dalhan ka nila” para sa direksiyon ng וְיִקְחוּ אֵלֶיךָ. Walang idinagdag na paliwanag na sektaryan.
