- from: At ang sinumang humipo sa labas, sa isang taong pinatay sa pamamagitan ng tabak, o sa isang bangkay, o sa buto ng tao, o sa isang libingan, ay magiging marumi sa loob ng pitong araw.
  to: At ang sinumang humipo, sa bukas na kaparangan, sa isang taong napatay ng tabak, o sa isang bangkay, o sa buto ng tao, o sa isang libingan, ay magiging marumi sa loob ng pitong araw.
  rationale: Pinalitan ang malabong “sa labas” ng “sa bukas na kaparangan” upang maipahayag ang Hebreong idyoma para sa open field. Pinasimple rin ang parirala tungkol sa taong napatay ng tabak nang walang pagbabago sa kahulugan. Napanatili ang pangkalahatang saklaw ng “tao” para sa אָדָם at ang legal na terminong “magiging marumi.”
