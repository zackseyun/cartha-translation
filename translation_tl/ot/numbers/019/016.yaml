  - severity: low
    issue: Medyo mabigat ang “isang taong pinatay sa pamamagitan ng tabak.”
    rationale: Mas natural sa makabagong Filipino ang “isang taong napatay ng tabak,” na pinananatili ang kahulugang isang taong napatay sa pamamagitan ng tabak.
