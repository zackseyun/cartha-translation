  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: tl
  text: At ang sinumang humipo, sa bukas na kaparangan, sa isang taong napatay ng tabak, o sa isang bangkay, o sa buto ng tao, o sa isang libingan, ay magiging marumi sa loob ng pitong araw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: At ang sinumang humipo
  rationale: Ang כֹל na may sugnay na אֲשֶׁר ay distributibo at nagpapahayag ng pangkalahatang kaso; natural itong naihahayag sa Tagalog bilang “ang sinumang.”
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: sa labas
  rationale: Literal itong “sa ibabaw ng bukid,” ngunit idyoma ito para sa lantad na lugar sa labas. Ang “sa labas” ay malinaw at natural sa konteksto.
- source_word: בַּחֲלַל חֶרֶב
  choice: sa isang taong pinatay sa pamamagitan ng tabak
  rationale: Ang חָלָל ay isang taong napatay o nasugatan nang ikamatay, at ang חֶרֶב ang kasangkapang ginamit. Pinananatili ng salin ang personal na tinutukoy at ang instrumento.
- source_word: אוֹ בְמֵת
  choice: o sa isang bangkay
  rationale: Sa batas tungkol sa karumihan, ang מֵת ay tumutukoy sa patay na katawan; “bangkay” ang tuwiran at karaniwang salitang Tagalog.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: o sa buto ng tao
  rationale: Ang אָדָם dito ay pangkalahatang tumutukoy sa tao, hindi partikular sa lalaki. Ang “buto ng tao” ay tumpak at hindi nagdaragdag ng kasarian.
- source_word: אוֹ בְקָבֶר
  choice: o sa isang libingan
  rationale: Ang קֶבֶר ay libingan o lugar ng paglilibing; “libingan” ang tuwiran at angkop na katumbas.
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: ay magiging marumi sa loob ng pitong araw
  rationale: Ang pandiwa ay tumutukoy sa ritwal na karumihan. Ipinahahayag ng “magiging marumi” ang kalagayang bunga ng paghipo, at nililinaw ng “sa loob ng” ang tagal.
theological_decisions:
- issue: Ang uri ng karumihang ipinahahayag ng יִטְמָא
  choice: marumi
  alternative: ritwal na marumi
  rationale: Hindi idinagdag sa pangunahing teksto ang salitang “ritwal” sapagkat wala itong hiwalay na katumbas sa Hebreo at malinaw ang legal at ritwal na konteksto ng kabanata.
- issue: Pangkalahatang kahulugan ng אָדָם
  choice: tao
  alternative: lalaki
  rationale: Ang tinutukoy ay buto ng sinumang tao, hindi lamang ng isang lalaking tao; kaya pinananatili ang generic na saklaw.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Gumamit ng “sinumang” para sa pangkalahatang bisa ng batas at “bangkay” para sa malinaw na pagtukoy sa patay na katawan. Walang footnote dahil ang mga idyoma at leksikal na saklaw ay sapat na naipahayag sa pangunahing teksto.
