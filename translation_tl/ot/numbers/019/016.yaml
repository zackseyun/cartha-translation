  verdict: revise
  source_fidelity: 'Tumpak ang mga pangunahing bagay na tinutukoy: taong napatay ng tabak, bangkay, buto ng tao, libingan, at pitong araw na karumihan. Gayunman, ang “sa labas” ay masyadong malabo para sa עַל־פְּנֵי הַשָּׂדֶה at ang puwesto nito ay maaaring magmukhang simpleng pangyayari ng paghipo sa labas, sa halip na ang tiyak na idyomang “sa bukas na kaparangan.”'
  naturalness: Natural ang pangkalahatang ayos, ngunit mas malinaw at mas matatas ang “sa bukas na kaparangan” kaysa “sa labas,” at ang “napatay ng tabak” ay higit na payak kaysa “pinatay sa pamamagitan ng tabak.”
  terminology: Ang “bangkay,” “buto ng tao,” “libingan,” at “magiging marumi” ay angkop. Ang “marumi” ay dapat panatilihin bilang karaniwang legal/ritwal na terminong ginagamit sa konteksto; hindi kailangang magdagdag ng “ritwal” sa teksto.
