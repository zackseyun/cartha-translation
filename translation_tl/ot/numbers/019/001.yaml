  yaml_path: translation/ot/numbers/019/001.yaml
  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh kina Moises at Aaron at sinabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang pandiwang דִּבֵּר ay nagpapakilala ng isang bagong pangyayari ng pagsasalita. Ang “Nagsalita” ay tuwirang katumbas at angkop sa marangal ngunit makabagong salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Likas sa Filipino ang “kina” kapag dalawang taong pinatutungkulan ang kilos. Saklaw nito kapwa si Moises at si Aaron, kahit hindi inuulit ang pang-ukol gaya sa Hebreo.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Ang infinitibong ito ay pormulang nagpapakilala sa susunod na tuwirang pahayag. Ang “at sinabi” ay natural sa modernong Filipino at pinananatili ang ugnayan sa siping kasunod sa susunod na talata.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulong “ang PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na pangmaramihang pantukoy na “kina” at iniwasan ang artipisyal na “na sinasabi,” habang pinananatili ang pormulang nagpapakilala sa pahayag na kasunod.
