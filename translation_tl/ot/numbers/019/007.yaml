revisions:
- from: Pagkatapos, lalabhan ng pari ang kanyang mga damit at paliliguan niya sa tubig ang kanyang katawan. Pagkatapos nito, maaari siyang pumasok sa kampo; ngunit mananatiling marumi[a] ang pari hanggang sa gabi.
  to: Maglalaba ang pari ng kanyang mga damit at maghuhugas ng kanyang katawan sa tubig. Pagkatapos nito, makapapasok siya sa kampo; ngunit mananatiling marumi[a] ang pari hanggang sa gabi.
  rationale: Pinalitan ang di-likas na “paliliguan niya ... ang kanyang katawan” ng “maghuhugas ng kanyang katawan sa tubig,” na mas tumpak sa Hebreo at mas natural sa modernong Filipino. Inalis din ang panimulang “Pagkatapos” dahil ang berso ay nagsisimula sa utos, samantalang pinanatili ang “Pagkatapos nito” para sa וְאַחַר. Napanatili ang maingat na modal na “makapapasok” at ang talababa tungkol sa ritwal na karumihan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:55:03Z'
