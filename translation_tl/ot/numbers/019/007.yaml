  source_fidelity: 'Ang diwa ng utos at ang pansamantalang katayuang ritwal ay naipapahayag nang wasto. Gayunman, ang “paliliguan niya sa tubig ang kanyang katawan” ay hindi gaanong tumpak o likas: ang anyong paliguan ay karaniwang nagpapahiwatig na may pinaliliguan siyang iba o ng causative na kilos. Mas tuwirang naihahayag ng “maghuhugas ng kanyang katawan sa tubig” ang וְרָחַץ בְּשָׂרוֹ בַּמַּיִם.'
