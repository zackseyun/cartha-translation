  terminology: Ang “pari,” “mga damit,” “kampo,” at “marumi” ay angkop sa modernong Filipino Tagalog. Mahalaga ang talababa upang tiyaking ang “marumi” ay mauunawaang ritwal na katayuan at hindi paghatol sa moralidad.
