  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: tl
  text: Maglalaba ang pari ng kanyang mga damit at maghuhugas ng kanyang katawan sa tubig. Pagkatapos nito, makapapasok siya sa kampo; ngunit mananatiling marumi[a] ang pari hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “marumi” rito ay tumutukoy sa ritwal na karumihan, hindi kinakailangang sa personal na kasalanan o moral na pagkukulang.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lalabhan ... ang kanyang mga damit
  rationale: Ang Piel ng כבס ay tumutukoy sa paglalaba o paghuhugas ng kasuutan. Likas sa makabagong Filipino ang 'lalabhan' para sa mga damit, at ang aspektong magaganap ay angkop sa sunod-sunod na tagubiling ritwal.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katumbas ng כהן sa kontekstong pangritwal.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: paliliguan niya sa tubig ang kanyang katawan
  rationale: Sa kontekstong ito, ang בשר ay buong katawan, hindi lamang literal na laman. Ipinakikita ng 'paliliguan ... sa tubig' ang paghuhugas ng katawan at iniiwasang ulitin ang 'lalabhan.'
- source_word: וְאַחַר
  choice: pagkatapos nito
  rationale: Malinaw na minamarkahan ang kasunod na hakbang sa ritwal.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: maaari siyang pumasok sa kampo
  rationale: Bagaman pormal na imperfect ang pandiwa, sa konteksto ay likas itong maunawaan bilang pinahihintulutang muling pagpasok matapos ang paghuhugas.
- source_word: וְטָמֵא
  choice: mananatiling marumi
  rationale: Ipinahihiwatig ng sugnay na nagpapatuloy ang kalagayang טמא hanggang sa takdang panahon. Pinananatili ng 'marumi' ang tradisyonal na terminong pangritwal, na nililinaw sa talababa.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Natural na Filipino para sa hangganang panahong ipinahahayag ng parirala.
theological_decisions:
- issue: Kalikasan ng pagiging marumi
  choice: ritwal na karumihan, hindi awtomatikong kasalanang moral
  alternative: moral na karumihan o personal na pagkakasala
  rationale: Sa Bilang 19, ang טמא ay isang pansamantalang katayuang ritwal. Hindi nito sa sarili lamang ipinahahayag na nagkasala ang pari.
- issue: Lakas ng modal sa יָבֹא
  choice: pinahihintulutang pumasok
  alternative: uutusang pumasok o simpleng papasok
  rationale: Ang pagkakasunod ng mga sugnay ay maaaring magpahiwatig na matapos maligo ay maaari na siyang bumalik sa kampo, bagaman nananatili siyang ritwal na marumi hanggang gabi.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang 'pari,' 'mga damit,' 'katawan,' at 'kampo' bilang malinaw at karaniwang mga salita. Ang pahintulot na ipinahihiwatig sa muling pagpasok ay isinama sa teksto, kaya hindi na kailangan ang hiwalay na talababa para rito.
