  text: ה֣וּא יִתְחַטָּא ב֞/וֹ בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יִטְהָ֑ר וְ/אִם לֹ֨א יִתְחַטָּ֜א בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י לֹ֥א יִטְהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: tl
  text: Dapat niyang dalisayin ang sarili niya sa pamamagitan nito sa ikatlong araw at sa ikapitong araw[a], at magiging malinis siya. Ngunit kung hindi niya dadalisayin ang sarili niya sa ikatlong araw at sa ikapitong araw[b], hindi siya magiging malinis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, sa pamamagitan ng tubig na panlinis na inihanda sa naunang bahagi ng kabanata.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “lilinisin ang sarili niya.” Ang pandiwang Hebreo rito ay tumutukoy sa pagdanas ng ritwal na pagpapadalisay mula sa karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: dalisayin ang sarili niya
  rationale: Sa kontekstong ritwal, ang hitpael ng חטא ay tumutukoy sa pagpapadalisay mula sa karumihan, hindi sa pagkakasala. Pinananatili ng parirala ang reflexive na diwa at malinaw itong naiiba sa kalagayang ‘malinis’ na ipinahahayag ng יִטְהָר.
- source_word: בּוֹ
  choice: sa pamamagitan nito
  rationale: Pinananatili ang panghalip ng Hebreo at likas na tumutukoy pabalik sa tubig na panlinis na inihanda sa naunang bahagi ng kabanata, nang hindi ito labis na tinutukoy sa pangunahing teksto.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: sa ikatlong araw
  rationale: Karaniwan at likas na salin ng pariralang pamanahon.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: at sa ikapitong araw
  rationale: Pinananatili ang pagkakaugnay at ang itinakdang pagkakasunod ng ritwal.
- source_word: יִטְהָר
  choice: magiging malinis siya
  rationale: Ipinahahayag ng טהר ang ibinungang kalagayan ng pagiging ritwal na malinis; iniiwasan nitong ipareho ang dalawang magkaibang pandiwang Hebreo.
- source_word: וְאִם לֹא
  choice: Ngunit kung hindi
  rationale: Natural na ipinahahayag ang salungat at nagbababala na kondisyon ng Hebreo.
- source_word: הוּא
  choice: niya / siya
  rationale: Pinananatili ang panlalaking isahan ng Hebreo sa likas na ayos ng Tagalog; sa konteksto, tumutukoy ito sa taong naging marumi.
theological_decisions:
- issue: Kalikasan ng wikang ginagamit sa paglilinis sa Bilang 19
  choice: Isinalin bilang ritwal na pagpapadalisay at pagiging malinis, hindi bilang moral na kapatawaran o panloob na pagpapabanal.
  alternative: Gumamit ng pangkalahatang espirituwal na pananalita tungkol sa paglilinis.
  rationale: Ang konteksto ay karumihang dulot ng bangkay at ang itinakdang tubig na panlinis. Ang mga pandiwang Hebreo ay tumutukoy sa kalagayang ritwal, kaya hindi dapat ipasok sa talata ang mga kategoryang teolohikal na hindi nito tahasang sinasabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dalisayin” upang ipahiwatig ang prosesong ritwal at ang “magiging malinis” para sa ibinungang kalagayan; pinanatili rin ang dalawang araw na tahasang binanggit sa parehong sugnay.
