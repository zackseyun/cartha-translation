  source_fidelity: Tapat ang salin sa Hebreo. Napananatili nito ang reflexive na pagpapadalisay sa pamamagitan ng tinutukoy na tubig, ang mga itinakdang ikatlo at ikapitong araw, at ang magkaibang ideya ng pagsasagawa ng ritwal at ng resultang pagiging malinis. Hindi nito ginagawang moral o espirituwal na kapatawaran ang ritwal na karumihan.
