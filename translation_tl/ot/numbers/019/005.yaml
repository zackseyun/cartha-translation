  yaml_path: translation/ot/numbers/019/005.yaml
  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: tl
  text: At susunugin niya ang bakang babae[a] sa kanyang harapan; ang balat nito, ang laman nito, at ang dugo nito, kasama ang dumi nito, ay susunugin niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dumalagang baka.” Ang Hebreong פָּרָה ay tumutukoy sa isang hayop na bakang babae ngunit hindi kinakailangang magdiin na bata pa ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַף
  choice: At susunugin niya
  rationale: Ang waw + qatal sa sunod-sunod na ritwal na tagubilin ay may preskriptibong diwa. Likas sa modernong Tagalog ang aspektong kontemplatibo na “susunugin” para sa iniutos na gawa.
- source_word: הַפָּרָה
  choice: ang bakang babae[a]
  rationale: Ang פָּרָה ay babaeng bovine. Pinananatili ng “bakang babae” ang kasarian nang hindi ipinapalagay na bata pa ang hayop, gaya ng maaaring ipahiwatig ng “dumalagang baka.”
- source_word: לְעֵינָיו
  choice: sa harap ng kanyang mga mata
  rationale: Malapit ito sa literal na larawan ng Hebreo at malinaw na ipinahihiwatig na nagaganap ang pagsunog sa kanyang paningin.
- source_word: עֹרָהּ
  choice: ang balat nito
  rationale: Ang עוֹר ay balat o hide; “balat” ang pinakanatural at tiyak na katumbas sa Tagalog para sa panlabas na sapin ng hayop.
- source_word: בְּשָׂרָהּ
  choice: ang laman nito
  rationale: Ang בָּשָׂר ay tuwirang tumutukoy sa laman; ang “laman” ay angkop sa ritwal na konteksto at hindi nagpapahiwatig na pagkain ito.
- source_word: דָּמָהּ
  choice: ang dugo nito
  rationale: Tuwirang katumbas ng דָּם na may hulaping tumutukoy sa hayop.
- source_word: עַל פִּרְשָׁהּ
  choice: kasama ang dumi nito
  rationale: Ang פֶּרֶשׁ ay dumi o tae ng hayop. Sa talaang ito, ang עַל ay nagpapahiwatig ng pagsasama; malinaw na sinasabi ng “kasama” na pati ang dumi ay susunugin.
- source_word: יִשְׂרֹף
  choice: ay susunugin niya
  rationale: Inuulit ang pandiwa gaya sa Hebreo upang mariing tapusin ang talaan ng lahat ng bahaging kailangang sunugin.
theological_decisions:
- issue: Pagkakakilanlan ng gumagawa at ng nakamasid
  choice: Pinanatili ang mga panghalip na “niya” at “kanyang” nang hindi pinangalanan ang tinutukoy ng bawat isa.
  alternative: Tukuyin sa salin kung sino ang nagsusunog at kung kaninong paningin ito ginagawa.
  rationale: Mga panlalaking panghalip lamang ang nasa talata, at maaaring makuha ang mga tinutukoy mula sa mas malawak na konteksto. Ang hindi pagdaragdag ng pangalan ay umiiwas sa tahasang paglutas ng posibleng kalabuan ng Hebreo.
translation_notes:
  register: Pormal ngunit kasalukuyang Filipino ang ginamit. Pinanatili ang masidhing larawan ng “sa harap ng kanyang mga mata” at ang pag-uulit ng “susunugin,” habang ginawang malinaw at natural ang talaan sa Tagalog.
