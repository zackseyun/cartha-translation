  to: At susunugin niya ang bakang babae[a] sa kanyang harapan; ang balat nito, ang laman nito, at ang dugo nito, kasama ang dumi nito, ay susunugin niya.
  rationale: Pinalitan ang di-idiomatikong “sa harap ng kanyang mga mata” ng “sa kanyang harapan,” na natural na Filipino at tapat sa kahulugang “sa kanyang paningin.” Inayos din ang talababa upang alisin ang di-likas na hiram na “bovine.” Hindi binago ang saklaw ng kilos, ang pag-uulit ng pandiwa, o ang umiiral na kalabuan ng mga panghalip.
