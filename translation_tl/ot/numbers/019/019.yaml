  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: tl
  text: Sa ikatlong araw at sa ikapitong araw, wiwisikan ng taong malinis ang taong marumi. Sa ikapitong araw ay lilinisin[a] niya ang taong iyon. Pagkatapos, lalabhan ng taong nilinis ang kanyang mga damit at maliligo siya sa tubig; magiging malinis siya pagsapit ng gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aalisin niya ang karumihan ng taong iyon.” Ang pandiwang Hebreo ay mula sa salitang-ugat na kaugnay rin ng kasalanan, ngunit sa kontekstong ito ay tumutukoy sa ritwal na paglilinis mula sa karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: wiwisikan
  rationale: Ang Hiphil ng נזה ay tumutukoy sa pagwiwisik sa konteksto ng ritwal. Likas sa Tagalog ang pandiwang pokus-lokatibong “wiwisikan,” at hindi na nito kailangang magdagdag ng tahasang layon na wala sa mismong talata.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: ang taong malinis / ang taong marumi
  rationale: Ginagamit bilang mga pangngalang tumutukoy sa taong nasa kalagayan ng ritwal na kalinisan o karumihan. Ang “tao” ay nagpapanatili sa pangkalahatang saklaw ng kautusan.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: Sa ikatlo at ikapitong araw
  rationale: Direkta at natural na pagpapahayag ng dalawang takdang araw ng ritwal.
- source_word: וְחִטְּאוֹ
  choice: lilinisin niya ang taong iyon
  rationale: Sa Piel at sa kontekstong ito, ang חטא ay tumutukoy sa pag-aalis ng ritwal na karumihan, hindi sa moral na kapatawaran o pagtubos.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lalabhan ... ang kanyang mga damit
  rationale: Ang “lalabhan” at “mga damit” ay malinaw at likas sa kasalukuyang Tagalog.
- source_word: וְרָחַץ בַּמַּיִם
  choice: maliligo siya sa tubig
  rationale: Ipinahihiwatig ng pandiwa rito ang paghuhugas ng katawan; malinaw at maikli ang “maliligo sa tubig.”
- source_word: וְטָהֵר בָּעָרֶב
  choice: magiging malinis siya pagsapit ng gabi
  rationale: Ipinapahayag nito ang kalagayang matatamo sa takdang oras. Ang “pagsapit ng gabi” ay likas na Tagalog para sa temporal na hangganan.
theological_decisions:
- issue: Kalikasan ng paglilinis sa חטא/טהר
  choice: Ilarawan ito bilang ritwal na paglilinis
  alternative: Linisin mula sa kasalanan o tubusin
  rationale: Ang konteksto ay karumihang dulot ng bangkay at ang tubig para sa paglilinis. Hindi dapat ipasok ang tahasang moral o pangtubos na kahulugan na hindi hinihingi ng talata.
- issue: Kasarian ng הַטָּהֹר at הַטָּמֵא
  choice: Gamitin ang pangkalahatang “tao”
  alternative: Gamitin ang “lalaki”
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, kumakatawan ito rito sa sinumang kalahok sa ritwal at hindi sa isang kasariang eksklusibo.
- issue: Paksa ng mga pandiwa ng paglalaba at pagligo
  choice: Tukuyin bilang “ang taong nilinis”
  alternative: Panatilihin lamang ang malabong panghalip na “siya”
  rationale: Walang tahasang pangngalang paksa sa Hebreo, ngunit ipinakikita ng ritwal na pagkakasunod-sunod na ang taong pinarurumi at nilinis ang maglalaba, maliligo, at magiging malinis sa gabi. Nililinaw ito sa Tagalog nang hindi binabago ang kilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “malinis” at “marumi” ayon sa bokabularyo ng ritwal sa talata; ipinapaliwanag ng talababa na hindi pangunahing moral na paghuhusga ang tinutukoy.
