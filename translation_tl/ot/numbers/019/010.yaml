  source_fidelity: 'Tumpak ang salin sa pangunahing mga sangkap ng Hebreo: ang taong nagtitipon ng abo ng dumalagang baka, ang paglalaba ng kanyang mga damit, ang katayuang ritwal na marumi hanggang gabi, at ang panghabang-panahong tuntunin para sa mga anak ni Israel at sa dayuhang naninirahan sa gitna nila. Ang ayos ng pangungusap ay bahagyang inayos para sa natural na Tagalog ngunit walang nabagong kahulugan.'
