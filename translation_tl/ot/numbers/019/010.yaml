id: NUM.19.10
reference: Numbers 19:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: tl
  text: At ang nagtitipon ng abo ng dumalagang baka ay maglalaba ng kanyang mga damit, at magiging marumi siya hanggang gabi. Ito ay magiging tuntuning panghabang-panahon[b] para sa mga anak ni Israel[a] at para sa dayuhang naninirahan sa gitna nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita” o “sambayanan ng Israel.” Sa Hebreo, “mga anak ni Israel,” isang kolektibong katawagan para sa bayan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tuntuning permanente” o “tuntuning walang hanggan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹסֵף
  choice: ang nagtitipon
  rationale: Ang may pantukoy na Qal participle ay tumutukoy sa taong gumagawa ng pagtitipon. Likas sa modernong Tagalog ang “ang nagtitipon” at napapanatili nito ang anyong participyal.
- source_word: אֵפֶר הַפָּרָה
  choice: abo ng dumalagang baka
  rationale: Kolektibo ang אֵפֶר at natural na isinasalin bilang “abo.” Ang פָּרָה ay babaeng baka; ang “dumalagang baka” ang mas tiyak na katawagan sa konteksto ng ritwal.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: maglalaba ng kanyang mga damit
  rationale: Sa mga batas tungkol sa ritwal na kalinisan, tumutukoy ang pandiwa sa paglalaba o paghuhugas ng kasuotan. Malinaw at natural sa Tagalog ang napiling parirala.
- source_word: וְטָמֵא
  choice: at magiging marumi siya
  rationale: Tumutukoy ito sa katayuang ritwal, hindi sa moral na kasamaan. Pinananatili ng “marumi” ang karaniwang terminolohiya sa mga batas ng kalinisan nang hindi dinaragdagan ang kahulugan.
- source_word: עַד הָעָרֶב
  choice: hanggang gabi
  rationale: Ito ang natural at tumpak na katumbas ng hangganang panahong ipinahahayag ng Hebreo.
- source_word: וְהָיְתָה
  choice: Ito ay magiging
  rationale: Ang pambabaeng isahang pandiwa ay tumutukoy sa tuntunin o regulasyong nakapaloob sa naunang tagubilin. Nililinaw ng “Ito” ang tinutukoy nang hindi labis na nagpapaliwanag.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Pinananatili nito ang anyo at tipanang idyoma ng Hebreong “mga anak ni Israel,” habang malinaw na kolektibo ang tinutukoy.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: at para sa dayuhang naninirahan sa gitna nila
  rationale: Ang גֵּר ay isang hindi katutubong taong permanenteng naninirahan sa pamayanan. Ang “dayuhang naninirahan” ay malinaw sa kasalukuyang Tagalog, at ang “sa gitna nila” ay malapit sa Hebreong lokusyon.
- source_word: לְחֻקַּת עוֹלָם
  choice: tuntuning panghabang-panahon
  rationale: Ang חֻקָּה ay isang itinakdang tuntunin, at sa pormulang legal ang עוֹלָם ay nagpapahayag ng nagpapatuloy o permanenteng bisa. Natural at marangal sa Tagalog ang “panghabang-panahon.”
theological_decisions:
- issue: Pagsasalin ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanan ng Israel
  rationale: Pinananatili ng salin ang gramatikal at tipanang anyo ng Hebreo, ngunit hindi ipinahihiwatig na mga lalaking anak lamang ang saklaw; kolektibong katawagan ito para sa bayan.
- issue: Wika tungkol sa ritwal na karumihan
  choice: magiging marumi siya
  alternative: magiging di-malinis siya ayon sa ritwal
  rationale: Ang konteksto ay katayuang seremonyal o ritwal, hindi moral na pagkakasala. Pinanatili ang maikli at tradisyonal na “marumi” upang hindi magdagdag ng paliwanag sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig para sa tekstong legal at panritwal. Ginamit ang karaniwang “marumi” sa diwang ritwal, “dayuhang naninirahan” para sa residenteng hindi katutubo, at pinanatili ang tipanang idyomang “mga anak ni Israel.”
