base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: tl
  text: At para sa taong marumi ayon sa ritwal, kukuha sila ng kaunting alabok mula sa pagsusunog ng handog para sa paglilinis[a], at maglalagay siya ng tubig na buhay[b] sa ibabaw nito, sa isang sisidlan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na salin, “handog para sa kasalanan.” Ang Hebreong salita ay maaari ring tumukoy, lalo na sa mga tekstong pangritwal, sa handog na ginagamit para sa paglilinis.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tubig na buhay”; ibig sabihin, sariwa o umaagos na tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקְחוּ
  choice: kukuha sila
  rationale: Ang anyong pandiwa sa kontekstong legal ay naghahayag ng tagubilin; pinananatili ng parirala ang maramihang simuno.
- source_word: לַטָּמֵא
  choice: para sa taong marumi ayon sa ritwal
  rationale: Tinutukoy nito ang isang taong nasa kalagayan ng ritwal na karumihan, hindi isang pangkalahatang paghatol sa moralidad.
- source_word: מֵעֲפַר
  choice: ng kaunting alabok
  rationale: Ang עפר ay literal na alabok o pinong partikula, at ipinahihiwatig ng מן na bahagi lamang nito ang kukunin.
- source_word: שְׂרֵפַת הַחַטָּאת
  choice: mula sa sinunog na handog para sa paglilinis
  rationale: Natural ito sa modernong Tagalog at inilalarawan ang pinagmulan ng alabok; ang חטאת sa kontekstong ito ay handog na may tungkuling maglinis mula sa ritwal na karumihan.
- source_word: וְנָתַן
  choice: lalagyan
  rationale: Ang isahang pandiwa ay maaaring tumukoy sa di-tiyak na tagaganap pagkatapos ng maramihang pandiwa; hindi na kailangang magpasok ng tiyak na panibagong simuno sa Tagalog.
- source_word: עָלָיו
  choice: iyon
  rationale: Ang tinutukoy ay ang alabok na nabanggit, at ang konstruksyong 'lalagyan iyon ng' ay likas sa Tagalog.
- source_word: מַיִם חַיִּים
  choice: tubig na buhay
  rationale: Pinananatili ang literal at mahalagang larawang Hebreo, habang nililinaw sa talababa na sariwa o umaagos na tubig ang kahulugan sa ritwal.
- source_word: אֶל כֶּלִי
  choice: sa isang sisidlan
  rationale: Ipinahahayag nito ang paglalagay at kinalalagyan ng halo sa isang sisidlan nang may angkop na ritwal na rehistro.
theological_decisions:
- issue: Kahulugan ng חטאת sa konteksto ng ritwal na paglilinis
  choice: handog para sa paglilinis
  alternative: handog para sa kasalanan
  rationale: Ang talata ay tungkol sa pag-aalis ng ritwal na karumihan sa pamamagitan ng mga labi ng dumalagang baka. Ipinakikita ng pangunahing salin ang tungkulin ng handog ngunit pinananatili sa talababa ang tradisyonal at lehitimong alternatibo.
- issue: Paglalarawan sa taong טמא
  choice: marumi ayon sa ritwal
  alternative: marumi
  rationale: Nililinaw nito na ritwal na kalagayan ang tinutukoy at iniiwasang ipakahulugan agad bilang moral na kasamaan.
- issue: Idiomang מַיִם חַיִּים
  choice: tubig na buhay
  alternative: sariwa o umaagos na tubig
  rationale: Pinananatili ng literal na salin ang biblikal na larawan at posibleng ugnayang pampanitikan, samantalang ipinapaliwanag ng talababa ang konkretong kahulugan nito rito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “marumi ayon sa ritwal” upang maiwasan ang maling moral na pahiwatig, at “sisidlan” upang mapanatili ang tonong angkop sa batas pangritwal.
