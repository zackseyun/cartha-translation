base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: tl
  text: Pagkatapos, kukunin nila ang lahat ng kagamitang panlingkod na ginagamit nila sa santuwaryo, ilalagay ang mga ito sa telang asul, tatakpan ang mga ito ng panakip na yari sa pinong katad[a], at ilalagay ang mga ito sa ibabaw ng baras na pambuhat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang Hebreong תָּחַשׁ (tahash); maaaring tumukoy ito sa balat ng isang uri ng hayop o sa isang uri ng pino o matibay na katad.
    reason: lexical_alternative
  - marker: b
    text: O “sa ibabaw ng pingga.” Isahan ang “baras/pingga” sa Hebreo, ngunit maaaring tumukoy ito sa buong kagamitang pambuhat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Pagkatapos, kukunin nila
  rationale: Ang waw-consecutive at Qal na pandiwa ay bahagi ng sunod-sunod na tagubilin. Likas sa modernong Tagalog ang “Pagkatapos, kukunin nila” upang ipakita ang kasunod na hakbang.
- source_word: כָּל כְּלֵי הַשָּׁרֵת אֲשֶׁר יְשָׁרְתוּ בָם
  choice: ang lahat ng kagamitang ginagamit nila sa paglilingkod
  rationale: Ang כְּלִי ay mga kagamitan o kasangkapan, at ang שרת ay tumutukoy rito sa sagradong paglilingkod. Iniiwasan ng pagkakasaling ito ang mabigat na pag-uulit habang pinananatili ang gamit at tungkulin ng mga bagay.
- source_word: בַּקֹּדֶשׁ
  choice: sa santuwaryo
  rationale: Literal itong “sa banal [na lugar/bagay].” Sa konteksto, ang “santuwaryo” ay malinaw at hindi makitid na tumutukoy lamang sa pinakaloob na silid.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: isang telang asul
  rationale: Sa konteksto ng pagbabalot, mas angkop ang “tela” kaysa “damit.” Ang תְּכֵלֶת ay asul o bughaw-lilang tinina, ngunit “asul” ang malinaw at karaniwang katawagan.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: balot na pinong katad
  rationale: Hindi tiyak kung anong balat o uri ng katad ang תָּחַשׁ. Ang “pinong katad” ay natural at ipinapahiwatig ang de-kalidad na pananggalang, habang inilalahad sa talababa ang tunay na kawalang-katiyakan.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: at ipapatong sa pambuhat na balangkas
  rationale: Ang מוֹט ay maaaring maging pingga, baras, o kagamitang pambuhat. Ipinahahayag ng “pambuhat na balangkas” ang tungkulin nito at maayos na umaayon sa maramihang kagamitang inilalagay rito; pinananatili sa talababa ang literal na isahang anyo.
