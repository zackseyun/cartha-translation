translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong nagbibigay ng ritwal na tagubilin. Ginamit ang “santuwaryo” bilang pamilyar na katawagang panrelihiyon. Inayos ang mga marker upang ang [a] ay tumukoy sa hindi tiyak na תָּחַשׁ at ang [b] sa מוֹט, ayon sa kaukulang salitang pinapaliwanag ng bawat talababa.
