base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/047.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: tl
  text: mula sa tatlumpung taong gulang pataas hanggang sa limampung taong gulang—ang bawat pumapasok upang gampanan ang gawaing paglilingkod at ang gawaing pagbubuhat ng mga pasan[a] sa Tolda ng Tipanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang gawain ng paglilingkod at ang paglilingkod sa pagbubuhat ng mga pasan.” Inuulit sa Hebreo ang magkakaugnay na anyo ng iisang pangngalan upang magbigay-diin o mag-uri ng gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן ... וָמַעְלָה
  choice: mula tatlumpung taong gulang pataas
  rationale: Likas na Filipino ito para sa Hebreong idyomang nagtatakda ng pinakamababang edad, habang pinananatili ang larawan ng ‘pataas.’
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hanggang limampung taong gulang
  rationale: Malinaw at karaniwang paraan ito ng pagtukoy sa pinakamataas na edad sa saklaw.
- source_word: כָּל הַבָּא
  choice: ang bawat pumapasok
  rationale: Pinananatili nito ang substantibong participle na ‘bawat dumarating/pumapasok’ nang hindi ipinapalagay na ang ibig sabihin ay ‘kwalipikado’ o ‘itinalaga.’
- source_word: לַעֲבֹד
  choice: upang gampanan
  rationale: Ipinahahayag nito ang layunin ng pagpasok at iniiwasang pag-isahin ang pandiwa sa kasunod na inuulit na terminong עֲבֹדָה.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: ang gawaing paglilingkod
  rationale: Sinasalamin nito ang magkaugnay na mga anyo ng salitang Hebreo sa paraang malinaw at hindi pilit sa modernong Filipino.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: at ang gawaing pagbubuhat
  rationale: Ang מַשָּׂא ay tumutukoy sa pasan o kargang binubuhat; ipinahihiwatig na ito ng ‘pagbubuhat’ nang hindi kailangang magdagdag ng hindi tahasang pangngalan sa pangunahing teksto.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Toldang Tipanan
  rationale: Ito ang natural at kinikilalang katawagan sa Filipino para sa אֹהֶל מוֹעֵד; ang ‘sa’ ay angkop sa lugar o saklaw ng paglilingkod.
