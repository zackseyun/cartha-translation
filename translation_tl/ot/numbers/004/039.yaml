  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: tl
  text: Mula sa tatlumpung taong gulang pataas hanggang sa limampung taong gulang, lahat ng pumapasok sa nakatalagang paglilingkod upang gampanan ang gawain sa Toldang Tipanan—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: mula sa tatlumpung taong gulang pataas
  rationale: Natural na ipinapahayag sa modernong Tagalog ang panimulang edad habang pinananatili ang anyo ng saklaw sa Hebreo.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hanggang sa limampung taong gulang
  rationale: Malinaw na ipinapakita ang pinakamataas na edad ng saklaw.
- source_word: כָּל הַבָּא
  choice: ang bawat pumapasok
  rationale: Pinananatili ang diwa ng participle na בוא bilang pagpasok o paglahok sa itinakdang tungkulin.
- source_word: לַצָּבָא
  choice: sa pangkat ng paglilingkod
  rationale: Sa kontekstong Levitico, tumutukoy ang צבא sa organisadong pangkat na nakatalaga sa tungkulin, hindi sa hukbong militar; naiiwasan din nitong ipareho ang salita sa kasunod na עֲבֹדָה.
- source_word: לַעֲבֹדָה
  choice: upang gumawa
  rationale: Ipinahahayag ang layunin ng pagpasok sa organisadong paglilingkod at natural itong basahin sa Tagalog.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Toldang Tipanan
  rationale: Ang 'Toldang Tipanan' ay malinaw at dignified na katawagan sa אֹהֶל מוֹעֵד bilang santuwaryong kaugnay ng itinakdang pakikipagtagpo ng Diyos sa Israel.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang sintaktikong ugnayan ng talata sa mas malawak na pangungusap ng census, ngunit gumamit ng tuldok upang maging buo ang sipi kapag binasang mag-isa.
