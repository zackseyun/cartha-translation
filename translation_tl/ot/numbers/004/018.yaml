  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: tl
  text: Huwag ninyong pawiin ang lipi ng mga angkan ng mga Kehatita mula sa gitna ng mga Levita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Huwag ninyong putulin” o “lipulin ang lipi ng mga angkan ng mga Kehatita mula sa gitna ng mga Levita.” Ang pandiwang Hebreo ay maaaring mangahulugang “pawiin,” “putulin,” o “lipulin”; ang “mga angkan” ay maaari ring isaling “mga pamilya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Huwag ninyong
  rationale: Ipinahahayag nito ang malinaw na pagbabawal sa maramihang kausap sa natural na modernong Tagalog.
- source_word: תַּכְרִיתוּ
  choice: pawiin
  rationale: Ang Hiphil ng כרת ay maaaring mangahulugang ‘paputulin,’ ‘alisin,’ o ‘lipulin.’ Ang ‘pawiin’ ay nagpapanatili sa malawak na diwa ng pag-aalis o pagkalipol nang hindi tiyak na nililimitahan ang paraan.
- source_word: שֵׁבֶט
  choice: lipi
  rationale: Sa kontekstong genealogical, tumutukoy ito sa isang pangkat na nagmula sa iisang ninuno. Mas natural dito ang ‘lipi’ kaysa ‘tribo,’ yamang ang mga Kehatita ay isang sangay sa loob ng mga Levita.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Tumutukoy ito sa mga magkakaugnay na pangkat ng pamilya sa loob ng lipi; malinaw at angkop sa konteksto ang ‘mga angkan.’
- source_word: הַקְּהָתִי
  choice: mga Kehatita
  rationale: Bagaman anyong isahang pang-uri o gentiliko sa Hebreo, kolektibo ang tinutukoy; natural itong gawing maramihan sa Tagalog.
- source_word: מִתּוֹךְ
  choice: mula sa
  rationale: Ipinahahayag nito ang pag-aalis mula sa loob ng isang mas malaking pangkat. Ang ‘mula sa mga Levita’ ay maikli at natural, habang nananatili ang ugnayan ng dalawang pangkat.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat; kabilang sa mga Levita ang mga Kehatita.
theological_decisions:
- issue: Lakas at saklaw ng pagbabawal tungkol sa magiging kapalaran ng mga Kehatita
  choice: Panatilihing malawak ang utos bilang pagbabawal na pawiin ang kanilang lipi mula sa mga Levita.
  alternative: Isalin nang tahasan bilang ‘Huwag ninyong lipulin ang angkan ng mga Kehatita.’
  rationale: Hindi sinasabi ng talata mismo ang eksaktong paraan ng kanilang pagkawala, bagaman ipinapakita ng kasunod na konteksto na maaaring mamatay sila dahil sa maling paglapit sa mga banal na bagay. Hindi isinasara ng ‘pawiin’ ang pahayag sa iisang mekanismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘lipi’ at ‘mga angkan’ upang maipakita ang magkaibang antas ng pangkat-pangkanangkan, at iniwasan ang paliwanag sa pangunahing teksto kung paano maaaring mapawi ang mga Kehatita.
