  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: tl
  text: Ang mga anak ni Merari[a] ay bibilangin mo ayon sa kani-kanilang angkan, ayon sa sambahayan ng kanilang mga ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Merari” o “mga Merarita.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ayon sa sambahayan ng kanilang mga ama,” isang katawagang pangangkan para sa mga pangkat ng sambahayan na sinusundan sa linya ng ama.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: mga anak ni Merari
  rationale: Literal itong tumutukoy sa “mga anak ni Merari,” ngunit sa konteksto ng sensus ay saklaw nito ang mga lalaking inapo niya. Pinananatili ng salin ang anyong pampamilya ng Hebreo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa kontekstong pantribo at pansensus, ang מִשְׁפָּחָה ay isang pangkat ng magkakamag-anak sa loob ng lipi. Mas tiyak dito ang “angkan” kaysa sa pangkalahatang “pamilya.”
- source_word: לְבֵית אֲבֹתָם
  choice: sambahayan ng kanilang mga ninuno
  rationale: Ang parirala ay katawagang pangangkan para sa mga pangkat na inayos ayon sa linya ng mga ama. Natural sa modernong Tagalog ang “sambahayan ng kanilang mga ninuno,” habang ipinapaliwanag sa talababa ang literal at panlipunang diwa.
- source_word: תִּפְקֹד
  choice: bibilangin mo
  rationale: Ang פקד sa kontekstong ito ay nangangahulugang magsagawa ng sensus o magtala sa pamamagitan ng pagbibilang. Ang “bibilangin mo” ay malinaw, natural, at tumutugma sa anyong pautos ng Hebreo.
- source_word: אֹתָם
  choice: ang mga anak ni Merari (bilang layon ng pandiwa)
  rationale: Ang panghalip na tuwirang layon ay likas nang kinakatawan sa ayos na “Ang mga anak ni Merari ay bibilangin mo,” kaya hindi kailangan ang hiwalay na “sila.”
