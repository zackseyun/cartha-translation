  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang estrukturang pampamilya ng tekstong Hebreo, ngunit gumamit ng natural na “angkan” at “sambahayan ng kanilang mga ninuno” para madaling maunawaan ng karaniwang mambabasa.
