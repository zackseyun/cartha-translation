base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: tl
  text: 'Ngunit gawin ninyo ito para sa kanila upang mabuhay sila at hindi mamatay kapag lumalapit sila sa pinakabanal na mga bagay[a]: Papasok sina Aaron at ang kanyang mga anak at itatalaga nila ang bawat lalaki[b] sa kanyang gawain at sa kanyang kargang dadalhin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kabanal-banalang Lugar” o “pinakabanal na lugar.” Sa kontekstong ito, malamang na ang tinutukoy ay ang mga pinakabanal na kagamitan, hindi ang panloob na santuwaryo mismo.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “lalaki at lalaki,” isang paraang distributibo na nangangahulugang bawat lalaki ay itinalaga sa sarili niyang gawain at kargang dadalhin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: Ngunit gawin ninyo ito para sa kanila
  rationale: Ang וְזֹאת ay nagsisilbing panlipat tungo sa tagubiling kaiba sa naunang babala, at ang לָהֶם ay may diwang para sa kapakinabangan ng mga Kohatita.
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: upang mabuhay sila at hindi mamatay
  rationale: Ipinahahayag ng pagkakasunod ng mga pandiwa ang nilalayong bunga ng utos.
- source_word: בְּגִשְׁתָּם
  choice: kapag lumalapit sila
  rationale: Ang ב na kasama ng infinitive construct ay temporal dito, habang pinananatili ng “lumalapit” ang diwa ng paglapit sa banal na saklaw.
- source_word: אֶת קֹדֶשׁ הַקֳּדָשִׁים
  choice: sa pinakabanal na mga bagay
  rationale: Sa konteksto ng pagbabalot at pagbubuhat ng mga Kohatita, malamang na tumutukoy ito sa mga pinakabanal na kagamitan, bagaman maaaring basahin ang parirala bilang banal na lugar.
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: Papasok si Aaron at ang kanyang mga anak
  rationale: Ang maramihang pandiwa ay sumasaklaw kay Aaron at sa kanyang mga anak; ang “papasok” ay natural na nagpapahayag ng itinakdang kilos sa tagubiling legal.
- source_word: וְשָׂמוּ אוֹתָם
  choice: at itatalaga nila
  rationale: Sa kasunod na distributibong parirala, ang literal na “ilalagay nila sila” ay nangangahulugang aatasan o itatalaga ang bawat isa sa tiyak na tungkulin.
- source_word: אִישׁ אִישׁ
  choice: ang bawat lalaki
  rationale: Ang pag-uulit ay distributibo at tumutukoy sa bawat indibiduwal; pinanatili ang panlalaking tukoy sapagkat mga lalaking Levita ang tinutukoy.
- source_word: עַל עֲבֹדָתוֹ
  choice: sa kanyang gawain
  rationale: Ang עֲבֹדָה sa kontekstong Levitiko ay ang nakatalagang paglilingkod o tungkulin; malinaw at likas sa Filipino ang “gawain.”
- source_word: וְאֶל מַשָּׂאוֹ
  choice: at sa kanyang kargang dadalhin
  rationale: Ang מַשָּׂא ay konkretong kargang bubuhatin sa paglalakbay; iniiwasan ng pariralang ito ang posibleng purong matalinghagang kahulugan ng “pasanin.”
theological_decisions:
- issue: Tinutukoy ng קֹדֶשׁ הַקֳּדָשִׁים
  choice: pinakabanal na mga bagay
  alternative: Kabanal-banalang Lugar / pinakabanal na lugar
  rationale: Ang agarang konteksto ay ang paghawak at pagdadala ng mga sagradong kagamitan matapos balutin ng mga pari, kaya mas malamang ang kolektibong pagtukoy sa mga banal na bagay. Inilagay sa talababa ang tunay na posibilidad ng panlokasyong pagbasa.
- issue: Kasarian sa אִישׁ אִישׁ
  choice: bawat lalaki
  alternative: bawat isa
  rationale: Mga lalaking Levita ang tiyak na tinutukoy sa konteksto, kaya hindi ginawang neutral ang panlalaking anyo.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kargang dadalhin” upang maging konkreto ang tungkulin sa pagbubuhat, at pinanatili ang pormal na lakas ng tagubilin nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
