  terminology: Ang "tumupad sa tungkulin" at "gawin ang gawain" ay angkop na naghihiwalay sa organisadong tungkulin (צבא) at aktuwal na gawain (עבדה). Ang "tolda ng pagpupulong" ay tapat sa אֹהֶל מוֹעֵד. Inayos ang talababa upang maging mas likas ang paglalarawan ng metaporikal na wikang militar.
