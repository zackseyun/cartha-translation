base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: tl
  text: Mula sa tatlumpung taong gulang pataas hanggang sa limampung taong gulang, bilangin mo sila—ang bawat dumarating upang tumupad sa tungkulin[a], upang gawin ang gawain sa tolda ng pagpupulong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumanap sa nakatalagang paglilingkod.” Gumagamit dito ang Hebreo ng wika ng serbisyong militar bilang paglalarawan sa organisadong paglilingkod sa tolda.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: Mula sa tatlumpung taong gulang pataas hanggang sa limampung taong gulang
  rationale: Likas na ipinapahayag sa Filipino ang idyomang Hebreo bilang saklaw ng edad; pinananatili ng “pataas” ang וָמַעְלָה at ng “hanggang” ang pinakamataas na edad.
- source_word: תִּפְקֹד אֹתָם
  choice: bilangin mo sila
  rationale: Sa konteksto ng sensus at pagtatalaga ng mga Levita, ang פקד ay tumutukoy sa pagbibilang o pagtatala. Ang “bilangin” ay tuwiran at madaling maunawaan.
- source_word: כָּל הַבָּא
  choice: ang bawat pumapasok
  rationale: Ginagamit ang participle kasama ng כָּל upang tukuyin ang bawat taong kabilang at pumapasok sa gawaing itinakda.
- source_word: לִצְבֹא צָבָא
  choice: upang tumupad sa tungkulin
  rationale: Ang magkaugnay na pandiwa at pangngalan mula sa צבא ay nagpapahiwatig ng organisado at nakatalagang paglilingkod. Iniiwasan ng salin ang maling pahiwatig na literal na pakikidigma, habang pinananatili ang diwa ng pagganap sa tungkulin.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: at gawin ang gawain
  rationale: Ang magkaugnay na pandiwa at pangngalan ay tumutukoy sa aktuwal na pagsasagawa ng nakatalagang gawain. Natural sa Filipino ang “gawin ang gawain.”
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa tolda ng pagpupulong
  rationale: Ang מוֹעֵד ay tumutukoy sa itinakdang pagkikita o pagpupulong; malinaw at tuwiran itong naihahayag nang hindi ipinagpapalit sa salitang Hebreo para sa tipan.
theological_decisions:
- issue: Kung tahasang militar ang salin sa צבא
  choice: tumupad sa tungkulin
  alternative: maglingkod na parang kawal / gumanap ng serbisyong militar
  rationale: Bagaman maaaring militar ang צבא, ang konteksto ay ang organisadong paglilingkod ng mga Levita sa santuwaryo, hindi pakikipagdigma. Ang talababa ang nagpapanatili sa metaporikal na kulay ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda ng pagpupulong” upang ilapit ang salin sa kahulugan ng אֹהֶל מוֹעֵד at maiwasang ipakahulugan ang מוֹעֵד bilang “tipan.”
