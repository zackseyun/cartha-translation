base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/003.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: tl
  text: mula sa edad na tatlumpung taon pataas hanggang limampung taong gulang, ang lahat ng pumapasok[a] sa paglilingkod[b] upang gawin ang gawain sa tolda ng tipanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lumalapit.” Ang Hebreong participle ay maaaring mangahulugang “pumapasok” o, sa mas pangkalahatang diwa, “dumarating/lumalapit.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na צָבָא ay maaari ring mangahulugang “tungkulin,” “pangkat,” o “hukbo.” Dito, tumutukoy ito sa organisadong paglilingkod ng mga Levita.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: mula sa edad na tatlumpung taon pataas
  rationale: Ang בֶּן na may bilang ng mga taon ay idyomang Hebreo para sa edad. Likas sa modernong Tagalog ang “mula sa edad na tatlumpung taon pataas,” at malinaw nitong ipinapakita ang mababang hangganan ng saklaw.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hanggang limampung taong gulang
  rationale: Tuwirang ipinahahayag nito ang mataas na hangganan ng edad nang hindi dinaragdagan ang kahulugan ng Hebreo.
- source_word: כָּל בָּא
  choice: ang lahat ng pumapasok
  rationale: Pinananatili ng “pumapasok” ang diwa ng participle na בָּא at likas itong tumutukoy rito sa pagpasok sa itinakdang paglilingkod.
- source_word: לַצָּבָא
  choice: sa paglilingkod
  rationale: Bagaman maaaring tumukoy ang צָבָא sa hukbo, pangkat, o tungkulin, sa kontekstong ito ay organisadong paglilingkod ng mga Levita ang tinutukoy, hindi pakikidigma.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: upang gawin ang gawain
  rationale: 'Inilalahad ng pariralang pawatas ang layunin: ang pagsasagawa ng nakatalagang gawain. Malinaw at kongkreto ang saling ito.'
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa tolda ng tipanan
  rationale: Ang “tolda ng tipanan” ay malinaw at kinikilalang salin ng אֹהֶל מוֹעֵד; sapat ang “sa” upang saklawin ang gawaing kaugnay ng tolda at mga kagamitan nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tolda ng tipanan” bilang likas na katawagan sa santuwaryo, at iniwasan ang salitang militar sa pangunahing teksto habang pinananatili sa talababa ang mas malawak na saklaw ng צָבָא.
