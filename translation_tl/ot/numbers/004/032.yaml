translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong karugtong ng naunang talata sa pambungad na “at,” gayundin ang bahagyang siksik na pananalita ng huling pariralang Hebreo; ibinigay sa talababa ang mas malinaw at maluwag na pagbasa.
