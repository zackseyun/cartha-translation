base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: tl
  text: at ang mga haligi sa palibot ng patyo, kasama ang mga tuntungan nito, mga tulos nito, at mga lubid nito, ang lahat ng kagamitan nito, at lahat ng gawaing nauukol dito. Itatalaga ninyo ayon sa pangalan ang mga kagamitang pananagutan nilang dalhin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas maluwag: “Isa-isang itatalaga ninyo ang kagamitang pananagutan ng bawat isa na dalhin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: mga haligi sa palibot ng patyo
  rationale: Ang עַמּוּדִים ay mga haligi o poste, ang חָצֵר ay patyo, at ang סָבִיב ay tumutukoy sa pagkakalagay ng mga ito sa buong palibot. Likas at malinaw sa modernong Filipino ang pariralang ito.
- source_word: אַדְנֵיהֶם
  choice: mga patungan ng mga iyon
  rationale: Sa konteksto ng tabernakulo, ang אֶדֶן ay patungan o socket na kinasasalangan ng haligi. Mas madaling maunawaan ng karaniwang mambabasa ang “patungan.”
- source_word: יְתֵדֹתָם
  choice: mga tulos ng mga iyon
  rationale: Ang יָתֵד ay tulos o peg na ginagamit upang patibayin ang kayariang tulad ng tolda. Ang “tulos” ay natural at tiyak sa Filipino.
- source_word: מֵיתְרֵיהֶם
  choice: mga lubid ng mga iyon
  rationale: Ang מֵיתָר ay lubid o panaling ginagamit sa tolda. Ang “lubid” ang pinakakaraniwang modernong salita.
- source_word: לְכָל כְּלֵיהֶם
  choice: kasama ang lahat ng kagamitan
  rationale: Malawak ang saklaw ng כְּלִים at dito'y tumutukoy sa mga kasangkapang kaugnay ng mga haligi at patyo, kaya ang “kagamitan” ay angkop kaysa sa mas espesipikong “sisidlan.”
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: at lahat ng gawaing kaugnay ng mga iyon
  rationale: Ang עֲבֹדָה ay maaaring gawain, paglilingkod, o tungkulin. Ipinahahayag ng salin ang praktikal na gawaing nauukol sa mga kagamitang nabanggit nang hindi nagdaragdag ng makitid na interpretasyon.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: Itatalaga ninyo ayon sa pangalan
  rationale: Sa kontekstong ito, ang פקד kasama ng בְשֵׁמוֹת ay tumutukoy sa indibiduwal na pagtatalaga ng pananagutan, hindi lamang sa pagbibilang o pagtatala.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: ang mga kagamitan para sa tungkuling pasanin nila
  rationale: Pinananatili nito ang siksik na ugnayan ng כְּלֵי (mga kagamitan), מִשְׁמֶרֶת (tungkulin o pananagutan), at מַשָּׂא (pasan o dinadala), habang nananatiling mauunawaan sa Filipino.
