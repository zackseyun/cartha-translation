  naturalness: Kailangang ayusin ang huling sugnay upang maging malinaw at natural sa modernong Filipino. Ang “mga tuntungan nito” ay mas tiyak at mas likas kaysa “mga patungan ... ng mga iyon” sa ganitong talaan ng mga bahagi ng istruktura.
  terminology: Ang “haligi,” “patyo,” “tuntungan,” “tulos,” “lubid,” at “kagamitan” ay angkop. Ang “gawain” ay katanggap-tanggap para sa עֲבֹדָה sa kontekstong ito. Pinananatili ang “ayon sa pangalan,” na sumasalamin sa indibiduwal na pagtatalaga, at nililinaw ito sa talababa.
