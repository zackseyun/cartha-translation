  source_fidelity: 'Tumpak sa kabuuan ang pagsasalin ng pagkakasunod-sunod: matapos takpan ni Aaron at ng kanyang mga anak ang santuwaryo at mga kagamitan nito, saka darating ang mga anak ni Kohat upang magdala, nang hindi humihipo sa mga banal na bagay. Napananatili rin ang tuwirang bunga ng paghipo sa talababa. Gayunman, ang magkapatong na panandang oras na “Kapag ... sa oras na” ay nakapagpapalabo sa daloy ng dalawang temporal na sugnay sa Hebreo.'
  naturalness: Kailangan ng bahagyang rebisyon para maging mas likas at malinaw ang modernong Tagalog. Ang “kapag ... sa oras na aalis na” ay hindi makinis; mas malinaw ang “kapag ... at kapag umaalis ang kampo.” Ang “pagkatapos nito” ay mas malinaw kaysa “saka” sa pagtukoy sa tiyak na sunod-sunod na hakbang.
  terminology: Ang “santuwaryo,” “mga banal na bagay,” “mga anak ni Kohat,” “pasanin,” at “Tolda ng Pagtitipon” ay angkop at magkakatugma. Pinananatili ng mga talababa ang mahalagang ambigwidad ng הַקֹּדֶשׁ at ang mas tuwirang pagbasa ng וָמֵתוּ.
