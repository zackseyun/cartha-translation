revisions:
- from: Kapag natapos nang takpan ni Aaron at ng kaniyang mga anak ang santuwaryo at ang lahat ng kagamitan ng santuwaryo, sa oras na aalis na ang kampo, saka lalapit ang mga anak ni Kohat[c] upang buhatin ang mga iyon. Ngunit huwag nilang hipuin ang mga banal na bagay[a], upang hindi sila mamatay[b]. Ang mga ito ang pasanin ng mga anak ni Kohat sa Tolda ng Pagtitipon.
  to: Kapag natapos nang takpan ni Aaron at ng kaniyang mga anak ang santuwaryo at ang lahat ng kagamitan ng santuwaryo, at kapag umaalis ang kampo, pagkatapos nito ay darating ang mga anak ni Kohat[c] upang buhatin ang mga iyon. Ngunit hindi nila dapat hipuin ang mga banal na bagay[a], upang hindi sila mamatay[b]. Ang mga ito ang pasanin ng mga anak ni Kohat sa Tolda ng Pagtitipon.
  rationale: Inayos ang daloy ng dalawang temporal na sugnay upang malinaw na ang pagtatakip ay natatapos bago ang pag-alis ng kampo, at ang pagdating ng mga anak ni Kohat ay kasunod nito. Pinalitan ang “lalapit” ng “darating” upang huwag magdagdag ng tiyak na kahulugang wala sa pandiwang Hebreo. Hindi binago ang mga pangunahing terminong kultiko o ang mga talababa.
