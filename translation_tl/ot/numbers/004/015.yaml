id: NUM.4.15
reference: Numbers 4:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: tl
  text: Kapag natapos nang takpan ni Aaron at ng kaniyang mga anak ang santuwaryo at ang lahat ng kagamitan ng santuwaryo, at kapag umaalis ang kampo, pagkatapos nito ay darating ang mga anak ni Kohat[c] upang buhatin ang mga iyon. Ngunit hindi nila dapat hipuin ang mga banal na bagay[a], upang hindi sila mamatay[b]. Ang mga ito ang pasanin ng mga anak ni Kohat sa Tolda ng Pagtitipon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang santuwaryo.” Ang Hebreong “ang banal” ay maaaring tumukoy nang sama-sama sa mga sagradong bagay o, sa mas malawak na diwa, sa santuwaryo.
    reason: alternative_reading
  - marker: b
    text: 'Sa mas tuwirang salin ng Hebreo: “at mamamatay sila.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang mga Kohatita.” Literal na “ang mga anak ni Kohat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: natapos nang takpan
  rationale: Ipinahahayag ng pandiwang may kasunod na pawatas ang pagtatapos sa gawain ng pagtatakip; natural at malinaw ito sa makabagong Tagalog.
- source_word: הַקֹּדֶשׁ
  choice: ang santuwaryo
  rationale: Sa unang paglitaw, tumutukoy ito sa banal na dako na tinatakpan bago ilipat ang kampo; pinananatili ng “santuwaryo” ang kultikong diwa.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: ang lahat ng kagamitan ng santuwaryo
  rationale: Ang כְּלֵי ay mga kasangkapan, sisidlan, o kagamitang ginagamit sa paglilingkod; malawak at likas sa Tagalog ang “kagamitan.”
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: sa oras na aalis na ang kampo
  rationale: Ang parirala ay pananda ng oras ng paglalakbay o pag-alis ng kampo.
- source_word: וְאַחֲרֵי כֵן
  choice: saka
  rationale: Maikli at natural na ipinakikita ng “saka” ang mahigpit na pagkakasunod-sunod ng mga hakbang.
- source_word: בְנֵי קְהָת
  choice: ang mga anak ni Kohat
  rationale: Pinananatili ang literal na wikang pangangkan sa Hebreo sa halip na agad gawing pangalang-etniko.
- source_word: לָשֵׂאת
  choice: upang buhatin ang mga iyon
  rationale: Tumutukoy ang pawatas sa tungkulin nilang magdala; ang “mga iyon” ay tumutukoy sa mga kagamitang katatapos lamang takpan.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: Ngunit huwag nilang hipuin ang mga banal na bagay
  rationale: Sa konteksto ng paglilipat, malamang na ang tinutukoy ay ang mga sagradong bagay. Pinananatili sa talababa ang mas malawak na posibilidad na “santuwaryo.”
- source_word: וָמֵתוּ
  choice: upang hindi sila mamatay
  rationale: Natural na ipinahahayag sa Tagalog ang babala at layuning maiwasan ang kamatayan, habang itinatala sa talababa ang tuwirang anyo ng Hebreo.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: Ang mga ito ang pasanin ng mga anak ni Kohat
  rationale: Pinananatili ng “pasanin” ang kongkretong kahulugan ng kargang dapat buhatin, kasama ang pahiwatig ng nakatalagang tungkulin.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Tolda ng Pagtitipon
  rationale: Tuwirang ipinakikita ang toldang itinakda bilang dako ng pakikipagtagpo o pagtitipon, nang hindi ito ginagawang “tipanan,” na maaaring mapagkamalang covenant.
theological_decisions:
- issue: Ang tinutukoy ng הַקֹּדֶשׁ sa pagbabawal
  choice: mga banal na bagay
  alternative: ang santuwaryo
  rationale: Ang agarang konteksto ay ang mga kagamitang tinakpan upang buhatin. Gayunman, maaaring kolektibo o mas malawak ang Hebreo, kaya hindi inaalis ang alternatibong pagbasa at inilalagay ito sa talababa.
- issue: Ang ugnayan ng pagbabawal at kamatayan sa וָמֵתוּ
  choice: upang hindi sila mamatay
  alternative: at mamamatay sila
  rationale: Ipinahahayag ng pangunahing teksto ang puwersa ng babala sa natural na Tagalog; pinananatili sa talababa ang tuwirang pagkakasabi ng Hebreo bilang bunga.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “santuwaryo,” “pasanin,” at “Tolda ng Pagtitipon” upang mapanatili ang sagradong konteksto nang hindi maging lipas o labis na teknikal. Nakapaloob sa pangunahing teksto ang lahat ng panandang-talababa [a], [b], at [c].
