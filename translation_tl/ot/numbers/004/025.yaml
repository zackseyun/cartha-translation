source:
  edition: WLC
  text: וְ/נָ֨שְׂא֜וּ אֶת יְרִיעֹ֤ת הַ/מִּשְׁכָּן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד מִכְסֵ֕/הוּ וּ/מִכְסֵ֛ה הַ/תַּ֥חַשׁ אֲשֶׁר עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה וְ/אֶ֨ת מָסַ֔ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: tl
  text: Dadalhin nila ang mga tabing ng tabernakulo, ang toldang tipanan at ang takip nito, ang takip na yari sa balat ng tahash[a] na nasa ibabaw nito, at ang tabing sa pasukan ng toldang tipanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak kung anong materyal o balat ng hayop ang tinutukoy ng Hebreong תַּחַשׁ (tahash). Kabilang sa mga tradisyonal na salin ang “balat ng badger,” ngunit pinananatili rito ang salitang tahash upang hindi tukuyin nang walang katiyakan ang uri nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Dadalhin nila
  rationale: Sa konteksto ng paglilipat ng santuwaryo, ang נָשָׂא ay tumutukoy sa pagbubuhat at pagdadala. Likas at malinaw sa modernong Tagalog ang “dadalhin.”
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: mga tabing ng tabernakulo
  rationale: Ang יְרִיעוֹת ay mga malalapad na telang bumubuo o tumatakip sa estruktura. Pinananatili ng “tabernakulo” ang nakikilalang terminong ginagamit para sa מִשְׁכָּן sa kontekstong ito.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Pinananatili nito ang konkretong kahulugan ng אֹהֶל bilang tolda at ang tungkulin ng מוֹעֵד bilang itinakdang pakikipagtagpo, sa isang maikli at pamilyar na katawagan.
- source_word: מִכְסֵהוּ
  choice: ang takip nito
  rationale: Ang hulaping panghalip ay tumutukoy sa toldang tipanan. Hindi tinutukoy ng salin kung anong materyal ang unang takip, gaya rin ng Hebreo.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: ang takip na yari sa balat ng tahash
  rationale: Hindi tiyak ang tinutukoy ng תַּחַשׁ. Ang transliterasyong “tahash” ay hindi nagpapasya sa isang uri ng hayop o kalidad ng katad na hindi matiyak mula sa ebidensiya.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: na nasa ibabaw nito
  rationale: Malinaw na ipinahahayag nito ang posisyon ng takip bilang nasa ibabaw, nang hindi inuulit nang alanganin sa Tagalog ang dalawang magkalapit na panandang Hebreo para sa pagiging nasa itaas.
- source_word: מָסַךְ פֶּתַח
  choice: tabing sa pasukan
  rationale: Ang מָסָךְ ay nakasabit na telang nagsisilbing panakip o harang. Ang “tabing sa pasukan” ay natural at tumpak sa Tagalog.
