  register: Gumamit ng dignified ngunit tuwirang modernong Tagalog. Pinanatili ang mga nakikilalang katawagang “tabernakulo” at “toldang tipanan,” at inilagay ang pananda ng talababa kaagad pagkatapos ng hindi tiyak na materyal na tahash.
