  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בָ֨א אַהֲרֹ֤ן וּ/בָנָי/ו֙ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶ֔ה וְ/הוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַ/מָּסָ֑ךְ וְ/כִ֨סּוּ בָ֔/הּ אֵ֖ת אֲרֹ֥ן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: tl
  text: Kapag aalis na ang kampo, papasok si Aaron at ang kanyang mga anak. Ibababa nila ang tabing na pantakip at itatakip iyon sa kaban ng patotoo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas tradisyonal na tawag dito ang “kaban ng tipan.” Gayunman, “patotoo” ang literal na nasa Hebreo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: papasok
  rationale: Ang pandiwa ay literal na ‘darating/papasok.’ Sa konteksto ng paglapit sa santuwaryo upang ihanda ang mga banal na kagamitan, natural sa Filipino ang ‘papasok.’ Bagaman isahan ang anyo sa Hebreo, si Aaron at ang kanyang mga anak ang pinagsamang simuno, at maramihan ang kasunod na mga pandiwa.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: Kapag aalis na ang kampo
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng panahon. Ipinahihiwatig ng ‘aalis na’ ang pagsisimula ng paglalakbay o paglilipat ng kampo.
- source_word: וְהוֹרִדוּ
  choice: Ibababa nila
  rationale: Pangunahing diwa ng pandiwa ang pagpapababa. Sa konteksto, tumutukoy ito sa pagtanggal ng tabing mula sa pagkakasabit nito bilang bahagi ng paghahanda sa paglalakbay.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: ang tabing na pantakip
  rationale: Ang פָּרֹכֶת ay tabing ng santuwaryo, samantalang ang הַמָּסָךְ ay may diwang pantakip o harang. Pinananatili ng parirala ang dalawang sangkap nang hindi nagiging artipisyal sa modernong Tagalog.
- source_word: וְכִסּוּ בָהּ
  choice: at itatakip iyon
  rationale: Ang כסה ay ‘takpan,’ at ang pambabaeng panghalip ay tumutukoy sa tabing. Ang ‘itatakip iyon’ ay malinaw at likas na pagpapahayag ng gamit nito bilang pantakip.
- source_word: אֲרֹן הָעֵדֻת
  choice: kaban ng patotoo
  rationale: Tahasang עֵדוּת, ‘patotoo,’ ang nasa Hebreo, hindi בְּרִית, ‘tipan.’ Kaya pinananatili ang ‘patotoo’ sa halip na palitan ito ng nakaugaliang ‘kaban ng tipan.’
theological_decisions:
- issue: Tradisyonal na pagpapakahulugan sa אֲרֹן הָעֵדֻת
  choice: kaban ng patotoo
  alternative: kaban ng tipan
  rationale: Pinananatili ang aktuwal na salitang עֵדוּת (‘patotoo’) sa tekstong Hebreo at hindi ipinapalit ang kaugnay ngunit ibang katawagang ‘tipan.’
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘kaban’ at ‘tabing’ bilang pamilyar na bokabularyong biblikal, habang iniwasan ang labis na makaluma o teknikal na ayos.
