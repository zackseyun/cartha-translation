  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: tl
  text: At sa ibabaw ng hapag ng Presensya[a] ay ilalatag nila ang isang telang asul. Ilalagay nila rito ang mga pinggan, mga tasa, mga mangkok, at mga pitsel para sa handog na inumin; at ang palagiang tinapay[b] ay nasa ibabaw nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na tinatawag itong “hapag ng tinapay na handog.” Mas literal sa Hebreo ang “hapag ng Presensya.”
    reason: alternative_reading
  - marker: b
    text: O “tinapay na laging naroon.” Ito ang tinapay na palagiang inilalagay sa hapag sa harap ng PANGINOON.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: hapag ng Presensya
  rationale: Pinananatili nito ang literal na diwa ng Hebreong 'hapag ng mukha/presensya' at ang natatanging gamit nito sa santuwaryo, nang hindi agad pinapalitan ng interpretibong tradisyonal na pangalan.
- source_word: יִפְרְשׂוּ
  choice: ilalatag nila
  rationale: Likas na Filipino para sa paglalatag ng tela sa ibabaw ng isang bagay.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: isang telang asul
  rationale: Malinaw at natural, habang hindi labis na tinutukoy ang eksaktong bughaw-lilang kulay ng teknikal na terminong Hebreo.
- source_word: הַקְּעָרֹת
  choice: mga pinggan
  rationale: Angkop sa mga patag na kagamitang panghain na kabilang sa mga kagamitan ng hapag.
- source_word: הַכַּפֹּת
  choice: mga kopa
  rationale: Nauunawaan bilang maliliit na sisidlan sa hapag at hindi labis na nagtatakda ng hugis.
- source_word: הַמְּנַקִּיֹּת
  choice: mga mangkok
  rationale: Natural na katawagan sa Filipino para sa sisidlang panghapag; iniiwasan ang lipas o labis na tiyak na katawagan.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: mga pitsel para sa handog na inumin
  rationale: Ipinahihiwatig ang mga sisidlang ginagamit sa pagbuhos at malinaw na pinananatili ang ritwal na gamit ng נֶסֶךְ.
- source_word: לֶחֶם הַתָּמִיד
  choice: tinapay na palagian
  rationale: Pinananatili ang ideya ng tinapay na laging nakatalaga at naroon, sa halip na gawing karaniwang tinapay lamang.
- source_word: עָלָיו יִהְיֶה
  choice: ay mananatili roon
  rationale: Sa konteksto ng pag-aayos at pagbabalot para sa paglalakbay, natural nitong ipinahahayag na ang tinapay ay patuloy na nasa hapag; ang simpleng pandiwang 'maging' sa Hebreo ay may ganitong kontekstuwal na puwersa rito.
theological_decisions:
- issue: Kahulugan ng 'hapag ng Presensya'
  choice: Pinanatili ang Hebreong idyoma bilang 'hapag ng Presensya.'
  alternative: hapag ng tinapay na handog
  rationale: Hindi tahasang tinutukoy ng parirala ang tinapay; ang mas literal na anyo ay nagpapanatili ng kultikong diwa at hindi isinasara ang kahulugan sa isang paliwanag lamang.
- issue: Pagpapatuloy ng tinapay sa hapag
  choice: tinapay na palagian ... mananatili roon
  alternative: karaniwang tinapay ... ay naroon
  rationale: Ang תָּמִיד ay tumutukoy sa tuloy-tuloy o palagiang katayuan sa harap ng PANGINOON, hindi sa pagiging ordinaryo ng tinapay.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “hapag” para sa kultikong kasangkapan, “kopa” at “pitsel” bilang pamilyar ngunit angkop na mga katawagan, at “palagian” upang mapanatili ang teknikal na diwa ng תָּמִיד.
