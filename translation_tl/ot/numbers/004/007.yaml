  to: At sa ibabaw ng hapag ng Presensya[a] ay ilalatag nila ang isang telang asul. Ilalagay nila rito ang mga pinggan, mga tasa, mga mangkok, at mga pitsel para sa handog na inumin; at ang palagiang tinapay[b] ay nasa ibabaw nito.
