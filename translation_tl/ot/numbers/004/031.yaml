revisions:
- from: 'At ito ang tungkulin[a] nila sa pagbubuhat bilang bahagi ng lahat ng paglilingkod nila sa Toldang Tipanan: ang mga balangkas[b] ng tabernakulo, ang mga pahalang na biga nito, ang mga haligi nito, at ang mga patungan[c] nito.'
  to: 'At ito ang tungkulin[a] nila sa pagbubuhat sa lahat ng kanilang paglilingkod sa Toldang Tipanan: ang mga balangkas[b] ng tabernakulo, ang mga baras nito, ang mga haligi nito, at ang mga salalayan[c] nito.'
  rationale: Inalis ang interpretibong “bilang bahagi ng” upang masundan ang saklaw ng Hebreo nang hindi dinaragdagan ang kahulugan. Pinalitan ang “pahalang na biga” ng mas malawak at tumpak na “mga baras,” at ang “mga patungan” ng “mga salalayan” para sa mga base. Napanatili ang pagkakaiba ng Toldang Tipanan at tabernakulo, pati ang mga umiiral na talababa at ang mga angkla nito.
