  text: וְ/זֹאת֙ מִשְׁמֶ֣רֶת מַשָּׂאָ֔/ם לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמּוּדָ֥י/ו וַ/אֲדָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: tl
  text: 'At ito ang tungkulin[a] nila sa pagbubuhat sa lahat ng kanilang paglilingkod sa Toldang Tipanan: ang mga balangkas[b] ng tabernakulo, ang mga baras nito, ang mga haligi nito, at ang mga salalayan[c] nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pananagutang iniatas.”
    reason: Pinananatili ang alternatibong diwa ng מִשְׁמֶרֶת bilang isang tiyak na atas o responsibilidad.
  - marker: b
    text: O “mga tabla ng tabernakulo.” Ang salitang Hebreo ay maaaring tumukoy sa mga tabla o piyesang kahoy na nagsisilbing balangkas ng estruktura.
    reason: Ipinakikita ang mas literal na anyo ng terminong pangkonstruksiyon habang pinananatili sa teksto ang diin sa gamit nito.
  - marker: c
    text: O “mga suksukan.” Ito ang mga piyesang base na pinagsasalpakan ng mga balangkas o haligi.
    reason: Ibinibigay ang mas teknikal na kahulugan ng אֲדָנִים.
lexical_decisions:
- source_word: וְזֹאת
  choice: At ito ang
  rationale: Pinananatili nito ang pang-ugnay at ang paraang ginagamit ng Hebreo sa pagpapakilala ng kasunod na tiyak na talaan.
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: tungkulin nila sa pagbubuhat
  rationale: Ipinahahayag ng parirala ang iniatas nilang pananagutan, partikular ang mga bagay na kailangan nilang buhatin o dalhin. Mas natural ito sa Filipino kaysa sa literal na ‘tungkulin ng kanilang pasan.’
- source_word: לְכָל עֲבֹדָתָם
  choice: bilang bahagi ng lahat ng paglilingkod nila
  rationale: Nililinaw ng ‘bilang bahagi’ ang ugnayan ng atas na pagbubuhat sa kabuuan ng kanilang paglilingkod nang hindi dinaragdagan ang saklaw nito.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Toldang Tipanan
  rationale: Ginagamit ang pamilyar at marangal na katawagan sa santuwaryo, bilang lugar ng itinakdang pakikipagtagpo.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: mga balangkas ng tabernakulo
  rationale: Ang mga tinutukoy ay mga bahaging kahoy na bumubuo at sumusuporta sa estruktura. Ipinapakita ng ‘balangkas’ ang gamit ng mga ito, samantalang inilalahad sa talababa ang mas literal na ‘mga tabla.’
- source_word: וּבְרִיחָיו
  choice: mga pahalang na biga nito
  rationale: Ang mga ito ay mga baras o bigang nagdurugtong at nagpapatatag sa mga balangkas. Mas malinaw sa karaniwang mambabasa ang ‘pahalang na biga’ kaysa sa payak na ‘mga baras.’
- source_word: וְעַמּוּדָיו
  choice: mga haligi nito
  rationale: Tumpak at natural na tawag ito sa mga patayong suporta ng estruktura.
- source_word: וַאֲדָנָיו
  choice: mga patungan nito
  rationale: Tumutukoy ito sa mga piyesang pundasyon na kinakapitan o pinagsasalpakan ng balangkas at mga haligi. Nauunawaan ang ‘patungan’ nang hindi gumagamit ng labis na teknikal na salita.
