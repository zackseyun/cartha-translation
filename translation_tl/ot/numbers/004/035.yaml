base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: tl
  text: mula tatlumpung taong gulang pataas hanggang limampung taong gulang—ang lahat ng pumapasok[a] sa paglilingkod[b] upang gawin ang gawain sa Tolda ng Pagpupulong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumarating” o “sumasali.”
    reason: Pinahihintulutan ng participle na הַבָּא ang literal na diwang “dumarating/pumapasok,” ngunit sa konteksto maaari rin itong tumukoy sa pagsali sa tungkulin.
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “nakatalagang tungkulin” o organisadong paglilingkod.
    reason: Ang צָבָא ay kadalasang may kaugnayan sa hukbo o organisadong pangkat, ngunit dito ay tumutukoy sa maayos na inatasang paglilingkod ng mga Levita.
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: mula tatlumpung taong gulang pataas
  rationale: Likas na Filipino para sa idyomang nagsasaad ng panimulang edad, habang pinananatili ang diwa ng וָמַעְלָה na “pataas.”
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hanggang limampung taong gulang
  rationale: Malinaw na ipinapahayag ang pinakamataas na edad na saklaw ng עַד.
- source_word: כָּל הַבָּא
  choice: ang lahat ng pumapasok
  rationale: Pinananatili ang participial na diwa ng בוא at hindi labis na tinutukoy kung pisikal na pagpasok o pagsali sa tungkulin ang ibig sabihin.
- source_word: לַצָּבָא
  choice: sa paglilingkod
  rationale: Sa konteksto ng mga Levita, tumutukoy ang צָבָא sa organisado at nakatalagang paglilingkod, hindi kinakailangang sa hukbo o pakikidigma.
- source_word: לַעֲבֹדָה
  choice: upang gawin ang gawain
  rationale: Ibinubukod nito ang aktuwal na gawain mula sa naunang konsepto ng pagpasok sa nakatalagang paglilingkod, at iniiwasan ang terminong may makabagong denominasyonal na kulay.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Tolda ng Pagpupulong
  rationale: Tuwirang inilalarawan ang אֹהֶל מוֹעֵד bilang toldang inilaan para sa pakikipagtagpo o pagpupulong; ang “sa” ay natural para sa saklaw o lugar ng gawain.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyo ng talaan at ang bahagyang pag-uulit ng “paglilingkod” at “gawain” upang maipakita ang pagkakaiba ng צָבָא at עֲבֹדָה. Ginamit ang em dash upang likas na iugnay ang saklaw ng edad sa mga taong binibilang.
