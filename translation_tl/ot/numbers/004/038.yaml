  text: 'At ang mga nabilang sa mga anak ni Gershon, ayon sa kanilang mga angkan at mga sambahayan ng kanilang mga ama:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: At ang mga nabilang
  rationale: Pinananatili ang diwang pasibo ng salitang tumutukoy sa mga isinama sa opisyal na pagbilang; hindi kailangang idagdag ang “mga lalaki” sa talatang ito, yamang wala itong tahasang katumbas dito.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: sa mga anak ni Gershon
  rationale: Tuwirang salin ng pariralang genealogical, gamit ang nakasanayang anyo ng pangalang Gershon.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Ang מִשְׁפָּחוֹת ay tumutukoy sa mga pangkat na kamag-anak o angkan, at ang לְ ay likas na isinalin bilang “ayon sa” sa konteksto ng pag-uuri.
- source_word: וּלְבֵית אֲבֹתָם
  choice: at mga sambahayan ng kanilang mga ninuno
  rationale: Ipinapahayag ang Hebreong institusyong panlipunan na “bahay ng mga ama” sa malinaw at dignified na modernong Tagalog nang hindi nililimitahan sa isang pisikal na bahay.
