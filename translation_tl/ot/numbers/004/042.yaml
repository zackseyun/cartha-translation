  naturalness: Natural at marangal ang pangkalahatang rehistro. Mas malinaw at mas malapit sa paralelong estruktura ng Hebreo ang pag-uulit ng “ayon sa,” at mas natural dito ang “mga sambahayan ng kanilang mga ninuno.”
  terminology: Ang “mga lalaking nabilang,” “mga angkan,” at “mga anak ni Merari” ay angkop sa konteksto ng sensus at sa tradisyonal na katawagan. Ang “mga sambahayan ng kanilang mga ninuno” ay maingat na pagsasalin ng “bahay ng kanilang mga ama” bilang yunit ng angkan, hindi pisikal na bahay.
