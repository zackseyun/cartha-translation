  text: 'And the numbered men of the clans of the sons of Merari, by their clans, by their fathers'' houses:'
translation:
  language: tl
  text: 'At ang mga lalaking nabilang sa mga angkan ng mga anak ni Merari, ayon sa kani-kanilang mga angkan, ayon sa mga sambahayan ng kanilang mga ninuno:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: At ang mga lalaking nabilang
  rationale: Sa konteksto ng sensus sa Bilang 4, ang anyong ito ay tumutukoy sa mga lalaking naitala o nabilang; tahasang binanggit ang 'mga lalaki' upang maging malinaw at natural sa Filipino.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: mula sa mga angkan ng mga anak ni Merari
  rationale: Pinananatili ang 'mga anak ni Merari' bilang katawagan sa pangkat na nagmula kay Merari, at ang מִשְׁפְּחֹת bilang 'mga angkan.'
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinapahayag ng לְ ang pag-uuri o pagtatala ayon sa mga angkan; natural sa modernong Filipino ang 'kani-kanilang.'
- source_word: לְבֵית אֲבֹתָם
  choice: at sambahayan ng kanilang mga ninuno
  rationale: Ang literal na 'bahay ng kanilang mga ama' ay isang yunit ng angkan; ang 'sambahayan ng kanilang mga ninuno' ay malinaw, marangal, at hindi nalilito sa pisikal na bahay.
