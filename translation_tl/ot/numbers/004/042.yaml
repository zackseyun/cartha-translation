    rationale: Ang Hebreo ay nag-uugnay sa “mga nabilang” sa “mga angkan” sa pamamagitan ng genitibo, hindi pangunahing bilang paglabas o pagpili “mula sa” mga angkan. Ang “sa mga angkan” ay mas tuwiran.
  - severity: low
