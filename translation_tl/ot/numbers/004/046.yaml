base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: tl
  text: Ang lahat ng nabilang[a] sa mga Levita, na binilang nina Moises, Aaron, at ng mga pinuno ng Israel, ayon sa kani-kanilang angkan at sambahayan ng kanilang mga ama[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “lahat ng naitala” o “lahat ng naisama sa sensus.” Ginagamit sa Hebreo ang pandiwang פקד, na rito ay tumutukoy sa opisyal na pagbilang o pagtatala.
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan ng kanilang mga ama” ay tumutukoy sa mga sambahayan o pangkat ng pamilya batay sa linya ng ama sa loob ng angkan.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Ang lahat ng nabilang
  rationale: Ipinapahayag ng כָּל ang kabuuan ng pangkat, at ang passive participle na הַפְּקֻדִים ay tumutukoy sa mga opisyal na nabilang sa sensus.
- source_word: פָּקַד
  choice: binilang
  rationale: Sa konteksto ng Bilang 4, tumutukoy ang pandiwa sa opisyal na pagbilang o pagtatala; natural at malinaw sa modernong Tagalog ang “binilang.”
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: at ng mga pinuno ng Israel
  rationale: Ang נְשִׂיאִים ay mga pinuno ng mga lipi; iniiwasan ng “mga pinuno” ang makalumang o maling pahiwatig ng “mga prinsipe.”
- source_word: אֶת הַלְוִיִּם
  choice: mula sa mga Levita
  rationale: Minamarkahan ng אֶת ang mga Levita bilang pangkat na pinagbuhatan ng mga nabilang. Ang “mula sa” ay likas sa Tagalog at hindi nagpapahiwatig na may mga nabilang na hindi Levita.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה rito ay isang pangkat ng magkakamag-anak sa loob ng lipi; mas angkop ang “angkan” kaysa sa malawak na “pamilya.”
- source_word: וּלְבֵית אֲבֹתָם
  choice: at sambahayan ng kanilang mga ninuno
  rationale: Ang בֵּית אָבוֹת ay yunit ng pagkakamag-anak o sambahayang mula sa linya ng mga ama. Inililipat ng “sambahayan ng kanilang mga ninuno” ang kahulugang pang-organisasyon nang hindi ipinapalagay na literal na gusali lamang.
