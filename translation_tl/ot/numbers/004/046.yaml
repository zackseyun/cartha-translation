translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang anyong bitin ng pangungusap sa hulihan sapagkat nagpapatuloy ang buod sa kasunod na talata. Ginamit ang mga gitling upang maging malinaw ang mahabang sugnay nang hindi binabago ang sintaks na buod.
