    rationale: Ang בֵּית אֲבֹתָם ay literal na ‘bahay/sambahayan ng kanilang mga ama’ at isang kinikilalang yunit ng angkan; ang “mga ninuno” ay mas malawak at hindi gaanong tiyak.
