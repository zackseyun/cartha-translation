revisions:
- from: Ang lahat ng paglilingkod ng mga Gershonita ay gagawin ayon sa utos ni Aaron at ng kanyang mga anak[a], para sa lahat ng dadalhin nila at sa lahat ng kanilang gawain. Itatalaga ninyo sa kanila bilang pananagutan[b] ang lahat ng dadalhin nila.
  to: Ang buong paglilingkod ng mga Gershonita ay isasagawa ayon sa utos ni Aaron at ng kanyang mga anak[a], sa lahat ng kanilang dala at sa lahat ng kanilang gawain. Itatalaga ninyo sa kanila, bilang pananagutan[b], ang lahat ng kanilang dala.
  rationale: The revision improves Tagalog idiom and more clearly expresses the Hebrew scope construction, while preserving the verse’s repeated reference to the Gershonites’ loads, Aaronic authority, plural addressees, and assigned responsibility. No doctrinal interpretation has been added.
