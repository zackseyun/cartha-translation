base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: tl
  text: Ang buong paglilingkod ng mga Gershonita ay isasagawa ayon sa utos ni Aaron at ng kanyang mga anak[a], sa lahat ng kanilang dala at sa lahat ng kanilang gawain. Itatalaga ninyo sa kanila, bilang pananagutan[b], ang lahat ng kanilang dala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa bibig ni Aaron at ng kanyang mga anak.” Ang idyomang Hebreo ay nangangahulugang ayon sa kanilang utos o tagubilin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bilang tungkuling ipinagkatiwala sa kanila.” Ang salitang Hebreo ay maaaring tumukoy sa iniatas na pananagutan o obligasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: ayon sa utos
  rationale: Ang idyoma ay literal na “ayon sa bibig” ngunit karaniwang tumutukoy sa pagsunod sa utos o tagubilin ng isang may awtoridad. Natural at malinaw sa modernong Tagalog ang “ayon sa utos.”
- source_word: כָּל עֲבֹדַת
  choice: ang lahat ng paglilingkod
  rationale: Sa konteksto ng tabernakulo, ang עֲבֹדָה ay tumutukoy sa itinakdang paglilingkod o gawain. Pinananatili ng “paglilingkod” ang kaugnayan nito sa banal na tungkulin nang hindi nililimitahan sa seremonyang panrelihiyon lamang.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: mga Gershonita
  rationale: Literal itong tumutukoy sa mga anak o kaanak ng Gershonita. Ang “mga Gershonita” ang natural na katawagan sa modernong Tagalog para sa angkang nagmula kay Gershon.
- source_word: לְכָל מַשָּׂאָם
  choice: para sa lahat ng dadalhin nila
  rationale: Ang מַשָּׂא rito ay konkretong tumutukoy sa mga bagay na kanilang bubuhatin o dadalhin sa paglilipat ng tabernakulo. Iniiwasan ng pariralang ito ang posibleng matalinghagang dating ng “pasanin.”
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: at sa lahat ng kanilang gawain
  rationale: Ipinakikita ng parirala ang buong saklaw ng pangangasiwa nina Aaron. Ginamit ang “gawain” upang maging natural ang pangungusap habang nananatili ang diwa ng itinakdang serbisyo.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: Itatalaga ninyo sa kanila
  rationale: Sa konstruksiyong ito, ang פקד ay nangangahulugang magtalaga o magbigay ng responsibilidad. Ang kasunod na tuwirang layon ay ang lahat ng kanilang dadalhin.
- source_word: בְּמִשְׁמֶרֶת
  choice: bilang pananagutan
  rationale: Maaaring tumukoy ang מִשְׁמֶרֶת sa isang ipinagkatiwalang tungkulin, responsibilidad, o bagay na dapat ingatan. Malinaw sa kasalukuyang Tagalog ang “bilang pananagutan.”
- source_word: אֵת כָּל מַשָּׂאָם
  choice: ang lahat ng dadalhin nila
  rationale: Pinananatili ang pag-uulit sa Hebreo at ang konkretong diwa ng mga bagay na nakatalaga sa kanila upang dalhin.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Isinalin ang katawagang pang-angkan bilang “mga Gershonita,” at ginawang konkretong “lahat ng dadalhin nila” ang mga kargang kaugnay ng paglilipat ng tabernakulo. Pinanatili ang maramihang “ninyo” ng pandiwang Hebreo at ang pag-uulit sa hulihan ng talata.
