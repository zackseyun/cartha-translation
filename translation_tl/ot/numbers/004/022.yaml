base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: tl
  text: Bilangin mo rin ang mga anak ni Gershon[a] ayon sa sambahayan ng kanilang mga ama at ayon sa kanilang mga angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Itaas mo ang ulo ng mga anak ni Gershon.” Isa itong idyomang nangangahulugang bilangin sila o magsagawa ng sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Bilangin
  rationale: Ang literal na “itaas ang ulo” ay isang idyomang Hebreo na sa kontekstong administratibo ay nangangahulugang magbilang o magsagawa ng sensus. Ang “Bilangin” ay natural at malinaw sa modernong Tagalog.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: ang mga anak ni Gershon
  rationale: Pinananatili nito ang tahasang anyong pangangkanan na “mga anak ni Gershon,” sa halip na gawing pangkat-etnikong katawagan.
- source_word: גַּם הֵם
  choice: rin
  rationale: Ipinahihiwatig nito na kasama rin ang mga anak ni Gershon sa pagbibilang na iniutos para sa naunang pangkat.
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa sambahayan ng kanilang mga ninuno
  rationale: Tumutukoy ito sa mga yunit ng angkan batay sa linya ng mga ama. Ang “mga ninuno” ay natural sa Tagalog habang pinananatili ang diwang pangangkanan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa konteksto ng sensus ng mga lipi, ang מִשְׁפָּחָה ay tumutukoy sa mas malawak na pangkat ng magkakamag-anak, hindi lamang sa makabagong nuklear na pamilya.
