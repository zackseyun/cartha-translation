  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: tl
  text: Ito ang mga nabilang sa mga angkan ng mga anak ni Merari, na binilang nina Moises at Aaron ayon sa utos ni Yahweh[a], sa pamamagitan ni Moises.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “ayon sa bibig ni Yahweh,” isang idyomang nangangahulugang “ayon sa utos ni Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “sa kamay ni Moises,” ibig sabihin, “sa pamamagitan ni Moises.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Ito ang mga nabilang
  rationale: Ipinakikilala nito ang pangwakas na tala ng sensus. Ang “mga nabilang” ay tuwirang tumutukoy sa mga naitala sa konteksto nang hindi nagdaragdag ng salitang wala sa parirala.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa kontekstong pantribo ng Israel, mas malinaw ang “angkan” kaysa “pamilya” para sa mas malawak na pangkat ng magkakamag-anak.
- source_word: בְּנֵי מְרָרִי
  choice: mga anak ni Merari
  rationale: Pinananatili ang tahasang pananalitang pagkakamag-anak sa Hebreo sa halip na gawing pangalang pangkat lamang.
- source_word: פָּקַד
  choice: binilang
  rationale: Ang pandiwa ay tumutukoy sa pagbibilang o pagtatala sa sensus at inuulit ang ugat ng פְקוּדֵי gaya sa Hebreo.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang literal na “ayon sa bibig ni Yahweh” ay isang idyomang nangangahulugang ayon sa kaniyang utos. Isinalin ang diwa sa pangunahing teksto at inilagay sa talababa ang literal na larawan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang kinakatawan ng Tetragrammaton, hindi isang pamalit na titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang “sa kamay ni Moises” ay idyoma ng ahensiya; likas sa modernong Tagalog ang “sa pamamagitan ni Moises,” habang pinananatili sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan sa halip na palitan ng titulo.
- issue: Ugnayan ng utos ni Yahweh at ng papel ni Moises
  choice: “ayon sa utos ni Yahweh, sa pamamagitan ni Moises”
  alternative: “ayon sa sinabi ni Yahweh kay Moises”
  rationale: Pinananatili ng napiling salin ang dalawang magkahiwalay na pariralang Hebreo at hindi ipinapalagay na si Moises lamang ang tuwirang pinatungkulan, bagaman siya ang tagapamagitan ng utos.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Ginamit ang “angkan” para sa pangkat ng magkakamag-anak at isinalin sa likas na Tagalog ang dalawang Hebreong idyoma, na may literal na anyo sa mga talababa.
