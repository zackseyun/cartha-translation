  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: tl
  text: Ilagay nila ito at ang lahat ng kagamitan nito sa loob ng isang pantakip na yari sa balat ng tahash[a], at ilagay nila ito sa ibabaw ng baras na pambuhat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na תַּחַשׁ (tahash). Maaaring tumukoy ito sa balat ng isang partikular na hayop o sa isang uri ng matibay na katad. Sa tradisyon, isinasalin din ito bilang balat ng isang hayop-dagat o sa iba pang katulad na paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ אֹתָהּ
  choice: Ilagay nila ito
  rationale: Ang waw + Qal perfect ay bahagi ng sunod-sunod na tagubiling pangpamamaraan. Ang panghalip na pambabae ay tumutukoy sa ilawan sa naunang talata, ngunit pinananatili rito ang likas na anaporikong “ito.”
- source_word: כָּל כֵּלֶיהָ
  choice: ang lahat ng kagamitan nito
  rationale: Malawak ang kahulugan ng כְּלִי at tumutukoy rito sa mga kasangkapang kaugnay ng ilawan; malinaw at likas sa modernong Filipino ang “kagamitan.”
- source_word: אֶל מִכְסֵה
  choice: sa loob ng isang balot
  rationale: Sa pagkakagamit pagkatapos ng נָתַן, ipinahihiwatig ng אֶל ang paglalagay sa loob o pagkukulong sa isang panakip. Nililinaw ng “sa loob ng” ang kilos nang hindi dinaragdagan ang diwa.
- source_word: עוֹר תַּחַשׁ
  choice: balat ng takas
  rationale: Hindi tiyak kung anong hayop o uri ng katad ang tinutukoy ng תַּחַשׁ. Pinanatili ang salitang Hebreo bilang “takas” sa halip na pumili ng haka-hakang uri ng hayop o magdagdag ng katangiang gaya ng “pino.”
- source_word: וְנָתְנוּ
  choice: at ilagay iyon
  rationale: Ang inulit na pandiwa ay nagpapakilala sa kasunod na hakbang. Ang “iyon” ay likas na tumutukoy sa ilawan at mga kagamitan nito na nakabalot na bilang isang yunit.
- source_word: עַל הַמּוֹט
  choice: sa balangkas na pambuhat
  rationale: Ang מוֹט ay isang patpat, pingga, o kagamitang pambuhat. Sa kontekstong ito, ang “balangkas na pambuhat” ay malinaw na naglalarawan sa sisidlang suporta para sa nakabalot na ilawan habang pinananatili ang isahang anyo ng Hebreo.
