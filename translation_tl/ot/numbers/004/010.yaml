  terminology: Pinananatili ang hindi tiyak na katawagang “tahash” at ipinaliliwanag sa talababa, kaya hindi ipinipilit ang isang pinagtatalunang pagkakakilanlan ng hayop. Ginamit ang “baras na pambuhat” para sa מוֹט, na isahan sa Hebreo.
