source:
  edition: WLC
  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: tl
  text: pati ang mga tabing ng bakuran, ang tabing sa bungad ng tarangkahan ng bakuran na nakapalibot sa tabernakulo at sa altar, ang mga lubid ng mga iyon[a], ang lahat ng kagamitan para sa kanilang paglilingkod, at ang lahat ng dapat gawin gamit ang mga iyon[b]; at maglilingkod sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tali” o “mga pisi.”
    reason: lexical_alternative
  - marker: b
    text: O “ang lahat ng dapat gawin para sa mga iyon.” Maaaring tumukoy ang Hebreo sa mga gawaing ginagawa gamit ang mga bagay na ito o sa mga gawaing ginagawa para sa mga ito bilang bahagi ng paglilingkod.
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: mga tabing
  rationale: Tumutukoy sa mga telang bumubuo sa nakapalibot na bakuran; natural at malinaw ang “mga tabing” sa modernong Tagalog.
- source_word: חָצֵר
  choice: bakuran
  rationale: Tumutukoy sa nakapaloob na panlabas na lugar ng tabernakulo; mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal na “looban.”
- source_word: מָסַךְ
  choice: tabing
  rationale: Isang telang nakatakip sa pasukan ang tinutukoy; ang “tabing” ay angkop sa gamit nito at hindi nagdaragdag ng materyal na wala sa teksto.
- source_word: פֶּתַח שַׁעַר
  choice: pasukan ng pintuang-daan
  rationale: Pinananatili ang bahagyang pag-uulit ng Hebreong parirala habang nananatiling malinaw sa Tagalog.
- source_word: מֵיתְרֵיהֶם
  choice: mga tali ng mga iyon
  rationale: Ang “tali” ay malinaw na tawag sa mga lubid o pisi na kaugnay ng mga tabing at ng tabing sa pasukan; nilagyan ng talababa ang leksikal na alternatibo.
- source_word: כְּלֵי עֲבֹדָתָם
  choice: lahat ng kagamitan para sa kanilang paglilingkod
  rationale: Saklaw ng כְּלִי ang iba’t ibang kagamitan, at pinananatili ng “paglilingkod” ang kahulugang gawain sa tabernakulo ng עֲבֹדָה.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: lahat ng dapat gawin gamit ang mga iyon
  rationale: Likas sa Tagalog at ipinahihiwatig ang mga gawaing isinasagawa sa paggamit o paghawak sa mga nabanggit na bagay, habang itinatala sa talababa ang posibleng kahulugang “para sa mga iyon.”
- source_word: וְעָבָדוּ
  choice: at maglilingkod sila
  rationale: Pinananatili ang pormal na diwa ng paglilingkod sa tungkuling kaugnay ng tabernakulo.
theological_decisions:
- issue: Saklaw ng אֲשֶׁר ... סָבִיב
  choice: Iniuugnay ang “nakapalibot sa tabernakulo at sa altar” sa bakuran.
  alternative: Maaaring ipalapit sa tabing ng pasukan ang sugnay na panlarawan.
  rationale: Sa konteksto, ang bakuran ang spatial na nakapalibot sa tabernakulo at altar; hindi nito binabago ang teolohikal na nilalaman kundi nililinaw ang natural na ugnayang pang-espasyo.
- issue: Kahulugan ng לָהֶם sa כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: gamit ang mga iyon
  alternative: para sa mga iyon
  rationale: Maaaring tumukoy ang parirala sa mga gawaing ginagawa sa pamamagitan ng mga bagay o para sa mga ito. Pinili sa teksto ang mas angkop sa konteksto ng paggamit sa kagamitan, ngunit pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tabernakulo” bilang tiyak na terminong biblikal, “bakuran” para sa panlabas na court, at “pintuang-daan” upang maipakita ang gate nang hindi nagiging labis na teknikal. Pinanatili ang ayos na tila pagpapatuloy ng naunang talata sa pamamagitan ng pambungad na “pati.”
