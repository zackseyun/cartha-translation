  source_fidelity: 'Tumpak na naihahatid ng salin ang Hebreong pahayag: ang paglilingkod ng mga angkan/angkaning kabilang sa mga anak ni Gershon sa Tolda ng Pagtitipon, at ang kanilang iniatas na tungkulin ay nasa pangangasiwa ni Itamar na anak ni Aaron na pari. Ang paghahati sa dalawang pangungusap ay hindi nakapagbabago sa ugnayan ng mga sugnay.'
