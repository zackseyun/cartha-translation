reference: Numbers 4:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹ֛ת בְּנֵ֥י הַ/גֵּרְשֻׁנִּ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד וּ/מִ֨שְׁמַרְתָּ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: tl
  text: Ito ang paglilingkod ng mga angkan ng mga anak ni Gershon sa Tolda ng Pagtitipon. Ang kanilang tungkulin[a] ay nasa ilalim ng pangangasiwa[b] ni Itamar, na anak ng paring si Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pananagutan” o “iniatas na gawain.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa kamay ni Itamar,” isang idyomang nangangahulugang nasa ilalim ng kaniyang pangangasiwa o awtoridad.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Ito ang paglilingkod
  rationale: Ipinakikilala ng demonstratibo ang itinakdang gawain; ang “paglilingkod” ay angkop sa gawaing kaugnay ng santuwaryo nang hindi nagdaragdag ng makabagong eklesiastikong kahulugan.
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: mga angkan ng mga anak ni Gershon
  rationale: Pinananatili ang diwa ng mga pangkat na batay sa angkan at ang tahasang pagbibigay-diin ng Hebreo sa angkan ni Gershon.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Tolda ng Pagtitipon
  rationale: Ang מוֹעֵד ay tumutukoy sa itinakdang pakikipagtagpo o pagtitipon; mas tuwirang salin ito kaysa “Tipanan,” na maaaring magpahiwatig ng בְּרִית.
- source_word: וּמִשְׁמַרְתָּם
  choice: Ang kanilang tungkulin
  rationale: Tumutukoy ang מִשְׁמֶרֶת sa iniatas na pananagutan o gawaing dapat tuparin. Likas at malinaw sa makabagong Filipino ang “tungkulin.”
- source_word: בְּיַד
  choice: nasa ilalim ng pangangasiwa
  rationale: Idyoma itong literal na “sa kamay ni” at nagpapahayag ng awtoridad o pangangasiwa; inihahatid ng salin ang kahulugan habang inilalagay sa talababa ang literal na larawan.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: ni Itamar, na anak ng paring si Aaron
  rationale: Pinananatili ang pangalan at ugnayang ama-anak, at nililinaw alinsunod sa sintaks ng Hebreo na ang “pari” ay tumutukoy kay Aaron.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tolda ng Pagtitipon” upang tumpak na katawanin ang אֹהֶל מוֹעֵד, at hinati sa dalawang pangungusap para sa likas na daloy nang hindi binabago ang ugnayan ng mga sugnay.
