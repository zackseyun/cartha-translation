  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: tl
  text: Ngunit hindi sila dapat pumasok upang tingnan ang mga banal na kagamitan kahit saglit[a]; kung hindi, mamamatay sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kahit sa isang iglap.” Idyomatiko at hindi tiyak ang pariralang Hebreo; maaari itong tumukoy sa panandaliang pagtingin sa mga banal na kagamitan o sa pagtingin habang tinatakpan ang mga iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Ngunit hindi
  rationale: Ipinagpapatuloy nito ang tagubilin bilang mahigpit na pagbabawal; likas sa Filipino ang “ngunit” bilang panandang pagsalungat sa naunang pahintulot o gawain.
- source_word: יָבֹאוּ
  choice: sila dapat pumasok
  rationale: Ang pandiwa ay nangangahulugang pumasok o lumapit sa loob; sa konteksto, ang negatibong anyo ay malinaw na pagbabawal.
- source_word: לִרְאוֹת
  choice: upang tingnan
  rationale: Mas naipahihiwatig ng “tingnan” kaysa “makita” ang sadyang pagharap ng paningin sa mga banal na kagamitan.
- source_word: כְבַלַּע
  choice: kahit saglit
  rationale: Mahirap at idyomatiko ang parirala. Ang “kahit saglit” ay nagpapanatili sa tradisyonal na pagkaunawang tumutukoy ito sa napakaikling sandali, habang inilalahad sa talababa ang posibleng pagtukoy sa oras ng pagtatakip.
- source_word: אֶת־הַקֹּדֶשׁ
  choice: ang mga banal na kagamitan
  rationale: Bagaman anyong isahan ang Hebreo, kolektibo itong tumutukoy sa mga sagradong kasangkapang binanggit sa konteksto. Nililinaw ng “kagamitan” ang konkretong tinutukoy nang hindi ito ginagawang lugar.
- source_word: וָמֵתוּ
  choice: kung hindi, mamamatay sila
  rationale: Inihahayag ng sugnay ang nakamamatay na bunga ng pagsuway; natural at tuwiran ang babalang ito sa modernong Filipino.
theological_decisions:
- issue: Tinutukoy ng הַקֹּדֶשׁ
  choice: kolektibong tumutukoy sa mga banal na kagamitan
  alternative: ang santuwaryo, o ang banal na bagay sa mas abstraktong diwa
  rationale: Ang agarang konteksto ay ang pagtatakip at pagdadala sa mga kasangkapan ng tabernakulo, kaya mas angkop ang konkretong kolektibong pakahulugan.
- issue: Kahulugan ng כְבַלַּע
  choice: kahit saglit
  alternative: habang tinatakpan ang mga banal na kagamitan
  rationale: Pinananatili sa pangunahing teksto ang idyomatikong pagkaunawa tungkol sa napakaikling pagtingin, ngunit hindi itinatago ang tunay na leksikal na kalabuan; inilalagay sa talababa ang isa pang posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga banal na kagamitan” upang maging natural at tiyak sa konteksto, at pinanatili sa talababa ang kalabuan ng mahirap na pariralang Hebreo.
