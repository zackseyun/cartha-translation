  source_fidelity: 'Tumpak ang salin sa pangunahing mga elemento ng Hebreo: ang mga nabilang na kabilang sa mga angkan ni Kohat, ang mga naglilingkod sa Toldang Tipanan, ang pagbibilang nina Moises at Aaron, at ang utos ni Yahweh na ipinahatid sa pamamagitan ni Moises. Ang “mga lalaking nabilang” ay suportado ng agarang konteksto ng sensus sa Bilang 4, bagaman hindi tahasang inuulit ng mismong talata ang salitang “lalaki.”'
  naturalness: Malinaw, marangal, at likas ang daloy sa modernong Filipino. Ang mga gitling na nagbubukod sa paglalarawan ng mga naglilingkod ay nakatutulong sa pagbasa nang hindi binabago ang saklaw ng parirala.
  terminology: Ang “mga angkan ng mga Kohatita,” “Toldang Tipanan,” at “Yahweh” ay magkakatugma sa rehistro at sa itinakdang pagtrato sa mga pangalan at pangunahing katawagan. Ang “sa pamamagitan ni Moises” ay isang natural na idyomatikong salin ng בְּיַד מֹשֶׁה; maayos na itinatala ng talababa ang literal na larawan.
