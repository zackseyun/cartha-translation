base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: tl
  text: Ito ang mga lalaking nabilang mula sa mga angkan ng mga Kohatita—ang lahat ng naglilingkod sa Toldang Tipanan—na binilang nina Moises at Aaron ayon sa utos ni Yahweh sa pamamagitan ni Moises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “sa kamay ni Moises.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: mga lalaking nabilang
  rationale: Sa konteksto ng sensus para sa paglilingkod, tumutukoy ito sa mga lalaking isinama sa bilang, hindi sa abstraktong tala lamang.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: mga angkan ng mga Kohatita
  rationale: Ang מִשְׁפָּחָה ay tumutukoy sa pangkat na batay sa pamilya o angkan; mas angkop dito ang “angkan” sa organisasyong pantribo ng Israel.
- source_word: כָּל הָעֹבֵד
  choice: ang lahat ng naglilingkod
  rationale: Ang participle na עֹבֵד ay naglalarawan sa mga gumaganap ng paglilingkod; natural sa Tagalog ang kolektibong pariralang ito.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Toldang Tipanan
  rationale: Dito ang אֹהֶל מוֹעֵד ay pangalan ng banal na tolda. Ipinahahayag ng “Tipanan” ang itinakdang pakikipagtagpo nang hindi ipinapalagay na ordinaryong pulong lamang.
- source_word: אֲשֶׁר פָּקַד
  choice: na binilang
  rationale: Ang פקד ay muling tumutukoy sa pagbibilang o sensus sa kontekstong ito, hindi sa pagtatalaga.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang literal na idyomang “ayon sa bibig” ay likas na nangangahulugang ayon sa ipinahayag na utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang Hebreong idyoma ay nagpapahiwatig ng ahensiya o pamamagitan. Ito ang malinaw at likas na katumbas sa modernong Tagalog; inilalahad sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Diwa ng בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  alternative: sa kamay ni Moises
  rationale: Maaaring pormal na panatilihin ang larawan ng “kamay,” ngunit sa idyomang ito ang pangunahing diwa ay pamamagitan o ahensiya. Hindi nito inaalis ang tensiyong si Moises ay kapwa kasama sa pagbibilang at tagapamagitan ng utos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” para sa mga pangkat-pamilya at “Toldang Tipanan” bilang pamilyar na katawagan sa banal na tolda. Pinanatili ang pangalang Yahweh at ang bahagyang pag-uulit ng “nabilang/binilang” na nasa Hebreo.
