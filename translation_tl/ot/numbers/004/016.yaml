  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/פְקֻדַּ֞ת אֶלְעָזָ֣ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן שֶׁ֤מֶן הַ/מָּאוֹר֙ וּ/קְטֹ֣רֶת הַ/סַּמִּ֔ים וּ/מִנְחַ֥ת הַ/תָּמִ֖יד וְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה פְּקֻדַּ֗ת כָּל הַ/מִּשְׁכָּן֙ וְ/כָל אֲשֶׁר בּ֔/וֹ בְּ/קֹ֖דֶשׁ וּ/בְ/כֵלָֽי/ו׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: tl
  text: Ang tungkuling pangasiwaan[a] ni Eleazar, na anak ng paring si Aaron, ay ang langis para sa ilawan, ang mabangong insenso, ang regular na handog na butil[b], at ang langis na pampahid. Saklaw rin ng tungkuling ito ang buong tabernakulo at ang lahat ng naroon, sa santuwaryo[c] at sa mga kagamitan nito.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “pananagutan,” “tungkulin,” o “pamamahala”; tumutukoy ang salitang Hebreo sa ipinagkatiwalang pangangasiwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “patuloy na handog na butil” o “palagiang handog na butil.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isaling “banal na lugar.” Dito ay maaaring mas malawak ang tinutukoy kaysa sa silid na karaniwang tinatawag na Banal na Lugar.
    reason: lexical_alternative
  - marker: d
    text: Ang “mga kagamitan” ay maaari ring isaling “mga sisidlan” o “mga kasangkapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: pananagutan
  rationale: Ipinapahiwatig ng salita ang ipinagkatiwalang tungkulin at pangangasiwa. Likas sa Filipino ang pariralang “saklaw ng pananagutan,” at naipapakita nito na si Eleazar ang may pananagutan sa mga nakalistang banal na bagay.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: langis para sa ilawan
  rationale: Pinananatili nito ang layunin ng langis nang hindi labis na tinutukoy kung aling ilawan o ilawanang tinutukoy.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: mabangong insenso
  rationale: Natural at malinaw itong katumbas ng insensong yari sa mababangong sangkap.
- source_word: מִנְחַת הַתָּמִיד
  choice: palagiang handog na butil
  rationale: Ang מִנְחָה ay handog na butil, at ang תָּמִיד ay nagsasaad ng regular o patuloy na pag-aalay nang hindi kailangang gawing tahasang “araw-araw.”
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: langis na pamahid
  rationale: Karaniwan at dignified na katawagan ito sa langis na ginagamit sa rituwal na pagpapahid.
- source_word: כָּל הַמִּשְׁכָּן
  choice: buong tabernakulo
  rationale: Ang “tabernakulo” ay malinaw na katawagan sa kontekstong ito, at ipinapahayag ng “buong” ang saklaw ng כָּל.
- source_word: בְּקֹדֶשׁ
  choice: sa santuwaryo
  rationale: Spatial at kultiko ang gamit dito; hindi ito ginawang abstraktong “sa kabanalan” o nilimitahan sa isang partikular na silid.
- source_word: וּבְכֵלָיו
  choice: at sa mga kagamitan nito
  rationale: Malawak ang כֵּלִים at maaaring tumukoy sa mga sisidlan, kasangkapan, o iba pang banal na kagamitan; pinananatili ng “mga kagamitan” ang lawak na iyon.
theological_decisions:
- issue: Lakas at kaugnayan ng dalawang paglitaw ng פְקֻדַּת
  choice: Inilahad ang mga bagay na saklaw ng pananagutan ni Eleazar, saka inulit na pananagutan din niya ang buong tabernakulo at lahat ng naroon.
  alternative: 'Maaaring unawain ang ikalawang פְקֻדַּת bilang appositional na pagbubuod: “ang pangangasiwa sa buong tabernakulo…”'
  rationale: Nominal at bahagyang appositional ang Hebreo. Ang paghahati sa dalawang pangungusap ay nagbibigay ng likas na Filipino habang pinananatili ang pag-uulit at hindi nagpapasok ng dagdag na doktrina.
- issue: Ugnayan ng בְּקֹדֶשׁ וּבְכֵלָיו sa naunang parirala
  choice: 'Pinanatili ang mga pariralang may “sa”: “sa santuwaryo at sa mga kagamitan nito.”'
  alternative: 'Maaaring ituring ang mga ito bilang appositional na paglilinaw: “ang santuwaryo at ang mga kagamitan nito.”'
  rationale: May tunay na sintaktikong siksik at bahagyang kalabuan sa Hebreo. Ang “sa” ay sumasalamin sa mga pang-ukol na בְּ nang hindi nilulutas nang labis ang eksaktong ugnayan ng mga huling parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabernakulo,” “santuwaryo,” at “insenso” bilang pamilyar na mga terminong biblikal, ngunit iniwasan ang lumang ayos ng pangungusap. Nilinaw ng “paring si Aaron” na kay Aaron nakakabit ang titulong “pari,” ayon sa pinakaangkop na pagbasa ng pariralang Hebreo.
