  terminology: Ang “tabernakulo,” “santuwaryo,” “insenso,” at “langis na pampahid” ay angkop at pare-pareho ang rehistro. Pinanatili ang “handog na butil” para sa מִנְחָה at hindi ginawang “araw-araw” ang תָּמִיד. Ang pangwakas na “sa santuwaryo at sa mga kagamitan nito” ay pinanatili upang huwag piliting lutasin ang siksik at pinagtatalunang sintaktikong ugnayan ng mga pariralang Hebreo.
