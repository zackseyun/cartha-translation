revisions:
- from: Saklaw ng pananagutan[a] ni Eleazar, na anak ng paring si Aaron, ang langis para sa ilawan, ang mabangong insenso, ang palagiang handog na butil[b], at ang langis na pamahid. Pananagutan din niya ang buong tabernakulo at ang lahat ng naroon, sa santuwaryo[c] at sa mga kagamitan nito.[d]
  to: Ang tungkuling pangasiwaan[a] ni Eleazar, na anak ng paring si Aaron, ay ang langis para sa ilawan, ang mabangong insenso, ang regular na handog na butil[b], at ang langis na pampahid. Saklaw rin ng tungkuling ito ang buong tabernakulo at ang lahat ng naroon, sa santuwaryo[c] at sa mga kagamitan nito.[d]
  rationale: Pinalitan ang “saklaw ng pananagutan” ng “tungkuling pangasiwaan” upang maipahayag nang mas tuwiran ang פְקֻדַּת bilang ipinagkatiwalang pangangasiwa. Ginawang “regular na handog na butil” ang paglalarawan sa מִנְחַת הַתָּמִיד para sa mas natural na modernong Filipino. Ang ikalawang paglitaw ng termino ay inilahad bilang pagbubuod (“Saklaw rin ng tungkuling ito”) upang panatilihin ang nominal/appositional na daloy ng Hebreo nang hindi nagdaragdag ng doktrinal na paliwanag. Napanatili ang mga pang-ukol sa pangwakas na parirala dahil ang eksaktong sintaktikong kaugnayan nito ay hindi dapat labis na lutasin sa salin.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:06:24Z'
