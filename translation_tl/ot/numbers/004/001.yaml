reference: Numbers 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh[a] kay Moises at kay Aaron. Sinabi niya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring isaling “Jehova.”'
    reason: Ipinababatid ang anyong Hebreo ng banal na pangalan at ang isang tradisyonal na alternatibong baybay.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang pandiwang דִּבֵּר ay tumutukoy sa pagsasalita o pagpapahayag. Ang “Nagsalita” ay likas at marangal sa modernong Tagalog at mas tuwirang katumbas kaysa simpleng “sinabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng tetragrammaton na YHWH, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kay Moises at kay Aaron
  rationale: Inuulit sa salin ang “kay” upang maipakita ang tahasang pag-uulit ng אֶל sa Hebreo at malinaw na kapuwa sila ang kinausap.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ang pormulang Hebreo ay nagpapakilala sa direktang salitang kasunod. Hinati ito sa bagong pangungusap upang maging natural sa Tagalog at maiwasan ang alanganing “na sinasabi,” habang pinananatili ang tungkulin nitong pambungad sa pahayag.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Ang “Yahweh” ay malapit na transliterasyon at hindi pinapalitan ang pangalan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignipikado, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “si” bago ang Yahweh ayon sa likas na balarila ng Tagalog. Ang pormulang pambungad sa pananalita ay hinati sa dalawang sugnay upang maging natural nang hindi binabago ang kahulugan.
