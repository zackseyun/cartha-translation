  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: tl
  text: Ang mga nabilang mula sa kanila[a], ayon sa kani-kanilang angkan at sambahayan ng kanilang mga ama, ay 2,630.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga nakatala mula sa kanila,” “ang kanilang talaan,” o “ang kanilang kabuuang bilang.” Ang Hebreo ay tumutukoy sa mga nairehistro sa sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay 2,630
  rationale: Sa pormulang ito ng sensus, ang היה ay nagsasaad ng kabuuang bilang. Natural sa modernong Tagalog ang hulma na may “ay” bago ang bilang.
- source_word: פְּקֻדֵיהֶם
  choice: ang mga nabilang mula sa kanila
  rationale: Tumutukoy ito sa mga taong naitala o nabilang sa sensus. Pinananatili ng “mula sa kanila” ang kaugnayan sa grupong binanggit sa naunang konteksto nang hindi nagdaragdag ng salitang “mga lalaki,” na hindi tahasang nasa talata.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa konteksto ng sensus, ang מִשְׁפָּחָה ay isang pangkat na nakabatay sa pagkakamag-anak; malinaw at likas dito ang “angkan.” Ang “kani-kanilang” ay nagpapahayag ng pronominal na hulaping maramihan.
- source_word: לְבֵית אֲבֹתָם
  choice: at sambahayan ng kanilang mga ninuno
  rationale: Ang בֵּית אָבוֹת ay nakapirming katawagan sa yunit na panlipunan at pangangkan. Ang “sambahayan ng kanilang mga ninuno” ay mas malinaw sa karaniwang mambabasa kaysa literal na “bahay ng mga ama,” habang pinananatili ang genealogical na diwa.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: 2,630
  rationale: Tuwirang katumbas ng bilang sa Hebreo at karaniwang paraan ng pagsulat ng malaking bilang sa modernong Filipino.
