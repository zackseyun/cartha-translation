  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: tl
  text: Ito ang mga naibilang mula sa mga angkan ng mga anak ni Gershon—lahat ng naglilingkod sa Toldang Tipanan—na binilang nina Moises at Aaron ayon sa utos ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Ito ang mga binilang
  rationale: Ipinakikilala nito ang buod ng sensus. Likas sa Tagalog ang “Ito ang” kahit maramihan ang tinutukoy, at malinaw na ang mga taong naitala sa bilang ang tinutukoy.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa kontekstong pantribo ng Israel, mas tiyak ang “angkan” kaysa “pamilya” para sa malalaking pangkat na magkakamag-anak.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: mga anak ni Gershon
  rationale: Pinananatili ang pormal na pananalitang pangkamag-anakan ng Hebreo sa halip na gawing “mga Gershonita.”
- source_word: כָּל הָעֹבֵד
  choice: lahat ng naglilingkod
  rationale: Ang participle ay tumutukoy sa lahat ng gumaganap ng paglilingkod; natural at malinaw ito sa modernong Tagalog.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa toldang tipanan
  rationale: Ang “toldang tipanan” ay maikli at nauunawaang katawagan sa santuwaryong itinakda para sa pakikipagtagpo ng Diyos sa Israel. Ang “sa” ay maaaring sumaklaw sa paglilingkod sa loob o kaugnay ng tolda.
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: na binilang nina Moises at Aaron
  rationale: Pinananatili ang pag-uulit ng ugat na פקד at tuwirang ipinakikitang sina Moises at Aaron ang nagsagawa ng pagbibilang.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Idyomatikong inilalahad ang literal na “ayon sa bibig ni Yahweh” bilang pagsunod sa kaniyang utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na banal na pangalan sa transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” nang hindi pinapalitan ng titulong “PANGINOON.”
- issue: Saklaw ng paglilingkod בְּאֹהֶל מוֹעֵד
  choice: naglilingkod sa toldang tipanan
  alternative: gumagawa sa loob ng toldang tipanan
  rationale: Hindi nililimitahan ng salin ang paglilingkod sa gawaing pisikal o sa loob lamang ng tolda; pinananatili ang mas malawak na saklaw ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “angkan” para sa estrukturang pantribo at ang “toldang tipanan” bilang natural na katawagan sa אֹהֶל מוֹעֵד. Walang talababa dahil hindi kailangan ang alternatibong anyo upang mapanatili ang makabuluhang kalabuan ng talata.
