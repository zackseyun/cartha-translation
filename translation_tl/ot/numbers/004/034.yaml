  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: tl
  text: Sina Moises, Aaron, at ang mga pinuno ng kapulungan ay nagbilang sa mga inapo ni Kohat ayon sa kani-kanilang angkan at mga sambahayan ng kanilang mga ama.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “itinala” o “nagsagawa ng sensus ng.” Sa ibang konteksto, ang pandiwang Hebreo ay maaari ring mangahulugang “humirang,” ngunit dito ay tumutukoy ito sa pagbibilang para sa paglilingkod.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ng Kohatita,” na tumutukoy sa pangkat-angkan na nagmula kay Kohat.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga sambahayan ng kanilang mga ama” ay tradisyonal na katawagang Israelita para sa mga sambahayan o pangkat ng pamilya ayon sa angkan ng ama.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: binilang
  rationale: Sa konteksto ng sensus at paglilingkod sa Bilang 4, ang פקד ay tumutukoy sa pagbibilang o pagtatala, hindi sa paghirang sa tungkulin.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: mga pinuno ng kapulungan
  rationale: Ang נְשִׂיאִים ay mga kinikilalang pinuno ng pamayanan, at ang עֵדָה rito ay ang kapulungan ng Israel.
- source_word: בְּנֵי הַקְּהָתִי
  choice: mga inapo ni Kohat
  rationale: Bagaman literal na ‘mga anak ng Kohatita/Kohat,’ malinaw at likas sa modernong Tagalog ang ‘mga inapo ni Kohat’ para sa pangkat na nagmula kay Kohat.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa talaangkanan at sensus, ang מִשְׁפָּחָה ay isang pangkat ng magkakamag-anak; ang ‘angkan’ ay malinaw na katumbas sa Tagalog.
- source_word: וּלְבֵית אֲבֹתָם
  choice: at sambahayan ng kanilang mga ninuno
  rationale: Ang בֵית אָבוֹת ay teknikal na katawagan sa mga yunit ng pagkakamag-anak ayon sa angkan ng ama; pinananatili ng salin ang ideya ng sambahayang minana sa mga ninuno nang hindi tunog-salitang-salin.
