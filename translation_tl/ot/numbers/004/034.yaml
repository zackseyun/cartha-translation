- from: Kaya binilang nina Moises at Aaron at ng mga pinuno ng kapulungan ang mga inapo ni Kohat ayon sa kani-kanilang angkan at sambahayan ng kanilang mga ninuno.[a][b][c]
  to: Sina Moises, Aaron, at ang mga pinuno ng kapulungan ay nagbilang sa mga inapo ni Kohat ayon sa kani-kanilang angkan at mga sambahayan ng kanilang mga ama.[a][b][c]
  rationale: Inayos ang tambalang paksa para sa likas na daloy ng Tagalog at ibinalik sa pangunahing teksto ang “mga ama,” na mahalaga sa teknikal na terminong Hebreo para sa mga pangkat ng sambahayan batay sa angkan ng ama. Pinanatili ang “mga inapo ni Kohat” bilang malinaw at natural na kolektibong katumbas ng familial idiom sa Hebreo.
