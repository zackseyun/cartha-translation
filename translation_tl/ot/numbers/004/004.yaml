  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: tl
  text: Ito ang paglilingkod ng mga anak ni Kohat sa Toldang Tipanan tungkol sa mga bagay na pinakabanal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang Kabanal-banalang Dako.” Dito, malamang na tumutukoy ang parirala sa pinakabanal na mga sagradong bagay, hindi lamang sa pinakaloob na bahagi ng tolda.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  choice: Ito ang
  rationale: Ang pambabaeng isahang demonstratibo ay nagpapakilala sa sugnay; likas sa Tagalog ang “Ito ang” bilang katumbas ng ipinahihiwatig na pang-ugnay.
- source_word: עֲבֹדַת
  choice: paglilingkod
  rationale: Tumutukoy dito sa itinakdang sagradong gawain o tungkulin; malinaw at marangal ang “paglilingkod” nang hindi masyadong mekanikal.
- source_word: בְּנֵי קְהָת
  choice: mga anak ni Kohat
  rationale: Pinananatili nito ang Hebreong pananalitang pangkamag-anakan at nauunawaan pa rin sa modernong Tagalog; maaari ring mangahulugan ng mga inapo ni Kohat.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Toldang Tipanan
  rationale: Likas na pangalan sa Tagalog para sa אֹהֶל מוֹעֵד; ang “sa” ay angkop sa saklaw o lugar ng kanilang paglilingkod.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: mga bagay na pinakabanal
  rationale: Sa konteksto ng Bilang 4, malamang na tumutukoy ito sa pinakabanal na mga kagamitang nasa pangangalaga ng mga Kohatita, hindi lamang sa panloob na silid.
theological_decisions:
- issue: Tinutukoy ng קֹדֶשׁ הַקֳּדָשִׁים
  choice: Ang mga pinakabanal na sagradong bagay na ipinagkatiwala sa mga anak ni Kohat
  alternative: Ang Kabanal-banalang Dako bilang lugar
  rationale: Ang mas malawak na konteksto ay tungkol sa paghawak at pagdadala ng mga kagamitan ng tabernakulo. Gayunman, pinananatili sa talababa ang tunay na posibilidad ng lokatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Toldang Tipanan” bilang pamilyar na katawagan, at pinanatili ang Hebreong anyong “mga anak ni Kohat.”
