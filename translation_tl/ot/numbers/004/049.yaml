  terminology: Ang 'Yahweh,' 'utos,' 'binilang,' 'paglilingkod,' at 'pasan' ay angkop. Ang 'atas' ay isang katanggap-tanggap na pansamantalang pangunahing pagbasa para sa mahirap na וּפְקֻדָיו, habang pinananatili ng talababa ang iba pang posibilidad.
