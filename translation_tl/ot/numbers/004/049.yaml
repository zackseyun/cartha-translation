base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: tl
  text: 'Ayon sa utos ni Yahweh[a], binilang sila sa pamamagitan ni Moises[b], bawat lalaki, ayon sa kaniyang paglilingkod at kaniyang pasan; at ang kaniyang atas[c] ay ayon sa iniutos ni Yahweh kay Moises.


    [a] Literal na, “ayon sa bibig ni Yahweh.”


    [b] Literal na, “sa kamay ni Moises.” Maaari rin itong unawain na “sa pamamagitan ni Moises” o “sa pangunguna ni Moises.”


    [c] Mahirap tiyakin ang kahulugan ng salitang Hebreo rito. Maaari rin itong tumukoy sa kaniyang “tungkulin,” “pananagutan,” o “pagkatalaga.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ayon sa bibig ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Literal na, “sa kamay ni Moises.” Maaari rin itong unawain na “sa pamamagitan ni Moises” o “sa pangunguna ni Moises.”
    reason: lexical_alternative
  - marker: c
    text: Mahirap tiyakin ang kahulugan ng salitang Hebreo rito. Maaari rin itong tumukoy sa kaniyang “tungkulin,” “pananagutan,” o “pagkatalaga.”
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: Ayon sa utos ni Yahweh
  rationale: Ang idyomang Hebreo ay literal na “ayon sa bibig ni Yahweh,” ngunit tumutukoy sa pagkilos ayon sa kaniyang utos. Pinanatili ang personal na pangalang Yahweh.
- source_word: פָּקַד אֹתָם
  choice: binilang sila
  rationale: Sa konteksto ng Bilang 4, tumutukoy ito sa pagtatala o sensus ng mga Levitang may takdang paglilingkod; hindi nito isinasara ang mas malawak na ugnayan ng pandiwa sa pagtatalaga.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang literal na “sa kamay ni Moises” ay idyoma ng ahensiya o pamamahala. Mas likas sa modernong Tagalog ang “sa pamamagitan ni Moises,” habang inilagay sa talababa ang literal na anyo.
- source_word: אִישׁ אִישׁ
  choice: bawat lalaki
  rationale: Pinananatili nito ang distributibong pag-uulit at ang panlalaking anyo ng Hebreo sa konteksto ng mga lalaking Levitang binilang para sa paglilingkod.
- source_word: עַל עֲבֹדָתוֹ
  choice: ayon sa kaniyang paglilingkod
  rationale: Ang עֲבֹדָה rito ay ang nakatalagang gawaing paglilingkod ng bawat Levita sa tabernakulo.
- source_word: וְעַל מַשָּׂאוֹ
  choice: at sa pasan niya
  rationale: Ang מַשָּׂא ay konkretong kargang dadalhin sa paglilipat ng mga kagamitan ng tabernakulo. Ang “pasan” ay maikli, natural, at nagpapanatili sa larawan ng pagdadala.
- source_word: וּפְקֻדָיו
  choice: at ang atas sa kaniya
  rationale: Mahirap ang anyong Hebreo at nagmumula sa ugat na פקד. Sa daloy ng talata, maaaring tumukoy ito sa indibiduwal na takdang pananagutan o pagkatalaga; hindi itinago ang kawalang-katiyakan at inilista sa talababa ang mga alternatibo.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ay ayon sa iniutos ni Yahweh kay Moises
  rationale: Ikinakabit ang sugnay sa naunang atas at ipinakikitang nakaayon iyon sa utos na ibinigay ni Yahweh kay Moises.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya ginamit ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng sensus at pagtatalaga sa ugat na פקד
  choice: “binilang” sa pangunahing pandiwa at “atas” sa mahirap na pangngalang anyo
  alternative: “itinalaga” at “mga binilang”
  rationale: Pinananatili ng salin ang parehong administratibong sensus at indibiduwal na pananagutan nang hindi ipinapantay ang dalawang gamit ng ugat o nilulutas nang labis ang mahirap na hulíng anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang “kaniyang” sa mas pormal na salaysay at “pasan” upang panatilihin ang konkretong larawan ng kargang dinadala. Inilagay sa talababa ang mga literal na idyoma at ang tunay na leksikal na hirap sa וּפְקֻדָיו.
