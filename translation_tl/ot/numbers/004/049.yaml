  to: 'Ayon sa utos ni Yahweh[a], binilang sila sa pamamagitan ni Moises[b], bawat lalaki, ayon sa kaniyang paglilingkod at kaniyang pasan; at ang kaniyang atas[c] ay ayon sa iniutos ni Yahweh kay Moises.


