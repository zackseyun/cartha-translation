base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: tl
  text: Sa ibabaw ng gintong altar ay maglalatag sila ng telang asul; tatakpan nila ito ng pantakip na yari sa balat ng tachash[a], at ilalagay nila ang mga pingga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak kung anong hayop ang tinutukoy ng salitang Hebreo na tachash. Kabilang sa mga mungkahing salin ang “pinong katad,” “balat ng dugong,” at iba pang katawagang tumutukoy sa matibay na balat o katad.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: gintong altar
  rationale: Likas at malinaw na katumbas sa Filipino ng pariralang tumutukoy sa altar na yari o nababalutan ng ginto.
- source_word: יִפְרְשׂוּ
  choice: ilalatag nila
  rationale: Ang pandiwang פרשׂ ay nangangahulugang ilatag o iladlad; ang “ilalatag” ay natural para sa telang ipinapatong sa altar.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: telang asul
  rationale: Ang בגד ay tela o kasuutan, at ang תכלת ay tumutukoy sa natatanging asul o bughaw-lilang tina. Hindi labis na tinutukoy ng “asul” ang eksaktong sinaunang kulay.
- source_word: וְכִסּוּ אֹתוֹ
  choice: tatakpan iyon
  rationale: Ipinagpapatuloy ng anyong pandiwa ang sunod-sunod na tagubilin; malinaw na ang altar ang tinutukoy ng “iyon.”
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: ng pantakip na pinong katad[a]
  rationale: Ang מִכְסֵה ay pantakip at ang עוֹר ay balat o katad. Hindi tiyak ang hayop na tinutukoy ng תָּחַשׁ, kaya ginamit ang nababasang “pinong katad” at pinanatili sa talababa ang kawalang-katiyakan.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: at ilalagay sa puwesto ang mga pingga nito
  rationale: Ang בדים ay mga pinggang ginagamit sa pagbuhat ng mga kagamitan sa tabernakulo. Ipinahahayag ng “ilalagay sa puwesto” ang praktikal na diwa nang hindi sinasabing tiyak kung paano ikinabit ang mga ito.
