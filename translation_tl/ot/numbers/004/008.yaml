  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: tl
  text: Ilalatag nila sa ibabaw ng mga iyon ang isang telang matingkad na pula, tatakpan iyon ng isang pantakip na balat ng tahash[a], at ilalagay sa puwesto ang mga pingga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: tahash; hindi tiyak kung anong hayop o materyal ito. Kabilang sa mga tradisyonal na salin ang “balat ng badger,” “balat ng porpoise,” at, sa mas pangkalahatan, “pinong katad.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: Ilalatag nila sa ibabaw ng mga iyon
  rationale: Ipinapahayag ng פרשׂ ang paglalatag ng isang pantakip sa ibabaw ng mga kagamitang binanggit sa naunang talata; pinananatili rin ng “mga iyon” ang maramihang reperensiya ng Hebreo.
- source_word: בֶּגֶד
  choice: isang tela
  rationale: Sa kontekstong ito, ang בגד ay telang pantakip, hindi kasuotang isinusuot.
- source_word: תּוֹלַעַת שָׁנִי
  choice: matingkad na pula
  rationale: Tumutukoy ang parirala sa pulang materyal o kulay na ginagamit sa mamahaling tela. Hindi idinagdag ang “sinulid,” sapagkat hindi iyon tahasang sinasabi rito.
- source_word: וְכִסּוּ אֹתוֹ
  choice: tatakpan iyon
  rationale: Pinananatili ang paglipat ng Hebreo mula sa maramihang “mga iyon” tungo sa isahang layon, na malamang ay ang mesa bilang isang kabuuan.
- source_word: בְּמִכְסֵה
  choice: ng isang pantakip
  rationale: Direkta at likas na katumbas ito ng pangngalang tumutukoy sa panlabas na pantakip.
- source_word: עוֹר תָּחַשׁ
  choice: balat ng tahash
  rationale: Hindi tiyak kung anong hayop o uri ng materyal ang תחשׁ, kaya pinanatili ang terminong Hebreo sa halip na pumili ng haka-hakang espesipikong hayop.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: at ilalagay sa puwesto ang mga pingga nito
  rationale: Ang בדים ay mga pinggang pambuhat ng banal na kasangkapan. Nililinaw ng “sa puwesto” ang ipinahihiwatig na paghahanda para sa pagdadala.
