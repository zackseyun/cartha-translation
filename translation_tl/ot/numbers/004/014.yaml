translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga pangkaraniwang katawagan sa mga kagamitan, ngunit pinanatili ang pormal na himig ng mga tagubilin tungkol sa banal na paglilingkod. Ang panandang talababa [a] ay inilagay mismo sa pariralang may leksikal na kawalang-katiyakan.
