  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: tl
  text: 'Pagkatapos, ilalagay nila sa ibabaw nito ang lahat ng kagamitan nito na ginagamit nila sa paglilingkod dito: ang mga sisidlan ng baga, mga tinidor, mga pala, at mga palanggana—lahat ng kagamitan ng altar. Ilalatag nila sa ibabaw nito ang isang pantakip na gawa sa katad na taḥash[a] at ilalagay sa puwesto ang mga pingga nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng Hebreong taḥash at ang hayop o uri ng balat na tinutukoy nito. Maaari itong tumukoy sa balat ng kambing, balat ng lumba-lumba, o, sa mas pangkalahatan, matibay na katad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Pagkatapos, ilalagay nila sa ibabaw nito
  rationale: Ipinapakita ng “Pagkatapos” ang sunod-sunod na tagubilin, habang malinaw na tumutukoy ang “nito” sa altar.
- source_word: כָּל־כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Malawak ang kahulugan ng כְּלִי at saklaw nito ang iba’t ibang kasangkapang ginagamit sa altar; natural at malinaw ang “kagamitan” sa makabagong Filipino.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: na ginagamit nila sa paglilingkod dito
  rationale: Pinananatili ng “paglilingkod” ang sagradong konteksto ng שׁרת nang hindi nagiging masalimuot ang pangungusap.
- source_word: הַמַּחְתֹּת
  choice: mga sisidlan ng baga
  rationale: Ang מַחְתָּה ay kasangkapang ginagamit sa pagdadala ng baga o apoy. Mas tiyak ito kaysa “insensaryo,” na maaaring magpahiwatig na para lamang ito sa insenso.
- source_word: הַמִּזְלָגֹת
  choice: mga tinidor
  rationale: Tuwirang inilalarawan ang hugis at gamit ng mga kasangkapan sa natural na modernong Filipino.
- source_word: הַיָּעִים
  choice: mga pala
  rationale: Karaniwang tumutukoy ang salita sa mga kasangkapang ginagamit sa pagsalok o pag-aalis ng abo.
- source_word: הַמִּזְרָקֹת
  choice: mga palanggana
  rationale: Ipinahihiwatig nito ang mga malalapad na sisidlang ginagamit sa ritwal, at iniiwasan ang mas domestikong tunog ng “mga mangkok.”
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: lahat ng kagamitan ng altar
  rationale: Inuulit ang “kagamitan” upang mapanatili ang pagbubuod na nasa Hebreo.
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: Ilalatag nila sa ibabaw nito ang isang pantakip
  rationale: Ipinapahayag nang tuwiran ang kilos ng פָּרַשׂ, “ilatag” o “ikalat,” at ang pangngalang כְּסוּי bilang “pantakip.”
- source_word: עוֹר תַּחַשׁ
  choice: pinong katad[a]
  rationale: Hindi tiyak kung anong hayop o uri ng balat ang tinutukoy ng תַּחַשׁ. Nagbibigay ang “pinong katad” ng malinaw na pangunahing teksto, habang inilalahad sa talababa ang tunay na kawalang-katiyakan.
- source_word: וְשָׂמוּ בַדָּיו
  choice: ilalagay sa puwesto ang mga pingga nito
  rationale: Ang literal na “ilalagay ang mga pingga nito” ay tumutukoy sa paghahanda ng mga pingga para sa pagbubuhat; nililinaw ng “sa puwesto” ang kilos nang hindi dinaragdagan ang layunin nito.
