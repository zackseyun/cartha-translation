  yaml_path: translation/ot/numbers/004/013.yaml
  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: tl
  text: Pagkatapos, aalisin nila ang mga abo sa altar at lalatagan ito ng telang kulay-ube.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lilinisin nila ang altar” o “aalisin nila sa altar ang mamantikang abo.” Ang pandiwang Hebreo ay partikular na tumutukoy sa pag-aalis ng latak na abo mula sa altar sa konteksto ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: aalisin nila ang mga abo
  rationale: Ang Piel ng דשׁן sa kontekstong panghandog ay tumutukoy sa pag-aalis ng naiwang abo o mamantikang latak sa altar. Likas at malinaw sa modernong Filipino ang “aalisin nila ang mga abo.”
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Karaniwang salin ng מִזְבֵּחַ sa konteksto ng tabernakulo at paghahandog; pamilyar at tiyak ang “altar” sa modernong Filipino.
- source_word: וּפָרְשׂוּ
  choice: lalatagan
  rationale: Ang פרשׂ ay nangangahulugang ilatag o ikalat. Kasama ng עָלָיו at ng telang pantakip, likas na ipinahahayag ng “lalatagan ito” ang paglalagay ng tela sa ibabaw ng altar.
- source_word: עָלָיו
  choice: ito
  rationale: Tumutukoy ang hulaping panghalip sa altar; sa pandiwang “lalatagan,” malinaw na ang altar ang bagay na lalagyan ng tela sa ibabaw.
- source_word: בֶּגֶד
  choice: tela
  rationale: Bagaman maaari itong mangahulugang kasuotan, dito ay isang telang ginagamit na pantakip sa kagamitang banal.
- source_word: אַרְגָּמָן
  choice: kulay-ube
  rationale: Tumutukoy ito sa kulay o materyal na tinina ng purpura. Ang “telang kulay-ube” ay malinaw sa karaniwang mambabasa nang hindi labis na tinutukoy ang uri ng tina o hibla.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong ritwal. Ginamit ang “altar” bilang karaniwan at madaling maunawaang terminong biblikal. Napanatili sa talababa ang mas tiyak na pahiwatig ng pandiwang Hebreo tungkol sa mamantikang latak ng handog.
