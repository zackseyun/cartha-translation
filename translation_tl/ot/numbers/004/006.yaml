  terminology: Ang “katad na tahash” ay pinananatili ang leksikal na kawalang-katiyakan nang hindi nagdaragdag ng kalidad na wala sa pinagmulan. Ang “mga pingga” ay angkop para sa בַּדָּיו, ang mga baras na pambuhat.
