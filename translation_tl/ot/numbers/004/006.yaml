  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: tl
  text: Ilalagay nila sa ibabaw nito ang isang pantakip na katad na tahash[a], at sa ibabaw niyon ay ilalatag nila ang isang telang pawang asul. Pagkatapos, ilalagay nila ang mga pingga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na תַּחַשׁ (tahash). Maaaring tumukoy ito sa balat ng isang partikular na hayop; ayon sa tradisyon, isinasalin din ito bilang “balat ng kambing,” “balat ng porpoise,” o “balat ng dugong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Ilalagay nila sa ibabaw nito
  rationale: Ang anyong pandiwa sa serye ng mga tagubilin ay likas na isinasalin bilang kilos na gagawin. Ipinakikita ng “sa ibabaw nito” ang pagpapatong ng pantakip sa kaban.
- source_word: כְּסוּי
  choice: isang pantakip
  rationale: Tumutukoy ito sa bagay na ginagamit na takip; natural at malinaw sa modernong Filipino ang “pantakip.”
- source_word: עוֹר תַּחַשׁ
  choice: pinong katad
  rationale: Hindi tiyak kung anong hayop ang tinutukoy ng תַּחַשׁ. Iniiwasan ng “pinong katad” ang isang mapangahas na tiyak na pagkilala habang ipinahihiwatig ang naprosesong balat na pantakip; inilalahad sa talababa ang kawalang-katiyakan.
- source_word: וּפָרְשׂוּ
  choice: ilalatag nila
  rationale: Ang pandiwa ay nangangahulugang maglatag o magbukadkad ng tela sa ibabaw ng isang bagay.
- source_word: בֶגֶד
  choice: isang tela
  rationale: Bagaman maaari itong mangahulugang kasuotan, sa kontekstong ito isa itong telang inilalatag bilang panibagong suson ng pantakip.
- source_word: כְּלִיל תְּכֵלֶת
  choice: purong asul
  rationale: Ipinahihiwatig ng כְּלִיל na ang tela ay lubos o kabuuang may kulay na תְּכֵלֶת. Ang “purong asul” ay maikli at natural, at pinananatili ang diin sa pagiging buong asul.
- source_word: מִלְמָעְלָה
  choice: sa ibabaw niyon
  rationale: Sa pagkakasunod-sunod ng mga suson, tinutukoy nito ang paglalagay ng asul na tela sa ibabaw ng pantakip na katad.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: ilalagay nila sa puwesto ang mga pambuhat nitong pingga
  rationale: Ang בַּדִּים ay mga pinggang ginagamit sa pagbuhat sa kaban. Nililinaw ng “sa puwesto” ang kilos na ipinahihiwatig ng pandiwang “ilagay,” at ng “pambuhat” ang gamit ng mga pingga.
