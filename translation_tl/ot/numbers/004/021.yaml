lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive kasama ng דִּבֵּר ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos, nagsalita” at napapanatili nito ang sunod-sunod na kilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang Tetragrammaton bilang personal na pangalan, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay nagpapakilala sa taong kinakausap; “kay” ang likas na anyo bago ang pangalang Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na pormula sa Hebreo na nagpapakilala sa susunod na mismong pananalita, bagaman maaari ring gawing mas idiomatiko bilang tutuldok.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan at hindi bilang pamalit na titulo.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Tagalog. Pinanatili ang pormal na pormula ng pagpapakilala sa pananalita dahil nagtatapos ang talata sa לֵאמֹר at nagpapatuloy ang mensahe sa susunod na talata.
