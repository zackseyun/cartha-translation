  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: tl
  text: mula sa edad na tatlumpu pataas hanggang sa edad na limampu, lahat ng pumapasok upang gumanap ng tungkulin[a] sa gawain sa Tolda ng Tipanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng humaharap para sa tungkulin.” Ang salitang Hebreo ay maaaring tumukoy sa pagpasok o pagharap para sa isang organisadong tungkulin. Sa kontekstong ito, tumutukoy ito sa tungkulin ng mga Levita sa paglilingkod sa santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: mula sa tatlumpung taong gulang pataas
  rationale: Ang idyomang בֶּן + bilang + שָׁנָה ay nagsasaad ng edad; natural itong ipinapahayag sa Tagalog bilang “taong gulang.” Ang “pataas” ay nagpapanatili sa inklusibong mababang hangganan.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hanggang sa limampung taong gulang
  rationale: Malinaw at natural nitong ipinapahayag ang itaas na hangganan ng edad nang hindi nagdaragdag ng paliwanag tungkol sa inklusibidad.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: ang bawat pumapasok sa tungkulin
  rationale: Ang participle na הַבָּא ay maaaring tumukoy sa pagpasok o pagharap para sa atas, at ang צָבָא rito ay organisadong tungkulin ng mga Levita, hindi literal na pakikidigma.
- source_word: לַעֲבֹדָה
  choice: upang maglingkod
  rationale: Sa konteksto ng santuwaryo, natural na ipinahahayag ng “maglingkod” ang gawain o paglilingkod, habang hindi inuulit nang alanganin ang “tungkulin.”
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa toldang tipanan
  rationale: Ang “toldang tipanan” ay dignified at madaling maunawaang salin ng karaniwang pariralang Pentateuchal na אֹהֶל מוֹעֵד; ang “sa” ay natural na katumbas ng lokatibong בְּ sa Tagalog.
