base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Yahweh[a] kina Moises at Aaron:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring isalin na “Jehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang anyong wayyiqtol ay nagpapatuloy sa salaysay; ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod, habang pinananatili ng “nagsalita” ang diwa ng pandiwang דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Ang “kina” ang natural na makabagong Tagalog para ipakitang kapuwa sina Moises at Aaron ang tuwirang kinausap. Hindi na kailangang ulitin ang pang-ukol dahil saklaw nito ang dalawang pangalan.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Natural na pormulang Tagalog ito sa pagpapakilala sa tuwirang pahayag na susunod, at malinaw nitong pinananatili ang tungkulin ng Hebreong infinitive.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo; ang talababa ay nagbibigay-linaw sa anyong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kina” para sa likas na daloy ng Tagalog, at ang “at sinabi” bilang karaniwang pambungad sa pahayag na nagpapatuloy sa susunod na talata.
