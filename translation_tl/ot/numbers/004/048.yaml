translation:
  language: tl
  text: Ang mga lalaking nabilang mula sa kanila ay 8,580[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang mga binilang mula sa kanila” o “ang kanilang mga nabilang.” Tinutukoy ng Hebreo ang mga nakatala sa sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Sa kontekstong ito, ang anyo ng היה ay nagsisilbing panandang kopular na naglalahad ng kabuuang bilang; natural sa Tagalog ang hulma na may “ay.”
- source_word: פְּקֻדֵיהֶם
  choice: ang mga lalaking naitala sa kanila
  rationale: Mula sa פקד sa konteksto ng sensus, tumutukoy ito sa mga inenrol o binilang. Ang “mga lalaking naitala” ay malinaw at angkop sa konteksto ng Bilang 4, kung saan mga lalaking Levita na kuwalipikado sa paglilingkod ang binibilang; pinananatili ng “sa kanila” ang hulaping panghalip ng Hebreo.
- source_word: שְׁמֹנַת אֲלָפִים
  choice: 8,000
  rationale: Tuwirang salin ng karaniwang konstruksiyon para sa walong libo; ginamit ang mga numerong digit para sa malinaw na kabuuang estadistikal.
- source_word: וַחֲמֵשׁ מֵאוֹת
  choice: '500'
  rationale: Tuwirang ipinapaloob sa pinagsamang kabuuang bilang ang limang daan.
- source_word: וּשְׁמֹנִים
  choice: '80'
  rationale: Tuwirang ipinapaloob sa pinagsamang kabuuang bilang ang walumpu.
theological_decisions:
- issue: Terminong may kasariang ginagamit sa sensus
  choice: mga lalaking naitala
  alternative: mga naitala; ang mga binilang mula sa kanila
  rationale: Mga lalaki sa itinakdang gulang para sa paglilingkod sa tabernakulo ang tahasang tinutukoy ng mas malawak na konteksto. Kaya pinananatili ang aktuwal na kasarian ng tinutukoy nang hindi dinaragdagan ang talata ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “naitala” bilang likas na salita sa konteksto ng sensus, at “mga lalaki” upang maging tumpak sa kasarian ng mga taong binibilang. Ginamit ang 8,580 para madaling mabasa bilang kabuuang estadistikal.
