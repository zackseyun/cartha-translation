  text: At ang mga nabilang sa kanila ayon sa kanilang mga angkan ay tatlong libo at dalawang daan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: At ... ay
  rationale: Ipinagpapatuloy ng waw-consecutive at ng pandiwang היה ang daloy ng salaysay at inilalahad ang naging kabuuan; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “At ... ay.”
- source_word: פְקֻדֵיהֶם
  choice: ang mga nabilang sa kanila
  rationale: Sa konteksto ng sensus, tumutukoy ang anyo mula sa פקד sa mga taong binilang o itinala. Hindi idinagdag ang “mga lalaki” sapagkat hindi iyon tahasang binanggit sa talatang ito.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Ang מִשְׁפָּחָה ay tumutukoy sa angkan o pangkat ng magkakamag-anak na nakapaloob sa isang lipi. Ang “ayon sa kanilang mga angkan” ay malinaw at angkop sa pormula ng sensus sa Mga Bilang.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: tatlong libo at dalawang daan
  rationale: Ito ang tuwirang katumbas ng bilang na 3,200 at likas na paraan ng pagsasabi nito sa modernong Tagalog.
