id: NUM.4.30
reference: Numbers 4:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה וְ/עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑/ם כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: tl
  text: Mula sa tatlumpung taong gulang pataas hanggang sa limampung taong gulang, bibilangin mo sila—ang bawat pumapasok sa paglilingkod[a] upang gawin ang gawain sa tolda ng pagpupulong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa nakatalagang tungkulin.” Ang salitang Hebreo ay maaari ring tumukoy sa isang organisadong pangkat o hukbo; dito, tumutukoy ito sa itinakdang paglilingkod ng mga Levita.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: Mula sa tatlumpung taong gulang pataas
  rationale: Likas na Filipino para sa Hebreong idyoma ng pagtatakda ng pinakamababang edad, nang hindi literal na isinasalin ang בֶּן bilang “anak.”
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hanggang sa limampung taong gulang
  rationale: Malinaw na ipinapahayag ang pinakamataas na edad na saklaw ng וְעַד.
- source_word: תִּפְקְדֵם
  choice: bibilangin mo sila
  rationale: Sa konteksto ng senso, ang פקד ay tumutukoy sa pagbibilang o pagtatala ng mga karapat-dapat maglingkod; pinananatili rin ang ikalawang panauhang isahan.
- source_word: כָּל הַבָּא
  choice: ang bawat pumapasok
  rationale: Pinananatili ang distributibong diwa ng כָּל kasama ng participle at ang larawan ng pagpasok sa nakatalagang paglilingkod.
- source_word: לַצָּבָא
  choice: sa paglilingkod
  rationale: Dito ang צָבָא ay organisadong tungkuling Levitico, hindi pakikidigma. Ang “paglilingkod” ay natural at hindi labis na militar ang dating.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: upang gawin ang gawain
  rationale: Iniiwasan ang alanganing pag-uulit na “maglingkod ng paglilingkod” habang tapat na ipinahahayag ang paggawa ng itinakdang gawain.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagpupulong
  rationale: Tuwirang salin ng kinikilalang katawagan sa santuwaryo; malinaw at nauunawaan sa modernong Filipino.
theological_decisions:
- issue: Posibleng militar na himig ng לַצָּבָא sa tungkulin ng mga Levita
  choice: sa paglilingkod
  alternative: sa hukbo / sa pangkat na nakatalaga
  rationale: Ang konteksto ay organisadong gawain sa tolda ng pagpupulong, hindi pakikipaglaban. Pinananatili ng “paglilingkod” ang institusyonal na diwa nang hindi nagdaragdag ng militar o simbolikong kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang “tolda ng pagpupulong” bilang tuwirang katawagan at “bibilangin mo” upang mapanatili ang anyong utos sa ikalawang panauhang isahan.
