  text: And those counted from them by their clans were two thousand seven hundred and fifty.
translation:
  language: tl
  text: At ang mga nabilang sa kanila ayon sa kani-kanilang angkan ay dalawang libo at pitong daan at limampu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: At ... ay
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay, habang pinananatili ng payak na konstruksiyong “At ... ay” ang kopular na diwa nang walang idinagdag na diin.
- source_word: פְקֻדֵיהֶם
  choice: ang mga nabilang sa kanila
  rationale: Sa konteksto ng sensus o pagtitipon, tumutukoy ito sa mga naitala o nabilang. Pinananatili ng salin ang pasibong diwa at hindi nagdaragdag ng “mga lalaki,” na hindi tahasang nasa pariralang Hebreo rito.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה ay karaniwang tumutukoy sa angkan bilang subdibisyon ng lipi. Likas sa Filipino ang “kani-kanilang” para ipahayag ang pronominal na hulaping maramihan at ang pag-uuri ayon sa mga angkan.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: dalawang libo at pitong daan at limampu
  rationale: Isinulat sa mga salita ang eksaktong bilang na 2,750, ayon sa ayos at kahulugan ng bilang sa Hebreo.
