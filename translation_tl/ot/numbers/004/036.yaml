translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang bokabularyo ng sensus at ang “angkan” upang tumpak na ipakita ang estrukturang pampamilya ng Israel nang hindi maging teknikal o makaluma.
