  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: tl
  text: 'Ito ang tungkulin ng mga angkan ng mga Gershonita: maglingkod at magdala ng mga karga.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maglingkod at magpasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Ito ang
  rationale: Ang pambabaeng demonstratibong isahan ay nagpapakilala sa pahayag; likas sa Tagalog ang nominal na hulma na “Ito ang.”
- source_word: עֲבֹדַת
  choice: paglilingkod
  rationale: Saklaw ng עֲבֹדָה ang paglilingkod, gawain, o tungkulin. Pinananatili ng “paglilingkod” ang kontekstong Levitiko nang hindi nililimitahan ito sa karaniwang trabaho.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Tumutukoy ang pangmaramihang construct sa mga pangkat ng magkakamag-anak sa loob ng mga Gershonita; mas angkop dito ang “mga angkan” kaysa sa sambahayang nuklear na maaaring ipahiwatig ng “mga pamilya.”
- source_word: הַגֵּרְשֻׁנִּי
  choice: mga Gershonita
  rationale: Kolektibong gentilic ito para sa mga inapo o pangkat ni Gershon; natural sa Tagalog ang maramihang “mga Gershonita.”
- source_word: לַעֲבֹד
  choice: ang maglingkod
  rationale: Ang infinitive construct na may ל ay nagsasaad ng gawain o layunin. Ang “maglingkod” ay tuwirang katumbas at iniiwasan ang mabigat na pag-uulit ng “paglilingkod para sa paglilingkod.”
- source_word: וּלְמַשָּׂא
  choice: at magdala
  rationale: Ang מַשָּׂא ay maaaring tumukoy sa karga, pasanin, o pagdadala. Sa konteksto ng mga tungkulin sa tabernakulo, malinaw at likas ang “magdala,” habang inilalagay sa talababa ang mas tahasang alternatibo.
