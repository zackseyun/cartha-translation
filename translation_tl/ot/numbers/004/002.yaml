  verdict: revise
  source_fidelity: Tama ang pangunahing diwa ng utos na bilangin ang mga anak ni Kohat bilang pangkat na mula sa mga anak ni Levi. Gayunman, ang panandang talababa ay nakalagay sa “Levi” kahit ang paliwanag nito ay para sa Hebreong idyomang isinaling “Ibilang.” Ang “mga sambahayan ng kanilang mga ninuno” ay katanggap-tanggap, ngunit kailangang gawing malinaw na maramihang yunit ito, gaya ng nasa Hebreo.
  naturalness: Likas at angkop sa modernong Filipino ang “Ibilang mo” at “ayon sa kanilang mga angkan.” Mas malinaw ang “mula sa hanay ng” para sa diwang “from among,” at ang plural na “mga sambahayan” ay mas maayos sa pangungusap.
  terminology: Napananatili ang genealogical na “mga anak ni Kohat” at “mga anak ni Levi.” Ang “angkan” ay angkop para sa מִשְׁפָּחָה. Ang “mga sambahayan ng kanilang mga ninuno” ay pinananatili bilang natural na katumbas ng mga paternal ancestral houses nang hindi binabawasan ito sa pangkalahatang “pamilya.”
