  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: tl
  text: “Ibilang[a] mo ang mga anak ni Kohat mula sa hanay ng mga anak ni Levi, ayon sa kanilang mga angkan at mga sambahayan ng kanilang mga ninuno.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Itaas mo ang ulo ng mga anak ni Kohat,” isang idyomang nangangahulugang bilangin o magsagawa ng sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Ibilang
  rationale: Ang buong parirala ay isang idyoma para sa pagbibilang o pagsasagawa ng sensus. Likas at malinaw sa modernong Filipino ang “ibilang,” at ipinahihiwatig ng konteksto ang opisyal na pagtatala.
- source_word: בְּנֵי קְהָת
  choice: mga anak ni Kohat
  rationale: Pinananatili nito ang genealogical na anyo ng Hebreo at ang pagkakatulad sa kasunod na “mga anak ni Levi.”
- source_word: מִתּוֹךְ
  choice: mula sa
  rationale: Ipinapakita nito na ang mga anak ni Kohat ay pangkat na kabilang at pinipili mula sa mas malaking pangkat ng mga anak ni Levi; hindi na kailangang idagdag ang mas mabigat na “mula sa gitna ng.”
- source_word: בְּנֵי לֵוִי
  choice: mga anak ni Levi
  rationale: Tapat ito sa genealogical na pananalita ng Hebreo at kaagapay ng “mga anak ni Kohat.”
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa konteksto ng talaangkanan at sensus, ang מִשְׁפָּחָה ay tumutukoy sa pangkat ng magkakamag-anak o angkan. Nililinaw ng “kani-kanilang” ang distributibong diwa.
- source_word: לְבֵית אֲבֹתָם
  choice: sambahayan ng kanilang mga ninuno
  rationale: Ang parirala ay tumutukoy sa kinship-administrative na yunit na nakabatay sa linya ng ama. Ang “sambahayan ng kanilang mga ninuno” ay dignified at mas natural kaysa sa literal na “bahay ng kanilang mga ama,” nang hindi ito pinapantay lamang sa “pamilya.”
