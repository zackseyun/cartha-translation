translation_notes:
  register: Gumamit ng modernong, malinaw, at marangal na Filipino. Pinanatili ang genealogical na “mga anak ni” at ang dalawang antas ng pagkakaugnay—angkan at sambahayan ng mga ninuno—habang isinalin ang Hebreong idyoma ayon sa aktuwal nitong kahulugan.
