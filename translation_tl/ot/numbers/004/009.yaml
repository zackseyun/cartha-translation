base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: tl
  text: Pagkatapos, kukuha sila ng telang asul[a] at tatakpan nila ang patungan ng ilawan para sa pagbibigay-liwanag, kasama ang mga ilawan nito, mga sipit, mga lalagyan ng baga, at lahat ng sisidlan nito para sa langis na ginagamit nila sa paglilingkod dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “telang asul-lila.” Ang Hebreong תְּכֵלֶת (tekhelet) ay tumutukoy sa natatanging tininaang tela na ginagamit sa mga kagamitan ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: telang asul
  rationale: Ang בֶּגֶד ay tumutukoy rito sa tela, hindi sa kasuutan. Ang תְּכֵלֶת ay natatanging tina o telang kulay asul hanggang asul-lila na ginagamit sa mga kagamitan ng tabernakulo; likas at malinaw sa modernong Tagalog ang “telang asul,” habang nasa talababa ang mas tiyak na pagkakaiba ng kulay.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: ang patungan ng ilawan para sa liwanag
  rationale: Ang מְנוֹרָה ay patungan ng ilawan, at ang הַמָּאוֹר ay liwanag o pagbibigay-liwanag. Ipinapakita ng “para sa liwanag” ang malamang na gamit ng pariralang genitibo nang hindi ito labis na ipinapaliwanag.
- source_word: נֵרֹתֶיהָ
  choice: ang mga ilawan nito
  rationale: Ang נֵר ay ilawan o ningas ng ilawan. Dito, malinaw na tumutukoy ito sa bawat ilawang nakakabit o kaugnay ng patungan.
- source_word: מַלְקָחֶיהָ
  choice: mga sipit
  rationale: Ang salita ay tumutukoy sa kasangkapang panghawak sa mitsa o apoy. Ang “mga sipit” ay malawak, natural, at hindi nagpapanggap ng katiyakang wala sa Hebreo.
- source_word: מַחְתֹּתֶיהָ
  choice: mga lalagyan ng baga
  rationale: Maaaring mangahulugan ang מַחְתָּה ng firepan o insensaryo. Sa konteksto ng pag-aasikaso sa mga ilawan, ang “lalagyan ng baga” ay malinaw at umiiwas sa maling pahiwatig na ginagamit ito para sa insenso.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: lahat ng sisidlan nito para sa langis
  rationale: Ang כְּלִים ay mga sisidlan o kagamitan, at ang שֶׁמֶן na may hulapi ay tumutukoy sa langis na kaugnay ng patungan ng ilawan. Pinananatili ng salin ang ugnayang iyon nang natural sa Tagalog.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: na ginagamit nila sa paglilingkod dito
  rationale: Ang שׁרת ay may diwang paglilingkod, lalo na sa kontekstong pangsantuwaryo. Ang בָּהֶם ay instrumental na “sa pamamagitan ng mga iyon”; natural itong naipapahayag sa Tagalog bilang “ginagamit nila,” samantalang ang לָהּ ay pinananatili sa “dito,” na tumutukoy sa patungan ng ilawan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “patungan ng ilawan” sa halip na hiram o teknikal na katawagan, at pinanatili ang bokabularyong pangsantuwaryo sa “paglilingkod” nang hindi nagpapasok ng denominasyonal na paliwanag.
