  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹת֙ בְּנֵ֣י מְרָרִ֔י לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: tl
  text: Ito ang paglilingkod ng mga angkan ng mga anak ni Merari sa lahat ng kanilang tungkulin sa Tolda ng Tagpuan, sa ilalim ng pangangasiwa[a] ni Itamar na anak ni Aaron na pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa kamay ni Itamar,” isang idyoma para sa pangangasiwa o pamamahala.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Ito ang paglilingkod
  rationale: Ang demonstratibo at construct phrase ay nagpapakilala sa kabuuang atas ng mga Merarita. Ang “paglilingkod” ay angkop sa nakatalagang gawaing Levitico at natural sa modernong Tagalog.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: mga angkan ng mga anak ni Merari
  rationale: Ang מִשְׁפְּחֹת ay tumutukoy sa mga pangkat-angkan sa loob ng lipi, samantalang pinananatili ng “mga anak ni Merari” ang anyong genealogical ng Hebreo.
- source_word: לְכָל עֲבֹדָתָם
  choice: sa lahat ng kanilang tungkulin
  rationale: Ipinahahayag nito ang kabuuan ng kanilang mga nakatalagang gawain. Naiiwasan ng “tungkulin” ang alanganing pag-uulit ng “paglilingkod” habang pinananatili ang kahulugang administratibo at kultiko.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Tolda ng Tagpuan
  rationale: Ang אֹהֶל מוֹעֵד ay literal na tolda ng itinakdang pagkikita o tagpuan. Ang “Tolda ng Tagpuan” ay malinaw, marangal, at hindi ipinapalit ang konsepto ng “tipan” sa salitang מוֹעֵד.
- source_word: בְּיַד
  choice: sa ilalim ng pangangasiwa
  rationale: Bagaman literal na “sa pamamagitan ng kamay,” ang idyoma rito ay nagpapahiwatig ng pamamahala o superbisyon ni Itamar sa paglilingkod ng mga Merarita.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: ni Itamar na anak ni Aaron na pari
  rationale: Pinananatili ang mga pangalang pantangi at ang tuwirang pagkakakilanlan kay Itamar sa pamamagitan ng kanyang ama at ng katungkulan nito.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na estruktura at terminolohiyang maiintindihan ng karaniwang mambabasa. Ginamit ang “angkan” para sa pangkat na genealogical at “Tolda ng Tagpuan” upang tapat na katawanin ang אֹהֶל מוֹעֵד.
