translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang mga sinaunang yunit sa halip na tantiyahin ang katumbas na makabagong sukat. Isinaad ang “mga olibo” upang maging natural at maunawaan ang kahulugan ng כָּתִית sa Filipino.
