lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: at ikasampu ng isang efa
  rationale: Pinananatili ang pang-ugnay na ו at ang eksaktong sinaunang sukat; likas sa Filipino ang pariralang “ikasampu ng isang efa.”
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Tumutukoy sa harina na pinong giniling at angkop sa konteksto ng paghahandog.
- source_word: לְמִנְחָה
  choice: bilang handog na pagkaing butil
  rationale: Sa batas ng paghahandog, ang מִנְחָה ay isang handog mula sa butil, hindi lamang pangkalahatang regalo o handog.
- source_word: בְּלוּלָה בְּשֶׁמֶן
  choice: na hinaluan ... ng langis
  rationale: Malinaw at natural na ipinapahayag ang pasibong anyo at ang sangkap na inihalo sa harina.
- source_word: כָּתִית
  choice: langis mula sa dinurog na mga olibo
  rationale: Ipinahahayag ang paraan ng pagkuha sa langis nang mas malinaw kaysa sa literal ngunit malabong “dinurog na langis”; ipinahiwatig ng konteksto na langis ng olibo ang tinutukoy.
- source_word: רְבִיעִת הַהִין
  choice: sangkapat na hin
  rationale: Pinananatili ang eksaktong bahagi at ang sinaunang yunit ng sukat.
