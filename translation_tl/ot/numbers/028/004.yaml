  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: tl
  text: Ihahandog mo ang isang kordero sa umaga, at ihahandog mo ang ikalawang kordero sa pagitan ng mga takipsilim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagitan ng mga takipsilim,” isang tradisyonal na pahayag para sa oras sa bandang dapithapon o huling bahagi ng hapon.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: kordero
  rationale: Tumutukoy ang כֶּבֶשׂ sa batang tupa, karaniwang lalaki sa konteksto ng paghahandog. Likas at malinaw sa modernong Filipino ang “kordero,” habang hindi idinaragdag ang kasariang hindi tahasang inuulit sa talata.
- source_word: אֶחָד
  choice: isang
  rationale: Pinananatili nito ang payak na kardinal na kahulugan ng אֶחָד (“isa”), sa halip na gawing “una,” na ibang ordinal na salita sa Hebreo.
- source_word: תַּעֲשֶׂה
  choice: ihahandog mo
  rationale: Bagaman literal na “gagawin” ang עשה, ginagamit ito rito bilang terminong panghandog; malinaw at natural na ipinahahayag ng “ihahandog mo” ang rituwal na kilos.
- source_word: בַבֹּקֶר
  choice: sa umaga
  rationale: Direkta at natural na katumbas sa Filipino ng pariralang nangangahulugang “sa umaga.”
- source_word: הַשֵּׁנִי
  choice: ikalawang
  rationale: Tuwirang pinananatili ang ordinal na kahulugan ng שֵׁנִי at ang pagkakasunod ng dalawang kordero.
- source_word: בֵּין הָעַרְבָּיִם
  choice: sa pagitan ng mga takipsilim
  rationale: Pinananatili ang natatangi at bahagyang pinagtatalunang anyo ng idyomang Hebreo, literal na “sa pagitan ng mga gabi/takipsilim,” sa halip na tahimik na itakda ang eksaktong oras.
