translation:
  language: tl
  text: at isang lalaking kambing upang ipangtubos para sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maikli at di-ganap ang pahayag sa Hebreo: “at isang lalaking kambing, upang ipangtubos para sa inyo.” Mula sa agarang konteksto ng mga paghahandog, ipinahihiwatig na ito ay bilang handog para sa kasalanan.'
    reason: Ipinaliliwanag ang elipsis sa Hebreo at ang uri ng handog na ipinahihiwatig ng konteksto ngunit hindi tahasang binanggit.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang pariralang konstruktong ito ay tumutukoy sa isang kambing na lalaki sa konteksto ng paghahandog. Likas at malinaw sa modernong Filipino ang “lalaking kambing.”
- source_word: אֶחָד
  choice: isang
  rationale: Tuwirang ipinapahayag ng bilang na ito na iisa ang hayop.
- source_word: לְכַפֵּר
  choice: upang ipangtubos
  rationale: Sa kontekstong saserdotal at panghandog, ang כפר ay tumutukoy sa pagsasagawa ng pagtubos. Ipinapakita ng “ipangtubos” na ang kambing ang gagamiting handog para rito nang hindi nagtatakda ng isang partikular na teorya ng pagtubos.
- source_word: עֲלֵיכֶם
  choice: sa inyo
  rationale: Kasama ng כפר, tinutukoy ng עַל ang mga taong pinatutungkulan o nakikinabang sa pagtubos; natural itong ipinahahayag sa Filipino bilang “sa inyo.”
theological_decisions:
- issue: Ang uri ng handog ay ipinahihiwatig ng konteksto ngunit hindi tahasang inuulit sa talata.
  choice: Hindi idinagdag sa pangunahing teksto ang “bilang handog para sa kasalanan”; pinanatili ang maikling anyo ng Hebreo at ipinaliwanag ito sa talababa.
  alternative: Idagdag ang “bilang handog para sa kasalanan” upang tahasang ipahayag ang tungkuling ipinahihiwatig ng nakapaligid na talaan ng mga handog.
  rationale: Hindi nakasulat sa sugnay ang חטאת (“handog para sa kasalanan”), kaya pinananatili ng salin ang tunay na elipsis. Gayunman, ipinababatid ng talababa ang malinaw na pahiwatig ng agarang konteksto nang hindi ito ipinapasok bilang tahasang salita ng talata.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang “ipangtubos” bilang maikli ngunit teknikal na angkop na salita sa konteksto ng paghahandog; iniwasan ang mas kahoy na “gumawa ng pagtubos” at ang posibleng moralistikong dating ng “magbayad-sala.”
