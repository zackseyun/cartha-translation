revisions:
- from: Katulad ng mga ito ang ihahandog ninyo araw-araw sa loob ng pitong araw bilang pagkain[a]—isang handog na pinaraan sa apoy, na may samyong kalugod-lugod kay Yahweh. Ihahandog ito bukod pa sa palagiang handog na sinusunog at sa handog na inumin nito.
  to: 'Katulad ng mga ito, maghahandog kayo araw-araw sa loob ng pitong araw: pagkain[a] na handog na iniaalay sa pamamagitan ng apoy, isang samyong kalugod-lugod para kay Yahweh. Ihahandog ito bukod pa sa palagiang handog na sinusunog at sa handog na inumin nito.'
  rationale: Inayos ang pananalita para sa mas likas na modernong Filipino at pinalitan ang “pinaraan sa apoy” ng pananalitang mas malinaw na nagsasaad ng handog na iniaalay sa pamamagitan ng apoy. Pinanatili ang paghahambing, ang sakripisyal na metapora ng samyo, ang pangalang Yahweh, at ang ugnayan ng handog na ito sa regular na handog na sinusunog at sa handog na inumin nito.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:10:39Z'
