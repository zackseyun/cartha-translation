  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: tl
  text: 'Katulad ng mga ito, maghahandog kayo araw-araw sa loob ng pitong araw: pagkain[a] na handog na iniaalay sa pamamagitan ng apoy, isang samyong kalugod-lugod para kay Yahweh. Ihahandog ito bukod pa sa palagiang handog na sinusunog at sa handog na inumin nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pagkain [o tinapay] ng isang handog na iniaalay sa pamamagitan ng apoy.” Dito, ang “pagkain” ay tumutukoy sa panustos na inihahandog, hindi lamang sa literal na tinapay.
    reason: cultural_note
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: Katulad ng mga ito
  rationale: 'Pinananatili nito ang paghahambing na ipinahihiwatig ng unlaping כ: ang mga handog sa bawat araw ay katulad ng mga kababanggit lamang.'
- source_word: תַּעֲשׂוּ
  choice: ang ihahandog ninyo
  rationale: Bagaman karaniwang nangangahulugang “gawin,” likas at tumpak sa konteksto ng paghahandog ang “ihandog.”
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: araw-araw sa loob ng pitong araw
  rationale: Malinaw nitong ipinapahayag na uulitin ang paghahandog sa bawat isa sa pitong araw.
- source_word: לֶחֶם אִשֵּׁה
  choice: bilang pagkain—isang handog na pinaraan sa apoy
  rationale: Ang לֶחֶם ay maaaring tumukoy sa pagkain o panustos na inihahandog, hindi lamang sa literal na tinapay; pinananatili rin ang hiwalay na larawan ng אִשֵּׁה.
- source_word: רֵיחַ נִיחֹחַ
  choice: na may samyong kalugod-lugod
  rationale: Natural na Filipino ito para sa pormulang pansakripisyong nagsasaad ng pagtanggap at pagkalugod, habang pinananatili ang metapora ng samyo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang pangalang tipan na יהוה sa tekstong Hebreo.
- source_word: עַל עוֹלַת הַתָּמִיד
  choice: bukod pa sa palagiang handog na sinusunog
  rationale: Sa ritwal na kontekstong ito, ang עַל ay nagpapahiwatig ng pagdaragdag, at ang הַתָּמִיד ay tumutukoy sa palagiang handog.
- source_word: יֵעָשֶׂה וְנִסְכּוֹ
  choice: Ihahandog ito ... at sa handog na inumin nito
  rationale: Ang pasibong עשה ay natural na “ihahandog” sa kontekstong ito, at ang hulaping panlalaki sa וְנִסְכּוֹ ay tumutukoy sa palagiang handog na sinusunog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng “samyong kalugod-lugod”
  choice: Pinanatili bilang metapora ng pagtanggap ng Diyos
  alternative: handog na tinatanggap ni Yahweh
  rationale: Hindi ginawang lantad na abstraktong pahayag ang metapora ng Hebreo; sa gayon ay napapanatili ang wika at teolohikal na tensiyon ng tekstong pinagmulan.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “handog na pinaraan sa apoy” upang maging malinaw sa karaniwang mambabasa, at “palagiang handog na sinusunog” upang mapanatili ang ritwal na terminolohiya nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
