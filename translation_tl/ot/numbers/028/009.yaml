id: NUM.28.9
reference: Numbers 28:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: tl
  text: 'At sa araw ng Sabat: dalawang korderong lalaki na tig-iisang taóng gulang at walang kapintasan; dalawang ikasampu ng isang efa[a] ng pinong harina bilang handog na butil, na hinaluan ng langis; at ang handog na inumin nito.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga batas tungkol sa paghahandog, ang “dalawang ikasampu” ay dalawang ikasampung bahagi ng isang efa.
    reason: cultural_note
  - marker: b
    text: O, “ang ibinubuhos na handog nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: At sa araw ng Sabat
  rationale: Pinananatili ng “At” ang pang-ugnay sa naunang mga tagubilin, at natural na katumbas ng הַשַּׁבָּת ang kinikilalang katawagang “Sabat.”
- source_word: שְׁנֵי כְבָשִׂים
  choice: dalawang korderong lalaki
  rationale: Ang כְבָשִׂים ay mga batang tupa; nililinaw ng “lalaki” ang kasariang ipinahihiwatig ng anyong panlalaki sa kontekstong panghandog.
- source_word: בְּנֵי שָׁנָה
  choice: tig-iisang taóng gulang
  rationale: Ang literal na idyomang “mga anak ng isang taon” ay tumutukoy sa edad ng bawat kordero; malinaw ito sa makabagong Tagalog.
- source_word: תְּמִימִם
  choice: walang kapintasan
  rationale: Sa batas tungkol sa paghahandog, tumutukoy ito sa mga hayop na walang depekto.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dalawang ikasampu ng isang efa
  rationale: Ang עִשָּׂרוֹן ay isang ikasampung bahagi ng efa sa mga tagubilin tungkol sa handog; tahasang binabanggit ang yunit upang maging malinaw.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang pinong giniling na harinang ginagamit sa mga handog.
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa kontekstong ito, ito ay handog na mula sa butil, hindi lamang isang pangkalahatang regalo o handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Likas at tuwirang inilalarawan nito ang harinang inihalo sa langis.
- source_word: וְנִסְכּוֹ
  choice: at ang handog na inumin nito
  rationale: Ang נֶסֶךְ ay likidong ibinubuhos bilang kalakip na handog. Pinananatili ng “nito” ang panghalip na hulapi sa Hebreo nang hindi labis na tinutukoy ang antecedent nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sabat,” “kordero,” at “handog na butil” bilang pamilyar ngunit tiyak na mga katawagang pambibliya. Ang mga semicolon ay naghihiwalay sa tatlong sangkap ng utos at tumutugma sa sintaktikong ayos ng Hebreo.
