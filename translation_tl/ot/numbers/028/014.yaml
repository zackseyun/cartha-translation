base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: tl
  text: 'At ang mga handog nilang inumin ay: kalahating hin ng alak para sa toro, sangkatlong hin para sa lalaking tupa, at sangkapat na hin para sa kordero. Ito ang buwanang handog na sinusunog para sa bawat buwan, na iniaalay sa buwan nito, sa buong taon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ito ang handog na sinusunog para sa bagong buwan, sa buwan nito, para sa mga buwan ng taon.” Ang salitang Hebreo na חֹדֶשׁ ay maaaring mangahulugang “buwan” o “bagong buwan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: mga handog na inumin na kasama ng mga iyon
  rationale: Ang נֶסֶךְ ay handog na ibinubuhos; ang “handog na inumin” ay malinaw at karaniwang katawagan sa kontekstong paghahandog. Ipinahahayag ng “na kasama ng mga iyon” ang panghalip na tumutukoy sa naunang mga handog.
- source_word: חֲצִי הַהִין
  choice: kalahating hin
  rationale: Pinananatili ang sinaunang yunit na hin at natural na ipinapahayag sa Filipino ang bahaging kalahati.
- source_word: לַפָּר
  choice: para sa toro
  rationale: Tuwirang isinasalin ang isahang pangngalang may pantukoy bilang ang itinakdang hayop na ihahandog.
- source_word: וּשְׁלִישִׁת הַהִין
  choice: sangkatlong hin
  rationale: Maikli at natural na Filipino para sa isang-katlo ng isang hin.
- source_word: לָאַיִל
  choice: para sa lalaking tupa
  rationale: Tiyak na ipinahahayag ang אַיִל bilang adultong lalaking tupa, hindi lamang pangkalahatang “tupa.”
- source_word: וּרְבִיעִת הַהִין
  choice: sangkapat na hin
  rationale: Natural na katumbas ng isang-kapat habang pinananatili ang sinaunang sukat.
- source_word: לַכֶּבֶשׂ
  choice: para sa kordero
  rationale: Ang “kordero” ay dignified at madaling maunawaang katawagan sa batang tupa sa kontekstong sakripisyal.
- source_word: יָיִן
  choice: alak
  rationale: Tinutukoy ng יָיִן ang sangkap ng lahat ng nakalistang handog na inumin. Inilipat ito bago ang listahan upang maging malinaw at natural sa Filipino nang hindi binabago ang saklaw nito.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: Ito ang buwanang handog na sinusunog
  rationale: Maaaring mangahulugan ang חֹדֶשׁ ng “buwan” o “bagong buwan.” Ang pangunahing salin ay naghahayag ng paulit-ulit na buwanang pag-aalay, samantalang pinananatili sa talababa ang leksikal na alternatibo.
- source_word: בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה
  choice: para sa bawat buwan sa buong taon
  rationale: Natural na ipinahahayag ang distributibong pag-uulit ng handog sa lahat ng buwan ng taon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang yunit na “hin” sa halip na tumbasan ng makabagong sukat. Isinaayos ang posisyon ng “alak” upang luminaw na ito ang laman ng lahat ng handog na inumin. Ang marcador na [a] ay inilagay sa dulo ng pangungusap na saklaw ng alternatibong pagbasa.
