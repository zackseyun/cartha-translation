- from: 'At ang mga handog na inumin na kasama ng mga iyon ay alak: kalahating hin para sa toro, sangkatlong hin para sa lalaking tupa, at sangkapat na hin para sa kordero. Ito ang buwanang handog na sinusunog para sa bawat buwan sa buong taon.[a]'
  to: 'At ang mga handog nilang inumin ay: kalahating hin ng alak para sa toro, sangkatlong hin para sa lalaking tupa, at sangkapat na hin para sa kordero. Ito ang buwanang handog na sinusunog para sa bawat buwan, na iniaalay sa buwan nito, sa buong taon.[a]'
