revisions:
- from: 'At sabihin mo sa kanila, “Ito ang handog na pinaraan sa apoy[a] na ihahandog ninyo kay Yahweh: araw-araw, dalawang lalaking kordero na tig-isang taóng gulang at walang kapintasan bilang palagiang handog na sinusunog.”'
  to: 'At sabihin mo sa kanila, “Ito ang handog na iniaalay ninyo kay Yahweh sa pamamagitan ng apoy: dalawang lalaking kordero na tig-isang taóng gulang at walang kapintasan, bawat araw, bilang palagiang handog na sinusunog.”'
  rationale: Pinalitan ang hindi likas na “pinaraan sa apoy” ng “inaalay ... sa pamamagitan ng apoy,” na mas malinaw na nagsasaad ng kultikong diwa ng אִשֶּׁה nang hindi ipinagpapalagay na literal na pagkain ito para sa Diyos. Inayos din ang ayos ng “bawat araw” upang luminaw na dalawang kordero ang iniaalay araw-araw. Ang talababa para sa alternatibong “handog na pagkain” ay pinanatili.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:10:28Z'
