  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: tl
  text: 'At sabihin mo sa kanila, “Ito ang handog na iniaalay ninyo kay Yahweh sa pamamagitan ng apoy: dalawang lalaking kordero na tig-isang taóng gulang at walang kapintasan, bawat araw, bilang palagiang handog na sinusunog.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Tuwirang ipinahihiwatig ng terminong pangkulto ang handog na inihahain sa pamamagitan ng apoy. Likas ito sa modernong Tagalog at hindi nagpapahiwatig na literal na pinakakain ang Diyos.
- source_word: תַּקְרִיבוּ
  choice: ihahandog ninyo
  rationale: Sa kontekstong sakripisyal, ang Hiphil ng קרב ay nangangahulugang maglapit o magharap bilang handog; malinaw at natural sa Tagalog ang “ihahandog.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: mga lalaking kordero na tig-isang taóng gulang
  rationale: Ipinakikita ng anyong panlalaki at ng idyomang Hebreo ang kasarian at edad ng bawat hayop.
- source_word: תְמִימִם
  choice: walang kapintasan
  rationale: Sa batas tungkol sa paghahandog, tumutukoy ito sa mga hayop na walang pisikal na depekto.
- source_word: לַיּוֹם
  choice: araw-araw
  rationale: 'Kasama ng bilang na dalawa, ipinahihiwatig nito ang distributibong diwa: dalawang kordero sa bawat araw.'
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Ito ang malinaw at nakaugaliang tawag sa handog na ganap na sinusunog sa altar.
- source_word: תָמִיד
  choice: palagian
  rationale: Ipinahihiwatig nito ang regular at patuloy na takdang paghahandog, hindi ang walang-tigil na pagsunog.
theological_decisions:
- issue: Paglalarawan sa הָאִשֶּׁה bilang handog sa apoy o handog na pagkain
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Mas tuwirang sinasalamin ng pangunahing salin ang anyo at gamit ng salitang Hebreo, habang pinananatili sa talababa ang posibleng kultikong diwang “pagkain” nang hindi ipinapalagay na literal na nangangailangan ng pagkain ang Diyos.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang natatanging personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kordero,” “walang kapintasan,” at “handog na sinusunog” upang mapanatili ang tiyak na bokabularyong pangsakripisyo nang hindi maging lipas o labis na teknikal.
