  terminology: Ang “Yahweh,” “lalaking kordero,” “walang kapintasan,” at “handog na sinusunog” ay angkop. Pinananatili ng rebisyon ang pagkakaiba ng אִשֶּׁה (handog sa pamamagitan ng apoy) at עֹלָה (handog na sinusunog), bagaman magkaugnay ang mga ito sa talata.
