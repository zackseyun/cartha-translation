base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: tl
  text: 'At ang handog nilang butil ay pinong harina na hinaluan ng langis: tatlong ikasampu para sa bawat toro[a], at dalawang ikasampu para sa bawat lalaking tupa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tatlong yunit na ikasampu” at “dalawang yunit na ikasampu.” Sa konteksto ng mga handog, karaniwang nauunawaan ang mga ito bilang mga ikasampu ng isang efa.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: At ang handog nilang butil ay
  rationale: Sa konteksto ng paghahandog, ang מִנְחָה ay handog na mula sa butil, hindi isang pangkalahatang regalo. Likas sa Tagalog ang sugnay na may 'ay' para sa Hebreong walang tahasang pandiwa.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang malinaw at karaniwang katawagan sa mataas na uring harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: na hinaluan ng langis
  rationale: Ipinahahayag ng balintiyak na anyo ang paghahanda ng harina sa pamamagitan ng paghahalo rito ng langis.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tatlong ikasampu
  rationale: Ang עִשָּׂרוֹן ay isang yunit na ikasampu; pinananatili sa teksto ang maikling anyo at ipinaliliwanag sa talababa ang ipinapalagay na yunit.
- source_word: לַפָּר הָאֶחָד
  choice: para sa bawat toro
  rationale: Bagaman literal na may 'ang isang toro,' sa talaan ng takdang handog ang distributibong 'bawat toro' ang natural na Tagalog at kaayon ng dami ng mga torong binanggit sa naunang talata.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dalawang ikasampu
  rationale: Tumpak nitong pinananatili ang dalawang yunit na tig-iikasampu nang hindi isinasama sa pangunahing teksto ang yunit na hindi tahasang binanggit.
- source_word: לָאַיִל הָאֶחָד
  choice: para sa bawat lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa. Ang 'bawat' ay natural na naghahatid ng distributibong bisa ng pariralang Hebreo sa reseta para sa bawat hayop.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'handog na butil,' 'pinong harina,' at 'langis' bilang madaling maunawaang mga katawagang pangritwal. Ang 'bawat' ay mas natural kaysa literal na 'ang isang' sa distributibong konteksto ng takdang dami para sa mga hayop.
