lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: Sa ikapitong araw
  rationale: Likas na temporal na pananalita sa Filipino; hindi na kailangang katawanin nang hiwalay ang panimulang pangatnig.
- source_word: מִקְרָא קֹדֶשׁ
  choice: banal na pagtitipon
  rationale: Ipinahahayag ang isang sagradong pagtitipong pormal na itinawag, habang nananatiling malinaw sa karaniwang mambabasa.
- source_word: יִהְיֶה לָכֶם
  choice: magkakaroon kayo
  rationale: Natural na katumbas sa Filipino ng literal na ‘magiging para sa inyo,’ at ang konteksto ang nagpapanatili sa lakas ng utos.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: anumang karaniwang gawain
  rationale: Sa ilalim ng negasyon, ang כָּל ay natural na ‘anumang.’ Ang parirala ay tumutukoy sa regular na gawaing panghanapbuhay o serbisyo, hindi sa lubos na pagbabawal sa bawat kilos.
- source_word: לֹא תַעֲשׂוּ
  choice: Huwag kayong gagawa
  rationale: Direkta at marangal na anyo ng pagbabawal sa modernong Filipino.
