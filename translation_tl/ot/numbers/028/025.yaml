  language: tl
  text: Sa ikapitong araw, magkakaroon kayo ng banal na pagtitipon[a]. Huwag kayong gagawa ng anumang karaniwang gawain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banal na kapulungan” o “sagradong pagtitipon.”
