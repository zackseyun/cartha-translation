  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: tl
  text: Ang handog na inumin para sa bawat kordero[a] ay sangkapat ng isang hin. Sa banal na lugar[b], ibuhos mo bilang handog na inumin para kay Yahweh ang nakalalasing na inumin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa isang kordero”; literal, “para sa iisang kordero.”
    reason: lexical_alternative
  - marker: b
    text: O “Sa santuwaryo.”
    reason: lexical_alternative
  - marker: c
    text: Ang tinutukoy ay isang nakalalasing na inumin na naiiba sa alak; hindi tinukoy ang eksaktong uri nito.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: Ang handog na inumin para rito
  rationale: Tumutukoy ang pangngalan at hulapi sa kasamang likidong handog; natural at malinaw sa kontekstong panghandog ang “handog na inumin.” Sa aktuwal na pangungusap, naipahayag ang kaugnayan nito sa bawat kordero nang hindi mabigat ang literal na “nito.”
- source_word: רְבִיעִת הַהִין
  choice: sangkapat ng isang hin
  rationale: Pinananatili ang eksaktong bahagi at ang sinaunang yunit na “hin” sa halip na tantiyahin sa makabagong sukat.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para sa bawat kordero
  rationale: Bagaman literal na “para sa isang/sa korderong iyon,” ipinahihiwatig ng konteksto ang dami para sa bawat indibiduwal na kordero; itinatala sa talababa ang mas literal na anyo.
- source_word: בַּקֹּדֶשׁ
  choice: Sa banal na lugar
  rationale: Sa kontekstong ritwal, malamang na tumutukoy ito sa sagradong lugar o santuwaryo, hindi sa abstraktong “sa kabanalan.”
- source_word: הַסֵּךְ
  choice: ibuhos mo
  rationale: Ang anyong pautos mula sa נסך ay tumutukoy sa pagbubuhos ng likidong handog; tuwiran at natural ang pautos sa Filipino.
- source_word: נֶסֶךְ
  choice: bilang handog na inumin
  rationale: Pinananatili ang inuulit na pangngalan sa Hebreo at nililinaw ang ritwal na tungkulin ng likido.
- source_word: שֵׁכָר
  choice: nakalalasing na inumin
  rationale: Malawak ang saklaw ng שֵׁכָר at hindi tiyak ang uri; mas tumpak ito kaysa sa “alak” o “serbesa,” na maaaring labis na magtakda ng partikular na inumin.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang יהוה bilang “Yahweh”; ang “para kay” ay likas sa Filipino para sa handog na iniuukol sa isang persona.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalang tipan at hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng שֵׁכָר sa handog na inumin
  choice: nakalalasing na inumin
  alternative: matapang na inumin; serbesa
  rationale: Hindi tinutukoy ng teksto ang eksaktong uri. Ang malawak na salin ay umiiwas sa pagpasok ng hindi tiyak na identipikasyon at pinananatili ang kaibhan nito sa karaniwang salita para sa alak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kordero,” “handog na inumin,” at “banal na lugar” bilang madaling maunawaang mga terminong pangritwal; pinanatili ang sinaunang sukat na “hin” at ang pangalang “Yahweh.”
