base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: tl
  text: at tig-isang ikasampung efa ng pinong harina bilang handog na butil na hinaluan ng langis para sa bawat kordero—bilang isang handog na susunugin nang buo, isang kalugod-lugod na samyo, isang handog na inihandog sa pamamagitan ng apoy para kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “handog na inihandog sa pamamagitan ng apoy” bilang “handog na pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: at tig-isang ikasampung bahagi ng isang efa
  rationale: Ipinahahayag ng inuulit na anyo ang takdang sukat para sa bawat kordero. Idinagdag ang “efa” upang maging malinaw sa makabagong mambabasa ang yunit na ipinahihiwatig ng kontekstong panghandog.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Likas at malinaw na salin ng teknikal na katawagan para sa mahusay na naprosesong harinang ginagamit sa paghahandog.
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa kontekstong ito, tumutukoy ito sa handog na mula sa butil, hindi lamang sa pangkalahatang regalo o handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Direkta at natural na inilalarawan ang harina bilang inihalong kasama ng langis.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para sa bawat kordero
  rationale: 'Pinananatili ang distributibong diwa: ang itinakdang dami ay para sa bawat indibiduwal na kordero.'
- source_word: עֹלָה
  choice: isang handog na sinusunog
  rationale: Isinasalin ang teknikal na katawagan para sa handog na lubusang sinusunog; malinaw rin itong naihihiwalay sa kasunod na אִשֶּׁה.
- source_word: רֵיחַ נִיחֹחַ
  choice: isang kalugod-lugod na samyo
  rationale: Dignidad at likas na Tagalog ang gamit habang pinananatili ang pormulang nagsasaad na ang handog ay katanggap-tanggap sa Diyos.
- source_word: אִשֶּׁה
  choice: isang handog na pinaraan sa apoy
  rationale: Pinananatili ang malinaw na kaugnayan ng kultikong katawagan sa apoy nang hindi ipinapalagay na tiyak ang pinagtatalunang etimolohiya; inilalagay sa talababa ang alternatibong “handog na pagkain.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang pangalang tipan na יהוה.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit ng Hebreo ang Tetragrammaton bilang sariling pangalan. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng kultikong katawagang אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Tiyak ang kaugnayan ng salita sa paghahandog at sa apoy, ngunit pinagtatalunan ang eksaktong pinagmulan at saklaw nito. Inilalahad sa talababa ang mahalagang alternatibo upang hindi maitago ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tig-isang” at “bawat” upang likas na maipahayag ang distributibong diwa ng Hebreo. Ang gitling na em dash ay nagpapakita sa magkakaugnay na paglalarawan sa handog nang hindi nilulutas nang labis ang siksik na nominal na ayos ng orihinal.
