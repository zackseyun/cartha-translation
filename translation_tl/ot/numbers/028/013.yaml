  source_fidelity: Tumpak ang sukat, pinong harina, handog na butil, langis, distributibong “bawat kordero,” at pangalang Yahweh. Gayunman, ang “handog na pinaraan sa apoy” ay hindi natural na katumbas ng אִשֶּׁה at maaaring magpahiwatig ng ibang uri ng ritwal; mas tumpak ang “handog na inihandog sa pamamagitan ng apoy.” Ang עֹלָה ay teknikal na handog na lubusang sinusunog.
  naturalness: Malinaw ang pangungusap, ngunit mas natural at mas ligtas ang “isang ikasampung efa” kaysa “isang ikasampung bahagi ng isang efa,” at ang rebisyon sa אִשֶּׁה ay umiiwas sa maling konotasyon ng “pinaraan sa apoy.”
  terminology: Pinanatili ang “handog na butil,” “Yahweh,” at ang talababang alternatibong “handog na pagkain.” Isinalin ang עֹלָה bilang “handog na susunugin nang buo” upang maipakita ang teknikal na diwa nang hindi ipinapalagay ang doktrinal na paliwanag.
  issues:
