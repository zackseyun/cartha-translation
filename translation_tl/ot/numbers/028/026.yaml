revisions:
- from: At sa araw ng mga unang bunga, kapag naghahandog kayo ng bagong handog na butil kay Yahweh sa inyong Pista ng mga Sanlinggo, magkakaroon kayo ng banal na pagtitipon. Huwag kayong gagawa ng anumang karaniwang gawain.[a]
  to: Sa araw ng mga unang ani, kapag naghahandog kayo kay Yahweh ng bagong handog na butil sa inyong Kapistahan ng mga Sanlinggo, magkakaroon kayo ng banal na pagtitipon. Huwag kayong gagawa ng anumang karaniwang gawain.[a]
  rationale: Inayos ang pambungad para sa likas na Filipino, ginawang 'mga unang ani' ang terminong pangkapistahan, at ginamit ang mas pamantayang 'Kapistahan ng mga Sanlinggo.' Hindi binago ang kahulugan o antas ng katiyakan ng Hebreo. Iningatan din ang wastong anchor ng talababa sa pagbabawal sa paggawa; hindi isinama ang maling pagkakahanay ng mga marker sa English audit trail.
