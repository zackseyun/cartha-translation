  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: tl
  text: Sa araw ng mga unang ani, kapag naghahandog kayo kay Yahweh ng bagong handog na butil sa inyong Kapistahan ng mga Sanlinggo, magkakaroon kayo ng banal na pagtitipon. Huwag kayong gagawa ng anumang karaniwang gawain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anumang mabigat na gawain” o “anumang gawaing panghanapbuhay.” Ang pariralang Hebreo ay tumutukoy sa karaniwang gawaing kaugnay ng pang-araw-araw na trabaho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: At sa araw ng mga unang bunga
  rationale: Pinananatili ang temporal na panimula at ang kultikong diwa ng בִּכּוּרִים bilang mga unang ani o bunga na inihahandog.
- source_word: בְּהַקְרִיבְכֶם
  choice: kapag naghahandog kayo
  rationale: Ang infinitive construct ay nagsasaad ng kasabay na panahon; sa kontekstong pansakripisyo, ang קרב ay likas na isaling ‘maghandog.’
- source_word: מִנְחָה חֲדָשָׁה
  choice: bagong handog na butil
  rationale: Sa kontekstong pari at paghahandog, ang מִנְחָה ay tumutukoy sa handog na butil, at ang חֲדָשָׁה ay ‘bago,’ kaugnay ng bagong ani.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na יהוה bilang Yahweh.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: sa inyong Pista ng mga Sanlinggo
  rationale: Ang parirala ay tumutukoy sa nakatakdang kapistahang kilala bilang Pista ng mga Sanlinggo, hindi lamang sa karaniwang mga linggo.
- source_word: מִקְרָא קֹדֶשׁ
  choice: banal na pagtitipon
  rationale: Malinaw at likas na Tagalog para sa teknikal na pariralang tumutukoy sa sagradong pagtitipong ipinatawag.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: Huwag kayong gagawa ng anumang karaniwang gawain
  rationale: Ipinahahayag ang pagbabawal sa regular na gawaing panghanapbuhay o pang-araw-araw, nang hindi pinalalabas na ipinagbabawal ang lahat ng uri ng kilos.
theological_decisions:
- issue: Pagbibigay ng pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng ipinagbabawal na מְלֶאכֶת עֲבֹדָה
  choice: karaniwang gawain
  alternative: mabigat na gawain; gawaing panghanapbuhay
  rationale: Hindi tahasang nilulutas nang higit sa teksto kung ‘mabigat,’ ‘panghanapbuhay,’ o pangkaraniwang trabaho ang diin; ang pangunahing teksto ay gumagamit ng malawak at natural na katumbas, at inilalagay sa talababa ang mga leksikal na posibilidad.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Pista ng mga Sanlinggo’ bilang madaling maunawaang pangalan ng kapistahan, at ‘banal na pagtitipon’ bilang natural na katumbas ng teknikal na pariralang kultiko. Itinama ang pagkakalagay ng mga talababa batay sa mismong mga alternatibong leksikal: walang talababa sa ‘mga unang bunga’ dahil ang ibinigay na English footnote ay hindi tumutugma rito; ang tanging marker ay inilagay sa pagbabawal sa karaniwang gawain.'
