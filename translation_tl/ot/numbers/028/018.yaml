lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Sa unang araw
  rationale: Tuwirang ipinapahayag ang panahong tinutukoy nang hindi idinaragdag ang “ng kapistahan,” na mula lamang sa konteksto at hindi hayag sa talata.
- source_word: מִקְרָא קֹדֶשׁ
  choice: banal na pagtitipon
  rationale: Ipinahihiwatig ng takdang pariralang pangkulto ang isang sagradong pagtitipong itinawag; natural at marangal sa modernong Tagalog ang “banal na pagtitipon.”
- source_word: כָּל ... לֹא
  choice: huwag ... anumang
  rationale: Likas na Tagalog na pagpapahayag ito ng lubos na pagbabawal na taglay ng konstruksiyong Hebreo.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: karaniwang trabaho
  rationale: Tumutukoy ang parirala sa regular o pangkabuhayang gawain na ipinagbabawal sa araw ng kapistahan, hindi sa ganap na lahat ng pagkilos.
- source_word: לֹא תַעֲשׂוּ
  choice: Huwag kayong gagawa
  rationale: Pinananatili ang pangmaramihang pagtukoy at ang mariing lakas ng utos sa natural na modernong Tagalog.
