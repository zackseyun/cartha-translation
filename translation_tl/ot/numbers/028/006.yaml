base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: tl
  text: Ito ang palagiang handog na sinusunog[a], na ginawa sa Bundok Sinai[b], bilang kaaya-ayang samyo[c], isang handog na pinaraan sa apoy[d] para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tuluy-tuloy na handog na sinusunog.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na itinatag sa Bundok Sinai” o “na inihandog sa Bundok Sinai.” Ang participle sa Hebreo ay literal na “ginawa”; maaaring tumukoy ito sa handog na isinagawa o itinatag sa Sinai.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “bilang samyong nakapagpapalugod” o “bilang nakapagpapahinahong samyo.” Isa itong idyomang pangsakripisyo na nagpapahiwatig na kalugud-lugod o katanggap-tanggap ang handog.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “isang handog na pagkain.” Tradisyonal na isinasalin ang terminong Hebreo bilang “handog sa pamamagitan ng apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת
  choice: handog na sinusunog
  rationale: Karaniwang katawagang pangsakripisyo para sa handog na lubusang sinusunog; malinaw at likas sa modernong Filipino.
- source_word: תָּמִיד
  choice: palagian
  rationale: Ipinapahayag ang regular at nagpapatuloy na iskedyul ng handog nang hindi ipinahihiwatig na walang tigil ang pagsunog.
- source_word: הָעֲשֻׂיָה
  choice: inihandog
  rationale: Ang participle ay literal na 'ginawa'; sa kontekstong pangsakripisyo, natural ang 'inihandog,' habang pinananatili sa talababa ang mas literal at posibleng institusyonal na diwa.
- source_word: בְּהַר סִינַי
  choice: sa Bundok Sinai
  rationale: Natural na pagtukoy sa lokasyon; hindi nito sapilitang nilulutas kung aktuwal na inihandog o itinatag doon ang ritwal.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: bilang kaaya-ayang samyo
  rationale: Pinananatili ang imaheng pangsakripisyo at ang diwa ng kalugud-lugod na pagtanggap.
- source_word: אִשֶּׁה
  choice: isang handog na pinaraan sa apoy
  rationale: Pinananatili ang malinaw na kaugnayan ng bihirang terminong kultiko sa apoy, sa halip na ipakahulugan agad bilang pagkain.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה at ang direksiyon ng paghahandog.
theological_decisions:
- issue: Pagpapakahulugan sa הָעֲשֻׂיָה בְּהַר סִינַי
  choice: na inihandog sa Bundok Sinai
  alternative: na itinatag sa Bundok Sinai
  rationale: Mas malapit ang pangunahing teksto sa literal na 'ginawa/inihandog,' ngunit ang posibleng pagtukoy sa pagkakatatag ng ritwal sa Sinai ay tahasang pinananatili sa talababa.
- issue: Idiomang kultiko na רֵיחַ נִיחֹחַ
  choice: kaaya-ayang samyo
  alternative: samyo na nakapagpapalugod
  rationale: Ipinahahayag ang pagtanggap ng Diyos sa handog nang hindi ipinapasok ang isang tiyak na teorya ng pagpapayapa.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang pinananatili ang pangalan ng Diyos sa tekstong Hebreo.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Kontrobersiyal ang eksaktong etimolohiya at saklaw ng termino; ang saling may 'apoy' ay tradisyonal at mas pormal, samantalang ang alternatibo ay maaaring magpatingkad sa tungkulin nitong handog na pagkain.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang mga katawagang pangsakripisyo nang malinaw ngunit hindi labis na teknikal; pinanatili sa mga talababa ang mahahalagang alternatibong leksikal at ang tunay na kalabuan tungkol sa Sinai.
