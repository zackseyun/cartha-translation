  terminology: Ang “handog na sinusunog,” “toro,” “lalaking tupa,” “lalaking kordero,” at “walang kapintasan” ay angkop na mga terminong pansakripisyo. Pinananatili ang Yahweh para sa Tetragrammaton. Ang talababa ay inaayos upang tumugma sa binagong salin ng אִשֶּׁה.
