base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: tl
  text: 'At maghahandog kayo kay Yahweh ng handog na inihahandog sa apoy[a] bilang handog na sinusunog: dalawang toro, isang lalaking tupa, at pitong lalaking korderong tig-iisang taon; dapat na walang kapintasan ang mga ito para sa inyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog na ginawa sa pamamagitan ng apoy.” Teknikal na katawagang pansakripisyo ang salitang Hebreo para sa handog na tinutupok o pinauusok sa apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: maghahandog kayo
  rationale: Sa kontekstong pansakripisyo, ang Hifil ng קרב ay nangangahulugang magharap o mag-alay ng handog. Ang “maghahandog” ay natural at malinaw sa modernong Tagalog.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Teknikal itong terminong pansakripisyo para sa handog na sinusunog o ginagawang usok sa apoy. Pinananatili ng salin ang kaugnayan sa apoy nang hindi ito ipinagkakamaling karaniwang pagkain.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Ito ang handog na lubusang sinusunog sa altar; malinaw at kinikilalang katawagang pansakripisyo ang napiling salin.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol ל ay nagpapahiwatig na inihahandog ito kay Yahweh, at tuwirang pinananatili ang pangalan ng Diyos na nasa Hebreo.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: dalawang toro
  rationale: Ang pariralang Hebreo ay tumutukoy sa dalawang lalaking baka; sapat at natural sa Tagalog ang “dalawang toro” nang hindi nagdaragdag ng hindi tiyak na edad.
- source_word: וְאַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Tumpak na ipinakikita ang uri at kasarian ng hayop sa karaniwang modernong Tagalog.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: pitong lalaking korderong tig-iisang taon
  rationale: Pinananatili ang bilang, kasarian, at edad ng bawat kordero; ipinakikita ng “tig-iisang taon” na ang edad ay para sa bawat isa.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Ang mga ito ay dapat na walang kapintasan
  rationale: Sa kontekstong pansakripisyo, תמים ay nangangahulugang walang depekto. Ipinahahayag ng “dapat” ang kinakailangang kalagayan ng mga hayop, samantalang likas na naipapaloob sa “maghahandog kayo” ang pananagutan ng mga tagapakinig na nasa לָכֶם.
theological_decisions:
- issue: Pagpapahayag sa pangalan na יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tuwirang pangalan ng Diyos ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng אִשֶּׁה at עֹלָה
  choice: “handog na pinaraan sa apoy” bilang masaklaw na katawagan, na tinutukoy rito bilang “handog na sinusunog”
  alternative: Ituring ang dalawang parirala bilang dalawang magkahiwalay na handog
  rationale: 'Nasa apposition ang mga termino sa sugnay: inilalarawan ng עֹלָה kung anong uri ng אִשֶּׁה ang ihahandog. Iniiwasan ng salin ang impresyong dalawang hiwalay na sakripisyo ang hinihingi.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “maghahandog” at mga payak na pangalan ng hayop; iniwasan ang sobrang literal na ayos ng Hebreo. Ang marker na [a] ay inilagay agad matapos ang pariralang tinutukoy nito.
