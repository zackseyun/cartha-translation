base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: tl
  text: 'At maghahandog kayo ng handog na sinusunog para kay Yahweh bilang samyo na kalugod-lugod kay Yahweh: dalawang toro mula sa kawan ng baka, isang lalaking tupa, at pitong lalaking korderong tig-iisang taong gulang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bilang nakapapawing samyo para kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: maghahandog kayo
  rationale: Sa konteksto ng paghahain, ang Hiphil ng קרב ay tumutukoy sa pagdadala o paghahandog ng hain. Likas at malinaw sa Filipino ang “maghahandog.”
- source_word: עוֹלָה
  choice: handog na sinusunog
  rationale: Karaniwang katawagan ito sa haing lubusang sinusunog. Mas nauunawaan ito ng pangkalahatang mambabasa kaysa sa literal-etimolohikong “handog na umaakyat.”
- source_word: לְרֵיחַ נִיחֹחַ
  choice: bilang samyong kalugod-lugod sa kanya
  rationale: Ipinahahayag ng pormulang panghain ang pagiging katanggap-tanggap at kasiya-siya ng handog kay Yahweh. Pinananatili ng “samyo” ang larawang pandama nang hindi nagmumukhang karaniwang amoy lamang.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: dalawang toro mula sa bakahan
  rationale: Pinananatili ang bilang, uri ng hayop, at kaugnayan nito sa bakahan nang hindi nagdaragdag ng edad na hindi tahasang sinabi sa Hebreo.
- source_word: אַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Malinaw na katumbas sa modernong Filipino ng isang ram.
- source_word: שִׁבְעָה כְבָשִׂים
  choice: pitong lalaking kordero
  rationale: Pinananatili ang tiyak na kasariang ipinahihiwatig ng pangngalang Hebreo.
- source_word: בְּנֵי שָׁנָה
  choice: tig-iisang taong gulang
  rationale: Ipinakikita ng “tig-” na ang itinakdang edad ay para sa bawat isa sa pitong kordero.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng pormulang לְרֵיחַ נִיחֹחַ
  choice: samyong kalugod-lugod sa kanya
  alternative: nakapapawing samyo para sa kanya
  rationale: Ang pangunahing salin ay natural at ipinahahayag ang pagtanggap ng Diyos sa handog, habang itinatala sa talababa ang posibleng diwang “nakapapawi” nang hindi ipinipilit ang isang paliwanag sa metapora.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong panghain at iniwasan ang sobrang teknikal o arkaikong pananalita.
