  to: 'At maghahandog kayo ng handog na sinusunog para kay Yahweh bilang samyo na kalugod-lugod kay Yahweh: dalawang toro mula sa kawan ng baka, isang lalaking tupa, at pitong lalaking korderong tig-iisang taong gulang.[a]'
