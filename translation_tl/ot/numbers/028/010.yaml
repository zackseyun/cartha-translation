  text: עֹלַ֥ת שַׁבַּ֖ת בְּ/שַׁבַּתּ֑/וֹ עַל עֹלַ֥ת הַ/תָּמִ֖יד וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: tl
  text: Ang handog na sinusunog para sa Sabbath ay ihahandog tuwing Sabbath, bukod pa sa palagiang handog na sinusunog at sa handog na inumin nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת
  choice: handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog sa altar. Ang “handog na sinusunog” ang malinaw at karaniwang salin sa kontekstong ito.
- source_word: שַׁבַּת
  choice: Sabbath
  rationale: Sa kalendaryo ng mga handog, tumutukoy ito sa araw ng Sabbath, hindi sa isang linggo sa pangkalahatan.
- source_word: בְּשַׁבַּתּוֹ
  choice: tuwing Sabbath
  rationale: 'Ang parirala ay may distributibong diwa: inihahandog ito sa bawat pagdating ng Sabbath. Likas at malinaw itong ipinapahayag ng “tuwing Sabbath.”'
- source_word: עַל
  choice: bukod pa sa
  rationale: Sa mga tagubilin tungkol sa paghahandog, ipinakikita rito na idinaragdag ang handog para sa Sabbath sa palagiang handog.
- source_word: הַתָּמִיד
  choice: palagiang
  rationale: Ipinahihiwatig ng תָּמִיד ang regular at patuloy na inihahandog ayon sa itinakdang tuntunin.
- source_word: וְנִסְכָּהּ
  choice: at sa handog na inumin nito
  rationale: Ang נֶסֶךְ ay handog na ibinubuhos na kasama ng pangunahing handog; ang hulaping pambabae ay tumutukoy pabalik sa handog na sinusunog.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang terminong “Sabbath” dahil tiyak itong katawagang pangkalendaryo at pangkulto. Isiningit ang pandiwang “ihahandog” upang maging ganap at natural ang pangungusap sa Filipino, nang hindi nagdaragdag ng bagong tagubilin sa diwa ng Hebreo.
