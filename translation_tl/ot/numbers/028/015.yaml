  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: tl
  text: Ang isang lalaking kambing bilang handog para sa kasalanan ay ihahandog kay Yahweh, bukod pa sa palagiang handog na sinusunog at sa handog na inumin nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa handog na may kinalaman kapuwa sa karumihan at sa kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Malinaw na tinutukoy ng parirala ang isang kambing na lalaki; pinananatili ng salin ang kasariang tahasang nakasaad sa Hebreo.
- source_word: אֶחָד
  choice: isang
  rationale: Pinananatili ang bilang dahil bahagi ito ng tiyak na tagubilin tungkol sa handog.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Karaniwan at madaling maunawaang katawagan ito sa kontekstong pansakripisyo, habang inilalahad sa talababa ang lehitimong alternatibong ‘handog para sa paglilinis.’
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang יהוה bilang ‘Yahweh’; natural sa Filipino ang ‘kay’ para sa handog na inihahandog sa isang persona.
- source_word: עַל
  choice: bukod pa sa
  rationale: Sa kontekstong ito, ipinahihiwatig ng עַל na ang handog ay dagdag sa palagiang handog, hindi literal na nasa ibabaw nito.
- source_word: עֹלַת הַתָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Ipinahahayag nito ang takda at patuloy na handog, nang hindi higit na tinutukoy bilang ‘araw-araw’ sa mismong salin.
- source_word: יֵעָשֶׂה
  choice: ihahandog
  rationale: Bagaman literal na ‘gagawin,’ ang pandiwa ay natural at tumpak na isinasalin bilang ‘ihahandog’ sa kontekstong pansakripisyo.
- source_word: וְנִסְכּוֹ
  choice: at sa handog na inumin nito
  rationale: Ang נֶסֶךְ ay handog na ibinubuhos; ang ‘handog na inumin’ ay malinaw at pamilyar na katawagan sa Filipino.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasang ginagamit ng teksto ang Tetragrammaton, kaya pinananatili ang pangalang tipan bilang ‘Yahweh.’
- issue: Kahulugan ng חַטָּאת sa kontekstong pansakripisyo
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Pinananatili sa pangunahing teksto ang pamilyar na katawagan, ngunit hindi inaalis ang lehitimong kahulugang nauugnay sa ritwal na paglilinis; kaya nakasaad ang alternatibo sa talababa.
