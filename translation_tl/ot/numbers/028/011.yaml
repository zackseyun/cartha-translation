  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: tl
  text: 'Sa mga pasimula ng inyong mga buwan[a], maghahandog kayo kay Yahweh ng handog na sinusunog: dalawang toro mula sa kawan ng baka, isang lalaking tupa, at pitong lalaking korderong isang taóng gulang, na walang kapintasan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa mga pasimula ng inyong mga buwan”; tumutukoy ito sa mga pagdiriwang ng bagong buwan.
    reason: Nililinaw ang Hebreong idyoma at ang tinutukoy nitong buwanang pagdiriwang.
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: Sa pasimula ng inyong mga buwan
  rationale: Pinananatili ang Hebreong idyomang literal na tumutukoy sa mga pasimula ng buwan, habang nililinaw sa talababa na ito ang pagdiriwang sa bagong buwan.
- source_word: תַּקְרִיבוּ
  choice: maghahandog kayo
  rationale: Sa kontekstong panghain, ang Hiphil ng קרב ay nangangahulugang magdala o magharap bilang handog; natural at tiyak sa Tagalog ang “maghahandog.”
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Tumutukoy ito sa uri ng handog na lubos na sinusunog; malinaw at pamilyar ang parirala sa modernong Tagalog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang יהוה bilang “Yahweh,” at ipinahihiwatig ng “kay” ang pinag-uukulan ng handog.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: dalawang toro mula sa bakahan
  rationale: Ang parirala ay tumutukoy sa mga torong kabilang sa kawan ng baka; iniiwasang ipalagay na kailangang mga batang toro ang mga ito.
- source_word: וְאַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Tuwirang katumbas ng אַיִל sa kontekstong panghain at malinaw sa karaniwang mambabasa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: pitong lalaking korderong isang taóng gulang
  rationale: Pinananatili ang kasarian ng כְּבָשִׂים at ang Hebreong idyomang “mga anak ng isang taon,” na tumutukoy sa edad ng mga kordero.
- source_word: תְּמִימִם
  choice: na walang kapintasan
  rationale: Sa paghahain, tumutukoy ito sa mga hayop na walang depekto; natural at eksakto ang “walang kapintasan.”
theological_decisions:
- issue: Pagpapahayag sa takdang panahon ng buwanang paghahain
  choice: Sa pasimula ng inyong mga buwan
  alternative: Sa inyong mga bagong buwan
  rationale: Pinananatili sa pangunahing teksto ang anyo at tunay na lawak ng Hebreong idyoma. Ang pagtukoy nito sa pagdiriwang kapag bagong buwan ay ibinibigay sa talababa nang hindi pinapalitan ang mismong pananalita.
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang teksto ay tuwirang gumagamit ng Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang mga terminong “handog na sinusunog,” “bakahan,” at “walang kapintasan” upang maging malinaw ang kontekstong panghain nang hindi maging labis na teknikal.
