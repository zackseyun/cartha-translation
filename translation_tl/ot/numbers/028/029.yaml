  text: Tig-isang ikasampung takal para sa bawat isa sa pitong kordero.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “ikasampu, ikasampu para sa isang kordero, para sa pitong kordero.” Ang pag-uulit sa Hebreo ay pormulang pamahagi: tig-isang ikasampung takal para sa bawat isa sa pitong kordero.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: tig-iisang ikasampung takal
  rationale: 'Ang pag-uulit na “ikasampu, ikasampu” ay pormulang pamahagi: isang ikasampung bahagi ng takal sa bawat isa. Hindi tahasang binabanggit sa talatang ito ang efa, kaya pinanatiling pangkalahatan ang yunit bilang “takal.”'
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para sa bawat kordero
  rationale: Bagaman literal na “para sa isang kordero,” pamahagi ang diwa ng pormula; likas na ipinapahayag ito sa Filipino ng “bawat kordero.”
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: para sa pitong kordero
  rationale: Tinutukoy nito ang buong pangkat na pitong kordero kung saan inilalapat ang takal sa bawat isa.
