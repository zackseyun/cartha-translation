  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: tl
  text: Utusan mo ang mga anak ni Israel[a] at sabihin mo sa kanila, ‘Ang aking handog, ang aking pagkain para sa aking mga handog na sinusunog sa altar[b], ang samyong kalugod-lugod sa akin[c]—tiyakin ninyong ihain sa akin sa takdang panahon nito.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Israelita.” Literal na “ang mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “para sa aking mga handog sa pamamagitan ng apoy.” Ang salitang Hebreo ay teknikal na katawagang pansakripisyo para sa mga handog na sinusunog sa altar.
    reason: lexical_alternative
  - marker: c
    text: Ang “samyong kalugod-lugod” ay karaniwang pananalitang pansakripisyo na nagpapahiwatig na tinatanggap ng Diyos ang handog.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Utusan mo
  rationale: Ang pautos na anyo ng צוה ay isang mariing tagubilin; pinananatili ng “Utusan mo” ang lakas nito.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang kongkretong anyo ng Hebreo at ang katawagang pangkalahatan para sa bayang tipan; nililinaw sa talababa ang mas likas na alternatibong “mga Israelita.”
- source_word: קָרְבָּנִי
  choice: ang aking handog
  rationale: Ang קָרְבָּן ay anumang inihahandog o inilalapit sa Diyos; “handog” ang malinaw at likas na katumbas sa Filipino.
- source_word: לַחְמִי
  choice: ang aking pagkain
  rationale: Bagaman maaari itong literal na mangahulugang “tinapay,” sa kontekstong pansakripisyo ay mas malawak ang diwa nito bilang pagkain.
- source_word: לְאִשַּׁי
  choice: para sa mga handog na pinaraan sa apoy
  rationale: Ang אִשֶּׁה ay teknikal na katawagan sa handog na nauugnay sa pagsunog sa altar. Iniiwasan ng pariralang ito ang maling pagpapalagay na pagkain lamang ang tinutukoy habang pinananatili ang kaugnayan sa apoy.
- source_word: רֵיחַ נִיחֹחִי
  choice: ang samyong kalugod-lugod sa akin
  rationale: Pinananatili ang kongkretong wikang pansakripisyo at ipinahahayag ang diwa ng pagtanggap o pagkalugod ng Diyos.
- source_word: תִּשְׁמְרוּ לְהַקְרִיב לִי
  choice: ingatan ninyong ihandog sa akin
  rationale: Ang שמר na sinusundan ng pawatas ay nagpapahiwatig ng maingat na pagtupad; “ingatan ninyong” ay marangal at angkop sa utos.
- source_word: בְּמוֹעֲדוֹ
  choice: sa takdang panahon nito
  rationale: Ipinapakita ng מוֹעֵד ang itinakdang oras o pagkakataon, at pinananatili ng “nito” ang panlalaking isahang hulapi na tumutukoy sa handog o kaayusan ng paghahandog.
theological_decisions:
- issue: Kongkretong paglalarawan sa hain bilang pagkain ng Diyos
  choice: Panatilihin ang “ang aking pagkain” bilang wikang pansakripisyo
  alternative: Ipaliwanag ito bilang “handog na katanggap-tanggap sa akin”
  rationale: Tahasang ginagamit ng Hebreo ang “aking pagkain.” Hindi ito dapat gawing abstrakto o ipakahulugang literal na nangangailangan ng pagkain ang Diyos.
- issue: Ang “samyo” bilang tanda ng pagkalugod ng Diyos
  choice: Panatilihin ang “samyong kalugod-lugod sa akin”
  alternative: “handog na tinatanggap ko”
  rationale: Ang kongkretong idyoma ay mahalagang bahagi ng wikang pansakripisyo at nagpapahiwatig ng pagtanggap ng Diyos nang hindi inaalis ang matalinghagang tensiyon.
- issue: Katawagan sa sama-samang bayan na בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Sinusundan ng pangunahing teksto ang anyong Hebreo, samantalang ibinibigay sa talababa ang likas na katawagang Filipino para sa buong bayan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Utusan mo” para sa mariing pautos, “samyo” bilang dignified at madaling maunawaang katawagang pansakripisyo, at mga gitling upang malinaw na ipakitang magkakaugnay na paglalarawan ang “handog,” “pagkain,” at “samyo.”
