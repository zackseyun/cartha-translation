revisions:
- from: Utusan mo ang mga anak ni Israel[a] at sabihin mo sa kanila, ‘Ang aking handog—ang aking pagkain para sa mga handog na pinaraan sa apoy[b], ang samyong kalugod-lugod sa akin[c]—ay ingatan ninyong ihandog sa akin sa takdang panahon nito.’
  to: Utusan mo ang mga anak ni Israel[a] at sabihin mo sa kanila, ‘Ang aking handog, ang aking pagkain para sa aking mga handog na sinusunog sa altar[b], ang samyong kalugod-lugod sa akin[c]—tiyakin ninyong ihain sa akin sa takdang panahon nito.’
  rationale: Pinalitan ang hindi gaanong likas na “pinaraan sa apoy” ng “sinusunog sa altar,” na mas malinaw na naghahatid ng teknikal na diwa ng אִשֶּׁה. Inayos ang talababa upang magbigay ng tunay na alternatibong salin. Pinalitan din ang “ingatan ninyong ihandog” ng mas likas ngunit mariing “tiyakin ninyong ihain,” habang pinanatili ang utos na maingat na iharap ang handog sa itinakdang panahon.
