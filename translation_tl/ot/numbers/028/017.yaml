  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: tl
  text: At sa ikalabinlimang araw ng buwang ito ay isang kapistahan[a]; sa loob ng pitong araw, kakainin ang tinapay na walang pampaalsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “banal na pagdiriwang.” Ang Hebreong חָג ay maaaring tumukoy sa isang sagradong kapistahan, hindi lamang sa isang salusalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁה עָשָׂר י֛וֹם
  choice: At sa ikalabinlimang araw
  rationale: Ang pang-ugnay at pang-ukol ay nagpapakilala ng panahong parirala; natural sa makabagong Tagalog ang ordinal na “ikalabinlimang araw.”
- source_word: לַ/חֹ֥דֶשׁ הַ/זֶּ֖ה
  choice: ng buwang ito
  rationale: Sa kontekstong pangkalendaryo, ang חֹדֶשׁ ay karaniwang tumutukoy sa “buwan.”
- source_word: חָ֑ג
  choice: may kapistahan
  rationale: Ang חָג ay isang banal na pagdiriwang o kapistahan. Ang “may kapistahan” ay natural sa Tagalog at hindi ipinapalagay na karaniwang salusalo lamang.
- source_word: שִׁבְעַ֣ת יָמִ֔ים
  choice: sa loob ng pitong araw
  rationale: Malinaw nitong ipinapahayag ang tagal na pitong araw.
- source_word: מַצּ֖וֹת
  choice: tinapay na walang pampaalsa
  rationale: Tuwirang inilalarawan nito ang tinapay na hindi pinaalsa at madaling maunawaan ng karaniwang mambabasa.
- source_word: יֵאָכֵֽל
  choice: ang kakainin
  rationale: Pinananatili nito ang pasibong anyo ng Niphal imperfect at ang diwa ng itinakdang gawain nang hindi dinaragdagan ang antas ng modal na puwersa.
