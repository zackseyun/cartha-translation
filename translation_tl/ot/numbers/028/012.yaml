  terminology: 'Ang “efa,” “pinong harina,” at “handog na butil” ay malinaw at angkop sa bokabularyong pangkultong Hebreo. Ang kasalukuyang talababa b ay hindi ligtas: ang “lubusang” ay nagdaragdag ng antas o diin na wala sa בְּלוּלָה. Pinalitan ito ng neutral na leksikal na alternatibo.'
