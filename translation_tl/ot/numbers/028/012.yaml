  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: tl
  text: at tatlong ikasampu ng isang efa ng pinong harina bilang handog na butil[a], na hinaluan ng langis, para sa bawat toro; at dalawang ikasampu ng isang efa ng pinong harina bilang handog na butil, na hinaluan ng langis[b], para sa bawat tupang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tatlong ikasampu” at “dalawang ikasampu”; nauunawaang ang mga ito ay mga ikasampu ng isang efa.
    reason: cultural_note
  - marker: b
    text: O “na hinalo sa langis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: at tatlong ikasampu ng isang efa
  rationale: Ang עֶשְׂרוֹן ay sukat na isang ikasampu, na sa mga tuntunin tungkol sa paghahandog ay nauunawaang ikasampu ng isang efa. Tahasang binanggit ang efa para maging malinaw.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Likas at malinaw na katumbas sa modernong Filipino para sa harinang pino na ginagamit sa mga handog.
- source_word: מִנְחָה
  choice: handog na pagkaing butil
  rationale: Sa kontekstong panghandog, tumutukoy ito sa handog na mula sa butil, hindi lamang sa isang pangkalahatang regalo o alay.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Tumpak at natural na paglalarawan sa paghahanda ng harina; pinananatili rin sa talababa ang alternatibong diwa ng lubusang paghahalo.
- source_word: לַפָּר הָאֶחָד
  choice: para sa bawat toro
  rationale: Ang artikulo kasama ng אֶחָד ay may indibidwal o distributibong diwa sa reseta, hindi ordinal na 'unang toro.' Mas natural sa Filipino ang 'bawat toro.'
- source_word: וּ/שְׁנֵי עֶשְׂרֹנִים
  choice: at dalawang ikasampu ng isang efa
  rationale: Tulad ng naunang sukat, ginawang tahasan ang nauunawaang yunit na efa upang maiwasan ang kalabuan.
- source_word: לָאַיִל הָאֶחָד
  choice: para sa bawat lalaking tupa
  rationale: Kaagapay ng parirala para sa toro at nagpapahayag ng dami para sa bawat hayop, hindi ng 'unang' lalaking tupa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang terminong 'efa' bilang tradisyonal na yunit ng sukat at 'handog na pagkaing butil' upang maging tiyak ang kultikong kahulugan. Ang 'bawat' ay natural na naghahatid ng distributibong diwa ng Hebreong הָאֶחָד.
