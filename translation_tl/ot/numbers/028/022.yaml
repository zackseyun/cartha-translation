translation:
  language: tl
  text: at isang kambing na lalaki bilang handog para sa kasalanan[a], upang magbayad-sala para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa pagpapadalisay.” Sa konteksto ng paghahandog, ang salitang Hebreo na isinaling “handog para sa kasalanan” ay maaari ring unawain bilang “handog para sa pagpapadalisay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: at isang lalaking kambing
  rationale: Ang שָׂעִיר ay tumutukoy sa lalaking kambing; isinalin ang prefixed ו bilang “at,” at pinanatili ang bilang na “isang” kasama ng hayop ayon sa natural na ayos sa Tagalog.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Sa kontekstong paghahandog, tumutukoy ang חַטָּאת sa handog, hindi lamang sa abstraktong kasalanan. Malinaw at likas sa modernong Tagalog ang “handog para sa kasalanan,” habang inilalagay sa talababa ang lehitimong alternatibong diwa ng paglilinis.
- source_word: אֶחָד
  choice: isang
  rationale: Tiyak na itinatakda ng numeral ang dami ng hayop na ihahandog, kaya malinaw itong pinanatili.
- source_word: לְ/כַפֵּר
  choice: upang gumawa ng pagtubos
  rationale: Sa kontekstong saserdotal at paghahandog, ipinahahayag ng כפר ang ritwal na paggawa ng pagtubos. Pinananatili ng parirala ang bigat ng terminong teolohikal nang hindi nililimitahan ang paraan o mekanismo nito.
- source_word: עֲלֵי/כֶם
  choice: para sa inyo
  rationale: Sa pormulang ito, ipinahihiwatig ng עַל na ang ritwal ay ginagawa alang-alang o para sa kapakinabangan ng bayan; natural sa Tagalog ang “para sa inyo.”
theological_decisions:
- issue: Pagpapahayag ng כפר sa wikang paghahandog
  choice: upang gumawa ng pagtubos para sa inyo
  alternative: upang tubusin kayo; upang gumawa ng pampalubag-loob para sa inyo
  rationale: Ang “gumawa ng pagtubos” ay nagpapanatili sa ritwal at teolohikal na lakas ng Hebreo nang hindi ipinapasya kung eksaktong paano nagaganap ang pagtubos. Iniiwasan din nitong gawing tuwirang layon ang mga tao kung saan ang Hebreo ay gumagamit ng pariralang “para sa inyo.”
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang karaniwang bokabularyong biblikal na “handog para sa kasalanan” at “pagtubos,” habang pinanatili sa talababa ang tunay na leksikal na alternatibo ng חַטָּאת.
