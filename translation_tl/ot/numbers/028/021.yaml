  yaml_path: translation/ot/numbers/028/021.yaml
  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: tl
  text: Maghanda ka ng ikasampung bahagi ng isang efa para sa bawat kordero[b][a], para sa pitong kordero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal na “ikasampung bahagi, ikasampung bahagi ang ihahanda mo para sa isang kordero, para sa pitong kordero.” Ang pag-uulit ay nagpapahiwatig ng pamamahagi: tig-isang ikasampung bahagi para sa bawat kordero.'
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ikasampung bahagi ng isang efa, ang karaniwang sukat ng handog na butil sa kontekstong ito.
    reason: cultural_note
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: ikasampung bahagi ng isang efa
  rationale: 'Ang inuulit na pangngalan ay may diwang pamahagi: tig-isang ikasampung bahagi. Sa konteksto ng handog na butil, ito ang karaniwang sukat na isang ikasampu ng efa; nilinaw ang yunit sa salin at sa talababa.'
- source_word: תַּעֲשֶׂה
  choice: Maghanda ka
  rationale: Bagaman literal na ‘gawin,’ mas natural ang ‘maghanda’ sa tagubilin tungkol sa takdang bahagi ng handog, nang hindi labis na ipinakahulugang ‘ihandog.’
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para sa bawat kordero
  rationale: 'Ipinahahayag nito sa natural na Filipino ang diwang pamahagi ng Hebreo: ang takdang sukat ay para sa bawat isang hayop.'
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: para sa pitong kordero
  rationale: Pinananatili ang tahasang pagtukoy ng Hebreo sa buong pangkat ng pitong kordero.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang pang-isahang utos na “Maghanda ka” upang tumbasan ang pangalawang panauhang panlalaking isahan sa Hebreo. Pinanatili ang bahagyang pag-uulit na “para sa bawat kordero, para sa pitong kordero” dahil naroon ito sa pinagmulang teksto.
