base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: tl
  text: At ihahandog mo ang ikalawang batang tupa sa pagitan ng dalawang dapithapon[a]. Ihahandog mo ito gaya ng handog na butil sa umaga at ng handog na inumin nito, bilang handog na iniaalay sa apoy[b], isang samyong nakalulugod kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagitan ng dalawang dapithapon,” isang tradisyonal na pahayag na madalas unawaing “sa takipsilim.”
    reason: lexical_alternative
  - marker: b
    text: O “handog na pagkain.” Ang salitang Hebreo ay tumutukoy sa isang handog na iniaalay sa pamamagitan ng apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: ang ikalawang batang tupa
  rationale: Sa konteksto ng paghahandog, ang כֶּבֶשׂ ay karaniwang batang tupa; pinananatili ng “ikalawa” ang pagkakasunod nito sa handog sa umaga.
- source_word: תַּעֲשֶׂה
  choice: ihahandog mo
  rationale: Bagaman literal na “gagawin mo,” ang pandiwa ay tumutukoy rito sa paghahain ng sakripisyo, kaya mas likas at tiyak ang “ihahandog mo.”
- source_word: בֵּין הָעַרְבָּיִם
  choice: sa pagitan ng dalawang dapithapon
  rationale: Pinananatili ang di-karaniwang anyong dalawahan ng Hebreo upang hindi ipasiya sa pangunahing teksto ang pinagtatalunang eksaktong oras.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: gaya ng handog na butil sa umaga
  rationale: Sa kontekstong pangsaserdote, ang מִנְחָה ay partikular na handog na butil, hindi lamang pangkalahatang handog.
- source_word: וּכְנִסְכּוֹ
  choice: at ng handog na inumin nito
  rationale: Ang נֶסֶךְ ay kasamang handog na ibinubuhos; malinaw at karaniwan sa Filipino ang “handog na inumin.”
- source_word: אִשֵּׁה
  choice: handog na pinaraan sa apoy
  rationale: Ipinahahayag nito ang handog na inihahain sa pamamagitan ng apoy at pinananatili ang mahalagang ugnayang leksikal sa apoy.
- source_word: רֵיחַ נִיחֹחַ
  choice: isang samyong nakalulugod
  rationale: Likas at marangal itong paglalarawan sa samyo ng handog bilang kalugod-lugod sa Diyos nang hindi inaalis ang metapora.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangngalang pantangi ang tetragrammaton sa teksto; pinananatili ng “Yahweh” ang hayag na pangalan sa halip na palitan ito ng titulo.
- issue: Eksaktong panahon ng בֵּין הָעַרְבָּיִם
  choice: sa pagitan ng dalawang dapithapon
  alternative: sa takipsilim
  rationale: Hindi tiyak ang eksaktong saklaw ng idyomang Hebreo. Pinananatili sa teksto ang pormal na larawan, samantalang inilalagay sa talababa ang mas idyomatikong pagkaunawa.
- issue: Kahulugan ng אִשֵּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Mas tuwirang pinananatili ng napiling salin ang kaugnayan ng terminong panghandog sa apoy; kinikilala sa talababa ang alternatibong saling nakatuon sa handog bilang pagkain.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang karaniwang bokabularyong panghandog—“batang tupa,” “handog na butil,” at “handog na inumin”—habang sadyang pinanatili ang di-karaniwang temporal na idyoma at ipinaliwanag ito sa talababa.
