  to: At ihahandog mo ang ikalawang batang tupa sa pagitan ng dalawang dapithapon[a]. Ihahandog mo ito gaya ng handog na butil sa umaga at ng handog na inumin nito, bilang handog na iniaalay sa apoy[b], isang samyong nakalulugod kay Yahweh.
