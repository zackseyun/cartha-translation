- source_word: תַּעֲשׂוּ
  choice: ihandog ninyo
  rationale: Bagaman literal na 'gawin,' ang pandiwa ay natural na isinasaling 'ihandog' sa konteksto ng mga tagubilin tungkol sa paghahandog.
- source_word: אֶת אֵלֶּה
  choice: ang mga ito
  rationale: Tumutukoy ang demonstratibo sa mga handog na itinakda sa naunang mga talata.
