lexical_decisions:
- source_word: מִלְּבַד
  choice: Bukod sa
  rationale: Ipinapakitang ang mga handog na ito ay idaragdag sa palagiang handog; natural at malinaw ito sa modernong Filipino.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: palagiang handog na sinusunog tuwing umaga
