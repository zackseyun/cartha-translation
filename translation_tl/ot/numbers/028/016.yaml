base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: tl
  text: Sa unang buwan, sa ika-labing-apat na araw ng buwan, ay ang Paskuwa para kay Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Paskuwa ni Yahweh.” Ang pang-ukol sa Hebreo ay maaaring magpahayag ng pagtatalaga o pag-aari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: sa unang buwan
  rationale: Likas sa Tagalog ang pariralang panahunan na “sa unang buwan.” Hindi na kailangang isalin nang tahasan ang pang-ugnay na וּ sa simula ng talata.
- source_word: בְּ/אַרְבָּעָה עָשָׂר יוֹם לַ/חֹדֶשׁ
  choice: sa ikalabing-apat na araw ng unang buwan
  rationale: Malinaw at likas itong pormula ng petsa sa Tagalog. Ginawang “unang buwan” ang huling “buwan” upang maiwasan ang alanganing pag-uulit at manatiling tiyak ang tinutukoy.
- source_word: פֶּסַח
  choice: Paskuwa
  rationale: Ang “Paskuwa” ang nakaugaliang katawagang biblikal sa Tagalog para sa kapistahan o pagdiriwang na Pesach; hindi idinagdag ang “handog” sapagkat hindi tahasang nililimitahan ng talata ang salita sa hain lamang.
- source_word: לַ/יהוָה
  choice: para kay Yahweh
  rationale: Ipinapahayag ng “para kay” ang ugnayan o pagtatalaga na maaaring taglayin ng pang-ukol na לְ, habang pinananatili ang maikling pahayag ng Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit sa tekstong Hebreo ang pangalang tipan na יהוה; pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Kahulugan ng לַיהוָה kaugnay ng Paskuwa
  choice: para kay Yahweh
  alternative: Paskuwa ni Yahweh
  rationale: Maaaring magpahiwatig ang לְ ng pagtatalaga o pag-uukol, ngunit maaari rin itong maunawaan bilang pag-aari o kaugnayan. Pinili sa teksto ang natural na “para kay Yahweh” at inilagay sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Inayos ang ayos ng pangungusap upang maging likas sa Tagalog nang hindi nagdaragdag ng pandiwang wala sa Hebreo.
