translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong panghandog sa halip na teknikal o makalumang pananalita. Ang “mga hayop” ay isang kontekstuwal na paglilinaw sa tinutukoy ng pangmaramihang תְּמִימִם; hindi nito inilalapat ang pagiging walang kapintasan sa mga handog na butil o inumin.
