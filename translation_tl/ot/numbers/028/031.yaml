base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: tl
  text: Bukod sa palagiang[a] handog na sinusunog at sa handog na butil nito, ihahandog ninyo ang mga ito. Dapat na walang kapintasan ang mga hayop[b], kasama ang kani-kanilang handog na inumin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tuluy-tuloy” o “araw-araw na.”
    reason: Pinananatili ang saklaw ng תָּמִיד, na maaaring magpahiwatig kapuwa ng patuloy na itinakdang handog at ng araw-araw na paghahandog nito.
  - marker: b
    text: Sa Hebreo, “dapat na maging walang kapintasan ang mga iyon para sa inyo”; ang tinutukoy ay ang mga hayop na ihahandog.
    reason: Nililinaw ang reperente ng pangmaramihang pang-uri at itinatala ang Hebreong pariralang לָכֶם na hindi likas isalin nang tuwiran sa Filipino.
  - marker: c
    text: O “kani-kanilang libasyon.”
    reason: Ang נְסָכִים ay mga likidong handog na ibinubuhos.
lexical_decisions:
- source_word: מִלְּבַד
  choice: Bukod sa
  rationale: Ipinakikitang ang mga handog na ito ay karagdagan sa palagiang handog; maikli at likas ito sa makabagong Filipino.
- source_word: עֹלַת הַתָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Tumutukoy sa itinakdang handog na sinusunog na regular na inihahandog araw-araw; pinananatili ng “palagian” ang diwa ng תָּמִיד.
- source_word: וּמִנְחָתוֹ
  choice: at sa handog na butil nito
  rationale: Sa kontekstong panghandog, ang מִנְחָה ay handog na mula sa butil na kasama ng handog na sinusunog.
- source_word: תַּעֲשׂוּ
  choice: ihahandog ninyo
  rationale: Sa kontekstong ito, ang עשה ay tumutukoy sa paghahanda at pagsasagawa ng paghahandog; “ihahandog” ang pinakanatural na Filipino.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Dapat na walang kapintasan ang mga hayop
  rationale: Sa mga batas tungkol sa paghahandog, ang תָּמִים ay nagsasaad na ang hayop ay walang depekto. Nililinaw ang ipinahihiwatig na tinutukoy nang hindi isinasama ang alanganing literal na “para sa inyo.”
- source_word: וְנִסְכֵּיהֶם
  choice: kasama ang mga handog na inumin para sa mga iyon
  rationale: Ang נֶסֶךְ ay handog na likidong ibinubuhos, karaniwang alak, na kaakibat ng mga hayop na inihahandog.
