base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: tl
  text: 'At ang handog na butil para sa mga iyon ay pinong harina na hinaluan ng langis: tatlong ikasampu para sa toro[a], at dalawang ikasampu para sa lalaking tupa ang ihahanda ninyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “tatlong ikasampu” at “dalawang ikasampu” ay pinaikling tawag sa mga ikasampung bahagi ng isang efa, isang panukat sa tuyong sangkap na ginagamit sa mga tuntunin tungkol sa paghahandog.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: At ang handog na butil para sa mga iyon
  rationale: Sa konteksto ng paghahain, ang מִנְחָה ay handog na butil. Ang hulaping pangmaramihan ay tumutukoy nang sama-sama sa mga hayop na kababanggit, kaya natural sa Filipino ang “para sa mga iyon.”
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwang tawag sa harinang pinong giling na ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: hinaluan ng langis
  rationale: Tumpak at natural nitong ipinapahayag na ang harina ay inihandang may kahalong langis.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tatlong ikasampu
  rationale: Ang עִשָּׂרוֹן ay ikasampung bahagi ng isang efa; pinananatili sa teksto ang pinaikling anyo ng Hebreo at nililinaw sa talababa.
- source_word: לַפָּר
  choice: para sa toro
  rationale: Ang tiyak na anyong isahan ay tumutukoy sa torong itinakda sa naunang tagubilin.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: at dalawang ikasampu
  rationale: Pinananatili ang sukat at ang paralel na kayarian ng unang parirala.
- source_word: לָאַיִל
  choice: para sa lalaking tupa
  rationale: Ang אַיִל ay adultong lalaking tupa; ang tahasang “lalaking tupa” ay malinaw sa karaniwang mambabasa.
- source_word: תַּעֲשׂוּ
  choice: ang ihahanda ninyo
  rationale: Sa konteksto ng mga regulasyon sa paghahain, natural na inilalarawan ng “ihahanda” ang ipinag-uutos na paggawa nang hindi labis na tinutukoy na ito mismo ang paghahandog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “handog na butil,” “pinong harina,” at “hinaluan ng langis” bilang natural ngunit malapit na katumbas ng mga terminong pangritwal. Ang hulaping maramihan sa וּמִנְחָתָם ay ipinahayag bilang “para sa mga iyon” upang maiwasan ang malabong “kanilang” para sa mga hayop.
