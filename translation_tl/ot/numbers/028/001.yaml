  yaml_path: translation/ot/numbers/028/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh[a] kay Moises at sinabi niya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; isinasalin din bilang “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive at Piel na anyo ng דבר ay karaniwang pormula sa salaysay. Likas sa modernong Tagalog ang “Nagsalita” at pinananatili nito ang pormal na himig ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH bilang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay nagpapahayag ng patutunguhan ng pagsasalita; “kay” ang likas na gamit bago ang pangalan ng tao sa Tagalog.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang pamantayan at madaling makilalang anyo ng pangalang מֹשֶׁה sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili ng parirala ang Hebreong pormulang nagpapakilala sa tuwirang pananalitang susunod, kahit bahagyang pormal ang tunog nito sa Tagalog.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo; binabanggit sa talababa ang iba pang kilalang anyo.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at pormal na himig. Pinanatili ang Hebreong pormulang “na sinasabi” upang ipakita na ipinagpapatuloy sa susunod na talata ang nilalaman ng sinabi.
