  source_fidelity: Wastong naipapahayag ng draft ang pandiwang pagsasalita, ang kausap na si Moises, at ang Tetragrammaton bilang “Yahweh.” Gayunman, ang “na sinasabi” ay hindi likas na katumbas ng Hebreong לֵאמֹר sa ganitong pangungusap; mas malinaw na ipinahihiwatig ng “at sinabi niya:” ang pormulang nagpapakilala sa kasunod na tuwirang pananalita.
