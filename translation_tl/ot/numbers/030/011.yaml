base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: tl
  text: At kung sa bahay ng kanyang asawa ay gumawa siya ng panata[a], o nagpataw siya sa kanyang sarili ng isang pananagutan sa pamamagitan ng panunumpa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “nagpataw siya sa kanyang sarili ng isang umiiral na pananagutan sa pamamagitan ng panunumpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Ipinagpapatuloy nito ang magkakasunod na kondisyong legal, habang likas pa rin sa modernong Tagalog.
- source_word: בֵּית אִישָׁהּ
  choice: sa bahay ng kanyang asawa
  rationale: Pinananatili ang literal na lugar at kontekstong panlipunan ng pariralang Hebreo nang hindi ito labis na ipinapaliwanag.
- source_word: נָדָרָה
  choice: gumawa siya ng panata
  rationale: Malinaw at karaniwang paraan ito ng pagpapahayag sa Tagalog ng pormal na paggawa ng isang panata.
- source_word: אוֹ
  choice: o
  rationale: Tuwirang pinananatili ang paghihiwalay ng dalawang kaugnay na posibilidad.
- source_word: אָסְרָה אִסָּר
  choice: itinali niya ang kanyang sarili sa isang pananagutan
  rationale: Ipinahahayag nito ang diwang reflexive at nagbubuklod ng magkaugnay na pandiwa at pangngalan sa Hebreo, nang hindi gumagamit ng alanganing literal na pag-uulit.
- source_word: עַל נַפְשָׁהּ
  choice: ang kanyang sarili
  rationale: Sa idyomang ito, ang נֶפֶשׁ ay tumutukoy sa mismong tao, hindi lamang sa 'kaluluwa.'
- source_word: בִּשְׁבֻעָה
  choice: sa pamamagitan ng panunumpa
  rationale: Ipinakikita nito na ang panunumpa ang paraan ng pagbubuklod sa sarili sa pananagutan.
