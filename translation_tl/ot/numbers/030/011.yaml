translation_notes:
  register: Modernong Filipino Tagalog na pormal at marangal, angkop sa tekstong legal sa Kasulatan. Pinanatili ang hindi pa tapos na kondisyong pangungusap sa pamamagitan ng kuwit, ayon sa anyo at konteksto ng talata.
