translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hindi siya tutulan” sa halip na literal na “manahimik sa kanya” upang natural na maipahayag ang legal na diwa ng hindi pagkontra. Pinagsama sa isang sugnay ang inuulit na “mananatiling may bisa” upang maiwasan ang mabigat na pag-uulit sa Filipino, habang kapwa saklaw ang mga panata at sariling pananagutan.
