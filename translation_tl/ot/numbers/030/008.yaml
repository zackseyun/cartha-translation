base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: tl
  text: At kung marinig ito ng kanyang asawa sa araw na marinig niya ito[a] at hindi siya tutulan, mananatiling may bisa ang kanyang mga panata, at mananatiling may bisa ang mga pananagutang itinali niya sa kanyang sarili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapag marinig niya ito.” Binibigyang-diin ng Hebreo ang araw mismo ng kanyang pagkarinig bilang panahong may legal na kabuluhan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang mga ito ay mga “bigkis” o obligasyong ipinataw niya sa kanyang sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: At kung marinig
  rationale: Ang qatal na kasunod ng pang-ugnay sa kontekstong legal ay nagpapatuloy sa kondisyunal na tuntunin; natural itong ipinahahayag sa Filipino bilang “At kung marinig.”
- source_word: אִישָׁהּ
  choice: kanyang asawa
  rationale: Sa konteksto ng batas tungkol sa pag-aasawa, ang אִישׁ na may hulaping 3fs ay tumutukoy sa asawa niyang lalaki.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: sa araw na marinig niya iyon
  rationale: Pinananatili nito ang tiyak na panahong may legal na kabuluhan sa Hebreo, bagaman maaari rin itong unawain nang mas natural bilang “kapag marinig niya iyon.”
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: at hindi siya tutulan
  rationale: Ang idyomang Hebreo ay literal na tumutukoy sa pananahimik sa babae, ngunit sa legal na konteksto ang diwa nito ay ang hindi pagtutol; malinaw at natural ito sa modernong Filipino.
- source_word: וְקָמוּ ... יָקֻמוּ
  choice: mananatiling may bisa
  rationale: Sa legal na gamit, ang קוּם ay nangangahulugang manindigan o manatiling balido. Ang “mananatiling may bisa” ang pinakamalinaw na katumbas sa Filipino at saklaw ang dalawang paglitaw ng pandiwa.
- source_word: נְדָרֶיהָ
  choice: kanyang mga panata
  rationale: Karaniwang katumbas ng נדר sa kontekstong legal at panrelihiyon ang “panata.”
- source_word: וֶאֱסָרֶהָ
  choice: mga pananagutang itinali
  rationale: Ipinahahayag ng “pananagutan” ang legal na obligasyon, samantalang pinananatili ng “itinali” ang metapora ng ugat na אסר.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: itinali niya sa kanyang sarili
  rationale: Pinananatili nito ang metapora ng sariling pagbibigkis nang hindi ipinakahulugang literal na pagtali sa katawan.
- source_word: נַפְשָׁהּ
  choice: kanyang sarili
  rationale: Reflexive ang gamit ng נֶפֶשׁ sa idyomang ito at tumutukoy sa mismong tao, hindi partikular sa di-materyal na kaluluwa.
