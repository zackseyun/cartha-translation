  text: וְ/אִם הָי֤וֹ תִֽהְיֶה֙ לְ/אִ֔ישׁ וּ/נְדָרֶ֖י/הָ עָלֶ֑י/הָ א֚וֹ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: tl
  text: Ngunit kung mag-asawa siya sa isang lalaki[a], at ang kanyang mga panata ay nananatili sa kaniya, o isang padalus-dalos na pananalita mula sa kanyang mga labi na sa pamamagitan nito ay itinali niya ang kanyang sarili[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “siya ay maging asawa ng isang lalaki” o “siya ay may asawa.” Sa literal, ang idyomang Hebreo ay “siya ay magiging para sa isang lalaki”; tumutukoy ito sa pag-aasawa.
    reason: lexical_alternative
  - marker: b
    text: O “isang pananalita mula sa kanyang mga labi.” Malamang na tumutukoy ang parirala sa isang binigkas na obligasyong ipinataw niya sa sarili, marahil nang padalus-dalos, na naiiba sa isang pormal na panata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinagpapatuloy nito ang naunang batas habang nagpapakilala ng bahagyang naiibang kalagayan.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: siya ay maging asawa ng isang lalaki
  rationale: Ang idyomang היה לְאִישׁ ay tumutukoy sa pagpasok o pag-iral sa ugnayang mag-asawa. Likas ito sa modernong Tagalog at hindi ipinahihiwatig na pag-aari ng lalaki ang babae.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: nananatili sa kaniya ang kanyang mga panata
  rationale: Pinananatili ang larawan ng mga pananagutang nakapataw sa babae nang hindi pa ipinapasiyang pinagtibay na ang mga iyon.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: ang padalus-dalos na sinabi ng kanyang mga labi
  rationale: Ipinahahayag ng מִבְטָא ang isang binigkas na pahayag; sa konteksto ng panata, maaaring tumukoy ito sa pabigla-biglang pansariling obligasyon na naiiba sa pormal na panata.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: na ipinangtali niya sa kanyang sarili
  rationale: Pinananatili ang legal na metapora ng אָסַר, samantalang ang נֶפֶשׁ ay inuunawang tumutukoy sa mismong sarili sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa batas tungkol sa panata
  choice: kanyang sarili
  alternative: kanyang kaluluwa / kanyang buhay
  rationale: Ang paksa ay obligasyong ipinataw ng tao sa sarili, hindi isang pahayag tungkol sa likas na katangian ng kaluluwa.
- issue: Katayuan ng mga panata sa pariralang עָלֶיהָ
  choice: nananatili sa kaniya
  alternative: may bisa sa kaniya
  rationale: Hindi pa ipinapasiya ng talatang ito kung pinagtibay na ang obligasyon; ang mga kasunod na talata ang tumatalakay rito.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “maging asawa” sa halip na “mapabilang sa isang asawa” upang natural na maipahayag ang legal na idyoma ng pag-aasawa. Ang anyong pangungusap ay sadyang hindi ganap sapagkat nagpapatuloy ang kondisyon sa susunod na talata.
