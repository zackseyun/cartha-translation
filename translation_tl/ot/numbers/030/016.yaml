  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: tl
  text: Ngunit kung talagang pawawalang-bisa niya ang mga iyon matapos niyang marinig ang mga iyon,[a] papasanin niya ang kasalanan ng babae.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tiyak na pawawalang-bisa niya” o “lubusang pawawalang-bisa niya.” Gumagamit ang Hebreo ng infinitive absolute kasama ng pandiwang may parehong ugat upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Ang “papasanin niya ang kasalanan ng babae” ay maaari ring unawain na “siya ang mananagot sa kasalanan ng babae” o “papasanin niya ang kaparusahan dahil sa kasalanan ng babae.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Naghahayag ito ng kundisyong salungat sa naunang talata; natural na naipapakita ng “Ngunit kung” ang puwersa ng waw sa konteksto.
- source_word: הָפֵר יָפֵר
  choice: talagang pawawalang-bisa niya
  rationale: Ang infinitive absolute na kasunod ng pandiwang may parehong ugat ay nagbibigay-diin sa kilos. Pinananatili ng “talagang” ang diin, at ang “pawawalang-bisa” ay angkop sa legal na konteksto ng mga panata.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Tumutukoy ang panghalip na maramihan sa mga panata o pananagutang binanggit sa konteksto, kaya pinanatili ang bilang nito.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: matapos niyang marinig ang mga iyon
  rationale: Ipinakikita ng parirala na nauna ang pagkarinig niya bago ang pagpapawalang-bisa. Ang tahasang layon ay likas sa Filipino at nakaayon sa sanggunian ng panghalip.
- source_word: וְנָשָׂא
  choice: papasanin niya
  rationale: Sa legal at moral na gamit, ang נשׂא עון ay tumutukoy sa pagpasan ng kasalanan, pananagutan, o bunga nito. Ang anyong panghinaharap ay angkop sa kahihinatnan ng kondisyon.
- source_word: עֲוֺנָהּ
  choice: ang kasalanan ng babae
  rationale: Pinananatili nito ang idyomang legal-moral nang hindi tiyak na nilulutas kung ang pinapasan ay pagkakasala, pananagutan, o kaparusahan. Ginawang tahas ang tinutukoy ng hulaping pambabae upang maging malinaw sa Filipino.
theological_decisions:
- issue: Kahulugan ng pagpasan sa kasalanan sa legal na konteksto
  choice: Pinananatili ang malawak na idyomang “papasanin niya ang kasalanan ng babae.”
  alternative: “Siya ang mananagot sa kasalanan ng babae” o “papasanin niya ang kaparusahan dahil sa kasalanan ng babae.”
  rationale: Maaaring tumukoy ang נשׂא עון sa pagkakasala, pananagutan, o mga bunga at kaparusahan nito. Hindi nilulutas ng salin ang tunay na saklaw ng idyoma nang higit sa sinasabi ng Hebreo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang legal na “pawawalang-bisa” para sa pagpapawalang-saysay sa mga panata, at pinanatili sa talababa ang diin at likas na kalabuan ng idyomang Hebreo.
