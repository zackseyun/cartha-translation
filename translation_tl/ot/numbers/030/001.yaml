base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: tl
  text: Nagsalita si Moises sa mga anak ni Israel ayon sa lahat ng iniutos ni Yahweh kay Moises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel,” isang nakaugaliang katawagan para sa bayang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Pormal na nangangahulugang “sinabi.” Ang konstruksyong “Sinabi ni Moises sa…” ay likas sa modernong Tagalog at hindi nagpapahiwatig na kasunod nito ang isang tuwirang sipi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal at nakaugaliang katawagang tipan sa Hebreo. Sa Tagalog, ang “anak” ay hindi kinakailangang tumukoy lamang sa lalaki, kaya tumpak ito sa anyo at saklaw.
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ayon sa
  rationale: Ipinahahayag ng prefixed כ ang pagsunod o pag-ayon sa kabuuan ng iniutos, hindi lamang ang nilalaman ng sinabi.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ipinapakita ng aspektong ganap sa konteksto na nauna ang utos ni Yahweh bago ito sinabi ni Moises; sapat na itong naihahayag ng natural na ayos ng pangungusap sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶת מֹשֶׁה
  choice: sa kanya
  rationale: Si Moises ang tuwirang layon ng pandiwang “iniutos.” Ginamit ang panghalip upang maiwasan ang di-likas na pag-uulit ng pangalan habang nananatiling malinaw ang tinutukoy.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ang pangalang Yahweh sa halip na palitan ng isang titulo.
- issue: Katawagan sa tipang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang pormang “mga anak ni Israel,” na isang nakaugaliang pambansang katawagan sa Hebreo. Hindi nito nililimitahan sa mga lalaking Israelita ang tinutukoy dahil karaniwang gender-inclusive ang “mga anak” sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang likas na “Sinabi ni Moises sa…” at iniwasan ang sobrang literal na ayos na magiging mabigat sa karaniwang mambabasa; pinanatili naman ang ekspresyong “mga anak ni Israel” at ang pangalang “Yahweh.”
