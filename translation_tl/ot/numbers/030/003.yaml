revisions:
- from: Kapag ang isang lalaki ay gumawa ng panata kay Yahweh, o sumumpa upang itali ang sarili sa isang pananagutan,[a] hindi niya dapat labagin ang kanyang salita;[b] dapat niyang gawin ang lahat ng lumabas sa kanyang bibig.
  to: Kung ang isang lalaki ay gumawa ng panata kay Yahweh, o sumumpa upang magbigkis ng pananagutan sa kanyang sarili,[a] huwag niyang labagin ang kanyang salita;[b] dapat niyang gawin ang lahat ng lumabas sa kanyang bibig.
  rationale: Ginawang “Kung” ang pambungad upang maipakita ang kondisyunal na anyo ng batas. Pinalitan ang pananalitang tungkol sa pananagutan ng mas natural na Filipino na nananatiling malapit sa konstruksiyong Hebreo, at ginawang tuwirang pagbabawal ang katumbas ng “hindi niya lalapastanganin/lalabagin ang kanyang salita.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:11:03Z'
