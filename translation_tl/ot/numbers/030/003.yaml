base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: tl
  text: Kung ang isang lalaki ay gumawa ng panata kay Yahweh, o sumumpa upang magbigkis ng pananagutan sa kanyang sarili,[a] huwag niyang labagin ang kanyang salita;[b] dapat niyang gawin ang lahat ng lumabas sa kanyang bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang magbigkis ng isang pananagutan sa kanyang sarili”; maaari ring isalin, “upang itali ang sarili sa isang obligasyon.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “huwag niyang lapastanganin ang kanyang salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tahasang panlalaki at isahan ang pangngalan; pinananatili ito sa kontekstong legal.
- source_word: כִּי
  choice: Kapag
  rationale: Nagpapakilala ito ng kasong legal; natural sa Filipino ang “kapag” para sa kondisyong maaaring mangyari, bagaman maaari ring isiping “kung.”
- source_word: יִדֹּר נֶדֶר
  choice: gumawa ng panata
  rationale: Likas na Filipino para sa Hebreong magkaugnay na pandiwa at pangngalan, habang pinananatili ang legal at taimtim na diwa.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang tetragrammaton bilang pangalang Yahweh, alinsunod sa tuwirang paglitaw nito sa Hebreo.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: sumumpa
  rationale: Sapat nang ipinahihiwatig ng pandiwang Filipino ang paggawa ng isang sumpa; iniiwasan ang di-likas na pag-uulit.
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: upang itali ang sarili sa isang pananagutan
  rationale: Pinananatili ang larawan ng sariling pagtatali at ang diwa ng obligasyong ipinapataw ng tao sa sarili, nang hindi nagdaragdag ng tiyak na uri ng pangako.
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: hindi niya dapat labagin ang kanyang salita
  rationale: Sa kontekstong ito, ang Hiphil ng חלל ay tumutukoy sa hindi paglapastangan o paglabag sa sariling salita; “labagin” ang malinaw na legal na katumbas.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: dapat niyang gawin ang lahat ng lumabas sa kanyang bibig
  rationale: Pinananatili ang konkretong Hebreong larawan ng mga salitang lumalabas sa bibig at malinaw na ipinahahayag ang obligasyon.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang ginagamit sa tekstong Hebreo; pinananatili ng “Yahweh” ang katangian nito bilang tipanang pangalan nang hindi ito ginagawang titulo.
- issue: Diwa ng יַחֵל kaugnay ng salita
  choice: labagin ang kanyang salita
  alternative: lapastanganin ang kanyang salita
  rationale: Ang salitang Hebreo ay may saklaw na “gawing di-banal/lapastanganin,” ngunit sa batas tungkol sa panata ang natural na kahulugan ay paglabag sa ipinangako. Itinatala sa talababa ang mas literal na larawan.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may malinaw na himig legal. Pinanatili ang panlalaking “isang lalaki,” ang banal na pangalang Yahweh, at ang konkretong larawang “lumabas sa kanyang bibig.”
