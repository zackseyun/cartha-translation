revisions:
- from: At kung marinig iyon ng asawa niya ngunit hindi siya nito pagsabihan[a] at hindi pawalang-bisa ang kanyang panata, mananatiling may bisa ang lahat ng kanyang mga panata, at mananatiling may bisa ang bawat pananagutang itinali niya sa kanyang sarili.
  to: Kung marinig ng asawa niya at wala siyang sabihin sa kanya, at hindi niya pawalang-bisa ang kanyang panata, mananatiling may bisa ang lahat ng kanyang mga panata, at mananatiling may bisa ang bawat obligasyong itinali niya sa kanyang sarili.
  rationale: Pinalitan ang pariralang nagsasaad ng pagsaway ng pariralang malinaw na nagsasaad ng pananahimik. Inalis ang malabong dagdag na layon sa “marinig,” at ginawang “obligasyon” ang huling legal na termino upang mas maipakita ang sariling ibinigkis na obligasyon. Pinanatili ang legal na resulta na “mananatiling may bisa” at ang paralelismo ng Hebreo.
