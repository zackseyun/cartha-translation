  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: tl
  text: Kung marinig ng asawa niya at wala siyang sabihin sa kanya, at hindi niya pawalang-bisa ang kanyang panata, mananatiling may bisa ang lahat ng kanyang mga panata, at mananatiling may bisa ang bawat obligasyong itinali niya sa kanyang sarili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַע
  choice: At kung marinig
  rationale: Ang waw + qatal sa kasong legal ay nagpapatuloy sa kondisyon ng konteksto; natural sa Tagalog ang tahasang “kung.”
- source_word: אִישָׁהּ
  choice: asawa niya
  rationale: Sa kontekstong ito, ang אִישׁ na may hulaping 3fs ay tumutukoy sa asawa niyang lalaki.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: hindi siya nito pagsabihan
  rationale: Ipinahahayag nito ang pananahimik ng asawa bilang tugon; ang “hindi ... pagsabihan” ay natural at naipakikita ang kawalan ng pagtutol.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: hindi pawalang-bisa ang kanyang panata
  rationale: Sa kabanatang ito, ang pandiwa ay tumutukoy sa pagpapawalang-bisa sa panata o obligasyon. Ginawang tahas ang ipinahihiwatig na layon para sa linaw sa Tagalog.
- source_word: וְקָמוּ
  choice: mananatiling may bisa
  rationale: Sa gamit na legal, ang קום ay nangangahulugang nananatiling balido o umiiral, hindi lamang literal na nakatayo.
- source_word: כָּל נְדָרֶיהָ
  choice: lahat ng kanyang mga panata
  rationale: Karaniwang salin ng נדר sa batas tungkol sa mga panata.
- source_word: וְכָל אִסָּר
  choice: bawat pananagutan
  rationale: Ang אִסָּר ay isang nagbibigkis na sariling obligasyon o pagbabawal; ang “pananagutan” ay malinaw at natural sa modernong Tagalog.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: itinali niya sa kanyang sarili
  rationale: Pinananatili nito ang metapora ng Hebreo tungkol sa pagbibigkis ng obligasyon sa sarili.
- source_word: יָקוּם
  choice: mananatiling may bisa
  rationale: Inuulit ang legal na resulta at ang paralelismo ng Hebreo sa natural na Tagalog.
