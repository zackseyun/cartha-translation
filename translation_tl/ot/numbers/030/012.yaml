translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang legal na pariralang “mananatiling may bisa” upang ihatid ang diwa ng קום, at pinanatili ang metapora ng sariling pagbibigkis sa huling sugnay.
