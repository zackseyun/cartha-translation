  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: tl
  text: Ngunit kung tutulan siya ng kanyang ama sa araw na marinig niya ito, wala ni isa man sa kanyang mga panata o obligasyong kusang ibinuklod niya sa sarili[a] ang mananatiling may bisa. Patatawarin siya ni Yahweh, sapagkat tinutulan siya ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga tali” na itinali niya sa kanyang sarili—mga pangako o obligasyong nagbibigkis sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyong may pagsalungat sa naunang kalagayan.
- source_word: הֵנִיא
  choice: tutulan siya / tinutulan siya
  rationale: Sa konteksto ng panata, tumutukoy ito sa pagtutol ng ama na nagpapawalang-bisa sa panata; pinananatili rin ang anak na babae bilang tuwirang layon ng pandiwa.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: sa araw na marinig nito ang tungkol doon
  rationale: Pinananatili ang tiyak na panahong hinihingi ng batas at nililinaw na ang ama ang nakarinig.
- source_word: כָּל נְדָרֶיהָ וֶאֱסָרֶיהָ
  choice: ang alinman sa kanyang mga panata o mga ipinataw niyang tali sa kanyang sarili
  rationale: Inilalagay ang saklaw ng pagtanggi sa buong dalawang uri ng pangako; ang 'mga tali' ay nagpapanatili sa metapora ng obligasyong nagbibigkis.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: mga ipinataw niyang tali sa kanyang sarili
  rationale: Natural na Filipino na nagpapahayag ng kusang pagbibigkis sa sarili sa pamamagitan ng obligasyon.
- source_word: לֹא יָקוּם
  choice: hindi mananatiling may bisa
  rationale: Ipinahahayag ang legal na di-pagkakatatag ng mga panata habang pinananatili ang diwa ng Hebreong 'hindi tatayo/mananatili.'
- source_word: וַיהוָה
  choice: ni Yahweh
  rationale: Ginagamit ang personal na pangalan na kinakatawan ng tetragrammaton sa tekstong Hebreo.
- source_word: יִסְלַח לָהּ
  choice: Patatawarin siya
  rationale: Tuwirang salin ng pangakong banal na kapatawaran nang hindi dinaragdagan ang saklaw nito.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na nagpapakilala sa dahilang ibinibigay ng talata.
theological_decisions:
- issue: Saklaw ng kapatawaran ni Yahweh kaugnay ng pinawalang-bisang panata
  choice: Pinananatili ang payak na pahayag na patatawarin siya ni Yahweh dahil sa pagtutol ng ama.
  alternative: Ipaliwanag na ito ay kapatawaran sa kasalanan ng hindi pagtupad sa panata, o sabihing walang anumang moral na pagkakasala.
  rationale: Hindi tinutukoy ng talata ang eksaktong uri o lawak ng pagkakasala; ang pagdaragdag nito ay lulutas sa tensiyong hindi nilulutas ng tekstong Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “tutulan” upang panatilihin ang Hebreong sintaks na ang anak ang tuwirang layon, at ang “mananatiling may bisa” upang gawing malinaw ang legal na kahulugan ng “hindi tatayo.”
