base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: tl
  text: Ito ang mga tuntuning iniutos ni Yahweh kay Moises tungkol sa isang lalaki at sa kanyang asawa, at tungkol sa isang ama at sa kanyang anak na babae noong bata pa siya, sa bahay ng kanyang ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa pagitan ng isang lalaki at ng kanyang asawa, at sa pagitan ng isang ama at ng kanyang anak na babae sa kanyang kabataan, sa bahay ng kanyang ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: Ito ang mga tuntunin
  rationale: Ang pangmaramihang pantukoy na אֵלֶּה ay likas na naipapahayag sa Filipino bilang “Ito ang,” at ang חֻקִּים ay mga itinakdang regulasyong may legal na diwa, kaya “mga tuntunin.”
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: na iniutos ni Yahweh kay Moises
  rationale: Pinananatili ang tuwirang diwa ng צוה at ang personal na pangalang יהוה bilang “Yahweh”; ang “kay Moises” ang natural na hulma sa Filipino para sa taong tumanggap ng utos.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: tungkol sa isang lalaki at sa kanyang asawa
  rationale: Literal na “sa pagitan ng isang lalaki at ng kanyang asawa,” ngunit sa buod na legal na ito, ipinakikilala ng בֵּין ang ugnayang saklaw ng mga tuntunin. Mas natural sa Filipino ang “tungkol sa” nang hindi binabago ang saklaw.
- source_word: בֵּין אָב לְבִתּוֹ
  choice: at tungkol sa isang ama at sa kanyang anak na babae
  rationale: Kaagapay ito ng naunang pariralang may בֵּין. Pinananatili ang tiyak na ugnayang ama-anak at ang kasarian ng בִּתּוֹ.
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: habang bata pa ito at naninirahan sa bahay ng kanyang ama
  rationale: Ang בִּנְעֻרֶיהָ ay tumutukoy sa panahon ng kanyang kabataan, at ang בֵּית אָבִיהָ sa kalagayan niya sa sambahayan ng ama. Idinugtong ang “naninirahan” upang maging malinaw at natural ang relasyon ng dalawang parirala sa Filipino.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya tinutumbasan ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Mga katawagang may kasarian sa kontekstong legal
  choice: isang lalaki ... kanyang asawa ... isang ama ... kanyang anak na babae
  alternative: isang asawang lalaki ... kanyang asawa ... isang ama ... kanyang anak na babae
  rationale: Tiyak sa kasarian at ugnayan ang mga katawagang Hebreo. Ang “lalaki” ay nagpapanatili sa anyo ng אִישׁ, samantalang nililinaw ng kasunod na “asawa” ang relasyong mag-asawa.
- issue: Saklaw ng pariralang “habang bata pa”
  choice: iniugnay sa anak na babae habang nasa sambahayan ng ama
  alternative: kabataan lamang bilang pangkalahatang edad
  rationale: Magkasunod sa Hebreo ang “sa kanyang kabataan” at “sa bahay ng kanyang ama.” Pinananatili nitong magkaugnay ang edad at kalagayan sa sambahayan nang hindi nagdaragdag ng tiyak na edad o doktrinang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tuntunin” para sa legal na himig nang hindi sobrang teknikal. Ang panghalip na “ito” ay umiiwas sa pansamantalang kalituhan kung sino ang tinutukoy sa pariralang “habang bata pa,” habang nananatiling natural sa karaniwang Filipino.
