  terminology: Ang "mga tuntunin," "Yahweh," "Moises," "lalaki," "asawa," "ama," at "anak na babae" ay angkop sa makabagong Filipino at sa legal na rehistro. Pinananatili ang pangalang Yahweh at ang mga ugnayang may kasarian.
