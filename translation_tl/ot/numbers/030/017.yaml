  to: Ito ang mga tuntuning iniutos ni Yahweh kay Moises tungkol sa isang lalaki at sa kanyang asawa, at tungkol sa isang ama at sa kanyang anak na babae noong bata pa siya, sa bahay ng kanyang ama.[a]
