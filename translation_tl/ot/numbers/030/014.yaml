  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: tl
  text: Ang bawat panata at bawat panunumpang nagbubuklod upang pahirapan ang sarili[a] ay maaaring pagtibayin ng kanyang asawa, o maaaring pawalang-bisa ng kanyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pahirapan ang kaluluwa”; maaari ring “pagkaitan ang sarili” o “magpakumbaba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: panata
  rationale: Ang “panata” ang karaniwan at angkop na salin para sa taimtim na pangakong may sagradong pananagutan.
- source_word: שְׁבֻעַת אִסָּר
  choice: panunumpang nagbubuklod
  rationale: Pinananatili nito kapwa ang pormal na panunumpa at ang puwersa ng אִסָּר bilang obligasyong nagtatali o naghihigpit.
- source_word: לְעַנֹּת נָפֶשׁ
  choice: upang pahirapan ang sarili
  rationale: Likas ito sa modernong Filipino at pinananatili ang diwa ng Hebreong idyoma nang hindi agad nililimitahan sa pag-aayuno o sa isang tiyak na anyo ng pagkakait sa sarili.
- source_word: נָפֶשׁ
  choice: sarili
  rationale: Sa idyomang ito, ang נֶפֶשׁ ay tumutukoy sa buong sarili o pagkatao; mas natural dito ang “sarili” kaysa “kaluluwa,” habang inilalahad sa talababa ang literal na anyo.
- source_word: אִישָׁהּ
  choice: kanyang asawa
  rationale: Sa kontekstong legal tungkol sa kasal, malinaw na tumutukoy ito sa asawa ng babae.
- source_word: יְקִימֶנּוּ
  choice: maaaring pagtibayin
  rationale: Ang Hiphil ng קום ay nangangahulugang hayaang manatiling may bisa o kilalaning balido ang panata.
- source_word: יְפֵרֶנּוּ
  choice: maaaring pawalang-bisa
  rationale: Sa batas tungkol sa mga panata, ang Hiphil ng פרר ay nangangahulugang ipawalang-saysay o alisin ang bisa.
- source_word: כָּל ... וְכָל
  choice: ang bawat ... at bawat ...
  rationale: Pinananatili ng inuulit na “bawat” ang komprehensibong at distributibong diin ng Hebreo.
theological_decisions:
- issue: Saklaw ng לְעַנֹּת נָפֶשׁ
  choice: pahirapan ang sarili
  alternative: pagkaitan ang sarili / magpakumbaba
  rationale: Hindi tahasang tinutukoy ng talata kung pag-aayuno o ibang uri ng pagtitimpi ang nasa isip; pinananatili ng salin at talababa ang lawak at tensiyon ng idyoma.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang legal na mga pandiwang “pagtibayin” at “pawalang-bisa,” ngunit iniwasan ang labis na teknikal na pananalita. Inilipat ang talababa sa mismong pariralang tinutukoy nito.
