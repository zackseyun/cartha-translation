base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: tl
  text: Ngunit kung patuloy na nananahimik sa kanya araw-araw ang kanyang asawang lalaki, pinagtitibay niya ang lahat ng kanyang panata o ang lahat ng kanyang pananagutang nagbibigkis sa kanya[a]. Pinagtibay niya ang mga iyon, sapagkat nanahimik siya sa kanya noong araw nang marinig niya ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng kanyang mga pangakong nagbibigkis.” Ang salitang Hebreo ay tumutukoy sa mga kusang-loob na pangakong nagbibigkis sa taong gumawa ng mga iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: talagang mananahimik
  rationale: Ipinahahayag ang diin ng infinitive absolute at finite verb, habang pinananatili ang legal na diwa ng hindi pagtutol.
- source_word: אִישָׁהּ
  choice: ang asawa niya
  rationale: Sa kontekstong ito ng batas tungkol sa mag-asawa, malinaw na tumutukoy ito sa kanyang asawang lalaki; natural sa modernong Tagalog ang walang-kasariang katawagang “asawa” dahil malinaw ang tinutukoy sa konteksto.
- source_word: מִיּוֹם אֶל יוֹם
  choice: sa araw-araw
  rationale: Ipinapakita ang patuloy na pananahimik sa paglipas ng sunod-sunod na mga araw sa maikli at natural na Tagalog.
- source_word: וְהֵקִים
  choice: pinagtitibay
  rationale: Ang Hiphil ng קום ay may legal na diwang hinahayaang manatiling may bisa o pinagtitibay ang panata.
- source_word: נְדָרֶיהָ
  choice: kanyang panata
  rationale: Karaniwang katumbas ng נדר sa legal at panrelihiyong konteksto.
- source_word: אֱסָרֶיהָ
  choice: kanyang pananagutan
  rationale: Tumutukoy sa mga kusang-loob na pangakong nagbibigkis sa gumawa nito; inililinaw ng kasunod na parirala ang legal na bisa.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: nagbibigkis sa kanya
  rationale: Natural na Tagalog na nagpapanatili sa metapora at diwa ng obligasyong nakapataw sa kanya.
- source_word: הֵקִים אֹתָם
  choice: Pinagtibay niya ang mga iyon
  rationale: Inilalahad bilang natapos na kilos ang legal na epekto ng nauna niyang pananahimik.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang sanhi ng pagkakabisa ng mga panata at pananagutan.
- source_word: הֶחֱרִשׁ לָהּ
  choice: nanahimik siya
  rationale: Pinananatili ang paulit-ulit na legal na motibo ng pananahimik bilang hindi pagtutol, nang hindi gumagamit ng pilit na pariralang “nanahimik sa kanya.”
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: sa araw na marinig niya ang mga iyon
  rationale: Malapit sa Hebreong pormulang temporal at malinaw ang bagay na narinig sa Tagalog.
