revisions:
- from: Ngunit kung talagang mananahimik ang asawa niya sa kanya sa araw-araw, pinagtitibay nito ang lahat ng kanyang panata o ang lahat ng kanyang pananagutang nagbibigkis sa kanya[a]. Pinagtibay niya ang mga iyon sapagkat nanahimik siya sa araw na marinig niya ang mga iyon.
  to: Ngunit kung patuloy na nananahimik sa kanya araw-araw ang kanyang asawang lalaki, pinagtitibay niya ang lahat ng kanyang panata o ang lahat ng kanyang pananagutang nagbibigkis sa kanya[a]. Pinagtibay niya ang mga iyon, sapagkat nanahimik siya sa kanya noong araw nang marinig niya ang mga iyon.
  rationale: Tahasan nang isinalin ang lalaki bilang “kanyang asawang lalaki,” pinalitan ang malabong “nito” ng “niya,” at inayos ang pangwakas na temporal na sugnay upang malinaw na nakaraan ang pagkarinig. Pinanatili ang pag-uulit ng pananahimik “sa kanya,” sapagkat naroon ang לָהּ sa Hebreo at mahalaga ito sa legal na balangkas ng talata.
