base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: tl
  text: At kung marinig ng kanyang ama ang kanyang panata o ang pananagutang[a] itinakda niya para sa sarili, at wala siyang sabihin sa kanya[b], mananatiling may bisa ang lahat ng kanyang panata, at mananatiling may bisa ang bawat pananagutang itinakda niya para sa sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na אִסָּר ay maaari ring tumukoy sa “pagkakatali” o “mahigpit na pangako.” Naiiba ito sa salitang isinaling “panata,” bagaman magkaugnay ang dalawa.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at nanahimik ang kanyang ama sa kanya.” Ipinahihiwatig ng pananahimik na hindi niya ito tinututulan, kaya nananatiling may bisa ang mga panata at pananagutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: panata / mga panata
  rationale: Sa kontekstong legal at panrelihiyon, ang נֵדֶר ay isang taimtim na panatang ginawa sa Diyos. Karaniwan at malinaw sa modernong Tagalog ang “panata.”
- source_word: אִסָּר / אֱסָרָהּ
  choice: obligasyong ipinataw niya sa kanyang sarili
  rationale: Ang אִסָּר ay isang sariling ipinataw na pagpipigil o pananagutang may bisa, na kaugnay ngunit naiiba sa נֵדֶר. Pinananatili ng “obligasyon” ang legal na bigat at ang pagkakaiba nito sa “panata.”
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: ipinataw niya sa kanyang sarili
  rationale: Ipinahahayag nito sa natural na Tagalog ang diwang reflexive ng Hebreong idyoma—siya mismo ang naglagay sa kanyang sarili sa ilalim ng obligasyon.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: walang sabihin sa kanya ang kanyang ama
  rationale: Ang pandiwa ay nangangahulugang manahimik. Likas sa Tagalog ang pariralang ito at pinananatili nito ang tahasang kilos ng hindi pagsasalita, habang ipinapaliwanag sa talababa ang legal na kabuluhan ng pananahimik.
- source_word: וְקָמוּ ... יָקוּם
  choice: mananatiling may bisa
  rationale: Sa legal na kontekstong ito, ang קום ay nangangahulugang manatiling nakatayo o balido. Mas malinaw sa karaniwang mambabasa ang “mananatiling may bisa” kaysa sa literal na “tatayo.”
- source_word: וְ
  choice: At kung
  rationale: Bagaman simpleng pang-ugnay ang Hebreo, ipinagpapatuloy nito ang kondisyunal na kasong legal mula sa naunang talata. Ginagawang malinaw ng “At kung” ang tungkuling ito sa diskurso.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang malinaw na pananalitang legal na “mananatiling may bisa,” at iniwasan ang arkaikong bokabularyo. Pinanatiling magkaiba ang “panata” at “obligasyon,” gaya ng pagkakaiba ng dalawang terminong Hebreo.
