base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: tl
  text: Ngunit kung talagang pawawalang-bisa ng asawa niya ang mga ito sa araw na marinig niya ang mga ito, hindi magkakabisa ang anuman sa lahat ng binigkas niya—ang kanyang mga panata man o ang obligasyong ibinigkis niya sa sarili.[a] Pinawalang-bisa ng asawa niya ang mga ito, at patatawarin siya ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lahat ng lumabas sa kanyang mga labi”—isang legal na pananalitang sumasaklaw sa lahat ng pasalitang panata at obligasyong ibinuklod niya sa sarili.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH, ang personal na pangalan ng Diyos, na isinaling “Yahweh.”'
    reason: divine_name
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinapakita ang kondisyong may pagsalungat sa naunang kaso.
- source_word: הָפֵר יָפֵר
  choice: talagang pawalang-bisa
  rationale: Ipinahahayag ang diin ng infinitive absolute at imperfect sa natural na Tagalog.
- source_word: אִישָׁהּ
  choice: asawa niya
  rationale: Ang konteksto ay batas tungkol sa mag-asawa; malinaw at likas ito sa modernong Tagalog.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: sa araw na marinig niya ang tungkol sa mga iyon
  rationale: Pinananatili ang legal na takdang panahon at nililinaw ang ipinahihiwatig na layon ng pandiwang 'marinig.'
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: ang anumang lumabas sa mga labi ng babae
  rationale: Malapit sa literal na 'lahat ng lumalabas sa kanyang mga labi' ngunit natural sa pangungusap na may kasunod na pagtanggi.
- source_word: לִנְדָרֶיהָ
  choice: ang kanyang mga panata
  rationale: Karaniwang salin ng נדר sa legal at panrelihiyong konteksto.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: ang pananagutang ipinangbigkis niya sa kanyang sarili
  rationale: Pinananatili ang ideya ng obligasyong kusang nagbibigkis sa mismong tao nang hindi nililimitahan ito sa pagtanggi sa sarili.
- source_word: לֹא יָקוּם
  choice: hindi mananatiling may bisa
  rationale: Natural na legal na Tagalog para sa isang pangakong hindi na tatayo o iiral bilang may-bisang obligasyon.
- source_word: הֲפֵרָם
  choice: Pinawalang-bisa ... ang mga iyon
  rationale: Ibinubuod ang tiyak na pagkilos ng asawa at ang resulta nito.
- source_word: וַיהוָה
  choice: ni Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: יִסְלַח לָהּ
  choice: patatawarin siya
  rationale: Tuwirang salin na pinananatili ang legal at teolohikal na pahayag ng talata.
theological_decisions:
- issue: Ang kaugnayan ng pagpapawalang-bisa sa kapatawaran
  choice: 'Pinananatili ang pagkakasunod ng teksto: nawalan ng bisa ang mga panata dahil pinawalang-bisa ng asawa, at patatawarin ng Diyos ang babae.'
  alternative: Tukuyin na ang kapatawaran ay para lamang sa padalus-dalos na paggawa ng panata, o ituring itong pormulang walang ipinahihiwatig na pananagutan.
  rationale: Hindi tiyak na sinasabi ng Hebreo kung anong partikular na pagkakasala ang pinatatawad; kaya hindi ito pinalalawak o nilulutas sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pawalang-bisa” at “mananatiling may bisa” upang mapanatili ang legal na himig; iniwasan ang masyadong teknikal o makalumang pananalita.
