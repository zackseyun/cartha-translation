    rationale: Ang "ipinangbigkis" ay mabigat at hindi karaniwang kolokasyon sa modernong Tagalog. Ang "obligasyong ibinigkis niya sa sarili" ay mas malinaw habang pinananatili ang sariling-pagbubuklod na ipinahihiwatig ng Hebreo.
