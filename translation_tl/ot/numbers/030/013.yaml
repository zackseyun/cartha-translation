  source_fidelity: 'Ang diwa at legal na pagkakasunod ng Hebreo ay naipapahayag nang wasto: kung pawawalang-bisa ng asawa ang mga panata/obligasyon sa araw na marinig niya ang mga ito, hindi magkakabisa ang mga ito, at patatawarin siya ni Yahweh. Gayunman, ang "marinig niya ang tungkol sa mga iyon" ay mas maluwag kaysa sa tuwirang "marinig niya ang mga ito," at ang "ipinangbigkis niya sa kanyang sarili" ay hindi likas na Tagalog.'
  naturalness: Kailangan ng maliit ngunit makabuluhang rebisyon para sa mas natural na modernong Filipino Tagalog. Ang "mga ito" ay malinaw na tumutukoy sa mga panata at obligasyon, at ang "obligasyong ibinigkis niya sa sarili" ay mas maayos na naghahatid ng reflexive na puwersa ng Hebreo.
  terminology: Nananatiling angkop ang "panata," "pawawalang-bisa," "magkakabisa," at "Yahweh." Pinanatili ang legal na rehistro nang hindi nagdaragdag ng paliwanag tungkol sa saklaw ng kapatawaran.
