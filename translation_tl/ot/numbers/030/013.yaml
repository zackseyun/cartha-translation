  to: Ngunit kung talagang pawawalang-bisa ng asawa niya ang mga ito sa araw na marinig niya ang mga ito, hindi magkakabisa ang anuman sa lahat ng binigkas niya—ang kanyang mga panata man o ang obligasyong ibinigkis niya sa sarili.[a] Pinawalang-bisa ng asawa niya ang mga ito, at patatawarin siya ni Yahweh.[b]
