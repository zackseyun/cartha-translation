  source_fidelity: 'Tumpak ang salin sa Hebreo: ipinakikita nito ang pagsulong ng salaysay, ang pakikipag-usap ni Moises sa mga pinuno ng mga lipi na kaugnay ng mga anak ni Israel, ang pagpapakilala ng tuwirang pahayag, at ang pormulang nagsasaad ng utos ni Yahweh. Ang “salitang iniutos” ay katumbas na katumbas at angkop para sa זֶה הַדָּבָר אֲשֶׁר צִוָּה.'
  naturalness: Likas at marangal ang modernong Filipino. Ang “Pagkatapos, nagsalita si Moises ... at sinabi” ay bahagyang paulit-ulit sa estilong Tagalog ngunit malinaw, katanggap-tanggap, at mahusay na kumakatawan sa Hebreong pandiwang panimula at לֵאמֹר.
  terminology: Ang “mga pinuno ng mga lipi” ay natural para sa רָאשֵׁי הַמַּטּוֹת. Ang “mga anak ni Israel” ay wastong nagpapanatili ng pamilyal na pahayag nang may ibinigay na idyomatikong alternatibo sa talababa. Wasto at pare-pareho ang “Yahweh” para sa יהוה. Ang mga talababa ay tama ang mga angkla at tapat na inilalahad ang mga alternatibong leksikal.
