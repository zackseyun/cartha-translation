id: NUM.30.2
reference: Numbers 30:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל רָאשֵׁ֣י הַ/מַּטּ֔וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: tl
  text: Pagkatapos, nagsalita si Moises sa mga pinuno ng mga lipi ng mga anak ni Israel[a] at sinabi, “Ito ang salitang iniutos ni Yahweh:[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas idyomatiko, “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “Ito ang iniutos ni Yahweh.” Sa Hebreo, “Ito ang salitang iniutos ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos” bilang panandang sunuran, samantalang pinananatili ng “nagsalita” ang diwa ng pandiwa.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: mga pinuno ng mga lipi
  rationale: Ang רָאשֵׁי ay literal na “mga ulo” ngunit tumutukoy sa mga namumuno; ang מַטּוֹת dito ay mga lipi ng Israel. Ang “mga pinuno ng mga lipi” ay malinaw at natural nang hindi binabago ang kaayusang panlipunan ng teksto.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ng mga anak ni Israel
  rationale: Pinananatili nito ang pamilyal at tipanang pananalita ng Hebreo, sa halip na gawing mas pangkalahatang “mga Israelita.”
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Ipinakikilala ng infinitive ang tuwirang pananalita. Mas natural sa Tagalog ang “at sinabi” kaysa sa literal ngunit mabigat na “na sinasabi.”
- source_word: זֶה הַדָּבָר
  choice: Ito ang salita
  rationale: Maaaring mangahulugan ang דָּבָר ng “salita,” “bagay,” o “utos.” Pinananatili ng “salita” ang pormal na larawan ng isang kapahayagang may awtoridad, habang inilalahad sa talababa ang mas idyomatikong anyo.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang ganap na pandiwa ay tumutukoy sa utos na naibigay na at ngayo'y ipinahahayag ni Moises. Natural sa Tagalog ang aspektong perpektibo na “iniutos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreong teksto. Pinananatili ng “Yahweh” ang pagkakaiba nito sa karaniwang titulong “Panginoon.”
- issue: Pamilyal na pananalitang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng napiling anyo ang pamilyal na larawan ng orihinal at hindi ito tahimik na pinapantay sa isang pangkat-etnikong katawagan.
- issue: Saklaw ng דָּבָר sa pormula ng utos
  choice: salita
  alternative: ganito ang iniutos
  rationale: May saklaw na “salita,” “bagay,” o “usapin” ang דָּבָר. Pinananatili sa pangunahing teksto ang mas pormal na “salita,” ngunit ibinibigay ang mas idyomatikong alternatibo nang hindi ipinipilit na isa lamang ang maaaring diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga pinuno” sa halip na literal na “mga ulo” para sa natural na kahulugan, ngunit pinanatili ang “mga anak ni Israel” at “salita” upang mapangalagaan ang mahahalagang larawan ng Hebreo. Ang bantas na tutuldok ay nagpapakitang nagpapatuloy sa susunod na talata ang mismong utos.
