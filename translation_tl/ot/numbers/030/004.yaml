  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: tl
  text: At kung ang isang babae ay manata ng isang panata kay Yahweh at itali ang sarili sa isang pananagutan habang nasa bahay ng kanyang ama sa panahon ng kanyang kabataan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: At kung ang isang babae
  rationale: Naghaharap ito ng panibagong kondisyon sa batas; natural sa modernong Filipino ang “kung” habang pinananatili ang kasuistikong diwa.
- source_word: תִדֹּר נֶדֶר
  choice: manata ng isang panata
  rationale: Pinananatili ang magkaugnay na pandiwa at pangngalan sa Hebreo at ang pormal na bigat ng gawaing panrelihiyon.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na יהוה bilang Yahweh.
- source_word: וְאָסְרָה אִסָּר
  choice: at itali ang sarili sa isang pananagutan
  rationale: Ipinahahayag ang paglalagay niya sa sarili sa ilalim ng isang nagbibigkis na obligasyon, nang hindi ipinapantay ang אִסָּר sa נֶדֶר.
- source_word: בְּבֵית אָבִיהָ
  choice: habang nasa bahay ng kanyang ama
  rationale: Pinananatili ang lokasyon at kalagayang sambahayan na mahalaga sa legal na kaso.
- source_word: בִּנְעֻרֶיהָ
  choice: noong kabataan niya
  rationale: Malapit ito sa literal na panahon ng kanyang kabataan at hindi tahasang nagdaragdag ng interpretasyong “walang asawa.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalang tipan.
- issue: Ugnayan ng נֶדֶר at אִסָּר
  choice: “panata” at “pananagutan” bilang magkaugnay ngunit hindi ganap na magkaparehong termino
  alternative: Gawing “panata” ang dalawang termino
  rationale: Pinananatili nito ang leksikal na pagkakaiba at ang posibleng legal na pagkakaiba sa pagitan ng panata at ng nagbibigkis na obligasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong kondisyonal at ang di-natapos na pangungusap dahil nagpapatuloy ang legal na kondisyon sa kasunod na talata.
