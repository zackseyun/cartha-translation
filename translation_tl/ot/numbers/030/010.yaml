translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may bahagyang legal na tono. Ginamit ang “mananatiling may bisa sa kanya” upang natural na maipahayag ang legal na metapora ng Hebreo habang pinanatili sa talababa ang mas literal na alternatibo.
