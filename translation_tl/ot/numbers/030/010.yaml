  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: tl
  text: At ang panata ng isang biyuda o babaeng diborsiyada—anumang pananagutang itinakda niya sa kanyang sarili—ay mananatiling may bisa sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay mananatiling may-bisa laban sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: panata
  rationale: Sa legal at panrelihiyong konteksto, tumutukoy ito sa taimtim na pangakong ginawa sa Diyos; “panata” ang likas at tiyak na katumbas sa Filipino.
- source_word: אַלְמָנָה
  choice: biyuda
  rationale: Karaniwan at malinaw na tawag sa babaeng namatayan ng asawa.
- source_word: גְרוּשָׁה
  choice: babaeng diborsiyada
  rationale: Ipinahihiwatig ng anyong pasibo ang babaeng hiniwalayan o diniborsiyo; malinaw ito at angkop sa legal na konteksto.
- source_word: כֹּל אֲשֶׁר
  choice: anumang
  rationale: Pinananatili nito ang saklaw na sumasaklaw sa lahat ng obligasyong tinutukoy ng kasunod na pandiwa.
- source_word: אָסְרָה
  choice: ipinangako niyang pananagutan
  rationale: Ang literal na diwang “itinali” ay tumutukoy rito sa kusang paglalagay ng obligasyon sa sarili; ang parirala ay natural sa Filipino at pinananatili ang legal na lakas.
- source_word: עַל נַפְשָׁהּ
  choice: niyang pananagutan
  rationale: Isinasama sa parirala ang reflexive na diwa ng pag-aatang niya ng obligasyon sa sarili, nang hindi gumamit ng di-likas na literal na “sa kanyang kaluluwa.”
- source_word: יָקוּם
  choice: mananatiling may bisa
  rationale: Sa legal na gamit, ang קום ay nangangahulugang manindigan o manatiling balido; malinaw na ipinapahayag ng salin ang patuloy na bisa.
- source_word: עָלֶיהָ
  choice: sa kanya
  rationale: Ipinapakita nito na sa babae nakasalalay ang obligasyon; ang alternatibong “may bisa laban sa kanya” ay mas literal ngunit hindi gaanong natural sa Filipino.
