  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: tl
  text: Ngunit kung, sa araw na marinig ito ng kanyang asawa, hindi siya pahihintulutan nito at pawawalang-bisa ang panatang nakaatang sa kanya o ang binigkas ng kanyang mga labi[a] na ipinataw niya sa sarili niya, patatawarin siya ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang padalus-dalos na binigkas ng kanyang mga labi” o “ang nagbibigkis na binigkas ng kanyang mga labi.”
    reason: Hindi ganap na tiyak kung ang מִבְטָא ay nagpapahiwatig ng pabigla-biglang pananalita o tumutukoy lamang sa binigkas na pananagutang nagbibigkis.
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahahayag ang kondisyong may pagsalungat sa naunang kalagayan.
- source_word: בְּיוֹם שְׁמֹעַ
  choice: sa araw na marinig iyon
  rationale: Pinananatili ang temporal na diwa ng idyomang Hebreo at ginagawang natural sa Tagalog ang ipinahihiwatig na layon ng pandinig.
- source_word: אִישָׁהּ
  choice: kanyang asawa
  rationale: Sa kontekstong legal na ito, tumutukoy ang אִישׁ sa asawa ng babae.
- source_word: יָנִיא אֹתָהּ
  choice: hadlangan siya nito
  rationale: Ipinapahayag ng Hiphil ng נוא ang pagpigil o hindi pagpapahintulot na magkabisa ang pananagutan.
- source_word: וְהֵפֵר
  choice: at pawalang-bisa
  rationale: Legal na pagpapawalang-saysay sa bisa ng panata ang diwa, hindi literal na pagsira.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: ang panatang nakaatang sa kanya
  rationale: Pinananatili ang Hebreong larawan ng obligasyong nakapatong o nakaatang sa isang tao.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: ang padalus-dalos na sinabi ng kanyang mga labi
  rationale: Ipinakikita ang posibleng diwa ng isang pabigla-biglang binigkas na pananagutan habang pinananatili sa talababa ang tunay na leksikal na kalabuan.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: na ipinangbigkis niya sa kanyang sarili
  rationale: Pinananatili ang metapora ng pagbibigkis sa sarili sa isang obligasyon.
- source_word: וַיהוָה
  choice: ni Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang יהוה bilang Yahweh.
- source_word: יִסְלַח לָהּ
  choice: patatawarin siya
  rationale: Malinaw na inilalahad ang legal at tipanang bunga ng pagpapatawad.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa teksto; ang “Yahweh” ay tuwirang kumakatawan sa pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Diwa ng מִבְטָא שְׂפָתֶיהָ
  choice: ang padalus-dalos na sinabi ng kanyang mga labi
  alternative: ang sinabi ng kanyang mga labi; ang nagbibigkis na sinabi ng kanyang mga labi
  rationale: Maaaring magpahiwatig ang parirala ng pabigla-biglang pananalita, ngunit hindi tiyak ang nuances nito; kaya inilalahad sa talababa ang mas neutral at ibang posibleng pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa tekstong legal. Ginamit ang “nakaatang” at “ipinangbigkis” upang mapanatili ang mahahalagang metapora ng Hebreo nang nananatiling nauunawaan ng karaniwang mambabasa.
