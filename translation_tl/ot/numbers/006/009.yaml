source:
  edition: WLC
  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: tl
  text: At kung may taong biglang mamatay sa tabi niya[a] at madungisan ang ulo ng kanyang pagkakatalaga[b], aahitan niya ang kanyang ulo sa araw ng kanyang paglilinis; sa ikapitong araw ay aahitan niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “kung mamatay ang isang patay sa tabi niya, bigla, bigla,” isang idyomang naglalarawan ng biglaan at di-inaasahang pagkamatay sa kanyang agarang kinaroroonan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “kanyang nakatalagang ulo.” Tahasang pinag-uugnay ng pariralang Hebreo ang ulo at ang kanyang pagkakatalaga bilang Nazareo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na וְ at ang kondisyunal na gamit ng כִּי sa kasong ito ng kautusan tungkol sa Nazareo.
- source_word: יָמוּת מֵת
  choice: may taong ... mamatay
  rationale: Likas na isinasalin sa Filipino ang Hebreong magkaugnay na pandiwa at pangngalan, na literal na tila ‘mamatay ang isang patay,’ bilang pagkamatay ng isang tao.
- source_word: עָלָיו
  choice: sa tabi niya
  rationale: Sa konteksto ng karumihang dulot ng bangkay, ipinahihiwatig nito ang agarang kalapitan sa Nazareo, hindi lamang ang literal na pagiging ‘sa ibabaw niya.’
- source_word: בְּפֶתַע פִּתְאֹם
  choice: biglang
  rationale: Ang magkatambal na mga salita ay nagbibigay-diin sa di-inaasahan at dagliang pagkamatay; natural itong ipinahahayag ng ‘biglang’ sa modernong Filipino.
- source_word: וְטִמֵּא
  choice: kaya marumihan
  rationale: Ipinahahayag ang resulta ng biglaang pagkamatay nang hindi pinipilit tukuyin kung ang namatay o ang pangyayari ang gramatikal na tagapagparumi. Ang ‘marumihan’ ay tumutukoy rito sa ritwal na karumihan.
- source_word: רֹאשׁ נִזְרוֹ
  choice: ang kanyang itinalagang ulo
  rationale: Iniuugnay ang ulo at buhok sa pagkakatalaga ng Nazareo nang hindi idinaragdag ang mas tiyak na salitang ‘panata,’ na wala sa pariralang ito.
- source_word: וְגִלַּח רֹאשׁוֹ
  choice: aahitan niya ang kanyang ulo
  rationale: Malinaw at natural na ipinapahayag ang hinihinging ritwal na tugon pagkatapos ng pagkadungis.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: sa araw ng kanyang paglilinis
  rationale: Pinananatili ang ritwal na kahulugan ng טָהֳרָה at ang nominal na anyo ng Hebreo.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: sa ikapitong araw
  rationale: Tuwiran at karaniwang temporal na pananalita sa Filipino.
- source_word: יְגַלְּחֶנּוּ
  choice: niya ito aahitan
  rationale: Ang ‘ito’ ay tumutukoy pabalik sa ulo, gaya ng hulaping panghalip sa Hebreo, habang pinananatili ang pag-uulit ng utos na mag-ahit.
theological_decisions:
- issue: Kalikasan ng pagkadungis sa pagkakatalaga ng Nazareo
  choice: 'Isinalin ang נִזְרוֹ sa wika ng ritwal na pagkakatalaga: ‘kanyang itinalagang ulo.’'
  alternative: ‘ulo ng kanyang pagkakatalaga’ o ‘ulo ng kanyang panata’
  rationale: Ang talata ay tungkol sa ritwal na karumihang nakagagambala sa pagkakatalaga ng Nazareo. Pinananatili ng napiling salin ang kaugnayan ng ulo at buhok sa pagkakatalaga nang hindi ipinapasok ang ‘panata’ sa pariralang walang tahasang salitang Hebreo para rito.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘marumihan’ at ‘paglilinis’ sa ritwal na diwa ayon sa konteksto. Pinanatili ang pag-uulit ng pag-ahit at iniwasan ang pagdaragdag ng denominasyonal o sistematikong paliwanag.
