  naturalness: Kailangan ng maliit ngunit mahalagang pag-aayos. Ang “kanyang itinalagang ulo” ay hindi karaniwang paraan ng pagpapahayag sa modernong Filipino at maaaring magmungkahi na ang pisikal na ulo mismo ang itinalaga. Ang “ulo ng kanyang pagkakatalaga” ay mas malapit sa Hebreo at mas malinaw sa ritwal na konteksto.
  terminology: Ginamit ang “pagkakatalaga” para sa נזר, na angkop at hindi nagdadagdag ng doktrinal na pakahulugan. Ang “madungisan” at “paglilinis” ay nagpapanatili ng ritwal na rehistro nang natural sa Filipino.
