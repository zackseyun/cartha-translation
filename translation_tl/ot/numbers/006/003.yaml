translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “matapang na inumin” bilang karaniwang katumbas ng שֵׁכָר, at “inuming pinagbabaran ng ubas” upang mapanatili ang mas tiyak na larawan ng Hebreong מִשְׁרָה. Parehong nakalagay sa pangunahing teksto ang mga panandang [a] at [b].
