  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: tl
  text: Iiwas siya sa alak at matapang na inumin; hindi siya iinom ng sukang mula sa alak o sukang mula sa matapang na inumin. Hindi rin siya iinom ng anumang inuming ibinabadang may ubas[a], ni kakain ng mga ubas, sariwa man o tuyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang likidong mula sa ibinabad o naprosesong ubas,” o “anumang katas ng ubas.” Maaaring tumukoy ang salitang Hebreo sa likidong nakuha sa pagbabad ng mga ubas.
    reason: lexical_alternative
  - marker: b
    text: 'O “sariwang ubas o pasas.” Literal sa Hebreo: “mga ubas na sariwa at tuyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: iiwas siya sa alak at matapang na inumin
  rationale: Ang Hiphil ng נזר sa batas tungkol sa Nazareo ay nangangahulugang lumayo o umiwas sa mga ipinagbabawal. Ang “iiwas” ay natural sa makabagong Tagalog at pinananatili ang diwa ng paghihiwalay sa mga ito.
- source_word: חֹמֶץ יַיִן וְחֹמֶץ שֵׁכָר
  choice: sukang mula sa alak o sukang mula sa matapang na inumin
  rationale: Ang חֹמֶץ ay maasim na alak o suka. Nililinaw ng “mula sa” ang ugnayan sa pinagmulan nang hindi nagdaragdag ng tiyak na prosesong wala sa Hebreo.
- source_word: מִשְׁרַת עֲנָבִים
  choice: inuming pinagbabaran ng ubas
  rationale: Ang מִשְׁרָה ay likidong nalilikha sa pagbabad. Mas malapit dito ang “inuming pinagbabaran ng ubas” kaysa sa “katas ng ubas,” na maaaring unawain lamang bilang pinigang sariwang katas.
- source_word: עֲנָבִים לַחִים וִיבֵשִׁים
  choice: mga ubas, sariwa man o tuyo
  rationale: Literal na pinagtatambal ng Hebreo ang sariwa o mamasa-masa at tuyo; pinananatili ng salin ang anyo at saklaw ng pares sa natural na Tagalog.
