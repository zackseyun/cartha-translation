base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: tl
  text: At ihahandog niya ang lalaking tupa bilang haing pangkapayapaan[a] kay Yahweh, kasama ng basket ng tinapay na walang pampaalsa. Ihahandog din ng pari ang handog na butil nito at ang handog na inumin nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog para sa pakikisama.” Ang Hebreong שְׁלָמִים ay maaaring tumukoy sa mga handog na pangkapayapaan o pakikisama.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: ang lalaking tupa
  rationale: Ang אַיִל ay tumutukoy sa isang adultong lalaking tupa, lalo na sa kontekstong paghahandog. Mas madaling maunawaan sa karaniwang modernong Filipino ang “lalaking tupa” kaysa sa mas bihirang “barakong tupa.”
- source_word: יַעֲשֶׂה
  choice: ihahandog niya
  rationale: Bagaman karaniwang nangangahulugang “gawin” ang עשה, tumutukoy ito rito sa pagsasagawa ng ritwal na paghahandog; kaya malinaw at likas ang “ihahandog.”
- source_word: זֶבַח שְׁלָמִים
  choice: bilang haing pangkapayapaan
  rationale: Pinananatili ng “hain” ang diwa ng זֶבַח at ng “pangkapayapaan” ang tradisyonal at malawak na kahulugan ng שְׁלָמִים, nang hindi nililimitahan ito sa pakikisama lamang.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay nagpapahayag kung kanino iniaalay ang hain, at tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: עַל סַל הַמַּצּוֹת
  choice: kasama ng basket ng tinapay na walang pampaalsa
  rationale: Sa ritwal na konteksto, ipinapahayag ng עַל ang pagsama ng basket sa hain. Ang “tinapay na walang pampaalsa” ay malinaw at karaniwang salin ng מַצּוֹת.
- source_word: מִנְחָתוֹ
  choice: ang handog na butil … na kalakip nito
  rationale: Sa mga tekstong pangsaserdote, ang מִנְחָה ay handog na butil. Ang hulaping panlalaki ay inuunawang tumutukoy sa kaugnay na hain; nililinaw ito ng “na kalakip nito” nang hindi itinuturing na pag-aari ng tao.
- source_word: נִסְכּוֹ
  choice: ang handog na inumin na kalakip nito
  rationale: Ang נֶסֶךְ ay inuming ibinubuhos bilang kasamang handog. Ang “handog na inumin” ay mas madaling maunawaan kaysa sa teknikal na “libasyon.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng שְׁלָמִים
  choice: haing pangkapayapaan
  alternative: handog para sa pakikisama
  rationale: Malawak ang saklaw ng katawagang Hebreo at maaaring iugnay kapwa sa kapayapaan at pakikisama. Pinananatili sa pangunahing teksto ang tradisyonal na katawagang “pangkapayapaan,” habang inilalagay sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lalaking tupa” at “handog na inumin” sa halip na mas teknikal o bihirang mga katawagan. Hinati sa dalawang pangungusap upang maging malinaw ang dalawang kilos ng paghahandog, habang pinananatili ang ugnayan ng mga ito.
