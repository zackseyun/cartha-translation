source:
  edition: WLC
  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: tl
  text: At ihahandog ng pari ang isa bilang handog para sa kasalanan[a] at ang isa bilang handog na sinusunog. Magbabayad-sala siya para sa taong nanata bilang Nazareo, sapagkat nagkasala ito kaugnay ng taong namatay[b]; at sa araw ding iyon ay itatalaga ng pari ang ulo ng taong iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog para sa paglilinis.” Ang salitang Hebreo ay katawagan sa handog na may kaugnayan sa kasalanan at rituwal na paglilinis, lalo na sa mga konteksto ng karumihan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ukol sa/hinggil sa tao.” Sa kontekstong ito, tumutukoy ito sa isang taong namatay—ibig sabihin, sa bangkay na naging sanhi ng rituwal na karumihan.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: ihahandog ng pari
  rationale: Bagaman literal na “gagawin,” ang pandiwa sa kontekstong pansakripisyo ay likas na nangangahulugang ihahandog ng pari ang mga hain.
- source_word: אֶחָד לְחַטָּאת
  choice: ang isa bilang handog para sa kasalanan
  rationale: Tinutukoy ng חַטָּאת ang uri ng handog na kaugnay ng kasalanan at rituwal na paglilinis; pinananatili sa pangunahing teksto ang nakasanayang katawagan at inilalagay sa talababa ang leksikal na alternatibo.
- source_word: וְאֶחָד לְעֹלָה
  choice: ang isa bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na buong sinusunog; malinaw at natural sa modernong Tagalog ang napiling anyo.
- source_word: וְכִפֶּר עָלָיו
  choice: Magbabayad-sala siya para sa taong nag-Nazareo
  rationale: Pinananatili ng “magbabayad-sala” ang kultiko at teolohikal na bigat ng כפר nang hindi ipinipilit ang isang partikular na teorya ng pagtubos. Nilinaw ang reperente ng panghalip upang maiwasan ang kalituhan kung pari o Nazareo ang tinutukoy.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: sapagkat nagkasala ito dahil sa patay
  rationale: Ang parirala ay nagbibigay ng dahilan ng pagbabayad-sala. Sa konteksto ng mga talata 6–12, ang נֶפֶשׁ ay tumutukoy sa isang taong namatay o bangkay; ang “dahil sa patay” ay maikli at hindi labis na nagpapakahulugan sa preposisyong עַל.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: muli nitong ilalaan ang kanyang ulo
  rationale: Ang ulo o buhok ang hayag na tanda ng pagkakatalaga ng Nazareo. Idinagdag ang “muli” ayon sa konteksto ng pagpapanibago matapos madungisan, bagaman ang pandiwa mismo ay simpleng “italaga/gawing banal.”
- source_word: בַּיּוֹם הַהוּא
  choice: sa araw ding iyon
  rationale: Natural na Tagalog ito para sa “sa araw na iyon” at naipahihiwatig ang agarang pagpapanibago ng pagkakatalaga.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa kontekstong pansakripisyo
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tukuyin ng termino ang handog na tumutugon sa kasalanan o, lalo na rito, ang paglilinis mula sa rituwal na karumihan. Ginamit ang mas nakikilalang katawagan sa teksto at pinanatili ang alternatibo sa talababa.
- issue: Reperente ng הַנָּפֶשׁ
  choice: ang patay
  alternative: bangkay
  rationale: Bagaman karaniwang nangangahulugang “tao/buhay” ang נֶפֶשׁ, sa batas ng Nazareo rito ay tumutukoy ito sa namatay na taong naging sanhi ng rituwal na karumihan. Ang “patay” ay natural at pinananatili ang personal na reperente.
- issue: Paksa ng וְקִדַּשׁ
  choice: ang taong nag-Nazareo ang muling maglalaan ng kanyang ulo
  alternative: ilatalaga ng pari ang ulo niya
  rationale: Ang sunod-sunod na pandiwang may iisang panlalaking paksa ay maaaring gramatikal na iugnay sa pari, ngunit ang rituwal na diwa at kaugnay na utos sa talata 12 ay nagpapahiwatig na ang Nazareo ang nagpapanibago ng kanyang pagkakatalaga. Nilinaw ito sa Tagalog habang kinikilala ang tensiyong sintaktiko.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “taong nag-Nazareo” upang malinaw ang reperente ng mga panghalip. Iniwasan ang mas teknikal na “ekspiyasyon” at pinili ang pamilyar na biblikal na “magbayad-sala.”
