    rationale: Sa Hebreo, ang pari ang nagpapatuloy na paksa ng וְעָשָׂה, וְכִפֶּר, at וְקִדַּשׁ. Ang ulo ay pag-aari ng taong pinagbayaran-sala, ngunit ang pandiwa ay kilos ng pari.
  - severity: medium
    issue: Idinagdag ang “muli” sa pangunahing teksto.
    rationale: May ideya ng panunumbalik sa mas malawak na konteksto, ngunit wala ang pang-abay na “muli” sa וְקִדַּשׁ; hindi ito dapat ipasok sa salin.
