  source_fidelity: 'Tumpak ang mga pangunahing katumbas: ang wayyiqtol ay naipapakita ng “At nagsalita,” ang יְהוָה ay pinananatiling “Yahweh,” at ang אֶל־מֹשֶׁה ay wastong “kay Moises.” Gayunman, ang “na sinasabi” ay hindi likas na paraan upang ipakilala ang kasunod na tuwirang pahayag sa Filipino. Ang “at sinabi:” ay malinaw, likas, at pinananatili ang tungkulin ng לֵאמֹר bilang panandang nagpapakilala ng nilalaman ng pananalita.'
  naturalness: Hindi natural at bahagyang bitin ang “At nagsalita si Yahweh kay Moises, na sinasabi,” sa makabagong Filipino. Mas malinaw at marangal ang “At nagsalita si Yahweh kay Moises at sinabi:”. Ang tutuldok ay angkop dahil ipinakikilala nito ang susunod na pahayag.
  terminology: Ang “Yahweh” at “Moises” ay angkop at pare-pareho sa itinakdang pagtrato sa banal na pangalan at sa nakaugaliang pangalang Filipino. Inilipat ang talababa sa “Yahweh,” sapagkat iyon, hindi si Moises, ang tinutukoy ng paliwanag.
