lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang wayyiqtol ng דבר ay nagpapatuloy sa salaysay. Pinananatili ng “At” ang ugnayan sa naunang teksto, at ang “nagsalita” ay angkop sa pormal na pahayag na sinusundan ng לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH bilang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang likas na panandang Filipino para sa taong pinatutungkulan ng pagsasalita; “Moises” ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na pormulang Hebreo na nagpapakilala sa mismong nilalaman ng kasunod na pahayag.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na tahimik na palitan ng isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang bahagyang pormal na hulma ng pambungad sa banal na pahayag at ang pangalang Yahweh.
