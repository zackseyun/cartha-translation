  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יָבִא֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/010.yaml
  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: tl
  text: At sa ikawalong araw, magdadala siya ng dalawang batubato o dalawang inakay na kalapati[a] sa pari, sa pasukan ng Tolda ng Pagtitipon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalawang batang kalapati.” Literal sa Hebreo, “dalawang anak ng kalapati,” isang idyoma para sa mga inakay o batang kalapati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: At sa ikawalong araw
  rationale: Likas na panandang temporal sa Filipino na nagpapanatili sa pagkakasunod ng tagubilin at sa ordinal na “ikawalo.”
- source_word: יָבִא
  choice: magdadala siya
  rationale: Ang Hiphil imperfect sa kontekstong legal ay may puwersang nag-uutos; malinaw itong naipahihiwatig ng anyong panghinaharap sa Filipino nang hindi nagiging labis na legalistiko ang himig.
- source_word: שְׁתֵּי תֹרִים
  choice: dalawang batubato
  rationale: Ang תֹרִים ay tumutukoy sa mga turtledove; “batubato” ang tiyak at kinikilalang katawagang Filipino para sa ibong ito.
- source_word: אוֹ
  choice: o
  rationale: Pinananatili ang tahasang pagpipilian sa pagitan ng dalawang uri ng handog.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: dalawang inakay na kalapati
  rationale: Ang literal na “mga anak ng kalapati” ay idyomang Hebreo para sa mga batang kalapati; “inakay na kalapati” ang malinaw at likas na katumbas sa Filipino.
- source_word: אֶל הַ/כֹּהֵן
  choice: sa pari
  rationale: Direkta at natural na salin ng patutunguhan ng paghahandog.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng Tolda ng Pagtitipon
  rationale: Ang “pasukan” ay natural na katumbas ng פֶּתַח, at ang “Tolda ng Pagtitipon” ay malinaw na nagpapahayag sa אֹהֶל מוֹעֵד bilang takdang lugar ng pakikipagtagpo.
