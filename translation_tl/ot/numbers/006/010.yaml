translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng tagubiling legal, habang ginawang natural ang ayos ng pangungusap. Ginamit ang “Tolda ng Pagtitipon” bilang malinaw at di-sektaryong katawagan.
