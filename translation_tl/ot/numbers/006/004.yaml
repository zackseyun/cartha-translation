  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: tl
  text: Sa buong panahon ng kanyang panata bilang Nazareo, hindi siya kakain ng anumang nagmula sa puno ng ubas, mula sa mga buto hanggang sa balat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa mga buto hanggang sa balat,” isang paraan ng pagsasabing saklaw ang bawat bahagi ng ubas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְרוֹ
  choice: kanyang panata bilang Nazareo
  rationale: Sa konteksto ng Bilang 6, tumutukoy ito sa natatanging panata at kalagayan ng isang Nazareo; malinaw at likas sa Filipino ang pariralang ito.
- source_word: כֹּל יְמֵי
  choice: Sa buong panahon ng
  rationale: Ipinahahayag nito ang kabuuang tagal ng panata sa natural na modernong Filipino.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: anumang nagmula
  rationale: Kasama ng kasunod na pagtanggi, saklaw nito ang lahat ng produktong nagmumula sa puno ng ubas. Mas natural ito kaysa sa literal na ‘anumang ginawa’ nang hindi binabago ang lawak ng pagbabawal.
- source_word: מִגֶּפֶן הַיַּיִן
  choice: mula sa puno ng ubas
  rationale: Ito ang malinaw at karaniwang katumbas sa Filipino ng idyomatikong Hebreong tumutukoy sa grapevine.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: mula sa mga buto hanggang sa balat
  rationale: Pinananatili nito ang Hebreong saklaw na idyoma at ipinahihiwatig na bawal ang bawat bahagi ng ubas.
- source_word: לֹא יֹאכֵל
  choice: hindi siya kakain
  rationale: Ang negatibong imperfect sa tekstong legal ay naghahayag ng tuwirang pagbabawal; likas at mariin ito sa Filipino.
