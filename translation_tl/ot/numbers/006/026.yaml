  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: tl
  text: Itaas nawa ni Yahweh ang kanyang mukha sa iyo at bigyan ka ng kapayapaan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na shalom, na isinaling “kapayapaan,” ay maaari ring tumukoy sa kabuuan, katiwasayan, at mabuting kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: iharap nawa
  rationale: Ang נשׂא ay literal na “itaas” o “iangat,” ngunit kapag mukha ang layon, ipinahihiwatig ng idyoma ang pagbaling ng mapagpalang pansin. Ang “iharap nawa” ay natural sa modernong Tagalog habang pinananatili ang larawan ng mukha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang tetragramang banal na pangalan bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: פָּנָיו
  choice: ang kanyang mukha
  rationale: Pinananatili ang kongkretong metapora ng Hebrew na “mukha,” sa halip na gawin itong abstraktong “paglingap” o “presensya.”
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Likas na ipinapahayag ng “sa iyo” ang direksiyong tinutukoy ng אֶל kasunod ng pandiwang “iharap.”
- source_word: וְיָשֵׂם
  choice: at bigyan
  rationale: Bagaman literal na “ilagay” o “itakda” ang שׂים, ang “bigyan” ang natural na Tagalog para sa idyomang paglalagay ng kapayapaan para sa isang tao.
- source_word: לְךָ
  choice: ka
  rationale: Ang benepisyaryo o di-tuwirang layon ay natural na nakapaloob sa pariralang “bigyan ka.”
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Ang “kapayapaan” ang karaniwan at angkop na salin sa pormula ng pagpapala, habang ipinapaliwanag sa talababa ang mas malawak na diwa ng shalom.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebrew; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Pagpapanatili sa antropomorpikong idyoma tungkol sa mukha
  choice: “Iharap ... ang kanyang mukha”
  alternative: “Lingapin ka” o “tingnan ka nang may paglingap”
  rationale: Pinananatili ng salin ang masining at teolohikal na larawan ng mukha ng Diyos, ngunit ginagamit ang “iharap” upang maipahiwatig nang natural sa Tagalog ang mapagpalang pagbaling ng pansin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nawa” upang maipahayag ang diwa ng pormula ng pagpapala. Iniwasan ang arkaikong “mukha niya’y itaas” dahil maaari itong maging malabo o di-likas sa kasalukuyang gamit.
