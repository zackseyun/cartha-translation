base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: tl
  text: 'At ito ang kautusan para sa Nazareo: sa araw na matapos ang mga araw ng kanyang pagkakahiwalay[a], dadalhin siya[b] sa pasukan ng Toldang Tipanan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga araw ng kanyang pagkakahiwalay” ay maaari ring isaling “mga araw ng kanyang panata bilang Nazareo” o “panahon ng kanyang pagkakatalaga.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas pormal na aktibong anyo: “dadalhin niya siya sa pasukan ng Toldang Tipanan.” Aktibo ang pandiwang Hebreo, ngunit hindi tahasang tinutukoy sa talata ang simuno nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: At ito ang
  rationale: Pinananatili ng “At” ang nag-uugnay na וְ, habang likas na ipinakikilala ng buong parirala ang susunod na tuntuning legal.
- source_word: תּוֹרַת
  choice: kautusan tungkol sa
  rationale: Sa kontekstong pari at legal, ang תּוֹרָה ay tumutukoy sa isang itinakdang tuntunin o kautusan. Ang “tungkol sa” ay mas natural sa Filipino kaysa sa literal na “kautusan ng” at hindi binabago ang kaugnayan nito sa Nazareo.
- source_word: הַנָּזִיר
  choice: Nazareo
  rationale: Pinananatili ang teknikal na tawag sa natatanging institusyon sa Bilang 6 sa halip na palitan ito ng pangkalahatang katawagang gaya ng “taong itinalaga.”
- source_word: בְּיוֹם
  choice: sa araw na
  rationale: Malapit itong sumusunod sa pormal na panandang temporal ng Hebreo at natural pa rin sa makabagong Filipino.
- source_word: מְלֹאת
  choice: matapos
  rationale: Ipinahahayag nito ang pagkapuno o pagkumpleto ng itinakdang panahon sa malinaw at likas na Filipino.
- source_word: יְמֵי נִזְרוֹ
  choice: mga araw ng kanyang pagkakatalaga
  rationale: Ipinahahayag ng “pagkakatalaga” ang kalagayan ng pagiging ibinukod para sa Diyos nang hindi ipinipilit na ang salita ay tumutukoy lamang sa mismong panata. Isinama sa talababa ang mas literal at mas paliwanag na mga alternatibo.
- source_word: יָבִיא אֹתוֹ
  choice: dadalhin siya
  rationale: Aktibo ang pandiwang Hebreo ngunit hindi tahasang tinutukoy ang simuno. Ang balintiyak na Filipino ay nagpapanatili sa pokus sa Nazareo at umiiwas sa pagdaragdag ng di-tiyak na tagapagdala; itinala sa talababa ang pormal na aktibong anyo.
- source_word: אֶל פֶּתַח
  choice: sa pasukan
  rationale: Ang “pasukan” ay natural at malinaw na katumbas ng bungad o bukana ng santuwaryo.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Ito ang malinaw at marangal na tawag sa santuwaryong tolda kung saan nakikipagtagpo ang Diyos sa Israel; ang paglalagay ng malaking titik ay nagpapakitang natatanging pangalan ang parirala.
theological_decisions:
- issue: Kahulugan ng נֵזֶר/נָזִיר sa Bilang 6
  choice: Panatilihin ang teknikal na “Nazareo” at isalin ang kalagayan bilang “pagkakatalaga.”
  alternative: “Taong ibinukod” at “pagkakahiwalay,” o “panata bilang Nazareo” sa parehong lugar.
  rationale: Ang “Nazareo” ay nagpapanatili sa natatanging institusyon ng Israel. Saklaw ng “pagkakatalaga” ang banal na pagbubukod na ipinahihiwatig ng termino, samantalang inilalahad sa talababa ang leksikal na lawak nito nang hindi nagpapasok ng natatanging doktrina.
- issue: Tinig at di-tiyak na simuno ng יָבִיא אֹתוֹ
  choice: Gamitin ang balintiyak na “dadalhin siya.”
  alternative: 'Mas pormal na aktibo: “dadalhin niya siya.”'
  rationale: Bagaman aktibo ang anyong Hebreo, walang malinaw na tinutukoy na simuno sa talata. Pinananatili ng balintiyak ang tunay na kawalang-tiyak at ang pokus ng ritwal nang hindi kinikilala kung sino ang tagapagdala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang pormal na anyo ng kautusan at ang teknikal na katawagang “Nazareo,” ngunit iniwasan ang salitang masyadong arkaiko. Ginamit ang “kanyang” ayon sa karaniwang modernong baybay. Ang mga talababa ay nagpapanatili sa leksikal at gramatikal na kalabuan ng Hebreo.
