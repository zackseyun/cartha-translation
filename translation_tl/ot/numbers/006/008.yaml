  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: tl
  text: Sa lahat ng araw ng kanyang pagkakabukod[a], siya ay banal para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanyang panata bilang Nazareo” o “kanyang pagiging Nazareo.” Ang salitang Hebreo ay tumutukoy sa kalagayan ng isang taong ibinukod bilang Nazareo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: Sa lahat ng araw ng
  rationale: Tuwirang ipinapahayag ang buong panahong saklaw ng kalagayan ng Nazareo at natural ito sa makabagong Tagalog.
- source_word: נִזְרוֹ
  choice: kanyang pagkakatalaga
  rationale: Tumutukoy rito sa kalagayan o panahon ng pagiging bukod bilang Nazareo, hindi lamang sa mismong panata. Pinananatili rin nito ang kaibhan sa kasunod na salitang 'banal.'
- source_word: קָדֹשׁ הוּא
  choice: banal siya
  rationale: Pinananatili ng 'banal' ang teolohikal na bigat ng קָדֹשׁ, samantalang likas sa Tagalog ang ayos na panaguri muna.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng ל ang kaugnayan o pag-aalay sa Diyos; natural sa Tagalog ang 'kay' para sa personal na banal na pangalan.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Banal na pangalang יהוה ang tahasang nasa tekstong Hebreo; pinananatili itong pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng נִזְרוֹ sa batas tungkol sa Nazareo
  choice: kanyang pagkakatalaga
  alternative: kanyang panata bilang Nazareo; kanyang pagiging bukod
  rationale: Binibigyang-diin ng talata ang buong panahon ng natatanging kalagayan niya. Hindi nito tahasang nililimitahan ang salita sa panata lamang, kaya inilalagay sa talababa ang mas tiyak na mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkakatalaga” upang maipahayag ang kalagayang nakalaan sa Diyos nang hindi inuulit agad ang “banal” o ipinapalagay na ang mismong pormula ng panata lamang ang tinutukoy.
