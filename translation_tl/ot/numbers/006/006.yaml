  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: tl
  text: Sa buong panahon ng pagkakabukod niya para sa PANGINOON[a], hindi siya lalapit sa bangkay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagiging Nazareo niya” o “panata niya bilang Nazareo.” Ang salitang Hebreo ay tumutukoy sa kalagayan o panahon ng pagkakabukod na kaugnay ng Nazareo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “isang patay na nefesh”; ibig sabihin, bangkay ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: sa buong panahon
  rationale: Ipinahahayag nito ang kabuuan ng mga araw ng pagkakabukod sa natural na modernong Tagalog.
- source_word: הַזִּירוֹ
  choice: pagkakatalaga niya
  rationale: Tumutukoy ang salita sa kalagayan o panahon ng pagiging bukod bilang Nazareo. Pinananatili ng “pagkakatalaga” ang diwa ng paglalaan nang hindi tahasang idinaragdag sa pangunahing teksto ang salitang “panata.”
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ipinahahayag ng pang-ukol ang paglalaan sa YHWH; ang “PANGINOON” ang magalang at nakaugaliang salin ng banal na pangalan.
- source_word: עַל
  choice: lalapit sa
  rationale: Kasama ng pandiwang בוא at ng pariralang tumutukoy sa patay, ipinahahayag nito ang paglapit sa bangkay.
- source_word: נֶפֶשׁ מֵת
  choice: bangkay ng tao
  rationale: Bagaman literal na “patay na nefesh,” ang idyoma sa batas ng ritwal na kalinisan ay tumutukoy sa bangkay ng tao.
- source_word: לֹא יָבֹא
  choice: hindi siya lalapit
  rationale: Ang negatibong imperfect sa legal na konteksto ay naghahayag ng pagbabawal; malinaw at natural ito sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa terminolohiyang Nazareo nang hindi labis na tinutukoy ang kahulugan ng pangngalan
  choice: pagkakatalaga niya
  alternative: pagkakabukod niya bilang Nazareo; panata niya bilang Nazareo
  rationale: Ang Hebreong pangngalan ay kaugnay ng pagiging Nazareo ngunit pangunahing tumutukoy sa kalagayan o panahon ng pagkakabukod. Iniiwasan ng salin ang pagdaragdag ng “panata” sa pangunahing teksto.
- issue: Pagsasalin sa יהוה
  choice: PANGINOON
  alternative: Yahweh; Jehova
  rationale: Ginagamit ang tradisyonal at magalang na katumbas sa Tagalog habang malinaw na ipinakikita sa anyong malalaking titik na banal na pangalang YHWH ang nasa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang “sa buong panahon” sa halip na ang mas literal ngunit di-likas na “sa lahat ng araw,” at “bangkay ng tao” upang linawin na tao, hindi hayop, ang tinutukoy.
