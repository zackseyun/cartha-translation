- from: 'Ito ang tuntunin para sa Nazareo na nanata: ang handog niya kay Yahweh para sa kanyang pagiging Nazareo, bukod pa sa anumang kaya niyang ibigay.[a] Gagawin niya ang ayon sa kanyang panata, alinsunod sa tuntunin ng kanyang pagiging Nazareo.'
  to: Ito ang tuntunin para sa Nazareong nanata na maghandog kay Yahweh para sa kanyang pagtatalaga bilang Nazareo, bukod pa sa anumang kaya niyang tustusan.[a] Ayon sa panatang kanyang ginawa, gayon ang gagawin niya, alinsunod sa tuntunin ng kanyang pagtatalaga bilang Nazareo.
