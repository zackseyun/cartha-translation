  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: tl
  text: Ito ang tuntunin para sa Nazareong nanata na maghandog kay Yahweh para sa kanyang pagtatalaga bilang Nazareo, bukod pa sa anumang kaya niyang tustusan.[a] Ayon sa panatang kanyang ginawa, gayon ang gagawin niya, alinsunod sa tuntunin ng kanyang pagtatalaga bilang Nazareo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bukod pa sa anumang maaabot ng kanyang kamay.” Maaari ring isalin, “bukod pa sa anumang kaya niyang tustusan.”
    reason: Pinananatili sa talababa ang konkretong Hebreong idyoma at ang posibleng diin nito sa kakayahang pinansyal.
lexical_decisions:
- source_word: תּוֹרַת הַנָּזִיר
  choice: tuntunin para sa Nazareo
  rationale: Sa legal na kontekstong ito, ang תּוֹרָה ay isang itinakdang tuntunin o regulasyon. Ang “Nazareo” ang nakaugaliang katawagang Filipino para sa taong nasa ilalim ng natatanging panata sa kabanatang ito.
- source_word: אֲשֶׁר יִדֹּר
  choice: na nanata
  rationale: Tumutukoy ang pariralang ito sa Nazareong gumawa ng panata; natural sa Filipino ang “nanata” at pinananatili nito ang pandiwang diwa.
- source_word: קָרְבָּנוֹ לַיהוָה
  choice: ang handog niya kay Yahweh
  rationale: Ang קָרְבָּן ay pangkalahatang handog na inihaharap sa Diyos, at ang ל ay angkop na isinaling “kay.” Pinananatili ang pangalang tipan na Yahweh.
- source_word: עַל נִזְרוֹ
  choice: para sa kanyang pagiging Nazareo
  rationale: Ang נֵזֶר dito ay tumutukoy sa kalagayan ng paghihiwalay o pagtatalaga bilang Nazareo. Naiiwasan ng “pagiging Nazareo” ang pag-uulit ng “panata” kung saan maaaring lumabo ang pagkakaiba ng נֵזֶר at נֶדֶר.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: bukod pa sa anumang kaya niyang ibigay
  rationale: Ang literal na idyomang “maaabot ng kanyang kamay” ay tumutukoy sa kakayahan o yaman ng tao. Ang “kaya niyang ibigay” ay malinaw at akma sa konteksto ng paghahandog.
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר כֵּן יַעֲשֶׂה
  choice: Gagawin niya ang ayon sa kanyang panata
  rationale: Pinananatili nito ang legal na obligasyong umayon ang gawa sa ipinangako, ngunit natural ang ayos sa modernong Filipino.
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: alinsunod sa tuntunin ng kanyang pagiging Nazareo
  rationale: Ikinakabit ng pangwakas na parirala ang pagtupad sa namamahalang tuntunin ng kalagayang Nazareo; ang “alinsunod” ay may angkop na pormal at legal na himig.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng נֵזֶר at נֶדֶר
  choice: “pagiging Nazareo” para sa נֵזֶר at “panata” para sa נֶדֶר
  alternative: Isaling “panatang Nazareo” ang dalawang kaugnay na parirala
  rationale: 'Magkaugnay ngunit hindi ganap na magkapareho ang mga salita: ang נֶדֶר ay ang panata, samantalang ang נֵזֶר ay ang paghihiwalay o pagtatalagang bunga nito. Pinananatili ng salin ang pagkakaibang ito nang hindi nagpapasok ng dagdag na doktrina.'
translation_notes:
  register: Modernong Filipino na marangal at malinaw, na may bahagyang pormal na himig na angkop sa batas. Ginamit ang “tuntunin” sa halip na mas malawak na “kautusan,” at “Nazareo” bilang kinikilalang teknikal na katawagan.
