    rationale: Ang כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר ay literal na “ayon sa kanyang panata na kanyang ipapanata/ginawa.” Hindi kailangang maging sobrang literal, ngunit dapat malinaw na ang gagawin ay tumutugon sa panatang ginawa niya.
