  to: '“Magsalita ka sa mga anak ni Israel at sabihin mo sa kanila: ‘Kapag ang isang lalaki o babae ay gumawa ng natatanging panata[a]—isang panatang Nazireo—upang ibukod ang sarili para kay Yahweh[b],’”'
  rationale: Ibinalik ang dalawang pandiwa ng pambungad na utos at inayos ang panipi. Ginawang "isang panatang Nazireo" ang teknikal na parirala upang maging malinaw na uri ito ng panata, hindi simpleng panatang pagmamay-ari ng isang Nazireo. Pinili ang "ibukod ang sarili para kay Yahweh" upang mapanatili ang konsepto ng paghihiwalay o natatanging pagtatalaga nang hindi ipinapasok ang interpretasyong lampas sa teksto.
