  source_fidelity: Kailangang maibalik ang dalawang magkaugnay na pandiwa sa pambungad ("magsalita" at "sabihin"); iisa lamang ang naipahayag ng draft. Ang natitirang diwa—ang tahasang pagsaklaw sa lalaki o babae, ang natatanging panata, ang teknikal na panatang Nazireo, at ang pagtatalaga/pagbubukod para kay Yahweh—ay tapat sa Hebreo.
  naturalness: Natural ang "isang lalaki o babae" at "ang sarili." Mas malinaw at mas natural sa modernong Filipino ang "panatang Nazireo" kaysa "ang panata ng isang Nazireo," na maaaring magmukhang panatang pagmamay-ari ng isang taong Nazireo sa halip na ang teknikal na uri ng panata.
  terminology: Ang "Yahweh" ay wastong katumbas ng יהוה ayon sa ibinigay na patakaran. Pinanatili ang "Nazireo" bilang teknikal na katawagan at ipinaliwanag ito sa talababa. Ang "ibukod ang sarili para kay Yahweh" ay mas tuwirang naghahatid ng diwa ng לְהַזִּיר kaysa sa pangkalahatang "italaga ang sarili."
