language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: tl
  text: '“Magsalita ka sa mga anak ni Israel at sabihin mo sa kanila: ‘Kapag ang isang lalaki o babae ay gumawa ng natatanging panata[a]—isang panatang Nazireo—upang ibukod ang sarili para kay Yahweh[b],’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapag ang isang lalaki o babae ay ibukod ang sarili sa pamamagitan ng panatang Nazireo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Nazireo” ay isang taong natatanging ibinukod para kay Yahweh sa ilalim ng isang panata.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilyang idyoma ng Hebreo habang natural at pamilyar pa rin sa marangal na Tagalog.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: isang lalaki o babae
  rationale: Tahasang binabanggit ng Hebreo ang dalawang kasarian; pinanatili ito sa halip na gawing pangkalahatang “sinuman.”
- source_word: כִּי
  choice: kapag
  rationale: Ang כִּי ay nagpapakilala rito ng isang kasong saklaw ng kautusan. Natural ang “kapag,” bagaman maaari rin ang “kung.”
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: gumawa ng natatanging panata
  rationale: Ipinahahayag ng Hiphil יַפְלִא ang paggawa ng isang di-pangkaraniwan o natatanging gawain; kasama ng magkaugat na pandiwa at pangngalang tumutukoy sa panata, malinaw at natural itong naihahatid bilang “gumawa ng natatanging panata.”
- source_word: נֶדֶר נָזִיר
  choice: ang panata ng isang Nazireo
  rationale: Pinananatili ang ugnayang konstrak ng parirala at ang teknikal na katawagan para sa taong bukod na itinalaga sa ilalim ng panatang ito.
- source_word: נָזִיר
  choice: Nazireo
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng teknikal na katawagang biblikal, sa halip na tunawin ito sa pangkalahatang “itinalaga.”
- source_word: לְהַזִּיר
  choice: upang italaga ang sarili
  rationale: Ipinahahayag ang layunin ng pagbubukod o pagtatalaga nang hindi gumagamit ng panghalip na panlalaki lamang, yamang kapuwa lalaki at babae ang tahasang saklaw.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה bilang “Yahweh,” ayon sa ibinigay na patakarang doktrinal.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo; pinanatili itong “Yahweh” ayon sa itinakdang patakaran at hindi pinalitan ng titulo.
- issue: Paglalarawan sa saklaw ng kasarian
  choice: Panatilihin ang “isang lalaki o babae” at gamitin ang “ang sarili”
  alternative: “sinuman … ang kaniyang sarili”; gumamit ng panghalip na panlalaki lamang
  rationale: Tahasang kasama sa Hebreo ang lalaki at babae. Ang “ang sarili” ay natural sa Tagalog at hindi lumilikha ng di-kailangang panlalaking limitasyon sa huling parirala.
- issue: Kahulugan ng panatang Nazireo
  choice: Panatilihin bilang isang natatanging teknikal na panata ng pagtatalaga kay Yahweh
  alternative: Isalin lamang bilang pangkalahatang panata ng paghihiwalay
  rationale: Ang נָזִיר ay tumutukoy sa partikular na institusyong inilalarawan sa Bilang 6; kailangang manatili ang teknikal na katawagan at ang diwa ng pagbubukod o pagtatalaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na pambungad na utos at ang legal na anyo ng talata, ngunit iniwasan ang sobrang literal at alanganing parirala. Ginamit ang “Nazireo” bilang pamilyar na teknikal na katawagang Tagalog.
