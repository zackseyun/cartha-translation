  naturalness: Marangal at natural ang pangunahing teksto sa modernong Filipino Tagalog. Gayunman, ang pariralang 'matapos matapos ang kanyang panata' sa talababa ay paulit-ulit at hindi makinis; maaari itong gawing mas natural nang hindi binabago ang diwa.
  terminology: Ang 'Yahweh,' 'pari,' 'Nazareo,' 'handog na iwinawagayway,' at 'handog na kontribusyon' ay pare-pareho at angkop. Ang 'banal na bahagi para sa pari' ay katanggap-tanggap, ngunit ang 'banal na nakalaan para sa pari' ay mas tuwirang nagpapahayag ng pagiging banal at paglalaan sa pari nang hindi nagdaragdag ng teknikal na kahulugang hindi tahasang nasa Hebreo.
