base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: tl
  text: Iwawagayway ng pari ang mga iyon bilang handog na iwinawagayway sa harap ni Yahweh. Ang mga iyon ay banal na nakalaan para sa pari, bukod pa sa dibdib ng handog na iwinawagayway at sa hita ng handog na kontribusyon. Pagkatapos nito, maaari nang uminom ng alak ang Nazareo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pagkatapos nito, iinom ng alak ang Nazareo.” Maaaring isalin nang ganito nang mas literal ang anyong Hebreo, ngunit sa konteksto ay ipinahihiwatig nito na maaari na siyang muling uminom matapos niyang tuparin ang kanyang panata.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: Iwawagayway ... bilang handog na iwinawagayway
  rationale: Ipinananatili ang magkaugnay na pandiwa at pangngalan sa Hebreo at malinaw na inilalarawan ang ritwal na paghahandog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalan ng Diyos at ang karaniwang pormulang panritwal.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: Ang mga iyon ay banal na bahagi para sa pari
  rationale: Nililinaw sa natural na Tagalog na ang naiwagayway na mga bagay ang nakatalagang banal na bahagi ng pari, bagaman pang-isahan ang kolektibong pagtukoy sa Hebreo.
- source_word: עַל
  choice: bukod pa sa
  rationale: Sa pormulang ito ng pamamahagi, nagpapahiwatig ito ng karagdagan sa mga bahaging dati nang nakalaan sa pari.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: dibdib ng handog na iwinawagayway
  rationale: Pinananatili ang teknikal na katawagan sa bahaging panritwal sa paraang mauunawaan sa modernong Tagalog.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: hita ng handog na kontribusyon
  rationale: Ang שׁוֹק ay hita o itaas na bahagi ng binti, at ang תְּרוּמָה ay bahaging ibinukod at inihandog bilang kontribusyon.
- source_word: יִשְׁתֶּה הַנָּזִיר יָיִן
  choice: maaari nang uminom ng alak ang Nazareo
  rationale: Ipinahahayag ang muling pagpapahintulot matapos matapos ang ritwal, sa halip na utos na kailangan siyang uminom.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang inilalahad ng tekstong Hebreo ang Tetragrammaton; pinananatili rito ang personal na pangalang Yahweh.
- issue: Lakas ng יִשְׁתֶּה sa huling sugnay
  choice: maaari nang uminom
  alternative: iinom
  rationale: Ipinakikita ng konteksto na inaalis na ang dating pagbabawal ng panata. Gayunman, maaari ring unawain nang mas literal ang anyo bilang pahayag sa hinaharap, kaya itinala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “iwawagayway” upang mapanatili ang kongkretong ritwal na kilos, “handog na kontribusyon” para sa malinaw ngunit pormal na paglalarawan ng תְּרוּמָה, at “Nazareo” bilang nakaugaliang katawagang biblikal sa Tagalog.
