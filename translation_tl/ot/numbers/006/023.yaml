  source_fidelity: 'Tumpak ang mga pangunahing katumbas: ang utos ay para kay Moises, ang kausap ay si Aaron at ang kanyang mga anak na lalaki, at ang kasunod ay tagubilin sa maramihang mga saserdote. Gayunman, ang panandang-pangungusap sa loob ng sipi ay kailangang ayusin upang malinaw na ang “Sabihin ninyo sa kanila” ang pambungad sa mga salita ng pagpapala sa susunod na talata.'
  naturalness: Natural ang “Sabihin mo kay Aaron” at “mga anak na lalaki.” Mas malinaw at mas maayos sa modernong Filipino ang tuldok pagkatapos ng unang tagubilin at kuwit pagkatapos ng pambungad na utos na nagpapatuloy sa susunod na talata. Ang tutuldok bago ang buong tuwirang sipi ay mas angkop kaysa “na” sa ganitong pormal na utos.
  terminology: Ang “mga anak na lalaki” ay wastong paglilinaw sa בָּנָיו sa kontekstong saserdotal. Ang “mga anak ni Israel” ay literal na katumbas ng בְּנֵי יִשְׂרָאֵל at maaaring panatilihin, kasama ng talababa para sa idiomatikong kahulugan.
  issues:
  - severity: low
    issue: Hindi angkop ang pagkakalagay ng talababa at bantas sa “Israel:[a] sabihin ninyo.”
    rationale: Dapat nakakabit ang pananda sa terminong “mga anak ni Israel,” bago ang bantas. Ang kasunod na “Sabihin ninyo sa kanila” ay hiwalay na utos na naghahanda sa mismong pagpapala sa susunod na talata.
  - severity: low
    issue: Ang “na” pagkatapos ng “mga anak na lalaki” ay hindi kasinglinaw ng tutuldok bago ang tuwirang sipi.
    rationale: Ang Hebreong לֵאמֹר ay nagpapakilala ng direktang pananalita; ang tutuldok ay mas natural at pormal na Filipino sa ganitong estruktura.
  revised_text: 'Sabihin mo kay Aaron at sa kanyang mga anak na lalaki: ‘Ganito ninyo pagpapalain ang mga anak ni Israel[a]. Sabihin ninyo sa kanila,’'
