  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר כֹּ֥ה תְבָרֲכ֖וּ אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אָמ֖וֹר לָ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: tl
  text: 'Sabihin mo kay Aaron at sa kanyang mga anak na lalaki: ‘Ganito ninyo pagpapalain ang mga anak ni Israel[a]. Sabihin ninyo sa kanila,’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas idiomatikong pananalita, “ang mga Israelita” o “ang bayang Israel.” Sa Hebreo, “ang mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sabihin mo
  rationale: Ang Piel imperative na 2ms ay tuwirang utos kay Moises; natural sa modernong Filipino ang “Sabihin mo” kapag may kasunod na pinagsasabihan.
- source_word: וְאֶל בָּנָיו
  choice: at sa kanyang mga anak na lalaki
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking anak ni Aaron na kabilang sa pagkasaserdote; nililinaw ng “anak na lalaki” ang kasarian ng Hebreong בנים.
- source_word: לֵאמֹר
  choice: na
  rationale: Ang quotative infinitive ay natural na naipapahayag sa Filipino sa pamamagitan ng “na” bago ang tuwirang sinabi, sa halip na piliting ulitin ang “sinasabi.”
- source_word: כֹּה
  choice: Ganito
  rationale: Ipinakikilala nito ang itinakdang paraan o pormula ng pagpapala; ang “Ganito” ay natural at may sapat na pormalidad.
- source_word: תְבָרֲכוּ
  choice: ninyo pagpapalain
  rationale: Ang Piel imperfect na 2mp ay may puwersang tagubilin dito. Pinananatili ng ayos na ito ang direktiba nang hindi dinaragdagan ng mas matinding obligasyon.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang literal na anyong pampamilya at pangtipan ng Hebreo, bagaman ang parirala ay maaari ring idiomatikong tumukoy sa buong bayang Israel.
- source_word: אָמֹר לָהֶם
  choice: sabihin ninyo sa kanila
  rationale: Imperatibong panlalaking maramihan ito na nagpapakilala sa mismong mga salita ng pagpapala sa susunod na talata.
theological_decisions:
- issue: Ang panlipi at pangtipang pananalitang בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita / ang bayang Israel
  rationale: Inilalantad ng piniling salin ang anyong pampamilya ng Hebreo at hindi agad pinapawi ang pangtipang himig nito; nilalahad sa talababa ang mas idiomatikong pambansang kahulugan.
- issue: Pormula ng tagubilin sa mga saserdote
  choice: Ganito ninyo pagpapalain
  alternative: Sa ganitong paraan ninyo pagpapalain
  rationale: Ang “Ganito” ay maikli, pormal, at nagpapakilala sa itinakdang pormula nang hindi nagpapalawak lampas sa teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “anak na lalaki” para sa mga anak ni Aaron dahil mahalaga rito ang kontekstong saserdotal, samantalang pinanatili ang “mga anak ni Israel” bilang tradisyonal at pangtipang katawagan, na may paliwanag sa talababa.
