  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/זְּרֹ֣עַ בְּשֵׁלָה֮ מִן הָ/אַיִל֒ וְֽ/חַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן הַ/סַּ֔ל וּ/רְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְ/נָתַן֙ עַל כַּפֵּ֣י הַ/נָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥/וֹ אֶת נִזְרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: tl
  text: Pagkatapos, kukunin ng pari ang nilagang balikat mula sa lalaking tupa, isang tinapay na walang pampaalsa mula sa basket, at isang manipis na tinapay na walang pampaalsa. Ilalagay niya ang mga ito sa mga palad ng Nazareo matapos niyang ahitin ang buhok na tanda ng kanyang pagkatalaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “matapos niyang ahitin ang kanyang pagkatalaga.” Sa konteksto, tumutukoy ito sa buhok na tanda ng pagkatalaga ng Nazareo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Pagkatapos, kukunin
  rationale: Sa sunod-sunod na tagubiling panritwal, natural na ipinahahayag sa Filipino ang waw + qatal bilang kasunod na kilos gamit ang “Pagkatapos” at aspektong kontemplatibo.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang tawag sa opisyal na tagapangasiwa ng ritwal; pinanatili ang katiyakan ng pangngalan.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: ang nilagang balikat
  rationale: Ang זְרוֹעַ ay bahaging balikat/harap na paa ng handog, at ang בְּשֵׁלָה ay nagsasaad na ito ay nilaga o pinakuluan.
- source_word: מִן הָאַיִל
  choice: mula sa lalaking tupa
  rationale: Tuwirang ipinapahayag ang pinagmulan ng bahaging kinuha at malinaw na isinasalin ang אַיִל bilang lalaking tupa.
- source_word: חַלַּת מַצָּה אַחַת
  choice: isang tinapay na walang pampaalsa
  rationale: Natural at malinaw sa modernong Filipino; ipinapakita ang isang buong tinapay at ang kawalan ng pampaalsa.
- source_word: מִן הַסַּל
  choice: mula sa basket
  rationale: Tuwirang katumbas na nagsasaad kung saan kinuha ang tinapay.
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: at isang manipis na tinapay na walang pampaalsa
  rationale: Ang רְקִיק ay manipis na uri ng tinapay; mas madaling maunawaan ang paglalarawan kaysa sa hiram na katawagang “wafér.”
- source_word: וְנָתַן
  choice: Ilalagay niya
  rationale: Ginawang hiwalay na pangungusap para sa likas at malinaw na daloy sa Filipino habang pinananatili ang kasunod na hakbang ng ritwal.
- source_word: עַל כַּפֵּי
  choice: sa mga palad
  rationale: Pinananatili ang tiyak na larawan ng כַּף bilang palad, hindi lamang pangkalahatang “kamay.”
- source_word: הַנָּזִיר
  choice: ng Nazareo
  rationale: Ginamit ang nakaugaliang terminong Filipino para sa taong nasa ilalim ng panata ng pagka-Nazareo.
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: matapos nitong ahitin
  rationale: Isinasalin bilang sugnay na temporal at ipinakikitang natapos muna ang pag-ahit bago ang paglalagay sa mga palad.
theological_decisions:
- issue: Kahulugan ng נִזְרוֹ sa ritwal ng Nazareo
  choice: ang buhok na tanda ng kanyang pagkatalaga
  alternative: ang kanyang pagkatalaga
  rationale: Sa konteksto, ang inaahit ay ang buhok na pisikal na tanda ng pagkatalaga ng Nazareo. Nililinaw ito sa pangunahing teksto nang hindi ipinapantay nang lubusan ang נֵזֶר sa buhok; itinatala sa talababa ang mas literal at sadyang maigsi ngunit malabong anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong panritwal. Ginamit ang “Nazareo” bilang pamilyar na katawagang biblikal, habang iniwasan ang labis na teknikal o makalumang pananalita.
