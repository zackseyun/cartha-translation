  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: tl
  text: At ihaharap ng pari ang mga ito sa harap ni Yahweh[a], at ihahandog niya ang handog ng Nazireo para sa kasalanan[b] at ang handog nitong sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ilalapit ang mga ito sa harap ni Yahweh.” Maaaring bigyang-diin ng pandiwang Hebreo ang paghaharap sa Diyos bago ang mismong paghahandog.
    reason: lexical_alternative
  - marker: b
    text: Ang “handog para sa kasalanan” ay maaari ring unawain bilang “handog para sa paglilinis” sa terminolohiyang pansakripisyo ng mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ihaharap
  rationale: Ang Hiphil ng קרב ay nangangahulugang ilapit o iharap. Dito, iniiba nito ang paghaharap sa presensya ni Yahweh mula sa kasunod na aktuwal na paghahandog.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at likas na salin ng כֹּהֵן sa konteksto ng pagsamba at paghahandog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ipinahahayag ng לִפְנֵי ang presensya o kinalalagyan sa harap ng Diyos; pinananatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: וְעָשָׂה
  choice: at ihahandog
  rationale: Bagaman literal na 'gagawin,' sa idyomang pansakripisyo ang עשה ay tumutukoy sa pagsasagawa o paghahandog ng sakripisyo.
- source_word: אֶת חַטָּאתוֹ
  choice: ang handog niya para sa kasalanan
  rationale: Sa batas tungkol sa mga handog, ang חַטָּאת ay tumutukoy sa sakripisyong kaugnay ng kasalanan; malinaw at natural sa Filipino ang pariralang ito habang kinikilala sa talababa ang alternatibong pag-unawa.
- source_word: וְאֶת עֹלָתוֹ
  choice: at ang kanyang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog sa altar; ang maikling salin ay angkop sa modernong Filipino.
- source_word: implicit object of וְהִקְרִיב
  choice: sila
  rationale: Walang tahasang layon ang pandiwa sa Hebreo, ngunit ipinagkakaloob ito ng naunang talata. Ang 'sila' ay nagpapanatili sa pagdepende ng teksto sa konteksto nang hindi nagdaragdag ng detalye.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng חַטָּאת sa wikang pansakripisyo
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tumukoy ang salita sa handog na may kaugnayan sa kasalanan o paglilinis. Ginamit sa pangunahing teksto ang mas nakagawiang tawag, ngunit pinanatili sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang 'pari' at mga malinaw na pariralang 'handog para sa kasalanan' at 'handog na sinusunog.' Ang mga panghalip na 'niya/kanyang' ay tumutukoy sa taong naghahandog ayon sa konteksto, at ang 'sila' ay kumakatawan sa di-tahasang layon mula sa naunang talata.
