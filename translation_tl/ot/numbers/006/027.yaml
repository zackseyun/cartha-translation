base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: tl
  text: Kaya ilalagay nila ang pangalan ko sa mga anak ni Israel[b][a], at ako mismo ang magpapala sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita” o “bayan ng Israel.” Sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang “ilagay ang pangalan ko sa” ay malamang na tumutukoy sa pagtawag sa pangalan ng PANGINOON sa kanila at sa pagkilala sa kanila bilang bayang kabilang sa kanya sa tipan.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: Kaya ilalagay nila
  rationale: Ang שׂוּם ay nangangahulugang “ilagay” o “itakda.” Ipinahihiwatig ng “Kaya” ang bunga ng naunang tagubilin tungkol sa basbas, samantalang pinananatili ng “ilalagay” ang hinaharap na diwa ng pandiwa.
- source_word: אֶת שְׁמִי
  choice: ang pangalan ko
  rationale: Pinananatili ang literal na “pangalan” dahil mahalaga ang sagisag nitong tipan at pagkatawan; ang pagpapakahulugang “awtoridad” o “basbas” ay magiging mas makitid kaysa sa Hebreo.
- source_word: עַל
  choice: sa
  rationale: Sa modernong Tagalog, natural na ipinapahayag ng “ilagay ... sa” ang kongkretong larawan ng paglalagay ng pangalan sa bayan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tuwirang sinasalamin nito ang Hebreong “mga anak ni Israel” at ang katawagang ginagamit para sa sambayanang nagmula kay Israel; maaaring ipakahulugan nang mas idiomatiko bilang “mga Israelita” o “bayan ng Israel.”
- source_word: וַאֲנִי
  choice: at ako mismo
  rationale: Ang tahasang malayang panghalip na אֲנִי ay may diin; malinaw itong naipapahayag ng “ako mismo.”
- source_word: אֲבָרֲכֵם
  choice: ang magpapala sa kanila
  rationale: Ang pandiwang ברך ay “pagpalain.” Sa hulma na “ako mismo ang magpapala,” natural na naihahatid ang pangako at ang diin sa Diyos bilang gumagawa.
theological_decisions:
- issue: Kahulugan ng paglalagay ng pangalan ng Diyos sa Israel
  choice: Panatilihin ang kongkretong pahayag na “ilalagay ... ang pangalan ko sa” nang walang pagpapalawak sa pangunahing teksto.
  alternative: “tatawag sa pangalan ko para sa kanila” o “tatatakan silang pag-aari ko”
  rationale: Maaaring saklawin ng idyoma ang pagtawag sa pangalan ng PANGINOON sa bayan, pagkakakilanlan sa tipan, at pagiging kanya nila. Pinananatili ng literal na larawan ang lawak ng kahulugan at hindi ito ikinukulong sa iisang paliwanag.
- issue: Paglilipat ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: “mga Israelita” o “bayan ng Israel”
  rationale: Ang Hebreo ay literal na “mga anak ni Israel” bilang katawagang panlahatan sa sambayanan. Pinananatili ito sa teksto habang nililinaw sa talababa ang mga natural na katumbas nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang kongkretong idyoma at ang diin ng “ako mismo.” Ang ayos ng mga panandang [b][a] ay tumutugma sa pagkakasunod sa ibinigay na tekstong konsultasyon; kapwa marker ay nasa pangunahing teksto.
