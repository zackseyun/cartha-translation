  source_fidelity: 'Tumpak na naihahatid ang Hebreong pagkakasunod at diin: ang mga saserdote ang ipinahihiwatig na gagawa ng pagkilos, ilalagay ang pangalan ng Diyos sa mga anak ni Israel, at ang Diyos mismo ang magpapala sa kanila. Napananatili ang kongkretong idyomang “ilalagay ... ang pangalan ko sa” nang walang di-makatwirang pagpapakahulugan sa pangunahing teksto.'
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Kaya,” “ako mismo,” at “magpapala sa kanila” ay malinaw at angkop sa rehistrong biblikal. Ang “mga anak ni Israel” ay bahagyang literal ngunit nauunawaan at sinasadyang pinanatili, na may idiomatikong mga alternatibo sa talababa.
  terminology: Wasto ang “pangalan,” “mga anak ni Israel,” at “magpapala.” Maingat din ang talababa sa pagpapaliwanag ng idyoma bilang malamang na kahulugan, hindi bilang kapalit na salin. Ang paggamit ng “PANGINOON” sa paliwanag ay katanggap-tanggap bilang pagtukoy sa banal na pangalan sa konteksto, samantalang hindi ito idinagdag sa pangunahing teksto.
