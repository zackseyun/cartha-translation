translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pampaalsa” bilang malinaw na karaniwang katawagan; iniwasan ang sobrang teknikal na “ostiya” o “wafer.” Ang “para sa mga iyon” ay nagpapanatili sa pangmaramihang reperensiya ng mga hulaping Hebreo nang hindi sapilitang tinutukoy kung aling mga naunang handog ang saklaw.
