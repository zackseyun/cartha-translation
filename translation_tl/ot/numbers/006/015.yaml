  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: tl
  text: 'at isang basket ng tinapay na walang pampaalsa: mga tinapay na gawa sa pinong harina at hinaluan ng langis,[a] at maninipis na tinapay na walang pampaalsa na nilagyan ng langis,[b] kasama ang kani-kanilang handog na butil at handog na inumin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga tinapay na walang pampaalsa.” Malawak ang kahulugan ng salitang Hebreo para sa mga produktong walang pampaalsa; pagkatapos ay tinutukoy ng talata ang mga tinapay at maninipis na tinapay bilang mga anyo nito.
    reason: lexical_alternative
  - marker: b
    text: O, “pinahiran ng langis.” Ang pandiwang Hebreo ay ang karaniwang salita para sa pagpapahid ng langis, ngunit dito ay inilalarawan nito ang paghahanda ng maninipis na tinapay.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: basket
  rationale: Karaniwang salitang Tagalog para sa lalagyang tinutukoy sa ritwal.
- source_word: מַצּוֹת
  choice: tinapay na walang pampaalsa
  rationale: Malawak ang Hebreong termino at sumasaklaw sa mga produktong tinapay na walang pampaalsa; ang kasunod ay tumutukoy sa mga tiyak na anyo nito.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Tumpak at likas na katumbas ng terminong panghandog para sa harinang pino ang pagkakagiling.
- source_word: חַלֹּת
  choice: mga tinapay
  rationale: Tumutukoy sa mga hinubog na piraso ng tinapay sa konteksto ng handog; mas malinaw sa karaniwang mambabasa kaysa sa salitang maaaring ipakahulugang panghimagas.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: hinaluan ng langis
  rationale: Malinaw na ipinahihiwatig ang paghahalo ng langis sa mga sangkap ng tinapay.
- source_word: רְקִיקֵי מַצּוֹת
  choice: maninipis na tinapay na walang pampaalsa
  rationale: Inihahayag ang pagiging manipis ng רְקִיקִים nang hindi gumagamit ng hiram na terminong maaaring magpahiwatig ng modernong biskwit.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: pinahiran ng langis
  rationale: Sa kontekstong paghahanda ng pagkain, natural nitong inilalarawan ang paglalagay ng langis habang pinananatili ang konkretong kilos ng pandiwa.
- source_word: מִנְחָתָם
  choice: handog na butil para sa mga iyon
  rationale: Sa batas tungkol sa paghahandog, ang מִנְחָה ay handog na butil; ginawang hayag ng parirala ang pangmaramihang hulaping tumutukoy sa mga kaugnay na handog.
- source_word: נִסְכֵּיהֶם
  choice: mga handog na inumin para sa mga iyon
  rationale: Malinaw na katumbas ng mga likidong ibinubuhos bilang handog at pinananatili ang pangmaramihang hulapi.
