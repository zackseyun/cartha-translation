base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: tl
  text: Hindi niya dapat gawing ritwal na marumi ang sarili niya dahil sa kanila kapag namatay sila[a]—maging sa kanyang ama, ina, kapatid na lalaki, o kapatid na babae—sapagkat ang pagkakatalaga sa kanyang Diyos ay nasa kanyang ulo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi niya dapat gawing ritwal na marumi ang sarili niya dahil sa kanila sa oras ng kanilang kamatayan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, nezer. Sa konteksto ng Nazareo, tumutukoy ito sa pagkakatalaga o pagkakahiwalay para sa Diyos, na may nakikitang kaugnayan sa buhok sa kanyang ulo.
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: kahit dahil sa kanyang ama o ina, kapatid na lalaki o kapatid na babae
  rationale: Inilipat kasunod ng pagbabawal upang natural na maipahayag sa Tagalog ang diin ng mga pariralang iniharap sa Hebreo. Pinanatili ang isahan at malinaw na kasarian ng mga katawagang pampamilya.
- source_word: לֹא יִטַּמָּא
  choice: Hindi niya dapat dungisan ang sarili
  rationale: Ipinapakita ang reflexive na anyo ng pandiwa. Sa kontekstong ito, ang “dungisan” ay tumutukoy sa ritwal na karumihan, hindi awtomatikong sa kasalanang moral; nililinaw ito sa talababa.
- source_word: לָהֶם בְּמֹתָם
  choice: dahil sa pagkamatay nila
  rationale: Likas sa Tagalog at ipinahahayag na ang kamatayan ng mga kamag-anak ang pagkakataon o sanhi ng ritwal na pagkadungis. Ang alternatibong mas temporal ay inilagay sa talababa.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pagbabawal sa isang marangal ngunit kasalukuyang rehistro.
- source_word: נֵזֶר
  choice: tanda ng pagkakatalaga
  rationale: Sa konteksto ng Nazareo, tumutukoy ito sa pagkakahiwalay o pagtatalaga sa Diyos at sa nakikitang tanda nito sa ulo. Naiiwasan ng saling ito ang maling pagkaunawa na literal na korona lamang ang tinutukoy.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Pinananatili ang tahasang hulaping panghalip sa Hebreo at ang personal na ugnayang ipinahahayag nito.
- source_word: עַל רֹאשׁוֹ
  choice: nasa kanyang ulo
  rationale: Pinananatili ang konkretong larawan at ang pahiwatig sa buhok ng Nazareo bilang nakikitang tanda ng pagtatalaga.
theological_decisions:
- issue: Kalikasan ng karumihan sa kautusan tungkol sa Nazareo
  choice: Isinalin ang pagbabawal bilang ritwal na pagkadungis at nilinaw ito sa talababa.
  alternative: Gamitin ang “dungisan ang sarili” nang walang paliwanag, na maaaring unawaing moral na kasalanan.
  rationale: Ang konteksto ay ritwal na karumihang dulot ng bangkay. Hindi dapat ipahiwatig ng salin na may moral na pagkakasala na higit sa sinasabi ng teksto.
- issue: Saklaw ng נֵזֶר
  choice: “tanda ng pagkakatalaga” upang saklawin ang kalagayan ng pagiging nakatalaga at ang nakikitang tanda nito.
  alternative: “korona,” “pagkahiwalay,” o “panata ng Nazareo” lamang.
  rationale: May tunay na ugnayan ang salita sa pagtatalaga, pagkakahiwalay, at tanda sa ulo. Ang napiling parirala ay nagpapanatili sa konteksto nang hindi labis na nililimitahan ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sapagkat” para sa dignidad ng legal na konteksto, habang iniwasan ang sobrang arkaikong pananalita. Ang mga panandang [a] at [b] ay parehong lumilitaw sa pangunahing teksto.
