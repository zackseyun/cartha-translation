  terminology: Ang “pagkakatalaga” ay angkop para sa נֵזֶר sa kontekstong Nazareo. Dapat manatili ang “kanyang Diyos,” at ang paliwanag tungkol sa nakikitang tanda sa buhok ay mas nararapat sa talababa kaysa sa pangunahing teksto.
