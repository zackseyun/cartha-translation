id: NUM.6.5
reference: Numbers 6:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: tl
  text: Sa lahat ng araw ng kanyang panata bilang Nazareo[a], walang labaha ang daraan sa kanyang ulo[b]. Hanggang sa makumpleto ang mga araw na ibinukod niya ang sarili niya para kay Yahweh, magiging banal siya; hahayaan niyang humaba nang hindi ginugupit ang buhok sa kanyang ulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panata ng pagbubukod.” Ang salitang Hebreo na pinagmulan ng “Nazareo” ay kaugnay ng pagbubukod o pagtatalaga.
    reason: lexical_alternative
  - marker: b
    text: Ang “walang labaha ang daraan sa kanyang ulo” ay idyomang Hebreo na nangangahulugang hindi niya dapat ahitin ang kanyang ulo.
    reason: idiom_clarification
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: kanyang panata bilang Nazareo
  rationale: Pinananatili ng “Nazareo” ang teknikal na katawagan sa konteksto, samantalang nililinaw ng “panata bilang” na ang tinutukoy ay ang panatang kaugnay ng kalagayang ito.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: walang labahang daraan sa kanyang ulo
  rationale: Pinananatili nito ang kongkretong larawang Hebreo ng labahang hindi daraan sa ulo; ipinapaliwanag sa talababa ang idyomatikong kahulugan.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: hanggang sa makumpleto ang mga araw
  rationale: Tuwirang ipinahahayag ang pagtatapos o pagkalubos ng takdang panahon.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: mga araw ng pagbubukod niya ng sarili para kay Yahweh
  rationale: Pinananatili ang ugat na diwa ng נזר bilang pagbubukod o pagtatalaga ng sarili, nang hindi ito pinapakahulugan nang higit sa sinasabi ng teksto.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ginagamit ang pangalang tipan na Yahweh at natural na ipinahahayag ng “para kay” ang direksiyon ng pagbubukod o pagtatalaga.
- source_word: קָדֹשׁ יִהְיֶה
  choice: magiging banal siya
  rationale: Pinananatili ang tahasang teolohikal na salitang “banal” para sa קָדֹשׁ.
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: hahayaan niyang humaba nang hindi ginugupit ang buhok sa kanyang ulo
  rationale: Ipinahahayag ang pagpapahaba ng buhok at ang diwa ng פֶּרַע bilang malayang tumutubo o hindi ginugupit na buhok sa natural na modernong Tagalog.
theological_decisions:
- issue: Pagbibigay ng pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tahasan sa Hebreo ang pangalang tipan na יהוה; pinananatili itong personal na pangalan bilang “Yahweh.”
- issue: Kung pananatilihin ang “banal” o gagamit ng paliwanag na salita
  choice: magiging banal siya
  alternative: itatalaga siya / ibubukod siya
  rationale: Ang Hebreo ay tahasang gumagamit ng קָדֹשׁ; pinananatili ng “banal” ang leksikal at teolohikal na bigat nito, habang ipinapaliwanag na ng konteksto ang pagbubukod.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang teknikal na katawagang “Nazareo,” ang pangalang “Yahweh,” at ang kongkretong idyoma tungkol sa labaha; nilinaw sa mga talababa ang mga ito.
