revisions:
- from: Sa lahat ng araw ng kanyang panata bilang Nazareo[a], walang labahang daraan sa kanyang ulo[b]. Hanggang sa makumpleto ang mga araw ng pagbubukod niya ng sarili para kay Yahweh, magiging banal siya; hahayaan niyang humaba nang hindi ginugupit ang buhok sa kanyang ulo.
  to: Sa lahat ng araw ng kanyang panata bilang Nazareo[a], walang labaha ang daraan sa kanyang ulo[b]. Hanggang sa makumpleto ang mga araw na ibinukod niya ang sarili niya para kay Yahweh, magiging banal siya; hahayaan niyang humaba nang hindi ginugupit ang buhok sa kanyang ulo.
  rationale: Itinuwid ang di-likas na anyong "labahang daraan" tungo sa malinaw na literal na larawan, "walang labaha ang daraan." Inayos din ang relatibong sugnay tungkol sa pagbubukod upang maging natural na Tagalog nang hindi binabago ang kahulugan o ang temporal na saklaw ng Hebreo. Ang talababa tungkol sa labaha ay iniayon sa binagong pangunahing teksto at nilimitahan sa kahulugang direktang ipinahihiwatig ng idyoma.
