  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: tl
  text: Muli niyang ilalaan sa PANGINOON ang mga araw ng kanyang pagiging Nazareo[a], at magdadala siya ng isang lalaking korderong isang taóng gulang bilang handog para sa pagkakasala. Ngunit hindi na bibilangin ang mga naunang araw[b], sapagkat nadungisan ang kanyang pagiging Nazareo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga araw ng kanyang pagkakatalaga” o “mga araw ng kanyang pagkakahiwalay.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mahuhulog ang mga unang araw”; ibig sabihin, hindi na isasama sa bilang ang mga araw bago siya nadungisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר
  choice: Muli niyang ilalaan
  rationale: Ang Hiphil ng נזר sa kontekstong ito ay tumutukoy sa muling pagpasok sa kalagayan ng nakatalagang paghihiwalay matapos maputol ang naunang panahon.
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ipinahahayag ng pang-ukol ang paglalaan kay YHWH; ginamit ang kinagawiang anyong PANGINOON para sa banal na pangalan.
- source_word: יְמֵי נִזְרוֹ
  choice: ang mga araw ng kanyang pagiging Nazareo
  rationale: Tumutukoy ito sa takdang panahon ng institusyong Nazareo. Ang 'pagiging Nazareo' ay natural sa Filipino at hindi ipinapalagay na ang נזר mismo ay laging nangangahulugang 'panata.'
- source_word: וְהֵבִיא
  choice: at magdadala siya
  rationale: Karaniwang pananalita sa paghahandog para sa pagdadala ng handog.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: isang lalaking korderong isang taóng gulang
  rationale: Pinananatili ang uri, kasarian, at edad ng hayop na hinihingi ng tekstong Hebreo.
- source_word: לְאָשָׁם
  choice: bilang handog para sa pagkakasala
  rationale: Ang אָשָׁם ay isang tiyak na uring handog na kaugnay ng pagkakasala at pananagutan; malinaw at pamilyar sa karaniwang mambabasang Filipino ang pariralang ito.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: hindi na bibilangin ang mga naunang araw
  rationale: Literal na 'mahuhulog ang mga unang araw,' ngunit sa legal na konteksto ang epekto ay hindi na maisasama ang mga araw na lumipas bago ang pagkadungis.
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: sapagkat nadungisan ang kanyang pagiging Nazareo
  rationale: Pinananatili ang ritwal na diwa ng טמא at ang teknikal na konteksto ng pagiging Nazareo.
theological_decisions:
- issue: Kahulugan ng נזר/נזרו sa batas tungkol sa Nazareo
  choice: pagiging Nazareo
  alternative: panata ng Nazareo; pagkakatalaga; pagkakahiwalay
  rationale: Sa Bilang 6, teknikal na tumutukoy ang salita sa kalagayan o panahon ng pagiging Nazareo. Iniiwasan nitong paliitin ang salita sa 'panata' lamang habang nananatiling malinaw ang institusyong tinutukoy.
- issue: Paglilipat ng יהוה
  choice: PANGINOON
  alternative: Yahweh; Jehovah
  rationale: Ginamit ang kinagawiang banal na titulong PANGINOON sa malalaking titik bilang katumbas ng tetragrammaton.
- issue: Legal na epekto ng יִפְּלוּ
  choice: hindi na bibilangin
  alternative: mawawalang-bisa; mawawala; mahuhulog
  rationale: 'Ipinapahayag nito ang kontekstuwal na epekto nang hindi nagdaragdag ng doktrinal na paliwanag: kailangang magsimulang muli ang pagbilang matapos madungisan ang pagiging Nazareo.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'Nazareo,' ang nakagawiang katawagan sa Filipino, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
