  text: May Yahweh bless you and keep you[a].
translation:
  language: tl
  text: Pagpalain ka nawa ni Yahweh at ingatan ka niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; kinaugaliang isalin na “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Pagpalain ka nawa
  rationale: Ang Piel jussive na may hulaping tumutukoy sa ikalawang panauhang panlalaki na isahan ay nagpapahayag ng hangarin sa konteksto ng pagpapala. Likas na naihahatid ng “Pagpalain ka nawa” ang puwersang ito sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וְיִשְׁמְרֶךָ
  choice: at ingatan ka niya
  rationale: Ang Qal jussive ng שמר ay tumutukoy sa pag-iingat at mapangalagang pagprotekta. Nilinaw ng “niya” na si Yahweh pa rin ang simuno, gaya ng ipinahihiwatig ng Hebreo, at naging natural ang daloy sa Filipino.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa teksto sa halip na halinhan ito ng isang titulo.
translation_notes:
  register: Maikli, marangal, at likas na modernong Filipino. Pinanatili ang anyong panalangin o paghiling sa pamamagitan ng “nawa,” gayundin ang isahang “ka” ng Hebreo.
