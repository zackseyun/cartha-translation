id: NUM.6.14
reference: Numbers 6:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: tl
  text: 'at ihahandog niya kay Yahweh ang kanyang handog: isang lalaking korderong isang taóng gulang at walang kapintasan bilang handog na sinusunog, isang babaeng korderong isang taóng gulang at walang kapintasan bilang handog para sa kasalanan[a], at isang lalaking tupa na walang kapintasan bilang handog para sa kapayapaan[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת ay maaaring tumukoy kapuwa sa kasalanan at sa handog na kaugnay ng paglilinis mula sa karumihan o pagkakasala.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “handog para sa kagalingan” o “handog ng pakikisama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: at ihahandog niya
  rationale: Ang Hiphil ng קרב sa kontekstong paghahandog ay nangangahulugang iharap o ihandog. Likas sa modernong Tagalog ang “ihahandog,” at pinananatili ng “at” ang pagpapatuloy ng tagubilin.
- source_word: קָרְבָּנוֹ
  choice: ang kanyang handog
  rationale: Tumutukoy ito sa kaloob na inihaharap sa ritwal; malinaw at karaniwan sa Tagalog ang “handog.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang pinananatili ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: כֶּבֶשׂ ... בֶּן שְׁנָתוֹ
  choice: isang lalaking korderong isang taóng gulang
  rationale: Tiyak na lalaking batang tupa ang כֶּבֶשׂ, at ang idyomang בֶּן שְׁנָתוֹ ay nagsasaad ng hayop na isang taóng gulang.
- source_word: תָמִים / תְּמִימָה
  choice: walang kapintasan
  rationale: Sa batas tungkol sa paghahandog, inilalarawan nito ang hayop na walang depekto; ang “walang kapintasan” ay malinaw at angkop sa ritwal na konteksto.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na sinusunog; ipinahahayag ng “bilang” ang gamit ng hayop sa kategoryang ito ng handog.
- source_word: וְכַבְשָׂה ... בַּת שְׁנָתָהּ
  choice: isang babaeng korderong isang taóng gulang
  rationale: Tiyak na babaeng kordero ang כַבְשָׂה, at ang kasunod na parirala ay pambabaeng anyo ng “isang taóng gulang.”
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Ang חַטָּאת ay maaaring tumukoy sa kasalanan o sa handog na kaugnay ng paglilinis. Pinananatili sa pangunahing teksto ang pamilyar na katawagang “handog para sa kasalanan,” at inilalagay sa talababa ang leksikal na alternatibo.
- source_word: וְאַיִל אֶחָד
  choice: at isang lalaking tupa
  rationale: Ang אַיִל ay isang adultong lalaking tupa, kaya mas eksakto ang “lalaking tupa” kaysa sa pangkalahatang “tupa.”
- source_word: לִשְׁלָמִים
  choice: bilang handog para sa kapayapaan
  rationale: Ang שְׁלָמִים ay pangalang pangkategorya ng handog na may mga diwang kapayapaan, kagalingan, at pakikisama; pinananatili sa teksto ang maikli at pamilyar na “handog para sa kapayapaan,” na may mga alternatibo sa talababa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang ginagamit ng tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng חַטָּאת sa batas ng paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Saklaw ng terminong Hebreo ang handog na may kaugnayan sa kasalanan at ritwal na paglilinis. Ginamit ang pinakapamilyar na katawagan sa teksto ngunit pinanatili ang tunay na leksikal na tensiyon sa talababa.
- issue: Kahulugan ng שְׁלָמִים
  choice: handog para sa kapayapaan
  alternative: handog para sa kagalingan; handog ng pakikisama
  rationale: Hindi iisang konseptong Tagalog ang ganap na sumasaklaw sa terminong Hebreo. Ginamit ang tradisyonal at madaling makilalang katawagan, habang inilalahad sa talababa ang iba pang posibleng diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang panimulang pang-ugnay na “at” upang ipakita ang pagpapatuloy mula sa naunang tagubilin. Ginamit ang “kordero” para sa batang tupa at “lalaking tupa” para sa אַיִל upang mapanatili ang pagkakaiba ng mga hayop.
