base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh kay Moises[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive imperfect ng דבר ay naghuhudyat ng bagong hakbang sa salaysay. Likas at marangal sa modernong Tagalog ang “Nagsalita” sa pormulang nagpapakilala ng banal na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na katumbas bago ang pangalan ng tao.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong Filipino.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang infinitive construct ay karaniwang panimula sa tuwirang pahayag. Sa natural na Tagalog, malinaw at hindi paulit-ulit na ginagampanan ng tutuldok ang tungkuling ito bago ang mismong sinabi sa kasunod na talata.
theological_decisions:
- issue: Pagkasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng isang titulo; inilalahad sa talababa ang tradisyonal na salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang literal ngunit alanganing “na sinasabi,” sapagkat ang לֵאמֹר ay nagpapakilala sa tuwirang pahayag na magsisimula sa kasunod na talata.
