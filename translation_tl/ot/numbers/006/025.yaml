  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: tl
  text: Pasikatin nawa ni Yahweh ang kaniyang mukha sa iyo, at pagpakitaan ka niya ng kagandahang-loob[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pasikatin nawa ni Yahweh ang kaniyang mukha tungo sa iyo, at pagpakitaan ka niya ng pabor.”
    reason: Ipinakikita ang mas tuwirang direksiyonal na diwa ng אֵלֶיךָ bilang “tungo sa iyo” at ang alternatibong pagsasalin ng חנן bilang “pabor.”
lexical_decisions:
- source_word: יָאֵר
  choice: Paliwanagin nawa
  rationale: Ang Hiphil jussive ng אוֹר ay nagpapahayag ng hangarin o basbas at may diwang causative. Pinananatili ng “Paliwanagin nawa” ang dalawang aspetong ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nang tuwiran ang banal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: פָּנָיו
  choice: ang kanyang mukha
  rationale: Pinananatili ang kongkretong larawan ng Hebreong idyoma. Bagaman ipinahihiwatig nito ang mabuting presensiya at pagsang-ayon ng Diyos, ang “presensiya” ay magiging pagpapakahulugan sa halip na tuwirang salin.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Likas sa modernong Tagalog ang “sa iyo” para sa direksiyon ng mabuting pagkilos na ipinahihiwatig ng אֶל sa idyomang ito.
- source_word: וִיחֻנֶּךָּ
  choice: at pagpakitaan ka niya ng kagandahang-loob
  rationale: Ang חנן ay nangangahulugang magpakita ng biyaya o pabor. Malinaw at marangal ang “kagandahang-loob” at hindi nito labis na idinidiin ang awa sa isang kaawa-awang kalagayan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Antropomorpikong idyomang ‘paliwanagin ang kanyang mukha’
  choice: Panatilihin ang larawan ng mukha sa pangunahing teksto
  alternative: Ipaabot sa iyo ang liwanag ng kanyang presensiya
  rationale: Ang orihinal ay gumagamit ng kongkreto at makatang larawan upang ipahayag ang banal na pagsang-ayon. Hindi ito dapat gawing abstraktong paliwanag sa pangunahing teksto.
- issue: Saklaw ng kahulugan ng חנן
  choice: pagpakitaan ng kagandahang-loob
  alternative: kahabagan
  rationale: Sinasaklaw ng חנן ang mapagbiyayang pabor. Posible ang “kahabagan,” ngunit maaari nitong paliitin ang diwa tungo sa awa lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa anyo ng isang basbas. Pinanatili ang makatang larawang “kanyang mukha” kahit hindi ito karaniwang idyoma sa pang-araw-araw na Tagalog; iniwasan ang arkaikong pananalita at labis na pagpapakahulugan.
