  terminology: Ang “Nazareo” at “Toldang Tipanan” ay angkop at dapat panatilihin. Ang “hain na pangkapayapaan” ay napapanatili ang teknikal na sakripisyong שְׁלָמִים nang hindi inuulit ang kahulugan ng “hain” at “handog.”
