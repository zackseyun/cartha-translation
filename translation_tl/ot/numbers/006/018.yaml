revisions:
- from: Pagkatapos, sa pasukan ng Toldang Tipanan, aahitin ng Nazareo ang buhok sa kanyang ulong itinalaga. Kukunin niya ang buhok mula sa kanyang ulong itinalaga at ilalagay iyon sa apoy na nasa ilalim ng hain na handog para sa kapayapaan.[a]
  to: Pagkatapos, sa may pasukan ng Toldang Tipanan, aahitin ng Nazareo ang buhok sa kanyang ulo na tanda ng kanyang pagkatalaga. Kukunin niya ang buhok na iyon at ilalagay sa apoy na nasa ilalim ng hain na pangkapayapaan.[a]
  rationale: Binago ang di-likas na “ulong itinalaga” upang malinaw na maiugnay ang buhok sa pagkatalaga ng Nazareo, habang pinananatili ang pag-uulit ng Hebreo sa pamamagitan ng “buhok na iyon.” Pinasimple rin ang katawagang sakripisyo sa “hain na pangkapayapaan,” isang likas na modernong Filipino na nagpapanatili sa teknikal na kahulugan ng זֶבַח הַשְּׁלָמִים.
