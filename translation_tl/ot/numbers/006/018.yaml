base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: tl
  text: Pagkatapos, sa may pasukan ng Toldang Tipanan, aahitin ng Nazareo ang buhok sa kanyang ulo na tanda ng kanyang pagkatalaga. Kukunin niya ang buhok na iyon at ilalagay sa apoy na nasa ilalim ng hain na pangkapayapaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hain para sa pakikipagkaisa” o “hain para sa katiwasayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּזִיר
  choice: Nazareo
  rationale: Ginamit ang kinikilalang terminong Filipino para sa taong nasa ilalim ng natatanging panata na inilalarawan sa kabanatang ito; pinananatili nito ang teknikal na kahulugang panseremonya.
- source_word: וְגִלַּח
  choice: aahitin
  rationale: Tuwirang ipinapahayag ng pandiwa ang pag-aahit ng buhok at ang hinaharap na tagubiling panseremonya.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng Toldang Tipanan
  rationale: Ang פֶּתַח ay pasukan o bukana. Ang “Toldang Tipanan” ay natural at pamilyar na salin ng teknikal na pangalan ng santuwaryo, habang naipahihiwatig ang itinakdang pakikipagtagpo roon.
- source_word: רֹאשׁ נִזְרוֹ
  choice: kanyang ulong itinalaga
  rationale: Natural itong Filipino at pinananatili ang ugnayan ng ulo at buhok sa natatanging pagkatalaga ng Nazareo, nang hindi pinalalawak ang pangngalan bilang mismong “panata.”
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: ang buhok mula sa kanyang ulong itinalaga
  rationale: Nililinaw ng “mula sa” na ang inahit na buhok ang kukunin, habang inuulit ang mahalagang ugnayan nito sa pagkatalaga gaya ng nasa Hebreo.
- source_word: וְנָתַן
  choice: ilalagay
  rationale: Tumutugma ito sa payak na kahulugan na “ilagay” at hindi nagdaragdag ng ideya ng paghahagis o pagsunog bilang hiwalay na kilos.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: hain na handog para sa kapayapaan
  rationale: Pinananatili ng “hain” ang זֶבַח at inilalarawan ang שְׁלָמִים bilang kinikilalang uri ng handog. Ang “kapayapaan” ay nagpapanatili sa tradisyonal at malawak na kahulugan nang hindi ito nililimitahan sa pakikisalo lamang.
theological_decisions:
- issue: Kahulugan ng katawagang panseremonya na שְׁלָמִים
  choice: handog para sa kapayapaan
  alternative: handog para sa pakikipag-isa; handog para sa katiwasayan
  rationale: May saklaw ang terminong Hebreo na maaaring iugnay sa kapayapaan, kabuuang kagalingan o katiwasayan, at pakikisalo. Pinili ang “kapayapaan” bilang pangunahing salin ngunit pinanatili sa talababa ang mga lehitimong alternatibo upang hindi paliitin ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Nazareo” at “Toldang Tipanan” bilang mga kinikilalang katawagang biblikal. Iniwasan ang lubhang literal ngunit di-likas na “ulo ng kanyang pagkatalaga,” habang pinanatili ang pag-uulit at rituwal na kabuluhan ng buhok.
