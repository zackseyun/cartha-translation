base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/008.yaml
  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: tl
  text: Pagkatapos, pumunta sina Moises at Aaron sa harap ng Tolda ng Pagpupulong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa mukha ng Tolda ng Pagpupulong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, pumunta
  rationale: Ang wayyiqtol ng בוא ay nagpapatuloy sa salaysay at may puwersang pangnagdaan. Ang “pumunta” ay natural sa Filipino at hindi nagpapahiwatig na pumasok sila sa loob ng tolda.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: sina Moises at Aaron
  rationale: Ginamit ang “sina” para sa tambalang paksa na binubuo ng dalawang pangalang pantangi; ang mga pangalan ay nasa karaniwang anyong Filipino.
- source_word: אֶל־פְּנֵי
  choice: sa harap ng
  rationale: Ito ang natural at maikling katumbas ng idyomang Hebreo na literal na tumutukoy sa paglapit “sa mukha ng” isang bagay o lugar.
- source_word: אֹהֶל מוֹעֵד
  choice: Tolda ng Pagpupulong
  rationale: Pinananatili nito ang kahulugan ng אֹהֶל bilang “tolda” at ng מוֹעֵד bilang itinakdang pagtitipon o pagpupulong, nang hindi ito ipinagkakamali sa “tipan.” Ginamit ang malaking titik sapagkat tumutukoy ito sa natatanging santuwaryo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagkatapos” upang natural na ipakita ang pagsulong ng salaysay, at iniwasan ang “pumasok” dahil hindi tiyak sa Hebreo na pumasok sila sa loob.
