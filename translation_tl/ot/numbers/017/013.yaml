id: NUM.17.13
reference: Numbers 17:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: tl
  text: Tumayo siya sa pagitan ng mga patay at ng mga buhay, at napigil ang salot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Tumayo siya
  rationale: Ang pandiwang עמד ay nangangahulugang “tumayo” o “manindigan.” Likas at tuwiran ang “tumayo” sa Tagalog at hindi nito dinaragdagan ang teksto ng diwa ng pakikipaglaban o pagsuway.
- source_word: בֵּין ... וּבֵין
  choice: sa pagitan ng ... at ng
  rationale: Malinaw na ipinahihiwatig ng magkatambal na pang-ukol ang puwestong nasa pagitan ng dalawang pangkat.
- source_word: הַמֵּתִים
  choice: mga patay
  rationale: Tumutukoy ang anyong substantibo sa mga taong namatay. Likas sa Tagalog ang “mga patay” at pinananatili nito ang matinding pagsalungat sa mga buhay.
- source_word: הַחַיִּים
  choice: mga buhay
  rationale: Tumutukoy ito sa mga nananatiling buhay. Ang “mga buhay” ay maikli, malinaw, at kapantay ng “mga patay” sa kayarian.
- source_word: וַתֵּעָצַר
  choice: napigil
  rationale: Ang pasibo/resultatibong anyo ng עצר ay nagsasaad na nahadlangan o nahinto ang paglaganap. Ipinahahayag ng “napigil” ang pagpapatigil sa salot nang hindi ipinapalagay na tuluyan na lamang itong kusang nagwakas.
- source_word: הַמַּגֵּפָה
  choice: ang salot
  rationale: Ang מַגֵּפָה ay isang nakamamatay na salot o hagupit. Karaniwan at angkop sa kontekstong biblikal ang “salot,” habang nananatiling nauunawaan sa modernong Filipino.
theological_decisions:
- issue: Kalikasan ng מַגֵּפָה sa kontekstong ito ng paghatol
  choice: ang salot
  alternative: ang hagupit; ang paglaganap ng sakit
  rationale: Tumutukoy ang salita sa nakamamatay na salot sa agarang salaysay. Pinananatili ng “salot” ang tindi at nakaugaliang diwa nito nang hindi nagdaragdag ng paliwanag na teolohikal na wala sa talata.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang maikli at mariing paghahambing ng “mga patay” at “mga buhay,” gayundin ang pasibong resulta sa “napigil ang salot.”
