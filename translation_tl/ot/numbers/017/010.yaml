  text: הֵרֹ֗מּוּ מִ/תּוֹךְ֙ הָ/עֵדָ֣ה הַ/זֹּ֔את וַ/אֲכַלֶּ֥ה אֹתָ֖/ם כְּ/רָ֑גַע וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: tl
  text: “Lumayo kayo mula sa gitna ng kapulungang ito[a], upang lipulin ko sila sa isang iglap[b].” At nagpatirapa sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ihiwalay ninyo ang inyong sarili sa kapulungang ito.”
    reason: lexical_alternative
  - marker: b
    text: O “ubusin ko sila sa isang sandali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: Lumayo kayo
  rationale: Ang Niphal na pautos mula sa רום ay literal na may larawang ‘maitaas,’ ngunit sa kontekstong ito ay idyomatikong nag-uutos na umalis o humiwalay sa kapulungan. Ang ‘Lumayo kayo’ ay malinaw, natural, at pinananatili ang kagyat na utos nang hindi labis na nagpapakahulugan.
- source_word: מִתּוֹךְ
  choice: sa gitna ng
  rationale: Tumutukoy ito sa pag-alis mula sa loob ng isang pangkat; natural sa Filipino ang pariralang ‘lumayo ... sa gitna ng.’
- source_word: הָעֵדָה הַזֹּאת
  choice: kapulungang ito
  rationale: Ang עֵדָה ay tumutukoy sa nagkakatipong pamayanan ng Israel. Ang ‘kapulungan’ ay marangal at malawak ang saklaw, nang hindi nililimitahan sa isang gawaing panrelihiyon lamang.
- source_word: וַאֲכַלֶּה
  choice: upang lipulin ko
  rationale: Ang Piel ng כלה ay nangangahulugang lubusang wakasan, ubusin, o lipulin. Ang ‘lipulin’ ay natural at malinaw na naghahayag ng lubos na paghatol, habang ang talababa ay nagpapanatili ng alternatibong larawang ‘ubusin.’
- source_word: אֹתָם
  choice: sila
  rationale: Tuwirang layon na tumutukoy sa kapulungan; sa Filipino, ‘sila’ ang natural na anyo kasunod ng pandiwa.
- source_word: כְּרָגַע
  choice: sa isang iglap
  rationale: Ipinapahayag ng parirala ang napakaikling panahon. Ang ‘sa isang iglap’ ay likas at masidhing katumbas sa modernong Filipino.
- source_word: וַיִּפְּלוּ
  choice: At nagpatirapa sila
  rationale: Pinananatili ng ‘At’ ang sunod-sunod na daloy ng salaysay, at inilalarawan ng ‘nagpatirapa’ ang sinadyang pagbagsak sa lupa.
- source_word: עַל פְּנֵיהֶם
  choice: nagpatirapa
  rationale: Ang Hebreong idyoma ay literal na ‘sa kanilang mga mukha.’ Ang pandiwang Filipino na ‘nagpatirapa’ ay natural na naghahatid ng posisyong nakasubsob ang mukha sa lupa; nasa talababa ang mas literal na anyo.
theological_decisions:
- issue: Kalikasan ng utos ng Diyos kina Moises at Aaron
  choice: Isinalin ito bilang kagyat na utos na lumayo sa kapulungan bago ang nalalapit na lubos na paghatol.
  alternative: ‘Ihiwalay ninyo ang inyong sarili’ o ‘Tumabi kayo’
  rationale: Tahasan sa Hebreo ang pautos at ang layuning lipulin agad ang bayan. Hindi pinalalambot ng salin ang banta, ngunit hindi rin nito dinaragdagan ng paliwanag ang dahilan o saklaw ng paghatol.
- issue: Kahulugan ng pagpapatirapa
  choice: Iniwan ang kilos na walang idinagdag na tiyak na motibo.
  alternative: Tukuyin ito bilang pagsamba, takot, o pamamagitan
  rationale: Maaaring magpahiwatig ang kilos ng takot, pagsamba, o pamamagitan, ngunit hindi tahasang sinasabi ng talata kung alin ang pangunahing motibo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘kapulungan’ para sa kolektibong pamayanan, ‘lumayo’ para sa idyomatikong utos, at ‘nagpatirapa’ para sa natural na paglalarawan ng Hebreong ‘bumagsak sa kanilang mga mukha.’ Ang mga talababa [a] at [b] ay parehong nakamarka sa pangunahing teksto.
