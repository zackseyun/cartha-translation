  to: bilang paalaala sa mga anak ni Israel[a], upang walang tagalabas[b] na hindi mula sa lahi ni Aaron ang lumapit para magsunog ng insenso sa harap ni Yahweh, at upang hindi siya matulad kay Korah at sa pangkat nito, ayon sa sinabi ni Yahweh sa kanya[d] sa pamamagitan ni Moises.[c]
