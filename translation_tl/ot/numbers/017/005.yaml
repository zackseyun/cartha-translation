  terminology: Ang “Yahweh” ay wastong tumutugon sa tetragrammaton. Wasto ang “tagalabas” na nililinaw ng talababa bilang kawalan ng awtorisasyong pangpari, hindi etnisidad. Ang “Korah” ang pinanatili bilang mas malapit na anyo ng pangalan sa Hebreo.
