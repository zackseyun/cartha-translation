id: NUM.17.5
reference: Numbers 17:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: tl
  text: bilang paalaala sa mga anak ni Israel[a], upang walang tagalabas[b] na hindi mula sa lahi ni Aaron ang lumapit para magsunog ng insenso sa harap ni Yahweh, at upang hindi siya matulad kay Korah at sa pangkat nito, ayon sa sinabi ni Yahweh sa kanya[d] sa pamamagitan ni Moises.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “bilang alaala” o “bilang tanda ng pag-alaala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tagalabas” dito ay taong walang karapatang gumanap ng tungkuling pangpari, hindi kinakailangang banyaga sa lahi.
    reason: cultural_note
  - marker: c
    text: Sa Hebreo, “sa kamay ni Moises,” isang idyomang nangangahulugang “sa pamamagitan ni Moises.”
    reason: lexical_alternative
  - marker: d
    text: Malamang na si Aaron ang tinutukoy ng “sa kanya,” ngunit hindi tahasang pinangalanan ang tinutukoy ng panghalip.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: paalaala
  rationale: Tumutukoy ito sa isang bagay na nagsisilbing alaala o paalaala. Ang “paalaala” ay natural sa makabagong Tagalog at angkop sa babalang nasa konteksto.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang pampamilyang katawagang tipan ng Hebreo habang nananatiling malinaw sa Tagalog.
- source_word: אִישׁ זָר
  choice: tagalabas
  rationale: Sa kontekstong pangpari, tumutukoy ito sa taong hindi kabilang o hindi awtorisado sa gawaing ito, hindi kinakailangang isang banyaga sa lahi.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: mula sa lahi ni Aaron
  rationale: Natural na Tagalog para sa pinagmulang angkan na ipinahihiwatig ng זֶרַע.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: magsunog ng insenso
  rationale: Malinaw at karaniwang pagpapahayag sa Tagalog para sa ritwal na pagpapausok ng insenso.
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: at upang hindi siya matulad kay Kora at sa pangkat nito
  rationale: Ipinapahayag ang babalang huwag tularan o sapitin ang naging kalagayan ni Kora at ng grupong kasama niya; ang “pangkat” ay natural para sa עֵדָה sa kontekstong ito.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Isinasalin ang idyomang literal na “sa kamay ni Moises” ayon sa kahulugan nitong namamagitang tagapagsalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
theological_decisions:
- issue: Kahulugan ng זָר sa kontekstong pangpari
  choice: tagalabas
  alternative: banyaga; taong hindi awtorisado
  rationale: Ang pagbabawal ay batay sa hindi pagiging kabilang sa lahi ni Aaron at sa kawalan ng karapatang gumanap ng tungkuling pangpari, hindi sa etnisidad.
- issue: Tinutukoy ng panghalip na לוֹ (“sa kanya”)
  choice: pinanatiling “sa kanya” sa teksto, na may talababa na malamang na si Aaron ang tinutukoy
  alternative: tahasang “kay Aaron”; “tungkol sa kanya”
  rationale: Hindi tahasang pinangalanan sa sugnay ang pinatutungkulan. Pinananatili ng salin ang panghalip at ang tunay na antas ng kalabuan.
- issue: Kahulugan ng paghahambing kay Kora at sa kanyang pangkat
  choice: hindi siya matulad kay Kora at sa pangkat nito
  alternative: hindi siya maging gaya ni Kora at ng kanyang kapulungan
  rationale: Hindi nilulutas nang labis kung ang diin ay nasa pagkilos, halimbawa, o sinapit na hatol; ang “matulad” ay nagpapanatili ng lawak ng paghahambing.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “mga anak ni Israel” bilang pormal na katawagang tipan, ngunit ginamit ang natural na “lahi,” “pangkat,” at “sa pamamagitan” upang maiwasan ang matigas o mapanlinlang na literalismo.
