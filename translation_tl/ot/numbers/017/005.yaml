  verdict: revise
  source_fidelity: 'Ang salin ay tumpak sa pangunahing nilalaman: ang paalaala para sa Israel, ang pagbabawal sa hindi mula sa lahi ni Aaron na maghandog ng insenso, ang babala kaugnay ni Korah at ng kanyang pangkat, at ang pagsasalita ni Yahweh sa pamamagitan ni Moises. Gayunman, ang hiwalay na pangungusap na “Ito ay ayon sa sinabi ...” ay bahagyang nagpapalabo sa sintaktikong pagkakaugnay ng pangwakas na sugnay sa naunang pahayag. Mas mabuting panatilihin itong nakaugnay na pangwakas na sugnay. Ang baybay na “Korah” ay mas malapit din sa Hebreong קֹרַח at sa karaniwang anyo sa Filipino na pagsasalin ng Bibliya.'
