    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “para sa sambahayan ni Levi”; ibig sabihin, ang tungkod ay kumakatawan sa sambahayan o lipi ni Levi.
    reason: cultural_note
  revision_rationale: 'Pinalitan ang "mga usbong" ng "mga bulaklak" upang maipakita ang פֶּרַח bilang blossom at mapanatili ang progresyon ng Hebreo: pagsibol, paglabas ng bulaklak, pamumukadkad, at hinog na almendras. Inayos din ang alternatibong footnote upang maging likas at tumpak sa modernong Filipino.'
