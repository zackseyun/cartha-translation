revisions:
- from: 'Kinabukasan, pumasok si Moises sa tolda ng patotoo[a]. At narito, sumibol ang tungkod ni Aaron para sa sambahayan ni Levi[b]: naglabas ito ng mga usbong, namukadkad ang mga bulaklak, at nahinog ang mga almendras.'
  to: 'Kinabukasan, pumasok si Moises sa tolda ng patotoo[a]. At narito, sumibol ang tungkod ni Aaron para sa sambahayan ni Levi[b]: naglabas ito ng mga bulaklak, namukadkad, at nahinog ang mga almendras.'
  rationale: 'Pinalitan ang "mga usbong" ng "mga bulaklak" upang maipakita ang פֶּרַח bilang blossom at mapanatili ang progresyon ng Hebreo: pagsibol, paglabas ng bulaklak, pamumukadkad, at hinog na almendras. Inayos din ang alternatibong footnote upang maging likas at tumpak sa modernong Filipino.'
