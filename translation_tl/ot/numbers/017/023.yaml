  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “At narito” upang mapanatili ang dramatikong diin ng Hebreo, at inayos ang magkakasunod na pandiwa bilang malinaw na pag-unlad mula pagsibol hanggang pagkahinog.
