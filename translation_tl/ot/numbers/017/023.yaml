base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: tl
  text: 'Kinabukasan, pumasok si Moises sa tolda ng patotoo[a]. At narito, sumibol ang tungkod ni Aaron para sa sambahayan ni Levi[b]: naglabas ito ng mga bulaklak, namukadkad, at nahinog ang mga almendras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tolda ng pagsaksi.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “para sa sambahayan ni Levi”; ibig sabihin, ang tungkod ay kumakatawan sa sambahayan o lipi ni Levi.
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Kinabukasan
  rationale: Likas at maikli itong makabagong Tagalog para sa sumunod na araw at malinaw na ipinagpapatuloy ang salaysay.
- source_word: אֹהֶל הָעֵדוּת
  choice: tolda ng patotoo
  rationale: Pinananatili ng “patotoo” ang legal at tipanang diwa ng עֵדוּת, samantalang karaniwan at malinaw ang “tolda.”
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili nito ang biglang pagtawag-pansin at pagkamangha na ipinahihiwatig ng Hebreong panandang pasalaysay.
- source_word: מַטֵּה
  choice: tungkod
  rationale: Ito ang likas na salitang Tagalog para sa hawak na tungkod ng pinuno at mas angkop kaysa sa literal na “sanga.”
- source_word: פָּרַח
  choice: sumibol
  rationale: Ipinahahayag nito ang unang yugto ng mahimalang pagtubo ng tuyong tungkod at inihahanda ang kasunod na pag-usbong, pamumukadkad, at pagkahinog.
- source_word: לְבֵית לֵוִי
  choice: para sa sambahayan ni Levi
  rationale: Malapit ito sa anyong Hebreo at pinananatili ang diwang kinakatawan ng tungkod ni Aaron ang sambahayan o lipi ni Levi.
- source_word: וַיֹּצֵא פֶרַח
  choice: naglabas ito ng mga usbong
  rationale: Natural sa Tagalog at malinaw na naglalarawan ng yugto bago lubusang mamukadkad ang mga bulaklak.
- source_word: וַיָּצֵץ צִיץ
  choice: namukadkad ang mga bulaklak
  rationale: Isinasalin nito ang magkaugnay na pandiwa at pangngalan bilang ganap na pamumulaklak, habang pinananatili ang pag-unlad ng larawan.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: nahinog ang mga almendras
  rationale: Tumpak na ipinakikita ang pag-abot ng bunga sa pagkahinog, hindi lamang ang simpleng paglitaw nito.
