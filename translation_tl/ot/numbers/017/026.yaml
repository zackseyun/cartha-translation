  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: tl
  text: At ginawa ni Moises ang lahat ng iniutos sa kanya ni Yahweh; gayon nga ang ginawa niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At ginawa
  rationale: Ang עשה ay malawak ang kahulugang “gawin/lumikha”; sa konteksto ng pagsunod sa utos, natural ang “ginawa” at napapanatili nito ang pag-uulit sa hulihan.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: כַּאֲשֶׁר
  choice: ang ayon sa
  rationale: Ipinahahayag nito ang pagtutugma ng ginawa ni Moises sa iniutos; natural sa Tagalog ang pariralang “ginawa ang ayon sa iniutos.”
- source_word: צִוָּה
  choice: iniutos
  rationale: Pinananatili nito ang awtoritatibong diwa ng צוה, sa halip na ang mas banayad na “itinagubilin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, hindi pagpapalit dito ng isang titulo.
- source_word: אֹתוֹ
  choice: sa kanya
  rationale: Bagaman minamarkahan ng אֵת ang tuwirang layon sa Hebreo, hinihingi ng natural na Tagalog na gamitin ang “sa kanya” pagkatapos ng “iniutos.”
- source_word: כֵּן
  choice: gayon nga
  rationale: Ang כֵּן ay nagbabalik at nagbibigay-diin sa naunang pahayag; ang “gayon nga” ay malinaw at marangal na katumbas.
- source_word: עָשָׂה
  choice: ang ginawa niya
  rationale: Pinananatili ang sinadyang pag-uulit ng עשה at ang diin sa ganap na pagsunod ni Moises.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang dalawang paglitaw ng “ginawa” upang maihatid ang mariing pag-uulit sa Hebreo. Walang footnote dahil walang tekstuwal o leksikal na kalabuan na kailangang ipaliwanag sa mambabasa.
