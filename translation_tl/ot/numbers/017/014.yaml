source:
  edition: WLC
  text: וַ/יִּהְי֗וּ הַ/מֵּתִים֙ בַּ/מַּגֵּפָ֔ה אַרְבָּעָ֥ה עָשָׂ֛ר אֶ֖לֶף וּ/שְׁבַ֣ע מֵא֑וֹת מִ/לְּ/בַ֥ד הַ/מֵּתִ֖ים עַל דְּבַר קֹֽרַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: tl
  text: Ang mga namatay sa salot ay labing-apat na libo at pitong daan, bukod pa sa mga namatay dahil sa usapin ni Korah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil kay Korah” o “kaugnay ng usapin ni Korah.” Tinutukoy ng parirala ang mga nauna nang namatay na may kaugnayan sa paghihimagsik ni Korah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Ipinagpapatuloy ng anyong pasalaysay ang pagbilang sa mga namatay. Hindi na dinagdagan ng tahasang panandang gaya ng “ngayon” sapagkat wala namang katumbas na salitang temporal sa Hebreo.
- source_word: הַמֵּתִים
  choice: ang mga namatay
  rationale: Mas natural sa makabagong Tagalog kaysa “ang mga patay” sa pangungusap na nagtatala ng bilang ng mga nasawi.
- source_word: בַּמַּגֵּפָה
  choice: sa salot
  rationale: Ang מַגֵּפָה ay tumutukoy sa salot o nakamamatay na kapahamakang dumating sa sambayanan; pinananatili ng “sa” ang payak na ugnayan ng pariralang Hebreo.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: labing-apat na libo at pitong daan
  rationale: Tuwirang paglilipat ng bilang na 14,700 sa natural na anyong Tagalog.
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Malinaw na ipinakikitang hindi kabilang sa 14,700 ang naunang mga namatay na kaugnay ni Korah.
- source_word: עַל דְּבַר קֹרַח
  choice: dahil kay Korah
  rationale: Likas at maikling salin ng pariralang maaaring mangahulugang “dahil kay,” “kaugnay ng,” o “sa usapin ni.” Ang tala sa ibaba ang nagpapanatili sa mas malawak na posibilidad ng parirala.
theological_decisions:
- issue: Saklaw ng mga kamatayang kaugnay ni Korah
  choice: Ibinukod ang 14,700 namatay sa salot mula sa mga naunang namatay dahil kay Korah, nang hindi tinutukoy sa pangunahing teksto ang iba’t ibang pangkat o paraan ng kanilang pagkamatay.
  alternative: “mga namatay kaugnay ng usapin ni Korah” o “mga namatay sa pangyayari tungkol kay Korah”
  rationale: Ipinakikita ng עַל דְּבַר קֹרַח ang kaugnayan sa naunang hatol na konektado kay Korah, ngunit hindi nito tahasang inuuri rito ang bawat kamatayan. Kaya pinananatili ang pagkakaiba nang hindi nagdaragdag ng detalyeng wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “salot,” “bukod pa sa,” at ang pangalang “Korah” upang maging madaling maunawaan habang nananatiling malapit sa Hebreo. Inilagay ang tandang-talababa sa pariralang talagang ipinapaliwanag nito.
