base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Yahweh[a] kay Moises. Sinabi ni Yahweh:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; ayon sa tradisyon ay isinasaling “ang PANGINOON.”'
    reason: Ipinapakita ang anyong Hebreo ng banal na pangalan at ang tradisyonal na alternatibong salin.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive kasama ng דּבר ay nagpapatuloy sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos” para sa pagkakasunod-sunod, at pinananatili ng “nagsalita” ang kaibhan nito sa kasunod na pormulang לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang transliterasyon ng personal na pangalang YHWH, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay nagsasaad ng pinatutunguhan ng pagsasalita, at ang “kay” ang likas na panandang Tagalog bago ang pangalan ng tao.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ang infinitive construct na ito ay karaniwang pormula sa pagpapakilala ng tuwirang pahayag. Ang hiwalay na “Sinabi niya,” ay malinaw at natural sa Tagalog habang pinananatili ang tungkulin ng pormulang Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na personal na pangalan at hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang sugnay ang pormulang Hebreo upang maging likas basahin, ngunit pinanatili ang pagkakasunod ng “nagsalita” at ng pambungad sa tuwirang pahayag.
