  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: tl
  text: At isulat mo ang pangalan ni Aaron sa tungkod ng lipi ni Levi, sapagkat tig-iisang tungkod ang para sa bawat pinuno ng kanilang angkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “sapagkat isang tungkod ang para sa pinuno ng sambahayan ng kanilang mga ninuno.” Maaaring unawain nang distributibo ang pariralang Hebreo: bawat pinuno ng sambahayan ng mga ninuno ay kinakatawan ng isang tungkod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: At
  rationale: Ipinagpapatuloy ng pang-ugnay ang naunang tagubilin; walang tuwirang katumbas sa Tagalog ang pananda ng layon na אֵת.
- source_word: שֵׁם אַהֲרֹן
  choice: ang pangalan ni Aaron
  rationale: Natural at tuwirang pahayag sa Tagalog para sa pangalang iuukit o isusulat sa tungkod.
- source_word: תִּכְתֹּב
  choice: isulat mo
  rationale: Ang Qal imperfect na pangalawang panauhang panlalaki at isahan ay utos sa kontekstong ito; natural sa Tagalog ang tahasang pautos.
- source_word: עַל מַטֵּה לֵוִי
  choice: sa tungkod ng lipi ni Levi
  rationale: Ang מַטֶּה ay konkretong tungkod na kumakatawan sa isang lipi. Idinagdag ang “lipi” upang maging malinaw na ang Levi rito ay tumutukoy sa liping kinakatawan ng tungkod.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan ng utos at nagpapanatili ng marangal ngunit madaling maunawaang himig.
- source_word: מַטֶּה אֶחָד
  choice: iisang tungkod
  rationale: Binibigyang-diin ng אֶחָד na isa lamang ang tungkod para sa bawat kinatawang pinuno.
- source_word: לְ/רֹאשׁ בֵּית אֲבוֹתָם
  choice: para sa bawat pinuno ng kanilang angkan
  rationale: Ang רֹאשׁ ay pinuno o ulo ng yunit ng pagkakamag-anak, at ang בֵּית אָבוֹת ay angkan o sambahayang nagmula sa iisang ninuno. Ang distributibong “bawat” ay natural ayon sa konteksto ng pagkuha ng tig-iisang tungkod.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “angkan” sa halip na literal na “bahay ng mga ama” upang natural na maipahayag ang yunit ng pagkakamag-anak. Nilinaw ng “lipi ni Levi” ang kinakatawang pangkat nang hindi binabago ang diwa.
