  text: וַ/יַּנַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֹּ֖ת לִ/פְנֵ֣י יְהוָ֑ה בְּ/אֹ֖הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: tl
  text: Kaya inilagay ni Moises ang mga tungkod sa harap ni Yahweh, sa tolda ng patotoo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pamalo.” Ang salitang Hebreo na מַטּוֹת ay tumutukoy rito sa mga pisikal na tungkod na kumakatawan sa mga lipi.
    reason: lexical_alternative
  - marker: b
    text: O “sa tabernakulo ng patotoo.” Sa literal, “sa tolda ng patotoo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: inilagay
  rationale: Ang pandiwang נוח sa anyong Hiphil ay tumutukoy sa paglalagay o pagpapahimlay ng isang bagay. Likas at malinaw sa makabagong Filipino ang “inilagay.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakasanayang anyo ng pangalang ito sa Filipino.
- source_word: הַמַּטֹּת
  choice: ang mga tungkod
  rationale: Bagaman maaaring mangahulugan ang מַטֶּה ng “tungkod,” “pamalo,” o “lipi,” mga pisikal na tungkod na kumakatawan sa mga lipi ang tinutukoy rito. Pinakamalinaw at pinakanatural ang “mga tungkod.”
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Pinananatili nito ang konkretong diwa ng pagiging nasa harapan, at maaari ring magpahiwatig ng paglalagay sa presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בְּאֹהֶל
  choice: sa tolda
  rationale: Literal na “tolda” ang אֹהֶל. Pinananatili ng saling ito ang larawan sa Hebreo, samantalang ang “tabernakulo” ay isang tradisyonal ngunit mas interpretibong katawagan.
- source_word: הָעֵדֻת
  choice: ng patotoo
  rationale: Ang עֵדוּת ay tumutukoy sa patotoo, lalo na sa tipang patotoo na kaugnay ng mga tapyas at santuwaryo. Pinananatili ng “patotoo” ang terminolohiya at ugnayang ito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalang יְהוָה ang mismong nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “ang PANGINOON.”
- issue: Kahulugan ng “tolda ng patotoo”
  choice: Panatilihin ang literal na katawagang “tolda ng patotoo”
  alternative: tabernakulo ng patotoo; tolda ng tipan
  rationale: Hindi tahasang nilulutas ng salin kung ang “patotoo” ay metonimiya para sa mga tapyas, sa tipan, o sa banal na presensiyang kaugnay ng mga ito. Pinananatili nito ang saklaw at teolohikal na ugnayan ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda” bilang karaniwang salitang tapat sa konkretong larawan ng Hebreo, habang inilagay sa talababa ang tradisyonal na “tabernakulo.”
