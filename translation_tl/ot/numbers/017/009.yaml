lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang pandiwang דּבר kasama ng waw-consecutive ay nagpapatuloy sa salaysay. Pinananatili ng “nagsalita” ang kaibhan nito sa kasunod na אמר (“sinabi”).
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang likas na panandang Filipino para sa taong pinatutungkulan ng pagsasalita; “Moises” ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: לֵאמֹר
  choice: at sinabi niya
  rationale: Ipinakikilala ng infinitibong ito ang tuwirang pahayag na kasunod. Ang “at sinabi niya” ay natural sa modernong Filipino at pinananatili ang pormulang “nagsalita … na sinasabi” nang hindi gumagamit ng alanganing parirala.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang karaniwang akademikong transliterasyon habang inilalagay sa talababa ang lehitimong alternatibong anyo.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang dalawang magkaibang pandiwang “nagsalita” at “sinabi” upang maipakita ang pagkakaiba ng דּבר at אמר nang hindi nagiging mekanikal ang pangungusap.
