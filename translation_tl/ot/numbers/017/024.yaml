  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: tl
  text: Kaya inilabas ni Moises mula sa harapan ni Yahweh ang lahat ng tungkod sa lahat ng Israelita.[a] Nakita nila ang mga iyon,[b] at kinuha ng bawat isa ang kanyang tungkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa lahat ng mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “Tiningnan nila ang mga iyon.” Maaaring tumukoy ang pandiwa sa simpleng pagkakita o sa sadyang pagtingin sa mga tungkod.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: inilabas
  rationale: Ang anyong Hiphil ng יצא ay may diwang sanhi, ‘ilabas’ o ‘dalhin palabas’; malinaw at likas sa Tagalog ang ‘inilabas.’
- source_word: הַמַּטֹּת
  choice: lahat ng tungkod
  rationale: Tumutukoy rito ang מַטֶּה sa mga pisikal na tungkod na inilagay sa harap ni Yahweh, hindi sa ‘lipi.’
- source_word: מִלִּפְנֵי יְהוָה
  choice: mula sa harapan ni Yahweh
  rationale: Pinananatili nito ang kongkretong pananalitang Hebreo na ‘mula sa harap ni Yahweh’ at ang pahiwatig na nasa kanyang presensiya ang mga tungkod.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: sa lahat ng Israelita
  rationale: Ito ang likas na makabagong Tagalog para sa karaniwang pambansang katawagang ‘lahat ng mga anak ni Israel’; ibinigay sa talababa ang mas literal na anyo.
- source_word: וַיִּרְאוּ
  choice: Nakita nila ang mga iyon
  rationale: Ang ראה ay pangunahing nangangahulugang ‘makita.’ Tahasang ibinalik ang tinutukoy na mga tungkod para sa kalinawan sa Tagalog, habang kinikilala sa talababa ang posibleng diwang ‘tiningnan’ o ‘sinuri.’
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: kinuha ng bawat lalaki ang kanyang tungkod
  rationale: Ang אִישׁ ay distributibo rito, kaya pinananatili ng ‘bawat lalaki’ ang singular at panlalaking anyo ng Hebreo; inuulit ang ‘tungkod’ para sa pagkakapare-pareho.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Israelita’ sa pangunahing teksto para sa likas na daloy, ngunit pinanatili sa talababa ang literal na Hebreong idyoma. Hindi pinalitan ng interpretasyon ang payak na pagkakasunod-sunod ng mga kilos.
