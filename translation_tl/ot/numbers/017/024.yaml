- from: Kaya inilabas ni Moises ang lahat ng tungkod mula sa harapan ni Yahweh at dinala ang mga iyon sa lahat ng Israelita.[a] Nakita nila ang mga iyon,[b] at kinuha ng bawat lalaki ang kanyang tungkod.
