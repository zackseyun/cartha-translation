base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: tl
  text: At ilalagay mo ang mga iyon sa tolda ng pagkikita, sa harap ng Patotoo[a], kung saan ako makikipagtagpo sa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng patotoo ng tipan.” Malamang na ang “Patotoo” ay tumutukoy sa patotoo ng tipan na kaugnay ng mga tapyas na bato sa santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: O “kung saan ako magpapakilala sa inyo” o “kung saan ako magtatakdang makipagtagpo sa inyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: At ilalagay mo ang mga iyon
  rationale: Ang Hiphil na pandiwa na may hulaping 3mp ay nagsasaad na ipalalagay ang mga tungkod; natural at tuwiran sa modernong Tagalog ang “ilalagay mo ang mga iyon.”
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa tolda ng pagkikita
  rationale: Pinananatili ang malinaw na kahulugan ng karaniwang katawagan sa santuwaryo, nang hindi ginagawang pantanging pangalan sa pamamagitan ng malalaking titik.
- source_word: לִפְנֵי הָעֵדוּת
  choice: sa harap ng Patotoo
  rationale: Tumpak na isinasalin ng “sa harap ng” ang לִפְנֵי. Pinananatili ng “Patotoo” ang sadyang hindi tiyak na saklaw ng הָעֵדוּת sa halip na tukuyin agad bilang mga tapyas o kaban.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: kung saan ako makikipagtagpo
  rationale: Ang Niphal ng יעד sa kontekstong ito ay tumutukoy sa itinakdang pakikipagtagpo; likas sa Tagalog ang “makikipagtagpo” at pinananatili ng “kung saan” ang lokatibong diwa.
- source_word: לָכֶם
  choice: sa inyo
  rationale: Sa idyomang kasama ng יעד, likas na ipinahahayag sa Tagalog bilang pakikipagtagpo “sa inyo,” na tumutukoy sa pangkat na kinakausap.
- source_word: שָׁמָּה
  choice: nakapaloob sa “kung saan”
  rationale: Ang lokatibong pang-abay ay likas nang nasasaklaw ng “kung saan,” kaya hindi na inuulit bilang “doon.”
theological_decisions:
- issue: Tinutukoy ng “Patotoo”
  choice: Panatilihin ang literal na “Patotoo” nang hindi tinutukoy kung ito mismo ang mga tapyas, ang kaban, o ang mas malawak na saksi ng tipan.
  alternative: “mga tapyas ng Patotoo,” “kaban ng Patotoo,” o “saksi ng tipan”
  rationale: Hindi ganap na nililinaw ng Hebreo ang tuwirang tinutukoy sa talatang ito. Pinananatili ng salin ang tunay na kalabuan at iniiwasang magpasok ng interpretatibong paglilinaw sa pangunahing teksto.
- issue: Diwa ng אִוָּעֵד
  choice: “makikipagtagpo”
  alternative: “magpapakilala” o “magtatakda ng pakikipagtagpo”
  rationale: Sa konteksto ng santuwaryo, ang pinakadirektang diwa ay ang pakikipagtagpo ng Diyos sa mga kinakausap; inilalagay sa talababa ang iba pang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “tolda ng pagkikita” bilang transparent na katawagan sa santuwaryo at “Patotoo” upang mapanatili ang sadyang kalabuan ng Hebreo. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto at tumutugma sa mga talababa.
