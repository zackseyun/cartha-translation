revisions:
- from: Ang bawat lumalapit—lumalapit sa tabernakulo ni Yahweh—ay mamamatay. Mauubos ba kaming lahat sa kamatayan?[a]
  to: Ang bawat isa na lumalapit—na lumalapit sa tabernakulo ni Yahweh—ay mamamatay. Mauubos ba kaming lahat?[a]
