base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: tl
  text: Ang bawat isa na lumalapit—na lumalapit sa tabernakulo ni Yahweh—ay mamamatay. Mauubos ba kaming lahat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mamamatay ba kaming lahat?” Magkaiba ang pandiwang Hebreo rito at ang naunang “mamamatay”; maaaring ipahiwatig nito ang lubusang pagkaubos o pagkalipol, sa halip na basta ulitin ang parehong pandiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: ang bawat
  rationale: 'Ipinahahayag nito ang saklaw na walang itinatangi: sinumang lumalapit. Likas sa modernong Tagalog ang “ang bawat” sa ganitong pangkalahatang pahayag.'
- source_word: הַקָּרֵב הַקָּרֵב
  choice: lumalapit—lumalapit
  rationale: Pinanatili ang di-pangkaraniwang pag-uulit ng participle upang maihatid ang diin at pangamba ng nagsasalita, sa halip na pakinisin ito.
- source_word: מִשְׁכַּן
  choice: tabernakulo
  rationale: Ito ang kinikilalang terminong Tagalog para sa santuwaryong tolda sa ilang; mas tiyak ito rito kaysa sa pangkalahatang “tahanan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinalin ang banal na pangalang nakasulat sa Hebreo, sa halip na palitan ng isang titulo.
- source_word: יָמוּת
  choice: mamamatay
  rationale: 'Malinaw na ipinahahayag ng imperfect ang kahihinatnan ng paglapit: kamatayan.'
- source_word: תַּמְנוּ לִגְוֹעַ
  choice: mauubos ba kaming lahat sa kamatayan?
  rationale: Pinagsasama ng parirala ang diwa ng pagkalipol o pagkaubos (תמם) at pagkamatay (גוע). Pinananatili ng salin ang dalawang sangkap nang hindi basta inuulit ang “mamamatay.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan at hindi bilang pamagat.
- issue: Saklaw ng babala tungkol sa paglapit
  choice: ang bawat lumalapit
  alternative: sinumang lumalapit nang hindi nararapat
  rationale: Hindi tahasang sinasabi sa mismong talata ang “nang hindi nararapat.” Hindi ito idinagdag, upang mapanatili ang malawak at takot na pananalita ng mga Israelita sa konteksto.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang mariing pag-uulit na “lumalapit—lumalapit,” kahit hindi ito karaniwang ayos sa Tagalog, sapagkat kapansin-pansin din ang pag-uulit sa Hebreo. Ginamit ang “tabernakulo” bilang pamilyar at tiyak na terminong panrelihiyon.
