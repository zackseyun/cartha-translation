  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: tl
  text: Kaya kinuha iyon[a] ni Aaron, gaya ng sinabi ni Moises, at tumakbo siya sa gitna ng kapulungan.[b] At masdan, nagsimula na ang salot sa bayan. Kaya inilagay niya ang insenso[c] at nagsagawa ng pagbabayad-sala para sa bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang binanggit sa Hebreo ang bagay na kinuha; mauunawaan ito mula sa naunang talata.
    reason: implied_object
  - marker: b
    text: Maaari ring “kongregasyon.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ibinigay/inilagay niya ang insenso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha iyon
  rationale: Ang pandiwa ay payak na “kinuha.” Ipinahihiwatig ng konteksto sa naunang talata ang bagay na kinuha, kaya ginamit ang “iyon” upang maging likas sa Tagalog nang hindi labis na tinutukoy ang bagay.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: gaya ng sinabi ni Moises
  rationale: Ang דִּבֶּר ay “nagsalita/nagsabi,” hindi tahasang “nag-utos.” Pinananatili ng salin ang payak na kahulugan at ang tungkuling pautos na makikita sa konteksto.
- source_word: וַיָּרָץ אֶל תּוֹךְ הַקָּהָל
  choice: tumakbo siya sa gitna ng kapulungan
  rationale: Tuwirang isinasalin ang רוץ bilang “tumakbo,” ang תּוֹךְ bilang “gitna,” at ang קָהָל bilang “kapulungan,” isang malinaw at hindi labis na panrelihiyong tawag sa nagkakatipong bayan.
- source_word: וְהִנֵּה
  choice: At masdan
  rationale: Pinananatili ng “masdan” ang bigla at mariing pagtawag-pansin ng הִנֵּה. Bahagya itong marangal sa rehistro ngunit malinaw pa rin sa makabagong mambabasa.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: nagsimula na ang salot sa bayan
  rationale: Sa konteksto, ang נֶגֶף ay salot na nagdudulot ng kamatayan. Ipinahahayag ng “nagsimula na” na nagaganap na ito pagdating ni Aaron; ang בָעָם ay likas na “sa bayan.”
- source_word: וַיִּתֵּן אֶת הַקְּטֹרֶת
  choice: inilagay niya ang insenso
  rationale: Ang נתן ay literal na “nagbigay/naglagay.” Pinipili ang “inilagay” upang ilarawan ang kongkretong kilos nang hindi agad pinapalitan ng mas interpretatibong “inihandog.”
- source_word: וַיְכַפֵּר עַל הָעָם
  choice: nagsagawa ng pagbabayad-sala para sa bayan
  rationale: Sa kontekstong pangpari at panritwal, ang כפר ay tumutukoy sa pagsasagawa ng pagbabayad-sala. Pinananatili nito ang bigat ng terminong teolohikal nang hindi itinatakda ang mekanismo nang higit sa sinasabi ng talata.
theological_decisions:
- issue: Paglilipat ng pandiwang panritwal na כפר
  choice: nagsagawa ng pagbabayad-sala para sa bayan
  alternative: nagsagawa ng pagtubos para sa bayan
  rationale: Mas tuwirang tumutukoy ang “pagbabayad-sala” sa gawaing pangpari na humaharap sa sala at humahadlang sa hatol. Ang “pagtubos” ay maaari ring gamitin ngunit maaaring magpahiwatig ng paglaya o pagbili na hindi tahasang tinutukoy rito.
- issue: Paglilipat ng קָהָל
  choice: kapulungan
  alternative: kongregasyon
  rationale: Ang “kapulungan” ay likas at malinaw na tumutukoy sa nagkakatipong pamayanan ng Israel, habang ang “kongregasyon” ay maaaring magpasok ng mas tiyak na makabagong samahang pansimbahan.
translation_notes:
  register: Makabago at dignidad na Filipino ang ginamit. Pinanatili ang bahagyang maringal na “masdan” upang maipakita ang biglaang diin ng Hebreong הִנֵּה. Ang “pagbabayad-sala” ay teknikal ngunit malawak na nauunawaan sa wikang biblikal; hindi ito pinalitan ng paliwanag na magtatakda ng isang partikular na doktrinal na mekanismo.
