source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: tl
  text: Sinabi ni Moises kay Aaron, “Kunin mo ang insensaryo[a], lagyan mo ito ng apoy mula sa altar, at maglagay ka rito ng insenso. Pumunta ka agad sa kapulungan at magbayad-sala para sa kanila, sapagkat lumabas na ang poot mula sa harapan ni Yahweh[b]; nagsimula na ang salot.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sisidlan ng baga.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa harapan ni Yahweh,” ibig sabihin, mula sa kaniyang presensiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: ang insensaryo
  rationale: Tumutukoy sa sisidlang ginagamit sa pagdadala ng mga baga at pagsusunog ng insenso sa paglilingkod ng mga pari. Ang “insensaryo” ang malinaw at maikli sa kontekstong ito; inilagay sa talababa ang mas literal na alternatibo.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: lagyan mo ito ng apoy mula sa altar
  rationale: Pinananatili ang altar bilang pinagmulan ng apoy, ngunit gumagamit ng likas na pariralang Filipino para sa paglalagay nito sa sisidlan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwan at tiyak na katawagan sa Filipinong panrelihiyon para sa insensong sinusunog sa ritwal.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: Dalhin mo ito agad
  rationale: Ang anyo ng pandiwa sa konteksto ay tumutukoy sa mabilis na pagdadala ng insensaryo sa kapulungan. Ipinahahayag ng “agad” ang pagmamadali.
- source_word: הָעֵדָה
  choice: kapulungan
  rationale: Ipinahahayag ang Israel bilang sama-samang nagkakatipong pamayanan, hindi lamang isang di-pormal na grupo.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: magsagawa ka ng pagtubos para sa kanila
  rationale: Pinananatili ang natatanging ritwal at teolohikal na diwa ng כפר nang hindi ipinapaliwanag o nililimitahan sa isang partikular na teorya ng pagtubos.
- source_word: הַקֶּצֶף
  choice: ang poot
  rationale: Ang “poot” ay angkop sa mabigat na diwa ng banal na galit at hatol sa konteksto.
- source_word: מִלִּפְנֵי יְהוָה
  choice: mula sa harapan ni Yahweh
  rationale: Pinananatili ang konkretong larawang Hebreo ng paglabas mula sa harapan o presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na nakasulat sa tekstong Hebreo.
- source_word: הֵחֵל הַנָּגֶף
  choice: nagsimula na ang salot
  rationale: Sa konteksto, ang נֶגֶף ay isang nakamamatay na salot na nagsimula nang humampas sa bayan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan nang hindi pinapalitan ng titulo.
- issue: Kahulugan ng כפר sa kontekstong pangpari
  choice: magsagawa ng pagtubos para sa kanila
  alternative: magsagawa ng pagpapalubag-loob para sa kanila
  rationale: Ang “pagtubos” ay nagpapanatili sa malawak na ritwal-teolohikal na puwersa ng salita at hindi nagpapasya nang higit sa sinasabi ng teksto kung paano gumagana ang ritwal.
- issue: Paglabas ng banal na poot
  choice: lumabas na ang poot mula sa harapan ni Yahweh
  alternative: nanggaling na kay Yahweh ang poot
  rationale: Pinananatili ang kakaibang larawan at tensiyon ng orihinal na pahayag sa halip na gawing abstraktong paliwanag lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapulungan,” “pagtubos,” at “poot” upang mapanatili ang pormal at ritwal na bigat ng talata, habang ginawang likas ang mga utos sa Filipino. Ang lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
