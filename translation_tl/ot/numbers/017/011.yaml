revisions:
- from: Sinabi ni Moises kay Aaron, “Kunin mo ang insensaryo[a], lagyan mo ito ng apoy mula sa altar, at lagyan ng insenso. Dalhin mo ito agad sa kapulungan at magsagawa ka ng pagtubos para sa kanila, sapagkat lumabas na ang poot mula sa harapan ni Yahweh[b]; nagsimula na ang salot.”
  to: Sinabi ni Moises kay Aaron, “Kunin mo ang insensaryo[a], lagyan mo ito ng apoy mula sa altar, at maglagay ka rito ng insenso. Pumunta ka agad sa kapulungan at magbayad-sala para sa kanila, sapagkat lumabas na ang poot mula sa harapan ni Yahweh[b]; nagsimula na ang salot.”
  rationale: Pinalitan ang “pagtubos” ng “magbayad-sala” upang maipahayag nang mas tumpak ang ritwal na kahulugan ng כפר. Nilinaw ang paglalagay ng insenso at ibinalik ang simpleng agarang pagpunta sa kapulungan, habang pinanatili ang larawan ng poot na lumalabas mula sa harapan ni Yahweh.
