review_pass:
  verdict: revise
  source_fidelity: 'Ang pangkalahatang diwa ay tapat sa Hebreo: ang insensaryo, apoy mula sa altar, insenso, kapulungan, poot ni Yahweh, at nagsisimulang salot ay naipahayag. Gayunman, ang “pagtubos” ay karaniwang tumutukoy sa redemption/ransom at hindi sapat na katumbas ng ritwal na כפר sa talatang ito. Ang “Dalhin mo ito” ay posible sa konteksto ngunit mas higit na tahasang pagtukoy sa sisidlan kaysa sa simpleng utos na pumunta nang mabilis.'
  naturalness: Marangal at madaling basahin ang draft, ngunit hindi ganap na natural ang magkahiwalay na “lagyan mo ito ... at lagyan ng insenso,” dahil nawawala ang malinaw na bagay ng ikalawang pandiwa. Mas malinaw ang “maglagay ka rito ng insenso.”
  terminology: Ang “insensaryo,” “altar,” “kapulungan,” “poot,” “salot,” at “Yahweh” ay angkop. Para sa כפר, mas tumpak at likas sa pormal na Filipino ang “magbayad-sala para sa kanila,” na pinananatili ang ritwal na diwa nang hindi nagpapataw ng partikular na teoryang doktrinal.
  issues:
  - severity: medium
    issue: Ang “magsagawa ka ng pagtubos para sa kanila” para sa וְכַפֵּר עֲלֵיהֶם.
    rationale: Ang “pagtubos” sa modernong Filipino ay karaniwang pagliligtas o ransom/redemption. Ang כפר rito ay gawaing pangritwal upang tugunan ang banal na poot; “magbayad-sala” ay mas malapit na katumbas.
  - severity: low
    issue: Hindi malinaw ang “at lagyan ng insenso.”
    rationale: Walang hayag na bagay ang ikalawang pandiwa. Ang “at maglagay ka rito ng insenso” ay malinaw na tumutukoy sa insensaryo at maayos na Filipino.
  - severity: low
    issue: Ang “Dalhin mo ito agad” ay mas espesipiko kaysa sa Hebreong utos na pumunta nang mabilis.
    rationale: Ipinahihiwatig ng konteksto na dadalhin ni Aaron ang insensaryo, ngunit ang pangunahing utos ay agarang pagpunta sa kapulungan. Ang “Pumunta ka agad” ay mas malapit sa anyo ng pinagmulan.
  revised_text: Sinabi ni Moises kay Aaron, “Kunin mo ang insensaryo[a], lagyan mo ito ng apoy mula sa altar, at maglagay ka rito ng insenso. Pumunta ka agad sa kapulungan at magbayad-sala para sa kanila, sapagkat lumabas na ang poot mula sa harapan ni Yahweh[b]; nagsimula na ang salot.”
