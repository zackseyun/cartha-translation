revisions:
- from: At mangyayari na ang tungkod ng lalaking pipiliin ko ay sisibol, at patitigilin ko ang mga reklamo ng mga anak ni Israel laban sa akin—ang mga ibinubulong nila laban sa inyo.
  to: At mangyayari na ang tungkod ng lalaking pipiliin ko ay sisibol, at patitigilin ko ang mga reklamo ng mga anak ni Israel laban sa akin, na patuloy nilang idinadaing laban sa inyo.
  rationale: Pinalitan ang “ibinubulong” ng “patuloy nilang idinadaing” upang maipahayag ang duratibong diwa at negatibong tono ng מַלִּינִם nang hindi nagdaragdag ng diwang pagsasalitang pabulong. Pinanatili ang natitirang mga pagpili ng salin, kabilang ang dalawang magkaibang direksiyon ng reklamo sa sugnay.
