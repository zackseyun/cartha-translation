base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: tl
  text: At mangyayari na ang tungkod ng lalaking pipiliin ko ay sisibol, at patitigilin ko ang mga reklamo ng mga anak ni Israel laban sa akin, na patuloy nilang idinadaing laban sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: At mangyayari na
  rationale: Pinananatili ang pormulang nagpapakilala sa isang mangyayari sa hinaharap sa natural at marangal na Tagalog.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: ang lalaking pipiliin ko
  rationale: Tumutukoy ito sa lalaking pinuno na kinakatawan ng bawat tungkod; malinaw na ipinahahayag ng parirala ang pagpili ng Diyos.
- source_word: מַטֵּהוּ
  choice: ang tungkod
  rationale: Ang מַטֶּה ay tungkod o baston; “tungkod” ang pinakanatural sa kontekstong ito at maaari ring kumatawan sa lipi.
- source_word: יִפְרָח
  choice: sisibol
  rationale: Saklaw ng pandiwa ang pagsibol o pamumulaklak. Pinili ang “sisibol” dahil ito ang unang tanda ng buhay, samantalang ang mas ganap na pamumulaklak ay inilalarawan sa kasunod na talata.
- source_word: וַהֲשִׁכֹּתִי
  choice: patitigilin ko
  rationale: Ipinahahayag ng anyong Hiphil ang pagpapahupa o pagpapatigil; tuwiran at malinaw ang “patitigilin ko.”
- source_word: מֵעָלַי
  choice: laban sa akin
  rationale: Sa konteksto, ang mga reklamo ay pasan o nakatuon laban sa Diyos. Ang “laban sa akin” ay natural na naghahatid ng ganitong diwang adversatibo.
- source_word: תְּלֻנּוֹת
  choice: mga reklamo
  rationale: Karaniwang modernong salita para sa pagdaing o pagrereklamo ng bayan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang tahasang pamilyang pananalita ng Hebreo, na sa konteksto ay kolektibong tumutukoy sa sambayanang Israel.
- source_word: מַלִּינִם
  choice: ibinubulong
  rationale: Ipinahahayag ang nagpapatuloy at negatibong pagrereklamo o pag-ungol, at iniiwasang ulitin lamang ang pangngalang “reklamo.”
- source_word: עֲלֵיכֶם
  choice: laban sa inyo
  rationale: Ipinakikita ng pang-ukol na ang mapanlabang pagrereklamo ay nakatuon kina Moises at Aaron.
theological_decisions:
- issue: Pagpapanatili sa pamilyang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanang Israel
  rationale: Pinananatili ang pormal na larawan ng pinagmulang pamilya nang hindi ikinakaila na kolektibong tumutukoy ito sa buong bayan.
- issue: Ugnayan ng מֵעָלַי sa mga reklamo
  choice: mga reklamo ... laban sa akin
  alternative: aalisin ko sa ibabaw ko ang mga reklamo / patitigilin ko ang mga reklamo nang hindi tahasang sinasabing “laban sa akin”
  rationale: Ang literal na larawan ay pagpapahupa o pag-aalis ng mga reklamong nasa ibabaw ng Diyos; sa Tagalog, “laban sa akin” ang malinaw na kontekstuwal na diwa, habang ang kasunod na sugnay ay nagpapanatili na ang aktuwal na pagbubulong ay laban kina Moises at Aaron.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang “mga anak ni Israel” bilang pormal na ekspresyong Hebreo. Gumamit ng gitling na mahaba upang malinaw na iugnay ang huling sugnay sa mga reklamong ibinubulong laban kina Moises at Aaron.
