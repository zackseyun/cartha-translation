    rationale: Ang pandiwa ay tumutukoy sa patuloy na pagrereklamo, pag-ungol, o pagdaing; ang “ibinubulong” ay nagdaragdag ng diwang lihim o pabulong na wala sa teksto.
  revised_text: At mangyayari na ang tungkod ng lalaking pipiliin ko ay sisibol, at patitigilin ko ang mga reklamo ng mga anak ni Israel laban sa akin, na patuloy nilang idinadaing laban sa inyo.
