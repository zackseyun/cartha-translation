  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: tl
  text: At nang magtipon ang sambayanan laban kina Moises at Aaron, bumaling sila patungo sa tolda ng pagkikita. At narito, tinakpan ito ng ulap[a], at lumitaw ang kaluwalhatian ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tinakpan ito”; ang “ito” ay pinakamalamang na tumutukoy sa tolda ng pagkikita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהִקָּהֵל
  choice: At nang magtipon
  rationale: Ang וַיְהִי ay nagsusulong sa salaysay, samantalang ang בְּ na may infinitive construct ay nagbibigay ng panahong kalagayan. Likas sa modernong Tagalog ang pinagsamang “At nang magtipon” kaysa sa literal ngunit mabigat na “At nangyari, nang magtipon.”
- source_word: הָעֵדָה
  choice: ang sambayanan
  rationale: Tumutukoy ito sa sama-samang pamayanan ng Israel. Ang “sambayanan” ay malinaw, marangal, at hindi limitado sa kongregasyong panrelihiyon sa makabagong gamit.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: laban kina Moises at Aaron
  rationale: Sa konteksto, ang עַל ay nagpapahayag ng pagsalungat. Ang “kina” ang likas na pananda sa dalawang pangalang pantangi sa Tagalog.
- source_word: וַיִּפְנוּ אֶל
  choice: humarap sila sa
  rationale: Ipinahihiwatig ng פנה ang pisikal na pagbaling o pagharap. Ang “humarap” ay natural at hindi nagdaragdag ng di-tiyak na motibo.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagkikita
  rationale: Tuwirang pinananatili nito ang dalawang sangkap ng parirala at ang tungkulin ng santuwaryo bilang lugar ng pakikipagtagpo, nang hindi gumagamit ng mas interpretatibong “tabernakulo.”
- source_word: וְהִנֵּה
  choice: At masdan
  rationale: Pinananatili ng “masdan” ang dramatiko at pantawag-pansing lakas ng הִנֵּה sa isang marangal na rehistro.
- source_word: כִסָּהוּ הֶעָנָן
  choice: tinakpan iyon ng ulap
  rationale: Ang hulaping panlalaking isahan sa כִסָּהוּ ay kinakatawan ng “iyon.” Pinananatili ang “ulap” bilang tahasang tagaganap ng pandiwa.
- source_word: וַיֵּרָא
  choice: lumitaw
  rationale: Ang Niphal ng ראה ay nagsasaad na naging nakikita o nagpakita. Ang “lumitaw” ay malinaw at hindi nagpapahiwatig na ang kaluwalhatian ay aktibong nagpakita ng sarili sa paraang lampas sa teksto.
- source_word: כְּבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Pinananatili ng “kaluwalhatian” ang bigat ng כָּבוֹד bilang nakikitang pagpapahayag ng banal na karilagan, at ginagamit ang personal na pangalan na nasa Hebreo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalang יְהוָה ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay transliterasyong higit na tumutugma sa pinagmulang pangalan kaysa sa pagpapalit nito ng isang titulo.
- issue: Tinutukoy ng hulapi sa כִסָּהוּ
  choice: ang tolda ng pagkikita
  alternative: ang sambayanan o ang buong tanawin
  rationale: Ang pinakamalapit na pangngalang panlalaking isahan ay אֹהֶל, “tolda,” kaya ito ang pinakanatural na tinutukoy. Gayunman, inilalagay sa talababa ang paglilinaw dahil hindi inuulit ng Hebreo ang pangngalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sambayanan” para sa kolektibong pamayanan ng Israel, “tolda ng pagkikita” para sa pormal na pagtutumbas ng אֹהֶל מוֹעֵד, at “masdan” upang mapanatili ang solemne at dramatikong diin ng הִנֵּה.
