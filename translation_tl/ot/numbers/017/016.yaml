lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive kasama ng דב״ר ay nagpapatuloy sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, nagsalita” at napapanatili nito ang diwa ng pandiwang pagsasalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin sa baybay na “Yahweh” ang Tetragrammaton upang panatilihin ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Karaniwang panandang Tagalog ito para sa direksiyon ng pagsasalita tungo sa isang taong may pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalang Hebreo na מֹשֶׁה sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang Hebreong pormula na nagpapakilala sa tuwirang pananalitang susunod, nang hindi inuunahan ang nilalaman nito.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay mas malapit na transliterasyon at pinananatili ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormal na pambungad sa banal na pahayag; ang “na sinasabi” ay bahagyang pormal ngunit angkop sa paulit-ulit na Hebreong pormula.
