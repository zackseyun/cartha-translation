id: NUM.17.25
reference: Numbers 17:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Moises, “Ibalik mo ang tungkod ni Aaron sa harap ng Patotoo[a], upang ingatan bilang tanda para sa mga anak ng paghihimagsik[b]. Sa gayon, wawakasan mo ang kanilang pagrereklamo laban sa akin, at hindi sila mamamatay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Patotoo” ay malamang na tumutukoy sa patotoo ng tipan na kaugnay ng kaban; maikli rin ang mismong pananalita sa Hebreo.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “para sa mga mapaghimagsik” o “para sa mga rebeldeng anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: הָשֵׁב
  choice: Ibalik mo
  rationale: Ang Hiphil na pautos ay nagsasaad na ibalik ni Moises ang tungkod sa dati nitong kinalalagyan.
- source_word: מַטֵּה
  choice: tungkod
  rationale: Karaniwan at malinaw na salitang Filipino para sa staff o rod sa kontekstong ito.
- source_word: לִפְנֵי הָעֵדוּת
  choice: sa harap ng Patotoo
  rationale: Pinananatiling maikli ang Hebreong parirala at hindi idinaragdag sa pangunahing teksto ang kaban na ipinahihiwatig ng konteksto.
- source_word: לְמִשְׁמֶרֶת
  choice: upang maingatan iyon
  rationale: Ipinapahayag ang layuning panatilihin o ingatan ang tungkod.
- source_word: לְאוֹת
  choice: bilang tanda
  rationale: Likas na katumbas ng אוֹת bilang nakikitang tanda o palatandaan.
- source_word: לִבְנֵי מֶרִי
  choice: para sa mga anak ng paghihimagsik
  rationale: Pinananatili ang kapansin-pansing Hebreong idyomang literal na ‘mga anak ng paghihimagsik,’ habang nagbibigay ng mas natural na alternatibo sa talababa.
- source_word: וּתְכַל
  choice: Sa gayon, matitigil mo
  rationale: Ipinahihiwatig ng Hiphil ng כלה ang pagpapahinto o pagwawakas; ang ‘sa gayon’ ay nagpapakita ng layunin o bunga nang hindi labis na nilulutas ang ugnayang sintaktiko.
- source_word: תְּלוּנֹּתָם
  choice: ang kanilang pagrereklamo
  rationale: Napananatili ang paulit-ulit na tema ng pagrereklamo ng bayan sa ilang salaysay sa ilang, at mas natural ito sa Filipino kaysa sa literal na pangmaramihang anyo.
- source_word: מֵעָלַי
  choice: laban sa akin
  rationale: Sa pariralang ito, ang mga reklamo ay nakatuon laban kay Yahweh.
- source_word: וְלֹא יָמֻתוּ
  choice: at hindi sila mamamatay
  rationale: Pinananatili ang koordinasyong Hebreo at ang inaasahang bunga na maiiwasan ang kanilang kamatayan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa Hebreo ang Tetragrammaton mismo, kaya pinananatili ang banal na pangalan sa transliterasyong Yahweh.
- issue: Idyomang may kasarian sa לִבְנֵי מֶרִי
  choice: mga anak ng paghihimagsik
  alternative: mga mapaghimagsik; mga rebeldeng anak
  rationale: Pinananatili ang tunay na anyong pampamilya ng idyomang Hebreo sa pangunahing teksto, nang hindi ito agad pinapantay sa isang mas pangkalahatang katawagan.
- issue: Tinutukoy ng הָעֵדוּת
  choice: Patotoo
  alternative: kaban ng Patotoo; dokumento ng tipan
  rationale: Hindi tahasang binabanggit ng Hebreo ang kaban o dokumento sa pariralang ito; kaya pinananatili ang maikling katawagan at ipinaliliwanag ang konteksto sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga sadyang maikli at kapansin-pansing katawagang Hebreo kung mahalaga ang anyo nito, ngunit ginawang natural ang daloy ng utos at layunin sa Filipino.
