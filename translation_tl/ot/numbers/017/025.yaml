revisions:
- from: Sinabi ni Yahweh kay Moises, “Ibalik mo ang tungkod ni Aaron sa harap ng Patotoo[a], upang maingatan iyon bilang tanda para sa mga anak ng paghihimagsik[b]. Sa gayon, matitigil mo ang kanilang pagrereklamo laban sa akin, at hindi sila mamamatay.”
  to: At sinabi ni Yahweh kay Moises, “Ibalik mo ang tungkod ni Aaron sa harap ng Patotoo[a], upang ingatan bilang tanda para sa mga anak ng paghihimagsik[b]. Sa gayon, wawakasan mo ang kanilang pagrereklamo laban sa akin, at hindi sila mamamatay.”
  rationale: Idinagdag ang “At” upang katawanin ang pambungad na Hebreong pangatnig. Pinalitan ang “matitigil mo” ng “wawakasan mo” upang malinaw na maipahayag ang tiyak na pagpapahinto na ipinahihiwatig ng Hiphil na וּתְכַל. Walang binagong kahulugan o idinagdag na pagpapakahulugang doktrinal.
