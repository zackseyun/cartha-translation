base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: tl
  text: Sabihin mo kay Eleazar, na anak ng paring si Aaron, na alisin niya ang mga insensaryo[a] mula sa gitna ng sunog at ikalat ang apoy sa malayo, sapagkat naging banal ang mga iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lalagyan ng baga.” Ang salitang Hebreo ay tumutukoy sa mga sisidlang ginagamit sa pagdadala ng baga at insenso.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “sapagkat banal ang mga iyon.” Maaaring idiin ng perpektong pandiwang Hebreo ang kalagayang ibinunga: “naging banal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Sabihin mo
  rationale: Ang pautos na anyo ng אמר ay likas na isinasalin bilang “Sabihin mo” kapag inuutusan si Moises na magbigay ng tagubilin.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: kay Eleazar na anak ng paring si Aaron
  rationale: Pinananatili nitong malinaw na ang “pari” ay tumutukoy kay Aaron, gaya ng pinakamalikas na pagbasa sa pariralang Hebreo.
- source_word: וְיָרֵם
  choice: na iahon
  rationale: Ang jussive kasunod ng pautos ay nilalahad bilang nilalaman ng tagubilin; ipinahihiwatig ng “iahon” ang pagkuha pataas at palabas mula sa sunog.
- source_word: הַמַּחְתֹּת
  choice: mga sunugan ng insenso
  rationale: Tumutukoy ang מחתה sa mga sisidlang ginagamit sa pagdadala ng baga at pagsusunog ng insenso. Mas madaling maunawaan sa karaniwang Filipino ang “sunugan ng insenso” kaysa sa hiram na “insensaryo.”
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: mula sa gitna ng sunog
  rationale: Ang שׂרפה ay maaaring tumukoy sa nagaganap na pagsunog o sa lugar na tinupok. Ang “gitna ng sunog” ay natural at hindi nagpapasya kung apoy o mga natupok na labi ang pangunahing larawan.
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: at ikalat ang apoy sa malayo
  rationale: Pinananatili ng “ikalat” ang diwa ng זרה at ng “sa malayo” ang direksiyonal na diin ng הָלְאָה, nang hindi tahasang pinapalitan ang “apoy” ng “mga baga.”
- source_word: כִּי קָדֵשׁוּ
  choice: sapagkat naging banal ang mga iyon
  rationale: 'Ipinahahayag ng perpektong pandiwa ang kalagayang bunga ng naunang paghahandog: ang mga sunugan ay naging banal.'
theological_decisions:
- issue: Tinutukoy ng pangmaramihang pandiwa sa כִּי קָדֵשׁוּ
  choice: Ang mga sunugan ng insenso ang naging banal.
  alternative: Maaaring saklawin nito ang mga kagamitang kaugnay ng handog, o ang mga sunugan at apoy nang magkasama.
  rationale: 'Ang pinakamalapit at angkop na pangmaramihang tinutukoy ay הַמַּחְתֹּת, “mga sunugan.” Kaayon din ito ng salaysay: iniingatan ang mga sunugan dahil naging banal ang mga ito, samantalang ipinakakalat ang apoy.'
- issue: Aspekto ng קָדֵשׁוּ
  choice: “naging banal”
  alternative: “banal ang mga iyon”
  rationale: Ang “naging banal” ay malinaw na naghahatid ng resultang kalagayan, ngunit inilalagay sa talababa ang mas payak na pagbasa upang mapanatili ang saklaw ng aspektong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sunugan ng insenso” sa halip na ang mas teknikal na “insensaryo,” at pinanatili ang konkretong larawan ng pag-ahon mula sa sunog at pagkakalat ng apoy.
