base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: tl
  text: '“Magsalita ka sa mga anak ni Israel[a] at kumuha ka sa kanila ng tig-isang tungkod[b] para sa bawat angkan ng ama, mula sa lahat ng kanilang mga pinuno ayon sa mga angkan ng kanilang mga ama: labindalawang tungkod. Isulat mo ang pangalan ng bawat lalaki sa kaniyang tungkod.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “pamalo.” Ang Hebreong מַטֶּה ay maaaring tumukoy sa tungkod o pamalo; dito ay isang pisikal na tungkod ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang Hebreong idyoma at malinaw pa ring tumutukoy sa bayang nagmula kay Israel; likas at marangal din ito sa Filipino.
- source_word: מַטֶּה
  choice: tungkod
  rationale: Konkretong tungkod ang tinutukoy sapagkat sinusulatan ito at kalaunan ay sisibol; ang “tungkod” ang pinakanatural na katumbas sa Filipino.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: tig-isang tungkod para sa bawat angkan ng ama
  rationale: Ipinahahayag ng “tig-isang” ang distributibong pag-uulit ng Hebreo, samantalang pinananatili ng “angkan ng ama” ang organisasyong batay sa linya ng ama.
- source_word: נְשִׂיאֵיהֶם
  choice: kanilang mga pinuno
  rationale: Malinaw at makabagong tawag ito sa mga pinuno ng mga lipi, nang hindi nagmumungkahi ng maharlikang katayuang gaya ng “mga prinsipe.”
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa mga angkan ng kanilang mga ama
  rationale: Pinananatili nito ang batayang pangangkan ng pagpili at ang pag-uulit ng konseptong “bahay ng ama” sa Hebreo.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: labindalawang tungkod
  rationale: Tuwirang salin ng bilang at pare-pareho sa naunang pagpili para sa מַטֶּה.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: Isulat mo ang pangalan ng bawat lalaki
  rationale: Pinananatili ang distributibong diwa ng אִישׁ at ang malinaw na utos, habang natural ang ayos ng pangungusap sa Filipino.
- source_word: עַל מַטֵּהוּ
  choice: sa kaniyang tungkod
  rationale: Likas na Filipino para sa pagsusulat sa ibabaw ng tungkod at pinananatili ang kaugnayan ng bawat pangalan sa sariling tungkod ng lalaki.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tig-isang” upang likas na maipahayag ang distributibong Hebreo, at ang “angkan ng ama” upang mapanatili ang sinaunang organisasyong panlipunan nang hindi ito gawing simpleng “pamilya.”
