  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: tl
  text: Pagkatapos, bumalik si Aaron kay Moises sa pasukan ng toldang tipanan, at napigil[a] ang salot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nahinto” o “napahinto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Pagkatapos, bumalik
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay, at tuwirang nangangahulugang ‘bumalik’ ang שׁוּב. Likas sa modernong Tagalog ang ‘Pagkatapos’ bilang panandang pasalaysay.
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Ipinapahayag ng אֶל ang paggalaw patungo kay Moises. Hindi na kailangan ang ‘pabalik’ sapagkat malinaw na ito sa pandiwang ‘bumalik.’
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng toldang tipanan
  rationale: Ang פֶּתַח ay pasukan o bukana. Ang ‘toldang tipanan’ ay malinaw at matapat na salin ng אֹהֶל מוֹעֵד, at ang ‘sa pasukan’ ay natural na naglalarawan kung nasaan si Moises.
- source_word: הַמַּגֵּפָה
  choice: ang salot
  rationale: Sa kontekstong ito, ang מַגֵּפָה ay nakamamatay na salot o hagupit. Ang ‘salot’ ay maikli, dignificado, at pamilyar sa karaniwang mambabasa.
- source_word: נֶעֱצָרָה
  choice: napigil
  rationale: Ang Niphal ng עצר ay nagsasaad na ang salot ay pinahinto o napigilan. Pinananatili ng ‘napigil’ ang balintiyak na anyo at hindi tahasang pinapangalanan ang gumagawa.
theological_decisions:
- issue: Ipinahihiwatig na pagkilos ng Diyos sa pagpigil sa salot
  choice: Panatilihin ang balintiyak na ‘napigil ang salot’ nang hindi ginagawang tahasang simuno ang Diyos.
  alternative: ‘at pinigil ng PANGINOON ang salot’ o ‘at tumigil ang salot’
  rationale: Bagaman malinaw sa konteksto na ang Diyos ang kumilos, balintiyak ang pandiwang Hebreo at walang tahasang binanggit na gumagawa. Pinananatili ng salin ang pagpipigil at teolohikal na pag-igting ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘toldang tipanan’ bilang madaling maunawaang salin ng institusyonal na katawagang Hebreo; iniwasan ang labis na arkaiko o denominasyonal na pananalita.
