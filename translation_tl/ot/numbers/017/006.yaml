source:
  edition: WLC
  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: tl
  text: Ngunit kinabukasan, nagreklamo laban kina Moises at Aaron ang buong kapulungan ng mga anak ni Israel. Sinabi nila, “Kayo ang pumatay sa bayan ni Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: nagreklamo
  rationale: Ang pandiwang לון sa anyong ito ay tumutukoy sa sama-samang pagrereklamo laban sa mga pinuno. Natural sa modernong Filipino ang “nagreklamo” at taglay nito ang mapanumbat na diwa ng konteksto.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ang buong kapulungan ng mga anak ni Israel
  rationale: Pinananatili ng “buong kapulungan” ang kolektibong diwa ng עֵדָה, at ng “mga anak ni Israel” ang pormal na anyo ng בְּנֵי יִשְׂרָאֵל nang hindi nililimitahan ang tinutukoy sa mga lalaking anak lamang.
- source_word: מִמָּחֳרָת
  choice: kinabukasan
  rationale: Ito ang maikli, natural, at eksaktong katumbas sa Filipino ng “sa sumunod na araw.”
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: kay Moises at kay Aaron
  rationale: Sa pandiwang “nagreklamo,” natural na ipinahihiwatig ng “kay” ang taong pinatutungkulan ng reklamo; parehong pinangalanan ang dalawang lider gaya sa Hebreo.
- source_word: לֵאמֹר
  choice: Sinabi nila
  rationale: Ginawang hiwalay na sugnay ang pormulang nagpapakilala sa tuwirang pananalita upang maging malinaw at natural sa Filipino.
- source_word: אַתֶּם הֲמִתֶּם
  choice: Kayo ang pumatay
  rationale: Ang “kayo” ay maramihan at mariing inilalagay bilang salarin, habang ang “pumatay” ay tuwirang naghahatid ng causative na paratang ng Hebreo.
- source_word: עַם יְהוָה
  choice: ang bayan ni Yahweh
  rationale: Ang “bayan” ay angkop sa tipanang sambayanan, at pinananatili ng “ni Yahweh” ang ugnayang nasa pariralang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na YHWH bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya “Yahweh” ang pinakamalinaw na paglilipat at hindi ito ginagawang titulong “PANGINOON.”
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Pinananatili ang tradisyonal at pormal na metapora ng pinagmulang angkan. Sa konteksto, tumutukoy ito sa buong bayang Israel at hindi lamang sa mga lalaking anak.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “kapulungan” at “bayan” para sa kolektibo at tipanang diwa, ngunit pinanatiling tuwiran at madaling maunawaan ang paratang.
