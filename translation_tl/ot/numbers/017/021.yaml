  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pormal na katawagang “mga anak ni Israel,” na may talababa para sa mas karaniwang alternatibo. Ginamit ang mga gitling upang malinaw na maipakita ang distributibong pag-uulit ng Hebreo nang hindi nagiging mabigat ang pangungusap.
