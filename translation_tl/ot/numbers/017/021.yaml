base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: tl
  text: At nagsalita si Moises sa mga anak ni Israel[a], at ang lahat ng kanilang pinuno ay nagbigay sa kaniya ng tig-iisang tungkod—isang tungkod para sa bawat pinuno ayon sa sambahayan ng kanilang mga ninuno—labindalawang tungkod; at kasama sa kanilang mga tungkod ang tungkod ni Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal sa Hebreo ang “mga anak ni Israel,” isang karaniwang katawagan para sa bayang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: nagsalita
  rationale: Karaniwang nagsasaad ang דּבר ng pagsasalita o pagtugon sa isang pangkat. Natural at marangal sa salaysay ang “nagsalita.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal at tipanang katawagan ng Hebreo, habang malinaw pa rin sa modernong Tagalog.
- source_word: נְשִׂיאֵיהֶם
  choice: kanilang mga pinuno
  rationale: Sa kontekstong pantribo ng Pentateuch, tumutukoy ito sa mga kinikilalang pinuno; mas malinaw ngayon ang “mga pinuno” kaysa “mga prinsipe.”
- source_word: מַטֶּה
  choice: tungkod
  rationale: Ang tinutukoy ay isang pisikal na tungkod na nagsisilbing tanda ng kinatawan. Ang “tungkod” ang natural na katumbas sa Tagalog.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד ... מַטֶּה לְנָשִׂיא אֶחָד
  choice: tig-iisang tungkod—isang tungkod para sa bawat pinuno
  rationale: Ipinahahayag ng “tig-iisa” ang distributibong diwa, samantalang pinananatili ng kasunod na parirala ang pag-uulit at diin ng Hebreo.
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa sambahayan ng kanilang mga ninuno
  rationale: Ipinakikita nito ang pagkatawan batay sa angkan o sambahayang mula sa ama, ngunit gumagamit ng likas at madaling maunawaang Tagalog.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: labindalawang tungkod lahat
  rationale: Tuwirang isinasalin ang bilang; nililinaw ng “lahat” na ito ang kabuuang bilang ng mga tungkod.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: at kasama sa kanilang mga tungkod ang tungkod ni Aaron
  rationale: Natural na Tagalog ito para sa sugnay na walang tahasang pandiwa at pinananatili ang diwa ng בְּתוֹךְ bilang “kasama” o “nasa gitna ng.”
