revisions:
- from: Kaya nagsalita si Moises sa mga anak ni Israel[a], at binigyan siya ng lahat ng kanilang mga pinuno ng tig-iisang tungkod—isang tungkod para sa bawat pinuno ayon sa sambahayan ng kanilang mga ninuno—labindalawang tungkod lahat; at kasama sa kanilang mga tungkod ang tungkod ni Aaron.
  to: At nagsalita si Moises sa mga anak ni Israel[a], at ang lahat ng kanilang pinuno ay nagbigay sa kaniya ng tig-iisang tungkod—isang tungkod para sa bawat pinuno ayon sa sambahayan ng kanilang mga ninuno—labindalawang tungkod; at kasama sa kanilang mga tungkod ang tungkod ni Aaron.
  rationale: Pinalitan ang “Kaya” ng “At” upang hindi magpahiwatig ng ugnayang sanhi-bunga na wala sa Hebreo. Inayos nang bahagya ang ayos ng sugnay para sa likas na modernong Tagalog at pinasimple ang talababa upang manatili itong leksikal, hindi interpretibo. Pinanatili ang literal na katawagang “mga anak ni Israel,” ang distributibong pagbibigay ng tig-iisang tungkod, ang kaugnayan sa sambahayan ng mga ninuno, at ang pagsasama ng tungkod ni Aaron.
