  source_fidelity: Kailangang alisin ang “Kaya,” dahil ang paunang waw ay karaniwang pang-ugnay sa salaysay at hindi nagpapahiwatig ng konklusyon o resulta. Tumpak naman ang distributibong “tig-iisang tungkod,” ang bilang na labindalawa, at ang pagsasama ng tungkod ni Aaron sa mga tungkod nila.
  naturalness: Marangal at malinaw ang Tagalog. Mas natural at mas malapit sa daloy ng Hebreo ang “At nagsalita” kaysa “Kaya nagsalita.” Ang paggamit ng “ang lahat ng kanilang pinuno” ay bahagyang mas maayos na ayos ng pangungusap.
  terminology: Ang “mga anak ni Israel,” “mga pinuno,” at “tungkod” ay angkop. Sa talababa, ang paglalarawang “tipanang katawagan” ay hindi kailangan upang maipaliwanag ang leksikal na alternatibo at maaaring magdagdag ng interpretibong diin; sapat ang “karaniwang katawagan.”
