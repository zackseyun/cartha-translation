  naturalness: Mas natural at malinaw ang isahang “Tingnan mo” dahil si Moises ang tinutukoy. Ang “na” sa bawat sigaw ay maayos na naghahatid ng agarang, balisang puwersa nang hindi ipinipilit ang isang mahigpit na aspekto ng Hebreo sa Tagalog.
  terminology: Napananatili ang “mga anak ni Israel” bilang literal na katawagang panggrupo, na may angkop na alternatibong “mga Israelita.” Ginamit ang “mapupuksa” nang pareho sa dalawang paglitaw ng אבד upang mapanatili ang sinadyang pag-uulit.
