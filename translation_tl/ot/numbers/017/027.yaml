    rationale: Maaari itong mangahulugang malalagay lamang sa kapahamakan. Sa balisang pagdaing na ito, ang אבד ay tumutukoy sa pagkapuksa o ganap na pagkawasak; “mapupuksa” ay mas malapit at pinananatili ang pag-uulit.
