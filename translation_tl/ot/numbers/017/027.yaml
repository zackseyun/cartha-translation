  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: tl
  text: Sinabi ng mga anak ni Israel[a] kay Moises, “Tingnan mo[b], mamamatay na kami! Mapupuksa na kami[c]! Lahat kami ay mapupuksa na!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Narito”; isang biglang pagbulalas ng pagkabahala.
    reason: lexical_alternative
  - marker: c
    text: 'Magkaibang pandiwa ang sunod na ginamit sa Hebreo: “mamamatay” (גוע) at “mapupuksa” (אבד). Pinatitindi nito ang takot ng bayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang Hebreong katawagan sa sambayanan at malinaw pa rin ito sa dignidad na biblikal na Tagalog; maaaring unawain nang mas tuwiran bilang ‘mga Israelita.’
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: Sinabi ...
  rationale: Likas sa Tagalog na ipakilala ang tuwirang sipi sa pamamagitan lamang ng ‘sinabi’; hindi kailangang ulitin ang literal na ‘na sinasabi.’
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Nagsisilbi itong pantawag-pansin na nagpapahayag ng pagkabahala. Iniiwasan nito ang makalumang ‘narito’ habang pinananatili ang biglang pagbulalas.
- source_word: גָּוַעְנוּ
  choice: mamamatay kami
  rationale: Tahasang ipinahahayag ang pagkamatay na kinatatakutan ng bayan at natural na naihahatid ng panghinaharap na anyo ang nalalapit na panganib sa Tagalog.
- source_word: אָבַדְנוּ
  choice: mapapahamak kami
  rationale: Ibinubukod ito sa naunang pandiwang tumutukoy sa pagkamatay at inihahatid ang diwa ng pagkapuksa o lubos na kapahamakan.
- source_word: כֻּלָּנוּ
  choice: kaming lahat
  rationale: Pinananatili ang diin sa kabuuan ng sambayanan sa natural na ayos ng Tagalog.
- source_word: אָבָדְנוּ
  choice: mapapahamak
  rationale: Inuulit ang parehong salin upang mapanatili ang mapilit at balisang pag-uulit sa Hebreo.
