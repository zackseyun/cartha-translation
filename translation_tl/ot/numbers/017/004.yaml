revisions:
- from: Kaya kinuha ni Eleazar na pari ang mga tansong insensaryo[a] na inihandog ng mga nasunog[b], at pinukpok ang mga iyon upang gawing pantakip[c] sa altar.
  to: Kaya kinuha ni Eleazar na pari ang mga tansong insensaryo[a] na inihandog ng mga nasunog[b], at ang mga ito ay pinukpok upang maging pantakip[c] sa altar.
  rationale: Ginawang hayag na pasibo ang pagpukpok upang mapanatili ang di-tiyak na tagagawa at maging natural ang pangungusap sa Filipino. Inayos din ang talababa para sa “mga nasunog” upang hindi magmungkahi ng aktibong kahulugang wala sa Hebreo. Hindi binago ang kahulugan ng talata o ang mga angkla ng talababa.
