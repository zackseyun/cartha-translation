base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: tl
  text: Kaya kinuha ni Eleazar na pari ang mga tansong insensaryo[a] na inihandog ng mga nasunog[b], at ang mga ito ay pinukpok upang maging pantakip[c] sa altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalagyan ng baga.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga nasunog” o “mga taong nasunog,” na tumutukoy sa mga nilamon ng apoy sa naunang salaysay.
    reason: lexical_alternative
  - marker: c
    text: O “kalupkop” o “sapin na metal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: mga tansong insensaryo
  rationale: Ang מַחְתּוֹת ay mga sisidlang ginagamit sa baga at insenso. Ang “insensaryo” ay malinaw sa kontekstong panritwal; inilagay rito ang “tanso” mula sa הַנְּחֹשֶׁת.
- source_word: הַנְּחֹשֶׁת
  choice: tanso
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa copper o bronze. Ang “tanso” ang natural at nakaugaliang salin sa Filipino para sa metal ng mga kagamitang ito nang hindi nagpapanggap ng higit na tiyak na metalurhiya kaysa sa Hebreo.
- source_word: הִקְרִיבוּ
  choice: inihandog
  rationale: Sa kontekstong panritwal, ang Hiphil ng קרב ay nangangahulugang maghandog o magharap bilang handog. Ipinahihiwatig ng aspektong natapos na ang paghahandog ay nauna sa pagkuha ni Eleazar.
- source_word: הַשְּׂרֻפִים
  choice: mga nasunog
  rationale: Pinananatili nito ang tahasang pasibong participle ng שׂרף, “mga sinunog/nasunog,” at ang pagtukoy sa mga nilamon ng apoy sa naunang salaysay, nang hindi nagdaragdag ng pangalang wala sa talata.
- source_word: וַיְרַקְּעוּם
  choice: pinukpok ang mga iyon
  rationale: Ang רקע ay pagpukpok o pagpitpit sa metal upang lumapad, at malinaw na kinakatawan ng “ang mga iyon” ang 3mp object suffix. Hindi tahasang pinangalanan ang gumagawa, kaya ginamit ang natural na pasibong Filipino upang hindi piliting tukuyin ang simuno.
- source_word: צִפּוּי
  choice: pantakip
  rationale: Tumutukoy ito sa takip, balot, o metal na overlay. Natural ang “pantakip” at naipahahayag ang layunin ng pinukpok na metal.
- source_word: לַמִּזְבֵּחַ
  choice: sa altar
  rationale: Ang lamed ay nagpapahiwatig na ang metal ay ginawa bilang pantakip para sa altar. Sa pariralang Filipino na “gawing pantakip sa altar,” malinaw ang layunin at kaugnayan nito sa altar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang bokabularyong panritwal na “pari,” “insensaryo,” at “altar.” Ang pasibong “pinukpok” ay sadyang hindi tumutukoy sa gumagawa, alinsunod sa kahirapang sintaktiko ng Hebreo; ang layunin ay nilinaw sa “upang gawing pantakip.”
