source:
  edition: WLC
  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: tl
  text: Kung tungkol sa mga insensaryo ng mga taong ito na nagkasala hanggang ikinamatay nila[a], pukpukin ang mga iyon upang maging mga pinukpok na piraso ng metal na pantakip sa altar[b], sapagkat iniharap nila ang mga iyon kay Yahweh at naging banal ang mga iyon[c]. Maging tanda ang mga iyon para sa mga Israelita[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kanilang mga buhay.” Maaari ring isalin, “na nagkasala laban sa sarili nilang buhay.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “mga pinukpok na laminang metal bilang pantakip sa altar.”
    reason: lexical_alternative
  - marker: c
    text: O “itinalaga ang mga iyon bilang banal.” Ang pinakanatural na tinutukoy ay ang mga insensaryo.
    reason: lexical_alternative
  - marker: d
    text: Sa literal, “para sa mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: mga insensaryo
  rationale: Mga sisidlang ginagamit sa pagsusunog ng insenso ang tinutukoy sa salaysay. Ang “insensaryo” ay tiyak at pamilyar sa kontekstong panrelihiyon.
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: mga taong ito na nagkasala kapalit ng sarili nilang buhay
  rationale: Pinananatili ng pandiwang “nagkasala” ang pangyayaring ipinahihiwatig ng Hebreong participle, at ipinakikita ng “kapalit ng sarili nilang buhay” ang nakamamatay na bunga ng kanilang kasalanan nang hindi ginagawang hiwalay na konseptong antropolohikal ang נֶפֶשׁ.
- source_word: וְעָשׂוּ אֹתָם רִקֻּעֵי פַחִים
  choice: pukpukin ang mga iyon upang maging maninipis na lamina
  rationale: Ang konteksto ay nagpapatuloy ng utos sa naunang talata. Ipinahahayag ng “pukpukin” ang pagbatak sa metal, at ng “maninipis na lamina” ang resultang anyo nito.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: pantakip sa altar
  rationale: Malinaw at likas na Filipino ito para sa metal na ilalapat bilang balot o overlay sa altar.
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: sapagkat iniharap nila ang mga iyon sa harap ni Yahweh
  rationale: Ang “iniharap” ay nagpapanatili sa kultikong diwa ng paglalapit o paghahandog nang hindi ipinapalagay na ang mga insensaryo mismo ay handog na hain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: וַיִּקְדָּשׁוּ
  choice: naging banal ang mga iyon
  rationale: Ang pinakamalapit at pinakanatural na simuno ay ang mga insensaryo. Pinananatili ng “naging banal” ang resultang sagradong katayuan nang hindi labis na tinutukoy ang ahensiya.
- source_word: וְיִהְיוּ לְאוֹת לִבְנֵי יִשְׂרָאֵל
  choice: Maging tanda ang mga iyon para sa mga Israelita
  rationale: Pinananatili ang puwersang direktiba ng pahayag at ang memorial o babalang tungkulin ng tanda. Ang “mga Israelita” ay natural at inklusibong katumbas ng kolektibong katawagang “mga anak ni Israel.”
theological_decisions:
- issue: Ang tinutukoy ng pahayag na naging banal
  choice: Ang mga insensaryo ang naging banal dahil iniharap ang mga iyon sa harap ni Yahweh.
  alternative: Ang mga nagkasalang lalaki ang naging banal, o ang mga sisidlan ay itinalaga lamang nang walang namamalaging sagradong katayuan.
  rationale: Ang mga insensaryo ang pinakamalapit na gramatikal na tinutukoy at sila rin ang lohikal na dahilan kung bakit gagawing pantakip sa altar ang metal. Pinananatili nito ang tensiyon na naging banal ang mga bagay na ginamit ng mga rebelde.
- issue: Kahulugan ng בְּנַפְשֹׁתָם
  choice: Ang kanilang kasalanan ay nauwi sa pagkawala ng sarili nilang buhay.
  alternative: Nagkasala sila laban sa kanilang mga kaluluwa, o nagkasala sila gamit ang kanilang mga buhay.
  rationale: Sa konteksto ng kanilang kamatayan, tumutukoy ang parirala sa mapaminsalang bunga ng paghihimagsik, hindi sa isang teknikal na pagkakaiba ng kaluluwa at buhay.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinili ang “insensaryo,” “altar,” at “lamina” bilang malinaw na mga terminong kultiko at materyal; iniwasan ang sobrang arkaikong ayos. Ang pag-uulit ng “mga iyon” ay sadyang nagpapanatiling malinaw na ang mga insensaryo, hindi ang mga lalaki, ang ginawang lamina at naging banal.
