  to: Kung tungkol sa mga insensaryo ng mga taong ito na nagkasala hanggang ikinamatay nila[a], pukpukin ang mga iyon upang maging mga pinukpok na piraso ng metal na pantakip sa altar[b], sapagkat iniharap nila ang mga iyon kay Yahweh at naging banal ang mga iyon[c]. Maging tanda ang mga iyon para sa mga Israelita[d].
