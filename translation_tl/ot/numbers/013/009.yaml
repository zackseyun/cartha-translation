- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Pangalan ng tao at lipi; ginamit ang karaniwang anyo sa Tagalog na salin ng Bibliya.
- source_word: פַּלְטִי
  choice: Palti
  rationale: Pangalang pantangi na tinumbasan sa pamamagitan ng transliterasyon.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwan at maikling katumbas sa Tagalog ng Hebreong genealogical construction na nagsasaad ng ama.
- source_word: רָפוּא
  choice: Rafu
  rationale: Transliterasyon na angkop sa bigkas at ortograpiyang Filipino ng Hebreong pangalan.
