base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: tl
  text: Umakyat sila sa Negev, at nakarating siya hanggang sa Hebron. Naroon sina Ahiman, Sheshai, at Talmai, na mga inapo ni Anak. Itinayo ang Hebron pitong taon bago ang Zoan sa Ehipto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַנֶּגֶב
  choice: sa Negev
  rationale: Pinananatili ang pangalang heograpiko; bagaman maaari itong mangahulugang “timog,” dito ay tumutukoy ito sa rehiyon ng Negev.
- source_word: וַיָּבֹא
  choice: nakarating siya
  rationale: Pinananatili ang biglang paglipat ng Hebreong pandiwa mula maramihan tungo sa isahan, sa halip na pakinisin bilang “nakarating sila.”
- source_word: יְלִידֵי הָעֲנָק
  choice: mga inapo ni Anak
  rationale: Natural na Filipino para sa mga nagmula kay Anak; hindi ito ginawang “mga higante,” sapagkat pangalan ang Anak sa parirala.
- source_word: נִבְנְתָה לִפְנֵי
  choice: itinayo ... bago ang
  rationale: Ipinahahayag ang pasibong pagtatayo at ang paghahambing sa panahon nang malinaw at natural.
- source_word: צֹעַן מִצְרָיִם
  choice: Zoan sa Ehipto
  rationale: Tinutukoy ang Zoan na nasa Ehipto nang hindi ipinapalagay na pag-aari ito ng Ehipto.
theological_decisions:
- issue: Paglipat mula maramihang “umakyat sila” tungo sa isahang “nakarating siya”
  choice: 'Pinanatili ang isahang bilang: “nakarating siya.”'
  alternative: “nakarating sila”
  rationale: Malinaw na isahan ang וַיָּבֹא sa tekstong Masoretiko. Hindi tinukoy ng talata kung sino ang “siya,” kaya pinanatili ang tunay na kalabuan sa halip na pangalanan si Caleb o gawing maramihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang baybay na “Ehipto” at transliterasyon ng mga pangalang pantangi; iniwasan ang labis na teknikal o makalumang pananalita.
