  source_fidelity: Ang pangunahing sugnay ay wastong kumakatawan sa וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה. Gayunman, ang “na sinasabi” ay hindi natural na paraan sa makabagong Filipino upang katawanin ang pormulang לֵאמֹר.
  naturalness: Ang “Nagsalita si Yahweh kay Moises at sinabi:” ay natural, marangal, at angkop na pambungad sa kasunod na tuwirang pananalita. Pinananatili nito ang dalawang pandiwang nasa pormulang Hebreo nang hindi gumagamit ng pilit na “na sinasabi.”
  terminology: Wasto ang “Yahweh” para sa יהוה at “Moises” para sa משה. Hindi kailangan ng talababa para ulitin lamang ang mismong anyong “Yahweh”; ang dating talababa ay hindi nagbibigay ng tunay na alternatibong pagbasa o salin.
  issues:
