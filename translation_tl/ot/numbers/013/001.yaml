    issue: Hindi likas ang “na sinasabi” kasunod ng “nagsalita.”
    rationale: Bagaman tinatangkang tularan nito ang לֵאמֹר, ang konstruksyong ito ay hindi idiomatiko sa modernong Filipino. Ang “at sinabi:” ang natural na pormula bago ang kasunod na tuwirang pananalita.
  - severity: low
    issue: Mali o walang silbi ang talababa tungkol sa YHWH/Yahweh.
    rationale: Sinasabi ng talababa na maaari ring isalin bilang “Yahweh,” samantalang “Yahweh” na ang nasa pangunahing teksto. Hindi ito alternatibong salin at hindi kinakailangan para sa tekstong ito.
