  text: 'Nagsalita si Yahweh kay Moises at sinabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: at nagsalita
  rationale: Ang waw-consecutive na anyo ng דבר ay nagsasalaysay ng kasunod na pangyayari. Pinananatili ng “nagsalita” ang pagkakaiba nito sa אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na anyo sa Filipino bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalang משה sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Malapit nitong sinasalamin ang pormulang Hebreo na nagpapakilala sa mismong sasabihin, bagaman mas pormal ito kaysa sa karaniwang “sinabi niya.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; inilalahad sa talababa ang anyong Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino, na may pormal na pormulang “na sinasabi” upang mapanatili ang kayarian ng Hebreo. Nasa pangunahing teksto ang lahat ng marker ng talababa.
