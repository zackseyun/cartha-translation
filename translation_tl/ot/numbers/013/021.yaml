  text: וַֽ/יַּעֲל֖וּ וַ/יָּתֻ֣רוּ אֶת הָ/אָ֑רֶץ מִ/מִּדְבַּר צִ֥ן עַד רְחֹ֖ב לְבֹ֥א חֲמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: tl
  text: Kaya umakyat sila at ginalugad ang lupain mula sa ilang ng Zin hanggang sa Rehob, sa may Lebo-hamat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa may pasukan ng Hamat.” Maaaring unawain ang pananalitang Hebreo bilang paglalarawan ng lugar sa halip na bilang pangalang Lebo-hamat.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: umakyat sila
  rationale: Pinananatili ang direksiyonal na diwa ng עלה at natural ito sa salaysay ng paglalakbay.
- source_word: וַיָּתֻרוּ
  choice: ginalugad
  rationale: Ipinahihiwatig ng תור ang masusing pagsisiyasat sa lupain. Ang “ginalugad” ay natural sa modernong Filipino at hindi labis na nagpapasya kung lihim o militar ang paraan ng pagmamanman.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa lupaing sinisiyasat sa konteksto ng Mga Bilang 13; mas angkop dito ang “lupain” kaysa sa pangkalahatang “lupa.”
- source_word: מִמִּדְבַּר צִן
  choice: mula sa ilang ng Zin
  rationale: Ang “ilang” ay maikli, dignificado, at karaniwang salin ng מִדְבָּר bilang di-tinatahanang lupain; pinanatili ang Zin bilang pangalang pantangi.
- source_word: עַד רְחֹב
  choice: hanggang sa Rehob
  rationale: Malinaw na ipinapahayag ng “hanggang sa” ang hangganan ng saklaw na tinutukoy ng עַד.
- source_word: לְבֹא חֲמָת
  choice: sa may Lebo-hamat
  rationale: Pinananatili sa pangunahing teksto ang posibleng pagbasa rito bilang pangalang pook, habang ang “sa may” ay natural na nag-uugnay nito sa Rehob. Inilalahad sa talababa ang posibleng deskriptibong pagbasa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “ginalugad” upang ipahayag ang masusing pagsisiyasat nang hindi ipinipilit ang mas makitid na diwa ng lihim na paniniktik. Ang marker na [a] ay inilagay agad pagkatapos ng pariralang saklaw ng talababa.
