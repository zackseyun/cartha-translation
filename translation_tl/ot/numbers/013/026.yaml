translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kina Moises at Aaron” para sa natural na pagtukoy sa dalawang tao, at pinanatili ang pag-uulit ng “buong kapulungan” na nasa tekstong Hebreo.
