base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: tl
  text: Naglakbay sila at dumating kina Moises at Aaron at sa buong kapulungan ng mga Israelita[a] sa ilang ng Paran, sa Kades. Nag-ulat sila sa kanila at sa buong kapulungan, at ipinakita nila sa kanila ang bunga ng lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “kapulungan ng mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Naglakbay sila at dumating
  rationale: Pinananatili ang dalawang magkaugnay na pandiwa ng Hebreo—ang paglalakbay at ang pagdating—nang hindi nagiging pilit sa makabagong Tagalog.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: buong kapulungan ng mga Israelita
  rationale: Ang “kapulungan” ay tumutugma sa עֵדָה, samantalang ang “mga Israelita” ang likas na Tagalog para sa idyomang “mga anak ni Israel.” Inilagay sa talababa ang literal na anyo.
- source_word: מִדְבַּר פָּארָן
  choice: ilang ng Paran
  rationale: Ang “ilang” ay likas at karaniwang salin ng מִדְבָּר sa salaysay ng paglalakbay ng Israel, at hindi nito ipinapalagay na purong buhangin ang lugar.
- source_word: קָדֵשָׁה
  choice: sa Kades
  rationale: Ang hulaping patungo sa isang lugar ay tumutukoy sa Kades bilang kanilang destinasyon; dahil nakarating na sila, natural itong ipinahayag bilang lokasyon sa Tagalog.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: Nag-ulat sila sa kanila
  rationale: Likas na ipinahahayag sa Tagalog ang idyomang literal na “nagbalik ng salita sa kanila” bilang pagbibigay ng ulat matapos ang pagmamanman.
- source_word: וְאֶת כָּל הָעֵדָה
  choice: at sa buong kapulungan
  rationale: Inilalantad ang ipinahihiwatig na ugnayang “sa” at pinananatili ang pare-parehong salin ng עֵדָה.
- source_word: וַיַּרְאוּם
  choice: ipinakita nila
  rationale: 'Tumpak na ipinapahayag ang causative na anyo ng ראה: pinakita nila sa iba, hindi lamang nila nakita.'
- source_word: פְּרִי הָאָרֶץ
  choice: ang bunga ng lupain
  rationale: Pinananatili ang kongkretong larawan ng Hebreo at ang kaugnayan nito sa dalang bunga mula sa lupain.
