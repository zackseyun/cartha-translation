base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/011.yaml
  text: 'from the tribe of Joseph[a], from the tribe of Manasseh: Gaddi son of Susi.'
translation:
  language: tl
  text: 'Mula sa lipi ni Jose, mula sa lipi ni Manases: si Gadi, anak ni Susi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa talaang ito, ipinakikilala ng לְ ang kinabibilangang lipi ng kinatawan. Likas at malinaw sa modernong Filipino ang “mula sa lipi ni.”
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: sa lipi ni Manases
  rationale: Pinanatili ang ikalawang pagbanggit sa lipi upang ipakitang ang Manases ang tiyak na sangay ni Jose na tinutukoy. Ginamit ang dash upang maging natural ang paglilinaw sa Filipino nang hindi binubura ang pag-uulit sa Hebreo.
- source_word: גַּדִּי
  choice: Gadi
  rationale: Tuwirang transliterasyon na angkop sa baybay at bigkas sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Natural na pananalita sa talaan ng mga pangalan; sapat ang “anak ni” dahil lalaki ang tinutukoy ng pangalan at konteksto.
- source_word: סוּסִי
  choice: Susi
  rationale: Tuwirang transliterasyon na angkop sa Filipino.
theological_decisions:
- issue: Ugnayan ng Jose at Manases sa pagkakakilanlan ng lipi
  choice: Pinanatili ang parehong Jose at Manases, na ang ikalawa ay paglilinaw sa una.
  alternative: Paikliin bilang “mula sa lipi ni Manases” lamang.
  rationale: Tahasan silang kapwa binabanggit sa Hebreo. Ang pagpapanatili sa dalawa ay sumasalamin sa pagkakaugnay ng lipi ni Manases kay Jose nang hindi nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino na maikli at marangal, angkop sa anyo ng isang talaan. Pinanatili ang istruktura at paglilinaw ng Hebreo, ngunit ginamit ang dash upang maging maayos at madaling maunawaan ang pag-uulit.
