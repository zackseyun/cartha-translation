lexical_decisions:
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa paulit-ulit na talaan, ipinahihiwatig ng לְ na ang taong pinangalanan ay nagmula sa at kumakatawan sa naturang lipi. Likas sa modernong Tagalog ang “mula sa lipi ni.”
- source_word: גָד
  choice: Gad
  rationale: Pangalan ng lipi; pinanatili sa karaniwang transliterasyong ginagamit sa Tagalog.
- source_word: גְּאוּאֵל
  choice: Geuel
  rationale: Pangalang pantangi; transliterasyon ng anyong Hebreo, nang hindi isinasalin ang posibleng kahulugan ng pangalan.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang panumbas sa konstruksiyong Hebreo na tumutukoy sa anak na lalaki sa talaangkanan; malinaw na si Geuel ang anak ni Maki.
- source_word: מָכִי
  choice: Maki
  rationale: Pangalang pantangi; iniangkop ang transliterasyon sa natural na baybay at bigkas sa Tagalog.
