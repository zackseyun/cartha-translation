base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: tl
  text: At ano ang kalagayan ng lupain—mataba ba ito o mahirap,[a] may mga puno ba rito o wala?[b] Magpakatatag kayo at kumuha kayo ng ilan sa bunga ng lupain.” Ang panahong iyon ay panahon ng mga unang nahihinog na ubas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “payat”; literal na “payat” ang salitang Hebreo, na tumutukoy sa lupang hindi mabunga.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “kahoy.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “At ang mga araw ay mga araw ng mga unang nahihinog na ubas,” samakatuwid, simula ng panahon ng pag-aani ng ubas.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: mataba o payat
  rationale: Pinananatili ang kongkretong paghahambing ng Hebreo, na tumutukoy sa pagiging mataba o hindi mataba ng lupa; likas ding gamitin sa Filipino ang “matabang lupa.”
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: kung may mga puno roon o wala
  rationale: Ang עֵץ ay maaaring mangahulugang puno o kahoy. Sa paglalarawan sa katangian ng lupain, “mga puno” ang pinakadiretso, habang itinatala sa talababa ang posibleng diwa ng kahoy na magagamit.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: Magpakatatag kayo
  rationale: Naihahayag nito ang mapanghikayat at bahagyang reflexive na lakas ng pandiwa nang hindi nililimitahan ang kahulugan sa tapang lamang.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: kumuha kayo ng ilan sa bunga ng lupain
  rationale: Ang מִן ay nagpapahiwatig ng pagkuha mula sa ani; ang “ilan sa bunga” ay malinaw at hindi idinaragdag sa teksto ang kontekstuwal na ideya ng pagdadala pabalik.
- source_word: וְהַיָּמִים יְמֵי בִּכּוּרֵי עֲנָבִים
  choice: Noon ay panahon ng mga unang nahihinog na ubas
  rationale: Natural na salaysay sa modernong Filipino na malinaw na naghahatid ng pana-panahong tala, habang pinananatili ang diwa ng unang pagkahinog ng mga ubas.
