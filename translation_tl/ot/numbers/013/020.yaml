revisions:
- from: at kung ang lupain ay mataba o payat, kung may mga puno roon o wala. Magpakatatag kayo, at kumuha kayo ng ilan sa bunga ng lupain.” Noon ay panahon ng mga unang nahihinog na ubas.[a]
  to: At ano ang kalagayan ng lupain—mataba ba ito o mahirap,[a] may mga puno ba rito o wala?[b] Magpakatatag kayo at kumuha kayo ng ilan sa bunga ng lupain.” Ang panahong iyon ay panahon ng mga unang nahihinog na ubas.[c]
  rationale: Ibinalik ang nawawalang pambungad na tanong ng Hebreo at pinalitan ang di-idiomatikong “payat” sa pangunahing teksto ng “mahirap,” na karaniwang paglalarawan sa lupang hindi mabunga. Ang literal na pagbasa ay pinanatili sa talababa. Idinagdag din ang talababa para sa ambigwidad ng עֵץ (‘puno’/‘kahoy’), at inayos ang mga panandang talababa upang tumugma sa mga salitang tinutukoy.
