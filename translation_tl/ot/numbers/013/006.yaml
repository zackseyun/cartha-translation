- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyong Filipino ng pangalan; dito ay tumutukoy ito sa liping nagmula kay Juda.
- source_word: כָּלֵב
  choice: Caleb
  rationale: Karaniwang anyong ginagamit sa Filipino para sa pangalang pantangi.
- source_word: בֶּן
  choice: anak ni
  rationale: Tinutukoy ng ugnayang construct ang tuwirang ama ni Caleb. Ang “anak ni” ang maikli at likas na katumbas sa Filipino.
- source_word: יְפֻנֶּה
  choice: Jefune
  rationale: Karaniwang anyong Filipino ng pangalang pantangi, na angkop sa baybay at bigkas ng modernong Filipino.
