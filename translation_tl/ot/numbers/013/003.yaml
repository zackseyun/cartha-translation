id: NUM.13.3
reference: Numbers 13:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: tl
  text: Kaya isinugo sila ni Moises mula sa ilang ng Paran ayon sa utos ni Yahweh.[a] Lahat sila ay mga lalaking pinuno ng mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “ayon sa salita ni Yahweh.” Literal sa Hebreo: “ayon sa bibig ni Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “mga pinuno ng mga Israelita.” Literal sa Hebreo: “mga ulo ng mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: isinugo
  rationale: Ang pandiwa ay nagsasaad ng pagpapadala ni Moises sa mga kinatawan; natural at marangal sa salaysay ang “isinugo.”
- source_word: מִמִּדְבַּר פָּארָן
  choice: mula sa ilang ng Paran
  rationale: Ang מִדְבָּר ay lupain sa labas ng sakahan o pamayanan at hindi kailangang lubhang tigang; ang “ilang” ang maikli at karaniwang katumbas sa Filipino.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang idyomang literal na “sa bibig ni Yahweh” ay nangangahulugang ayon sa kaniyang sinabi o iniutos; malinaw na ipinahahayag ng “ayon sa utos” ang kapahintulutan at tagubilin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang Yahweh sa halip na palitan ng titulong “PANGINOON.”
- source_word: כֻּלָּם אֲנָשִׁים
  choice: Lahat sila ay mga lalaki
  rationale: Pinananatili ang diin sa kabuuan ng pangkat at ang panlalaking pagtukoy sa mga kinatawan.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: mga pinuno ng mga anak ni Israel
  rationale: Ang “mga pinuno” ay natural na katumbas ng literal na “mga ulo,” habang pinananatili ng “mga anak ni Israel” ang pampamilyang katawagan sa Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili ito sa transliterasyong Yahweh nang hindi nagpapasok ng pamalit na titulo.
- issue: Kasarian at katayuan ng mga kinatawan
  choice: mga lalaking pinuno ng mga anak ni Israel
  alternative: mga pinuno ng mga Israelita
  rationale: Malinaw na tinutukoy ng אֲנָשִׁים ang mga lalaki, at ang רָאשֵׁי ay nagsasaad ng kanilang pagiging pinuno. Pinananatili rin ang “mga anak ni Israel” bilang tunay na anyo ng pampamilyang katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ilang” para sa heograpiyang biblikal, “isinugo” para sa salaysay, at “mga lalaking pinuno” upang likas na maipahayag ang parehong kasarian at tungkulin.
