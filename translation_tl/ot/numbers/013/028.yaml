translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Pinanatili ang mariing pagbabago ng tono sa “Ngunit,” gayundin ang dalawang paglalarawan sa mga lungsod: matibay ang mga tanggulan at napakalalaki ang mga lungsod.'
