base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: tl
  text: Ngunit malakas ang mga taong naninirahan sa lupain, at ang mga lungsod ay may napakatitibay na mga tanggulan at napakalalaki. Nakita rin namin doon ang mga inapo ni Anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak ni Anak.” Ang pananalitang Hebreo ay tumutukoy sa mga nagmula kay Anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: Ngunit
  rationale: Nagpapakilala ito ng matinding pagsalungat o paglilimita sa magandang ulat tungkol sa lupain sa naunang talata. Likas at malinaw sa modernong Tagalog ang “Ngunit.”
- source_word: עַז
  choice: malakas
  rationale: Tumutukoy sa lakas at pagiging mahirap daigin ng mga naninirahan; hindi nito ipinapalagay na likas silang mabangis.
- source_word: הָעָם הַיֹּשֵׁב בָּאָרֶץ
  choice: ang mga taong naninirahan sa lupain
  rationale: Natural na inililipat sa Tagalog ang kolektibong “bayan/mga tao” at ang participial na parirala bilang “mga taong naninirahan.”
- source_word: וְהֶעָרִים בְּצֻרוֹת גְּדֹלֹת מְאֹד
  choice: at ang mga lungsod ay napakatibay ng tanggulan at napakalalaki
  rationale: Ipinahahayag ang depensibong lakas ng mga lungsod at ang matinding diin ng מְאֹד sa laki ng mga ito, nang hindi nililimitahan ang kuta sa pader lamang.
- source_word: וְגַם
  choice: rin
  rationale: Minamarkahan ang karagdagang nakababahalang detalye sa natural na ayos ng pangungusap sa Tagalog.
- source_word: יְלִדֵי הָעֲנָק
  choice: mga inapo ni Anak
  rationale: Ang pariralang konstrukto ay tumutukoy sa angkan o mga nagmula kay Anak; malinaw at natural ang “mga inapo” sa modernong Tagalog.
- source_word: רָאִינוּ שָׁם
  choice: Nakita ... namin doon
  rationale: Ang ganap na pandiwa sa salaysay ay natural na isinasalin sa aspektong naganap, habang pinananatili ang diin sa lugar sa pamamagitan ng “doon.”
