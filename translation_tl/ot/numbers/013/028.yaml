  source_fidelity: 'Tumpak ang pangunahing diwa: mariing paglilimita, lakas ng mga naninirahan, malalaking lungsod, at pagkakita sa mga inapo ni Anak. Gayunman, ang “ang mga lungsod ay napakatibay ng tanggulan” ay hindi natural na predikasyon sa modernong Filipino at bahagyang lumalabo kung ang inilalarawan ay ang mga lungsod bilang pinatibay o ang tibay ng kanilang mga tanggulan.'
