  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: tl
  text: Nag-ulat sila sa kanya at nagsabi[a], “Pumasok kami sa lupain kung saan mo kami isinugo. Tunay ngang umaagos doon ang gatas at pulot, at ito ang bunga nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang kasunod na bahagi: “At ang lupain ay talagang umaagos ng gatas at pulot.” Nagbibigay-diin ang Hebreong וְגַם sa pahayag tungkol sa kasaganaan ng lupain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ
  choice: Nag-ulat sila
  rationale: Ang piel ng ספר ay nangangahulugang magsalaysay o mag-ulat. Ang “nag-ulat” ay natural sa pormal na pagbibigay nila ng ulat kay Moises.
- source_word: לוֹ
  choice: sa kanya
  rationale: Panghalip lamang ang nasa Hebreo. Bagaman si Moises ang tinutukoy ayon sa konteksto, pinananatili rito ang panghalip.
- source_word: וַיֹּאמְרוּ
  choice: at sinabi
  rationale: Tuwirang pinananatili ang karaniwang pagkakasunod ng salaysay sa Hebreo.
- source_word: בָּאנוּ
  choice: Pumasok kami
  rationale: Maaaring mangahulugan ang בוא na pumaroon, dumating, o pumasok. Sa ulat tungkol sa pagpasok nila sa lupain, malinaw at natural ang “pumasok kami.”
- source_word: אֶל הָאָרֶץ אֲשֶׁר שְׁלַחְתָּנוּ
  choice: sa lupaing pinuntahan namin dahil isinugo mo kami roon
  rationale: Inilalahad nito ang lupain bilang destinasyon ng pagsusugo, habang iniiwasan ang hindi natural na Tagalog na literal na pagkakasunod ng sugnay.
- source_word: וְגַם
  choice: Tunay ngang
  rationale: Pinagsasama nito ang pagdaragdag at mariing pagpapatunay ng וְגַם sa natural na modernong Tagalog.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: umaagos doon ang gatas at pulot
  rationale: Pinananatili ang larawang Hebreo ng kasaganaan. Idinagdag ang “doon” upang malinaw sa Tagalog na ang lupain ang inilalarawang sagana.
- source_word: הִוא
  choice: doon
  rationale: Ang pambabaeng panghalip ay tumutukoy sa lupain. Sa Tagalog, mas natural na ipahayag ang ugnayang ito sa pamamagitan ng lokatibong “doon” kaysa sa tahasang panghalip.
- source_word: וְזֶה פִּרְיָהּ
  choice: at ito ang bunga nito
  rationale: Direktang ipinakikita ang dalang bunga bilang katibayan, gaya ng deiktikong demonstratibo sa Hebreo.
