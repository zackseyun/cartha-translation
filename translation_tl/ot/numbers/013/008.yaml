translation_notes:
  register: Maikli at marangal na modernong Filipino, na pinananatili ang anyo ng talaan. Hindi isinama ang mga talababa ng English POB dahil ang unang paliwanag ay hindi tumutugma sa marker na nasa English main text, at ang ikalawa ay tumatalakay lamang sa pagkakaiba ng mga baybay sa Ingles. Sa Filipino, “Hosea” ang malinaw at nakasanayang anyo; hindi kailangan ng talababa tungkol sa English spelling.
