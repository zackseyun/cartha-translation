  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa talaan ng mga kinatawan, ipinapakita ng לְ kasama ng מַטֶּה ang kinabibilangang lipi. Likas sa modernong Filipino ang “mula sa lipi ni” at angkop sa paulit-ulit na balangkas ng listahan.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Karaniwang anyong Filipino ng pangalan ng tao at ng liping nagmula sa kanya.
- source_word: הוֹשֵׁעַ
  choice: Hosea
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa anyong nakasanayan sa Filipino; ang konteksto at talababa ang naglilinaw na siya ang taong tatawaging Josue sa Bilang 13:16.
- source_word: בִּן
  choice: anak ni
  rationale: Natural at maikling katumbas sa Filipino ng Hebreong genealogical construction.
- source_word: נוּן
  choice: Nun
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang anyong Filipino.
