    issue: Hindi likas at posibleng malabo ang “Magsugo ka para sa iyo ng mga lalaki.”
    rationale: Sa Tagalog, ang “para sa iyo” sa ganitong puwesto ay maaaring ikabit sa “mga lalaki,” na para bang ang mga lalaki ang ipinadadala tungo o para kay Moises. Ang pag-uuna rito bilang “Para sa iyong sarili” ay nagpapanatili sa לְךָ ngunit nililinaw na ito ay pang-abay sa utos.
  - severity: low
