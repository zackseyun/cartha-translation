    rationale: Ang אֲבֹתָיו ay may isahang panghalip na tumutukoy sa bawat lalaking isinusugo. Ang “kanyang mga ninuno” ay natural na Tagalog sa loob ng “tig-isang lalaki” at mas malapit sa anyo ng Hebreo.
