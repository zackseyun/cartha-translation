revisions:
- from: “Magsugo ka para sa iyo ng mga lalaki[a] upang siyasatin nila ang lupain ng Canaan na ibinibigay ko sa mga anak ni Israel.[b] Magsugo kayo ng tig-isang lalaki mula sa bawat lipi ng kanilang mga ninuno—bawat isa ay isang pinuno sa kanila.”[c]
  to: “Para sa iyong sarili, magsugo ka ng mga lalaki[a] upang siyasatin nila ang lupain ng Canaan na ibinibigay ko sa mga anak ni Israel.[b] Magsugo kayo ng tig-isang lalaki mula sa bawat lipi ng kanyang mga ninuno—bawat isa ay isang pinuno sa kanila.”[c]
  rationale: Inayos ang unang sugnay upang maging malinaw at natural sa Filipino nang hindi inaalis ang לְךָ. Inayos din ang panghalip sa “kanyang mga ninuno” upang maipakita ang distributibong isahang pagtukoy ng Hebreo. Walang binago sa kahulugan, mga pangalan, mga pangunahing termino, o mga anchor ng talababa.
