id: NUM.13.2
reference: Numbers 13:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: tl
  text: “Para sa iyong sarili, magsugo ka ng mga lalaki[a] upang siyasatin nila ang lupain ng Canaan na ibinibigay ko sa mga anak ni Israel.[b] Magsugo kayo ng tig-isang lalaki mula sa bawat lipi ng kanyang mga ninuno—bawat isa ay isang pinuno sa kanila.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “galugarin” o “tiktikan.” Ang pandiwang Hebreo ay tumutukoy sa pagsisiyasat o pagmamanman sa lupain.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Israel” ay karaniwang Hebreong katawagan sa buong bayang Israel.
    reason: cultural_note
  - marker: c
    text: O “pinuno ng lipi” o “prinsipe.” Ang salitang Hebreo ay tumutukoy sa isang kinikilalang pinuno sa kanilang pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: Magsugo ka para sa iyo
  rationale: Pinananatili ang לְךָ bilang “para sa iyo” upang hindi alisin ang posibleng diwa ng personal na pagtatalaga, pahintulot, o diin kay Moises, kahit bahagyang di-karaniwan ang pahayag sa Tagalog.
- source_word: אֲנָשִׁים
  choice: mga lalaki
  rationale: Tumutukoy rito sa mga lalaking kinatawan ng mga lipi; ang tahasang pagtukoy sa kasarian ay kaayon ng Hebreong אֲנָשִׁים.
- source_word: וְיָתֻרוּ
  choice: upang siyasatin nila
  rationale: Ang תור ay nangangahulugang galugarin o magsiyasat para sa layunin ng pagmamanman. Ang “siyasatin” ay natural at dignidad na Filipino at hindi nililimitahan ang kahulugan sa lihim na paniniktik.
- source_word: אֶרֶץ כְּנַעַן
  choice: ang lupain ng Canaan
  rationale: Tuwirang inilalarawan ang construct phrase at pinananatili ang אֶרֶץ bilang “lupain.”
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: na ibinibigay ko
  rationale: Inihahayag ng participle נֹתֵן ang kasalukuyan o nagpapatuloy na pagkakaloob; ang “ibinibigay ko” ay nagpapanatili sa aspektong ito.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang pampamilya at tipanang idyomang בני ישראל sa natural na Tagalog; tumutukoy ito sa buong bayang Israel, hindi lamang sa mga anak na lalaki.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: tig-isang lalaki mula sa bawat lipi
  rationale: Ang “tig-isa” ay likas na paraan sa Tagalog upang ihatid ang distributibo at mariing pag-uulit ng Hebreo nang hindi nagiging matigas ang pangungusap.
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: mula sa bawat lipi ng kanilang mga ninuno
  rationale: Ang מַטֶּה ay “lipi,” at ang אֲבֹתָיו ay tumutukoy sa angkan ng mga ninuno. Ginawang pangmaramihan ang panghalip ayon sa natural na kolektibong pagtukoy sa mga isusugo.
- source_word: תִּשְׁלָחוּ
  choice: Magsugo kayo
  rationale: Ang pangmaramihang pandiwa ay pinananatili bilang utos sa “kayo,” kasunod ng unang isahang utos kay Moises.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: bawat isa ay isang pinuno sa kanila
  rationale: Ang נָשִׂיא ay maaaring pinuno, pangulo ng lipi, o prinsipe; “pinuno” ang pinakamalinaw at hindi labis na tiyak na modernong katumbas.
theological_decisions:
- issue: Diwa ng לְךָ sa utos ng Diyos
  choice: Pinanatili sa pangunahing teksto bilang “para sa iyo”
  alternative: Alisin bilang idyomatikong kataga, o isalin na “alang-alang sa iyo”
  rationale: Hindi tiyak kung ang לְךָ ay simpleng idiomatikong diin, nagpapahiwatig ng personal na pakikilahok ni Moises, o may bahid ng pahintulot. Ang literal ngunit mauunawaang anyo ay nagpapanatili sa tensiyong ito.
- issue: Pagpapakahulugan sa בני ישראל
  choice: “mga anak ni Israel” sa pangunahing teksto
  alternative: “mga Israelita” o “sambahayan ng Israel”
  rationale: Pinananatili nito ang pampamilya at tipanang larawan ng Hebreo. Nililinaw sa talababa na ang parirala ay tumutukoy sa buong bayan upang maiwasang ipakahulugang mga lalaki lamang.
- issue: Sino ang tinutukoy ng pangmaramihang תִּשְׁלָחוּ
  choice: Isinalin na “Magsugo kayo” nang hindi tinutukoy kung sino ang kasama ni Moises
  alternative: Pakapalin bilang “Ikaw at ang iba pang mga pinuno ay magsugo” o gawing isahan na “magsugo ka”
  rationale: Pangmaramihan ang anyong Hebreo, ngunit hindi tahasang pinapangalanan sa talata ang lahat ng kausap. Pinananatili ng salin ang gramatikal na bilang at ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na dignidad ngunit madaling maunawaan. Pinanatili ang bahagyang di-karaniwang “para sa iyo” dahil mahalaga ang לְךָ, samantalang ginamit ang likas na “tig-isang” para sa distributibong pag-uulit. Ang “siyasatin” ay mas malawak at hindi kasing-layon ng “tiktikan”; inilagay ang mga alternatibo sa talababa. Ang bawat marker [a], [b], at [c] ay nasa pangunahing teksto.
