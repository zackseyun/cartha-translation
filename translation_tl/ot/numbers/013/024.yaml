base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: tl
  text: Ang lugar na iyon ay tinawag na Lambak ng Escol[a] dahil sa kumpol na pinutol ng mga anak ni Israel mula roon.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “wadi ng Escol” o “bangin ng Escol.” Ang Hebreong naḥal ay maaaring tumukoy sa isang pana-panahong daluyan ng tubig o sa lambak na kaugnay nito.
    reason: lexical_alternative
  - marker: b
    text: Ang pangalang Escol ay nangangahulugang “kumpol” sa Hebreo. Ipinangalan ang lugar dahil sa kumpol na pinutol mula roon ng mga anak ni Israel.
    reason: cultural_note
  - marker: c
    text: O “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: Ang lugar na iyon
  rationale: Likas sa modernong Tagalog at pinananatili ang tiyak at demonstratibong pagtukoy sa lugar na nabanggit na.
- source_word: קָרָא
  choice: ay tinawag
  rationale: Bagaman aktibong 3ms ang anyong Hebreo, di-tiyak ang gumagawa sa idyomang pagpapangalan; natural itong isalin sa balintiyak sa Tagalog.
- source_word: נַחַל
  choice: Lambak
  rationale: Maaaring tumukoy ang salita sa pana-panahong ilug-ilugan, bangin, o kaugnay na lambak. Ang “Lambak” ang malinaw at karaniwang heograpikong katumbas dito, habang inilalahad sa talababa ang iba pang posibilidad.
- source_word: אֶשְׁכּוֹל
  choice: Escol
  rationale: Pangalan ito ng lugar sa pariralang “Lambak ng Escol”; ginamit ang anyong transliterado na madaling basahin sa Tagalog.
- source_word: עַל אֹדוֹת
  choice: dahil sa
  rationale: Malinaw na ipinahahayag ng parirala ang dahilan ng pagpapangalan.
- source_word: הָאֶשְׁכּוֹל
  choice: kumpol
  rationale: Ang pangngalan ay “kumpol” o “bungkos”; ipinauunawa ng naunang talata na kumpol ito ng ubas, kaya hindi na idinagdag sa pangunahing teksto ang “ng ubas.”
- source_word: אֲשֶׁר כָּרְתוּ
  choice: na pinutol
  rationale: Tumpak at natural para sa pagputol ng kumpol mula sa puno ng ubas.
- source_word: מִשָּׁם
  choice: doon
  rationale: Natural na Tagalog na nagpapanatili sa pagtukoy sa nasabing lugar; sa balintiyak na pangungusap, hindi kailangang literal na ulitin ang “mula.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pamilyal na larawan ng Hebreo at likas ding katawagan sa dignified na Tagalog; maaaring sabihing “mga Israelita,” gaya ng nasa talababa.
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Walang pangunahing usaping doktrinal, ngunit pinananatili ng napiling anyo ang pamilyal at tipanang himig ng Hebreo nang hindi ipinapalagay na mga anak lamang na lalaki ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pangalang Escol at ang pamilyal na katawagang “mga anak ni Israel,” habang inilagay sa mga talababa ang leksikal at heograpikong mga alternatibo.
