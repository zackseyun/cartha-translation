base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: tl
  text: Isinugo sila ni Moises upang siyasatin ang lupain ng Canaan[a], at sinabi niya sa kanila, “Magtungo kayo sa Negev sa rutang ito, at umahon kayo sa bulubunduking lupain[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tiktikan ang lupain ng Canaan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga bundok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Isinugo
  rationale: Likas at marangal na salin ng pagpapadala ni Moises sa mga lalaking may tiyak na atas.
- source_word: לָתוּר
  choice: upang siyasatin
  rationale: Ipinahahayag ang masusing paggalugad at pagsusuri sa lupain nang hindi ipinapalagay na lihim lamang ang kanilang gawain; pinananatili sa talababa ang posibleng saling “tiktikan.”
- source_word: אֶרֶץ כְּנָעַן
  choice: ang lupain ng Canaan
  rationale: Tuwirang pinananatili ang buong katawagang Hebreo para sa teritoryo.
- source_word: עֲלוּ זֶה
  choice: Umahon kayo rito
  rationale: Pinagsasama ang utos na עלה at ang adberbiyal na gamit ng זֶה sa natural na Tagalog na nagpapahiwatig ng itinurong ruta.
- source_word: בַּנֶּגֶב
  choice: sa Negev
  rationale: Pinananatili ang heograpikong pangalang Negev at hindi labis na tinutukoy kung “papasok” o “daraan,” yamang maaaring markahan ng ב ang lugar o ruta.
- source_word: וַעֲלִיתֶם
  choice: at pagkatapos ay umakyat kayo
  rationale: Ang anyong may waw ay nagpapatuloy sa naunang utos; nililinaw ng “pagkatapos” ang sunod na bahagi ng ruta.
- source_word: הָהָר
  choice: sa bulubundukin
  rationale: Sa kontekstong heograpiko, tumutukoy ang isahan na kolektibong anyo sa mataas o mabundok na rehiyon, hindi lamang sa isang bundok.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “siyasatin” kaysa “tiktikan” sa pangunahing teksto upang hindi agad magdagdag ng makabagong diwang lihim o militar, habang inilagay ang leksikal na alternatibo sa talababa. Pinanatili ang pangalang “Negev” at ipinaliwanag ito nang maikli.
