- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa talaan ng mga kinatawan ng mga lipi, ipinakikilala ng לְ ang liping pinagmulan ng lalaking pinangalanan. Likas at malinaw sa modernong Tagalog ang “mula sa lipi ni.”
- source_word: אָשֵׁר
  choice: Aser
  rationale: Isinalin sa karaniwang anyong Tagalog ng pangalang biblikal na Asher.
- source_word: סְתוּר
  choice: Setur
  rationale: Tuwirang transliterasyon sa baybay at bigkas na angkop sa Tagalog.
- source_word: בֶּן
  choice: anak ni
  rationale: Ang construct na בֶּן kasunod ng pangalan ay nagpapahayag ng kaugnayang ama at anak; natural sa Tagalog ang “anak ni.”
- source_word: מִיכָאֵל
  choice: Micael
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal na Michael.
