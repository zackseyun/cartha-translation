lexical_decisions:
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa talaan ng mga kinatawan, ang מַטֶּה ay tumutukoy sa isang lipi ng Israel. Ang “mula sa lipi ni” ay likas sa modernong Filipino at ipinapahayag na ang taong binanggit ay nagmula sa liping iyon.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Pangalan ng patriyarka at ng lipi; pinanatili ang nakagawiang anyong Filipino/Biblikal.
- source_word: שָׁפָט
  choice: Safat
  rationale: Pangalang pantangi; tinumbasan sa baybay na madaling bigkasin sa Filipino habang inilalapit sa tunog ng Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang pariralang Filipino para sa Hebreong ugnayang genealogical na “anak ng.”
- source_word: חוֹרִי
  choice: Hori
  rationale: Pangalang pantangi; pinanatili sa transliterasyong malinaw at natural sa Filipino.
