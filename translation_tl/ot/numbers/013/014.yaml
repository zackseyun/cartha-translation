- source_word: לְ/מַטֵּה
  choice: mula sa lipi ni
  rationale: Sa talaang ito, ipinakikilala ng לְ ang liping kinakatawan ng bawat lalaki. Likas at malinaw sa Filipino ang “mula sa lipi ni.”
- source_word: נַפְתָּלִי
