  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: נַחְבִּי
  choice: Nahbi
  rationale: Isinalin sa baybay-Filipino ang pangalang Hebreo nang hindi binibigyan ng kahulugang wala sa teksto.
- source_word: בֶּן
  choice: na anak ni
  rationale: Likas na katumbas sa Filipino ng Hebreong genealogical construction; malinaw nitong ipinapahayag ang ugnayan nang hindi nadaragdagan ang teksto.
- source_word: וָפְסִי
  choice: Vofsi
  rationale: Pagsasatitik sa Filipino ng pangalang Hebreo; ginagamit ang “f” para sa פּ na may dagesh na kasunod ng sheva sa anyong ito, ayon sa karaniwang tradisyonal na pagbasa ng pangalan.
