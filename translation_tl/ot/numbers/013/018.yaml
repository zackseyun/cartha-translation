id: NUM.13.18
reference: Numbers 13:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/רְאִיתֶ֥ם אֶת הָ/אָ֖רֶץ מַה הִ֑וא וְ/אֶת הָ/עָם֙ הַ/יֹּשֵׁ֣ב עָלֶ֔י/הָ הֶ/חָזָ֥ק הוּא֙ הֲ/רָפֶ֔ה הַ/מְעַ֥ט ה֖וּא אִם רָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: tl
  text: Tingnan ninyo kung ano ang kalagayan ng lupain[a], at kung ang mga taong naninirahan doon[b] ay malalakas o mahihina, kakaunti o marami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kung ano ito.” Ang diwa ay alamin ang katangian o kalagayan ng lupain.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “ang mga taong naninirahan sa ibabaw nito,” isang karaniwang paraan ng pagtukoy sa mga naninirahan sa isang lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Tingnan ninyo
  rationale: Ang anyong ito ng ראה ay utos sa konteksto. Ang “Tingnan ninyo” ay natural na Filipino at nagpapahiwatig ng masusing pag-alam o pagsisiyasat.
- source_word: הָאָרֶץ מַה הִוא
  choice: kung ano ang kalagayan ng lupain
  rationale: Literal na “kung ano ito,” ngunit sa konteksto ay hinihingi ang pagtatasa sa katangian o kondisyon ng lupain. Malinaw at natural sa Filipino ang “kalagayan ng lupain.”
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: ang mga taong naninirahan doon
  rationale: Ang parirala ay tumutukoy sa mga taong nakatira sa lupain. Iniiwasan ng “doon” ang di-natural na literal na “sa ibabaw nito” habang pinananatili ang tinutukoy na lugar.
- source_word: הֶחָזָק
  choice: malalakas
  rationale: Ang חזק ay tumutukoy sa lakas; ang pangmaramihang “malalakas” ay umaayon sa “mga taong.”
- source_word: הֲרָפֶה
  choice: mahihina
  rationale: Ang רפה ay kasalungat ng חזק at dito ay nangangahulugang kulang sa lakas.
- source_word: הַמְעַט
  choice: kakaunti
  rationale: Tumutukoy ito sa maliit na bilang at tuwirang katapat ng רָב.
- source_word: רָב
  choice: marami
  rationale: Tumutukoy ito sa malaking bilang at natural na kaibahan ng “kakaunti.”
- source_word: אִם
  choice: o
  rationale: Sa magkatambal na di-tuwirang tanong, natural sa Filipino ang mga pares na “malalakas o mahihina” at “kakaunti o marami.”
