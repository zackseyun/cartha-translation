base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: tl
  text: Dumating sila sa Lambak ng Eshcol[a]. Doon ay pumutol sila ng isang sanga ng ubas[b] na may iisang kumpol ng mga ubas, at binuhat iyon ng dalawa sa kanila sa isang pasanan. Kumuha rin sila ng ilan sa mga granada at mga igos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Wadi ng Eshcol” o “Batis ng Eshcol.” Ang salitang Hebreo na נַחַל ay maaaring tumukoy sa bangin o lambak na dinadaluyan ng tubig paminsan-minsan, gayundin sa batis.
    reason: lexical_alternative
  - marker: b
    text: O “isang supang ng ubas na may isang kumpol ng ubas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: Lambak ng Eshcol
  rationale: Maaaring tumukoy ang נַחַל sa bangin, lambak na dinadaluyan ng tubig kapag tag-ulan, o batis. Ang “Lambak” ang pinakamalinaw na likas na tawag sa heograpikong lugar sa pangunahing teksto, habang inilalahad sa talababa ang ibang posibilidad.
- source_word: זְמוֹרָה
  choice: isang sanga ng ubas
  rationale: Tiyak na tumutukoy ang salita sa sanga o supang ng punong ubas. Mas malinaw sa Tagalog ang “sanga ng ubas” kaysa “sanga” lamang.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: iisang kumpol ng mga ubas
  rationale: Pinananatili ng “iisang” ang diin sa bilang na isa, at natural ang pariralang “kumpol ng mga ubas” sa modernong Tagalog.
- source_word: וַיִּשָּׂאֻהוּ
  choice: binuhat iyon
  rationale: Ang panghalip na isahan ay tumutukoy sa pinutol na sanga at kumpol bilang isang buo. Ang “binuhat” ay angkop sa aktuwal na pagdadala nito sa pingga.
- source_word: בַמּוֹט
  choice: sa isang pingga
  rationale: Ang מוֹט ay isang mahabang kahoy o baras na ginagamit sa pagbubuhat. Ang “pingga” ay maikli at nauunawaan sa konteksto ng pagdadala ng mabigat na bagay.
- source_word: בִּשְׁנָיִם
  choice: ng dalawa sa kanila
  rationale: Literal itong “ng/sa dalawa.” Nililinaw ng “sa kanila” na dalawa mula sa pangkat ang nagbuhat, nang hindi nagdaragdag ng hindi tahasang detalye.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: Kumuha rin sila ng ilan sa mga granada at mga igos
  rationale: Ipinahihiwatig ng Hebreo na kumuha rin sila ng mga bungang ito. Ang pag-uulit ng kilos ay natural sa Tagalog at pinananatili ng “ilan” ang di-tiyak na dami.
