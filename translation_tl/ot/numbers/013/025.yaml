  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: tl
  text: Pagkaraan ng apatnapung araw, bumalik sila mula sa paggalugad sa lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa pagsisiyasat sa lupain” o “mula sa paniniktik sa lupain.” Ang pandiwang Hebreo ay tumutukoy sa pagsusuri sa lupain bilang bahagi ng isang misyong pagmamanman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Bumalik sila
  rationale: Ang Qal wayyiqtol na ikatlong panauhang maramihan ng שׁוב ay nagsasalaysay ng kasunod na pangyayari. Likas sa salaysay na Tagalog ang “Bumalik sila” nang hindi na tahasang isinasalin ang pang-ugnay.
- source_word: מִתּוּר
  choice: matapos galugarin
  rationale: Ang infinitive construct ng תור na may מִן ay tumutukoy sa pagbabalik mula sa gawaing pagsusuri o paggalugad. Ipinahahayag ng “matapos galugarin” ang natapos na misyong pagmamanman nang walang likas na negatibong pahiwatig ng “maniktik.”
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ang אָרֶץ sa tiyak na teritoryong sinuri, hindi sa buong daigdig. Ang “lupain” ay malinaw at angkop sa konteksto.
- source_word: מִקֵּץ
  choice: sa katapusan ng
  rationale: Ang pariralang מִן kasama ng קֵץ ay tumutukoy sa puntong natapos ang isang takdang panahon. Pinananatili ng “sa katapusan ng” ang anyo at diwa ng Hebreo.
- source_word: אַרְבָּעִים יוֹם
  choice: apatnapung araw
  rationale: 'Karaniwang ekspresyon ito ng sukat ng panahon: ang bilang na apatnapu kasama ng pangngalang “araw.”'
