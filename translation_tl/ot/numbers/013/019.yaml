  source_fidelity: Tapat ang salin sa mga tanong ng Hebreo tungkol sa katangian ng lupain, sa kabutihan o kasamaan nito, at sa uri ng mga lunsod na tinitirhan ng mga tao. Ang paggamit ng pangmaramihang “mga tao roon,” “nila,” at “sila” ay natural na paraan sa Filipino upang ihayag ang kolektibong pang-isahang anyo sa Hebreo nang hindi lumilikha ng hindi likas na panghalip.
  naturalness: Makabago, malinaw, at angkop ang rehistro. Ang “ano ang kalagayan” ay maayos na katumbas ng tanong na “ano ang uri/kalagayan,” at ang “mga lugar na may tanggulan” ay madaling maunawaan.
  terminology: Ang “lupain,” “mga lunsod,” “mga kampo,” at “mga lugar na may tanggulan” ay angkop at pinananatili ang malawak na kahulugan ng Hebreo. Hindi nito nililimitahan ang “mabuti o masama” sa pagkamayabong lamang. Wasto rin ang angkla ng talababa at ang alternatibong “kampamento … kuta.”
