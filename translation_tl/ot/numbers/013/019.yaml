source:
  edition: WLC
  text: וּ/מָ֣ה הָ/אָ֗רֶץ אֲשֶׁר הוּא֙ יֹשֵׁ֣ב בָּ֔/הּ הֲ/טוֹבָ֥ה הִ֖וא אִם רָעָ֑ה וּ/מָ֣ה הֶֽ/עָרִ֗ים אֲשֶׁר הוּא֙ יוֹשֵׁ֣ב בָּ/הֵ֔נָּה הַ/בְּ/מַֽחֲנִ֖ים אִ֥ם בְּ/מִבְצָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: tl
  text: At ano ang kalagayan ng lupaing tinitirhan ng mga tao roon? Mabuti ba iyon o masama? At ano ang kalagayan ng mga lunsod na tinitirhan nila? Nakatira ba sila sa mga kampo o sa mga lugar na may tanggulan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga kampamento … sa mga kuta.” Inihahambing sa Hebreo ang mga pamayanang tulad ng kampo at ang mga lugar na may tanggulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה
  choice: At ano ang kalagayan
  rationale: Ipinahahayag nito sa natural na Tagalog ang tanong tungkol sa uri o kondisyon ng lupain at ng mga lunsod.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Karaniwang salin ito sa konteksto ng pagsisiyasat sa Canaan at mas angkop kaysa sa mas malawak na “bansa.”
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: na tinitirhan ng mga tao roon
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo ang tinutukoy nitong mga naninirahan; iniiwasan ng salin ang di-natural at malabong pang-isahang panghalip sa Tagalog.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: Mabuti ba iyon o masama?
  rationale: Pinananatili ang malawak na paghahambing ng Hebreo at hindi ito nililimitahan sa pagiging mataba o mahina ng lupa.
- source_word: הֶעָרִים
  choice: mga lunsod
  rationale: Ang “mga lunsod” ay angkop sa mga pamayanang sinusuri at sa kasunod na usapin kung may tanggulan ang mga ito.
- source_word: הַבְּמַחֲנִים
  choice: sa mga kampo
  rationale: Pinananatili ang ideya ng mga pamayanang tulad ng kampo, na salungat sa mga lugar na pinatibay.
- source_word: בְּמִבְצָרִים
  choice: sa mga lugar na may tanggulan
  rationale: Malinaw nitong ipinahahayag ang mga pinatibay o depensibong pamayanan nang hindi ipinapalagay na ang tinutukoy ay mga hiwalay na kuta lamang.
