  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tao roon” at “nila/sila” upang natural na maipahayag ang kolektibong pang-isahan sa Hebreo; pinanatili ang malawak na kahulugan ng “mabuti o masama” at ang pagkakaiba ng mga kampo at mga pinatibay na lugar.
