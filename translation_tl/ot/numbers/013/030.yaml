  text: וַ/יַּ֧הַס כָּלֵ֛ב אֶת הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר עָלֹ֤ה נַעֲלֶה֙ וְ/יָרַ֣שְׁנוּ אֹתָ֔/הּ כִּֽי יָכ֥וֹל נוּכַ֖ל לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: tl
  text: Pagkatapos, pinatahimik[a] ni Caleb ang bayan sa harap ni Moises at sinabi, “Umakyat nga tayo[b] at angkinin iyon, sapagkat talagang kaya natin iyon.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinatahimik nang lubos” o “pinatahan.” Ang pandiwang Hebreo ay maaaring mangahulugang pinatahimik, pinatahan, o pinatigil sa pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “umakyat, tayo ay talagang aakyat”—isang kayariang nagbibigay-diin sa pandiwa.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sapagkat kayang-kaya natin iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: pinatahimik
  rationale: Ipinahihiwatig ng pandiwa ang pagpapatahimik o pagpapatigil sa ingay ng isang pangkat. Likas sa makabagong Filipino ang “pinatahimik” at hindi nito kailangang magpahiwatig ng marahas na pagsupil.
- source_word: אֶת־הָעָם
  choice: ang bayan
  rationale: Tumutukoy ang עָם sa nagkakatipong pamayanan ng Israel, kaya mas angkop ang kolektibong “bayan” kaysa sa “mga tao” lamang.
- source_word: אֶל־מֹשֶׁה
  choice: sa harap ni Moises
  rationale: Bagaman karaniwang nangangahulugang “patungo kay” ang אֶל, inilalarawan dito ang pagpapatahimik sa bayan sa presensiya ni Moises. Malinaw at natural sa Filipino ang “sa harap ni Moises.”
- source_word: עָלֹה נַעֲלֶה
  choice: Umakyat nga tayo
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa pag-akyat. Ipinahahayag ng “nga” ang mariing paghimok nang hindi idinaragdag ang di-tahasang ideya na “kaagad.”
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: at angkinin iyon
  rationale: Sa konteksto ng pagpasok sa Canaan, ang יָרַשׁ ay pagkuha at paghawak sa lupain bilang pag-aari. Pinananatili ng “angkinin iyon” ang pambabaeng panghalip na tumutukoy sa lupain nang hindi labis na binibigyang-kahulugan bilang simpleng pagwasak o pananakop.
- source_word: כִּי יָכוֹל נוּכַל
  choice: sapagkat talagang kaya natin iyon
  rationale: Ang inuulit na anyo ay mariing nagpapahayag ng kakayahan. Natural na naihahatid ng “talagang kaya natin” ang matibay na pagtitiwala ni Caleb.
- source_word: לָהּ
  choice: iyon
  rationale: Ang hulaping pambabaeng isahan ay bumabalik sa lupain. Sa Filipino, ang “iyon” ay maaaring tumukoy sa lupain at, ayon sa konteksto, sa gawaing pag-angkin dito nang hindi nilulutas nang labis ang saklaw ng panghalip.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong Israel at ang “nga” upang maipahayag nang natural ang mariing paghimok. Iniwasan ang mga salitang may labis na militar o denominasyonal na pakahulugan.
