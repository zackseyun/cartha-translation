base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: tl
  text: Kaya naghatid sila sa mga anak ni Israel ng masamang balita tungkol sa lupaing kanilang ginalugad,[a] na sinasabi, “Ang lupaing dinaanan namin upang galugarin ay isang lupaing lumalamon sa mga naninirahan doon,[b] at lahat ng taong nakita namin roon ay mga lalaking napakalalaki.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinuri” o “minanmanan”; sa kontekstong ito, posible rin ang “naniktik.”
    reason: lexical_alternative
  - marker: b
    text: O “umuubos sa mga naninirahan dito.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mga lalaking may sukat,” ibig sabihin, mga lalaking kapansin-pansin ang laki o tangkad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: naghatid ... ng masamang balita
  rationale: Ang idyoma ay literal na ‘maglabas ng masamang ulat.’ Ang ‘naghatid ng masamang balita’ ay likas sa modernong Tagalog at pinananatili ang diwang ipinabatid nila ito sa bayan; inilalagay sa talababa ang mas matinding posibilidad na paninirang-puri.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Ang ‘lupain’ ay angkop sa heograpikal at tipanang konteksto at mas natural dito kaysa paulit-ulit na ‘lupa.’
- source_word: תָּרוּ / לָתוּר
  choice: ginalugad / galugarin
  rationale: Ipinahahayag nito ang pagsisiyasat sa lupain nang hindi kinakailangang ipakahulugang lihim na paniniktik.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang tahasang anyong Hebreo at ang nakaugaliang katawagan sa sambayanan ng Israel.
- source_word: עָבַרְנוּ בָהּ
  choice: dinaanan namin
  rationale: Natural na Tagalog para sa pagdaan nila sa loob ng lupain habang sinisiyasat ito.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: isang lupaing lumalamon sa mga naninirahan doon
  rationale: Pinananatili ng ‘lumalamon’ ang marahas at matalinghagang lakas ng Hebreong אֹכֶלֶת.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: mga lalaking napakalalaki
  rationale: Malinaw nitong ipinahihiwatig ang pambihirang pisikal na laki at iniiwasan ang ‘may mataas na katayuan,’ na maaaring tumukoy sa dangal o posisyon.
theological_decisions:
- issue: Ang panlalaking kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang anyo ng pinagmulan bilang karaniwang tipanang katawagan sa buong sambayanan, nang hindi ipinapalagay na mga lalaki lamang ang tinutukoy.
- issue: Kung ang דִּבָּה ay simpleng masamang ulat o tahasang paninirang-puri
  choice: masamang balita
  alternative: paninirang-puri
  rationale: Hindi tahasang nilulutas ng pangunahing teksto kung gaano kasinungaling o kasadya ang ulat; ang mas matinding pagbasa ay pinananatili sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matingkad na talinghagang ‘lumalamon’ at ang tradisyonal ngunit malinaw na ‘mga anak ni Israel.’
