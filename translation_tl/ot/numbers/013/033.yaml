  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: tl
  text: At doon nakita namin ang mga Nephilim—ang mga anak ni Anak, mula sa mga Nephilim. Sa sarili naming paningin ay para kaming mga tipaklong, at gayon din kami sa paningin nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: mga Nephilim
  rationale: Isinalin sa pamamagitan ng transliterasyon sapagkat hindi tiyak ang tinutukoy ng terminong Hebreo at may kaakibat itong pinagtatalunang tradisyon. Hindi ipinagpalagay sa pangunahing teksto na nangangahulugan itong “mga higante.”
- source_word: בְּנֵי עֲנָק
  choice: mga anak ni Anak
  rationale: Pinananatili ang malapit na anyong Hebreo at ang pangalang pantangi; sa konteksto, maaari itong tumukoy sa mga inapo o angkan ni Anak.
- source_word: מִן הַנְּפִלִים
  choice: na nagmula sa mga Nephilim
  rationale: Ipinahahayag ang pinaka-malamang na diwa ng pinagmulan o angkan, habang hindi higit na tinutukoy ang eksaktong ugnayan.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: Sa sarili naming paningin, para kaming
  rationale: Likas na Filipino para sa idyomang tumutukoy sa sariling pagtataya o pagkakakita, hindi sa literal na pagbabago ng anyo.
- source_word: כַּחֲגָבִים
  choice: parang mga tipaklong
  rationale: Ang tipaklong ay angkop sa paghahambing na nagpapahiwatig ng labis na kaliitan; mas natural ito sa Filipino kaysa sa “balang” sa kontekstong ito.
- source_word: וְכֵן
  choice: at gayon din
  rationale: Pinananatili ang paghahambing at paralelismo sa pagitan ng kanilang sariling paningin at ng ipinapalagay nilang paningin ng iba.
- source_word: בְעֵינֵיהֶם
  choice: sa paningin nila
  rationale: Natural na idyomang Filipino na kaagapay ng “sa sarili naming paningin” at nagpapanatili sa retorikal na simetriya.
theological_decisions:
- issue: Kahulugan ng נְפִילִים
  choice: Nephilim
  alternative: mga higante; mga nahulog
  rationale: Hindi tiyak ang etimolohiya at tinutukoy ng salita. Pinananatili ng transliterasyon ang tunay na kalabuan at iniiwasang magpasok ng isang tiyak na interpretasyong hindi hinihingi ng tekstong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “Nephilim” at ang magkatapat na pariralang “sa sarili naming paningin / sa paningin nila,” habang ginawang natural ang idyomang Hebreo.
