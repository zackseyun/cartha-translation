  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: tl
  text: Ngunit sinabi ng mga lalaking sumama sa kanya sa pag-akyat, “Hindi natin kayang lusubin ang bayang iyon, sapagkat mas malakas sila kaysa sa atin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Ngunit ... ang mga lalaki
  rationale: Ipinahihiwatig ng וְ ang pagsalungat sa naunang pahayag ni Caleb; natural na ipinapahayag ito ng “Ngunit,” habang pinananatili ng “mga lalaki” ang kongkretong kahulugan ng אֲנָשִׁים.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: mga lalaking sumama sa kanya sa pag-akyat
  rationale: Tinutukoy ng parirala ang mga kasamang umakyat ni Caleb. Natural sa Tagalog ang “sumama sa kanya sa pag-akyat” at hindi nito dinaragdagan ang diwa.
- source_word: אָמְרוּ
  choice: sinabi
  rationale: Ang payak na aspektong naganap ay angkop sa Hebrew qatal sa salaysay.
- source_word: לֹא נוּכַל
  choice: Hindi natin kayang
  rationale: Tuwirang ipinapahayag nito ang kawalan ng kakayahan na dala ng יכל; ang inklusibong “natin” ay tumutukoy sa mga Israelita bilang nagsasalita at kausap.
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: umahon laban sa mga taong iyon
  rationale: Pinananatili ng “umahon” ang literal na diwa ng עלה, samantalang ipinahahayag ng “laban sa” ang malinaw na konteksto ng pakikipagsagupa. Ang “mga taong iyon” ay natural na tumutukoy sa mga naninirahang kababanggit lamang.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan at nagpapanatili ng marangal na estilong pangkasulatan nang hindi lipas ang wika.
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: mas malakas sila kaysa sa atin
  rationale: Bagaman isahan ang panghalip sa Hebrew dahil kolektibo ang הָעָם, natural sa Tagalog ang maramihang “sila.” Pinananatili ng “mas ... kaysa” ang tahasang paghahambing.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang larawang “umahon” ngunit nilinaw sa mismong teksto ang kontekstong militar sa pamamagitan ng “laban sa,” kaya hindi kailangan ang talababa. Ginamit ang “sapagkat” para sa bahagyang pormal ngunit madaling maunawaang rehistro.
