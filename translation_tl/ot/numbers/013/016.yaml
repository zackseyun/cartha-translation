base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: tl
  text: Ito ang mga pangalan ng mga lalaking isinugo ni Moises upang siyasatin ang lupain.[a] At tinawag ni Moises na Josue si Hosea na anak ni Nun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “galugarin” o “manmanan ang lupain.” Ang pandiwang Hebreo ay maaaring tumukoy sa paggalugad o pagsisiyasat upang makakuha ng impormasyon.
    reason: lexical_alternative
  - marker: b
    text: Ang Hosea ay ang naunang anyo ng pangalan ni Josue; dito ay tinawag siya ni Moises na Josue.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Ito ang mga pangalan
  rationale: Likas na modernong Tagalog na panimula sa pagtukoy sa listahang kababanggit lamang.
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Tumutukoy sa mga lalaking kinatawang pinili sa konteksto, kaya pinananatili ang tiyak na kasarian ng Hebreo.
- source_word: שָׁלַח
  choice: isinugo
  rationale: Angkop sa pormal ngunit likas na salaysay at malinaw na nagsasaad na ipinadala sila para sa isang atas.
- source_word: לָתוּר
  choice: upang siyasatin
  rationale: Saklaw nito ang paggalugad at pagmamanman para makakuha ng impormasyon, nang hindi labis na ipinapalagay ang lihim o mapanlinlang na diwa ng 'maniktik'.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Karaniwang salin sa konteksto ng lupaing patutunguhan ng Israel at mas angkop kaysa sa mas malawak na 'bansa'.
- source_word: וַיִּקְרָא
  choice: tinawag ... na
  rationale: Malapit sa Hebreong pandiwa at ipinahihiwatig ang pagbibigay ng pangalan nang hindi pinatitindi sa tahasang 'pinalitan ang pangalan'.
- source_word: הוֹשֵׁעַ
  choice: Hosea
  rationale: Transliterasyong malinaw sa mga mambabasang Tagalog at sapat na ipinag-iiba sa pangalang Josue; kumakatawan sa Hebreong Hôšēaʿ.
- source_word: בִּן נוּן
  choice: anak ni Nun
  rationale: Natural na anyo ng patronimiko sa Tagalog.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Tradisyonal at malawak na nakikilalang anyo ng pangalang Joshua sa Tagalog.
