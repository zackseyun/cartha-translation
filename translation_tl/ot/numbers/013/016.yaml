translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang “siyasatin” upang mapanatili ang lawak ng Hebreong תור; ginamit ang karaniwang Tagalog na anyong “Josue” para sa יְהוֹשֻׁעַ.
