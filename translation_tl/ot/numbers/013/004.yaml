  yaml_path: translation/ot/numbers/013/004.yaml
  text: 'And these were their names: from the tribe of Reuben, Shammua son of Zaccur.'
translation:
  language: tl
  text: 'At ito ang kanilang mga pangalan: mula sa lipi ni Ruben, si Shamua na anak ni Zacur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito
  rationale: Pinananatili ng “At” ang pagpapatuloy ng salaysay at listahan, at natural sa Filipino ang isahang “ito” kapag tumutukoy sa sumusunod na talaan bilang kabuuan.
- source_word: שְׁמוֹתָם
  choice: ang kanilang mga pangalan
  rationale: Tuwirang ipinahahayag ang maramihang “mga pangalan”; likas sa Filipino na gamitin ang sugnay na “ito ang kanilang mga pangalan” nang hindi nagdaragdag ng katumbas ng pandiwang “were.”
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa konteksto ng listahan, ipinakikilala nito ang taong kumakatawan sa isang lipi. Ang “mula sa lipi ni” ay malinaw at natural sa modernong Filipino.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: שַׁמּוּעַ
  choice: Shamua
  rationale: Isinalin sa baybay-Filipino sa pamamagitan ng transliterasyon, nang hindi binibigyan ng pakahulugang wala sa talata.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang natural na katumbas sa Filipino ng Hebreong pormulang genealogical.
- source_word: זַכּוּר
  choice: Zacur
  rationale: Transliterasyon na naaayon sa madaling basahing baybay sa Filipino.
