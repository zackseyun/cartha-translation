source:
  edition: WLC
  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: tl
  text: Ang Amalek ay naninirahan sa lupain ng Negev[a]; ang mga Heteo, mga Jebuseo, at mga Amoreo ay naninirahan sa kabundukan; at ang mga Cananeo ay naninirahan sa tabi ng dagat at sa kahabaan ng Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “Negev” bilang “katimugang lupain,” ngunit malamang na tumutukoy rito sa tiyak na tuyong rehiyon sa timog ng Canaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Pinanatili bilang pangalan ng pangkat ayon sa karaniwang transliterasyon sa Filipino.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: naninirahan
  rationale: Ipinahahayag ng participle ng ישב ang matatag o palagiang paninirahan; natural at marangal sa modernong Filipino ang “naninirahan.”
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: sa lupain ng Negev
  rationale: Pinananatili ang אֶרֶץ bilang “lupain” at ang Negev bilang tiyak na pangalang heograpiko, habang kinikilala sa talababa ang posibleng kahulugang “katimugang lupain.”
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: ang mga Heteo / mga Jebuseo / mga Amoreo / mga Cananeo
  rationale: Bagaman anyong isahang kolektibo ang mga katawagang Hebreo, likas sa Filipino na gamitin ang “mga” kapag tumutukoy sa mga pangkat ng tao.
- source_word: בָּהָר
  choice: sa kabundukan
  rationale: Sa kontekstong heograpiko, tumutukoy ang הַר sa bulubundukin o mataas na rehiyon, hindi lamang sa isang bundok.
- source_word: עַל הַיָּם
  choice: sa tabi ng dagat
  rationale: Malinaw at natural na ipinapahayag ang lokasyong katabi ng dagat nang hindi dinaragdagan ang teksto ng mas tiyak na “baybayin.”
- source_word: עַל יַד הַיַּרְדֵּן
  choice: sa kahabaan ng Jordan
  rationale: Ang idyomang literal na “sa kamay/tagiliran ng Jordan” ay nagpapahiwatig ng lugar na katabi at umaabot sa kahabaan nito.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinili ang “naninirahan” upang ipakita ang matatag na paninirahan, at gumamit ng mga semicolon upang malinaw na paghiwalayin ang tatlong heograpikong pangkat.
