base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: tl
  text: Pumasok nawa ang mga tubig na ito na nagdadala ng sumpa sa loob ng iyong katawan[a], upang mamaga ang tiyan at mangayayat ang hita. At sasabihin ng babae, “Amen, amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sa iyong mga panloob na bahagi, upang mamaga ang tiyan at bumagsak ang hita.” Mahirap unawain ang Hebreong pananalita at maaaring isa itong eupemismo para sa pinsalang may kaugnayan sa kakayahang magkaanak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: Pumasok nawa
  rationale: Sa konteksto ng panunumpa at sumpa, ipinahahayag ng anyo ang isang taimtim na kahilingan o sumpang magkakabisa, hindi lamang isang payak na pangyayari sa hinaharap.
- source_word: הַמַּיִם הַמְאָרְרִים הָאֵלֶּה
  choice: ang mga tubig na ito na nagdadala ng sumpa
  rationale: Pinananatili ng “mga tubig” ang maramihang anyo at ritwal na himig ng Hebreo. Ang participle mula sa ארר ay tumutukoy sa tubig bilang tagapagdala o tagapagpatupad ng sumpa, hindi bilang mapait lamang.
- source_word: בְּמֵעַיִךְ
  choice: sa loob ng iyong katawan
  rationale: Ang מֵעֶה ay tumutukoy sa mga panloob na bahagi o laman-loob. Natural at malinaw sa makabagong Tagalog ang pariralang ito nang hindi nagiging labis na klinikal.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: upang mamaga ang tiyan
  rationale: Ipinahahayag ng infinitive ang bunga o layon ng sumpa. Ang “tiyan” ang tuwirang katumbas dito, habang hindi ipinapalagay na tiyak na sinapupunan ang tinutukoy.
- source_word: וְלַנְפִּל יָרֵךְ
  choice: at manghina ang hita
  rationale: Literal na kaugnay ng “pagbagsak” ang pandiwa, ngunit mahirap at malamang idyomatiko ang buong parirala. Ipinahahayag ng “manghina” ang pinsala sa katawan nang hindi tinutukoy ang isang tiyak na kondisyong medikal.
- source_word: יָרֵךְ
  choice: hita
  rationale: Ang pangunahing kahulugan ay “hita” o “balakang.” Pinananatili ng “hita” ang eupemistikong pananalita ng Hebreo sa halip na tahasang tukuyin ang mga sangkap sa pag-aanak.
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: At sasabihin ng babae
  rationale: Ito ay pagpapatuloy ng itinakdang tugon sa ritwal. Natural sa Tagalog ang panghinaharap bilang pormulang nag-uutos kung ano ang sasabihin.
- source_word: אָמֵן אָמֵן
  choice: Amen, amen
  rationale: Pinananatili ang inuulit na liturhikal at taimtim na pagpapatibay ng babae.
theological_decisions:
- issue: Eksaktong epekto ng sumpa sa katawan
  choice: Isinalin bilang “mamaga ang tiyan at manghina ang hita” nang hindi tinutukoy ang isang tiyak na karamdamang reproduktibo.
  alternative: “malaglag ang dinadala,” “mawasak ang sinapupunan,” o “manghina ang mga sangkap sa pag-aanak”
  rationale: Mahirap unawain at malamang eupemistiko ang Hebreong parirala. Maliwanag na inilalarawan nito ang isang sumpang nagdudulot ng pinsala sa katawan, na maaaring may kaugnayan sa kakayahang magkaanak, ngunit hindi nito tiyak na pinapangalanan ang resulta. Pinananatili ng salin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa isang taimtim na ritwal. Iniwasan ang sobrang klinikal o tahasang anatomikal na pananalita, at pinanatili ang pag-uulit sa “Amen, amen.”
