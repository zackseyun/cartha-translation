  source_fidelity: Ang draft ay wastong naghahatid ng tatlong pangkat at ng utos na alisin sila mula sa kampo. Gayunman, mas malinaw na ipahayag sa Tagalog na ang mga anak ni Israel ang gagawa ng pagpapalabas. Ang “ritwal na marumi” ay mas tumpak para sa טָמֵא kaysa sa payak na “marumi,” na maaaring magpahiwatig ng pisikal o moral na dumi.
  naturalness: Ang “may tumutulong likido sa katawan” ay hindi likas at maaaring magpahiwatig lamang ng anumang likidong tumutulo. Ang “may di-karaniwang pag-agos mula sa katawan” ay mas natural at mas malapit sa teknikal na gamit ng זָב sa batas tungkol sa ritwal na kalinisan.
  terminology: Pinananatili ang “mga anak ni Israel” bilang tradisyonal at malapit na katumbas. Ang “malubhang sakit sa balat” ay maingat na salin ng צָרוּעַ; ang talababa ay wastong nagbabala laban sa pagtukoy rito bilang makabagong ketong lamang. Ang “ritwal na marumi dahil sa bangkay” ay nililinaw ang katayuang pangkultiko nang hindi ito minomoralisa.
