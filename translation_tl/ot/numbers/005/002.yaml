    rationale: Ang זָב ay tumutukoy sa isang taong may abnormal na discharge sa konteksto ng ritwal na batas. Mas angkop ang “may di-karaniwang pag-agos mula sa katawan,” na hindi rin nagdaragdag ng di-nasasabi ng teksto.
