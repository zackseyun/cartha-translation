id: NUM.5.2
reference: Numbers 5:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: tl
  text: “Iutos mo sa mga anak ni Israel na paalisin nila mula sa kampo ang bawat may malubhang sakit sa balat[a], ang bawat may di-karaniwang pag-agos mula sa katawan[b], at ang bawat ritwal na marumi dahil sa bangkay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang bawat may ketong.” Ang terminong Hebreo ay tumutukoy sa iba’t ibang malubhang karamdaman sa balat sa konteksto ng mga batas sa ritwal na kalinisan, hindi lamang sa sakit na tinatawag ngayong ketong o Hansen’s disease.
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa di-karaniwang pag-agos ng likido mula sa katawan.
    reason: lexical_clarification
lexical_decisions:
- source_word: צַו
  choice: Iutos mo
  rationale: Pinananatili ang lakas ng pautos na isahan na nakatuon kay Moises at likas sa modernong Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit sa literal na anyo ng Hebreo at pamilyar na katawagan sa Bibliya para sa sambayanang tipan.
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: na palabasin sa kampo
  rationale: Malinaw na ipinahahayag ang pagpapalabas mula sa kampo nang hindi nagdaragdag ng maparusang diwa.
- source_word: כָּל צָרוּעַ
  choice: ang bawat may malubhang sakit sa balat
  rationale: Ang termino ay mas malawak kaysa sa makabagong Hansen's disease; iniiwasan ng salin ang maling tiyak na medikal na pagkakakilanlan.
- source_word: וְכָל זָב
  choice: ang bawat may tumutulong likido sa katawan
  rationale: Ipinahahayag ang abnormal na pag-agos ng likido sa katawan sa konteksto ng mga batas sa ritwal na kalinisan nang hindi labis na tinutukoy ang uri nito.
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: ang bawat marumi dahil sa bangkay
  rationale: Isinasalin ang idyomatikong gamit ng נֶפֶשׁ bilang patay na katawan at pinananatili ang ritwal na kahulugan ng טָמֵא.
theological_decisions:
- issue: Kahulugan ng ritwal na karumihan
  choice: Gamitin ang “marumi” bilang katayuang ritwal, hindi bilang hatol sa moralidad.
  alternative: “nadungisan” o “ritwal na di-malinis”
  rationale: Ang konteksto ay kabanalan ng kampo at katayuan ayon sa kautusan, hindi kinakailangang personal na kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang tradisyonal na “mga anak ni Israel,” ngunit nilinaw sa natural na Tagalog ang mga teknikal na katawagan sa ritwal na kalinisan.
