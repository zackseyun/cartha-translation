lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang pandiwang דּבר sa pormulang nagpapakilala ng banal na pahayag ay tuwirang isinalin bilang “nagsalita,” na likas at marangal sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay tumutukoy sa taong pinatutungkulan ng pagsasalita; “kay” ang likas na katumbas bago ang pangalang Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: לֵאמֹר
  choice: 'at sinabi:'
  rationale: Sa pormulang וידבר ... לאמר, likas sa Tagalog ang “nagsalita ... at sinabi:” bilang pambungad sa tuwirang pahayag na susunod, nang hindi nawawala ang dalawang elementong pandiwa ng Hebreo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapahayag dito bilang personal na pangalan at hindi bilang pamagat, habang kinikilala sa talababa ang tradisyonal at alternatibong anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inilipat ang panandang [a] sa “Yahweh,” sapagkat ang talababa ay nagpapaliwanag sa banal na pangalan, hindi sa pangalang Moises. Ginamit ang tutuldok upang natural na ihanda ang pahayag sa susunod na talata.
