  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: tl
  text: At ang bawat handog na mula sa lahat ng banal na kaloob[b] ng mga anak ng Israel[a], na ihaharap[c] nila sa pari, ay magiging kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita.” Sa literal, “mga anak na lalaki ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga banal na bagay” o “mga sagradong handog.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ilalapit.” Sa konteksto ng paghahandog, maaari rin itong mangahulugang “ihahandog”; sa literal, “dadalhin nilang malapit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: handog
  rationale: Tumutukoy ito sa isang kaloob o ambag na ibinukod at iniharap, kadalasan bilang bahagi ng nauukol sa pari. Ang “handog” ay likas at malinaw sa makabagong Tagalog nang hindi gumagamit ng teknikal at di-pamilyar na katawagan.
- source_word: קָדְשֵׁי
  choice: mga banal na kaloob
  rationale: Ang pangmaramihang anyong construct ng קֹדֶשׁ ay tumutukoy rito sa mga bagay o kaloob na itinalaga bilang banal. Ipinahahayag ng “mga banal na kaloob” ang konteksto nang mas malinaw kaysa sa payak na “mga banal na bagay.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  rationale: Pinananatili nito ang pampamilyang anyo ng Hebreo at ang nakaugaliang katawagan sa bayang tipan. Ipinaliliwanag sa talababa na ang בְנֵי ay literal na “mga anak na lalaki,” habang ang “mga Israelita” ay isang mas maayos ngunit di-gaanong pormal na alternatibo.
- source_word: יַקְרִיבוּ
  choice: ihaharap
  rationale: Sa konteksto ng paghahandog, ang Hiphil ng קרב ay nangangahulugang maglapit o magharap. Ang “ihaharap” ay natural sa Tagalog at pinananatili ang kultikong diwa; ang literal na larawan ng paglalapit ay nasa talababa.
- source_word: לַכֹּהֵן
  choice: sa pari
  rationale: Ipinakikita ng pang-ukol ang paring pinag-uukulan o tumatanggap ng banal na kaloob. Nililinaw ng kasunod na sugnay na ito ay magiging pag-aari niya.
- source_word: לוֹ יִהְיֶה
  choice: mapapasakaniya
  rationale: Ang idyomang Hebreo ay nagpapahayag ng legal na pagmamay-ari. Ang “mapapasakaniya” ay maikli, natural, at malinaw sa Tagalog.
theological_decisions:
- issue: Pagpapahayag sa katawagang בְנֵי יִשְׂרָאֵל para sa sambayanan ng tipan
  choice: mga anak ng Israel
  alternative: mga Israelita; mga anak na lalaki ng Israel
  rationale: Pinananatili ng pangunahing teksto ang pampamilyang larawan ng Hebreo nang hindi nagiging mabigat sa makabagong Tagalog. Hindi itinatago ang panlalaking anyo ng בְנֵי, sapagkat tahasan itong binabanggit sa talababa; hindi rin ipinipilit na ang katawagan ay tumutukoy lamang sa mga lalaking Israelita, yamang ginagamit ang parirala bilang pangalan ng buong sambayanan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pari,” “handog,” at “ihaharap” bilang mga karaniwang salitang angkop sa kontekstong ritwal. Ang ayos ng pangungusap ay bahagyang pormal upang mapanatili ang legal at panrelihiyong himig ng talata.
