  naturalness: Marangal at malinaw ang “papanumpain,” “sumiping,” at “karumihan.” Ang binagong pananalita ay mas natural na modernong Tagalog, lalo na sa pariralang tumutukoy sa katayuang may-asawa at sa pagpapahayag ng pagkalibre mula sa mga tubig.
  terminology: 'Pinananatili ang legal-ritwal na tono: “pari,” “papanumpain,” “sumiping,” “lumihis,” “karumihan,” at “mapapait na tubig.” Hindi isinasalin ang paglihis bilang “pangangalunya,” kaya hindi pinasisisikip ang metapora at legal-ritwal na wika ng Hebreo.'
