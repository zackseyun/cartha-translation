revisions:
- from: Pagkatapos, papanumpain siya ng pari at sasabihin sa babae, “Kung walang lalaking sumiping sa iyo, at kung hindi ka lumihis tungo sa karumihan habang nasa ilalim ng iyong asawa,[a] hindi ka mapipinsala ng mapapait na tubig na ito na nagdadala ng sumpa.[b]”
  to: Pagkatapos, papanumpain siya ng pari at sasabihin sa babae, “Kung walang lalaking sumiping sa iyo, at kung hindi ka lumihis tungo sa karumihan habang kasal ka sa iyong asawa,[a] maging malaya ka mula sa mapapait na tubig na ito na nagdadala ng sumpa.[b]”
  rationale: Binago ang salin ng הִנָּקִי upang mapanatili ang lawak ng Hebreong pandiwa at maiwasang tukuyin ang isang partikular na uri ng pinsala. Pinalitan ang literal ngunit di-likas na “nasa ilalim ng iyong asawa” ng natural na Tagalog na nagpapahayag ng idyomatikong kahulugang pangkasal, habang iniiwan ang literal na anyo at paliwanag sa talababa. Inayos din ang talababa para direktang maitala ang participial na paglalarawan sa mga tubig bilang mga nagdadala ng sumpa.
