base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: tl
  text: Pagkatapos, papanumpain siya ng pari at sasabihin sa babae, “Kung walang lalaking sumiping sa iyo, at kung hindi ka lumihis tungo sa karumihan habang kasal ka sa iyong asawa,[a] maging malaya ka mula sa mapapait na tubig na ito na nagdadala ng sumpa.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “sa ilalim ng iyong asawa,” isang idyomang tumutukoy sa kalagayan at pananagutan ng babae sa bigkis ng pag-aasawa.
    reason: cultural_note
  - marker: b
    text: Literal, “ang mapapait na tubig, ang mga nagdadala ng sumpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ אֹתָהּ
  choice: papanumpain siya
  rationale: 'Pinananatili nito ang causative na diwa ng Hiphil: ipasasailalim ng pari ang babae sa isang panunumpa.'
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: Kung walang lalaking sumiping sa iyo
  rationale: Ang “sumiping” ay likas at marangal na eupemismo sa modernong Tagalog para sa pakikipagtalik, gaya ng gamit ng שׁכב sa konteksto.
- source_word: שָׂטִית
  choice: lumihis
  rationale: Pinananatili ang metapora ng pagtalikod o paglihis nang hindi agad pinapalitan ng mas tiyak na salitang “nangalunya.”
- source_word: טֻמְאָה
  choice: karumihan
  rationale: Sinasaklaw ng salita ang ritwal at moral na impurity nang hindi nililimitahan sa isa lamang sa mga ito.
- source_word: תַּחַת אִישֵׁךְ
  choice: habang nasa ilalim ng iyong asawa
  rationale: Malapit ito sa Hebreong idyoma at ipinahihiwatig ang katayuan at pananagutan sa bigkis ng pag-aasawa; nililinaw sa talababa upang maiwasan ang maling literal na pagkaunawa.
- source_word: הִנָּקִי
  choice: hindi ka mapipinsala ng
  rationale: Sa kontekstong ito, ipinahahayag ng anyo ang pagiging ligtas o malaya sa epekto ng tubig. Mas natural ito sa Tagalog kaysa sa literal na “maging malinis mula sa.”
- source_word: מִמֵּי הַמָּרִים
  choice: mapapait na tubig na ito
  rationale: Pinananatili ang pangmaramihang anyo at ritwal na pananalita ng Hebreo.
- source_word: הַמְאָרֲרִים
  choice: na nagdadala ng sumpa
  rationale: Ipinahahayag ang participial at causative na diwa nang hindi tinutukoy ang eksaktong mekanismo ng sumpa.
theological_decisions:
- issue: Wika tungkol sa ipinapalagay na kasalanan ng babae
  choice: Panatilihin ang mga larawang “sumiping,” “lumihis,” at “karumihan.”
  alternative: Tahasang isalin bilang “nangalunya.”
  rationale: Malinaw sa konteksto ang pinaghihinalaang pagtataksil sa asawa, ngunit hindi tahasang ginagamit ng talata ang karaniwang terminong Hebreo para sa pangangalunya. Pinananatili ng salin ang legal at ritwal na pananalita at ang lawak ng orihinal.
- issue: Epekto ng mapait na tubig
  choice: “na nagdadala ng sumpa”
  alternative: “ang mga tubig ng kapaitan, ang mga nagpapasapit ng sumpa”
  rationale: Pinananatili ang ugnayan ng tubig at sumpa nang hindi nagdaragdag ng paliwanag tungkol sa paraan ng bisa nito.
- issue: Kahulugan ng הִנָּקִי
  choice: Ihayag bilang kaligtasan sa pinsalang dulot ng tubig.
  alternative: “maging malaya” o “mapawalang-sala.”
  rationale: Maaaring tumukoy ang pandiwa sa pagiging malinis, walang sala, o ligtas sa bunga. Sa ritwal na konteksto, ang “hindi ka mapipinsala” ay natural ngunit hindi ginagawang hatol ng pari ang mismong pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pari” para sa כֹּהֵן, “sumiping” bilang mahinahong eupemismo, at “papanumpain” upang mapanatili ang legal-ritwal na tono. Inilagay ang lahat ng marker ng talababa sa mismong teksto.
