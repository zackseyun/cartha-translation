base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: tl
  text: at may lalaking sumiping sa kanya na may paglabas ng semilya[a], at nalingid ito sa paningin ng kanyang asawa; at siya ay nanatiling lingid, at siya ay naging marumi, at walang saksing laban sa kanya[b], at hindi siya nahuli[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “paghiga ng binhi,” isang pariralang tumutukoy sa pakikipagtalik na may paglabas ng semilya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “walang saksi tungkol sa kanya.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin, “hindi siya dinakip”; nauunawaan ito ng ilan na “hindi siya pinuwersa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: may lalaking sumiping sa kanya
  rationale: Ang “sumiping sa” ay likas at marangal na modernong Tagalog para sa seksuwal na diwa ng שׁכב אֶת, habang pinananatili ang tahasang pagtukoy sa isang lalaki.
- source_word: שִׁכְבַת זֶרַע
  choice: na may paglabas ng semilya
  rationale: Inilalahad nito ang konkretong sangkap na “binhi/semilya” sa Hebreo at ang kaugnayan nito sa batas tungkol sa karumihan, sa halip na gawing pangkalahatan lamang na “seksuwal.”
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: nalingid ito sa paningin ng kanyang asawa
  rationale: Pinananatili ng “nalingid” ang pasibong diwa at ng “sa paningin” ang Hebreong idyoma, ngunit malinaw pa rin sa karaniwang mambabasa.
- source_word: וְנִסְתְּרָה
  choice: at siya ay nakubli
  rationale: Sinusunod nito ang pambabaeng anyo ng pandiwa at hindi tiyakang nagpapasya kung siya ay nagtago, itinago, o nanatiling di-nabunyag.
- source_word: וְהִיא נִטְמָאָה
  choice: at naging marumi siya
  rationale: Ang “naging marumi” ay nagpapanatili sa bokabularyo ng ritwal at legal na karumihan nang hindi dinaragdagan ang retorikal na bigat ng “nadungisan.”
- source_word: וְעֵד אֵין בָּהּ
  choice: at walang saksing laban sa kanya
  rationale: Likas itong legal na pananalita sa Tagalog at ipinahihiwatig ang kawalan ng patotoong makapagpaparatang sa kanya; ang mas neutral na pagbasa ay nasa talababa.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: at hindi siya nahuli
  rationale: Sa konteksto ng lihim at walang saksi, ang “nahuli” ay malinaw na tumutukoy sa hindi pagkakahuli sa pangyayari, habang ang posibleng diwang “sinunggaban/pinuwersa” ay hindi inaalis at inilalagay sa talababa.
theological_decisions:
- issue: Paglalarawan sa נִטְמָאָה bilang wika ng karumihan
  choice: naging marumi siya
  alternative: nadungisan siya
  rationale: Pinananatili ng “marumi” ang kategorya ng tekstong legal at ritwal at hindi agad ginagawang mas moralistiko o emosyonal ang termino.
- issue: Diwa ng וְנִסְתְּרָה
  choice: siya ay nakubli
  alternative: nangyari ito nang lihim / nagtago siya
  rationale: Ang Hebreo ay pambabae at maaaring pasibo o reflexive. Ang salin ay sadyang hindi nagpapasya kung ang babae ang nagtago o kung ang pangyayari at kalagayan niya ay nanatiling lihim.
- issue: Diwa ng לֹא נִתְפָּשָׂה
  choice: hindi siya nahuli
  alternative: hindi siya sinunggaban; hindi siya pinuwersa
  rationale: Ang konteksto ay malakas na sumusuporta sa hindi pagkakahuli o pagkakadiskubre, ngunit maaaring maunawaan ang pandiwa bilang pagsunggab at, ayon sa ilan, pamimilit; kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang anyong putol sa hulihan dahil nagpapatuloy ang kondisyong legal sa kasunod na talata. Ginamit ang “semilya” bilang malinaw at di-malabong katawagang pangkatawan, at “nakubli” upang mapanatili ang tunay na gramatikal at interpretatibong kalabuan ng Hebreo.
