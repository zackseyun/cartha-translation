translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “pari” at “tabernakulo” bilang pamilyar na bokabularyong biblikal. Inilagay ang mga pananda ng talababa kaagad sa mga salitang tinutukoy at inayos sa pagkakasunod na [a], [b], [c].
