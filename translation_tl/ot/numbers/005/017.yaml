base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: tl
  text: Pagkatapos, kukuha ang pari ng banal na tubig[a] at ilalagay ito sa isang sisidlang luwad[b]. Kukuha rin ang pari ng kaunting alabok na nasa sahig ng tabernakulo[c] at ilalagay iyon sa tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sagradong tubig.” Sa Hebreo, ito ay tubig na ibinukod bilang banal para gamitin sa ritwal.
    reason: lexical_alternative
  - marker: b
    text: O, “sisidlang yari sa luwad” o “palayok.”
    reason: lexical_alternative
  - marker: c
    text: O, “lupa ng tabernakulo.” Ang salitang Hebreo ay maaaring tumukoy sa “lupa” o “sahig”; ang “sahig” ay angkop sa tagpo sa loob ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: banal na tubig
  rationale: Tuwirang ipinahahayag ang tubig na itinalaga bilang banal para sa ritwal. Bagaman may mga kaugnay na gamit ang parirala sa ibang tradisyon, hindi iyon idinaragdag sa kahulugan dito.
- source_word: בִּכְלִי חָרֶשׂ
  choice: sa isang sisidlang luwad
  rationale: Ang כְּלִי ay sisidlan, at ang חָרֶשׂ ay tumutukoy sa luwad o palayok; malinaw at marangal sa modernong Filipino ang “sisidlang luwad.”
- source_word: הֶעָפָר
  choice: alabok
  rationale: Saklaw ng עָפָר ang alabok, tuyong lupa, o maluwag na lupa. Ang “alabok” ang pinakatumpak sa ritwal na tagpo nang hindi nagiging kolokyal.
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: mula sa sahig ng tabernakulo
  rationale: Ang קַרְקַע ay maaaring sahig o lupa. Ang “sahig” ay likas sa konteksto ng loob ng tabernakulo, habang pinananatili sa talababa ang alternatibong “lupa.”
- source_word: מִן הֶעָפָר
  choice: kaunting alabok mula sa
  rationale: 'Partitibo ang מִן: bahagi lamang ng alabok ang kukunin. Natural na naipahahayag ito ng “kaunting alabok mula sa.”'
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: kukuha ... kukuha ... at ilalagay
  rationale: Ang magkakasunod na pandiwa ay mga tagubiling ritwal. Ang aspektong kontemplatibo sa Filipino ay natural na naghahayag ng iniutos na gagawin sa ganitong konteksto.
- source_word: הַמָּיִם
  choice: sa tubig
  rationale: Tumutukoy itong muli sa banal na tubig na nabanggit na; sapat at natural ang “sa tubig.”
