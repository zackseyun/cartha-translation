  naturalness: Natural at angkop sa modernong Filipino Tagalog ang “Kukuha ang pari ... at ilalagay ito sa isang sisidlang luwad.” Ang pag-uulit ng “ang pari” sa ikalawang pangungusap ay tumutugma sa estilong prosedural ng Hebreo at malinaw sa Tagalog.
  terminology: Ang “banal na tubig,” “sisidlang luwad,” “alabok,” “sahig,” “tabernakulo,” at “pari” ay angkop na mga katumbas sa kontekstong ritwal. Hindi nagpapataw ang mga ito ng partikular na doktrina.
