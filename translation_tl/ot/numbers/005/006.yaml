source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: tl
  text: 'Sabihin mo sa mga anak ni Israel: Kapag ang isang lalaki o babae ay gumawa ng alinman sa mga kasalanang ginagawa ng tao[a], at sa gayon ay nagtaksil laban sa PANGINOON, may sala ang taong iyon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alinman sa mga kasalanan ng sangkatauhan.” Ang “tao” sa Hebreo ay tumutukoy dito sa mga tao sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sabihin mo
  rationale: Ang Piel imperative ay isang tuwirang utos kay Moises; natural sa modernong Tagalog ang “Sabihin mo” sa pormulang ito.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilya at pangtipang larawan ng Hebreo nang hindi nagiging lipas ang pananalita.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: isang lalaki o babae
  rationale: Malinaw na pinananatili ang tahasang pares na lalaki at babae at ang distributibong saklaw ng batas.
- source_word: כִּי יַעֲשׂוּ
  choice: Kapag ... ay gumawa
  rationale: Ang “Kapag” ay angkop sa kasuistikong batas; ang maramihang pandiwang Hebreo ay nauunawaan nang distributibo kasunod ng “isang lalaki o babae.”
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: alinman sa mga kasalanang ginagawa ng tao
  rationale: Ipinahahayag ang generic na diwa ng הָאָדָם bilang sangkatauhan habang natural na nauunawaan sa Tagalog; nililinaw ng talababa ang saklaw.
- source_word: לִמְעֹל מַעַל
  choice: at sa gayon ay nagtaksil
  rationale: Ang infinitive at kaugnay na pangngalan ay nagpapahiwatig ng pagtataksil o pagsira sa katapatan; “nagtaksil” ang maikli at malinaw na katumbas.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Sa idyomang may מעל, ang pang-ukol ay tumutukoy sa pinagtaksilan. Ginamit ang “Yahweh” upang katawanin nang tahasan ang banal na pangalang יהוה sa pinagmulang teksto.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: nagkasala ang taong iyon
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa mismong tao, hindi sa kaluluwang hiwalay sa katawan; ang אָשֵׁם ay nagsasaad ng pagkakasala at pananagutan.
theological_decisions:
- issue: Paglalarawan sa יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang transliterasyong “Yahweh” ay tuwirang kumakatawan sa personal na pangalang nasa WLC at umiiwas na palitan ito ng titulo.
- issue: Generic na הָאָדָם sa pahayag na legal
  choice: tao, na tumutukoy sa mga tao sa pangkalahatan
  alternative: sangkatauhan
  rationale: Pinananatili ng “tao” ang anyong isahan ng Hebreo, samantalang nililinaw ng talababa na generic at hindi panlalaki lamang ang diwa.
- issue: Diwa ng אָשֵׁם
  choice: nagkasala
  alternative: may sala / naging mananagot
  rationale: Ang anyo ay maaaring tumukoy kapuwa sa pagkakasala at sa kalagayang may pananagutan. Ang “nagkasala” ay natural sa pangungusap ngunit hindi inaalis ang legal na pananagutan sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang legal na pormula, ang tahasang “lalaki o babae,” at ang pampamilyang katawagang “mga anak ni Israel.”
