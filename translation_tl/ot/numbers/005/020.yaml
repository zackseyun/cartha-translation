  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: tl
  text: Ngunit kung lumihis ka habang kasal ka pa sa iyong asawa[a], at nadungisan ka, at may lalaking nakipagtalik sa iyo[b] bukod sa iyong asawa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “habang nasa ilalim ng iyong asawa,” isang idyomang tumutukoy sa bigkis o katayuan ng babae bilang may-asawa.
    reason: cultural_note
  - marker: b
    text: Sa literal, “ibinigay ng isang lalaki sa iyo ang kaniyang paghiga,” isang Hebreong eupemismo para sa pakikipagtalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂטִית
  choice: lumihis ka
  rationale: Pinananatili ng “lumihis” ang metapora ng paglihis sa katapatan sa pag-aasawa nang hindi agad pinapalitan ng mas tahasang interpretasyong “nagtaksil.”
- source_word: תַּחַת אִישֵׁךְ
  choice: habang nakaugnay sa iyong asawa
  rationale: Ang literal na “sa ilalim ng iyong asawa” ay tumutukoy rito sa umiiral na bigkis o kalagayan ng pag-aasawa. Ang “nakaugnay” ay mas natural at marangal sa modernong Tagalog, habang inilalahad sa talababa ang literal na idyoma.
- source_word: נִטְמֵאת
  choice: nadungisan ka
  rationale: Ipinahihiwatig ng anyong Niphal ng טמא ang pagkadungis sa seksuwal at ritwal-legal na diwa. Ang “nadungisan” ay malinaw sa Tagalog at hindi labis na nagpapaliwanag.
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: may lalaking nakipagtalik sa iyo
  rationale: Isa itong Hebreong eupemismo para sa pakikipagtalik. Malinaw at kasalukuyang pananalita ang “nakipagtalik” at hindi nito ikinukubli ang tinutukoy ng legal na pahayag.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: bukod sa iyong asawa
  rationale: Tumpak na ipinapahayag ng “bukod sa” ang pagbubukod na nasa מִבַּלְעֲדֵי at nililinaw na ibang lalaki ang tinutukoy.
theological_decisions:
- issue: Paglalahad sa idyoma ng pagtataksil sa pag-aasawa nang hindi humihigit sa Hebreo
  choice: Panatilihin ang metaporang “lumihis” at gawing malinaw ang kasunod na pagtukoy sa pakikipagtalik
  alternative: Isalin ang unang parirala bilang “nagtaksil ka sa iyong asawa”
  rationale: Pinagsasama ng talata ang metaporikal at eupemistikong pananalita. Ang “lumihis” ay nagpapanatili sa larawan ng pinagmulang teksto, samantalang nililinaw ng kasunod na sugnay ang seksuwal na gawa nang hindi nagdaragdag ng doktrinal o moral na kategoryang wala sa teksto.
- issue: Kahulugan ng תַּחַת sa konteksto ng pag-aasawa
  choice: “habang nakaugnay sa iyong asawa,” na may talababa sa literal na idyoma
  alternative: “habang nasa ilalim ng iyong asawa”
  rationale: Ang literal na “nasa ilalim” ay maaaring hindi likas o maaaring magpahiwatig sa modernong Tagalog ng pisikal na posisyon. Ipinapahayag ng “nakaugnay” ang legal at pangmag-asawang bigkis, habang pinananatili ng talababa ang anyo at posibleng diwa ng Hebreo.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatili ang legal na himig at ang bitin na hulihan ng sugnay, sapagkat nagpapatuloy ang panunumpa sa susunod na talata. Ang “lumihis” ay sadyang nagpapanatili sa metapora; ang “nakipagtalik” naman ay nagbibigay ng kinakailangang linaw sa kasalukuyang mambabasa.
