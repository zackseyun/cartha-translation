  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: tl
  text: Pagkatapos, ilalapit ng pari ang babae at patatayuin siya sa harap ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “YHWH.” Tradisyonal na isinasaling “ang PANGINOON”; maaari ring “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: ilalapit ... ang babae
  rationale: Ang Hiphil ng קרב ay nangangahulugang ‘ilapit’ o ‘iharap.’ Pinananatili ng ‘ilalapit’ ang diwang pisikal ng paglapit; ginawang tahasang ‘ang babae’ ang panghalip upang maging natural at malinaw sa Tagalog.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at likas na salin ng כֹּהֵן sa kontekstong panrelihiyon at legal.
- source_word: וְהֶעֱמִדָהּ
  choice: patatayuin siya
  rationale: Ang Hiphil ng עמד ay may pahiwatig na sanhi, ‘papangyarihing tumayo.’ Ang ‘patatayuin siya’ ay natural na modernong Tagalog at pinananatili ang causative na diwa.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Likas at maikling katumbas na nagsasaad ng pagtayo sa presensiya ng isang persona.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan sa halip na palitan ng titulong ‘PANGINOON,’ habang nililinaw sa talababa ang Hebreong anyo at tradisyonal na salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalan nang hindi ito pinapalitan ng isang titulo; kinikilala sa talababa ang tradisyonal at alternatibong anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at madaling maunawaan. Ginamit ang ‘pari’ at ang likas na ayos na ‘ilalapit ng pari ang babae’; pinanatili ang tahasang causative na ‘patatayuin.’
