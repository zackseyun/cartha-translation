  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: tl
  text: Pagkatapos, kukunin ng pari mula sa kamay ng babae ang handog na butil para sa paninibugho. Iwawagayway niya ang handog na butil sa harap ni Yahweh at ilalapit iyon sa altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Pagkatapos, kukunin
  rationale: Ang waw + qatal ay nagpapatuloy sa sunod-sunod na tagubilin sa ritwal; natural na ipinahahayag ng “Pagkatapos” at ng pandiwang nasa anyong panghinaharap ang itinakdang kasunod na hakbang.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na katawagan sa opisyal na nagsasagawa ng ritwal, habang pinananatili ang tiyak na pantukoy.
- source_word: מִיַּד הָאִשָּׁה
  choice: mula sa kamay ng babae
  rationale: Pinananatili ang konkretong idyomang Hebreo at ipinahihiwatig ang tuwirang pagtanggap ng pari mula sa babae.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: ang handog na butil para sa paninibugho
  rationale: Ang מִנְחָה sa kontekstong pangsaserdote ay handog na butil. Ang “para sa paninibugho” ay natural sa Tagalog at pinananatili ang kaugnayan ng handog sa ritwal ng paninibugho nang hindi ginagawang emosyon mismo ang inihahandog.
- source_word: וְהֵנִיף
  choice: Iwawagayway
  rationale: Ang hiphil ng נוף ay tumutukoy sa ritwal na pagwawagayway ng handog; tuwiran at nauunawaan ang pandiwang Tagalog.
- source_word: הַמִּנְחָה
  choice: ang handog na butil
  rationale: Inuulit ang tiyak na uri ng handog upang mapanatili ang leksikal na pagkakapare-pareho at hindi mapalabo ang kategoryang panghandog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Natural na salin ng pormulang pangritwal at pinananatili ang diwa ng pagkilos sa presensiya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na nakasulat sa tekstong Hebreo.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: at ilalapit iyon sa altar
  rationale: Pinananatili ng “ilalapit” ang sanhiing diwa ng hiphil ng קרב, ‘dalhin o ilapit,’ at ang direksiyon patungo sa altar.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasan ang Tetragrammaton sa Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pansariling pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng מִנְחַת הַקְּנָאֹת
  choice: handog na butil para sa paninibugho
  alternative: handog na butil ng paninibugho / handog para sa pagseselos
  rationale: Ang parirala ay ritwal na katawagan sa konteksto ng hinalang seksuwal at selos. Ang “para sa” ay malinaw ngunit hindi nagpapasiya nang higit sa teksto kung kaninong paninibugho ang pangunahing tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ritwal na pagkakasunod-sunod at ang kongkretong mga kilos na “mula sa kamay,” “iwawagayway,” at “ilalapit,” nang hindi gumagamit ng labis na teknikal o denominasyonal na pananalita.
