source:
  edition: WLC
  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: tl
  text: Ngunit kung ang lalaki ay walang kamag-anak na may karapatang tumanggap ng bayad-pinsala[a], ang bayad-pinsala dahil sa pagkakasala na ibinabalik sa PANGINOON[b] ay para sa pari, bukod pa sa lalaking tupa para sa pagbabayad-sala, na sa pamamagitan nito ay ginagawa ang pagbabayad-sala para sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kamag-anak na tagapagtubos” o “pinakamalapit na kamag-anak.” Ang salitang Hebreo na גֹּאֵל ay tumutukoy sa kapamilyang may legal na pananagutan o karapatan sa mga usapin ng pagtubos at kabayaran.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na אָשָׁם dito ay tumutukoy sa bayad-pinsala o kabayaran dahil sa pagkakasala, hindi sa lalaking tupang hain; hiwalay na binanggit ang tupa pagkatapos nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: kamag-anak na may karapatang tumanggap
  rationale: Sa kontekstong ito, tumutukoy ang גֹּאֵל sa malapit na kamag-anak na may legal na karapatang tumanggap ng kabayaran alang-alang sa taong napinsala. Nililinaw ng salin ang tungkuling pampamilya at legal nang hindi ipinapasok ang mas malawak na teolohikal na diwa ng “manunubos.”
- source_word: הָאָשָׁם
  choice: kabayaran ... dahil sa pagkakasala
  rationale: Dito, ang אָשָׁם ay ang bayad-pinsala o pagsasauli na bunga ng pagkakasala, hindi ang hain na lalaking tupa, sapagkat hiwalay itong binanggit pagkatapos.
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: ang kabayarang ibinabalik ... dahil sa pagkakasala
  rationale: Pinananatili ng “ibinabalik” ang pasibong diwa ng participle mula sa שׁוב at ipinakikita ang legal na pagsasauli.
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ginagamit ang nakaugaliang pamalit na titulong “PANGINOON” para sa banal na pangalang YHWH.
- source_word: לַכֹּהֵן
  choice: ay mapupunta sa pari
  rationale: Ipinahahayag nang natural sa Filipino ang legal na patutunguhan ng kabayaran, na nasa anyong appositional sa Hebreo.
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Malinaw nitong ipinakikitang karagdagan ang lalaking tupa at hindi ito ang mismong kabayaran.
- source_word: אֵיל הַכִּפֻּרִים
  choice: lalaking tupa para sa pagbabayad-sala
  rationale: Pinananatili nito ang uri ng hayop at ang layuning panritwal ng hain sa malinaw na modernong Filipino.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: na gagamitin ng pari upang magbayad-sala para sa kanya
  rationale: Ipinakikita ang lalaking tupa bilang kasangkapan sa pagbabayad-sala. Ang pari ay ginawang hayag bilang likas na tagaganap sa agarang kontekstong makasaserdote.
- source_word: לָאִישׁ
  choice: ang lalaki
  rationale: Pinananatili ang panlalaking isahan ng Hebreo sa halip na gawing neutral nang walang pangangailangan sa konteksto.
theological_decisions:
- issue: Ugnayan ng kabayaran at hain
  choice: Magkaibang bagay ang ibinabalik na kabayaran at ang inihahaing lalaking tupa; kapuwa silang hinihingi sa sitwasyong inilalarawan.
  alternative: Unawain ang אָשָׁם bilang mismong haing handog ukol sa pagkakasala.
  rationale: Ang מִלְּבַד, “bukod pa sa,” ay tahasang naghihiwalay sa kabayaran at sa lalaking tupang ginagamit sa pagbabayad-sala.
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginagamit ang tradisyonal at madaling makilalang pamalit na titulo habang ipinahihiwatig ng malalaking titik na banal na pangalan ang nasa tekstong Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kamag-anak na may karapatang tumanggap” upang maging malinaw ang legal na tungkulin ng גֹּאֵל sa kontekstong ito. Pinanatili ang teknikal ngunit pamilyar na pariralang “pagbabayad-sala,” at iniwasang pag-isahin ang kabayaran at ang haing hayop.
