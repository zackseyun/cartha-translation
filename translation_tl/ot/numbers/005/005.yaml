  text: 'Nagsalita si Yahweh kay Moises:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive na kasama ng דּבר ay nagbubukas ng bagong yunit ng salaysay at pahayag. Likas at marangal sa modernong Filipino ang “Nagsalita” para sa pormulang ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang likas na pananda sa Filipino bago ang pangalang Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa nilalaman ng pahayag na sumusunod, kahit bahagyang pormal ang tunog sa Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig. Pinanatili ang tradisyonal na pormula ng pagpapakilala sa banal na pahayag upang malinaw na ang mismong mensahe ay sumusunod sa susunod na talata.
