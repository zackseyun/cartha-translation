base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: tl
  text: '“Magsalita ka sa mga Israelita[a] at sabihin mo sa kanila: Kung ang asawa ng sinumang lalaki ay lumihis at nagtaksil sa kaniya,[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “mga anak na lalaki ni Israel.” Karaniwang tumutukoy ang pariralang Hebreo sa mga Israelita bilang isang bayan.'
    reason: lexical_alternative
  - marker: b
    text: Gumagamit ang Hebreo ng magkaugnay na pandiwa at pangngalan upang idiin ang paggawa ng pagtataksil.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Tuwirang pautos na nagpapasimula sa tagubiling ibinigay kay Moises; natural at marangal sa modernong Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural na katawagan sa buong bayang Israel sa modernong Tagalog. Inilagay sa talababa ang literal na anyong ‘mga anak na lalaki ni Israel.’
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: at sabihin mo sa kanila
  rationale: Pinananatili ang ikalawang pandiwa sa pormula ng paghahayag at ang tuwirang pagtukoy sa mga tatanggap.
- source_word: אִישׁ אִישׁ
  choice: sinumang lalaki
  rationale: Ang pag-uulit ng אִישׁ ay distributibo at nangangahulugang ‘sinumang lalaki’ o ‘bawat lalaki.’
- source_word: כִּי
  choice: Kung
  rationale: Nagpapakilala ito ng isang kondisyong legal, hindi lamang ng pangyayaring temporal.
- source_word: תִשְׂטֶה
  choice: lumihis
  rationale: Pinananatili ang metaporikal at bahagyang di-tiyak na diwa ng pagtalikod nang hindi pa agad tinutukoy ang eksaktong gawa.
- source_word: אִשְׁתּוֹ
  choice: ang asawa ... ng ... lalaki
  rationale: Natural na isinama sa kayariang Tagalog ang pambabaeng asawa at ang kaugnayan nito sa lalaki.
- source_word: וּמָעֲלָה ... מָעַל
  choice: nagtaksil
  rationale: Natural na ipinahahayag sa Tagalog ang relational na pagtataksil; ipinaliliwanag sa talababa ang mariing magkaugnay na pandiwa at pangngalan sa Hebreo.
- source_word: בּוֹ
  choice: sa kaniya
  rationale: Itinuturo ang asawang lalaki bilang taong pinagtaksilan; natural ang ‘sa kaniya’ sa Tagalog.
theological_decisions:
- issue: Kasariang nakapaloob sa katawagang pangtipan
  choice: mga Israelita
  alternative: mga anak na lalaki ni Israel
  rationale: Bagaman panlalaki ang literal na anyong Hebreo, karaniwang tumutukoy ang parirala sa sambayanan ng Israel. Pinili sa teksto ang malinaw at likas na katawagan sa Tagalog at pinanatili sa talababa ang literal na anyo.
- issue: Saklaw ng pagtataksil
  choice: lumihis at nagtaksil sa kaniya
  alternative: lumihis at gumawa ng pagtataksil laban sa kaniya
  rationale: Hindi pa tahasang tinutukoy ng talatang ito lamang ang buong detalye ng pagkakasala; pinananatili ng ‘lumihis’ ang pag-unlad ng legal na kaso, samantalang malinaw na ipinahahayag ng ‘nagtaksil’ ang paglabag sa katapatan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal. Iniwasan ang sobrang literal ngunit di-likas na ‘gumawa ng paglabag sa katapatan,’ habang pinanatili sa talababa ang diin ng Hebreong cognate construction.
