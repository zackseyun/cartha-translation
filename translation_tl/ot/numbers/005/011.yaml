lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagbubukas ng isang bagong yunit ng banal na pahayag; natural at tumpak dito ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na anyo bago ang pangalang Moises.
- source_word: מֹשֶה
  choice: Moises
  rationale: Ito ang karaniwan at kinikilalang anyo ng pangalang Hebrew sa makabagong Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebrew na nag-uugnay sa pambungad na “nagsalita” sa nilalaman ng pahayag na sumusunod.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebrew ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan, habang ipinapaliwanag sa talababa ang tradisyonal na salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormal na hulma ng pormulang pambungad sa banal na pahayag at ang pangalang Yahweh.
