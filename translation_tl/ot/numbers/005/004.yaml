  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: tl
  text: 'Gayon nga ang ginawa ng mga Israelita: pinaalis nila sila sa labas ng kampo. Gaya ng sinabi ni Yahweh kay Moises, gayon ang ginawa ng mga Israelita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Gayon nga ang ginawa
  rationale: Likas na Filipino para sa pagsunod sa naunang utos; pinananatili ng “nga” ang diin ng Hebrew na כֵּן.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Sa konteksto, ang literal na “mga anak na lalaki ni Israel” ay pangkalahatang katawagan sa sambayanan. Ang “mga Israelita” ang malinaw at likas na katumbas sa modernong Filipino.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: pinaalis nila ang mga iyon
  rationale: Dito, ang שׁלח ay tumutukoy sa pagpapaalis sa mga taong binanggit sa naunang utos. Mas malinaw ito kaysa sa literal ngunit malabong “ipinadala.”
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: sa kampo
  rationale: Kasama ng pandiwang “pinaalis,” natural na ipinahihiwatig nito ang pagdadala sa labas ng kampo, nang hindi gumagamit ng alanganing pariralang “papunta sa labas.”
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: Kung ano ang sinabi
  rationale: Ipinapahayag ang eksaktong pagsunod sa sinabi ni Yahweh sa paraang natural sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה bilang personal na pangalan, hindi pinapalitan ng isang titulo.
- source_word: כֵּן עָשׂוּ
  choice: iyon ang ginawa
  rationale: Pinananatili ang pangwakas na pag-uulit ng Hebrew na nagbibigay-diin sa pagsunod ng Israel.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebrew; pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak na lalaki ni Israel / mga anak ni Israel
  rationale: Ang parirala ay kolektibong tumutukoy sa sambayanang Israel, hindi lamang sa mga lalaking inapo. Iniiwasan ng salin ang maling pagpapakitid sa kasarian.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang dalawang pahayag tungkol sa pagsunod upang maipakita ang sadyang pag-uulit at diin ng Hebrew.
