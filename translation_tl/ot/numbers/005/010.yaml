  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: tl
  text: At ang mga banal na handog ng bawat lalaki ay magiging kaniya[a]; anuman ang ibigay ng isang lalaki sa pari ay magiging pag-aari ng pari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “ang kanyang mga banal na bagay.” Tumutukoy ito sa mga bagay na itinalaga bilang mga handog na banal.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal, “ay magiging kaniya.” Ang huling “kaniya” ay tumutukoy sa pari: ang ibinibigay sa pari ay nagiging pag-aari niya.'
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: bawat lalaki / isang lalaki
  rationale: Panlalaking pangngalang isahan ang anyo at ginagamit nang pamahagi sa kontekstong legal. Ang una ay isinaling “bawat lalaki,” at ang ikalawa ay “isang lalaki.”
- source_word: קֳדָשָׁיו
  choice: mga banal na handog niya
  rationale: Tumutukoy ang maramihang anyo ng קֹדֶשׁ sa mga bagay na ibinukod bilang sagradong handog. Likas sa makabagong Tagalog ang “mga banal na handog” at malinaw ang kontekstong pangkulto.
- source_word: לוֹ יִהְיוּ
  choice: ay magiging kaniya
  rationale: Nagpapahayag ang parirala ng pag-aari. Pinananatili ng “magiging kaniya” ang maikli at bahagyang malabong pagkakabuo ng Hebreo.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: anuman ang ibigay ng isang lalaki sa pari
  rationale: May pangkalahatang saklaw ang sugnay na kaugnay; malinaw na naihahatid ng “anuman” ang bukas na puwersang legal nito, at pinananatili ng “sa pari” ang tiyak na isahang anyo.
- source_word: לוֹ יִהְיֶה
  choice: ay magiging pag-aari ng pari
  rationale: Inuulit ng Hebreo ang pormula ng pag-aari. Nililinaw sa pangunahing teksto na ang tinutukoy ng panghalip ay ang pari, gaya ng ipinahihiwatig ng pinakamalapit na antecedent at ng konteksto.
theological_decisions:
- issue: Ang tinutukoy ng unang לוֹ (“kaniya”)
  choice: Pinanatiling “kaniya” sa teksto
  alternative: “sa pari” o “sa lalaki”
  rationale: Malabo sa Hebreo ang reperente ng unang panghalip. Hindi ito tahasang nilutas sa salin; ipinaliliwanag ng talababa ang mga posibleng pagkaunawa.
- issue: Ang tinutukoy ng huling לוֹ (“kaniya”)
  choice: “pag-aari ng pari”
  alternative: “magiging kaniya”
  rationale: Ang pari ang pinakamalapit na malinaw na antecedent at ito ang likas na diwa ng huling sugnay. Ang mas literal na pormulasyon ay nakatala sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pari” para sa כֹּהֵן at “banal na handog” para sa mga bagay na itinalagang sagrado. Pinanatili ang tunay na kalabuan ng unang panghalip sa mismong teksto at ipinaliwanag sa talababa.
