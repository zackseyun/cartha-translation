base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: tl
  text: Mula sa lalaki hanggang sa babae, ipadala ninyo sila sa labas ng kampo. Ipadala ninyo sila upang hindi nila dungisan ang kanilang mga kampo[a], na sa gitna ng mga ito ako ay nananahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang kanilang kampo.” Maramihan sa Hebreo ang “kanilang mga kampo”; maaaring tumukoy ito sa mga bahagi o magkakahiwalay na hanay ng kampamento.
    reason: lexical_alternative
  - marker: b
    text: 'Ang “mga ito” ay maaari ring tumukoy sa mga taong kaugnay ng mga kampo: “na sa gitna nila ako ay nananahan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: Mula sa lalaki hanggang sa babae
  rationale: Pinananatili ang anyong saklaw ng Hebreo, na tahasang kabilang ang kapwa lalaki at babae, sa halip na gawing simpleng “kapwa lalaki at babae.”
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: paalisin ninyo sila ... Paalisin ninyo sila
  rationale: Pinananatili ang pag-uulit at diin ng Piel ng שלח, habang natural sa Filipino ang “paalisin” para sa pagpapaalis sa loob ng kampo nang hindi kinakailangang magpahiwatig ng kaparusahang pagpapatapon.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: sa kampo
  rationale: Sa pariralang “paalisin ... sa kampo,” likas nang ipinahihiwatig sa Filipino ang pagdadala sa labas ng hangganan ng kampo.
- source_word: יְטַמְּאוּ
  choice: dungisan
  rationale: Ang “dungisan” ay nagpapanatili sa ritwal at sagradong bigat ng טמא, hindi lamang pisikal na karumihan o kontaminasyon.
- source_word: מַחֲנֵיהֶם
  choice: ang kanilang mga kampo
  rationale: Pinananatili ang malinaw na anyong maramihan ng pangngalang Hebreo at ang hulaping pangatlong panauhang maramihan.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: na sa gitna ng mga iyon—o nila—ako ay nananahan
  rationale: Pinananatili sa mismong salin ang tunay na kalabuan kung ang tinutukoy ay ang mga kampo o ang mga taong kaugnay ng mga iyon, gayundin ang solemneng diwa ng presensiya ng Diyos.
theological_decisions:
- issue: Ang tinutukoy ng hulaping maramihan sa בְּתוֹכָם
  choice: 'Ipinakita ang dalawang posibleng tinutukoy: ang mga kampo o ang mga taong naroon.'
  alternative: “na sa gitna ng mga iyon ako ay nananahan” o “na sa gitna nila ako ay nananahan” lamang
  rationale: Ang panlalaking maramihang hulapi ay maaaring tumukoy sa mga kampo bilang kabuuan o sa bayang kaugnay ng mga ito. Hindi dapat tahimik na lutasin ang teolohikal at gramatikal na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nananahan” upang mapanatili ang solemneng diwa ng presensiya ng Diyos, at ang pag-uulit ng “paalisin ninyo sila” upang tularan ang diin ng Hebreo.
