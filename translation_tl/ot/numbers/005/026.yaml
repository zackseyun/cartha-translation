  text: וְ/קָמַ֨ץ הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/אַחַ֛ר יַשְׁקֶ֥ה אֶת הָ/אִשָּׁ֖ה אֶת הַ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: tl
  text: Pagkatapos, kukuha ang pari ng isang dakot mula sa handog na butil—ang bahaging pang-alaala nito—at susunugin iyon sa altar. Pagkaraan, ipaiinom niya sa babae ang tubig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas malawak na konteksto, ito ang “mapait na tubig,” ngunit “ang tubig” lamang ang sinasabi ng talatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמַץ
  choice: kukuha ... ng isang dakot
  rationale: Sa konteksto ng paghahandog, tumutukoy ang קמץ sa ritwal na pagkuha ng isang dakot mula sa handog. Likas at tiyak sa modernong Tagalog ang “kukuha ng isang dakot.”
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katumbas ng כֹּהֵן sa kontekstong panrelihiyon at legal.
- source_word: מִן הַמִּנְחָה
  choice: mula sa handog na butil
  rationale: Sa kontekstong saserdotal, ang מִנְחָה ay handog na mula sa butil, hindi lamang isang pangkalahatang regalo o handog.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: ang bahaging pang-alaala nito
  rationale: Tumutukoy ang אַזְכָּרָה sa natatanging bahagi ng handog na sinusunog sa altar. Pinananatili ng “bahaging pang-alaala” ang teknikal na kahulugan nang malinaw sa Tagalog.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: at susunugin iyon sa altar
  rationale: Sa gamit na panghandog, ang הקטיר ay pagsunog ng handog sa altar, na may kaugnayan sa pagpapausok nito. Ang “iyon” ay tumutukoy sa bahaging pang-alaala.
- source_word: וְאַחַר
  choice: Pagkaraan
  rationale: Malinaw na ipinahihiwatig ng temporal na salita ang kasunod na hakbang sa ritwal.
- source_word: יַשְׁקֶה
  choice: ipaiinom niya
  rationale: 'Pinananatili ng pandiwang Tagalog ang causative na diwa ng Hiphil: ang pari ang nagpapainom sa babae.'
- source_word: אֶת הָאִשָּׁה
  choice: sa babae
  rationale: Natural na Tagalog na anyo ng taong pinaiinom sa causative na pangungusap.
- source_word: אֶת הַמָּיִם
  choice: ang tubig
  rationale: “Ang tubig” lamang ang tahasang sinasabi ng Hebreo sa talatang ito; hindi idinagdag sa pangunahing teksto ang “mapait.”
theological_decisions:
- issue: Kung tatawagin bang “mapait na tubig” ang tubig sa pangunahing teksto batay sa mas malawak na konteksto ng ritwal
  choice: Panatilihin ang payak na “ang tubig”
  alternative: ang mapait na tubig
  rationale: הַמָּיִם (“ang tubig”) lamang ang nasa talatang ito. Ang pagdaragdag ng “mapait” ay kukuha ng paglalarawan mula sa mga kalapit na talata at magdaragdag ng salitang wala sa agarang tekstong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na bokabularyong panrelihiyon na “pari,” “handog na butil,” at “altar,” habang pinanatili ang ritwal na pagkakasunod-sunod at ang teknikal ngunit mauunawaang pariralang “bahaging pang-alaala.”
