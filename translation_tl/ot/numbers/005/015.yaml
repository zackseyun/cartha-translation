  to: 'Pagkatapos, dadalhin ng lalaki ang kanyang asawa sa pari, at magdadala rin siya ng handog para sa kanyang asawa: ikasampung bahagi ng isang efa na harina ng sebada. Hindi niya ito bubuhusan ng langis ni lalagyan ng kamangyan, sapagkat ito ay handog na butil para sa pagseselos, isang handog na pang-alaala[a] na nagpapaalaala ng pagkakasala[b].'
