id: NUM.5.15
reference: Numbers 5:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: tl
  text: 'Pagkatapos, dadalhin ng lalaki ang kanyang asawa sa pari, at magdadala rin siya ng handog para sa kanyang asawa: ikasampung bahagi ng isang efa na harina ng sebada. Hindi niya ito bubuhusan ng langis ni lalagyan ng kamangyan, sapagkat ito ay handog na butil para sa pagseselos, isang handog na pang-alaala[a] na nagpapaalaala ng pagkakasala[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog ng pag-alaala.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na nagpapaalaala ng sala” o “na nagpapaalaala ng pananagutan.” Ang salitang Hebreo ay maaaring tumukoy sa pagkakasala, sala, o pananagutang bunga ng maling gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: dadalhin
  rationale: Sa kontekstong pambatas, ang anyong Hebreo ay nag-uutos kung ano ang gagawin; likas sa modernong Tagalog ang aspektong kontemplatibo upang ipahayag ito.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Pinananatili ang literal na katawagan sa Hebreo; nililinaw ng kasunod na “kanyang asawa” na siya ang asawang lalaki.
- source_word: קָרְבָּנָהּ עָלֶיהָ
  choice: para rito ang handog nito
  rationale: Ipinakikita kapuwa na ang handog ay kaugnay ng babae at na ang lalaki ang nagdadala nito para sa kanya, nang hindi ipinapalagay na siya mismo ang pisikal na naghandog.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: ikasampung bahagi ng isang efa
  rationale: Pinananatili ang sinaunang yunit na “efa” sa halip na magbigay ng di-tiyak na modernong katumbas.
- source_word: קֶמַח שְׂעֹרִים
  choice: harina ng sebada
  rationale: Likas at malinaw na salin ng harinang mula sa sebada.
- source_word: לֹא יִצֹק עָלָיו שֶׁמֶן
  choice: Hindi niya iyon bubuhusan ng langis
  rationale: Tuwirang ipinapahayag ang pagbabawal at malinaw na ang tinutukoy ng panghalip ay ang handog.
- source_word: וְלֹא יִתֵּן עָלָיו לְבֹנָה
  choice: ni lalagyan ng kamangyan
  rationale: Ang “kamangyan” ang karaniwang salitang Tagalog para sa mabangong dagta na frankincense; ang “ni” ay likas na nag-uugnay sa kasunod na pagbabawal.
- source_word: מִנְחַת קְנָאֹת
  choice: handog na pagkaing butil ukol sa pagseselos
  rationale: Ang מִנְחָה sa kontekstong panghandog ay handog na pagkaing butil, samantalang ang קְנָאֹת ay tumutukoy sa pagseselos o mapanibughong paghihinalang sanhi ng ritwal.
- source_word: מִנְחַת זִכָּרוֹן
  choice: isang handog na pang-alaala
  rationale: Ipinahahayag ang tungkuling magharap o magpanatili ng isang bagay sa pag-alaala nang hindi dinaragdagan ang kahulugan.
- source_word: מַזְכֶּרֶת עָוֹן
  choice: na nagpapaalaala ng kasamaan
  rationale: Isinasalin ang participle bilang sugnay na naglalarawan sa handog; inilalagay sa talababa ang lawak ng עָוֹן, na maaari ring tumukoy sa sala o pananagutan.
theological_decisions:
- issue: Kung ipinapalagay na ng handog na nagkasala ang babae
  choice: Inilarawan lamang ang handog bilang nagpapaalaala ng kasamaan, nang hindi pa nagpapasiya kung nagkasala o walang sala ang babae.
  alternative: Isalin na para bang pinatutunayan na agad ng handog ang pagkakasala ng babae.
  rationale: Hindi pa nilulutas ng talata ang kalagayan ng babae; inilalarawan lamang nito ang sangkap at layunin ng handog.
- issue: Saklaw ng קְנָאֹת
  choice: pagseselos
  alternative: mapanibughong paghihinala
  rationale: Pinananatili ng “pagseselos” ang malawak at tradisyonal na diwa ng salita, habang hindi ginagawang tiyak na napatunayan na ang pinaghihinalaang pagtataksil.
translation_notes:
  register: Modernong Filipino na may marangal ngunit payak na himig. Ginamit ang “rito” at “nito” upang tukuyin ang asawa nang hindi paulit-ulit ang parirala, at pinanatili ang “efa” bilang teknikal na sinaunang sukat. Ang mga talababa ay inilagay sa mismong mga pariralang kanilang nililinaw.
