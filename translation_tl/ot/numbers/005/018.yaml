  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: tl
  text: Pagkatapos, patatayuin ng pari ang babae sa harap ni Yahweh, kakalagan ang kanyang buhok[a], at ilalagay sa kanyang mga palad ang handog na butil para sa pag-alaala—iyon ay handog na butil ng paninibugho. Samantala, nasa kamay ng pari ang mapait na tubig na nagdudulot ng sumpa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aalisan ng takip ang ulo ng babae” o “palulugayin ang buhok ng babae.” Literal na binabanggit ng idyomang Hebreo ang “pagkakalag” ng ulo ng babae; malamang na tumutukoy ito sa pagkakalag ng nakataling buhok bilang bahagi ng ritwal.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang mapait na tubig na nagdadala ng sumpa” o “ang mapait na tubig na nagdudulot ng sumpa.” Maaaring ilarawan ng participle sa Hebreo ang tubig bilang nagdadala o nagpapairal ng sumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: patatayuin
  rationale: Ang Hiphil ng עמד ay nangangahulugang papangyarihing tumayo o ihaharap ang isang tao. Ang “patatayuin” ay malinaw at pinananatili ang kongkretong kilos sa ritwal.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Karaniwang pahayag ito para sa pagharap sa presensiya ng Diyos sa kontekstong panritwal; pinananatili ang pangalang tipan na Yahweh.
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: kakalagan ang buhok nito
  rationale: Bagaman “ulo” ang tahasang binabanggit sa Hebreo, ang pandiwa sa kontekstong ito ay malamang na tumutukoy sa pagkakalag o pagpapalugay ng buhok. Natural sa Filipino ang “kakalagan ang buhok” at hindi nito ipinapalagay na basta inalis lamang ang pantakip sa ulo.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: ilalagay sa mga palad nito
  rationale: Pinananatili ng “mga palad” ang kongkretong larawan ng Hebreong כַּפֶּיהָ, sa halip na gawing pangkalahatang “mga kamay.”
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: handog na butil para sa pag-alaala
  rationale: Sa kontekstong makapari, ang מִנְחָה ay handog na butil, at ang זִכָּרוֹן ay tumutukoy sa pag-alaala o pagpapaalaala. Hindi tinutukoy ng salin kung sino ang inaasahang makaaalala.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: iyon ay handog na butil ukol sa pagseselos
  rationale: Ang pangmaramihang anyong קְנָאֹת ay abstrakto rito. Ang “ukol sa pagseselos” ay natural ngunit hindi labis na nagpapasya kung ito ay selos ng asawa, sigasig, o mas malawak na paninibugho sa ritwal.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: Samantala, nasa kamay ng pari
  rationale: Ginagawang malinaw ng “Samantala” ang circumstantial na ugnayan ng sugnay habang pinananatili ang isahang “kamay” ng Hebreo.
- source_word: מֵי הַמָּרִים
  choice: ang mapait na tubig
  rationale: Bagaman pangmaramihan ang anyong Hebreo, mass noun ang “tubig” sa natural na Filipino; pinananatili ang katangiang “mapait.”
- source_word: הַמְאָרֲרִים
  choice: na nagdudulot ng sumpa
  rationale: Ang participle mula sa ארר ay naglalarawan sa tubig bilang nagkakabisa o nagdadala ng sumpa. Ang “nagdudulot” ay malinaw na causative nang hindi ipinapaliwanag ang mekanismo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasan sa teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng קְנָאֹת sa pangalan ng handog
  choice: pagseselos
  alternative: paninibugho / sigasig
  rationale: Maaaring saklawin ng salitang Hebreo ang selos o masidhing paninibugho. Sa konteksto ng pinaghihinalaang pagtataksil, “pagseselos” ang pinakamalinaw, ngunit hindi dinaragdagan ang teksto ng tiyak na tagaganap ng selos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nito” sa halip na paulit-ulit na “ng babae,” at pinanatili ang mga konkretong detalyeng panritwal. Iniwasan ang mga terminong nakatali sa isang partikular na tradisyong denominasyonal.
