  to: Pagkatapos, patatayuin ng pari ang babae sa harap ni Yahweh, kakalagan ang kanyang buhok[a], at ilalagay sa kanyang mga palad ang handog na butil para sa pag-alaala—iyon ay handog na butil ng paninibugho. Samantala, nasa kamay ng pari ang mapait na tubig na nagdudulot ng sumpa[b].
  rationale: Ginawang mas likas ang mga panghalip na tumutukoy sa babae, ginawang mas tuwiran ang ugnayan ng “handog na butil” at “paninibugho,” at inayos ang talababa b upang maging ganap at tumpak ang mga alternatibong salin. Hindi binago ang kahulugan o ang sinadyang leksikal na pag-iingat hinggil sa kilos na may kinalaman sa buhok.
