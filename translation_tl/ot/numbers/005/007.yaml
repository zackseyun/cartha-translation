revisions:
- from: Kaya ipahahayag nila ang kasalanang ginawa nila. Ibabalik niya nang buo ang halagang pananagutan niya, dadagdagan iyon ng ikalimang bahagi, at ibibigay sa taong pinagkasalahan niya.[a]
  to: At ipagtatapat nila ang kasalanang ginawa nila. Isasauli niya nang buo ang halaga ng pananagutan niya, magdaragdag siya rito ng ikalimang bahagi, at ibibigay niya ito sa taong pinagkasalahan niya.[a]
  rationale: Pinalitan ang “ipahahayag” ng “ipagtatapat” upang maipakita ang kahulugan ng pagtatapat sa וְהִתְוַדּוּ. Inayos ang parirala tungkol sa pagsasauli upang maging malinaw na ang pangunahing halaga ng pananagutan ang isasauli nang buo. Iningatan ang diwang hindi hain ang אָשָׁם sa talatang ito. Pinalitan din ang di-likas na literal na pahayag sa talababa ng tumpak na paliwanag sa huling konstruksyong Hebreo.
