  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: tl
  text: At ipagtatapat nila ang kasalanang ginawa nila. Isasauli niya nang buo ang halaga ng pananagutan niya, magdaragdag siya rito ng ikalimang bahagi, at ibibigay niya ito sa taong pinagkasalahan niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay isang di-karaniwang paraan ng pagtukoy sa taong may kaugnayan sa kanya ang pagkakasala o pananagutan. Maaari rin itong isalin na “sa taong ginawan niya ng mali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: ipahahayag nila
  rationale: Ang Hitpael ng ידה ay tumutukoy sa hayagang pagkilala o pagtatapat ng kasalanan; pinananatili ng anyong ito ang legal na utos at ang maramihang paksa.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: ang kasalanang ginawa nila
  rationale: Direkta at likas na salin ng kasalanan o paglabag na kanilang ginawa.
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: Ibabalik niya nang buo ang halagang pananagutan niya
  rationale: Sa konteksto ng pagbabayad, ang שוב ay pagbabalik o pagsasauli, ang אָשָׁם ay pananagutang pinansiyal dahil sa kasalanan, at ang בְּרֹאשׁוֹ ay tumutukoy sa buong pangunahing halaga.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: dadagdagan iyon ng ikalimang bahagi
  rationale: Malinaw na ipinahahayag ang dagdag na isang-kalima, o dalawampung porsiyento, sa pangunahing halaga.
- source_word: וְנָתַן
  choice: at ibibigay
  rationale: Pinananatili ang konkretong diwa ng paglilipat o pagbibigay ng kabayaran.
- source_word: לַאֲשֶׁר אָשַׁם לוֹ
  choice: sa taong pinagkasalahan niya
  rationale: Natural na Tagalog para sa taong may kaugnayan sa kanya ay nagkaroon siya ng pagkakasala o pananagutan, nang hindi nawawala ang diwa ng guilt/liability.
theological_decisions:
- issue: Kahulugan ng אָשָׁם sa konteksto ng pagsasauli
  choice: pananagutang pinansiyal na bunga ng pagkakasala
  alternative: handog para sa pagkakasala
  rationale: Ang agarang konteksto ay pagtatapat, pagbabalik ng buong pangunahing halaga, pagdaragdag ng isang-kalima, at pagbibigay nito sa taong pinagkasalahan. Kaya hindi rito tinutukoy ang mismong handog na hain.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “ipahahayag” bilang hayagang pagtatapat, “halagang pananagutan” upang iwasang ipakahulugan ang אָשָׁם bilang hain, at “pinagkasalahan” bilang natural na katumbas ng huling pariralang Hebreo.
