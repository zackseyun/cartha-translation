  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: tl
  text: Ang lalaki ay magiging malaya sa pananagutan[a], ngunit dadalhin ng babaeng iyon ang sarili niyang pagkakasala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang asawang lalaki ay magiging malaya sa pananagutan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “dadalhin ang sarili niyang pagkakasala.” Maaaring kasama sa idyomang Hebreo ang pagdadala ng mga bunga ng pagkakasala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: magiging malaya
  rationale: Ipinapahayag ng Niphal ng נקה ang pagiging malaya o ligtas mula sa pananagutan; natural ito sa modernong Filipino kasama ng pariralang “sa pananagutan.”
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Pormal na katumbas ito ng אִישׁ. Sa konteksto, ang tinutukoy ay ang asawa, ngunit pinananatili ng pangunahing teksto ang mas tuwirang katawagan.
- source_word: מֵעָוֺן
  choice: sa pananagutan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, pagkakasala, o pananagutang dulot nito. Kasama ng נקה, nakatuon dito ang diwa sa pagiging ligtas sa moral-legal na pananagutan.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: ngunit ang babaeng iyon
  rationale: Bagaman karaniwang “at” ang ו, malinaw na magkasalungat ang dalawang sugnay. Likas na ipinahahayag ng “ngunit” ang kontrast, at pinananatili ng “iyon” ang diin ng הַהִוא.
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: mananagot sa sarili niyang kasalanan
  rationale: Ang idyomang נשׂא עָוֹן ay pagdadala ng pagkakasala o ng pananagutan at mga bunga nito. Ang “mananagot sa sarili niyang kasalanan” ay natural sa Filipino habang pinananatili ang moral-legal na diwa; inilalahad sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Saklaw ng עָוֹן sa dalawang sugnay
  choice: Ihayag ang unang paglitaw bilang “pananagutan” at ang ikalawa bilang “kasalanan” sa loob ng idyomang “mananagot sa sarili niyang kasalanan.”
  alternative: 'Gamitin ang “kasalanan” sa parehong sugnay: “malaya sa kasalanan ... papasanin ang sarili niyang kasalanan.”'
  rationale: Saklaw ng salitang Hebreo ang kasalanan, pagkakasala, at pananagutan o bunga nito. Iniiwasan ng napiling salin ang maling pahiwatig na walang anumang kasalanan ang lalaki sa ganap na diwa, at malinaw na ipinakikita ang kontrast ng kawalan at pagdadala ng pananagutan nang hindi nililimitahan ang idyoma sa parusa lamang.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “pananagutan” upang ihatid ang legal-moral na puwersa ng talata, at iniwasan ang mas lumang “kasamaan” o ang labis na makitid na “parusa.” Ang mga pananda ng talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
