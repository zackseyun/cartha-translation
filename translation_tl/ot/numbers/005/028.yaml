  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: tl
  text: Ngunit kung hindi dinungisan ng babae ang kanyang sarili at malinis siya, mapapawalang-sala siya at maglilihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mahahasikan ng binhi,” isang idyomang tumutukoy sa paglilihi o pagkakaroon ng anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang kundisyong kasalungat ng nangyari sa naunang talata, habang pinananatili ang likas na daloy sa Filipino.
- source_word: לֹא נִטְמְאָה
  choice: hindi dinungisan ... ang kanyang sarili
  rationale: Ang Niphal ng טמא ay maaaring mangahulugang naging marumi o nadungisan; sa konteksto ng paratang na seksuwal na pagtataksil, malinaw at likas sa Filipino ang refleksibong pahayag.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Tuwirang salin ng tiyak na pangngalan.
- source_word: וּטְהֹרָה הִוא
  choice: at malinis siya
  rationale: Pinananatili ang wikang kalinisan ng tekstong Hebreo at hindi ito pinalalakas tungo sa ganap na moral na 'dalisay.'
- source_word: וְנִקְּתָה
  choice: mapapawalang-sala siya
  rationale: Sa konteksto ng pagsubok at paratang, ipinahahayag nito ang pagkalibre o pagkakapagtunay na walang sala, nang hindi nangangahulugang isang pormal na paglilitis sa hukuman.
- source_word: וְנִזְרְעָה זָרַע
  choice: at maglilihi
  rationale: Natural na Filipino para sa Hebreong idyomang literal na 'mahahasikan ng binhi'; pinananatili nito ang tuon sa paglilihi at hindi pinalalawak hanggang sa tiyak na panganganak.
theological_decisions:
- issue: Kalikasan ng kinalabasan para sa babaeng napatunayang walang sala
  choice: Mapapawalang-sala siya at maglilihi.
  alternative: Mapapawalang-sala siya at maaari siyang maglihi.
  rationale: Ang Hebreo ay tuwirang nagsasaad ng pangyayari sa anyong pandiwa, hindi lamang ng kakayahang maglihi. Kaya hindi idinagdag ang modal na 'maaari,' habang ang talababa ay nagpapanatili sa literal na larawan at saklaw ng idyoma.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “dinungisan ang kanyang sarili” upang ilahad ang moral at seksuwal na karumihang tinutukoy ng konteksto, at “mapapawalang-sala” para sa pagkakapagtunay na walang sala. Ang talababa ay ikinabit sa “maglilihi,” ang pariralang aktuwal nitong ipinaliliwanag.
