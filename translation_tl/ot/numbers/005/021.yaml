source:
  edition: WLC
  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: tl
  text: Pagkatapos, pasusumpain ng pari ang babae sa pamamagitan ng panunumpang may sumpa. Sasabihin ng pari sa babae, “Gawin ka nawa ni Yahweh na isang sumpa at panunumpa[a] sa gitna ng iyong bayan, kapag pinapanghina ni Yahweh ang iyong hita[b] at pinamimintog ang iyong tiyan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring mas idyomatikong isalin: “gawin kang halimbawang binabanggit sa pagsumpa at panunumpa” sa gitna ng iyong bayan.'
    reason: lexical_alternative
  - marker: b
    text: Ang “hita” ang literal na salita, at ang kasamang pandiwa ay literal na may diwang “bumagsak.” Mahirap ang ekspresyong Hebreo; maaaring tumukoy ito sa panghihina o pagkalanta ng bahaging iyon ng katawan, o maging eupemismo para sa mga sangkap na reproduktibo.
    reason: lexical_alternative
  - marker: c
    text: Ang salitang isinaling “tiyan” ay maaari ring mangahulugang “puson” o “sinapupunan.” Pinagtatalunan ang eksaktong medikal o reproduktibong epekto ng sumpang inilalarawan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: pasusumpain
  rationale: 'Ang Hiphil ng שׁבע ay causative: pangungunahan o oobligahin ng pari ang babae na manumpa. Likas at malinaw sa modernong Filipino ang “pasusumpain.”'
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: sa pamamagitan ng panunumpang may sumpa
  rationale: Pinananatili nito ang dalawang sangkap ng parirala—panunumpa at sumpa—nang hindi nagiging labis na teknikal o malamya sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: isang sumpa at panunumpa
  rationale: Malapit ito sa pormal na anyo ng Hebreo at pinananatili ang posibleng kahulugang magiging pormulang babanggitin siya sa pagsumpa at panunumpa; ipinaliliwanag sa talababa ang mas idyomatikong diwa.
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: sa gitna ng iyong bayan
  rationale: Pinananatili ang pampubliko at pangkomunidad na saklaw ng parusa sa natural at marangal na Filipino.
- source_word: בְּתֵת
  choice: kapag pinapanghina ... at pinamimintog
  rationale: Ang ב na kasama ng infinitive construct ay nagpapahayag ng kalagayan o panahong kaugnay ng katuparan ng sumpa; malinaw itong naihahayag ng “kapag.”
- source_word: יְרֵךְ
  choice: hita
  rationale: Ito ang tuwirang kahulugan ng יָרֵךְ. Hindi isinasara ng pangunahing teksto ang posibilidad na eupemismo ito para sa bahaging reproduktibo.
- source_word: נֹפֶלֶת
  choice: pinapanghina
  rationale: Bagaman literal na kaugnay ng “pagbagsak,” ang anyo sa kontekstong ito ay mahirap at maaaring tumukoy sa panghihina, pag-urong, o pagkalanta. Ang “pinapanghina” ay mauunawaan sa Filipino habang iniiwasang magtakda ng tiyak na medikal na epekto.
- source_word: בִּטְנֵךְ
  choice: iyong tiyan
  rationale: Ang בֶּטֶן ay maaaring tumukoy sa tiyan, puson, o sinapupunan. Ang “tiyan” ang pinakamalawak at pinakahindi mapagpasiyang salin sa kontekstong ito.
- source_word: צָבָה
  choice: pinamimintog
  rationale: Ipinapahayag nito ang paglaki o pamamaga/distension ng tiyan sa malinaw at dignified na Filipino.
theological_decisions:
- issue: Gaano katiyak na tutukuyin ang epekto ng sumpa sa katawan at reproduksiyon
  choice: Panatilihin ang larawang “hita” at “tiyan” at ilarawan ang mga ito bilang panghihina at pamimintog, nang hindi tahasang tinutukoy bilang pagkalaglag o pagkabaog.
  alternative: Isalin nang tiyak bilang pagkalaglag ng sanggol, pagbagsak ng sinapupunan, o pagkabaog.
  rationale: Mahirap at pinagtatalunan ang Hebreong pananalita. Ang mas tiyak na diagnosis na reproduktibo ay lalampas sa malinaw na sinasabi ng teksto, kaya pinananatili sa mga talababa ang gayong posibilidad.
- issue: Kahulugan ng pagiging “sumpa at panunumpa” sa bayan
  choice: Panatilihin sa pangunahing teksto ang pormal na dobleng pananalita at ipaliwanag sa talababa na maaaring mangahulugang magiging halimbawa siya sa mga pormula ng pagsumpa.
  alternative: Direktang isalin lamang bilang “halimbawa ng kapahamakang binabanggit sa pagsumpa.”
  rationale: Pinananatili ng pormal na salin ang retorikal at rituwal na tensiyon ng Hebreo, samantalang ibinibigay ng talababa ang malamang na idyomatikong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “pasusumpain,” “sa gitna ng iyong bayan,” at “pinamimintog” upang manatiling likas sa kasalukuyang gamit. Iniwasan ang teknikal na diagnosis at denominasyonal na pagpapakahulugan; ang mahihirap na imaheng Hebreo ay pinanatili sa teksto at nilinaw sa mga talababa.
