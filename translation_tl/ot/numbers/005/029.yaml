base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: tl
  text: 'Ito ang kautusan tungkol sa paninibugho[a]: kapag lumihis ang isang asawang babae habang nasa bigkis ng kasal sa kanyang asawa[b] at nadungisan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, maramihan ang salita, na maaaring nagsisilbing teknikal na tawag sa pamamaraang legal na ito tungkol sa paninibugho.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa ilalim ng kanyang asawa,” isang idyoma para sa pagiging nasa bigkis ng kasal sa kanyang asawa.
    reason: cultural_note
lexical_decisions:
- source_word: זֹאת תּוֹרַת הַקְּנָאֹת
  choice: Ito ang kautusan tungkol sa paninibugho
  rationale: Ang pormulang זֹאת תּוֹרַת ay likas na isinasalin bilang “Ito ang kautusan.” Bagaman maramihan ang הַקְּנָאֹת, mas natural sa Tagalog ang pang-isahang abstraktong “paninibugho”; ipinapaliwanag sa talababa ang anyong Hebreo at teknikal na gamit nito.
- source_word: אֲשֶׁר תִּשְׂטֶה אִשָּׁה
  choice: kapag lumihis ang isang asawang babae
  rationale: Ipinahahayag ng אֲשֶׁר ang sitwasyong saklaw ng kautusan, kaya angkop ang “kapag.” Pinananatili ng “lumihis” ang talinghaga ng שׂטה para sa pagtataksil nang hindi tahasang dinaragdagan ang teksto ng “nangalunya.”
- source_word: תַּחַת אִישָׁהּ
  choice: habang nakagapos sa kanyang asawa
  rationale: Literal itong “sa ilalim ng kanyang asawa,” ngunit sa konteksto ay tumutukoy sa umiiral na bigkis ng pag-aasawa. Iniiwasan ng “nakagapos” ang di-likas at posibleng malabong literal na Tagalog habang hindi nililimitahan ang idyoma sa awtoridad lamang.
- source_word: וְנִטְמָאָה
  choice: at nadungisan siya
  rationale: Pinananatili ng “nadungisan” ang wika ng karumihan o pagdungis sa konteksto ng seksuwal na pagtataksil, nang hindi ito pinapantay nang tahasan sa ritwal na karumihan o sa salitang “pangangalunya.”
theological_decisions:
- issue: Kalikasan ng pagdungis sa batas tungkol sa pinaghihinalaang pagtataksil
  choice: nadungisan siya
  alternative: naging marumi siya; nangalunya siya
  rationale: Ang טמא ay wika ng pagdungis o karumihan. Bagaman seksuwal na pagtataksil ang konteksto, hindi gumagamit ang Hebreo rito ng tuwirang pandiwa para sa pangangalunya; kaya pinananatili ang mas malawak na kategorya at tensiyon ng teksto.
- issue: Saklaw ng idyomang תַּחַת אִישָׁהּ
  choice: habang nakagapos sa kanyang asawa
  alternative: sa ilalim ng kanyang asawa; habang nasa ilalim ng kapangyarihan ng kanyang asawa
  rationale: Ipinakikita ng parirala ang umiiral na ugnayang pangmag-asawa. Hindi ito isinalin bilang awtoridad lamang, sapagkat maaaring paliitin niyon ang tunay na saklaw ng idyoma.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “asawang babae” upang malinaw na katawanin ang אִשָּׁה bilang wife, at ang “lumihis” upang mapanatili ang talinghaga. Maikli at pormulang legal ang pangungusap, gaya ng Hebreo.
