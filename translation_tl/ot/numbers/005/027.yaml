  source_fidelity: 'May ilang mahalagang paglihis ang draft: ang “nito” ay maling/di-malinaw na tumutukoy sa tubig sa halip na sa babae; ang “mapait na paghihirap” ay nagdaragdag ng ideyang wala sa mahirap na Hebreong parirala; ang “manghihina” ay masyadong malayo sa literal na “babagsak”; at ang “sagisag ng sumpa” ay nagpapaliwanag sa halip na isalin ang pagiging “isang sumpa.”'
  naturalness: Natural ang pangkalahatang daloy, ngunit ang “kung dinungisan nga nito ang sarili” ay hindi natural at lumilikha ng maling sanggunian. Ang mga rebisyon ay nagpapanatili ng marangal at modernong Filipino habang nililinaw ang sintaksis.
  terminology: Ang “tubig na nagdadala ng sumpa,” “tiyan,” at “asawa” ay angkop. Ang “isang sumpa” ay mas tapat sa אָלָה kaysa “sagisag ng sumpa.” Ang hindi tiyak na pariralang לְמָרִים ay isinasalin nang maingat bilang “na magdudulot ng kapaitan,” na hindi nagtatalaga ng partikular na uri ng paghihirap.
