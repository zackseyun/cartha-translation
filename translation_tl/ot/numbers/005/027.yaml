  to: Kapag ipinainom na niya sa babae ang tubig, kung siya ay nadungisan at nagtaksil sa kanyang asawa, papasok sa kanya ang tubig na nagdadala ng sumpa, na magdudulot ng kapaitan[a]. Mamamaga ang kanyang tiyan at babagsak ang kanyang hita[b], at ang babae ay magiging isang sumpa sa gitna ng kanyang bayan.
  rationale: Inayos ang maling sanggunian ng panghalip, inalis ang di-sinusuportahang “paghihirap,” at pinanatili ang kalabuan ng Hebreo tungkol sa kapaitan at sa pisikal na kapahamakan. Ibinabalik din ng “magiging isang sumpa” ang tuwirang pahayag ng pinagmulan nang hindi idinaragdag ang interpretasyong “sagisag.”
