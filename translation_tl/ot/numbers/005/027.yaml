source:
  edition: WLC
  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: tl
  text: Kapag ipinainom na niya sa babae ang tubig, kung siya ay nadungisan at nagtaksil sa kanyang asawa, papasok sa kanya ang tubig na nagdadala ng sumpa, na magdudulot ng kapaitan[a]. Mamamaga ang kanyang tiyan at babagsak ang kanyang hita[b], at ang babae ay magiging isang sumpa sa gitna ng kanyang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “papasok sa kanya bilang mapait na tubig ang tubig na nagdadala ng sumpa.” Mahirap tiyakin ang Hebreong parirala; maaaring inilalarawan nito ang epekto o ang katangian ng tubig.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “babagsak ang kanyang hita.” Malamang na eupemismo ito para sa matinding pinsala sa katawan, marahil sa mga sangkap sa pag-aanak, ngunit hindi tiyak ang eksaktong kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: Kapag ipinainom na niya sa babae ang tubig
  rationale: Pinananatili ng “ipainom” ang causative na diwa ng Hifil ng שׁקה, habang natural na ipinakikilala ng “kapag” ang kasunod na bunga.
- source_word: נִטְמְאָה
  choice: dinungisan nga nito ang sarili
  rationale: Ipinahihiwatig nito ang kusang pagkadungis sa konteksto ng pagtataksil, nang hindi nililimitahan ang salita sa ritwal o moral na karumihan lamang.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: nagtaksil sa kanyang asawa
  rationale: Ang magkaugat na parirala mula sa מעל ay nagpapatingkad sa paglabag sa katapatan; natural at malinaw sa Filipino ang “nagtaksil.”
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: ang tubig na nagdadala ng sumpa
  rationale: Inilalarawan ng participle ang tubig bilang tagapagdala o tagapairal ng sumpa.
- source_word: לְמָרִים
  choice: magdudulot ng mapait na paghihirap
  rationale: Mahirap ang parirala at maaaring tumukoy sa mapait na epekto o katangian ng tubig. Ang salin ay nagpapahayag ng resultang kapaitan ngunit inilalagay sa talababa ang tunay na kalabuan.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: Mamamaga ang kanyang tiyan
  rationale: Ang בטן ay tiyan o puson; “tiyan” ang tuwiran at hindi labis na tiyak na katumbas.
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: manghihina ang kanyang hita
  rationale: Literal na “babagsak ang kanyang hita,” ngunit hindi tiyak ang idyoma at maaaring eupemismo para sa matinding karamdamang may kaugnayan sa sangkap ng pag-aanak. Ang “manghihina” ay nauunawaan ngunit hindi nagtatakda ng tiyak na diagnosis.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: ang babae ay magiging sagisag ng sumpa sa gitna ng kanyang bayan
  rationale: Ipinakikita ng “sagisag ng sumpa” na siya ay magiging kilalang halimbawa o pantukoy sa pagsumpa sa loob ng pamayanan, hindi na siya mismo ay isang binigkas na sumpa.
theological_decisions:
- issue: Ang eksaktong anyo ng kapahamakang idudulot ng pagsubok
  choice: Panatilihin ang kongkretong “mamamaga ang tiyan” at ang maingat na “manghihina ang hita.”
  alternative: Malaglag ang dinadala niya; lumiit o masira ang kanyang mga sangkap sa pag-aanak; literal na bumagsak ang kanyang hita.
  rationale: Hindi tiyak kung ang Hebreong pananalita ay tumutukoy sa pagkalaglag, pagkabaog, o ibang matinding pinsala sa katawan. Hindi dapat ipasok sa pangunahing teksto ang isang tiyak na medikal o reproduktibong paliwanag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “babae” upang luminaw ang tinutukoy ng panghalip sa mahabang pangungusap, at pinanatili sa mga talababa ang mga hindi tiyak na pariralang Hebreo.
