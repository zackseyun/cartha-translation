base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: tl
  text: o kapag datnan ang isang lalaki ng diwa ng paninibugho[a] at magselos siya sa kanyang asawa, at iharap niya ang babae sa harapan ni Yahweh, isagawa ng pari sa kanya ang buong tagubiling ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kapag dumaan sa kanya ang diwa ng paninibugho.” Maaari ring “kapag dumating sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang buong kautusang ito,” “ang buong pamamaraang ito,” o “ang buong rituwal na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: o kapag
  rationale: Ipinakikilala nito ang ikalawang maaaring kalagayan sa mas malaking pangungusap; natural sa Tagalog ang “o kapag” at nananatili ang diwang naghihiwalay ng mga alternatibo.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Karaniwang salita ito para sa “lalaki.” Bagaman asawa ang tinutukoy sa konteksto, nililinaw na iyon ng kasunod na “kanyang asawa.”
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: pinuspos ng diwa ng paninibugho
  rationale: Ipinahahayag nito ang pagdating at paghahari ng matinding paninibugho sa lalaki habang pinananatili ang salitang “diwa”; hindi nito ipinapasiya kung panloob na damdamin o espirituwal na puwersa ang tinutukoy.
- source_word: רוּחַ
  choice: diwa
  rationale: Pinananatili ng “diwa” ang kalabuan ng Hebreo sa pagitan ng panloob na disposisyon at isang puwersang nangingibabaw.
- source_word: קִנְאָה / וְקִנֵּא
  choice: paninibugho / nagselos
  rationale: Sa konteksto ng pinaghihinalaang pagtataksil ng asawa, ang mga salitang ito ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: אֶת אִשְׁתּוֹ
  choice: kanyang asawa
  rationale: Tuwirang katumbas ng konstruksiyong paari; malinaw sa konteksto na babae ang asawa.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: iniharap niya ang babae sa harap ni Yahweh
  rationale: Ang causative ng עמד ay “patayuin” o “iharap.” Ang “iniharap” ay natural sa isang pormal at rituwal na tagpo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalan sa transliterasyong gamit ng proyekto.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: isasagawa ng pari sa babae
  rationale: Ang “isasagawa” ay likas sa Tagalog para sa pagganap ng iniresetang gawaing legal-rituwal at pinananatili ang procedural na puwersa ng pandiwa.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: ang buong tagubiling ito
  rationale: Ang תּוֹרָה ay maaaring mangahulugang kautusan, tagubilin, o itinakdang pamamaraan. Dito ay tumutukoy ito sa kabuuan ng rituwal na itinagubilin sa naunang mga talata.
theological_decisions:
- issue: Kalikasan ng “diwa ng paninibugho”
  choice: Pinanatili ang “diwa ng paninibugho” nang hindi tinutukoy kung ito ay panloob na disposisyon o espirituwal na puwersa.
  alternative: bugso ng paninibugho; matinding selos
  rationale: Hindi tahasang nilulutas ng Hebreo ang pinagmulan o ontolohikal na kalikasan ng רוּחַ; pinananatili ng salin ang tunay na kalabuan.
- issue: Saklaw ng תּוֹרָה sa rituwal na konteksto
  choice: tagubilin
  alternative: kautusan; pamamaraan; rituwal
  rationale: Ang “tagubilin” ay nagpapanatili sa malawak na saklaw ng salita at ang konteksto mismo ang nagpapakitang isang legal-rituwal na pamamaraan ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “paninibugho” para sa pormal na legal-rituwal na tono, kasama ang mas karaniwang “nagselos” upang maging natural ang pangungusap. Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
