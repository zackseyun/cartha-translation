  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: tl
  text: Pagkatapos, isusulat ng pari ang mga sumpang ito[a] sa balumbon at papahirin niya ang mga ito mula sa balumbon papunta sa mapait na tubig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sumpang kaugnay ng panunumpa.” Ang salitang Hebreo ay maaaring tumukoy sa sumpang ipinapataw kaugnay ng isang panunumpa.
    reason: lexical_alternative
  - marker: b
    text: O “buburahin” o “papawiin.” Ang pandiwang Hebreo ay tumutukoy sa pagpahid, pagpawi, o pagbura sa mga nakasulat na salita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: Pagkatapos, isusulat
  rationale: Ang pandiwang Qal perfect na may pang-ugnay ay bahagi ng sunod-sunod na tagubilin sa ritwal; ipinahihiwatig nito ang susunod na gagawin, kaya natural sa Filipino ang “Pagkatapos, isusulat.”
- source_word: הָאָלֹת הָאֵלֶּה
  choice: ang mga sumpang ito
  rationale: Ang אָלָה ay tumutukoy sa sumpa, madalas na kaugnay ng isang panunumpa. Sa kontekstong ito, ang isinusulat ay ang mga kaparusahang binigkas bilang sumpa; pinananatili sa talababa ang kaugnayan nito sa panunumpa.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na tawag sa tagapangasiwa ng ritwal.
- source_word: בַּסֵּפֶר
  choice: sa balumbon
  rationale: Ang סֵפֶר dito ay isang sulatang materyal o dokumento, hindi isang makabagong aklat na may pabalat. Ang “balumbon” ay angkop sa sinaunang kalagayan.
- source_word: וּמָחָה
  choice: at huhugasan ang mga iyon mula roon
  rationale: Ang מחה ay nangangahulugang punasan, burahin, o pawiin. Dahil inililipat sa tubig ang nakasulat, malinaw na inilalarawan ng “huhugasan … mula roon” ang pisikal na kilos nang hindi nawawala ang diwa ng pagbura.
- source_word: אֶל
  choice: tungo sa
  rationale: Direksiyonal ang pang-ukol at dito ay nagsasaad ng paglipat ng nahugasang sulat tungo sa tubig.
- source_word: מֵי הַמָּרִים
  choice: mapait na tubig
  rationale: Likas na Filipino ito para sa literal na “tubig ng kapaitan” o “mapait na mga tubig,” at tumutukoy sa ritwal na likido sa konteksto.
