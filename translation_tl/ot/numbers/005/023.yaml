translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “balumbon” upang katawanin ang sinaunang sulatang materyal, at ang “huhugasan … mula roon tungo sa” upang maipakita ang pag-aalis ng sulat at paglipat nito sa tubig.
