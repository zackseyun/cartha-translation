  to: Paiinumin niya ang babae ng mapait na tubig na nagdadala ng sumpa[a], at ang tubig na nagdadala ng sumpa ay papasok sa kanya at magdudulot sa kanya ng kapaitan.[b]
  rationale: Inayos ang ayos ng unang sugnay para sa mas likas na modernong Tagalog. Pinalitan ang pang-ukol na “upang” ng magkakaugnay na pandiwang nagsasaad ng resulta, upang hindi magmukhang layunin ang huling parirala. Pinanatili ang pag-uulit ng “tubig na nagdadala ng sumpa,” ang hindi-tiyak na “kapaitan,” at ang dalawang talababa.
