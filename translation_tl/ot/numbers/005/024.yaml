  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: tl
  text: Paiinumin niya ang babae ng mapait na tubig na nagdadala ng sumpa[a], at ang tubig na nagdadala ng sumpa ay papasok sa kanya at magdudulot sa kanya ng kapaitan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga tubig ng kapaitan na nagdadala ng sumpa.” Karaniwang ginagamit sa Hebreo ang anyong maramihan para sa tubig.
    reason: lexical_alternative
  - marker: b
    text: O “at ang tubig na nagdadala ng sumpa ay papasok sa kanya bilang kapaitan.” Maaaring ipahayag ng huling parirala ang bunga o epekto ng tubig.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: ipaiinom niya
  rationale: Ang Hifil ng שׁקה ay causative, ‘painumin’ o ‘bigyan upang inumin.’ Likas sa modernong Tagalog ang “ipaiinom niya” at pinananatili nito ang causative na diwa.
- source_word: הָאִשָּׁה
  choice: sa babae
  rationale: Tuwirang salin ng tiyak na pangngalan, na may “sa” dahil sa balangkas ng pandiwang “ipaiinom.”
- source_word: מֵי הַמָּרִים
  choice: ang mapait na tubig
  rationale: Literal itong ‘mga tubig ng kapaitan,’ ngunit karaniwang pangngalang di-mabilang ang “tubig” sa Tagalog. Ang “mapait na tubig” ay malinaw at natural.
- source_word: הַמְאָֽרֲרִים / הַמְאָרֲרִים
  choice: na nagdadala ng sumpa
  rationale: Ang participle mula sa ארר ay naglalarawan sa tubig bilang tagapagdala o tagapamagitan ng sumpa, hindi lamang bilang tubig na isinumpa.
- source_word: וּבָאוּ בָהּ
  choice: papasok sa kanya
  rationale: Ang בוא na may ב ay nagpapahayag ng pagpasok sa babae; pinananatili ng salin ang konkretong larawan nang hindi nagdaragdag ng paliwanag tungkol sa katawan.
- source_word: לְמָרִים
  choice: upang magdulot ng kapaitan
  rationale: Maaaring ipahayag ng ל ang bunga o epekto. Ang “magdulot ng kapaitan” ay natural sa Tagalog at hindi nililimitahan ang malabong saklaw ng kapaitan sa isang tiyak na pisikal na sintomas.
theological_decisions:
- issue: Kalikasan ng sumpa sa ritwal na pagsubok
  choice: Ilarawan ang tubig bilang “nagdadala ng sumpa.”
  alternative: “isinumpang tubig”
  rationale: Mas angkop sa participle ang papel ng tubig sa pagdadala o pagsasakatuparan ng sumpa. Iniiwasan din nitong ipahiwatig na likas na mahika o mismong isinumpa ang tubig, habang pinananatili ang hudisyal at ritwal na bigat ng teksto.
- issue: Diwa ng לְמָרִים
  choice: “upang magdulot ng kapaitan” bilang bunga o epekto
  alternative: “nang may kapaitan” o “bilang kapaitan”
  rationale: Hindi tiyak sa parirala kung ang tinutukoy ay paraan, kalagayan, o ibinungang pinsala. Ang pangunahing salin ay malinaw ngunit hindi tumutukoy ng isang partikular na pisyolohikal na epekto; inilalagay sa talababa ang mas pormal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa Kasulatan. Pinanatili ang pag-uulit ng “tubig na nagdadala ng sumpa” dahil mahalaga ito sa Hebreong pangungusap, at iniwasan ang mas teknikal o di-likas na “tubig ng kapaitan” sa pangunahing teksto.
