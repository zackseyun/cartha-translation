base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: tl
  text: at dumating sa kanya ang diwa ng paninibugho[a], at nagselos siya sa kanyang asawa, at nadungisan ang kanyang asawa[b]; o kung dumating sa kanya ang diwa ng paninibugho, at nagselos siya sa kanyang asawa, ngunit hindi nadungisan ang kanyang asawa[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “diwa” ay maaari ring isaling “espiritu” o “udyok.” Maaaring tumukoy rito ang Hebreo sa isang nangingibabaw na disposisyon ng paninibugho.
    reason: lexical_alternative
  - marker: b
    text: O “naging marumi.” Gumagamit ang Hebreo ng wika ng karumihan; dito ay tumutukoy ito sa hinihinalang seksuwal na pagtataksil.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “at hindi nadungisan ang kanyang asawa.” Ginamit sa teksto ang “ngunit” upang ilantad ang kontrast sa ikalawang posibleng kaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: sumakaniya
  rationale: Ang idyomang Hebreo ay naglalarawan sa isang udyok o damdaming biglang naghahari sa lalaki. Likas sa Filipino ang “sumakaniya” at napapanatili nito ang puwersa ng pagdating ng gayong disposisyon.
- source_word: רוּחַ קִנְאָה
  choice: diwa ng paninibugho
  rationale: Maaaring tumukoy ang רוּחַ sa espiritu, hangin, o panloob na disposisyon. Sa kontekstong ito, ang “diwa” ay sadyang hindi lubusang nagpapasya kung ito ay hiwalay na espiritu o matinding panloob na udyok; ang קִנְאָה ay paninibugho sa usaping mag-asawa.
- source_word: וְקִנֵּא אֶת־אִשְׁתּוֹ
  choice: at pagselosan niya ang kaniyang asawa
  rationale: Ang Piel ng קנא ay nagpapahayag ng aktibong pagseselos o paninibugho ng asawa. Ang “pagselosan” ay natural na modernong Filipino at pinananatili ang pagkakasunod ng mga kilos.
- source_word: נִטְמָאָה
  choice: nadungisan
  rationale: Impurity language ang pandiwa at sa konteksto ay tumutukoy sa hinihinalang seksuwal na pagtataksil. Pinananatili ng “nadungisan” ang pagkakaugnay ng moral at rituwal na karumihan nang hindi ito nililimitahan sa seremonyal na karumihan lamang.
- source_word: אוֹ
  choice: o kung
  rationale: Ang אוֹ ay naghaharap ng ikalawang posibleng kaso sa batas. Nililinaw ng “kung” ang kondisyunal na anyo na ipinahihiwatig ng legal na konteksto.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: ngunit hindi naman ito nadungisan
  rationale: Payak na “at” ang pang-ugnay sa Hebreo, ngunit malinaw na kasalungat na posibilidad ang ikalawang kaso. Natural na inililitaw ng “ngunit hindi naman” ang kontrast habang itinatala sa talababa ang literal na anyo.
theological_decisions:
- issue: Saklaw ng wikang tumutukoy sa karumihan sa batas tungkol sa hinihinalang pangangalunya
  choice: Gamitin ang “nadungisan,” na nag-uugnay sa seksuwal na pagtataksil at karumihan.
  alternative: “naging marumi” o “nadumhan”
  rationale: Hindi lamang pangseremonyang kontaminasyon ang pinag-uusapan sa konteksto, ngunit ang Hebreong termino ay tunay na kabilang sa bokabularyo ng rituwal na karumihan. Ang “nadungisan” ay nagpapanatili sa magkapatong na moral at rituwal na diwa nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
- issue: Pinagmulan o kalikasan ng “diwa ng paninibugho”
  choice: Panatilihin ang “diwa ng paninibugho” nang hindi tiyak na itinuturing itong hiwalay na espiritung nilalang o damdamin lamang.
  alternative: “matinding paninibugho” o “espiritu ng paninibugho”
  rationale: May leksikal na lawak ang רוּחַ at hindi nilulutas ng talata kung ang diin ay nasa espiritu o disposisyon. Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kaniyang” para sa dignidad at kalinawan, at “ito” bilang reperensiya sa asawa ayon sa karaniwang estilong legal; pinanatili ang anyong sugnay dahil bahagi ang talata ng mas mahabang kondisyunal na pangungusap.
