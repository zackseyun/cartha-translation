  naturalness: Hindi natural sa modernong Filipino ang “at pagselosan niya ang kaniyang asawa” sa ganitong konstruksyon. Ang “at nagselos siya sa kanyang asawa” ay tuwiran at natural. Mas malinaw at mas magalang ding gamitin ang “ang kanyang asawa” sa halip na “ito,” lalo na sa isang legal na tekstong maaaring maging malabo ang tinutukoy ng panghalip.
  terminology: Ang “diwa ng paninibugho” ay isang katanggap-tanggap na maingat na salin ng רוח קנאה at pinananatili ang kalabuan ng “ruach.” Ang “nadungisan” ay angkop para sa wikang karumihan sa kontekstong ito, nang hindi pinipilit na puro rituwal o puro moral lamang ang kahulugan.
