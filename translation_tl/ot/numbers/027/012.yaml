  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Umakyat ka sa bundok na ito ng Abarim[a] at tingnan mo ang lupaing ibinigay ko sa mga anak ni Israel.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bundok ng Abarim.” Maaari ring isalin na “Bundok Abarim” o unawain bilang bundok na bahagi ng kabundukan ng Abarim.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga Israelita” o “sambayanan ng Israel.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural itong ipinahayag sa Tagalog sa pamamagitan ng “Pagkatapos.”
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Tuwirang ipinapahayag ng pautos na anyo ang pag-akyat at natural ito sa makabagong Tagalog.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: bundok na ito sa Abarim
  rationale: Ginawang natural sa Tagalog ang kaugnayan ng bundok sa heograpikong pangalang Abarim, habang inilalahad sa talababa ang mas literal na anyo at iba pang posibleng pagkaunawa.
- source_word: וּרְאֵה
  choice: at tingnan mo
  rationale: Karaniwan at tuwirang katumbas ito ng pautos na ראה, nang hindi gumagamit ng makalumang pananalita.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto ng pangako, tumutukoy ito sa lupaing ipinagkaloob sa Israel; mas angkop ang “lupain” kaysa sa pangkalahatang “lupa.”
- source_word: נָתַתִּי
  choice: ibinigay ko
  rationale: Pinananatili ng aspektong naganap ang paglalarawan sa kaloob bilang tiyak at naipagkaloob na.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili nito ang Hebreong idyomang tumutukoy sa mga inapo o sambayanan ni Israel, nang hindi maling nililimitahan ang tinutukoy sa mga lalaking anak lamang.
theological_decisions:
- issue: Paglalahad sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang pangalan sa tekstong Hebreo at iniiwasang palitan ito ng titulo o ng isang denominasyonal na anyo.
- issue: Saklaw ng pariralang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel; mga anak na lalaki ni Israel
  rationale: Bagaman panlalaking maramihan ang anyong Hebreo, karaniwan itong kolektibong katawagan sa mga inapo o bayan ng Israel. Ang “mga anak ni Israel” ay malapit sa anyo ng pinagmulan at hindi nagdaragdag ng di-tiyak na limitasyong panlalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “umakyat ka” at “tingnan mo” bilang natural na mga pautos, at iniwasan ang parehong makaluma at labis na kolokyal na pananalita.
