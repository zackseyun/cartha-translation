  text: לָ֣/מָּה יִגָּרַ֤ע שֵׁם אָבִ֨י/נוּ֙ מִ/תּ֣וֹךְ מִשְׁפַּחְתּ֔/וֹ כִּ֛י אֵ֥ין ל֖/וֹ בֵּ֑ן תְּנָ/ה לָּ֣/נוּ אֲחֻזָּ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אָבִֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: tl
  text: “Bakit mawawala[a] ang pangalan ng aming ama mula sa kanyang angkan dahil wala siyang anak na lalaki? Bigyan mo kami ng bahaging lupa[b] sa gitna ng mga kapatid na lalaki ng aming ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mabawasan” o “maalis.” Itinatanong sa Hebreo kung bakit mawawala sa angkan ang “pangalan” ng kanilang ama dahil wala siyang anak na lalaki.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahaging lupa” ay tumutukoy sa lupaing itinalaga bilang pag-aari o mana sa loob ng angkan.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Likas na panimula ito sa isang retorikal na tanong at pagtutol sa Tagalog.
- source_word: יִגָּרַע
  choice: mawawala
  rationale: Ipinahihiwatig ng Niphal na mawawala o maaalis ang pangalan sa angkan; ang “mawawala” ay natural at hindi nagdaragdag ng tahasang gumagawa na wala sa Hebreo.
- source_word: שֵׁם
  choice: pangalan
  rationale: Pinananatili ang konkretong idyomang Hebreo tungkol sa pagpapatuloy ng pangalan at katayuan ng ama sa angkan.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: mula sa kanyang angkan
  rationale: Ang מִשְׁפָּחָה rito ay pangkat ng magkakamag-anak sa loob ng lipi, kaya mas tumpak ang “angkan” kaysa sa makabagong diwa ng “pamilya.”
- source_word: כִּי אֵין לוֹ בֵּן
  choice: dahil wala siyang anak na lalaki
  rationale: Pinananatili ang tiyak na kasariang nasa בֵּן sapagkat mahalaga ito sa usapin ng mana; natural din sa Tagalog ang anyong walang tahasang panahunan.
- source_word: תְּנָה לָּנוּ
  choice: Bigyan mo kami
  rationale: Tuwirang pakiusap na pautos ang pandiwa, at isahan ang kinakausap sa tekstong Hebreo.
- source_word: אֲחֻזָּה
  choice: bahaging lupa
  rationale: Sa konteksto, tumutukoy ito sa isang lupaing itinakdang pag-aari o bahagi sa mana; malinaw at natural ang “bahaging lupa.”
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: sa gitna ng mga kapatid na lalaki ng aming ama
  rationale: Pinananatili ang tiyak na pagtukoy sa mga lalaking kapatid ng ama at hindi ito pinalalawak tungo sa lahat ng kamag-anak.
theological_decisions:
- issue: Wikang tiyak sa kasarian sa batas ng mana
  choice: anak na lalaki / mga kapatid na lalaki ng aming ama
  alternative: anak / mga kamag-anak ng aming ama
  rationale: Tahasang panlalaki ang mga terminong Hebreo, at mahalaga ang mga ito sa legal na tanong tungkol sa pagmamana; hindi dapat gawing neutral ang kasarian.
- issue: Pagkawala ng pangalan ng ama
  choice: mawawala ang pangalan
  alternative: mababawasan ang pangalan / aalisin ang pangalan
  rationale: Pinananatili ng “mawawala” ang idyomang Hebreo at ang posibleng saklaw ng pandiwa nang hindi ipinapaliwanag nang labis kung ito ay pagkawala sa talaan, mana, o alaala ng angkan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mo” dahil isahan ang pautos sa Hebreo, at pinanatili ang legal at pampamilyang katiyakan ng “anak na lalaki” at “mga kapatid na lalaki ng aming ama.”
