  yaml_path: translation/ot/numbers/027/010.yaml
  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: tl
  text: Ngunit kung wala siyang mga kapatid na lalaki, ibibigay ninyo ang kanyang mana sa mga kapatid na lalaki ng kanyang ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas karaniwang pananalita, “sa mga tiyo niya sa ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ng pang-ugnay at kondisyunal na kataga ang kasunod na kaso sa sunod-sunod na tuntunin; natural sa Tagalog ang “Ngunit kung” upang maipahayag ang paghahambing at kondisyon.
- source_word: אֵין לוֹ
  choice: wala siyang
  rationale: 'Ang Hebreong eksistensiyal na pagtanggi na may lamed at hulaping panghalip ay likas na ipinapahayag sa Tagalog bilang kawalan ng pag-aari o kaugnayan: “wala siyang.”'
- source_word: אַחִים
  choice: mga kapatid na lalaki
  rationale: Ang panlalaking pangmaramihang anyo ay tumutukoy rito sa mga lalaking kapatid sa konteksto ng batas sa pamana; iniiwasan ng salin ang posibleng gender-neutral na pagbasa ng “mga kapatid” lamang.
- source_word: וּנְתַתֶּם
  choice: ibibigay ninyo
  rationale: Pinananatili nito ang ikalawang panauhang maramihan at ang legal na tagubilin. Sa Tagalog, sapat nang ipinahihiwatig ng ayos ng kondisyunal na pangungusap ang resultang “then.”
- source_word: נַחֲלָתוֹ
  choice: ang kanyang mana
  rationale: Sa kontekstong legal, ang salita ay tumutukoy sa minanang ari-arian o bahaging pag-aari; “mana” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: לַאֲחֵי אָבִיו
  choice: sa mga kapatid na lalaki ng kanyang ama
  rationale: Malapit nitong pinananatili ang literal na ugnayang pampamilya na “mga kapatid ng kanyang ama,” habang nililinaw na mga lalaki ang tinutukoy. Ang mas idyomatikong “mga tiyo niya sa ama” ay ibinigay sa talababa.
