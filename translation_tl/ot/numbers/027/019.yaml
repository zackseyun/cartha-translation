    issue: Ang “italaga mo siya” ay lumilihis sa pangunahing diwa ng וְצִוִּיתָה.
    rationale: Ang pandiwang צוה ay nangangahulugang mag-utos, magbigay ng tagubilin, o magbigay ng atas. Bagama’t nasa konteksto ito ng paghalili ni Josue, ang ‘italaga’ ay nakatuon sa paghirang mismo at maaaring magpahiwatig ng kahulugang wala sa pandiwa ng talata. Ang ‘bigyan mo siya ng atas’ ay naghahatid ng kontekstuwal na pampublikong charge nang hindi binubura ang leksikal na diwa.
  revised_text: Iharap mo siya kay Eleazar na pari at sa buong kapulungan, at bigyan mo siya ng atas sa harap nila.[a]
