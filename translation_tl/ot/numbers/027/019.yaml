  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: tl
  text: Iharap mo siya kay Eleazar na pari at sa buong kapulungan, at bigyan mo siya ng atas sa harap nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagubilinan mo siya” o “utusan mo siya.” Ang pandiwang Hebreo ay karaniwang nangangahulugang mag-utos; sa kontekstong ito, maaari rin itong tumukoy sa hayagang pagbibigay kay Josue ng atas para sa kaniyang tungkulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Iharap mo
  rationale: Ang Hiphil ng עמד ay nagpapahiwatig ng pagpap站 o paglalagay sa harap ng iba; natural sa Filipino ang “iharap” para sa pormal na presentasyon.
- source_word: לִפְנֵי
  choice: kay / sa harap ng
  rationale: Ipinapahayag nito ang pagiging nasa harapan o presensiya ng isang tao o pangkat; iniangkop ang anyo sa natural na sintaks ng Filipino.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: kay Eleazar na pari
  rationale: Pinananatili ang pangalan at malinaw na tinutukoy ang katungkulan ni Eleazar.
- source_word: כָּל הָעֵדָה
  choice: sa buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanan o pagtitipon ng Israel; ang “kapulungan” ay dignificado at madaling maunawaan.
- source_word: וְצִוִּיתָה
  choice: italaga mo
  rationale: Bagaman karaniwang nangangahulugang “utusan,” sa konteksto ng pampublikong paghalili kay Josue ay tumutukoy ito sa pagbibigay sa kaniya ng tungkulin o atas. Pinananatili sa talababa ang leksikal na alternatibo.
- source_word: לְעֵינֵיהֶם
  choice: sa harap nila
  rationale: Ang literal na “sa kanilang mga mata” ay idyoma para sa isang hayag at nasasaksihang kilos; natural itong isinasalin bilang “sa harap nila.”
theological_decisions:
- issue: Pampublikong pagtatalaga sa awtoridad ni Josue
  choice: Isinalin ang צוה bilang “italaga” sa kontekstong ito.
  alternative: “utusan” o “bigyan ng atas”
  rationale: Ang nakapaligid na salaysay ay tungkol sa pormal at pampublikong paghirang kay Josue. Ipinahihiwatig ng “italaga” ang seremonyal na konteksto nang hindi itinatanggi na ang pandiwa ay maaari ring mangahulugang mag-utos.
translation_notes:
  register: Makabagong Filipino na dignificado at malinaw. Ginamit ang “kapulungan” para sa tipunang pamayanan at “italaga” para sa pampublikong pagkakaloob ng tungkulin. Inilagay ang talababa pagkatapos ng sugnay na may salitang “italaga” upang malinaw ang tinutukoy nito.
