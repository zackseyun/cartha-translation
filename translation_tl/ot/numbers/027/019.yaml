  source_fidelity: Ang “Iharap mo siya” ay tumpak para sa causative na וְהַעֲמַדְתָּ, at maayos na naihahatid ng “kay Eleazar na pari at sa buong kapulungan” ang dalawang pangkat na nasa harap nila ihaharap si Josue. Gayunman, ang “italaga” ay mas tuwirang nangangahulugang humirang o magtalaga sa katungkulan, samantalang ang וְצִוִּיתָה ay ‘mag-utos/magbigay ng atas o tagubilin sa kanya.’ Sa kontekstong ito maaari itong maging pampublikong pagbibigay ng atas, ngunit hindi dapat palitan ng salitang pangunahing tumutukoy sa paghirang.
  naturalness: Natural at dignificado ang “Iharap mo siya” at “buong kapulungan.” Mas malinaw at likas sa makabagong Filipino ang “bigyan mo siya ng atas” para sa pampublikong pagbibigay ng tungkulin; iniiwasan din nito ang mas malakas na pahiwatig ng pormal na paghirang na nasa “italaga.”
  terminology: Napananatili ang pangalang Eleazar at ang titulong “pari.” Ang “kapulungan” ay angkop na katumbas ng עֵדָה sa pormal na kontekstong ito. Ang “atas” ay sapat na malapit sa pampublikong ‘charge/commission’ habang pinananatili ang pangunahing saklaw na ‘command.’
  issues:
