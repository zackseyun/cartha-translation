  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: tl
  text: At tatayo siya sa harap ni Eleazar na pari. Sasangguni si Eleazar para sa kanya sa harap ni Yahweh sa pamamagitan ng pasya ng Urim.[a] Sa utos niya ay lalabas sila, at sa utos niya ay papasok sila—siya at ang lahat ng mga anak ni Israel na kasama niya,[b] samakatuwid, ang buong kapulungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘ayon sa pasya ng Urim.’ Tumutukoy ang parirala sa pagsangguni ng pari sa harap ni Yahweh sa pamamagitan ng Urim.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ‘mga anak ni Israel’; ibig sabihin, ang mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: sa harap ni / sa harap ng
  rationale: Pinananatili nito ang karaniwang diwang panspatial at panrelasyon ng parirala, kapuwa sa pagtayo ni Josue sa harap ni Eleazar at sa pagsangguni sa harap ni Yahweh.
- source_word: יַעֲמֹד
  choice: tatayo siya
  rationale: Ang anyong di-ganap ay may puwersang nag-uutos o tumutukoy sa gagawin sa konteksto ng pagtatalaga.
- source_word: וְשָׁאַל לוֹ
  choice: Sasangguni si Eleazar para sa kanya
  rationale: Ipinakikitang si Eleazar ang paksa ng pandiwa at na ginagawa niya ang pagsangguni alang-alang kay Josue, nang hindi dinaragdagan ang nilalaman.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: sa pamamagitan ng pasya ng Urim
  rationale: Ang מִשְׁפָּט dito ay tumutukoy sa pasya o pamamaraang ginagamit sa sagradong pagsangguni. Pinanatili ang ‘Urim’ bilang teknikal na terminong pangpari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: עַל פִּיו
  choice: sa utos niya
  rationale: Likas na Filipino ito para sa idyomang literal na ‘ayon sa kanyang bibig’ at pinananatili ang panghalip na hindi tahasang nilulutas ang pinatutungkulan.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: lalabas sila ... papasok sila
  rationale: Pinananatili ang magkatambal na Hebreong pananalita para sa sama-samang pagkilos, na maaaring may pampubliko o pangmilitar na diwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa anyo ng Hebreo; nililinaw sa talababa na ang tinutukoy ay ang mga Israelita.
- source_word: הָעֵדָה
  choice: buong kapulungan
  rationale: Ang ‘kapulungan’ ay angkop sa pormal at sama-samang katawagan sa tipang pamayanan ng Israel.
theological_decisions:
- issue: Ang pinatutungkulan ng panghalip sa ‘sa utos niya’
  choice: Pinanatili ang isahang panghalip na ‘niya’ nang walang idinagdag na tiyak na pangalan.
  alternative: Maaaring unawain itong tuwirang tumutukoy kay Eleazar, o kay Josue bilang pinunong kumikilos ayon sa pasyang mula sa Diyos.
  rationale: Masinsin at hindi lubos na tiyak ang agarang pinatutungkulan sa Hebreo. Ang ‘sa utos niya’ ay nagpapanatili sa kalabuan at sa daloy ng awtoridad na kaugnay ng pagsangguni sa Urim sa harap ni Yahweh.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘sasangguni’ upang maging likas ang pagpapalit ng paksa tungo kay Eleazar. Pinanatili ang mga terminong ‘Yahweh,’ ‘Urim,’ at ‘kapulungan’ dahil sa kanilang tiyak at pormal na gamit sa konteksto.
