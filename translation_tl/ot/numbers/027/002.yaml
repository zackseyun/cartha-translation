id: NUM.27.2
reference: Numbers 27:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/תַּעֲמֹ֜דְנָה לִ/פְנֵ֣י מֹשֶׁ֗ה וְ/לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֥י הַ/נְּשִׂיאִ֖ם וְ/כָל הָ/עֵדָ֑ה פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: tl
  text: 'At tumayo sila sa harap ni Moises, ni Eleazar na pari, ng mga pinuno, at ng buong kapulungan, sa pasukan ng Tolda ng Pagtatagpo, at nagsabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: At humarap sila
  rationale: Ang עמד sa pormal at pampublikong tagpong ito ay hindi lamang pisikal na pagtayo kundi pagharap upang maglahad ng usapin. Likas sa modernong Tagalog ang “humarap” at napapanatili nito ang hudisyal na diwa.
- source_word: לִפְנֵי
  choice: kay / sa harap ng
  rationale: Ipinahihiwatig ng לִפְנֵי ang pagharap sa presensiya ng mga awtoridad at ng kapulungan. Isinama ang kahulugan sa pandiwang “humarap,” at ginamit ang likas na mga pang-ukol sa talaan.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Tuwirang salin ng titulong כֹּהֵן; hindi dinagdagan ng “punong” sapagkat wala iyon sa tekstong Hebreo.
- source_word: הַנְּשִׂיאִם
  choice: mga pinuno
  rationale: Ang נְשִׂיאִים ay mga kinikilalang pinuno ng mga lipi o pamayanan. Malinaw at makabago ang “mga pinuno” at hindi nag-aangkat ng monarkikong diwa ng “mga prinsipe.”
- source_word: כָּל הָעֵדָה
  choice: buong kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan ng Israel. Ang “kapulungan” ay natural at dignified na Filipino at nagpapanatili sa pampublikong katangian ng tagpo.
- source_word: פֶּתַח
  choice: sa pasukan ng
  rationale: Ang פֶּתַח ay pasukan o bukana; “sa pasukan ng” ang malinaw at natural na pananda ng lugar.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Sa kontekstong Pentateuchal, מוֹעֵד ay tumutukoy sa itinakdang pakikipagtagpo ng Diyos sa Israel, hindi sa tipan bilang בְּרִית. Gayunman, pinili ang pamilyar na terminong Filipino na “Toldang Tipanan” bilang kinikilalang pangalan ng santuwaryo, habang iniiwasang palawakin ang talata.
- source_word: לֵאמֹר
  choice: at sinabi,
  rationale: Pormula itong nagpapakilala sa tuwirang pananalita sa kasunod na talata. Mas natural sa kasalukuyang Tagalog ang “at sinabi” kaysa sa literal na “na nagsasabi.”
theological_decisions:
- issue: Pampubliko at legal na kalagayan ng paghahain ng usapin
  choice: Panatilihin ang buong talaan nina Moises, Eleazar, mga pinuno, at buong kapulungan
  alternative: Paikliin bilang pagharap lamang sa mga pinuno ng Israel
  rationale: Binibigyang-diin ng Hebreo na lantad at pampamayanan ang kanilang pagharap. Ang hindi pagpapaikli sa talaan ay nagpapanatili sa legal at panlipunang bigat ng usapin.
- issue: Kahulugan ng עֵדָה
  choice: buong kapulungan
  alternative: buong sambayanan
  rationale: Ang “kapulungan” ay nagpapanatili sa ideya ng pamayanang nagkatipon sa pormal na tagpo nang hindi ipinapalagay na literal na naroon ang bawat indibidwal sa bansa.
- issue: Pangalan ng אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  alternative: Tolda ng Pagtatagpo
  rationale: Ang alternatibo ay mas tuwirang sumasalamin sa מוֹעֵד bilang pakikipagtagpo, ngunit ang pinili ay pamilyar at madaling makilala sa karaniwang Filipino. Hindi ito dapat unawaing nagsasabing ang מוֹעֵד mismo ay nangangahulugang “tipan.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa publiko. Iningatan ang sunod-sunod na talaan upang mapanatili ang pormal na diin ng Hebreo; ginawang likas ang pangwakas na pormula bilang “at sinabi,” dahil nagpapatuloy ang tuwirang pananalita sa susunod na talata.
