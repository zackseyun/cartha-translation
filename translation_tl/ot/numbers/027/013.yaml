  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: tl
  text: At kapag nakita mo ito, titipunin ka rin sa iyong bayan[a], gaya ng pagkatipon ni Aaron na iyong kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas interpretatibong salin, “mamamatay ka” o “titipunin ka sa iyong mga ninuno.” Literal sa Hebreo: “titipunin ka sa iyong bayan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה
  choice: At pagkakita mo
  rationale: Ang Qal 2ms ng ראה na may pangatnig ay sumusunod sa utos na tingnan ang lupain; ipinahahayag ng pariralang ito ang temporal na pagkakasunod nang natural sa Tagalog.
- source_word: אֹתָהּ
  choice: rito
  rationale: Ang pambabaeng isahang panghalip ay tumutukoy sa naunang binanggit na lupain; ang “rito” ay natural sa Tagalog at hindi nangangailangan ng gramatikal na kasarian.
- source_word: וְנֶאֱסַפְתָּ
  choice: titipunin ka
  rationale: Pinananatili ng balintiyak na anyo ang Niphal ng אסף at ang metapora ng kamatayan sa halip na tuwirang gawing “mamamatay ka.”
- source_word: אֶל עַמֶּיךָ
  choice: sa iyong bayan
  rationale: Tuwirang pinananatili ang Hebreong idyomang “sa iyong bayan,” pati ang pampamilya at pangkomunidad na pahiwatig nito.
- source_word: גַּם אָתָּה
  choice: ka rin
  rationale: Natural na ipinahahayag sa Tagalog na sasapitin din ni Moises ang sinapit ni Aaron.
- source_word: כַּאֲשֶׁר
  choice: kung paanong
  rationale: Malinaw at natural na naghuhudyat ng paghahambing sa sinapit ni Aaron.
- source_word: נֶאֱסַף
  choice: tinipon
  rationale: Inuulit ang parehong salitang-ugat at metapora upang mapanatili ang pagkakatulad ng dalawang sugnay.
- source_word: אַהֲרֹן אָחִיךָ
  choice: si Aaron na iyong kapatid
  rationale: Ginagamit ang karaniwang anyo ng pangalan sa Filipino at malinaw na pinananatili ang ugnayang magkapatid.
theological_decisions:
- issue: Pagpapahayag sa idyomang אסף אל־עמיו tungkol sa kamatayan
  choice: Panatilihin bilang “titipunin ka ... sa iyong bayan.”
  alternative: “mamamatay ka” o “makakasama mo ang iyong mga ninuno”
  rationale: Higit sa payak na pagsasabi ng kamatayan ang Hebreong idyoma. Pinananatili ng salin ang pampamilya at pangkomunidad na himig nito nang hindi nagtatakda ng mas tiyak na doktrina tungkol sa kabilang buhay kaysa sa sinasabi ng talata.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang Hebreong metapora sa kamatayan; ginamit ang “bayan” sa kahulugang sariling sambayanan o mga kaangkan, hindi lamang isang lugar.
