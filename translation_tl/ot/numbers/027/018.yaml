  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַח לְ/ךָ֙ אֶת יְהוֹשֻׁ֣עַ בִּן נ֔וּן אִ֖ישׁ אֲשֶׁר ר֣וּחַ בּ֑/וֹ וְ/סָמַכְתָּ֥ אֶת יָדְ/ךָ֖ עָלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Moises, “Kunin mo si Josue na anak ni Nun, isang lalaking may espiritu[a], at ipatong mo sa kanya ang kamay mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lalaking kinaroroonan ng Espiritu.” Walang pantukoy ang salitang Hebreo, kaya maaari rin itong unawain bilang “isang lalaking may espiritu.”
    reason: Pinananatili ang ambiguwidad kung ang tinutukoy ay ang Espiritu ng Diyos o espiritu sa mas pangkalahatang diwa.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh.”
- source_word: קַח לְךָ
  choice: Kunin mo
  rationale: Likas na utos ito sa modernong Tagalog; hindi kailangang tahasang isalin ang idyomatikong לְךָ bilang “para sa iyo.”
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josue na anak ni Nun
  rationale: Ginagamit ang nakasanayang anyong Tagalog na “Josue,” habang malinaw na pinananatili ang ugnayang ama-anak.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tumpak na pinananatili ang panlalaking isahan ng Hebreo sa halip na gawing neutral na “tao.”
- source_word: אֲשֶׁר רוּחַ בּוֹ
  choice: isang lalaking may espiritu
  rationale: Malapit ito sa literal na “na nasa kanya ang espiritu” ngunit mas natural sa Tagalog. Ang maliit na titik at talababa ay hindi nagpapasiya kung banal na Espiritu o espiritu ang tinutukoy.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: at ipatong mo sa kanya ang kamay mo
  rationale: Natural na katumbas ng kilos ng pagpapatong ng kamay at pinananatili ang isahang “kamay” ng Hebreo.
theological_decisions:
- issue: Kung ang רוּחַ ay tumutukoy sa Espiritu ng Diyos o sa espiritu/katangiang nasa kay Josue
  choice: espiritu
  alternative: Espiritu
  rationale: Walang pantukoy ang Hebreo, kaya hindi ginawang tahasan sa pangunahing teksto ang pagkakakilanlan nito. Pinananatili ng talababa ang malamang na pagbasa na tumutukoy ito sa Espiritu ng Diyos nang hindi inaalis ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “kamay mo” sa halip na mas pormal na “iyong kamay,” at pinanatili ang maikli at tuwirang anyo ng utos.
