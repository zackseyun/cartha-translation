  text: יִפְקֹ֣ד יְהוָ֔ה אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר אִ֖ישׁ עַל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: tl
  text: Italaga nawa ng Yahweh, ang Diyos ng mga espiritu ng lahat ng tao,[a] ang isang lalaki na mamuno sa kapulungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ng lahat ng laman,” isang idyomang Hebreo para sa buong sangkatauhan bilang mga mortal na nilalang.
    reason: cultural_note
  - marker: b
    text: O “sa sambayanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְקֹד
  choice: Italaga nawa
  rationale: Sa konteksto ng pagpili ng hahalili kay Moises, ang פקד ay tumutukoy sa pagtatalaga sa isang tungkulin. Ipinahahayag ng “nawa” ang pakiusap na nasa anyong jussive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: ang Diyos ng mga espiritu
  rationale: Pinananatili ang natatanging titulong Hebreo at ang maramihang “mga espiritu,” na tumutukoy sa panloob na buhay ng mga nilalang na nasa ilalim ng kaalaman at kapangyarihan ng Diyos.
- source_word: לְכָל בָּשָׂר
  choice: ng lahat ng tao
  rationale: Ang literal na “lahat ng laman” ay isang idyomang Hebreo; sa kontekstong ito, natural itong tumutukoy sa buong sangkatauhan bilang mga mortal na nilalang.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Ang pangngalang Hebreo ay panlalaking isahan, at sa konteksto ay tumutukoy sa lalaking itatalaga bilang kahalili ni Moises.
- source_word: עַל הָעֵדָה
  choice: upang mamuno sa kapulungan
  rationale: Ang עַל ay nagpapahayag ng pamumuno o awtoridad sa ibabaw ng tipang pamayanan. Ginawang tahasan ang ugnayan upang maging natural sa modernong Tagalog; ang “kapulungan” ay nagpapanatili sa pormal at sama-samang diwa ng עֵדָה.
theological_decisions:
- issue: Pagpapahayag ng banal na pangalan sa pakiusap
  choice: Italaga nawa ni Yahweh
  alternative: Italaga nawa ng PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Kasarian ng אִישׁ
  choice: isang lalaki
  alternative: isang tao / isang pinuno
  rationale: Pinananatili ang tahasang panlalaking anyo ng Hebreo at ang konteksto ng lalaking hahalili kay Moises.
- issue: Saklaw ng לְכָל בָּשָׂר
  choice: lahat ng tao
  alternative: lahat ng laman
  rationale: Sa konteksto, ang parirala ay tumutukoy sa sangkatauhan sa mortal na kalagayan nito. Ang natural na salin ay nasa pangunahing teksto, habang ang literal na idyoma ay iniingatan sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang “Italaga nawa” bilang natural na pormula ng pakiusap, “kapulungan” para sa pormal na tipang pamayanan, at “mamuno” upang malinaw na maipahayag ang ugnayang ipinahihiwatig ng עַל.
