base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/009.yaml
  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: tl
  text: At kung wala siyang anak na babae, ibibigay ninyo ang kanyang mana sa kanyang mga kapatid na lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: At kung
  rationale: Ipinagpapatuloy nito ang sunod-sunod na mga kondisyong legal at pinananatili ang puwersa ng pang-ugnay na וְ.
- source_word: אֵין ל/וֹ
  choice: wala siyang
  rationale: Likas na salin sa Tagalog ng Hebreong konstruksiyong eksistensiyal na may ל, na nagpapahayag ng kawalan ng pag-aari o kaugnayan.
- source_word: בַּת
  choice: anak na babae
  rationale: Tiyak na pambabaeng pangngalang isahan ang בַּת; malinaw at karaniwan ang pariralang ito sa modernong Tagalog.
- source_word: וּ/נְתַתֶּם
  choice: ibibigay ninyo
  rationale: Pinananatili ang ikalawang panauhang maramihan at ang bisa ng legal na tagubilin. Sapat nang ipahiwatig ng ayos ng kondisyong pangungusap ang resultang diwa, kaya hindi na kailangan ang tahasang 'kung gayon'.
- source_word: נַחֲלָת/וֹ
  choice: ang kanyang mana
  rationale: Sa kontekstong ito, ang נַחֲלָה ay minanang ari-arian o karapatang minana; 'mana' ang pinakanatural at tumpak na katumbas.
- source_word: לְ/אֶחָי/ו
  choice: sa kanyang mga kapatid na lalaki
  rationale: Tahasang panlalaking maramihan ang Hebreo. Nililinaw ng 'na lalaki' na mga kapatid na lalaki, hindi lahat ng magkakapatid, ang tinutukoy na susunod na tagapagmana.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa legal na konteksto. Pinanatili ang anyong kondisyonal at ang tahasang kasariang panlalaki ng mga tagapagmana.
