  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֣ישׁ כִּֽי יָמ֗וּת וּ/בֵן֙ אֵ֣ין ל֔/וֹ וְ/הַֽעֲבַרְתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/בִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: tl
  text: At sabihin mo sa mga anak ni Israel[a], ‘Kung mamatay ang isang lalaki at wala siyang anak na lalaki, ilipat ninyo sa kanyang anak na babae ang kanyang mana.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, literal na “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: At sabihin mo sa mga anak ni Israel
  rationale: Pinananatili ang literal na pananalitang pampamilya na ‘mga anak ni Israel,’ habang likas sa modernong Filipino ang ‘sabihin mo sa.’
- source_word: תְּדַבֵּר לֵאמֹר
  choice: sabihin mo
  rationale: Karaniwang pormula ito ng pagpapakilala sa isang pahayag. Ang ‘sabihin mo’ ay natural at sapat na naghahatid sa diwa ng ‘magsalita ... na sinasabi.’
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Masculine singular ang legal na kasong inilalahad sa Hebreo; malinaw itong pinananatili sa Filipino.
- source_word: כִּי יָמוּת
  choice: Kung mamatay
  rationale: Sa batas na naglalahad ng isang posibleng kaso, ang כִּי ay likas na isinasalin bilang kondisyunal na ‘kung.’
- source_word: וּבֵן אֵין לוֹ
  choice: at wala siyang anak na lalaki
  rationale: Nililinaw ng ‘anak na lalaki’ ang kahulugan ng בֵּן at ang kawalan ng lalaking tagapagmana, na hindi laging malinaw sa salitang Filipino na ‘anak’ lamang.
- source_word: וְהַעֲבַרְתֶּם
  choice: ilipat ninyo
  rationale: Ang Hiphil ng עבר dito ay tumutukoy sa legal na paglilipat ng karapatan sa mana; tuwiran at makabago ang ‘ilipat ninyo.’
- source_word: נַחֲלָתוֹ
  choice: kanyang mana
  rationale: Sa konteksto, ang נַחֲלָה ay minanang ari-arian o karapatan sa mana; ‘mana’ ang pinakamaikli at natural na katumbas.
- source_word: לְבִתּוֹ
  choice: sa kanyang anak na babae
  rationale: Ang לְ ay tumutukoy sa tatanggap ng mana, at nililinaw ng ‘anak na babae’ ang kasarian na tahasang nasa בַּת.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormang legal at ang tahasang pagtukoy sa kasarian, ngunit ginawang natural ang pormula ng pagsasalita sa Filipino.
