  source_fidelity: 'Tumpak na naihahatid ng salin ang utos na magsalita sa בני ישראל at ang kasong legal: kung mamatay ang isang lalaki nang walang anak na lalaki, ililipat ang kanyang mana sa kanyang anak na babae. Ang kondisyunal na “Kung,” ang tahasang “anak na lalaki,” at ang legal na “ilipat ninyo” ay angkop sa Hebreo.'
