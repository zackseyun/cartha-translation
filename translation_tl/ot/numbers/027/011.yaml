id: NUM.27.11
reference: Numbers 27:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: tl
  text: At kung walang kapatid na lalaki ang kanyang ama, ibibigay ninyo ang kanyang mana sa pinakamalapit niyang kamag-anak[a] mula sa kanyang angkan, at mamanahin niya iyon.[b] Ito ay magiging tuntuning legal[c] para sa mga anak ni Israel[d], gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kanyang kamag-anak sa dugo na pinakamalapit sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: O “at aariin niya iyon.” Ang pandiwang Hebreo ay maaaring mangahulugang magmana o ariin.
    reason: lexical_alternative
  - marker: c
    text: O “tuntunin sa paghatol” o “ordinansang legal.”
    reason: lexical_alternative
  - marker: d
    text: Ang “mga anak ni Israel” ay karaniwang katawagang tipanan para sa buong sambayanang Israel.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים לְאָבִיו
  choice: kapatid na lalaki ang kanyang ama
  rationale: Tinutukoy ng אַחִים ang mga kapatid na lalaki ng ama sa pagkakasunod-sunod ng mga tagapagmana. Ang ganitong ayos ay malinaw at likas sa makabagong Tagalog.
- source_word: נַחֲלָתוֹ
  choice: kanyang mana
  rationale: Ang נַחֲלָה rito ay minanang ari-arian o karapatang minana; ang “mana” ang maikli at karaniwang terminong legal sa Tagalog.
- source_word: לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: sa pinakamalapit niyang kamag-anak
  rationale: Pinagsasama ng Hebreo ang kamag-anak sa dugo at ang taong pinakamalapit sa antas ng pagkakamag-anak. Natural na naipahahayag sa Tagalog ang dalawang sangkap sa pariralang ito.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: mula sa kanyang angkan
  rationale: Ang מִשְׁפָּחָה ay mas malawak na pangkat ng magkakamag-anak sa loob ng kaayusang panlipi ng Israel; mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: וְיָרַשׁ אֹתָהּ
  choice: at mamanahin niya iyon
  rationale: Ang ירשׁ ay maaaring mangahulugang magmana o ariin. Dahil batas sa pagmamana ang konteksto, malinaw ang “mamanahin,” habang pinananatili sa talababa ang alternatibong diwa.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: tuntuning legal
  rationale: Ipinahahayag ng tambalang Hebreo ang isang permanenteng batas o ordinansang namamahala sa legal na pagpapasya. Likas sa Tagalog ang “tuntuning legal,” samantalang nakatala sa talababa ang mas literal na anyo.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Pinananatili nito ang literal at tipanang katawagan sa sambayanang Israel nang hindi ipinapalagay na mga lalaki lamang ang saklaw.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng לִבְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang tradisyonal na katawagang tipanan at pambansa. Sa konteksto, kolektibo itong tumutukoy sa sambayanang Israel, hindi lamang sa mga lalaking indibidwal.
- issue: Diwa ng חֻקַּת מִשְׁפָּט
  choice: tuntuning legal
  alternative: tuntunin sa paghatol; ordinansang legal
  rationale: Hindi dapat gawing abstraktong “katarungan” lamang ang מִשְׁפָּט; sa kontekstong ito, tumutukoy ito sa umiiral na patakaran para sa legal na pagpapasya tungkol sa mana.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may tonong angkop sa batas. Ginamit ang “kapatid na lalaki” upang mapanatili ang tiyak na kasarian ng אַחִים, “angkan” para sa mas malawak na pangkat ng magkakamag-anak, at “mga anak ni Israel” upang mapanatili ang katawagang tipanan. Ang mga tunay na saklaw ng kahulugan ng ירשׁ at חֻקַּת מִשְׁפָּט ay hindi tahimik na nilutas kundi inilagay sa mga talababa.
