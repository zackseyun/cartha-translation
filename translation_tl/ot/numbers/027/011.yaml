  source_fidelity: 'Tapat ang salin sa pagkakasunod-sunod ng tagapagmana sa Hebreo: kung walang kapatid na lalaki ang ama ng yumao, ang mana ay ibibigay sa pinakamalapit na kadugo mula sa kanyang angkan, na siyang magmamana nito. Naipapahayag din nang wasto ang pangwakas na pagtatalaga rito bilang umiiral na legal na tuntunin para sa mga anak ni Israel.'
  naturalness: Malinaw, moderno, at marangal ang Tagalog. Ang “kapatid na lalaki,” “pinakamalapit niyang kamag-anak,” “angkan,” at “tuntuning legal” ay likas at angkop sa pormal na rehistrong pambatas. Ang mga panghalip ay nababasa nang maayos sa konteksto ng batas sa pagmamana.
  terminology: Ang “mana” para sa נַחֲלָה, “angkan” para sa מִשְׁפָּחָה, at “Yahweh” para sa יהוה ay angkop at pare-pareho. Ang “mga anak ni Israel” ay wastong literal na katawagang pambansa/tipanan, at maayos na nililinaw ng talababa ang kolektibong saklaw nito. Sapat na ipinahahayag ng “tuntuning legal” ang חֻקַּת מִשְׁפָּט nang hindi ipinapataw ang isang partikular na doktrinal na pagbasa.
