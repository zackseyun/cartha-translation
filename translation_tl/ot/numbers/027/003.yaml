id: NUM.27.3
reference: Numbers 27:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: tl
  text: “Namatay ang aming ama sa ilang. Hindi siya kabilang sa kapulungan ng mga nagtipon laban kay Yahweh kasama ng pangkat ni Korah. Sa halip, namatay siya dahil sa sarili niyang kasalanan[a], at wala siyang mga anak na lalaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa kanyang kasalanan.” Hindi tinutukoy ng Hebreo kung ano ang kasalanang iyon; binibigyang-diin lamang na hindi siya namatay bilang kabilang sa paghihimagsik ni Korah.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: aming ama
  rationale: Tuwirang tumutukoy sa ama ng mga anak na babaeng nagsasalita; hindi kailangan ang mas malawak na ‘ninuno.’
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Natural at karaniwang salin sa Filipino para sa ilang na dinaanan ng Israel; hindi nito ipinapalagay na purong disyerto ang lugar.
- source_word: בְּתוֹךְ הָעֵדָה הַנּוֹעָדִים
  choice: kabilang sa kapulungan ng mga nagtipon
  rationale: Ipinapahayag ng ‘kabilang’ ang diwang ‘nasa gitna/kasama,’ samantalang pinananatili ng ‘kapulungan’ at ‘nagtipon’ ang magkakaugnay na kolektibong diwa ng Hebreo.
- source_word: עַל יְהוָה
  choice: laban kay Yahweh
  rationale: Sa konteksto, ang עַל ay nagpapahiwatig ng mapanlabang pagtitipon; pinananatili ang personal na pangalang Yahweh para sa Tetragrammaton.
- source_word: בַּעֲדַת קֹרַח
  choice: kasama ng pangkat ni Korah
  rationale: Malinaw na tumutukoy sa natatanging pangkat na kaugnay ng paghihimagsik ni Korah at iniiwasan ang alanganing pag-uulit ng ‘kapulungan.’
- source_word: כִּי בְחֶטְאוֹ מֵת
  choice: Sa halip, namatay siya dahil sa sarili niyang kasalanan
  rationale: Ipinakikita ng ‘sa halip’ ang pagwawasto o paghahambing sa naunang pagtanggi. Ang ‘dahil sa’ ay natural na causal na pagbasa ng בְ, habang ang ‘sarili niyang’ ay nililinaw ang kaibhan sa sama-samang paghihimagsik nang hindi tinutukoy kung ano ang kasalanan.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: at wala siyang mga anak na lalaki
  rationale: Natural na Filipino para sa konstruksiyong היה + לְ; pinananatili ang ‘anak na lalaki’ dahil mahalaga ito sa usapin ng mana sa konteksto.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Personal na kasalanan at paghihimagsik ng pangkat ni Korah
  choice: “dahil sa sarili niyang kasalanan”
  alternative: “sa kanyang kasalanan”
  rationale: Pinananatili ang pahayag ng mga anak na babae na hindi kabilang ang kanilang ama sa paghihimagsik ni Korah ngunit namatay siya kaugnay ng sarili niyang kasalanan. Hindi tinutukoy ng salin kung anong kasalanan iyon o nilulutas ang lahat ng teolohikal na tanong tungkol sa kanyang kamatayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kapulungan’ para sa pampublikong pangkat, ‘pangkat ni Korah’ para sa tiyak na rebeldeng samahan, at ‘mga anak na lalaki’ upang mapanatili ang legal na kabuluhan ng kasunod na usapin tungkol sa mana.
