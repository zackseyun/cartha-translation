  to: Tama ang sinasabi ng mga anak na babae ni Zelofehad.[a] Tiyak na pagkalooban mo sila[b] ng ari-ariang pamana kasama ng mga kapatid na lalaki ng kanilang ama, at ilipat mo sa kanila ang mana ng kanilang ama.
