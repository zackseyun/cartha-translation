  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: tl
  text: Tama ang sinasabi ng mga anak na babae ni Zelofehad.[a] Tiyak na pagkalooban mo sila[b] ng ari-ariang pamana kasama ng mga kapatid na lalaki ng kanilang ama, at ilipat mo sa kanila ang mana ng kanilang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Tama ang sinasabi ng mga anak na babae ni Zelofehad.” Pinananatili ng salin ang tahasang pagtukoy sa kanilang sinasabi.'
    reason: lexical_alternative
  - marker: b
    text: Panlalaking maramihan ang hulapi ng Hebreo sa “bigyan mo sila” sa bahaging ito, ngunit malinaw sa konteksto na ang tinutukoy ay ang mga anak na babae ni Zelofehad.
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: Tama ang sinasabi
  rationale: Pinagsama ang pang-abay at pandiwaring participle upang likas na ipahayag sa Filipino ang pagpapatibay na tama ang kanilang pahayag o kahilingan, habang nananatili ang diwa ng pagsasalita.
- source_word: נָתֹן תִּתֵּן
  choice: Talagang bigyan mo
  rationale: Ipinapakita ng infinitive absolute na sinusundan ng pandiwa ang matinding diin ng utos; ang “talagang” ay natural na naghahatid ng diin sa modernong Filipino.
- source_word: לָהֶם
  choice: sila
  rationale: Bagaman panlalaki ang anyo ng hulaping maramihan sa puntong ito ng tekstong Hebreo, malinaw na ang tinutukoy sa konteksto ay ang mga anak na babae ni Zelofehad.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: pag-aaring mana
  rationale: Pinananatili ng parirala ang magkaugnay na ideya ng pag-aaring ipinagkaloob at ng mana sa konteksto ng paglalaan ng lupa.
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: sa gitna ng mga kapatid na lalaki ng kanilang ama
  rationale: Malapit itong sumusunod sa lokatibong diwa ng Hebreo at nililinaw na ang bahagi nila ay nasa loob ng bahaging pangangkan ng mga kapatid na lalaki ng kanilang ama.
- source_word: וְהַעֲבַרְתָּ
  choice: ilipat mo
  rationale: 'Ang Hiphil ng עבר ay may legal at administratibong diwa rito: ang pagpapasa ng mana sa ibang tagapagmana.'
- source_word: נַחֲלַת אֲבִיהֶן
  choice: mana ng kanilang ama
  rationale: Tuwirang ipinapahayag nito ang manang nauukol sa kanilang namatay na ama nang hindi nagdaragdag ng interpretasyon.
