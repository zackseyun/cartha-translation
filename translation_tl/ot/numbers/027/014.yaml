  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: tl
  text: Dahil sinuway ninyo ang aking utos sa ilang ng Zin, sa pagtatalo ng kapulungan, sa hindi ninyo pagpapakitang banal ako sa may tubig sa harap nila.[a] Ito ang tubig ng Meriba ng Kades[b], sa ilang ng Zin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “upang ipakitang banal ako sa may tubig sa harap nila.” Positibo ang anyo ng pariralang Hebreo, ngunit malinaw sa konteksto na nabigo sina Moises at Aaron na gawin ito.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Meribat-Kades” o, mas literal, “ang pagtatalo ng Kades.”
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Dahil
  rationale: Sa konteksto, ipinakikilala ng kataga ang dahilan kung bakit hindi makapapasok sina Moises at Aaron sa lupain; malinaw at likas sa Tagalog ang “Dahil.”
- source_word: מְרִיתֶם
  choice: sinuway ninyo
  rationale: Ang pandiwa ay tumutukoy sa mapanghimagsik na pagsalungat sa awtoridad. Ang “sinuway ninyo” ay tuwiran at natural, habang pinananatili ang bigat ng pagkakasala.
- source_word: פִּי
  choice: aking utos
  rationale: Literal itong “aking bibig,” ngunit idyomatikong tumutukoy sa iniutos ng Diyos. Inihahatid ng “aking utos” ang kahulugan nang malinaw sa modernong Tagalog.
- source_word: בְּמִדְבַּר צִן
  choice: sa ilang ng Zin
  rationale: Ang “ilang” ay angkop sa heograpikong gamit ng מִדְבָּר at mas malawak kaysa “disyerto”; isinasatitik ang Zin bilang pangalan ng lugar.
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: nang makipagtalo ang kapulungan
  rationale: Inilalarawan ng parirala ang pangyayaring minarkahan ng pakikipagtalo ng buong sambayanan. Ang “kapulungan” ay nagpapanatili sa kolektibong diwa ng עֵדָה.
- source_word: לְהַקְדִּישֵׁנִי
  choice: hindi ninyo ipinakitang banal ako
  rationale: Positibo ang anyo ng infinitive (“ipakitang banal ako”), ngunit ipinahihiwatig ng konteksto na nabigo silang gawin ito. Ginawang tahas ang pagkakaila upang maging malinaw sa Tagalog.
- source_word: בַּמַּיִם
  choice: sa tubig
  rationale: Tinutukoy nito ang tubig bilang lugar o kalagayan ng pangyayari; simple at likas ang “sa tubig.”
- source_word: לְעֵינֵיהֶם
  choice: sa kanilang paningin
  rationale: Pinananatili nito ang diwa ng hayagan at nakikitang pangyayari nang hindi nagiging salitang-salita o alanganin sa Tagalog.
- source_word: הֵם
  choice: Ito ang
  rationale: Ginagamit ang panghalip upang tukuyin at kilalanin ang nabanggit na tubig. Dahil karaniwang itinuturing na di-mabilang ang “tubig” sa Tagalog, natural ang isahang “Ito ang.”
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: tubig ng Meriba sa Kades
  rationale: Pinananatili ang kinikilalang pangalang Meriba at malinaw na iniuugnay ito sa Kades. Mas madaling maunawaan sa Tagalog kaysa sa pinagdikit na transliterasyong “Meribat-Kades.”
theological_decisions:
- issue: Ang kabiguang ipinahihiwatig ng לְהַקְדִּישֵׁנִי
  choice: hindi ninyo ipinakitang banal ako
  alternative: upang ipakitang banal ako
  rationale: Positibo sa anyong Hebreo ang infinitive, ngunit ang pangunahing sugnay at kaugnay na salaysay ay nagpapakitang hindi ito ginawa nina Moises at Aaron. Ginawang tahas ang ipinahihiwatig na pagkakaila, habang inilalagay sa talababa ang mas literal na anyo upang mapanatili ang tensiyon ng balarila at konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “ilang,” “kapulungan,” at “sa kanilang paningin” upang mapanatili ang biblikal na tono nang hindi maging lipas o labis na literal. Inilipat ang mga pananda ng talababa sa mismong mga pariralang tinatalakay ng bawat tala.
