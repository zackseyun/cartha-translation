  edition: WLC
  text: וְ/נָתַתָּ֥ה מֵ/הֽוֹדְ/ךָ֖ עָלָ֑י/ו לְמַ֣עַן יִשְׁמְע֔וּ כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: tl
  text: At ilagay mo sa kanya ang bahagi ng iyong dangal[a], upang sundin[b] siya ng buong kapulungan ng mga anak ni Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “karangalan” o “karilagan.” Ang salitang Hebreo ay maaaring tumukoy sa maringal na dangal at sa awtoridad na kaakibat ng katungkulan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “makinig sa kanya” o “pakinggan siya.” Ang pandiwang Hebreo ay madalas tumukoy sa pakikinig na may kasamang pagsunod.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mga anak ni Israel.”
    reason: source_form_note
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: At ilagay mo
  rationale: Bagaman literal na “ibigay,” ang pandiwang נתן kasama ng עַל ay likas na naipapahayag sa Tagalog bilang “ilagay ... sa,” at pinananatili nito ang larawan ng pagkakaloob sa pagtatalaga.
- source_word: מֵהוֹדְךָ
  choice: ang bahagi ng iyong dangal
  rationale: Ang הוֹד ay maaaring tumukoy sa dangal, karilagan, o maringal na katayuan. Ang “dangal” ay sapat na malawak upang huwag ipantay agad ang salita sa awtoridad lamang; ipinahihiwatig ng מִן ang isang bahagi, hindi ang kabuuan.
- source_word: עָלָיו
  choice: sa kanya
  rationale: Tuwirang salin ng עַל na may hulaping panghalip, sa natural na ayos ng Tagalog.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw at dignified na panandang nagsasaad ng layunin.
- source_word: יִשְׁמְעוּ
  choice: sundin
  rationale: Sa konteksto ng pagtatalaga sa isang pinuno, ang שׁמע ay tumutukoy sa pakikinig na may pagtugon o pagsunod, hindi lamang sa pandinig.
- source_word: כָּל עֲדַת
  choice: buong kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan ng Israel; natural at pormal sa modernong Tagalog ang “buong kapulungan.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang tahasang pampamilyang anyo ng Hebreo sa halip na gawing “mga Israelita.”
theological_decisions:
- issue: Kalikasan ng ibinabahagi ni Moises kay Josue
  choice: Isinalin bilang “bahagi ng iyong dangal,” na pinananatili ang malawak na diwa ng הוֹד at ang bahagyang pagkakaloob.
  alternative: “Ilan sa iyong awtoridad,” “bahagi ng iyong karilagan,” o “bahagi ng iyong karangalan.”
  rationale: May kaugnayan sa pampublikong katungkulan at awtoridad ang konteksto, ngunit ang הוֹד mismo ay hindi simpleng katumbas ng “awtoridad.” Pinananatili ng “dangal” ang leksikal na lawak at ang tensiyon sa pagitan ng maringal na katayuan at kapangyarihang kaakibat ng tungkulin.
- issue: Diwa ng שׁמע sa sugnay ng layunin
  choice: “sundin siya”
  alternative: “makinig sa kanya” o “pakinggan siya”
  rationale: Sa konteksto ng pamumuno at pagtatalaga, ang pandiwa ay karaniwang nangangahulugang makinig nang may pagsunod. Gayunman, itinatala sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “kapulungan” bilang pormal ngunit pangkaraniwang katawagan sa nagkakatipong pamayanan; iniwasang gawing tahasang “awtoridad” ang הוֹד upang mapanatili ang tunay na lawak ng salitang Hebreo.
