base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: tl
  text: 'Pagkatapos, lumapit[a] ang mga anak na babae ni Zelofehad na anak ni Hefer, na anak ni Gilead, na anak ni Makir, na anak ni Manases, mula sa mga angkan ni Manases na anak ni Jose. Ito ang mga pangalan ng kanyang mga anak na babae: Mahla, Noa[b], Hogla, Milca, at Tirza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “lumapit” ay maaari ring isaling “humarap.” Maaaring ipinahihiwatig ng salita ang pormal na paglapit upang magharap ng kahilingan, gaya ng isinasalaysay sa mga kasunod na talata.
    reason: lexical_alternative
  - marker: b
    text: Ang Noa rito ay isa sa mga anak na babae ni Zelofehad, hindi ang lalaking Noe na binanggit sa Genesis.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: lumapit
  rationale: Ang Qal wayyiqtol na pambabaeng maramihan ng קרב ay nagsasaad na lumapit o humarap sila. Likas ang “lumapit” sa Filipino at hindi nito labis na tinutukoy kung kanino sila lumapit; ipinahihiwatig ng kasunod na salaysay ang pormal na paghaharap ng kanilang kahilingan.
- source_word: בְּנוֹת
  choice: mga anak na babae ni
  rationale: Tumutukoy ito sa literal na mga anak na babae, gaya ng pinatutunayan ng kasunod na talaan ng kanilang mga pangalan.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: anak ni ... na anak ni ... na anak ni ... na anak ni
  rationale: Pinananatili ang sunod-sunod na talaangkanan sa halip na paikliin bilang “inapo,” sapagkat mahalaga ang tiyak na linya ng angkan sa usapin ng mana.
- source_word: לְמִשְׁפְּחֹת
  choice: mula sa mga angkan ni
  rationale: Sa kontekstong panlipi, ang מִשְׁפָּחָה ay isang angkan, hindi lamang isang sambahayan. Ipinahahayag ng “mula sa” ang pagkakabilang o kaugnayan nila sa mga angkan ni Manases.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Ito ang mga pangalan ng kanyang mga anak na babae
  rationale: Natural na pormulang Filipino ito para ipakilala ang talaan ng mga pangalan at malinaw na tumutukoy kay Zelofehad ang “kanyang.”
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milca, at Tirza
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang pantangi, habang pinananatili ang kanilang pagkakakilanlan bilang limang anak na babae ni Zelofehad.
