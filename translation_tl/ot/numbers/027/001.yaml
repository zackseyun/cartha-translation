  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang buong hanay ng talaangkanan dahil mahalaga ito sa konteksto ng paghahabol sa mana. Ginamit ang “mga angkan” para sa panliping kahulugan ng מִשְׁפְּחֹת, at ang mga pangalan ay iniangkop sa karaniwang baybay-Filipino.
