  text: אֲשֶׁר יֵצֵ֣א לִ/פְנֵי/הֶ֗ם וַ/אֲשֶׁ֤ר יָבֹא֙ לִ/פְנֵי/הֶ֔ם וַ/אֲשֶׁ֥ר יוֹצִיאֵ֖/ם וַ/אֲשֶׁ֣ר יְבִיאֵ֑/ם וְ/לֹ֤א תִהְיֶה֙ עֲדַ֣ת יְהוָ֔ה כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: tl
  text: na siyang lalabas sa unahan nila at papasok sa unahan nila,[a] at siyang maglalabas at magpapasok sa kanila,[b] upang ang kapulungan ni Yahweh[c] ay hindi maging tulad ng mga tupang walang pastol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa harap nila” sa dalawang paglitaw ng parirala.
    reason: lexical_alternative
  - marker: b
    text: Ang pagkakasunod-sunod na “lalabas ... papasok ... maglalabas ... magpapasok” ay isang paraang Hebreo ng paglalarawan sa pamumunong sumasaklaw sa lahat ng pampublikong gawain ng bayan.
    reason: cultural_note
  - marker: c
    text: Maaari ring “pamayanan ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na siyang
  rationale: Ipinakikilala nito ang kaugnay na sugnay na naglalarawan sa hinihiling na pinuno; likas sa Tagalog ang “na siyang” para sa personal na tinutukoy mula sa naunang talata.
- source_word: יֵצֵא ... יָבֹא
  choice: lalabas ... papasok
  rationale: Pinananatili ang magkatambal na pandiwa at ang prospektibong diwa ng mga imperfect sa konteksto ng hinihiling na magiging pinuno.
- source_word: לִפְנֵיהֶם
  choice: sa unahan nila
  rationale: Tumpak at natural na ipinahahayag ang literal na diwang “sa harap nila,” kasama ang pahiwatig na ang pinuno ang nangunguna.
- source_word: יוֹצִיאֵם ... יְבִיאֵם
  choice: maglalabas at magpapasok sa kanila
  rationale: 'Ipinakikita ng mga anyong Hiphil ang sanhi o pagpapakilos: ang pinuno ang magdadala o mangunguna sa bayan sa paglabas at pagpasok.'
- source_word: עֲדַת יְהוָה
  choice: ang kapulungan ni Yahweh
  rationale: Ang “kapulungan” ay dignificado at madaling maunawaang katawagan para sa sama-samang bayan; pinananatili naman ang personal na pangalang Yahweh.
- source_word: כַּצֹּאן
  choice: tulad ng mga tupa
  rationale: Ang pangngalang kolektibo ay likas na isinasalin sa Tagalog bilang maramihang “mga tupa,” habang tuwirang pinananatili ang pagtutulad.
- source_word: רֹעֶה
  choice: pastol
  rationale: Karaniwang salitang Tagalog ito para sa tagapag-alaga ng mga tupa at pinananatili nito ang metapora ng pamumuno.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Larawan ng pamumuno sa “lalabas ... papasok ... maglalabas ... magpapasok”
  choice: Pinanatili ang kongkretong pagkakasunod-sunod ng mga kilos
  alternative: Ibuod bilang “mamumuno” o “gagabay sa lahat ng gawain”
  rationale: Ang kongkretong wika ng pagkilos ay umaakay tungo sa larawan ng mga tupang may pastol; ang pagpapanatili rito ay hindi nagpapahina sa metapora o naglilimita sa saklaw ng pamumuno.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit at kongkretong galaw ng Hebreo, ngunit ginamit ang natural na ayos na “sa unahan nila.” Ang “kapulungan” ay mas malawak kaysa sa terminong maaaring ipakahulugang isang lokal na kongregasyon.
