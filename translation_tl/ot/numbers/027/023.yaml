  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: tl
  text: Ipinatong ni Moises ang kanyang mga kamay kay Josue at inatasan siya[a], gaya ng sinabi ni Yahweh sa pamamagitan ni Moises[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “inutusan siya” o “binigyan siya ng tagubilin.” Sa kontekstong ito, pormal na ipinagkatiwala ni Moises kay Josue ang kanyang tungkulin.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa kamay ni Moises,” isang idyomang Hebreo na nangangahulugang kumilos o magsalita sa pamamagitan ni Moises bilang kinatawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: Ipinatong ni Moises ang kanyang mga kamay kay Josue
  rationale: Ang סָמַךְ kasama ng mga kamay na ipinapatong sa isang tao ay tumutukoy sa ritwal na pagpapatong ng mga kamay. Tahasang pinangalanan sina Moises at Josue mula sa agarang konteksto upang maging malinaw at natural sa Tagalog, habang pinananatili ang maramihang יָדָיו, “kanyang mga kamay.”
- source_word: וַיְצַוֵּהוּ
  choice: at inatasan siya
  rationale: Karaniwang nangangahulugang “mag-utos” ang צוה, ngunit sa kontekstong ito ay pormal na ibinibigay ni Moises kay Josue ang tungkuling mamuno. Saklaw ng “inatasan” kapwa ang pagbibigay ng utos at ang pormal na pagkakatiwala ng tungkulin nang hindi nagpapasok ng natatanging ritwal o doktrinang wala sa teksto.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: gaya ng sinabi
  rationale: Ipinahahayag nito ang pagtutugma ng ginawa ni Moises sa naunang sinabi ni Yahweh. Hindi kailangan sa natural na Tagalog ang tahasang anyong katumbas ng English past perfect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang literal na “sa kamay ni Moises” ay idyoma ng Hebreo para sa pagkilos o pagsasalita sa pamamagitan ng isang kinatawan. Ang “sa pamamagitan ni Moises” ang malinaw at likas na katumbas sa modernong Tagalog; itinatala sa talababa ang literal na anyo.
theological_decisions:
- issue: Ang kahulugan ng צוה sa pagtatalaga kay Josue
  choice: inatasan siya
  alternative: inutusan siya; binigyan siya ng tagubilin
  rationale: Pinananatili ng “inatasan” ang posibilidad ng isang ibinigay na utos ngunit kinikilala rin ang konteksto ng pormal na pagkakatiwala kay Josue ng tungkuling mamuno. Hindi ito gumagamit ng terminong maaaring magpahiwatig ng isang partikular na tradisyong eklesiastikal.
- issue: Ang ahensiya sa pariralang בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  alternative: sa kamay ni Moises
  rationale: Ipinakikita ng idyoma na si Yahweh ang nagsalita at si Moises ang kanyang kinatawan. Ang natural na salin ay hindi nagpapalit sa pinagmulan ng utos o nagpapahiwatig na kay Moises ito nagmula.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “ipinatong” para sa ritwal na kilos, “inatasan” upang mapanatili ang saklaw ng utos at pormal na pagkakatiwala ng tungkulin, at “sa pamamagitan ni Moises” bilang natural na salin ng idyomang Hebreo.
