base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: tl
  text: Ginawa ni Moises ang iniutos sa kanya ni Yahweh. Kinuha niya si Josue at pinatayo[a] sa harap ni Eleazar na pari at sa harap ng buong kapulungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iniharap.” Maaari ring isalin ang pandiwang Hebreo bilang “ipinaharap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר צִוָּה
  choice: Ginawa ... ang iniutos
  rationale: Likas sa makabagong Tagalog at tapat sa karaniwang pandiwang עשה at sa paghahambing sa naunang utos, nang hindi nagdaragdag ng paliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: Kinuha niya si Josue
  rationale: Ang לקח ay pangunahing nangangahulugang kumuha; malinaw sa konteksto na dinala ni Moises si Josue para sa pampublikong pagtatalaga.
- source_word: וַיַּעֲמִדֵהוּ
  choice: pinatayo
  rationale: Ang causative na anyo ng עמד ay literal na magpatayo o maglagay na nakatayo. Pinananatili ng 'pinatayo' ang pisikal at seremonyal na larawan, habang inilalagay sa talababa ang mas interpretatibong 'iniharap.'
- source_word: לִפְנֵי
  choice: sa harap
  rationale: Ipinahihiwatig nito ang pampublikong paglalagay sa presensiya ni Eleazar at ng buong kapulungan.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Payak at malinaw na pagtukoy sa katungkulan ni Eleazar.
- source_word: כָּל־הָעֵדָה
  choice: buong kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan ng Israel; natural at marangal sa Tagalog ang 'kapulungan,' at ang 'buong' ay kumakatawan sa כָּל.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pagkakaiba nito sa mga titulong tumutukoy sa Diyos.
- issue: Kahulugan ng seremonyal na pagkilos na וַיַּעֲמִדֵהוּ
  choice: pinatayo
  alternative: iniharap
  rationale: 'Hindi nilulutas nang palihim ang saklaw ng pandiwa: nasa pangunahing teksto ang mas kongkretong causative na diwa, at nasa talababa ang wastong kontekstuwal na alternatibo.'
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw at marangal. Ginamit ang 'Josue,' ang nakasanayang anyong Tagalog ng pangalan, at 'kapulungan' para sa pampublikong pamayanan ng Israel. Iniwasan ang labis na literal na pag-uulit ng 'sa harap' habang pinananatili ang saklaw nito sa kapuwa kay Eleazar at sa buong kapulungan.
