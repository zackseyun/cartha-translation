  text: So Moses brought their case before Yahweh[a].
translation:
  language: tl
  text: Kaya iniharap ni Moises kay Yahweh[a] ang kanilang usapin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iniharap ni Moises sa harap ni Yahweh ang kanilang usaping legal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: iniharap
  rationale: Ang Hiphil ng קרב ay nangangahulugang ilapit o iharap. Sa kontekstong legal, natural na ipinahihiwatig ng “iniharap” ang pormal na pagdadala ng usapin upang pagpasyahan.
- source_word: מִשְׁפָּטָן
  choice: ang usapin ng mga babae
  rationale: Ang מִשְׁפָּט ay maaaring tumukoy sa hatol, katarungan, karapatang legal, o kasong dinidinig. Ang hulaping pambabae na maramihan ay tumutukoy sa mga anak na babae ni Zelofehad; nililinaw ito ng “ng mga babae” nang hindi paunang nagpapasiya sa bisa ng kanilang paghahabol.
- source_word: לִפְנֵי
  choice: kay
  rationale: Literal itong “sa harap ng,” ngunit sa modernong Tagalog, ang “iniharap kay” ang likas na parirala para sa pagsusumite ng usapin sa isang magpapasiya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַ
  choice: Kaya
  rationale: Ipinagpapatuloy ng waw ang salaysay at dito ay ipinakikita rin ang bunga ng naunang pakiusap ng mga babae; natural itong naipahahayag ng “Kaya.”
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa banal na pangalan at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Kalikasan ng מִשְׁפָּטָן
  choice: usapin ng mga babae
  alternative: kanilang paghahabol na legal o kanilang kaso
  rationale: Pinananatili ng “usapin” ang lawak ng salitang Hebreo at hindi nito ipinapalagay nang maaga kung ito ay karapatan, paghahabol, o hatol, samantalang malinaw pa rin ang legal na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Ginamit ang “iniharap kay” bilang idiomatikong katumbas ng literal na “dinala sa harap ni,” at nilinaw ang pambabaeng maramihang reperente bilang “mga babae.”
