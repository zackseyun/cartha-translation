  yaml_path: translation/ot/numbers/027/015.yaml
  text: Then Moses spoke to Yahweh[a], saying,
translation:
  language: tl
  text: Pagkatapos, nagsalita si Moises kay Yahweh[a] at sinabi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; karaniwang isinasalin na “ang PANGINOON.”'
