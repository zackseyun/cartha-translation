lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang wayyiqtol ng דבר ay nagsusulong sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos” para sa pagkakasunod-sunod, at mas tuwirang katumbas ng pandiwa ang “nagsalita” kaysa “sinabi,” lalo na't may kasunod na לֵאמֹר.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: אֶל
  choice: kay
  rationale: Ipinahihiwatig ng pang-ukol ang pinatutungkulan ng pagsasalita; “kay” ang likas na gamit sa Tagalog bago ang personal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ipinapakilala ng infinitive construct ang tuwirang pananalitang susunod. Mas natural sa modernong Tagalog ang hiwalay na “Sinabi niya,” kaysa sa literal ngunit mabigat na “na nagsasabi,” habang nananatiling malinaw ang Hebreong pormula.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan at hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Hinati sa dalawang sugnay ang Hebreong pormula ng pagsasalita upang maiwasan ang di-likas na “nagsalita ... na nagsasabi,” habang pinananatili ang pag-uulit ng דבר at אמר.
