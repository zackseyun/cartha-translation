  text: וַ/יֹּ֨אמֶר יְהוָ֜ה פִּתְאֹ֗ם אֶל מֹשֶׁ֤ה וְ/אֶֽל אַהֲרֹן֙ וְ/אֶל מִרְיָ֔ם צְא֥וּ שְׁלָשְׁתְּ/כֶ֖ם אֶל אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּצְא֖וּ שְׁלָשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: tl
  text: Biglang sinabi ni Yahweh kina Moises, Aaron, at Miriam, “Lumabas kayong tatlo patungo sa Toldang Tipanan.” At lumabas silang tatlo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: פִּתְאֹם
  choice: Biglang
  rationale: Natural itong katumbas sa makabagong Tagalog at ipinahahayag ang di-inaasahan at agarang pagsasalita ni Yahweh.
- source_word: צְאוּ
  choice: Lumabas
  rationale: Ang pandiwang יצא ay tumutukoy sa paglabas mula sa isang lugar. Hindi likas sa Tagalog na piliting piliin ang pagkakaibang Ingles na “come out/go out”; malinaw na naipahahayag ito ng “lumabas.”
- source_word: שְׁלָשְׁתְּכֶם
  choice: kayong tatlo
  rationale: Tuwirang tinutukoy at binibigyang-diin na ang tatlong kausap ay kapuwa ipinatawag.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Inilalarawan nito ang itinalagang tolda kung saan nakikipagtagpo si Yahweh sa Israel; ang “toldang tipanan” ay maikli, marangal, at madaling maunawaan.
- source_word: וַיֵּצְאוּ
  choice: lumabas
  rationale: Tuwirang salaysay ito ng pagtupad nila sa utos na lumabas.
- source_word: שְׁלָשְׁתָּם
  choice: silang tatlo
  rationale: Pinananatili ang pag-uulit at diin ng Hebreo na silang tatlo ay sama-samang lumabas.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah / PANGINOON
  rationale: Personal na pangalan ang tuwirang ginagamit ng tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng אֹהֶל מוֹעֵד
  choice: toldang tipanan
  alternative: tolda ng pakikipagtagpo
  rationale: Maaaring idiin ng parirala ang itinakdang pakikipagtagpo. Ang “toldang tipanan” ay isang natural at kinikilalang katawagan sa Tagalog, nang hindi nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kina” sa magkakasunod na pangalan para sa likas na daloy. Ang utos ay hinati sa “Lumabas ... at pumunta” upang malinaw na maipahayag ang paglabas mula sa kinaroroonan nila at ang pagtungo sa tolda, habang nananatiling tapat sa direksiyon ng Hebreo.
