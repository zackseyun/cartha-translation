    issue: Nagdagdag ng ikalawang utos ang “at pumunta.”
    rationale: 'Iisa ang imperatibo sa Hebreo: “lumabas,” na sinusundan ng pariralang patutunguhan (“sa Toldang Tipanan”). Bagaman makatwirang pagpapalinaw ang draft, mas mainam na huwag magdagdag ng isang magkahiwalay na pandiwa sa optimal-equivalence na salin.'
  - severity: low
    issue: Hindi nagbibigay ng tunay na alternatibo ang talababa sa “kayong tatlo.”
    rationale: Inuulit lamang ng talababa ang mismong salin nito. Hindi rin kailangan ng talababa upang maipahayag ang tuwirang diin ng Hebreo; inaalis ito kasama ng panandang [a].
