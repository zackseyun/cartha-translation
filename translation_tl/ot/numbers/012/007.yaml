  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: tl
  text: Hindi gayon ang aking lingkod na si Moises; siya ay tapat sa buong bahay ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa buong sambahayan ko.” Ang Hebreong “bahay” ay maaari ring tumukoy sa sambahayan o nasasakupan, hindi lamang sa isang gusali.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Hindi gayon
  rationale: Isang mariing pananalitang panalungat ito sa naunang sinabi; likas at tuwiran sa Filipino ang “Hindi gayon.”
- source_word: עַבְדִּי
  choice: lingkod ko
  rationale: Bagaman maaaring mangahulugang alipin ang עֶבֶד, dito ay marangal na katawagan ito kay Moises bilang naglilingkod sa Diyos, hindi diin sa pagkaaliping nakagapos.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: בְּכָל בֵּיתִי
  choice: sa buong sambahayan ko
  rationale: Sa konteksto, ang בַּיִת ay tumutukoy sa sambahayan o nasasakupan ng Diyos, hindi lamang sa isang gusali. Ang “sambahayan” ay natural sa Filipino at pinananatili ang larawang pampamilya ng Hebreo.
- source_word: נֶאֱמָן
  choice: tapat
  rationale: Saklaw ng נֶאֱמָן ang pagiging maaasahan at mapagkakatiwalaan; ang “tapat” ang pinakamaikli at angkop na katumbas sa pahayag tungkol kay Moises.
- source_word: הוּא
  choice: siya
  rationale: Ang hiwalay na panghalip ang paksa ng sugnay; malinaw at natural itong isalin bilang “siya.”
theological_decisions:
- issue: Kahulugan ng “aking bahay” kaugnay ng tungkulin ni Moises
  choice: Isalin bilang “sa buong sambahayan ko,” habang inilalagay sa talababa ang mas literal na “bahay.”
  alternative: sa buong bahay ko
  rationale: Maaaring tumukoy ang Hebreong “bahay” sa sambahayan o nasasakupan ng Diyos. Mas malinaw sa ordinaryong mambabasang Filipino ang “sambahayan,” ngunit pinananatili sa talababa ang literal na larawan at ang tunay na lawak ng kahulugan.
translation_notes:
  register: Modernong Filipino na natural, tuwiran, at marangal. Ginamit ang “sambahayan” upang maipahayag ang kontekstuwal na diwa ng בֵּיתִי nang hindi ito ginagawang “mga tao ko,” na higit na interpretatibo.
