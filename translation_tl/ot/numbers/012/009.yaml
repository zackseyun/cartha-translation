  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: tl
  text: Nag-alab ang galit ni Yahweh sa kanila[a], at umalis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “Nag-alab ang ilong ni Yahweh sa kanila,” isang idyomang nangangahulugang nag-alab ang galit ni Yahweh sa kanila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר
  choice: Nag-alab
  rationale: Ang חרה ay naglalarawan ng pag-init o pagliyab, lalo na sa idyoma ng galit. Pinananatili ng “nag-alab” ang metapora ng init sa natural na Filipino.
- source_word: אַף
  choice: galit
  rationale: Literal itong “ilong,” ngunit kasama ng חרה ay idyomang tumutukoy sa galit. Ang “galit” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
- source_word: בָּם
  choice: sa kanila
  rationale: Sa idyoma ng galit, ipinakikita ng pang-ukol ang mga pinatutungkulan ng galit. Likas sa Filipino ang “nag-alab ang galit ... sa kanila.”
- source_word: וַיֵּלַךְ
  choice: umalis siya
  rationale: Ang הלך dito ay tumutukoy sa paglayo ni Yahweh matapos magsalita. Ang “umalis” ay payak, malinaw, at tapat sa konteksto.
theological_decisions:
- issue: Paglalarawan sa galit ng Diyos
  choice: Nag-alab ang galit ni Yahweh
  alternative: Nagalit nang matindi si Yahweh
  rationale: Pinananatili ng napiling salin ang tunay na metapora ng init sa Hebreo nang hindi dinaragdagan o pinahihina ang pahayag.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “nag-alab” upang mapanatili ang matingkad na Hebreong metapora, at “umalis” bilang natural na katumbas ng kilos sa hulihan ng talata.
