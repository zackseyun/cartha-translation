  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: tl
  text: At nagsalita laban kay Moises sina Miriam at Aaron dahil sa babaeng Cusita na kinuha niya bilang asawa[b][a], sapagkat kumuha siya ng isang babaeng Cusita bilang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaeng Etiope.” “Babaeng Cusita” ang nasa Hebreo, na tumutukoy sa isang babaeng mula sa Cus.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong pandiwang isinaling “kinuha niya bilang asawa” ay maaari ring mangahulugang “pinakasalan niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר ... בְּמֹשֶׁה
  choice: nagsalita laban kay Moises
  rationale: Ang דבר na may preposisyong ב ay may diwang salungat o mapanuligsa rito. Pinananatili ng “nagsalita laban” ang mismong kilos ng pagsasalita nang hindi ito labis na binibigyang-kahulugan bilang pagrereklamo.
- source_word: מִרְיָם וְאַהֲרֹן
  choice: sina Miriam at Aaron
  rationale: Pinanatili ang ayos ng mga pangalan sa Hebreo. Bagaman pambabae at isahan ang anyo ng pandiwa, na maaaring magpahiwatig ng pangunguna ni Miriam, kapwa sila tahasang paksa ng pangungusap.
- source_word: עַל אֹדוֹת
  choice: dahil sa
  rationale: Likas sa modernong Filipino at malinaw na naghahayag ng dahilan o okasyon ng pagsasalita.
- source_word: הָאִשָּׁה הַכֻּשִׁית
  choice: babaeng Cusita
  rationale: Ang אִשָּׁה ay maaaring “babae” o “asawa,” at ang כֻּשִׁית ay babaeng mula sa Cus. Ang “babaeng Cusita” ay tapat sa etnikong katawagan at hindi nag-aangkat ng makabagong heograpikong pagkakakilanlan.
- source_word: אֲשֶׁר לָקָח
  choice: na kinuha niyang asawa
  rationale: Literal na “kinuha” ang לקח, ngunit sa kontekstong pangkasal ay nangangahulugang kumuha bilang asawa o mag-asawa. Pinananatili ng parirala ang Hebreong larawan habang malinaw sa karaniwang mambabasa.
- source_word: כִּי
  choice: sapagkat
  rationale: Naghaharap ito ng paliwanag o muling pagbanggit sa naunang dahilan.
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: kumuha siya ng isang babaeng Cusita bilang asawa
  rationale: Pinanatili ang mariing pag-uulit sa Hebreo sa halip na pakinisin o alisin ito.
theological_decisions:
- issue: Pagkakakilanlan at katawagang etniko sa asawa ni Moises
  choice: Isinalin ang כֻשִׁית bilang “Cusita” nang hindi ipinapantay sa isang tiyak na ibang babaeng binabanggit sa tradisyon.
  alternative: “Etiope” o tuwirang pagkilala sa kaniya bilang Zipora
  rationale: Ang talata mismo ay gumagamit ng katawagang Cusita. Hindi dapat lutasin ng salin ang mga usaping historikal o pagtatangkang pagtugmain ang mga salaysay na hindi nilulutas ng teksto.
- issue: Posibleng pangunguna ni Miriam
  choice: Pinanatili sa teksto ang kapwa pangalang “Miriam at Aaron” nang walang dagdag na paliwanag.
  alternative: Sabihing si Miriam ang nanguna sa pagsasalita
  rationale: Maaaring ipahiwatig ng pambabae at isahang pandiwa ang kaniyang pangunguna, ngunit hindi ito sapat upang idagdag bilang tahasang pahayag sa salin.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Cusita” bilang likas na anyong Filipino ng Cushite. Inilagay ang mga panandang talababa sa pagkakasunod na [b][a] sa mismong pariralang saklaw ng dalawang paliwanag, alinsunod sa ibinigay na audited consultation layer.
