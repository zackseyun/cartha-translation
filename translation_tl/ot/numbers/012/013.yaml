  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: tl
  text: At sumigaw si Moises kay Yahweh, “O Diyos, pakiusap, pagalingin mo sana siya!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, dalawang ulit ang katagang nagpapahayag ng pakikiusap: “O Diyos, pakiusap, pagalingin mo siya, pakiusap.” Isinalin ang mga ito bilang “pakiusap” at “sana” upang idiin ang matinding pagsusumamo ni Moises sa natural na Tagalog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: sumigaw
  rationale: Ang pandiwang צעק ay nagpapahiwatig ng malakas at apurahang pagdaing o panawagan. Pinananatili ng “sumigaw” ang tindi ng pamamagitan ni Moises.
- source_word: אֶל
  choice: kay
  rationale: Karaniwang panandang patungo sa isang taong pinatutungkulan; likas sa Tagalog ang “kay” bago ang pangalang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: לֵאמֹר
  choice: ipinakikita sa tuwirang sipi nang walang hiwalay na “na sinasabi”
  rationale: Ipinakikilala ng infinitive ang nilalaman ng sigaw. Sa natural na Tagalog, sapat at mas maayos ang tuwirang sipi pagkatapos ng kuwit.
- source_word: אֵל
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos sa panalangin. Ipinahahayag ng “O Diyos” ang bokatibong gamit sa marangal at malinaw na Tagalog.
- source_word: נָא … נָא
  choice: pakiusap … sana
  rationale: Dalawang ulit ang katagang nagpapahayag ng pagsusumamo. Ang magkatambal na “pakiusap” at “sana” ay nagpapanatili sa dalawang pahiwatig ng matinding pakikiusap nang hindi nagiging pilit ang Tagalog.
- source_word: רְפָא
  choice: pagalingin mo
  rationale: Ang pautos na anyo ng רפא ay tuwirang humihiling na pagalingin si Miriam mula sa kaniyang karamdaman.
- source_word: לָהּ
  choice: siya
  rationale: Ang hulaping pambabae sa ikatlong panauhan ay tumutukoy kay Miriam; hindi nagtatangi ng kasarian ang likas na panghalip na Tagalog na “siya.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Dalawang ulit na נָא sa pagsusumamo
  choice: Kapuwa ipinahahayag bilang “pakiusap” at “sana”
  alternative: Isang “pakiusap” lamang; literal na pag-uulit ng “pakiusap”
  rationale: Pinananatili nito ang pag-uulit at tindi ng Hebreo habang gumagamit ng natural na anyo ng pagsusumamo sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ang “sumigaw” ay nagpapanatili sa tindi ng צעק; ang “pakiusap … sana” ay natural na kumakatawan sa dalawang ulit na נָא. Ginamit ang “O Diyos” bilang marangal na tuwirang pagtawag.
