  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: tl
  text: Pagkatapos, bumaba si Yahweh sa isang haligi ng ulap at tumayo sa pasukan ng tolda.[a] Tinawag niya sina Aaron at Miriam, at lumabas silang dalawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tolda” rito ay tumutukoy sa Tolda ng Tipanan.
    reason: cross_reference
  - marker: b
    text: Maaari rin itong unawain bilang “lumapit silang dalawa,” sapagkat tinawag sila ni Yahweh sa pasukan ng tolda. Sa literal, “lumabas silang dalawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Tuwirang pinananatili nito ang konkretong kilos ng pagbaba sa salaysay at natural ito sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּעַמּוּד עָנָן
  choice: sa isang haligi ng ulap
  rationale: Ipinahahayag ng parirala ang anyo o paraang kaugnay ng pagbaba ni Yahweh. Natural sa Tagalog ang nakaugaliang larawang “haligi ng ulap,” at hindi ginagawang tiyak ng Hebreong parirala ang pantukoy.
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Payak at tuwirang katumbas ito ng pandiwa at angkop sa sunod-sunod na kilos ng salaysay.
- source_word: פֶּתַח הָאֹהֶל
  choice: sa pasukan ng tolda
  rationale: Ang פֶּתַח ay pasukan o bukana, at ang אֹהֶל dito ay literal na “tolda.” Hindi idinagdag sa pangunahing teksto ang mas buong katawagang “Tolda ng Tipanan,” bagaman iyon ang tinutukoy ng konteksto.
- source_word: וַיִּקְרָא
  choice: Tinawag niya
  rationale: Malapit ito sa karaniwang kahulugan ng קרא at malinaw na ipinahihiwatig ng konteksto na si Yahweh ang simuno.
- source_word: אַהֲרֹן וּמִרְיָם
  choice: sina Aaron at Miriam
  rationale: Ginagamit ang karaniwang anyo ng mga pangalan at ang wastong Tagalog na pantukoy para sa dalawang tao.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: lumapit silang dalawa
  rationale: Literal na tumutukoy ang יצא sa paglabas, ngunit sa konteksto ay kumikilos silang dalawa pasulong bilang tugon sa pagtawag ni Yahweh. Pinananatili sa talababa ang literal na alternatibo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pinananatili ang personal na pangalan sa pinagmulang teksto at iniiwasang palitan ito ng isang titulo o ng tradisyong denominasyonal.
- issue: Ang konkretong paglalarawan sa pagbaba ni Yahweh
  choice: Pinanatili ang “bumaba”
  alternative: Nagpakita
  rationale: Malinaw na gumagamit ang Hebreo ng wikang tumutukoy sa pagbaba. Hindi ito pinalabnaw o ipinaliwanag sa paraang magpapataw ng isang teolohikong paglutas sa larawan ng teksto.
- issue: Ang kilos nina Aaron at Miriam matapos silang tawagin
  choice: lumapit silang dalawa
  alternative: lumabas silang dalawa
  rationale: Ang pangunahing teksto ay nagpapahayag ng malamang na tungkulin ng kilos sa tagpo, samantalang pinananatili sa talababa ang literal na kahulugan upang hindi maitago ang leksikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at sunod-sunod na estilo ng salaysay, habang ang mga talababa ay nagbibigay ng kontekstuwal at literal na alternatibo nang hindi pinabibigat ang pangunahing teksto.
