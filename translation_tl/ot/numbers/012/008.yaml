  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: tl
  text: Bibig sa bibig akong nakikipag-usap sa kanya[a], nang malinaw at hindi sa mga palaisipan; at minamasdan niya ang anyo[b] ni Yahweh. Kaya bakit hindi kayo natakot na magsalita laban sa aking lingkod, laban kay Moises?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “harap-harapan.” Literal sa Hebreo: “bibig sa bibig,” na nagbibigay-diin sa tuwirang pakikipag-usap.'
    reason: lexical_alternative
  - marker: b
    text: Ang “anyo” ay maaari ring isaling “wangis” o “pagpapakita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: Bibig sa bibig
  rationale: Pinananatili ang literal at kapansin-pansing idyomang Hebreo, na nagbibigay-diin sa tuwiran at hindi palaisipang pakikipag-usap; inilalagay sa talababa ang mas likas na alternatibong “harap-harapan.”
- source_word: אֲדַבֶּר בּוֹ
  choice: akong nakikipag-usap sa kanya
  rationale: Ipinahahayag ng דבר na may ב ang pakikipag-usap o pakikipagtalastasan sa isang tao, hindi lamang pagsasalita sa kanya.
- source_word: וּמַרְאֶה
  choice: nang malinaw
  rationale: Sa pagtutunggali nito sa “hindi sa mga palaisipan,” tumutukoy ito sa malinaw na pagpapahayag o pagpapakita. Ang pang-abay na salin ay natural sa Tagalog at tumutugma sa daloy ng pangungusap.
- source_word: וְלֹא בְחִידֹת
  choice: at hindi sa mga palaisipan
  rationale: Ang חִידֹת ay mga palaisipan o malalabong pananalita. Ang “mga palaisipan” ay malinaw at karaniwang modernong Tagalog.
- source_word: וּתְמֻנַת יְהוָה
  choice: ang anyo ni Yahweh
  rationale: Ang תְּמוּנָה ay maaaring mangahulugang anyo, wangis, o nakikitang pagpapakita. Pinananatili ng “anyo” ang kongkretong diwa nang hindi ipinapaliwanag nang higit sa sinasabi ng teksto.
- source_word: יַבִּיט
  choice: minamasdan niya
  rationale: Ipinahihiwatig ng pandiwa ang sinasadyang pagtingin o pagmamasid; ang “minamasdan” ay marangal at mas matindi kaysa simpleng “nakikita.”
- source_word: וּמַדּוּעַ לֹא יְרֵאתֶם
  choice: Kaya bakit hindi kayo natakot
  rationale: Ipinakikita ng “Kaya” na ang tanong ay bunga ng naunang pahayag, at pinananatili ng “natakot” ang tindi ng pagsaway.
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: na magsalita laban sa aking lingkod, laban kay Moises
  rationale: Sa kontekstong ito, minamarkahan ng inuulit na ב ang pinatutungkulan ng mapanlabang pananalita. Pinananatili ng pag-uulit ng “laban sa” ang diin at aposisyon ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Paglalarawan sa natatanging kapahayagan kay Moises
  choice: ang anyo ni Yahweh
  alternative: ang wangis ni Yahweh; ang pagpapakita ni Yahweh
  rationale: Ipinapahayag ng teksto na may natatanging tuwirang kapahayagan kay Moises ngunit hindi nito lubusang ipinaliliwanag ang kalikasan ng banal na pagpapakitang iyon. Pinananatili ng “anyo” ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang natatanging idyomang “bibig sa bibig,” habang ginawang natural ang pandiwang “nakikipag-usap.” Ginamit ang “palaisipan” sa halip na mas luma o teknikal na mga katawagan, at “Yahweh” bilang personal na banal na pangalan.
