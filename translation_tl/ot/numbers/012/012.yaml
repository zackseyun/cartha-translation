  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: tl
  text: Pakiusap, huwag mong hayaang maging tulad siya ng isang patay[a]—na nang lumabas siya mula sa sinapupunan ng kanyang ina ay kalahati na ng kanyang laman ang naubos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tulad ng isang batang patay nang isilang, na nang lumabas siya mula sa sinapupunan ng kanyang ina ay kalahati na ng kanyang laman ang naubos.” Inihahambing siya ng Hebreo sa isang patay sa pagsilang; tahasang binabanggit ng ilang salin ang larawang ito sa pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Pakiusap, huwag
  rationale: Pinagsasama nito ang pagbabawal ng אַל at ang matinding pakiusap ng נָא sa natural na makabagong Tagalog.
- source_word: תְהִי
  choice: mong hayaang maging tulad siya
  rationale: Ang 3fs na anyo ay negatibong pakiusap at tumutukoy kay Miriam; ang 'hayaang maging' ay malinaw na naghahatid ng jussive na diwa.
- source_word: כַּמֵּת
  choice: tulad siya ng isang patay
  rationale: Pinananatili ang literal at hindi ganap na tinukoy na paghahambing sa isang patay, habang ipinapaliwanag sa talababa ang posibleng tahasang larawan ng batang patay nang isilang.
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: paglabas sa sinapupunan ng kanyang ina
  rationale: Inihahatid ang temporal at matingkad na larawan ng paglabas mula sa sinapupunan nang hindi dinaragdagan ang Hebreo.
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: kalahati na ang naubos na laman
  rationale: Ang 'naubos' ay natural na paglalarawan ng resultang kalagayan ng pagkaagnas o pagkasira; pinananatili ng 'laman' ang pisikal na kahulugan ng בשר.
theological_decisions:
- issue: Tinutukoy ng pambabaeng pang-isahang anyo
  choice: si Miriam ang tinutukoy ng 'siya'
  alternative: panatilihing hindi hayag ang tinutukoy
  rationale: Malinaw sa agarang konteksto na ang pakiusap ni Aaron ay tungkol kay Miriam; hindi kailangang idagdag ang pangalan sa talata.
- issue: Larawan ng כַּמֵּת at ng pagsilang
  choice: panatilihin sa pangunahing teksto ang 'isang patay'
  alternative: gawing tahasan ang 'batang patay nang isilang'
  rationale: Literal na 'tulad ng isang patay' ang parirala, ngunit ipinahihiwatig ng kasunod na sugnay ang patay-na-pagsilang; pinananatili ng talababa ang tunay na posibilidad nang hindi ito sapilitang inilalagay sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang 'Pakiusap' upang maipahayag ang apurahang pagsusumamo, at pinanatili ang matinding pisikal na larawan ng Hebreo.
