language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: tl
  text: 'At sinabi niya, “Pakinggan ninyo ngayon ang aking mga salita: Kung may propeta sa inyo[a], ako, si Yahweh, ay ipinakikilala ko ang aking sarili sa kanya sa isang pangitain[b]; nagsasalita ako sa kanya sa isang panaginip[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung ang isa sa inyo ay propeta.” Literal sa Hebreo, “kung mayroon ng inyong propeta.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inihahayag ko ang aking sarili sa kanya.”
    reason: lexical_alternative
  - marker: c
    text: Ang Hebreo ay literal na “nagsasalita ako sa/kasama niya,” na maaaring unawaing “nagsasalita ako sa kanya” o “nakikipag-usap ako sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Karaniwang salaysay na anyo ito na nagpapakilala ng tuwirang pananalita. Pinananatili ng “At sinabi niya” ang daloy ng Hebreo nang hindi dinaragdagan ang kahulugan.
- source_word: שִׁמְעוּ נָא
  choice: Pakinggan ninyo ngayon
  rationale: Ang pandiwa ay pautos na maramihan, at ang נָא ay nagbibigay-diin sa taimtim na panawagan. Natural at marangal sa makabagong Tagalog ang “Pakinggan ninyo ngayon.”
- source_word: דְבָרָי
  choice: ang aking mga salita
  rationale: Maramihan ang anyong Hebreo at may hulaping unang panauhan; tuwiran itong tinutumbasan ng “aking mga salita.”
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: Kung may propeta sa inyo
  rationale: Literal na di-karaniwan ang pariralang “kung mayroon ng inyong propeta.” Ang “kung may propeta sa inyo” ay natural na nagpapahayag ng kondisyong tumutukoy sa isang propetang kabilang sa pangkat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa pamamagitan ng transliterasyon ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: בַּמַּרְאָה
  choice: sa isang pangitain
  rationale: Tumutukoy ang מַרְאָה sa isang bisyonaryo o mapaghayag na pagpapakita. Ang “sa isang pangitain” ay natural na pahayag ng paraan o kalagayan ng paghahayag.
- source_word: אֵלָיו אֶתְוַדָּע
  choice: nagpapakilala sa kanya
  rationale: Ang hitpael ng ידע ay may diwang kusang pagpapahayag o pagpapakilala ng Diyos sa sarili niya. Sapat na natural sa Tagalog ang “nagpapakilala sa kanya,” samantalang nililinaw ng talababa ang mas hayag na reflexive na pagbasa.
- source_word: בַּחֲלוֹם
  choice: sa isang panaginip
  rationale: Tuwirang tinutukoy ng parirala ang panaginip bilang kalagayan o paraan ng pakikipag-usap.
- source_word: אֲדַבֵּר בּוֹ
  choice: nagsasalita ako sa kanya
  rationale: Bagaman literal na may pang-ukol na maaaring tumbasan ng “sa/loob/kasama,” idyomatiko itong tumutukoy sa pagsasalita sa isang tao. Ang “nagsasalita ako sa kanya” ay natural at hindi labis na nagpapasiya sa posibleng himig ng pakikipag-usap.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang walang pagdaragdag ng denominasyonal na paliwanag.
- issue: Paraan ng paghahayag sa propeta
  choice: Nagpapakilala ang Diyos sa isang pangitain at nagsasalita sa isang panaginip
  alternative: Nagpapakita ang Diyos sa pangitain at nakikipag-usap sa panaginip
  rationale: Pinananatili ng salin ang magkatulad ngunit magkaibang pahayag ng Hebreo at hindi nito pinalalawak ang talata tungo sa isang sistematikong doktrina tungkol sa propesiya.
- issue: Aspekto ng mga pandiwang אֶתְוַדָּע at אֲדַבֵּר
  choice: 'Kasalukuyan o pangkalahatang gawi: “nagpapakilala” at “nagsasalita”'
  alternative: 'Hinaharap: “magpapakilala” at “magsasalita”'
  rationale: Sa kondisyong pahayag, maaaring ilarawan ng mga imperfect ang karaniwang paraan ng Diyos sa paghahayag, hindi lamang isang natatanging pangyayari sa hinaharap. Ang aspektong pangkalahatang gawi ay natural sa Tagalog habang nananatiling bukas ang temporal na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ninyo” dahil maramihan ang utos, at pinanatili ang “mga salita” upang sundan ang bilang sa Hebreo. Ang mga pandiwa sa pangunahing sugnay ay nasa anyong naglalarawan ng pangkalahatang gawi, na angkop sa kondisyong pahayag.
