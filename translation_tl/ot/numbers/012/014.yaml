base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Moises, “Kung dinuraan siya ng kanyang ama sa mukha, hindi ba siya mapapahiya nang pitong araw?[a] Ibukod siya sa labas ng kampo nang pitong araw, at pagkatapos ay muli siyang tanggapin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “malalagay sa kahihiyan sa loob ng pitong araw.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na pananalita: “muli siyang tipunin” o “muli siyang isama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: יָרֹק יָרַק
  choice: dinuraan
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa pagdura. Sa natural na Tagalog, sapat na ang “dinuraan” sa loob ng kundisyunal na pangungusap; ang literal na pag-uulit ay magiging pilit.
- source_word: בְּפָנֶיהָ
  choice: sa mukha
  rationale: Ito ang natural na katumbas ng idyomang Hebreo at malinaw na naghahayag ng matinding hayagang paghamak.
- source_word: תִכָּלֵם
  choice: mapapahiya
  rationale: Saklaw nito ang pagiging inilagay sa kahihiyan o kahihiyan sa lipunan, habang pinananatili ang anyo ng retorikal na tanong.
- source_word: תִּסָּגֵר
  choice: Ibukod siya
  rationale: Ang pasibong anyo ay tumutukoy sa pagkakait ng pakikisalamuha o pagkakulong sa labas ng kampo. Mas natural sa kontekstong ito ang “ibukod” kaysa “ikulong,” na maaaring magpahiwatig ng bilangguan.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Tuwiran at likas na salin ng lokasyon ng pansamantalang pagbubukod.
- source_word: תֵּאָסֵף
  choice: muli siyang tanggapin
  rationale: Ang pasibong anyo ng אסף ay literal na “tipunin/isama,” ngunit sa konteksto ay tumutukoy sa muling pagtanggap sa loob ng kampo at ng pamayanan.
theological_decisions:
- issue: Katangian ng pahayag tungkol sa pagdura ng ama
  choice: Isang ipinapalagay na pangyayari na nagsisilbing paghahambing para sa kahihiyan at pagbubukod
  alternative: Pagbanggit sa isang literal na pangyayaring naganap na
  rationale: Ang Hebreo ay isang retorikal na kundisyunal na pahayag. Pinananatili ng salin ang paghahambing nang hindi dinaragdagan ng simboliko o doktrinal na pakahulugan.
- issue: Kahulugan ng muling pagtanggap pagkatapos ng pitong araw
  choice: Muling isama sa kampo o pamayanan
  alternative: Literal na tipunin lamang
  rationale: Ipinahihiwatig ng konteksto ng pansamantalang pagbubukod na ang “pagtitipon” ay muling pagtanggap sa loob ng kampo, ngunit binanggit sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang personal na pangalang “Yahweh,” ang retorikal na tanong, ang pitong-araw na panahon, at ang pasibong diwa ng pagbubukod at muling pagtanggap. Iniwasan ang sobrang literal na pag-uulit na hindi natural sa Tagalog.
