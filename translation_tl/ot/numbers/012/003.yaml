  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: tl
  text: Ang lalaking si Moises ay napakamapagpakumbaba, higit kaysa sinumang tao sa ibabaw ng lupa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הָ/אִישׁ
  choice: Ang lalaking
  rationale: Pinananatili ang tahasang הָאִישׁ (“ang lalaki”) bago ang pangalang Moises. Hindi ginawang hiwalay na “at” ang waw sapagkat mas natural sa Filipino na ipahiwatig dito ang pagpapatuloy ng salaysay sa daloy ng konteksto.
- source_word: מֹשֶׁה
  choice: si Moises
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan at ang pantukoy na “si” para sa likas na balarila ng Tagalog.
- source_word: ענו
  choice: mapagpakumbaba
  rationale: Sa konteksto, inilalarawan nito ang saloobin o disposisyon ni Moises. Ang “mapagpakumbaba” ay malinaw at likas sa makabagong Filipino, nang hindi ipinahihiwatig ang kahinaan o kawalang-kakayahan.
- source_word: מְאֹד
  choice: napaka-
  rationale: Ang unlaping “napaka-” ay likas na Filipino na panumbas sa matinding pang-abay na “lubhang/napaka,” at maayos na kaakibat ng “mapagpakumbaba.”
- source_word: מִ/כֹּל
  choice: higit kaysa sinumang
  rationale: Ipinahahayag nito ang paghahambing na מן + כֹּל sa natural na Filipino at pinananatili ang saklaw na “kahit sinong kabilang sa lahat.”
- source_word: הָאָדָם
  choice: tao
  rationale: Ang אָדָם ay pangkalahatang tumutukoy rito sa isang tao, hindi lamang sa lalaking kasarian. Ang “tao” ang eksakto at likas na generic na katawagan sa Filipino.
- source_word: אֲשֶׁר
  choice: nakapaloob sa pariralang “sinumang tao”
  rationale: Hindi kailangan ng hiwalay na panghalip na panumbas sa Filipino; ang saklaw ng relative clause ay natural na naipapahayag sa buong pariralang paghahambing.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sa ibabaw ng lupa
  rationale: Pinananatili ang Hebreong larawang “sa ibabaw/mukha ng lupa” sa isang malinaw at dignified na pariralang Filipino.
theological_decisions:
- issue: Kahulugan ng ענו bilang paglalarawan kay Moises
  choice: mapagpakumbaba
  alternative: maamo; api; mababa ang kalagayan
  rationale: Ang konteksto ay pinakamalamang na tumutukoy sa disposisyon ni Moises. Hindi pinili ang “api,” na maaaring maglipat ng diin sa panlabas na pagdurusa, o “maamo,” na maaaring idiin ang kahinahunan kaysa pagpapakumbaba.
- issue: Pangkalahatang saklaw ng הָאָדָם sa paghahambing
  choice: tao
  alternative: lalaki; sangkatauhan
  rationale: Bagaman maaaring literal na tumbasan ng “lalaki” sa ilang konteksto, generic ang אָדָם dito. Sa Filipino, ang “tao” ay likas na kabilang ang mga tao sa pangkalahatan at angkop sa isahang paghahambing.
- issue: Napakalawak na paghahambing tungkol sa kababaang-loob ni Moises
  choice: higit kaysa sinumang tao sa ibabaw ng lupa
  alternative: higit kaysa lahat ng tao sa ibabaw ng lupa
  rationale: Pinananatili ang matinding saklaw ng Hebreong paghahambing nang hindi nililimitahan o ipinapaliwanag kung paano ito iuugnay sa ibang tauhan o pahayag sa Kasulatan.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang bahagyang pormal na “Ang lalaking si Moises” upang katawanin ang Hebreong הָאִישׁ מֹשֶׁה, samantalang ang natitirang pangungusap ay inayos sa natural na sintaks ng Filipino.
