  yaml_path: translation/ot/numbers/012/016.yaml
  text: Afterward the people set out from Hazeroth and camped in the wilderness of Paran.
translation:
  language: tl
  text: Pagkatapos nito, umalis ang mga tao sa Hazerot at nagkampo sa ilang ng Paran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: Pagkatapos nito
  rationale: Nagpapakita ito ng pagkakasunod-sunod ng pangyayari at natural sa makabagong Filipino.
- source_word: נָסְעוּ
  choice: umalis
  rationale: Sa konteksto ng paglalakbay sa ilang, tumutukoy ang pandiwa sa pag-alis ng kampo upang magpatuloy; malinaw at natural ang “umalis.”
- source_word: הָעָם
  choice: ang mga tao
  rationale: Tumutukoy ito sa sambayanan ng Israel bilang isang pangkat; karaniwan at malinaw ang salin.
- source_word: מֵחֲצֵרוֹת
  choice: sa Hazerot
  rationale: Pangalan ng lugar na tinumbasan ayon sa bigkas at anyong angkop sa Filipino; kasama sa “umalis sa Hazerot” ang diwa ng Hebreong pang-ukol na מִן.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Tumpak at makabagong pagpapahayag ng pagtigil at pagtatayo ng kampo.
- source_word: בְּמִדְבַּר
  choice: sa ilang ng
  rationale: Ang מִדְבָּר ay lupang ilang o di-tinatahanang rehiyon; pinananatili ng “ilang” ang heograpikal at salaysay na diwa nang hindi ipinapalagay na puro buhangin ito.
- source_word: פָּארָן
  choice: Paran
  rationale: Pangalan ng lugar na isinalin sa karaniwang transliterasyong Filipino.
