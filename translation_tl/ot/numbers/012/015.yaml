translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “ibinukod” sa halip na mas mekanikal na “ikinulong,” sapagkat nasa labas ng kampo ang lokasyon at rituwal na pagkakahiwalay ang konteksto. Ang “muling tanggapin … sa kampo” ay idiomatiko, habang pinananatili sa talababa ang literal na pandiwang Hebreo.
