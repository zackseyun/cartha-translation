  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: tl
  text: Kaya ibinukod si Miriam sa labas ng kampo sa loob ng pitong araw, at hindi umalis ang bayan hanggang sa maibalik si Miriam sa kampo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “hanggang sa tipunin si Miriam.” Ginagamit dito ng Hebreo ang pandiwang “tipunin” para sa muling pagsasama o pagbabalik kay Miriam sa kampo matapos ang panahon ng pagkakabukod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: ibinukod
  rationale: Ang Niphal ng סגר ay nagpapahiwatig na si Miriam ay isinailalim sa pagkakahiwalay o pagkakasara sa labas. Ang “ibinukod” ay natural sa modernong Filipino at malinaw na nagpapahayag ng sapilitang paghiwalay sa kontekstong ito.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Tuwirang katumbas ng lokatibong parirala at natural sa salaysay tungkol sa paglalakbay ng Israel sa ilang.
- source_word: שִׁבְעַת יָמִים
  choice: nang pitong araw
  rationale: Natural na pariralang Filipino para sa tagal ng pagkakabukod.
- source_word: הָעָם
  choice: ang bayan
  rationale: Tumutukoy sa buong sambayanan ng Israel bilang naglalakbay na komunidad. Ang “bayan” ay marangal at likas sa biblikal na salaysay nang hindi nangangahulugang isang modernong bansa lamang.
- source_word: לֹא נָסַע
  choice: hindi naglakbay
  rationale: Sa mga salaysay sa ilang, ang נסע ay tumutukoy sa pag-alis ng kampo upang magpatuloy sa paglalakbay. Naipahahayag ng “hindi naglakbay” ang diwa nang natural.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: hanggang sa muling tanggapin si Miriam sa kampo
  rationale: Ang Niphal ng אסף ay literal na “tipunin/isama,” at dito ay tumutukoy sa pagpapanumbalik kay Miriam mula sa pagkakabukod tungo sa kampo. Ginagawang malinaw ng salin ang ipinahihiwatig na muling pagtanggap, samantalang inilalahad sa talababa ang literal na larawan.
