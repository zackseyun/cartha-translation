  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: tl
  text: Sinabi nila[a], “Sa pamamagitan lang ba talaga ni Moises nagsalita si Yahweh? Hindi ba’t nagsalita rin siya sa pamamagitan namin?” At narinig iyon ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sinabi nila, ‘Kay Moises lang ba talaga nagsalita si Yahweh? Hindi ba’t nagsalita rin siya sa amin?’” Ang pang-ukol sa Hebreo ay maaaring tumukoy sa tumatanggap ng pahayag o sa taong ginamit bilang tagapamagitan nito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Sinabi nila
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay at nagpapakilala ng tuwirang pananalita. Likas sa makabagong Tagalog ang “Sinabi nila” nang hindi kailangang laging ilantad ang pang-ugnay na וַ.
- source_word: הֲרַק אַךְ
  choice: lang ba talaga
  rationale: Pinagsasama nito ang retorikal na tanong, paghihigpit, at pagdidiin ng mga katagang הֲ, רַק, at אַךְ sa natural na Tagalog.
- source_word: בְּמֹשֶׁה ... בָּנוּ
  choice: ginamit ... upang magsalita / sa pamamagitan namin
  rationale: Sa konteksto ng propetikong pananalita, maaaring tumukoy ang ב sa tagapamagitan o kasangkapan. Ipinahahayag dito nina Miriam at Aaron ang pag-aangkin na nagsalita rin ang Diyos sa pamamagitan nila.
- source_word: דִּבֶּר
  choice: magsalita / nagsalita
  rationale: Ang “magsalita” ay angkop sa banal at propetikong pahayag at pinananatili ang ugnayan ng dalawang magkatulad na sugnay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang Yahweh, hindi pinapalitan ng titulong “Panginoon.”
- source_word: וַיִּשְׁמַע יְהוָה
  choice: At narinig iyon ni Yahweh
  rationale: Walang tahasang layon sa Hebreo, ngunit malinaw sa konteksto na ang narinig ay ang kanilang sinabi; natural sa Tagalog na idagdag ang “iyon.”
theological_decisions:
- issue: Pagbibigay-kahulugan sa pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon / Jehova
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Kung ang ב kasama ng דבר ay tumutukoy sa tumatanggap o sa tagapamagitan
  choice: sa pamamagitan ni Moises / sa pamamagitan namin
  alternative: kay Moises / sa amin
  rationale: Ang agarang konteksto ay pagtatalo tungkol sa propetikong katayuan at pagiging daluyan ng pahayag. Gayunman, tunay na posible sa balarila ang pagbasa na tumutukoy sa tumatanggap, kaya inilalahad ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lang ba talaga” para sa mariing retorikal na tanong. Sa unang tanong, ang “ginamit ... upang magsalita” ay iniiwasan ang alanganing “sa pamamagitan ni Moises” habang malinaw na ipinapahayag ang instrumental na pagbasa; pinanatili sa talababa ang posibleng recipient reading.
