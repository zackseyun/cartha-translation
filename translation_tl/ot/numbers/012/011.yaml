  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: tl
  text: At sinabi ni Aaron kay Moises, “Nakikiusap ako, panginoon ko, huwag mo sanang ipataw sa amin ang kasalanan[a], sapagkat kumilos kami nang hangal at nagkasala kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pananagutan sa kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Nakikiusap ako, panginoon ko
  rationale: Ang בִּי ay pormula ng magalang at taimtim na pakiusap, hindi literal na ‘sa akin.’ Ang אֲדֹנִי ay magalang na tawag kay Moises bilang tao; pinananatili ng ‘panginoon ko’ ang pagpapakumbaba ni Aaron nang hindi ito ginagawang banal na titulo.
- source_word: אַל נָא
  choice: huwag mo sanang
  rationale: Likas sa modernong Tagalog ang ‘sana’ upang ihayag ang mapagpakumbabang pakiusap na taglay ng נָא, samantalang malinaw na nananatili ang pagbabawal ng אַל.
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: ipataw sa amin ang kasalanan
  rationale: Pinananatili ng ‘ipataw sa amin’ ang larawang metaporikal ng paglalagay ng kasalanan o pananagutan sa isang tao. Ang ‘kasalanan’ ang tuwirang katumbas, habang inilalahad sa talababa ang posibleng diwang ‘pananagutan sa kasalanan.’
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: sapagkat kumilos kami nang may kamangmangan
  rationale: Ang Niphal ng יאל ay tumutukoy sa pagkilos nang hangal o walang wastong pag-iisip. Ang ‘nang may kamangmangan’ ay dignificado at malinaw sa karaniwang mambabasa, at pinananatili ang moral na bigat ng pag-amin.
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: at nagkasala kami
  rationale: Pinananatili nito ang ikalawang tahasang pag-amin, na nagpapalinaw at nagpapabigat sa naunang pagkilos nang may kamangmangan. Sapat nang saklaw ng ‘sapagkat’ ang magkaugnay na mga sugnay.
theological_decisions:
- issue: Ang אֲדֹנִי ay itinawag kay Moises
  choice: panginoon ko
  alternative: ginoo ko
  rationale: Tao ang kinakausap dito, kaya hindi ito banal na titulo. Gayunman, higit na napapanatili ng ‘panginoon ko’ kaysa ‘ginoo ko’ ang antas ng paggalang, pagpapakumbaba, at ugnayang panlipunan sa pakiusap ni Aaron.
- issue: Ang saklaw ng חַטָּאת sa pakiusap
  choice: kasalanan
  alternative: pananagutan sa kasalanan
  rationale: Maaaring tumukoy ang salita sa mismong kasalanan o sa kaakibat nitong sala/pananagutan. Pinananatili sa pangunahing teksto ang tuwirang ‘kasalanan,’ ngunit hindi isinasara ang legal o pananagutang diwa kaya inilagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na may dignificado ngunit madaling maunawaang himig. Ginamit ang ‘Nakikiusap ako’ at ‘huwag mo sanang’ upang likas na maipahayag ang taimtim na pakiusap; ang maliit na titik sa ‘panginoon ko’ ay tumutulong magpahiwatig na magalang na tawag ito sa isang tao, hindi pangalan o titulong pantukoy sa Diyos.
