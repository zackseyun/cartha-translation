revisions:
- from: At nang lumayo ang ulap mula sa ibabaw ng tolda, naroon si Miriam, may malubhang sakit sa balat[a], parang niyebe. Lumingon si Aaron kay Miriam, at nakita niyang may malubhang sakit ito sa balat.
  to: Umalis ang ulap mula sa ibabaw ng tolda, at narito, si Miriam ay may karamdaman sa balat[a], gaya ng niyebe. Lumingon si Aaron kay Miriam, at narito, siya ay may karamdaman sa balat.
  rationale: Inalis ang hindi isinasaad na “malubhang” at pinalitan ng mas malawak na “karamdaman sa balat.” Ginawang “narito” ang dalawang pangyayari ng וְהִנֵּה upang mapanatili ang mariin at biglaang pagpapakita sa Hebreo nang hindi ipinaliliwanag ang ikalawang isa bilang pandiwang “nakita.” Pinanatili ang “tolda,” ang mga pangalan, ang paghahambing na “gaya ng niyebe,” at ang isang talababa sa unang pagbanggit.
