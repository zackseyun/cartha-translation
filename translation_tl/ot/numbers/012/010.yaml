base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: tl
  text: Umalis ang ulap mula sa ibabaw ng tolda, at narito, si Miriam ay may karamdaman sa balat[a], gaya ng niyebe. Lumingon si Aaron kay Miriam, at narito, siya ay may karamdaman sa balat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy sa iba't ibang karamdaman sa balat o sa isang rituwal na kapansanan sa balat, at hindi kinakailangang sa sakit na tinatawag ngayon na ketong o Hansen's disease.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tiyak ang pangngalan at tumutukoy sa nakikitang ulap na kaugnay ng presensya ng PANGINOON sa salaysay.
- source_word: סָר
  choice: lumayo
  rationale: Ipinapahayag ng pandiwa ang pag-alis mula sa dating kinalalagyan; natural sa Filipino ang 'lumayo' para sa ulap na umaalis mula sa ibabaw ng tolda.
- source_word: מֵעַל הָאֹהֶל
  choice: mula sa ibabaw ng tolda
  rationale: Pinananatili nito ang direksiyong paglayo mula sa posisyong nasa ibabaw at ang payak na salitang 'tolda' ng Hebreo.
- source_word: וְהִנֵּה
  choice: naroon / nakita niyang
  rationale: Ang dalawang paglitaw ng particle ay naghaharap ng biglaan at kapansin-pansing tanawin. Isinalin ayon sa natural na daloy ng Filipino habang pinananatili ang dramatikong pagkakita.
- source_word: מְצֹרַעַת
  choice: may malubhang sakit sa balat
  rationale: Mas tumpak ito sa malawak na saklaw ng terminong Hebreo kaysa sa modernong 'ketong,' na maaaring mapagkamalang tiyak na Hansen's disease.
- source_word: כַּשָּׁלֶג
  choice: parang niyebe
  rationale: Tuwirang pinananatili ang maikling paghahambing sa Hebreo nang hindi tahasang idinaragdag ang 'puti,' bagaman malamang na iyon ang katangian sa paghahambing.
- source_word: וַיִּפֶן אַהֲרֹן אֶל מִרְיָם
  choice: Lumingon si Aaron kay Miriam
  rationale: Natural na Filipino para sa pisikal na pagbaling ni Aaron sa direksiyon ni Miriam.
- source_word: וְהִנֵּה מְצֹרָעַת
  choice: at nakita niyang may malubhang sakit ito sa balat
  rationale: Pinananatili ang ikalawang mariing pagkilala sa kalagayan ni Miriam, ngunit inihahayag sa kasalukuyang natural at malinaw na Filipino.
