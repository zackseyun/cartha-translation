    rationale: Ang termino ay tumutukoy sa isang kondisyon/karamdaman sa balat na may rituwal na kahalagahan at hindi nangangahulugang “malubha” sa bawat gamit.
  - severity: low
    issue: Ang “naroon” at lalo na ang “nakita niyang” ay bahagyang pinapahina o isinasalaysay muli ang dalawang paglitaw ng וְהִנֵּה.
    rationale: Ang particle ay nagsisilbing mariing pagpapakita ng kalagayan ni Miriam; maaaring ipakita ito sa Filipino sa pamamagitan ng “narito,” nang hindi nagdaragdag ng ibang pandiwang pang-unawa.
