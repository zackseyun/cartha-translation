translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'malubhang sakit sa balat' sa halip na 'ketongin' upang maiwasan ang maling modernong medikal na katiyakan at mapanatili ang saklaw ng terminong Hebreo. Ang marker na [a] ay inilagay kaagad pagkatapos ng unang pagbanggit sa kondisyon.
