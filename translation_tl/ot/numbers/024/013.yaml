id: NUM.24.13
reference: Numbers 24:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: tl
  text: Kahit ibigay pa sa akin ni Balak ang bahay niyang punô ng pilak at ginto, hindi ko maaaring lampasan ang salita ni Yahweh[a] upang gumawa ng mabuti o masama mula sa sarili kong puso. Anuman ang sabihin ni Yahweh, iyon ang sasabihin ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lampasan ang bibig ni Yahweh.”
    reason: Ipinakikita ang kongkretong idyomang Hebreo sa likod ng natural na saling “salita ni Yahweh.”
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: Kahit ibigay pa
  rationale: 'Sa kontekstong ito, ang kondisyon ay haypotetikal at mariin: kahit mag-alok si Balak ng napakalaking kayamanan, hindi mababago ang tugon ni Balaam. Likas itong ipinapahayag sa modernong Tagalog sa pamamagitan ng “kahit ... pa.”'
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: ang bahay niyang punô ng pilak at ginto
  rationale: Pinananatili nito ang kongkretong larawan ng buong bahay na puno ng kayamanan, habang natural ang ayos sa Tagalog.
- source_word: לֹא אוּכַל
  choice: hindi ko maaaring
  rationale: Ipinahahayag nito ang kawalan ng kakayahan o kalayaang lumampas sa sinabi ni Yahweh sa loob ng haypotetikal na kondisyon.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: lampasan ang salita ni Yahweh
  rationale: Pinananatili ng “lampasan” ang larawan ng pagtawid sa itinakdang hangganan; ang “salita” ay natural na katumbas sa diwa ng literal na “bibig” sa pariralang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: upang gumawa ng mabuti o masama
  rationale: Tapat nitong pinananatili ang magkatunggaling mga salitang moral sa Hebreo nang hindi nililimitahan ang saklaw sa pagpapala at sumpa lamang.
- source_word: מִלִּבִּי
  choice: mula sa sarili kong puso
  rationale: Pinananatili ang larawang “puso” bilang pinagmumulan ng sariling pagkukusa o pasiya ni Balaam, sa halip na tahimik itong ipakahulugan lamang bilang kagustuhan.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ אֲדַבֵּר
  choice: Anuman ang sabihin ni Yahweh, iyon ang sasabihin ko
  rationale: Natural sa Tagalog ang resumptibong “anuman ... iyon,” at pinananatili nito ang tahasang pag-uulit ng pagsasalita.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng limitasyon ni Balaam
  choice: Hindi siya maaaring gumawa ng mabuti o masama mula sa sarili niyang puso nang lampas sa salita ni Yahweh
  alternative: Hindi lamang niya maaaring baguhin ang isang tiyak na utos tungkol sa pagpapala o pagsumpa
  rationale: Pinananatili ng salin ang malawak at tahasang pananalita ng talata nang hindi nagdaragdag ng sistematikong konklusyon tungkol sa lahat ng propesiya.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Kahit ... pa” para sa mariing haypotetikal na kondisyon, at pinanatili ang “puso” upang huwag burahin ang larawan at posibleng lawak ng orihinal.
