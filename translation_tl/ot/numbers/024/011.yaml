  source_fidelity: 'Tumpak ang pangkalahatang diwa: mapagtaboy na utos ni Balak, ang dati niyang pangako ng karangalan, at ang pagsisi niya kay Yahweh sa pagkait nito. Gayunman, ang “sana” sa “Talagang pararangalan sana kita” ay nagdaragdag ng diwang paghihinayang o di-tiyak na kondisyon na wala sa payak ngunit mariing pangako sa Hebreo (infinitive absolute + finite verb).'
  naturalness: Natural at malinaw ang karamihan ng salin. Ang “Kaya ngayon,” “tumakas ka na,” at “ngunit heto” ay angkop sa mariin at pormal na pananalita. Mas natural at mas tapat ang direktang pangakong “Talagang pararangalan kita” nang walang “sana.”
  terminology: Ang “Yahweh” ay wastong pagpapanatili ng Tetragrammaton. Ang “karangalan” ay angkop para sa כָּבוֹד sa kontekstong ito, at ang “pinigilan ka ... na tumanggap ng karangalan” ay malinaw na pagpapahayag ng מנע מן.
