base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: tl
  text: Kaya ngayon, tumakas ka na patungo sa iyong lugar. Sinabi ko[a], “Talagang pararangalan kita,” ngunit heto, pinigilan ka ni Yahweh na tumanggap ng karangalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sinabi ko noon.” Tumutukoy ito sa naunang pangako ni Balak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hinadlangan ka ni Yahweh sa karangalan” o “ipinagkait sa iyo ni Yahweh ang karangalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinananatili ang pang-ugnay at ang temporal na diwa, habang natural na ipinahihiwatig na ito ang pangwakas na tugon ni Balak.
- source_word: בְּרַח לְךָ
  choice: tumakas ka na
  rationale: Ang pautos na בְּרַח ay nagpapahiwatig ng agarang paglayo o pagtakas; ang “na” ay natural na nagpapatingkad sa mapusok at mapagtaboy na tono.
- source_word: אֶל־מְקוֹמֶךָ
  choice: patungo sa iyong lugar
  rationale: Tuwirang pinananatili ang malawak na kahulugan ng מָקוֹם bilang lugar, nang hindi labis na tinutukoy ito bilang tahanan.
- source_word: אָמַרְתִּי
  choice: Sinabi ko
  rationale: Ang payak na nagdaang anyo ay tumutukoy nang natural sa naunang pangako ni Balak; maaaring ipakahulugan sa konteksto bilang “Sinabi ko noon.”
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: Talagang pararangalan sana kita
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa pangako. Ipinahahayag ng “talagang” ang diin, at ng “sana” ang pangakong hindi natupad.
- source_word: וְהִנֵּה
  choice: ngunit heto
  rationale: Ipinakikita ng “ngunit” ang matalim na pagsalungat sa ipinangakong karangalan, samantalang pinananatili ng “heto” ang biglaan at mapagtuong lakas ng הִנֵּה.
- source_word: מְנָעֲךָ
  choice: pinigilan ka
  rationale: Tumpak na inilalarawan ang diwa ng מנע na hadlangan o pigilan ang isang tao sa pagkamit ng isang bagay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: מִכָּבוֹד
  choice: na tumanggap ng karangalan
  rationale: Sa konteksto, ang כָּבוֹד ay ang karangalan, katayuan, at gantimpalang ipinangako ni Balak, hindi abstraktong banal na kaluwalhatian.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Ahensiya ni Yahweh sa hindi pagtanggap ni Balaam ng karangalan
  choice: pinigilan ka ni Yahweh na tumanggap ng karangalan
  alternative: ipinagkait sa iyo ni Yahweh ang karangalan
  rationale: Pinananatili ng pinili ang tahasang pahayag at estruktura ng Hebreo na si Yahweh ang humadlang kay Balaam, nang hindi ipinapaliwanag kung ito ay paratang lamang ni Balak o wastong teolohikal na pagsusuri.
translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit marangal ang himig. Pinanatili ang matalim at mapagtaboy na tono ni Balak, ang diin ng pangakong hindi natupad, at ang hindi nalutas na tensiyon sa kaniyang pagsisi kay Yahweh.
