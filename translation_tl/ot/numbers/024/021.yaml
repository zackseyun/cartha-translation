base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: tl
  text: 'Pagkatapos, nakita niya ang Keneo. Binigkas niya ang kanyang pahayag[a] at sinabi:


    “Matatag ang iyong tirahan,


    at nakalagay sa bato ang iyong pugad.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “orakulo.” Ang salitang Hebreo na מָשָׁל ay maaaring tumukoy sa isang kawikaan, panunuya, o propetikong pahayag; dito, tumutukoy ito sa patulang orakulo ni Balaam.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  choice: ang Keneo
  rationale: Pinananatili ang anyong isahan na may pantukoy sa Hebreo, na kumakatawan sa mga Keneo bilang isang pangkat.
- source_word: מְשָׁלוֹ
  choice: ang kanyang pahayag
  rationale: Sa mga pahayag ni Balaam, ang מָשָׁל ay isang maringal at patulang propetikong pananalita. Malinaw at likas sa modernong Filipino ang “pahayag,” habang inilalahad sa talababa ang maaaring saling “orakulo.”
- source_word: אֵיתָן
  choice: matatag
  rationale: Ipinahahayag nito ang katibayan, tibay, at seguridad ng tirahan; natural sa Filipino ang “matatag” sa kontekstong ito.
- source_word: מוֹשָׁבֶךָ
  choice: iyong tirahan
  rationale: Tuwirang tumutukoy sa lugar na tinitirhan at pinananatili ang ikalawang panauhang isahan ng Hebreo.
- source_word: וְשִׂים
  choice: at nakalagay
  rationale: Isinalin bilang paglalarawan sa kalagayan ng pugad sa patulang linya, sa halip na bilang utos, alinsunod sa gamit nito sa konteksto.
- source_word: בַּסֶּלַע
  choice: sa batuhan
  rationale: Ang סֶלַע ay maaaring tumukoy sa bato, malaking tipak ng bato, o mabatong bangin. Ipinahihiwatig ng “batuhan” ang ligtas na pugad sa mabatong kaitaasan nang hindi nagiging teknikal.
- source_word: קִנֶּךָ
  choice: iyong pugad
  rationale: Pinananatili ang literal at patulang larawan ng pugad sa bato.
