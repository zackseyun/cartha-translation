source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: tl
  text: 'ang pahayag ng isang nakaririnig ng mga salita ng Diyos[a],


    at nakaaalam ng kaalaman ng Kataas-taasan,


    na nakakakita ng pangitain ng Makapangyarihan sa Lahat,


    na bumubuwal[b], ngunit dilat ang mga mata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sinabi ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na bumubuwal nang dilat ang mga mata”; nauunawaan ito ng ilan bilang kalagayan ng propetikong ulirat.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: ang pahayag ng
  rationale: Ipinakikilala nito ang isang maringal na propetikong kapahayagan; natural at may dignidad ang “pahayag” sa makabagong Filipino.
- source_word: שֹׁמֵעַ
  choice: nakikinig
  rationale: Ang participle ay naglalarawan sa nagsasalita bilang isang taong patuloy na nakikinig; mas natural dito ang “nakikinig” kaysa sa literal ngunit mabigat na “nakaririnig.”
- source_word: אִמְרֵי אֵל
  choice: mga salita ng Diyos
  rationale: Tuwirang ipinahahayag ang mga binigkas na salita mula sa Diyos, sa malinaw at karaniwang Filipino.
- source_word: וְיֹדֵעַ דַּעַת עֶלְיוֹן
  choice: at nakaaalam ng kaalaman ng Kataas-taasan
  rationale: 'Pinananatili ang siksik at bahagyang malabong ugnayan ng construct phrase: maaaring kaalamang nauukol sa Kataas-taasan o kaalamang mula sa kanya.'
- source_word: עֶלְיוֹן
  choice: Kataas-taasan
  rationale: Likas at kinikilalang salin ng banal na titulong may superlatibong diwa.
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: na nakakakita sa pangitain ng Makapangyarihan sa Lahat
  rationale: Pinananatili ang visionaryong diwa at ang pagkakapantay ng mga paglalarawan sa nagsasalita.
- source_word: שַׁדַּי
  choice: Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulo sa halip na itransliterasyon; malinaw at maringal ito sa Filipino.
- source_word: נֹפֵל
  choice: na bumabagsak
  rationale: Pinananatili ang literal na larawan ng pagkabuwal nang hindi agad ipinapakahulugang kawalan ng malay o propetikong ulirat.
- source_word: וּגְלוּי עֵינָיִם
  choice: ngunit dilat ang mga mata
  rationale: Ang “dilat” ay natural na Filipino para sa mga matang bukás o walang takip; ipinahihiwatig ng “ngunit” ang pagsalungat sa pagkabuwal nang hindi binabago ang pangunahing larawan.
theological_decisions:
- issue: Pagsasalin sa mga banal na titulong אֵל, עֶלְיוֹן, at שַׁדַּי
  choice: Diyos / Kataas-taasan / Makapangyarihan sa Lahat
  alternative: El / Elyon / Shaddai
  rationale: Mga banal na titulo ang mga ito sa konteksto, kaya isinalin ang kahulugan sa natural na Filipino sa halip na ituring na mga pangalang kailangang itransliterasyon.
- issue: Kalikasan ng kaalaman sa pariralang דַּעַת עֶלְיוֹן
  choice: kaalaman ng Kataas-taasan
  alternative: kaalamang mula sa Kataas-taasan
  rationale: Pinananatili ng pangunahing salin ang tunay na ambiguity kung ang kaalaman ay tungkol sa Kataas-taasan, pag-aari niya, o ipinagkaloob niya; hindi ito nilulutas nang dogmatiko.
- issue: Kalagayan ng tagakita sa נֹפֵל
  choice: na bumabagsak
  alternative: nakabulagta / nasa propetikong ulirat
  rationale: Ang Hebreo ay tahasang gumagamit ng pandiwang “bumagsak.” Posible ang isang visionaryong trance state, ngunit interpretasyon iyon at hindi dapat ipalit sa mismong larawan ng teksto.
translation_notes:
  register: Makabago, malinaw, at maringal na Filipino. Pinanatili ang patulang parallelism at ang mga banal na titulo, habang iniwasan ang labis na arkaikong bokabularyo at ang paglalagay ng interpretasyong “ulirat” sa pangunahing teksto.
