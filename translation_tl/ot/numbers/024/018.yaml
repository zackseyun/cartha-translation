  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: tl
  text: Magiging pag-aari ang Edom; magiging pag-aari rin ang Seir ng kanyang mga kaaway[a], habang nagpapamalas ng lakas ang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanyang mga kaaway,” na may panlalaking isahang hulapi. Hindi nagkakaisa ang mga tagapagpaliwanag kung tumutukoy ito sa Seir/Edom o sa pinunong inilalarawan sa nakapaligid na propesiya.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “gumagawa ng lakas/kagitingan”—isang idyomang nangangahulugang magpakita ng lakas o kumilos nang buong tapang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: magiging
  rationale: Ang anyong perpekto na may pang-ugnay sa konteksto ng propesiya ay nagpapahayag ng kalagayang mangyayari; natural na ipinahihiwatig ng “magiging” ang paglipat tungo sa kalagayang iyon.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Pangalan ng bansa o lupaing nagmula kay Esau; pinanatili bilang pangalang pantangi.
- source_word: יְרֵשָׁה
  choice: pag-aari
  rationale: Tumutukoy sa isang bagay o lupaing maaangkin o masasakop. Ang “pag-aari” ay angkop sa konteksto ng pananakop nang hindi labis na ipinapasok ang diwa ng pamanang pampamilya.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Pangalang pantangi ng lugar na kapantay ng Edom sa taludtod. Hindi idinagdag ang “Bundok” sapagkat walang tahasang salita para rito sa Hebreo.
- source_word: אֹיְבָיו
  choice: kanyang mga kaaway
  rationale: Ang hulapi ay panlalaking isahan, kaya pinanatili ang “kanyang.” Maaaring tumukoy ito sa nag-iisang pinunong inilalarawan sa nakapaligid na propesiya, ngunit hindi tahasang nilutas sa salin ang pinagtatalunang tinutukoy nito.
- source_word: וְיִשְׂרָאֵל
  choice: habang ... ang Israel
  rationale: Maaaring payak na “at” ang pang-ugnay, ngunit malinaw at natural na ipinakikita ng “habang” ang kaugnayan ng kasabay na pahayag tungkol sa lakas ng Israel.
- source_word: עֹשֶׂה חָיִל
  choice: nagpapamalas ng lakas
  rationale: Ang idyoma ay nagpapahiwatig ng pagpapakita ng lakas, kakayahan, o kagitingan. Natural sa modernong Filipino ang “nagpapamalas ng lakas” at pinananatili nito ang puwersang pandigma ng pahayag.
theological_decisions:
- issue: Ang tinutukoy ng panlalaking isahang hulapi sa אֹיְבָיו (“kanyang mga kaaway”)
  choice: Pinanatili ang panlalaking isahang “kanyang,” na maaaring tumukoy sa nag-iisang pinunong nasa propesiya ni Balaam.
  alternative: Unawain itong tumutukoy sa Seir/Edom at isalin sa mas impersonal na diwang “mga kaaway nito.”
  rationale: Panlalaking isahan ang anyong Hebreo, at nakasentro ang malapit na konteksto (bb. 17–19) sa isang pinunong magmumula sa Israel. Pinananatili ng “kanyang” ang ugnayang pampanitikan ngunit hindi tahasang iginigiit ang isang partikular na pagkakakilanlang mesiyaniko.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangalang Edom, Seir, at Israel. Ginamit ang “pag-aari” para sa resulta ng pananakop at “nagpapamalas ng lakas” para sa idyomang Hebreo, habang inilagay sa talababa ang tunay na kalabuan ng “kanyang mga kaaway.”
