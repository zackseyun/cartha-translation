base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: tl
  text: Yumukyok siya at humiga na parang leon, at parang babaeng leon[a]—sino ang magpapabangon sa kanya? Pinagpala ang mga nagpapala sa iyo[b], at isinumpa ang mga sumusumpa sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at parang malakas o hustong-gulang na leon.” Maaaring tumukoy ang salitang Hebreo sa isang malakas o hustong-gulang na leon; pinananatili ng “babaeng leon” ang pagkakaiba nito sa naunang salita para sa “leon.”
    reason: lexical_alternative
  - marker: b
    text: Ang pormulang ito ng pagpapala at sumpa ay umaalingawngaw sa Genesis 12:3 at Genesis 27:29.
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: yumukyok
  rationale: Ipinahahayag nito ang pagyuko o pagbaba ng katawan. Sa pagkakatulad sa leon at sa kasunod na שָׁכַב, inilalarawan nito ang hayop na yumuyukod bago mahimlay, hindi ang pagsamba o pagpapasakop ng tao.
- source_word: שָׁכַב
  choice: nahimlay
  rationale: Karaniwang tumutukoy sa paghiga. Ang “nahimlay” ay natural at marangal sa makatang konteksto at mahusay na naglalarawan sa leon na panatag na nakahiga.
- source_word: כַּאֲרִי
  choice: parang leon
  rationale: Tuwirang pinananatili ang hayag na paghahambing at ang karaniwang kahulugan ng אֲרִי.
- source_word: וּכְלָבִיא
  choice: at parang babaeng leon
  rationale: Maaaring tumukoy ang לָבִיא sa leon o babaeng leon, kung minsan ay may diin sa lakas o hustong gulang. Pinananatili ng “babaeng leon” ang pagkakaiba nito sa naunang אֲרִי, habang inilalahad sa talababa ang lehitimong alternatibo.
- source_word: מִי יְקִימֶנּוּ
  choice: sino ang gigising sa kanya?
  rationale: Sa konteksto ng nakahimlay na leon, ang causative na anyo ng קום ay likas na tumutukoy sa pagpabangon o paggising. Ang “gigising” ay malinaw at hindi nagdaragdag ng ideyang “mangangahas,” na wala sa Hebreo.
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: Pinagpala ang mga nagpapala sa iyo
  rationale: Ang participle na may pangalawang panauhang panlalaking isahan na hulapi ay natural na isinasalin bilang “mga nagpapala sa iyo.” Ang predicate na בָרוּךְ ay pinanatili bilang tuwirang pahayag na “pinagpala.”
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: at isinumpa ang mga sumusumpa sa iyo
  rationale: Pinananatili ang eksaktong pagtutulad at pagsalungat sa naunang pahayag tungkol sa pagpapala. Ang “isinumpa” ay tuwirang katumbas ng אָרוּר sa pormulang ito.
theological_decisions:
- issue: Tinutukoy ng mga hulaping pangalawang panauhang isahan sa “mga nagpapala sa iyo” at “mga sumusumpa sa iyo”
  choice: Pinanatili ang isahang “iyo,” na tumutukoy sa Israel/Jacob sa kolektibo at representatibong paraan sa orakulo ni Balaam.
  alternative: Tukuyin ito nang mas makitid bilang hari ng Israel, o gawing hayagang maramihan bilang buong bayan.
  rationale: Israel/Jacob ang agarang paksa ng konteksto at inilalarawan sa makatang isahan. Hindi tinutukoy nang higit sa sinasabi ng teksto kung ang pokus ay bayan, kinatawan, o hari.
- issue: Alingawngaw ng patriyarkal na pormula ng pagpapala at sumpa
  choice: Pinanatili bilang tuwirang pahayag ng pagpapala at sumpa, at inilagay lamang sa talababa ang mga kaugnay na talata.
  alternative: Palawakin ang salin upang hayagang tukuyin ang tipan kay Abraham o ang pagpapala ni Isaac.
  rationale: Malakas ang pagkakatulad sa Genesis 12:3 at 27:29, ngunit hindi dapat ipasok sa pangunahing teksto ang interpretatibong pagpapalawak o mga doktrinal na konklusyon.
translation_notes:
  register: 'Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “yumukyok” at “nahimlay” upang mapanatili ang makatang larawan ng leon nang hindi gawing kilos ng pagsamba ang unang pandiwa. Inayos ang mga pananda ng talababa ayon sa mismong paksang tinutukoy ng bawat tala: [a] sa “babaeng leon” at [b] sa pormula ng pagpapala.'
