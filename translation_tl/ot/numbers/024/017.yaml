id: NUM.24.17
reference: Numbers 24:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: tl
  text: 'Nakikita ko siya[a], ngunit hindi ngayon;

    minamasdan ko siya, ngunit hindi malapit.

    Isang bituin ang lumitaw mula kay Jacob,

    at isang setro ang bumangon mula sa Israel[b].

    Dudurugin nito ang mga sulok ng Moab[c]

    at gigibain ang lahat ng anak ni Set[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Makikita ko siya.” Ang anyong Hebreo ay maaaring maglarawan nang buhay sa isang pangitain o tumukoy sa hinaharap.'
    reason: grammatical_ambiguity
  - marker: b
    text: Ang “bituin” at “setro” ay mga larawang maharlika na maaaring tumukoy sa isang darating na pinuno.
    reason: cultural_note
  - marker: c
    text: Sa Hebreo, “mga sulok ng Moab,” isang matalinghagang pahayag na maaaring tumukoy sa mga dulo o lakas ng Moab.
    reason: lexical_note
  - marker: d
    text: Sa Hebreo, “lahat ng mga anak ni Set.” Maaaring pangalan itong Set; inuunawa naman ito ng ilan bilang patulang tawag sa sangkatauhan o sa isang kaaway na bayan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: Nakikita ko siya
  rationale: Ang Qal imperfect na may panlalaking isahang hulapi ay maaaring maghayag ng pangitain sa kasalukuyang paraan, bagaman maaari rin itong unawaing tumutukoy sa hinaharap. Pinananatili ng “siya” ang personal na pahiwatig ng anyong Hebreo.
- source_word: אֲשׁוּרֶנּוּ
  choice: minamasdan ko siya
  rationale: Pinananatili nito ang kaibhan sa simpleng “nakikita” at ang marangal na paralelismo ng pangitain nang hindi gumagamit ng lipas na pananalita.
- source_word: דָּרַךְ כּוֹכָב
  choice: Isang bituin ang lumitaw
  rationale: Literal na may diwang “humakbang” o “sumulong” ang pandiwa, ngunit sa bituin bilang simuno, malinaw at natural na ipinahahayag ng “lumitaw” ang pagdating nito habang pinananatili ang mismong larawang bituin.
- source_word: וְקָם שֵׁבֶט
  choice: at isang setro ang bumangon
  rationale: Sa paralelismo sa bituin at sa kasunod na pananakop, ang שֵׁבֶט ay pinakamalamang na sagisag ng paghahari, kaya “setro” sa halip na “tungkod” o “lipi.”
- source_word: וּמָחַץ
  choice: Dudurugin nito
  rationale: Ang pandiwa ay nangangahulugang durugin o basagin. Ang “nito” ay tumutukoy sa makasagisag na bituin/setro at hindi tahasang nilulutas kung isang tao o sagisag ang tinutukoy.
- source_word: פַּאֲתֵי מוֹאָב
  choice: mga sulok ng Moab
  rationale: Ang פֵּאָה ay “sulok, gilid, dulo.” Pinananatili ng “mga sulok” ang kakaibang matalinghagang larawan sa Hebreo sa halip na palitan ito ng interpretasyong “mga pinuno” o “lakas.”
- source_word: וְקַרְקַר
  choice: gigibain
  rationale: Bihira at hindi tiyak ang pandiwa; iminungkahing mga diwa ang paggiba, pagwasak, o paglalansag. Ang “gigibain” ay angkop sa konteksto ngunit hindi nagkukunwaring ganap na tiyak ang eksaktong kahulugan.
- source_word: כָּל בְּנֵי שֵׁת
  choice: lahat ng anak ni Set
  rationale: Likas na mababasa ang שֵׁת bilang pangalang Set. Ginamit ang karaniwang anyong Filipino ng pangalan, habang inilalahad sa talababa ang iba pang posibleng pagkaunawa.
theological_decisions:
- issue: Mesiyanikong bisa ng orakulo ni Balaam
  choice: Panatilihin sa teksto ang mga larawang maharlika na “bituin” at “setro” nang hindi tahasang pinapangalanan ang Mesiyas.
  alternative: Tahasang tukuyin ang Mesiyas, o limitahan ang talata sa isang agarang makasaysayang hari gaya ni David.
  rationale: Nagbibigay ang Hebreo ng mga sagisag ng paghahari at pananakop ngunit hindi nito tahasang pinapangalanan ang tinutukoy. Pinananatili ng salin ang posibilidad ng mas malawak na mesiyanikong pagbasa nang hindi ito ipinapasok sa mismong teksto.
- issue: Ugnayan ng personal na tinutukoy at ng mga sagisag
  choice: Gamitin ang personal na “siya” sa simula ngunit ang “nito” para sa bituin/setro sa kasunod na pangungusap.
  alternative: Gawing tahasang personal ang lahat sa pamamagitan ng “niya,” o gawing ganap na di-personal ang buong talata.
  rationale: Panlalaking isahan ang layon ng unang dalawang pandiwa, samantalang bituin at setro ang hayag na mga simuno sa sumunod na paralelismo. Pinananatili nito ang dalawang antas ng larawan.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang patulang paralelismo sa maiikling linya. Iniwasan ang tahasang denominasyonal o kristolohikal na pagpapaliwanag sa pangunahing teksto, at inilagay sa mga talababa ang tunay na mga kalabuan sa gramatika at leksikon.
