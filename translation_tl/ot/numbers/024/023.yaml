  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: tl
  text: Pagkatapos, binigkas niya ang kanyang pahayag at sinabi, “Ay! Sino ang mabubuhay kapag ginawa ito ng Diyos?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang huling parirala sa Hebreo. Maaari rin itong isalin na “kapag itinatag ito ng Diyos” o “kapag inilagay ito ng Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Pagkatapos, binigkas niya ang kanyang pahayag
  rationale: Ang נשׂא kasama ng מָשָׁל ay idyomang tumutukoy sa pagbibigkas ng isang matalinghaga o makatang pahayag. Natural sa Filipino ang “binigkas,” at sapat na malawak ang “pahayag” para sa kontekstong ito.
- source_word: אֹוי
  choice: Ay!
  rationale: Isang bulalas ng pangamba o dalamhati. Ang “Ay!” ay natural at hindi nagdaragdag ng pormal na hatol na maaaring ipahiwatig ng “Kawawa.”
- source_word: מִי יִחְיֶה
  choice: Sino ang mabubuhay
  rationale: Pinananatili nito ang tuwirang tanong ng Hebreo; sa konteksto, ang “mabubuhay” ay may diwang makaliligtas o mananatiling buhay.
- source_word: מִשֻּׂמוֹ אֵל
  choice: kapag ginawa ito ng Diyos
  rationale: Napakahirap at siksik ng parirala. Ang salin ay kumukuha sa אֵל bilang simuno at nagbibigay ng temporal na diwa sa מִן, habang iniiwasang tukuyin nang labis kung ano ang itinatatag o inilalagay.
theological_decisions:
- issue: Pagpapakahulugan sa mahirap na pariralang מִשֻּׂמוֹ אֵל
  choice: kapag ginawa ito ng Diyos
  alternative: kapag itinatag ito ng Diyos; kapag inilagay ito ng Diyos
  rationale: Hindi tiyak ang sintaks ng Hebreo. Pinananatili ng pangunahing salin ang pagkilos ng Diyos at ang pangkalahatang diwa, samantalang inilalahad sa talababa ang mas literal na posibleng pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pahayag” sa halip na mas teknikal na “orakulo,” at ang tunay na kalabuan ng huling parirala ay pinanatili sa talababa.
