base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: tl
  text: Nag-alab ang galit ni Balak kay Balaam, at pinagbangga niya ang kanyang mga palad. Sinabi ni Balak kay Balaam, “Ipinatawag kita upang sumpain ang aking mga kaaway, ngunit tingnan mo—talagang pinagpala mo sila[a] nang tatlong beses na!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang pandiwang “pinagpala” ay sinusundan ng isang anyong pandiwa na nagbibigay-diin sa kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: Nag-alab ang galit ni Balak kay Balaam
  rationale: Pinananatili ng “nag-alab ang galit” ang matingkad na idyomang Hebreo tungkol sa nag-aapoy na galit, habang natural pa rin sa makabagong Tagalog.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: ipinalo niya sa isa’t isa ang kanyang mga palad
  rationale: Malinaw nitong inilalarawan ang galít na paghampas ng mga palad at iniiwasan ang “pumalakpak,” na maaaring magpahiwatig ng papuri o pagsang-ayon.
- source_word: לָקֹב
  choice: upang sumpain
  rationale: Tuwirang ipinahahayag ang layunin ng pagpapatawag kay Balaam.
- source_word: אֹיְבַי
  choice: ang aking mga kaaway
  rationale: Natural at tuwirang katumbas ng pangngalang maramihan na may unang panauhang pag-aari.
- source_word: קְרָאתִיךָ
  choice: Ipinatawag kita
  rationale: Ang “ipinatawag” ay natural sa konteksto ng pormal na pagpaparating kay Balaam at mas tiyak kaysa sa karaniwang “tinawag.”
- source_word: וְהִנֵּה
  choice: ngunit tingnan mo
  rationale: Naihahatid nito ang biglang pagtukoy sa di-inaasahang kinalabasan at ang salungat na diwa ng pahayag.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: talagang pinagpala mo sila
  rationale: Ipinahahayag ng “talagang” ang diin ng pandiwang may infinitive absolute nang hindi dinaragdagan ang kahulugan ng teksto.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: nang tatlong beses na
  rationale: Natural na Tagalog para sa tatlong pag-uulit hanggang sa kasalukuyang sandali; ipinahihiwatig ng “na” ang puwersa ng demonstratibo sa konteksto.
