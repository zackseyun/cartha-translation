  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: tl
  text: 'At binigkas niya ang kanyang pahayag at sinabi:


    “Pahayag ni Balaam na anak ni Beor,


    pahayag ng lalaking bukás ang mata[a]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakapikit ang mata” o “nakapinid ang mata.” Mahirap unawain ang pariralang Hebreo at higit sa isang paraan ang pagpapakahulugan dito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: bिनigkas niya ang kanyang pahayag
  rationale: Ang pinagsamang pandiwa at pangngalan ay isang idyomang nagpapakilala sa isang pormal at patulang pahayag. Likas sa modernong Tagalog ang “binigkas,” habang pinananatili ng “pahayag” ang malawak na diwa ng מָשָׁל sa kontekstong ito.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Tuwirang salin ng karaniwang anyong pasalaysay na nagpapakilala sa mismong sinipi.
- source_word: נְאֻם
  choice: pahayag ni/ng
  rationale: Tumutukoy ito sa isang taimtim at may-awtoridad na pagbigkas. Ang “pahayag” ay marangal at malinaw, at pareho ang salin sa dalawang paglitaw nito.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Balaam na anak ni Beor
  rationale: Karaniwang transliterasyon ng mga pangalang pantangi at natural na pagpapahayag ng patronimiko sa Tagalog.
- source_word: הַגֶּבֶר
  choice: ang lalaki
  rationale: Natural at tuwirang katumbas ng גֶּבֶר dito; hindi kailangang idagdag ang posibleng pahiwatig ng lakas.
- source_word: שְׁתֻם הָעָיִן
  choice: bukás ang mata
  rationale: Kaayon ito ng konteksto ng pangitain at nahayag na paningin sa kasunod na talata. Gayunman, dahil mahirap at pinagtatalunan ang pariralang Hebreo, inilalahad sa talababa ang alternatibong “nakapikit/nakapinid.”
theological_decisions:
- issue: Pagpapakahulugan sa paglalarawan ni Balaam sa sarili na שְׁתֻם הָעָיִן
  choice: bukás ang mata
  alternative: nakapikit o nakapinid ang mata
  rationale: Ipinakikita ng agarang konteksto na tumatanggap si Balaam ng pangitain at nahahayag ang kanyang mga mata. Pinananatili ang tunay na leksikal na kalabuan sa talababa sa halip na tuluyang lutasin ito sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang patulang paghahanay upang ipakita ang pormal na pananalita ni Balaam. Ang tuldik sa “bukás” ay tumutulong na malinaw itong mabasa bilang “open,” hindi “tomorrow.”
