lexical_decisions:
- source_word: כִּי אִם
  choice: Sapagkat kahit
  rationale: Ipinakikita ang ugnayang nagpapaliwanag sa naunang pahayag at pinananatili ang kondisyunal o konsesibong puwersa ng parirala.
- source_word: יִהְיֶה לְבָעֵר
  choice: nakatalaga sa pagkasunog
  rationale: Likas na Filipino ito para sa prediktibong konstruksiyon na nagsasaad ng kahihinatnan, habang pinananatili ang larawan ng pagsunog sa halip na agad itong gawing pangkalahatang 'pagkawasak.'
- source_word: קָיִן
  choice: Kain
  rationale: Pinanatili ang anyo ng pangalang Hebreo; nililinaw sa talababa na malamang na tumutukoy ito sa mga Kenita sa konteksto.
- source_word: עַד מָה
  choice: gaano pa katagal bago
  rationale: Natural na ipinahahayag sa modernong Filipino ang temporal na tanong tungkol sa panahong lilipas bago mangyari ang kasunod na pangyayari.
- source_word: אַשּׁוּר
  choice: Ashur
  rationale: Tinumbasan bilang pangalang pantangi upang mapanatili ang ambiguwidad kung ang tinutukoy ay Asiria o ang Asiriano.
- source_word: תִּשְׁבֶּךָּ
  choice: ka dalhing bihag
  rationale: Ipinahahayag ang diwa ng ugat na שבה, ang pagkuha at pagdadala sa isang tao bilang bihag.
