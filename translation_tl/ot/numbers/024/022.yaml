  - severity: low
    issue: Ang “bago ka dalhing bihag” ay bahagyang mabigat sa makabagong Filipino.
    rationale: Ang “bago ka dalhin ng Ashur bilang bihag” ay mas natural na ayos at malinaw na pinananatili ang parehong aspekto ng pagdadala at pagkabihag.
