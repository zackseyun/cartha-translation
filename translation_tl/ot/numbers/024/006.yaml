id: NUM.24.6
reference: Numbers 24:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: tl
  text: 'Nakalatag silang gaya ng mga libis,

    gaya ng mga hardin sa tabi ng ilog,

    gaya ng mga punongkahoy na aloe[a] na itinanim ni Yahweh,

    gaya ng mga sedro sa tabi ng tubig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga punong aloewood” o “mga punong mabangong kahoy.” Ang salitang Hebreo rito ay tumutukoy sa mababangong punongkahoy o kahoy, hindi sa “mga tolda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: mga libis
  rationale: Ang נחל ay maaaring tumukoy sa libis o wadi na dinadaluyan ng tubig. Ang “mga libis” ay natural sa Tagalog at umaangkop sa larawan ng malawak at mayamang tanawin.
- source_word: נִטָּיוּ
  choice: nakalatag sila
  rationale: Ang anyong Niphal ng נטה ay nagpapahiwatig ng pagkakaunat o pagkakalatag. Pinananatili ng “nakalatag sila” ang larawan ng bayang nakikita ni Balaam na malawak ang pagkakaayos.
- source_word: גַנֹּת
  choice: mga hardin
  rationale: Tuwirang salin na nagpapanatili sa larawan ng mataba at inaalagaang lupain.
- source_word: עֲלֵי נָהָר
  choice: sa tabi ng ilog
  rationale: Sa idyomang ito, ang על ay nangangahulugang malapit o nasa tabi; malinaw at natural ang “sa tabi ng ilog.”
- source_word: אֲהָלִים
  choice: mga punong aloe
  rationale: Sa kontekstong patula, tumutukoy ang salita sa mababangong punongkahoy o kahoy na karaniwang isinasaling “aloe,” hindi sa mga tolda. Nilinaw sa talababa ang pagkakakilanlang leksikal.
- source_word: נָטַע
  choice: itinanim
  rationale: Ang perpektong pandiwa ay naglalarawan sa natapos na pagkilos ni Yahweh at sa nananatiling bunga nito; sapat itong naipahahayag ng likas na Tagalog na “itinanim.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֲרָזִים
  choice: mga sedro
  rationale: Ang “sedro” ang kinikilalang katawagan sa punong sumasagisag sa taas, tibay, at karangyaan sa tulang Hebreo.
- source_word: עֲלֵי מָיִם
  choice: sa tabi ng tubig
  rationale: Natural sa Tagalog ang kolektibong “tubig” at naipahahayag nito ang lokasyon sa tabi ng saganang pinagmumulan ng tubig.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan at hindi ito pinapalitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang magkakahanay na mga paghahambing at ang matulaing pag-uulit ng “gaya ng.” Inilipat ang talababa sa “aloe,” ang salitang tunay na saklaw ng paliwanag, sa halip na ilagay ito pagkatapos ng unang parirala.
