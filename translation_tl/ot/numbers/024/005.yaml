source:
  edition: WLC
  text: מַה טֹּ֥בוּ אֹהָלֶ֖י/ךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖י/ךָ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: tl
  text: 'Kay inam ng iyong mga tolda[a], O Jacob,

    ng iyong mga tahanan, O Israel!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kay ganda” o “Kay kaaya-aya ng iyong mga tolda.” Ang pananalitang Hebreo ay isang padamdam ng paghanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Kay
  rationale: Ginamit bilang panimulang padamdam na nagpapahayag ng paghanga, hindi bilang salitang pananong.
- source_word: טֹּבוּ
  choice: inam
  rationale: Ang “inam” ay likas na nagpapahayag ng kabutihan, kaaya-aya, at kahanga-hangang anyo nang hindi nililimitahan ang malawak na diwa ng טוֹב sa pisikal na ganda lamang.
- source_word: אֹהָלֶיךָ
  choice: iyong mga tolda
  rationale: Karaniwang nangangahulugang “tolda” ang אֹהֶל; tumutukoy rito ang konteksto sa kampamento ng Israel, hindi sa isang santuwaryo.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Pinanatili ang pangalang pantangi; ginagamit ito rito bilang patulang tawag sa bayan ng Israel.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: iyong mga tahanan
  rationale: Ipinahahayag nito ang mga tirahan at pinananatili ang paralelismo sa “mga tolda” nang hindi nagpapahiwatig na santuwaryo ang tinutukoy.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinanatili ang pangalang pantangi; kapantay ito ng “Jacob” bilang patulang tawag sa sambayanan.
theological_decisions:
- issue: Kung gagamit ng tradisyonal na terminong may kahulugang kultiko para sa mga tirahan
  choice: “mga tolda” at “mga tahanan”
  alternative: “mga tabernakulo”
  rationale: Ang talata ay humahanga sa kampamento at mga tirahan ng Israel, hindi tahasang sa santuwaryo. Iniiwasan ng napiling salin ang pagpasok ng di-kinakailangang kultikong pahiwatig.
translation_notes:
  register: Makabago ngunit marangal at patula ang rehistro. Pinanatili ang “O” bilang malinaw na pantawag sa dalawang magkatumbas na hanay, at ginamit ang tandang padamdam upang ihayag ang puwersa ng Hebreong pananalita.
