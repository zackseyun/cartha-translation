base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: tl
  text: 'Pagkatapos, binigkas niya ang kanyang patulang pahayag at sinabi:


    “Pahayag ni Balaam na anak ni Beor,


    pahayag ng lalaking nakapikit ang mata[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakadilat ang mata.” Ganito nauunawaan ng ilan ang parirala batay sa konteksto ng pangitain at sa sinaunang tradisyon ng pagpapakahulugan, ngunit mas tuwirang ipinahihiwatig ng anyong Hebreo ang “nakapikit” o “nakasara.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: binigkas niya ang kanyang patulang pahayag
  rationale: Ang idyoma ay nagpapakilala ng isang pormal at patulang pananalita. Natural sa modernong Tagalog ang “binigkas,” samantalang ipinahihiwatig ng “patulang pahayag” ang anyo at tungkulin ng מָשָׁל nang hindi ito nililimitahan sa karaniwang kahulugan ng “salawikain” o ipinagpapalit sa נְאֻם.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Payak at natural na salin ng karaniwang pandiwang nagsasaad ng pagsasalita; pinananatili rin nito ang daloy ng pambungad.
- source_word: נְאֻם
  choice: pahayag ni/ng
  rationale: Tumutukoy ito sa isang pormal at makapangyarihang kapahayagan. Malinaw at marangal ang “pahayag” sa Tagalog at naiiwasang ulitin ang ideya ng “patulang pahayag” bilang isang teknikal na “orakulo.”
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Balaam na anak ni Beor
  rationale: Karaniwang anyo sa Tagalog para sa pangalan at ugnayang mag-ama.
- source_word: הַגֶּבֶר
  choice: ang lalaki
  rationale: Direktang inililipat ang panlalaking pangngalan. Hindi idinagdag ang posibleng diin sa lakas sapagkat hindi iyon kailangan sa pormulang ito.
- source_word: שְׁתֻם הָעָיִן
  choice: nakapikit ang mata
  rationale: Mas tuwirang sinasalamin nito ang anyong Masoretiko at ang karaniwang diwang “nakasara” o “nakapikit.” Nananatiling isahan ang “mata,” gaya ng Hebreo, at inilalahad sa talababa ang mahalagang alternatibong pagbasa.
theological_decisions:
- issue: Kahulugan ng paglalarawan kay Balaam sa שְׁתֻם הָעָיִן
  choice: nakapikit ang mata
  alternative: nakadilat ang mata / bukás ang mata
  rationale: Kontrobersiyal ang parirala. Pinananatili sa pangunahing teksto ang mas tuwirang pahiwatig ng anyong Hebreo sa MT, sa halip na iayon agad sa konteksto ng pangitain. Inilalagay sa talababa ang alternatibong pagbasa na sinusuportahan ng konteksto at sinaunang tradisyon ng pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maikling mga linyang patula upang ipakita ang pormal at makatang anyo ng pahayag. Inilagay ang pananda ng talababa sa mismong pinagtatalunang parirala.
