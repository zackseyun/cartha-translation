base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: tl
  text: At ngayon, tingnan mo, aalis na ako patungo sa aking bayan. Halika, papayuhan kita tungkol sa gagawin ng bayang ito sa iyong bayan[b] sa mga huling araw[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga araw na darating.” Maaaring tumukoy ang pariralang Hebreo sa hinaharap sa pangkalahatan, bagaman pinananatili ng “sa mga huling araw” ang propetikong bigat nito.
    reason: alternative_reading
  - marker: b
    text: O, “laban sa iyong bayan.” Literal na “sa iyong bayan” ang pang-ukol sa Hebreo, ngunit maaaring magpahiwatig ang konteksto ng masamang pagkilos laban dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang pamanahong עַתָּה na nagpapakilala sa susunod na pahayag ni Balaam.
- source_word: הִנְנִי
  choice: narito
  rationale: Nagbibigay ito ng diin sa kasalukuyan at tiyak na balak ng nagsasalita; ang “narito” ay marangal at nauunawaan sa makabagong Filipino.
- source_word: הוֹלֵךְ לְעַמִּי
  choice: pupunta na ako sa aking bayan
  rationale: Ipinahahayag ng participle ang nalalapit na pag-alis. Ang “pupunta na ako” ay likas sa Filipino at hindi nagdaragdag ng tahasang ideya ng pag-uwi na wala sa mismong pandiwa.
- source_word: לְכָה
  choice: Halika
  rationale: Isang pautos na tumatawag sa kausap upang makinig o kumilos; tuwirang katumbas nito ang “Halika.”
- source_word: אִיעָצְךָ
  choice: papayuhan kita
  rationale: Pinananatili ang pangunahing kahulugan ng יעץ na “magpayo” o “magbigay ng payo,” kahit ang kasunod na nilalaman ay isang propetikong pahayag at maaari ring unawaing pagbibigay-alam.
- source_word: אֲשֶׁר יַעֲשֶׂה הָעָם הַזֶּה
  choice: tungkol sa gagawin ng bayang ito
  rationale: Likas na inilalahad sa Filipino ang nilalaman ng pagpapayo habang pinananatili ang kolektibong isahan ng עָם bilang “bayan.”
- source_word: לְעַמְּךָ
  choice: sa iyong bayan
  rationale: Pinananatili ang literal na ugnayang ipinahihiwatig ng לְ nang hindi tahasang nilulutas kung ito ay kilos na laban sa bayan ni Balak; inilalahad sa talababa ang kontekstuwal na alternatibo.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: sa mga huling araw
  rationale: Pinananatili ang Hebreong idyoma at ang propetiko, posibleng eskatolohikong bigat nito, sa halip na gawing pangkalahatang pagtukoy lamang sa hinaharap.
theological_decisions:
- issue: Saklaw ng panahong tinutukoy ng בְּאַחֲרִית הַיָּמִים
  choice: sa mga huling araw
  alternative: sa mga araw na darating
  rationale: Maaaring tumukoy ang parirala sa isang panahon sa hinaharap nang hindi palaging nangangahulugan ng ganap na binuong aral tungkol sa wakas ng panahon. Pinananatili ng salin ang propetikong tensiyon at hindi ito nililimitahan sa isang denominasyonal na pagbasa.
- issue: Kung ang לְ sa לְעַמְּךָ ay tahasang nagpapahiwatig ng pagkapoot
  choice: sa iyong bayan
  alternative: laban sa iyong bayan
  rationale: Ang pang-ukol ay literal na “sa/para sa,” ngunit ang konteksto ay maaaring magpahiwatig ng masamang pagkilos. Pinananatili sa teksto ang pormal na ambiguwidad at ibinibigay sa talababa ang posibleng kontekstuwal na kahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עָם, “narito” bilang may-diin ngunit pamilyar na panandang diskurso, at payak na ayos ng pangungusap upang maging malinaw sa karaniwang mambabasa. Inilagay ang mga pananda ng talababa sa mismong mga pariralang kanilang ipinapaliwanag.
