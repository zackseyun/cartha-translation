    issue: Hindi malinaw ang "nakahimpil nang lipi-lipi."
    rationale: Bagaman nauunawaan ang layon nito, ang "nang lipi-lipi" ay hindi ang pinakalikas na paraan upang ihayag ang pagkakaayos ayon sa mga lipi. Ang "ayon sa mga lipi nito" ay mas malinaw at tapat sa לִשְׁבָטָיו.
