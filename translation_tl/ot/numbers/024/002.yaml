  naturalness: Kailangan ng maliit na rebisyon. Ang "Nang itaas ni Balaam..." ay maaaring magtunog na pantulong na sugnay na walang pangunahing pangungusap, samantalang ang Hebreo ay sunod-sunod na salaysay. Hindi rin gaanong likas o malinaw ang "nakahimpil nang lipi-lipi"; mas malinaw ang "nakahimpil ayon sa mga lipi nito."
  terminology: Ang "Espiritu ng Diyos" ay angkop sa propetikong konteksto at tumutugma sa pangunahing pagbasa ng audit trail nang walang pagdaragdag ng doktrinal na paliwanag. Pinananatili sa talababa ang mas literal at estatikong alternatibo.
