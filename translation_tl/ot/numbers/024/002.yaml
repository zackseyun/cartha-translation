base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: tl
  text: Itinaas ni Balaam ang kanyang mga mata at nakita niya ang Israel na nakahimpil ayon sa mga lipi nito,[a] at sumakaniya ang Espiritu ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nananahan ayon sa mga lipi nito” o “nakahimpil, lipi-lipi.”
    reason: lexical_alternative
  - marker: b
    text: O “ang espiritu ng Diyos ay nasa kanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: nang itaas ... ang kanyang mga mata
  rationale: Pinananatili ang tahasang idyomang Hebreo na “itaas ang mga mata,” sa halip na paikliin lamang bilang “tumingin,” habang likas pa rin ang daloy sa Filipino.
- source_word: וַיַּרְא
  choice: nakita niya
  rationale: Tuwirang ipinapahayag ng ראה ang nakita ni Balaam matapos niyang itaas ang kanyang mga mata.
- source_word: שֹׁכֵן
  choice: nakahimpil
  rationale: Ipinahihiwatig ng participle ang Israel na nananatili sa maayos na pagkakampo; ang “nakahimpil” ay natural sa konteksto nang hindi labis na nagbibigay-diin sa larawang militar.
- source_word: לִשְׁבָטָיו
  choice: nang lipi-lipi
  rationale: Ipinapakita ng ל ang pagkakaayos o pamamahagi ayon sa mga lipi. Maikli at natural sa Filipino ang “nang lipi-lipi,” at pinananatili nito ang kolektibong diwa ng Israel.
- source_word: רוּחַ אֱלֹהִים
  choice: Espiritu ng Diyos
  rationale: Sa konteksto ng propetikong pahayag, pinakamalinaw itong tumutukoy sa Espiritu ng Diyos na nagbibigay-kakayahan kay Balaam, nang hindi nagdaragdag ng doktrinang wala sa talata.
- source_word: וַתְּהִי עָלָיו
  choice: sumakanya
  rationale: Ipinahahayag ng “sumakanya” ang pagdating at pagkakaroon ng makapangyarihang presensiya sa kanya, na angkop sa dinamikong gamit ng parirala sa kontekstong propetiko.
theological_decisions:
- issue: Pagpapakahulugan sa רוּחַ אֱלֹהִים sa konteksto ng propetikong pagbibigay-kakayahan
  choice: Espiritu ng Diyos
  alternative: ang espiritu ng Diyos ay nasa kanya
  rationale: Sinusuportahan ng kasunod na propetikong orakulo ang “Espiritu ng Diyos,” ngunit inilalahad sa talababa ang mas istatikong pagbasa upang mapanatili ang leksikal at gramatikal na posibilidad ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang idyomang “itaas ang mga mata,” habang ginamit ang likas na “nakahimpil nang lipi-lipi” para sa ayos ng kampo. Hindi nilutas nang palihim ang posibleng mas istatikong pagbasa sa huling sugnay; inilagay ito sa talababa.
