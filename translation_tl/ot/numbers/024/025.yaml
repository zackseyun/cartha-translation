  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang sunod-sunod na pagkilos at ang pagkakaiba ng “sa kanyang lugar” at “sa kanyang lakad,” nang hindi ipinapalagay na tahasang tahanan ang pinuntahan ni Balaam.
