base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/025.yaml
  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: tl
  text: Pagkatapos, tumindig si Balaam, umalis, at bumalik sa kanyang lugar. Si Balak din ay nagpatuloy sa kanyang daan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng pagtayo o paghahandang umalis. Pinananatili ng “tumindig” ang kilos sa Hebreo at ang marangal na himig ng salaysay.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Ginamit ang nakasanayang transliterasyon ng pangalan sa Filipino.
- source_word: וַיֵּלֶךְ
  choice: umalis
  rationale: Sa kontekstong kasunod ng pagtindig at bago ng pagbabalik sa sariling lugar, likas sa Filipino ang “umalis” at malinaw nitong ipinahihiwatig ang pagyaon nang hindi dinaragdagan ang diwa.
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Ang שׁוב kasama ng pariralang patutunguhan ay tuwirang nangangahulugang bumalik.
- source_word: לִמְקֹמוֹ
  choice: sa kanyang lugar
  rationale: Literal na “sa kanyang lugar.” Hindi ito ginawang “sa kanyang tahanan” sapagkat hindi tahasang sinasabi ng Hebreo na bahay o tahanan.
- source_word: וְגַם
  choice: din
  rationale: Likas na ipinapahayag ng “din” sa Filipino ang dagdag at kahambing na pagkilos ni Balak.
- source_word: בָּלָק
  choice: Balak
  rationale: Ginamit ang nakasanayang transliterasyon ng pangalan sa Filipino.
- source_word: הָלַךְ
  choice: umalis
  rationale: Sa wakas ng tagpo, ipinahihiwatig ng הלך ang pag-alis ni Balak; “umalis” ang malinaw at natural na salin sa Filipino.
- source_word: לְדַרְכּוֹ
  choice: nagpatuloy sa kanyang lakad
  rationale: Ang דרך ay “daan/lakad,” at ang parirala ay idyomatikong tumutukoy sa pagyaon ng isang tao sa sarili niyang direksiyon. Ang “nagpatuloy sa kanyang lakad” ay natural at hindi nagpapalagay ng tiyak na destinasyon.
