  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: tl
  text: Ngunit darating ang mga sasakyang-dagat mula sa baybayin ng Kittim[a]. Pahihirapan nila ang Asshur[b], at pahihirapan din nila ang Eber[c]. At siya rin ay hahantong sa pagkapuksa.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring partikular na tumukoy ang Kittim sa Cyprus o, sa mas malawak na diwa, sa mga bayang mandaragat mula sa kanluran.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin ang Asshur bilang “Asiria.”
    reason: lexical_alternative
  - marker: c
    text: Maaaring tumukoy ang Eber sa isang bayang may pangalang Eber, sa mga Hebreo, o sa mga bayang nasa “ibayo” ng isang hangganan gaya ng Eufrates.
    reason: alternative_reading
  - marker: d
    text: Sa Hebreo, “siya rin” ang mababasa. Hindi tiyak kung sino ang tinutukoy ng panghalip; inuunawa naman ito ng ilan sa sama-samang diwang “ito rin” o bilang isang pinunong kumakatawan sa kapangyarihang nagmula sa Kittim.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: mga sasakyang-dagat
  rationale: Tumutukoy ang pangngalan sa mga barkong naglalayag sa dagat. Likas at malinaw sa modernong Filipino ang “mga sasakyang-dagat,” at hindi nito idinaragdag ang mas tiyak na diwang militar ng “mga barkong pandigma.”
- source_word: מִיַּד
  choice: mula sa baybayin ng
  rationale: Literal itong “mula sa kamay ng,” ngunit sa heograpikong gamit maaari itong mangahulugang panig, pampang, o rehiyon. Dahil mga sasakyang-dagat ang tinutukoy, likas na naipapahayag ng “mula sa baybayin ng” ang malamang na diwang pandagat.
- source_word: כִּתִּים
  choice: Kittim
  rationale: Pinanatili ang pangalang nasa Hebreo upang hindi ipasiya kung partikular itong Cyprus o mas malawak na mga bayang mandaragat mula sa kanluran.
- source_word: וְעִנּוּ
  choice: pahihirapan nila
  rationale: Sa piel, ang ענה ay maaaring mangahulugang pahirapan, hamakin, o siilin. Malawak ang “pahihirapan” at hindi nito labis na tinutukoy ang paraan ng pananakop o pagpapasakop.
- source_word: אַשּׁוּר
  choice: Asshur
  rationale: Pinanatili ang anyo ng pangalang Hebreo at ang posibleng pagtukoy nito sa lupain o bayan; ang “Asiria” ay inilagay bilang alternatibo sa talababa.
- source_word: עֵבֶר
  choice: Eber
  rationale: Hindi tiyak kung pangalan ito ng isang bayan, kaugnay ng mga Hebreo, o tumutukoy sa mga nasa ibayo ng isang hangganan. Pinananatili ng transliterasyon ang kalabuan.
- source_word: וְגַם הוּא
  choice: at siya rin
  rationale: Panlalaking isahan ang panghalip sa Hebreo. Tuwirang pinananatili ng “siya rin” ang anyong gramatikal at ang di-tiyak na pinatutungkulan nito.
- source_word: עֲדֵי אֹבֵד
  choice: hahantong sa pagkapuksa
  rationale: Ipinahahayag nito ang patungong wakas na pagkapuksa nang hindi idinaragdag ang mas matinding ideya ng walang-hanggang kapahamakan.
theological_decisions:
- issue: Pagkakakilanlan ng Kittim, Asshur, Eber, at ng huling panghalip na isahan
  choice: Pinanatili ang mga pangalang Kittim, Asshur, at Eber, at isinalin ang huling panghalip bilang “siya” nang hindi tinutukoy ang historikal na pinatutungkulan.
  alternative: Maaaring unawain ang Kittim bilang Cyprus o mga kapangyarihang pandagat mula sa kanluran, ang Asshur bilang Asiria, ang Eber bilang mga Hebreo o mga bayan sa ibayo ng Eufrates, at ang “siya” bilang sama-samang pagtukoy sa Kittim, sa pinuno nito, o sa ibang kapangyarihan.
  rationale: Propetiko at pinagtatalunan ang historikal na pagtukoy ng talata. Pinananatili ng salin ang tunay na kalabuan ng Hebreo sa halip na ipasiya ang isang interpretasyong hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga sasakyang-dagat” sa halip na mas teknikal o militar na katawagan; pinanatili ang mga pangalang Hebreo at ang di-tiyak na panghalip upang huwag isara ang mga lehitimong pagbasa.
