  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: tl
  text: Inilalabas siya ng Diyos mula sa Ehipto; taglay niya ang lakas na gaya ng sa mailap na toro.[a] Lalamunin niya ang mga bansang kaaway niya; dudurugin niya ang kanilang mga buto,[b] at wawasakin sila ng kanyang mga palaso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taglay niya ang mga sungay ng mailap na toro.” Mahirap tiyakin ang kahulugan ng pariralang Hebreo; maaari itong tumukoy sa lakas o, mas tahasan, sa matatayog na sungay ng hayop.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ngangatngatin niya ang kanilang mga buto” o “huhubaran niya ang kanilang mga buto.” Bihira ang pandiwang Hebreo at hindi tiyak ang eksaktong diwa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Diyos
  rationale: Tuwirang tumutukoy sa Diyos bilang gumagawa ng pagliligtas; ito ang natural at marangal na salin sa modernong Filipino.
- source_word: מוֹצִיאוֹ
  choice: Inilalabas siya
  rationale: Pinananatili ang masiglang aspektong parang kasalukuyan ng Hebreong participle at ang panlalaking isahang panghalip.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Karaniwang Filipino para sa pinanggalingang lugar sa pariralang tumutukoy sa exodo.
- source_word: כְּתוֹעֲפֹת רְאֵם
  choice: ang lakas na gaya ng sa mailap na toro
  rationale: Mahirap at pinagtatalunang parirala ito. Ang 'lakas' ay likas sa Filipino at hindi labis na nagpapatiyak na tahasang mga sungay ang tinutukoy, habang pinananatili ang larawan ng mailap na toro.
- source_word: לוֹ
  choice: taglay niya
  rationale: Ipinahahayag ang pag-aari o kapakinabangan na nasa Hebreong parirala sa natural na Filipino.
- source_word: יֹאכַל
  choice: Lalamunin
  rationale: Pinananatili ang marahas na metapora ng pagkain o pag-ubos sa konteksto ng digmaan.
- source_word: גּוֹיִם צָרָיו
  choice: ang mga bansang kaaway niya
  rationale: Natural na Filipino para sa mga bansang siyang mga kalaban ng tinutukoy na isahang persona.
- source_word: וְעַצְמֹתֵיהֶם יְגָרֵם
  choice: dudurugin niya ang kanilang mga buto
  rationale: Ang bihirang pandiwang יְגָרֵם ay hindi tiyak ang eksaktong diwa; ang 'dudurugin' ay angkop sa buto at sa marahas na konteksto, habang inilalagay sa talababa ang ibang posibilidad.
- source_word: וְחִצָּיו יִמְחָץ
  choice: wawasakin sila ng kanyang mga palaso
  rationale: Binabasa ang mga palaso bilang kasangkapan at ang pandiwa bilang pagdurog o pagwasak; nililinaw ng 'sila' ang pahiwatig na layon sa natural na Filipino.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na isahan sa orakulo ni Balaam
  choice: Pinanatili ang isahang 'siya/niya/kanyang' nang hindi tinutukoy kung ito ay Israel bilang kabuuan o isang kumakatawang pinuno.
  alternative: Maaaring unawain bilang Israel sa kabuuan, hari o pinuno ng Israel, o—sa kalaunang pagbasa—isang mesiyanikong indibidwal.
  rationale: Isahan ang mga anyong Hebreo, ngunit hindi ganap na nilulutas ng malapit na konteksto ang referensiya. Pinananatili ng salin ang tunay na teolohikal at pampanitikang tensiyon.
translation_notes:
  register: Modernong Filipino na dignified at malinaw sa karaniwang mambabasa. Ginamit ang 'mailap na toro' sa halip na tradisyonal ngunit di-tumpak na 'unicorn.' Pinanatili ang matinding larawang patula at ang mga panghalip na isahan.
