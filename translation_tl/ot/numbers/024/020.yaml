base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: tl
  text: 'Pagkatapos, nakita niya ang Amalek at binigkas ang kanyang pahayag:[a]


    “Ang Amalek ang una sa mga bansa,[b]

    ngunit ang wakas niya ay ganap na pagkapuksa.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binigkas ang kanyang orakulo” o “kasabihan.” Ang salitang Hebreo ay maaaring tumukoy sa isang makatang pahayag, kasabihan, panunuya, o orakulo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinakamauna sa mga bansa” o “nangunguna sa mga bansa.” Maaaring tumukoy ang pariralang Hebreo sa pagkauna sa panahon o sa pagiging pangunahin sa katayuan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ngunit ang kahihinatnan niya ay mapuksa” o “ang kanyang huling wakas ay pagkapuksa.” Maikli ang pahayag sa Hebreo at idiniriin nito ang lubos na pagkawasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  choice: Pagkatapos, nakita niya ang Amalek
  rationale: Isinusulong ng waw-consecutive ang salaysay, at ang “nakita” ang tuwirang kahulugan ng ראה. Likas sa modernong Tagalog ang “Pagkatapos” bilang panandang pagkakasunod-sunod.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: binigkas ang kanyang pahayag
  rationale: Maaaring tumukoy ang מָשָׁל sa kasabihan, patuyang tula, makatang pahayag, o propetikong pahayag. Malawak at natural ang “pahayag” at hindi nito ipinipilit ang isang tiyak na uri.
- source_word: רֵאשִׁית גּוֹיִם
  choice: ang una sa mga bansa
  rationale: Maaaring mangahulugan ang רֵאשִׁית ng pasimula, una sa panahon, o pangunahin sa katayuan. Pinananatili ng “una sa mga bansa” ang pagiging maikli at ang tunay na kalabuan ng Hebreo.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Isinalin sa baybay na karaniwang ginagamit sa Tagalog ang pangalang pantangi; sa konteksto, kinakatawan nito ang bayan o bansang Amalek.
- source_word: וְאַחֲרִיתוֹ
  choice: ngunit ang wakas niya
  rationale: Ang אַחֲרִית ay maaaring tumukoy sa wakas, kahihinatnan, o huling kalagayan. Ang “wakas niya” ay maikli, natural, at malinaw ang pagsalungat sa naunang sugnay.
- source_word: עֲדֵי אֹבֵד
  choice: ay ganap na pagkapuksa
  rationale: Eliptikal ang pariralang Hebreo at idiniriin nito ang pagkapariwara o pagkalipol. Ipinahahayag ng “ganap na pagkapuksa” ang kasidhian at pagiging pangwakas nang hindi idinaragdag ang “magpakailanman,” na hindi tahasang nasa teksto.
theological_decisions:
- issue: Kahulugan ng katayuan ng Amalek sa רֵאשִׁית גּוֹיִם
  choice: Panatilihin sa pangunahing teksto ang “una sa mga bansa,” na maaaring tumukoy sa panahon o katanyagan.
  alternative: “pinakamauna sa mga bansa” o “nangunguna sa mga bansa”
  rationale: Hindi nililinaw ng talata kung ang Amalek ay una ayon sa panahon o pangunahin ayon sa katayuan. Hindi dapat ipasok ng salin ang isang historikal o teolohikal na pasiya na hindi tahasang ibinibigay ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pahayag” bilang malawak at di-teknikal na katumbas ng מָשָׁל. Ang panghalip na “niya” ay sumusunod sa personipikasyon ng bayang Amalek sa isahan. Inayos ang mga pananda ng talababa ayon sa mismong pariralang tinutukoy ng bawat isa.
