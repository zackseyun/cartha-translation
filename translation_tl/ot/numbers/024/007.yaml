base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: tl
  text: Aagos ang tubig mula sa kaniyang mga timba[a], at ang kaniyang binhi[b] ay nasa saganang tubig; magiging mas mataas kaysa kay Agag ang kaniyang hari, at itataas ang kaniyang kaharian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mula sa kaniyang mga sanga,” kung metaporikal ang gamit sa pangngalan sa halip na ang karaniwang kahulugang “mga timba.”
    reason: lexical_alternative
  - marker: b
    text: Ang “binhi” ay maaari ring maunawaan bilang “supling” o “mga inapo”; maaaring ipahiwatig ng Hebreo kapuwa ang pagdami ng lahi at pagkamabunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: Aagos
  rationale: Likas na ipinapahayag ng “aagos” ang pagdaloy ng likido at ang larawan ng kasaganaan, nang hindi ito nililimitahan sa mahinang pagtulo o malakas na pagbuhos.
- source_word: מַיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwang pangngalang di-mabilang ang “tubig” sa Tagalog at natural sa kontekstong ito.
- source_word: מִדָּלְיוֹ
  choice: mula sa kaniyang mga timba
  rationale: Ang karaniwang kahulugan ng דְּלִי ay timba o sisidlang pansalok ng tubig. Pinananatili sa talababa ang di-gaanong tiyak na metaporikal na pagbasa na “mga sanga.”
- source_word: וְזַרְעוֹ
  choice: at ang kaniyang binhi
  rationale: Maaaring tumukoy ang זֶרַע sa literal na binhi o sa supling at mga inapo. Pinananatili ng “binhi” ang sadyang lawak ng makatang larawan.
- source_word: בְּמַיִם רַבִּים
  choice: ay nasa saganang tubig
  rationale: Tuwirang pinananatili nito ang pang-ukol na בְּ at ang larawan ng napakarami o masaganang tubig, nang hindi tahasang ginagawang pandilig o lokasyong “sa tabi.”
- source_word: וְיָרֹם מֵאֲגַג
  choice: magiging mas mataas kaysa kay Agag
  rationale: Ipinahahayag nito ang paghahambing na likas sa מִן kasunod ng pandiwang nangangahulugang maging mataas o dakila.
- source_word: מַלְכּוֹ
  choice: ang kaniyang hari
  rationale: Tuwirang katumbas ng מֶלֶךְ ang “hari.” Hindi tinutukoy sa salin kung sino ang haring ito sapagkat hindi siya tahasang pinangalanan ng talata.
- source_word: וְתִנַּשֵּׂא מַלְכֻתוֹ
  choice: at maitataas ang kaniyang kaharian
  rationale: Ipinakikita ng “maitataas” ang diwang itataas o dadakilain, samantalang ang “kaharian” ay natural na katumbas ng מַלְכוּת sa kontekstong makahari.
theological_decisions:
- issue: Ang tinutukoy ng “kaniyang binhi”
  choice: Pinanatili ang “binhi” nang hindi nililimitahan sa pananim, supling, o mga inapo.
  alternative: “kaniyang supling” o “kaniyang mga inapo”
  rationale: Maaaring taglayin ng Hebreong זֶרַע ang literal at pampamilyang mga kahulugan, at maaaring sinasadyang pag-ugnayin ng tula ang pagkamabunga at pagdami ng lahi.
- issue: Pagkakakilanlan ng “kaniyang hari”
  choice: Hindi pinangalanan ang hari at pinanatili lamang ang paghahambing kay Agag.
  alternative: Tukuyin bilang isang partikular na hari ng Israel o bilang mesiyanikong tauhan.
  rationale: Ipinahahayag ng orakulo ang kataasan ng hari ng Israel, ngunit hindi tahasang kinikilala ng talata kung sino siya. Hindi dapat magpasok ang salin ng isang tiyak na interpretasyong teolohikal.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “kaniyang” para sa pormal at malinaw na estilong biblikal. Pinanatili ang paralelismo at ang matalinghagang kalabuan ng tula, lalo na sa “binhi” at “saganang tubig.”
