lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salaysay na anyo ng אמר na nagpapakilala ng tuwirang pananalita; natural sa modernong Tagalog ang “Sinabi.”
- source_word: בִּלְעָם אֶל־בָּלָק
  choice: ni Balaam kay Balak
  rationale: Pinananatili ang mga pangalang pantangi at malinaw na ipinakikita ng “kay” na si Balak ang kinakausap.
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Tanong na may inaasahang sagot na oo; ang “Hindi ba” ang natural at tuwirang katumbas sa Tagalog.
- source_word: גַּם
  choice: rin
  rationale: Ipinahihiwatig na sinabi rin ni Balaam ang bagay na ito sa mga sugo ni Balak; ginagamit ang “rin” ayon sa natural na tunog sa pangungusap.
- source_word: מַלְאָכֶיךָ
  choice: mga sugo mo
  rationale: Sa kontekstong ito, tumutukoy ang מַלְאָךְ sa mga taong isinugo, hindi sa mga anghel. Natural at marangal sa Tagalog ang “mga sugo.”
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלָי
  choice: na ipinadala mo sa akin
  rationale: Tuwirang isinasalin ang sugnay na naglalarawan kung aling mga sugo ang tinutukoy.
- source_word: דִּבַּרְתִּי לֵאמֹר
  choice: sinabi ko … ‘
  rationale: Ang perpektong anyo ay panretrospektibo (“sinabi ko”), at ang לֵאמֹר ay nagpapakilala sa siping nagpapatuloy sa susunod na talata. Sa Tagalog, natural na ihayag ito sa pamamagitan ng pambungad na panipi sa halip na piliting isalin bilang “na sinasabi.”
