  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: tl
  text: 'ang pahayag[a] ng isang nakikinig sa mga salita ng Diyos,

    na nakakakita sa pangitain ng Makapangyarihan,

    na bumabagsak at bukás ang mga mata[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang taimtim na pananalita.” Ang Hebreong נְאֻם ay isang pormal na terminong propetiko para sa isang maringal at taimtim na pahayag.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “walang takip ang mga mata,” na nagpapanatili sa larawan ng mga matang nahayag o walang lambong.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: ang pahayag ng
  rationale: Ang נְאֻם ay isang pormal at taimtim na pananalitang panimula sa propetikong tula. Pinananatili ng “pahayag” ang bigat nito nang hindi nagdadala ng di-kinakailangang pakahulugan.
- source_word: שֹׁמֵעַ
  choice: isang nakikinig
  rationale: Ginagamit ang participle bilang pangngalan at inilalarawan ang taong karaniwang nakikinig o tumatanggap. Likas sa makabagong Tagalog ang “isang nakikinig.”
- source_word: אִמְרֵי אֵל
  choice: mga salita ng Diyos
  rationale: Ang אִמְרֵי ay nangangahulugang mga salita o pananalita. Dito, ang אֵל ay karaniwang titulong pantukoy sa Diyos, hindi pangalang kailangang baybayin bilang “El.”
- source_word: מַחֲזֵה שַׁדַּי
  choice: pangitain ng Makapangyarihan
  rationale: Ang מַחֲזֵה ay isang pangitaing natatanaw, at ang שַׁדַּי ay isinaling bilang titulong “Makapangyarihan.”
- source_word: יֶחֱזֶה
  choice: nakakakita
  rationale: Bagaman imperfect ang anyo, inilalarawan nito rito ang katangian o kasalukuyang karanasan ng nagsasalita, kaagapay ng “nakikinig.”
- source_word: נֹפֵל
  choice: bumabagsak
  rationale: Pinananatili nito ang pandiwang lakas ng participle at hindi tiyak na ipinapalagay kung siya ay nakadapa, nakaluhod, o nakahandusay.
- source_word: וּגְלוּי עֵינָיִם
  choice: ngunit bukás ang mga mata
  rationale: Likas sa Tagalog ang “bukás ang mga mata” at malinaw nitong ipinahahayag ang kalagayan ng paningin. Ang “ngunit” ay nagpapakita ng kaibhan sa pagitan ng pagbagsak at patuloy na pagkakita, samantalang inilalahad sa talababa ang literal na larawang “walang takip.”
theological_decisions:
- issue: Pagkasalin sa שַׁדַּי
  choice: Makapangyarihan
  alternative: Shaddai
  rationale: Isa itong banal na titulo sa konteksto. Ang pagsasalin sa titulo ay mas malinaw sa karaniwang mambabasa at hindi nagpapasok ng mas makitid na doktrinal na pagpapakahulugan.
- issue: Kalagayan ng tagakita habang tumatanggap ng pangitain
  choice: bumabagsak
  alternative: nakadapa
  rationale: Hindi nililinaw ng participle na נֹפֵל ang eksaktong tindig o posisyon ng katawan. Kaya pinananatili ang pandiwang larawan sa halip na tukuying siya ay nakadapa.
translation_notes:
  register: Makabago ngunit maringal na Tagalog ang ginamit upang mapanatili ang estilong propetiko at patula. Ang mga linyang magkakatulad ang balangkas—“nakikinig,” “nakakakita,” at “bumabagsak”—ay nagpapanatili sa paralelismo ng Hebreo. Nilagyan ng tuldik ang “bukás” upang malinaw na mangahulugang open, hindi tomorrow.
