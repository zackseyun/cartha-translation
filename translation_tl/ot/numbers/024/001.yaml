id: NUM.24.1
reference: Numbers 24:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: tl
  text: Nang makita ni Balaam na mabuti sa paningin ni Yahweh na pagpalain ang Israel, hindi siya pumunta, gaya ng mga naunang pagkakataon, upang maghanap ng mga tandang panghuhula[a], kundi itinuon niya ang kanyang mukha patungo sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang makatagpo ng mga panghuhula” o “upang sumalubong sa mga tandang panghuhula.” Tumutukoy ang Hebreong pananalita sa dating gawain ni Balaam na maghanap ng mga tandang para sa panghuhula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Pinananatili ang karaniwang diwa ng ראה at ang Hebreong paraan ng pagpapahayag ng pagkilala ni Balaam sa kalagayan.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: na mabuti sa paningin ni Yahweh
  rationale: Pinananatili ang larawang 'mabuti sa mga mata/paningin,' na likas at nauunawaan sa Filipino bilang kalugod-lugod o katanggap-tanggap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng transliterasyong Yahweh, hindi ng isang titulo.
- source_word: לְבָרֵךְ
  choice: na pagpalain
  rationale: Tuwirang salin ng pawatas na ברך ayon sa gamit nito sa talata.
- source_word: וְלֹא הָלַךְ
  choice: hindi na siya humayo
  rationale: Ang 'humayo' ay marangal ngunit malinaw na katumbas ng karaniwang pandiwang הלך; ipinakikita ng 'na' ang pagbabago mula sa dati niyang gawain ayon sa konteksto.
- source_word: כְּפַעַם בְּפַעַם
  choice: gaya ng mga naunang pagkakataon
  rationale: Likas na ipinahahayag sa Filipino ang paulit-ulit niyang dating gawi nang hindi ginagaya nang mekanikal ang Hebreong idyoma.
- source_word: לִקְרַאת נְחָשִׁים
  choice: upang humanap ng mga palatandaan
  rationale: Ang נְחָשִׁים ay tumutukoy sa mga tandang ginagamit sa panghuhula, hindi sa mga ahas; ipinahahayag ng 'humanap' ang layunin ng pagharap o pagpunta sa mga ito.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: ibinaling niya ang kanyang mukha
  rationale: Pinananatili ang konkretong Hebreong larawan ng sadyang pagharap sa isang direksiyon sa natural na Filipino.
- source_word: אֶל הַמִּדְבָּר
  choice: sa ilang
  rationale: Ang 'ilang' ay maikli, dignificado, at karaniwang salin para sa מִדְבָּר bilang tigang at di-tinitirhang lupain.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa Hebreong teksto; pinananatili ito bilang Yahweh sa halip na palitan ng titulong 'PANGINOON.'
- issue: Kalikasan ng נְחָשִׁים
  choice: mga palatandaan
  alternative: mga panghuhula o mga tandang panghuhula
  rationale: Iniiwasang ipakahulugan ang salita bilang literal na mga ahas at pinananatiling sapat na malawak ang pagtukoy sa mga tandang ginagamit sa divinasyon; nililinaw sa talababa ang konteksto.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Pinanatili ang idyomang “mabuti sa paningin” at ang konkretong larawan ng pagbaling ng mukha, habang ginawang natural ang pariralang tumutukoy sa dati at paulit-ulit na paghahanap ni Balaam ng mga tandang panghuhula.
