revisions:
- from: Nang makita ni Balaam na mabuti sa paningin ni Yahweh na pagpalain ang Israel, hindi na siya humayo gaya ng mga naunang pagkakataon upang humanap ng mga palatandaan[a], kundi ibinaling niya ang kanyang mukha sa ilang.
  to: Nang makita ni Balaam na mabuti sa paningin ni Yahweh na pagpalain ang Israel, hindi siya pumunta, gaya ng mga naunang pagkakataon, upang maghanap ng mga tandang panghuhula[a], kundi itinuon niya ang kanyang mukha patungo sa ilang.
  rationale: Inalis ang dagdag na aspektong “hindi na,” pinasaklaw ngunit nilinaw ang terminong para sa mga omen bilang “mga tandang panghuhula,” at ginawang mas tuwiran ang idyomang nagsasaad na sadyang itinuro ni Balaam ang kanyang mukha tungo sa ilang. Pinananatili ng talababa ang mga leksikal na posibilidad ng Hebreong parirala.
