base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: tl
  text: At maghahari ang isa mula kay Jacob[a], at lilipulin niya ang nalalabi mula sa lunsod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At mamumuno ang isa mula kay Jacob.” Ang pandiwang Hebreo ay maaaring isaling “maghari” o “mamuno.”
    reason: lexical_alternative
  - marker: b
    text: O “ang nakaligtas mula sa lunsod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: At may isang maghahari
  rationale: Ang pandiwa ay pinakamalamang na mula sa רדה, “maghari/mamuno.” Walang hayag na simuno sa sugnay, kaya ang “may isang” ay natural na nagpapahiwatig sa pinunong tinutukoy ng naunang konteksto nang hindi siya tahasang kinikilala.
- source_word: מִיַּעֲקֹב
  choice: mula kay Jacob
  rationale: Ang מן ay nagsasaad ng pinagmulan; natural sa modernong Tagalog ang “mula kay Jacob” at pinananatili nito ang ideya ng paglitaw mula sa Jacob/Israel.
- source_word: וְהֶאֱבִיד
  choice: at lilipulin niya
  rationale: Ang Hiphil ng אבד ay nangangahulugang magpangyaring mapahamak o mapuksa. Ang “lilipulin” ay tuwiran at angkop sa matinding diwa ng pandiwa.
- source_word: שָׂרִיד
  choice: ang nalalabi
  rationale: Ang pangngalan ay tumutukoy sa isang natira o nakaligtas at maaari ring magkaroon ng kolektibong diwa. Pinananatili ng “ang nalalabi” ang posibleng kolektibong kahulugan; inilalahad sa talababa ang mas kongkretong alternatibo.
- source_word: מֵעִיר
  choice: mula sa lunsod
  rationale: Karaniwang kahulugan ng עִיר ang “lunsod.” Hindi dinaragdagan ng salin ang tekstong Hebreo ng di-tiyak na paglalarawang gaya ng “nakukutaang lunsod.”
theological_decisions:
- issue: Maharlika o mesiyanikong tinutukoy sa orakulo ni Balaam
  choice: 'Isinalin sa pangkalahatang wikang maharlika: “may isang maghahari mula kay Jacob.”'
  alternative: Tahasang tukuyin ang pinuno bilang isang agarang haring pangkasaysayan lamang o bilang ang Mesiyas.
  rationale: Maharlika ang larawan sa mas malawak na orakulo, ngunit hindi tahasang pinapangalanan ng talata ang pinuno. Pinananatili ng salin ang puwang para sa pangkasaysayan, tipolohikal, o mesiyanikong pagbasa nang hindi nagpapasok ng konklusyong lampas sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lunsod” bilang dignified at karaniwang salin ng עִיר. Ang mga panghalip at ayos ng pangungusap ay nilinaw ayon sa konteksto, habang pinananatili ang hindi hayag na pagkakakilanlan ng pinuno.
