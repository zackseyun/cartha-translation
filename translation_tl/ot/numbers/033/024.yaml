  text: They set out from Mount Shepher and camped at Haradah[a].
translation:
  language: tl
  text: Umalis sila mula sa Bundok ng Shafer at nagkampo sa Harada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang pangalang שָׁפֶר na “Shepher.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang kampo patungo sa kasunod; natural at malinaw sa modernong Tagalog ang “umalis sila.”
- source_word: מֵהַר
  choice: mula sa Bundok ng
  rationale: Ang מן na nakakabit sa הַר ay nangangahulugang “mula sa bundok”; ginamit ang “Bundok ng” bilang natural na anyo bago ang pangalang pantangi.
- source_word: שָׁפֶר
  choice: Sefer
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon. Ang “Sefer” ay malapit sa bigkas ng Hebreong שָׁפֶר at angkop sa ortograpiyang Filipino.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Sa konteksto ng paglalakbay, ang חנה ay paglalagay o pagtatayo ng kampo; ang “nagkampo” ay kasalukuyan, malinaw, at likas sa Filipino.
- source_word: בַּחֲרָדָה
  choice: sa Harada
  rationale: Ang בְּ sa pormulang ito ay nagmamarka sa lugar na pinagkampuhan. Ang “sa” ang natural na katumbas sa Tagalog, at transliterado bilang “Harada” ang pangalan ng lugar.
