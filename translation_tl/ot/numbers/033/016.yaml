  yaml_path: translation/ot/numbers/033/016.yaml
  text: They set out from the wilderness of Sinai and camped at Kibroth-hattaavah[a].
translation:
  language: tl
  text: Umalis sila mula sa ilang ng Sinai at nagkampo sa Kibrot-hataava[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ibig sabihin ng Kibrot-hataava ay “mga libingan ng pagnanasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa paulit-ulit na pormula ng talaan ng paglalakbay sa Bilang 33, ang נסע ay tumutukoy sa pag-alis ng pangkat mula sa isang himpilan. Natural sa makabagong Tagalog ang “umalis sila” at hindi nito dinaragdagan ang diwa.
- source_word: מִמִּדְבַּר סִינָי
  choice: mula sa ilang ng Sinai
  rationale: Ang מִדְבָּר ay lupaing ilang o disyerto. Ang “ilang ng Sinai” ay maikli, dignified, at pinananatili ang ugnayang heograpiko ng parirala.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ay karaniwang pandiwa para sa pagtigil at pagtatayo ng kampo sa mga talaan ng paglalakbay. Ang “nagkampo” ay natural at malinaw sa modernong Filipino.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: sa Kibrot-hataava
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon sa pangunahing teksto. Inilagay sa talababa ang literal na kahulugan upang mapanatili ang mahalagang pahiwatig ng pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na payak ngunit marangal. Pinanatili ang maikli at pormulang estilo ng talaan ng paglalakbay. Ginamit ang “ilang” kaysa “disyerto” bilang mas angkop na katawagang biblikal sa kontekstong ito, at isinalin sa baybay-Tagalog ang pangalan ng lugar.
