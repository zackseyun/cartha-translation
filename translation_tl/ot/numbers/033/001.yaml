translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang ‘mga anak ni Israel’ at ‘lupain ng Ehipto’ para sa ugnayan sa anyong Hebreo, ngunit ginawang natural ang idyomang בְּיַד bilang ‘sa pangunguna nina.’
