  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/צִבְאֹתָ֑/ם בְּ/יַד מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: tl
  text: Ito ang mga yugto ng paglalakbay ng mga anak ni Israel[a], na lumabas mula sa lupain ng Ehipto ayon sa kanilang mga pangkat[b], sa pangunguna nina Moises at Aaron.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa kanilang mga hukbo” o “ayon sa kanilang mga pangkat-pangkat.” May diwang organisado at maaaring militar ang salitang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: 'Literal sa Hebreo: “sa kamay nina Moises at Aaron,” isang idyomang tumutukoy sa kanilang ahensiya o pamumuno.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panimulang Filipino para ipakilala ang talaang kasunod; hindi kailangang tumbasan nang tahasan ang isiningit na copula sa Ingles.
- source_word: מַסְעֵי
  choice: mga yugto ng paglalakbay
  rationale: Tumutukoy ang pangngalan sa magkakasunod na yugto o paghimpilan sa itineraryo, hindi lamang sa isang pangkalahatang paglalakbay.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilyang anyo ng Hebreo habang nananatiling malinaw at pamilyar sa Filipino.
- source_word: אֲשֶׁר יָצְאוּ
  choice: na lumabas
  rationale: Tuwirang ipinahahayag ang pag-alis nila mula sa Ehipto at maayos na inuugnay ang sugnay sa mga anak ni Israel.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang אֶרֶץ, ‘lupain,’ sa orihinal.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kanilang mga pangkat
  rationale: Ipinahahayag ang organisadong pagkakahati ng Israel nang hindi ipinapalagay na aktuwal silang nakikipagdigma; itinatala sa talababa ang mas militar na posibilidad.
- source_word: בְּיַד
  choice: sa pangunguna nina
  rationale: Natural na Filipino para sa idyomang Hebreo na literal na ‘sa pamamagitan/kamay nina,’ na nagsasaad ng ahensiya o pamumuno.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moises at Aaron
  rationale: Karaniwang anyo ng mga pangalang ito sa Bibliyang Filipino.
