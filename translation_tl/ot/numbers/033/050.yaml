  source_fidelity: Ang “sa tapat ng Jerico” ay isang heograpikong pagpapaliwanag na hindi tahasang isinasaad ng Hebreong עַל־יַרְדֵּן יְרֵחוֹ. Ipinahihiwatig ng parirala ang kinaroroonan sa tabi ng Jordan na kaugnay ng Jerico, ngunit hindi nito tuwirang binibigkas ang pananaw na “sa tapat.” Mas ligtas ang “malapit sa Jerico,” na pinananatili ang ugnayang heograpiko nang hindi nagdaragdag ng isang partikular na pananaw.
  naturalness: Natural at marangal ang pangkalahatang register, ngunit mas idiomatiko ang “sa mga kapatagan” para sa ערבות at ang “malapit sa Jerico” para sa lokasyong kaugnay ng Jordan. Ang “na sinasabi” ay maaaring panatilihin bilang pormulang nag-uugnay sa susunod na pahayag.
  terminology: Tama at pare-pareho ang “Yahweh,” “Moises,” “Moab,” “Jordan,” at “Jerico.” Ang “mga steppe” sa talababa ay hindi gaanong likas sa modernong Filipino; “malalawak na kapatagan” ang mas natural na alternatibong paglalarawan.
