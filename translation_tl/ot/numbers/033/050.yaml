  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: tl
  text: At nagsalita si Yahweh kay Moises sa mga kapatagan ng Moab, sa tabi ng Jordan malapit sa Jerico,[a] na sinasabi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “mga kapatagan” na “malalawak na kapatagan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay; pinananatili ng “nagsalita” ang pagkakaiba ng דבר sa kasunod na אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, hindi pagpapalit dito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Natural na Tagalog para sa tagatanggap ng pagsasalita at karaniwang anyo ng pangalang Moses sa Filipino.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: sa kapatagan ng Moab
  rationale: Ang עֲרָבוֹת ay tumutukoy sa malalawak at bukás na lupa o steppe; natural at pamilyar sa Filipino ang “kapatagan.”
- source_word: עַל־יַרְדֵּן יְרֵחוֹ
  choice: sa tabi ng Jordan sa tapat ng Jerico
  rationale: Sa heograpikong pariralang ito, ang עַל ay nagpapahiwatig ng kinaroroonang malapit sa Jordan, at ang Jerico ang palatandaan sa kabilang panig; nililinaw ito nang hindi ginagawang nasa loob ng Jerico ang lugar.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili ang Hebreong pormulang nagpapakilala sa mismong pahayag na susunod sa kasunod na talata.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Jerico,” ang karaniwang anyong Filipino. Ang “sa tapat ng Jerico” ay natural na paglalahad ng heograpikong ugnayan ng kapatagan ng Moab, Jordan, at Jerico; pinanatili ang pormulang “na sinasabi” upang ipakita na nagpapatuloy ang pangungusap sa susunod na talata.
