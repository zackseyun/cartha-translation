  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: tl
  text: Ngunit kung hindi ninyo palalayasin mula sa inyong harapan ang mga naninirahan sa lupain, ang sinuman sa kanila na iiwan ninyo ay magiging mga pantusok sa inyong mga mata[a] at mga tinik sa inyong mga tagiliran[b], at pahihirapan[c] nila kayo sa lupaing tinitirhan ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tinik sa inyong mga mata.” Bihira ang salitang Hebreo at tumutukoy sa isang matalim na bagay na tumutusok.
    reason: lexical_alternative
  - marker: b
    text: O “mga kawit sa inyong mga tagiliran.” Ang dalawang magkaugnay na larawan ay kapuwa naglalarawan ng patuloy at masakit na pagpapahirap ng mga naninirahang maiiwan.
    reason: lexical_alternative
  - marker: c
    text: O “guguluhin nila kayo” o “aapihin nila kayo.” Maaaring tumukoy ang pandiwang Hebreo sa iba’t ibang anyo ng mapanlabang pagpapahirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: palalayasin
  rationale: Ang Hiphil ng ירשׁ dito ay tumutukoy sa pagpapaalis sa kasalukuyang mga naninirahan upang mawalan sila ng pag-aari o paninirahan sa lupain. Likas at malinaw sa modernong Tagalog ang “palalayasin.”
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ang mga naninirahan sa lupain
  rationale: Tuwirang inilalarawan ng participle ang mga taong naninirahan sa lupain; natural at marangal ang pariralang ito sa Tagalog.
- source_word: מִפְּנֵיכֶם
  choice: sa harap ninyo
  rationale: 'Pinananatili nito ang literal na larawang pangkalawakan ng Hebreong idyoma: inaalis sila mula sa harap o presensiya ng Israel habang sumusulong ito.'
- source_word: תּוֹתִירוּ
  choice: ang mga ititira ninyo
  rationale: Ipinahihiwatig ng Hiphil ng יתר ang pagpapaiwan o pag-iiwan ng nalabi. Hindi ginamit ang “ililigtas” o “kaaawaan” upang maiwasang magdagdag ng di-hayag na diwa ng awa.
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: mga tinik sa inyong mga mata
  rationale: Bihira ang pangngalan at tumutukoy sa matalim na bagay na tumutusok. Ang “tinik” ay malinaw at matingkad sa Tagalog, bagaman hindi nito lubos na naihihiwalay ang larawan sa kasunod na termino; nililinaw sa talababa ang alternatibong “mga pantusok.”
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: mga tinik sa inyong mga tagiliran
  rationale: Pinananatili ang matalim at masakit na metapora at ang bahagi ng katawan. Mas natural ang “tagiliran” kaysa “gilid” para sa larawang anatomikal.
- source_word: וְצָרֲרוּ
  choice: pahihirapan nila kayo
  rationale: Saklaw ng צרר ang pagkapoot, panggugulo, at pagdudulot ng hirap. Ang “pahihirapan” ay natural at hindi gaanong tiyak na tulad ng “aapihin,” kaya napapanatili ang lawak ng kahulugan.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: sa lupaing tinitirhan ninyo
  rationale: Bagaman literal na “sa ibabaw/ng lupain” ang עַל, likas sa Tagalog ang “sa lupain.” Ipinananatili ng “tinitirhan ninyo” ang nagpapatuloy at kasalukuyang diwa ng participle.
