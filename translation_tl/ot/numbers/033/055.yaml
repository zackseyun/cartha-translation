translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang matingkad na mga metapora ng katawan at ang Hebreong “sa harap ninyo,” habang gumamit ng natural na ayos ng pangungusap. Inilagay ang mga panandang talababa kaagad pagkatapos ng mga salitang tinutukoy ng mga ito.
