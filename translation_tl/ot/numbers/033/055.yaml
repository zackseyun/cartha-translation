revisions:
- from: Ngunit kung hindi ninyo palalayasin sa harap ninyo ang mga naninirahan sa lupain, ang mga ititira ninyo sa kanila ay magiging mga tinik sa inyong mga mata[a] at mga tinik sa inyong mga tagiliran[b], at pahihirapan nila kayo sa lupaing tinitirhan ninyo.[c]
  to: Ngunit kung hindi ninyo palalayasin mula sa inyong harapan ang mga naninirahan sa lupain, ang sinuman sa kanila na iiwan ninyo ay magiging mga pantusok sa inyong mga mata[a] at mga tinik sa inyong mga tagiliran[b], at pahihirapan[c] nila kayo sa lupaing tinitirhan ninyo.
  rationale: Nilinaw ang saklaw ng “mula sa kanila” sa pamamagitan ng “ang sinuman sa kanila na iiwan ninyo,” inalis ang posibleng maling pagbasa na may ititira para sa mga naninirahan, at pinag-iba ang dalawang magkaibang matutulis na larawan sa Hebreo. Inilipat din ang panandang [c] sa pandiwang tinutukoy nito. Walang idinagdag na doktrinal o interpretatibong pagpapaliwanag.
