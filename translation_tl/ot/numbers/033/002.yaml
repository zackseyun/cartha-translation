  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב מֹשֶׁ֜ה אֶת מוֹצָאֵי/הֶ֛ם לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וְ/אֵ֥לֶּה מַסְעֵי/הֶ֖ם לְ/מוֹצָאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: tl
  text: Itinala ni Moises ang mga pinanggalingan nila[b] ayon sa kanilang mga paglalakbay, sa utos ni Yahweh[a]. At ito ang kanilang mga paglalakbay ayon sa mga pinanggalingan nila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa bibig ni Yahweh,” isang idyomang nangangahulugang “sa utos ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “mga pag-alis nila” o “mga paglabas nila.”
    reason: lexical_alternative
  - marker: c
    text: 'Sinadyang pinagpalit sa talata ang ayos ng mga salita: “mga pinanggalingan nila ayon sa kanilang mga paglalakbay” … “mga paglalakbay ayon sa mga pinanggalingan nila.”'
    reason: literary_structure
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Itinala
  rationale: Ipinahahayag ng anyong pandiwa ang isang naganap na kilos sa salaysay. Ang “itinala” ay natural na nagsasaad na gumawa si Moises ng nakasulat na rekord.
- source_word: מוֹצָאֵיהֶם
  choice: mga pinanggalingan nila
  rationale: Maaaring tumukoy ang מוֹצָא sa paglabas, pag-alis, o lugar na pinagmulan. Sa talaan ng paglalakbay, malinaw at maikli ang “mga pinanggalingan,” at naipaparis ito sa “mga paglalakbay.”
- source_word: לְמַסְעֵיהֶם
  choice: ayon sa kanilang mga paglalakbay
  rationale: Ang מַסָּע ay paglalakbay o yugto ng paglalakbay mula sa isang pinagkampuhan. Ipinananatili ng “ayon sa” ang ugnayang ipinahahayag ng לְ at ang paralelismong Hebreo.
- source_word: עַל פִּי יְהוָה
  choice: sa utos ni Yahweh
  rationale: Ang literal na “sa bibig ni Yahweh” ay isang idyomang nangangahulugang ayon sa utos o tagubilin niya. Likas sa modernong Tagalog ang “sa utos ni Yahweh.”
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Ipinakikilala ng demonstratibo ang talaang kasunod. Ang “At ito ang” ay natural sa Tagalog at hindi kailangang magdagdag ng tahasang pandiwang pantulad.
- source_word: מַסְעֵיהֶם
  choice: kanilang mga paglalakbay
  rationale: Sapat na malawak at madaling maunawaan ang “mga paglalakbay,” samantalang maaari ring ipahiwatig ng salita ang magkakasunod na yugto ng paglalakbay.
- source_word: לְמוֹצָאֵיהֶם
  choice: ayon sa mga pinanggalingan nila
  rationale: 'Sinasalamin nito ang unang parirala at pinananatili ang sinadyang pagpapalitan ng ayos: mga pinanggalingan—mga paglalakbay, pagkatapos ay mga paglalakbay—mga pinanggalingan.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kung utos o pagkakasulat lamang ang ipinahahayag ng עַל־פִּי
  choice: sa utos ni Yahweh
  alternative: ayon sa salita ni Yahweh; sa bibig ni Yahweh
  rationale: Idyomatiko ang parirala at karaniwang nagsasaad ng awtorisadong utos o tagubilin. Hindi nito nililinaw nang higit sa teksto kung si Yahweh ang nagdikta ng bawat salita o nag-utos lamang na gawin ang tala.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “itinala” sa halip na mas literal na “isinulat” upang malinaw na talaan ng ruta ang konteksto. Pinanatili ang bahagyang pormal na paulit-ulit na estruktura upang huwag mawala ang sinadyang pagbabaligtad ng Hebreo.
