  yaml_path: translation/ot/numbers/033/022.yaml
  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: tl
  text: Umalis sila sa Risa at nagkampo sa Kehelata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Ang pandiwang נסע sa pormula ng talaan ng paglalakbay ay tumutukoy sa pag-alis mula sa isang himpilan upang magpatuloy sa susunod. Natural at malinaw sa modernong Tagalog ang “umalis sila.”
- source_word: מֵרִסָּה
  choice: sa Risa
  rationale: Pangalan ito ng lugar na may pang-ukol na מֵ, “mula sa.” Sa pandiwang “umalis,” likas sa Tagalog ang “umalis sa Risa,” kaya hindi na kailangan ang mas mabigat na “mula sa Risa.” Isinalin sa baybay-Tagalog ang pangalan.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa konteksto ng paglalakbay ay nangangahulugang humimpil o nagtayo ng kampo. Ang “nagkampo” ay tuwiran, pangkaraniwan, at nagpapanatili sa konkretong kilos.
- source_word: בִּקְהֵלָתָה
  choice: sa Kehelata
  rationale: Pangalan ito ng lugar na may pang-ukol na בְּ. Ang “sa” ang natural na pananda sa Tagalog para sa lokasyon ng pagkakampo. Isinalin sa baybay-Tagalog ang pangalan.
