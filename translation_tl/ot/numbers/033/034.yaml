  yaml_path: translation/ot/numbers/033/034.yaml
  text: They set out from Jotbathah and camped at Abronah.
translation:
  language: tl
  text: Umalis sila mula sa Jotbata at nagkampo sa Abrona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng mga paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang hintuan. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִיָּטְבָתָה
  choice: mula sa Jotbata
  rationale: Isinalin ang מִן bilang “mula sa,” at tinumbasan sa baybay-Filipino ang pangalang lugar na יָטְבָתָה bilang “Jotbata.”
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa ganitong konteksto ay nangangahulugang humimpil o nagtayo ng kampo. Ang “nagkampo” ay tuwiran, natural, at madaling maunawaan sa kasalukuyang Filipino.
- source_word: בְּעַבְרֹנָה
  choice: sa Abrona
  rationale: Lokasyon ang gamit ng בְּ, kaya ang natural na katumbas ay “sa.” Tinumbasan sa baybay-Filipino ang pangalang עַבְרֹנָה bilang “Abrona.”
