base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/014.yaml
  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: tl
  text: Umalis sila mula sa Alus at nagkampo sa Refidim, ngunit walang tubig doon na maiinom ng bayan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng paglalakbay sa ilang, ang נסע ay tumutukoy sa paglisan sa kampo upang magpatuloy sa paglalakbay. Likas at malinaw sa modernong Tagalog ang “umalis sila.”
- source_word: מֵאָלוּשׁ
  choice: mula sa Alus
  rationale: Pangalan ng lugar; isinalin sa baybay na angkop sa Tagalog sa halip na bigyan ng kahulugang leksikal.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ang karaniwang pandiwa para sa pagtatayo o pananatili sa kampo. Ang “nagkampo” ay natural at madaling maunawaan.
- source_word: בִּרְפִידִם
  choice: sa Refidim
  rationale: Pangalan ng lugar; tinumbasan sa karaniwang baybay-Tagalog. Ang “sa” ay angkop sa lokasyon ng pagkakampo.
- source_word: וְלֹא הָיָה שָׁם
  choice: ngunit walang ... doon
  rationale: 'Bagaman literal na pang-ugnay ang waw, may salungat na pangyayari rito: nagkampo sila sa lugar ngunit walang tubig. Pinananatili ng “ngunit” ang ugnayang ito nang hindi nagpapalabis.'
- source_word: מַיִם
  choice: tubig
  rationale: Karaniwang katumbas sa Tagalog.
- source_word: לָעָם
  choice: ng bayan
  rationale: Ang עָם ay tumutukoy sa sambayanang Israel bilang isang kabuuan. Ang “bayan” ay maikli, dignified, at likas sa kontekstong biblikal.
- source_word: לִשְׁתּוֹת
  choice: na maiinom
  rationale: Ipinapahayag nito ang layunin o gamit ng tubig para sa bayan. Natural sa Tagalog ang “walang tubig ... na maiinom.”
