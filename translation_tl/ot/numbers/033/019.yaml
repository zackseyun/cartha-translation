  text: וַ/יִּסְע֖וּ מֵ/רִתְמָ֑ה וַֽ/יַּחֲנ֖וּ בְּ/רִמֹּ֥ן פָּֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/019.yaml
  text: They set out from Rithmah and camped at Rimmon-perez[a].
translation:
  language: tl
  text: Umalis sila sa Ritma at nagkampo sa Rimon-peres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Naglakbay sila mula sa Ritma at humimpil sa Rimon-peres.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang ginagamit sa talaan ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pagliligpit ng kampo at pag-alis patungo sa susunod na himpilan. Likas at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מֵרִתְמָה
  choice: sa Ritma
  rationale: Ang prefiks na מִן ay nagsasaad ng pinagmulan. Sa Filipino, ang “umalis sa Ritma” ay likas na paraan upang ipahayag ang pag-alis mula sa isang lugar; ang pangalang Hebreo ay tinumbasan sa baybay na madaling bigkasin sa Filipino.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ang karaniwang pandiwa para sa pagtigil at pagtatayo ng kampo sa mga talaan ng paglalakbay. Ang “nagkampo” ay malinaw, kasalukuyan, at mas natural kaysa sa mas pormal na “humimpil.”
- source_word: בְּרִמֹּן פָּרֶץ
  choice: sa Rimon-peres
  rationale: Ang בְּ ay lokatibo rito at natural na isinasalin sa Filipino na “sa.” Pinanatili bilang isang tambalang pangalan ng lugar ang Rimon-peres, na may gitling upang katawanin ang dalawang bahagi ng pangalang Hebreo.
