  yaml_path: translation/ot/numbers/033/035.yaml
  text: They set out from Abronah and camped at Ezion-geber.
translation:
  language: tl
  text: Umalis sila sa Abrona at nagkampo sa Ezion-geber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang naglalahad ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang kampamento. Natural at malinaw sa modernong Tagalog ang “umalis sila.”
- source_word: מֵעַבְרֹנָה
  choice: sa Abrona
  rationale: Ipinahihiwatig ng prefiks na מֵ ang pinanggalingan; sa Tagalog, likas na kasama ng pandiwang “umalis” ang “sa” para sa lugar na pinanggalingan. Ang עַבְרֹנָה ay isinalin sa baybay na “Abrona” bilang pangalan ng lugar.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Sa konteksto ng talaan ng mga hintuan, ang חנה ay natural na isinasaling “nagkampo,” isang kasalukuyan at madaling maunawaang katumbas.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: sa Ezion-geber
  rationale: Ang בְּ ay nagsasaad dito ng lokasyon at natural na tinutumbasan ng “sa.” Ang עֶצְיוֹן גָּבֶר ay pangalan ng lugar, kaya tinumbasan ito sa anyong transliterado na “Ezion-geber.”
