base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/042.yaml
  text: They set out from Zalmonah and camped at Punon.
translation:
  language: tl
  text: Umalis sila sa Zalmonah at nagkampo sa Punon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang naglalahad ng paglalakbay sa ilang, ang נסע ay tumutukoy sa paglisan sa kampo upang magpatuloy. Likas at malinaw sa makabagong Tagalog ang “umalis sila.”
- source_word: מִצַּלְמֹנָה
  choice: sa Zalmonah
  rationale: Ang מִן ay nagpapahiwatig ng pinanggalingan; sa pandiwang “umalis,” likas itong ipinapahayag ng “sa.” Isinalin sa baybay-Latin ang pangalang צַלְמֹנָה bilang “Zalmonah.”
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa talaan ng mga hintuan ay nangangahulugang humimpil o nagtayo ng kampo. Ang “nagkampo” ay tuwiran, natural, at angkop sa kasalukuyang gamit.
- source_word: בְּפוּנֹן
  choice: sa Punon
  rationale: Ang בְּ ay tumutukoy sa kinaroroonan ng kampo at natural na isinasalin bilang “sa.” Isinalin sa baybay-Latin ang pangalang פּוּנֹן bilang “Punon.”
