  yaml_path: translation/ot/numbers/033/017.yaml
  text: They set out from Kibroth-hattaavah and camped at Hazeroth[a].
translation:
  language: tl
  text: Umalis sila sa Kibrot-hataava at nagkampo sa Hazerot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kibrot-hataava ay malamang na nangangahulugang “Mga Libingan ng Matinding Pagnanasa” o “Mga Libingan ng Pita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang naglilista ng mga hintuan sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang lugar. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: sa Kibrot-hataava
  rationale: Pangalan ito ng lugar, kaya isinalin sa pamamagitan ng transliterasyon sa halip na palitan ng kahulugan nito. Ang מִן ay likas na ipinahihiwatig ng “umalis ... sa” sa Filipino.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Sa konteksto ng paglalakbay, ang חנה ay natural na tumbasan ng “nagkampo,” isang kasalukuyan at madaling maunawaang salita.
- source_word: בַּחֲצֵרֹת
  choice: sa Hazerot
  rationale: Pangalan ito ng lugar at pinanatili sa transliterasyon. Ang בְּ ay natural na “sa” kapag tinutukoy ang lugar na pinagkampuhan.
