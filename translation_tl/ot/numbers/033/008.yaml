translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ilang” para sa מִדְבָּר, at isinakatutubong baybay ang mga pangalan bilang Hahirot, Etam, at Mara. Inayos ang mga marker upang lumitaw ang [a] sa Hahirot at [b] sa pariralang may tunay na leksikal na alternatibo.
