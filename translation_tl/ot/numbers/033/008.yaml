  text: וַ/יִּסְעוּ֙ מִ/פְּנֵ֣י הַֽ/חִירֹ֔ת וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֨לְכ֜וּ דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בְּ/מִדְבַּ֣ר אֵתָ֔ם וַֽ/יַּחֲנ֖וּ בְּ/מָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: tl
  text: Umalis sila mula sa tapat ng Hahirot[a] at dumaan sa gitna ng dagat patungo sa ilang, at naglakbay sila nang tatlong araw[b] sa ilang ng Etam at nagkampo sa Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “mula sa tapat ng Hahirot.” Mas karaniwang tinatawag sa Exodo ang lugar na “Pi-hahirot,” ngunit wala rito sa Bilang 33:8 ang bahaging “Pi-”; kaya pinanatili ang mas maikling anyo sa halip na iayon ang pangalan.'
    reason: alternative_reading
  - marker: b
    text: O “naglakbay sila sa isang tatlong-araw na paglalakbay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa talaan ng mga yugto ng paglalakbay, ang נסע ay tumutukoy sa paglisan sa kampamento upang magpatuloy. Likas at malinaw sa modernong Tagalog ang “umalis sila.”
- source_word: מִפְּנֵי הַחִירֹת
  choice: mula sa tapat ng Hahirot
  rationale: Pinananatili ang מִפְּנֵי bilang “mula sa tapat ng” at ang mas maikling pangalang Hahirot na nasa tekstong Hebreo, sa halip na itugma sa Pi-hahirot ng Exodo.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: dumaan sa gitna ng dagat
  rationale: Ipinahahayag ng עבר kasama ng בְתוֹךְ ang pagdaan sa mismong gitna ng dagat; hindi ito pinapahina bilang pagdaan lamang sa tabi nito.
- source_word: הַמִּדְבָּרָה
  choice: patungo sa ilang
  rationale: Ang directional he ay nagpapahiwatig ng kilos patungo sa ilang. Ang “patungo sa” ay nagpapanatili sa direksiyonal na diwa nang hindi sapilitang nilulutas kung gaano kalalim ang pagpasok.
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: naglakbay sila nang tatlong araw
  rationale: Natural na Tagalog ito para sa idyomang Hebreo na literal na tumutukoy sa isang paglalakbay na tatlong araw; pinananatili sa talababa ang alternatibong pag-unawa bilang layo ng tatlong araw na paglalakbay.
- source_word: בְמִדְבַּר אֵתָם
  choice: sa ilang ng Etam
  rationale: Karaniwang salin ng construct chain na may pangalang pantangi; isinasatitik sa Tagalog ang Etham bilang Etam.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: nagkampo sa Mara
  rationale: Ang חנה sa itineraryo ay “magkampo.” Ang “sa Mara” ay natural para sa pinangalanang hintuan.
