  yaml_path: translation/ot/numbers/033/013.yaml
  text: They set out from Dophkah and camped at Alush.
translation:
  language: tl
  text: Umalis sila sa Dofca at nagkampo sa Alus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Ang נסע sa pormulang naglilista ng mga yugto ng paglalakbay ay tumutukoy sa pag-alis mula sa isang kampamento upang magpatuloy sa paglalakbay. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִדָּפְקָה
  choice: sa Dofca
  rationale: Ang unlaping מִן ay nagpapahiwatig ng pinagmulan. Sa Filipino, likas na ipinahahayag ito ng “umalis ... sa.” Isinatinig ang pangalang pantangi mula sa Hebreo bilang “Dofca.”
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Ang חנה sa konteksto ng talaan ng paglalakbay ay nangangahulugang humimpil at nagtayo ng kampo. Ang “nagkampo” ay tuwiran at karaniwang gamit sa modernong Filipino.
- source_word: בְּאָלוּשׁ
  choice: sa Alus
  rationale: Ang בְּ ay nagmamarka ng lugar kung saan sila nagkampo. Ang “sa” ang natural na katumbas sa Filipino, at isinatinig ang pangalang pantangi bilang “Alus.”
theological_decisions: []
translation_notes:
  register: Maikli, natural, at marangal na modernong Filipino, na pinananatili ang payak at paulit-ulit na anyo ng Hebreong talaan ng mga hintuan. Ginamit ang mga anyong Dofca at Alus upang umayon sa bigkas at ortograpiyang Filipino.
