base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/051.yaml
  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: tl
  text: Magsalita ka sa mga Israelita[a] at sabihin mo sa kanila, ‘Kapag tatawid na kayo[b] sa Jordan papasok sa lupain ng Canaan,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “habang tumatawid kayo” o “malapit na kayong tumawid.” Ang anyong participle sa Hebreo ay maaaring magpahiwatig ng nalalapit na pagtawid.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֲלֵהֶם
  choice: Sabihin mo ...
  rationale: Bagaman dalawang pandiwa ang ginamit sa Hebreo (‘magsalita’ at ‘sabihin’), ang pagpapanatili sa pareho ay magiging paulit-ulit at hindi likas sa modernong Tagalog. Sapat na naihahatid ng ‘Sabihin mo’ ang utos na ipahayag sa kanila ang sumusunod.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang malinaw at likas na katawagan sa buong bayan sa modernong Tagalog; inilalagay sa talababa ang literal na ‘mga anak na lalaki ni Israel.’
- source_word: כִּי אַתֶּם עֹבְרִים
  choice: Kapag tatawid na kayo
  rationale: Sa konteksto, ipinakikilala ng כִּי ang nalalapit na kalagayang magiging batayan ng kasunod na tagubilin. Ipinahihiwatig ng panghalip at participle ang nalalapit o inaasahang pagtawid.
- source_word: אֶת הַיַּרְדֵּן
  choice: sa Jordan
  rationale: Karaniwang sapat sa Tagalog ang pangalang ‘Jordan’ upang tukuyin ang ilog; hindi kailangang idagdag ang ‘Ilog’ sa pangunahing teksto.
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: papasok sa lupain ng Canaan
  rationale: Pinananatili ng ‘lupain ng Canaan’ ang אֶרֶץ, at malinaw na ipinahahayag ng ‘papasok sa’ ang pagpasok sa nasabing lupain.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga Israelita’ kaysa sa literal ngunit hindi likas na ‘mga anak na lalaki ni Israel.’ Ang ‘Kapag tatawid na kayo’ ay nagpapanatili sa temporal at nalalapit na diwa nang hindi ginagawang tiyak ang higit sa ipinahihiwatig ng Hebreo.
