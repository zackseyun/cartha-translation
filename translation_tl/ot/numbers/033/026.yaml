  yaml_path: translation/ot/numbers/033/026.yaml
  text: They set out from Makheloth and camped at Tahath.
translation:
  language: tl
  text: Umalis sila sa Makhelot at nagkampo sa Tahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng mga paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang himpilan. Likas at malinaw sa makabagong Filipino ang “umalis sila.”
- source_word: מִמַּקְהֵלֹת
  choice: sa Makhelot
  rationale: Isinalin ang prefixed מִן bilang “sa” kasunod ng pandiwang “umalis,” na likas na nagpapahayag ng pinanggalingan sa Filipino. Ang pangalan ng lugar ay tinumbasan sa anyong Makhelot.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa konteksto ng itineraryo ay nangangahulugang humimpil o nagtayo ng kampo. Ang “nagkampo” ay tuwiran, natural, at karaniwang nauunawaan.
- source_word: בְּתָחַת
  choice: sa Tahat
  rationale: Ang prefixed בְּ ay likas na “sa” para sa lokasyon ng kampo. Pinanatili bilang pantanging pangalan ang Tahat sa halip na isalin ayon sa posibleng kahulugan ng kaparehong anyo bilang karaniwang salita.
