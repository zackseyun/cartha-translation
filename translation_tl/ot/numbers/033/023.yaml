lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa mga talaan ng paglalakbay, ang נסע ay tumutukoy sa pagliligpit ng kampo at pagpapatuloy ng paglalakbay. Ang “umalis” ay natural at malinaw sa modernong Filipino.
- source_word: מִקְּהֵלָתָה
  choice: mula sa Kehelata
  rationale: Ang מִן ay isinaling “mula sa,” at ang pangalan ng lugar ay tinumbasan ayon sa bigkas ng Hebreo.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa ganitong pormula ng paglalakbay ay nangangahulugang humimpil o magtayo ng kampo. Ang “nagkampo” ay tuwiran at karaniwang gamit sa modernong Filipino.
- source_word: בְּהַר
  choice: sa Bundok ng
  rationale: Ang הַר na sinusundan ng pangalan ng lugar ay natural na ipinahahayag bilang “Bundok ng …”; ang בְּ ay angkop na “sa” para sa lokasyon ng kampo.
- source_word: שָׁפֶר
  choice: Shefer
  rationale: Transliterasyon ito ng pangalang Hebreo ayon sa patinig ng tekstong Masoretiko; pinananatili sa talababa ang tradisyonal na alternatibong anyo.
