  text: They set out from Kehelathah and camped at Mount Shepher[a].
translation:
  language: tl
  text: Umalis sila mula sa Kehelata at nagkampo sa Bundok ng Shefer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bundok ng Shaper.”
