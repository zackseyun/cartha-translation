  yaml_path: translation/ot/numbers/033/015.yaml
  text: They set out from Rephidim and camped in the wilderness of Sinai.
translation:
  language: tl
  text: Umalis sila sa Refidim at nagkampo sa ilang ng Sinai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng paglalakbay, ang נסע ay tumutukoy sa pag-alis mula sa isang hintuan. Natural at malinaw sa modernong Tagalog ang “umalis sila.”
- source_word: מֵרְפִידִם
  choice: sa Refidim
  rationale: Ipinahihiwatig ng prefiks na מ ang pinanggalingan; sa Tagalog, likas na ipinapahayag ito ng “umalis ... sa Refidim.” Isinalin sa baybay-Tagalog ang pangalang-pook.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa mga talaan ng paglalakbay sa ilang ay nangangahulugang humimpil o magtayo ng kampo. Ang “nagkampo” ay tuwiran at karaniwang gamit sa modernong Tagalog.
- source_word: בְּמִדְבַּר סִינָי
  choice: sa ilang ng Sinai
  rationale: Ang מִדְבָּר ay malawak na lupaing ilang at hindi kailangang mangahulugang tigang na disyerto. Pinananatili ng “ilang ng Sinai” ang ugnayang konstruktong Hebreo nang hindi labis na tinutukoy ang uri ng lupain.
