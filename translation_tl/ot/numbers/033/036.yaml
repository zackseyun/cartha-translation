base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/036.yaml
  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: tl
  text: Umalis sila sa Ezion-geber at nagkampo sa ilang ng Zin—iyon ay[a] Kadesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na siyang Kadesh.” Ipinakikilala ng panghalip sa Hebreo ang lugar bilang Kadesh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa talaan ng mga paglalakbay, ang נסע ay tumutukoy sa paglisan sa kampo upang magpatuloy; natural at malinaw sa makabagong Filipino ang “umalis sila.”
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: sa Ezion-geber
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon; ipinahihiwatig ng “sa” matapos ang “umalis” ang pinanggalingan.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ay nangangahulugang humimpil o magtayo ng kampo; ang “nagkampo” ay tuwiran at karaniwang gamit sa modernong Filipino.
- source_word: בְמִדְבַּר צִן
  choice: sa ilang ng Zin
  rationale: Ang מִדְבָּר ay malawak at di-tiyak na ilang, hindi kinakailangang purong disyerto; pinananatili ng “ilang” ang heograpikong lawak ng salitang Hebreo.
- source_word: הִוא
  choice: iyon ay
  rationale: Ginagamit ang panghalip bilang panandang nagpapakilala o nagpapaliwanag sa naunang lokasyon; natural na katumbas ang “iyon ay.”
- source_word: קָדֵשׁ
  choice: Kadesh
  rationale: Pangalan ito ng lugar at kaya transliterado; tinutukoy nito nang mas tiyak ang naunang lokasyon.
