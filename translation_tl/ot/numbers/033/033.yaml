  yaml_path: translation/ot/numbers/033/033.yaml
  text: They set out from Hor-haggidgad and camped at Jotbathah.
translation:
  language: tl
  text: Umalis sila sa Hor-hagidgad at nagkampo sa Jotbata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang ginagamit sa talaan ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang himpilan. Likas at malinaw sa modernong Tagalog ang “umalis sila.”
- source_word: מֵחֹר הַגִּדְגָּד
  choice: sa Hor-hagidgad
  rationale: Ang מִן ay nagpapahayag ng pinanggalingan; sapat na itong ipinahihiwatig ng “umalis ... sa.” Isinatinig ang pangalan ng lugar at pinanatili ang ugnayan ng dalawang bahagi sa pamamagitan ng gitling.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Sa konteksto ng paglalakbay, ang חנה ay nangangahulugang humimpil o magtayo ng kampo. Ang “nagkampo” ay tuwiran at pangkaraniwan sa modernong Filipino.
- source_word: בְּיָטְבָתָה
  choice: sa Jotbata
  rationale: Ang בְּ ay panandang lokatibo rito. Natural sa Tagalog ang “sa” para sa lugar na pinagkampuhan, at isinatinig ang pangalan bilang Jotbata.
theological_decisions: []
translation_notes:
  register: Maikli, dignificado, at natural ang pangungusap, alinsunod sa paulit-ulit na pormula ng talaan ng mga himpilan. Ginamit ang mga karaniwang pandiwang “umalis” at “nagkampo,” habang pinanatiling transliterado ang mga pangalan ng lugar.
