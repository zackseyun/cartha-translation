  text: וְ/הוֹרַשְׁתֶּ֥ם אֶת הָ/אָ֖רֶץ וִֽ/ישַׁבְתֶּם בָּ֑/הּ כִּ֥י לָ/כֶ֛ם נָתַ֥תִּי אֶת הָ/אָ֖רֶץ לָ/רֶ֥שֶׁת אֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: tl
  text: Ang lupain ay inyong ariin at doon kayo manirahan, sapagkat ibinigay ko sa inyo ang lupain upang ariin ninyo ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “manahin ninyo ito.” Ang pandiwang Hebreo na ירשׁ ay maaaring mangahulugang magmana, gayundin ang umangkin o magmay-ari, lalo na sa konteksto ng lupaing ipinangako sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: Ang lupain ay inyong ariin
  rationale: Ang Hiphil ng ירשׁ ay maaaring tumukoy sa pagpapalayas o pag-aalis ng dating may hawak at sa pag-angkin ng pag-aari. Dahil 'ang lupain' ang tuwirang layon, likas sa Tagalog ang 'ariin' at hindi nito ipinahihiwatig na ang lupain mismo ang pinalalayas.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Ang 'lupain' ay malinaw at marangal na katumbas ng אֶרֶץ sa konteksto ng teritoryong ipinangako.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: at doon kayo manirahan
  rationale: Ipinahahayag ng ישׁב ang paninirahan o pagtira sa isang lugar. Ang 'manirahan' ay natural sa modernong Tagalog at ang 'doon' ay malinaw na tumutukoy sa lupain.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos; ang 'sapagkat' ay malinaw at may dignidad nang hindi makaluma.
- source_word: לָכֶם
  choice: sa inyo
  rationale: Tinutukoy nito ang mga tumanggap ng kaloob ng Diyos at likas itong kabit ng 'ibinigay ko.'
- source_word: נָתַתִּי
  choice: ibinigay ko
  rationale: Ang Hebreong perfect ay naglalahad sa pagbibigay bilang ganap na kilos na batayan ng utos. Sa Tagalog, sapat na ipinahahayag ito ng aspektong naganap na 'ibinigay ko.'
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: upang ariin ninyo ito
  rationale: Ipinahahayag ng infinitive ang layunin ng pagkakaloob. Ang 'upang ariin' ay maikli, natural, at nagpapanatili sa diwa ng aktuwal na pag-angkin sa lupain.
theological_decisions:
- issue: Pagpapakahulugan sa ירשׁ sa konteksto ng ipinangakong lupain
  choice: ariin
  alternative: manahin
  rationale: Binibigyang-diin ng agarang konteksto ang aktuwal na pag-angkin at paninirahan sa lupaing kaloob ng Diyos. Gayunman, maaaring taglayin ng ירשׁ ang diwa ng pagtanggap bilang mana sa konteksto ng tipan, kaya pinananatili ang 'manahin' sa talababa bilang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang 'lupain,' 'ariin,' at 'manirahan' upang maging malinaw sa karaniwang mambabasa habang pinananatili ang pag-uulit at lohika ng Hebreo.
