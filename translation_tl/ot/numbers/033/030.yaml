  yaml_path: translation/ot/numbers/033/030.yaml
  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: tl
  text: Umalis sila sa Hasmona at nagkampo sa Moserot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang himpilan. Natural at malinaw sa modernong Tagalog ang “umalis sila.”
- source_word: מֵחַשְׁמֹנָה
  choice: sa Hasmona
  rationale: Ang מֵ ay nagpapahiwatig ng pinanggalingan; sa Tagalog, likas na ipinahahayag ito ng “umalis ... sa.” Ang pangalan ng lugar na חַשְׁמֹנָה ay tinumbasan sa baybay na “Hasmona.”
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa konteksto ng paglalakbay ay nangangahulugang humimpil o magtayo ng kampo. Ang “nagkampo” ay karaniwan, konkreto, at madaling maunawaan.
- source_word: בְּמֹסֵרוֹת
  choice: sa Moserot
  rationale: Ang בְ ay tumutukoy sa lugar na hinimpilan at natural na isinasalin na “sa.” Ang pangalang מֹסֵרוֹת ay tinumbasan sa baybay na “Moserot.”
theological_decisions: []
translation_notes:
  register: Maikli at tuwirang modernong Filipino, na pinananatili ang paulit-ulit na estilong pormula ng talaan ng paglalakbay. Ginamit ang “nagkampo” sa halip na mas pormal na “humimpil” upang maging malinaw sa ordinaryong mambabasa.
