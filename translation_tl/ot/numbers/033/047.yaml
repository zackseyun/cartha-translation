  text: וַ/יִּסְע֖וּ מֵ/עַלְמֹ֣ן דִּבְלָתָ֑יְמָ/ה וַֽ/יַּחֲנ֛וּ בְּ/הָרֵ֥י הָ/עֲבָרִ֖ים לִ/פְנֵ֥י נְבֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: tl
  text: Umalis sila mula sa Almon-Diblataim at nagkampo sa kabundukan ng Abarim, sa tapat ng Nebo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa harap ng Nebo.” Ipinahihiwatig ng salitang Hebreo ang kaugnayang panlunan ngunit hindi nito tiyak na itinatakda ang eksaktong direksiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang talaan ng paglalakbay sa Bilang 33, ang נסע ay tumutukoy sa paglisan sa kampo upang magpatuloy sa paglalakbay. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: mula sa Almon-Diblataim
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon; pinanatili ang gitling upang katawanin ang iisang tambalang toponimo.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ang karaniwang pandiwa sa talatang itineraryo para sa pagtatayo o pananatili sa kampo. Ang “nagkampo” ay natural at kasalukuyang Filipino.
- source_word: בְּהָרֵי
  choice: sa kabundukan ng
  rationale: Ang maramihang anyong construct ng הַר ay tumutukoy sa bulubunduking rehiyon. Mas natural sa Filipino ang “sa kabundukan ng” kaysa literal na “sa mga bundok ng.”
- source_word: הָעֲבָרִים
  choice: Abarim
  rationale: Gumaganap ito bilang pantanging heograpikong pangalan, kaya transliterasyon ang ginamit sa halip na isalin ang kaugnay na kahulugang “mga dako sa kabila.”
- source_word: לִפְנֵי
  choice: sa tapat ng
  rationale: Ipinapahayag ng לִפְנֵי ang relasyong panlunan na “sa harap ng” o “katapat ng” nang hindi tiyak ang eksaktong direksiyon. Natural sa Filipino ang “sa tapat ng,” habang pinananatili sa talababa ang tunay na saklaw ng kahulugan.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Pantanging pangalan ng lugar kaya transliterado.
