  yaml_path: translation/ot/numbers/033/039.yaml
  text: And Aaron was one hundred twenty-three years old when he died on Mount Hor.
translation:
  language: tl
  text: At si Aaron ay 123 taong gulang nang mamatay siya sa Bundok Hor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: At si Aaron
  rationale: Ang וְ ay likas na isinaling “At” bilang pagpapatuloy ng salaysay; pinanatili ang karaniwang anyong Filipino ng pangalang Aaron.
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: ay 123 taong gulang
  rationale: Ang idyomang Hebreo na בֶּן + bilang + שָׁנָה ay nagsasaad ng edad. Ang “123 taong gulang” ang natural at malinaw na katumbas sa modernong Filipino.
- source_word: בְּ/מֹת/וֹ
  choice: nang mamatay siya
  rationale: Ang בְּ na kasama ng anyong “kamatayan” at hulaping tumutukoy kay Aaron ay temporal dito; natural itong ipahayag bilang “nang mamatay siya.”
- source_word: בְּ/הֹר הָ/הָר
  choice: sa Bundok Hor
  rationale: Ang הֹר הָהָר ay pangalan ng pook na Mount Hor. Ang “sa Bundok Hor” ang karaniwang ayos sa Filipino at hindi ipinipilit kung ang diwa ay eksaktong “sa ibabaw” o mas pangkalahatang “sa lugar ng” bundok.
