  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: tl
  text: Umalis sila mula sa Sukkot at nagkampo sa Etam, na nasa gilid ng ilang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hangganan ng ilang.”
    reason: Pinananatili ang leksikal na posibilidad na ang קצה ay tumutukoy sa hangganan sa halip na pangkalahatang gilid.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa talaan ng mga paglalakbay, ang נסע ay tumutukoy sa pag-alis upang magpatuloy sa paglalakbay. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִסֻּכֹּת
  choice: mula sa Sukkot
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon mula sa Hebreo sa halip na isalin ang kahulugan nito.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ay nangangahulugang humimpil o magtayo ng kampo. Ang “nagkampo” ang tuwiran at karaniwang katumbas sa modernong Filipino.
- source_word: בְאֵתָם
  choice: sa Etam
  rationale: Pangalan ito ng lugar na may pang-ukol na ב. Ang “sa Etam” ay natural sa Filipino para sa lokasyong pinagkampuhan.
- source_word: אֲשֶׁר
  choice: na
  rationale: Ipinakikilala nito ang sugnay na naglalarawan sa lokasyon ng Etam.
- source_word: בִּקְצֵה
  choice: nasa gilid ng
  rationale: Ang קצה ay maaaring tumukoy sa dulo, gilid, o hangganan. Ang “gilid” ay angkop sa heograpikong konteksto nang hindi labis na nagpapahiwatig ng pormal na hangganan.
- source_word: הַמִּדְבָּר
  choice: ilang
  rationale: Ang מִדְבָּר ay karaniwang tumutukoy sa di-nilinang at kakaunting-taong lupain, hindi lamang sa mabuhanging disyerto. Ang “ilang” ay maikli at biblikal ngunit nauunawaan pa rin sa konteksto.
