  yaml_path: translation/ot/numbers/033/018.yaml
  text: They set out from Hazeroth and camped at Rithmah.
translation:
  language: tl
  text: Umalis sila sa Hazerot at nagkampo sa Ritma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang naglalahad ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis o pagbuwag ng kampo upang magpatuloy. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מֵחֲצֵרֹת
  choice: sa Hazerot
  rationale: Ang מִן ay nagsasaad ng pinanggalingan; sa Filipino, likas na ipinahahayag ito ng “umalis ... sa.” Isinatinig ang pangalang חֲצֵרֹת bilang “Hazerot.”
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Ang חנה ang karaniwang pandiwa para sa pagtatayo o pananatili sa kampo. Ang “nagkampo” ay tuwiran, kasalukuyan, at madaling maunawaan.
- source_word: בְּרִתְמָה
  choice: sa Ritma
  rationale: Ang בְּ ay panandang lokatibo rito. Natural sa Filipino ang “sa” para sa lugar ng pagkakampo; isinatinig ang רִתְמָה bilang “Ritma.”
theological_decisions: []
translation_notes:
  register: Maikli, dignified, at natural na modernong Filipino, na pinananatili ang payak na pormula ng talaan ng paglalakbay. Walang kailangang talababa sa talatang ito.
