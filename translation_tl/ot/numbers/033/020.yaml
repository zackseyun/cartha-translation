  text: They set out from Rimmon-perez and camped at Libnah.
translation:
  language: tl
  text: Umalis sila sa Rimon-Peres at nagkampo sa Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng paglalakbay, ang נסע ay tumutukoy sa pag-alis mula sa isang hintuan. Natural at malinaw sa makabagong Filipino ang “umalis sila.”
- source_word: מֵרִמֹּן פָּרֶץ
  choice: sa Rimon-Peres
  rationale: Ang מִן ay nagsasaad ng pinanggalingan; sa Filipino, likas na ginagamit ang “sa” kasunod ng pandiwang “umalis.” Isinalin sa baybay-Filipino ang tambalang pangalan ng lugar.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa konteksto ng paglalakbay ay nangangahulugang huminto at nagtayo ng kampo. Ang “nagkampo” ay tuwiran at karaniwang gamit sa modernong Filipino.
- source_word: בְּלִבְנָה
  choice: sa Libna
  rationale: Ang בְּ ay tumutukoy sa lugar na pinagkampuhan. Ang “sa” ang natural na katumbas sa Filipino, at ang pangalan ay isina-Filipinong baybay.
