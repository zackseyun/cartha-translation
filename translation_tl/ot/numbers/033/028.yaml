  yaml_path: translation/ot/numbers/033/028.yaml
  text: They set out from Terah and camped at Mithkah.
translation:
  language: tl
  text: Umalis sila sa Terah at nagkampo sa Mitka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng mga paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang himpilan. Likas at malinaw sa makabagong Tagalog ang “umalis” at pinananatili nito ang sunod-sunod na galaw ng salaysay.
- source_word: מִתָּרַח
  choice: sa Terah
  rationale: Ang unlaping מִן ay nagmamarka ng pinanggalingan. Isinalin ito sa natural na pariralang Tagalog na “umalis ... sa Terah,” at pinanatili ang Terah bilang transliteradong pangalan ng lugar.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa konteksto ng paglalakbay ay nangangahulugang huminto at nagtayo ng kampo. Ang “nagkampo” ay tuwiran, natural, at madaling maunawaan sa modernong Tagalog.
- source_word: בְּמִתְקָה
  choice: sa Mitka
  rationale: Ang בְּ ay nagmamarka ng lokasyon. Ang “sa Mitka” ang natural na anyo sa Tagalog para sa lugar na pinagkampuhan; ang pangalan ay tinransliterado ayon sa bigkas ng Hebreo.
theological_decisions: []
translation_notes:
  register: Maikli at dignified ang modernong Filipino Tagalog, alinsunod sa paulit-ulit na pormula ng itineraryo. Ginamit ang “nagkampo” sa halip na mas pormal o makalumang “humimpil,” upang manatiling kongkreto at madaling maunawaan.
