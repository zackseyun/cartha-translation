base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: tl
  text: Umalis sila mula sa mga bundok ng Abarim at nagkampo sa kapatagan ng Moab, sa tabi ng Jordan sa Jerico[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga lupaing steppe ng Moab.” Ang salitang Hebreo ay maaaring tumukoy sa lupaing steppe o sa kapatagan.
    reason: lexical_alternative
  - marker: b
    text: O “sa tabi ng Jordan, sa tapat ng Jerico.” Itinuturing ng ilang salin na mas tiyak na ipinapahiwatig ng huling parirala ang lugar sa kabilang panig na katapat ng Jerico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa mga talaan ng paglalakbay, ang נסע ay tumutukoy sa pagkalas ng kampo at pagpunta sa susunod na hintuan. Natural sa modernong Filipino ang “umalis” sa ganitong konteksto.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: mula sa mga bundok ng Abarim
  rationale: Ang הָרֵי ay pangmaramihang construct ng “bundok/burol.” Pinananatili ang Abarim bilang pangalang pantangi.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa mga itineraryo sa ilang ay nangangahulugang magtayo o manatili sa kampo. Ang “nagkampo” ay malinaw at kasalukuyang gamit.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: sa kapatagan ng Moab
  rationale: Ang עַרְבֹת ay maaaring tumukoy sa malawak na kapatagan o lupaing steppe; ang “kapatagan” ang pinakanatural at madaling maunawaan.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: sa tabi ng Jordan sa Jerico
  rationale: Ang עַל kaugnay ng ilog ay maaaring magpahiwatig ng lokasyong nasa tabi o kahabaan nito. Hindi tahasang sinasabi ng Hebreo ang “tapat,” kaya pinananatili sa talababa ang mas tiyak na alternatibong iyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal ang ginamit. Pinanatili ang mga pangalang Abarim, Moab, Jordan, at Jerico sa karaniwang anyong Filipino. Ang “nagkampo” ay mas kasalukuyan kaysa “nagkubli” o isang mas pormal na katumbas ng “encamped.”
