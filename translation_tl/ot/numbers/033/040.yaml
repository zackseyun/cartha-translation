translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “nabalitaan … ang pagdating” upang maiwasan ang di-likas na “narinig nang dumating,” habang pinananatili ang payak na diwa ng Hebreo. Inilagay ang bawat talababa sa salitang o pariralang aktuwal nitong ipinapaliwanag.
