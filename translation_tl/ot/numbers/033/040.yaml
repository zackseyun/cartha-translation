base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: tl
  text: Nabalitaan ng Cananeong hari ng Arad, na naninirahan sa Negev[b] sa lupain ng Canaan, ang pagdating ng mga anak na lalaki ni Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na lalaki ni Israel”; maaari ring isalin na “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Negev” ay maaari ring isalin na “timog” o “katimugang rehiyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nabalitaan
  rationale: Ang Qal ng שׁמע ay pangunahing nangangahulugang “narinig.” Sa Filipino, mas likas ang “nabalitaan” kapag ang narinig ay ang pagdating ng isang pangkat; hindi nito ipinapalagay kung sino ang naghatid ng balita.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: ang Cananeong hari ng Arad
  rationale: Pinananatili nito ang pagkakakilanlan niyang Cananeo at ang kaniyang katungkulan bilang hari ng Arad sa likas na ayos ng modernong Filipino.
- source_word: וְהוּא יֹשֵׁב
  choice: na naninirahan
  rationale: Ang panghalip at participle ay nagbibigay ng impormasyong naglalarawan sa hari; ang sugnay na “na naninirahan” ang likas na katumbas nito sa Filipino.
- source_word: בַּנֶּגֶב
  choice: sa Negev
  rationale: Ginamit ang kinikilalang pangalang heograpiko sa halip na pangkalahatang “timog,” habang inilalahad sa talababa ang posibleng kahulugan nito.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang אֶרֶץ, “lupain,” at ang heograpikong diin ng Hebreo.
- source_word: בְּבֹא
  choice: ang pagdating
  rationale: Ang ב na kasama ng infinitive construct ng בוא ay tumutukoy sa pagkakataon ng pagdating. Ginawang pangngalang parirala sa Filipino upang maging buo at natural ang pahayag na may “nabalitaan,” nang hindi nagdaragdag ng patutunguhang hindi binanggit.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo at nananatiling malinaw sa Filipino; inilalahad sa talababa ang mas idyomatikong alternatibong “mga Israelita.”
