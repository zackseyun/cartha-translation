  register: Modernong Filipino na payak ngunit marangal. Pinanatiling transliterado ang mga pangalan ng lugar, at ginamit ang natural na pormulang “umalis… at nagkampo” para sa paulit-ulit na talaan ng paglalakbay sa Bilang 33.
