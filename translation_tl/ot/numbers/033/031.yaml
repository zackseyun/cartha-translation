  yaml_path: translation/ot/numbers/033/031.yaml
  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: tl
  text: Umalis sila sa Moserot at nagkampo sa Bene-Jaakan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong Bene-Jaakan ay literal na “mga anak ni Jaakan,” ngunit ginagamit dito bilang pangalan ng lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang naglalahad ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis ng kampo upang magpatuloy sa paglalakbay. Natural at malinaw sa makabagong Filipino ang “umalis sila.”
- source_word: מִמֹּסֵרֹות
  choice: sa Moserot
  rationale: Ang מִן ay nagpapahayag ng pinanggalingan at natural na isinasalin dito bilang “sa” kasunod ng “umalis.” Ang Moserot ay transliterasyon ng pangalang Hebreo na מֹסֵרוֹת.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Sa konteksto ng talaan ng paglalakbay, ang חנה ay nangangahulugang magtayo o manatili sa kampo. Ang “nagkampo” ay tuwiran at karaniwang gamit sa modernong Filipino.
- source_word: בִּבְנֵי יַעֲקָן
  choice: sa Bene-Jaakan
  rationale: Bagaman literal na “mga anak ni Jaakan,” gumaganap dito ang parirala bilang pangalan ng lugar. Ang בְּ ay natural na isinasaling “sa” para sa lugar na pinagkampuhan.
