  yaml_path: translation/ot/numbers/033/043.yaml
  text: They set out from Punon and camped at Oboth.
translation:
  language: tl
  text: Umalis sila sa Punon at nagkampo sa Obot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa paulit-ulit na pormula ng talaan ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa kampo upang magpatuloy sa paglalakbay. Ang “umalis” ay natural at malinaw sa modernong Tagalog.
- source_word: מִפּוּנֹן
  choice: sa Punon
  rationale: Ang מִן ay nagmamarka ng pinanggalingan. Sa Tagalog, natural na ipinahahayag ang pag-alis mula sa isang lugar sa anyong “umalis sa Punon.” Isinatinig ang pangalang-pook.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa konteksto ng paglalakbay ay nangangahulugang humimpil o magtayo ng kampo. Ang “nagkampo” ay tuwiran at karaniwang gamit sa modernong Tagalog.
- source_word: בְּאֹבֹת
  choice: sa Obot
  rationale: Ang בְּ ay tumutukoy sa lokasyon ng kampamento at likas na isinasalin na “sa” sa Tagalog. Isinatinig ang pangalang אֹבֹת bilang “Obot,” kasunod ng anyong Hebreo.
