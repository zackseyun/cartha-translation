base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/032.yaml
  text: They set out from Bene-jaakan and camped at Hor-haggidgad[a].
translation:
  language: tl
  text: Umalis sila sa Bene-jaakan[a] at nagkampo sa Hor-haggidgad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na pangalan ng lugar ang Hebreong Bene-jaakan, bagaman literal itong nangangahulugang “mga anak ni Jaakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa paulit-ulit na pormula ng talaan ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang himpilan. Likas at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִבְּנֵי יַעֲקָן
  choice: sa Bene-jaakan
  rationale: Gumaganap dito ang בְּנֵי יַעֲקָן bilang pangalan ng lugar, kaya tinumbasan ito sa pamamagitan ng transliterasyon sa halip na isaling literal. Ang “sa” ang natural na katumbas ng מִן pagkatapos ng pandiwang “umalis.”
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ay karaniwang pandiwa sa pormula ng itineraryo para sa pagtatayo o pananatili sa kampo. Ang “nagkampo” ay kasalukuyan, malinaw, at likas sa Filipino.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: sa Hor-haggidgad
  rationale: Pangalan ito ng lugar, kaya pinanatili sa transliterasyon. Ang בְּ ay nagsasaad ng lokasyon at natural na isinalin na “sa.”
