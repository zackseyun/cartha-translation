base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: tl
  text: Umalis sila mula sa Dagat na Pula[a] at nagkampo sa ilang ng Sin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dagat ng mga Tambo.” Ang Hebreong pangalan na yam suf ay nakaugaliang isalin na “Dagat na Pula,” ngunit maaari itong unawain nang mas literal bilang “Dagat ng mga Tambo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Sin” ay pangalan ng isang rehiyon sa ilang; hindi ito tumutukoy sa kasalanan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Ang נסע sa paulit-ulit na pormula ng talaan ng paglalakbay sa Bilang 33 ay tumutukoy sa pag-alis mula sa isang pinagkampuhan. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִיַּם סוּף
  choice: mula sa Dagat na Pula
  rationale: Ang יַם־סוּף ay nakaugaliang pangalan sa Filipino na “Dagat na Pula.” Dahil maaari rin itong unawain nang mas literal bilang “Dagat ng mga Tambo,” pinanatili ang alternatibo sa talababa.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ang karaniwang pandiwa para sa pagtatayo o pananatili sa kampo sa mga salaysay ng paglalakbay sa ilang. Ang “nagkampo” ay tuwiran at kasalukuyang gamit.
- source_word: בְּמִדְבַּר סִין
  choice: sa ilang ng Sin
  rationale: Ang מִדְבָּר ay lupaing ilang, at ang סִין ay pangalang pantangi ng rehiyon. Pinanatiling transliterado ang “Sin” at nilinaw sa talababa upang hindi mapagkamalang tumutukoy sa kasalanan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang likas na pormulang “Umalis sila… at nagkampo…” para sa itineraryo, habang pinanatili ang tradisyonal na heograpikong pangalan at ang tunay na leksikal na alternatibo sa talababa.
