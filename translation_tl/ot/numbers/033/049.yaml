base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: tl
  text: Nagkampo sila sa tabi ng Jordan, mula sa Bet-jesimot hanggang sa Abel-sitim, sa kapatagan ng Moab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: Nagkampo sila
  rationale: Ang wayyiqtol ng חנה ay nagsasalaysay ng kasunod na yugto ng paglalakbay; natural at malinaw sa makabagong Tagalog ang “nagkampo.”
- source_word: עַל הַיַּרְדֵּן
  choice: sa tabi ng Jordan
  rationale: Kapag ilog ang tinutukoy, maaaring ipahiwatig ng עַל ang lokasyong malapit o nasa tabi nito, hindi literal na nasa ibabaw nito.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: mula sa Bet-jesimot
  rationale: Ang מִן ay nagmamarka sa simula ng saklaw ng kampamento; tinumbasan sa paraang angkop sa bigkas at baybay ng Tagalog ang pangalan ng lugar.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: hanggang sa Abel-sitim
  rationale: Ang עַד ay nagmamarka sa dulong hangganan ng saklaw; malinaw itong naipahahayag ng “hanggang sa.”
- source_word: בְּעַרְבֹת מוֹאָב
  choice: sa kapatagan ng Moab
  rationale: Ang עֲרָבוֹת ay tumutukoy sa patag at tuyong rehiyong kapatagan o steppe; “kapatagan” ang natural at madaling maunawaang salin dito.
