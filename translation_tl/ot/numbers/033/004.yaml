  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: tl
  text: habang inililibing ng mga Ehipsiyo ang lahat ng panganay na pinatay ni Yahweh sa gitna nila; at sa kanilang mga diyos ay nagsagawa si Yahweh ng mga hatol.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: habang inililibing ng mga Ehipsiyo
  rationale: Ang waw na sinusundan ng pangngalan at participle ay nagbibigay ng kasabay na pangyayaring nasa likuran; natural itong ipahayag sa Tagalog sa pamamagitan ng “habang.”
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם כָּל בְּכוֹר
  choice: ang lahat ng panganay sa kanila na pinatay ni Yahweh
  rationale: Ang כָּל בְּכוֹר ang paglilinaw sa mga inililibing. Ang “sa kanila” ay nagpapanatili sa saklaw ng בָּהֶם nang hindi ginagawang tahasang pag-aari ng bawat tagapaglibing ang mga namatay. Sa konteksto, ang הִכָּה ay nakamamatay kaya natural ang “pinatay,” bagaman hindi nito pinananatili ang literal na larawang “hinampas.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: וּבֵאלֹהֵיהֶם
  choice: At ... sa kanilang mga diyos
  rationale: Ang בְּ sa pariralang ito ay nagsasaad ng pinatutungkulan ng mga hatol; natural sa Tagalog ang “sa kanilang mga diyos.”
- source_word: עָשָׂה ... שְׁפָטִים
  choice: naglapat ... ng mga hatol
  rationale: Ang idyoma ay tumutukoy sa pagsasagawa ng mga gawa ng paghatol. Ang “naglapat ng mga hatol” ay malinaw, marangal, at kasalukuyang Tagalog.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang taglay ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng אֱלֹהֵיהֶם
  choice: kanilang mga diyos
  alternative: kanilang mga diyus-diyosan o mga pinuno
  rationale: Pinananatili ang tuwirang pahayag ng teksto tungkol sa mga diyos ng Ehipto at hindi ito muling binibigyang-kahulugan bilang mga pinuno o nililimitahan sa paliwanag na “diyus-diyosan.”
- issue: Ugnayan ng hatol at mga diyos ng Ehipto
  choice: naglapat ... ng mga hatol sa kanilang mga diyos
  alternative: hinatulan ang kanilang mga diyos
  rationale: Pinananatili ang maramihang שְׁפָטִים at ang bigat ng idyomang Hebreo nang hindi dinaragdagan ang teksto ng paliwanag tungkol sa likas o katayuan ng mga diyos na iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Ehipsiyo” at “panganay,” at iniwasan ang makaluma o labis na literal na ayos ng pangungusap.
