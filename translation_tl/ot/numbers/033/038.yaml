  to: Umakyat si Aaron na pari sa Bundok Hor ayon sa utos ni Yahweh[a], at namatay siya roon noong ikaapatnapung taon mula nang lumabas ang mga Israelita sa lupain ng Ehipto, sa ikalimang buwan, sa unang araw ng buwan.
