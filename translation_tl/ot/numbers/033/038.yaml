source:
  edition: WLC
  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: tl
  text: Umakyat si Aaron na pari sa Bundok Hor ayon sa utos ni Yahweh[a], at namatay siya roon noong ikaapatnapung taon mula nang lumabas ang mga Israelita sa lupain ng Ehipto, sa ikalimang buwan, sa unang araw ng buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa salita ni Yahweh”; literal, “sa bibig ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Umakyat
  rationale: Likas at tuwirang salin ng עלה na pinananatili ang diwang paakyat.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Pinananatili ang katungkulan ni Aaron bilang appositional na paglalarawan sa natural na Tagalog.
- source_word: אֶל הֹר הָהָר
  choice: sa Bundok Hor
  rationale: Karaniwang anyong Filipino para sa kinikilalang pangalang heograpiko na Mount Hor.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang idyomang Hebreo ay literal na 'sa bibig ni Yahweh' ngunit sa konteksto ay tumutukoy sa pagkilos alinsunod sa kaniyang ipinahayag na utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: וַיָּמָת שָׁם
  choice: at doon siya namatay
  rationale: Tuwirang inililipat ang pandiwa at ang lokatibong pang-abay sa natural na ayos ng Tagalog.
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: noong ikaapatnapung taon
  rationale: Natural na ordinal na anyo para sa pormulang Hebreo sa pagtukoy ng taon.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: mula nang lumabas ang mga Israelita
  rationale: Malinaw na ipinahahayag ang paglabas bilang panimulang punto ng pagbibilang ng taon.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Sa konteksto, tumutukoy ito sa bayan bilang kabuuan, hindi lamang sa mga lalaking anak.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang pagbanggit sa 'lupain' at ang pinanggalingan ng paglabas.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: sa ikalimang buwan
  rationale: Tuwirang salin ng pormulang pangkalendaryo.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: sa unang araw ... ng buwan
  rationale: Malinaw at natural na salin ng Hebreong petsa na literal na tumutukoy sa una ng buwan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ginagamit ng talata ang Tetragrammaton bilang personal na pangalan; pinananatili ito sa anyong Yahweh nang hindi pinapalitan ng titulo.
- issue: Kahulugan ng עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  alternative: ayon sa salita ni Yahweh; literal, sa bibig ni Yahweh
  rationale: Ang parirala ay idyomang nagsasaad ng pagsunod sa ipinahayag na kapahintulutan o utos. Inilalagay sa talababa ang alternatibo at literal na anyo upang mapanatili ang saklaw ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Hinati sa dalawang pangungusap ang mahabang Hebreong pangungusap para sa likas na daloy, nang hindi binabago ang ugnayang kronolohikal. Ginamit ang “Ehipto” at “Bundok Hor” bilang karaniwang anyong Filipino.
