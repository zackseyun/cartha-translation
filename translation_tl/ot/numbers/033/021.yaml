  text: They set out from Libnah and camped at Rissah.
translation:
  language: tl
  text: Umalis sila mula sa Libna at nagkampo sa Risa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng mga paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang kampamento upang magpatuloy sa paglalakbay. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִלִּבְנָה
  choice: mula sa Libna
  rationale: Ang מִן ay nagpapahayag ng pinagmulan, at ang לִבְנָה ay pangalan ng lugar; kaya isinalin ang pang-ukol at tinumbasan sa baybay-Filipino ang pangalan.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ang karaniwang pandiwa para sa pagtatayo o pananatili sa kampo. Ang “nagkampo” ay tuwiran at pangkasalukuyang Filipino.
- source_word: בְּרִסָּה
  choice: sa Risa
  rationale: Ang בְּ ay panandang panlunan. Ang “sa” ang natural na katumbas nito sa Filipino, at ang רִסָּה ay tinumbasan bilang “Risa.”
