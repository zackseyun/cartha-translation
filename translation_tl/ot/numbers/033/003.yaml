  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: tl
  text: Umalis sila mula sa Rameses sa unang buwan, noong ikalabinlimang araw ng unang buwan. Kinabukasan ng Paskuwa, lumabas ang mga anak ni Israel[a] na may nakataas na kamay[b], sa paningin ng lahat ng mga Ehipsiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang “may nakataas na kamay” ay isang idyomang Hebreo na nangangahulugang hayagan at buong tapang, sa lantad na paningin ng lahat.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa talaan ng mga paglalakbay, ang נסע ay tumutukoy sa pag-alis o paghayo mula sa isang himpilan. Natural sa modernong Tagalog ang “umalis” at malinaw ang direksiyon dahil sa “mula sa Rameses.”
- source_word: מֵרַעְמְסֵס
  choice: mula sa Rameses
  rationale: Pinananatili ang pangalang-pook sa karaniwang anyong madaling makilala sa Filipino.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: sa unang buwan
  rationale: Tuwirang salin ng pariralang temporal at hindi nagdaragdag ng pangalan ng buwang wala sa teksto.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  choice: nang ikalabinlimang araw ng unang buwan
  rationale: Natural na paraan sa Tagalog ng pagtukoy sa petsa habang pinananatili ang pag-uulit ng “unang buwan” sa Hebreo.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: Kinabukasan ng Paskuwa
  rationale: Ang מָחֳרַת ay ang kasunod na araw; malinaw at maikli ang “kinabukasan.” Ang “Paskuwa” ang kinikilalang tawag sa kapistahan sa biblikal na Filipino.
- source_word: יָצְאוּ
  choice: lumabas
  rationale: Pinananatili nito ang karaniwang kahulugan ng יצא at ang mahalagang motibo ng paglabas ng Israel mula sa Ehipto.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo at natural ding nauunawaan sa Tagalog bilang mga inapo o sambayanan ni Israel.
- source_word: בְּיָד רָמָה
  choice: nang may kamay na nakataas
  rationale: Pinananatili ang kongkretong idyomang Hebreo sa malinaw na anyong Tagalog; ipinapaliwanag sa talababa ang diwa nitong hayagan at buong tapang.
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: sa paningin ng lahat ng taga-Ehipto
  rationale: Natural ngunit malapit sa larawan ng Hebreo; binibigyang-diin nitong lantad sa mga taga-Ehipto ang pag-alis.
theological_decisions:
- issue: Paglalarawan sa בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang pamilyang larawan ng Hebreo nang hindi itinatanggi ang kolektibong kahulugan nito; ibinibigay sa talababa ang mas idyomatikong katumbas.
- issue: Pagpapakahulugan sa בְיָד רָמָה
  choice: nang may kamay na nakataas
  alternative: nang buong tapang / nang matagumpay / nang may paghamon
  rationale: May saklaw ang idyoma na hayagan, buong tapang, at posibleng may paghamon. Ang pagpapanatili sa larawan at pagpapaliwanag nito sa talababa ay umiiwas sa pagpili ng isang mas makitid na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “unang buwan,” ang pamilyang katawagang “mga anak ni Israel,” at ang kongkretong idyoma ng nakataas na kamay; ginamit ang mga talababa upang linawin ang kolektibong tawag at idyomatikong diwa.
