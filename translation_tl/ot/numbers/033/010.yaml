  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: tl
  text: Umalis sila sa Elim at nagkampo sa tabi ng Dagat na Pula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dagat ng mga Tambo.” Ang pangalang Hebreo na Yam Suf ay tradisyonal na isinasaling “Dagat na Pula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng mga hintuan sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang himpilan. Natural at malinaw sa modernong Tagalog ang “umalis sila.”
- source_word: מֵאֵילִם
  choice: sa Elim
  rationale: Ang מִן ay nagpapahiwatig ng pinanggalingan; sa Tagalog, ang “umalis ... sa Elim” ay likas na pagpapahayag. Isinalin sa titik na “Elim” ang pangalan ng lugar.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ang karaniwang pandiwa para sa pagtatayo o pananatili sa kampo. Ang “nagkampo” ay kasalukuyan, malinaw, at angkop sa paulit-ulit na pormula ng salaysay.
- source_word: עַל
  choice: sa tabi ng
  rationale: Bagaman madalas mangahulugang “sa ibabaw ng” ang עַל, sa konteksto ng pagkakampo malapit sa anyong-tubig ay lokatibo itong nangangahulugang katabi o nasa baybay nito.
- source_word: יַם סוּף
  choice: Dagat na Pula
  rationale: Ito ang tradisyonal at madaling makilalang tawag sa Yam Suf. Pinanatili sa talababa ang leksikal na posibilidad na “Dagat ng mga Tambo.”
