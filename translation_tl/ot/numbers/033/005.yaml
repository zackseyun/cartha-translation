  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: tl
  text: Umalis ang mga anak ni Israel[a] mula sa Rameses[b] at nagkampo sa Sucot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga Israelita.” Literal na Hebreo: “mga anak na lalaki ni Israel”; ang parirala ay karaniwang katawagan para sa mga Israelita.'
