lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis
  rationale: Sa talaan ng mga yugto ng paglalakbay, ang נסע ay tumutukoy sa pag-alis sa pinagkampuhan upang magpatuloy. Natural at malinaw sa modernong Filipino ang “umalis.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang literal na anyong Hebreo na “mga anak ni Israel,” sa halip na gawing pangkalahatang katawagang “mga Israelita.”
- source_word: מֵרַעְמְסֵס
  choice: mula sa Rameses
  rationale: Ang unlaping מִן ay nagsasaad ng pinanggalingan. Ginamit ang nakaugaliang baybay na “Rameses” para sa pangalan ng lugar.
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Ang חנה ay nangangahulugang humimpil o magkampo. Ang “nagkampo” ay tuwiran at karaniwan sa modernong Filipino.
- source_word: בְּסֻכֹּת
  choice: sa Sucot
  rationale: Ang בְּ ay nagsasaad ng lokasyon. Isinalin sa “sa,” at isinalin-titik ang pangalan ng lugar bilang “Sucot.”
