base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: tl
  text: Umalis sila sa Kades[a] at nagkampo sa Bundok Hor[b], sa gilid ng lupain ng Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Kades.” Pinalalawak ito sa ilang salin bilang “Kades-barnea” batay sa mas malawak na konteksto, ngunit ang mas maikling pangalan ang nakasulat dito.
    reason: alternative_reading
  - marker: b
    text: Literal sa Hebreo, “sa Hor, ang bundok”; kinaugaliang isalin bilang “Bundok Hor.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang kampamento. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִקָּדֵשׁ
  choice: mula sa Kades
  rationale: Kades lamang ang nakasulat sa Hebreo; hindi ito pinalawak bilang Kades-barnea.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ay karaniwang pandiwa para sa pagtatayo o pananatili sa kampo. Ang “nagkampo” ay tuwiran at natural.
- source_word: בְּהֹר הָהָר
  choice: sa Bundok Hor
  rationale: Literal na “sa Hor, ang bundok,” ngunit ang kinagawiang anyo ng pangalan ng lugar sa Filipino ay “Bundok Hor.”
- source_word: בִּקְצֵה
  choice: sa gilid ng
  rationale: Ang קצה ay maaaring mangahulugang dulo, gilid, o hangganan. Pinananatili ng “sa gilid ng” ang malawak na diwang heograpikal nang hindi ipinapalagay na tiyak na pampolitikang hangganan ito.
- source_word: אֶרֶץ אֱדוֹם
  choice: lupain ng Edom
  rationale: Tuwiran at natural na katumbas ng אֶרֶץ אֱדוֹם sa salaysay na heograpikal.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na pormula ng paglalakbay na “umalis… at nagkampo,” habang pinanatili ang mga pangalan ng lugar at ang di-tiyak na heograpikal na saklaw ng “gilid.”
