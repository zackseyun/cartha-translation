  yaml_path: translation/ot/numbers/033/027.yaml
  text: They set out from Tahath and camped at Terah.
translation:
  language: tl
  text: Umalis sila sa Tahat at nagkampo sa Tera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang naglalahad ng paglalakbay sa ilang, ang נסע ay tumutukoy sa paglisan mula sa kampo upang magpatuloy sa paglalakbay. Likas at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִתָּחַת
  choice: sa Tahat
  rationale: Ang מִן ay nagpapahayag ng pinanggalingan at natural na isinasalin dito bilang “sa” kasunod ng pandiwang “umalis.” Ang תָּחַת ay tinumbasan bilang “Tahat,” ayon sa anyong Hebreo ng pangalan.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa mga talaan ng paglalakbay ay nangangahulugang magtayo o manatili sa kampo. Ang “nagkampo” ay kasalukuyan, malinaw, at di-arkaiskong Filipino.
- source_word: בְּתָרַח
  choice: sa Tera
  rationale: Ang בְּ ay tumutukoy sa lokasyon ng kampo at natural na tinutumbasan ng “sa.” Ang תָּרַח ay isinatinig bilang “Tera,” na angkop sa pagbabaybay at pagbigkas sa Filipino.
