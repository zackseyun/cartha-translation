  yaml_path: translation/ot/numbers/033/046.yaml
  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: tl
  text: Umalis sila mula sa Dibon-Gad at nagkampo sa Almon-Diblataim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa paulit-ulit na talaan ng paglalakbay sa Bilang 33, ang נסע ay tumutukoy sa pagliligpit ng kampo at pagpapatuloy ng paglalakbay. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִדִּיבֹן גָּד
  choice: mula sa Dibon-Gad
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon. Pinananatili ng gitling ang tambalang anyo ng toponimo, samantalang ang מִן ay isinaling “mula sa.”
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa pormula ng paglalakbay ay nangangahulugang humimpil o nagtayo ng kampo. Ang “nagkampo” ay tuwiran at karaniwan sa modernong Filipino.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: sa Almon-Diblataim
  rationale: Pangalan ito ng lugar at isinalin sa pamamagitan ng transliterasyon. Ang pang-ukol na בְּ ay natural na “sa” sa kontekstong kinaroroonan ng kampo; ang hulaping patungo sa lugar ay hindi kailangang hiwalay na ipahayag dahil ang pandiwang “nagkampo sa” ay malinaw na nagsasaad ng destinasyon at lokasyon.
