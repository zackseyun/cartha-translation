translation:
  language: tl
  text: 'At mangyayari: ang binalak kong gawin sa kanila[a] ay gagawin ko sa inyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kung paano ko binalak na gawin sa kanila, gayon ko rin gagawin sa inyo.”'
    reason: Pinananatili ng alternatibo ang mas pormal na paghahambing na maaaring ipahayag ng כַּאֲשֶׁר, samantalang mas natural sa pangunahing teksto ang “ang ... ay ...”.
lexical_decisions:
- source_word: וְהָיָה
  choice: At mangyayari na
  rationale: Ipinahahayag ng pariralang ito ang tiyak na kahihinatnan ng naunang babala, habang pinananatili ang panghinaharap na diwa ng Hebreo.
- source_word: כַּאֲשֶׁר
  choice: kung ano ang
  rationale: Sa kayariang ito, inuugnay ng כַּאֲשֶׁר ang gagawin sa kanila sa gagawin sa Israel. Likas sa modernong Tagalog ang “kung ano ang ... ay ...” at malinaw nitong naipapakita ang pagtutumbas ng dalawang kilos.
- source_word: דִּמִּיתִי
  choice: binalak ko
  rationale: Sa piel at sa kontekstong ito, tumutukoy ang pandiwa sa nilayon o ipinasiyang gawin, hindi lamang sa isang iniisip. Ang “binalak” ay malinaw at hindi nagdaragdag ng detalye.
- source_word: לַעֲשׂוֹת
  choice: gawin
  rationale: Pinananatili ng payak na “gawin” ang malawak na kahulugan ng עשה at hinahayaang ang konteksto ang magpahiwatig na ang kilos ay kaparusahan.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Pinananatili nito ang di-tuwirang layon ng Hebreo nang hindi tahasang idinaragdag ang “laban sa kanila,” bagaman maparusahan ang kilos ayon sa konteksto.
- source_word: אֶעֱשֶׂה
  choice: gagawin ko
  rationale: Ang pag-uulit ng “gawin” ay nagpapanatili sa matindi at tuwirang paralelismo ng babala.
- source_word: לָכֶם
  choice: sa inyo
  rationale: Tapat ito sa payak na anyo ng Hebreo; sapat na ang konteksto upang ipakita ang maparusang puwersa nito.
theological_decisions:
- issue: Lakas ng babala tungkol sa hatol
  choice: Tuwirang babala ng Diyos na ang binalak niyang gawin sa mga naninirahan sa lupain ay gagawin din niya sa Israel kapag hindi nila sinunod ang utos.
  alternative: Isang mas mahinang pahayag lamang ng likas na kahihinatnan, na hindi binibigyang-diin ang pagkilos ng Diyos.
  rationale: Hayagang unang panauhan ang אֶעֱשֶׂה (“gagawin ko”), kaya dapat mapanatili ang Diyos bilang kumikilos at ang taimtim na bigat ng babala nang walang idinaragdag na uri ng kaparusahan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Ginamit ang “binalak” sa halip na mas mabigat na “nilayon,” at pinanatili ang pag-uulit ng “gawin” upang maihatid ang paralelismo at tindi ng Hebreo.
