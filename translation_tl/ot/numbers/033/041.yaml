  text: They set out from Mount Hor and camped at Zalmonah.
translation:
  language: tl
  text: Umalis sila mula sa Bundok Hor at nagkampo sa Zalmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa mga talaan ng paglalakbay, ang נסע ay tumutukoy sa pag-alis ng kampo upang magpatuloy sa susunod na hintuan. Natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מֵהֹר הָהָר
  choice: mula sa Bundok Hor
  rationale: Ang הֹר הָהָר ay kinikilalang pangalan ng pook na Mount Hor; ang “Bundok Hor” ang natural na anyo nito sa Filipino.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ay nangangahulugang humimpil o magtayo ng kampo. Pinananatili ng “nagkampo” ang kongkretong diwa sa pangkaraniwang modernong Filipino.
- source_word: בְּצַלְמֹנָה
  choice: sa Zalmona
  rationale: Ang בְּ ay lokatibo rito at tumutukoy sa pook na pinagkampuhan; idiomatiko sa Filipino ang “sa Zalmona.”
