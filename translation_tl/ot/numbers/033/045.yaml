base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/045.yaml
  text: They set out from Iyyim and camped at Dibon-gad[a][b].
translation:
  language: tl
  text: Umalis sila mula sa Iyim at nagkampo sa Dibon-gad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng paglalakbay sa Mga Bilang, ang נסע ay tumutukoy sa pag-alis mula sa isang hintuan. Natural at malinaw sa makabagong Filipino ang “umalis sila.”
- source_word: מֵעִיִּים
  choice: mula sa Iyim
  rationale: Isinalin ang pang-ukol na מֵ bilang “mula sa,” at tinumbasan ang pangalan ng lugar na עִיִּים ng “Iyim,” ayon sa baybay na madaling basahin sa Filipino.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa mga tala ng paglalakbay ay nangangahulugang humimpil o magtayo ng kampo. Ang “nagkampo” ay tuwiran, natural, at angkop sa konteksto.
- source_word: בְּדִיבֹן גָּד
  choice: sa Dibon-gad
  rationale: Ang בְּ bago ang pangalan ng lugar ay natural na “sa” sa Filipino. Pinanatili ang Dibon-gad bilang isang pangalan ng lugar sa halip na ipakahulugang pariralang genitibo.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino; pinanatiling maikli ang anyo ng talang panglakbay at isinalin ang mga pangalan ng lugar sa paraang madaling basahin sa Filipino.
