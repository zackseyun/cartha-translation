  yaml_path: translation/ot/numbers/033/044.yaml
  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: tl
  text: Umalis sila mula sa Obot at nagkampo sa Iye-Abarim[a], sa hangganan ng Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Iyye-Abarim.” Posibleng kaugnay ang mga bahagi ng pangalang Hebreo sa “mga guho” at sa “Abarim” o “mga pook sa kabila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang naglalahad ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pagliligpit ng kampo at pagpapatuloy ng paglalakbay. Likas at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מֵאֹבֹת
  choice: mula sa Obot
  rationale: Ang מֵ ay nagsasaad ng pinagmulan, at ang אֹבֹת ay pangalan ng lugar. Isinalin sa karaniwang anyong Tagalog na “Obot.”
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ang karaniwang pandiwa para sa pagtigil at pagtatayo ng kampo. Ang “nagkampo” ay natural, tuwiran, at madaling maunawaan.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: sa Iye-Abarim
  rationale: Gumaganap ang parirala bilang pangalan ng lugar sa talaan ng paglalakbay. Pinanatili itong transliterasyon upang hindi gawing tiyak ang posibleng etimolohikong kahulugang “mga guho ng Abarim.”
- source_word: בִּגְבוּל
  choice: sa hangganan ng
  rationale: Maaaring mangahulugan ang גְּבוּל ng hangganan o nasasakupan. Sa kontekstong ito, pinakatumpak ang “sa hangganan ng,” na hindi nagpapahiwatig na nasa kaloob-looban sila ng teritoryo ng Moab.
- source_word: מוֹאָב
  choice: Moab
  rationale: Ginamit ang nakaugaliang anyo sa Tagalog para sa pangalan ng lugar at bayan.
