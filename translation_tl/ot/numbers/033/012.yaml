  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: tl
  text: Umalis sila mula sa ilang ng Sin[a] at nagkampo sa Dofka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Sin” dito ay pangalan ng isang rehiyon sa ilang.
