lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng paglalakbay, ang נסע ay tumutukoy sa pag-alis ng kampo at pagpapatuloy ng paglalakbay. Natural at malinaw sa makabagong Filipino ang “umalis sila.”
- source_word: מִמִּדְבַּר
  choice: mula sa ilang ng
  rationale: Ang מִדְבָּר ay lupaing ilang o disyerto. Pinili ang “ilang” dahil maikli, natural, at angkop sa nakatalang pangalan ng rehiyon.
- source_word: סִין
  choice: Sin
  rationale: Pangalan ito ng isang rehiyon sa ilang, kaya tinumbasan sa pamamagitan ng transliterasyon at hindi isinalin bilang karaniwang pangngalan.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ang karaniwang pandiwa para sa pagtatayo o pananatili sa kampo. Ang “nagkampo” ay tuwiran at madaling maunawaan.
- source_word: בְּדָפְקָה
  choice: sa Dofka
  rationale: Ang בְּ ay panandang-lunan dito. Ang “sa” ang natural na katumbas sa Filipino, at ang Dofka ay transliterasyon ng pangalan ng lugar.
