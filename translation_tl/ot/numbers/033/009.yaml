id: NUM.33.9
reference: Numbers 33:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: tl
  text: Umalis sila sa Mara at dumating sa Elim. Sa Elim ay may labindalawang bukal ng tubig at pitumpung puno ng palma, at doon sila nagkampo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Ang נסע sa pormula ng talaan ng paglalakbay ay tumutukoy sa pag-alis ng kampo upang magpatuloy; natural at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִמָּרָה
  choice: sa Mara
  rationale: Pangalan ng lugar na tinumbasan sa karaniwang anyong Filipino na “Mara”; ang “sa” kasunod ng “umalis” ay likas na nagpapahayag ng pinanggalingan.
- source_word: וַיָּבֹאוּ
  choice: at dumating
  rationale: Ang בוא ay maaaring mangahulugang pumunta, dumating, o pumasok; sa konteksto ng paglalakbay, malinaw at natural ang “dumating.”
- source_word: אֵילִמָה / בְאֵילִם
  choice: sa Elim / Sa Elim
  rationale: Ang unang anyo ay patungong Elim at ang ikalawa ay lokasyon sa Elim; sa Filipino, kapuwa likas na maipahayag ng “sa,” at nililinaw ng pandiwa ang ugnayan.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: labindalawang
  rationale: Karaniwang anyong Filipino ng bilang kapag tuwirang naglalarawan sa pangngalan.
- source_word: עֵינֹת מַיִם
  choice: bukal ng tubig
  rationale: Ang עַיִן dito ay likas na bukal o pinagmumulan ng tubig, hindi balong hinukay.
- source_word: וְשִׁבְעִים
  choice: at pitumpung
  rationale: Tuwirang salin ng bilang, gamit ang pang-angkop na angkop bago ang pangngalan.
- source_word: תְּמָרִים
  choice: puno ng palma
  rationale: Tumutukoy sa mga punong palma, malamang ay date palm, ngunit hindi kailangang idagdag ang mas tiyak na uri na hindi tahasang sinabi ng teksto.
- source_word: וַיַּחֲנוּ שָׁם
  choice: at doon sila nagkampo
  rationale: Ang חנה sa mga talaan ng paglalakbay ay nangangahulugang humimpil o magkampo; “nagkampo” ay natural at madaling maunawaan sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang payak na estilong itineraryo at ang pag-uulit ng “Elim,” nang hindi nagdaragdag ng paliwanag o teolohikal na interpretasyon.
