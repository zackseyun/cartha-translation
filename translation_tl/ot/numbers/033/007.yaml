  text: וַ/יִּסְעוּ֙ מֵֽ/אֵתָ֔ם וַ/יָּ֨שָׁב֙ עַל פִּ֣י הַחִירֹ֔ת אֲשֶׁ֥ר עַל פְּנֵ֖י בַּ֣עַל צְפ֑וֹן וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֥י מִגְדֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: tl
  text: Umalis sila mula sa Etam at bumalik[a] patungong Pi-Hahirot, na nasa tapat ng Baal-Zefon, at nagkampo sila sa harap ng Migdol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lumiko pabalik.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbabalik o sa pagbaligtad ng direksiyon; dito, maaaring inilalarawan nito ang pagbabago ng ruta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng talaan ng paglalakbay, ang נסע ay tumutukoy sa pag-alis ng kampo at pagpapatuloy ng paglalakbay. Natural at malinaw sa makabagong Filipino ang “umalis sila.”
- source_word: מֵאֵתָם
  choice: mula sa Etam
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa karaniwang transliterasyong Filipino sa halip na isalin.
- source_word: וַיָּשָׁב
  choice: at bumalik
  rationale: Ang שׁוב ay maaaring mangahulugang bumalik o magbalik ng direksiyon. Pinananatili ng “bumalik” ang pangunahing diwa at ang tunay na kalabuan kung sila ay bumalik sa dating lugar o nagbago lamang ng ruta.
- source_word: עַל־פִּי הַחִירֹת
  choice: patungong Pi-Hahirot
  rationale: Bagaman עַל ang pang-ukol, sa konteksto ng itineraryo ay ipinahihiwatig ng parirala ang direksiyon o destinasyon. Ang “patungong” ay malinaw at natural sa Filipino.
- source_word: אֲשֶׁר עַל־פְּנֵי בַּעַל צְפֹן
  choice: na nasa tapat ng Baal-Zefon
  rationale: Ang עַל־פְּנֵי ay nagsasaad dito ng ugnayang heograpiko, gaya ng nasa harap o katapat. Ang “nasa tapat” ay natural at hindi labis na tiyak.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo sila
  rationale: Tuwirang ipinapahayag ng חנה ang pagkakampo. Karaniwan at malinaw sa modernong Filipino ang “nagkampo.”
- source_word: לִפְנֵי מִגְדֹּל
  choice: sa harap ng Migdol
  rationale: Ang לִפְנֵי ay tumutukoy sa kinalalagyang nasa harap ng isang lugar. Pinanatili ang Migdol bilang pangalang pantangi.
theological_decisions: []
