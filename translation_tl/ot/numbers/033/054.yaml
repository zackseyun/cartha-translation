translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “angkan” para sa yunit sa loob ng lipi, “lipi” para sa tribong pinagmulan, at “mana” upang mapanatili ang mahalagang bokabularyo ng lupang ipinagkaloob at ipinamamahagi.
