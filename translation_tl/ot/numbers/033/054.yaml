base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: tl
  text: Ipamahagi ninyo bilang mana ang lupain sa pamamagitan ng palabunutan, ayon sa inyong mga angkan. Sa pangkat na mas marami ang bilang, palalakihin ninyo ang bahaging mana nito; at sa pangkat na mas kaunti ang bilang, liliitan ninyo ang bahaging mana nito. Ang lugar na ilalaan ng palabunot para sa sinuman ay magiging kanya.[a] Tatanggapin ninyo ang inyong mga mana ayon sa mga lipi ng inyong mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Kung saan mapunta para sa kanya ang palabunot, doon iyon magiging kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  choice: Paghahati-hatian ninyo bilang mana
  rationale: Ipinapahayag ng hitpael ng נחל sa kontekstong ito ang pamamahagi at pagtanggap ng lupain bilang mana. Pinagsasama ng parirala ang diwang distributibo at ang mahalagang tema ng mana.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Ang “lupain” ay natural at tiyak na tawag sa teritoryong ipamamahagi sa Israel.
- source_word: בְּגוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Ang גורל ay tumutukoy sa paraang ginagamit upang magtakda ng bahagi sa pamamagitan ng palabunutan.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: ayon sa inyong mga angkan
  rationale: Sa konteksto ng senso at pamamahagi ng lupain, ang מִשְׁפָּחָה ay mas malawak kaysa sa karaniwang sambahayan; “angkan” ang angkop na yunit sa loob ng lipi.
- source_word: לָרַב
  choice: Sa pangkat na mas marami
  rationale: Ang paghahambing ay batay sa dami ng mga tao sa pangkat, hindi sa katayuan o laki ng lupain nito.
- source_word: תַּרְבּוּ אֶת נַחֲלָתוֹ
  choice: palalakihin ninyo ang mana nito
  rationale: Pinananatili ng “mana” ang tipang diwa ng נַחֲלָה, samantalang malinaw na ipinahihiwatig ng “palalakihin” ang mas malaking bahaging lupain.
- source_word: וְלַמְעַט
  choice: at sa pangkat na mas kaunti
  rationale: Ito ang tuwirang katapat ng pangkat na mas marami at tumutukoy sa pangkat na mas kaunti ang bilang.
- source_word: תַּמְעִיט אֶת נַחֲלָתוֹ
  choice: liliitan ninyo ang mana nito
  rationale: Ang “liliitan” ay natural na katapat ng “palalakihin” at tumpak na nagpapahayag ng hiphil ng מעט.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל
  choice: Kung saan mapunta ang palabunot ng bawat isa
  rationale: Natural nitong ipinapahayag sa Filipino ang idyomang literal na nagsasabing “lumabas” ang palabunot patungo sa isang lugar, habang pinananatili ang kaugnayan nito sa bawat tatanggap.
- source_word: לוֹ יִהְיֶה
  choice: iyon ang magiging kanya
  rationale: Maikli at natural itong pahayag ng pag-aari na resulta ng palabunutan.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: ayon sa mga lipi ng inyong mga ninuno
  rationale: Ang מַטּוֹת ay mga lipi, at ipinahihiwatig ng אֲבֹתֵיכֶם ang pinagmulang angkan. Natural sa modernong Filipino ang “mga ninuno” nang hindi nawawala ang diwa ng lahing pinagmulan.
- source_word: תִּתְנֶחָלוּ
  choice: Paghahati-hatian ninyo ang lupain bilang mana
  rationale: Inuulit nito ang tema ng pamamahagi at pagtanggap ng lupain bilang mana, at malinaw na iniuugnay ang ayos ng pamamahagi sa mga liping minana mula sa mga ninuno.
