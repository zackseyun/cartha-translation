base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: tl
  text: At palalayasin ninyo mula sa inyong harapan ang lahat ng naninirahan sa lupain, at sisirain ninyo ang lahat ng kanilang mga bagay na may larawan[a]. Wawasakin ninyo ang lahat ng kanilang mga imaheng hinulma sa metal[b], at gigibain ninyo ang lahat ng kanilang mga sambahan sa matataas na lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga larawang inukit.” Ang salitang Hebreo ay tumutukoy sa mga representasyong may larawan, ngunit pinagtatalunan ang eksaktong anyo o materyal ng mga ito.
    reason: lexical_alternative
  - marker: b
    text: O “kanilang mga imaheng yari sa tunaw na metal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: palalayasin ninyo
  rationale: Ang Hiphil ng ירשׁ dito ay tumutukoy sa pagpapaalis o pag-aalis sa kasalukuyang mga naninirahan sa lupain. Natural at tuwiran sa modernong Filipino ang “palalayasin.”
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: lahat ng naninirahan sa lupain
  rationale: Tumpak nitong inilalarawan ang mga taong nakatira sa lupain at mas natural sa Filipino kaysa sa mas pormal na “mga nananahan.”
- source_word: מִפְּנֵיכֶם
  choice: sa inyong harapan
  rationale: Pinananatili nito ang larawan ng idyomang Hebreo habang malinaw na ipinahihiwatig ang pagpapaalis sa kanilang dinaraanan o kinaroroonan.
- source_word: וְאִבַּדְתֶּם / תְּאַבֵּדוּ
  choice: sisirain ninyo / wawasakin ninyo
  rationale: Parehong nagsasaad ng lubusang pagsira. Ang bahagyang pagkakaiba ng pandiwa sa Filipino ay natural at nagpapanatili ng mariing pag-uulit ng Hebreo.
- source_word: מַשְׂכִּיֹּתָם
  choice: kanilang mga batong may larawang inukit
  rationale: Malamang na tumutukoy sa mga representasyong inukit o nilagyan ng larawan, kadalasa’y sa bato, ngunit hindi ganap na tiyak ang anyo o materyal; kaya may talababa.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: kanilang mga imaheng hinulma sa metal
  rationale: Malinaw na ipinapahayag na ang mga larawan ay ginawa sa pamamagitan ng paghuhulma ng tunaw na metal, nang hindi gumagamit ng hindi gaanong natural na tradisyonal na parirala.
- source_word: בָּמֹתָם
  choice: kanilang mga sambahan sa matataas na lugar
  rationale: Ang בָּמוֹת ay mga kultikong pook na karaniwang nasa mataas na lugar. Mas malinaw ito sa ordinaryong mambabasa kaysa sa literal ngunit maaaring malabong “matataas na lugar.”
- source_word: תַּשְׁמִידוּ
  choice: gigibain ninyo
  rationale: Ang pandiwa ay nagsasaad ng ganap na pagwasak; ang “gigibain” ay angkop sa mga pisikal na pook-sambahan.
theological_decisions:
- issue: Mga utos tungkol sa mga naninirahan sa Canaan at sa kanilang mga kultikong bagay
  choice: Tuwirang isinalin ang utos na paalisin ang mga naninirahan at lubusang wasakin ang kanilang mga imahen at sambahan.
  alternative: Gawing mas banayad ang unang utos bilang simpleng pag-aalis ng pagmamay-ari, o gawing pangkalahatan ang mga tiyak na kultikong termino.
  rationale: Tahasan ang Hebreo tungkol sa pagpapaalis sa mga naninirahan at pagsira sa mga bagay at pook ng pagsamba. Hindi dapat pagaanin ang utos o dagdagan ito ng paliwanag na teolohikal na wala sa talata.
translation_notes:
  register: Modernong Filipino na marangal, malinaw, at angkop sa pampublikong pagbasa. Ginamit ang “sambahan sa matataas na lugar” upang ipaliwanag nang maikli ang kultikong diwa ng בָּמוֹת. Ang magkaibang “sisirain” at “wawasakin” ay nagpapanatili ng diin nang hindi nagiging alanganin ang pag-uulit sa Filipino.
