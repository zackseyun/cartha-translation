  yaml_path: translation/ot/numbers/033/029.yaml
  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: tl
  text: Umalis sila mula sa Mitka at nagkampo sa Hasmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Ang נסע sa pormulang naglilista ng mga hintuan sa ilang ay tumutukoy sa pag-alis mula sa isang kampo upang magpatuloy sa paglalakbay. Natural at malinaw sa makabagong Tagalog ang “umalis sila.”
- source_word: מִמִּתְקָה
  choice: mula sa Mitka
  rationale: Isinalin ang מִן bilang “mula sa,” at tinumbasan sa baybay-Tagalog ang pangalang-pook na מִתְקָה bilang “Mitka.”
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ay karaniwang pandiwa para sa pagtatayo o pananatili sa kampo. Ang “nagkampo” ay natural at madaling maunawaan sa kasalukuyang Tagalog.
- source_word: בְּחַשְׁמֹנָה
  choice: sa Hasmona
  rationale: Sa konteksto ng hintuan sa paglalakbay, natural na katumbas ng בְּ ang “sa.” Tinumbasan sa baybay-Tagalog ang pangalang-pook na חַשְׁמֹנָה bilang “Hasmona.”
