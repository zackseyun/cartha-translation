base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/025.yaml
  text: They set out from Haradah and camped at Makheloth[a].
translation:
  language: tl
  text: Umalis sila sa Harada at nagkampo sa Makhelot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Naglakbay sila mula sa Harada at humimpil sa Makhelot.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormulang naglilista ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis mula sa isang kampamento. Likas at malinaw sa modernong Tagalog ang “umalis” at ipinakikita nito ang pagsisimula ng paglalakbay.
- source_word: מֵחֲרָדָה
  choice: sa Harada
  rationale: Ang prefiks na מֵ ay nagsasaad ng pinanggalingan. Sa Tagalog, natural na ipinahahayag ito ng “umalis ... sa Harada.” Ang pangalang-pook ay tinumbasan ayon sa tunog, hindi isinalin ang kahulugan.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה sa ganitong talaan ng paglalakbay ay nangangahulugang humimpil o nagtayo ng kampo. Ang “nagkampo” ay tuwiran, pangkaraniwan, at angkop sa konteksto.
- source_word: בְּמַקְהֵלֹת
  choice: sa Makhelot
  rationale: Ang בְ ay tumutukoy sa lokasyon ng kampamento at likas na isinasalin na “sa” sa Tagalog. Ang Makhelot ay pangalang-pook at tinumbasan ayon sa bigkas ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang karaniwang “umalis” at “nagkampo” sa pangunahing teksto; inilagay sa talababa ang mas pormal na mga alternatibong “naglakbay” at “humimpil.”
