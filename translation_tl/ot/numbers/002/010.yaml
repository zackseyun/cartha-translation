id: NUM.2.10
reference: Numbers 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֧ה רְאוּבֵ֛ן תֵּימָ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י רְאוּבֵ֔ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: tl
  text: Ang watawat ng kampo ni Ruben ay ilalagay sa dakong timog, ayon sa kanilang mga pangkat[a]. Ang pinuno ng mga anak ni Ruben ay si Elizur na anak ni Sedeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kanilang mga hukbo”; may diwang militar at organisado ang salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: watawat
  rationale: Tumutukoy sa sagisag na pagkakakilanlan ng organisadong kampo ng lipi; natural at malinaw sa makabagong Filipino ang “watawat.”
- source_word: מַחֲנֵה
  choice: kampo
  rationale: Tumpak at karaniwang salita para sa organisadong himpilan ng lipi sa kontekstong ito.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: תֵּימָנָה
  choice: sa dakong timog
  rationale: Ipinahahayag ang lokasyon sa timog na bahagi ng kabuuang kampo.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kanilang mga pangkat
  rationale: Ipinapakita ang maayos at organisadong pagkakahati ng lipi; pinananatili sa talababa ang mas tahasang diwang militar ng צבא.
- source_word: וְנָשִׂיא
  choice: ang pinuno
  rationale: Malinaw na tumutukoy sa itinalagang pangulo ng lipi nang hindi nagpapahiwatig ng monarkiyang taglay ng “prinsipe.”
- source_word: לִבְנֵי רְאוּבֵן
  choice: ng mga anak ni Ruben
  rationale: Pinananatili ang Hebreong pananalitang pangkamag-anakan para sa mga kabilang sa lipi ni Ruben.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elizur na anak ni Sedeur
  rationale: Ginagamit ang kinagawiang Filipino na baybay ng mga pangalan at tuwirang inilalarawan ang patronimiko.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at bahagyang pormal. Ginamit ang “ilalagay” upang likas na maipahayag ang ipinahiwatig na pagkakalugar ng watawat sa konteksto ng mga tagubilin. Ang marker na [a] ay inilagay mismo sa pangunahing teksto.
