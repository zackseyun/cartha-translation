  text: 'And the tribe of Naphtali[a], and the leader of the sons of Naphtali: Ahira son of Enan.'
translation:
  language: tl
  text: At ang lipi ni Neftali, at ang pinuno ng mga anak ni Neftali[a] ay si Ahira na anak ni Enan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Neftali,” isang karaniwang katawagan para sa mga miyembro o inapo ng lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֶּה
  choice: lipi
  rationale: Sa konteksto ng pagkakaayos ng kampo sa Mga Bilang, tumutukoy ito sa isang yunit panlipi, hindi sa literal na tungkod. Ang “lipi” ang natural na katumbas sa modernong Filipino.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy ito sa kinikilalang namumuno sa lipi. Malinaw ang “pinuno” at wala itong di-kinakailangang pahiwatig ng pagiging maharlika.
- source_word: לִבְנֵי
  choice: ng mga anak ni
  rationale: Pinananatili nito ang karaniwang Hebreong katawagan sa mga miyembro o inapo ng isang lipi, habang nananatiling natural sa Filipino.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Isinalin sa anyong pangalan na nakasanayan sa Filipino; tumutukoy kapuwa sa ninuno at sa liping nagmula sa kaniya.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Pangngalang pantangi na tinumbasan sa malapit na transliterasyong Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang tuwiran at natural na katumbas ng karaniwang pormulang patronimiko sa Hebreo.
- source_word: עֵינָן
  choice: Enan
  rationale: Pangngalang pantangi na tinumbasan sa malapit na transliterasyong Filipino.
