base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh[a] kina Moises at Aaron, at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: YHWH.'
    reason: source_form
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagpapakilala ng bagong pangyayari sa salaysay; ang “nagsalita” ay angkop sa pormula ng banal na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Ang “kina” ay natural na modernong Tagalog para sa patunguhan ng pananalita kapag dalawa ang pinapangalanang tao; ang pag-uulit ng אֶל sa Hebreo ay makikita sa malinaw na pagsasama sa kanilang dalawa bilang mga kausap.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na pormulang Hebreo na nag-uugnay sa talata sa nilalaman ng pahayag sa susunod na talata.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Yehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na tahimik itong palitan ng titulo, habang kinikilala sa talababa ang anyong Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang natural na “kina Moises at Aaron,” ngunit pinanatili ang bahagyang pormal na “na sinasabi” upang maipakita ang pormulang לֵאמֹר at ang pagpapatuloy ng pahayag sa susunod na talata.
