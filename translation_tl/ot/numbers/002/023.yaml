translation:
  language: tl
  text: At ang kanyang pangkat[a], ang mga nabilang sa kanila, ay tatlumpu't limang libo at apat na raan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo” o “kasamang pangkat”; ipinahihiwatig ng salitang Hebreo ang organisasyong tulad-militar ng mga lipi sa sensus sa ilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: At ang kanyang pangkat
  rationale: Ang צָבָא ay maaaring tumukoy sa hukbo o organisadong pangkat. Sa konteksto ng pagbilang at pag-aayos ng kampo sa Bilang 2, ang “pangkat” ay likas sa modernong Filipino at hindi labis na nagpapahiwatig ng aktuwal na pakikipagdigma.
- source_word: וּפְקֻדֵיהֶם
  choice: ang mga kabilang sa kanila na binilang
  rationale: Mula ito sa פקד sa diwa ng sensus o pagtatala. Pinananatili ng parirala ang plural na hulaping “kanila” at nililinaw na ang kabuuang bilang ay yaong mga itinala mula sa pangkat.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: tatlumpu't limang libo at apatnaraan
  rationale: Ito ang eksaktong bilang na 35,400, inayos ayon sa natural na pagkakasabi sa modernong Filipino.
