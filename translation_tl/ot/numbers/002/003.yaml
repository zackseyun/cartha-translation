base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: tl
  text: Ang mga magkakampo sa silangan, sa dakong sinisikatan ng araw, ay yaong nasa ilalim ng watawat ng kampo ng Juda, ayon sa kani-kanilang pangkat. Ang pinuno ng mga anak ni Juda ay si Nahshon na anak ni Amminadab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵדְמָה מִזְרָחָה
  choice: Sa silangan, sa dakong sinisikatan ng araw
  rationale: Pinananatili ang magkatambal na direksiyonal na pahayag ng Hebreo, habang gumagamit ng natural na modernong Tagalog.
- source_word: דֶּגֶל
  choice: watawat
  rationale: Tumutukoy sa nakikitang sagisag na pinagkakakilanlan at pinagtitipunan ng isang kampo; mas angkop dito kaysa sa karaniwang teknikal na hiram na salita.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kani-kanilang pangkat
  rationale: Sa konteksto ng pag-aayos ng kampo, ang צבא ay tumutukoy sa organisadong mga pangkat o dibisyon; iniiwasan ng saling ito ang pagpapalagay na aktuwal na nakikipagdigma sila rito.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Malinaw at natural na tawag sa kinikilalang lider ng lipi, nang hindi nagdaragdag ng monarkikal na kahulugan.
- source_word: בְּנֵי יְהוּדָה
  choice: mga anak ni Juda
  rationale: Pinananatili ang anyong pampamilya at panlipi ng Hebreo, na tumutukoy sa mga inapo ni Juda.
