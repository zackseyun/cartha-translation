  source_fidelity: Ang draft ay malapit sa diwa ng Hebreo, kabilang ang dobleng pagtukoy sa silangan at ang pagtatalaga kay Nahshon. Gayunman, ang "ang mga nasa ilalim ng watawat" ay medyo maluwag at hindi tuwirang isinasalin ang participial na "ang mga magkakampo"; mas malinaw na panatilihin ang mga ito bilang paksa at ilarawan silang nasa ilalim ng watawat ng kampo ng Juda.
  naturalness: Natural at marangal ang wika. Ang binagong ayos ay mas malinaw sa Tagalog at mas malapit sa estruktura ng pinagmulan.
  terminology: Ang "watawat," "pangkat," at "pinuno" ay angkop. Pinanatili ang "mga anak ni Juda" upang katawanin ang pampamilyang/panliping pananalita ng Hebreo. Ang mga pangalan ay iniingatan sa anyong malapit sa pinagmulan.
  issues:
