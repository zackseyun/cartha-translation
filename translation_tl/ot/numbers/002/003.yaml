    issue: Hindi tuwirang naipahayag ang "mga magkakampo."
    rationale: Ang Hebreong וְהַחֹנִים ay tumutukoy mismo sa mga taong nagkakampo. Ang kasalukuyang "ang mga nasa ilalim ng watawat" ay nagpapahiwatig nito ngunit hindi ito malinaw na sinasabi.
  revised_text: Ang mga magkakampo sa silangan, sa dakong sinisikatan ng araw, ay yaong nasa ilalim ng watawat ng kampo ng Juda, ayon sa kani-kanilang pangkat. Ang pinuno ng mga anak ni Juda ay si Nahshon na anak ni Amminadab.
