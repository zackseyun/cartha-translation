  yaml_path: translation/ot/numbers/002/022.yaml
  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: tl
  text: At ang lipi ni Benjamin; ang pinuno ng mga anak ni Benjamin[a] ay si Abidan, anak ni Gideoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pinuno para sa mga anak ni Benjamin.” Maaaring isalin sa magkaugnay na paraan ang Hebreong pang-ukol dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa konteksto ng pagkakaayos ng kampo sa Mga Bilang, tumutukoy ito sa pangkat na nagmula sa isang ninuno, hindi sa literal na tungkod. Ang “lipi” ang natural na salin sa Filipino.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Pangalan ng tao at ng liping nagmula sa kaniya; ginamit ang karaniwang anyong Filipino.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy sa kinikilalang tagapanguna at kinatawan ng lipi. Malinaw ang “pinuno” at hindi ito nagpapahiwatig ng maharlikang titulong maaaring idulot ng “prinsipe.”
- source_word: לִבְנֵי בִנְיָמִן
  choice: ng mga anak ni Benjamin
  rationale: Pinananatili ang Hebreong pananalitang pangkamag-anakan, na tumutukoy sa mga inapo o sambayanan ni Benjamin. Maaaring unawain ang pang-ukol bilang “ng” o “para sa.”
- source_word: אֲבִידָן
  choice: Abidan
  rationale: Pangngalang pantangi; ginamit ang tuwirang transliterasyong karaniwan sa Filipino.
- source_word: בֶּן גִּדְעֹנִי
  choice: anak ni Gideoni
  rationale: Tuwirang salin ng karaniwang Hebreong patronimiko.
