  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “pangkat” upang maging natural sa talaan ng pagkakaayos ng kampo, at ang mga gitling upang malinaw na iugnay ang bilang sa mga kasapi ng pangkat.
