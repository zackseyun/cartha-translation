  yaml_path: translation/ot/numbers/002/015.yaml
  text: 'and his company[b][a], even those numbered from them: forty-five thousand six hundred and fifty.'
translation:
  language: tl
  text: at ang kanyang pangkat[a]—ang mga kabilang sa kanila na binilang[b]—ay apatnapu't limang libo, animnaraan at limampu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo” o “pulutong”; ang salitang Hebreo ay maaaring tumukoy sa isang organisadong pangkat-militar.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang mga tinipon para sa sensus mula sa kanila” o “ang kanilang mga binilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: at ang kanyang pangkat
  rationale: Sa konteksto ng sensus at pagkakaayos ng kampo, tumutukoy ang צָבָא sa organisadong pangkat o hukbong pantribo. Likas sa modernong Tagalog ang “pangkat” at hindi nito labis na idinidiin ang aktuwal na pakikidigma.
- source_word: וּפְקֻדֵיהֶם
  choice: ang mga kabilang sa kanila na binilang
  rationale: Ipinahahayag nito ang pasibong diwa ng פקד bilang mga itinala o binilang sa sensus, habang pinananatili ang pangmaramihang hulaping “kanila” at hindi nagdaragdag ng “mga lalaki” na wala sa mismong parirala.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף
  choice: apatnapu't limang libo
  rationale: Karaniwang salin sa Tagalog ng bilang na 45,000.
- source_word: וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: animnaraan at limampu
  rationale: Likas na pagpapahayag sa Tagalog ng 650, na bumubuo sa kabuuang 45,650.
