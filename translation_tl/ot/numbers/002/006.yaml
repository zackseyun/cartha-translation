  text: 'at ang kaniyang pangkat[a], at ang mga nabilang nito: limampu’t apat na libo at apat na raan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “at ang kaniyang hukbo, at ang mga nabilang nito: limampu’t apat na libo at apat na raan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: at ang kaniyang pangkat
  rationale: Sa konteksto ng Bilang 1–2, ang צָבָא ay tumutukoy sa organisadong pangkat ng isang lipi sa kaayusan ng kampo. Ang “pangkat” ay likas at madaling maunawaan sa makabagong Filipino, samantalang inilalahad sa talababa ang mas tahasang militar na “hukbo.” Isinalin ang pang-ugnay na וּ bilang “at” at ang hulaping panlalaking isahan bilang “kaniyang.”
- source_word: וּפְקֻדָיו
  choice: at ang mga nabilang dito
  rationale: Pinananatili ng “mga nabilang” ang diwa ng sensus o pagtatala mula sa פקד nang hindi ipinapalagay na ang tinutukoy ay mga propesyonal na kawal lamang. Ang “dito” ay likas na tumutukoy pabalik sa pangkat, at pinanatili ang ikalawang pang-ugnay na “at” mula sa וּ.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: limampu’t apat na libo at apatnaraan
  rationale: Isinaayos ang bilang ayon sa karaniwang ayos sa Filipino habang eksaktong pinananatili ang kabuuang 54,400.
