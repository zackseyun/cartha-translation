lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: At ang hukbo nito
  rationale: Sa konteksto ng sensus at pagkakaayos ng kampo, ang צָבָא ay tumutukoy sa organisadong pangkat o hukbong pantribo. Likas at malinaw sa Filipino ang “hukbo,” habang ang “nito” ay kumakatawan sa panlalaking isahang hulapi na tumutukoy sa tribong binabanggit sa agarang konteksto.
- source_word: וּפְקֻדֵיהֶם
  choice: ang mga kabilang sa kanila na nabilang
  rationale: Ang anyo mula sa פקד ay tumutukoy sa mga taong binilang o itinala sa sensus. Pinananatili ng parirala ang diwa ng pagbilang at ang pangmaramihang hulaping “kanila,” nang hindi tahasang nagdaragdag ng “mga lalaki” sa sugnay.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: apatnapu't isang libo at limang daan
  rationale: Isinalin ang bilang ayon sa karaniwang ayos ng mga bilang sa makabagong Filipino, nang walang pagbabago sa halaga.
