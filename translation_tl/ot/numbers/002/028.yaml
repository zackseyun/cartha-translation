  text: 'At ang hukbo nito[a] at ang mga nabilang mula sa kanila[b]: apatnapu’t isang libo at limang daan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pangkat”; ang salitang Hebreo ay maaari ring mangahulugang “hukbo” o organisadong kontingente sa konteksto ng sensus at kaayusan ng kampo.
