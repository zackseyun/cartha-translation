translation:
  language: tl
  text: at ang kanyang pangkat[a]—ang mga nabilang sa kanila[b]—ay pitumpu't apat na libo at anim na raan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo.” Ang salitang Hebreo ay maaaring magkaroon ng kahulugang militar, ngunit dito ay malamang na tumutukoy sa pangkat ng lipi ayon sa pagkakaayos ng kampo.
    reason: lexical_alternative
  - marker: b
