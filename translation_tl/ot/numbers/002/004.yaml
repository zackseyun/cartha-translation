lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: at ang kanyang pangkat
  rationale: Ang צָבָא ay maaaring mangahulugang hukbo, ngunit sa konteksto ng pagkakaayos ng mga lipi sa kampo, tumutukoy ito sa organisadong pangkat ng lipi. Likas sa modernong Tagalog ang “pangkat” at hindi nito labis na idinidiin ang aktuwal na pakikipagdigma.
- source_word: וּפְקֻדֵיהֶם
  choice: ang mga nakabilang sa kanila
  rationale: Ipinahihiwatig ng anyo mula sa פקד ang mga naitala o nabilang sa sensus. Pinananatili ng “nakabilang” ang diwang pasibo ng pagtatala, at ng “sa kanila” ang maramihang hulapi.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: pitumpu't apat na libo at animnaraan
  rationale: Isinalin sa karaniwang ayos ng mga bilang sa kasalukuyang Tagalog habang pinananatili ang eksaktong kabuuang 74,600.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pangkat” para sa organisadong yunit ng lipi at “nakabilang” para sa bokabularyo ng sensus; iniwasang idagdag ang “mga lalaki” dahil hindi iyon tahasang nasa sugnay na Hebreo.
