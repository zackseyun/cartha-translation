  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: tl
  text: At ginawa ng mga Israelita ang lahat ng iniutos ni Yahweh kay Moises. Ganoon sila nagkampo ayon sa kani-kanilang watawat[a], at ganoon din sila naglakbay, bawat isa ayon sa kanyang angkan at sambahayan ng kanyang mga ama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kani-kanilang sagisag.” Ang salitang Hebreo ay tumutukoy sa watawat o tandang ginagamit sa pagkakaayos ng mga pangkat ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Literal, “sambahayan ng kanyang mga ama.” Isang idyomang tumutukoy sa sambahayan o liping pinagmulan sa panig ng ama.
    reason: source_idiom
lexical_decisions:
- source_word: וַיַּעֲשׂוּ בְנֵי יִשְׂרָאֵל
  choice: ginawa ng mga Israelita
  rationale: Ang עשה ay nagbubuod sa pagsunod ng Israel sa mga naunang tagubilin. Ang “mga Israelita” ay likas na modernong Tagalog para sa kolektibong בְּנֵי יִשְׂרָאֵל, na literal na “mga anak na lalaki ni Israel” ngunit tumutukoy rito sa bayan.
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ng
  rationale: Pinananatili nito ang saklaw at ganap na pagsunod na ipinahihiwatig ng parirala nang hindi nagiging mabigat sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalang banal sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: iniutos ... kay Moises
  rationale: Malinaw at natural nitong ipinapahayag na ang utos kay Moises ay nauna sa isinagawang pagkilos ng mga Israelita.
- source_word: כֵּן ... וְכֵן
  choice: Ganoon ... at ganoon din
  rationale: Inuulit ang katumbas na parirala upang mapanatili ang diin ng Hebreo sa eksaktong pagtutugma ng kanilang pagkakampo at paglalakbay sa iniutos.
- source_word: חָנוּ
  choice: nagkampo
  rationale: Karaniwan at malinaw na modernong salita ito para sa pagtigil at pananatili sa kampo.
- source_word: לְדִגְלֵיהֶם
  choice: ayon sa kani-kanilang watawat
  rationale: Ang דֶּגֶל ay watawat o tandang kumakatawan sa organisadong pangkat sa kampo. Ipinahihiwatig ng “kani-kanilang” ang pagkakahati ayon sa mga pangkat nang hindi dinaragdagan ang teksto.
- source_word: נָסָעוּ
  choice: naglakbay
  rationale: Saklaw nito ang pag-alis ng kampo upang magpatuloy sa paglalakbay; ang “lumakad” ay maaaring magmungkahi lamang ng paglalakad.
- source_word: אִישׁ לְמִשְׁפְּחֹתָיו
  choice: ang bawat isa ayon sa kanyang angkan
  rationale: Ang אִישׁ ay distributibo rito, samantalang ang מִשְׁפָּחָה sa kontekstong pantribo ay mas malawak kaysa pamilyang nuklear at angkop na isaling “angkan.”
- source_word: עַל בֵּית אֲבֹתָיו
  choice: at sambahayan ng mga ninuno
  rationale: Tumutukoy ang idyoma sa organisasyong nakabatay sa sambahayan o lipi sa panig ng ama. Ang “sambahayan ng mga ninuno” ay nauunawaan sa modernong Tagalog habang pinananatili ang ugnayang panlahi.
theological_decisions:
- issue: Paglalarawan sa pagsunod ng Israel
  choice: ginawa ... ang lahat ng iniutos
  alternative: sumunod sa iniutos
  rationale: Pinananatili ng napiling anyo ang pandiwang עשה at ang komprehensibong “lahat,” sa halip na ibuod ito sa mas interpretibong salitang “sumunod.”
- issue: Pagkasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga Israelita” sa halip na literal ngunit di-likas na “mga anak na lalaki ni Israel.” Ang pag-uulit na “ganoon ... ganoon din” ay sadyang pinanatili upang tularan ang retorikal na diin ng Hebreo.
