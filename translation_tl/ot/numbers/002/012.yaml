id: NUM.2.12
reference: Numbers 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: tl
  text: Ang mga nakahimpil sa tabi nito[a] ay ang lipi ni Simeon, at ang pinuno ng mga anak na lalaki ni Simeon ay si Selumiel na anak ni Zurisadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa tabi niya.” Ang pang-ukol sa Hebreo ay maaaring mangahulugang pagiging magkatabi sa pagkakaayos ng kampo. Malamang na ang tinutukoy ay ang sagisag o pamantayan ng kampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: Ang nakahimpil
  rationale: Ang participle ng חנה ay ginagamit bilang pangngalan para sa mga taong nagkakampo; likas at marangal sa Filipino ang “nakahimpil” sa konteksto ng maayos na pagkakalagay ng kampo.
- source_word: עָלָיו
  choice: sa tabi niya
  rationale: Sa kaayusan ng kampo, ang עַל ay tumutukoy sa pagiging katabi, hindi sa literal na pagiging nasa ibabaw. Pinananatili ng “niya” ang panlalaking pang-isahang anyo ng hulapi, habang inilalahad sa talababa ang posibleng di-personal na tinutukoy.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: ang lipi ni Simeon
  rationale: Sa mga talaan ng sambahayan at kampo, ang מַטֶּה ay isang lipi, hindi literal na tungkod.
- source_word: וְנָשִׂיא
  choice: at ang pinuno
  rationale: Ang נָשִׂיא rito ay kinikilalang pangulo o pinuno ng lipi; malinaw ang “pinuno” at wala itong di-kinakailangang pahiwatig ng pagkahari.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: ng mga anak na lalaki ni Simeon
  rationale: Tuwirang pinananatili nito ang panlalaking maramihang בְּנֵי at ang ekspresyong pangkamag-anakan ng Hebreo.
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Isinalin-titik ang pangalang Hebreo sa baybay na natural basahin sa Filipino.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: anak ni Zurisadai
  rationale: Tuwirang isinalin ang patronimikong konstruksyon, at isinalin-titik bilang isang pangalan ang צוּרִישַׁדַּי.
theological_decisions:
- issue: Panlalaking pananalitang pangkamag-anakan sa לִבְנֵי שִׁמְעוֹן
  choice: mga anak na lalaki ni Simeon
  alternative: mga anak ni Simeon / mga inapo ni Simeon
  rationale: Hayagang panlalaki ang anyong Hebreo. Pinananatili ito sa salin sa halip na gawing neutral, bagaman sa konteksto ay tumutukoy ito sa pangkat ng lipi.
- issue: Tinutukoy ng panlalaking hulapi sa עָלָיו
  choice: sa tabi niya
  alternative: sa tabi nito
  rationale: Pinananatili ng pangunahing teksto ang panlalaking pang-isahang anyo ng Hebreo. Gayunman, maaaring ang tinutukoy sa daloy ng konteksto ay ang kampo o sagisag ng lipi, kaya inilalahad ang alternatibo sa talababa nang hindi nilulutas nang sapilitan ang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakahimpil” para sa konteksto ng kampo at ang karaniwang anyong Filipino ng mga pangalang Selumiel at Zurisadai.
