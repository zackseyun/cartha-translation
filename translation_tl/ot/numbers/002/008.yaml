  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: tl
  text: Ang kanyang pangkat[a], ang mga naitalang kabilang dito[b], ay 57,400.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hukbo” o “dibisyon.” Ang salitang Hebreo ay maaaring tumukoy sa isang organisadong pangkat ng mga mandirigma o pangkat sa kampo.
    reason: lexical_alternative
  - marker: b
    text: O “mga kabilang dito na opisyal na binilang.” Tumutukoy ito sa mga itinala sa sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Ang kanyang pangkat
  rationale: Sa konteksto ng sensus at pagkakaayos ng kampo, ang צָבָא ay tumutukoy sa organisadong pangkat o hukbong pantribo. Natural sa modernong Filipino ang “pangkat” at hindi nito labis na idinidiin ang aktuwal na pakikidigma.
- source_word: וּפְקֻדָיו
  choice: ang mga kabilang dito na nabilang
  rationale: Ang anyo mula sa פקד ay tumutukoy sa mga opisyal na binilang o itinala sa sensus. Nililinaw ng “kabilang dito” na ang bilang ay para sa nasabing pangkat.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57,400
  rationale: Inihahayag ang eksaktong bilang sa karaniwang modernong anyo para sa madaling pagbasa.
