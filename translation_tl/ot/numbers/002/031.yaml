translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “watawat” bilang karaniwang salita, habang ipinaliliwanag sa talababa ang larawan ng mga pangkat sa ilalim ng mga bandila.
