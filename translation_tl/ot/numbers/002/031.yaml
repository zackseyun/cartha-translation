  yaml_path: translation/ot/numbers/002/031.yaml
  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: tl
  text: Ang lahat ng nabilang para sa kampo ni Dan ay 157,600. Sila ang huling aalis ayon sa kani-kanilang watawat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa ilalim ng kani-kanilang mga bandila.” Ang salitang Hebreo ay tumutukoy sa mga watawat ng mga lipi o sa mga pangkat na nakahanay ayon sa mga watawat sa kampo ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Ang kabuuang bilang ng mga nabilang
  rationale: Ipinahahayag nito ang buong bilang ng mga naitala sa sensus. Likas sa modernong Filipino ang pariralang ito at hindi na nagdaragdag ng salitang “lalaki,” na hindi tahasang inuulit sa talata.
- source_word: לְמַחֲנֵה דָן
  choice: sa kampo ni Dan
  rationale: Ipinakikita ng לְ ang kaugnayan ng mga nabilang sa pangkat-kampo ni Dan; malinaw at natural sa Filipino ang “sa kampo ni Dan.”
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 157,600
  rationale: Eksaktong inilalahad ang pinagsamang bilang sa paraang madaling basahin sa makabagong Filipino.
- source_word: לָאַחֲרֹנָה
  choice: ang huling
  rationale: Tumutukoy ito sa huling puwesto sa pagkakasunod-sunod ng pag-alis; natural itong ikabit sa simuno sa Filipino.
- source_word: יִסְעוּ
  choice: aalis
  rationale: Sa konteksto ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis ng kampo upang maglakbay. Ang “aalis” ay malinaw at hindi mabigat pakinggan.
- source_word: לְדִגְלֵיהֶם
  choice: ayon sa kani-kanilang watawat
  rationale: Ang דגל ay watawat o sagisag na nagsasaayos sa mga pangkat ng kampo. Pinananatili ng “ayon sa” ang diwa ng kaayusan, at ng “kani-kanilang” ang pangmaramihang hulaping Hebreo.
