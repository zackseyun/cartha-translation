  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: tl
  text: Ang kabuuang bilang ng mga naibilang sa kampo ni Efraim ay 108,100, ayon sa kani-kanilang pangkat[a]. Pangatlo silang aalis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa kani-kanilang hukbo” o “ayon sa kani-kanilang dibisyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Ang kabuuang bilang ng mga naitala
  rationale: Ipinahahayag ang kabuuan ng sensus sa natural na Filipino. Ang “mga naitala” ay nagpapanatili sa diwa ng pagbibilang o pagpapatala nang hindi tahasang nagdaragdag ng “mga lalaki.”
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: sa kampo ni Efraim
  rationale: Natural na pagpapahayag sa Filipino ng kaugnayan ng mga naitala sa pangkat-kampo ni Efraim.
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: 108,100
  rationale: Eksaktong halaga ng bilang sa Hebreo, ginamitan ng mga numero para sa malinaw at mabilis na pagbasa.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kani-kanilang pangkat
  rationale: Ang צָבָא ay maaaring tumukoy sa hukbo, pangkat, o organisadong dibisyon. Ang “pangkat” ay madaling maunawaan at hindi labis na nagpapatingkad ng militar na kahulugan.
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: Sila ang ikatlong aalis
  rationale: Inihahatid ang ayos ng paglalakbay sa natural na Filipino; sa konteksto, ang נסע ay pag-alis o pagsisimula ng paglalakbay ng kampo.
