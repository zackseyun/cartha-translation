base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: tl
  text: Ang mga nakahimpil sa tabi nito ay ang lipi ni Isacar, at ang pinuno ng mga anak ni Isacar[a] ay si Netanel na anak ni Zuar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Isacar.” Karaniwang katawagan ito sa lipi at tumutukoy sa mga inapo o kabilang sa lipi ni Isacar, hindi lamang sa mga lalaking anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: ang mga magkakampo
  rationale: Ang participle ay ginagamit bilang pangngalan para sa pangkat na nakatalagang magkampo; ipinahihiwatig ng anyong Filipino ang kanilang kaayusan sa kampamento.
- source_word: עָלָיו
  choice: sa tabi nito
  rationale: Sa konteksto ng pagkakaayos ng kampo, tumutukoy ito sa pagiging katabi ng naunang binanggit na pangkat o watawat, hindi sa literal na pagiging nasa ibabaw nito.
- source_word: מַטֵּה יִשָּׂשכָר
  choice: ang lipi ni Isacar
  rationale: Ang מַטֶּה ay tumutukoy rito sa tribo o lipi, hindi sa tungkod; natural sa modernong Filipino ang 'lipi ni Isacar.'
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy ito sa kinikilalang lider ng lipi; malinaw at hindi maharlika ang dating ng 'pinuno.'
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: ng mga anak ni Isacar
  rationale: Pinananatili ang literal na larawang pampagkamag-anak ng Hebreo, habang nililinaw sa talababa na isa rin itong katawagan sa mga kabilang sa lipi.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino habang malapit sa Hebreong pangalan.
- source_word: בֶּן צוּעָר
  choice: anak ni Zuar
  rationale: Natural na Filipino para sa karaniwang Hebreong patronimiko.
