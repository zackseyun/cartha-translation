base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: tl
  text: Pagkatapos, aalis ang Tolda ng Tipanan kasama ng kampo ng mga Levita, sa gitna ng mga kampo. Kung paano sila nagkakampo, gayon din sila aalis—bawat isa ay nasa kanyang puwesto[a], ayon sa kani-kanilang mga watawat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanyang nakatalagang puwesto.” Ang idyomang Hebreo ay literal na gumagamit ng salitang “kamay” o “tagiliran” at tumutukoy sa kinalalagyan ng bawat isa sa hanay ng paglalakbay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa kani-kanilang mga sagisag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Pagkatapos, aalis
  rationale: Sa konteksto ng paglalakbay ng kampo, ang נָסַע ay tumutukoy sa paglisan o pagsisimulang maglakbay. Ang “Pagkatapos” ay nagpapakita ng pagkakasunod-sunod, at ang “aalis” ay likas at malinaw sa modernong Filipino.
- source_word: אֹהֶל מוֹעֵד
  choice: Tolda ng Tipanan
  rationale: Pinananatili nito ang konkretong kahulugan ng אֹהֶל bilang “tolda” at ang kinikilalang katawagan sa banal na tolda, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: kampo ng mga Levita
  rationale: Tuwirang isinasalin ang construct chain at pinananatili ang “mga Levita” bilang tawag sa pangkat.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: sa gitna ng mga kampo
  rationale: Malinaw na ipinahahayag ng בְּתוֹךְ ang sentrong kinalalagyan ng tolda at kampo ng mga Levita sa hanay ng mga kampo.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: Kung paano sila nagkakampo, gayon din sila aalis
  rationale: Pinananatili ang magkatugmang estruktura ng Hebreo at ang diwang ang ayos sa paglalakbay ay katumbas ng ayos sa pagkakampo.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Distributibo ang gamit ng אִישׁ dito; ang “bawat isa” ay natural sa Filipino at maaaring tumukoy sa bawat tao o yunit sa hanay.
- source_word: עַל יָדוֹ
  choice: nasa kanyang puwesto
  rationale: Ang idyomang literal na may kahulugang “sa kanyang kamay/tagiliran” ay tumutukoy rito sa nakatalagang lugar sa kaayusan ng paglalakbay.
- source_word: לְדִגְלֵיהֶם
  choice: ayon sa kani-kanilang mga watawat
  rationale: Ang דֶּגֶל ay watawat o sagisag na nagtatanda sa mga pangkat. Ipinahahayag ng “ayon sa” ang organisasyonal na gamit nito, at ng “kani-kanilang” ang pamamahagi sa mga pangkat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “gayon din” upang mapanatili ang paralelismo ng Hebreo, habang ang em dash ay tumutulong na ihayag ang pangwakas na tuntunin tungkol sa puwesto ng bawat pangkat.
