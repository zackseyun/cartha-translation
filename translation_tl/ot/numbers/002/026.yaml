  text: 'and his division[b][a], those numbered from them: sixty-two thousand seven hundred.'
translation:
  language: tl
  text: at ang kanyang pangkat[a]—ang mga nabilang sa kanila[b]—ay animnapu't dalawang libo at pitong daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo” o “pulutong.” Ang salitang Hebreo ay maaaring tumukoy sa isang hukbong militar o organisadong pangkat; dito, tumutukoy ito sa pangkat ng lipi sa kaayusan ng kampo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang mga nabilang mula sa kanila.” Tumutukoy ito sa kabuuang bilang ng mga taong kabilang sa lipi o pangkat na iyon ayon sa census.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: at ang kanyang pangkat
  rationale: Ang צָבָא ay maaaring tumukoy sa hukbo o organisadong pangkat. Sa konteksto ng pagbilang at pag-aayos ng kampo sa Bilang 1–2, ang “pangkat” ay likas sa modernong Filipino at hindi labis na nagdidiin sa kahulugang militar. Pinanatili rin ang pangatnig at ang panlalaking pang-isahang hulapi bilang “kanyang.”
- source_word: וּפְקֻדֵיהֶם
  choice: ang mga nabilang sa kanila
  rationale: Ang anyo mula sa פקד ay tumutukoy sa mga taong isinama sa census. Pinananatili ng salin ang diwa ng mga taong binilang at ang kaugnayan nila sa tinutukoy na lipi o pangkat.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: animnapu't dalawang libo at pitong daan
  rationale: Isinalin ang eksaktong bilang sa karaniwang ayos ng mga numero sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pangkat” bilang terminong madaling maunawaan sa konteksto ng organisadong mga lipi, habang inilagay sa talababa ang mas militar na mga alternatibo. Ang mga gitling na mahaba ay tumutulong na ipakitang ang “mga nabilang sa kanila” ang nagpapaliwanag sa pangkat at nagbibigay ng kabuuang bilang nito.
