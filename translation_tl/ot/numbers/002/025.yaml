id: NUM.2.25
reference: Numbers 2:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה דָ֛ן צָפֹ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י דָ֔ן אֲחִיעֶ֖זֶר בֶּן עַמִּֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: tl
  text: Ang watawat ng kampo ni Dan ay nasa gawing hilaga, ayon sa kanilang mga pangkat[a]; at ang pinuno ng mga anak ni Dan ay si Ahiezer na anak ni Ammishaddai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa kanilang mga pangkat ng hukbo” o “ayon sa kanilang mga hukbo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: watawat
  rationale: Tumutukoy sa sagisag o watawat na pinagbabatayan ng pagkakaayos ng kampo; malinaw at likas ang “watawat” sa modernong Filipino.
- source_word: מַחֲנֵה
  choice: kampo
  rationale: Karaniwang katawagan sa organisadong himpilan ng lipi sa konteksto ng Bilang 2.
- source_word: צָפֹנָה
  choice: nasa gawing hilaga
  rationale: Ipinahihiwatig ng anyong paturol ang puwesto sa hilagang panig; natural itong pahayag sa Filipino.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kanilang mga pangkat
  rationale: Tumutukoy sa organisadong mga pangkat na may anyong militar. Iniiwasan ng saling ito ang makalumang “mga hukbo” habang pinananatili ang diwa ng maayos na paghahati.
- source_word: וְנָשִׂיא
  choice: at ang pinuno
  rationale: Ang נָשִׂיא dito ay kinikilalang pinuno ng lipi, hindi kinakailangang isang prinsipeng monarkikal.
- source_word: לִבְנֵי דָן
  choice: ng mga anak ni Dan
  rationale: Pinananatili ang pormal at may-kasariang katawagan sa lipi na literal na “mga anak ni Dan.”
- source_word: אֲחִיעֶזֶר
  choice: Ahiezer
  rationale: Isinatinig ang pangalang pantangi sa anyong madaling basahin sa Filipino.
- source_word: בֶּן עַמִּישַׁדָּי
  choice: anak ni Ammishaddai
  rationale: Tuwirang isinalin ang patronimiko at isinatitik ang pangalan.
theological_decisions:
- issue: May-kasariang katawagan sa lipi na בְנֵי
  choice: mga anak ni Dan
  alternative: mga kaanib ng lipi ni Dan / mga inapo ni Dan
  rationale: Pinananatili ng pangunahing teksto ang pormal na katawagang Hebreo nang hindi ito ginagawang mas inklusibo kaysa sa tahasang anyo ng pinagmulan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “gawing hilaga” para sa natural na paglalarawan ng lokasyon at “mga pangkat” upang maipakita ang organisadong pagkakahati nang hindi labis na militar o makaluma ang tunog.
