  yaml_path: translation/ot/numbers/002/009.yaml
  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: tl
  text: Ang lahat ng nabilang para sa kampo ni Juda ay 186,400, ayon sa kani-kanilang pangkat.[a] Sila ang unang aalis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa kani-kanilang dibisyon,” “pulutong,” o “hukbo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Sila ang unang lilisan sa kampo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: ang lahat ng nabilang
  rationale: Ipinahahayag ang kabuuang bilang ng mga naitala sa sensus o pagtitipon para sa hukbo, nang hindi nagdaragdag ng tahasang salitang “mga lalaki” sa parirala.
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: sa kampo ni Juda
  rationale: Natural na Filipino para sa kaugnayan ng mga nabilang sa pangkat-kampong pinangungunahan ng Juda.
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: 186,400
  rationale: Eksaktong kabuuan ng Hebreong bilang; mas madaling basahin sa anyong numero sa konteksto ng sensus.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kani-kanilang pangkat
  rationale: Ang צבא ay maaaring tumukoy sa hukbo, pangkat, o organisadong yunit. Pinananatili ng “pangkat” ang organisadong diwa nang hindi nagpapahiwatig ng makabagong hukbong propesyonal.
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: Sila ang unang aalis
  rationale: Ipinakikita ang unang puwesto sa pagkakasunod-sunod ng paglalakbay mula sa kampo; natural at malinaw sa modernong Filipino.
