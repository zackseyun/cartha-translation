base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: tl
  text: Ang mga anak ni Israel ay magkakampo, bawat lalaki sa tabi ng kaniyang watawat,[a] ayon sa mga sagisag ng mga sambahayan ng kanilang mga ninuno. Magkakampo sila sa tapat ng Tolda ng Tipanan, sa buong palibot nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bandila” o “estandarte.” Ang salitang Hebreo ay tumutukoy sa watawat na nagpapakilala sa isang lipi o pangkat ng hukbo.
    reason: lexical_alternative
  - marker: b
    text: Tradisyonal ding isinasalin itong “tabernakulo.” Ang pariralang Hebreo ay tumutukoy sa isang tolda para sa itinakdang pakikipagtagpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: bawat lalaki
  rationale: 'Ginamit nang pamahagi ang panlalaking pangngalan: bawat lalaking kabilang sa kaayusan ng kampo.'
- source_word: דִּגְלוֹ
  choice: sa tabi ng kaniyang watawat
  rationale: Ang דֶּגֶל ay watawat o panandang kumikilala sa pangkat o hukbo; natural at malinaw sa makabagong Filipino ang “watawat.”
- source_word: בְאֹתֹת
  choice: ayon sa mga sagisag
  rationale: Tumutukoy ang אוֹת sa mga panandang nagpapakilala sa mga pangkat; ipinahihiwatig dito ng בְּ ang pagsasaayos batay sa mga iyon.
- source_word: לְבֵית אֲבֹתָם
  choice: ng sambahayan ng kanilang mga ninuno
  rationale: Tumutukoy ito sa angkan o sambahayang nakaayos ayon sa linya ng ama; pinananatili ng “mga ninuno” ang ugnayang pampamilya nang natural sa Filipino.
- source_word: יַחֲנוּ
  choice: ay magkakampo / magkakampo sila
  rationale: Ang imperfect sa kontekstong nag-uutos ay nagpapahayag ng itinakdang kaayusan; ang anyong panghinaharap ay natural na naghahatid nito sa Filipino.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang literal na idyomang pampamilya ng Hebreo sa halip na gawing “mga Israelita.”
- source_word: מִנֶּגֶד
  choice: na nakaharap dito
  rationale: Ipinahihiwatig ng salita ang puwestong katapat o nakaharap sa tolda, hindi ang layo mula rito.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Malinaw na ipinahahayag ang pagkakahanay sa lahat ng panig ng tolda.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Direktang inilalarawan ang toldang itinakdang dako ng pakikipagtagpo; mas malinaw ito kaysa sa hiram at tradisyonal na “tabernakulo.”
theological_decisions:
- issue: Panlalaking wikang kumakatawan sa pangkat
  choice: bawat lalaki / ang mga anak ni Israel
  alternative: bawat isa / ang mga Israelita
  rationale: Pinananatili ang panlalaking anyo at pampamilyang idyoma ng Hebreo, nang hindi ipinapalagay na binabago ng teksto ang saklaw ng buong Israel.
- issue: Pagsasalin ng katawagang pangkulto
  choice: toldang tipanan
  alternative: tabernakulo
  rationale: Mas lantad nitong isinasalin ang אֹהֶל מוֹעֵד at iniiwasan ang pagpasok ng mga implikasyong arkitektural na wala sa mismong parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang idyomang “mga anak ni Israel,” samantalang ginawang natural ang mga pariralang tumutukoy sa ayos ng kampo. Ang “toldang tipanan” ay ginagamit bilang malinaw na katawagang Filipino para sa אֹהֶל מוֹעֵד.
