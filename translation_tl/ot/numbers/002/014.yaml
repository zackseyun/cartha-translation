  yaml_path: translation/ot/numbers/002/014.yaml
  text: 'And the tribe of Gad[a], and the leader of the sons of Gad: Eliasaph son of Reuel.'
translation:
  language: tl
  text: At para sa lipi ni Gad, ang pinuno ng mga anak ni Gad ay si Eliasaf na anak ni Reuel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito o paralelong talata, Deuel ang pangalan ng ama (tingnan ang Bilang 1:14).
    reason: textual_variant
lexical_decisions:
- source_word: וְ/מַטֵּה גָּד
  choice: At ang lipi ni Gad
  rationale: Sa konteksto ng pagkakaayos ng kampo, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod. Pinanatili ang וְ bilang “At” upang maipakita ang tuloy-tuloy na talaan.
- source_word: וְ/נָשִׂיא
  choice: Ang pinuno
  rationale: Sa kontekstong administratibo, ang נָשִׂיא ay kinikilalang pinuno ng lipi. Ang “pinuno” ay likas at malinaw sa modernong Filipino.
- source_word: לִ/בְנֵי גָד
  choice: ng mga anak ni Gad
  rationale: Pinananatili nito ang pormulang Hebreo na tumutukoy sa pangkat na pinamumunuan o kinabibilangan niya.
- source_word: אֶלְיָסָף
  choice: Eliasaf
  rationale: Isinulat ang pangalang pantangi ayon sa karaniwang anyong Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang tuwiran at likas na salin ng pormulang patronimiko.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Ang tekstong Masoretiko sa talatang ito ay may רְעוּאֵל, kaya “Reuel” ang inilagay sa pangunahing teksto; hindi ito iniharmonisa sa paralelong “Deuel” sa Bilang 1:14.
