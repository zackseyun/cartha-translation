translation:
  language: tl
  text: at ang kanyang pangkat[a]—ang mga nabilang sa kanila—ay limampu’t tatlong libo at apat na raan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo”; ang salitang Hebreo ay maaaring magpahiwatig ng isang organisadong pangkat ng lipi na may katangiang militar.
