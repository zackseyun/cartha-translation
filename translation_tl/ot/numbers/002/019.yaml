lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: ang bilang ng kanyang pangkat
  rationale: Sa pormulang pangkampo at pansenso, ang צָבָא ay tumutukoy sa organisadong pangkat na kaugnay ng lipi; ang “pangkat” ay natural sa Filipino at hindi kasing-limitado ng “hukbo.” Isinama sa parirala ang kasunod na census expression upang maging malinaw at likas ang pangungusap.
- source_word: וּפְקֻדֵיהֶם
  choice: ang bilang ... [sa pangkat]
  rationale: Ang anyo mula sa פקד ay tumutukoy sa mga naitala o nabilang para sa paglilingkod. Sa Filipino, ang “ang bilang ng kanyang pangkat” ay maikli at natural, habang ang talababa ay nagpapanatili sa alternatibong diin sa mga mismong naitala.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 40,500
  rationale: Tuwirang modernong pagsulat ng bilang na apatnapung libo at limang daan.
