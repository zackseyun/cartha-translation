  language: tl
  text: At ang kanyang pangkat at ang mga naitala mula sa kanila[a] ay 40,500.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga binilang mula sa kanila.” Ang salitang Hebreo ay maaaring tumukoy sa mga ipinatala o binilang para sa paglilingkod sa sensus.
