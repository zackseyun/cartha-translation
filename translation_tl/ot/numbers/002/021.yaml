  text: 'and his division[a], those numbered from them: thirty-two thousand two hundred.'
translation:
  language: tl
  text: at ang kanyang pangkat[a]—ang mga nabilang sa kanila—ay tatlumpu't dalawang libo at dalawang daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hukbo”; ang salitang Hebreo ay tumutukoy rito sa pangkat ng tribo na isinaayos para sa pagkakampo at paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: at ang kanyang pangkat
  rationale: Sa konteksto ng kaayusan ng kampo at paglalakbay sa Bilang 2, ang צָבָא ay tumutukoy sa organisadong pangkat ng tribo. Likas sa makabagong Filipino ang “pangkat” at hindi nito labis na idinidiin ang aktuwal na pakikidigma.
- source_word: וּפְקֻדֵיהֶם
  choice: ang mga nabilang sa kanila
  rationale: Ang anyo mula sa פקד ay tumutukoy sa mga binilang o itinala sa sensus. Pinananatili ng “sa kanila” ang maramihang hulaping Hebreo at ipinakikitang ang kasunod na bilang ang kabuuan ng pangkat.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: tatlumpu't dalawang libo at dalawang daan
  rationale: Direktang bilang na 32,200, na ipinahayag sa karaniwan at malinaw na ayos ng bilang sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pangkat” bilang neutral at likas na katawagan sa organisadong pangkat ng tribo, habang inilagay sa talababa ang mas militar na alternatibong “hukbo.”
