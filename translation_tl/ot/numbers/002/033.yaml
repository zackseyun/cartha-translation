  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: tl
  text: Ngunit hindi ibinilang ang mga Levita sa mga anak ni Israel[a], gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita”; ayon sa literal na Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: Ngunit ang mga Levita
  rationale: Ang וְ ay nagmamarka rito ng pagsalungat sa naunang kabuuang bilang; natural sa Filipino ang “Ngunit.” “Mga Levita” ang karaniwang tawag sa pangkat.
- source_word: לֹא הָתְפָּקְדוּ
  choice: hindi ibinilang
  rationale: Sa konteksto ng sensus, ang hitpael ng פקד ay tumutukoy sa pagkabilang o pagkatala. Malinaw at likas sa modernong Filipino ang pasibong “hindi ibinilang.”
- source_word: בְּ/תוֹךְ
  choice: sa
  rationale: Ipinapahiwatig dito ang pagsama sa mas malaking pangkat. Sa pariralang “ibinilang ... sa,” natural na naipapahayag sa Filipino ang diwang “among.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawang Hebreo na “mga anak ni Israel,” habang nananatiling malinaw sa Filipino. Maaaring unawain sa konteksto bilang sambayanang Israelita.
- source_word: כַּ/אֲשֶׁר
  choice: gaya ng
  rationale: Likas na ipinakikilala nito ang pagtutugma ng pangyayari sa naunang utos.
- source_word: צִוָּה
  choice: iniutos
  rationale: Tumutukoy ang anyong ganap sa utos na naibigay na. Hindi kailangang tahasang markahan ang pluperfect sa Filipino sapagkat malinaw ito sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Ang pantukoy sa tuwirang layon at ang pangalang Moises ay likas na isinasalin bilang “kay Moises” kasunod ng pandiwang “iniutos.”
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “ibinilang” para sa konteksto ng sensus at pinanatili ang Hebreong idyomang “mga anak ni Israel,” na nilinaw sa talababa.
