  terminology: Ang “bandila,” “kampo,” “pinuno,” at “mga anak ni Efraim” ay angkop. Ang “mga pangkat” ay katanggap-tanggap para sa לְצִבְאֹתָם, habang wastong ipinapaliwanag ng talababa ang aspektong pang-organisasyong militar. Ang mga anyong pangalang “Efraim,” “Elisama,” at “Amihud” ay pare-pareho at angkop sa Filipino.
