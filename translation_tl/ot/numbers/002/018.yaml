  source_fidelity: 'Tumpak na naisasalin ang pormulang Hebreo: ang bandila ng kampo ni Efraim ay nakapuwesto sa kanluran ayon sa mga yunit/pangkat nito, at si Elisama na anak ni Amihud ang pinuno ng mga anak ni Efraim. Ang “gawing kanluran” ay wastong idiomatikong pagtukoy sa יָמָּה sa kontekstong ito.'
