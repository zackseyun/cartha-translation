  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה אֶפְרַ֛יִם לְ/צִבְאֹתָ֖/ם יָ֑מָּ/ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י אֶפְרַ֔יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: tl
  text: Ang bandila[a] ng kampo ng Efraim, ayon sa kanilang mga pangkat[b], ay nasa gawing kanluran; at ang pinuno ng mga anak ni Efraim[c] ay si Elisama na anak ni Amihud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “watawat.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa kanilang mga pangkat ng hukbo.” May diwa ng organisadong kaayusang militar ang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga anak ni Efraim” ay katawagan sa mga inapo o bayan ng lipi ni Efraim.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: bandila
  rationale: Tumutukoy sa sagisag na bandila ng pangkat o kampong pantribo. Likas at malinaw sa makabagong Filipino ang “bandila”; maaari rin ang “watawat.”
- source_word: מַחֲנֵה
  choice: kampo
  rationale: Tumutukoy sa organisadong kampo ng lipi at tuwirang nauunawaan sa kontekstong ito.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kanilang mga pangkat
  rationale: Ipinahihiwatig ng צָבָא rito ang organisadong pagkakahati-hati ng bayan na may katangiang militar. Pinananatili ng “mga pangkat” ang diwang pang-organisasyon nang hindi ipinapalagay na aktuwal silang nakikipagdigma.
- source_word: יָמָּה
  choice: nasa gawing kanluran
  rationale: Literal itong tumutukoy sa dakong dagat, na sa heograpikong oryentasyon ng Israel ay kanluran. Ang “gawing kanluran” ay natural para sa puwesto sa kampo.
- source_word: וְנָשִׂיא
  choice: at ang pinuno
  rationale: Ang נָשִׂיא ay pinuno ng lipi. Mas malinaw ang “pinuno” kaysa “prinsipe,” na maaaring maling magpahiwatig ng maharlikang dinastiya.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: ng mga anak ni Efraim
  rationale: Pinananatili nito ang Hebreong pananalitang pangkamag-anakan habang malinaw na tumutukoy sa mga inapo o bayan ng lipi ni Efraim.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elisama na anak ni Amihud
  rationale: Isinalin nang tuwiran ang בֶּן bilang “anak ni,” at ginamit ang likas na anyong Filipino ng mga pangalang pantangi.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at pormulang ayos ng talata, pati ang pananalitang pangkamag-anakan na “mga anak ni Efraim,” habang nilinaw ito sa talababa.
