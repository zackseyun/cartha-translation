base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: tl
  text: Ito ang mga lalaking nabilang[a] mula sa mga anak ni Israel[b], ayon sa sambahayan ng kanilang mga ninuno. Ang lahat ng nabilang sa mga kampo ayon sa kani-kanilang pangkat[c] ay animnaraang libo at tatlong libo, limandaan at limampu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaking naitala” o “mga lalaking isinama sa sensus.”
    reason: lexical_alternative
  - marker: b
    text: O “mga Israelita.” Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: c
    text: O “kani-kanilang hukbo” o “kani-kanilang dibisyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: mga lalaking nabilang
  rationale: Sa konteksto ng sensus sa Bilang 1–2, tumutukoy ito sa mga lalaking itinala para sa paglilingkod sa hukbo. Ang “nabilang” ay natural sa Filipino, habang nililinaw ng “mga lalaki” ang tinutukoy sa konteksto.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pampamilya at tipanang idyoma ng Hebreo; inilalahad sa talababa ang mas karaniwang “mga Israelita.”
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa sambahayan ng kanilang mga ninuno
  rationale: Ipinahahayag nito ang pagkakaayos ayon sa angkan o sambahayang nagmula sa mga ama, ngunit gumagamit ng natural at marangal na modernong Filipino.
- source_word: הַמַּחֲנֹת
  choice: mga kampo
  rationale: Malinaw na tumutukoy sa mga organisadong kampo ng mga lipi sa palibot ng tabernakulo.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kani-kanilang pangkat
  rationale: Ipinahahayag ang organisadong paghahati para sa paglilingkod militar nang hindi ipinapalagay na kasalukuyang nakikipagdigma ang mga ito.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: animnaraan at tatlong libo, limandaan at limampu
  rationale: Tumpak na inililipat ang kabuuang 603,550 at pinananatili sa mga salita ang pormal na estilo ng buod ng sensus.
theological_decisions:
- issue: Kasariang tinutukoy ng sensus
  choice: mga lalaking nabilang
  alternative: mga nabilang / mga nakatala
  rationale: Bagaman walang hiwalay na salitang “lalaki” sa talatang ito, malinaw sa agarang konteksto ng Bilang 1–2 na ang sensus ay sa mga lalaking nasa hustong gulang at maaaring maglingkod sa hukbo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang Hebreong idyomang “mga anak ni Israel,” habang ginawang natural ang paglalarawan sa mga sambahayan, kampo, at organisadong pangkat.
