  yaml_path: translation/ot/numbers/002/007.yaml
  text: 'The tribe of Zebulun[a], and the leader of the sons of Zebulun: Eliab son of Helon.'
translation:
  language: tl
  text: Ang lipi ni Zebulun, at ang pinuno ng mga anak ni Zebulun[a] ay si Eliab na anak ni Helon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa mga anak ni Zebulun.” Maaaring isalin sa higit sa isang magkaugnay na paraan ang pang-ukol sa Hebreo sa pormulang ito tungkol sa pangangasiwa ng lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa konteksto ng pag-aayos ng kampo sa Mga Bilang, tumutukoy ito sa pangkat panlipi, hindi sa literal na tungkod. Ang “lipi” ang likas at malinaw na katumbas sa Filipino.
- source_word: זְבוּלֻן
  choice: Zebulun
  rationale: Pangalan ng tao at ng liping nagmula sa kaniya; ginamit ang karaniwang anyo sa saling Filipino.
- source_word: וְנָשִׂיא
  choice: at ang pinuno
  rationale: Sa kontekstong administratibo, tumutukoy ang נָשִׂיא sa kinikilalang namumuno sa lipi. Malinaw ang “pinuno” at hindi ito nagpapahiwatig ng pagiging maharlika.
- source_word: לִבְנֵי זְבוּלֻן
  choice: ng mga anak ni Zebulun
  rationale: Pinananatili nito ang Hebreong pananalitang panlipi at ang posibleng ugnayang ipinahihiwatig ng pang-ukol ל; maaari rin itong unawaing “para sa mga anak ni Zebulun.”
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Pangalan; tinumbasan sa pamamagitan ng transliterasyon ayon sa karaniwang anyo sa Filipino.
- source_word: בֶּן חֵלֹן
  choice: anak ni Helon
  rationale: Likas na salin sa Filipino ng karaniwang Hebreong pormulang tumutukoy sa ama.
