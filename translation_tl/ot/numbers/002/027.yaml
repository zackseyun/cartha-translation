  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: tl
  text: 'Ang mga nagkakampo sa tabi nito: ang lipi ni Aser[a], at ang pinuno ng mga anak ni Aser, si Pagiel na anak ni Ocran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa kasiping nito.” Maaaring tukuyin ng pang-ukol sa Hebreo ang puwestong kaagapay sa pagkakaayos ng kampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: Ang mga nagkakampo
  rationale: Pinananatili ang participial na diwa ng חנה at likas itong pakinggan sa makabagong Filipino.
- source_word: עָלָיו
  choice: sa tabi nito
  rationale: Sa konteksto ng ayos ng kampo, ipinahihiwatig ng עַל na may hulaping panghalip ang posisyong katabi o kasabay, hindi ang literal na nasa ibabaw.
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa konteksto ng sensus at pagkakaayos ng kampo sa Mga Bilang, tumutukoy ito sa isang tribo o pangkat-angkan; ang “lipi” ay malinaw at karaniwang salin sa Filipino.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Isinatinig ang pangalang pantangi ayon sa nakaugaliang anyo sa Bibliyang Filipino.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy ito sa kinikilalang lider ng lipi; mas malinaw at hindi dinastiko ang “pinuno” kaysa “prinsipe.”
- source_word: לִבְנֵי אָשֵׁר
  choice: ng mga anak ni Aser
  rationale: Pinananatili ang Hebreong idyomang pangkanununuan na “mga anak ni Aser” at ang ugnayan nito sa pinuno.
- source_word: פַּגְעִיאֵל
  choice: Pagiel
  rationale: Isinatinig ang pangalang pantangi sa paraang madaling basahin sa Filipino.
- source_word: בֶּן עָכְרָן
  choice: anak ni Ocran
  rationale: Tuwirang inilalahad ang patronimikong ugnayan sa likas na Filipino.
