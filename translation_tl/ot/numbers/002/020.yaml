id: NUM.2.20
reference: Numbers 2:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עָלָ֖י/ו מַטֵּ֣ה מְנַשֶּׁ֑ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י מְנַשֶּׁ֔ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: tl
  text: At katabi niya ang lipi ni Manases[a]; ang pinuno ng mga anak ni Manases ay si Gamaliel na anak ni Pedasur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasa tabi niya ang lipi ni Manases.” Ipinahihiwatig ng pariralang Hebreo ang magkatabing puwesto sa pagkakaayos ng kampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָיו
  choice: At katabi niya
  rationale: Sa konteksto ng ayos ng kampo, ang עַל na may hulaping panghalip ay tumutukoy sa magkatabing puwesto, hindi sa pagiging nasa ibabaw o pagkakaroon ng awtoridad.
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa konteksto ng sensus at pagkakaayos ng kampo, tumutukoy ang מַטֶּה sa isang lipi ng Israel, hindi sa literal na tungkod.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan ng tao at lipi.
- source_word: וְנָשִׂיא
  choice: ang pinuno
  rationale: Ang נָשִׂיא ay opisyal na pinuno ng lipi; malinaw at likas sa modernong Filipino ang 'pinuno.'
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: ng mga anak ni Manases
  rationale: Pinananatili nito ang tahasang בְּנֵי, 'mga anak,' at ang ugnayang ang pinuno ay kabilang sa o namumuno sa mga anak ni Manases.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Isinalin sa baybay na karaniwan at madaling makilala sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Likas na Filipino para sa Hebreong patronimikong konstruksiyon.
- source_word: פְּדָהצוּר
  choice: Pedasur
  rationale: Isinalin ang pangalan ayon sa baybay at tunog na angkop sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang bahagyang pormal na 'mga anak ni Manases' dahil mahalaga rito ang pagkakakilanlang batay sa angkan; ginamit ang 'katabi' upang likas na ipahayag ang puwesto sa kampo.
