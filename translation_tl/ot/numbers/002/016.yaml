  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: tl
  text: Ang lahat ng binilang sa kampo ni Ruben ay 151,450, ayon sa kani-kanilang pangkat[a]. Sila ang aalis na pangalawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ayon sa kani-kanilang hukbo” o “ayon sa kani-kanilang yunit.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at sila ay aalis na pangalawa,” na tumutukoy sa puwesto ng kampo sa pagkakasunod-sunod ng paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: ang lahat ng binilang
  rationale: Ipinapahayag nito ang kabuuang bilang ng mga naitala sa sensus nang hindi idinaragdag ang salitang “lalaki,” na hindi tahasang nasa talata.
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: sa kampo ni Ruben
  rationale: Natural sa modernong Tagalog at malinaw na iniuugnay ang mga binilang sa pangkat-kampo ni Ruben.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 151,450
  rationale: Eksaktong kabuuan ng mga bilang sa Hebreo; mas madaling basahin ang mga digit sa konteksto ng sensus.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kani-kanilang pangkat
  rationale: Ang צבאות ay tumutukoy sa organisadong mga yunit o hukbo; ang “pangkat” ay malinaw at likas sa Tagalog habang hindi labis na pinipili ang isang tiyak na antas ng yunit militar.
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: Sila ang ikalawang aalis
  rationale: Pinananatili ang kahulugan ng ikalawang puwesto sa pagkakasunod-sunod ng paglalakbay at natural itong pahayag sa Tagalog.
