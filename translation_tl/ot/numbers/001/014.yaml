translation_notes:
  register: Maikli at marangal na modernong Filipino, angkop sa isang talaan ng mga pangalan. Ginamit ang “mula sa Gad” upang malinaw na ipahayag ang pagkatawan sa lipi nang hindi dinaragdagan ang teksto.
