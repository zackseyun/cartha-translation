  text: from Gad[a], Eliasaph son of Deuel;
translation:
  language: tl
  text: mula sa Gad, si Eliasaf na anak ni Deuel[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito at sa kaugnay na talata, ang pangalan ay “Reuel” (ihambing sa Bilang 2:14).
