lexical_decisions:
- source_word: לְ/גָד
  choice: mula sa Gad
  rationale: Sa konteksto ng talaan ng mga pinuno para sa senso, ang לְ ay nagpapahiwatig ng kaugnayan o pagkatawan sa lipi. Ang “mula sa Gad” ay natural na nagsasaad na si Eliasaf ang kinatawan mula sa lipi ni Gad.
- source_word: אֶלְיָסָף
  choice: Eliasaf
  rationale: Isinalin sa baybay na angkop sa modernong Filipino habang pinananatili ang pagkakakilanlan ng pangalang Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang natural at maikling katumbas sa Filipino ng karaniwang pormulang Hebreo sa talaan ng mga pangalan.
- source_word: דְּעוּאֵל
  choice: Deuel
  rationale: Sinusunod ng pangunahing teksto ang anyong דְּעוּאֵל sa WLC. Inilalagay sa talababa ang ibang anyong “Reuel” na makikita sa ilang manuskrito at sa kaugnay na talata.
