translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang kaibahan ng mga Levita sa ibang mga liping ibinilang, pati ang pahiwatig ng angkang nagmumula sa mga ama, nang hindi nagdaragdag ng paliwanag na teolohikal.
