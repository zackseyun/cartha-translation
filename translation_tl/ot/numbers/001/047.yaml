  yaml_path: translation/ot/numbers/001/047.yaml
  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: tl
  text: Ngunit ang mga Levita, ayon sa lipi ng kanilang mga ninuno,[a] ay hindi ibinilang kasama nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ayon sa lipi ng kanilang mga ama.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ay hindi itinala” o “ay hindi tinipon para sa bilang kasama nila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Ngunit ang mga Levita
  rationale: Ginamit ang “Ngunit” sapagkat ipinakikita ng וְ ang pagsalungat sa naunang pagbibilang sa ibang mga lipi; “mga Levita” ang likas at karaniwang tawag sa mga kabilang sa Levi.
- source_word: לְמַטֵּה אֲבֹתָם
  choice: ayon sa lipi ng kanilang mga ninuno
  rationale: Sa konteksto ng sensus, ang מַטֶּה ay “lipi,” at ang אֲבֹתָם ay tumutukoy sa pinagmulang angkan sa panig ng mga ama. Pinananatili ng salin ang diwang genealogical sa natural na Tagalog.
- source_word: לֹא הָתְפָּקְדוּ
  choice: ay hindi ibinilang
  rationale: Sa konteksto ng sensus, ang anyo ng פקד ay tumutukoy sa opisyal na pagtatala o pagbibilang. Malinaw at angkop sa modernong Tagalog ang “hindi ibinilang.”
- source_word: בְּתוֹכָם
  choice: kasama nila
  rationale: Ipinahihiwatig dito ang hindi pagkakasama ng mga Levita sa bilang ng ibang mga lipi; natural na ipinapahayag ito sa Tagalog bilang “kasama nila.”
