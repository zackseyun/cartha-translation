lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: ang mga naitala
  rationale: Tumutukoy ang anyo mula sa פקד sa mga taong naibilang o nairehistro sa sensus. Natural sa makabagong Filipino ang “mga naitala” at hindi nito labis na idinidiin ang aspektong militar.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa paulit-ulit na pormula ng sensus, ipinahihiwatig ng לְ kasama ng מַטֶּה ang kinabibilangang lipi. Ang “mula sa lipi ni” ay malinaw at likas sa Filipino.
- source_word: זְבוּלֻן
  choice: Zebulun
  rationale: Ginamit ang karaniwang transliterasyon sa Filipino ng pangalan ng lipi.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57,400
  rationale: Eksaktong kabuuan ito ng Hebreong bilang. Mas madaling basahin sa makabagong teksto ang anyong numerikal.
