  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: tl
  text: Ngunit ikaw, italaga mo ang mga Levita upang mamahala sa tabernakulo ng Patotoo[a], sa lahat ng kagamitan nito, at sa lahat ng nauukol dito. Sila ang magdadala ng tabernakulo at ng lahat ng kagamitan nito; sila ang maglilingkod dito[b] at magkakampo sa palibot ng tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tahanan ng Patotoo.” Ang salitang Hebreo ay tumutukoy sa banal na tahanan o tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mag-aasikaso rito.” Sa kontekstong ito, ang pandiwa ay tumutukoy sa paglilingkod na kaugnay ng santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Ngunit ikaw
  rationale: Ipinakikita ng parirala ang pag-iiba ng tungkulin ng mga Levita mula sa naunang pagbibilang sa ibang mga lipi.
- source_word: הַפְקֵד ... עַל
  choice: italaga ... upang mamahala sa
  rationale: Ang Hiphil na pautos ng פקד kasama ng עַל ay tumutukoy sa pagtatalaga at pagbibigay ng pananagutan, hindi lamang sa pagbibilang.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: tabernakulo ng Patotoo
  rationale: Ang מִשְׁכָּן ay ang nadadalang banal na tahanan; pinananatili ng 'ng Patotoo' ang ugnayang konstrakto at ang sanggunian sa banal na patotoong nakalagak roon.
- source_word: כֵּלָיו
  choice: mga kagamitan nito
  rationale: Saklaw ng כֵּלִים ang iba't ibang sisidlan, kasangkapan, at banal na kagamitang kaugnay ng tabernakulo.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: lahat ng nauukol dito
  rationale: Malawak ang parirala at tumutukoy sa lahat ng bagay na pag-aari o kaugnay ng tabernakulo.
- source_word: יִשְׂאוּ
  choice: magdadala
  rationale: Sa konteksto ng paglalakbay, ang נשא ay pisikal na pagbuhat at pagdadala sa tabernakulo at mga kagamitan nito.
- source_word: יְשָׁרְתֻהוּ
  choice: maglilingkod dito
  rationale: Ang Piel ng שרת ay may diwang banal o pangsantuaryong paglilingkod; pinananatili ng 'dito' ang hulaping tumutukoy sa tabernakulo nang natural sa Filipino.
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: magkakampo sa palibot ng tabernakulo
  rationale: Ipinahahayag nito ang iniutos na pagkakampo ng mga Levita bilang isang perimeter sa paligid ng santuwaryo.
theological_decisions:
- issue: Kultikong katawagan para sa מִשְׁכָּן
  choice: tabernakulo
  alternative: tahanan; tolda
  rationale: Ang 'tabernakulo' ay malinaw na tumutukoy sa nadadalang santuwaryo at hindi nilulutas nang labis ang literal na larawan ng isang tahanan.
- issue: Kahulugan ng הָעֵדֻת
  choice: Patotoo
  alternative: Kautusan ng Tipan
  rationale: Pinananatili ng 'Patotoo' ang lawak at bahagyang kalabuan ng terminong Hebreo sa halip na tukuyin agad ang eksaktong bagay na tinutukoy nito.
- issue: Banal na paglilingkod sa שרת
  choice: maglilingkod dito
  alternative: mag-aasikaso rito
  rationale: Ipinahihiwatig nito ang paglilingkod sa santuwaryo nang hindi nagdaragdag ng mga tungkuling hindi tahasang binanggit sa talata.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang kinikilalang terminong 'tabernakulo,' samantalang ang mga pandiwa ay piniling maging malinaw sa karaniwang mambabasa. Ang mga panghalip na 'dito/rito' ay tumutukoy sa tabernakulo.
