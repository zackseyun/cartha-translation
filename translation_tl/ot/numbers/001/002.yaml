id: NUM.1.2
reference: Numbers 1:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: tl
  text: Magsagawa kayo ng sensus[a] sa buong kapulungan ng mga anak ni Israel[b], ayon sa kanilang mga angkan at sa sambahayan ng kanilang mga ama, ayon sa bilang ng mga pangalan—bawat lalaki, isa-isa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “itaas ninyo ang ulo ng”; ibig sabihin, bilangin o itala para sa isang sensus.
    reason: lexical_alternative
  - marker: b
    text: O, “mga Israelita.” Literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: c
    text: Literal, “ayon sa kanilang mga bungo [o ulo],” isang idyoma para sa pagbilang sa bawat tao nang isa-isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: Magsagawa kayo ng sensus
  rationale: Ang literal na idyomang Hebreo ay “itaas ninyo ang ulo,” ngunit sa kontekstong administratibo ay nangangahulugang bilangin o itala ang mga tao sa isang sensus. Malinaw at likas sa modernong Filipino ang piniling salin.
- source_word: כָּל עֲדַת
  choice: sa buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sambayanan o korporatibong kapulungan ng Israel. Pinananatili ng “kapulungan” ang kolektibong diwa nang hindi ito ginagawang masyadong malaya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang larawang pampamilya at ang tahasang anyo ng Hebreo; inilalahad sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa kontekstong ito, ang מִשְׁפָּחָה ay mga pangkat na nakabatay sa pagkakamag-anak sa loob ng mga lipi. Mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: לְבֵית אֲבֹתָם
  choice: sa sambahayan ng kanilang mga ama
  rationale: Pinananatili ng salin ang organisasyon ayon sa linya ng ama na tahasang nasa Hebreo, nang hindi nagdaragdag ng interpretasyon.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: ayon sa bilang ng mga pangalan
  rationale: Pinananatili nito ang pormal at administratibong paglalarawan ng pagtatala batay sa mga pangalan.
- source_word: כָּל זָכָר
  choice: bawat lalaki
  rationale: Tiyak na tumutukoy ang זָכָר sa mga lalaking kasarian. Sa Filipino, likas at sapat na tiyak sa kontekstong ito ang “bawat lalaki.”
- source_word: לְגֻלְגְּלֹתָם
  choice: isa-isa
  rationale: Literal itong “ayon sa kanilang mga bungo/ulo,” isang idyoma para sa indibiduwal na pagbilang. Ang “isa-isa” ang malinaw na kahulugan sa Filipino, habang pinananatili sa talababa ang konkretong larawan ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “sensus” para sa opisyal na pagbilang, “angkan” para sa yunit ng pagkakamag-anak, at “sambahayan ng kanilang mga ama” upang mapanatili ang estrukturang ayon sa ama sa tekstong Hebreo. Ang lahat ng marker ng talababa ay inilagay sa mismong teksto sa kaukulang parirala.
