source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: tl
  text: Ang mga anak ni Ruben, na panganay ni Israel, ayon sa kanilang mga salinlahi, mga angkan, at mga sambahayan ng kanilang mga ama, ayon sa bilang ng mga pangalan, isa-isa[a]—lahat ng lalaking dalawampung taong gulang pataas, lahat ng lumalabas upang makidigma—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ayon sa kanilang mga bungo,” isang idyomang nangangahulugang hiwalay na binilang ang bawat tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי רְאוּבֵן
  choice: Ang mga anak ni Ruben
  rationale: Ang וַיִּהְיוּ ay bahagi ng pormulang pangsenso at likas na naisasama sa nominal na pambungad sa Tagalog; pinananatili ng “mga anak” ang konkretong anyo ng בְנֵי habang saklaw ang mga kaapu-apuhan ng lipi.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: na panganay ni Israel
  rationale: Tuwirang kinikilala si Ruben bilang panganay ni Israel at malinaw ang appositional na kaugnayan sa natural na Tagalog.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Ipinahihiwatig ng תּוֹלְדֹת ang pagkakahati batay sa linya ng angkan o salinlahi nang hindi ipinapalagay na tumutukoy ito sa nakasulat na mga rekord.
- source_word: לְמִשְׁפְּחֹתָם
  choice: mga angkan
  rationale: Ang “angkan” ay angkop sa yunit sa loob ng lipi at naihihiwalay ito sa mas maliit na sambahayan ng ama na kasunod.
- source_word: לְבֵית אֲבֹתָם
  choice: mga sambahayan ng kanilang mga ama
  rationale: Pinananatili nito ang teknikal at patriyarkal na estruktura ng pariralang Hebreo nang hindi gumagamit ng lipas o mahirap na pananalita.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: ayon sa bilang ng mga pangalan
  rationale: Malapit ito sa Hebreo at ipinakikitang binilang ang mga taong nakatala sa pangalan.
- source_word: לְגֻלְגְּלֹתָם
  choice: isa-isa
  rationale: Idyoma itong literal na tumutukoy sa mga ulo o bungo ngunit ang diwa ay hiwalay na pagbilang sa bawat tao; inilalagay sa talababa ang konkretong larawan ng Hebreo.
- source_word: כָּל זָכָר
  choice: lahat ng lalaki
  rationale: Tiyak na tumutukoy ang Hebreo sa kasariang lalaki; natural at malinaw sa modernong Tagalog ang “lahat ng lalaki.”
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: dalawampung taong gulang pataas
  rationale: Karaniwang Tagalog ito para sa hangganan ng edad at tumpak na ipinahahayag ang Hebreong pormula.
- source_word: כֹּל יֹצֵא צָבָא
  choice: lahat ng lumalabas upang makidigma
  rationale: Pinananatili ang aktibong anyo ng participle na “lumalabas” at ang kontekstong militar, sa halip na tahasang idagdag ang ideyang “may kakayahan” na hindi nakasaad bilang hiwalay na salita.
