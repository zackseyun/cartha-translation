translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga terminong “salinlahi,” “angkan,” at “sambahayan ng kanilang mga ama” upang mapanatili ang magkakaibang antas ng organisasyong pampamilya. Ang pangwakas na gitling ay nagpapakitang nagpapatuloy sa susunod na talata ang pangungusap at ang kabuuang bilang.
