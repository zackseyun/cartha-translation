base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: tl
  text: 'Sa mga anak ni Benjamin, ayon sa kanilang mga salinlahi, ayon sa kanilang mga angkan, ayon sa mga sambahayan ng kanilang mga ama, ayon sa bilang ng mga pangalan, mula dalawampung taong gulang pataas, lahat ng maaaring lumabas upang makipagdigma[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang idyomang Hebreo ay tumutukoy sa mga karapat-dapat sa paglilingkod-militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: Sa mga anak ni Benjamin
  rationale: Pinananatili ang pormulang pantribo at ang tahasang pananalitang 'mga anak,' habang natural na ipinakikilala sa Filipino ang pangkat na binibilang.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Ipinahahayag ang pag-uuri ayon sa angkan o pinagmulan nang hindi ginagawang makabagong terminong burukratiko ang pormula.
- source_word: לְמִשְׁפְּחֹתָם
  choice: mga angkan
  rationale: Ang 'angkan' ay angkop sa organisasyong pantribo at naihihiwalay sa kasunod na mas maliit na sambahayan ng mga ninuno.
- source_word: לְבֵית אֲבֹתָם
  choice: mga sambahayan ng kanilang mga ninuno
  rationale: Natural at malinaw sa modernong Filipino, habang pinananatili ang diwa ng yunit ng kamag-anakang tinutukoy ng literal na 'bahay ng mga ama.'
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: ayon sa bilang ng mga pangalan
  rationale: Malapit sa pormula ng Hebreo at ipinakikitang isa-isang ibinilang ang mga nakatalang tao.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Likas na Filipino para sa takdang pinakamababang edad at tumpak sa kahulugan ng Hebreo.
- source_word: כֹּל יֹצֵא צָבָא
  choice: ang lahat ng maaaring lumabas upang makipagdigma
  rationale: Inilalahad ang gamit-militar ng idyoma nang hindi tahasang idinaragdag sa pangunahing teksto ang salitang 'lalaki,' na hindi leksikal na nakasulat sa parirala bagaman ipinahihiwatig ng konteksto.
