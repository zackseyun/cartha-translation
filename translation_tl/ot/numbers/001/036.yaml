translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormulang pangsenso at ang sunod-sunod na mga kategorya ng angkan, ngunit ginamit ang natural na 'mga sambahayan ng kanilang mga ninuno' sa halip na ang matigas na literal na 'mga bahay ng kanilang mga ama.'
