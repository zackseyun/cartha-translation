id: NUM.1.1
reference: Numbers 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh kay Moises sa ilang ng Sinai, sa Tolda ng Pakikipagtagpo[a], noong unang araw ng ikalawang buwan, sa ikalawang taon matapos silang lumabas mula sa lupain ng Ehipto, at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tolda ng pakikipagtagpo”; tradisyonal na tinatawag na “tabernakulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Karaniwang pandiwang pasalaysay ito na nagpapakilala sa pagsasalita ng Diyos; likas at tuwiran ang “nagsalita” sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּמִדְבַּר סִינַי
  choice: sa ilang ng Sinai
  rationale: Ang “ilang” ay natural na salin ng מִדְבָּר at hindi nito ipinapalagay na purong mabuhanging disyerto ang lugar.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa tolda ng pakikipagtagpo
  rationale: Malinaw nitong ipinapahayag ang literal na diwa ng toldang itinakda para sa pakikipagtagpo, nang hindi gumagamit ng di-gaanong malinaw na tradisyonal na terminong “tabernakulo.”
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: nang unang araw ng ikalawang buwan
  rationale: Likas na paraang Tagalog ito ng pagtukoy sa tiyak na petsa.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: sa ikalawang taon
  rationale: Tuwirang pinananatili ang panandang panahon ng Hebreo.
- source_word: לְצֵאתָם
  choice: mula nang lumabas sila
  rationale: Ipinahahayag nito ang panahong binibilang mula sa paglabas ng Israel, habang nananatiling natural sa Tagalog.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang salitang “lupain” sa tekstong Hebreo.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ang pormulang Hebreo ay nagpapakilala sa mismong mensaheng susunod. Ang hiwalay na “Sinabi niya,” ay mas likas sa modernong Tagalog kaysa sa isang mahabang pangungusap na nagtatapos sa “na sinasabi.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ilang,” “tolda,” at “lupain” bilang payak ngunit dignidad na bokabularyo. Inilagay ang pananda ng talababa pagkatapos mismo ng pariralang tinutukoy nito.
