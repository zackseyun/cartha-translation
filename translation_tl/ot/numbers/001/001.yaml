  terminology: Ang “Yahweh,” “ilang,” “Tolda ng Pakikipagtagpo,” at “lupain ng Ehipto” ay angkop sa modernong Filipino Tagalog at matapat sa Hebreo. Ginawang malaking titik ang katawagang Tolda ng Pakikipagtagpo bilang natatanging santuwaryong tinutukoy sa konteksto.
