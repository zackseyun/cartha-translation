  text: for Judah, Nahshon son of Amminadab;
translation:
  language: tl
  text: para sa Juda, si Naason na anak ni Aminadab;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִיהוּדָה
  choice: para sa Juda
  rationale: Ang prefiks na לִ־ ay nagpapahayag dito ng kaugnayan o pagkatawan sa talaan ng mga pinuno ng mga lipi; likas na ipinahahayag ng “para sa Juda” na si Naason ang kinatawan ng lipi.
- source_word: נַחְשׁוֹן
  choice: Naason
  rationale: Isinalin sa anyong pangalang nakasanayan sa modernong saling Filipino, alinsunod din sa tradisyong Griyego-Latin na pinagmulan ng karaniwang anyo nito.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa construct chain na sinusundan ng personal na pangalan, tumutukoy ito rito sa tuwirang ugnayang ama-anak; “anak ni” ang natural at tumpak na anyo sa Tagalog.
- source_word: עַמִּינָדָב
  choice: Aminadab
  rationale: Ginamit ang nakasanayang anyo ng personal na pangalan sa Filipino, na malinaw at madaling makilala ng mga mambabasa.
