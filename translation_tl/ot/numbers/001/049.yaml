  terminology: Ang “lipi” ay angkop para sa מַטֶּה sa kontekstong pampangkat at sensus. Ang “mga anak ni Israel” ay pinananatili bilang malapit na katumbas ng בְּנֵי יִשְׂרָאֵל; ang talababa ay wastong nagbibigay ng “mga Israelita” bilang alternatibo.
