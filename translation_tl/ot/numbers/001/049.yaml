  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: tl
  text: Tanging ang lipi ni Levi ang huwag mong ibilang, at huwag mo ring isama ang kanilang bilang sa mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Naghuhudyat ito rito ng malinaw na eksepsiyon sa naunang utos tungkol sa sensus. Likas sa Filipino ang “ngunit” sa pagsalungat na ito, habang pinatitibay ng buong sugnay ang diwang “maliban lamang.”
- source_word: מַטֵּה לֵוִי
  choice: ang lipi ni Levi
  rationale: Sa konteksto ng sensus, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod.
- source_word: תִפְקֹד
  choice: bilangin
  rationale: Ang פקד dito ay pagbilang sa isang sensus; malinaw at karaniwan sa modernong Filipino ang “bilangin.”
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: isama ang bilang nila
  rationale: Ang literal na larawan ng ‘itaas ang kanilang ulo’ ay isang idyoma ng sensus. Ipinahahayag ng salin ang diwang huwag silang isama sa kabuuang bilang.
- source_word: בְּתוֹךְ
  choice: sa bilang ng
  rationale: Sa kontekstong ito, ipinahihiwatig nito ang pagsasama sa mas malaking pangkat na binibilang; natural itong naipapahayag sa Filipino bilang pagsama sa bilang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pormal na ugnayan sa Hebreong ‘mga anak ni Israel’ habang nananatiling likas at marangal sa Filipino.
theological_decisions:
- issue: Ang kasariang nakapaloob sa katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang Hebreo ay literal na ‘mga anak na lalaki ni Israel,’ ngunit karaniwang katawagan ito sa buong bansang Israel. Ang “mga anak ni Israel” ay pormal na malapit sa Hebreo at hindi nagpapasya nang higit sa saklaw ng katawagang pambansa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang pang-isahang “mong” sapagkat si Moises ang tuwirang kinakausap. Ang pag-uulit ng “bilang” ay sadyang pinanatili upang maging malinaw ang dalawang magkaugnay na pagbabawal sa konteksto ng sensus.
