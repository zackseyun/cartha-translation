  naturalness: Nauunawaan ang draft, ngunit ang “Labindalawang lalaki ang mga pinuno, at bawat isa ay kumakatawan” ay medyo putol at nagdaragdag ng paliwanag sa pangunahing teksto. Mas malinaw at likas ang paglalagay ng “labindalawang lalaki” bilang pagpapaliwanag sa mga pinuno.
  terminology: Ang “mga pinuno ng Israel,” “mga nabilang,” at “sambahayan ng ... mga ninuno” ay angkop sa modernong Filipino Tagalog at pinananatili ang pantribong at patrilinyal na konsepto ng בית אבות.
