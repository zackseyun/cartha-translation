translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap ang mahabang estrukturang Hebreo upang maging madaling maunawaan, habang pinananatiling mga kasamang tagabilang ang mga pinuno ng Israel at inilalahad ang kanilang bilang at tungkuling kinatawan.
