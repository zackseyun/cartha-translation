base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: tl
  text: Ito ang mga nabilang[a] na binilang nina Moises, Aaron, at ng mga pinuno ng Israel—labindalawang lalaki, na tig-isa para sa sambahayan ng kani-kanilang mga ninuno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga itinala sa sensus.” Maaaring idiin ng Hebreo ang mga taong binilang o ang pagkakatala sa kanila sa sensus.
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan ng mga ninuno” ay tumutukoy sa yunit ng angkan o malawak na sambahayan sa kaayusang pantribo ng Israel, na kinikilala ayon sa linya ng mga ama.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: mga nabilang
  rationale: Ang pasibong anyo mula sa פקד sa konteksto ng sensus ay tumutukoy sa mga taong isinama sa bilang. Pinananatili ng “mga nabilang” ang personal na reperensiya at ang kaugnayan nito sa kasunod na pandiwang “binilang.”
- source_word: פָּקַד
  choice: binilang
  rationale: Sa Bilang 1, tumutukoy ang pandiwa sa pagsasagawa ng sensus. Ang “binilang” ay malinaw at likas sa modernong Tagalog.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: mga pinuno ng Israel
  rationale: Tumutukoy ang נָשִׂיא sa mga pinunong pantribo. Mas malinaw ang “mga pinuno” kaysa “mga prinsipe,” na maaaring magpahiwatig ng maharlikang angkan.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: labindalawang lalaki
  rationale: Tahasang panlalaki ang אִישׁ, kaya pinanatili ang “lalaki” sa halip na gawing neutral ang katawagan.
- source_word: אִישׁ אֶחָד
  choice: bawat isa
  rationale: 'Distributibo ang parirala: tig-iisang lalaki. Likas sa Tagalog ang “bawat isa” at malinaw na inuugnay ang bawat pinuno sa kani-kaniyang sambahayan ng mga ninuno.'
- source_word: לְבֵית אֲבֹתָיו
  choice: kumakatawan sa sambahayan ng kaniyang mga ninuno
  rationale: Ang לְ ay nagpapahiwatig dito ng kaugnayan o tungkuling kinatawan, at ang בֵּית אָבוֹת ay isang yunit ng angkan batay sa linya ng mga ama. Nililinaw ng “kumakatawan” ang tungkulin nang hindi pinapantay ang yunit sa karaniwang makabagong nukleyar na pamilya.
- source_word: הָיוּ
  choice: ang mga pinuno … bawat isa ay
  rationale: Ang pangmaramihang copula ay nag-uugnay sa labindalawang pinuno sa paglalarawang tig-iisa sila para sa kani-kanilang sambahayan ng mga ninuno. Isinaayos ito bilang likas na sugnay sa Tagalog.
