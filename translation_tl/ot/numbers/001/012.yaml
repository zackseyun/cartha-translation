lexical_decisions:
- source_word: לְ/דָן
  choice: Para sa Dan
  rationale: Ang unlaping לְ ay nagpapakilala rito sa kinatawan ng Dan sa talaan. Pinananatili ng “Para sa Dan” ang maikli at malinaw na kayarian ng Hebreo nang hindi idinaragdag ang salitang “lipi.”
- source_word: אֲחִיעֶזֶר
  choice: Ahiezer
  rationale: Isinalin sa baybay na madaling kilalanin sa Filipino habang malapit sa nakaugaliang transliterasyon ng pangalang Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa pormulang pagkakakilanlan, natural at tumpak sa modernong Filipino ang “anak ni” para sa ugnayang ipinahahayag ng בֶּן.
- source_word: עַמִּישַׁדָּי
  choice: Amisadai
  rationale: Ginamit ang Filipino-friendly na transliterasyon ng personal na pangalan, na kumakatawan sa mga katinig at patinig ng Hebreo nang hindi ito isinasalin ayon sa kahulugan.
