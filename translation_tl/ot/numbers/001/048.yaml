lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive kasama ng דִּבֵּר ay nagpapatuloy sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, nagsalita” at napapanatili nito ang diwa ng sunod-sunod na pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay tumutukoy sa taong kinakausap; “kay” ang natural na katumbas bago ang pangalang Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang karaniwan at kinikilalang anyo ng pangalang Hebreo sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi,
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa tuwirang pahayag. Bagaman mas magaan sa Tagalog ang simpleng “sinabi,” ang saling ito ay nagpapanatili sa hiwalay na tungkulin ng infinitive construct.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay mas tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormulang pananalita ng Hebreo nang hindi gumagamit ng lipas na bokabularyo.
