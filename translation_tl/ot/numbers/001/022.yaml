translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Tagalog. Pinanatili ang pormulang pangsensus at ang pangwakas na tutuldok dahil nagpapatuloy sa kasunod na talata ang bilang ng mga naitala. Inilagay ang bawat talababa sa pariralang talagang ipinaliliwanag nito.
