  text: לִ/בְנֵ֣י שִׁמְע֔וֹן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם פְּקֻדָ֗י/ו בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: tl
  text: 'Para sa mga anak ni Simeon: ang mga itinala[a], ayon sa kanilang mga salinlahi, mga angkan, at mga sambahayan ng kanilang mga ama, ayon sa bilang ng mga pangalan, isa-isa[b]—bawat lalaking dalawampung taong gulang pataas, lahat ng lumalabas upang makipagdigma[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga tinipon para bilangin.” Ang salitang Hebreo mula sa פקד ay maaaring tumukoy sa pagtatala sa sensus o sa pagtitipon para sa hukbo sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa kanilang mga bungo/ulo,” isang idyoma na nangangahulugang binilang ang bawat isa.
    reason: cultural_note
  - marker: c
    text: Maaari ring “lahat ng karapat-dapat sa paglilingkod sa hukbo.” Mas literal sa Hebreo ang “lahat ng lumalabas upang makipagdigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: Sa mga anak ni Simeon
  rationale: Pinananatili ng “mga anak” ang pormal na kaugnayan sa ninunong si Simeon; sa konteksto, tumutukoy ito sa mga lalaking kabilang sa kanyang lipi.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Ipinahahayag nito ang pagkakaayos batay sa linya ng angkan o salinlahi sa talaang genealogical.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Ang מִשְׁפָּחָה ay yunit ng pagkakamag-anak sa loob ng isang lipi; mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa mga sambahayan ng kanilang mga ninuno
  rationale: Ang parirala ay tumutukoy sa organisasyong panlipunan batay sa sambahayan ng ama. Iniiwasan ng saling ito ang di-likas na literal na “bahay ng mga ama” habang pinananatili ang ugnayang minana sa mga ninuno.
- source_word: פְּקֻדָיו
  choice: ang mga itinala
  rationale: Ang anyo mula sa פקד ay tumutukoy sa mga taong naitala o nabilang sa sensus; hindi agad pinatitindi ang diwang militar.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: ayon sa bilang ng mga pangalan
  rationale: Pinananatili nito ang pormal na pahayag na ang sensus ay isinagawa sa pamamagitan ng indibiduwal na mga pangalan.
- source_word: לְגֻלְגְּלֹתָם
  choice: isa-isa
  rationale: Literal itong “ayon sa kanilang mga bungo/ulo,” isang idyoma para sa indibiduwal na pagbibilang. Ang “isa-isa” ang natural na katumbas sa modernong Tagalog.
- source_word: כָּל זָכָר
  choice: bawat lalaki
  rationale: Tinutukoy ng זָכָר ang kasariang lalaki sa pormula ng sensus; malinaw at likas sa Tagalog ang “bawat lalaki.”
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: dalawampung taong gulang pataas
  rationale: Natural at tumpak itong salin ng karaniwang pormula para sa pinakamababang edad.
- source_word: כֹּל יֹצֵא צָבָא
  choice: lahat ng lumalabas upang makipagdigma
  rationale: Malapit ito sa literal na “lahat ng lumalabas sa hukbo/digmaan” at pinananatili ang kongkretong ekspresyon sa halip na ipakahulugang “karapat-dapat sa serbisyo militar.”
