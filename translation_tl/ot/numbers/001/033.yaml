lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: ang mga nakatala
  rationale: Tumutukoy ito sa mga naitala o nabilang sa sensus. Likas sa makabagong Filipino ang “mga nakatala” at hindi nito labis na idinidiin ang aspektong militar.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa pormulang ito ng sensus, ipinahihiwatig ng לְ na kabilang sila sa tinukoy na lipi; malinaw at natural sa Filipino ang “mula sa lipi ni.”
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo na Ephraim.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: apatnapung libo at limang daan
  rationale: Tuwirang paglilipat ng bilang na 40,500, na binaybay sa tuloy-tuloy na tekstong biblikal para sa natural at marangal na pagbasa.
