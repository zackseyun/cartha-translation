  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: tl
  text: Kaya ginawa ng mga anak ni Israel[a] ang lahat ayon sa iniutos ni Yahweh kay Moises; gayon nga ang ginawa nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa literal, “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ginawa
  rationale: Ang עשה ay malawak na pandiwang nangangahulugang “gawin” o “likhain.” Dito, ang “ginawa” ang natural na buod ng kanilang pagsunod.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawan ng Hebreong “mga anak na lalaki ni Israel,” ngunit ginagamit ang mas natural at kolektibong “mga anak” sa Tagalog. Inilalahad sa talababa ang idiomatikong alternatibong “mga Israelita.”
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ayon sa
  rationale: Ipinahahayag nito na ang ginawa nila ay lubos na naaayon sa buong iniutos, habang nananatiling natural ang ayos sa Tagalog.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang ganap na anyo ng pandiwa ay tumutukoy sa utos na nauna sa pagkilos ng Israel; likas nang naihahayag ng konteksto at ayos ng Tagalog ang pagkakasunod na ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Si Moises ang tuwirang tumanggap ng utos; ang “kay Moises” ang natural na hulma sa Tagalog pagkatapos ng “iniutos.”
- source_word: כֵּן עָשׂוּ
  choice: gayon nga ang ginawa nila
  rationale: Pinananatili ang mariing pag-uulit ng Hebreo at binibigyang-diin ang eksaktong pagtupad sa utos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang anyong pampamilya ng Hebreo. Hindi tahasang nilulutas ng parirala kung ang diin ay sa mga lalaking kasapi o sa buong bayang nagmula kay Israel; kaya ibinibigay ang kolektibong alternatibo sa talababa.
translation_notes:
  register: Makabago at marangal na Tagalog. Pinanatili ang mariing pag-uulit sa hulihan ng Hebreo, at ginamit ang “Yahweh” bilang pangalan ng Diyos.
