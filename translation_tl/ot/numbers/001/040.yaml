  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לִ/בְנֵ֣י אָשֵׁ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: tl
  text: Sa mga anak ni Aser, ayon sa kanilang mga salinlahi, mga angkan, at mga sambahayan ng kanilang mga ninuno, ayon sa bilang ng mga pangalan, mula dalawampung taong gulang pataas, ang lahat ng lumalabas upang makipagdigma:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang bawat lumalabas upang makipagdigma,” isang idyoma para sa mga karapat-dapat sa paglilingkod militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: Sa mga anak ni Aser
  rationale: Pinananatili ang pananalitang pangangkan na “mga anak,” na sa konteksto ay tumutukoy sa tribo o mga inapo ni Aser; ang לְ ay nagpapakilala sa susunod na pangkat sa talaan.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Ipinapahayag ang pagkakahati ayon sa linya ng angkan nang hindi ipinapalagay na nakasulat na talaangkanan ang tahasang tinutukoy.
- source_word: לְמִשְׁפְּחֹתָם
  choice: mga angkan
  rationale: Sa konteksto ng pagtatala ng tribo, ang מִשְׁפָּחָה ay isang pangkat ng magkakamag-anak sa loob ng tribo; mas tiyak dito ang “angkan” kaysa pangkalahatang “pamilya.”
- source_word: לְבֵית אֲבֹתָם
  choice: mga sambahayan ng kanilang mga ninuno
  rationale: Natural na Filipino ito para sa kinikilalang yunit ng pagkakamag-anak na literal na “bahay ng kanilang mga ama,” habang pinananatili ang ideya ng angkang pinagmulan.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: ayon sa bilang ng mga pangalan
  rationale: Pinananatili ang pormulang nagpapahiwatig na isa-isang binilang ang mga taong nakatala sa pangalan.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Karaniwan at malinaw na Filipino para sa takdang gulang na dalawampu at higit pa.
- source_word: כֹּל יֹצֵא צָבָא
  choice: ang lahat ng lumalabas upang makipagdigma
  rationale: Malapit ito sa literal na idyomang Hebreo at hindi tahasang nagdaragdag ng “may kakayahan,” bagaman sa konteksto ay tumutukoy sa mga karapat-dapat sa paglilingkod militar.
