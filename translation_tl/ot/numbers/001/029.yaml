lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: ang mga nabilang
  rationale: Nagmula sa ugat na פקד at tumutukoy sa mga naitala o nabilang sa konteksto ng sensus. Likas sa modernong Filipino ang “mga nabilang” at hindi ito tahasang nagdaragdag ng “mga lalaki,” na wala sa mismong pormula ng talatang ito.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa pormula ng sensus, ipinahihiwatig ng לְ kasama ng מַטֶּה ang kinabibilangang lipi. Ang “mula sa lipi ni” ay malinaw at natural sa Filipino.
- source_word: יִשָּׂשכָר
  choice: Isacar
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 54,400
  rationale: Eksaktong inilalahad ang bilang sa karaniwang makabagong notasyong numerikal upang maging madaling basahin.
