  language: tl
  text: Ang mga nabilang mula sa lipi ni Isacar ay 54,400.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanilang bilang” o “ang mga nakatala.” Ang salitang Hebreo ay tumutukoy sa mga itinala o binilang sa sensus.
