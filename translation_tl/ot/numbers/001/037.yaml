  text: Those counted from the tribe of Benjamin were thirty-five thousand four hundred.
translation:
  language: tl
  text: Ang mga nabilang mula sa lipi ni Benjamin ay tatlumpu't limang libo at apat na raan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: ang mga nabilang
  rationale: Ipinahahayag ng anyong mula sa פקד ang mga taong naisama sa sensus. Likas sa makabagong Tagalog ang “mga nabilang” at hindi nito idinaragdag ang “mga lalaki,” na mula sa mas malawak na konteksto ngunit hindi tahasang nasa talatang ito.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa paulit-ulit na pormula ng sensus, tinutukoy ng לְמַטֵּה ang kinabibilangang lipi. Ang “mula sa lipi ni” ay malinaw at natural sa Tagalog.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Filipino.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: tatlumpu't limang libo at apat na raan
  rationale: Isinalin sa karaniwang ayos ng bilang sa makabagong Tagalog habang pinananatili ang eksaktong kabuuang 35,400.
