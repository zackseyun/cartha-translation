  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: tl
  text: Mula sa dalawampung taong gulang pataas, kayo ni Aaron ang magbilang, ayon sa kani-kanilang pangkat-militar[b], ng bawat lalaking Israelita na lumalabas upang makipagdigma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong pananalitang ito ay isang idyomang militar para sa mga karapat-dapat sa paglilingkod militar; nililinaw ng konteksto ng kabanata na mga lalaki ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa kani-kanilang pangkat” o “ayon sa kani-kanilang yunit-militar.”
