lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: Mula sa dalawampung taong gulang pataas
  rationale: Likas na Filipino ito para sa idyomang nagsasaad ng pinakamababang edad.
- source_word: כָּל יֹצֵא צָבָא בְּיִשְׂרָאֵל
  choice: bawat lalaking Israelitang maaaring maglingkod sa hukbo
  rationale: Ang יֹצֵא צָבָא ay idyomang militar para sa mga kuwalipikadong maglingkod; ipinapakita ng konteksto ng kabanata na mga lalaki ang tinutukoy.
- source_word: תִּפְקְדוּ אֹתָם
  choice: magbilang
  rationale: Sa konteksto ng sensus, tumutukoy ang פקד sa pagbibilang o pagtatala para sa paglilingkod.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kani-kanilang pangkat-militar
  rationale: Ipinahihiwatig ng maramihang צבאות ang pagkakaayos sa mga yunit para sa paglilingkod militar.
- source_word: אַתָּה וְאַהֲרֹן
  choice: kayong dalawa ni Aaron
  rationale: Malinaw at natural na ipinahahayag sa Filipino ang tahasang paksa at ang pagbibigay-diin sa dalawang inatasan.
theological_decisions:
- issue: Kasariang tinutukoy sa pagiging karapat-dapat sa paglilingkod militar
  choice: bawat lalaking Israelitang maaaring maglingkod sa hukbo
  alternative: bawat Israelitang maaaring maglingkod sa hukbo
  rationale: Ang panlalaking anyo at ang konteksto ng sensus sa kabanata ay partikular na tumutukoy sa mga lalaki; hindi dapat gawing neutral ang kasarian.
- issue: Konkretong idyoma laban sa malinaw na kahulugan
  choice: maaaring maglingkod sa hukbo
  alternative: lumalabas upang makipagdigma
  rationale: Mas natural sa modernong Filipino ang pagpapahayag sa kahulugan ng idyomang militar, habang inilalagay sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “hukbo” at “pangkat-militar” upang mapanatili ang kontekstong militar nang hindi nagiging makaluma; natural na inayos ang paksa bilang “kayong dalawa ni Aaron.”
