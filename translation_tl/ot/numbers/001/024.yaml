translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang pangsensus at ang teknikal na pagkakasunod-sunod ng mga pangkat ng kamag-anakan, habang iniwasan ang sobrang literal at di-likas na ayos. Ginamit ang tutuldok dahil nagpapatuloy ang pangungusap sa bilang sa kasunod na talata.
