  text: לִ/בְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: tl
  text: 'Sa mga anak ni Gad[a], ayon sa kanilang mga salinlahi, mga angkan[b], at mga sambahayan ng kanilang mga ama, ayon sa bilang ng mga pangalan, mula dalawampung taong gulang pataas—bawat lalaking maaaring maglingkod sa hukbo[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Gad.” Sa sensus na ito, tumutukoy ang pananalita sa mga lalaking kabilang sa lipi na binibilang.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “mga pamilya.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “bawat lumalabas para sa tungkuling militar,” o “bawat lumalabas upang makidigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: Sa mga anak ni Gad
  rationale: Ang לְ ay nagpapakilala sa pangkat ng lipi sa pormula ng sensus. Pinanatili ang Hebreong idyomang “mga anak ni Gad,” na sa kontekstong ito ay tumutukoy sa mga lalaking kabilang sa lipi.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Tumutukoy ito sa pagkakabukod ayon sa angkan o pinagmulan. Ang “mga salinlahi” ay malapit sa pormal na pormula nang hindi ipinapalagay na nakasulat na talaan ang tinutukoy.
- source_word: לְמִשְׁפְּחֹתָם
  choice: mga angkan
  rationale: Sa konteksto ng pagkakaayos ng isang lipi, mas angkop ang “angkan” kaysa “pamilya,” na maaaring unawain bilang maliit na sambahayan lamang.
- source_word: לְבֵית אֲבֹתָם
  choice: mga sambahayan ng kanilang mga ama
  rationale: Pinananatili nito ang istrukturang nakabatay sa ama sa teknikal na katawagang Hebreo, ngunit gumagamit ng malinaw at likas na Filipino.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: ayon sa bilang ng mga pangalan
  rationale: Ipinahihiwatig ng parirala ang pagbibilang sa mga tao ayon sa kani-kanilang pangalan at pinananatili ang pormal na pananalita ng sensus.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Likas na Filipino ito para sa takdang edad na ipinahahayag ng literal na Hebreong “mula sa anak na dalawampung taon at pataas.”
- source_word: כֹּל יֹצֵא צָבָא
  choice: bawat lalaking maaaring maglingkod sa hukbo
  rationale: Sa konteksto, tinutukoy nito ang mga lalaking kuwalipikado sa paglilingkod militar. Ang “maaaring” ay naghahayag ng pagiging karapat-dapat, hindi lamang ng literal na paglabas.
