  source_fidelity: 'Tumpak ang pangunahing salin sa pormula ng sensus: ang mga salinlahi, angkan, sambahayan ng mga ama, bilang ng mga pangalan, at hangganang edad ay maayos na naipahayag. Ang “bawat lalaking maaaring maglingkod sa hukbo” ay isang katanggap-tanggap na kontekstuwal na paglalahad ng כֹּל יֹצֵא צָבָא, na tumutukoy sa mga lalaking para sa tungkuling militar.'
  naturalness: Likas, malinaw, at angkop ang marangal na rehistro. Ang sunod-sunod na “ayon sa” ay katanggap-tanggap dahil sinasalamin nito ang pormal at paulit-ulit na ayos ng listahang sensus.
