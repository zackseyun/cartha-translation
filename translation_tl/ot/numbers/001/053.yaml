id: NUM.1.53
reference: Numbers 1:53
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: tl
  text: Ngunit magkakampo ang mga Levita sa palibot ng tabernakulo ng Patotoo, upang walang poot na sumapit sa kapulungan ng mga anak ni Israel[a]. Tutuparin ng mga Levita ang tungkuling bantayan ang tabernakulo ng Patotoo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “upang walang poot laban sa kapulungan ng mga anak ni Israel.”'
    reason: Pinahihintulutan ng pang-ukol na עַל ang mas tuwirang diwang “laban sa” o “sa ibabaw ng,” samantalang mas natural sa pangunahing salin ang “sumapit sa.”
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Ngunit ... ang mga Levita
  rationale: Ang וְ ay nag-uugnay sa naunang tagubilin ngunit may paghahambing o pagtatangi sa puwesto ng ibang mga lipi; natural na ipinahihiwatig ito ng “Ngunit” sa Tagalog.
- source_word: יַחֲנוּ סָבִיב
  choice: magkakampo ... sa palibot
  rationale: Ang imperfect ay may puwersa ng tagubilin sa konteksto. Ang “magkakampo sa palibot” ay malinaw at likas na paglalarawan ng ayos ng kampamento.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: tabernakulo ng Patotoo
  rationale: Ang “tabernakulo” ay kinikilalang katawagang pangkulto para sa מִשְׁכָּן, samantalang pinananatili ng “Patotoo” ang lawak ng kahulugan ng הָעֵדוּת nang hindi ito ipinapakahulugan agad bilang isang tiyak na dokumento o bagay.
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: upang walang poot na sumapit
  rationale: Ipinahihiwatig ng sugnay ang layunin o kinalabasan ng wastong pagkakampo. Pinananatili ng “poot” ang bigat ng קֶצֶף, at ipinapahayag ng “sumapit” ang bantang pagdating o paglaganap nito nang natural sa Tagalog.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: sa kapulungan ng mga anak ni Israel
  rationale: Ang “kapulungan” ay angkop sa organisadong pamayanan ng Israel, at pinananatili ng “mga anak ni Israel” ang tahasang anyong pampamilya ng Hebreo.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: Tutuparin ... ang tungkuling bantayan
  rationale: Pinagsasama ng Hebreong salitang-ugat ang pag-iingat at ang ipinagkatiwalang pananagutan. Ang pariralang Tagalog ay likas at kapuwa nagpapahayag ng tungkulin at aktuwal na pagbabantay.
theological_decisions:
- issue: Ang pinagmumulan at katangian ng קֶצֶף
  choice: “poot,” nang hindi tahasang idinaragdag sa pangunahing teksto na ito ay poot ng Diyos
  alternative: “galit ng Diyos” o pangkalahatang “galit”
  rationale: Sa konteksto ng kabanalan ng santuwaryo sa Mga Bilang, malamang na tumutukoy ito sa poot o hatol ng Diyos kapag nilabag ang banal na hangganan. Gayunman, hindi tahasang binabanggit sa talata ang Diyos bilang maytaglay ng poot, kaya pinananatili ng salin ang di-tahasang anyo ng Hebreo.
- issue: Ang kahulugan ng הָעֵדוּת
  choice: Patotoo
  alternative: kasulatang tipan
  rationale: Maaaring tumukoy ang salita sa patotoo ng tipan na nasa tabernakulo, ngunit hindi nililimitahan ng salin ang kahulugan sa isang mas tiyak na interpretasyon kaysa sa mismong Hebreo.
- issue: Ang anyo ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita o sambayanan ng Israel
  rationale: Pinananatili nito ang pampamilyang paglalarawan sa pinagmulang teksto, bagaman mas idiomatiko sana ang “mga Israelita.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang kinikilalang terminong “tabernakulo” para sa kontekstong Pentateuchal, ngunit iniwasan ang masalimuot na wikang pansimbahan. Pinanatiling pareho ang salin ng inuulit na pariralang מִשְׁכַּן הָעֵדוּת.
