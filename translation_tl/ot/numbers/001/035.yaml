  yaml_path: translation/ot/numbers/001/035.yaml
  text: Their numbered men from the tribe of Manasseh were thirty-two thousand two hundred.
translation:
  language: tl
  text: Ang mga nabilang mula sa lipi ni Manases ay 32,200.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: ang mga nabilang
  rationale: Sa konteksto ng sensus, tumutukoy ang anyong mula sa פקד sa mga lalaking opisyal na binilang. Natural sa modernong Filipino ang “mga nabilang,” at malinaw sa nakapaligid na talata kung sino ang saklaw ng bilang.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Ipinahihiwatig ng לְ kasama ng מַטֶּה ang pagkabilang o kaugnayan sa isang lipi; ang “mula sa lipi ni” ang natural na pormula sa Filipino.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang nakagawiang anyo ng pangalang biblikal sa Filipino.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: 32,200
  rationale: Eksaktong pinananatili ang bilang na tatlumpu't dalawang libo at dalawang daan; mas madaling basahin ang numerong anyo sa mahabang talaan ng sensus.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Pinanatili ang maikling pormula ng talaan ng sensus at iniwasan ang hindi kailangang pagdaragdag.
