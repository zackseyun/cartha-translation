  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: tl
  text: Kaya kinuha nina Moises at Aaron ang mga lalaking ito[a], na tahasang tinukoy ayon sa pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na binanggit ayon sa pangalan,” ibig sabihin, “na tiyak na kinilala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: isinama
  rationale: Ang לָקַח ay literal na ‘kumuha,’ ngunit sa konteksto ay tumutukoy sa pagkuha o pagsama nina Moises at Aaron sa mga pinunong naunang tinukoy. Mas natural sa makabagong Tagalog ang ‘isinama’ kaysa ‘kinuha’ nang hindi dinaragdagan ang diwa.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moises at Aaron
  rationale: Ginamit ang karaniwang anyo ng mga pangalang biblikal sa Tagalog.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: ang mga lalaking ito
  rationale: Tumutukoy ang masculine plural na הָאֲנָשִׁים sa mga tiyak na lalaking kinatawan sa naunang konteksto. Hindi ginamit ang ‘mga pinuno’ sapagkat interpretatibong paglilinaw iyon.
- source_word: אֲשֶׁר
  choice: na
  rationale: Ang ‘na’ ang natural na pang-ugnay sa Tagalog para sa sugnay na naglalarawan sa mga taong tinutukoy.
- source_word: נִקְּבוּ
  choice: itinalaga
  rationale: Ang Niphal ng נקב ay nagpapahiwatig na sila ay tahasang tinukoy o itinalaga. Pinananatili ng ‘itinalaga’ ang pormal na diwa ng pagpili sa konteksto ng sensus.
- source_word: בְּשֵׁמוֹת
  choice: ayon sa pangalan
  rationale: Ipinahahayag nito ang tahasang pagkilala sa bawat isa sa pamamagitan ng pangalan. Natural sa Tagalog ang ‘ayon sa pangalan’ sa pormal na kontekstong ito.
