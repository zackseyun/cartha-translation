translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan ng ama” upang maipahayag nang natural ang patrilinyal na yunit ng lipunan, at pinanatili ang “mga anak ni Israel” dahil mahalaga sa talata ang panlalaking konteksto ng sensus militar. Ang pangwakas na gitling ay nagpapanatili sa sintaktikong pagpapatuloy patungo sa bilang sa susunod na talata.
