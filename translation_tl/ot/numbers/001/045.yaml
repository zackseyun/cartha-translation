  text: Kaya ang lahat ng nabilang sa mga anak ni Israel[a], ayon sa sambahayan ng kanilang mga ama, mula dalawampung taong gulang pataas—bawat isa na maaaring lumabas upang makipagdigma sa Israel[b]—
