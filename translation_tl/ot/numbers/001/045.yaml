lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Kaya ... ang
  rationale: Ipinagpapatuloy nito ang salaysay at ipinakikilala ang pagbubuod ng sensus; natural sa Filipino ang “Kaya” para sa ganitong resultang pahayag.
- source_word: כָּל פְּקוּדֵי
  choice: ang lahat ng nabilang
  rationale: Pinananatili ang kabuuang saklaw ng כָּל at ang pasibo/resultatibong diwa ng census term na פְּקוּדֵי.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit sa Hebreo at pinananatili ang panlalaking diin na mahalaga sa konteksto ng sensus para sa hukbo.
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa kani-kanilang angkan ng ama
  rationale: Ipinahahayag ang patrilinyal na pagkakaayos ng sensus sa natural na makabagong Filipino; ang “angkan” ay mas malinaw kaysa literal ngunit alanganing “bahay ng mga ama.”
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Natural at eksaktong pahayag ng itinakdang pinakamababang edad.
- source_word: כָּל יֹצֵא צָבָא
  choice: bawat isang maaaring lumabas upang makipagdigma
  rationale: Pinananatili ang larawan ng “paglabas” at nililinaw ang kontekstong militar nang hindi ito ginagawang isang teknikal na katawagan lamang.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Direkta at natural na katumbas ng lokatibo o korporatibong parirala.
