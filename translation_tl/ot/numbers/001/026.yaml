  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לִ/בְנֵ֣י יְהוּדָ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: tl
  text: 'Para sa mga anak ni Juda: ayon sa kanilang mga salinlahi, ayon sa kanilang mga angkan, ayon sa mga sambahayan ng kanilang mga ama, batay sa bilang ng mga pangalan, mula dalawampung taong gulang pataas, bawat lalaking lumalabas upang makipagdigma[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat lalaking lumalabas para sa hukbo.” Ang idyomang Hebreo ay tumutukoy sa mga karapat-dapat sa paglilingkod sa hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: Para sa mga anak ni Juda
  rationale: Pinananatili ng “mga anak” ang anyong Hebreo at ang konteksto ng sensus ng mga lalaking kabilang sa lipi ni Juda; ang “Para sa” ay angkop sa nagpapatuloy na talaan.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Maaaring tumukoy ang salita sa mga salinlahi, talaangkanan, o pinagmulang angkan. Pinananatili ng “mga salinlahi” ang lawak at pormulang anyo ng Hebreo nang hindi ipinapalagay na nakasulat na tala ang tinutukoy.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa kaayusang panlipunan ng Israel, tumutukoy ito sa pangkat na mas maliit kaysa lipi ngunit mas malawak kaysa karaniwang sambahayan; malinaw itong naihahayag ng “angkan.”
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa mga sambahayan ng kanilang mga ama
  rationale: Malapit ito sa literal na “bahay ng kanilang mga ama” at pinananatili ang makamaamang estruktura ng talaan, habang natural pa ring nauunawaan sa Filipino.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: batay sa bilang ng mga pangalan
  rationale: Inihahayag nito ang pagbibilang sa mga tao nang isa-isa ayon sa pangalan at hindi pinaiikli sa mas kolokyal at mapagpaliwanag na “bilang ng mga tao.”
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Natural na Filipino ito para sa itinakdang pinakamababang edad at tapat sa pormulang Hebreo.
- source_word: כֹּל יֹצֵא צָבָא
  choice: bawat lalaking lumalabas upang makipagdigma
  rationale: Pinananatili nito ang aktuwal na larawang “lumalabas” sa Hebreo at ang kontekstuwal na pagtukoy sa mga lalaking nasa edad para sa hukbo, nang hindi idinaragdag sa pangunahing teksto ang interpretatibong “may kakayahang.”
theological_decisions:
- issue: Kasariang tinutukoy sa sensus
  choice: bawat lalaking lumalabas upang makipagdigma
  alternative: bawat lumalabas upang makipagdigma
  rationale: Bagaman maaaring gamitin nang pangkalahatan ang anyong panlalaki sa Hebreo, malinaw sa konteksto ng sensus na mga lalaking nasa edad para sa paglilingkod sa hukbo ang binibilang. Hindi ito ginawang neutral sa kasarian.
- issue: Kahulugan ng idyomang militar
  choice: lumalabas upang makipagdigma
  alternative: karapat-dapat sa paglilingkod sa hukbo
  rationale: Pinananatili sa teksto ang kongkretong idyoma ng Hebreo at inilalagay sa talababa ang karaniwang kahulugang tumutukoy sa pagiging karapat-dapat para sa tungkuling militar, upang hindi tahimik na malutas ang bahagyang pag-igting sa pagitan ng literal na anyo at gamit nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paulit-ulit na pormulang “ayon sa” ng sensus, ang makamaamang katawagang “mga ama,” at ang anyong talaan na nagtatapos sa tutuldok.
