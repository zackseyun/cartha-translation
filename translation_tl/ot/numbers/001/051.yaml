id: NUM.1.51
reference: Numbers 1:51
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: tl
  text: Kapag ililipat na ang tabernakulo, babaklasin ito ng mga Levita; at kapag ihihimpil na ang tabernakulo, itatayo ito ng mga Levita. Ang sinumang tagalabas[a] na lalapit ay papatayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibang tao” o “taong walang pahintulot.” Ang salitang Hebreo ay tumutukoy rito sa isang taong hindi awtorisadong lumapit sa santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ הַמִּשְׁכָּן
  choice: Kapag ililipat na ang tabernakulo
  rationale: Ang ב na may infinitive construct ng נסע ay bumubuo ng sugnay na pamanahon. Sa konteksto, ang tabernakulo ay binabaklas upang ilipat kasama ng kampo; malinaw at likas sa Tagalog ang “ililipat na” nang hindi binabago ang diwa ng pagsisimula ng paglalakbay.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Karaniwang tawag sa sagradong naililipat na santuwaryo ng Israel at pamilyar sa modernong saling Biblikal sa Tagalog.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: babaklasin ito
  rationale: Ang Hiphil ng ירד ay tumutukoy rito sa pagbaba o pagtatanggal ng mga bahagi ng tabernakulo para madala; “babaklasin” ang pinakanatural at tiyak na katumbas sa kontekstong ito.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa mga kabilang sa lipi ni Levi na itinalaga sa gawaing ito.
- source_word: וּבַחֲנֹת הַמִּשְׁכָּן
  choice: at kapag ihihimpil na ang tabernakulo
  rationale: Ang חנה ay nangangahulugang humimpil o magkampo. Ang pasibong “ihihimpil” ay natural sa Tagalog para sa paglalagay ng naililipat na tabernakulo sa bagong kampamento.
- source_word: יָקִימוּ אֹתוֹ
  choice: itatayo ito
  rationale: Ang Hiphil ng קום ay nangangahulugang itayo o muling buuin ang tabernakulo sa lugar ng paghimpilan.
- source_word: וְהַזָּר
  choice: Ang sinumang tagalabas
  rationale: Sa konteksto ng paglilingkod sa santuwaryo, ang זָר ay taong wala sa pangkat na binigyan ng karapatang lumapit, hindi kinakailangang dayuhan sa lahi. Pinananatili ng “tagalabas” ang saklaw na ito.
- source_word: הַקָּרֵב
  choice: na lalapit
  rationale: Tuwirang inilalarawan ng participle ng קרב ang paglapit sa ipinagbabawal na sagradong gawain o lugar.
- source_word: יוּמָת
  choice: ay papatayin
  rationale: 'Ang Hophal ng מות ay pasibo at causative: ipapataw ang kamatayan, hindi lamang sinasabing mamamatay ang tao. Hindi tinutukoy ng salin kung sino ang magsasagawa nito.'
theological_decisions:
- issue: Uri ng parusa sa יוּמָת
  choice: “ay papatayin,” isang ipinataw na kamatayan na nasa tinig na balintiyak
  alternative: “ay mamamatay”
  rationale: Karaniwang ipinahihiwatig ng anyong Hophal na ang kamatayan ay ipapataw. Pinananatili ng balintiyak na pahayag ang legal at sagradong babala nang hindi tinutukoy kung tao o Diyos ang tagapagpatupad.
- issue: Tinutukoy ng זָר
  choice: isang tagalabas na walang karapatang lumapit sa paglilingkod sa santuwaryo
  alternative: isang dayuhan sa lahi, o tahasang bawat hindi Levita
  rationale: Sa kontekstong pari at tabernakulo, tumutukoy ang salita sa kawalan ng awtorisadong tungkulin. Hindi ito dapat paliitin sa etnikong kahulugan lamang o ipaliwanag nang higit sa mismong pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pamilyar na “tabernakulo” at “mga Levita,” habang iniwasan ang sobrang teknikal o makalumang pananalita. Ang magkatugmang “babaklasin” at “itatayo” ay natural na naglalarawan sa paglipat at muling pagtatayo ng santuwaryo.
