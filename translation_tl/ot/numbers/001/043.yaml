lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: ang mga nabilang
  rationale: Ang anyo mula sa פקד ay tumutukoy sa mga taong naitala o nabilang sa sensus. Likas sa modernong Tagalog ang “mga nabilang” at hindi ito nagdaragdag ng impormasyong wala sa Hebreo.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa paulit-ulit na pormula ng sensus, ipinakikita ng לְ na ang mga nabilang ay kabilang sa tinukoy na lipi. Ang “mula sa lipi ni” ay malinaw at likas sa Tagalog.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 53,400
  rationale: Isinaayos ang bilang ayon sa karaniwang modernong pagsulat sa Tagalog; katumbas ito ng limampu't tatlong libo at apat na raan.
