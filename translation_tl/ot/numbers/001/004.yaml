translation:
  language: tl
  text: At makakasama ninyo ang tig-isang lalaki mula sa bawat lipi, at bawat isa ay pinuno ng sambahayan ng kanyang angkan sa panig ng ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bahay ng kanyang mga ama.” Tumutukoy ito sa sambahayan o angkang sinusundan ayon sa linya ng mga ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתְּכֶם יִהְיוּ
  choice: At makakasama ninyo
  rationale: Ipinahahayag ng parirala na ang mga lalaking ito ay sasama kina Moises at Aaron. Likas sa makabagong Tagalog ang “makakasama ninyo” at naipapakita nito ang hinaharap o itinakdang pagkanaroroon.
- source_word: אִישׁ אִישׁ לַמַּטֶּה
  choice: ang tig-isang lalaki mula sa bawat lipi
  rationale: 'Distributibo ang pag-uulit ng אִישׁ: isang kinatawang lalaki para sa bawat lipi. Malinaw at natural itong naihahayag ng “tig-isang lalaki.”'
- source_word: מַטֶּה
  choice: lipi
  rationale: Sa konteksto ng sensus at pagkakaayos ng Israel, tumutukoy ito sa isang tribo o pangkat panlipi, hindi sa literal na tungkod.
- source_word: אִישׁ רֹאשׁ
  choice: bawat isa ay pinuno
  rationale: Tinutukoy ng pariralang appositional ang bawat kinatawan bilang nangunguna sa kaniyang pangkat. Ang “pinuno” ay malinaw na katumbas ng metaporang Hebreo na “ulo.”
- source_word: לְבֵית אֲבֹתָיו
  choice: ng sambahayan ng kanyang mga ninuno
  rationale: Tumutukoy ito sa angkan o sambahayang nakabatay sa linya ng mga ama. Pinananatili ng “sambahayan ng kanyang mga ninuno” ang panlipunang diwa nang hindi nagiging kahoy ang Tagalog.
- source_word: הוּא
  choice: bawat isa ay
  rationale: Ang hiwalay na panghalip ay may pagbibigay-diin o pansuhay na gamit. Naipahihiwatig ang diin nito sa likas na Tagalog sa pamamagitan ng “bawat isa ay.”
