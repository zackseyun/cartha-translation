  yaml_path: translation/ot/numbers/001/027.yaml
  text: Those counted from the tribe of Judah were seventy-four thousand six hundred[a].
translation:
  language: tl
  text: Ang mga nabilang mula sa lipi ni Juda ay pitumpu't apat na libo at animnaraan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga naitala.” Sa pormulang ito ng sensus, maaaring isalin sa alinman sa dalawang paraan ang anyong Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: ang mga nabilang
  rationale: Ang anyong pasibo mula sa פקד sa konteksto ng sensus ay tumutukoy sa mga taong binilang o itinala. Likas sa modernong Tagalog ang “mga nabilang” at hindi nito idinaragdag ang “mga lalaki,” na hindi tahasang nasa talatang ito.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa pormulang ito ng sensus, ipinahihiwatig ng לְ ang kaugnayan o pagiging kabilang sa isang lipi. Ang “mula sa lipi ni” ay malinaw at likas sa Tagalog.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ito ang karaniwang anyo sa Tagalog ng pangalan ng lipi.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: pitumpu't apat na libo at animnaraan
  rationale: Isinalin ang bilang sa karaniwang ayos ng modernong Tagalog habang pinananatili ang eksaktong halagang 74,600.
