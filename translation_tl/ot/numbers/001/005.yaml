  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר יַֽעַמְד֖וּ אִתְּ/כֶ֑ם לִ/רְאוּבֵ֕ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: tl
  text: 'At ito ang mga pangalan ng mga lalaking tatayo kasama ninyo: para sa lipi ni Ruben[a], si Elizur na anak ni Sedeur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa lipi ni Ruben, si Elizur na anak ni Sedeur.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang kaugnayan sa lipi o ang pagkatawan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: At ito ang mga pangalan
  rationale: Pinananatili ng “At” ang pagpapatuloy ng tala, at likas sa modernong Filipino ang presentasyong “ito ang mga pangalan.”
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Tumutukoy ang karaniwang pangmaramihang pangngalan dito sa mga tiyak na lalaking kinatawan.
- source_word: יַעַמְדוּ אִתְּכֶם
  choice: tatayo kasama ninyo
  rationale: Pinananatili ang pangunahing diwa ng עמד na “tumayo” at ang pangmaramihang “ninyo,” na tumutukoy kina Moises at Aaron sa konteksto.
- source_word: לִרְאוּבֵן
  choice: para sa lipi ni Ruben
  rationale: Ang לְ ay nagpapahiwatig dito ng kaugnayan o pagkatawan sa tribo; idinagdag ang “lipi ni” upang maging malinaw at natural sa Filipino nang hindi inaalis ang alternatibong pagbasa sa talababa.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: si Elizur na anak ni Sedeur
  rationale: Isinalin ang genealogical formula nang natural sa Filipino at tinumbasan sa baybay-Filipino ang mga pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lipi ni Ruben” upang agad maunawaan na tribong Israelita ang tinutukoy, habang pinanatili sa talababa ang tunay na saklaw ng pang-ukol na Hebreo.
