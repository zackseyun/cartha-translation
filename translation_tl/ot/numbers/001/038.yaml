base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: tl
  text: 'Sa mga anak ni Dan: ayon sa kanilang mga salinlahi, ayon sa kanilang mga angkan, at ayon sa mga sambahayan ng kanilang mga ama; ayon sa bilang ng mga pangalan, mula dalawampung taong gulang pataas—bawat lalaking lumalabas upang makidigma:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat lalaking karapat-dapat na maglingkod bilang kawal.” Literal na tumutukoy ang idyomang Hebreo sa paglabas upang makidigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: Sa mga anak ni Dan
  rationale: Pinananatili ang pormulang pantribo at ang tahasang panlalaking anyo ng Hebreo sa konteksto ng sensus militar.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Tumutukoy rito sa mga pangkat ayon sa talaangkanan; ang “mga salinlahi” ay malapit sa Hebreo at likas sa marangal na Tagalog.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Ang “angkan” ay angkop sa pangkat na pantribo at naiiba sa kasunod na mas maliit na yunit ng sambahayan.
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa mga sambahayan ng kanilang mga ninuno
  rationale: Ipinapahayag ang teknikal na yunit ng pagkakamag-anak nang natural sa Tagalog, habang pinananatili ang kaugnayan nito sa linyang ninuno.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: ayon sa bilang ng mga pangalan
  rationale: Pinananatili ang kongkretong idyoma ng isa-isang pagtatala ng mga pangalan sa halip na gawing “bilang ng mga tao” lamang.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Likas at eksaktong pahayag sa Tagalog para sa itinakdang hangganan ng edad.
- source_word: כֹּל יֹצֵא צָבָא
  choice: bawat lalaking makalalabas sa digmaan
  rationale: Pinananatili ang literal na larawang “lumabas” para sa digmaan at ang panlalaking saklaw na malinaw sa konteksto, nang hindi ganap na nilulutas kung kakayahan o pagiging kuwalipikado ang diin.
theological_decisions:
- issue: Panlalaking wika sa sensus militar
  choice: bawat lalaking makalalabas sa digmaan
  alternative: bawat isang karapat-dapat sa paglilingkod bilang kawal
  rationale: Ang konteksto at anyong Hebreo ay tumutukoy sa mga lalaking kabilang sa sensus militar. Pinananatili rin ng pangunahing salin ang idyomang paglabas sa digmaan sa halip na ipalit lamang ang interpretasyong “serbisyong militar.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang inuulit na “ayon sa” upang mapanatili ang pormulang pansensus, ngunit inayos ang bantas para maging madaling basahin. Ang “mga sambahayan ng kanilang mga ninuno” ay mas natural kaysa sa literal na “mga bahay ng kanilang mga ama” at pinananatiling naiiba sa “mga angkan.”
