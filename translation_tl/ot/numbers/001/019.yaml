  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: tl
  text: Gaya ng iniutos ni Yahweh kay Moises, gayon niya sila binilang[a] sa ilang ng Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinala niya sila” o “tinipon niya sila para sa sensus.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapatala o pagsasagawa ng sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Gaya ng
  rationale: Likas na nagpapahayag sa Filipino ng pagtutugma ng ginawa ni Moises sa iniutos ni Yahweh.
- source_word: צִוָּה
  choice: iniutos
  rationale: Tuwirang katumbas ng pandiwang nangangahulugang mag-utos; malinaw sa daloy na nauna ang utos sa pagbibilang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Si Moises ang tuwirang layon ng pandiwang 'iniutos'; hinihingi ng natural na Filipino ang panandang 'kay'.
- source_word: וַיִּפְקְדֵם
  choice: binilang niya sila
  rationale: Sa konteksto ng sensus, ang פקד ay tumutukoy sa pagbibilang o pagpapatala. Malinaw at pangkaraniwan ang 'binilang' sa modernong Filipino, habang inilalagay sa talababa ang iba pang posibleng diwa.
- source_word: בְּמִדְבַּר סִינָי
  choice: sa ilang ng Sinai
  rationale: Pinananatili ang ugnayang konstrakto ng Hebreo at gumagamit ng dignified at pamilyar na katawagang heograpiko sa Bibliyang Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng kahulugan ng פקד sa konteksto ng sensus
  choice: binilang niya sila
  alternative: tinipon niya sila para sa pagsusuri; itinala niya sila
  rationale: Ang konteksto ay pagbibilang sa Israel, ngunit maaaring saklaw ng pandiwa ang pagpapatala o pagmamartsa/pagtitipon para sa pagsusuri; hindi tahimik na inaalis ang lawak na ito at inilalahad ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'ilang ng Sinai' bilang pamilyar na estilong biblikal, at pinanatili ang 'Yahweh' bilang personal na pangalan.
