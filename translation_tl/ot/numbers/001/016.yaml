  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: tl
  text: Ang mga ito ang mga tinawag na kabilang sa kapulungan[a], ang mga pinuno ng mga lipi ng kanilang mga ama, at ang mga pinuno ng mga libu-libo ng Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga ipinatawag na kabilang sa kapulungan” o “ang mga itinalaga na kabilang sa kapulungan.” Maaaring tumukoy ang salitang Hebreo sa mga tinawag, ipinatawag, o itinalaga.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga libu-libo ng Israel” ay maaaring tumukoy sa literal na mga pangkat na tig-iisang libo, o sa mas malawak na mga pangkat na panlipi o panghukbo sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ang mga ito
  rationale: Pinananatili ang maramihang pantukoy na nagpapakilala sa mga lalaking kababanggit lamang.
- source_word: קריאי הָעֵדָה
  choice: tinawag mula sa kapulungan
  rationale: Inilalarawan ng balintiyak na pandiwaring-bahagi ang mga tinawag, ipinatawag, o itinalaga; pinananatili ng salin at talababa ang saklaw ng kahulugan nang hindi ipinapalagay na pormal silang inihalal.
- source_word: נְשִׂיאֵי
  choice: mga pinuno
  rationale: Sa kontekstong panlipi at διοικηativo, tumutukoy ito sa mga taong may mataas na katungkulan; malinaw at likas sa makabagong Filipino ang “mga pinuno.”
- source_word: מַטּוֹת אֲבוֹתָם
  choice: mga lipi ng kanilang mga ninuno
  rationale: Ang מַטּוֹת ay tumutukoy rito sa mga lipi, samantalang ipinahahayag ng אֲבוֹתָם ang pinagmulang angkan sa panig ng mga ama; natural na naihahatid ito ng “mga ninuno” sa Filipino.
- source_word: רָאשֵׁי
  choice: mga pinuno
  rationale: Bagaman literal na “mga ulo,” karaniwang metapora ito para sa mga namumuno; iniiwasan ng “mga pinuno” ang alanganing literalismo sa Filipino.
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: libu-libo sa Israel
  rationale: Pinananatili ang pangunahing kahulugang “mga libo” at ang posibilidad na tumukoy ito sa mga pangkat na panlipi o panghukbo, sa halip na pumili agad ng iisang interpretasyon.
- source_word: הֵם
  choice: ang
  rationale: Ang pangwakas na malayang panghalip ay may diin sa pagkakakilanlan; likas itong naihahatid sa Filipino ng hulma na “Ang mga ito ang...” sa halip na ulitin ang panghalip sa dulo.
