  terminology: Ang “kapulungan,” “mga pinuno,” at “mga lipi” ay angkop sa kontekstong administratibo at panlipi. Pinananatili ng “mga libu-libo ng Israel” ang sinadyang kalabuan ng אֲלָפִים.
