  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לִ/בְנֵ֣י זְבוּלֻ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: tl
  text: 'Para sa mga anak ni Zebulun: ayon sa kanilang mga talaangkanan, sa kanilang mga angkan, at sa kanilang mga sambahayan ayon sa ama, batay sa bilang ng mga pangalan, ang lahat ng lalaking dalawampung taong gulang pataas na maaaring lumabas upang makipagdigma[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “karapat-dapat sa paglilingkod-militar.” Literal sa Hebreo, “lumalabas upang makipagdigma.”
    reason: Ibinibigay ang functional na kahulugan at ang literal na anyo ng idyomang Hebreo.
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: Para sa mga anak ni Zebulun
  rationale: Pinananatili ang pormulang pantribo at ang ugnayang literal na 'mga anak ni,' na sa konteksto ay tumutukoy sa mga kaapu-apuhan at kasapi ng lipi.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga talaangkanan
  rationale: Sa konteksto ng sensus, tumutukoy ito sa pagkakaayos batay sa angkan o tala ng pinagmulan; mas malinaw sa makabagong Tagalog kaysa sa literal na 'mga salinlahi.'
- source_word: לְמִשְׁפְּחֹתָם
  choice: sa kanilang mga angkan
  rationale: Ang מִשְׁפָּחָה rito ay isang pangkat ng magkakamag-anak sa loob ng lipi, kaya mas tiyak ang 'angkan' kaysa sa malawak na 'pamilya.'
- source_word: לְבֵית אֲבֹתָם
  choice: sa kanilang mga sambahayan ayon sa ama
  rationale: Ipinahahayag ang teknikal na yunit ng pagkakamag-anak na nakabatay sa linya ng ama nang hindi gumagamit ng di-likas na 'mga bahay ng kanilang mga ama.'
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: batay sa bilang ng mga pangalan
  rationale: Pinananatili ang administratibong larawan ng indibiduwal na pagtatala sa pangalan, sa halip na palitan ng mas interpretibong 'bilang ng mga tao.'
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: dalawampung taong gulang pataas
  rationale: Natural at eksaktong pormula sa Tagalog para sa itinakdang pinakamababang edad.
- source_word: כֹּל יֹצֵא צָבָא
  choice: ang lahat ng lalaking ... maaaring lumabas upang makipagdigma
  rationale: Ang panlalaking saklaw ay nagmumula sa konstruksiyong 'mula sa anak na lalaki na dalawampung taon' at sa konteksto ng sensus-militar. Pinananatili rin ang larawang Hebreo ng paglabas sa digmaan.
theological_decisions:
- issue: Panlalaking saklaw ng sensus-militar
  choice: ang lahat ng lalaking dalawampung taong gulang pataas
  alternative: ang lahat ng dalawampung taong gulang pataas
  rationale: Bagaman walang hiwalay na salitang 'lalaki' kasunod ng כֹּל, ang naunang מִבֶּן ('mula sa anak na lalaki') at ang konteksto ng serbisyong militar ay malinaw na nagtatakda ng panlalaking saklaw; hindi ito ginagawang neutral sa kasarian.
- issue: Kahulugan ng יֹצֵא צָבָא
  choice: maaaring lumabas upang makipagdigma
  alternative: karapat-dapat sa paglilingkod-militar
  rationale: Pinananatili sa pangunahing teksto ang konkretong idyomang Hebreo at inilalagay sa talababa ang mas functional na kahulugan, upang hindi lubusang mawala ang tunay na anyo ng pahayag.
translation_notes:
  register: Makabago at marangal na Filipino; pinananatili ang administratibo at paulit-ulit na estilo ng talaan. Ginamit ang 'sambahayan ayon sa ama' bilang malinaw na katumbas ng teknikal na yunit ng pagkakamag-anak, at iniwasan ang sobrang literal ngunit di-likas na parirala.
