base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: tl
  text: 'Ang mga anak na lalaki ni Neftali, ayon sa kanilang mga talaangkanan, mga angkan, at mga sambahayan ng kanilang mga ama, ayon sa bilang ng mga pangalan, mula dalawampung taong gulang pataas—lahat ng maaaring lumabas upang makidigma[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “lahat ng lumalabas para sa hukbo” o “lahat ng lumalabas upang makidigma.” Sa konteksto ng sensus, tumutukoy ang idyomang Hebreo sa mga karapat-dapat sa paglilingkod-militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: mga anak na lalaki ni Neftali
  rationale: Ang בְּנֵי ay literal na “mga anak na lalaki.” Sa konteksto ng sensus, tinutukoy nito ang mga lalaking kabilang sa lipi ni Neftali; pinananatili ng salin ang kasarian at ugnayang angkan na nasa Hebreo.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga talaangkanan
  rationale: Tumutukoy ito sa pagkakahati batay sa pinagmulan o tala ng lahi. Ang “mga talaangkanan” ay natural na Filipino at pinananatili ang genealogical na diwa.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa kontekstong panlipi, ang מִשְׁפָּחָה ay mas malawak kaysa karaniwang nuklear na pamilya; ang “angkan” ang mas angkop na katumbas.
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa kanilang mga sambahayan ng kanilang mga ama
  rationale: Pinananatili nito ang Israelitang pangkat-panlipunan na nakaayos ayon sa sambahayan ng ama, nang hindi ito pinapalitan ng mas malawak at di-tiyak na “mga ninuno.”
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: Isa-isang binilang ang pangalan
  rationale: Ipinahihiwatig ng parirala ang pagbibilang ng mga indibidwal ayon sa pangalan. Ang pandiwang pahayag ay mas natural sa Filipino kaysa literal na “ayon sa bilang ng mga pangalan.”
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: lahat ng dalawampung taong gulang pataas
  rationale: Ito ang malinaw at karaniwang paraan sa modernong Filipino ng pagsasaad ng hangganan ng edad na nasa Hebreo.
- source_word: כֹּל יֹצֵא צָבָא
  choice: lahat ... na maaaring maglingkod sa hukbo
  rationale: Literal itong tumutukoy sa lahat ng “lumalabas” para sa hukbo o digmaan. Sa sensus, ang diwa ay pagiging karapat-dapat sa paglilingkod-militar; malinaw itong ipinahahayag ng salin habang inilalagay sa talababa ang mas literal na anyo.
