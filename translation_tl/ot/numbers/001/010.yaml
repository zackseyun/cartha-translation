  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/אֶפְרַ֕יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיה֑וּד לִ/מְנַשֶּׁ֕ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: tl
  text: 'Sa mga anak ni Jose: para sa Efraim, si Elisama na anak ni Amihud; para sa Manases, si Gamaliel na anak ni Pedasur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Sa mga anak ni Jose
  rationale: Ang לְ ay nagpapakilala sa pangkat sa talaan, at ang בְנֵי ay literal na “mga anak.” Pinananatili ng salin ang anyong Hebreo habang malinaw na tumutukoy sa mga sangay na nagmula kay Jose.
- source_word: לְאֶפְרַיִם
  choice: para sa Efraim
  rationale: Ang inuulit na לְ ay nagmamarka sa sangay ni Efraim sa ilalim ng mga anak ni Jose. Hindi idinagdag ang “lipi” sapagkat nauunawaan na ito sa konteksto ng sensus.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Isinatinig ang pangalang Hebreo sa paraang natural at madaling basahin sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaan ng mga pangalan, ang Hebreong ugnayang “son of” ay natural na ipinapahayag sa Filipino bilang “anak ni.”
- source_word: עַמִּיהוּד
  choice: Amihud
  rationale: Isinatinig ang personal na pangalan ayon sa natural na baybay sa Filipino.
- source_word: לִמְנַשֶּׁה
  choice: para sa Manases
  rationale: Kaagapay ito ng “para sa Efraim” at pinananatili ang balangkas ng listahan nang hindi idinaragdag ang salitang “lipi.”
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Isinatinig ang personal na pangalan sa anyong pamilyar at natural sa Filipino.
- source_word: פְּדָהצוּר
  choice: Pedasur
  rationale: Isinatinig ang Hebreong pangalan sa paraang ang צ ay kinakatawan ng “s,” na angkop sa makabagong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at paralelong anyo ng talaan; ginamit ang “si” bago ang mga kinatawan upang maging natural ang daloy sa Tagalog.
