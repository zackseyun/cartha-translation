base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: tl
  text: 'Sa mga anak ni Jose—sa mga anak ni Efraim—ayon sa kanilang mga salinlahi, mga angkan, at mga sambahayan ng kanilang mga ama, batay sa bilang ng mga pangalan, mula dalawampung taong gulang pataas, bawat lalaking lumalabas upang makipagdigma[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bawat lalaking naglilingkod sa hukbo.” Literal na inilalarawan ng idyomang Hebreo ang paglabas upang makipagdigma.
    reason: Ipinakikita ang kahulugang militar ng idyoma habang pinananatili sa pangunahing teksto ang literal nitong larawan.
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Sa mga anak ni Jose
  rationale: Pinananatili ng “mga anak” ang pormal na pananalitang pangangkan, bagaman tumutukoy ito rito sa mga inapo ni Jose; ang “sa” ay angkop sa pormula ng talaan.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: sa mga anak ni Efraim
  rationale: Ipinagpapatuloy nito ang pagtukoy sa sangay ni Efraim sa ilalim ng sambahayan ni Jose at pinananatili ang wikang pangangkan ng Hebreo.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Tumutukoy sa pagkakahanay ayon sa pinagmulan o lahi; hindi ito nilinaw bilang nakasulat na talaan, sapagkat hindi iyon tahasang sinasabi ng salita.
- source_word: לְמִשְׁפְּחֹתָם
  choice: mga angkan
  rationale: Ang “angkan” ay mas angkop kaysa karaniwang “pamilya” para sa yunit ng lipunang pantribo.
- source_word: לְבֵית אֲבֹתָם
  choice: mga sambahayan ng kanilang mga ninuno
  rationale: Natural at marangal ito sa modernong Tagalog at ipinahahayag ang mga sambahayang inayos ayon sa linyang minana sa mga ama, nang hindi gumagamit ng alanganing literal na “bahay ng mga ama.”
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: batay sa bilang ng mga pangalan
  rationale: Pinananatili nito ang ideya ng paisa-isang pagtatala sa sensus at malapit sa pormula ng Hebreo.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Ito ang natural na modernong Tagalog para sa hangganan ng edad na dalawampu at higit pa.
- source_word: כֹּל יֹצֵא צָבָא
  choice: bawat lalaking lumalabas upang makipagdigma
  rationale: Pinananatili ang literal na larawang Hebreo ng paglabas para sa digmaan at nililinaw ang panlalaking saklaw ng sensus; inilalagay sa talababa ang mas administratibong diwa ng paglilingkod sa hukbo.
theological_decisions:
- issue: Panlalaking saklaw ng sensus militar
  choice: bawat lalaking lumalabas upang makipagdigma
  alternative: lahat ng lumalabas upang makipagdigma; lahat ng naglilingkod sa hukbo
  rationale: Sa konteksto, ang tinatala ay mga lalaking nasa edad para sa tungkuling militar. Hindi ginawang neutral ang kasarian, ngunit hindi rin idinagdag sa pangunahing teksto ang “may kakayahan,” na hindi tahasang nakasaad sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga terminong “salinlahi,” “angkan,” at “sambahayan ng mga ninuno” upang mapanatili ang pormal na kayarian ng talaang pangangkan nang hindi maging salitang-salita at alanganin. Ang tutuldok ay pinanatili dahil nagpapatuloy ang pangungusap sa bilang na ibibigay sa susunod na talata.
