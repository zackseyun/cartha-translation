  text: Ang mga nabilang mula sa lipi ni Simeon ay 59,300.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: ang mga nabilang
  rationale: Sa konteksto ng sensus, ang anyong mula sa פקד ay tumutukoy sa mga taong binilang o itinala. Likas sa modernong Tagalog ang “mga nabilang,” at hindi nito inuulit ang salitang “mga lalaki,” na malinaw sa mas malawak na konteksto ngunit hindi tahasang nasa talatang ito. Hindi hiwalay na isinalin ang hulaping panghalip na “kanila” sapagkat magiging malabo o di-likas ito sa Tagalog sa pormulang ito.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa pormula ng sensus, ipinakikita ng לְ na ang mga nabilang ay kabilang sa tinukoy na lipi. Ang “mula sa lipi ni” ay malinaw at natural sa Tagalog.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: 59,300
  rationale: Eksaktong inilalahad ang kabuuan sa karaniwang makabagong pagsulat ng bilang sa Tagalog.
