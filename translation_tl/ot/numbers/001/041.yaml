lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: ang mga nabilang
  rationale: Tumutukoy ang anyo mula sa פקד sa mga taong isinama sa pagbilang sa konteksto ng sensus. Likas sa modernong Tagalog ang “mga nabilang” at hindi nito idinaragdag ang salitang “lalaki,” na wala sa mismong pormula ng talata.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa pormula ng sensus, ipinakikita ng לְ kasama ng מַטֶּה ang kinabibilangang lipi. Ang “mula sa lipi ni” ay malinaw at natural sa Tagalog.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan ng lipi.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: apatnapu't isang libo at limang daan
  rationale: Inilalahad ang eksaktong bilang sa natural na ayos ng mga bilang sa modernong Tagalog.
