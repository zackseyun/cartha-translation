  text: וְ/אֵ֨ת כָּל הָ/עֵדָ֜ה הִקְהִ֗ילוּ בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י וַ/יִּתְיַֽלְד֥וּ עַל מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/גֻלְגְּלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: tl
  text: Tinipon nila ang buong kapulungan sa unang araw ng ikalawang buwan. Nagpatala[a] ang mga tao ayon sa kani-kanilang angkan at ayon sa sambahayan ng kanilang mga ama, ayon sa bilang ng mga pangalan, mula dalawampung taong gulang pataas, isa-isa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinahayag ang kanilang pinagmulang angkan” o “nagpatala ayon sa talaangkanan.” Bihira ang pandiwang Hebreo rito at tumutukoy sa pagpapatala batay sa salinlahi.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa kanilang mga ulo” o “mga bungo”; isang idyomang nangangahulugang binilang nang paisa-isa ang bawat tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: Tinipon nila
  rationale: Ang Hiphil ng קהל ay nangangahulugang tipunin o papagtipunin. Likas sa Filipino ang “tinipon nila” at pinananatili nitong tahasan ang kilos at maramihang simuno.
- source_word: כָּל הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanan ng Israel. Ang “buong kapulungan” ay marangal at malinaw, at naipapahayag ang כָּל.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: sa unang araw ng ikalawang buwan
  rationale: Karaniwang pormulang pangkalendaryo ito sa Hebreo; ang idiomatikong salin ay mas malinaw kaysa literal na “sa isa ng ikalawang buwan.”
- source_word: וַיִּתְיַלְדוּ
  choice: Nagpatala ang mga tao
  rationale: Ang bihirang Hitpael ng ילד dito ay tumutukoy sa pagpapatunay o pagpapahayag ng angkan para sa isang talaan. Ang “nagpatala” ay natural sa konteksto ng sensus, samantalang inililinaw ng kasunod na mga parirala na salinlahi ang batayan.
- source_word: עַל מִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa organisasyong panlipunan ng Israel, ang מִשְׁפָּחָה ay pangkat ng magkakamag-anak o angkan. Ipinahihiwatig ng “kani-kanilang” ang distributibong anyo ng hulaping maramihan.
- source_word: לְבֵית אֲבֹתָם
  choice: at sambahayan ng kanilang mga ama
  rationale: Pinananatili ng salin ang teknikal na yunit ng pagkakamag-anak na בֵּית אָבוֹת at ang linyang paternal na hayag sa Hebreo, nang hindi ito ginagawang pangkalahatang “pamilya” lamang.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: ayon sa bilang ng mga pangalan
  rationale: Malapit ito sa Hebreo at pinananatili ang administratibong larawan ng pagbibilang sa mga taong nakatala sa pangalan.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Ito ang malinaw at karaniwang Filipino para sa itinakdang pinakamababang edad.
- source_word: לְגֻלְגְּלֹתָם
  choice: isa-isa
  rationale: Literal itong “ayon sa kanilang mga bungo/ulo,” isang idyomang nagsasaad na binilang ang bawat indibidwal. Ang “isa-isa” ang natural na kahulugan sa Filipino; inilalahad sa talababa ang kongkretong larawan ng Hebreo.
