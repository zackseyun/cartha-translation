translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kapulungan,” “angkan,” at “sambahayan ng kanilang mga ama” upang mapanatili ang magkakaibang antas ng organisasyong pampamilya sa Hebreo. Inilipat ang mga panandang talababa sa mismong mga pariralang ipinaliliwanag ng mga ito.
