  language: tl
  text: Kaya, ang lahat ng nabilang ay 603,550[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga itinala” o “mga tinipon.” Ang salitang Hebreo ay tumutukoy sa mga inirehistro sa sensus.
