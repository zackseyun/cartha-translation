base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: tl
  text: 'Mula sa mga anak ni Manases, ayon sa kanilang mga salinlahi, ayon sa kanilang mga angkan, ayon sa mga sambahayan ng kanilang mga ama, ayon sa bilang ng mga pangalan, mula dalawampung taong gulang pataas—bawat lalaking lumalabas upang maglingkod sa hukbo[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat lalaking lumalabas upang makipagdigma.” Ang Hebreong pananalita ay tumutukoy sa mga lalaking maaaring gumanap ng tungkuling militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: Mula sa mga anak ni Manases
  rationale: Ang לְ sa pormula ng sensus ay nagsisilbing panimula sa pangkat ng tribo. Pinananatili ng “mga anak ni Manases” ang genealogical na diwa ng בנים at ang putol na estrukturang kaugnay ng mga katabing talata.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Tumutukoy ito sa pagkakahati ayon sa pinagmulan o talaangkanan. Ang “mga salinlahi” ay pormal ngunit malinaw at hindi ito nililimitahan sa makabagong konsepto ng agarang pamilya.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa konteksto ng sensus ng tribo, ang מִשְׁפָּחָה ay isang pangkat ng magkakamag-anak sa loob ng tribo; mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa sambahayan ng kanilang mga ninuno
  rationale: Inihahayag nito ang kinikilalang yunit ng kamag-anakan na literal na “bahay ng mga ama.” Ang salin ay natural sa Filipino at pinananatili ang ancestral na kaayusan nang hindi nagmumukhang tumutukoy lamang sa isang gusali.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: ayon sa bilang ng mga pangalan
  rationale: 'Pinananatili nito ang pormal na wikang pansensus: ang mga indibidwal ay binibilang ayon sa nakatalang pangalan.'
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Ito ang natural na modernong Filipino para sa Hebreong idyomang nagtatakda ng pinakamababang edad.
- source_word: כֹּל יֹצֵא צָבָא
  choice: bawat lalaking lumalabas upang maglingkod sa hukbo
  rationale: Ang panlalaking anyo at konteksto ay tumutukoy sa mga lalaking saklaw ng sensus militar. Ang “lumalabas” ay nagpapanatili sa kilos ng יֹצֵא, samantalang nililinaw ng “maglingkod sa hukbo” ang diwa ng צָבָא.
theological_decisions:
- issue: Panlalaking wika ng sensus
  choice: bawat lalaking lumalabas upang maglingkod sa hukbo
  alternative: bawat lumalabas upang maglingkod sa hukbo
  rationale: Ang konteksto ay sensus militar ng mga lalaking Israelita na dalawampung taong gulang pataas. Kaya hindi ginawang gender-neutral ang partikular na panlalaking reperensiya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormulang pansensus at ang pagiging di-ganap na pangungusap ng Hebreo, na humahantong sa tutuldok. Inilagay ang talababa sa pariralang tunay nitong ipinapaliwanag.
