  text: 'para sa Simeon: si Selumiel na anak ni Zurisadai;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/שִׁמְעוֹן
  choice: para sa Simeon
  rationale: Ang לְ ay tumutukoy sa kaugnayan o pagkatawan sa tribo sa talaan ng mga pinuno. Likas at maikli sa Filipino ang “para sa Simeon,” at pinananatili nito ang anyo ng listahan.
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Isinatinig ang pangalang Hebreo sa anyong madaling basahin sa Filipino, sa halip na isalin ang kahulugan nito.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa pormulang kumikilala sa isang tao ayon sa kanyang ama, tuwirang ipinapahayag ng בֶּן ang pagiging anak; “anak ni” ang natural na anyo sa Filipino.
- source_word: צוּרִישַׁדָּי
  choice: Zurisadai
  rationale: Isinatinig ang personal na pangalan ayon sa nakaugaliang anyong biblikal sa Filipino, nang hindi isinasalin ang kahulugan nito.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na modernong Filipino na angkop sa serye ng mga pangalan sa talaan. Ginamit ang “si” bago ang pangalan ng kinatawan para sa likas na daloy ng Filipino, habang pinanatili ang tuldok-kuwit ng konteksto.
