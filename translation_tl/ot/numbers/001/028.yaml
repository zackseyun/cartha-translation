base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: tl
  text: 'Sa mga anak ni Isacar, ayon sa kanilang mga salinlahi, mga angkan, at mga sambahayan ng kanilang mga ama, ayon sa bilang ng mga pangalan, mula sa dalawampung taong gulang pataas—bawat lalaking maaaring lumabas upang makipagdigma[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat lumalabas para sa hukbo.” Sa kontekstong ito, tumutukoy ang pananalitang Hebreo sa mga lalaking karapat-dapat sa paglilingkod-militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: Sa mga anak ni Isacar
  rationale: Pinananatili ng “mga anak” ang panlalaki at angkaning diwa ng בְּנֵי, samantalang likas na ipinakikilala ng “sa” ang pangkat ng lipi sa pormula ng sensus.
- source_word: תּוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Tinutukoy rito ang mga hanay ng pinagmulan o salinlahi; hindi ito pinaliliit sa kahulugang nakasulat na talaangkanan lamang.
- source_word: לְמִשְׁפְּחֹתָם
  choice: mga angkan
  rationale: Ang מִשְׁפָּחָה ay isang pangkat ng magkakamag-anak sa loob ng lipi, kaya mas tiyak ang “angkan” kaysa sa karaniwang “pamilya.”
- source_word: לְבֵית אֲבֹתָם
  choice: mga sambahayan ng kanilang mga ama
  rationale: Pinananatili nito ang patriyarkal na kaayusang pampamilya ng literal na “bahay ng kanilang mga ama,” ngunit gumagamit ng likas na katawagang Filipino para sa yunit ng sambahayan.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: ayon sa bilang ng mga pangalan
  rationale: Malapit ito sa idyoma ng sensus sa Hebreo at ipinahihiwatig na binilang ang bawat taong nakatala sa pangalan.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula sa dalawampung taong gulang pataas
  rationale: Likas na pormulang Filipino ito para sa hangganan ng edad at malinaw na kabilang ang mga eksaktong dalawampung taong gulang.
- source_word: כֹּל יֹצֵא צָבָא
  choice: bawat lalaking maaaring lumabas upang makipagdigma
  rationale: Sa konteksto ng sensus, ang panlalaking parirala ay tumutukoy sa mga lalaking karapat-dapat sa paglilingkod-militar. Nililinaw ng “maaaring” ang gamit nito nang hindi itinatago sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Panlalaking wika ng sensus
  choice: bawat lalaking maaaring lumabas upang makipagdigma
  alternative: bawat maaaring lumabas upang makipagdigma
  rationale: Panlalaki sa balarila at sa konteksto ang Hebreo, sapagkat binibilang ang mga lalaking nasa edad para sa paglilingkod-militar; kaya hindi ginawang neutral sa kasarian ang salin.
- issue: Saklaw ng pariralang militar
  choice: maaaring lumabas upang makipagdigma
  alternative: lumalabas upang maglingkod sa hukbo
  rationale: Ang יֹצֵא צָבָא ay maaaring ilarawan nang mas literal bilang paglabas kasama ng hukbo, ngunit sa kontekstong ito ay pormula ito ng pagiging kuwalipikado sa tungkuling militar. Pinananatili sa talababa ang literal na alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino; pinananatili ang paulit-ulit na estruktura ng pormula ng sensus. Ginamit ang gitling bago ang huling kwalipikasyon upang madaling masundan ang mahabang talaan, at ang tutuldok ay nagpapanatili sa pagkakaugnay nito sa bilang na sumusunod sa kasunod na talata.
