lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: ang mga nabilang
  rationale: Tumutukoy ang anyong mula sa פקד sa mga naitala o nabilang sa sensus. Likas sa modernong Filipino ang “mga nabilang” at hindi nito dinaragdagan ang tahasang nilalaman ng talata.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa pormula ng sensus, ipinahihiwatig ng לְ kasama ng מַטֶּה ang kaugnayan sa isang lipi. Ang “mula sa lipi ni” ay malinaw at natural sa Filipino.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Karaniwang anyo ng pangalang Reuben sa mga saling Bibliya sa Filipino.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 46,500
  rationale: Inilalahad ang eksaktong kabuuan sa karaniwang makabagong notasyong pamilang upang madaling mabasa.
