  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: tl
  text: Magkakampo[a] ang mga anak ni Israel, bawat lalaki sa kaniyang kampo at bawat lalaki sa kaniyang bandila, ayon sa kani-kanilang mga pangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magkakampo ang mga Israelita, bawat isa sa kaniyang kampo at bawat isa sa kaniyang watawat, ayon sa kani-kanilang mga yunit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנוּ
  choice: Magkakampo
  rationale: Ang Qal perfect na may prefixed conjunction ay may hinaharap o nag-uutos na diwa sa kontekstong ito ng pagtatakda ng kaayusan sa kampo. Likas sa modernong Tagalog ang “magkakampo” at hindi nito dinaragdagan ang lakas ng utos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang literal at pamilyar na ekspresyong Hebreo, habang nananatiling malinaw sa makabagong Tagalog. Ang “mga Israelita” ay mas maikli at likas ding alternatibo.
- source_word: אִישׁ ... וְאִישׁ
  choice: bawat lalaki ... at bawat lalaki
  rationale: Pinananatili ang distributibong pag-uulit at ang tahasang panlalaking pangngalan sa Hebreo, na binibigyang-diin ang pagkakatalaga ng bawat lalaki sa ayos ng kampo.
- source_word: עַל מַחֲנֵהוּ
  choice: sa kaniyang kampo
  rationale: Sa pariralang ito, ang עַל ay nagpapahiwatig ng kinalalagyan o kaugnayan sa nakatalagang kampo. Ang “sa kaniyang kampo” ang pinakanatural sa Tagalog nang hindi labis na tinutukoy ang eksaktong puwesto.
- source_word: דִּגְלוֹ
  choice: sa tabi ng kaniyang bandila
  rationale: Ang דֶּגֶל ay isang pantribo o panghukbong sagisag. Malinaw at hindi lipas ang “bandila”; ipinahahayag ng “sa tabi ng” ang pagkakapuwesto o pagkakaugnay na dala ng עַל nang hindi ipinapalagay na literal na nasa ilalim nito.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kanilang mga pangkat
  rationale: Tumutukoy ang צָבָא rito sa organisadong mga pangkat ng Israel. Naipahahayag ng “mga pangkat” ang kaayusang militar nang hindi ipinahihiwatig na kasalukuyang nakikipagdigma sila.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormal na “mga anak ni Israel” at ang pag-uulit na “bawat lalaki,” ngunit ginamit ang likas na ayos ng pangungusap sa Filipino. Ang “kaniyang” ay pinili bilang dignified written form; hindi ginawang mas tiyak kaysa sa Hebreo ang ugnayang panlunan ng עַל.
