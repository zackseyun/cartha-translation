  yaml_path: translation/ot/numbers/026/047.yaml
  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: tl
  text: Ito ang mga angkan ng mga anak ni Aser. Ang bilang ng mga ito sa sensus ay limampu't tatlong libo at apat na raan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na pagkakasabi, “ayon sa kanilang mga naitala.” Ang Hebreo ay gumagamit ng terminolohiya ng sensus mula sa pandiwang פקד, na tumutukoy sa mga itinala o binilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panimulang pormula sa Filipino para sa pangmaramihang talaan; ipinahihiwatig ng “ang” ang panaguri nang hindi kailangang gawing “ang mga ito ay.”
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Tumutukoy sa malalawak na pangkat ng magkakamag-anak sa loob ng isang lipi, hindi lamang sa mga pamilyang nukleyar.
- source_word: בְּנֵי אָשֵׁר
  choice: mga anak ni Aser
  rationale: Pinananatili ang anyong pangangkanan ng Hebreo; sa konteksto, saklaw nito ang mga lalaking inapo ni Aser na kabilang sa lipi.
- source_word: לִפְקֻדֵיהֶם
  choice: ayon sa mga nabilang sa kanila
  rationale: Ipinapakita ang opisyal na pagbibilang o pagtatala sa sensus, hindi lamang ang abstraktong kabuuang bilang.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: limampu't tatlong libo at apat na raan
  rationale: Natural na makabagong anyo ng bilang sa Filipino at eksaktong pinananatili ang kabuuang 53,400.
