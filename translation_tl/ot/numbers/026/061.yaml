base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: tl
  text: Ngunit namatay sina Nadab at Abihu nang maghandog sila ng ibang apoy[a] sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “di-karaniwang apoy” o “apoy na mula sa labas.” Sa konteksto ng paghahandog, tumutukoy ito sa apoy na hindi pinahintulutang gamitin sa paghahandog sa harap ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: namatay
  rationale: Bagaman isahan ang pandiwang Hebreo dahil nauuna ito sa tambalang simuno, tumutukoy ito kina Nadab at Abihu; likas sa Tagalog ang anyong “namatay” para sa dalawa.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadab at Abihu
  rationale: Isinalin sa karaniwang transliterasyon sa Tagalog ang mga pangalang pantangi.
- source_word: בְּהַקְרִיבָם
  choice: nang maghandog sila
  rationale: Ang ב na kasama ng infinitive construct at hulaping panghalip ay temporal dito. Malinaw at natural sa kontekstong pansakripisyo ang “nang maghandog sila.”
- source_word: אֵשׁ זָרָה
  choice: ibang apoy
  rationale: Pinananatili ng “ibang apoy” ang tuwirang diwa ng זָרָה nang hindi lubusang nilulutas sa pangunahing teksto kung ito ay kakaiba, mula sa labas, o hindi pinahintulutan. Ipinaliliwanag ng talababa ang kahulugan sa kontekstong pangkulto.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Ang parirala ay natural na tumutukoy sa paghahandog sa harapan o presensiya ng Diyos.
- source_word: וַ
  choice: Ngunit
  rationale: Ginagawang malinaw ng “Ngunit” ang pagsalungat ng natatanging pagkamatay nila sa nakapaligid na talaangkanan.
theological_decisions:
- issue: Paglalarawan sa אֵשׁ זָרָה
  choice: ibang apoy
  alternative: apoy na hindi pinahintulutan
  rationale: Ang “ibang apoy” ay nagpapanatili sa leksikal na lawak ng Hebreo. Ang mas tiyak na “hindi pinahintulutan” ay malamang na ipinahihiwatig ng kontekstong pansamba ngunit hindi tahasang sinasabi sa pariralang ito.
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa dalawang pangalang pantangi at iniwasan ang labis na teknikal na “hindi awtorisadong apoy” sa pangunahing teksto.
