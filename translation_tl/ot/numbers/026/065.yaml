  text: כִּֽי אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּ/מִּדְבָּ֑ר וְ/לֹא נוֹתַ֤ר מֵ/הֶם֙ אִ֔ישׁ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: tl
  text: Sapagkat sinabi ni Yahweh sa kanila, “Tiyak na mamamatay sila sa ilang,”[a] at wala ni isang lalaki sa kanila ang natira maliban kina Caleb na anak ni Jefune at Josue na anak ni Nun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa pagkamatay ay mamamatay sila,” isang mariing anyo na nangangahulugang tiyak silang mamamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כִּי אָמַר יְהוָה לָהֶם
  choice: Sapagkat sinabi ni Yahweh tungkol sa kanila
  rationale: Ang כִּי ay nagbibigay ng paliwanag sa naunang pahayag, at ang לָהֶם dito ay likas unawaing tumutukoy sa mga taong saklaw ng pasiya.
- source_word: מוֹת יָמֻתוּ
  choice: Tiyak na mamamatay sila
  rationale: Ang infinitive absolute na kasunod ng pandiwang may parehong ugat ay nagbibigay-diin sa katiyakan ng kamatayan.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, natural, at angkop na salin ng מִדְבָּר sa konteksto ng paglalakbay ng Israel.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: at wala ni isang lalaking natira sa kanila
  rationale: Pinananatili ang panlalaking isahan na אִישׁ at ang distributibong diin na walang kahit isang lalaki mula sa tinutukoy na salinlahi ang natira.
- source_word: כִּי אִם
  choice: maliban kina
  rationale: Ipinakikilala ng idyomang ito ang tanging dalawang eksepsiyon sa naunang negatibong pahayag.
- source_word: כָּלֵב בֶּן יְפֻנֶּה וִיהוֹשֻׁעַ בִּן נוּן
  choice: Caleb na anak ni Jefune at Josue na anak ni Nun
  rationale: Ginamit ang mga pangalang karaniwang makikilala sa Filipino at natural na isinalin ang mga patronimiko.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng pahayag na walang natira
  choice: wala ni isang lalaking natira sa kanila
  alternative: walang sinumang natira sa kanila
  rationale: Pinananatili ng pangunahing teksto ang tahasang אִישׁ (“lalaki”), bagaman maaari itong unawain nang distributibo bilang “walang sinuman” sa kontekstong ito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Sapagkat” para sa paliwanag na ugnayan, “ilang” para sa wilderness, at “wala ni isang lalaking natira” upang mapanatili ang anyo at diin ng Hebreo.
