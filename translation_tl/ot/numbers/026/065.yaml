revisions:
- from: Sapagkat sinabi ni Yahweh tungkol sa kanila, “Tiyak na mamamatay sila sa ilang,”[a] at wala ni isang lalaking natira sa kanila maliban kina Caleb na anak ni Jefune at Josue na anak ni Nun.
  to: Sapagkat sinabi ni Yahweh sa kanila, “Tiyak na mamamatay sila sa ilang,”[a] at wala ni isang lalaki sa kanila ang natira maliban kina Caleb na anak ni Jefune at Josue na anak ni Nun.
  rationale: Pinalitan ang “tungkol sa kanila” ng “sa kanila” upang tapat na maisalin ang לָהֶם. Inayos din ang ayos ng sugnay na “wala ni isang lalaki sa kanila ang natira” para sa mas malinaw na modernong Filipino nang hindi binabago ang panlalaking isahan at distributibong diin ng אִישׁ. Walang kinakailangang dagdag na talababa.
