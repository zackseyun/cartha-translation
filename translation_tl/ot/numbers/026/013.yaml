translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang maikli at paralelong anyo ng talaan. Ginamit ang “angkan” para sa yunit ng magkakamag-anak at ang transliterasyong “Zera” at “Shaul” na malapit sa Hebreo.
