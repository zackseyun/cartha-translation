  yaml_path: translation/ot/numbers/026/013.yaml
  text: of Zerah, the clan of the Zerahites; of Shaul, the clan of the Shaulites.
translation:
  language: tl
  text: Mula kay Zera ay nagmula ang angkan ng mga Zeraita; mula kay Shaul ay nagmula ang angkan ng mga Shaulita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: kay Zera
  rationale: Sa pormula ng sensus, ang לְ ay nagpapakilala sa ninunong pinagmulan ng angkan. Likas sa Tagalog ang “kay Zera” sa ganitong sunud-sunod na talaan.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa kontekstong pantribo at pansensus, ang מִשְׁפָּחָה ay isang pangkat ng magkakamag-anak sa loob ng lipi; mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: הַזַּרְחִי
  choice: mga Zeraita
  rationale: Ang anyong patronimiko ay tumutukoy sa pangkat ng mga inapo ni Zera. Ginamit ang hulaping “-ita,” na natural sa mga pangalang pangkat sa Tagalog.
- source_word: לְ/שָׁאוּל
  choice: kay Shaul
  rationale: Gaya sa unang sugnay, ipinahihiwatig ng לְ ang kaugnayang genealogical sa ninunong si Shaul.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Inulit nang pareho upang mapanatili ang paralelismo at pormula ng tekstong Hebreo.
- source_word: הַשָּׁאוּלִי
  choice: mga Shaulita
  rationale: Ang patronimikong anyo ay tumutukoy sa angkang nagmula kay Shaul; malinaw at maikli ang “mga Shaulita.”
