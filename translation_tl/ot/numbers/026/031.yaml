  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: tl
  text: mula kay Asriel, ang angkan ng mga Asrielita; at mula kay Shekem, ang angkan ng mga Shekemita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: Ashriel
  rationale: Tuwirang transliterasyon ng pangalang Hebreo; pinananatili ang tunog na sh ng שׂ sa anyong ito.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa konteksto ng sensus at talaangkanan, tumutukoy ito sa isang pangkat ng magkakamag-anak sa loob ng lipi; natural at tiyak ang “angkan” sa Filipino.
- source_word: הָאַשְׂרִיאֵלִי
  choice: mga Ashrielita
  rationale: Ang gentiliko ay tumutukoy nang sama-sama sa mga inapo o kaangkan ni Ashriel; ang hulaping “-ita” ay likas na anyo sa Filipino para sa ganitong katawagan.
- source_word: וְ
  choice: at
  rationale: Payak na pang-ugnay sa dalawang tala ng angkan.
- source_word: שֶׁכֶם
  choice: Shekem
  rationale: Transliterasyon ng personal na pangalan ayon sa tunog ng Hebreo; dito ay pangalan ito ng ninuno, hindi ng lugar.
- source_word: הַשִּׁכְמִי
  choice: mga Shekemita
  rationale: Kolektibong katawagan sa mga inapo o kaangkan ni Shekem, gamit ang natural na hulaping Filipino na “-ita.”
