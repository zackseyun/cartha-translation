    rationale: Ang pangalang Hebreo ay אַשְׂרִיאֵל, na may sin (שׂ), hindi shin (שׁ). Hindi sinusuportahan ng anyong Hebreo ang /sh/ na baybay sa pangalan.
  - severity: medium
