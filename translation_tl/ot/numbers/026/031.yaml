  source_fidelity: Kailangang itama ang pangalan sa unang tala. Ang Hebreong אַשְׂרִיאֵל ay may שׂ (sin), na karaniwang isinasalin bilang /s/, hindi /sh/; kaya mas tapat ang “Asriel” kaysa “Ashriel.” Tama ang pag-unawa sa מִשְׁפַּחַת bilang “angkan” at sa mga gentiliko bilang mga pangkat ng inapo.
  naturalness: Natural at malinaw ang pormulang “mula kay …, ang angkan ng mga …” sa isang talaang sensus. Ang “Shekem” at “mga Shekemita” ay maayos na Filipino transliterasyon ng pangalang may /sh/ sa Hebreo.
  terminology: Ang “angkan” ay angkop para sa mishpachah sa kontekstong talaangkanan/sensus. Ang mga anyong “Asrielita” at “Shekemita” ay malinaw na kolektibong katawagan para sa mga inapo o kaangkan.
  issues:
