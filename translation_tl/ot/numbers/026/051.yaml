  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: tl
  text: 'Ito ang mga lalaking naitala sa sensus[b] ng mga anak ni Israel[a]: animnaraang libo at isang libo, pitong daan at tatlumpu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “mga binilang”; tumutukoy ang Hebreo sa mga inirehistro sa sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala ng panghalip na maramihan ang kabuuan ng sensus; natural sa Filipino ang panimulang “Ito ang” bago ang pangngalang kolektibo.
- source_word: פְּקוּדֵי
  choice: mga lalaking naitala sa sensus
  rationale: Sa konteksto ng Bilang 26, tumutukoy ito sa mga taong inirehistro at binilang sa sensus, partikular sa mga lalaking saklaw ng pagbibilang, hindi lamang sa abstraktong kabuuang bilang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pamilyang paglalarawan ng Hebreo sa halip na palitan agad ng etnikong katawagang “mga Israelita.”
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: animnaraan at isang libo, pitong daan at tatlumpu
  rationale: Tuwirang inilalahad ang kabuuang 601,730 sa natural at malinaw na anyong Filipino.
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang literal na pamilyang idyoma ng Hebreo at ang kaugnayan sa patriyarkang si Israel, nang hindi binubura ang kolektibong gamit nito para sa bayan.
- issue: Kahulugan ng פְּקוּדֵי sa konteksto ng sensus
  choice: mga lalaking naitala sa sensus
  alternative: mga binilang; kabuuang bilang sa sensus
  rationale: Ang talata ay nag-uulat tungkol sa mga taong nairehistro sa sensus. Ang napiling anyo ay malinaw na tumutukoy sa mga tao, habang ang tala sa ibaba ay nagpapanatili sa mas literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang salitang “sensus” upang maipahayag ang konteksto ng pagpapatala, habang pinanatili ang Hebreong pamilyang katawagang “mga anak ni Israel.”
