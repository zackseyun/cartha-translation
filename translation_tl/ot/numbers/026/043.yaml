lexical_decisions:
- source_word: כָּל
  choice: ang lahat ng
  rationale: Ipinahahayag ang kabuuan ng mga angkang tinutukoy sa buod ng sensus.
- source_word: מִשְׁפְּחֹת
  choice: angkan
  rationale: Sa konteksto ng lipi at talaangkanan, mas malinaw ang “angkan” kaysa “pamilya” para sa mas malawak na pangkat na magkakamag-anak.
- source_word: הַשּׁוּחָמִי
  choice: mga Shuhamita
  rationale: Pangngalang pantukoy ito sa mga inapo o pangkat na kaugnay ni Shuham; pinanatili ang pangalang pantangi at ginamit ang likas na anyong Filipino para sa pangkat.
- source_word: לִפְקֻדֵיהֶם
  choice: ayon sa bilang ng mga naitala sa kanila
  rationale: Tumutukoy sa mga opisyal na naitala at binilang sa sensus, hindi lamang sa isang abstraktong pagbibilang.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
