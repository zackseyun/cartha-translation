  source_fidelity: 'Tumpak ang pangunahing kahulugan: ang mga angkan ng mga Zebulunita at ang kabuuang bilang na 60,500. Gayunman, ang “mga naitala sa kanila” ay maaaring mangahulugang mga taong itinala sa kanila, sa halip na mga taong kabilang sa kanila na naitala sa sensus. Ang pandiwang-ugat ng Hebreo ay tumutukoy sa mga taong nabilang/naitala sa pagpapatala.'
