  text: 'These are the clans of the Zebulunites according to those numbered from them: sixty thousand and five hundred.'
translation:
  language: tl
  text: 'Ito ang mga angkan ng mga Zebulunita ayon sa bilang ng mga naitalang kabilang sa kanila: animnapung libo at limang daan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panandang Filipino para sa maramihang pangkat na inilalahad; sa Filipino, hindi kailangang markahan sa deiktiko ang bilang.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa konteksto ng tribo at sensus, tumutukoy ito sa malalaking pangkat na magkakamag-anak, kaya mas tiyak ang “angkan” kaysa “pamilya.”
- source_word: הַזְּבוּלֹנִי
  choice: mga Zebulunita
  rationale: Ang anyong gentiliko ay kolektibong tumutukoy sa mga nagmula kay Zebulun; natural at malinaw sa Filipino ang “mga Zebulunita.”
- source_word: לִפְקֻדֵיהֶם
  choice: ayon sa bilang ng mga naitala sa kanila
  rationale: Pinananatili nito ang diwa ng פקד sa sensus—mga taong opisyal na binilang o itinala—at ang kaugnayan nila sa kabuuang bilang.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: animnapung libo at limang daan
  rationale: Isinusulat sa salita ang bilang upang mapanatili ang pormal na estilo ng talaan ng sensus.
