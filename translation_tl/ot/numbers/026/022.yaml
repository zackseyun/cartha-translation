  text: 'These were the clans of Judah according to those numbered of them: seventy-six thousand five hundred[a].'
translation:
  language: tl
  text: 'Ito ang mga angkan ni Juda ayon sa mga nabilang sa kanila: pitumpu''t anim na libo at limang daan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa kanilang bilang.” Ang pariralang Hebreo ay pormula ng sensus na tumutukoy sa mga ipinatala o binilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na Filipino na panimulang pormula para sa pangmaramihang kabuuang tala; hindi kailangang lagyan ng tahasang pandiwang pangnagdaan sapagkat walang pandiwa sa Hebreo.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa konteksto ng sensus ng tribo, tumutukoy ito sa mga pangkat ng magkakamag-anak sa loob ng tribo; mas tiyak ang “angkan” kaysa “pamilya.”
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyong Filipino ng pangalan ng tribo at ninuno na יְהוּדָה.
- source_word: לִפְקֻדֵיהֶם
  choice: ayon sa mga nabilang sa kanila
  rationale: Pinananatili ang diwa ng pormulang pansensus mula sa ugat na פקד at ang hulaping pangmaramihan, habang gumagamit ng malinaw at natural na Filipino.
- source_word: שִׁשָּׁה וְשִׁבְעִים אֶלֶף
  choice: pitumpu't anim na libo
  rationale: Karaniwang ayos ng bilang sa modernong Filipino, na eksaktong nagpapanatili sa halagang 76,000.
- source_word: וַחֲמֵשׁ מֵאוֹת
  choice: at limang daan
  rationale: Tuwirang modernong Filipino para sa huling 500 ng kabuuang bilang.
