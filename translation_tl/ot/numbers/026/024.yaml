base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: tl
  text: kay Jasub, ang angkan ng mga Jasubita; kay Simron, ang angkan ng mga Simronita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: kay Jasub
  rationale: Sa pormula ng talaan ng sambahayan, ipinakikilala ng לְ ang ninunong pinagmulan ng angkan; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kay.”
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa konteksto ng sensus ng mga lipi, tumutukoy ito sa pangkat ng magkakamag-anak sa loob ng isang lipi; mas tiyak ang “angkan” kaysa “pamilya.”
- source_word: הַ/יָּשׁוּבִי
  choice: mga Jasubita
  rationale: Ang anyong gentiliko ay tumutukoy sa pangkat na nagmula kay Jasub; malinaw at maikli itong naipapahayag bilang “mga Jasubita.”
- source_word: לְ/שִׁמְרֹן
  choice: kay Simron
  rationale: Gaya sa unang sugnay, ipinakikilala ng לְ ang ninunong pinagmulan ng angkan, kaya pinananatili ang magkatulad na pormula.
- source_word: הַ/שִּׁמְרֹנִי
  choice: mga Simronita
  rationale: Ang gentiliko ay pangalan ng angkang nagmula kay Simron; ang “mga Simronita” ay natural sa modernong Tagalog.
