translation_notes:
  register: Maikli at pormal ang pagkakasalin upang mapanatili ang paulit-ulit na estruktura ng talaang pansensus. Ginamit ang mga karaniwang anyong Tagalog ng mga pangalang Jasub at Simron at ang hulaping -ita para sa mga pangkat na nagmula sa kanila.
