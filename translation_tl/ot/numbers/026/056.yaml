  text: Ayon sa palabunutan, hahatiin ang kanyang mana sa pagitan ng mas maraming pangkat at ng mas kaunting pangkat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל פִּי
  choice: Ayon sa
  rationale: Likas na salin ng idyomang nangangahulugang batay sa pasiya o kinalabasan ng isang bagay.
- source_word: הַגּוֹרָל
  choice: kapalaran
  rationale: Sa kontekstong ito, tumutukoy ito sa paraang ginagamit upang italaga ang bahagi ng lupain; pinananatili ng salitang ito ang maikli at tuwirang anyo ng Hebreo.
- source_word: תֵּחָלֵק
  choice: hahatiin
  rationale: Ipinapahayag ng Niphal ang pasibong paghahati o pamamahagi ng mana.
- source_word: נַחֲלָתוֹ
  choice: ang kanyang mana
  rationale: Pinananatili ang pang-isahang panlalaking hulapi ng Hebreo, na sa konteksto ay distributibo at tumutukoy sa mana ng bawat pangkat.
- source_word: בֵּין
  choice: sa pagitan ng
  rationale: Tuwirang ipinapakita ang paghahambing ng dalawang magkatapat na pangkat.
- source_word: רַב
  choice: mas malaking pangkat
  rationale: Sa konteksto ng sensus at pamamahagi, inilalarawan nito ang pangkat na mas marami ang bilang; idinagdag ang 'pangkat' upang maging malinaw at natural sa Filipino.
- source_word: לִמְעָט
  choice: ng mas maliit
  rationale: Kaagapay ito ng 'mas malaking pangkat' at ipinahihiwatig ang pangkat na mas kaunti ang bilang nang hindi inuulit ang pangngalan.
