    issue: Ang "kapalaran" ay hindi sapat na tiyak para sa הַגּוֹרָל.
    rationale: Sa kasalukuyang gamit, pangunahing tumutukoy ang kapalaran sa fate/destiny. Dito, ang Hebreo ay tumutukoy sa lot na ginagamit sa paglalaan; kaya maaaring magpahiwatig ang draft ng teolohikal o semantikong kahulugang wala sa teksto.
  - severity: low
    issue: Ang "mas malaking pangkat" at "mas maliit" ay maaaring basahin bilang laki ng pangkat sa pisikal na diwa.
    rationale: Ang kaibahan sa Hebreo, ayon sa agarang konteksto ng census, ay dami/bilang. Ang "mas marami" at "mas kaunti" ay mas tuwiran.
  revised_text: Ayon sa palabunutan, hahatiin ang kanyang mana sa pagitan ng mas maraming pangkat at ng mas kaunting pangkat.
