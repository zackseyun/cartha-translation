  verdict: revise
  source_fidelity: Ang "kapalaran" ay karaniwang nangangahulugang tadhana o kapalaran sa modernong Filipino at hindi malinaw na tumutukoy sa teknikal na paraan ng paglalaan sa pamamagitan ng mga bunot. Mas tapat ang "palabunutan" sa הַגּוֹרָל sa kontekstong ito. Napananatili ng binagong salin ang pasibong paghahati, ang distributibong "kanyang mana," at ang pagtutulad ng mas marami at mas kaunting pangkat.
  naturalness: Ang "Ayon sa palabunutan" at "mas maraming pangkat at mas kaunting pangkat" ay malinaw at likas sa modernong Filipino. Iniiwasan nito ang posibleng maling pakahulugang tadhana ng "kapalaran."
  terminology: Ginamit ang "palabunutan" bilang teknikal na katumbas ng lot. Ang "mana" ay angkop para sa נַחֲלָה, at ang "pangkat" ay nagpapalinaw na ang malaki/maliit ay ukol sa bilang sa konteksto ng sensus.
  issues:
