  to: Ang mga nabilang sa kanila ay dalawampu't tatlong libo—lahat ng lalaki mula sa isang buwang gulang pataas. Hindi sila ibinilang na kasama ng mga Israelita, sapagkat hindi sila binigyan ng mana sa gitna ng mga Israelita.
