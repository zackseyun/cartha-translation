  text: וַ/יִּהְי֣וּ פְקֻדֵי/הֶ֗ם שְׁלֹשָׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף כָּל זָכָ֖ר מִ/בֶּן חֹ֣דֶשׁ וָ/מָ֑עְלָ/ה כִּ֣י לֹ֣א הָתְפָּקְד֗וּ בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא נִתַּ֤ן לָ/הֶם֙ נַחֲלָ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: tl
  text: Ang mga nabilang sa kanila ay dalawampu't tatlong libo—lahat ng lalaki mula sa isang buwang gulang pataas. Hindi sila ibinilang na kasama ng mga Israelita, sapagkat hindi sila binigyan ng mana sa gitna ng mga Israelita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: ang mga nabilang sa kanila
  rationale: Ipinahahayag nito ang mga taong kabilang sa sensus, habang pinananatili ang ugnayan ng panghalip na 'kanila' sa mga Levita sa konteksto.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: dalawampu't tatlong libo
  rationale: Karaniwang anyong Tagalog ng bilang na 23,000.
- source_word: כָּל זָכָר
  choice: lahat ng lalaki
  rationale: Saklaw ng parirala ang bawat lalaking kasarian, kabilang ang mga sanggol; malinaw ito sa kasunod na takdang edad.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: mula isang buwang gulang pataas
  rationale: Likas at malinaw na Tagalog para sa pinakamababang edad na isang buwan.
- source_word: הָתְפָּקְדוּ
  choice: isinama sa bilang
  rationale: Pinananatili ang diwa ng ugat na פקד sa konteksto ng sensus, ngunit iniiwasan ang matigas na pag-uulit ng 'nabilang' sa Tagalog.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: sa bilang ng mga Israelita / sa gitna ng mga Israelita
  rationale: Ang בְּתוֹךְ ay tumutukoy sa pagiging kabilang o nasa gitna. Ginamit ang 'mga Israelita' bilang likas na modernong Tagalog para sa kolektibong בְּנֵי יִשְׂרָאֵל, habang iniangkop ang unang paglitaw sa konteksto ng pagbibilang.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: hindi sila binigyan ng mana
  rationale: Natural na Tagalog na nagpapanatili sa pasibong diwa at sa kahulugan ng נַחֲלָה bilang minanang bahagi, lalo na ang lupang ipinamamahagi.
theological_decisions:
- issue: Pagpapahayag ng בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak ni Israel
  rationale: Bagaman literal na 'mga anak ni Israel,' ang 'mga Israelita' ang natural at malinaw na kolektibong katawagan sa modernong Tagalog at hindi nito binabago ang tinutukoy na sambayanan.
- issue: Kahulugan ng נַחֲלָה sa kalagayan ng mga Levita
  choice: mana
  alternative: minanang lupain
  rationale: Pinananatili ng 'mana' ang mas malawak na teolohikal at legal na saklaw ng salita, nang hindi tahasang nililimitahan sa lupa kahit lupang bahagi ang pangunahing konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pagbasa ng karaniwang mambabasa. Pinanatili ang dalawang magkaugnay na dahilan sa Hebreo, ngunit hinati sa dalawang pangungusap upang maging natural at madaling maunawaan.
