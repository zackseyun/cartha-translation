  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: tl
  text: Kay Ozni ay ang angkan ng mga Oznita; kay Eri ay ang angkan ng mga Erita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְאָזְנִי
  choice: mula kay Ozni
  rationale: Sa pormula ng talaangkanan at sensus, ipinakikilala ng לְ ang ninunong pinagmulan ng angkan. Likas sa modernong Tagalog ang “mula kay” at malinaw nitong ipinahahayag ang ugnayang genealogical.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa kontekstong pantribo at pansensus, tumutukoy ang מִשְׁפָּחָה sa isang malawak na pangkat ng magkakamag-anak sa loob ng lipi; mas angkop ang “angkan” kaysa “pamilya.”
- source_word: הָאָזְנִי
  choice: mga Oznita
  rationale: Ang anyong gentilic na may pantukoy ay tumutukoy sa mga inapo o pangkat na nagmula kay Ozni. Ginamit ang hulaping Filipino na “-ita” upang likas na pangalanan ang pangkat.
- source_word: לְעֵרִי
  choice: mula kay Eri
  rationale: Gaya ng לְאָזְנִי, ipinakikilala ng לְ ang ninunong pinagmulan sa talaan; malinaw at natural ang “mula kay.”
- source_word: הָעֵרִי
  choice: mga Erita
  rationale: Ang gentilic ay tumutukoy sa pangkat ng mga inapo ni Eri; ang “mga Erita” ay maikli at likas na katumbas sa Filipino.
