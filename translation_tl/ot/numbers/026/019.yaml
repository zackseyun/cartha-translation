base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/019.yaml
  text: 'The sons of Judah: Er and Onan[a]. But Er and Onan died in the land of Canaan.'
translation:
  language: tl
  text: 'Ang mga anak ni Juda: sina Er at Onan. Ngunit[a] namatay sina Er at Onan sa lupain ng Canaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At namatay sina Er at Onan sa lupain ng Canaan.” Maaari ring isalin ang pang-ugnay sa Hebreo bilang simpleng “at”; ginamit sa pangunahing teksto ang “ngunit” upang ipakita ang kontras sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay tumutukoy rito sa mga lalaking anak sa talaangkanan. Likas sa modernong Filipino ang “mga anak ni” at hindi nito pinalalawak ang kahulugan tungo sa mga inapo.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyo sa Filipino ng pangalang Judah.
- source_word: עֵר
  choice: Er
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: וְ/אוֹנָן
  choice: at Onan
  rationale: Tuwirang isinalin ang pang-ugnay at pinanatili ang transliterasyon ng pangalang Onan.
- source_word: וַ/יָּמָת
  choice: Ngunit namatay
  rationale: 'Ang pandiwang mula sa מוּת ay payak na “namatay.” Ginamit ang “ngunit” upang ihayag ang kontras sa konteksto: kabilang sila sa talaan, subalit namatay sila sa Canaan.'
- source_word: בְּ/אֶרֶץ
  choice: sa lupain ng
  rationale: Natural at marangal na katumbas ng heograpikong pariralang Hebreo; pinananatili ang diwa ng אֶרֶץ bilang lupain.
- source_word: כְּנָעַן
  choice: Canaan
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang-lugar.
