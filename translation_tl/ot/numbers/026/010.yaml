  text: וַ/תִּפְתַּ֨ח הָ/אָ֜רֶץ אֶת פִּ֗י/הָ וַ/תִּבְלַ֥ע אֹתָ֛/ם וְ/אֶת קֹ֖רַח בְּ/מ֣וֹת הָ/עֵדָ֑ה בַּ/אֲכֹ֣ל הָ/אֵ֗שׁ אֵ֣ת חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ וַ/יִּהְי֖וּ לְ/נֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: tl
  text: At ibinuka ng lupa ang bibig nito at nilamon sila at si Korah,[a] nang mamatay ang kapulungan, nang lamunin ng apoy ang dalawang daan at limampung lalaki; at sila ay naging isang tanda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sila at si Korah.” Pinananatili ng talatang ito ang pagkakasabing kasama si Korah; ihambing ang mas malawak na salaysay sa Mga Bilang 16.
    reason: cross_reference
  - marker: b
    text: Maaari ring “isang babalang tanda.” Ang Hebreong נֵס ay maaaring tumukoy sa tanda, hudyat, o bandilang itinataas upang mapansin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: ibinuka ng lupa ang bibig nito
  rationale: Maaaring mangahulugan ang אֶרֶץ na “lupa” o “daigdig”; sa larawang bumuka ang lupa, natural sa Filipino ang “lupa.” Pinanatili ang personipikasyong “bibig.”
- source_word: וַתִּבְלַע
  choice: nilamon
  rationale: Tuwirang ipinahahayag ng בלע ang paglunok; ang “nilamon” ay natural at matingkad sa kasalukuyang Tagalog.
- source_word: אֹתָם וְאֶת־קֹרַח
  choice: sila, pati si Korah
  rationale: Pinananatili nito ang tahasang pagsama ng Hebreo kay Korah sa mga nilamon, nang hindi sinisikap itugma o ipaliwanag ayon sa ibang bahagi ng salaysay.
- source_word: בְּמוֹת הָעֵדָה
  choice: nang mamatay ang kapulungan
  rationale: Ang ב na kasama ng infinitive construct ay temporal. Ang “kapulungan” ay dignificado at angkop sa עֵדָה bilang nagkakatipong pangkat.
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: nang lamunin ng apoy
  rationale: Literal na “kumain” ang אכל, ngunit sa apoy ay natural ang “lamunin”; pinananatili rin nito ang malakas na larawan ng teksto.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: dalawang daan at limampung lalaki
  rationale: Tuwirang bilang ito, at ang “lalaki” ay tumutugma sa אִישׁ.
- source_word: וַיִּהְיוּ לְנֵס
  choice: sila ay naging isang tanda
  rationale: Ang נֵס ay maaaring “tanda,” “hudyat,” o “bandila.” Ang “tanda” ang pinakamalapit at hindi nito tahasang idinaragdag ang interpretasyong “babala,” bagaman ipinahihiwatig iyon ng konteksto.
theological_decisions:
- issue: Tinutukoy ng panghuling maramihang pandiwa sa “sila ay naging isang tanda”
  choice: Pinanatili ang malabong panghalip na “sila.”
  alternative: Tukuyin lamang ang 250 lalaki, o ang buong pangyayari, bilang tanda.
  rationale: Hindi tiyak sa Hebreo ang eksaktong antecedent ng maramihang pandiwa; hindi ito nilutas nang mas makitid kaysa sa pinagmulang teksto.
- issue: Pagkakaugnay ni Korah sa paglunok ng lupa sa talatang ito
  choice: Isinalin ang agarang sintaks bilang “sila, pati si Korah.”
  alternative: Ihiwalay si Korah sa mga nilamon upang itugma sa ibang detalye ng salaysay.
  rationale: Tahasan siyang isinasama ng talatang Hebreo, kaya hindi nagpasok ng harmonisasyon mula sa ibang talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kapulungan” para sa pormal ngunit madaling maunawaang rehistro, at pinanatili ang matingkad na mga larawang “bibig” at “lamunin.”
