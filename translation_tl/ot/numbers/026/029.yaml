base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: tl
  text: 'Ang mga anak ni Manases: mula kay Makir, ang angkan ng mga Makirita. At si Makir ay naging ama ni Galaad; mula kay Galaad, ang angkan ng mga Galaadita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Ang mga anak ni Manases
  rationale: Pinananatili ng “mga anak” ang pormal na anyong pangangkanan ng Hebreo, bagaman sa konteksto ng sensus ay maaari nitong saklawin ang mga inapo.
- source_word: לְמָכִיר
  choice: mula kay Makir
  rationale: Ang לְ sa pormulang ito ng sensus ay nagpapakilala sa pinagmulang sangay ng angkan; natural itong ipinahahayag sa Tagalog bilang “mula kay.”
- source_word: מִשְׁפַּחַת הַמָּכִירִי
  choice: ang angkan ng mga Makirita
  rationale: Ang מִשְׁפָּחָה rito ay isang pangkat na nakapaloob sa tribo, kaya mas tiyak ang “angkan” kaysa “pamilya”; ginawang pangmaramihan ang katawagang gentiliko upang tumukoy sa mga kabilang dito.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: Naging anak ni Makir si Galaad
  rationale: Natural at malinaw itong pagpapahayag sa modernong Tagalog ng relasyong ama-anak na ipinahihiwatig ng causative genealogical verb הוֹלִיד, nang hindi gumagamit ng makalumang “ipinanganak.”
- source_word: לְגִלְעָד
  choice: mula kay Galaad
  rationale: Tulad ng naunang לְמָכִיר, ipinakikilala nito ang linya o sangay na nagmula kay Galaad.
- source_word: מִשְׁפַּחַת הַגִּלְעָדִי
  choice: ang angkan ng mga Galaadita
  rationale: Isinasalin ang מִשְׁפָּחָה bilang “angkan” ayon sa antas ng pangkat sa sensus, at ang gentiliko bilang kolektibong “mga Galaadita.”
