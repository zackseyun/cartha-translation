  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: tl
  text: 'Ang mga anak ni Gad ayon sa kani-kanilang angkan: mula kay Zefon[a], ang angkan ng mga Zefonita; mula kay Hagi, ang angkan ng mga Hagita; at mula kay Shuni, ang angkan ng mga Shunita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang tradisyon ng pagsasalin, “Zifion” at “mga Zifionita” ang mababasa rito (ihambing sa Genesis 46:16). Ngunit “Zefon” (צפון) ang mababasa sa Tekstong Masoretiko sa talatang ito, kaya “Zefon” ang ginamit sa pangunahing teksto.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: Ang mga anak ni Gad
  rationale: Pinananatili ng “mga anak” ang pormal na pananalitang pangangkan ng Hebreo, samantalang malinaw sa konteksto na mga liping nagmula kay Gad ang tinutukoy.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa konteksto ng sensus, ang מִשְׁפָּחָה ay pangkat ng magkakamag-anak sa loob ng isang lipi; natural at tumpak dito ang “angkan.”
- source_word: לִצְפוֹן / לְחַגִּי / לְשׁוּנִי
  choice: mula kay Zefon / mula kay Hagi / mula kay Shuni
  rationale: Ang לְ sa paulit-ulit na pormulang pangangkan ay nagpapahiwatig ng pinagmulan o linya ng ninuno; malinaw itong naihahayag ng “mula kay.”
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: ang angkan ng mga Zefonita
  rationale: Ang anyong gentiliko ay tumutukoy sa angkang nagmula kay Zefon. Ginamit ang hulaping “-ita,” na natural sa Filipino para sa mga kasapi ng isang lahi o pangkat.
- source_word: מִשְׁפַּחַת הַחַגִּי
  choice: ang angkan ng mga Hagita
  rationale: Isinasalin ang katawagang gentiliko bilang pangmaramihang pangalan ng mga kasapi ng angkang nagmula kay Hagi.
- source_word: מִשְׁפַּחַת הַשּׁוּנִי
  choice: ang angkan ng mga Shunita
  rationale: Isinasalin ang katawagang gentiliko bilang pangmaramihang pangalan ng mga kasapi ng angkang nagmula kay Shuni.
