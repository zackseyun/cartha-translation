base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/017.yaml
  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: tl
  text: Mula kay Arod[a] ang angkan ng mga Arodita; mula kay Areli ang angkan ng mga Arelita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na pagkakasalin: “Kay Arod ang angkan ng mga Arodita; kay Areli ang angkan ng mga Arelita.” Ang pang-ukol na Hebreo na ל ay nagpapakilala sa bawat pangalan ng ninuno sa pormulang ginagamit sa talaan ng sambayanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲרוֹד
  choice: Mula kay Arod
  rationale: Sa pormulang ginagamit sa talaan ng sambayanan, ipinakikilala ng ל ang ninunong pinagmulan ng angkan. Likas sa modernong Tagalog ang “mula kay” at malinaw nitong ipinahahayag ang ugnayan ng lahi.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa konteksto ng tribo at sensus, tumutukoy ang מִשְׁפָּחָה sa isang pangkat ng magkakamag-anak sa loob ng tribo; ang “angkan” ang malinaw at angkop na katumbas.
- source_word: הָאֲרוֹדִי
  choice: mga Arodita
  rationale: Ang anyong gentiliko ay pangalan ng pangkat na nagmula kay Arod. Ginamit ang nakaugaliang anyong Tagalog na may hulaping -ita at panandang maramihan.
- source_word: לְאַרְאֵלִי
  choice: mula kay Areli
  rationale: Katulad ng unang parirala, ipinakikilala ng ל ang ninunong pinagmulan ng angkan at pinananatili ng “mula kay” ang magkatulad na hulma ng talata.
- source_word: הָאַרְאֵלִי
  choice: mga Arelita
  rationale: Tinutukoy ng anyong gentiliko ang pangkat ng mga inapo ni Areli; natural sa Tagalog ang kolektibong “mga Arelita.”
