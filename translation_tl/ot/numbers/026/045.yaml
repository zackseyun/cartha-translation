base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: tl
  text: 'Sa mga anak ni Beria: mula kay Heber, ang angkan ng mga Heberita; mula kay Malkiel, ang angkan ng mga Malkielita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Sa mga anak ni
  rationale: Sa pormula ng talaangkanan at sensus, ipinakikilala ng ל ang mga sangay na kabilang sa linya ni Beria. Pinananatili ng “mga anak” ang hayag na anyong genealogical ng בְנֵי at natural ito sa Filipino.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Isinalin sa karaniwang anyong transliterado sa Filipino ang pangalang pantangi.
- source_word: לְ/חֶבֶר
  choice: mula kay Heber
  rationale: Sa paulit-ulit na pormula ng sensus, ipinahihiwatig ng ל bago ang pangalan ng ninuno ang pinagmulang linya ng angkan; malinaw at natural itong naihahayag ng “mula kay.”
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa kontekstong pantribo at genealogical, ang מִשְׁפָּחָה ay isang pangkat ng magkakamag-anak sa loob ng tribo. Mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: הַֽ/חֶבְרִי
  choice: mga Heberita
  rationale: Ang anyong patronimiko ay tumutukoy sa pangkat ng mga nagmula kay Heber. Ang hulaping “-ita” ay likas na paraan sa Filipino ng pagtukoy sa mga kabilang sa gayong lipi.
- source_word: לְ/מַ֨לְכִּיאֵל
  choice: mula kay Malkiel
  rationale: Gaya sa pangalan ni Heber, ipinakikita ng ל ang pinagmulan ng sangay ng angkan; pinananatili ito ng “mula kay.”
- source_word: הַ/מַּלְכִּיאֵלִי
  choice: mga Malkielita
  rationale: Ang patronimikong anyo ay tumutukoy sa angkang nagmula kay Malkiel; malinaw at maikli ang “mga Malkielita.”
