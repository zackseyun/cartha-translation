base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/034.yaml
  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
translation:
  language: tl
  text: Ito ang mga angkan ni Manases, at ang mga nabilang sa kanila[a] ay 52,700.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga nakatala sa kanila” o “ang mga tinipon at binilang sa kanila.” Gumagamit ang Hebreo ng isang anyo ng פקד, na tumutukoy sa mga binilang o itinala para sa sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na modernong Tagalog na panimula sa isang buod o talaan; hindi kailangang markahan ang bilang ng panghalip dahil malinaw sa kasunod na maramihang pangngalan.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa konteksto ng sensus sa Mga Bilang, tumutukoy ito sa malalaking pangkat ng magkakamag-anak sa loob ng lipi, hindi lamang sa sambahayan o nuklear na pamilya.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: וּפְקֻדֵיהֶם
  choice: ang mga nabilang sa kanila
  rationale: Pinananatili ang pasibong diwa ng פקד sa pormula ng sensus at ang kaugnayan ng mga taong binilang sa mga angkang nabanggit, nang hindi idinaragdag sa talata ang salitang 'lalaki,' na hindi hayagang naroon sa pariralang ito.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 52,700
  rationale: Karaniwan at malinaw na pagsulat sa modernong Filipino ng eksaktong kabuuang limampu't dalawang libo at pitong daan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “angkan” bilang angkop na terminong panlipi at “mga nabilang sa kanila” upang mapanatili ang pormula ng sensus at ang bahagyang pagiging di-tiyak ng Hebreo.
