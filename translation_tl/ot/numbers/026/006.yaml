base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/006.yaml
  text: from Hezron[a], the clan of the Hezronites; from Carmi, the clan of the Carmites.
translation:
  language: tl
  text: mula kay Hezron[a], ang angkan ng mga Hezronita; mula kay Carmi, ang angkan ng mga Carmita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para kay Hezron … para kay Carmi.” Mas literal itong salin ng pang-ukol sa Hebreo, ngunit dito ay ginagamit ito sa diwa ng talaangkanan o sensus upang tukuyin ang pinagmulan o pagkakabilang ng angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: mula kay Hezron
  rationale: Sa pormula ng talaangkanan at sensus, ang לְ ay nagpapahiwatig ng pinagmulan o pagkakabilang sa linya ni Hezron. Likas sa modernong Tagalog ang “mula kay Hezron.”
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa kontekstong ito, tumutukoy ang מִשְׁפָּחָה sa isang pangkat ng magkakamag-anak sa loob ng lipi; mas tiyak ang “angkan” kaysa “pamilya.”
- source_word: הַֽ/חֶצְרוֹנִי
  choice: mga Hezronita
  rationale: Ang anyong gentilic ay tumutukoy nang kolektibo sa mga inapo o pangkat na kaugnay ni Hezron; malinaw itong naipahahayag ng “mga Hezronita.”
- source_word: לְ/כַרְמִי
  choice: mula kay Carmi
  rationale: Gaya sa לְחֶצְרֹן, ipinahihiwatig ng לְ ang pinagmulang talaangkanan o pagkakabilang; pinananatili ng “mula kay Carmi” ang magkatulad na kayarian.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Inulit nang pareho upang mapanatili ang paralelismo at malinaw na katawagan sa yunit ng pagkakamag-anak.
- source_word: הַ/כַּרְמִי
  choice: mga Carmita
  rationale: Ang gentilic ay kolektibong tumutukoy sa mga inapo o pangkat ni Carmi; ang “mga Carmita” ay natural at kapantay ng “mga Hezronita.”
