base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: tl
  text: 'Ito ang mga angkan ng mga anak ni Efraim ayon sa bilang ng mga naitala: tatlumpu''t dalawang libo at limang daan[a]. Ito ang mga anak ni Jose ayon sa kani-kanilang angkan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa kanilang pagkakatala,” “ayon sa kanilang bilang,” o, sa mas malayang pananalita, “ayon sa mga naitala.” Wika ito ng Hebreo para sa pagtatala sa sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa konteksto ng sensus at pagkakahati ng tribo, tumutukoy ito sa mga pangkat na magkakamag-anak sa loob ng isang tribo; mas tiyak ang “angkan” kaysa “pamilya.”
- source_word: בְּנֵי אֶפְרַיִם
  choice: mga anak ni Efraim
  rationale: Pinananatili nito ang Hebreong pormulang pangangkanan at malinaw pa rin sa makabagong Tagalog na saklaw nito ang mga nagmula kay Efraim.
- source_word: לִפְקֻדֵיהֶם
  choice: ayon sa bilang ng mga naitala sa kanila
  rationale: Ipinahahayag nito kapwa ang opisyal na pagtatala sa sensus at ang kinalabasang bilang, nang hindi ginagawang simpleng pagbilang lamang ang parirala.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: tatlumpu't dalawang libo at limang daan
  rationale: Likas na ayos ng bilang sa kasalukuyang Tagalog habang eksaktong pinananatili ang kabuuang 32,500.
- source_word: בְנֵי יוֹסֵף
  choice: mga anak ni Jose
  rationale: Pinananatili ang inuulit na pormulang pangangkanan at ang ugnayan nina Efraim at Jose.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang “kani-kanilang” ay natural na Tagalog para sa pamamahagi ayon sa mga angkan at tumutugma sa naunang paggamit ng “angkan.”
