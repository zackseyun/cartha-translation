  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: tl
  text: Sa pamamagitan ng palabunutan lamang hahatiin ang lupain; magmamana sila ayon sa mga pangalan ng mga lipi ng kanilang mga ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang mga ninuno.” Sa Hebreo, literal na “kanilang mga ama,” na tumutukoy sa mga linya ng angkan sa panig ng ama sa loob ng mga lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: lamang
  rationale: 'Ginamit dito ang אַךְ bilang pan限定 na salita: palabunutan lamang, at walang ibang paraan, ang gagamitin sa paghahati.'
- source_word: בְּגוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Ang גוֹרָל ay tumutukoy sa lot na ginagamit sa pagpapasiya o paghahati; likas at malinaw sa modernong Filipino ang “palabunutan.”
- source_word: יֵחָלֵק
  choice: hahatiin
  rationale: Ang anyong Nifal ay pasibo sa diwa. Sa Filipino, malinaw na naipahahayag ang pasibong diwa sa konstruksiyong “hahatiin ang lupain.”
- source_word: אֶת הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa lupaing ipamamana. Ang “lupain” ay mas angkop kaysa pangkalahatang “lupa” sa konteksto ng teritoryo.
- source_word: לִשְׁמוֹת
  choice: ayon sa mga pangalan ng
  rationale: Ipinahahayag ng ל dito ang batayan o pamantayan ng pagtanggap ng mana; pinananatili rin ang maramihang “mga pangalan.”
- source_word: מַטּוֹת
  choice: mga lipi
  rationale: Bagaman maaari itong literal na mangahulugang mga tungkod, ang kahulugan sa kontekstong ito ay mga lipi ng Israel.
- source_word: אֲבֹתָם
  choice: kanilang mga ama
  rationale: Tahasang panlalaki ang salitang Hebreo at tumutukoy sa mga linyang ninuno sa panig ng ama. Pinanatili ito sa pangunahing teksto, habang nililinaw sa talababa ang kontekstuwal na diwa.
- source_word: יִנְחָלוּ
  choice: magmamana sila
  rationale: Ang pandiwa ay nangangahulugang tumanggap o magmay-ari bilang mana; maikli at natural ang “magmamana sila.”
theological_decisions:
- issue: Panlalaking katawagan sa mga ninuno sa אֲבֹתָם
  choice: kanilang mga ama
  alternative: kanilang mga ninuno
  rationale: Pinananatili ng pangunahing teksto ang partikular na panlalaking katawagan ng Hebreo at ang diin sa angkang nagmumula sa ama, nang hindi ito ginagawang neutral sa kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palabunutan” bilang karaniwang salitang madaling maunawaan, at pinanatili ang “mga ama” upang katawanin ang tiyak na pananalita at kaayusang pang-angkan ng tekstong Hebreo.
