    rationale: Ang paglipat sa "Sa pamamagitan ng palabunutan lamang" ay mas natural at mas malinaw na inilalapat ang restrictive force ng אַךְ sa paraan ng paghahati.
  - severity: low
    issue: Hindi likas na pahayag sa talababa
    rationale: Ang "Literal sa Hebreo ang" ay hindi karaniwang ayos sa Filipino. Mas malinaw ang "Sa Hebreo, literal na..." nang hindi binabago ang impormasyong pangwika.
  revised_text: Sa pamamagitan ng palabunutan lamang hahatiin ang lupain; magmamana sila ayon sa mga pangalan ng mga lipi ng kanilang mga ama.[a]
