  yaml_path: translation/ot/numbers/026/028.yaml
  text: 'The sons of Joseph by their clans: Manasseh and Ephraim[a].'
translation:
  language: tl
  text: 'Ang mga anak ni Jose ayon sa kani-kanilang angkan: sina Manases at Efraim.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay tuwirang tumutukoy sa mga anak na lalaki ni Jose; sa kontekstong ito, sina Manases at Efraim mismo ang pinapangalanan. Natural sa Filipino ang “mga anak ni” at hindi kailangang idagdag ang “lalaki.”
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה sa konteksto ng sensus at organisasyong pantribo ay “angkan,” hindi lamang nukleyar na pamilya. Ipinahihiwatig ng לְ ang pag-uuri ayon sa mga angkan; malinaw na naihahatid ito ng “ayon sa kani-kanilang angkan.”
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: וְאֶפְרָיִם
  choice: at Efraim
  rationale: Tuwirang isinalin ang pang-ugnay at ginamit ang nakaugaliang anyong Filipino ng pangalan.
