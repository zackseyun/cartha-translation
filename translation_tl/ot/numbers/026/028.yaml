translation_notes:
  register: Modernong Filipino na natural, marangal, at angkop sa talaan ng sensus. Pinanatili ang pormal na katawagang “angkan” at ginamit ang “sina” bago ang dalawang personal na pangalan para sa likas na daloy sa Tagalog.
