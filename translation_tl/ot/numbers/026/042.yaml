base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: tl
  text: 'Ito ang mga anak na lalaki ni Dan[a] ayon sa kanilang mga angkan: mula kay Shuham, ang angkan ng mga Shuhamita. Ito ang mga angkan ni Dan ayon sa kanilang mga angkan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na lalaki ni Dan”; sa pormulang ito ng talaangkanang sensus, ang “mga anak na lalaki” ay maaari ring tumukoy sa mga inapo ng lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panimula sa Filipino para sa pormulang naglilista sa ulat ng sensus; hindi kailangang lagyan ng tahasang pandiwang pangnagdaan ang nominal na sugnay sa Hebreo.
- source_word: בְנֵי דָן
  choice: mga anak na lalaki ni Dan
  rationale: Pinananatili ang literal at may-kasariang anyo ng בְּנֵי, habang ipinapaliwanag sa talababa na maaari itong tumukoy sa mga inapo sa ganitong talaangkanang konteksto.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa sensus ng Mga Bilang, ang מִשְׁפָּחָה ay tumutukoy sa mga pangkat na angkan sa loob ng lipi; pinananatili rin ang pag-uulit ng Hebreo.
- source_word: לְשׁוּחָם
  choice: mula kay Shuham
  rationale: Ang לְ sa pormulang talaangkanan ay nagpapakilala sa pinagmulan o ninuno ng angkan; malinaw itong naipahahayag ng “mula kay.”
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: ang angkan ng mga Shuhamita
  rationale: Ang anyong pangkat na הַשּׁוּחָמִי ay tumutukoy sa angkang nagmula kay Shuham, kaya ginamit ang natural na pangmaramihang katawagang “mga Shuhamita.”
- source_word: מִשְׁפְּחֹת דָּן
  choice: mga angkan ni Dan
  rationale: Tuwirang salin ng buod na parirala at pare-pareho sa gamit ng “angkan” para sa מִשְׁפָּחָה.
