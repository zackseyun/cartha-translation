base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: tl
  text: Sa mas malaking pangkat ay palalakihin mo ang mana nito, at sa mas maliit na pangkat ay liliitan mo ang mana nito; ang mana ng bawat isa ay ibibigay ayon sa bilang ng mga nabilang sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ayon sa dami ng mga nabilang sa kanya” o “ayon sa bilang ng kanyang mga nabilang.” Maikli ang pariralang Hebreo at tuwirang iniuugnay ang laki ng mana sa bilang ng mga nabilang sa bawat pangkat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: sa mas malaking pangkat
  rationale: Ang רַב ay ginamit bilang pangngalan at, sa konteksto ng sensus, tumutukoy sa pangkat na mas marami ang bilang.
- source_word: תַּרְבֶּה
  choice: palalakihin mo
  rationale: Ang Hiphil ng רבה ay nangangahulugang gawing mas marami o mas malaki; dito ay tumutukoy sa laki ng bahaging lupang mamanahin.
- source_word: נַחֲלָתוֹ
  choice: ang mana nito / ang mana niya
  rationale: Ang נַחֲלָה ay minanang pag-aari o bahaging lupang itinakda. Pinananatili ng 'mana' ang legal at pampamilyang diwa ng salita.
- source_word: וְלַמְעַט
  choice: at sa mas maliit na pangkat
  rationale: Ang מְעַט ay substantibong tumutukoy sa pangkat na mas kaunti ang bilang, katapat ng mas malaking pangkat.
- source_word: תַּמְעִיט
  choice: liliitan mo
  rationale: Ang Hiphil ng מעט ay 'gawing mas kaunti o mas maliit'; natural itong tumutukoy rito sa mas maliit na bahaging lupain.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Ginagamit ang panlalaking isahan nang distributibo. Sa Filipino, malinaw at natural na naihahayag ng 'bawat isa' ang tungkuling ito nang hindi ipinapalagay na indibiduwal na lalaki lamang ang tinutukoy.
- source_word: לְפִי
  choice: ayon sa bilang
  rationale: Ang idyomang לְפִי ay nangangahulugang 'ayon sa' o 'katumbas ng proporsiyon ng'; dahil sensus ang konteksto, likas sa Filipino ang 'ayon sa bilang.'
- source_word: פְקֻדָיו
  choice: mga nabilang sa kanya
  rationale: Tumutukoy ito sa mga naitala o nabilang sa sensus na kaugnay ng bawat pangkat. Pinananatili ng salin ang maikli at bahagyang siksik na ugnayan ng hulaping isahan.
- source_word: יֻתַּן
  choice: ibibigay
  rationale: Ito ang pasibong anyo ng נתן, 'ibigay.' Ang 'ibibigay' ay tapat sa anyo at natural sa konteksto ng paghahati ng lupain.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'pangkat' upang linawin na ang mas malaki at mas maliit ay mga pangkat ayon sa sensus, hindi laki ng indibiduwal. Ang 'mana' ay pinanatili upang maipahayag ang lupang itinakda bilang minanang pag-aari.
