revisions:
- from: Sa mas malaking pangkat ay palalakihin mo ang mana nito, at sa mas maliit na pangkat ay liliitan mo ang mana nito; ibibigay sa bawat isa ang mana niya ayon sa bilang ng mga nabilang sa kanya.[a]
  to: Sa mas malaking pangkat ay palalakihin mo ang mana nito, at sa mas maliit na pangkat ay liliitan mo ang mana nito; ang mana ng bawat isa ay ibibigay ayon sa bilang ng mga nabilang sa kanya.[a]
  rationale: Inayos ang ayos ng huling sugnay para sa mas likas na Filipino at nilinaw ang talababa upang hindi ipahiwatig na ang bawat isa mismo ang nagsagawa ng pagbibilang. Hindi binago ang saklaw o ang sinadyang distributibong kasiksikan ng Hebreo.
