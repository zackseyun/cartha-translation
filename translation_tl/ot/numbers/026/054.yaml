review_pass:
  verdict: revise
  source_fidelity: 'Tapat ang pangunahing salin sa proporsiyonal na pamamahagi: mas malaking pangkat, mas malaking mana; mas maliit na pangkat, mas maliit na mana. Gayunman, ang unang alternatibo sa talababa, “dami ng mga nabilang niya,” ay maaaring basahing bilang mga taong personal niyang nabilang, sa halip na mga taong nabilang para sa kanya/kanyang pangkat. Iniaayos ito upang mapanatili ang siksik ngunit wastong ugnayan ng פְקֻדָיו.'
  naturalness: Natural at marangal ang “palalakihin/liliitan ... ang mana nito.” Mas malinaw sa karaniwang modernong Filipino ang “Ang mana ng bawat isa ay ibibigay” kaysa “ibibigay sa bawat isa ang mana niya,” habang pinananatili ang distributibong pagbasa.
  terminology: Ang “pangkat,” “mana,” at “nabilang” ay angkop sa konteksto ng sensus at pamamahagi ng lupa. Hindi dapat gawing mas tiyak na “tribo” ang אִישׁ sa talata mismo, sapagkat distributibo ang anyo ng Hebreo at ang mas malawak na konteksto ang nagpapalinaw sa pangkatang saklaw.
  issues:
