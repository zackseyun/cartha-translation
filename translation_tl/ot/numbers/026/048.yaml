  text: בְּנֵ֤י נַפְתָּלִי֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/יַ֨חְצְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְצְאֵלִ֑י לְ/גוּנִ֕י מִשְׁפַּ֖חַת הַ/גּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: tl
  text: 'Ang mga anak ni Neftali ayon sa kani-kanilang angkan: mula kay Jahzeel, ang angkan ng mga Jahzeelita; mula kay Guni, ang angkan ng mga Gunita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Pinananatili ang tuwirang anyong genealogical na “mga anak ni,” na natural din sa Filipino sa talaan ng lahi.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinapahayag ang pag-uuri ng mga inapo sa bawat angkan; nililinaw ng “kani-kanilang” ang distributibong diwa ng Hebreo.
- source_word: לְיַחְצְאֵל
  choice: mula kay Jahzeel
  rationale: Sa pormulang ito ng sensus, ipinakikilala ng לְ ang ninunong pinagmulan ng angkan; natural sa Filipino ang “mula kay.”
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: ang angkan ng mga Jahzeelita
  rationale: Ang מִשְׁפָּחָה ay “angkan” sa kontekstong pantribo, at ang anyong gentiliko ay kolektibong tumutukoy sa mga nagmula kay Jahzeel.
- source_word: לְגוּנִי
  choice: mula kay Guni
  rationale: Kaparehong genealogical na gamit ng לְ; ipinapakita nitong si Guni ang pinagmulan ng kasunod na angkan.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: ang angkan ng mga Gunita
  rationale: Isinalin ang gentiliko bilang kolektibong pangalan ng mga kabilang sa angkang nagmula kay Guni.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” sa halip na “pamilya” upang maipakita ang mas malawak na yunit ng lahi sa konteksto ng sensus. Walang kinakailangang talababa.
