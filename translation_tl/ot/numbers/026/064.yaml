  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: tl
  text: Ngunit sa mga ito ay wala ni isang lalaking kabilang sa mga binilang nina Moises at Aaron na pari, na kapuwa bumilang sa mga anak ni Israel sa ilang ng Sinai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At sa mga ito”; ang pangatnig sa Hebreo ay maaaring simpleng mangahulugang “at,” ngunit malamang na nagpapahiwatig ito rito ng pagsalungat sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: Ngunit sa mga ito
  rationale: Ang וּ ay may diwang panalungat batay sa kaugnayan sa naunang talata, samantalang pinananatili ng “sa mga ito” ang lokatibong diwa ng בְּ.
- source_word: לֹא הָיָה אִישׁ
  choice: wala ni isang lalaki
  rationale: Natural itong pahayag sa modernong Tagalog at malinaw na ipinahahayag na walang kahit isang indibidwal na lalaki mula sa naunang talaan.
- source_word: מִפְּקוּדֵי
  choice: kabilang sa mga binilang
  rationale: Ipinakikita nito na ang tinutukoy ay mga taong isinama sa naunang sensus, hindi lamang isang abstraktong talaan.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Ang Hebreo ay nagsasabing “ang pari,” hindi “ang punong pari”; sa Tagalog, natural na ikinakabit ang titulo kay Aaron bilang “Aaron na pari.”
- source_word: אֲשֶׁר פָּקְדוּ
  choice: na siyang bumilang
  rationale: Ang pangmaramihang pandiwang Hebreo ay tumutukoy kina Moises at Aaron; ang “siyang” ay kolektibong tumutukoy sa dalawa at iniiwasan ang maling pagbasa na si Aaron lamang ang bumilang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pampamilyang katawagan sa Hebreo sa halip na gawing simpleng “mga Israelita.”
- source_word: בְּמִדְבַּר סִינָי
  choice: sa ilang ng Sinai
  rationale: Ang “ilang” ay natural, marangal, at tumpak na katumbas ng מִדְבָּר sa kontekstong ito.
theological_decisions:
- issue: Kasariang ipinahihiwatig ng אִישׁ at ng naunang sensus
  choice: lalaki
  alternative: tao; isa man
  rationale: Ang talata ay tumutukoy sa mga lalaking kabilang sa naunang sensus, kaya hindi dapat gawing neutral ang tahasang panlalaking reperensiya.
- issue: Pampamilyang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ng salin ang tunay na anyo at pampamilyang diwa ng katawagang Hebreo nang hindi dinaragdagan ng sektaryang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ni isang lalaki” para sa natural na diin, “mga anak ni Israel” upang mapanatili ang Hebreong katawagang pampamilya, at “ilang” bilang karaniwang biblikal ngunit nauunawaang katumbas ng wilderness.
