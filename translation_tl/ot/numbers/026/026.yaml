  text: בְּנֵ֣י זְבוּלֻן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/סֶ֗רֶד מִשְׁפַּ֨חַת֙ הַ/סַּרְדִּ֔י לְ/אֵל֕וֹן מִשְׁפַּ֖חַת הָ/אֵלֹנִ֑י לְ/יַ֨חְלְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְלְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: tl
  text: Ang mga anak[a] ni Zebulun ayon sa kani-kanilang angkan:[b] mula kay Sered, ang angkan ng mga Seredita; mula kay Elon, ang angkan ng mga Elonita; at mula kay Jahleel, ang angkan ng mga Jahleelita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto ng sensus na ito, ang “mga anak” ay tumutukoy sa mga inapo ni Zebulun na kabilang sa kanyang lipi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa kanilang mga angkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak
  rationale: Pinananatili ang literal na idyomang Hebreo na “mga anak,” habang nililinaw sa talababa na sa konteksto ng sensus ay saklaw nito ang mga inapong kabilang sa lipi.
- source_word: זְבוּלֻן
  choice: Zebulun
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa anyong madaling makilala at bigkasin sa modernong Filipino.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinahahayag ang distributibong diwa ng לְ at ang pagkakahati ng lipi sa mga pangkat na angkan; mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: לְסֶרֶד
  choice: kay Sered
  rationale: Sa pormula ng talaan, ipinakikilala ng לְ ang ninunong pinagmulan ng kasunod na angkan; natural itong ipinapahayag sa Filipino sa pamamagitan ng “kay.”
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: ang angkan ng mga Seredita
  rationale: Ang anyong gentiliko ay tumutukoy sa pangkat na nagmula kay Sered. Ang “mga Seredita” ay malinaw at likas na katawagang Filipino para sa mga kabilang sa angkang iyon.
- source_word: לְאֵלֹן / מִשְׁפַּחַת הָאֵלֹנִי
  choice: kay Elon, ang angkan ng mga Elonita
  rationale: Pinananatili ang paulit-ulit na pormula ng Hebreo at ginagawang natural ang gentiliko bilang pangmaramihang katawagan sa mga kabilang sa angkan.
- source_word: לְיַחְלְאֵל / מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: kay Jahleel, ang angkan ng mga Jahleelita
  rationale: Tuwirang transliterasyon ng pangalan at malinaw na paglalapat ng anyong gentiliko sa mga kabilang sa kanyang angkan.
theological_decisions:
- issue: Kung ang בְּנֵי ay tumutukoy lamang sa mga tuwirang anak o sa mas malawak na mga inapo
  choice: “mga anak” sa pangunahing teksto, na may paliwanag sa talababa
  alternative: “mga inapo”
  rationale: Pinananatili nito ang idyomang Hebreo nang hindi itinatago na sa konteksto ng sensus ay tumutukoy ito sa mga kaanib ng lipi na nagmula kay Zebulun, hindi lamang sa kanyang mga agarang anak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” bilang terminong angkop sa mga pangkat sa loob ng lipi, at pinanatili ang maindayog na pormula ng talaang Hebreo. Ang idinagdag na “at” bago ang huling pangkat ay likas sa Filipino at hindi nagbabago sa nilalaman.
