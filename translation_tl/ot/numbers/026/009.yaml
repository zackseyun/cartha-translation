  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: tl
  text: At ang mga anak ni Eliab ay sina Nemuel, Datan, at Abiram. Sila ang Datan at Abiram na mga tinawag ng kapulungan[a], na nakipagtunggali kina Moises at Aaron sa pangkat ni Korah nang makipagtunggali sila kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga piling lalaki ng kapulungan.”
    reason: Pinahihintulutan ng קרואי הָעֵדָה ang higit na idiomatikong pagkaunawa na sila ay kinilala o piniling mga kinatawan ng kapulungan.
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  choice: At ang mga anak ni Eliab ay sina
  rationale: Sa talaangkanan, ang בְּנֵי ay tumutukoy sa mga anak na lalaking kasunod na pinangalanan; natural sa Filipino ang hulma na “ang mga anak ... ay sina.”
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: Sila ang Datan at Abiram
  rationale: Bagaman isahan ang anyong הוּא, ginagamit ito rito bilang panandang pagkakakilanlan para sa dalawang taong binanggit. Ang “Sila ang” ang natural at malinaw na katumbas sa Filipino.
- source_word: קרואי הָעֵדָה
  choice: mga tinawag ng kapulungan
  rationale: Pinananatili nito ang batayang diwa ng pasibong participle ng קרא, habang ang posibleng kahulugang mga kinilala o piniling kinatawan ay inilalagay sa talababa.
- source_word: הָעֵדָה
  choice: kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan ng Israel. Ang “kapulungan” ay kasalukuyan, marangal, at hindi nagpapahiwatig ng isang denominasyonal na institusyon.
- source_word: הִצּוּ / בְּהַצֹּתָם
  choice: nakipagtunggali / nang makipagtunggali
  rationale: Parehong mula sa ugat na נצה ang dalawang anyo. Inulit ang “makipagtunggali” upang mapanatili ang leksikal na ugnayan at ang diwang hayagang pagsalungat.
- source_word: בַּעֲדַת קֹרַח
  choice: sa pangkat ni Kora
  rationale: Tinutukoy ng parirala ang grupong kaugnay ni Kora sa paghihimagsik. Ang “pangkat” ay natural at hindi ito ipinagkakamali sa buong kapulungan ng Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa teksto nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng קרואי העדה
  choice: mga tinawag ng kapulungan
  alternative: mga piling lalaki ng kapulungan
  rationale: Maaaring idiomatikong tumukoy ang parirala sa kinilala o piniling mga kinatawan, ngunit pinananatili sa pangunahing teksto ang higit na literal na diwa at inilalahad sa talababa ang lehitimong alternatibo.
- issue: Ugnayan ng pagsalungat kina Moises at Aaron at kay Yahweh
  choice: nang makipagtunggali sila kay Yahweh
  alternative: sa kanilang pakikipagtunggali kay Yahweh
  rationale: 'Pinananatili ang teolohikal na tensiyon ng teksto: ang pakikipagtunggali sa mga pinunong itinalaga ng Diyos ay inilalarawan din bilang pakikipagtunggali kay Yahweh, nang walang dagdag na paliwanag.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sina/kina” para sa natural na pagbanggit ng mga pangalan, “kapulungan” para sa pamayanan ng Israel, at “pangkat” para sa grupong kaugnay ni Kora. Iningatan ang pag-uulit ng pandiwang “makipagtunggali” mula sa iisang ugat sa Hebreo.
