base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/007.yaml
  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: tl
  text: Ito ang mga angkan ng mga Rubenita. Ang mga nabilang sa kanila[a] ay apatnapu't tatlong libo, pitong daan at tatlumpu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga itinala mula sa kanila” o “mga tinipon at binilang mula sa kanila.” Ang salitang Hebreo ay tumutukoy sa mga isinama sa sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa konteksto ng sensus at mga lipi sa Mga Bilang, tumutukoy ito sa malalaking pangkat ng magkakamag-anak sa loob ng isang lipi, hindi lamang sa sambahayan o nuklear na pamilya.
- source_word: הָרֻאוּבֵנִי
  choice: mga Rubenita
  rationale: Ang anyong gentiliko ay tumutukoy sa mga kabilang sa lipi o mga inapo ni Ruben; natural at karaniwang tawag sa Filipino ang “mga Rubenita.”
- source_word: פְקֻדֵיהֶם
  choice: mga nabilang sa kanila
  rationale: Sa konteksto ng sensus, tumutukoy ito sa mga binilang o itinala. Pinananatili ng salin ang diwang pasibo nang hindi inuulit ang “mga lalaki,” na hindi tahasang nasa talatang ito.
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Ang payak na pang-ugnay ay likas sa Filipino para sa pahayag ng kabuuang bilang.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: apatnapu't tatlong libo, pitong daan at tatlumpu
  rationale: Isinulat nang buo ang bilang upang mapanatili ang estilong pampanitikan ng talaan ng sensus at manatiling madaling basahin.
