base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: tl
  text: 'At ang mga anak ni Bela ay sina Ard at Naaman: mula kay Ard, ang angkan ng mga Ardita; mula kay Naaman, ang angkan ng mga Naamita.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay gumagamit ng katawagang-angkan na hinango sa pangalang Naaman; maaari ring isaling “mga Naamanita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי בֶלַע
  choice: At ang mga anak ni Bela ay
  rationale: Pinananatili ng “At” ang daloy ng talaan, at tuwirang isinasalin ng “mga anak” ang genealogical na בְנֵי nang hindi pinalalawak sa “mga inapo.”
- source_word: אַרְדְּ וְנַעֲמָן
  choice: sina Ard at Naaman
  rationale: Ginagamit ang natural na pantukoy na Filipino para sa dalawang personal na pangalan at pinananatili ang mga pangalan sa transliteradong anyo.
- source_word: מִשְׁפַּחַת
  choice: angkan
  rationale: Sa konteksto ng sensus at pagkakahati ng tribo, tumutukoy ito sa mas malawak na pangkat na magkakamag-anak, kaya mas tiyak ang “angkan” kaysa “pamilya.”
- source_word: הָאַרְדִּי
  choice: mga Ardita
  rationale: Isinasalin ang katawagang-angkan na hinango sa Ard sa isang natural na gentilicio sa Filipino.
- source_word: לְנַעֲמָן
  choice: mula kay Naaman
  rationale: Ipinahahayag ng לְ sa pormulang genealogical ang pinagmulan o kaugnayan ng angkan; malinaw itong naipapakita ng “mula kay.”
- source_word: הַנַּעֲמִי
  choice: mga Naamita
  rationale: Pinananatili ang pinaikling gentilicial na anyong hinango sa Naaman, habang inilalagay sa talababa ang mas malinaw na alternatibong “mga Naamanita.”
