    rationale: Ang וַיֹּאמֶר ay nag-uugnay sa salaysay, ngunit hindi mismo nagsasabing “pagkatapos.” Ang “At sinabi” ay mas malapit sa saklaw ng pinagmulan at pinananatili ang daloy ng naratibo.
  - severity: medium
    issue: Maaaring maging malabo ang “Eleazar na anak ni Aaron na pari.”
    rationale: Bagaman malamang na mauunawaan itong si Aaron ang pari, puwede ring pansamantalang ikabit ng mambabasa ang “na pari” kay Eleazar. Ang Hebreong parirala ay tumutukoy kay Aaron bilang pari; nililinaw ito ng “anak ng paring si Aaron.”
