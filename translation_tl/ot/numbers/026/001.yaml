  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: tl
  text: 'At sinabi ni Yahweh kina Moises at Eleazar na anak ng paring si Aaron:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay; likas sa modernong Tagalog ang “Pagkatapos, sinabi” bilang pambungad sa kasunod na utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אֶלְעָזָר
  choice: kina Moises at Eleazar
  rationale: Ang “kina” ang likas na panandang Tagalog para sa dalawang tiyak na taong pinagsabihan.
- source_word: בֶּן אַהֲרֹן
  choice: na anak ni Aaron
  rationale: Malinaw at natural na ipinapahayag ang ugnayang pampamilya ng Hebrew construct chain.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Batay sa ayos ng Hebreo, ang tiyak na titulong “pari” ay pinakamalamang na tumutukoy kay Aaron; ang “Aaron na pari” ay natural at hindi inililipat ang titulo kay Eleazar.
- source_word: לֵאמֹר
  choice: ipinakikita ng kuwit at ng tuwirang pahayag na kasunod
  rationale: Sa Tagalog, hindi kailangang ulitin bilang “na sinasabi” ang pormulang וַיֹּאמֶר ... לֵאמֹר; ang pambungad na “sinabi” at kuwit ay likas na naghahanda sa mismong sinabi sa susunod na talata.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng personal na pangalan; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Kung kanino nakaugnay ang titulong הַכֹּהֵן
  choice: Aaron na pari
  alternative: Eleazar na pari
  rationale: Ang artikulong nasa הַכֹּהֵן at ang pagkakalagay nito pagkatapos ng “Aaron” ay sumusuporta sa apposisyong tumutukoy kay Aaron, bagaman kilala rin sa konteksto si Eleazar bilang pari.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “kina” upang maging natural ang dalawang pinagsabihan, at iniwasan ang mabigat at paulit-ulit na “nagsalita ... na sinasabi.”
