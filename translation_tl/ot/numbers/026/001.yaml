  source_fidelity: Kailangang palitan ang “Pagkatapos,” dahil ang waw-consecutive sa talatang ito ay karaniwang pagpapatuloy ng salaysay (“At”) at hindi tahasang nagsasaad ng mas tiyak na pagkakasunod na “pagkatapos.” Tumpak ang “Yahweh,” ang dalawang pinag-uukulan ng pahayag, at ang pagmamarka ng nakabiting pambungad sa pamamagitan ng tutuldok.
  naturalness: Likas at marangal ang “At sinabi ni Yahweh kina Moises at Eleazar …” sa modernong Filipino Tagalog. Ang “na anak ng paring si Aaron” ay malinaw na ikinakabit ang “pari” kay Aaron, hindi kay Eleazar, nang hindi nagiging mabigat ang pangungusap.
  terminology: Pinanatili ang “Yahweh” para sa יְהוָה at “pari” para sa כֹּהֵן. Ginamit ang karaniwang mga pangalang “Moises,” “Eleazar,” at “Aaron.”
