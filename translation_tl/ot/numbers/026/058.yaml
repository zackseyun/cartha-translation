  text: אֵ֣לֶּה מִשְׁפְּחֹ֣ת לֵוִ֗י מִשְׁפַּ֨חַת הַ/לִּבְנִ֜י מִשְׁפַּ֤חַת הַֽ/חֶבְרֹנִי֙ מִשְׁפַּ֤חַת הַ/מַּחְלִי֙ מִשְׁפַּ֣חַת הַ/מּוּשִׁ֔י מִשְׁפַּ֖חַת הַ/קָּרְחִ֑י וּ/קְהָ֖ת הוֹלִ֥ד אֶת עַמְרָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: tl
  text: 'Ito ang mga angkan[a] ni Levi: ang angkan ng mga Libnita, ang angkan ng mga Hebronita, ang angkan ng mga Mahlita, ang angkan ng mga Musita, at ang angkan ng mga Korahita. At si Kohat ang naging ama ni Amram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pamilya” o “mga pangkat ng pamilya.” Ang salitang Hebreo ay tumutukoy sa isang pangkat ng magkakamag-anak sa loob ng lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: mga angkan / ang angkan ng
  rationale: Sa konteksto ng senso at talaangkanan, tumutukoy ito sa isang pangkat ng magkakamag-anak sa loob ng lipi. Mas tiyak ang “angkan” kaysa sa karaniwang makabagong kahulugan ng “pamilya,” at natural ito sa Filipino.
- source_word: לֵוִי
  choice: Levi
  rationale: Pangalan ito ng ninuno ng lipi kaya isinalin sa karaniwang transliterasyong Filipino.
- source_word: הַלִּבְנִי / הַחֶבְרֹנִי / הַמַּחְלִי / הַמּוּשִׁי / הַקָּרְחִי
  choice: mga Libnita / mga Hebronita / mga Mahlita / mga Musita / mga Korahita
  rationale: Ang mga anyong ito ay katawagan sa mga pangkat ng inapo. Ang hulaping “-ita” ay malinaw at likas na paraan sa Filipino upang tukuyin ang mga kaanib o inapo ng pinangalanang ninuno.
- source_word: וּקְהָת
  choice: At si Kohat
  rationale: Pinanatili ang pang-ugnay na וּ bilang “At” at ginamit ang karaniwang transliterasyong Filipino ng pangalan.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Ang Hiphil ng ילד sa pormulang talaangkanan ay nangangahulugang ‘nagkaanak’ o ‘naging ama ni.’ Pinananatili ng pariralang ito ang ugnayang paternal at mas natural sa makabagong Filipino kaysa sa literal ngunit mabigat na “ipinanganak niya.”
- source_word: אֶת עַמְרָם
  choice: Amram
  rationale: Hindi isinasalin ang pananda ng tuwirang layon na אֶת; pinanatili ang pangalan sa karaniwang transliterasyon.
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Bagaman walang tahasang pandiwa sa Hebreo, ang “Ito ang” ay natural na pambungad sa isang talaan sa Filipino at hindi kailangang magdagdag ng panahunan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” para sa yunit ng pagkakamag-anak at ang hulaping “-ita” para sa mga pangkat ng inapo. Iniwasan ang arkaikong “nagkaanak kay” kapag maaari itong maging malabo, at pinili ang natural na pormulang “naging ama ni.”
