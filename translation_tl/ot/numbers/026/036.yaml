  text: 'And these were the sons of Shuthelah: of Eran[a], the clan of the Eranites.'
translation:
  language: tl
  text: 'At ito ang mga anak ni Sutela: mula kay Eran[a], ang angkan ng mga Eranita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “At ito ang mga anak ni Sutela: kay Eran, ang angkan ng Eranita.” Dito, ang “mga anak ni” ay wikang panggenealohiya para sa mga inapo o mga linya ng angkan, at hindi lamang para sa mga tuwirang anak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: At ito ang
  rationale: Ipinagpapatuloy ng pangatnig at panturo ang talaan. Natural sa Filipino ang “At ito ang” sa ganitong pormulang panggenealohiya.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Pinananatili nito ang pormal na idyomang panggenealohiya ng Hebreo, bagaman maaari itong tumukoy sa mga inapo o mga linyang nagmula sa isang ninuno.
- source_word: שׁוּתָלַח
  choice: Sutela
  rationale: Isinalin sa baybay na madaling bigkasin sa modernong Filipino habang malapit sa pangalang Hebreo.
- source_word: לְ/עֵרָן
  choice: mula kay Eran
  rationale: Sa pormula ng sensus, itinatakda ng לְ ang sangay na nagmula kay Eran. Mas malinaw at natural sa Filipino ang “mula kay” kaysa literal na “kay.”
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa talaan ng Bilang, tumutukoy ito sa isang pangkat na magkakamag-anak sa loob ng lipi; tumpak at karaniwan ang “angkan.”
- source_word: הָ/עֵרָנִי
  choice: mga Eranita
  rationale: Ang anyong patronimiko ay tumutukoy sa pangkat ng mga nagmula kay Eran. Ang hulaping “-ita” ay natural na paraan sa Filipino ng pagbuo ng pangalan ng gayong pangkat.
