  source_fidelity: 'Tapat ang salin sa pormulang Hebreo: ipinagpapatuloy ng “At ito ang,” pinananatili ang idyomang panggenealohiya sa “mga anak ni Sutela,” at wastong iniuugnay ang angkan sa Eran. Ang “mula kay Eran” ay isang natural at katamtamang paglilinaw ng לְ sa pormula ng talaan ng angkan.'
  naturalness: Natural at malinaw ang modernong Filipino, habang napapanatili ang maigsi at pormal na rehistro ng talaang pangsensus. Bagaman putol-putol na pormula ang ikalawang bahagi, sinasalamin nito ang estilong talaan ng pinagmulan at nauunawaan sa Filipino.
  terminology: Ang “angkan” ay angkop para sa מִשְׁפָּחָה sa kontekstong panglipi/pangsensus. Ang “mga Eranita” ay malinaw na katawagan para sa grupong nagmula kay Eran. Ang mga pangalang “Sutela” at “Eran” ay katanggap-tanggap na mga anyong Filipino. Wastong ipinapaliwanag ng talababa na ang “mga anak ni” ay hindi kinakailangang tumukoy lamang sa tuwirang mga anak.
