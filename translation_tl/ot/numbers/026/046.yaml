- source_word: בַּת אָשֵׁר
  choice: anak na babae ni Aser
  rationale: Ang בַּת ay karaniwang “anak na babae,” at ang construct relationship sa אָשֵׁר ay likas na ipinahahayag sa Tagalog sa pamamagitan ng “ni Aser.”
- source_word: שָׂרַח
  choice: Sera
  rationale: Pangngalang pantangi ito kaya tinutumbasan sa pamamagitan ng transliterasyon; ang “Sera” ay natural na anyong Tagalog para sa pangalang Hebreo.
