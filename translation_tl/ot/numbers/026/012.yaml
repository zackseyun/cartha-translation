id: NUM.26.12
reference: Numbers 26:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּנֵ֣י שִׁמְעוֹן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/נְמוּאֵ֗ל מִשְׁפַּ֨חַת֙ הַ/נְּמ֣וּאֵלִ֔י לְ/יָמִ֕ין מִשְׁפַּ֖חַת הַ/יָּמִינִ֑י לְ/יָכִ֕ין מִשְׁפַּ֖חַת הַ/יָּכִינִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: tl
  text: 'Ang mga anak ni Simeon[a], ayon sa kanilang mga angkan[b]: mula kay Nemuel, ang angkan ng mga Nemuelita; mula kay Jamin, ang angkan ng mga Jaminita; mula kay Yakin[c], ang angkan ng mga Yakinita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Simeon” ay maaari ring unawain bilang “mga inapo ni Simeon,” ngunit ang Hebreo ay gumagamit ng karaniwang pormulang pangangkan na literal na “mga anak ni.”
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa kanilang mga sambahayan.” Sa konteksto ng sensus, ang salitang Hebreo ay tumutukoy sa mga pangkat ng magkakamag-anak sa loob ng lipi.
    reason: lexical_alternative
  - marker: c
    text: Ang Yakin ay isinusulat ding Jakin o Jachin sa ibang mga salin.
    reason: transliteration_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Pinanatili ang literal na pormulang pangangkan na “mga anak ni,” yamang ang talaan ay nakatuon sa lahing nagmula kay Simeon; nililinaw sa talababa na maaari rin itong tumukoy sa mas malalayong inapo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa konteksto ng sensus, ang מִשְׁפָּחָה ay pangkat ng magkakamag-anak sa loob ng isang lipi. Mas tiyak dito ang “angkan” kaysa sa karaniwang “pamilya.”
- source_word: לִנְמוּאֵל / לְיָמִין / לְיָכִין
  choice: mula kay Nemuel / mula kay Jamin / mula kay Yakin
  rationale: Sa pormulang ito, ipinakikilala ng לְ ang ninunong pinagmulan ng bawat angkan. Likas at malinaw sa Filipino ang “mula kay.”
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי / מִשְׁפַּחַת הַיָּמִינִי / מִשְׁפַּחַת הַיָּכִינִי
  choice: ang angkan ng mga Nemuelita / Jaminita / Yakinita
  rationale: Ang mga anyong gentilic sa Hebreo ay tumutukoy sa pangkat ng mga inapo ng bawat ninuno; ginamit ang hulaping “-ita,” na likas sa mga pangalang pangkat sa Filipino.
- source_word: יָכִין
  choice: Yakin
  rationale: Inililipat nito sa baybay-Filipino ang tunog ng Hebreo, kung saan ang unang katinig ay yod (“y”) at ang ח/כִ ay kinakatawan nang payak bilang “k” sa madaling basahing transliterasyon.
