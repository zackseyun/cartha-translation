  register: Makabago ngunit marangal na Filipino; pinanatili ang maikli at paulit-ulit na ayos ng talaang pansensus. Ginamit ang “angkan” para sa teknikal na pangkat ng magkakamag-anak at ang mga pangalang binaybay ayon sa malinaw na tunog-Filipino.
