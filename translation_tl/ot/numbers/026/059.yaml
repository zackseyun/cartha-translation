base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: tl
  text: Ang pangalan ng asawa ni Amram ay Jokebed, na anak na babae ni Levi[a] at ipinanganak kay Levi sa Ehipto.[b] Isinilang niya kay Amram sina Aaron at Moises, at si Miriam na kapatid nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “anak na babae ni Levi.” Sa mga talaangkanan, ang “anak na babae” ay maaari ring tumukoy nang mas malawak sa isang babaeng inapo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “na isinilang niya kay Levi sa Ehipto”; hindi tahasang binanggit kung sino ang ina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: Ang pangalan ng asawa ni Amram
  rationale: Likas na panimulang pormula sa Filipino; hindi na isinama ang paunang pangatnig dahil hindi ito kailangan upang mapanatili ang tungkulin ng sugnay.
- source_word: יוֹכֶבֶד
  choice: Jokebed
  rationale: Malapit na transliterasyon ng pangalang Hebreo sa baybay na madaling basahin sa modernong Filipino.
- source_word: בַּת לֵוִי
  choice: anak na babae ni Levi
  rationale: Pinanatili ang payak na genealogical na pananalita ng Hebreo sa halip na ipakahulugang agad na mas malayong inapo.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: Ipinanganak siya kay Levi sa Ehipto
  rationale: Ginawang natural na pasibo sa Filipino habang pinananatili si Levi bilang ama at hindi tahasang dinaragdagan ang hindi pinangalanang ina.
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: Isinilang niya para kay Amram
  rationale: Pinananatili ang ugnayang ipinahihiwatig ng לְ kay Amram bilang ama, sa malinaw at likas na Filipino.
- source_word: אֶת אַהֲרֹן וְאֶת מֹשֶׁה
  choice: sina Aaron at Moises
  rationale: Ginamit ang pantukoy na “sina” para sa dalawang tiyak na pangalan; ang mga pananda ng tuwirang layon sa Hebreo ay hindi isinalin nang hiwalay.
- source_word: וְאֵת מִרְיָם אֲחֹתָם
  choice: at si Miriam na kapatid nila
  rationale: Pinanatili ang ayos ng Hebreong pangalan na sinusundan ng appositive at ang pangmaramihang reperensiya kina Aaron at Moises.
theological_decisions:
- issue: Saklaw ng genealogical na “anak na babae ni Levi”
  choice: Pinanatili sa pangunahing teksto ang “anak na babae ni Levi.”
  alternative: isang babaeng inapo ni Levi
  rationale: Hindi nilutas sa salin ang posibleng usaping kronolohikal o genealogical; hinayaang manatili ang anyo at tensiyon ng pinagmulan, na may paliwanag sa talababa.
- issue: Hindi pinangalanang ina ni Jokebed sa sugnay na Hebreo
  choice: Gumamit ng pasibong “Ipinanganak siya kay Levi.”
  alternative: “na isinilang ng isang babae para kay Levi”
  rationale: Iniiwasang magdagdag ng tahasang di-pangalanang tauhan habang pinananatili ang kahulugan at ang likas na daloy sa Filipino.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may bahagyang pormal na himig na angkop sa talaangkanan. Pinanatili ang literal na genealogical na katawagan at ipinaliwanag ang tunay na kalabuan sa mga talababa.
