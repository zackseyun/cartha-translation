  text: 'These are the clans of the Simeonites: twenty-two thousand two hundred.'
translation:
  language: tl
  text: 'Ito ang mga angkan ng mga Simeonita: dalawampu''t dalawang libo at dalawang daan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Ang maramihang panturong אֵלֶּה ay nagpapakilala sa kabuuang tala. Sa natural na Filipino, ang konstruksiyong “Ito ang mga…” ang malinaw at angkop na presentatibong anyo.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa konteksto ng tribo at sensus, tumutukoy ito sa mga pangkat ng magkakamag-anak sa loob ng isang tribo; mas tiyak ang “angkan” kaysa “pamilya.”
- source_word: הַשִּׁמְעֹנִי
  choice: mga Simeonita
  rationale: Ang pang-isahang katawagang gentiliko na may pantukoy ay ginagamit nang kolektibo para sa pangkat na nagmula kay Simeon; likas itong ipinapahayag sa Filipino bilang maramihang “mga Simeonita.”
- source_word: שְׁנַיִם וְעֶשְׂרִים
  choice: dalawampu't dalawa
  rationale: Karaniwang modernong Filipino na anyo ng bilang na dalawampu't dalawa.
- source_word: אֶלֶף
  choice: libo
  rationale: Tuwirang salin ng yunit ng bilang sa kabuuang sensus.
- source_word: וּמָאתָיִם
  choice: at dalawang daan
  rationale: Tuwirang kinukumpleto ang bilang na 22,200 sa natural na ayos ng Filipino.
