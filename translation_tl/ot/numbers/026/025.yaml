lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala ng pangmaramihang panturo ang pangwakas na buod; natural sa Filipino ang konstruksiyong “Ito ang” bago ang pangmaramihang pangngalan.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa konteksto ng sensus ng mga lipi, tumutukoy ito sa malalaking pangkat ng magkakamag-anak, kaya mas tiyak ang “mga angkan” kaysa “mga pamilya.”
- source_word: יִשָּׂשכָר
  choice: Isacar
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Filipino.
- source_word: לִפְקֻדֵיהֶם
  choice: ayon sa mga nabilang sa kanila
  rationale: Pinananatili nito ang pagtukoy sa mga taong binilang o itinala sa sensus mula sa mga angkang nabanggit, nang hindi labis na ipinapaliwanag ang Hebreong parirala.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
