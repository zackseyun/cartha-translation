- source_word: קֹרַח
  choice: Kora
  rationale: Pangalan itong pantangi; ginamit ang nakaugaliang anyong Tagalog na “Kora.”
- source_word: לֹא
  choice: hindi
  rationale: Karaniwang katumbas ng Hebreong pananggi.
- source_word: מֵתוּ
  choice: namatay
  rationale: Ang pandiwang מות ay pangunahing nangangahulugang “mamatay”; ang ganap na anyo ay natural na isinalin sa nagdaang panahon.
