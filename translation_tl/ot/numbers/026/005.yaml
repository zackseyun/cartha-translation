id: NUM.26.5
reference: Numbers 26:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל בְּנֵ֣י רְאוּבֵ֗ן חֲנוֹךְ֙ מִשְׁפַּ֣חַת הַ/חֲנֹכִ֔י לְ/פַלּ֕וּא מִשְׁפַּ֖חַת הַ/פַּלֻּאִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: tl
  text: 'Si Ruben, ang panganay ni Israel: ang mga anak ni Ruben: kay Hanok, ang angkan ng mga Hanokita; kay Palu, ang angkan ng mga Paluita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: ang panganay ni Israel
  rationale: Tuwirang ipinapahayag ng pariralang konstruktong Hebreo na si Ruben ang panganay ni Israel; hindi na kailangang idagdag ang “anak” dahil malinaw ito sa konteksto.
- source_word: בְּנֵי רְאוּבֵן
  choice: ang mga anak ni Ruben
  rationale: Pinananatili ang literal na ugnayang “mga anak,” na sa talaang ito ay nagpapakilala rin sa mga ninuno ng mga angkan.
- source_word: חֲנוֹךְ
  choice: Hanok
  rationale: Transliterasyong angkop sa bigkas at baybay sa modernong Filipino.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa konteksto ng sensus ng mga lipi, ang salita ay tumutukoy sa yunit ng magkakamag-anak sa loob ng isang lipi; mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: הַחֲנֹכִי
  choice: mga Hanokita
  rationale: Ang anyong gentiliko ay tumutukoy sa pangkat na nagmula kay Hanok; likas sa Filipino Bible register ang hulaping “-ita.”
- source_word: לְפַלּוּא
  choice: kay Palu
  rationale: Ang prefiks na לְ sa pormulang talaan ay nagpapakilala sa pinagmulan o ninuno ng angkan; ang “kay” ay maikli at natural sa Filipino habang pinananatili ang tersong estruktura.
- source_word: הַפַּלֻּאִי
  choice: mga Paluita
  rationale: Isinasalin ang gentiliko bilang pangalan ng mga kaangkan o inapo ni Palu, ayon sa karaniwang anyong Filipino.
theological_decisions: []
translation_notes:
  register: Pormal ngunit madaling maunawaang modernong Filipino. Pinanatili ang maikli at halos pormulang estruktura ng talaangkanan sa Hebreo, pati ang inuulit na ayos na “kay … ang angkan ng …,” nang hindi nagdaragdag ng paliwanag na “mula sa kanya nagmula.”
