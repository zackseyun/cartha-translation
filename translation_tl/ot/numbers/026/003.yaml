base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: tl
  text: 'Nagsalita sina Moises at Eleazar na pari sa kanila sa kapatagan ng Moab, sa tabi ng Jordan, malapit sa Jerico[a], at sinabi nila:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa tabi ng Jordan, sa tapat ng Jerico.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Likas na salin ng pandiwang nagpapakilala sa tuwirang pananalita; pinananatili nitong hiwalay ang pambungad na kilos sa kasunod na “Sinabi nila.”
- source_word: מֹשֶׁה וְאֶלְעָזָר הַכֹּהֵן
  choice: sina Moises at Eleazar na pari
  rationale: Ginagamit ang “sina” para sa tambalang simuno na mga pangalang pantangi. Ang “na pari” ay tumutukoy kay Eleazar at hindi nagdaragdag ng titulong “punong pari,” na wala sa Hebreo.
- source_word: אֹתָם
  choice: sa kanila
  rationale: Bagaman anyong tuwirang layon ang nasa Hebreo, hinihingi ng natural na Tagalog pagkatapos ng “nagsalita” ang pariralang “sa kanila.”
- source_word: בְּעַרְבֹת מוֹאָב
  choice: sa kapatagan ng Moab
  rationale: Ang “kapatagan” ay malinaw at karaniwang salin para sa patag na rehiyong steppe na tinutukoy ng עַרְבוֹת.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: sa tabi ng Jordan, sa tapat ng Jerico
  rationale: Ipinahahayag ng parirala ang lokasyon sa may Jordan kaugnay ng Jerico. Ang “sa tapat ng Jerico” ay malinaw na heograpikong pagbasa, habang inilalagay sa talababa ang mas pangkalahatang alternatibo.
- source_word: לֵאמֹר
  choice: Sinabi nila,
  rationale: Natural na Tagalog na pambungad sa nilalaman ng pananalita sa susunod na talata, nang hindi gumagamit ng pilit na “na nagsasabi.”
