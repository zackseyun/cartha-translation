  source_fidelity: Kailangang baguhin ang pangunahing heograpikong pagbasa at talababa. Ginawa ng draft na pangunahing teksto ang “sa tapat ng Jerico,” samantalang ang audit trail ay may mas pangkalahatang pangunahing pagbasa (“by the Jordan at Jericho”) at itinatala ang “opposite Jericho” bilang alternatibo. Ang “Sinabi nila” ay katanggap-tanggap na Tagalog na pagpapakilala sa kasunod na pananalita, ngunit mas maayos itong idugtong sa unang sugnay.
  naturalness: Natural at marangal ang karamihan ng bokabularyo. Mas maayos ang isang pangungusap na nagtatapos sa tutuldok kaysa sa putol na “Sinabi nila,” bilang hiwalay na pangungusap.
