  - severity: low
    issue: Medyo putol ang hiwalay na “Sinabi nila,”.
    rationale: Mas malinaw at mas natural ang pag-uugnay nito sa naunang sugnay at paggamit ng tutuldok upang ihanda ang direktang pananalita sa susunod na talata.
