translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang dalawang pangungusap ang Hebreong pormulang לֵאמֹר upang maging natural ang daloy bago ang sipi sa susunod na talata; pinanatili ang heograpikong kalabuan sa pamamagitan ng talababa.
