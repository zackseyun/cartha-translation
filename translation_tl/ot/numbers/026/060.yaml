  yaml_path: translation/ot/numbers/026/060.yaml
  text: To Aaron were born Nadab and Abihu[a], Eleazar and Ithamar.
translation:
  language: tl
  text: Ipinanganak kay Aaron sina Nadab at Abihu, Eleazar at Itamar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Ipinanganak kay Aaron si Nadab at si Abihu, si Eleazar at si Itamar,” na gumagamit ng pandiwang isahan bago ang talaan ng maraming pangalan sa isang pormulang pangangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: Ipinanganak
  rationale: Ang Niphal ng ילד ay may pasibo/resultatibong diwa, kaya ang natural na salin ay “ipinanganak.” Bagaman isahan ang pandiwa sa Hebreo, ipinakikilala nito ang tambalang talaan ng mga anak; sa Tagalog, hindi kailangang markahan sa pandiwa ang bilang.
- source_word: לְאַהֲרֹן
  choice: kay Aaron
  rationale: Ang לְ ay tumutukoy sa magulang na kinapanganakan ng mga anak. Likas sa Tagalog ang “ipinanganak kay Aaron,” at napapanatili nito ang pasibong ayos ng Hebreo.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: sina ... at ...
  rationale: Walang tuwirang katumbas sa Tagalog ang אֶת. Ginamit ang pantukoy na “sina” upang ipakilala ang magkakaugnay na mga pangalang pantangi bilang isang talaan.
- source_word: נָדָב
  choice: Nadab
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: אֲבִיהוּא
  choice: Abihu
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Transliterasyong angkop sa tunog ng pangalang Hebreo at karaniwang anyo sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pasibong pormulang pangangkanan ng Hebreo; ginamit ang “sina” para maging natural ang talaan sa Tagalog. Inilagay ang talababa pagkatapos ng buong pangungusap upang ipaliwanag ang pambalarilang anyo ng pinagmulang teksto.
