  naturalness: Likas ang “mga binilang,” “mga anak ni Israel,” at “kapatagan ng Moab.” Mas malinaw at mas natural ang isang pangungusap na may “nang bilangin nila,” dahil iniiwasan nito ang malabong panghalip na “Sila.”
