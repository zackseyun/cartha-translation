base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: tl
  text: Ito ang mga binilang nina Moises at Eleazar na pari nang bilangin nila ang mga anak ni Israel[a] sa kapatagan ng Moab, sa tabi ng Jordan, sa tapat ng Jerico.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “sa tabi ng Jordan sa Jerico.” Ang maikling pariralang Hebreo ay maaari ring unawain bilang lokasyong kaugnay ng Jordan sa tapat ng Jerico.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: mga binilang
  rationale: Sa konteksto ng sensus, tumutukoy ang anyong ito sa mga taong isinama sa bilang. Tuwiran at likas sa Tagalog ang “mga binilang,” at pinananatili nito ang personal sa halip na abstraktong pagtukoy.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: “Pari” lamang ang tahasang nasa Hebreo. Hindi idinagdag ang titulong “punong pari,” kahit iyon ang tungkulin ni Eleazar sa konteksto.
- source_word: פָּקְדוּ
  choice: nagbilang
  rationale: Pinananatili nito ang pag-uulit ng salitang-ugat na kaugnay ng “mga binilang” at malinaw na ang tinutukoy ay ang sensus.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa literal at genealogical na diwa ng Hebreo, habang likas pa ring nauunawaan bilang mga inapo o sambayanan ni Israel.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: sa kapatagan ng Moab
  rationale: Ang heograpikong ekspresyon ay tumutukoy sa malalawak at patag na lupain ng Moab; malinaw at nakaugaliang salin ang “kapatagan ng Moab.”
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: sa tabi ng Jordan, sa tapat ng Jerico
  rationale: Ipinapahayag nito ang lokasyon sa kahabaan ng Jordan kaugnay ng Jerico. Ang maikling Hebreong parirala ay maaaring unawain sa higit sa isang paraan, kaya inilalahad sa talababa ang mas literal na alternatibo.
theological_decisions:
- issue: Ang genealogical at panlalaking ekspresyong בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang anyo at diwa ng pinagmulang Hebreo nang hindi nililimitahan ang tinutukoy sa mga literal na anak na lalaki; nililinaw ng talababa ang karaniwang kolektibong kahulugan.
- issue: Opisyal na titulo ni Eleazar
  choice: pari
  alternative: punong pari
  rationale: Hindi pinalalawak ang titulong nasa teksto. Bagaman hawak ni Eleazar ang mataas na katungkulang makasaserdote sa konteksto, “ang pari” lamang ang sinasabi ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang mahabang sugnay upang maging natural sa karaniwang mambabasa, habang pinananatili ang ugnayan ng mga binilang at ng mga nagsagawa ng sensus. Ginamit ang “nina” dahil kapuwa sina Moises at Eleazar ang gumaganap sa kilos.
