source:
  edition: WLC
  text: וְ/אֵ֨לֶּה פְקוּדֵ֣י הַ/לֵּוִי֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/גֵרְשׁ֗וֹן מִשְׁפַּ֨חַת֙ הַ/גֵּ֣רְשֻׁנִּ֔י לִ/קְהָ֕ת מִשְׁפַּ֖חַת הַ/קְּהָתִ֑י לִ/מְרָרִ֕י מִשְׁפַּ֖חַת הַ/מְּרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: tl
  text: 'At ito ang mga Levita na binilang[a] ayon sa kani-kanilang angkan: mula kay Gershon, ang angkan ng mga Gershonita; mula kay Kohat, ang angkan ng mga Kohatita; mula kay Merari, ang angkan ng mga Merarita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naitala.” Tumutukoy ang Hebreo sa mga taong isinama sa sensus, hindi lamang sa mismong pagbibilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: mga Levita na binilang
  rationale: Tumutukoy ang anyo ng פקד sa mga taong naitala o binilang sa sensus, hindi lamang sa abstraktong gawain ng pagbibilang. Natural sa Tagalog ang sugnay na “na binilang,” at nililinaw ng konteksto na mga Levita ang tinutukoy.
- source_word: הַלֵּוִי
  choice: mga Levita
  rationale: Bagaman anyong isahan ang Hebreo, ginagamit ito rito bilang katawagan sa lipi ni Levi. Ang maramihang “mga Levita” ang natural na Tagalog para sa mga taong kabilang sa sensus na ito.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa konteksto ng lipi at sensus, ang מִשְׁפָּחָה ay mas malawak kaysa makabagong nukleyar na pamilya. Tumpak na ipinahahayag ng “angkan” ang pangkat na nakabatay sa lahi, at ng “kani-kanilang” ang pamamahagi sa mga pangkat.
- source_word: לְגֵרְשׁוֹן / לִקְהָת / לִמְרָרִי
  choice: mula kay Gershon / Kohat / Merari
  rationale: Ang לְ sa paulit-ulit na pormulang ito ay naghahayag ng kaugnayan sa ninuno o pinagmulan. Mas malinaw sa Tagalog ang “mula kay” para sa mga angkang nagmula sa bawat taong pinangalanan.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי / הַקְּהָתִי / הַמְּרָרִי
  choice: ang angkan ng mga Gershonita / Kohatita / Merarita
  rationale: Ang mga anyong gentilic sa Hebreo ay tumutukoy sa mga pangkat ng mga inapo. Pinananatili ng maramihang katawagang Tagalog ang kolektibong diwa ng bawat angkan.
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ng “At” ang pagkakaugnay sa naunang talaan, samantalang natural at marangal sa modernong Tagalog ang “ito ang” bilang panimula sa listahan.
