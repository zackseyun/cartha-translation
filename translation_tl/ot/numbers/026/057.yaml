translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “angkan” sa halip na “pamilya” upang maipakita ang yunit ng lipi sa konteksto ng sensus. Isinalin ang mga pangalang Gershon, Kohat, at Merari sa mga anyong karaniwang madaling basahin sa Tagalog, at binuo ang mga katawagang pang-inapo bilang Gershonita, Kohatita, at Merarita.
