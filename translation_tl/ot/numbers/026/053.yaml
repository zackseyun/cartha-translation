base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/053.yaml
  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: tl
  text: Sa mga ito hahatiin ang lupain bilang mana, ayon sa bilang ng mga pangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa bilang ng mga tao”; literal, “ayon sa bilang ng mga pangalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: Sa mga ito
  rationale: Ipinahihiwatig ng לְ na sila ang mga tatanggap ng paghahati; natural sa Tagalog ang “sa mga ito” at pinananatili nito ang pagtukoy sa mga kababanggit lamang.
- source_word: תֵּחָלֵק
  choice: hahatiin
  rationale: Ang Nifal imperfect ng חלק ay nagsasaad na ang lupain ay hahatiin o paghahati-hatian; malinaw at tuwiran ang pasibong “hahatiin.”
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto ng pamamahagi ng teritoryo sa Israel, mas angkop ang “lupain” kaysa pangkalahatang “lupa.”
- source_word: בְּנַחֲלָה
  choice: bilang mana
  rationale: Ipinapahayag ng נַחֲלָה ang ari-ariang minana o bahaging ipinagkaloob; pinananatili ng “bilang mana” ang legal at tipanang diwa.
- source_word: בְּמִסְפַּר
  choice: ayon sa bilang ng
  rationale: Ang בְּ ay nagpapahayag dito ng pamantayan o batayan ng pamamahagi; likas sa Tagalog ang “ayon sa bilang ng.”
- source_word: שֵׁמוֹת
  choice: mga pangalan
  rationale: Literal na “mga pangalan” ang Hebreo. Pinananatili ito sa teksto upang hindi agad ipalit ang interpretatibong “mga tao,” habang nililinaw sa talababa ang kahulugan sa konteksto ng sensus.
