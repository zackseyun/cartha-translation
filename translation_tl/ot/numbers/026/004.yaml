id: NUM.26.4
reference: Numbers 26:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּצְאִ֖ים מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: tl
  text: Mula sa dalawampung taong gulang pataas, gaya ng iniutos ni Yahweh[a] kay Moises at sa mga Israelita[b] na lumabas mula sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ay salin-titik ng banal na pangalang Hebreo na YHWH; karaniwan din itong isinasaling “PANGINOON.”
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “mga anak ni Israel,” isang karaniwang katawagan sa mga Israelita bilang isang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: Mula sa dalawampung taong gulang pataas
  rationale: Likas na salin ng Hebreong pormula ng takdang edad, na literal na nagsasabing ‘mula sa anak na dalawampung taon at pataas.’
- source_word: כַּאֲשֶׁר צִוָּה
  choice: gaya ng iniutos
  rationale: Pinananatili ang paghahambing at ang mariing diwa ng pandiwang tumutukoy sa pag-uutos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang Hebreo na YHWH sa halip na palitan ito ng isang titulo.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: at sa mga Israelita
  rationale: Ang literal na ‘mga anak ni Israel’ ay karaniwang kolektibong katawagan sa bayang Israel; ‘mga Israelita’ ang natural at malinaw na katumbas sa modernong Filipino.
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: na lumabas mula sa lupain ng Ehipto
  rationale: Ginagawang likas na sugnay na panuring ang Hebreong participle at pinananatili ang tahasang pinagmulan ng paglabas.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulong ‘PANGINOON.’
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang anyong tila pagpapatuloy ng naunang pangungusap, gaya ng Hebreong talata, nang hindi nagdaragdag ng pandiwang ‘bilangin’ na wala sa talatang ito.
