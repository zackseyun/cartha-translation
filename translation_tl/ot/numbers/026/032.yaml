base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: tl
  text: mula kay Semida, ang angkan ng mga Semidaita; at mula kay Hefer, ang angkan ng mga Heferita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: mula kay Semida
  rationale: Sa pormula ng sensus, ipinahihiwatig ng Hebreo ang pinagmulan ng angkan. Likas sa Tagalog ang “mula kay” bago ang pangalan ng taong pinagmulan.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa talaang pantribo, tumutukoy ang מִשְׁפָּחָה sa pangkat ng magkakamag-anak sa loob ng isang lipi; mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: הַ/שְּׁמִידָעִי
  choice: mga Semidaita
  rationale: Ang anyong gentiliko ay tumutukoy sa pangkat ng mga inapo o kaangkan ni Semida. Ginamit ang hulaping “-ita,” isang likas at kinikilalang anyo sa Filipino para sa ganitong mga katawagang pangangkan.
- source_word: וְ/חֵפֶר
  choice: at mula kay Hefer
  rationale: Ipinagpapatuloy ng pang-ugnay ang inuulit na pormula ng sensus; nilinaw sa Tagalog ang ipinahihiwatig na “mula kay.”
- source_word: הַֽ/חֶפְרִי
  choice: mga Heferita
  rationale: Tumutukoy ang gentiliko sa angkang nagmula kay Hefer; pinananatili ng “mga Heferita” ang pagkakaiba ng ninunong si Hefer at ng kanyang mga inapo.
