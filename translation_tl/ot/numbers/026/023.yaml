  register: Makabago at marangal na Filipino, na may paulit-ulit na hulma upang mapanatili ang estilo ng talaan sa sensus. Ginamit ang “angkan” sa halip na “pamilya” dahil mas tiyak ito para sa sangay sa loob ng isang lipi.
