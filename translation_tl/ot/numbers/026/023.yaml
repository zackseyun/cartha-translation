  text: בְּנֵ֤י יִשָּׂשכָר֙ לְ/מִשְׁפְּחֹתָ֔/ם תּוֹלָ֕ע מִשְׁפַּ֖חַת הַ/תּוֹלָעִ֑י לְ/פֻוָ֕ה מִשְׁפַּ֖חַת הַ/פּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: tl
  text: 'Ang mga anak ni Isacar ayon sa kani-kanilang angkan: mula kay Tola, ang angkan ng mga Tolaita; mula kay Puva[a], ang angkan ng mga Punita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Puva ay binabaybay na “Pua” sa ilang kaugnay na talata at salin.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: Ang mga anak ni Isacar
  rationale: Pinananatili ang pormal na hulma ng talaangkanan at sensong pantribo ng בני, habang ginagamit ang karaniwang anyong Filipino ng pangalang Issachar.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa konteksto ng sensus, ang מִשְׁפָּחָה ay tumutukoy sa mga sangay o angkan sa loob ng lipi; nililinaw ng “kani-kanilang” ang distributibong diwa.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Pangalang pantangi ito sa konteksto, kaya tinumbasan sa transliterasyong natural sa Filipino at hindi isinalin ayon sa kahulugan ng kaugnay na karaniwang pangngalan.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: ang angkan ng mga Tolaita
  rationale: Ang anyong gentilic na הַתּוֹלָעִי ay tumutukoy sa mga nagmula kay Tola; ang maramihang “mga Tolaita” ay natural na katawagan sa mga kaanib ng angkan.
- source_word: לְפֻוָה
  choice: mula kay Puva
  rationale: Ang לְ ay distributibong nagpapakilala sa ninuno ng kasunod na angkan. Ang Puva ay malapit sa baybay na פֻוָה at angkop sa ortograpiyang Filipino.
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: ang angkan ng mga Punita
  rationale: Ang gentilic na הַפּוּנִי ay pangalan ng pangkat na nagmula kay Puva; “Punita” ang tuwirang anyong Filipino na nagpapanatili sa katinig ng Hebreo.
