  text: אֵ֣לֶּה בְנֵי אֶפְרַיִם֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שׁוּתֶ֗לַח מִשְׁפַּ֨חַת֙ הַ/שֻּׁ֣תַלְחִ֔י לְ/בֶ֕כֶר מִשְׁפַּ֖חַת הַ/בַּכְרִ֑י לְ/תַ֕חַן מִשְׁפַּ֖חַת הַֽ/תַּחֲנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: tl
  text: 'Ito ang mga anak ni Efraim ayon sa kanilang mga angkan: kay Shutela, ang angkan ng mga Shutelaíta; kay Beker, ang angkan ng mga Bekerita; at kay Tahan, ang angkan ng mga Tahanita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי אֶפְרַיִם
  choice: Ito ang mga anak ni Efraim
  rationale: Pinananatili ang demonstratibong pormula at ang pormal na wikang pangangkanan ng בְנֵי, habang natural ang ayos sa modernong Tagalog.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa konteksto ng sensus sa Mga Bilang, ang מִשְׁפָּחָה ay tumutukoy sa mga pangkat-angkan sa loob ng lipi; mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: לְשׁוּתֶלַח ... לְבֶכֶר ... לְתַחַן
  choice: kay Shutela ... kay Beker ... kay Tahan
  rationale: Ang לְ sa paulit-ulit na pormulang pangangkanan ay nag-uugnay sa bawat angkan sa pinagmulan nitong ninuno. Sa Tagalog, natural itong maipahayag sa “kay” kasunod ng pambungad na pag-uuri ayon sa mga angkan.
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: ang angkan ng mga Shutelaíta
  rationale: Ang anyong gentilic ay tumutukoy sa pangkat na nagmula kay Shutela. Ang hulaping “-ita” ay malinaw na panandang pangkat sa Tagalog, at ang tuldik ay tumutulong sa wastong bigkas.
- source_word: מִשְׁפַּחַת הַבַּכְרִי
  choice: ang angkan ng mga Bekerita
  rationale: Isinasalin ang gentilic bilang kolektibong katawagan sa angkang kaugnay ni Beker at pinananatili ang paralelismo ng talaan.
- source_word: מִשְׁפַּחַת הַתַּחֲנִי
  choice: ang angkan ng mga Tahanita
  rationale: Isinasalin ang gentilic bilang kolektibong katawagan sa angkang nagmula kay Tahan, kaayon ng paulit-ulit na estruktura ng Hebreo.
