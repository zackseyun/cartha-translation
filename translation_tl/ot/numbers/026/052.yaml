lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang wayyiqtol ng דבר ay nagpapatuloy sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, nagsalita” at pinananatili nito ang pormulang nagpapakilala sa banal na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang likas na katumbas bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang pamantayan at madaling makilalang anyo ng pangalan sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na panandang Hebreo na nagpapakilala sa nilalaman ng susunod na pahayag.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulong “ang PANGINOON”; hindi rin pinipili ang huling anyong “Jehova.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormal na pormula ng pagpapakilala sa banal na pananalita; ang “na sinasabi” ay bahagyang pormal ngunit angkop dahil nagpapatuloy ang pangungusap sa susunod na talata.
