  yaml_path: translation/ot/numbers/026/052.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh[a] kay Moises:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; karaniwang isinasalin bilang “ang PANGINOON.”'
