  source_fidelity: 'Tumpak ang mga pangunahing elemento: ang wayyiqtol ay pagsasalita ni Yahweh kay Moises at ang לֵאמֹר ay panimulang pormula para sa susunod na pahayag. Gayunman, ang “na sinasabi” ay hindi likas na katumbas sa ganitong pormulang naratibo sa Tagalog at gumagamit ng aspektong kasalukuyan. Ang tutuldok ay ligtas at malinaw na katumbas ng tungkulin ng לֵאמֹר, sapagkat ipinakikilala nito ang direktang pananalitang kasunod.'
  naturalness: Mas natural at marangal sa makabagong Tagalog ang “At nagsalita si Yahweh kay Moises:” kaysa “Pagkatapos, nagsalita ... na sinasabi,”. Ang “At” ay angkop na panandang pagpapatuloy ng salaysay; ang tutuldok ay naghuhudyat na nagpapatuloy ang pahayag sa susunod na talata.
  terminology: Ang “Yahweh” ay wastong pagpapanatili ng Tetragrammaton, at ang “Moises” ang karaniwang Tagalog na anyo ng pangalan. Inilipat ang panandang talababa sa “Yahweh,” ang salitang tinutukoy ng talababa.
