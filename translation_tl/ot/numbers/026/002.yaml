base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: tl
  text: “Ibilang ninyo ang buong kapulungan ng mga anak ni Israel[a], mula sa dalawampung taong gulang pataas, ayon sa mga sambahayan ng kanilang mga ama—lahat ng maaaring maglingkod sa hukbo sa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “itaas ninyo ang ulo ng buong kapulungan.” Isa itong idyoma na nangangahulugang bilangin o magsagawa ng senso.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: Ibilang ninyo
  rationale: Ang literal na ‘itaas ang ulo’ ay isang idyomang Hebreo para sa pagbibilang o pagsasagawa ng senso. Natural at malinaw sa modernong Tagalog ang ‘ibilang,’ at akma ito sa pag-uutos na itala ang mga kabilang sa pangkat.
- source_word: כָּל עֲדַת
  choice: ang buong kapulungan
  rationale: Tumutukoy ang עֵדָה sa kabuuang pamayanang tipan. Pinananatili ng ‘kapulungan’ ang pormal at kolektibong diwa nito.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pampamilyang pananalita ng Hebreo at likas itong parirala sa marangal na Tagalog. Sa konteksto ng sensong pangmilitar, hindi dapat ikubli ang panlalaking pokus ng talata.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula sa dalawampung taong gulang pataas
  rationale: Direkta at natural na salin ng pormulang nagtatakda ng pinakamababang edad.
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa sambahayan ng kanilang mga ninuno
  rationale: Ang בֵּית אָב ay yunit ng angkan o sambahayang nakaugnay sa linya ng ama. Ang ‘sambahayan ng kanilang mga ninuno’ ay malinaw sa kasalukuyang Tagalog nang hindi nilalabo ang organisasyong pampamilya.
- source_word: כָּל יֹצֵא צָבָא
  choice: ang lahat ... na lumalabas upang makipagdigma
  rationale: Malapit ito sa aktibong anyo ng Hebreo, ‘lahat ng lumalabas sa hukbo/pakikidigma,’ at hindi tahasang nagdaragdag ng ‘karapat-dapat’ o ‘may kakayahan,’ bagaman iyon ang praktikal na ipinahihiwatig ng konteksto.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Payak na salin ng pariralang tumutukoy sa mga kabilang sa Israel.
theological_decisions:
- issue: Pampamilyang panlalaking ekspresyon sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang tunay na pampamilyang larawan ng orihinal. Mahalaga rin ang panlalaking konteksto dahil ang binibilang ay yaong lumalabas sa pakikidigma.
- issue: Kahulugang pangmilitar ng כָּל יֹצֵא צָבָא
  choice: ang lahat sa Israel na lumalabas upang makipagdigma
  alternative: ang bawat lalaking karapat-dapat maglingkod sa hukbo sa Israel
  rationale: Ang piniling salin ay mas pormal na sumusunod sa Hebreo at hindi ginagawang tahasang pamantayan ang ipinahihiwatig lamang na pagiging karapat-dapat sa paglilingkod-militar.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘kapulungan’ para sa pormal na katawagan sa pamayanan, at ‘sambahayan ng kanilang mga ninuno’ upang maipahayag ang estrukturang pampamilya nang natural. Isang talang pangwika lamang ang kailangan, at ang marker na [a] ay nasa mismong teksto.
