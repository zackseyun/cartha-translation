source:
  edition: WLC
  text: בְּנֵ֣י בִנְיָמִן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/בֶ֗לַע מִשְׁפַּ֨חַת֙ הַ/בַּלְעִ֔י לְ/אַשְׁבֵּ֕ל מִשְׁפַּ֖חַת הָֽ/אַשְׁבֵּלִ֑י לַ/אֲחִירָ֕ם מִשְׁפַּ֖חַת הָ/אֲחִירָמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: tl
  text: 'Ang mga anak ni Benjamin ayon sa kani-kanilang angkan: mula kay Bela, ang angkan ng mga Belaita; mula kay Asbel, ang angkan ng mga Asbelita; at mula kay Ahiram[a], ang angkan ng mga Ahiramita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ahiram” ang mababasa sa Tekstong Masoretiko; “Ahiam” naman ang nasa ilang tradisyon ng teksto at salin.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: Ang mga anak ni Benjamin
  rationale: Pinananatili ng “mga anak” ang pormal na anyo ng Hebreo, bagaman sa konteksto ng sensus ay saklaw nito ang mga inapo ni Benjamin.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה ay tumutukoy rito sa mga pangkat o angkan sa loob ng lipi; nililinaw ng “kani-kanilang” ang pamamahagi sa mga angkan.
- source_word: לְבֶלַע
  choice: mula kay Bela
  rationale: Sa talaangkanang kontekstong ito, ipinakikilala ng ל ang ninunong pinagmulan ng bawat angkan; natural itong ipinahahayag sa Tagalog bilang “mula kay.”
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: ang angkan ng mga Belaita
  rationale: Ang anyong gentiliko ay tumutukoy sa angkang nagmula kay Bela; ginamit ang “mga Belaita” bilang malinaw na pangalan ng pangkat.
- source_word: לְאַשְׁבֵּל
  choice: mula kay Asbel
  rationale: Isinalin ang genealogical ל bilang “mula kay.” Ang “Asbel” ay likas na anyong Tagalog ng pangalang Hebreo na אַשְׁבֵּל.
- source_word: מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: ang angkan ng mga Asbelita
  rationale: Ipinahahayag nito ang pangkat na nagmula kay Asbel at sumusunod sa karaniwang pagbuo ng mga pangalan ng angkan sa Tagalog.
- source_word: לַאֲחִירָם
  choice: mula kay Ahiram[a]
  rationale: Sinusunod ng pangunahing teksto ang pagbasa ng Masoretic Text na אֲחִירָם. Inilagay rito ang talababa dahil dito mismo nauukol ang tekstuwal na variant.
- source_word: מִשְׁפַּחַת הָאֲחִירָמִי
  choice: ang angkan ng mga Ahiramita
  rationale: Ang anyong gentiliko ay isinalin bilang pangalan ng pangkat na nagmula kay Ahiram, kaayon ng padron ng buong talata.
