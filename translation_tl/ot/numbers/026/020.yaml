  text: וַ/יִּהְי֣וּ בְנֵי יְהוּדָה֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שֵׁלָ֗ה מִשְׁפַּ֨חַת֙ הַ/שֵּׁ֣לָנִ֔י לְ/פֶ֕רֶץ מִשְׁפַּ֖חַת הַ/פַּרְצִ֑י לְ/זֶ֕רַח מִשְׁפַּ֖חַת הַ/זַּרְחִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: tl
  text: 'Ang mga anak ni Juda, ayon sa kani-kanilang angkan, ay ang mga sumusunod: mula kay Sela, ang angkan ng mga Selanita; mula kay Perez, ang angkan ng mga Perezita; at mula kay Zera, ang angkan ng mga Zeraita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay ang mga sumusunod
  rationale: Sa pormula ng talaan ng sensus, ipinakikilala ng anyong ito ang listahan. Natural sa modernong Tagalog ang “ay ang mga sumusunod” at hindi nito ipinahihiwatig ang isang proseso ng pagiging.
- source_word: בְנֵי יְהוּדָה
  choice: Ang mga anak ni Juda
  rationale: Pinananatili nito ang literal na pananalitang “mga anak ni Juda” at ang panlalaking balangkas ng talaangkanan; sa konteksto ng sensus, tumutukoy ito sa mga lalaking inapo ni Juda.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה rito ay isang pangkat sa loob ng lipi, kaya mas tiyak ang “angkan” kaysa “pamilya.” Ipinakikita ng “kani-kanilang” ang pag-uuri sa maramihang angkan.
- source_word: לְשֵׁלָה / לְפֶרֶץ / לְזֶרַח
  choice: mula kay Sela / Perez / Zera
  rationale: Ang inuulit na לְ ay nagpapakilala sa ninunong pinagmulan ng bawat angkan. Malinaw at likas sa Tagalog ang “mula kay.”
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: ang angkan ng mga Selanita
  rationale: Pinananatili ang kapuwa pangngalang “angkan” at ang katawagang hinango sa pangalan ng ninuno.
- source_word: מִשְׁפַּחַת הַפַּרְצִי
  choice: ang angkan ng mga Perezita
  rationale: Ang “Perezita” ay malinaw na hango sa Perez at umaayon sa karaniwang paraan ng Filipino sa pagbuo ng pangalan ng pangkat.
- source_word: מִשְׁפַּחַת הַזַּרְחִי
  choice: ang angkan ng mga Zeraita
  rationale: Ang “Zeraita” ay nagpapanatili sa ugnayan ng katawagan ng angkan sa pangalang Zera at natural basahin sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Pinanatili ang paulit-ulit na estruktura ng talaan, ngunit gumamit ng “mula kay” upang maging likas ang pagpapahayag ng pinagmulang angkan. Walang talababa dahil walang tunay na kalabuan sa talata na kailangang ipaliwanag para sa target na mambabasa.
