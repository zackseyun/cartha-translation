  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “angkan” para sa yunit ng kamag-anakan sa sensus at ang “na pinagmulan ng” upang likas na maipahayag ang maigsi ngunit di-idiomatikong pormulang Hebreo.
