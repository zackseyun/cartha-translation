  text: וַ/יִּהְי֣וּ בְנֵי פֶ֔רֶץ לְ/חֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽ/חֶצְרֹנִ֑י לְ/חָמ֕וּל מִשְׁפַּ֖חַת הֶ/חָמוּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: tl
  text: 'Ang mga anak ni Perez ay: mula kay Hezron, ang angkan ng mga Hezronita; mula kay Hamul, ang angkan ng mga Hamulita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay sina
  rationale: Sa pormulang talaangkanan, simpleng ipinakikilala ng pandiwa ang mga anak na nakalista. Likas sa Tagalog ang hulma na “Ang mga anak ... ay sina” para sa mga pangalang pantangi.
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Tumutukoy ito rito sa mga lalaking anak na pinagmulan ng mga angkan; pinananatili ng “mga anak ni” ang tuwirang ugnayang genealogical nang hindi nagdaragdag ng paliwanag.
- source_word: פֶרֶץ
  choice: Perez
  rationale: Makabagong transliterasyon ng pangalang Hebreo na פֶרֶץ, at kaayon ng karaniwang anyo sa modernong Filipino.
- source_word: לְחֶצְרֹן
  choice: Hezron, na pinagmulan ng
  rationale: Ang לְ sa pormulang ito ay nag-uugnay sa pinunong ninuno at sa angkang nagmula sa kaniya. Ang pariralang ito ay malinaw at natural sa Tagalog.
- source_word: מִשְׁפַּחַת
  choice: angkan ng
  rationale: Sa konteksto ng sensus sa Mga Bilang, tumutukoy ang מִשְׁפָּחָה sa pangkat ng magkakamag-anak sa loob ng lipi. Mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: הַחֶצְרֹנִי
  choice: mga Hezronita
  rationale: Ang anyong gentiliko ay tumutukoy sa pangkat na nagmula kay Hezron. Ang hulaping “-ita” ay natural na paraan sa Filipino upang pangalanan ang gayong pangkat.
- source_word: לְחָמוּל
  choice: Hamul, na pinagmulan ng
  rationale: Gaya sa pangalan ni Hezron, ipinahihiwatig ng לְ ang kaugnayan ng ninunong si Hamul sa angkang nagmula sa kaniya.
- source_word: הֶחָמוּלִי
  choice: mga Hamulita
  rationale: Tumutukoy ang gentiliko sa angkang nagmula kay Hamul; malinaw at maikli ang “mga Hamulita” sa Filipino.
