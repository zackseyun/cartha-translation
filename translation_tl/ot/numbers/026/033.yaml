  text: וּ/צְלָפְחָ֣ד בֶּן חֵ֗פֶר לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: tl
  text: Si Zelofehad na anak ni Hefer ay walang mga anak na lalaki[a], kundi mga anak na babae lamang. Ang mga pangalan ng mga anak na babae ni Zelofehad ay Mahla, Noa[b], Hogla, Milca, at Tirza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “walang mga anak na lalaki sa kanya, maliban sa mga anak na babae.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Noa” rito ay pangalan ng isa sa mga anak na babae ni Zelofehad, hindi ang Noe sa salaysay ng baha.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/צְלָפְחָד בֶּן חֵפֶר
  choice: Si Zelofehad na anak ni Hefer
  rationale: Pinanatili ang pang-ugnay sa natural na daloy ng Filipino nang hindi nagdaragdag ng tahasang panandang temporal. Isinalin ang ugnayang בֶּן bilang “anak ni,” at isinalin-titik ang mga pangalang pantangi.
- source_word: לֹא הָיוּ לֹו בָּנִים
  choice: ay walang mga anak na lalaki
  rationale: Likas itong katumbas sa Filipino ng literal na Hebreong “walang mga anak na lalaki sa kanya.” Pinanatili ang tiyak na kahulugang lalaki dahil malinaw itong itinatambis sa mga anak na babae.
- source_word: כִּי אִם בָּנוֹת
  choice: kundi mga anak na babae lamang
  rationale: 'Ipinahahayag ng כִּי אִם ang pagtatangi at pagtutol: wala siyang mga anak na lalaki at mga anak na babae lamang ang mayroon siya.'
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: Ang mga pangalan ng mga anak na babae ni Zelofehad ay
  rationale: Bagaman isahan ang שֵׁם sa Hebreo, kolektibo ang gamit nito bago ang maramihang tinutukoy; kaya maramihan ang “mga pangalan” sa natural na Filipino.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milca, at Tirza
  rationale: Isinalin-titik ang mga pangalang pantangi sa anyong malinaw at madaling basahin sa modernong Filipino. Nilagyan ng paliwanag ang Noa upang hindi mapagkamalang ang lalaking Noe sa salaysay ng baha.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “anak na lalaki” at “anak na babae” upang mapanatili ang tahasang pagkakaiba sa tekstong Hebreo; pinanatili rin ang anyong talaangkanan at ang mga pangalang pantangi sa isinalin-titik na anyo.
