base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: tl
  text: 'Kay Iezer: ang angkan ng mga Iezerita; kay Shillem: ang angkan ng mga Shillemita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: kay Iezer
  rationale: Sa pormula ng sensus, ipinakikilala ng לְ ang pinagmulan o puno ng angkang inililista. Likas sa Filipino ang “kay” bago ang pangalan ng tao, habang pinananatiling transliterado ang pangalan.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa kontekstong pantribo at pansensus, tumutukoy ang מִשְׁפָּחָה sa isang pangkat ng magkakamag-anak sa loob ng tribo; mas tumpak ang “angkan” kaysa “pamilya.”
- source_word: הַ/יִּצְרִי
  choice: mga Iezerita
  rationale: Ang anyong gentiliko ay tumutukoy sa mga inapo o angkang nagmula kay Iezer. Ginagamit ang hulaping Filipino na “-ita” at ang “mga” upang likas na ipahayag ang pangkat.
- source_word: לְ/שִׁלֵּם
  choice: kay Shilem
  rationale: Tulad ng unang sugnay, ipinakikilala ng לְ ang pinagmulan o puno ng angkan. Ang “kay” ang likas na katumbas sa Filipino, at transliterado ang pangalan ayon sa tunog ng Hebreo.
- source_word: הַ/שִּׁלֵּמִי
  choice: mga Shilemita
  rationale: Ang gentiliko ay tumutukoy sa mga inapo o angkan ni Shilem. Ang “mga Shilemita” ay malinaw at natural na katawagan sa Filipino.
theological_decisions: []
translation_notes:
  register: Maikli at pormal na estilong talaan, ngunit natural sa modernong Filipino. Ginamit ang “angkan” para sa estrukturang pantribo at ang mga pangalang Iezer at Shilem bilang tuwirang transliterasyon mula sa Hebreo.
