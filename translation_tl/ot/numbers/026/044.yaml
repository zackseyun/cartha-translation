source:
  edition: WLC
  text: בְּנֵ֣י אָשֵׁר֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/יִמְנָ֗ה מִשְׁפַּ֨חַת֙ הַ/יִּמְנָ֔ה לְ/יִשְׁוִ֕י מִשְׁפַּ֖חַת הַ/יִּשְׁוִ֑י לִ/בְרִיעָ֕ה מִשְׁפַּ֖חַת הַ/בְּרִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: tl
  text: 'Ang mga anak na lalaki ni Aser ayon sa kani-kanilang angkan[a]: mula kay Imna, ang angkan ng mga Imnita; mula kay Isvi, ang angkan ng mga Isvita; at mula kay Beria, ang angkan ng mga Berita.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “mga pamilya”; sa talaang ito ng sensus, tumutukoy ito sa mga pangkat-angkan sa loob ng lipi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga Beriaita”; ang katawagang Hebreo ay hango sa pangalang Beria.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: Ang mga anak na lalaki ni Aser
  rationale: Pinananatili ang literal at pangangkanang diwa ng בְּנֵי, na tumutukoy sa mga anak na lalaki o mga lalaking nagmula kay Aser sa talaan ng sensus.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa konteksto ng sensus sa Mga Bilang, ang מִשְׁפָּחָה ay mas malawak kaysa makabagong nukleyar na pamilya at tumutukoy sa pangkat-angkan sa loob ng lipi.
- source_word: לְיִמְנָה / לְיִשְׁוִי / לִבְרִיעָה
  choice: mula kay Imna / mula kay Isvi / mula kay Beria
  rationale: Ang לְ sa paulit-ulit na pormulang pangangkanan ay likas na isinalin bilang pinagmulan ng angkan, hindi bilang direksiyong “patungo sa.”
- source_word: מִשְׁפַּחַת הַיִּמְנָה
  choice: ang angkan ng mga Imnita
  rationale: Ipinahahayag ng anyong gentiliko ang mga kabilang sa angkang nagmula kay Imna; ang hulaping “-ita” ay likas na anyong Filipino para sa ganitong katawagan.
- source_word: מִשְׁפַּחַת הַיִּשְׁוִי
  choice: ang angkan ng mga Isvita
  rationale: Pinananatili ang pangalang Isvi at ginagawang katawagan sa mga kaanib ng angkan sa paraang madaling maunawaan sa Filipino.
- source_word: מִשְׁפַּחַת הַבְּרִיעִי
  choice: ang angkan ng mga Berita
  rationale: Ang katawagang Berita ay kumakatawan sa Hebreong gentiliko na hango sa pangalang Beria, sa halip na ulitin lamang ang pangalan ng ninuno.
