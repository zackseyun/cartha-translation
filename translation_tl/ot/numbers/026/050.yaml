base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/050.yaml
  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: tl
  text: Ito ang mga angkan ni Neftali, ayon sa kani-kanilang angkan,[a] at ang mga nabilang sa kanila[b] ay apatnapu't limang libo at apatnaraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kanilang mga angkan.”
    reason: lexical_alternative
  - marker: b
    text: O “ang bilang ng mga naitala sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na modernong Tagalog na panimulang pormula para sa Hebreong demonstratibong maramihan sa isang talaan.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa konteksto ng sensus ng mga lipi, tumutukoy ito sa malalaking pangkat ng magkakamag-anak, hindi lamang sa sambahayan o nukleyar na pamilya.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinahihiwatig ng prefiks na לְ ang pag-uuri ayon sa mga angkan; malinaw at natural sa Tagalog ang distributibong 'kani-kanilang.'
- source_word: וּפְקֻדֵיהֶם
  choice: ang mga nabilang sa kanila
  rationale: Pinananatili ang pasibong diwa ng פקד sa konteksto ng sensus at hindi tahasang nagdaragdag ng 'mga lalaki,' na wala sa mismong pariralang ito.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: apatnapu't limang libo at apatnaraan
  rationale: Tuwirang paglalahad ng bilang sa likas na ayos ng modernong Tagalog.
