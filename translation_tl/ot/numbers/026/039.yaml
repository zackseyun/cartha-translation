    issue: Ang “Sufam” at “Hufam” ay hindi tapat na transliterasyon ng mga pangalan sa Hebreo.
    rationale: Sa שׁוּפָם, ang שׁ ay mas maayos na “sh” at ang פּ ay /p/; sa חוּפָם, ang פּ ay /p/. Ang paliwanag ng draft na ang “ph” ay isinasalin bilang f ay hindi naaangkop, sapagkat walang digrapong “ph” sa Hebreong anyo at ang פ ay may dagesh, kaya /p/.
  revised_text: Mula kay Shupam[a], ang angkan ng mga Shupamita; mula kay Hupam, ang angkan ng mga Hupamita.
