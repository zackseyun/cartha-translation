  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: tl
  text: Mula kay Shupam[a], ang angkan ng mga Shupamita; mula kay Hupam, ang angkan ng mga Hupamita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Hebreo rito ay Shupam. Sa ilang tradisyon ng teksto at sa mga kaugnay na talaan, makikita ang ibang kaugnay na baybay ng pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: Kay Sufam
  rationale: Sa pormula ng talaangkanan at sensus, ipinakikilala ng לְ ang taong pinagmulan o kinabibilangang pangkat. Likas itong ipahayag sa Filipino sa pamamagitan ng “kay.” Isinulat ang pangalang Hebreo ayon sa karaniwang baybay-Filipino.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa konteksto ng mga lipi ng Israel, ang מִשְׁפָּחָה ay isang pangkat ng magkakamag-anak sa loob ng tribo; mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: הַשּׁוּפָמִי
  choice: mga Sufamita
  rationale: Ang anyong pantukoy sa lahi o pangkat ay kolektibo at tumutukoy sa mga kaangkan ni Sufam. Ang hulaping “-ita” ay natural na paraan sa Filipino ng pagbuo ng pangalan ng pangkat mula sa pangalang pantangi.
- source_word: לְחוּפָם
  choice: kay Hufam
  rationale: Tulad sa unang pangalan, ipinahihiwatig ng לְ ang pinagmulan ng angkan. Isinalin ang tunog na ph bilang f sa baybay-Filipino.
- source_word: הַחוּפָמִי
  choice: mga Hufamita
  rationale: Ang anyong ito ay pangalan ng kolektibong pangkat na nagmula kay Hufam; malinaw itong naipapahayag ng “mga Hufamita.”
