translation_notes:
  register: Gumamit ng maikli at paulit-ulit na pormulang angkop sa talaan ng sensus. Ang “angkan” ay makabago, malinaw, at marangal na katumbas para sa yunit ng magkakamag-anak sa loob ng isang tribo. Ginamit ang mga baybay na Sufam at Hufam upang iangkop sa ponolohiya at ortograpiyang Filipino ang mga pangalang Hebreo.
