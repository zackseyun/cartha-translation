base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: tl
  text: 'Ito ang mga anak[a] ni Gilead: mula kay Iezer, ang angkan ng mga Iezerita; mula kay Helek, ang angkan ng mga Helekita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Gilead” sa Hebreo ay maaari ring tumukoy sa mga lalaking inapo niya o sa mga angkang nagmula sa kaniya, hindi lamang sa mga tuwiran niyang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Ang demonstratibong Hebreo ay walang panahunan; likas sa modernong Filipino ang “Ito ang” bilang panimula sa talaan.
- source_word: בְּנֵי גִלְעָד
  choice: mga anak ni Gilead
  rationale: Pinananatili ang pormal na wikang pangangkanan ng Hebreo, habang nililinaw sa talababa na maaari itong tumukoy sa mga lalaking inapo o mga angkang nagmula sa kaniya.
- source_word: אִיעֶזֶר
  choice: Iezer
  rationale: Isinatinig ang pangalang Hebreo sa halip na isalin ang kahulugan nito.
- source_word: מִשְׁפַּחַת
  choice: ang angkan ng
  rationale: Sa konteksto ng sensus sa Bilang 26, tumutukoy ito sa isang pangkat na salinlahi sa loob ng lipi; mas tiyak ang “angkan” kaysa “pamilya.”
- source_word: הָאִיעֶזְרִי
  choice: mga Iezrita
  rationale: Isinasalin ang pang-uring pangalan ng pangkat bilang tawag sa mga kabilang sa angkang nagmula kay Iezer.
- source_word: לְחֵלֶק
  choice: mula kay Helek
  rationale: Sa paulit-ulit na pormula ng sensus, ipinakikilala ng ל ang ninunong pinagmulan ng kasunod na angkan; natural itong ipahayag sa Filipino bilang “mula kay.”
- source_word: הַחֶלְקִי
  choice: mga Helkita
  rationale: Isinasalin ang pang-uring pangalan ng pangkat bilang tawag sa mga kabilang sa angkang nagmula kay Helek.
theological_decisions:
- issue: Saklaw ng “mga anak ni Gilead”
  choice: Pinanatili sa pangunahing teksto ang “mga anak,” na may paliwanag sa talababa.
  alternative: “mga inapo ni Gilead”
  rationale: Ang בְּנֵי ay literal na “mga anak,” ngunit sa talaang pangangkanan maaari itong tumukoy sa mas malalayong lalaking inapo o sa mga angkang kumakatawan sa kanila. Pinananatili ng salin at talababa ang lawak ng orihinal nang hindi ito tahimik na nilulutas.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “angkan” para sa teknikal na pangkat sa loob ng lipi, at pinanatili ang maikli at paulit-ulit na anyo ng talaang pansensus.
