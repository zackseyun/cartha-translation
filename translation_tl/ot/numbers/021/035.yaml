base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: tl
  text: Kaya't pinabagsak nila siya, ang mga anak niyang lalaki, at ang buong bayan niya, hanggang sa wala nang natirang nakaligtas sa kanya[a]. Pagkatapos, inangkin nila ang kanyang lupain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hanggang sa wala nang natirang isang nakaligtas para sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: O, “sinakop nila ang kanyang lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: pinabagsak
  rationale: Sa konteksto ng digmaan, ang נכה ay tumutukoy sa pananakit o paggapi, na rito ay humantong sa kamatayan. Pinananatili ng “pinabagsak” ang kongkretong lakas ng pandiwa nang hindi ito ginagawang simpleng “pinatay.”
- source_word: בָּנָיו
  choice: mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang בנים; ang salin ay nagpapanatili sa kahulugang “mga anak na lalaki” sa halip na gawing pangkalahatang “mga anak.”
- source_word: כָּל עַמּוֹ
  choice: ang buong bayan niya
  rationale: Ang עַם ay karaniwang “bayan” o “mga mamamayan,” at mas malawak kaysa hukbo lamang. Natural sa Filipino ang “buong bayan niya” para sa lahat ng taong nasa ilalim ng kanyang pamamahala.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: hanggang sa wala silang itinirang kahit isang nakaligtas
  rationale: Ang Hebreo ay literal na may di-tiyak na paksa sa pandiwang “nag-iwan.” Batay sa agarang konteksto, natural na tumutukoy ito sa mga sumalakay. Ipinahahayag ng “kahit isang nakaligtas” ang lubos na pagkalipol nang hindi ginagamit ang “nalabi,” na maaaring magkaroon ng teknikal na teolohikal na dating.
- source_word: שָׂרִיד
  choice: nakaligtas
  rationale: Sa konteksto ng digmaan, malinaw at likas ang “nakaligtas” para sa שָׂרִיד.
- source_word: וַיִּירְשׁוּ
  choice: inangkin
  rationale: Dito ang ירשׁ ay tumutukoy sa pagkuha at paghawak sa teritoryo matapos ang tagumpay. Maikli at natural ang “inangkin,” bagaman maaari ring isaling “sinakop at tinirhan.”
- source_word: אַרְצוֹ
  choice: kanyang lupain
  rationale: Ang אֶרֶץ ay tumutukoy sa teritoryong pinamumunuan ni Og; ang “lupain” ang karaniwan at sapat na malawak na katumbas.
theological_decisions:
- issue: Paksa ng הִשְׁאִיר (“nag-iwan”)
  choice: Isinaling ang di-tiyak na paksa bilang “sila,” na tumutukoy sa mga Israelitang sumalakay.
  alternative: “hanggang sa wala nang natirang nakaligtas sa kanya”
  rationale: Hindi tahasang binanggit sa Hebreo ang paksa ng pandiwa. Ang “sila” ay pinakamalinaw sa daloy ng pangungusap, ngunit inilalagay sa talababa ang alternatibong nagpapanatili sa di-tiyak na kayarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinabagsak” upang mapanatili ang konkretong puwersa ng pandiwang militar; “buong bayan” upang huwag limitahan sa hukbo; at “inangkin” bilang natural na paglalarawan sa pagkuha ng lupain matapos ang tagumpay. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
