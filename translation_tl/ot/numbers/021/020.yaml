base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: tl
  text: At mula sa Bamot ay nagtungo sila sa libis na nasa lupain ng Moab[a], hanggang sa tuktok ng Pisga, na nakatanaw sa ilang na lupain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bukid ng Moab”; maaari rin itong mangahulugang bukas na lupain o teritoryo ng Moab.
    reason: lexical_alternative
  - marker: b
    text: O “Jeshimon,” kung ituturing ang salitang Hebreo bilang pangalan ng rehiyon sa halip na karaniwang katawagan sa isang ilang na lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: at mula sa Bamot
  rationale: Ang בָּמוֹת ay pangalan ng lugar sa talaan ng paglalakbay; ginamit ang anyong “Bamot,” na malapit sa bigkas ng Hebreo, sa halip na isaling “matataas na lugar.”
- source_word: הַגַּיְא
  choice: libis
  rationale: Ang גַּיְא ay tumutukoy sa libis o bangin; “libis” ang natural at sapat na malawak na salin sa kontekstong heograpiko.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: na nasa lupain ng Moab
  rationale: Bagaman literal na “bukid ng Moab,” maaaring tumukoy ang שָׂדֶה sa bukas na lupain o teritoryo; “lupain” ang mas natural sa modernong Tagalog habang inilalagay sa talababa ang literal na larawan.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: tuktok ng Pisga
  rationale: Sa topograpikong gamit, ang רֹאשׁ ay “tuktok.” Itinuring na pangalang pantangi ang Pisga at isinatitik ayon sa bigkas ng Hebreo.
- source_word: וְנִשְׁקָפָה עַל־פְּנֵי
  choice: na nakatanaw sa
  rationale: Inilalarawan ng parirala ang tuktok bilang nakaharap at nakatingin sa ibabaw ng rehiyon; “nakatanaw sa” ang natural na Tagalog na nagpapanatili sa ugnayan nito sa “tuktok ng Pisga.”
- source_word: הַיְשִׁימֹן
  choice: ilang na lupain
  rationale: Ang יְשִׁימוֹן ay maaaring mangahulugang tigang at tiwangwang na rehiyon, ngunit maaari ring gamiting pangalang panrehiyon; pinanatili sa talababa ang alternatibong “Jeshimon.”
