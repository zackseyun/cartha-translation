  naturalness: Natural ang “libis,” “lupain ng Moab,” at “nakatanaw sa.” Mas maayos ang daloy kung “nagtungo sila” ang gamitin at kung ang pangalawang hantungan ay ipakilala sa “hanggang sa.”
