translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Idinagdag ang “ay naglakbay sila patungo” upang natural na maipagpatuloy sa Tagalog ang eliptikong talaan ng mga hintuan mula sa naunang talata. Ginamit ang “Bamot” at “Pisga” bilang mga anyong malapit sa bigkas ng Hebreo.
