  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנ֖וּ בְּ/אֹבֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/010.yaml
  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: tl
  text: Pagkatapos, naglakbay ang mga Israelita at nagkampo sa Obot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: naglakbay
  rationale: Sa talaan ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis ng kampo at pagpapatuloy sa susunod na himpilan. Likas at malinaw sa modernong Filipino ang “naglakbay.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” isa itong karaniwang kolektibong katawagan sa bayan ng Israel. Ang “mga Israelita” ang natural, tumpak, at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Ang חנה ang karaniwang pandiwa para sa pagtigil at pagtatayo ng kampo sa mga salaysay ng paglalakbay sa ilang. Ang “nagkampo” ay malinaw at kasalukuyang gamit.
- source_word: בְּאֹבֹת
  choice: sa Obot
  rationale: Pangalan ito ng lugar at isinalin sa anyong transliterado. Ang pang-ukol na “sa” ay natural kasama ng “nagkampo.”
- source_word: וַ
  choice: Pagkatapos
  rationale: Ang unang waw na kasunod ng pandiwa ay nagsusulong sa pagkakasunod-sunod ng salaysay; malinaw itong ipinahahayag ng “Pagkatapos.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at natural. Ginamit ang karaniwang etnikong katawagang “mga Israelita” sa halip na ang di-likas na literal na “mga anak na lalaki ni Israel.”
