id: NUM.21.6
reference: Numbers 21:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: tl
  text: Kaya nagpadala si Yahweh sa gitna ng mga tao ng maaapoy na ahas[a]. Tinuklaw ng mga ito ang mga tao, at maraming Israelita ang namatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makamandag na mga ahas” o “mga ahas na nagdudulot ng nag-aapoy na hapdi.” Sa Hebreo, literal na “ang mga ahas, ang maaapoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: nagpadala
  rationale: Karaniwang salaysay na kahulugan ng שׁלח ang “magpadala”; tuwiran ito at natural sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בָּעָם
  choice: sa gitna ng mga tao
  rationale: 'Inihahayag nito ang lokatibong diwa ng ב: doon sa kalipunan ng bayan ipinadala ang mga ahas, nang hindi dinaragdagan ng interpretasyong “laban sa.”'
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: maaapoy na ahas
  rationale: Pinananatili ng “maaapoy” ang larawang Hebreo at ang posibleng diwa ng nagdudulot ng matinding hapdi, sa halip na ipako lamang ang kahulugan sa “makamandag.”
- source_word: וַיְנַשְּׁכוּ
  choice: tinuklaw
  rationale: Sa natural na Filipino, “tinuklaw” ang karaniwang pandiwa para sa pagkagat ng ahas at tumpak na naghahatid sa נשׁך sa kontekstong ito.
- source_word: וַיָּמָת
  choice: namatay
  rationale: Tuwiran at di-interpretibong katumbas ng karaniwang pandiwang Hebreo para sa pagkamatay.
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: maraming Israelita
  rationale: Natural na Filipino para sa “marami mula sa Israel,” habang malinaw na ang namatay ay marami sa bayang Israel.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang Tetragrammaton sa pinagmulan; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng הַשְּׂרָפִים bilang panuring sa mga ahas
  choice: maaapoy na ahas
  alternative: makamandag na ahas; nag-aapoy na ahas
  rationale: Pinananatili nito ang tunay na leksikal na kalabuan at masiglang larawan ng Hebreo; ipinapaliwanag sa talababa ang posibleng pagtukoy sa kamandag o sa nag-aapoy na hapdi ng tuklaw.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tinuklaw” bilang likas na pandiwa para sa pagkagat ng ahas, at “maraming Israelita” upang maiwasan ang alanganing literalismong “marami mula sa Israel.”
