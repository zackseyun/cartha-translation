base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: tl
  text: Pagkatapos, nanata ang Israel sa PANGINOON at sinabi, “Kung talagang[a] ibibigay mo sa aking kamay ang bayang ito, ilalaan ko sa paglipol ang kanilang mga lungsod.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “Kung tiyak na ibibigay mo.” Inuulit sa Hebreo ang diwa ng pandiwang “ibigay” upang bigyang-diin ito.'
    reason: lexical_alternative
  - marker: b
    text: O, “lubusan kong wawasakin ang kanilang mga lungsod.” Ang pandiwang Hebreo ay tumutukoy sa di-mababawing paglalaan ng isang bagay sa paglipol bilang ḥerem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: nanata
  rationale: Ang magkaugnay na pandiwa at pangngalan sa Hebreo ay isang idyomang nangangahulugang gumawa ng taimtim na pangako; natural at sapat na pormal sa Tagalog ang “nanata.”
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ginamit ang nakaugaliang anyong “PANGINOON” para sa pangalang tipan na יהוה, na minarkahan sa malalaking titik upang maiba sa karaniwang titulong “Panginoon.”
- source_word: אִם נָתֹן תִּתֵּן
  choice: Kung talagang ibibigay mo
  rationale: Pinatitindi ng infinitive absolute na נָתֹן ang pandiwang תִּתֵּן; malinaw at natural na naihahatid ng “talagang” ang diin.
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang עָם ay kolektibong tumutukoy sa isang bayan o pangkat ng mga tao; ang “bayang ito” ay natural sa modernong Tagalog at pinananatili ang isahang kolektibong diwa.
- source_word: בְּיָדִי
  choice: sa aking kamay
  rationale: Pinanatili ang konkretong larawang Hebreo ng pagkakaloob sa kamay ng isang tao, na sa konteksto ay nangangahulugang pagpapasailalim sa kaniyang kapangyarihan.
- source_word: וְהַחֲרַמְתִּי
  choice: ilalaan ko sa paglipol
  rationale: Ang Hiphil ng חרם ay hindi lamang karaniwang pagwasak kundi di-mababawing paglalaan sa paglipol; pinananatili ng salin ang ritwal at pandigmaang bigat ng salita nang hindi nagiging teknikal.
- source_word: עָרֵיהֶם
  choice: ang kanilang mga lungsod
  rationale: Direktang katumbas ng עָרִים ang “mga lungsod” at angkop ito sa konteksto ng pananakop.
theological_decisions:
- issue: Kahulugan ng חרם sa isang panata sa digmaan
  choice: ilalaan ko sa paglipol ang kanilang mga lungsod
  alternative: lubusan kong wawasakin ang kanilang mga lungsod; ipapasailalim ko sa pagbabawal ang kanilang mga lungsod
  rationale: Ipinahahayag ng חרם ang pormal at di-mababawing paglalaan ng nasakop sa paglipol, hindi lamang ang pangkalahatang ideya ng pagkawasak. Pinananatili ng napiling anyo ang ritwal at pandigmaang tensiyon ng teksto nang walang idinaragdag na paliwanag na doktrinal o etikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang biblikal na larawang “sa aking kamay,” samantalang ipinaliwanag sa talababa ang mas teknikal na diin ng Hebreong ḥerem. Ang mga panandang talababa ay inilagay mismo sa mga pariralang kanilang nililinaw.
