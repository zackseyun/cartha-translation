  terminology: Wastong pinanatili ang “Yahweh” para sa יהוה, “Moises” para sa משה, at ang payak na “nanalangin ... para sa mga tao” para sa pananalanging pamamagitan. Walang idinagdag na interpretasyong teolohikal.
