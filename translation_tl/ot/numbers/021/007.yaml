  source_fidelity: Tapat ang salin sa Hebreo. Naipapahayag ng “lumapit,” “Nagkasala kami,” “nagsalita ... laban,” utos na manalangin kay Yahweh, at “alisin niya sa amin ang ahas” ang daloy at mga pangunahing ugnayang panggramatika ng talata. Napananatili ng pang-isahang “ahas” ang anyong Hebreo nang hindi isinasara ang posibleng kolektibong kahulugan.
