language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹא֩ הָ/עָ֨ם אֶל מֹשֶׁ֜ה וַ/יֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי דִבַּ֤רְנוּ בַֽ/יהוָה֙ וָ/בָ֔/ךְ הִתְפַּלֵּל֙ אֶל יְהוָ֔ה וְ/יָסֵ֥ר מֵ/עָלֵ֖י/נוּ אֶת הַ/נָּחָ֑שׁ וַ/יִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: tl
  text: Kaya lumapit ang mga tao kay Moises at sinabi, “Nagkasala kami, sapagkat nagsalita kami laban kay Yahweh at laban sa iyo. Manalangin ka kay Yahweh upang alisin niya sa amin ang ahas[a].” Kaya nanalangin si Moises para sa mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ahas.” Pang-isahan ang pangngalang Hebreo at maaaring kumatawan nang kolektibo sa salot ng mga ahas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: Kaya lumapit ang mga tao
  rationale: Isinusulong ng waw-consecutive ang salaysay, kaya natural ang “Kaya.” Ang הָעָם ay kolektibong tumutukoy sa mga tao; ang “lumapit” ay angkop sa pagpunta nila kay Moises.
- source_word: חָטָאנוּ
  choice: Nagkasala kami
  rationale: Tuwirang pagpapahayag ito ng pag-amin sa natapos na kasalanang kinikilala pa rin nila sa kasalukuyan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng kanilang pag-amin.
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: nagsalita kami laban kay Yahweh at laban sa iyo
  rationale: Ang דִבֵּר na may בְּ ay may diwang mapanlabang pagsasalita rito. Inulit ang “laban” upang malinaw na kapuwa si Yahweh at si Moises ang pinagsalitaan nila.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: Manalangin ka kay Yahweh
  rationale: Natural at tuwirang salin ito ng utos na manalangin; ipinahihiwatig ng konteksto na mamamagitan si Moises para sa bayan.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: upang alisin niya sa amin
  rationale: Kasunod ng utos na manalangin, ipinapahayag ng anyong pandiwa ang hinihiling na maging bunga ng panalangin.
- source_word: אֶת הַנָּחָשׁ
  choice: ang ahas[a]
  rationale: Pang-isahan ang pangngalang Hebreo, kaya pinanatili ang “ahas,” ngunit maaari itong kumatawan nang kolektibo sa salot ng mga ahas; nilinaw ito sa talababa nang hindi inaalis ang ambiguwidad sa pangunahing teksto.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: Kaya nanalangin si Moises para sa mga tao
  rationale: Ang בְּעַד ay nagpapahayag ng pananalangin alang-alang sa iba. Ang “nanalangin ... para sa” ay malinaw at karaniwan sa modernong Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Diwa ng pananalangin ni Moises
  choice: nanalangin ... para sa mga tao
  alternative: namagitan ... para sa mga tao
  rationale: Ipinahihiwatig ng בְּעַד ang pamamagitan, ngunit ang mas natural na “nanalangin para sa” ay sapat na nagpapanatili sa diwa nang hindi nagdaragdag ng teknikal na teolohikong termino.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinili ang “mga tao” bilang natural na katumbas ng kolektibong הָעָם, at pinanatili ang pang-isahang “ahas” sa pangunahing teksto upang tumugma sa anyong Hebreo habang inilalahad sa talababa ang posibleng kolektibong kahulugan.
