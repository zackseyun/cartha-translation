base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Gumawa ka ng isang maapoy na ahas[a] at ilagay mo ito sa isang poste[b]. Ang sinumang makagat at tumingin sa ahas na iyon ay mabubuhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “seraf” o “nagniningas na nilalang”; ang salitang Hebreo ay maaaring mangahulugang “nagniningas,” at sa kontekstong ito ay tumutukoy sa nakamamatay na ahas.
    reason: lexical_alternative
  - marker: b
    text: O “pananda” o “posteng pananda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos ayon sa Hebreong teksto at sa pamantayan ng proyekto.
- source_word: עֲשֵׂה לְךָ
  choice: Gumawa ka para sa iyo
  rationale: Isinasalin ang pautos kasama ang datibong panghalip, nang hindi dinaragdagan ang tiyak na layunin o pakinabang nito.
- source_word: שָׂרָף
  choice: maapoy na ahas
  rationale: Pinananatili ang larawang kaugnay ng salitang nangangahulugang ‘nagniningas’ o ‘maapoy,’ habang nililinaw mula sa konteksto na ahas ang tinutukoy; hindi nito tahasang nilulutas kung ang paglalarawan ay tumutukoy sa kamandag, hapdi ng kagat, o ibang katangian.
- source_word: נֵס
  choice: poste
  rationale: Sa konteksto, ito ang patayong bagay na pagtatayuan o pagsasabitan ng anyong ahas. Natural at malinaw ang ‘poste,’ habang inilalagay sa talababa ang mas malawak na diwang ‘pananda.’
- source_word: הַנָּשׁוּךְ
  choice: sinumang makagat
  rationale: Ipinapahayag nang natural sa Tagalog ang pangkalahatang gamit ng Hebreong pasibong participle.
- source_word: וְרָאָה אֹתוֹ
  choice: at tumingin doon
  rationale: Ang ‘tumingin’ ay angkop sa sadyang pagharap ng paningin sa bagay; ang ‘doon’ ay likas na tumutukoy sa maapoy na ahas na nakalagay sa poste.
- source_word: וָחָי
  choice: ay mabubuhay
  rationale: Tuwirang ipinapahayag ang resultang ipinangako sa Hebreo, nang hindi tinutukoy kung ito ay paggaling o pananatiling buhay lamang.
theological_decisions:
- issue: Kahulugan at larawan ng שָׂרָף
  choice: maapoy na ahas
  alternative: serapin; makamandag na ahas; nagniningas na nilalang
  rationale: Sa salaysay, isang anyong ahas ang ipinagagawa bilang tugon sa salot ng mga ahas. Pinananatili ng ‘maapoy na ahas’ ang leksikal na larawan at iniiwasang ipasok ang mala-anghel na pakahulugan ng ‘serapin’ o lubusang ipalit ang interpretasyong ‘makamandag.’
- issue: Ugnayan ng pagtingin at pagkabuhay
  choice: Ang sinumang makagat at tumingin doon ay mabubuhay
  alternative: Ang sinumang makagat, kapag tumingin doon, ay mabubuhay
  rationale: Pinananatili ang magkakasunod na Hebreong sugnay at malinaw pa rin na ang pagtingin ang kalagayang nauuna sa pagkabuhay, nang hindi nagpapaliwanag ng mekanismo o teolohikal na kabuluhan nito.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘maapoy’ upang mapanatili ang Hebreong larawan nang hindi gawing teknikal o sobrang interpretatibo; ang mga alternatibong kahulugan ay nasa mga talababa, at lahat ng marker ay nasa mismong teksto.
