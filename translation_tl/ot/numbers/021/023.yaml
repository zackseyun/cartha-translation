  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: tl
  text: Ngunit hindi pinahintulutan ni Sihon ang Israel na dumaan sa kanyang nasasakupan.[a] Kaya tinipon ni Sihon ang lahat ng kanyang mga tao[b] at lumabas patungo sa ilang upang salubungin ang Israel. Dumating siya sa Yahaz[c] at nakipaglaban sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa loob ng kanyang hangganan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lahat ng kanyang mga tao.” Hindi tahasang sinasabi ng teksto na “kanyang hukbo,” bagaman ipinahihiwatig ng kontekstong militar na may sandatahang puwersang kasama.
    reason: lexical_alternative
  - marker: c
    text: Ang Yahaz ay tinatawag ding “Yahza” sa ilang salin; ang hulaping -ah sa anyong Hebreo rito ay nagpapahiwatig ng direksiyon patungo sa lugar.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַן ... עֲבֹר
  choice: pinahintulutan ... na dumaan
  rationale: Sa konstruksiyong ito, ang literal na “nagbigay” ay may idyomatikong diwang pagbibigay ng pahintulot; natural at tumpak sa Filipino ang “pinahintulutan ... na dumaan.”
- source_word: בִּגְבֻלוֹ
  choice: sa kanyang nasasakupan
  rationale: Maaaring tumukoy ang גְּבוּל sa hangganan o sa teritoryong saklaw nito. Ipinahihiwatig ng konteksto ang pagdaan sa lupain ni Sihon, kaya malinaw ang “nasasakupan” habang inilalagay sa talababa ang mas literal na alternatibo.
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: tinipon ... ang lahat ng kanyang mga tao
  rationale: Pinananatili nito ang mismong “lahat ng kanyang mga tao” sa Hebreo at hindi tahasang ginagawang “hukbo,” kahit militar ang konteksto.
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: upang salubungin ang Israel
  rationale: Ang parirala ay literal na tumutukoy sa paglabas upang makatagpo o sumalubong. Hindi muna idinagdag ang tahasang diwang “lusubin,” sapagkat ang pakikipaglaban ay sinasabi sa hulihan ng talata.
- source_word: הַמִּדְבָּרָה
  choice: patungo sa ilang
  rationale: Ipinahahayag ng hulaping pandireksiyon ang pagkilos patungo sa ilang; ang “patungo sa ilang” ay malinaw at malapit sa anyong Hebreo.
- source_word: יָהְצָה
  choice: Yahaz
  rationale: Ang pangalan ng lugar ay Yahaz; ang hulaping -ah sa anyong ito ng Hebreo ay nagpapahiwatig ng direksiyon at hindi kailangang isama sa pangunahing anyo ng pangalan.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: nakipaglaban sa Israel
  rationale: Natural itong Filipino para sa tahasang pakikipagdigma laban sa Israel, nang hindi nagpapasok ng detalye na wala sa teksto.
- source_word: וְלֹא
  choice: Ngunit hindi
  rationale: Ipinakikita ng “ngunit” ang pagsalungat ni Sihon sa naunang kahilingan ng Israel at natural nitong naihahatid ang takbo ng salaysay.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit sa pangalan ni Sihon at ang “lahat ng kanyang mga tao” upang hindi gawing mas tiyak kaysa sa Hebreo ang puwersang tinipon niya. Ginamit ang “ilang” para sa מִדְבָּר at “Yahaz” bilang source-oriented na transliterasyon.
