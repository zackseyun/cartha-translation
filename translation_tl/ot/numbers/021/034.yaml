  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Huwag kang matakot sa kanya[a], sapagkat ibinigay ko na siya sa iyong kamay[b], kasama ang lahat ng kanyang mamamayan at ang kanyang lupain. Gagawin mo sa kanya ang ginawa mo kay Sihon na hari ng mga Amorita, na nanirahan sa Hesbon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag kang mangamba sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ibinigay sa iyong kamay” ay isang idyomang Hebreo na nangangahulugang “ipinasailalim sa iyong kapangyarihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Huwag kang matakot sa kanya
  rationale: Likas at malinaw na makabagong Tagalog para sa tuwirang pagbabawal na matakot kay Og.
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: ibinigay ko na siya sa iyong kamay
  rationale: Pinananatili ang larawan ng Hebreong idyoma at ipinahahayag ng “na” ang katiyakan o pagiging ganap ng kilos mula sa pananaw ng nagsasalita.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: kasama ang lahat ng kanyang mamamayan at ang kanyang lupain
  rationale: Malinaw na pinananatili ang tatlong ipinagkaloob—si Og, ang kanyang buong bayan, at ang kanyang lupain—nang hindi ginagawang militar lamang ang עַם.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Gagawin mo sa kanya ang ginawa mo
  rationale: Pinananatili ang tuwirang paghahambing sa ginawa noon kay Sihon at ang puwersang panghinaharap ng pahayag.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: kay Sihon na hari ng mga Amorita
  rationale: Malapit sa Hebreong pariralang titulo at natural sa Tagalog.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: na nanirahan sa Hesbon
  rationale: Ang participle na יוֹשֵׁב ay tumutukoy sa paninirahan; ang “nanirahan” ay malinaw at kasalukuyang gamit sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Nasa talata mismo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan nang hindi ito ginagawang pangkalahatang titulo.
- issue: Ganap na anyo ng נָתַתִּי sa pangako ng Diyos
  choice: ibinigay ko na
  alternative: ibibigay ko
  rationale: Pinananatili ang anyong ganap at ang katiyakan ng pahayag, sa halip na tahimik itong gawing payak na panghinaharap.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang Hebreong larawan ng “kamay,” ngunit ipinaliwanag ito sa talababa upang maiwasan ang kalabuan. Ang mga panandang [a] at [b] ay inilagay mismo sa mga pariralang tinutukoy ng mga talababa.
