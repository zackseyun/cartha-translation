    issue: Hindi likas at malabo ang sugnay na “na tungkol dito'y sinabi ni Yahweh kay Moises.”
    rationale: Ang אֲשֶׁר ay nag-uugnay sa “balon” at sa banal na pahayag. Ang “tungkol dito'y sinabi” ay hindi karaniwang Tagalog at maaaring magmukhang ang balon mismo ang paksa ng buong pahayag sa paraang hindi maayos ang pagkakabuo. Ang “na tinukoy ni Yahweh nang sabihin niya kay Moises” ay malinaw at pinananatili ang ugnayang ito.
