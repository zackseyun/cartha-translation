base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: tl
  text: At mula roon ay pumunta sila sa Beer.[a] Ito ang balon na tinukoy ni Yahweh nang sabihin niya kay Moises, “Tipunin mo ang bayan, at bibigyan ko sila ng tubig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Beer ay pangalan ng lugar; sa Hebreo, katunog ito ng salitang nangangahulugang “balon.”
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: At mula roon
  rationale: Pinananatili ng “At” ang pagpapatuloy ng salaysay, habang natural na isinasalin ng “mula roon” ang pinagsamang pang-ukol at pang-abay.
- source_word: בְּאֵרָה
  choice: pumunta sila sa Beer
  rationale: Ang Beer ay pangalang-pook; ipinahihiwatig ng hulaping patungo ang kilos papunta roon. Dahil walang tahasang pandiwa sa Hebreo, idinagdag ang “pumunta sila” upang maging natural at malinaw sa Tagalog.
- source_word: הִוא הַבְּאֵר
  choice: Ito ang balon
  rationale: Isang sugnay itong nagpapakilala kung aling balon ang tinutukoy at nagpapaliwanag sa kahalagahan ng lugar.
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: na tungkol dito'y sinabi ni Yahweh kay Moises
  rationale: Pinananatili nito ang ugnayan ng balon sa sumunod na sinabi ni Yahweh nang hindi ginagawang bagay na tuwirang “sinabi” ang balon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: אֱסֹף אֶת הָעָם
  choice: Tipunin mo ang bayan
  rationale: Ang “tipunin” ay malinaw na pautos kay Moises; ang “bayan” ay natural na kolektibong tawag sa Israel sa kontekstong ito.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: at bibigyan ko sila ng tubig
  rationale: Ang cohortative kasunod ng pautos ay nagpapahayag ng layunin o matibay na pasiya; natural itong naipapahayag sa Tagalog bilang pangako sa hinaharap.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Diwa ng cohortative na וְאֶתְּנָה
  choice: at bibigyan ko sila ng tubig
  alternative: upang mabigyan ko sila ng tubig
  rationale: Maaaring magpahiwatig ang anyo ng layunin o pasiya. Pinili ang natural na pangakong “bibigyan ko” nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “bayan” para sa kolektibong Israel at pinanatili ang pangalang Yahweh. Ang pinaikling “dito'y” ay nagbibigay ng maayos at dignified na daloy nang hindi nilulutas nang labis ang bahagyang siksik na ugnayang sintaktiko ng Hebreo.
