source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב֙ יִשְׂרָאֵ֔ל בְּ/אֶ֖רֶץ הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/031.yaml
  text: So Israel lived in the land of the Amorites[a].
translation:
  language: tl
  text: Kaya nanirahan ang Israel sa lupain ng mga Amoreo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Kaya tumira ang Israel sa lupain ng mga Amoreo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Ang יָשַׁב ay maaaring mangahulugang ‘umupo,’ ‘manirahan,’ o ‘tumira.’ Sa buod na ito ng salaysay, natural na ipinahahayag ng “nanirahan” na tumira ang Israel sa nasabing lupain, nang hindi labis na idinidiin ang pagiging permanente gaya ng maaaring ipahiwatig ng “nanatili” o “namalagi.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong Filipino bilang tawag sa bayang Israel.
- source_word: בְּאֶרֶץ
  choice: sa lupain
  rationale: Ang אֶרֶץ ay maaaring tumukoy sa lupa, lupain, bansa, o teritoryo. Dito, tumutukoy ito sa nasasakupang lugar ng mga Amoreo, kaya malinaw at likas ang “sa lupain.”
- source_word: הָאֱמֹרִי
  choice: ng mga Amoreo
  rationale: Bagaman anyong isahan ang gentiliko sa Hebreo, kolektibo itong tumutukoy sa sambayanang Amoreo. Ang “mga Amoreo” ang likas na anyo sa Filipino kapag tinutukoy ang pangkat ng mga tao at ang kanilang lupain.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Pinanatili ang maikling anyo ng talata at ang pang-ugnay na “Kaya” para sa Hebreong וַ־ bilang pagpapatuloy at bunga ng naunang salaysay.
