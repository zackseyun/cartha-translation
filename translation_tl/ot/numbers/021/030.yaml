  text: וַ/נִּירָ֛/ם אָבַ֥ד חֶשְׁבּ֖וֹן עַד דִּיב֑וֹן וַ/נַּשִּׁ֣ים עַד נֹ֔פַח אֲשֶׁ֖רׄ עַד מֵֽידְבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: tl
  text: At pinana natin sila[a]; napuksa ang Hesbon hanggang sa Dibon. At nagwasak tayo hanggang sa Nofa[b], na umaabot hanggang Medeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang Hebreo sa pambungad na sugnay. Maaari rin itong unawain na “at ginapi natin sila” o “at napuksa ang kanilang paghahari.”
    reason: textual_variant
  - marker: b
    text: Hindi rin tiyak ang sugnay na isinaling “nagwasak tayo.” May ibang pagbasa sa anyong Hebreo, ngunit sa awit ng tagumpay na ito, mas angkop ang pagkaunawa rito bilang pandiwang nagsasaad ng pagwasak.
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: At pinana natin sila
  rationale: Ang anyo ng salitang Hebreo ay napakahirap tiyakin. Ang saling ito ay sumusunod sa posibleng kaugnayan nito sa pandiwang tumutukoy sa pagpana o pagpapana at nagpapanatili sa masiglang larawang pandigma ng awit.
- source_word: אָבַד
  choice: napuksa
  rationale: Ipinahahayag ng pandiwa ang pagkapahamak o pagkawasak; ang “napuksa” ay natural sa Filipino at angkop sa himig ng awit ng tagumpay.
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Pangalan ng lugar, na isinalin sa karaniwang anyong Filipino.
- source_word: עַד דִּיבוֹן
  choice: hanggang sa Dibon
  rationale: Ang עַד ay nagsasaad ng hangganan o lawak; malinaw itong naipahahayag ng “hanggang sa.”
- source_word: וַנַּשִּׁים
  choice: Winasak natin ang lupain
  rationale: Hindi tiyak ang anyong Hebreo, ngunit sa konteksto ng sunod-sunod na pananakop, malamang na pandiwang nagsasaad ng pagwasak. Idinagdag ang “ang lupain” bilang likas na layon sa Filipino, nang hindi tinutukoy ang isang bagong pangalang wala sa teksto.
- source_word: עַד נֹפַח
  choice: hanggang sa Nofa
  rationale: Nagsasaad ang עַד ng lawak, at ang Nofa ay pangalan ng lugar.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: na umaabot sa Medeba
  rationale: Pinananatili ang sugnay na pang-ugnay at ang heograpikong diwa ng pag-abot hanggang Medeba.
- source_word: מֵידְבָא
  choice: Medeba
  rationale: Pangalan ng lugar, na tinumbasan ayon sa karaniwang transliterasyon sa Filipino.
