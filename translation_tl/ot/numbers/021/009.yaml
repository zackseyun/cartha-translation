  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: tl
  text: 'At gumawa si Moises ng ahas na bronse[a] at inilagay niya iyon sa isang poste[b]. At nangyari: kapag kinagat ng ahas ang isang tao[c] at tumingin siya sa ahas na bronse, nabuhay siya[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ahas na tanso.” Ang salitang Hebreo para sa metal ay maaaring tumukoy sa tanso o bronse.
    reason: lexical_alternative
  - marker: b
    text: O “estandarte” o “bandila.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “isang lalaki,” na ginagamit dito bilang kinatawan ng sinumang taong nakagat.
    reason: lexical_alternative
  - marker: d
    text: Ihambing ang Juan 3:14–15, na tumutukoy sa pangyayaring ito.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: ahas
  rationale: Ang “ahas” ang karaniwan at dignified na salin sa modernong Filipino; malinaw rin nitong inilalarawan kapuwa ang kumakagat na hayop at ang ginawang larawan nito.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Pinili ang “bronse” bilang karaniwang tawag sa metal sa kontekstong biblikal, habang kinikilala sa talababa na maaari ring tumukoy ang Hebreo sa tanso.
- source_word: הַנֵּס
  choice: poste
  rationale: Sa kontekstong ito, ang tinutukoy ay ang patayong bagay na pinaglagyan ng tansong ahas. Ang “poste” ay mas malinaw sa karaniwang mambabasa kaysa “bandila” o “estandarte.”
- source_word: וְהָיָה
  choice: At ganito ang nangyari
  rationale: Natural itong panandang pasalaysay sa Filipino at ipinakikilala nito ang paulit-ulit na kalagayang sumunod.
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: kapag kinagat ng ahas ang isang tao
  rationale: Ang “kapag” ay angkop sa paulit-ulit na kondisyong inilalarawan. Ang “isang tao” ay likas na kumakatawan sa sinumang nakagat at hindi nagpapasok ng kasariang hindi kailangang idiin sa Filipino.
- source_word: וְהִבִּיט אֶל
  choice: at tumingin siya sa
  rationale: Tuwiran at neutral ang “tumingin sa”; hindi nito paunang ipinapasok sa teksto ang mas malalim na tipolohikal na kahulugan na makikita sa Juan 3.
- source_word: וָחָי
  choice: nabubuhay siya
  rationale: Ipinahahayag nito ang resulta sa loob ng paulit-ulit na kondisyong sinimulan ng “kapag.” Hindi ginamit ang “gumagaling” o “nakaliligtas” sapagkat higit na interpretatibo ang mga iyon.
theological_decisions:
- issue: Kinatawang gamit ng panlalaking anyong אִישׁ
  choice: isang tao
  alternative: isang lalaki
  rationale: Bagaman maaaring mangahulugang “lalaki” ang אִישׁ, ginagamit ito rito bilang kinatawan ng sinumang nakagat. Likas na naipahahayag ng “tao” ang pangkalahatang saklaw nang hindi binabago ang diwa.
- issue: Posibleng tipolohikal na pagpapakahulugan sa “tumingin”
  choice: tumingin sa
  alternative: tumingin nang may pananampalataya sa
  rationale: Hindi tahasang binabanggit ng Hebreong talata ang pananampalataya bilang paraan ng pagtingin. Pinananatiling payak ang pangunahing teksto, samantalang inilalagay sa talababa ang kaugnayan sa Juan 3:14–15.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural sa karaniwang mambabasa. Pinanatili ang maikling anyong pasalaysay at ang kondisyong paulit-ulit, habang iniwasang ipasok sa pangunahing teksto ang tipolohikal na kahulugang tahasang lumilitaw lamang sa kalaunang sipi.
