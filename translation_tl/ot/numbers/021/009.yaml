  verdict: revise
  source_fidelity: 'Maingat na naisalin ang mga pangunahing salita: נְחַשׁ bilang “ahas,” נְחֹשֶׁת bilang “bronse,” at הַנֵּס bilang “poste.” Gayunman, ang “nabubuhay siya” ay pangkasalukuyan at maaaring magpahiwatig ng nagpapatuloy na kalagayan, samantalang ang וָחָי ay resulta sa nakaraang salaysay (“nabuhay siya”). Ang “Kaya” ay nagdaragdag ng hayag na ugnayang sanhi na wala sa mismong talata; ang simpleng “At” ay mas malapit sa waw ng Hebreo.'
  naturalness: 'Malinaw at modernong Filipino ang draft. Mas natural at tumpak sa anyong pasalaysay ang “At nangyari: kapag ... nabuhay siya,” kaysa sa kasalukuyang “nabubuhay siya.”'
  terminology: Ang “ahas na bronse” at “poste” ay angkop. Pinananatili ang “isang tao” sa pangunahing teksto bilang likas na kinatawang gamit sa Filipino, habang ipinapaliwanag ng talababa ang anyong panlalaki ng Hebreo. Inilipat ang talababa para sa Juan 3:14–15 sa wakas ng pangyayari, dahil ang reperensiya ay tungkol sa buong pangyayari at hindi lamang sa pariralang “ahas na bronse.”
  issues:
