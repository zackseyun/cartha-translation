    issue: Ang “nabubuhay siya” ay hindi tumutugma sa aspektong resulta ng וָחָי.
    rationale: Ang Hebreo ay nagsasaad na ang taong tumingin ay nabuhay; ang kasalukuyang anyong Filipino ay maaaring magpahiwatig ng patuloy o paulit-ulit na pagbuhay.
  - severity: low
    issue: Ang “Kaya” ay mas malakas na pang-ugnay kaysa sa simpleng waw sa simula ng talata.
    rationale: Bagaman maaaring maunawaan mula sa naunang konteksto ang sanhi, hindi ito kailangang ipasok sa mismong salin ng talata.
  - severity: low
