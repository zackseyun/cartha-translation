  text: וַ/יִּשְׁלַ֤ח מֹשֶׁה֙ לְ/רַגֵּ֣ל אֶת יַעְזֵ֔ר וַֽ/יִּלְכְּד֖וּ בְּנֹתֶ֑י/הָ ו/יירש אֶת הָ/אֱמֹרִ֥י אֲשֶׁר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: tl
  text: Pagkatapos, nagsugo si Moises ng mga tao upang manmanan ang Jazer. Sinakop nila ang mga karatig na pamayanan nito[a] at inagawan nila ng lupain ang mga Amoreo na naroon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak na babae nito,” isang idyomang Hebreo para sa mga nakadependeng pamayanan o nayon ng isang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Likas at marangal na salin ng pandiwang nagsasaad na nagpadala si Moises ng mga tao para sa isang tiyak na tungkulin.
- source_word: לְרַגֵּל
  choice: upang manmanan
  rationale: Ipinahahayag ang lihim o militar na pagsisiyasat sa isang lugar, gaya ng gamit ng רגל sa kontekstong ito.
- source_word: יַעְזֵר
  choice: Jazer
  rationale: Ginamit ang karaniwang anyo ng pangalang-pook na ibinigay sa konsultasyong teksto.
- source_word: וַיִּלְכְּדוּ
  choice: Sinakop nila
  rationale: Ang לכד sa salaysay ng digmaan ay tumutukoy sa pagkuha o pagsakop sa mga pamayanan.
- source_word: בְּנֹתֶיהָ
  choice: ang mga nayong sakop nito
  rationale: Literal itong 'mga anak na babae nito,' ngunit isang heograpikong idyoma para sa mga nakapailalim o umaasang pamayanan ng isang lungsod; malinaw sa modernong Tagalog ang 'mga nayong sakop nito.'
- source_word: וַיִּירַשׁ
  choice: pinalayas
  rationale: Sa konteksto ng pananakop, ang ירש ay maaaring tumukoy sa pag-aalis sa dating naninirahan upang ang lupain ay mapasakamay ng mananakop. Ang 'pinalayas' ay tuwirang naghahayag ng dispossession nang hindi nagdaragdag ng hindi tahasang detalye.
- source_word: הָאֱמֹרִי
  choice: ang mga Amoreo
  rationale: Ang kolektibong isahan sa Hebreo ay natural na isinalin bilang maramihang katawagan sa pangkat etniko sa Tagalog.
- source_word: אֲשֶׁר שָׁם
  choice: na naroon
  rationale: Maikli at natural na tumutukoy sa mga Amoreong nasa lugar na iyon.
