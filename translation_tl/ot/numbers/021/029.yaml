base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: tl
  text: 'Sa aba mo, Moab!


    Napahamak ka, bayan ni Kemos!


    Ibinigay niya ang kanyang mga anak na lalaki bilang mga takas


    at ang kanyang mga anak na babae bilang mga bihag kay Sihon,


    hari ng mga Amoreo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: Sa aba mo
  rationale: Likas at marangal na pananalitang Filipino para sa malakas na sigaw ng kapahamakan o panaghoy; pinananatili nito ang puwersa ng tulang panunuya.
- source_word: אָבַדְתָּ
  choice: Napahamak ka
  rationale: Ipinapahayag ang ganap at malubhang pagbagsak ng Moab nang hindi nililimitahan ang kahulugan sa literal na pagkalipol.
- source_word: עַם כְּמוֹשׁ
  choice: bayan ni Kemos
  rationale: Natural na construct expression sa Filipino para sa bayang kinikilala o nauugnay kay Kemos, ang diyos ng Moab.
- source_word: נָתַן
  choice: Ginawa niyang
  rationale: 'Bagaman karaniwang nangangahulugang “nagbigay,” dito ay sinusundan ang pandiwa ng mga katagang nagsasaad ng naging kalagayan: mga takas at mga bihag. Ang “ginawa niyang” ay malinaw na naghahatid ng resultang ito.'
- source_word: בָּנָיו פְּלֵיטִם
  choice: mga takas ang kanyang mga anak na lalaki
  rationale: Ang פְּלֵיטִם ay mga taong nakatakas o napilitang tumakas; pinananatili rin ang panlalaking anyo ng hulaping Hebreo.
- source_word: וּבְנֹתָיו בַּשְּׁבִית
  choice: mga bihag ang kanyang mga anak na babae
  rationale: Pinananatili ang pagtutulad ng estruktura sa “mga takas” at malinaw na ipinahahayag ang pagkabihag.
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: sa kamay ni Sihon, hari ng mga Amoreo
  rationale: Ang “sa kamay ni” ay natural na idyomang Filipino para sa pagsasailalim o pagkakabigay sa kapangyarihan ng isang mananakop; malinaw na apposition ang kasunod na titulo.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panlalaking isahan sa “kanyang mga anak na lalaki” at “kanyang mga anak na babae”
  choice: Tumutukoy ang mga ito kay Kemos, ang pinakamalapit na tahasang pangngalan.
  alternative: 'Maaaring tumukoy ang mga ito sa Moab bilang isang bayan: “mga anak na lalaki nito” at “mga anak na babae nito.”'
  rationale: Ang pinakamalapit na antecedent ay si Kemos, at ang personipikasyon ay angkop sa tulang nanunuya sa kawalan niya ng kakayahang iligtas ang kanyang bayan. Gayunman, tunay na posible sa balarila at tula ang pagtukoy sa Moab, kaya pinananatili ito sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan, na may maiikling linyang nagpapanatili sa himig ng tulang panunuya. Ginamit ang “Kemos” at “Amoreo” bilang natural na anyong Filipino ng mga pangalan.
