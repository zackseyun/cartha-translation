  to: 'Sa aba mo, Moab!


    Napahamak ka, bayan ni Kemos!


    Ibinigay niya ang kanyang mga anak na lalaki bilang mga takas


    at ang kanyang mga anak na babae bilang mga bihag kay Sihon,


    hari ng mga Amoreo.'
  rationale: Inalis ang idyomang “sa kamay ni,” na dagdag na interpretasyon, at isinalin nang tuwiran ang pagtukoy kay Sihon. Pinalitan ang “Ginawa niyang” ng “Ibinigay niya ... bilang” upang maipakita ang נָתַן habang napananatili ang paralelismong “mga takas / mga bihag.” Inayos ang talababa upang tumugma sa binagong buong pangungusap at malinaw na masaklaw ang parehong hulapi.
