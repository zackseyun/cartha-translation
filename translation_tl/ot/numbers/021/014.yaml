  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַל כֵּן֙ יֵֽאָמַ֔ר בְּ/סֵ֖פֶר מִלְחֲמֹ֣ת יְהוָ֑ה אֶת וָהֵ֣ב בְּ/סוּפָ֔ה וְ/אֶת הַ/נְּחָלִ֖ים אַרְנֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: tl
  text: Kaya sinasabi sa Aklat ng mga Digmaan ni Yahweh, “Waheb[b] sa Sufa[a], at ang mga wadi ng Arnon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bagyo” kung ang Sufa ay ituturing na karaniwang pangngalan sa halip na pangalan ng lugar.
    reason: alternative_reading
  - marker: b
    text: Malabo ang Hebreo ng siniping linyang ito. Iba-iba ang pagkaunawa sa “Waheb”; para sa ilan, bahagi ito ng isang pandiwang sugnay at hindi pangalan ng lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas na panandang naghahayag ng bunga o batayan at malinaw na nag-uugnay sa naunang salaysay.
- source_word: יֵאָמַר
  choice: sinasabi
  rationale: Ang Niphal na anyo ay impersonal dito at nagpapakilala ng isang sipi; natural ito sa makabagong Tagalog.
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: sa Aklat ng mga Digmaan ni Yahweh
  rationale: Pinananatili ang pamagat ng kilalang nakasulat na sanggunian, ang pangmaramihang ‘mga Digmaan,’ at ang personal na pangalan ng Diyos.
- source_word: אֶת וָהֵב
  choice: Ang Waheb
  rationale: Itinuturing ang וָהֵב bilang pangalang pantangi, malamang na pangalan ng lugar. Ang ‘Ang’ ay nagsisilbing likas na panimula ng siniping talaan sa Tagalog, hindi bilang salin ng אֶת.
- source_word: בְּסוּפָה
  choice: sa Supa
  rationale: Isinasalin bilang pangalan ng lugar upang hindi piliting lutasin ang malabong parirala; inilalagay sa talababa ang posibleng kahulugang karaniwang pangngalan.
- source_word: וְאֶת הַנְּחָלִים
  choice: at ang mga lambak-ilog
  rationale: Ipinahihiwatig ng נְחָלִים ang mga libis o daluyang maaaring agusan ng tubig. Ang ‘lambak-ilog’ ay mas madaling maunawaan kaysa ‘wadi’ habang pinananatili ang heograpikong diwa.
- source_word: אַרְנוֹן
  choice: Arnon
  rationale: Karaniwang transliterasyon ng pangalan ng ilog o rehiyong kaugnay nito.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pinananatili ang personal na pangalang Hebreo sa pamagat ng sinaunang aklat sa halip na palitan ito ng isang titulo.
- issue: Pag-unawa sa malabong siniping taludtod
  choice: Ituring ang Waheb at Supa bilang mga pangalan ng lugar
  alternative: Unawain ang וָהֵב bilang bahagi ng pandiwang sugnay at ang סוּפָה bilang ‘bagyo’
  rationale: Hindi tiyak ang Hebreo. Ang pangunahing teksto ay gumagamit ng pinakamaingat na pagbasa bilang mga pangalang pantangi, habang hayagang pinananatili sa mga talababa ang ibang posibilidad.
translation_notes:
  register: Makabago, marangal, at tuwirang Tagalog. Ginamit ang ‘Aklat’ bilang karaniwang katawagan sa nakasulat na sanggunian at ‘mga lambak-ilog’ upang maipahayag sa payak na paraan ang heograpikong diwa ng נְחָלִים. Inayos ang mga pananda ng talababa upang tumapat sa mismong salitang tinatalakay ng bawat tala.
