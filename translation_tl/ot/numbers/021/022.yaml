base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: tl
  text: “Pahintulutan mo akong dumaan sa iyong lupain. Hindi kami lilihis patungo sa bukid o ubasan, at hindi kami iinom ng tubig mula sa balon. Maglalakbay kami sa daan ng hari[a] hanggang sa makalampas kami sa iyong hangganan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tradisyonal, “maharlikang lansangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Paraanin mo ako
  rationale: Ang Qal cohortative na unang panauhang isahan ay isang magalang na pakiusap sa hari. Pinananatili ng “ako” ang paglipat ng Hebreo mula sa kinatawang nagsasalita tungo sa maramihang “kami” sa kasunod na mga pangako.
- source_word: בְאַרְצְךָ
  choice: sa iyong lupain
  rationale: Ang אֶרֶץ ay tumutukoy rito sa lupaing nasasakupan ng hari; natural at malinaw sa modernong Filipino ang “iyong lupain.”
- source_word: לֹא נִטֶּה
  choice: hindi kami lilihis
  rationale: Sa konteksto ng paglalakbay, ang נטה ay paglihis mula sa itinakdang ruta. Tumpak at maikli ang “lilihis.”
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: papunta sa bukid o ubasan
  rationale: Ginagawang malinaw ng “papunta sa” na hindi sila lilihis mula sa daan upang pumasok sa mga taniman, habang pinananatili ang pangkalahatang diwa ng mga pangngalang isahan.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: hindi kami iinom ng tubig mula sa balon
  rationale: Natural na Filipino ito para sa literal na “tubig ng balon” at malinaw na nangangakong hindi gagamit ng lokal na suplay ng tubig.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: Sa daang-hari
  rationale: Literal itong “sa daan ng hari” at tumutukoy sa pangunahing pampublikong ruta. Ang “daang-hari” ay maikli, pamilyar, at may dignidad sa Filipino.
- source_word: נֵלֵךְ
  choice: kami dadaan
  rationale: Bagaman karaniwang nangangahulugang “pupunta” o “lalakad” ang הלך, mas natural sa pangungusap ang “dadaan” at malinaw nitong ipinahahayag ang paglalakbay sa itinakdang ruta.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבֻלֶךָ
  choice: hanggang sa makalampas kami sa iyong hangganan
  rationale: Pinananatili ng “hangganan” ang konkretong kahulugan ng גְּבוּל bilang boundary, at ipinahahayag ng “makalampas” ang ganap na pagdaan palabas sa nasasakupan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang salit-salit na isahang “ako” at maramihang “kami” ng tekstong Hebreo, sa halip na ipantay ang mga panauhan. Ginamit ang “daang-hari” bilang likas at kinikilalang katawagan sa pangunahing rutang pampubliko.
