  text: and the slope of the wadis that extends to the site of Ar and leans against the border of Moab[a][b].
translation:
  language: tl
  text: at ang dalisdis ng mga pana-panahong daluyan ng tubig[a] na umaabot sa kinaroroonan ng Ar[b] at nakasandal sa hangganan ng Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lambak” o “mga bangin.” Ang salitang Hebreo ay madalas tumutukoy sa mga daluyan ng tubig na pana-panahon lamang umaagos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa tirahan” o “sa kinalalagyan ng Ar.” Mahirap unawain ang pariralang Hebreo at maaaring tumukoy sa lokasyon o pamayanan ng Ar.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: dalisdis
  rationale: Tumutukoy ang pangngalan sa pahilig na bahagi ng lupa, lalo na sa gilid ng isang lambak o bangin; natural at malinaw sa makabagong Filipino ang “dalisdis.”
- source_word: הַנְּחָלִים
  choice: mga tuyong batis
  rationale: Ang נחל ay madalas tumukoy sa daluyan ng tubig na pana-panahon lamang umaagos. Ipinahihiwatig ng “mga tuyong batis” ang ganitong heograpikong katangian nang hindi gumagamit ng di-pamilyar na terminong “wadi.”
- source_word: אֲשֶׁר נָטָה
  choice: na umaabot
  rationale: Sa paglalarawang heograpiko, ipinahahayag ng נטה ang pag-uunat o pag-abot ng isang anyong-lupa.
- source_word: לְשֶׁבֶת עָר
  choice: sa kinaroroonan ng Ar
  rationale: Mahirap ang pariralang Hebreo at maaaring tumukoy sa lokasyon o tirahan ng Ar. Pinananatili ng “kinaroroonan” ang topograpikong diwa nang hindi labis na nagpapasya kung pamayanan ang tinutukoy.
- source_word: עָר
  choice: Ar
  rationale: Pangalan ito ng isang lugar at isinalin sa pamamagitan ng transliterasyon.
- source_word: וְנִשְׁעַן
  choice: at nakasandal
  rationale: Pinananatili nito ang metapora ng Hebreong שען, “sumandal” o “mamahinga sa,” sa paglalarawan ng ugnayan ng anyong-lupa sa hangganan.
- source_word: לִגְבוּל מוֹאָב
  choice: sa hangganan ng Moab
  rationale: Karaniwang kahulugan ng גבול ang hangganan o guhit na naghihiwalay sa mga teritoryo.
