base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, nagsugo ang Israel ng mga sugo kay Sihon, na hari ng mga Amoreo, upang sabihin:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, nagsugo
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag sa Tagalog ang pagkakasunod sa pamamagitan ng “Pagkatapos,” habang pinananatili ng “nagsugo” ang pangunahing diwa ng pandiwa.
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pangngalang pantangi na tumutukoy rito sa bayan ng Israel; ang panandang “ang” ay kailangan sa likas na balangkas ng pangungusap sa Tagalog.
- source_word: מַלְאָכִים
  choice: mga sugo
  rationale: Sa kontekstong diplomatiko, tumutukoy ito sa mga taong ipinadala bilang kinatawan, hindi sa mga anghel. Ang “mga sugo” ay malinaw, marangal, at hindi labis na mapagpasiya gaya ng “mga embahador.”
- source_word: אֶל
  choice: kay
  rationale: Ang “kay” ang natural na panandang Tagalog para sa patutunguhan kapag isang tiyak na tao ang tinutukoy.
- source_word: סִיחֹן
  choice: Sihon
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalang pantangi.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: na hari ng mga Amoreo
  rationale: Ipinahahayag nito na si Sihon ang hari ng bayang Amoreo. Idinagdag ang pang-ugnay na “na” upang maging malinaw at natural na appositive ang parirala sa Tagalog.
- source_word: לֵאמֹר
  choice: upang sabihin
  rationale: Karaniwang panimulang pormula para sa tuwirang pananalitang sumusunod; ang “upang sabihin” ay natural sa modernong Tagalog at naghahanda sa sipi sa susunod na talata.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “mga sugo” sa halip na “mga mensahero” dahil ang una ay likas sa konteksto ng opisyal na pagpapadala. Walang talababa: sa Tagalog, ang posibleng pagkakaiba ng “hari ng mga Amoreo” at “Amoreong hari” ay hindi kailangang itala dahil malinaw at sapat ang unang anyo.'
