id: NUM.21.1
reference: Numbers 21:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: tl
  text: Nang mabalitaan ng Cananeong hari ng Arad, na naninirahan sa Negev, na paparating ang Israel sa daan ng Atarim[a], nakipaglaban siya sa Israel at binihag ang ilan sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “sa daan ng Atarim.” Hindi tiyak ang kahulugan ng “Atarim.” Itinuturing ito ng ilan na pangalan ng isang lugar, ngunit ayon sa pagkaunawa sa ilang sinaunang salin, maaari itong mangahulugang “mga espiya” o “mga tagamanman.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mabalitaan
  rationale: Sa kontekstong pasalaysay, tumutukoy ito sa pagtanggap ng balita. Mas natural sa Filipino ang “mabalitaan” kaysa literal na “marinig” para sa impormasyong nag-udyok sa pagkilos ng hari.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: Cananeong hari ng Arad
  rationale: Pinananatili ang etnikong pagkakakilanlan at ang titulo/lugar sa isang natural na pariralang Filipino.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: na naninirahan sa Negev
  rationale: Ipinahahayag ng participle ang paninirahan. Pinanatili ang Negev bilang tiyak na pangalan ng rehiyon sa halip na gawing pangkalahatang “timog.”
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: na paparating ang Israel
  rationale: Sa konteksto, ang balita ay tungkol sa paglapit ng Israel; malinaw at natural itong naipahahayag ng “paparating” nang hindi ipinapalagay na nakarating na sila.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: sa daan ng Atarim
  rationale: Isinalin ang דֶּרֶךְ bilang “daan” at konserbatibong pinanatili ang malabong אֲתָרִים bilang pangalang Atarim; inilagay sa talababa ang ibang posibleng pagkaunawa.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: nakipaglaban siya sa Israel
  rationale: Direktang inilalarawan ang pakikipagdigma nang hindi pinalalaki o nililiitan ang saklaw ng labanan.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: binihag ang ilan sa kanila
  rationale: Natural na Filipino para sa pagkuha ng mga bihag mula sa kolektibong Israel; malinaw na partitive ang “ilan sa kanila.”
theological_decisions: []
