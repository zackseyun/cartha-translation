  text: וּ/מִ/מַּתָּנָ֖ה נַחֲלִיאֵ֑ל וּ/מִ/נַּחֲלִיאֵ֖ל בָּמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/019.yaml
  text: And from Mattanah to Nahaliel[a], and from Nahaliel to Bamoth.
translation:
  language: tl
  text: At mula sa Matana ay nagtungo sila sa Nahaliel, at mula sa Nahaliel ay nagtungo sila sa Bamot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinatitik na “Bamot” ay maaari ring mangahulugang “mga kaitaasan” o “matataas na lugar,” ngunit dito ay pinakamainam na unawain bilang pangalan ng isang lugar sa talaan ng paglalakbay ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: At mula sa Matana
  rationale: Isinalin ang וּ bilang “at” at ang מִן bilang “mula sa.” Itinuring ang מַתָּנָה bilang pangalan ng lugar at isinatitik sa paraang natural sa Filipino.
- source_word: נַחֲלִיאֵל
  choice: ay nagtungo sila sa Nahaliel
  rationale: Walang nakasulat na pang-ukol o pandiwa bago ang pangalan, ngunit ipinahihiwatig ng pinaikling estilo ng talaan ng paglalakbay ang pagpunta sa susunod na hintuan. Idinagdag ang “ay nagtungo sila sa” upang maging malinaw at natural sa Filipino.
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: at mula sa Nahaliel
  rationale: Isinalin muli ang וּ bilang “at” at ang מִן bilang “mula sa,” at pinanatiling pare-pareho ang anyo ng pangalan.
- source_word: בָּמוֹת
  choice: Bamot
  rationale: Sa konteksto ng talaan ng paglalakbay, ito ay pinakamainam na unawain bilang pangalan ng lugar. Ginamit ang “Bamot,” na sumusunod sa bigkas ng Hebreo at sa karaniwang pagsasatitik sa Filipino; inilagay sa talababa ang posibleng literal na kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na hulma ng talata, ngunit idinagdag ang ipinahihiwatig na pandiwang “nagtungo” para sa likas na daloy. Inilipat ang pananda ng talababa sa “Bamot,” sapagkat iyon ang salitang tinatalakay ng tala.
