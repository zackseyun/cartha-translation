  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: tl
  text: Sinaktan siya ng Israel sa pamamagitan ng talim ng espada at inangkin ang kaniyang lupain mula sa Arnon hanggang sa Jabok, hanggang sa mga Ammonita,[a] sapagkat matibay ang hangganan ng mga Ammonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “mga anak ni Ammon”; gayundin sa kasunod na pagbanggit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: Tinalo sila
  rationale: Ang נכה ay pangunahing nangangahulugang hampasin o salakayin. Sa kontekstong militar, natural sa Filipino ang “tinalo”; ang panghalip na isahan sa Hebreo ay tumutukoy kay Sihon bilang kinatawan ng kaniyang hukbo at bayan, kaya “sila” ang mas malinaw na natural na pahayag nang hindi tahasang sinasabing pinatay siya.
- source_word: לְפִי חָרֶב
  choice: sa pamamagitan ng talim ng espada
  rationale: Pinananatili nito ang larawang Hebreo na “sa bibig/talim ng espada” habang malinaw at marangal sa makabagong Filipino.
- source_word: וַיִּירַשׁ
  choice: sinakop
  rationale: Sa kontekstong militar, ipinapahayag ng ירש ang pagkuha at pag-angkin sa lupain. Mas natural ang “sinakop” kaysa “minana,” at malinaw nitong ipinahihiwatig ang pagkuha ng teritoryo.
- source_word: אַרְצוֹ
  choice: ang lupain niya
  rationale: Tuwirang katumbas ng אֶרֶץ ang “lupain,” at ang “niya” ay nagpapanatili sa panghalip na panlalaking isahan na tumutukoy kay Sihon.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: mula sa Arnon hanggang sa Jabok
  rationale: Malinaw na inilalahad ang saklaw ng teritoryo sa pagitan ng dalawang ilog; ginamit ang karaniwang anyong Filipino ng mga pangalang heograpiko.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: hanggang sa mga Ammonita
  rationale: Ang literal na “mga anak ni Ammon” ay isang Hebreong katawagang etniko. Ang “mga Ammonita” ang natural at tumpak na katumbas sa Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita ng כִּי ang dahilan kung bakit hanggang doon lamang umabot ang pananakop.
- source_word: עַז
  choice: matibay
  rationale: Ang עַז ay nangangahulugang malakas o matatag. Sa paglalarawan ng hangganan, natural ang “matibay” at hindi nito labis na tinutukoy kung kuta, lupain, o depensa ang dahilan ng lakas nito.
- source_word: גְּבוּל
  choice: hangganan
  rationale: Karaniwan at malinaw na salin ito para sa teritoryal na limitasyon.
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Ang etnikong kahulugan ng Hebreong parirala ay mas natural na naihahatid sa Filipino sa pamamagitan ng “mga Ammonita”; inilalagay sa talababa ang literal na anyo.
theological_decisions:
- issue: Pagkasalin sa בְּנֵי עַמּוֹן
  choice: mga Ammonita
  alternative: mga anak ni Ammon
  rationale: Ang panlalaking katawagang pangkamag-anakan sa Hebreo ay gumaganap bilang pangalan ng buong pangkat-etniko. Inilalahad ng pangunahing teksto ang natural na etnikong kahulugan, samantalang pinananatili sa talababa ang literal na anyo para sa pagiging malinaw sa pinagmulan.
- issue: Saklaw ng panghalip sa וַיַּכֵּהוּ
  choice: sila
  alternative: siya
  rationale: Ang hulaping panghalip ay literal na isahan at malamang na tumutukoy kay Sihon, ngunit sa salaysay ng labanan kumakatawan siya sa kaniyang hukbo at bayan. Pinipili ng Filipino ang natural na kolektibong reperensiya, habang iniiwasang ipasya na tahasang pinatay mismo si Sihon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “espada” sa halip na mas makalumang “tabak,” at “mga Ammonita” bilang natural na katawagang etniko. Ang marker na [a] ay inilagay kaagad pagkatapos ng unang pagbanggit sa mga Ammonita.
