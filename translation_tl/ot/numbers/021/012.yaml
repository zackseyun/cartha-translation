  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: tl
  text: Mula roon, umalis sila at nagkampo sa Wadi Zered.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa libis ng Zered,” “sa bangin ng Zered,” o “sa batis ng Zered.” Ang Hebreong naḥal ay maaaring tumukoy sa isang wadi, bangin, o daluyan ng tubig na pana-panahon lamang may tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Mula roon
  rationale: Likas at malinaw na ipinahihiwatig ang pag-alis mula sa naunang lugar.
- source_word: נָסָעוּ
  choice: umalis sila
  rationale: Sa mga salaysay ng paglalakbay, ang pandiwa ay tumutukoy sa pagbuwag ng kampo at pagpapatuloy ng paglalakbay; natural itong ipinahahayag sa Filipino bilang “umalis sila.”
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Tuwirang inilalarawan ang pagtigil at pagtatayo ng kampo sa payak at modernong Filipino.
- source_word: בְּנַחַל
  choice: sa tabi ng Wadi
  rationale: Ang נַחַל ay maaaring tumukoy sa bangin, libis, o daluyan ng tubig na pana-panahon lamang may tubig. Pinananatili ng “Wadi” ang heograpikong diwa, at ang “sa tabi ng” ay natural na pagbasa sa ugnayang panlunan dito nang hindi ipinapalagay na sa mismong daluyan sila nagkampo.
- source_word: זָרֶד
  choice: Zered
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon.
