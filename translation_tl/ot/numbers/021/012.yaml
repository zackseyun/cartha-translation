review_pass:
  verdict: revise
  source_fidelity: Ang "Mula roon" at ang pagkakasunod ng pag-alis at pagkakampo ay tapat sa Hebreo. Gayunman, ang בְּנַחַל ay isang payak na panandang-lugar (“sa/sa loob ng Wadi”), samantalang ang “sa tabi ng” ay mas tiyak na nagpapahiwatig na nasa gilid nito sila. Hindi kailangan ang dagdag na pahiwatig na iyon.
  naturalness: Mas natural at tuwiran sa modernong Filipino ang “sa Wadi Zered” kaysa “sa tabi ng Wadi ng Zered.” Karaniwan ding ginagamit ang pangalan bilang “Wadi Zered,” hindi “Wadi ng Zered.”
  terminology: Ang “Wadi” ay angkop upang mapanatili ang heograpikong saklaw ng naḥal. Inayos ang talababa upang ang mga alternatibo ay tumugma sa panandang-lugar ng pangunahing salin at hindi magmungkahi ng “sa tabi ng.”
  issues:
  - severity: medium
    issue: Ang “sa tabi ng” ay mas makitid kaysa sa Hebreong בְּנַחַל.
    rationale: Maaaring tukuyin ng panandang בְּ ang pagkakampo sa/sa loob ng wadi, libis, o daluyan; hindi nito tahasang sinasabing nasa tabi lamang nito ang kampo.
  - severity: low
    issue: Hindi likas ang anyong “Wadi ng Zered” kumpara sa “Wadi Zered.”
    rationale: Bilang transliteradong pangalan ng lugar, mas malinaw at mas karaniwan ang direktang pagkakatabing “Wadi Zered.”
  - severity: low
    issue: Hindi eksaktong katumbas ng pangunahing salin ang ilang alternatibo sa talababa.
    rationale: Ang “sa tabi ng batis” ay inuulit ang di-kailangang ideyang “sa tabi”; dapat panatilihin ng talababa ang locative na “sa.”
  revised_text: Mula roon, umalis sila at nagkampo sa Wadi Zered.[a]
