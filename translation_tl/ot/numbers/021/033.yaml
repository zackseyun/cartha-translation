base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: tl
  text: Pagkatapos, lumiko sila at umahon sa daan patungong Basan. Lumabas naman si Og na hari ng Basan, kasama ang lahat ng kanyang mamamayan, upang salubungin sila[a] at makipaglaban sa Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “harapin sila.” Maaaring neutral sa ganang sarili ang pananalitang Hebreo, ngunit ipinakikita ng kasunod na “makipaglaban” na mapanlaban ang pagtatagpong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: lumiko sila
  rationale: Ipinahihiwatig ng pandiwa ang pagbabago ng direksiyon; natural at maikli ang “lumiko sila” sa salaysay.
- source_word: וַיַּעֲלוּ
  choice: umahon
  rationale: Pinananatili nito ang direksiyonal o topograpikong diwa ng עלה nang hindi nagiging labis na pormal.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: sa daan patungong Basan
  rationale: Ang דרך na sinusundan ng pangalan ng lugar ay maaaring tumukoy sa rutang kaugnay ng lugar; malinaw at natural sa Filipino ang pariralang ito.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: si Og na hari ng Basan
  rationale: Pinananatili ang pangalan at tuwirang isinasalin ang pamagat sa natural na ayos ng Filipino.
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Tapat ito sa karaniwang kahulugan ng יצא at hindi paunang nagdaragdag ng ideyang “nagmartsa,” bagaman militar ang konteksto.
- source_word: לִקְרָאתָם
  choice: upang salubungin sila
  rationale: Pinananatili nito ang likas na neutralidad ng pariralang Hebreo; malinaw naman sa kasunod na “makipaglaban” na mapanlaban ang pagtatagpo rito.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: kasama ang lahat ng kanyang mamamayan
  rationale: Ang עַם ay “bayan” o “mga tao,” hindi tahasang “hukbo”; iniiwasan ng salin ang pagdaragdag ng espesipikong katawagang militar.
- source_word: לַמִּלְחָמָה
  choice: at makipaglaban
  rationale: Natural na ipinapahayag sa Filipino ang layunin ng paglabas at ang tiyak na konteksto ng labanan.
- source_word: אֶדְרֶעִי
  choice: sa Edrei
  rationale: Ginagamit ang transliteradong pangalan ng lugar at ang “sa” upang hindi piliting tukuyin kung direksiyon o eksaktong lokasyon ang walang pang-ukol na pangalan sa Hebreo.
