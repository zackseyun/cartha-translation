base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: tl
  text: Pagkatapos, umalis sila mula sa Bundok Hor at dumaan sa daang patungo sa Dagat na Pula[a] upang lumibot sa lupain ng Edom. Nainip ang mga tao habang naglalakbay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Dagat ng mga Tambo.” Sa Hebreo: yam suph.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “nawalan ng tiyaga ang mga tao,” “nasiraan sila ng loob,” o “nainip ang mga tao dahil sa daan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: umalis sila
  rationale: Sa pormula ng paglalakbay sa ilang, tumutukoy ang נסע sa pag-alis mula sa isang himpilan upang magpatuloy sa paglalakbay. Natural at malinaw sa Filipino ang “umalis sila.”
- source_word: מֵהֹר הָהָר
  choice: mula sa Bundok Hor
  rationale: Ang הֹר הָהָר ay pangalan ng lugar; ang “Bundok Hor” ang natural na ayos sa Filipino.
- source_word: דֶּרֶךְ יַם סוּף
  choice: sa daang patungo sa Dagat na Pula
  rationale: Ang דֶּרֶךְ ay daan o ruta. Maaaring ipakahulugan ang konstruksiyon bilang daang patungo sa yam suph; pinanatili sa pangunahing teksto ang tradisyonal na “Dagat na Pula,” habang nasa talababa ang mas literal na “Dagat ng mga Tambo.”
- source_word: לִסְבֹב
  choice: upang lumibot
  rationale: 'Ipinahahayag ng infinitive ang layunin ng pagdaan sa rutang iyon: ang pag-ikot o paglibot sa Edom.'
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: sa lupain ng Edom
  rationale: Ang אֶרֶץ dito ay lupain o teritoryo; tuwiran at natural ang “lupain ng Edom.”
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: nainip ang mga tao
  rationale: Ang idyomang קצר נפש ay nagsasaad ng pagkaubos ng tiyaga, pagkainip, panghihina ng loob, o pagkasiphayo. Ang “nainip” ang maikli at natural na pangunahing salin, at pinananatili sa talababa ang ibang posibleng diwa.
- source_word: בַּדָּרֶךְ
  choice: habang naglalakbay
  rationale: Pangunahing lokatibo ang parirala, “sa daan,” ngunit mas natural sa Filipino ang “habang naglalakbay.” Maaari rin itong magpahiwatig na ang mahirap na ruta ang dahilan ng kanilang pagkainip.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Bundok Hor,” “Dagat na Pula,” at “lupain ng Edom” bilang madaling makilalang mga katawagan. Inilagay ang [b] pagkatapos ng buong sugnay upang saklawin kapwa ang ambiguwidad ng idyomang tumutukoy sa damdamin ng bayan at ang posibleng sanhi o lokatibong diwa ng בַּדָּרֶךְ.
