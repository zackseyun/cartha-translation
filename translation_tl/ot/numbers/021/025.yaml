  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: tl
  text: Sinakop ng Israel ang lahat ng lunsod na ito, at nanirahan ang Israel sa lahat ng lunsod ng mga Amoreo—sa Hesbon at sa lahat ng bayang sakop nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na salin, “at sa lahat ng mga anak na babae nito,” isang idyoma para sa mas maliliit na pamayanang nakapailalim sa isang pangunahing lunsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: sinakop
  rationale: Ang לקח ay literal na “kunin,” ngunit sa konteksto ng digmaan, malinaw at natural na ipinahahayag ng “sinakop” ang pagkuha sa mga lunsod nang hindi nagdaragdag ng di-kinakailangang detalye.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: lahat ng lunsod na ito
  rationale: Ang עִיר ay maaaring tumukoy sa lunsod o bayan. Ang “mga lunsod” ay angkop sa konteksto at tahasang pinananatili ang demonstratibong “na ito.”
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Ang ישב ay maaaring mangahulugang umupo, manahan, o mamayan. Dito, ang “nanirahan” ay likas na Filipino para sa paninirahan ng Israel sa mga nasakop na lugar.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: sa lahat ng lunsod ng mga Amoreo
  rationale: Pinananatili nito ang malinaw na ugnayang genitibo ng pariralang Hebreo at gumagamit ng karaniwang anyong Filipino ng pangalang-bayan.
- source_word: בְּחֶשְׁבּוֹן
  choice: sa Hesbon
  rationale: Isinalin ang pang-ukol at ginamit ang nakaugaliang transliterasyong Filipino na “Hesbon.”
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: at sa lahat ng bayang sakop nito
  rationale: Ang literal na “mga anak nito” ay isang idyoma para sa mas maliliit at nakapailalim na pamayanan ng pangunahing lunsod. Ang “mga bayang sakop nito” ay malinaw at natural habang pinananatili sa talababa ang metapora ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “Israel” mula sa Hebreo, at gumamit ng gitling-pahaba upang ipakitang ang Hesbon at mga bayang sakop nito ang tinutukoy na mga lunsod ng mga Amoreo.
