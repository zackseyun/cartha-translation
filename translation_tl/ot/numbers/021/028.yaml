id: NUM.21.28
reference: Numbers 21:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: tl
  text: 'Sapagkat may apoy na lumabas mula sa Hesbon,

    ningas mula sa lungsod ni Sihon;

    tinupok nito ang Ar ng Moab,

    ang mga panginoon ng matataas na dako ng Arnon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “ang mga naninirahan sa mga kaitaasan ng Arnon.” Ang Hebreong parirala ay literal na tumutukoy sa “mga panginoon” o “mga may-ari” ng matataas na dako, ngunit maaari itong tumukoy sa mga naninirahan o namumuno roon; ang “matataas na dako” ay maaari ring unawaing “mga kaitaasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng linyang nauna at pinananatili ang ugnayang sanhi sa awit.
- source_word: אֵשׁ יָצְאָה
  choice: may apoy na lumabas
  rationale: Pinananatili ang matingkad na larawan ng apoy na nagmumula sa isang lugar; natural din ang ayos na ito sa makabagong Tagalog.
- source_word: מֵחֶשְׁבּוֹן
  choice: mula sa Hesbon
  rationale: Isinalin ang pang-ukol at tinumbasan sa karaniwang anyong Tagalog ang pangalan ng lugar.
- source_word: לֶהָבָה
  choice: ningas
  rationale: Konkretong katumbas na nagpapanatili sa paralelismo ng tula sa “apoy.”
- source_word: מִקִּרְיַת סִיחֹן
  choice: mula sa lungsod ni Sihon
  rationale: Karaniwang pangngalan ang קִרְיָה na nangangahulugang lungsod o bayan; malinaw at natural ang kaugnayang pag-aari sa Tagalog.
- source_word: אָכְלָה
  choice: tinupok nito
  rationale: Natural na pandiwa para sa mapanirang pagkonsumo ng apoy at nagpapanatili sa lakas ng metapora.
- source_word: עָר מוֹאָב
  choice: ang Ar ng Moab
  rationale: Itinuturing ang עָר bilang pangalang pantangi ng kilalang lugar sa Moab, hindi bilang karaniwang salitang “lungsod.”
- source_word: בַּעֲלֵי
  choice: ang mga panginoon ng
  rationale: Direktang pinananatili ang diwang mga may-ari, panginoon, o namumuno sa Hebreong pangmaramihang construct, sa halip na tahimik na gawing “mga naninirahan.”
- source_word: בָּמוֹת
  choice: matataas na dako
  rationale: Pinananatili ang saklaw na maaaring tumukoy sa mga kaitaasan o sa mga tinatawag na mataas na dako; hindi nilulutas nang sapilitan ang tunay na leksikal na kalabuan.
- source_word: אַרְנֹן
  choice: Arnon
  rationale: Pinananatili ang pangalang pantangi ng ilog o rehiyon nang walang dagdag na pagpapakahulugan sa mismong teksto.
theological_decisions:
- issue: Kung kultikong “matataas na dako” o heograpikong “mga kaitaasan” ang tinutukoy ng בָּמוֹת
  choice: matataas na dako
  alternative: mga kaitaasan
  rationale: Ang pangunahing salin ay sadyang maluwag upang mapanatili ang posibleng heograpiko at kultikong pahiwatig; inilalahad sa talababa ang mas tahasang heograpikong pagbasa.
- issue: Kahulugan ng בַּעֲלֵי sa pariralang בַּעֲלֵי בָּמוֹת אַרְנֹן
  choice: mga panginoon ng
  alternative: mga naninirahan sa / mga may hawak ng
  rationale: Mas tuwiran sa anyong Hebreo ang “mga panginoon,” bagaman maaari itong idiomatikong tumukoy sa mga taong nakatira o namamahala sa nasabing mga kaitaasan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog, na may maiikling linyang patula upang ipakita ang paralelismo ng Hebreong awit. Ginamit ang “tinupok” para sa natural at malakas na larawan ng apoy, habang pinanatili sa pangunahing teksto at talababa ang kalabuan ng pangwakas na parirala.
