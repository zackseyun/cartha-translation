translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ilang” bilang karaniwang biblikal ngunit nauunawaang tawag sa ilang na lupain, “nagkampo” sa halip na mas lumang “humimpil,” at “mga Amoreo” bilang kolektibong katawagan sa bayan.
