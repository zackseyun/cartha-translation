id: NUM.21.13
reference: Numbers 21:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ/שָּׁם֮ נָסָעוּ֒ וַֽ/יַּחֲנ֗וּ מֵ/עֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר הַ/יֹּצֵ֖א מִ/גְּב֣וּל הָֽ/אֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּ/בֵ֥ין הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: tl
  text: Mula roon ay naglakbay sila at nagkampo sa kabilang panig ng Arnon[a], sa ilang na umaabot mula sa hangganan ng mga Amoreo[b]. Sapagkat ang Arnon ang hangganan ng Moab sa pagitan ng Moab at ng mga Amoreo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ibayo ng Arnon.” Ang pariralang Hebreo ay maaaring tumukoy sa kabilang panig o sa pook sa ibayo ng isang hangganan, depende sa pananaw ng nagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “na lumalabas mula sa hangganan ng Amoreo.” Ang diwa ay na ang ilang ay umaabot mula sa hangganan ng mga Amoreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם נָסָעוּ
  choice: Mula roon ay naglakbay sila
  rationale: Ang “mula roon” ay tuwirang nagsasaad ng pinanggalingang lugar, at ang “naglakbay” ay natural na paglalarawan sa pag-alis at pagpapatuloy ng paglalakbay sa salaysay.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Malinaw at pangkaraniwang modernong Tagalog para sa pagtatayo o pananatili sa kampo.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: sa kabilang panig ng Arnon
  rationale: Pinananatili nito ang perspektibong kahulugan ng עֵבֶר nang hindi tiyak na ipinapalagay kung saang direksiyon tumitingin ang tagapagsalaysay.
- source_word: אֲשֶׁר בַּמִּדְבָּר הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: sa ilang na umaabot mula sa hangganan ng mga Amoreo
  rationale: Iniuugnay ang lokasyon sa ilang at likas na ipinapahayag ang heograpikong diwa ng participle na יֹצֵא, “lumalabas/umaabot mula.”
- source_word: גְּבוּל
  choice: hangganan
  rationale: Tumpak at natural na salitang Filipino para sa linyang naghihiwalay sa mga nasasakupan.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo itong tumutukoy sa pangkat-etniko; natural sa Tagalog ang maramihang anyo.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag kung bakit mahalaga ang heograpikong paglalarawan sa naunang sugnay.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: sa pagitan ng Moab at ng mga Amoreo
  rationale: Malinaw na pinangangalagaan ang dalawang panig na pinaghihiwalay ng Arnon.
