  text: וַ/יִּסְע֖וּ מֵ/אֹבֹ֑ת וַֽ/יַּחֲנ֞וּ בְּ/עִיֵּ֣י הָֽעֲבָרִ֗ים בַּ/מִּדְבָּר֙ אֲשֶׁר֙ עַל פְּנֵ֣י מוֹאָ֔ב מִ/מִּזְרַ֖ח הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/011.yaml
  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: tl
  text: Umalis sila sa Obot at nagkampo sa Iye-abarim[a], sa ilang na nasa tapat ng Moab, sa dakong sinisikatan ng araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Iye-abarim ay maaari ring unawain ayon sa kahulugan bilang “mga guho ng Abarim” o “mga bunton ng Abarim,” bagaman pangalan ito ng lugar dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa pormula ng mga yugto ng paglalakbay sa ilang, ang נסע ay tumutukoy sa paglisan sa kampamento upang magpatuloy; natural at malinaw sa modernong Filipino ang “umalis.”
- source_word: מֵאֹבֹת
  choice: sa Obot
  rationale: Pangalan ito ng lugar; tinumbasan ayon sa karaniwang anyong Filipino ng pangalang biblikal sa halip na isalin ang kahulugan.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Tuwirang ipinahahayag ng חנה ang pagtatayo o pananatili sa kampo; karaniwan at makabagong Filipino ang “nagkampo.”
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: sa Iye-abarim
  rationale: Gumaganap ang parirala bilang pangalan ng lugar sa talaan ng paglalakbay. Pinanatili bilang transliterasyon, habang inilagay sa talababa ang posibleng literal na kahulugan.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay ilang o tuyong lupaing malayo sa pamayanan; ang “ilang” ay maikli, dignified, at nakaugat sa gamit-biblikal na Filipino.
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: na nasa tapat ng Moab
  rationale: Sa heograpikong paglalarawan, ang עַל־פְּנֵי ay nangangahulugang kaharap o katapat; malinaw ang “nasa tapat ng Moab” nang hindi nagpapasya ng mas tiyak na distansiya.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: sa dakong sinisikatan ng araw
  rationale: Pinananatili nito ang konkretong larawang Hebreo ng pagsikat ng araw habang likas na ipinahihiwatig sa Filipino ang silangang panig.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang maiikling salitang “ilang” at “nagkampo,” pinanatili ang mga pangalang pantangi, at iningatan ang larawang “sinisikatan ng araw” sa halip na patagin lamang bilang “silangan.”
