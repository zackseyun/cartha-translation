lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa salaysay; ipinakikitang sumunod ang pag-awit sa naunang pangyayari.
- source_word: יָשִׁיר
  choice: inawit
  rationale: Bagaman anyong imperfect ang pandiwa, ang pagkakasunod nito sa אָז ay nagbibigay rito ng puwersang naganap na sa salaysay.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyo sa Filipino ng pangalan ng bayan.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ang awit na ito
  rationale: Tuwirang katumbas na natural sa Filipino at angkop sa kasunod na taludtod.
- source_word: עֲלִי
  choice: Bumulwak ka
  rationale: Ang pambabaeng isahang pautos ay nakatuon sa balon. Sa konteksto ng tubig, malinaw at makatang ipinahahayag ng “bumulwak” ang pag-ahon o pagsibol ng tubig, habang itinatala sa talababa ang mas pormal na anyo.
- source_word: בְּאֵר
  choice: balon
  rationale: Tuwirang katawagan sa kinakausap; hindi kailangan ang artipisyal na pantawag na “O” sa natural na modernong Filipino.
- source_word: עֱנוּ לָהּ
  choice: Tugunan ninyo ito
  rationale: Pinananatili ang batayang diwa ng maramihang pautos na “sumagot/tumugon” at ang posibleng tugunang paraan ng pag-awit, nang hindi tahasang pinapalitan ang pandiwa ng “awitan.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyong patula at ang bahagyang di-pangkaraniwang larawang ang balon mismo ang inuutusang bumulwak; ang talababa ay nagbibigay ng mas literal na pagbasa at nagpapaliwanag sa posibleng antiphonal na diwa.
