translation:
  language: tl
  text: 'Noon, inawit ng Israel ang awit na ito:


    “Bumulwak ka[a], balon!

    Tumugon kayo rito!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Umahon ka, balon!” Maaaring ipinahihiwatig ng Hebreo ang isang tugunang paraan ng pag-awit.'
