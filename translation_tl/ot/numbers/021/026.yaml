source:
  edition: WLC
  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: tl
  text: Sapagkat ang Hesbon ay lungsod ni Sihon, na hari ng mga Amoreo. Nakipagdigma si Sihon sa dating hari ng Moab at kinuha niya ang buong lupain ng hari ng Moab mula sa kanyang kapangyarihan[a] hanggang sa Arnon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa kanyang kamay.”
    reason: Pinananatili ang literal na larawan ng idyomang Hebreo bilang alternatibong pagbasa.
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa naunang pahayag; natural sa Filipino ang “Sapagkat” para sa ganitong ugnayang lohikal.
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Karaniwang anyong Filipino ng pangalang Heshbon.
- source_word: עִיר סִיחֹן
  choice: lungsod ni Sihon
  rationale: Tuwirang ipinahahayag ang pagmamay-ari o pamamahala ni Sihon sa lungsod.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: hari ng mga Amoreo
  rationale: Bagaman anyong isahan ang Hebreo, tumutukoy ito kay Sihon bilang hari ng bayang Amoreo; ang maramihang pangkat-etniko ay natural sa Filipino.
- source_word: הִוא
  choice: ay
  rationale: Walang tahasang pandiwang pangnagdaan sa sugnay na Hebreo; ang “ay” ay nagpapanatili ng nominal na anyo at hindi kailangang pilitin ang aspektong pangnagdaan.
- source_word: נִלְחַם בְּ
  choice: Nakipagdigma ... sa
  rationale: Tumpak at natural na katumbas ng pakikipaglaban o pakikidigma laban sa isang hari.
- source_word: מֶלֶךְ מוֹאָב הָרִאשׁוֹן
  choice: dating hari ng Moab
  rationale: Sa konteksto, ang הָרִאשׁוֹן ay tumutukoy sa nauna o dating hari, hindi kinakailangang sa pinakaunang hari sa kasaysayan.
- source_word: וַיִּקַּח
  choice: at inagaw niya
  rationale: Ipinahihiwatig ng pandiwa ang pagkuha sa pamamagitan ng tagumpay sa digmaan; malinaw itong naipapahayag ng “inagaw.”
- source_word: אֶת כָּל אַרְצוֹ
  choice: ang buong lupain nito
  rationale: Tumutukoy ang hulaping panghalip sa hari ng Moab; ang “nito” ay nakababawas sa kalituhan sa mga panlalaking panghalip sa Filipino.
- source_word: מִיָּדוֹ
  choice: mula sa kapangyarihan nito
  rationale: Ang literal na “mula sa kamay nito” ay isang idyomang Hebreo para sa pag-aalis mula sa kontrol o kapangyarihan; isinasaad sa pangunahing teksto ang natural na kahulugan at inilalagay sa talababa ang literal na larawan.
- source_word: עַד אַרְנֹן
  choice: hanggang sa Arnon
  rationale: Ipinakikita ang hangganan ng teritoryong nasakop.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nito” para malinaw na ang dating hari ng Moab ang nawalan ng lupain. Hinati sa dalawang pangungusap upang maiwasan ang mabigat at malabong sunod-sunod na sugnay nang hindi binabago ang lohika ng Hebreo.
