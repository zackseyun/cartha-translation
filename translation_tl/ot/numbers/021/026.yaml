  to: Sapagkat ang Hesbon ay lungsod ni Sihon, na hari ng mga Amoreo. Nakipagdigma si Sihon sa dating hari ng Moab at kinuha niya ang buong lupain ng hari ng Moab mula sa kanyang kapangyarihan[a] hanggang sa Arnon.
