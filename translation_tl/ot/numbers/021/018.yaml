  - severity: low
    issue: Malabo ang “mga marangal sa bayan.”
    rationale: Maaari itong unawain bilang mga taong may mabuting asal, samantalang ang paralelismo sa “mga pinuno” ay nagpapahiwatig ng mga maharlika o taong mataas ang katayuan.
  - severity: low
