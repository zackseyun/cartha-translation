base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: tl
  text: 'Ang balon na hinukay ng mga pinuno,

    na hinukay ng mga maharlika ng bayan,

    gamit ang tungkod ng tagapamahala,

    gamit ang kanilang mga tungkod.[a]


    Mula sa ilang ay naglakbay sila patungong Matana.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “tungkod ng tagapamahala” ay maaari ring mangahulugang “gamit ang tagapagbigay ng kautusan.”
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, literal na “at mula sa ilang, Matana”; ipinahihiwatig ng konteksto ang paglalakbay mula sa ilang patungong Matana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: ang balon
  rationale: Tumutukoy sa tiyak na balong ipinagdiriwang sa naunang taludtod; likas sa Tagalog ang paggamit ng tiyak na panandang “ang.”
- source_word: חֲפָרוּהָ
  choice: hinukay
  rationale: Karaniwang katumbas ng חפר at malinaw na tumutukoy ang hulaping pambabae sa בְּאֵר, “balon.”
- source_word: שָׂרִים
  choice: mga pinuno
  rationale: Ipinahahayag ang mataas na katungkulan nang hindi ipinapalagay na mga anak sila ng hari; mas malinaw ito sa karaniwang modernong Tagalog kaysa “mga prinsipe.”
- source_word: כָּרוּהָ
  choice: pinaghukayan
  rationale: Pinananatili ang parallelismo at kilos ng paghuhukay, habang bahagyang iniiba ang pananalita mula sa naunang חפר.
- source_word: נְדִיבֵי הָעָם
  choice: mga marangal sa bayan
  rationale: Sa paralelismo sa שָׂרִים, malamang na tumutukoy ito sa mga taong may marangal o mataas na katayuan sa sambayanan.
- source_word: בִּמְחֹקֵק
  choice: gamit ang tungkod ng tagapamahala
  rationale: Ang instrumental na kahulugan ay pinapaboran ng kasunod na paralel na “gamit ang kanilang mga tungkod,” ngunit nananatiling leksikal na posible ang pagtukoy sa isang tagapagbigay ng kautusan.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: gamit ang kanilang mga tungkod
  rationale: Ang מִשְׁעֵנָה ay tungkod o bagay na sinasandalan; “mga tungkod” ang natural at sapat na malawak na salin.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: Mula sa ilang ay naglakbay sila patungong Matana
  rationale: Bagaman eliptiko ang Hebreo, ipinakikita ng kasunod na itineraryo na paglipat ng lugar ang diwa; dinagdagan ang pandiwa at “patungong” para sa malinaw at natural na Tagalog.
theological_decisions:
- issue: Kahulugan ng בִּמְחֹקֵק
  choice: 'instrumental: “gamit ang tungkod ng tagapamahala”'
  alternative: 'personal: “sa pamamagitan ng tagapagbigay ng kautusan”; abstract: “sa pamamagitan ng kautusan”'
  rationale: Malakas na sinusuportahan ng paralel na “gamit ang kanilang mga tungkod” ang pagbasa rito bilang kasangkapan. Hindi nito iniuugnay ang salita sa isang partikular na doktrina o sa isang pinangalanang tagapagbigay-kahulugan.
- issue: Diwa ng וּמִמִּדְבָּר מַתָּנָה
  choice: 'paglipat sa itineraryo: “Mula sa ilang ay naglakbay sila patungong Matana”'
  alternative: 'literal na elipsis: “at mula sa ilang, Matana”'
  rationale: Ang konteksto ng Mga Bilang 21:18–20 ay sunod-sunod na hintuan sa paglalakbay. Nililinaw ng salin ang ipinahihiwatig na kilos nang hindi ginagawang tahasang bahagi ng Hebreo ang pandiwa.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang anyong patula sa unang apat na linya at ginawang malinaw ang eliptikong transisyon sa itineraryo. Ang mga pangalang pook ay isina-Tagalog ang baybay bilang “Matana.”
