  source_fidelity: 'Ang pangunahing kahulugan ay wastong naipapahayag: ang balon ay hinukay ng mga pinuno at maharlika, gamit ang mga tungkod, at kasunod ang paglipat mula sa ilang tungo sa Matana. Gayunman, ang “pinaghukayan” ay karaniwang nangangahulugang lugar o bagay na pinaghuhukayan, hindi ang tuwirang pagkilos na ‘hollowed out/dug it’ ng כָּרוּהָ.'
  naturalness: Natural ang patulang paglalatag at ang paglilinaw sa eliptikong itineraryo. Mas malinaw at tuwiran ang “hinukay ng mga maharlika ng bayan” kaysa “pinaghukayan ng mga marangal sa bayan.”
  terminology: Ang “mga pinuno” para sa שָׂרִים at “tungkod ng tagapamahala” para sa instrumental na pagbasa ng בִּמְחֹקֵק ay angkop. Ang “mga maharlika ng bayan” ay mas malinaw na tumutukoy sa mataas na katayuang ipinahihiwatig ng נְדִיבֵי הָעָם. Itinutuwid din ng talababa ang alternatibong personal na pagbasa upang maisama ang instrumental na ugnayang nasa Hebreo.
