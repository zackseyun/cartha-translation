base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: tl
  text: 'At nagsalita ang mga tao laban sa Diyos at kay Moises: “Bakit mo kami inilabas mula sa Ehipto upang mamatay sa ilang? Sapagkat walang tinapay at walang tubig, at nasusuklam kami sa walang-kuwentang tinapay na ito.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hamak na tinapay” o “miserableng tinapay.” Bihira ang salitang Hebreo at ipinahahayag nito ang paghamak sa pagkaing ipinagkaloob ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: nagsalita ang mga tao laban sa Diyos at kay Moises
  rationale: Sa konteksto ng mapanumbat na sinabi ng bayan, adversatibo ang diwa ng דּבר ב; pinananatili ng “nagsalita ... laban” ang anyo ng pananalita nang hindi labis na ipinapakahulugang paglapastangan.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: ninyo kami inilabas mula sa Ehipto
  rationale: Ang Hiphil ng עלה ay literal na “iniakyat,” ngunit sa likas na modernong Tagalog, “inilabas” ang malinaw na pariralang tumutukoy sa pag-alis mula sa Ehipto. Maramihan ang “ninyo” dahil kapwa Diyos at Moises ang sinisisi ng bayan.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: upang mamatay sa ilang
  rationale: Ang “upang” ay nagpapahayag ng layunin o ibinibintang na resulta; ang “ilang” ay angkop sa מִדְבָּר at hindi naglilimita sa larawan sa mabuhanging disyerto.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: Wala namang tinapay at tubig
  rationale: Pinananatili ang “tinapay” para sa לֶחֶם at ang pag-uulit nito sa huling sugnay. Ang “naman” ay natural na naghahatid ng mapanumbat na pangangatwiran ng כִּי sa Filipino.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: sukang-suka na kami
  rationale: Ang literal na “ang aming kaluluwa ay nasuklam” ay hindi likas sa modernong Tagalog. Ang “sukang-suka” ay malinaw na naghahatid ng matinding pagkasuya ng קָצָה.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: sa walang-kuwentang tinapay na ito
  rationale: 'Bihira ang קְלֹקֵל at nagpapahayag ng paghamak: hamak, miserableng uri, o walang halaga. Ang “walang-kuwenta” ay natural at matinding mapanlait na paglalarawan; ang “na ito” ay idyomatikong tumutukoy sa pagkaing kasalukuyan nilang tinatanggihan.'
theological_decisions:
- issue: Katangian ng pananalita ng bayan laban sa Diyos at kay Moises
  choice: Isinaling adversatibo bilang “nagsalita ... laban.”
  alternative: “nagsalita sa” o “nagsalita tungkol sa” Diyos at kay Moises
  rationale: Malinaw na mapanumbat at palaban ang kasunod na sipi. Hindi nito dinaragdagan ang paratang, ngunit hindi rin nito pinapahina ang paghihimagsik na nasa konteksto.
- issue: Kung sino ang kinakausap sa “Bakit ninyo kami inilabas”
  choice: Ginamit ang maramihang “ninyo.”
  alternative: Isahang “mo,” na maaaring tumukoy lamang kay Moises
  rationale: Dahil kapwa Diyos at Moises ang tahasang pinagsalitaan laban sa pambungad, pinananatili ng maramihan ang maaaring kolektibong paratang nang hindi ipinapasya kung paano ibinubukod ng bayan ang kani-kanilang papel.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinili ang “sa ilang” bilang karaniwang biblikal at natural na katumbas ng wilderness. Ang masidhing “sukang-suka” at “walang-kuwenta” ay umaayon sa lakas ng reklamong Hebreo nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
