  to: 'At nagsalita ang mga tao laban sa Diyos at kay Moises: “Bakit mo kami inilabas mula sa Ehipto upang mamatay sa ilang? Sapagkat walang tinapay at walang tubig, at nasusuklam kami sa walang-kuwentang tinapay na ito.”[a]'
