translation:
  language: tl
  text: Kaya sinasabi ng mga makata[a], “Pumarito kayo sa Hesbon; maitayo at maitatag nawa ang lungsod ni Sihon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bumibigkas ng mga kawikaan” o “mga mang-aawit.” Sa tradisyon, “mga pinuno.” Malamang na tumutukoy rito ang salitang Hebreo sa mga bumubuo o bumibigkas ng awit na parang kawikaan, hindi sa mga pinunong pampolitika.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas na pang-ugnay sa modernong Filipino na nagpapakita ng bunga o paliwanag mula sa naunang salaysay.
- source_word: יֹאמְרוּ
  choice: sinasabi
  rationale: Ginamit ang pangkasalukuyang anyo upang katawanin ang nakagawian o pangkalahatang pormula sa pagpapakilala ng isang kasabihan.
- source_word: הַמֹּשְׁלִים
  choice: mga makata
  rationale: Sa konteksto, tumutukoy ito sa mga bumubuo o bumibigkas ng awit o kasabihang patula, hindi sa mga pinunong pampolitika. Nililinaw ng talababa ang tunay na saklaw ng salitang Hebreo.
- source_word: בֹּאוּ
  choice: Halina kayo
  rationale: Isang likas at marangal na salin ng pautos na pangmaramihan, na nagpapanatili sa diwa ng paanyayang “Come.”
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Isinulat ang pangalan ng lugar ayon sa karaniwang anyong madaling bigkasin sa Filipino.
- source_word: תִּבָּנֶה
  choice: itayo
  rationale: Inihahayag ang patulang diwang pautos o paghihikayat ng anyong Hebreo sa natural na Filipino.
- source_word: וְתִכּוֹנֵן
  choice: patatagin
  rationale: Ipinapahayag ang pagiging matatag o matibay ng lungsod at pinananatili ang paralelismo sa “itayo.”
- source_word: עִיר סִיחוֹן
  choice: ang lungsod ni Sihon
  rationale: Malinaw at natural na ipinapahayag sa Filipino ang ugnayang paari ng Hebreong construct chain.
