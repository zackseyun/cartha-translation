  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע יְהוָ֜ה בְּ/ק֣וֹל יִשְׂרָאֵ֗ל וַ/יִּתֵּן֙ אֶת הַֽ/כְּנַעֲנִ֔י וַ/יַּחֲרֵ֥ם אֶתְ/הֶ֖ם וְ/אֶת עָרֵי/הֶ֑ם וַ/יִּקְרָ֥א שֵׁם הַ/מָּק֖וֹם חָרְמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: tl
  text: Narinig ni Yahweh ang tinig ng Israel at ipinaubaya niya sa kanila ang mga Cananeo. Itinalaga ng Israel sa pagkalipol ang mga ito at ang kanilang mga lungsod. Kaya tinawag na Horma[a] ang lugar na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang “Horma” ay kaugnay ng salitang Hebreo na nangangahulugang “itinalaga sa pagkalipol” o “inilaan upang lipulin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: Pinakinggan ... ang tinig
  rationale: Napananatili ang larawang nasa idyomang Hebreo na “pakinggan ang tinig,” habang likas na ipinahihiwatig sa Filipino na tumugon si Yahweh sa Israel.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: ibinigay niya sa kanila ang mga Cananeo
  rationale: Ang נתן na may kaaway bilang layon ay nangangahulugang ibigay o ipaubaya sa kapangyarihan ng iba. Ginawang maramihan ang kolektibong pangngalang singular na הַכְּנַעֲנִי upang maging natural at malinaw sa Filipino.
- source_word: וַיַּחֲרֵם
  choice: Itinalaga ... sa pagkalipol
  rationale: 'Ipinahahayag nito ang teknikal na diwa ng חרם: ang di-mababawing pagtatalaga ng mga tao o bagay sa pagkapuksa, hindi lamang ang karaniwang pagsira.'
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: ang mga ito at ang kanilang mga lungsod
  rationale: Tuwirang isinasalin ang dalawang layon at pinananatili ang kaugnayan ng mga lungsod sa mga Cananeo.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: Kaya tinawag ... ang lugar na iyon
  rationale: Ang balintiyak na anyo ay natural sa Filipino at hindi nagpapasya kung sino ang di-binanggit na tagapagpangalan.
- source_word: חָרְמָה
  choice: Horma
  rationale: Isinalin bilang transliteradong pangalan ng lugar; ipinaliwanag sa talababa ang ugnayan nito sa ugat na חרם.
theological_decisions:
- issue: Terminong חרם sa konteksto ng digmaan
  choice: Itinalaga ng Israel sa pagkalipol ang mga ito at ang kanilang mga lungsod
  alternative: Lubusang nilipol ng Israel ang mga ito at ang kanilang mga lungsod
  rationale: Pinananatili ng “itinalaga ... sa pagkalipol” ang natatanging konsepto ng ḥerem at hindi ito pinapantay lamang sa karaniwang pagwasak. Tinukoy ang Israel bilang kolektibong paksa, alinsunod sa anyong singular ng pandiwa at sa konteksto.
translation_notes:
  register: Makabago at marangal na Filipino; malinaw sa karaniwang mambabasa. Ginamit ang “mga Cananeo” para sa natural na pagpapahayag ng kolektibong singular sa Hebreo, at pinanatili ang teknikal na bigat ng חרם sa pariralang “itinalaga sa pagkalipol.”
