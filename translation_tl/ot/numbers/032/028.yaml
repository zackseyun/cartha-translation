  source_fidelity: Tapat ang salin sa וַיְצַו bilang “nagbigay ... ng mga utos,” at malinaw na ipinapakita ng “tungkol sa kanila” ang pinakamalamang na ugnayan ng לָהֶם sa mga Rubenita at Gadita sa naunang konteksto. Napananatili ng talababa ang lehitimong alternatibong pagbasa na ang panghalip ay maaaring tumukoy sa mga pinunong kasunod na binanggit. Kumpleto at wasto ang pagtukoy kina Eleazar, Josue na anak ni Nun, at sa mga pinunong panlipi.
  naturalness: Likas at malinaw ang modernong Filipino. Ang “kina Eleazar na pari, Josue na anak ni Nun” ay idiomatiko, at ang “mga pinuno ng mga angkan ng mga lipi ng Israel” ay nauunawaan nang walang di-kailangang teknikal na pananalita.
  terminology: Ang “pari,” “angkan,” “lipi,” at mga pangalang “Eleazar,” “Josue,” at “Nun” ay angkop sa marangal ngunit makabagong rehistro. Ang tala b ay sapat na nagpapaliwanag ng mas siksik na katawagang pang-organisasyon sa Hebreo nang hindi ipinipilit ang isang partikular na rekonstruksiyon ng estrukturang panlipi.
