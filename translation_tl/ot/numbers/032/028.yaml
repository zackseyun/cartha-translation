base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: tl
  text: Kaya nagbigay si Moises ng mga utos tungkol sa kanila[a] kina Eleazar na pari, Josue na anak ni Nun, at sa mga pinuno ng mga angkan ng mga lipi ng Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “inutusan sila,” kung ang “sila” ay tumutukoy sa mga pinunong pinangalanan sa talata at hindi sa mga liping binanggit bago nito.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga pinuno ng mga sambahayan ng mga ama ng mga lipi ng mga anak ni Israel”—isang katawagang pangpamamahala para sa mga pinuno ng mga angkan at lipi ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: nagbigay ... ng mga utos
  rationale: Ipinahahayag nito ang awtoritatibong diwa ng pandiwang צוה at likas itong ikinakabit sa mga tumanggap ng utos sa Filipino.
- source_word: לָהֶם
  choice: tungkol sa kanila
  rationale: Malamang na tumutukoy ang panghalip sa mga lipi nina Ruben at Gad na binanggit sa naunang konteksto; pinananatili rin ng salin ang posibilidad na may ibang pagbasa sa kayarian.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: kina Eleazar na pari
  rationale: Ipinakikilala ng אֵת si Eleazar at ang kasunod na mga pinuno bilang mga taong binigyan ni Moises ng utos; ang “kina” ay natural sa Filipino para sa maramihang pangalang pantangi.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josue na anak ni Nun
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan at tuwirang isinalin ang patronimiko.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: mga pinuno ng mga angkan ng mga lipi
  rationale: Ang parirala ay tumutukoy sa mga pinuno sa kaayusang pang-angkan at panlipi; malinaw ito sa karaniwang mambabasa nang hindi inaalis ang antas ng organisasyong nasa Hebreo.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ng Israel
  rationale: Sa kontekstong panlipi, ang “Israel” ay natural at marangal na katumbas ng idyomang Hebreo na literal na “mga anak ni Israel,” nang hindi nagpapahiwatig na mga lalaking anak lamang ang tinutukoy.
theological_decisions:
- issue: Kung ang לָהֶם ay nangangahulugang “tungkol sa kanila” o tumutukoy sa mga pinunong inutusan
  choice: tungkol sa kanila
  alternative: sa kanila / inutusan sila
  rationale: Sa agarang konteksto, pinakamalamang na ang panghalip ay tumutukoy sa mga Rubenita at Gadita na paksa ng mga tagubilin. Gayunman, tunay na posible sa sintaks na iugnay ito sa mga pinunong pinangalanan, kaya itinala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagbigay ... ng mga utos” upang maging natural ang pagkakaugnay ng paksa, paksa ng utos, at mga tatanggap nito. Ang “angkan” at “lipi” ay nagpapanatili sa panlipi at panangkan na balangkas nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
