  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: tl
  text: Narito, kayo ay bumangon bilang kapalit ng inyong mga ninuno—isang salinlahi ng makasalanang mga lalaki[a]—upang lalo pang dagdagan ang nag-aalab na galit ni Yahweh laban sa Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong salitang isinaling “salinlahi” ay maaari ring mangahulugang “pagdami” o “supling.” Sa kontekstong ito, may mapanumbat na himig ito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “dagdagan pa ang nag-aalab na ilong ni Yahweh laban sa Israel,” isang Hebreong idyoma para sa matinding galit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At masdan ninyo
  rationale: Pinananatili ang mariing pantawag-pansin ng הִנֵּה sa natural ngunit marangal na Filipino.
- source_word: קַמְתֶּם תַּחַת אֲבֹתֵיכֶם
  choice: kayo ang bumangon bilang kapalit ng inyong mga ninuno
  rationale: Ipinahahayag ang pagbangon ng kasalukuyang salinlahi bilang kahalili ng naunang salinlahi, habang pinananatili ang mapanumbat na larawan ng קום.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: isang lahi ng mga makasalanang lalaki
  rationale: Ang bihirang תַּרְבּוּת ay maaaring tumukoy sa pagdami o supling; ang 'lahi' ay angkop sa salinlahing konteksto at ang 'mga lalaki' ay tumutugma sa tahasang panlalaking אֲנָשִׁים.
- source_word: לִסְפּוֹת עוֹד עַל חֲרוֹן אַף
  choice: upang lalo pang pag-alabin ang matinding galit
  rationale: Natural na inilalarawan sa Filipino ang pagdaragdag sa umiiral nang nag-aalab na galit, nang hindi pilit na isinasalin ang Hebreong idyoma tungkol sa nag-aapoy na ilong.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang Yahweh ang Tetragrammaton sa teksto.
- source_word: אֶל יִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa konteksto ng galit, ipinakikita ng אֶל ang pinatutungkulan nito; natural itong ipinahahayag bilang 'laban sa Israel.'
theological_decisions:
- issue: Paglalarawan sa galit ni Yahweh
  choice: matinding galit ni Yahweh
  alternative: nag-aalab na galit ni Yahweh
  rationale: Pinananatili ang tindi ng חֲרוֹן אַף nang hindi ipinapalagay na ang galit ay di-matuwid o di-makatarungan.
- issue: Kasarian sa אֲנָשִׁים חַטָּאִים
  choice: mga makasalanang lalaki
  alternative: mga makasalanang tao
  rationale: Tahasang panlalaki ang Hebreo at ang kausap sa konteksto ay mga lalaking pinuno ng mga lipi; kaya hindi ito ginawang neutral.
translation_notes:
  register: Makabago at marangal na Filipino, na may mariing tono ng pagsaway. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” dahil salinlahing paghahalili ang tinutukoy. Lahat ng talababa ay minarkahan sa pangunahing teksto.
