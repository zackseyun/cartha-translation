  terminology: Pinananatili ang “Yahweh,” “Israel,” at ang tahasang panlalaking “mga lalaki.” Ang “nag-aalab na galit” ay natural na katumbas ng חֲרוֹן אַף at pinananatili ang metapora ng pag-aalab.
