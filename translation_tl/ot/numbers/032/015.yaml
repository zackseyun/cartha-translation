  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י תְשׁוּבֻ/ן֙ מֵֽ/אַחֲרָ֔י/ו וְ/יָסַ֣ף ע֔וֹד לְ/הַנִּיח֖/וֹ בַּ/מִּדְבָּ֑ר וְ/שִֽׁחַתֶּ֖ם לְ/כָל הָ/עָ֥ם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: tl
  text: Sapagkat kung tatalikod kayo sa pagsunod sa kanya[a], muli niyang iiwan ito sa ilang[b], at ipapahamak ninyo ang buong bayang ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa likuran niya,” isang idyoma na nangangahulugang tumigil sa pagsunod sa kanya.
    reason: lexical_alternative
  - marker: b
    text: 'Isahan ang panghalip sa Hebreo: “iiwan ito sa ilang.” Malamang na kolektibo itong tumutukoy sa Israel o sa bayan. Isinasalin naman ito ng iba bilang “iiwan sila” o “iiwan ang Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat kung
  rationale: Pinananatili nito kapwa ang paliwanag na kaugnayan sa naunang babala at ang kondisyunal na diwa ng sugnay.
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: tatalikod kayo sa pagsunod sa kanya
  rationale: Ang שוב kasama ng מֵאַחֲרָיו ay tumutukoy sa pagtalikod o pagtigil sa pagsunod, hindi lamang sa pisikal na pagbabalik. Likas sa modernong Tagalog ang pariralang ito.
- source_word: וְיָסַף עוֹד
  choice: muli niyang
  rationale: Ang pagsasama ng יסף at עוד ay idyomang nagsasaad na muling gagawin ang isang bagay.
- source_word: לְהַנִּיחוֹ
  choice: iiwan ito
  rationale: Ang Hiphil ng נוח ay maaaring mangahulugang hayaang manatili o iwan. Pinananatili ng “ito” ang isahang panghalip ng Hebreo, na malamang na kolektibong tumutukoy sa Israel o sa bayan.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, marangal, at angkop na katumbas ng מִדְבָּר sa salaysay ng paglalakbay ng Israel.
- source_word: וְשִׁחַתֶּם
  choice: ipapahamak ninyo
  rationale: Ipinahahayag nito ang mapanirang bunga na idudulot ng mga kinakausap sa buong bayan, nang hindi nililimitahan ang kahulugan sa agarang pisikal na paglipol.
- source_word: לְכָל הָעָם הַזֶּה
  choice: ang buong bayang ito
  rationale: Ang “bayan” ay likas na kolektibong pangngalan sa Tagalog at malinaw na kumakatawan sa lahat ng taong tinutukoy.
theological_decisions:
- issue: Tinutukoy ng isahang hulapi sa לְהַנִּיחוֹ
  choice: Pinanatili ang isahang anyo bilang “ito,” na kolektibong tumutukoy sa Israel o sa bayan.
  alternative: 'Gawing maramihan: “iiwan niya sila sa ilang,” o tahasang sabihing “iiwan niya ang Israel sa ilang.”'
  rationale: Isahan ang panghalip sa tekstong Hebreo. Ang pagpapanatili nito ay hindi tahimik na nagpapakinis sa tunay na anyo at kalabuan ng pinagmulan; nililinaw ng talababa ang malamang na kolektibong gamit.
- issue: Lakas ng kahulugan ng וְשִׁחַתֶּם
  choice: ipapahamak ninyo
  alternative: lilipulin ninyo; sisirain ninyo
  rationale: Ang “ipapahamak” ay nagpapanatili sa pananagutan ng mga kinakausap sa kapahamakang sasapit sa bayan, ngunit hindi ipinapalagay na pisikal na paglipol lamang ang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kayo” para sa maramihang kausap, “sa kanya” para sa personal na reperensiya, at “bayan” bilang likas na kolektibong katawagan. Pinanatili sa pangunahing teksto ang isahang panghalip na “ito,” kalakip ang paliwanag upang hindi mawala ang anyo at posibleng kolektibong diwa ng Hebreo.
