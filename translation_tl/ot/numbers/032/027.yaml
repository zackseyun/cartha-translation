  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: tl
  text: Ngunit tatawid ang iyong mga lingkod—bawat isa na armado para sa digmaan—sa harap ni Yahweh upang makipagdigma[a], gaya ng sinasabi ng aking panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa digmaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: Ngunit ... ang iyong mga lingkod
  rationale: Ang עֶבֶד ay tumutukoy rito sa mga nagsasalita bilang magalang na mga nasasakupan ni Moises; ang “mga lingkod” ay angkop, at ipinahihiwatig ng “Ngunit” ang pagtugon sa naunang pangamba.
- source_word: יַעַבְרוּ
  choice: tatawid
  rationale: Ang עבר ay tumutukoy sa pagtawid patungo sa lugar ng kampanyang militar; natural at malinaw sa Tagalog ang “tatawid.”
- source_word: כָּל חֲלוּץ צָבָא
  choice: bawat lalaking nasasandatahan para sa pakikipagdigma
  rationale: Distributibo ang כָּל sa kasunod na anyong isahan, at ang חֲלוּץ צָבָא ay isang taong nasangkapan o nasandatahan para sa tungkuling militar.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang literal na diwang “sa harap/sa presensya” at ang pahiwatig na ang kampanya ay isinasagawa sa presensya at ilalim ng awtoridad ni Yahweh.
- source_word: לַמִּלְחָמָה
  choice: upang makipagdigma
  rationale: Ang lamed ay maaaring magpahayag ng layunin o tunguhin; natural na inilalahad sa Tagalog ng “upang makipagdigma” ang layuning militar nang hindi dinaragdagan ang diwa.
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: gaya ng sinasabi ng aking panginoon
  rationale: Ang כַּאֲשֶׁר ay paghahambing o pag-ayon, ang אֲדֹנִי ay magalang na tawag kay Moises, at ang participle na דֹּבֵר ay angkop na ilahad sa kasalukuyang “sinasabi.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng לִפְנֵי יְהוָה sa kampanyang militar
  choice: sa harap ni Yahweh
  alternative: sa presensya ni Yahweh
  rationale: Pinananatili ng “sa harap” ang kongkretong larawan at ang teolohikal na pahiwatig ng presensya at awtoridad ng Diyos, nang hindi tahasang nilulutas ang lawak ng kahulugan nito.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “aking panginoon” bilang magalang na tawag kay Moises, samantalang ang “Yahweh” ay malinaw na banal na pangalan. Ang mga gitling na pahaba ay naghihiwalay sa panuring na militar upang luminaw ang daloy ng pangungusap.
