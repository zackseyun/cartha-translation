  language: tl
  text: at ang Atarot-Sofan[a], at ang Jazer, at ang Jogbehah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Atrot-Sofan.” Tambalang pangalan ito ng isang lugar, at nagkakaiba ang paraan ng pagsasatitik nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: at ang
  rationale: Isinalin ang וְ bilang “at,” samantalang ang אֶת ay walang hiwalay na katumbas sa Tagalog; ginagamit ang “ang” upang likas na markahan ang mga pangalang kabilang sa talaan.
- source_word: עַטְרֹת שׁוֹפָן
  choice: Atarot-Sofan
  rationale: Tambalang pangalan ito ng isang lugar, kaya tinumbasan sa paraang transliterasyon. Ang “Atarot-Sofan” ay malinaw sa bigkas ng modernong Filipino at mas malapit sa buong anyong Hebreo kaysa sa pinaikling “Atrot-Sofan.”
- source_word: יַעְזֵר
  choice: Jazer
  rationale: Pangalan ito ng lugar. Pinanatili ang nakasanayang anyong “Jazer,” na madaling makilala sa mga saling biblikal sa Filipino.
- source_word: יָגְבֳּהָה
  choice: Jogbeha
  rationale: Pangalan ito ng lugar at isinalin sa paraang transliterasyon. Ang “Jogbeha” ay natural basahin sa Filipino at kumakatawan sa Hebreong pangalan nang hindi dinaragdagan ng kahulugan.
