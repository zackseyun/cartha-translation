  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהוָה֙ לִ/פְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְ/לַֽ/עֲבָדֶ֖י/ךָ מִקְנֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: tl
  text: Ang lupaing nilupig ni Yahweh sa harap ng kapulungan ng Israel[a] ay isang lupaing angkop para sa mga alagang hayop[b], at ang iyong mga lingkod ay may mga alagang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pamayanan ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “isang lupain para sa mga alagang hayop.” Saklaw ng salitang Hebreo ang iba’t ibang uri ng alagang hayop, hindi lamang mga baka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: Ang lupain
  rationale: Tumutukoy ito sa tiyak na teritoryong pinag-uusapan; natural at malinaw ang “lupain” sa kontekstong heograpiko.
- source_word: הִכָּה
  choice: nilupig
  rationale: Ang נכה ay literal na “humampas” ngunit madalas tumutukoy sa paggapi sa digmaan. Dahil lupain ang layon ng pandiwa, mas natural sa Filipino ang “nilupig” kaysa “hinampas,” nang hindi inaalis ang puwersa ng pagkilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili ang karaniwang diwang pansalikop na “sa harap ng” o “sa presensiya ng,” na nagpapakitang nasaksihan ng Israel ang pagkilos ni Yahweh.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: kapulungan ng Israel
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanan o kapulungan; ang “kapulungan” ay malinaw at hindi labis na panrelihiyon ang dating.
- source_word: אֶרֶץ מִקְנֶה
  choice: angkop sa mga alagang hayop
  rationale: Ipinahihiwatig ng parirala na ang lupain ay bagay sa pagpapastol o pag-aalaga ng hayop. Natural ito sa Filipino at hindi nililimitahan ang מִקְנֶה sa baka lamang.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: at ang iyong mga lingkod ay may mga alagang hayop
  rationale: Ipinapahayag ng לְ ang pag-aari; ang hulma na “may” ang pinakanatural na paraan nito sa Filipino habang pinananatili ang mapagpakumbabang pagtukoy nila sa sarili bilang mga lingkod.
theological_decisions:
- issue: Paglalarawan sa pagkilos ni Yahweh laban sa lupain
  choice: nilupig ni Yahweh
  alternative: hinampas ni Yahweh
  rationale: May diwang militar ang נכה sa konteksto. Ang “nilupig” ay hindi nagpapakahulugang ang lupa mismo ay pisikal na hinampas, ngunit hindi rin inililihis ang pagkilos tungo sa isang tahasang paliwanag tungkol sa eksaktong paraan ng paggapi.
- issue: Pagbigkas sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang ginagamit sa tekstong Hebreo ang banal na pangalan; kaya pinananatili itong pangalan sa salin sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “mga alagang hayop” bilang malawak na katawagan sa livestock at iniwasan ang mas makitid na “mga baka.”
