  terminology: Ang “Yahweh,” “mga anak ni Gad ... Ruben,” “Gilead,” at “bilang pag-aari” ay angkop at tapat sa teksto. Pinanatili ang “sa harap ni Yahweh” upang huwag dagdagang ipaliwanag ang saklaw ng לִפְנֵי יהוה.
