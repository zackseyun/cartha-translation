revisions:
- from: At sinabi ni Moises sa kanila, “Kung tatawid sa Jordan kasama ninyo ang mga anak ni Gad at ang mga anak ni Ruben—ang bawat lalaking nasasandatahan para sa labanan sa harap ni Yahweh—at mapasailalim sa kapangyarihan ninyo ang lupain, ibibigay ninyo sa kanila ang lupain ng Gilead bilang pag-aari.”
  to: At sinabi ni Moises sa kanila, “Kung tatawid kasama ninyo sa Ilog Jordan ang mga anak ni Gad at ang mga anak ni Ruben, bawat lalaking may sandata para sa labanan sa harap ni Yahweh, at mapasailalim sa inyo ang lupain, ibibigay ninyo sa kanila ang lupain ng Gilead bilang pag-aari.”
  rationale: Pinalitan ang di-likas na “nasasandatahan” ng payak at tumpak na “may sandata,” nang hindi pinalalawak ang saklaw ng mga mandirigma. Ginawang “Ilog Jordan” ang pangalan ng ilog para sa karaniwang gamit sa modernong Tagalog. Pinanatili ang kondisyunal na ayos, ang pasibong/resultatibong diwa ng pagsupil sa lupain, at ang kalabuan ng “sa harap ni Yahweh.”
