source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: tl
  text: At sinabi ni Moises sa kanila, “Kung tatawid kasama ninyo sa Ilog Jordan ang mga anak ni Gad at ang mga anak ni Ruben, bawat lalaking may sandata para sa labanan sa harap ni Yahweh, at mapasailalim sa inyo ang lupain, ibibigay ninyo sa kanila ang lupain ng Gilead bilang pag-aari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Likas na panimulang salaysay sa Tagalog na nagpapanatili sa daloy ng Hebreong wayyiqtol.
- source_word: אִם
  choice: Kung
  rationale: Malinaw na naghahayag ng tunay na kondisyon na kailangang matupad bago ipagkaloob ang lupain.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: ang mga anak ni Gad at ang mga anak ni Ruben
  rationale: Pinananatili ang pormal na pananalita tungkol sa angkan at ang pag-uulit ng Hebreo, sa halip na gawing mga katawagang pantribo.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: tatawid sa Jordan
  rationale: Natural at tumpak na salin ng pagtawid sa ilog sa modernong Tagalog.
- source_word: אִתְּכֶם
  choice: kasama ninyo
  rationale: Direktang ipinahahayag ang pakikisama sa pagtawid at pakikidigma.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: ang bawat lalaking nasasandatahan para sa labanan
  rationale: Ipinakikita ang kahulugang militar ng חָלוּץ bilang isang taong handa at nasangkapan para sa pakikipaglaban.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang pananalitang tumutukoy sa pagkilos sa presensiya at ilalim ng pagkilala kay Yahweh.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ לִפְנֵיכֶם
  choice: at mapasailalim sa kapangyarihan ninyo ang lupain
  rationale: Pinananatili ang pasibo at resultang diwa ng Niphal ng כבש, ngunit iniiwasan ang di-likas na literal na 'masupil sa harap ninyo.'
- source_word: וּנְתַתֶּם לָהֶם
  choice: ibibigay ninyo sa kanila
  rationale: Ang kasunod na sugnay ay malinaw nang resulta ng kondisyong sinimulan ng 'kung'; hindi kailangang idagdag ang 'kung gayon.'
- source_word: לַאֲחֻזָּה
  choice: bilang pag-aari
  rationale: Tumutukoy sa lupaing ipinagkaloob upang hawakan bilang permanenteng pag-aari o mana ng tribo.
theological_decisions:
- issue: Paglalapat ng pariralang לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  alternative: sa presensiya ni Yahweh
  rationale: Ang 'sa harap ni Yahweh' ay nagpapanatili sa Hebreong larawan at sa teolohikal na diwa nang hindi nililinaw nang labis kung ito ay liturhikal, tipanang, o pangkalahatang banal na presensiya.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Isinasalin bilang personal na pangalang Yahweh upang maging malinaw na banal na pangalan, hindi isang titulo, ang nasa tekstong Hebreo.
- issue: Katangian ng pagkakaloob sa Gilead
  choice: bilang pag-aari
  alternative: bilang mana
  rationale: Ang אֲחֻזָּה ay lupang pag-aari o hawak na bahagi; ang 'pag-aari' ay hindi nagdaragdag ng mas tiyak na teolohikal na diwa ng mana bagaman maaaring kasama iyon sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na 'mga anak ni Gad/Ruben,' samantalang ginawang natural ang Hebreong idyoma sa pagsupil sa lupain. Walang talababa dahil walang dagdag na paliwanag na kailangan upang mapanatili ang mahalagang kalabuan ng talata.
