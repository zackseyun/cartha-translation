translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “mga bayan” sa halip na mas urbanong “mga lungsod,” at “maliliit na anak” upang mapanatili ang natatanging diwa ng טַף. Inilagay ang pananda ng talababa kaagad pagkatapos ng pariralang tinutukoy nito.
