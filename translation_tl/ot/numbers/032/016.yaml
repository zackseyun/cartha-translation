  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: tl
  text: Pagkatapos, lumapit sila sa kanya at sinabi nila, “Magtatayo kami rito ng mga kulungan ng tupa para sa aming mga alagang hayop at mga lunsod para sa mga maliliit naming anak.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak.” Ang Hebreong טַף ay tumutukoy sa maliliit na anak o mga umaasa sa sambahayan, at madalas na nagbibigay-diin sa mahihinang kasapi ng pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: lumapit sila sa kanya
  rationale: Tuwirang ipinapahayag ang pisikal na paglapit sa kausap sa natural na modernong Tagalog.
- source_word: וַיֹּאמְרוּ
  choice: at sinabi
  rationale: Karaniwang panandang pasalaysay na nagpapakilala sa tuwirang pananalita.
- source_word: גִּדְרֹת צֹאן
  choice: mga kulungan
  rationale: Tumutukoy sa mga bakod o kulungan ng kawan; sapat na malinaw sa kasunod na pariralang “para sa aming mga kawan” at natural sa Tagalog.
- source_word: נִבְנֶה
  choice: magtatayo kami
  rationale: Ang imperfect na unang panauhang maramihan ay nagpapahayag dito ng balak o panukala.
- source_word: לְמִקְנֵנוּ
  choice: para sa aming mga kawan
  rationale: Ang מִקְנֶה ay malawak na tumutukoy sa mga alagang hayop; sa pastoral na konteksto, “mga kawan” ang natural at hindi naglilimita sa baka lamang.
- source_word: פֹּה
  choice: rito
  rationale: Natural na katumbas ng simpleng pang-abay na panlunan, ayon sa pananaw ng nagsasalita.
- source_word: וְעָרִים
  choice: at ng mga bayan
  rationale: Maaaring tumukoy ang עָרִים sa mga lungsod o nakukutaang pamayanan; “mga bayan” ang mas natural at hindi labis na nagpapahiwatig ng malalaking lungsod.
- source_word: לְטַפֵּנוּ
  choice: para sa aming maliliit na anak
  rationale: Pinananatili ang diin ng טַף sa maliliit at mahihinang kasapi ng sambahayan, habang nananatiling malinaw sa ordinaryong mambabasa.
