  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: tl
  text: Ngunit kami mismo ay agad na magsasandata at mauuna sa mga Israelita[a] hanggang sa maihatid namin sila sa kanilang lugar. Maninirahan ang mga bata namin[b] sa mga napapaderang lungsod dahil sa mga naninirahan sa lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa harap ng mga anak ni Israel”; malamang na tumutukoy ito sa pagpunta nila sa unahan ng mga Israelita sa labanan.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay kolektibong tumutukoy sa mga bata at maaari ring sumaklaw sa iba pang dependente.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ חֻשִׁים
  choice: mabilis na sasandatahan
  rationale: Ang Niphal ng חלץ ay may reflexive o middle na diwa rito—ihahanda at sasandatahan nila ang kanilang sarili—samantalang ang חֻשִׁים ay nagpapahiwatig ng pagmamadali o agarang kahandaan.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: mangunguna sa mga Israelita
  rationale: Sa kontekstong militar, ang literal na 'sa harap ng mga anak ni Israel' ay malamang na nangangahulugang mauuna sila sa hukbo. Likas at malinaw sa modernong Tagalog ang 'mangunguna sa mga Israelita,' habang inilalagay sa talababa ang literal na anyo.
- source_word: עַד אֲשֶׁר אִם הֲבִיאֹנֻם
  choice: hanggang sa madala namin sila
  rationale: Ang pariralang עַד אֲשֶׁר אִם ay idiomatikong nagtatakda ng hangganan ng kilos, at ang Hiphil ng בוא ay 'magdala' o 'papuntahin.'
- source_word: אֶל מְקוֹמָם
  choice: sa kanilang lugar
  rationale: Pinananatili nito ang malawak na kahulugan ng מָקוֹם, na maaaring tumukoy sa kanilang hantungan o lupaing pananahanan nang hindi ito labis na tinutukoy.
- source_word: טַפֵּנוּ
  choice: aming mga anak at iba pang umaasa sa amin
  rationale: Ang kolektibong טַף ay mas malawak kaysa maliliit na bata lamang at maaaring sumaklaw sa mga anak at iba pang dependente; nililinaw ito sa natural na Tagalog.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: sa mga napapaderang lungsod
  rationale: Tumutukoy ang parirala sa mga lungsod na pinatibay para sa pagtatanggol. Ang 'napapaderang lungsod' ay malinaw at likas sa kontekstong sinauna.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: upang maligtas sa mga naninirahan sa lupaing ito
  rationale: Ipinahihiwatig ng מִפְּנֵי ang banta o panganib na nagmumula sa mga naninirahan sa lupain; ginagawang tahasan ng salin ang layuning pangkaligtasan na malinaw sa konteksto ng mga napapaderang lungsod.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'mga Israelita' sa halip na literal na 'mga anak ni Israel' sa pangunahing teksto para sa likas na daloy, habang pinanatili ang literal na anyo sa talababa. Ang 'Samantala' ay nagpapalinaw sa magkasabay na kalagayan ng mga mandirigma at ng mga naiwan sa mga lungsod.
