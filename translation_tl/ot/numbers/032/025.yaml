  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: tl
  text: At sinabi ng mga anak ni Gad at ng mga anak ni Ruben kay Moises, “Gagawin ng iyong mga lingkod ang anumang iutos ng aking panginoon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: mga anak ni Gad at mga anak ni Ruben
  rationale: Pinananatili ang literal na katawagang Hebreo sa mga pangkat pantribo, sa natural na anyong Tagalog.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Ang “mga lingkod” ay angkop sa magalang at masunuring pagtukoy nila sa sarili sa harap ni Moises.
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Tumutukoy ito kay Moises bilang taong may awtoridad, hindi sa banal na pangalang YHWH; kaya maliit ang titik sa “panginoon.”
- source_word: מְצַוֶּה
  choice: iniuutos
  rationale: Ipinahahayag ang kasalukuyang pag-uutos ni Moises at ang pananagutan nilang sumunod.
theological_decisions:
- issue: Ang tinutukoy ng אֲדֹנִי
  choice: aking panginoon
  alternative: Panginoon
  rationale: Ang kausap at tagapag-utos sa konteksto ay si Moises. Hindi ito ang banal na pangalang YHWH, kaya hindi ginawang titulong pantukoy sa Diyos.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na himig. Inalis ang hiwalay na literal na “na sinasabi” para maiwasan ang di-likas na pag-uulit sa Tagalog; naipapahayag na ito ng tuwirang sipi. Pinanatili ang paglipat mula “iyong mga lingkod” tungo sa “aking panginoon,” gaya ng Hebreo.
