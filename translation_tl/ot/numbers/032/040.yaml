  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: tl
  text: At ibinigay ni Moises ang Gilead kay Makir na anak ni Manases, at nanirahan siya roon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumira siya roon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Tuwirang ipinapahayag ng נתן ang pagbibigay; hindi na dinaragdagan ng administratibong diwa gaya ng “itinalaga.”
- source_word: הַגִּלְעָד
  choice: ang Gilead
  rationale: Pinanatili ang kilalang pangalang pook at ginamit ang “ang” bilang likas na pananda sa Tagalog.
- source_word: לְמָכִיר
  choice: kay Makir
  rationale: Ang לְ ay tumutukoy sa tumanggap; “kay Makir” ang likas na anyo sa Tagalog para sa pangalang pantangi ng tao.
- source_word: בֶּן מְנַשֶּׁה
  choice: na anak ni Manases
  rationale: Tuwirang isinasalin ang בֶּן bilang “anak”; walang sapat na dahilan upang palawakin ito bilang “inapo.”
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Saklaw ng ישב ang paninirahan o pagtira. Ang “nanirahan” ay natural sa konteksto ng pag-angkin at pagtira sa lupain, habang hindi labis na nililinaw kung ito ay unang pagkatatag ng pamayanan.
- source_word: בָּהּ
  choice: roon
  rationale: Tumutukoy ang hulaping pambabae pabalik sa Gilead bilang lupain o rehiyon; mas natural sa Tagalog ang “roon” kaysa “dito/sa loob nito.”
