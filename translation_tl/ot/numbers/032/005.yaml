base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: tl
  text: Sinabi nila, “Kung nakasumpong kami ng lingap sa iyong paningin, ibigay nawa sa iyong mga lingkod ang lupaing ito bilang pag-aari. Huwag mo kaming patawirin sa Ilog Jordan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag mo kaming dalhin sa kabila ng Jordan.” Ang pandiwang Hebreo ay causative at maaaring isalin sa ilang magkakalapit na paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: nakasumpong kami ng lingap sa iyong paningin
  rationale: Pinananatili ang karaniwang idyomang Hebreo ng pagtanggap ng mabuting pagtingin, habang gumagamit ng marangal at malinaw na Tagalog.
- source_word: יֻתַּן
  choice: ibigay nawa
  rationale: Ipinahahayag ang magalang na pakiusap ng anyong passive/jussive nang hindi ito ginagawang tuwirang utos.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ang lupaing ito
  rationale: Ang “lupain” ay tuwiran at natural para sa teritoryong hinihingi bilang permanenteng pag-aari.
- source_word: לַעֲבָדֶיךָ
  choice: sa iyong mga lingkod
  rationale: Dito ang עבד ay mapagpakumbabang pagtukoy ng mga nagsasalita sa kanilang sarili, hindi pagbibigay-diin sa kalagayang alipin.
- source_word: לַאֲחֻזָּה
  choice: bilang pag-aari
  rationale: Malinaw nitong ipinahahayag ang lupang hahawakan bilang permanenteng pag-aari nang hindi ipinapasok ang mas tiyak na konsepto ng mana.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: Huwag mo kaming patawirin sa Jordan
  rationale: Ang “patawirin” ay natural na Tagalog na nagpapanatili sa causative na diwa ng Hiphil ng עבר; maaari itong magpahiwatig ng pagpapatawid o pagdadala sa kabila.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pormulang magalang na pakiusap at ang causative na diwa ng huling pandiwa. Walang talababa sapagkat sapat na naipapaloob ng “patawirin” ang saklaw ng Hebreo nang hindi kinakailangang pumili sa pagitan ng “make cross” at “bring across.”
