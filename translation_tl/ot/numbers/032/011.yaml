  source_fidelity: Kailangang itama ang “isinumpa kong ibibigay.” Sa modernong Filipino, ang “isinumpa” ay karaniwang nangangahulugang ‘cursed,’ hindi ‘swore,’ at ang “ibibigay” ay hindi hayagang nasa Hebreo. Ang binagong pananalita ay malinaw na naghahayag ng panunumpa at ng ipinangakong lupain nang hindi nagdaragdag ng pandiwang wala sa teksto. Pinalitan din ang “umalis mula sa Egipto” ng “lumabas mula sa Egipto,” na mas tumpak para sa kontekstong Exodo kaysa sa pangkalahatang ‘umalis.’
  naturalness: Natural, malinaw, at marangal ang binagong Filipino. Ang “lupaing ipinangako ko sa pamamagitan ng panunumpa” ay idiomatiko at iniiwasan ang maling kahulugang ‘isinumpa.’
  terminology: Pinanatili ang “mga lalaki,” “Egipto,” “lupain,” at “lubos na sumunod sa akin.” Ang “ipinangako ko sa pamamagitan ng panunumpa” ay wastong naghahatid ng נִשְׁבַּעְתִּי sa kontekstong ito.
