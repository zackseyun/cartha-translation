base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: tl
  text: “Walang sinuman sa mga lalaking lumabas mula sa Egipto[a], mula dalawampung taong gulang pataas, ang makakakita sa lupaing ipinangako ko sa pamamagitan ng panunumpa kina Abraham, Isaac, at Jacob, sapagkat hindi sila lubos na sumunod sa akin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal na ginagamit ang pormula ng panunumpa na may “kung”: “kung makikita ng mga lalaki ... ang lupain.” Nagpapahiwatig ito ng mariing pagtanggi: “walang sinuman ... ang makakakita.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “hindi sila sumunod sa akin nang lubusan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Walang sinuman ... ang makakakita
  rationale: Sa pormula ng panunumpa, ang אִם ay nagpapahiwatig ng mariing pagtanggi. Ang tuwirang “kung” ay magiging malabo sa Tagalog, kaya inihayag ang ipinahihiwatig na negatibong diwa.
- source_word: יִרְאוּ
  choice: makakakita
  rationale: Ang ראה rito ay literal na “makakita,” na sa konteksto ay nagpapahiwatig din ng pagpasok at pagtatamasa sa lupain; pinanatili ang payak na salita upang hindi palawakin ang teksto.
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Tiyak na panlalaking maramihan ang Hebreo at ang konteksto ay tungkol sa mga lalaking nasa edad ng senso at pakikidigma.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: umalis mula sa Egipto
  rationale: Ang עלה מן sa konteksto ng Exodo ay tumutukoy sa pag-ahon o pag-alis mula sa Egipto. Mas natural sa makabagong Tagalog ang “umalis mula” kaysa sa literal na “umahon mula.”
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Natural at tumpak itong katumbas ng pormula ng hangganan ng edad sa Hebreo.
- source_word: הָאֲדָמָה
  choice: lupain
  rationale: Bagaman maaari itong mangahulugang lupa o sukal, sa kontekstong tipan ay tumutukoy ito sa teritoryong ipinangako.
- source_word: נִשְׁבַּעְתִּי
  choice: isinumpa kong ibibigay
  rationale: Pinananatili ng “isinumpa” ang pormal at taimtim na diwa. Idinagdag ang “ibibigay” bilang likas na Tagalog na pagpapahayag ng bagay na ipinangako sa mga patriyarka, habang hindi binabago ang tinutukoy na lupain.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kay Abraham, kay Isaac, at kay Jacob
  rationale: Inuulit ang “kay” upang mapanatili ang pormal na indayog at ang bawat preposisyon sa Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito rito ng dahilan ng hatol; ang “sapagkat” ay malinaw, marangal, at natural.
- source_word: לֹא מִלְאוּ אַחֲרַי
  choice: hindi sila lubos na sumunod sa akin
  rationale: Ang idyomang מלא אחרי ay nangangahulugang sumunod nang lubos. Pinananatili ng salin ang konkretong larawan ng pagsunod at iniiwasan ang mas malawak na interpretasyong “naging ganap na tapat.”
theological_decisions:
- issue: Pormula ng panunumpang nagsisimula sa אִם
  choice: Walang sinuman ... ang makakakita
  alternative: Kung makikita ng mga lalaki ... ang lupain
  rationale: Elliptical na negatibong panunumpa ito sa Hebreo. Ipinapahayag ng piniling salin ang mariing banal na hatol nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Saklaw ng idyomang לֹא מִלְאוּ אַחֲרַי
  choice: hindi sila lubos na sumunod sa akin
  alternative: hindi sila naging lubos na tapat sa akin
  rationale: Mas malapit sa larawan at kayarian ng Hebreo ang “lubos na sumunod,” samantalang ang “naging tapat” ay mas malawak at mas interpretatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Egipto” at mga pangalang Abraham, Isaac, at Jacob sa karaniwang anyong biblikal. Pinanatili ang panlalaking pagtukoy, ang solemnidad ng panunumpa, at ang konkretong wika ng lubos na pagsunod.
