id: NUM.32.7
reference: Numbers 32:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: tl
  text: At bakit ninyo pinahihina ang loob[a] ng mga anak ni Israel[b] para hindi sila tumawid patungo sa lupaing ibinigay sa kanila ni Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang puso”; dito, tumutukoy ito sa tapang o matatag na kapasiyahan.
    reason: lexical_alternative
  - marker: b
    text: O “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: At bakit
  rationale: Pinananatili ang pang-ugnay na וְ at ang puwersa ng tanong, na nagdurugtong sa pangungusap sa naunang sinabi ni Moises.
- source_word: תנואון אֶת לֵב
  choice: pinahihina ang loob
  rationale: Likas na idyomang Tagalog ito para sa pagpapanghina ng tapang o kapasiyahan. Pinananatili rin ng “loob” ang larawang antropolohikal ng Hebreong לֵב nang hindi nagiging pilit ang pangungusap.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa pamilyang-pambansang ekspresyon ng Hebreo at malinaw pa rin sa makabagong Tagalog; inilalagay sa talababa ang mas karaniwang “mga Israelita.”
- source_word: מֵעֲבֹר
  choice: para hindi sila tumawid
  rationale: 'Ipinahahayag nang natural sa Tagalog ang diwa ng pagpigil na nasa מִן kasama ng pawatas: ang pagpapahina ng loob ay naglalayong hadlangan ang kanilang pagtawid.'
- source_word: אֶל הָאָרֶץ
  choice: patungo sa lupain
  rationale: Ang “patungo sa” ay natural na nagpapahayag ng direksiyon ng pagtawid papasok sa lupaing tinutukoy.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: na ibinigay sa kanila
  rationale: Pinananatili ang ganap na kilos ng pandiwang נָתַן at ang diwa ng lupa bilang kaloob na naipagkaloob na sa Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang nasa Tetragrammaton sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa teksto.
- issue: Pambansang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang pamilyang anyo ng Hebreo, habang kinikilala sa talababa ang likas at kolektibong kahulugang “mga Israelita.”
- issue: Kahulugan ng “puso” sa אֶת לֵב
  choice: loob bilang tapang o kapasiyahan
  alternative: literal na puso
  rationale: Sa konteksto, ang “puso” ay sentro ng tapang at kapasiyahan. Ang “loob” ay natural na katumbas sa Tagalog at hindi nilulutas nang labis kung tapang, pasiya, o pagnanais ang pangunahing diin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na idyomang “pinahihina ang loob” at iniwasan ang sobrang literal na hulma na magiging asiwa sa Tagalog. Ang “mga anak ni Israel” ay nagpapanatili sa pamilyang-pambansang larawan ng Hebreo.
