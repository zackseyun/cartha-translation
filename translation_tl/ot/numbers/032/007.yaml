  source_fidelity: Tapat ang salin sa Hebreo. Ang “At bakit” ay wasto sa pang-ugnay na וְ at sa patanong na לָמָּה. Ang “pinahihina ang loob” ay natural at kontekstuwal na tumpak para sa Hiphil ng נוא na may לֵב; ang isahang “loob” ay maaari ring kolektibong tumukoy sa panloob na tapang o kapasiyahan ng buong bayan. Naipapahayag ng “para hindi sila tumawid patungo sa lupain” ang pagpigil na nasa מֵעֲבֹר, at ang “ibinigay sa kanila ni Yahweh” ay wastong naghahatid ng ganap na pagkakaloob sa teksto.
