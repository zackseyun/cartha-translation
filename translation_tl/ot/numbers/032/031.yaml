  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: tl
  text: Sumagot ang mga anak ni Gad at ang mga anak ni Ruben, “Kung ano ang sinabi ni Yahweh sa iyong mga lingkod, iyon ang gagawin namin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Sumagot
  rationale: Karaniwang ipinakikilala ng pandiwang ענה sa anyong pasalaysay ang tugon sa naunang sinabi; natural at tuwiran ang “sumagot” sa Filipino.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: ang mga anak ni Gad at ang mga anak ni Ruben
  rationale: Pinananatili ang dalawang tahasang pariralang pangkamag-anakan sa Hebreo, sa halip na gawing mga katawagang-etniko.
- source_word: לֵאמֹר
  choice: ipinahiwatig sa tuwirang pagsipi
  rationale: Sa modernong Filipino, hindi kailangang isalin nang hiwalay bilang “na sinasabi”; natural nang ipinakikilala ng “sumagot” at ng panipi ang mismong pahayag.
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: Kung ano ang ... iyon ang
  rationale: Tapat at natural na correlative construction sa Filipino, na pinananatili ang ugnayang “what/as ... so/that” ng Hebreo nang hindi dinaragdagan ang diwa.
- source_word: דִּבֶּר
  choice: sinabi
  rationale: Tumutukoy sa naunang pahayag ni Yahweh; sa Filipino, ang aspektong perpektibo na “sinabi” ay natural at sapat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh, hindi pinapalitan ng titulong “PANGINOON.”
- source_word: אֶל עֲבָדֶיךָ
  choice: sa iyong mga lingkod
  rationale: Magalang na pagtukoy ng mga nagsasalita sa kanilang sarili sa harap ni Moises; “mga lingkod” ang angkop kaysa “mga alipin” sa kontekstong ito.
- source_word: נַעֲשֶׂה
  choice: gagawin namin
  rationale: Tuwirang ipinapahayag ang pangakong isakatuparan ang sinabi, nang hindi nagdaragdag ng tahasang layon na wala sa pandiwang Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inalis ang hiwalay na salin ng לֵאמֹר dahil magiging mabigat at di-natural ang “sumagot, na sinasabi”; ang tuwirang panipi ay sapat na tagapagpakilala ng pagsasalita. Pinanatili ang “mga anak ni” para sa pormal na pagkakatulad sa Hebreo.
