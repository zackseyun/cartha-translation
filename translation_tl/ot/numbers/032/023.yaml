id: NUM.32.23
reference: Numbers 32:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תַעֲשׂוּ/ן֙ כֵּ֔ן הִנֵּ֥ה חֲטָאתֶ֖ם לַ/יהוָ֑ה וּ/דְעוּ֙ חַטַּאתְ/כֶ֔ם אֲשֶׁ֥ר תִּמְצָ֖א אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: tl
  text: Ngunit kung hindi ninyo iyon gagawin, narito, nagkasala kayo laban kay Yahweh; at alamin ninyo na matatagpuan kayo ng inyong kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aabutan kayo ng inyong kasalanan” o “matatagpuan kayo ng inyong pagkakasala.” Ipinahihiwatig ng Hebreong idyoma na hindi maiiwasan ang pagkakalantad at bunga ng kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahahayag nito ang pasubaling salungat sa naunang bilin; natural sa Tagalog ang “Ngunit kung.”
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: hindi ninyo iyon gagawin
  rationale: Ang “iyon” ay malinaw na tumutukoy sa ipinagagawang nabanggit sa naunang konteksto.
- source_word: הִנֵּה
  choice: narito
  rationale: Pinananatili nito ang mariin at mapagbababalang bisa ng Hebreong pantukoy nang hindi nagdaragdag ng paliwanag.
- source_word: חֲטָאתֶם
  choice: nagkasala kayo
  rationale: Tuwirang pandiwang salin ito ng חטא. Pinananatili ng aspektong naganap ang kasalanan bilang tiyak na kalagayang ibubunga ng hindi nila pagtupad.
- source_word: לַיהוָה
  choice: laban kay Yahweh
  rationale: Kasama ng pandiwang “magkasala,” tinutukoy ng pang-ukol ang Diyos bilang siyang pinagkasalahan; pinananatili rin ang tipanang pangalang Yahweh.
- source_word: וּדְעוּ
  choice: At dapat ninyong malaman
  rationale: Natural na ipinahahayag sa makabagong Tagalog ang maramihang pautos na malaman at kilalanin nang may katiyakan ang kasunod na babala.
- source_word: חַטַּאתְכֶם
  choice: inyong kasalanan
  rationale: Pinananatili ang pangunahing moral na kahulugan ng pangngalan, samantalang hindi isinasara ang kaugnay na diwa ng pagkakasala o pananagutan.
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: matatagpuan kayo
  rationale: 'Pinananatili ang kapansin-pansing personipikasyon at tunay na kalabuan ng Hebreong idyoma: ang kasalanan mismo ang tila makasusumpong sa nagkasala.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng kasalanan, pagkakalantad, at kaparusahan sa huling sugnay
  choice: matatagpuan kayo ng inyong kasalanan
  alternative: aabutan kayo ng inyong kasalanan / mabubunyag ang inyong kasalanan
  rationale: Hindi tahasang nililinaw ng Hebreo kung ang diin ay pagkakalantad, paghabol, o bunga ng kasalanan. Pinananatili ng pangunahing salin ang personipikasyon at teolohikal na tensiyon sa halip na pumili ng iisang paliwanag.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Bahagyang mataas ang “narito” upang mapanatili ang solemneng babala ng הִנֵּה, habang nananatiling madaling maunawaan ang kabuuang pangungusap.
