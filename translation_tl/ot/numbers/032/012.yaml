id: NUM.32.12
reference: Numbers 32:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: tl
  text: maliban kina Caleb na anak ni Jefune, na Kenizita, at Josue na anak ni Nun, sapagkat lubos silang sumunod kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sumunod sila nang buong puso kay Yahweh.” Literal na “pinuno [nila] ang pagsunod kay Yahweh” ang Hebreong idyoma, na nagpapahayag ng ganap na katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  choice: maliban kina
  rationale: Ipinakikilala ng salita ang dalawang taong hindi kasama sa naunang hatol. Ang “kina” ay likas sa Tagalog bago ang pinagsamang mga pangalan ng tao.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Caleb na anak ni Jefune
  rationale: Pinananatili ang pangalang Caleb at malinaw na isinasalin ang ugnayang ipinahahayag ng בֶּן bilang “anak ni.”
- source_word: הַקְּנִזִּי
  choice: na Kenizita
  rationale: Isinasalin ang katawagang tumutukoy sa angkan o pangkat ni Caleb sa anyong madaling basahin sa Filipino.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: at Josue na anak ni Nun
  rationale: Ipinapakita ng “at” ang pag-uugnay sa ikalawang hindi kasama sa hatol; ginamit ang nakaugaliang Filipinong anyo na “Josue.”
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinahahayag na ang sumunod na sugnay ang dahilan kung bakit hindi kasama sina Caleb at Josue sa hatol.
- source_word: מִלְאוּ אַחֲרֵי
  choice: lubos silang sumunod kay
  rationale: Natural nitong ipinahahayag sa modernong Tagalog ang Hebreong idyoma ng ganap at tapat na pagsunod nang hindi dinaragdagan ng ideyang wala sa teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tuwirang nasa Hebreong teksto; ang “Yahweh” ay nagpapanatili nito at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Kahulugan ng מִלְאוּ אַחֲרֵי
  choice: lubos silang sumunod kay
  alternative: sumunod sila nang buong puso kay
  rationale: Pinananatili ng “lubos” ang diwa ng ganap na katapatan habang iniiwasang gawing tahasang sangkap ng pangunahing teksto ang “puso,” na hindi literal na binabanggit sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maliban kina” at “lubos silang sumunod” para sa natural na daloy, habang pinanatili ang mga pangalan at ang personal na pangalang Yahweh.
