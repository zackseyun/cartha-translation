  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang tribal na ekspresyon, ang pantawag-pansing “masdan,” at ang pag-uulit ng “lugar” upang manatiling malapit sa retorika ng Hebreo; ipinaliwanag sa mga talababa ang mas natural na mga alternatibo.
