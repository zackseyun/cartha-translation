base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: tl
  text: Napakarami ng mga alagang hayop ng mga anak ni Ruben at ng mga anak ni Gad.[a] Nakita nila ang lupain ng Jazer at ang lupain ng Gilead, at narito[b], ang lugar ay isang lugar para sa mga alagang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isaling “ang mga Rubenita at ang mga Gadita.” Literal sa Hebreo: “mga anak ni Ruben at mga anak ni Gad.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isaling “ang lugar ay angkop sa mga alagang hayop.” Inuulit sa Hebreo ang salitang “lugar” para sa diin: “ang lugar ay isang lugar para sa mga alagang hayop.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: Napakarami ng mga alagang hayop
  rationale: Ang מִקְנֶה ay malawak na tumutukoy sa mga alagang hayop bilang pag-aari, hindi lamang sa baka. Pinagsama ng “napakarami” ang diin ng רַב at עָצוּם מְאֹד sa natural na Tagalog.
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: ng mga anak ni Ruben at ng mga anak ni Gad
  rationale: Pinananatili nito ang literal at inuulit na tribal na katawagang “mga anak ni,” habang nililinaw sa talababa ang mas likas na alternatibong tumutukoy sa mga kaanib ng mga lipi.
- source_word: וַיִּרְאוּ
  choice: Nakita nila
  rationale: Isinasalin ang payak na pagsulong ng salaysay nang hindi nagdaragdag ng tahasang temporal o sanhi na kahulugang gaya ng “nang makita nila.”
- source_word: אֶרֶץ יַעְזֵר וְאֶת אֶרֶץ גִּלְעָד
  choice: ang lupain ng Jazer at ang lupain ng Gilead
  rationale: Ang “lupain” ay tuwiran at nababagong katumbas ng אֶרֶץ, at pinananatili ang pag-uulit ng parirala sa Hebreo.
- source_word: וְהִנֵּה
  choice: at, masdan
  rationale: Ang “masdan” ay nagpapanatili sa pansin at agarang pagkatuklas na ipinahihiwatig ng הִנֵּה, sa isang marangal na estilong angkop sa salaysay.
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: ang lugar ay isang lugar para sa mga alagang hayop
  rationale: Pinananatili ang sadyang pag-uulit ng מָקוֹם at iniiwasang gawing mas tiyak na “pastulan” ang kahulugan.
