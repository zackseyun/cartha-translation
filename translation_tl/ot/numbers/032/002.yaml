base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/002.yaml
  text: Then the sons of Gad and the sons of Reuben came and spoke to Moses, to Eleazar the priest, and to the leaders of the congregation, saying,
translation:
  language: tl
  text: 'Dumating ang mga anak ni Gad at ang mga anak ni Ruben at sinabi nila kina Moises, Eleazar na pari, at sa mga pinuno ng kapulungan:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: mga anak ni Gad at ang mga anak ni Ruben
  rationale: Pinananatili ang literal at makabuluhang katawagang pangangkan na בְנֵי, habang gumagamit ng likas na ayos sa Filipino.
- source_word: וַיָּבֹאוּ
  choice: Lumapit
  rationale: Sa kontekstong ito, ang pagdating ay paglapit sa mga pinunong kakausapin; mas likas sa Filipino kaysa sa payak na “dumating” bago ang tuwirang pagsasalita.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: sinabi nila ...
  rationale: Ang Hebreong pormula ng pagsasalita ay natural na ipinahahayag sa Filipino sa pamamagitan ng “sinabi nila”; hindi inuulit ang “na sinasabi” dahil magiging mabigat at di-likas, at ang kasunod na talata ang maglalaman ng sinabi.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: mga pinuno ng kapulungan
  rationale: Ang נְשִׂיאִים ay mga kinikilalang pinuno, at ang עֵדָה rito ay ang kapulungan o sambayanan ng Israel.
