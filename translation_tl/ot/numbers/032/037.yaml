  source_fidelity: Tumpak na isinasalin ang waw bilang “At,” ang בְנֵי רְאוּבֵן bilang “mga anak ni Ruben,” at ang בָּנוּ bilang “itinayo.” Kumpleto at nasa wastong pagkakasunod ang tatlong pangalan ng lugar. Hindi ipinapasok ang di-tiyak na diwang “muling itinayo” o “pinatibay.”
