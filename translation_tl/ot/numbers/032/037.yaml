  text: וּ/בְנֵ֤י רְאוּבֵן֙ בָּנ֔וּ אֶת חֶשְׁבּ֖וֹן וְ/אֶת אֶלְעָלֵ֑א וְ/אֵ֖ת קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: tl
  text: At itinayo ng mga anak ni Ruben ang Hesbon, Eleale, at Kiriataim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Itinayo ng mga Rubenita ang Hesbon, Eleale, at Kiriataim.”
    reason: Ipinapakita ang idyomatikong alternatibo sa “mga anak ni Ruben,” na tumutukoy sa mga kabilang sa lipi ni Ruben.
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: At … ng mga anak ni Ruben
  rationale: Pinananatili ang literal na anyong pangangkan na “mga anak ni Ruben,” na sa konteksto ay tumutukoy sa mga kabilang sa lipi ni Ruben; natural pa rin ito sa Filipino.
- source_word: בָּנוּ
  choice: itinayo
  rationale: Ang qal perfect ng בנה ay karaniwang nangangahulugang “nagtayo/itinayo.” Maaaring kasangkot sa konteksto ang muling pagtatayo, ngunit hindi iyon tahasang tinutukoy ng salita.
- source_word: אֶת
  choice: hindi isinalin nang hiwalay
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas sa Filipino.
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Pangalan ng lugar; ginamit ang karaniwang anyong transliterado sa tradisyong Bibliyang Filipino.
- source_word: אֶלְעָלֵא
  choice: Eleale
  rationale: Pangalan ng lugar; malapit sa anyong Hebreo at natural basahin sa Filipino.
- source_word: קִרְיָתָיִם
  choice: Kiriataim
  rationale: Pangalan ng lugar; transliterasyong angkop sa baybay at bigkas ng Filipino.
