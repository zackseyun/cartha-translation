  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: tl
  text: Pumunta sa Gilead ang mga anak ni Makir na anak ni Manases at sinakop nila iyon. Pinalayas niya[a] ang mga Amoreo[b] na naroon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isahan ang pandiwa sa Hebreo: “pinalayas niya,” kasunod ng mga pandiwang maramihan. Maaaring ituring dito bilang isang kabuuan ang angkan ni Makir, o maaaring isa itong tekstuwal o estilistikong paglipat. Isinasalin ito ng ilan bilang “pinalayas nila.”'
    reason: textual_variant
  - marker: b
    text: Sa Hebreo, isahan ang katawagang “ang Amoreo,” ngunit ginagamit ito nang kolektibo para sa mga Amoreong naninirahan doon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Pumunta
  rationale: Karaniwang pandiwang pasalaysay ang הלך dito; hindi kailangang idagdag ang diwang ‘umakyat’ na hindi tahasang hinihingi ng teksto.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: ang mga anak ni Makir na anak ni Manases
  rationale: Pinananatili ang literal na pananalitang pangkamag-anakan ng Hebreo, bagaman maaari rin itong tumukoy sa mga inapo o angkan.
- source_word: גִּלְעָדָה
  choice: sa Gilead
  rationale: Ang hulaping direksiyonal ay nagpapahayag ng pagpunta tungo sa Gilead; natural itong isalin sa Filipino bilang ‘sa Gilead.’
- source_word: וַיִּלְכְּדֻהָ
  choice: sinakop nila iyon
  rationale: Ang לכד ay tumutukoy sa pagbihag o pagsakop sa isang lugar; ang ‘sinakop’ ay natural at angkop sa kontekstong militar.
- source_word: וַיּוֹרֶשׁ
  choice: Pinalayas niya
  rationale: Ang Hiphil ng ירש ay nangangahulugang magtaboy o magpaalis upang mawalan ng kinasasakupang lupain. Pinananatili ng ‘niya’ ang biglang paglipat sa isahang pandiwa sa tekstong Masoretiko.
- source_word: הָאֱמֹרִי
  choice: ang mga Amoreo
  rationale: Bagaman isahan ang anyong Hebreo, kolektibong katawagan ito sa pangkat-etniko; malinaw sa Filipino ang maramihang ‘mga Amoreo.’
- source_word: אֲשֶׁר בָּהּ
  choice: na naroon
  rationale: Natural at maikli itong katumbas ng sugnay na tumutukoy sa mga naninirahan sa Gilead.
theological_decisions:
- issue: Paglipat mula sa maramihang mga pandiwa tungo sa isahang וַיּוֹרֶשׁ
  choice: Pinalayas niya
  alternative: Pinalayas nila
  rationale: Pinananatili ang tunay na gramatikal na tensiyon ng tekstong Masoretiko sa halip na tahimik na pagtugmain ang bilang; ipinapaliwanag sa talababa ang posibleng kolektibong gamit o estilistikong/tekstuwal na paglipat.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang ‘sinakop’ para sa pagkuha sa lupain at ‘pinalayas’ para sa pagpapaalis sa mga naninirahan. Pinanatili sa pangunahing teksto ang di-inaasahang isahang pandiwa ng Hebreo at nilinaw ito sa talababa.
