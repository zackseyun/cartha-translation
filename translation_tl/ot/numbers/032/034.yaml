  register: Gumamit ng natural at marangal na modernong Tagalog. Pinanatili ang Hebreong pananalitang pangangkan na “mga anak ni Gad,” habang nilinaw sa talababa ang kahulugan nito sa kontekstong panlipi. Ang ayos na may “ay” ay nagbibigay ng malinaw at maayos na daloy sa maikling talaan ng mga bayang itinayo.
