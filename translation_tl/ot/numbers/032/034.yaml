base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/034.yaml
  text: The sons of Gad built Dibon[a], Ataroth[b], and Aroer.
translation:
  language: tl
  text: Ang mga anak ni Gad[a] ay nagtayo[b] ng Dibon, Atarot, at Aroer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ni Gad”; ibig sabihin, mga kabilang sa lipi ni Gad.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “muling nagtayo” o “nagpatibay” ayon sa konteksto; “nagtayo” lamang ang tuwirang sinasabi ng pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: nagtayo
  rationale: Tuwirang ipinahahayag ng pandiwang בנה ang ginawang pagtatayo. Bagaman maaaring ipahiwatig ng konteksto ang muling pagtatayo o pagpapatibay sa mga bayan, hindi likas na taglay ng pandiwa ang mga kahulugang iyon.
- source_word: בְנֵי גָד
  choice: mga anak ni Gad
  rationale: Pinananatili nito ang literal na pananalitang pangangkan sa Hebreo at malinaw pa rin sa modernong Tagalog; sa konteksto, tumutukoy ito sa mga kabilang sa lipi ni Gad.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas sa Tagalog; ipinakikita ang tungkulin nito sa ayos at sa panandang “ng.”
- source_word: דִּיבֹן
  choice: Dibon
  rationale: Pangalan ng lugar na tinumbasan sa karaniwang anyong transliterado.
- source_word: עֲטָרֹת
  choice: Atarot
  rationale: Pangalan ng lugar na isina-Filipino ang transliterasyon, na ang pangwakas na titik ay kumakatawan sa Hebreong tav.
- source_word: עֲרֹעֵר
  choice: Aroer
  rationale: Pangalan ng lugar na tinumbasan sa karaniwang anyong transliterado.
