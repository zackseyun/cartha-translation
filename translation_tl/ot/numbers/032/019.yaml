  text: כִּ֣י לֹ֤א נִנְחַל֙ אִתָּ֔/ם מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן וָ/הָ֑לְאָה כִּ֣י בָ֤אָה נַחֲלָתֵ֨/נוּ֙ אֵלֵ֔י/נוּ מֵ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: tl
  text: Sapagkat hindi kami tatanggap ng mana kasama nila sa ibayo ng Jordan at sa dakong lampas pa roon, dahil napunta na sa amin ang aming mana sa panig na ito ng Jordan, sa silangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa ibayo ng Jordan, sa dakong silangan.”
    reason: Pinahihintulutan ng pariralang Hebreo ang mas literal na “sa ibayo ng Jordan,” bagaman nakasalalay sa pananaw ng nagsasalita kung aling panig ang tinutukoy.
lexical_decisions:
- source_word: נִנְחַל
  choice: tatanggap ng mana
  rationale: Ang Qal ng נחל ay tumutukoy sa pagtanggap o pagtataglay ng minanang bahagi. Likas sa modernong Tagalog ang “tatanggap ng mana” at malinaw nitong pinananatili ang diwa ng nakalaang lupain.
- source_word: אִתָּם
  choice: kasama nila
  rationale: Tuwirang ipinahihiwatig ng parirala ang pakikibahagi sa mana ng ibang mga lipi.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: sa ibayo ng Jordan at sa dakong lampas pa roon
  rationale: 'Pinananatili nito ang dalawang bahaging heograpikal ng Hebreo: ang pagtawid sa Jordan at ang pagpapatuloy sa mas malayong dako.'
- source_word: בָאָה נַחֲלָתֵנוּ אֵלֵינוּ
  choice: napunta na sa amin ang aming mana
  rationale: Ang perpektong pandiwa ay nagpapahayag na nakamit o naitalaga na sa kanila ang mana. Natural sa Tagalog ang “napunta na sa amin” nang hindi tahasang nagdaragdag ng tagapagbigay.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: sa panig na ito ng Jordan, sa silangan
  rationale: Mula sa kinaroroonan ng mga nagsasalita sa silangan ng Jordan, malinaw sa Tagalog ang “panig na ito”; tahasang isinasalin ng “sa silangan” ang מִזְרָחָה. Inilalahad sa talababa ang mas literal ngunit maaaring malabong alternatibo.
