  source_fidelity: Tumpak na naihahatid ng salin ang pagtanggi nilang makibahagi sa mana sa kabila ng Jordan at ang natanggap na nilang mana sa silangan. Ang “tatanggap ng mana,” “napunta na sa amin,” at “sa silangan” ay angkop sa mga pandiwang at pariralang Hebreo. Gayunman, ang talababa ay para sa huling pariralang heograpikal at dapat ikabit mismo roon, hindi sa dulo ng buong pangungusap.
  naturalness: Marangal at likas ang pangungusap sa makabagong Filipino. Ang “sa dakong lampas pa roon” ay bahagyang pormal ngunit malinaw at angkop sa rehistrong biblikal.
  terminology: Ang “mana” ay wastong termino para sa נחלה sa konteksto ng nakalaang lupain. Wala itong di-kinakailangang denominasyonal na pagpapakahulugan.
  issues:
  - severity: low
    issue: Hindi nakaangkla sa pariralang tinutukoy ang talababa.
    rationale: Ang talababang nagbibigay ng alternatibo para sa “sa panig na ito ng Jordan, sa silangan” ay kasalukuyang nakalagay sa katapusan ng pangungusap. Ang paglalagay nito kaagad pagkatapos ng pariralang iyon ay magpapalinaw ng saklaw nito at ng heograpikal na ambigwidad.
