translation:
  language: tl
  text: Atarot, Dibon, Jazer, Nimra, Hesbon, Eleale, Sebam[a], Nebo, at Beon[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Sebam”; sa ibang bahagi, lumilitaw ang kaugnay na pangalan ng lugar bilang “Sibma” o “Shibma.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Beon”; sa ibang bahagi, lumilitaw ang kaugnay na pangalan ng lugar sa mas mahabang anyong “Baal-meon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטָרוֹת
  choice: Atarot
  rationale: Pangalan ng lugar; tuwirang isinalin sa baybay na angkop sa modernong Filipino, kung saan sapat ang “t” para sa ת.
- source_word: דִיבֹן
  choice: Dibon
  rationale: Pangalan ng lugar; pinanatili sa karaniwang anyong Dibon.
- source_word: יַעְזֵר
  choice: Jazer
  rationale: Pangalan ng lugar; ginamit ang nakagawiang biblikal na anyong Jazer sa halip na gawing pangkaraniwang salita.
- source_word: נִמְרָה
  choice: Nimra
  rationale: Sinunod ang maikling anyo ng pangalan sa talatang ito at hindi iniayon sa mas mahabang Beth-nimrah na makikita sa ibang konteksto.
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Pangalan ng lugar; ginamit ang natural at nakikilalang baybay sa Filipino.
- source_word: אֶלְעָלֵה
  choice: Eleale
  rationale: Pangalan ng lugar; isinalin sa payak na baybay-Filipino nang hindi dinaragdagan ang anyo ng Hebreo.
- source_word: שְׂבָם
  choice: Sebam
  rationale: Direktang sinasalamin ang anyong שׂבם sa talatang ito; hindi ito tahimik na iniayon sa kaugnay na Sibma o Shibma.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Pangalan ng lugar; pinanatili ang karaniwang anyong Nebo.
- source_word: בְּעֹן
  choice: Beon
  rationale: Sinunod ang maikling anyong nakasulat dito at hindi pinalitan ng kaugnay na mas mahabang Baal-meon.
- source_word: וְ / וּ
  choice: mga kuwit at pangwakas na “at”
  rationale: Bagaman inuulit sa Hebreo ang pangatnig, mas natural sa modernong Filipino ang listahang pinaghihiwalay ng mga kuwit at may “at” bago ang huling pangalan; napapanatili nito ang ayos at buong nilalaman ng talaan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang mga pangalan ng lugar ay binaybay para madaling basahin sa Filipino habang iginagalang ang mismong maiikling anyo sa tekstong Hebreo. Ginamit ang natural na bantas ng isang listahan at pinanatili ang pangwakas na gitling dahil nagpapatuloy ang pangungusap sa kasunod na talata.
