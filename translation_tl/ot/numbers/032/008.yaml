translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mga ninuno” para sa naunang salinlahi at pinanatili sa pangunahing teksto ang mas malawak na kahulugan ng pandiwang Hebreo; nasa talababa ang mas tiyak na mga kahulugang hinihingi ng konteksto.
