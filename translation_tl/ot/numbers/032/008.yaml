  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: tl
  text: Ganito ang ginawa ng inyong mga ama nang isugo ko sila mula sa Kades-barnea upang tingnan ang lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “suriin” o “galugarin ang lupain.” Literal na “tingnan” ang pandiwang Hebreo, ngunit sa konteksto ay tumutukoy ito sa paggalugad ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Ganito rin
  rationale: Ipinakikita ng כֹּה kung paano maihahambing ang ginawa ng naunang salinlahi sa kasalukuyang kalagayan. Likas sa Filipino ang “Ganito rin” at malinaw nitong naipahihiwatig ang paghahambing sa konteksto.
- source_word: עָשׂוּ
  choice: ang ginawa
  rationale: Payak at tuwirang katumbas ito ng pandiwang עשה sa nagdaang panahon.
- source_word: אֲבֹתֵיכֶם
  choice: inyong mga ninuno
  rationale: Bagaman literal na “inyong mga ama,” ang tinutukoy rito ay ang naunang salinlahi ng Israel. Ang “mga ninuno” ay likas sa modernong Filipino at hindi naglilimita sa agarang mga ama lamang.
- source_word: בְּשָׁלְחִי
  choice: nang suguin ko
  rationale: Ang ב na may infinitive construct at hulaping unang panauhan ay temporal dito; natural itong isalin bilang “nang suguin ko.”
- source_word: אֹתָם
  choice: sila
  rationale: Ito ang tuwirang layon na tumutukoy sa mga kinatawan mula sa naunang salinlahi.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: mula sa Kades-barnea
  rationale: Isinalin ang pang-ukol na מִן bilang “mula sa” at tinumbasan sa anyong karaniwang nababasa sa Filipino ang pangalan ng lugar.
- source_word: לִרְאוֹת
  choice: upang tingnan
  rationale: Pangunahing kahulugan ng ראה ang “makita/tingnan.” Sa konteksto, may diwang pagsusuri sa lupain, ngunit pinananatili ng “tingnan” ang payak na leksikal na anyo nang hindi agad pinipili ang mas tiyak na “maniktik.”
- source_word: אֶת הָאָרֶץ
  choice: ang lupain
  rationale: Ang “lupain” ay natural at marangal na katumbas ng הָאָרֶץ sa konteksto ng teritoryong kanilang pupuntahan, nang hindi idinaragdag sa pangunahing teksto ang paliwanag na “ipinangakong lupain.”
