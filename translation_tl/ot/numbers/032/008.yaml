  verdict: revise
  source_fidelity: Kailangang alisin ang “rin,” na walang tuwirang katapat sa כֹּה, at mas tumpak na isalin ang אֲבֹתֵיכֶם bilang “inyong mga ama” kaysa sa mas malawak na “inyong mga ninuno.” Ang natitirang diwa, kabilang ang temporal na “nang” at ang payak na “tingnan,” ay matapat sa Hebreo.
  naturalness: Natural at marangal sa modernong Filipino ang “Ganito ang ginawa ng inyong mga ama nang isugo ko sila mula sa Kades-barnea upang tingnan ang lupain.” Mas tuwiran ang “isugo ko” kaysa “suguin ko” sa nakalipas na pangyayari.
  terminology: Pinanatili ang Kades-barnea at “lupain.” Ang “mga ama” ay mahalaga upang mapanatili ang tahasang pananalita at ang generational force ng Hebreo, nang hindi pinalalawak sa lahat ng ninuno.
