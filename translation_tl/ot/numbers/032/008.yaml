    issue: “inyong mga ninuno” para sa אֲבֹתֵיכֶם
    rationale: Bagaman maaaring tumukoy sa naunang salinlahi ang konteksto, literal at partikular na “inyong mga ama” ang Hebreo. Ang “mga ninuno” ay mas malawak at pinapahina ang tinutukoy na henerasyon.
  - severity: low
    issue: Idinagdag ang “rin” sa “Ganito rin”
    rationale: Ang כֹּה ay “ganito/sa ganitong paraan.” Ang paghahambing ay nasa konteksto, ngunit walang katumbas na “rin” sa talata.
  - severity: low
    issue: “nang suguin ko”
    rationale: Nauunawaan ito, ngunit mas likas at malinaw sa salaysay na nakalipas ang “nang isugo ko.”
