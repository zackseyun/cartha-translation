  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם מֹשֶׁ֡ה לִ/בְנֵי גָד֩ וְ/לִ/בְנֵ֨י רְאוּבֵ֜ן וְ/לַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֣ה בֶן יוֹסֵ֗ף אֶת מַמְלֶ֨כֶת֙ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י וְ/אֶת מַמְלֶ֔כֶת ע֖וֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן הָ/אָ֗רֶץ לְ/עָרֶ֨י/הָ֙ בִּ/גְבֻלֹ֔ת עָרֵ֥י הָ/אָ֖רֶץ סָבִֽיב׀־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: tl
  text: Kaya ibinigay ni Moises sa mga anak ni Gad, sa mga anak ni Ruben, at sa kalahati ng lipi ni Manases na anak ni Jose ang kaharian ni Sihon na hari ng mga Amoreo at ang kaharian ni Og na hari ng Basan—ang lupain kasama ang mga lungsod nito sa kani-kanilang nasasakupan, at ang mga lungsod ng lupain sa palibot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at ang lupain, ang mga lungsod nito kasama ang mga nasasakupan ng mga ito, at ang mga lungsod ng lupain sa palibot.” Siksik at hindi ganap na tiyak ang pagkakaugnay ng huling parirala sa Hebreo, kaya posible ang ilang magkakalapit na salin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Tuwirang inilalarawan ng נתן ang pagbibigay o pagtatalaga ng lupain; natural at salaysay ang “ibinigay.”
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: sa mga anak ni Gad ... sa mga anak ni Ruben
  rationale: Pinananatili ang pampamilya at panliping idyomang בְּנֵי nang hindi ginagawang pangalang-etniko.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: at sa kalahati ng lipi ni Manases
  rationale: Malinaw at natural na katumbas ng pariralang construct; hindi ipinapalagay na isang hiwalay na opisyal na pangalang “kalahating lipi.”
- source_word: בֶן יוֹסֵף
  choice: na anak ni Jose
  rationale: Pinananatili ang pagkakakilanlang genealogical ni Manases sa tekstong Hebreo.
- source_word: מַמְלֶכֶת
  choice: kaharian
  rationale: Karaniwang kahulugan ng מַמְלָכָה at angkop sa mga lupaing dating pinamunuan nina Sihon at Og.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihon na hari ng mga Amoreo
  rationale: Natural na Tagalog na nagpapanatili sa appositional na ugnayan ng pangalan at titulo.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og na hari ng Basan
  rationale: Tuwirang salin ng pagkakasunod ng pangalan, titulo, at lugar.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy sa teritoryong sakop ng dalawang kaharian; “lupain” ang malawak at karaniwang katumbas.
- source_word: לְעָרֶיהָ
  choice: kasama ang mga lungsod nito
  rationale: Elliptical ang Hebreo; ipinahahayag ng “kasama” na ibinigay ang lupain pati ang mga lungsod nito nang hindi labis na nagpapaliwanag.
- source_word: בִּגְבֻלֹת
  choice: sa kani-kanilang nasasakupan
  rationale: Maaaring tumukoy ang גְּבוּלֹת sa mga hangganan o teritoryo. Ang “nasasakupan” ay natural sa konteksto ng mga lungsod at lupain habang pinananatili ang maramihang anyo.
- source_word: עָרֵי הָאָרֶץ סָבִיב
  choice: ang mga lungsod ng lupain sa palibot
  rationale: Pinananatili ang siksik at bahagyang appositional na pangwakas na parirala nang hindi tiyakang nilulutas ang sintaks nito.
