  naturalness: Hindi natural ang “pinanghinaan nila ng loob ang mga Israelita,” dahil ang karaniwang anyong Tagalog na “pinanghinaan ng loob” ay hindi ginagamit nang ganito bilang tuwirang causative na may aktibong tagaganap. Mas malinaw ang “pinanghina nila ang loob ng mga Israelita.”
  terminology: Ang “mga Israelita,” “Lambak ng Escol,” “lupain,” at “Yahweh” ay angkop sa makabagong Filipino Tagalog. Pinananatili ng talababa ang literal na “mga anak ni Israel.”
