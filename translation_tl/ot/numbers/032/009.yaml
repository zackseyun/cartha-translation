base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: tl
  text: Umakyat sila hanggang sa Lambak ng Escol at nakita nila ang lupain, at pinanghina nila ang loob ng mga Israelita[a] upang hindi sila pumasok sa lupaing ibinigay sa kanila ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel,” isang karaniwang tawag sa bansang Israel.
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ang banal na pangalang YHWH sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Umakyat sila
  rationale: Pinananatili ang direksiyonal na diwa ng עלה sa payak at natural na Tagalog.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: hanggang sa Lambak ng Escol
  rationale: Ang נחל ay maaaring tumukoy sa lambak o wadi; mas madaling maunawaan ang “Lambak,” at ang עַד ay wastong naisalin na “hanggang sa.”
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: at nakita nila ang lupain
  rationale: Tuwirang inililipat ang karaniwang kahulugan ng ראה nang hindi dinaragdagan ang ideya ng masusing pagsisiyasat.
- source_word: וַיָּנִיאוּ אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: pinanghinaan nila ng loob ang mga Israelita
  rationale: Ang causative na pandiwa ay nagsasaad na sila ang naging dahilan ng pagkawala ng lakas ng loob o determinasyon ng Israel. Natural sa Tagalog ang idyomang “pinanghinaan ... ng loob,” bagaman hindi nito literal na inuulit ang pang-isahang “puso” ng Hebreo.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: kaya ayaw nang pumasok ng mga ito sa lupain
  rationale: Ipinahahayag ang resulta ng panghihina ng loob at ang pag-urong sa pagpasok. Ang “mga ito” ay nagpapalinaw na ang mga Israelita, hindi ang mga espiya, ang hindi na nagnanais pumasok.
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: ibinigay sa kanila ni Yahweh
  rationale: Pinananatili ang ganap na aspekto ng נתן at tuwirang inililipat ang pangalang tipan na יהוה bilang “Yahweh.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangngalang pantangi ang יהוה sa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang banal na pangalan sa halip na palitan ito ng titulo.
- issue: Kaugnayan ng panghihina ng loob at hindi pagpasok
  choice: kaya ayaw nang pumasok
  alternative: pinigilan silang pumasok
  rationale: Iniiwasang ipahiwatig na pisikal silang hinarang. Ang Hebreo ay tumutukoy sa pagtalikod o pagkawala ng loob na humantong sa hindi pagpasok.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” sa pangunahing teksto para sa likas na daloy, habang inilagay sa talababa ang literal at pambansang katawagang “mga anak ni Israel.” Ang “Escol” ay baybay na angkop sa Filipino.
