revisions:
- from: Umakyat sila hanggang sa Lambak ng Escol at nakita nila ang lupain. Pagkatapos, pinanghinaan nila ng loob ang mga Israelita[a], kaya ayaw nang pumasok ng mga ito sa lupaing ibinigay sa kanila ni Yahweh.[b]
  to: Umakyat sila hanggang sa Lambak ng Escol at nakita nila ang lupain, at pinanghina nila ang loob ng mga Israelita[a] upang hindi sila pumasok sa lupaing ibinigay sa kanila ni Yahweh.[b]
  rationale: Inayos ang causative idiom upang maging natural at malinaw sa Tagalog, at pinalitan ang “kaya ayaw nang pumasok” ng “upang hindi sila pumasok” upang mas tapat na maihatid ang layon/resultang ipinahahayag ng Hebreo nang hindi nagdaragdag ng sikolohikal na motibo.
