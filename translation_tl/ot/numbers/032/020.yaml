base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: tl
  text: At sinabi sa kanila ni Moises, “Kung gagawin ninyo ang bagay na ito—kung mag-aarmas kayo[a] sa harap ni Yahweh[b] para sa labanan—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “maghahanda kayo para sa labanan,” “lalabas kayong nasasandatahan,” o “titipunin kayo bilang mga mandirigma.” Militar ang diwa ng pandiwang Hebreo: pagiging armado o handa para sa labanan.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa harap ni Yahweh.” Ipinahihiwatig nito na ang kanilang pakikidigma ay gagawin sa presensiya ni Yahweh at sa ilalim ng kanyang awtoridad.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: At sinabi sa kanila ni Moises
  rationale: Pinananatili ng “At” ang sunod-sunod na daloy ng salaysay na ipinahihiwatig ng wayyiqtol, habang natural sa makabagong Tagalog ang ayos ng pangungusap.
- source_word: אִם תַּעֲשׂוּן אֶת־הַדָּבָר הַזֶּה
  choice: Kung gagawin ninyo ang bagay na ito
  rationale: Ang דָּבָר ay tumutukoy rito sa panukala o pananagutang naunang binanggit. Ang “bagay na ito” ay malawak at malapit sa Hebreo nang hindi nililimitahan sa “salita” lamang.
- source_word: אִם תֵּחָלְצוּ
  choice: kung hahanda kayong armado
  rationale: Sa kontekstong militar, ang Nifal ng חלץ ay tumutukoy sa pagiging nasasandatahan o handa para sa pakikipaglaban. Ipinahahayag ng salin ang parehong paghahanda at pagiging armado nang natural sa Tagalog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang pinananatili ang diwa ng pagiging nasa presensiya ni Yahweh at pagkilos sa ilalim ng kanyang awtoridad.
- source_word: לַמִּלְחָמָה
  choice: para sa labanan
  rationale: Ang מִלְחָמָה ay maaaring tumukoy sa digmaan o labanan. Mas natural sa partikular na kontekstong ito ang “para sa labanan,” nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Paglalapat ng לִפְנֵי יְהוָה sa gawaing militar
  choice: sa harap ni Yahweh
  alternative: sa presensiya ni Yahweh
  rationale: Pinananatili ng “sa harap” ang konkretong idyoma ng Hebreo at ang teolohikal na pahiwatig na ang pagkilos ay ginagawa sa presensiya at ilalim ng awtoridad ni Yahweh, nang hindi tahasang nilulutas ang buong saklaw nito.
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Isinasalin bilang pangalang “Yahweh” upang makilala ito bilang tetragrammaton na nasa tekstong Hebreo, sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang di-natapos na kondisyunal na pangungusap sa pamamagitan ng pangwakas na gatlang sapagkat nagpapatuloy ang sinabi ni Moises sa susunod na talata. Ginamit ang “ninyo/kayo” bilang maramihang kausap.
