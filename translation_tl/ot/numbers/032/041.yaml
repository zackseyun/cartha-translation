  text: וְ/יָאִ֤יר בֶּן מְנַשֶּׁה֙ הָלַ֔ךְ וַ/יִּלְכֹּ֖ד אֶת חַוֺּתֵי/הֶ֑ם וַ/יִּקְרָ֥א אֶתְ/הֶ֖ן חַוֺּ֥ת יָאִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: tl
  text: Pumunta si Jair na anak ni Manases at sinakop ang kanilang mga nayon, at tinawag niya ang mga iyon na Havot-jair.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Havot-jair ay nangangahulugang “mga nayon ni Jair” o “mga pamayanan ni Jair.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָאִיר
  choice: Jair
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo; pinananatili bilang pangalang pantangi.
- source_word: בֶּן מְנַשֶּׁה
  choice: anak ni Manases
  rationale: Tuwirang pinananatili ang Hebreong anyong 'anak ni Manases,' sa halip na ipakahulugang 'inapo,' kahit maaari itong magkaroon ng mas malawak na gamit sa talaangkanan.
- source_word: הָלַךְ
  choice: pumunta
  rationale: Natural at tuwirang salin ng kilos sa salaysay nang hindi nagdaragdag ng direksiyon o layunin.
- source_word: וַיִּלְכֹּד
  choice: sinakop
  rationale: Ang pandiwa ay tumutukoy sa pagbihag o pagkuha, lalo na sa kontekstong militar at teritoryal; natural sa Filipino ang 'sinakop' para sa mga pamayanan.
- source_word: חַוֺּתֵיהֶם
  choice: kanilang mga nayon
  rationale: Tumutukoy sa maliliit at karaniwang di-napapaderang mga pamayanan; malinaw at likas sa modernong Filipino ang 'mga nayon.'
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: tinawag niya ang mga iyon
  rationale: Pinananatili ang payak na diwa ng קרא bilang 'tinawag,' na sa konteksto ay pagpapangalan.
- source_word: חַוֺּת יָאִיר
  choice: Havot-jair
  rationale: Isang pangalang-pook ito, kaya transliterasyon ang ginamit sa pangunahing teksto; ipinaliliwanag sa talababa ang literal na kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Manases,” ang kinagawiang anyong Filipino ng Manasseh, at ang “Havot-jair” bilang madaling basahing transliterasyon ng pangalang-pook. Inilagay ang talababa pagkatapos mismo ng pangalang tinutukoy nito.
