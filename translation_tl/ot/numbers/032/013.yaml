  naturalness: Ang rebisyong “pinagpagala-gala niya sila” ay likas at malinaw na modernong Tagalog. Ang “sa loob ng apatnapung taon” ay mas idiomatiko para sa haba ng panahon kaysa “nang apatnapung taon.”
  terminology: Ang “Yahweh,” “ilang,” “salinlahi,” at “sa paningin ni Yahweh” ay angkop sa marangal ngunit nauunawaang modernong Tagalog. Pinananatili ng “nag-alab ang galit” ang imahen ng Hebreong idyoma nang hindi nagiging di-likas.
