  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: tl
  text: Kaya nag-alab ang galit ni Yahweh laban sa Israel[a], at pinagpagala-gala niya sila sa ilang sa loob ng apatnapung taon[b], hanggang sa magwakas ang buong salinlahing gumawa ng masama sa paningin ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagalit si Yahweh sa Israel.” Literal na inilalarawan ng idyomang Hebreo ang galit ni Yahweh bilang nag-aalab.
    reason: lexical_alternative
  - marker: b
    text: O “pinaikot-ikot niya sila sa ilang sa loob ng apatnapung taon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: nag-alab ang galit ni Yahweh
  rationale: Pinananatili ang matingkad na idyomang Hebreo ng galit na ‘nagniningas’ o ‘nag-aalab,’ sa likas at marangal na Tagalog.
- source_word: בְּיִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa konteksto ng galit, ipinahihiwatig ng pang-ukol ang Israel bilang tudlaan ng galit ni Yahweh.
- source_word: וַיְנִעֵם
  choice: hinayaan niya silang magpagala-gala
  rationale: Ipinapahayag nito ang causative na diwa ng anyong Hiphil habang nananatiling natural sa Tagalog; ang mas tahasang ‘pinagpagala-gala niya sila’ ay ibinigay bilang alternatibo sa talababa.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang ‘ilang’ ay maikli, dignidad, at nakaugat sa gamit-biblikal para sa מִדְבָּר, hindi lamang sa isang mabuhanging disyerto.
- source_word: אַרְבָּעִים שָׁנָה
  choice: nang apatnapung taon
  rationale: Tuwirang inililipat ang tagal na apatnapung taon; ang ‘nang’ ay angkop sa pagpapahayag ng haba ng panahon.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: hanggang sa maubos ang buong salinlahi
  rationale: Ang תֹּם ay nagpapahiwatig ng ganap na pagkaubos o pagwawakas ng salinlahing hinatulan; malinaw na naipapahayag ito ng ‘maubos.’
- source_word: הָעֹשֶׂה הָרַע
  choice: gumawa ng masama
  rationale: Natural na relative-clause sense sa Tagalog na nagpapanatili sa moral na pagsusuri ng Hebreo.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang karaniwang idyomang Hebreo at malinaw itong nauunawaan bilang pagsusuri ayon kay Yahweh.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ang teksto ay tahasang gumagamit ng tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Paglalarawan sa galit ng Diyos
  choice: nag-alab ang galit ni Yahweh
  alternative: nagalit si Yahweh
  rationale: Hindi pinalalambot ang antropomorpikong larawan ng nag-aalab na galit, ngunit walang idinaragdag na paliwanag na doktrinal.
- issue: Causative na papel ni Yahweh sa paggala ng Israel
  choice: hinayaan niya silang magpagala-gala
  alternative: pinagpagala-gala niya sila
  rationale: Ang pangunahing salin ay likas sa Tagalog at nagpapahiwatig na ang kanilang paggala ay nasa ilalim ng hatol ni Yahweh; inilalahad sa talababa ang mas tahasang causative na pagbasa upang hindi maitago ang puwersa ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘salinlahi’ at ‘sa ilang’ dahil pamilyar ang mga ito sa estilong biblikal ngunit nauunawaan pa rin ng karaniwang mambabasa. Ang pangungusap ay nagpapanatili sa bigat ng paghatol at sa imahen ng orihinal nang hindi nagiging labis na literal.
