base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: tl
  text: at tatawid sa Jordan ang bawat lalaking may sandata mula sa inyo sa harap ni Yahweh, hanggang sa palayasin niya ang kanyang mga kaaway mula sa kanyang harapan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “palayasin niya” na “alisan niya ng pag-aari ang kanyang mga kaaway.” Saklaw ng pandiwang Hebreo ang pagpapalayas at pag-aalis ng pag-aari.
    reason: lexical_alternative
  - marker: b
    text: Pinakanatural na tumutukoy kay Yahweh ang “niya” at ang dalawang “kanyang,” ngunit maaaring unawain ng ilan na tumutukoy ang mga ito sa Israel o sa hukbong may sandata.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: at tatawid
  rationale: Ang Qal perfect na may prefixed conjunction ay may puwersang panghinaharap sa kondisyong nagsimula sa naunang talata; natural itong ipahayag sa Filipino sa aspektong kontemplatibo.
- source_word: לָכֶם כָּל חָלוּץ
  choice: ang bawat lalaking nasasandatahan sa inyo
  rationale: Pinananatili ng “bawat” ang distributibong isahan, samantalang ipinahihiwatig ng “nasasandatahan” ang pagiging handa at nasangkapan para sa labanan. Ang “sa inyo” ay natural na nagpapahayag ng kaugnayan sa mga tribong kinakausap.
- source_word: אֶת הַיַּרְדֵּן
  choice: sa Jordan
  rationale: Karaniwang pangalan sa Filipino ang “Jordan”; hindi na kailangang idagdag ang “Ilog” sa kontekstong ito.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang pinananatili ang ideya ng pagharap o pagiging nasa presensiya, at isinasalin ang tipanang pangalan na יהוה bilang “Yahweh.”
- source_word: עַד
  choice: hanggang sa
  rationale: Natural na pananda ng temporal na hangganan sa Filipino.
- source_word: הוֹרִישׁוֹ
  choice: mapalayas niya
  rationale: Sa Hiphil, ang ירשׁ ay maaaring mangahulugang magpalayas o mag-alis ng pag-aari. Ang “mapalayas” ay malinaw at natural, habang inilalahad sa talababa ang alternatibong “maalisan ng pag-aari.”
- source_word: אֹיְבָיו
  choice: ang kanyang mga kaaway
  rationale: Pinananatili ang panghalip na panlalaking isahan at ang pagkakaugnay nito sa simuno ng pandiwa.
- source_word: מִפָּנָיו
  choice: mula sa kanyang harapan
  rationale: Pinananatili ang literal na larawang “mula sa harapan/presensiya niya” at ang pag-uulit ng פני.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang lumilitaw sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Tinutukoy ng mga panghalip na panlalaking isahan sa הוֹרִישׁוֹ / אֹיְבָיו / מִפָּנָיו
  choice: Yahweh
  alternative: ang Israel bilang kabuuan o ang hukbong nasasandatahan
  rationale: Pinakamalapit at pinakanatural na antecedent ang Yahweh sa pariralang “sa harap ni Yahweh,” at umaayon ito sa karaniwang paglalarawan sa Pentateuch na si Yahweh ang nagpapalayas sa mga kaaway. Gayunman, maaari ring iugnay sa Israel o sa hukbo ang mga panghalip, kaya pinananatili sa talababa ang gramatikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalaking nasasandatahan” upang manatiling malapit sa military at distributibong diwa ng Hebreo; pinanatili rin ang bahagyang pormal na “mula sa kanyang harapan” upang maingatan ang inuulit na larawang לִפְנֵי / מִפָּנָיו.
