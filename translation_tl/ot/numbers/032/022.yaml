  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: tl
  text: at kapag napailalim na ang lupain sa harap ni Yahweh[a], saka kayo makababalik, at wala na kayong pananagutan kay Yahweh at sa Israel[b]. Ang lupaing ito ay magiging pag-aari ninyo sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ay ang personal na pangalang Hebreo ng Diyos, na isinusulat na YHWH.
    reason: divine_name
  - marker: b
    text: Maaari ring isalin na “wala na kayong sala sa harap ni Yahweh at ng Israel” o “maituturing kayong walang-sala sa harap ni Yahweh at ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה
  choice: at mapasailalim
  rationale: Ang Nifal ng כבש ay nagsasaad na ang lupain ay madadala sa ilalim ng kapangyarihan o pamamahala. Pinananatili ng “mapasailalim” ang pasibo at resultang diwa nang hindi nililimitahan ito sa mismong pagkubkob.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang ipinapahayag nito ang diwang “sa harap” o “sa presensiya” at pinananatili ang pananagutang nakatuon kay Yahweh.
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: saka kayo makababalik
  rationale: Ang “saka” ay malinaw na nag-uugnay sa pagbabalik sa naunang pagtupad sa kondisyon; ang “makababalik” ay likas na Filipino para sa pinahihintulutang pagbabalik pagkatapos nito.
- source_word: וִהְיִיתֶם נְקִיִּים מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: at wala na kayong pananagutan kay Yahweh at sa Israel
  rationale: Sa konteksto ng pangakong tungkulin, ang נְקִיִּים ay tumutukoy sa pagiging malaya sa sala o pananagutan. Ang “wala na kayong pananagutan” ay natural at malinaw, habang inilalahad sa talababa ang leksikal na alternatibo.
- source_word: לַאֲחֻזָּה
  choice: magiging pag-aari ninyo
  rationale: Ang אֲחֻזָּה ay isang lupaing hawak bilang pag-aari. Ang pariralang ito ay malinaw sa modernong Filipino at hindi labis na tumutukoy kung ito ay minamanang ari-arian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at iniiwasang palitan ito ng titulo.
- issue: Diwa ng נְקִיִּים sa konteksto ng pananagutan
  choice: wala na kayong pananagutan
  alternative: wala kayong sala o walang-sala kayo
  rationale: Ang usapan ay tungkol sa pagtupad sa ipinangakong tungkulin sa harap ng Diyos at ng Israel. Sinasaklaw ng salin ang kalayaan sa pananagutan, habang hindi itinatago ng talababa ang posibleng diwang “walang-sala.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “sa harap ni Yahweh” upang maipahayag ang paulit-ulit na לִפְנֵי at ang diwa ng pananagutan sa presensiya ng Diyos; ginamit ang “pananagutan” upang maging natural ang legal at tipanang konteksto.
