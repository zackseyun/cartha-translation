translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “lunsod” bilang marangal at karaniwang terminong biblikal; pinanatili ang mga pangalang pantangi sa transliterasyon. Inilagay ang [a] pagkatapos ng Nebo upang tumugma sa ibinigay na aparatong talababa, bagaman ang pariralang Hebreo ay malamang na sumasaklaw kapuwa sa Nebo at Baal-meon.
