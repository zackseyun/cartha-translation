base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: tl
  text: pati ang Nebo[a], Baal-meon, na pinalitan ang kanilang mga pangalan, at Sibma. Binigyan nila ng mga pangalan ang mga lunsod na kanilang itinayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na may binagong mga pangalan” / “na ang mga pangalan ay binago.” Malamang na ipinahihiwatig ng pariralang Hebreo na pinalitan ang mga pangalan ng Nebo at Baal-meon.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוֹ
  choice: Nebo
  rationale: Pangalan ng lugar; tinumbasan sa karaniwang transliterasyon sa Filipino sa halip na isalin ang kahulugan.
- source_word: בַּעַל מְעוֹן
  choice: Baal-meon
  rationale: Tambalang pangalan ng lugar; pinanatili ang gitling upang malinaw ang dalawang sangkap ng pangalan.
- source_word: מוּסַבֹּת שֵׁם
  choice: na binago ang mga pangalan
  rationale: Ipinahahayag ang pasibo at resultang diwa ng participle mula sa סבב kasama ng שֵׁם. Malamang na tumutukoy ito nang sama-sama sa mga pangalan ng Nebo at Baal-meon, ngunit pinananatili sa talababa ang posibleng pagkakaunawa sa parirala.
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Pangalan ng lugar; natural na transliterasyon sa Filipino, kung saan hindi kailangan ang hulaping h upang katawanin ang pangwakas na Hebrew he.
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת
  choice: Binigyan nila ng mga pangalan
  rationale: Likas na idyomang Filipino para sa pagtatalaga ng mga pangalan, habang pinananatili ang tahasang maramihang 'mga pangalan' ng Hebreo.
- source_word: אֶת שְׁמוֹת הֶעָרִים
  choice: ang mga lunsod
  rationale: Sa Filipino, ang 'binigyan ... ng mga pangalan ang mga lunsod' ay malinaw at natural na nagpapahayag ng literal na 'mga pangalan ng mga lunsod' nang hindi inuulit nang alanganin ang salita.
- source_word: אֲשֶׁר בָּנוּ
  choice: na kanilang itinayo
  rationale: Pinanatili ang karaniwang kahulugan ng בנה na 'itayo'; hindi ipinapalagay ang 'muling itinayo' kahit maaaring ipinahihiwatig iyon ng konteksto.
