  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: tl
  text: Hindi kami babalik sa aming mga bahay hanggang sa matanggap ng bawat anak ni Israel ang kanyang mana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: Hindi kami babalik
  rationale: Tuwirang ipinapahayag ang pagtanggi at ang nilalayong kilos sa hinaharap; natural ito sa modernong Tagalog at pinananatili ang diwa ng kanilang pangako.
- source_word: אֶל בָּתֵּינוּ
  choice: sa aming mga bahay
  rationale: Pinananatili ang kongkretong pangmaramihang 'mga bahay'; ang pang-ukol ay likas na naisasama sa pariralang 'babalik sa.'
- source_word: עַד
  choice: hanggang sa
  rationale: Malinaw na ipinakikita ang takdang hangganan ng hindi nila pagbabalik.
- source_word: הִתְנַחֵל
  choice: magkaroon na ... ng ... mana
  rationale: Ipinahihiwatig ng Hitpael ng נחל ang pagdating sa pag-aari ng lupang inilaan bilang mana. Ang 'magkaroon na ... ng mana' ay natural sa Tagalog at ipinakikita ng 'na' na dapat munang maganap ito bago sila bumalik.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang pampamilyang idyoma ng Hebreo nang hindi gumagamit ng mas mabigat at posibleng makalilitong 'mga anak na lalaki ni Israel'; ang alternatibong katawagang 'mga Israelita' ay inilalagay sa talababa.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Sa distributibong gamit nito, ang natural na katumbas ay 'bawat isa,' na iniuugnay ang kani-kanyang mana sa bawat kabilang sa tinutukoy na pangkat.
- source_word: נַחֲלָתוֹ
  choice: kanyang mana
  rationale: Pinananatili ang isahang panlalaking panghalip at ang mahalagang konsepto ng mana, na sa konteksto ay tumutukoy sa inilaan na lupain.
theological_decisions:
- issue: Pampamilya at may kasariang pananalita sa בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Ang 'mga anak ni Israel' ay nagpapanatili sa Hebreong pampamilyang pormula at covenantal na himig. Gayunman, dahil ang parirala ay maaari ring natural na tumukoy sa sambayanang Israel, ibinibigay sa talababa ang 'mga Israelita' nang hindi nilulutas nang labis ang saklaw nito.
- issue: Kalikasan ng נַחֲלָתוֹ bilang mana
  choice: kanyang mana
  alternative: kanyang minanang bahagi ng lupain
  rationale: Ang maikling 'mana' ay nagpapanatili sa teolohikal at leksikal na lawak ng salita, samantalang ipinauunawa ng konteksto na lupang inilaan ang tinutukoy; hindi na ito pinalawak sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'kami' sapagkat ang kausap ay hindi kabilang sa grupong nangangako. Pinanatili ang 'mga bahay,' 'mga anak ni Israel,' at 'mana' upang mapanatili ang kongkretong larawan at mahahalagang terminong Hebreo, habang inayos ang distributibong parirala bilang 'bawat isa' para sa likas na daloy.
