  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: tl
  text: Magtayo kayo ng mga lungsod para sa inyong maliliit na anak at mga kulungan[b] para sa inyong mga kawan; tuparin ninyo ang lumabas sa inyong bibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “gawin ninyo ang lumabas sa inyong bibig,” isang idyoma para sa pagtupad sa salitang binitiwan o sa ipinangako.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kulungan” ay maaari ring isaling “mga bakuran” o “mga kural” para sa mga alagang hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוּ
  choice: Magtayo kayo
  rationale: Maramihang pautos ng בנה; ang “magtayo” ang tuwiran at likas na katumbas sa Filipino.
- source_word: לָכֶם
  choice: para sa inyong
  rationale: Ipinahihiwatig ng parirala ang pagtatayo para sa kapakinabangan ng kanilang sambahayan; likas itong naipapahayag sa Filipino sa kasunod na mga pariralang “para sa inyong...”
- source_word: עָרִים
  choice: mga lungsod
  rationale: Ang עִיר ay lungsod o bayan; pinanatili ang karaniwang saling “mga lungsod” sa konteksto ng mga pamayanan.
- source_word: לְטַפְּכֶם
  choice: para sa inyong maliliit na anak
  rationale: Ang טַף ay tumutukoy lalo na sa maliliit na anak, hindi lamang sa lahat ng umaasa sa sambahayan.
- source_word: וּגְדֵרֹת
  choice: at ng mga kulungan
  rationale: Ang גְּדֵרוֹת dito ay mga bakod na lagayan ng hayop; malinaw at natural sa Filipino ang “mga kulungan.”
- source_word: לְצֹנַאֲכֶם
  choice: para sa inyong mga kawan
  rationale: Ang צֹאן ay kolektibong maliliit na alagang hayop, lalo na mga tupa at kambing; pinananatili ng “mga kawan” ang kolektibong diwa.
- source_word: וְהַיֹּצֵא מִפִּיכֶם תַּעֲשׂוּ
  choice: at tuparin ninyo ang salitang lumabas sa inyong bibig
  rationale: Pinananatili ang konkretong Hebreong idyoma tungkol sa binigkas na pangako habang ginagamit ang “tuparin” upang maging malinaw ang hinihinging pagsasagawa nito.
theological_decisions:
- issue: Kung literal na “gawin” o idiomatikong “tuparin” ang תַּעֲשׂוּ sa parirala
  choice: tuparin ninyo ang salitang lumabas sa inyong bibig
  alternative: gawin ninyo ang lumabas sa inyong bibig
  rationale: Ang konteksto ay ang pagtupad sa naunang ipinangako. Pinananatili pa rin ang larawan ng salitang lumalabas sa bibig, kaya hindi nawawala ang lakas ng orihinal na idyoma.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maliliit na anak” upang mapanatili ang tiyak na diwa ng טַף, at “mga kawan” bilang natural na kolektibong tawag sa mga tupa at kambing. Ang mga marker ay inilagay sa dulo ng talata upang hindi maputol ang maikling utos, bagaman kapuwa tumutukoy ang mga ito sa kani-kanilang parirala.
