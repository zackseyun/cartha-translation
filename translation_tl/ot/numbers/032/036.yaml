  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: tl
  text: at ang Bet-Nimra at Bet-Haran, mga pinatibay na lunsod, at mga kulungan ng tupa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: Bet-nimra
  rationale: Pangalan ito ng isang lugar, kaya isinalin sa pamamagitan ng transliterasyong angkop sa bigkas at baybay sa Filipino, sa halip na literal na “Bahay ni Nimra.”
- source_word: בֵּית הָרָן
  choice: Bet-haran
  rationale: Itinatanging pangalan ito ng lunsod; pinanatili ang anyong Bet- bilang bahagi ng pangalan sa halip na isaling “Bahay ni Haran.”
- source_word: עָרֵי מִבְצָר
  choice: mga lunsod na may muog
  rationale: Likas at malinaw itong katumbas sa modernong Filipino ng mga lunsod na pinatibay para sa depensa; pinananatili nito ang diwang militar ng מִבְצָר.
- source_word: גִדְרֹת צֹאן
  choice: mga kulungan ng tupa
  rationale: Tumutukoy ang parirala sa mga bakod o kulungang pinaglalagyan ng mga tupa o maliliit na hayop; “mga kulungan ng tupa” ang malinaw at karaniwang pahayag sa Filipino.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: at ... at ... at
  rationale: Ipinagpapatuloy ng mga pang-ugnay ang talaan mula sa naunang talata. Hindi hiwalay na isinalin ang pantukoy sa tuwirang layon na אֵת, sapagkat wala itong likas na tahasang katumbas sa Filipino.
