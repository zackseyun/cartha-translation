translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang retorikal na tanong at ang katawagang pampamilya ng Hebreo; iniwasan ang masyadong literal ngunit di-likas na ‘uupo kayo rito.’
