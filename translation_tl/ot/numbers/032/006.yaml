base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: tl
  text: Ngunit sinabi ni Moises sa mga anak ni Gad at sa mga anak ni Ruben, “Pupunta ba sa digmaan ang mga kapatid ninyo[a] habang mananatili kayo rito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid ninyo” ay tumutukoy sa kapwa nila mga Israelita mula sa ibang mga lipi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Ang pandiwang pasalaysay ay ‘sinabi’; ginamit ang ‘Ngunit’ upang natural na ihayag sa Filipino ang pagsalungat ni Moises sa naunang panukala, bagaman waw ang literal na pang-ugnay.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: sa mga anak ni Gad at sa mga anak ni Ruben
  rationale: Pinananatili ang literal na pormang ‘mga anak ni’ na tumutukoy sa mga kaanib o inapo ng dalawang lipi.
- source_word: הַאַחֵיכֶם
  choice: ang mga kapatid ninyo
  rationale: Literal itong ‘mga kapatid ninyo’; sa konteksto, tumutukoy ito sa kapwa nila mga Israelita mula sa ibang lipi.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: Pupunta ba sa digmaan
  rationale: Ang parirala ay karaniwang idyoma para sa pagpasok o paglahok sa digmaan. Ang anyong tanong ay nagpapanatili sa mapanuyang pagsaway ni Moises nang hindi dinaragdagan ng tahasang ‘dapat.’
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: habang mananatili kayo rito
  rationale: Ang ישב ay maaaring mangahulugang umupo, tumira, o manatili. Sa konteksto, ‘mananatili’ ang natural na Filipino para sa hindi pagsama sa kampanyang militar, at malinaw na naihahayag ng ‘habang’ ang paghahambing.
