  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּשָּׁבַ֖ע לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: tl
  text: 'Noong araw na iyon, nag-alab ang galit ni Yahweh[a], at sumumpa siya nang ganito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring isalin bilang “Jehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: nag-alab ang galit
  rationale: Ang חרה kasama ng אַף ay idyomang Hebreo para sa matinding pag-init o pag-alab ng galit. Pinananatili ng “nag-alab ang galit” ang metapora at natural ito sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
- source_word: בַּיּוֹם הַהוּא
  choice: Noong araw na iyon
  rationale: Likas na salin sa Tagalog ng tiyak na panahong tinutukoy sa salaysay.
- source_word: וַיִּשָּׁבַע
  choice: sumumpa siya
  rationale: Tuwirang ipinapahayag ang panunumpa o panata; mas maigsi at natural kaysa “nanumpa siya ng isang sumpa.”
- source_word: לֵאמֹר
  choice: 'nang ganito:'
  rationale: Ipinakikilala nito ang mismong nilalaman ng sumpa na sumusunod sa kasunod na talata. Natural itong panandang pambungad sa sipi sa Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na tahimik itong palitan ng isang titulo; ibinibigay sa talababa ang ibang nakaugaliang anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang metapora ng nag-aalab na galit at ginawang natural na pambungad sa kasunod na tuwirang pahayag ang לֵאמֹר.
