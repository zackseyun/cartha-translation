    reason: lexical_alternative
  revision_rationale: Walang ligtas at kinakailangang pagbabago. Hindi kailangang tularan ang English marker [b], sapagkat ang kaugnay nitong English note ay tumatalakay sa pandiwang “will remain” ngunit nakaangkla sa “livestock”; ang Tagalog ay hindi dapat magpanatili ng maling angkla. Sapat na malinaw ang kontekstuwal na “mananatili.”
