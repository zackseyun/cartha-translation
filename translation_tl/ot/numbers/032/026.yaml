id: NUM.32.26
reference: Numbers 32:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: tl
  text: Ang aming maliliit na anak[a], mga asawa, mga alagang hayop, at lahat ng aming mga hayop ay mananatili roon sa mga lungsod ng Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aming mga anak.” Ang Hebreong טַף ay madalas na tumutukoy lalo na sa maliliit na anak o mga batang umaasa pa sa magulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּינוּ
  choice: ang aming maliliit na anak
  rationale: Ang טַף ay karaniwang tumutukoy sa maliliit o umaasang anak, lalo na sa mga batang hindi kasama sa pakikipagdigma; malinaw at natural ito sa modernong Tagalog.
- source_word: נָשֵׁינוּ
  choice: mga asawa
  rationale: Sa konteksto ng mga sambahayan, ang anyong maramihan na may hulaping unang panauhan ay likas na tumutukoy sa kanilang mga asawa.
- source_word: מִקְנֵנוּ
  choice: mga alagang hayop
  rationale: Tumutukoy ang מִקְנֶה sa mga kawan at iba pang hayop na pag-aari; ang 'mga alagang hayop' ay malinaw na pangkalahatang tawag sa Tagalog.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: at lahat ng aming mga hayop
  rationale: Mas malawak ang בְּהֵמָה kaysa sa isang uri lamang ng hayop. Pinananatili ng salin ang pag-uulit at pagbibigay-diin sa kabuuan ng kanilang mga hayop.
- source_word: יִהְיוּ שָׁם
  choice: ay mananatili roon
  rationale: Literal na 'ay magiging/naroroon,' ngunit ipinahihiwatig ng konteksto na maiiwan sila roon habang humahayo ang mga mandirigma; natural na naihahayag ito ng 'mananatili roon.'
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: sa mga lungsod ng Gilead
  rationale: Tuwirang katumbas ito ng pariralang Hebreo at angkop sa marangal ngunit madaling maunawaang rehistro.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'maliliit na anak' upang mapanatili ang partikular na diwa ng טַף. Pinanatili rin ang dalawang magkalapit na katawagan para sa mga hayop dahil kapwa naroon ang מִקְנֶה at בְּהֵמָה sa Hebreo. Hindi nilagyan ng talababa ang 'mananatili' sapagkat ang marker [b] sa English layer ay tila nakakabit sa maling salita; malinaw namang ipinahihiwatig ng konteksto ang pananatili.
