  verdict: revise
  source_fidelity: Ang diing ng hiwalay na panghalip, ang pangakong pagtawid, ang kahandaang militar, at ang deiktikong parirala tungkol sa Jordan ay naipapahayag nang wasto sa kabuuan. Gayunman, ang unang panauhang maramihan ay dapat na eksklusibong "kami," hindi "tayo," sapagkat ang mga nagsasalita ay nakikipag-usap kina Moises at sa iba pang pinuno at hindi nila isinasama ang kausap sa kanilang pangako.
  naturalness: Natural at marangal ang pangungusap matapos palitan ang inclusive na "tayo/ating" ng exclusive na "kami/aming." Ang "handa sa pakikipagdigma" ay malinaw na modernong Filipino para sa pagiging handa sa labanan.
  terminology: Ang "Yahweh," "Canaan," "Jordan," at "mana" ay angkop. Ang "lupaing bahagi ng aming mana" ay maayos na naghahatid ng pag-aari/holding at minanang bahagi nang hindi naging mabigat.
  issues:
  - severity: medium
    issue: Inclusive na "tayo" at "ating" ang ginamit para sa unang panauhang maramihan.
    rationale: Sa Tagalog, isinasama ng "tayo" ang kausap. Sa kontekstong ito, ang mga anak nina Gad at Ruben ay nangangako sa harap nina Moises at ng mga pinuno; ang Hebreong unang panauhang maramihan ay tumutukoy sa mga nagsasalita, hindi sa kanilang mga kausap. Kaya "kami" at "aming" ang kinakailangan.
