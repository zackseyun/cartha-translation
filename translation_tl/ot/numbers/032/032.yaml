reference: Numbers 32:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: tl
  text: Kami mismo ay tatawid na handa sa pakikipagdigma sa harap ni Yahweh, papasok sa lupain ng Canaan; at mapapasaatin ang lupaing bahagi ng aming mana sa panig na ito ng Jordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kabilang panig ng Jordan” o “sa ibayo ng Jordan.” Ang ekspresyong Hebreo ay nakasalalay sa kinaroroonan at pananaw ng nagsasalita. Dito, ang “sa panig na ito” ay mula sa pananaw ng mga nagsasalitang nasa silangan ng ilog.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: Tayo mismo
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa nagsasalita; pinananatili ito ng “tayo mismo” sa natural na Tagalog.
- source_word: נַעֲבֹר
  choice: ay tatawid
  rationale: Ang Qal imperfect na unang panauhang maramihan ay nagpapahayag dito ng pangakong pagtawid sa Jordan.
- source_word: חֲלוּצִים
  choice: na handa sa pakikipagdigma
  rationale: Sa kontekstong militar, tumutukoy ito sa pagiging nasasandatahan at nakahanda sa labanan; mas malinaw sa karaniwang Tagalog ang pariralang ito kaysa sa “nasasandatahan.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang spatial at relasyonal na diwa ng לִפְנֵי at tuwirang isinasalin ang pangalang tipan na יהוה bilang Yahweh.
- source_word: אֶרֶץ כְּנָעַן
  choice: papasok sa lupain ng Canaan
  rationale: Bagaman walang tahasang pang-ukol bago ang parirala sa Hebreo, likas sa Tagalog na ipahayag ang patutunguhan ng pagtawid sa ganitong paraan.
- source_word: וְאִתָּנוּ
  choice: at mapapasaatin
  rationale: Walang hayag na pandiwa sa Hebreo; ang hinaharap na “mapapasaatin” ay umaayon sa pangako at natural na naghahatid ng diwang pag-aari.
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: ang lupaing bahagi ng ating mana
  rationale: Ipinahahayag nito kapwa ang konkretong lupaing pag-aari at ang katayuan nito bilang minanang bahagi, nang hindi gumagamit ng mabigat at di-likas na dobleng katawagan.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: sa panig na ito ng Jordan
  rationale: Ang ekspresyon ay nakasalalay sa pananaw. Sa konteksto, nagsasalita sila mula sa silangan ng Jordan at tinutukoy ang lupang mananatiling kanila roon; nililinaw ng salin ang pananaw habang itinatala sa talababa ang tunay na ambiguwidad.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan nang hindi pinapalitan ng titulo.
- issue: Diwa ng לִפְנֵי יְהוָה sa pangakong militar
  choice: sa harap ni Yahweh
  alternative: sa presensiya ni Yahweh; sa pangunguna ni Yahweh
  rationale: Ang literal at malawak na “sa harap” ay nagpapanatili sa posibleng spatial, relasyonal, at teolohikal na puwersa ng parirala nang hindi ito nililimitahan sa isang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “handa sa pakikipagdigma” upang maging madaling maunawaan ang terminong militar, at “lupaing bahagi ng ating mana” upang maipahayag nang natural ang dalawang magkakaugnay na konsepto ng pag-aari at mana.
