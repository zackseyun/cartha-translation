  naturalness: Ang “na nasasandatahan” ay hindi karaniwang modernong Tagalog sa ganitong gamit; mas natural ang “na armado.” Ang “bibigyan sila ng lupang magiging pag-aari nila” ay malinaw at idiomatiko, habang pinananatili ang pasibong diwa ng Hebreo.
  terminology: Ginamit ang “armado” para sa חֲלוּצִים, na tumutukoy sa mga nakahanda o nasasangkapan para sa labanan. Ang “lupang magiging pag-aari nila” ay angkop sa land-allotment na diwa ng וְנֹאחֲזוּ nang hindi ipinagpapalagay ang isang partikular na teolohikal na konsepto ng mana.
