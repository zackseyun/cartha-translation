- from: Ngunit kung hindi sila tatawid na nasasandatahan kasama ninyo, bibigyan sila ng lupaing pag-aari[a] sa gitna ninyo sa lupain ng Canaan.
  to: Ngunit kung hindi sila tatawid na armado kasama ninyo, bibigyan sila ng lupang magiging pag-aari nila sa gitna ninyo, sa lupain ng Canaan.[a]
  rationale: Pinalitan ang di-karaniwang “na nasasandatahan” ng “na armado” at nilinaw ang pagkakaloob ng lupain sa pamamagitan ng “lupang magiging pag-aari nila.” Pinananatili ng pangunahing salin ang kondisyunal, pasibong resulta, at lokasyong “sa gitna ninyo ... sa lupain ng Canaan.” Iningatan ng talababa ang leksikal na posibilidad na tumukoy ang pandiwa sa pagkakatatag sa isang pag-aari.
