  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: tl
  text: Ngunit kung hindi sila tatawid na armado kasama ninyo, bibigyan sila ng lupang magiging pag-aari nila sa gitna ninyo, sa lupain ng Canaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “itatatag sila sa piling ninyo sa lupain ng Canaan.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkakatatag sa isang pag-aari, hindi lamang sa pagtanggap nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ng pangatnig ang salungat na kondisyon kaugnay ng naunang talata; natural itong ipinahahayag sa Tagalog bilang “Ngunit kung.”
- source_word: יַעַבְרוּ
  choice: tatawid
  rationale: Ang pandiwang עבר ay tumutukoy sa pagtawid, dito ay sa pagtawid patungo sa Canaan.
- source_word: חֲלוּצִים
  choice: na nasasandatahan
  rationale: Tumutukoy ito sa mga taong handa at nasangkapan para sa pakikipagdigma; pinananatili ng “nasasandatahan” ang maikli at militar na diwa.
- source_word: אִתְּכֶם
  choice: kasama ninyo
  rationale: Tuwirang ipinahahayag ang pagsama nila sa iba pang Israelita sa pagtawid.
- source_word: וְנֹאחֲזוּ
  choice: bibigyan sila ng lupaing pag-aari
  rationale: Ang Niphal ng אחז sa konteksto ng paghahati ng lupain ay maaaring magpahiwatig na sila ay pagkakalooban o itatatag sa isang pag-aari. Ipinahahayag ng salin ang pasibong diwa at ang lupain bilang mana o pag-aari.
- source_word: בְּתֹכְכֶם
  choice: sa gitna ninyo
  rationale: Pinananatili nito ang lokatibong diwa ng pagiging nasa loob ng pamayanan ng Israel.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang buong heograpikong katawagan ng Hebreo.
