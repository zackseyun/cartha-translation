base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: tl
  text: At si Noba ay humayo at sinakop ang Kenat at ang mga bayang sakop nito,[a] at pinangalanan niya itong Noba, ayon sa sarili niyang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga anak na babae nito,” isang idyoma para sa maliliit na pamayanang sakop o umaasa sa Kenat.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: Noba
  rationale: Pangalan ng tao at, sa hulihan ng talata, bagong pangalan ng lugar; ginamit ang natural na transliterasyong Filipino at pinanatili ang pag-uulit.
- source_word: הָלַךְ
  choice: humayo
  rationale: Payak na pandiwa ng pagkilos sa salaysay; ang “humayo” ay marangal at malinaw nang hindi nagdaragdag ng diwa gaya ng “lumusob.”
- source_word: וַיִּלְכֹּד
  choice: sinakop
  rationale: Sa kontekstong militar, nangangahulugang bihagin o agawin ang isang lugar; natural sa Filipino ang “sinakop” para sa pagkuha ng lunsod at mga sakop nito.
- source_word: קְנָת
  choice: Kenat
  rationale: Pangalan ng lugar; isinalin sa baybay na angkop sa Filipino.
- source_word: בְּנֹתֶיהָ
  choice: mga bayang sakop nito
  rationale: Literal na “mga anak na babae nito,” ngunit isang idyoma para sa maliliit o umaasang pamayanang kaugnay ng pangunahing lunsod. Inilalahad ng salin ang kahulugan habang itinatala sa talababa ang literal na larawan.
- source_word: וַיִּקְרָא לָהּ
  choice: pinangalanan niya itong
  rationale: Ang קרא na may ל sa ganitong gamit ay tumutukoy sa pagbibigay ng pangalan; mas natural at tiyak sa Filipino ang “pinangalanan niya itong.”
- source_word: בִּשְׁמוֹ
  choice: ayon sa sarili niyang pangalan
  rationale: Ipinahihiwatig na ang pangalan ng lugar ay hinango sa pangalan ni Noba; nililinaw ng “sarili niyang” ang tinutukoy ng hulaping panghalip.
