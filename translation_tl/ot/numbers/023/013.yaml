  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו בָּלָ֗ק לך נָּ֨א אִתִּ֜/י אֶל מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣/נּוּ מִ/שָּׁ֔ם אֶ֚פֶס קָצֵ֣/הוּ תִרְאֶ֔ה וְ/כֻלּ֖/וֹ לֹ֣א תִרְאֶ֑ה וְ/קָבְ/נוֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: tl
  text: Sinabi ni Balak sa kanya, “Pakiusap, sumama ka sa akin sa ibang lugar na mula roon ay matatanaw mo ang Israel. Tanging dulong bahagi nito ang makikita mo[a], at hindi mo makikita ang kabuuan nito[b]. Mula roon, sumpain mo ito para sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang Hebreo na “gilid lamang nito” o “pinakamalayong bahagi lamang nito,” na tumutukoy sa bahagyang pagtanaw sa Israel.
    reason: lexical_alternative
  - marker: b
    text: Isahan ang mga panghalip sa Hebreo para sa Israel bilang isang kolektibong bayan; maaari ring gumamit ng maramihang panghalip na “sila.”
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: Pakiusap, sumama ka sa akin
  rationale: Ang imperatibong הלך na may נָא ay isang magalang na pakiusap. Sa kontekstong inaanyayahan ni Balak si Balaam na lumipat na kasama niya, likas sa Tagalog ang “sumama ka sa akin.”
- source_word: מָקוֹם אַחֵר
  choice: ibang lugar
  rationale: Tuwirang at natural na paglalarawan ng paglipat sa panibagong lugar.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: kung saan matatanaw mo ang Israel
  rationale: Ipinahihiwatig ng parirala ang isang bagong puwestong pagmamasdan. Ang “matatanaw” ay angkop sa pagtingin mula sa malayo; nilinaw ang malinaw na tinutukoy ng isahang hulapi—ang Israel bilang isang bayan.
- source_word: אֶפֶס קָצֵהוּ
  choice: Ang nasa dulo lamang nito
  rationale: Dito, nililimitahan ng אֶפֶס ang nakikita, samantalang ang קָצֶה ay maaaring tumukoy sa dulo, gilid, o dulong bahagi. Hindi tinutukoy nang mas tiyak kung aling bahagi ng kampo ang nakikita.
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: at hindi mo makikita ang kabuuan nito
  rationale: Pinananatili ang pagsalungat ng bahagyang tanaw at ng buong bayan, pati ang kolektibong isahan ng Hebreo.
- source_word: וְקָבְנוֹ לִי מִשָּׁם
  choice: Mula roon, sumpain mo ito para sa akin
  rationale: Ang קבב ay tumutukoy sa pagsumpa sa salaysay ni Balaam. Pinanatili ang lokasyong “mula roon” at ang layuning ipinahahayag ng לִי.
theological_decisions:
- issue: Ang isahang mga hulaping panghalip na tumutukoy sa Israel
  choice: Gamitin ang “ang Israel” at pagkatapos ay ang kolektibong isahang “nito/ito”
  alternative: Gamitin ang maramihang “sila/kanila” bilang pagtukoy sa mga Israelita
  rationale: Itinuturing ng Hebreo ang Israel bilang isang kolektibong bayan sa pamamagitan ng mga isahang hulapi. Pinananatili ito sa Tagalog nang hindi ipinahihiwatig na isang indibidwal lamang ang tinutukoy.
- issue: Lawak ng bahaging makikita ni Balaam
  choice: Panatilihin ang pangkalahatang “nasa dulo”
  alternative: Tukuyin bilang “gilid,” “labas na bahagi,” o “pinakamalayong bahagi”
  rationale: May saklaw na kahulugan ang קָצֶה at hindi nilulutas ng talata kung gilid, hangganan, o dulong bahagi ang tiyak na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pakiusap” upang ihatid ang magalang na נָא, at “matatanaw” upang natural na ilarawan ang pagtingin sa bayan mula sa malayong puwesto. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
