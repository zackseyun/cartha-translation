  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: tl
  text: Ginawa ni Balak ang sinabi ni Balaam, at naghandog[a] sina Balak at Balaam ng isang toro at isang lalaking tupa sa altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pinaakyat”; sa konteksto ng paghahandog, nangangahulugan itong “naghandog” o “inihandog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Sa pariralang עשה כאשר דבר, tumutukoy ito sa pagsasagawa ng sinabi o iniutos; natural sa modernong Tagalog ang “ginawa.”
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: ang sinabi ni Balaam
  rationale: Ipinapahayag ng sugnay na ginawa ni Balak ang naaayon sa naunang sinabi ni Balaam. Natural at malinaw ang “ang sinabi” sa salaysay na Tagalog.
- source_word: וַיַּעַל
  choice: naghandog
  rationale: Ang Hiphil ng עלה sa konteksto ng hayop at altar ay idyomang pangsakripisyo na nangangahulugang maghandog o magpaakyat bilang handog.
- source_word: בָּלָק וּבִלְעָם
  choice: sina Balak at Balaam
  rationale: Ang “sina” ang likas na panandang Tagalog para sa tambalang simuno na binubuo ng dalawang pangalang pantangi.
- source_word: פָּר
  choice: isang toro
  rationale: Karaniwang tumutukoy ang פָּר sa toro sa kontekstong panghandog; hindi tahasang tinutukoy rito ang edad nito.
- source_word: וָאַיִל
  choice: at isang lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa; mas madaling maunawaan ng ordinaryong modernong mambabasa ang katawagang ito kaysa sa hiram o di-pamilyar na termino.
- source_word: בַּמִּזְבֵּחַ
  choice: sa ibabaw ng altar
  rationale: Ipinahihiwatig ng בְּ sa kontekstong ito na ang handog ay inialay sa altar; pinananatili ng “sa ibabaw ng altar” ang lokatibong larawan ng Hebreo.
