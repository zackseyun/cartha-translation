base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: tl
  text: Paano ko susumpain ang hindi isinumpa ng Diyos? At paano ko tutuligsain ang hindi tinuligsa ni Yahweh?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Paano ako magagalit sa hindi kinagalitan ni Yahweh?” Maaaring bigyang-diin ng pandiwang Hebreo sa ikalawang linya ang galit o ang mapoot na pagtuligsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶקֹּב
  choice: Paano ko susumpain
  rationale: Ang מָה sa retorikal na tanong ay nagpapahayag ng kawalan ng kakayahan o batayan, kaya natural ang “Paano ko.” Ang “susumpain” ay tuwirang naghahatid sa diwa ng pandiwa sa konteksto.
- source_word: לֹא קַבֹּה
  choice: hindi isinumpa
  rationale: Pinananatili ang ugnayang leksikal sa “susumpain” at ang tahasang pagtanggi sa ginawa ng Diyos.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang titulong banal ang אֵל dito; ang “Diyos” ang natural at malinaw na katumbas sa Tagalog.
- source_word: וּמָה אֶזְעֹם
  choice: At paano ko tutuligsain
  rationale: Pinananatili ang paralelismo ng dalawang retorikal na tanong. Ang “tuligsain” ay naghahatid ng mapoot na pagpapahayag o paghatol nang hindi ito ipinapantay sa unang pandiwang “sumpain.”
- source_word: לֹא זָעַם
  choice: hindi tinuligsa
  rationale: Ginamit ang parehong salitang-ugat sa Tagalog upang mapanatili ang leksikal at patulang pagkakatugma sa אֶזְעֹם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal at pinananatili ang pagkakaiba nito sa titulong אֵל.
theological_decisions:
- issue: Pagkakaiba ng אֵל at יְהוָה sa paralelismong patula
  choice: Isalin ang אֵל bilang “Diyos” at ang יְהוָה bilang “Yahweh.”
  alternative: Isalin ang dalawang pangalan nang pangkalahatan bilang “Diyos,” o palitan ang יְהוָה ng titulong “PANGINOON.”
  rationale: Magkaibang katawagan ang sadyang ginamit sa Hebreo. Pinananatili ng salin ang karaniwang titulo at ang personal na pangalan nang hindi pinapantay ang dalawa.
- issue: Saklaw ng kahulugan ng זעם
  choice: Gamitin sa pangunahing teksto ang “tuligsain” at ilagay sa talababa ang diwang “magalit.”
  alternative: Isalin lamang bilang “magalit” o gawing kapareho ng “sumpain.”
  rationale: Maaaring tumukoy ang pandiwa sa galit o sa mapoot na pagtuligsa. Ang pangunahing salin ay angkop sa konteksto ng pagbigkas laban sa Israel, habang pinananatili ng talababa ang tunay na ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatulad na ayos ng dalawang retorikal na tanong at ang pagkakaiba ng “Diyos” at “Yahweh.”
