base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: tl
  text: 'At binigkas niya ang kanyang pahayag[a] at sinabi:

    “Tumindig ka, Balak, at makinig;

    pakinggan mo ako, anak ni Zipor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matalinghagang pananalita” o “marangal na pagbigkas.” Ang salitang Hebreo na מָשָׁל ay maaaring tumukoy sa isang kasabihan, talinghaga, o pormal na patulang pahayag; dito, ipinakikilala nito ang matayog na pahayag ni Balaam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: binigkas niya ang kanyang pahayag
  rationale: Ang נשׂא kasama ng מָשָׁל ay isang idyomang nagpapakilala ng pormal at matayog na pagbigkas. Natural sa makabagong Tagalog ang “binigkas,” samantalang pinananatili ng “pahayag” ang lawak ng מָשָׁל nang hindi ito tiyak na ginagawang “propesiya.”
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Karaniwang panimulang pormula sa tuwirang pananalita at natural sa Tagalog.
- source_word: קוּם
  choice: Tumindig ka
  rationale: Ang pautos ay maaaring mangahulugang bumangon o tumayo. Ang “tumindig” ay angkop sa marangal at patulang himig ng pahayag.
- source_word: וּשֲׁמָע
  choice: at makinig
  rationale: Sa kontekstong ito, hinihingi ng שׁמע ang sadyang pakikinig. Ang “makinig” ay natural at malinaw sa Tagalog.
- source_word: הַאֲזִינָה עָדַי
  choice: pakinggan mo ako
  rationale: Ang Hiphil ng אזן ay nangangahulugang magbigay-pansin o makinig nang mabuti. Pinananatili ng “pakinggan mo ako” ang tuwirang panawagan at ang pagpapaigting ng unang utos.
- source_word: בְּנוֹ צִפֹּר
  choice: anak ni Zipor
  rationale: Pinananatili ang patronimikong anyo ng pagtawag kay Balak at ang solemneng himig nito.
