  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang patulang paghahanay upang ipakita ang paralelismo ng dalawang utos na makinig. Ang baybay na “Zipor” ay iniangkop sa karaniwang tunog at ortograpiyang Filipino.
