  yaml_path: translation/ot/numbers/023/012.yaml
  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: tl
  text: Sumagot siya, “Hindi ba dapat kong tiyaking sabihin[a] kung ano ang ilagay ni Yahweh sa aking bibig?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, maaari ring isalin: “Hindi ba dapat kong pakaingatang sabihin kung ano ang ilagay ni Yahweh sa aking bibig?” Maaaring idiin ng pandiwa ang maingat at eksaktong pagsunod sa pagsasalita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: Sumagot siya
  rationale: Ang tambalang Hebreo na literal na ‘sumagot at nagsabi’ ay karaniwang panimulang pormula sa tugon. Sapat at mas natural sa makabagong Tagalog ang ‘Sumagot siya.’
- source_word: הֲלֹא
  choice: Hindi ba dapat kong
  rationale: Naghuhudyat ito ng tanong na retorikal na umaasang sasang-ayon ang kausap at, sa konteksto, nagpapahayag ng pananagutan o obligasyon.
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: ang anumang
  rationale: Ang layon at ang kasunod na panghalip na tumutukoy rito ay likas na pinagsasama sa Tagalog bilang ‘ang anumang,’ nang hindi inuulit ang layon.
- source_word: יָשִׂים
  choice: ilagay
  rationale: Pinananatili ng ‘ilagay’ ang larawang Hebreo ng mga salitang inilalagay sa bibig upang sabihin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng anyong ‘Yahweh’ ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: בְּפִי
  choice: sa aking bibig
  rationale: Pinananatili nito ang malinaw at nauunawaang idyomang Hebreo para sa mga salitang ibinibigay upang bigkasin.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: tiyaking sabihin
  rationale: Ang שׁמר kasama ng pawatas ay maaaring magpahiwatig ng maingat na pagsunod sa kung ano lamang ang dapat sabihin. Inihahatid ng ‘tiyaking sabihin’ ang diwa nang hindi nagiging asiwa sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang ‘Yahweh’ at hindi pinapalitan ng titulong ‘PANGINOON.’
- issue: Antas ng obligasyon at maingat na pagsunod sa tugon ni Balaam
  choice: Hindi ba dapat kong tiyaking sabihin
  alternative: Hindi ba dapat kong sabihin
  rationale: Pinagsasama ng הֲלֹא at אֶשְׁמֹר לְדַבֵּר ang tanong na retorikal, pananagutan, at posibleng diwa ng maingat na pagsunod. Hindi nito ipinahihiwatig na mekanikal lamang ang pagsasalita, ngunit pinananatili nitong nakatali si Balaam sa ibibigay na salita.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Iniwasan ang literal ngunit paulit-ulit na ‘sumagot at nagsabi,’ habang pinanatili sa pangunahing teksto at talababa ang mahalagang diwa ng maingat na pagsunod sa ibinigay na salita.
