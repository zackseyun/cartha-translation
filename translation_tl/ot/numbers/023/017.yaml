  source_fidelity: 'Tapat ang salin sa Hebreo: malinaw ang pagdating ni Balaam kay Balak, ang eksenang nadatnan si Balak na nakatayo malapit sa kanyang handog na sinusunog kasama ang mga pinuno ng Moab, at ang tanong ni Balak tungkol sa sinalita ni Yahweh. Ang pagpapangalan kay Balak sa halip na panatilihin ang panghalip ay ligtas na paglilinaw batay sa agarang konteksto.'
