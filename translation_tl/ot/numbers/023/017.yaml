language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: tl
  text: Dumating siya kay Balak. Naroon si Balak, nakatayo sa tabi ng kanyang handog na sinusunog, kasama ang mga pinuno ng Moab.[a] Sinabi sa kanya ni Balak, “Ano ang sinabi ni Yahweh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga opisyal ng Moab.”
    reason: Ang שָׂרֵי ay maaaring mangahulugang mga pinuno, maharlika, o opisyal.
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: Dumating siya kay Balak
  rationale: Ang בוא ay karaniwang nangangahulugang ‘dumating’ o ‘pumaroon.’ Nilinaw ang tinutukoy ng panghalip bilang si Balak upang maging natural at madaling maunawaan sa Tagalog, nang hindi idinaragdag ang mas interpretibong ‘bumalik.’
- source_word: וְהִנּוֹ
  choice: Naroon si Balak
  rationale: Ang הִנֵּה na may hulaping panghalip ay tumatawag ng pansin sa taong nadatnan. Ang ‘Naroon si Balak’ ay natural na modernong Tagalog at pinananatili ang biglang pagtutok ng salaysay.
- source_word: נִצָּב
  choice: nakatayo
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na kalagayan o postura nang dumating si Balaam.
- source_word: עַל עֹלָתוֹ
  choice: sa tabi ng kanyang handog na sinusunog
  rationale: Sa kontekstong ito, ang עַל ay lokatibo at maaaring mangahulugang ‘sa tabi’ o ‘malapit sa.’ Ang עֹלָה ay handog na lubusang sinusunog; ang pariralang ito ay malinaw at karaniwan sa modernong Tagalog.
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: kasama ang mga pinuno ng Moab
  rationale: Ang שָׂרִים ay maaaring tumukoy sa mga pinuno, opisyal, o maharlika. Ang ‘mga pinuno’ ay malawak at natural, habang inilalagay sa talababa ang tunay na alternatibong ‘mga opisyal.’
- source_word: מַה דִּבֶּר
  choice: Ano ang sinabi
  rationale: Ang דבר ay ‘magsalita’ o ‘magsabi.’ Ang ‘Ano ang sinabi’ ang pinakanatural na tanong sa Tagalog at tapat sa natapos na banal na pahayag na hinihingi ni Balak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Pagkakakilanlan ng may-ari ng handog
  choice: kanyang handog na sinusunog
  alternative: ang handog na sinusunog ni Balak
  rationale: Pinananatili ang hulaping panghalip ng Hebreo. Bagaman si Balak ang pinakamalapit na tinutukoy sa konteksto, hindi ginawang tahasang pangalan ang pagmamay-ari sa pariralang ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Nilinaw sa unang dalawang sugnay ang mga tinutukoy na tauhan upang maiwasan ang malabong sunod-sunod na ‘siya,’ habang hindi ginagamit ang interpretibong ‘bumalik.’
