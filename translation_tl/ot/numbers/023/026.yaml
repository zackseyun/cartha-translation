base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: tl
  text: Sumagot si Balaam at sinabi kay Balak, “Hindi ba sinabi ko sa iyo, ‘Lahat ng sasabihin ni Yahweh ay gagawin ko’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Sumagot ... at sinabi
  rationale: Pinananatili ang dalawang pandiwang pormula ng salaysay sa Hebreo habang nananatiling natural sa makabagong Tagalog.
- source_word: הֲלֹא דִּבַּרְתִּי אֵלֶיךָ
  choice: Hindi ba sinabi ko sa iyo
  rationale: Ang “Hindi ba” ay retorikal na tanong na umaasang sasang-ayon ang kausap; natural na katumbas ng pagsasalita sa isang tao ang “sinabi ko sa iyo.”
- source_word: כֹּל אֲשֶׁר יְדַבֵּר יְהוָה
  choice: Lahat ng sasabihin ni Yahweh
  rationale: Ipinahahayag ng imperfect ang anumang sasabihin ni Yahweh sa kaugnay na pagkakataon; malinaw at komprehensibo ang “lahat ng sasabihin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang nasa tekstong Hebreo.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: ay gagawin ko
  rationale: Ang panghalip na layon ay tumutukoy pabalik sa lahat ng sasabihin ni Yahweh; natural na naipapakita ito ng ayos na “ay gagawin ko.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang ginamit sa Hebreo, kaya pinananatili itong pangalan sa salin sa halip na palitan ng titulo.
- issue: Saklaw ng pangako ni Balaam
  choice: “Lahat ng sasabihin ni Yahweh ay gagawin ko”
  alternative: “Anuman ang iutos ni Yahweh ay gagawin ko”
  rationale: Hindi tahasang gumagamit ang Hebreo ng pandiwang “mag-utos”; pinananatili ng salin ang mas malawak at bahagyang tensiyong pahayag na “sasabihin.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na pormulang “Sumagot ... at sinabi” at ang retorikal na tanong, ngunit ginamit ang karaniwang “sinabi ko sa iyo” upang maiwasan ang matigas na literalismo.
