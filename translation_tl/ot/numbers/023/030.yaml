  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinanatili ang payak na daloy ng salaysay at ang bokabularyong pansakripisyo nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
