base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: tl
  text: Kaya ginawa ni Balak ang sinabi ni Balaam, at inihandog niya sa altar ang isang toro at isang lalaking tupa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Sa pariralang כַּאֲשֶׁר אָמַר, ang עשה ay nangangahulugang kumilos ayon sa sinabi ng iba; natural sa Tagalog ang “ginawa ... ang sinabi.”
- source_word: כַּאֲשֶׁר
  choice: ang sinabi
  rationale: Isinama sa likas na Tagalog na konstruksyong “ginawa ... ang sinabi ni Balaam,” na tapat sa diwang pagsunod o pag-ayon sa naunang utos.
- source_word: אָמַר
  choice: sinabi
  rationale: Ang aspektong naganap na ay sapat upang ipakitang nauna ang sinabi ni Balaam bago kumilos si Balak; hindi kailangan ng mabigat na anyong tahasang nagsasaad ng past perfect.
- source_word: וַיַּעַל
  choice: inihandog
  rationale: Sa kontekstong pansakripisyo, ang עלה ay tumutukoy sa paghahandog sa altar. Malinaw at natural ang “inihandog” sa modernong Tagalog.
- source_word: פָּר
  choice: isang toro
  rationale: Tiyak at karaniwang katawagan sa lalaking baka na inihahandog, nang hindi gumagamit ng lipas o teknikal na salita.
- source_word: אַיִל
  choice: isang lalaking tupa
  rationale: Malinaw na ipinapahayag ang kasarian ng אַיִל at mas madaling maunawaan ng ordinaryong mambabasa kaysa sa salitang “barako,” na maaaring mag-iba ang gamit.
- source_word: בַּמִּזְבֵּחַ
  choice: sa altar
  rationale: Natural na Tagalog para sa lokasyon ng paghahandog; sa konteksto, malinaw na ang handog ay inilagay at sinunog sa ibabaw ng altar.
- source_word: וַ
  choice: Kaya
  rationale: Ipinahihiwatig ng panimulang waw ang pagpapatuloy at bunga ng naunang tagubilin; ang “Kaya” ay natural na nag-uugnay sa pagsunod ni Balak.
