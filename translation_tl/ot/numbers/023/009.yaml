  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: tl
  text: 'Sapagkat mula sa taluktok ng mga batuhan ay nakikita ko siya,


    at mula sa mga burol ay minamasdan ko siya.


    Narito, isang bayang naninirahang bukod,


    at hindi itinuturing ang sarili nito na kabilang sa mga bansa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at hindi ibinibilang na kabilang sa mga bansa.” Maaaring unawain ang pandiwang Hebreo bilang pasibo, gayundin bilang reflexive o middle.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang ugnayang nagpapaliwanag sa naunang bahagi ng orakulo nang hindi labis na nililinaw ang uri ng sanhi.
- source_word: מֵרֹאשׁ צֻרִים
  choice: mula sa taluktok ng mga batong-bangin
  rationale: Ang רֹאשׁ ay tumutukoy sa taluktok sa ganitong kontekstong heograpiko, at ang צֻרִים ay mga batuhan o matatarik na batong-bangin; pinananatili ng parirala ang larawan ng mataas na pinagmamasdan.
- source_word: אֶרְאֶנּוּ
  choice: nakikita ko siya
  rationale: Pinananatili ang pang-isahang pagtukoy ng Hebreo sa Israel bilang isang sambayanan.
- source_word: וּמִגְּבָעוֹת
  choice: at mula sa mga burol
  rationale: Tuwirang katumbas na nagpapanatili sa paralelismo ng tula.
- source_word: אֲשׁוּרֶנּוּ
  choice: minamasdan ko siya
  rationale: Ipinahihiwatig ang mas masusing pagtingin at naiiwasang ulitin lamang ang naunang pandiwang 'nakikita.'
- source_word: הֶן
  choice: Narito
  rationale: Natural at marangal na pantawag-pansin sa modernong Tagalog.
- source_word: עָם
  choice: isang bayan
  rationale: Ang 'bayan' ay tumutukoy rito sa isang sambayanang may sama-samang pagkakakilanlan, hindi lamang sa isang lugar.
- source_word: לְבָדָד יִשְׁכֹּן
  choice: namumuhay nang bukod
  rationale: Inihahayag ang katangiang pagiging hiwalay o bukod nang hindi ipinipilit kung ang imperfect ay kasalukuyang pangkalahatan o tahasang panghinaharap.
- source_word: וּבַגּוֹיִם לֹא יִתְחַשָּׁב
  choice: at hindi itinuturing ang sarili nito na kabilang sa mga bansa
  rationale: Nagbibigay ng natural na reflexive/middle na pagbasa sa Hitpael habang pinananatili sa talababa ang maaari ring pasibong pagbasa.
theological_decisions:
- issue: Kung reflexive/middle o passive ang יִתְחַשָּׁב sa huling sugnay
  choice: hindi itinuturing ang sarili nito na kabilang sa mga bansa
  alternative: hindi ibinibilang na kabilang sa mga bansa
  rationale: Maaaring unawain ang anyong Hitpael bilang reflexive/middle o passive. Ginamit sa teksto ang reflexive na pagbasa, ngunit inilagay sa talababa ang tunay na posibleng pasibong pagbasa upang hindi lutasin nang tahimik ang kalabuan.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang paralelismo at anyong patula, gayundin ang pang-isahang pagtukoy sa Israel bilang isang bayan. Inilagay ang [a] sa huling sugnay, kung saan aktuwal na matatagpuan ang kalabuan ng pandiwang Hebreo.
