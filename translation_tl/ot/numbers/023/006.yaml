  text: וַ/יָּ֣שָׁב אֵלָ֔י/ו וְ/הִנֵּ֥ה נִצָּ֖ב עַל עֹלָת֑/וֹ ה֖וּא וְ/כָל שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: tl
  text: Pagkatapos, bumalik siya kay Balak. Naroon si Balak, nakatayo sa tabi ng handog na sinusunog niya, kasama ang lahat ng mga pinuno ng Moab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: bumalik siya kay Balak
  rationale: 'Nilinaw ang reperente ng panghalip ayon sa agarang konteksto: si Balaam ang bumalik kay Balak. Mas natural sa Filipino ang “kay Balak” kaysa sa malabong “sa kanya.”'
- source_word: וְהִנֵּה
  choice: Naroon
  rationale: Ipinahahayag ang biglaang pagtanaw o pagkatuklas na dala ng הִנֵּה sa natural na modernong Tagalog, nang hindi gumagamit ng lipas na “narito.”
- source_word: נִצָּב עַל עֹלָתוֹ
  choice: nakatayo sa tabi ng handog na sinusunog niya
  rationale: Ang עַל sa kontekstong ito ay lokatibo, kaya “sa tabi ng”; ang עֹלָה ay handog na lubusang sinusunog. Ang “niya” ay pinanatili bilang pagmamay-ari nang hindi dinaragdagan ang ritwal na detalye.
- source_word: שָׂרֵי מוֹאָב
  choice: mga pinuno ng Moab
  rationale: Ang שַׂר ay maaaring tumukoy sa pinuno o opisyal; “mga pinuno” ang malinaw at malawak na katumbas sa kasalukuyang Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang mga pangalan upang alisin ang kalituhang likas sa magkakasunod na panlalaking panghalip, batay sa malinaw na konteksto ng salaysay. Walang idinagdag na denominasyonal o teolohikal na pagpapakahulugan.
