id: NUM.23.19
reference: Numbers 23:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: tl
  text: Hindi tao ang Diyos para magsinungaling, ni anak ng tao[b] para magbago ng isip.[a] Nagsabi ba siya at hindi niya gagawin? Nangusap ba siya at hindi niya pagtitibayin iyon?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umurong” o “magbago ng pasya”; ayon sa tradisyon, “magsisi.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbabago ng gagawin o sa pag-urong. Dito, ang diin ay sa pagiging maaasahan ng Diyos, hindi sa pagsisisi niya sa kasalanan.
    reason: lexical_alternative
  - marker: b
    text: Ang “anak ng tao” dito ay isang idyomang Hebreo para sa isang tao; hindi ito mesiyanikong titulo.
    reason: cultural_note
  - marker: c
    text: Maaari ring “tutuparin iyon” o “pangyayarihin iyon.” Sa literal, ang Hebreo ay nangangahulugang “patatayuin iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Diyos
  rationale: Sa konteksto, tumutukoy ang אֵל sa Diyos ng Israel. Likas sa Tagalog ang “Diyos” at malinaw nitong naipapakita ang paghahambing sa tao.
- source_word: אִישׁ
  choice: tao
  rationale: Bagaman maaari itong tumukoy sa isang lalaki, ang punto rito ay ang kaibahan ng Diyos sa sangkatauhan. Ang “tao” ang natural at tumpak na salin sa modernong Tagalog.
- source_word: וִיכַזֵּב
  choice: para magsinungaling
  rationale: Karaniwang nangangahulugan ang כזב na magsinungaling o mapatunayang hindi totoo. Pinananatili ng “magsinungaling” ang tuwirang diwa ng pagiging mapagkakatiwalaan ng Diyos.
- source_word: בֶן אָדָם
  choice: anak ng tao
  rationale: Pinananatili nito ang anyo at paralelismo ng Hebreo. Sa talatang ito, karaniwang katawagan ito sa isang taong mortal at hindi isang mesiyanikong titulo.
- source_word: וְיִתְנֶחָם
  choice: para magbago ng isip
  rationale: Ang hitpael ng נחם dito ay tumutukoy sa pagbabago ng balak o pag-urong, hindi sa pagsisisi sa kasalanan. Ang “magbago ng isip” ay malinaw at hindi nagdaragdag ng moral na kahulugang wala sa konteksto.
- source_word: הַהוּא אָמַר
  choice: Nagsabi ba siya
  rationale: Bagaman maaaring basahing pahayag ang anyong Hebreo, bahagi ito ng isang retorikal na tanong. Natural itong naihahayag sa Tagalog sa ganitong anyo.
- source_word: יַעֲשֶׂה
  choice: hindi niya gagawin
  rationale: Malawak ang kahulugan ng עשה, ngunit ipinahihiwatig dito ang paggawa ng sinabi. Ang “gagawin” ay tuwiran at natural.
- source_word: וְדִבֶּר
  choice: Nangusap ba siya
  rationale: Pinananatili ng “nangusap” ang paralelismo sa “nagsabi” at ang marangal na himig ng talata nang hindi nagiging lipas ang wika.
- source_word: יְקִימֶנָּה
  choice: hindi niya pagtitibayin iyon
  rationale: Ang hiphil ng קום ay literal na “patayuin” at maaaring mangahulugang pagtibayin, itatag, o tuparin. Ang “pagtitibayin iyon” ay nagpapanatili sa larawan ng pagpapatatag sa binigkas na salita.
theological_decisions:
- issue: Ang pahayag tungkol sa pagbabago ng isip ng Diyos sa וְיִתְנֶחָם
  choice: magbago ng isip
  alternative: umurong; magbago ng pasya; magsisi
  rationale: Itinatampok ng konteksto ang pagiging maaasahan ng Diyos sa kaibahan ng pabago-bagong tao. Hindi ipinapahiwatig ng salin na nagsisisi ang Diyos sa kasalanan, ngunit hindi rin nito ginagawang isang masaklaw na pilosopikong pahayag ang talata.
- issue: Kung mesiyanikong titulo ang בֶן אָדָם
  choice: karaniwang idyomang “anak ng tao,” na tumutukoy sa isang tao
  alternative: tao; taong mortal
  rationale: Sa Bilang 23:19, bahagi ito ng makatang paralelismo at hindi ginagamit bilang titulo ng Mesiyas. Pinanatili ang literal na anyo at nilinaw ang kahulugan sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang payak na ayos ng pangungusap at pinanatili ang dalawang retorikal na tanong at ang makatang paralelismo ng Hebreo.
