id: NUM.23.28
reference: Numbers 23:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֥ח בָּלָ֖ק אֶת בִּלְעָ֑ם רֹ֣אשׁ הַ/פְּע֔וֹר הַ/נִּשְׁקָ֖ף עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: tl
  text: Pagkatapos, dinala ni Balak si Balaam sa tuktok ng Peor, na nakatanaw sa ilang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Jeshimon.” Ang salitang Hebreo ay maaaring mangahulugang isang ilang o tiwangwang na lupain, o maaari itong tumukoy sa pangalan ng isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Pagkatapos, dinala
  rationale: Isinusulong ng waw-consecutive ang salaysay. Sa kontekstong pagdadala sa isang lugar, likas sa Filipino ang “dinala,” samantalang malinaw na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod.
- source_word: בָּלָק
  choice: Balak
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: אֶת בִּלְעָם
  choice: si Balaam
  rationale: Hindi isinasalin ang pananda ng tuwirang layon; ginagamit ang personal marker na “si” ayon sa balarilang Filipino.
- source_word: רֹאשׁ
  choice: tuktok
  rationale: Sa topograpikong konteksto, tumutukoy ito sa pinakamataas na bahagi o taluktok ng isang mataas na lugar. Ang “tuktok” ay malinaw at natural.
- source_word: הַפְּעוֹר
  choice: Peor
  rationale: Pinanatili bilang pangalang pantangi ng lugar; hindi hiwalay na kinakatawan ang artikulong Hebreo sa idiomatikong Filipino.
- source_word: הַנִּשְׁקָף
  choice: na nakatanaw
  rationale: Ipinahahayag ng Niphal participle ang isang mataas na lugar na nakaharap o nakadungaw sa isang pook. Ang “nakatanaw” ay natural at pinananatili ang topograpikong larawan.
- source_word: עַל פְּנֵי
  choice: sa
  rationale: Bagaman literal na “sa ibabaw ng mukha ng,” ang payak na “sa” ay naghahatid ng ugnayang heograpiko nang natural kasama ng “nakatanaw,” nang hindi lumilikha ng alanganing parirala sa Filipino.
- source_word: הַיְשִׁימֹן
  choice: ilang
  rationale: Maaaring tumukoy ang יְשִׁימֹן sa tigang at tiwangwang na lupain o maaari itong unawain bilang pangalang-lugar. Ang “ilang” ay maikli, likas, at nagpapahayag ng desyertong kaparangan; itinatala sa talababa ang tunay na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dinala” para sa likas na paglalarawan ng pag-akay sa isang tao patungo sa lugar, at “nakatanaw sa ilang” para sa madaling maunawaang topograpikong larawan. Pinanatili sa talababa ang kalabuan kung paglalarawan o pangalang-lugar ang הַיְשִׁימֹן.
