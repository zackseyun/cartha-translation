  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: tl
  text: Sino ang makabibilang sa alabok ni Jacob, o makabibilang sa ikaapat na bahagi ng Israel[a]? Nawa’y mamatay ang kaluluwa ko ng kamatayang tulad ng sa mga matuwid[b], at maging tulad ng sa kanya ang aking wakas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi ganap na tiyak ang parirala. Maaari ring isalin: “o makabibilang sa mga bahagi (o mga panig) ng Israel”; mas malayang pagpapakahulugan: “o makabibilang kahit sa ikaapat na bahagi ng Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “mga banal” o “mga taong matuwid.”'
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, pang-isahan ang “kanya.” Maaaring tumukoy ito sa isang kinatawang taong matuwid, kahit kolektibo ang “mga matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָנָה
  choice: Sino ang makabibilang
  rationale: Ang tanong ay retorikal at nagpapahiwatig na imposibleng bilangin; likas sa modernong Tagalog ang pagdaragdag ng “maka-” upang ihayag ang kakayahang ipinahihiwatig ng Hebreo.
- source_word: עֲפַר יַעֲקֹב
  choice: sa alabok ni Jacob
  rationale: Pinananatili ang larawang patula ng alabok, na nagpapahiwatig ng di-mabilang na mga inapo, at ang pangalang Jacob bilang katapat ng Israel sa paralelismo.
- source_word: וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל
  choice: o makabibilang sa ikaapat na bahagi ng Israel
  rationale: Inihahayag na pandiwa sa Tagalog ang paralelismong numerikal. Ang רֹבַע ay pinanatili sa pinakaliteral na diwang “ikaapat na bahagi,” nang hindi tahasang ipinapasok sa pangunahing teksto ang pagpapakahulugang kahit isang kapat lamang ay hindi na mabibilang.
- source_word: תָּמֹת נַפְשִׁי
  choice: Mamatay nawa ang kaluluwa ko
  rationale: Pinananatili ang נַפְשִׁי bilang “kaluluwa ko” at ang himig ng paghahangad sa pamamagitan ng “nawa,” habang nananatiling malinaw sa Tagalog.
- source_word: מוֹת יְשָׁרִים
  choice: tulad ng pagkamatay ng mga taong matuwid
  rationale: Ang יְשָׁרִים ay tumutukoy sa mga taong tuwid o matuwid; ang “mga taong matuwid” ay natural at hindi nagdaragdag ng isang mas makitid na sistematikong kategoryang teolohikal.
- source_word: וּתְהִי אַחֲרִיתִי
  choice: at ang wakas ko ay maging
  rationale: Ang אַחֲרִית ay maaaring tumukoy sa wakas o kahihinatnan. Ang “wakas” ay maikli, natural, at umaayon sa naunang pahayag tungkol sa kamatayan.
- source_word: כָּמֹהוּ
  choice: tulad ng sa kanya
  rationale: Pinananatili ang panlalaking pang-isahang hulapi ng Hebreo sa pamamagitan ng pang-isahang “kanya,” kahit maramihan ang kolektibong tinutukoy na mga matuwid.
theological_decisions:
- issue: Kahulugan ng יְשָׁרִים
  choice: mga taong matuwid
  alternative: mga taong tama ang pamumuhay
  rationale: Pinananatili ng “matuwid” ang moral at panrelihiyong bigat ng salita nang hindi ito nililimitahan sa isang partikular na doktrinang denominasyonal.
- issue: Pag-unawa sa רֹבַע יִשְׂרָאֵל
  choice: ikaapat na bahagi ng Israel
  alternative: mga pangkat ng Israel; karamihan ng Israel
  rationale: Mas malapit sa karaniwang leksikal na diwa ng רֹבַע ang “ikaapat na bahagi.” Iniiwan sa talababa ang ibang posibleng pag-unawa upang hindi lutasin nang palihim ang tunay na kalabuan.
- issue: Pang-isahang hulapi sa כָּמֹהוּ
  choice: tulad ng sa kanya
  alternative: tulad ng sa kanila
  rationale: Pinananatili ang pang-isahang anyo ng tekstong Hebreo. Maaaring tumukoy ito sa isang kinatawang taong matuwid, bagaman kolektibo at maramihan ang naunang יְשָׁרִים.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang patulang “alabok,” “kaluluwa,” at “wakas,” habang iniwasan ang labis na makaluma o denominasyonal na pananalita. Ang anyong “nawa” ay angkop sa taimtim na paghahangad ni Balaam.
