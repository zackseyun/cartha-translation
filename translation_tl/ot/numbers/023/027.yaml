base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: tl
  text: Sinabi ni Balak kay Balaam, “Halika, isasama kita sa ibang lugar. Baka maging tama ito sa paningin ng Diyos[a], at mula roon ay sumpain mo ang Israel para sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “maging kalugod-lugod ito sa paningin ng Diyos.” Ang idyomang Hebreo ay maaaring mangahulugang maging tama o maging kalugod-lugod sa paningin ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה נָּא
  choice: Halika
  rationale: Ang pautos na לְכָה ay ginagamit dito bilang paanyaya o panawagan, at pinalalambot ng נָּא. Sa modernong Tagalog, likas na naipahihiwatig ng “Halika” ang magalang na paghimok sa kontekstong ito.
- source_word: אֶקָּחֲךָ
  choice: isasama kita
  rationale: Bagaman anyong imperfect ang pandiwa, bolisyonal ang gamit nito kasunod ng paanyaya. Mas natural sa Tagalog ang “isasama kita” kaysa literal na “hayaan mong dalhin kita.”
- source_word: מָקוֹם אַחֵר
  choice: ibang lugar
  rationale: Direkta at natural na salin ng pagbabago ng lugar o pananaw na nais ni Balak.
- source_word: אוּלַי
  choice: Baka
  rationale: Ipinapahayag nito ang pag-asa o posibilidad ni Balak nang hindi nagpapahiwatig ng katiyakan.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: maging kalugod-lugod ito sa paningin ng Diyos
  rationale: Pinananatili ang Hebreong idyomang “sa paningin ng Diyos” at ang saklaw nitong maaaring mangahulugang tama o kalugod-lugod. Ang “ito” ay tumutukoy sa iminungkahing gagawin mula sa ibang lugar, yamang walang tahasang simuno ang pandiwang Hebreo.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Sa agarang salaysay, ito ang Diyos na kumakausap at nagtatakda sa sasabihin ni Balaam; hindi kailangang gawing pangkalahatang “isang diyos.”
- source_word: וְקַבֹּתוֹ לִי
  choice: at isumpa mo ... ang Israel para sa akin
  rationale: Ang קבב ay nangangahulugang “sumpain.” Ang hulaping panghalip na isahan ay tumutukoy sa Israel bilang isang sambayanan; ginawang tahasan ang “Israel” sa Tagalog upang maiwasan ang malabong panghalip.
- source_word: מִשָּׁם
  choice: roon
  rationale: Natural na ipinahahayag sa Tagalog ang pagkilos mula sa bagong lugar; ang “roon” ay sapat sa konteksto upang tukuyin ang lugar na iyon.
theological_decisions:
- issue: Tinutukoy ng הָאֱלֹהִים sa pananalita ni Balak
  choice: Diyos
  alternative: ang diyos / isang diyos
  rationale: Ipinakikilala ng konteksto ang tinutukoy bilang Diyos na nagtatakda sa maipapahayag ni Balaam. Pinananatili ng “Diyos” ang sangguniang ito nang hindi nagdaragdag ng politeistikong pagpapakahulugan.
- issue: Kahulugan ng יִישַׁר בְּעֵינֵי
  choice: maging kalugod-lugod ... sa paningin
  alternative: maging tama ... sa paningin
  rationale: Saklaw ng idyoma ang pagiging tama o kalugod-lugod sa paningin ng isang tao. Pinili ang natural na “kalugod-lugod” sa pangunahing teksto at inilagay sa talababa ang leksikal na alternatibo upang hindi burahin ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Halika” bilang natural na paanyaya, “isasama kita” para sa bolisyonal na diwa, at “ang Israel” sa halip na malabong panghalip na isahan. Napanatili ang idyomang “sa paningin ng Diyos,” habang ipinaliwanag sa talababa ang tunay na leksikal na alternatibo.
