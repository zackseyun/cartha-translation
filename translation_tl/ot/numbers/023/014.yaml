base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: tl
  text: Kaya dinala niya siya sa Bukid ng mga Tanod[a], sa tuktok ng Pisga. Nagtayo siya roon ng pitong altar at naghandog ng isang toro at isang lalaking tupa sa bawat altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bukid ng Zofim.” Maaaring unawain ang pariralang Hebreo bilang paglalarawan ng lugar (“Bukid ng mga Tanod/Nagmamasid”) o bilang pangalang-lugar na pinanatili sa transliterasyon.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: Kaya dinala niya siya
  rationale: Ang wayyiqtol ng לקח na may panlaping layon na 3ms ay nagsasaad ng kasunod na kilos sa salaysay. Natural sa Tagalog ang “Kaya dinala niya siya”; nananatiling implicit ang mga pangalang Balak at Balaam gaya sa Hebreo.
- source_word: שְׂדֵה צֹפִים
  choice: Bukid ng mga Tanod
  rationale: Ang pariralang construct ay literal na “bukid ng mga nagmamasid/tanod.” Isinalin ang leksikal na kahulugan ngunit ginamit ang malaking titik dahil maaari rin itong tumukoy sa isang pangalan ng lugar; nasa talababa ang transliterasyong “Zofim.”
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: sa tuktok ng Pisga
  rationale: Sa heograpikong gamit, ang רֹאשׁ ay “tuktok,” at ang הַפִּסְגָּה ay itinuring na pangalang-lugar na Pisga.
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: Nagtayo siya roon ng pitong altar
  rationale: Tuwirang salin ng בנה at “pitong altar.” Idinagdag ang “roon” bilang natural na pang-ugnay sa Tagalog nang hindi nagdaragdag ng bagong pangyayari.
- source_word: וַיַּעַל
  choice: naghandog
  rationale: Sa kontekstong pansakripisyo, ang עלה ay tumutukoy sa pag-aalay o paghahandog. Ang “naghandog” ay malinaw at natural.
- source_word: פָּר וָאַיִל
  choice: isang toro at isang lalaking tupa
  rationale: Ang mga pangngalan ay isahan. Nililinaw ng “lalaking tupa” ang אַיִל at madaling maunawaan ng karaniwang mambabasa.
- source_word: בַּמִּזְבֵּחַ
  choice: sa bawat altar
  rationale: 'Bagaman isahan ang anyo sa Hebreo, distributibo ang diwa matapos banggitin ang pitong altar at ayon sa paulit-ulit na ritwal sa konteksto: tig-isang toro at lalaking tupa sa bawat altar.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatiling panghalip ang simuno at layon dahil gayon din ang Hebreo at malinaw ang mga tinutukoy mula sa konteksto. Ginamit ang “altar,” isang karaniwan at madaling makilalang terminong biblikal sa Filipino.
