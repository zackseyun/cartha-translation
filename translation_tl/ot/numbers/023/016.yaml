base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: tl
  text: At nakipagtagpo si Yahweh kay Balaam[a], at naglagay siya ng salita sa bibig ni Balaam. Sinabi ni Yahweh, “Bumalik ka kay Balak, at ganito ang iyong sasabihin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakasalubong ni Yahweh si Balaam” o “nakatagpo ni Yahweh si Balaam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: nakipagtagpo
  rationale: Ang pandiwang קָרָה ay tumutukoy rito sa isang pagtatagpo o engkuwentro. Ang “nakipagtagpo” ay natural at marangal sa Filipino, at hindi nito ipinapalagay na isang pangitain o pagpapakita ang nangyari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: naglagay ng salita sa kanyang bibig
  rationale: Malapit ito sa idyomang Hebreo para sa pananalitang ibinigay ng Diyos at pinananatili ang isahang דָּבָר, “salita.”
- source_word: שׁוּב
  choice: Bumalik ka
  rationale: Tuwirang ipinahahayag ng pautos na anyo na dapat bumalik si Balaam kay Balak.
- source_word: וְכֹה תְדַבֵּר
  choice: at ganito ang iyong sasabihin
  rationale: Malinaw at likas sa modernong Filipino bilang pormulang nagpapakilala sa mensaheng ipahahayag, habang pinananatili ang tiyak na utos.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Ang Diyos ang nagbibigay ng ipahahayag ni Balaam
  choice: naglagay ng salita sa kanyang bibig
  alternative: nagbigay sa kanya ng mensahe
  rationale: 'Pinananatili ng napiling anyo ang matinding larawan at tensiyong teolohikal ng Hebreo: ang mismong sasabihin ni Balaam ay inilalagay ng Diyos sa kanyang bibig, nang hindi higit na ipinapaliwanag ang paraan nito.'
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “ganito ang iyong sasabihin” sa halip na mas literal ngunit hindi gaanong likas na “ganito ka magsasalita.” Hinati sa dalawang pangungusap upang maging malinaw at natural ang daloy nang hindi binabago ang ugnayan ng mga sugnay.
