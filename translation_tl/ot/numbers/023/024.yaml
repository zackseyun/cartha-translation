  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: tl
  text: Narito[a], bumabangon ang isang bayan na gaya ng leona, at tumitindig na gaya ng leon. Hindi ito hihimlay hanggang sa kainin nito ang nasila at inumin ang dugo ng mga napatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tingnan.”
    reason: Ang הֶן ay isang mariing pantawag-pansin at maaaring isalin sa higit sa isang natural na paraan.
lexical_decisions:
- source_word: הֶן
  choice: Narito
  rationale: Isang mariing pantawag-pansin na likas at marangal sa makabagong Tagalog; pinananatili nito ang bigat ng pambungad nang hindi gumagamit ng labis na arkaikong anyo.
- source_word: עָם
  choice: isang bayan
  rationale: Tumutukoy sa Israel bilang isang sama-samang pangkat ng mga tao. Mas angkop dito ang “bayan” kaysa “bansa” dahil kolektibong katauhan ang diin ng tula.
- source_word: כְּלָבִיא
  choice: gaya ng leona
  rationale: Maaaring tumukoy ang לָבִיא sa leon sa pangkalahatan, ngunit maaaring maging tiyak na leona sa patulang gamit. Pinananatili ng “leona” ang posibleng leksikal na pagkakaiba nito sa kasunod na אֲרִי.
- source_word: יָקוּם
  choice: bumabangon
  rationale: Ang di-ganap na anyo ng קום ay naglalarawan sa mabangis na hayop na bumabangon upang kumilos; natural at malinaw ang “bumabangon” sa Tagalog.
- source_word: וְכַאֲרִי
  choice: at tumitindig na gaya ng leon
  rationale: Karaniwang salita para sa leon ang אֲרִי. Ipinahahayag ng “tumitindig” ang reflexive na kilos ng יִתְנַשָּׂא nang hindi inililipat ang larawan tungo sa abstraktong pagmamataas.
- source_word: לֹא יִשְׁכַּב
  choice: Hindi ito hihimlay
  rationale: Pinananatili ang kongkretong larawan ng hayop na hindi nahihiga o nagpapahinga, at ang hinaharap na diwa sa konteksto ng orakulo.
- source_word: עַד יֹאכַל טֶרֶף
  choice: hanggang sa makain nito ang nasila
  rationale: Tuwirang pinananatili ng “makain” ang payak na pandiwang אָכַל, samantalang ang “nasila” ay naghahatid sa טֶרֶף bilang hinuling pagkain o prey nang hindi dinaragdagan ang tindi ng pandiwa.
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: at mainom ang dugo ng mga napatay
  rationale: Sa kontekstong pandigma, ang חֲלָלִים ay likas na tumutukoy sa mga napatay. Pinananatili ang tahasan at matinding larawan ng Hebreo.
theological_decisions:
- issue: Marahas na larawan sa orakulo ni Balaam
  choice: Panatilihin ang larawan ng pagsila at pag-inom ng dugo bilang matinding metapora ng tagumpay at di-mapipigilang lakas.
  alternative: Palambutin ito bilang pangkalahatang pahayag tungkol sa tagumpay.
  rationale: Sadyang matindi ang Hebreo. Hindi ito dapat palabnawin o ipakahulugang utos na literal na uminom ng dugo; bahagi ito ng patulang larawan ng Israel bilang leon.
translation_notes:
  register: Makabago, marangal, at malinaw na Tagalog na nagpapanatili sa patulang paralelismo at matinding larawang pandigma. Ginamit ang “ito” bilang panghalip sa kolektibong “bayan.”
