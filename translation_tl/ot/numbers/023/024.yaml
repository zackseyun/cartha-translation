  naturalness: Marangal at natural sa makabagong Tagalog ang kabuuan. Mas tuwiran at mas malinaw ang aktibong “inumin nito” kaysa sa “mainom ang dugo.”
  terminology: Ang “leona” at “leon” ay angkop upang mapanatili ang leksikal na pagkakaiba ng לָבִיא at אֲרִי nang hindi pinipilit ang higit na tiyak na interpretasyon. Ang “nasila” at “mga napatay” ay angkop sa matinding patulang larawang pandigma.
