base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: tl
  text: At sinabi niya kay Balak, “Tumayo ka rito sa tabi ng iyong handog na sinusunog, at ako nama’y makikipagtagpo roon.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Makakatagpo ako roon.” Maikli ang pandiwang Hebreo at hindi tahasang tinutukoy kung sino ang makakatagpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: At sinabi niya kay Balak
  rationale: Pinananatili ng “At” ang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi labis na binibigyang-kahulugan ang pagkakasunod-sunod.
- source_word: הִתְיַצֵּב
  choice: Tumayo ka
  rationale: Ang Hitpael na pautos ay nangangahulugang pumuwesto o manatiling nakatayo; natural at malinaw sa modernong Tagalog ang “Tumayo ka.”
- source_word: כֹּה
  choice: rito
  rationale: Sa kontekstong ito, deiktiko at panlunan ang salita. Ang “rito” ay tumutukoy sa lugar kung saan mananatili si Balak.
- source_word: עַל עֹלָתֶךָ
  choice: sa tabi ng iyong handog na sinusunog
  rationale: Maaaring panlunan ang עַל, “sa tabi” o “malapit sa,” at ang עֹלָה ay isang handog na ganap na sinusunog. Malinaw at likas ang parirala sa Tagalog.
- source_word: וְאָנֹכִי
  choice: at ako nama’y
  rationale: 'Ang tahasang panghalip ay may banayad na diin o paghahambing: mananatili si Balak rito, samantalang aalis ang nagsasalita. Ipinahahayag ito ng “ako nama’y.”'
- source_word: אִקָּרֶה
  choice: pupunta ... upang makipagtagpo sa kanya
  rationale: Maikli at kontekstuwal ang Niphal ng קרה. Ipinahihiwatig ng salaysay ang pagpunta para sa isang pakikipagtagpo, ngunit hindi tahasang pinapangalanan sa talata ang makakatagpo.
- source_word: כֹּה
  choice: roon
  rationale: Ang ikalawang deiktikong gamit ay tumutukoy sa ibang lugar at natural na itinatambal sa unang “rito” bilang “roon.”
theological_decisions:
- issue: Hindi tahasang binanggit na kausap sa inaasahang pakikipagtagpo ni Balaam
  choice: Isinalin bilang “makipagtagpo sa kanya,” na hindi pinapangalanan ang tinutukoy.
  alternative: “Makikipagtagpo ako roon” o “pupunta ako roon upang makipagtagpo,” nang walang panghalip.
  rationale: Sa mas malawak na konteksto, ang inaasahang pakikipagtagpo ay sa PANGINOON, ngunit walang tahasang layon ang pandiwa sa talatang ito. Pinananatili ng panghalip ang personal na diwa nang hindi idinaragdag ang banal na pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang magkatambal na “rito/roon” upang mapanatili ang panlunang paghahambing ng dalawang כֹּה. Inilagay ang talababa pagkatapos ng sugnay na pinaglilinaw nito.
