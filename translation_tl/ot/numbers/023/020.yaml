  naturalness: Mas likas at hindi nakatuon sa isang kausap ang “Narito” kaysa “Tingnan mo” para sa הִנֵּה. Ang “atas na magpala” ay malinaw at marangal sa modernong Filipino, bagaman ang “atas” ay isang kontekstuwal na pagpupuno na dapat ipaliwanag sa talababa.
  terminology: Ang “magpala,” “nagpala siya,” at “mababawi” ay angkop at magkakaugnay na mga katawagan. Hindi pinangalanan ang Diyos sa pangunahing teksto, kaya napananatili ang anyo at bahagyang di-pagtitiyak ng Hebreo.
