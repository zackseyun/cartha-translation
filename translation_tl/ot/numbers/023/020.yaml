  text: הִנֵּ֥ה בָרֵ֖ךְ לָקָ֑חְתִּי וּ/בֵרֵ֖ךְ וְ/לֹ֥א אֲשִׁיבֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: tl
  text: Narito[a], tinanggap ko ang atas na magpala; nagpala siya[b], at hindi ko ito mababawi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tingnan mo” o “Masdan mo.” Panawag-pansin ang Hebreong salita.
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang binabanggit sa Hebreo ang paksa ng “nagpala”; ipinahihiwatig ng konteksto na Diyos iyon.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “hindi ko ito mapapawalang-bisa” o “hindi ko ito maibabalik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Likas at makabagong panawag-pansin sa Filipino, habang pinananatili ang diin ng Hebreong interjection.
- source_word: בָרֵךְ
  choice: magpala
  rationale: 'Ang anyong absolutong infinitibo ay inuunawa rito bilang nilalaman ng tinanggap ni Balaam: ang pagpapala, o ang atas na magpala.'
- source_word: לָקָחְתִּי
  choice: tinanggap ko ang utos
  rationale: Pangunahing diwa ng pandiwa ang pagtanggap; ang 'utos' ay ipinahihiwatig ng konteksto ng pahayag na ibinigay kay Balaam, kaya nililinaw ito sa teksto ngunit itinatala sa talababa na walang tahasang layon sa Hebreo.
- source_word: וּבֵרֵךְ
  choice: nagpala siya
  rationale: Pinananatili ang di-tahasang ikatlong panauhang paksa ng Hebreo; malinaw sa konteksto na Diyos ang tinutukoy nang hindi inilalagay ang pangalang wala sa sugnay.
- source_word: אֲשִׁיבֶנָּה
  choice: hindi ko iyon mababawi
  rationale: Ang Hiphil ng שוב ay may diwang ipabalik o bawiin; sa konteksto, ang likas na Filipino ay tumutukoy sa hindi pagbawi o pagpapawalang-bisa sa pagpapala.
theological_decisions:
- issue: Di-tahasang paksa ng 'nagpala'
  choice: Pinanatili bilang 'siya' sa pangunahing teksto.
  alternative: Tukuyin nang tahasan bilang 'Diyos.'
  rationale: Itinuturo ng konteksto na Diyos ang paksa, ngunit hindi ito pinapangalanan sa mismong Hebreong sugnay; pinananatili ng 'siya' ang kaiklian at bahagyang pagiging di-tahas ng pinagmulan.
- issue: Ano ang tinanggap ni Balaam
  choice: Isinalin bilang 'ang utos na magpala,' na may talababa tungkol sa di-tahasang layon.
  alternative: Mas literal na 'tinanggap kong magpala' o 'tinanggap ko ang pagpapala.'
  rationale: Ang konteksto ay nagpapahiwatig ng atas o pahayag na tinanggap, ngunit hindi tahasang binabanggit ng Hebreo ang layon; nililinaw ng pangunahing teksto ang likas na diwa sa Filipino habang inilalantad ng talababa ang pormal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Tingnan mo' bilang likas na panawag-pansin, at iniwasan ang arkaikong himig. Napanatili ang di-tahasang paksa sa 'siya,' samantalang ang ipinahihiwatig na layon ng 'tinanggap' ay nilinaw sa teksto at tapat na ipinaliwanag sa talababa.
