  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: tl
  text: Sinabi ni Balaam kay Balak, “Ipagtayo mo ako rito ng pitong altar, at ipaghanda mo ako rito ng pitong toro at pitong lalaking tupa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang simpleng “Sinabi” sa kontekstong ito; hindi kailangang idagdag ang “pagkatapos” upang maipakita ang pagkakasunod-sunod.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Ginamit ang nakaugaliang anyo ng pangalang pantangi sa mga saling Tagalog.
- source_word: אֶל בָּלָק
  choice: kay Balak
  rationale: Ang “kay” ang natural na pananda sa taong pinatutungkulan ng sinabi.
- source_word: בְּנֵה לִי
  choice: Ipagtayo mo ako
  rationale: 'Ang pautos na בְּנֵה ay “magtayo,” at ang לִי ay nagpapahayag ng pakinabang o layon: itatayo ang mga altar para kay Balaam.'
- source_word: בָּזֶה
  choice: rito
  rationale: Ang literal na diwang “sa lugar na ito” ay natural at maikli sa “rito,” na angkop sa pananaw ng nagsasalita.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: pitong altar
  rationale: Tuwirang isinasalin ang bilang at pangngalan; karaniwan at malinaw sa modernong Filipino ang “altar.”
- source_word: וְהָכֵן לִי
  choice: at ipaghanda mo ako
  rationale: Ang Hiphil imperative ng כון ay nangangahulugang ihanda o ilaan. Ipinapakita ng “ipaghanda mo ako” ang benefactive na לִי nang natural sa Tagalog.
- source_word: שִׁבְעָה פָרִים
  choice: pitong toro
  rationale: Sa kontekstong paghahandog, ang פָרִים ay mga lalaking baka; malinaw at tuwiran ang “mga toro,” na nagiging “pitong toro” matapos ang pamilang.
- source_word: וְשִׁבְעָה אֵילִים
  choice: at pitong lalaking tupa
  rationale: Ang אֵילִים ay mga adultong lalaking tupa. Mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa hiram na “barakong tupa” o teknikal na katawagan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Pinanatili ang pag-uulit ng “rito” at ang dalawang benefactive na pariralang tumutukoy kay Balaam dahil kapansin-pansin ang mga ito sa Hebreo. Ginamit ang “altar,” isang karaniwan at madaling maunawaang salitang panrelihiyon sa Filipino.
