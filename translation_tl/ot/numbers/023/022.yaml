  source_fidelity: 'Kailangang baguhin ang ikalawang sugnay. Ginawang tahas ng draft ang “Israel” bilang reperente ng לוֹ at isinalin ang Diyos bilang “gaya ng ... mga sungay,” samantalang ang Hebreo ay nananatiling maigsi at mahirap: ang Diyos ang paksa ng unang sugnay, at ang huling parirala ay gumagamit ng pang-isahang “para sa kanya” kasama ng larawan ng mga sungay/lakas ng רְאֵם. Ang rebisyon ay hindi nagdaragdag ng “Israel” at pinananatili ang kongkretong larawang sungay, kasama ng talababa para sa kahirapan at alternatibong “lakas.”'
  naturalness: Ang “para sa Israel, siya ay gaya ng matatayog na sungay” ay hindi likas at nagiging hindi malinaw kung sino ang inihahambing. Mas malinaw sa makabagong Filipino ang “Taglay niya ang mga sungay na gaya ng sa isang mailap na toro,” bagaman ang imaheng ito ay sadyang matalinghaga at ipinaliliwanag sa talababa.
  terminology: Ang “Diyos,” “Ehipto,” at “mailap na toro” ay angkop. Pinanatili ang “mga sungay” upang huwag gawing abstraktong “lakas” ang mahirap na תּוֹעֲפֹת; ibinibigay ang “lakas” bilang alternatibo sa talababa. Hindi dapat ipasok sa teksto ang “Israel,” dahil hindi ito tahasang nakasaad sa huling sugnay.
