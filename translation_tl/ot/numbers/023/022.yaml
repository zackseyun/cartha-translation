  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: tl
  text: Inilalabas sila ng Diyos mula sa Ehipto; taglay niya ang mga sungay na gaya ng sa isang mailap na toro[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap ang pariralang Hebreo. Literal na, “para sa kanya ay gaya ng mga sungay ng isang mailap na toro.” Maaari rin itong isalin, “taglay niya ang lakas ng isang mailap na toro.” Pinananatili rito ang larawan ng mga sungay sa halip na gawing abstraktong “lakas” lamang.
    reason: lexical_alternative
  - marker: b
    text: Sa tradisyon, “unicorn”; mas malamang na tumutukoy ito sa isang mailap na bovine, marahil ay ang wala nang uring aurochs.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Diyos
  rationale: Ang אֵל ang paksa ng pangungusap. Ang payak na “Diyos” ay malinaw at hindi nagdaragdag ng kahulugang wala namang tiyak na ipinahahayag sa anyo rito.
- source_word: מוֹצִיאָם
  choice: inilalabas sila
  rationale: Ang Hiphil na participle na may hulaping pangmaramihan ay naglalarawan sa Diyos bilang siyang naglalabas sa kanila. Pinananatili ng aspektong pangkasalukuyan ang masiglang anyong patula habang tumutukoy sa paglabas mula sa Ehipto.
- source_word: מִמִּצְרָיִם
  choice: mula sa Ehipto
  rationale: Ito ang likas na modernong Tagalog para sa pinanggalingan kasabay ng pandiwang “inilalabas.”
- source_word: כְּתוֹעֲפֹת
  choice: gaya ng matatayog na sungay
  rationale: Mahirap ang salitang תּוֹעֲפֹת at maaaring tumukoy sa matataas o makapangyarihang nakausling sungay, o sa lakas na inilalarawan ng mga ito. Pinananatili rito ang kongkretong larawang-hayop at ang paghahambing na ipinahihiwatig ng כְּ.
- source_word: רְאֵם
  choice: mailap na toro
  rationale: Tumutukoy ang רְאֵם sa isang makapangyarihang mailap na bovine, malamang na aurochs, at hindi sa mitolohikong unicorn. Mas madaling maunawaan ng karaniwang mambabasa ang “mailap na toro” kaysa “aurochs.”
- source_word: לוֹ
  choice: para sa Israel
  rationale: Pang-isahang panlalaki ang hulapi, ngunit sa konteksto ay malamang na tumutukoy ito sa Israel bilang isang sambayanan. Ginawang tahas ang reperente para maging natural sa Tagalog, habang inilalahad sa talababa ang literal na anyo at ang nananatiling sintaktikong kahirapan.
theological_decisions:
- issue: Ugnayan ng Diyos, Israel, at larawan ng mga sungay
  choice: Ang Diyos ay para sa Israel na gaya ng matatayog na sungay ng mailap na toro
  alternative: Taglay ng Israel ang lakas o mga sungay ng mailap na toro
  rationale: Maaaring unawain ang maikling sugnay na Hebreo bilang paglalarawan sa Diyos na makapangyarihang sanggalang ng Israel, o bilang pagsasabing taglay ng Israel ang lakas ng mailap na toro. Pinili ang unang pagbasa dahil natural nitong inuugnay ang לוֹ sa kolektibong Israel at pinananatili ang Diyos bilang paksa, ngunit hindi itinatago sa talababa ang alternatibong pagbasa.
- issue: Pagkakakilanlan ng רְאֵם
  choice: mailap na toro
  alternative: aurochs; unicorn
  rationale: Ang larawan ay tungkol sa lakas ng isang tunay na mailap na bovine, hindi isang pahayag tungkol sa mitolohikong nilalang. Ang “mailap na toro” ay tumpak at madaling maunawaan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “siya” para sa Diyos at ginawang tahas ang kolektibong reperenteng Israel upang maiwasan ang malabong salitan ng pangmaramihan at pang-isahang panghalip, habang pinananatili sa talababa ang tunay na hirap at ambiguwidad ng Hebreo.
