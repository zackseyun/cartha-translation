base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: tl
  text: 'Pagkatapos, binigkas niya ang kanyang pahayag[a] at sinabi:


    “Mula sa Aram ay dinala ako

    ni Balak na hari ng Moab,

    mula sa mga bundok sa silangan[b]:


    ‘Halika, sumpain mo si Jacob para sa akin;

    halika, tuligsain mo ang Israel.’”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang orakulo.” Literal sa Hebreo, “itinaas niya ang kanyang mashal,” isang pormal at patulang kapahayagan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mula sa silanganing mga bundok.” Malamang na heograpikal ang tinutukoy ng pariralang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Iba ang ikalawang pandiwang Hebreo sa salitang isinaling “sumpain.” Tumutukoy ito sa pagtuligsa o matinding pagkondena laban sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: binigkas niya ang kanyang pahayag
  rationale: Ang idyomang Hebreo ay nagpapakilala ng isang pormal at patulang kapahayagan. Natural sa modernong Tagalog ang “binigkas ... ang kanyang pahayag,” samantalang maaaring maging labis na tiyak ang “orakulo” at masyadong makitid ang “salawikain.”
- source_word: מִן אֲרָם
  choice: mula sa Aram
  rationale: Pangalan ng lugar ang Aram at pinanatili ito sa halip na palitan ng mas huling katawagang heograpiko.
- source_word: יַנְחֵנִי
  choice: Dinala ako
  rationale: Ang Hiphil ng נחה ay tumutukoy sa paggabay o pag-akay patungo sa isang lugar. Ang “dinala ako” ay malinaw at natural sa konteksto ng pagpapatawag ni Balak kay Balaam.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: mula sa mga bundok sa silangan
  rationale: Ang קדם ay inuunawang heograpikal na “silangan,” kaayon ng pagbanggit sa Aram bilang pinanggalingan ni Balaam.
- source_word: לְכָה
  choice: Halika
  rationale: Ang pautos ay isang paanyaya o panawagan, kaya natural dito ang “Halika.”
- source_word: אָרָה
  choice: sumpain mo
  rationale: Tuwirang ipinapahayag nito ang pagpapataw ng sumpa at karaniwan ang pandiwang ito sa Tagalog.
- source_word: לִּי
  choice: para sa akin
  rationale: Ipinakikita ng datibo na hinihiling ni Balak ang gawaing ito para sa kanyang kapakinabangan o layunin.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Pinanatili ang kinikilalang anyo ng personal at pambansang pangalan.
- source_word: זֹעֲמָה
  choice: ipahayag mo ang galit laban sa
  rationale: Iba ang pandiwang ito sa naunang אָרָה. Pinananatili ng parirala ang diwa ng galit at matinding paghatol nang hindi ito pinapantay sa “sumpain.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinanatili ang kinikilalang anyo ng personal at pambansang pangalan.
theological_decisions:
- issue: Ang ugnayan ng Jacob at Israel sa kahilingan ni Balak
  choice: Pinanatiling magkahiwalay ang Jacob at Israel bilang magkatumbas na patulang katawagan sa bayang tipan.
  alternative: Pagsamahin ang dalawa sa iisang katawagang gaya ng “mga Israelita.”
  rationale: Sadyang ginagamit ng Hebreo ang magkaparis na pangalang Jacob at Israel. Ang pagpapanatili sa dalawa ay nag-iingat sa patulang paralelismo at pahiwatig ng tipan nang walang idinaragdag na interpretasyong doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang patulang pagkakaayos, ang mga pangalang Aram, Jacob, at Israel, at ang pagkakaiba ng dalawang pandiwang tumutukoy sa sumpa at galit.
