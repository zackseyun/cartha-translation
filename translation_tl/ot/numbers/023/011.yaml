  text: Pagkatapos, sinabi ni Balak kay Balaam, “Ano ang ginawa mo sa akin? Kinuha kita upang sumpain ang mga kaaway ko, ngunit tingnan mo, talagang pinagpala mo sila!”[a]
  philosophy: optimal-equivalence
