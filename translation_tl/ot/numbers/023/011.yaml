    text: 'Hebreo: “pinagpala mo nang pinagpala” o “tiyak na pinagpala mo.” Gumagamit ang Hebreo ng pandiwang may kasunod na infinitive absolute upang magbigay-diin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: מֶה עָשִׂיתָ לִי
  choice: Ano itong ginawa mo sa akin?
  rationale: Direkta at natural na tanong sa Filipino; ipinahihiwatig ng “itong” ang pagkabigla sa katatapos na ginawa.
- source_word: לָקֹב
  choice: upang sumpain
  rationale: Ang pandiwang קבב sa konteksto ay tumutukoy sa pagbigkas ng sumpa laban sa isang tao.
- source_word: אֹיְבַי
  choice: ang mga kaaway ko
  rationale: Tuwirang katumbas ng pangngalang maramihan na may unang panauhang paari.
- source_word: לְקַחְתִּיךָ
  choice: Kinuha kita
  rationale: Pinananatili ang karaniwang kahulugan ng לקח nang hindi ipinapalagay na ang tiyak na diwa rito ay “inupahan” o “ipinatawag.”
- source_word: וְהִנֵּה
  choice: ngunit ngayo'y
  rationale: Ipinakikita ang biglaang salungat na kinalabasan at pagkagulat ni Balak sa natural na Filipino, nang hindi gumagamit ng lipas na “narito.”
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: labis mo pa silang pinagpala
  rationale: Ang pandiwang may kasunod na infinitive absolute ay nagbibigay-diin sa pagkilos. Inihahatid ng “labis” ang diin, at ng “pa” ang kabalintunaan sa inaasahang pagsumpa; ang “sila” ay tahasang bagay na hinihingi ng natural na Filipino at malinaw mula sa konteksto.
