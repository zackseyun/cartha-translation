id: NUM.23.4
reference: Numbers 23:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקָּ֥ר אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֶת שִׁבְעַ֤ת הַֽ/מִּזְבְּחֹת֙ עָרַ֔כְתִּי וָ/אַ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: tl
  text: Nakipagtagpo ang Diyos kay Balaam[a], at sinabi ni Balaam sa kanya, “Inayos ko ang pitong altar at naghandog ako ng isang toro at isang lalaking tupa sa altar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nasalubong ng Diyos si Balaam.” Ang pandiwang Hebreo ay maaaring tumukoy sa isang pagtatagpo at, sa ilang konteksto, maaaring may diwa ng di-inaasahang pagkakasalubong.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: Nakipagtagpo
  rationale: Ipinapahayag nito ang tunay na pagtatagpo ng Diyos at ni Balaam nang hindi ipinahihiwatig na nagkataon lamang iyon. Likas din ito sa makabagong Tagalog.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang pangngalang Hebreo, isahan ang pandiwa at malinaw na tumutukoy ito sa iisang Diyos.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Tagalog na Bibliya.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: at sinabi ni Balaam sa kanya
  rationale: Tinukoy si Balaam bilang nagsasalita upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog; pinatutunayan ng kasunod na pananalitang nasa unang panauhan na si Balaam ang nagsasalita sa Diyos.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: ang pitong altar
  rationale: Tiyak at dati nang kilala sa konteksto ang pitong altar.
- source_word: עָרַכְתִּי
  choice: Inayos ko
  rationale: Ang pandiwa ay nangangahulugang ayusin o ilagay sa wastong kaayusan. Mas tuwiran itong tumutugma sa Hebreo kaysa sa mas malawak na 'inihanda ko.'
- source_word: וָאַעַל
  choice: at naghandog ako
  rationale: Sa konteksto ng paghahain, ang pandiwa ay idyomatikong tumutukoy sa paghahandog ng hayop sa altar.
- source_word: פָּר
  choice: isang toro
  rationale: Karaniwang katawagan ito sa hayop na tinutukoy sa konteksto ng paghahain; hindi kinakailangang idagdag na bata pa ito.
- source_word: וָאַיִל
  choice: at isang lalaking tupa
  rationale: Malinaw na makabagong Tagalog para sa ram at pinananatili ang pagkakaiba nito sa pangkalahatang salitang 'tupa.'
- source_word: בַּמִּזְבֵּחַ
  choice: sa altar
  rationale: Pinanatili ang isahang anyo ng Hebreo at hindi idinagdag sa pangunahing teksto ang distributibong 'sa bawat altar.'
theological_decisions:
- issue: Ang katangian ng pagtatagpo sa וַיִּקָּר
  choice: Isinalin bilang isang tunay na pakikipagtagpo ng Diyos kay Balaam nang walang pahiwatig na ito ay nagkataon lamang.
  alternative: Maaaring isalin bilang 'nasalubong ng Diyos si Balaam' o sa paraang higit na nagpapahiwatig ng di-inaasahang pagkakatagpo.
  rationale: Maaaring taglayin ng ugat ang diwa ng pagkakasalubong o pangyayaring di-inaasahan sa ibang konteksto, ngunit dito ay sinadyang makipag-ugnayan ng Diyos kay Balaam. Hindi dapat magpasok ang salin ng ideya na kumilos ang Diyos dahil lamang sa pagkakataon.
- issue: Ang bilang ng altar sa huling parirala
  choice: Pinanatili ang isahang 'sa altar.'
  alternative: Isaling 'sa bawat altar' ayon sa posibleng distributibong kahulugan sa konteksto.
  rationale: Bagaman ipinahihiwatig ng pitong altar sa konteksto na tig-isang toro at lalaking tupa ang inihandog sa mga iyon, isahan ang tahasang anyo ng Hebreo. Pinananatili ng salin ang anyong iyon sa halip na gawing lantad ang ipinahihiwatig lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang 'altar' sapagkat ito ang karaniwan at tiyak na katawagan sa konteksto ng paghahain; iniwasan ang mas malawak na 'dambana.' Inulit ang pangalang Balaam upang luminaw ang nagsasalita at maiwasan ang nakalilitong serye ng 'siya' at 'niya.'
