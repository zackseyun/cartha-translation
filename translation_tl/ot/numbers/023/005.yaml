  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: tl
  text: Pagkatapos, naglagay si Yahweh ng isang salita sa bibig ni Balaam at sinabi, “Bumalik ka kay Balak, at ganito ang sasabihin mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: naglagay
  rationale: Karaniwang kahulugan ng שׂוּם ang ‘maglagay.’ Pinananatili nito ang kongkretong larawang nasa idyomang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: דָּבָר
  choice: isang salita
  rationale: Pinananatili ang isahang bilang at ang literal na idyoma, bagaman maaari rin itong mangahulugang ‘mensahe.’
- source_word: בְּפִי בִלְעָם
  choice: sa bibig ni Balaam
  rationale: Natural sa Tagalog at tapat sa Hebreong larawang ang ibinigay na pananalita ay inilagay sa bibig ni Balaam.
- source_word: שׁוּב אֶל בָּלָק
  choice: Bumalik ka kay Balak
  rationale: Tuwiran at natural na salin ng pautos na שׁוּב at ng panandang patungong אֶל.
- source_word: וְכֹה תְדַבֵּר
  choice: at ganito ang sasabihin mo
  rationale: Ang כֹה ay tumutukoy sa paraan o nilalaman ng susunod na pananalita. Mas natural sa makabagong Tagalog ang ‘ganito ang sasabihin mo’ kaysa sa mas matigas na literal na anyo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasan sa tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Lakas ng utos sa תְדַבֵּר
  choice: sasabihin mo
  alternative: magsalita ka
  rationale: Sa konteksto, ang anyong imperpektibo kasunod ng pautos ay nagpapahayag ng iniutos na susunod na gagawin. Ang ‘sasabihin mo’ ay natural na Tagalog at hindi nangangailangang gawing tahasang pangalawang pautos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang Hebreong idyoma na ‘naglagay ... ng isang salita sa bibig,’ habang ginawang natural ang utos sa hulihan.
