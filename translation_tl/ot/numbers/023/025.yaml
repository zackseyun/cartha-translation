base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/025.yaml
  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: tl
  text: Sinabi ni Balak kay Balaam, “Huwag mo man lang siyang sumpain ni pagpalain man lang!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sumpain—huwag mo siyang sumpain ... pagpalain—huwag mo siyang pagpalain.” Sa bawat sugnay, isang anyong pawatas ang sinusundan ng pandiwang may panauhan, na nagbibigay ng matinding diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na salin sa makabagong Filipino ng karaniwang anyong pasalaysay na nagpapakilala sa sumunod na sinabi.
- source_word: בָּלָק ... אֶל בִּלְעָם
  choice: ni Balak kay Balaam
  rationale: Pinananatili ang mga pangalang pantangi at malinaw na ipinapakita ang nagsasalita at ang kinakausap.
- source_word: גַּם ... גַּם
  choice: at ... rin
  rationale: Sa magkatimbang na mga pagbabawal, natural na ipinahahayag sa Filipino ng “at ... rin” ang pagkakaugnay ng dalawang utos.
- source_word: קֹב / לֹא תִקֳּבֶנּוּ
  choice: Huwag mo siyang sumpain
  rationale: Ang “sumpain” ang malinaw at karaniwang katumbas ng קבב sa salaysay tungkol kay Balaam; ang anyong pautos na may “huwag” ay angkop sa konteksto.
- source_word: בָּרֵךְ / לֹא תְבָרֲכֶנּוּ
  choice: huwag mo rin siyang pagpalain
  rationale: Ang “pagpalain” ang karaniwang katumbas ng ברך, at pinananatili ng magkatulad na anyo ang paralelismo ng Hebreo.
