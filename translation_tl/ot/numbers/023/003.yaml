  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: tl
  text: Sinabi ni Balaam kay Balak, “Tumayo ka sa tabi ng iyong handog na sinusunog, at pupunta ako. Baka sakaling makipagtagpo sa akin si Yahweh. Anuman ang ipakita niya sa akin ay sasabihin ko sa iyo.” Pagkatapos, pumunta siya sa isang kalbong burol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tigang na mataas na lugar.” Ang salitang Hebreo ay malamang na tumutukoy sa isang lantad at walang punong mataas na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: Tumayo ka sa tabi ng iyong handog na sinusunog
  rationale: Ang pautos na Hitpael ng יצב ay tumutukoy sa pagpuwesto, at sa idyomang ito ang עַל ay lokatibong ‘sa tabi’ o ‘malapit sa,’ hindi literal na ‘sa ibabaw.’ Ang עֹלָה ay handog na sinusunog.
- source_word: וְאֵלְכָה
  choice: at pupunta ako
  rationale: Ang cohortative na unang panauhan ay nagpapahayag ng balak ni Balaam. Pinananatili ng ‘pupunta ako’ ang payak na kilos nang hindi nagdaragdag ng tiyak na patutunguhan.
- source_word: אוּלַי
  choice: Baka sakaling
  rationale: Malinaw at likas sa modernong Tagalog ang pariralang ito para sa posibilidad at kawalang-katiyakan.
- source_word: יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: makipagtagpo sa akin si Yahweh
  rationale: Ang Niphal ng קרה kasama ng לִקְרָאתִי ay naglalarawan ng isang pagtatagpo. Iniiwasan ng salin ang sobrang literal at alanganing ideya ng ‘nagkataong makatagpo,’ samantalang nananatili ang kawalang-katiyakan sa ‘Baka sakaling.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh’ sa halip na palitan ito ng isang titulo.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: Anuman ang ipakita niya sa akin
  rationale: Ang siksik na Hebreong pananalita ay tumutukoy sa nilalaman ng ihahayag o ipakikita; natural na naihahatid ito ng ‘anuman ang ipakita niya sa akin.’
- source_word: וְהִגַּדְתִּי לָךְ
  choice: ay sasabihin ko sa iyo
  rationale: 'Tuwirang ipinapahayag nito ang kahulugan ng Hiphil ng נגד: sabihin, ipahayag, o iulat.'
- source_word: שֶׁפִי
  choice: isang kalbong burol
  rationale: Malamang na tumutukoy ang pambihirang salitang ito sa isang hubad, walang punong mataas na lugar. Ang ‘kalbong burol’ ay natural sa Tagalog at malinaw ang topograpikong larawan.
theological_decisions:
- issue: Paglalarawan sa inaasahang pakikipagtagpo ni Yahweh kay Balaam
  choice: Baka sakaling makipagtagpo sa akin si Yahweh
  alternative: Baka sakaling magpakita sa akin si Yahweh
  rationale: Hindi tahasang sinasabi ng קרה na magpapakita si Yahweh; mas maingat na panatilihin ang kahulugan nitong ‘makatagpo/makipagtagpo’ at ang kawalang-katiyakan ni Balaam.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong ‘Yahweh’ sa halip na palitan ng titulong ‘PANGINOON.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang ‘handog na sinusunog’ para sa עֹלָה at ang natural na ‘kalbong burol’ para sa bihirang salitang שֶׁפִי. Inilagay ang talababa sa pariralang aktuwal nitong ipinaliliwanag.
