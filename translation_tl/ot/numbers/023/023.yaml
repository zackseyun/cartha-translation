  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: tl
  text: Sapagkat walang panghuhula sa Jacob[a], at walang pangkukulam sa Israel. Sa panahong ito ay sasabihin sa Jacob at sa Israel, “Ano ang ginawa ng Diyos!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “walang panghuhulang mabisa laban sa Jacob, at walang pangkukulam laban sa Israel.” Maaaring unawain sa higit sa isang paraan ang pang-ukol sa Hebreo, bagaman pinapaboran ng konteksto ang “laban sa.”'
    reason: alternative_reading
  - marker: b
    text: 'Tradisyonal na salin sa Ingles: “What God has wrought!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַשׁ
  choice: panghuhula
  rationale: Tumutukoy rito sa gawaing naghahanap ng lihim na kaalaman o palatandaan sa pamamagitan ng okultong pamamaraan; ito ang malinaw at likas na katumbas sa makabagong Filipino.
- source_word: קֶסֶם
  choice: pangkukulam
  rationale: Ipinakikita ang kaugnay ngunit hindi ganap na kaparehong uri ng okultong gawain, kaya pinananatili ang pagkakaiba nito sa נַחַשׁ.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: sa Jacob / sa Israel
  rationale: Pinananatili ang karaniwang diwa ng pang-ukol na ב at ang tunay na kalabuan nito; maaaring tumukoy sa kawalan ng mga gawaing ito sa Israel o, ayon sa konteksto, sa kawalan ng bisa ng mga ito laban sa Israel.
- source_word: כָּעֵת
  choice: sa takdang panahon
  rationale: Natural na ipinahahayag ang angkop o itinakdang sandali, habang hindi nililimitahan ang parirala sa simpleng “ngayon.”
- source_word: יֵאָמֵר
  choice: ay sasabihin
  rationale: Pinananatili ang impersonal na balintiyak at ang aspektong nakaharap sa hinaharap ng Niphal imperfect.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: sa Jacob at sa Israel
  rationale: Malapit sa datibong anyo ng ל at hindi nagpapasiya kung sila ang tuwirang kausap o ang tinutukoy ng pahayag.
- source_word: מַה פָּעַל אֵל
  choice: Tingnan ninyo ang ginawa ng Diyos!
  rationale: Ginagawang malinaw sa natural na Filipino ang eksklamatibong lakas ng מַה nang hindi ito binabasa bilang tanong; ang pandiwang ganap ay kinakatawan ng “ginawa.”
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang titulong pan-Diyos ang gamit dito; hindi kailangan ang dagdag na “Makapangyarihan.”
theological_decisions:
- issue: Kung itinatanggi ng talata ang okultong gawain sa loob ng Israel o ang bisa nito laban sa Israel
  choice: Pinanatili sa pangunahing teksto ang literal at malabong “sa Jacob/Israel.”
  alternative: “Laban sa Jacob/Israel,” na nagbibigay-diin sa kawalan ng bisa ng panghuhula at pangkukulam laban sa bayan.
  rationale: Pinahihintulutan ng pang-ukol na ב ang higit sa isang pag-unawa. Bagaman pinapaboran ng konteksto ng orakulo ni Balaam ang kawalan ng bisa laban sa Israel, hindi dapat burahin sa salin ang leksikal na kalabuan.
- issue: Kung ang מַה פָּעַל אֵל ay tanong o bulalas
  choice: 'Bulalas: “Tingnan ninyo ang ginawa ng Diyos!”'
  alternative: 'Tanong: “Ano ang ginawa ng Diyos?”'
  rationale: Mas angkop sa rurok ng orakulo ang paghanga at pagpapahayag sa gawa ng Diyos kaysa isang tunay na paghahanap ng impormasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “panghuhula” at “pangkukulam” bilang karaniwang nauunawaang mga salita para sa magkaugnay na gawaing okulto. Pinanatili ang mga pangalang Jacob at Israel ayon sa anyong karaniwan sa Bibliyang Filipino. Inilagay ang lahat ng panandang talababa sa pangunahing teksto.
