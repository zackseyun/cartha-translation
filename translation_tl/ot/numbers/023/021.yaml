  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: tl
  text: 'Hindi siya nakakita ng kapahamakan sa Jacob,

    at hindi siya nakakita ng pagdurusa sa Israel.[a]


    Si Yahweh, ang kanyang Diyos, ay kasama niya,[b]

    at ang sigaw ng isang hari ay nasa gitna nila.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi siya nakakita ng kasamaan sa Jacob, ni nakakita ng kaguluhan o kabuktutan sa Israel.” Ang mga salitang Hebreo ay maaaring tumukoy sa moral na kasamaan o sa kapahamakan at pagdurusa.'
    reason: alternative_reading
  - marker: b
    text: Ang “kanya” at “niya” ay isahan sa Hebreo; ang Israel ay inilalarawan bilang isang kolektibong persona.
    reason: lexical_alternative
  - marker: c
    text: Literal sa Hebreo, “ang sigaw ng isang hari ay nasa kanya.” Maaaring tumukoy ito sa pagbubunyi sa isang hari sa gitna ng Israel, at maaaring nagpapahiwatig ng maharlikang presensiya ni Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: nakakita
  rationale: Bagaman maaaring tumukoy ang pandiwa sa masusing pagtingin o pagpansin, natural na ipinapahayag ng “nakakita” ang larawang biswal at pinananatili ang pagkakatulad nito sa kasunod na רָאָה.
- source_word: אָוֶן
  choice: kapahamakan
  rationale: Maaaring mangahulugan ang salita ng kasamaan, kaguluhan, o kapahamakang dinaranas. Sa konteksto ng pagpapala ni Balaam, ang “kapahamakan” ay angkop nang hindi ipinipilit na ipinahahayag ng talata na walang kasalanan ang Israel.
- source_word: רָאָה
  choice: nakakita
  rationale: Tuwirang salin na likas sa Filipino at umaayon sa aspektong ganap ng pandiwang Hebreo.
- source_word: עָמָל
  choice: pagdurusa
  rationale: Saklaw ng salita ang hirap, pagdurusa, at paghihirap. Naiiba ito sa “kapahamakan” habang pinananatili ang magkatulad na diwa ng dalawang hanay.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: sa Jacob / sa Israel
  rationale: Pinananatili ng “sa” ang lokatibong diwa at ang paralelismo ng tulang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו ... עִמּוֹ
  choice: kanyang Diyos ... kasama niya
  rationale: Ang mga hulapi ay panlalaking isahan; tinutukoy ang Jacob/Israel bilang isang kolektibong persona.
- source_word: תְרוּעַת מֶלֶךְ
  choice: ang sigaw para sa isang hari
  rationale: Ang תְרוּעָה ay maaaring sigaw ng galak, pakikidigma, o pagbubunyi. Ipinapahiwatig ng “sigaw para sa isang hari” ang maharlikang pagbubunyi nang hindi tahasang kinikilala kung sino ang hari.
- source_word: בּוֹ
  choice: nasa gitna nila
  rationale: Literal na isahan ang hulapi, “nasa kanya,” ngunit tumutukoy ito sa Israel bilang kolektibong bayan; mas natural sa Filipino ang maramihang anyo sa huling parirala, habang ipinaliliwanag sa talababa ang anyong Hebreo.
theological_decisions:
- issue: Kung sinasabi ng talata na walang kasalanan ang Israel o na walang kapahamakan at pagdurusang nakikita sa kanya
  choice: Kapahamakan at pagdurusa ang nasa pangunahing teksto.
  alternative: Kasamaan at kaguluhan/baluktot na gawa
  rationale: Parehong pinahihintulutan ng saklaw ng אָוֶן at עָמָל ang moral at ang pahirap na diwa. Ang konteksto ng pagpapala ay pumapabor sa huli, ngunit pinananatili sa talababa ang tunay na posibilidad ng moral na pagbasa.
- issue: Kung ang “hari” ay tahasang si Yahweh
  choice: Hindi tahasang kinikilala ang hari sa pangunahing teksto.
  alternative: Ang sigaw ng pagbubunyi para sa banal na Hari
  rationale: Maaaring magpahiwatig ang parirala ng maharlikang presensiya ni Yahweh, ngunit hindi ito tahasang sinasabi ng Hebreo; kaya pinananatili ang kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pangalang Yahweh, ang patulang paralelismo, ang kolektibong isahan para sa Israel, at ang leksikal at teolohikal na kalabuan sa pamamagitan ng mga talababa.
