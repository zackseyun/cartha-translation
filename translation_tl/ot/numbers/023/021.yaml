  to: 'Hindi siya nakakita ng kapahamakan sa Jacob,

    at hindi siya nakakita ng pagdurusa sa Israel.[a]


    Si Yahweh, ang kanyang Diyos, ay kasama niya,[b]

    at ang sigaw ng isang hari ay nasa gitna nila.[c]'
  rationale: Pinalitan ang “sigaw para sa isang hari” ng “sigaw ng isang hari” upang huwag ipataw sa pangunahing teksto ang isang posibleng, ngunit hindi tiyak, na pagbasa. Inayos din ang apposition kay Yahweh para sa mas likas na Filipino. Napanatili ang mga talababa at ang leksikal na kalabuan ng unang dalawang hanay.
