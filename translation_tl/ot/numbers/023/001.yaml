id: NUM.23.1
reference: Numbers 23:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Balaam kay Balak, “Ipagtayo mo ako rito ng pitong altar, at ipaghanda mo ako rito ng pitong toro at pitong lalaking tupa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos, sinabi” at malinaw ang pagkakasunod-sunod.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa Tagalog na tradisyong biblikal.
- source_word: אֶל בָּלָק
  choice: kay Balak
  rationale: Ang “kay” ang natural na panandang Tagalog para sa taong pinatutungkulan ng sinabi.
- source_word: בְּנֵה לִי
  choice: Ipagtayo mo ako
  rationale: Tuwirang pautos ang בְּנֵה, at ang לִי ay may diwang para sa kapakinabangan o layunin ni Balaam; natural itong ipinapahayag ng pandiwang Tagalog na may hulaping ipag-.
- source_word: בָּזֶה
  choice: rito
  rationale: Ang literal na “sa [lugar na] ito” ay tumutukoy sa kinaroroonan ng nagsasalita; “rito” ang natural na deiktikong katumbas at inulit gaya sa Hebreo.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: pitong altar
  rationale: Tuwirang salin ng bilang at pangngalan; karaniwan at malinaw sa modernong Filipino ang “altar.”
- source_word: וְהָכֵן לִי
  choice: at ipaghanda mo ako
  rationale: Ang causative imperative ng כון ay nangangahulugang ihanda o gawing handa; pinananatili ng “ipaghanda mo ako” ang kapakinabangang ipinahihiwatig ng לִי.
- source_word: שִׁבְעָה פָרִים
  choice: pitong toro
  rationale: Sa kontekstong paghahandog, ang פַּר ay lalaking baka o toro; hindi tahasang tinutukoy rito ng Hebreo ang edad.
- source_word: וְשִׁבְעָה אֵילִים
  choice: at pitong lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa; mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa hiram o hindi gaanong pangkaraniwang “barakong tupa.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Pinanatili ang dalawang ulit na “rito” upang maingatan ang pag-uulit at diin sa lokasyon sa tekstong Hebreo. Ginamit ang “altar,” isang malawak na nauunawaang salitang Filipino sa kontekstong panrelihiyon.
