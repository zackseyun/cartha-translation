  text: וּ/פִגְרֵי/כֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּ/מִּדְבָּ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: tl
  text: Ngunit kayo—ang inyong mga bangkay[a] ay babagsak sa ilang na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga patay na katawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פִגְרֵי/כֶם
  choice: ang inyong mga bangkay
  rationale: Ang פֶּגֶר ay tumutukoy sa bangkay o patay na katawan. Likas at tuwiran sa modernong Filipino ang “mga bangkay,” at pinananatili nito ang mabigat at tahasang larawan ng hatol.
- source_word: אַתֶּם
  choice: kayo—
  rationale: Nakahiwalay at mariin ang panghalip sa Hebreo. Ang paglalagay ng “kayo” sa unahan, kasunod ng gitling, ay naghahayag ng kaibahan at diin nang hindi nagdaragdag ng kahulugan.
- source_word: יִפְּלוּ
  choice: ay babagsak
  rationale: Tuwirang katumbas ito ng נפל. Dahil ang simuno ay “mga bangkay,” malinaw sa konteksto na kamatayan ang tinutukoy, kaya hindi na kailangang ipaliwanag pa sa mismong teksto.
- source_word: בַּ/מִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay lupain sa labas ng mga pamayanan, karaniwang tigang at ilang. Ang “ilang” ay maikli, natural, at nakaugat sa gamit-Bibliya sa Filipino.
- source_word: הַ/זֶּה
  choice: na ito
  rationale: Tinutukoy ng demonstratibo ang mismong ilang na kinaroroonan nila. Sapat ang “na ito” at hindi ito nagdaragdag ng di-kailangang diin.
theological_decisions:
- issue: Tindi at kongkretong larawan ng hatol sa פִגְרֵיכֶם
  choice: ang inyong mga bangkay
  alternative: ang inyong mga patay na katawan
  rationale: Pinananatili ng “mga bangkay” ang pisikal at nakapangingilabot na bigat ng ipinahayag na hatol. Ang “mga patay na katawan” ay tama rin ngunit mas paliwanag at hindi kasing-ikli ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang gitling matapos ang mariing “kayo” upang katawanin ang contrastive emphasis ng hiwalay na panghalip sa Hebreo. Ang “bangkay” ay mas natural kaysa “korpse” at mas tiyak kaysa simpleng “katawan.”
