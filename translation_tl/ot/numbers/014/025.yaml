  text: וְ/הָֽ/עֲמָלֵקִ֥י וְ/הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב בָּ/עֵ֑מֶק מָחָ֗ר פְּנ֨וּ וּ/סְע֥וּ לָ/כֶ֛ם הַ/מִּדְבָּ֖ר דֶּ֥רֶךְ יַם סֽוּף־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: tl
  text: Ang mga Amalekita at mga Canaanita ay naninirahan sa lambak. Bukas, bumaling kayo at maglakbay patungo sa ilang sa daang papunta sa Dagat na Pula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Dagat ng mga Tambo.” Tradisyonal na isinasaling “Dagat na Pula.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: Ang mga Amalekita at mga Canaanita
  rationale: Ang dalawang pangngalang pantangi na nasa anyong isahan at may pantukoy ay ginagamit nang kolektibo para sa mga pangkat ng mga tao. Likas sa modernong Tagalog ang maramihang anyo. Hindi ginawang hiwalay na salita ang unang וְ dahil sapat na ang daloy ng pangungusap at hindi ito tahasang nangangahulugang “ngayon.”
- source_word: יוֹשֵׁב
  choice: ay naninirahan
  rationale: Ang participle ay nagpapahayag ng nagpapatuloy na paninirahan; malinaw at natural itong naihahatid ng “naninirahan.”
- source_word: בָּעֵמֶק
  choice: sa lambak
  rationale: Karaniwang tumutukoy ang עֵמֶק sa lambak o mababang lupain; “lambak” ang tuwiran at likas na katumbas dito.
- source_word: מָחָר
  choice: Bukas
  rationale: Tuwirang tumutukoy ito sa kasunod na araw.
- source_word: פְּנוּ
  choice: bumaling kayo
  rationale: Nag-uutos ang pandiwa ng pagbabago ng direksiyon. Hindi idinagdag ang “pabalik” sapagkat ipinahihiwatig lamang iyon ng konteksto at wala sa mismong pandiwa.
- source_word: וּסְעוּ לָכֶם
  choice: at maglakbay
  rationale: Sa konteksto ng paglalakbay, ang נסע ay tumutukoy sa pag-alis o pagpapatuloy ng paglalakbay. Hindi literal na isinalin nang hiwalay ang לָכֶם bilang “para sa inyong sarili” dahil magiging pilit iyon sa Tagalog; naipahahayag na ng “kayo” sa magkatambal na utos ang tuwirang pagtukoy sa buong pangkat.
- source_word: הַמִּדְבָּר
  choice: ang ilang
  rationale: Ang מִדְבָּר ay malawak at di-pinamamahalaang lupaing ilang, hindi kinakailangang mabuhanging disyerto. Ang “ilang” ang angkop na terminong biblikal at natural sa Tagalog.
- source_word: דֶּרֶךְ יַם סוּף
  choice: sa daang papunta sa Dagat na Pula
  rationale: Ipinahahayag ng דֶּרֶךְ ang ruta o direksiyon. Pinanatili sa pangunahing teksto ang nakaugaliang heograpikong pangalang “Dagat na Pula,” habang inilalahad sa talababa ang mas literal na kahulugan ng יַם סוּף.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang “bumaling” at “ilang” ay bahagyang mataas ang register ngunit pangkaraniwan at madaling maunawaan sa saling biblikal. Inilagay ang panandang [a] pagkatapos ng “Dagat na Pula,” ang mismong pariralang ipinapaliwanag ng talababa.
