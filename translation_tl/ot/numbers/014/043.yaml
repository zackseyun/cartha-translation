  to: Sapagkat naroon sa harapan ninyo ang mga Amalekita at mga Cananeo, at mabubuwal kayo sa tabak, dahil tumalikod kayo sa pagsunod kay Yahweh, at hindi makakasama ninyo si Yahweh.
  rationale: Pinalitan ang hindi likas at malabong “hindi sasainyo si Yahweh” ng “hindi makakasama ninyo si Yahweh,” na malinaw na naghahatid ng hinaharap na kawalan ng presensiya ni Yahweh. Pinanatili ang natitirang pananalita, pati ang sanhi at magkakaugnay na daloy ng Hebreong pangungusap.
