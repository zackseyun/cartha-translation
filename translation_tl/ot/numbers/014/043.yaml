reference: Numbers 14:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: tl
  text: Sapagkat naroon sa harapan ninyo ang mga Amalekita at mga Cananeo, at mabubuwal kayo sa tabak, dahil tumalikod kayo sa pagsunod kay Yahweh, at hindi makakasama ninyo si Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng babala sa naunang talata; natural sa Filipino ang “Sapagkat” bilang panimulang paliwanag.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: ang mga Amalekita at mga Cananeo
  rationale: Bagaman nasa anyong isahang kolektibo sa Hebreo, tumutukoy ang mga katawagan sa dalawang pangkat ng mga tao; kaya likas ang maramihang anyo sa Filipino.
- source_word: שָׁם לִפְנֵיכֶם
  choice: naroon sa harapan ninyo
  rationale: Pinananatili ang parehong lokatibong “naroon” at ang panandang pansaklaw na “sa harapan ninyo,” na tumutukoy sa kaaway na nasa daraanan nila.
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: at mabubuwal kayo sa tabak
  rationale: Ang נפל ay “mabuwal,” at sa konteksto ng labanan ang “sa tabak” ay nagpapahiwatig ng pagkamatay o pagkatalo sa sandatahang labanan nang hindi dinaragdagan ang teksto.
- source_word: כִּי עַל כֵּן
  choice: Dahil
  rationale: Ang parirala ay nagbibigay ng sanhi ng nalalapit na pagkabuwal; malinaw at natural itong naipahahayag ng “Dahil.”
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: tumalikod kayo sa pagsunod kay Yahweh
  rationale: Pinananatili ng “sa pagsunod” ang larawan ng pagtalikod mula sa pagiging nasa likuran o pagsunod kay Yahweh, sa halip na gawing pangkalahatang paglayo lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: hindi sasainyo si Yahweh
  rationale: Ang “sasainyo” ay dignidad at likas na biblikal na Filipino para sa “magiging kasama ninyo,” at pinananatili ang diwa ng presensiya ni Yahweh nang walang dagdag na paliwanag.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng presensiya ni Yahweh sa “עִמָּכֶם”
  choice: hindi sasainyo si Yahweh
  alternative: hindi kayo tutulungan ni Yahweh
  rationale: Pinananatili ang mas malawak at teolohikong may-tensiyong pahayag tungkol sa presensiya ni Yahweh; hindi ito pinakikitid sa tulong militar lamang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mabubuwal” at “sasainyo” dahil malinaw pa rin ang mga ito sa karaniwang mambabasa at angkop sa seryosong konteksto ng babala. Walang talababa dahil walang tekstuwal o leksikal na kalabuan na nangangailangan ng paliwanag sa publikasyong teksto.
