base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: tl
  text: Ang mga lalaking isinugo ni Moises upang siyasatin ang lupain[a] ay bumalik at naging dahilan upang magreklamo laban sa kanya ang buong kapulungan, sa pamamagitan ng pagpapakalat ng masamang ulat tungkol sa lupain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “manmanan ang lupain.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng paglalabas ng masamang ulat laban sa lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Ang mga lalaking
  rationale: Likas na panimula sa Filipino para sa tinutukoy na pangkat; hindi kailangang isalin nang hiwalay ang waw bilang “at” sa pagpapatuloy na ito ng salaysay.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: isinugo ni Moises
  rationale: Malinaw at tuwirang kamag-anak na sugnay; ang “isinugo” ay angkop sa marangal na rehistro.
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: upang siyasatin ang lupain
  rationale: Ipinahahayag ang layunin at ang diwa ng paggalugad o pagmamanman nang hindi ipinapalagay na lihim na paniniktik.
- source_word: וַיָּשֻבוּ
  choice: ay bumalik
  rationale: Karaniwang salaysay na katumbas ng pandiwang שוב.
- source_word: וילונו עָלָיו
  choice: naging dahilan upang magreklamo laban sa kanya
  rationale: Pinananatili ang malamang na causative na diwa ng anyo at ang tuwirang layon na buong kapulungan; ang reklamo ay laban kay Moises.
- source_word: אֶת כָּל־הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa kabuuang nagkakatipong pamayanan ng Israel; “kapulungan” ay dignified at pamilyar sa kontekstong Pentateuchal.
- source_word: לְהוֹצִיא דִבָּה
  choice: sa pamamagitan ng pagpapakalat ng masamang ulat
  rationale: Ipinakikita ang paraan kung paano nila naudyukan ang kapulungan. Ang דִבָּה ay ulat na mapanira o nakapanghihina; natural sa Filipino ang “pagpapakalat ng masamang ulat.”
- source_word: עַל־הָאָרֶץ
  choice: tungkol sa lupain
  rationale: Dito ang עַל ay nagpapakilala sa paksa ng ulat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kapulungan” para sa kolektibong pamayanan ng Israel at pinanatili ang causative na ugnayan sa pagitan ng ulat ng mga lalaki at ng pagrereklamo ng buong kapulungan.
