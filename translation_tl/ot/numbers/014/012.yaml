base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: tl
  text: “Hahampasin ko ang bayang ito ng salot at aalisan ko ito ng mana[a], at gagawin kitang isang bansang mas dakila at mas makapangyarihan kaysa rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “aalisan ko ito ng pag-aari.” Maaaring tumukoy ang pandiwang Hebreo sa pag-aalis ng mana o sa pag-aalis ng karapatang magmay-ari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: Hahampasin ko ang bayang ito
  rationale: Ang Hiphil ng נכה ay karaniwang nangangahulugang ‘hampasin.’ Ginawang tahasan ang kolektibong tinutukoy ng panlalaking isahang hulapi—ang Israel bilang iisang bayan—upang maging malinaw at natural sa Tagalog.
- source_word: בַדֶּבֶר
  choice: ng salot
  rationale: Ang דֶּבֶר ay tumutukoy sa salot o nakamamatay na epidemya, lalo na bilang hatol. Ang ‘salot’ ay maikli, malinaw, at likas sa makabagong Tagalog.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: at aalisan ko ito ng mana
  rationale: Ang Hiphil ng ירשׁ ay maaaring mangahulugang alisan ng pag-aari o mana. Sa konteksto ng pagtanggi at pagpapalit sa Israel bilang bayan, malinaw na naipahahayag ng ‘aalisan ng mana’ ang mahalagang pahiwatig ng pagkawala ng minanang katayuan, habang inilalagay sa talababa ang mas malawak na alternatibo.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: Gagawin naman kitang isang bansa
  rationale: Tuwirang ipinahahayag nito ang paggawa kay Moises na pinagmumulan ng isang bagong pambansang bayan. Natural sa Tagalog ang hulaping ‘-kitang’ para sa estrukturang ito.
- source_word: גָּדוֹל וְעָצוּם
  choice: mas dakila at mas makapangyarihan
  rationale: Saklaw ng kasunod na paghahambing ang dalawang pang-uri. Ang ‘dakila’ ay nagpapahayag ng kadakilaan, at ang ‘makapangyarihan’ ay nagpapanatili sa di-tiyak na puwersa ng עָצוּם, na maaaring tumukoy sa lakas o laki.
- source_word: מִמֶּנּוּ
  choice: kaysa rito
  rationale: Ang isahang hulapi ay tumutukoy sa Israel bilang isang kolektibong bayan. Ang ‘rito’ ay tumutukoy pabalik sa ‘bayang ito’ at pinananatili ang isahang kolektibong anyo nang natural sa Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng mga isahang hulapi sa hatol
  choice: Tinukoy ang Israel bilang ‘ang bayang ito’ at pagkatapos ay ginamit ang isahang ‘ito/rito.’
  alternative: Gamitin ang maramihang ‘sila/kanila’ dahil maraming tao ang bumubuo sa Israel.
  rationale: Panlalaking isahan ang mga hulapi sa Hebreo at inilalarawan ang Israel bilang iisang kolektibong bayan. Pinananatili ng salin ang retorikang ito nang hindi lumilikha ng kalituhan sa Tagalog.
- issue: Diwa ng ירשׁ sa kontekstong ito
  choice: aalisan ng mana
  alternative: aalisan ng pag-aari o pagtatabuyin mula sa pag-aari
  rationale: May tunay na saklaw ang pandiwa mula sa pagkawala ng pag-aari hanggang sa pagkawala ng mana. Dahil hindi pa ganap na inaangkin ng Israel ang lupain at ang banta ay ang pagpapalit sa kanila bilang bayan, ang ‘aalisan ng mana’ ay angkop sa pangunahing teksto; pinananatili sa talababa ang mas malawak na alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘ang bayang ito’ upang malinaw na katawanin ang kolektibong isahan ng Hebreo; iniwasan ang arkaikong pananalita at ang masyadong tiyak na denominasyonal na pagpapakahulugan.
