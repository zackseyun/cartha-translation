base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: tl
  text: Nagreklamo[b] laban kina Moises at Aaron ang lahat ng mga anak ni Israel[a], at sinabi ng buong kapulungan sa kanila, “Sana’y namatay na lang kami sa lupain ng Ehipto! O sana’y namatay na lang kami sa ilang na ito!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng Israelita.” Literal na “lahat ng mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “nagbulung-bulungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: Nagreklamo
  rationale: Sa konteksto ng paglalakbay sa ilang, ang pandiwa ay tumutukoy sa sama-samang pagpapahayag ng matinding hinanakit laban sa mga pinuno. Likas at malinaw sa makabagong Tagalog ang “nagreklamo,” habang ang alternatibong “nagbulung-bulungan” ay inilagay sa talababa.
- source_word: עַל
  choice: laban kina
  rationale: Minamarkahan ng עַל ang mga taong pinatutungkulan ng pagrereklamo at may salungat na puwersa. Pinananatili ng “laban kina” ang pagiging mapanghamon ng kilos.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: ang lahat ng anak ni Israel
  rationale: Malapit ito sa pormang Hebreo at nauunawaan bilang pambansang katawagan sa buong bayang nagmula kay Israel. Hindi kailangang idagdag ang “lalaki,” sapagkat ang “anak” sa Tagalog ay hindi likas na nagtatakda ng kasarian; ibinigay sa talababa ang mas idyomatikong “lahat ng Israelita.”
- source_word: כָּל הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה sa Mga Bilang ay tumutukoy sa bayang Israel bilang sama-samang nagkatipon. Ang “buong kapulungan” ay marangal at malinaw na nagpapahayag ng kolektibong diwa.
- source_word: לוּ
  choice: Sana’y ... na lang
  rationale: Ipinapahayag ng לוּ ang isang matinding hangaring salungat sa nangyari. Ang “Sana’y ... na lang” ay natural na modernong Tagalog at angkop sa mapait na paghihinagpis ng bayan.
- source_word: מַתְנוּ / מָתְנוּ
  choice: namatay ... kami
  rationale: Kasunod ng לוּ, ang anyong ito ay nagpapahayag ng di-natupad na hangarin tungkol sa nakaraan. Sa Tagalog, naipahihiwatig ng “Sana’y namatay na lang kami” ang kontrapaktuwal na kahulugan nang hindi nangangailangan ng tahasang katumbas ng English pluperfect.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ng “sa lupain ng Ehipto” ang buong heograpikong parirala ng Hebreo.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: sa ilang na ito
  rationale: Ang “ilang” ang maikli at tradisyonal ngunit nauunawaang katumbas ng מִדְבָּר sa tagpuan ng paglalakbay ng Israel, at hindi nito ipinapalagay na purong buhangin ang lugar.
theological_decisions:
- issue: Ang pambansang katawagang may anyong panlalaki sa בְּנֵי יִשְׂרָאֵל
  choice: lahat ng anak ni Israel
  alternative: lahat ng Israelita; lahat ng mga anak na lalaki ni Israel
  rationale: Pinananatili ng “anak ni Israel” ang genealogical at covenantal na anyo ng Hebreo. Hindi ginamit ang “mga anak na lalaki” sapagkat sa pambansang idyomang ito ay tinutukoy ang sambayanan sa kabuuan, at ang sapilitang paglalagay ng “lalaki” sa Tagalog ay maaaring magbigay ng maling pahiwatig na hindi kabilang ang mga babae. Nasa talababa ang idyomatikong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapulungan” at “ilang” upang mapanatili ang kontekstong Pentateuchal nang hindi nagiging lipas o labis na teknikal. Inilipat ang mga pananda ng talababa sa mismong mga salitang tinutukoy ng bawat paliwanag.
