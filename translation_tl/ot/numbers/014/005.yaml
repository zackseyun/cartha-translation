lexical_decisions:
- source_word: וַיִּפֹּל
  choice: nagpatirapa
  rationale: Ang anyong pasalaysay ng נפל ay literal na tumutukoy sa pagbagsak, ngunit kasama ng pariralang עַל־פְּנֵיהֶם ay likas na ipinahahayag sa modernong Tagalog bilang “nagpatirapa.”
- source_word: עַל־פְּנֵיהֶם
  choice: nagpatirapa
  rationale: Ang literal na “sa kanilang mga mukha” ay isang Hebreong idyoma para sa pagdapa nang nakaharap sa lupa. Isinama ang kahulugan nito sa pandiwang “nagpatirapa” upang maging natural at malinaw sa Tagalog.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang diwang pampook at pampublikong presensya ng Hebreong pang-ukol.
- source_word: כָּל
  choice: buong
  rationale: Sa isang pangngalang kolektibo, natural na ipinahahayag ng “buong” ang kabuuang saklaw.
- source_word: קְהַל
  choice: kapulungan
  rationale: Tumutukoy ito sa isang pangkat na nagkatipon; ang “kapulungan” ay malinaw at marangal na katumbas sa Tagalog.
- source_word: עֲדַת
  choice: sambayanan
  rationale: Tumutukoy ito sa organisadong pamayanan o kongregasyon. Pinananatili bilang hiwalay na salita upang hindi mawala ang dobleng kolektibong pahayag sa Hebreo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit itong sumusunod sa literal na “mga anak na lalaki ni Israel,” ngunit ang nakaugaliang “mga anak ni Israel” ay natural sa Tagalog at maaaring tumukoy sa bayang nagmula kay Israel nang hindi nililimitahan sa mga lalaking indibidwal.
theological_decisions:
- issue: Kung paiikliin ang dobleng kolektibong pariralang קְהַל עֲדַת sa iisang katawagan
  choice: Pinanatili ang dalawang katawagan bilang “kapulungan ng sambayanan.”
  alternative: “buong sambayanan” o “nagkakatipong sambayanan”
  rationale: Dalawang magkaugnay na pangngalang pangkomunidad ang nasa Hebreo. Ang pagpapanatili sa dalawa ay nagbibigay-diin sa pormal at pampublikong katangian ng tagpo nang hindi pinapakinis ang pagkakaiba ng mga ito.
- issue: Kung isasalin ang בְּנֵי יִשְׂרָאֵל bilang katawagang etniko o ayon sa literal na ugnayang angkan
  choice: “mga anak ni Israel”
  alternative: “mga Israelita”
  rationale: Pinananatili nito ang larawang pangangkan ng orihinal, samantalang ipinapaliwanag sa talababa ang natural na alternatibong etniko. Hindi nito ipinapalagay na mga lalaki lamang ang tinutukoy ng buong sambayanan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nagpatirapa” sa halip na ang alanganing literal na “bumagsak sa kanilang mga mukha,” ngunit pinanatili ang pormal na dobleng katawagang “kapulungan ng sambayanan.”
