  text: At nagpatirapa sina Moises at Aaron sa harap ng buong kapulungan ng sambayanan[a] ng mga anak ni Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, dalawang magkaugnay na katawagang pangkomunidad ang magkasunod: “kapulungan ng sambayanan.”'
