  text: וַ/יֹּאמְר֖וּ אִ֣ישׁ אֶל אָחִ֑י/ו נִתְּנָ֥ה רֹ֖אשׁ וְ/נָשׁ֥וּבָה מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/004.yaml
  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: tl
  text: At sinabi nila sa isa't isa[a], “Magtalaga tayo ng isang pinuno[b] at bumalik sa Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “bawat lalaki sa kaniyang kapatid.” Isang idyomang Hebreo ito na nangangahulugang nagsalita sila sa isa't isa.
    reason: lexical_alternative
  - marker: b
    text: Literal, “maglagay tayo ng isang ulo.” Ang “ulo” rito ay taong ilalagay na mamuno sa pangkat, samakatuwid ay isang pinuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Isinusulong ng wayyiqtol ng אמר ang salaysay; likas sa Filipino ang payak na pagkakasunod na “At sinabi nila.”
- source_word: אִישׁ אֶל אָחִיו
  choice: sa isa't isa
  rationale: Literal itong “bawat lalaki sa kaniyang kapatid,” ngunit isang tumbasang idyoma ito para sa pagsasalita nila sa kanilang kapuwa; hindi binibigyang-diin ng anyong panlalaki ang kasarian.
- source_word: נִתְּנָה
  choice: Magtalaga tayo
  rationale: Ang cohortative na נתן kasama ng רֹאשׁ ay nangangahulugang maglagay o humirang ng isang tao bilang nakatataas; malinaw at likas ang “magtalaga.”
- source_word: רֹאשׁ
  choice: isang pinuno
  rationale: Bagaman literal na “ulo,” tumutukoy rito ang salita sa taong mamumuno sa pangkat.
- source_word: וְנָשׁוּבָה
  choice: at bumalik
  rationale: Ang cohortative ng שוב ay kaagapay ng naunang cohortative; saklaw pa rin ito ng hortatoryong “tayo” sa Filipino.
- source_word: מִצְרָיְמָה
  choice: sa Ehipto
  rationale: Ipinahihiwatig ng hulaping paturol ang pagkilos patungong Ehipto; sapat na ang “sa Ehipto” dahil taglay na ng “bumalik” ang diwang pabalik.
