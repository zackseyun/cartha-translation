base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: tl
  text: 'At ngayon, nawa’y maging dakila ang kapangyarihan ng Panginoon,[a] gaya ng sinabi mo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “madakila ang kapangyarihan ng Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang temporal at pandiskurso na עַתָּה habang natural pa rin sa makabagong Filipino.
- source_word: יִגְדַּל־נָא
  choice: pakisuyo, ipakita mong dakila
  rationale: Ang jussive na יִגְדַּל kasama ng pakiusap na נָא ay naghahayag ng magalang na kahilingan. Mas natural sa Filipino ang aktibong pariralang ito kaysa sa literal ngunit alanganing ‘maging dakila nawa.’
- source_word: כֹּחַ
  choice: kapangyarihan
  rationale: Saklaw ng כֹּחַ ang lakas o kapangyarihang kumilos; ‘kapangyarihan’ ang angkop sa banal na kakayahang tinutukoy sa konteksto.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Tiyak na titulong אֲדֹנָי ito, hindi ang Tetragrammaton; ‘Panginoon’ ang likas at nakaugaliang salin sa Filipino.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Malinaw na ipinahahayag ang pagtutulad at pag-ayon ng kahilingan ni Moises sa naunang sinabi ng Diyos.
- source_word: דִּבַּרְתָּ
  choice: sinabi mo
  rationale: Ang perpektong pandiwa ay tumutukoy sa naunang pahayag ng Diyos na nananatiling batayan ng kasalukuyang pakiusap; natural dito ang simpleng naganap na anyo sa Filipino.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang quotative infinitive ay idiomatikong ipinahahayag sa Filipino sa pamamagitan ng tutuldok, yamang tuwirang ipinakikilala nito ang siping nagpapatuloy sa susunod na talata.
theological_decisions:
- issue: Pagpapakahulugan sa paglaki o pagdakila ng kapangyarihan ng Panginoon
  choice: ipakita mong dakila ang kapangyarihan ng Panginoon
  alternative: maging dakila ang kapangyarihan ng Panginoon
  rationale: Hindi ipinapalagay na kulang at kailangang literal na lumaki ang kapangyarihan ng Diyos. Ipinahahayag ng salin ang kahilingang mahayag o mapatunayan ang kadakilaan nito, habang itinatala sa talababa ang mas pormal na alternatibo.
- issue: Pagsasalin sa banal na titulong אֲדֹנָי
  choice: Panginoon
  alternative: ang Panginoon
  rationale: Ang ‘Panginoon’ ay likas bilang tiyak na banal na titulo sa Filipino at hindi ito ipinagkakamali sa saling ginagamit para sa pangalang YHWH.
translation_notes:
  register: Makabago, magalang, at marangal na Filipino. Ginamit ang ‘pakisuyo’ upang madala ang puwersa ng נָא nang hindi makaluma; ginamit ang tutuldok bilang likas na panimula sa siping nasa kasunod na talata.
