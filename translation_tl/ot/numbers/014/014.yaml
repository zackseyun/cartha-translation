    issue: Hindi malinaw ang pagkakaugnay ng mga sugnay na ipinakikilala ng paulit-ulit na “na.”
    rationale: Sa Hebreo, ang mga sumusunod na pahayag ay bumubuo sa iniulat na kaalamang narinig ng mga naninirahan. Ang mga tuldok-kuwit at magkakahiwalay na “na” sa draft ay nagpapahina sa ugnayang ito sa Tagalog.
  - severity: low
    issue: Mas natural ang “nakarinig nang” kaysa “nakarinig na” bago ang buong sugnay.
    rationale: Kapag sinusundan ng sugnay na nagsisimula sa “ikaw,” ang “nang” ang karaniwang pang-ugnay sa modernong Tagalog; ang “na” ay maaaring mabasa bilang aspektuwal na “already.”
