  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: tl
  text: At sasabihin nila sa mga naninirahan sa lupaing ito na nakarinig nang ikaw, Yahweh, ay nasa gitna ng bayang ito, na ikaw, Yahweh, ay nakikita nang mata sa mata[a], na ang iyong ulap ay nakatayo sa ibabaw nila, at na nauuna ka sa kanila sa isang haliging ulap sa araw at sa isang haliging apoy sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpapakita ka nang harapan”; literal, “mata sa mata ikaw ay nakikita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: mga naninirahan sa lupaing ito
  rationale: Ang pang-isahang participle ay may kolektibong diwa; likas sa Tagalog ang maramihang “mga naninirahan” para sa populasyong nakatira roon.
- source_word: שָׁמְעוּ
  choice: nakarinig na
  rationale: Ipinahihiwatig ng qatal ang impormasyong dati na nilang narinig at taglay na nilang kaalaman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: בְּקֶרֶב
  choice: nasa gitna ng
  rationale: Malapit ito sa kongkretong larawan ng presensiya ni Yahweh sa gitna ng bayan at natural sa modernong Tagalog.
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: nakikita nang mata sa mata
  rationale: Pinananatili ang pasibong diwa ng נִרְאָה at ang di-karaniwang larawan ng idyomang Hebreo, sa halip na tiyakang ipakahulugang “harap-harapan” o “malinaw.”
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: ang iyong ulap ay nakatayo sa ibabaw nila
  rationale: Pinananatili ang kongkretong pandiwang עמד at ang larawan ng ulap na nasa ibabaw ng bayan.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: nauuna ka sa kanila
  rationale: Likas sa Tagalog at malapit sa literal na “pumaparoon sa harapan nila,” nang hindi tahasang dinaragdagan ang interpretasyong “pinangungunahan.”
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: sa isang haliging ulap ... sa isang haliging apoy
  rationale: Inilalarawan nito ang nakikitang anyo o paraan ng presensiya ni Yahweh habang pinananatili ang larawan ng haligi.
- source_word: יוֹמָם ... לָיְלָה
  choice: sa araw ... sa gabi
  rationale: Ito ang pinakanatural na modernong Tagalog para sa mga pang-abay na panahong Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong personal na pangalan at hindi pinapalitan ng titulo.
- issue: Kahulugan ng עַיִן בְּעַיִן נִרְאָה
  choice: ikaw ay nakikita nang mata sa mata
  alternative: nagpapakita ka nang harapan; malinaw kang nakikita
  rationale: Hindi ganap na tiyak kung binibigyang-diin ng idyoma ang tuwirang pagpapakita o malinaw na pagkakita. Pinananatili ng salin ang larawan at tensiyon ng Hebreo, habang inilalahad sa talababa ang mas natural na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mga konkretong larawang “mata sa mata,” “nakatayo sa ibabaw,” at “haliging ulap/apoy,” kahit bahagyang di-karaniwan ang una, upang hindi burahin ang tunay na ambiguwidad ng Hebreo.
