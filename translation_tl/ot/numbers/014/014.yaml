revisions:
- from: At sasabihin nila sa mga naninirahan sa lupaing ito, na nakarinig na ikaw, Yahweh, ay nasa gitna ng bayang ito; na ikaw, Yahweh, ay nakikita nang mata sa mata[a]; na ang iyong ulap ay nakatayo sa ibabaw nila; at na nauuna ka sa kanila sa isang haliging ulap sa araw at sa isang haliging apoy sa gabi.
  to: At sasabihin nila sa mga naninirahan sa lupaing ito na nakarinig nang ikaw, Yahweh, ay nasa gitna ng bayang ito, na ikaw, Yahweh, ay nakikita nang mata sa mata[a], na ang iyong ulap ay nakatayo sa ibabaw nila, at na nauuna ka sa kanila sa isang haliging ulap sa araw at sa isang haliging apoy sa gabi.
  rationale: Inayos ang sintaks upang malinaw na ang magkakasunod na sugnay ay bahagi ng iniulat na nalaman ng mga naninirahan. Pinanatili ang malapit na “nakikita nang mata sa mata” at ang talababa upang hindi lutasin sa pangunahing teksto ang pinagtatalunang saklaw ng idyomang Hebreo.
