revisions:
- from: Huwag lamang kayong maghimagsik laban kay Yahweh. Huwag kayong matakot sa mga tao ng lupaing iyon, sapagkat sila ang ating tinapay[a]. Lumisan na sa kanila ang kanilang pananggalang[b], at kasama natin si Yahweh. Huwag kayong matakot sa kanila.
  to: Ngunit huwag kayong maghimagsik laban kay Yahweh. Huwag kayong matakot sa mga tao ng lupaing iyon, sapagkat sila ang ating tinapay[a]. Umalis na sa kanila ang kanilang pananggalang[b], at kasama natin si Yahweh. Huwag kayong matakot sa kanila.
