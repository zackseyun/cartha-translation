source:
  edition: WLC
  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: tl
  text: Ngunit huwag kayong maghimagsik laban kay Yahweh. Huwag kayong matakot sa mga tao ng lupaing iyon, sapagkat sila ang ating tinapay[a]. Umalis na sa kanila ang kanilang pananggalang[b], at kasama natin si Yahweh. Huwag kayong matakot sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sila ang ating pagkain.” Literal sa Hebreo, “sila ang ating tinapay”—isang metapora na nagpapahiwatig na madali silang malulupig o para bang malalamon.
    reason: lexical_alternative
  - marker: b
    text: Literal, “ang kanilang anino ay lumisan mula sa ibabaw nila.” Ang “anino” rito ay malamang na tumutukoy sa proteksiyon o kanlungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Huwag lamang
  rationale: Ikinakabit ang panlimita at mariing puwersa ng אַךְ sa kasunod na pagbabawal; natural sa Tagalog ang “Huwag lamang” at hindi nangangailangan ng mahinang pang-ugnay.
- source_word: בַּיהוָה ... תִּמְרֹדוּ
  choice: maghimagsik laban kay Yahweh
  rationale: Sa pandiwang מרד, ang בְּ ay tumutukoy sa kinakalaban sa paghihimagsik. Ang “maghimagsik laban” ay tuwiran at angkop sa awtoridad na nasa konteksto.
- source_word: תִּירְאוּ / תִּירָאֻם
  choice: Huwag kayong matakot / Huwag kayong matakot sa kanila
  rationale: Ang ירא ay tumutukoy sa pagkatakot sa harap ng mga kaaway. Pinanatili ang inuulit na huling utos sa halip na paikliin ito.
- source_word: עַם הָאָרֶץ
  choice: mga tao ng lupaing iyon
  rationale: Pinananatili ang Hebreong pariralang “mga tao ng lupain,” habang nililinaw ng “iyon” na ang tinutukoy ay ang lupaing kanilang pupuntahan.
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: sapagkat sila ang ating tinapay
  rationale: Pinananatili ang maikli at matingkad na metapora ng Hebreo sa halip na ipaliwanag sa pangunahing teksto bilang madali silang lupigin o lamunin.
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: Lumisan na sa kanila ang kanilang pananggalang
  rationale: Literal na “anino” ang צֵל, ngunit ginagamit dito bilang larawan ng proteksiyon o kanlungan. Ipinahahayag ng “pananggalang” ang diwa sa malinaw na makabagong Tagalog, habang inilalagay sa talababa ang literal na larawan.
- source_word: וַיהוָה אִתָּנוּ
  choice: at kasama natin si Yahweh
  rationale: Sapat ang payak na “at” para sa waw, at malinaw na pinananatili ang pahayag tungkol sa presensiya ni Yahweh.
- source_word: יהוה
  choice: Yahweh
  rationale: Isinasatitik ang pangalang tipan na nasa tekstong Hebreo, alinsunod sa ibinigay na English POB consultation layer at sa paliwanag nitong panatilihin ang pangalang Yahweh.
theological_decisions:
- issue: Metapora ng pananakop sa כִּי לַחְמֵנוּ הֵם
  choice: Pinanatili sa pangunahing teksto ang “sila ang ating tinapay.”
  alternative: “sila ang ating pagkain” o “malalamon natin sila”
  rationale: Hindi tahasang ipinapaliwanag ng Hebreo kung paano gumagana ang metapora. Ang literal na larawan ay nagpapanatili sa lakas at tunay na lawak ng kahulugan nito; ang posibleng diwa ay inilalahad lamang sa talababa.
- issue: Metaporikal na צִלָּם
  choice: Isinalin ang diwa bilang “kanilang pananggalang.”
  alternative: “kanilang anino” o “kanilang kanlungan”
  rationale: Maaaring hindi agad maunawaan sa modernong Tagalog ang “anino” bilang proteksiyon. Nililinaw ng pangunahing teksto ang gamit ng larawan nang hindi tinutukoy kung ang proteksiyong iyon ay isang diyos, hukbo, o ibang bagay na hindi tahasang pinangalanan ng talata.
- issue: Pagbanggit sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at iniiwasang ipalit dito ang isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “kayo” ayon sa Hebreo, pinanatili ang pag-uulit sa hulihan, at iniwasan ang sobrang pagpapaliwanag sa pangunahing teksto. Inayos ang mga marker upang ang [a] ay tumukoy sa metapora ng tinapay at ang [b] sa larawan ng anino/pananggalang.
