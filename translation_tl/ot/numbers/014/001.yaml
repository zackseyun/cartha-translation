    rationale: Ang pagbibigay ng “[nila]” ay mas malinaw na nagpapakitang ellipsis ang bagay ng unang pandiwa, samantalang nananatili ang literal na “ibinigay nila ang kanilang tinig.”
  revised_text: At itinaas ng buong kapulungan ang kanilang tinig at humiyaw sila, at umiyak ang mga tao nang gabing iyon.[a]
