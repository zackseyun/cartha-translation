  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: tl
  text: At itinaas ng buong kapulungan ang kanilang tinig at humiyaw sila, at umiyak ang mga tao nang gabing iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “itinaas [nila] ... at ibinigay nila ang kanilang tinig,” isang idyoma para sa malakas at sama-samang paghiyaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא כָּל־הָעֵדָה וַיִּתְּנוּ אֶת־קוֹלָם
  choice: ang buong kapulungan ay sabay-sabay na humiyaw
  rationale: Ang literal na larawan ay ‘itinaas ng buong kapulungan … at ibinigay nila ang kanilang tinig.’ Bilang isang pinagsamang idyoma, tumutukoy ito sa malakas at sama-samang paghiyaw. Natural sa modernong Tagalog ang ‘sabay-sabay na humiyaw,’ habang ipinapaliwanag sa talababa ang literal na anyo.
- source_word: כָּל הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan ng Israel. Ang ‘buong kapulungan’ ay marangal at malinaw, at pinananatili ang saklaw ng כָּל.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Pinananatili nito ang pagkakaiba ng salitang עָם mula sa naunang עֵדָה, kahit iisang pangkat ang tinutukoy sa konteksto.
- source_word: וַיִּבְכּוּ
  choice: umiyak
  rationale: Ang בכה ay ‘umiyak/tumangis.’ Ang ‘umiyak’ ay natural at malinaw, at naiiba sa naunang malakas na paghiyaw.
- source_word: בַּלַּיְלָה הַהוּא
  choice: nang gabing iyon
  rationale: Ito ang natural na katumbas sa Tagalog ng temporal na pariralang ‘sa gabing iyon.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang ‘kapulungan’ para sa pamayanang nagkatipon at ang ‘mga tao’ para mapanatili ang leksikal na pagpapalit sa Hebreo. Ang ‘sabay-sabay na humiyaw’ ay malinaw na naghahatid ng kolektibong kilos nang hindi inuulit nang alanganin ang dalawang magkaugnay na idyomang Hebreo.
