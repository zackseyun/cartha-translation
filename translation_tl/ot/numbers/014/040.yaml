  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: tl
  text: Maagang bumangon ang mga tao kinaumagahan at umakyat sa tuktok ng bundok. Sinabi nila, “Narito na kami. Aakyat kami sa lugar na binanggit ni Yahweh[a], sapagkat nagkasala kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “na sinabi ni Yahweh.”'
    reason: Pinananatili nito ang elliptical na anyo ng Hebreo habang gumagamit ang pangunahing teksto ng natural na “binanggit.”
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Maagang bumangon ang mga tao kinaumagahan
  rationale: Ang Hiphil ng שׁכם kasama ng בַבֹּקֶר ay nagpapahayag ng maagang pagbangon o pagsisimula sa umaga. Likas sa modernong Tagalog ang “maagang bumangon … kinaumagahan”; idinagdag ang “ang mga tao” bilang malinaw na paksa mula sa konteksto.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: umakyat sa tuktok ng bundok
  rationale: Ang עלה ay karaniwang “umakyat,” at ang idyomang רֹאשׁ הָהָר ay tumutukoy sa tuktok ng bundok.
- source_word: לֵאמֹר
  choice: Sinabi nila
  rationale: Ipinakikilala ng infinitive na ito ang tuwirang sinabi. Mas natural sa salaysay na Tagalog ang isang bagong pangungusap na “Sinabi nila” kaysa sa participial na anyo.
- source_word: הִנֶּנּוּ
  choice: Narito na kami
  rationale: Isa itong pormula ng paghaharap ng sarili. Pinananatili ng “Narito na kami” ang diin nang hindi tahasang ipinapalagay na ang kahulugan ay “handa na kami.”
- source_word: וְעָלִינוּ
  choice: Aakyat kami
  rationale: Bagaman perfect ang anyong Hebreo, ipinapahayag nito rito ang kanilang napipintong layunin. Ang payak na hinaharap sa Tagalog ang likas na katumbas.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר אָמַר יְהוָה
  choice: sa lugar na binanggit ni Yahweh[a]
  rationale: Elliptical sa Hebreo ang “lugar na sinabi ni Yahweh.” Ginagawang natural ng “binanggit” ang ugnayan nang hindi dinaragdagan ang mas malakas na ideya ng pangako o ang di-tahasang “na puntahan.” Inilalahad sa talababa ang mas literal na anyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: כִּי חָטָאנוּ
  choice: sapagkat nagkasala kami
  rationale: Ang כִּי ay nagbibigay ng dahilan, at pinananatili ng “nagkasala” ang moral at teolohikal na bigat ng חטא.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pamalit na titulo.
- issue: Lakas ng pag-amin sa חָטָאנוּ
  choice: nagkasala kami
  alternative: nagkamali kami
  rationale: Ang “nagkasala” ay tapat sa moral at teolohikal na kahulugan ng pandiwa; pinahihina ng “nagkamali” ang pag-amin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang maiikling pangungusap sa tuwirang pananalita upang maging natural sa karaniwang mambabasa, habang pinananatili ang taimtim at padalus-dalos na pahayag ng mga tao.
