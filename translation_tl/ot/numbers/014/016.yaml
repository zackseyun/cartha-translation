  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: tl
  text: Dahil hindi kayang dalhin ni Yahweh ang bayang ito sa lupaing ipinangako niya sa kanila nang may panunumpa[a], kinatay niya sila sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sa lupaing isinumpa niyang ibibigay sa kanila.” Hindi tahasang nasa Hebreo ang “ibibigay,” ngunit ipinahihiwatig ito ng konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבִּלְתִּי יְכֹלֶת
  choice: Dahil hindi kayang
  rationale: Ipinahahayag ng parirala ang ibibintang na kawalan ng kakayahan ni Yahweh bilang dahilan ng sinasabing pagpatay. Natural ito sa modernong Tagalog at hindi pinahihina ang paratang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְהָבִיא
  choice: dalhin
  rationale: Ang Hiphil ng בוא ay nangangahulugang papasukin o dalhin sa isang lugar; sapat at natural ang “dalhin” kasama ng pariralang tumutukoy sa lupain.
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang עָם ay kolektibong pangngalang isahan. Pinananatili ng “ang bayang ito” ang pagkakaisang pambansa at ang retorikal na diin ng Hebreo.
- source_word: אֶל הָאָרֶץ
  choice: sa lupain
  rationale: Natural sa Tagalog ang “dalhin ... sa lupain” at malinaw nitong ipinahihiwatig ang pagpasok sa ipinangakong lupain.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: ipinangako niya sa kanila nang may panunumpa
  rationale: Tahasang tumutukoy ang Hebreo sa panunumpa ngunit hindi sinasabi ang ipinangakong kilos. Inilalahad ng salin ang diwa ng sumpang pangako sa natural na Tagalog habang itinatala sa talababa ang mas literal na anyo.
- source_word: וַיִּשְׁחָטֵם
  choice: kinatay niya sila
  rationale: Malakas at marahas ang שׁחט, na karaniwang tumutukoy sa pagkatay o pagpaslang. Pinananatili ng “kinatay” ang tindi ng paratang sa halip na palambutin bilang “pinatay.”
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, dignidad, at tradisyonal ngunit nauunawaang katumbas ng מִדְבָּר sa salaysay ng paglalakbay ng Israel.
theological_decisions:
- issue: Ang paratang ng mga bansa tungkol sa kakayahan ni Yahweh
  choice: Dahil hindi kayang dalhin ni Yahweh...
  alternative: Dahil hindi nagawa ni Yahweh na dalhin...
  rationale: Bahagi ito ng sasabihin ng mga bansa ayon sa konteksto, hindi pahayag ng tagapagsalaysay na tunay na walang kakayahan ang Diyos. Gayunman, pinananatili ang tahasang paratang at hindi ito nilulunasan o pinahihina sa salin.
- issue: Ang ipinahiwatig na nilalaman ng panunumpa
  choice: ipinangako niya sa kanila nang may panunumpa
  alternative: isinumpa niya sa kanila
  rationale: Walang tahasang pandiwang “ibigay” sa Hebreo, ngunit nakasalalay sa konteksto ang nilalaman ng sumpa. Iniiwasan ng pangunahing salin ang pagdaragdag ng “ibibigay” habang malinaw na ipinapakita na isang taimtim na pangako ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Pinanatili ang personal na pangalang “Yahweh,” ang matinding pandiwang “kinatay,” at ang tensiyong dulot ng paratang na hindi niya kayang dalhin ang bayan sa lupain.
