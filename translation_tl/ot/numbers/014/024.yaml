id: NUM.14.24
reference: Numbers 14:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: tl
  text: Ngunit ang lingkod kong si Caleb—sapagkat ibang espiritu ang sumasakanya[a] at lubos siyang sumunod sa akin[b]—ay dadalhin ko sa lupaing pinuntahan niya, at aangkinin iyon ng kanyang mga inapo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “may iba siyang kalooban” o “iba ang kanyang saloobin” kumpara sa ibang mga Israelita.
    reason: lexical_alternative
  - marker: b
    text: 'Idyoma sa Hebreo: “pinuno niya ang pagsunod sa akin,” na nangangahulugang sumunod siya nang buong puso o lubusan.'
    reason: lexical_alternative
  - marker: c
    text: O, “mamamanahin iyon ng kanyang mga inapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי
  choice: Ngunit ang lingkod kong
  rationale: Ginawang pasalungat ang pang-ugnay dahil malinaw na inihahambing si Caleb sa suwail na salinlahing binanggit sa naunang konteksto. Ang “lingkod” ang likas at marangal na katumbas dito.
- source_word: כָלֵב
  choice: Caleb
  rationale: Pinanatili ang karaniwang anyo ng pangalang pantangi sa Filipino.
- source_word: עֵקֶב
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang kasunod na sugnay ang dahilan ng mabuting pasiya ng Diyos para kay Caleb.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: ibang espiritu ang sumasakanya
  rationale: Pinananatili ang malawak na kahulugan ng רוּחַ at ang diwa ng “kasama/nasa kanya,” nang hindi agad nililimitahan ito sa pag-uugali lamang o tahasang ipinakikilalang Espiritu ng Diyos.
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: at lubos siyang sumunod sa akin
  rationale: Ang literal na idyomang “pinuno niya ang pagsunod sa akin” ay malabo sa Filipino. Ipinahahayag ng salin ang kinikilalang diwa ng buo at puspusang pagsunod.
- source_word: וַהֲבִיאֹתִיו
  choice: dadalhin ko
  rationale: Bagaman anyong ganap ang pandiwa sa Hebreo, ipinahahayag nito rito ang tiyak na gagawin ng Diyos sa hinaharap.
- source_word: אֶל־הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: sa lupaing pinuntahan niya
  rationale: Malapit ito sa kongkretong pahayag ng Hebreo at tumutukoy sa lupaing napuntahan ni Caleb bilang espiya, nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: וְזַרְעוֹ
  choice: at ... ng kanyang mga inapo
  rationale: Kolektibo ang זֶרַע; natural sa makabagong Filipino ang “mga inapo” at malinaw na tumutukoy sa mga susunod na salinlahi.
- source_word: יוֹרִשֶׁנָּה
  choice: aangkinin iyon
  rationale: Saklaw ng ירשׁ ang pagmamana at pag-angkin o pagtatamo ng lupain. Ang “aangkinin” ay angkop sa konteksto ng pagkuha at pananatiling may-ari ng lupain.
theological_decisions:
- issue: Kahulugan ng “ibang espiritu” kay Caleb
  choice: Pinanatili ang “ibang espiritu” bilang malawak at hindi ganap na tinukoy na pahayag.
  alternative: “ibang kalooban” o tahasang “Espiritu ng Diyos ang sumasakanya”
  rationale: Maaaring tumukoy ang רוּחַ sa espiritu, saloobin, o disposisyon. Hindi tahasang tinutukoy ng talata ang Banal na Espiritu, kaya hindi nilutas ng salin ang sadyang pagiging bukas ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang gitling-pahaba upang panatilihing mababasa ang mahabang pangangatwirang nakasingit sa pagitan ng paksa at ng pangakong gagawin ng Diyos. Iniwasan ang teknikal o denominasyonal na pananalita.
