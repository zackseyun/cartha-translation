  source_fidelity: 'Tapat ang salin sa Hebreo: malinaw ang pagsalungat para kay Caleb, ang sanhi ng pangako, ang malawak na pahayag na “ibang espiritu,” ang idyomang lubos na pagsunod, ang pagdadala sa lupaing pinuntahan niya, at ang pag-angkin ng kanyang mga inapo sa lupain. Hindi nito nililimitahan ang “espiritu” sa isang partikular na doktrinal na pagbasa.'
