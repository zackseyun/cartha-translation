  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָ/מָ֣ה יְ֠הוָה מֵבִ֨יא אֹתָ֜/נוּ אֶל הָ/אָ֤רֶץ הַ/זֹּאת֙ לִ/נְפֹּ֣ל בַּ/חֶ֔רֶב נָשֵׁ֥י/נוּ וְ/טַפֵּ֖/נוּ יִהְי֣וּ לָ/בַ֑ז הֲ/ל֧וֹא ט֦וֹב לָ֖/נוּ שׁ֥וּב מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: tl
  text: At bakit tayo dinadala ni Yahweh sa lupaing ito para mamatay sa tabak? Ang ating mga asawa at maliliit na anak ay magiging samsam[a]. Hindi ba mas mabuti para sa atin na bumalik sa Ehipto?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magiging biktima”; ang salitang Hebreo ay maaaring tumukoy sa mga taong kukunin bilang samsam ng mga kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: At bakit
  rationale: Pinananatili ng “At” ang pagpapatuloy ng reklamo mula sa naunang talata, habang natural sa makabagong Tagalog ang “bakit.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: tayo dinadala ... sa lupaing ito
  rationale: Ipinahihiwatig ng participle na nagpapatuloy o nalalapit ang pagkilos; malinaw at natural sa Tagalog ang “dinadala.”
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: para mamatay sa tabak
  rationale: Ang literal na “bumagsak sa tabak” ay idyomang Hebreo para sa pagkamatay sa labanan; inilalahad ng salin ang kahulugan nang malinaw habang pinananatili ang larawan ng tabak.
- source_word: נָשֵׁינוּ וְטַפֵּנוּ
  choice: ang ating mga asawa at maliliit na anak
  rationale: Ang נָשִׁים ay tumutukoy rito sa mga asawa, at binibigyang-diin ng טַף ang maliliit at mahihinang anak o dependente.
- source_word: יִהְיוּ לָבַז
  choice: ay magiging samsam
  rationale: Ang בַּז ay tumutukoy sa samsam na kinukuha ng kaaway; ang “samsam” ay tiyak sa konteksto ng digmaan at likas sa Tagalog.
- source_word: הֲלוֹא טוֹב לָנוּ שׁוּב מִצְרָיְמָה
  choice: Hindi ba mas mabuti para sa atin na bumalik sa Ehipto?
  rationale: Pinananatili nito ang retorikal na tanong at ang diwa ng paghahambing na likas sa pahayag.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Ang ipinahihiwatig na layunin sa לִנְפֹּל בַּחֶרֶב
  choice: para mamatay sa tabak
  alternative: at mamatay sa tabak
  rationale: Ang לְ na kasama ng infinitive ay maaaring magpahayag ng layunin o kinalabasan. Pinananatili ng “para” ang paraan ng pagsasalita ng mga nagrereklamo—ang paratang nilang ito ang kahihinatnan o layunin ng pagdadala sa kanila—nang hindi pinagtitibay ng tagapagsalaysay na tama ang paratang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupain,” “tabak,” at “samsam” dahil pamilyar ang mga ito sa kontekstong biblikal ngunit nauunawaan pa rin ng karaniwang mambabasa. Ang “maliliit na anak” ay mas natural kaysa “mga musmos” at pinananatili ang diin sa kanilang kahinaan.
