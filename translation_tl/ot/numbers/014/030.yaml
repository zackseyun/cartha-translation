base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: tl
  text: Tiyak na hindi kayo makapapasok sa lupaing pinagtaasan ko ng aking kamay upang kayo'y patirahin doon[a], maliban kina Caleb na anak ni Jefune at Josue na anak ni Nun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang lupaing pinagtaasan ko ng aking kamay upang kayo'y patirahin doon.” Ang pagtataas ng kamay ay isang kilos ng panunumpa; nanumpa ang Diyos na ibibigay niya sa kanila ang lupain.
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: Tiyak na hindi kayo makapapasok
  rationale: Ang אִם sa pasimula ng pahayag na parang panunumpa ay may diwang mariing pagtanggi, hindi karaniwang kondisyon. Ipinahahayag ng salin ang katiyakan ng hatol.
- source_word: אֶל הָאָרֶץ
  choice: sa lupaing iyon
  rationale: Natural sa Filipino ang “makapasok sa lupain” para sa galaw papaloob sa isang teritoryo; ang “iyon” ay tumutukoy sa tiyak na lupaing pinag-uusapan.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: na para rito ay itinaas ko ang aking kamay
  rationale: Pinananatili ang konkretong larawan ng Hebreong kilos sa panunumpa sa halip na palitan lamang ng “ipinangako ko.”
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: upang doon kayo patirahin
  rationale: 'Ipinapakita ng “patirahin” ang causative na diwa ng pandiwa: ang Diyos ang maglalagay o magpapapanatili sa kanila roon bilang mga naninirahan.'
- source_word: כִּי אִם
  choice: maliban kina
  rationale: Malinaw nitong ipinakikilala ang dalawang tanging eksepsiyon sa naunang mariing pagtanggi.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Caleb na anak ni Jefune
  rationale: Ginamit ang karaniwang anyong Filipino ng patronimiko at pamilyar na baybay ng pangalan.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: at Josue na anak ni Nun
  rationale: Pinanatili ang pang-ugnay at ang patronimiko sa natural na anyong Filipino, gamit ang pamilyar na baybay ng pangalan.
theological_decisions:
- issue: Pagpapahayag sa idyoma ng panunumpa nang hindi pinahihina ang hatol ng Diyos
  choice: Tiyak na hindi kayo makapapasok
  alternative: Kung makapapasok kayo
  rationale: Sa konteksto ng banal na hatol, ang panimulang אִם ay pormula ng mariing pagtanggi sa loob ng isang panunumpa. Ang literal na kondisyunal ay magiging malabo at maaaring magmukhang putol na pangungusap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawan ng pagtataas ng kamay, habang ipinaliwanag sa talababa ang kahulugan nitong panunumpa.
