  verdict: revise
  source_fidelity: Tumpak ang mariing pagtanggi sa panimulang אִם, ang mga eksepsiyon, at ang mga patronimiko. Gayunman, ang “para rito ay itinaas ko ang aking kamay” ay hindi likas na pagbuo sa Filipino at hindi malinaw na ikinakabit ang kilos ng panunumpa sa lupain.
  naturalness: Malinaw sa kabuuan, ngunit mas natural at matatag ang “lupaing pinagtaasan ko ng aking kamay” kaysa “lupaing iyon na para rito ay itinaas ko ang aking kamay.”
  terminology: Ang “patirahin” ay angkop para sa causative na לשכן. Dapat palitan ang “isinumpa ng Diyos” sa talababa, dahil sa modernong Filipino ay karaniwan itong nangangahulugang nagbitiw ng sumpa/cursing; “nanumpa” ang wastong katumbas ng oath gesture.
  issues:
  - severity: medium
    issue: Hindi likas ang “na para rito ay itinaas ko ang aking kamay.”
    rationale: Ang Hebreong idyoma ay pagtataas ng kamay bilang panunumpa na nauugnay sa lupain. Ang “pinagtaasan ko ng aking kamay” ay mas natural na Filipino at pinananatili ang larawan ng orihinal.
  - severity: medium
    issue: Maaaring maling maunawaan ang “isinumpa ng Diyos.”
    rationale: Sa kasalukuyang Filipino, ang “isinumpa” ay madalas tumutukoy sa pagsumpa o pagmumura, hindi sa pagpanunumpa. “Nanumpa ang Diyos” ang malinaw na pahayag ng kahulugan ng idyoma.
  revised_text: Tiyak na hindi kayo makapapasok sa lupaing pinagtaasan ko ng aking kamay upang kayo'y patirahin doon[a], maliban kina Caleb na anak ni Jefune at Josue na anak ni Nun.
