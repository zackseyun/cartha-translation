  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: tl
  text: At sinabi ni Yahweh, “Pinatawad ko na[a], ayon sa sinabi mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nagpatawad na ako, gaya ng sinabi mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay; natural sa Tagalog ang “At sinabi” at hindi nito labis na tinutukoy ang eksaktong ugnayang temporal o lohikal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: סָלַחְתִּי
  choice: Pinatawad ko na sila
  rationale: Ang perpektong anyo ay nagpapahayag ng pagpapatawad bilang napagpasiyahan o naganap na; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “pinatawad ko na.” Idinagdag ang “sila” bilang likas na ipinahihiwatig na layon mula sa konteksto, bagaman walang tahasang layon sa Hebreo.
- source_word: כִּדְבָרֶךָ
  choice: ayon sa sinabi mo
  rationale: Pinananatili ng “ayon sa” ang diwa ng כ־, habang ang “sinabi mo” ay mas natural sa modernong Tagalog kaysa sa literal na “ayon sa iyong salita.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tahasan sa Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi bilang pamalit na titulo.
- issue: Hindi tahasang layon ng pandiwang “nagpatawad”
  choice: Pinatawad ko na sila
  alternative: Nagpatawad na ako
  rationale: Ang Israel ang malinaw na layon sa konteksto ng pamamagitan ni Moises. Ginagawang natural at malinaw ng “sila” ang pangungusap sa Tagalog nang hindi binabago ang tinutukoy; gayunman, maaaring panatilihin ang kawalan ng tahasang layon sa alternatibong salin.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Iniwasan ang sobrang pormal na “alinsunod sa iyong salita”; ginamit ang natural na “ayon sa sinabi mo.”
