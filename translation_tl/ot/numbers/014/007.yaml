base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: tl
  text: At sinabi nila sa buong kapulungan ng mga Israelita[a], “Ang lupaing dinaanan namin upang siyasatin[b] ay napakabuti—talagang napakabuti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ni Israel”; maaari ring “buong kapulungan ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “galugarin” o “manmanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Likas na salaysay sa Filipino para sa wayyiqtol ng אמר at malinaw na nagpapakilala ng tuwirang pananalita.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: sa buong kapulungan ng mga Israelita
  rationale: Ang עֵדָה ay tumutukoy sa nagkakatipong pamayanan o kapulungan; ang “mga Israelita” ay natural na modernong Filipino para sa בְּנֵי יִשְׂרָאֵל nang hindi ipinahihiwatig na mga lalaki lamang.
- source_word: לֵאמֹר
  choice: hindi isinalin nang hiwalay
  rationale: Hindi na kailangan ang pormulang “na sinasabi” sa Filipino kapag sinusundan na ng tuwirang sipi.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tiyak na tumutukoy sa lupaing Canaan na pinag-uusapan; mas natural dito ang “lupain” kaysa “bansa.”
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: dinaanan namin
  rationale: Maikli at natural na ipinapahayag ang pagdaan nila sa loob ng lupain.
- source_word: לָתוּר אֹתָהּ
  choice: upang siyasatin
  rationale: Sinasaklaw ng “siyasatin” ang eksplorasyon at maingat na pagmamasid na ipinahihiwatig ng תור, samantalang iniiwasan ang posibleng sobrang makitid na kahulugan ng “maniktik.”
- source_word: טוֹבָה
  choice: mabuti
  rationale: Pinananatili ang payak na kahulugan ng pang-uri; ang matinding diin ay nagmumula sa kasunod na dobleng מְאֹד.
- source_word: מְאֹד מְאֹד
  choice: napakabuti—talagang napakabuti
  rationale: Natural na Filipino na pinananatili ang pag-uulit at mariing retorikal na puwersa ng dobleng adverbio.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kapulungan” para sa pampamayanang pagtitipon at “mga Israelita” upang maging natural at inklusibo sa kasarian. Ang pag-uulit sa hulihan ay sadyang pinanatili upang tumbasan ang mariing מְאֹד מְאֹד.
