  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: tl
  text: Kung nalulugod sa atin si Yahweh[a], dadalhin niya tayo sa lupaing ito at ibibigay niya ito sa atin—isang lupaing umaapaw sa gatas at pulot-pukyutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung kinalulugdan niya tayo” o “kung pinapaboran niya tayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Nagpapakilala ito ng tunay na kondisyong nakaugnay sa mabuting kalooban ni Yahweh; hindi ito ginawang tiyak na “Kapag.”
- source_word: חָפֵץ בָּנוּ
  choice: nalulugod sa atin
  rationale: Likas at marangal na Filipino ito para sa personal na kasiyahan o mabuting pagtingin na ipinahihiwatig ng חפץ, habang pinananatili ang posibilidad na unawain itong “kinalulugdan” o “pinapaboran.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay na Filipino ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: dadalhin niya tayo sa lupaing ito
  rationale: Ang pandiwa ay bunga ng kondisyon at may hinaharap na diwa. Sa Filipino, sapat at natural ang “sa lupaing ito” para sa pagdadala sa lupain; ipinahihiwatig ng konteksto ang pagpasok doon.
- source_word: וּנְתָנָהּ לָנוּ
  choice: at ibibigay niya ito sa atin
  rationale: Pinananatili ang payak na kahulugan ng נתן at ginagawang malinaw na ang panghalip ay tumutukoy sa lupain.
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: isang lupaing dinadaluyan ng gatas at pulot-pukyutan
  rationale: Pinananatili ang inuulit na appositional na “lupain” at ang matingkad na Hebreong larawan ng sagana at matabang lupain. Ang “pulot-pukyutan” ay malinaw sa modernong Filipino bilang honey.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito sa transliterasyong Yahweh sa halip na palitan ng titulo.
- issue: Lakas ng kondisyong אִם חָפֵץ בָּנוּ
  choice: Kung nalulugod sa atin
  alternative: Kapag nalulugod sa atin; Kung pinapaboran niya tayo
  rationale: Pinananatili ng “Kung” ang kondisyong nasa Hebreo at hindi ipinapalagay ang katiyakang wala sa mismong anyo ng pangungusap. Hindi rin nililimitahan ang חפץ sa isang teknikal na doktrina ng pabor.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lupain” para sa biblikal ngunit karaniwang rehistro, at “pulot-pukyutan” upang maiwasan ang kalabuan ng payak na “pulot.”
