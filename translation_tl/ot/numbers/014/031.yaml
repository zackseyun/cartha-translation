  - severity: medium
    issue: Hindi tumpak ang talababa a na “magiging bihag na samsam.”
    rationale: Ang “bihag” ay nagdaragdag ng ideya ng pagkabihag na wala sa לָבַז. Ang “biktima” ay mas ligtas na alternatibo para sa diwang “prey.”
