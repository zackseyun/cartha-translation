  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang kahulugan ng mga maliliit na anak, pagiging samsam, pagkakilala/pagdanas sa lupain, at pagtatakwil dito. Gayunman, ang “roon” sa “ay dadalhin ko roon” ay isang deiktikong dagdag na wala sa Hebreo at hindi pa malinaw ang tinutukoy sa daloy ng pangungusap. Ang “ipapasok ko sila” ay tuwirang tumutugon sa hiphil ng בוא at pinananatiling ipinahihiwatig lamang ang patutunguhan.
  naturalness: Marangal at natural ang rehistro. Mas malinaw at mas matatas ang “ipapasok ko sila” kaysa “dadalhin ko roon.” Ang “makikilala nila ang lupain” ay katanggap-tanggap na literal na salin at maaaring maghatid ng diwang karanasang ipinahihiwatig ng Hebreo.
  terminology: Ang “maliliit na anak,” “samsam,” “lupain,” at “itinakwil” ay angkop. Hindi tumpak ang alternatibong talababa na “magiging bihag na samsam,” sapagkat ang לָבַז ay tumutukoy sa pagiging samsam/biktima ng pagsamsam, hindi tahasang sa pagiging bihag.
