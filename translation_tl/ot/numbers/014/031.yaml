base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: tl
  text: Ngunit ang inyong maliliit na anak, na sinabi ninyong magiging samsam[a], ay ipapasok ko sila, at makikilala nila[b] ang lupaing itinakwil ninyo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magiging biktima.”
    reason: lexical_alternative
  - marker: b
    text: O “mararanasan nila.” Ang salitang Hebreo para sa “makikilala” ay maaari ring tumukoy rito sa personal na pagdanas sa lupain.
    reason: lexical_alternative
  - marker: c
    text: O “hinamak ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: ang inyong maliliit na anak
  rationale: Ang טַף ay tumutukoy sa maliliit na anak at itinatampok ang kanilang kahinaan sa konteksto; mas tiyak ito kaysa sa pangkalahatang “mga anak.”
- source_word: לָבַז
  choice: magiging samsam
  rationale: Ang בַּז ay samsam na kinukuha ng kaaway, kaya ang “magiging samsam” ay natural at angkop sa kontekstong militar.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: ay dadalhin ko roon
  rationale: Ang hiphil ng בוא ay nagsasaad ng pagpapapasok o pagdadala; ang “roon” ay natural na tumutukoy sa lupaing binanggit sa kasunod na sugnay nang hindi ito pinapangalanang Canaan.
- source_word: וְיָדְעוּ
  choice: makikilala nila
  rationale: Pinananatili ng “makikilala” ang pangunahing diwa ng יָדַע habang maaari ring magpahiwatig ng personal na pagdanas.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto, tumutukoy ito sa lupaing pupuntahan ng Israel; ang “lupain” ay malinaw at hindi nagdaragdag ng salitang “pangako” o pangalang “Canaan.”
- source_word: מְאַסְתֶּם בָּהּ
  choice: lupaing itinakwil ninyo
  rationale: Ang מָאַס ay maaaring mangahulugang itakwil, tanggihan, o hamakin. Ang “itinakwil” ay nagpapahayag ng mariing pagtanggi nang hindi kinakailangang magdagdag ng emosyonal na paghamak.
theological_decisions:
- issue: Kung tahasang tatawaging “lupang pangako” o “Canaan” ang lupain
  choice: Panatilihin lamang ang “lupain.”
  alternative: “lupang pangako” o “lupain ng Canaan”
  rationale: “Ang lupain” lamang ang nasa Hebreo. Malinaw ang tinutukoy dahil sa konteksto, at ang pagdaragdag ng “pangako” o “Canaan” ay magiging paliwanag na wala sa talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “maliliit na anak” upang idiin ang kahinaan ng mga bata, “samsam” para sa kontekstong militar, at “makikilala” upang mapanatili ang literal at posibleng eksperiyensiyal na diwa ng Hebreo.
