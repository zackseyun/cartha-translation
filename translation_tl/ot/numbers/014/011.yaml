source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Hanggang kailan ako hahamakin[a] ng bayang ito? At hanggang kailan hindi sila maniniwala sa akin[b], sa kabila ng lahat ng tandang ginawa ko sa gitna nila[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itatakwil ako nang may paghamak.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi magtitiwala sa akin.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa gitna nito”; ang isahang panghalip ay tumutukoy sa bayan bilang isang kabuuan.
    reason: source_form
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: עַד אָנָה
  choice: Hanggang kailan
  rationale: Likas na katumbas sa Filipino ng paulit-ulit na retorikal na tanong sa Hebreo.
- source_word: יְנַאֲצֻנִי
  choice: ako hahamakin
  rationale: Ipinapahayag ng נאץ ang mapanghamak na pagtanggi o paglapastangan; malinaw at marangal ang “hamakin” sa modernong Filipino.
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Pinananatili ang kolektibong isahan at ang bahagyang mapaglayong tono ng Hebreo.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: hindi maniniwala sa akin
  rationale: Saklaw ng Hiphil ng אמן na may ב ang paniniwala at pagtitiwala sa isang persona; pinananatili sa talababa ang tunay na alternatibong “magtitiwala.”
- source_word: בְּכֹל הָאֹתוֹת
  choice: sa kabila ng lahat ng tanda
  rationale: 'Ang בְּ ay nauunawaang konsesibo sa konteksto: hindi pa rin sila naniniwala kahit nakita na nila ang mga tanda.'
- source_word: הָאֹתוֹת
  choice: mga tanda
  rationale: Tapat sa karaniwang kahulugan ng אוֹת at hindi idinaragdag ang “mahimalang” na hindi tahasang nasa salita.
- source_word: עָשִׂיתִי
  choice: ginawa ko
  rationale: Natural sa Filipino at sapat na ipinahahayag ang mga nagdaang gawa na mahalaga sa kasalukuyang sumbat.
- source_word: בְּקִרְבּוֹ
  choice: sa gitna nila
  rationale: Natural na Filipino para sa kilos na ginawa sa piling ng buong bayan, habang ipinaliliwanag sa talababa ang kolektibong isahang hulapi.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito sa transliterasyon sa halip na palitan ng titulo.
- issue: Saklaw ng לֹא יַאֲמִינוּ בִי
  choice: hindi maniniwala sa akin
  alternative: hindi magtitiwala sa akin
  rationale: Maaaring tumukoy ang parirala kapwa sa paniniwala at pagtitiwala. Ginamit sa pangunahing teksto ang mas tuwirang “maniniwala,” at pinanatili sa talababa ang kaugnay na diwa ng pagtitiwala.
- issue: Ugnayan ng בְּכֹל הָאֹתוֹת sa kawalan ng paniniwala
  choice: sa kabila ng lahat ng tanda
  alternative: dahil sa lahat ng tanda; sa harap ng lahat ng tanda
  rationale: 'Ipinahihiwatig ng konteksto ang matinding pagsalungat: nananatili silang hindi naniniwala sa kabila ng lahat ng ginawa ni Yahweh. Ginagawang malinaw ng salin ang konsesibong ugnayang ito nang hindi dinaragdagan ang uri ng mga tanda.'
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang dalawang magkatulad na tanong na “Hanggang kailan” upang maihatid ang retorikal na diin ng Hebreo. Ginamit ang “bayang ito” para sa kolektibong isahan at ang “sa gitna nila” para sa likas na pagtukoy sa mga taong bumubuo sa bayan.
