  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: tl
  text: Ngunit sina Josue na anak ni Nun at Caleb na anak ni Jefune lamang ang nanatiling buháy mula sa mga lalaking iyon na nagpunta upang siyasatin ang lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “galugarin ang lupain” o “manmanan ang lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Ngunit si Josue
  rationale: Ginamit ang “Ngunit” upang ipakita ang malinaw na pagsalungat sa pagkamatay ng iba sa naunang talata. Ang “Josue” ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: בִּן נוּן
  choice: na anak ni Nun
  rationale: Likas na Filipino para sa Hebreong ugnayang panlahi, habang pinananatili ang pangalan.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: at si Caleb na anak ni Jefune
  rationale: Tuwirang pinag-uugnay ang ikalawang nakaligtas kay Josue. Ginamit ang mga anyong pangalang madaling makilala sa Filipino.
- source_word: חָיוּ
  choice: lamang ang nanatiling buháy
  rationale: Ipinahahayag ng “nanatiling buháy” ang diwa na hindi sila namatay gaya ng iba; ang “lamang” ay likas na nagpapakita na silang dalawa ang eksepsiyon sa pangkat.
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: sa mga lalaking iyon
  rationale: Tinutukoy ang partikular na pangkat ng mga lalaking isinugo. Kasama ng “lamang,” malinaw na sina Josue at Caleb ang mga natirang buháy mula sa pangkat na iyon.
- source_word: הַהֹלְכִים
  choice: na nagpunta
  rationale: Ang participle ay inilalarawan bilang natapos nang pagpunta sa konteksto ng salaysay.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: upang siyasatin ang lupain
  rationale: Ang “siyasatin” ay natural at sapat na malawak para sa misyong pagmamanman o paggalugad, nang hindi ipinapalagay na lihim na paniniktik ang pangunahing diin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “lupain” bilang karaniwang biblikal ngunit natural na katumbas ng הָאָרֶץ. Nilagyan ng tuldik ang “buháy” upang maiwasan ang maling pagbasa bilang “búhay” (life).
