id: NUM.14.35
reference: Numbers 14:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: tl
  text: '“Ako, si Yahweh, ang nagsalita. Tiyak[b] na gagawin ko ito sa buong masamang kapulungang[a] ito na nagtipon laban sa akin: sa ilang na ito sila mauubos, at doon sila mamamatay.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pamayanan” o “pagtitipon.”
    reason: lexical_alternative
  - marker: b
    text: Ang idyomang Hebreo na isinaling “Tiyak” ay literal na “kung hindi,” isang pormulang tulad-panunumpa na nagpapahayag ng matinding katiyakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: דִּבַּרְתִּי
  choice: ang nagsalita
  rationale: Ipinahahayag ng perpektong pandiwa ang natapos at tiyak na banal na pahayag; likas at maringal sa Filipino ang “Ako ... ang nagsalita.”
- source_word: אִם לֹא
  choice: Tiyak
  rationale: Sa kontekstong panunumpa, isa itong idyomatikong mariing pagpapatibay, hindi isang tunay na kondisyong nananatiling bukas.
- source_word: זֹאת אֶעֱשֶׂה
  choice: gagawin ko ito
  rationale: Direktang pinananatili ang hinaharap na kilos at ang diin ng demonstratibong “ito.”
- source_word: הָעֵדָה
  choice: kapulungan
  rationale: Tumutukoy ito sa sama-samang pamayanan ng Israel na natipon bilang isang pangkat; ang “kapulungan” ay pormal ngunit malinaw sa makabagong Filipino.
- source_word: הָרָעָה
  choice: masamang
  rationale: Pinananatili nito ang moral na paghatol sa paghihimagsik ng pangkat, hindi lamang ang ideya na hindi kanais-nais sila.
- source_word: הַנּוֹעָדִים עָלַי
  choice: na nagtipon laban sa akin
  rationale: Sinasaklaw nito kapwa ang sama-samang pagkilos at ang tahasang pagsalungat sa Diyos.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: sa ilang na ito
  rationale: Ang “ilang” ay natural na katawagan sa Filipino para sa ilang o wilderness ng salaysay sa Pentateuco.
- source_word: יִתַּמּוּ
  choice: sila mauubos
  rationale: Ipinahahayag ang pagdating nila sa ganap na wakas nang hindi ito ganap na ipinapareho sa kasunod na tahasang pagbanggit sa kanilang kamatayan.
- source_word: וְשָׁם יָמֻתוּ
  choice: at doon sila mamamatay
  rationale: Pinanatili ang pang-abay na “doon” at ang hiwalay na sugnay upang maingatan ang diin at paralelismo ng Hebreo.
theological_decisions:
- issue: Ang pormulang tulad-panunumpa na אִם לֹא
  choice: 'Mariing katiyakan: “Tiyak na gagawin ko ito”'
  alternative: Literal ngunit di-likas na kondisyong “kung hindi”
  rationale: Gumaganap ang parirala bilang taimtim na banal na pagpapatibay, hindi bilang di-tiyak na kondisyon.
- issue: Ang kolektibong katawagang עֵדָה
  choice: kapulungan
  alternative: pamayanan o pagtitipon
  rationale: Pinananatili nito ang kolektibo at pormal na diwa nang hindi ipinapasok ang mas huling teknikal na kahulugang eklesiyastiko.
translation_notes:
  register: Makabago, malinaw, at maringal na Filipino. Ginamit ang “kapulungan” para sa pormal na kolektibong diwa, at pinanatiling magkahiwalay ang “mauubos” at “mamamatay” upang maingatan ang pag-usad at paralelismo ng Hebreo.
