  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: tl
  text: At ang inyong mga anak na lalaki ay magiging mga pastol sa ilang sa loob ng apatnapung taon,[a] at papasanin nila ang inyong pagtataksil[b] hanggang sa maubos ang inyong mga bangkay sa ilang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magiging mga lagalag.” Ang salitang Hebreo ay literal na kaugnay ng pagpapastol, ngunit maaaring idiin dito ang kanilang pagala-galang pamumuhay sa ilang.
    reason: lexical_alternative
  - marker: b
    text: Ang “pagtataksil” ay salin ng salitang maaari ring tumukoy sa pakikiapid o pagpapaharlot; ginagamit dito ang seksuwal na larawan para sa kataksilan sa tipan.
    reason: lexical_alternative
  - marker: c
    text: O “hanggang sa sumapit sa wakas ang inyong mga bangkay sa ilang.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: At ang inyong mga anak na lalaki
  rationale: Ang בנים ay karaniwang tumutukoy sa mga anak na lalaki; pinananatili rito ang tiyak na kasarian ng anyong Hebreo.
- source_word: רֹעִים
  choice: mga pastol
  rationale: Ang salita ay mula sa ugat na tumutukoy sa pagpapastol o pagpapakain ng kawan. Pinananatili ang literal na larawan, habang inilalagay sa talababa ang posibleng diwang pagala-gala.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay lupaing ilang o pastulan, hindi lamang mabuhanging disyerto. Ang “ilang” ay natural at matatag na salin sa makabagong Tagalog.
- source_word: אַרְבָּעִים שָׁנָה
  choice: sa loob ng apatnapung taon
  rationale: Likas na Tagalog para sa pariralang nagsasaad ng tagal.
- source_word: וְנָשְׂאוּ
  choice: at papasanin nila
  rationale: Pinananatili ang idyoma ng נשא na ‘magdala/pumasan,’ dito ay pagdadala ng bunga o bigat ng kasalanan ng kanilang mga magulang.
- source_word: אֶת זְנוּתֵיכֶם
  choice: ang inyong pagtataksil
  rationale: Sa konteksto, ang זְנוּת ay talinghagang seksuwal para sa kataksilan sa tipan. Ang “pagtataksil” ay malinaw at natural; ipinaliliwanag ng talababa ang mas mariing larawan sa Hebreo.
- source_word: עַד תֹּם פִּגְרֵיכֶם
  choice: hanggang sa maubos ang inyong mga bangkay
  rationale: Ang תֹּם ay nagpapahiwatig ng lubos na pagkaubos o pagsapit sa wakas, at ang פגר ay bangkay. Inilalahad nito ang pagkamatay ng buong hinatulang salinlahi nang hindi dinaragdagan ang teksto.
theological_decisions:
- issue: Kung ang זְנוּתֵיכֶם ay dapat isalin bilang literal na seksuwal na imoralidad o bilang kataksilan sa tipan
  choice: pagtataksil, na may talababa tungkol sa seksuwal na talinghaga
  alternative: pakikiapid; pagpapaharlot
  rationale: Ang agarang konteksto ay ang paghihimagsik ng Israel laban sa PANGINOON. Ang pangunahing salin ay naghahayag ng kataksilan nang hindi ipinapalagay na literal na seksuwal na gawa lamang iyon, samantalang pinananatili ng talababa ang matinding larawan ng orihinal.
- issue: Kung ang רֹעִים ay dapat gawing dinamikong ‘mga pagala-gala’
  choice: mga pastol
  alternative: mga pagala-gala
  rationale: Ang leksikal na anyo ay tuwirang kaugnay ng pagpapastol. Ang pagala-galang pamumuhay ay posibleng ipinahihiwatig, ngunit hindi dapat ipalit nang walang paliwanag sa kongkretong larawan ng Hebreo.
- issue: Kung ang ‘papasanin’ ay nagpapahiwatig ng paglilipat ng personal na pagkakasala
  choice: pinanatili ang idyomang ‘papasanin’ bilang pagdanas o pagdala ng bunga ng pagtataksil
  alternative: magdurusa sila dahil sa inyong pagtataksil
  rationale: Hindi nilulutas ng salin kung ito ay pagdadala ng sala o ng mga kahihinatnan. Ang literal na idyoma ay nagpapanatili sa tensiyong nasa teksto.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga pastol,” “ilang,” at “mga bangkay” upang mapanatili ang kongkreto at mabigat na larawan ng Hebreo. Ang “pagtataksil” ay natural sa Tagalog, habang ang talababa ang nagpapanatili sa seksuwal na talinghaga ng זְנוּת.
