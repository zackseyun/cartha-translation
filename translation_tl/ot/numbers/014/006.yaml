base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: tl
  text: At sina Josue na anak ni Nun at Caleb na anak ni Jefone, na kabilang sa mga nagmanman sa lupain, ay pinunit ang kanilang mga damit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pagpunit ng sariling damit ay nakaugaliang tanda ng matinding dalamhati, pagkagimbal, o paghihinagpis.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: At si Josue na anak ni Nun
  rationale: Ang וְ ay payak na pang-ugnay sa daloy ng salaysay. Ginamit ang nakaugaliang makabagong anyong Filipino ng pangalan at pinanatili ang malinaw na patronimiko.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: at Caleb na anak ni Jefone
  rationale: Pinag-uugnay ng וְ sina Josue at Caleb bilang magkasamang simuno; pinanatili ang patronimikong 'anak ni.'
- source_word: מִן הַתָּרִים אֶת הָאָרֶץ
  choice: na kabilang sa mga nagmanman sa lupain
  rationale: 'Partitibo ang מִן dito: kabilang sina Josue at Caleb sa mas malaking pangkat. Likas sa Filipino ang ''nagmanman'' para sa paggalugad at pagmamasid sa lupaing iniulat nila.'
- source_word: קָרְעוּ
  choice: pinunit
  rationale: Tuwirang ipinapahayag ang sadyang pagpunit; malinaw at pangkasalukuyang Filipino ito.
- source_word: בִּגְדֵיהֶם
  choice: ang kanilang mga damit
  rationale: Karaniwang makabagong salita ang 'damit' at sapat nitong ipinahihiwatig ang mga kasuotang pinunit nila.
