    issue: Napalitan ang estrukturang paghahambing ng “kung ano ... iyon” sa halip na “kung paanong ... gayon.”
    rationale: Ang כַּאֲשֶׁר ... כֵּן ay tahasang tumutugma sa paraan o nilalaman ng kanilang pagsasalita at sa gagawin ng Diyos. Ang rebisyon ay ibinabalik ang parallelismong ito.
  - severity: low
    issue: Ang “na narinig ko” ay hindi kasinglinaw ng “sa aking pandinig.”
    rationale: Bagaman magkaugnay ang kahulugan, ang “sa aking pandinig” ay mas tuwirang kumakatawan sa בְּאָזְנָי at pinananatili ang idyomatikong diin na personal na narinig ng Diyos ang kanilang sinabi.
  revised_text: Sabihin mo sa kanila, ‘Buhay ako—pahayag ng PANGINOON—tiyak na kung paanong nagsalita kayo sa aking pandinig, gayon ang gagawin ko sa inyo.’
