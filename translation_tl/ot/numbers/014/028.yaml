  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: tl
  text: Sabihin mo sa kanila, ‘Buhay ako—pahayag ng PANGINOON—tiyak na kung paanong nagsalita kayo sa aking pandinig, gayon ang gagawin ko sa inyo.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָ֨נִי֙
  choice: Buhay ako
  rationale: Pinananatili ang literal at taimtim na pormula ng panunumpa ng Diyos.
- source_word: נְאֻם יְהוָה
  choice: pahayag ng PANGINOON
  rationale: Natural at marangal na salin ng pormulang propetiko; ang PANGINOON ay kumakatawan sa banal na pangalang YHWH.
- source_word: אִם לֹא
  choice: tiyak na
  rationale: Sa konteksto ng panunumpang ‘Buhay ako,’ ang anyong ito ay nagsasaad ng mariing katiyakan, hindi karaniwang kondisyong ‘kung hindi.’
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם בְּאָזְנָי
  choice: kung ano ang sinabi ninyo na narinig ko
  rationale: Ipinahahayag sa natural na Tagalog ang Hebreong idyomang literal na ‘sinabi ninyo sa aking pandinig,’ habang pinananatili ang diin na personal itong narinig ng Diyos.
- source_word: כֵּן אֶעֱשֶׂה לָכֶם
  choice: iyon ang gagawin ko sa inyo
  rationale: Pinananatili ang pagtutugma ng sinabi ng bayan at ng gagawin sa kanila ng Diyos.
theological_decisions:
- issue: Ang puwersa ng אִם לֹא sa banal na panunumpa
  choice: tiyak na
  alternative: kung hindi
  rationale: Ang sugnay ay pormula ng mariing panunumpa. Ang literal na ‘kung hindi’ ay magiging malabo o hindi kumpleto sa modernong Tagalog.
- issue: Paglalahad sa tetragrammaton יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Sinusunod ang ibinigay na audited consultation layer at ang nakaugaliang tipograpikong pagkilala sa banal na pangalan, nang hindi nagdaragdag ng sektaryong pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang mga gatlang upang malinaw na maihiwalay ang pormulang ‘pahayag ng PANGINOON’ sa loob ng siniping pananalita.
