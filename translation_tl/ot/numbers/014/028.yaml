  source_fidelity: Ang draft ay wastong naghahatid ng panunumpang “Buhay ako,” ng pormulang “pahayag ng PANGINOON,” at ng mariing puwersa ng אִם־לֹא bilang katiyakan. Gayunman, ang “kung ano ang sinabi ninyo na narinig ko” ay bahagyang nagpapalabo sa paghahambing na כַּאֲשֶׁר ... כֵּן (“kung paanong ... gayon”) at ginagawang isang relatibong sugnay ang idyomang “sa aking pandinig.”
  naturalness: Nauunawaan ang draft, ngunit mas malinaw at mas natural sa modernong Tagalog ang magkatugmang hulma na “Kung paanong ... gayon ...”. Ang “sa aking pandinig” ay marangal ngunit naiintindihan at tapat na katumbas ng Hebreong idyoma.
  terminology: Ang “PANGINOON” para sa יהוה at “pahayag ng PANGINOON” para sa נְאֻם יְהוָה ay angkop at kaayon ng English POB audit trail. Ang “tiyak na” ay sapat na naghahatid ng mariing panunumpa nang hindi nagiging malabong kondisyon ang אִם־לֹא.
  issues:
