  register: Makabagong, malinaw, at marangal na Filipino. Pinanatili sa pangunahing teksto ang mas literal at nakaugaliang katawagang ‘mga anak ni Israel,’ at ibinigay sa talababa ang mas karaniwang ‘mga Israelita.’
