source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּֽתְאַבְּל֥וּ הָ/עָ֖ם מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: tl
  text: Sinabi ni Moises ang mga salitang ito sa lahat ng mga anak ni Israel[a], at labis na nagdalamhati ang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng Israelita”; ayon sa tradisyon, “sa lahat ng mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Sinabi
  rationale: Tuwirang inilalarawan nito ang pagsasalita ni Moises nang hindi nagdaragdag ng diwang gaya ng pagpapahayag o pagdedeklara.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Pinananatili nito ang pandiwang diwa ng דְּבָרִים sa konteksto ng paghahatid ni Moises ng naunang pahayag ng Diyos.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: sa lahat ng mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo ng nakaugaliang katawagan sa sambayanan, habang nananatiling malinaw sa Filipino; inilalahad sa talababa ang mas likas na alternatibong ‘lahat ng Israelita.’
- source_word: וַיִּתְאַבְּלוּ
  choice: nagdalamhati
  rationale: Ipinahihiwatig ng anyong Hitpael ng אבל ang pagpasok sa kalagayan ng pagluluksa o matinding dalamhati, na mas tiyak kaysa simpleng pagkalungkot.
- source_word: הָעָם
  choice: ang bayan
  rationale: Tinutukoy ng עָם ang sambayanan bilang isang kolektibong pangkat; ang ‘bayan’ ay natural at marangal na katumbas sa kontekstong ito.
- source_word: מְאֹד
  choice: labis
  rationale: Malinaw nitong pinatitindi ang pagdadalamhati at natural itong kaakibat ng pandiwang ‘nagdalamhati.’
theological_decisions: []
