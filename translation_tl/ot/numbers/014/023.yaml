translation:
  language: tl
  text: Tiyak na hindi[a] nila makikita ang lupaing ipinangako ko sa kanilang mga ama[b] sa pamamagitan ng panunumpa, at walang sinuman sa mga humamak sa akin ang makakakita nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na “kung makikita nila ang lupain.” Sa pormulang ito ng panunumpa, mariing negatibo ang kahulugan: tiyak na hindi nila makikita ang lupain.'
    reason: lexical_alternative
  - marker: b
    text: 'O, “kanilang mga ninuno.” Hebreo: “kanilang mga ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  choice: tiyak na hindi nila makikita
  rationale: Ang אִם sa pormulang ito ng panunumpa ay naghahayag ng mariing pagtanggi, hindi karaniwang pasubali. Likas sa modernong Tagalog ang “tiyak na hindi” at malinaw nitong naihahatid ang bigat ng hatol.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Tumutukoy ito sa lupaing ipinangako sa mga ninuno ng Israel. Pinananatili ng “lupa” ang karaniwang biblikal na katawagan nang hindi nagdaragdag ng salitang wala sa Hebreo.
- source_word: נִשְׁבַּעְתִּי
  choice: ipinangako ko ... sa pamamagitan ng panunumpa
  rationale: Ang pandiwa ay tahasang tumutukoy sa pagsumpa. Mas natural sa Tagalog ang pariralang ito kaysa “isinumpa ko sa,” na maaaring maling maunawaan bilang pagsumpa o pagkondena sa isang tao.
- source_word: לַאֲבֹתָם
  choice: sa kanilang mga ninuno
  rationale: Bagaman literal na “sa kanilang mga ama,” ang tinutukoy ay ang mga naunang ama ng bayan o mga ninuno. Ang “mga ninuno” ay malinaw at natural sa kasalukuyang Tagalog; inilalahad sa talababa ang literal na anyo.
- source_word: וְכָל ... לֹא
  choice: at walang sinuman ... ang
  rationale: Natural na inililipat sa Tagalog ang Hebreong “at lahat ... hindi” bilang “at walang sinuman,” habang pinananatili ang saklaw ng pagtanggi.
- source_word: מְנַאֲצַי
  choice: mga humamak sa akin
  rationale: Ang נאץ ay nagpapahiwatig ng paghamak o paglapastangan. Ang “humamak” ay tuwiran, marangal, at angkop sa konteksto ng paghihimagsik laban sa Diyos.
- source_word: לֹא יִרְאוּהָ
  choice: ang makakakita niyon
  rationale: Ang hulaping pambabae ay tumutukoy pabalik sa “lupa.” Ang “niyon” ay malinaw na panghalip sa Tagalog at pinananatili ang pag-uulit ng pandiwang “makakita.”
theological_decisions:
- issue: Lakas ng pambungad na pormula ng panunumpa
  choice: 'Isinalin bilang mariing pagtanggi: “tiyak na hindi nila makikita.”'
  alternative: Mas literal na “kung makikita nila ang lupa,” na iniiwang pahiwatig ang negatibong bisa ng panunumpa.
  rationale: Sa kontekstong Hebreo, ang אִם sa ganitong pormula ay isang pinaikling panunumpa na idiomatikong nangangahulugang tiyak na hindi mangyayari ang sinabi. Ang literal na pasubali sa Tagalog ay magiging malabo at maaaring magbigay ng maling diwa.
- issue: Paglalarawan sa אָבוֹת
  choice: “mga ninuno” sa pangunahing teksto, na may literal na anyong “mga ama” sa talababa.
  alternative: “kanilang mga ama” sa pangunahing teksto.
  rationale: Ang Hebreo ay literal na panlalaking “mga ama,” ngunit sa kontekstong tipan ay tumutukoy sa mga patriyarkal na ninuno. Naipahahayag ng “mga ninuno” ang tinutukoy nang natural, habang iniingatan ng talababa ang pormal na detalye ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Iniwasan ang “isinumpa ko sa kanilang mga ninuno” dahil maaari itong mapagkamalang pagkondena sa kanila; ginamit ang malinaw na “ipinangako ... sa pamamagitan ng panunumpa.”
