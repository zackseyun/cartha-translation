  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: tl
  text: Sapagkat ang lahat ng lalaking nakakita sa aking kaluwalhatian at sa aking mga tanda na ginawa ko sa Ehipto at sa ilang, at sumubok sa akin sa sampung pagkakataong ito, at hindi nakinig sa aking tinig[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi sumunod sa akin.” Ang idyomang Hebreo na “makinig sa aking tinig” ay maaari ring mangahulugang dinggin at sundin ang sinasabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng batayan para sa naunang panunumpa o hatol ng Diyos at likas ang daloy nito sa Filipino.
- source_word: כָל הָאֲנָשִׁים
  choice: ang lahat ng lalaking
  rationale: Tumutukoy ang אֲנָשִׁים sa mga lalaki sa salinlahing hinahatulan; pinananatili ang tiyak na kasarian ng sanggunian.
- source_word: הָרֹאִים
  choice: nakakita
  rationale: Inilalarawan ang mga lalaking personal nang nakasaksi sa mga gawa ng Diyos; sa Filipino, sapat ang aspektong perpektibo upang ipakita ang naganap na karanasang mahalaga pa rin sa hatol.
- source_word: כְּבֹדִי
  choice: aking kaluwalhatian
  rationale: Karaniwan at angkop na salin ng כָּבוֹד kapag tumutukoy sa nahayag na kadakilaan ng Diyos.
- source_word: אֹתֹתַי
  choice: aking mga tanda
  rationale: Pinananatili ng “mga tanda” ang katangiang nagpapahiwatig o nagpapatunay ng mga gawa, nang hindi agad nililimitahan sa “mga himala.”
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: na ginawa ko
  rationale: Tuwiran at natural na katumbas ng עשה, nang hindi nagdaragdag ng paraan o uri ng pagkilos.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: sa Ehipto at sa ilang
  rationale: Ang “ilang” ay maikli, dignificado, at nakaugat na salin ng מִדְבָּר sa salaysay ng Exodo.
- source_word: וַיְנַסּוּ אֹתִי
  choice: sumubok sa akin
  rationale: Inilalarawan ng נסה ang mapanghamong pagsubok sa Diyos; pinananatili ng salin ang tuwirang anyo ng Hebreo.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: nang sampung ulit na ito
  rationale: Pinananatili ng “na ito” ang deiktikong diin ng זֶה, bagaman bahagyang di-karaniwan ang ayos sa Filipino.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: at hindi nakinig sa aking tinig
  rationale: Pinananatili ang idyomang Hebreo at ang larawan ng pagtangging makinig, habang kinikilala sa talababa na maaari rin itong mangahulugang hindi pagsunod.
theological_decisions:
- issue: Unang panauhang pananalita ng Diyos
  choice: Pinanatili ang “aking kaluwalhatian,” “aking mga tanda,” at “aking tinig.”
  alternative: Palawakin ang mga parirala upang ipaliwanag ang pagpapahayag at awtoridad ng Diyos.
  rationale: Direktang nagsasalita ang Diyos sa talata; hindi kailangan ng dagdag na paliwanag na teolohikal na wala sa Hebreo.
- issue: Kasarian ng הָאֲנָשִׁים
  choice: lahat ng lalaking
  alternative: lahat ng tao
  rationale: Ang salita at konteksto ay tumutukoy sa mga lalaki ng salinlahing nasa ilalim ng hatol, kaya hindi ito ginawang neutral na kolektibo.
- issue: Kahulugan ng “makinig sa tinig”
  choice: hindi nakinig sa aking tinig
  alternative: hindi sumunod sa akin
  rationale: Pinananatili sa pangunahing teksto ang tunay na idyomang Hebreo at inilalahad sa talababa ang diwang pagsunod na maaari nitong taglayin.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinanatili ang “kaluwalhatian,” “mga tanda,” at “ilang” bilang pamilyar na bokabularyong biblikal, ngunit iniwasan ang labis na arkaikong ayos. Ang em dash sa dulo ay nagpapakitang nagpapatuloy ang pangungusap sa kasunod na talata.
