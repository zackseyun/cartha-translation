source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: tl
  text: Si Yahweh ay hindi madaling magalit at sagana sa tapat na pag-ibig[a]. Pinatatawad niya ang kasamaan at paghihimagsik[b], ngunit hinding-hindi niya pawawalang-sala ang may sala[c]. Pinananagot niya ang mga anak dahil sa kasamaan ng kanilang mga ama, sa ikatlo at sa ikaapat na salinlahi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dakila sa katapatan sa tipan,” “mayaman sa awa,” o “nag-uumapaw sa wagas na pagmamahal.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na isinaling “pinatatawad” ay literal na “pumapasan” o “nagdadala” ng kasamaan at paghihimagsik.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tiyak na hindi niya hahayaang hindi maparusahan” o “hindi niya aariing walang sala.”
    reason: lexical_alternative
  - marker: d
    text: Ang literal na “sa ikatlo at sa ikaapat” sa Hebreo ay tumutukoy sa mga salinlahi.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶרֶךְ אַפַּיִם
  choice: hindi madaling magalit
  rationale: Natural na katumbas sa modernong Tagalog ng Hebreong idyomang literal na tumutukoy sa pagiging “mahaba ang mga butas ng ilong,” ibig sabihin ay mabagal magalit.
- source_word: רַב חֶסֶד
  choice: sagana sa tapat na pag-ibig
  rationale: Ipinahahayag ng חֶסֶד ang matatag na pag-ibig, awa, at katapatan sa tipan; pinananatili ng “tapat na pag-ibig” ang ugnayang-diwa nito, at isinasalin ng “sagana” ang רַב.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: pinatatawad ang kasamaan at paghihimagsik
  rationale: Sa ganitong pormula, ang נֹשֵׂא ay may diwang pagpapatawad o pag-aalis ng sala. Pinananatiling magkahiwalay ang עָוֺן at פָשַׁע sa pamamagitan ng “kasamaan” at “paghihimagsik.”
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: ngunit hinding-hindi niya pawawalang-sala ang may sala
  rationale: Ang magkaugnay na anyo ng pandiwa ay mariing pagtanggi. Idinagdag ang likas na ipinahihiwatig na layon na “ang may sala” upang maging malinaw at natural sa Tagalog nang hindi binabago ang hudisyal na diwa.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: pinananagot niya ang mga anak dahil sa kasamaan ng kanilang mga ama
  rationale: Ipinahahayag ng פקד dito ang pagharap o pagpapataw ng pananagutan. Ang salin ay natural sa Tagalog habang pinananatili ang mahirap na pormula tungkol sa kasalanan ng mga ama at mga anak.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: hanggang sa ikatlo at ikaapat na salinlahi
  rationale: Elliptical sa Hebreo ang pagtukoy sa mga salinlahi; hayagang binanggit ang “salinlahi” para sa kalinawan.
theological_decisions:
- issue: Kapatawaran ng Diyos at paghatol sa nagkasala
  choice: Panatilihin kapwa ang pagpapatawad at ang mariing hindi pagpapawalang-sala sa may sala.
  alternative: Palambutin ang ikalawang sugnay bilang pangkaraniwang bunga lamang ng kasalanan.
  rationale: Magkatabing inilalahad ng Hebreo ang awa at katarungan ng Diyos; hindi dapat alisin o ipaliwanag palayo ang tensiyong ito.
- issue: Pananagutan sa magkakasunod na salinlahi
  choice: Panatilihin ang pahayag na pinananagot ang mga anak dahil sa kasamaan ng kanilang mga ama hanggang sa ikatlo at ikaapat na salinlahi.
  alternative: Ipaliwanag ito bilang likas na epekto lamang sa mga inapo o iayon agad sa mga teksto tungkol sa indibidwal na pananagutan.
  rationale: Hindi nililinaw ng talata rito ang mekanismo o mga kondisyon ng paghatol, kaya hindi iyon dapat ipasok sa pangunahing salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “hindi madaling magalit” bilang natural na idyoma, “tapat na pag-ibig” para sa mayamang diwa ng חֶסֶד, at “salinlahi” para sa pormal ngunit madaling maunawaang pagtukoy sa mga henerasyon. Pinanatili ang personal na pangalang Yahweh at ang teolohikal na tensiyon ng awa at paghatol.
