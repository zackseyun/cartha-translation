  text: וַ/יֵּ֤רֶד הָ/עֲמָלֵקִי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/הָ֣ר הַ/ה֑וּא וַ/יַּכּ֥וּ/ם וַֽ/יַּכְּת֖וּ/ם עַד הַֽ/חָרְמָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: tl
  text: Pagkatapos, bumaba ang mga Amalekita at ang mga Cananeong naninirahan sa kaburulang iyon. Sinalakay nila ang mga Israelita at nilupig sila hanggang sa Horma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Horma ay pangalan ng isang lugar. Ang pangalang Hebreo nito ay kaugnay ng salitang nangangahulugang “pagwasak” o “pagtatalaga sa ganap na pagwasak.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Pinananatili ang direksiyon ng kilos mula sa kaburulan. Ang pandiwang isahan bago ang tambalang simuno ay likas sa Hebreo; maramihan ang diwa ng mga pangkat na kasunod.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: ang mga Amalekita at ang mga Cananeo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang dalawang katawagang etniko at tumutukoy sa mga pangkat ng mandirigma.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: na naninirahan sa kaburulang iyon
  rationale: Ang יֹשֵׁב ay tumutukoy sa paninirahan, at ang הָר dito ay pinakamainam unawain bilang bulubundukin o mataas na rehiyon, kaya natural ang “kaburulan” sa Filipino.
- source_word: וַיַּכּוּם
  choice: sinalakay nila ang mga Israelita
  rationale: Ang נכה ay maaaring mangahulugang hampasin, salakayin, o talunin. Ang “sinalakay” ay natural sa salaysay ng digmaan at hindi inuulit ang mas matinding resulta sa kasunod na pandiwa. Nilinaw ang tinutukoy ng hulaping panghalip bilang “mga Israelita” upang maiwasan ang malabong “sila” sa Filipino.
- source_word: וַיַּכְּתוּם
  choice: at nilupig sila
  rationale: Ipinahihiwatig ng pandiwa ang matinding pagdurog o paggapi. Ang “nilupig” ay dignificado at malinaw sa kontekstong militar nang hindi nagsasabing lubos silang nilipol.
- source_word: עַד הַחָרְמָה
  choice: hanggang sa Horma
  rationale: Ipinapahayag ng עַד ang hangganan o lawak ng paggapi, samantalang pinananatiling pangalan ng lugar ang Horma.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang daloy at maiwasan ang mabigat na sunuran ng mga sugnay. Ginamit ang “Cananeo,” ang karaniwang anyong Filipino, at “kaburulan” para sa rehiyong mataas ang lupa.
