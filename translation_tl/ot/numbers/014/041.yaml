  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: tl
  text: Ngunit sinabi ni Moises, “Bakit ninyo nilalabag ang utos ni Yahweh?[a][b] Hindi ito magtatagumpay.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang bibig ni Yahweh,” isang idyoma para sa sinabi o iniutos ni Yahweh.
    reason: lexical_alternative
  - marker: b
    text: O “ang salita ni Yahweh.”
    reason: alternative_reading
  - marker: c
    text: O “Hindi ito uunlad.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi ni Moises
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, ngunit ang tugon ni Moises ay sumasalungat sa balak ng bayan; kaya natural sa konteksto ang “Ngunit.”
- source_word: לָמָה זֶּה
  choice: Bakit
  rationale: May bahagyang diin ang pariralang Hebreo, ngunit ang payak na “Bakit” ang pinakanatural sa modernong Tagalog; ang diin ay malinaw na naihahatid ng mismong pagsaway.
- source_word: אַתֶּם עֹבְרִים
  choice: ninyo nilalabag
  rationale: Ang עבר na may layon na פִּי יְהוָה ay idyomatikong tumutukoy sa pagsuway o paglabag, hindi sa literal na pagtawid.
- source_word: אֶת פִּי יְהוָה
  choice: ang utos ni Yahweh
  rationale: Literal itong “ang bibig ni Yahweh,” isang Hebreong idyoma para sa sinabi o iniutos niya. Sa kontekstong ito, “utos” ang malinaw at natural na katumbas.
- source_word: וְהִוא
  choice: ito
  rationale: Malamang na tumutukoy ang pambabaeng panghalip sa balak o pagsalakay na ipinahihiwatig ng konteksto; natural itong isalin sa Tagalog bilang “ito.”
- source_word: לֹא תִצְלָח
  choice: Hindi ito magtatagumpay
  rationale: Ang צלח ay tumutukoy sa pagtatagumpay o pag-unlad ng isang gawain. Ang “magtatagumpay” ay malinaw sa konteksto ng balak nilang pagsalakay.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Tinutukoy ng וְהִוא sa babala
  choice: Ang balak o pagsalakay ay hindi magtatagumpay
  alternative: Hindi kayo magtatagumpay
  rationale: Pinananatili ng “ito” ang hindi tahasang tinukoy na pambabaeng reperente sa Hebreo, sa halip na tahasang gawing ang mga tao mismo ang simuno.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nilalabag” upang maipahayag ang moral na bigat ng pagsuway, at iniwasan ang artipisyal na katumbas ng idyomang לָמָה זֶּה. Inilagay ang mga panandang talababa kaagad sa kaugnay na salita o pangungusap.
