base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: tl
  text: Ngunit sinabi ni Moises kay Yahweh, “Kung magkagayon, maririnig ito ng mga Ehipsiyo, sapagkat sa pamamagitan ng iyong kapangyarihan ay iniahon mo ang bayang ito mula sa gitna nila.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “At narinig na ng mga Ehipsiyo na sa pamamagitan ng iyong kapangyarihan ay iniahon mo ang bayang ito mula sa gitna nila.” Maaaring unawain ang anyong pandiwa sa Hebreo bilang nakaraan o bilang panghinaharap/bunga sa pakiusap ni Moises; pinili sa pangunahing teksto ang diwang nakatuon sa magiging resulta dahil umaangkop ito sa daloy ng argumento.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit sa konteksto ay tumututol ang pakiusap ni Moises sa ipinahayag na paghatol ni Yahweh; kaya likas at angkop ang ‘Ngunit sinabi.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וְשָׁמְעוּ מִצְרַיִם
  choice: Kung magkagayon, maririnig ito ng mga Ehipsiyo
  rationale: Maaaring unawain ang anyong pandiwa bilang panghinaharap o bunga sa pakiusap ni Moises. Ipinahihiwatig ng konteksto ang magiging resulta kapag nilipol ang Israel. Idinagdag ang ‘ito’ bilang likas na layon sa Filipino nang hindi tinutukoy nang higit sa ipinahihiwatig ng teksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ang paliwanag o batayan ng magiging pagkarinig ng mga Ehipsiyo.
- source_word: הֶעֱלִיתָ
  choice: iniahon mo
  rationale: Ang Hiphil ng עלה ay literal na ‘magpaahon’ o ‘mag-ahon.’ Ang ‘iniahon’ ay natural sa Filipino at pinananatili ang kilos na pataas, bagaman sa konteksto ay tumutukoy ito sa pagliligtas mula sa Ehipto.
- source_word: בְכֹחֲךָ
  choice: sa pamamagitan ng iyong kapangyarihan
  rationale: Ipinapahayag ng ב ang paraan o kasangkapan; malinaw na itinatampok ng salin ang kapangyarihan ni Yahweh bilang paraan ng pag-ahon.
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang עַם ay pangngalang kolektibo para sa isang bayan o sambayanan. Ang ‘bayang ito’ ay maikli, natural, at hindi kinakailangang may makabagong pampolitikang diin.
- source_word: מִקִּרְבּוֹ
  choice: mula sa gitna nila
  rationale: Ang hulaping isahan ay tumutukoy sa Ehipto bilang kolektibong entidad. Sa natural na Filipino, ang ‘nila’ ay tumutukoy sa mga Ehipsiyo na binanggit sa pangungusap.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Panahunan at lohikal na bisa ng וְשָׁמְעוּ
  choice: 'panghinaharap/bunga: “Kung magkagayon, maririnig”'
  alternative: 'nakaraan: “Narinig na”'
  rationale: 'Kapwa posible sa anyong Hebreo, ngunit mas umaayon sa nagpapatuloy na argumento sa kasunod na talata ang prospektibong pagbasa: ang gagawin ni Yahweh ay malalaman at bibigyang-kahulugan ng ibang mga bansa. Pinananatili sa talababa ang tunay na alternatibo.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘Kung magkagayon’ upang likas na ipahayag ang ipinahihiwatig na bunga, at ‘iniahon’ upang mapanatili ang larawang leksikal ng Hebreong עלה.
