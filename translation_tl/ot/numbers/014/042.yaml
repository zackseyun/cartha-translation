  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: tl
  text: Huwag kayong umakyat, sapagkat wala si Yahweh sa gitna ninyo; baka kayo mapabagsak sa harap ng inyong mga kaaway.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: Huwag kayong umahon
  rationale: Ang אַל kasama ng imperfect ay pagbabawal, at ang עלה ay literal na “umahon.” Ang “umahon” ay natural sa kontekstong heograpiko at militar at pinananatili ang larawan ng Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabawal; ang “sapagkat” ay malinaw at marangal sa modernong Tagalog.
- source_word: אֵין יְהוָה בְּקִרְבְּכֶם
  choice: wala sa gitna ninyo si Yahweh
  rationale: Pinananatili ng “sa gitna ninyo” ang kongkretong diwa ng בְּקֶרֶב, samantalang ang “Yahweh” ay tuwirang kumakatawan sa banal na pangalang יְהוָה.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: kung hindi'y malulupig kayo
  rationale: Sa babalang ito, ang pormal na “at hindi” ay nagpapahayag ng masamang kahihinatnang dapat iwasan. Ang Niphal ng נגף ay maaaring mangahulugang matalo o mapabagsak sa labanan; “malulupig” ang natural na katumbas sa konteksto.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: sa harap ng inyong mga kaaway
  rationale: Tuwirang pinananatili ang karaniwang idyomang panlaban na “sa harap ng” at ang maramihang “mga kaaway.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalang pantangi ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Diwa ng presensiya sa בְּקִרְבְּכֶם
  choice: wala sa gitna ninyo si Yahweh
  alternative: hindi ninyo kasama si Yahweh
  rationale: Ang “sa gitna ninyo” ay mas malapit sa spatial at pangkomunidad na diwa ng Hebreo at hindi dinaragdagan ang teolohikal na pahayag.
- issue: Saklaw ng תִּנָּגְפוּ
  choice: malulupig kayo
  alternative: mapapabagsak kayo
  rationale: Parehong posible ang pagkatalo at pagkabuwal dahil sa pandiwa. Pinili ang “malulupig” dahil malinaw na labanan ang konteksto, nang hindi ipinapalagay na lahat ay tiyak na papatayin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay ng digmaan. Ginamit ang “umahon” upang mapanatili ang heograpikong larawan at “sa gitna ninyo” upang mapanatili ang kongkretong pahayag tungkol sa presensiya.
