  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: tl
  text: At kung papatayin mo ang bayang ito na parang iisang tao[a], sasabihin ng mga bansang nakarinig ng balita tungkol sa iyo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “parang iisang lalaki,” isang idyomang nangangahulugang ang buong bayan nang sama-sama o sabay-sabay.
    reason: lexical_alternative
  - marker: b
