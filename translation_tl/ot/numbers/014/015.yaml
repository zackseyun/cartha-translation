  source_fidelity: Tapat ang salin sa Hebreo. Ang “At kung papatayin mo” ay wastong kondisyunal na paglalapat ng waw sa nagpapatuloy na pananalita ni Moises; ang “bayang ito,” “mga bansa,” at “sasabihin” ay tuwirang tumutugon sa mga pangunahing anyo ng teksto. Ang “na parang iisang tao” ay angkop na pagpapanatili ng idyomang כְּאִישׁ אֶחָד nang hindi ipinapakahulugan nang labis. Ang “balita tungkol sa iyo” ay maingat na salin ng שִׁמְעֲךָ at pinananatili ang saklaw na ulat/balita/kabantugan.
