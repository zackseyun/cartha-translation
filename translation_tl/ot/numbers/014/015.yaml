    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: At kung papatayin mo
  rationale: Ang Hiphil ng מות ay nangangahulugang “pumatay” o “magpangyaring mamatay.” Bagaman waw lamang ang tahasang pang-ugnay, ipinahihiwatig ng nagpapatuloy na pakiusap ni Moises ang kondisyong “kung.”
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Tumutukoy ang עָם sa Israel bilang isang kabuuang sambayanan. Natural sa modernong Filipino ang “bayang ito” at pinananatili nito ang demonstratibong diin.
- source_word: כְּאִישׁ אֶחָד
  choice: na parang iisang tao
  rationale: Pinananatili nito ang anyong-larawan ng Hebreong idyoma habang nauunawaan sa Filipino bilang pagpatay sa buong bayan nang sama-sama o minsanan.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Ang גּוֹיִם ay mga bansang kaiba sa Israel; hindi kailangan dito ang terminong “mga Hentil,” na maaaring magdala ng mas huling konotasyon.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: na nakarinig ng balita tungkol sa iyo
  rationale: Maaaring mangahulugan ang שֵׁמַע ng balita, ulat, o kabantugan. Ang “balita tungkol sa iyo” ay natural at pinananatili ang kalabuan kung ang diin ay nasa ulat tungkol sa Diyos o sa kaniyang katanyagan.
- source_word: לֵאמֹר
  choice: sasabihin
  rationale: Ipinakikilala ng infinitive ang nilalaman ng sasabihin ng mga bansa sa kasunod na talata; natural itong gawing finite verb sa Filipino.
theological_decisions:
- issue: Idyomang antropolohikal na gumagamit ng panlalaking pangngalan
  choice: na parang iisang tao
  alternative: nang sabay-sabay silang lahat
  rationale: Idyomatiko ang אִישׁ אֶחָד at hindi pagtuturo tungkol sa kasarian. Pinananatili ng “iisang tao” ang larawan at retorikal na puwersa nang hindi gumagamit ng eksklusibong panlalaking “lalaki.”
- issue: Kahulugan ng שִׁמְעֲךָ
  choice: balita tungkol sa iyo
  alternative: iyong kabantugan
  rationale: Saklaw ng salita ang ulat, balita, at kabantugan. Pinananatili ng napiling salin ang tunay na leksikal na lawak at iniiwasang gawing tiyak na “kabantugan” lamang ang diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong Israel at ang “mga bansa” para sa mga bansang nakapaligid dito. Ang pangungusap ay sadyang nagtatapos sa kuwit dahil nagpapatuloy sa susunod na talata ang mismong sasabihin ng mga bansa.
