revisions:
- from: Ayon sa bilang ng mga araw na tiniktikan ninyo ang lupain—apatnapung araw, isang araw para sa isang taon, isang araw para sa isang taon—papasanin ninyo ang inyong mga kasalanan sa loob ng apatnapung taon, at malalaman ninyo ang aking pagsalungat.[a]
  to: Ayon sa bilang ng mga araw na ginugol ninyo sa paniniktik sa lupain—apatnapung araw—isang araw para sa isang taon, isang araw para sa isang taon, papasanin ninyo ang inyong mga kasalanan sa loob ng apatnapung taon, at makikilala ninyo ang aking pagsalungat.[a]
  rationale: Nilinaw ang sintaks upang ang bilang ng mga araw ay tahasang maiugnay sa paniniktik sa lupain, at pinakinis ang huling sugnay para sa likas na Filipino. Iningatan ang pag-uulit, ang metapora ng pagpasan, ang tagal ng hatol, at ang leksikal na kalabuan ng תְּנוּאָתִי.
