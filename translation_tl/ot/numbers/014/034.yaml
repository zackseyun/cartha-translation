base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: tl
  text: Ayon sa bilang ng mga araw na ginugol ninyo sa paniniktik sa lupain—apatnapung araw—isang araw para sa isang taon, isang araw para sa isang taon, papasanin ninyo ang inyong mga kasalanan sa loob ng apatnapung taon, at makikilala ninyo ang aking pagsalungat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking paglayo,” “aking pagkapoot,” o “aking matinding di-pagsang-ayon.” Sa ilang tradisyonal na salin, “aking paglabag sa pangako.” Gayunman, malamang na tumutukoy ang bihirang salitang Hebreo sa pagsalungat o paglayo ng PANGINOON sa mapaghimagsik na salinlahing ito, sa halip na sa pagkabigo niyang tuparin ang kanyang pangako.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: Ayon sa bilang ng mga araw
  rationale: Ipinapanatili nito ang pagtutumbas ng bilang ng mga araw ng pagmamanman at ng mga taon ng kaparusahan.
- source_word: תַּרְתֶּם
  choice: tiniktikan ninyo
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa misyong paniniktik o pagmamanman sa Canaan; mas tiyak ang “tiniktikan” kaysa sa neutral na “ginalugad.”
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Natural itong tumutukoy sa lupaing ipinangako nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: isang araw para sa isang taon, isang araw para sa isang taon
  rationale: Pinananatili ang madiing pag-uulit sa Hebreo at ang tuwirang pagtutumbas ng araw at taon.
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  choice: papasanin ninyo ang inyong mga kasalanan
  rationale: Pinananatili ng “papasanin” ang konkretong larawan ng נשא, samantalang ang “mga kasalanan” ay likas sa Filipino at maaaring saklawin ang pagkakasala at kaakibat nitong pananagutan.
- source_word: וִידַעְתֶּם
  choice: at malalaman ninyo
  rationale: Pinananatili ang malawak na kahulugan ng ידע, na maaaring tumukoy kapwa sa pagkaalam at sa pagkabatid sa pamamagitan ng karanasan.
- source_word: תְּנוּאָתִי
  choice: ang aking pagsalungat
  rationale: Ang bihirang pangngalan ay maaaring magpahiwatig ng pagsalungat, paglayo, o matinding di-pagsang-ayon. Ang “pagsalungat” ay angkop sa konteksto ng hatol at hindi nagpapahiwatig na hindi tinupad ng Diyos ang pangako niya.
theological_decisions:
- issue: Kahulugan ng bihirang salitang תְּנוּאָתִי
  choice: ang aking pagsalungat
  alternative: ang aking paglayo; ang aking poot; ang aking matinding di-pagsang-ayon; ang hindi ko pagtupad sa pangako
  rationale: Pinananatili ng “pagsalungat” ang bigat ng hatol ng Diyos laban sa mapaghimagsik na salinlahi. Inilalahad sa talababa ang tunay na leksikal na kalabuan, habang iniiwasan ang saling maaaring maling magpahiwatig na naging di-tapat ang Diyos sa kanyang pangako.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang madiing pag-uulit na “isang araw para sa isang taon” at ang metapora ng pagpasan. Ginamit ang “tiniktikan” para sa tiyak na konteksto ng pagmamanman sa lupain; ipinaliwanag sa talababa ang pambihira at malabong huling salita.
