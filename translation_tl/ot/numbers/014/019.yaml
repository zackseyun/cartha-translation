  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: tl
  text: Patawarin mo sana ang kasalanan ng bayang ito ayon sa kadakilaan ng iyong tapat na pag-ibig, kung paanong dinala mo ang bayang ito mula sa Ehipto hanggang ngayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinatawad mo ang bayang ito mula sa Ehipto hanggang ngayon.” Ang pandiwang Hebreo ay maaaring mangahulugang “magdala” o “pumasan” at, sa ilang konteksto, “magpatawad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: Patawarin mo sana
  rationale: Ang pautos na סלח kasama ng נָא ay isang taimtim na pakiusap. Likas sa modernong Tagalog ang “Patawarin mo sana” at pinananatili nito ang lakas ng pakiusap.
- source_word: לַעֲוֺן
  choice: ang kasalanan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, pagkakasala, pananagutan, o bunga nito. Sa kontekstong ito, ang “kasalanan” ang malinaw at natural na tawag sa pagkakasalang hinihiling na patawarin nang hindi labis na nililimitahan ang saklaw ng salita.
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang עַם ay pangngalang kolektibo para sa isang sambayanan. Pinananatili ng “bayang ito” ang kolektibong diwa at ang pagkakakilanlan ng Israel bilang isang bayan.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: ayon sa kadakilaan ng iyong tapat na pag-ibig
  rationale: Tuwirang ipinahahayag ng “kadakilaan” ang גֹּדֶל, samantalang ang “tapat na pag-ibig” ay angkop sa חֶסֶד, na may diwa ng matatag na katapatan, awa, at pag-ibig sa loob ng ugnayan.
- source_word: וְכַאֲשֶׁר
  choice: kung paanong
  rationale: Ipinakikilala nito ang paghahambing sa naunang pakikitungo ng Diyos sa bayan; natural sa Tagalog ang “kung paanong” para sa gayong paghahambing.
- source_word: נָשָׂאתָה
  choice: pinasan mo
  rationale: Ang נשא ay pangunahing nangangahulugang magbuhat, magdala, o pumasan, at maaari ring mangahulugang magpatawad sa ilang konteksto. Dahil ang tuwirang layon dito ay ang bayan, pinananatili ng “pinasan mo” ang talinghaga ng matiyagang pagdadala at hindi tahimik na nilulutas ang leksikal na kalabuan.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: mula sa Ehipto hanggang ngayon
  rationale: Likas nitong ipinahahayag sa Tagalog ang nagpapatuloy na pakikitungo ng Diyos mula sa paglabas sa Ehipto hanggang sa kasalukuyang sandali.
theological_decisions:
- issue: Kahulugan ng נָשָׂאתָה sa pakiusap ni Moises
  choice: Inilarawan ang naunang ginawa ng Diyos bilang pagpasan o pagdadala sa bayan, na nagpapahiwatig ng matiyagang pagtitiis at pagkalinga.
  alternative: “Pinatawad mo ang bayang ito,” na inuunawa ang pandiwa sa diwang pagpapatawad.
  rationale: Bayan mismo, hindi ang kasalanan nito, ang tuwirang layon ng pandiwa. Kaya pinananatili ng “pinasan” ang kongkretong talinghaga at ang teolohikal na tensiyon, habang kinikilala sa talababa na posible rin ang diwang “pinatawad.”
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ang himig. Ginamit ang “sana” upang ihatid ang taimtim na pakiusap, “bayang ito” para sa kolektibong sambayanan, at “tapat na pag-ibig” para sa mayamang diwa ng חֶסֶד. Inilagay ang talababa sa mismong sugnay na may malabong pandiwa.
