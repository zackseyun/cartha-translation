revisions:
- from: Patawarin mo sana ang kasalanan ng bayang ito ayon sa kadakilaan ng iyong tapat na pag-ibig, kung paanong pinasan mo ang bayang ito mula sa Ehipto hanggang ngayon.[a]
  to: Patawarin mo sana ang kasalanan ng bayang ito ayon sa kadakilaan ng iyong tapat na pag-ibig, kung paanong dinala mo ang bayang ito mula sa Ehipto hanggang ngayon.[a]
  rationale: Pinalitan ang “pinasan mo” ng “dinala mo” upang maging likas ang Tagalog habang pinananatili ang konkretong talinghaga ng Hebreong נשא at ang bukas na ugnayan nito sa pagpapatawad. Inayos din ang talababa upang maipakita nito ang buong alternatibong pagbasa ng sugnay.
