  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: tl
  text: Namatay sa salot sa harap ni Yahweh ang mga lalaking iyon na naglabas ng masamang ulat tungkol sa lupain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: Namatay
  rationale: Ang Qal wayyiqtol ng מות ay tuwirang nagsasaad ng pangyayaring naganap. Hindi na isinalin nang hiwalay ang וַ upang maging natural ang salaysay sa Tagalog.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaking iyon
  rationale: Ang tiyak na pangmaramihang anyo ay tumutukoy pabalik sa mga lalaking nabanggit na sa konteksto; malinaw itong naipapahayag ng “mga lalaking iyon.”
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: na naglabas ng masamang ulat tungkol sa lupain
  rationale: Ang participial na parirala ay naglalarawan sa mga lalaki ayon sa ginawa nila noon. Pinananatili ng “naglabas” ang larawan ng הוציא, samantalang ipinahihiwatig ng “masamang ulat” ang negatibo at mapanirang diwa ng דִבָּה nang hindi dinaragdagan ang teksto.
- source_word: רָעָה
  choice: masamang
  rationale: Dito ay inilalarawan ng רָעָה ang ulat bilang nakapipinsala at masama; ang “masamang ulat” ay natural at malinaw sa modernong Tagalog.
- source_word: בַּמַּגֵּפָה
  choice: sa salot
  rationale: Ang מַגֵּפָה ay isang salot o nakamamatay na hagupit. Sa Tagalog, ang “namatay sa salot” ay likas na nagpapahayag ng sanhi o paraan ng kanilang pagkamatay.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang pinananatili nito ang diwa ng presensiya sa harap ni Yahweh at ang tahasang paggamit ng banal na pangalan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang pangalang tipan sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang ayos na panaguri muna upang maging natural, habang pinananatili ang solemneng pahayag ng paghatol.
