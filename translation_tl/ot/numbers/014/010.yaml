  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: tl
  text: Ngunit sinabi ng buong kapulungan na batuhin sila ng mga bato. At ang kaluwalhatian ni Yahweh ay nagpakita sa Tolda ng Pagtitipon sa lahat ng anak ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas natural: “sa lahat ng Israelita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanan ng Israel. Ang “buong kapulungan” ay likas sa modernong Filipino at pinananatili ang kolektibo at pormal na diwa.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: batuhin sila
  rationale: Tuwirang ipinapahayag ng רגם ang pagbato. Sa Filipino, likas nang ipinahihiwatig ng “batuhin” ang paggamit ng mga bato, kaya hindi na inuulit ang “ng mga bato”; hindi rin idinagdag ang “hanggang mamatay,” sapagkat hindi iyon tahasang nakasaad.
- source_word: אֹתָם
  choice: sila
  rationale: Pinananatili ang panghalip na tumutukoy kina Josue at Caleb sa naunang konteksto, sa halip na palitan ito ng kanilang mga pangalan.
- source_word: כְבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Ang כָּבוֹד dito ay ang nakikitang pagpapahayag ng maringal na presensiya ni Yahweh. Malinaw at tuwiran ang “kaluwalhatian” sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: נִרְאָה
  choice: nagpakita
  rationale: Ang Niphal ng ראה sa kontekstong ito ay nagpapahayag ng nakikitang pagpapamalas; natural na katumbas sa Filipino ang “nagpakita.”
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Tolda ng Pagtitipon
  rationale: Tuwirang inilalarawan ng parirala ang itinalagang tolda ng pakikipagtagpo o pagtitipon. Pinananatili ng salin ang larawan ng tolda at ang kahulugan ng מוֹעֵד nang hindi ipinapasok ang salitang “tipan,” na wala sa parirala.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: sa lahat ng anak ng Israel
  rationale: Pinananatili nito ang anyong “mga anak ng Israel” ng Hebreo bilang pambansang katawagan, habang inilalagay sa talababa ang mas idyomatikong “lahat ng Israelita.”
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Pambansang katawagang בְּנֵי יִשְׂרָאֵל
  choice: lahat ng anak ng Israel
  alternative: lahat ng Israelita
  rationale: Literal na “mga anak ng Israel” ang nakapirming pambansang katawagan sa Hebreo. Pinanatili ito sa pangunahing teksto, ngunit ibinigay ang likas na katumbas sa Filipino sa talababa.
- issue: Ang kaluwalhatian bilang nakikitang pagpapamalas
  choice: nagpakita ang kaluwalhatian ni Yahweh
  alternative: nakita ang kaluwalhatian ni Yahweh
  rationale: Maaaring katawanin ng Niphal ang pagiging nakikita, ngunit sa konteksto ng pagpapamalas ng Diyos, ang “nagpakita” ay natural at hindi nagpapasya kung ano ang eksaktong anyo ng kaluwalhatian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” at “Tolda ng Pagtitipon” bilang pormal ngunit madaling maunawaang mga katawagan. Iniwasan ang di-likas na pag-uulit na “batuhin ng mga bato” at hindi idinagdag ang “hanggang mamatay,” na ipinahihiwatig lamang ng konteksto.
