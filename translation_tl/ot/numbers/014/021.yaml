  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: tl
  text: Ngunit, kung paanong ako’y buháy, mapupuno ng kaluwalhatian ni Yahweh ang buong daigdig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang buong lupain.” Maaaring mangahulugan ang Hebreong אֶרֶץ ng “daigdig” o “lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Ngunit
  rationale: Ipinahahayag nito ang matinding pagsalungat at pagbibigay-diin kaugnay ng naunang pahayag, sa natural at marangal na modernong Filipino.
- source_word: חַי אָ֑נִי
  choice: kasintiyak na buháy ako
  rationale: Isinasalin nito bilang panunumpang nakabatay sa sariling buhay ng nagsasalita, sa halip na bilang simpleng pahayag lamang na siya ay buhay. Iniiwasan din nito ang “habang ako'y buháy,” na maaaring maling maunawaan bilang pagtatakda ng panahon.
- source_word: וְיִמָּלֵא
  choice: pupunuin
  rationale: Ipinahahayag ng pandiwa ang tiyak na paglaganap ng kaluwalhatian sa kabuuang saklaw na tinutukoy. Ang aktibong ayos ay malinaw at natural sa Filipino, at kaayon ng ugnayan ng “kaluwalhatian” at “buong daigdig” sa talata.
- source_word: כְבוֹד
  choice: kaluwalhatian
  rationale: Ito ang karaniwan at angkop na salin ng כָּבוֹד kapag tumutukoy sa banal na presensiya, kadakilaan, at karangalan ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan nito ang personal na pangalang יהוה sa tekstong Hebreo at kaayon ng anyo sa konsultasyong POB.
- source_word: אֶת כָּל הָאָרֶץ
  choice: ang buong daigdig
  rationale: Ipinapakita ng “daigdig” ang malawak o pansansinukob na saklaw na higit na malamang sa konteksto, habang itinatala sa talababa ang tunay na posibilidad na “buong lupain” ang ibig sabihin ng אֶרֶץ.
theological_decisions:
- issue: Saklaw ng הָאָרֶץ
  choice: pansansinukob na saklaw (“buong daigdig”)
  alternative: lokal o panrehiyong saklaw (“buong lupain”)
  rationale: Ang taimtim na panunumpa at ang pahayag tungkol sa kaluwalhatian ni Yahweh ay pumapabor sa mas malawak na saklaw. Gayunman, maaaring mangahulugan ang אֶרֶץ ng “lupain,” kaya pinananatili sa talababa ang leksikal at teolohikal na tensiyon.
- issue: Lakas ng חַי אָ֑נִי bilang panunumpa
  choice: “kasintiyak na buháy ako”
  alternative: literal na “buháy ako” o temporal na “habang ako'y buháy”
  rationale: Ang parirala ay pormula ng banal na panunumpa. Ang napiling salin ay nagpapanatili sa katiyakan at solemnidad nito nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “buháy” upang linawin ang bigkas at ang “kasintiyak” upang likas na maipahayag ang pormula ng panunumpa. Inilagay ang talababa sa “daigdig,” kung saan aktuwal na umiiral ang leksikal na alternatibo.
