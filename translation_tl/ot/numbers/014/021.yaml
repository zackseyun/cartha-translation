    issue: Ang ‘pupunuin ng kaluwalhatian ni Yahweh ang buong daigdig’ ay aktibong ayos na hindi pinakamalapit sa Niphal na וְיִמָּלֵא.
    rationale: Sa konstruksyong Hebreo, ang ‘buong daigdig’ ang siyang mapupuno ng kaluwalhatian ni Yahweh. Ang ‘mapupuno ng’ ay mas tapat sa diatesis at mas malinaw sa Filipino.
  - severity: low
    issue: Medyo hindi likas ang ‘kasintiyak na buháy ako’ bilang pormula ng panunumpa.
    rationale: Ang ‘kung paanong ako’y buháy’ ay isang mas natural at marangal na Filipino na katumbas ng idiomang ‘as I live,’ nang hindi ginagawa itong pahayag na temporal.
