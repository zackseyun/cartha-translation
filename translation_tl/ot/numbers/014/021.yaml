  source_fidelity: Kailangan ng rebisyon sa aspekto/diatesis ng pandiwang וְיִמָּלֵא (Niphal). Ang Hebreo ay nagsasaad na ang buong daigdig/lupain ay mapupuno ng kaluwalhatian ni Yahweh, hindi na ang kaluwalhatian ang tuwirang tagaganap na ‘pupuno’ rito. Ang pormulang חַי־אָנִי ay maayos na naihahayag bilang isang taimtim na panunumpa sa ‘kung paanong ako’y buháy.’
  naturalness: Ang ‘kasintiyak na buháy ako’ ay nauunawaan ngunit hindi kasinglikas ng karaniwang modernong Filipino na pormulang ‘kung paanong ako’y buháy.’ Ang binagong pangungusap ay marangal, malinaw, at natural.
  terminology: Ang ‘kaluwalhatian,’ ‘Yahweh,’ at ‘buong daigdig’ ay angkop. Nananatiling mahalaga ang talababa para sa leksikal na alternatibong ‘buong lupain.’
  issues:
