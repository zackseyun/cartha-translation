  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: tl
  text: Sa ilang na ito babagsak ang inyong mga bangkay[a]—kayong lahat na binilang[b], ayon sa kabuuang bilang ninyo, mula dalawampung taong gulang pataas, na nagbulung-bulungan laban sa akin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang Hebreo ay kongkreto: “ang inyong mga bangkay” o “ang inyong mga patay na katawan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “binilang” ay tumutukoy sa mga itinala sa sensus o pagtitipon ng bayan.
    reason: cultural_note
  - marker: c
    text: O “na nagreklamo laban sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: Sa ilang na ito
  rationale: Ang מִדְבָּר ay lupaing ilang o disyerto. Ang “ilang” ay natural sa salaysay ng paglalakbay ng Israel at hindi nagpapahiwatig na puro buhangin ang lugar.
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: babagsak ang inyong mga bangkay
  rationale: 'Pinananatili nito ang kongkretong larawan ng Hebreo: ang נפל ay “bumagsak,” at ang פגר ay bangkay o patay na katawan. Hindi ito pinadulas tungo sa simpleng “mamamatay kayo.”'
- source_word: וְכָל פְּקֻדֵיכֶם
  choice: kayong lahat na binilang
  rationale: Ang פְּקֻדִים ay mga taong naitala o binilang sa sensus o pagtitipon. Ang “kayong lahat na binilang” ay malinaw at natural sa Filipino.
- source_word: לְכָל מִסְפַּרְכֶם
  choice: ayon sa kabuuang bilang ninyo
  rationale: Ipinahahayag ng parirala ang pagiging saklaw ng buong bilang sa sensus, hindi lamang ang ilang bahagi nito.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Ito ang natural na modernong Filipino para sa pormulang Hebreo na nagtatakda ng pinakamababang edad.
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: na nagbulung-bulungan laban sa akin
  rationale: Sa mga salaysay sa ilang, ang anyo ng לון ay tumutukoy sa mapaghimagsik na pagrereklamo. Pinananatili ng “nagbulung-bulungan” ang paulit-ulit at sama-samang himig nito.
theological_decisions:
- issue: Kongkretong pananalita ng hatol
  choice: “babagsak ang inyong mga bangkay”
  alternative: “mamamatay kayo”
  rationale: Binibigyang-diin ng Hebreo ang pisikal na kamatayan bilang hatol sa ilang. Ang kongkretong larawan ay pinanatili sa halip na gawing pangkalahatang pahayag lamang.
- issue: Ugnayan ng huling sugnay sa mga binilang
  choice: 'Pinanatili bilang kamag-anak na sugnay: “na nagbulung-bulungan laban sa akin”'
  alternative: “sapagkat nagbulung-bulungan kayo laban sa akin”
  rationale: Ang אֲשֶׁר ay tuwirang naglalarawan sa mga taong binilang. Bagaman may malinaw na diwang sanhi sa konteksto, hindi ito tahasang ginawang “sapagkat” upang mapanatili ang anyo at bahagyang tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ilang” bilang pamilyar na katawagang biblikal, “bangkay” upang mapanatili ang bigat at pisikalidad ng hatol, at “nagbulung-bulungan” para sa mapaghimagsik na pagrereklamo. Ang gitling na mahaba ay nagmamarka sa paliwanag kung sino ang tinutukoy ng “inyong mga bangkay” nang hindi binabago ang ugnayang panggramatika.
