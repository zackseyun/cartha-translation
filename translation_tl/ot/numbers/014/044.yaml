base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: tl
  text: Ngunit mapangahas silang umakyat[a] sa taluktok ng bundok. Ang kaban ng tipan ni Yahweh[b] at si Moises ay hindi umalis mula sa loob ng kampo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nangahas silang umakyat” o “mapangahas silang umakyat.” Ipinahihiwatig ng pandiwang Hebreo ang kusang-loob at mapangahas na pagkilos.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kaban ng tipan ni Yahweh”; maaari ring isalin, “kaban ng tipang kay Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: buong kapangahasan silang umakyat
  rationale: Ang bihirang pandiwang Hebreo ay nagpapahiwatig ng kusang-loob at mapangahas na pagkilos, hindi lamang ng pisikal na pag-akyat. Ipinahahayag ng “buong kapangahasan” ang may-salang pagpapasya nang hindi labis na ipinapaliwanag ang motibo.
- source_word: לַעֲלוֹת
  choice: umakyat
  rationale: Likas at tuwirang salin ito ng karaniwang pandiwa para sa pagkilos paitaas.
- source_word: אֶל רֹאשׁ הָהָר
  choice: sa taluktok ng bundok
  rationale: Ang רֹאשׁ ay literal na “ulo” ngunit idyomatikong tumutukoy sa taluktok; pinananatili ng “bundok” ang anyong isahan ng הָהָר sa tagpong ito.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: Likas sa Tagalog ang anyong ito ng ugnayang genitibo at malinaw na ang tipan ay kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וּמֹשֶׁה
  choice: at si Moises
  rationale: Ginagamit ang karaniwang anyong Tagalog ng pangalan at ang pantukoy na “si” para sa tao.
- source_word: לֹא מָשׁוּ
  choice: hindi umalis
  rationale: Sa konteksto, ang מוש ay nangangahulugang hindi lumayo o hindi umalis; mas malinaw ito kaysa sa “hindi kumilos,” na maaaring mangahulugang lubos na hindi gumalaw.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: sa gitna ng kampo
  rationale: Natural na Tagalog ito para sa kinaroroonan sa loob o kalagitnaan ng kampo.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Moral na diin ng וַיַּעְפִּלוּ
  choice: buong kapangahasan silang umakyat
  alternative: nangahas silang umakyat; buong pagsuway silang umakyat
  rationale: Ipinahihiwatig ng pandiwa ang mapangahas at kusang pagkilos. Hindi ginamit ang “buong pagsuway” sa pangunahing teksto sapagkat, bagaman naaayon iyon sa konteksto, mas tuwirang interpretatibo iyon kaysa sa mismong pandiwa.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginawang dalawang pangungusap upang maging natural ang paghahambing sa Tagalog, habang pinananatili ang salungatan: umakyat ang mga tao, ngunit nanatili sa kampo ang kaban at si Moises.'
