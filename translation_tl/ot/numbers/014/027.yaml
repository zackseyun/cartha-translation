base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: tl
  text: Hanggang kailan ko titiisin ang masamang kapulungang[a] ito na nagrereklamo laban sa akin? Narinig ko ang mga reklamo ng mga anak ni Israel[b], na patuloy nilang idinadaing laban sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pamayanan” o “pagtitipon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Hanggang kailan
  rationale: Likas na tanong sa Filipino na nagpapanatili sa pagkainip at matinding pagtutol na ipinahihiwatig ng Hebreo.
- source_word: לָעֵדָה הָרָעָה הַזֹּאת
  choice: ang masamang kapulungang ito
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanan o kapulungan ng Israel; ang רָעָה ay isang matinding moral na paghatol, kaya ang 'masama' ay mas angkop kaysa sa salitang tumutukoy lamang sa di-kanais-nais.
- source_word: מַלִּינִים עָלַי
  choice: nagbubulung-bulungan laban sa akin
  rationale: Sa mga salaysay sa ilang, ang pandiwa ay tumutukoy sa paulit-ulit at mapaghimagsik na pagrereklamo. Ipinapakita ng 'laban sa akin' ang puwersang pasalungat ng עָלַי.
- source_word: תְּלֻנּוֹת
  choice: mga reklamo
  rationale: Malinaw at kasalukuyang salitang Filipino para sa hayagang pagpapahayag ng hinaing; nananatili ang pag-uulit ng ideya sa kasunod na pandiwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pormal na ugnayang pampamilya sa Hebreo at ang pangalang Israel, habang natural pa ring nauunawaan sa Filipino.
- source_word: שָׁמָעְתִּי
  choice: Narinig ko
  rationale: Ang aspektong ganap ng pandiwang Hebreo ay natural na naihahayag sa Filipino bilang natapos na pandiwa na may kaugnayan sa kasalukuyang tugon ng Diyos.
theological_decisions:
- issue: Hindi hayag na pandiwa sa pambungad na tanong
  choice: idinagdag ang 'ko titiisin'
  alternative: panatilihin ang putol na anyong 'Hanggang kailan ang masamang kapulungang ito…?'
  rationale: Walang hayag na pandiwa sa Masoretic na teksto pagkatapos ng 'Hanggang kailan,' ngunit malinaw na may elipsis. Ang 'ko titiisin' ay ginagawang likas at buo ang tanong sa Filipino nang hindi binabago ang diwa; hindi ito nagpapasok ng natatanging doktrina.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng salin ang kongkretong pormang pampamilya ng Hebreo. Hindi nito nilalayong limitahan ang tinutukoy sa mga lalaking anak lamang; isa itong nakaugaliang katawagan sa sambayanan ni Israel.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'nagbubulung-bulungan' upang ipakita ang paulit-ulit at suwail na pagrereklamo, at 'kapulungan' upang mapanatili ang kolektibo at pormal na diwa ng עֵדָה.
