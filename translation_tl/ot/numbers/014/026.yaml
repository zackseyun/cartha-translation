  yaml_path: translation/ot/numbers/014/026.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh[a] kina Moises at Aaron, na nagsasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon, isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagpapakilala ng bagong pangyayari ng pagsasalita; natural at marangal sa Filipino ang “At nagsalita” sa pormulang ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kay Moises at kay Aaron
  rationale: Ang “kay” ang likas na panandang Filipino para sa mga taong pinatutungkulan ng pagsasalita; malinaw nitong itinatanghal ang dalawang kausap.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na ugnayan ng pambungad na pormula sa tuwirang pahayag na sumusunod sa susunod na talata.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa pangalang personal at hindi ito tahimik na pinapalitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang “na sinasabi” dahil nagpapatuloy ang mismong mensahe sa kasunod na talata.
