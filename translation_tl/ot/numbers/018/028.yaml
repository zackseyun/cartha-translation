  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: tl
  text: Kaya maglalaan din kayo para kay Yahweh ng bahagi mula sa lahat ng ikapung bahagi na tinatanggap ninyo mula sa mga anak ni Israel[a]; at mula rito ay ibibigay ninyo kay Aaron na pari ang bahaging inilaan para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal na “mga anak ni Israel” ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Kaya
  rationale: Ipinakikitang ang utos na ito ay katumbas at bunga ng naunang tagubilin; natural sa makabagong Tagalog ang “Kaya.”
- source_word: תָּרִימוּ
  choice: maglalaan
  rationale: Sa kaugnayan nito sa תְּרוּמָה, tumutukoy ang Hiphil ng רום sa pagbubukod o paglalaan ng isang bahagi, hindi lamang sa literal na pag-angat.
- source_word: גַם אַתֶּם
  choice: din kayo
  rationale: Pinananatili ang diin na ang mga Levita, gaya ng ibang Israelita, ay dapat ding maglaan ng bahagi.
- source_word: תְּרוּמַת יְהוָה
  choice: bahaging inilaan para kay Yahweh
  rationale: Ipinahahayag ang תְּרוּמָה bilang bahaging ibinukod at iniuukol kay Yahweh, nang hindi ito pinakikitid sa isang partikular na uri ng hain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH ayon sa patakaran ng proyekto.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: mula sa lahat ng ikapung bahagi
  rationale: Ang מַעֲשֵׂר ay ikasampung bahagi o ikapu; ginamit ang mas malinaw na “ikapung bahagi” habang pinananatili ang maramihan at ang diwang partitivo ng מִן.
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: na tinatanggap ninyo mula sa mga anak ni Israel
  rationale: Bagaman maaari ring mangahulugang “kunin” ang לקח, mas angkop sa legal at pangkultong konteksto ang “tinatanggap.” Pinanatili sa teksto ang pormal na pariralang “mga anak ni Israel.”
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: at mula rito ay ibibigay ninyo
  rationale: Pinananatili ang pagkakasunod ng mga kilos at ang diwang may kinukuhang bahagi mula sa naunang tinanggap.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: kay Aaron na pari
  rationale: Ipinakikita ng “kay” na si Aaron ang tatanggap, at pinananatili ang kaniyang titulong pari.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa Hebreo; pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Pagtutumbas sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang literal at pormal na pananalitang tipan, ngunit inilalagay sa talababa ang natural na katumbas na “mga Israelita.”
- issue: Ugnayan ng תְּרוּמָה kay Yahweh
  choice: bahaging inilaan para kay Yahweh
  alternative: bahagi ni Yahweh / handog kay Yahweh
  rationale: Maaaring ipahayag ng konstruksiyon ang pag-aari o pag-uukol. Ang “para kay Yahweh” ay malinaw sa konteksto ng paglalaan ngunit hindi ipinapalagay na ito ay sinunog o inihain sa altar.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bahaging inilaan” upang maipaliwanag nang natural ang teknikal na תְּרוּמָה, at iniwasan ang “hain” dahil maaari nitong ipahiwatig ang mas tiyak na gawaing pansakripisyo kaysa sa sinasabi ng talata.
