    rationale: Ang כְּ sa pariralang כִּתְבוּאַת ay nagsasaad na ang handog ay ibibilang bilang ani ng giikan at bilang ani ng pisaan ng ubas, hindi lamang na kahawig nito.
  - severity: low
    issue: May di-likas na pag-uulit sa "mula rito ang pinakamainam na bahagi nito."
    rationale: Iisa ang tinutukoy ng dalawang panghalip; maaaring ayusin ang ayos ng parirala nang hindi nagdaragdag o nag-aalis ng kahulugan.
