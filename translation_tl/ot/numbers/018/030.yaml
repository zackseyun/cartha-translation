revisions:
- from: At sabihin mo sa kanila, “Kapag ibinukod ninyo mula rito ang pinakamainam na bahagi nito[a], ibibilang iyon para sa mga Levita na gaya ng ani mula sa giikan at ng ani mula sa pisaan ng ubas.”
  to: At sabihin mo sa kanila, “Kapag ibinukod ninyo ang pinakamainam na bahagi mula rito[a], ito ay ibibilang sa mga Levita bilang ani ng giikan at bilang ani ng pisaan ng ubas.”
  rationale: Inayos ang paulit-ulit na panghalip para sa mas natural na modernong Tagalog. Pinalitan ang "gaya ng" ng "bilang" upang maipahayag ang legal/pangkuwentang diwa ng "ibibilang ... bilang," at ginawang "sa mga Levita" upang manatiling malapit sa Hebreong datibo. Hindi tinukoy nang higit kaysa sa teksto ang antecedent ng "rito/ito."
