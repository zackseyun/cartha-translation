translation_notes:
  register: Modernong Filipino Tagalog na magalang at malinaw. Ginamit ang “ibinukod” upang natural na maipahayag ang ritwal na pag-aangat o paghahain ng ambag, samantalang pinanatili ang mga larawang agrikultural na “giikan” at “pisaan ng ubas.”
