  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: tl
  text: At sabihin mo sa kanila, “Kapag ibinukod ninyo ang pinakamainam na bahagi mula rito[a], ito ay ibibilang sa mga Levita bilang ani ng giikan at bilang ani ng pisaan ng ubas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “taba nito”; dito, idyomatikong tumutukoy ang salita sa pinakamayaman o pinakamainam na bahagi ng ani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: At sabihin mo sa kanila
  rationale: Pinananatili ang tuwirang utos kay Moises sa ikalawang panauhang isahan at natural ang daloy sa modernong Tagalog.
- source_word: בַּהֲרִימְכֶם
  choice: Kapag ibinukod ninyo
  rationale: Ang Hiphil ng רום ay tumutukoy sa pag-aangat o paghahain ng isang handog na ambag. Sa kontekstong ito, malinaw at natural sa Tagalog ang “ibinukod” habang ipinahihiwatig na inilaan ang bahagi bilang handog.
- source_word: חֶלְבּוֹ
  choice: ang pinakamainam na bahagi nito
  rationale: Literal itong “taba nito,” ngunit idyomatikong tumutukoy sa pinakamayaman o pinakamabuting bahagi ng ani, hindi sa taba ng hayop.
- source_word: מִמֶּנּוּ
  choice: mula rito
  rationale: Tumutukoy ito sa ikapu na pinagmumulan ng bahaging ibinubukod; iniiwasan ng “rito” ang mabigat na pag-uulit ng “nito.”
- source_word: וְנֶחְשַׁב
  choice: ibibilang iyon
  rationale: 'Pinananatili ang pasibong legal o pangkuwentang diwa ng חשב: ituturing o kikilalanin ang handog sa isang tiyak na paraan.'
- source_word: לַלְוִיִּם
  choice: para sa mga Levita
  rationale: Likas na ipinapahayag sa Tagalog ang kaugnayan ng pagkakabilang sa mga Levita sa pamamagitan ng “para sa.”
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: na gaya ng ani mula sa giikan
  rationale: Pinananatili ang larawang agrikultural ng תבואה at גֹּרֶן, at malinaw ang paghahambing.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: at ng ani mula sa pisaan ng ubas
  rationale: Ang יֶקֶב ay pisaan o sisidlan ng alak; nililinaw ng “pisaan ng ubas” ang konkretong kahulugan para sa karaniwang mambabasa at pinananatili ang paralelismo.
