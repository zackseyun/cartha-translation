  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: tl
  text: Mula sa lahat ng inyong mga kaloob ay itataas ninyo bilang handog[a] ang bawat ambag para kay Yahweh. Mula sa lahat ng pinakamainam na bahagi nito,[b] ang banal na bahagi mula rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “itataas bilang handog” ay literal na larawan ng Hebreong pananalita para sa pag-aalay o pagbubukod ng isang ambag.
    reason: translation_clarity
  - marker: b
    text: 'Literal: “mula sa lahat ng taba nito”; ang “taba” ay tumutukoy sa pinakapili o pinakamainam na bahagi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: Mula sa lahat ng kaloob sa inyo
  rationale: Ipinahihiwatig ng מִן kasama ng כֹּל na ang ambag ay kukunin mula sa kabuuan ng mga kaloob. Sa konteksto, ang mga ito ay mga kaloob na tinanggap ng mga Levita, kaya mas malinaw ang “sa inyo” kaysa sa posibleng pagpapakahulugang sila ang nagbigay ng mga iyon.
- source_word: תָּרִימוּ
  choice: itataas ninyo bilang handog
  rationale: Pinananatili nito ang konkretong larawan ng Hiphil ng רוּם, “itaas,” habang nililinaw na teknikal na paghahandog ang tinutukoy.
- source_word: תְּרוּמַת יְהוָה
  choice: ambag para kay Yahweh
  rationale: Ang תְּרוּמָה ay bahaging iniaangat o ibinubukod bilang ambag. Ang “para kay” ay likas sa Tagalog at nagpapahayag ng kaugnayang kultiko nang hindi ipinapalagay na si Yahweh ang nagbigay ng ambag.
- source_word: מִכָּל חֶלְבּוֹ
  choice: Mula sa pinakamainam na bahagi ng bawat kaloob
  rationale: Literal na “taba” ang חֵלֶב, ngunit matalinghaga itong tumutukoy sa pinakamayaman o pinakapiling bahagi. Ang “bawat kaloob” ay nagpapalinaw sa distributibong diwa ng כֹּל at sa kolektibong pinagmulan ng hulaping isahan.
- source_word: מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: ibubukod ninyo ang banal na bahagi nito
  rationale: Sa kontekstong ito, ang מִקְדָּשׁ ay ang bahaging itinalaga bilang banal. Ipinahihiwatig ng “ibubukod” ang pagkuha nito mula sa kaloob, na siyang diwa ng מִמֶּנּוּ, nang hindi inuulit nang alanganin ang “mula rito.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng מִקְדְּשׁוֹ
  choice: ang banal na bahagi nito
  alternative: ang itinalagang bahagi nito; ang bahagi nitong inilaan sa santuwaryo
  rationale: Pinananatili ng “banal na bahagi” ang sakral na diwa nang hindi nililimitahan ang salita sa pisikal na santuwaryo o pinapawi ang bahagyang kalabuan ng anyong Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kaloob,” “ambag,” at “banal na bahagi” upang maging malinaw sa karaniwang mambabasa habang pinananatili ang bokabularyong panritwal. Ang ikalawang pangungusap ay inayos nang natural sa Tagalog, ngunit hindi inalis ang pagkakaiba ng “pinakamainam” at “banal” na bahagi.
