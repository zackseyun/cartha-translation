  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: tl
  text: Sa isang kabanal-banalang lugar mo ito kakainin[a]. Maaari itong kainin ng bawat lalaki. Magiging banal ito para sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa banal ng mga banal.” Dito, tumutukoy ang parirala sa itinakdang kabanal-banalang lugar kung saan ito dapat kainin.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: sa isang kabanal-banalang lugar
  rationale: Pinananatili nito ang lokatibong diwa ng בְּ at likas na ipinapahayag sa Tagalog ang Hebreong paraang pasukdol. Hindi ginamit ang “sa Banal na mga Banal” upang hindi ipahiwatig na ang pinakaloob na santuwaryo lamang ang tinutukoy.
- source_word: תֹּאכֲלֶנּוּ
  choice: mo ito kakainin
  rationale: Ipinakikita ng “mo” ang ikalawang panauhang isahan na tuwirang tumutukoy kay Aaron, samantalang ang anyong “kakainin” ay angkop sa legal at tagubiling himig ng talata.
- source_word: כָּל זָכָר
  choice: bawat lalaki
  rationale: Tumpak nitong pinananatili ang tahasang paghihigpit ayon sa kasarian sa sambahayan ng mga pari, sa halip na gumamit ng salitang maaaring unawaing pangkalahatan.
- source_word: יֹאכַל אֹתוֹ
  choice: Maaari itong kainin
  rationale: Ipinahahayag ng “maaari” ang pahintulot o pagiging kuwalipikadong kumain, at iniiwasang ipakahulugan ang pandiwa bilang utos na kailangang kumain ang bawat lalaki.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: Magiging banal ito para sa iyo
  rationale: Pinananatili ang pangunahing salitang kultiko na קֹדֶשׁ bilang “banal” at ang ikalawang panauhang isahan, nang hindi dinaragdagan ang Hebreo ng paliwanag tungkol sa pagmamay-ari.
theological_decisions:
- issue: Ang tinutukoy at saklaw ng tagubilin sa pari
  choice: Ang unang pangungusap ay nakatuon kay Aaron sa anyong isahan bilang kinatawan ng mga pari, at nililinaw ng sumunod na pangungusap na maaaring kumain ang bawat kuwalipikadong lalaki.
  alternative: Maaaring unawain ang anyong isahan bilang tagubilin kay Aaron lamang.
  rationale: Ang malapit na konteksto ay tungkol sa mga bahaging ibinibigay kay Aaron at sa kanyang mga anak. Pinananatili ng “mo” at “para sa iyo” ang isahang anyo ng Hebreo, habang hindi nililimitahan kay Aaron lamang ang pahintulot na malinaw na pinalalawak ng כָּל זָכָר.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Ang “kabanal-banalang” ay likas na pasukdol sa Tagalog at angkop sa bokabularyong panritwal; pinanatili rin ang isahang pagtukoy kay Aaron sa pamamagitan ng “mo” at “iyo.”
