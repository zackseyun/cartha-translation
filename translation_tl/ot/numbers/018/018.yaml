base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: tl
  text: Ngunit ang kanilang laman ay magiging para sa iyo[a], gaya ng dibdib ng handog na iniuugoy[b] at ng kanang hita; magiging para sa iyo ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “karne nila.” Literal na “laman” ang Hebreo, na tumutukoy dito sa nakakain na bahagi ng hain.
    reason: lexical_alternative
  - marker: b
    text: Ang “handog na iniuugoy” ay tumutukoy sa bahaging inihaharap sa PANGINOON sa isang ritwal na paggalaw; maaari rin itong tawaging “handog na itinatanghal.”
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: Ngunit ang kanilang laman
  rationale: Ang בָּשָׂר ay literal na “laman” at dito ay tumutukoy sa nakakain na bahagi ng hain. Ginamit ang “Ngunit” upang ipakita ang paghahambing sa naunang paglalaan ng dugo at taba sa PANGINOON.
- source_word: יִהְיֶה לָּךְ
  choice: ay magiging para sa iyo
  rationale: Ang היה + ל ay nagpapahayag ng pag-aari o bahaging itinakdang tanggapin. Likas sa modernong Tagalog ang “magiging para sa iyo” at napananatili nito ang diwang legal ng paglalaan.
- source_word: כַּחֲזֵה הַתְּנוּפָה
  choice: gaya ng dibdib na inihahandog sa pag-ugoy
  rationale: Ang חָזֶה ay “dibdib,” at ang תְּנוּפָה ay ritwal na paghaharap o pag-uugoy ng hain sa harap ng PANGINOON. Inilalarawan ng salin ang kilos nang hindi umaasa sa isang di-pamilyar na terminong teknikal.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: at ng kanang hita
  rationale: Ang שׁוֹק ay bahagi ng binti, lalo na ang hita o itaas na bahagi nito, na itinatalaga sa pari. Ang “kanang hita” ay malinaw at likas sa kontekstong ito.
- source_word: לְךָ יִהְיֶה
  choice: magiging para sa iyo ang mga iyon
  rationale: Pinanatili ang inuulit na pormula ng pag-aari upang maipakita ang diin ng Hebreo na ang dalawang bahaging binanggit ay nakatalaga sa kausap.
theological_decisions:
- issue: Pagbabago ng anyong pangkasarian sa mga hulaping pangalawang panauhan
  choice: Isinalin ang dalawang anyo bilang “para sa iyo,” na tumutukoy kay Aaron bilang kinatawan ng sambahayan ng mga pari.
  alternative: Tahasan itong gawing “para sa inyo” upang tukuyin ang lahat ng pari, o idagdag ang pangalang Aaron.
  rationale: Magkaiba ang kasariang gramatikal ng dalawang hulapi sa tekstong Hebreo, ngunit hindi minamarkahan ng Tagalog ang kasarian sa “iyo.” Kaya napananatili ang pagkakatalaga sa kausap nang hindi nilulutas nang labis ang di-regular na anyo o nagdaragdag ng pangalang wala sa talata.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na bokabularyo para sa karaniwang mambabasa. Pinanatili ang konkretong “laman,” ang paghahambing ng mga bahaging pambalay-pari, at ang inuulit na pahayag ng paglalaan.
