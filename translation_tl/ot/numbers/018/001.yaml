  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן אַתָּ֗ה וּ/בָנֶ֤י/ךָ וּ/בֵית אָבִ֨י/ךָ֙ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֣ן הַ/מִּקְדָּ֑שׁ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֥ן כְּהֻנַּתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Aaron, “Ikaw, ang iyong mga anak, at ang sambahayan ng iyong ama na kasama mo—kayo ang papasan sa kasalanan ng santuwaryo[a]. At ikaw at ang iyong mga anak na kasama mo—kayo ang papasan sa kasalanan ng inyong pagkapari[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papasan sa sala ng santuwaryo.” Ang Hebreong idyoma ay maaari ring mangahulugang pananagutan sa mga pagkakasalang may kaugnayan sa santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “papasan sa sala ng inyong pagkapari.” Ang Hebreong idyoma ay maaari ring mangahulugang pananagutan sa mga pagkakasalang may kaugnayan sa inyong katungkulan bilang mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinahahayag ng waw-consecutive ang pagsulong ng salaysay; natural sa makabagong Tagalog ang “Pagkatapos, sinabi.”
- source_word: בֵית אָבִיךָ
  choice: sambahayan ng iyong ama
  rationale: Tumutukoy ito sa mas malawak na pamilya o angkan sa panig ng ama, hindi lamang sa isang gusali. Pinananatili ng “sambahayan ng iyong ama” ang Hebreong paraang pampamilya habang malinaw sa Tagalog.
- source_word: אִתָּךְ
  choice: na kasama mo
  rationale: Pinananatili ang pag-uulit nito sa dalawang sugnay upang maipakita ang diin at paralelismo ng Hebreo.
- source_word: תִּשְׂאוּ
  choice: kayo ang papasan
  rationale: Ang נשא kasama ng עון ay maaaring mangahulugang pagpasan sa kasalanan, sala, kaparusahan, o pananagutan. Pinananatili ng “papasan” ang matalinghagang idyoma at ang saklaw ng kahulugan nito.
- source_word: עֲוֺן
  choice: kasalanan
  rationale: Maaaring tumukoy ang salita sa kasamaan, pagkakasala, sala, o pananagutang bunga nito. Ang “kasalanan” ay karaniwang salitang teolohikal sa Tagalog at, kasama ng “papasan,” ay hindi lubusang nagtatakda kung sala, pananagutan, o kaparusahan ang pangunahing diin.
- source_word: הַמִּקְדָּשׁ
  choice: santuwaryo
  rationale: Tumutukoy sa banal na dako o sagradong nasasakupan. Ang “santuwaryo” ay maikli, malinaw, at nakasanayang katumbas sa kontekstong biblikal.
- source_word: כְּהֻנַּתְכֶם
  choice: inyong pagkapari
  rationale: Tumutukoy sa katungkulan at paglilingkod bilang mga pari. Pinananatili ng “pagkapari” ang institusyonal na diwa nang hindi ito ginagawang paliwanag lamang.
theological_decisions:
- issue: Kahulugan ng “papasan sa kasalanan” sa konteksto ng pagkapari
  choice: Pinanatili ang idyomang “papasan sa kasalanan” nang hindi nilulutas kung sala, pananagutan, o kaparusahan ang pangunahing diin.
  alternative: “mananagot sa mga pagkakasalang may kaugnayan sa santuwaryo/pagkapari”
  rationale: Saklaw ng Hebreong idyoma ang kapwa culpability at pananagutan sa mga paglabag na kaugnay ng banal na paglilingkod. Ang mas literal ngunit natural na idyoma sa Tagalog ay nagpapanatili sa tunay na teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang em dash at ang inuulit na “kayo ang papasan” upang maging natural ang mahabang simuno at mapanatili ang paralelismo at diin ng Hebreo. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang ipinapaliwanag ng bawat talababa.
