  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: tl
  text: 'At ito ang para sa iyo: ang ibinukod na bahagi ng kanilang mga kaloob[a], kasama ng lahat ng handog na iwinawagayway ng mga anak ni Israel. Ibinigay ko ang mga iyon sa iyo, pati sa iyong mga anak na lalaki at babae na kasama mo, bilang panghabang-panahong tuntunin. Maaaring kumain nito ang bawat malinis[b] na tao sa iyong sambahayan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “iniangat na handog.” Ang salitang Hebreo ay tumutukoy sa bahaging ibinukod para sa banal na gamit.
    reason: lexical_alternative
  - marker: b
    text: Ang “malinis” dito ay nangangahulugang malinis ayon sa mga tuntuning ritwal, hindi lamang malinis ang katawan o matuwid ang asal.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת מַתָּנָם
  choice: ang ibinukod na bahagi ng kanilang mga kaloob
  rationale: Ipinahahayag ng תְּרוּמָה ang bahaging inihihiwalay para sa banal na gamit, samantalang pinananatili ng “mga kaloob” ang payak na diwa ng מַתָּנָה. Natural ito sa modernong Tagalog nang hindi gumagamit ng malabong sinaunang terminong teknikal.
- source_word: תְּנוּפֹת
  choice: mga handog na iwinawagayway
  rationale: Isinasalin ang ritwal na kilos na tinutukoy ng teknikal na terminong תְּנוּפָה sa malinaw at madaling maunawaang Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang anyo ng kolektibong katawagan sa Hebreo nang natural sa Tagalog.
- source_word: נְתַתִּים
  choice: Ibinigay ko ang mga iyon
  rationale: Ang ganap na pandiwa ay tumutukoy sa naitalaga nang mga bahagi, at ang pangmaramihang panghalip ay tumutugma sa mga handog na kababanggit.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: pati sa iyong mga anak na lalaki at babae na kasama mo
  rationale: Tahasan ding binabanggit ng salin ang kapwa mga anak na lalaki at babae gaya ng Hebreo, at pinananatili ang “kasama mo” bilang paglalarawan sa saklaw ng sambahayan ni Aaron.
- source_word: לְחָק עוֹלָם
  choice: bilang panghabang-panahong tuntunin
  rationale: Pinananatili ng “tuntunin” ang legal na diwa ng חֹק, habang ipinahahayag ng “panghabang-panahon” ang patuloy na bisa ng עוֹלָם sa kaayusang tipan.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: ang bawat malinis na tao sa iyong sambahayan
  rationale: Ang “malinis” ay malapit sa salitang Hebreo at nililinaw sa talababa ang ritwal na kahulugan; ang “sambahayan” ay mas malinaw kaysa literal na gusaling bahay.
- source_word: יֹאכַל אֹתוֹ
  choice: Maaaring kumain nito
  rationale: Ipinahahayag ng “maaaring” ang pahintulot o karapatang legal na nakapaloob sa di-ganap na pandiwa sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng ritwal na kalinisan
  choice: Ginamit ang “malinis” na may talababa na tumutukoy sa ritwal na kalinisan.
  alternative: “malinis sa seremonya” sa mismong teksto, o moral na “dalisay”
  rationale: Sa konteksto ng mga batas para sa mga pari, ang טָהוֹר ay katayuang ritwal na nagtatakda kung sino ang maaaring kumain ng banal na bahagi, hindi paglalarawan lamang ng pisikal o moral na kalinisan.
- issue: Tagal ng tuntunin
  choice: panghabang-panahong tuntunin
  alternative: walang hanggang tuntunin; permanenteng tuntunin
  rationale: Pinananatili nito ang malawak na panahong saklaw ng עוֹלָם nang hindi tahasang nilulutas kung paano ito nauugnay sa mga susunod na yugto ng kaayusang tipan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang malinaw na paglalarawan para sa mga teknikal na handog at pinanatili sa pangunahing teksto ang maikling salitang “malinis,” na nilinaw sa talababa.
