  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: tl
  text: At sa mga anak ni Levi, narito, ibinigay ko ang lahat ng ikapu sa Israel[a] bilang mana, kapalit ng paglilingkod na kanilang ginagampanan—ang paglilingkod sa tolda ng pagpupulong.[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bawat ikapu sa Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “bilang kabayaran sa paglilingkod nila” o “bilang kapalit ng kanilang paglilingkod.”
    reason: lexical_alternative
  - marker: c
    text: Ito ang tabernakulo, kung saan ginagampanan ng mga Levita ang mga tungkuling itinalaga sa kanila.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי לֵוִי
  choice: At sa mga anak ni Levi
  rationale: Pinananatili ang literal at angkaning pananalitang “mga anak ni Levi,” sa halip na paikliin agad bilang “mga Levita.”
- source_word: הִנֵּה
  choice: narito
  rationale: Ipinahahayag ang diin at pagtawag-pansin ng Hebreong הִנֵּה sa paraang marangal at nauunawaan sa modernong Filipino.
- source_word: נָתַתִּי
  choice: ibinigay ko
  rationale: Ang aspektong ganap ng pandiwa ay nagpapakita ng isang tiyak at itinakdang pagkakaloob; natural itong ihayag sa Filipino bilang “ibinigay ko.”
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: ang lahat ng ikapu sa Israel
  rationale: Ang “ikapu” ang karaniwang katumbas ng מַעֲשֵׂר, at ang “lahat ng” ay nagpapanatili sa saklaw ng כָּל nang hindi nilulutas kung ito ay kolektibo o distributibo.
- source_word: לְנַחֲלָה
  choice: bilang mana
  rationale: Ipinapakita ng נַחֲלָה ang bahaging ipinagkaloob bilang minanang pag-aari; maikli at likas sa Filipino ang “bilang mana.”
- source_word: חֵלֶף עֲבֹדָתָם
  choice: kapalit ng paglilingkod nila
  rationale: Pinananatili ng “kapalit” ang diwang palitan o kabayaran ng חֵלֶף, samantalang ang “paglilingkod” ay sumasaklaw sa paggawa at sagradong tungkulin nang hindi nag-aangkat ng makabagong wikang pang-iglesia.
- source_word: אֲשֶׁר הֵם עֹבְדִים
  choice: paglilingkod nila
  rationale: Sa Filipino, ang buong diwa ng “kanilang paglilingkod na kanilang isinasagawa” ay natural na naihahayag bilang “paglilingkod nila,” na umiiwas sa mabigat na pag-uulit habang pinananatili ang kahulugan.
- source_word: אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: ang paglilingkod sa tolda ng pagpupulong
  rationale: Ang “tolda ng pagpupulong” ay tuwirang katumbas ng אֹהֶל מוֹעֵד, at ang “paglilingkod sa” ay malinaw na tumutukoy sa mga tungkuling kaugnay nito.
theological_decisions:
- issue: Ang kaugnayan ng ikapu, mana, at paglilingkod ng mga Levita
  choice: Inilalarawan ang ikapu bilang mana na ibinigay kapalit ng paglilingkod ng mga anak ni Levi.
  alternative: Maaaring idiin lamang na ipinagkaloob sa kanila ang ikapu, o unawaing pangunahing pamalit ito sa kawalan nila ng lupang mana.
  rationale: Magkasamang tahasang ginagamit ng Hebreo ang לְנַחֲלָה (“bilang mana”) at חֵלֶף עֲבֹדָתָם (“kapalit ng kanilang paglilingkod”). Pinananatili ng salin ang dalawang ideya nang hindi ginagawang tahasan ang anumang paliwanag na ipinahihiwatig lamang ng mas malawak na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “mga anak ni Levi” dahil mahalaga ang anyong angkan sa Hebreo; ginamit ang “tolda ng pagpupulong” bilang malinaw at literal na katawagan. Ang gitling-pahaba ay tumutulong na ipakitang ang huling parirala ay paglilinaw sa uri ng paglilingkod.
