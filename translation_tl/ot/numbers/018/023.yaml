- from: Ngunit ang Levita mismo ang maglilingkod sa Toldang Tipanan, at sila ang mananagot sa kanilang kasamaan.[a] Ito ay isang tuntuning panghabang-panahon sa lahat ng inyong salinlahi. Sa gitna ng mga anak ni Israel,[b] hindi sila tatanggap ng lupa bilang mana.[c]
  to: Ngunit ang Levita mismo ang magsasagawa ng paglilingkod sa Toldang Tipanan, at papasanin nila ang kanilang pagkakasala.[a] Ito ay isang tuntuning panghabang-panahon sa lahat ng inyong salinlahi. Sa gitna ng mga anak ni Israel,[b] hindi sila magkakaroon ng mana.[c]
  rationale: Binago ang idyomang “bear their iniquity” upang mas malapit na maipakita ang Hebreo nang hindi ikinukulong ang kahulugan sa legal na pananagutan lamang. Inalis ang “lupa” sa pangunahing teksto dahil ito ay kontekstuwal na paglilinaw, at inilipat ito sa talababa. Pinanatili ang lahat ng angkla ng talababa at ang maingat na hindi-doktrinal na paghawak sa kalabuan ng idyoma.
