  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: tl
  text: Ngunit ang Levita mismo ang magsasagawa ng paglilingkod sa Toldang Tipanan, at papasanin nila ang kanilang pagkakasala.[a] Ito ay isang tuntuning panghabang-panahon sa lahat ng inyong salinlahi. Sa gitna ng mga anak ni Israel,[b] hindi sila magkakaroon ng mana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papasanin nila ang kanilang kasamaan” o “ang kanilang pananagutan.” Ang idyomang Hebreo ay maaaring tumukoy sa pagkakasala, pananagutan, o sa mga kahihinatnang kaakibat nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa gitna ng mga Israelita.” Literal na mababasa sa Hebreo ang “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: c
    text: 'Literal: “hindi sila magmamana ng mana.” Binibigyang-diin ng pag-uulit sa Hebreo na hindi sila magkakaroon ng bahaging mana, na sa konteksto ay bahaging lupaing pantribo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: maglilingkod
  rationale: Sa kontekstong legal, ang anyo ng pandiwa ay may diwang inuutos at nagpapatuloy sa hinaharap. Likas sa modernong Tagalog ang “maglilingkod.”
- source_word: הַלֵּוִי הוּא
  choice: ang Levita mismo
  rationale: Pinananatili ng “mismo” ang diin ng hiwalay na panghalip na הוּא nang hindi ipinahihiwatig na siya lamang ang maaaring gumawa nito.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: maglilingkod sa Toldang Tipanan
  rationale: Ang עֲבֹדָה ay tumutukoy rito sa nakatalagang sagradong paglilingkod. Iniiwasan ng pandiwang parirala ang alanganing pag-uulit na “maglingkod ng paglilingkod.” Ang “Toldang Tipanan” ay malinaw at dignified na katawagan sa אֹהֶל מוֹעֵד.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: at sila ang mananagot sa kanilang kasamaan
  rationale: Ang idyomang נשא עון ay maaaring sumaklaw sa pagdadala ng kasamaan, pagkakasala, o pananagutan at mga bunga nito. Ang “mananagot sa kanilang kasamaan” ay natural sa Tagalog habang pinananatili ang legal-kultikong bigat; inilalahad sa talababa ang saklaw ng idyoma.
- source_word: חֻקַּת עוֹלָם
  choice: isang tuntuning panghabang-panahon
  rationale: Ipinahahayag nito ang patuloy na bisa ng kautusan sa kaayusang tipan ng Israel; malinaw at pormal ang “tuntuning panghabang-panahon.”
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Natural na ipinahahayag nito ang pagpapatuloy ng tuntunin sa magkakasunod na salinlahi.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: sa gitna ng mga anak ni Israel
  rationale: Pinananatili ang tahasang “mga anak” ng Hebreo at ang relasyonal na diwa ng בְּתוֹךְ.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: hindi sila tatanggap ng lupa bilang mana
  rationale: Nililinaw ng konteksto na ang ipinagkakait ay bahaging lupaing pantribo. Hindi likas sa Tagalog ang literal na cognate repetition, kaya inililipat ang diin sa malinaw na parirala at itinatala ang literal na anyo sa talababa.
theological_decisions:
- issue: Legal-kultikong idyoma na נשא עון
  choice: mananagot sa kanilang kasamaan
  alternative: pasanin nila ang kanilang kasamaan / pagkakasala
  rationale: Hindi nililimitahan ang parirala sa panloob na guilt lamang o sa kaparusahan lamang. Pinananatili ng salin at talababa ang tensiyon sa pagitan ng kasamaan, pagkakasala, pananagutan, at mga bunga nito.
- issue: Saklaw ng panghalip sa וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: sila ... kanilang
  alternative: ang mga Levita ... kanilang
  rationale: Pinananatili ang panlalaking maramihang panghalip ng Hebreo at hindi tahasang pinapalitan ng isang interpretibong antecedent, bagaman ang pinakamalapit na konteksto ay ang mga Levita.
- issue: Mana ng mga Levita
  choice: lupa bilang mana
  alternative: mana
  rationale: Ang agarang konteksto ay ang kawalan ng bahaging lupaing pantribo sa Israel. Nililinaw ito nang hindi nagdaragdag ng doktrina tungkol sa iba pang uri ng mana.
- issue: Masculine representative expression בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang anyong “mga anak” ng pinagmulan nang natural sa Tagalog at hindi kinakailangang gawing mas espesipiko ang kasarian kaysa sa gamit ng etnikong ekspresyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pagbasa sa kapulungan. Ginamit ang “Levita,” “Toldang Tipanan,” “salinlahi,” at “mana” bilang pamilyar na bokabularyong biblikal. Iniwasan ang hindi likas na literal na pag-uulit, ngunit pinanatili sa mga talababa ang mahahalagang anyo at tunay na kalabuan ng Hebreo.
