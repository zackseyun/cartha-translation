source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: tl
  text: '“Magsalita ka sa mga Levita at sabihin mo sa kanila: ‘Kapag tumanggap kayo mula sa mga anak ni Israel[a] ng ikasampung bahagi na ibinigay ko sa inyo mula sa kanila bilang inyong mana, maghahandog kayo mula rito ng ambag para kay Yahweh[b]—ikasampung bahagi mula sa ikasampung bahagi.[c]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita” o “sambayanang Israel.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “ambag ni Yahweh”; ayon sa tradisyon, “handog na itinaas para kay Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ikasampung bahagi mula sa ikasampung bahagi,” samakatuwid, isang ikasampu ng ikasampung bahaging tinanggap ng mga Levita.
    reason: clarification
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Ito ang karaniwan at malinaw na tawag sa Tagalog sa mga kabilang sa lipi ni Levi.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: Magsalita ka ... at sabihin mo
  rationale: Pinananatili ang dalawang pandiwa ng pormulang Hebreo sa pagbibigay ng tagubilin, nang hindi nagiging mahirap unawain.
- source_word: כִּי תִקְחוּ
  choice: Kapag tinanggap ninyo
  rationale: Ipinakikilala ng כִּי rito ang kalagayang tiyak na magiging batayan ng utos. Ang 'tinanggap' ay angkop dahil ang ikasampung bahagi ay ibinibigay ng Israel sa mga Levita.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang tahasang anyo ng Hebreo habang nananatiling likas at nauunawaan sa Tagalog.
- source_word: הַמַּעֲשֵׂר
  choice: ikasampung bahagi
  rationale: Malinaw nitong ipinahahayag sa modernong Tagalog ang literal at legal na diwa ng tithe nang hindi umaasa sa salitang teknikal na maaaring hindi pamilyar sa lahat.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם
  choice: na ibinigay ko sa inyo mula sa kanila
  rationale: Pinananatili kapuwa ang Diyos bilang nagbibigay at ang Israel bilang pinagmumulan ng bahaging tinatanggap ng mga Levita.
- source_word: בְּנַחֲלַתְכֶם
  choice: bilang inyong mana
  rationale: Ipinahahayag na ang ikasampung bahagi ang itinakdang mana o bahagi ng mga Levita.
- source_word: וַהֲרֵמֹתֶם
  choice: maghahandog kayo
  rationale: Sa kontekstong panrelihiyon, ang Hiphil ng רום ay tumutukoy sa paghaharap o paghahandog ng isang bahaging ibinukod; natural at malinaw ang 'maghahandog' sa Tagalog.
- source_word: תְּרוּמַת יְהוָה
  choice: ambag para kay Yahweh
  rationale: Ang תְּרוּמָה ay isang bahaging ibinukod at inihahandog. Ang 'para kay Yahweh' ay malinaw sa konteksto, habang itinatala sa talababa ang posibleng anyong nag-uugnay rito bilang 'ambag ni Yahweh.'
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: ikasampung bahagi mula sa ikasampung bahagi
  rationale: 'Pinananatili ang partitive na מִן at ang sadyang pag-uulit: magbibigay ang mga Levita ng isang ikasampu mula sa ikasampung bahaging natanggap nila.'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang pangalan ng tipan na YHWH; pinananatili ito bilang 'Yahweh' sa halip na palitan ng isang titulo.
- issue: Kasarian at saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili nito ang literal na ekspresyong Hebreo nang hindi ipinapalagay na ang tinutukoy ay mga lalaking nasa hustong gulang lamang; ipinapaliwanag sa talababa ang kolektibong gamit.
- issue: Ugnayan sa pariralang תְּרוּמַת יְהוָה
  choice: ambag para kay Yahweh
  alternative: ambag ni Yahweh
  rationale: Maaaring ipahiwatig ng construct phrase ang ambag na nauukol o inilalaan kay Yahweh, o ilarawan ito bilang 'ambag ni Yahweh.' Pinili sa teksto ang natural na layuning diwa ngunit pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig para sa tekstong legal at panrelihiyon. Ginamit ang 'ikasampung bahagi' sa halip na mas teknikal na 'ikapu' upang maging agad na malinaw sa karaniwang mambabasa. Pinanatili ang bahagyang pormal na pormulang 'Magsalita ka ... at sabihin mo' dahil mahalaga ang pag-uulit sa Hebreo.
