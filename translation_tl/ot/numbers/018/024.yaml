base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: tl
  text: Sapagkat ibinigay ko sa mga Levita bilang mana ang ikasampung bahagi na inihahandog ng mga anak ni Israel sa PANGINOON bilang handog. Kaya sinabi ko sa kanila, ‘Hindi sila magkakaroon ng mana sa gitna ng mga anak ni Israel.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: ikasampung bahagi
  rationale: Tuwirang ipinahahayag ang tithe sa karaniwang modernong Tagalog nang hindi umaasa sa salitang teknikal na maaaring hindi pamilyar sa lahat.
- source_word: יָרִימוּ
  choice: inihahandog
  rationale: Ang literal na diwang ‘itinataas’ ay idiomatikong tumutukoy rito sa paghahandog; ‘inihahandog’ ang natural at malinaw na katumbas sa konteksto.
- source_word: תְּרוּמָה
  choice: handog
  rationale: Pinananatili ang kultikong kahulugan ng bagay na inilaan at iniharap sa PANGINOON, sa payak at dignified na wika.
- source_word: נַחֲלָה
  choice: mana
  rationale: Pinananatili ang mahalagang pag-uugnay sa pagitan ng ikasampung bahagi bilang mana ng mga Levita at ng kawalan nila ng mana sa lupain ng Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pormal at tradisyonal na katumbas na nagpapanatili sa kolektibong katawagan ng tekstong Hebreo.
- source_word: יהוה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang salin sa malalaking titik para sa banal na pangalang YHWH.
theological_decisions:
- issue: Ang kahulugan ng mana ng mga Levita
  choice: Pinanatiling ‘mana’ kapwa para sa ikasampung bahagi at sa wala silang matatanggap sa Israel.
  alternative: Gamitin ang ‘bahagi’ o tahasang idagdag ang ‘lupain’ sa ikalawang pahayag.
  rationale: 'Ang pag-uulit ng נַחֲלָה ay sadyang mahalaga: ang ikasampung bahagi ang ibinigay na mana sa mga Levita kapalit ng mana sa gitna ng Israel. Hindi idinagdag ang ‘lupain’ dahil hindi ito tahasang nasa talata.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pampublikong pagbasa. Gumamit ng ‘mga Levita,’ ‘ikasampung bahagi,’ at ‘handog’ bilang mga terminong madaling maunawaan. Pinanatili ang parallelism ng ‘mana’ at ang PANGINOON bilang salin ng tetragrammaton.
