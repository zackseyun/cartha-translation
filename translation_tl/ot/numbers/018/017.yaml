id: NUM.18.17
reference: Numbers 18:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Ngunit huwag mong tubusin ang panganay na baka, panganay na tupa, o panganay na kambing; banal ang mga iyon. Iwisik mo ang dugo ng mga iyon sa altar, at sunugin mo ang taba ng mga iyon bilang handog na pinaraan sa apoy[a], isang samyong kalugod-lugod kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog sa apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Nagpapakilala ng pagbubukod sa naunang tuntunin at pinananatili ang panalungat na diwa.
- source_word: בְּכוֹר
  choice: panganay
  rationale: Karaniwan at tiyak na salin para sa unang supling na may natatanging kabuluhang pangkulto.
- source_word: שׁוֹר
  choice: baka
  rationale: Sa talaang ito, pangkalahatang uri ng hayop ang tinutukoy; mas natural sa makabagong Tagalog kaysa sa mas tiyak na 'toro' o sa teknikal na 'barakong baka'.
- source_word: כֶּשֶׂב
  choice: tupa
  rationale: Pangkalahatang katawagan sa uri, kaagapay ng baka at kambing; hindi nililimitahan sa batang tupa.
- source_word: עֵז
  choice: kambing
  rationale: Tuwirang katawagan sa uri ng hayop.
- source_word: לֹא תִפְדֶּה
  choice: huwag mong tubusin
  rationale: Ipinahahayag ng פדה sa kontekstong legal at pangkulto ang pagtubos sa pamamagitan ng kabayaran o kahalili.
- source_word: קֹדֶשׁ הֵם
  choice: banal ang mga iyon
  rationale: Pinananatili ang tahasang pahayag tungkol sa nakatalagang kabanalan ng mga hayop.
- source_word: תִּזְרֹק
  choice: iwisik mo
  rationale: Natural na Tagalog para sa ritwal na paglalagay o paghahagis ng dugo sa altar, nang hindi ipinapalagay na pino lamang ang patak.
- source_word: חֶלְבָּם
  choice: taba ng mga iyon
  rationale: Tumutukoy sa taba ng hain na sinusunog sa altar.
- source_word: תַּקְטִיר
  choice: sunugin mo
  rationale: Sa kontekstong paghahain, tumutukoy sa pagsunog sa altar upang umusok ang handog.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Pinananatili ang kaugnayan sa apoy nang hindi ipinapasok ang interpretasyong 'pagkaing handog,' na hindi tahasang nasa anyo ng salita.
- source_word: רֵיחַ נִיחֹחַ
  choice: samyong kalugod-lugod
  rationale: Dignified at natural na paglalarawan sa amoy ng handog bilang nakalulugod sa Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang pinananatili ang personal na pangalang tipan na nasa tekstong Hebreo, sa karaniwang rekonstruksiyong 'Yahweh'.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: pagkaing handog; handog na sinusunog
  rationale: Mas malapit ito sa pangkultong idyoma at iniiwasang gawing tiyak ang pinagtatalunang etimolohiya o ideya ng 'pagkain.' Ang mas maikling alternatibo ay inilagay sa talababa.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw ngunit marangal, na may legal-pangkultong tono. Ginamit ang isahang utos sapagkat isahan ang anyong pandiwa sa Hebreo; ang 'mga iyon' ay nagpapanatili ng maramihang reperensiya sa tatlong uri ng panganay na hayop.
