  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: tl
  text: At gagampanan ninyo ang tungkuling nauukol sa santuwaryo at ang tungkuling nauukol sa altar, upang hindi na magkaroon ng poot laban sa mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Israelita.” Literal sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: At tutuparin ninyo
  rationale: Sa pariralang may מִשְׁמֶרֶת, ang pandiwang שׁמר ay tumutukoy sa tapat na pagtupad at pangangalaga sa isang iniatas na banal na tungkulin. Ang “tutuparin ninyo” ay natural sa makabagong Tagalog at nagpapanatili sa mariing utos na nakatuon sa maramihang kausap.
- source_word: מִשְׁמֶרֶת
  choice: pananagutan
  rationale: Sa kontekstong makasaserdote, tumutukoy ito sa iniatas na tungkulin o responsibilidad na pangalagaan ang mga banal na bagay. Inuulit ang “pananagutan” para katawanin ang pag-uulit sa Hebreo at idiin ang dalawang saklaw ng tungkulin.
- source_word: הַ/קֹּדֶשׁ
  choice: ang santuwaryo
  rationale: Dahil katambal ito ng altar at nasa konteksto ng paglilingkod ng mga pari, tumutukoy ito sa banal na lugar o sagradong nasasakupan, hindi sa abstraktong kabanalan.
- source_word: הַ/מִּזְבֵּחַ
  choice: ang altar
  rationale: Ito ang karaniwan, malinaw, at tiyak na salin sa Tagalog para sa dambanang pinaghahandugan.
- source_word: וְ/לֹא יִהְיֶה עוֹד
  choice: upang hindi na magkaroon
  rationale: 'Ipinakikita ng “upang” ang likas na layunin o bunga sa konteksto: ang wastong pagtupad sa tungkulin ay hahadlang sa panibagong pagdating ng poot. Ang “hindi na” ay kumakatawan sa עוֹד.'
- source_word: קֶצֶף
  choice: poot
  rationale: Mas matindi ito kaysa karaniwang galit at angkop sa konteksto ng banal na paghatol, nang hindi tahasang idinaragdag ang Diyos bilang pinagmulan dahil hindi siya pinangalanan sa sugnay.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang anyo ng idyomang Hebreo, habang ipinapaliwanag sa talababa ang mas karaniwang kolektibong salin.
theological_decisions:
- issue: Kung ang huling sugnay ay payak na prediksiyon o nagpapahayag ng layunin/bunga ng pagtupad ng mga pari
  choice: 'Isinalin itong may layunin/bunga: “upang hindi na magkaroon ng poot.”'
  alternative: “At hindi na magkakaroon ng poot,” bilang payak na prediksiyon.
  rationale: Sa agarang konteksto, ang mga tungkulin sa santuwaryo at altar ay itinakda upang maiwasan ang di-awtorisadong paglapit at ang kasunod na paghatol. Ipinahihiwatig ito ng pagkakasunod ng mga sugnay, bagaman hindi ginagawang mas tiyak kaysa kinakailangan ang kaugnayan.
- issue: Kung tahasang kikilalanin bilang poot ng Diyos ang קֶצֶף
  choice: Iniwan ang pinagmulan ng poot na hindi tahasang pinangalanan.
  alternative: “poot ng Diyos.”
  rationale: Malinaw sa konteksto na banal na poot ang tinutukoy, ngunit walang tahasang pangngalang “Diyos” sa sugnay; kaya hindi ito idinagdag sa pangunahing teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “pananagutan” upang maipahayag kapuwa ang opisyal na tungkulin at pananagutang pangalagaan ang mga banal na bagay; inulit ito ayon sa estruktura ng Hebreo. Inilagay ang talababa pagkatapos ng pariralang tinutukoy nito.
