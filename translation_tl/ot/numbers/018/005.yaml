  source_fidelity: 'Ang pangunahing diwa ay wastong naipapahayag: ang maramihang kausap ay inaatasang tuparin/ingatan ang dalawang magkahiwalay na sakral na tungkulin, at ang resulta/layunin ay maiwasan ang karagdagang poot laban sa Israel. Gayunman, ang “pananagutan sa santuwaryo” ay maaaring mangahulugang pagiging mananagot sa santuwaryo, sa halip na ang iniatas na tungkuling may kaugnayan dito. Ang “tungkuling nauukol sa” ay mas malinaw na tumutugma sa מִשְׁמֶרֶת at napananatili ang inuulit na estruktura ng Hebreo.'
