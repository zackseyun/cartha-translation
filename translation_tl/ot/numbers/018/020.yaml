    issue: Di-gaanong natural ang “magmamana sa lupain nila.”
    rationale: Mas idiomatiko sa Filipino ang “magkakaroon ng mana sa kanilang lupain,” habang pinananatili ang diwa ng תִנְחָל at ang konteksto ng mana sa lupain.
  - severity: low
    issue: Malabo ang “magiging bahagi sa gitna nila.”
    rationale: Maaaring maunawaan ito bilang bahaging nasa pisikal na gitna. Ang “magiging bahagi sa piling nila” ay mas malinaw na nagpapahayag ng kawalan ng nakalaang bahagi sa loob ng sambayanan.
