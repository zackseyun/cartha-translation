revisions:
- from: Sinabi ni Yahweh kay Aaron, “Hindi ka magmamana sa lupain nila, at wala kang magiging bahagi sa gitna nila. Ako ang bahagi mo at ang mana mo sa gitna ng mga anak ni Israel[a].”
  to: Sinabi ni Yahweh kay Aaron, “Hindi ka magkakaroon ng mana sa kanilang lupain, at wala kang magiging bahagi sa piling nila. Ako ang bahagi mo at ang mana mo sa piling ng mga anak ni Israel[a].”
  rationale: Inayos ang dalawang parirala upang maging mas likas at hindi malabo sa modernong Filipino, nang hindi binabago ang kahulugan o ang pag-uugnay ng “bahagi” at “mana” sa Hebreo. Pinanatili ang banal na pangalang “Yahweh” at ang pormal na “mga anak ni Israel,” kasama ang mga kolektibong alternatibo sa talababa.
