  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Aaron, “Hindi ka magkakaroon ng mana sa kanilang lupain, at wala kang magiging bahagi sa piling nila. Ako ang bahagi mo at ang mana mo sa piling ng mga anak ni Israel[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa piling ng sambayanan ng Israel” o “sa piling ng mga Israelita.” Sa Hebreo, “sa piling ng mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בְּאַרְצָם
  choice: sa lupain nila
  rationale: Tumutukoy ang אֶרֶץ sa lupaing minana ng Israel; pinananatili ng “lupain” ang teritoryal na diwa ng konteksto.
- source_word: תִנְחָל
  choice: magmamana
  rationale: Tuwirang ipinapahayag ng pandiwang ito ang pagtanggap o pagtataglay ng mana at pinananatili ang ugnayan nito sa “mana mo” sa kasunod na pangungusap.
- source_word: חֵלֶק
  choice: bahagi
  rationale: Likas na katumbas ito ng isang takdang bahagi o kaparte at angkop din sa pahayag na ang Diyos mismo ang bahagi ni Aaron.
- source_word: בְּתוֹכָם
  choice: sa gitna nila
  rationale: Pinananatili nito ang larawan ng pagkakaroon ng bahagi sa loob ng sambayanan, nang hindi nililimitahan ang kahulugan sa pisikal na lokasyon lamang.
- source_word: אֲנִי חֶלְקְךָ
  choice: Ako ang bahagi mo
  rationale: Pinananatili ang maikli at mariing pahayag ng Hebreo at ang leksikal na kaugnayan sa naunang “bahagi.”
- source_word: נַחֲלָתְךָ
  choice: ang mana mo
  rationale: Ipinagpapatuloy nito ang legal at tipanang diwa ng נַחֲלָה at ang ugnayan sa pandiwang “magmamana.”
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: sa gitna ng mga anak ni Israel
  rationale: Pinananatili ang pormal na larawang pampamilya ng Hebreong בְּנֵי יִשְׂרָאֵל; ibinibigay sa talababa ang mas karaniwang kolektibong mga salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Pagsasalin sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: sambayanan ng Israel / mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang literal at tipanang larawang pampamilya, habang kinikilala sa talababa ang natural na kolektibong kahulugan ng parirala.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “bahagi” at ang ugnayan ng “magmamana” sa “mana” upang maipakita ang estruktura at diin ng Hebreo.
