  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: tl
  text: Ang bawat panganay na unang lumabas sa sinapupunan ng bawat nilalang, na inihaharap nila kay Yahweh—tao man o hayop—ay magiging iyo. Ngunit tiyak na tutubusin mo ang panganay ng tao, at tutubusin mo rin ang panganay ng di-malinis na hayop.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: panganay na nagbubukas ng sinapupunan
  rationale: Pinananatili nito ang larawan ng idyomang Hebreo habang malinaw na tumutukoy sa unang supling na lumabas sa sinapupunan.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: bawat ... sa lahat ng may buhay
  rationale: Ipinahahayag nito ang malawak na saklaw sa mga tao at hayop nang hindi ginagamit ang di-likas na literal na 'lahat ng laman.'
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: na inihaharap nila kay Yahweh
  rationale: Ang pandiwa ay nangangahulugang ilapit o iharap sa konteksto ng paghahandog; sapat ang lawak ng 'inihaharap' dahil hindi literal na inihahain ang lahat bilang sakripisyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: tao man o hayop
  rationale: Likas at maikli itong paghahayag ng dalawang uri na saklaw ng tuntunin.
- source_word: יִהְיֶה לָּךְ
  choice: ay magiging iyo
  rationale: Tuwirang ipinahahayag ang karapatan ng kausap sa mga panganay.
- source_word: אַךְ
  choice: Ngunit
  rationale: Ipinakikilala nito ang mahalagang limitasyon sa naunang pahayag.
- source_word: פָּדֹה תִפְדֶּה
  choice: dapat mo talagang tubusin
  rationale: Naipahahayag ng 'dapat' ang obligasyon at ng 'talagang' ang diin ng infinitive absolute kasama ng finite verb.
- source_word: בְּכוֹר הָאָדָם
  choice: panganay na tao
  rationale: Malinaw nitong pinananatili ang kaibahan ng tao sa hayop nang hindi ipinapalagay na lalaki lamang ang tinutukoy.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: panganay ng maruming hayop
  rationale: Pinananatili ang kategoryang ritwal ng hayop na hindi maaaring ihandog at kaya kailangang tubusin.
theological_decisions:
- issue: Kahulugan ng אָדָם bilang katapat ng hayop
  choice: tao
  alternative: lalaki; sangkatauhan
  rationale: Dito ay uri ng nilalang ang kaibahan—tao laban sa hayop—kaya ang 'tao' ang pinakatumpak at likas na salin.
- issue: Uri ng pag-aangkin sa mga panganay
  choice: Ang mga panganay ay magiging sa pari, ngunit ang panganay na tao at ng maruming hayop ay kailangang tubusin.
  alternative: Unawaing lahat ng inihaharap kay Yahweh ay literal na isinasakripisyo.
  rationale: Ang mismong ikalawang pangungusap ay naglilimita sa naunang pahayag at nag-uutos ng pagtubos sa mga taong panganay at sa panganay ng maruming hayop.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sinapupunan' upang mapanatili ang konkretong larawan ng Hebreo, at ang 'inihaharap' upang hindi ipahiwatig na ang bawat panganay, kabilang ang tao, ay literal na isinasakripisyo.
