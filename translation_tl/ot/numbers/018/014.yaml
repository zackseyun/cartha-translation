translation:
  language: tl
  text: Ang lahat ng bagay na di-mababawing itinalaga sa Diyos sa Israel ay mapapasaiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng bagay na nasa ilalim ng pagbabawal sa Israel.” Ang salitang Hebreo ay tumutukoy sa isang bagay na di-mababawing itinalaga sa Diyos; sa ilang konteksto, maaari itong tumukoy sa isang bagay na itinalaga sa paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: bawat
  rationale: Likas na ipinapahayag ng “bawat” ang kabuuan ng kategoryang tinutukoy ng isahang kolektibong חֵרֶם.
- source_word: חֵרֶם
  choice: bagay na itinalaga nang lubusan sa Diyos
  rationale: Ipinapakita nito na ang bagay ay di-mababawing inilaan sa Diyos at inalis sa karaniwang paggamit, nang hindi ipinapalagay sa pangunahing teksto na tiyak itong nakatalaga sa paglipol.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Tuwirang ipinahahayag ang saklaw o lugar na tinutukoy ng pang-ukol בְּ.
- source_word: לְךָ
  choice: iyo
  rationale: Ipinapahayag ang pagmamay-ari o legal na pagkakaloob kay Aaron nang maikli at natural sa Tagalog.
- source_word: יִהְיֶה
  choice: ay magiging
  rationale: Pinananatili ang hinaharap at legal na diwa ng imperpektong anyo ng היה.
theological_decisions:
- issue: Pagpapakahulugan sa teknikal na terminong pangkulto na חֵרֶם
  choice: bagay na itinalaga nang lubusan sa Diyos
  alternative: bagay na isinailalim sa pagbabawal o itinalaga sa paglipol
  rationale: Maaaring tumukoy ang חֵרֶם sa isang bagay na di-mababawing inilaan sa Diyos at, sa ilang konteksto, sa isang bagay na itinalaga sa paglipol. Hindi nililinaw ng talatang ito mismo ang paglipol, kaya pinananatili sa pangunahing teksto ang mas malawak na kahulugan at inilalagay sa talababa ang mas matinding alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “itinalaga nang lubusan sa Diyos” upang maipaliwanag ang teknikal na terminong Hebreo nang hindi isinasara ang tunay nitong lawak ng kahulugan.
