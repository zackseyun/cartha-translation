  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: tl
  text: Ang mga unang bunga ng lahat ng nasa kanilang lupain na dadalhin nila kay Yahweh ay mapapasaiyo. Maaaring kumain nito ang sinumang malinis[a] sa iyong sambahayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malinis ayon sa ritwal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: mga unang bunga
  rationale: Tumutukoy sa unang ani o bunga na inihahandog; natural at maikli itong katumbas sa kontekstong pangkulto.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: ng lahat ng nasa kanilang lupain
  rationale: Pinananatili ang malawak na saklaw at ang lokasyong ipinahihiwatig ng pariralang Hebreo nang hindi nililimitahan sa isang partikular na uri ng ani.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: na dadalhin nila kay Yahweh
  rationale: Tuwirang isinasalin ang pandiwang 'dadalhin' at pinananatili ang banal na pangalang nasa tekstong Hebreo; malinaw sa konteksto na ito ay paghahandog.
- source_word: לְךָ יִהְיֶה
  choice: ay mapapasaiyo
  rationale: Likas na Filipino para sa pagtatalaga ng handog kay Aaron bilang pag-aari o bahagi niya.
- source_word: כָּל טָהוֹר
  choice: ang sinumang malinis
  rationale: Pinananatili sa pangunahing teksto ang payak na salitang 'malinis,' habang nililinaw sa talababa ang ritwal na diwa nito sa batas para sa mga pari.
- source_word: בְּבֵיתְךָ
  choice: sa iyong sambahayan
  rationale: Ipinahihiwatig dito ang mga kabilang sa sambahayan ni Aaron, hindi lamang ang mga taong pisikal na nasa loob ng bahay.
- source_word: יֹאכֲלֶנּוּ
  choice: maaaring kumain nito
  rationale: Ipinapahayag ng anyong pandiwa sa konteksto ang pahintulot o karapatang kumain, hindi lamang isang pangyayaring magaganap.
theological_decisions:
- issue: Kahulugan ng 'malinis' sa batas para sa mga pari
  choice: malinis ayon sa ritwal ang miyembro ng sambahayan ni Aaron na maaaring kumain
  alternative: malinis o dalisay sa pangkalahatang moral na kahulugan
  rationale: Sa konteksto ng Mga Bilang 18 at ng mga tuntunin tungkol sa mga pari, ang טָהוֹר ay tumutukoy sa kalinisan ayon sa ritwal; hindi nito pangunahing tinutukoy ang pangkalahatang moral na kalagayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang likas na maipahayag ang kolektibong diwa ng בֵּית, at ikinabit ang talababa sa “malinis,” ang salitang aktuwal nitong nililinaw.
