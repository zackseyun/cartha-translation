base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: tl
  text: Maaari ninyo itong kainin saan mang lugar—kayo at ang inyong sambahayan[b]—sapagkat ito ang inyong kabayaran[c] sa inyong paglilingkod sa tolda ng pagpupulong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tolda ng tipanan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan” ay tumutukoy sa mga kabilang sa yunit ng tahanan, hindi lamang sa pisikal na bahay.
    reason: cultural_note
  - marker: c
    text: O “gantimpala,” “bayad,” o “sahod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: Maaari ninyo itong kainin
  rationale: Sa kontekstong legal, ang anyong Hebreo ay nagpapahayag ng pinahihintulutang gawain, hindi payak na pangyayaring nakaraan.
- source_word: בְּכָל מָקוֹם
  choice: saan mang lugar
  rationale: Ipinahihiwatig nito na hindi limitado sa santuwaryo ang lugar ng pagkain; likas at malinaw ito sa modernong Filipino.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: kayo at ang inyong sambahayan
  rationale: Ang בַּיִת dito ay ang buong yunit ng tahanan, hindi lamang ang gusali at hindi rin kinakailangang pamilya lamang.
- source_word: שָׂכָר
  choice: kabayaran
  rationale: Tumutukoy ito sa gantimpala o bayad na tinatanggap dahil sa paglilingkod; mas angkop at dignified ang 'kabayaran' kaysa sa mas makitid na 'sahod'.
- source_word: חֵלֶף עֲבֹדַתְכֶם
  choice: kapalit ng inyong paglilingkod
  rationale: Pinananatili nito ang diwa ng kabayarang katumbas ng ginawang tungkulin.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa tolda ng tipanan
  rationale: Ang 'tolda ng tipanan' ay malinaw na katawagan sa itinalagang santuwaryo kung saan nagtatagpo ang Diyos at Israel; natural sa Filipino ang 'sa' para sa paglilingkod na kaugnay nito.
theological_decisions:
- issue: Kalikasan ng bahaging ibinigay sa mga Levita
  choice: Inilalarawan ito bilang lehitimong kabayaran sa kanilang paglilingkod at maaaring kainin saan mang lugar.
  alternative: Maaaring ipakahulugan ito bilang banal na pagkaing dapat kainin lamang sa isang sagradong lugar.
  rationale: Tahasang sinasabi ng בְּכָל מָקוֹם na walang restriksiyon sa lokasyon ng pagkain, kaya naiiba ito sa mga handog na kailangang kainin sa banal na lugar.
translation_notes:
  register: Modernong Filipino na malinaw, dignified, at madaling maunawaan. Ginamit ang 'maaari' upang ihayag ang pahintulot sa legal na konteksto; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
