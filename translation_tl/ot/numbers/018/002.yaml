base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: tl
  text: Ilapit mo rin sa iyong piling ang iyong mga kapatid, ang lipi ni Levi—ang lipi ng iyong ama—upang makaugnay sila sa iyo[a] at maglingkod sa iyo, samantalang ikaw at ang iyong mga anak na kasama mo ay nasa harap ng tolda ng patotoo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sumama sila sa iyo” o “mapabilang sila sa iyo.” Ang pandiwang Hebreo ay umaalingawngaw rin sa pangalang Levi.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tolda ng patotoo.” Sa talatang ito, hindi ginagamit ang mas karaniwang pariralang “tolda ng pagpupulong.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: rin
  rationale: Ipinahahayag ang pandagdag na diwa ng Hebreo nang natural sa modernong Tagalog.
- source_word: אַחֶיךָ
  choice: iyong mga kapatid
  rationale: Pinananatili ang tuwirang pananalitang pampamilya; sa konteksto, tumutukoy ito sa mga kapwa Levita ni Aaron.
- source_word: מַטֵּה לֵוִי
  choice: ang lipi ni Levi
  rationale: Ang מַטֶּה rito ay katawagan sa isang lipi, hindi isang pisikal na tungkod.
- source_word: שֵׁבֶט אָבִיךָ
  choice: ang lipi ng iyong ama
  rationale: Pinananatili ang panuring na nag-uugnay sa lipi ni Levi sa angkan ng ama ni Aaron.
- source_word: הַקְרֵב אִתָּךְ
  choice: Ilapit mo rin sa iyo
  rationale: Ipinapakita ang Hiphil na diwang ‘dalhin o palapitin’ para sa paglilingkod, kasama ang kaugnayan kay Aaron.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: upang maugnay sila sa iyo
  rationale: Sinasalamin ang diwa ng pagsama o pagkakabit kay Aaron at pinananatili ang posibleng alingawngaw ng pangalang Levi.
- source_word: וִישָׁרְתוּךָ
  choice: at maglingkod sa iyo
  rationale: Malinaw at likas na salin ng paglilingkod o pag-aasikaso nang hindi gumagamit ng labis na eklesiastikong katawagan.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: samantalang ikaw at ang iyong mga anak na kasama mo
  rationale: Ang ‘samantalang’ ay natural na nagpapakita ng kaugnayan at pagkakaiba ng tungkulin ng mga Levita at ng sambahayan ni Aaron.
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: ay nasa harap ng tolda ng patotoo
  rationale: Tapat sa tiyak na pariralang Hebreo na ‘tolda ng patotoo,’ sa halip na iayon ito sa mas karaniwang ‘tolda ng pagpupulong.’
theological_decisions:
- issue: Pagpapakahulugan sa אֹהֶל הָעֵדֻת
  choice: tolda ng patotoo
  alternative: tolda ng pagpupulong
  rationale: Tahasang ‘patotoo’ ang nasa tekstong Hebreo. Pinananatili ito upang hindi mapalitan ng mas pamilyar ngunit ibang pariralang ginagamit sa ibang mga talata.
- issue: Ugnayan ng mga Levita kay Aaron sa וְיִלָּווּ עָלֶיךָ
  choice: maugnay sila sa iyo
  alternative: sumama sila sa iyo
  rationale: Pinananatili ng ‘maugnay’ ang mas malakas na diwa ng pagkakabit o pagkatalaga sa paglilingkod, habang hindi nilulutas nang labis ang lawak ng relasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lipi,” “tolda,” at “patotoo” bilang malinaw at karaniwang mga salitang biblikal; iniwasan ang lipas o labis na teknikal na pananalita.
