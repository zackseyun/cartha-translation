revisions:
- from: Ilapit mo rin sa iyo ang iyong mga kapatid, ang lipi ni Levi—ang lipi ng iyong ama—upang maugnay sila sa iyo[a] at maglingkod sa iyo, samantalang ikaw at ang iyong mga anak na kasama mo ay nasa harap ng tolda ng patotoo.[b]
  to: Ilapit mo rin sa iyong piling ang iyong mga kapatid, ang lipi ni Levi—ang lipi ng iyong ama—upang makaugnay sila sa iyo[a] at maglingkod sa iyo, samantalang ikaw at ang iyong mga anak na kasama mo ay nasa harap ng tolda ng patotoo.[b]
  rationale: Pinalitan lamang ang “sa iyo” ng “sa iyong piling” sa unang sugnay upang maging likas ang Tagalog at mapanatili ang kahulugang “with you.” Ginawa ring “makaugnay” ang pandiwa upang maging higit na likas ang aspektong layunin (“upang … sila”) habang pinananatili ang diwang pag-uugnay ng Niphal na לוה. Ang mga talababa at kanilang mga pananda ay nananatiling wastong nakatali sa kaukulang salita/parirala.
