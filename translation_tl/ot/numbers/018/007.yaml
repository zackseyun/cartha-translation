revisions:
- from: Ngunit ikaw at ang iyong mga anak na kasama mo ang mangangalaga sa inyong tungkulin bilang mga pari sa lahat ng nauukol sa altar at sa nasa kaloob-looban ng tabing; maglilingkod kayo. Ibinibigay ko sa inyo ang inyong tungkulin bilang mga pari bilang isang kaloob na paglilingkod.[a] Ngunit ang sinumang hindi awtorisadong lumapit ay papatayin.[b]
  to: Ngunit ikaw at ang iyong mga anak na kasama mo ay mangangalaga sa inyong pagkapari, sa lahat ng nauukol sa altar at sa loob ng tabing; maglilingkod kayo. Ipinagkakaloob ko sa inyo ang inyong pagkapari bilang isang kaloob na paglilingkod.[a] Ngunit ang sinumang hindi awtorisadong lumapit ay papatayin.[b]
  rationale: Pinalitan ang pariralang tumutukoy sa espasyong nasa loob ng tabing upang maiwasan ang labis na pagpapakahulugan at maging mas natural sa Tagalog. Ginamit ang “pagkapari” bilang mas tuwiran at pare-parehong katumbas ng כְּהֻנָּה. Pinanatili ang sinadyang kalabuan ng עֲבֹדַת מַתָּנָה sa pangunahing teksto at talababa, pati ang di-etnikong diwa ng זָר.
