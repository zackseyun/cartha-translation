  text: וְ/אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִ֠תְּ/ךָ תִּשְׁמְר֨וּ אֶת כְּהֻנַּתְ/כֶ֜ם לְ/כָל דְּבַ֧ר הַ/מִּזְבֵּ֛חַ וּ/לְ/מִ/בֵּ֥ית לַ/פָּרֹ֖כֶת וַ/עֲבַדְתֶּ֑ם עֲבֹדַ֣ת מַתָּנָ֗ה אֶתֵּן֙ אֶת כְּהֻנַּתְ/כֶ֔ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: tl
  text: Ngunit ikaw at ang iyong mga anak na kasama mo ay mangangalaga sa inyong pagkapari, sa lahat ng nauukol sa altar at sa loob ng tabing; maglilingkod kayo. Ipinagkakaloob ko sa inyo ang inyong pagkapari bilang isang kaloob na paglilingkod.[a] Ngunit ang sinumang hindi awtorisadong lumapit ay papatayin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang paglilingkod na ibinigay bilang kaloob.” Maaaring idiin ng Hebreong parirala na ang paglilingkod mismo ay kaloob, o na ang pagkapari ay ipinagkaloob upang maglingkod.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang salitang isinaling “hindi awtorisado” ay literal na “tagalabas” o “estranghero.” Dito, tumutukoy ito sa sinumang walang pahintulot na gumanap ng tungkuling pangpari, hindi lamang sa isang dayuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: mangangalaga
  rationale: Ipinapahayag ng שׁמר ang maingat na pagbabantay at pagtupad sa ipinagkatiwalang pananagutang pangpari.
- source_word: כְּהֻנַּתְכֶם
  choice: inyong tungkulin bilang mga pari
  rationale: Tumutukoy ito sa katungkulan at gawain ng pagkapari; mas malinaw ito sa karaniwang modernong Tagalog kaysa sa abstraktong 'pagkapari' lamang.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: sa lahat ng nauukol sa altar
  rationale: Pinananatili ang malawak na saklaw ng דָּבָר nang hindi nililimitahan sa isang partikular na ritwal.
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: at sa nasa kaloob-looban ng tabing
  rationale: Ipinahihiwatig ng parirala ang bahagi o mga bagay sa panloob na dako ng tabing ng santuwaryo.
- source_word: וַעֲבַדְתֶּם
  choice: maglilingkod kayo
  rationale: Ang עבד sa kontekstong ito ay banal na paglilingkod ng mga pari; likas at hindi labis na teknikal ang salin.
- source_word: עֲבֹדַת מַתָּנָה
  choice: isang kaloob na paglilingkod
  rationale: Pinananatili ang masinsing ugnayan ng 'paglilingkod' at 'kaloob' habang iniiwan sa talababa ang posibleng ibang pagkakaugnay ng dalawang pangngalan.
- source_word: אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: Ibinibigay ko sa inyo ang inyong tungkulin bilang mga pari
  rationale: Ang kasalukuyang anyong 'Ibinibigay ko' ay angkop sa tuwirang pahayag ng Diyos tungkol sa pagkakaloob ng katungkulan.
- source_word: הַזָּר
  choice: ang sinumang hindi awtorisado
  rationale: Sa batas pangpari, tumutukoy ang זָר sa taong walang pahintulot sa gawaing ito, hindi kinakailangang sa isang dayuhan.
- source_word: הַקָּרֵב
  choice: lumapit
  rationale: Pinananatili ang literal at panritwal na diwa ng paglapit sa ipinagbabawal na banal na saklaw.
- source_word: יוּמָת
  choice: papatayin
  rationale: Ang Hophal ay pasibo at may puwersang legal, kaya tumutukoy sa paglalapat ng parusang kamatayan, hindi lamang sa pagkamatay.
theological_decisions:
- issue: Kahulugan ng זָר sa batas pangpari
  choice: ang sinumang hindi awtorisado
  alternative: ang tagalabas; ang estranghero
  rationale: Nililinaw nito na ang usapin ay kawalan ng pahintulot sa tungkuling pangpari, hindi lahi o pagiging banyaga.
- issue: Ugnayan ng עֲבֹדַת מַתָּנָה sa pagkakaloob ng pagkapari
  choice: isang kaloob na paglilingkod
  alternative: isang paglilingkod na ibinigay bilang kaloob
  rationale: Hindi ganap na tiyak ang masinsing sintaks ng Hebreo; pinananatili ng pangunahing salin ang dalawang ideya at inilalahad sa talababa ang makatwirang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'tungkulin bilang mga pari' upang maging malinaw sa karaniwang mambabasa, at 'tabing' para sa kurtinang naghihiwalay sa banal na panloob na dako. Inilagay ang bawat talababa kaagad sa pahayag na ipinapaliwanag nito.
