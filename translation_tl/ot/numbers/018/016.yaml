  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: tl
  text: 'At ang mga dapat tubusin ay tutubusin mo mula sa isang buwang gulang, ayon sa iyong pagtataya: limang siklong pilak, ayon sa siklo ng santuwaryo; ito[a] ay dalawampung gera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tahasan, “ang siklo ay dalawampung gera.” Ang panghalip na “ito” sa Hebreo ay tumutukoy sa siklo ng santuwaryo bilang pamantayang timbang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: ang mga dapat tubusin
  rationale: Ang anyong participle na may hulaping panghalip ay mahirap tumbasan nang literal. Sa konteksto, tumutukoy ito sa mga panganay na saklaw ng pagtubos; pinananatili ng pariralang ito ang pasibong diwa at ang pangkalahatang bisa ng tuntunin.
- source_word: מִבֶּן חֹדֶשׁ
  choice: mula sa gulang na isang buwan
  rationale: Ipinapahayag ng idyomang Hebreo ang simula ng itinakdang edad para sa pagtubos.
- source_word: תִּפְדֶּה
  choice: tutubusin mo
  rationale: Ang imperfect na ikalawang panauhang panlalaki sa legal na tagubilin ay nagsasaad ng obligasyon; natural itong ipinahahayag sa Filipino sa anyong panghinaharap.
- source_word: בְּעֶרְכְּךָ
  choice: ayon sa halagang itinakda mo
  rationale: Sa kontekstong legal at pangsaserdote, ang ערך ay tumutukoy sa tinayang o itinakdang halaga, at pinananatili ng “mo” ang tuwirang pagtukoy sa kausap.
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: limang siklong pilak
  rationale: Ito ang malinaw at likas na ayos sa Filipino para sa sukat ng pilak.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Tinutukoy ng parirala ang opisyal na pamantayang timbang na kaugnay ng santuwaryo.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: ito ay dalawampung gera
  rationale: Pinananatili nito ang panghalip ng Hebreo at ang paglilinaw sa katumbas na timbang, habang ipinapaliwanag sa talababa ang tinutukoy ng “ito.”
