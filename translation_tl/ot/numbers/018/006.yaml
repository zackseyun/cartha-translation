  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: tl
  text: At ako mismo—narito—ang kumuha sa inyong mga kapatid na mga Levita mula sa mga anak ni Israel[a]. Sila ay kaloob sa inyo, na ibinigay kay Yahweh upang gampanan ang paglilingkod sa Tolda ng Tagpuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa mga Israelita.” Sa Hebreo, “mula sa mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: At ako mismo—masdan ninyo—
  rationale: Pinananatili ang pagpapatuloy ng וַ, ang diin ng tahasang panghalip na אֲנִי, at ang pansin-emphasis ng הִנֵּה sa isang marangal ngunit mauunawaang anyong Tagalog.
- source_word: לָקַחְתִּי
  choice: ang kumuha
  rationale: Ginagamit ang payak na diwa ng ‘kumuha’ at hindi ang mas interpretibong ‘pumili’; ipinahihiwatig ng buong pahayag ang nananatiling bisa ng ginawa ng Diyos.
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: sa mga kapatid ninyo, ang mga Levita
  rationale: Pinananatili ang pananalitang pampamilya na ‘mga kapatid’ at nililinaw sa apposition na ang tinutukoy ay ang mga Levita.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  rationale: Malapit sa anyong Hebreo at ipinakikitang ibinukod ang mga Levita mula sa mas malawak na sambayanan ng Israel.
- source_word: לָכֶם מַתָּנָה נְתֻנִים לַיהוָה
  choice: Ibinigay ko sila sa inyo bilang isang kaloob; ibinigay sila kay Yahweh
  rationale: 'Pinananatili ang pag-uulit ng wikang ‘kaloob/ibinigay’ at ang dalawang ugnayan: kaloob sila sa mga saserdote, ngunit nakatalaga at ibinigay kay Yahweh.'
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: upang gampanan ang paglilingkod
  rationale: Likas na Tagalog na naghahatid sa kaugnay na pandiwa at pangngalan ng Hebreo nang hindi gumagamit ng alanganing tuwirang pag-uulit.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagtitipon
  rationale: Tuwirang inilalarawan ang toldang itinakda para sa pakikipagtagpo at banal na paglilingkod, nang hindi ito ipinagkakamali sa ibang katawagang teolohikal.
theological_decisions:
- issue: Paglalarawan sa kaugnayan ng mga Levita kay Aaron at kay Yahweh
  choice: kaloob sa inyo; ibinigay kay Yahweh
  alternative: ibinigay sa inyo para kay Yahweh
  rationale: Hindi pinagsasanib ang dalawang pariralang dative. Pinananatili ang tensiyon ng teksto na ang mga Levita ay kaloob sa mga saserdote at kasabay nito'y ibinigay kay Yahweh.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh, ayon sa tahasang anyo ng tekstong Hebreo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang larawang pampamilya ng Hebreo, habang inilalagay sa talababa ang mas idyomatikong katumbas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang ‘masdan ninyo’ upang mapanatili ang solemneng diin ng הִנֵּה, at ang semicolon upang malinaw ngunit hindi mapawi ang magkaugnay na ideya ng pagiging kaloob sa mga saserdote at pagiging ibinigay kay Yahweh.
