reference: Numbers 18:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: tl
  text: Ito ang magiging iyo mula sa pinakabanal na mga handog, mula sa apoy:[a] bawat handog nila, bawat handog na butil nila, bawat handog para sa kasalanan nila,[b] at bawat handog para sa pagkakasala nila,[c] na ibinabalik nila sa akin. Ito ay kabanal-banalan para sa iyo at sa iyong mga anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mula sa apoy.” Sa konteksto, malamang na tumutukoy ito sa bahaging inilaan mula sa mga handog na inihaharap sa pamamagitan ng apoy.
    reason: lexical_alternative
  - marker: b
    text: Ang “handog para sa kasalanan” ay maaari ding isaling “handog para sa paglilinis.”
    reason: lexical_alternative
  - marker: c
    text: Ang “handog para sa pagkakasala” ay maaari ding isaling “handog na pambayad-pinsala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: mula sa mga kabanal-banalang handog
  rationale: Ang superlatibong parirala ay tumutukoy sa pinakamataas na antas ng kabanalan ng mga handog, hindi sa silid na Kabanal-banalan; idinagdag ang “handog” upang maging malinaw ang tinutukoy sa konteksto.
- source_word: מִן הָאֵשׁ
  choice: mula sa apoy
  rationale: Pinananatili ang literal at medyo masalimuot na Hebreong parirala sa halip na tahimik na ipakahulugang “bahaging hindi sinusunog”; inilalahad sa talababa ang malamang na kontekstuwal na diwa.
- source_word: קָרְבָּנָם
  choice: bawat handog nila
  rationale: Ang קָרְבָּן ay pangkalahatang katawagan sa handog na inilalapit sa Diyos; natural at malawak ang “handog” sa Filipino.
- source_word: מִנְחָתָם
  choice: bawat handog na pagkaing butil nila
  rationale: Sa kontekstong panghain, tumutukoy ito sa handog na mula sa butil; malinaw ang anyong ito sa karaniwang mambabasa.
- source_word: חַטָּאתָם
  choice: bawat handog para sa kasalanan nila
  rationale: Malinaw na handog ang tinutukoy sa listahang ito. Pinananatili ng “para sa kasalanan” ang tradisyonal na ugnayan nito sa kasalanan, habang inilalagay sa talababa ang ritwal na alternatibong “handog para sa paglilinis.”
- source_word: אֲשָׁמָם
  choice: bawat handog para sa pagkakasala nila
  rationale: Ipinahahayag ang karaniwang diwa ng guilt offering nang hindi ipinapalagay na kabayaran lamang ang saklaw; ang reparatoryong alternatibo ay nasa talababa.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: na ibinabalik nila sa akin
  rationale: Pinananatili ang causative/restorative na larawan ng Hiphil ng שׁוב, kahit maaaring maunawaan din bilang paghahandog o pagbibigay sa Diyos.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Sa panaguring gamit, inilalarawan nito ang katayuang pangritwal ng mga bahaging ito bilang nasa pinakamataas na antas ng kabanalan.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: para sa iyo at sa iyong mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ni Aaron ang tinutukoy sa kontekstong makasaserdote, kaya hindi ginawang pangkalahatan bilang “mga anak” lamang.
theological_decisions:
- issue: Paglalarawan sa antas ng kabanalan nang hindi ito ipinagkakamali sa loob na silid ng santuwaryo
  choice: mga kabanal-banalang handog / kabanal-banalan
  alternative: mga bagay na banal sa mga banal / Kabanal-banalan
  rationale: Sa talata, klasipikasyon ng mga hain ang tinutukoy, hindi ang heograpikong bahagi ng santuwaryo.
- issue: Kasarian ng mga inapo ni Aaron na tatanggap ng mga handog
  choice: mga anak na lalaki
  alternative: mga anak / mga inapo
  rationale: Tahasan ang Hebreong “mga anak na lalaki,” at mahalaga ang kasarian sa partikular na konteksto ng tungkuling makasaserdote.
- issue: Diwa ng “mula sa apoy”
  choice: panatilihin sa teksto ang literal na parirala at ipaliwanag sa talababa
  alternative: bahaging inilaan at hindi sinunog sa apoy
  rationale: Hindi ganap na tahasang sinasabi ng Hebreo ang salitang “inilaan” o “hindi sinunog.” Ang talababa ang naglilinaw sa malamang na diwang pangritwal nang hindi inaalis ang tunay na pagiging masalimuot ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kabanal-banalan” bilang terminong pangritwal, “pagkaing butil” para sa malinaw na paglalarawan ng grain offering, at “mga anak na lalaki” upang panatilihin ang tiyak na reperensiyang panlalaki. Ang mga talababa ay inayos sa mismong terminong tinutukoy at lahat ng marker [a]–[c] ay nasa pangunahing teksto.
