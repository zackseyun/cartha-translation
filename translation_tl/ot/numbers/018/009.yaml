revisions:
- from: Ito ang magiging para sa iyo mula sa mga kabanal-banalang handog, mula sa apoy:[a] bawat handog nila, bawat handog na pagkaing butil nila, bawat handog para sa kasalanan nila,[b] at bawat handog para sa pagkakasala nila,[c] na ibinabalik nila sa akin. Ito ay kabanal-banalan para sa iyo at sa iyong mga anak na lalaki.
  to: Ito ang magiging iyo mula sa pinakabanal na mga handog, mula sa apoy:[a] bawat handog nila, bawat handog na butil nila, bawat handog para sa kasalanan nila,[b] at bawat handog para sa pagkakasala nila,[c] na ibinabalik nila sa akin. Ito ay kabanal-banalan para sa iyo at sa iyong mga anak na lalaki.
  rationale: Inayos ang pambungad upang maging wastong modernong Tagalog (‘magiging iyo’) nang hindi binabago ang pag-angkin o saklaw ng Hebreo. Pinalitan ang ‘mga kabanal-banalang handog’ ng ‘pinakabanal na mga handog’ upang malinaw na klasipikasyon ito ng mga handog at hindi pangalan ng silid ng santuwaryo. Pinagaan din ang termino para sa grain offering bilang ‘handog na butil.’ Walang binagong kahulugan sa mga talababa o marker.
