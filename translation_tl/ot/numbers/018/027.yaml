  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: tl
  text: At ang inyong handog[a] ay ibibilang sa inyo[b] na gaya ng butil mula sa giikan at gaya ng buong ani mula sa pisaan ng ubas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ambag”; ayon sa tradisyon, “handog na itinaas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ituturing para sa inyo.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “kapuspusan mula sa pisaan,” ibig sabihin, ang buong ani o produktong nagmumula sa pisaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: ay ituturing
  rationale: Ang Niphal ng חשׁב ay nagpapahayag na ang handog ay kikilalanin o ibibilang na katumbas ng ani; natural sa modernong Tagalog ang “ituturing” at napapanatili nito ang diwa ng legal at ritwal na pagkilala.
- source_word: תְּרוּמַתְכֶם
  choice: inyong handog
  rationale: Ang תְּרוּמָה ay ambag na ibinukod para sa banal na gamit. Malinaw at marangal ang “handog” sa Tagalog; iniiwasan nito ang artipisyal na literalismong “handog na itinaas.”
- source_word: כַּדָּגָן
  choice: gaya ng butil
  rationale: Ang דָּגָן ay butil o aning cereal; pinananatili ng “gaya ng butil” ang paghahambing at larawang agrikultural.
- source_word: מִן הַגֹּרֶן
  choice: mula sa giikan
  rationale: Ang גֹּרֶן ay lugar ng paggiik. Ang “giikan” ay maikli, tumpak, at kinikilalang salitang Tagalog.
- source_word: וְכַמְלֵאָה
  choice: at gaya ng buong ani
  rationale: Literal na “kapuspusan” ang מְלֵאָה, ngunit sa parallelismong agrikultural ay tumutukoy ito sa buong bunga o ani. Ang “buong ani” ay natural at malinaw nang hindi nawawala ang ideya ng kabuuang produkto.
- source_word: מִן הַיָּקֶב
  choice: mula sa pisaan ng ubas
  rationale: Ang יֶקֶב ay pisaan o imbakan na kaugnay ng paggawa ng alak. Nililinaw ng “pisaan ng ubas” ang kongkretong larawang agrikultural para sa karaniwang mambabasa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “giikan” at “pisaan ng ubas” upang mapanatili ang agrikultural na parallelismo, habang ang “buong ani” ay naghahatid ng diwa ng literal na “kapuspusan” sa natural na Tagalog.
