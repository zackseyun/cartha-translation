  to: Lahat ng pinakamainam na bahagi[a] ng langis, at lahat ng pinakamainam na bahagi ng bagong alak at butil—ang mga unang bunga ng mga ito, na ibinibigay nila kay Yahweh—ay ibinigay ko sa iyo.
  rationale: 'Ginawa lamang ang isang ligtas na estilistikong paglilinaw: pinalitan ang “mga iyon” ng mas natural na “mga ito” at nilagyan ng kuwit ang restriktibong estruktura upang malinaw ang kaugnayan ng sugnay. Walang binago sa kahulugan, saklaw ng mga produkto, o antas ng katiyakan ng Hebreo.'
