  text: כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְ/כָל חֵ֖לֶב תִּיר֣וֹשׁ וְ/דָגָ֑ן רֵאשִׁיתָ֛/ם אֲשֶׁר יִתְּנ֥וּ לַֽ/יהוָ֖ה לְ/ךָ֥ נְתַתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: tl
  text: Lahat ng pinakamainam na bahagi[a] ng langis, at lahat ng pinakamainam na bahagi ng bagong alak at butil—ang mga unang bunga ng mga ito, na ibinibigay nila kay Yahweh—ay ibinigay ko sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “taba” ng langis, bagong alak, at butil—isang idyoma para sa pinakapili o pinakamainam na bahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: pinakamainam na bahagi
  rationale: Literal itong “taba,” ngunit sa konteksto ng ani ay isang idyoma para sa pinakapili o pinakamainam na bahagi. Likas at malinaw sa Filipino ang “pinakamainam na bahagi.”
- source_word: יִצְהָר
  choice: langis
  rationale: Tumutukoy ito sa sariwang langis, karaniwang langis ng olibo. Hindi idinagdag ang “olibo” dahil hindi iyon tahasang nasa salita.
- source_word: תִּירוֹשׁ
  choice: bagong alak
  rationale: Pinananatili nito ang diwa ng bagong nagawang alak at ang pagkakaiba nito sa mas pangkalahatang mga salitang Hebreo para sa alak.
- source_word: דָגָן
  choice: butil
  rationale: Malawak itong tawag sa mga aning butil; ang “butil” ay maikli, natural, at hindi naglilimita sa isang uri ng pananim.
- source_word: רֵאשִׁיתָם
  choice: mga unang bunga ng mga iyon
  rationale: Sa konteksto ng handog mula sa ani, tumutukoy ito sa unang bahagi o mga unang bunga. Ipinahahayag ng “ng mga iyon” ang hulaping tumutukoy pabalik sa langis, bagong alak, at butil.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: na ibinibigay nila kay Yahweh
  rationale: Ang pangkasalukuyang anyo ay natural na nagpapahayag ng nakagawiang pagbibigay; pinananatili ang pangalang Yahweh para sa tetragrammaton.
- source_word: לְךָ נְתַתִּים
  choice: ibinigay ko sa iyo
  rationale: Ipinahahayag ng perpektong pandiwa ang kaloob bilang naitakda na. Ang “iyo” ay isahan, gaya ng kausap sa Hebreo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginamit ang transliterasyong “Yahweh” upang tahasang katawanin ang personal na pangalang nasa tekstong Hebreo at umayon sa ibinigay na English POB consultation layer, nang hindi nagpapasok ng interpretasyong denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang em dash upang malinaw na ipaliwanag na ang tinutukoy na pinakamainam na bahagi ay ang mga unang bunga na ibinibigay kay Yahweh.
