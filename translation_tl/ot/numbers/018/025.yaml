lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive kasama ng דִּבֵּר ay nagsasaad ng susunod na hakbang sa salaysay; pinananatili ng “At nagsalita” ang pormal na diwa at likas ang daloy sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa pinatutungkulan ng pagsasalita; “kay” ang natural na pananda sa Filipino para sa pangalang pantangi.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang paulit-ulit na pormulang Hebreo na nagpapakilala sa tuwirang pahayag, kahit medyo pormal ang tunog sa Filipino.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ang talata ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na ipalit ang isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang “na sinasabi” ay sadyang nagpapanatili sa pormal na pormulang Hebreo na לֵאמֹר at naghahanda sa kasunod na tuwirang pahayag.
