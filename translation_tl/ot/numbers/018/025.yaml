  text: 'At nagsalita si Yahweh kay Moises[a] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; kinaugaliang isalin na “ang PANGINOON.”'
