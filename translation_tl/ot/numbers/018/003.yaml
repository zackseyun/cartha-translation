revisions:
- from: Tutuparin nila ang tungkuling ipinagkatiwala mo sa kanila at ang tungkulin para sa buong tolda. Ngunit hindi sila lalapit sa mga kagamitan ng santuwaryo o sa altar, kung hindi'y mamamatay kapwa sila at kayo.
  to: Gagampanan nila ang tungkuling iniatas sa iyo at ang tungkulin para sa buong tolda. Ngunit hindi sila lalapit sa mga kagamitan ng santuwaryo o sa altar, upang hindi mamatay kapwa sila at kayo.
  rationale: Inalis ang hindi tahasang ideya na si Aaron ang nagkatiwala ng tungkulin sa mga Levita. Pinanatili ang pag-uulit ng “tungkulin,” ang tuwirang “tolda,” at ang saklaw ng babala sa kapwa sila at kayo. Pinalitan ang kondisyonal na “kung hindi’y” ng layuning “upang hindi” upang mas maayos na maipakita ang negatibong sugnay ng Hebreo at ang idiomatikong daloy sa Tagalog.
