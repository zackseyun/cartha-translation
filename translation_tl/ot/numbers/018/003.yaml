base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: tl
  text: Gagampanan nila ang tungkuling iniatas sa iyo at ang tungkulin para sa buong tolda. Ngunit hindi sila lalapit sa mga kagamitan ng santuwaryo o sa altar, upang hindi mamatay kapwa sila at kayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: Tutuparin nila ang tungkuling ipinagkatiwala mo sa kanila
  rationale: Ang שׁמר kasama ng מִשְׁמֶרֶת ay tumutukoy sa maingat na pagtupad sa isang iniatas na pananagutan. Mas likas sa modernong Tagalog ang pariralang ito kaysa sa literal na “babantayan nila ang iyong pagbabantay,” at pinananatili nitong si Aaron ang tuwirang kinakausap.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: at ang tungkulin para sa buong tolda
  rationale: Inuulit ang “tungkulin” upang mapanatili ang ugnayang leksikal, habang ang כָּל at הָאֹהֶל ay tuwirang isinasaling “buong tolda.”
- source_word: אַךְ
  choice: Ngunit
  rationale: Ipinahihiwatig ng אַךְ ang mahigpit na limitasyon o eksepsiyon sa naunang atas; malinaw at natural itong ipinapahayag ng “Ngunit.”
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: sa mga kagamitan ng santuwaryo
  rationale: Ang כְּלֵי ay malawak na katawagan para sa mga kagamitan, sisidlan, o kasangkapan, at ang הַקֹּדֶשׁ dito ay tumutukoy sa banal na dako o santuwaryo. Hindi nililimitahan ng “mga kagamitan” ang kahulugan sa mga sisidlan lamang.
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יִקְרָבוּ
  choice: o sa altar, hindi sila lalapit
  rationale: Sa negatibong pangungusap, natural sa Tagalog ang “o” para sa alinman sa dalawang ipinagbabawal lapitan. Pinananatili ng “lalapit” ang pisikal at ritwal na diwa ng קרב.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַם אַתֶּם
  choice: kung hindi'y mamamatay kapwa sila at kayo
  rationale: Ipinapahayag ng “kung hindi’y” ang bantang bunga ng paglabag, samantalang tuwirang pinananatili ng “kapwa sila at kayo” ang גַם...גַם at ang pagkakasangkot ng dalawang pangkat.
theological_decisions:
- issue: Sino ang kinakausap at sino ang pinagbawalang lumapit
  choice: Si Aaron ang kinakausap, at ang mga Levita ang tinutukoy na tutupad sa atas ngunit hindi lalapit sa mga sagradong kagamitan o sa altar.
  alternative: Maaaring unawain ang ikalawang panauhan bilang tumutukoy nang mas malawak sa mga pari.
  rationale: Isahan at panlalaki ang hulaping -ךָ sa מִשְׁמַרְתְּךָ, na sa konteksto ay tumutukoy kay Aaron; hindi nito binubura ang kaugnayan ng babala sa mga paring kasama niya.
- issue: Saklaw ng bantang kamatayan
  choice: Kasama sa panganib ang mga Levita at ang kinakausap na pangkat—si Aaron at ang mga pari.
  alternative: Ang mga Levita lamang ang mamamatay.
  rationale: Malinaw na isinasama ng גַם הֵם גַם אַתֶּם ang “sila” at “kayo,” kaya hindi dapat paliitin ang babala sa isang pangkat lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tolda” para sa tuwirang kahulugan ng הָאֹהֶל at “santuwaryo” para sa sagradong dako. Iniwasan ang masyadong literal ngunit di-likas na “inyong pagbabantay,” gayundin ang pagdaragdag ng denominasyonal na paliwanag.
