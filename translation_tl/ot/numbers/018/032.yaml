  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: tl
  text: At hindi kayo magkakasala dahil dito kapag ibinukod ninyo mula rito ang pinakamainam na bahagi nito.[a] Huwag ninyong lapastanganin ang mga banal na bagay ng mga anak ni Israel,[b] at hindi kayo mamamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang taba nito.” Sa mga konteksto ng handog, ang salitang Hebreo ay madalas tumukoy sa pinakapili o pinakamainam na bahagi.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Israel,” isang karaniwang katawagan sa sambayanang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: hindi kayo magkakasala
  rationale: Ang pariralang Hebreo ay tumutukoy sa pagdadala ng kasalanan o pananagutan. Ang saling ito ay natural sa makabagong Tagalog at malinaw na nagpapahayag na hindi sila magkakaroon ng kasalanan sa bagay na ito.
- source_word: עָלָיו
  choice: dahil dito
  rationale: Tumutukoy ito sa naunang usapin tungkol sa ikapu at handog at nagpapahayag ng pananagutan kaugnay nito.
- source_word: בַּהֲרִימְכֶם
  choice: kapag ibinukod ninyo
  rationale: Ang Hiphil ng רום ay maaaring mangahulugang itaas o ihandog bilang ambag. Sa kontekstong ito, ang 'ibinukod' ay malinaw na naghahatid ng pagtatabi ng banal na ambag nang hindi nagmumungkahi ng pisikal na pagtataas lamang.
- source_word: חֶלְבּוֹ
  choice: ang pinakamainam na bahagi nito
  rationale: Bagaman literal na 'taba,' ang חֶלֶב sa ganitong konteksto ng handog ay idyomatikong tumutukoy sa pinakapili o pinakamainam na bahagi.
- source_word: מִמֶּנּוּ
  choice: mula rito
  rationale: Tumutukoy sa ikapu o kabuuang bahagi kung saan ibinubukod ang pinakamainam na bahagi.
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: ang mga banal na bagay ng mga anak ni Israel
  rationale: Pinananatili ng 'mga banal na bagay' ang malawak na saklaw ng קָדְשֵׁי, at ng 'mga anak ni Israel' ang tradisyonal at pormal na anyo ng etnikong katawagan.
- source_word: תְחַלְּלוּ
  choice: lapastanganin
  rationale: Ang Piel ng חלל ay nangangahulugang gawing di-banal, dungisan, o lapastanganin ang banal. Ang 'lapastanganin' ay dignified at malinaw sa kontekstong panrelihiyon.
- source_word: וְלֹא תָמֻתוּ
  choice: at hindi kayo mamamatay
  rationale: Pinananatili nito ang tuwirang koordinasyon ng Hebreo at hindi nagdaragdag ng tahasang layunin gaya ng 'upang,' bagaman nauunawaan sa konteksto ang kamatayan bilang kahihinatnang maiiwasan sa pagsunod.
theological_decisions:
- issue: Pagpapakahulugan sa חֶלֶב sa konteksto ng handog
  choice: ang pinakamainam na bahagi nito
  alternative: ang taba nito / ang pinakapiling bahagi nito
  rationale: Hindi espesipikong taba ng hayop ang paksa kundi ang bahagi ng ikapu na ihihiwalay. Iniiwasan ng salin ang maling pagkaunawa habang pinananatili ang diwa na ang pinakamahusay na bahagi ang inilalaan.
- issue: Pagsasalin sa בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanang Israel
  rationale: Pinananatili nito ang anyo ng karaniwang katawagang tipan sa Hebreo nang hindi nililimitahan ang tinutukoy sa mga lalaking anak lamang.
- issue: Ugnayan ng huling sugnay
  choice: at hindi kayo mamamatay
  alternative: upang hindi kayo mamatay / kung hindi ay mamamatay kayo
  rationale: Ang waw at negatibong imperfect ay pormal na koordinado. Ang saling pinili ay nagpapanatili ng tensiyon sa pagitan ng pangako, bunga, at babala sa halip na tahasang piliin ang isang purposive o conditional na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang 'ibinukod' upang maging natural ang ritwal na pagtatabi ng ambag, at ang 'lapastanganin' upang mapanatili ang malinaw na pagsalungat ng banal at di-banal. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
