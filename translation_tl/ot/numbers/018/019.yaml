base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: tl
  text: Lahat ng mga handog mula sa mga banal na bagay na iniaangat ng mga anak ni Israel para sa PANGINOON ay ibinigay ko sa iyo, pati sa iyong mga anak na lalaki at babae na kasama mo, bilang isang tuntunin magpakailanman. Ito ay isang walang-hanggang tipan ng asin sa harap ng PANGINOON para sa iyo at sa iyong mga supling na kasama mo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּרוּמֹת
  choice: mga handog
  rationale: Sa kontekstong pari, tumutukoy ito sa mga bahaging inilalaan o itinataas bilang handog; ang “mga handog” ang pinakanatural at malinaw sa modernong Tagalog.
- source_word: הַקֳּדָשִׁים
  choice: mga banal na bagay
  rationale: Pinananatili ang malawak na saklaw ng Hebrew sa halip na paliitin ito sa isang tiyak na uri ng handog.
- source_word: יָרִימוּ
  choice: inihahandog
  rationale: Literal itong “itinataas,” ngunit idiomatikong tumutukoy sa paghahandog o paglalaan; “inihahandog” ang natural na katumbas sa Tagalog.
- source_word: חָק עוֹלָם
  choice: isang tuntunin magpakailanman
  rationale: Pinananatili ang legal at pangmatagalang diwa ng parirala nang hindi gumagamit ng sobrang teknikal na pananalita.
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: isang walang-hanggang tipan ng asin
  rationale: Pinananatili ang natatanging metaporang “tipan ng asin” at ang pangmatagalang bisa nito.
- source_word: זַרְעֲךָ
  choice: iyong mga supling
  rationale: Ang kolektibong “supling” ay tumpak sa Hebrew at hindi nililimitahan sa agarang mga anak lamang.
theological_decisions:
- issue: Kahulugan ng “tipan ng asin”
  choice: Pinanatili bilang “tipan ng asin” nang walang pagpapaliwanag sa pangunahing teksto.
  alternative: Isalin nang interpretatibo bilang “di-masisirang tipan” o “pangmatagalang tipan.”
  rationale: Ang ekspresyon ay isang tunay na metapora sa pinagmulan; ang pagpapalit nito ng isang interpretasyon ay mag-aalis ng imahen at maaaring magtakda ng iisang kahulugan na hindi tahasang sinasabi ng teksto.
- issue: Saklaw ng pangakong ibinigay kay Aaron
  choice: “para sa iyo at sa iyong mga supling na kasama mo”
  alternative: “para sa iyo at sa iyong sambahayan”
  rationale: Pinananatili ang tahasang pagtukoy sa supling at ang pariralang “kasama mo,” sa halip na palawakin ito sa buong sambahayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “PANGINOON” para sa tetragrammaton, alinsunod sa karaniwang tradisyon ng salin. Hindi nilagyan ng footnote dahil kayang panatilihin sa teksto ang mahahalagang termino at metapora nang hindi kinakailangang lutasin ang mga ito.
