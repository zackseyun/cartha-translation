  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: tl
  text: Sasama sila sa iyo at tutuparin nila ang tungkuling nauukol sa Tolda ng Pagtitipon para sa lahat ng paglilingkod sa tolda. Ngunit walang tagalabas[a] na lalapit sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinumang hindi awtorisadong tao.” Ang salitang Hebreo rito ay tumutukoy sa taong wala sa pinahihintulutang tungkulin sa santuwaryo, hindi kinakailangang dayuhan sa lahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: Sasama sila sa iyo
  rationale: Ipinahahayag ng Nifal ng לוה kasama ng עַל ang paglakip kay Aaron upang tumulong sa paglilingkod. Likas sa modernong Tagalog ang “sasama sa iyo” at hindi nito ipinapalagay kung kusang-loob o itinakda ang paglakip.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת
  choice: at tutuparin nila ang tungkulin
  rationale: Sa kontekstong pangsantuwaryo, ang pariralang ito ay tumutukoy sa pagtupad sa ipinagkatiwalang pananagutan. Mas malinaw sa karaniwang mambabasa ang “tutuparin ang tungkulin” kaysa sa literal ngunit di-likas na “iingatan ang pag-iingat.”
- source_word: אֹהֶל מוֹעֵד
  choice: Tolda ng Pagtitipon
  rationale: Tuwirang inililipat nito ang katawagan sa santuwaryo bilang tolda ng itinakdang pakikipagtagpo o pagtitipon, sa malinaw at marangal na Tagalog.
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  choice: para sa lahat ng paglilingkod sa tolda
  rationale: Ang עֲבֹדָה rito ay paglilingkod na kaugnay ng santuwaryo, hindi lamang pangkalahatang paggawa.
- source_word: וְזָר
  choice: Ngunit walang tagalabas
  rationale: Ang זָר sa batas ng santuwaryo ay taong wala sa pinahihintulutang tungkulin, hindi kinakailangang dayuhan sa lahi. Pinananatili ng “tagalabas” ang ideya ng pagiging labas sa awtorisadong pangkat, at nililinaw ito sa talababa.
- source_word: יִקְרַב אֲלֵיכֶם
  choice: na lalapit sa inyo
  rationale: Pinananatili ng “lalapit” ang diwang pangsantuwaryo ng pagpasok sa sagradong kalapitan. Ang “inyo” ay nagpapakita ng maramihang kausap sa Hebreo.
theological_decisions:
- issue: Kahulugan ng זָר sa mga batas ng santuwaryo
  choice: tagalabas—isang taong wala sa pinahihintulutang tungkuling pangsantuwaryo
  alternative: dayuhan; estranghero; taong hindi awtorisado
  rationale: Ang konteksto ay pahintulot na lumapit at maglingkod sa santuwaryo, hindi pinagmulang etniko. Iniwasan ang “dayuhan” upang hindi ipahiwatig na lahi o bayan ang batayan ng pagbabawal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Tolda ng Pagtitipon” bilang pangalan ng santuwaryo at “paglilingkod” para mapanatili ang kontekstong panrelihiyon nang hindi gumagamit ng makaluma o labis na teknikal na pananalita.
