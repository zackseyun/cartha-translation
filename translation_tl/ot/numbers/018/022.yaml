  naturalness: Nauunawaan ang ‘toldang tipanan,’ ngunit mas likas at matatag na katawagan sa modernong Filipino para sa terminong pang-santuwaryo ang ‘Tolda ng Tipanan.’ Ang talababa ay dapat ikabit mismo sa ‘magdala ng kasalanan,’ ang pariralang ipinaliliwanag nito, sa halip na sa dulo ng pangungusap.
