  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: tl
  text: At hindi na lalapit ang mga anak ni Israel sa Tolda ng Tipanan, upang hindi sila magdala ng kasalanan[a] at mamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magkaroon ng pananagutan sa kasalanan.” Sa Hebreo, literal na “magdala ng kasalanan,” isang pangkultiko at legal na pananalita tungkol sa pagpasan ng pananagutan dahil sa pagkakasala.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: lalapit
  rationale: Likas at malinaw na salin ng קרב, at napapanatili ang diwa ng paglapit sa banal na lugar.
- source_word: עוֹד
  choice: hindi na
  rationale: Kasama ng לֹא, ipinahihiwatig nito ang ‘no longer’ o ‘hindi na,’ hindi lamang isang pagbabawal sa iisang pagkakataon.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pormal na tinutumbasan ang Hebreong parirala habang tumutukoy nang sama-sama sa sambayanang Israel.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Ang מוֹעֵד ay maaaring tumukoy sa itinakdang pakikipagtagpo; ang ‘toldang tipanan’ ay likas at dignified na katawagang Filipino para sa santuwaryong ito.
- source_word: לָשֵׂאת חֵטְא
  choice: magdala ng kasalanan
  rationale: Pinananatili ang konkretong idyomang Hebreo na ‘magdala/pasanin ang kasalanan’ at ang sadyang lawak nito sa kontekstong legal at panrelihiyon.
- source_word: לָמוּת
  choice: at mamatay
  rationale: Tuwirang pinananatili ang pagkakasunod ng Hebreo at malinaw na inilalahad ang nakamamatay na kahihinatnan.
theological_decisions:
- issue: Kung tahasang ipaliliwanag na di-awtorisadong paglapit sa banal na lugar ang ipinagbabawal at na nagdudulot ito ng pananagutan
  choice: 'Panatilihin ang maikling pormulasyon ng Hebreo: hindi na lalapit sa toldang tipanan, upang hindi magdala ng kasalanan at mamatay.'
  alternative: Hindi na sila lalapit nang walang pahintulot sa toldang tipanan, kung hindi'y magkakasala sila at mamamatay.
  rationale: Ipinakikita ng kalapit na konteksto ang natatanging tungkulin ng mga Levita at pari, ngunit hindi tahasang sinasabi sa talatang ito ang ‘nang walang pahintulot.’ Hindi ito idinaragdag sa pangunahing teksto upang mapanatili ang teolohikal at legal na bigat ng orihinal na idyoma.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na ‘mga anak ni Israel’ at ang konkretong idyomang ‘magdala ng kasalanan.’ Ang talababa ay inilagay pagkatapos ng buong pangungusap dahil nililinaw nito ang pariralang sanhi at kahihinatnan.
