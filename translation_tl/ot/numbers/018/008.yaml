id: NUM.18.8
reference: Numbers 18:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: tl
  text: 'At nagsalita si Yahweh kay Aaron: “Ako mismo—narito, ipinagkatiwala ko sa iyo ang pangangalaga sa aking mga handog[a]—lahat ng banal na kaloob ng mga anak ni Israel.[b] Ibinigay ko ang mga iyon sa iyo bilang iyong bahaging kaugnay ng pagpapahid[c], at sa iyong mga anak bilang isang tuntuning panghabang-panahon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking mga kontribusyon” o, sa mas teknikal na pananalita, “aking mga handog na itinaas.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Israel,” ang karaniwang katawagang pangtipan sa sambayanan ng Israel.
    reason: cultural_note
  - marker: c
    text: Sa literal, “bilang bahagi sa pagpapahid” o “para sa pagpapahid.” Malamang na tumutukoy ito sa bahaging nauukol kay Aaron dahil sa kanyang pinahirang katungkulang saserdote.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַאֲנִי הִנֵּה
  choice: Ako mismo—narito
  rationale: Ipinahahayag ang diin ng tahasang panghalip na אֲנִי at ang pantawag-pansing lakas ng הִנֵּה sa natural ngunit marangal na Tagalog.
- source_word: נָתַתִּי לְךָ אֶת מִשְׁמֶרֶת
  choice: ipinagkatiwala ko sa iyo ang pangangalaga
  rationale: Bagaman literal na 'ibinigay ko ... ang pananagutan/pangangalaga,' ipinakikita ng 'ipinagkatiwala' ang resulta ng נתן at ang ipinagkatiwalang tungkulin na saklaw ng מִשְׁמֶרֶת.
- source_word: תְּרוּמֹתַי
  choice: aking mga handog
  rationale: Ang תְּרוּמָה ay kontribusyon o handog na ibinukod at iniharap kay Yahweh. Natural sa modernong Tagalog ang 'mga handog'; inilalahad sa talababa ang mas teknikal na kahulugan.
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: sa lahat ng banal na kaloob ng mga anak ni Israel
  rationale: Sa kontekstong ito, ang קָדְשֵׁי ay mga bagay o kaloob na itinalaga bilang banal. Pinanatili ang pormulang pangtipan na 'mga anak ni Israel.'
- source_word: לְמָשְׁחָה
  choice: bilang bahaging nauukol sa iyo dahil sa pagkakahirang sa iyo
  rationale: Ipinahahayag ang bahaging nauukol kay Aaron dahil sa kanyang pinahirang katungkulang saserdote, habang ang talababa ay nagpapanatili sa literal at posibleng alternatibong pagbasa.
- source_word: לְחָק עוֹלָם
  choice: bilang isang tuntuning panghabang-panahon
  rationale: Pinananatili ang legal na lakas ng חָק at ang patuloy na bisa ng עוֹלָם sa loob ng batas na pangtipan.
theological_decisions:
- issue: Kahulugan ng לְמָשְׁחָה sa karapatan ni Aaron sa mga banal na kaloob
  choice: bilang bahaging nauukol sa iyo dahil sa pagkakahirang sa iyo
  alternative: bilang bahagi sa pagpapahid sa iyo; para sa pagpapahid
  rationale: Malamang na tumutukoy ang parirala sa bahaging nauukol kay Aaron dahil sa kanyang pinahirang katungkulang saserdote, hindi sa panibagong seremonya ng pagpapahid. Gayunman, inilalahad sa talababa ang literal na anyo upang hindi ikubli ang leksikal na tensiyon.
- issue: Paglalarawan sa בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ang karaniwang pormulang Hebreo at ang kaugnayan nito sa pangalang Israel bilang ninuno at bansang nakipagtipan.
- issue: Ugnayan ng תְּרוּמֹתַי at לְכָל קָדְשֵׁי
  choice: aking mga handog, samakatuwid, sa lahat ng banal na kaloob
  alternative: aking mga handog—lahat ng banal na bagay; aking mga handog, kasama ang lahat ng banal na kaloob
  rationale: Binabasa ang kasunod na parirala bilang paglilinaw sa saklaw ng mga handog. Ang 'samakatuwid' ay nagpapakita ng appositional na ugnayan nang hindi nagpapasok ng bagong uri ng handog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ipinagkatiwala ... ang pangangalaga” upang maging natural ang diwa ng itinalagang priestly charge. Iniwasan ang labis na teknikal na “handog na itinaas” sa pangunahing teksto ngunit pinanatili ito sa talababa. Ang bawat talababa ay may katumbas na marker sa pangunahing teksto.
