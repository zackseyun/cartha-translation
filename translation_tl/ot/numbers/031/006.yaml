revisions:
- from: Kaya isinugo sila ni Moises sa digmaan—tig-iisang libo mula sa bawat lipi—kasama si Pinehas na anak ni Eleazar na pari. Isinugo niya sila sa digmaan, dala ni Pinehas ang mga kagamitang banal[a] at ang mga trumpeta para sa hudyat ng pakikipaglaban.[b]
  to: Isinugo ni Moises sa digmaan ang tig-iisang libo mula sa bawat lipi, kasama nila si Pinehas, anak ng paring si Eleazar. Dala ni Pinehas ang mga banal na kagamitan[a] at ang mga trumpeta para sa hudyat ng pakikipaglaban.[b]
  rationale: Pinagsama ang pagpapadala sa isang malinaw na estruktura upang maipakita ang iisang pangunahing pandiwa ng Hebreo. Nilinaw na si Eleazar ang pari at pinanatili ang malamang na pagtukoy ng isahang panghalip na “sa kanyang kamay” kay Pinehas sa pamamagitan ng “Dala ni Pinehas.” Nananatili ang mga talababa at ang kanilang mga angkla.
