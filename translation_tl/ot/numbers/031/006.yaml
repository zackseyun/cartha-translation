base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: tl
  text: Isinugo ni Moises sa digmaan ang tig-iisang libo mula sa bawat lipi, kasama nila si Pinehas, anak ng paring si Eleazar. Dala ni Pinehas ang mga banal na kagamitan[a] at ang mga trumpeta para sa hudyat ng pakikipaglaban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kagamitan ng santuwaryo” o “mga sagradong bagay.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga trumpeta para sa paghudyat” o “mga trumpetang pangbabala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: isinugo
  rationale: Likas sa marangal na salaysay ang “isinugo” at malinaw na ipinahihiwatig na pinapunta sila ni Moises para sa isang itinakdang tungkulin.
- source_word: אֶלֶף לַמַּטֶּה
  choice: tig-iisang libo mula sa bawat lipi
  rationale: Ipinapakita ng “tig-iisang” ang distributibong diwa, samantalang nililinaw ng “mula sa bawat lipi” kung saan kinuha ang mga mandirigma.
- source_word: לַצָּבָא
  choice: sa digmaan
  rationale: Sa konteksto, tumutukoy ang צבא sa pakikidigma o paglilingkod militar, hindi lamang sa hukbo bilang institusyon.
- source_word: אֹתָם ... אֹתָם
  choice: sila ... sila
  rationale: Napananatili sa dalawang sugnay ang pag-uulit ng Hebreo nang hindi nagiging labis na alanganin sa Tagalog.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Pinehas na anak ni Eleazar na pari
  rationale: Tuwirang inilalahad ang pangalan, ugnayang pampamilya, at katungkulan; sa pinakamalapit na estruktura, si Eleazar ang tinutukoy na pari.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: ang mga kagamitang banal
  rationale: Pinananatili nito ang malawak na kahulugan ng כְּלֵי bilang mga kagamitan o bagay at ang kultikong diwa ng הַקֹּדֶשׁ, habang inilalagay sa talababa ang posibleng mas tiyak na pagbasa.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: ang mga trumpeta para sa hudyat ng pakikipaglaban
  rationale: Ipinahahayag nito ang gamit ng mga trumpeta sa pagbibigay ng malakas na hudyat sa kontekstong militar, ngunit pinananatili sa talababa ang mas pangkalahatang mga posibilidad.
- source_word: בְּיָדוֹ
  choice: dala ni Pinehas
  rationale: Ang panghalip na isahan ay pinakamalamang na tumutukoy kay Pinehas, ang pinakamalapit na pangngalang isahan. Ang “dala” ay likas na Tagalog para sa Hebreong idyomang “nasa kanyang kamay.”
theological_decisions:
- issue: Papel ni Pinehas at ng mga banal na kagamitan sa ekspedisyong militar
  choice: Sumama si Pinehas sa mga mandirigma bilang paring may dala ng mga banal na kagamitan at mga trumpetang panghudyat.
  alternative: Ituring siyang tagamasid lamang, o ipalagay na walang kaugnayang panrelihiyon ang mga kagamitang dala.
  rationale: Malinaw na pinagsasama ng talata si Pinehas, ang mga kagamitang banal, at ang mga trumpeta sa pagpapadala sa digmaan. Hindi dinaragdagan ng salin ang teksto ng mas malawak na doktrina tungkol sa banal na digmaan.
- issue: Tinutukoy ng isahang panghalip sa בְּיָדוֹ
  choice: Si Pinehas ang may dala ng mga kagamitan at trumpeta.
  alternative: Maaaring unawain nang mas maluwag na nasa pangangalaga ng pangkat ang mga ito.
  rationale: Si Pinehas ang pinakamalapit na pangngalang isahan at likas na antecedent ng hulaping panghalip; ginawa siyang tahasang paksa sa Tagalog upang maiwasan ang malabong “kanyang.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tig-iisang libo” para sa malinaw na distributibong diwa at “dala ni Pinehas” bilang likas na katumbas ng Hebreong idyoma. Ang mga gitling na pahaba ay tumutulong na maipakita ang apposisyon nang hindi mabigat ang pangungusap. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
