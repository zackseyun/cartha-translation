  terminology: Ang “lipi,” “digmaan,” “mga banal na kagamitan,” at “mga trumpeta para sa hudyat ng pakikipaglaban” ay angkop sa modernong Filipino Tagalog at sapat na pinananatili ang kultiko at militar na saklaw ng Hebreo. Ang “anak ng paring si Eleazar” ay malinaw na si Eleazar, hindi si Pinehas, ang tinatawag na pari.
