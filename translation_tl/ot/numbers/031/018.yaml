  text: וְ/כֹל֙ הַ/טַּ֣ף בַּ/נָּשִׁ֔ים אֲשֶׁ֥ר לֹא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: tl
  text: Ngunit panatilihin ninyong buhay para sa inyong sarili ang bawat batang babae na hindi pa nakasiping sa lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas tahasang pananalita, “na hindi pa nakipagtalik sa lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Ngunit … bawat
  rationale: Sa konteksto, ang וְ ay nag-uugnay ngunit nagtatakda rin ng kaibahan sa naunang utos, kaya natural ang “Ngunit.” Ang כֹל kasama ng pang-isahang kolektibong tinutukoy ay malinaw na naipapahayag ng “bawat.”
- source_word: הַטַּף בַּנָּשִׁים
  choice: batang babae
  rationale: Ang טַף ay tumutukoy sa maliliit na anak o mga bata. Bagaman hindi ito likas na pambabae, nililimitahan ng בַּנָּשִׁים at ng kasunod na paglalarawan ang tinutukoy sa mga batang babae. Naiwasan ang salitang “dalagita,” na maaaring magpahiwatig ng mas makitid na edad kaysa sa teksto.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: na hindi pa nakasiping sa lalaki
  rationale: Ginagamit dito ang יָדַע at מִשְׁכַּב bilang pahiwatig sa pakikipagtalik. Ang “nakasiping sa lalaki” ay likas at marangal na pahayag sa Filipino na pinananatili ang eupemistikong paraan ng Hebreo nang hindi gumagamit ng teknikal na katawagang “birhen.”
- source_word: הַחֲיוּ לָכֶם
  choice: panatilihin ninyong buhay para sa inyong sarili
  rationale: Ang Hiphil na pautos ng חיה ay nangangahulugang hayaang mabuhay o panatilihing buhay. Pinananatili ng “para sa inyong sarili” ang לָכֶם nang hindi dinaragdagan ang teksto ng tiyak na layunin para sa mga bihag.
theological_decisions:
- issue: Kung tahasang tatawaging “birhen” ang mga batang babae
  choice: Hindi ginamit ang “birhen”; isinalin bilang “hindi pa nakasiping sa lalaki.”
  alternative: na birhen pa
  rationale: Hindi abstraktong katawagang “birhen” ang ginamit ng Hebreo kundi isang eupemistikong paglalarawan ng kawalan ng karanasang seksuwal. Pinananatili ng salin ang anyo at tensiyon ng pinagmulan.
- issue: Kung paano ipahahayag ang לָכֶם
  choice: Pinanatili ang “para sa inyong sarili.”
  alternative: huwag ninyong patayin
  rationale: Mas tuwiran ang alternatibo sa praktikal na resulta, ngunit inaalis nito ang malinaw na pariralang לָכֶם. Hindi tinukoy ng salin kung ano ang magiging katayuan o gamit ng mga pinanatiling buhay, sapagkat hindi iyon tahasang sinasabi sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakasiping” bilang karaniwang eupemismo sa seksuwal na ugnayan; iniwasan ang labis na literal ngunit di-likas na “nakakilala sa higaan ng lalaki” at ang mas teknikal o may dagdag na pahiwatig na “birhen.”
