  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: tl
  text: Kaya ginawa nina Moises at Eleazar na pari ang iniutos ni Yahweh[a] kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon, isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Ipinapahayag ng pandiwa na isinagawa nila ang naunang utos; natural sa Filipino ang pariralang “ginawa ... ang iniutos.”
- source_word: מֹשֶׁה וְאֶלְעָזָר
  choice: nina Moises at Eleazar
  rationale: Ginamit ang pang-ukol na “nina” upang likas na markahan sa Filipino ang tambalang tagaganap sa ayos na nauuna ang pandiwa.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Tinutukoy ng pamagat si Eleazar; malinaw at natural ang “Eleazar na pari” sa modernong Filipino.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ang iniutos
  rationale: Sa konstruksiyong “ginawa ... ang iniutos,” likas na naipahahayag ang pagsunod ayon sa utos nang hindi dinaragdagan ang kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Ang pantukoy sa tuwirang layon ay hindi hiwalay na isinasalin; si Moises ang tumanggap ng utos, kaya natural ang “kay Moises.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan at iniiwasang palitan ito ng titulong “PANGINOON”; ipinapaliwanag sa talababa ang tradisyonal na anyo.
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Pinili ang natural na ayos na pandiwa–tagaganap–layon at pinanatili ang pangalan ni Yahweh.
