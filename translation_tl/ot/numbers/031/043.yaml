  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: tl
  text: At ang kalahati ng kawan na para sa sambayanan ay 337,500.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: ay
  rationale: Sa talaang ito ng bilang, ipinakikita ng pandiwa ang kabuuang halaga; natural sa Tagalog ang pangungusap na may panandang “ay” nang hindi dinaragdagan ang kahulugan.
- source_word: מֶחֱצַת הָעֵדָה
  choice: ang kalahating bahagi ng sambayanan
  rationale: Ang construct na מֶחֱצַת ay tumutukoy sa isa sa dalawang hinating bahagi, at ang עֵדָה ay ang pamayanan o kapulungan ng Israel. Ang “sambayanan” ay likas, marangal, at hindi nagpapahiwatig ng isang institusyong pansimbahan sa mas huling panahon.
- source_word: מִן הַצֹּאן
  choice: mula sa kawan
  rationale: Tinutukoy ng parirala ang uri ng mga hayop na binilang sa bahaging ito. Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop, karaniwang mga tupa at kambing; pinananatili ng “kawan” ang pagiging kolektibo ng salita nang hindi nagpapasok ng labis na espesipikasyon.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337,500
  rationale: Ang sunod-sunod na bilang sa Hebreo ay 300,000 + 30,000 + 7,000 + 500. Mas madaling basahin ang eksaktong kabuuan sa mga numerong Arabe sa konteksto ng isang talaan.
