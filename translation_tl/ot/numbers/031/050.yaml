revisions:
- from: Kaya inilapit namin bilang handog kay Yahweh ang anumang natagpuan ng bawat lalaki—mga kagamitang ginto, mga pulseras sa bisig[a] at mga pulseras sa pulsuhan, mga singsing, mga hikaw, at mga palawit[b]—upang gumawa ng pantubos para sa aming sarili[c] sa harap ni Yahweh.
  to: Kaya inilapit namin bilang handog kay Yahweh ang anumang natagpuan ng bawat lalaki—mga kagamitang ginto, mga pulseras sa bisig[a] at mga pulseras sa pulsuhan, mga singsing, mga hikaw, at mga palawit[b]—upang magbayad-sala para sa aming mga sarili[c] sa harap ni Yahweh.
  rationale: Pinalitan ang hindi gaanong likas na “gumawa ng pantubos” ng “magbayad-sala,” ang karaniwang panrelihiyong Tagalog na katumbas ng paggawa ng atonement. Nilinaw rin ang pangmaramihang sanggunian sa “aming mga sarili.” Walang binago sa saklaw ng handog, sa mga hindi tiyak na pangalan ng palamuti, o sa ambigwidad ng Hebreo.
