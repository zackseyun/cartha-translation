source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: tl
  text: Kaya inilapit namin bilang handog kay Yahweh ang anumang natagpuan ng bawat lalaki—mga kagamitang ginto, mga pulseras sa bisig[a] at mga pulseras sa pulsuhan, mga singsing, mga hikaw, at mga palawit[b]—upang magbayad-sala para sa aming mga sarili[c] sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pulseras sa bukung-bukong” ang אֶצְעָדָה.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang eksaktong kahulugan ng כוּמָז; maaari rin itong tumukoy sa mga kuwintas, palamuti, o singsing sa ilong.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “para sa aming mga buhay” o “para sa aming mga persona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: Kaya inilapit namin
  rationale: Pinananatili ng “inilapit” ang literal at panrelihiyong diwa ng Hiphil ng קרב, habang ipinahihiwatig ng “Kaya” ang ugnayang pasalaysay ng waw.
- source_word: קָרְבַּן יְהוָה
  choice: bilang handog kay Yahweh
  rationale: Ang קָרְבָּן ay isang handog na inilalapit. Likas sa Tagalog ang “handog kay Yahweh” at hindi nito labis na tinutukoy ang uri ng handog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: ang anumang natagpuan ng bawat lalaki
  rationale: Inilalarawan nito ang pamamahaging diwa ng אִישׁ at pinananatili ang panlalaking pagtukoy, na angkop sa mga lalaking mandirigma sa konteksto.
- source_word: כְלִי זָהָב
  choice: mga kagamitang ginto
  rationale: Malawak ang kahulugan ng כְלִי bilang kagamitan, bagay, o sisidlan. Hindi ito agad nililimitahan sa “alahas,” bagaman mga hiyas ang kasunod na talaan.
- source_word: אֶצְעָדָה
  choice: mga pulseras sa bisig
  rationale: Tumutukoy ito sa palamuting isinusuot sa isang bahagi ng braso o binti. Ang “pulseras sa bisig” ay malinaw sa kasalukuyang Tagalog, habang inilalahad sa talababa ang posibleng “pulseras sa bukung-bukong.”
- source_word: צָמִיד
  choice: mga pulseras sa pulsuhan
  rationale: Ang paglilinaw na “sa pulsuhan” ay nagbubukod dito sa naunang palamuti sa bisig at angkop sa karaniwang kahulugan ng צָמִיד.
- source_word: טַבַּעַת
  choice: mga singsing
  rationale: Hindi sapilitang nangangahulugang pantatak na singsing ang salita; ang pangkalahatang “mga singsing” ang mas maingat na salin.
- source_word: עָגִיל
  choice: mga hikaw
  rationale: Ito ang karaniwang kahulugan sa talaan ng mga personal na palamuti at malinaw itong naiiba sa טַבַּעַת.
- source_word: כוּמָז
  choice: mga palawit
  rationale: Hindi tiyak ang eksaktong uri ng palamuti. Ang “mga palawit” ay maingat at madaling maunawaan; inilalahad sa talababa ang ibang posibilidad.
- source_word: לְכַפֵּר
  choice: upang gumawa ng pantubos
  rationale: Pinananatili nito ang ritwal at teolohikal na bigat ng כפר nang hindi tinutukoy nang higit sa teksto ang eksaktong paraan o bisa ng pagtubos.
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: para sa aming sarili
  rationale: Ang נֶפֶשׁ sa pariralang ito ay tumutukoy sa kanilang mga buhay o mismong mga persona. Ang “aming sarili” ay likas sa Tagalog at umiiwas sa di-kailangang paghahating katawan-kaluluwa.
theological_decisions:
- issue: Kaugnayan ng handog sa כפר
  choice: Inihaharap ang mga bagay na ginto bilang handog upang gumawa ng pantubos para sa mga lalaki sa harap ni Yahweh.
  alternative: Ituring lamang itong handog ng pasasalamat o pang-iwas sa panganib na walang ritwal na diwa.
  rationale: Tahasan sa Hebreo ang כפר, kasama ng קָרְבַּן at “sa harap ni Yahweh.” Kaya pinanatili ang wikang pantubos ngunit hindi ipinaliwanag ang mekanismo nito nang lampas sa talata.
- issue: Kasarian ng אִישׁ
  choice: bawat lalaki
  alternative: bawat isa; bawat tao
  rationale: Ang konteksto ay tumutukoy sa mga lalaking mandirigma at opisyal; kaya pinananatili ang tahasang panlalaking anyo ng pinagmulan.
- issue: Kahulugan ng נְפָשׁוֹת sa pariralang pantubos
  choice: aming sarili, na may literal na alternatibo sa talababa
  alternative: aming mga kaluluwa lamang
  rationale: Maaaring mangahulugan ang נֶפֶשׁ ng buhay o persona at hindi nito kinakailangang ituro ang isang hiwalay na espirituwal na bahagi ng tao.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “inilapit” at “pantubos” upang mapanatili ang wikang panghandog at ritwal ng Hebreo; nilinaw ang dalawang magkaibang palamuti bilang nasa bisig at pulsuhan nang hindi ikinukubli ang leksikal na kawalang-katiyakan.
