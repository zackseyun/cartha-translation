  text: שָׂ֗א אֵ֣ת רֹ֤אשׁ מַלְק֨וֹחַ֙ הַ/שְּׁבִ֔י בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה אַתָּה֙ וְ/אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/רָאשֵׁ֖י אֲב֥וֹת הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: tl
  text: “Bilangin ninyo ang mga nabihag na samsam—kapuwa mga tao at mga hayop—ikaw, si Eleazar na pari, at ang mga pinuno ng mga angkan ng kapulungan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: Bilangin
  rationale: Ang literal na ‘itaas ang ulo’ ay isang idyomang nangangahulugang kunin ang bilang o kabuuan. Natural at tumpak sa modernong Tagalog ang ‘bilangin.’
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: mga nabihag na samsam
  rationale: Ang parirala ay tumutukoy sa samsam na nakuha sa digmaan at saka tinutukoy bilang mga tao at mga hayop. Pinananatili ng ‘nabihag’ ang diwang captured nang hindi nililimitahan sa mga taong bihag lamang.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: kapuwa mga tao at mga hayop
  rationale: Ang אָדָם ay kolektibong tumutukoy sa mga tao bilang kaibahan sa mga hayop; malinaw at likas sa Tagalog ang pares na ito.
- source_word: אַתָּה
  choice: ikaw
  rationale: Pinananatili ang tahasang panghalip at ang diin na kasama si Moises sa gagawa ng pagbibilang.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: si Eleazar na pari
  rationale: Isinalin ang titulo at tinumbasan nang natural ang pangalan at appositive sa Tagalog.
- source_word: רָאשֵׁי אֲבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Tumutukoy ito sa mga lider ng mga yunit na nakabatay sa angkan o sambahayan ng mga ninuno. Mas malinaw sa karaniwang mambabasa ang ‘mga pinuno ng mga angkan’ kaysa literal na ‘mga ulo ng mga sambahayan ng mga ama.’
- source_word: הָעֵדָה
  choice: kapulungan
  rationale: Tumutukoy sa organisadong sambayanan o kapulungan ng Israel; dignified at pamilyar na terminong biblikal ang ‘kapulungan.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang tuwirang pautos na ‘Bilangin ninyo’ sapagkat maramihan ang mga inatasan, habang pinanatili ang ‘ikaw’ upang maipakita ang tahasang diin kay Moises. Iniwasan ang labis na literal ngunit di-likas na mga anyo.
