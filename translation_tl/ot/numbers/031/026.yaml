  source_fidelity: Tumpak na naihahatid ng salin ang idyomang שָׂא אֵת־רֹאשׁ bilang utos na magbilang, ang מַלְקוֹחַ הַשְּׁבִי bilang samsam na nabihag, at ang saklaw na kapuwa tao at hayop. Nananatili rin ang tahasang 'ikaw' para kay Moises, kasama sina Eleazar at mga pinuno sa isasagawang pagbibilang.
  naturalness: Likas at malinaw ang modernong Tagalog. Ang 'Bilangin ninyo' ay angkop sa pangkat ng mga inuutusan, at ang kasunod na 'ikaw, si Eleazar ... at ...' ay wastong nagbibigay-diin sa mga kalahok. Ang 'kapuwa ... at ...' at mga gitling ay nagpapalinaw sa saklaw ng samsam.
  terminology: Ang 'samsam,' 'mga tao at mga hayop,' 'si Eleazar na pari,' 'mga pinuno ng mga angkan,' at 'kapulungan' ay angkop sa register at sa mga terminong Hebreo. Hindi pinipilit ng salin ang isang doktrinal o labis na tiyak na pagbasa ng 'captive spoil.'
