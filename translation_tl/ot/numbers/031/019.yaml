base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: tl
  text: At kayo, humimpil sa labas ng kampo nang pitong araw. Ang bawat pumatay ng tao at ang bawat humipo sa isang napatay[a] ay dapat magpadalisay sa ikatlong araw at sa ikapitong araw—kayo at ang mga bihag ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “humipo sa bangkay ng isang napatay.” Literal na tumutukoy ang Hebreo sa “isang napatay,” ngunit sa konteksto ay sangkot ang paghipo sa bangkay at ang ibinubunga nitong karumihang ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲנוּ
  choice: manatili kayo
  rationale: Ang maramihang pautos ng חנה ay maaaring mangahulugang humimpil o manatiling nakahimpil. Mas natural sa Filipino ang “manatili kayo” dahil itinatalaga rito ang pitong araw na pananatili sa labas ng kampo.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Tuwirang inilalarawan ang lugar, at ang “kampo” ay angkop sa kontekstong militar at paglalakbay sa ilang.
- source_word: שִׁבְעַת יָמִים
  choice: nang pitong araw
  rationale: Ang “nang” ay natural na pananda ng tagal sa modernong Filipino.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: ang bawat pumatay ng tao
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa isang tao o buhay ng tao, hindi sa abstraktong “kaluluwa.” Dahil katatapos lamang ng labanan, ang participle ay likas na tumutukoy sa naganap nang pagpatay.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: at ang bawat humipo sa isang napatay
  rationale: Ang חָלָל ay isang taong napatay, karaniwan sa marahas na paraan. Pinananatili ng “isang napatay” ang personal na pagtukoy ng Hebreo habang ipinapaliwanag sa talababa ang implikasyon ng bangkay.
- source_word: תִּתְחַטְּאוּ
  choice: ay dapat magpadalisay
  rationale: Sa ritwal na kontekstong ito, ang Hitpael ng חטא ay tumutukoy sa pagpapadalisay mula sa karumihang ritwal. Ang “dapat” ay malinaw na naghahatid ng obligasyon nang hindi ito ginagawang usapin ng moral na kapatawaran.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: sa ikatlong araw at sa ikapitong araw
  rationale: Pinananatili ang eksaktong mga araw na itinakda para sa ritwal.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: kayo at ang mga bihag ninyo
  rationale: Ang שְׁבִי ay tumutukoy sa mga bihag sa digmaan; mas tiyak dito ang “mga bihag” kaysa “mga bilanggo.”
theological_decisions:
- issue: Kalikasan ng pagpapadalisay matapos pumatay o humipo sa napatay
  choice: ritwal na pagpapadalisay mula sa karumihang dulot ng pagkakadikit sa patay
  alternative: moral na paglilinis mula sa pagkakasala sa pagdanak ng dugo
  rationale: Ang anyo ng pandiwa at ang pagbanggit sa ikatlo at ikapitong araw ay tumutugma sa itinakdang ritwal para sa karumihang dulot ng patay. Kaya “magpadalisay” ang ginamit nang hindi nagpapasok ng pahayag tungkol sa kapatawaran o moral na sala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “manatili” para sa natural na pautos, “magpadalisay” para sa tiyak na ritwal na diwa, at “mga bihag” para sa kontekstong pandigma.
