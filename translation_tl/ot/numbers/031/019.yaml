  to: At kayo, humimpil sa labas ng kampo nang pitong araw. Ang bawat pumatay ng tao at ang bawat humipo sa isang napatay[a] ay dapat magpadalisay sa ikatlong araw at sa ikapitong araw—kayo at ang mga bihag ninyo.
