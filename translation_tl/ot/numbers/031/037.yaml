  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: tl
  text: At ang buwis para kay Yahweh mula sa kawan ay anim na raan at pitumpu't lima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: At ... ay
  rationale: Dito, ang anyong pasalaysay ng היה ay nagsisilbing payak na pang-ugnay na nagpapakilala sa bilang; natural itong maipahayag sa Tagalog sa hulma na “At ... ay.”
- source_word: הַמֶּכֶס
  choice: ang buwis
  rationale: Ang מֶכֶס ay bahaging sapilitang kinuha mula sa samsam at inilaan bilang dapat ibigay. Ang “buwis” ay malinaw at likas sa modernong Tagalog, bagaman hindi ito tumutukoy sa karaniwang makabagong buwis sa kita o ari-arian.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng ל ang paglalaan o destinasyon ng bahaging ito; natural sa Tagalog ang “para kay Yahweh.”
- source_word: יהוה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh,” alinsunod sa ibinigay na pasiyang teolohikal at sa aktuwal na anyo ng tekstong Hebreo.
- source_word: מִן הַצֹּאן
  choice: mula sa kawan
  rationale: Ang צֹאן ay kolektibong katawagan para sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Pinananatili ng “kawan” ang saklaw nang hindi ito nililimitahan sa tupa lamang.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: animnaraan at pitumpu't lima
  rationale: Ito ang tuwirang modernong Tagalog na pagpapahayag ng eksaktong bilang na 675.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ginagamit mismo ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalang nasa Hebreo at umaayon sa ibinigay na na-update na pasiya, sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang maikli at malinaw na ayos ng pangungusap, na angkop sa konteksto ng sunod-sunod na pagtutuos sa samsam.
