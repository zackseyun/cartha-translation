  yaml_path: translation/ot/numbers/031/036.yaml
  text: And the half[a], the portion of those who went out to war, was in number 337,500 sheep.
translation:
  language: tl
  text: At ang kalahati[a]—ang bahagi para sa mga lumabas upang makipagdigma—ay may bilang na 337,500 tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang kalahating bahagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: ay
  rationale: Ipinakikilala ng anyong ito ang kinalabasang kabuuan; natural sa Tagalog ang sugnay na panaguri na may “ay,” nang hindi nagdaragdag ng interpretasyon.
- source_word: הַמֶּחֱצָה
  choice: ang kalahati
  rationale: Tumutukoy ito sa isang kalahati ng nasamsam na hinati sa konteksto at pinananatili ang tahasang diwa ng Hebreo.
- source_word: חֵלֶק
  choice: ang bahagi ng
  rationale: Nasa apposition ito sa “ang kalahati” at nililinaw kung kanino nakalaan ang kalahating iyon.
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: mga lumabas upang makipagdigma
  rationale: Natural na modernong Tagalog para sa idyomang militar na literal na tumutukoy sa mga lumabas kasama ng hukbo; iniiwasan ang mas malabong “lumabas sa hukbo.”
- source_word: מִסְפַּר
  choice: ay 337,500
  rationale: Sa Tagalog, natural nang ihayag nang tuwiran ang kabuuang bilang; hindi kailangang ulitin ang “bilang” kung ang eksaktong numero ang kasunod.
- source_word: הַצֹּאן
  choice: tupa
  rationale: Sa kontekstong ito, ang pangkat ng maliliit na hayop ay tinutukoy bilang mga tupa; ito ang pinak malinaw na karaniwang salita.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337,500
  rationale: Ang bilang sa Hebreo ay tuwirang suma ng 300,000 + 30,000 + 7,000 + 500; mas madaling basahin ang mga numerong digit sa modernong salin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang appositional na ugnayan ng “ang kalahati” at “ang bahagi,” habang ginawang natural ang pariralang militar. Ginamit ang gitling na em dash upang malinaw na ihiwalay ang paliwanag sa pangunahing sugnay.
