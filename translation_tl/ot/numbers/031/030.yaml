  to: At mula sa kalahating bahagi ng mga anak ni Israel ay kukuha ka ng isa sa bawat limampu[a]—mula sa mga tao, mga baka, mga asno, at mga kawan[b], mula sa lahat ng alagang hayop—at ibibigay mo ang mga iyon sa mga Levita na tumutupad sa tungkulin ng pagbabantay sa tabernakulo ni Yahweh.
