    issue: Hindi sapat na tiyak ang "nangangasiwa sa tabernakulo" para sa שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן.
    rationale: Ang Hebreo ay nagbibigay-diin sa pag-iingat/pagbabantay sa nakatalagang tungkulin kaugnay ng tabernakulo, hindi lamang sa pangkalahatang pangangasiwa.
  - severity: low
    issue: Walang talababa para sa "mga kawan," bagaman sinasabi ng lexical rationale na lilinawin sa talababa ang saklaw nito.
    rationale: Ang צֹאן ay kolektibong termino na maaaring tumukoy sa mga tupa at kambing; kapaki-pakinabang ang maikling talababa upang mapanatili ang saklaw nang hindi binibigatan ang pangunahing teksto.
  - severity: low
    issue: Maaaring gawing mas malinaw ang talababa a tungkol sa pasibong anyo ng אָחֻז.
    rationale: Ang "sa bawat limampu" ay wastong idiomatikong pangunahing teksto; ang "kinuha sa bawat limampu" ay mas malinaw na literal na alternatibo kaysa "kinuha mula sa limampu."
