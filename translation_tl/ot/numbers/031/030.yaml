id: NUM.31.30
reference: Numbers 31:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: tl
  text: At mula sa kalahating bahagi ng mga anak ni Israel ay kukuha ka ng isa sa bawat limampu[a]—mula sa mga tao, mga baka, mga asno, at mga kawan[b], mula sa lahat ng alagang hayop—at ibibigay mo ang mga iyon sa mga Levita na tumutupad sa tungkulin ng pagbabantay sa tabernakulo ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “isang kinuha sa bawat limampu.”
    reason: Pinananatili ang pasibong diwa ng אָחֻז, samantalang ginagamit ng pangunahing teksto ang natural na Tagalog para sa proporsiyong 1:50.
  - marker: b
    text: Ang “mga kawan” ay kolektibong termino na maaaring sumaklaw sa mga tupa at kambing.
    reason: Nililinaw ang saklaw ng צֹאן nang hindi nagdaragdag ng mga hayop sa pangunahing teksto.
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: At mula sa kalahating bahagi ng mga anak ni Israel
  rationale: Pinananatili ang kahulugan ng מַחֲצִית bilang kalahating bahagi at ang pormal na idyomang בְּנֵי יִשְׂרָאֵל bilang “mga anak ni Israel,” habang nananatiling malinaw sa modernong Tagalog.
- source_word: תִּקַּח
  choice: kukuha ka
  rationale: Ang imperpektibo ay utos kay Moises; likas sa Tagalog ang anyong hinaharap na “kukuha ka” sa ganitong legal na tagubilin.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: isa sa bawat limampu
  rationale: Malinaw at natural na ipinapahayag ang takdang singil na 1:50. Hindi kailangang gawing tahasang pasibo sa Tagalog dahil taglay na ng “kukuha ka ng isa” ang diwa ng pagpili o pagkuha.
- source_word: מִן הָאָדָם
  choice: mula sa mga tao
  rationale: Bagaman kolektibong isahan ang אָדָם, tumutukoy ito rito sa mga taong kabilang sa nasamsam. Ang “mga tao” ang natural at hindi malabong kolektibong katumbas sa Tagalog.
- source_word: מִן הַבָּקָר מִן הַחֲמֹרִים וּמִן הַצֹּאן
  choice: mga baka, mga asno, at mga kawan
  rationale: Direkta at makabagong mga katumbas para sa cattle, donkeys, at kolektibong צֹאן. Ang saklaw ng “kawan” ay nililinaw sa talababa.
- source_word: מִכָּל הַבְּהֵמָה
  choice: mula sa lahat ng alagang hayop
  rationale: Sa konteksto ng imbentaryo, ang בְּהֵמָה ay tumutukoy sa mga domestikadong hayop o livestock, hindi sa lahat ng hayop sa pangkalahatan.
- source_word: וְנָתַתָּה אֹתָם לַלְוִיִּם
  choice: at ibibigay mo ang mga iyon sa mga Levita
  rationale: Pinananatili ang sunod na tagubilin at ang maramihang reperensiya ng אֹתָם.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן
  choice: na nangangasiwa sa tabernakulo
  rationale: Ipinahahayag ng cognate construction ang pananagutan nilang magbantay at tumupad ng nakatalagang tungkulin. Ang “nangangasiwa” ay natural at saklaw ang custodial na diwa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang Tetragrammaton sa halip na palitan ito ng titulo.
- issue: Ugnayan ng מִשְׁכַּן at יְהוָה
  choice: tabernakulo ni Yahweh
  alternative: tabernakulo ng PANGINOON
  rationale: Ang payak na genitibong “ni Yahweh” ay tapat sa “tabernakulo ng Yahweh” at hindi nagdaragdag ng interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabernakulo” bilang pamilyar na terminong biblikal. Ang mga gitling-pahaba ay tumutulong na ipakita na ang talaan ng mga tao at hayop ang pinagmumulan ng kukuning isa sa bawat limampu.
