  source_fidelity: Tumpak na naihahatid ng salin ang tinutukoy na pangkat—mga babae na wala pang seksuwal na pakikipagtalik sa lalaki—at ang kabuuang bilang na 32,000. Ang idyomang Hebreo ay wastong ipinaliwanag nang malinaw sa pangunahing teksto, habang pinananatili sa talababa ang mas literal na anyo.
  naturalness: Mas natural sa modernong Tagalog ang pang-uring anyong “mga babaeng” kaysa sa “mga babae na.” Ang ayos na “ay tatlumpu't dalawang libo lahat” ay katanggap-tanggap at malinaw sa konteksto ng talaan.
  terminology: Ang “nakipagtalik sa lalaki” ay malinaw, walang labis na interpretasyong doktrinal, at angkop na pagsasalin ng Hebreong eupemismo sa kontekstong ito. Ang “lalaki” ay wastong generic na katumbas ng זָכָר.
