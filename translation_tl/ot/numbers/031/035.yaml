  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: tl
  text: At ang mga babaeng hindi pa nakipagtalik sa lalaki[a] ay tatlumpu't dalawang libo lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hindi pa nakakilala sa higaan ng isang lalaki,” isang idyomang nangangahulugang hindi pa sila nakipagtalik sa lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: mga babae
  rationale: Sa konteksto, ang parirala ay tumutukoy sa mga taong kabilang sa bilang, bilang kaibahan sa mga hayop; sa natural na Tagalog, sapat nang tukuyin silang “mga babae” ayon sa kasunod na parirala.
- source_word: מִן הַנָּשִׁים
  choice: mga babae
  rationale: Tinutukoy nito ang pangkat na mula sa mga babaeng nabihag; hindi kailangang panatilihin ang literal na “mula sa” dahil hindi ito natural sa pangungusap na Tagalog.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: na hindi pa nakipagtalik sa lalaki
  rationale: Isinasalin ang Hebreong eupemism ayon sa malinaw nitong kahulugang seksuwal, habang inilalagay sa talababa ang literal na larawan ng orihinal.
- source_word: כָּל נֶפֶשׁ
  choice: lahat
  rationale: Ang parirala ay nagbubuod sa kabuuang bilang; natural itong ihayag sa Tagalog sa pamamagitan ng “lahat.”
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: tatlumpu't dalawang libo
  rationale: Karaniwang anyo ng bilang sa modernong Tagalog.
