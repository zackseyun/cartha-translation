- source_word: וּבָקָר
  choice: at … baka
  rationale: Ang בָּקָר ay kolektibong tumutukoy sa mga bakang alagang hayop. Isinalin ang prefixed וּ bilang “at” upang mapanatili ang pagkakaugnay nito sa nagpapatuloy na talaan.
- source_word: שְׁנַיִם וְשִׁבְעִים אָלֶף
  choice: 72,000
  rationale: Ang Hebreong parirala ay literal na nasa ayos na “dalawa at pitumpung libo,” na ang karaniwang kahulugan ay 72,000. Ginamit ang mga numero para sa malinaw at natural na pagbasa sa isang imbentaryo.
