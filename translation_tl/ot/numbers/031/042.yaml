  yaml_path: translation/ot/numbers/031/042.yaml
  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: tl
  text: At mula sa kalahati ng mga anak ni Israel, na ibinukod ni Moises mula sa mga lalaking naglingkod sa hukbo[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga lalaking nasa kampanya” o “mga lalaking lumabas upang makipagdigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית
  choice: At mula sa kalahati
  rationale: Kapuwa kinakatawan ang pangatnig at ang pang-ukol. Ang מַחֲצִית ay tumutukoy sa kalahati o kalahating bahagi ng samsam.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: nauukol sa mga anak ni Israel
  rationale: Pinananatili ang literal at tradisyonal na pananalitang “mga anak ni Israel,” habang nililinaw ng “nauukol sa” na sa kanila nakalaan ang kalahating ito.
- source_word: אֲשֶׁר
  choice: na
  rationale: Likas na panghalip na pamanggit sa Filipino na nag-uugnay sa kalahating bahagi at sa ginawa rito ni Moises.
- source_word: חָצָה
  choice: ibinukod
  rationale: Sa konteksto ng paghahati ng samsam, ipinahihiwatig ng pandiwa ang paghihiwalay ng isang bahagi mula sa bahagi ng mga mandirigma.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
- source_word: מִן הָאֲנָשִׁים
  choice: mula sa mga lalaki
  rationale: Tuwirang pinananatili ang panlalaking pagtukoy ng אֲנָשִׁים; sa konteksto, ang tinutukoy ay ang mga lalaking kasali sa hukbo.
- source_word: הַצֹּבְאִים
  choice: na naglingkod sa hukbo
  rationale: Ipinahahayag ang militar na diwa ng participle mula sa צבא sa natural at malinaw na makabagong Filipino, nang hindi nililimitahan ito sa mismong sandali ng pakikipaglaban.
