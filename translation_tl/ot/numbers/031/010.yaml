  yaml_path: translation/ot/numbers/031/010.yaml
  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: tl
  text: Sinunog nila sa apoy ang lahat ng kanilang mga lungsod sa kanilang mga pamayanan, at ang lahat ng kanilang mga kampo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “mga bakurang pamayanan” o “mga nayon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: kanilang lungsod
  rationale: Karaniwang tumutukoy ang עִיר sa lungsod o bayan. Ang “lungsod” ay malinaw at angkop sa kontekstong militar at heograpiko.
- source_word: בְּמוֹשְׁבֹתָם
  choice: sa mga lugar na tinitirhan nila
  rationale: Ang מוֹשָׁב ay maaaring tumukoy sa tirahan o pamayanan. Pinananatili ng pariralang ito ang lokatibong diwa sa natural na makabagong Tagalog nang hindi ipinapantay ang salita sa “lungsod.”
- source_word: טִירֹתָם
  choice: kanilang kampo
  rationale: Ang טִירָה ay maaaring tumukoy sa kampo, bakurang pamayanan, o nayon. Sa pagkakatambal nito sa “mga lungsod,” pinananatili ng “kampo” ang pagkakaiba ng dalawang uri ng tirahan.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: sinunog nila sa apoy
  rationale: Tahasang ipinahahayag ng Hebreo ang apoy bilang instrumento. Bagaman may bahagyang pag-uulit sa Tagalog, pinananatili nito ang diin at anyo ng pinagmulan.
- source_word: וְאֵת ... וְאֵת
  choice: ang lahat ... at ang lahat
  rationale: Pinananatili ang magkatugmang diin ng dalawang tuwirang layon na kapwa saklaw ng כָּל.
