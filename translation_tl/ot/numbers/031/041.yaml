id: NUM.31.41
reference: Numbers 31:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: At ibinigay ni Moises kay Eleazar na pari ang takdang bahagi[a], ang handog para kay Yahweh[b], gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pataw” o “buwis”; ito ang bahaging itinakdang kunin mula sa nasamsam.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “handog ni Yahweh” o “ambag para kay Yahweh”; ayon sa tradisyon, “handog na itinaas para kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Tuwirang isinasalaysay ng pandiwang נתן ang ginawa ni Moises; natural sa modernong Tagalog ang “ibinigay.”
- source_word: מֶכֶס
  choice: takdang bahagi
  rationale: Sa konteksto ng nasamsam sa digmaan, tumutukoy ito sa bahaging itinakda o ipinataw na kunin mula sa kabuuan. Iniiwasan ng “takdang bahagi” ang makabagong administratibong dating ng “buwis,” habang pinananatili ang ideya ng sapilitang pagtatasa.
- source_word: תְּרוּמַת יְהוָה
  choice: ang handog para kay Yahweh
  rationale: Ang תְּרוּמָה ay bahaging ibinukod bilang sagradong handog o ambag. Ipinahihiwatig ng parirala na ang takdang bahagi ay inilaan para kay Yahweh, nang hindi ipinapasok ang mas teknikal na katawagang “handog na itinaas.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: kay Eleazar na pari
  rationale: Natural at tuwirang katumbas ito ng pariralang Hebreo, na kinikilala si Eleazar at ang kanyang tungkulin.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Pinananatili nito ang pormulang nagsasaad na eksaktong tumalima si Moises sa naunang utos ni Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na halinhan ito ng isang titulo.
- issue: Ugnayan ng מֶכֶס at תְּרוּמַת יְהוָה
  choice: 'Magkatabing paglalarawan sa iisang bahagi: “ang takdang bahagi, ang handog para kay Yahweh”'
  alternative: “ang takdang bahagi bilang handog para kay Yahweh”
  rationale: Pinananatili ng kuwit ang anyong appositional ng Hebreo at ang kaunting kalabuan kung ang ikalawang parirala ay pagpapangalan o pagpapaliwanag sa una.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “takdang bahagi” upang maging madaling maunawaan sa konteksto nang hindi magtunog na makabagong buwis ng pamahalaan. Ang “na pari” ay mas natural sa kasalukuyang Tagalog kaysa sa mas pormal na “ang pari.”
