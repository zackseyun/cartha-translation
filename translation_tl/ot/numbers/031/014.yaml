  text: וַ/יִּקְצֹ֣ף מֹשֶׁ֔ה עַ֖ל פְּקוּדֵ֣י הֶ/חָ֑יִל שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/שָׂרֵ֣י הַ/מֵּא֔וֹת הַ/בָּאִ֖ים מִ/צְּבָ֥א הַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: tl
  text: Nagalit si Moises sa mga pinuno ng hukbo[a]—sa mga kumander ng libu-libo at sa mga kumander ng daan-daan—na dumarating mula sa paglilingkod sa digmaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga itinalagang opisyal ng puwersang militar.” Ang salitang Hebreo ay tumutukoy sa mga taong itinalaga at may pananagutan sa hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: Nagalit
  rationale: Likas at malinaw na katumbas ng קצף sa makabagong Filipino; ipinahahayag ang matinding galit nang hindi dinaragdagan ang lakas bilang “nagngitngit.”
- source_word: פְּקוּדֵי הֶחָיִל
  choice: mga pinuno ng hukbo
  rationale: Tinutukoy ng פְּקוּדֵי ang mga itinalaga o may pananagutan sa puwersang militar. Ang “mga pinuno ng hukbo” ay natural at hindi inuulit nang eksakto ang kasunod na mas tiyak na mga ranggo.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: mga kumander ng libu-libo
  rationale: Pinananatili ang organisasyong militar na ipinahihiwatig ng Hebreo at gumagamit ng karaniwang makabagong terminong militar.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: mga kumander ng daan-daan
  rationale: Kaagapay ng naunang parirala at pinananatili ang bilang at estruktura ng Hebreo.
- source_word: הַבָּאִים
  choice: na dumarating
  rationale: Ang kasalukuyang anyong pandiwari ay inilalarawan bilang nagpapatuloy o kasabay na kilos; hindi idinagdag ang interpretatibong “bumabalik.”
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: mula sa paglilingkod sa digmaan
  rationale: Pinananatili ang saklaw ng צבא bilang serbisyong militar at ang malinaw na diwa ng digmaan, sa halip na paliitin ito sa isang partikular na labanan o kampanya.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “hukbo” at “kumander” para sa malinaw na kontekstong militar; pinanatili ang Hebreong ayos ng libu-libo at daan-daan at ang bahagyang literal na “paglilingkod sa digmaan” upang hindi mawala ang leksikal na lawak ng parirala.
