translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “lipi” para sa מַטֶּה at “tig-iisang libo” upang natural na maipahayag ang pamamahagi sa bawat lipi. Inilagay ang mga panandang talababa sa mismong salin at inayos ayon sa kanilang paglitaw: [b] kasunod ng “Israel” at [a] kasunod ng “itinalaga.”'
