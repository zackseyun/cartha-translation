translation:
  language: tl
  text: Kaya, mula sa mga libo ng Israel[b], ay itinalaga[a] ang tig-iisang libo mula sa bawat lipi—labindalawang libong lalaking nasasandatahan para sa digmaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ibinigay,” “ipinaubaya,” o “tinipon para sa hukbo”; ang pandiwang Hebreo ay maaaring mangahulugang inilaan o itinalaga para sa paglilingkod.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga libo ng Israel” ay maaaring tumukoy hindi lamang sa bilang kundi pati sa malalaking angkan o mga yunit ng hukbo ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: itinalaga
  rationale: Ipinahihiwatig ng Niphal na ang mga lalaki ay ibinigay o inilaan mula sa Israel para sa paglilingkod militar. Likas sa makabagong Tagalog ang “itinalaga” at pinananatili nito ang diwang pasibo nang hindi labis na literal.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: mula sa libu-libo ng Israel
  rationale: Pinananatili ang literal na “libu-libo,” habang nililinaw sa talababa na maaari rin itong tumukoy sa mga angkan o yunit na panlipunan o militar.
- source_word: אֶלֶף לַמַּטֶּה
  choice: tig-iisang libo mula sa bawat lipi
  rationale: 'Distributibo ang parirala sa konteksto: bawat lipi ay naglaan ng isang libong lalaki. Malinaw at natural sa Tagalog ang “tig-iisang libo mula sa bawat lipi.”'
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: labindalawang libo
  rationale: Tuwirang salin ng bilang na nagbubuod sa kabuuang puwersa.
- source_word: חֲלוּצֵי צָבָא
  choice: sandatahan para sa digmaan
  rationale: Ang parirala ay tumutukoy sa mga lalaking nasasandatahan o nakahanda para sa gawaing militar. Maikli at marangal ang “sandatahan para sa digmaan,” at hindi nito dinaragdagan ang teksto ng tahasang salitang “mga lalaki.”
