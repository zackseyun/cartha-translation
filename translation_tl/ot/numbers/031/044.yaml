lexical_decisions:
- source_word: וּ/בָקָר
  choice: at … baka
  rationale: Ang בָּקָר ay kolektibong tumutukoy sa mga bakang alaga; natural sa modernong Tagalog ang “baka” bilang pangngalang panlahat. Isinalin ang prefixed וּ bilang “at” upang mapanatili ang dugtong na ayos ng talaan.
- source_word: שִׁשָּׁה וּ/שְׁלֹשִׁים אָלֶף
  choice: tatlumpu't anim na libo
  rationale: Literal na ‘anim at tatlumpung libo’ ang ayos sa Hebreo, ngunit ang karaniwang ayos sa modernong Tagalog ay “tatlumpu't anim na libo,” na eksaktong nagpapanatili sa bilang na 36,000.
