  yaml_path: translation/ot/numbers/031/038.yaml
  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: tl
  text: Ang mga baka ay tatlumpu't anim na libo, at ang bahaging iniukol mula sa mga iyon para kay Yahweh ay pitumpu't dalawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: ang mga baka
  rationale: Ang בָּקָר ay kolektibong tumutukoy sa mga bovine o cattle; sa modernong Tagalog, malinaw at likas ang “mga baka” sa talaan ng mga nasamsam.
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: tatlumpu't anim na libo
  rationale: Isinaayos ang literal na ayos na “anim at tatlumpung libo” ayon sa karaniwang pagbibilang sa Tagalog nang walang pagbabago sa halaga.
- source_word: מִכְסָם
  choice: ang bahaging iniukol mula sa mga iyon
  rationale: Sa kontekstong ito, ang מֶכֶס ay takdang bahaging kinuha mula sa nasamsam at itinalaga kay Yahweh. Mas malinaw rito ang pariralang ito kaysa sa posibleng makabagong kahulugan ng “buwis” o “tributo.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng ל ang bahaging itinalaga o inilaan kay יהוה; ang pangalang tipan ay tinumbasan bilang “Yahweh.”
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: pitumpu't dalawa
  rationale: Isinalin sa natural na ayos ng bilang sa modernong Tagalog.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangngalang pantangi ang יהוה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang tahasang banal na pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng paliwanag na pangdoktrina.
- issue: Kahulugan ng מִכְסָם bilang bahagi ng samsam
  choice: bahaging iniukol mula sa mga iyon
  alternative: kanilang buwis / kanilang tributo
  rationale: Ipinakikita ng konteksto na ito ang takdang bahagi mula sa bilang ng mga baka na inilaan kay Yahweh. Iniiwasan ng salin ang makabagong pampamahalaang pahiwatig ng “buwis” at ang di-gaanong likas na “tributo.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga baka” bilang likas na kolektibong tawag at pinalawak nang bahagya ang מִכְסָם upang luminaw na ang pitumpu't dalawa ay takdang bahagi mula sa mga baka.
