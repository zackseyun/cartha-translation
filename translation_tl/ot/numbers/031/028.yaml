  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/הֲרֵמֹתָ֨ מֶ֜כֶס לַֽ/יהוָ֗ה מֵ/אֵ֞ת אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים לַ/צָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵ/חֲמֵ֖שׁ הַ/מֵּא֑וֹת מִן הָ/אָדָם֙ וּ/מִן הַ/בָּקָ֔ר וּ/מִן הַ/חֲמֹרִ֖ים וּ/מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: tl
  text: 'At maglaan ka para kay Yahweh ng isang takdang bahagi mula sa mga lalaking mandirigma na lumabas upang makipaglaban: isa sa bawat limang daan[a], mula sa mga tao, mga baka, mga asno, at mga kawan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang buháy na nilalang sa bawat limang daan.” Ginagamit dito ang nefesh bilang pantukoy sa isang indibiduwal, tao man o hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרֵמֹתָ מֶכֶס
  choice: maglaan ... ng isang takdang bahagi
  rationale: Ang Hiphil ng רום kasama ng מֶכֶס ay tumutukoy sa pagbubukod ng itinakdang bahagi mula sa samsam. Likas sa modernong Tagalog ang pariralang ito at naiiwasan ang makabagong burukratikong dating ng “buwis.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahahayag ang banal na pangalang יהוה bilang “Yahweh,” at ang “para kay” ay nagpapakitang nakatalaga sa kaniya ang bahaging ito.
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: mula sa mga lalaking mandirigma na lumabas upang makipaglaban
  rationale: Pinananatili ang tahasang panlalaking katawagan at ang diwang militar ng parirala; malinaw at natural sa Tagalog ang “lumabas upang makipaglaban.”
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: isa sa bawat limang daan
  rationale: Sa konteksto, ginagamit ang נֶפֶשׁ bilang panukat sa isang indibiduwal na buháy na nilalang, tao man o hayop. Ang pangunahing teksto ay ginawang likas sa Tagalog, habang ipinapaliwanag sa talababa ang saklaw ng Hebreo.
- source_word: מִן הָאָדָם
  choice: mula sa mga tao
  rationale: Ang אָדָם ay tumutukoy rito sa bahaging tao ng samsam, na ipinaghihiwalay sa mga hayop na kasunod.
- source_word: וּמִן הַבָּקָר
  choice: mga baka
  rationale: Ang בָּקָר ay kolektibong katawagan sa mga bakang alaga; “mga baka” ang payak at karaniwang salin sa Tagalog.
- source_word: וּמִן הַחֲמֹרִים
  choice: mga asno
  rationale: Ang “asno” ang malinaw at dignified na modernong katawagan sa hayop na tinutukoy.
- source_word: וּמִן הַצֹּאן
  choice: mga kawan
  rationale: Ang צֹאן ay kolektibong tumutukoy sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; pinananatili ng “mga kawan” ang kolektibong anyo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang nasa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi pinapalitan ng titulo.
- issue: Kahulugan ng נֶפֶשׁ sa bilang
  choice: Isinaling idiomatikong “isa,” na may paliwanag sa talababa
  alternative: isang kaluluwa; isang buháy na nilalang
  rationale: Hindi tinutukoy rito ang isang hiwalay na espirituwal na sangkap; nagsisilbi ang נֶפֶשׁ bilang bilang ng indibiduwal na buháy na nilalang at sumasaklaw kapwa sa tao at hayop.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “takdang bahagi” sa halip na “buwis” o “tributo” upang maipahayag ang sapilitang itinakdang bahagi ng samsam nang hindi magtunog makabagong burukrasya. Nasa mismong teksto ang marker na [a].
