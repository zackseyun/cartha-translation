base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: tl
  text: Kaya kinuha nina Moises at Eleazar na pari ang ginto mula sa mga kumander ng mga pangkat na tig-iisang libo at tig-iisang daan. Dinala nila iyon sa tolda ng pagpupulong bilang isang alaala para sa mga anak ni Israel[a] sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Ang literal na Hebreo ay “mga anak ni Israel,” isang nakaugaliang katawagang pangtipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Tuwirang ipinahahayag ng לקח ang pagkuha; ang anyong isahan sa Hebreo ay natural na isinalin sa Tagalog na konstruksiyong “kinuha nina” para sa tambalang simuno na sina Moises at Eleazar.
- source_word: הַזָּהָב
  choice: ang ginto
  rationale: Pinananatili ng “ang” ang katiyakan ng pangngalan at tumutukoy sa partikular na gintong nabanggit sa naunang konteksto.
- source_word: מֵאֵת
  choice: mula sa
  rationale: Ipinakikita rito ng parirala ang pinagmulan ng ginto; natural at eksakto ang “mula sa” sa Tagalog.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: mga kumander ng mga pangkat na tig-iisang libo at tig-iisang daan
  rationale: Militar ang konteksto kaya ang שׂרים ay “mga kumander.” Nililinaw ng “mga pangkat na” na ang libu-libo at daan-daan ay mga yunit na pinamumunuan, hindi paglalarawan sa dami ng mga kumander.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagpupulong
  rationale: Natural na salin ito ng nakatalagang lugar ng pakikipagtagpo sa Diyos habang pinananatili ang larawang “tolda.”
- source_word: זִכָּרוֹן
  choice: bilang isang alaala
  rationale: Saklaw ng זִכָּרוֹן ang isang bagay na nagsisilbing tanda ng pag-alaala; ang “bilang isang alaala” ay natural at pinananatili ang gamit nitong pangkulto.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Pormal nitong pinananatili ang Hebreong idyomang “mga anak ni Israel” bilang katawagang pangtipan, habang inilalagay sa talababa ang mas idyomatikong alternatibo.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang pananalitang tumutukoy sa presensiya ni Yahweh sa kontekstong pangkulto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Paglalahad sa בני ישראל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ng pangunahing teksto ang anyo at pangtipang kulay ng pariralang Hebreo, ngunit kinikilala sa talababa ang natural na katumbas sa modernong Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kumander” dahil tahasang militar ang konteksto, at ang “mga pangkat na tig-iisang libo at tig-iisang daan” upang maging maliwanag sa karaniwang mambabasa ang organisasyong tinutukoy. Hinati sa dalawang pangungusap para sa likas na daloy sa Tagalog nang hindi binabago ang ugnayan ng mga kilos.
