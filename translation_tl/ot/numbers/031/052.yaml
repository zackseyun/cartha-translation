id: NUM.31.52
reference: Numbers 31:52
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: tl
  text: Ang kabuuang ginto ng handog na iniharap nila kay Yahweh ay 16,750 siklo[a]. Nagmula ito sa mga pinuno ng libu-libo at sa mga pinuno ng daan-daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang siklo ay yunit ng timbang. Ang 16,750 siklo ay humigit-kumulang 190 kilo, bagaman nagkakaiba ang tinatayang bigat ng sinaunang siklo.
    reason: ancient_measurement
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: Ang kabuuang ginto ... ay
  rationale: Likas na Filipino para sa pahayag ng kabuuang halaga, habang pinananatili ang diin ng כָּל sa totalidad.
- source_word: הַתְּרוּמָה
  choice: handog
  rationale: Tumutukoy sa ambag na ibinukod para sa sagradong layunin. Mas natural at malinaw sa modernong Filipino kaysa sa literal na katawagang may ideya ng 'pag-aangat.'
- source_word: אֲשֶׁר הֵרִימוּ
  choice: na iniharap nila
  rationale: Ang Hiphil ng רום dito ay idiomatikong tumutukoy sa paghahandog o pagbubukod, hindi kinakailangang sa literal na pag-angat.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na nakasulat sa tekstong Hebreo; ang 'kay' ang natural na pananda sa Filipino para sa paghaharap sa isang persona.
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: 16,750 siklo
  rationale: Tuwirang inilalahad ang bilang at tinutumbasan ang sinaunang yunit na שֶׁקֶל ng kinaugaliang saling 'siklo.'
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: Nagmula ito sa mga pinuno ng libu-libo at sa mga pinuno ng daan-daan
  rationale: Ipinapahayag ang pinagmulan ng ginto at pinananatili ang magkatulad na estruktura ng dalawang antas ng pamumunong militar.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang taglay ng tekstong Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng תְּרוּמָה
  choice: handog
  alternative: ambag / handog na itinaas
  rationale: Ang termino ay maaaring tumukoy sa kontribusyong ibinukod para kay Yahweh. Ang 'handog' ay malinaw at likas, samantalang ang alternatibong 'handog na itinaas' ay maaaring maling magpahiwatig na literal na galaw ang pangunahing diwa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginawang dalawang pangungusap upang maiwasan ang mabigat na hulma habang nananatiling malinaw na ang ginto ay nagmula sa mga pinuno. Ang 'libu-libo' at 'daan-daan' ay pinanatili upang katawanin ang mga yunit ng organisasyong militar sa Hebreo.
