  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: tl
  text: At hatiin mo ang samsam[a] sa mga mandirigmang lumabas upang makipagdigma at sa buong kapulungan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nasamsam.” Saklaw ng salitang Hebreo ang mga tao, hayop, at ari-ariang nakuha sa digmaan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “buong pamayanan” o “buong sambayanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: At hatiin mo
  rationale: Ang pandiwang חצה ay nangangahulugang hatiin. Ang anyong pautos na may “mo” ay natural sa Filipino at angkop sa tagubilin kay Moises.
- source_word: הַמַּלְקוֹחַ
  choice: ang samsam
  rationale: Tumutukoy ang מַלְקוֹחַ sa mga tao, hayop, at ari-ariang nakuha sa digmaan. Malinaw at malawak ang saklaw ng “samsam” sa kontekstong ito.
- source_word: בֵּין ... וּבֵין
  choice: sa ... at sa
  rationale: Bagaman literal na minamarkahan ng Hebreo ang paghahati “sa pagitan” ng dalawang pangkat, mas natural sa Filipino ang “hatiin ... sa [unang pangkat] at sa [ikalawang pangkat].”
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: mga mandirigma
  rationale: Literal itong idyomang “mga humahawak sa digmaan,” na tumutukoy sa mga aktuwal na nakipaglaban. Tumpak at natural ang “mga mandirigma.”
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: lumabas upang makipagdigma
  rationale: Tinutukoy ng parirala ang paglabas para sa isang kampanyang militar; inihahatid ng salin ang diwang iyon nang hindi gumagamit ng di-natural na “lumabas sa hukbo.”
- source_word: כָּל הָעֵדָה
  choice: buong kapulungan
  rationale: Ang עֵדָה ay ang buong nagkakatipong pamayanan ng Israel. Pinananatili ng “kapulungan” ang kolektibo at biblikal na diwa nito.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang tuwirang pautos na “hatiin mo” at ang natural na ayos na “sa ... at sa” para sa dalawang pangkat, habang pinananatili ang saklaw ng “samsam” at ang kolektibong kahulugan ng “kapulungan.”
