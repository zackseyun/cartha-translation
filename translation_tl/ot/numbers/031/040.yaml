  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: tl
  text: At ang mga tao ay labing-anim na libo, at ang itinakdang bahagi para kay Yahweh[a] ay tatlumpu’t dalawang tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang itinakdang ambag para kay Yahweh.” Tumutukoy ang Hebreo sa bahaging itinakda mula sa nasamsam at ibinukod para kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: mga tao
  rationale: Sa konteksto ng talaan ng mga nasamsam, ang parirala ay tumutukoy sa mga indibidwal na tao bilang kaiba sa mga hayop. Likas at malinaw sa makabagong Tagalog ang “mga tao.”
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: labing-anim na libo
  rationale: Tuwirang salin ng bilang na 16,000.
- source_word: מִכְסָם
  choice: bahagi nila
  rationale: Tumutukoy ito sa itinakdang bahagi mula sa nasamsam na inilaan kay Yahweh. Ang “bahagi” ay natural sa Tagalog at akma sa konteksto; maaari ring sabihing “singil” o “buwis,” ngunit maaaring magbigay ang mga iyon ng mas makabagong kahulugang pampinansiyal.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng pang-ukol ang paglalaan ng bahagi kay YHWH; pinananatili ang personal na pangalang “Yahweh.”
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: tatlumpu't dalawang tao
  rationale: Ang נֶפֶשׁ ay ginagamit dito bilang pantukoy sa bilang ng mga indibidwal na tao, hindi bilang teknikal na pahayag tungkol sa kaluluwa.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tahasang nasa Hebreong teksto ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng נֶפֶשׁ sa pagbibilang ng mga bihag
  choice: tao
  alternative: kaluluwa
  rationale: Sa administratibong talaang ito, ang salita ay tumutukoy sa buong indibidwal na tao. Ang “kaluluwa” ay mas literal sa anyo ngunit maaaring magpasok ng metapisikal na diwa na hindi siyang pokus dito.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “ang bilang ng mga tao” upang maging natural ang listahang numerikal, habang pinananatili ang kaibahan ng mga tao sa mga hayop sa konteksto. Ang “bahagi” ay umiwas sa di-kinakailangang modernong pahiwatig ng “buwis.”
