  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: tl
  text: Sinabi ni Moises sa kanila, “Pinanatili ba ninyong buhay ang bawat babae?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hinayaan ba ninyong mabuhay ang bawat babae?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salaysay na anyo ng אמר; natural itong isalin sa payak na nagdaang panahon sa Filipino.
- source_word: אֲלֵיהֶם
  choice: sa kanila
  rationale: Ang אֶל na may hulaping pangatlong panauhang maramihan ay tumutukoy sa mga taong pinagsabihan.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Moses sa modernong saling Filipino.
- source_word: הַחִיִּיתֶם
  choice: Bakit ninyo hinayaang mabuhay
  rationale: Ang causative na anyo ng חיה ay nangangahulugang ‘hayaang mabuhay’ o ‘panatilihing buhay.’ Bagaman walang hiwalay na salitang ‘bakit’ sa Hebreo, maaaring magpahiwatig ang anyong patanong dito ng pagsaway; inilalagay sa talababa ang mas pormal na alternatibo upang mapanatili ang tunay na posibilidad ng simpleng tanong.
- source_word: כָּל
  choice: bawat
  rationale: Kasama ng pangngalang isahan, malinaw na ipinapahayag ng ‘bawat’ ang saklaw na isa-isa at walang itinatangi.
- source_word: נְקֵבָה
  choice: babae
  rationale: Sa Filipino, ang ‘babae’ ay maaaring tumukoy sa kasariang babae nang hindi kinakailangang limitahan sa nasa hustong gulang; mas natural din ito kaysa sa klinikal at di-likas na ‘bawat babaeng tao.’
theological_decisions:
- issue: Saklaw ng נְקֵבָה sa marahas na konteksto ng digmaan
  choice: bawat babae
  alternative: lahat ng babae; bawat babaeng tao
  rationale: Hindi nililimitahan ng Hebreo ang tinutukoy ayon sa edad. Pinananatili ng ‘bawat babae’ ang malawak at mariing saklaw ng teksto nang hindi nagdaragdag ng interpretasyong ‘mga babae at batang babae.’
- issue: Lakas ng tanong sa הַחִיִּיתֶם
  choice: Bakit ninyo hinayaang mabuhay
  alternative: Hinayaan ba ninyong mabuhay
  rationale: Sa konteksto, ang tanong ni Moises ay may himig ng pagsaway, kaya natural sa Filipino ang ‘Bakit.’ Gayunman, hindi tahasang nakasulat sa Hebreo ang ‘bakit,’ kaya ibinigay sa talababa ang mas pormal na pagbasa.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matinding pananalita at malawak na saklaw ng orihinal nang hindi nilalambutan o nililimitahan ang tinutukoy ayon sa edad.
