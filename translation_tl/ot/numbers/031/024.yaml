  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: tl
  text: Labhan ninyo ang inyong mga damit sa ikapitong araw, at magiging malinis kayo[a]. Pagkatapos, maaari na kayong pumasok sa kampo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay pagiging malinis ayon sa mga tuntunin sa ritwal; maaari ring isalin na “madadalisay kayo.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na anyo: “pagkatapos ay papasok kayo sa kampo.” Ipinahihiwatig ng konteksto na pinahihintulutan ang muling pagpasok matapos ang paglilinis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: Labhan ninyo
  rationale: Ang Piel ng כבס ay tumutukoy sa paglalaba ng damit o tela. Ang pautos na anyo ay likas na naihahayag sa Filipino sa pamamagitan ng “Labhan ninyo.”
- source_word: בִּגְדֵיכֶם
  choice: ang inyong mga damit
  rationale: Ang בגד ay nangangahulugang damit o kasuotan. Ang “mga damit” ay malinaw at natural sa makabagong Filipino.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: sa ikapitong araw
  rationale: Ito ang tuwiran at karaniwang salin ng Hebreong panandang pamanahon.
- source_word: וּטְהַרְתֶּם
  choice: at magiging malinis kayo
  rationale: Ang Qal ng טהר ay dito'y nagsasaad ng kalagayang bunga ng itinakdang paglilinis. Pinananatili ng “magiging malinis kayo” ang resultative at intransitive na diwa nang hindi ipinapalagay na moral o espirituwal na paglilinis ang tinutukoy.
- source_word: וְאַחַר
  choice: Pagkatapos
  rationale: Natural nitong ipinahahayag ang pagkakasunod-sunod ng paglilinis at muling pagpasok sa kampo.
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: maaari na kayong pumasok sa kampo
  rationale: Ang בוא אל ay maaaring mangahulugang pumasok. Sa konteksto ng mga tuntunin sa ritwal na kalinisan, ipinahihiwatig ng sugnay na pinahihintulutan na ang muling pagpasok kapag natapos na ang paglilinis.
theological_decisions:
- issue: Wika ng ritwal na kalinisan
  choice: magiging malinis kayo
  alternative: dadalisayin kayo; linisin ninyo ang inyong sarili
  rationale: Tinutukoy ng talata ang pagbabalik sa kalagayang malinis ayon sa mga tuntunin matapos ang pakikidigma. Pinananatili ng salin ang wika ng kalagayan sa Hebreo at hindi ito ginagawang tahasang moral o espirituwal na pagdadalisay.
- issue: Pagpasok sa kampo matapos ang paglilinis
  choice: maaari na kayong pumasok sa kampo
  alternative: papasok kayo sa kampo
  rationale: Bagaman hindi tahasang modal ang pandiwang Hebreo, ang konteksto ay tuntunin kung kailan muling pinahihintulutan ang pagpasok. Ang “maaari na” ay naghahayag ng pahintulot nang hindi ginagawang utos ang pagpasok.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “labhan” at “mga damit” bilang mga karaniwang salita, habang nilinaw sa talababa ang teknikal na konteksto ng ritwal na kalinisan.
