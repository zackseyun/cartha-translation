  text: The men of the army had each taken plunder for himself[a].
translation:
  language: tl
  text: Ang mga kawal ay kumuha ng samsam, bawat isa para sa kanyang sarili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Ang mga kawal ay nandambong, bawat isa para sa kanyang sarili.”
