lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  choice: ang mga kawal
  rationale: Ang pariralang literal na “mga lalaki ng hukbo” ay tumutukoy sa mga lalaking kabilang sa puwersang militar. Ang “mga kawal” ang pinakanatural at tumpak na tawag sa makabagong Filipino.
- source_word: בָּזְזוּ
  choice: kumuha ng samsam
  rationale: Ang pandiwang בזז ay nangangahulugang mandambong o kumuha ng samsam. Ginagawang hayag ng pariralang ito ang ipinahihiwatig na layon habang pinananatili ang diwa ng pandarambong.
- source_word: אִישׁ לוֹ
  choice: bawat isa para sa kanyang sarili
  rationale: 'Distributibo ang ekspresyon: ang bawat kawal ay kumuha para sa sarili niya. Pinananatili ng salin ang indibiduwal na pag-angkin nang hindi nagdaragdag ng kahulugang wala sa Hebreo.'
