revisions:
- from: Dinala nila ang mga bihag, ang mga nakuhang pag-aari, at ang mga samsam kay Moises, kay Eleazar na pari, at sa kapulungan ng mga Israelita. Dinala nila ang mga ito sa kampo sa kapatagan ng Moab[a], sa tabi ng Jordan sa tapat ng Jerico.[b]
