  rationale: Pinag-isa ang pangungusap upang sundan ang iisang pandiwa ng Hebreo at pinalitan ang pangunahing heograpikong paglalarawan ng mas hindi mapagpasiyang salin. Inilagay sa talababa ang mga posibleng mas literal o mas tiyak na heograpikong pag-unawa nang hindi ipinipilit ang alinman sa mga ito.
