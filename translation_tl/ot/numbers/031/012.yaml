base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: tl
  text: Dinala nila ang mga bihag, ang mga nakuhang ari-arian, at ang mga samsam kina Moises, Eleazar na pari, at sa kapulungan ng mga Israelita, sa kampo sa kapatagan ng Moab[a], na nasa tabi ng Jordan malapit sa Jerico.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malawak na kaparangan ng Moab.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na nasa Jordan ng Jerico” o “na nasa tabi ng Jordan sa tapat ng Jerico.”
    reason: geographical_ambiguity
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Dinala nila
  rationale: Ang Hiphil ng בוא ay may karaniwang diwang “dalhin,” at pinagtitibay ito ng mga tuwirang layon na kasunod.
- source_word: הַשְּׁבִי
  choice: mga bihag
  rationale: Sa konteksto ng digmaan, tumutukoy ito sa mga taong nabihag, hindi sa abstraktong kalagayan ng pagkabihag.
- source_word: הַמַּלְקוֹחַ
  choice: mga nakuhang pag-aari
  rationale: Tumutukoy ito sa mga bagay o ari-ariang nakuha sa digmaan, kabilang sa konteksto ang maaaring mailipat na pag-aari; pinananatili itong naiiba sa שׁלל.
- source_word: הַשָּׁלָל
  choice: mga samsam
  rationale: Ang “samsam” ang natural na makabagong katawagan sa mga nakuha bilang samsam sa digmaan at naihihiwalay sa naunang מלקוח.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kapulungan ng mga Israelita
  rationale: Ipinapahayag ng “kapulungan” ang organisadong pamayanan o pagtitipon, samantalang natural na katumbas sa modernong Filipino ang “mga Israelita” para sa בני ישראל.
- source_word: אֶל הַמַּחֲנֶה
  choice: sa kampo
  rationale: Ipinahihiwatig ng אֶל ang patutunguhan; hindi nito kailangang tiyaking pumasok sila sa loob ng kampo.
- source_word: עַרְבֹת מוֹאָב
  choice: kapatagan ng Moab
  rationale: Ang “kapatagan” ay malinaw at kinikilalang heograpikong salin, bagaman maaari ring ilarawan ang lugar bilang malawak na damuhan o steppe.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: sa tabi ng Jordan sa tapat ng Jerico
  rationale: Natural nitong inilalarawan ang lokasyon ng kapatagan sa silangang panig ng Jordan, kaharap ng Jerico, nang hindi ginagawang bahagi ng Jerico ang Jordan.
