id: NUM.31.22
reference: Numbers 31:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֥ךְ אֶת הַ/זָּהָ֖ב וְ/אֶת הַ/כָּ֑סֶף אֶֽת הַ/נְּחֹ֨שֶׁת֙ אֶת הַ/בַּרְזֶ֔ל אֶֽת הַ/בְּדִ֖יל וְ/אֶת הָ/עֹפָֽרֶת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/022.yaml
  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: tl
  text: Tanging ang ginto, ang pilak, ang tanso[a], ang bakal, ang lata, at ang tingga—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bronse.” Ang salitang Hebreo ay maaaring tumukoy sa tanso o, sa mas malawak na diwa, sa metal na nakabatay sa tanso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Tanging
  rationale: Naghahayag ito rito ng pagtatangi o paglilimita sa mga bagay na susunod, sa halip na isang matinding pagsalungat.
- source_word: הַזָּהָב
  choice: ang ginto
  rationale: Karaniwang tawag sa metal na ginto; pinanatili ang pantukoy upang maging malinaw at marangal ang talaan.
- source_word: הַכָּסֶף
  choice: ang pilak
  rationale: Tumutukoy rito sa metal na pilak, hindi sa salapi, dahil ang konteksto ay talaan ng mga metal.
- source_word: הַנְּחֹשֶׁת
  choice: ang tanso
  rationale: Ang salitang Hebreo ay maaaring tumukoy sa copper o bronze. Ang “tanso” ay natural at karaniwang salin sa Filipino, habang inilalahad sa talababa ang posibleng “bronse.”
- source_word: הַבַּרְזֶל
  choice: ang bakal
  rationale: Karaniwan at tuwirang katumbas ng salitang Hebreo para sa iron.
- source_word: הַבְּדִיל
  choice: ang lata
  rationale: Tumutukoy sa tin sa talaang ito ng mga metal; “lata” ang karaniwang katawagang Filipino sa elementong iyon.
- source_word: הָעֹפָרֶת
  choice: ang tingga
  rationale: Karaniwan at tiyak na katawagang Filipino sa lead bilang metal.
- source_word: אֵת (inuulit bago ang bawat pangngalan)
  choice: hindi isinalin nang hiwalay
  rationale: Ang panandang ito ng tuwirang layon ay walang tuwirang katumbas sa Filipino; naipakikita ang ayos at diin ng talaan sa pamamagitan ng pag-uulit ng “ang” at ng pagbabantas.
