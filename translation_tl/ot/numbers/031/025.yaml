  text: 'At sinabi ni Yahweh kay Moises:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive kasama ng אמר ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod, at tuwirang tinutumbasan ng “sinabi” ang pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang natural na panandang Tagalog para sa taong kinakausap; “Moises” ang nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: לֵאמֹר
  choice: panimulang panipi (“)
  rationale: Ipinakikilala ng infinitive na לֵאמֹר ang mismong nilalaman ng pahayag sa kasunod na talata. Sa natural na Tagalog, malinaw itong naipahihiwatig ng pambungad na panipi nang hindi gumagamit ng mabigat at paulit-ulit na “na sinasabi.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan at hindi ito ginagawang titulo.
- issue: Pagpapanatili sa tungkulin ng לֵאמֹר
  choice: Ipinahiwatig sa pamamagitan ng pambungad na panipi
  alternative: “na sinasabi” / “ganito”
  rationale: Ang לֵאמֹר ay pormulang nagpapakilala sa susunod na sinabi. Ang panipi ay likas at malinaw sa Tagalog, at ipinakikitang nagpapatuloy ang pangungusap sa talata 26.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “sinabi” bilang tumpak na katumbas ng אמר at iniwang bukas ang panipi dahil sa susunod na talata nagsisimula ang nilalaman ng sinabi.
