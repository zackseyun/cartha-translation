  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: tl
  text: Pagkatapos, lumabas sina Moises, ang paring si Eleazar, at ang lahat ng pinuno ng kapulungan upang salubungin sila sa labas ng kampo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: lumabas
  rationale: Ang pandiwang יצא ay nagsasaad ng paglabas mula sa isang lugar; natural sa salaysay ang “lumabas.”
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ang paring si Eleazar
  rationale: Likas sa modernong Tagalog ang ayos na ito para sa titulong tumutukoy sa tungkulin ni Eleazar.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: ang lahat ng pinuno ng kapulungan
  rationale: Ang נְשִׂיאִים ay mga kinikilalang pinuno ng pamayanan, hindi kinakailangang mga prinsipe; ang עֵדָה ay tumutukoy sa nagkakatipong pamayanan ng Israel.
- source_word: לִקְרָאתָם
  choice: upang salubungin sila
  rationale: Ipinahahayag ng anyong may לְ ang layunin ng paglabas; ang “salubungin” ang natural na Tagalog para sa pagpunta upang katagpuin ang mga dumarating.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Idyomatikong tumutukoy ang parirala sa lugar sa kabila ng hangganan ng kampo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kapulungan” bilang natural ngunit may dignidad na katawagan sa organisadong pamayanan ng Israel; walang talababa dahil walang mahalagang kalabuan na kailangang ipaliwanag sa talatang ito.
