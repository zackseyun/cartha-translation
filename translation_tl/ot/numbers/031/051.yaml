revisions:
- from: Kaya kinuha nina Moises at Eleazar na pari mula sa kanila ang ginto—ang bawat bagay na yari.[a]
  to: Kinuha nina Moises at Eleazar na pari mula sa kanila ang ginto, lahat ng bagay na gawa.[a]
  rationale: Inayos ang kolektibong parirala para sa כָּל־כְּלִי מַעֲשֶׂה sa likas na modernong Tagalog, inalis ang posibleng di-sinasadyang ugnayang sanhi ng “Kaya,” at pinasimple ang talababa nang hindi nililimitahan ang kahulugan ng כְּלִי.
  reviewer_model: gpt-5.6-terra
