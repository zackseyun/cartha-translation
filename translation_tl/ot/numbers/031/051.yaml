  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: tl
  text: Kinuha nina Moises at Eleazar na pari mula sa kanila ang ginto, lahat ng bagay na gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng kagamitang gawa,” samakatuwid, lahat ng bagay na gawa sa ginto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Ang pandiwang לקח ay tuwirang tumutukoy sa pagkuha o pagtanggap; pinananatili ng “kinuha” ang kongkretong kilos sa salaysay.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa modernong Bibliyang Tagalog.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: at Eleazar na pari
  rationale: Likas na Tagalog para sa pangalang may kasunod na titulong tumutukoy sa kanyang tungkulin.
- source_word: אֶת הַזָּהָב
  choice: ang ginto
  rationale: Tinutukoy nito ang tiyak na gintong inihaharap sa konteksto.
- source_word: מֵאִתָּם
  choice: mula sa kanila
  rationale: Malinaw na ipinapahayag ang pinagmulan ng gintong kinuha.
- source_word: כֹּל
  choice: bawat
  rationale: Ang “bawat” ay angkop sa isahang kolektibong pariralang kasunod at nagpapahiwatig na walang bagay na hindi kasama.
- source_word: כְּלִי
  choice: bagay
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa isang kagamitan, sisidlan, o iba pang bagay; hindi ito nililimitahan ng “bagay” sa mga sisidlan lamang.
- source_word: מַעֲשֶׂה
  choice: na yari
  rationale: Sa pariralang כְּלִי מַעֲשֶׂה, inilalarawan nito ang mga bagay na ginawa o hinubog, sa halip na hilaw na ginto.
