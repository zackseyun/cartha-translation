  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Eleazar na pari sa mga lalaki sa hukbo na nagpunta sa labanan, “Ito ang alituntunin ng kautusan[a] na iniutos ni Yahweh kay Moises:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tuntunin ng kautusan” o “alituntunin ng tagubilin.”
    reason: Pinananatili ang saklaw ng kahulugan ng חֻקָּה bilang nakatakdang tuntunin o alituntunin at ng תּוֹרָה bilang kautusan o may-awtoridad na tagubilin.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ang paring si Eleazar
  rationale: Natural sa modernong Tagalog ang ayos na ito para sa tiyak na titulo at pangalang pantangi.
- source_word: אַנְשֵׁי הַצָּבָא
  choice: mga tauhan ng hukbo
  rationale: Pinananatili nito ang kolektibong kahulugang militar nang hindi gumagamit ng makalumang pananalita; tumutukoy ang parirala sa mga lalaking kabilang sa hukbo.
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: na nagpunta sa labanan
  rationale: Pinananatili ang kilos na ipinahihiwatig ng participle at ang direksiyong ipinahihiwatig ng לְ, nang hindi tahasang isinasalin na “bumalik mula,” na hindi nakasulat sa parirala.
- source_word: חֻקַּת הַתּוֹרָה
  choice: tuntunin ng kautusan
  rationale: Ang “tuntunin” ay nagpapahayag ng nakatakdang regulasyon, at ang “kautusan” ay angkop sa may-awtoridad na legal na tagubilin ng תּוֹרָה sa kontekstong ito.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: na iniutos ni Yahweh kay Moises
  rationale: Ipinakikita ng אֶת na si Moises ang direktang tumanggap ng utos; pinananatili ang personal na pangalang Yahweh.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “paring si Eleazar” at “mga tauhan ng hukbo” bilang natural na kasalukuyang pananalita, habang pinanatili ang pormal at legal na himig ng pahayag.
