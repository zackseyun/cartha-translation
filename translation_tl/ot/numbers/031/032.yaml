  text: וַ/יְהִי֙ הַ/מַּלְק֔וֹחַ יֶ֣תֶר הַ/בָּ֔ז אֲשֶׁ֥ר בָּזְז֖וּ עַ֣ם הַ/צָּבָ֑א צֹ֗אן שֵׁשׁ מֵא֥וֹת אֶ֛לֶף וְ/שִׁבְעִ֥ים אֶ֖לֶף וַ/חֲמֵֽשֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: tl
  text: Ang nasamsam[a]—ang natira sa samsam na nakuha ng mga kawal—ay 675,000 tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang nakuhang ari-arian, ang natira sa samsam.” Gumagamit ang Hebreo ng dalawang magkalapit na katawagan para sa mga nasamsam sa digmaan (מַלְקוֹחַ at בָּז), marahil bilang pagkakaibang pang-estilo o pag-uuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Ipinahahayag nito ang kabuuang bilang sa talaan; natural sa Filipino ang panaguring may “ay” nang hindi nagdaragdag ng tahasang panandang panahong wala sa Hebreo.
- source_word: הַמַּלְקוֹחַ
  choice: ang nasamsam
  rationale: Tumutukoy sa mga nakuha sa digmaan. Karaniwan at malinaw sa modernong Filipino ang “nasamsam.”
- source_word: יֶתֶר הַבָּז
  choice: ang natira sa mga sinamsam
  rationale: Pinananatili ang diwa ng יֶתֶר bilang natitirang bahagi at ang הַבָּז bilang samsam sa digmaan.
- source_word: אֲשֶׁר בָּזְזוּ
  choice: na sinamsam
  rationale: Tuwirang ipinapahayag ang kilos ng pagkuha bilang samsam sa digmaan, habang likas pa rin ang daloy sa Filipino.
- source_word: עַם הַצָּבָא
  choice: mga kawal
  rationale: Ang literal na “mga tao ng hukbo” ay hindi likas sa Filipino; malinaw at tumpak na ipinahihiwatig ng “mga kawal” ang mga kabilang sa hukbong nakipagdigma.
- source_word: צֹאן
  choice: tupa
  rationale: Sa konteksto ng tiyak na pagbilang ng hayop, “tupa” ang pinakadirekta at natural na salin.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: 675,000
  rationale: Eksaktong kabuuan ito ng 600,000 + 70,000 + 5,000; mas madaling basahin ang numerong anyo sa isang talaan.
