translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang mga gitling upang maipakita na ang “ang natira sa mga sinamsam ng mga kawal” ay paliwanag sa “ang nasamsam,” at upang maiwasan ang mabigat na pag-uulit.
