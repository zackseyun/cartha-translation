  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶת מַלְכֵ֨י מִדְיָ֜ן הָרְג֣וּ עַל חַלְלֵי/הֶ֗ם אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע חֲמֵ֖שֶׁת מַלְכֵ֣י מִדְיָ֑ן וְ/אֵת֙ בִּלְעָ֣ם בֶּן בְּע֔וֹר הָרְג֖וּ בֶּ/חָֽרֶב־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: tl
  text: 'Pinatay nila ang mga hari ng Midian kasama ng iba pa nilang napatay: sina Evi[a], Rekem, Zur, Hur, at Reba—ang limang hari ng Midian. Pinatay rin nila sa pamamagitan ng espada si Balaam na anak ni Beor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabilang sa mga napatay nila.” Masinsin ang pariralang Hebreo at maaaring ilarawan ang mga hari bilang pinatay na kabilang sa iba pang mga patay ng Midian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: pinatay nila
  rationale: Tuwirang katumbas ng Qal perfect 3cp ng הרג; malinaw, natural, at hindi arkaiko sa makabagong Filipino.
- source_word: עַל חַלְלֵיהֶם
  choice: kasama ng iba pa nilang napatay
  rationale: Ipinahihiwatig ng masinsing pariralang Hebreo na pinatay ang mga hari kasama o kabilang sa iba pang mga patay ng Midian. Nililinaw ng 'iba pa' na kabilang din sa mga napatay ang mga hari, nang hindi ipinipilit ang tiyak na espasyal na diwa ng עַל.
- source_word: מַלְכֵי מִדְיָן
  choice: mga hari ng Midian
  rationale: Likas at tuwirang salin ng construct chain; inulit din sa appositional na buod pagkatapos ng mga pangalan.
- source_word: אֱוִי
  choice: Evi
  rationale: Transliterasyon ng pangalang pantangi na angkop sa bigkas at baybay sa Filipino.
- source_word: רֶקֶם
  choice: Rekem
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: צוּר
  choice: Zur
  rationale: Pinananatili ang karaniwang anyong biblikal ng pangalan; hindi ito isinasalin ayon sa posibleng kahulugang leksikal.
- source_word: חוּר
  choice: Hur
  rationale: Karaniwang transliterasyon ng pangalang pantangi.
- source_word: רֶבַע
  choice: Reba
  rationale: Transliterasyon na sumusunod sa nakaugaliang anyong biblikal sa halip na isalin ang pangalan.
- source_word: חֲמֵשֶׁת מַלְכֵי מִדְיָן
  choice: ang limang hari ng Midian
  rationale: Appositional na buod ito ng limang lalaking pinangalanan; natural sa Filipino ang tiyak na pantukoy na 'ang'.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaam na anak ni Beor
  rationale: Natural na Filipino para sa pangalan at patronimiko, habang pinananatili ang tahasang ugnayang ama-anak.
- source_word: בֶּחָרֶב
  choice: sa pamamagitan ng espada
  rationale: Ipinapahayag ang instrumental na gamit ng beth at pinananatili ang kongkretong sandatang binanggit sa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “sina” para sa talaan ng mga pangalan at ang gitling na em dash upang natural na ihiwalay ang appositional na buod. Iniwasan ang arkaikong “tabak” pabor sa mas pangkaraniwang “espada,” habang pinanatili ang tahasang instrumentality ng Hebreo.
