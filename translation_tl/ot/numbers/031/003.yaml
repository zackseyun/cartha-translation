base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: tl
  text: Sinabi ni Moises sa bayan, “Sandatahan ninyo ang mga lalaki mula sa inyong hanay para sa hukbo, at humarap sila laban sa Midian upang ipatupad sa Midian ang paghihiganti ni Yahweh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang paghihiganti para kay Yahweh.” Maaaring tumukoy ang Hebreo sa paghihiganting nauukol kay Yahweh o isinasagawa alang-alang sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sinabi
  rationale: Karaniwang pormula sa salaysay na nagpapakilala ng tuwirang pananalita; natural sa modernong Tagalog.
- source_word: הָעָם
  choice: bayan
  rationale: Tumutukoy sa sambayanang Israel na kinakausap ni Moises; ang “bayan” ay likas at marangal na katumbas.
- source_word: הֵחָלְצוּ מֵאִתְּכֶם אֲנָשִׁים
  choice: Pumili kayo mula sa inyo ng mga lalaking sasandatahan
  rationale: Sa kontekstong militar, ang pandiwa ay tumutukoy sa paghahanda o pagsasandata para sa labanan. Isinasama ng parirala ang pagpili ng mga lalaki mula sa bayan nang hindi ginagawang mandirigma ang leksikal na kahulugan ng אֲנָשִׁים.
- source_word: לַצָּבָא
  choice: para sa hukbo
  rationale: Pinananatili ang kongkretong diwa ng puwersang militar, bagaman maaari rin itong tumukoy sa pakikidigma o paglilingkod militar.
- source_word: וְיִהְיוּ עַל מִדְיָן
  choice: at humarap sila laban sa Midian
  rationale: Ipinahahayag ang mapanlabang pagtutungo o pagkilos laban sa Midian nang hindi labis na tinutukoy ang eksaktong kilos.
- source_word: לָתֵת נִקְמַת
  choice: upang ipatupad ... ang paghihiganti
  rationale: Ang literal na “ibigay” ay idyomatikong nangangahulugang isagawa o ipataw ang paghihiganti; natural dito ang “ipatupad.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: בְּמִדְיָן
  choice: sa Midian
  rationale: Minamarkahan ang Midian bilang puntirya ng paghihiganti.
theological_decisions:
- issue: Ang kaugnayan ng paghihiganti kay Yahweh sa konteksto ng banal na digmaan
  choice: ang paghihiganti ni Yahweh
  alternative: ang paghihiganti para kay Yahweh
  rationale: Ang construct na נִקְמַת יְהוָה ay maaaring tumukoy sa paghihiganting nauukol kay Yahweh o isinasagawa alang-alang sa kanya. Pinananatili ng pangunahing salin ang pinakatuwirang ugnayang genitibo, habang inilalahad sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sasandatahan” upang panatilihin ang tiyak na diwang militar, at ang “mga lalaki” upang tumbasan ang panlalaking pangmaramihan sa Hebreo.
