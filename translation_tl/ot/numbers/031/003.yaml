    rationale: Ang pandiwa ay tumutukoy sa pagsasandata o paghahandang militar. Bagaman ang “mula sa inyo” ay nagpapahiwatig ng mga lalaking kukunin mula sa bayan, ang pangunahing utos ay hindi simpleng pagpili. Ang “sasandatahan” ay maaari ring mabasang mga lalaking sila mismo ang magsasandata, sa halip na mga lalaking sasandatahan ng kausap.
