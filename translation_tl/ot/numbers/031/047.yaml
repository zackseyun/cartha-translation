id: NUM.31.47
reference: Numbers 31:47
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Mula sa kalahating bahagi ng mga anak ni Israel[a], kumuha si Moises ng isa sa bawat limampu, mula sa mga tao at sa mga alagang hayop, at ibinigay niya ang mga iyon sa mga Levita na nagbabantay sa tungkuling nauukol sa tabernakulo ni Yahweh, ayon sa iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel”; ibig sabihin, ang mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Mula sa kalahating bahagi ng mga anak ni Israel
  rationale: Pinananatili ang tahasang Hebreong pananalitang “mga anak ni Israel,” habang nililinaw na ito ang kalahating bahagi ng nasamsam na inilaan sa kanila.
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: isa sa bawat limampu
  rationale: Likas at malinaw na Filipino para sa pataw na isang kinukuha mula sa bawat limampu; hindi ipinapalagay kung alin sa mga posibleng bagay o taong kabilang sa bilang.
- source_word: מִן הָאָדָם
  choice: mula sa mga tao
  rationale: Kolektibo ang אָדָם dito at tumutukoy sa mga taong kabilang sa nasamsam, hindi lamang sa mga lalaking indibidwal.
- source_word: וּמִן הַבְּהֵמָה
  choice: at sa mga alagang hayop
  rationale: Sa konteksto, tumutukoy ang בְּהֵמָה sa mga domestikadong hayop na nasamsam.
- source_word: וַיִּתֵּן אֹתָם
  choice: at ibinigay niya ang mga iyon
  rationale: Sinasalamin ng “mga iyon” ang pangmaramihang hulapi at maaari itong tumukoy sa pinagsamang mga tao at hayop na kinuha bilang bahagi.
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Karaniwang modernong Filipino na katawagan sa pangkat ng tribo ni Levi.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: na nangangasiwa sa tabernakulo ni Yahweh
  rationale: Ipinahahayag ang pananagutan nilang magbantay at tumupad sa tungkulin kaugnay ng tabernakulo nang hindi inuulit nang pilit ang magkaugnay na salitang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Filipino ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ayon sa iniutos ni Yahweh kay Moises
  rationale: Natural na Filipino na nagpapakita na tumalima ang ginawa ni Moises sa naunang utos.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang ginagamit ng Hebreo; pinananatili itong pangalan sa salin at hindi pinapalitan ng titulong “Panginoon.”
- issue: Paglilipat ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang anyong “mga anak” na tahasang nasa Hebreo; inilalagay sa talababa ang mas idiomatikong katumbas.
- issue: Saklaw ng הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: isa sa bawat limampu
  alternative: isang bahaging mula sa limampu
  rationale: Ang parirala ay nagtatakda ng singil na 1:50. Ang napiling anyo ay malinaw sa Filipino at hindi nagdaragdag ng denominasyonal o teolohikal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “tabernakulo” bilang pamilyar na terminong biblikal at ang “nangangasiwa” upang likas na maipahayag ang custodial na tungkulin ng mga Levita.
