  verdict: revise
  source_fidelity: Tumpak ang pagsasalin ng kalahating bahaging nakatalaga sa mga anak ni Israel, ng kuhang isa sa bawat limampu mula sa mga tao at alagang hayop, at ng pagbibigay nito sa mga Levita. Gayunman, ang “nangangasiwa sa tabernakulo” ay masyadong nakatuon sa administrasyon at hindi sapat na naipahahayag ang participial-cognate construction na tumutukoy sa kanilang pagbabantay/pagtupad sa itinakdang tungkulin kaugnay ng tabernakulo.
  naturalness: Likas, malinaw, at angkop ang rehistro ng Filipino. Ang binagong parirala ay nananatiling natural habang mas malapit sa saklaw ng Hebreo.
  terminology: Ang “mga anak ni Israel,” “Levita,” “tabernakulo,” at “Yahweh” ay pare-pareho at angkop. Pinananatili ang “mga tao” bilang kolektibong pagtukoy sa אָדָם.
  issues:
  - severity: medium
    issue: Hindi ganap na naipapahayag ng “na nangangasiwa sa tabernakulo” ang שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה.
    rationale: Ang Hebreo ay tumutukoy sa mga Levita bilang mga nagbabantay o tumutupad sa kanilang itinakdang tungkulin na nauukol sa tabernakulo. Ang “nangangasiwa” ay maaaring magpahiwatig lamang ng pamamahalang administratibo at hindi ang custodial-duty sense.
  revised_text: Mula sa kalahating bahagi ng mga anak ni Israel[a], kumuha si Moises ng isa sa bawat limampu, mula sa mga tao at sa mga alagang hayop, at ibinigay niya ang mga iyon sa mga Levita na nagbabantay sa tungkuling nauukol sa tabernakulo ni Yahweh, ayon sa iniutos ni Yahweh kay Moises.
