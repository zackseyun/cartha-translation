  text: וַ/חֲמֹרִ֕ים שְׁלֹשִׁ֥ים אֶ֖לֶף וַ/חֲמֵ֣שׁ מֵא֑וֹת וּ/מִכְסָ֥/ם לַֽ/יהוָ֖ה אֶחָ֥ד וְ/שִׁשִּֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: tl
  text: Ang mga asno ay 30,500, at ang kanilang takdang ambag[a] kay Yahweh ay 61.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang takdang bahagi” o “kanilang buwis.” Tumutukoy ang salitang Hebreo sa bahaging itinakda mula sa nasamsam at ibinukod para kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: Ang mga asno
  rationale: Ang חֲמֹרִים ay karaniwang pangmaramihang katawagan para sa mga asno. Hindi na isinalin nang hiwalay ang panimulang וַ bilang “at” upang maging natural ang pagpapatuloy ng talaan sa Filipino.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: 30,500
  rationale: Tuwirang kabuuang bilang ito; ginamit ang mga numero dahil talaan ng dami ang konteksto.
- source_word: וּ/מִכְסָ/ם
  choice: ang kanilang takdang ambag
  rationale: Ang מִכֶס dito ay ang itinakdang bahagi ng nasamsam na ibinukod at ibinigay kay Yahweh. Mas malinaw sa karaniwang Filipino ang “takdang ambag” kaysa “buwis,” na maaaring magpahiwatig ng pangkalahatang pagbubuwis.
- source_word: לַ/יהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay nagpapakitang ang takdang bahagi ay para o ibinibigay kay Yahweh. Ginamit ang “kay” bilang likas na pananda sa pangalang pantangi.
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: '61'
  rationale: Ang Hebreo ay literal na “isa at animnapu,” na sa natural na Filipino ay 61; ang mga numero ay angkop sa estilong imbentaryo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalang tipan na יְהוָה ang tahasang nasa tekstong Hebreo; pinanatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng talaan at ginamit ang mga numerong digit para sa madaling pagbasa.
