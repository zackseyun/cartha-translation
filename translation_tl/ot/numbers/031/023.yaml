source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: tl
  text: Ang bawat bagay na maaaring idaan sa apoy ay idaan ninyo sa apoy, at magiging malinis ito. Ngunit dapat din itong dalisayin sa pamamagitan ng tubig para sa paglilinis mula sa karumihan.[a] Ngunit ang anumang hindi maaaring idaan sa apoy ay idaan ninyo sa tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tubig ng karumihan”; ayon sa tradisyon, “tubig ng pagbubukod.” Tingnan ang Bilang 19.
    reason: Pinananatili ang literal na alternatibo at ang tradisyonal na katawagan para sa Hebreong מֵי נִדָּה, samantalang nililinaw ng pangunahing teksto ang gamit nito sa ritwal na paglilinis.
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: ang bawat bagay
  rationale: Tumutukoy ito nang pamahagi at malawakan sa bawat konkretong bagay na nasamsam.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: na maaaring idaan sa apoy
  rationale: Sa konteksto, ang tinutukoy ay mga bagay na kayang dumaan sa apoy nang hindi nasisira, hindi lamang mga bagay na aktuwal na pumapasok dito.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: ay idaan ninyo sa apoy
  rationale: Pinananatili nito ang causative na diwa ng pandiwa at ang mismong ritwal na kilos.
- source_word: וְטָהֵר
  choice: at magiging malinis iyon
  rationale: Ipinahahayag ng pandiwa ang kalagayang resulta ng pagdaan sa apoy; hindi nito inuuna o pinapalitan ang kasunod na kahingian sa ritwal na paglilinis.
- source_word: אַךְ
  choice: Gayunman
  rationale: 'Minamarkahan nito ang mahalagang kwalipikasyon: bukod sa pagdaan sa apoy, kailangan pa rin ang itinakdang paglilinis sa tubig.'
- source_word: בְּמֵי נִדָּה
  choice: sa pamamagitan ng tubig para sa karumihan
  rationale: Malapit ito sa anyo ng Hebreo at tumutukoy sa natatanging tubig na ginagamit laban sa ritwal na karumihan, kaugnay ng Bilang 19, nang hindi isinasara ang leksikal na ambiguwidad.
- source_word: יִתְחַטָּא
  choice: kailangan din itong linisin
  rationale: Sa kontekstong pangpari, nangangahulugan itong sumailalim sa ritwal na paglilinis, hindi magsisi o luminis mula sa moral na kasalanan.
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: Ngunit ang anumang hindi maaaring idaan sa apoy
  rationale: Ipinakikita nito ang praktikal na kaibahan ng mga bagay na kayang tiisin ang apoy at ng mga hindi kaya.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: ay idaan ninyo sa tubig
  rationale: Pinananatili ang magkatulad na pandiwa at estruktura ng mga utos tungkol sa apoy at tubig.
theological_decisions:
- issue: Kalikasan ng paglilinis sa batas na pangpari
  choice: Ipinahayag bilang paglilinis mula sa ritwal na karumihan.
  alternative: Isalin ang חטא bilang paglilinis mula sa kasalanan o bilang pangkalahatang moral na paglilinis.
  rationale: Sa Bilang 31 at sa kaugnay na tuntunin sa Bilang 19, ang paksa ay ritwal na kadalisayan ng mga bagay, hindi kapatawaran sa moral na pagkakasala.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “idinaan sa apoy/tubig” upang mapanatili ang parallelismo ng Hebreo, at ang “ritwal na karumihan” sa paliwanag upang hindi mapagkamalang moral na kasalanan ang usapin.
