  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: tl
  text: At linisin ninyo ayon sa ritwal[a] ang bawat kasuotan, bawat bagay na yari sa katad, bawat bagay na yari sa balahibo ng kambing,[b] at bawat bagay na yari sa kahoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay nasa anyong reflexive at maaari ring unawaing, “Maglinis kayo ayon sa ritwal.” Gayunman, sa kontekstong ito, ang mga bagay na nakalista ang malamang na nililinis.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “anumang gawang mula sa mga kambing”; malamang na balahibo ng kambing ang tinutukoy.
    reason: source_ambiguity
lexical_decisions:
- source_word: בֶּגֶד
  choice: kasuotan
  rationale: Karaniwang tumutukoy ang salita sa damit o kasuotan; natural at marangal ang “kasuotan” sa isang talaan ng mga bagay.
- source_word: כְּלִי עוֹר
  choice: bagay na yari sa katad
  rationale: Malawak ang saklaw ng כְּלִי at hindi lamang sisidlan ang kahulugan, kaya “bagay” ang ginamit; ang עוֹר ay balat o katad, at ang “katad” ang natural na tawag sa materyal dito.
- source_word: מַעֲשֵׂה עִזִּים
  choice: bagay na yari sa balahibo ng kambing
  rationale: Ang מַעֲשֵׂה ay maaaring tumukoy sa gawang bagay. Sa mga talaan ng materyales, ang עִזִּים ay malamang na tumutukoy sa balahibo ng kambing na ginagamit sa paghahabi, bagaman hindi tahasang binanggit sa Hebreo ang “balahibo.”
- source_word: כְּלִי עֵץ
  choice: bagay na yari sa kahoy
  rationale: Pinananatili ng “bagay” ang malawak na kahulugan ng כְּלִי at malinaw na ipinapakita ang uri ayon sa materyal.
- source_word: תִּתְחַטָּאוּ
  choice: linisin din ninyo ayon sa ritwal
  rationale: Sa kontekstong ito, ang pandiwa mula sa ugat na kaugnay ng kasalanan at paglilinis ay tumutukoy sa ritwal na paglilinis matapos ang pakikidigma. Ang mga bagay na nakalista ang natural na layon ng utos, kaya transitive ang salin; nililinaw ng “ayon sa ritwal” na hindi simpleng paghuhugas o moral na pagbabago ang tinutukoy.
theological_decisions:
- issue: Ritwal na paglilinis sa konteksto ng digmaan at karumihan
  choice: Iutos ang ritwal na paglilinis sa mga nakalistang bagay.
  alternative: “Maglinis kayo ayon sa ritwal” o “dalisayin ninyo ang inyong sarili,” na sinusunod ang anyong reflexive ng pandiwang Hebreo.
  rationale: Nasa anyong hitpael at ikalawang panauhang maramihan ang pandiwa, ngunit inilalagay sa unahan ng sugnay ang sunod-sunod na mga bagay bilang mga layon. Dahil dito, mas angkop sa konteksto ang utos na linisin ang mga bagay, habang inilalahad sa talababa ang tunay na gramatikal na tensiyon sa reflexive na anyo. Hindi ito inilalarawan bilang moral na pagbabalik-loob o bilang doktrina ng pagtubos.
- issue: Kahulugan ng עִזִּים sa pariralang מַעֲשֵׂה עִזִּים
  choice: “balahibo ng kambing” sa pangunahing teksto
  alternative: “anumang yari sa kambing,” na hindi tinutukoy kung balahibo o balat
  rationale: Sa mga talaan ng materyales sa Pentateuch, karaniwang ipinahihiwatig ng “mga kambing” ang balahibo ng kambing na ginagawang tela. Gayunman, dahil hindi nakasulat ang salitang “balahibo,” pinananatili sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Gumamit ng moderno at madaling maunawaang Filipino na may dignidad. Pinanatili ang paulit-ulit na “bawat” upang tumbasan ang estilong pang-imbentaryo ng Hebreo, ngunit inayos ang pangungusap sa natural na ayos ng Tagalog. Ang “ayon sa ritwal” ay nagbibigay-linaw sa uri ng paglilinis nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
