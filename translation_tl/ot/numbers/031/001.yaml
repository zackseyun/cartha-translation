  yaml_path: translation/ot/numbers/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Yahweh kay Moises:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive na kasama ng דּבר ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod, at pinananatili ng “nagsalita” ang kaibhan nito sa אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay na “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Karaniwang panandang Tagalog para sa taong pinatutungkulan ng pagsasalita.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalang מֹשֶׁה sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa tuwirang pananalitang susunod, bagaman medyo pormal ang anyo sa Tagalog.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo, habang inilalahad sa talababa ang tradisyonal at alternatibong anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Pagkatapos” para sa daloy ng salaysay at “na sinasabi” upang mapanatili ang pormulang Hebreo na nagbubukas sa mensaheng nasa kasunod na talata.
