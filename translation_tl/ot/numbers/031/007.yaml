  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: tl
  text: Nakipagdigma sila laban sa Midian[a], gaya ng iniutos ni Yahweh kay Moises, at pinatay nila ang bawat lalaking nilalang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakipaglaban sila sa Midian.” Ang pandiwang Hebreo ay maaaring tumukoy sa paglilingkod bilang kawal o sa pakikidigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: nakipagdigma sila
  rationale: Ang pandiwang mula sa צבא ay tumutukoy rito sa pakikibahagi sa gawaing militar o pakikidigma. Likas at malinaw sa modernong Tagalog ang “nakipagdigma,” habang pinananatili ang lakas ng diwang militar.
- source_word: עַל
  choice: laban sa
  rationale: Kasama ng pandiwang militar, ipinahihiwatig ng עַל ang pagharap nang may pagkapoot; natural itong isalin bilang “laban sa.”
- source_word: מִדְיָן
  choice: Midian
  rationale: Isinalin ang pangalang pantangi ayon sa karaniwang anyong gamit sa Tagalog.
- source_word: כַּאֲשֶׁר
  choice: ayon sa
  rationale: Ipinapakita ng parirala ang pagtutugma ng ginawa nila sa iniutos ng Diyos. Natural at marangal sa Tagalog ang “ayon sa iniutos.”
- source_word: צִוָּה
  choice: iniutos
  rationale: Tuwirang ipinahahayag nito ang naunang utos nang hindi nangangailangan ng tahasang aspektong katumbas ng English past perfect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Si Moises ang taong inutusan ni Yahweh. Ang “iniutos ... kay Moises” ang likas na kayarian sa Tagalog.
- source_word: וַיַּהַרְגוּ
  choice: pinatay nila
  rationale: Tuwiran at eksaktong ipinahahayag ng הרג ang pagpatay; malinaw at kasalukuyang gamit ang “pinatay.”
- source_word: כָּל
  choice: bawat
  rationale: Sa kasunod na pangngalang isahan, natural na ipinahahayag ng “bawat” ang distributibong saklaw ng כָּל.
- source_word: זָכָר
  choice: lalaki
  rationale: Ang זָכָר ay tumutukoy sa kasariang lalaki at hindi lamang sa mga adultong lalaki. Sa karaniwang Tagalog, maaaring tumukoy ang “bawat lalaki” sa bawat taong may kasariang lalaki; mas natural ito kaysa sa teknikal na “bawat taong may kasariang lalaki.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng זָכָר
  choice: bawat lalaki
  alternative: lahat ng lalaking nasa hustong gulang
  rationale: Hindi nililimitahan ng Hebreo ang salita sa mga adultong lalaki. Iniiwasan ng napiling salin ang pagdaragdag ng limitasyong wala sa pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “nakipagdigma” upang panatilihin ang diwang militar, at ang “ayon sa iniutos” para sa natural na daloy. Inilagay ang panandang [a] kaagad pagkatapos ng “Midian,” ayon sa talababa.
