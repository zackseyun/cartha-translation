  yaml_path: translation/ot/numbers/031/004.yaml
  text: A thousand from each tribe[a], from all the tribes of Israel, you shall send to the army.
translation:
  language: tl
  text: Tig-iisang libo mula sa bawat lipi, tig-iisang libo mula sa bawat lipi, ang ipadadala ninyo mula sa lahat ng lipi ng Israel sa hukbo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang maglingkod sa hukbo.” Ang Hebreong לַצָּבָא ay maaaring tumukoy sa paglilingkod bilang bahagi ng puwersang militar, hindi lamang sa pagpapadala patungo sa isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף
  choice: tig-iisang libo
  rationale: Ang bilang ay isang libo; ginamit ang “tig-iisang” upang natural na maipahayag sa Filipino ang pamamahaging diwa ng inuulit na parirala.
- source_word: לַמַּטֶּה
  choice: mula sa bawat lipi
  rationale: Sa kontekstong militar, ang מַטֶּה ay tumutukoy sa isang lipi. Bagaman ל ang pang-ukol, ipinahihiwatig ng konteksto na kukunin ang bilang mula sa bawat lipi.
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: Tig-iisang libo mula sa bawat lipi, tig-iisang libo mula sa bawat lipi
  rationale: Pinanatili ang sinadyang pag-uulit sa Hebreo para sa diin at malinaw na pagkakabahagi, sa halip na paikliin ito.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: mula sa lahat ng lipi ng Israel
  rationale: Nililinaw ng parirala na saklaw ng utos ang lahat ng mga lipi ng Israel; natural sa konteksto ng pangangalap ang “mula sa.”
- source_word: תִּשְׁלְחוּ
  choice: ang ipadadala ninyo
  rationale: Ang Qal imperfect na pangalawang panauhang maramihan ay may puwersa ng utos dito. Ang ayos na ito ay malinaw at marangal sa modernong Filipino.
- source_word: לַצָּבָא
  choice: sa hukbo
  rationale: Ang צָבָא ay maaaring tumukoy sa hukbong militar o sa paglilingkod/pakikidigma. Pinili ang maikli at kongkretong “sa hukbo,” habang inilalahad sa talababa ang alternatibong diwa.
