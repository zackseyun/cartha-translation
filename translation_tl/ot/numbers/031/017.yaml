  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: tl
  text: Kaya ngayon, patayin ninyo ang bawat batang lalaki, at patayin ninyo ang bawat babaeng nakipagtalik na sa isang lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “nakakilala ng lalaki sa paghiga ng lalaki,” isang idyomang tumutukoy sa pakikipagtalik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahahayag ang paglipat tungo sa utos na agad na sumusunod at pinananatili ang puwersa ng pang-ugnay at ng 'ngayon' sa natural na Tagalog.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: patayin ninyo
  rationale: Tuwiran at mariing pautos ang anyo ng הרג; hindi pinalalambot ng salin ang bigat nito.
- source_word: כָל זָכָר בַּטָּף
  choice: ang bawat batang lalaki
  rationale: Ang זָכָר ay 'lalaki' at nililimitahan ng בַּטָּף sa maliliit na bata; ang 'bawat batang lalaki' ang pinakanatural at tumpak na modernong Tagalog.
- source_word: כָל אִשָּׁה
  choice: ang bawat babae
  rationale: Pangkalahatang tumutukoy ang אִשָּׁה sa mga babae, hindi partikular sa mga asawa.
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: babaeng nakipagtalik na sa isang lalaki
  rationale: Ang 'nakipagtalik' ay malinaw at likas na Tagalog para sa Hebreong idyomang literal na nagsasabing nakilala ang isang lalaki sa paghiga ng lalaki; hindi nito ikinukubli ang seksuwal na kahulugan.
theological_decisions:
- issue: Paglalahad ng isang mabigat na utos sa digmaan nang hindi ito pinalalambot o dinaragdagan ng interpretasyon
  choice: Tuwirang isalin ang utos at panatilihin ang bigat nito
  alternative: Gumamit ng mas banayad na pananalita o magdagdag ng paliwanag sa pangunahing teksto
  rationale: Tuwiran ang utos sa Hebreo. Hindi tungkulin ng salin na pahinain ang puwersa nito o magpasok ng komentaryong moral at pangkasaysayan sa mismong talata.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang 'batang lalaki' sa halip na mas literal ngunit hindi likas na 'lalaki sa maliliit na bata,' at malinaw na isinalin ang Hebreong seksuwal na idyoma habang inilagay sa talababa ang literal na anyo.
