lexical_decisions:
- source_word: וְ/נֶפֶשׁ אָדָם
  choice: At ang mga tao
  rationale: Sa konteksto ng pagbibilang ng mga bihag at hayop, ang נֶפֶשׁ ay tumutukoy sa bawat taong binibilang, hindi partikular sa di-materyal na “kaluluwa.” Nililinaw ng אָדָם na mga tao, at hindi mga hayop, ang tinutukoy. Likas at malinaw sa modernong Tagalog ang “mga tao,” habang ang וְ ay isinalin bilang “At.”
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: labing-anim na libo
  rationale: Tuwirang katumbas ito ng bilang na 16,000 at siyang karaniwang paraan ng pagsasabi nito sa Tagalog.
theological_decisions: []
translation_notes:
  register: Gumamit ng maikli, marangal, at likas na modernong Tagalog na angkop sa talaan ng bilang. Iniwasan ang “mga kaluluwa” dahil sa kontekstong ito ay mga taong binibilang ang kahulugan ng נֶפֶשׁ.
