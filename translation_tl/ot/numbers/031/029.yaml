  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: tl
  text: Mula sa kalahati nila ay kunin ninyo ito at ibigay kay Eleazar na pari bilang nakalaang bahagi para kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog ni Yahweh” o “ambag para kay Yahweh.” Ang salitang Hebreo na תְּרוּמָה ay tumutukoy sa isang bahaging ibinukod para sa banal na gamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: Mula sa kalahating bahagi nila
  rationale: Tuwirang ipinapahayag ang מִן + מַחֲצִית at pinananatili ang pagtukoy sa kalahating bahagi na nauukol sa kanila ayon sa konteksto.
- source_word: תִּקָּחוּ
  choice: kunin ninyo
  rationale: Ang anyong 2mp ay malinaw na naipapakita ng maramihang panghalip na “ninyo,” habang nananatiling natural ang pautos na Filipino.
- source_word: וְנָתַתָּה
  choice: at ibigay
  rationale: Ipinagpapatuloy nito ang utos nang natural sa Filipino. Hindi labis na itinatampok ang paglipat ng Hebreo mula maramihan tungong isahan, ngunit hindi rin dinaragdagan ang teksto ng tahasang paksa.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: kay Eleazar na pari
  rationale: Karaniwang transliterasyon ang “Eleazar,” at ang “na pari” ay likas na paraan upang tukuyin ang kaniyang katungkulan.
- source_word: תְּרוּמַת יְהוָה
  choice: handog na inilaan para kay Yahweh
  rationale: Ang תְּרוּמָה ay bahaging ibinukod para sa banal na gamit. Ipinapahayag ng “handog na inilaan” ang sagradong pagbubukod, at pinananatili ng “para kay Yahweh” ang posibleng layuning ugnayan ng genitibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na banal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan at ugnayan ng תְּרוּמַת יְהוָה
  choice: handog na inilaan para kay Yahweh
  alternative: handog ni Yahweh; ambag para kay Yahweh
  rationale: Sa konteksto, ito ay isang bahagi ng samsam na ibinubukod para sa banal na gamit. Ang salin ay natural at malinaw, samantalang inilalahad sa talababa ang ibang posibleng paraan ng pag-unawa sa parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalahating bahagi” upang maiwasan ang kalituhan ng payak na “kalahati,” at “handog na inilaan” upang maipahayag ang kultikong diwa nang hindi gumagamit ng lipas o labis na teknikal na termino.
