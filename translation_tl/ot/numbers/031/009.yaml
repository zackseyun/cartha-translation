  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: tl
  text: Binihag ng mga anak ni Israel ang mga babae ng Midian at ang kanilang maliliit na anak,[a] at sinamsam ang lahat ng kanilang mga alagang hayop, lahat ng kanilang mga kawan,[b] at lahat ng kanilang kayamanan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga anak.”
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng kanilang mga pag-aaring hayop.”
    reason: lexical_alternative
  - marker: c
    text: O “lahat ng kanilang ari-arian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Binihag
  rationale: Tiyak na tumutukoy ang Qal ng שׁבה sa pagkuha ng mga tao bilang bihag; malinaw at likas sa modernong Tagalog ang “binihag.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang anyo ng Hebreong idyoma nang hindi nagiging mahirap unawain sa Tagalog.
- source_word: נְשֵׁי מִדְיָן
  choice: mga babae ng Midian
  rationale: Masaklaw ang נָשִׁים dito at hindi lamang tumutukoy sa mga asawa; malapit din ang parirala sa konstruksiyong Hebreo.
- source_word: טַפָּם
  choice: kanilang maliliit na anak
  rationale: Ipinahihiwatig ng טַף ang mga batang paslit o maliliit na anak, hindi lamang mga anak sa pangkalahatan.
- source_word: בְּהֶמְתָּם
  choice: kanilang mga alagang hayop
  rationale: Sa kolektibong gamit, tumutukoy ang בְּהֵמָה sa mga domestikadong hayop; natural at malinaw ito sa Tagalog.
- source_word: מִקְנֵהֶם
  choice: kanilang mga kawan
  rationale: Madalas tumukoy ang מִקְנֶה sa mga pag-aaring hayop, gaya ng mga kawan; naiiba ito sa mas pangkalahatang בְּהֵמָה.
- source_word: חֵילָם
  choice: kanilang kayamanan
  rationale: Sa kontekstong hindi militar, maaaring tumukoy ang חַיִל sa yaman, ari-arian, o kabuhayang materyal; “kayamanan” ang likas na buod ng natitirang samsam.
- source_word: בָּזָזוּ
  choice: sinamsam
  rationale: Ipinapahayag ng בזז ang pagkuha ng samsam matapos ang tagumpay sa digmaan; taglay ng “sinamsam” ang wastong puwersa at konteksto.
theological_decisions:
- issue: Paglilipat ng ekspresyong etniko na בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Walang natatanging usaping doktrinal dito. Pinananatili ng napili ang Hebreong larawan at pormang pampamilya, samantalang nananatiling natural at malinaw sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pormal na idyomang “mga anak ni Israel,” ngunit gumamit ng karaniwang bokabularyong “binihag,” “alagang hayop,” “kawan,” at “sinamsam.”
