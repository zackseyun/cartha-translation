  naturalness: Ang “Ipaghiganti mo ang mga Israelita sa mga Midianita” ay maaaring maunawaan, ngunit mas likas at hindi malabo sa modernong Filipino ang “Ipaghiganti mo ang mga Israelita laban sa mga Midianita.” Ang “titipunin ka sa iyong bayan” ay katanggap-tanggap na pagpapanatili ng Hebreong larawan, lalo na sa tulong ng talababa.
  terminology: Ang “mga Israelita,” “mga Midianita,” at “iyong bayan” ay angkop. Pinananatili ng “titipunin ka sa iyong bayan” ang idyoma nang hindi ipinipilit ang isang partikular na pagkaunawa tungkol sa kabilang-buhay.
