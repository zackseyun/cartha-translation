  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: tl
  text: “Ipaghiganti mo ang mga Israelita laban sa mga Midianita.[a] Pagkatapos nito, titipunin ka sa iyong bayan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Gawin mo ang paghihiganti para sa mga Israelita laban sa mga Midianita.” Sa Hebreo, magkaugnay na mga salita para sa “gumanti/paghihiganti” ang inuulit upang idiin ang utos.'
    reason: lexical_alternative
  - marker: b
    text: Ang “titipunin ka sa iyong bayan” ay isang Hebreong idyoma na tumutukoy sa kamatayan.
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: Ipaghiganti
  rationale: Ang pandiwa at kaugnay na pangngalan ay bumubuo ng mariing utos na literal na inuulit ang diwa ng paghihiganti. Isinasalin ito sa likas at tuwirang pandiwang Filipino nang hindi pinahihina ang lakas ng utos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Bagaman literal na “mga anak ni Israel,” ang parirala rito ay pangkalahatang katawagan sa bayang Israel. Ang “mga Israelita” ay malinaw at likas sa modernong Filipino at hindi nagpapahiwatig na mga agarang anak na lalaki lamang ni Jacob ang tinutukoy.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: sa mga Midianita
  rationale: Kasama ng pandiwang נקם, tinutukoy nito ang pangkat na pagbabayaran o paggagantihan. Ang “sa mga Midianita” ang likas na kaakibat ng “ipaghiganti” sa Filipino.
- source_word: אַחַר
  choice: Pagkatapos nito
  rationale: Malinaw na ipinapakita ang pagkakasunod ng dalawang pangyayari.
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: titipunin ka sa iyong bayan
  rationale: Pinananatili ang metapora at anyo ng Hebreong idyoma sa halip na tahasang gawing “mamamatay ka.” Ang “bayan” ay kumakatawan sa kolektibong “people” at iniiwasang paliitin agad ang kahulugan sa “mga ninuno.”
theological_decisions:
- issue: Ang idyoma tungkol sa nalalapit na kamatayan ni Moises
  choice: Pinanatili ang “titipunin ka sa iyong bayan.”
  alternative: “mamamatay ka” o “isasama ka sa iyong mga ninuno”
  rationale: Ang una ay nagpapawala sa larawan ng Hebreo, samantalang ang ikalawa ay mas tiyak kaysa sa salitang עַמֶּיךָ (“iyong bayan/mga kababayan”). Pinananatili ng salin ang pahiwatig nang hindi nagdaragdag ng tiyak na doktrina tungkol sa kabilang-buhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” bilang likas na katawagan sa bayan, habang pinanatili ang di-pamilyar ngunit mahalagang larawan ng Hebreong idyoma tungkol sa kamatayan at ipinaliwanag ito sa talababa.
