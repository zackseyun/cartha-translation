  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: tl
  text: At sinabi nila kay Moises, “Binilang[a] ng iyong mga lingkod ang mga lalaking mandirigma na nasa ilalim ng aming utos[b], at wala ni isa man sa aming mga tauhan ang nawawala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “itinaas ang ulo ng mga lalaking mandirigma,” isang idyomang Hebreo na nangangahulugang nagsagawa ng pagbilang o sensus.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na ipinagkatiwala sa amin.” Sa literal, “na nasa aming kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Ang mga nagsasalita ay mga opisyal na magalang na nakikipag-usap kay Moises; ang ‘mga lingkod’ ay natural at hindi nagpapahiwatig dito ng katayuang alipin.
- source_word: נָשְׂאוּ אֶת־רֹאשׁ
  choice: binilang
  rationale: Ang literal na ‘itinaas ang ulo’ ay isang idyomang Hebreo para sa pagbilang o sensus; malinaw at natural sa Tagalog ang ‘binilang.’
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: mga lalaking mandirigma
  rationale: Tumutukoy ang parirala sa mga lalaking lumahok sa pakikidigma; pinananatili ng salin ang kasarian at tungkuling militar na nasa Hebreo.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: na nasa ilalim ng aming pamamahala
  rationale: Ang literal na ‘nasa aming kamay’ ay nagsasaad dito ng pananagutan at awtoridad ng mga opisyal sa mga kawal.
- source_word: וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ
  choice: at wala ni isa man sa amin ang nawawala
  rationale: Sa konteksto ng pagtutuos pagkatapos ng labanan, ipinahahayag nito na walang sinuman sa kanilang hanay ang nawawala o hindi maitala.
