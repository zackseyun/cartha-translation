id: NUM.31.16
reference: Numbers 31:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: tl
  text: 'Tingnan ninyo[a]: ang mga babaeng ito ang, ayon sa sinabi ni Balaam, naging dahilan upang magtaksil kay Yahweh ang mga anak ni Israel sa usapin ng Peor, kaya dumating ang salot sa kapulungan ni Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Masdan ninyo” o “Tunay ngang.” Ang Hebreo ay isang mariing panawag-pansin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: Tingnan ninyo, ang mga babaeng ito ang
  rationale: Ipinahahayag ng dobleng anyong idiomatiko ang matinding pagturo at pagbibigay-diin. Likas sa makabagong Tagalog ang “Tingnan ninyo,” at nililinaw ng “mga babaeng ito” ang pambabaeng maramihang reperente.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawang “mga anak ni Israel,” bagaman tumutukoy ang idyoma sa bayang Israel.
- source_word: בִּדְבַר בִּלְעָם
  choice: ayon sa sinabi ni Balaam
  rationale: Ang דָּבָר ay maaaring mangahulugang salita o sinabi; ipinahihiwatig ng parirala rito ang pag-uudyok o tagubilin ni Balaam nang hindi labis na tinutukoy kung payo o utos iyon.
- source_word: לִמְסָר מַעַל
  choice: naging dahilan upang magtaksil
  rationale: Ipinakikita ng infinitive ang kanilang papel bilang sanhi o kasangkapan, habang ang מַעַל ay paglabag sa katapatan, lalo na sa ugnayang tipan.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Sa Tagalog, ang “magtaksil kay” ang likas na pagbuo para sa taong pinagtaksilan; pinananatili ang pangalang tipan na Yahweh.
- source_word: עַל דְּבַר פְּעוֹר
  choice: sa usapin ng Peor
  rationale: Pinananatili ang malawak na kahulugang “tungkol sa pangyayari/usapin ng Peor” nang hindi ipinapasok sa talata ang paliwanag na Baal-peor.
- source_word: וַתְּהִי הַמַּגֵּפָה
  choice: kaya dumating ang salot
  rationale: Malinaw at natural na ipinahahayag ang bunga ng naunang pagtataksil, gaya ng hinihingi ng daloy ng salaysay.
- source_word: בַּעֲדַת יְהוָה
  choice: sa kapulungan ni Yahweh
  rationale: Ang “kapulungan” ay dignidad at malinaw na katumbas ng עֵדָה bilang nagkakatipong pamayanan ng Israel.
theological_decisions:
- issue: Pagbaybay sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan.
- issue: Paglilinaw sa pambabaeng reperente ng הֵנָּה
  choice: ang mga babaeng ito
  alternative: ang mga ito
  rationale: Pambabae at maramihan ang anyong Hebreo, at malinaw sa agarang konteksto na mga babaeng Midianita ang tinutukoy.
- issue: Saklaw ng pananagutan sa pariralang בִּדְבַר בִּלְעָם
  choice: ayon sa sinabi ni Balaam
  alternative: sa payo ni Balaam
  rationale: Pinananatili ang leksikal na pagiging bukas ng דָּבָר at ang pananagutan kapwa ng mga babae bilang sanhi at ni Balaam bilang pinagmulan ng sinabi o tagubilin.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Tingnan ninyo” sa halip na mas arkaikong “Narito” o “Masdan,” at “magtaksil” upang maipahayag nang natural ang paglabag sa katapatan kay Yahweh. Ang footnote marker [a] ay nasa pangunahing teksto.
