  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: tl
  text: Pagkatapos, lumapit kay Moises ang mga opisyal na namamahala sa mga libo ng hukbo—ang mga pinuno ng libu-libo at ng daan-daan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “mga opisyal” ay tumutukoy sa mga lalaking itinalagang mamahala sa mga yunit ng hukbo; nililinaw ng kasunod na parirala na sila ang mga pinuno ng libu-libo at ng daan-daan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: lumapit
  rationale: Likas at tuwirang ipinahahayag ng “lumapit” ang pagkilos patungo kay Moises; maaari rin itong mangahulugang “pumaroon sa harap” niya ayon sa konteksto.
- source_word: הַפְּקֻדִים
  choice: mga opisyal
  rationale: Ang anyong mula sa פקד ay tumutukoy rito sa mga lalaking itinalaga sa pamamahala ng mga yunit ng hukbo, hindi sa karaniwang mga kawal.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: na namamahala sa mga libo ng hukbo
  rationale: Ipinakikita ng konteksto at ng kasunod na paglilinaw na ang mga opisyal ay may pananagutan sa mga yunit na binubuo ng libo-libo.
- source_word: אַלְפֵי
  choice: mga libo
  rationale: Bagaman maaaring tumukoy ang אֶלֶף sa angkan o pangkat, pinapaboran ng kontekstong militar at ng katapat na “mga daan” ang literal na yunit na “mga libo.”
- source_word: הַצָּבָא
  choice: hukbo
  rationale: Ang “hukbo” ay malinaw, dignificado, at karaniwang salitang Filipino para sa organisadong puwersang pandigma.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: mga pinuno ng libo
  rationale: Ang שׂר ay isang pinuno o opisyal. Pinananatili ng salin ang estruktura ng ranggong militar nang hindi gumagamit ng posibleng anakronistikong modernong ranggo.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: at mga pinuno ng daan
  rationale: Pinananatili nito ang paralelismo sa “mga pinuno ng libo” at ang antas-antás na organisasyon ng hukbo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na daloy. Ginamit ang “pinuno” sa halip na isang tiyak na modernong ranggong militar, at pinanatili ang “libo” at “daan” bilang mga katawagan sa mga yunit.
