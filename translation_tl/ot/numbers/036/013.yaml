id: NUM.36.13
reference: Numbers 36:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: tl
  text: Ito ang mga utos at mga tuntunin na iniutos ni Yahweh sa pamamagitan ni Moises sa mga anak ni Israel[a], sa kapatagan ng Moab, sa tabi ng Jordan malapit sa Jerico[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel”; ang katawagang ito sa konteksto ng tipan ay tumutukoy sa buong sambayanan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa tabi ng Jordan, sa tapat ng Jerico.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Ang pangmaramihang pantukoy ay nagpapakilala sa pangwakas na buod. Likas sa Tagalog ang “Ito ang” kahit maramihan ang kasunod na pangngalan.
- source_word: הַמִּצְוֺת
  choice: mga utos
  rationale: Tuwirang ipinapahayag ang legal at may-awtoridad na diwa ng מִצְוָה sa malinaw na modernong Tagalog.
- source_word: וְהַמִּשְׁפָּטִים
  choice: at mga tuntunin
  rationale: Sa kontekstong legal, ang מִשְׁפָּטִים ay tumutukoy sa mga tuntunin o ordinansa. Mas malinaw sa karaniwang mambabasa ang “mga tuntunin” kaysa “mga kahatulan,” na maaaring mapagkamalang mga sentensiyang panghukuman lamang.
- source_word: צִוָּה
  choice: iniutos
  rationale: Pinananatili ang ugnayang leksikal sa “mga utos” at ang awtoritatibong puwersa ng pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang literal na “sa kamay ni Moises” ay idyomang nagsasaad ng tagapamagitan o kasangkapan; natural itong naipahahayag sa Tagalog bilang “sa pamamagitan ni Moises.”
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang anyong tipan na “mga anak ni Israel,” na tumutukoy sa sambayanan bilang kabuuan.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: sa kapatagan ng Moab
  rationale: Ang עַרְבֹת ay tumutukoy sa patag o kaparangan ng rehiyon; “kapatagan” ang malinaw at kinikilalang heograpikong katawagan.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: sa tabi ng Jordan, sa tapat ng Jerico
  rationale: Ipinahahayag ng עַל ang lokasyon sa tabi ng Jordan, at ang Jerico ang palatandaang nasa kabilang panig; pinananatili ng salin ang posibleng diwa ng pagiging katapat nito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng “mga anak ni Israel”
  choice: Sambayanan ng Israel bilang kabuuan
  alternative: Mga lalaking Israelita lamang
  rationale: Bagaman panlalaki ang literal na anyo ng בְּנֵי, isa itong nakaugaliang katawagang pangtipan para sa buong bayang Israel; nililinaw ito sa talababa nang hindi binabago ang anyo sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na himig ng pangwakas na legal na buod, habang ginawang natural ang idyomang Hebreo tungkol sa pamamagitan ni Moises. Ang mga pangalang Moab, Jordan, at Jerico ay ginamit sa anyong karaniwang nakikilala sa Tagalog.
