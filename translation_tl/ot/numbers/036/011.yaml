base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: tl
  text: Sina Maala, Tirsa, Hogla, Milca, at Noa, na mga anak na babae ni Zelofehad, ay naging mga asawa ng mga anak na lalaki ng kanilang mga tiyuhin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas tahasan: “ng mga anak na lalaki ng mga kapatid na lalaki ng kanilang ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: ay naging
  rationale: Ipinahahayag ng anyong ito ng היה ang pagpasok nila sa kalagayan ng pag-aasawa; natural sa Tagalog ang “ay naging asawa” at pinananatili nito ang diwa ng pagbabago ng kalagayan.
- source_word: בְּנוֹת
  choice: mga anak na babae
  rationale: Tiyak na kinikilala ng salita ang mga babae bilang mga anak na babae ni Zelofehad; mas tahasan ito kaysa sa pangkalahatang “mga anak.”
- source_word: צְלָפְחָד
  choice: Zelofehad
  rationale: Isinalin-titik ang pangalang pantangi ayon sa karaniwang anyong ginagamit sa Filipino.
- source_word: לִבְנֵי
  choice: ng mga anak na lalaki ng
  rationale: Sa pormulang pangkasal, tinutukoy nito ang mga lalaking kanilang napangasawa. Ang “naging asawa ng mga anak na lalaki ng” ay likas at malinaw sa Tagalog.
- source_word: דֹדֵיהֶן
  choice: kanilang mga tiyuhin
  rationale: Karaniwang tumutukoy ang דּוֹד sa tiyuhin, at sa kontekstong ito ay partikular na sa mga kapatid na lalaki ng kanilang ama. Pinili ang maikli at natural na “mga tiyuhin,” habang inilagay sa talababa ang mas tahasang kahulugan.
- source_word: לְנָשִׁים
  choice: naging asawa
  rationale: Bahagi ito ng karaniwang pormula para sa pag-aasawa. Hindi kailangang ulitin ang kasarian sa Tagalog sapagkat malinaw sa konteksto na ang mga anak na babae ang naging mga asawa.
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: Maala, Tirsa, Hogla, Milca, at Noa
  rationale: Pinanatili ang pagkakasunod-sunod ng mga pangalang Hebreo at ginamit ang mga anyong isinalin-titik na pamilyar sa tradisyong Filipino.
