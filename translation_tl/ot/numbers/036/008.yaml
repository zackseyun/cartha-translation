  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: tl
  text: At ang bawat anak na babaeng nagmamay-ari ng isang mana[a] mula sa mga lipi ng mga anak ni Israel[b] ay mag-aasawa ng isang lalaki mula sa angkan ng lipi ng kanyang ama[c], upang ang bawat isa sa mga anak ni Israel ay magmay-ari ng mana ng kanyang mga ninuno[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagmamana ng isang mana” o “tagapagmana ng isang mana”; maaaring idiin ng anyong Hebreo ang kanyang kalagayan bilang tagapagmana.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “pamilya ng lipi ng kanyang ama.” Ang salitang Hebreo ay tumutukoy sa isang angkan o pangkat ng magkakamag-anak sa loob ng lipi.
    reason: lexical_alternative
  - marker: d
    text: 'Maaari ring: “upang manahin ng mga anak ni Israel, bawat isa, ang mana ng kanyang mga ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: nagmamay-ari ng isang mana
  rationale: Ipinahahayag ng participle ang kalagayan ng anak na babae bilang may hawak ng minanang lupain, hindi lamang ang sandali ng pagtanggap nito.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga lipi ng mga anak ni Israel
  rationale: Pinananatili ang pagkakaiba ng מַטֶּה bilang lipi at ang literal na pormulang pangtipan na 'mga anak ni Israel.'
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: mula sa angkan ng lipi ng kanyang ama
  rationale: Ang 'angkan' ay likas na salin ng pangkat-pagkamag-anak na mas maliit kaysa sa lipi, kaya malinaw ang nakapaloob na estrukturang panlipunan.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: mag-aasawa ng isang lalaki
  rationale: Natural na Filipino para sa idyomang 'magiging asawa ng isa,' habang pinananatili ang legal na kahilingang pumili sa itinakdang pangkat.
- source_word: יִירְשׁוּ אִישׁ
  choice: ang bawat isa ... ay manatiling nagmamay-ari
  rationale: Sa konteksto ng pagpapanatili ng lupang minana sa loob ng lipi, ang ירשׁ ay tumutukoy sa patuloy na paghawak o pagmamay-ari; ipinahahayag ng 'bawat isa' ang distributibong אִישׁ.
- source_word: נַחֲלַת אֲבֹתָיו
  choice: mana ng kanyang mga ninuno
  rationale: Ang 'mana' ay angkop sa minanang pag-aaring lupa. Ang 'mga ninuno' ay natural na Filipino para sa plural na אָבוֹת sa pormulang tumutukoy sa minanang pag-aari ng naunang mga salinlahi.
theological_decisions:
- issue: Kasarian at patrilineal na balangkas ng batas sa mana
  choice: Pinanatili ang 'mga anak ni Israel' at 'lipi ng kanyang ama,' ngunit ginamit ang natural na 'mga ninuno' para sa אָבֹתָיו.
  alternative: mga Israelita; mana ng kanyang mga ama
  rationale: Mahalaga sa batas ang ugnayan sa lipi ng ama at hindi ito dapat gawing neutral. Gayunman, sa modernong Filipino, ang 'mga ninuno' ang malinaw at di-asiwang kolektibong katumbas ng 'fathers' sa pormula ng minanang lupain, nang hindi binabago ang patrilineal na konteksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan, na may legal na tono. Ginamit ang 'angkan' at 'lipi' upang malinaw na mapag-iba ang dalawang antas ng pangkat-pagkamag-anak. Ang mga talababa [a]–[d] ay inilagay kaagad sa kaugnay na mga parirala sa pangunahing teksto.
