translation_notes:
  register: Natural, kasalukuyan, at marangal na Filipino. Ginawang tahasan ang relasyong pangkasal upang maiwasan ang alanganing pariralang “naging mga asawa mula sa mga angkan,” habang pinananatiling ang mga anak na babae ang paksa at ang מִן bilang tanda ng pinagmulan ng kanilang mga napangasawa.
