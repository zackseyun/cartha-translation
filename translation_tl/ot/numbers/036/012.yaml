id: NUM.36.12
reference: Numbers 36:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: tl
  text: Nag-asawa sila ng mga lalaking mula sa mga angkan ng mga anak ni Manases na anak ni Jose, at nanatili ang kanilang mana sa lipi ng angkan ng kanilang ama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: mula sa mga angkan
  rationale: 'Ang מִן ay likas na nagpapahayag ng pinagmulan: ang mga lalaking napangasawa nila ay mula sa mga angkan ni Manases. Ang “angkan” ay angkop sa kaayusang panlipi ng Israel.'
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: mga anak ni Manases na anak ni Jose
  rationale: Pinananatili nito ang pormal na pananalitang pangangkanan ng Hebreo at ang malinaw na ugnayan nina Manases at Jose.
- source_word: הָיוּ לְנָשִׁים
  choice: nag-asawa sila ng mga lalaking
  rationale: Ang literal na diwang “naging mga asawa” ay ipinahayag sa natural na modernong Tagalog. Idinagdag ang “mga lalaking” upang malinaw na ang mga anak na babae ang paksa at ang kanilang mga napangasawa ay nagmula sa mga angkang binanggit.
- source_word: נַחֲלָתָן
  choice: ang kanilang mana
  rationale: Sa kontekstong legal at panlupain ng Mga Bilang, tumutukoy ito sa minanang bahagi ng lupain; “mana” ang malinaw at karaniwang salin.
- source_word: וַתְּהִי
  choice: nanatili
  rationale: Bagaman maaaring literal na “naging” o “napunta,” ang konteksto ay nagbibigay-diin na hindi lumipat sa ibang lipi ang mana matapos silang mag-asawa.
- source_word: עַל מַטֵּה
  choice: sa lipi
  rationale: Ang מַטֶּה ay tumutukoy rito sa lipi ng Israel, at ang עַל ay nagpapahayag ng patuloy na pagkakaugnay o pagkakabilang ng mana rito.
- source_word: מִשְׁפַּחַת אֲבִיהֶן
  choice: ng angkan ng kanilang ama
  rationale: Pinananatili ang kolektibong isahan ng Hebreo. Ipinakikita ng “angkan” ang mas malawak na yunit ng pagkakamag-anak sa loob ng lipi.
