  source_fidelity: Tumpak na naipapahayag ng salin ang מִמִּשְׁפְּחֹת bilang pinagmulan ng mga lalaking napangasawa nila, ang angkang-linyang “mga anak ni Manases na anak ni Jose,” at ang pagpapatuloy ng mana sa kaugnay na lipi at angkan ng kanilang ama. Ang pagdaragdag ng “mga lalaking” ay isang lehitimong paglilinaw sa Tagalog at hindi nagdaragdag ng kahulugang wala sa teksto.
  naturalness: Natural at marangal ang “Nag-asawa sila ng mga lalaking mula sa mga angkan ...” at malinaw ang ugnayang pangkasal. Ang “sa lipi ng angkan ng kanilang ama” ay medyo siksik ngunit katanggap-tanggap at angkop na pinananatili ang magkapatong na antas ng pangkat panlipi sa Hebreo.
  terminology: Ang “angkan,” “lipi,” at “mana” ay magkakatugma at angkop sa kontekstong pangangkanan at mana ng lupain sa Mga Bilang. Wasto at karaniwan ang mga pangalang “Manases” at “Jose.”
