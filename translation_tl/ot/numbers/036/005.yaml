  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: tl
  text: Kaya iniutos ni Moises sa mga Israelita, ayon sa sinabi ni Yahweh:[a] “Tama ang sinasabi ng lipi ng mga anak ni Jose.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ayon sa bibig ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “May katuwiran ang lipi ng mga anak ni Jose.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: iniutos
  rationale: Pinananatili nito ang awtoritatibong diwa ng pandiwang צוה at natural ito sa makabagong Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at malinaw na tawag sa sambayanang Israel sa Tagalog; sa konteksto, ang Hebreong 'mga anak ni Israel' ay pangkalahatang katawagan at hindi kailangang limitahan sa mga lalaking anak.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa sinabi ni Yahweh
  rationale: Natural na ipinapahayag nito ang idyomang Hebreo na literal na 'ayon sa bibig ni Yahweh' at pinananatili ang pinagmulan at awtoridad ng utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang tetragrammaton bilang personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: לֵאמֹר
  choice: tuwirang pananalita pagkatapos ng tutuldok
  rationale: Sa Tagalog, sapat at mas natural ang tutuldok upang ipakilala ang mismong sinabi; hindi kailangang isalin nang hiwalay bilang 'na sinasabi.'
- source_word: כֵּן ... דֹּבְרִים
  choice: Tama ang sinasabi
  rationale: Pinananatili nito kapwa ang paghatol na tama ang kanilang pahayag at ang pandiwang diwa ng דבר, sa natural na Tagalog.
- source_word: מַטֵּה בְנֵי יוֹסֵף
  choice: ang lipi ng mga anak ni Jose
  rationale: Ang מַטֶּה ay 'lipi' sa kontekstong pantribo, at ang בְנֵי יוֹסֵף ay pinanatili bilang malinaw na ugnayang pampamilya.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang transliterasyong 'Yahweh' ay hindi ito pinapalitan ng titulong 'PANGINOON.'
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak ni Israel
  rationale: Ang parirala ay kolektibong katawagan sa bayan, hindi isang doktrinal na pagtukoy lamang sa mga lalaki; ang 'mga Israelita' ang natural at saklaw na katumbas sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang 'iniutos' para sa awtoridad ng pahayag at 'Tama ang sinasabi' upang mapanatili ang pandiwang diwa nang hindi nagiging pilit.
