  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: tl
  text: At kung maging asawa sila ng isa sa mga lalaki mula sa mga lipi ng Israel, ang kanilang mana ay mababawas mula sa mana ng aming mga ninuno at idaragdag sa mana ng liping mapapabilang sila. Kaya mababawas ito mula sa nakalaang bahagi ng aming mana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa palabunot ng aming mana.” Sa Hebreo, literal na “mula sa palabunot,” na tumutukoy sa bahaging itinalaga sa pamamagitan ng palabunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: At kung mapangasawa sila
  rationale: Ang literal na diwang ‘maging mga asawa’ ay likas na ipinahahayag sa modernong Filipino bilang ‘mapangasawa.’ Ipinagpapatuloy ng ‘kung’ ang kondisyunal na pangamba sa konteksto.
- source_word: לְאֶחָד מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: ng sinuman sa mga anak ng ibang mga lipi ng Israel
  rationale: Ipinakikita ng ‘sinuman’ ang isang lalaking kabilang sa mga lipi, samantalang nililinaw ng ‘ibang’ ang kontekstuwal na punto na maaari silang mag-asawa sa labas ng sarili nilang lipi. Pinananatili ang ekspresyong ‘mga anak ... ng Israel’ nang hindi ginagawang mabigat ang pangungusap.
- source_word: וְנִגְרְעָה נַחֲלָתָן
  choice: ang kanilang mana ay mababawas
  rationale: Ang Niphal ng גרע ay nagsasaad ng pagkawala o pagkakaltas sa dating pag-aari; ang ‘mababawas’ ay malinaw at umaayon sa pag-uulit ng parehong ugat sa hulihan ng talata.
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: sa mana ng aming mga ninuno
  rationale: Ang ‘mga ninuno’ ay natural sa kasalukuyang Filipino at tumpak na naghahatid ng minanang lupain mula sa mga ama ng angkan.
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: at madaragdag sa mana ng lipi
  rationale: 'Pinananatili ang balanseng legal na galaw: nababawas sa isang mana at nadaragdag sa mana ng ibang lipi.'
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: mapapabilang sila
  rationale: Ang Hebreo ay literal na tumutukoy sa liping ‘kanila sila magiging pag-aari/kabilang’; sa konteksto ng pag-aasawa, ang ‘mapapabilang sila’ ang natural na paglalarawan ng bagong ugnayang panlipi nang magpahiwatig na ari-arian ang mga babae.
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ
  choice: sa bahaging napunta sa amin sa pamamagitan ng palabunutan
  rationale: Ang גּוֹרָל ay literal na ‘palabunutan’ ngunit metonimikong tumutukoy rin sa bahaging itinakda nito. Isinasama ng salin ang parehong paraan at bunga.
- source_word: יִגָּרֵעַ
  choice: mababawas iyon
  rationale: Pinananatili ang pag-uulit ng גרע at ang diin na ang mismong lupang mana ay mawawala sa bahagi ng kanilang lipi.
