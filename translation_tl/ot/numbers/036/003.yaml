revisions:
- from: At kung mapangasawa sila ng sinuman sa mga anak ng ibang mga lipi ng Israel, ang kanilang mana ay mababawas sa mana ng aming mga ninuno at madaragdag sa mana ng liping mapapabilang sila. Sa gayon, mababawas iyon sa bahaging napunta sa amin sa pamamagitan ng palabunutan.[a]
  to: At kung maging asawa sila ng isa sa mga lalaki mula sa mga lipi ng Israel, ang kanilang mana ay mababawas mula sa mana ng aming mga ninuno at idaragdag sa mana ng liping mapapabilang sila. Kaya mababawas ito mula sa nakalaang bahagi ng aming mana.[a]
  rationale: Inalis ang hindi hayagang “ibang,” inayos ang balarila ng sugnay tungkol sa liping mapapabilang sa mga babae, at nilinaw ang hulihang metonimiya tungkol sa lot nang hindi inaalis ang literal na alternatibo sa talababa.
