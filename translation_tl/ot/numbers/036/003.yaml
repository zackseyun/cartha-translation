translation_notes:
  register: Modernong Filipino na may dignidad at legal-panliping linaw. Ginamit ang ‘mana,’ ‘lipi,’ ‘mga ninuno,’ at ‘palabunutan’ bilang madaling maunawaang mga termino. Ang hulihang sugnay ay ginawang hiwalay na pangungusap upang luminaw ang resulta ng paglilipat ng mana.
