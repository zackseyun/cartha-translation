  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: tl
  text: Gaya ng iniutos ni Yahweh kay Moises,[a] ganoon ang ginawa ng mga anak na babae ni Zelofehad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ayon sa iniutos ni Yahweh kay Moises, ganoon ang ginawa ng mga anak na babae ni Zelofehad.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Gaya ng ... ganoon
  rationale: 'Pinananatili ang magkatugmang paghahambing sa Hebreo: ang ginawa ng mga anak na babae ay umayon sa iniutos. Natural at malinaw ito sa modernong Filipino.'
- source_word: צִוָּה
  choice: iniutos
  rationale: Tumutukoy ito sa pagbibigay ng isang utos. Ipinahihiwatig ng anyong naganap na nauna ang utos sa pagsunod ng mga anak na babae.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Minamarkahan si Moises bilang taong inutusan ni Yahweh; ang “kay Moises” ang natural na anyo sa Filipino kasunod ng “iniutos.”
- source_word: עָשׂוּ
  choice: ginawa
  rationale: Sa kaugnayan nito sa כֵּן, ipinapahayag nitong kumilos sila ayon sa iniutos, nang hindi dinaragdagan ang kahulugan.
- source_word: בְּנוֹת צְלָפְחָד
  choice: mga anak na babae ni Zelofehad
  rationale: Tuwirang inililipat ang pariralang konstrakto at malinaw na tinutukoy ang mga babaeng anak ni Zelofehad.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tahasan sa tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na gawin itong titulo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang pares na “gaya ng ... ganoon” upang mapanatili ang estruktura at diin ng Hebreo nang hindi nagiging lipas o labis na pormal.
