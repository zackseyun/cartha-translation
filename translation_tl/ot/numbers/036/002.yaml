  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: tl
  text: At sinabi nila, “Iniutos ni Yahweh sa panginoon ko na ibigay ang lupain bilang mana sa pamamagitan ng palabunutan sa mga anak ni Israel.[a] Iniutos din ni Yahweh sa panginoon ko na ibigay ang mana ni Zelofehad na kapatid namin sa mga anak niyang babae.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Literal sa Hebreo: “mga anak na lalaki ni Israel,” isang katawagang sama-samang tumutukoy sa bayan ng Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Magalang na pantawag ito kay Moises, hindi banal na titulo. Pinananatili ng “panginoon ko” ang paggalang ng tuwirang pakikipag-usap nang hindi ipinahihiwatig na Diyos ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לָתֵת אֶת הָאָרֶץ בְּנַחֲלָה
  choice: ibigay ang lupain bilang mana
  rationale: Tuwirang ipinapahayag nito ang pagkakaloob ng lupain at pinananatili ang legal at pampamilyang diwa ng נַחֲלָה.
- source_word: בְּגוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Ipinakikita ng parirala ang pamamaraang ginamit sa paghahati ng lupain; malinaw at likas sa modernong Filipino ang “palabunutan.”
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili nito ang pormal na pampamilyang pananalita ng Hebreo, habang ang talababa ay nagpapaliwanag na sama-samang tumutukoy ito sa bayang Israel.
- source_word: צֻוָּה בַיהוָה
  choice: Iniutos din ni Yahweh sa panginoon ko
  rationale: Isinasalin nang natural sa aktibong ayos sa Filipino ang pasibong Pual at malinaw na pinananatili si Yahweh bilang pinagmulan ng utos.
- source_word: נַחֲלַת צְלָפְחָד אָחִינוּ
  choice: ang mana niya … ni Zelofehad na kapatid namin
  rationale: Pinananatili ang mana bilang pag-aari ni Zelofehad at ang literal na katawagang “kapatid namin,” na sa konteksto ay maaaring tumukoy sa kaugnayan sa angkan.
- source_word: לִבְנֹתָיו
  choice: sa mga anak na babae ni Zelofehad
  rationale: Malinaw na tinutukoy ang mga babaeng tumanggap ng mana at iniiwasan ang posibleng kalituhan ng isang nakahiwalay na panghalip.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit sa Hebreo ang personal na pangalan ng Diyos; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Masculine corporate language sa לִבְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / mga anak na lalaki ni Israel
  rationale: Sa Filipino, ang “mga anak ni Israel” ay nagpapanatili sa pampamilyang pormula at maaaring tumukoy sa buong bayan. Ang “mga anak na lalaki” ay maaaring magbigay ng di-sinasadyang eksklusibong kahulugan, lalo na sa talatang tumatalakay sa karapatan ng mga anak na babae.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang legal na bokabularyong “mana” at ang magalang na “panginoon ko,” habang ginawang likas sa Filipino ang ikalawang pasibong sugnay. Inilipat ang panandang [a] sa pariralang talagang nililinaw ng talababa.
