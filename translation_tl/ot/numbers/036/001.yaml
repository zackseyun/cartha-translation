source:
  edition: WLC
  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: tl
  text: Lumapit ang mga pinuno ng mga sambahayan ng mga ninuno[a] ng angkan ng mga anak ni Gilead, anak ni Makir, anak ni Manases, mula sa mga angkan ng mga anak ni Jose. Nagsalita sila sa harap ni Moises at sa harap ng mga pinuno, na mga pinuno ng mga sambahayan ng mga ninuno ng mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pinuno ng mga angkan” o “mga puno ng mga sambahayan ng mga ninuno.” Ang idyomang Hebreo ay tumutukoy sa kinikilalang mga lider ng mga yunit ng kamag-anakan sa kaayusang panlipi ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Israel” ang pormal na pananalita sa Hebreo; maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: Lumapit
  rationale: Ipinananatili nito ang konkretong kilos ng paglapit at ang pormal na himig ng pagharap upang maglahad ng usapin.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga sambahayan ng mga ninuno
  rationale: Ang idyomang Hebreo ay tumutukoy sa kinikilalang mga lider ng mga yunit ng kamag-anakan o sambahayan sa kaayusang panlipi ng Israel. Mas tiyak ito kaysa sa payak na “mga pinuno ng pamilya.”
- source_word: לְמִשְׁפַּחַת
  choice: mula sa angkan
  rationale: Ipinahahayag ng parirala ang kaugnayan o pagkabilang sa angkan; natural sa Filipino ang “mula sa angkan” sa pambungad na pagkakakilanlan ng mga lalaking lumapit.
- source_word: בְּנֵי גִלְעָד
  choice: mga anak ni Gilead
  rationale: Pinananatili ang pormal na anyong pangangkan ng Hebreo. Sa konteksto, maaari itong tumukoy sa mga inapo, ngunit hindi iyon tahasang ipinapalit sa pangunahing teksto.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: anak ni Makir, na anak ni Manases
  rationale: Pinananatili ang magkakasunod na ugnayang pangangkan at nililinaw sa natural na Filipino kung kanino tumutukoy ang ikalawang “anak.”
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: na kabilang sa mga angkan ng mga anak ni Jose
  rationale: Ang מִן ay nagpapakita ng pinagmulan o pagkabilang sa mas malawak na pangkat. Nililinaw ng “na kabilang” ang ugnayan nang hindi binabago ang balangkas ng talaangkanan.
- source_word: וַיְדַבְּרוּ
  choice: Nagsalita sila
  rationale: Tuwirang salin ito ng karaniwang pandiwa para sa pagsasalita at hindi nagdaragdag ng diin na wala sa Hebreo.
- source_word: לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂיאִם
  choice: sa harap ni Moises at sa harap ng mga pinuno
  rationale: Pinananatili ng “sa harap” ang pormal na pagharap sa mga may awtoridad, at malinaw sa modernong Filipino ang “mga pinuno” para sa tribal leaders o chiefs.
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: mga pinuno ng mga sambahayan ng mga ninuno ng mga anak ni Israel
  rationale: Itinuturing itong pariralang naglalarawan nang higit sa mga pinunong nabanggit. Pinananatili rin ang pormal na katawagang “mga anak ni Israel.”
