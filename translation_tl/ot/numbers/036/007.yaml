base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: tl
  text: Kaya ang mana ng mga anak ni Israel ay hindi dapat mailipat mula sa isang lipi tungo sa ibang lipi, sapagkat ang bawat isa sa mga anak ni Israel ay dapat panghawakan ang mana ng lipi ng kaniyang mga ninuno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: malipat
  rationale: Sa kontekstong legal ng lupang minana, tumutukoy ito sa paglipat ng mana sa hurisdiksiyon o pag-aari ng ibang lipi, hindi sa literal na pag-ikot.
- source_word: נַחֲלָה
  choice: mana
  rationale: Karaniwan at natural na terminong Filipino para sa minanang ari-arian o lupang inilaan sa loob ng kaayusang panlipi ng Israel.
- source_word: מַטֶּה ... אֶל מַטֶּה
  choice: mula sa isang lipi tungo sa ibang lipi
  rationale: Ang מַטֶּה rito ay malinaw na 'lipi,' at tahasang ipinapakita ng salin ang paglipat mula sa isang lipi patungo sa iba.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pormal at genealogical na katawagan ng Hebreo habang natural pa rin sa dignified na Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan o dahilan ng naunang pagbabawal.
- source_word: אִישׁ
  choice: ang bawat isa
  rationale: Ipinahahayag ang distributibong diwa ng salita sa pangungusap nang hindi nagiging alanganin sa Filipino.
- source_word: יִדְבְּקוּ
  choice: dapat manatiling nakaugnay sa
  rationale: Ang דבק ay nagsasaad ng matatag na pagkakaugnay o pagkapit; sa legal na kontekstong ito, ang 'manatiling nakaugnay' ay malinaw at natural.
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: sa mana ng lipi ng kaniyang mga ninuno
  rationale: Pinananatili ang ideya ng minanang takdang lupa na kaugnay ng lipi ng mga ama, habang gumagamit ng likas na ekspresyong Filipino.
theological_decisions:
- issue: Masculine at genealogical na wika sa isang pangkalahatang legal na pahayag
  choice: mga anak ni Israel ... bawat isa ... kaniyang mga ninuno
  alternative: mga Israelita ... bawat tao ... liping minana
  rationale: Pinananatili ng 'mga anak ni Israel' ang pormal na genealogical na katawagan. Ang 'bawat isa' ay naghahatid ng distributibong אִישׁ, at ang 'mga ninuno' ay natural na Filipino para sa genealogical na אֲבֹתָיו nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa legal na pahayag. Ginamit ang 'mana' at 'lipi' bilang madaling maunawaang mga terminong biblikal; iniwasan ang sobrang literal na ayos na magiging mabigat o malabo sa karaniwang mambabasa.
