base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: tl
  text: Walang mana ang lilipat mula sa isang lipi tungo sa ibang lipi, sapagkat ang bawat lipi ng mga anak ni Israel[a] ay mananatiling nakakapit sa sarili nitong mana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lipi ng Israel.” Sa Hebreo, “mga lipi ng mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִסֹּב
  choice: lilipat
  rationale: Sa kontekstong legal, tumutukoy ito sa paglipat ng mana sa saklaw ng ibang lipi, hindi sa literal na pag-ikot.
- source_word: נַחֲלָה
  choice: mana
  rationale: Tumutukoy ito sa minanang lupaing inilaan sa loob ng kaayusan ng mga lipi ng Israel.
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: mula sa isang lipi tungo sa ibang lipi
  rationale: Ang מַטֶּה ay nangangahulugang lipi sa kontekstong ito, at malinaw na ipinahahayag ng parirala ang paglipat sa ibang lipi.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pagbabawal at angkop sa marangal na estilong legal.
- source_word: אִישׁ
  choice: bawat
  rationale: May distributibong diwa rito at nauugnay sa maramihang 'mga lipi' na kasunod.
- source_word: בְּנַחֲלָתוֹ יִדְבְּקוּ
  choice: mananatiling nakaugnay sa sarili nitong mana
  rationale: Pinananatili nito ang diwa ng mahigpit na pagkakaugnay ng bawat lipi sa sariling mana, habang likas ang pagpapahayag sa modernong Tagalog.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: mga lipi ng mga anak ni Israel
  rationale: Pinananatili ang tahasang anyong Hebreo na 'mga anak ni Israel,' na tumutukoy sa bayang Israel bilang kabuuan.
theological_decisions:
- issue: Ang panlalaking pangtipang pananalitang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng salin ang anyo ng Hebreo at ang tradisyonal na pangtipang katawagan, nang hindi ipinahihiwatig na mga lalaki lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang 'mana' para sa nakalaang lupain at 'mananatiling nakaugnay' upang maipahayag ang metapora ng דבק nang hindi nagiging asiwa sa legal na konteksto.
