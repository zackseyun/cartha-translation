revisions:
- from: At kapag dumating ang Jubileo para sa mga anak ni Israel[a], ang mana nila ay maidaragdag sa mana ng liping mapapabilang sila, at ang mana nila ay mababawas sa mana ng lipi ng aming mga ninuno.
  to: At kapag dumating ang Jubileo para sa mga anak ni Israel[a], ang mana nila ay maidaragdag sa mana ng liping kanilang mapapabilang, at ang mana nila ay mababawas sa mana ng lipi ng mga ama namin.
  rationale: Inayos ang hindi malinaw na pariralang “liping mapapabilang sila” bilang “liping kanilang mapapabilang,” na mas natural at gramatikal na Tagalog habang pinananatili ang kontekstuwal na puwersa ng Hebreo. Ginawang “mga ama namin” ang “aming mga ninuno” para sa mas malapit na pagtutumbas sa pinagmulan.
