  source_fidelity: Tumpak na naihahatid ng draft ang inaasahang pagsapit ng Jubileo, ang pagdaragdag ng mana ng mga anak na babae sa mana ng ibang lipi, at ang kaugnay na pagbawas sa mana ng lipi ng mga ama ng nagsasalita. Gayunman, kailangang ayusin ang sugnay na nagsasaad kung saang lipi sila mapapabilang upang maging malinaw at wasto sa Tagalog.
  naturalness: Hindi natural at kulang sa estruktura ang “liping mapapabilang sila.” Ang “liping kanilang mapapabilang” ay malinaw, likas sa modernong Tagalog, at pinananatili ang kahulugang kontekstuwal ng Hebreo nang hindi tahasang idinadagdag ang usapin ng pag-aasawa.
  terminology: Ang “Jubileo,” “mana,” at “lipi” ay angkop at magkakatugma sa legal at pantribong konteksto. Pinalitan ang mas malawak na “mga ninuno” ng “mga ama namin” upang mas tumpak na maipakita ang אֲבֹתֵינוּ at ang tinig ng mga nagsasalita.
