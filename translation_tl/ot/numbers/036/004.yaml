translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na may bokabularyong angkop sa legal at pantribong konteksto. Pinanatili ang “mga anak ni Israel” sa pangunahing teksto at ipinaliwanag ang mas idiomatikong alternatibo sa talababa.
