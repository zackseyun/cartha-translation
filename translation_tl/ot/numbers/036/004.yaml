base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: tl
  text: At kapag dumating ang Jubileo para sa mga anak ni Israel[a], ang mana nila ay maidaragdag sa mana ng liping kanilang mapapabilang, at ang mana nila ay mababawas sa mana ng lipi ng mga ama namin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa mga Israelita.” Sa Hebreo, “para sa mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kapag
  rationale: Maaaring literal na kondisyunal na “at kung,” ngunit sa legal na pangangatwiran ay tumutukoy ito sa inaasahang pagdating ng Jubileo; pinananatili ng “kapag” ang praktikal na diwa habang hindi lubusang inaalis ang kondisyunal na likuran.
- source_word: יִהְיֶה הַיֹּבֵל
  choice: dumating ang Jubileo
  rationale: Likas sa modernong Tagalog ang “dumating” para sa pagsapit ng isang takdang pangyayari o panahon. Ginamit ang nakaugaliang terminong “Jubileo” para sa יוֹבֵל.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Tuwirang pinananatili ang pamilyang pananalita ng Hebreo, “mga anak ni Israel,” sa halip na gawing pangkalahatang “mga Israelita.”
- source_word: וְנוֹסְפָה
  choice: ay maidaragdag
  rationale: Ang Niphal ay nagpapahayag na ang mana ay madaragdag o mapapaloob sa ibang pantribong mana; ang anyong panghinaharap ay angkop sa legal na resultang inilalarawan.
- source_word: נַחֲלָתָן
  choice: ang mana nila
  rationale: Sa konteksto, ang נַחֲלָה ay minanang lupain o bahaging pag-aari ng lipi. Ang “mana” ay maikli, natural, at karaniwang katumbas; ang “nila” ay tumutukoy sa mga anak na babae.
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: sa mana ng lipi
  rationale: Kasama ng pandiwang “idaragdag,” ang עַל ay natural na naipapahayag sa Tagalog bilang “sa.” Ang מַטֶּה ay “lipi” sa konteksto ng paghahati ng lupain.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: na mapapabilang sila
  rationale: Ang sugnay ay tumutukoy sa lipi ng mga lalaking mapapangasawa nila. Ang “mapapabilang sila” ay natural at malinaw, ngunit hindi tahasang dinaragdagan ang salitang “mapapangasawa” na wala sa talata.
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: sa mana ng lipi ng aming mga ninuno
  rationale: Pinananatili ang kaibahan ng tatanggap na lipi at ng sariling liping minana ng mga nagsasalita. Ang “mga ninuno” ay dignified at natural na salin ng אֲבֹתֵינוּ sa kontekstong angkan.
- source_word: יִגָּרַע
  choice: ay mababawas
  rationale: Ang Niphal ng גרע ay nagsasaad ng pagbawas o pagkawala mula sa isang kabuuan. Ang “mababawas” ay angkop sa paglipat ng lupang mana mula sa isang lipi tungo sa iba.
