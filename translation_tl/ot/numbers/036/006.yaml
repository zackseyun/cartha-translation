source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: tl
  text: 'Ito ang iniutos ni Yahweh tungkol sa mga anak na babae ni Zelofehad: “Maaari silang mag-asawa ng sinumang sa tingin nila ay nararapat[a], ngunit dapat silang mag-asawa sa loob lamang ng angkan ng lipi ng kanilang ama[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mabuti sa kanilang mga mata”; isang idyoma ito para sa sinumang itinuturing nilang angkop o pinakamainam.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreo ay gumagamit ng mga salitang “angkan” at “lipi” upang idiing dapat manatili ang mana sa linya ng lipi ng kanilang ama.
    reason: lexical_clarification
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: Ito ang iniutos
  rationale: Sa konteksto, ang דָּבָר ay isang makapangyarihang pahayag o utos. Ang likas na Tagalog na “Ito ang iniutos” ay malinaw na naihahatid ang pormal na direktiba nang hindi gumagamit ng hindi likas na “Ito ang salita.”
- source_word: צִוָּה יְהוָה
  choice: iniutos ni Yahweh
  rationale: Ang צוה ay tuwirang nangangahulugang mag-utos. Ginamit ang pangnagdaang “iniutos” bilang natural na salin ng Hebreong perfect, at pinanatili ang pangalang tipan na Yahweh para sa יְהוָה.
- source_word: לִבְנוֹת צְלָפְחָד
  choice: tungkol sa mga anak na babae ni Zelofehad
  rationale: Ang לְ ay tumutukoy rito sa mga taong saklaw ng pasiya. Ang “tungkol sa” ay natural at hindi nagpapasyang ang utos ay tuwirang sinabi sa kanila lamang.
- source_word: לֵאמֹר
  choice: colon introducing the quotation
  rationale: Sa modernong Tagalog, sapat at mas natural ang tutuldok upang gampanan ang quotative function ng לֵאמֹר; hindi kailangang idagdag ang mabigat na “na sinasabi.”
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: ng sinumang sa palagay nila ay mabuti
  rationale: Ipinahihiwatig ng parirala ang mapipili nilang mapapangasawa. Pinananatili ng “sa palagay nila ay mabuti” ang diwa ng idyomang Hebreo nang mas malinaw sa karaniwang Tagalog; ang higit na idyomatikong alternatibo ay nasa talababa.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: mag-asawa
  rationale: Bagaman literal na “maging mga asawa,” ang “mag-asawa” ang natural at kasalukuyang Tagalog para sa pagpasok sa pag-aasawa, at akma sa parehong pahintulot at obligasyon sa talata.
- source_word: אַךְ
  choice: ngunit ... lamang
  rationale: Ang אַךְ ay naghahayag ng mahigpit na limitasyon. Magkasamang malinaw na ipinakikita ng “ngunit” at “lamang” ang paghihigpit sa naunang kalayaang pumili.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: sa loob lamang ng angkan ng lipi ng kanilang ama
  rationale: 'Pinananatili ang dalawang antas ng terminolohiya: מִשְׁפָּחָה bilang “angkan” at מַטֶּה bilang “lipi.” Ipinakikita ng “sa loob” na kailangang manatili ang pag-aasawa sa paternal na pangkat.'
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Lakas ng utos sa ikalawang תִּהְיֶינָה לְנָשִׁים
  choice: dapat silang mag-asawa
  alternative: mag-asawa sila; sila ay magiging mga asawa
  rationale: Ang pag-uulit pagkatapos ng naghihigpit na אַךְ ay may preskriptibong lakas. Nililinaw ng “dapat” ang obligasyon nang hindi ipinahihiwatig na sapilitan silang mag-asawa agad o na wala silang kalayaang pumili sa loob ng itinakdang hangganan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa publikong pagbasa. Ginamit ang “mag-asawa” sa halip na literal ngunit asiwa na “maging mga asawa.” Pinanatili sa teksto ang parehong “angkan” at “lipi,” at inilagay ang mga markang [a] at [b] sa mismong talata.
