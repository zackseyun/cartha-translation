  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Hebreo: ang וַיֵּשֶׁב ay naipahayag bilang patuloy na pananatili ng Israel sa Sitim; ang וַיָּחֶל bilang pagsisimula; at ang לִזְנוֹת ay malinaw na seksuwal at mapanuring naipahayag sa “makiapid.” Hindi nito ipinipilit na literal na pagbebenta ng katawan ang tinutukoy, samantalang pinananatili ng talababa ang mas matalas na imahen ng Hebreo.'
  naturalness: Natural at marangal ang makabagong Tagalog. Ang “Habang nananatili ang Israel sa Sitim” at “nagsimulang makiapid ang bayan” ay malinaw at dumadaloy nang maayos. Ang “mga babaeng Moabita” ay likas na idyomatikong katumbas ng “mga anak na babae ng Moab.”
