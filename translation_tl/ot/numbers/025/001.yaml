  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּ/שִּׁטִּ֑ים וַ/יָּ֣חֶל הָ/עָ֔ם לִ/זְנ֖וֹת אֶל בְּנ֥וֹת מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: tl
  text: Habang nananatili ang Israel sa Sitim, nagsimulang makiapid ang bayan sa mga babaeng Moabita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “magpatutot sa mga anak na babae ng Moab”; maaari ring isaling “gumawa ng seksuwal na imoralidad kasama ng mga babaeng Moabita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: nanatili
  rationale: Saklaw ng יָשַׁב ang pananatili o pagtira sa isang lugar. Ang “nanatili” ay natural sa salaysay at hindi nagpapahiwatig ng permanenteng paninirahan.
- source_word: בַּשִּׁטִּים
  choice: sa Sitim
  rationale: Pangalan ito ng lugar. Ginamit ang anyong “Sitim,” na malinaw at nakasanayan sa Tagalog, kasama ang likas na pang-ukol na “sa.”
- source_word: וַיָּחֶל
  choice: nagsimulang
  rationale: Ang pandiwa rito ay idyomatikong nangangahulugang “nagsimula.”
- source_word: הָעָם
  choice: ang bayan
  rationale: Tumutukoy ito sa sambayanan ng Israel bilang isang kabuuan. Ang “bayan” ay maikli, natural, at angkop sa marangal na rehistro.
- source_word: לִזְנוֹת
  choice: makiapid
  rationale: Ang זנה ay tumutukoy sa ipinagbabawal na pakikipagtalik at may matinding larawan ng pagpapatutot. Ang “makiapid” ay malinaw at natural sa Tagalog, samantalang inilalahad sa talababa ang mas literal na larawan.
- source_word: אֶל
  choice: sa
  rationale: Kasama ng זנה at ng taong layon, ipinahihiwatig ng אֶל ang pakikipagtalik sa mga taong tinutukoy. Likas sa Tagalog ang “makiapid sa.”
- source_word: בְּנוֹת מוֹאָב
  choice: mga babaeng Moabita
  rationale: Literal itong “mga anak na babae ng Moab,” ngunit ang idyoma ay tumutukoy sa mga babaeng kabilang sa Moab. Ang “mga babaeng Moabita” ang malinaw at natural na katumbas.
theological_decisions:
- issue: Likas ng kasalanan ng Israel sa pambungad na pangyayari
  choice: Gumamit ng tahasang salitang seksuwal na “makiapid.”
  alternative: “gumawa ng seksuwal na imoralidad” o, mas literal, “magpatutot”
  rationale: Masidhi at kongkreto ang Hebreong זנה kaysa sa pangkalahatang pahayag tungkol sa imoralidad. Pinananatili ng “makiapid” ang malinaw na seksuwal na diwa nang hindi ipinapalagay na literal na nagbenta ng pakikipagtalik ang mga Israelita; pinananatili naman sa talababa ang matalas na larawan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “nanatili” sa halip na mas arkaikong “tumahan,” at “mga babaeng Moabita” sa halip na literal ngunit hindi gaanong likas na “mga anak na babae ng Moab.”
