  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: tl
  text: At inanyayahan nila ang bayan sa mga hain para sa kanilang mga diyos, at kumain ang bayan at nagpatirapa[a] sa kanilang mga diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba sa kanilang mga diyos.” Ang pandiwang Hebreo ay literal na tumutukoy sa pagpapatirapa, na madalas na ginagawa bilang pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: inanyayahan nila
  rationale: Ang Qal wayyiqtol na pambabaeng maramihan, kasama ang לְ para sa mga tao, ay likas na nangangahulugang pag-anyaya. Ang paksa ay ang mga babaeng Moabita sa naunang talata.
- source_word: לָעָם
  choice: ang bayan
  rationale: Pinananatili ang tiyak ngunit hindi muling pinapangalanang עָם; malinaw sa konteksto na tumutukoy ito sa Israel.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: sa mga handog para sa kanilang mga diyos
  rationale: Ang זִבְחֵי ay mga haing kaugnay ng mga diyos. Mas natural sa modernong Tagalog ang “mga handog para sa” kaysa sa literal ngunit alanganing “mga handog ng,” at hindi nito ipinahihiwatig na ang mga diyos ang naghandog.
- source_word: וַיֹּאכַל
  choice: kumain
  rationale: Payak at tuwirang salaysay ito; ang kolektibong “bayan” ay likas na tinutukoy ng pandiwang “kumain.”
- source_word: וַיִּשְׁתַּחֲווּ
  choice: nagpatirapa
  rationale: Inilalarawan nito ang kongkretong kilos ng pagyukod o pagpapatirapa na karaniwang tanda ng pagsamba. Pinananatili ang pisikal na larawan nang hindi agad pinapalitan ng interpretatibong “sumamba.”
- source_word: לֵאלֹהֵיהֶן
  choice: sa kanilang mga diyos
  rationale: Ang לְ kasunod ng pandiwa ay tumutukoy sa pinag-uukulan ng pagpapatirapa; natural itong isalin na “sa kanilang mga diyos.”
theological_decisions:
- issue: Paglalarawan sa idolatrosong kilos ng וַיִּשְׁתַּחֲווּ
  choice: nagpatirapa sa kanilang mga diyos
  alternative: sumamba sa kanilang mga diyos
  rationale: Pinananatili ng salin ang hayag na pisikal na kilos sa Hebreo habang malinaw pa rin sa konteksto ng paghahandog na ito ay isang gawa ng pagsamba sa diyus-diyosan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “bayan” upang panatilihin ang kolektibong katawagan sa Hebreo, at “nagpatirapa” upang mapanatili ang kongkretong kilos at ang kaugnay nitong kahulugang panrelihiyon.
