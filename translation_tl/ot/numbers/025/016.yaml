base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh kay Moises[a] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasaling “ang PANGINOON.” Kabilang sa iba pang transliterasyon ang “Yahweh” at “Jehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay naghuhudyat ng kasunod na pangyayari sa salaysay; likas at marangal sa Filipino ang “At nagsalita” para sa pormulang pagpapahayag ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa kinausap, at “kay Moises” ang natural na modernong Filipino para sa personal na di-tuwirang layon.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagbubukas sa mismong mensaheng susunod, kahit bahagyang pormal ang tunog sa Filipino.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nag-iingat sa katangian nito bilang personal na pangalan at hindi ito ginagawang titulo.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig, angkop sa pormulang pambungad ng banal na pananalita. Ang “na sinasabi” ay sadyang nagpapanatili sa istruktura at bukas na pagpapatuloy ng Hebreo patungo sa susunod na talata.
