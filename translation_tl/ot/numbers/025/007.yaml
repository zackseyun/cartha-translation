id: NUM.25.7
reference: Numbers 25:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: tl
  text: Nang makita ito[a] ni Finehas—anak ni Eleazar at apo ni Aaron na pari—tumindig siya mula sa gitna ng kapulungan[b] at kumuha ng sibat sa kanyang kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nang makita ni Finehas.” Sa Hebreo, “nakita” lamang ang tahasang sinabi; ipinahihiwatig ng naunang konteksto kung ano ang nakita niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mula sa gitna ng sambayanan” o “mula sa gitna ng pagtitipon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita ito
  rationale: Ang pandiwa ay payak na ‘nakita,’ at ipinahihiwatig lamang ng naunang konteksto ang layon. Idinagdag ang ‘ito’ para sa likas na daloy sa Tagalog, habang inilalahad sa talababa ang literal na anyo.
- source_word: פִּינְחָס
  choice: Finehas
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Hebreo.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: anak ni Eleazar at apo ni Aaron na pari
  rationale: Natural na ipinahahayag sa Tagalog ang dalawang salinlahi sa pamamagitan ng ‘anak’ at ‘apo.’ Pinanatili ang ‘pari’ at hindi dinagdagan ng ‘punong pari,’ sapagkat הַכֹּהֵן lamang ang nasa Hebreo.
- source_word: וַיָּקָם
  choice: tumindig siya
  rationale: Ipinahahayag nito ang pagbangon o pagtayo at ang mariing pagsisimula ng kilos sa salaysay.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: mula sa gitna ng kapulungan
  rationale: Ang ‘mula sa gitna’ ay malapit sa תּוֹךְ, at ang ‘kapulungan’ ay natural na tumutukoy sa nagkakatipong sambayanan ng Israel.
- source_word: וַיִּקַּח
  choice: kumuha
  rationale: Karaniwang pandiwa ang ginamit; ang mas marahas na ‘sinunggaban’ ay magdaragdag ng diin na hindi hinihingi ng Hebreo.
- source_word: רֹמַח
  choice: sibat
  rationale: Ang ‘sibat’ ang malinaw at karaniwang katumbas sa Tagalog ng ganitong sandata.
- source_word: בְּיָדוֹ
  choice: sa kanyang kamay
  rationale: Pinanatili ang tahasang pagtukoy ng Hebreo na nasa kamay niya ang sibat, kahit bahagyang mas literal ang ayos na ito sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa הָעֵדָה
  choice: kapulungan
  alternative: sambayanan; pagtitipon
  rationale: Ipinakikita ng ‘kapulungan’ ang sama-samang bayan ng Israel sa konteksto ng Pentateuco nang hindi nag-aangkat ng natatanging kahulugang pangdenominasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang em dash upang maging malinaw ang talaangkanan, at pinanatili ang maigsi at mabilis na kilos ng salaysay.
