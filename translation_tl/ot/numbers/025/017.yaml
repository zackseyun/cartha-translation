    issue: Ang “pabagsakin” ay hindi sapat na tuwiran para sa וְהִכִּיתֶם.
    rationale: Maaari itong mangahulugang pabagsakin, talunin, o patumbahin, samantalang ang Hiphil ng נכה ay pangunahing ‘hampasin/strike.’ Ang “hampasin ninyo sila” ay pinananatili ang pisikal na puwersa nang hindi inaangking ang pandiwa mismo ay laging nangangahulugang patayin.
  - severity: low
    issue: Ang footnote na “Usigin ninyo” ay maaaring magpahiwatig ng pag-uusig sa paraang legal o relihiyoso.
    rationale: Bagaman posible ang ‘harass,’ mas malinaw na lexical na alternatibo sa konteksto ang ‘Ituring ninyong kaaway,’ na tahasang inilalahad ang relasyunal na diwa ng צָרוֹר.
