  yaml_path: translation/ot/numbers/025/017.yaml
  text: Harass the Midianites and strike them down,[a]
translation:
  language: tl
  text: Kalabanin ninyo ang mga Midianita at hampasin ninyo sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Ituring ninyong kaaway ang mga Midianita at hampasin ninyo sila.” Ang pandiwang Hebreo na צָרוֹר ay maaaring mangahulugang magpakita ng pagkapoot o ituring ang isang tao bilang kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: Kalabanin ninyo
  rationale: Ang pandiwa ay nag-uutos na pakitunguhan ang mga Midianita bilang mga kaaway o magpakita ng pagkapoot sa kanila. Likas at malinaw sa makabagong Filipino ang “kalabanin,” at hindi nito nililimitahan ang utos sa isang tiyak na paraang militar.
- source_word: הַמִּדְיָנִים
  choice: ang mga Midianita
  rationale: Karaniwang katawagang Filipino para sa mga taong mula sa Midian.
- source_word: וְהִכִּיתֶם
  choice: at pabagsakin sila
  rationale: Ang Hiphil ng נכה ay maaaring mangahulugang hampasin, pabagsakin, o talunin. Ipinahahayag ng “pabagsakin” ang marahas na puwersa ng utos nang hindi ito pinakikitid sa tahasang “patayin,” na mas tiyak kaysa sa pandiwa mismo.
- source_word: אוֹתָם
  choice: sila
  rationale: Tuwirang layon na tumutukoy sa mga Midianita; sa konstruksiyong Filipino na may “pabagsakin,” likas ang anyong “sila.”
- source_word: אֶת
  choice: '[hindi bukod na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Filipino.
theological_decisions:
- issue: Paglalahad ng utos ng Diyos na maging marahas laban sa mga Midianita nang hindi ito pinahihina o pinalalawak
  choice: Kalabanin ninyo ang mga Midianita at pabagsakin sila
  alternative: Usigin ninyo ang mga Midianita at hampasin sila
  rationale: Pinananatili ng salin ang dalawang tuwirang utos—ang pagtrato sa kanila bilang kaaway at ang marahas na pagkilos laban sa kanila—nang hindi nagdaragdag ng paliwanag o katuwirang teolohikal na wala sa talata.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang “kalabanin” upang maipahayag ang patuloy na pagkapoot o pagtrato bilang kaaway, at ang “pabagsakin” upang mapanatili ang marahas na diwa ng נכה nang hindi awtomatikong ipinakahulugang “patayin.”
