  source_fidelity: Ang “Kalabanin ninyo” ay katanggap-tanggap para sa צָרוֹר at naipahahayag ang pagtrato sa mga Midianita bilang kaaway. Gayunman, ang “pabagsakin” para sa וְהִכִּיתֶם ay mas madaling unawain bilang talunin o patumbahin at maaaring kulang sa tuwirang diwa ng “hampasin/saktan” ng Hebreong נכה. Mas malapit ang “hampasin ninyo sila,” nang hindi ipinipilit ang “patayin.”
  naturalness: Natural at malinaw ang rebisyong pananalita sa modernong Filipino. Ang pag-uulit ng “ninyo” sa ikalawang pandiwa ay pangkaraniwan at nagpapanatili ng tuwirang, marangal na rehistro.
  terminology: Ang “mga Midianita” ay wastong katawagan. Ang “kalabanin” ay angkop para sa unang utos; ang “hampasin” ay mas tumpak na katumbas ng ikalawang utos kaysa “pabagsakin.”
  issues:
