id: NUM.25.18
reference: Numbers 25:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: tl
  text: Sapagkat kinakalaban nila kayo sa pamamagitan ng kanilang mga pakana[a], na ginamit nila upang dayain kayo sa usapin ng Peor[b] at sa usapin ni Cozbi, anak na babae ng isang pinuno ng Midian, na kapatid nila[c] at pinatay noong araw ng salot dahil sa usapin ng Peor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga panlilinlang” o “mga tusong pakana.”
    reason: lexical_alternative
  - marker: b
    text: Ang Peor ay tumutukoy sa pangyayaring may kinalaman sa Baal-peor na isinalaysay sa unang bahagi ng kabanata.
    reason: cross_reference
  - marker: c
    text: Sa Hebreo, “kapatid nila”; maaari itong tumukoy sa isang babaeng kabilang sa kanilang sariling bayan o angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: kinakalaban
  rationale: Ipinahahayag ng participle ang patuloy na pagkapoot o pakikitunggali. Ang “kinakalaban” ay natural sa modernong Tagalog at hindi nililimitahan ang diwa sa digmaang militar.
- source_word: בְּנִכְלֵיהֶם
  choice: sa pamamagitan ng mga pakana nila
  rationale: Tumutukoy ang pangngalan sa tuso at mapanlinlang na mga balak; malinaw ring naipapakita ng “sa pamamagitan” ang instrumental na gamit ng pang-ukol.
- source_word: נִכְּלוּ
  choice: ginawa nilang [mga pakana] laban sa inyo
  rationale: Ka-ugat ito ng naunang pangngalan at nagpapahiwatig ng mapanlinlang na pagpapakana laban sa Israel. Pinananatili ng salin ang pag-uugnay ng dalawang salitang Hebreo nang hindi nagiging labis na paulit-ulit sa Tagalog.
- source_word: עַל דְּבַר פְּעוֹר
  choice: sa usapin ng Peor
  rationale: Ang idyoma ay nangangahulugang “hinggil sa” o “sa usapin ng.” Sa unang paglitaw, ang situwasyonal na diwa ang nangingibabaw.
- source_word: כָּזְבִּי
  choice: Cozbi
  rationale: Isinatinig ang pangalang pantangi sa anyong madaling makilala at kaayon ng ibinigay na consultation layer.
- source_word: בַת נְשִׂיא מִדְיָן
  choice: anak na babae ng isang pinuno ng Midian
  rationale: Ang נָשִׂיא ay pinuno o pangulo ng isang pangkat. Mas malinaw ang “pinuno” at iniiwasan nito ang di-kinakailangang pahiwatig ng monarkiya sa “prinsipe.”
- source_word: אֲחֹתָם
  choice: kapatid nila
  rationale: Ito ang tuwirang kahulugan ng Hebreo. Pinananatili ito sa pangunahing teksto, habang nililinaw sa talababa ang posibleng mas malawak na diwa ng pagkakamag-anak o pagiging kababayan.
- source_word: הַמֻּכָּה
  choice: pinaslang
  rationale: Ipinahihiwatig ng pasibong participle mula sa נכה na siya ay hinampas at napatay. Ang “pinaslang” ay maikli, marangal, at malinaw sa konteksto.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: noong araw ng salot
  rationale: Natural na katumbas ito ng tiyak na panahong tinutukoy ng pariralang Hebreo.
- source_word: עַל דְּבַר פְּעוֹר
  choice: dahil sa usapin ng Peor
  rationale: Sa huling paglitaw, mas kapansin-pansin ang ugnayang sanhi sa salot, kaya ginamit ang “dahil sa” habang pinananatili ang “usapin ng Peor.”
theological_decisions:
- issue: Tinutukoy ng “Peor”
  choice: Pinanatili ang “Peor” bilang pangalang nasa tekstong Hebreo.
  alternative: Palawakin ito bilang “Baal-peor” sa pangunahing teksto.
  rationale: “Peor” lamang ang nasa Hebreo. Ang pagpapalit dito ng “Baal-peor” ay makapagbibigay-linaw ngunit magdaragdag ng salitang wala sa talata; inilagay ang paglilinaw sa talababa.
- issue: Diwa ng dalawang paglitaw ng עַל דְּבַר פְּעוֹר
  choice: “sa usapin ng Peor” sa una at “dahil sa usapin ng Peor” sa huli
  alternative: Gumamit ng eksaktong magkaparehong pananalita sa dalawang paglitaw.
  rationale: Kayang taglayin ng iisang idyomang Hebreo ang situwasyonal na diwa sa unang gamit at ang mas malinaw na sanhi sa huling gamit. Pinananatili ng bahagyang pagkakaiba ang lokal na ugnayan ng bawat parirala.
- issue: Saklaw ng “kapatid nila”
  choice: Pinanatili ang literal na pananalitang pampamilya sa pangunahing teksto.
  alternative: Isalin bilang “kaanak nila” o “isang babaeng kabilang sa kanilang bayan.”
  rationale: Hindi tiyak kung literal na kapatid o mas malawak na kasapi ng kanilang angkan/bayan ang tinutukoy. Pinananatili ng “kapatid nila” ang tunay na kalabuan ng teksto, at tinatalakay ang mas malawak na posibilidad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kinakalaban,” “pakana,” “pinuno,” at “salot” bilang mga salitang madaling maunawaan ngunit angkop sa tekstong banal. Hinati sa dalawang pangungusap ang mahabang estrukturang Hebreo upang maging natural ang daloy nang hindi binabago ang mga ugnayang pangkahulugan.
