lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Ang anyong ito ng היה ay nagsisilbing pang-ugnay sa pagsasaad ng kabuuang bilang; natural sa modernong Tagalog ang hulma na “ang ... ay ...”
- source_word: הַמֵּתִים
  choice: ang mga namatay
  rationale: Tuwirang ipinapahayag ng participle mula sa מות ang mga taong namatay; mas natural ito kaysa “ang mga patay” sa pangungusap na nagbibilang ng mga nasawi.
- source_word: בַּמַּגֵּפָה
  choice: sa salot
  rationale: Ang מַגֵּפָה ay isang salot o nakamamatay na paglaganap, at pinananatili ng “sa” ang malawak na ugnayan ng pang-ukol ב nang hindi ipinipilit kung sanhi o pangyayari ang diin.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: dalawampu't apat na libo
  rationale: Ito ang karaniwan at malinaw na ayos ng bilang sa modernong Tagalog.
