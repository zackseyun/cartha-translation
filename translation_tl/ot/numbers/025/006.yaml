  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: tl
  text: At narito, dumating ang isang lalaking kabilang sa mga anak ni Israel at inilapit niya sa kanyang mga kapatid[a] ang isang babaeng Midianita[b], sa harap ni Moises at sa harap ng buong kapulungan ng mga anak ni Israel, habang umiiyak sila sa pasukan ng tolda ng pagpupulong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kamag-anak niya” o “mga kapwa Israelita niya.” Sa Hebreo, “mga kapatid niya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang Midianita,” isang pambabaeng anyo na tumutukoy sa babae; likas sa Tagalog ang “isang babaeng Midianita” sa unang pagpapakilala sa kanya sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang panandang diskurso na biglang tumatawag ng pansin at nagbibigay-diin sa nakakagulat na pangyayari.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: kabilang sa mga anak ni Israel
  rationale: Pinananatili ang pampamilyang idyoma ng Hebreo, ngunit ginagawang likas sa makabagong Tagalog ang ugnayan ng lalaki sa pangkat.
- source_word: וַיַּקְרֵב
  choice: inilapit niya
  rationale: Tumpak na ipinahahayag ang causative at spatial na diwa ng pandiwa—ang babae ay sadyang dinala nang malapit—nang hindi dinaragdagan ng motibong wala sa teksto.
- source_word: אֶל אֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Pinananatili ang literal na pampamilyang pananalita; maaaring tumukoy sa mga kamag-anak o kapwa Israelita ayon sa konteksto.
- source_word: הַמִּדְיָנִית
  choice: isang babaeng Midianita
  rationale: Ang pambabaeng pang-uri ay ginamit bilang pangngalan. Idinagdag ang 'babae' para sa linaw, at ginamit ang 'isang' bilang likas na pagpapakilala sa kanya sa salaysay.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: sa harap ... at sa harap
  rationale: Likas na katumbas sa Tagalog ng idyomang 'sa mga mata ng,' habang pinananatili ang pag-uulit at ang hayagang katangian ng ginawa.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: buong kapulungan ng mga anak ni Israel
  rationale: '''Kapulungan'' ay malinaw at marangal na tawag sa nagkakatipong pamayanan, at pinananatili ang pampamilyang katawagang ''mga anak ni Israel.'''
- source_word: וְהֵמָּה בֹכִים
  choice: habang umiiyak sila
  rationale: Ipinakikita ang nagpapatuloy na kilos na kasabay ng pagdating ng lalaki, nang hindi nililinaw nang lampas sa Hebreo kung eksaktong sino ang saklaw ng 'sila.'
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng tolda ng pagpupulong
  rationale: Malinaw na salin ng lokasyon at ng natatanging katawagan sa santuwaryo.
theological_decisions:
- issue: Pampamilyang pananalita sa בְּנֵי יִשְׂרָאֵל at אֶחָיו
  choice: Panatilihin ang 'mga anak ni Israel' at 'mga kapatid' sa pangunahing teksto
  alternative: mga Israelita; mga kamag-anak; kapwa Israelita
  rationale: Pinananatili nito ang pampamilyang larawan ng Hebreo nang hindi ipinapasok ang isang mas makitid na interpretasyon. Sa Tagalog, ang kasarian ng indibidwal ay malinaw na nasa 'isang lalaki,' samantalang ang nakaugaliang 'mga anak ni Israel' ay angkop sa kolektibong katawagan.
- issue: Saklaw ng panghalip sa וְהֵמָּה בֹכִים
  choice: Panatilihin ang payak na 'habang umiiyak sila'
  alternative: habang umiiyak si Moises at ang buong kapulungan
  rationale: Hindi tahasang binibigyang-pangalan ng Hebreo ang lahat ng tinutukoy ng panghalip; ang mas tiyak na salin ay maaaring tahimik na lumutas sa isang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang bahagyang pormal na 'At narito,' ang pampamilyang 'mga anak ni Israel,' at ang pag-uulit ng 'sa harap' upang maipakita ang diin ng Hebreo, ngunit iniwasan ang di-likas na hulma ng pangungusap.
