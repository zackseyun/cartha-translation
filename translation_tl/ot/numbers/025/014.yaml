base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: tl
  text: At ang pangalan ng lalaking Israelita na pinaslang[a]—na pinaslang kasama ng babaeng Midianita—ay Zimri na anak ni Salu, isang pinuno ng sambahayan ng ama[b] sa lipi ni Simeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na anyo: “ang lalaking Israelita na pinaslang, na pinaslang kasama ng babaeng Midianita.” Inuulit sa Hebreo ang pandiwa bilang pagdiriin.'
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan ng ama” ay isang yunit ng pamilya o angkan na sinusundan sa linya ng ama sa loob ng lipi.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: At ang pangalan
  rationale: Pinananatili ng “At” ang pang-ugnay na puwersa ng וְ nang hindi nagdaragdag ng temporal na diwa gaya ng “Ngayon.”
- source_word: אִישׁ יִשְׂרָאֵל
  choice: lalaking Israelita
  rationale: Malinaw na ipinahahayag ang panlalaking isahan at ang pagkakakilanlan niya bilang Israelita.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: na pinaslang—na pinaslang
  rationale: Iningatan ang sinadyang pag-uulit ng pandiwang נכה at ang marahas at nakamamatay na diwa nito sa konteksto.
- source_word: אֶת הַמִּדְיָנִית
  choice: kasama ng babaeng Midianita
  rationale: Sa konstruksiyong ito, ipinahihiwatig ng אֶת ang pagkakasamang pinaslang; idinagdag ang “babae” sapagkat pambabaeng isahan ang anyo at malinaw ang tinutukoy sa konteksto.
- source_word: זִמְרִי בֶּן סָלוּא
  choice: Zimri na anak ni Salu
  rationale: Karaniwang anyong Filipino para sa patronimiko, habang pinananatili ang mga pangalang pantangi bilang transliterasyon.
- source_word: נְשִׂיא
  choice: isang pinuno
  rationale: Likas at malinaw na salin ng katungkulan, nang walang posibleng royal na pahiwatig ng “prinsipe.”
- source_word: בֵית אָב
  choice: sambahayan ng ama
  rationale: Pinananatili ang teknikal na istrukturang kamag-anakang patrilineal sa halip na payak na gawing “pamilya” o “angkan.”
- source_word: לַשִּׁמְעֹנִי
  choice: sa lipi ni Simeon
  rationale: Natural na Filipino para sa pagkakabilang sa pangkat-tribo ng mga Simeonita.
