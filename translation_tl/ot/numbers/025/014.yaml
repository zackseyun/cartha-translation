translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang gitling na em dash upang maging malinaw ang inuulit na sugnay nang hindi binubura ang pagdiriin ng Hebreo. Ang “lipi ni Simeon” ay mas natural sa Filipino kaysa sa literal na “sa mga Simeonita.”
