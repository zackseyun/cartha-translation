reference: Numbers 25:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises[a], “Kunin mo ang lahat ng mga pinuno ng bayan at ipako sila para kay Yahweh sa liwanag ng araw[b], upang mapawi ang nag-aalab na galit ni Yahweh laban sa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Kunin mo ang lahat ng mga pinuno ng bayan, at ipapatay mo sa kanila ang mga nagkasala para kay Yahweh sa liwanag ng araw.” Sa Hebreo, ang panghalip na “sila” ay pinakatuwirang tumutukoy sa mga pinuno, ngunit inuunawa ng ilan na ang mga pinuno ang inutusang magsagawa ng parusa.'
    reason: alternative_reading
  - marker: b
    text: 'Literal: “sa harap ng araw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: קַח
  choice: Kunin mo
  rationale: Tuwiran at natural na pautos sa modernong Tagalog para sa pagkilos ni Moises kaugnay ng mga pinuno.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: lahat ng mga pinuno ng bayan
  rationale: Bagaman literal na “mga ulo ng bayan,” malinaw na tumutukoy ito sa mga pinuno; iniiwasan ng saling ito ang maling pagkaunawa na mga pugot na ulo ang tinutukoy.
- source_word: וְהוֹקַע אֹתָם
  choice: at ipako sila
  rationale: Ipinahihiwatig ng Hiphil ng יקע ang marahas at hayagang pagbitay o paglalantad. Ang “ipako” ay nagpapanatili sa kongkretong bigat ng salita nang hindi ito ginagawang pangkalahatang “patayin.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang direksiyon o pag-aalay na ipinahihiwatig ng ל; hindi ito isinaling “sa harap ni Yahweh,” na karaniwang nangangailangan ng ibang pariralang Hebreo.
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: sa liwanag ng araw
  rationale: Natural na Tagalog para sa literal na “sa harap ng araw,” na nagpapahiwatig ng hayagan at pampublikong pagsasagawa.
- source_word: חֲרוֹן אַף יְהוָה
  choice: ang nag-aalab na galit ni Yahweh
  rationale: Pinananatili ang metapora ng matinding init ng galit sa isang natural at marangal na pariralang Tagalog.
- source_word: וְיָשֹׁב ... מִיִּשְׂרָאֵל
  choice: upang mapawi ... laban sa Israel
  rationale: Ipinapahayag ang layunin ng utos at ang pagtalikod ng galit mula sa Israel sa natural na Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng “sila” sa utos na ipako
  choice: Ang “sila” ay tumutukoy sa lahat ng mga pinuno ng bayan.
  alternative: Kukunin ng mga pinuno ang mga nagkasala at sila ang magpaparusa sa mga ito sa harap ni Yahweh.
  rationale: Sa pinakamalapit at tuwirang balarila, ang panghalip ay bumabalik sa “lahat ng mga pinuno ng bayan.” Gayunman, dahil inutusan sa kasunod na talata ang mga hukom na patayin ang mga lalaking sumamba kay Baal-peor, tunay na posible ang alternatibong pagbasa at kaya ito ay pinanatili sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang pangalang Yahweh, ang marahas at pampublikong katangian ng parusa, at ang tunay na kalabuan tungkol sa papel ng mga pinuno.
