revisions:
- from: At para sa kanya at sa kanyang lahing susunod sa kanya ay magkakaroon ng isang tipan ng panghabang-panahong pagkasaserdote[b], sapagkat nagpakasigasig siya para sa kanyang Diyos[a] at nagsagawa ng pagtubos para sa mga anak ni Israel[c].
  to: 'At ito ay magiging para sa kanya at sa kanyang mga supling pagkaraan niya: isang tipan ng panghabang-panahong pagkasaserdote[b], sapagkat naging masigasig siya alang-alang sa kanyang Diyos[a] at gumawa siya ng pagbabayad-sala para sa mga anak ni Israel[c].'
  rationale: Inayos ang sintaks upang malinaw na ang tipan ang ipinagkakaloob kay Pinehas at sa kanyang mga supling. Pinalitan ang salin ng כפר ng “gumawa ng pagbabayad-sala,” na tumpak sa kontekstong pari at pag-aalis ng kasalanan. Pinanatili ang maingat na salin sa עוֹלָם at ang alternatibong diwa ng קנא sa talababa.
