  text: וְ/הָ֤יְתָה לּ/וֹ֙ וּ/לְ/זַרְע֣/וֹ אַחֲרָ֔י/ו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽ/אלֹהָ֔י/ו וַ/יְכַפֵּ֖ר עַל בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: tl
  text: 'At ito ay magiging para sa kanya at sa kanyang mga supling pagkaraan niya: isang tipan ng panghabang-panahong pagkasaserdote[b], sapagkat naging masigasig siya alang-alang sa kanyang Diyos[a] at gumawa siya ng pagbabayad-sala para sa mga anak ni Israel[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagselos siya alang-alang sa kanyang Diyos.” Maaaring magpahayag ang pandiwang Hebreo ng paninibugho o masidhing sigasig na kaugnay ng katapatan sa tipan.
    reason: lexical_alternative
  - marker: b
    text: O “walang-hanggang pagkasaserdote.”
    reason: alternative_reading
  - marker: c
    text: Ang “mga anak ni Israel” ay tradisyonal na pambansang katawagan sa Hebreo at tumutukoy sa sambayanang Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ay magkakaroon
  rationale: Ipinahahayag nito ang tiyak na pagkakaloob ng tipan; likas sa modernong Tagalog ang ganitong ayos kaysa sa literal na “at ito ay magiging.”
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: para sa kanya at sa kanyang lahing susunod sa kanya
  rationale: Ang “lahi” ay nagpapanatili sa kolektibong diwa ng זֶרַע, at ang “susunod sa kanya” ay nagpapakita ng pagpapatuloy o paghalili.
- source_word: בְּרִית
  choice: isang tipan
  rationale: Ang “tipan” ang karaniwan at angkop na salin sa konteksto ng isang banal na pagkakaloob.
- source_word: כְּהֻנַּת עוֹלָם
  choice: panghabang-panahong pagkasaserdote
  rationale: Ipinahahayag nito ang namamalagi at nagpapatuloy na katangian ng institusyon nang hindi sapilitang ginagawang pilosopikal na pahayag tungkol sa walang katapusang panahon.
- source_word: תַּחַת אֲשֶׁר
  choice: sapagkat
  rationale: Malinaw at maikli nitong ipinakikilala ang dahilan o batayan ng pagkakaloob.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: nagpakasigasig siya para sa kanyang Diyos
  rationale: Likas sa Tagalog ang “nagpakasigasig” at naihahatid nito ang matinding sigasig para sa karangalan at katapatan sa Diyos; inilalagay sa talababa ang posibleng diwa ng paninibugho.
- source_word: וַיְכַפֵּר
  choice: nagsagawa ng pagtubos
  rationale: Ang “pagtubos” ay madaling maunawaang terminong panrelihiyon para sa כפר, at ang “nagsagawa” ay hindi nagdaragdag ng paraang hindi tahasang binanggit sa talata.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Pinananatili nito ang tradisyonal at literal na pambansang katawagan, habang nililinaw ng talababa na tumutukoy ito sa sambayanang Israel.
theological_decisions:
- issue: Diwa ng קנא kaugnay ng ginawa ni Pinehas
  choice: nagpakasigasig siya para sa kanyang Diyos
  alternative: nagselos siya alang-alang sa kanyang Diyos
  rationale: Maaaring tumukoy ang pandiwa sa sigasig o sa paninibughong kaugnay ng katapatan sa tipan. Ang pangunahing salin ay mas natural at hindi mapagkakamalang inggit, ngunit pinananatili sa talababa ang tunay na alternatibong diwa.
- issue: Saklaw ng עוֹלָם sa pangako tungkol sa pagkasaserdote
  choice: panghabang-panahong pagkasaserdote
  alternative: walang-hanggang pagkasaserdote
  rationale: Ang “panghabang-panahon” ay nagpapahayag ng namamalaging pagpapatuloy ng pagkasaserdote nang hindi nilulutas nang higit sa Hebreo kung ito ay isang absolutong pahayag tungkol sa walang katapusang tagal.
- issue: Pambansang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: sambayanang Israel
  rationale: Pinananatili sa teksto ang anyo ng Hebreo, ngunit nililinaw na ang parirala ay tradisyonal na tawag sa buong bayang Israel.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang “nagpakasigasig” upang maiwasan ang karaniwang negatibong diwa ng “nagselos,” habang pinananatili ang alternatibo sa talababa. Ang “pagkasaserdote” at “pagtubos” ay pamilyar na mga terminong biblikal na angkop sa konteksto.
