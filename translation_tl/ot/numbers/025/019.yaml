  text: And it happened after the plague[a].
translation:
  language: tl
  text: At nangyari ito pagkatapos ng salot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas tradisyonal na pananalita, “At nangyari, pagkatapos ng salot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari ito
  rationale: Ang anyong pasalaysay ng היה ay nagsisilbing panandang transisyon. Likas sa modernong Filipino ang “At nangyari ito” at pinananatili nito ang ugnayan sa naunang salaysay.
- source_word: אַחֲרֵי
  choice: pagkatapos ng
  rationale: Tuwirang ipinahahayag nito ang pagkakasunod sa panahon; ang “pagkatapos ng” ang pinakanatural na katumbas sa Filipino.
- source_word: הַמַּגֵּפָה
  choice: salot
  rationale: Ang מַגֵּפָה ay tumutukoy rito sa nakamamatay na salot bilang hatol. Maikli, malinaw, at angkop sa konteksto ang “salot.”
theological_decisions:
- issue: Pormulang pasalaysay bilang buong talata
  choice: Isinalin ang maikling sugnay bilang nagsasariling pangungusap na transisyonal.
  alternative: Ituring itong pambungad na sugnay na nagpapatuloy sa susunod na talata.
  rationale: Ang tekstong Hebreo ng talatang ito ay isang maikling transisyon lamang. Iginagalang ng nagsasariling pangungusap ang paghahati ng talata sa pinagkunang tradisyon habang pinananatili ang tungkulin nitong mag-ugnay ng salaysay; walang usaping doktrinal na nakataya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salot” sa halip na mas teknikal o hindi likas na mga katumbas, at pinanatili ang maikling anyong transisyonal ng Hebreo.
