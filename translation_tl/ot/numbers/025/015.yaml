translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang dalawang pangungusap upang maging tiyak na si Zur, hindi si Kozbi, ang tinutukoy na pinuno; hindi nito binabago ang ugnayang panggramatika ng Hebreo.
