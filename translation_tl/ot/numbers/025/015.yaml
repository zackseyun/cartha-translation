  text: וְ/שֵׁ֨ם הָֽ/אִשָּׁ֧ה הַ/מֻּכָּ֛ה הַ/מִּדְיָנִ֖ית כָּזְבִּ֣י בַת צ֑וּר רֹ֣אשׁ אֻמּ֥וֹת בֵּֽית אָ֛ב בְּ/מִדְיָ֖ן הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: tl
  text: At ang pangalan ng babaeng Midianita na pinatay ay Kozbi, na anak ni Zur. Si Zur ang pinuno ng mga lipi[a] ng isang sambahayan ng ama[b] sa Midian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bayan.” Sa kontekstong ito ng ugnayang pampamilya, maaaring tumukoy ang salitang Hebreo sa mga lipi o pangkat ng magkakamag-anak.
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan ng ama” ay katawagang Hebreo para sa isang malawak na pamilya o sambahayan ng ninuno.
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם
  choice: At ang pangalan
  rationale: Pinananatili ng “At” ang pagkakaugnay ng salaysay sa naunang talata, at tuwirang isinasalin ang pangngalan.
- source_word: הָאִשָּׁה הַמֻּכָּה הַמִּדְיָנִית
  choice: babaeng Midianita na pinatay
  rationale: Likas sa modernong Tagalog ang ayos na ito. Ang “pinatay” ay malinaw na ipinahihiwatig ng konteksto ng pasibong pandiwaring mula sa נכה, bagaman literal itong may diwang “hinampas” o “pinabagsak.”
- source_word: כָּזְבִּי בַת־צוּר
  choice: Kozbi, na anak ni Zur
  rationale: Ang “Kozbi” ay malapit sa bigkas ng pangalang Hebreo, at ang “anak ni Zur” ay malinaw na nagpapahayag ng ugnayang pampamilya.
- source_word: רֹאשׁ
  choice: pinuno
  rationale: Sa kontekstong panlipunan, ang literal na “ulo” ay tumutukoy sa isang lider o pinuno; “pinuno” ang natural at malinaw na katumbas sa Tagalog.
- source_word: אֻמּוֹת
  choice: mga lipi
  rationale: Maaaring mangahulugang “mga bayan” ang salita, ngunit sa kontekstong pangkamag-anakan ay malamang na tumutukoy ito sa mga pangkat na magkakamag-anak. Pinananatili sa talababa ang tunay na alternatibo.
- source_word: בֵּית אָב
  choice: isang sambahayan ng ama
  rationale: Pinananatili nito ang natatanging idyomang Hebreo at sinasamahan ng paliwanag na ito ay isang yunit ng malawak na pamilya o sambahayan ng ninuno.
- source_word: בְּמִדְיָן הוּא
  choice: Si Zur ... sa Midian
  rationale: Ang panlalaking panghalip ay tumutukoy kay Zur. Ang pag-uulit sa pangalan niya ay mas malinaw sa Tagalog at iniiwasang mapagkamalang si Kozbi ang pinuno.
