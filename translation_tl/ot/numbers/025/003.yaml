  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְ/בַ֣עַל פְּע֑וֹר וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: tl
  text: Kaya, ikinabit ng Israel ang sarili nito kay Baal ng Peor[a], at nag-alab ang galit ni Yahweh laban sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kay Baal-Peor” o “itinali ng Israel ang sarili nito kay Baal ng Peor.”
    reason: Ipinapakita ang alternatibong pagbubuo sa pangalan at ang mas matingkad na larawan ng mahigpit na pagkakabit na maaaring ipahiwatig ng pandiwang צמד.
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: iniugnay ... ang sarili nito
  rationale: Ang Nifal ng צמד ay nagpapahiwatig ng mahigpit na pagkalakip o pag-uugnay. Pinananatili ng parirala ang pansariling diwa ng anyo at ang malalim na pagkakaugnay ng Israel sa diyos-diyosan nang hindi labis na nagpapakahulugan.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyo sa modernong Filipino para sa pangalan ng bansa at bayan.
- source_word: לְבַעַל פְּעוֹר
  choice: kay Baal ng Peor
  rationale: Ang לְ ay likas na isinasalin bilang “kay” kapag tumutukoy sa isang persona o diyos. Ipinapakita ng “Baal ng Peor” ang kaugnayan ni Baal sa lugar na Peor habang pinananatili ang pagkakahiwalay ng dalawang pangalang Hebreo.
- source_word: וַיִּחַר אַף
  choice: nag-alab ang galit
  rationale: Pinananatili nito ang Hebreong metapora ng galit bilang init o apoy at natural itong pakinggan sa kasalukuyang Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang tetragrammaton bilang personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: בְּיִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa idyomang חרה אף, tinutukoy ng בְּ ang pinatutungkulan ng galit; malinaw at natural itong ipinahahayag ng “laban sa Israel.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na halinhan ito ng isang titulo.
- issue: Lakas ng pagkakaugnay ng Israel kay Baal
  choice: iniugnay ng Israel ang sarili nito
  alternative: ipinamatok ng Israel ang sarili nito
  rationale: Pinananatili ng pangunahing salin ang pansarili at malapit na pagkakaugnay na ipinahihiwatig ng Nifal na צמד, samantalang inilalagay sa talababa ang mas matingkad ngunit mas interpretatibong larawang “ipinamatok.”
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “Kaya” upang ipagpatuloy ang bunga ng naunang salaysay, at pinanatili ang Hebreong metapora sa “nag-alab ang galit.”
