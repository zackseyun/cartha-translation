base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: tl
  text: 'Sinabi ni Moises sa mga hukom ng Israel: “Patayin ng bawat isa sa inyo ang mga lalaking sakop niya na kumapit kay Baal ng Peor.[a]”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Baal-Peor.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal na Hebreo: “Patayin ninyo, bawat lalaki, ang kaniyang mga lalaki.” Ang diwa ay dapat patayin ng bawat hukom ang mga lalaking nasa ilalim ng kaniyang kapangyarihan na kumapit o nakiugnay kay Baal ng Peor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: mga hukom
  rationale: Tumutukoy ang pangngalan sa mga may kapangyarihang humatol at mamahala sa Israel; ang “mga hukom” ang tuwiran at angkop na salin.
- source_word: הִרְגוּ
  choice: Patayin
  rationale: Tahasan itong pangmaramihang pautos. Pinananatili ng “Patayin” ang tindi ng utos nang hindi idinaragdag ang mas tiyak na legal na diwa ng “bitayin” o “hatulan ng kamatayan.”
- source_word: אִישׁ אֲנָשָׁיו
  choice: ng bawat isa sa inyo ang mga lalaking nasasakupan niya
  rationale: 'Ipinahahayag nito ang distributibong diwa: bawat hukom ang kikilos laban sa mga lalaking nasa ilalim ng kaniyang kapangyarihan.'
- source_word: הַנִּצְמָדִים
  choice: na pumanig
  rationale: Ang Niphal participle ng צמד ay nagsasaad ng mahigpit na pagkalakip o pakikiugnay. Natural sa kasalukuyang Tagalog ang “pumanig” para sa kusang pag-uugnay ng sarili sa diyos na ito, habang nililinaw sa talababa ang mas literal na larawan.
- source_word: לְבַעַל פְּעוֹר
  choice: kay Baal ng Peor
  rationale: Ipinakikita nito ang kaugnayan ni Baal sa Peor sa natural na Tagalog. Nananatiling maaaring unawain ang parirala bilang pangalang “Baal-Peor,” kaya ibinibigay iyon bilang alternatibo.
theological_decisions:
- issue: Kalikasan ng iniutos na pagpatay
  choice: Isinalin nang tuwiran bilang utos ni Moises sa mga hukom na patayin ang mga lalaking nasasakupan nilang kumampi kay Baal ng Peor.
  alternative: Gamitin ang “hatulan ng kamatayan” upang idiin ang hudisyal na parusa.
  rationale: Hindi inilalahad ng talata ang paraan o prosesong legal. Kaya pinananatili ang bigat ng utos nang walang idinagdag na paliwanag na legal o ritwal.
- issue: Panlalaking pagtukoy sa אִישׁ אֲנָשָׁיו
  choice: “bawat isa sa inyo” at “mga lalaking nasasakupan niya”
  alternative: 'Gawing neutral sa kasarian: “bawat isa ... ang mga nasasakupan niya.”'
  rationale: Panlalaki ang anyo ng Hebreo at mga lalaking nagkasala ang tinutukoy sa konteksto; kaya tahasang pinanatili ang sangguniang panlalaki.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “nasasakupan” upang malinaw na ipakita ang ugnayan ng bawat hukom sa “kaniyang mga lalaki,” at iniwasan ang mas arkaikong “lipulin” o ang mas interpretatibong “hatulan ng kamatayan.”
