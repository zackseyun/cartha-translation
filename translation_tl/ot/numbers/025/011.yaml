language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: tl
  text: Si Finehas, anak ni Eleazar, na anak ni Aaron na pari, ang umiwas ng matinding galit ko mula sa mga anak ni Israel, dahil sa kanyang paninibugho alang-alang sa aking paninibugho sa gitna nila[a]. Kaya hindi ko nilipol ang mga anak ni Israel sa aking paninibugho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang magkakaugnay na salitang Hebreo bilang “dahil sa kanyang sigasig alang-alang sa aking sigasig sa gitna nila.” Ginagamit ng Hebreo ang mga salitang mula sa iisang ugat para sa kilos ni Finehas at sa paninibugho ng Diyos.
    reason: Ipinapakita ang tunay na alternatibong kahulugan ng קנא / קִנְאָה at ang sadyang pag-uulit ng magkakaugnay na salita sa Hebreo.
lexical_decisions:
- source_word: הֵשִׁיב
  choice: naglayo
  rationale: Ang Hiphil ng שוב kasama ng חֵמָה ay nangangahulugang ipinailag o inilayo ang galit. Likas sa makabagong Tagalog ang “naglayo ng matinding galit ko” at napananatili nito ang diwang sanhi.
- source_word: חֲמָתִי
  choice: matinding galit ko
  rationale: Ang חֵמָה ay matindi at nag-aalab na galit. Mas malinaw sa karaniwang mambabasa ang “matinding galit” kaysa sa mas makalumang “poot,” habang nananatili ang tindi nito.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Sa pariralang may הֵשִׁיב, ipinahihiwatig ng מֵעַל ang pag-aalis ng galit na nakapataw sa Israel. Isinasama na ng “naglayo ... sa” ang relasyong ito nang hindi gumagamit ng di-likas na “mula sa ibabaw.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal at tipanang katawagan ng Hebreo, na nauunawaan din sa dignified na wikang biblikal sa Tagalog.
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: nagselos siya alang-alang sa akin taglay ang pagseselos ko
  rationale: Pinananatili ng “nagselos/pagseselos” ang magkaugnay na anyo ng קנא at קִנְאָה. Nililinaw ng “alang-alang sa akin” na ang tinutukoy ay eksklusibong katapatan para sa Diyos, hindi inggit; ang “taglay” ay natural na paraan upang ipahayag ang di-karaniwang Hebreong tambalan nang hindi inaalis ang tensiyon nito.
- source_word: בְּתוֹכָם
  choice: sa gitna nila
  rationale: Tumpak at natural itong nagpapahiwatig na ginawa ni Finehas ang pagkilos sa loob mismo ng kapulungan.
- source_word: כִלִּיתִי
  choice: nilipol
  rationale: Sa Piel, ang כלה rito ay tumutukoy sa lubusang pag-ubos o pagwasak. Ang “nilipol” ay maikli, matindi, at natural sa konteksto ng hatol.
- source_word: בְּקִנְאָתִי
  choice: dahil sa pagseselos ko
  rationale: Ipinapahayag ng “dahil sa” ang sanhi o paraan ng muntik nang paglipol, at inuulit ng “pagseselos” ang susing salitang ginamit sa naunang sugnay.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Ang titulo ay tumutukoy kay Aaron. Ang “Aaron na pari” ay malinaw at natural na apposisyon sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa קנא / קִנְאָה para kay Finehas at sa Diyos
  choice: nagselos / pagseselos
  alternative: nagmalasakit nang buong sigasig / sigasig
  rationale: Sadyang inuugnay ng Hebreo ang kilos ni Finehas sa sariling mapanibughuing katapatan ng Diyos. Pinananatili ng “pagseselos” ang ugnayang leksikal at ang diwa ng eksklusibong tipanang katapatan; inilalagay sa talababa ang “sigasig” bilang tunay na posibleng salin.
- issue: Pagpapakahulugan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang anyo ng tipanang katawagan sa Hebreo sa halip na gawing mas pangkalahatan, bagaman pareho ang tinutukoy.
- issue: Kaugnayan ng pariralang בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: alang-alang sa akin taglay ang pagseselos ko
  alternative: nang magselos siya ng aking pagseselos
  rationale: Ang literal na tambalan ay asiwa sa Tagalog. Ang piniling anyo ay nagpapanatili sa pag-uugnay ng pagseselos ni Finehas at ng Diyos ngunit hindi tiyak na ipinapaliwanag kung paano niya “taglay” ang pagseselos ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga anak ni Israel” upang mapanatili ang katawagang Hebreo, ngunit iniwasan ang di-likas na sintaks gaya ng “mula sa ibabaw.” Ang talababa ay inilagay sa mismong pariralang tinatalakay nito.
