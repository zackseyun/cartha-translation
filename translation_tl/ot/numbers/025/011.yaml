  naturalness: Ang “paninibugho” ay mas angkop kaysa “pagseselos” para sa marangal at teolohikal na rehistro, dahil ang “selos” sa makabagong gamit ay karaniwang nauugnay sa personal o romantikong inggit. Ang binagong pangungusap ay mas malinaw ang pagkakaugnay ng sanhi at bunga.
