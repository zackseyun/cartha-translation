  yaml_path: translation/ot/numbers/025/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, sinabi ni Yahweh kay Moises[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo YHWH; tradisyonal na isinasalin bilang “ang PANGINOON.”
