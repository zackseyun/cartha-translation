lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos” para sa pagkakasunod-sunod, at ang “sinabi” ay angkop sa pormulang nagpapakilala ng tuwirang pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang likas na anyo sa Tagalog bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakasanayan at malinaw na anyo ng pangalang מֹשֶׁה sa Tagalog.
- source_word: לֵּאמֹר
  choice: ipinakikita ng kuwit at ng kasunod na tuwirang pahayag
  rationale: Ang infinitibong ito ay pormulang nagpapakilala sa nilalaman ng sasabihin. Sa natural na Tagalog, hindi na kailangang ulitin bilang “na sinasabi”; sapat ang pandiwang “sinabi” at ang bantas na naghahanda sa kasunod na pahayag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay transliterasyon na nagpapanatili rito bilang personal na pangalan, samantalang ang “PANGINOON” ay tradisyonal na pamalit na titulo.
translation_notes:
  register: Makabago, payak, at marangal na Tagalog. Ginamit ang natural na pormulang “sinabi ni … kay …” at hindi ang mas literal ngunit mabigat na “nagsalita … na sinasabi.”
