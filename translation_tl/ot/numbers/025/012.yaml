  text: לָ/כֵ֖ן אֱמֹ֑ר הִנְנִ֨/י נֹתֵ֥ן ל֛/וֹ אֶת בְּרִיתִ֖/י שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/012.yaml
  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: tl
  text: Kaya sabihin mo, ‘Narito, ibinibigay ko sa kanya ang aking tipan ng kapayapaan.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas at tuwirang ipinahahayag ang bunga o tugon sa naunang pangyayari.
- source_word: הִנְנִי
  choice: Narito
  rationale: Pinananatili ang pansin-diin ng Hebreong pahayag at ang marangal na himig nito.
- source_word: נֹתֵן
  choice: ibinibigay ko
  rationale: Isinasalin ang participle bilang kasalukuyang deklarasyon ng pagkakaloob.
- source_word: בְּרִיתִי שָׁלוֹם
  choice: aking tipan ng kapayapaan
  rationale: Pinananatili ang payak na ugnayang gramatikal at ang sadyang maigsi ngunit maaaring malawak na kahulugan ng parirala.
theological_decisions:
- issue: Ugnayan ng ‘tipan’ at ‘kapayapaan’
  choice: tipan ng kapayapaan
  alternative: tipan ko na nagkakaloob ng kapayapaan
  rationale: Hindi pinalalawak ang Hebreo sa isang tiyak na paliwanag; pinananatili ang posibleng saklaw at teolohikal na tensiyon ng construct phrase.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Narito’ sa halip na mas kolokyal na ‘Tingnan mo’ upang maipahayag ang idiomatikong diin ng הִנְנִי nang hindi nagpapahiwatig ng literal na pagtingin.
