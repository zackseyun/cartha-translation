  naturalness: Natural sa pangkalahatan ang modernong Tagalog ng draft. Mas malinaw at mas idiomatiko ang “sa tiyan ng babae” kaysa “hanggang sa tiyan ng babae” sa ganitong pangungusap. Isinalin din ang banyagang “pavilion” bilang “pabilyon” sa talababa.
  terminology: Ang “lalaking Israelita,” “inulos,” “salot,” at “mga anak ni Israel” ay angkop at nagpapanatili ng mahahalagang semantikong detalye. Ang “silid” ay maingat na salin para sa pambihirang קֻבָּה; ang mga alternatibo ay maayos na inilalagay sa talababa.
