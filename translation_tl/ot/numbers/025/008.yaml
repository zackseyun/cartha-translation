base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: tl
  text: Sinundan niya ang lalaking Israelita papasok sa silid[a], at inulos niya silang dalawa—ang lalaking Israelita at ang babae—sa tiyan ng babae[b]. Sa gayon, natigil ang salot sa mga anak ni Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “loob na silid,” “silid sa tolda,” “alkoba,” o “pabilyon.” Bihira ang salitang Hebreo at tumutukoy sa isang nakapaloob na silid o bahagi.
    reason: lexical_alternative
  - marker: b
    text: O “sa puson ng babae.” Ang salitang Hebreo ay tumutukoy sa tiyan o lukab ng tiyan.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mga anak ni Israel,” isang karaniwang tipanang katawagan para sa sambayanang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: silid
  rationale: Ang pambihirang pangngalan ay tumutukoy sa isang nakapaloob na silid o bahagi. Ang “silid” ay natural sa Tagalog at hindi nagpapasiya kung ito ay nasa tolda, isang alkoba, o isang pavilion.
- source_word: וַיִּדְקֹר
  choice: inulos
  rationale: Tumpak na ipinahihiwatig ng “inulos” ang marahas na pagtusok gamit ang sandata at ang pagtagos sa dalawang tao.
- source_word: שְׁנֵיהֶם
  choice: silang dalawa
  rationale: Tuwirang pinananatili nito na kapuwa tinamaan ang lalaki at ang babae.
- source_word: אֶל קֳבָתָהּ
  choice: hanggang sa tiyan ng babae
  rationale: Ang קֳבָה ay tiyan o lukab ng tiyan. Pinananatili ng salin ang tiyak at marahas na detalyeng anatomikal, habang nililinaw sa Tagalog na ang hulaping pambabae ay tumutukoy sa babae.
- source_word: וַתֵּעָצַר
  choice: natigil
  rationale: Ipinahihiwatig ng anyong Niphal na nahinto ang salot; ang “natigil” ay malinaw at likas sa modernong Tagalog.
- source_word: הַמַּגֵּפָה
  choice: salot
  rationale: Ang “salot” ang karaniwan at angkop na salin sa konteksto ng hatol.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili nito ang nakaugaliang tipanang katawagang “mga anak ni Israel,” ngunit iniiwasan ang di-likas na literal na spatial na pariralang “mula sa ibabaw.”
- source_word: אִישׁ יִשְׂרָאֵל
  choice: lalaking Israelita
  rationale: Pinananatili nito kapuwa ang tahasang pagkalalaki ng indibidwal at ang kaniyang pagkakakilanlang Israelita.
theological_decisions:
- issue: Ang panlahatang katawagang may kasariang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanang Israel
  rationale: Pinananatili ang anyo ng karaniwang tipanang katawagan sa Hebreo. Sa konteksto, maaari nitong tukuyin ang buong bayan, hindi lamang ang mga lalaking anak.
- issue: Marahas at tiyak na detalyeng anatomikal sa tagpo ng paghatol
  choice: hanggang sa tiyan ng babae
  alternative: hanggang sa puson ng babae / sa kaniyang tiyan
  rationale: Hindi pinalalambot ang kongkretong detalye ng Hebreo at hindi rin dinaragdagan ang karahasan. Ang “tiyan” ay mas karaniwan at hindi gaanong klinikal kaysa “abdomen.”
- issue: Ugnayan ng pariralang אֶל קֳבָתָהּ sa pagkakulos sa kanilang dalawa
  choice: Pinanatiling tumutukoy sa tiyan ng babae, nang hindi tahasang nilulutas ang eksaktong landas ng sandata
  alternative: tumusok sa katawan ng lalaki at umabot sa tiyan ng babae
  rationale: Sinasabi ng teksto na kapuwa sila inulos at saka binabanggit ang tiyan ng babae, ngunit hindi nito tahasang inilalarawan ang buong direksiyon o ayos ng pagtagos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “inulos” para sa kongkreto ngunit hindi pinalabis na paglalarawan ng karahasan; pinanatili ang “mga anak ni Israel” bilang biblikal at tipanang katawagan. Ang “Sa gayon” ay natural na nag-uugnay sa bunga ng pangyayari nang hindi nagdaragdag ng tahasang teolohikal na paliwanag.
