  text: וְ/אַֽחֲרֵי כֵן֙ יָבֹ֣אוּ הַ/לְוִיִּ֔ם לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: tl
  text: Pagkatapos nito, lalapit ang mga Levita upang maglingkod sa Toldang Tipanan. Lilinisin[a] mo sila at ihahandog mo sila bilang handog na iniugoy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dadalisayin.” Ang pandiwang Hebreo ay tumutukoy rito sa ritwal na paglilinis.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, seremonyal silang ihaharap sa harap ng PANGINOON bilang handog na iniugoy.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Malinaw at likas na panandang temporal na nagpapanatili sa pagkakasunod-sunod ng mga ritwal.
- source_word: יָבֹאוּ
  choice: papasok
  rationale: Ang בוא ay maaaring mangahulugang ‘pumarito’ o ‘pumasok’; sa konteksto, tumutukoy ito sa paglapit o pagpasok ng mga Levita upang magsimula ng paglilingkod.
- source_word: הַ/לְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa pangkat mula sa lipi ni Levi na itinalaga sa paglilingkod sa santuwaryo.
- source_word: לַ/עֲבֹד
  choice: upang maglingkod
  rationale: Sa kontekstong kultiko, ang עבד ay tumutukoy sa paglilingkod o paggawa ng mga tungkulin sa santuwaryo, nang hindi sila tinatawag na mga pari.
- source_word: אֶת אֹהֶל מוֹעֵד
  choice: sa Toldang Tipanan
  rationale: Bagaman may tuwirang pananda ng layon sa Hebreo, ang diwa ay paglilingkod na kaugnay ng tolda; likas sa Tagalog ang ‘maglingkod sa.’ Ang ‘Toldang Tipanan’ ay malinaw at dignified na katawagan sa אֹהֶל מוֹעֵד.
- source_word: וְ/טִהַרְתָּ אֹתָם
  choice: Lilinisin mo sila
  rationale: Pinananatili ang ritwal na diwa ng טהר habang gumagamit ng salitang madaling maunawaan; nililinaw ng talababa na maaari rin itong isaling ‘dadalisayin.’
- source_word: וְ/הֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: at ihahandog sila bilang handog na itinatag
  rationale: Ang Hiphil ng נוף kasama ng תְּנוּפָה ay ritwal na pagtaas/pag-indayog at paghaharap sa harap ni Yahweh. Ang salin ay nagpapanatili sa kakaibang larawan na ang mga Levita mismo ang inihahandog, habang ang talababa ang nagpapaliwanag sa seremonyal na kilos.
theological_decisions:
- issue: Ritwal na wika sa pagtatalaga sa mga Levita
  choice: 'Panatilihin ang tiyak na wikang ritwal: ‘lilinisin’ at ‘handog na itinatag.’'
  alternative: ‘Dadalisisayin at ihaharap sila’ o ang pangkalahatang ‘itatalaga sila.’
  rationale: Inilalarawan ng talata ang mga partikular na seremonya sa santuwaryo, hindi lamang isang pangkalahatang paghirang. Hindi dapat alisin ang ritwal at paghahandog na larawan ng Hebreo.
- issue: Ang mga Levita bilang תְּנוּפָה
  choice: Sabihing ‘ihahandog sila’ upang panatilihing ang mga Levita mismo ang tuwirang layon ng ritwal.
  alternative: ‘Ihahandog ang isang handog para sa kanila.’
  rationale: Malinaw sa Hebreo na ‘sila’ ang iwinawagayway o seremonyal na inihaharap; ang alternatibo ay magbabago sa layon at diwa ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang ‘Toldang Tipanan’ bilang pamilyar na katawagan sa santuwaryo at iniwasan ang sobrang teknikal na parirala sa pangunahing teksto; inilagay sa talababa ang paliwanag sa ritwal na pagtaas o pag-indayog.
