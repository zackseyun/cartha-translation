  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: Nagsalita si Yahweh[a] kay Moises at sinabi niya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang pandiwang דּבר sa karaniwang pormula ng salaysay ay tuwirang isinasaling “nagsalita,” na natural at tumpak sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa taong kinausap; “kay Moises” ang malinaw at likas na anyo sa Tagalog.
- source_word: לֵאמֹר
  choice: at sinabi niya
  rationale: Ito ang karaniwang panimula sa tuwirang pahayag. Ang “at sinabi niya” ay natural sa Tagalog at malinaw na naghahanda sa susunod na sinabi, nang hindi ginagamit ang alanganing literal na “na sinasabi.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa pangalan sa halip na ipalit ang isang titulo; ipinababatid sa talababa ang tradisyonal na salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Inalis ang panimulang “At” sapagkat hindi ito kailangan upang katawanin ang karaniwang Hebreong pagkakasunod ng salaysay sa likas na Tagalog. Inilagay ang panandang [a] kaagad pagkatapos ng “Yahweh,” ang salitang tinutukoy ng talababa.
