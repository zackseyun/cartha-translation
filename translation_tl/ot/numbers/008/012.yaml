base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: tl
  text: Pagkatapos nito, ipapatong ng mga Levita ang kanilang mga kamay sa mga ulo ng mga toro. Ihandog mo ang isang toro bilang handog para sa kasalanan[a] at ang isa naman bilang handog na sinusunog para kay Yahweh, upang gumawa ng pagtubos para sa mga Levita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Sa mga tekstong tumatalakay sa paglilingkod ng mga pari, ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa handog na kaugnay ng kasalanan at ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: ipapatong ... ang kanilang mga kamay
  rationale: Sa konteksto ng paghahandog, tumutukoy ang סמך sa ritwal na pagpapatong ng mga kamay sa hayop; natural at tiyak sa Filipino ang “ipapatong ang kanilang mga kamay.”
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: sa mga ulo ng mga toro
  rationale: Bagaman isahan ang רֹאשׁ sa Hebreo, distributibo ang diwa nito para sa dalawang toro, kaya ginamit ang likas na anyong maramihan sa Filipino.
- source_word: וַעֲשֵׂה
  choice: Ihandog mo
  rationale: Isahan ang kausap sa pautos na pandiwa. Sa kontekstong pansakripisyo, higit na malinaw ang “ihandog” kaysa literal na “gawin.”
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Karaniwan at madaling maunawaang katawagan ito sa ritwal na handog, habang pinananatili sa talababa ang posibleng diwang paglilinis.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Ipinapahayag nito ang kinikilalang kahulugan ng עֹלָה bilang handog na sinusunog, nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang לְ sa pormula ng paghahandog ay natural na isinasalin na “para kay,” at ang banal na pangalan ay tuwirang isinaling “Yahweh.”
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: upang magbayad-sala para sa mga Levita
  rationale: Pinananatili ng “magbayad-sala” ang ritwal at teolohikal na bigat ng כפר nang hindi tinutukoy ang isang makitid na teorya ng pagbabayad-sala.
theological_decisions:
- issue: Pagkakasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; ang “Yahweh” ay mas malapit sa karaniwang rekonstruksiyon ng bigkas at pinananatili ang pangalang tipan.
- issue: Saklaw ng kahulugan ng חַטָּאת
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Kapuwa maaaring ipahiwatig ng terminong Hebreo ang kasalanan at ritwal na paglilinis. Ginamit sa teksto ang mas madaling makilalang katawagan, ngunit hindi inalis ang alternatibo at inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga Levita,” “mga toro,” at mga karaniwang katawagang pansakripisyo; pinanatili ang ikalawang panauhang isahan sa “Ihandog mo” at iniwasang lutasin nang palihim ang ambiguwidad ng חַטָּאת.
