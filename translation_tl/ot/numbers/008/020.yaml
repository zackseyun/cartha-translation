base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: tl
  text: Kaya ginawa nina Moises at Aaron, kasama ng buong kapulungan ng mga anak ni Israel[a], sa mga Levita ang lahat ng iniutos ni Yahweh kay Moises tungkol sa mga Levita. Gayon ang ginawa ng mga anak ni Israel sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel,” isang karaniwang katawagan sa sambayanang kabilang sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: ginawa
  rationale: Malawak ang kahulugan ng עשה (“gawin/lumikha”). Dito, tumutukoy ito sa pagsasagawa ng mga naunang tagubilin para sa mga Levita; pinananatili ng “ginawa” ang pangkalahatang diwa nang hindi nililimitahan sa isang partikular na ritwal.
- source_word: עֲדַת
  choice: kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanang tipan. Ang “kapulungan” ay natural at marangal na katawagan sa organisadong buong sambayanan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang Hebreong katawagang pampamilya para sa mga inapo ni Israel. Nililinaw sa talababa ang mas natural na alternatibong “mga Israelita.”
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Itinatakda ng ל ang mga Levita bilang pinatutungkulan ng isinagawang mga utos. Sapat na malawak ang “sa” upang hindi ito pakahulugang para lamang sa kanilang kapakinabangan.
- source_word: כְּכֹל אֲשֶׁר
  choice: ayon sa lahat ng
  rationale: Ipinapahayag nito ang ganap na pagsunod sa kabuuan ng iniutos; pinananatili ng “ayon sa lahat ng” ang lakas ng כֹל.
- source_word: צִוָּה
  choice: iniutos
  rationale: Natural na ipinahihiwatig ng aspektong naganap na nauna ang utos ni Yahweh sa pagsasagawa nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalan ng Diyos sa halip na palitan iyon ng isang titulo.
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: kay Moises tungkol sa mga Levita
  rationale: Ipinakikita ng pagkakabuo na ang utos kay Moises ay may kinalaman sa mga Levita; malinaw at natural sa Filipino ang “tungkol sa mga Levita.”
- source_word: כֵּן
  choice: gayon nga
  rationale: Muling idiniriin ng כֵּן na ang ginawa ng mga Israelita ay tumugma sa iniutos; ipinahahayag ng “gayon nga” ang pagtutugmang iyon.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Korporatibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang pampamilyang larawan ng Hebreo nang hindi ipinapalagay na mga lalaking anak lamang ang tinutukoy; ibinibigay sa talababa ang natural na katumbas na tumutukoy sa buong sambayanan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “ginawa” at “mga anak ni Israel” upang maipakita ang diin ng Hebreo sa eksaktong pagsunod, habang ginamit ang “kapulungan” para sa pormal na katawagan sa buong sambayanan.
