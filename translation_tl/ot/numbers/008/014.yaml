source:
  edition: WLC
  text: וְ/הִבְדַּלְתָּ֙ אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: tl
  text: Kaya ibubukod mo[a] ang mga Levita mula sa mga anak ni Israel[b], at ang mga Levita ay magiging akin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ihihiwalay mo.”
    reason: lexical_alternative
  - marker: b
    text: O “mga Israelita”; sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: c
    text: O “mapapabilang sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: Kaya ibubukod mo
  rationale: Ang Hiphil ng בדל ay nangangahulugang ihiwalay o ibukod. Ang “ibubukod” ay natural sa makabagong Filipino at angkop sa konteksto ng pagtatakda ng isang pangkat para sa natatanging tungkulin. Ipinahihiwatig ng “Kaya” ang sunod na hakbang sa pamamaraan.
- source_word: אֶת הַלְוִיִּם
  choice: ang mga Levita
  rationale: Tuwirang layon ito na may tiyak na pangngalang maramihan. Ang “mga Levita” ang karaniwan at malinaw na tawag sa mga kabilang sa lipi ni Levi.
- source_word: מִתּוֹךְ
  choice: mula sa
  rationale: Ipinahihiwatig nito ang paghihiwalay ng isang pangkat mula sa loob ng mas malaking pangkat. Kasama ng “mga anak ni Israel,” malinaw at natural sa Filipino ang “mula sa.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawang pampamilya ng Hebreong “mga anak ni Israel” sa halip na gawing pangkalahatang katawagang “mga Israelita.”
- source_word: וְהָיוּ לִי
  choice: at ... ay magiging akin
  rationale: Tuwirang ipinahahayag ng parirala ang pagiging pag-aari o natatanging pagkamay-ari ng Diyos. Hindi nito idinaragdag ang mas tiyak na ideya ng pagtatalaga na hindi tahasang nakasaad sa parirala.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Inuulit ang pangngalan gaya sa Hebreo upang mapanatili ang diin, sa halip na palitan ito ng panghalip.
theological_decisions:
- issue: Kung ang katayuan ng mga Levita ay isasalin bilang pag-aari o bilang tahasang pagtatalaga sa banal na paglilingkod
  choice: ang mga Levita ay magiging akin
  alternative: ang mga Levita ay itatalaga sa akin
  rationale: Ang לִי kasama ng היה ay tuwirang nagsasaad ng pagiging para sa Diyos o pag-aari niya. Bagaman tungkol sa banal na paglilingkod ang mas malawak na konteksto, walang tahasang salitang “italaga” sa talatang ito, kaya pinananatili ang payak ngunit matimbang na pahayag ng pagkamay-ari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “ang mga Levita” at ang pampamilyang pariralang “mga anak ni Israel” upang maipakita ang anyo at diin ng Hebreo nang hindi nagiging di-likas ang pangungusap.
