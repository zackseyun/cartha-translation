translation:
  language: tl
  text: Magsalita ka kay Aaron at sabihin mo sa kanya, ‘Kapag inayos mo ang mga ilawan[a], ang pitong ilawan ay magbibigay ng liwanag patungo sa harapan ng patungan ng mga ilawan.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kapag sinindihan mo ang mga ilawan.” Literal na nangangahulugang “paakyatin” ang pandiwang Hebreo; sa kontekstong ito, maaari itong tumukoy sa pagsisindi ng mga ilawan o sa pag-aayos ng mga ito upang tumanglaw sa harap.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֵלָיו
  choice: Kausapin mo ... at sabihin mo sa kanya
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na pandiwa ng pormal na pormula ng pagsasalita sa Hebreo.
- source_word: בְּהַעֲלֹתְךָ
  choice: Kapag inayos mo
  rationale: Ang Hiphil ng עלה ay literal na ‘paakyatin’ o ‘itaas,’ ngunit sa konteksto ng mga ilawan maaari itong tumukoy sa paglalagay o pag-aayos ng mga ito upang tumanglaw. Hindi nito labis na nililinaw kung pagsisindi o pagpoposisyon ang pangunahing diwa; inilalahad sa talababa ang alternatibo.
- source_word: הַנֵּרֹת
  choice: mga ilawan
  rationale: Ang נֵר ay kongkretong ilawan, hindi lamang abstraktong liwanag; natural ito sa konteksto ng kagamitan sa tabernakulo.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: sa dakong harapan ng patungan ng ilawan
  rationale: Ipinahahayag nito ang direksiyon ng liwanag patungo sa bahaging nasa harap ng patungan, habang iniiwasan ang di-natural na literal na ‘katapat ng mukha.’
- source_word: יָאִירוּ
  choice: magbibigay-liwanag
  rationale: Sinasalamin nito ang causative na diwa ng Hiphil ng אור, hindi lamang ang simpleng ‘liliwanag.’
- source_word: שִׁבְעַת הַנֵּרוֹת
  choice: ang pitong ilawan
  rationale: Tuwirang katumbas ng construct numeral phrase nang walang idinagdag na ‘lahat.’
- source_word: הַמְּנוֹרָה
  choice: patungan ng ilawan
  rationale: Isinasalin ang kahulugan ng kultikong kagamitan sa malinaw na modernong Filipino sa halip na transliterahin bilang ‘menorah.’
