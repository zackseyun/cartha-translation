  source_fidelity: Tumpak ang pangunahing diwa at napapanatili ng talababa ang leksikal na ambiguwidad ng בְּהַעֲלֹתְךָ. Gayunman, ang “sa dakong harapan” ay higit na nagsasaad ng lokasyon kaysa ng direksiyong ipinahihiwatig ng אֶל מוּל פְּנֵי; dapat ipahayag na ang mga ilawan ay tatanglaw patungo sa harapan ng patungan.
  naturalness: Natural sa pangkalahatan, ngunit mas malinaw at mas marangal na modernong Filipino ang “Magsalita ka kay Aaron” para sa unang pandiwa ng pormulang Hebreo. Mas likas din ang “magbibigay ng liwanag” kaysa sa tambalang “magbibigay-liwanag.”
  terminology: Ang “mga ilawan” at “patungan ng mga ilawan” ay malinaw na mga salin ng נֵר at מְנוֹרָה. Pinananatili ng “ayusin” ang hindi pa nalulutas na saklaw ng pandiwa—paglalagay/pag-aayos o pagsisindi—na wastong ipinaliliwanag sa talababa.
