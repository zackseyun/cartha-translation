    rationale: Ang אֶל sa אֶל מוּל פְּנֵי ay tumutukoy sa pagtanglaw patungo sa/tungo sa harapan, hindi lamang sa liwanag na nasa isang lugar sa harapan.
  - severity: low
    issue: Bahagyang di-natural ang “magbibigay-liwanag.”
    rationale: Mas karaniwan sa modernong Filipino ang “magbibigay ng liwanag,” habang napapanatili ang causative na saysay ng יָאִירוּ.
