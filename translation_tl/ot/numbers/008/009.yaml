id: NUM.8.9
reference: Numbers 8:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: tl
  text: Pagkatapos, ihaharap mo ang mga Levita sa harap ng toldang tagpuan, at titipunin mo ang buong kapulungan ng mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Pagkatapos, ihaharap mo
  rationale: Ang Hiphil ng קרב ay nangangahulugang maglapit o magharap. Sa ritwal na konteksto, natural sa Filipino ang “ihaharap,” at ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod ng mga tagubilin.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang tawag sa mga kabilang sa lipi ni Levi na itinalaga sa paglilingkod sa santuwaryo.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Tuwirang ipinapahayag ang kinalalagyan sa unahan o presensiya ng isang lugar, at angkop ito sa pormal na ritwal na tagpo.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tagpuan
  rationale: Pinananatili nito ang larawan ng isang tolda at ang diwa ng מוֹעֵד bilang itinakdang tagpuan o lugar ng pakikipagtagpo, nang hindi ipinapasok ang salitang “tipan,” na wala sa pariralang Hebreo.
- source_word: וְהִקְהַלְתָּ
  choice: at titipunin mo
  rationale: Ang Hiphil ng קהל ay tumutukoy sa pagpapakatipon ng isang pangkat. Natural at malinaw sa makabagong Filipino ang “titipunin.”
- source_word: כָּל עֲדַת
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan ng Israel; ipinapahayag ng “buong” ang כָּל, at ng “kapulungan” ang pormal at pampamayanang diwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang tahasang ugnayang pampamilya sa pariralang Hebreo, habang nananatiling likas at nauunawaan sa Filipino.
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Bagaman tumutukoy ang parirala sa sambayanan ng Israel sa kabuuan, tahasang “mga anak ni Israel” ang anyo ng Hebreo. Pinanatili ito sa pangunahing teksto, at inilagay sa talababa ang mas idyomatikong katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “toldang tagpuan” upang maging tapat sa אֹהֶל מוֹעֵד at maiwasang ipakahulugan ang מוֹעֵד bilang “tipan.”
