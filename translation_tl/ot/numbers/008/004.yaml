base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: tl
  text: 'Ganito ang pagkakayari ng patungan ng ilawan: gawang ginto na hinubog sa pagpukpok[a]; mula sa paanan nito hanggang sa bulaklak nito, hinubog ito sa pagpukpok. Ayon sa anyong ipinakita ni Yahweh kay Moises[b], gayon niya ginawa ang patungan ng ilawan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gawang binayo” o “gawang pinukpok.” Binibigyang-diin ng Hebreo na hinubog ang patungan sa pamamagitan ng pagpukpok; maaari rin itong maunawaan na yari sa iisang piraso.
    reason: lexical_alternative
  - marker: b
    text: Ang “ayon sa anyo” ay maaari ring isaling “ayon sa huwarang ipinakita” o “ayon sa pangitaing ipinakita” ni Yahweh kay Moises.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: pagkakayari
  rationale: Tumutukoy sa paraan at resulta ng masining na paggawa sa patungan ng ilawan; natural at malinaw sa modernong Filipino.
- source_word: הַמְּנֹרָה
  choice: patungan ng ilawan
  rationale: Isinasalin ang karaniwang bagay sa halip na hiraming 'menorah'; ipinahihiwatig na ito ang tayuan ng mga ilawan.
- source_word: מִקְשָׁה
  choice: pinukpok / pinukpok ang pagkakayari
  rationale: Pinananatili ang dalawang paglitaw at ang diin sa paghubog ng metal sa pamamagitan ng pagpukpok; hindi isinasara ang posibilidad na ito ay iisang piraso.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katawagan sa materyal.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: mula sa paanan nito hanggang sa bulaklak nito
  rationale: Ang יָרֵךְ ay tumutukoy rito sa ibabang bahagi o base, at ang פֶּרַח sa palamuting hugis-bulaklak; natural sa Filipino ang pares na 'mula...hanggang.'
- source_word: כַּמַּרְאֶה
  choice: ayon sa anyo
  rationale: Mas malapit sa malawak na saklaw ng מַרְאֶה kaysa sa mas interpretatibong 'disenyo'; maaari itong tumukoy sa anyo, huwaran, o pangitaing ipinakita.
- source_word: הֶרְאָה
  choice: ipinakita
  rationale: Tumpak na ipinapahayag ang causative na anyo ng ראה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa tekstong Hebreo.
- source_word: כֵּן עָשָׂה
  choice: ginawa niya ... ayon sa
  rationale: Pinananatili ang aktibong pandiwa at di-tiyak na panlalaking gumagawa, habang inaayos ang ayos ng pangungusap para sa likas na Filipino.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah / PANGINOON
  rationale: Direktang kinakatawan ang personal na pangalan sa Hebreo nang hindi pinapalitan ng titulo.
- issue: Di-binanggit na simuno ng עָשָׂה
  choice: ginawa niya
  alternative: ginawa ito
  rationale: Aktibo at isahan ang pandiwang Hebreo, ngunit hindi pinapangalanan ang gumagawa; pinananatili ng 'niya' ang di-tiyak na taong tinutukoy ng konteksto.
- issue: Kahulugan ng כַּמַּרְאֶה
  choice: ayon sa anyo
  alternative: ayon sa huwaran / ayon sa pangitain
  rationale: Pinananatili ang leksikal na kaluwagan at hindi tahimik na nilulutas kung modelo, nakitang anyo, o pangitain ang eksaktong tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'patungan ng ilawan' sa halip na transliterasyong 'menorah,' at pinanatili ang pag-uulit ng ideya ng pagpukpok. Inilipat ang marker [b] pagkatapos ng buong sugnay upang malinaw na tumukoy sa 'ayon sa anyo' at sa ipinakitang anyo kay Moises.
