lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang wayyiqtol ng דבר ay nagpapakilala sa kasunod na pangyayari sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos, nagsalita” upang ipakita ang pagkakasunod-sunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay tumutukoy sa taong kinakausap; “kay” ang natural na anyo bago ang pangalang Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakagawiang anyo ng pangalang Hebreo sa modernong Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na literal na nag-uugnay sa pandiwang “nagsalita” sa tuwirang pahayag sa susunod na talata.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa banal na pangalan at hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pormal na hulma ng Hebreo na “nagsalita … na sinasabi,” bagaman bahagya itong mas pormal kaysa karaniwang usapan, dahil ipinagpapatuloy nito ang pahayag sa susunod na talata.
