  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: tl
  text: Patatayuin mo ang mga Levita sa harap ni Aaron at ng kanyang mga anak na lalaki, at ihaharap mo sila bilang handog na iniwawagayway para kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “iwawagayway mo sila bilang handog na iniwawagayway para kay Yahweh.” Magkaugnay na pandiwa at pangngalan ang ginagamit sa Hebreo para sa ritwal na pagkaway o paghaharap ng handog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Patatayuin mo
  rationale: 'Ang Hiphil ng עמד ay sanhiang anyo: papatayuin o ilalagay sa takdang puwesto. Ang “patatayuin” ay natural sa Filipino at pinananatili ang kongkretong larawan ng mga Levita na inilalagay sa harap ng mga pari.'
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa pangkat ng lipi; ipinahahayag ng “ang mga” ang tiyak at maramihang anyo.
- source_word: לִפְנֵי
  choice: sa harap ni/ng
  rationale: Ipinahahayag nito ang pisikal at pormal na paglalagay sa presensiya nina Aaron at ng kanyang mga anak.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Ginamit ang kinaugaliang anyo ng pangalan sa Filipino.
- source_word: בָנָיו
  choice: mga anak niyang lalaki
  rationale: Tiyak na mga anak na lalaki ni Aaron ang tinutukoy, na naglilingkod bilang mga pari; pinanatili ang kasarian ng salitang Hebreo.
- source_word: וְהֵנַפְתָּ
  choice: ihaharap mo
  rationale: Sa kontekstong ritwal, ang Hiphil ng נוף ay tumutukoy sa seremonyal na pagtaas, paggalaw, o paghaharap ng handog. Ang “ihaharap” ay malinaw kapag mga tao ang tuwirang layon, habang ipinapaliwanag sa talababa ang literal na pag-uulit sa Hebreo.
- source_word: אֹתָם
  choice: sila
  rationale: Tuwirang layon na tumutukoy sa mga Levita.
- source_word: תְּנוּפָה
  choice: bilang handog na itinatanghal
  rationale: Pinananatili nito ang teknikal na uri ng ritwal na תְּנוּפָה nang hindi lumilikha ng nakalilitong larawan ng mga taong literal na iwinawagayway.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang ל ay nagpapahiwatig ng pinatutunguhan o pinag-uukulan ng paghaharap. Ang pantukoy na “kay” ay natural sa Filipino sapagkat personal na pangalan ang Yahweh.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Paglalarawan sa ritwal na ginawa sa mga Levita
  choice: ihaharap mo sila bilang handog na itinatanghal
  alternative: iwawagayway mo sila bilang handog na iwinawagayway
  rationale: Magkasamang ginagamit sa Hebreo ang pandiwang נוף at pangngalang תְּנוּפָה. Ipinahahayag ng pangunahing salin ang pormal na ritwal nang malinaw sa modernong Filipino, at pinananatili ng talababa ang mas literal at sadyang paulit-ulit na pagkakabuo ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga anak niyang lalaki” para sa likas ngunit tumpak na pagtukoy sa mga lalaking anak ni Aaron. Ang “Pagkatapos” ay nagpapalinaw sa sunod na kilos na ipinahihiwatig ng magkasunod na sugnay, nang hindi binabago ang ugnayan ng mga ito.
