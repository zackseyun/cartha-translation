  naturalness: Natural ang “Patatayuin mo” at “sa harap ni Aaron.” Mas tuwiran at mas malapit sa pinagmulang teksto ang pag-uugnay sa ikalawang sugnay sa pamamagitan ng “at,” sa halip na “Pagkatapos.” Ang “handog na iniwawagayway” ay mas malinaw na nagpapahayag ng ritwal na termino kaysa “handog na itinatanghal.”
  terminology: Ang “Levita,” “Aaron,” “mga anak na lalaki,” at “Yahweh” ay angkop. Pinanatili ang magkakaugnay na pandiwa at pangngalang ritwal ng נוף / תְּנוּפָה sa pamamagitan ng “iharap” at “handog na iniwawagayway,” na may talababa para sa mas literal na pag-uulit.
