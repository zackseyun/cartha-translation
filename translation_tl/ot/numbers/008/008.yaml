  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: tl
  text: 'Pagkatapos, kukuha sila ng isang batang toro, kasama ang handog nitong butil: pinong harina na hinaluan ng langis. Kukuha ka rin ng ikalawang batang toro bilang handog para sa kasalanan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa ritwal na paglilinis.” Sa mga ritwal na pansaserdote, ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa handog para sa kasalanan o sa handog para sa ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Pagkatapos, kukuha sila
  rationale: Ang waw na kasunod ng perpektong pandiwa ay bahagi ng sunod-sunod na tagubiling panritwal. Ipinahahayag ng “Pagkatapos” ang pagkakasunod, at ng aspektong panghinaharap ng “kukuha” ang bisa ng utos sa natural na Filipino.
- source_word: פַּר בֶּן בָּקָר
  choice: isang batang toro
  rationale: Ang literal na idyomang “toro, anak ng bakahan” ay tumutukoy sa batang toro. Ang “isang” ay nilinaw upang itangi ito sa ikalawang toro na kasunod.
- source_word: וּמִנְחָתוֹ
  choice: at ng handog na pagkaing butil na kasama nito
  rationale: Sa kontekstong pansakripisyo, ang מִנְחָה ay handog na yari sa butil. Ang hulaping panlalaking isahan ay tumutukoy sa unang toro; ang “na kasama nito” ay natural na naghahayag na ito ang kalakip na handog ng toro.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwang terminong pangkulto para sa mahusay o pinong giniling na harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: na hinaluan ng langis
  rationale: Malinaw at likas na Filipino ito para sa karaniwang pormula ng paghahanda ng handog, nang hindi nawawala ang diwang panritwal.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: Kukuha ka rin ng ikalawang batang toro
  rationale: Pinananatili ng “ka” ang paglipat ng Hebreo mula sa maramihang ikatlong panauhan tungo sa isahang ikalawang panauhan. Ang “ikalawa” ay tuwirang katumbas ng ordinal na שֵׁנִי.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa batas pansaserdote, ang חַטָּאת ay katawagan sa sakripisyong tradisyonal na tinatawag na handog para sa kasalanan, bagaman maaari ring idiin ng termino ang tungkulin nitong maglinis; inilagay sa talababa ang alternatibo.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Pinananatili sa pangunahing teksto ang pamilyar at leksikal na wastong katawagan, ngunit hindi ipinagpapalagay na kasalanan lamang ang ritwal na diin. Ang alternatibong “paglilinis” ay inilalahad sa talababa upang mapanatili ang tunay na lawak ng terminong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “handog na pagkaing butil” upang maging madaling maunawaan ngunit tiyak sa kontekstong pansakripisyo. Pinanatili ang kapansin-pansing pagbabago mula “sila” tungo sa “ka” sa tekstong Hebreo.
