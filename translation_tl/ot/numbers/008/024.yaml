base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: tl
  text: 'Ito ang tuntunin para sa mga Levita: mula sa edad na dalawampu''t lima pataas, ang bawat isa ay papasok upang tumupad ng tungkulin[a] sa paglilingkod sa Tolda ng Tipanan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang magsagawa ng paglilingkod” o “upang maglingkod.” Ang Hebreong parirala ay idyoma para sa pagtupad ng organisadong tungkulin o paglilingkod at may mga pahiwatig na militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: Ito ang tuntunin para sa mga Levita
  rationale: Ang parirala ay nagpapakilala ng regulasyong nauukol sa mga Levita. Natural sa makabagong Tagalog ang “tuntunin para sa” at pinananatili nito ang legal at panturong diwa.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula sa edad na dalawampu't lima pataas
  rationale: Malinaw at likas na ipinahahayag nito ang pinakamababang edad na itinakda ng Hebreong idyoma.
- source_word: יָבוֹא
  choice: ang bawat isa ay papasok
  rationale: Isahan ang pandiwa sa Hebreo bagaman pangkat ang tinutukoy. Ipinahahayag ng “ang bawat isa” ang distributibong isahan nang natural at walang di-kinakailangang pagtakda sa kasarian.
- source_word: לִצְבֹא צָבָא
  choice: upang gampanan ang tungkulin
  rationale: Idyoma ito ng pagpasok sa organisadong paglilingkod o pagtupad ng tungkulin, na may bahagyang himig-militar. Pinananatili ng saling ito ang pormal na diwa nang hindi ipinahihiwatig na pakikidigma ang gawain.
- source_word: בַּעֲבֹדַת
  choice: sa paglilingkod sa
  rationale: Ang עֲבֹדָה rito ay tumutukoy sa nakatalagang gawain o paglilingkod kaugnay ng santuwaryo.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Karaniwan at maikli itong salin ng katawagan sa tabernakulo; ipinahihiwatig ng מוֹעֵד ang itinakdang pakikipagtagpo sa Diyos, hindi lamang isang karaniwang pulungan.
theological_decisions:
- issue: Isahang pandiwa kasunod ng kolektibong paksa
  choice: ang bawat isa ay papasok
  alternative: papasok sila
  rationale: Isahan ang Hebreong יָבוֹא sa tagubiling para sa mga Levita bilang pangkat. Pinananatili ng distributibong “ang bawat isa” ang anyong isahan at nililinaw na nalalapat ang tuntunin sa bawat Levita.
- issue: Larawang militar sa לִצְבֹא צָבָא
  choice: gampanan ang tungkulin
  alternative: maglingkod / pumasok sa hanay ng paglilingkod
  rationale: May himig ng organisadong tungkulin o paglilingkod ang idyoma, ngunit ang konteksto ay serbisyo sa santuwaryo. Hindi ito isinaling “makipagdigma” upang maiwasang gawing literal ang larawang militar.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Tagalog. Ginamit ang “toldang tipanan” bilang maikli at pamilyar na katawagan, at iniwasan ang sobrang literal na saling magmumukhang tungkuling pandigma.
