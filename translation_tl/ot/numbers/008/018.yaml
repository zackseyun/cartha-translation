base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: tl
  text: At kinuha ko ang mga Levita bilang kapalit ng bawat panganay sa mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga Israelita.” Sa Hebreo, “sa mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: At kinuha ko
  rationale: Ang Qal wayyiqtol na unang panauhang isahan ng לקח ay karaniwang nangangahulugang “at kinuha ko.” Pinananatili nito ang tuwirang diwa ng pandiwa nang hindi dinaragdagan ng interpretasyong “pinili” o “tinanggap.”
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Tiyak na pangngalang maramihan ito na tumutukoy sa mga kabilang sa lipi ni Levi; “mga Levita” ang natural at tumpak na katawagan sa Filipino.
- source_word: תַּחַת
  choice: bilang kapalit ng
  rationale: Nagsasaad dito ng pagpapalit o paghalili, hindi ng lokasyong “sa ilalim ng.” Nililinaw ng “bilang kapalit ng” ang tungkuling kumatawan ng mga Levita.
- source_word: כָּל בְּכוֹר
  choice: bawat panganay
  rationale: 'Dahil isahan ang בְּכוֹר, distributibo ang כָּל: bawat isang panganay. Hindi idinagdag ang “lalaki” sapagkat wala iyon sa mismong pariralang Hebreo ng talata.'
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang literal na ekspresyong “mga anak ni Israel,” habang natural na ipinahahayag ng “sa” ang diwang kabilang o nasa gitna ng pangkat.
theological_decisions:
- issue: Paglilipat ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang Hebreo ay tahasang “mga anak ni Israel.” Pinananatili ito sa pangunahing teksto upang maging tapat sa anyo ng pinagmulan, bagaman ang parirala ay pangkalahatang tumutukoy sa bayang Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bilang kapalit ng” para sa natural na pagpapahayag ng pagpapalit, at pinanatili ang tradisyonal ngunit madaling maunawaang “mga Levita” at “mga anak ni Israel.”
