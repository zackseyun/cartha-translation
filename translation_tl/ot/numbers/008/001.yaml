  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh kay Moises at sinabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, at ang דּבר ay likas na isinasaling “nagsalita.” Pinananatili ng “At” ang payak na daloy ng Hebreong salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa kinausap; “kay Moises” ang natural na katumbas sa modernong Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa mismong pananalitang susunod, nang hindi ito ipinapaloob sa naunang pandiwa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormal na hulma ng pormulang pagsasalita sa Hebreo; bagaman mas karaniwan sa Tagalog ang “Sinabi ni Yahweh kay Moises,” ang bersiyong ito ay nagpapakita ng pagkakaiba ng וַיְדַבֵּר at לֵאמֹר.
