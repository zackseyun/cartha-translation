id: NUM.8.3
reference: Numbers 8:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ כֵּן֙ אַהֲרֹ֔ן אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה הֶעֱלָ֖ה נֵרֹתֶ֑י/הָ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: tl
  text: 'Gayon ang ginawa ni Aaron: inilagay niya ang mga ilawan nito[b] patungo sa harapan ng patungan ng ilawan[a], gaya ng iniutos ni Yahweh kay Moises.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tapat ng harapan ng” o “nakaharap sa harapan ng” patungan ng ilawan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sinindihan niya ang mga ilawan nito.” Ang pandiwang Hebreo ay literal na may diwang “pinaakyat” at, kapag ginagamit tungkol sa mga ilawan, maaaring tumukoy sa paglalagay o paghahanda ng mga ito, o sa pagsindi sa mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  choice: At gayon nga ang ginawa ni Aaron
  rationale: Likas na idyomang Filipino ito para sa pagsunod ni Aaron sa naunang tagubilin, at pinananatili ang pabalik na pagtukoy ng כֵּן.
- source_word: אֶל מוּל פְּנֵי
  choice: nakaharap sa gawing harapan ng
  rationale: Ipinahihiwatig ng parirala ang direksiyon o pagkakatuon sa harapan, nang hindi labis na tinutukoy ang eksaktong ayos sa espasyo.
- source_word: הַמְּנוֹרָה
  choice: patungan ng ilawan
  rationale: Malinaw at karaniwang salin sa modernong Filipino para sa menorah bilang kagamitang pinapatungan ng mga ilawan; hindi kailangang hiramin ang transliterasyong Hebreo.
- source_word: הֶעֱלָה
  choice: inilagay niya
  rationale: Sa kontekstong ito, maaaring tumukoy ang Hiphil ng עלה sa paglalagay o paghahanda ng mga ilawan, bagaman posible rin ang pagsindi; pinananatili sa talababa ang leksikal na alternatibo.
- source_word: נֵרֹתֶיהָ
  choice: ang mga ilawan nito
  rationale: Konkretong tinutukoy ng נֵר ang mga ilawang nakakabit o kaugnay ng patungan, at ang hulaping pambabaeng isahan ay tumutukoy sa patungan ng ilawan.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Ipinapahayag nito ang eksaktong pagsunod sa utos ng Diyos; natural sa Filipino ang aspektong naganap na “iniutos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang ginagamit sa Hebreo; ang “Yahweh” ay malapit na transliterasyon at hindi ito pinapalitan ng titulong maaaring magkubli sa pagkakaiba.
- issue: Kahulugan ng הֶעֱלָה kaugnay ng mga ilawan
  choice: inilagay niya
  alternative: sinindihan niya
  rationale: Binibigyang-diin ng agarang konteksto ang ayos at direksiyon ng mga ilawan, ngunit tunay na posible ang kahulugang pagsindi; kaya hindi inaalis ang alternatibo at inilalagay ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “patungan ng ilawan” sa halip na “menorah,” at pinanatili sa mga talababa ang tunay na kalabuan tungkol sa direksiyon at sa paglalagay o pagsindi ng mga ilawan.
