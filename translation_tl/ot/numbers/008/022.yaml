revisions:
- from: At pagkatapos nito, pumasok ang mga Levita upang gampanan ang kanilang paglilingkod sa tolda ng pagpupulong sa harap ni Aaron at ng kanyang mga anak. Kung ano ang iniutos ni Yahweh kay Moises tungkol sa mga Levita, iyon ang ginawa nila para sa mga ito.[a]
  to: At pagkatapos nito, dumating ang mga Levita upang gampanan ang kanilang paglilingkod sa tolda ng pagpupulong sa harap ni Aaron at ng kanyang mga anak. Gaya ng iniutos ni Yahweh kay Moises tungkol sa mga Levita, gayon ang ginawa nila para sa kanila.[a]
