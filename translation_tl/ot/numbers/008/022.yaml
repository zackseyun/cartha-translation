base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: tl
  text: At pagkatapos nito, dumating ang mga Levita upang gampanan ang kanilang paglilingkod sa tolda ng pagpupulong sa harap ni Aaron at ng kanyang mga anak. Gaya ng iniutos ni Yahweh kay Moises tungkol sa mga Levita, gayon ang ginawa nila para sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “gayon ang ginawa nila sa kanila.” Maikli ang pahayag sa Hebreo at maaaring tumukoy sa pagsasagawa sa mga Levita ng mga itinakdang ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: At pagkatapos nito
  rationale: Pinananatili ang pang-ugnay at malinaw na ipinahihiwatig ang sunod na yugto matapos ang naunang mga ritwal.
- source_word: בָּאוּ
  choice: pumasok
  rationale: Sa konteksto ng paglapit upang maglingkod sa tolda, natural sa Tagalog ang “pumasok,” bagaman ang salitang Hebreo ay karaniwang nangangahulugang “dumating” o “pumaroon.”
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa Tagalog para sa pangkat na ito; pinananatili ang tiyak na pantukoy.
- source_word: לַעֲבֹד אֶת עֲבֹדָתָם
  choice: upang gampanan ang kanilang paglilingkod
  rationale: Inihahayag ang layunin at ang gawaing panrelihiyon nang hindi inuulit nang alanganin ang magkaugnay na pandiwa at pangngalan sa Hebreo.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa tolda ng pagpupulong
  rationale: Direkta at nakaugaliang salin ng pangalan ng santuwaryo; ang “sa” ay likas sa Tagalog at hindi labis na nagtatakda kung nasa loob o sa nasasakupan nito.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: sa harap ni Aaron at ng kanyang mga anak
  rationale: Pinananatili ang kongkretong diwa ng לִפְנֵי nang hindi tahasang ipinapasok ang interpretasyong “sa ilalim ng pangangasiwa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inililipat sa titik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: עַל הַלְוִיִּם
  choice: tungkol sa mga Levita
  rationale: Dito, ang עַל ay nagpapakilala sa paksa o tinutukoy ng utos.
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: iyon ang ginawa nila para sa mga ito
  rationale: Pinananatili ang di-tahas na simuno at ang maikling panghalip na parirala; inilalagay sa talababa ang posibleng diwang “ginawa sa kanila.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Tinutukoy ng pangwakas na כֵּן עָשׂוּ לָהֶם
  choice: iyon ang ginawa nila para sa mga ito
  alternative: iyon ang ginawa nila sa mga ito
  rationale: Maikli at bahagyang malabo ang Hebreo tungkol sa eksaktong ugnayan ng kilos sa mga Levita. Pinananatili sa pangunahing teksto ang posibleng diwa ng kapakinabangan at itinatala sa talababa ang alternatibong tumutukoy sa mga ritwal na isinagawa sa kanila.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tolda ng pagpupulong” at “paglilingkod” bilang malinaw na mga katawagang angkop sa kontekstong pansantuwaryo; iniwasan ang labis na teknikal o denominasyonal na pananalita.
