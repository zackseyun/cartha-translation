  verdict: revise
  source_fidelity: Kailangang baguhin ang “pumasok,” dahil ang בָּאוּ ay simpleng “dumating”/“lumapit” at hindi nagsasaad ng pagpasok sa tolda. Ang kasunod na malabong כֵּן עָשׂוּ לָהֶם ay angkop na panatilihing hindi labis na ipinaliwanag, na may talababa para sa alternatibong pagbasa.
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “dumating ang mga Levita upang gampanan...” kaysa “pumasok.” Ang “Gaya ng iniutos ... gayon ang ginawa nila para sa kanila” ay marangal at malinaw, habang pinananatili ang maigsi at medyo malabong ugnayan ng pangwakas na panghalip.
  terminology: Ang “mga Levita,” “tolda ng pagpupulong,” “paglilingkod,” at “Yahweh” ay angkop at pare-pareho. Hindi kinakailangang baguhin ang mga ito.
  issues:
  - severity: medium
    issue: Ang “pumasok” ay mas tiyak kaysa sa Hebreong בָּאוּ.
    rationale: Ang pandiwa ay nangangahulugang “dumating” o “lumapit”; hindi nito tahasang sinasabing pumasok ang mga Levita sa tolda. Ang pagpasok ay lalo pang hindi dapat ipahiwatig, sapagkat ang pariralang kasunod ay nagsasaad ng layunin ng kanilang pagdating para sa paglilingkod.
  - severity: low
    issue: Ang “Kung ano ang ... iyon ang ...” ay hindi gaanong tuwirang tumutugma sa komparatibong כַּאֲשֶׁר ... כֵּן.
    rationale: Ang hulmang “Gaya ng ... gayon ...” ay mas malapit sa estruktura at mas natural sa pormal na Filipino.
