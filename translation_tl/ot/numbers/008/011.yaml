base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: tl
  text: Ihaharap ni Aaron ang mga Levita sa harap ni Yahweh bilang handog na itinatanghal[a], mula sa mga anak ni Israel[b], at sila ay magiging para sa paglilingkod kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Iindayog ni Aaron ang mga Levita bilang handog na iniindayog.” Magkaugnay ang pandiwa at ang katawagan sa handog sa Hebreo, at tumutukoy ang mga ito sa isang ritwal na paghaharap.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mula sa mga anak ni Israel” ay maaari ring mangahulugang “sa ngalan ng mga anak ni Israel,” anupat kumakatawan ang mga Levita sa Israel sa paglilingkod kay Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: ihaharap ... bilang handog na itinatanghal
  rationale: Magkaugnay ang pandiwa at pangngalan sa Hebreo at tumutukoy sa ritwal na paghaharap o pag-indayog ng handog. Ang “ihaharap” ay likas sa modernong Tagalog kapag mga tao ang tuwirang layon, samantalang pinananatili ng “handog na itinatanghal” ang ritwal na diwa.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang tawag sa Tagalog para sa pangkat na mula sa lipi ni Levi.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang inilalarawan ng parirala ang ritwal na nagaganap sa presensiya ni Yahweh.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  rationale: Pinananatili ang pangunahing diwa ng pinagmulan at ang literal na pormang “mga anak ni Israel,” habang inilalahad sa talababa ang posibleng diwang pagkatawan.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: at sila ay magiging nakalaan upang gampanan ang paglilingkod kay Yahweh
  rationale: Natural na ipinahahayag sa Tagalog ang kalalabasan at layunin ng ritwal. Ang “paglilingkod” ay angkop sa sagradong tungkulin sa santuwaryo, at hindi lamang pangkalahatang paggawa.
theological_decisions:
- issue: Ang mga Levita bilang תְּנוּפָה, isang ritwal na handog
  choice: ihaharap ... bilang handog na itinatanghal
  alternative: iindayog ... bilang handog na iniindayog
  rationale: Pinananatili ang kategorya ng ritwal na handog nang hindi ipinahihiwatig na papatayin o literal na ihahain ang mga Levita. Iniiwasan din ng pangunahing salin ang posibleng katawa-tawang larawan ng pisikal na pag-indayog sa buong pangkat.
- issue: Kahulugan ng מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  alternative: sa ngalan ng mga anak ni Israel
  rationale: Ang parirala ay maaaring magpahiwatig ng pinagmulan o ng pagkatawan. Pinananatili sa pangunahing teksto ang mas tuwirang diwa ng “mula sa,” at inilalahad sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “Yahweh” para sa banal na pangalan, “mga Levita” bilang karaniwang pangkat-etnikong katawagan, at “paglilingkod” para sa sagradong tungkulin. Pinanatili ang bahagyang pormal na “mga anak ni Israel” upang maipakita ang anyo ng Hebreo.
