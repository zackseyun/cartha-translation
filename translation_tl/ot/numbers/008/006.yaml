base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: tl
  text: Kunin mo ang mga Levita mula sa gitna ng mga anak ni Israel[a] at dalisayin mo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita” o “sambayanang Israel.” Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Kunin mo
  rationale: Tuwirang utos sa ikalawang panauhang panlalaki na isahan. Pinananatili ng “Kunin mo” ang karaniwang kahulugan ng לקח nang hindi ipinapasok sa mismong pandiwa ang mas interpretatibong “ihiwalay.”
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Ito ang karaniwan at tiyak na katawagan sa Filipino para sa pangkat mula sa lipi ni Levi na itinalaga sa paglilingkod sa tabernakulo.
- source_word: מִתּוֹךְ
  choice: mula sa
  rationale: Ipinahihiwatig ng parirala ang pagkuha mula sa loob ng isang mas malaking pangkat. Natural sa Filipino ang “mula sa”; nauunawaan sa konteksto ang diwang “mula sa gitna ng.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawang pampamilya at tipanang taglay ng Hebreong parirala, habang inilalagay sa talababa ang mas idiomatikong mga katumbas.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: at dalisayin mo sila
  rationale: Sa kontekstong ritwal, ang טהר ay tumutukoy sa pagpapadalisay o paggawa sa kanila na ritwal na malinis. Ang “dalisayin” ay malinaw, marangal, at hindi naglilimita sa karaniwang pisikal na paglilinis.
theological_decisions:
- issue: Pagpapakahulugan sa בְּנֵי יִשְׂרָאֵל bilang kolektibong katawagan sa bayang Israel
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili sa pangunahing teksto ang pampamilya at tipanang anyo ng Hebreo. Hindi nito nilalayong limitahan ang tinutukoy sa mga literal na anak na lalaki lamang; ang mga idiomatikong kolektibong pagbasa ay ibinibigay sa talababa.
- issue: Saklaw ng טהר sa konteksto
  choice: dalisayin
  alternative: linisin; gawing malinis
  rationale: Ang konteksto ay paghahanda ng mga Levita para sa banal na paglilingkod, kaya ipinahihiwatig ng pandiwa ang ritwal na pagpapadalisay. Hindi dinaragdagan ng salin ang teksto ng isang tiyak na doktrina tungkol sa likas na kasalanan o panloob na pagbabago.
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Ginamit ang “mga Levita” bilang kinikilalang katawagang biblikal at ang “dalisayin” upang maipahayag ang ritwal na konteksto. Ang literal na “mga anak ni Israel” ay pinanatili, kalakip ang mas natural na mga alternatibo sa talababa.
