base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: tl
  text: Sapagkat sila ay lubos na ibinigay[a] sa akin mula sa kalagitnaan ng mga anak ni Israel[b]. Bilang kapalit ng bawat unang lumalabas sa sinapupunan[c]—bawat panganay sa mga anak ni Israel—kinuha ko sila para sa aking sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tunay na ibinigay sa akin” o “ganap na ibinigay sa akin.” Inuulit sa Hebreo ang salitang “ibinigay” upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mula sa bayang Israel” o “mula sa mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: c
    text: Ang “unang lumalabas sa sinapupunan” ay isang pananalitang Hebreo para sa panganay.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: lubos na ibinigay
  rationale: Ang pag-uulit ng pasibong participle ay nagbibigay-diin. Likas sa modernong Tagalog ang “lubos na ibinigay” at malinaw nitong ipinahahayag ang ganap na pagtatalaga sa Diyos.
- source_word: לִי
  choice: sa akin
  rationale: Ipinahahayag ng לִי ang pag-aari o pagtatalaga; ang “ibinigay sa akin” ang natural na anyo sa Tagalog.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  rationale: Ipinahihiwatig ng מִתּוֹךְ ang pagpili mula sa loob ng isang pangkat. Pinananatili ng “mga anak ni Israel” ang pananalitang pampamilya ng Hebreo.
- source_word: תַּחַת
  choice: bilang kapalit ng
  rationale: 'Nagsasaad ito rito ng paghalili: ang mga Levita ay kinuha bilang kapalit ng mga panganay.'
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: bawat unang lumalabas sa sinapupunan
  rationale: Pinananatili nito ang larawang Hebreo tungkol sa unang lumalabas mula sa sinapupunan, habang nauunawaan pa rin sa Tagalog; nililinaw ng kasunod na parirala na ang tinutukoy ay ang panganay.
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: bawat panganay sa mga anak ni Israel
  rationale: Ang pariralang nasa apposition ay nagpapaliwanag sa naunang idyoma. Ang “bawat panganay” ay malinaw na nagpapakita ng distributibong saklaw.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: kinuha ko sila para sa aking sarili
  rationale: Ipinahahayag ng ganap na pandiwa at pangwakas na לִי ang natapos na personal na pag-angkin ng Diyos; natural at malinaw ito sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: bayang Israel; mga Israelita
  rationale: Pinananatili ang tahasang pananalitang pampamilya at panlalaki ng Hebreo nang hindi ikinakaila na tumutukoy ito sa Israel bilang isang buong bayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lubos na ibinigay” sa halip na ulitin nang literal ang “ibinigay, ibinigay,” at pinanatili sa pangunahing teksto ang larawan ng Hebreong idyoma tungkol sa sinapupunan.
