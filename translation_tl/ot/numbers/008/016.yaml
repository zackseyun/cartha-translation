  source_fidelity: 'Tumpak ang pangunahing diwa: ang mga Levita ay lubos na itinalaga sa Diyos mula sa Israel at kinuha bilang kahalili ng mga panganay. Gayunman, ang מִתּוֹךְ ay mas tiyak na ‘mula sa kalagitnaan/hanay ng’ kaysa simpleng ‘mula sa,’ at dapat mas malinaw na maipakita sa talababa ang pag-uulit na nagbibigay-diin sa ‘lubos na ibinigay.’'
  naturalness: Marangal at malinaw ang register. Ang ‘mula sa kalagitnaan ng mga anak ni Israel’ ay mas tapat sa Hebreo at natural pa rin sa modernong Filipino. Ang ‘bawat unang lumalabas sa sinapupunan’ ay mauunawaan, lalo na sa kasunod na paglilinaw na ‘bawat panganay.’
  terminology: Pinananatili ang ‘mga anak ni Israel,’ na tumutugma sa בני ישראל, at ang ‘panganay’ para sa בכור. Ang ‘bilang kapalit ng’ ay wastong pagsasalin ng תַּחַת sa kontekstong paghalili.
