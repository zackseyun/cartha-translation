  - severity: low
    issue: Ang ‘mula sa mga anak ni Israel’ ay hindi tahasang naipapahayag ang pagpiling ‘mula sa loob/kalagitnaan’ ng pangkat.
    rationale: Ang מִתּוֹךְ ay nagsasaad ng pagpili mula sa hanay ng Israel; ang ‘mula sa kalagitnaan ng’ ay mas eksakto nang hindi binabago ang kahulugan.
