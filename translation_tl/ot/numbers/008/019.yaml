reference: Numbers 8:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: tl
  text: Ibinigay ko ang mga Levita kay Aaron at sa kanyang mga anak bilang kaloob mula sa mga anak ni Israel[a], upang gampanan nila ang paglilingkod ng mga anak ni Israel sa Tolda ng Pagtatagpo at magsagawa ng pagbabayad-sala para sa mga anak ni Israel. Sa gayon, walang salot na sasapit sa mga anak ni Israel kapag lumalapit sila sa banal na lugar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, inuulit dito ang salitang-ugat na nangangahulugang “magbigay” upang idiin na ang mga Levita mismo ang ibinigay bilang kaloob.
    reason: lexical_alternative
  - marker: b
    text: O “santuwaryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה ... נְתֻנִים
  choice: Ibinigay ko ... bilang kaloob
  rationale: 'Pinananatili ang pag-uulit ng ugat na נתן sa natural na Tagalog: ang mga Levita mismo ang ibinigay bilang kaloob. Ang payak na nagdaang panahong “Ibinigay ko” ay angkop sa sunod-sunod na salaysay at sa nananatiling bunga ng pagkakaloob.'
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kay Aaron at sa kanyang mga anak
  rationale: Malinaw na ipinapakita ang di-tuwirang layon o mga tumatanggap ng pagkakaloob.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  rationale: Inilalarawan ang pagpili sa mga Levita mula sa loob ng buong Israel at pinananatili ang pormal na Hebreong katawagang “mga anak ni Israel.”
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: upang gampanan nila ang paglilingkod
  rationale: Natural na Tagalog ito para sa infinitibo at kaugnay na pangngalan ng עבד, habang nananatili ang diwa ng itinakdang gawaing paglilingkod.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Tolda ng Pagtatagpo
  rationale: Tuwirang inililipat ang pangalan ng banal na tolda bilang lugar ng pagtatagpo, nang hindi ito ginagawang “tipanan,” na hindi siyang salitang ginamit dito.
- source_word: וּלְכַפֵּר עַל
  choice: at magsagawa ng pagtubos para sa
  rationale: Pinananatili ang ritwal at teolohikal na diwa ng כפר nang hindi ipinapasok sa teksto ang isang tiyak na mekanismo o tahasang pagbanggit sa kasalanan na wala rito.
- source_word: נֶגֶף
  choice: salot
  rationale: Sa konteksto ng paglapit sa banal na lugar, tumutukoy ito sa nakamamatay o makalangit na kapahamakang maaaring sumapit; maikli at malinaw ang “salot.”
- source_word: בְּגֶשֶׁת
  choice: kapag lumalapit
  rationale: Ipinahahayag ang temporal na gamit ng infinitive construct sa likas na Tagalog.
- source_word: הַקֹּדֶשׁ
  choice: banal na lugar
  rationale: Pinananatili ang kongkretong sagradong pook nang hindi labis na nililimitahan kung aling bahagi ng santuwaryo ang tinutukoy.
theological_decisions:
- issue: Gampanin ng mga Levita kaugnay ng Israel at ng mga pari
  choice: Ang mga Levita ay ibinigay kay Aaron at sa kanyang mga anak upang gampanan ang paglilingkod ng Israel at magsagawa ng pagtubos para sa Israel.
  alternative: Ang mga Levita ay praktikal na katulong lamang at walang anumang gampaning kaugnay ng pagtubos.
  rationale: Tahasang iniugnay ng Hebreo ang kanilang gawain kapuwa sa paglilingkod sa Tolda at sa כפר para sa Israel. Pinananatili ng salin ang tensiyong ito nang hindi nilulutas sa pamamagitan ng isang doktrinal na sistema.
- issue: Saklaw ng katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanang Israel
  rationale: Pinananatili ang pormal na katawagang pangtipan at ang anyong panlalaki ng Hebreo, habang malinaw pa rin sa modernong Tagalog na tumutukoy ito sa sambayanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Pinanatili ang “mga anak ni Israel” bilang pormal na katawagan, ginamit ang “Tolda ng Pagtatagpo” bilang malinaw na salin ng אֹהֶל מוֹעֵד, at iniwasan ang terminolohiyang nakatali sa isang partikular na denominasyon.
