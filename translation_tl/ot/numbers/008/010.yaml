  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: tl
  text: Ilapit mo ang mga Levita sa harap ni Yahweh, at ipapatong ng mga anak ni Israel[a] ang kanilang mga kamay sa mga Levita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel,” isang karaniwang kolektibong tawag sa sambayanang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Ilapit mo
  rationale: Ang Hifil ng קרב ay nangangahulugang maglapit o magharap. Natural sa makabagong Tagalog ang “ilapit,” at napapanatili nito ang direksiyonal na diwa ng ritwal na pagdadala sa harap ni Yahweh.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang tawag sa Tagalog para sa pangkat na tinutukoy ng pangmaramihang לוי na may pantukoy.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay “sa harap” o “sa presensiya ng.” Ang “sa harap ni Yahweh” ay malinaw, natural, at angkop sa kontekstong ritwal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וְסָמְכוּ
  choice: ipapatong
  rationale: Sa ritwal na pariralang may mga kamay at עַל, ang סמך ay tumutukoy sa pagpapatong ng mga kamay. Ang “ipapatong” ay malinaw at likas sa Tagalog.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang anyong Hebreo na “mga anak ni Israel,” habang nililinaw sa talababa na isa itong karaniwang kolektibong tawag sa mga Israelita.
- source_word: יְדֵיהֶם
  choice: ang kanilang mga kamay
  rationale: Tuwirang katumbas ng pangmaramihang “kanilang mga kamay.”
- source_word: עַל הַלְוִיִּם
  choice: sa mga Levita
  rationale: Kasama ng pandiwang “ipapatong,” likas sa Tagalog ang pang-ukol na “sa” para sa pagpapatong ng mga kamay sa mga Levita.
theological_decisions:
- issue: Pagbibigay-kahulugan sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo na יהוה ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na gawing titulo.
- issue: Pagbibigay-kahulugan sa בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita; ang sambayanang Israel
  rationale: Pinananatili sa pangunahing teksto ang literal at tipikal na kolektibong ekspresyon ng Hebreo, ngunit ipinapaliwanag sa talababa ang saklaw nito upang hindi ipakahulugang mga lalaking anak lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pautos na “Ilapit mo” dahil ikalawang panauhang isahan ang anyong Hebreo at bahagi ito ng tagubilin kay Moises. Iniwasan ang mas mabigat na “iharap” upang mapanatili ang pangunahing diwa ng קרב na paglapit, habang ipinahahayag na ng “sa harap ni Yahweh” ang kontekstong paghaharap.
