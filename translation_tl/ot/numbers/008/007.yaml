  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: tl
  text: 'Ganito ang gawin mo sa kanila upang linisin sila: wisikan mo sila ng tubig para sa paglilinis[a], at ahitin nila ang kanilang buong katawan[b], labhan ang kanilang mga damit, at linisin ang kanilang sarili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tubig ng paglilinis”; literal, “tubig ng kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “paraanin nila ang labaha sa lahat ng kanilang laman,” ibig sabihin, ahitin ang kanilang buong katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם
  choice: Ganito ang gagawin mo sa kanila
  rationale: Natural na panimulang panuto sa modernong Tagalog; pinananatili ang tuwirang ritwal na tagubilin at ang ugnay nito sa naunang konteksto.
- source_word: לְטַהֲרָם
  choice: upang linisin sila
  rationale: Ipinahahayag ang ritwal na paglilinis nang malinaw at hindi nililimitahan sa moral na kahulugan lamang.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: wisikan mo sila
  rationale: Ang pandiwa ay tumutukoy sa ritwal na pagwiwisik; ito ang natural at malinaw na katumbas sa Tagalog.
- source_word: מֵי חַטָּאת
  choice: tubig na panlinis sa kasalanan
  rationale: Pinananatili ang kaugnayan ng חַטָּאת sa kasalanan habang ipinakikitang ang tubig ay ginagamit sa paglilinis; hindi ipinapalagay na tahasang nakasaad dito ang handog para sa kasalanan.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: Ahitin nila ang kanilang buong katawan
  rationale: Natural na inilalahad sa Tagalog ang idyomang literal na ‘paraanin ang labaha sa lahat ng kanilang laman’; ang literal na larawan ay inilalagay sa talababa.
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: labhan ang kanilang mga damit
  rationale: Ang כבס ay partikular na tumutukoy sa paglalaba ng kasuotan; karaniwan at malinaw ang ‘mga damit.’
- source_word: וְהִטֶּהָרוּ
  choice: at sa gayon ay linisin ang kanilang sarili
  rationale: Sinasalamin ang reflexive na anyo at ang resultang ritwal na paglilinis matapos isagawa ang mga ipinag-utos.
theological_decisions:
- issue: Kalikasan ng paglilinis sa ritwal ng pagtatalaga sa mga Levita
  choice: Gumamit ng ‘linisin’ at panatilihin ang konkretong ritwal na diwa.
  alternative: Gamitin ang mas teknikal na ‘dalisayin’ sa lahat ng paglitaw.
  rationale: Ang talata ay naglalarawan ng panlabas at ritwal na paglilinis. Ang ‘linisin’ ay madaling maunawaan ngunit hindi nito inaalis ang kultikong konteksto.
- issue: Kahulugan ng מֵי חַטָּאת
  choice: tubig na panlinis sa kasalanan
  alternative: tubig ng paglilinis; tubig ng handog para sa kasalanan
  rationale: Ang literal na parirala ay ‘tubig ng kasalanan,’ at maaaring tumukoy sa tubig para sa ritwal na paglilinis. Hindi ginawang tahasan ang ‘handog para sa kasalanan’ sapagkat walang salitang ‘handog’ sa parirala.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘wisikan,’ ‘ahitin,’ at ‘labhan’ bilang karaniwang mga salitang angkop sa ritwal na panuto. Ang dalawang talababa ay minarkahan sa pangunahing teksto bilang [a] at [b].
