  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: tl
  text: At mula sa edad na limampung taon, aalis siya mula sa tungkulin sa gawain at hindi na siya magtatrabaho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babalik siya mula sa tungkulin sa gawain.” Ang pandiwang Hebreo ay literal na nangangahulugang “bumalik” o “bumaling pabalik,” ngunit dito ay ginagamit sa diwa ng pag-alis mula sa aktibong tungkulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: At mula sa edad na limampung taon
  rationale: Ang Hebreong idyoma ay nagsasaad ng hangganan ng edad na nagsisimula sa limampung taon; malinaw at natural ito sa modernong Tagalog.
- source_word: יָשׁוּב
  choice: titigil siya
  rationale: Ang pangunahing diwa ng pandiwa ay “bumalik/tumalikod,” ngunit kapag sinusundan ng מִן sa kontekstong ito, tumutukoy ito sa paghinto o pag-alis sa aktibong tungkulin. Pinananatili sa talababa ang literal na alternatibo.
- source_word: מִצְּבָא
  choice: sa paglilingkod
  rationale: Dito, ang צָבָא ay hindi pakikidigma kundi nakatalagang paglilingkod ng mga Levita.
- source_word: הָעֲבֹדָה
  choice: sa gawain
  rationale: Ang עֲבֹדָה ay gawain o paglilingkod. Ang “gawain” ay nagpapanatili ng pagkakaiba nito sa צָבָא nang hindi nagiging mabigat ang Tagalog.
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: at hindi na gagawa pa
  rationale: Tumutukoy ang עבד sa patuloy na pagsasagawa ng nakatalagang gawain. Ang parirala ay tuwiran at pinananatili ang diin ng עוֹד na hindi na ito ipagpapatuloy.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “paglilingkod sa gawain” upang mapanatili ang magkaugnay ngunit magkaibang mga terminong צָבָא at עֲבֹדָה; iniwasan ang “ministeryo” dahil maaari itong magpasok ng makabagong pansimbahang kahulugan.
