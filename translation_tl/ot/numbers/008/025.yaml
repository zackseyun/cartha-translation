- from: At mula sa edad na limampung taon, titigil siya sa paglilingkod sa gawain at hindi na gagawa pa[a].
  to: At mula sa edad na limampung taon, aalis siya mula sa tungkulin sa gawain at hindi na siya magtatrabaho[a].
  rationale: Pinalitan ang hindi gaanong natural na “titigil siya sa paglilingkod sa gawain at hindi na gagawa pa” ng mas malinaw at idiomatikong Filipino. Napananatili ng “tungkulin sa gawain” ang pagkakaiba ng Hebreong mga salitang tumutukoy sa nakatalagang serbisyo at sa gawain, at nililinaw ng “hindi na siya magtatrabaho” ang pagtatapos ng aktibong paggawa.
