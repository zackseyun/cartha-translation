language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: tl
  text: Sapagkat akin ang bawat panganay sa mga anak ni Israel, maging tao man o hayop. Nang araw na hinampas ko ang bawat panganay sa lupain ng Ehipto, itinalaga ko silang banal para sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinukod ko sila para sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o batayan para sa naunang pahayag sa konteksto.
- source_word: לִי
  choice: akin
  rationale: Ipinahahayag ng pariralang Hebreo ang pag-aari; likas at tuwiran ito sa Tagalog.
- source_word: כָל בְּכוֹר
  choice: bawat panganay
  rationale: Pinananatili ang kolektibong diwa nang hindi idinaragdag ang 'lalaki,' na hindi tahasang nasa talata.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang pampamilya at tipanang anyo ng בני ישראל sa natural na Tagalog.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: maging sa tao o sa hayop
  rationale: Malinaw na inilalahad ang saklaw sa dalawang kategorya habang pinananatili ang paghahambing ng tao at hayop.
- source_word: בְּיוֹם
  choice: Nang araw na
  rationale: Natural na panandang temporal sa Tagalog at malapit sa Hebreong 'sa araw na.'
- source_word: הַכֹּתִי
  choice: pinuksa ko
  rationale: Sa konteksto ng pagkamatay ng mga panganay sa Ehipto, ipinahahayag nito nang natural ang nakamamatay na paghampas, bagaman mas literal ang 'sinaktan ko.'
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang buong pariralang Hebreo, kabilang ang 'lupain.'
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: ibinukod ko sila bilang banal para sa akin
  rationale: Pinananatili kapwa ang ideya ng pagbubukod at ang sagradong puwersa ng ugat na קדשׁ sa malinaw na modernong Tagalog.
theological_decisions:
- issue: Saklaw ng אָדָם sa paghahambing sa hayop
  choice: tao
  alternative: sangkatauhan
  rationale: Dito ang אָדָם ay tumutukoy sa kategoryang pantao, hindi sa isang partikular na lalaki; ang 'tao' ang maikli at likas na katapat sa Tagalog.
- issue: Sagradong puwersa ng הִקְדַּשְׁתִּי
  choice: ibinukod ko sila bilang banal para sa akin
  alternative: itinalaga ko sila para sa akin
  rationale: Nililinaw nito na ang pagbubukod ay banal na pagtatalaga, hindi lamang pangkalahatang paglalaan.
- issue: Puwersa ng הַכֹּתִי sa salaysay ng Paskuwa
  choice: pinuksa ko
  alternative: sinaktan ko
  rationale: Ang konteksto ay ang nakamamatay na hatol sa mga panganay. Gayunman, kinikilala na ang pandiwa sa sarili nito ay mas malawak na 'humampas/sumakit.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mga anak ni Israel' upang mapanatili ang tipanang pananalita, at iniwasang idagdag ang 'lalaki' sapagkat hindi ito tahasang nakasaad sa talata.
