revisions:
- from: At naglinis ang mga Levita at nilabhan ang kanilang mga kasuotan. Pagkatapos, iniharap sila ni Aaron bilang handog na iwinawagayway[a] sa harap ni Yahweh, at nagsagawa si Aaron ng pagtubos para sa kanila upang linisin sila.
  to: At nilinis ng mga Levita ang kanilang sarili at nilabhan nila ang kanilang mga kasuotan. Iniharap sila ni Aaron bilang handog na iwinawagayway[a] sa harap ni Yahweh, at nagsagawa si Aaron ng pagbabayad-sala para sa kanila upang linisin sila.
  rationale: Pinalitan ang “pagtubos” ng “pagbabayad-sala” upang masaklaw nang wasto ang pangritwal na kahulugan ng כפר. Ginawang hayag ang reflexive na kahulugan ng unang pandiwa at inalis ang idinagdag na pang-ugnay na temporal. Pinanatili ang ritwal na terminong “handog na iwinawagayway,” ang pangalang Yahweh, at ang footnote na nagpapahintulot sa literal na alternatibo nang hindi iginigiit ang eksaktong pisikal na galaw.
