base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: tl
  text: At nilinis ng mga Levita ang kanilang sarili at nilabhan nila ang kanilang mga kasuotan. Iniharap sila ni Aaron bilang handog na iwinawagayway[a] sa harap ni Yahweh, at nagsagawa si Aaron ng pagbabayad-sala para sa kanila upang linisin sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “iwinagayway sila bilang handog.” Ginagamit sa Hebreo ang karaniwang pananalitang ritwal para sa paghaharap ng isang bagay sa harap ni Yahweh bilang תְּנוּפָה.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: naglinis
  rationale: Ang hitpael ng חטא sa kontekstong ito ng pagtatalaga ay tumutukoy sa ritwal na paglilinis na ginawa ng mga Levita sa kanilang sarili. Hindi idinagdag ang “mula sa kasalanan” sapagkat hindi ito tahasang sinasabi ng talata.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang salin ng tiyak na katawagan sa pangkat na Levitico.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: nilabhan ang kanilang mga kasuotan
  rationale: Tumpak at natural na paglalarawan sa paghuhugas ng mga damit sa konteksto ng ritwal na paglilinis.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: iniharap sila ... bilang handog na iwinawagayway
  rationale: Pinananatili ang tradisyonal na katawagang ritwal na “handog na iwinawagayway,” habang ipinahihiwatig ng “iniharap” na ang mga Levita mismo ang inihandog sa harap ni Yahweh, nang hindi ipinipilit kung paano eksaktong isinagawa ang kilos.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה at ang karaniwang kahulugan ng לִפְנֵי bilang pagharap o pagharap sa presensiya niya.
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: nagsagawa ... ng pagtubos para sa kanila
  rationale: Ang כפר sa kontekstong pangpari ay ritwal na paggawa ng pagtubos. Ang pariralang ito ay dignified at mauunawaan nang hindi nagdaragdag ng mas huling sistematikong paliwanag.
- source_word: לְטַהֲרָם
  choice: upang linisin sila
  rationale: Ipinahahayag ang layunin ng ginawang pagtubos at pinananatili ang bokabularyo ng ritwal na kalinisan.
theological_decisions:
- issue: Pagkakaiba at kaugnayan ng חטא, כפר, at טהר sa wikang pangritwal
  choice: “naglinis,” “nagsagawa ... ng pagtubos,” at “upang linisin”
  alternative: “nagpadalisay,” “nagbayad-sala,” at “upang dalisayin”
  rationale: Pinananatili ng salin ang sariling kilos ng mga Levita, ang pangparíng kilos ni Aaron, at ang layuning ritwal na paglilinis. Hindi nito tahasang inuugnay sa moral na kasalanan ang unang pandiwa kung saan hindi iyon tahasang nakasaad.
- issue: Paglalarawan sa תְּנוּפָה kapag mga tao ang tuwirang layon
  choice: “iniharap sila ... bilang handog na iwinawagayway”
  alternative: “iwinagayway sila bilang handog”
  rationale: Pinananatili ang ritwal na termino ngunit iniiwasang ipahiwatig nang tiyak na pisikal na iwinagayway ang mga Levita, isang detalye na hindi kailangang ipasya ng salin.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” alinsunod sa ibinigay na patakaran at sa direktang anyo ng tekstong Hebreo.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “mga kasuotan” at “pagtubos” upang mapanatili ang ritwal na tono nang hindi nagiging labis na teknikal. Ang panghalip na “ni” sa “ni Yahweh” ay natural sa Tagalog para sa personal na pangalan.
