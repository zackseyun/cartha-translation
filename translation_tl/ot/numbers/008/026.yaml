  to: Ngunit maaari pa rin siyang maglingkod kasama ng kanyang mga kapatid sa tolda ng pagpupulong upang tuparin ang tungkulin, ngunit hindi siya magsasagawa ng paglilingkod.[a] Ganito ang gagawin mo para sa mga Levita sa kanilang mga tungkulin.
