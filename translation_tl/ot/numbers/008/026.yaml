base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: tl
  text: Ngunit maaari pa rin siyang maglingkod kasama ng kanyang mga kapatid sa tolda ng pagpupulong upang tuparin ang tungkulin, ngunit hindi siya magsasagawa ng paglilingkod.[a] Ganito ang gagawin mo para sa mga Levita sa kanilang mga tungkulin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ngunit hindi siya gagawa ng gawain.” Pinaghahambing ng Hebreo ang pinahihintulutang paglilingkod at ang paglilingkod o gawain na hindi niya dapat gawin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת אֶת־אֶחָיו
  choice: maaari pa rin siyang tumulong sa kanyang mga kapatid
  rationale: Ang שׁרת ay tumutukoy sa paglilingkod o pag-alalay, at kaiba rito ang ipinagbabawal na עֲבֹדָה. Ipinahihiwatig ng konteksto na maaari pa rin siyang makibahagi bilang katuwang ng kapwa niya Levita, bagaman tumigil na siya sa regular na mabigat na gawain.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa tolda ng pagpupulong
  rationale: Tuwirang salin ng karaniwang katawagan sa tabernakulo; natural at malinaw sa modernong Tagalog.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: sa pagtupad ng kanilang tungkulin
  rationale: Ang idyomang Hebreo ay tumutukoy sa pagganap o pag-iingat sa isang ipinagkatiwalang pananagutan. Ang 'pagtupad ng ... tungkulin' ay natural sa Tagalog at hindi nililimitahan ang diwa sa pagbabantay lamang.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: pero hindi na siya gagawa ng mabigat na paglilingkod
  rationale: Ang magkaugnay na pangngalan at pandiwa ay mariing nagbabawal sa regular na gawain. Idinagdag ang 'mabigat' ayon sa konteksto ng pagreretiro sa naunang talata at upang maipakita ang kaibhan nito sa pinahihintulutang pagtulong, nang hindi ipinalalagay na lahat ng uri ng pakikibahagi ay bawal.
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם
  choice: Ganito ang gagawin mo sa mga Levita
  rationale: Likas na pormulang Tagalog para sa pangwakas na tagubilin.
- source_word: בְּמִשְׁמְרֹתָם
  choice: tungkol sa kani-kanilang mga tungkulin
  rationale: Ipinapahayag ang mga pananagutang nakaatang sa mga Levita; ang 'kani-kanilang' ay malinaw na kumakatawan sa pangmaramihang hulaping Hebreo.
theological_decisions:
- issue: Pagkilala sa pinahihintulutang gawain at sa ipinagbabawal na paglilingkod ng matatandang Levita
  choice: Maaari pa rin silang tumulong sa kapwa Levita sa pagtupad ng tungkulin, ngunit hindi na gagawa ng regular na mabigat na gawain.
  alternative: Ganap nang ipinagbabawal sa kanila ang lahat ng uri ng paglilingkod; o tanging pagbabantay sa seguridad ang pinahihintulutan.
  rationale: Pinaghaharap ng teksto ang שׁרת, na pinahihintulutan, at עֲבֹדָה...עבד, na ipinagbabawal. Kaya pinananatili ng salin ang pagkakaiba nang hindi ginagawang lubos na tiyak ang eksaktong anyo ng natitirang tungkulin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'tolda ng pagpupulong' at 'mga Levita' bilang malinaw na katawagang biblikal. Iniwasan ang teknikal o makalumang 'mag-iingat ng katungkulan,' at pinanatili ang pagkakaiba ng pagtulong at regular na mabigat na paglilingkod.
