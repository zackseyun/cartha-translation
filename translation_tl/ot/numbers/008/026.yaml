  - severity: medium
    issue: Ginawang “regular na gawain” ng talababa ang ipinagbabawal na עֲבֹדָה.
    rationale: Ang ‘regular’ ay isang posibleng pagbasa sa konteksto ngunit hindi isang tuwirang leksikal na alternatibo. Mas ligtas ang “paglilingkod” o “gawain.”
  - severity: low
    issue: Pangmaramihan ang “kanilang tungkulin” sa unang pagbanggit.
    rationale: Ang מִשְׁמֶרֶת ay isahan sa pariralang לִשְׁמֹר מִשְׁמֶרֶת; mas tumpak ang “ang tungkulin.”
