lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang wayyiqtol ng דבר ay nagpapatuloy sa salaysay; ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod, at pinananatili ng “nagsalita” ang diwa ng pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ito ang likas na panandang Filipino para sa direksiyon ng pagsasalita patungo sa isang taong may pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na pormulang Hebreo na nagpapakilala sa susunod na tuwirang pahayag.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na tahimik na palitan ng titulong “ang PANGINOON”; ang ibang nakaugaliang anyo ay inilalagay sa talababa.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang pormal na hulma ng panimulang pahayag sa Hebreo, bagaman bahagyang mas pormal sa karaniwang usapan ang “na sinasabi.”
