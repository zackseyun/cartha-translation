base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/022.yaml
  text: 'And for the tribe of the sons of Dan[a], a leader: Bukki son of Jogli.'
translation:
  language: tl
  text: Para naman sa lipi ni Dan[a], ang pinuno ay si Buki na anak ni Jogli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga anak ni Dan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Para naman sa lipi
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi. Likas sa Filipino ang “para naman sa” upang ipagpatuloy ang talaan.
- source_word: בְנֵי דָן
  choice: ni Dan
  rationale: Tumutukoy ito sa mga inapo o kaanib ng lipi ni Dan. Ginawang “lipi ni Dan” sa pangunahing teksto para sa natural na Filipino, habang inilagay sa talababa ang literal na anyo.
- source_word: נָשִׂיא
  choice: ang pinuno
  rationale: Dito, ang נָשִׂיא ay ang itinalagang kinatawan ng lipi sa paghahati ng lupain. Malinaw at pangkasalukuyan ang “pinuno,” samantalang maaaring magpahiwatig ng maharlikang titulo ang “prinsipe.”
- source_word: בֻּקִּי
  choice: Buki
  rationale: Isinatinig ang pangalang Hebreo sa paraang malinaw at natural basahin sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Tuwirang pormula ito ng pagkakakilanlang pampamilya at natural sa Filipino.
- source_word: יָגְלִי
  choice: Jogli
  rationale: Pinanatili ang nakaugaliang anyo ng pangalang biblikal sa Filipino, na kaayon ng karaniwang transliterasyong may J para sa panimulang yod.
