  text: 'At ito ang mga pangalan ng mga lalaki: para sa lipi ni Juda, si Caleb na anak ni Jefune.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ng “At” ang pagpapatuloy mula sa naunang talata, at likas sa Tagalog ang “ito ang” sa pagpapakilala ng listahan.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: mga pangalan ng mga lalaki
  rationale: Ang שְׁמוֹת ay anyong construct na kaugnay ng הָאֲנָשִׁים; tumutukoy ang huli sa mga tiyak na lalaking kinatawan.
- source_word: לְמַטֵּה
  choice: para sa lipi ni
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay “lipi,” at ipinahihiwatig ng לְ na ang taong pinangalanan ay kumakatawan sa liping iyon.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyo sa makabagong saling Tagalog para sa pangalan ng lipi at patriyarka.
- source_word: כָּלֵב
  choice: Caleb
  rationale: Karaniwang anyo sa Tagalog ng pangalang Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Likas na paraan sa Tagalog upang ipahayag ang patronimikong ugnayan.
- source_word: יְפֻנֶּה
  choice: Jefune
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
