  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: tl
  text: Ang Malaking Dagat ang magiging hangganan ninyo sa kanluran[a]. Ito ang magiging hangganan ninyo sa kanluran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hangganan ng dagat” o “hangganan sa dagat.” Sa talaang ito ng mga hangganan, ang Hebreong יָם (“dagat”) ay ginagamit din bilang katawagan sa direksiyong kanluran.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: hangganan
  rationale: Tumutukoy ito sa guhit o sukdulan ng isang teritoryo; ang “hangganan” ang natural at malinaw na salin sa konteksto ng paghahati ng lupain.
- source_word: יָם
  choice: kanluran
  rationale: Sa pariralang גְּבוּל יָם, ang “dagat” ay ginagamit ding panandang direksiyon para sa panig na pakanluran; ipinahahayag ng “sa kanluran” ang kahulugan nito sa talaan ng mga hangganan.
- source_word: הַיָּם הַגָּדוֹל
  choice: ang Malaking Dagat
  rationale: Pinananatili nito ang Hebreong heograpikong katawagan sa dagat na kilala ngayon bilang Mediteraneo.
- source_word: וְהָיָה לָכֶם
  choice: ay ... ninyo
  rationale: Ipinahahayag ng sugnay kung ano ang magsisilbing hangganan ng Israel; likas sa Filipino ang konstruksiyong ito habang pinananatili ang diwang inilaan para sa kanila.
- source_word: וּגְבוּל
  choice: bilang hangganan
  rationale: Muling nililinaw ng parirala ang tungkulin ng Malaking Dagat bilang mismong guhit-hangganan.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: ito ang magiging ... ninyo
  rationale: Natural na Filipino ito para sa pangwakas na pormulang muling tumutukoy sa itinakdang hangganan.
- source_word: גְּבוּל יָם
  choice: hangganan ... sa kanluran
  rationale: Sa kontekstong heograpiko, ang literal na “hangganan sa dagat” ay tumutukoy sa kanlurang panig; ang saling ito ay malinaw ngunit ang literal na anyo ay itinatala sa talababa.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “Malaking Dagat” bilang tradisyonal na heograpikong katawagan, at “hangganan sa kanluran” upang maipahayag ang direksiyonal na gamit ng יָם nang hindi itinatago ang literal na anyo, na inilagay sa talababa.
