base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: tl
  text: At para sa lipi ng mga anak ni Zebulun, ang pinuno ay si Elizafan na anak ni Parnac.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: At para sa lipi ng
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod. Likas sa Filipino ang “At para sa lipi ng” bilang pagpapatuloy ng talaan.
- source_word: בְנֵי זְבוּלֻן
  choice: mga anak ni Zebulun
  rationale: Pinananatili nito ang genealogical na anyo ng Hebreong בְנֵי habang malinaw na tumutukoy sa pangkat na nagmula kay Zebulun.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Ang נָשִׂיא ay isang kinikilalang pinuno ng lipi. Ang “pinuno” ay malinaw, moderno, at hindi nagpapahiwatig ng maharlikang titulong maaaring idulot ng “prinsipe.”
- source_word: אֱלִיצָפָן
  choice: Elizafan
  rationale: Isinalin sa baybay na angkop sa Filipino ang personal na pangalan batay sa anyong Hebreo.
- source_word: בֶּן פַּרְנָךְ
  choice: anak ni Parnac
  rationale: Ang בֶּן ay karaniwang pormulang genealogical na “anak ni.” Ang Parnac ay transliterasyon sa baybay-Filipino ng pangalang Hebreo.
