  register: Makabago, malinaw, at marangal na Filipino. Ginawang buong sugnay ang appositional na Hebreong talaan sa pamamagitan ng “ang pinuno ay si” upang maging natural at madaling maunawaan nang hindi dinaragdagan ang diwa.
