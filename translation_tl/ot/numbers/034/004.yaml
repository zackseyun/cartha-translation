  register: Makabago, malinaw, at marangal na Filipino. Pinanatiling transliterado ang mga pangalang pantangi, ginamit ang maiikling pangungusap para madaling masundan ang rutang heograpiko, at iniwasan ang labis na teknikal o makalumang pananalita.
