  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: tl
  text: Mula sa timog ng Akyatan ng Akrabim[a], liliko ang hangganan ninyo at daraan patungong Zin. Ang dulo nito ay nasa timog ng Kades-barnea; mula roon, tutuloy ito sa Hazar-adar at daraan patungong Azmon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Akrabim ay malamang na nangangahulugang “mga alakdan”; maaari ring isalin ang pangalan bilang “Akyatan ng mga Alakdan” o “Daanan ng mga Alakdan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב לָכֶם הַגְּבוּל
  choice: liliko ang hangganan ninyo
  rationale: Sa paglalarawan ng mga hangganan, ang נָסַב ay tumutukoy sa pagliko o pagkurba ng linya. Likas sa makabagong Tagalog ang “liliko,” at malinaw na inuugnay ng “ninyo” ang hangganan sa Israel ayon sa לָכֶם.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: mula sa timog ng Akyatan ng Akrabim
  rationale: Ang מִנֶּגֶב ay nagtatakda sa bahaging timog ng palatandaang heograpiko. Isinalin ang מַעֲלֵה bilang “Akyatan” at pinanatiling transliterado ang pangalang Akrabim; inilagay sa talababa ang literal na kaugnayan nito sa mga alakdan.
- source_word: וְעָבַר צִנָה
  choice: at daraan patungong Zin
  rationale: Sa mga talaan ng hangganan, ang עָבַר ay nagsasaad ng pagdaan ng linya, at ang hulaping direksiyonal sa צִנָה ay nagpapahiwatig ng galaw patungong Zin.
- source_word: וְהָיָה תּוֹצְאֹתָיו מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: Ang dulo nito ay nasa timog ng Kades-barnea
  rationale: Bagaman anyong maramihan ang תּוֹצְאֹתָיו, ginagamit ito bilang terminong heograpiko para sa hantungan o dulong bahagi ng hangganan. Mas natural sa Tagalog ang kolektibong isahan na “dulo,” habang pinananatili ng “nasa timog ng” ang tiyak na lokasyon.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: mula roon, tutuloy ito sa Hazar-adar
  rationale: Sa konteksto ng hangganan, ang יָצָא ay tumutukoy sa pagpapatuloy o pag-abot ng linya sa susunod na lugar. Ginagawang malinaw ng “mula roon” ang sunod-sunod na ruta nang hindi nagdaragdag ng bagong lokasyon.
- source_word: וְעָבַר עַצְמֹנָה
  choice: at daraan patungong Azmon
  rationale: Pinananatili ng “daraan” ang paulit-ulit na pandiwang עָבַר, at ng “patungong” ang direksiyonal na anyo ng pangalang Azmon.
theological_decisions: []
