  naturalness: Natural ang kabuuang ayos, pati ang “ang paring si Eleazar” at “si Josue na anak ni Nun.” Mas malinaw at mas angkop sa modernong Filipino ang “magtatalaga sa inyo ng lupain bilang mana.”
  terminology: Napananatili ang “lalaki,” “pari,” “lupain,” at “mana” sa paraang tapat sa teksto at marangal ang rehistro. Ang “Josue” ay katanggap-tanggap na nakaugaliang anyong Filipino.
