base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: tl
  text: 'Ito ang mga pangalan ng mga lalaking magtatalaga sa inyo ng lupain bilang mana: ang paring si Eleazar at si Josue na anak ni Nun.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mamamahagi sa inyo ng lupain bilang mana” o “magpapamana sa inyo ng lupain.” Ang pandiwang Hebreo ay may diwang pagpapangyari o pagtatalaga ng mana.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Ito ang mga pangalan
  rationale: Likas na salin sa Filipino ng Hebreong sugnay na walang tahasang pandiwang pantukoy; ipinakikilala nito ang mga taong kasunod na papangalanan.
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Tumutukoy ito sa mga tiyak na lalaking pinunong nakatalaga sa gawaing ito, kaya pinanatili ang kasarian ng pangngalan.
- source_word: אֲשֶׁר יִנְחֲלוּ לָכֶם אֶת הָאָרֶץ
  choice: maghahati-hati para sa inyo ng lupain bilang mana
  rationale: Ang Hiphil na יִנְחֲלוּ ay causative at sa konteksto ay tumutukoy sa pangangasiwa sa paghahati o pagtatalaga ng lupain upang matanggap ito ng Israel bilang mana. Ang 'para sa inyo' ay malinaw na nagpapahayag ng mga makikinabang.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ang paring si Eleazar
  rationale: Natural na ayos sa modernong Filipino para sa pangalang may katungkulang 'pari.'
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: at si Josue na anak ni Nun
  rationale: Ginamit ang nakaugaliang anyong Filipino na 'Josue' at ang natural na patronimikong pariralang 'anak ni Nun.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang 'maghahati-hati' upang malinaw na ipahayag ang administratibong papel ng mga pinuno sa konteksto, habang pinananatili sa talababa ang ibang posibleng anyo ng causative na pandiwa.
