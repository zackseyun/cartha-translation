id: NUM.34.14
reference: Numbers 34:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י לָקְח֞וּ מַטֵּ֨ה בְנֵ֤י הָ/ראוּבֵנִי֙ לְ/בֵ֣ית אֲבֹתָ֔/ם וּ/מַטֵּ֥ה בְנֵֽי הַ/גָּדִ֖י לְ/בֵ֣ית אֲבֹתָ֑/ם וַ/חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה לָקְח֖וּ נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: tl
  text: Sapagkat kinuha na ng lipi ng mga anak ni Ruben, ayon sa kani-kanilang angkan[a], at ng lipi ng mga anak ni Gad, ayon sa kani-kanilang angkan, at ng kalahating lipi ni Manases ang kanilang mana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “angkan” dito ay tumutukoy sa mga pangkat ng pamilyang nagmula sa iisang ninuno sa loob ng bawat lipi.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng naunang pahayag; pinananatili nito ang puwersang sanhi/paliwanag ng Hebreo.
- source_word: לָקְחוּ
  choice: kinuha na
  rationale: Ang Qal perfect ay nagsasaad ng natapos nang pagtanggap o pag-angkin sa lupang inilaan; ang “kinuha na” ay malapit sa tahasang diwa ng pandiwa nang hindi ito pinapalambot bilang “tinanggap.”
- source_word: מַטֶּה
  choice: lipi
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa yunit ng tribo, hindi sa literal na tungkod.
- source_word: בְנֵי הָרְאוּבֵנִי
  choice: mga anak ni Ruben
  rationale: Pinananatili ang anyong genealogical ng Hebreo; mas pormal itong tapat kaysa sa simpleng “mga Rubenita.”
- source_word: לְבֵית אֲבֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Likas sa modernong Tagalog at malinaw na tumutukoy sa mga pangkat ng pamilyang nagmula sa iisang ninuno sa loob ng bawat lipi.
- source_word: בְנֵי הַגָּדִי
  choice: mga anak ni Gad
  rationale: Pinananatili ang genealogical na pagpapahayag ng Hebreo gaya ng sa Ruben.
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: kalahating lipi ni Manases
  rationale: Malinaw na isang kalahati lamang ng lipi ni Manases ang tinutukoy, at natural ang anyo sa Tagalog.
- source_word: נַחֲלָתָם
  choice: kanilang mana
  rationale: Sa konteksto, ito ang lupaing minana o inilaan sa kanila; pinananatili ng “mana” ang legal at tipanang pahiwatig ng salita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang genealogical na “mga anak ni Ruben/Gad,” habang ginawang natural ang Hebreong idyomang “mga sambahayan ng kanilang mga ama” bilang “kani-kanilang angkan.”
