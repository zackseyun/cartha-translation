  yaml_path: translation/ot/numbers/034/010.yaml
  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
translation:
  language: tl
  text: At itatakda ninyo para sa inyong sarili ang hangganan sa silangan, mula sa Hazar-enan hanggang sa Shefam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iguguhit ninyo para sa inyong sarili ang hangganan sa silangan.” Di-karaniwan ang pandiwang Hebreo rito at, sa kontekstong ito, tumutukoy sa pagmamarka o pagguhit ng linya ng hangganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: itatakda
  rationale: Sa konteksto ng pagtatakda ng teritoryo, ang di-karaniwang pandiwa ay tumutukoy sa pagmamarka o pagguhit ng linya ng hangganan. Natural sa modernong Filipino ang “itatakda,” habang inilalahad sa talababa ang mas literal na larawang “iguguhit/itatala.”
- source_word: לָכֶם
  choice: para sa inyong sarili
  rationale: 'Pinananatili nito ang benefactive o reflexive na diwa: ang pagtatakda ay ginagawa para sa kapakinabangan at pag-aari ng mga Israelita.'
- source_word: לִגְבוּל קֵדְמָה
  choice: ang hangganan sa silangan
  rationale: Ang גְּבוּל ay teritoryal na hangganan, at ang קֵדְמָה ay tumutukoy sa silangang panig. Ang pariralang ito ay malinaw at natural sa Filipino.
- source_word: מֵחֲצַר עֵינָן
  choice: mula sa Hazar-enan
  rationale: Isinatinig ang pangalan ng pook at pinanatili ang מִן bilang panimulang punto ng bahaging ito ng hangganan.
- source_word: שְׁפָמָה
  choice: hanggang sa Shefam
  rationale: Isinatinig ang pangalan ng pook; ipinahahayag ng “hanggang sa” ang patutunguhan o dulong punto ng linyang nagsisimula sa Hazar-enan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “hangganan sa silangan” sa halip na mas teknikal na pananalita, at isinatunog ang mga pangalan bilang Hazar-enan at Shefam. Ang marker na [a] ay nakalagay sa pangunahing teksto.
