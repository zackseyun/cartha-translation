  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: tl
  text: Ito ang mga inutusan ni Yahweh na magbahagi sa mga anak ni Israel ng lupain bilang mana sa lupain ng Canaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ito ang mga inutusan ni Yahweh na ipagkaloob bilang mana sa mga anak ni Israel ang lupain sa Canaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Ito ang mga
  rationale: Likas na Filipino ito para sa pormulang kumikilala sa naunang binanggit na pangkat ng mga pinuno.
- source_word: צִוָּה
  choice: inutusan
  rationale: Pinananatili nito ang karaniwang diwa ng צוה na mag-utos, sa halip na gawing tahasang “hinirang,” kahit may tungkuling opisyal ang mga taong tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Filipino ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לְנַחֵל
  choice: na magtalaga ng lupang mana
  rationale: Ang Hiphil ng נחל ay tumutukoy rito sa pagpapamana o pagtatalaga ng bahagi sa mana. Nililinaw ng “lupang mana” ang konteksto ng paghahati ng lupain nang hindi nawawala ang konsepto ng mana.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang pormal at makasaysayang katawagang “mga anak ni Israel”; ang “sa” ay hinihingi ng likas na ayos ng pandiwang Filipino.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang pangngalang “lupain” at ang heograpikong pangalang Canaan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng causative na לְנַחֵל
  choice: magtalaga ng lupang mana sa mga anak ni Israel
  alternative: ipamana sa mga anak ni Israel
  rationale: Ipinahihiwatig ng konteksto ang opisyal na paghahati at pagtatalaga ng mana. Gayunman, maaari ring idiin ng pandiwa ang pagpapamana mismo, kaya inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupang mana” upang maging natural sa karaniwang mambabasa habang pinananatili ang legal at tipanang diwa ng pamamahagi ng lupain.
