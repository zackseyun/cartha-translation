translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “lipi,” “mana,” at “sa kabila ng Jordan” bilang karaniwang bokabularyong biblikal. Pinanatili ang dobleng pagpapahayag ng direksiyong silangan sa pangunahing teksto, at nilinaw sa talababa ang diin nito.
