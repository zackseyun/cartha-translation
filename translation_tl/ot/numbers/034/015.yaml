base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: tl
  text: Ang dalawang lipi at ang kalahating lipi ay kinuha na ang kanilang mana sa kabila ng Jordan[a], sa tapat ng Jerico—sa silangan, sa dakong sikatan ng araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kabilang panig ng Jordan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa silangan, sa dakong sikatan ng araw,” isang inuulit na pahayag na nagbibigay-diin sa silangang panig.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: ang dalawang lipi
  rationale: Bagaman literal ding maaaring mangahulugang “mga tungkod” ang מַטּוֹת, sa konteksto ng paghahati ng lupain ay idiomatikong tumutukoy ito sa mga lipi.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: at ang kalahating lipi
  rationale: Tumutukoy ito sa kinikilalang pangkat na kalahati ng isang lipi, hindi lamang sa isang di-tiyak na bahagi nito.
- source_word: לָקְחוּ
  choice: ay kinuha na
  rationale: Ang Qal perfect ay nagpapahayag ng natapos nang pagkilos. Pinananatili ng “kinuha na” ang tuwirang diwa ng לקח at ang kaugnayan nito sa naunang paliwanag.
- source_word: נַחֲלָתָם
  choice: ang kanilang mana
  rationale: Sa konteksto ng pamamahagi ng lupain, ang נַחֲלָה ay lupang minana o itinakdang bahagi; natural at may angkop na tipanang diwa sa Tagalog ang “mana.”
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Natural na katumbas ito ng idyomang tumutukoy sa kabilang panig ng Jordan ayon sa punto de bista ng nagsasalita.
- source_word: יְרֵחוֹ
  choice: sa tapat ng Jerico
  rationale: Ang pangalan ng lugar ay naglalarawan sa bahaging iyon ng Jordan na katapat ng Jerico. Mas malinaw ito sa heograpiya kaysa sa “sa Jerico,” yamang nasa silangang panig ng Jordan ang mana.
- source_word: קֵדְמָה
  choice: sa silangan
  rationale: Ipinapahayag ng anyong may directional ה ang direksiyon o lokasyong pasilangan.
- source_word: מִזְרָחָה
  choice: sa dakong sikatan ng araw
  rationale: Pinananatili nito ang larawang kaugnay ng pagsikat ng araw at ang inuulit na diin ng pariralang Hebreo, sa halip na pagsamahin ang dalawang salita sa iisang “silangan.”
