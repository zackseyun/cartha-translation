  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: tl
  text: Pagkatapos ay liliko ang hangganan mula sa Azmon patungo sa Batis ng Ehipto[a], at ang dulong hantungan nito ay sa dagat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Wadi ng Ehipto.” Ang salitang Hebreo na נחל ay madalas tumukoy sa isang pana-panahong daluyan ng tubig o wadi.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga dulo nito ay sa dagat.” Maramihan ang anyong Hebreo na tumutukoy sa hantungan ng hangganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Pagkatapos, liliko
  rationale: Sa paglalarawan ng hangganan, ang pandiwa ay tumutukoy sa pagbabago ng direksiyon. Likas sa modernong Tagalog ang “liliko,” at ipinakikita ng “Pagkatapos” ang pagsunod-sunod ng mga palatandaan ng hangganan.
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Ang גְּבוּל dito ay ang linyang nagtatakda sa sakop ng lupain; “hangganan” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: מֵעַצְמוֹן
  choice: mula sa Azmon
  rationale: Pangalan ito ng lugar at isinalin sa pamamagitan ng transliterasyon.
- source_word: נַחְלָה מִצְרָיִם
  choice: patungo sa Batis ng Ehipto
  rationale: Ang נחל ay karaniwang tumutukoy sa batis, bangbang, o pana-panahong daluyan ng tubig, hindi sa isang malaking ilog. Pinananatili ng “Batis ng Ehipto” ang madaling makilalang tradisyonal na pangalan, habang inilalahad sa talababa ang mas tiyak na heograpikong alternatibo.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: at ang dulo nito ay nasa
  rationale: Sa mga tekstong naglalarawan ng hangganan, tumutukoy ang תוצאות sa hantungan o dulong punto. Natural sa Tagalog ang isahang “dulo nito,” kahit maramihan ang anyong Hebreo.
- source_word: הַיָּמָּה
  choice: dagat
  rationale: Literal itong “patungo sa dagat” o “sa gawing dagat,” at sa konteksto ay itinatakda nito ang hantungan ng hangganan. Hindi tahasang pinapangalanan ng talata ang Dagat Mediteraneo.
