base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/023.yaml
  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: tl
  text: 'Para sa mga anak ni Jose[a], para sa lipi ng mga anak ni Manases: si Haniel na anak ni Efod ang pinuno.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Jose … mga inapo ni Manases.” Paulit-ulit na ginagamit sa Hebreo ang “mga anak ni” bilang pananalitang pangangkan at panlipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Para sa mga anak ni Jose
  rationale: Pinananatili ng “mga anak ni Jose” ang anyong Hebreo at ang diwang pangangkan, bagaman sa kontekstong panlipi ay maaari itong tumukoy sa mga inapo.
- source_word: לְמַטֵּה
  choice: para sa lipi ng
  rationale: Bagaman maaari ring mangahulugang “tungkod” ang מַטֶּה, ang kahulugan nito sa konteksto ng paghahati ng lupain ay “lipi.”
- source_word: בְנֵי מְנַשֶּׁה
  choice: mga anak ni Manases
  rationale: Pinananatili ang paulit-ulit na pormulang pangangkan sa Hebreo; sa kontekstong ito, ang mga anak ay kumakatawan sa mga inapo at kasapi ng lipi.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Ang נָשִׂיא ay tumutukoy rito sa kinatawan o nakatalagang pangulo ng lipi; malinaw at likas sa modernong Filipino ang “pinuno” at wala itong di-kinakailangang pahiwatig ng pagkahari.
- source_word: חַנִּיאֵל
  choice: Haniel
  rationale: Isinalin sa karaniwang anyong Filipino ang personal na pangalan.
- source_word: בֶּן אֵפֹד
  choice: anak ni Efod
  rationale: Karaniwang patronimikong parirala ito. Personal na pangalan dito ang Efod, hindi ang kasuotang pangpari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormulang “mga anak ni” dahil mahalaga ang anyong pangangkan sa tekstong Hebreo, habang nililinaw sa talababa ang kahulugang “mga inapo.” Ginamit ang “lipi” para sa administratibo at panliping gamit ng מַטֶּה.
