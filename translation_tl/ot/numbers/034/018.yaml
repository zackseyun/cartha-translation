    issue: Ginawang pangunahing salin ang “upang ipamahagi ang lupain bilang mana.”
    rationale: Ang Hebreong לִנְחֹל ay Qal, hindi Hiphil/causative; ang pangunahing kahulugan nito rito ay “upang manahin ang lupain.” Ang konteksto ng paglalaan ng lupain ay maaaring magpaliwanag kung bakit pinili ang mga pinuno, ngunit hindi nito binabago ang anyong gramatikal ng pandiwa.
  - severity: medium
    issue: Baligtad ang pagbibigay-singaw ng talababa sa pangunahing at alternatibong pagbasa.
    rationale: Itinatanghal ng talababa ang “manahin” bilang alternatibo at ang pamamahagi bilang mas malamang. Dapat pangunahing teksto ang tuwirang Qal na “manahin”; kung babanggitin ang allotment sense, dapat itong malinaw na ilahad bilang pagbasa batay sa konteksto, hindi bilang kahulugang hinihingi ng anyo.
