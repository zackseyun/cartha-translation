translation:
  language: tl
  text: At kukuha kayo ng tig-isang pinuno mula sa bawat lipi upang manahin ang lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang ipamahagi ang lupain bilang mana.” Ang pandiwang Hebreo ay karaniwang nangangahulugang “manahin.” Gayunman, dahil ang mga pinunong ito ay kaugnay ng paglalaan ng mga bahagi ng lupain sa nakapaligid na konteksto, maaari rin itong unawain na may kaugnayan sa pagtatalaga ng lupain bilang mana.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy ito sa kinikilalang lider o pangulo ng isang lipi; malinaw at likas ang “pinuno” at wala itong maharlikang pahiwatig ng “prinsipe.”
- source_word: אֶחָד ... אֶחָד
  choice: tig-isang
  rationale: Ipinahihiwatig ng pag-uulit na iisa ang kukuning kinatawan mula sa bawat lipi; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “tig-isang.”
- source_word: מִמַּטֶּה
  choice: mula sa bawat lipi
  rationale: Bagaman maaari ring mangahulugang “tungkod” ang מַטֶּה, malinaw na “lipi” ang kahulugan nito sa kontekstong administratibo; ang distributibong diwa ng אֶחָד ... אֶחָד ang nagbibigay-katwiran sa “bawat.”
- source_word: תִּקְחוּ
  choice: kukuha kayo
  rationale: Ang imperfect na maramihan ay ginagamit dito bilang tagubilin; pinananatili ng “kukuha kayo” ang direktibang lakas sa natural na makabagong Tagalog.
- source_word: לִנְחֹל
  choice: upang ipamahagi ... bilang mana
  rationale: 'Sa konteksto ng kasunod na pagtatalaga sa mga pinuno upang hatiin ang lupain, malamang na causative ang diwa: sila ang tutulong sa pagbibigay o paghahati nito bilang mana. Gayunman, maaaring unawain ang anyo bilang “manahin,” kaya pinananatili ang alternatibo sa talababa.'
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa tiyak na lupaing ibabahagi sa Israel; natural at malinaw ang “lupain” sa kontekstong ito.
theological_decisions:
- issue: Kung ang לִנְחֹל ay tumutukoy sa pagmamana o sa pagpapamana/pamamahagi
  choice: ipamahagi ang lupain bilang mana
  alternative: manahin ang lupain
  rationale: Ang agarang konteksto ng Mga Bilang 34:17–29 ay naglalarawan sa mga pinunong inatasang magtalaga ng mga bahagi ng lupain, kaya higit na akma ang causative o allotment sense. Hindi tiyak sa anyo lamang ang pagbasa, kaya hindi inalis ang mas tuwirang alternatibo.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang “tig-isang” para sa natural na distributibong pahayag at “lupain” para sa teritoryong ibinabahagi. Ang talababa ay nagpapanatili sa tunay na leksikal na kalabuan ng pandiwa.
