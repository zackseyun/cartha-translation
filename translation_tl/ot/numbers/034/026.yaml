lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: At para sa lipi ng
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi; likas na naipapahayag ng “At para sa” ang pinagsamang pangatnig at pang-ukol sa anyong talaan.
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Tuwirang pinananatili ang panlalaking anyong “mga anak” sa karaniwang katawagan sa lipi.
- source_word: יִשָׂשכָר
  choice: Isacar
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan.
- source_word: נָשִׂיא
  choice: ang pinuno
  rationale: Sa kabanatang ito, tumutukoy ito sa itinalagang kinatawan o lider ng lipi; malinaw at makabago ang “pinuno.”
- source_word: פַּלְטִיאֵל
  choice: Paltiel
  rationale: Isinalin sa baybay na malapit sa anyong Hebreo at madaling basahin sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Likas na Filipino para sa patronimikong “son of.”
- source_word: עַזָּן
  choice: Azan
  rationale: Isinalin sa payak na baybay-Filipino ang pangalang pantangi.
