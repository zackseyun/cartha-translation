  text: 'From the tribe of Benjamin: Elidad son of Chislon[a].'
translation:
  language: tl
  text: 'Mula sa lipi ni Benjamin: si Elidad na anak ni Kislon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Para sa lipi ni Benjamin.” Ganito rin maaaring unawain ang pang-ukol sa Hebreo sa talaang ito ng mga kinatawan ng mga lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: Mula sa lipi ni
  rationale: Sa talaan ng mga kinatawan, ipinakikilala ng לְ ang kaugnayan ng tao sa lipi. Likas sa modernong Tagalog ang “Mula sa lipi ni,” bagaman maaari ring unawain na ang kinatawan ay itinalaga para sa lipi.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Tagalog na Bibliya.
- source_word: אֱלִידָד
  choice: Elidad
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa anyong natural sa Tagalog.
- source_word: בֶּן
  choice: anak ni
  rationale: Natural at malinaw na pagpapahayag sa Tagalog ng ugnayang ipinahihiwatig ng Hebreong construct na “anak ng.”
- source_word: כִּסְלוֹן
  choice: Kislon
  rationale: Ang K ay tuwirang kumakatawan sa Hebreong כּ at mas natural sa makabagong ortograpiyang Filipino kaysa sa anyong Ingles na “Chislon.”
