lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: At para sa lipi ng
  rationale: Sa konteksto ng talaan ng mga lipi, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod. Pinagsama sa salin ang pangatnig at pang-ukol bilang natural na “At para sa.”
- source_word: בְנֵי אֶפְרַיִם
  choice: mga anak ni Efraim
  rationale: Pinananatili nito ang literal na anyong Hebreo na “mga anak ni Efraim,” samantalang ipinapaliwanag sa talababa na tumutukoy ito sa mga kaanib o inapo ng lipi.
- source_word: נָשִׂיא
  choice: isang pinuno
  rationale: Sa administratibong kontekstong ito, tumutukoy ito sa itinalagang kinatawan o pinuno ng lipi; malinaw at hindi makahari ang “pinuno.”
- source_word: קְמוּאֵל
  choice: Kemuel
  rationale: Isinalin sa baybay na karaniwang ginagamit sa Filipino para sa pangalang ito.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang natural na modernong Tagalog para sa patronimikong pariralang “son of.”
- source_word: שִׁפְטָן
  choice: Shiftan
  rationale: Tinutumbasan nito ang katinig na שׁ bilang “sh” at pinananatili ang anyo ng pangalan sa pinagmulang Hebreo.
