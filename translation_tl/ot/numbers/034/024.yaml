  text: 'At para sa lipi ng mga anak ni Efraim[a], isang pinuno: si Kemuel na anak ni Shiphtan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Efraim”; ibig sabihin, ang mga kaanib o inapo ng lipi ni Efraim.
