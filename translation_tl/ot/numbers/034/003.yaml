  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: tl
  text: Ang inyong panig sa timog ay magmumula sa ilang ng Zin, sa tabi ng Edom; at ang inyong hangganan sa timog ay magmumula sa dulong bahagi[a] ng Dagat na Maalat[b], pasilangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gilid” o “sukdulan.”
    reason: lexical_alternative
  - marker: b
    text: Karaniwang tinatawag na “Dagat na Patay”; sa Hebreo, “Dagat na Maalat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: bahaging timog
  rationale: Sa paglalarawan ng hangganan, ang פֵּאָה ay tumutukoy sa isang panig o bahagi ng lupain, at ang נֶגֶב ay ginagamit dito bilang direksiyong timog, hindi bilang pangalang pantangi na Negev.
- source_word: מִמִּדְבַּר צִן
  choice: mula sa ilang ng Zin
  rationale: Ang “ilang” ay likas at marangal na salin ng מִדְבָּר sa kontekstong heograpikal at hindi nito ipinapalagay na purong buhangin ang lugar.
- source_word: עַל יְדֵי אֱדוֹם
  choice: sa tabi ng Edom
  rationale: Ang idyomang Hebreo ay nagpapahayag ng kalapitan o pag-ayon sa tagiliran ng Edom nang hindi ito labis na binibigyang-kahulugan bilang isang pormal na guhit-hangganan.
- source_word: גְּבוּל נֶגֶב
  choice: hangganan sa timog
  rationale: Ang גְּבוּל ay teritoryal na hangganan, at direksiyonal ang gamit ng נֶגֶב.
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: mula sa dulong bahagi ng Dagat na Maalat
  rationale: Ang קָצֶה ay dulo o sukdulang bahagi. Pinananatili ng “Dagat na Maalat” ang literal na Hebreong pangalan ng anyong-tubig.
- source_word: קֵדְמָה
  choice: pasilangan
  rationale: Ang anyong direksiyonal ay nangangahulugang patungo sa silangan; pinananatili ng “pasilangan” ang oryentasyong nasa tekstong Hebreo.
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: ay magmumula ... ay magmumula
  rationale: Sa pormulang nagtatakda ng hangganan, malinaw sa Filipino ang “magmumula” para sa panimulang heograpikal na punto, habang pinananatili ang magkatulad na ayos ng dalawang sugnay.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “ilang” bilang pamilyar na terminong biblikal, ngunit iniwasan ang lipas o labis na teknikal na pananalita. Pinanatili ang literal na pangalang “Dagat na Maalat” at ang bahagyang di-tiyak na ugnayan ng “pasilangan” sa hulihan ng pangungusap.
