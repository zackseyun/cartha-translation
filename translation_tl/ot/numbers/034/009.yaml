  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: tl
  text: Aabot ang hangganan sa Zifron, at magtatapos ito sa Hazar-enan.[a] Ito ang magiging hangganan ninyo sa hilaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas pormal na salin, “at ang mga hantungan nito ay sa Hazar-enan.” Gumagamit ang Hebreo ng maramihang pananalita para sa pagtatapos ng hangganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: aabot
  rationale: Sa paglalarawan ng hangganan, ipinapahiwatig ng pandiwa ang pag-abot o pagpapatuloy ng guhit ng hangganan, hindi literal na paglabas.
- source_word: הַגְּבֻל
  choice: ang hangganan
  rationale: Karaniwan at malinaw na katumbas sa Filipino para sa teritoryal na boundary.
- source_word: זִפְרֹנָה
  choice: hanggang sa Zifron
  rationale: Ang hulaping paturol sa Hebreo ay nagsasaad ng direksiyon tungo sa lugar; natural itong ipahayag bilang “hanggang sa” sa konteksto ng hangganan.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: at magtatapos ito
  rationale: Tumutukoy ang parirala sa hantungan ng guhit ng hangganan. Pinananatili sa talababa ang pormal na maramihang anyo ng Hebreo.
- source_word: חֲצַר עֵינָן
  choice: Hazar-enan
  rationale: Pangalan ng lugar na tinumbasan sa pamamagitan ng transliterasyon.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: Ito ang magiging ... ninyo
  rationale: Natural na Filipino para sa pahayag na tumutukoy at nagtatakda sa hangganan para sa Israel.
- source_word: גְּבֻל צָפוֹן
  choice: hangganan ... sa hilaga
  rationale: Malinaw at likas na paraan sa Filipino upang tukuyin ang hangganan sa gawing hilaga.
