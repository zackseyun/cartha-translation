  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְצַ֣ו מֹשֶׁ֔ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּתְנַחֲל֤וּ אֹתָ/הּ֙ בְּ/גוֹרָ֔ל אֲשֶׁר֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֛ת לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: tl
  text: Pagkatapos, iniutos ni Moises sa mga Israelita, “Ito ang lupaing tatanggapin ninyo bilang mana sa pamamagitan ng palabunutan, na iniutos ng PANGINOON na ibigay sa siyam na lipi at sa kalahating lipi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Likas at malinaw na modernong Tagalog para sa kolektibong katawagang Hebreo na literal na ‘mga anak ni Israel.’
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: tatanggapin ninyo bilang mana
  rationale: Ipinapahayag ang diwang minana o inangking lupain nang natural sa Tagalog, habang pinananatili ang ikalawang panauhang maramihan.
- source_word: בְּגוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Tumutukoy sa pamamahagi sa pamamagitan ng sapalaran o lot; ‘palabunutan’ ang pinakakaraniwang malinaw na katumbas sa kontekstong ito.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang tradisyonal na maliit-na-kapital na pamalit sa banal na pangalang YHWH, kaayon ng consultation layer.
- source_word: לָתֵת
  choice: na ibigay
  rationale: Pinananatili ang aktibong pawatas na ‘magbigay’ at hindi ito ginagawang tahasang balintiyak.
- source_word: תִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: siyam na lipi at sa kalahating lipi
  rationale: Ang ‘lipi’ ang natural na katawagan sa mga tribo ng Israel; inuulit ang ‘sa’ upang luminaw ang dalawang tatanggap.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Sinusunod ang tradisyonal at malawak na nauunawaang representasyon nang hindi nagdaragdag ng interpretasyong denominasyonal.
- issue: Ugnayan ng utos at pagbibigay sa mga lipi
  choice: na iniutos ng PANGINOON na ibigay
  alternative: na iniutos ng PANGINOON na ibigay sa kanila / na ipagkaloob
  rationale: Pinananatili ang payak na sintaks at ang leksikal na diwa ng לָתֵת, nang hindi nagdaragdag ng di-hayag na panghalip o teolohikal na kulay.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘mga Israelita’ sa halip na literal na ‘mga anak ni Israel,’ at ‘palabunutan’ para sa pamamahagi ng mana sa pamamagitan ng lot.
