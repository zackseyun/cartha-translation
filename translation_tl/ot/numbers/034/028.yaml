base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/028.yaml
  text: 'And for the tribe of the sons of Naphtali[a], a leader: Pedahel son of Ammihud.'
translation:
  language: tl
  text: 'At para sa lipi ng mga anak ni Neftali[a], isang pinuno: si Pedahel na anak ni Amihud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Neftali,” isang karaniwang katawagang panlipi na nangangahulugang mga inapo ni Neftali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: At para sa lipi ng
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod. Likas na pinagsama sa salin ang pang-ugnay at pang-ukol bilang “At para sa.”
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Tuwirang pinananatili ang panlalaking katawagang Hebreo na “mga anak,” bagaman sa pormulang panlipi ay saklaw nito ang mga inapo ni Neftali.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: נָשִׂיא
  choice: isang pinuno
  rationale: Sa talaang administratibong ito, tumutukoy ang salita sa itinalagang pinuno ng lipi. Malinaw ito at hindi nagdaragdag ng monarkiyang pahiwatig ng “prinsipe.”
- source_word: פְּדַהְאֵל
  choice: Pedahel
  rationale: Isinalin sa titik ang pangalang pantangi ayon sa bigkas ng Hebreo at sa nakaugaliang anyo nito sa mga saling Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Natural at tuwirang salin ito ng karaniwang pormulang nagpapakilala sa ama.
- source_word: עַמִּיהוּד
  choice: Amihud
  rationale: Isinalin sa titik ang pangalang pantangi sa anyong madaling basahin sa Filipino.
