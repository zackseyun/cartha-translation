base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: tl
  text: Pagkatapos, bababa ang hangganan patungo sa Jordan, at aabot ang mga dulong bahagi nito[a] sa Dagat na Maalat.[b] Ito ang magiging lupain ninyo ayon sa mga hangganan nito sa buong palibot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at ang mga dulo nito ay magiging nasa Dagat na Maalat.” Ang salitang Hebreo ay maaaring tumukoy sa mga dulo, dulong bahagi, o hantungan ng hangganan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Dagat na Maalat”; ito ang anyong-tubig na karaniwang tinatawag ngayong Dagat na Patay.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: Pagkatapos, bababa
  rationale: Ang ירד ay ‘bumaba.’ Ginamit ang panghinaharap na anyo dahil inilalarawan dito ang itinakdang takbo ng hangganan; ipinahahayag ng ‘Pagkatapos’ ang pagkakasunod-sunod ng mga bahagi ng hangganan.
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Karaniwan at malinaw na katumbas ng גְּבוּל sa konteksto ng pagtatakda ng teritoryo.
- source_word: הַיַּרְדֵּנָה
  choice: patungo sa Jordan
  rationale: Ipinahihiwatig ng hulaping direksiyonal ang pagkilos patungo sa Jordan. Hindi na idinagdag ang ‘Ilog’ sapagkat sapat at likas sa Filipino ang pangalang ‘Jordan.’
- source_word: תוֹצְאֹתָיו
  choice: magtatapos ito
  rationale: Sa mga paglalarawan ng hangganan, tumutukoy ang pangngalan sa dulo o hantungan ng linya. Mas likas sa Filipino ang pandiwang ‘magtatapos,’ habang itinatala sa talababa ang anyong literal at posibleng diwa ng Hebreo.
- source_word: יָם הַמֶּלַח
  choice: Dagat na Maalat
  rationale: Pinananatili ang literal na katawagan ng Hebreo sa halip na palitan ito sa pangunahing teksto ng makabagong pangalang ‘Dagat na Patay.’
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: Ito ang magiging lupain ninyo
  rationale: Natural na Filipino para sa pangungusap na nagbubuod sa lupaing itinakda para sa kanila.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: ayon sa mga hangganan nito sa buong palibot
  rationale: Pinananatili ang diwa na ang lupain ay inilalarawan at itinatakda ng mga hangganan sa lahat ng panig.
