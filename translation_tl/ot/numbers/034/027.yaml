  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: tl
  text: At para sa lipi ng mga anak ni Aser, ang pinuno ay si Ahihud na anak ni Selomi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: At para sa lipi ng
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod; pinagsamang natural ang pangatnig at pang-ukol bilang “At para sa.”
- source_word: בְנֵי אָשֵׁר
  choice: mga anak ni Aser
  rationale: Pinananatili nito ang literal na anyong “mga anak ni” ng Hebreo habang malinaw na tumutukoy sa pangkat na nagmula kay Aser.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy ito sa opisyal na kinatawan ng lipi sa paghahati ng lupain; malinaw at likas sa modernong Filipino ang “pinuno” at hindi ito nagpapahiwatig ng maharlikang titulong prinsipe.
- source_word: אֲחִיהוּד
  choice: Ahihud
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang anyo sa Filipino.
- source_word: בֶּן שְׁלֹמִי
  choice: anak ni Selomi
  rationale: Natural na salin sa Filipino ng karaniwang Hebreong patronimiko.
