base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: tl
  text: Mula sa Sefam, bababa ang hangganan patungong Ribla, sa silangan ng Ain. Pagkatapos, bababa pa ang hangganan at aabot sa gilid ng Dagat Kineret sa silangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “balikat.” Sa heograpikong paglalarawan, tumutukoy ito sa gilid, tagiliran, o dalisdis ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: bababa
  rationale: Ang יָרַד ay “bumaba.” Sa paglalarawan ng hangganan, ipinahihiwatig nito ang direksiyon o pagbaba ng linya ayon sa lupain.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: ang hangganan
  rationale: Karaniwang salitang Filipino para sa teritoryal na border o boundary; malinaw at likas sa ganitong paglalarawan.
- source_word: מִשְּׁפָם הָרִבְלָה
  choice: mula sa Sefam … patungong Ribla
  rationale: Isinalin ang mga pangalan ng lugar sa karaniwang anyong Filipino, at ipinahayag ng “patungong” ang direksiyong nakapaloob sa hulaping Hebreo ng רִבְלָה.
- source_word: מִקֶּדֶם לָעָיִן
  choice: sa silangan ng Ain
  rationale: Tuwirang inilalarawan ng parirala ang kinaroroonan ng Ribla kaugnay ng Ain. Ang mas literal na anyo ay inilagay sa talababa.
- source_word: וּמָחָה
  choice: aabot
  rationale: Sa konteksto ng hangganan, nangangahulugan itong sasayad, tatama, o darating sa isang heograpikong katangian. Likas at malinaw ang “aabot” sa Filipino.
- source_word: עַל כֶּתֶף
  choice: sa gilid
  rationale: Literal na “sa balikat,” ngunit ang כֶּתֶף sa heograpikong gamit ay tumutukoy sa tagiliran, gilid, o dalisdis. Pinananatili ng “gilid” ang lawak ng posibleng topograpikong kahulugan nang hindi nagiging malabo.
- source_word: יָם כִּנֶּרֶת
  choice: Dagat Kineret
  rationale: Pinananatili ang katawagang Hebreo sa anyong madaling basahin sa Filipino, sa halip na palitan ito ng mas huling pangalang Dagat ng Galilea.
- source_word: קֵדְמָה
  choice: sa silangang panig
  rationale: Ipinahihiwatig ng pang-abay ang silanganing panig o direksiyon ng Dagat Kineret; malinaw sa Filipino ang “sa silangang panig.”
