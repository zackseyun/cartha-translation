  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: tl
  text: Mula sa Bundok Hor, iguguhit ninyo ang hangganan hanggang sa Lebo-hamat[a], at ang hangganan ay magtatapos sa Zedad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa pagpasok sa Hamat”; malamang na nakapirming pangalan ng pook ang Lebo-hamat.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: Mula sa Bundok Hor
  rationale: Ang parirala ay karaniwang pangalang pook na tumutukoy sa Mount Hor; natural sa Filipino ang “Bundok Hor,” kasama ang pang-ukol na “mula sa.”
- source_word: תְּתָאוּ
  choice: itatakda ninyo
  rationale: Sa konteksto ng pagtatakda ng teritoryo, tumutukoy ang pandiwa sa pagmamarka o pagtutunton ng linya ng hangganan. Malinaw at natural sa Filipino ang “itatakda ninyo.”
- source_word: לְבֹא חֲמָת
  choice: hanggang sa Lebo-hamat
  rationale: Bagaman literal na “sa pasukan ng Hamat,” malamang na gumaganap ang parirala bilang nakapirming pangalang heograpiko. Pinananatili sa teksto ang toponimong Lebo-hamat, habang inilalahad sa talababa ang literal na kahulugan.
- source_word: וְהָיוּ
  choice: ay nasa
  rationale: Sa paglalarawan ng hangganan, natural na ipinahahayag sa Filipino ang lokasyon ng dulong punto sa pamamagitan ng “ay nasa,” nang hindi pilit na ginagaya ang anyong Hebreo.
- source_word: תּוֹצְאֹת
  choice: ang dulo
  rationale: Sa mga paglalarawan ng teritoryo, tumutukoy ito sa sukdulan o dulong bahagi ng hangganan. Ang isahang “dulo” ay natural sa Filipino at angkop sa pangungusap.
- source_word: הַגְּבֻל
  choice: hangganan
  rationale: Karaniwan at malinaw na salitang Filipino para sa teritoryal na boundary.
- source_word: צְדָדָה
  choice: nasa Zedad
  rationale: Ang directional na hulaping Hebreo ay nagpapahiwatig ng patungo o pag-abot sa Zedad. Sa kontekstong terminal ng hangganan, natural ang “nasa Zedad,” habang hindi nagpapalabis sa tiyak na heograpikong ugnayan.
