  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: tl
  text: 'At para sa lipi ng mga anak ni Simeon: si Shemuel na anak ni Ammihud.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Shemuel”; tradisyonal ding isinusulat na “Samuel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: At para sa lipi ng
  rationale: Sa kontekstong administratibo ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod o sanga; pinagsamang likas na isinalin ang pang-ugnay at pang-ukol bilang “At para sa.”
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Pinananatili nito ang anyong Hebreo na “mga anak ni,” na sa pormulang panlipi ay tumutukoy rin sa mga inapo.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Ito ang nakagawiang anyo ng pangalang personal at panlipi sa Tagalog na Bibliya.
- source_word: שְׁמוּאֵל
  choice: Shemuel
  rationale: Ang pangalan ay tinumbasan sa baybay na mas malapit sa anyong Hebreo kaysa sa tradisyonal na “Samuel.”
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang tuwirang at likas na salin ng genealogical marker na בֶּן sa talaan ng mga pinuno.
- source_word: עַמִּיהוּד
  choice: Ammihud
  rationale: Transliterasyon ng pangalang Hebreo na עַמִּיהוּד.
