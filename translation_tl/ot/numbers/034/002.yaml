    rationale: Bukod sa ‘magbigay ng utos,’ maaari itong unawain bilang ‘magpagawa’ o, sa ilang gamit, ‘magpadala.’ Ang “Mag-utos ka sa” ay malinaw na naghahatid ng imperatibong צַו.
  - severity: low
    issue: Ang “batay sa mga hangganan nito” ay bahagyang maluwag na pagpapakahulugan.
    rationale: Ang לִגְבֻלֹתֶיהָ ay tuwirang tumutukoy sa lupain ayon sa itinakdang mga hangganan nito; mas malapit ang “ayon sa mga hangganan nito.”
