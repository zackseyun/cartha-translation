translation_notes:
  register: Modernong Filipino Tagalog na may marangal at bahagyang pormal na himig. Pinanatili ang “mga anak ni Israel” at ang pag-uulit ng “lupain ng Canaan” upang masundan ang estruktura at diin ng Hebreo; ginawang natural ang idyomang panghati ng lupain sa pangunahing teksto at ipinaliwanag ang literal na larawan sa talababa.
