base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: tl
  text: Mag-utos ka sa mga anak ng Israel at sabihin mo sa kanila, “Kapag pumasok kayo sa lupain ng Canaan, ito ang lupaing mapupunta sa inyo bilang mana[a]—ang lupain ng Canaan ayon sa mga hangganan nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mahuhulog sa inyo bilang mana.” Ang “mahulog” ay isang idyomang Hebreo para sa lupaing mapupunta o maitatalaga bilang bahagi, gaya ng sa pamamagitan ng palabunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Utusan mo
  rationale: Pinananatili nito ang mariing puwersa ng pandiwang pautos, habang natural sa modernong Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Tuwirang isinasalin ang Hebreong pananalita at malinaw pa rin sa karaniwang mambabasang Tagalog.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: at sabihin mo sa kanila
  rationale: Malapit ito sa pagkakasunod at pormal na anyo ng Hebreo nang hindi nagiging di-natural.
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: Kapag pumasok kayo sa
  rationale: Sa konteksto, ipinakikilala ng כִּי ang kalagayang mangyayari sa pagpasok nila; likas at malinaw sa Tagalog ang “kapag.”
- source_word: הָאָרֶץ כְּנָעַן
  choice: lupain ng Canaan
  rationale: Ito ang malinaw at karaniwang katumbas ng appositional na parirala sa Hebreo.
- source_word: זֹאת הָאָרֶץ אֲשֶׁר תִּפֹּל לָכֶם
  choice: ito ang lupaing mapupunta sa inyo
  rationale: Ang נפל ay literal na “mahulog,” ngunit sa paghahati ng lupain ay idyoma ito para sa bahaging mapupunta o maitatalaga sa isang pangkat. Pinananatili ng “mapupunta” ang diwa nang natural sa Tagalog.
- source_word: בְּנַחֲלָה
  choice: bilang mana
  rationale: Ipinahahayag nito ang lupain bilang minanang pag-aari o takdang bahagi, at maikli at natural ito sa Tagalog.
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: ang lupain ng Canaan batay sa mga hangganan nito
  rationale: Ipinakikita ng “batay sa” na ang teritoryo ay tutukuyin ayon sa mga hangganang kasunod na ilalarawan.
