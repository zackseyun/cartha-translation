  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/016.yaml
  text: Then Yahweh spoke to Moses, saying,
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Yahweh kay Moises:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagpapatuloy sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, nagsalita” at napananatili nito ang sunod-sunod na kilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ipinakikilala ng pang-ukol ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na anyo bago ang pangalang pantangi sa Tagalog.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang karaniwan at madaling makilalang anyo ng pangalan sa Filipino.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Sa Hebreo, pormulang panimula ito sa tuwirang pahayag. Sa natural na Tagalog, malinaw na ginagampanan ng tutuldok ang tungkuling ipakilala ang susunod na mismong sinabi nang hindi nagdaragdag ng mabigat na “na sinasabi.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Pagpapahayag sa לֵאמֹר
  choice: Tutuldok bilang panimula sa tuwirang pahayag
  alternative: na sinasabi; sinabi niya
  rationale: Hindi nilulutas o binabago ng tutuldok ang nilalaman; natural lamang nitong ipinahihiwatig sa Filipino na susunod sa kasunod na talata ang mismong pahayag.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang natural na ayos ng pangungusap at tutuldok upang ihanda ang tuwirang pahayag sa kasunod na talata.
