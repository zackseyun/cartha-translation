lexical_decisions:
- source_word: וְ/זֶה
  choice: At ito
  rationale: Pinananatili ang pang-ugnay at ang sunod-sunod na daloy ng paglalarawan sa mga hangganan.
- source_word: יִהְיֶה לָ/כֶם גְּבוּל צָפוֹן
  choice: ang magiging hangganan ninyo sa hilaga
  rationale: Natural sa modernong Filipino at pinananatili ang legal at nagtatakdang himig ng Hebreo.
