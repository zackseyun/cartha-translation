- source_word: הֹ֥ר הָ/הָֽר
  choice: Bundok Hor
  rationale: Karaniwang anyo sa Filipino para sa pangalang-pook na Mount Hor, sa halip na ang literal ngunit di-likas na 'Hor na bundok.'
