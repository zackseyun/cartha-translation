base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: tl
  text: O kung hinampas niya ang isang tao gamit ang batong hawak sa kamay[a] na maaaring ikamatay, at namatay siya, mamamatay-tao siya; tiyak na papatayin ang mamamatay-tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “batong-kamay” o “bato ng kamay,” ibig sabihin, batong hawak sa kamay o angkop gamitin sa kamay bilang sandata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: O kung
  rationale: Nagpapakilala ito ng isa pang kaso sa sunod-sunod na mga probisyong legal; likas sa Filipino ang “O kung” at napapanatili nito ang puwersang naghahain ng alternatibong pangyayari.
- source_word: בְּאֶבֶן יָד
  choice: gamit ang batong hawak sa kamay
  rationale: Ang literal na parirala ay “batong-kamay/bato ng kamay.” Nililinaw ng salin na ito na ang bato ay hawak o magagamit sa kamay bilang sandata, nang hindi labis na tinutukoy ang laki o uri nito.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: na maaaring ikamatay
  rationale: Inilalarawan ng sugnay ang kakayahan ng bato na makamatay. Ang “maaaring ikamatay” ay natural at pinananatili ang diwa ng potensiyal na kamatayan.
- source_word: הִכָּהוּ
  choice: hinampas niya ang isang tao
  rationale: Ang נכה ay nangangahulugang humampas o manakit. Hindi idinaragdag rito na agad itong nagpabagsak o pumatay, sapagkat hiwalay na binabanggit ang kamatayan.
- source_word: וַיָּמֹת
  choice: at namatay ito
  rationale: 'Pinananatili nito ang payak na pagkakasunod ng Hebreo: ang paghampas, at pagkatapos ay ang pagkamatay.'
- source_word: רֹצֵחַ הוּא
  choice: mamamatay-tao siya
  rationale: Sa kontekstong legal, ang רֹצֵחַ ay tumutukoy sa taong may pananagutan sa pagpatay, hindi lamang sa sinumang nakapatay.
- source_word: מוֹת יוּמַת
  choice: tiyak na dapat patayin
  rationale: Ang infinitive absolute na kasama ng pandiwa ay nagbibigay-diin sa katiyakan at bisa ng parusang kamatayan. Naipapahayag ng “tiyak na dapat patayin” ang parehong diin at legal na obligasyon.
- source_word: הָרֹצֵחַ
  choice: ang mamamatay-tao
  rationale: Inuulit ang katawagang legal sa hulihan, gaya sa Hebreo, upang mapanatili ang pormal na diin.
theological_decisions:
- issue: Legal na pag-uuri sa nakapatay sa konteksto ng mga lunsod-kanlungan
  choice: Isinalin ang רֹצֵחַ bilang “mamamatay-tao.”
  alternative: “nakapatay” o “taong pumatay”
  rationale: Ipinakikita ng nakapaligid na konteksto ang pagkakaiba ng sinasadyang pagpatay at di-sinasadyang pagkamatay. Ang “mamamatay-tao” ay nagpapahayag ng legal at moral na hatol ng talata nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “mamamatay-tao” para sa legal na bigat ng רֹצֵחַ, at pinanatili ang pag-uulit nito sa hulihan. Ang “isang tao” at “ito” ay nagpapalinaw sa mga panghalip na panlalaki ng Hebreo nang hindi binabago ang kahulugan.
