revisions:
- from: Ang kabuuang bilang ng mga lunsod na ibibigay ninyo sa mga Levita ay apatnapu't walo, kasama ang mga lunsod mismo at ang mga pastulan[a] sa paligid ng mga ito.
  to: Ang lahat ng lunsod na ibibigay ninyo sa mga Levita ay magiging apatnapu't walong lunsod, kasama ang mga lupang pastulan[a] ng mga iyon.
  rationale: Inalis ang tautolohikal na “mga lunsod mismo” at isinalin ang kaugnayan ng resumptive na panghalip sa pamamagitan ng “ng mga iyon,” na malinaw na tumutukoy sa 48 lunsod. Pinalitan ang “mga pastulan” ng “mga lupang pastulan” upang hindi ikulong ang מִגְרָשׁ sa isang gamit lamang, habang pinananatili ng talababa ang mga alternatibong leksikal.
