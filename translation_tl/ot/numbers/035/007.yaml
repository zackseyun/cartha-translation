  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: tl
  text: Ang lahat ng lunsod na ibibigay ninyo sa mga Levita ay magiging apatnapu't walong lunsod, kasama ang mga lupang pastulan[a] ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lupang panlahat” o “mga bukás na lupain”; tumutukoy ito sa lupain sa paligid ng mga lunsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Ang kabuuang bilang ng mga lunsod
  rationale: Sa konteksto ng tiyak na bilang, natural nitong ipinahahayag ang kabuuan ng lahat ng lunsod at iniiwasan ang alanganing pag-uulit sa Filipino.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: na ibibigay ninyo
  rationale: Ang ikalawang panauhang maramihan na imperfect ng נתן ay angkop na isalin bilang utos o itinakdang kilos sa hinaharap.
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Karaniwang katawagan sa Filipino para sa pangkat na mula sa lipi ni Levi.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: apatnapu't walo
  rationale: Likas na anyo ng bilang sa modernong Filipino; malinaw na tumutukoy sa bilang ng mga lunsod.
- source_word: אֶתְהֶן
  choice: ang mga lunsod mismo
  rationale: Ang resumptive object pronoun ay pinanatili bilang pagbibigay-diin sa mismong mga lunsod, sa halip na alisin nang tahimik.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: at ang mga pastulan sa paligid ng mga ito
  rationale: Ang מִגְרָשׁ ay lupang bukás o pastulan na nakapaligid sa isang lunsod; inililinaw ng parirala ang lokasyon at kaugnayan nito.
