  to: 'Susukatin ninyo sa labas ng lungsod: sa dakong silangan, dalawang libong siko; sa dakong timog, dalawang libong siko; sa dakong kanluran[a], dalawang libong siko; at sa dakong hilaga, dalawang libong siko, na nasa gitna ang lungsod. Ito ang magiging mga pastulan[b] ng mga lungsod para sa kanila.'
