  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: tl
  text: 'Susukatin ninyo sa labas ng lungsod: sa dakong silangan, dalawang libong siko; sa dakong timog, dalawang libong siko; sa dakong kanluran[a], dalawang libong siko; at sa dakong hilaga, dalawang libong siko, na nasa gitna ang lungsod. Ito ang magiging mga pastulan[b] ng mga lungsod para sa kanila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “dagat,” isang karaniwang katawagan sa kanluran dahil naroon ang Dagat Mediteraneo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “bukás na lupain” o “lupang panlahat.” Ang salitang Hebreo ay tumutukoy sa lupa sa paligid ng lungsod, na madalas gamitin sa pagpapastol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: Susukatin ninyo
  rationale: Ang Qal perfect na may pang-ugnay ay may puwersang instruksiyonal sa kontekstong legal; natural sa Filipino ang panghinaharap bilang utos habang pinananatili ang kongkretong pagkilos ng pagsukat.
- source_word: מִחוּץ לָעִיר
  choice: ang labas ng lungsod
  rationale: Tumutukoy ito sa lugar sa labas ng hangganan ng lungsod; malinaw at likas ang pariralang ito sa modernong Filipino.
- source_word: פְּאַת
  choice: sa dakong
  rationale: Sa konteksto ng pagsusukat, ipinakikilala nito ang bawat panig ayon sa direksiyon. Mas natural sa Filipino ang “sa dakong silangan/timog” kaysa paulit-ulit na “panig.”
- source_word: קֵדְמָה
  choice: silangan
  rationale: Karaniwang direksiyonal na kahulugan ng salita sa talatang ito.
- source_word: נֶגֶב
  choice: timog
  rationale: Ginagamit dito bilang direksiyon, hindi bilang pangalang pantangi ng rehiyong Negev.
- source_word: יָם
  choice: kanluran
  rationale: Literal itong “dagat,” ngunit sa karaniwang idyomang Hebreo ay tumutukoy sa kanluran, sa direksiyon ng Dagat Mediteraneo; ipinapaliwanag sa talababa ang literal na anyo.
- source_word: צָפוֹן
  choice: hilaga
  rationale: Karaniwang katawagan sa direksiyong hilaga at umaayon sa paulit-ulit na balangkas ng talata.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: dalawang libong siko
  rationale: Pinananatili ang tahasang sinaunang yunit na “siko” sa halip na tantiyahing gawing modernong sukat.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: na nasa gitna ang lungsod
  rationale: Likas at maikli itong paglalarawan sa ayos ng nasukat na lupain sa palibot ng lungsod.
- source_word: זֶה יִהְיֶה לָהֶם
  choice: Ito ang magiging
  rationale: Ipinahahayag ng demonstratibo at ng pandiwang היה ang pagtatalaga o gamit nang hindi ipinipilit na usapin ito ng ganap na pagmamay-ari.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: pastulan sa paligid ng kanilang mga lungsod
  rationale: Ang מִגְרָשׁ ay bukás na lupa sa paligid ng isang pamayanan, madalas na ginagamit sa pagpapastol. Isinasama ng salin ang lokasyon at pangunahing gamit nito nang hindi itinatago ang mas malawak na saklaw, na nililinaw sa talababa.
