  naturalness: Malinaw at likas ang kabuuang Filipino. Ang “sa labas ng lungsod” ay mas tuwiran at natural kaysa “ang labas ng lungsod” sa ganitong utos na pagsusukat.
  terminology: Ang “siko,” mga direksiyon, at “pastulan” ay angkop. Ginawang pangmaramihan ang “mga pastulan” upang maipakita ang pangmaramihang מִגְרְשֵׁי, habang nililinaw ng talababa ang mas malawak na kahulugang bukás o komunal na lupain.
