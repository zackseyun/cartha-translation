translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal ang himig. Pinanatili ang legal at instruksiyonal na tono, ang sinaunang yunit na “siko,” at ang apat na direksiyon. Inilagay ang mga marker [a] at [b] sa mismong bahaging nililinaw ng bawat talababa.
