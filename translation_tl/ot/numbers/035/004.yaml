base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: tl
  text: At ang mga pastulan[a] ng mga lungsod na ibibigay ninyo sa mga Levita ay mula sa pader ng lungsod[b] hanggang sa isang libong siko palabas, sa buong palibot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lupaing panlahat” o “mga bukas na lupain,” na tumutukoy sa lupa sa paligid ng mga lungsod.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa pader ng lungsod”; inuunawa naman ito ng ilan sa mas pangkalahatang kahulugang “mula sa hangganan ng lungsod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: mga pastulan
  rationale: Tumutukoy sa bukas na lupa sa paligid ng mga lungsod na inilaan para sa gamit ng mga Levita, lalo na para sa kanilang mga hayop. Natural at malinaw sa makabagong Filipino ang “mga pastulan,” habang inilalahad sa talababa ang mas malawak na posibleng kahulugan.
- source_word: הֶעָרִים
  choice: mga lungsod
  rationale: Karaniwang nangangahulugang lungsod o bayan ang עִיר. Pinili ang “mga lungsod” upang umayon sa konteksto ng mga lungsod ng mga Levita.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: na ibibigay ninyo
  rationale: Pinananatili nito ang hinaharap at tagubilin ng pandiwa sa isang natural na anyong Filipino.
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Tuwirang tinutukoy ang mga tatanggap ng mga lungsod at ng nakapaligid na lupain.
- source_word: מִקִּיר הָעִיר
  choice: mula sa pader ng lungsod
  rationale: Ang karaniwang kahulugan ng קִיר ay “pader.” Pinananatili ang payak na leksikal na kahulugan, habang binabanggit sa talababa na maaari itong unawain bilang hangganan ng lungsod.
- source_word: וָחוּצָה
  choice: palabas
  rationale: Malinaw na ipinahahayag ang direksiyong mula sa lungsod patungo sa labas.
- source_word: אֶלֶף אַמָּה
  choice: isang libong siko
  rationale: Pinananatili ang sinaunang yunit na אַמָּה bilang “siko,” ang nakaugaliang katawagan sa saling Filipino, sa halip na tantiyahin ito sa modernong sukat.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Ipinahahayag na ang itinakdang sukat ay umiikot sa buong lungsod.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga pastulan” bilang madaling maunawaang pangunahing katawagan, ngunit pinanatili sa talababa ang mas malawak na saklaw ng salitang Hebreo. Ang “siko” ay pinanatili bilang tradisyonal na katawagan sa sinaunang yunit ng haba.
