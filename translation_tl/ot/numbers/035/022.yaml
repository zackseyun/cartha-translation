base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: tl
  text: Ngunit kung bigla niya siyang itinulak nang walang poot[a], o naghagis siya ng anumang bagay sa kanya nang hindi nananambang[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang walang pagkamuhi.” Ang salitang Hebreo ay tumutukoy sa personal na poot o pagkamuhi.
    reason: lexical_alternative
  - marker: b
    text: O, “nang walang pag-aabang upang tambangan” o “nang hindi ito pinagplanuhan.” Sa literal, “nang walang pagtambang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikilala nito ang isang kondisyong salungat sa sinadyang pagpatay na tinalakay sa naunang konteksto.
- source_word: בְּפֶתַע
  choice: bigla
  rationale: Ipinahahayag ng parirala ang biglaan o di-inaasahang pangyayari.
- source_word: בְּלֹא אֵיבָה
  choice: nang walang pagkapoot
  rationale: Ang אֵיבָה ay personal na poot o alitan; malinaw at likas sa modernong Tagalog ang “pagkapoot.”
- source_word: הֲדָפוֹ
  choice: niya itong itinulak
  rationale: Ang pandiwa ay tumutukoy sa pagtulak o pag-ulos sa isang tao; pinananatili ng “itinulak” ang payak at kongkretong kilos.
- source_word: אוֹ
  choice: o
  rationale: Karaniwang pangatnig na naghaharap ng alternatibong pangyayari.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: naghagis siya ... patungo rito
  rationale: Ipinahahayag ng pandiwa at ng עַל ang paghagis ng bagay tungo sa tao. Iniiwasan ng “naghagis” ang mas makitid na pahiwatig ng “binato,” na maaaring magmungkahi na bato ang ginamit.
- source_word: כָּל כְּלִי
  choice: anumang bagay
  rationale: Malawak ang kahulugan ng כְּלִי at maaaring tumukoy sa isang gamit, kasangkapan, o bagay; pinananatili ng salin ang saklaw nito.
- source_word: בְּלֹא צְדִיָּה
  choice: nang hindi nag-aabang upang tambangan
  rationale: Ang צְדִיָּה ay tumutukoy sa pag-aabang o pagtambang; pinananatili ng salin ang kongkretong larawan sa halip na palawakin agad ito bilang modernong legal na “premeditasyon.”
theological_decisions:
- issue: Kung ilalahad ba ang kawalan ng pagtambang bilang kawalan ng premeditasyon
  choice: Pinanatili ang kongkretong diwa ng pag-aabang upang tambangan.
  alternative: “nang hindi pinagplanuhan” o “nang walang premeditasyon”
  rationale: Mas malawak ang modernong legal na konsepto ng premeditasyon kaysa sa kongkretong larawang ipinahahayag ng salitang Hebreo.
translation_notes:
  register: Gumamit ng natural at marangal na modernong Tagalog. Ang “ito/rito” ay tumutukoy sa taong itinulak o pinaghagisan at umiiwas sa paulit-ulit na “siya/kanya,” bagaman gaya ng Hebreo ay umaasa pa rin ang kasarian at tiyak na tinutukoy sa konteksto. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang kondisyong pangungusap sa susunod na talata.
