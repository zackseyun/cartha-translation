  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אַ֥רְצָ/ה כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: tl
  text: “Magsalita ka sa mga anak ni Israel at sabihin mo sa kanila, ‘Kapag tumawid kayo sa Jordan papasok sa lupain ng Canaan,’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sabihin mo
  rationale: Ang Piel imperative ay tuwirang utos kay Moises na magsalita sa bayan; natural at malinaw sa modernong Filipino ang “Sabihin mo.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal na katawagang pampamilya sa Hebreo, na tumutukoy sa sambayanang nagmula kay Israel.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: at sabihin mo sa kanila
  rationale: Pinananatili ang dalawang magkasunod na pandiwa ng Hebreo at ang retorikal na pag-uulit, kahit maaari itong paikliin sa mas idyomatikong Filipino.
- source_word: כִּי
  choice: Kapag
  rationale: Dito ay ipinakikilala nito ang isang inaasahang pangyayari sa hinaharap, kaya ang temporal na “Kapag” ang natural na katumbas.
- source_word: אַתֶּם עֹבְרִים
  choice: tumawid kayo
  rationale: Ang panghalip at participle ay nagpapahayag ng nalalapit na pagtawid; ang anyong ito ay natural sa sugnay na nagsisimula sa “Kapag.”
- source_word: אֶת הַיַּרְדֵּן
  choice: sa Jordan
  rationale: Ang “Jordan” ay karaniwang pangalan ng ilog; hindi kailangang idagdag ang “Ilog” upang maging malinaw.
- source_word: אַרְצָה כְּנָעַן
  choice: papasok sa lupain ng Canaan
  rationale: Ipinahihiwatig ng directional suffix ang paggalaw tungo at paloob sa lupain; malinaw itong naipapahayag ng “papasok sa.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang Hebreong pag-uulit na “Sabihin mo … at sabihin mo” at ang literal na katawagang “mga anak ni Israel,” habang ginawang natural ang temporal at direksiyonal na mga parirala.
