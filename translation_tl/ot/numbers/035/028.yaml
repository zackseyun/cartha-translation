  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: tl
  text: Sapagkat kailangan niyang manatili sa kanyang lungsod na kanlungan hanggang sa mamatay ang punong pari. Pagkamatay ng punong pari, maaaring bumalik ang nakapatay[a] sa lupaing pag-aari niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pumatay.” Ang salitang Hebreo rito ay isang legal na katawagan sa mga batas tungkol sa mga lungsod na kanlungan at hindi dapat awtomatikong unawain bilang “mamamatay-tao.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa sarili niyang lupang pag-aari” o “sa lupaing kanyang pag-aari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang legal na tuntunin at likas itong panimula ng paliwanag sa Filipino.
- source_word: בְעִיר מִקְלָטוֹ
  choice: sa kanyang lungsod na kanlungan
  rationale: Tuwirang ipinapahayag ang itinakdang lugar ng kanlungan nang malinaw at natural sa modernong Filipino.
- source_word: יֵשֵׁב
  choice: kailangan niyang manatili
  rationale: Sa kontekstong legal, ang pandiwa ay hindi lamang tumutukoy sa paninirahan kundi sa obligasyong manatili roon.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: hanggang sa mamatay ang punong pari
  rationale: Natural na Filipino para sa Hebreong pariralang may kahulugang temporal, habang pinananatili ang tiyak na hangganan ng pananatili.
- source_word: הַכֹּהֵן הַגָּדֹל
  choice: ang punong pari
  rationale: Karaniwan at malinaw na katawagan sa Filipino para sa opisyal na titulong ito.
- source_word: וְאַחֲרֵי מוֹת
  choice: Pagkamatay
  rationale: Pinananatili ang temporal na pagkakasunod at ang pag-uulit ng kamatayan ng punong pari bilang mahalagang legal na takda.
- source_word: הָרֹצֵחַ
  choice: ang nakapatay
  rationale: Inilalarawan nito ang taong nakapatay nang hindi agad hinahatulang mamamatay-tao; ang konteksto ng mga lungsod na kanlungan ay nangangailangan ng mas neutral na legal na katawagan.
- source_word: יָשׁוּב
  choice: maaaring bumalik
  rationale: Ipinahihiwatig ng konteksto ang muling pagkakaroon ng legal na pahintulot na bumalik, hindi lamang isang hula o utos.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: sa lupaing pag-aari niya
  rationale: Pinananatili ang legal at pang-ari-ariang diwa ng אֲחֻזָּה sa natural na Filipino nang hindi ipinapasok ang mas tiyak na konsepto ng mana.
theological_decisions:
- issue: Kung ang הָרֹצֵחַ ay dapat isaling “mamamatay-tao” o sa isang legal na katawagang hindi pa nagpapasya sa antas ng pagkakasala
  choice: ang nakapatay
  alternative: ang mamamatay-tao; ang pumatay
  rationale: Ibinubukod ng mga batas tungkol sa mga lungsod na kanlungan ang sadyang pagpatay sa iba pang uri ng pagpatay. Ang “mamamatay-tao” ay maaaring magpahiwatig agad ng sadyang pagpaslang, kaya pinili ang mas neutral na “nakapatay” upang mapanatili ang legal na pag-igting ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may bahagyang legal na himig. Ginamit ang “kailangan niyang manatili” upang maipahayag ang obligasyon, at “maaaring bumalik” upang maipahayag ang pahintulot. Inilagay ang mga talababa sa mismong mga salitang kanilang nililinaw.
