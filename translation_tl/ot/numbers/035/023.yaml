  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: tl
  text: o sa pamamagitan ng alinmang batong maaaring ikamatay ng tao, nang hindi niya nakikita, naihulog niya iyon sa isang tao at namatay ang taong iyon, gayong hindi niya kaaway ang taong iyon at hindi niya hinahangad na mapahamak ang taong iyon—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹ
  choice: o
  rationale: Ipinagpapatuloy nito ang magkakasunod na alternatibo sa kasong legal.
- source_word: בְּכָל אֶבֶן אֲשֶׁר יָמוּת בָּהּ
  choice: isang batong makamamatay
  rationale: Likas at maikli sa Filipino; ipinahahayag nito na ang bato ay may kakayahang maging sanhi ng kamatayan, nang hindi nililimitahan ang uri nito.
- source_word: בְּלֹא רְאוֹת
  choice: hindi niya nakita
  rationale: Pinananatili ang konkretong diwa ng Hebreong 'nang hindi nakakakita' at ang posibilidad na tumutukoy ito sa kawalan ng kamalayan, hindi lamang sa aksidenteng pagkilos.
- source_word: וַיִּפֵּל עָלָיו
  choice: naihulog niya iyon sa taong iyon
  rationale: Ipinakikita ng anyong causative na ang tao ang naging sanhi ng pagbagsak ng bato; ang 'naihulog' ay natural na nagpapahiwatig ng hindi sinasadyang pangyayari sa konteksto.
- source_word: וַיָּמֹת
  choice: kaya namatay ito
  rationale: Malinaw na inilalahad ang bunga ng pagkahulog ng bato.
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: gayong hindi niya ito kaaway
  rationale: Ang 'gayong' ay likas na naghahayag ng paliwanag o konsesyon tungkol sa kawalan ng poot.
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: at hindi niya hinahangad na mapahamak ito
  rationale: Sa kontekstong legal, ang רָעָה ay tumutukoy sa pinsala o kapahamakan; pinananatili ng 'hinahangad' ang diwa ng layunin.
