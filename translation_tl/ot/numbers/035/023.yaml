  terminology: Ang “kaaway,” “hinahangad,” at “mapahamak” ay angkop sa legal at marangal na rehistro. Ang “maaaring ikamatay ng tao” ay tapat sa kakayahan ng bato na makamatay nang hindi nagdaragdag ng interpretasyong doktrinal.
