  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: tl
  text: Ang tagapaghiganti ng dugo mismo ang papatay sa mamamatay-tao; kapag nakatagpo niya ang mamamatay-tao, siya mismo ang papatay sa taong iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tagapaghiganti ng dugo” ay isang takdang katawagang legal sa Hebreo para sa kamag-anak na may pananagutang ipaghiganti ang dugong dumanak dahil sa labag-sa-batas na pagpatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: tagapaghiganti sa dugo
  rationale: Sa kontekstong legal, ito ay isang takdang katawagan para sa kamag-anak na may pananagutang ipaghiganti ang dugong dumanak dahil sa labag-sa-batas na pagpatay. Pinananatili ng salin ang idyomang Hebreo habang malinaw na inilalarawan ang tungkulin.
- source_word: הוּא
  choice: mismo / siya mismo
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin na ang tagapaghiganti ang personal na gagawa ng pagpatay; ipinapakita ito ng “mismo” sa dalawang paglitaw.
- source_word: יָמִית
  choice: papatay
  rationale: Ang Hiphil ng מות ay causative, ‘magdulot na mamatay.’ Sa Filipino, natural at tuwiran ang “papatay” sa kontekstong ito, nang hindi ipinagpapalagay ang mga modernong pamamaraan ng pormal na pagbitay.
- source_word: הָרֹצֵחַ
  choice: mamamatay-tao
  rationale: Ang רצח ay tumutukoy sa labag-sa-batas na pagpatay. Ang “mamamatay-tao” ay natural na katawagan sa Filipino at akma sa taong itinuturing na karapat-dapat sa kamatayan sa konteksto.
- source_word: בְּפִגְעוֹ בוֹ
  choice: kapag nakatagpo niya ito
  rationale: Ang פגע sa pariralang ito ay nangangahulugang makatagpo o masalubong. Ipinahahayag ng “kapag” ang temporal na gamit ng בְּ nang hindi dinaragdagan ang teksto ng ideya ng paglusob.
- source_word: הוּא יְמִיתֶנּוּ
  choice: siya mismo ang papatay rito
  rationale: Pinananatili ng pag-uulit ang diin ng Hebreo sa awtorisadong gumagawa at sa mismong pagkilos.
theological_decisions:
- issue: Legal na papel ng גֹּאֵל הַדָּם
  choice: Isinalin bilang “tagapaghiganti sa dugo,” isang taong kamag-anak na gumaganap ng kinikilalang legal na tungkulin sa sinaunang Israel.
  alternative: “manunubos ng dugo” o “kamag-anak na manunubos”
  rationale: Ang talata ay bahagi ng batas tungkol sa pagpatay, hindi tuwirang pagtukoy sa teolohikal na pagtubos. Iniiwasan ng piniling salin ang pagpasok ng mga kahulugang hindi pangunahing tinutukoy rito.
- issue: Lakas ng יָמִית
  choice: “papatay”
  alternative: “papatawan ng kamatayan” o “papatayin bilang parusa”
  rationale: Tuwirang sinasabi ng Hebreo na ang tagapaghiganti ang magdudulot ng kamatayan. Ang alternatibong “papatawan ng kamatayan” ay maaaring magpahiwatig ng hiwalay na hatol o prosesong hindi tahasang nakasaad sa pangungusap.
translation_notes:
  register: Modernong Filipino na may dignidad at legal na linaw. Ginamit ang “tagapaghiganti sa dugo” upang mapanatili ang natatanging institusyong Hebreo; ginamit ang “nakitagpo” at “papatay” para sa natural at madaling maunawaang daloy. Ang “ito/rito” ay umiiwas sa magkakasunod na malabong panghalip habang malinaw na tumutukoy sa mamamatay-tao.
