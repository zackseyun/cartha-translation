language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֤ר וְ/לַ/תּוֹשָׁב֙ בְּ/תוֹכָ֔/ם תִּהְיֶ֛ינָה שֵׁשׁ הֶ/עָרִ֥ים הָ/אֵ֖לֶּה לְ/מִקְלָ֑ט לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: tl
  text: Ang anim na lungsod na ito ay magsisilbing kanlungan para sa mga anak ni Israel[a], sa dayuhang naninirahan, at sa naninirahang kasama nila[b], upang makatakas patungo roon ang sinumang nakapatay ng tao[c] nang hindi sinasadya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: Ang “dayuhang naninirahan” at “naninirahang kasama nila” ay salin ng dalawang magkaibang katawagang Hebreo (גֵּר at תּוֹשָׁב) para sa mga hindi katutubong taong naninirahan sa lipunan ng Israel.
    reason: cultural_note
  - marker: c
    text: 'Sa mas literal na anyo: “sinumang nanakit ng isang tao”; idyomang Hebreo ito na, sa kontekstong ito, ay tumutukoy sa sinumang naging sanhi ng kamatayan ng isang tao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Pinananatili ang karaniwang pambansa at tipanang katawagan ng Hebreo. Likas sa wikang biblikal na Tagalog ang “mga anak ni Israel,” habang maaaring gamitin ang mas tuwirang “mga Israelita” bilang alternatibo.
- source_word: גֵּר
  choice: dayuhang nakikipamayan
  rationale: Tumutukoy ito sa isang hindi katutubong taong naninirahan sa gitna ng Israel at saklaw ng proteksiyon ng pamayanan. Ipinahihiwatig ng “dayuhang nakikipamayan” kapwa ang kaniyang dayuhang pinagmulan at paninirahan sa komunidad.
- source_word: תּוֹשָׁב
  choice: naninirahang kasama nila
  rationale: Tumutukoy ito sa isang taong naninirahan sa lupain o pamayanan ngunit hindi kapantay ng katutubong kasapi. Gumamit ng ibang parirala kaysa sa גֵּר upang mapanatili ang dalawang magkaibang katawagang Hebreo nang hindi nagpapataw ng labis na tiyak na katayuang legal.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: Ang anim na lungsod na ito ay magsisilbing kanlungan
  rationale: Ang “magsisilbing” ay natural sa modernong Tagalog at malinaw na nagpapahayag ng legal na pagtatalaga ng mga lungsod para sa layuning kanlungan.
- source_word: לָנוּס שָׁמָּה
  choice: upang makatakas doon
  rationale: Ginagawang malinaw ng “upang” ang layuning ipinahahayag ng pawatas sa Hebreo, at pinananatili ng “doon” ang שָׁמָּה.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: ang sinumang nakapatay ng tao
  rationale: Sa kontekstong legal, ang parirala ay tumutukoy sa sinumang naging sanhi ng pagkamatay ng isang tao. Ang “nakapatay ng tao” ay malinaw at likas sa modernong Tagalog, samantalang ang mas literal na “nanakit sa isang tao” ay maaaring hindi malinaw na kamatayan ang tinutukoy.
- source_word: נֶפֶשׁ
  choice: tao
  rationale: Dito ang נֶפֶשׁ ay ang taong napatay, hindi isang hiwalay na di-materyal na “kaluluwa.”
- source_word: בִּשְׁגָגָה
  choice: nang hindi sinasadya
  rationale: Tumpak nitong ipinahahayag ang kawalan ng layuning pumatay, na siyang mahalagang pagkakaibang legal sa talata.
theological_decisions:
- issue: Ang may kasariang pambansa at tipanang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang anyong “mga anak ni Israel,” na salamin ng Hebreong pananalita at kinikilalang pambansang katawagan, habang inilalagay sa talababa ang mas maikli at likas na katumbas.
- issue: Ang dalawang magkaibang katayuan ng גֵּר at תּוֹשָׁב
  choice: dayuhang nakikipamayan, at naninirahang kasama nila
  alternative: dayuhan at pansamantalang naninirahan
  rationale: Pinananatiling magkaiba ang dalawang katawagan ngunit hindi labis na nililinaw ang eksaktong legal na hangganan ng mga ito, sapagkat hindi lubusang naipapaloob sa iisang modernong kategorya ang saklaw ng mga salitang Hebreo.
translation_notes:
  register: Makabago at marangal na Tagalog na angkop sa tekstong legal. Ginamit ang “lungsod” at “kanlungan” bilang malinaw at karaniwang bokabularyo. Pinanatili ang bahagyang pormal na “mga anak ni Israel” dahil isa itong nakaugaliang katawagang biblikal, at iniwasan ang mga teknikal na katawagang legal na maaaring magpataw ng modernong kategorya sa גֵּר at תּוֹשָׁב.
