  to: Ang anim na lungsod na ito ay magsisilbing kanlungan para sa mga anak ni Israel[a], sa dayuhang naninirahan, at sa naninirahang kasama nila[b], upang makatakas patungo roon ang sinumang nakapatay ng tao[c] nang hindi sinasadya.
