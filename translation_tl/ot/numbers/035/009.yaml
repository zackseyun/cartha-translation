base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Sinabi ni Yahweh kay Moises[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive na pandiwa mula sa דבר ay nagbubukas ng panibagong hakbang sa salaysay. Pinananatili ng “nagsalita” ang pagkakaiba nito sa kasunod na לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalang YHWH sa Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay tumutukoy sa taong kinausap; “kay” ang natural na anyong Filipino bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang matatag at madaling makilalang anyo ng pangalang משה sa modernong Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa mismong sasabihin sa kasunod na talata, nang hindi ipinag-iisa sa naunang “nagsalita.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalang YHWH ang hayagang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “ang PANGINOON”; ang talababa ay nagbibigay ng tradisyonal na salin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Sadyang pinanatili ang pormal na dobleng introduksiyon na “nagsalita … na sinasabi” dahil kapwa naroon ang וַיְדַבֵּר at לֵאמֹר sa Hebreo at sumusunod pa ang nilalaman ng pahayag.
