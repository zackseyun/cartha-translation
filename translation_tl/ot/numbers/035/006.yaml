  text: וְ/אֵ֣ת הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אֵ֚ת שֵׁשׁ עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָ/נֻ֥ס שָׁ֖מָּ/ה הָ/רֹצֵ֑חַ וַ/עֲלֵי/הֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּ/שְׁתַּ֖יִם עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: tl
  text: At ang mga lungsod na ibibigay ninyo sa mga Levita ay ang anim na lungsod na kanlungan, na ibibigay ninyo upang doon tumakas ang nakapatay[a]; bukod sa mga iyon, magbibigay kayo ng apatnapu't dalawang lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pumatay.” Sa kontekstong legal ng mga lungsod na kanlungan, hindi tinutukoy ng salitang Hebreo kung sinadya o di-sinasadya ang pagpatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: mga lungsod
  rationale: Ang עִיר ay maaaring tumukoy sa lungsod o bayan; ang “mga lungsod” ang angkop at palagiang katawagan sa konteksto ng paghahati ng mga lugar.
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Tuwirang ipinahahayag ang mga tatanggap ng mga lungsod.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: anim na lungsod na kanlungan
  rationale: Ang מִקְלָט ay isang lugar ng kanlungan o asilo; natural at malinaw sa modernong Filipino ang “mga lungsod na kanlungan.”
- source_word: לָנוּס שָׁמָּה
  choice: upang matakasan doon
  rationale: Pinananatili nito ang diwa ng נוּס na pagtakas at ang direksiyon ng שָׁמָּה na “doon,” habang natural na inuugnay sa taong nakapatay.
- source_word: הָרֹצֵחַ
  choice: ang nakapatay
  rationale: Sa legal na konteksto ng mga lungsod na kanlungan, hindi likas na tinutukoy ng salita kung sinadya o di-sinasadya ang pagpatay. Hindi ipinapalagay ng “nakapatay” ang layunin.
- source_word: וַעֲלֵיהֶם
  choice: bukod sa mga iyon
  rationale: Idyomatikong nagpapahayag ito ng pagdaragdag, hindi ng pisikal na posisyon.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: apatnapu't dalawang lungsod
  rationale: Natural na anyong Filipino para sa bilang, bagaman isahan ang anyo ng pangngalan sa karaniwang konstruksiyong pamilang sa Hebreo.
theological_decisions:
- issue: Kung sinadya o di-sinasadya ang pagpatay
  choice: nakapatay
  alternative: mamamatay-tao
  rationale: Hindi nilulutas ng talata mismo ang usapin ng layunin. Maaaring magpahiwatig ang “mamamatay-tao” ng sinadyang pagpaslang, kaya pinili ang mas neutral na “nakapatay.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga lungsod na kanlungan” bilang malinaw na katawagang legal, at iniwasan ang salitang nagtatakda agad na sinadya ang pagpatay.
