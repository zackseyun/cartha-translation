translation:
  language: tl
  text: Kaya magtalaga[a] kayo ng mga lungsod para sa inyong sarili. Ang mga iyon ay magiging mga lungsod na kanlungan para sa inyo, at doon tatakas ang sinumang nakapatay ng isang tao nang hindi sinasadya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pumili” o “magbukod” kayo ng mga lungsod para sa inyong sarili.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang nakapatay ng isang tao nang hindi sinasadya.” Tumutukoy ito sa isang taong nakapatay nang walang layuning pumatay, hindi sa isang taong sadyang pumaslang.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: Kaya magtalaga kayo
  rationale: Ang Hiphil ng קרה sa kontekstong legal ay tumutukoy sa pagpili o pagtatalaga. Natural at malinaw sa Filipino ang pautos na “magtalaga kayo,” habang ipinapakita ng “Kaya” ang pagpapatuloy mula sa naunang tagubilin.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: mga lungsod ... mga lungsod na kanlungan
  rationale: Pinananatili ang pag-uulit ng “mga lungsod” para sa diin at legal na linaw. Ang “mga lungsod na kanlungan” ay natural na katawagan sa Filipino para sa mga lungsod na inilaan bilang ligtas na matatakbuhan.
- source_word: מִקְלָט
  choice: kanlungan
  rationale: Tumutukoy ito sa isang protektadong lugar na matatakbuhan. Ang “kanlungan” ay malinaw, marangal, at angkop sa kontekstong ito.
- source_word: וְנָס שָׁמָּה
  choice: at doon tatakas
  rationale: Ang anyo ng pandiwa ay may panghinaharap na puwersa sa sunod-sunod na legal na tagubilin. Inilalapit ng “doon” sa Filipino ang lokatibong שָׁמָּה.
- source_word: רֹצֵחַ
  choice: ang sinumang nakapatay
  rationale: Iniiwasan ang “mamamatay-tao,” na karaniwang nagpapahiwatig ng sinadyang pagpaslang. Ang “nakapatay” ay hindi pa nagpapasiya tungkol sa layunin at umaayon sa kasunod na “nang hindi sinasadya.”
- source_word: מַכֵּה נֶפֶשׁ
  choice: nakapatay ng isang tao
  rationale: Bagaman literal na may larawan ng paghampas sa isang tao o buhay, sa kontekstong ito ay kamatayan ang resulta. Ang “nakapatay ng isang tao” ang pinakatuwiran at natural na Filipino.
- source_word: נֶפֶשׁ
  choice: isang tao
  rationale: Dito ang נֶפֶשׁ ay tumutukoy sa taong napatay, hindi sa di-materyal na “kaluluwa.”
- source_word: בִּשְׁגָגָה
  choice: nang hindi sinasadya
  rationale: Malinaw nitong ipinahahayag ang kawalan ng layuning pumatay at pinananatili ang legal na pagkakaiba sa sinadyang pagpaslang.
theological_decisions:
- issue: Legal na pag-uuri sa nakapatay
  choice: “ang sinumang nakapatay ... nang hindi sinasadya”
  alternative: “ang mamamatay-tao” o “ang mamamatay”
  rationale: Ang “mamamatay-tao” ay madaling maunawaan bilang sadyang mamamatay, ngunit tahasang nililimitahan ng בִּשְׁגָגָה ang pangyayari sa hindi sinasadyang pagkamatay. Hindi dapat magdagdag ang salin ng hatol na higit sa sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lungsod na kanlungan” bilang natural na pariralang legal at biblikal. Iniwasan ang “mamamatay-tao” dahil sa malakas nitong pahiwatig ng sinadyang pagpaslang.
