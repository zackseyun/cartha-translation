  text: וְ/הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ מֵ/אֲחֻזַּ֣ת בְּנֵי יִשְׂרָאֵ֔ל מֵ/אֵ֤ת הָ/רַב֙ תַּרְבּ֔וּ וּ/מֵ/אֵ֥ת הַ/מְעַ֖ט תַּמְעִ֑יטוּ אִ֗ישׁ כְּ/פִ֤י נַחֲלָת/וֹ֙ אֲשֶׁ֣ר יִנְחָ֔לוּ יִתֵּ֥ן מֵ/עָרָ֖י/ו לַ/לְוִיִּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: tl
  text: 'At ang mga lungsod na ibibigay ninyo mula sa lupang pag-aari ng mga anak ni Israel: mula sa mga may malaking mana ay maglaan kayo ng mas marami, at mula sa mga may maliit na mana ay maglaan kayo ng mas kaunti.[a] Bawat isa, ayon sa manang tatanggapin nila,[b] ay magbibigay ng ilan sa kanyang mga lungsod sa mga Levita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mula sa marami ay paramihin ninyo, at mula sa kaunti ay bawasan ninyo.” Ang diwa ay proporsiyonal na paglalaan mula sa mga tumanggap ng mas malaki at mas maliit na mana.
    reason: lexical_alternative
  - marker: b
    text: Ang “bawat isa” ay isahan sa Hebreo, ngunit maramihan ang pandiwang “tatanggapin nila.” Malamang na paisa-isang tinutukoy ang mga lipi o pangkat na sama-samang tumanggap ng mana.
    reason: source_ambiguity
lexical_decisions:
- source_word: הֶעָרִים
  choice: mga lungsod
  rationale: Ang עִיר ay maaaring tumukoy sa lungsod o bayan; pinananatili ng “mga lungsod” ang karaniwang katawagan sa konteksto ng mga lungsod para sa mga Levita.
- source_word: אֲחֻזַּת
  choice: lupaing pag-aari
  rationale: Tumutukoy ang אֲחֻזָּה sa hawak o pag-aaring lupain; nililinaw ng parirala ang konteksto ng pamana sa lupain nang hindi ito itinutumbas sa makabagong kategorya ng pribadong ari-arian.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pormal na anyo ng Hebreo at ang tradisyonal ngunit malinaw pa ring katawagan sa sambayanan ng Israel.
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: mula sa may marami ay maglaan kayo ng mas marami, at mula sa may kaunti ay maglaan kayo ng mas kaunti
  rationale: Ipinahahayag nito ang proporsiyonal na paglalaan ng mga lungsod habang hindi tahasang isinasaksak sa teksto ang ipinahihiwatig na “mga lipi” o “bahagi ng lupain.” Inilalagay sa talababa ang mas literal na anyo.
- source_word: אִישׁ
  choice: Bawat isa
  rationale: Taglay nito ang distributibong diwa ng isahang anyo nang hindi ipinapalagay na isang indibidwal na lalaki lamang ang tinutukoy; sa konteksto, kolektibong mga pangkat sa Israel ang nagbibigay.
- source_word: כְּפִי נַחֲלָתוֹ
  choice: ayon sa mana
  rationale: Likas na ipinahahayag sa Filipino ang idyomang “ayon sa sukat o proporsiyon ng kanyang mana” nang hindi nawawala ang mahalagang tema ng pamana.
- source_word: אֲשֶׁר יִנְחָלוּ
  choice: tatanggapin nila
  rationale: Pinananatili ang maramihang pandiwa ng Hebreo. Ang “tatanggapin bilang mana” ay pinaikli sa “tatanggapin” dahil maliwanag na ang tinutukoy ay mana.
- source_word: יִתֵּן מֵעָרָיו
  choice: magbibigay ng ilan sa kanyang mga lungsod
  rationale: Ipinahahayag ng “ilan sa” ang partitive na מִן, samantalang pinananatili ng “kanyang” ang isahang distributibong anyo.
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Ito ang likas at pamantayang katawagan sa Filipino para sa pangkat na tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maglaan” upang maging natural ang utos tungkol sa bilang ng mga lungsod, habang inilalahad sa talababa ang mas literal at eliptikong Hebreo. Sadyang pinanatili ang paglipat mula sa isahang “bawat isa/kanyang” tungo sa maramihang “nila” upang hindi burahin ang anyo at kolektibong tensiyon ng pinagmulan.
