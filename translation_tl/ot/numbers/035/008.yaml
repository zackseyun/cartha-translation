revisions:
- from: 'At tungkol sa mga lungsod na ibibigay ninyo mula sa lupaing pag-aari ng mga anak ni Israel: mula sa may marami ay maglaan kayo ng mas marami, at mula sa may kaunti ay maglaan kayo ng mas kaunti.[a] Bawat isa, ayon sa manang tatanggapin nila,[b] ay magbibigay ng ilan sa kanyang mga lungsod sa mga Levita.'
  to: 'At ang mga lungsod na ibibigay ninyo mula sa lupang pag-aari ng mga anak ni Israel: mula sa mga may malaking mana ay maglaan kayo ng mas marami, at mula sa mga may maliit na mana ay maglaan kayo ng mas kaunti.[a] Bawat isa, ayon sa manang tatanggapin nila,[b] ay magbibigay ng ilan sa kanyang mga lungsod sa mga Levita.'
  rationale: Nilinaw ang eliptikong paghahambing sa pamamagitan ng pagbanggit sa malaking o maliit na mana, na siyang batayan ng proporsiyonal na paglalaan sa konteksto. Inayos din ang parirala para sa pag-aari ng lupain. Pinanatili ang isahan–maramihang tensiyon sa huling pangungusap at ang kaugnay na talababa, sapagkat naroon ito sa anyong Hebreo.
