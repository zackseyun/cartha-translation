base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: tl
  text: Ang mga lunsod ay magiging kanlungan ninyo mula sa tagapaghiganti[a], upang hindi mamatay ang nakapatay hanggang sa humarap siya sa kapulungan para sa paghatol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagapaghiganti ng dugo” o “kamag-anak na tagapaghiganti.” Ang Hebreong go'el ay terminong nauugnay sa kamag-anak; dito, tumutukoy ito sa taong naghihiganti dahil sa pagbubo ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: ay magiging
  rationale: Ang anyong perpekto na may pang-ugnay ay may hinaharap at nagtatakdang diwa sa kontekstong legal; natural itong ipinahahayag sa Filipino bilang “ay magiging.”
- source_word: הֶעָרִים
  choice: Ang mga lunsod na ito
  rationale: Tumutukoy ito sa mga lunsod na itinalaga sa naunang konteksto. Nililinaw ng “na ito” ang anaporikong pagtukoy nang hindi binabago ang kahulugan.
- source_word: לְמִקְלָט
  choice: kanlungan
  rationale: Ang מִקְלָט ay lugar ng pagtakas at proteksiyon. Ang “kanlungan” ay likas, marangal, at hindi nag-aangkat ng makabagong teknikal na kahulugan ng asylum.
- source_word: מִגֹּאֵל
  choice: mula sa tagapaghiganti
  rationale: Sa batas tungkol sa pagpatay, ang גֹאֵל ay kamag-anak na naghihiganti para sa dugong nabubo. Maikli at malinaw ang “tagapaghiganti,” habang pinananatili sa talababa ang aspektong pampagkamag-anak.
- source_word: וְלֹא יָמוּת
  choice: upang hindi mamatay
  rationale: Ipinakikita ng sugnay ang layunin o bunga ng pagkakaroon ng kanlungan. Hindi tinutukoy ng salin ang tahasang tagagawa ng kamatayan, gaya ng Hebreo.
- source_word: הָרֹצֵחַ
  choice: ang nakapatay
  rationale: Maaaring tumukoy ang רֹצֵחַ rito sa taong nakapatay, kasama ang hindi sinasadyang pagpatay; hindi pa napagpapasyahan ang pananagutan niya. Iniiwasan ng “nakapatay” ang paunang hatol na kalakip ng “mamamatay-tao.”
- source_word: עַד עָמְדוֹ
  choice: hangga't hindi siya humaharap
  rationale: Ang infinitive construct pagkatapos ng עַד ay temporal. Sa Filipino, natural ang “hangga't hindi ... humaharap” para sa hangganang inaasahang matupad.
- source_word: לִפְנֵי הָעֵדָה
  choice: sa kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan na gumaganap ng tungkuling panghukuman. Ang “kapulungan” ay pormal ngunit madaling maunawaan.
- source_word: לַמִּשְׁפָּט
  choice: para sa paghatol
  rationale: Ang מִשְׁפָּט dito ay legal na paglilitis o pasya. Pinananatili ng “paghatol” ang lawak ng termino at hindi ito nililimitahan sa isang makabagong anyo ng paglilitis.
theological_decisions:
- issue: Katayuang legal ng הָרֹצֵחַ bago ang paghatol
  choice: ang nakapatay
  alternative: mamamatay-tao; pumatay
  rationale: Ipinagpapaliban mismo ng talata ang pangwakas na pasya hanggang sa pagharap sa kapulungan. Kaya hindi dapat paunang ipalagay ng salin na sadya o kriminal ang pagpatay.
- issue: Tiyak na diwa ng גֹאֵל sa batas tungkol sa pagpatay
  choice: tagapaghiganti sa pangunahing teksto, na may paliwanag sa talababa
  alternative: tagapaghiganti ng dugo; kamag-anak na tagapaghiganti
  rationale: May malawak na diwang pampagkamag-anak at pantubos ang גֹאֵל, ngunit dito ang tungkulin nito ay paghihiganti dahil sa dugong nabubo. Pinananatiling malinaw ang teksto at ang mas buong diwa ay inilalagay sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “lunsod,” “kanlungan,” at “kapulungan” upang mapanatili ang pormal na himig ng batas nang hindi nagiging lipas o sobrang teknikal. Ang “nakapatay” ay sadyang neutral hinggil sa antas ng pananagutan bago ang paghatol.
