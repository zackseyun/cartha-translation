    text: 'Sa Hebreo, “na pinahiran niya ng banal na langis.” Aktibo ang pandiwa, ngunit hindi tahasang tinutukoy ang paksa nito. Ginamit dito ang “isang hindi tinukoy na tao” upang huwag ipahiwatig na ang nakapatay ang nagpahid; maraming salin ang ginagawang balintiyak ito: “na pinahiran ng banal na langis.”'
