  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: tl
  text: At ililigtas ng kapulungan ang nakapatay mula sa kamay ng tagapaghiganti ng dugo[a]. Ibabalik siya ng kapulungan sa kanyang lunsod na kanlungan, na tinakasan niya, at maninirahan[b] siya roon hanggang sa mamatay ang kataas-taasang pari na pinahiran niya ng banal na langis.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagapaghiganti para sa dugong dumanak.” Ang pariralang Hebreo ay tumutukoy sa taong may legal na pananagutang ipaghiganti ang pagkamatay, karaniwan ay isang malapit na kamag-anak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mananatili” o “tatahan.”
    reason: lexical_alternative
  - marker: c
    text: 'Sa Hebreo, “na pinahiran niya ng banal na langis.” Hindi tahasang tinutukoy kung sino ang nagpahid. Maraming salin ang ginagawang balintiyak ito: “na pinahiran ng banal na langis.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: ililigtas
  rationale: Ang Hiphil ng נצל ay tumutukoy sa pagliligtas sa isang tao mula sa kapangyarihan ng iba; ang “ililigtas” ay malinaw sa kontekstong legal at mapagtanggol.
- source_word: הָעֵדָה
  choice: kapulungan
  rationale: Sa Mga Bilang, tumutukoy ito sa pamayanang nagkakatipon at gumaganap ng tungkuling panghukuman. Pinananatili ng “kapulungan” ang pormal at kolektibong diwa.
- source_word: הָרֹצֵחַ
  choice: ang nakapatay
  rationale: Sa kabanatang ito, maaari itong tumukoy sa taong nakapatay nang sinasadya o hindi sinasadya. Hindi agad ipinapalagay ng “nakapatay” na siya ay mamamatay-tao sa legal na kahulugan.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo na tumutukoy sa kapangyarihan o pagkakahawak ng isang tao.
- source_word: גֹּאֵל הַדָּם
  choice: tagapaghiganti ng dugo
  rationale: Tumutukoy ito sa taong may legal na pananagutang ipaghiganti ang dugong dumanak, karaniwang isang malapit na kamag-anak. Hindi idinagdag sa pangunahing teksto ang “kamag-anak” dahil hindi iyon tahasang binanggit sa parirala.
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: ibabalik siya
  rationale: Ang Hiphil ng שוב ay nangangahulugang ipabalik o dalhing muli sa dating lugar; natural at tuwiran ang “ibabalik siya.”
- source_word: עִיר מִקְלָטוֹ
  choice: kanyang lunsod na kanlungan
  rationale: Ito ang malinaw at natural na katawagan sa itinalagang lunsod na nagbibigay ng legal na kanlungan.
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: na tinakasan niya
  rationale: Ipinahihiwatig ng Hebreo ang lunsod na pinuntahan niya sa pagtakas. Ang “tinakasan niya” ay natural na Filipino para sa lugar na tinunguhan upang manganlong.
- source_word: וְיָשַׁב בָּהּ
  choice: maninirahan siya roon
  rationale: Ang ישב ay maaaring mangahulugang manirahan, manatili, o tumahan. Ang “maninirahan” ay kasalukuyan at natural na pananalita habang pinananatili ang diwa ng paninirahan sa lunsod.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: hanggang sa mamatay ang kataas-taasang pari
  rationale: Natural itong Filipino at tumpak na nagpapahayag ng hangganang itinakda ng pagkamatay ng may titulong הַכֹּהֵן הַגָּדֹל.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: na pinahiran niya
  rationale: Aktibo ang pandiwang Hebreo, ikatlong panauhang panlalaki na isahan, at ang pari ang layon. Pinananatili ng “pinahiran niya” ang hindi pinangalanang gumagawa sa halip na tahimik itong gawing balintiyak.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: ng banal na langis
  rationale: Malapit ito sa tiyak na pariralang Hebreo at malinaw na tumutukoy sa langis na ginagamit sa pagtatalaga.
theological_decisions:
- issue: Legal na katayuan ng הָרֹצֵחַ sa batas tungkol sa mga lunsod na kanlungan
  choice: Isinalin bilang “ang nakapatay.”
  alternative: “mamamatay-tao” o “pumapatay”
  rationale: Pinag-iiba ng kabanata ang sinasadyang pagpatay at di-sinasadyang pagkamatay. Ang “mamamatay-tao” ay magpapasiya agad ng kasalanang hindi pa ipinapataw ng legal na proseso sa talatang ito.
- issue: Hindi tahasang paksa ng מָשַׁח אֹתוֹ
  choice: Pinanatili ang aktibong anyong “na pinahiran niya.”
  alternative: “na pinahiran ng banal na langis” o “na pinahiran bilang pari”
  rationale: Aktibo ang pandiwa sa tekstong Hebreo at hindi pinangalanan ang gumagawa. Ang salin ay hindi nagdaragdag ng tiyak na tagapagpahid at hindi rin tahimik na ginagawang balintiyak ang pangungusap.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kapulungan” para sa pormal na pamayanang humahatol, “nakapatay” upang huwag agad ipalagay ang legal na pagkakasala, at “lunsod na kanlungan” bilang malinaw na katawagang institusyonal. Pinanatili ang bahagyang pagkaalangan ng huling sugnay dahil hindi tahasang binanggit sa Hebreo ang gumawa ng pagpapahid.
