base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: tl
  text: O kung dahil sa pagkapoot[a] ay sinaktan niya ang isang tao gamit ang kanyang kamay at namatay ang taong iyon, ang nanakit ay tiyak na papatayin; mamamatay-tao siya. Papatayin ng tagapaghiganti ng dugo[b] ang mamamatay-tao kapag nakatagpo niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa pagkamuhi” o “dahil sa pagkapoot.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tagapaghiganti ng dugo”; maaaring tumukoy ito sa kamag-anak na may tungkuling ipaghiganti ang dugong dumanak.
    reason: lexical_and_cultural_clarification
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: dahil sa poot
  rationale: Ipinahahayag nito ang pagkapoot o matinding alitan bilang motibo ng pananakit. Likas ito sa modernong Tagalog at malinaw ang legal na diin sa masamang hangarin.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: sinaktan niya ito ng kanyang kamay
  rationale: Pinananatili ang tahasang pagbanggit sa kamay bilang ginamit sa pananakit, gaya ng hinihingi ng legal na pagkakaiba sa talata.
- source_word: וַיָּמֹת
  choice: at namatay ito
  rationale: Pinananatili ang payak na pagkakasunod ng mga pangyayari sa Hebreo nang hindi dinaragdagan ang sanhi sa gramatika.
- source_word: מוֹת יוּמַת
  choice: dapat talagang patayin
  rationale: Ang “talagang” ay kumakatawan sa diin ng infinitive absolute, samantalang ang “dapat” ay naghahatid ng sapilitang hatol ng batas.
- source_word: הַמַּכֶּה
  choice: ang nanakit
  rationale: Natural at malinaw na tumutukoy sa taong nanakit sa biktima, nang hindi gumagamit ng mabigat o di-karaniwang katawagang legal.
- source_word: רֹצֵחַ הוּא
  choice: mamamatay-tao siya
  rationale: Dahil tahasang may poot ang kilos, ang tinutukoy ay sinasadyang pagpatay, hindi aksidenteng pagkamatay.
- source_word: גֹּאֵל הַדָּם
  choice: tagapaghiganti ng dugo
  rationale: Pinananatili ang natatanging legal na katawagan sa Israel nang hindi ipinapasok sa pangunahing teksto ang paliwanag tungkol sa pagiging kamag-anak.
- source_word: יָמִית
  choice: papatayin
  rationale: Direkta nitong ipinahahayag ang itinakdang pagpatay sa mamamatay-tao at umaangkop sa legal na konteksto.
- source_word: בְּפִגְעוֹ בוֹ
  choice: kapag nakatagpo niya ito
  rationale: Natural na Tagalog ito para sa pagkatagpo o pagsalubong sa tinutukoy na mamamatay-tao.
theological_decisions:
- issue: Ang legal na uri ng sinasadyang pagpatay
  choice: mamamatay-tao
  alternative: taong nakapatay
  rationale: Ang konteksto ng pagkilos dahil sa poot ay nagpapakitang sinasadyang pagpatay ang tinutukoy; pinananatili ng “mamamatay-tao” ang moral at legal na pagkakaiba nito sa di-sinasadyang pagpatay.
- issue: Ang kahulugan ng גֹּאֵל הַדָּם
  choice: tagapaghiganti ng dugo
  alternative: kam著-anak na tagapaghiganti sa dugo
  rationale: Pinananatili ng pangunahing salin ang pormal na institusyong legal. Inilalagay sa talababa ang ugnayang pampamilya na maaaring ipahiwatig ng גֹּאֵל upang hindi ito gawing higit na tahas kaysa sa mismong parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa tekstong legal. Pinanatili ang pag-uulit ng “papatayin” at ang pormal na katawagang “tagapaghiganti ng dugo” upang manatiling malapit sa estruktura at institusyong ipinapahayag ng Hebreo.
