  terminology: Pinalitan ang "tagapaghiganti sa dugo" ng "tagapaghiganti ng dugo," ang mas likas na Tagalog na katumbas ng גֹּאֵל הַדָּם. Pinanatili ang "lungsod-kanlungan" bilang teknikal na termino at ang neutral na "patayin" para sa וְרָצַח sa kontekstong ito.
