base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: tl
  text: at kung matagpuan siya ng tagapaghiganti ng dugo sa labas ng hangganan ng kanyang lungsod-kanlungan, at patayin ng tagapaghiganti ng dugo ang taong nakapatay, walang pananagutan sa dugo ang tagapaghiganti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “wala siyang dugo,” isang idyomang nangangahulugang hindi siya nagkakaroon ng pananagutan sa pagdanak ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: tagapaghiganti sa dugo
  rationale: Pinananatili nito ang legal na tungkulin ng taong awtorisadong gumanti dahil sa dugong dumanak, nang hindi idinaragdag sa mismong talata ang ugnayang pampamilya na hindi tahasang binanggit dito.
- source_word: מִחוּץ לִגְבוּל
  choice: sa labas ng hangganan
  rationale: Malinaw nitong ipinapahayag ang paglabas sa itinakdang saklaw ng proteksiyon ng lungsod-kanlungan.
- source_word: עִיר מִקְלָטוֹ
  choice: kanyang lungsod-kanlungan
  rationale: Ang “lungsod-kanlungan” ay maikli, natural, at nagpapanatili sa teknikal na katawagan para sa institusyong legal sa kabanatang ito.
- source_word: וְרָצַח
  choice: patayin
  rationale: Neutral ang pandiwa at hindi nito ipinapalagay na kriminal ang pagpatay, sapagkat tahasang sinasabi ng kasunod na sugnay na walang pananagutan sa dugo ang tagapaghiganti.
- source_word: הָרֹצֵחַ
  choice: ang taong nakapatay
  rationale: Tumutukoy ito sa taong nakapatay at tumakas sa lungsod-kanlungan; iniiwasan ng saling ito ang pahiwatig na sadyang pagpatay o murder ang ginawa niya.
- source_word: אֵין לוֹ דָּם
  choice: walang pananagutan sa dugo ang tagapaghiganti
  rationale: Ipinahahayag nito sa malinaw na modernong Tagalog ang Hebreong idyomang nagsasabing hindi nagkakaroon ng bloodguilt ang tagapaghiganti. Inulit ang tinutukoy na tao upang maiwasan ang malabong reperensiya ng panghalip sa Tagalog.
theological_decisions:
- issue: Moral at legal na puwersa ng רצח sa konteksto ng pagpatay na hindi pinananagot ng batas
  choice: Isinalin bilang “patayin,” hindi “paslangin” o “patayin nang labag sa batas.”
  alternative: Isalin bilang “paslangin” upang panatilihin ang mas mabigat na dating ng רצח sa ibang konteksto.
  rationale: Ipinapahayag mismo ng talata na walang pananagutan sa dugo ang tagapaghiganti. Ang salitang nagpapahiwatig ng kriminal na pagpatay ay magpapasok ng salungatang wala sa legal na pahayag ng Hebreo.
- issue: Tinutukoy ng אֵין לוֹ דָּם
  choice: Tahasan itong iniugnay sa tagapaghiganti sa dugo.
  alternative: 'Panatilihin ang panghalip: “wala siyang pananagutan sa dugo.”'
  rationale: Ang tagapaghiganti ang simuno ng pagpatay at siyang hindi nagkakaroon ng bloodguilt. Sa Tagalog, maaaring ipagkamaling tumukoy ang “siya” sa taong nakapatay, kaya nilinaw ang reperensiya nang hindi binabago ang legal na diwa.
translation_notes:
  register: Makabago ngunit marangal na legal na pananalita. Ginamit ang “lungsod-kanlungan” bilang malinaw na teknikal na katawagan at ang “taong nakapatay” upang hindi ipalagay na sinadya ang naunang pagpatay.
