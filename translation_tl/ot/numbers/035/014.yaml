id: NUM.35.14
reference: Numbers 35:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: tl
  text: Magtalaga[a] kayo ng tatlo sa mga lungsod sa ibayo ng Jordan[b], at ng tatlo sa mga lungsod sa lupain ng Canaan. Ang mga iyon ay magiging mga lungsod na kanlungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magbigay.” Literal na “magbigay” ang pandiwang Hebreo, ngunit dito ay nangangahulugang italaga o ibukod ang mga lungsod para sa layuning ito.
    reason: lexical_alternative
  - marker: b
    text: O “sa kabila ng Jordan” o “sa kabilang panig ng Jordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: magtalaga kayo
  rationale: Ang literal na kahulugan ng נתן ay “magbigay,” ngunit sa kontekstong legal na ito, tumutukoy ito sa pagtatalaga o pagbubukod ng mga lungsod para sa isang tiyak na layunin. Likas at malinaw sa makabagong Tagalog ang “magtalaga kayo.”
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: sa ibayo ng Jordan
  rationale: Pinananatili ng “sa ibayo ng Jordan” ang relasyonal at heograpikong diwa ng Hebreo nang hindi labis na nililinaw kung aling panig ang tinutukoy.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Isinasama nito ang tahasang salitang אֶרֶץ, “lupain,” at pinananatili ang diin sa teritoryo.
- source_word: עָרֵי מִקְלָט
  choice: mga lungsod na kanlungan
  rationale: Malinaw nitong ipinahahayag na ang mga lungsod ay mga takdang lugar ng proteksiyon, habang iniiwasan ang mga makabagong pampolitikang pahiwatig ng “asylum.”
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: tatlo sa mga lungsod ... at tatlo sa mga lungsod
  rationale: Ipinakikita ng tiyak na anyong “mga lungsod” na pumipili ng tigatlo mula sa mas malaking pangkat ng mga lungsod na tinatalakay na.
- source_word: תִּהְיֶינָה
  choice: ang mga iyon ay magiging
  rationale: Ipinahahayag nito ang magiging katayuan at layunin ng anim na itatalagang lungsod, gaya ng Hebreong imperfect ng היה sa kontekstong legal.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tuwirang anyong legal na “Magtalaga kayo,” at pinanatili ang heograpikong kalabuan ng pariralang tumutukoy sa panig ng Jordan.
