translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod,” “tirahan,” at “ari-arian” upang mapanatili ang legal na himig, habang ang “mga pastulan sa paligid” ay nagpapaliwanag sa espesipikong gamit at lokasyon ng מִגְרָשׁ.
