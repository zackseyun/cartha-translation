  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: tl
  text: Magiging tirahan nila ang mga lungsod, at ang mga lupang pastulan sa paligid ng mga ito[a] ay magiging para sa kanilang mga alagang hayop, mga ari-arian, at lahat ng kanilang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bukas na lupain” o “mga lupang panlahat.” Ang salitang Hebreo ay tumutukoy sa bukas na lugar sa paligid ng mga lungsod, na angkop lalo na para sa pagpapastol.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: mga lungsod
  rationale: Ang עִיר ay tumutukoy sa lungsod o bayan; pinananatili ng “mga lungsod” ang karaniwang terminolohiya sa legal na konteksto ng paglalaan.
- source_word: לָשָׁבֶת
  choice: magiging tirahan nila
  rationale: Ang infinitibo mula sa ישׁב ay nagpapahayag ng layuning panirahan; natural at malinaw sa modernong Filipino ang nominal na pariralang ito.
- source_word: מִגְרְשֵׁיהֶם
  choice: mga pastulan sa paligid ng mga ito
  rationale: Ang מִגְרָשׁ ay bukas na lupain sa paligid ng lungsod, na sa kontekstong ito ay ginagamit lalo na sa pagpapastol. Isinama ang lokasyon upang hindi ipakahulugang malalayong pastulan lamang.
- source_word: לִבְהֶמְתָּם
  choice: para sa kanilang mga alagang hayop
  rationale: Ang בְּהֵמָה rito ay kolektibong tumutukoy sa domestikadong mga hayop; malinaw at pangkaraniwan ang “mga alagang hayop.”
- source_word: לִרְכֻשָׁם
  choice: mga ari-arian
  rationale: Ang רְכוּשׁ ay tumutukoy sa pag-aari o mga tinatangkilik; ang “mga ari-arian” ay angkop sa legal at administratibong konteksto nang hindi nililimitahan sa isang uri ng pag-aari.
- source_word: וּלְכֹל חַיָּתָם
  choice: at lahat ng iba pa nilang hayop
  rationale: Ang חַיָּה ay maaaring mangahulugang buhay na nilalang o hayop. Dahil nauna nang binanggit ang בְּהֵמָה, nililinaw ng “iba pa” ang pagpapalawak sa lahat ng kanilang hayop nang hindi inuulit lamang ang unang kategorya.
