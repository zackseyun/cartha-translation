  naturalness: Malinaw at angkop ang rehistro. Mas maayos ang “mga lupang pastulan” kaysa sa “mga pastulan” lamang dahil mas natitiyak nito ang tinutukoy na lupain sa paligid ng mga lungsod. Pinahusay din ang daloy ng pangungusap at ang pananalita ng talababa.
