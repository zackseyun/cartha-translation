  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: tl
  text: Ngunit kung hinampas niya ang isang tao gamit ang isang kagamitang bakal[a] at namatay ang taong iyon, mamamatay-tao siya; dapat ngang patayin ang mamamatay-tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang bagay na bakal” o “isang kasangkapang bakal.” Malawak ang kahulugan ng salitang Hebreo at hindi nito tinutukoy ang isang partikular na uri ng sandata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Nagpapakilala ito ng kondisyong legal na kasunod at may bahagyang pagsalungat sa naunang kaso; natural itong pakinggan sa makabagong Filipino.
- source_word: בִּכְלִי בַרְזֶל
  choice: gamit ang isang bagay na bakal
  rationale: Malawak ang saklaw ng כְּלִי—maaaring kagamitan, kasangkapan, o bagay—kaya hindi ito nilimitahan sa isang sandata. Mas natural sa Filipino ang “bagay na bakal” kaysa sa posibleng makitid na “kasangkapang bakal.”
- source_word: הִכָּהוּ
  choice: hinampas niya ang tao
  rationale: Ang Hiphil ng נכה ay nangangahulugang humampas o manakit. Ginawang tahasan ang layon bilang “ang tao” upang maiwasan ang malabong sunod-sunod na panghalip sa Filipino.
- source_word: וַיָּמֹת
  choice: at namatay ito
  rationale: Pinananatili ang payak na pagkakasunod ng Hebreo nang hindi nagdaragdag ng mas tahasang pormulang sanhi gaya ng “kaya namatay.”
- source_word: רֹצֵחַ הוּא
  choice: mamamatay-tao siya
  rationale: Sa kontekstong legal, tinutukoy nito ang taong may pananagutang kriminal sa pagpatay; ang “mamamatay-tao” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: מוֹת יוּמַת
  choice: tiyak na dapat patayin
  rationale: Ipinahahayag nito kapwa ang obligasyong legal at ang diin ng infinitive absolute na sinusundan ng pandiwang passive.
- source_word: הָרֹצֵחַ
  choice: ang mamamatay-tao
  rationale: Pinananatili ang tiyak na pagtukoy at inuulit ang legal na pagkakakilanlan ng nagkasala.
theological_decisions:
- issue: Legal na pag-uuri sa רֹצֵחַ
  choice: mamamatay-tao
  alternative: taong nakapatay
  rationale: Ang talata ay hindi lamang nagsasabing may napatay kundi inuuri ang nanakit bilang may-salang mamamatay-tao at ipinapataw ang parusang kamatayan. Gayunman, hindi dinaragdagan ng salin ang teksto ng tahasang salitang “sinadya.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa tekstong legal. Iniwasan ang makalumang “papataying walang pagsala” at ang sobrang teknikal na pananalita. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang binibigyan nito ng alternatibong salin.
