  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: tl
  text: Huwag ninyong dungisan ang lupaing tinitirhan ninyo, na sa gitna nito ay nananahan ako, sapagkat ako, si Yahweh, ay nananahan sa gitna ng mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Israel” ay maaari ring isaling “mga Israelita” o “sambayanang Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְטַמֵּא
  choice: dungisan
  rationale: Ipinapahayag ng pandiwang ito sa Piel ang pagpaparumi sa ritwal o moral na diwa. Ang “dungisan” ay likas sa makabagong Tagalog at hindi nililimitahan ang kahulugan sa pisikal o pangkapaligirang polusyon.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa tiyak na lupaing tinitirhan ng Israel, hindi sa buong daigdig; kaya “lupain” ang angkop sa heograpikal at tipanang konteksto.
- source_word: יֹשְׁבִים בָּהּ
  choice: tinitirhan ninyo
  rationale: Likas na Tagalog ito para sa paninirahan sa isang lupain at pinananatili ang kaugnayan ng sugnay sa “lupain.”
- source_word: שֹׁכֵן
  choice: tinatahanan / nananahan
  rationale: Ang שכן ay tumutukoy sa pananatili o presensiyang naninirahan. Ginamit ang magkaugnay na anyong Tagalog upang mapanatili ang pag-uulit, habang umaayon sa balarila ng bawat sugnay.
- source_word: בְּתוֹכָהּ
  choice: na aking tinatahanan
  rationale: Ang literal na ideya ay “sa gitna nito.” Sa Tagalog, ang sugnay na ito ay natural na nagpapahayag na ang lupain mismo ang dako ng presensiya ni Yahweh, nang hindi binabago ang reperente.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabawal; malinaw at marangal ang “sapagkat” sa ganitong pangungusap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: sa gitna ng mga anak ni Israel
  rationale: Pinananatili nito ang larawan ng presensiya sa gitna at ang literal na ugnayang pampamilya ng בני ישראל, na nauunawaan sa konteksto bilang sambayanan ng Israel.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalang tipanan sa halip na palitan ng titulo.
- issue: Saklaw ng בני ישראל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ng pangunahing teksto ang anyong pampamilya at panlalaki ng Hebreo. Nililinaw sa talababa na sa konteksto ay tumutukoy ito sa sambayanan ng Israel at hindi lamang sa mga lalaking inapo.
- issue: Ugnayan ng dalawang pahayag tungkol sa paninirahan ng Diyos
  choice: na aking tinatahanan … nananahan sa gitna
  alternative: na sa gitna nito ay nananahan ako … nananahan sa gitna
  rationale: Pinananatili ang parehong heograpikal at pansambayanang paglalarawan ng presensiya ni Yahweh, nang hindi ipinapantay o pinaghihiwalay nang higit sa sinasabi ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “huwag ninyong” bilang likas na pautos na pagbabawal, “lupain” para sa tiyak na teritoryo, at “dungisan” upang mapanatili ang ritwal at moral na bigat ng talata. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
