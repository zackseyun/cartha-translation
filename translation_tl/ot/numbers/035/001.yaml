  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh kay Moises sa kapatagan ng Moab, sa tabi ng Jordan malapit sa Jerico, at sinabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive na anyo ng דבר ay nagpapasimula ng panibagong pangyayari ng pagsasalita sa salaysay; natural at pormal sa Filipino ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang natural na panandang Filipino para sa taong kinakausap; “Moises” ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: sa kapatagan ng Moab
  rationale: Ang עֲרָבוֹת ay tumutukoy sa malawak at patag na lupa o steppe; malinaw at pamilyar ang “kapatagan ng Moab.”
- source_word: עַל־יַרְדֵּן יְרֵחוֹ
  choice: sa tabi ng Jordan sa tapat ng Jerico
  rationale: Ang עַל ay nagpapahayag dito ng kinalalagyan malapit sa Jordan, samantalang ang Jerico ay nagsisilbing heograpikong pantukoy sa bahaging iyon ng ilog. Ang “sa tapat ng Jerico” ay natural at iniiwasang ipahiwatig na nasa loob mismo ng Jerico ang kapatagan.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ang infinitive na לֵאמֹר ay nagpapakilala sa kasunod na tuwirang pahayag. Sa modernong Filipino, mas natural ang hiwalay na “Sinabi niya,” kaysa sa literal ngunit mabigat na “na sinasabi.”
theological_decisions:
- issue: Pagpapangalan sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; hindi rin pinipili ang huling anyong “Jehovah.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pormulang pambungad ng salaysay, ngunit ginawang natural ang לֵאמֹר bilang “Sinabi niya,” upang maayos nitong ipakilala ang susunod na talata.
