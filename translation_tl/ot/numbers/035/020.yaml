  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: tl
  text: Ngunit kung itulak niya ang isang tao dahil sa poot, o may ihagis siya rito nang sinasadya[a], at mamatay ito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang may masamang hangarin” o “habang nananambang.” Ang salitang Hebreo ay nagpapahiwatig ng sinadya at mapanlabang layon, at maaaring kabilang ang pananambang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Nagpapakilala ito ng kondisyong salungat sa di-sinasadyang pangyayari sa naunang talata; natural na ipinahahayag ng “Ngunit kung” ang ganitong paglipat.
- source_word: בְּשִׂנְאָה
  choice: dahil sa poot
  rationale: Ipinahahayag ng pariralang Hebreo ang poot bilang motibo ng pagtulak; malinaw at likas ito sa modernong Tagalog.
- source_word: יֶהְדָּפֶנּוּ
  choice: itinulak niya ang kapwa niya
  rationale: Ang pandiwa ay tumutukoy sa pagtulak o pagtabig. Nililinaw ng “kapwa niya” ang magkaibang taong tinutukoy nang hindi nagpapasok ng tiyak na relasyong wala sa Hebreo.
- source_word: אוֹ
  choice: o
  rationale: Tuwirang nag-uugnay sa alternatibong kilos.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: batuhin ito
  rationale: Ang Hebreo ay literal na “naghagis sa kaniya,” na walang tahasang layon. Sa Tagalog, natural na naipapahayag ng “batuhin” ang paghagis ng isang bagay laban sa tao, bagaman hindi nito nililimitahan sa teksto ang bagay na inihagis.
- source_word: בִּצְדִיָּה
  choice: sinadyang
  rationale: Ipinahahayag nito ang sadyang mapaminsalang layon; ang posibleng mas tiyak na diwa ng pananambang o paghihintay upang umatake ay pinananatili sa talababa.
- source_word: וַיָּמֹת
  choice: at namatay ito
  rationale: Pinananatili ang payak na pagkakasunod at kinalabasan ng Hebreo nang hindi ginagawang higit na tahasan ang ugnayang sanhi.
