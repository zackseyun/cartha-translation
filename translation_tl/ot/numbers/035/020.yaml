translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa tekstong legal. Ginamit ang “kapwa niya” at pagkatapos ay “ito” upang maiwasan ang kalituhan ng magkakaparehong panghalip. Inilagay ang talababa sa “batuhin” dahil ang marka ay tumutukoy sa pinagsamang diwa ng paghagis at sinadyang mapanlabang layon.
