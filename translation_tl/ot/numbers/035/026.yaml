  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: tl
  text: Ngunit kung talagang lumabas ang nakapatay lampas sa hangganan ng kanyang lungsod-kanlungan na pinuntahan niya upang tumakas,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “lumabas lampas sa hangganan ng kanyang lungsod-kanlungan na pinuntahan niya upang tumakas.” Sa Hebreo, ginagamit ang infinitive absolute kasama ng pandiwang may panahunan (“lumabas ay lumabas”) upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahihiwatig nito ang pasubaling salungat sa naunang tuntunin; natural sa makabagong Filipino ang “Ngunit kung.”
- source_word: יָצֹא יֵצֵא
  choice: talagang lumabas
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa paglabas; pinananatili ng “talagang” ang diin nang hindi nagiging artipisyal ang pangungusap.
- source_word: הָרֹצֵחַ
  choice: ang nakapatay
  rationale: Sa konteksto ng mga lungsod-kanlungan, tumutukoy ito sa taong nakapatay ngunit hindi kinakailangang isang taong nahatulang sadyang pumatay; iniiwasan ng “nakapatay” ang labis na hatol na nasa “mamamatay-tao.”
- source_word: אֶת גְּבוּל
  choice: sa hangganan
  rationale: Kasama ng pandiwang “lumabas,” likas na nauunawaan itong paglabas o pagtawid sa labas ng hangganan.
- source_word: עִיר מִקְלָטוֹ
  choice: kanyang lungsod-kanlungan
  rationale: Malinaw at maikli itong salin ng teknikal na katawagan sa lungsod na inilaan bilang kanlungan, at pinananatili ang panghalip na hulapi.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: na tinakasan niya
  rationale: Ipinapahayag nito ang patungong lugar ng pagtakas; sa Filipino, ang “tinakasan” ay natural na maaaring mangahulugang lugar na pinuntahan upang tumakas.
theological_decisions:
- issue: Katayuang moral ng הָרֹצֵחַ
  choice: ang nakapatay
  alternative: ang mamamatay-tao
  rationale: Hindi awtomatikong itinuturing ng konteksto na sadyang pumatay ang taong sumilong; kaya pinananatili ang legal at moral na pagiging bukás ng katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod-kanlungan” bilang madaling maunawaang teknikal na katawagan, at “nakapatay” upang hindi ipalagay ang sinadyang pagpatay na hindi tiyak sa konteksto.
