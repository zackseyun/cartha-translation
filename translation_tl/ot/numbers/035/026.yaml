  source_fidelity: Kailangan ang rebisyon. Ang "na tinakasan niya" ay karaniwang nangangahulugang lugar o bagay na nilayasan/fleed from, samantalang ang אֲשֶׁר יָנוּס שָׁמָּה ay tumutukoy sa lungsod na pinuntahan niya sa pagtakas. Ang "sa hangganan" ay maaari ring mangahulugang nasa boundary lamang; dapat malinaw na lumampas siya rito.
