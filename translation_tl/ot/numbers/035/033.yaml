  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: tl
  text: Huwag ninyong dungisan ang lupaing tinitirhan ninyo[a], sapagkat dinudungisan ng dugo ang lupain. Hindi matutubos ang lupain dahil sa dugong ibinuhos dito[b], maliban sa dugo ng taong nagbuhos nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dungisan” ay tumutukoy sa moral at sagradong pagkontamina ng lupain, hindi lamang sa pisikal na polusyon.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Hindi malilinis ang lupain dahil sa dugong ibinuhos dito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: dungisan / dinudungisan
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa moral at sagradong pagkontamina ng lupain dahil sa pagdanak ng dugo. Ang “dungisan” ay likas sa modernong Tagalog at hindi lamang nagpapahiwatig ng pisikal o pangkapaligirang polusyon.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa lupaing tinitirhan ng Israel, hindi pangunahin sa buong daigdig. Pinananatili ng “lupain” ang teritoryal na diwa.
- source_word: כִּי הַדָּם הוּא
  choice: sapagkat dinudungisan ng dugo
  rationale: Ang הוּא ay nagbibigay-diin sa dugo bilang siyang sanhi ng pagdungis. Sapat na naipahahayag ito sa natural na ayos ng pangungusap sa Tagalog nang hindi nagdaragdag ng mabigat na “mismo.”
- source_word: יְכֻפַּר
  choice: magagawang pantubos
  rationale: Ang passive na anyo ng כפר ay tumutukoy sa pag-aalis ng pananagutang dulot ng dugong ibinuhos. Ang “pantubos” ay madaling maunawaan at nagpapanatili ng sagrado at moral na diwa, bagaman hindi nito ipinapahiwatig na salaping pantubos ang tinutukoy.
- source_word: וְלָאָרֶץ לֹא יְכֻפַּר לַדָּם
  choice: Walang magagawang pantubos para sa lupain dahil sa dugong ibinuhos doon
  rationale: Pinananatili nitong ang lupain ang apektadong bagay at iniuugnay ang pangangailangan nito ng pantubos sa dugong ibinuhos dito.
- source_word: שֻׁפַּךְ
  choice: ibinuhos
  rationale: Literal at natural itong paglalarawan sa pagdanak ng dugo; malinaw sa kontekstong legal na pagpatay ang tinutukoy.
- source_word: כִּי אִם
  choice: maliban sa
  rationale: Ipinakikilala nito ang tanging paraan o eksepsiyon.
- source_word: בְּדַם שֹׁפְכוֹ
  choice: sa dugo ng taong nagbuhos nito
  rationale: Ang hulaping pronominal ay bumabalik sa dugong ibinuhos. Nililinaw ng parirala na dugo ng pumatay ang tinutukoy, nang hindi ginagamit ang alanganing literal na “tagapagbuhos nito.”
theological_decisions:
- issue: Pagdungis sa lupain dahil sa pagdanak ng dugo
  choice: Inilalarawan ang pagdanak ng dugo bilang tunay na moral at sagradong pagdungis sa lupain, na hindi maaalis maliban sa dugo ng pumatay.
  alternative: Maaaring unawain ang wika bilang talinghaga lamang para sa kaguluhang panlipunan o bilang usapin lamang ng batas sibil.
  rationale: Ang pag-uulit ng חנף at ang paggamit ng כפר, kasama ng tuwirang ugnayan ng dugo at lupain, ay nagpapahiwatig ng higit sa kaguluhang panlipunan. Pinananatili ng salin ang tensiyong ito nang hindi nagdaragdag ng doktrinang wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lupain” upang panatilihin ang teritoryal na diwa, at ang magkaparehong salitang “dungisan/dinudungisan” upang maipakita ang pag-uulit sa Hebreo.
