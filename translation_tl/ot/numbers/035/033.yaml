  to: Huwag ninyong dungisan ang lupaing tinitirhan ninyo[a], sapagkat dinudungisan ng dugo ang lupain. Hindi matutubos ang lupain dahil sa dugong ibinuhos dito[b], maliban sa dugo ng taong nagbuhos nito.
