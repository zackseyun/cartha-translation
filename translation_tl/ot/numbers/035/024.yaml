translation:
  language: tl
  text: Kaya hahatol ang kapulungan sa pagitan ng nanakit at ng tagapaghiganti ng dugo[a], ayon sa mga tuntuning ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tagapaghiganti ng dugo,” isang katawagan sa taong may tungkuling ipaghiganti ang dugo ng isang kamag-anak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga pasiyang ito.” Ang salitang Hebreo ay maaaring tumukoy sa mga legal na tuntunin o mga hatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: Kaya hahatol
  rationale: Ang waw na kasunod ng naunang legal na kalagayan ay likas na naihahayag bilang bunga o susunod na hakbang; ang hinaharap na anyong “hahatol” ay angkop sa pamamaraang itinatakda ng batas.
- source_word: הָעֵדָה
  choice: ang kapulungan
  rationale: Tumutukoy sa sama-samang pamayanan ng Israel na gumaganap dito ng tungkuling panghukuman; pormal ngunit malinaw sa modernong Filipino.
- source_word: בֵּין ... וּבֵין
  choice: sa pagitan ng ... at ng
  rationale: Natural na katumbas sa Filipino ng inuulit na Hebreong pang-ukol, nang hindi nawawala ang ugnayan ng dalawang panig.
- source_word: הַמַּכֶּה
  choice: ang taong nanakit
  rationale: Pinananatili ang pagiging neutral ng participle mula sa נכה at hindi muna tinatawag ang tao na mamamatay-tao; hindi rin nagdaragdag ng tahasang layon na wala sa mismong talata.
- source_word: גֹּאֵל הַדָּם
  choice: tagapaghiganti ng dugo
  rationale: Pinananatili ang legal na idyoma at tungkulin ng taong naghihiganti dahil sa dugo ng isang kamag-anak, habang nagbibigay ng talababa para sa paliwanag.
- source_word: עַל
  choice: ayon sa
  rationale: Sa kontekstong legal, ipinahihiwatig nito na ang paghatol ay gagawin alinsunod sa nakasaad na mga pamantayan.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: mga tuntuning ito
  rationale: Ang מִשְׁפָּטִים ay maaaring tumukoy sa mga legal na tuntunin o pasiya; ang “mga tuntunin” ay malinaw at natural, habang pinananatili sa talababa ang alternatibong kahulugan.
theological_decisions:
- issue: Ang tungkuling panghukuman ng kapulungan sa usapin ng pagpatay
  choice: Inilalarawan ang kapulungan bilang humahatol sa pagitan ng taong nanakit at ng tagapaghiganti ng dugo, nang hindi pa ipinapalagay na napatunayang mamamatay-tao ang una.
  alternative: Ituring ang kapulungan bilang isang makitid na lupon lamang, o tawagin agad na “mamamatay-tao” ang taong nanakit.
  rationale: Ang Hebreo ay nagtatakda ng isang prosesong panghukuman ng kapulungan at pinananatiling bukas ang legal na pasiya sa yugtong ito.
translation_notes:
  register: Modernong Filipino na may marangal at legal na himig. Ginamit ang “kapulungan” upang ipakita ang sama-samang katawang pangkomunidad, at iniwasan ang “mamamatay-tao” upang hindi unahan ang hatol.
