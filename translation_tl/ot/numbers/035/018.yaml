  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: tl
  text: O kung may humampas sa isang tao gamit ang isang bagay na kahoy na hawak sa kamay[a], na maaaring ikamatay ng tao, at namatay ang taong iyon, mamamatay-tao ang humampas; tiyak na dapat patayin ang mamamatay-tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gamit ang isang kasangkapang yari sa kahoy na hawak sa kamay” o “gamit ang isang bagay na kahoy na hawak sa kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: gamit ang isang bagay na kahoy na hawak sa kamay
  rationale: Ang כְּלִי ay malawak na katawagan para sa isang bagay o kasangkapan. Sa konteksto ng mga sandatang bakal at bato sa mga katabing talata, pinananatili ng “bagay na kahoy” ang lawak ng termino, habang ipinahihiwatig ng יָד na ito ay hawak o ginagamit sa kamay.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: at maaaring ikamatay
  rationale: Inilalarawan ng sugnay ang kakayahan ng bagay na makamatay, hindi lamang ang aktuwal na kinalabasan sa kasong ito. Likas sa modernong Tagalog ang “maaaring ikamatay.”
- source_word: הִכָּהוּ
  choice: hinampas niya siya
  rationale: Ang נכה ay nangangahulugang humampas o tumama. Ang “hinampas” ay malinaw at hindi paunang ipinapalagay ang kamatayan bago ito sabihin sa kasunod na sugnay.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Tuwirang pinananatili nito ang pagkakasunod ng mga pangyayari sa Hebreo nang hindi nagdaragdag ng paliwanag.
- source_word: רֹצֵחַ
  choice: mamamatay-tao
  rationale: Sa legal na kontekstong nagbubukod sa sinasadyang pagpatay mula sa aksidenteng pagpatay, ang “mamamatay-tao” ay naghahayag ng hatol na moral at legal, hindi lamang ng katotohanang nakapatay ang isang tao.
- source_word: מוֹת יוּמַת
  choice: tiyak na dapat patayin
  rationale: Ang infinitive absolute na kasunod ng pandiwang passive ay nagbibigay-diin sa parusang kamatayan. Ang “tiyak na dapat patayin” ay nagpapanatili kapwa ng diin at ng legal na pangangailangan sa natural na Tagalog.
theological_decisions:
- issue: Legal na pag-uuri ng רֹצֵחַ sa batas tungkol sa pagpatay
  choice: Isinalin bilang “mamamatay-tao.”
  alternative: “taong nakapatay” o “tagapaslang”
  rationale: Ibinubukod ng agarang konteksto ang may-salang pagpatay mula sa di-sinasadyang pagpatay at itinatalaga rito ang parusang kamatayan. Ang “mamamatay-tao” ang pinakamalinaw na naghahatid ng legal at moral na hatol nang hindi nagdaragdag ng doktrinal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal. Pinanatili ang pag-uulit ng “mamamatay-tao” at ang mariing anyo ng parusang kamatayan mula sa Hebreo.
