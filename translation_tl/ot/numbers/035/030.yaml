  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: tl
  text: Sinumang pumatay ng tao, ang mamamatay-tao ay papatayin batay sa patotoo ng mga saksi; ngunit ang patotoo ng iisang saksi ay hindi dapat maging batayan upang hatulan ng kamatayan ang isang tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: pumatay ng tao
  rationale: Sa kontekstong legal, tumutukoy ang parirala sa taong nakapatay ng isang tao. Mas malinaw at natural sa modernong Tagalog ang “pumatay ng tao” kaysa sa literal na “humampas sa isang buhay.”
- source_word: נֶפֶשׁ
  choice: tao
  rationale: Dito, ang נֶפֶשׁ ay tumutukoy sa isang taong buhay, hindi sa “kaluluwa” bilang hiwalay sa katawan.
- source_word: לְפִי עֵדִים
  choice: batay sa patotoo ng mga saksi
  rationale: 'Ipinapahayag nito nang natural ang legal na idyomang literal na “ayon sa bibig ng mga saksi”: ang hatol ay nakasalig sa kanilang patotoo.'
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: ang mamamatay-tao ay papatayin
  rationale: Ginagamit ng Hebreo ang parehong ugat para sa mamamatay-tao at sa pagpatay sa kaniya. Pinananatili ng salin ang kapansin-pansing pag-uulit nang hindi tinatawag na pagpaslang ang legal na kaparusahan.
- source_word: הָרֹצֵחַ
  choice: mamamatay-tao
  rationale: Sa konteksto, ito ang taong napatunayang may-salang pumatay at napapailalim sa parusang kamatayan; mas tiyak ito kaysa sa pangkalahatang “nakapatay.”
- source_word: וְעֵד אֶחָד
  choice: ngunit ... iisang saksi
  rationale: Ang waw ay adversatibo rito dahil itinatambis ang sapat na patotoo ng maraming saksi sa di-sapat na patotoo ng isa lamang.
- source_word: לֹא יַעֲנֶה
  choice: hindi sapat ang patotoo
  rationale: Sa legal na gamit, ang pandiwa ay nangangahulugang magbigay ng patotoo. Sa negatibong sugnay, ipinagbabawal na gawing batayan ng parusang kamatayan ang nag-iisang patotoo.
- source_word: בְנֶפֶשׁ לָמוּת
  choice: upang hatulan ng kamatayan ang isang tao
  rationale: Ang siksik na pariralang legal ay tumutukoy sa patotoong laban sa isang tao na hahantong sa parusang kamatayan. Nililinaw ito sa likas na Tagalog nang hindi tinutukoy kung paano isasagawa ang hatol.
theological_decisions:
- issue: Sapat na bilang ng mga saksi sa kasong may parusang kamatayan
  choice: Ipinahayag na hindi sapat ang patotoo ng iisang saksi.
  alternative: Isalin nang literal na “ang isang saksi ay hindi magpapatotoo laban sa isang tao para sa kamatayan.”
  rationale: Ang sugnay ay tuntuning panghukuman tungkol sa bigat at kasapatan ng ebidensiya, hindi pangkalahatang pagbabawal sa isang saksi na magsalita. Hindi dinaragdagan ng salin ang bilang na kailangan lampas sa ipinahihiwatig ng pangmaramihang עֵדִים at tahasang pagtanggi sa iisa.
translation_notes:
  register: Pormal ngunit malinaw na wikang legal sa modernong Filipino Tagalog. Ginamit ang “mamamatay-tao,” “patotoo,” at “hatulan ng kamatayan” upang mapanatili ang dignidad at tiyak na diwa ng tekstong panghukuman. Walang footnote dahil maisasalin nang malinaw sa pangunahing teksto ang mga idyomang Hebreo.
