  register: Modernong Filipino na malinaw, dignified, at angkop sa tekstong legal. Ginamit ang “lunsod-kanlungan” bilang madaling maunawaang katawagan sa institusyong tinutukoy, nang hindi dinaragdagan ang kahulugan.
