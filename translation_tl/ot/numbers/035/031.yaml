base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: tl
  text: Huwag kayong tatanggap ng pantubos kapalit ng buhay ng isang mamamatay-taong may sala at nararapat mamatay,[a][b] sapagkat tiyak na dapat siyang patayin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabayaran” o “bayad na pantubos.” Ang salitang Hebreo ay tumutukoy sa bayad na nilalayong makahadlang sa parusa o makapagtamo ng paglaya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “para sa buhay o katauhan ng isang mamamatay-tao.” Ang diwa ay hindi maaaring tumanggap ng bayad upang iligtas ang buhay ng mamamatay-tao.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sapagkat papatayin nga siya.” Isang mariing anyo ito sa Hebreo na nagbibigay-diin sa katiyakan o obligasyon ng pagpatay bilang hatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: tatanggap
  rationale: Bagaman pangunahing nangangahulugang “kumuha,” sa legal na konteksto kasama ng כֹּפֶר ay natural itong tumutukoy sa pagtanggap ng bayad.
- source_word: כֹּפֶר
  choice: pantubos
  rationale: Tumutukoy ito sa bayad na naglalayong iligtas ang isang tao mula sa parusa o mapalaya siya; ang “pantubos” ay nagpapanatili sa legal na diwa nito.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: kapalit ng buhay ng isang mamamatay-tao
  rationale: Ang נֶפֶשׁ dito ay “buhay” o “tao”; sa konteksto, ang ipinagbabawal na bayad ay kapalit ng hindi pagkitil sa buhay ng mamamatay-tao.
- source_word: רֹצֵחַ
  choice: mamamatay-tao
  rationale: Tinutukoy ng kabanata ang pagkakaiba ng di-sinasadyang pagpatay at salang pagpatay; dito, ang taong may pananagutang mamatay ang tinutukoy.
- source_word: רָשָׁע לָמוּת
  choice: nararapat mamatay
  rationale: Sa kontekstong panghukuman, ipinahihiwatig nito na ang tao ay napatunayang may sala at nasa ilalim ng hatol na kamatayan. Natural sa modernong Tagalog ang “nararapat mamatay” habang pinananatili ang legal na pananagutan.
- source_word: כִּי מוֹת יוּמָת
  choice: sapagkat tiyak na dapat siyang patayin
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa katiyakan at obligasyon ng hatol; ipinahahayag ng “tiyak na dapat” ang dalawang aspektong ito.
theological_decisions:
- issue: Legal na bigat ng hatol na kamatayan
  choice: Ipinagbabawal ang pagtanggap ng bayad upang palitan o ipawalang-bisa ang hatol sa mamamatay-taong nararapat mamatay.
  alternative: Paglalarawan lamang ito ng kaugalian at hindi isang mahigpit na utos.
  rationale: Ang לֹא תִקְחוּ ay tuwirang pagbabawal, at ang mariing מוֹת יוּמָת ay nagpapakita ng umiiral na obligasyong panghukuman, hindi lamang ng karaniwang gawain.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pantubos” bilang salitang legal-redemptive, ang “mamamatay-tao” upang ibukod sa di-sinasadyang nakapatay, at ang “tiyak na dapat” upang mapanatili ang mariing puwersa ng Hebreo nang hindi nagiging lipas o labis na literal.
