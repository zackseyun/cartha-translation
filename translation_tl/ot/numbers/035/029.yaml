  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: tl
  text: At ang mga ito ay magiging isang tuntunin ng paghatol para sa inyo sa lahat ng inyong salinlahi, sa lahat ng lugar na tinitirhan ninyo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tuntunin sa paghatol” o “legal na tuntunin.” Pinagsasama ng pariralang Hebreo ang mga salitang tumutukoy sa isang itinakdang tuntunin at sa hudisyal na pasiya o pamamaraan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa lahat ng inyong pamayanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: At ... ay magiging
  rationale: Ipinahahayag ng anyong pandiwa sa kontekstong legal ang patuloy at itinakdang bisa ng mga probisyong binanggit.
- source_word: אֵלֶּה
  choice: ang mga ito
  rationale: Tumutukoy ito pabalik sa mga naunang probisyong legal at likas sa modernong Filipino.
- source_word: לָכֶם
  choice: ninyo
  rationale: Ang diwang 'para sa inyo' ay likas na naipapahayag sa Filipino sa pamamagitan ng pagmamay-aring 'ninyo' kasama ng 'tuntunin.'
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: tuntunin ninyo sa paghatol
  rationale: Pinananatili nito ang pagsasama ng isang itinakdang batas o tuntunin at ng hudisyal na paghatol o pamamaraan, nang hindi ito nililimitahan sa isang tiyak na hatol lamang.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng salinlahi ninyo
  rationale: Ipinapakita ang patuloy na bisa sa magkakasunod na henerasyon; ang 'lahat' ay nagpapalinaw sa saklaw na likas sa idyoma.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: sa lahat ng lugar na tinitirhan ninyo
  rationale: Malinaw at natural na salin ng mga lugar ng paninirahan, habang pinananatili ang buong heograpikong saklaw.
theological_decisions:
- issue: Saklaw ng חֻקַּת מִשְׁפָּט
  choice: tuntunin ... sa paghatol
  alternative: batas ng katarungan; legal na tuntunin
  rationale: Hindi tahasang nilulutas kung ang parirala ay pangunahing tumutukoy sa pamantayan, pasiya, o pamamaraang hudisyal; ang napiling salin ay nagpapanatili sa juridikal na diwa.
translation_notes:
  register: Modernong Filipino na may marangal na tonong pambatas. Ginamit ang 'salinlahi' sa halip na mas kolokyal na 'henerasyon,' at ang 'mga lugar na tinitirhan' para sa malinaw at malawak na kahulugan ng מוֹשְׁבוֹת.
