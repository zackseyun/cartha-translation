  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: tl
  text: Huwag din kayong tumanggap ng pantubos[a] para sa isang taong tumakas patungo sa kanyang lungsod-kanlungan[b], upang makabalik siya at manirahan sa lupain bago mamatay ang pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabayaran” o “bayad.” Ang Hebreong כֹּפֶר ay halagang pantubos o kabayarang ibinibigay bilang kapalit.
    reason: lexical_alternative
  - marker: b
    text: Siksik ang pagkakabuo ng Hebreo. Maaari rin itong unawain bilang pagbabawal sa bayad na may kaugnayan sa kanyang pagtakas patungo sa, pananatili sa, o pagbabalik mula sa lungsod-kanlungan bago mamatay ang pari.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: pantubos
  rationale: Tumutukoy ito sa halagang ibinabayad bilang kapalit ng hinihinging legal na kahihinatnan. Mas tiyak ang “pantubos” kaysa “bayad,” samantalang ang “suhol” ay nagdaragdag ng negatibong pagpapakahulugang hindi tahasang nasa salita.
- source_word: לָנוּס
  choice: para sa isang tumakas
  rationale: Ang pawatas ng נוּס ay nangangahulugang “tumakas.” Ginawang likas sa Tagalog ang parirala sa pamamagitan ng pagtukoy sa taong tumakas, habang itinatala sa talababa ang siksik at maaaring pag-iba-ibahin na ugnayang sintaktiko.
- source_word: עִיר מִקְלָטוֹ
  choice: lungsod na kanlungan niya
  rationale: Pinananatili nito ang legal na katawagan para sa itinakdang lungsod-kanlungan at ang hulaping paari, sa natural na modernong Tagalog.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: upang makabalik siya at manirahan sa lupain
  rationale: Ipinahahayag ng magkasunod na pawatas ang pagbabalik at muling paninirahan. Ang “manirahan” ay malinaw at dignified na modernong katumbas.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: bago mamatay ang pari
  rationale: Sa loob ng pagbabawal, ang punto ay hindi maaaring mapahintulutan sa pamamagitan ng bayad ang maagang pagbabalik bago mamatay ang pari. Iniiwasan ng “bago” ang posibleng maling pagkaunawa sa “hanggang.”
theological_decisions:
- issue: Saklaw ng pagbabawal sa pantubos kaugnay ng tumakas at ng kanyang pagbabalik mula sa lungsod-kanlungan
  choice: Ipinagbabawal ang pagtanggap ng pantubos na magpapahintulot sa tumakas na makabalik at manirahan sa lupain bago mamatay ang pari.
  alternative: Maaaring tukuyin ng pantubos ang pagtakas o ang pananatili niya sa lungsod-kanlungan, hindi lamang ang maagang pagbabalik mula roon.
  rationale: Siksik ang sintaks ng Hebreo. Pinananatili ng pangunahing salin ang malinaw na legal na pagbabawal at ang layuning pagbabalik, habang inilalahad sa talababa ang tunay na alternatibong pagbasa nang hindi pinipili ang isang makitid na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa tekstong legal. Ginamit ang “pantubos,” “lungsod na kanlungan,” at “pari” bilang madaling maunawaang mga katawagan; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
