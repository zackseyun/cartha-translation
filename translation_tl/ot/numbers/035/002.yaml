  text: צַו֮ אֶת בְּנֵ֣י יִשְׂרָאֵל֒ וְ/נָתְנ֣וּ לַ/לְוִיִּ֗ם מִֽ/נַּחֲלַ֛ת אֲחֻזָּתָ֖/ם עָרִ֣ים לָ/שָׁ֑בֶת וּ/מִגְרָ֗שׁ לֶֽ/עָרִים֙ סְבִיבֹ֣תֵי/הֶ֔ם תִּתְּנ֖וּ לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: tl
  text: Iutos mo sa mga anak ni Israel na magbigay sila sa mga Levita[a], mula sa kanilang minanang lupain, ng mga lunsod na matitirhan; at magbibigay kayo sa mga Levita ng mga lupang pastulan[b] sa palibot ng mga lunsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa bukas na lupa sa paligid ng isang lunsod, lalo na para sa pagpapastol at iba pang gamit ng pamayanan.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Iutos mo
  rationale: Pinananatili ang lakas ng pautos na anyo habang natural sa makabagong Filipino.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tuwirang sinasalamin ang literal na Hebreong pananalita at ang kolektibong katawagan sa bayang Israel; nililinaw sa talababa ang mas idyomatikong alternatibo.
- source_word: וְנָתְנוּ
  choice: na magbigay sila
  rationale: Ipinahahayag ang iniutos na kilos kasunod ng צַו sa natural na sintaks ng Filipino.
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Tuwirang tumutukoy sa mga tatanggap.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: mula sa lupaing minana nilang pag-aari
  rationale: Pinananatili ang magkakaugnay ngunit magkahiwalay na diwa ng נַחֲלָה, mana, at אֲחֻזָּה, pag-aaring lupain, nang hindi nagiging labis na teknikal.
- source_word: עָרִים לָשָׁבֶת
  choice: mga lunsod na matitirhan
  rationale: Natural na ipinahahayag ang layunin ng mga lunsod bilang tirahan.
- source_word: מִגְרָשׁ
  choice: mga pastulan
  rationale: Sa konteksto ng Bilang 35, tumutukoy ito sa bukas na lupa sa paligid ng lunsod, lalo na para sa pagpapastol at kaugnay na gamit ng pamayanan; may talababa upang mapanatili ang mas malawak na saklaw.
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: sa palibot ng mga lunsod
  rationale: Malinaw at natural na inilalarawan ang lokasyon ng mga lupain kaugnay ng mga lunsod.
- source_word: תִּתְּנוּ
  choice: ibibigay din ninyo
  rationale: Pinananatili ang paglipat mula sa ikatlong panauhang maramihan na 'sila' tungo sa ikalawang panauhang maramihan na 'ninyo'; ang 'din' ay likas na nag-uugnay sa ikalawang bagay na ibibigay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na katawagang “mga anak ni Israel” at ang pagbabago ng panauhan mula “sila” tungo sa “ninyo.” Ginamit ang “lunsod” para sa עָרִים at “pastulan” para sa praktikal na diwa ng מִגְרָשׁ, na pinalawak sa talababa.
