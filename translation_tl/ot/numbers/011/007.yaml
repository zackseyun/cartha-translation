base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: tl
  text: Ang manna ay gaya ng buto ng kulantro, at ang anyo nito ay gaya ng anyo ng bedelio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang bedelio ay isang mabangong dagta o malagkit na katas ng halaman. Hindi tiyak ang eksaktong tinutukoy ng salitang Hebreo; nauunawaan din ito ng ilan bilang isang sangkap na tulad ng perlas o kristal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: ang manna
  rationale: Tiyak na pangngalan ito na tumutukoy sa kilalang pagkain sa ilang; pinanatili ang nakasanayang salitang “manna” at ang tiyak na pantukoy.
- source_word: כִּזְרַע גַּד
  choice: gaya ng buto ng kulantro
  rationale: Ang כִּ ay naghahayag ng paghahambing, at ang גַּד ay karaniwang kinikilalang kulantro; malinaw at likas sa makabagong Filipino ang parirala.
- source_word: וְעֵינוֹ
  choice: at ang anyo nito
  rationale: Bagaman literal na “mata” ang עַיִן, tumutukoy ito rito sa nakikitang anyo o hitsura.
- source_word: כְּעֵין
  choice: ay gaya ng anyo ng
  rationale: Pinanatili ang pag-uulit ng salitang tumutukoy sa “anyo” upang maipakita ang paralelismo at diin ng Hebreo.
- source_word: הַבְּדֹלַח
  choice: bedelio
  rationale: Ginamit ang nakasanayang transliterasyon sapagkat hindi tiyak ang eksaktong tinutukoy ng salitang Hebreo; ipinaliwanag ang mga posibleng kahulugan sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “anyo” upang masalamin ang Hebreong pahayag, at inilagay ang talababa pagkatapos ng “bedelio,” ang salitang talagang ipinapaliwanag nito.
