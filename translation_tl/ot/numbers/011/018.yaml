    text: Maaari ring isalin na “Pabanalin ninyo ang inyong mga sarili.” Ang pandiwang Hebreo ay may diwa ng pagbubukod at paghahanda ng sarili para sa gagawin ni Yahweh.
    reason: lexical_alternative
  revision_rationale: Inalis ang di-tahasang dagdag na “kalagayan,” pinalitan ang kolokyal na “kasi” ng “sapagkat,” ginawang natural ang reflexive na maramihan, at itinuwid ang panipi. Pinanatili ang payak na “At” para sa Hebreong pang-ugnay at ang pag-uulit na “kakain kayo.”
