language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: tl
  text: At sabihin mo sa bayan, ‘Italaga ninyo ang inyong mga sarili[a] para sa bukas, at kakain kayo ng karne, sapagkat umiyak kayo sa pandinig ni Yahweh, na sinasabi, “Sino ang magpapakain sa amin ng karne? Sapagkat mabuti para sa amin sa Ehipto.” At bibigyan kayo ni Yahweh ng karne, at kakain kayo.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Pabanalin ninyo ang inyong mga sarili.” Ang pandiwang Hebreo ay may diwa ng pagbubukod at paghahanda ng sarili para sa gagawin ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאמַר
  choice: sabihin mo
  rationale: Ang imperfect na ikalawang panauhang panlalaki ay may puwersang pautos sa konteksto; natural itong ipinahahayag sa Tagalog bilang tuwirang utos.
- source_word: הִתְקַדְּשׁוּ
  choice: Italaga ninyo ang inyong sarili
  rationale: 'Pinananatili nito ang diwang panrelihiyon ng hitpael imperative: ihiwalay o ihanda ang sarili para sa gagawin ni Yahweh, nang hindi ito pinapantay sa karaniwang ‘maghanda.’'
- source_word: לְמָחָר
  choice: para sa bukas
  rationale: Ipinahahayag ang paghahandang nakatuon sa darating na araw at natural sa modernong Tagalog.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: at kakain kayo ng karne
  rationale: Ang בָּשָׂר ay tumutukoy rito sa karneng pagkain; ang kasunod ng utos ay may hinaharap o resultang diwa.
- source_word: בְּכִיתֶם
  choice: umiyak kayo
  rationale: Tumutukoy sa nauna nilang pagkilos na dahilan ng tugon; sapat na ipinakikita ng konteksto ang pagkakaugnay nito sa kasalukuyan.
- source_word: בְּאָזְנֵי יְהוָה
  choice: sa pandinig ni Yahweh
  rationale: Pinananatili ang Hebreong larawan na narinig ni Yahweh ang kanilang pag-iyak habang nananatiling malinaw sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Sino ang magpapakain sa amin ng karne?
  rationale: Ang hiphil ng אכל ay causative, kaya ang ‘magpapakain’ ay tuwirang nagpapanatili sa diwang ‘magbibigay upang makain’.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: Mabuti kasi ang kalagayan namin sa Ehipto
  rationale: Pinananatili ang pahayag na naging mabuti para sa kanila sa Ehipto nang hindi nagdaragdag ng tahasang paghahambing na wala sa Hebreo.
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: At bibigyan kayo ni Yahweh ng karne
  rationale: Ang payak na ‘At’ ay tumutugma sa Hebreong pang-ugnay at hindi ginagawang tahasan ang sanhi na ipinahihiwatig lamang ng konteksto.
- source_word: וַאֲכַלְתֶּם
  choice: at kakain kayo
  rationale: Pinananatili ang pag-uulit ng Hebreo para sa diin at bilang paghahanda sa pagpapaliwanag sa mga susunod na talata.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulong ‘PANGINOON.’
- issue: Diwa ng utos na הִתְקַדְּשׁוּ
  choice: Italaga ninyo ang inyong sarili
  alternative: Ihanda ninyo ang inyong sarili
  rationale: Pinananatili ng napiling salin ang sagradong diwa ng pagbubukod ng sarili para sa kilos ng Diyos, ngunit hindi tinutukoy kung anong partikular na ritwal ang kailangan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘bayan’ para sa kolektibong הָעָם, ang magalang na maramihang ‘ninyo/kayo,’ at pinanatili ang tuwirang pananalita at pag-uulit ng Hebreo.
