  to: Pagkatapos, isang hangin ang nagmula kay Yahweh at itinangay nito ang mga pugo mula sa dagat[a]. Ikinalat nito ang mga ito sa palibot ng kampo—humigit-kumulang isang araw na paglalakbay sa gawing ito at isang araw na paglalakbay sa gawing iyon, sa buong palibot ng kampo—at mga dalawang siko ang taas sa ibabaw ng lupa.[b]
