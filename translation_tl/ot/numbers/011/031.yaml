  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: tl
  text: Pagkatapos, isang hangin ang nagmula kay Yahweh at itinangay nito ang mga pugo mula sa dagat[a]. Ikinalat nito ang mga ito sa palibot ng kampo—humigit-kumulang isang araw na paglalakbay sa gawing ito at isang araw na paglalakbay sa gawing iyon, sa buong palibot ng kampo—at mga dalawang siko ang taas sa ibabaw ng lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang espiritu ang nagmula kay Yahweh.” Maaaring mangahulugan ang salitang Hebreo ng “hangin” o “espiritu,” ngunit higit na angkop dito ang “hangin” dahil ito ang nagdala sa mga pugo mula sa dagat.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga dalawang siko sa ibabaw ng lupa.” Maaaring inilalarawan nito ang taas ng pagkakalatag o paglipad ng mga pugo, sa halip na ang kapal ng bunton ng mga ito sa lupa. Ang dalawang siko ay humigit-kumulang 90 sentimetro.
    reason: alternative_reading
lexical_decisions:
- source_word: וְר֜וּחַ
  choice: isang hangin
  rationale: Maaaring mangahulugan ang רוּחַ ng “hangin,” “hininga,” o “espiritu.” Dahil ito ang nagdala sa mga pugo mula sa dagat, “hangin” ang pinakamalinaw na kahulugan sa konteksto, habang itinatala sa talababa ang tunay na alternatibo.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: nagmula kay Yahweh
  rationale: Ang נָסַע ay karaniwang may diwang pag-alis o paglalakbay. Dito, kasama ng מֵאֵת, ipinahihiwatig nito na kay Yahweh nagmula ang gumagalaw na hangin; natural sa Tagalog ang “nagmula kay Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa transliterasyong karaniwang ginagamit sa modernong Filipino sa halip na palitan ito ng isang titulo.
- source_word: וַיָּגָז שַׂלְוִים
  choice: tinangay nito ang mga pugo
  rationale: Bihira ang pandiwang גוז dito, ngunit sa konteksto ay inilalarawan nito ang puwersa ng hangin na nagdala sa mga pugo. Ang “tinangay” ay natural at malinaw sa Filipino.
- source_word: מִן הַיָּם
  choice: mula sa dagat
  rationale: Ito ang tuwiran at heograpikong kahulugan ng parirala; walang sapat na dahilan upang gawin itong “mula sa kanluran.”
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: Ibinagsak ang mga ito sa palibot ng kampo
  rationale: Maaaring mangahulugan ang נטשׁ ng paglatag, pag-iwan, o paghagis/pagbagsak. Ang “ibinagsak” ay angkop sa kilos ng hangin, at ang “sa palibot” ay umiiwas sa impresyong sa ibabaw mismo ng mga tolda bumagsak ang mga ibon.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: humigit-kumulang isang araw na paglalakbay sa gawing ito at isang araw na paglalakbay sa gawing iyon
  rationale: Pinananatili nito ang inuulit na estruktura at lawak na inilalarawan ng Hebreo sa natural na Filipino.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: sa buong palibot ng kampo
  rationale: Ipinahahayag ng “buong palibot” ang komprehensibong diwa ng parirala.
- source_word: וּכְאַמָּתַיִם
  choice: mga dalawang siko
  rationale: Pinananatili ang sinaunang yunit at isinasalin ang prefixed כְּ bilang pagtatantiya sa pamamagitan ng “mga.”
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: ang taas mula sa ibabaw ng lupa
  rationale: Literal itong “sa ibabaw/mukha ng lupa.” Sa ugnay nito sa dalawang siko, ang pangunahing salin ay taas mula sa lupa, ngunit hindi inaalis ang tekstuwal na posibilidad na kapal o taas ng lipad ang tinutukoy; nililinaw ito sa talababa.
theological_decisions:
- issue: Pagkilos ng hangin na nagmula kay Yahweh
  choice: Inilalarawan ang hangin bilang nagmula kay Yahweh at bilang kasangkapang nagdala sa mga pugo.
  alternative: Maaaring gawing mas dinamiko ang salin at sabihing si Yahweh mismo ang nagpadala sa mga pugo sa pamamagitan ng hangin.
  rationale: Tahasang inuugnay ng Hebreo kay Yahweh ang pinagmulan ng hangin, ngunit hindi nito detalyadong ipinaliliwanag ang mekanismo. Pinananatili ng salin ang sabay na banal na pagkilos at likas na paraan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pugo,” “kampo,” at “paglalakbay” bilang karaniwang bokabularyo; pinanatili ang “siko” para sa transparency sa sinaunang sukat at nagbigay ng tinatayang modernong katumbas sa talababa. Ang mga gitling ay tumutulong na malinaw na ihiwalay ang malawak na sukat sa palibot ng kampo.
