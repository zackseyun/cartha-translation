  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: tl
  text: Pagkatapos, bumalik si Moises sa kampo[a], kasama ang mga nakatatanda ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagkatapos, natipon si Moises sa kampo, kasama ang mga nakatatanda ng Israel.” Maaaring isalin nang mas literal ang pandiwang Hebreo, ngunit sa konteksto ay tumutukoy ito sa pagbabalik ni Moises sa kampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: bumalik
  rationale: Ang Niphal ng אסף ay literal na maaaring tumukoy sa pagkatipon o pagkakatipon, ngunit sa konteksto ay ipinahihiwatig nito ang pagbabalik ni Moises sa kampo matapos ang naunang pangyayari. Likas at malinaw sa modernong Tagalog ang “bumalik,” habang pinananatili sa talababa ang mas literal na anyo.
- source_word: אֶל הַמַּחֲנֶה
  choice: sa kampo
  rationale: Ang אֶל ay nagsasaad ng patutunguhan, at ang מַחֲנֶה ay kampo ng Israel. Ang “sa kampo” ang pinakanatural na Tagalog para sa pagbalik patungo roon; ang “papasok sa kampo” ay mas mapagpaliwanag kaysa sa kailangan.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: siya at ang matatandang pinuno ng Israel
  rationale: Pinananatili ng “siya at” ang tahasang, appositional na הוּא at nililinaw na kasama ni Moises ang mga pinuno. Ang “matatandang pinuno” ay naghahatid sa institusyonal na diwa ng זְקֵנִים nang mas malinaw sa ordinaryong modernong Tagalog kaysa sa “matatanda” lamang.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ang matatandang pinuno ng Israel
  rationale: Ito ang malinaw at dignidad na salin ng construct phrase, na tumutukoy sa kinikilalang mga elder o pinuno ng Israel, hindi lamang sa mga taong may edad.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “matatandang pinuno” upang maging malinaw ang papel ng mga elder, at pinanatili ang bahagyang diin ng Hebreong “siya at” sa halip na lubusang gawing “kasama ang.”
