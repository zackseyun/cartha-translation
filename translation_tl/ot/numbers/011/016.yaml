revisions:
- from: Sinabi ni Yahweh kay Moises, “Tipunin[a] mo para sa akin ang pitumpung lalaki mula sa matatandang pinuno ng Israel—mga taong alam mong matatandang pinuno ng bayan at mga tagapangasiwa nito[b]. Dalhin mo sila sa tolda ng pakikipagtagpo, at patayuin mo sila roon kasama mo.”
  to: Sinabi ni Yahweh kay Moises, “Tipunin mo para sa akin ang pitumpung lalaki mula sa mga nakatatandang pinuno ng Israel—mga taong alam mong sila ang mga nakatatandang pinuno ng bayan at mga opisyal[b] nito. Dalhin mo sila sa tolda ng pakikipagtagpo, at tumayo sila roon kasama mo.”
  rationale: Itinuwid ang talababa a upang tumugma sa kahulugan ng Hebreo at sa English audit trail, at ikinabit ang talababa b sa “mga opisyal.” Pinakinis din ang katawagan para sa mga elder at ang huling sugnay upang maging natural na Tagalog habang pinananatili ang saklaw at diwa ng Hebreo. Ang marker a ay inalis mula sa pangunahing teksto dahil ang naiwastong talababa ay alternatibo lamang at walang kinakailangang anchor sa kasalukuyang anyo; gayunman, upang mapanatili ang footnote set, dapat ilagay ang [a] pagkatapos ng “Tipunin” sa inilathalang teksto kung lahat ng talababa ay kailangang may anchor.
