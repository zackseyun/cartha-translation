  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Tipunin mo para sa akin ang pitumpung lalaki mula sa mga nakatatandang pinuno ng Israel—mga taong alam mong sila ang mga nakatatandang pinuno ng bayan at mga opisyal[b] nito. Dalhin mo sila sa tolda ng pakikipagtagpo, at tumayo sila roon kasama mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Maaari ring “mga tagapangasiwa”; tumutukoy ang salitang Hebreo sa mga opisyal na may tungkuling administratibo sa bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng kinikilalang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶסְפָה לִּי
  choice: Tipunin mo para sa akin
  rationale: Ipinahihiwatig ng אָסַף ang pagsasama-sama ng mga tao, at pinananatili ng “para sa akin” ang diwa ng לִּי.
- source_word: שִׁבְעִים אִישׁ
  choice: pitumpung lalaki
  rationale: Ang אִישׁ ay ginamit nang distributibo kasunod ng bilang at tumutukoy sa mga lalaking nasa tungkuling pamumuno.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: mula sa matatandang pinuno ng Israel
  rationale: Ang מִן ay nagsasaad ng pagpili mula sa mas malaking pangkat. Nililinaw ng “matatandang pinuno” na ang זְקֵנִים dito ay mga kinikilalang lider, hindi lamang matatanda sa edad.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: mga taong alam mong
  rationale: Natural itong anyo sa modernong Tagalog at pinananatili ang kaalaman ni Moises bilang batayan ng pagpili.
- source_word: זִקְנֵי הָעָם
  choice: matatandang pinuno ng bayan
  rationale: Pinananatili ang paglalarawan sa kanila bilang mga kinikilalang lider ng sambayanan.
- source_word: וְשֹׁטְרָיו
  choice: at mga tagapangasiwa nito
  rationale: Sa kontekstong administratibo, ang שֹׁטֵר ay isang opisyal o tagapangasiwa. Ang “nito” ay tumutukoy sa kolektibong “bayan.”
- source_word: וְלָקַחְתָּ אֹתָם
  choice: Dalhin mo sila
  rationale: Bagaman maaaring literal na “kunin,” higit na natural ang “dalhin” dahil may tinutukoy na patutunguhan.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pakikipagtagpo
  rationale: Pinananatili nito ang tiyak na katawagan sa santuwaryo bilang toldang inilaan sa pakikipagtagpo, nang hindi ito ginagawang pangkalahatang “tabernakulo.”
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: at patayuin mo sila roon kasama mo
  rationale: Ipinapahayag nito ang utos na sila ay tumayo o humarap doon sa piling ni Moises.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” samantalang hindi ginagamit ang mas huling anyong “Jehovah.”
- issue: Kalikasan ng mga זְקֵנִים
  choice: matatandang pinuno
  alternative: matatanda
  rationale: Ang konteksto ay pagpili ng kinikilalang mga lider ng Israel. Nililinaw ng salin ang tungkulin nila nang hindi nagdaragdag ng partikular na istrukturang panrelihiyon.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang “matatandang pinuno” ay mas madaling maunawaan kaysa sa “mga matanda” lamang; ang “tolda ng pakikipagtagpo” ay pormal ngunit natural na katawagan sa santuwaryo. Inilagay ang mga panandang [a] at [b] kaagad sa mga salitang talagang tinatalakay ng kani-kanilang talababa.
