id: NUM.11.12
reference: Numbers 11:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: tl
  text: Ako ba ang naglihi sa buong bayang ito? Ako ba ang nagsilang sa kanya, na sabihin mo sa akin, ‘Kargahin mo siya sa iyong kandungan, gaya ng pagkarga ng isang tagapag-alaga[a] sa batang sumususo,’ patungo sa lupaing ipinangako mo nang may panunumpa sa kanyang mga ninuno?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagapagkalinga” o “yaya”; tumutukoy ang Hebreo sa taong nangangalaga sa isang bata.
    reason: lexical_alternative
  - marker: b
    text: 'Isahan sa Hebreo ang “kanya,” “siya,” at “kanyang,” sapagkat itinuturing ang buong bayan bilang iisang bata. Maaari ring isalin sa maramihan: “kanila,” “sila,” at “kanilang mga ninuno.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: Ako ba ang naglihi
  rationale: Pinananatili ng tanong na retorikal at ng pandiwang “naglihi” ang mariing unang panauhan at ang metaporang maternal ng Hebreo.
- source_word: כָּל הָעָם הַזֶּה
  choice: sa buong bayang ito
  rationale: Ang “bayan” ay likas na pangngalang kolektibo sa Tagalog at tumutugma sa isahang עָם.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: Ako ba ang nagsilang sa kanya
  rationale: Ipinagpapatuloy ng “nagsilang” ang larawan ng panganganak; ang “kanya” ay nagpapanatili sa bayang Israel bilang iisang batang inilalarawan.
- source_word: כִּי תֹאמַר אֵלַי
  choice: kaya sinabi mo sa akin
  rationale: 'Ipinahahayag nito nang natural ang batayan ng reklamo ni Moises: hindi niya ipinanganak ang bayan, ngunit inutusan siyang gumanap na parang magulang nito.'
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: Kalungin mo siya
  rationale: Ang “kalungin” ay natural na Tagalog para sa pagkarga nang malapit sa dibdib o kandungan at pinagsasama ang kilos at larawang ipinahihiwatig ng parirala.
- source_word: הָאֹמֵן
  choice: isang tagapag-alaga
  rationale: Malawak ang saklaw ng salita para sa taong nangangalaga sa bata; hindi nito labis na tinutukoy ang kasarian o tiyak na tungkulin.
- source_word: הַיֹּנֵק
  choice: sa batang sumususo
  rationale: Tuwirang pinananatili ang partikular na larawan ng batang nasa edad pa ng pagsuso.
- source_word: עַל הָאֲדָמָה
  choice: hanggang sa lupain
  rationale: Sa konteksto ng pagdadala patungo sa ipinangakong hantungan, natural sa Tagalog ang “hanggang sa lupain.”
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ
  choice: ipinangako mo nang may panunumpa
  rationale: Nililinaw nito ang diwa ng Niphal ng שׁבע bilang pangakong pinagtibay ng sumpa, sa halip na ang hindi likas na “isinumpa mo ang lupain.”
- source_word: לַאֲבֹתָיו
  choice: sa kanyang mga ninuno
  rationale: Ang “mga ninuno” ay natural at saklaw ang mga ama ng Israel; pinananatili ng “kanyang” ang isahang kolektibong pagtukoy.
theological_decisions:
- issue: Isahang kolektibong pagtukoy sa Israel
  choice: Panatilihin ang “kanya/siya/kanyang” para sa bayang inilalarawan bilang isang bata
  alternative: Gamitin ang “kanila/sila/kanilang” para sa mas karaniwang pagtukoy sa maraming tao
  rationale: Isahan ang mga hulaping Hebreo at inilalarawan ang buong bayan bilang iisang batang inaalagaan. Nauunawaan sa Tagalog ang personipikasyong ito, ngunit itinala ang maramihang alternatibo dahil natural din iyon.
- issue: Saklaw ng הָאֹמֵן
  choice: tagapag-alaga
  alternative: yaya o tagapagkalinga
  rationale: Hindi tiyak sa konteksto ang eksaktong papel ng tagapagdala. Ang “tagapag-alaga” ay hindi nagdaragdag ng kasarian o tungkuling hindi tahasang ipinapahayag ng teksto.
- issue: Panunumpa tungkol sa lupain
  choice: ipinangako mo nang may panunumpa
  alternative: isinumpa mong ibibigay
  rationale: Pinananatili nito ang lakas ng wikang tipan at panunumpa nang hindi nagmumukhang isinumpa o nilait ng Diyos ang lupain.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na mga tanong na retorikal. Pinanatili ang matinding metaporang maternal at ang personipikasyon sa Israel bilang isang bata. Iniwasan ang masyadong teknikal o makalumang pananalita; ginamit ang “nang may panunumpa” upang malinaw at natural na maipahayag ang wikang tipan.
