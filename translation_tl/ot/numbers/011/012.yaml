  naturalness: Makabago at marangal ang pangkalahatang Filipino. Mas natural at mas malinaw sa larawang pag-aaruga ang “Kargahin mo siya sa iyong kandungan,” at ang “na sabihin mo sa akin” ay maayos na naghahayag ng retorikal na tanong.
  terminology: Ang “bayan,” “naglihi,” “nagsilang,” “tagapag-alaga,” “batang sumususo,” at “mga ninuno” ay angkop. Ang “ipinangako mo nang may panunumpa” ay wastong naghahayag ng panunumpa ng Diyos hinggil sa lupain nang hindi maling ipinahihiwatig na ang lupain mismo ang isinumpa.
