  source_fidelity: 'Tumpak ang salin sa pagkakasunod ng tatlong kilos sa Hebreo: dumaing ang bayan kay Moises, nanalangin si Moises kay Yahweh, at humupa ang apoy. Ang “dumaing” ay angkop sa צעק sa kontekstong apurahang paghingi ng tulong, at ang “humupa” ay maingat na naghahatid ng diwa ng שקע nang hindi tahasang sinasabing lubusang naapula ang apoy.'
  naturalness: Likas, malinaw, at marangal ang modernong Tagalog. Ang paghahati sa dalawang pangungusap at ang “Pagkatapos” ay nagbibigay ng natural na daloy habang pinananatili ang sunod-sunod na aspekto ng mga pandiwang Hebreo.
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה. Ang “Moises,” “bayan,” “nanalangin,” at “apoy” ay angkop sa rehistro ng salaysay. Ang talababa ay wastong nakakabit sa “humupa” at nagbibigay ng leksikal na alternatibo nang hindi nagdadagdag ng kahulugan.
