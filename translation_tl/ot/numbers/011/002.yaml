id: NUM.11.2
reference: Numbers 11:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: tl
  text: Dumaing ang bayan kay Moises, at nanalangin si Moises kay Yahweh. Pagkatapos, humupa[a] ang apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lumubog.” Ipinahihiwatig ng pandiwang Hebreo na ang apoy ay humina o humupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: dumaing
  rationale: Ang pandiwang צעק ay tumutukoy rito sa apurahang paghingi ng tulong dahil sa matinding hirap. Likas sa makabagong Tagalog ang “dumaing” at malinaw nitong ipinahihiwatig na kay Moises nakatuon ang kanilang pagsusumamo.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang עַם ay kolektibong tumutukoy sa sambayanan ng Israel. Ang “bayan” ay maikli, marangal, at natural sa salaysay.
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Ipinakikita ng אֶל ang taong pinatutungkulan ng pagdaing; ang “kay Moises” ang likas na katumbas sa Tagalog.
- source_word: וַיִּתְפַּלֵּל
  choice: nanalangin
  rationale: Ang hitpael ng פלל ay karaniwang nangangahulugang manalangin. Hindi ginamit ang mas interpretatibong “namagitan” bagaman namamagitan si Moises sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַתִּשְׁקַע
  choice: humupa
  rationale: Ang שקע ay may diwang paglubog o paghupa. Kapag apoy ang simuno, malinaw at natural ang “humupa,” nang hindi ipinapalagay na agad at lubusang naapula ang apoy.
- source_word: הָאֵשׁ
  choice: ang apoy
  rationale: Tuwirang katumbas ito ng אֵשׁ at tumutukoy sa apoy na binanggit sa naunang talata.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Ang “Yahweh” ang mas malapit na transliterasyon at hindi nito pinapalitan ng titulo ang pangalan.
- issue: Kung tahasang tatawaging pamamagitan ang panalangin ni Moises
  choice: nanalangin
  alternative: namagitan
  rationale: Bagaman malinaw sa konteksto na para sa bayan ang panalangin, ang pandiwa mismo ay “nanalangin.” Pinananatili ng salin ang tuwirang kahulugan nang hindi nagdaragdag ng teolohikal na katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dumaing” para sa apurahang paghingi ng tulong at “humupa” para sa likas na paglalarawan sa paghina ng apoy. Hinati sa dalawang pangungusap upang maging natural ang daloy, habang pinananatili ang pagkakasunod-sunod ng mga pangyayari.
