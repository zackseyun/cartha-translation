  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: tl
  text: sa loob ng isang buong buwan, hanggang sa lumabas ito sa inyong mga butas ng ilong at maging kasuklam-suklam ito sa inyo[a], sapagkat itinakwil ninyo si Yahweh na nasa gitna ninyo, at umiyak kayo sa harap niya, na sinasabi, ‘Bakit pa tayo lumabas mula sa Ehipto?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maging pandirì ito sa inyo.” Matinding pagkasuklam ang ipinahahayag ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: sa loob ng isang buong buwan
  rationale: Ang idyoma ay tumutukoy sa tagal na isang kumpletong buwan; natural at malinaw ito sa modernong Tagalog.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: lumabas ito sa mga butas ng inyong ilong
  rationale: Pinananatili nito ang matingkad at kongkretong larawang tumutukoy sa mga butas ng ilong.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: at kasuklaman ninyo
  rationale: Ipinahahayag ng זָרָא ang matinding pagkasuklam o pandidiri; likas at tuwiran ang pandiwang Tagalog.
- source_word: יַעַן כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng parusa sa isang marangal ngunit kasalukuyang rehistro.
- source_word: מְאַסְתֶּם
  choice: itinakwil ninyo
  rationale: Saklaw nito ang sadyang pagtanggi at paghamak nang hindi labis na nililimitahan ang emosyonal na himig.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: na nasa gitna ninyo
  rationale: Tumutukoy ito sa presensiya ni Yahweh sa pamayanan at iniiwasan ang maling diwang nasa loob ng bawat indibidwal.
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: at umiyak kayo sa harap niya
  rationale: Pinananatili ang hayagang pag-iyak at ang kaugnayang diwa ng paggawa nito sa presensiya niya.
- source_word: לָמָּה זֶּה
  choice: Bakit pa
  rationale: Natural na ipinahahayag sa Tagalog ang mapanumbat at nagsisising lakas ng idyomang Hebreo nang hindi dinaragdagan ng hiwalay na ideya.
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: tayo lumabas mula sa Ehipto
  rationale: Pinananatili ang bokabularyo ng paglabas na mahalaga sa salaysay ng Exodo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; ang transliterasyong Yahweh ang nagpapanatili rito bilang personal na pangalan sa halip na gawing titulo.
- issue: Likas na presensiya ni Yahweh sa אֲשֶׁר בְּקִרְבְּכֶם
  choice: na nasa gitna ninyo
  alternative: na nasa loob ninyo
  rationale: Ang konteksto ay ang presensiya ni Yahweh sa gitna ng buong pamayanan, hindi isang pahayag tungkol sa panloob na pananahan sa bawat tao.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang matingkad na larawang Hebreo tungkol sa mga butas ng ilong, ang banal na pangalang Yahweh, at ang lakas ng reklamo sa “Bakit pa,” nang hindi pinapakinis ang tindi ng hatol.
