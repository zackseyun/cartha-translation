source:
  edition: WLC
  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: tl
  text: Ngunit may dalawang lalaking nanatili sa kampo. Eldad ang pangalan ng isa, at Medad naman ang pangalan ng ikalawa. Dumapo sa kanila ang Espiritu. Kabilang sila sa mga nakatala[a], ngunit hindi sila lumabas patungo sa tolda[b]. At nagpropesiya sila sa kampo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabilang sila sa mga nakarehistro.” Literal sa Hebreo, “kabilang sila sa mga nakasulat.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na tumutukoy ito sa Tolda ng Tipanan ayon sa konteksto ng pangyayaring ito.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: nanatili
  rationale: Ipinapahayag ng שׁאר na ang dalawa ay nanatili o naiwan. Pinananatili ng “nanatili” ang di-tiyak na dahilan kung bakit hindi sila sumama, nang hindi ipinahihiwatig na may sadyang nag-iwan sa kanila.
- source_word: בַּמַּחֲנֶה
  choice: sa kampo
  rationale: Karaniwang lokatibong salin ng מַחֲנֶה at natural sa modernong Filipino sa dalawang paglitaw nito sa talata.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: dalawang lalaki
  rationale: Tiyak na panlalaki ang pariralang Hebreo, kaya ang “dalawang lalaki” ang tuwirang katumbas.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: Eldad ang pangalan ng isa, at Medad naman ang pangalan ng ikalawa
  rationale: Malapit ito sa pormula ng Hebreo habang natural sa Filipino; pinananatili ng “ikalawa” ang tahasang הַשֵּׁנִי.
- source_word: אֶלְדָּד / מֵידָד
  choice: Eldad / Medad
  rationale: Karaniwang transliterasyon ng mga pangalang pantangi.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: Lumukob sa kanila ang Espiritu
  rationale: Ipinahihiwatig ng נוח ... על ang pagdating at pamamalagi ng Espiritu sa ibabaw o sa kanila. Ang “lumukob” ay dignificado at malinaw na naglalarawan ng pagkilos mula sa Diyos nang hindi ginagawang pisikal lamang ang “pagdapo.”
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: Kabilang sila sa mga nakatala
  rationale: Ang כְּתֻבִים ay literal na “mga nakasulat/nakatala.” Ipinakikita ng salin na kasama sila sa talaan, ngunit hindi nito labis na tinutukoy ang uri o paraan ng pagtatala.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: ngunit hindi sila lumabas patungo sa tolda
  rationale: Ipinakikita ng hulaping direksiyonal sa אֹהֱלָה ang pagpunta sa tolda. Hindi pinalalawak sa pangunahing teksto ang “tolda” bilang “Tolda ng Tipanan,” sapagkat הָאֹהֶל lamang ang nasa talata.
- source_word: וַיִּתְנַבְּאוּ
  choice: nagpropesiya sila
  rationale: Tuwirang ipinapahayag nito ang gawaing propetiko ng hitpael ng נבא, nang hindi idinaragdag ang di-tiyak na aspektong “nagsimulang.”
theological_decisions:
- issue: Kung ang הָרוּחַ ay isasaling “Espiritu” o “espiritu”
  choice: Espiritu
  alternative: espiritu
  rationale: Sa agarang konteksto, ito ang Espiritung mula sa Diyos na nagbibigay-kakayahan kay Moises at sa matatanda. Ang malaking titik ay kumikilala sa tinutukoy ng teksto nang hindi nagdaragdag ng mas malawak na pormulasyong doktrinal.
- issue: Kung tahasang tatawaging “Tolda ng Tipanan” ang הָאֹהֱלָה
  choice: tolda
  alternative: Tolda ng Tipanan
  rationale: Malakas na ipinahihiwatig ng konteksto na ito ang Tolda ng Tipanan, ngunit “ang tolda” lamang ang mismong sinasabi ng Hebreo. Pinananatili sa pangunahing teksto ang anyong iyon at inilalagay sa talababa ang kontekstuwal na pagkakakilanlan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal ang ginamit. Iniwasan ang mga makalumang anyong gaya ng “sumakanila,” at pinanatili ang maikling, pasalaysay na ritmo ng Hebreo. Inilagay ang mga pananda ng talababa sa mismong mga pariralang nililinaw ng bawat tala.
