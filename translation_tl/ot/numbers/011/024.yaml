base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: tl
  text: Lumabas si Moises at sinabi sa bayan ang mga salita ni Yahweh. Tinipon niya ang pitumpung lalaki mula sa mga matatanda ng bayan at pinatayo sila[a] sa palibot ng tolda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inilagay sila” o “itinalaga sila sa kanilang puwesto.” Literal na “pinatayo sila” ang pandiwang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Literal na “ang tolda”; malamang na ang tolda ng tipanan ang tinutukoy ayon sa konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Tuwirang ipinahahayag ng pandiwang יצא ang paglabas mula sa dating kinaroroonan; natural at malinaw sa makabagong Tagalog ang “lumabas.”
- source_word: וַיְדַבֵּר אֶל־הָעָם אֵת דִּבְרֵי יְהוָה
  choice: sinabi sa bayan ang mga salita ni Yahweh
  rationale: Pinananatili ng “mga salita” ang kongkretong anyo ng דִּבְרֵי, habang ang “sinabi sa bayan” ay natural na pagsasalin ng דבר אֶל sa salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinatinig ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַיֶּאֱסֹף
  choice: tinipon
  rationale: Ang אסף ay nangangahulugang tipunin o pagsama-samahin; “tinipon” ang pinakanatural sa kontekstong ito.
- source_word: שִׁבְעִים אִישׁ
  choice: pitumpung lalaki
  rationale: Ang אִישׁ ay panlalaki at tumutukoy rito sa mga lalaking pinili mula sa mga pinuno ng bayan.
- source_word: מִזִּקְנֵי הָעָם
  choice: mula sa mga matatandang pinuno ng bayan
  rationale: Sa konteksto, ang זְקֵנִים ay hindi lamang matatanda sa edad kundi kinikilalang mga pinuno. Nililinaw iyon ng likas na pariralang Tagalog nang hindi ginagawa itong pormal na titulong wala sa Hebreo.
- source_word: וַיַּעֲמֵד אֹתָם
  choice: pinatayo sila
  rationale: Ang Hiphil ng עמד ay literal na “pinatayo” o “ginawang tumayo”; pinananatili ng saling ito ang causative na anyo at hindi labis na binibigyang-kahulugan ang pagkakalagay.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: sa palibot ng tolda
  rationale: Literal na “ang tolda” ang הָאֹהֶל. Hindi idinagdag sa pangunahing teksto ang “Tipanan” sapagkat wala rito ang buong pariralang Hebreo para sa tolda ng tipanan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng titulong “PANGINOON.”
- issue: Kasarian ng שִׁבְעִים אִישׁ
  choice: pitumpung lalaki
  alternative: pitumpung tao
  rationale: Panlalaki ang אִישׁ at tumutukoy sa kontekstong ito sa mga lalaking matatandang pinuno; hindi ito ginawang neutral sa kasarian.
- issue: Pagkakakilanlan ng הָאֹהֶל
  choice: tolda
  alternative: tolda ng tipanan
  rationale: Bagaman malamang na tolda ng tipanan ang tinutukoy ayon sa konteksto, “ang tolda” lamang ang tahasang nasa Hebreo. Pinanatili ang pagkakaibang ito at inilagay sa talababa ang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong Israel at “matatandang pinuno” upang maipahayag ang tungkuling panlipunan ng זְקֵנִים nang hindi maging lipas o malabo. Inayos ang mga pananda ng talababa upang direktang sumunod sa mga salitang kanilang ipinapaliwanag.
