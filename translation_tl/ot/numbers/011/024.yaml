revisions:
- from: Kaya lumabas si Moises at sinabi sa bayan ang mga salita ni Yahweh. Tinipon niya ang pitumpung lalaki mula sa mga matatandang pinuno ng bayan at pinatayo sila[a] sa palibot ng tolda.[b]
  to: Lumabas si Moises at sinabi sa bayan ang mga salita ni Yahweh. Tinipon niya ang pitumpung lalaki mula sa mga matatanda ng bayan at pinatayo sila[a] sa palibot ng tolda.[b]
  rationale: Inalis ang “Kaya” upang hindi magdagdag ng ugnayang inferensiyal na wala sa Hebreo. Pinalitan ang “mga matatandang pinuno” ng “mga matatanda ng bayan” upang panatilihin ang social-role sense ng זקנים nang hindi tahasang magdagdag ng titulong “pinuno.” Pinanatili ang mga anchor ng talababa at ang maingat na pangunahing saling “tolda.”
