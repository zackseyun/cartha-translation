revisions:
- from: Kumilos ang mga tao at buong araw na iyon, buong gabing iyon, at buong sumunod na araw ay namulot sila ng mga pugo. Kahit ang pinakakaunti ang napulot ay nakapagtipon ng sampung homer[a][b]. Pagkatapos, inilatag nila ang mga iyon para sa kanilang sarili sa buong palibot ng kampo.
  to: Bumangon ang mga tao; buong araw na iyon, buong gabing iyon, at buong sumunod na araw ay namulot sila ng mga pugo. Ang taong pinakakaunti ang nakuha ay nakapagtipon ng sampung homer[a][b]. Inilatag nila ang mga iyon para sa kanilang sarili sa buong palibot ng kampo.
  rationale: Pinalitan ang pangkalahatang “Kumilos” ng “Bumangon” upang masundan ang pandiwang Hebreo at inayos ang pangungusap para sa natural na Filipino. Nilinaw ang paksa ng “pinakakaunti” bilang tao, nang hindi dinaragdagan ang kahulugan. Pinanatili ang mga talababa at ang pag-iingat sa hindi tiyak na leksikal na alternatibo.
