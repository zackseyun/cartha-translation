translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pugo,” “namulot,” at “kampo” bilang karaniwang salitang madaling maunawaan. Pinanatili ang “homer” bilang teknikal na sinaunang yunit at ipinaliwanag ito sa talababa.
