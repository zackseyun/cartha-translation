base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: tl
  text: Bumangon ang mga tao; buong araw na iyon, buong gabing iyon, at buong sumunod na araw ay namulot sila ng mga pugo. Ang taong pinakakaunti ang nakuha ay nakapagtipon ng sampung homer[a][b]. Inilatag nila ang mga iyon para sa kanilang sarili sa buong palibot ng kampo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang homer ay isang malaking sinaunang takal para sa tuyong bagay. Hindi tiyak ang eksaktong katumbas nito sa makabagong sukat; ipinakikita ng talata na napakarami ng natipon kahit ng taong pinakakaunti ang nakuha.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “sampung kargang-asno” kung ang חֳמָרִים ay uunawain ayon sa kaugnayan nito sa salitang Hebreo para sa asno, sa halip na bilang karaniwang takal na “homer.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: Kumilos ang mga tao
  rationale: Ang literal na “bumangon” ay maaaring magpahiwatig lamang ng pagbangon mula sa pagkakahiga. Sa konteksto, ipinakikilala ng קום ang masiglang pagkilos ng buong bayan, kaya natural at tumpak ang “kumilos.”
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: buong araw na iyon, buong gabing iyon, at buong sumunod na araw
  rationale: Pinananatili nito ang tatlong magkakasunod na yugto at ang diin ng Hebreo sa napakahaba at halos walang patid na pamumulot.
- source_word: וַיַּאַסְפוּ אֶת־הַשְּׂלָו
  choice: namulot sila ng mga pugo
  rationale: Ang “namulot” ang natural na Filipino para sa paulit-ulit na pagkuha at pagtitipon ng mga ibong nakakalat sa paligid; ang maramihang “mga pugo” ay angkop sa konteksto.
- source_word: הַמַּמְעִיט אָסַף
  choice: Kahit ang pinakakaunti ang napulot ay nakapagtipon
  rationale: Ipinahahayag ng participle na הַמַּמְעִיט ang taong pinakamaliit ang nakalap. Nililinaw ng “kahit” ang diwa na napakalaki pa rin ng pinakamababang dami nang hindi nagdaragdag ng diwa sa teksto.
- source_word: עֲשָׂרָה חֳמָרִים
  choice: sampung homer
  rationale: Ang חֹמֶר ay karaniwang malaking takal para sa tuyong bagay. Pinanatili ang pangalan ng sinaunang yunit upang maiwasan ang huwad na eksaktong modernong katumbas.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: inilatag nila ang mga iyon para sa kanilang sarili
  rationale: Sinasalamin nito ang pandiwa, ang nagbibigay-diin na cognate infinitive, at ang לָהֶם, ngunit hindi ipinapalagay kung ang layunin ay pagpapatuyo o ibang pagproseso.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: sa buong palibot ng kampo
  rationale: Natural nitong ipinahahayag ang malawak at paikot na distribusyon sa paligid ng kampo.
