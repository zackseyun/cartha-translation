base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: tl
  text: Kaya tinawag niyang Kibrot-hataava[a] ang lugar na iyon, sapagkat doon nila inilibing ang mga taong naghangad nang sakim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kibrot-hataava ay malamang na nangangahulugang “Mga Libingan ng Pagnanasa” o “Mga Libingan ng Sakim na Paghahangad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: Kaya tinawag niyang … ang lugar na iyon
  rationale: Pinananatili ang tahasang isahang paksa ng pandiwang Hebreo at ang sunod-sunod na daloy ng salaysay, ngunit likas na isinasalin sa modernong Tagalog ang idyomang literal na “tinawag ang pangalan ng lugar.”
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: Kibrot-hataava
  rationale: Isinalin sa baybay na madaling basahin sa Tagalog ang pangalang Hebreo, habang inilagay sa talababa ang malamang na kahulugan nito.
- source_word: כִּי שָׁם קָבְרוּ
  choice: sapagkat doon nila inilibing
  rationale: Ang כִּי ay nagbibigay ng dahilan sa ipinangalan sa lugar; ang “sapagkat” ay marangal at malinaw, at ang “doon nila inilibing” ay tuwirang katumbas ng locative at pandiwang maramihan.
- source_word: הָעָם הַמִּתְאַוִּים
  choice: ang mga taong naghangad nang sakim
  rationale: Ipinahahayag ng hitpael participle ang mga taong nagpadaig sa matinding pagnanasa. Nililinaw ng “nang sakim” na hindi ito karaniwang paghahangad lamang at hindi rin nililimitahan sa seksuwal na pagnanasa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sapagkat” upang panatilihin ang pormal na himig ng salaysay, at iniwasan ang “pagnanasa” sa pangunahing teksto bilang nag-iisang paglalarawan dahil maaari itong mapakahulugang seksuwal sa kasalukuyang gamit.
