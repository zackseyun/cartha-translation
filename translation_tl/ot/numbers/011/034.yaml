  source_fidelity: Tumpak na naipapahayag ng salin ang sunod-sunod na pagkilos ng isahang pandiwang Hebreo (“tinawag niyang”), ang pagpapangalan sa lugar, ang ugnayang sanhi na ipinakikilala ng כִּי, at ang maramihang “nila inilibing.” Ang “mga taong naghangad nang sakim” ay angkop na salin ng הָעָם הַמִּתְאַוִּים at hindi nito nililimitahan ang pagnanasa sa seksuwal na kahulugan.
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang ayos na “tinawag niyang … ang lugar na iyon” ay idiomatiko at marangal; ang “sapagkat” ay akma sa register ng salaysay.
  terminology: Ang “Kibrot-hataava” ay isang nababasang Tagalog na transliterasyon ng pangalan ng lugar. Maayos na inilalagay ng talababa ang malamang na kahulugan nito, habang pinananatili ang pangalan sa pangunahing teksto. Ang “pagnanasa” sa talababa ay nababalanse ng “sakim na paghahangad,” kaya hindi ito kinakailangang unawain sa makitid na seksuwal na diwa.
