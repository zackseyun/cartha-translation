  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: tl
  text: Isang kabataang lalaki ang tumakbo at nag-ulat kay Moises[a], at sinabi, “Nagpopropesiya sina Eldad at Medad sa kampo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Tumakbo ang kabataang lalaki at nag-ulat kay Moises.” May tiyak na pantukoy sa Hebreo sa “kabataang lalaki,” at ang pandiwa ay maaari ring mangahulugang “nagbalita” o “nagbigay-alam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: Tumakbo
  rationale: Tuwirang ipinahahayag ng רוץ ang pagtakbo at pinananatili nito ang sigla ng salaysay.
- source_word: הַנַּעַר
  choice: ang isang kabataang lalaki
  rationale: Maaaring tumukoy ang נַעַר sa batang lalaki, kabataan, o kabataang lalaki. Bagaman may tiyak na pantukoy sa Hebreo, natural sa Tagalog ang “ang isang” sa unang pagpapakilala sa di-pinangalanang tagapagbalita.
- source_word: וַיַּגֵּד לְמֹשֶׁה
  choice: ibinalita kay Moises
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi, mag-ulat, o magbigay-alam. Ang “ibinalita” ay natural sa konteksto ng agarang pag-uulat at inihahanda ang tuwirang sipi.
- source_word: וַיֹּאמַר
  choice: '[hindi hiwalay na isinalin bago ang tuwirang sipi]'
  rationale: Sa natural na Tagalog, sapat nang ipakilala ng “ibinalita” ang kasunod na mismong sinabi; ang pagdaragdag ng “at sinabi” ay magiging paulit-ulit ngunit hindi nawawala ang nilalaman o pagkakasunod ng salaysay.
- source_word: אֶלְדָּד וּמֵידָד
  choice: Sina Eldad at Medad
  rationale: Isinalin sa karaniwang baybay ang mga pangalang pantangi at ginamit ang pantukoy na “sina” para sa dalawang tao.
- source_word: מִתְנַבְּאִים
  choice: nagpapahayag bilang mga propeta
  rationale: Ang Hitpael participle ng נבא ay tumutukoy sa nagpapatuloy na gawaing propetiko. Mas malinaw sa karaniwang modernong Tagalog ang pariralang ito kaysa sa di-gaanong natural na “nagpopropesiya,” habang hindi tinutukoy kung ano ang nilalaman ng kanilang pahayag.
- source_word: בַּמַּחֲנֶה
  choice: sa kampo
  rationale: Ang מַחֲנֶה ay kampo ng Israel sa ilang; ang “sa kampo” ang payak at natural na katumbas.
theological_decisions:
- issue: Kahulugan ng gawaing propetiko ng Eldad at Medad
  choice: nagpapahayag bilang mga propeta
  alternative: nagsasalita nang may inspirasyon / nagpopropesiya
  rationale: Pinananatili ang pangkalahatang diwa ng נבא nang hindi ipinapalagay ang tiyak na nilalaman, paraan, o teolohikal na katangian ng kanilang pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “kabataang lalaki” upang maiwasan ang kalabuan ng “binata” tungkol sa katayuang sibil, at “nagpapahayag bilang mga propeta” para sa malinaw ngunit hindi sobrang interpretatibong paglalarawan ng patuloy na gawaing propetiko.
