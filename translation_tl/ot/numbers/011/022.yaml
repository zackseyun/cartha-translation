id: NUM.11.22
reference: Numbers 11:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֲ/צֹ֧אן וּ/בָקָ֛ר יִשָּׁחֵ֥ט לָ/הֶ֖ם וּ/מָצָ֣א לָ/הֶ֑ם אִ֣ם אֶֽת כָּל דְּגֵ֥י הַ/יָּ֛ם יֵאָסֵ֥ף לָ/הֶ֖ם וּ/מָצָ֥א לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: tl
  text: Kung kakatayin para sa kanila ang mga tupa at baka, sasapat ba iyon sa kanila? O kung titipunin para sa kanila ang lahat ng isda sa dagat, sasapat ba iyon sa kanila?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at matagpuan para sa kanila,” isang idyomang nangangahulugang “at maging sapat para sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: ba
  rationale: Ang hulaping pananong na “ba” ay likas na nagpapahayag sa Filipino ng retorikal na tanong tungkol sa isang ipinapalagay na posibilidad.
- source_word: צֹאן וּבָקָר
  choice: mga tupa at baka
  rationale: Malinaw at kongkretong itinutumbas nito ang maliliit na hayop ng kawan at mga bovine; ang “tupa” ang pinakapayak na angkop na katawagan sa kontekstong ito.
- source_word: יִשָּׁחֵט
  choice: kakatayin
  rationale: Tiyak itong tumutukoy sa pagkatay ng mga hayop, lalo na upang maging pagkain, sa halip na sa pangkalahatang pagpatay.
- source_word: לָהֶם
  choice: para sa kanila
  rationale: Ipinahahayag ng parirala ang paglalaan para sa kapakanan at pagkain ng bayan.
- source_word: וּמָצָא לָהֶם
  choice: sasapat ba iyon sa kanila
  rationale: Ang literal na “matagpuan para sa kanila” ay isang idyomang Hebreo na nangangahulugang maging sapat; likas at malinaw sa Filipino ang “sasapat.”
- source_word: אִם
  choice: O kung
  rationale: Ipinakikilala nito ang ikalawang posibilidad sa retorikal na paghahambing.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: ang lahat ng isda sa dagat
  rationale: Pinananatili nito ang kabuuang saklaw ng כָּל at ang payak na larawang nasa Hebreo.
- source_word: יֵאָסֵף
  choice: titipunin
  rationale: Tapat ito sa diwang “tipunin” o “pagsama-samahin” nang hindi nagdaragdag ng mas tiyak na ideya ng paghuli.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang kongkretong “mga tupa at baka” at ang likas na idyomang “sasapat ba iyon” upang mapanatili ang retorikal na puwersa ng dalawang tanong. Inilagay ang talababa sa hulihan dahil pareho ang idyomang pinapaliwanag nito sa dalawang sugnay.
