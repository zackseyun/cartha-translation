  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: tl
  text: Saan ako kukuha ng karne na maibigay ko sa buong bayang ito? Sapagkat umiiyak sila sa harap ko[a] at sinasabi, ‘Bigyan mo kami ng karne upang makakain kami.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umiiyak sila sa akin” o “ginigipit nila ako sa kanilang pag-iyak.” Sa literal, sinasabi ng idyomang Hebreo, “umiiyak sila sa ibabaw ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: Saan ako kukuha
  rationale: Likas na ipinahahayag sa Tagalog ang tanong tungkol sa mapagkukunan at ang pagkabahala ni Moises; hindi kailangang isalin nang hiwalay ang datibong לִי.
- source_word: בָּשָׂר
  choice: karne
  rationale: Sa konteksto ng pagkaing hinihingi ng bayan, ang salita ay tumutukoy sa karneng makakain, hindi sa pangkalahatang ‘laman.’
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: maibibigay sa buong bayang ito
  rationale: Pinananatili ng ‘maibibigay’ ang layunin ng infinitibo, at ng ‘buong bayang ito’ ang kolektibong singular na diwa ng עָם.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng reklamo ni Moises sa isang marangal at malinaw na paraan.
- source_word: יִבְכּוּ עָלַי
  choice: umiiyak sila sa harap ko
  rationale: Inilalarawan nito ang pag-iyak na nakatuon kay Moises habang iniiwasang ipilit kung ito ay simpleng pagdaing sa kaniya o panggigipit sa pamamagitan ng pag-iyak; inilalahad sa talababa ang saklaw ng idyomang Hebreo.
- source_word: לֵאמֹר
  choice: at sinasabi
  rationale: Natural na panimula sa tuwirang sinabi ng bayan.
- source_word: תְּנָה לָּנוּ
  choice: Bigyan mo kami
  rationale: Direkta at natural na salin ng pautos na may datibong panghalip.
- source_word: וְנֹאכֵלָה
  choice: upang makakain kami
  rationale: Ipinahahayag ang ninanais na layunin o bunga ng kohortatibo nang natural sa Tagalog.
