  to: Saan ako kukuha ng karne na maibigay ko sa buong bayang ito? Sapagkat umiiyak sila sa harap ko[a] at sinasabi, ‘Bigyan mo kami ng karne upang makakain kami.’
  rationale: Nilinaw ang tagaganap ng pagbibigay upang maipakita ang personal na tanong ni Moises kung saan siya kukuha ng karne para maibigay sa buong bayan. Walang binago sa maingat na paghawak sa kalabuan ng עָלַי o sa kahulugan ng talata.
