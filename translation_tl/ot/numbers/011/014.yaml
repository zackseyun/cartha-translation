- source_word: לָשֵׂאת
  choice: pasanin
  rationale: Pinananatili ang konkretong talinghaga ng pagdadala ng mabigat na pasan at ang pananagutang ipinahihiwatig nito.
- source_word: כָבֵד מִמֶּנִּי
  choice: napakabigat nila para sa akin
  rationale: Tuwirang pinananatili ang larawan ng bigat at ang personal na kawalan ng kakayahan ni Moises; ang panghalip na “nila” ay natural na tumutukoy sa kolektibong bayan.
theological_decisions:
- issue: Diin sa pag-iisa ni Moises
  choice: Hindi ko kayang pasanin nang mag-isa
  alternative: Ako lamang ay hindi kayang pasanin
  rationale: Pinananatili ang diin ng אָנֹכִי at לְבַדִּי nang hindi gumagamit ng pilit o di-likas na ayos sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang talinghaga ng pagpasan at ang kolektibong pagtukoy sa bayan.
