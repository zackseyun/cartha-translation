base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Moises, “Masyado bang maikli ang kamay ni Yahweh?[a] Ngayon ay makikita mo kung mangyayari sa iyo ang sinabi ko[b] o hindi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Masyado bang maikli ang kamay ni Yahweh?” Isa itong idyoma na nagtatanong kung limitado ba ang kapangyarihan ni Yahweh.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “kung matutupad para sa iyo ang aking salita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh para katawanin ang Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: Umikli na ba ang kamay ni Yahweh?
  rationale: Pinanatili ang matingkad na idyomang Hebreo tungkol sa “kamay” bilang larawan ng kapangyarihan o kakayahan. Ang “na ba” ay likas sa makabagong Tagalog at naihahayag ang hamong retorikal na para bang nabawasan ang kakayahan ni Yahweh.
- source_word: עַתָּה תִרְאֶה
  choice: Ngayon ay makikita mo
  rationale: Tuwirang ipinahahayag ang nalalapit na pagpapatunay sa sinabi ng Diyos.
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: kung mangyayari sa iyo ang sinabi ko
  rationale: Ang קָרָה ay maaaring mangahulugang mangyari, sumapit, o matapat sa isang tao. Ang “mangyayari sa iyo” ay nagpapanatili sa ikalawang panauhang hulapi at sa bahagyang di-tiyak na ugnayan nito sa דְבָרִי; ang “ang sinabi ko” naman ay likas na Tagalog para sa “aking salita” sa kontekstong ito.
- source_word: אִם לֹא
  choice: o hindi
  rationale: Ito ang natural na Tagalog na katapat sa loob ng tanong na “kung…o hindi.”
theological_decisions:
- issue: Antropomorpikong paglalarawan sa kapangyarihan ng Diyos
  choice: Pinanatili ang “kamay ni Yahweh” at ang larawan ng pag-ikli nito.
  alternative: “Nabawasan na ba ang kapangyarihan ni Yahweh?”
  rationale: Ang literal na larawan ay mahalaga sa puwersa ng retorikal na tanong. Hindi nito kinakailangang ipahiwatig na may katawang tulad ng tao ang Diyos; sa konteksto, ang kamay ay larawan ng kakayahan at kapangyarihan.
- issue: Ang diwa ng hamon ni Yahweh kay Moises
  choice: 'Isinalin bilang retorikal na tanong: “Umikli na ba ang kamay ni Yahweh?”'
  alternative: “May bagay bang hindi kayang gawin ni Yahweh?”
  rationale: Pinananatili nito ang mismong larawan at tensiyon ng Hebreo sa halip na palitan iyon ng mas malawak na pormulasyong teolohikal.
- issue: Kung pangako, salita, o pangyayari ang tinutukoy ng דְבָרִי
  choice: “ang sinabi ko”
  alternative: “ang aking salita” o “ang ipinangako ko”
  rationale: Maaaring tumukoy ang דָּבָר sa salita, sinabi, usapin, o bagay. Hindi tahasang ginagamit ng Hebreo ang salitang “pangako,” kaya iniwasang gawing mas tiyak ang teksto kaysa sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyoma ngunit nilagyan ng paliwanag sa talababa; iniwasan ang mas lumang “mangyayari nga” o lubhang pormal na “magaganap,” gayundin ang denominasyonal na bokabularyo.
