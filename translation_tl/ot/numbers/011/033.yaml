  source_fidelity: 'Tumpak ang salin sa pangunahing daloy ng Hebreo: ang karne ay nasa pagitan pa ng mga ngipin, hindi pa nauubos, nag-alab ang galit ni Yahweh laban sa bayan, at hinampas niya ang bayan ng isang napakatinding salot. Ang “maubos” ay angkop na kontekstuwal na pagpapakahulugan ng יִכָּרֵת, habang iniiwan ng talababa ang literal na larawan ng “maputol.”'
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang “nasa pagitan pa ng kanilang mga ngipin,” “nag-alab ang galit,” at “napakatinding salot” ay marangal ngunit hindi lipas na pananalita. Katanggap-tanggap ang “hinampas ... ng salot” bilang matalinghagang paglalarawan ng paghatol.
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה. Ang “bayan” para sa עָם at “salot” para sa מַכָּה sa kontekstong ito ay angkop. Napananatili ng “nag-alab ang galit” ang Hebreong metapora ng nagbabagang poot nang walang doktrinal na pagpapalagay.
