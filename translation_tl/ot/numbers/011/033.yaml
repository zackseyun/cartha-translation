id: NUM.11.33
reference: Numbers 11:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: tl
  text: Habang ang karne ay nasa pagitan pa ng kanilang mga ngipin, bago pa ito maubos[a], nag-alab ang galit ni Yahweh laban sa bayan, at hinampas ni Yahweh ang bayan ng napakatinding salot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “bago pa ito maputol” o “maalis”—ibig sabihin, bago maubos ang karne.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: ang karne
  rationale: Sa konteksto ng pagkain ng mga pugo, tumutukoy ito sa laman ng hayop bilang pagkain; ang “karne” ang likas na makabagong salin.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: nasa pagitan pa ng kanilang mga ngipin
  rationale: Pinananatili nito ang matingkad na larawan ng Hebreo na hindi pa nalulunok ang karne.
- source_word: טֶרֶם יִכָּרֵת
  choice: bago pa ito maubos
  rationale: Ang כרת ay literal na “maputol/maalis,” ngunit sa konteksto ng pagkain ay malamang na nangangahulugang hindi pa nauubos ang karne. Pinananatili ng talababa ang literal na alternatibo.
- source_word: וְאַף יְהוָה חָרָה
  choice: nag-alab ang galit ni Yahweh
  rationale: Pinananatili ang metapora ng Hebreong idyoma para sa matinding galit sa natural na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: וַיַּךְ
  choice: hinampas
  rationale: Malinaw na ipinahahayag ang mapanghatol na kilos ng נכה habang nananatiling malapit sa larawang “humampas.”
- source_word: מַכָּה רַבָּה מְאֹד
  choice: napakatinding salot
  rationale: Sa sama-samang kapahamakan ng bayan, ang מַכָּה ay angkop na “salot”; ang רַבָּה מְאֹד ay nagpapahiwatig ng sukdulang tindi.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh nang hindi pinapalitan ng titulo.
- issue: Antropopatikong paglalarawan sa poot ng Diyos
  choice: nag-alab ang galit ni Yahweh
  alternative: nagalit si Yahweh
  rationale: Pinananatili ang metapora ng nag-aalab na galit sa halip na pahinain ito bilang payak na abstraksiyon.
- issue: Kahulugan ng יִכָּרֵת sa konteksto
  choice: maubos
  alternative: maputol; maalis
  rationale: Ang konteksto ng pagkain ay sumusuporta sa “maubos,” ngunit hindi ganap na inaalis ang literal na diwa; kaya itinatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עָם, “nag-alab” upang mapanatili ang Hebreong metapora, at “napakatinding salot” bilang natural na paglalahad ng pambihirang tindi ng kapahamakan.
