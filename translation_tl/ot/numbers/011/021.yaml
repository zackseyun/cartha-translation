  to: Ngunit sinabi ni Moises, “Ang bayang kasama ko ay may anim na raang libong katao na naglalakad[a], gayunma’y sinabi mo, ‘Bibigyan ko sila ng karne, at kakain sila sa loob ng isang buong buwan[b].’”
  rationale: Ang rebisyon ay pang-estilo at linaw lamang. Pinanatili nito ang pangatnig na nagpapahiwatig ng pagtutol, ang tahasang bilang, ang kolektibong “bayan,” ang hinaharap na pangako, at ang saklaw na isang buong buwan. Ang talababa para sa רַגְלִי ay nananatiling nakaangkla sa “naglalakad,” at ang talababa para sa חֹדֶשׁ יָמִים ay nakaangkla sa “buong buwan.”
