base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: tl
  text: Ngunit sinabi ni Moises, “Ang bayang kasama ko ay may anim na raang libong katao na naglalakad[a], gayunma’y sinabi mo, ‘Bibigyan ko sila ng karne, at kakain sila sa loob ng isang buong buwan[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “anim na raang libong lalaking naglalakad.” Maaaring tumukoy ang pananalitang Hebreo sa mga taong naglalakad o sa mga kawal na naglalakad.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, literal na “isang buwan ng mga araw,” isang idyomang nangangahulugang isang buong buwan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi ni Moises
  rationale: Isinusulong ng anyong pandiwa ang salaysay, ngunit sa konteksto ay tumututol si Moises sa naunang pahayag ng Diyos; kaya likas sa Filipino ang “Ngunit.”
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: anim na raang libo
  rationale: Tuwirang katumbas ito ng bilang sa Hebreo.
- source_word: רַגְלִי הָעָם
  choice: ang bayang ... ay anim na raang libong naglalakad
  rationale: Pinananatili ng “naglalakad” ang kaugnayan ng רַגְלִי sa paglalakad o pagiging nasa paa, nang hindi tiyak na ginagawang mga kawal o mga lalaki ang tinutukoy.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: ang bayang kasama ko
  rationale: Natural na Filipino ito para sa diwang si Moises ay nasa gitna o piling ng bayan, nang hindi binabago ang ugnayan niya sa kanila.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: gayunma’y sinabi mo
  rationale: Ipinakikita ng “gayunman” ang mariing pagsalungat sa napakalaking bilang na kababanggit lamang, habang pinananatili ang tahasang “ikaw” sa anyong “mo.”
- source_word: בָּשָׂר
  choice: karne
  rationale: Sa konteksto, tumutukoy ito sa laman ng hayop bilang pagkain; “karne” ang karaniwan at malinaw na modernong katumbas.
- source_word: אֶתֵּן לָהֶם
  choice: Bibigyan ko sila
  rationale: Likas na Filipino para sa panghinaharap na pangako sa unang panauhan.
- source_word: וְאָכְלוּ
  choice: at kakain sila
  rationale: Pinananatili ang koordinadong panghinaharap na resulta sa halip na gawin itong layunin lamang.
- source_word: חֹדֶשׁ יָמִים
  choice: sa loob ng isang buong buwan
  rationale: Ang literal na “isang buwan ng mga araw” ay idyomang nangangahulugang isang ganap na buwan; malinaw at natural ang “isang buong buwan” sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” bilang kolektibong tawag sa mga tao at pinanatili sa talababa ang tunay na lawak ng kahulugan ng רַגְלִי. Inilipat ang mga pananda ng talababa sa mga salitang aktuwal na tinutukoy ng bawat paliwanag.
