  source_fidelity: 'Tumpak ang salin sa Hebreo: ang pagpapangalan sa lugar, ang pangalang Tabera, ang ugnayang sanhi, at ang apoy ni Yahweh na nagliyab sa gitna ng bayan ay lahat naipahayag. Ang mas natural na Tagalog na “tinawag niya ang lugar na iyon na” ay ligtas na pagsasalin ng Hebreong pormulang “tinawag niya ang pangalan ng lugar na iyon.”'
