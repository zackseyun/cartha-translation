  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: tl
  text: Kaya tinawag niya ang lugar na iyon na Tabera[a], sapagkat nagliyab sa gitna nila ang apoy ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Tabera ay kaugnay ng salitang Hebreo na nangangahulugang “pagliyab” o “nasusunog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: tinawag niya ang lugar na iyon na
  rationale: Likas sa modernong Tagalog ang pormulang ito sa pagpapangalan, habang malinaw pa ring naipahihiwatig ang Hebreong idyomang literal na 'tinawag niya ang pangalan ng lugar na iyon.'
- source_word: תַּבְעֵרָה
  choice: Tabera
  rationale: Isinalin sa baybay-Tagalog ang pangalang pantangi at pinanatili ang kaugnayan nito sa salitang tumutukoy sa pagliyab sa pamamagitan ng talababa.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw at marangal na panandang sanhi na angkop sa salaysay.
- source_word: בָעֲרָה
  choice: nagliyab
  rationale: Tuwirang ipinapahayag ang matinding pag-apoy at naiparirinig ang larong-salita sa pangalang Tabera.
- source_word: בָם
  choice: sa gitna nila
  rationale: Ipinahihiwatig nito na ang apoy ay lumaganap sa loob ng kanilang pamayanan o kampo, hindi na sila mismo ang nasusunog sa loob.
- source_word: אֵשׁ יְהוָה
  choice: ang apoy ni Yahweh
  rationale: Pinananatili ang Hebreong ugnayang konstrakto at ang personal na banal na pangalang Yahweh.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang ipinahayag na pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang natural na pormula sa pagpapangalan sa halip na ang alanganing literal na 'tinawag ang pangalan,' ngunit pinanatili ang sanhi at larong-salita ng Hebreo.
