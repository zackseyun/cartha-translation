base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: tl
  text: Kung ganito ang pakikitungo mo sa akin, nakikiusap ako, patayin mo na ako; kung nakasumpong ako ng lingap sa iyong paningin, huwag mo akong hayaang makita ang aking kasawian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking paghihirap” o “kapahamakang sasapit sa akin.” Ang salitang Hebreo ay maaaring tumukoy sa hirap o sakuna, hindi lamang sa kasamaan sa moral na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם כָּכָה
  choice: Kung ganito
  rationale: Likas na panimula sa Filipino para sa pasubaling reklamo; hindi kailangang tahasang isalin ang panimulang וְ bilang “at.”
- source_word: אַתְּ ... עֹשֶׂה לִּי
  choice: mo ako pakikitunguhan
  rationale: Ipinapahayag ng עשה na may ל ang paraan ng pagkilos ng Diyos kay Moises. Ang anyong panghinaharap na “pakikitunguhan” ay angkop sa pasubaling “kung ganito.”
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: nakikiusap ako, patayin mo na ako
  rationale: Ang נָא ay pakiusap, samantalang ang infinitive absolute na kasunod ng pautos ay nagpapalakas sa kahilingan. Ang “patayin mo na ako” ay natural at mariing pahayag sa Filipino.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: kung nakasumpong ako ng lingap sa iyong paningin
  rationale: Pinananatili ang karaniwang Hebreong idyoma tungkol sa pagtanggap ng mabuting pagtingin o lingap, pati ang larawan ng “paningin.”
- source_word: וְאַל אֶרְאֶה
  choice: at huwag mo nang hayaang makita ko
  rationale: Isinasalin bilang pakiusap sa Diyos na huwag pahintulutan si Moises na masaksihan o danasin ang tinutukoy na kapahamakan.
- source_word: בְּרָעָתִי
  choice: ang sarili kong kasawian
  rationale: Maaaring tumukoy ang רָעָה sa hirap, kapahamakan, o sakuna, hindi lamang sa kasamaan sa moral na diwa. Nililinaw ng “sarili kong” ang hulaping unang panauhan nang hindi itinatakda kung ito ay kasalukuyang paghihirap o nalalapit na kapahamakan.
theological_decisions:
- issue: Kahulugan ng בְּרָעָתִי sa pakiusap ni Moises
  choice: sarili kong kasawian
  alternative: sarili kong paghihirap; kapahamakang sasapit sa akin; sarili kong kasamaan
  rationale: Ang konteksto ay ang matinding pasanin at kawalang-pag-asa ni Moises, hindi isang tahasang pag-amin ng moral na kasamaan. Ang “kasawian” ay nagpapanatili sa saklaw na personal na hirap o kapahamakan nang hindi nagpapasok ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tindi ng desperadong pakiusap ni Moises, ang pasubaling pahayag tungkol sa lingap ng Diyos, at ang leksikal na lawak ng רָעָה.
