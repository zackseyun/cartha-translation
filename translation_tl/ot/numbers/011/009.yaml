  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: tl
  text: Tuwing bumababa ang hamog sa kampo sa gabi, bumababa ang manna doon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At tuwing bumababa sa kampo ang hamog sa gabi, bumababa ang manna doon.” Iisang pandiwa ang ginamit sa Hebreo para sa pagbaba ng hamog at ng manna, kaya binibigyang-diin ang paralelismo ng dalawang kilos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: Kapag bumababa
  rationale: Ang waw na may be at infinitive construct ay nagpapakilala ng sugnay na panahunan. Ang “Kapag bumababa” ay likas sa Filipino at naipahihiwatig ang paulit-ulit o nakagawiang pangyayari sa salaysay.
- source_word: הַטַּל
  choice: ang hamog
  rationale: Tuwirang katumbas ng tiyak na pangngalan; pinananatili ng “ang” ang pagiging tiyak nito.
- source_word: עַל הַמַּחֲנֶה
  choice: sa kampo
  rationale: Bagaman literal na “sa ibabaw ng kampo,” ang “sa kampo” ang natural na Filipino para sa hamog na bumababa o namumuo roon, nang hindi dinaragdagan ang larawan.
- source_word: לָיְלָה
  choice: sa gabi
  rationale: Natural na adberbiyal na pananda ng panahon sa makabagong Filipino.
- source_word: יֵרֵד
  choice: bumababa rin
  rationale: Ang imperpektibo ay naglalarawan ng nakagawiang pangyayari sa nakaraang salaysay. Inulit ang “bumababa” upang mapanatili ang paralelismo ng iisang pandiwang Hebreo; ang “rin” ay natural na naghuhudyat ng kaugnayan.
- source_word: הַמָּן
  choice: ang manna
  rationale: Kinagawiang tawag sa kilalang pagkaing tinutukoy, na may tiyak na pantukoy.
- source_word: עָלָיו
  choice: doon
  rationale: Ang panlalaking isahang hulapi ay malamang na tumutukoy sa kampo. Ang “doon” ay natural na Filipino at pinananatiling hindi tahasang nililinaw kung ang manna ay nasa hamog mismo o sa lugar ng kampo.
