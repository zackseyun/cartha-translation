  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: tl
  text: Ang mga tao ay parang mga taong nagrereklamo dahil sa hirap[a] sa pandinig ni Yahweh. Narinig ito ni Yahweh, at nag-alab ang galit niya. Nagliyab sa gitna nila ang apoy ni Yahweh[b] at tumupok sa may gilid ng kampo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “sa pandinig ni Yahweh” o “sa mga tainga ni Yahweh.” Ang anyong Hebreo para sa “mga nagrereklamo” ay bihira at mahirap; maaari ring isalin na “parang mga nagrereklamo,” “parang nagrereklamo,” o “mga nagrereklamo nang masama.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “isang apoy mula kay Yahweh.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “sa pinakalabas na bahagi ng kampo.” Hindi tahasang sinasabi sa Hebreo kung mga tao o isang bahagi ng kampo ang tinupok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם כְּמִתְאֹנְנִים רַע
  choice: Ang mga tao ay parang mga nagrereklamo dahil sa hirap
  rationale: Pinananatili ng “parang” ang paghahambing na ipinahihiwatig ng כְּ, habang ang “nagrereklamo dahil sa hirap” ay natural na Tagalog para sa bihira at mahirap na anyong מִתְאֹנְנִים kasama ng רַע, nang hindi ginagawang tiyak kung ang רַע ay paghihirap o masamang paraan ng pagrereklamo.
- source_word: בְּאָזְנֵי יְהוָה
  choice: at narinig sila ni Yahweh
  rationale: Inihahatid nito sa natural na Tagalog ang idyomang literal na “sa mga tainga ni Yahweh,” at pinananatili ang ugnayang pandinig sa kasunod na וַיִּשְׁמַע.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: Nang marinig iyon ni Yahweh
  rationale: Ang “iyon” ay likas na pantukoy sa reklamo na walang tahasang layon sa Hebreo; ang pagkakasunod na “nang” ay malinaw na nag-uugnay sa narinig at sa sumunod na galit.
- source_word: וַיִּחַר אַפּוֹ
  choice: nag-alab ang galit niya
  rationale: Pinananatili ang Hebreong larawan ng nag-aapoy na galit sa malinaw at dignidad na modernong Tagalog.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: Nagliyab sa gitna nila ang apoy ni Yahweh
  rationale: Pinananatili ang tuwirang anyong “apoy ni Yahweh” at ang di-tiyak na relasyon nito kay Yahweh, sa halip na agad itong ipakahulugang “apoy mula kay Yahweh.”
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: at tumupok sa isang bahagi sa gilid ng kampo
  rationale: Ang “tumupok” ay karaniwang pandiwa kapag apoy ang simuno. Ang “isang bahagi” ay maingat na nagbibigay ng natural na layon nang hindi tahasang ipinapalagay na mga tao lamang ang tinupok; ang בִּקְצֵה ay isinaling “sa gilid.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang pinagmulang teksto ay gumagamit ng personal na banal na pangalan; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Ugnayan ng apoy kay Yahweh
  choice: ang apoy ni Yahweh
  alternative: isang apoy mula kay Yahweh
  rationale: Pinananatili ng pangunahing salin ang genitibong anyo at ang tunay na lawak ng kahulugan nito; inilalagay sa talababa ang posibleng pagbasa na pinagmulan ang tinutukoy.
- issue: Layon ng pagtupok sa gilid ng kampo
  choice: isang bahagi sa gilid ng kampo
  alternative: ilan sa mga nasa gilid ng kampo
  rationale: Walang tahasang layon ang וַתֹּאכַל. Iniiwasan ng “isang bahagi” ang hindi matiyak na pagdedesisyong mga tao lamang ang tinupok, habang nananatiling malinaw sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na dignidad ngunit madaling maunawaan. Ginamit ang “kampo,” “nag-alab,” “nagliyab,” at “tumupok” bilang natural at malinaw na bokabularyo. Hindi ginamit ang mas makalumang “dumaing,” “poot,” o “nasa mga tainga” sa pangunahing teksto. Lahat ng marker ng talababa ay nasa pangunahing teksto.
