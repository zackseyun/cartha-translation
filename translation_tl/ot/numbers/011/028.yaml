base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: tl
  text: Sumagot si Josue na anak ni Nun, na tagapaglingkod ni Moises mula pa sa kabataan ni Josue,[a] at sinabi, “Ginoo kong Moises, pigilan po ninyo sila!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa kaniyang mga kabataang lalaki,” o posibleng “mula sa kaniyang mga piniling tauhan.” Maikli at medyo malabo ang pariralang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagbawalan po ninyo sila.” Ang pandiwang Hebreo ay maaaring mangahulugang pigilan, hadlangan, o pagbawalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Ang wayyiqtol ng ענה ay karaniwang nagpapakilala ng tugon sa salaysay. Likas sa Filipino ang payak na “Sumagot,” at hindi kailangang isalin nang hiwalay ang waw bilang “pagkatapos.”
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josue na anak ni Nun
  rationale: Ginamit ang mga pangalang karaniwan sa tradisyong Biblikal na Filipino, at malinaw na isinalin ang ugnayang בן.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: ang lingkod ni Moises
  rationale: Ang מְשָׁרֵת ay tumutukoy sa isang naglilingkod o tumutulong nang personal. Ang “lingkod” ay dignified at natural sa Filipino at hindi rito kinakailangang mangahulugang alipin.
- source_word: מִבְּחֻרָיו
  choice: mula pa sa kaniyang kabataan
  rationale: Ang compact na parirala ay maaaring maiugnay sa kabataan ni Josue, bagaman posible ring mangahulugang isa siya sa mga kabataang lalaki o piniling tauhan ni Moises. Pinili ang natural na pagbasa sa pangunahing teksto at pinanatili ang ambiguity sa talababa.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: Panginoon kong Moises
  rationale: Ang אֲדֹנִי ay magalang na tawag sa isang nakatataas na tao. Pinananatili ng “Panginoon kong Moises” ang paggalang at nililinaw ng tahasang pangalan na hindi ito banal na titulo.
- source_word: כְּלָאֵם
  choice: pigilan po ninyo sila
  rationale: Maaaring mangahulugan ang כלא na pigilan, hadlangan, o pagbawalan. Ang “pigilan” ay tumutugma sa agarang konteksto nang hindi tinutukoy ang eksaktong paraan; ang “po ninyo” ay natural na naghahayag ng paggalang sa modernong Filipino.
theological_decisions:
- issue: Saklaw ng utos ni Josue tungkol sa pagpopropesiya nina Eldad at Medad
  choice: pigilan po ninyo sila
  alternative: pagbawalan po ninyo sila
  rationale: Hindi tinutukoy ng tekstong Hebreo kung pisikal na pagpigil o awtoritatibong pagbabawal ang hinihingi. Pinanatili sa pangunahing teksto ang mas malawak na “pigilan,” at inilagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, magalang, at angkop sa pampublikong pagbasa. Ginamit ang “po ninyo” upang ihatid ang paggalang na nasa אֲדֹנִי, habang pinanatili ang tradisyonal at dignified na “Panginoon kong Moises.” Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
