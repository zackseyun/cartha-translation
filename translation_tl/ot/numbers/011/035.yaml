  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: tl
  text: Mula sa Kibrot-hataava[a], umalis ang bayan patungong Hazerot, at nanatili sila sa Hazerot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kibrot-hataava ay nangangahulugang “mga libingan ng pagnanasa” o “mga libingan ng pag-iimbot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה
  choice: Mula sa Kibrot-hataava
  rationale: Pangalan ito ng lugar sa salaysay, kaya tinumbasan sa paraang transliterasyon sa halip na isalin sa pangunahing teksto. Ipinaliliwanag sa talababa ang malinaw na kahulugan ng pangalan.
- source_word: נָסְע֥וּ
  choice: umalis
  rationale: Sa mga salaysay ng paglalakbay, tumutukoy ang pandiwa sa paglisan ng kampo upang magpatuloy sa paglalakbay. Likas at malinaw sa modernong Filipino ang “umalis” sa kontekstong ito.
- source_word: הָ/עָ֖ם
  choice: ang bayan
  rationale: Tumutukoy ito sa sambayanan ng Israel bilang isang pangkat. Ang “bayan” ay maikli, marangal, at angkop sa salaysay.
- source_word: חֲצֵר֑וֹת
  choice: Hazerot
  rationale: Pangalan ito ng lugar, kaya isinalin sa pamamagitan ng transliterasyong madaling basahin sa Filipino.
- source_word: וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת
  choice: at nanatili sila sa Hazerot
  rationale: Literal na “at sila ay nasa Hazerot,” ngunit sa konteksto ng tala ng paglalakbay, ipinahihiwatig nito na huminto at nanatili sila roon. Pinananatili ng “nanatili” ang diwang iyon nang hindi labis na nagpapaliwanag.
