  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: tl
  text: At bababa ako at makikipag-usap sa iyo roon. Kukuha ako ng bahagi ng espiritung nasa iyo[a] at ilalagay ko ito sa kanila. Makikiisa sila sa iyo sa pagpasan ng pasanin ng bayan, upang hindi mo ito pasanin nang mag-isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Espiritung nasa iyo.” Ang Hebreong רוּחַ ay maaaring mangahulugang espiritu, hangin, o hininga; dito, tumutukoy ito sa espiritung mula sa Diyos na nagbibigay-kakayahan kay Moises sa pamumuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: bababa ako
  rationale: Pinananatili ang literal at teopanikong pananalita ng ירד sa likas na modernong Tagalog.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: makikipag-usap sa iyo roon
  rationale: Ipinahahayag ang pakikipag-usap at pinananatili ang tiyak na pook na tinutukoy ng שָׁם.
- source_word: וְאָצַלְתִּי מִן
  choice: kukuha ako mula
  rationale: Ang pambihirang pandiwang אצל kasama ng מִן ay nagsasaad ng pagkuha mula sa nasa kay Moises upang ilagay sa matatanda; hindi nito tahasang nilulutas kung nabawasan ang nasa kanya.
- source_word: הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: espiritung nasa iyo
  rationale: Ang רוּחַ ay tumutukoy rito sa espiritung nagbibigay-kakayahan para sa pamumuno. Maliit na titik ang ginamit upang mapanatili ang kawalan ng natatanging kapitalisasyon sa Hebreo at ang leksikal na kalabuan.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: ilalagay ko ito sa kanila
  rationale: Malinaw at natural na inilalarawan ang paglilipat o pagkakaloob ng espiritu sa mga matatanda.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: tutulungan ka nilang pasanin ang bigat ng pananagutan sa bayan
  rationale: Pinananatili ang metapora ng pagpasan habang nililinaw na ang מַשָּׂא ay ang mabigat na pananagutan sa pamumuno, hindi ang bayan mismo bilang pisikal na pasan.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: upang hindi mo iyon pasaning mag-isa
  rationale: Ipinakikita ang layunin o bunga ng pagbabahagi ng pananagutan at pinananatili ang diin ng לְבַדֶּךָ.
theological_decisions:
- issue: Kung ang רוּחַ ay dapat ipakahulugang tiyak na Banal na Espiritu o mas malawak na espiritung mula sa Diyos na nagbibigay-kakayahan
  choice: espiritu
  alternative: Espiritu
  rationale: Ipinakikita ng konteksto na banal na pagkakaloob para sa pamumuno ang tinutukoy, ngunit hindi gumagamit ng malaking titik ang Hebreo. Ang maliit na titik at talababa ay nagpapanatili sa tunay na leksikal at teolohikal na tensiyon nang hindi ito ginagawang saloobin lamang ni Moises o tahasang ipinapasok ang mas huling terminolohiyang doktrinal.
- issue: Kung ipinahihiwatig ng וְאָצַלְתִּי na mababawasan ang espiritung nasa kay Moises
  choice: hindi tinukoy kung mababawasan siya
  alternative: hahatiin o babawasan ang espiritung nasa kanya
  rationale: Sinasabi ng teksto na kukuha ang Diyos mula sa espiritung nasa kay Moises at ilalagay iyon sa matatanda, ngunit hindi nito tahasang sinasabi kung may pagkawala o pagkaubos sa panig ni Moises.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “bigat ng pananagutan sa bayan” upang maging natural ang metaporang Hebreo nang hindi ipinahihiwatig na ang bayan mismo ay isang pisikal na pasan.
