revisions:
- from: At bababa ako at makikipag-usap sa iyo roon. Kukuha ako mula sa espiritung nasa iyo[a] at ilalagay ko ito sa kanila. Tutulungan ka nilang pasanin ang bigat ng pananagutan sa bayan, upang hindi mo iyon pasaning mag-isa.
  to: At bababa ako at makikipag-usap sa iyo roon. Kukuha ako ng bahagi ng espiritung nasa iyo[a] at ilalagay ko ito sa kanila. Makikiisa sila sa iyo sa pagpasan ng pasanin ng bayan, upang hindi mo ito pasanin nang mag-isa.
  rationale: Itinama ang maling anyo ng pandiwa sa huling sugnay. Nilinaw ang partitive na “mula sa” sa pamamagitan ng “bahagi ng,” na tumutugma sa מִן nang hindi ipinahihiwatig na lubos na nabawasan ang espiritung nasa kay Moises. Pinalitan ang mas malayang pagpapaliwanag ng isang mas malapit ngunit natural na paghahayag ng sama-samang pagpasan ng pasanin ng bayan.
