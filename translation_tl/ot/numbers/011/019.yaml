translation:
  language: tl
  text: Hindi kayo kakain nang isang araw lamang[a], ni nang dalawang araw lamang, ni nang limang araw lamang, ni nang sampung araw lamang, ni nang dalawampung araw lamang,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na anyo: “Hindi kayo kakain nang isang araw, at hindi nang dalawang araw, at hindi nang limang araw, at hindi nang sampung araw, at hindi nang dalawampung araw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: hindi lamang ... ni ... ni
  rationale: Ang paulit-ulit na pagtanggi sa bawat tagal ay likas na naipapahayag sa Tagalog sa pamamagitan ng “hindi lamang” at sunod-sunod na “ni,” habang pinananatili ang retorikal na pag-akyat ng bilang.
- source_word: יוֹם אֶחָד
  choice: isang araw
  rationale: Tuwirang salin na nagpapanatili sa pagkakasunod-sunod ng bilang.
- source_word: תֹּאכְלוּ/ן
  choice: kayong kakain nito
  rationale: Ang qal imperfect na ikalawang panauhang maramihan ay may hinaharap na diwa. Idinagdag ang “nito” bilang likas na Tagalog na pantukoy sa pagkaing tinutukoy sa konteksto, nang hindi pinapangalanan ito sa talata.
- source_word: יוֹמָיִם
  choice: dalawang araw
  rationale: Tuwirang isinasalin ang anyong dual bilang “dalawang araw.”
- source_word: חֲמִשָּׁה יָמִים
  choice: limang araw
  rationale: Tuwirang salin na nagpapanatili sa tumitinding pagkakasunod-sunod.
- source_word: עֲשָׂרָה יָמִים
  choice: sampung araw
  rationale: Tuwirang salin na nagpapanatili sa retorikal na pag-akyat.
- source_word: עֶשְׂרִים יוֹם
  choice: dalawampung araw
  rationale: Likas na anyong Tagalog para sa bilang at pangngalan, bagaman isahan ang anyo ng “araw” sa Hebreo pagkatapos ng dalawampu.
- source_word: וְ
  choice: ni
  rationale: Bagaman karaniwang “at” ang waw, sa serye ng mga itinatangging tagal, ang “ni” ang natural na Tagalog at malinaw na nag-uugnay sa magkakasunod na hindi kasamang haba ng panahon.
