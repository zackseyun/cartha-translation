  naturalness: Bahagyang mabigat at putol ang kasalukuyang "Narinig ni Moises na umiiyak ang mga tao ... bawat lalaki sa pasukan." Mas natural sa modernong Tagalog ang tuwirang layon na "ang mga taong umiiyak" at ang hayag na pandiwang pang-ugnay sa huling distributibong parirala.
  terminology: Ang "Moises," "Yahweh," "angkan," at "tolda" ay angkop sa modernong Filipino Tagalog at sa rehistro ng salaysay. Napananatili ng "nag-alab ang galit" ang metaporang Hebreo nang hindi nagpapataw ng interpretasyong doktrinal.
