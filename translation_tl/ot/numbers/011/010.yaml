  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: tl
  text: Narinig ni Moises ang mga taong umiiyak ayon sa kani-kanilang angkan[a], bawat lalaki ay nasa pasukan ng kanyang tolda. Lubhang nag-alab ang galit ni Yahweh, at masama iyon sa paningin ni Moises.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kani-kanilang pamilya.” Ang salitang Hebreo ay maaaring tumukoy sa mga pamilya o sa mas malalaking pangkat ng magkakamag-anak.
    reason: lexical_alternative
  - marker: b
    text: O “at hindi iyon nakalugod kay Moises.” Sa literal, “at masama iyon sa paningin ni Moises.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Narinig
  rationale: Ipinahahayag ng Qal wayyiqtol ng שׁמע ang pagkarinig ni Moises sa pag-iyak, kaya ang karaniwang pandiwang “narinig” ang likas na katumbas.
- source_word: בֹּכֶה
  choice: umiiyak
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na pagkilos; natural sa modernong Tagalog ang “umiiyak” at malinaw ang himig ng pagdaing.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה ay tumutukoy sa pangkat na magkakamag-anak, maaaring angkan o sambahayan; ipinakikita ng “kani-kanilang” ang pagkakapangkat-pangkat ng bayan.
- source_word: אִישׁ
  choice: bawat lalaki
  rationale: Ginagamit ang panlalaking pang-isahang anyo nang distributibo, kaya pinananatili ng “bawat lalaki” kapwa ang indibiduwal na diwa at ang tahasang kasarian ng anyong Hebreo.
- source_word: לְפֶתַח אָהֳלוֹ
  choice: sa pasukan ng kanyang tolda
  rationale: Tumpak at natural na inilalarawan ng “pasukan” ang פֶּתַח, ang bukana o entrada ng tolda.
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: Lubhang nag-alab ang galit ni Yahweh
  rationale: Pinananatili ng “nag-alab ang galit” ang metapora ng Hebreo, at ipinahahayag ng “lubhang” ang matinding diin ng מְאֹד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: at masama iyon sa paningin ni Moises
  rationale: Pinananatili nito ang literal na idyomang Hebreo at ang hindi tahasang tinukoy na simuno ng pagsusuri ni Moises, sa halip na limitahan agad ang kahulugan sa “hindi niya nagustuhan.”
theological_decisions:
- issue: Paglalarawan sa galit ng Diyos
  choice: Lubhang nag-alab ang galit ni Yahweh
  alternative: Labis na nagalit si Yahweh
  rationale: Ang napiling anyo ay hindi pinapahina ang matinding pahayag at pinananatili ang orihinal na metapora ng nag-aalab na galit.
- issue: Hindi tahasang layon ng pagsusuri ni Moises
  choice: masama iyon sa paningin ni Moises
  alternative: hindi iyon nakalugod kay Moises
  rationale: Hindi malinaw na tinutukoy ng Hebreo kung ang pag-iyak, ang buong kalagayan, o ang nangyari ang hinatulan ni Moises; pinananatili ng “iyon” ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “tolda,” “pasukan,” at “angkan” bilang karaniwan at madaling maunawaang mga salita; pinanatili ang Hebreong metapora at ang evaluative na idyoma kung saan mahalaga ang mga ito.
