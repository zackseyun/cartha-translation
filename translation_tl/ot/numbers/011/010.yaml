revisions:
- from: Narinig ni Moises na umiiyak ang mga tao ayon sa kani-kanilang angkan[a], bawat lalaki sa pasukan ng kanyang tolda. Lubhang nag-alab ang galit ni Yahweh, at masama iyon sa paningin ni Moises.[b]
  to: Narinig ni Moises ang mga taong umiiyak ayon sa kani-kanilang angkan[a], bawat lalaki ay nasa pasukan ng kanyang tolda. Lubhang nag-alab ang galit ni Yahweh, at masama iyon sa paningin ni Moises.[b]
  rationale: Inayos lamang ang sintaks upang maging mas likas at malinaw sa modernong Tagalog. Hindi binago ang kahulugan, ang metapora ng galit, ang pangalan ni Yahweh, ang kasariang distributibo ng "bawat lalaki," o ang kalabuan ng huling pagsusuri ni Moises. Napanatili rin ang lahat ng footnote anchor at nilalaman.
