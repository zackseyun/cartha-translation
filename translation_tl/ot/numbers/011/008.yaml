base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: tl
  text: Naglilibot ang mga tao upang tipunin ito. Ginigiling nila ito sa gilingang-bato o dinudurog sa almirez, saka pinakukuluan sa palayok at ginagawang mga tinapay na bilog. Ang lasa nito ay tulad ng lasa ng malinamnam na langis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tulad ng lasa ng sariwang langis.” Mahirap tiyakin ang kahulugan ng pariralang Hebreo na לְשַׁד הַשָּׁמֶן; maaaring tumukoy ito sa malinamnam o sariwang katas ng langis.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: nagpaparoo't parito
  rationale: Ipinahahayag nito ang paggalaw sa iba't ibang dako habang nangangalap; ang aspektong di-ganap ay angkop sa nakaugaliang kilos sa konteksto.
- source_word: לָקְטוּ
  choice: tinitipon
  rationale: Karaniwang salitang Tagalog para sa pangangalap o pagkolekta ng pagkaing nakakalat.
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: ginigiling sa gilingang-bato
  rationale: Pinananatili ang kongkretong kagamitang tinutukoy ng רֵחַיִם at gumagamit ng natural na katawagan sa Tagalog.
- source_word: דָכוּ בַּמְּדֹכָה
  choice: dinudurog sa almires
  rationale: Ang דכך ay pagdurog o pagdikdik, at ang 'almires' ang karaniwang katawagan sa sisidlang pandikdik.
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: pinakukuluan sa palayok
  rationale: Ipinakikita ang posibleng tiyak na paraan ng pagluluto at pinananatili ang sisidlang binanggit.
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: ginagawang mga tinapay na bilog
  rationale: Ang עֻגוֹת ay mga tinapay o cake na karaniwang bilog; iniiwasan ng 'tinapay' ang makabagong pakahulugan ng salitang 'keyk.'
- source_word: טַעְמוֹ
  choice: ang lasa nito
  rationale: Direkta at likas na katumbas ng pangngalang tumutukoy sa lasa.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: malinamnam na langis
  rationale: Mahirap tiyakin ang לְשַׁד; ipinahahayag ng 'malinamnam' ang mayamang kalidad o esensiya ng langis nang hindi gumagamit ng di-likas na literalismo.
