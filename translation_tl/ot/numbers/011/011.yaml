base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: tl
  text: At sinabi ni Moises kay Yahweh, “Bakit mo pinakitunguhan nang masama ang iyong lingkod?[a] At bakit hindi ako nakasumpong ng lingap sa iyong paningin,[b] na ipinataw mo sa akin ang pasanin ng buong bayang ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ginawan mo ng masama ang iyong lingkod.” Mas literal ang pandiwang Hebreo na “ginawan ng masama” o “gumawa ng masama sa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “makasumpong ng lingap sa iyong paningin” ay idyomang Hebreo na nangangahulugang tumanggap ng pabor mula sa isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הֲרֵעֹתָ לְעַבְדֶּךָ
  choice: ginawan ng masama ang iyong lingkod
  rationale: Tuwirang inilalarawan nito ang matinding hinaing ni Moises at pinananatili ang saklaw ng Hebreong רעע, na maaaring tumukoy sa paggawa ng masama o kapahamakan sa isang tao.
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: n nakasumpong ng lingap sa iyong paningin
  rationale: Pinananatili ang karaniwang idyomang Hebreo habang malinaw pa rin sa modernong Tagalog ang diwang pagtanggap ng pabor.
- source_word: לָשׂוּם אֶת מַשָּׂא
  choice: ipinataw ... ang pasanin
  rationale: Ang 'ipinataw' ay likas na katambal ng 'pasanin' sa Tagalog at angkop sa ideya ng paglalagay ng mabigat na pananagutan kay Moises.
- source_word: כָּל הָעָם הַזֶּה
  choice: buong bayang ito
  rationale: Likas na Tagalog ito at pinananatili ang pang-isahang kolektibong diwa ng עָם.
theological_decisions:
- issue: Maaaring ipahiwatig ng הֲרֵעֹתָ, na ang Diyos ang simuno, ang paggawa ng masama.
  choice: ginawan ng masama ang iyong lingkod
  alternative: pinakitunguhan mo nang masama ang iyong lingkod
  rationale: Hindi pinahina ang tunay na talas at teolohikal na tensiyon ng hinaing ni Moises. Ang pananalita ay iniulat bilang reklamo ni Moises at hindi bilang hatol ng tagapagsalin tungkol sa moralidad ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit likas na himig. Pinanatili ang idyomang “sa iyong paningin” dahil nauunawaan ito sa konteksto at inililinaw sa talababa. Ginamit ang “buong bayang ito” upang natural na maipahayag ang kolektibong pangngalang Hebreo.
