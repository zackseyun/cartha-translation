  to: At sinabi ni Moises kay Yahweh, “Bakit mo pinakitunguhan nang masama ang iyong lingkod?[a] At bakit hindi ako nakasumpong ng lingap sa iyong paningin,[b] na ipinataw mo sa akin ang pasanin ng buong bayang ito?”
  rationale: Pinalitan ang hindi likas na “ginawan ng masama” sa pangunahing teksto ng “pinakitunguhan nang masama,” na mas natural sa modernong Tagalog at pinananatili ang talas ng reklamo ni Moises. Iningatan ang literal na alternatibo sa talababa. Walang binagong kahulugan sa pasanin, sa kolektibong “buong bayang ito,” o sa idyomang tungkol sa lingap.
