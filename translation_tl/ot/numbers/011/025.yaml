  naturalness: Marangal at karaniwang nauunawaan ang register, ngunit hindi natural o gramatikal ang “nasa kay Moises.” Ang “nagpahayag sila bilang mga propeta” ay naiintindihan ngunit mas tuwiran at natural ang “nagpropesiya sila.” Ang “namahinga sa kanila” ay mas malapit din sa imaheng Hebreo kaysa “manahan sa kanila.”
