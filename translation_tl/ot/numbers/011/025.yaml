  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: tl
  text: Pagkatapos, bumaba si Yahweh sa ulap at nagsalita kay Moises. Kumuha siya mula sa Espiritung sumasa-kay Moises at inilagay niya ito sa pitumpung matatandang lalaki. Nang namahinga sa kanila ang Espiritu, nagpropesiya sila, ngunit hindi na nila iyon ipinagpatuloy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ngunit hindi sila tumigil.” Maigsi ang pananalitang Hebreo at nauunawaan ito sa higit sa isang paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Likas at tuwirang katumbas ng pandiwang tumutukoy sa pagkilos pababa; pinananatili rin ang teopanikong paglalarawan.
- source_word: בֶּעָנָן
  choice: sa ulap
  rationale: Ang tiyak na anyo sa Hebreo ay tumutukoy sa kilalang ulap na kaugnay ng presensiya ni Yahweh sa salaysay.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: nagsalita kay Moises
  rationale: Nilinaw ang tinutukoy ng panghalip ayon sa konteksto upang maiwasan ang kalituhan sa natural na Tagalog.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: Kumuha siya mula sa Espiritung nasa kay Moises
  rationale: Ipinahahayag ang pagkuha o pagbabahagi mula sa Espiritung nasa kay Moises nang hindi tahasang ipinahihiwatig na nabawasan o nahati ang Espiritu.
- source_word: רוּחַ
  choice: Espiritu
  rationale: Ang bunga nitong pagpapahayag bilang mga propeta ay nagpapakitang ang tinutukoy ay ang nagbibigay-kakayahang Espiritu ng Diyos, hindi hangin o disposisyon lamang.
- source_word: וַיִּתֵּן עַל
  choice: inilagay iyon sa
  rationale: Natural sa modernong Tagalog at pinananatili ang larawan ng Espiritung ipinagkaloob sa mga matatanda.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: pitumpung matatandang lalaki
  rationale: Pinagsasama sa natural na Tagalog ang bilang, ang tahasang salitang 'lalaki,' at ang katayuan nilang mga matatanda.
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: Nang manahan sa kanila ang Espiritu
  rationale: Ang 'manahan' ay natural na nagpapahayag ng paglagak o pamamalagi ng Espiritu sa kanila, bagaman hindi nito literal na inuulit ang larawang 'sa ibabaw.'
- source_word: וַיִּתְנַבְּאוּ
  choice: nagpahayag sila bilang mga propeta
  rationale: Malinaw sa karaniwang mambabasa at saklaw ang makahulang pagsasalita o pagkilos na ipinahihiwatig ng pandiwa.
- source_word: וְלֹא יָסָפוּ
  choice: hindi na nila iyon ipinagpatuloy
  rationale: 'Ito ang malamang na diwa sa konteksto: hindi nagpatuloy ang kanilang makahulang pagpapahayag. Dahil maigsi at pinagtatalunan ang parirala, inilalahad sa talababa ang salungat na tradisyonal na pagbasa.'
theological_decisions:
- issue: Kung ang רוּחַ ay Espiritu ng Diyos o karaniwang 'espiritu' lamang
  choice: Espiritu
  alternative: espiritu
  rationale: Iniuugnay ng konteksto ang Espiritung nasa kay Moises sa pagbibigay-kakayahan sa mga matatanda upang magpahayag bilang mga propeta. Ang malaking titik ay isang pasyang editoryal sa Tagalog, hindi dagdag na pahayag na lampas sa konteksto.
- issue: Kahulugan ng וְלֹא יָסָפוּ
  choice: hindi na nila iyon ipinagpatuloy
  alternative: hindi sila tumigil
  rationale: Maaaring unawain ang maigsi at idiomatikong parirala bilang hindi na nila ipinagpatuloy o hindi na inulit ang pagpapahayag. Mayroon ding matandang pagbasa na 'hindi sila tumigil'; pinananatili ito sa talababa upang hindi itago ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'Yahweh' para sa banal na pangalan at iniwasan ang labis na teknikal o denominasyonal na bokabularyo.
