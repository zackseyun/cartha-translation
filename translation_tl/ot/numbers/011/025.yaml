revisions:
- from: Pagkatapos, bumaba si Yahweh sa ulap at nagsalita kay Moises. Kumuha siya mula sa Espiritung nasa kay Moises at inilagay iyon sa pitumpung matatandang lalaki. Nang manahan sa kanila ang Espiritu, nagpahayag sila bilang mga propeta, ngunit hindi na nila iyon ipinagpatuloy.[a]
  to: Pagkatapos, bumaba si Yahweh sa ulap at nagsalita kay Moises. Kumuha siya mula sa Espiritung sumasa-kay Moises at inilagay niya ito sa pitumpung matatandang lalaki. Nang namahinga sa kanila ang Espiritu, nagpropesiya sila, ngunit hindi na nila iyon ipinagpatuloy.[a]
  rationale: Inayos ang maling konstruksiyong “nasa kay Moises,” pinili ang pandiwang mas malapit sa larawang “namahinga,” at ginawang mas tuwiran ang paglalarawan sa makahulang gawain. Pinanatili ang alternatibong pagbasa ng pangwakas na Hebreong parirala sa talababa at ang pagkakaangkla nito sa dulo ng sugnay na tinutukoy.
