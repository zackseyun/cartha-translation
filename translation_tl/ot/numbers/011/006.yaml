base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: tl
  text: Ngunit ngayon, tuyot na ang aming gana[a]; wala kaming anuman kundi ang manna na nasa harap ng aming mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tuyot na ang aming kaluluwa.” Ang Hebreong נֶפֶשׁ (nefesh) ay maaaring mangahulugang “kaluluwa,” “buhay,” o, sa konteksto ng pagkain, “gana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Sa konteksto ng reklamo, ang pang-ugnay at panandang temporal ay nagpapakita ng pagsalungat sa dating kalagayan.
- source_word: נַפְשֵׁנוּ
  choice: ang aming gana
  rationale: Bagaman maaaring tumukoy ang נֶפֶשׁ sa kaluluwa o buhay, sa konteksto ng pagkain ay natural itong tumukoy sa gana o pagnanasa sa pagkain.
- source_word: יְבֵשָׁה
  choice: tuyot na
  rationale: Pinananatili nito ang kongkretong larawan ng pagkatuyo at ang kalagayang ipinahahayag ng pang-uri.
- source_word: אֵין כֹּל
  choice: wala na
  rationale: Natural na ipinahahayag nito sa Filipino ang mariing kawalan sa reklamo; pinalalakas pa ito ng eksklusibong pariralang kasunod.
- source_word: בִּלְתִּי אֶל
  choice: kundi
  rationale: Malinaw at likas na katumbas ito ng konstruksyong nagsasaad na walang iba maliban sa isang bagay.
- source_word: הַמָּן
  choice: ang manna
  rationale: Tinutukoy ng artikulong Hebreo ang kilala at tiyak na pagkaing manna; hindi dinaragdagan ng demonstratibong wala sa teksto.
- source_word: עֵינֵינוּ
  choice: kaming nakikita
  rationale: Inililipat sa natural na Filipino ang idyomang literal na 'sa aming mga mata' habang pinananatili ang larawan ng laging nakikitang manna.
theological_decisions:
- issue: Saklaw ng נֶפֶשׁ sa reklamo tungkol sa pagkain
  choice: gana sa pangunahing teksto, na may talababa
  alternative: kaluluwa o buhay
  rationale: Ang konteksto ay pabor sa kahulugang 'gana,' ngunit tunay na malawak ang saklaw ng salitang Hebreo kaya hindi dapat itago ang mas literal na mga posibilidad.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang metapora ng pagkatuyot, ngunit ginawang likas sa Filipino ang huling sugnay. Ang talababa ay nagpapanatili sa leksikal na lawak ng נֶפֶשׁ.
