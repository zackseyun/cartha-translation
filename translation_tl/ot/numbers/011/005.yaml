id: NUM.11.5
reference: Numbers 11:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: tl
  text: Naaalala namin ang mga isdang kinakain namin noon sa Ehipto nang walang bayad[a], ang mga pipino, mga melon, mga puerro, mga sibuyas, at bawang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nang libre.” Ginugunita ng mga nagsasalita ang Ehipto ayon sa pananaw ng kanilang pagrereklamo, kahit na mga alipin sila roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: Naaalala namin
  rationale: Ang Qal perfect na unang panauhang maramihan ay nagpapahayag dito ng kasalukuyang pag-alaala sa tuwirang pagsasalita; natural sa modernong Tagalog ang “Naaalala namin.”
- source_word: הַדָּגָה
  choice: ang mga isda
  rationale: Kolektibong tumutukoy sa isda bilang pagkain; natural sa Tagalog ang anyong maramihan.
- source_word: אֲשֶׁר נֹאכַל
  choice: na kinakain namin noon
  rationale: Ang yiqtol ay may diwang nakagawian sa nakaraan; malinaw itong naihahatid ng “kinakain namin noon.”
- source_word: בְּמִצְרַיִם
  choice: sa Ehipto
  rationale: Tuwirang lokatibong salin.
- source_word: חִנָּם
  choice: nang libre
  rationale: Ipinahihiwatig ng salita na walang bayad. Pinananatili ng “nang libre” ang pananaw ng mga nagrereklamo nang hindi itinatama sa mismong teksto ang kabalintunaan ng kanilang pagkaalipin.
- source_word: הַקִּשֻּׁאִים
  choice: mga pipino
  rationale: Karaniwang pagkakakilanlan sa halamang binabanggit.
- source_word: הָאֲבַטִּחִים
  choice: melon
  rationale: Tumpak ngunit hindi labis na tiyak sa uri; maaaring kabilang dito ang pakwan, ngunit hindi kailangang ipasiya iyon sa salin.
- source_word: הֶחָצִיר
  choice: puero
  rationale: Sa konteksto ng talaan ng pagkain, malamang na gulay na kauri ng leek ang tinutukoy. Ang “puero” ang karaniwang modernong katawagan sa Filipino.
- source_word: הַבְּצָלִים
  choice: sibuyas
  rationale: Karaniwang katumbas sa Tagalog.
- source_word: הַשּׁוּמִים
  choice: bawang
  rationale: Karaniwang katumbas sa Tagalog.
theological_decisions:
- issue: Kahulugan ng חִנָּם sa liwanag ng pagkaalipin ng Israel sa Ehipto
  choice: nang libre
  alternative: nang walang bayad; malaya
  rationale: Iniuulat ng talata ang paggunita ng mga nagrereklamo, hindi isang obhetibong pagtatasa sa kanilang buhay sa Ehipto. Pinananatili ng salin ang kanilang retorika at ang kabalintunaan nito nang hindi nagdaragdag ng interpretatibong pagtutuwid sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “puero” bilang pangkaraniwang katawagan sa leek at ang “kinakain namin noon” upang malinaw na maipahayag ang nakagawiang kilos sa nakaraan.
