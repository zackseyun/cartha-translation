  source_fidelity: 'Tumpak sa kabuuan ang diwa ng talata: sinasagot ni Moises ang paninibugho para sa kanyang kapakanan at ipinahahayag ang hangaring maging propeta ang buong bayan ni Yahweh sa pagkakaloob ng kanyang Espiritu. Gayunman, mas malinaw na maipapakita sa Tagalog ang magkatuwang na optatibong diwa ng huling dalawang sugnay kaysa sa konstruksyong “—na ilagay.”'
  naturalness: Ang “Ngunit sinabi sa kanya ni Moises” ay nauunawaan ngunit mas natural ang “Ngunit sinabi ni Moises sa kanya.” Ang “na ilagay ni Yahweh ang kanyang Espiritu sa kanila” ay medyo pilit sa modernong Tagalog; ang “at ipagkaloob ni Yahweh ang kanyang Espiritu sa kanila” ay likas at nananatiling nasa saklaw ng Hebreong נָתַן (‘magbigay/ipagkaloob’).
  terminology: Ang “Yahweh,” “bayan,” “mga propeta,” at “kanyang Espiritu” ay angkop at pare-pareho. Ang “Naninibugho ka ba para sa akin?” ay mas likas na Tagalog kaysa “alang-alang sa akin” sa tanong na ito at pinananatili ang mapanuring himig ng הַמְקַנֵּא.
