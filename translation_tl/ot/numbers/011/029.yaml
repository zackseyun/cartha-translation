  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: tl
  text: Ngunit sinabi ni Moises sa kanya, “Naninibugho ka ba para sa akin?[a] Sana’y maging mga propeta ang buong bayan ni Yahweh, at ipagkaloob ni Yahweh ang kanyang Espiritu sa kanila!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Masigasig mo ba akong ipinagtatanggol?”'
    reason: Pinananatili ang saklaw ng kahulugan ng קנא, na maaaring magpahiwatig ng paninibugho o masigasig na pagtatanggol.
  - marker: b
    text: Maaaring unawain ang כִּי bilang pagpapatuloy ng hangarin (“na ipagkaloob ni Yahweh ...”), o bilang “sapagkat” o “kapag.” Literal na ang pandiwang Hebreo ay “magbigay,” at inilalarawan nito ang Espiritu ni Yahweh na dumarating sa kanila.
    reason: May higit sa isang posibleng ugnayan ang כִּי sa naunang hangarin. Ginawang likas sa Tagalog ang pangunahing salin habang itinatala ang saklaw ng gramatika at ang larawang Hebreo.
lexical_decisions:
- source_word: הַמְקַנֵּא אַתָּה לִי
  choice: Naninibugho ka ba alang-alang sa akin?
  rationale: Ipinahihiwatig ng קנא ang mapanibughong pag-iingat sa kapakanan o katayuan ni Moises. Pinananatili ng “naninibugho” ang posibleng di-kanais-nais na himig, samantalang malinaw na ipinapakita ng “alang-alang sa akin” kung kaninong kapakanan ang iniingatan.
- source_word: וּמִי יִתֵּן
  choice: Sana’y
  rationale: Isang idyomang Hebreo ito na nagpapahayag ng matinding hangarin, hindi literal na tanong na “Sino ang magbibigay?” Natural itong naipapahayag sa modernong Tagalog sa pamamagitan ng “Sana’y.”
- source_word: כָּל עַם יְהוָה
  choice: ang buong bayan ni Yahweh
  rationale: Pinananatili nito ang kolektibong diwa ng עַם at ang ugnayang pag-aari o pakikipagtipan na ipinahihiwatig ng construct phrase.
- source_word: נְבִיאִים
  choice: mga propeta
  rationale: Tuwirang katumbas ito ng pangngalang Hebreo at hindi nito ginagawang mas tiyak kaysa sa teksto ang uri o tagal ng kanilang pagpopropesiya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: רוּחוֹ
  choice: kanyang Espiritu
  rationale: Sa konteksto ng kapangyarihang magpahayag bilang propeta, tumutukoy ang רוּחַ sa Espiritu ng Diyos. Ang malaking titik ay tumutulong na linawin ang tinutukoy nang hindi nagdaragdag ng paliwanag sa katawan ng talata.
- source_word: יִתֵּן ... אֶת רוּחוֹ עֲלֵיהֶם
  choice: ilagay ... ang kanyang Espiritu sa kanila
  rationale: Pinananatili ng “ilagay ... sa kanila” ang larawang Hebreo ng Espiritu na ipinagkakaloob o inilalagay sa mga tao para sa gawaing propetiko.
theological_decisions:
- issue: Ang diwa ng קנא sa pagtatanggol ni Josue sa katayuan ni Moises
  choice: naninibugho
  alternative: masigasig na ipinagtatanggol
  rationale: Maaaring magtaglay ang salita ng sigasig o paninibugho. Pinili ang “naninibugho” dahil ang tanong ni Moises ay sumasaway sa mapag-ingat na saloobin para sa kanyang sariling katayuan, ngunit itinala sa talababa ang mas neutral na posibilidad.
- issue: Ang tinutukoy ng רוּחוֹ
  choice: kanyang Espiritu
  alternative: kanyang espiritu
  rationale: Ang agarang konteksto ay banal na pagbibigay-kakayahan para sa propesiya. Kaya ang “Espiritu” ang pinakamalinaw na pagtukoy sa Espiritu ni Yahweh, nang hindi ipinapasok ang mas huling mga pormulang doktrinal.
- issue: Ang ugnayan ng כִּי sa naunang optatibong hangarin
  choice: na ilagay ni Yahweh ang kanyang Espiritu sa kanila
  alternative: sapagkat/kapag ilalagay ni Yahweh ang kanyang Espiritu sa kanila
  rationale: Maaaring ipagpatuloy ng כִּי ang nilalaman ng hangarin, o ipakilala ang dahilan o kalagayan nito. Pinananatili sa pangunahing salin ang optatibong daloy at inilalahad sa talababa ang ibang posibleng ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “bayan” para sa kolektibong עַם, “Yahweh” para sa banal na pangalan, at “Espiritu” para sa banal na nagbibigay-kakayahan. Ang gitling na mahaba ay tumutulong na ipakita na ang ikalawang sugnay ay pagpapatuloy ng hangarin, habang pinananatili sa talababa ang gramatikal na kalabuan.
