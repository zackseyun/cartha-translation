revisions:
- from: Ngunit sinabi sa kanya ni Moises, “Naninibugho ka ba alang-alang sa akin?[a] Sana’y maging mga propeta ang buong bayan ni Yahweh—na ilagay ni Yahweh ang kanyang Espiritu sa kanila!”[b]
  to: Ngunit sinabi ni Moises sa kanya, “Naninibugho ka ba para sa akin?[a] Sana’y maging mga propeta ang buong bayan ni Yahweh, at ipagkaloob ni Yahweh ang kanyang Espiritu sa kanila!”[b]
  rationale: Inayos ang ayos ng pandiwang pagsasalita at pinalitan ang hindi likas na “na ilagay” ng “at ipagkaloob,” upang malinaw na parehong saklaw ng hangarin ni Moises ang pagiging propeta ng bayan at pagkakaloob ni Yahweh ng kanyang Espiritu. Pinanatili ang “maging,” na likas na paraan sa Tagalog upang ipahayag ang optatibong nominal na sugnay. Nilinaw rin ang talababa upang hindi magpanggap na eksaktong literal ang isang idyomatikong Tagalog na paglalarawan.
