  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: tl
  text: Ang halu-halong pulutong[a] na kasama nila ay labis na nagnasa[b]. Maging ang mga anak ng Israel ay muling umiyak[c] at nagsabi, “Sino ang magpapakain sa atin ng karne?”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga taong nakihalo sa kanila.” Bihira at may mapanghamak na himig ang salitang Hebreo para sa isang pangkat sa loob ng kampo na hindi kabilang sa pangunahing Israelitang pamayanan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “nagnasa sila ng pagnanasa,” isang pag-uulit ng magkauring salita upang idiin ang tindi ng kanilang pagnanasa.
    reason: source_idiom
  - marker: c
    text: Sa literal, “bumalik sila at umiyak”; malamang na ang ibig sabihin ay muli silang umiyak.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “Sino ang magbibigay sa atin ng karneng makakain?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: ang halu-halong pulutong
  rationale: Bihira at may mapanirang himig ang Hebreong kolektibong pangngalan. Ang “halu-halong pulutong” ay malinaw sa makabagong Tagalog at nagpapahiwatig ng pangkat na hindi kabilang sa pangunahing Israelitang pamayanan; nililinaw ng talababa ang negatibong kulay ng salita.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: na kasama nila
  rationale: Natural itong katumbas ng ‘nasa gitna nila’ at iniiwasan ang alanganing pagtutugma ng isahan at maramihan.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: ay labis na naghangad
  rationale: Ang pandiwa at kauring pangngalan sa Hebreo ay nagbibigay-diin sa tindi ng pagnanasa. Mas natural sa Tagalog ang “labis na naghangad” kaysa piliting ulitin ang magkauring salita.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: ay muling umiyak
  rationale: Dito, malamang na ipinahihiwatig ng שׁוב ang pag-uulit o pagpapatuloy muli ng pag-iyak. Pinananatili ng “muling” ang diwang iyon nang natural.
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: Maging ang mga anak ng Israel
  rationale: Pinananatili ng “mga anak ng Israel” ang pormal na pananalitang pangangkan sa Hebreo, samantalang ipinapahayag ng “maging” ang diin ng גַּם.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Sino ang magpapakain sa atin ng karne?
  rationale: Ang Hiphil ng אכל ay ‘magpakain’ o ‘magbigay upang makain,’ at ang בשר sa kontekstong ito ay karneng pagkain.
