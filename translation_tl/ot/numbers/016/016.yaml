base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: tl
  text: At sinabi ni Moises kay Korah, “Ikaw at ang buong kapulungan mo ay humarap kayo kay Yahweh bukas—ikaw, sila, at si Aaron.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל קֹרַח
  choice: At sinabi ni Moises kay Kora
  rationale: Pinananatili ng “At” ang daloy ng salaysay na ipinahihiwatig ng waw-consecutive; natural sa modernong Filipino ang “sinabi ... kay.”
- source_word: אַתָּה וְכָל עֲדָתְךָ
  choice: Ikaw at ang buong kapulungan mo
  rationale: Ang עֵדָה ay tumutukoy sa isang nagkakatipong pangkat o kapulungan; ang “kapulungan” ay malinaw at angkop sa konteksto.
- source_word: הֱיוּ לִפְנֵי יְהוָה
  choice: ay humarap kay Yahweh
  rationale: Bagaman literal na “maging sa harap ni Yahweh,” ang parirala sa konteksto ay nag-uutos na pumaroon at magpakita sa presensiya niya. Ang “humarap kay Yahweh” ay natural habang pinananatili ang diwa ng לִפְנֵי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang “Yahweh.”
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: ikaw, sila, at si Aaron
  rationale: Pinananatili ang tahasang pag-uulit at pagtukoy sa lahat ng panig, ngunit gumagamit ng natural na bantas sa Filipino.
- source_word: מָחָר
  choice: bukas
  rationale: Karaniwan at tuwirang katumbas ng temporal na pang-abay na מָחָר.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapulungan” sa halip na mas makaluma o mas denominasyonal na katawagan. Walang talababa dahil malinaw na naipapahayag sa pangunahing teksto ang kahulugan at ang tahasang listahan ng mga haharap.
