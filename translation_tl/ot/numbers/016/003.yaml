base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: tl
  text: Nagtipon sila laban kina Moises at Aaron at sinabi sa kanila, “Sobra na kayo![a] Sapagkat ang buong kapulungan—bawat isa sa kanila—ay banal, at si Yahweh ay nasa gitna nila. Kaya bakit itinataas ninyo ang inyong sarili nang higit sa kapulungan ni Yahweh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal na: “Sobra na para sa inyo.” Maaari rin itong isalin: “Lumampas na kayo!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל
  choice: Nagtipon sila laban
  rationale: Pinananatili ng “nagtipon” ang sama-samang pagkilos ng Niphal na קהל, samantalang malinaw na ipinapahayag ng “laban” ang mapanlabang gamit ng עַל sa konteksto.
- source_word: רַב לָכֶם
  choice: Sobra na ang ginagawa ninyo!
  rationale: Likas itong matalim na pagsaway sa modernong Tagalog at ipinahihiwatig na lumampas na sa nararapat sina Moises at Aaron, habang inilalagay sa talababa ang mas literal na mga posibilidad.
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: Ang buong kapulungan—bawat isa sa kanila—
  rationale: Pinananatili nito ang mariing pag-uulit at kabuuang saklaw ng כָל ... כֻּלָּם. Ang “kapulungan” ay angkop sa sambayanang Israel bilang nagkakatipong pamayanan.
- source_word: קְדֹשִׁים
  choice: banal
  rationale: Ang “banal” ang karaniwan at may bigat na salin ng קדושׁ, nang hindi pinahihina o pinatitibay ng tagapagsalin ang pahayag ng mga nagsasalita.
- source_word: וּבְתוֹכָם יְהוָה
  choice: at si Yahweh ay nasa gitna nila
  rationale: Malinaw at natural na ipinapahayag ng “nasa gitna nila” ang presensiya ng Diyos sa loob ng pamayanan; pinananatili ang pangalang Yahweh.
- source_word: תִּתְנַשְּׂאוּ עַל
  choice: itinataas ninyo ang inyong sarili sa ibabaw
  rationale: Ipinapakita ng parirala ang reflexive na diwa ng Hitpael at ang paratang na inilalagay nila ang sarili nila sa mas mataas na kalagayan kaysa sa kapulungan.
- source_word: קְהַל יְהוָה
  choice: kapulungan ni Yahweh
  rationale: Ang “kapulungan” ay likas na katumbas ng קהל sa konteksto, at ang “ni Yahweh” ay malinaw na nagpapahayag na ang kapulungan ay sa kaniya.
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Kung dapat bang sang-ayunan o pahinain sa salin ang pahayag na banal ang buong kapulungan
  choice: Tuwirang iniulat bilang pahayag ng mga nagsasalita
  alternative: Lagyan ng paliwanag gaya ng “nag-aangking banal”
  rationale: Hindi hinahatulan ng salin ang pahayag sa loob mismo ng pangungusap. Ang mas malawak na salaysay ang nagbibigay ng pagsusuri rito, kaya nananatili ang teolohikal at naratibong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa publikong pagbasa. Ginamit ang “kina Moises at Aaron” bilang natural na anyo pagkatapos ng “laban,” at pinanatili ang mariing gitling sa pahayag tungkol sa buong kapulungan.
