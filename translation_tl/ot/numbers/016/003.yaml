revisions:
- from: Nagtipon sila laban kina Moises at Aaron at sinabi sa kanila, “Sobra na ang ginagawa ninyo![a] Ang buong kapulungan—bawat isa sa kanila—ay banal, at si Yahweh ay nasa gitna nila. Kaya bakit itinataas ninyo ang inyong sarili sa ibabaw ng kapulungan ni Yahweh?”
  to: Nagtipon sila laban kina Moises at Aaron at sinabi sa kanila, “Sobra na kayo![a] Sapagkat ang buong kapulungan—bawat isa sa kanila—ay banal, at si Yahweh ay nasa gitna nila. Kaya bakit itinataas ninyo ang inyong sarili nang higit sa kapulungan ni Yahweh?”
