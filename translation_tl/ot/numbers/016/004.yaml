base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: tl
  text: Nang marinig ito ni Moises, nagpatirapa siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bumagsak siya sa kanyang mukha”; maaari ring “napasubsob siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nang marinig ito
  rationale: Ang שׁמע sa sunod-sunod na salaysay ay likas na nangangahulugang “marinig.” Ipinahihiwatig ng konteksto ang layon—ang sinabi sa naunang talata—kaya natural sa Tagalog ang “marinig ito.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: nagpatirapa siya
  rationale: Ang literal na larawan ay “bumagsak sa kanyang mukha.” Ang “nagpatirapa” ay natural at dignidad na katumbas sa Tagalog para sa paglagay ng katawan nang nakadapa at nakaharap sa lupa, habang hindi itinatakda kung panalangin, dalamhati, pagpapakumbaba, o pamamagitan ang tiyak na dahilan.
theological_decisions:
- issue: Kahulugan ng kilos ni Moises
  choice: Ilarawan lamang ang pisikal na kilos bilang “nagpatirapa siya.”
  alternative: “Nagpatirapa siya sa panalangin” o “napasubsob siya sa dalamhati.”
  rationale: Binabanggit ng Hebreo ang kilos ngunit hindi tahasang ipinapaliwanag ang layunin o damdamin nito. Hindi dapat dagdagan ng salin ang isang tiyak na interpretasyong debosyonal o emosyonal.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang “nagpatirapa” bilang natural na katumbas ng Hebreong idyoma; inilagay sa talababa ang literal na larawan.
