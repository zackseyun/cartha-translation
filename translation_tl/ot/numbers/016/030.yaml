  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: tl
  text: Ngunit kung lumikha si Yahweh ng isang bagong bagay[a], at ibuka ng lupa ang bibig nito at lamunin sila at ang lahat ng nauukol sa kanila, at bumaba silang buháy sa Sheol[b], malalaman ninyo na hinamak ng mga lalaking ito si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang bagong likha.” Magkaugnay na pangngalan at pandiwa ang ginagamit sa Hebreo—sa literal, “lumikha ng isang likha”—upang idiin ang pambihirang gawa ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Ang Sheol ay terminong Hebreo para sa dako ng mga patay; maaari rin itong unawain dito bilang “libingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: lumikha ... ng isang bagong bagay
  rationale: Pinananatili ang pandiwang “lumikha” at likas na ipinahahayag sa Tagalog ang pambihira at bagong gawa ng Diyos. Ipinaliliwanag sa talababa ang pag-uulit ng magkaugnay na pangngalan at pandiwa sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: ibuka ng lupa ang bibig nito
  rationale: Pinananatili ang malinaw na personipikasyon ng lupa na bumubuka ng bibig.
- source_word: וּבָלְעָה
  choice: lamunin
  rationale: Direkta at natural na katumbas ng paglunok o pag-engulf sa kanila.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: lahat ng pag-aari nila
  rationale: Naghahatid ng malawak na saklaw ng lahat ng nauukol sa kanila nang hindi nagdaragdag ng tiyak na kategorya.
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: bumaba silang buháy sa Sheol
  rationale: Pinananatili ang direksiyon ng pagbaba, ang diin na buhay pa sila, at ang Hebreong terminong Sheol.
- source_word: וִידַעְתֶּם
  choice: malalaman ninyo
  rationale: Natural na ipinahahayag ang resultang kasunod ng kondisyong ipinakilala ng “kung.”
- source_word: נִאֲצוּ
  choice: hinamak
  rationale: Ipinahahayag ang mapanghamak at tahasang paglapastangan o pagtatakwil kay Yahweh.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: mga lalaking ito
  rationale: Pinananatili ang tahasang panlalaking anyo ng pangngalang Hebreo.
theological_decisions:
- issue: Pagsasalin ng שְׁאוֹל
  choice: Sheol
  alternative: libingan; dako ng mga patay
  rationale: Mas malawak ang maaaring kahulugan ng terminong Hebreo kaysa sa isang pisikal na libingan lamang. Pinananatili ng transliterasyon ang saklaw at tensiyong teolohikal nito, habang inilalahad sa talababa ang mga posibleng pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buháy” na may tuldik upang maiwasan ang maling pagbasa, at pinanatili ang matingkad na larawan ng lupang bumubuka ng bibig.
