base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: tl
  text: Kaya ikaw at ang buong pangkat mo ay nagtipon laban kay Yahweh; at si Aaron, ano ba siya para magreklamo kayo laban sa kaniya?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas na modernong Tagalog na nagpapahayag ng kongklusyon mula sa naunang sinabi ni Moises.
- source_word: עֲדָתְךָ
  choice: ang buong pangkat mo
  rationale: Tumutukoy sa pangkat ni Korah; malinaw at hindi nagdadala ng di-kinakailangang kahulugang panrelihiyon na maaaring taglayin ng “kongregasyon.”
- source_word: הַנֹּעָדִים
  choice: na nagtipon
  rationale: Pinananatili ang diwa ng Niphal participle na sama-samang pagtitipon nang hindi dinaragdagan ang motibo.
- source_word: עַל יְהוָה
  choice: laban kay Yahweh
  rationale: Ang עַל ay may salungat na diwa sa konteksto ng paghihimagsik, at ang banal na pangalan ay isinalin bilang Yahweh.
- source_word: וְאַהֲרֹן מַה הוּא
  choice: at sino ba si Aaron
  rationale: Natural na retorikal na Tagalog na nagpapaliit sa personal na katayuan ni Aaron at ipinakikitang si Yahweh ang tunay na nilalabanan.
- source_word: תלונו עָלָיו
  choice: magreklamo kayo laban sa kaniya
  rationale: Ipinahahayag ang negatibo at mapanghimagsik na pagrereklamo sa salaysay sa ilang nang hindi gumagamit ng lipas na “bumulung-bulong.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang pinananatili ang personal na pangalang tipan sa tekstong Hebreo.
- issue: Ang tunay na pinatutungkulan ng paghihimagsik
  choice: Ang pangkat ay nagtipon laban kay Yahweh; si Aaron ay binabanggit sa isang retorikal na tanong.
  alternative: Magkapantay na nilalabanan ng pangkat sina Yahweh at Aaron.
  rationale: Ang ayos ng Hebreo ay pangunahing tumutukoy sa paglaban kay Yahweh at saka minamaliit ang personal na papel ni Aaron sa tanong na “ano ba siya?”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “pangkat” para sa pangkatin ni Korah at ang “sino ba si Aaron” bilang likas na katumbas ng retorikal na Hebreo.
