base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: tl
  text: Lagyan ninyo ng apoy ang mga iyon at maglagay kayo ng insenso sa mga iyon sa harap ni Yahweh bukas. At ang lalaking pipiliin ni Yahweh—siya ang banal. Sobra na kayo, mga anak ni Levi![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na salin: “Napakarami para sa inyo, mga anak ni Levi!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: Lagyan ninyo ng apoy ang mga iyon
  rationale: Ang נתן na may ב ay tumutukoy sa paglalagay ng apoy sa loob ng mga insensaryo na binanggit sa naunang talata. Likas sa makabagong Tagalog ang pandiwang “lagyan.”
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: at maglagay kayo ng insenso sa ibabaw ng mga iyon
  rationale: Pinananatili ng “sa ibabaw” ang puwersa ng עַל at ipinahihiwatig na ilalagay ang insenso sa apoy na nasa mga insensaryo.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tapat na inilalarawan ang paghaharap o paggawa sa presensiya ni Yahweh sa kontekstong pangpagsamba.
- source_word: מָחָר
  choice: bukas
  rationale: Tuwirang katumbas ng pang-abay na tumutukoy sa susunod na araw.
- source_word: הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: ang lalaking pipiliin ni Yahweh
  rationale: Pinananatili ang panlalaking isahan ng אִישׁ at ang panghinaharap na diwa ng pagpili sa nalalapit na pagsubok.
- source_word: הוּא הַקָּדוֹשׁ
  choice: siya ang banal
  rationale: Pinananatili ng “ang banal” ang tiyak na anyo ng הַקָּדוֹשׁ at ang diin ng panghalip na הוּא, nang hindi dinaragdagan ng paliwanag kung paano banal ang pinili.
- source_word: רַב לָכֶם
  choice: Sobra na ang ginagawa ninyo
  rationale: Ipinahahayag nito bilang likas na pagsaway sa Tagalog ang idyomang literal na may diwang “napakarami para sa inyo,” habang iniiwasang tukuyin nang mas eksakto kaysa sa pinagmulan ang uri ng kanilang paglabag.
- source_word: בְּנֵי לֵוִי
  choice: mga anak ni Levi
  rationale: Pinananatili ang pampamilyang anyo at tuwirang pagtawag ng Hebreong parirala, sa halip na gawing pangkalahatang “mga Levita.”
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Direktang ginagamit ng talata ang Tetragrammaton; pinananatili rito ang pangalang tipan bilang “Yahweh” alinsunod sa patakaran ng proyekto.
- issue: Diwa ng הוּא הַקָּדוֹשׁ
  choice: siya ang banal
  alternative: siya ang taong banal; siya ang itinalagang banal
  rationale: Pinananatili ang tiyak ngunit maikling pahayag ng Hebreo at hindi ipinapasok ang isang paliwanag tungkol sa pagtatalaga o katungkulan na hindi tahasang nasa teksto.
- issue: Puwersa ng רַב לָכֶם
  choice: Sobra na ang ginagawa ninyo
  alternative: Napakarami para sa inyo; Tama na, mga anak ni Levi
  rationale: Ang konteksto ay nagpapakitang isa itong matinding pagsaway sa kanilang paglampas sa hangganan, ngunit inilalahad sa talababa ang mas literal na anyo upang mapanatili ang likas na kalabuan ng idyoma.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” sa pangmaramihang utos, pinanatili ang pangalang Yahweh at ang katawagang “mga anak ni Levi,” at iniwasan ang arkaiko o labis na teknikal na pananalita.
