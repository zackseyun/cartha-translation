revisions:
- from: Lagyan ninyo ng apoy ang mga iyon at maglagay kayo ng insenso sa ibabaw ng mga iyon sa harap ni Yahweh bukas. At ang lalaking pipiliin ni Yahweh—siya ang banal. Sobra na ang ginagawa ninyo, mga anak ni Levi![a]
  to: Lagyan ninyo ng apoy ang mga iyon at maglagay kayo ng insenso sa mga iyon sa harap ni Yahweh bukas. At ang lalaking pipiliin ni Yahweh—siya ang banal. Sobra na kayo, mga anak ni Levi![a]
  rationale: Inayos ang lokatibong parirala para maging likas sa Filipino at maiwasan ang di-sinasadyang larawan na ang insenso ay nasa ibabaw ng mga insensaryo. Inalis ang dagdag na “ginagawa” upang mapanatili ang maigsi at idyomatikong pagsaway ng Hebreo. Pinanatili ang pambalarilang ambigwidad at diin ng “siya ang banal,” gayundin ang pangalan, tuwirang tawag, at talababa para sa alternatibong mas literal na pagbasa.
