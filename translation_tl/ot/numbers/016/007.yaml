review_pass:
  verdict: revise
  source_fidelity: Tumpak na naisasalin ng draft ang dalawang utos, ang panahon na “bukas,” ang pagkilos ni Yahweh sa pagpili, at ang mariing pagsaway sa mga anak ni Levi. Gayunman, ang “sa ibabaw ng mga iyon” ay maaaring magpahiwatig na ang insenso ay ilalagay sa ibabaw ng mga insensaryo mismo, samantalang ang Hebreong konstruksiyon ay mas natural na tumutukoy sa paglalagay nito sa mga insensaryo, sa apoy na naroon. Ang “Sobra na ang ginagawa ninyo” ay nagdaragdag ng “ginagawa,” na wala sa idyomatikong Hebreo.
  naturalness: Makabago at malinaw ang kabuuan, ngunit mas likas ang “sa mga iyon” kaysa “sa ibabaw ng mga iyon” sa ganitong utos. Ang “Sobra na kayo” ay mas maigsi at mas malapit na pagsaway kaysa “Sobra na ang ginagawa ninyo.”
  terminology: 'Ang “Yahweh,” “insenso,” at “mga anak ni Levi” ay angkop. Ang “siya ang banal” ay maaaring panatilihin: sa anyong ito ay naipahihiwatig nito ang tiyak na katawagang “ang banal [na isa]” at hindi lamang ang predikadong “siya ay banal.”'
  issues:
  - severity: medium
    issue: Ang “sa ibabaw ng mga iyon” ay hindi likas at maaaring ilarawan ang insenso bilang nasa ibabaw ng mga insensaryo.
    rationale: Ang עֲלֵיהֶן ay maaaring panatilihin sa natural na Tagalog sa pamamagitan ng “sa mga iyon,” dahil malinaw sa naunang konteksto na ang insenso ay inilalagay sa mga insensaryo na may apoy.
  - severity: low
    issue: Ang “ginagawa” sa “Sobra na ang ginagawa ninyo” ay hindi tahasang nasa pinagmulan.
    rationale: Ang רַב לָכֶם ay isang maikling idyomatikong pagsaway. Ang “Sobra na kayo” ay nagpapanatili ng pagtuligsa nang hindi tinutukoy ang isang bagay na ginagawa nila.
