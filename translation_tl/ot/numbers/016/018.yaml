  text: וַ/יִּקְח֞וּ אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ עֲלֵי/הֶם֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עֲלֵי/הֶ֖ם קְטֹ֑רֶת וַֽ/יַּעַמְד֗וּ פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד וּ/מֹשֶׁ֥ה וְ/אַהֲרֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: tl
  text: Kaya kinuha ng bawat isa ang kanyang lalagyan ng baga[a], nilagyan nila ng apoy ang mga iyon, at nilagyan nila ang mga iyon ng insenso. Tumayo sila sa pasukan ng Toldang Tagpuan, kasama sina Moises at Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “insensaryo.” Ang salitang Hebreo ay tumutukoy sa sisidlang ginagamit sa pagdadala ng nagbabagang uling para sa paghahandog ng insenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: bawat isa ang kanyang lalagyan ng baga
  rationale: 'Ginamit nang distributibo ang אִישׁ kasama ng panghalip na isahan: bawat isa ay kumuha ng sarili niyang kagamitan. Ang מַחְתָּה ay sisidlang ginagamit sa pagdadala ng nagbabagang uling para sa pagsusunog ng insenso; malinaw at kongkreto sa modernong Filipino ang “lalagyan ng baga.”'
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: nilagyan nila ng apoy ang mga iyon
  rationale: Bagaman literal na “naglagay sila ng apoy sa ibabaw ng mga iyon,” likas sa Filipino ang konstruksyong “nilagyan ... ng apoy” para sa paglalagay ng apoy o baga sa loob ng mga sisidlan.
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: pinatungan ng insenso
  rationale: Ipinahihiwatig ng עֲלֵיהֶם na inilagay ang insenso sa ibabaw ng apoy o baga sa mga lalagyan. Ang “pinatungan” ay maikli, natural, at pinananatili ang relasyong “sa ibabaw.”
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Ito ang karaniwang katawagan sa mabangong sangkap na sinusunog sa konteksto ng pagsamba.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pasukan ng Toldang Tagpuan
  rationale: Ang פֶּתַח ay “pasukan” o “bungad.” Isinasalin ng “Toldang Tagpuan” ang אֹהֶל מוֹעֵד bilang toldang itinakda para sa pakikipagtagpo, nang hindi ito napagkakamalang “tipan.”
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: kasama sina Moises at Aaron
  rationale: Ang pariralang walang pandiwa pagkatapos ng pook ay pinakanatural unawain bilang pagsama nina Moises at Aaron sa mga nakatayo roon.
theological_decisions:
- issue: Ugnayan nina Moises at Aaron sa mga lalaking nakatayo sa pasukan
  choice: kasama sina Moises at Aaron
  alternative: at sina Moises at Aaron
  rationale: Hindi tahasang inuulit ng Hebreo ang pandiwa, kaya maaaring panatilihin ang payak na “at.” Gayunman, malinaw na ipinahihiwatig ng ayos ng pangungusap na naroon ding nakatayo sina Moises at Aaron; ipinapahayag ito ng “kasama” nang hindi nagdaragdag ng papel o gawaing hindi sinabi sa teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang “lalagyan ng baga” sa pangunahing teksto para madaling maunawaan ang gamit ng sisidlan, habang inilagay sa talababa ang tradisyonal na “insensaryo.” Ginamit ang “Toldang Tagpuan” upang tumpak na ipahayag ang ideya ng itinakdang pakikipagtagpo sa אֹהֶל מוֹעֵד.
