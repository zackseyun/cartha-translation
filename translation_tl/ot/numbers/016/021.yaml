  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: tl
  text: “Humiwalay kayo mula sa gitna ng kapulungang ito, upang lipulin ko sila sa isang iglap.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: Humiwalay kayo
  rationale: Ang Niphal imperative plural ng בדל ay nag-uutos sa maraming kausap na ibukod ang kanilang sarili. Likas at malinaw sa modernong Filipino ang “Humiwalay kayo.”
- source_word: מִתּוֹךְ
  choice: mula sa gitna ng
  rationale: Pinananatili nito ang diwang mula sa loob ng isang pangkat, hindi lamang pangkalahatang paglayo.
- source_word: הָעֵדָה הַזֹּאת
  choice: kapulungang ito
  rationale: Ang עֵדָה ay tumutukoy sa nagkakatipong sambayanan o kapulungan. Ang “kapulungan” ay marangal at angkop sa konteksto nang hindi nililimitahan sa isang makabagong relihiyosong denominasyon.
- source_word: וַאֲכַלֶּה
  choice: upang lipulin ko
  rationale: Ipinahahayag ng anyong ito ang layunin o bunga kasunod ng utos. Ang “lipulin” ay nagpapanatili sa matindi at ganap na puwersa ng כלה sa konteksto ng hatol.
- source_word: אֹתָם
  choice: sila
  rationale: Tuwirang layon na tumutukoy sa kapulungang nasa ilalim ng ipinahayag na hatol.
- source_word: כְּרָגַע
  choice: sa isang iglap
  rationale: Ang רֶגַע ay napakaikling sandali; natural na ipinahahayag ng “sa isang iglap” ang bilis at biglaan ng hatol.
theological_decisions:
- issue: Kalikasan ng ipinahayag na banal na hatol
  choice: Isinalin bilang tunay at matinding layuning lipulin nang mabilis ang kapulungan.
  alternative: Palambutin bilang “harapin sila” o “alisin sila.”
  rationale: Malakas ang puwersa ng כלה sa kontekstong ito. Dapat manatili ang bigat at tensiyong teolohikal ng pahayag sa halip na pagaanin o ipaliwanag ito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang maigsi at kagyat na himig ng utos at banta.
