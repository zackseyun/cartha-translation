  yaml_path: translation/ot/numbers/016/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Yahweh kay Moises[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, ang pormula ay: “At nagsalita si Yahweh kay Moises, na nagsasabi.” Maaari ring isalin ang pambungad na pang-ugnay na “At” sa halip na “Pagkatapos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang wayyiqtol ng דבר ay nagpapausad sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos” para sa sunod-sunod na pangyayari, at pinananatili ng “nagsalita” ang diwa ng pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang likas na panandang Tagalog para sa taong pinatutungkulan ng pagsasalita; “Moises” ang nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa tuwirang pananalitang susunod sa kasunod na talata.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang pormulang “na sinasabi” dahil bukas ang talata sa tuwirang pananalitang kasunod, bagaman mas pormal ito kaysa karaniwang usapan.
