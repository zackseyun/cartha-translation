base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: tl
  text: At sinabi ni Moises, “Sa pamamagitan nito ay malalaman ninyo na isinugo ako ni Yahweh upang gawin ang lahat ng gawaing ito, at na hindi ito nagmula sa sarili kong puso.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hindi mula sa aking puso,” isang idyomang nangangahulugang hindi ito mula sa sarili kong pagkukusa o kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: At sinabi ni Moises
  rationale: Pinananatili ng “At” ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ang ugnayang panahunan o lohikal.
- source_word: בְּזֹאת
  choice: Sa pamamagitan nito
  rationale: 'Ipinapakita nito ang instrumental na gamit ng beth: ang nalalapit na pangyayari ang magiging patunay ng pahayag ni Moises.'
- source_word: תֵּדְעוּן
  choice: malalaman ninyo
  rationale: Likas na modernong Tagalog para sa imperfect na may hinaharap na diwa at para sa maramihang kinakausap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipanang pangalan na nakasulat sa tekstong Hebreo.
- source_word: שְׁלָחַנִי
  choice: isinugo ako
  rationale: Ang “isinugo” ay angkop sa banal na pag-aatas at malinaw na nagpapahayag na si Moises ang pinadalhan ng atas.
- source_word: לַעֲשׂוֹת
  choice: upang gawin
  rationale: Pinananatili ang layuning ipinahihiwatig ng infinitive nang natural sa Tagalog.
- source_word: אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: ang lahat ng gawaing ito
  rationale: Ang “gawain” ay sapat na malawak upang saklawin ang mga gawa, kilos, o bagay na ginawa, habang nananatiling natural sa konteksto.
- source_word: כִּי לֹא מִלִּבִּי
  choice: at na hindi ito nagmula sa sarili kong puso
  rationale: Pinananatili ang konkretong idyomang Hebreo at ang posibleng pagbasa sa ikalawang כִּי bilang karagdagang nilalaman ng “malalaman ninyo,” sa halip na tahasang lutasin ito bilang sanhi.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; ang “Yahweh” ay nagpapanatili sa personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng ikalawang כִּי sa pangunahing pahayag
  choice: at na
  alternative: sapagkat
  rationale: 'Maaaring ipakilala ng כִּי ang isa pang bagay na malalaman: na ang mga gawa ay hindi nagmula kay Moises mismo. Pinananatili ng “at na” ang pagbasa ring kinikilala sa ibinigay na pagsusuring leksikal at iniiwasang gawing tiyak ang isang ugnayang sanhi na hindi kinakailangan.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong larawan ng “puso” sa pangunahing teksto at ipinaliwanag sa talababa; iniwasan ang sobrang teknikal o makalumang pananalita.
