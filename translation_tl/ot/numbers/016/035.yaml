  text: וְ/אֵ֥שׁ יָצְאָ֖ה מֵ/אֵ֣ת יְהוָ֑ה וַ/תֹּ֗אכַל אֵ֣ת הַ/חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ מַקְרִיבֵ֖י הַ/קְּטֹֽרֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: tl
  text: At lumabas mula kay Yahweh ang apoy at tinupok ang dalawang daan at limampung lalaking naghahandog ng insenso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: At ... ang apoy
  rationale: Ang אֵשׁ ay “apoy”; ang וְ ay pinanatili bilang “At” upang ipakita ang pagpapatuloy ng salaysay. Natural sa Tagalog ang hulihang ayos ng simuno pagkatapos ng pandiwa.
- source_word: יָצְאָה
  choice: lumabas
  rationale: Ang יצא ay nangangahulugang “lumabas.” Direkta at natural itong paglalarawan sa apoy na nagmula sa presensiya ni Yahweh.
- source_word: מֵ/אֵת יְהוָה
  choice: mula kay Yahweh
  rationale: Ipinahihiwatig ng parirala ang pinagmulan ng apoy. Ginamit ang “kay” sapagkat personal na pangalan ang Yahweh, at pinanatili ang pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: וַ/תֹּאכַל
  choice: at tinupok
  rationale: Bagaman literal na “kumain” ang אכל, kapag apoy ang simuno ay idiomatiko itong “tumupok.” Ang “tinupok” ay malinaw, matindi, at natural sa modernong Tagalog.
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: ang dalawang daan at limampung lalaki
  rationale: Tumpak nitong inililipat ang bilang na 250 at ang אִישׁ bilang “lalaki,” habang gumagamit ng karaniwang pasulat na anyo ng bilang sa Tagalog.
- source_word: מַקְרִיבֵי
  choice: naghahandog
  rationale: Ang participle ng קרב ay naglalarawan sa mga lalaki ayon sa ginagawa nila noon. Ang “naghahandog” ay likas sa Tagalog at pinananatili ang aspektong di-ganap ng kilos.
- source_word: הַ/קְּטֹרֶת
  choice: ng insenso
  rationale: Ang קְטֹרֶת ay kultikong insenso sa kontekstong ito. Hindi kailangan ang hiwalay na pantukoy sa Tagalog pagkatapos ng “ng”; tiyak pa rin ang tinutukoy dahil sa salaysay.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ipinapalit ang isang titulo o denominasyonal na anyo.
- issue: Pinagmulan ng apoy sa pariralang מֵאֵת יְהוָה
  choice: mula kay Yahweh
  alternative: mula sa harapan ni Yahweh
  rationale: Sa kontekstong ito, natural na ipinapahayag ng מֵאֵת ang pinagmulan o pagkagaling kay Yahweh. Ang mas pormal na “mula sa harapan ni Yahweh” ay maaaring magmungkahi ng lokasyong hindi kailangang idiin ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “tinupok” bilang likas na kolokasyon para sa apoy, at iniwasan ang mga arkaiko o labis na teknikal na salita. Walang talababa dahil walang tunay na ambiguwalidad na kailangang ilahad para sa talatang ito.
