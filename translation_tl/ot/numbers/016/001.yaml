  terminology: Ang mga anyong Kora, Izhar, Kohat, Levi, Datan, Abiram, Eliab, On, Pelet, at Ruben ay pare-pareho at angkop sa modernong Tagalog na paggamit sa Bibliya. Ang “anak ni” at “mga anak ni” ay tumpak na nagpapanatili ng genealogical na anyo ng Hebreo.
