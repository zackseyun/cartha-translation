id: NUM.16.1
reference: Numbers 16:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: tl
  text: Kumuha ng mga lalaki[a] si Kora na anak ni Izhar, na anak ni Kohat, na anak ni Levi, kasama sina Datan at Abiram na mga anak ni Eliab, at si On na anak ni Pelet—mga anak ni Ruben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “at kumuha siya.” Hindi tahasang binanggit kung ano ang kinuha; idinagdag dito ang “mga lalaki” batay sa konteksto ng kasunod na talata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kumuha ng mga lalaki
  rationale: Literal na “at kumuha siya” ang Hebreo, ngunit walang tahasang layon ang pandiwa. Ipinahiwatig ng kasunod na talata ang mga lalaking kasama sa pagkilos, kaya idinagdag ang “mga lalaki” upang maging malinaw at likas sa Tagalog, habang itinatala sa talababa ang elipsis ng orihinal.
- source_word: קֹרַח
  choice: Kora
  rationale: Karaniwang anyong Tagalog ng pangalang personal na Korah.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: anak ni Izhar, na anak ni Kohat, na anak ni Levi
  rationale: Pinananatili ang paulit-ulit na ugnayang “anak ni” upang maipakita ang buong hanay ng angkan at ang diin ng Hebreo sa lahi.
- source_word: וְדָתָן וַאֲבִירָם
  choice: kasama sina Datan at Abiram
  rationale: Ipinakikita ng mga pangatnig na kasama sila ni Kora sa pagkilos. Likas sa Tagalog ang “kasama sina” at hindi nito dinaragdagan ang likas na kahulugan.
- source_word: בְּנֵי אֱלִיאָב
  choice: mga anak ni Eliab
  rationale: Tuwirang salin ng genealogical na parirala at malinaw na tumutukoy kina Datan at Abiram.
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: at si On na anak ni Pelet
  rationale: Pinananatili ang pangalang personal at ang tuwirang pagkakakilanlan ayon sa ama.
- source_word: בְּנֵי רְאוּבֵן
  choice: mga anak ni Ruben
  rationale: Pinananatili ang literal at genealogical na anyo ng Hebreo sa halip na gawing “mga Rubenita,” upang hindi mawala ang paralelismo ng mga talaangkanan.
theological_decisions:
- issue: Eliptikong panimula ng pangungusap
  choice: 'Idinagdag sa teksto ang ipinahiwatig na layon: “mga lalaki,” na may talababa.'
  alternative: Iwan bilang “Kumuha si Kora” nang walang layon, o isaling mas interpretibo bilang “nagsama-sama” o “naghimagsik.”
  rationale: Hindi tahasang sinasabi ng Hebreo kung ano ang kinuha ni Kora. Malamang na ang mga lalaki sa talata 2 ang ipinahiwatig, ngunit hindi dapat ikubli ang elipsis o gawing mas tiyak kaysa sa pinagmulan; kaya malinaw ang pangunahing teksto at tapat na itinatala ng talababa ang literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa magkakaugnay na mga pangalang personal, ngunit pinanatili ang paulit-ulit na “anak ni” upang huwag pahinain ang diin sa angkan. Ang gitling bago ang “mga anak ni Ruben” ay nagpapakitang pangwakas na paglalarawan ito sa pangkat na binanggit.
