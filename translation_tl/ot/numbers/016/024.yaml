  text: דַּבֵּ֥ר אֶל הָ/עֵדָ֖ה לֵ/אמֹ֑ר הֵֽעָלוּ֙ מִ/סָּבִ֔יב לְ/מִשְׁכַּן קֹ֖רַח דָּתָ֥ן וַ/אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/024.yaml
  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: tl
  text: Sabihin mo sa kapulungan, ‘Umalis kayo sa paligid ng tirahan nina Korah, Datan, at Abiram.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: kapulungan
  rationale: Tumutukoy ito sa nagkakatipong pamayanan ng Israel; ang “kapulungan” ay pormal ngunit malinaw sa makabagong Filipino.
- source_word: הֵעָלוּ מִסָּבִיב
  choice: umalis kayo sa paligid
  rationale: Ang pandiwang עלה ay karaniwang “umakyat,” ngunit sa utos na may מִסָּבִיב ipinahihiwatig nito ang paglayo mula sa nakapaligid na lugar. Mas natural at malinaw sa Filipino ang “umalis kayo sa paligid” nang hindi nagdaragdag ng direksiyong wala namang tiyak na mahalaga sa konteksto.
- source_word: מִשְׁכַּן
  choice: tirahan
  rationale: Ang salita ay nangangahulugang dakong tinitirhan o tahanan. Dito ay hindi ito ang teknikal na katawagan sa Tabernakulo, kaya “tirahan” ang angkop.
- source_word: קֹרַח דָּתָן וַאֲבִירָם
  choice: Korah, Datan, at Abiram
  rationale: Pinanatili ang kinikilalang anyong Filipino ng mga pangalan, kabilang ang “Datan” para sa דָּתָן.
