  to: Labis na nagalit si Moises at sinabi niya kay Yahweh, “Huwag mong pansinin ang kanilang handog.[a] Wala akong kinuha sa kanila kahit isang asno, at ni isa man sa kanila ay wala akong ginawan ng masama.”
