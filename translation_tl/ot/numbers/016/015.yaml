base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: tl
  text: Labis na nagalit si Moises at sinabi niya kay Yahweh, “Huwag mong pansinin ang kanilang handog.[a] Wala akong kinuha sa kanila kahit isang asno, at ni isa man sa kanila ay wala akong ginawan ng masama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag mong lingapin ang kanilang handog” o “Huwag mong tanggapin ang kanilang handog.” Literal sa Hebreo, “Huwag kang bumaling sa kanilang handog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: Labis na nagalit si Moises
  rationale: Natural na isinasalin nito ang Hebreong idyoma ng pagningas ng galit at pinananatili ang tinding ipinahihiwatig ng מְאֹד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Huwag mong pansinin ang kanilang handog
  rationale: Ang פנה אל ay literal na “bumaling sa” at maaari ring mangahulugang pagtuunan o pakitunguhan nang may pagsang-ayon. Natural sa modernong Tagalog ang “pansinin” at hindi nito tahasang nilulutas kung ang hinihiling ay huwag kilalanin o huwag tanggapin ang handog.
- source_word: מִנְחָתָם
  choice: kanilang handog
  rationale: Malawak ang saklaw ng מִנְחָה bilang regalo, tributo, o handog. Ang “handog” ay angkop sa konteksto nang hindi labis na tinutukoy ito bilang handog na butil.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: Wala akong kinuha sa kanila kahit isang asno
  rationale: Dito, ang נשא ay tumutukoy sa pagkuha o pagkamkam. Pinananatili ng salin ang kongkretong halimbawa at diin na ni isang asno ay walang kinuha si Moises.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: wala akong ginawan ng masama ni isa man sa kanila
  rationale: Ang Hiphil ng רעע ay nangangahulugang gumawa ng masama o manakit. Malinaw at natural ang “ginawan ng masama” at hindi nito nililimitahan ang pinsala sa pisikal na pananakit.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang יהוה sa talata; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulong gaya ng “Panginoon.”
- issue: Kahulugan ng kahilingang אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Huwag mong pansinin ang kanilang handog
  alternative: Huwag mong tanggapin ang kanilang handog
  rationale: Maaaring magpahiwatig ang parirala ng hindi paglingap o hindi pagtanggap. Iniiwasan ng pangunahing salin na tahasang ipakahulugan ang kilos bilang teknikal na pagtanggap sa handog, at inilalahad sa talababa ang literal at alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “asno” bilang karaniwan at tiyak na katawagan, at ang “ginawan ng masama” upang mapanatili ang malawak na saklaw ng Hebreong pandiwa.
