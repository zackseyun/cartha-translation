  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵי/הֶ֖ם נָ֣סוּ לְ/קֹלָ֑/ם כִּ֣י אָֽמְר֔וּ פֶּן תִּבְלָעֵ֖/נוּ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: tl
  text: At ang buong Israel na nasa palibot nila ay tumakas nang marinig ang kanilang sigaw[a], sapagkat sinabi nila, “Baka lamunin tayo ng lupa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang tunog.” Ang salitang Hebreo ay maaaring mangahulugang “tunog,” “tinig,” o “sigaw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל
  choice: At ang buong Israel
  rationale: Pinananatili ang kolektibong pagtukoy ng כָל יִשְׂרָאֵל nang hindi ito nililimitahan sa isang mas tiyak na katawagang etniko.
- source_word: אֲשֶׁר סְבִיבֹתֵי/הֶם
  choice: na nasa palibot nila
  rationale: Likas sa modernong Tagalog at malinaw na tumutukoy sa mga Israelitang nasa paligid ng mga hinatulan.
- source_word: נָסוּ
  choice: tumakas
  rationale: Tuwirang ipinapahayag ang mabilis na paglayo dahil sa panganib.
- source_word: לְ/קֹלָם
  choice: nang marinig ang kanilang sigaw
  rationale: Ang קוֹל ay maaaring tumukoy sa tunog, tinig, o sigaw. Sa konteksto, ang “sigaw” ay malinaw at natural, samantalang pinananatili sa talababa ang mas malawak na “tunog.”
- source_word: כִּי אָמְרוּ
  choice: sapagkat sinabi nila
  rationale: Ipinakikita ng כִּי ang dahilan ng kanilang pagtakas; ang “sapagkat” ay angkop sa marangal na salaysay.
- source_word: פֶּן
  choice: Baka
  rationale: Natural na ipinahahayag sa Tagalog ang kinatatakutang maaaring mangyari, nang hindi gumagamit ng lipas o sobrang pormal na pananalita.
- source_word: תִּבְלָעֵנוּ
  choice: lamunin din tayo
  rationale: Pinananatili ang matingkad na larawan ng paglunok; ang “din” ay likas na ipinahihiwatig ng konteksto na baka sapitin din nila ang nangyari sa iba.
- source_word: הָ/אָרֶץ
  choice: ng lupa
  rationale: Iniuugnay ito sa agarang konteksto ng lupang bumuka at lumamon sa mga tao; mas natural dito ang “lupa” kaysa “daigdig.”
