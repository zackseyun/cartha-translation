  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: tl
  text: Napakaliit na bagay ba sa tingin ninyo na ibinukod kayo ng Diyos ng Israel mula sa kapulungan ng Israel[a], upang ilapit kayo sa kanya, upang gampanan ang paglilingkod sa tabernakulo ni Yahweh, at upang tumayo sa harap ng kapulungan at maglingkod sa kanila?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi pa ba sapat para sa inyo...?” Ang idyomang Hebreo ay nagtatanong kung itinuturing nilang napakaliit o hindi sapat ang pribilehiyong ibinigay sa kanila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Maliit na bagay ba para sa inyo
  rationale: Pinananatili ang retorikal na tanong at ang diwang itinuturing na hindi sapat o walang gaanong halaga ang pribilehiyong ipinagkaloob.
- source_word: הִבְדִּיל
  choice: ibinukod kayo
  rationale: Likas sa Filipino at angkop sa kontekstong nagtalaga sa mga Levita mula sa buong kapulungan, nang hindi dinaragdagan ang kahulugan.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: kapulungan ng Israel
  rationale: Ang “kapulungan” ay tumutukoy sa sambayanang nagkakatipon at nababagay kapwa sa panlipunan at panrelihiyong konteksto.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: upang ilapit kayo sa kanya
  rationale: Pinananatili ang kultiko at ugnayang diwa ng קרב nang hindi ito nililimitahan sa paghahandog.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: upang gampanan ang paglilingkod sa tabernakulo ni Yahweh
  rationale: Ipinahahayag ang gawain at sagradong paglilingkod ng mga Levita sa natural na modernong Filipino, habang iniiwasan ang alanganing pag-uulit ng magkaugnay na salita.
- source_word: מִשְׁכַּן
  choice: tabernakulo
  rationale: Kinikilalang katawagan sa santuwaryong naililipat noong paglalakbay ng Israel sa ilang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: at upang tumayo sa harap ng kapulungan
  rationale: Pinananatili ang pormal at kinatawang katayuan ng mga Levita sa harap ng sambayanan.
- source_word: לְשָׁרְתָם
  choice: at maglingkod sa kanila
  rationale: Malinaw at natural na ipinahahayag ang paglilingkod para sa kapulungan; hindi nito ipinapalagay na pari ang bawat tinutukoy na Levita.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Nasa Hebreong teksto ang Tetragrammaton bilang personal na pangalan. Pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng paglilingkod ng mga Levita
  choice: maglingkod sa kanila
  alternative: mangasiwa para sa kanila
  rationale: Ang לְשָׁרְתָם ay nagpapahiwatig ng opisyal o sagradong paglilingkod, ngunit hindi kinakailangang tukuyin dito ang tiyak na anyo nito; pinananatili ng salin ang lawak ng orihinal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapulungan” para sa עֵדָה at “tabernakulo” para sa מִשְׁכָּן. Pinanatili ang retorikal na talas ng pambungad at ang pagkakapantay-pantay ng tatlong layunin sa pamamagitan ng magkakasunod na “upang.”
