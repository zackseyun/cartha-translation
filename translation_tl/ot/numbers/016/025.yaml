  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: tl
  text: Pagkatapos, tumindig si Moises at pumunta kina Datan at Abiram, at lumakad kasunod niya ang mga nakatatanda ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sumunod sa kanya.” Sa Hebreo, mas literal na “lumakad pagkatapos niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang pandiwang קום ay nagsasaad na bumangon o tumayo si Moises upang kumilos. Pinananatili ng “tumindig” ang maikli at marangal na himig ng salaysay.
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Karaniwang kahulugan ng הלך ang pagpunta o paglakad. Ang “pumunta” ang likas na gamit kapag tao ang patutunguhan at hindi nito ipinapalagay ang tiyak na paraan ng paglalakbay.
- source_word: אֶל
  choice: kina
  rationale: Ipinahahayag ng אֶל ang paglapit o pagpunta sa mga taong tinutukoy. Ang “kina” ang natural na anyong Filipino bago ang dalawang pangalan.
- source_word: דָּתָן וַאֲבִירָם
  choice: Datan at Abiram
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang Hebreo.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: Sumunod sa kanya
  rationale: Literal na larawan nito ang “lumakad sa likuran niya,” ngunit sa modernong Filipino, malinaw at likas na ipinahahayag ng “sumunod sa kanya” ang paglakad nila kasunod ni Moises.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ang mga nakatatanda sa Israel
  rationale: Tumutukoy ang construct phrase sa kinikilalang mga nakatatanda o elder ng Israel. Ang “mga nakatatanda sa Israel” ay nauunawaan sa modernong Filipino nang hindi nagdaragdag ng titulong wala sa teksto.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ang panimulang waw sa salaysay ay nagpapatuloy sa sunod-sunod na pangyayari. Likas na ipinahahayag ito ng “Pagkatapos” sa Filipino.
