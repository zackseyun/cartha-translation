  register: Modernong Filipino na malinaw at marangal ang ginamit. Hinati sa dalawang pangungusap upang maging natural ang daloy, habang pinananatili ang pagkakasunod-sunod ng mga kilos at ang larawan ng mga nakatatandang kasunod ni Moises.
