  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: tl
  text: Kaya nagpatirapa sila at sinabi[a], “O Diyos, Diyos ng mga espiritu ng lahat ng laman, magkakasala ba ang isang tao[b], at magagalit ka sa buong kapulungan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang titulo bilang “Diyos ng hininga ng lahat ng laman,” na nagdiriin sa Diyos bilang nagbibigay ng buhay sa bawat nilalang.
    reason: lexical_alternative
  - marker: b
    text: 'Ang “isang tao” ay maaaring gamitin sa diwang representatibo: ang pakiusap ay huwag mapailalim sa galit ang buong kapulungan dahil sa kasalanan ng isang indibidwal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: nagpatirapa sila
  rationale: Likas at marangal na Filipino para sa pagharap sa lupa bilang tanda ng pagpapakumbaba, pagkabahala, o pamamagitan; pinananatili ang kilos nang hindi gumagamit ng alanganing literal na parirala.
- source_word: אֵל אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: Diyos, Diyos ng mga espiritu ng lahat ng laman
  rationale: Pinananatili ang tuwirang panawagan at ang anyong genitibo ng Hebreo. Ang “mga espiritu” ay ang pangunahing pagbasa sa רוּחֹת, samantalang ang “lahat ng laman” ay nagpapanatili sa malawak at kongkretong idyomang Hebreo.
- source_word: הָאִישׁ אֶחָד
  choice: ang isang tao
  rationale: Sa modernong Filipino, ang “tao” ay natural na katumbas ng אִישׁ sa ganitong pangkalahatan at representatibong pahayag; hindi nito ipinapalagay na kasarian ang punto ng tanong.
- source_word: יֶחֱטָא
  choice: magkakasala ba
  rationale: Ang anyong tanong na may “ba” at aspektong kontemplatibo ay natural sa Filipino at pinananatili ang bukas na modal na puwersa ng Hebreo.
- source_word: כָּל־הָעֵדָה
  choice: buong kapulungan
  rationale: Ang “kapulungan” ay malinaw at dignidad na tawag sa sama-samang pamayanan ng Israel sa kontekstong ito.
- source_word: תִּקְצֹף
  choice: magagalit ka
  rationale: Direkta at natural na salin ng pandiwang tumutukoy sa galit ng Diyos, nang hindi dinaragdagan ang tindi nito bilang “poot” o “matinding galit.”
theological_decisions:
- issue: Kahulugan ng “Diyos ng mga espiritu ng lahat ng laman”
  choice: Pangunahing pinanatili ang “mga espiritu,” na maaaring tumukoy sa panloob na buhay ng bawat tao sa ilalim ng kaalaman at kapangyarihan ng Diyos.
  alternative: “Diyos ng hininga ng lahat ng laman,” na nagdiriin sa Diyos bilang nagbibigay ng buhay.
  rationale: Sa konteksto, nakikiusap sina Moises at Aaron sa Diyos na kumikilala sa indibidwal na pananagutan; gayunman, tunay na posible rin ang diwa ng hininga o buhay, kaya inilagay iyon sa talababa sa halip na alisin.
- issue: Indibidwal at sama-samang pananagutan sa הָאִישׁ אֶחָד
  choice: “isang tao,” na maaaring gumanap bilang indibidwal na kinatawan sa pakiusap.
  alternative: “isang lalaki,” bilang mas tahasang panlalaking anyo.
  rationale: Ang tanong ay naghahambing ng kasalanan ng isa at galit laban sa buong kapulungan. Ang Filipino na “tao” ang natural na pangkalahatang katawagan dito at hindi nilulutas kung iisang partikular na lalaki lamang o isang indibidwal bilang kinatawan ang tinutukoy.
translation_notes:
  register: Modernong Filipino na dignidad ngunit madaling maunawaan. Ginamit ang “nagpatirapa” para sa natural na paglalarawan ng kilos, “kapulungan” para sa komunal na konteksto ng Israel, at pinanatili ang biblikal na idyomang “lahat ng laman.” Ang bawat talababa ay may katugmang marker sa pangunahing teksto.
