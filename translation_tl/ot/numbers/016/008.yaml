  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Moises kay Kora, “Makinig kayo ngayon, kayong mga anak ni Levi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay; natural sa makabagong Filipino ang “Pagkatapos, sinabi” at malinaw nitong pinananatili ang pagkakasunod-sunod.
- source_word: אֶל
  choice: kay
  rationale: Karaniwang panandang Filipino para sa taong pinatutungkulan ng pagsasalita.
- source_word: שִׁמְעוּ
  choice: Makinig kayo
  rationale: Maramihang pautos ito. Mas natural sa Filipino ang “makinig” kaysa literal na “dinggin” sa tuwirang panawagan, habang napapanatili ang mariing tono.
- source_word: נָא
  choice: ngayon
  rationale: Sa kontekstong may pagtutunggali, nagpapahayag ito ng paghimok o pagdidiin; ang “ngayon” ay mas angkop kaysa magalang na “pakiusap.”
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Pinananatili ang tahasang katawagang pangkamag-anakan sa Hebreo. Sa Filipino, ang “anak” ay hindi minamarkahan ang kasarian sa anyo ng salita, ngunit sa konteksto ay tumutukoy sa mga lalaking Levita na kinakausap.
- source_word: לֵוִי
  choice: Levi
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: קֹרַח
  choice: Kora
  rationale: Ginamit ang natural at karaniwang Filipino na anyo ng pangalang Korah.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang Filipino na anyo ng pangalang Moses.
theological_decisions:
- issue: Katawagan sa angkan na may kasariang panlalaki sa tuwirang pakikipag-usap
  choice: kayong mga anak ni Levi
  alternative: kayong mga Levita
  rationale: Pinananatili ng “mga anak ni Levi” ang larawang pangkamag-anakan ng Hebreong בְּנֵי לֵוִי sa halip na gawing katawagang pantribo lamang. Bagaman walang gramatikal na kasarian ang “anak” sa Filipino, hindi pinalalawak ng salin ang tinutukoy lampas sa kontekstuwal na pangkat ng mga lalaking Levita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo” upang katawanin ang plural na pautos, at pinanatili ang mariing panawagang “ngayon” nang hindi ginagawang labis na pormal o sinauna.
