- from: Kaya bumaba silang buháy sa Sheol[a]—sila at ang lahat ng pag-aari nila. Tinabunan sila ng lupa, at naglaho sila mula sa gitna ng kapulungan.
  to: Kaya bumaba silang buháy sa Sheol[a]—sila at lahat ng nauukol sa kanila—at tinabunan sila ng lupa, at nawala sila mula sa gitna ng kapulungan.
  rationale: Pinalitan ang makitid na “lahat ng pag-aari nila” ng “lahat ng nauukol sa kanila” upang hindi limitahan ang saklaw ng Hebreo. Isinaayos din ang bantas upang ang pariralang ito ay malinaw na kasama ng mga bumaba nang buháy sa Sheol. Pinanatili ang Sheol at ang talababa nito dahil ang termino ay hindi dapat gawing katumbas lamang ng libingan o ng isang mas huling doktrinal na konsepto.
