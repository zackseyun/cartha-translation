base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: tl
  text: Kaya bumaba silang buháy sa Sheol[a]—sila at lahat ng nauukol sa kanila—at tinabunan sila ng lupa, at nawala sila mula sa gitna ng kapulungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “libingan” o “daigdig ng mga patay.” Hebreo: Sheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: bumaba
  rationale: Likas na katumbas ng ירד at malinaw na pinananatili ang pababang kilos sa salaysay.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: sila at ang lahat ng pag-aari nila
  rationale: Malawak ang pariralang Hebreo at maaaring sumaklaw sa lahat ng nauukol sa kanila; ang saling ito ay natural at hindi nililimitahan sa isang partikular na uri ng ari-arian.
- source_word: חַיִּים
  choice: buháy
  rationale: Idiniriin na buháy pa sila nang bumaba; nilagyan ng tuldik upang hindi mabasa bilang búhay, ‘life.’
- source_word: שְׁאֹלָה
  choice: sa Sheol
  rationale: Pinananatili ang katawagang Hebreo dahil mas malawak ito kaysa isang libingan lamang; naipahihiwatig ng ‘bumaba ... sa’ ang direksiyonal na anyo.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: Tinabunan sila ng lupa
  rationale: Natural at matingkad sa Filipino; ipinapahayag ang lupa bilang tumakip at lumibing sa kanila.
- source_word: וַיֹּאבְדוּ
  choice: naglaho sila
  rationale: Sa kontekstong ‘mula sa gitna ng kapulungan,’ malinaw nitong ipinahahayag ang pagkawala nila roon nang hindi dinaragdagan ang tiyak na paraan lampas sa pandiwang אבד.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: mula sa gitna ng kapulungan
  rationale: Malapit sa Hebreong idyoma at pinananatili ang kolektibong diwa ng קהל.
theological_decisions:
- issue: Pagsasalin ng שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Ang transliterasyon ay nagpapanatili sa lawak at tunay na kalabuan ng konseptong Hebreo nang hindi ito ipinapantay sa impiyerno o nililimitahan sa isang puntod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kapulungan’ bilang pormal ngunit madaling maunawaang katumbas ng קהל. Ang tuldik sa ‘buháy’ ay pantulong sa wastong pagbasa.
