  - severity: low
    issue: Pinaghiwalay ng tuldok ang pariralang “sila at ang lahat...” mula sa kilos na “bumaba.”
    rationale: Hindi nito lubos na binabago ang kahulugan, ngunit mas tapat at mas malinaw na panatilihin itong nakaugnay sa pangunahing sugnay, gaya ng estruktura ng Hebreo.
