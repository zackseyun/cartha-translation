base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: tl
  text: Hindi mo nga kami dinala sa isang lupaing umaapaw sa gatas at pulot, ni binigyan man kami ng isang mana ng mga bukid at ubasan. Dudukitin mo ba ang mga mata ng mga taong ito?[a] Hindi kami aakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Bubulagin mo ba ang mga taong ito?” Literal sa Hebreo, “Dudukitin mo ba ang mga mata ng mga taong ito?” Maaari rin itong magpahiwatig ng pagtrato sa kanila na para bang bulag sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: Hindi mo nga
  rationale: Ipinahahayag ng אַף ang mariing tono ng reklamo, kaya ginamit ang “nga” kasama ng tahasang pagtangging “hindi.”
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: sa isang lupaing dinadaluyan ng gatas at pulot-pukyutan
  rationale: Pinananatili ang nakaugaliang larawang Hebreo tungkol sa kasaganaan; malinaw sa modernong Tagalog ang “dinadaluyan.”
- source_word: הֲבִיאֹתָנוּ
  choice: kami dinala
  rationale: Bagaman maaaring anyong retorikal na tanong ang Hebreo, ang buong parirala ay likas na naihahayag bilang mariing paratang sa Tagalog.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: ni binigyan man kami ng mga bukid at ubasan bilang mana
  rationale: Ang נַחֲלָה ay minanang pag-aari o takdang bahagi. Ginawang maramihan ang kolektibong “bukid at ubasan” upang maging natural sa Tagalog nang hindi binabago ang diwa.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: Dudukitin mo ba ang mga mata ng mga taong ito?
  rationale: Ang Piel na נקר ay literal na pagdukit o pag-alis ng mga mata. Pinanatili ang marahas at kongkretong larawan, habang inilagay sa talababa ang posibleng idyomatikong pahiwatig.
- source_word: לֹא נַעֲלֶה
  choice: Hindi kami aakyat
  rationale: Pinananatili ng “aakyat” ang literal na direksiyon ng עלה at ang pagtanggi nina Datan at Abiram na tumugon sa ipinapatawag sa kanila.
