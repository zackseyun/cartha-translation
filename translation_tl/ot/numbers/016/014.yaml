translation_notes:
  register: Makabago at dignidad na Filipino; tuwiran at matindi ang tono ng reklamo. Pinanatili ang mga larawang “gatas at pulot-pukyutan” at “dudukitin ang mga mata” dahil mahalaga ang mga ito sa retorika ng Hebreo.
