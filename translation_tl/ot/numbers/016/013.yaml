  - severity: medium
    issue: Medyo pilit at hindi gaanong karaniwan ang “Paghaharian mo pa nga ba kami?”
    rationale: Ang “Maghahari ka pa nga ba sa amin?” ay mas likas na modernong Filipino at malinaw na naghahatid ng akusasyong mamuno sa kanila. Nananatili ang dagdag na diin sa “pa nga.”
  - severity: low
