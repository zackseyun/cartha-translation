base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: tl
  text: Hindi pa ba sapat na iniahon mo kami mula sa lupaing umaapaw sa gatas at pulot[a] upang patayin kami sa ilang? Maghahari ka pa nga ba sa amin?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mapanuyang inilalarawan ng mga nagsasalita ang Ehipto bilang “lupaing umaapaw sa gatas at pulot,” isang pananalitang ginagamit sa ibang bahagi para sa lupang pangako.
    reason: cultural_note
  - marker: b
    text: O “Magpapakapanginoon ka pa nga ba sa amin?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Hindi pa ba sapat
  rationale: Likas na retorikal na tanong sa Filipino na naghahayag ng galit at pagkadismaya; katumbas ito ng diwang ‘maliit na bagay ba’ nang hindi nagiging malamya.
- source_word: הֶעֱלִיתָנוּ
  choice: iniahon mo kami
  rationale: Pinananatili ang sanhi at pataas na galaw ng Hiphil ng עלה. Ang ‘iniahon’ ay angkop din sa mapanuyang paglalarawan ng mga nagsasalita sa paglabas nila mula sa Ehipto.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: mula sa lupaing dinadaluyan ng gatas at pulot
  rationale: Pinananatili ang larawang Hebreo ng kasaganaan at ang kabalintunaang inilalapat ng mga rebelde sa Ehipto ang pananalitang karaniwang tumutukoy sa lupang pangako.
- source_word: לַהֲמִיתֵנוּ
  choice: upang patayin kami
  rationale: Tuwirang ipinapahayag ang layunin ng pawatas at pinananatili ang tindi ng paratang.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang ‘ilang’ ay maikli, marangal, at karaniwang salin ng מִדְבָּר sa konteksto ng paglalakbay ng Israel; hindi nito nililimitahan ang lugar sa mabuhanging disyerto.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: Paghaharian mo pa nga ba kami?
  rationale: Ang ‘paghaharian’ ay malinaw na naghahatid ng pag-iral bilang pinuno sa ibabaw nila. Ipinahihiwatig ng ‘pa nga’ at ng hiwalay na retorikal na tanong ang diin ng pawatas na absolutong kasama ng pandiwa.
- source_word: גַּם
  choice: pa
  rationale: 'Ipinakikita ang dagdag na paratang: bukod sa pag-akay umano sa kanila sa kamatayan, paghaharian pa sila ni Moises.'
theological_decisions:
- issue: Mapanuyang pagtawag sa Ehipto bilang lupaing dinadaluyan ng gatas at pulot
  choice: Panatilihin nang literal ang parirala sa pangunahing teksto
  alternative: Lagyan sa teksto ng tahasang pahiwatig na mapanukso o mapanuya ang pananalita
  rationale: Ang konteksto mismo ang nagpapakita ng kabalintunaan. Ang tahasang pagdaragdag ng ‘kunwari’ o katulad nito ay magpapasya para sa mambabasa sa halip na panatilihin ang tensiyon ng orihinal.
- issue: Diin ng תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: Ihatid ang diin sa ‘pa nga’ at sa isang tuwirang retorikal na tanong
  alternative: Gamitin ang mas interpretatibong ‘maghahari-harian ka’ o ang di-likas na pag-uulit ng pandiwa
  rationale: Naipahahayag nito ang matinding paratang nang hindi nagdaragdag ng tahasang paghatol na huwad o lehitimo ang pamumuno ni Moises.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Hinati sa dalawang retorikal na tanong upang maging natural ang matinding pagtutol sa Filipino, habang pinananatili ang pagkakaugnay ng dalawang paratang sa salitang ‘pa.’
