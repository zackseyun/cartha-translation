translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Pinanatili ang 'mga salitang ito' sa halip na gawing mas malayang 'mga bagay na ito,' at ginamit ang 'agad' upang malinaw na maihatid ang agarang pagdating ng pangyayari.
