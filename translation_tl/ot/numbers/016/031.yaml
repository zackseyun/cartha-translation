  language: tl
  text: At nang matapos niyang sabihin ang lahat ng salitang ito, bumuka ang lupa sa ilalim nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: At nang matapos niyang sabihin
  rationale: Natural na inililipat ang Hebreong pangyayari at temporal na sugnay; ipinahihiwatig ng pagkakasunod na kaagad sumunod ang pangyayari.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: ang lahat ng salitang ito
  rationale: Pinananatili ang konkretong diwa ng דְּבָרִים bilang mga salitang kasasabi lamang.
- source_word: וַתִּבָּקַע הָאֲדָמָה
  choice: agad na bumuka ang lupa
  rationale: Ang בָּקַע ay tumutukoy sa paghati o pagbuka; ang 'bumuka' ay malinaw at natural sa konteksto. Ang 'agad' ay nagpapahayag ng agarang pagkakasunod na ipinahihiwatig ng כְּ at ng salaysay.
- source_word: אֲשֶׁר תַּחְתֵּיהֶם
  choice: sa ilalim nila
  rationale: Natural at eksaktong katumbas ng lupang nasa ilalim ng pangkat na tinutukoy.
