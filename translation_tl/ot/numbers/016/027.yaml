  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: paglayo mula sa paligid ng tirahan ng tatlong lalaki, at paglabas nina Datan at Abiram kasama ang kanilang sambahayan. Gayunman, ang “ang mga tao sa paligid ng tirahan” ay maaaring mangahulugang ang mga taong nasa paligid ang lumayo, sa halip na malinaw na “lumayo sila mula sa palibot.”'
  naturalness: Makabago at marangal ang rehistro. Mas malinaw at natural ang “lumayo sila mula sa palibot” kaysa sa kasalukuyang pagkakaayos. Ang “mga maliliit nilang anak” ay mas likas na Filipino kaysa “maliliit na anak.”
  terminology: Ang “tirahan” ay wastong salin ng mishkan sa kontekstong ito at nakaiiwas sa maling pag-unawa na ang tinutukoy ay ang tabernakulo ng PANGINOON. Napananatili rin ng “mga anak na lalaki” ang pagkakaiba ng mga anak na lalaki at ng maliliit na bata/dependent na tinutukoy ng טף.
