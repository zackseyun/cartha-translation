  to: Kaya lumayo sila mula sa palibot ng tirahan[a] nina Korah, Datan, at Abiram. Lumabas naman sina Datan at Abiram at tumayo sa pasukan ng kani-kanilang tolda, kasama ang kanilang mga asawa, mga anak na lalaki, at mga maliliit nilang anak.
