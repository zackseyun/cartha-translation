  text: וַ/יֵּעָל֗וּ מֵ/עַ֧ל מִשְׁכַּן קֹ֛רֶח דָּתָ֥ן וַ/אֲבִירָ֖ם מִ/סָּבִ֑יב וְ/דָתָ֨ן וַ/אֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אָֽהֳלֵי/הֶ֔ם וּ/נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶ֖ם וְ/טַפָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: tl
  text: Kaya lumayo sila mula sa palibot ng tirahan[a] nina Korah, Datan, at Abiram. Lumabas naman sina Datan at Abiram at tumayo sa pasukan ng kani-kanilang tolda, kasama ang kanilang mga asawa, mga anak na lalaki, at mga maliliit nilang anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umakyat mula sa palibot ng tirahan.” Literal na “umakyat” ang pandiwang Hebreo, ngunit malamang na idyomatiko itong tumutukoy rito sa paglayo sa lugar. Ang “tirahan” ay ang lugar na kinahihimpilan nina Korah, Datan, at Abiram, hindi ang tabernakulo ng PANGINOON.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: lumayo ... sa paligid
  rationale: Bagaman literal na “umakyat” ang pandiwa, ang pagkakaugnay nito sa מֵעַל at מִסָּבִיב at ang konteksto ng paghiwalay sa mga rebelde ay nagpapahiwatig ng paglayo mula sa nakapaligid na lugar.
- source_word: מִשְׁכַּן
  choice: tirahan
  rationale: Dito, tumutukoy ito sa lugar na tinitirhan o kinahihimpilan nina Korah, Datan, at Abiram, hindi sa tabernakulo ng PANGINOON.
- source_word: יָצְאוּ נִצָּבִים
  choice: lumabas ... at tumayo
  rationale: Pinananatili nito ang paglabas nila at ang kanilang nakatayong tindig nang hindi idinaragdag ang posibleng ngunit hindi tahasang diwa ng paghahamon.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: sa pasukan ng kani-kanilang tolda
  rationale: Ang maramihang anyo ng “mga tolda nila” ay likas na naipahahayag sa Filipino sa pamamagitan ng “kani-kanilang tolda.”
- source_word: וּנְשֵׁיהֶם
  choice: kasama ang kanilang mga asawa
  rationale: Likas na ipinahahayag ng “kasama” ang pagkanaroon ng mga asawa sa tagpo.
- source_word: וּבְנֵיהֶם
  choice: mga anak na lalaki
  rationale: Pinananatili ang partikular na kahulugan ng בנים at ang pagkakaiba nito sa kasunod na טף.
- source_word: וְטַפָּם
  choice: maliliit na anak
  rationale: Malinaw at kongkretong salin para sa maliliit na bata o mga batang umaasa sa magulang.
theological_decisions:
- issue: Kung ang מִשְׁכַּן ay banal na tabernakulo o karaniwang tirahan
  choice: tirahan
  alternative: tabernakulo
  rationale: Ang konstruksyong “tirahan nina Korah, Datan, at Abiram” at ang konteksto ng kanilang kampamento ay tumutukoy sa kanilang lugar ng paninirahan, hindi sa santuwaryo ng PANGINOON.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kani-kanilang tolda” upang natural na mapanatili ang maramihang Hebreo, at iniwasan ang “nanindigan” dahil maaari itong magdagdag ng tahasang diwa ng paghihimagsik na hindi kinakailangang nasa participle.
