base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: tl
  text: At sinabi niya sa kapulungan, “Pakiusap, lumayo kayo sa mga tolda ng masasamang lalaking ito. Huwag ninyong hipuin ang anumang pag-aari nila, baka matangay kayo sa lahat ng kanilang kasalanan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baka malipol kayo dahil sa lahat ng kanilang kasalanan.” Maaaring unawain ang Hebreo na mas tahasang nagsasaad ng sanhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדָה
  choice: kapulungan
  rationale: Tumutukoy ang עֵדָה sa nagkakatipong sambayanan ng Israel. Ang “kapulungan” ay malinaw at pinananatili ang kolektibong diwa ng salita.
- source_word: סוּרוּ נָא
  choice: Pakiusap, lumayo kayo
  rationale: Ang pautos na סוּרוּ ay humihiling ng paglayo, at ang נָא ay nagpapahayag ng apurahang pakiusap sa halip na simpleng panandang-panahon na “ngayon.”
- source_word: מֵעַל אָהֳלֵי
  choice: sa mga tolda ng
  rationale: Bagaman literal na may diwang “mula sa ibabaw o tabi,” idyomatiko itong tumutukoy sa paglayo mula sa kinaroroonan ng mga tolda.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: masasamang lalaking ito
  rationale: Pinananatili ng “lalaki” ang kasariang hayagang nasa Hebreo, at ang “masasama” ay angkop sa moral at panghukom na diwa ng רְשָׁעִים.
- source_word: וְאַל תִּגְּעוּ
  choice: Huwag ninyong hipuin
  rationale: Direktang isinasalin ng “hipuin” ang karaniwang diwa ng נגע nang hindi dinaragdagan ang uri o layunin ng paghipo.
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: ang anumang pag-aari nila
  rationale: 'Likas na ipinahahayag nito sa Tagalog ang malawak na saklaw ng parirala: lahat ng bagay na sa kanila.'
- source_word: פֶּן תִּסָּפוּ
  choice: baka matangay kayo
  rationale: Ang Niphal ng ספה ay maaaring mangahulugang matangay, malipol, o maubos sa isang paghatol. Pinananatili ng “matangay” ang balintiyak na diwa at larawan ng pagkakasama sa paparating na kapahamakan.
- source_word: בְּכָל חַטֹּאתָם
  choice: sa lahat ng kanilang kasalanan
  rationale: Pinananatili ng “sa” ang sadyang maluwag na ugnayang ipinahahayag ng pang-ukol na בְּ, na maaaring magpahiwatig ng pagkakaugnay o ng sanhi.
theological_decisions:
- issue: Pakikibahagi sa kaparusahan dahil sa pagiging malapit o kaugnay ng masasama
  choice: Inilalarawan ang panganib bilang pagkatangay sa paghatol na kaugnay ng lahat ng kanilang kasalanan.
  alternative: 'Maaaring tahasang gawing sanhi ang huling parirala: “baka malipol kayo dahil sa lahat ng kanilang kasalanan.”'
  rationale: Iniuugnay ng Hebreo ang panganib sa pananatiling malapit sa masasama at sa kanilang mga ari-arian, ngunit hindi nito ganap na nililinaw kung pakikisama o sanhi ang pangunahing diin. Pinananatili ng salin ang tensiyong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Pakiusap” upang maipahayag ang apurahang pakiusap ng נָא, at “matangay” upang mapanatili ang larawan at bahagyang kalabuan ng babala.
