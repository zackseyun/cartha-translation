  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: tl
  text: Inilapit ka niya, kasama ang lahat ng kapatid mo, ang mga anak ni Levi, na kasama mo; at hinahangad din ninyo ang pagkapari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kasama ang lahat ng kapatid mong Levita na kasama mo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Inilapit ... niya
  rationale: Ang Hiphil ng קרב ay nangangahulugang ‘ilapit’ o bigyan ng pribilehiyong makalapit. Pinananatili ng “inilapit” ang parehong larawang pansanggunian at ang diwa ng natatanging katayuan sa paglilingkod.
- source_word: אֹתְךָ
  choice: ka
  rationale: Isahan at panlalaking tuwirang layon ito, na tumutukoy kay Kora.
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: pati ang lahat ng kapatid mong mga anak ni Levi
  rationale: Isinasalin ang אַחֶיךָ bilang “mga kapatid mo” at pinananatili ang “mga anak ni Levi” bilang paliwanag kung sino sila. Ang “pati” ay likas sa Filipino at nagdurugtong sa kanila kay Kora bilang mga inilapit din.
- source_word: אִתָּךְ
  choice: na kasama mo
  rationale: Sa konteksto, tumutukoy ito sa mga kapwa Levita na kasama ni Kora.
- source_word: וּבִקַּשְׁתֶּם
  choice: Hinahangad ... ba ninyo
  rationale: Ang בקש ay ‘hanapin’ o ‘hangarin.’ Ang maramihang “ninyo” ay nagpapanatili sa pangmaramihang pandiwa. Isinaayos bilang retorikal na tanong, ayon sa daloy ng pagsaway sa konteksto.
- source_word: גַּם
  choice: din
  rationale: Ipinapakita nito na may karagdagan pa silang hinahangad bukod sa pribilehiyong ipinagkaloob na.
- source_word: כְּהֻנָּה
  choice: pagkapari
  rationale: Tumutukoy ito sa katungkulan o katayuan ng mga pari, hindi lamang sa pangkalahatang paglilingkod na panrelihiyon.
theological_decisions:
- issue: Pagkakaiba ng katayuan ng mga Levita at ng mga pari
  choice: pagkapari
  alternative: paglilingkod bilang pari
  rationale: Pinananatili ng “pagkapari” ang institusyonal na pagkakaiba sa pagitan ng paglilingkod ng mga Levita at ng katungkulan ng mga paring Aaronita, na siyang mahalaga sa pagsaway sa talata.
- issue: Pahayag o retorikal na tanong sa huling sugnay
  choice: Hinahangad din ba ninyo ang pagkapari?
  alternative: Gayunma’y hinahangad din ninyo ang pagkapari.
  rationale: Walang tahasang pantanong na kataga sa Hebreo, kaya posible ang anyong pahayag; gayunman, ang konstruksyon at konteksto ng pagsaway ay likas na nauunawaan bilang retorikal na tanong. Hindi binabago ng alinmang pagbasa ang pangunahing paratang.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “pagkapari” bilang malinaw at karaniwang katawagan sa katungkulan ng pari; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
