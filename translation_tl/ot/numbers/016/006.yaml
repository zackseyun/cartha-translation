  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: tl
  text: 'Gawin ninyo ito: kumuha kayo ng mga insensaryo[a] para sa inyong mga sarili, Korah at ang buong kapulungan niya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sisidlan ng baga.” Ang salitang Hebreo ay tumutukoy sa mga sisidlang ginagamit sa pagdadala ng nagbabagang uling, lalo na sa mga ritwal ng insenso.
    reason: lexical_alternative
  - marker: b
    text: O “buong pangkat niya” o “buong sambayanan niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: Gawin ninyo ito
  rationale: Pinananatili ang demonstratibong tumutukoy sa kasunod na tagubilin at likas itong utos sa modernong Tagalog.
- source_word: קְחוּ לָכֶם
  choice: kumuha kayo para sa inyong sarili
  rationale: Ipinahahayag ng maramihang utos ang pagkilos ng buong pangkat, at pinananatili ng “para sa inyong sarili” ang reflexive na diwa ng לָכֶם.
- source_word: מַחְתּוֹת
  choice: mga insensaryo
  rationale: Ang mga ito ay sisidlang ginagamit sa pagdadala ng nagbabagang uling, lalo na sa paghahandog ng insenso. Ang “insensaryo” ang maikli at angkop na terminong panritwal sa Tagalog.
- source_word: קֹרַח
  choice: Korah
  rationale: Tuwirang transliterasyon ng pangalang pantangi ayon sa anyong karaniwang ginagamit sa Filipino.
- source_word: וְכָל עֲדָתוֹ
  choice: at ang buong kapulungan mo
  rationale: Ang עֵדָה ay tumutukoy sa isang nagkakatipong kapulungan o pangkat. Pinananatili ng “mo” ang panlalaking isahang hulaping tumutukoy kay Korah.
