  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang utos na maramihan, ang mga insensaryo, at ang pagtukoy kay Korah kasama ng kaniyang kapulungan. Gayunman, ang “inyong sarili” ay isahan samantalang ang mga inuutusan ay maramihan; dapat itong gawing “inyong mga sarili.” Ang “niya” sa pagtukoy sa kapulungan ay mas malapit din sa ikatlong panauhang hulapi ng Hebreo.
  naturalness: Marangal at malinaw ang pangkalahatang register. Mas natural at gramatikal ang “para sa inyong mga sarili,” at ang paglalagay sa “Korah at ang buong kapulungan niya” bilang paglilinaw sa kausap ay nananatiling maayos sa modernong Filipino.
  terminology: Ang “mga insensaryo” ay angkop na terminong panritwal para sa מַחְתּוֹת. Kapaki-pakinabang ang talababa tungkol sa “mga sisidlan ng baga” bilang alternatibong leksikal.
