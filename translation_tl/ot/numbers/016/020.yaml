  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/020.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh[a] kina Moises at Aaron, at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring isalin bilang “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ipinahahayag ng waw-consecutive ang pagsulong ng salaysay, at ang “nagsalita” ay likas na katumbas ng דבר habang naihihiwalay ito sa אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa pinagsasabihan; ang “kay” ang likas na gamit sa Filipino bago ang pangalan ng tao.
- source_word: וְאֶל אַהֲרֹן
  choice: at kay Aaron
  rationale: Pinananatili ang pangatnig at inuulit ang panandang “kay,” gaya ng magkahiwalay na pagtukoy ng Hebreo sa dalawang pinagsasabihan.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili ang karaniwang pormulang Hebreo na nagpapakilala sa tuwirang pananalitang kasunod, nang hindi inuunahan ang nilalaman nito.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay mas malapit na transliterasyon kaysa “Jehovah” at hindi ito pinapalitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang pormulang “na sinasabi” dahil nagtatapos ang talata sa pambungad sa pahayag na sumusunod; bagaman medyo pormal, malinaw ito at malapit sa estrukturang Hebreo.
