base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: tl
  text: Tinipon ni Korah ang buong kapulungan laban sa kanila sa pasukan ng Toldang Tagpuan. At nagpakita sa buong kapulungan ang kaluwalhatian ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyunal na isinasaling “ang PANGINOON.”'
    reason: Ipinapaliwanag ang anyo ng banal na pangalan sa Hebreo at ang tradisyunal na salin nito.
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: Tinipon
  rationale: Ang Hiphil ng קהל ay nagsasaad na si Korah ang nagtipon o nagpakatipon sa kapulungan; malinaw at natural ang aktibong pandiwang “tinipon” sa Tagalog.
- source_word: עֲלֵיהֶם
  choice: laban sa kanila
  rationale: 'Sa konteksto ng paghihimagsik at kasabay ng pandiwang קהל, adversatibo ang diwa ng עַל: itinipon ni Korah ang bayan laban kina Moises at Aaron.'
- source_word: כָּל הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa pamayanan ng Israel bilang isang nagkakatipong pangkat; pinananatili ng “buong” ang כָּל.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng Toldang Tagpuan
  rationale: Ang פֶּתַח ay pasukan o bukana. Ang “Toldang Tagpuan” ay likas at tumpak na salin ng אֹהֶל מוֹעֵד bilang toldang itinalagang tagpuan, nang hindi ipinapasok ang salitang “tipan,” na wala sa parirala.
- source_word: וַיֵּרָא
  choice: nagpakita
  rationale: Ang Niphal ng ראה rito ay karaniwang tumutukoy sa nakikitang pagpapakita o pagpapahayag ng presensiya; hindi tinutukoy ng “nagpakita” kung paano ito nakita.
- source_word: כְבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Sa kontekstong ito, ang כָּבוֹד ay ang hayag na pagpapakita ng banal na presensiya. Pinananatili ang personal na pangalang יְהוָה bilang “Yahweh.”
- source_word: אֶל כָּל הָעֵדָה
  choice: sa buong kapulungan
  rationale: Ang parirala ay tumutukoy sa mga taong pinagpakitaan ng kaluwalhatian; natural sa Tagalog ang “nagpakita sa buong kapulungan.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan, habang inilalahad sa talababa ang tradisyunal na pamalit na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” para sa nagkakatipong pamayanan at “Toldang Tagpuan” upang tumpak na katawanin ang אֹהֶל מוֹעֵד. Inilagay ang talababa pagkatapos ng “Yahweh,” ang mismong salitang tinutukoy nito.
