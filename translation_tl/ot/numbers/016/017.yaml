review_pass:
  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: bawat kalahok ay kukuha ng sisidlan, lalagyan ito ng insenso, at ihaharap kay Yahweh; binanggit din ang 250 sisidlan. Gayunman, ang huling sugnay na “Kumuha rin kayo ni Aaron” ay gumagamit ng “kayo,” samantalang ang Hebreo ay tuwirang tumutukoy sa isang kausap (“ikaw,” si Moises) at kay Aaron.'
  naturalness: Malinaw at makabago ang “lalagyan ng baga,” “insenso,” at “sa harap ni Yahweh.” Mas natural at mas tiyak ang tuwirang “ikaw at si Aaron” sa huling bahagi kaysa “kayo ni Aaron.”
  terminology: Ang “Yahweh” ay wastong salin para sa יהוה, at ang talababa para sa “insensaryo” ay kapaki-pakinabang na alternatibong leksikal. Ang mga panandang talababa ay wastong nakakabit sa mga kaugnay na salita.
  issues:
  - severity: medium
    issue: Hindi tugma ang panauhan sa huling sugnay.
    rationale: Ang וְאַתָּה ay isahang “ikaw,” na sinusundan ng “at Aaron.” Ang “kayo ni Aaron” ay maaaring ipakahulugang plural na kausap kasama si Aaron at hindi nito pinananatili ang tiyak na pagtukoy sa Moises at Aaron.
  revised_text: Kumuha ang bawat isa sa inyo ng sariling lalagyan ng baga[b], lagyan ninyo ng insenso ang mga iyon, at dalhin ninyo sa harap ni Yahweh[a] ang lalagyan ng baga ng bawat isa—dalawang daan at limampung lalagyan ng baga—at ikaw at si Aaron ay magdala ng tig-isang lalagyan ng baga.
