  text: וּ/קְח֣וּ אִ֣ישׁ מַחְתָּת֗/וֹ וּ/נְתַתֶּ֤ם עֲלֵי/הֶם֙ קְטֹ֔רֶת וְ/הִקְרַבְתֶּ֞ם לִ/פְנֵ֤י יְהוָה֙ אִ֣ישׁ מַחְתָּת֔/וֹ חֲמִשִּׁ֥ים וּ/מָאתַ֖יִם מַחְתֹּ֑ת וְ/אַתָּ֥ה וְ/אַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: tl
  text: Kumuha ang bawat isa sa inyo ng sariling lalagyan ng baga[b], lagyan ninyo ng insenso ang mga iyon, at dalhin ninyo sa harap ni Yahweh[a] ang lalagyan ng baga ng bawat isa—dalawang daan at limampung lalagyan ng baga—at ikaw at si Aaron ay magdala ng tig-isang lalagyan ng baga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH. Tradisyonal na isinasalin bilang “PANGINOON”; kabilang sa ibang anyo ang “Yahweh” at “Jehova.”'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “insensaryo,” isang sisidlang ginagamit sa pagsusunog ng insenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ אִישׁ
  choice: Kumuha ang bawat isa sa inyo
  rationale: 'Ang maramihang pautos ay para sa buong pangkat, samantalang ang אִישׁ ay distributibo: bawat lalaking kabilang sa pangkat ay kukuha ng sarili niyang sisidlan.'
- source_word: מַחְתָּתוֹ / מַחְתֹּת
  choice: sariling lalagyan ng baga / mga lalagyan ng baga
  rationale: Ang מַחְתָּה ay sisidlang ginagamit sa nagbabagang uling at insenso. Mas malinaw sa karaniwang mambabasang Filipino ang “lalagyan ng baga” kaysa sa teknikal at tradisyonal na “insensaryo,” na inilagay bilang alternatibo sa talababa.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: lagyan ninyo ng insenso ang mga iyon
  rationale: Natural na Filipino para sa literal na paglalagay ng insenso “sa ibabaw” ng mga sisidlan, malamang sa ibabaw ng mga baga sa loob ng mga iyon.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang salitang Filipino para sa mabangong sangkap na sinusunog sa ritwal.
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: dalhin ninyo sa harap ni Yahweh
  rationale: Pinananatili ang konkretong diwa ng Hiphil ng קרב, “ilapit/dalhin,” at ang idyomang לִפְנֵי bilang “sa harap ni.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: dalawang daan at limampung lalagyan ng baga
  rationale: Tuwirang inilalahad sa salita ang kabuuang bilang na 250 ayon sa pampanitikang estilo ng salaysay.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: Kumuha rin kayo ni Aaron ng tig-isang lalagyan ng baga
  rationale: 'Nililinaw sa natural na Filipino ang eliptikong pariralang Hebreo: sina Moises at Aaron ay kasama ring kukuha, tig-isa, ng sariling sisidlan.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na tahimik itong palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalagyan ng baga” upang madaling maunawaan ang pisikal na sisidlan, habang pinanatili sa talababa ang tradisyonal na “insensaryo.” Iniwasan ang sobrang literal na ayos na magiging alanganin sa Filipino, ngunit pinanatili ang distributibong diin sa bawat kalahok at ang kabuuang 250 sisidlan.
