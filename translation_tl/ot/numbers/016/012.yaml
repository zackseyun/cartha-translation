base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: tl
  text: Pagkatapos, nagsugo si Moises upang ipatawag sina Datan at Abiram, na mga anak ni Eliab. Ngunit sinabi nila, “Hindi kami aakyat[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi kami pupunta roon.” Literal na “umakyat” ang pandiwang Hebreo. Maaaring tumukoy ito sa pagpunta sa kinaroroonan ni Moises o sa pagharap sa kaniya nang ipatawag sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Ipinahihiwatig ng pandiwa na nagpadala si Moises ng isang tao o mensahe upang ipatawag sila, nang hindi tinutukoy kung sino ang isinugo.
- source_word: לִקְרֹא
  choice: upang ipatawag
  rationale: Sa kayariang ito, ang קרא ay nangangahulugang ipatawag ang isang tao; ang “ipatawag” ay angkop sa may-awtoridad na utos sa konteksto ng alitan.
- source_word: דָתָן וַאֲבִירָם
  choice: Datan at Abiram
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang pantangi.
- source_word: בְּנֵי אֱלִיאָב
  choice: na mga anak ni Eliab
  rationale: Tuwirang pinananatili ang pagkakakilanlan nila bilang mga anak ni Eliab, sa natural na anyong appositive sa Filipino.
- source_word: וַיֹּאמְרוּ
  choice: Ngunit sinabi nila
  rationale: Bagaman pormal na pang-ugnay ang waw, malinaw na pasalungat ang tugon nila sa pagpapatawag ni Moises; natural itong ipinahahayag ng “ngunit.”
- source_word: לֹא נַעֲלֶה
  choice: Hindi kami pupunta roon
  rationale: Ang עלה ay literal na “umakyat/pumaitaas,” ngunit sa konteksto ay tumutukoy sa pagpunta sa kinaroroonan ni Moises o pagharap sa kaniya. Ginagawang natural ng “pupunta roon” ang direksiyon mula sa pananaw ng mga nagsasalita, habang nananatiling hayag sa talababa ang literal na larawan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa dalawang pangalan at ang “ipatawag” upang ihatid ang opisyal na lakas ng utos. Inilipat sa talababa ang literal na “aakyat” upang mapanatili ang leksikal na larawan at tunay na posibilidad ng kahulugan nang hindi nagiging alanganin ang pangunahing teksto.
