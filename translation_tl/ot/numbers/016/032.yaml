  text: וַ/תִּפְתַּ֤ח הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלַ֥ע אֹתָ֖/ם וְ/אֶת בָּתֵּי/הֶ֑ם וְ/אֵ֤ת כָּל הָ/אָדָם֙ אֲשֶׁ֣ר לְ/קֹ֔רַח וְ/אֵ֖ת כָּל הָ/רֲכֽוּשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: tl
  text: Bumuka ang bibig ng lupa at nilamon sila, pati ang kanilang mga sambahayan[a], ang lahat ng taong kabilang kay Kora[b], at ang lahat ng kanilang ari-arian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bahay.” Maaaring tumukoy ang salitang Hebreo sa mismong mga bahay o sa mga sambahayang naninirahan sa mga iyon.
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring isalin: “ang bawat taong kasama ni Kora.” Kolektibo ang gamit dito ng salitang Hebreo para sa “tao,” at maaaring ipahiwatig ng parirala ang pagkabilang o pakikisama kay Kora.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: Bumuka ang bibig ng lupa
  rationale: Pinananatili ang tahasang larawan ng Hebreo na ang lupa ay may “bibig.” Ang “bumuka” ay natural sa Filipino kapag bibig ang simuno at hindi nagdaragdag ng ideyang higit sa פתח.
- source_word: וַתִּבְלַע אֹתָם
  choice: at nilamon sila
  rationale: Ang בלע ay tuwirang nangangahulugang “lumamon”; malinaw at buhay ang katumbas na Filipino.
- source_word: בָּתֵּיהֶם
  choice: ang kanilang mga sambahayan
  rationale: Maaaring tumukoy ang בַּיִת sa mga bahay o, sa pagpapalawak ng kahulugan, sa mga kasapi ng sambahayan. Mas angkop sa tala ng mga nilamon ang “mga sambahayan,” habang inilalagay sa talababa ang literal na alternatibo.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: ang lahat ng taong kabilang kay Kora
  rationale: Ginagamit dito ang אָדָם bilang kolektibong pananalita. Natural na ipinahahayag ito ng “lahat ng taong,” at ang לְקֹרַח ay isinalin bilang kaugnayan o pagkabilang kay Kora nang hindi nililinaw nang lampas sa Hebreo kung ano ang eksaktong uri ng ugnayan.
- source_word: כָּל־הָרֲכוּשׁ
  choice: ang lahat ng kanilang ari-arian
  rationale: Ang רְכוּשׁ ay tumutukoy sa mga pag-aari o yaman. Malinaw at malawak ang “ari-arian” sa modernong Filipino.
theological_decisions:
- issue: Kolektibong gamit ng אָדָם sa pariralang כָּל־הָאָדָם
  choice: ang lahat ng taong kabilang kay Kora
  alternative: ang bawat taong kasama ni Kora
  rationale: Ang anyong isahan ay ginagamit nang kolektibo, kaya hindi kailangang ipilit ang indibiduwal na “bawat” o ang espesipikong kasariang “bawat lalaki.” Pinananatili rin ng “kabilang kay Kora” ang maluwag na ugnayang ipinahihiwatig ng לְ nang hindi ito ginagawang tiyak na pisikal na pagsama lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matalinghagang “bibig ng lupa” at iniwasan ang sobrang literal na ayos na magiging asiwa sa Tagalog. Ginamit ang pangalang “Kora,” ang karaniwang anyong Filipino ng Korah.
