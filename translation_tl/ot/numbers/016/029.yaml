base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: tl
  text: Kung ang mga taong ito ay mamatay gaya ng pagkamatay ng lahat ng tao, at ang sinasapit ng lahat ng tao ay sumapit sa kanila,[a] hindi ako isinugo ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at ang pagdalaw sa lahat ng tao ay dumalaw sa kanila.” Inuulit sa Hebreo ang ugat פקד, na maaaring tumukoy sa pagdalaw, itinakdang kalagayan, o sa sinasapit ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Likas at sapat itong panimula sa pasubaling pagsubok na ipinahayag ni Moises.
- source_word: כְּמוֹת כָּל הָאָדָם יְמֻתוּן אֵלֶּה
  choice: ang mga taong ito ay mamatay gaya ng pagkamatay ng lahat ng tao
  rationale: Pinananatili ang paghahambing at ang pag-uulit ng diwa ng kamatayan sa Hebreo, habang natural sa modernong Tagalog; kolektibo at pangkalahatan ang הָאָדָם.
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: ang karaniwang sinasapit ng lahat ng tao ay sumapit sa kanila
  rationale: Ang 'sinasapit/sumapit' ay nagpapanatili sa pag-uulit ng ugat פקד at hindi agad nagtatakda kung ito ay parusa, itinakdang kapalaran, o pagdalaw.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: hindi ako isinugo ni Yahweh
  rationale: Tuwirang ipinapahayag ang pasubaling kongklusyon at pinananatili ang personal na pangalang יהוה bilang Yahweh.
theological_decisions:
- issue: Paglalarawan sa karaniwang kamatayan at sinasapit ng sangkatauhan
  choice: lahat ng tao / karaniwang sinasapit
  alternative: sangkatauhan / pagdalaw o kapalaran
  rationale: Ang אָדָם ay kolektibo at hindi tumutukoy lamang sa mga lalaki. Hindi rin nililimitahan ng salin ang פקד sa kaparusahan, kaya nananatili ang lawak at tensiyong leksikal ng Hebreo.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Isinasatitik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mga taong ito' para sa malinaw na personal na reperensiya at ang 'karaniwang sinasapit' upang maipakita na ang tinutukoy ay ordinaryong kalagayan ng lahat ng tao nang hindi labis na binibigyang-kahulugan ang פקד.
