  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: tl
  text: at tumindig sila sa harap ni Moises, kasama ang dalawang daan at limampung lalaki mula sa mga anak ni Israel—mga pinuno ng sambayanan, mga tinawag para sa kapulungan[a], at mga lalaking bantog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ipinatawag sa itinakdang pagtitipon.” Maaaring tumukoy ang pariralang Hebreo sa mga lalaking opisyal na ipinapatawag sa itinakdang pagtitipon ng sambayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: tumindig sila
  rationale: Inilalarawan ng Qal wayyiqtol ng קום ang pagtayo o pagkilos. Pinananatili ng “tumindig” ang posibleng diwang komprontasyonal nang hindi pa tahasang isinasalin bilang paghihimagsik.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Karaniwang kahulugang panlunan at relasyonal ng לִפְנֵי. Ang konteksto, hindi ang parirala mismo, ang nagpapahiwatig ng pagsalungat.
- source_word: וַאֲנָשִׁים מִבְּנֵי יִשְׂרָאֵל
  choice: kasama ang ... lalaki mula sa mga anak ni Israel
  rationale: Nililinaw ang eliptikong koordinasyon sa Hebreo at pinananatili ang panlalaking pagtukoy ng אֲנָשִׁים at ang tipanang katawagang בְּנֵי יִשְׂרָאֵל.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: dalawang daan at limampu
  rationale: Likas at karaniwang anyo ng bilang sa modernong Filipino.
- source_word: נְשִׂיאֵי עֵדָה
  choice: mga pinuno ng sambayanan
  rationale: Ang נָשִׂיא ay pinuno o pangulo ng pangkat, at ang עֵדָה ay ang organisadong sambayanan o kapulungan. Ang “sambayanan” ay malinaw at marangal sa kontekstong ito.
- source_word: קְרִאֵי מוֹעֵד
  choice: mga tinatawag sa kapulungan
  rationale: Pinananatili ang pasibong diwa ng קְרִאֵי at ang institusyonal na diwa ng מוֹעֵד. Hindi nito ipinipilit kung ang tinutukoy ay mga kilalang kinatawan o mga opisyal na ipinatawag.
- source_word: אַנְשֵׁי שֵׁם
  choice: mga lalaking bantog
  rationale: Likas na salin ng idyomang “mga taong may pangalan,” na tumutukoy sa mga lalaking kilala at may mataas na reputasyon.
theological_decisions:
- issue: Kung ang לִפְנֵי ay dapat isaling tahasang “laban kay Moises”
  choice: sa harap ni Moises
  alternative: laban kay Moises
  rationale: Bagaman komprontasyonal ang konteksto, ang preposisyon mismo ay nangangahulugang “sa harap ng.” Pinananatili ng salin ang leksikal na kahulugan at hinahayaang ang salaysay ang magpahayag ng pagsalungat.
- issue: Saklaw ng קְרִאֵי מוֹעֵד
  choice: mga tinatawag sa kapulungan
  alternative: mga ipinatawag sa pagpupulong
  rationale: Maaaring tumukoy ang parirala sa mga taong kinikilala o opisyal na ipinapatawag sa itinakdang pagtitipon. Ang pangunahing salin ay nagpapanatili sa ambiguwidad; inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “mga anak ni Israel” bilang tuwirang tipanang katawagan at ang “mga lalaki” dahil tiyak na panlalaki ang mga salitang Hebreo. Ginamit ang gitling na em dash upang malinaw na ipakilala ang tatlong paglalarawan sa 250 lalaki.
