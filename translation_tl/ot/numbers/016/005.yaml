  verdict: revise
  source_fidelity: 'Tapat ang draft sa pangunahing diwa ng Hebreo: magsasalita si Moises kay Korah at sa kanyang pangkat, at sa umaga ay ihahayag ni Yahweh kung sino ang kanya, kung sino ang banal, at kung sino ang ilalapit niya. Gayunman, ang “ipakikilala” ay maaaring mangahulugang ipakilala ang isang taong hindi kilala, samantalang ang konteksto ng וְיֹדַע ay mas malinaw na hayagang pagpapakita o pagpapabatid. Ang pag-uulit ng “ilalapit” ay dapat panatilihin.'
  naturalness: Ang “buong kapulungan nito” ay hindi natural dahil tao si Korah; mas likas ang “buong pangkat niya.” Ang “iyon” para sa taong pinili ay medyo impersonal at hindi kasinglinaw ng pag-uulit ng sugnay na “ang pipiliin niya ay ilalapit niya.”
  terminology: Ang “Yahweh,” “banal,” at “ilalapit” ay angkop. Ang “ilalapit” ay nagpapanatili ng sagradong/kultikong aspekto ng קרב nang hindi nagdaragdag ng interpretasyong pangdoktrina.
