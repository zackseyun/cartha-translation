revisions:
- from: 'At nagsalita siya kay Korah at sa buong kapulungan nito: “Sa umaga, ipakikilala ni Yahweh kung sino ang sa kanya[a] at kung sino ang banal, at ilalapit niya iyon sa kanyang sarili. Ang pipiliin niya, iyon ang ilalapit niya sa kanyang sarili.[b]”'
  to: At nagsalita siya kay Korah at sa buong pangkat niya, na sinasabi, “Sa umaga, ipakikita ni Yahweh kung sino ang sa kanya[a] at kung sino ang banal, at ilalapit niya sa kanyang sarili ang taong iyon.[b] Ang pipiliin niya ay ilalapit niya sa kanyang sarili.”
  rationale: Pinalitan ang hindi-likas na “nito” ng “niya,” ginawang “ipakikita” ang pandiwa upang mas tumpak na maipahayag ang kontekstuwal na diwa ng hayagang paghahayag, at nilinaw ang unang tinutukoy na tao sa pamamagitan ng “ang taong iyon.” Pinanatili ang dalawang pag-uulit ng “ilalapit,” ang banal na pangalan na “Yahweh,” at ang mga talababa sa kanilang kaukulang angkla.
