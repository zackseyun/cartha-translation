id: NUM.16.5
reference: Numbers 16:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: tl
  text: At nagsalita siya kay Korah at sa buong pangkat niya, na sinasabi, “Sa umaga, ipakikita ni Yahweh kung sino ang sa kanya[a] at kung sino ang banal, at ilalapit niya sa kanyang sarili ang taong iyon.[b] Ang pipiliin niya ay ilalapit niya sa kanyang sarili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malalaman ni Yahweh kung sino ang sa kanya.” Ang pandiwang Hebreo ay literal na maaaring isaling “malalaman,” ngunit dito ay malamang na tumutukoy sa hayagang pagpapakita o pagpapabatid kung sino ang kinikilala niya.
    reason: lexical_alternative
  - marker: b
    text: 'Ang “ilalapit” ay pananalitang kaugnay ng paglilingkod sa santuwaryo: tumutukoy ito sa paglapit sa presensiya ni Yahweh na siya mismo ang nagpapahintulot para sa sagradong paglilingkod.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita siya
  rationale: Pinananatili ang karaniwang salaysay na kahulugan ng דבר at ang pagkakaiba nito sa kasunod na לֵאמֹר, na likas na naipahihiwatig ng tutuldok sa Filipino.
- source_word: עֲדָתוֹ
  choice: buong kapulungan nito
  rationale: Ang עֵדָה ay isang nagkakatipong pangkat o kapulungan. Ang “nito” ay malinaw na tumutukoy kay Korah at umiiwas sa di-likas na “kanyang kapulungan” sa Filipino.
- source_word: בֹּקֶר
  choice: Sa umaga
  rationale: Ang pangngalan ay ginagamit na panuring sa panahon; natural at tuwiran ang “Sa umaga.”
- source_word: וְיֹדַע יְהוָה
  choice: ipakikilala ni Yahweh
  rationale: Bagaman literal na “malalaman ni Yahweh,” sa konteksto ay tumutukoy ito sa hayagang pagpapakita o paghahayag kung sino ang kinikilala niya. Pinananatili sa talababa ang literal na posibilidad.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na יהוה sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: kung sino ang sa kanya
  rationale: Malapit ito sa literal na “kung sino ang kanya” ngunit mas natural sa Filipino at pinananatili ang sadyang malawak na diwa ng pag-aari o pagkabilang sa Diyos.
- source_word: הַקָּדוֹשׁ
  choice: kung sino ang banal
  rationale: Pinananatili ang kaagapay na estruktura ng naunang parirala at ang diwa ng pagiging banal o ibinukod para sa sagradong paglilingkod.
- source_word: וְהִקְרִיב אֵלָיו
  choice: at ilalapit niya iyon sa kanyang sarili
  rationale: Ang Hiphil ng קרב ay “maglapit” o “pahintulutang lumapit,” lalo na sa kontekstong saserdotal. Ang “iyon” ay tumutukoy sa taong ipinakilala nang hindi ipinapalagay ang kasarian sa gramatika ng Filipino.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: Ang pipiliin niya
  rationale: Maikli, natural, at tapat sa personal na pagpili na ipinahahayag ng בחר.
- source_word: יַקְרִיב אֵלָיו
  choice: iyon ang ilalapit niya sa kanyang sarili
  rationale: Inuulit ang pandiwang “ilalapit” gaya ng pag-uulit sa Hebreo at idinidiin ang awtorisadong paglapit sa presensiya ni Yahweh.
theological_decisions:
- issue: Pagpapakahulugan sa וְיֹדַע bilang kaalaman o hayagang paghahayag
  choice: ipakikilala ni Yahweh
  alternative: malalaman ni Yahweh
  rationale: Maaaring pormal na basahin ang ידע bilang “malalaman,” ngunit ipinahihiwatig ng pagsubok sa susunod na umaga na hayagang ipakikita ni Yahweh kung sino ang sa kanya. Hindi inaalis ang literal na pagbasa; inilalagay ito sa talababa.
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Diwa ng “paglalapit” sa Diyos
  choice: ilalapit niya ... sa kanyang sarili
  alternative: pahihintulutan niyang lumapit sa kanya
  rationale: Pinananatili ng “ilalapit” ang aktibong anyo at pag-uulit ng Hebreo. Hindi nito nililimitahan ang kahulugan sa pisikal na paglapit lamang; nililinaw ng talababa ang sagradong konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” para sa tipunang pangkomunidad at pinanatili ang pag-uulit ng “ilalapit” upang maipakita ang diin at wikang saserdotal ng Hebreo. Ang mga panghalip ay inayos ayon sa natural na gamit sa Filipino nang hindi nilulutas ang anumang hindi tiyak sa teksto.
