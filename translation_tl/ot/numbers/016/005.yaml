    issue: Hindi ganap na likas ang panghalip sa “buong kapulungan nito.”
    rationale: Ang “nito” ay karaniwang tumutukoy sa bagay o di-tao sa modernong Filipino. Si Korah ang malinaw na tinutukoy ng pang-angkin, kaya mas natural ang “buong pangkat niya.”
  - severity: low
    issue: Maaaring malihis ang kahulugan ng “ipakikilala.”
    rationale: Bagaman maaari itong mangahulugang magpakilala o maghayag, madalas itong unawain bilang pagpapakilala ng isang tao sa iba. Ang “ipakikita” ay mas tuwirang nagsasaad ng pampublikong pagpapakita na hinihingi ng konteksto.
  - severity: low
    issue: Ang “iyon” ay impersonal at mahina ang pagtukoy sa taong ilalapit.
    rationale: Ang Hebreo ay tumutukoy sa isang tao. Mas malinaw at mas marangal ang paulit na ayos na “ang pipiliin niya ay ilalapit niya,” na sumasalamin din sa pag-uulit sa Hebreo.
