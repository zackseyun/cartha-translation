id: NUM.20.29
reference: Numbers 20:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: tl
  text: Nang malaman ng buong kapulungan na namatay na si Aaron,[a] tatlumpung araw siyang iniyakan ng buong sambahayan ng Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Nang makita ng buong kapulungan na namatay na si Aaron.” Ang “makita” ay maaari ring mangahulugang makilala o malaman ang isang katotohanan.
    reason: lexical_alternative
  - marker: b
    text: Ang “buong sambahayan ng Israel” ay isang kolektibong tawag sa buong bayan ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: malaman
  rationale: Bagaman karaniwang nangangahulugang “makakita” ang ראה, sa kontekstong ito ay tumutukoy ito sa pagkilala o pagkaalam sa katotohanang namatay na si Aaron; mas natural ito sa modernong Tagalog.
- source_word: כָּל הָעֵדָה
  choice: buong kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan ng Israel. Pinananatili ng “kapulungan” ang kolektibo at pormal na diwa nang hindi nagiging lipas ang wika.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng nalaman ng kapulungan.
- source_word: גָוַע
  choice: namatay na
  rationale: Ang גוע ay tumutukoy sa pagpanaw o pagkamatay. Malinaw at marangal ang “namatay na,” at ipinahihiwatig ng “na” na naganap na ito bago nalaman ng kapulungan.
- source_word: וַיִּבְכּוּ אֶת אַהֲרֹן
  choice: siyang iniyakan
  rationale: Tuwirang ipinahahayag ng בכה ang pag-iyak dahil sa isang namatay. Natural sa Tagalog ang “iniyakan” para sa taong ipinagluksa.
- source_word: שְׁלֹשִׁים יוֹם
  choice: tatlumpung araw
  rationale: Tuwirang salin ng pariralang nagsasaad ng tagal.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: buong sambahayan ng Israel
  rationale: Pinananatili ng “sambahayan ng Israel” ang literal at kolektibong larawan ng בֵּית יִשְׂרָאֵל bilang buong bayan, sa halip na patagin ito bilang “buong Israel” lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kapulungan” at “sambahayan” upang mapanatili ang pormal at kolektibong diwa ng tekstong Hebreo, habang ang ayos ng pangungusap ay ginawang natural sa Tagalog.
