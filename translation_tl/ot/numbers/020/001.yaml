  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: tl
  text: Dumating ang mga anak ni Israel[a]—ang buong kapulungan[b]—sa ilang ng Zin noong unang buwan. Nanatili ang bayan sa Kades. Doon namatay si Miriam, at doon din siya inilibing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: O “ang buong pamayanan” o “ang buong pagtitipon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal at pampamilyang katawagan ng Hebreo para sa bansang Israel. Bagaman mas karaniwan sa modernong Filipino ang “mga Israelita,” malinaw at likas pa rin sa kontekstong biblikal ang “mga anak ni Israel.”
- source_word: כָּל הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ipinahahayag ng עֵדָה ang Israel bilang sama-samang nagkakatipong pamayanan; ang “buong kapulungan” ay mas tiyak kaysa pangkalahatang “buong pamayanan.”
- source_word: מִדְבַּר צִן
  choice: ilang ng Zin
  rationale: Ang “ilang” ay likas at maikling katumbas ng מִדְבָּר bilang lupaing ilang, at hindi nito ipinapalagay na pawang buhangin ang lugar gaya ng maaaring ipahiwatig ng “disyerto.”
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: nang unang buwan
  rationale: Tuwirang isinasalin ang panahong binanggit nang hindi nagdaragdag ng taon, na hindi tahasang tinukoy sa Hebreo.
- source_word: וַיֵּשֶׁב
  choice: nanatili
  rationale: Ang pandiwa ay tumutukoy sa paninirahan o pananatili ng bayan sa Kades; hindi ipinahihiwatig ng “nanatili” na permanente silang nanirahan doon.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang “bayan” ay natural na tumutukoy sa Israel bilang isang sambayanan at iniiwasan ang pag-uulit ng “kapulungan.”
- source_word: בְּקָדֵשׁ
  choice: sa Kades
  rationale: Ginamit ang anyong “Kades,” na madaling bigkasin sa Filipino, para sa pangalang Hebreo na קָדֵשׁ.
- source_word: מִרְיָם
  choice: Miriam
  rationale: Pinananatili ang karaniwang transliterasyon ng pangalan upang makilala siya sa konteksto ng Lumang Tipan.
- source_word: וַתָּמָת
  choice: namatay
  rationale: Tuwiran nitong tinutumbasan ang payak na pahayag ng Hebreo nang hindi ito pinapalambot.
- source_word: וַתִּקָּבֵר
  choice: siya inilibing
  rationale: Pinananatili ang balintiyak na diwa ng pandiwa at hindi nagdaragdag kung sino ang naglibing sa kanya.
- source_word: שָׁם ... שָׁם
  choice: doon ... doon din
  rationale: Pinananatili ang pag-uulit sa Hebreo at natural na ipinakikitang sa parehong lugar siya namatay at inilibing.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang mga gitling na pahaba upang malinaw na ang “ang buong kapulungan” ay paglilinaw sa “mga anak ni Israel.” Inilagay ang talababa [b] sa mismong pariralang “buong kapulungan,” sa halip na pagkatapos ng Kades, upang tumugma ang pananda sa paliwanag nito.
