  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: tl
  text: At nakipagtalo ang bayan kay Moises at sinabi nila, “Namatay na lang sana kami nang mamatay ang aming mga kapatid sa harap ni Yahweh!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶב
  choice: nakipagtalo
  rationale: Ang ריב ay tumutukoy sa pakikipagtalo o pakikipagtunggali. Ang “nakipagtalo” ay natural sa makabagong Filipino at pinananatili ang harapang salungatan kay Moises.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang עַם ay tumutukoy rito sa sambayanang Israel. Dignified at karaniwang biblikal na katumbas ang “bayan,” nang hindi ito nililimitahan sa mga opisyal na kinatawan ng kapulungan.
- source_word: עִם מֹשֶׁה
  choice: kay Moises
  rationale: Bagaman literal na “kasama/kasama ni Moises” ang עִם, hinihingi ng pandiwang Filipino na “makipagtalo” ang panandang “kay”; malinaw nitong ipinahihiwatig ang kausap o katunggali nang hindi labis na isinasaling “laban kay.”
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: Sinabi nila
  rationale: Karaniwang pormula ito sa pagpapakilala ng tuwirang pananalita. Iniiwasan ng “Sinabi nila” ang matigas at paulit-ulit na “sinabi nila, na sinasabi.”
- source_word: וְלוּ
  choice: Namatay na lang sana kami
  rationale: Ang לוּ ay nagpapahayag ng matinding panghihinayang o hiling na salungat sa nangyari. Likas na naihahayag ito sa Filipino sa hulma na “... na lang sana.”
- source_word: גָוַעְנוּ ... בִּגְוַע
  choice: namatay ... nang mamatay
  rationale: Inuulit sa salin ang iisang ugat na גוע upang mapanatili ang sadyang leksikal na pag-uulit ng Hebreo. Ang “nang” ay nagpapahayag ng kasabay na pangyayari o kalagayan.
- source_word: אַחֵינוּ
  choice: aming mga kapatid
  rationale: Ang anyo ay panlalaking maramihan ngunit maaaring tumukoy sa mga kapwa Israelita. Ang “mga kapatid” ay hindi tahasang nagtatakda ng kasarian sa Filipino at likas ding maaaring mangahulugang mga kababayan o kasapi ng iisang bayan; hindi dinaragdagan ang teksto ng “na lalaki.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang pinananatili ng “sa harap” ang spatial o presensiyal na diwa ng לִפְנֵי, at ang pangalang tipan na יהוה ay tinutumbasan ng “Yahweh.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangngalang pantangi ang Tetragrammaton sa pinagmulan. Ang “Yahweh” ay nagpapanatili sa pagkakakilanlan nito bilang banal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng אַחֵינוּ
  choice: aming mga kapatid
  alternative: aming mga kapatid na lalaki / aming mga kababayan
  rationale: Panlalaking maramihan ang anyong Hebreo, ngunit hindi sapilitang nililinaw ng konteksto kung mga lalaking kadugo lamang o mga kapwa Israelita ang tinutukoy. Pinananatili ng natural na Filipino na “mga kapatid” ang saklaw na hindi tiyak.
- issue: Ugnayan ng dalawang pagbanggit sa kamatayan
  choice: “namatay ... nang mamatay”
  alternative: “namatay ... gaya ng pagkamatay”
  rationale: Maaaring ipahiwatig ng בִּגְוַע ang panahon o kalagayan (“nang mamatay”) at maaari ring maunawaan bilang paghahambing (“gaya ng pagkamatay”). Pinili ang temporal na pagbasa sa pangunahing teksto sapagkat natural ito at malapit sa konstruksiyon, habang kinikilala ang alternatibong paghahambing.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “bayan” para sa Israel bilang isang sambayanan, “nakipagtalo” para sa adversatibong ריב, at ang likas na hulma ng panghihinayang na “na lang sana.” Walang talababa dahil ang alternatibong sintaktikong pagbasa ay hindi kailangang ilagay sa publikasyong teksto ng isang talata.
