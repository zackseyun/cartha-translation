  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: tl
  text: Ito ang mga tubig ng Meriba,[a] kung saan nakipagtalo kay Yahweh ang mga anak ni Israel, at ipinakita niyang siya ay banal sa gitna nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Meriba ay nangangahulugang “pagtatalo” o “alitan.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at nahayag siyang banal sa kanila” o “at pinatunayan niyang banal siya sa pamamagitan nila.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: Ito ang
  rationale: Ginagamit ang likas na pormulang Filipino sa pagtukoy o pagpapangalan; bagaman maramihan ang tinutukoy na “mga tubig,” idiomatiko ang “Ito ang” para sa kabuuang lugar o pangyayari.
- source_word: מֵי מְרִיבָה
  choice: mga tubig ng Meriba
  rationale: Ang מְרִיבָה ay pangalan ng lugar sa konteksto, kaya tinumbasan ito sa anyong transliterado; ipinaliliwanag sa talababa ang kahulugang kaugnay ng pagtatalo.
- source_word: רָבוּ
  choice: nakipagtalo
  rationale: Malinaw at kasalukuyang Filipino para sa pakikipagtunggali o pakikipagtalo na ipinahihiwatig ng ריב.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang anyo ng Hebreong pariralang tumutukoy sa mga inapo o sambayanan ni Israel nang hindi ginagawang teknikal o lipas ang wika.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa pamamagitan ng karaniwang transliterasyon sa halip na palitan ito ng titulo.
- source_word: וַיִּקָּדֵשׁ
  choice: ipinakita niyang banal siya
  rationale: 'Ipinahahayag sa natural na Filipino ang diwang pasibo-reflexive ng nifal: nahayag ang kabanalan ni Yahweh, hindi na ginawa siyang banal ng mga tao.'
- source_word: בָּם
  choice: sa gitna nila
  rationale: Likas na salin ng ugnayang ipinahihiwatig ng בָּם sa konteksto, habang ang posibleng “sa pamamagitan nila” ay pinananatili sa talababa.
theological_decisions:
- issue: Paglalahad sa pagpapakabanal kay Yahweh sa huling sugnay
  choice: at ipinakita niyang banal siya sa gitna nila
  alternative: at nahayag siyang banal sa kanila / at pinatunayan niyang banal siya sa pamamagitan nila
  rationale: Iniiwasan ng pangunahing salin ang maling pahiwatig na ginawa ng mga tao na banal ang Diyos, ngunit pinananatili sa talababa ang tunay na pasibo at instrumental na mga posibilidad ng Hebreo.
- issue: Paglalahad sa בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanan ng Israel
  rationale: Pinananatili ang kongkretong anyo ng orihinal na parirala habang nananatiling malinaw at pamilyar sa mga mambabasang Filipino.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang pangalang Yahweh at Meriba, at iniwasan ang sobrang literal na anyong maaaring magbigay ng maling teolohikal na pahiwatig.
