  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: tl
  text: At bakit ninyo dinala sa ilang na ito ang kapulungan ni Yahweh[a], upang doon kami at ang aming mga alagang hayop ay mamatay?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang kongregasyon ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: At bakit
  rationale: Pinananatili ang pang-ugnay na וְ at ang tanong na לָמָה, habang natural ang daloy sa makabagong Tagalog.
- source_word: הֲבֵאתֶם
  choice: ninyo dinala
  rationale: Ang Hiphil ng בוא ay nangangahulugang ‘dalhin’ o ‘papuntahin’; ang aspektong naganap ay malinaw sa ‘dinala.’
- source_word: קְהַל יְהוָה
  choice: ang kapulungan ni Yahweh
  rationale: Ang קהל ay tumutukoy sa nagkakatipong pamayanan; malinaw at marangal ang ‘kapulungan.’ Pinananatili ng ‘ni Yahweh’ ang ugnayang genitibo at ang personal na banal na pangalan.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: sa ilang na ito
  rationale: Ang מִדְבָּר ay ilang o lupaing di-tinatahanan, hindi kinakailangang disyerto; natural sa Tagalog ang ‘sa ilang na ito’ bilang hantungan ng pagdadala.
- source_word: לָמוּת שָׁם
  choice: upang doon mamatay
  rationale: Ang infinitive na לָמוּת ay maaaring magpahayag ng layunin o bunga. Ang ‘upang’ ay likas sa Tagalog at hindi nagpapasya kung tunay na layunin iyon o mapait na paratang lamang; ang שָׁם ay ‘doon.’
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: kami at ang aming mga alagang hayop
  rationale: Pinananatili ang tahasang ‘kami’ at isinasalin ang בְּעִיר bilang kolektibong mga hayop na pag-aari o inaalagaan. Mas malinaw sa karaniwang mambabasa ang ‘mga alagang hayop’ kaysa ‘mga hayop’ lamang.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Ang ‘Yahweh’ ay direktang transliterasyon at hindi ito pinapalitan ng isang titulo.
- issue: Ugnayan ng infinitive na לָמוּת sa pangunahing pandiwa
  choice: upang doon mamatay
  alternative: kaya doon kami mamamatay
  rationale: Maaaring magpahiwatig ang Hebreo ng layunin o inaakalang bunga. Pinananatili ng ‘upang’ ang retorikal na paratang at ang tensiyong ito nang hindi ito tahasang ginagawang simpleng sanhi at bunga.
translation_notes:
  register: Makabagong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘kapulungan’ para sa sama-samang bayan at ‘ilang’ para sa biblikal na wilderness; iniwasan ang labis na eklesyastikal o makalumang pananalita.
