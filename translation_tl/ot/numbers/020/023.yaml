  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: tl
  text: 'At sinabi ni Yahweh kina Moises at Aaron sa Bundok Hor, sa hangganan ng lupain ng Edom:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Ang wayyiqtol ng אמר ay karaniwang salaysay na “at sinabi”; tuwiran at likas ito sa Filipino bilang pambungad sa kasunod na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Ang “kina” ay likas na modernong Filipino para sa patunguhan ng pananalita kapag dalawa o higit pang taong pinangalanan; saklaw nito ang inuulit na אֶל.
- source_word: בְּהֹר הָהָר
  choice: sa Bundok Hor
  rationale: Ang בְּ ay lokatibo rito, at ang kinikilalang pangalan ng lugar ay natural na isinasaling “Bundok Hor.”
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: sa hangganan ng lupain ng Edom
  rationale: Ipinahahayag nito ang lokasyon sa hangganan ng teritoryo ng Edom sa malinaw at natural na Filipino.
- source_word: לֵאמֹר
  choice: ipinahihiwatig ng kuwit
  rationale: Sa Filipino, ang hiwalay na “na sinasabi” bago ang tuwirang pahayag ay madalas maging mabigat at hindi kailangan; ang kuwit ay natural na naghahanda sa nilalaman ng pananalita sa susunod na talata.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nag-aangkat ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kina” para sa natural na pagtukoy sa dalawang pinangalanang kausap, at iniwasan ang literal ngunit alanganing “na sinasabi” sa hulihan. Walang talababa sapagkat hindi kailangan ng teksto ang alternatibong pagbasa; ang ibinigay na English footnote ay tila hindi tugma ang marker sa “Mount Hor” at inuulit lamang ang usapin sa banal na pangalan.
