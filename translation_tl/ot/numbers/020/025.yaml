  yaml_path: translation/ot/numbers/020/025.yaml
  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: tl
  text: Isama mo si Aaron at ang anak niyang si Eleazar, at paakyatin mo sila sa Bundok Hor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Hor, ang bundok”; karaniwang isinasalin na “Bundok Hor.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Isama mo
  rationale: Ang Qal imperative ng לקח ay literal na ‘kunin mo,’ ngunit sa utos na samahan at dalhin ang mga tao sa isang lugar, mas natural sa modernong Tagalog ang ‘isama mo.’
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Karaniwang anyo ng pangalang Hebreo sa Tagalog na salin ng Bibliya.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Karaniwang anyo ng pangalang Hebreo sa Tagalog na salin ng Bibliya.
- source_word: בְּנוֹ
  choice: ang anak niyang
  rationale: Ang panlaping panghalip na panlalaking isahan ay natural na tumutukoy kay Aaron; malinaw at karaniwan sa Tagalog ang ‘ang anak niyang si Eleazar.’
- source_word: וְהַעַל
  choice: paakyatin mo
  rationale: Ang Hiphil imperative ng עלה ay causative, ‘paakyatin’ o ‘dalhin paitaas.’ Pinananatili ng ‘paakyatin mo’ ang causative na diwa at natural itong gamitin para sa pag-akyat sa bundok.
- source_word: אֹתָם
  choice: sila
  rationale: Tumutukoy ang panghalip kina Aaron at Eleazar bilang magkasamang layon ng pandiwang causative.
- source_word: הֹר הָהָר
  choice: Bundok Hor
  rationale: Ito ang natural at nakaugaliang ayos ng pangalan ng bundok sa Tagalog; ang pormal na anyo ng Hebreo ay ‘Hor, ang bundok.’
theological_decisions: []
translation_notes:
  register: Gumamit ng modernong, malinaw, at marangal na Tagalog. Ang ‘Isama mo’ ay mas natural kaysa literal na ‘Kunin mo’ kapag mga taong dadalhin ang tinutukoy, samantalang ang ‘paakyatin mo’ ay nagpapanatili sa causative na anyo ng Hebreo.
