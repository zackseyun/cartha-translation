  source_fidelity: Ang draft ay wastong kumikilala kay Yahweh bilang nagsalita kay Moises at pinananatili ang pormulang nagpapakilala sa kasunod na pananalita. Gayunman, hindi naipahayag ang paunang waw na “At,” at ang tuldok bago ang “Sinabi niya,” ay di-gaanong tapat sa iisang Hebreong pormula ng pagsasalita.
  naturalness: Likas ang “Nagsalita si Yahweh kay Moises,” ngunit ang hiwalay na “Sinabi niya,” pagkatapos ng tuldok ay putol at medyo hindi maayos bilang pambungad sa susunod na talata. Mas malinaw at marangal ang isang tuloy na pangungusap na may tutuldok.
