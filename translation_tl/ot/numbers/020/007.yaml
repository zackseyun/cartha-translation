  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh[a] kay Moises at sinabi niya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: YHWH; maaari ring isalin bilang “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive at Piel ng דבר ay karaniwang pormula sa pagsasalaysay. Ang “nagsalita” ay mas malapit sa anyo ng Hebreo kaysa sa simpleng “sinabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Likas na ipinahahayag ng “kay” sa Tagalog ang direksiyon ng pagsasalita tungo kay Moises.
- source_word: לֵּאמֹר
  choice: Sinabi niya,
  rationale: Ang infinitive construct ay pormulang nagpapakilala sa susunod na pahayag. Ang hiwalay na “Sinabi niya,” ay natural sa modernong Tagalog at malinaw na nag-uugnay sa pananalitang sumusunod.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; o ang tradisyonal na pamalit na “PANGINOON”
  rationale: Tuwirang ginagamit sa Hebreo ang tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa teksto nang hindi ito ginagawang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang sugnay ang pormulang Hebreo upang maiwasan ang di-likas na “na sinasabi,” habang pinananatiling bukas ang pahayag na nagpapatuloy sa susunod na talata.
