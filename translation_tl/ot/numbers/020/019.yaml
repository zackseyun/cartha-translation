  text: וַ/יֹּאמְר֨וּ אֵלָ֥י/ו בְּנֵֽי יִשְׂרָאֵ֘ל בַּֽ/מְסִלָּ֣ה נַעֲלֶה֒ וְ/אִם מֵימֶ֤י/ךָ נִשְׁתֶּה֙ אֲנִ֣י וּ/מִקְנַ֔/י וְ/נָתַתִּ֖י מִכְרָ֑/ם רַ֥ק אֵין דָּבָ֖ר בְּ/רַגְלַ֥/י אֶֽעֱבֹֽרָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: tl
  text: Sinabi sa kanya ng mga Israelita[a], “Aakyat kami sa lansangan[b]. At kung iinom kami ng tubig mo—ako at ang mga alaga kong hayop—babayaran ko ang halaga nito. Daraan lamang ako nang naglalakad[c]—wala nang iba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pangunahing daan.” Ang salitang Hebreo ay tumutukoy sa isang itinayong daan o lansangan.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “daraan ako sa pamamagitan ng aking mga paa,” isang paraan ng pagsasabing daraan lamang sila sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at malinaw na tawag sa bayan sa modernong Tagalog; inilalagay sa talababa ang literal na Hebreong idyoma.
- source_word: בַּמְסִלָּה
  choice: sa lansangan
  rationale: Ang מְסִלָּה ay isang itinayong o pangunahing daan; ang “lansangan” ay marangal at madaling maunawaang katumbas na hindi labis na nagpapaliit sa kahulugan.
- source_word: נַעֲלֶה
  choice: aakyat kami
  rationale: Pinananatili ang pangunahing kahulugang “umakyat,” kahit maaari rin itong tumukoy sa paglalakbay sa rutang iyon sa konteksto.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: iinom kami ng tubig mo—ako at ang mga alaga kong hayop
  rationale: Pinananatili ang pandiwang maramihan at ang kasunod na paglilinaw na “ako at ang aking mga alagang hayop,” habang ginagawa itong natural sa Tagalog.
- source_word: וְנָתַתִּי מִכְרָם
  choice: babayaran ko ang halaga nito
  rationale: Malinaw na ipinapahayag ang kabayarang ibibigay para sa tubig na maiinom, at pinananatili ang isahang pananalita ng kinatawan ng bayan.
- source_word: רַק אֵין דָּבָר
  choice: lamang ... wala nang iba
  rationale: 'Ipinahahayag ang mariing paglilimita sa kahilingan: simpleng pagdaan at wala nang karagdagang hinihingi.'
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: daraan lamang ako nang naglalakad
  rationale: Natural na Tagalog para sa literal na “daraan ako sa pamamagitan ng aking mga paa,” habang pinananatili ang ideya ng payak na pagdaan sa lupa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Pinanatili ang kapansin-pansing pagbabago mula sa maramihang “kami” tungo sa isahang “ako,” sapagkat nagsasalita ang Israel bilang isang kolektibong bayan sa pamamagitan ng kinatawan nito. Ginamit ang mga gitling na em upang luminaw ang paningit at ang pangwakas na paglilimita.
