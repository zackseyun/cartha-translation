  yaml_path: translation/ot/numbers/020/021.yaml
  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: tl
  text: Ngunit tumanggi ang Edom na paraanin ang Israel sa teritoryo nito, kaya lumihis ang Israel palayo rito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: tumanggi
  rationale: Tuwirang ipinahahayag ng pandiwang מאן ang pagtanggi o hindi pagpayag; natural at sapat ang lakas ng “tumanggi” sa salaysay.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Pinanatili ang kinikilalang anyo sa Filipino ng pangalan ng bansa.
- source_word: נְתֹן ... עֲבֹר
  choice: paraanin
  rationale: Sa pagkakaugnay nito sa מאן, ang נתן ay may idyomatikong diwang ‘payagan,’ at ang עבר ay tumutukoy sa pagdaan; likas na pinagsasama ng “paraanin” ang dalawang ideya.
- source_word: בִּגְבֻלוֹ
  choice: sa kanyang nasasakupan
  rationale: Ang גְּבוּל ay maaaring mangahulugang hangganan o teritoryo; sa konteksto ng paglalakbay sa lupain ng Edom, malinaw na tumutukoy ito sa nasasakupang lupain.
- source_word: וַיֵּט
  choice: lumihis
  rationale: Ang נטה ay nangangahulugang bumaling o lumihis; dito ay inilalarawan ang pagbabago ng ruta ng Israel.
- source_word: מֵעָלָיו
  choice: palayo sa kanya
  rationale: Ipinahahayag ng parirala ang paglayo mula sa Edom; malinaw at natural ito sa modernong Filipino.
