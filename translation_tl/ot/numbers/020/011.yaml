  to: Pagkatapos, itinaas ni Moises ang kanyang kamay at hinampas niya nang dalawang ulit ang bato gamit ang kanyang tungkod. At lumabas ang maraming tubig, at uminom ang kapulungan at ang kanilang mga alagang hayop.
  rationale: Pinalitan ang mas interpretibong “bumuhos” ng “lumabas,” na malapit sa pandiwang Hebreo at hindi nagdaragdag ng paglalarawan sa daloy ng tubig. Inalis ang “buong” upang hindi magdagdag ng diin. Pinanatili ang malinaw na pagtukoy na dalawang ulit hinampas ni Moises ang bato gamit ang kanyang tungkod, at na parehong uminom ang kapulungan at kanilang mga alagang hayop.
