  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: tl
  text: Pagkatapos, itinaas ni Moises ang kanyang kamay at hinampas niya nang dalawang ulit ang bato gamit ang kanyang tungkod. At lumabas ang maraming tubig, at uminom ang kapulungan at ang kanilang mga alagang hayop.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: itinaas
  rationale: Tuwirang ipinapahayag ang Hiphil ng רום at natural sa makabagong salaysay sa Filipino.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Tapat na katumbas ng pangngalang isahan na may panlaping ikatlong panauhang panlalaki.
- source_word: וַיַּךְ
  choice: hinampas
  rationale: Ang נכה ay nangangahulugang humampas o tumama. Ang “hinampas” ay malinaw at angkop sa paggamit ng tungkod.
- source_word: הַסֶּלַע
  choice: ang bato
  rationale: Ang סֶלַע ay malaking bato o batuhan; “ang bato” ang natural at kontekstuwal na salin dito.
- source_word: בְּמַטֵּהוּ
  choice: ng kanyang tungkod
  rationale: Ang מַטֶּה ay tungkod o pamalo. “Tungkod” ang pamilyar at marangal na katawagan sa gamit ni Moises.
- source_word: פַּעֲמָיִם
  choice: dalawang ulit
  rationale: Natural na Filipino para sa anyong dual na nangangahulugang “twice,” habang malinaw na dalawang beses ang paghampas.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: Bumuhos mula rito ang napakaraming tubig
  rationale: Ipinahihiwatig ng מַיִם רַבִּים ang napakaraming tubig. Ang “bumuhos” ay natural na paglalarawan sa paglabas ng saganang tubig, at ang “mula rito” ay nililinaw lamang ang pinagmulan ayon sa naunang bato.
- source_word: וַתֵּשְׁתְּ
  choice: uminom
  rationale: Bagaman pambabaeng isahan ang pandiwa dahil sa kolektibong עֵדָה, natural sa Filipino ang “uminom” para sa buong pangkat.
- source_word: הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan ng Israel. “Kapulungan” ang dignified at malinaw na kolektibong katawagan; idinidiin ng “buong” ang kolektibong saklaw nang hindi nagdaragdag ng bagong kalahok.
- source_word: וּבְעִירָם
  choice: pati ang kanilang mga alagang hayop
  rationale: Ang בְּעִיר ay malawak na tumutukoy sa mga domestikadong hayop, hindi lamang baka. “Mga alagang hayop” ang natural at sapat na malawak na salin.
theological_decisions:
- issue: Paglalarawan sa ginawa ni Moises sa bato
  choice: Payak na isinalaysay na dalawang ulit niyang hinampas ng tungkod ang bato.
  alternative: Magdagdag sa talata ng tahasang paghatol na ito ay pagsuway.
  rationale: Mahalaga at hinatulan sa kasunod na konteksto ang ginawa ni Moises, ngunit ang talatang ito mismo ay nagsasalaysay ng kilos at kinalabasan nito. Hindi dapat isingit sa linya ng salin ang interpretasyong hindi tahasang nakasaad rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na kilos sa salaysay, ngunit hinati sa dalawang pangungusap upang maging natural at madaling basahin. Walang kinakailangang talababa.
