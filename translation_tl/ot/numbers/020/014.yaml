base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: tl
  text: 'Mula sa Kades, nagsugo si Moises ng mga mensahero sa hari ng Edom: “Ganito ang sabi ng kapatid mong Israel:[a] Alam mo ang lahat ng paghihirap na sumapit sa amin.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kamag-anak mong Israel.” Ginagamit ng Hebreo ang salitang “kapatid” upang ipahiwatig ang ugnayang ninuno ng Edom at Israel.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “lahat ng paghihirap na nakasumpong sa amin”; ibig sabihin, lahat ng paghihirap na dumating o sumapit sa amin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, nagsugo
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa kontekstong diplomatiko, mga taong kinatawan ang tinutukoy, hindi mga anghel.
- source_word: מִקָּדֵשׁ
  choice: mula sa Kades
  rationale: Kades lamang ang pangalan ng lugar sa tekstong Hebreo; hindi idinagdag ang “Barnea.”
- source_word: מֶלֶךְ אֱדוֹם
  choice: hari ng Edom
  rationale: Tuwiran at natural na salin ng pariralang konstruktibo.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Karaniwang pormula ito ng mensahero at malinaw sa natural na Filipino.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: kapatid mong Israel
  rationale: Pinananatili ang tahasang wikang pampamilya na tumutukoy sa ugnayang ninuno ng Edom at Israel.
- source_word: אַתָּה יָדַעְתָּ
  choice: Alam mo
  rationale: Ang aspektong ganap ay nagpapahayag dito ng kasalukuyang kalagayan ng kaalaman; natural ang “Alam mo” sa Filipino.
- source_word: כָּל הַתְּלָאָה
  choice: lahat ng hirap
  rationale: Saklaw ng pangngalan ang hirap, problema, o kapighatian; malinaw at karaniwan ang “hirap.”
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: na dumating sa amin
  rationale: Idyomatikong nangangahulugan ang literal na “nakasumpong sa amin” ng hirap na sumapit o dumating sa kanila.
theological_decisions:
- issue: Wikang nagpapahayag ng pagkakamag-anak ng Israel at Edom
  choice: kapatid mong Israel
  alternative: kamag-anak mong Israel
  rationale: Sinasadyang iharap ng talata ang pakiusap ng Israel sa wikang pampamilya, batay sa ugnayan nina Jacob at Esau. Pinananatili ang metaporang “kapatid” sa halip na gawing mas pangkalahatan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “nagsugo” at “mga mensahero” para sa diplomatikong konteksto; pinanatili ang “kapatid” upang hindi mawala ang mahalagang wikang pampamilya sa Hebreo.
