  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּקְהִ֜לוּ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן אֶת הַ/קָּהָ֖ל אֶל פְּנֵ֣י הַ/סָּ֑לַע וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְעוּ נָא֙ הַ/מֹּרִ֔ים הֲ/מִן הַ/סֶּ֣לַע הַ/זֶּ֔ה נוֹצִ֥יא לָ/כֶ֖ם מָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: tl
  text: Pagkatapos, tinipon nina Moises at Aaron ang kapulungan sa harap ng bato, at sinabi niya sa kanila, “Makinig kayo ngayon, kayong mga rebelde! Magpapalabas ba kami ng tubig mula sa batong ito para sa inyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: tinipon
  rationale: Ang Hiphil ng קהל ay sanhiang anyo, ‘tipunin’ o ‘papagtipunin’; natural sa modernong Tagalog ang ‘tinipon.’
- source_word: הַקָּהָל
  choice: ang kapulungan
  rationale: Tumutukoy ang קָהָל sa nagkakatipong pamayanan. Pinananatili ng ‘kapulungan’ ang kolektibong diwa nang hindi nag-aangkat ng partikular na katawagang pangdenominasyon.
- source_word: אֶל פְּנֵי הַסָּלַע
  choice: sa harap ng bato
  rationale: Likas at tuwirang katumbas ito ng idyomang nangangahulugang ‘before/in front of the rock.’
- source_word: וַיֹּאמֶר
  choice: at sinabi niya
  rationale: Isahan ang pandiwa sa Hebreo. Pinananatili ng ‘niya’ ang gramatikal na anyo at hindi tahasang pinapangalanan si Moises lampas sa sinasabi ng teksto.
- source_word: שִׁמְעוּ נָא
  choice: Makinig kayo ngayon
  rationale: Ipinahahayag nito ang maramihang pautos at ang diin o pagkamadalian ng נָא, sa halip na gawing magalang lamang na pakiusap.
- source_word: הַמֹּרִים
  choice: kayong mga rebelde
  rationale: Ang substantibong participle mula sa מרה ay tumutukoy sa mga taong naghihimagsik o sumusuway. Tuwiran at natural ang ‘mga rebelde.’
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: mula sa batong ito
  rationale: Ipinahahayag ng מִן ang pinagmumulan; ‘mula sa’ ang pinakatuwirang katumbas.
- source_word: נוֹצִיא
  choice: Magpapalabas ba kami
  rationale: Ang Hiphil ng יצא ay ‘magpalabas’ o ‘maging sanhi upang lumabas.’ Pinananatili rin nito ang unang panauhang maramihan at ang anyong patanong.
- source_word: מָיִם
  choice: tubig
  rationale: Karaniwang tuwirang katumbas ng מַיִם.
theological_decisions:
- issue: Unang panauhang maramihan sa tanong ni Moises
  choice: Magpapalabas ba kami ng tubig mula sa batong ito para sa inyo?
  alternative: Magpapalabas ba ng tubig mula sa batong ito para sa inyo?
  rationale: Hayagang unang panauhang maramihan ang נוֹצִיא. Pinananatili ang ‘kami’ upang hindi ikubli o lutasin sa salin ang tensiyon tungkol sa papel nina Moises at Aaron kaugnay ng pagkilos ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kapulungan’ bilang likas ngunit hindi sektaryong tawag sa nagkakatipong bayan; tuwiran ang pagsaway na ‘mga rebelde,’ at pinanatili ang isahang ‘sinabi niya’ at ang teolohikal na mahalagang ‘kami.’
