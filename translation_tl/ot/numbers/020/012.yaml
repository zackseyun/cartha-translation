  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: tl
  text: Sinabi ni Yahweh kina Moises at Aaron, “Dahil hindi kayo naniwala sa akin[a] at hindi ninyo ipinakitang banal ako[b] sa harap ng mga anak ni Israel[c], hindi ninyo maipapasok ang kapulungang ito sa lupaing ibinigay ko sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi kayo nagtiwala sa akin.” Ang pandiwang Hebreo ay maaaring mangahulugang maniwala o magtiwala.
    reason: lexical_alternative
  - marker: b
    text: O “hindi ninyo ako itinuring na banal” o “hindi ninyo ako pinabanal.”
    reason: lexical_alternative
  - marker: c
    text: O “mga Israelita.” Literal sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: naniwala sa akin
  rationale: Ang Hiphil ng אמן na may ב ay maaaring tumukoy sa paniniwala o pagtitiwala sa isang tao. Ang “naniwala sa akin” ay tuwiran at pinananatili ang posibleng saklaw ng kahulugan; inilagay sa talababa ang “nagtiwala sa akin.”
- source_word: לְהַקְדִּישֵׁנִי
  choice: ipinakitang banal ako
  rationale: Ipinahahayag nito ang pampubliko at causative na diwa ng pagkilala o pagpapakilala kay Yahweh bilang banal, nang hindi gumagamit ng mas teknikal at maaaring malabong “pakabanalin ako.”
- source_word: לְעֵינֵי
  choice: sa harap ng
  rationale: Natural na katumbas sa modernong Tagalog ng Hebreong idyomang “sa mga mata ng,” habang pinananatili ang pampublikong katangian ng pangyayari.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit sa anyong Hebreo at pinananatili ang tradisyonal na tipanang katawagan; ang mas natural na “mga Israelita” ay ibinigay sa talababa.
- source_word: תָבִיאוּ
  choice: maipapasok
  rationale: 'Pinananatili ang causative na diwa ng Hiphil ng בוא: sila ang magdadala o magpapapasok sa kapulungan sa lupain.'
- source_word: הַקָּהָל
  choice: kapulungang ito
  rationale: Ang “kapulungan” ay angkop sa natipong sambayanan sa ilang at hindi nagdaragdag ng partikular na eklesiastikal na kahulugan.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי לָהֶם
  choice: lupaing ibinigay ko sa kanila
  rationale: Ang ganap na pandiwa ay isinaling “ibinigay” upang mapanatili ang katiyakan ng kaloob mula sa pananaw ng Diyos.
theological_decisions:
- issue: Likas ng pagkukulang nina Moises at Aaron
  choice: Pagkabigong maniwala kay Yahweh at ipakitang banal siya sa harap ng Israel
  alternative: Pagkabigong magtiwala kay Yahweh at magbigay-galang sa kanyang kabanalan
  rationale: Pinananatili ang dalawang kaugnay ngunit hindi lubusang pinag-iisang paratang sa talata, nang hindi ipinapaliwanag nang higit sa teksto kung paano eksaktong nahayag ang kanilang kawalan ng paniniwala.
- issue: Kahulugan ng לְהַקְדִּישֵׁנִי
  choice: ipinakitang banal ako
  alternative: itinuring akong banal / pinabanal ako
  rationale: Ipinapakita ng napiling salin ang pampublikong pagkilala sa kabanalan ng Diyos, ngunit pinananatili sa talababa ang mas literal na mga alternatibo.
- issue: Saklaw ng hatol
  choice: hindi ninyo maipapasok ang kapulungan
  alternative: hindi ninyo dadalhin ang kapulungan
  rationale: Hindi ipinapalagay na hindi papasok ang sambayanan; ang hatol ay nakatuon sa hindi pagdadala nina Moises at Aaron sa kanila papasok sa lupain.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kina Moises at Aaron” para sa natural na Tagalog, “kapulungan” para sa pormal ngunit hindi sektaryong katawagan sa natipong bayan, at malinaw na causal-consequence na ayos upang mapanatili ang solemneng tono ng hatol.
