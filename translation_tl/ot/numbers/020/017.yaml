  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: tl
  text: “Pakiusap, hayaan mo kaming dumaan sa iyong lupain. Hindi kami daraan sa bukid o ubasan, at hindi kami iinom ng tubig mula sa balon. Sa daan ng hari[a] kami maglalakbay; hindi kami liliko sa kanan o sa kaliwa hanggang sa makalampas kami sa hangganan ng iyong lupain.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “maharlikang lansangan.” Literal: “daan ng hari.”'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy sa “hangganan” o sa “nasasakupan”; dito, ang diwa ay makalampas sa teritoryo ng Edom.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא
  choice: Pakiusap, hayaan mo kaming dumaan
  rationale: Ang cohortative na may נָא ay isang magalang na kahilingan. Likas sa makabagong Tagalog ang “Pakiusap, hayaan mo kaming dumaan” at pinananatili nito ang pakiusap sa hari ng Edom.
- source_word: בְאַרְצֶךָ
  choice: sa iyong lupain
  rationale: Kasama ng pandiwang עבר, ipinahihiwatig ng ב ang pagdaan sa loob at pagtawid sa isang teritoryo. Ang “lupain” ay tuwirang katumbas ng אֶרֶץ sa kontekstong ito.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: Hindi kami daraan sa bukid o ubasan
  rationale: Ang mga pangngalan ay isahan ngunit ginagamit sa pangkalahatang diwa. Ipinapangako nilang hindi sila lilihis patungo sa mga sinasakang lugar.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: at hindi kami iinom ng tubig mula sa balon
  rationale: Ang מֵי בְאֵר ay literal na “tubig ng balon.” Ang “tubig mula sa balon” ay malinaw at natural sa Tagalog nang hindi nagdaragdag ng ideyang wala sa Hebreo.
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  choice: daan ng hari
  rationale: Tuwirang inilalarawan ng parirala ang kinikilalang rutang nauugnay sa hari. Pinananatili ng “daan ng hari” ang anyo ng Hebreo at hindi sapilitang ginagawang pantanging pangalan.
- source_word: נֵלֵךְ
  choice: kami maglalakbay
  rationale: Sa konteksto, ang הלך ay tumutukoy sa paglalakbay sa itinakdang ruta, hindi lamang sa literal na paglakad.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: hindi kami liliko sa kanan o sa kaliwa
  rationale: Pinananatili nito ang pares ng direksiyon sa Hebreo at malinaw na ipinahihiwatig na hindi sila lilihis sa ruta.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: hanggang sa makalampas kami sa hangganan ng iyong lupain
  rationale: Maaaring mangahulugan ang גְּבוּל ng hangganan o nasasakupan. Sa konteksto ng pagdaan sa Edom, natural na ipinahihiwatig ng parirala ang paglabas nila sa kabilang hangganan ng lupain.
