  register: Makabago, magalang, at marangal ang rehistro. Ginamit ang tuwirang pakikipag-usap na isahan (“mo,” “iyong”) ayon sa Hebreo, sapagkat sa hari ng Edom nakatuon ang mensahe. Iniwasan ang lipas o labis na teknikal na pananalita.
