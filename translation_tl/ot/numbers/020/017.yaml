  source_fidelity: 'Tapat ang salin sa Hebreo: ang magalang na kahilingan (נָא), pagdaan sa lupain, pagtangging dumaan sa bukid o ubasan at uminom ng tubig-singaw-balón, paglalakbay sa daan ng hari, at hindi paglihis hanggang malampasan ang hangganan ay lahat naipahayag nang wasto. Ang “makalampas ... sa hangganan ng iyong lupain” ay angkop na pagsasalin sa kontekstuwal na diwa ng עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ.'
