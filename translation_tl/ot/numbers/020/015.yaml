  text: וַ/יֵּרְד֤וּ אֲבֹתֵ֨י/נוּ֙ מִצְרַ֔יְמָ/ה וַ/נֵּ֥שֶׁב בְּ/מִצְרַ֖יִם יָמִ֣ים רַבִּ֑ים וַ/יָּרֵ֥עוּ לָ֛/נוּ מִצְרַ֖יִם וְ/לַ/אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: tl
  text: At bumaba sa Ehipto ang aming mga ninuno[a], at nanirahan kami sa Ehipto nang mahabang panahon[b]. Pinagmalupitan kami at ang aming mga ninuno ng mga Ehipsiyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “aming mga ama”; dito ay tumutukoy sa aming mga ninuno. Gayundin sa ikalawang paglitaw nito sa talata.
    reason: lexical_alternative
  - marker: b
    text: Literal na “maraming araw,” isang idyoma para sa mahabang panahon.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ginawan kami at ang aming mga ninuno ng masama” o “pinakitunguhan nang masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: bumaba
  rationale: Pinananatili ang karaniwang heograpikong idyoma ng Hebreo para sa pagpunta sa Ehipto, at natural din ito sa biblikal na salaysay sa Tagalog.
- source_word: אֲבֹתֵינוּ
  choice: aming mga ninuno
  rationale: Literal na 'aming mga ama,' ngunit sa pagbabalik-tanaw sa kasaysayan ay tumutukoy ito sa mga ninuno; mas malinaw at likas ito sa modernong Tagalog. Ipinaliliwanag sa talababa ang literal na anyo.
- source_word: מִצְרַיְמָה
  choice: sa Ehipto
  rationale: Ang hulaping paturol sa Hebreo ay nagpapahayag ng paggalaw tungo sa isang lugar; ang 'sa Ehipto' ang natural na katumbas kasunod ng 'bumaba.'
- source_word: וַנֵּשֶׁב
  choice: nanirahan kami
  rationale: Ang ישב dito ay tumutukoy sa paninirahan o pagtira, hindi lamang sa pag-upo; malinaw at marangal ang 'nanirahan.'
- source_word: יָמִים רַבִּים
  choice: nang mahabang panahon
  rationale: Literal itong 'maraming araw,' ngunit isang idyoma para sa mahabang yugto. Ang kahulugan ng idyoma ang natural na inilalahad sa pangunahing teksto, habang inilalagay sa talababa ang literal na anyo.
- source_word: וַיָּרֵעוּ
  choice: pinagmalupitan
  rationale: Ang Hiphil ng רעע ay nagpapahayag ng paggawa ng masama o pananakit sa iba. Sa konteksto ng pagtrato ng mga Ehipsiyo, malinaw at natural ang 'pinagmalupitan,' habang itinatala sa talababa ang mas malawak na literal na diwa.
- source_word: מִצְרַיִם
  choice: mga Ehipsiyo
  rationale: Bagaman ang anyo ay pangalan ng bansang Ehipto, maramihan ang pandiwa at mga tao ng Ehipto ang tinutukoy; kaya tahasang isinalin bilang 'mga Ehipsiyo.'
- source_word: לָנוּ
  choice: kami
  rationale: Tinutukoy ng ל ang mga taong dumanas ng masamang pagtrato; sa balangkas na 'pinagmalupitan,' ang tuwirang 'kami' ang likas na Tagalog.
- source_word: וְלַאֲבֹתֵינוּ
  choice: at ang aming mga ninuno
  rationale: Pinananatili ang pag-uulit ng Hebreo upang hindi mawala ang diin na kapuwa ang nagsasalitang salinlahi at ang kanilang mga ninuno ay dumanas nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang 'mga ninuno' sa teksto para sa agarang pagkaunawa, ngunit pinanatili sa talababa ang literal na 'mga ama.' Ang mga marker ay inilagay kaagad sa kaugnay na parirala.
