  terminology: Pinanatili ang “kapulungan,” “kaluwalhatian,” at “Yahweh.” Pinalitan ang “Toldang Tipanan” ng “Tolda ng Tagpuan” upang mas tumpak na maipahayag ang אֹהֶל מוֹעֵד nang hindi ipinagkakamali itong ‘tolda ng tipan.’
