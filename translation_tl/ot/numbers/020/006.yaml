  text: וַ/יָּבֹא֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן מִ/פְּנֵ֣י הַ/קָּהָ֗ל אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֲלֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: tl
  text: Umalis sina Moises at Aaron mula sa harap ng kapulungan[a] at pumunta sa pasukan ng Tolda ng Tagpuan. Nagpatirapa sila, at nagpakita sa kanila ang kaluwalhatian ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa harap ng kapulungan,” isang idyomang nangangahulugang mula sa kinaroroonan ng nagkakatipong bayan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumunta
  rationale: Ang בוא ay maaaring mangahulugang “pumarito,” “pumunta,” o “pumasok” ayon sa pananaw. Dito, natural sa salaysay ang “pumunta” dahil inilalarawan ang pagkilos nina Moises at Aaron patungo sa pasukan.
- source_word: מִפְּנֵי הַקָּהָל
  choice: umalis ... sa harap ng kapulungan
  rationale: Pinananatili nito ang direksiyong ipinahihiwatig ng מִן at ang larawang spatial ng פְּנֵי, habang malinaw sa modernong Tagalog na lumayo sila mula sa kinaroroonan ng nagkakatipong bayan.
- source_word: הַקָּהָל
  choice: kapulungan
  rationale: Ang קהל ay tumutukoy sa nagkakatipong pamayanan. Ang “kapulungan” ay dignified at karaniwang salitang Tagalog na hindi naglilimita sa diwa sa isang institusyong panrelihiyon.
- source_word: פֶּתַח
  choice: pasukan
  rationale: Tumutukoy ang פֶּתַח sa bukana o lugar na pinapasukan; “pasukan” ang pinakanatural dito.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Ang מוֹעֵד ay maaaring tumukoy sa takdang pagkikita o pagtitipon. Ang “Toldang Tipanan” ay isang maikli at likas na pangalang Filipino para sa sagradong toldang pinagtatagpuan, nang hindi ito tinutumbasan sa mismong tipan.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: nagpatirapa sila
  rationale: Ang literal na “bumagsak sa kanilang mga mukha” ay isang idyoma ng lubos na pagpapatirapa. Natural na ipinahahayag ng “nagpatirapa” ang mismong postura at pagpapakumbaba.
- source_word: וַיֵּרָא
  choice: nagpakita
  rationale: Ang Niphal ng ראה dito ay nagsasaad ng nakikitang pagpapahayag o pagpapakita; “nagpakita” ang tuwiran at natural na katumbas.
- source_word: כְבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Ang כבוד dito ay ang nahahayag na kaluwalhatian ng Diyos. Ginagamit ang “ni” dahil personal na pangalan ang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Filipino ang pangalang tipan na יהוה sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֲלֵיהֶם
  choice: sa kanila
  rationale: Ang אֶל ay nagsasaad ng direksiyon; ang “nagpakita sa kanila” ay natural na Filipino at pinananatiling sina Moises at Aaron ang tumanggap ng pagpapakita.
theological_decisions:
- issue: Paglalarawan sa kilos na וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: nagpatirapa sila
  alternative: sumubsob sila
  rationale: Hindi tahasang sinasabi ng talata kung ito ay pagsamba, panalangin, o pagsusumamo. Ang “nagpatirapa” ay naghahayag ng postura at pagpapakumbaba nang hindi ipinapasok ang isang tiyak na layuning teolohikal.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili sa pagkakaiba ng personal na pangalan at ng titulong אֲדֹנָי.
- issue: Kalikasan ng כְבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  alternative: ang maningning na presensiya ni Yahweh
  rationale: Pinananatili ng “kaluwalhatian” ang lawak ng כבוד at hindi nililimitahan ang pagpapakita sa liwanag lamang o sa isang partikular na pisikal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kapulungan,” “pasukan,” at “nagpatirapa” bilang natural ngunit dignified na pananalita. Pinanatili ang personal na pangalang “Yahweh” at iniwasang tukuyin nang higit sa teksto ang layunin ng pagpapatirapa o ang anyo ng kaluwalhatian.
