  to: At bakit ninyo kami iniahon mula sa Ehipto para dalhin sa masamang lugar na ito[b]? Hindi ito lugar na mapagtataniman[a]—walang mga igos, ubas, o granada[c]—at wala ring tubig na maiinom.
