  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyo” dahil higit sa isang pinuno ang kinakausap sa konteksto. Pinanatili ang tindi ng reklamo nang hindi ginagawang tiyak na moral ang kahulugan ng “masamang lugar.”
