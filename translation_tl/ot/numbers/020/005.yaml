  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: tl
  text: At bakit ninyo kami iniahon mula sa Ehipto para dalhin sa masamang lugar na ito[b]? Hindi ito lugar na mapagtataniman[a]—walang mga igos, ubas, o granada[c]—at wala ring tubig na maiinom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hindi lugar ng binhi”; maaari itong mangahulugang hindi angkop sa paghahasik o hindi namumunga ng butil o ibang pananim.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “hindi kanais-nais,” “miserable,” o “mapaminsalang” lugar. Hindi kinakailangang tumutukoy ang “masama” rito sa moral na kasamaan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring unawain ang listahan bilang “mga puno ng igos, mga baging ng ubas, o mga puno ng granada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: At bakit
  rationale: Pinananatili ng “At” ang pagpapatuloy ng kanilang reklamo, habang natural sa makabagong Tagalog ang “bakit.”
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: ninyo kami iniahon mula sa Ehipto
  rationale: Ang Hiphil ng עלה ay “iniahon” o “dinala paitaas.” Pinananatili ng “iniahon” ang larawang kaugnay ng pag-alis mula sa Ehipto.
- source_word: לְהָבִיא אֹתָנוּ
  choice: para dalhin
  rationale: Malinaw na ipinapahayag ng pariralang pawatas ang layunin o ibinibintang na resulta.
- source_word: אֶל הַמָּקוֹם הָרָע הַזֶּה
  choice: sa masamang lugar na ito
  rationale: Ang רַע ay matinding negatibong paglalarawan dito—hindi kanais-nais o mapaminsala—at hindi kinakailangang tumukoy sa moral na kasamaan.
- source_word: לֹא מְקוֹם זֶרַע
  choice: Hindi ito lugar na mapagtataniman
  rationale: Bagaman literal na “hindi lugar ng binhi,” sa kontekstong agrikultural ang diwa ay isang lugar na angkop sa paghahasik o pagtatanim. Mas natural at malinaw ito sa Tagalog habang iniiwan sa talababa ang literal na anyo.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: walang mga igos, ubas, o granada
  rationale: Inilalahad ng mga pangngalan ang mga pananim o bunga na wala roon. Ang “ubas” ay natural na kumakatawan sa גֶפֶן sa listahang ito, na maaari ring tumukoy sa punong ubas.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: at wala ring tubig na maiinom
  rationale: Natural at tapat na Tagalog para sa eksistensiyal na kawalan ng tubig na maiinom.
