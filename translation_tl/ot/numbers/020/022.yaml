  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: tl
  text: Umalis sila sa Kades, at ang mga Israelita[a]—ang buong kapulungan—ay dumating sa Bundok Hor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “Hor, ang bundok”; ang buong parirala ay ginagamit bilang pangalan ng pook.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa salaysay ng paglalakbay, ang נסע ay tumutukoy sa pag-alis sa pinagkampuhan upang magpatuloy. Likas at malinaw sa modernong Tagalog ang “umalis,” bagaman maaari rin itong isaling “naglakbay mula.”
- source_word: מִקָּדֵשׁ
  choice: sa Kades
  rationale: Kades lamang ang nasa tekstong Hebreo; hindi idinagdag ang mas mahabang pangalang Kades-barnea.
- source_word: וַיָּבֹאוּ
  choice: dumating
  rationale: Ang בוא ay maaaring mangahulugang “dumating” o “pumasok.” Dahil isang bundok na pook ang patutunguhan, natural sa Tagalog ang “dumating sa.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural na modernong Tagalog para sa kolektibong idyomang Hebreo na literal na “mga anak ni Israel.” Inilagay sa talababa ang literal na anyo.
- source_word: כָּל הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sambayanang sama-samang nagkakatipon. Pinananatili ng “buong kapulungan” ang kolektibong diwa at ang saklaw ng כָּל.
- source_word: הֹר הָהָר
  choice: Bundok Hor
  rationale: Gumaganap ang pariralang Hebreo bilang pangalan ng pook. Ang “Bundok Hor” ang malinaw at karaniwang ayos sa Tagalog, sa halip na ang mekanikal na “Hor na bundok.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang gitling na em dash upang ipakitang ang “ang buong kapulungan” ay paglilinaw sa “mga Israelita,” gaya ng appositional na ayos sa Hebreo. Itinama rin ang pagkakatapat ng mga talababa sa mga pariralang aktuwal nilang ipinaliliwanag.
