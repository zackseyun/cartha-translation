  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱד֔וֹם לֹ֥א תַעֲבֹ֖ר בִּ֑/י פֶּן בַּ/חֶ֖רֶב אֵצֵ֥א לִ/קְרָאתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/018.yaml
  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ng Edom, “Hindi ka daraan sa lupain ko[a]. Kung hindi, lalabas akong may tabak upang salubungin ka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa akin.” Nagsasalita rito ang Edom bilang isang bansa o teritoryo, kaya ang tinutukoy ay pagdaan sa lupain ng Edom.
    reason: lexical_alternative
  - marker: b
    text: Ang “salubungin ka” ay maaari ring isaling “harapin ka.” Sa kontekstong ito, ang paglabas upang sumalubong ay isang armadong pagkontra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱדוֹם
  choice: sinabi sa kanya ng Edom
  rationale: Likas na ayos sa makabagong Tagalog para sa karaniwang pananalaysay na may tuwirang pananalita; pinananatili ang Edom bilang bansang nagsasalita.
- source_word: לֹא תַעֲבֹר
  choice: Hindi ka daraan
  rationale: Ipinahahayag nito ang mariing pagtanggi at pagbabawal nang hindi gumagamit ng lipas o labis na pormal na pananalita.
- source_word: בִּי
  choice: sa lupain ko
  rationale: Literal na “sa akin,” ngunit ang Edom ay nagsasalita bilang bansa o teritoryo; nililinaw ng salin ang likas na kahulugang pagdaan sa lupain nito habang itinatala sa talababa ang personipikasyon.
- source_word: פֶּן
  choice: Kung hindi
  rationale: Sa kontekstong ito, nagpapakilala ito ng bantang kahihinatnan; ang “Kung hindi” ay natural at malinaw sa kasalukuyang Tagalog.
- source_word: בַּחֶרֶב
  choice: may tabak
  rationale: Ipinahihiwatig ng Hebreong parirala ang armadong pagkilos; pinananatili ang kongkretong larawan ng tabak.
- source_word: אֵצֵא לִקְרָאתֶךָ
  choice: lalabas akong ... upang salubungin ka
  rationale: Pinananatili ang mga larawang “lalabas” at “sasalubong,” habang malinaw na ipinakikita ng konteksto at ng tabak na isang armadong pagharap ang tinutukoy.
