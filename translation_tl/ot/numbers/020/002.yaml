  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: tl
  text: Walang tubig para sa kapulungan[a], at nagtipon sila laban kina Moises at Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagtitipon” o “pamayanan.” Ang Hebreong עֵדָה ay tumutukoy sa nagkakatipong bayan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: Walang
  rationale: Likas na Filipino na pagpapahayag ng Hebreong pang-iral na may pagtanggi; hindi na dinagdagan ng tahasang panandang temporal.
- source_word: מַיִם
  choice: tubig
  rationale: Karaniwang pangngalang di-mabilang sa Filipino para sa Hebreong pangngalang tumutukoy sa sangkap.
- source_word: לָ/עֵדָה
  choice: para sa kapulungan
  rationale: Pinananatili ng “kapulungan” ang kolektibong diwa ng עֵדָה bilang nagkakatipong bayan ng Israel; inilalahad sa talababa ang mga likas na alternatibo.
- source_word: וַ/יִּקָּהֲלוּ
  choice: nagtipon sila
  rationale: Tuwirang ipinapahayag ang sama-samang pagkilos na tinutukoy ng pandiwang קהל.
- source_word: עַל מֹשֶׁה וְ/עַֽל אַהֲרֹן
  choice: laban kina Moises at Aaron
  rationale: Sa konteksto ng pagtatalo, ang עַל ay may diwang pagsalungat. Ang “kina” ay likas na Filipino para sa dalawang personal na pangalan at saklaw nito ang kapwa pinuno.
