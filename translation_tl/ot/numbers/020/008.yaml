  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: tl
  text: “Kunin mo ang tungkod[a], at tipunin mo ang kapulungan kasama ang kapatid mong si Aaron. Magsalita kayo sa bato sa harap ng kanilang mga mata, at magbibigay ito ng tubig. Magpalabas ka ng tubig mula sa bato para sa kanila, at painumin mo ang kapulungan at ang kanilang mga alagang hayop.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pamalo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: ang tungkod
  rationale: Karaniwang tumutukoy ang מַטֶּה sa tungkod o pamalo. Ang “tungkod” ay natural sa modernong Filipino at angkop sa bagay na ipinakukuha kay Moises.
- source_word: הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan ng Israel. Pinananatili ng “kapulungan” ang pormal at panlahatang diwa; idinagdag ang “buong” upang maging natural ang pagtukoy sa komunidad, hindi upang palawakin ang saklaw.
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: Magsalita kayo sa bato
  rationale: Ang pandiwa ay maramihan at tumutukoy kina Moises at Aaron. Ang “magsalita sa bato” ay tuwirang salin ng karaniwang idyomang דִבֵּר אֶל.
- source_word: לְעֵינֵיהֶם
  choice: sa harap ng kanilang mga mata
  rationale: Pinananatili ang tahasang larawan ng Hebreo at ang diin sa hayag na pagkakita ng kapulungan.
- source_word: וְנָתַן מֵימָיו
  choice: at ibibigay nito ang tubig nito
  rationale: Ang bato ang isahang simuno ng pandiwa. Pinananatili rin ang hulaping paari sa “tubig nito,” kahit bahagyang di-pangkaraniwan, upang huwag alisin ang anyo ng pinagmulan.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: Magpalabas ka ng tubig mula sa bato para sa kanila
  rationale: Ang Hiphil ng יצא ay sanhiang “magpalabas.” Ang isahang anyo ay nakatuon kay Moises, kaya “ka” ang ginamit.
- source_word: וְהִשְׁקִיתָ
  choice: at painumin mo
  rationale: Ang Hiphil ng שקה ay “magpainom” o “bigyan ng maiinom.” Ang “painumin” ay maikli, natural, at nagpapanatili sa sanhiang diwa.
- source_word: בְּעִירָם
  choice: kanilang mga alagang hayop
  rationale: Tumutukoy ang בְּעִיר sa mga domestikadong hayop o hayop na pantrabaho. Mas malinaw at mas malawak sa modernong Filipino ang “mga alagang hayop” kaysa “mga baka” o “mga hayop na pantrabaho.”
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: ninyo ng kapatid mong si Aaron
  rationale: Natural na isinasama sa Filipino ang pariralang ito sa utos na tipunin ang kapulungan. Malinaw pa ring kinikilala sina Moises at Aaron bilang kapwa gagawa.
theological_decisions:
- issue: Hayag na katangian ng utos tungkol sa himala
  choice: Isinalin ang לְעֵינֵיהֶם bilang “sa harap ng kanilang mga mata,” upang idiin na magsasalita sila sa batong nakikita ng kapulungan.
  alternative: “sa harap nila” o “habang nakatingin sila”
  rationale: Tahasan ang idyomang Hebreo at mahalaga ang pampublikong pagsaksi sa daloy ng salaysay. Hindi dapat pahinain ang diin nito.
- issue: Sino ang inuutusang magsalita at sino ang magpapalabas ng tubig
  choice: Maramihan ang “Magsalita kayo,” ngunit isahan ang “Magpalabas ka” at “painumin mo.”
  alternative: Gawing maramihan ang lahat ng utos para sa mas makinis na Filipino
  rationale: 'Pinananatili nito ang tunay na pagbabago ng bilang sa Hebreo: sina Moises at Aaron ang magsasalita, samantalang si Moises ang tuwirang kinakausap sa kasunod na mga pandiwang isahan.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pagbabago mula isahan tungong maramihan at pabalik sa isahan, gayundin ang konkretong “sa harap ng kanilang mga mata.” Ang “kapulungan” ay mas pormal kaysa “pangkat” ngunit angkop sa pambibliyang pamayanan.
