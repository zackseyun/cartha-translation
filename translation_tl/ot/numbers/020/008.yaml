revisions:
- from: “Kunin mo ang tungkod[a], at tipunin ninyo ng kapatid mong si Aaron ang buong kapulungan. Magsalita kayo sa bato sa harap ng kanilang mga mata, at ibibigay nito ang tubig nito. Magpalabas ka ng tubig mula sa bato para sa kanila, at painumin mo ang kapulungan at ang kanilang mga alagang hayop.”
  to: “Kunin mo ang tungkod[a], at tipunin mo ang kapulungan kasama ang kapatid mong si Aaron. Magsalita kayo sa bato sa harap ng kanilang mga mata, at magbibigay ito ng tubig. Magpalabas ka ng tubig mula sa bato para sa kanila, at painumin mo ang kapulungan at ang kanilang mga alagang hayop.”
  rationale: Inayos ang utos na tipunin ang kapulungan upang maging gramatikal sa Filipino at upang mapanatili ang isahang anyo ng Hebreo, habang malinaw na kasama si Aaron. Inalis ang di-kailangang “buong.” Pinakinis ang pananalita tungkol sa tubig ng bato nang hindi binabago ang ipinahihiwatig ng talata. Napanatili ang maramihang “Magsalita kayo” at ang mga kasunod na isahang utos kay Moises.
