  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: tl
  text: Si Aaron ay titipunin sa kanyang bayan[a], sapagkat hindi siya makapapasok sa lupaing ibinigay ko sa mga anak ni Israel, dahil naghimagsik kayo laban sa aking utos[b] sa tubig ng Meriba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isang idyoma ito tungkol sa kamatayan; literal, “titipunin sa kanyang bayan.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “laban sa aking bibig,” na tumutukoy sa utos na sinabi ko.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף ... אֶל עַמָּיו
  choice: Isasama ... sa kanyang bayan
  rationale: Pinananatili ang marangal na Hebreong idyoma tungkol sa kamatayan at pakikipisan sa sariling bayan, sa halip na payak na sabihing “mamamatay.” Mas natural sa Tagalog ang “isasama” kaysa literal na “titipunin” sa konstruksiyong ito.
- source_word: כִּי לֹא יָבֹא אֶל הָאָרֶץ
  choice: sapagkat hindi siya makapapasok sa lupain
  rationale: Malinaw at likas sa Tagalog ang “makapapasok”; ang “lupain” ay nagpapanatili sa konteksto ng lupaing ipinagkaloob nang hindi idinaragdag ang salitang “pangako.”
- source_word: אֲשֶׁר נָתַתִּי
  choice: ibinigay ko
  rationale: Ang Hebreong perfect ay inilalahad bilang tiyak at ganap na pagkakaloob ng Diyos; natural itong ipahayag sa Tagalog sa aspektong perpektibo.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Direktang pinananatili ang pormulang Hebreo at ang larawang pampamilya; sa konteksto, tumutukoy ito sa sambayanan ng Israel.
- source_word: מְרִיתֶם
  choice: sinuway ninyo
  rationale: Ipinahahayag nito ang hayagang paglaban sa awtoridad. Ang “sinuway” ay natural at mabigat sa modernong Tagalog nang hindi nagpapasok ng dagdag na paliwanag.
- source_word: אֶת־פִּי
  choice: ang aking utos
  rationale: Literal itong “ang aking bibig,” ngunit idyomatikong tumutukoy sa utos na sinalita ng Diyos. Ang salin ay nililinaw sa teksto, habang inilalagay sa talababa ang literal na larawan.
- source_word: לְמֵי מְרִיבָה
  choice: sa tubig ng Meriba
  rationale: Pinananatili ang pangalan ng pook/pangyayari at ang literal na “tubig,” sa natural na anyong Tagalog.
theological_decisions:
- issue: Idyoma ng kamatayan na “titipunin sa kanyang bayan”
  choice: Panatilihin ang idyoma bilang “isasama sa kanyang bayan”
  alternative: “Mamamatay si Aaron”
  rationale: May higit na literaryo at teolohikal na bigat ang pananalita kaysa isang tuwirang pahayag lamang ng kamatayan. Hindi nito tinutukoy nang detalyado ang kalagayan pagkatapos mamatay, kaya hindi iyon ipinapaliwanag sa salin.
- issue: Ang saklaw ng “mga anak ni Israel”
  choice: Panatilihin ang pormulang “mga anak ni Israel”
  alternative: “mga Israelita” o “sambayanang Israel”
  rationale: Pinananatili nito ang anyo at larawang pampamilya ng Hebreo, habang hindi ipinapalagay na mga lalaking anak lamang ang tinutukoy.
- issue: Pananagutan sa paghihimagsik
  choice: Panatilihin ang pangmaramihang “sinuway ninyo”
  alternative: Tukuyin nang tahasan sina Moises at Aaron
  rationale: Pangmaramihan ang pandiwa sa Hebreo ngunit hindi pinapangalanan sa talata ang dalawang kausap. Ang salin ay hindi nagdaragdag ng mga pangalan, kaya napapanatili ang anyo at agarang konteksto ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang solemneng idyoma ng kamatayan, ang pormulang “mga anak ni Israel,” at ang pangmaramihang pananagutan. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
