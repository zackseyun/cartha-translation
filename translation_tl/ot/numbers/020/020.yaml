  - marker: a
    text: Maaari ring “upang harapin ang Israel.” Neutral ang salitang Hebreo para sa pakikipagtagpo, ngunit malinaw na mapanlaban ang konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kasama ang mabigat na bayan,” isang idyoma para sa malaki o kahanga-hangang pangkat ng mga tao.
