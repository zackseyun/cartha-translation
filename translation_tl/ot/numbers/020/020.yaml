  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: tl
  text: Ngunit sinabi niya, “Hindi kayo maaaring dumaan.” At lumabas ang Edom upang salubungin ang Israel[a], kasama ang isang malaking pangkat ng mga tao[b] at may malakas na puwersa[c].
