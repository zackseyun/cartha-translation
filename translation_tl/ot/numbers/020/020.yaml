lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay, habang ipinahihiwatig ng “Ngunit” ang pagsalungat ng sagot ng Edom sa kahilingan ng Israel. Pinananatiling di-tiyak ang tahasang paksa gaya sa Hebreo.
- source_word: לֹא תַעֲבֹר
  choice: Hindi kayo maaaring dumaan
  rationale: Ang imperfect na may negasyon ay nagpapahayag dito ng mariing pagtanggi o pagbabawal. Ang maramihang “kayo” ay natural sa Filipino dahil ang kausap ay ang Israel bilang isang bayan.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: At lumabas ang Edom
  rationale: Tuwirang sinasalamin ng “lumabas” ang יצא nang hindi pa dinaragdagan ang pandiwang Hebreo ng tahasang ideya ng pagmamartsa.
- source_word: לִקְרָאתוֹ
  choice: upang salubungin sila
  rationale: Ang לקראת ay karaniwang nangangahulugang pagsalubong o pakikipagtagpo. Pinananatili ng “salubungin” ang batayang kahulugan, samantalang nililinaw sa talababa na mapanlaban ang konteksto. Ginawang maramihan ang panghalip ayon sa natural na Filipino para sa kolektibong Israel.
- source_word: בְּעַם כָּבֵד
  choice: kasama ang napakaraming tauhan
  rationale: Literal itong “may mabigat na bayan,” isang idyoma para sa malaki o kahanga-hangang pangkat ng mga tao. Ang “tauhan” ay angkop sa kontekstong militar ngunit hindi kasing-tiyak ng “hukbo.”
- source_word: וּבְיָד חֲזָקָה
  choice: at taglay ang malakas na kapangyarihan
  rationale: Ang literal na “sa pamamagitan ng isang malakas na kamay” ay idyoma ng lakas o puwersa. Inihahatid ng pangunahing teksto ang kahulugan sa natural na Filipino, habang itinatala sa talababa ang larawan ng Hebreo.
