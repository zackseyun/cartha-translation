translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “kayo/sila” para sa kolektibong Israel, bagaman isahan ang anyong Hebreo. Iniwasan ang sobrang teknikal na “puwersa” sa pariralang בעם כבד at pinanatili sa mga talababa ang literal na mga idyomang Hebreo.
