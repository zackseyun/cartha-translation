revisions:
- from: Ngunit sinabi niya, “Hindi kayo maaaring dumaan.” At lumabas ang Edom upang salubungin sila[a], kasama ang napakaraming tauhan[b] at taglay ang malakas na kapangyarihan[c].
  to: Ngunit sinabi niya, “Hindi kayo maaaring dumaan.” At lumabas ang Edom upang salubungin ang Israel[a], kasama ang isang malaking pangkat ng mga tao[b] at may malakas na puwersa[c].
  rationale: Pinalitan ang maramihang panghalip ng “ang Israel” upang ipakita ang isahang panghalip ng Hebreo habang nananatiling malinaw ang kolektibong tinutukoy. Pinahusay ang dalawang parirala ukol sa lakas upang maging natural sa modernong Filipino at upang huwag gawing mas tiyak na hukbo ang pangkat na tinutukoy ng Hebreo. Napanatili ang mga lexical na alternatibo at ang mga anchor ng talababa.
