base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: tl
  text: At inalis ni Moises ang mga kasuotan ni Aaron at isinuot ang mga ito kay Eleazar, na anak ni Aaron[a]. Namatay si Aaron doon, sa tuktok ng bundok[b]. Pagkatapos, bumaba mula sa bundok sina Moises at Eleazar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang opisyal na mga kasuotang pansaserdote ni Aaron ay inilipat kay Eleazar bilang bahagi ng paghalili sa tungkulin na inilalarawan sa nakapaligid na konteksto.
    reason: cultural_note
  - marker: b
    text: O “sa taluktok ng bundok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: hinubaran
  rationale: Ang Hifil ng פשט ay tumutukoy sa pag-aalis ng kasuotan mula sa isang tao. Ang “hinubaran” ay tuwiran at natural sa Filipino.
- source_word: בְּגָדָיו
  choice: mga kasuotan nito
  rationale: Karaniwang salita ang בגד para sa damit o kasuotan. Pinananatili ng “mga kasuotan” ang marangal na tono nang hindi idinaragdag sa pangunahing teksto ang “pamp pari,” na ipinahihiwatig lamang ng konteksto.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: isinuot ang mga iyon kay Eleazar na anak nito
  rationale: Ang Hifil ng לבש ay nangangahulugang damitan ang isang tao. Malinaw na ipinapakita ng salin na ang mga kasuotang inalis kay Aaron ay isinuot kay Eleazar, na anak ni Aaron.
- source_word: וַיָּמָת
  choice: namatay
  rationale: Payak at tuwirang katumbas ito ng מות at umiiwas sa eupemismo.
- source_word: שָׁם
  choice: doon
  rationale: Tahasan nitong pinananatili ang pagtukoy ng Hebreo sa lugar ng kamatayan ni Aaron.
- source_word: בְּרֹאשׁ הָהָר
  choice: sa tuktok ng bundok
  rationale: Ang רֹאשׁ, literal na “ulo,” ay idiomatikong tumutukoy sa tuktok o taluktok. Natural at malinaw sa Filipino ang “sa tuktok ng bundok.”
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Ang ירד ay nangangahulugang bumaba. Ang “bumaba” ay neutral at natural sa pagsasalaysay.
- source_word: מִן הָהָר
  choice: mula sa bundok
  rationale: Tuwiran at neutral na katumbas ito ng pariralang Hebreo.
theological_decisions:
- issue: Uri at kahulugan ng mga kasuotan ni Aaron na inilipat kay Eleazar
  choice: “mga kasuotan” sa pangunahing teksto, na may paliwanag sa talababa tungkol sa tungkuling pansaserdote
  alternative: “mga kasuotang pansaserdote” o “mga kasuotan ng punong pari” sa pangunahing teksto
  rationale: Bagaman nililinaw ng nakapaligid na konteksto na opisyal na mga kasuotang pansaserdote ang tinutukoy at tanda ito ng paghalili ni Eleazar, karaniwang pangngalan para sa kasuotan ang ginamit sa mismong talata. Kaya hindi ito labis na tinutukoy sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nito” upang maging malinaw na si Eleazar ay anak ni Aaron, hindi ni Moises. Pinanatili ang dalawang pangungusap sa bahaging tungkol sa pagkamatay ni Aaron upang maging natural ang daloy sa Filipino nang hindi binabago ang pagkakasunod-sunod ng mga pangyayari.
