  naturalness: Nauunawaan ang draft, ngunit ang paulit-ulit na “nito” sa magkasunod na sugnay ay maaaring pansamantalang lumabo ang tinutukoy, lalo na sa pariralang “anak nito.” Mas malinaw at natural na tahasang pangalanan si Aaron sa mga ugnayang ito. Ang “inalis ... ang mga kasuotan ni Aaron” ay likas na Filipino at sapat na naghahatid ng pagpapahubad nang hindi nagkakaroon ng di-sinasadyang konotasyon ng “hinubaran.”
  terminology: Ang “mga kasuotan” ay wastong katumbas ng בְּגָדָיו at hindi nagdaragdag ng “pansaserdote” sa pangunahing teksto. Ang paliwanag sa talababa ay angkop na naglalagay ng kontekstuwal na kahalagahang pansaserdote. Ang “tuktok ng bundok” at “bumaba mula sa bundok” ay tumpak at natural.
