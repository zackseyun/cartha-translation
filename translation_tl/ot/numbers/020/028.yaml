revisions:
- from: Kaya hinubaran ni Moises si Aaron ng mga kasuotan nito at isinuot ang mga iyon kay Eleazar na anak nito[a]. Namatay si Aaron doon sa tuktok ng bundok[b]. Pagkatapos, bumaba mula sa bundok sina Moises at Eleazar.
  to: At inalis ni Moises ang mga kasuotan ni Aaron at isinuot ang mga ito kay Eleazar, na anak ni Aaron[a]. Namatay si Aaron doon, sa tuktok ng bundok[b]. Pagkatapos, bumaba mula sa bundok sina Moises at Eleazar.
  rationale: Pinalitan ang “Kaya” ng “At” upang hindi magdagdag ng ugnayang sanhi-bunga. Ginawang tahasan ang pagtukoy kay Aaron sa “mga kasuotan ni Aaron” at “anak ni Aaron” upang alisin ang anumang kalabuan ng panghalip. Pinanatili ang kahulugan, pagkakasunod-sunod, mga pangalan, at mga angkla ng talababa.
