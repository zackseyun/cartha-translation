base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: tl
  text: Alisin mo kay Aaron ang kanyang mga kasuotan at ipasuot mo ang mga iyon kay Eleazar na kanyang anak.[a] Pagkatapos, si Aaron ay titipunin[b] at mamamatay roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto, ito ay mga kasuotang pangpari. Ang Hebreo ay nagsasabi lamang na “kanyang mga kasuotan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “titipunin” ay isang idyomang Hebreo para sa kamatayan; sa ibang mga talata ay lumilitaw ang mas buong pananalitang “titipunin sa kanyang bayan.”
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט
  choice: Hubarin mo
  rationale: Ang Hiphil imperative ng פשט ay nagpapautos na alisin ang suot ng isang tao. Natural sa Filipino ang pandiwang 'hubarin' na may tuwirang layong si Aaron.
- source_word: בְּגָדָיו
  choice: kanyang mga kasuotan
  rationale: Ang בגד ay damit o kasuotan. Ang 'mga kasuotan' ay angkop sa marangal at pormal na konteksto, ngunit hindi tahasang dinaragdagan ng 'pamp pari' ang pangunahing teksto.
- source_word: וְהִלְבַּשְׁתָּם
  choice: isuot mo ang mga iyon
  rationale: Ipinahihiwatig ng Hiphil at ng hulaping panghalip na ipasuot kay Eleazar ang mga kasuotang inalis kay Aaron. Pinananatili ng 'ang mga iyon' ang pagtukoy sa mga kasuotan.
- source_word: אֶת אֶלְעָזָר בְּנוֹ
  choice: kay Eleazar na kanyang anak
  rationale: Malinaw at natural na ipinahahayag ang tumatanggap ng mga kasuotan at ang kaugnayan niya kay Aaron.
- source_word: יֵאָסֵף
  choice: titipunin
  rationale: Pinananatili ang Niphal na idyoma sa konteksto ng kamatayan. Hindi idinaragdag sa pangunahing teksto ang 'sa kanyang bayan/mga ninuno' sapagkat wala ang pariralang iyon sa Hebreo ng talatang ito.
- source_word: וּמֵת שָׁם
  choice: at mamamatay roon
  rationale: Natural na ipinagpapatuloy ng hinaharap na anyo sa Filipino ang bunga ng naunang pahayag, habang tapat na isinasalin ang שָׁם bilang 'roon'.
theological_decisions:
- issue: Idyoma ng kamatayan sa יֵאָסֵף
  choice: Panatilihin bilang 'titipunin' at ipaliwanag sa talababa.
  alternative: titipunin sa kanyang bayan; kukunin; mamamatay
  rationale: Ang Hebreo ay gumagamit ng kinaugaliang idyoma ng kamatayan ngunit hindi isinasaad sa talatang ito ang karaniwang karugtong na 'sa kanyang bayan.' Ang pagpapanatili sa maikling idyoma ay nag-iingat sa anyo at pahiwatig ng pinagmulan nang hindi nagdaragdag ng mga salitang mula sa ibang talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kasuotan' sa halip na mas impormal na 'damit' dahil seremonyal ang konteksto. Inilagay ang lahat ng marker sa pangunahing teksto at iniayon ang pagkakasunod ng [a] at [b] sa mga tinutukoy nitong salita.
