  source_fidelity: Tumpak na naipapasa ng draft ang utos na alisin ang mga kasuotan ni Aaron, ilipat ang mga ito kay Eleazar na kanyang anak, at ang kasunod na pahayag na si Aaron ay ‘titipunin’ at mamamatay roon. Wasto ring hindi idinaragdag sa pangunahing teksto ang ‘sa kanyang bayan,’ na wala sa Hebreo ng talatang ito.
  naturalness: Kailangan ng maliit ngunit mahalagang pag-aayos sa pandiwang ‘isuot mo.’ Sa modernong Filipino, ang ‘isuot’ ay karaniwang ‘wear/put on’ ng mismong magsusuot; ang causative na utos na ipasuot ang mga kasuotan kay Eleazar ay mas malinaw na ‘ipasuot mo.’ Mas idiomatiko rin ang ‘Alisin mo kay Aaron ang ...’ kaysa ‘Hubarin mo si Aaron ng ...,’ habang pinananatili ang diwang hubaran siya ng mga kasuotan.
  terminology: Ang ‘mga kasuotan’ ay angkop sa pormal at seremonyal na rehistro. Ang ‘titipunin’ ay nagpapanatili sa Hebreong idyoma nang hindi ipinapasok ang hindi nakasaad na ‘sa kanyang bayan.’ Ang talababa ay sapat na nagpapaliwanag sa idyoma.
