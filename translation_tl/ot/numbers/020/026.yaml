  to: Alisin mo kay Aaron ang kanyang mga kasuotan at ipasuot mo ang mga iyon kay Eleazar na kanyang anak.[a] Pagkatapos, si Aaron ay titipunin[b] at mamamatay roon.
  rationale: 'Inayos ang dalawang pandiwa upang maging natural at tiyak ang Filipino: ang mga kasuotan ay inaalis kay Aaron at ipinapasuot kay Eleazar. Pinanatili ang maikling idyoma na ‘titipunin,’ ang panghalip na tumutukoy kay Aaron, ang pang-abay na ‘roon,’ at ang mga talababa. Walang idinagdag na ‘sa kanyang bayan’ sa pangunahing teksto.'
