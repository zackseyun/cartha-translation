source:
  edition: WLC
  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: tl
  text: Dumaing kami kay Yahweh, at dininig niya ang aming tinig. Nagsugo siya ng isang anghel[a] at inilabas niya kami mula sa Ehipto. At narito, nasa Kadesh kami, isang lungsod sa dulo ng iyong hangganan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sugo.” Ang salitang Hebreo ay maaaring tumukoy sa isang sugo na tao o sa isang makalangit na sugo, bagaman sa kontekstong ito ay nauunawaan ito ng marami bilang anghel na isinugo ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: Dumaing kami
  rationale: Ipinahihiwatig ng צעק ang matindi at apurahang paghingi ng tulong. Likas sa modernong Tagalog ang “dumaing” at pinananatili nito ang bigat ng kanilang kalagayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: dininig niya ang aming tinig
  rationale: Pinananatili ang tahasang larawan ng Hebreo na “narinig ang aming tinig.” Ang “dininig” ay angkop sa isang pakiusap na tinugon at likas sa marangal na rehistro.
- source_word: מַלְאָךְ
  choice: isang anghel
  rationale: Sa konteksto ng pagliligtas mula sa Ehipto, natural ang “anghel” bilang sugo ng Diyos. Gayunman, mas malawak ang salitang Hebreo at maaari ring mangahulugang “sugo,” kaya inilagay ang alternatibo sa talababa.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: inilabas niya kami mula sa Ehipto
  rationale: Tuwirang ipinahahayag ng causative na anyo ng יצא na siya ang naglabas sa kanila; malinaw at natural ito sa Tagalog.
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Ang “narito” ay likas at marangal na panandang tumatawag ng pansin sa kasalukuyang kalagayan, nang hindi gumagamit ng kolokyal na ekspresyon.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: isang lungsod sa gilid ng iyong nasasakupan
  rationale: Ipinapanatili ng “sa gilid” ang panlokasyong diwa ng קצה, samantalang natural na ipinahahayag ng “nasasakupan” ang teritoryong saklaw ng גְבוּל sa kontekstong ito.
theological_decisions:
- issue: Pagkakakilanlan ng מַלְאָךְ sa salaysay ng paglabas mula sa Ehipto
  choice: Isinalin bilang “isang anghel” nang hindi tinutukoy nang higit pa ang pagkakakilanlan nito.
  alternative: “isang sugo,” na maaaring tumukoy sa taong sugo o makalangit na sugo
  rationale: Hindi tiyakang kinikilala ng talata kung sino ang sugo. Pinananatili ng pangunahing salin ang karaniwang pagkaunawa sa konteksto, habang iniiwasang magdagdag ng mas tiyak na doktrinang wala sa teksto sa pamamagitan ng pagbanggit sa mas malawak na kahulugan sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pangalang Yahweh, ang larawang “aming tinig,” at ang panawag-pansing “narito,” habang iniwasan ang labis na makaluma o denominasyonal na pananalita.
