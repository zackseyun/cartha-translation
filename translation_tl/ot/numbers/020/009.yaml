base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: tl
  text: At kinuha ni Moises ang tungkod mula sa harap ni Yahweh, gaya ng iniutos ni Yahweh sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Ang Qal wayyiqtol ng לקח ay payak na kilos sa salaysay, kaya natural ang “kinuha.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakagawiang anyo ng pangalang מֹשֶׁה sa makabagong Tagalog.
- source_word: הַמַּטֶּה
  choice: ang tungkod
  rationale: Sa konteksto, ang מַטֶּה ay isang pisikal na tungkod; malinaw at natural ang “tungkod” sa Tagalog.
- source_word: מִלִּפְנֵי
  choice: mula sa harap ni
  rationale: Pinananatili nito ang konkretong pansang-ayon at panlunan na diwa ng Hebreong “mula sa harap ng,” nang hindi dinaragdagan ng paliwanag na wala sa teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר
  choice: ayon mismo sa
  rationale: Likas na ipinahahayag sa Tagalog ang eksaktong pagsunod o pagtutugma sa naunang utos.
- source_word: צִוָּהוּ
  choice: iniutos niya sa kanya
  rationale: Tinutukoy ng hulaping bagay si Moises. Sapat na sa Tagalog ang aspektong perpektibo upang ipahiwatig na nauna ang utos; hindi kailangang piliting tularan ang past perfect ng Ingles.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Tinutukoy ng paksa sa צִוָּהוּ
  choice: “niya” na tumutukoy kay Yahweh
  alternative: Ulitin ang “Yahweh” bilang paksa
  rationale: Panlalaki at isahan ang paksa at bagay sa anyong Hebreo. Pinananatili ng mga panghalip ang anyo at bahagyang reperensiyal na tensiyon ng orihinal, bagaman malinaw sa konteksto na si Yahweh ang nag-utos kay Moises.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Kaya” bilang likas na pang-ugnay sa nagpapatuloy na salaysay. Walang talababa dahil ang “tungkod” ang normal na salin sa Tagalog at hindi kailangan ang alternatibong “pamalo,” na maaaring magpahiwatig ng gamit sa pananakit.
