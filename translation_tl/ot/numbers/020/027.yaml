  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַֽ/יַּעֲלוּ֙ אֶל הֹ֣ר הָ/הָ֔ר לְ/עֵינֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: tl
  text: Ginawa ni Moises ang iniutos ni Yahweh, at umakyat sila sa Bundok Hor sa harap ng buong kapulungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ מֹשֶׁה כַּאֲשֶׁר צִוָּה יְהוָה
  choice: Ginawa ni Moises ang iniutos ni Yahweh
  rationale: Likas sa modernong Tagalog ang pariralang ito at malinaw nitong ipinahahayag ang pagsunod ni Moises sa makapangyarihang utos ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעֲלוּ
  choice: umakyat sila
  rationale: Tuwirang ipinahahayag ng עלה ang pag-akyat patungo sa bundok; natural at malinaw ang ayos na Tagalog.
- source_word: אֶל הֹר הָהָר
  choice: sa Bundok Hor
  rationale: Ito ang natural na anyo ng pangalan ng bundok sa Tagalog; ang אֶל ay naipapaloob sa pandiwang 'umakyat' at sa pang-ukol na 'sa.'
- source_word: לְעֵינֵי כָּל הָעֵדָה
  choice: sa harap ng buong kapulungan
  rationale: Idyomatikong Tagalog ito para sa literal na 'sa mga mata ng buong kapulungan' at pinananatili ang diwang hayagan at nakikita ng lahat.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng 'Yahweh' ang pagkakaiba nito sa isang karaniwang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang 'kapulungan' para sa עֵדָה upang tukuyin ang nagkakatipong pamayanan ng Israel nang hindi ito nililimitahan sa makabagong kahulugang pansimbahan ng 'kongregasyon.'
