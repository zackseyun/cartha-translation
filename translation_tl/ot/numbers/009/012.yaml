base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: tl
  text: Huwag silang magtira ng anuman mula rito hanggang umaga, at huwag nilang baliin ang kahit isang buto nito[a]. Isagawa nila ito ayon sa buong tuntunin ng Paskuwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal: “at huwag silang bumali ng buto nito.”'
    reason: lexical_alternative
  - marker: b
    text: Ang tuntuning huwag baliin ang anumang buto ay inuulit ang tagubilin tungkol sa Paskuwa sa Exodo 12:46.
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: magtitira ng anuman mula rito hanggang umaga
  rationale: Ipinahahayag ng Hiphil ng שׁאר ang pagpapaiwan o pagtatabi ng nalabi. Likas sa Filipino ang “magtitira,” at inilalantad ng “anuman mula rito” ang partitive na diwa ng מִמֶּנּוּ sa ilalim ng pagbabawal.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: at huwag silang babali ng kahit isang buto nito
  rationale: Ang עֶצֶם ay pang-isahang ginagamit nang distributibo. Natural at malinaw sa Filipino ang “kahit isang buto nito,” samantalang pinananatili ang ganap na pagbabawal.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: ang buong tuntunin tungkol sa Paskuwa
  rationale: Ang חֻקָּה ay itinakdang tuntunin o kautusan; sa pang-isahang anyo kasama ng כָּל, tinutukoy nito ang kabuuan ng tuntuning namamahala sa Paskuwa. Mas natural ang “buong tuntunin” kaysa literal na “lahat ng tuntunin” na may pang-isahang diwa.
- source_word: הַפֶּסַח
  choice: Paskuwa
  rationale: Maaaring tumukoy ang termino sa ritwal, handog, o pagdiriwang. Pinananatili ng “Paskuwa” ang lawak ng salitang Hebreo nang hindi nililimitahan ito sa kordero o handog lamang.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: sundin nila
  rationale: Sa konteksto ng itinakdang ritwal, ang עשה ay may diwang isagawa o tuparin. Ang “sundin nila” ay malinaw na inuugnay sa buong tuntunin at mas natural kaysa “gawin nila ito.”
theological_decisions:
- issue: Posibleng intertekstuwal na kabuluhan ng hindi pagbali ng buto
  choice: Isinalin bilang tuwirang tuntunin ng Paskuwa, nang walang idinagdag na kristolohikal na pagpapakahulugan sa pangunahing teksto.
  alternative: Gumamit ng pananalitang sadyang magtatampok sa kalaunang pag-uugnay nito sa Bagong Tipan.
  rationale: Sa agarang konteksto, tagubilin ito para sa pagdiriwang ng Paskuwa. Dapat mapanatili ng salin ang sinasabi ng Hebreo at ipaubaya sa talababa o kaugnay na mga teksto ang kalaunang intertekstuwal na ugnayan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “Paskuwa,” isang kinikilalang katawagang biblikal, at ang pautos na “huwag” at “sundin” upang maipakita ang normatibong lakas ng Hebreo nang hindi nagiging labis na makaluma.
