source:
  edition: WLC
  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: tl
  text: Tuwing umaangat ang ulap mula sa ibabaw ng tolda[a], saka humahayo ang mga anak ni Israel[b]; at sa lugar kung saan humihimpil ang ulap, doon nagkakampo ang mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tabernakulo.” Ang “tolda” rito ay tumutukoy sa tolda ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: 'O, “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: Tuwing umaangat
  rationale: Ipinapahayag ng parirala ang paulit-ulit na kalagayan o panahon. Likas sa modernong Tagalog ang “tuwing,” at pinananatili ng “umaangat” ang kilos ng ulap nang hindi tahasang nagdaragdag ng gumagawa ng kilos.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Karaniwang tuwirang katumbas ng עָנָן sa konteksto ng paggabay sa ilang.
- source_word: מֵעַל הָאֹהֶל
  choice: mula sa ibabaw ng tolda
  rationale: Pinananatili ang espasyal na diwa ng מֵעַל at ang literal na kahulugan ng אֹהֶל bilang “tolda”; nililinaw sa talababa na tolda ng tabernakulo ang tinutukoy.
- source_word: וְאַחֲרֵי כֵן
  choice: saka
  rationale: 'Malinaw at likas na ipinahihiwatig ng “saka” ang pagkakasunod-sunod: matapos umangat ang ulap, humahayo ang Israel.'
- source_word: יִסְעוּ
  choice: humahayo
  rationale: Ipinapakita ng aspektong pangkaugalian ang paulit-ulit na pag-alis upang maglakbay. Ang “humahayo” ay marangal ngunit nauunawaan sa kasalukuyang Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal na pananalitang pampamilya ng Hebreo; ang mas maikling “mga Israelita” ay ibinibigay bilang alternatibo sa talababa.
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: at sa lugar kung saan
  rationale: Pinananatili ang tahasang kayariang panlunan ng Hebreo sa natural na Tagalog.
- source_word: יִשְׁכָּן
  choice: humihimpil
  rationale: Ang שׁכן ay may diwang manahan o mamalagi. Para sa ulap na tumitigil sa isang lugar, ang “humihimpil” ay kongkreto at natural nang hindi ginagawang labis na antropomorpiko ang larawan.
- source_word: שָׁם ... שָׁם
  choice: sa lugar kung saan ... doon
  rationale: Naipapakita ng katumbas na kayarian ang mariing pagtutugma ng lugar sa Hebreong pag-uulit ng שָׁם.
- source_word: יַחֲנוּ
  choice: nagkakampo
  rationale: Ipinahihiwatig ng anyong ito ang paulit-ulit o nakaugaliang pagkakampo, na angkop sa kontekstong nagbibigay ng pamamaraan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “humahayo” upang ipahayag ang pag-alis sa paglalakbay at ang mga aspektong “humihimpil” at “nagkakampo” upang maipakita ang paulit-ulit na pamamaraang inilalarawan ng talata.
