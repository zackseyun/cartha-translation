base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: tl
  text: Sinabi sa kanya ng mga lalaking iyon, “Marumi kami dahil sa bangkay ng isang tao.[a] Bakit kami pipigilang maghandog ng handog kay Yahweh sa takdang panahon nito sa gitna ng mga anak ni Israel?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “marumi dahil sa nefesh ng isang tao.” Sa gamit na ito, idyoma ito para sa ritwal na karumihang dulot ng bangkay ng tao.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Bakit kami ipagkakait sa pagdadala ng handog kay Yahweh ... sa gitna ng mga anak ni Israel?”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: At sinabi sa kanya ng mga lalaking iyon
  rationale: Likas na salaysay sa Tagalog na pinananatili ang pagtukoy sa partikular na mga lalaking nabanggit sa konteksto.
- source_word: אֲנַחְנוּ טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: Kami ay marumi dahil sa bangkay ng isang tao
  rationale: Ang טְמֵאִים ay ritwal na karumihan, at ang idyomang לְנֶפֶשׁ אָדָם ay tumutukoy sa karumihang dulot ng bangkay ng tao, hindi sa abstraktong 'kaluluwa.'
- source_word: לָמָּה נִגָּרַע
  choice: Bakit kami hahadlangan
  rationale: Ipinahahayag ng Niphal ng גרע ang pagkakait o pagpigil sa pakikibahagi; natural at malinaw sa Tagalog ang 'hahadlangan.'
- source_word: לְבִלְתִּי הַקְרִב אֶת קָרְבַּן
  choice: sa paghahandog ng handog
  rationale: Sa kontekstong sakripisyal, ang הקריב ay paghahandog o pagdadala ng handog. Pinananatili ng parirala ang kilos at ang bagay na inihahandog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang Yahweh ang Tetragrammaton sa tekstong Hebreo.
- source_word: בְּמֹעֲדוֹ
  choice: sa takdang panahon nito
  rationale: Ang מוֹעֵד ay ang itinakda o iniresetang panahon para sa handog.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: kasama ng mga anak ni Israel
  rationale: Pinananatili ang Hebreong pormulang 'mga anak ni Israel' habang natural na ipinahahayag ang pakikibahagi nila sa gitna ng sambayanan.
theological_decisions:
- issue: Paglalarawan sa karumihang dulot ng לְנֶפֶשׁ אָדָם
  choice: marumi dahil sa bangkay ng isang tao
  alternative: marumi dahil sa isang patay na tao
  rationale: Mas tahasang ipinakikita ng 'bangkay' na ritwal na karumihan mula sa katawan ng namatay ang tinutukoy, nang hindi ipinapalagay sa pangunahing teksto ang eksaktong paraan ng pagkakadikit.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreong teksto; pinananatili ito bilang Yahweh sa halip na palitan ng isang titulo.
- issue: Saklaw ng protesta sa לָמָּה נִגָּרַע
  choice: Bakit kami hahadlangan
  alternative: Bakit kami aalisan ng karapatang makibahagi
  rationale: Pinananatili ng 'hahadlangan' ang pasibong diwa ng pagkakait nang hindi nagdaragdag ng tahasang konsepto ng legal na karapatan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'marumi' sa ritwal na kahulugan, 'bangkay' para luminaw ang Hebreong idyoma, at 'mga anak ni Israel' upang mapanatili ang anyo ng pangkat-etnikong katawagan sa pinagmulan.
