  text: וְ/יַעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת הַ/פָּ֖סַח בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/002.yaml
  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: tl
  text: At ipagdiwang ng mga anak ni Israel ang Paskuwa sa takdang panahon nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita”; ayon sa tradisyon, “mga anak ng Israel.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: At ipagdiwang
  rationale: Ang עשה ay literal na “gawin,” ngunit kapag ang layon ay פֶּסַח, tumutukoy ito sa pagdiriwang o pagtupad sa Paskuwa. Ang anyong may waw at imperfect ay may puwersang pautos sa konteksto; likas sa Tagalog ang “ipagdiwang” bilang tuwirang utos.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na pampamilyang pahayag na “mga anak ni Israel,” sa halip na gawing pang-etnikong katawagang “mga Israelita.”
- source_word: הַפָּסַח
  choice: ang Paskuwa
  rationale: Maaaring tumukoy ang פֶּסַח sa handog o sa pagdiriwang sa kabuuan. Ang “Paskuwa” ay tuwiran at sapat na malawak upang hindi paliitin ang kahulugan.
- source_word: בְּמוֹעֲדוֹ
  choice: sa takdang panahon nito
  rationale: Ipinahahayag ng מוֹעֵד ang itinakdang panahon, at tinutukoy ng hulaping panghalip ang Paskuwa; kaya pinananatili ng “nito” ang tahasang kaugnayang iyon.
