  source_fidelity: Tumpak na naipapahayag ng “At ipagdiwang ... ang Paskuwa” ang waw at ang pautos na puwersa ng וְיַעֲשׂוּ sa idyomang may פֶּסַח. Ang “mga anak ni Israel” ay pinananatili ang pampamilyang pahayag ng בְנֵי יִשְׂרָאֵל, at ang “sa takdang panahon nito” ay wastong nagsasaad ng בְּמוֹעֲדוֹ nang hindi pinasisikip ang saklaw nito sa handog lamang o sa pista lamang.
