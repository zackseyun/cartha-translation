translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ipagdiwang” bilang likas na katumbas ng idyomatikong “gawin ang Paskuwa,” habang pinanatili ang pormal na pampamilyang katawagang “mga anak ni Israel.”
