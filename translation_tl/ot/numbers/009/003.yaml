base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: tl
  text: Sa ikalabing-apat na araw ng buwang ito, sa pagitan ng dalawang dapithapon[a], ipagdiwang ninyo ito sa takdang panahon nito; ipagdiwang ninyo ito ayon sa lahat ng tuntunin nito at sa lahat ng alituntunin nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagitan ng dalawang dapithapon,” isang tradisyonal na parirala para sa panahon sa palibot ng takipsilim.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: Sa ikalabing-apat na araw ng buwang ito
  rationale: Natural na pahayag ng tiyak na petsa sa modernong Tagalog, habang pinananatili ang kalendaryong detalye ng Hebreo.
- source_word: בֵּין הָעַרְבַּיִם
  choice: sa pagitan ng mga dapithapon
  rationale: Pinananatili ang natatangi at bahagyang malabong idyomang Hebreo sa halip na itakda nang tiyak ang oras bilang simpleng ‘takipsilim’; nililinaw ng talababa ang karaniwang kahulugan nito.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: ipagdiwang ninyo ito
  rationale: Kapag Paskuwa ang tinutukoy, ang עשה ay nangangahulugang ganapin o ipagdiwang ang kapistahan, hindi lamang ‘gawin.’ Ang parehong salin sa dalawang paglitaw ay nagpapanatili sa pag-uulit ng Hebreo.
- source_word: בְּמוֹעֲדוֹ
  choice: sa takdang panahon nito
  rationale: Ipinahahayag ang nakapirming oras o okasyong itinakda para sa ritwal.
- source_word: כְּכָל חֻקֹּתָיו
  choice: ayon sa lahat ng tuntunin nito
  rationale: Ang חֻקּוֹת ay mga itinakdang regulasyon; ang ‘mga tuntunin’ ay pormal ngunit madaling maunawaan.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: at sa lahat ng mga kautusan nito
  rationale: Ang מִשְׁפָּטִים dito ay mga umiiral na tagubiling legal o panritwal. Ginamit ang ‘mga kautusan’ upang maipakitang may pagkakaiba ito sa חֻקּוֹת nang hindi nagiging teknikal o malabo.
