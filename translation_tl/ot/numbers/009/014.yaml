base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: tl
  text: At kung may dayuhang naninirahan sa piling ninyo[a] na magdiriwang ng Paskuwa[b] para kay Yahweh, dapat niya itong gawin ayon sa tuntunin ng Paskuwa at sa itinakdang pamamaraan nito; ganoon niya ito gagawin. Isang tuntunin lamang ang iiral para sa inyo, para sa dayuhang naninirahan, at para sa ipinanganak sa lupain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na ger ay tumutukoy sa dayuhang naninirahan sa gitna ng Israel, hindi lamang sa isang nagdaraang manlalakbay. Maaari ring isalin na “residenteng dayuhan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “gawin ang Paskuwa,” isang idyomang nangangahulugang isagawa o ipagdiwang ang Paskuwa.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “likas na taga-lupain” o “taong ipinanganak sa lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili ang ugnayan sa naunang batas at ang kondisyonal na diwa ng parirala.
- source_word: יָגוּר ... גֵּר
  choice: may dayuhang naninirahan sa piling ninyo
  rationale: Ang גֵּר ay isang dayuhang namamalagi bilang residente sa gitna ng Israel, hindi isang nagdaraan lamang. Likas sa makabagong Tagalog ang pariralang ito at malinaw ang legal at panlipunang kalagayan.
- source_word: וְעָשָׂה פֶסַח
  choice: magdiriwang siya ng Paskuwa
  rationale: Ang literal na ‘gawin ang Paskuwa’ ay idyomang tumutukoy sa pagganap o pagdiriwang ng ritwal ng Paskuwa; ‘magdiriwang’ ang malinaw at likas na katumbas sa Tagalog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng לְ ang pag-aalay o pagtatalaga ng pagdiriwang kay Yahweh, at tuwirang pinananatili ang banal na pangalang יהוה.
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: ayon sa tuntunin ng Paskuwa
  rationale: Ang חֻקָּה ay itinakdang batas o tuntunin; ang ‘tuntunin’ ay malinaw at may sapat na legal-ritwal na bigat.
- source_word: וּכְמִשְׁפָּטוֹ
  choice: at sa takdang pamamaraan nito
  rationale: Sa kontekstong ito, ang מִשְׁפָּט ay tumutukoy sa wastong tuntunin o paraan ng pagsasagawa. Inihihiwalay ito sa חֻקָּה nang hindi itinatanggi ang pagsasanib ng kanilang kahulugan.
- source_word: כֵּן יַעֲשֶׂה
  choice: gayon niya iyon gagawin
  rationale: Pinananatili ang mariing utos na isagawa ang Paskuwa sa paraang itinakda, pati ang pag-uulit na nasa Hebreo.
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: Isang tuntunin lamang ang iiral
  rationale: Malinaw na ipinapahayag ang iisang umiiral at nagbubuklod na tuntunin para sa mga pangkat na binanggit.
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: at para sa katutubo ng lupain
  rationale: Ang אֶזְרָח ay taong likas o katutubong kabilang sa lupain, bilang kabaligtaran ng residenteng dayuhan; iniiwasan ng salin ang makabagong kategoryang pampolitika na ‘mamamayan.’
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Saklaw ng iisang tuntunin para sa Israelita at residenteng dayuhan
  choice: Iisang tuntunin sa pagdiriwang ng Paskuwa ang iiral sa mga binanggit na pangkat
  alternative: Pahintulot lamang sa dayuhan nang walang diin sa pagkakapantay ng tuntunin
  rationale: Hayagang sinasabi ng talata na ‘isang tuntunin’ ang para sa kausap, sa residenteng dayuhan, at sa katutubo ng lupain. Nililimitahan ng salin ang pahayag sa agarang konteksto ng Paskuwa at hindi ito pinalalawak sa lahat ng usaping legal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘dayuhang naninirahan’ upang maiwasan ang maling impresyon na isa lamang siyang bisita, at ‘takdang pamamaraan’ upang likas na maihiwalay ang מִשְׁפָּט sa naunang ‘tuntunin.’
