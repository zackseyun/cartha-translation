revisions:
- from: At kung may dayuhang naninirahan sa piling ninyo[a] at magdiriwang siya ng Paskuwa para kay Yahweh, gawin niya iyon ayon sa tuntunin ng Paskuwa at sa takdang pamamaraan nito[b]; gayon niya iyon gagawin. Isang tuntunin lamang ang iiral para sa inyo—para sa dayuhang naninirahan at para sa katutubo ng lupain[c].
  to: At kung may dayuhang naninirahan sa piling ninyo[a] na magdiriwang ng Paskuwa[b] para kay Yahweh, dapat niya itong gawin ayon sa tuntunin ng Paskuwa at sa itinakdang pamamaraan nito; ganoon niya ito gagawin. Isang tuntunin lamang ang iiral para sa inyo, para sa dayuhang naninirahan, at para sa ipinanganak sa lupain[c].
  rationale: Inilipat ang footnote b sa “Paskuwa,” ang wastong pinanggagalingan nitong Hebreong idyoma. Pinakinis ang pangwakas na sugnay upang maging natural sa modernong Tagalog at ginawang mas tiyak ang katumbas ng אֶזְרָח bilang “ipinanganak sa lupain.” Nananatili ang legal-ritwal na diin at ang saklaw ng iisang tuntunin sa agarang konteksto ng Paskuwa.
