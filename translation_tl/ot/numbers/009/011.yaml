  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: tl
  text: Sa ikalawang buwan, sa ikalabing-apat na araw, sa takipsilim[a], ipagdiriwang nila iyon. Kakainin nila iyon kasama ng tinapay na walang pampaalsa at mapapait na halaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “sa pagitan ng mga gabi,” isang idyoma para sa oras sa palibot ng paglubog ng araw o takipsilim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: Sa ikalawang buwan
  rationale: Karaniwang nangangahulugang “buwan” ang חֹדֶשׁ sa kontekstong pangkalendaryo; malinaw at natural sa Tagalog ang pariralang ito.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: sa ikalabing-apat na araw
  rationale: Ang literal na kardinal na anyo sa Hebreo ay ginagamit bilang petsa; ang ordinal na “ikalabing-apat na araw” ang likas na katumbas sa Tagalog.
- source_word: בֵּין הָעַרְבַּיִם
  choice: sa takipsilim
  rationale: Ang idyomang Hebreo ay tumutukoy sa oras sa palibot ng paglubog ng araw. Malinaw sa modernong Tagalog ang “takipsilim,” habang pinananatili sa talababa ang literal na anyo.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: ipagdiriwang nila iyon
  rationale: Sa konteksto ng Paskuwa, ang עשה ay nangangahulugang isagawa o ipagdiwang ang ritwal, hindi lamang “gawin.” Ang “ipagdiriwang” ay natural at angkop sa kapistahan.
- source_word: עַל מַצּוֹת
  choice: kasama ng tinapay na walang pampaalsa
  rationale: Sa konteksto ng pagkain, ang עַל ay nagpapahiwatig ng pagsasama. Ang מַצּוֹת ay tinapay na walang pampaalsa.
- source_word: וּמְרֹרִים
  choice: at mapapait na halaman
  rationale: Tumutukoy ang pangmaramihang pangngalan sa mapapait na halamang kinakain sa Paskuwa. Iniiwasan ng saling ito ang malabong “mapapait na bagay.”
- source_word: יֹאכְלֻהוּ
  choice: Kakainin nila iyon
  rationale: Tuwirang pandiwang Qal na may panlalaking isahang hulapi; tumutukoy ang “iyon” sa Paskuwa, malamang sa handog o pagkaing pampaskuwa.
theological_decisions:
- issue: Ang tinutukoy ng mga panghalip sa יַעֲשׂוּ אֹתוֹ at יֹאכְלֻהוּ
  choice: iyon
  alternative: ang Paskuwa / ang kordero
  rationale: Hindi tahasang pinangalanan sa talata ang antecedent. Pinananatili ng panghalip na “iyon” ang lawak at bahagyang kalabuan ng Hebreo sa halip na tukuyin nang sapilitan kung kapistahan, handog, o kordero ang tinutukoy.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal-ritwal. Ginamit ang “ipagdiriwang” para sa pagsasagawa ng Paskuwa at “tinapay na walang pampaalsa” bilang madaling maunawaang katumbas ng מַצּוֹת.
