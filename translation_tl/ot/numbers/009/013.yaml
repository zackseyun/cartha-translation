base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: tl
  text: Ngunit ang lalaking malinis at wala sa paglalakbay, ngunit hindi tumupad sa Paskuwa—ang taong iyon ay puputulin mula sa kanyang bayan[a], sapagkat hindi niya inihandog ang handog ni Yahweh sa takdang panahon nito. Papasanin ng lalaking iyon ang kanyang kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “puputulin mula sa kanyang bayan” ay isang Hebreong idyoma para sa mabigat na hatol sa loob ng tipan. Hindi tinutukoy rito kung paano ito isasagawa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “papasanin niya ang kanyang pagkakasala” o “pananagutan niya ang kanyang kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: malinis
  rationale: Sa kontekstong ritwal, tumutukoy ito sa kalinisan ayon sa kautusan, hindi pangunahing sa moral na kadalisayan.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: hindi naglalakbay
  rationale: Likas na Filipino para sa pagiging wala sa paglalakbay, na siyang eksepsiyong binanggit sa konteksto.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: pero hindi ipinagdiwang ang Paskuwa
  rationale: Ipinahahayag ang sadyang hindi pagsasagawa ng pagdiriwang nang hindi nililimitahan ang Paskuwa sa hain lamang.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ang taong iyon ay aalisin
  rationale: Ang נֶפֶשׁ ay ang mismong tao rito. Pinananatili ng ‘aalisin’ ang mabigat ngunit hindi tiyak na hatol ng Hebreong idyoma.
- source_word: מֵעַמֶּיהָ
  choice: sa kanyang bayan
  rationale: Tumutukoy sa sambayanan o bayang kinabibilangan ng lalaking tinatalakay.
- source_word: קָרְבַּן יְהוָה
  choice: ang handog kay Yahweh
  rationale: Malinaw sa Filipino na ito ang handog na iniuukol at inihaharap kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּמֹעֲדוֹ
  choice: sa takdang panahon nito
  rationale: Ipinahahayag ang itinakda at nararapat na panahon para sa handog at pagdiriwang.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: papasanin ... ang kanyang kasalanan
  rationale: Pinananatili ang Hebreong talinghaga ng pagpasan, kasama ang diwa ng pananagutan sa kasalanan at mga bunga nito.
- source_word: הָאִישׁ הַהוּא
  choice: ang lalaking iyon
  rationale: Pinananatili ang tahasang panlalaking isahan ng Hebreo.
theological_decisions:
- issue: Kahulugan ng parusang ‘aalisin sa kanyang bayan’
  choice: Panatilihin ang di-tiyak na idyoma ng mabigat na pag-aalis mula sa bayan.
  alternative: Tukuyin ito bilang simpleng pagtitiwalag, pagpatay, kawalan ng salinlahi, o tuwirang hatol ng Diyos.
  rationale: Hindi espesipikong sinasabi ng talata kung paano isinasagawa ang hatol; ang pagpapanatili sa idyoma ay umiiwas sa pagpasok ng isang pinagtatalunang pagpapakahulugan.
- issue: Kahulugan ng ‘papasanin ang kanyang kasalanan’
  choice: Panatilihin ang ‘kasalanan’ at ang larawan ng pagpasan.
  alternative: ‘Pananagutan niya ang kanyang pagkakasala.’
  rationale: Maaaring saklawin ng parirala ang pagkakasala, pananagutan, at mga kahihinatnan nito; hindi ito dapat paliitin nang walang pahiwatig sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Paskuwa” bilang kinikilalang katawagan sa pagdiriwang, “Yahweh” para sa banal na pangalan, at pinanatili ang mga idyomang may tunay na legal at teolohikal na kalabuan.
