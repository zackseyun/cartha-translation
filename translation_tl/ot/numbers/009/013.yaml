revisions:
- from: Ngunit ang lalaking malinis at hindi naglalakbay, pero hindi ipinagdiwang ang Paskuwa—ang taong iyon ay aalisin sa kanyang bayan[a], sapagkat hindi niya inihandog ang handog kay Yahweh sa takdang panahon nito. Papasanin ng lalaking iyon ang kanyang kasalanan.[b]
  to: Ngunit ang lalaking malinis at wala sa paglalakbay, ngunit hindi tumupad sa Paskuwa—ang taong iyon ay puputulin mula sa kanyang bayan[a], sapagkat hindi niya inihandog ang handog ni Yahweh sa takdang panahon nito. Papasanin ng lalaking iyon ang kanyang kasalanan.[b]
  rationale: Inayos ang pagtukoy sa pagiging wala sa paglalakbay, ang konstruksiyong “handog ni Yahweh,” at ang idyoma ng pagkaputol mula sa bayan. Pinanatili ang kalabuan ng saklaw at paraan ng hatol at ang larawang “pagpasan” ng kasalanan.
