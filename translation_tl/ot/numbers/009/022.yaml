    rationale: Ang “nananatiling nagkakampo” ay maaaring magmukhang patuloy na pagtatayo ng kampo. Ang “nanatiling nakahimpil” ay mas malinaw para sa pananatili sa kampo at tumutugma sa konteksto ng יַחֲנוּ.
