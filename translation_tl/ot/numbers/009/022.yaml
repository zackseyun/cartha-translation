source:
  edition: WLC
  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: tl
  text: Maging dalawang araw, isang buwan, o mas mahabang panahon[a], habang matagal na nananatili ang ulap sa ibabaw ng tabernakulo, na nakalulukob dito, nananatiling nakahimpil ang mga Israelita at hindi umaalis; ngunit kapag umaangat ito, umaalis sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maraming araw.” Literal na “mga araw” ang Hebreo, na sa kontekstong ito ay malamang na tumutukoy sa mas mahabang panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: Dalawang araw man, isang buwan, o mas matagal
  rationale: Ginamit ang “man ... o ...” upang likas na maipahayag sa Tagalog ang sunod-sunod na mga posibilidad na tinutukoy ng inuulit na אוֹ.
- source_word: יֹמַיִם
  choice: dalawang araw
  rationale: Ang anyong dual ay tahasang tumutukoy sa dalawang araw.
- source_word: חֹדֶשׁ
  choice: isang buwan
  rationale: Ang “isang buwan” ang natural na di-tiyak na gamit sa talaan ng mga haba ng panahon.
- source_word: יָמִים
  choice: mas matagal
  rationale: Pagkatapos ng “dalawang araw” at “isang buwan,” ang literal na “mga araw” ay tumutukoy sa higit na mahabang panahon; pinananatili sa talababa ang mas literal na alternatibo.
- source_word: בְּהַאֲרִיךְ הֶעָנָן
  choice: habang nananatili ang ulap
  rationale: Ipinahahayag nito ang pagpapatuloy o pagtatagal ng ulap sa isang natural na paraang Tagalog.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang nakaugaliang katawagan sa portable na santuwaryo ng Israel at malinaw sa kontekstong biblikal.
- source_word: לִשְׁכֹּן עָלָיו
  choice: namamalagi roon
  rationale: Ipinapanatili ng “namamalagi” ang diwa ng nananatiling presensya ng ulap sa ibabaw ng tabernakulo, habang iniiwasan ang mabigat na pag-uulit.
- source_word: יַחֲנוּ בְנֵי יִשְׂרָאֵל
  choice: nananatiling nagkakampo ang mga Israelita
  rationale: Ang imperfect ay naglalarawan ng nakagawiang kilos; ang “mga Israelita” ay natural at tumpak na katawagan sa bayan sa modernong Tagalog.
- source_word: וְלֹא יִסָּעוּ
  choice: at hindi umaalis
  rationale: Sa konteksto ng paglalakbay, ang נסע ay pag-alis mula sa kampo; malinaw at natural ang “umaalis.”
- source_word: וּבְהֵעָלֹתוֹ יִסָּעוּ
  choice: Ngunit kapag pumapaitaas ang ulap, umaalis sila
  rationale: Ipinahahayag ng “pumapaitaas” ang pag-angat ng ulap bilang hudyat ng pag-alis, nang hindi ipinapalagay kung sino ang tahasang gumagawa ng pag-angat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tabernakulo” bilang pamilyar na terminong biblikal at “mga Israelita” sa halip na literal ngunit di-likas na “mga anak na lalaki ng Israel.”
