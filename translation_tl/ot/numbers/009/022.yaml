  verdict: revise
  source_fidelity: 'Ang pangkalahatang diwa ay tapat sa Hebreo: ang iba’t ibang tagal ng pananatili ng ulap ang nagtatakda kung mananatili ang Israel sa kampo o aalis. Gayunman, ang “nanatiling nagkakampo” ay hindi gaanong malinaw na katumbas ng יַחֲנוּ, at ang talababa para sa יָמִים ay maling nakaangkla sa “dalawang araw.”'
  naturalness: Marangal at modernong Tagalog ang rehistro, ngunit mas natural ang “nanatiling nakahimpil” para sa pananatili sa kampo. Ang “mas mahabang panahon” ay mas kumpletong Tagalog kaysa sa malabong “mas matagal” sa talaan ng mga tagal.
  terminology: Ang “tabernakulo” at “mga Israelita” ay angkop at pare-pareho. Ang “nakalulukob dito” ay malinaw na nagpapahayag na ang ulap ay nasa ibabaw ng tabernakulo nang hindi pinipilit ang paulit-ulit na “namamalagi.”
