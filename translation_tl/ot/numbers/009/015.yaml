  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: tl
  text: Nang araw na itinayo ang tabernakulo, tinakpan ng ulap ang tabernakulo, ang tolda ng patotoo[a]; at pagsapit ng gabi, naroon ito sa ibabaw ng tabernakulo na parang anyo ng apoy hanggang umaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “tolda ng pagsaksi.” Maaaring isalin sa alinmang paraan ang pariralang Hebreo; pinanatili rito ang “patotoo” bilang mas nakaugaliang terminong kultiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם
  choice: Nang araw na
  rationale: Likas na panandang temporal sa modernong Tagalog; hindi nagdaragdag ng tahasang “ngayon,” na wala sa Hebreo.
- source_word: הָקִים
  choice: itinayo
  rationale: Ipinahahayag nang natural ang pagtatayo at paglalagay sa ayos ng tabernakulo.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ito ang kinikilalang terminong Tagalog para sa naililipat na banal na tirahan sa ilang.
- source_word: כִּסָּה
  choice: tinakpan
  rationale: Tuwirang inilalarawan ng pandiwa ang pagtakip ng ulap sa tabernakulo.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Pinananatili ang tiyak na anyo ng pangngalan, na tumutukoy sa kilalang ulap sa salaysay.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: ang tolda ng patotoo
  rationale: Itinuturing itong pariralang nagpapakilala pa sa tabernakulo; ang “patotoo” ay ang nakaugaliang salin sa kontekstong pangkulto.
- source_word: וּבָעֶרֶב
  choice: at pagsapit ng gabi
  rationale: Natural na paglipat sa Tagalog mula araw tungo sa gabi habang pinananatili ang pang-ugnay.
- source_word: יִהְיֶה
  choice: naroon ito
  rationale: Ipinahahayag ang nagpapatuloy o nakaugaliang kalagayan ng ulap sa gabi nang hindi ipinapakitang bagong pangyayari lamang ito.
- source_word: עַל הַמִּשְׁכָּן
  choice: sa ibabaw ng tabernakulo
  rationale: Malinaw na inilalarawan ang kinalalagyan ng ulap.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: na waring apoy
  rationale: Pinananatili ang paghahambing sa anyo o tanawin at hindi sinasabing ang ulap ay literal na apoy.
- source_word: עַד בֹּקֶר
  choice: hanggang umaga
  rationale: Likas at tumpak na pahayag ng hangganang temporal.
theological_decisions:
- issue: Ugnayan ng “tabernakulo” at “tolda ng patotoo”
  choice: Ang ikalawang parirala ay paliwanag na tumutukoy rin sa tabernakulo.
  alternative: Maaaring unawain ang לְ bilang may bahagyang lokatibo o direksiyonal na diwa.
  rationale: Pinakanatural sa sintaks at konteksto na ang “tolda ng patotoo” ay karagdagang pagkakakilanlan ng tabernakulo, hindi hiwalay na bagay.
- issue: Ugnayan ng ulap at apoy
  choice: Ang ulap ay nagmumukhang apoy sa gabi.
  alternative: Maaaring gawing mas tuwiran na “parang apoy,” ngunit maaaring mapalabo nito ang diin sa nakikitang anyo.
  rationale: Ang כְּמַרְאֵה ay naghahayag ng pagkakahawig sa nakikita, hindi ng literal na pagkakakilanlan; kaya ginamit ang “waring.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang terminong “tabernakulo” dahil matatag na ito sa bokabularyong biblikal, samantalang ginawang likas ang daloy sa pamamagitan ng “pagsapit ng gabi” at “waring apoy.”
