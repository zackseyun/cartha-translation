  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: tl
  text: 'Ganito iyon palagi: tinatakpan iyon ng ulap, at sa gabi naman ay may anyong apoy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “may tila apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Ganito iyon
  rationale: Ipinakikilala nito ang buod ng paulit-ulit na kalagayang inilarawan sa naunang talata; natural sa makabagong Tagalog at nananatili ang pahiwatig na “sa ganitong paraan.”
- source_word: יִהְיֶה תָמִיד
  choice: palagi
  rationale: Ang imperfect na pandiwa kasama ng תָמִיד ay naglalarawan ng patuloy o nakaugaliang kalagayan sa nakaraan. Sapat na ipinahahayag ng “palagi” ang ganitong duratibo at paulit-ulit na diwa nang hindi nagiging mabigat ang pangungusap.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tiyak na tumutukoy sa kilalang ulap na kaugnay ng tirahan sa konteksto.
- source_word: יְכַסֶּנּוּ
  choice: tinatakpan iyon
  rationale: Ang pandiwa ay nangangahulugang takpan o kublihan. Ang “iyon” ay likas na tumutukoy sa tirahan na binanggit sa konteksto, samantalang ang aspektong di-ganap ng “tinatakpan” ay angkop sa nakaugaliang kilos.
- source_word: וּמַרְאֵה אֵשׁ
  choice: at ... may anyong apoy
  rationale: Pinananatili ng “anyong apoy” ang pagkakaiba ng nakikitang anyo at ng tahasang pagsasabing literal na apoy iyon; natural din itong pakinggan sa Tagalog.
- source_word: לָיְלָה
  choice: sa gabi
  rationale: Karaniwan at malinaw na temporal na parirala sa makabagong Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng panlalaking isahang hulapi sa יְכַסֶּנּוּ
  choice: “iyon,” na tumutukoy sa tirahan
  alternative: “siya,” na maaaring magmukhang tumutukoy sa isang tao
  rationale: Bagaman maaaring katawanin ng hulapi ang “siya” o “iyon” ayon sa kasarian sa Hebreo, ang agarang konteksto ay ang tirahan na tinatakpan ng ulap. Iniiwasan ng “iyon” ang di-kinakailangang pagsasatao.
- issue: Kung literal na apoy o mukhang apoy ang nakikita sa gabi
  choice: “may anyong apoy”
  alternative: “may tila apoy”
  rationale: Ang מַרְאֶה ay tumutukoy sa nakikitang anyo o hitsura. Hindi nilulutas ng salin kung literal na apoy iyon o isang anyong kahawig ng apoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naman” upang likas na ihambing ang tanawin sa gabi sa ulap na nakikita sa araw, nang hindi nagdaragdag ng bagong teolohikal na paliwanag.
