  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh kay Moises sa ilang ng Sinai[a], sa ikalawang taon mula nang lumabas sila sa lupain ng Ehipto, sa unang buwan, at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “disyerto ng Sinai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Tuwirang ipinapahayag ang banal na pagsasalita at pinananatili ang marangal na himig; hindi kailangang isalin nang hiwalay ang waw bilang “At” sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל kasunod ng pandiwang “magsalita” ay tumutukoy sa kinakausap.
- source_word: בְּמִדְבַּר סִינַי
  choice: sa ilang ng Sinai
  rationale: Ang “ilang” ay likas at marangal na salin ng מִדְבָּר at pinananatili ang ugnayan nito sa Sinai.
- source_word: בַּשָּׁנָה הַשֵּׁנִית לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: ng ikalawang taon matapos silang lumabas sa lupain ng Ehipto
  rationale: Nililinaw ang panahong ibinibilang mula sa paglabas nila, habang pinananatili ang “lupain” para sa אֶרֶץ.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: nang unang buwan
  rationale: Tuwiran at natural na panandang temporal sa Tagalog.
- source_word: לֵאמֹר
  choice: 'Sinabi niya:'
  rationale: Likas na paraan sa Tagalog upang ipakilala ang mismong nilalaman ng pagsasalita sa susunod na talata, nang hindi gumagamit ng alanganing “na sinasabi.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinagsama ang dalawang pariralang temporal upang maging natural—“nang unang buwan ng ikalawang taon”—nang hindi binabago ang kronolohikal na impormasyon. Ginamit ang “Sinabi niya:” bilang natural na panimula sa susunod na pahayag.
