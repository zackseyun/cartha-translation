  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: tl
  text: Kapag nananatili ang ulap sa ibabaw ng tabernakulo nang maraming araw, ginagampanan ng mga anak ni Israel[a] ang tungkuling iniatas ni Yahweh[b], at hindi sila naglalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “sinusunod ang utos ni Yahweh” o “tinutupad ang pananagutan kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ
  choice: Kapag nananatili ... nang maraming araw
  rationale: Ang ב na sinusundan ng infinitive construct ng אָרַךְ ay nagpapakilala ng kalagayang temporal at nagsasaad ng matagal na pananatili. Ipinahihiwatig ng konteksto ang paulit-ulit na tuntunin, kaya ang “kapag nananatili” ay angkop sa makabagong Tagalog.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tuwirang tumutukoy sa nakikitang ulap na gumagabay sa Israel sa ilang.
- source_word: עַל הַמִּשְׁכָּן
  choice: sa ibabaw ng tabernakulo
  rationale: Ang עַל ay nagsasaad ng kinalalagyan ng ulap, at ang “tabernakulo” ay karaniwang katawagan sa santuwaryong tolda sa salaysay ng paglalakbay sa ilang.
- source_word: יָמִים רַבִּים
  choice: nang maraming araw
  rationale: Pinananatili nito ang kongkretong pananalita ng Hebreo tungkol sa mahabang tagal.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת יְהוָה
  choice: ginagampanan ... ang tungkuling iniatas ni Yahweh
  rationale: Sa idyomang ito, ang שׁמר ay tumutukoy sa maingat na pagtupad, at ang מִשְׁמֶרֶת ay isang pananagutan o tungkuling dapat tuparin. Natural sa Tagalog ang “ginagampanan ang tungkuling iniatas” habang pinananatili ang diwa ng obligasyon.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit itong sumusunod sa anyong pampamilya at panlalaki ng Hebreong parirala; inilalagay sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang tipan sa halip na palitan ng isang titulo.
- source_word: וְלֹא יִסָּעוּ
  choice: at hindi sila umaalis upang maglakbay
  rationale: Sa konteksto ng paglalakbay sa ilang, ang נסע ay nangangahulugang umalis mula sa kampo at magpatuloy sa paglalakbay. Nililinaw ito ng natural na pariralang Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalan sa halip na gawing titulo.
- issue: Paglalahad sa בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang pampamilyang larawan at anyong panlalaki ng Hebreo, habang ibinibigay sa talababa ang natural na katawagang pambansa.
- issue: Kahulugan ng מִשְׁמֶרֶת יְהוָה
  choice: ang tungkuling iniatas ni Yahweh
  alternative: ang utos ni Yahweh
  rationale: Mas malawak sa isang tiyak na utos ang מִשְׁמֶרֶת at maaaring tumukoy sa pananagutan o tungkuling ipinagkatiwala. Hindi ito pinapakitid sa “utos” sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “tabernakulo” bilang pamilyar na katawagang biblikal at ang “mga anak ni Israel” upang katawanin ang anyo ng Hebreo; ipinaliwanag sa mga talababa ang mas idyomatikong mga alternatibo.
