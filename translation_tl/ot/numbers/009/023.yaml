id: NUM.9.23
reference: Numbers 9:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: tl
  text: Sa utos ni Yahweh sila nagkampo, at sa utos ni Yahweh sila umalis. Tinupad nila ang tungkuling iniatas ni Yahweh, ayon sa utos ni Yahweh sa pamamagitan ni Moises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sa kamay ni Moises,” isang idyomang nangangahulugang “sa pamamagitan ni Moises.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: sa utos ni
  rationale: Ang idyoma ay literal na “ayon sa bibig ng” ngunit dito ay tumutukoy sa makapangyarihang tagubilin o utos. Ang “sa utos ni” ay natural sa modernong Tagalog at pinananatili ang pag-uulit sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: יַחֲנוּ
  choice: nagkampo
  rationale: Malinaw at pangkaraniwang modernong salin para sa pananatili o pagtatayo ng kampo.
- source_word: יִסָּעוּ
  choice: umalis
  rationale: Sa konteksto ng paglalakbay sa ilang, ipinahihiwatig ng pandiwa ang pag-alis mula sa kampo. Ang “umalis” ay natural at hindi nagdaragdag ng paraang hindi tahasang sinabi.
- source_word: מִשְׁמֶרֶת
  choice: tungkuling iniatas
  rationale: Ipinahihiwatig ng salita ang isang pananagutan o atas na dapat tuparin at ingatan. Pinananatili ng parirala ang diwa ng ipinagkatiwalang obligasyon.
- source_word: שָׁמָרוּ
  choice: tinupad
  rationale: Kapag kasama ng מִשְׁמֶרֶת, ang pandiwa ay nangangahulugang pagsunod o maingat na pagtupad sa iniatas na pananagutan.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang literal na “sa kamay ni Moises” ay idyoma ng ahensiya o pamamagitan. Ang salin ay malinaw sa karaniwang mambabasa habang inilalagay sa talababa ang konkretong larawan ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginagamit ng talata ang Tetragrammaton mismo; pinananatili ng “Yahweh” ang natatanging pangalang ipinahayag ng Diyos nang hindi ito ginagawang pangkalahatang titulo.
- issue: Ugnayan ng utos ni Yahweh at ng pamamagitan ni Moises
  choice: ayon sa utos ni Yahweh sa pamamagitan ni Moises
  alternative: ayon sa utos ni Yahweh, na ibinigay ni Moises
  rationale: Pinananatili ng napiling ayos ang Diyos bilang pinagmulan ng utos at si Moises bilang tagapamagitan, nang hindi pinalalawak ang teksto o ipinapakahulugang si Moises ang pinagmulan nito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang tatlong ulit na pagtukoy sa utos ni Yahweh, gaya ng diin ng Hebreo; iniwasan ang labis na makalumang pananalita.
