base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: tl
  text: At kung minsan, nananatili ang ulap mula sa gabi hanggang umaga; kapag itinaas ang ulap sa umaga[a], umaalis sila. O kung nananatili ito nang isang araw at isang gabi, kapag itinaas ang ulap, umaalis sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapag umaangat ang ulap.” Ang pandiwang Hebreo ay maaari ring ipahayag sa ganitong mas aktibong paraan; ang pag-angat ng ulap ang hudyat upang umalis ang Israel sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: At kung minsan
  rationale: Likas na panandang Filipino para sa isang paminsan-minsang kalagayan sa loob ng naunang inilalarawang huwaran.
- source_word: יִהְיֶה הֶעָנָן
  choice: nananatili ang ulap
  rationale: Bagaman karaniwang nangangahulugang “maging” ang היה, ipinahihiwatig ng kasunod na haba ng panahon ang patuloy na pananatili.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: mula gabi hanggang umaga
  rationale: Tuwiran at natural na paglalahad ng saklaw ng panahon.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: kapag pumaitaas ang ulap
  rationale: Ang עלה ay maaaring mangahulugang umakyat o pumaitaas; pinananatili nitong bukas kung kusang inilalarawan ang pag-angat o ipinahihiwatig ang pagkakaangat bilang hudyat.
- source_word: וְנָסָעוּ
  choice: lumalakad sila
  rationale: Sa konteksto ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis at pagpapatuloy ng paglalakbay; ang “lumalakad” ay maikli at akma sa paulit-ulit na pormula ng talata.
- source_word: אוֹ יוֹמָם וָלַיְלָה
  choice: O kung nananatili iyon nang isang araw at isang gabi
  rationale: Ipinakikita ng אוֹ ang alternatibong kalagayan, at ang parirala ay nauunawaan dito bilang tagal ng pananatili ng ulap.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na simple ngunit marangal. Ginamit ang “pumaitaas” upang maging natural ang paglalarawan sa pag-angat ng ulap habang pinananatili sa talababa ang posibleng pasibong pagpapahayag. Ang panghalip na “iyon” sa ikalawang sugnay ay tumutukoy nang malinaw sa ulap.
