base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: tl
  text: Sinabi ni Moises sa kanila[a], “Maghintay kayo, at pakikinggan ko kung ano ang iuutos ni Yahweh para sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Manatili kayong nakatayo,” ayon sa mas literal na diwa ng pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם מֹשֶׁה
  choice: Sinabi ni Moises sa kanila
  rationale: Natural na salaysay sa modernong Tagalog; hindi kailangang laging tumbasan nang tahasan ang waw na nag-uugnay ng sunod na pangyayari.
- source_word: עִמְדוּ
  choice: Maghintay kayo rito
  rationale: Bagaman literal na 'tumayo/manatili,' idiomatiko itong utos na manatili at maghintay; nililinaw ng 'rito' ang konteksto nang hindi binabago ang diwa. Nasa talababa ang mas literal na posibilidad.
- source_word: וְאֶשְׁמְעָה
  choice: habang inaalam ko
  rationale: Literal na 'at makarinig ako'; sa konteksto, layunin ni Moises na tanggapin o malaman ang sagot ni Yahweh. Natural itong sabihin sa Tagalog bilang 'inaalam ko' nang hindi ipinapalagay kung paano darating ang sagot.
- source_word: מַה יְצַוֶּה
  choice: kung ano ang iuutos
  rationale: Pinananatili ang di-tiyak na nilalaman ng utos at ang inaasahang kasunod na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: לָכֶם
  choice: tungkol sa inyo
  rationale: Sa konteksto, ang utos ay may kinalaman sa kalagayan ng mga lalaking kausap ni Moises; natural at tumpak ito sa Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ginagamit ng talata ang Tetragrammaton bilang personal na pangalan; pinananatili ng 'Yahweh' ang pangalang iyon at hindi ito pinapalitan ng titulo.
- issue: Paraan ng pagtanggap ni Moises sa utos
  choice: inaalam ko
  alternative: maririnig ko
  rationale: Ipinahihiwatig ng Hebreo ang pakikinig/pagtanggap ni Moises sa sasabihin ni Yahweh. Ang 'inaalam ko' ay natural sa Tagalog at hindi nagdaragdag ng partikular na paraan ng paghahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang magalang na maramihang 'kayo' at iniwasan ang lipas o labis na teknikal na pananalita.
