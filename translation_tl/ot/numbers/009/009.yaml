lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagpapatuloy sa salaysay. Likas sa Tagalog ang “At nagsalita” at pinananatili nito ang pagkakasunod-sunod ng pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang likas na Tagalog para sa אֶל kapag ang tinutukoy ay isang taong pinatutungkulan; “Moises” ang karaniwang anyo ng pangalan sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa mismong pananalitang kasunod, bagaman mas pormal ito kaysa sa karaniwang “sinabi niya.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na halinhan ito ng tradisyonal na titulo.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang pormal na pormula ng pagpapakilala sa pananalita dahil nagpapatuloy ang sipi sa susunod na talata.
