  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: tl
  text: Sabihin mo sa mga anak ni Israel[a], ‘Kung may sinumang lalaki na marumi dahil sa bangkay[b], o nasa malayong paglalakbay, maging sa inyo man o sa inyong mga salinlahi[c], gaganapin niya ang Paskuwa para kay Yahweh.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel”; tumutukoy ang parirala sa sambayanang Israel sa kabuuan.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong idyoma ay literal na “marumi dahil sa isang tao/buhay.” Sa kontekstong ito ng batas, tumutukoy ito sa ritwal na karumihang dulot ng bangkay.
    reason: lexical_alternative
  - marker: c
    text: O “sa lahat ng inyong salinlahi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Sabihin mo sa mga anak ni Israel
  rationale: Pinananatili ng “Sabihin mo” ang pautos na anyo, at ng “mga anak ni Israel” ang konkretong Hebreong katawagan sa sambayanang Israel.
- source_word: אִישׁ אִישׁ
  choice: ang sinumang lalaki
  rationale: Ang pag-uulit ng אִישׁ ay may distributibong diwa—sinumang indibiduwal na lalaki—na natural na naihahayag sa Filipino sa “sinumang lalaki.”
- source_word: טָמֵא לָנֶפֶשׁ
  choice: marumi dahil sa bangkay
  rationale: Sa kontekstong legal at ritwal, ang נֶפֶשׁ sa pariralang ito ay tumutukoy sa patay na tao o bangkay na pinagmumulan ng ritwal na karumihan.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: nasa malayong paglalakbay
  rationale: Ipinahihiwatig ng parirala ang paglalakbay na naglalayo sa isang tao sa lugar ng pagdiriwang; mas natural ito kaysa sa literal na “nasa malayong daan.”
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: sa inyo o sa inyong mga salinlahi
  rationale: Iniuugnay ang saklaw ng tuntunin kapwa sa kasalukuyang pamayanan at sa susunod nilang mga salinlahi, alinsunod sa pinakaangkop na pagbasa ng Hebreong sugnay.
- source_word: וְעָשָׂה פֶסַח
  choice: ipagdiwang pa rin niya ang Paskuwa
  rationale: Ang עשה kasama ng פֶסַח ay idyomang nangangahulugang ganapin o ipagdiwang ang Paskuwa. Ipinakikita ng “pa rin” na nananatiling posible at nararapat ang pagdiriwang sa kabila ng nabanggit na kalagayan, bagaman ang takdang paraan ay ipinaliliwanag sa kasunod na talata.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang pangalang tipan na יהוה bilang “Yahweh,” at ang לְ ay natural na isinasalin ditong “para kay,” yamang ang Paskuwa ay ginaganap bilang pagdiriwang para sa kanya.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: May kasariang pananalita sa batas ng tipan
  choice: mga anak ni Israel / sinumang lalaki
  alternative: mga Israelita / sinuman
  rationale: Pinananatili ang panlalaking anyo ng בְּנֵי at אִישׁ nang hindi itinatanggi na ang “mga anak ni Israel” ay katawagan sa buong pamayanan.
- issue: Diwa ng וְעָשָׂה pagkatapos ng mga hadlang
  choice: ipagdiwang pa rin niya
  alternative: ipagdiwang niya
  rationale: Ang “pa rin” ay nagpapahayag ng tuloy na bisa ng pagdiriwang sa kabila ng ritwal na karumihan o pagkalayo. Hindi nito tinutukoy ang eksaktong petsa, na ibinibigay sa kasunod na talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Paskuwa,” “Yahweh,” at “ritwal na karumihan” bilang malinaw at pamilyar na mga terminong biblikal. Inayos ang saklaw ng “sa inyo o sa inyong mga salinlahi” upang maging natural sa Filipino habang pinananatili ang ugnayang gramatikal at ang saklaw ng tuntunin sa kasalukuyan at hinaharap.
