base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: tl
  text: Kung minsan, nananatili ang ulap sa ibabaw ng tabernakulo nang ilang araw. Ayon sa utos ni Yahweh[a] ay nagkakampo sila, at ayon sa utos ni Yahweh ay umaalis sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ayon sa bibig ni Yahweh”—ibig sabihin, ayon sa utos ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Kung minsan
  rationale: Likas na Filipino para sa idyomang nagpapakilala ng isa sa iba't ibang sitwasyong paulit-ulit na nagaganap.
- source_word: יִהְיֶה הֶעָנָן
  choice: nananatili ang ulap
  rationale: Sa konteksto, ang היה ay tumutukoy sa patuloy na pagkakalagay ng ulap sa ibabaw ng tabernakulo, hindi lamang sa pag-iral nito.
- source_word: יָמִים מִסְפָּר
  choice: nang ilang araw
  rationale: Ipinahihiwatig ng parirala ang isang bilang ng mga araw nang hindi tinutukoy kung gaano karami; natural dito ang 'ilang araw.'
- source_word: עַל הַמִּשְׁכָּן
  choice: sa ibabaw ng tabernakulo
  rationale: Pinananatili ng 'tabernakulo' ang kinikilalang katawagan sa santuwaryo sa ilang, at malinaw na ipinapahayag ng 'sa ibabaw' ang puwesto ng ulap.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang literal na 'ayon sa bibig ni Yahweh' ay isang idyoma para sa pagsunod sa kaniyang makapangyarihang utos.
- source_word: יַחֲנוּ
  choice: sila nagkakampo
  rationale: Ang anyong ito sa konteksto ay naglalarawan ng kinagawiang kilos; ipinapakita ng 'nagkakampo' ang paulit-ulit na gawain.
- source_word: יִסָּעוּ
  choice: sila umaalis
  rationale: Sa konteksto ng paglalakbay sa ilang, tumutukoy ito sa pagliligpit ng kampo at pag-alis patungo sa susunod na lugar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Filipino ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang ginagamit sa tekstong Hebreo; pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  alternative: ayon sa bibig ni Yahweh
  rationale: Ang parirala ay literal na may larawang 'bibig,' ngunit idyomatikong nangangahulugang ayon sa iniutos ni Yahweh. Pinananatili sa talababa ang literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang kasalukuyang aspektong 'nananatili,' 'nagkakampo,' at 'umaalis' upang ilarawan ang kinagawiang pagkilos sa iba't ibang pagkakataon. Ang 'tabernakulo' ay pinanatili bilang pamilyar na terminong biblikal.
