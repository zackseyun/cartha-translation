  source_fidelity: 'Ang pangunahing kahulugan ay naipapahayag nang tapat: ang pagdiriwang ng Paskuwa, petsa, takipsilim, ilang ng Sinai, pagsunod sa utos ni Yahweh kay Moises, at ang mga anak ni Israel ay lahat naroroon. Gayunman, ang “nang unang buwan” ay maling gamit para sa panahong pangkalendaryo; dapat itong “sa unang buwan.”'
  naturalness: Marangal at madaling maunawaang modernong Filipino ang karamihan ng salin. Mas malinaw at mas malapit sa pangwakas na pagbubuod ng Hebreo ang “gayon ang ginawa ng mga anak ni Israel” kaysa sa hiwalay na pangungusap na “Ginawa ... ang lahat.”
  terminology: Ang “Paskuwa,” “takipsilim,” “ilang ng Sinai,” “Yahweh,” at “mga anak ni Israel” ay angkop at pare-pareho sa pinagmulan at sa rehistro ng salin. Napananatili ng talababa ang literal na idyomang Hebreo nang hindi pinipilit ang isang tiyak na kronolohikal na pagpapakahulugan.
