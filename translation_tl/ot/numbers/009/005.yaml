  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: tl
  text: Kaya ipinagdiwang nila ang Paskuwa sa unang buwan, sa ikalabing-apat na araw ng buwan, sa takipsilim[a], sa ilang ng Sinai; ayon sa lahat ng iniutos ni Yahweh kay Moises, gayon ang ginawa ng mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “sa pagitan ng mga gabi,” isang idyoma na tumutukoy sa panahon ng takipsilim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ / עָשׂוּ
  choice: ipinagdiwang / ginawa
  rationale: Ang עשה ay literal na “gawin,” ngunit kasama ng פֶּסַח ay tumutukoy sa pagdiriwang o pagtupad sa Paskuwa. Pinananatili ng “ginawa” sa pangwakas na sugnay ang buod na pagsunod nila.
- source_word: הַפֶּסַח
  choice: ang Paskuwa
  rationale: Sa konteksto, tumutukoy ito sa pagdiriwang ng Paskuwa sa kabuuan, hindi lamang sa handog o kordero.
- source_word: בָּרִאשׁוֹן
  choice: nang unang buwan
  rationale: Ipinahihiwatig ng Hebreo ang “buwan”; idinagdag ito sa salin upang maging malinaw ang pormulang pangkalendaryo.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: sa ikalabing-apat na araw ng buwan
  rationale: Natural at malapit sa karaniwang pormula ng petsa sa Hebreo.
- source_word: בֵּין הָעַרְבַּיִם
  choice: sa takipsilim
  rationale: Natural na Filipino para sa panahong tinutukoy ng idyomang literal na “sa pagitan ng mga gabi”; pinanatili sa talababa ang literal na anyo.
- source_word: בְּמִדְבַּר סִינָי
  choice: sa ilang ng Sinai
  rationale: Ang מִדְבָּר ay ilang o lupaing di-sinasaka; ang “ilang ng Sinai” ay maikli, malinaw, at dignified sa Filipino.
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ayon sa
  rationale: Ipinahahayag nito ang ganap na pagsunod sa lahat ng iniutos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: צִוָּה
  choice: iniutos
  rationale: Malinaw sa konteksto na nauna na ang utos; hindi kailangan sa Filipino ang hiwalay na anyong katumbas ng English pluperfect.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang tahasang ugnayang pangkaanak ng Hebreo habang natural na tumutukoy sa sambayanan bilang isang pangkat.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili bilang Yahweh sa halip na palitan ng titulo.
- issue: Korporatibong pananalitang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili nito ang filial na anyo ng pinagmulan nang hindi nilulutas o pinapaliit ang kolektibong saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paskuwa,” “takipsilim,” at “ilang ng Sinai” bilang madaling maunawaang mga katawagan, habang pinanatili ang pangalang Yahweh at ang “mga anak ni Israel.”
