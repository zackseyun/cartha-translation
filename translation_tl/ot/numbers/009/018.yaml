  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: tl
  text: Sa utos ni Yahweh, umalis ang mga Israelita,[a] at sa utos ni Yahweh sila nagkampo. Sa buong panahong nanatili ang ulap sa ibabaw ng tabernakulo, nanatili silang nakahimpil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ayon sa bibig ni Yahweh,” isang idyomang nangangahulugang “sa utos ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: sa utos ni Yahweh
  rationale: Ang literal na larawan ay “ayon/sa bibig ni Yahweh,” ngunit isa itong idyoma para sa pagkilos ayon sa kaniyang utos. Natural sa modernong Tagalog ang “sa utos ni Yahweh” at malinaw na ipinapakitang ang pag-alis at pagkakampo ay nakasalalay sa kaniyang tagubilin.
- source_word: יִסְעוּ
  choice: umalis
  rationale: Sa konteksto ng paglalakbay at kampamento, tumutukoy ang נסע sa pag-alis upang magpatuloy sa paglalakbay. Ang “umalis” ay malinaw at natural nang hindi nagdaragdag ng detalye gaya ng “nagligpit ng kampo.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” ang parirala ay karaniwang katawagan sa sambayanang Israel. Iniiwasan ng “mga Israelita” ang di-sinasadyang pagpapahiwatig na mga lalaki lamang ang tinutukoy.
- source_word: יַחֲנוּ
  choice: nagkampo / nanatiling nagkampo
  rationale: Ang חנה ay nangangahulugang magkampo. Sa huling sugnay, ang “nanatili silang nagkampo” ay nagpapahayag ng durasyong hinihingi ng “sa lahat ng araw na,” habang pinananatili ang parehong pangunahing diwa.
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: sa lahat ng araw na
  rationale: Malapit ito sa anyo ng Hebreo at nauunawaan bilang pahayag ng buong tagal.
- source_word: יִשְׁכֹּן
  choice: nanatili
  rationale: Ang שכן ay maaaring mangahulugang manahan o manatili. Dahil ulap ang simuno at tagal ng presensiya nito ang pokus, natural at tumpak ang “nanatili.”
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tuwirang salin ng nakikitang ulap na gumagabay sa Israel.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Tumutukoy ang מִשְׁכָּן sa banal na tirahan. Ang “tabernakulo” ang nakasanayang terminong Filipino at hindi ito ipinagkakamali sa mas tiyak na “Tolda ng Tipanan/Pagpupulong” para sa אֹהֶל מוֹעֵד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan sa Tetragrammaton sa halip na palitan ito ng titulong “Panginoon.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa isang titulo at malapit ito sa karaniwang rekonstruksiyon ng bigkas.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga Israelita” bilang natural na kolektibong katawagan at “nagkampo” para sa malinaw na ugnayan ng paglalakbay at pananatili. Ang footnote marker [a] ay inilagay pagkatapos ng unang sugnay na nagsasalin sa idyomang Hebreo.
