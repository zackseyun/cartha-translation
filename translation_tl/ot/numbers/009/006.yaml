  to: May ilang lalaking may ritwal na karumihan dahil sa bangkay ng tao,[a] kaya hindi nila maganap ang Paskuwa sa araw na iyon. At nang araw ding iyon, lumapit sila kina Moises at Aaron.
  rationale: Pinalitan ang pananalitang maaaring magpahiwatig ng moral o pisikal na dumi ng tahasang “ritwal na karumihan,” habang pinananatili ang sanhi nito na bangkay ng tao. Pinalitan ang “naging” upang tumugma sa paglalarawang pangkalagayan ng Hebreo, at ang “maipagdiwang” ng “maganap” upang maipakita ang itinakdang pagganap ng Paskuwa. Iningatan ang dalawang pagtukoy sa araw na iyon at ang paglapit kina Moises at Aaron.
