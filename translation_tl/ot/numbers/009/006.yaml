base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: tl
  text: May ilang lalaking may ritwal na karumihan dahil sa bangkay ng tao,[a] kaya hindi nila maganap ang Paskuwa sa araw na iyon. At nang araw ding iyon, lumapit sila kina Moises at Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “marumi para sa nefesh ng isang tao”; isang idyoma ito para sa ritwal na karumihang dulot ng bangkay ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: May ilang lalaki
  rationale: Ipinakikilala ng parirala ang isang pangyayari at mga lalaking sangkot dito. Ang “May ilang lalaki” ay likas sa modernong Tagalog at pinananatili ang panlalaking pangngalan.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: naging marumi dahil sa bangkay ng isang tao
  rationale: Ang parirala ay idyoma ng batas ritwal para sa karumihang dulot ng bangkay ng tao. Nililinaw ng salin ang pinagmulan ng ritwal na karumihan nang hindi ito ginagawang moral na kasalanan.
- source_word: וְלֹא יָכְלוּ
  choice: kaya hindi nila maipagdiwang
  rationale: Ipinahihiwatig ng pagkakasunod ng mga sugnay na ang kanilang karumihan ang dahilan ng kawalan nila ng kakayahang tumupad noong araw na iyon.
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: maipagdiwang ang Paskuwa
  rationale: Ang literal na “gawin ang Paskuwa” ay idyoma para sa pagganap o pagdiriwang nito. Ang “ipagdiwang” ay malinaw at natural sa Tagalog, at sa konteksto ay tumutukoy sa itinakdang pagganap ng kapistahan.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon / Nang araw ding iyon
  rationale: Pinananatili ang dalawang pagbanggit sa araw na iyon; ginamit ang “ding” sa ikalawa upang natural na idiin na lumapit sila sa mismong araw na iyon.
- source_word: וַיִּקְרְבוּ לִפְנֵי מֹשֶׁה וְלִפְנֵי אַהֲרֹן
  choice: lumapit sila kina Moises at Aaron
  rationale: Ang “lumapit” ay tuwirang katumbas ng קרב. Sa Tagalog, sapat na ang “kina” upang ipahayag na humarap o lumapit sila sa dalawang pinuno, nang hindi pilit na inuulit ang “sa harap ni.”
theological_decisions:
- issue: Uri ng karumihan
  choice: Ritwal na karumihang dulot ng bangkay ng tao
  alternative: Literal na “marumi para sa nefesh ng isang tao” o isang saling maaaring magpahiwatig ng moral na karumihan
  rationale: Sa konteksto ng mga batas sa kadalisayan sa Pentateuch, tumutukoy ito sa ritwal na karumihan kaugnay ng kamatayan, hindi sa isang tahasang hatol tungkol sa personal na kasalanan.
- issue: Kahulugan ng pagganap sa Paskuwa
  choice: “ipagdiwang ang Paskuwa” bilang pagganap sa itinakdang pagdiriwang
  alternative: “gawin ang Paskuwa” o “ipangilin ang Paskuwa”
  rationale: Idyomatiko ang pandiwang “gawin” sa Hebreo. Ang “ipagdiwang” ay madaling maunawaan at hindi nagdaragdag ng partikular na denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Paskuwa” bilang karaniwang salin ng פֶּסַח at iniwasan ang sobrang literal ngunit di-likas na “gawin ang Paskuwa.”
