  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: tl
  text: isang mangkok na ginto na tumitimbang ng sampung siklo[a], na puno ng insenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang mangkok, sampu, ginto, puno ng insenso.” Ang “siklo” ay idinagdag batay sa paulit-ulit na pormula ng mga handog sa kalapit na konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: mangkok
  rationale: Sa talaan ng mga handog para sa tabernakulo, tumutukoy ito sa isang maliit na sisidlan ng insenso, hindi sa palad. Likas at malinaw sa makabagong Filipino ang “mangkok.”
- source_word: אַחַת
  choice: isang
  rationale: Tuwirang isinasalin ang pambilang na umaayon sa pambabaeng pangngalang כַּף.
- source_word: עֲשָׂרָה
  choice: sampung siklo
  rationale: “Sampu” lamang ang tahasang nasa Hebreo, ngunit nauunawaan mula sa paulit-ulit na pormula at kalapit na konteksto na timbang na siklo ang tinutukoy. Idinagdag ang “siklo” para maging malinaw ang sukat.
- source_word: זָהָב
  choice: na ginto
  rationale: Inilalarawan nito ang materyal na yari sa ginto ang sisidlan; natural sa Filipino ang “mangkok na ginto.”
- source_word: מְלֵאָה
  choice: na puno ng
  rationale: Tuwirang inilalarawan ang laman ng sisidlan sa natural at maikling Filipino.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang salin para sa mabangong sangkap na inihahandog sa kontekstong saserdotal at tabernakulo.
