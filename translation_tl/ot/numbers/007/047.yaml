base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: tl
  text: At para sa haing pangkapayapaan:[a] dalawang baka, limang lalaking tupa, limang lalaking kambing, at limang korderong tig-iisang taóng gulang. Ito ang handog ni Eliasaf na anak ni Deuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa pakikipag-isa” o “mga handog para sa kabutihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: At para sa handog na hain para sa kapayapaan
  rationale: Ipinakikita ng וּלְ ang kasunod na bahagi ng talaan, at ang זֶבַח ay tahasang tumutukoy sa hain. Pinananatili ng “para sa kapayapaan” ang tradisyonal at kultikong kahulugan ng שְׁלָמִים, habang inilalagay sa talababa ang iba pang tunay na posibilidad.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Ang בָּקָר ay kolektibong katawagan sa mga bovine at hindi nito tinutukoy ang kasarian; natural sa Filipino ang “dalawang baka” bilang pangkalahatang katawagan sa hayop.
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Ang אֵילִם ay partikular na mga ram; malinaw na ipinahahayag ng “lalaking tupa” ang kasarian sa modernong Filipino.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Ang עַתֻּדִים ay mga lalaking kambing; pinananatili ang espesipikong kasarian ng terminong Hebreo.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang korderong tig-iisang taóng gulang
  rationale: Ang pariralang בְּנֵי שָׁנָה ay nagsasaad na bawat kordero ay isang taong gulang; nililinaw ito ng “tig-iisang.”
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Ang nominal na Hebreo ay natural na isinasalin sa Filipino sa kasalukuyang anyong “Ito ang handog,” nang hindi kailangang magpasok ng panahunan.
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: Eliasaf na anak ni Deuel
  rationale: Ginamit ang tuwirang transliterasyon ng mga pangalang Hebreo at ang natural na anyo ng patronimiko sa Filipino.
theological_decisions:
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog na hain para sa kapayapaan
  alternative: mga handog para sa pakikipag-isa / mga handog para sa kagalingan
  rationale: Saklaw ng terminong Hebreo ang mga ideya ng kapayapaan, kabuuan o kagalingan, at pakikipag-isa. Pinili sa teksto ang nakikilalang kultikong katawagan, ngunit hindi itinago ang leksikal na lawak nito.
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Pinanatili ang anyong talaan ng Hebreo at iniwasan ang labis na teknikal o makalumang bokabularyo.
