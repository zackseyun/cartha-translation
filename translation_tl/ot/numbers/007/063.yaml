  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong talaan ng Hebreo at ang tiyak na bilang ng bawat hayop; iniwasan ang sobrang literal na mga idyomang hindi natural sa Tagalog.
