  yaml_path: translation/ot/numbers/007/063.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: tl
  text: isang toro mula sa kawan[a], isang lalaking tupa, at isang lalaking korderong isang taóng gulang, bilang handog na sinusunog;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang batang toro, isang lalaking tupa, at isang lalaking korderong nasa unang taon nito, bilang handog na sinusunog.” Ang literal na Hebreong “anak ng bakahan” ay isang idyoma para sa hayop na mula sa bakahan, at ang “anak ng taon nito” ay idyoma para sa hayop na nasa unang taon nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: isang toro mula sa kawan
  rationale: Ang פַּר ay toro sa kontekstong paghahandog, at ang idyomang בֶּן־בָּקָר ay likas na naipahahayag sa Filipino bilang “mula sa kawan,” nang hindi ginagamit ang alanganing literal na “anak ng bakahan.”
- source_word: אַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Ang אַיִל ay adultong lalaking tupa; mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa mas teknikal na “barako.”
- source_word: כֶּבֶשׂ אֶחָד
  choice: isang lalaking kordero
  rationale: Ang כֶּבֶשׂ ay kordero at sa bokabularyong panghandog ay tumutukoy rito sa lalaking hayop; tahasang pinanatili ang kasarian.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Natural na salin ito ng Hebreong idyoma para sa hayop na nasa unang taon o isang taon ang gulang.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog; ang “bilang” ay natural na nagpapahayag ng gamit na ipinakikita ng prefiks na לְ.
- source_word: אֶחָד
  choice: isang
  rationale: Pinanatili ang paulit-ulit na bilang para sa bawat hayop, gaya ng estruktura ng Hebreo.
theological_decisions: []
