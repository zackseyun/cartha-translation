id: NUM.7.43
reference: Numbers 7:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: Ang handog niya ay isang bandehang pilak[a] na may bigat na 130 siklo, at isang mangkok na pilak[b] na may bigat na 70 siklo, ayon sa siklo ng santuwaryo[c]. Kapwa puno ang mga ito ng pinong harina na hinaluan ng langis bilang handog na butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinggan” para sa קְעָרָה.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “palanggana” para sa מִזְרָק, isang sisidlang panritwal.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “ayon sa siklo ng santuwaryo,” na tumutukoy sa pamantayang bigat ng santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Ang handog niya ay
  rationale: Ang קָרְבָּן ay handog na inilalapit o inihaharap sa kontekstong panritwal. Idinagdag ang “ay” upang maging likas sa Tagalog ang sugnay na walang pandiwa sa Hebreo.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang bandehang pilak
  rationale: Ang קְעָרָה ay isang malapad na sisidlang gaya ng bandeha o pinggan. Ang “bandeha” ay malinaw at likas na katawagan sa modernong Tagalog.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na may bigat na 130 siklo
  rationale: Pinananatili nito ang tahasang pagtukoy ng Hebreo sa bigat, habang ginagamit ang karaniwang ayos ng bilang sa Tagalog.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang mangkok na pilak
  rationale: Ang מִזְרָק ay sisidlang panritwal na maaaring tawaging mangkok o palanggana. Hindi idinagdag sa teksto ang tiyak na gamit nito sapagkat hindi iyon tahasang sinasabi sa talata.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na may bigat na 70 siklo
  rationale: Ipinahahayag nang malinaw na ang sukat ay bigat ng mangkok.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Tumutukoy ang pormulang ito sa pamantayang bigat na ginagamit sa santuwaryo. Pinananatili ang konkretong terminong “siklo” at nililinaw sa talababa ang kahulugan.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Kapwa puno ang mga ito
  rationale: Pinananatili ang tahasang dalawahang pagtukoy sa dalawang sisidlan at ang pang-uring “puno.”
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwang tawag sa pinong harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: 'Tumpak na ipinahahayag ang pasibong anyo: ang harina ay nahaluan na ng langis.'
- source_word: לְמִנְחָה
  choice: bilang handog na butil
  rationale: Sa kontekstong pangsaserdote, ang מִנְחָה ay tiyak na handog na mula sa butil, hindi lamang isang pangkalahatang handog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang mga numerong 130 at 70 para sa malinaw na pagbasa, at pinanatili ang “siklo” bilang sinaunang yunit ng timbang. Inayos ang mga talababa sa likas na pagkakasunod na [a], [b], [c].
