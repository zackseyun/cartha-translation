  text: זֹ֣את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ מֵ/אֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי כֶ֨סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: tl
  text: 'Ito ang handog sa pagtatalaga ng altar noong araw na pinahiran ito ng langis[a], mula sa mga pinuno ng Israel: labindalawang bandehang pilak, labindalawang mangkok na pilak, at labindalawang sandok na ginto[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ito ang pagtatalaga ng altar.” Mas pormal itong salin ng Hebreo, ngunit sa konteksto ay binubuod ng talata ang mga handog na iniharap para sa pagtatalaga.'
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang eksaktong anyo ng mga sisidlan. Maaari ring isalin ang mga termino bilang “mga pinggang pilak,” “mga palangganang pilak,” at “mga kutsara,” “mga platito,” o “mga maliit na sisidlang ginto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Ito ang handog sa pagtatalaga ng altar
  rationale: Ang חֲנֻכָּה ay tumutukoy sa pagtatalaga; sa konteksto ng talatang nagbubuod sa mga inihandog, natural na ipahayag ang ipinahihiwatig na handog nang hindi binabago ang pangunahing diwa.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: nang araw na pahiran ito ng langis
  rationale: Likas na temporal ang parirala, at ang panghalip ay tumutukoy sa altar. Nililinaw ng 'langis' ang ritwal na kahulugan ng pagpapahid sa kontekstong ito.
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: mula sa mga pinuno ng Israel
  rationale: Ipinakikita ng מֵאֵת ang pinagmulan, at ang נְשִׂיאִים sa Mga Bilang ay mga kinikilalang pinuno ng mga lipi, hindi kinakailangang mga prinsipeng maharlika.
- source_word: קַעֲרֹת כֶּסֶף
  choice: mga bandehadong pilak
  rationale: Ang קְעָרָה ay malapad na pinggan o bandehado; pinananatili nitong naiiba ang sisidlang ito sa kasunod na mga mangkok.
- source_word: מִזְרְקֵי כֶסֶף
  choice: mga mangkok na pilak
  rationale: Ang מִזְרָק ay mangkok o palangganang ginagamit sa ritwal; malinaw at karaniwan sa modernong Filipino ang 'mangkok.'
- source_word: כַּפּוֹת זָהָב
  choice: mga lalagyang ginto
  rationale: Ang כַּף ay maaaring tumukoy sa kutsara, sandok, o maliit na sisidlan. Ang mas malawak na 'lalagyan' ay natural at hindi nagpapasiya nang labis sa tiyak na hugis ng kagamitang panritwal.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Tuwirang salin ng bilang; hindi kailangang katawanin sa Filipino ang kasariang gramatikal ng mga pangngalang Hebreo.
theological_decisions:
- issue: Kung ang חֲנֻכַּת ay pagtatalaga mismo o kolektibong handog para sa pagtatalaga
  choice: handog sa pagtatalaga
  alternative: pagtatalaga
  rationale: Dahil buod ito ng mga kagamitang inihandog ng mga pinuno, makatuwirang gawing hayag ang ipinahihiwatig na 'handog,' habang inilalagay sa talababa ang mas pormal na posibilidad.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'pinuno' sa halip na 'prinsipe,' at pinanatiling pangkalahatan ang huling uri ng sisidlan dahil hindi tiyak ang eksaktong anyo nito.
