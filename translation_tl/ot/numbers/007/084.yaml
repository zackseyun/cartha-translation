  naturalness: Marangal at madaling maunawaan ang rehistro. Ang “noong araw na pinahiran ito ng langis” ay likas na modernong Filipino. Ang “mga bandehang pilak,” “mga mangkok na pilak,” at “mga sandok na ginto” ay malinaw na listahan ng magkakaibang kagamitang ritwal.
  terminology: Ang “altar,” “mga pinuno ng Israel,” at “pagtatalaga” ay angkop. Ginamit ang “sandok” bilang pangunahing salin ng כַּפּוֹת, habang pinananatili ng talababa ang leksikal na kawalang-katiyakan sa eksaktong hugis ng sisidlan.
