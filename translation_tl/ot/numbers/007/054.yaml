translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling estruktura ng Hebreo, ngunit ginamit ang “ay” upang maging natural ang sugnay na nominal sa Tagalog. Inilipat ang marker [a] sa pariralang talagang ipinaliliwanag ng talababa.
