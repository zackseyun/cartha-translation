  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: tl
  text: Noong ikawalong araw, ang pinuno ng mga anak ni Manases[a] ay si Gamaliel na anak ni Pedasur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Manases” ay katawagan sa mga inapo o lipi ni Manases.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Nang ikawalong araw
  rationale: Likas na panandang temporal sa Tagalog para sa בְּ + יוֹם at ordinal; hindi nagdaragdag ng kontekstong wala sa talata.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy sa kinikilalang namumuno o kumakatawan sa pangkat. Malinaw ito sa makabagong Tagalog at iniiwasan ang maharlikang pahiwatig ng “prinsipe.”
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: ng mga anak ni Manases
  rationale: Pinananatili ang pampamilya at pantribong idyoma ng בְּנֵי habang natural na ipinakikita ng “ng” ang pangkat na pinamumunuan. Ipinaliliwanag sa talababa ang pantribong kahulugan.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Manasseh.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Karaniwang anyong Filipino ng pangalang pantangi.
- source_word: בֶּן
  choice: anak ni
  rationale: Natural na katumbas sa Tagalog ng patronimikong “son of.”
- source_word: פְּדָה צוּר
  choice: Pedasur
  rationale: Isinulat bilang iisang pangalang tambalan at inangkop sa karaniwang ortograpiyang Filipino.
