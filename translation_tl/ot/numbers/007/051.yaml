  text: isang toro mula sa kawan ng baka, isang lalaking tupa, isang lalaking kordero na isang taóng gulang, para sa handog na sinusunog;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Ang פַּר ay toro o batang toro, at ang idyomang בֶּן־בָּקָר ay tumutukoy sa uring hayop mula sa bakahan. Pinananatili ng salin ang dalawang sangkap sa natural na Tagalog.
- source_word: אַיִל
  choice: isang lalaking tupa
  rationale: Tumutukoy ito sa adultong lalaking tupa na ginagamit sa paghahandog. Mas madaling maunawaan sa karaniwang Tagalog ang “lalaking tupa” kaysa sa hiram o teknikal na katawagan.
- source_word: כֶּבֶשׂ
  choice: isang lalaking kordero
  rationale: Ang salita ay tumutukoy sa kordero at karaniwang panlalaki sa kontekstong panghandog; hayagang isinasaad ang kasarian.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Likas na salin sa modernong Tagalog ng idyomang Hebreo para sa hayop na nasa gulang na isang taon.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na ganap na sinusunog. Ang pariralang ito ay malinaw at natural sa listahan ng mga handog.
- source_word: אֶחָד
  choice: isang
  rationale: Inuulit ang bilang para sa bawat hayop, gaya ng nasa tekstong Hebreo.
