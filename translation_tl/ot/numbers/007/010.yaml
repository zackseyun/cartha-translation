  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: tl
  text: Iniharap ng mga pinuno ang handog para sa pagtatalaga ng altar[a] noong araw na pinahiran ito ng langis. Iniharap nila ang kanilang handog sa harap ng altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang pagtatalaga ng altar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: iniharap
  rationale: Ang Hiphil ng קרב sa kontekstong panghandog ay nangangahulugang ilapit o iharap bilang handog. Likas sa modernong Tagalog ang “iniharap” at naiiwasan nito ang alanganing “inihandog ang handog.”
- source_word: הַנְּשִׂאִים
  choice: mga pinuno
  rationale: Sa Mga Bilang, tumutukoy ito sa mga namumuno sa mga lipi. Malinaw at kasalukuyang Tagalog ang “mga pinuno,” samantalang maaaring magpahiwatig ng monarkiya ang “mga prinsipe.”
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: ang handog para sa pagtatalaga ng altar
  rationale: Literal itong “ang pagtatalaga ng altar,” ngunit ang kilos na “iniharap” at ang kasunod na קָרְבָּנָם ay nagpapakitang ang tinutukoy sa konteksto ay ang handog na kaugnay ng pagtatalaga. Pinananatili sa talababa ang mas literal na anyo.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: nang araw na pahiran ito ng langis
  rationale: Ipinahahayag ng בְּיוֹם kasama ng infinitive ang tiyak na panahon. Nililinaw ng “ng langis” ang ritwal na kahulugan ng pagpahid nang hindi binabago ang diwa.
- source_word: קָרְבָּנָם
  choice: kanilang handog
  rationale: Ang קָרְבָּן ay handog na inilalapit o inihaharap sa kontekstong pangsamba. Ang “handog” ang natural at malawak na katumbas sa Tagalog.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: sa harap ng altar
  rationale: Direkta at natural na katumbas ito ng lokatibong parirala at akma sa pormal na tagpo ng pagsamba.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “altar,” na karaniwang katawagang nauunawaan sa kontekstong biblikal, at pinanatili ang pag-uulit ng paghaharap ng handog na nasa Hebreo.
