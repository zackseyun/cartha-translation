lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang pariralang Hebreo ay tumutukoy sa isang kambing na lalaki. Likas at malinaw sa makabagong Tagalog ang “lalaking kambing,” habang pinananatili ang kasariang tinutukoy ng terminong panghandog.
- source_word: אֶחָד
  choice: isang
  rationale: Hayagang binibilang ng Hebreo ang hayop. Pinananatili ng “isang” ang anyo ng talaan at natural itong ikinakabit sa pangngalan sa Tagalog.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong panghandog, ang חַטָּאת ay tumutukoy sa handog para sa kasalanan, hindi lamang sa abstraktong kasalanan. Ang “bilang” ay malinaw na nagsasaad ng gamit ng hayop, at ang buong parirala ay karaniwang nauunawaan sa Tagalog.
