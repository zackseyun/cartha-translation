  text: 'Noong ikasampung araw, ang pinuno ng mga anak ni Dan ay si Ahiezer na anak ni Ammishaddai:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: Nang ikasampung araw
  rationale: Likas na temporal na parirala sa modernong Tagalog para sa pagkakasunod-sunod ng mga araw; malinaw nitong ipinapahayag ang ordinal na “ikasampu.”
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy sa kinikilalang lider o kinatawan ng lipi; malinaw ito at hindi nag-aangkat ng maharlika o monarkikong kahulugan ng “prinsipe.”
- source_word: לִבְנֵי דָן
  choice: ng mga anak ni Dan
  rationale: Pinananatili ang pampamilyang anyo ng Hebreong בְּנֵי habang likas pa rin sa Tagalog at ipinakikilalang ang liping kinakatawan ay nagmula kay Dan.
- source_word: אֲחִיעֶזֶר
  choice: Ahiezer
  rationale: Pangalan ng tao, kaya tinumbasan sa pamamagitan ng transliterasyon.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang Tagalog na anyo ng patronimiko at tuwirang katumbas ng Hebreong “anak ni/ng.”
- source_word: עַמִּישַׁדָּי
  choice: Ammishadai
  rationale: Pangalan ng tao, kaya transliterado sa paraang madaling basahin sa Tagalog.
