source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: tl
  text: 'At para sa haing pangkapayapaan[a]: dalawang baka[b], limang lalaking tupa, limang lalaking kambing, at limang korderong tig-iisang taóng gulang. Ito ang handog ni Gamliel na anak ni Pedahzur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hain para sa mabuting ugnayan” o “hain para sa kagalingan.”
    reason: Iba-iba ang saklaw ng diwa ng Hebreong שְׁלָמִים; hindi lubusang naipahahayag ng iisang katumbas ang kapayapaan, mabuting ugnayan, at kagalingan.
  - marker: b
    text: Ang Hebreo ay tumutukoy sa dalawang hayop na kabilang sa mga baka; tradisyunal ding isinasalin na “dalawang toro.”
    reason: Kolektibo at mas malawak ang Hebreong בָּקָר kaysa sa katawagang tumutukoy lamang sa lalaking hayop o hayop na pantrabaho.
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: At para sa haing pangkapayapaan
  rationale: Pinananatili ng “At para sa” ang pagpapatuloy ng talaan. Ang “hain” ay tumutugma sa זֶבַח, at ang “pangkapayapaan” ay maikli at likas na salin ng teknikal na katawagang panghandog na שְׁלָמִים, habang inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Ang בָּקָר ay pangkalahatang tawag sa mga alagang bovine at hindi tahasang nagsasaad ng kasarian o gamit ng hayop. Sa modernong Filipino, maaaring gamitin ang “baka” bilang pangkalahatang katawagan.
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Tiyak na tumutukoy ang אֵילִים sa mga lalaking tupa; malinaw at pangkaraniwan ang pariralang Filipino.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Tumutukoy ang עַתֻּדִים sa mga lalaking kambing, kaya pinananatili ang kasariang tahasang nasa Hebreo.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang korderong tig-iisang taóng gulang
  rationale: Likas na ipinahahayag sa Filipino ang idyomang Hebreo na “mga anak ng isang taon” bilang edad na tig-iisang taon.
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Ang sugnay sa Hebreo ay walang hayag na pandiwa. Ang payak na “Ito ang handog” ay nagpapanatili sa anyo nito nang hindi ipinipilit kung pangkasalukuyan o pangnakaraan ang ipinahihiwatig.
- source_word: גַּמְלִיאֵל בֶּן פְּדָה־צוּר
  choice: Gamliel na anak ni Pedahzur
  rationale: Tuwirang inililipat sa baybay-Filipino ang mga personal na pangalan mula sa Hebreo, at natural na isinasalin ang בֶּן bilang “na anak ni.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang himig. Pinanatili ang maikli at paulit-ulit na anyo ng talaang panghandog. Ginamit ang “lalaking tupa” at “lalaking kambing” sa halip na mas luma o di-gaanong pangkaraniwang mga katawagan, at iniwasang lagyan ng tahasang panahunan ang walang-pandiwang sugnay na זֶה קָרְבַּן.
