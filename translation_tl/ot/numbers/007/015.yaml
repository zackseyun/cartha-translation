  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/015.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: tl
  text: isang toro mula sa kawan ng mga baka, isang lalaking tupa, at isang lalaking korderong isang taóng gulang, bilang handog na sinusunog;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Ang פַּר ay toro o batang toro, at ang idyomang בֶּן בָּקָר ay tumutukoy sa uri nitong baka. Likas sa modernong Tagalog ang “toro mula sa bakahan” at naiiwasan nito ang alanganing literal na “anak ng bakahan.”
- source_word: אַיִל
  choice: isang lalaking tupa
  rationale: Tumutukoy ito sa adultong lalaking tupa; malinaw at karaniwan sa Tagalog ang “lalaking tupa.”
- source_word: כֶּבֶשׂ
  choice: isang lalaking kordero
  rationale: Tumutukoy sa kordero at, sa kontekstong pansakripisyo, sa lalaking hayop. Pinananatili ng salin ang pagkakaiba nito sa adultong lalaking tupa.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Likas na saling Tagalog ng Hebreong idyoma para sa hayop na isang taon ang edad.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog sa altar. Ang pariralang ito ay malinaw at dignified sa modernong Tagalog nang hindi nagdaragdag ng interpretasyong denominasyonal.
- source_word: אֶחָד
  choice: isang
  rationale: Pinananatili ang paulit-ulit na bilang para sa bawat hayop ayon sa estilong imbentaryo ng Hebreo.
theological_decisions:
- issue: Saklaw ng terminong עֹלָה
  choice: handog na sinusunog
  alternative: buong handog na sinusunog
  rationale: Hindi idinagdag sa pangunahing teksto ang “buong” sapagkat hindi ito tahasang hiwalay na salita rito, bagaman likas sa uri ng handog na ito ang lubusang pagsunog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at angkop sa pormal na talaan ng mga handog. Ginamit ang “bakahan” para sa kolektibong kawan ng mga baka at pinanatili ang pagkakaiba ng adultong lalaking tupa at lalaking kordero.
