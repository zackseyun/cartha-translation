base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: tl
  text: At ang naghandog ng kaniyang handog sa unang araw ay si Naason na anak ni Aminadab, mula sa lipi ni Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “para sa lipi ni Juda.” Maaaring ipahiwatig ng pariralang Hebreo ang pagiging kabilang sa lipi o ang paghahandog bilang kaugnay o kinatawan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At ... ay
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang payak na “At” at pangungusap na may “ay,” sa halip na ang arkaikong “At nangyari.”
- source_word: הַמַּקְרִיב
  choice: ang naghandog
  rationale: Ang Hiphil participle ng קרב ay tumutukoy sa taong naglalapit o naghaharap ng handog. Ang “naghandog” ay malinaw at likas sa kontekstong pangkulto, bagaman hindi nito tahasang inuulit ang causative na anyo.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: sa unang araw
  rationale: Karaniwang ekspresyong temporal sa Filipino at tuwirang katumbas ng parirala.
- source_word: אֶת קָרְבָּנוֹ
  choice: ng kaniyang handog
  rationale: Ang קָרְבָּן ay handog na inihaharap sa Diyos sa konteksto ng pagtatalaga ng tabernakulo. Pinanatili ang pag-uulit na “naghandog ng ... handog” sapagkat makikita rin ito sa Hebreo at katanggap-tanggap sa Filipino.
- source_word: נַחְשׁוֹן
  choice: Naason
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: בֶּן עַמִּינָדָב
  choice: anak ni Aminadab
  rationale: Likas at tuwirang anyo ng patronimiko sa Filipino.
- source_word: לְמַטֵּה יְהוּדָה
  choice: para sa lipi ni Juda
  rationale: Ang מַטֶּה ay “lipi” sa kontekstong panlipi, at maaaring ipahiwatig ng לְ ang pagkilos ni Naason para sa o bilang kinatawan ng lipi. Pinananatili ng “para sa” ang ugnayang ito nang hindi ito ginagawang simpleng pinagmulan lamang.
theological_decisions:
- issue: Ugnayan ni Naason sa lipi ni Juda
  choice: para sa lipi ni Juda
  alternative: mula sa lipi ni Juda
  rationale: Maaaring ipahayag ng לְ ang representasyon o kaugnayan. Pinili ang “para sa” upang mapanatili ang posibilidad na naghahandog siya bilang kinatawan ng lipi, habang inilalahad sa talababa ang posibleng pagbasa bilang pagkakabilang sa lipi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniyang” bilang pormal ngunit pangkaraniwang anyo, at ang nakaugaliang mga pangalang Filipino na Naason, Aminadab, at Juda.
