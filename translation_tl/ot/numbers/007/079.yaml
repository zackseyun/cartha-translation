base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: Ang kanyang handog ay isang pinggang pilak[a] na tumitimbang ng isandaan at tatlumpung siklo, at isang mangkok na pilak[b] na tumitimbang ng pitumpung siklo, ayon sa siklo ng santuwaryo. Kapuwa ang mga ito ay puno ng pinong harina na hinaluan ng langis bilang handog na pagkaing butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mangkok na pilak.” Ang salitang Hebreo ay tumutukoy sa isang sisidlan, ngunit hindi lubos na tiyak ang eksaktong hugis nito.
    reason: lexical_alternative
  - marker: b
    text: O “mangkok na pilak para sa pagwisik,” kung bibigyang-diin ang ritwal na gamit ng sisidlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: ang kanyang handog
  rationale: Ang קָרְבָּן ay handog na inihaharap sa Diyos; natural at malinaw ang “handog” sa kontekstong pansakripisyo.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang pinggang pilak
  rationale: Ang קְעָרָה ay sisidlan na malamang na mababaw; ang “pinggan” ay natural sa Filipino, habang pinananatili sa talababa ang posibilidad na mangkok ang tinutukoy.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na tumitimbang ng isandaan at tatlumpung siklo
  rationale: Malinaw at natural nitong ipinahahayag ang literal na diwang “ang bigat nito ay isang daan at tatlumpu.”
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang mangkok na pilak
  rationale: Ang מִזְרָק ay ritwal na sisidlan; sapat na malawak at madaling maunawaan ang “mangkok” nang hindi ipinapalagay ang tiyak na gamit nito.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na tumitimbang ng pitumpung siklo
  rationale: Nililinaw na ang bilang ay bigat ng sisidlan, gaya ng hinihingi ng Hebreong parirala at ng kaagapay na sukat.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Pinananatili nito ang teknikal na pamantayan ng timbang na kaugnay ng santuwaryo.
- source_word: שְׁנֵיהֶם
  choice: kapuwa ang mga ito
  rationale: Tahasang tumutukoy sa dalawang sisidlan at natural sa modernong Filipino.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwang tumpak na katawagan sa harinang pinong giling na ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: hinaluan ng langis
  rationale: Natural at tiyak na paglalarawan sa harinang pinaghalo sa langis.
- source_word: לְמִנְחָה
  choice: bilang handog na pagkaing butil
  rationale: Sa kontekstong makasaserdote, ang מִנְחָה ay partikular na handog mula sa butil; iniiwasan ng saling ito ang maling impresyon na mga buo o hilaw na butil ang laman.
