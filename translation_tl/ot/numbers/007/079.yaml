  source_fidelity: 'Tumpak ang salin sa Hebreo: naipahayag ang dalawang sisidlang pilak, ang kani-kanilang timbang, ang pamantayan ng siklo ng santuwaryo, at ang pagkakapuno ng mga ito ng pinong harinang hinaluan ng langis para sa handog na pagkaing butil. Hindi nito pinipilit ang hindi tiyak na hugis o ritwal na gamit ng mga sisidlan.'
