  text: וְ/קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: At ang handog niya ay isang pinggang pilak[a] na tumitimbang ng 130 siklo, at isang mangkok na pilak[b] na tumitimbang ng 70 siklo, ayon sa siklo ng santuwaryo; kapuwa puno ng pinong harina na hinaluan ng langis bilang handog na butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mababaw na pinggan”; ang salitang Hebreo (קַעֲרָה) ay tumutukoy sa isang malapad at mababaw na sisidlan.
    reason: lexical_alternative
  - marker: b
    text: O “palanggana”; ang salitang Hebreo (מִזְרָק) ay katawagan sa isang sisidlang ginagamit sa ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: At ang handog niya ay
  rationale: Ang קָרְבָּן ay handog na inihaharap sa kontekstong panrelihiyon; pinananatili ng “At” ang payak na pang-ugnay na waw.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang pinggang pilak
  rationale: Ang קַעֲרָה ay isang malapad at mababaw na sisidlan; natural at madaling maunawaan ang “pinggan” sa modernong Filipino.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na tumitimbang ng 130 siklo
  rationale: Malinaw at natural na ipinapahayag nito ang bigat ng sisidlan habang tapat sa Hebreong pagtukoy sa timbang nito.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang mangkok na pilak
  rationale: Ang מִזְרָק ay sisidlang ginagamit sa ritwal; hindi tahasang binabanggit dito ang partikular na gamit nito, kaya ang pangkalahatan at natural na “mangkok” ang ginamit.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na tumitimbang ng 70 siklo
  rationale: Nililinaw sa natural na Filipino na ito ang bigat ng mangkok.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Pinananatili nito ang pamantayang panimbang na kaugnay ng santuwaryo nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: kapuwa puno
  rationale: Tahasang tinutukoy ng anyong Hebreo ang dalawang sisidlan; maikli at natural ang “kapuwa puno.”
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwang eksaktong katawagan sa harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Ipinahihiwatig ng balintiyak na participle na ang harina ay naihalo na sa langis.
- source_word: לְמִנְחָה
  choice: bilang handog na butil
  rationale: Sa kontekstong pangsaserdote, ang מִנְחָה ay partikular na handog mula sa butil, hindi lamang isang pangkalahatang handog.
