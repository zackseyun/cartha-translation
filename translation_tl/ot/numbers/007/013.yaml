translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “siklo” bilang tradisyonal na transliterasyon ng sinaunang yunit ng timbang at “santuwaryo” para sa terminong panrelihiyon. Ang mga bilang ay isinulat sa numerals para sa malinaw na pagbasa sa tekstong imbentaryo.
