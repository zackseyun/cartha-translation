  source_fidelity: 'Tumpak ang pangunahing nilalaman: isang sisidlang pilak na 130 siklo, isang ikalawang sisidlang pilak na 70 siklo ayon sa pamantayan ng santuwaryo, at kapwa puno ng pinong harinang hinaluan ng langis para sa handog na butil. Gayunman, ang “palanggana” ay karaniwang tumutukoy sa mas malaking labahan o palanggana sa modernong Filipino at maaaring magpahiwatig ng sukat o gamit na hindi itinatakda ng מִזְרָק.'
