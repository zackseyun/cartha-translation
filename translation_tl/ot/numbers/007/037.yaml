revisions:
- from: Ang handog niya ay isang platong pilak[a] na tumitimbang ng isandaan at tatlumpung siklo, at isang palangganang pilak[b] na tumitimbang ng pitumpung siklo, ayon sa siklo ng santuwaryo[c]. Kapwa puno ang mga ito ng pinong harina na hinaluan ng langis bilang handog na butil.
  to: Ang handog niya ay isang pinggang pilak[a] na tumitimbang ng isandaan at tatlumpung siklo, at isang mangkok na pilak[b] na tumitimbang ng pitumpung siklo, ayon sa siklo ng santuwaryo[c]. Kapwa puno ang mga ito ng pinong harina na hinaluan ng langis bilang handog na butil.
  rationale: Pinalitan ang mga katawagan ng sisidlan upang maging mas natural sa modernong Filipino at maiwasan ang sobrang pagtukoy sa sukat o gamit ng mga kagamitang Hebreo. Hindi binago ang bilang, timbang, pamantayan ng timbang, o uri ng handog; napanatili rin ang lahat ng talababa at kanilang mga anchor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:45:35Z'
