  terminology: Ang “handog,” “siklo,” “santuwaryo,” “pinong harina,” at “handog na butil” ay angkop at pare-pareho sa kontekstong pangkulto. Ang “mangkok” ay mas neutral at mas tumpak na modernong katumbas ng מִזְרָק kaysa “palanggana.”
