translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “siklo” bilang nakaugaliang transliterasyon ng sinaunang yunit ng timbang, at nilinaw sa talababa ang pamantayan ng santuwaryo. Ang lahat ng marker na [a]–[c] ay nasa pangunahing teksto.
