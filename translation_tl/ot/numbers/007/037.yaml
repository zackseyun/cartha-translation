base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: Ang handog niya ay isang pinggang pilak[a] na tumitimbang ng isandaan at tatlumpung siklo, at isang mangkok na pilak[b] na tumitimbang ng pitumpung siklo, ayon sa siklo ng santuwaryo[c]. Kapwa puno ang mga ito ng pinong harina na hinaluan ng langis bilang handog na butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “platong pilak” o “mababaw na mangkok na pilak.” Malawak ang maaaring tukuyin ng salitang Hebreo na קַעֲרָה.
    reason: lexical_alternative
  - marker: b
    text: Maaari rin itong tawaging “mangkok na pangwisik,” batay sa gamit ng sisidlang Hebreo na מִזְרָק sa ibang konteksto.
    reason: lexical_alternative
  - marker: c
    text: Ang “ayon sa siklo ng santuwaryo” ay nangangahulugang ayon sa pamantayang timbang na ginagamit sa santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Ang handog niya
  rationale: Likas at malinaw na katumbas ng handog na inihaharap sa konteksto ng pagsamba.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang platong pilak
  rationale: Maaaring tumukoy ang קְעָרָה sa plato, pinggan, o mababaw na mangkok; pinananatili ng “plato” ang karaniwang katawagan sa sisidlang ito nang hindi labis na tinutukoy ang hugis.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na tumitimbang ng isandaan at tatlumpung siklo
  rationale: 'Natural na Filipino para sa literal na nominal na pahayag na “ang timbang nito: isang daan at tatlumpu.”'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang palangganang pilak
  rationale: Ang מִזְרָק ay isang mangkok o palanggana para sa paglilingkod sa santuwaryo; malinaw ang “palanggana” bilang pangalan ng sisidlan nang hindi ipinapalagay ang tiyak na gamit nito rito.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na tumitimbang ng pitumpung siklo
  rationale: Tahasan at natural na ipinapakita na timbang ng ikalawang sisidlan ang pitumpung siklo.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Pinananatili ang kultikong pagtukoy at ipinahihiwatig na pamantayang timbang ng santuwaryo ang ginagamit.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Kapwa puno ang mga ito
  rationale: Malinaw na tumutukoy sa dalawang sisidlan at pinananatili ang diwa ng dual na שְׁנֵיהֶם.
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: pinong harina na hinaluan ng langis
  rationale: Tumpak at natural na paglalarawan sa uri ng harina at paghahanda nito.
- source_word: לְמִנְחָה
  choice: bilang handog na butil
  rationale: Sa kontekstong pari at paghahandog, tumutukoy ang מִנְחָה sa handog na mula sa butil.
