base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: tl
  text: At para sa haing pangkapayapaan:[a] dalawang baka, limang lalaking tupa, limang lalaking kambing, at limang korderong isang taóng gulang. Ito ang handog ni Elisama na anak ni Amihud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa kapayapaan,” “handog ng pakikipagkaisa,” o “handog para sa mabuting kalagayan.” Ang terminong Hebreo ay pangalan ng isang uri ng hain at kaugnay ng kapayapaan, kabuuan, at mabuting kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: At para sa handog na hain para sa mabuting ugnayan
  rationale: Ipinapakita ng וּלְ ang kasunod na bahagi ng talaan, at pinananatili ng “handog na hain” ang diwa ng זֶבַח. Ang “para sa mabuting ugnayan” ay likas na Tagalog na nagpapahiwatig ng kapayapaan, kabuuan, at pakikisamang kaugnay ng שְׁלָמִים nang hindi ito nililimitahan sa isang doktrinal na paliwanag.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Kolektibong tawag ang בָּקָר sa mga baka; hindi nito tiyak na sinasabing mga barakong baka ang tinutukoy.
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Tiyak na tumutukoy ang אֵילִם sa mga lalaking tupa.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Tumutukoy ang עַתֻּדִים sa mga lalaking kambing, kaya pinanatili ang kasarian.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang korderong isang taóng gulang
  rationale: Tumutukoy ang parirala sa limang kordero na isang taon ang edad. Hindi tahasang minarkahan dito ang kasarian, kaya hindi idinagdag ang “lalaki.”
- source_word: זֶה קָרְבַּן אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Ito ang handog ni Elisama na anak ni Amihud
  rationale: Natural na pagkakakilanlan ito sa Tagalog para sa sugnay na walang tahasang pandiwa; isinalin ang patronymic nang malinaw at tuwiran.
theological_decisions:
- issue: Kahulugan ng שְׁלָמִים
  choice: handog na hain para sa mabuting ugnayan
  alternative: handog para sa kapayapaan; handog para sa pakikipagkaisa
  rationale: Malawak ang saklaw ng terminong Hebreo at maaaring magpahiwatig ng kapayapaan, kagalingan, kabuuan, at pakikisamang ipinahahayag sa isang handog at salu-salong paghahain. Pinili ang pariralang hindi nagtatakda ng iisang teolohikal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “baka,” “lalaking tupa,” “lalaking kambing,” at “kordero,” habang pinanatili ang pormal na himig ng talaan ng mga handog.
