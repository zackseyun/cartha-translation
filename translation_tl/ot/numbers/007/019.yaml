  - severity: low
    issue: Ang “palangganang pilak” ay may di-angkop na karaniwang asosasyon.
    rationale: Maaaring tumukoy ang מִזְרָק sa mangkok o palanggana/basin, ngunit sa modernong Filipino mas natural ang “mangkok” para sa sisidlang ritwal sa talaang ito. Inilalagay ang “palanggana” bilang alternatibo sa talababa.
