base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: tl
  text: 'Iniharap niya ang kanyang handog: isang pinggang pilak[a] na tumitimbang ng 130 siklo; isang mangkok na pilak[b] na tumitimbang ng 70 siklo, ayon sa siklo ng santuwaryo[c]. Kapwa puno ang mga ito ng pinong harina na hinaluan ng langis para sa handog na butil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bandehang pilak.”
    reason: lexical_alternative
  - marker: b
    text: O “palangganang pilak.”
    reason: lexical_alternative
  - marker: c
    text: Ang “siklo ng santuwaryo” ang pamantayang timbang na ginagamit sa mga bagay na banal.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב
  choice: Iniharap
  rationale: Ang Hiphil ng קרב sa kontekstong paghahandog ay nangangahulugang ilapit o iharap; natural at marangal sa Filipino ang “iniharap.”
- source_word: קָרְבָּנוֹ
  choice: ang kanyang handog
  rationale: Karaniwang terminong pansakripisyo para sa bagay na inihaharap; malinaw at likas sa modernong Filipino ang “handog.”
- source_word: קַעֲרַת כֶּסֶף
  choice: pinggang pilak
  rationale: Tumutukoy sa isang malapad at mababaw na sisidlan; “pinggan” ang payak at natural na katumbas, habang nananatiling posible ang “bandeha.”
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na tumitimbang ng 130 siklo
  rationale: Malinaw na ipinahahayag ang bigat at ang hulaping pambabae ay tumutukoy sa unang sisidlan.
- source_word: מִזְרָק
  choice: palangganang pilak
  rationale: Isang ritwal na sisidlang malalim kaysa pinggan; ang “palanggana” ay nauunawaan ng karaniwang mambabasa at ang alternatibong “mangkok” ay inilagay sa talababa.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Ipinakikita nitong ang timbang ay sinusukat ayon sa opisyal na pamantayang ginagamit sa santuwaryo.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Kapwa puno ang mga ito
  rationale: Pinananatili ang tahasang pagtukoy ng Hebreo sa parehong sisidlan.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Karaniwang katumbas ng pininong harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Natural na modernong Filipino para sa paghahandang inilalarawan ng Hebreo.
- source_word: לְמִנְחָה
  choice: bilang handog na pagkaing butil
  rationale: Sa kontekstong pari, tumutukoy ang מִנְחָה sa natatanging handog na mula sa butil, hindi lamang sa pangkalahatang regalo o handog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa estilong talaan. Ginamit ang mga numerong 130 at 70 para madaling mabasa, at pinanatili ang “siklo” bilang sinaunang yunit ng timbang.
