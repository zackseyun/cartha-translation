  to: 'Iniharap niya ang kanyang handog: isang pinggang pilak[a] na tumitimbang ng 130 siklo; isang mangkok na pilak[b] na tumitimbang ng 70 siklo, ayon sa siklo ng santuwaryo[c]. Kapwa puno ang mga ito ng pinong harina na hinaluan ng langis para sa handog na butil.'
