lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang pariralang Hebreo ay isang idyomatikong tawag sa lalaking kambing. Ang “lalaking kambing” ay malinaw at likas sa modernong Filipino at pinananatili ang tiyak na uri ng hayop na inihahandog.
- source_word: אֶחָד
  choice: isang
  rationale: Tuwirang ipinapahayag ang bilang na isa at umaayon sa estilong nag-iisa-isa ng mga handog sa Bilang 7.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, ang חַטָּאת ay tumutukoy sa handog para sa kasalanan, hindi lamang sa abstraktong kasalanan. Ang “bilang” ay likas na nagpapahayag ng gamit o tungkulin ng hayop bilang handog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalaking kambing” sa pangunahing teksto dahil mas pangkaraniwan at madaling maunawaan kaysa “barakong kambing,” na inilagay bilang leksikal na alternatibo sa talababa.
