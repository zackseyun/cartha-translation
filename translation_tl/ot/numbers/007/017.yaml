  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: tl
  text: 'at para sa haing pangkapayapaan[a]: dalawang baka, limang lalaking tupa, limang lalaking kambing, at limang lalaking korderong isang taóng gulang. Ito ang handog ni Nahshon na anak ni Amminadab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “haing para sa mabuting ugnayan” o “haing para sa kagalingan.” Ang salitang Hebreo ay tumutukoy sa isang uri ng hain na karaniwang may kasamang pagkaing pinagsasaluhan bilang tanda ng kapayapaan at pakikipag-ugnayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: at para sa haing pangkapayapaan
  rationale: Ipinakikita ng mga unlapi ang karugtong na bagay sa talaan at ang layunin o uri ng hain. Ang “haing pangkapayapaan” ay maikli, likas sa Filipino, at pinananatili ang natatanging katawagang pansakripisyo ng שְׁלָמִים.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Ang בָּקָר ay kolektibong katawagan para sa mga baka at hindi tahasang tumutukoy sa kasarian; kaya hindi ito isinaling “mga toro.”
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Ang אֵילִם ay tahasang tumutukoy sa mga lalaking tupa; malinaw at pangkasalukuyan ang pariralang Filipino.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Ang עַתּוּדִים ay mga lalaking kambing, kaya pinanatili ang pagtukoy sa kasarian.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang korderong isang taóng gulang
  rationale: Tumpak at likas na ipinahahayag ng “isang taóng gulang” ang בְּנֵי שָׁנָה. Hindi idinagdag ang “lalaki” sapagkat walang hiwalay at tahasang panandang pangkasarian sa parirala.
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Ang sugnay na Hebreo ay walang hayag na pandiwa at literal na nagsasaad, “Ito [ang] handog ni.” Likas itong mapananatili sa Filipino nang hindi kailangang magdagdag ng panandang panahunan.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Nahshon na anak ni Amminadab
  rationale: Isinalin ang patronimikong בֶּן bilang “na anak ni” at pinanatili ang transliterasyon ng mga pangalang pantangi.
theological_decisions:
- issue: Saklaw ng kahulugan ng שְׁלָמִים
  choice: haing pangkapayapaan
  alternative: haing para sa mabuting ugnayan; haing para sa kagalingan
  rationale: Tradisyonal at madaling makilala ang “haing pangkapayapaan,” ngunit hindi nito lubos na sinasaklaw ang posibleng diwa ng pakikisama, kabuuan, o kagalingan. Inilagay ang mga leksikal na posibilidad sa talababa sa halip na pumili ng isang pagpapakahulugang teolohikal lamang.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na ayos para sa talaan ng mga hayop. Ginamit ang kinikilalang katawagang pansakripisyo na “haing pangkapayapaan,” habang nililinaw sa talababa ang mas malawak na saklaw ng salitang Hebreo. Pinanatiling walang panandang panahunan ang “Ito ang handog” upang umayon sa sugnay na Hebreong walang hayag na pandiwa.
