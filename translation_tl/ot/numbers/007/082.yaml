lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang pariralang Hebreo ay isang idyomatikong tawag sa lalaking kambing. Malinaw at natural sa makabagong Filipino ang “lalaking kambing” at pinananatili nito ang tiyak na kasarian ng hayop na inihahandog.
- source_word: אֶחָד
  choice: isang
  rationale: Tahasang pinananatili ang bilang na isa, alinsunod sa paulit-ulit at pormal na talaan ng mga handog sa Bilang 7.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong panghain, ang חַטָּאת ay tumutukoy sa uri ng handog na may kaugnayan sa kasalanan, hindi lamang sa abstraktong konsepto ng kasalanan. Ang “bilang” ay natural na naghahayag ng gamit o tungkulin ng hayop bilang handog.
