base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: tl
  text: Ang lahat ng hayop para sa handog na sinusunog ay labindalawang toro, labindalawang lalaking tupa, at labindalawang korderong tig-iisang taóng gulang, at ang kanilang handog na butil; at labindalawang lalaking kambing para sa handog para sa kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Maaaring idiin ng salitang Hebreo na חַטָּאת ang paglilinis mula sa karumihan gayundin ang kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר לָעֹלָה
  choice: Ang lahat ng hayop para sa handog na sinusunog
  rationale: Ipinahahayag ang kabuuang bilang ng mga hayop na ukol sa עֹלָה. Ginamit ang natural na terminong sakripisyal na “handog na sinusunog”; ang mas pangkalahatang “hayop” ay iniiwasang ulitin ang “baka” bago tukuyin ang mga toro, tupa, at kordero.
- source_word: פָּרִים
  choice: mga toro
  rationale: Tiyak na tumutukoy sa mga lalaking baka sa kontekstong sakripisyal.
- source_word: אֵילִם
  choice: mga lalaking tupa
  rationale: Malinaw na modernong Filipino para sa mga barakong tupa, nang hindi gumagamit ng di-pamilyar o rehiyonal na katawagan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: mga korderong tig-iisang taóng gulang
  rationale: Pinananatili ang uri at itinakdang edad ng bawat hayop sa natural na Filipino.
- source_word: וּמִנְחָתָם
  choice: kasama ang mga handog na butil para sa mga iyon
  rationale: Sa batas tungkol sa paghahandog, ang מִנְחָה ay karaniwang handog na butil. Nililinaw ng “para sa mga iyon” na ang hulaping panghalip ay tumutukoy sa mga naunang handog na sinusunog.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: at labindalawang lalaking kambing
  rationale: Pinananatili ang espesipikong kasarian ng mga kambing sa Hebreo.
- source_word: לְחַטָּאת
  choice: para sa handog para sa kasalanan
  rationale: Ito ang pinakakilala at kumbensiyonal na katawagan sa modernong Filipino, habang inilalahad sa talababa ang lehitimong diwa ng paglilinis.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring idiin ng terminong Hebreo kapuwa ang kasalanan at ang paglilinis mula sa karumihan. Pinili sa pangunahing teksto ang tradisyonal at madaling makilalang katawagan, ngunit pinanatili sa talababa ang tunay na alternatibong kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan ng talata at gumamit ng mga katawagang sakripisyal na madaling maunawaan. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
