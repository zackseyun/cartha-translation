  yaml_path: translation/ot/numbers/007/056.yaml
  text: one gold dish weighing ten shekels[a], full of incense;
translation:
  language: tl
  text: isang sisidlang ginto na tumitimbang ng sampung siklo[a] at punô ng insenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang sisidlang ginto, sampu, na punô ng insenso.” Hindi tahasang binabanggit dito sa Hebreo ang yunit ng timbang, ngunit sa paulit-ulit na pormulang ito ng paghahandog, sampung siklo ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sisidlan
  rationale: Sa konteksto ng mga handog sa tabernakulo, tumutukoy ito sa isang maliit na sisidlan para sa insenso. Mas malinaw sa modernong Filipino ang “sisidlan” kaysa sa literal o tradisyonal na “kutsara.”
- source_word: אַחַת
  choice: isang
  rationale: Pangunahing bilang na kaayon ng pambabaeng pangngalang כַּף.
- source_word: עֲשָׂרָה
  choice: sampung siklo
  rationale: Sampu ang tahasang bilang, samantalang ipinahihiwatig lamang sa Hebreo ang yunit ng timbang. Batay sa paulit-ulit na pormula sa Bilang 7, ang yunit ay siklo.
- source_word: זָהָב
  choice: ginto
  rationale: Tinutukoy ang materyal na yari ang sisidlan.
- source_word: מְלֵאָה
  choice: punô ng
  rationale: Likas at maikling paglalarawan sa nilalaman ng sisidlan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang katawagan sa mabangong sangkap na inihahandog sa pagsamba.
