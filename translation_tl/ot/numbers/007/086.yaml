base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: tl
  text: labindalawang sisidlang ginto na punô ng insenso[a], na bawat sisidlan ay may bigat na sampung siklo ayon sa siklo ng santuwaryo; ang kabuuang bigat ng ginto ng mga sisidlan ay isandaan at dalawampung siklo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga mangkok,” “mga bandeha,” o, ayon sa tradisyon, “mga kutsara”—mga sisidlan para sa insenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: mga sisidlan
  rationale: Sa konteksto ng mga handog para sa tabernakulo, tumutukoy ang כַּף sa maliliit na sisidlan para sa insenso. Likas at hindi labis na tiyak ang “sisidlan” sa makabagong Filipino.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katawagan sa materyal na yari ang mga sisidlan.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: labindalawa
  rationale: Pamilang na nagsasaad sa kabuuang bilang ng mga sisidlan.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: punô ng insenso
  rationale: Tumpak at likas na pagsasalin ng pariralang nagsasabing ang mga sisidlan ay punô ng insenso.
- source_word: עֲשָׂרָה עֲשָׂרָה
  choice: bawat ... sampu
  rationale: 'Ang pag-uulit ng bilang sa Hebreo ay distributibo: sampung siklo ang bigat ng bawat isang sisidlan.'
- source_word: הַכַּף
  choice: sisidlan
  rationale: Ang anyong isahan ay tumutukoy sa bawat sisidlan sa distributibong pahayag.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Pinananatili nito ang teknikal na diwa ng opisyal na pamantayan ng timbang na ginagamit sa santuwaryo.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: ang kabuuang bigat ng ginto ng mga sisidlan
  rationale: Ipinahahayag ng parirala ang kabuuang dami ng gintong bumubuo sa mga sisidlan; idinagdag ang “bigat” para maging malinaw sa Filipino ang sinusukat.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: isandaan at dalawampung siklo
  rationale: Ang bilang ay 120; ang yunit na “siklo” ay likas na ipinagpapatuloy mula sa naunang sukat.
