lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: isang toro mula sa kawan ng baka
  rationale: Ang פַּר ay toro o batang toro, at ang idyomang בֶּן בָּקָר ay tumutukoy sa pinagmulan nitong kawan ng baka. Natural sa modernong Tagalog ang pariralang ito at iniiwasan nito ang alanganing literal na ‘anak ng baka.’
- source_word: אַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Ang אַיִל ay adultong lalaking tupa. Mas madaling maunawaan ng karaniwang mambabasa ang ‘lalaking tupa’ kaysa sa mas teknikal na ‘barakong tupa.’
- source_word: כֶּבֶשׂ אֶחָד
  choice: isang lalaking kordero
  rationale: Sa konteksto ng paghahandog, ang כֶּבֶשׂ ay kordero at karaniwang tumutukoy sa lalaki; tahasang ipinapakita ng salin ang kasarian ng hayop.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Natural na salin ito ng Hebreong idyoma para sa hayop na isang taon ang edad, habang itinatala sa talababa ang posibleng pagbasa na nasa unang taon nito.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog sa altar. Ang ‘bilang’ ay angkop sa anyong talaan at malinaw na nagsasaad ng layunin ng mga hayop.
- source_word: אֶחָד
  choice: isang
  rationale: Pinananatili ang paulit-ulit na bilang para sa bawat hayop sa talaan.
theological_decisions:
- issue: Saklaw ng terminong עֹלָה
  choice: handog na sinusunog
  alternative: handog na lubusang sinusunog
  rationale: Pinili ang maikli at natural na katawagan sa pangunahing teksto. Hindi nito nilulutas o binabago ang ritwal na kahulugan; ang termino ay tumutukoy sa handog na sinusunog sa altar.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa ritwal na talaan. Ginamit ang ‘kawan ng baka,’ ‘lalaking tupa,’ at ‘lalaking kordero’ upang maging tiyak ngunit madaling maunawaan; kapuwa lumilitaw sa pangunahing teksto ang mga marker na [a] at [b].
