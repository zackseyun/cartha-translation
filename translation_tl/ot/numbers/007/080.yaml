  text: isang mangkok na ginto na tumitimbang ng sampung siklo[a], punô ng insenso[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang gintong sisidlan, sampung ginto, punô ng insenso.” Nauunawaan mula sa pormula ng talaan ng mga handog sa kabanatang ito na “siklo” ang yunit ng timbang.
    reason: lexical_alternative
  - marker: b
    text: Madalas isalin sa tradisyonal na mga salin ang כַּף bilang “kutsara,” ngunit dito ay tumutukoy ito sa isang maliit na sisidlan o mangkok na lalagyan ng insenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sisidlan
  rationale: Sa konteksto ng mga handog para sa tabernakulo, tumutukoy ito sa isang maliit na lalagyan ng insenso. Mas malinaw sa makabagong Filipino ang “sisidlan” kaysa literal o tradisyonal na “kutsara.”
- source_word: אַחַת
  choice: isang
  rationale: Pangunahing bilang na umaayon sa tinutukoy na sisidlan.
- source_word: עֲשָׂרָה זָהָב
  choice: tumitimbang ng sampung siklo
  rationale: Eliptiko ang Hebreo at hindi tahasang binabanggit ang yunit ng timbang; ipinahihiwatig ng paulit-ulit na pormula sa kabanata na siklo ang yunit. Nililinaw ng “tumitimbang” na bigat, hindi halaga o dami, ang tinutukoy.
- source_word: זָהָב
  choice: ginto
  rationale: Ipinahahayag ang materyal ng sisidlan sa natural na pariralang Filipino na “sisidlang ginto.”
- source_word: מְלֵאָה
  choice: punô ng
  rationale: Likas at tuwirang salin ng pang-uring nagsasaad ng laman ng sisidlan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang katawagan sa Filipino para sa mabangong sangkap na ginagamit sa kontekstong pangsamba.
