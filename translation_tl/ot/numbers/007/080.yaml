translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Pinili ang “sisidlang ginto” bilang natural na paglalarawan sa materyal, at ang “tumitimbang ng” upang malinaw na maipakita ang eliptikong sukat sa Hebreo. Ginamit ang “siklo” bilang nakasanayang transliterasyon ng yunit na shekel.
