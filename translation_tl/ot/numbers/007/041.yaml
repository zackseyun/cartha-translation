  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: tl
  text: 'At para sa haing pangkapayapaan[a]: dalawang baka[b], limang lalaking tupa, limang lalaking kambing, at limang isang-taóng-gulang na lalaking kordero. Ito ang handog ni Selumiel na anak ni Zurisadai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa mabuting ugnayan” o “handog para sa kagalingan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay malawak na katawagan para sa mga baka; hindi nito tiyak na sinasabing mga barakong baka ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: At para sa haing handog para sa kapayapaan
  rationale: Ipinahihiwatig ng וּלְ ang kasunod na aytem sa talaan. Pinananatili ng “haing handog” ang diwang ritwal ng זֶבַח, samantalang ang “para sa kapayapaan” ay isang maikli at nakikilalang salin ng teknikal na katawagang שְׁלָמִים; inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Ang בָּקָר ay malawak at kolektibong katawagan para sa mga baka, hindi tiyak na mga barakong baka lamang. Likas at sapat ang “dalawang baka” sa Filipino.
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Ang אֵילִים ay tumutukoy sa mga lalaking tupa; tahasang pinananatili ang kasarian sa salin.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Ang עַתֻּדִים ay partikular na mga lalaking kambing, kaya pinananatili ang kasarian.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang isang-taóng-gulang na lalaking kordero
  rationale: Pinananatili ang bilang, kasarian, at edad na ipinahahayag ng pariralang Hebreo; karaniwan at malinaw sa Filipino ang “isang-taóng-gulang.”
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Ang demonstratibong pormula ay natural na isinasalin sa Filipino sa kasalukuyang anyong “Ito ang,” at ang קָרְבָּן ay pangkalahatang “handog.”
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: Selumiel na anak ni Zurisadai
  rationale: Isinulat ang mga pangalang Hebreo ayon sa madaling bigkasing kumbensiyong Filipino, at literal na pinanatili ang ugnayang “anak ni.”
theological_decisions:
- issue: Saklaw ng kahulugan ng שְׁלָמִים
  choice: handog para sa kapayapaan
  alternative: handog para sa mabuting ugnayan; handog para sa kagalingan
  rationale: Ang terminong Hebreo ay maaaring magpahiwatig ng kapayapaan, mabuting ugnayan, kabuuan, o kagalingan. Ginamit sa teksto ang tradisyonal at maikling katawagan, ngunit hindi ikinubli ang tunay na lawak ng kahulugan sa pamamagitan ng talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan ng mga hain at ang teknikal na katangian ng bokabularyong pangritwal nang hindi gumagamit ng masyadong arkaikong pananalita.
