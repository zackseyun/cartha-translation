  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: tl
  text: Noong ikaapat na araw, ang pinuno[a] ng mga anak ni Ruben[b] ay si Elizur na anak ni Sedeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pangunahing pinuno” o, ayon sa tradisyon, “prinsipe”; ang salitang Hebreo ay tumutukoy sa opisyal na pinuno ng lipi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa mga anak ni Ruben”; maaaring ipahiwatig dito ng pang-ukol sa Hebreo ang kaugnayan o pagkatawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: Nang ikaapat na araw
  rationale: Likas na modernong Tagalog para sa temporal na pariralang Hebreo na tumutukoy sa araw kung kailan naganap ang paghahandog.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy sa kinikilalang opisyal na ulo ng lipi; malinaw ang “pinuno” at hindi nagmumungkahi ng maharlikang katayuang maaaring ipahiwatig ng “prinsipe.”
- source_word: לִבְנֵי רְאוּבֵן
  choice: ng mga anak ni Ruben
  rationale: Pinananatili ang pampamilyang-pangliping pananalita ng Hebreo at ipinahahayag ang kaugnayan ng pinuno sa mga inapo ni Ruben.
- source_word: אֱלִיצוּר
  choice: Elizur
  rationale: Transliterasyon ng personal na pangalan.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang natural na anyo sa Tagalog para sa Hebreong patronimiko.
- source_word: שְׁדֵיאוּר
  choice: Sedeur
  rationale: Transliterasyon ng personal na pangalan na iniangkop sa karaniwang baybay at bigkas sa Filipino.
