base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: tl
  text: 'at bilang hain para sa kapayapaan[a]: dalawang baka[b], limang lalaking tupa, limang lalaking kambing, at limang lalaking korderong tig-iisang taóng gulang. Ito ang handog ni Pagiel na anak ni Ocran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hain para sa mabuting ugnayan” o “hain para sa kagalingan.” Ang Hebreong katawagan ay tradisyonal na isinasaling “hain para sa kapayapaan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dalawang toro.” Pangkalahatang katawagan para sa mga baka ang salitang Hebreo at hindi nito tahasang tinutukoy ang kasarian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים
  choice: at bilang hain para sa kapayapaan
  rationale: Ipinakikilala ng pang-ugnay at pang-ukol ang kasunod na bahagi ng talaan. Ang “hain para sa kapayapaan” ay natural at kinikilalang katawagan sa uring ito ng hain, habang pinananatili sa talababa ang iba pang posibleng diwa ng שְׁלָמִים.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Ang בָּקָר ay pangkalahatang katawagan para sa mga hayop na baka at hindi tahasang tumutukoy sa kasarian; kaya hindi ito nilimitahan sa “dalawang toro.”
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Ang אֵילִם ay tumutukoy sa mga lalaking tupa. Ang pariralang ito ay mas malinaw sa karaniwang Tagalog kaysa sa isang teknikal o makalumang katawagan.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Ang עַתֻּדִים ay partikular na tumutukoy sa mga lalaking kambing; pinananatili ng salin ang pagkakaibang ito.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang lalaking korderong tig-iisang taóng gulang
  rationale: Ang כְּבָשִׂים ay mga lalaking kordero, at ang בְּנֵי שָׁנָה ay nangangahulugang isang taóng gulang. Nililinaw ng “tig-iisang” na ganito ang edad ng bawat isa.
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Ito ang pangwakas na pormula sa paulit-ulit na talaan. Natural sa Tagalog ang walang tahasang panandang pangnagdaan sa nominal na pangungusap na ito.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: Pagiel na anak ni Ocran
  rationale: Pinananatili ang kinikilalang transliterasyon ng mga pangalang pantangi, at natural na isinasalin ang patronimiko bilang “na anak ni.”
theological_decisions:
- issue: Kahulugan ng הַשְּׁלָמִים bilang katawagang panghain
  choice: hain para sa kapayapaan
  alternative: hain para sa mabuting ugnayan; hain para sa kagalingan
  rationale: Malawak ang saklaw ng terminong Hebreo at maaaring magpahiwatig ng kapayapaan, mabuting kalagayan, o pakikipag-ugnayan. Ginamit sa teksto ang pamilyar na katawagan ngunit hindi isinara ang kahulugan; nakatala sa talababa ang mga lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga karaniwang katawagan sa hayop at iniwasan ang makaluma o labis na teknikal na bokabularyo. Ang ayos ng talaan at ang pangwakas na pormula ay malapit sa Hebreo ngunit natural basahin sa Tagalog.
