  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: tl
  text: Noong ikasiyam na araw, ang pinuno[a] ng mga anak ni Benjamin ay si Abidan na anak ni Gideoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinuno para sa mga anak ni Benjamin.” Ang Hebreong pang-ukol ay maaaring magpahiwatig ng pagkatawan o kaugnayan sa pariralang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: Nang ikasiyam na araw
  rationale: Likas na temporal na pananalita sa modernong Filipino para sa Hebreong pariralang tumutukoy sa araw kung kailan naganap ang paghahandog.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy sa kinikilalang pinuno ng lipi; malinaw ito at walang maharlikang pahiwatig na maaaring idulot ng “prinsipe.”
- source_word: לִבְנֵי בִנְיָמִן
  choice: ng mga anak ni Benjamin
  rationale: Pinananatili ang panlalaking katawagang pampamilya ng Hebreo at ipinahahayag ang kaugnayan ng pinuno sa pangkat na nagmula kay Benjamin. Maaari ring ipahiwatig ng ל ang representasyon, ngunit natural na saklaw iyon ng pariralang Filipino sa kontekstong ito.
- source_word: אֲבִידָן
  choice: Abidan
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang anyo sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Natural at tiyak na anyong Filipino para sa Hebreong patronimiko.
- source_word: גִּדְעֹנִי
  choice: Gideoni
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang anyo sa Filipino.
theological_decisions:
- issue: Panlalaking katawagang panlipi na בְנֵי
  choice: mga anak ni Benjamin
  alternative: mga Benjaminita / ang lipi ni Benjamin
  rationale: Pinananatili ang tahasang katawagang pampamilya at panlalaki ng Hebreo, habang nananatiling malinaw na ito ay tumutukoy sa pangkat na nagmula kay Benjamin.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Ginamit ang “Nang ikasiyam na araw” bilang likas na temporal na pambungad at “pinuno” bilang di-maharlikang katawagan sa tribal na lider.
