  yaml_path: translation/ot/numbers/007/072.yaml
  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: tl
  text: Noong ikalabing-isang araw, ang pinuno ng mga anak ni Asher ay si Pagiel na anak ni Ocran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/יוֹם֙ עַשְׁתֵּ֣י עָשָׂ֣ר י֔וֹם
  choice: Nang ikalabing-isang araw
  rationale: Likas na isinasalin sa Filipino bilang panandang panahon na may ordinal ang paulit-ulit na pormulang Hebreo sa Bilang 7; hindi na kailangang ulitin ang salitang “araw.”
- source_word: נָשִׂ֖יא
  choice: pinuno
  rationale: Tumutukoy ito sa kinikilalang pinuno ng lipi. Malinaw at makabago ang “pinuno” at iniiwasan nito ang maharlikang pahiwatig ng “prinsipe.”
- source_word: לִ/בְנֵ֣י אָשֵׁ֑ר
  choice: ng mga anak ni Asher
  rationale: Pinananatili nito ang ekspresyong pangkamag-anakan ng Hebreo at ipinakikitang ang pinuno ay kabilang sa at kumakatawan sa lipi ni Asher.
- source_word: פַּגְעִיאֵ֖ל
  choice: Pagiel
  rationale: Ginamit ang nakagawiang anyo ng personal na pangalan sa mga saling Filipino.
- source_word: בֶּן עָכְרָֽן
  choice: anak ni Ocran
  rationale: Ang patronimikong Hebreo na בֶּן ay natural na isinasaling “anak ni”; pinanatili ang nakagawiang anyo ng pangalang Ocran.
