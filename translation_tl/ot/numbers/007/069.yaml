  yaml_path: translation/ot/numbers/007/069.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: tl
  text: isang toro mula sa kawan ng baka, isang lalaking tupa, at isang lalaking korderong isang taóng gulang, bilang handog na sinusunog;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Ang פַּר ay toro o batang toro, at ang idyomang בֶּן בָּקָר ay tumutukoy sa uri nito bilang mula sa mga baka. Likas sa modernong Tagalog ang “mula sa bakahan” at napapanatili nito ang klasipikasyong nasa Hebreo.
- source_word: אַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Ang אַיִל ay adultong lalaking tupa; mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa mas di-pamilyar na “barako” sa kontekstong ito.
- source_word: כֶּבֶשׂ אֶחָד
  choice: isang lalaking kordero
  rationale: Ang כֶּבֶשׂ ay kordero at karaniwang tumutukoy sa lalaking hayop sa mga tekstong panghandog; tahasang ipinahayag ang kasarian upang maging malinaw sa Tagalog.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Idyoma ito para sa edad ng hayop. Ang “isang taóng gulang” ang natural at eksaktong katumbas sa modernong Tagalog.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na sinusunog nang buo sa altar. Ang maikli at pamilyar na katawagang “handog na sinusunog” ay angkop sa anyong talaan ng talata.
- source_word: אֶחָד
  choice: isang
  rationale: Inulit ang bilang sa bawat hayop; pinanatili ang pag-uulit upang masundan ang estruktura at diin ng Hebreong talaan.
theological_decisions:
- issue: Kahulugan ng עֹלָה bilang katawagang panghandog
  choice: handog na sinusunog
  alternative: handog na paakyat
  rationale: Bagaman kaugnay ang salita sa pag-akyat, isa itong nakatakdang katawagang pangritwal para sa handog na sinusunog. Hindi ginawang “handog na paakyat” upang maiwasan ang di-likas at posibleng mapanlinlang na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na pinananatili ang maikli at paulit-ulit na anyo ng listahang panghandog. Ginamit ang “kordero” bilang karaniwang terminong biblikal ngunit madaling maunawaan; iniwasan ang sobrang literal na “anak ng bakahan.”
