  text: one golden dish of ten shekels[a], full of incense;
translation:
  language: tl
  text: isang gintong sisidlan na may bigat na sampung siklo[a], na puno ng insenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang gintong sisidlan, sampu, na puno ng insenso.” Idinagdag ang “siklo” batay sa karaniwang pormula ng handog sa kalapit na konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sisidlan
  rationale: Sa konteksto ng mga kagamitang pangtabernakulo, tumutukoy ito sa isang maliit na lalagyan para sa insenso. Mas malinaw at natural sa Filipino ang “sisidlan” kaysa literal na “palad” o mas tiyak ngunit di-tiyak na “mangkok” o “kutsara.”
- source_word: אַחַת
  choice: isang
  rationale: Tuwirang salin ng bilang na tumutukoy sa pambabaeng pangngalang כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: gintong … na may bigat na sampung siklo
  rationale: Ang tekstong Hebreo ay eliptiko, literal na “ginto, sampu.” Ipinahihiwatig ng paulit-ulit na pormula sa kalapit na mga talata na timbang sa mga siklo ang tinutukoy.
- source_word: מְלֵאָה
  choice: na puno ng
  rationale: Natural na panaguring Filipino para sa sisidlang naglalaman ng insenso.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang salin para sa mabangong sangkap na ginagamit sa pagsamba sa santuwaryo.
