translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sisidlan” bilang neutral na tawag sa maliit na kagamitang panritwal, at malinaw na ipinahayag ang ipinahihiwatig na yunit ng timbang habang pinananatili sa talababa ang literal na anyo ng Hebreo.
