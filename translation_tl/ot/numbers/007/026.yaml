  source_fidelity: 'Tapat ang salin sa Hebreong parirala: isang sisidlang ginto, na may ipinahihiwatig na timbang na sampu, at puno ng insenso. Ang pagsuplay ng “siklo” ay malinaw na minarkahan at sinusuportahan ng paulit-ulit na pormula sa agarang konteksto.'
