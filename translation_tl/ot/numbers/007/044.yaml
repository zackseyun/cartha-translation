  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: tl
  text: isang sisidlang yari sa ginto na tumitimbang ng sampung siklo[a], punô ng insenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang sisidlang ginto, sampung ginto, punô ng insenso.” Ang “siklo” ay idinagdag mula sa paulit-ulit na pormula ng timbang sa kabanatang ito upang luminaw ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sisidlan
  rationale: Sa paulit-ulit na talaan sa Bilang 7, tumutukoy ito sa isang maliit na lalagyan ng insenso. Ang “sisidlan” ay natural at hindi labis na nagtatakda kung ito ay mangkok, pinggan, o kutsara.
- source_word: אַחַת
  choice: isang
  rationale: Karaniwang bilang na kaayon ng pambabaeng pangngalang כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: may timbang na sampung siklo
  rationale: Sa pormula ng talaang ito, ang bilang na kasama ng materyal ay nagpapahayag ng timbang. Ipinahiwatig ng konteksto ng kabanata ang yunit na siklo, kaya isinama ito sa teksto para maging malinaw.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang inilalarawan ang materyal na yari sa ginto.
- source_word: מְלֵאָה
  choice: punô ng
  rationale: Maikli at likas na pananalita para sa pang-uring nagsasaad ng laman ng sisidlan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang makabagong salin para sa mabangong sangkap na inihahandog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan at ang pangwakas na tuldok-kuwit. Ginamit ang “sisidlan” upang hindi labis na tukuyin ang eksaktong hugis ng כַּף.
