  text: isang lalaking kambing bilang handog para sa kasalanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang parirala ay tumutukoy sa kambing na lalaki sa konteksto ng paghahandog. Likas at malinaw sa makabagong Tagalog ang “lalaking kambing,” at napapanatili nito ang kasariang tahasang ipinahihiwatig ng Hebreo.
- source_word: אֶחָד
  choice: isang
  rationale: Tahasan ang bilang na isa sa Hebreo at mahalaga ito sa talaan ng mga handog. Ang “isang” ang natural na katumbas sa Tagalog.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, ang חַטָּאת ay tumutukoy sa handog ukol sa kasalanan, hindi lamang sa abstraktong kasalanan. Ang “bilang” ay likas na naghahayag ng gamit ng hayop bilang handog.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa kontekstong pangkulto
  choice: handog para sa kasalanan
  alternative: para sa kasalanan
  rationale: Dahil bahagi ito ng talaan ng mga hayop at handog, kailangan ang kahulugang pansakripisyo. Hindi nito dinaragdagan ang teksto ng isang natatanging doktrinal na paliwanag.
translation_notes:
  register: Maikli, marangal, at natural na makabagong Tagalog. Pinanatili ang anyong parirala ng talaan at ang tahasang bilang at kasarian ng hayop.
