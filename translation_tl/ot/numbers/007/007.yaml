  text: אֵ֣ת שְׁתֵּ֣י הָ/עֲגָלֹ֗ת וְ/אֵת֙ אַרְבַּ֣עַת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י גֵרְשׁ֑וֹן כְּ/פִ֖י עֲבֹדָתָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/007.yaml
  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: tl
  text: Ibinigay niya ang dalawang kariton[a] at ang apat na baka[b] sa mga anak ni Gershon, ayon sa kanilang paglilingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalawang karwahe.”
    reason: lexical_alternative
  - marker: b
    text: O “apat na bakang pantrabaho.” Kolektibong tawag sa mga hayop na bovine ang salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: mga kariton
  rationale: Ang עֲגָלָה ay sasakyang may gulong na ginagamit sa paghakot. Natural sa modernong Filipino ang “kariton” sa konteksto ng pagdadala ng mga kagamitan; maaari rin itong tawaging “karwahe,” gaya ng nasa talababa.
- source_word: הַבָּקָר
  choice: mga baka
  rationale: Ang בָּקָר ay kolektibong tawag sa mga hayop na bovine. Pinananatili ng “mga baka” ang pangkalahatang diwa nang hindi tiyakang sinasabing lalaki o kinapon ang mga ito; posible sa konteksto ang “mga bakang pantrabaho,” ngunit mas mapagpakahulugan iyon.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: sa mga anak ni Gershon
  rationale: Tuwirang pinananatili nito ang anyong pampamilya ng Hebreo, “mga anak ni Gershon,” sa halip na palitan ng katawagang pangkat tulad ng “mga Gershonita.”
- source_word: כְּפִי עֲבֹדָתָם
  choice: ayon sa kanilang paglilingkod
  rationale: Ang כְּפִי ay nangangahulugang “ayon sa,” at ang עֲבֹדָה rito ay tumutukoy sa paglilingkod o tungkulin nila kaugnay ng tabernakulo. Ang “paglilingkod” ay malapit sa Hebreo at angkop sa sagradong konteksto.
- source_word: נָתַן
  choice: Ibinigay niya
  rationale: Payak na “ibinigay” ang pangunahing kahulugan ng pandiwa. Hindi ginamit ang “itinalaga” upang maiwasang magdagdag ng diwang hindi tahasang nasa pandiwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang payak na ayos ng Hebreo at ang katawagang “mga anak ni Gershon,” habang iniwasan ang labis na pagtukoy sa kasarian o uri ng mga baka.
