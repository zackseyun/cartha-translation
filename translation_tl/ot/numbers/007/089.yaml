  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: tl
  text: Nang pumasok si Moises sa Tolda ng Tipanan upang makipag-usap sa kanya, narinig niya ang tinig na nagsasalita sa kanya mula sa ibabaw ng takip ng pagbabayad-sala[a] na nasa ibabaw ng kaban ng patotoo, mula sa pagitan ng dalawang kerubin. At nagsalita siya sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “takip ng pagbabayad-sala” ay ang takip ng kaban, na kaugnay ng ritwal ng pagbabayad-sala; mula sa pagitan ng mga kerubin ay nagsasalita ang Diyos.
    reason: cultural_note
  - marker: b
    text: Hindi tahasang binabanggit sa Hebreo ang paksa ng “nagsalita.” Malamang na tumutukoy ito sa Diyos o sa tinig; maaari rin itong isalin, “At ang tinig ay nagsalita sa kanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: Nang pumasok si Moises
  rationale: Ang ב na may infinitive construct ng בוא ay bumubuo ng sugnay na temporal. Likas sa Tagalog ang “Nang pumasok” at angkop sa naganap na salaysay.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Ipinahahayag nito ang itinakdang santuwaryong lugar ng pakikipagtagpo ng Diyos sa kanyang bayan; natural at pamilyar itong katawagan sa makabagong Tagalog.
- source_word: לְדַבֵּר אִתּוֹ
  choice: upang makipag-usap sa kanya
  rationale: Pinananatili ng “makipag-usap” ang relational o kapwa-harapang pahiwatig ng אִתּוֹ, habang hindi tahasang pinapangalanan ang tinutukoy ng panghalip.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: narinig niya ang tinig
  rationale: Bagaman maaaring mangahulugang “tunog” ang קוֹל, malinaw na “tinig” ang mas angkop dahil sinusundan ito ng participleng “nagsasalita.”
- source_word: מִדַּבֵּר
  choice: na nagsasalita
  rationale: Aktibong participle ang payak na pagbasa at inilalarawan nito ang tinig. Pinananatili ng salin ang masiglang anyo ng Hebreo.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: mula sa ibabaw ng takip ng pakikipagkasundo
  rationale: Ang כַּפֹּרֶת ay ang natatanging takip ng kaban at may kaugnayan sa ritwal ng pakikipagkasundo. Mas malinaw sa ordinaryong mambabasa ang “takip ng pakikipagkasundo” kaysa transliterasyon o literal na “luklukan ng awa.”
- source_word: אֲרֹן הָעֵדֻת
  choice: kaban ng patotoo
  rationale: Pinananatili nito ang legal at tipanang diwa ng עֵדֻת nang hindi pinalalawak sa mismong salin ang tinutukoy nitong mga tapyas.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: mula sa pagitan ng dalawang kerubin
  rationale: Ang “kerubin” ang nakaugaliang transliterasyon sa Filipino para sa mga nilalang na כְּרֻבִים; hindi ito pinapalitan ng mas pangkalahatang “anghel.”
- source_word: וַיְדַבֵּר אֵלָיו
  choice: At nagsalita siya kay Moises
  rationale: Ang malamang na paksa ay ang banal na tagapagsalita, ngunit hindi siya tahasang pinapangalanan sa Hebreo. Nililinaw lamang ang tatanggap na si Moises upang maiwasan ang malabong dalawang “kanya,” habang pinananatili ang “siya” para sa paksa.
theological_decisions:
- issue: Tinutukoy ng mga panghalip at paksa ng huling pandiwa
  choice: Ang banal na tinig ang nagsasalita kay Moises; pinanatiling “siya” ang hindi tahasang paksa ng huling pandiwa.
  alternative: 'Maaaring unawain ang huling sugnay bilang “at ang tinig ay nagsalita sa kanya,” o gawing si Moises ang paksa: “at nagsalita siya sa Kanya.”'
  rationale: Ang pinagmumulan ng tinig—sa ibabaw ng takip, sa pagitan ng mga kerubin—ay nagpapahiwatig na Diyos ang tagapagsalita. Gayunman, walang tahasang pangngalang paksa sa huling Hebreong pandiwa, kaya hindi ipinalit ang “ang PANGINOON.”
- issue: Kahulugan ng כַּפֹּרֶת
  choice: takip ng pakikipagkasundo
  alternative: luklukan ng awa; panakip ng kaban
  rationale: Tinutukoy nito ang aktuwal na takip ng kaban na kaugnay ng ritwal ng pagtubos o pakikipagkasundo. Iniiwasan ng napiling salin ang larawan ng literal na upuan ngunit hindi binubura ang teolohikal na kaugnayan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda,” “kaban,” “patotoo,” at “kerubin” bilang mga katawagang biblikal na madaling makilala. Iniwasang tahasang idagdag ang “PANGINOON” sa pangunahing teksto dahil hindi ito nakasulat sa talata, at gumamit ng talababa upang mapanatili ang tunay na kalabuan ng huling sugnay.
