revisions:
- from: Nang pumasok si Moises sa toldang tipanan upang makipag-usap sa kanya, narinig niya ang tinig na nagsasalita sa kanya mula sa ibabaw ng takip ng pakikipagkasundo[a] na nasa ibabaw ng kaban ng patotoo, mula sa pagitan ng dalawang kerubin. At nagsalita siya kay Moises.[b]
  to: Nang pumasok si Moises sa Tolda ng Tipanan upang makipag-usap sa kanya, narinig niya ang tinig na nagsasalita sa kanya mula sa ibabaw ng takip ng pagbabayad-sala[a] na nasa ibabaw ng kaban ng patotoo, mula sa pagitan ng dalawang kerubin. At nagsalita siya sa kanya.[b]
