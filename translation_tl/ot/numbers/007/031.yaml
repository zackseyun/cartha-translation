  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: Ang handog niya ay isang pinggang pilak[a] na tumitimbang ng 130 siklo, at isang palangganang pilak[b] na tumitimbang ng 70 siklo, ayon sa siklo ng santuwaryo[c]. Kapuwa puno ang mga ito ng pinong harina na hinaluan ng langis bilang handog na butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bandehadong pilak”; ang salitang Hebreo ay tumutukoy sa isang sisidlang panritwal.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mangkok na pilak”; ang salitang Hebreo ay tumutukoy sa sisidlang ginagamit sa paghahandog.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ayon sa pamantayang timbang na ginagamit sa santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Ang handog niya ay
  rationale: Ang קָרְבָן ay handog na inihaharap sa kontekstong panritwal; malinaw at karaniwan sa modernong Tagalog ang “handog.”
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang pinggang pilak
  rationale: Ang קְעָרָה ay isang malapad o mababaw na sisidlan; natural na katumbas ang “pinggan,” habang inilalagay sa talababa ang “bandehado” bilang posibleng alternatibo.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na tumitimbang ng 130 siklo
  rationale: Ipinahahayag nang natural sa Tagalog ang tahasang pagtukoy ng Hebreo sa bigat ng sisidlan.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang palangganang pilak
  rationale: Ang מִזְרָק ay sisidlang kaugnay ng paghahandog; ipinahihiwatig ng “palanggana” ang mas malalim na sisidlan kaysa pinggan nang hindi ito ginagawang karaniwang mangkok lamang.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na tumitimbang ng 70 siklo
  rationale: Nililinaw na bigat ng palanggana ang tinutukoy, gaya ng hinihingi ng sintaks at parallelismo.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Tinutukoy ng parirala ang pamantayang timbang na ginagamit sa santuwaryo, hindi isang naiibang uri ng salapi.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Kapuwa puno ang mga ito
  rationale: Pinananatili ang tahasang pagtukoy sa dalawang sisidlan at ang predikatibong diwa ng “puno.”
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwang tumpak na katawagan sa mahusay o pinong harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Natural na modernong Tagalog ito para sa pasibong participle na nagsasaad na pinaghalo ang harina at langis.
- source_word: לְמִנְחָה
  choice: bilang handog na butil
  rationale: Sa kontekstong pangpari, ang מִנְחָה ay espesipikong handog mula sa ani o butil, kaya mas tumpak ito kaysa sa pangkalahatang “handog.”
