translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang mga numerong 130 at 70 para sa mabilis na pagbasa, “siklo” bilang tradisyonal na yunit ng timbang, at malinaw na pinaghiwalay ang dalawang sisidlan habang pinananatili ang ugnayan ng mga ito sa iisang sugnay.
