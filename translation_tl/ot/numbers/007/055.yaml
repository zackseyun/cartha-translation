  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: Ang kanyang handog ay isang pinggang pilak[a] na tumitimbang ng 130 siklo, at isang palangganang pilak[b] na tumitimbang ng 70 siklo, ayon sa pamantayang siklo ng santuwaryo[c]. Kapwa puno ang mga ito ng pinong harina na hinaluan ng langis bilang handog na butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “plato”; ang salitang Hebreo ay tumutukoy sa isang mababaw na sisidlang pilak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mangkok”; isang sisidlang ginagamit sa paglilingkod sa santuwaryo.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “ayon sa siklo ng santuwaryo,” ibig sabihin, ayon sa pamantayang timbang na ginagamit sa santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Ang kanyang handog ay
  rationale: Ang קָרְבָּן ay handog na inihaharap sa Diyos sa kontekstong pansantuwaryo. Idinagdag ang pangawing na “ay” upang maging natural sa Filipino ang sugnay na walang pandiwa sa Hebreo.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang pinggang pilak
  rationale: Ang קְעָרָה ay isang mababaw na sisidlan. Ang “pinggan” ay malinaw at karaniwang salitang Filipino, habang pinananatili sa talababa ang alternatibong “plato.”
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na tumitimbang ng 130 siklo
  rationale: 'Likas sa modernong Filipino ang hulma na “tumitimbang ng,” at tumpak nitong ipinahahayag ang literal na “ang timbang nito: tatlumpu at isang daan.”'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang palangganang pilak
  rationale: Ang מִזְרָק ay sisidlang ginagamit sa gawaing pansakripisyo. Ang “palanggana” ay naglalarawan ng bukás at malalim-lalim na sisidlan at hindi ito ipinagkakamali sa karaniwang maliit na mangkok.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na tumitimbang ng 70 siklo
  rationale: Nililinaw ng parirala na timbang ng palanggana ang tinutukoy, kaayon ng naunang sisidlan.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa pamantayang siklo ng santuwaryo
  rationale: Tinutukoy ng pariralang Hebreo ang opisyal na pamantayan ng timbang sa santuwaryo. Ginawang hayag ang “pamantayan” upang madaling maunawaan sa Filipino nang hindi binabago ang diwa.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Kapwa puno ang mga ito
  rationale: Pinananatili ang tahasang pagtukoy sa dalawang sisidlan at ang diin ng שְׁנֵיהֶם.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwan at tiyak na katawagan sa de-kalidad na harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Tumpak na inilalarawan ng pariralang ito ang harinang inihalo sa langis, sa natural na modernong Filipino.
- source_word: לְמִנְחָה
  choice: bilang handog na butil
  rationale: Sa kontekstong pari at sakripisyo, ang מִנְחָה ay partikular na handog na mula sa butil, hindi lamang pangkalahatang handog.
