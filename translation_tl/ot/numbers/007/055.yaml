  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang mga numerong 130 at 70 para sa malinaw na estilong imbentaryo; pinanatili ang terminong “siklo” at ipinaliwanag ang pamantayan ng santuwaryo. Ang “santuwaryo” ay pinili bilang maikli at kinikilalang katawagang panrelihiyon.
