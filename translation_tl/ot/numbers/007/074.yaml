  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: tl
  text: isang sisidlang ginto na tumitimbang ng sampung siklo[a], na puno ng insenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang sisidlang ginto, sampu [ng ginto], na puno ng insenso.” Idinagdag ang “siklo” batay sa paulit-ulit na pormula ng handog sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sisidlan
  rationale: Sa konteksto ng mga handog sa tabernakulo, tumutukoy ito sa isang maliit na lalagyan. Mas malinaw sa modernong Filipino ang “sisidlan” kaysa “kutsara,” na maaaring magpahiwatig ng karaniwang kubyertos.
- source_word: אַחַת
  choice: isang
  rationale: Payak na bilang na umaayon sa pambabaeng pangngalang כַּף.
- source_word: עֲשָׂרָה
  choice: sampung
  rationale: Bilang na tumutukoy sa ipinahihiwatig na sukat ng bigat ng sisidlan.
- source_word: זָהָב
  choice: ginto
  rationale: Ipinakikitang yari sa ginto ang sisidlan; natural at tuwiran ang pariralang “sisidlang ginto.”
- source_word: עֲשָׂרָה זָהָב
  choice: tumitimbang ng sampung siklo
  rationale: Walang tahasang yunit sa Hebreo, ngunit nauunawaan ang “siklo” mula sa paulit-ulit na pormula ng handog sa konteksto. Nilinaw ng “tumitimbang” na bigat, hindi halaga o bilang, ang tinutukoy.
- source_word: מְלֵאָה
  choice: puno ng
  rationale: Maikli at natural na paglalarawan sa laman ng sisidlan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang salitang Filipino para sa mabangong sangkap na sinusunog sa pagsamba sa santuwaryo.
