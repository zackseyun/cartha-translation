base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: tl
  text: at para sa haing pangkapayapaan:[a] dalawang baka, limang lalaking tupa, limang lalaking kambing, at limang lalaking korderong isang taóng gulang. Ito ang handog ni Elizur na anak ni Shedeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na salu-salo” o “handog para sa mabuting kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: at bilang handog na salu-salo
  rationale: Ipinagpapatuloy ng וּ ang talaan, at ang לְ ay likas na naipapahayag bilang “bilang” sa Filipino. Ang “handog na salu-salo” ay malinaw na terminong panghandog at ipinahihiwatig ang pakikisamang kaugnay ng שְׁלָמִים nang hindi ito nililimitahan sa diwa lamang ng kapayapaan.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Ang בָּקָר ay kolektibong tawag sa mga hayop na bovine at hindi tumutukoy rito sa tiyak na kasarian; natural at maikli ang “dalawang baka” sa Filipino.
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Ang אֵילִם ay mga ram, kaya pinananatili ng “lalaking tupa” ang tiyak na kasarian.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Ang עַתֻּדִים ay partikular na tumutukoy sa mga lalaking kambing.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang korderong isang taóng gulang
  rationale: Likas na katumbas ng idyomang בְּנֵי שָׁנָה ang “isang taóng gulang.” Hindi tahasang idinagdag ang kasarian sapagkat maaari nang tumukoy ang plural na כְּבָשִׂים sa mga kordero sa pangkalahatang gamit dito.
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Pinananatili ng kasalukuyang anyong “Ito ang” ang deiktikong pormula ng Hebreo; ang קָרְבַּן ay pangkalahatang “handog.”
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elizur na anak ni Shedeur
  rationale: Isinalin ang patronymic na בֶּן sa natural na Filipino na “na anak ni,” habang tinransliterado ang mga pangalan.
theological_decisions:
- issue: Saklaw ng kahulugan ng שְׁלָמִים
  choice: handog na salu-salo
  alternative: handog para sa kapayapaan; handog para sa mabuting kalagayan
  rationale: May saklaw ang terminong maaaring magpahiwatig ng kapayapaan, mabuting kalagayan, at pakikisama sa konteksto ng pinagsasaluhang handog. Ginamit ang isang malinaw na pangunahing salin at iniingatan sa talababa ang tunay na mga alternatibo.
translation_notes:
  register: Modernong Filipino na dignipikado at madaling maunawaan. Pinanatili ang anyong talaan ng talata, ang teknikal na bokabularyong panghandog, at ang pagkakaiba ng mga uri ng hayop nang walang di-kailangang pagtukoy sa kasarian.
