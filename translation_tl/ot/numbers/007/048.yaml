translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang “mga anak ni Efraim” upang katawanin ang Hebreong filial na pananalita. Inilipat ang talababa sa “pinuno,” ang salitang aktuwal na tinutukoy ng alternatibong pagbasa.
