base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: tl
  text: Nang ikapitong araw, ang pinuno[a] ng mga anak ni Efraim ay si Elisama na anak ni Amihud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinuno para sa mga anak ni Efraim.” Ang Hebreong pang-ukol ay maaaring magpahiwatig ng kaugnayan o pagkatawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Nang ikapitong araw
  rationale: Ang בְּ na ikinabit sa יוֹם kasama ng ordinal ay nagsasaad ng panahon. Likas at tiyak sa modernong Tagalog ang “Nang ikapitong araw.”
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Sa Bilang 7, tumutukoy ito sa kinatawan at namumuno sa lipi na naghahandog. Malinaw at hindi makaluma ang “pinuno.”
- source_word: לִבְנֵי אֶפְרָיִם
  choice: ng mga anak ni Efraim
  rationale: Pinananatili nito ang Hebreong pananalitang tumutukoy sa mga inapo ni Efraim, habang natural pa rin sa Tagalog. Ang לְ ay maaaring magpahiwatig ng kaugnayan o pagkatawan, kaya inilakip ang alternatibo sa talababa.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Isinalin sa karaniwang anyong Tagalog ang personal na pangalan.
- source_word: בֶּן עַמִּיהוּד
  choice: anak ni Amihud
  rationale: Ito ang likas na katumbas sa Tagalog ng Hebreong patronymic at pinananatili ang pagkakakilanlang genealogical.
