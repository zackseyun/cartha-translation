  to: Ang handog niya ay isang pilak na pinggan[a], na may bigat na 130 siklo, at isang pilak na palanggana[b], na may bigat na 70 siklo, ayon sa siklo ng santuwaryo[c]. Kapuwa ay puno ng pinong harina na hinaluan ng langis para sa handog na pagkaing butil.
