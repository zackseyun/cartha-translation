base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: Ang handog niya ay isang pilak na pinggan[a], na may bigat na 130 siklo, at isang pilak na palanggana[b], na may bigat na 70 siklo, ayon sa siklo ng santuwaryo[c]. Kapuwa ay puno ng pinong harina na hinaluan ng langis para sa handog na pagkaing butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mababaw na sisidlan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mangkok”; isa itong sisidlang ginagamit sa ritwal.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ayon sa pamantayan ng timbang na ginagamit sa santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָנוֹ
  choice: Ang handog niya ay
  rationale: Ang קָרְבָן ay handog na inihaharap sa kontekstong panritwal; malinaw at likas sa modernong Filipino ang “handog.”
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang pilak na pinggan
  rationale: Ang קְעָרָה ay mababaw na sisidlan o pinggan; pinananatili ng “pinggan” ang anyo nito at nauunawaan ng karaniwang mambabasa.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na may bigat na 130 siklo
  rationale: Tuwirang ipinahahayag ang bigat gaya ng Hebreo, sa natural na ayos ng Filipino.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang pilak na palanggana
  rationale: Ang מִזְרָק ay isang sisidlang ginagamit sa ritwal; ang “palanggana” ay nagpapahiwatig ng mas malalim na sisidlan kaysa pinggan.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na may bigat na 70 siklo
  rationale: Nililinaw na ang bilang ay bigat ng sisidlan, alinsunod sa ipinahihiwatig ng pariralang Hebreo.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa pamantayang siklo ng santuwaryo
  rationale: Ipinahahayag ang gamit ng siklo bilang opisyal na pamantayan ng timbang sa santuwaryo, sa halip na magmukhang pangalan lamang ng yunit.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Kapuwa ang mga ito ay puno
  rationale: Pinananatili ang tahasang pagtukoy ng Hebreo sa dalawang sisidlan.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Karaniwang katumbas ito ng espesyal na pinong harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Tumpak na inilalarawan ang harinang inihanda sa pamamagitan ng paghahalo rito ng langis.
- source_word: לְמִנְחָה
  choice: bilang handog na pagkaing butil
  rationale: Sa kontekstong panghandog, ang מִנְחָה ay partikular na handog mula sa butil; ang parirala ay malinaw at hindi nagpapahiwatig na buong butil ang laman.
