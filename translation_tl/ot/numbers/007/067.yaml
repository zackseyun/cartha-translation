translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang estilo. Ginamit ang mga numerong 130 at 70 para madaling mabasa ang talaan ng mga timbang; pinanatili ang “siklo” bilang sinaunang yunit at ipinaliwanag ang pamantayan ng santuwaryo sa talababa.
