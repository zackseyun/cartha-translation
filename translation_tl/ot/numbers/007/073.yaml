  to: Ang handog niya ay isang pilak na pinggan[a] na may timbang na 130 siklo, at isang pilak na mangkok na may timbang na 70 siklo, ayon sa siklo ng santuwaryo[b]. Kapuwa puno ang mga ito ng pinong harina na hinaluan ng langis para sa handog na butil.
