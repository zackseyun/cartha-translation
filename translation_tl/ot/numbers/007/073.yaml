translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang estilong talaan ng mga kagamitan at ang teknikal na terminolohiyang pansambahan. Ginamit ang mga numerong 130 at 70 para sa madaling pagbasa.
