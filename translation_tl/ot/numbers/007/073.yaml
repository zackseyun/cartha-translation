base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: Ang handog niya ay isang pilak na pinggan[a] na may timbang na 130 siklo, at isang pilak na mangkok na may timbang na 70 siklo, ayon sa siklo ng santuwaryo[b]. Kapuwa puno ang mga ito ng pinong harina na hinaluan ng langis para sa handog na butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bandehado.” Ang salitang Hebreo ay tumutukoy sa isang mababaw na sisidlang pilak na ginagamit sa santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa sagradong siklo.” Tinutukoy ng Hebreo ang pamantayan ng timbang na ginagamit sa santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Ang handog niya ay
  rationale: Sa kontekstong pansambahan, ang קָרְבָן ay handog na inihaharap sa Diyos. Idinagdag ang pangawing na “ay” upang maging natural sa Tagalog ang nominal na pagkakasunod-sunod ng Hebreo.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang pilak na pinggan
  rationale: Ang קַעֲרָה ay isang mababaw na sisidlan sa imbentaryo ng santuwaryo. Malinaw at karaniwan sa modernong Tagalog ang “pinggan”; inilagay sa talababa ang posibleng “bandehado.”
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na may timbang na 130 siklo
  rationale: Tuwirang ipinahahayag ang bigat ng sisidlan habang pinananatiling natural ang ayos ng pangungusap sa Tagalog.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang pilak na palanggana
  rationale: Ang מִזְרָק ay sisidlang ginagamit sa ritwal. Ang “palanggana” ay naglalarawan ng maluwang na sisidlan at iniiwasan ang mas domestikong dating ng “mangkok.”
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na may timbang na 70 siklo
  rationale: Nililinaw na ang bilang ay tumutukoy sa bigat ng palanggana, gaya ng naunang sisidlan.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Ipinakikita ng parirala na ginamit ang opisyal na pamantayan ng timbang na nauugnay sa santuwaryo, nang hindi pinapalawak ang kahulugan.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Kapuwa puno ang mga ito
  rationale: Pinananatili ang tahasang pagtukoy sa dalawang sisidlan at ang predikatibong diwa ng “puno.”
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: pinong harina na hinaluan ng langis
  rationale: Ang סֹלֶת ay pinong harinang ginagamit sa mga handog, at ipinahihiwatig ng participle na nahaluan na ito ng langis.
- source_word: לְמִנְחָה
  choice: bilang handog na pagkaing butil
  rationale: Sa kontekstong pari, ang מִנְחָה ay partikular na handog mula sa butil, hindi lamang pangkalahatang handog.
