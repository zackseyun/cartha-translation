  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: tl
  text: isang gintong mangkok na may bigat na sampung siklo[a], na puno ng insenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang gintong mangkok, sampu [ng ginto].” Ipinahihiwatig ng pormula ng mga handog sa nakapaligid na mga talata ang yunit na “siklo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: mangkok
  rationale: Sa konteksto ng mga handog sa tabernakulo, tumutukoy ito sa isang maliit na sisidlan, hindi sa palad. Ang “mangkok” ay likas at malinaw sa makabagong Filipino.
- source_word: אַחַת
  choice: isang
  rationale: Payak na bilang na umaayon sa pambabaeng pangngalang כַּף.
- source_word: עֲשָׂרָה
  choice: sampu
  rationale: Bilang na tumutukoy sa ipinahihiwatig na sukat ng bigat ng sisidlan.
- source_word: זָהָב
  choice: ginto / gintong
  rationale: Ipinapahayag ang materyal ng sisidlan; ginamit ang pang-uring anyong “gintong” sa pangunahing teksto.
- source_word: עֲשָׂרָה זָהָב
  choice: tumitimbang ng sampung siklo
  rationale: Hindi tahasang nakasulat ang שֶׁקֶל, ngunit ipinahihiwatig ito ng paulit-ulit na pormula ng mga handog sa nakapaligid na mga talata. Nililinaw ng “tumitimbang” na sukat ng bigat ang tinutukoy.
- source_word: מְלֵאָה
  choice: punô ng
  rationale: Likas na panaguring naglalarawan sa laman ng sisidlan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang salin para sa mabangong sangkap na sinusunog sa pagsamba sa tabernakulo.
