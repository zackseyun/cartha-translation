base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/039.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: tl
  text: isang toro mula sa kawan ng mga baka[a], isang lalaking tupa, isang lalaking kordero[b] na isang taóng gulang, bilang handog na sinusunog;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang toro, anak ng baka,” isang idyoma para sa torong kabilang sa mga baka o kawan ng baka.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang kordero.” Ang salitang Hebreo rito ay karaniwang tumutukoy sa lalaking kordero sa konteksto ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: toro
  rationale: Tumutukoy ito sa isang toro o batang toro, lalo na sa konteksto ng paghahandog. Ang “toro” ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: אֶחָד
  choice: isang
  rationale: Ang paulit-ulit na bilang ay hiwa-hiwalay na nagtatakda ng dami ng bawat hayop; pinananatili ng “isang” ang ayos ng talaan.
- source_word: בֶּן בָּקָר
  choice: mula sa bakahan
  rationale: Literal itong “anak ng bakahan/mga baka,” isang idyomang tumutukoy sa hayop na mula sa uring baka. Likas sa Tagalog ang “mula sa bakahan” at hindi nito ginagawang di-tiyak ang uri ng hayop.
- source_word: אַיִל
  choice: lalaking tupa
  rationale: Ito ang karaniwang katawagan sa isang adultong lalaking tupa, lalo na sa mga tekstong tungkol sa paghahandog.
- source_word: כֶּבֶשׂ
  choice: lalaking kordero
  rationale: Ang salita ay tumutukoy sa kordero at sa kontekstong panghandog ay karaniwang lalaking kordero. Nililinaw ng salin ang kasarian nang hindi inaalis sa talababa ang mas payak na posibleng salin.
- source_word: בֶּן שְׁנָתוֹ
  choice: na isang taóng gulang
  rationale: Ang idyomang Hebreo ay nagsasaad na ang hayop ay isang taon ang gulang. Ito ang natural at malinaw na pagpapahayag sa Tagalog.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ang karaniwang katawagan sa handog na sinusunog sa altar. Ipinahihiwatig ng “bilang” ang gamit o layunin ng mga hayop sa talaan.
theological_decisions:
- issue: Kahulugan ng עֹלָה
  choice: handog na sinusunog
  alternative: handog na sinusunog nang buo
  rationale: Pinili ang karaniwang terminong malinaw sa Tagalog. Bagaman kalimitang lubusang sinusunog ang ganitong handog, hindi na idinagdag sa mismong talata ang “nang buo,” sapagkat wala itong tahasang katumbas na hiwalay na salita rito at nauunawaan ang uri ng handog mula sa terminong עֹלָה.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinananatili ang paulit-ulit na “isang” upang maipakita ang pormal na ayos ng talaan, habang gumagamit ng likas na mga katawagang “bakahan,” “lalaking tupa,” at “kordero.”
