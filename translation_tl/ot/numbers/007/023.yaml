source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: tl
  text: 'At para sa haing pangkapayapaan[a]: dalawang baka, limang lalaking tupa, limang lalaking kambing, at limang lalaking kordero na tig-iisang taong gulang. Ito ang handog ni Netanel na anak ni Zuar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa pakikisama” o “handog para sa kagalingan” ang terminong Hebreo na שְׁלָמִים (shelamim).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח
  choice: At para sa handog na hain
  rationale: Ipinakikita ng pang-ugnay at pang-ukol na kasunod itong bahagi ng talaan; pinananatili ng parirala ang diwa ng זֶבַח bilang haing handog nang natural sa Tagalog.
- source_word: הַשְּׁלָמִים
  choice: para sa kapayapaan
  rationale: Ang שְׁלָמִים ay teknikal na katawagan sa isang uri ng hain. Pinananatili ng 'handog na hain para sa kapayapaan' ang tradisyonal na kaugnayan nito sa kapayapaan, habang itinatala sa talababa ang iba pang lehitimong diwa.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Kolektibong katawagan ang בָּקָר para sa mga bovine at hindi nito tahasang tinutukoy ang kasarian; sa karaniwang Tagalog, maaaring tumukoy ang 'baka' sa hayop nang hindi nililimitahan sa babae.
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Tiyak na tumutukoy ang אֵילִם sa mga ram; malinaw at likas sa modernong Tagalog ang 'lalaking tupa.'
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Tumutukoy ang עַתּוּדִים sa mga lalaking kambing; tahasang pinananatili sa salin ang kasarian.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang lalaking korderong tig-iisang taóng gulang
  rationale: Tumutukoy ang כְּבָשִׂים sa mga lalaking kordero, at ang בְּנֵי שָׁנָה ay nagsasaad na bawat isa ay isang taóng gulang.
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Ang demonstratibo at pangngalan ay nagsisilbing pangwakas na pormula ng pagkakakilanlan; natural sa Tagalog ang walang tahasang panandang pamanahon.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: Netanel na anak ni Zuar
  rationale: Isinatranslitera ang mga pangalan at isinalin nang tuwiran ang patronimik na בֶּן bilang 'anak ni.'
theological_decisions:
- issue: Saklaw ng kahulugan ng שְׁלָמִים
  choice: handog na hain para sa kapayapaan
  alternative: handog para sa pakikisama; handog para sa kagalingan
  rationale: May saklaw ang terminong Hebreo na maaaring magpahiwatig ng kapayapaan, pakikisama, o kagalingan. Hindi nilulutas nang dogmatiko ang saklaw; ginagamit sa teksto ang nakaugaliang katawagan at inilalahad sa talababa ang mga tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang malinaw na katawagang panghayop at pinanatili ang anyong talaan ng tekstong Hebreo.
