lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang pariralang Hebreo ay idyomatikong tumutukoy sa isang lalaking kambing. Malinaw at natural sa modernong Filipino ang “lalaking kambing” at pinananatili nito ang espesipikong uri ng hayop na inihahandog.
- source_word: אֶחָד
  choice: isang
  rationale: Hayagang binabanggit ng Hebreo ang bilang na isa. Ang “isang” ay likas na katumbas sa Filipino at angkop sa paulit-ulit na estilong talaan ng Bilang 7.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong panghandog, ang חַטָּאת ay tumutukoy sa ritwal na handog para sa kasalanan, hindi lamang sa abstraktong kasalanan. Ipinahahayag ng “bilang” ang gamit o tungkulin ng hayop sa talaan ng mga handog.
