translation_notes:
  register: Gumamit ng maikli, marangal, at likas na modernong Filipino na umaayon sa estilong imbentaryo ng kabanata. Hindi na kailangan ang talababa sapagkat ang “lalaking kambing” ay tuwirang malinaw at walang makabuluhang alternatibong kailangang itala.
