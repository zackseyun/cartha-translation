  text: כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/014.yaml
  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: tl
  text: isang sisidlang[a] ginto na tumitimbang ng sampung siklo, na punô ng insenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang sisidlang ginto, sampu, punô ng insenso.” Ang “siklo” ay ipinahihiwatig ng paulit-ulit na pormula ng handog sa mga kalapit na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sisidlan
  rationale: Sa talaan ng mga handog para sa santuwaryo, tumutukoy ito sa isang maliit na sisidlan para sa insenso. Mas natural at hindi nakalilinlang sa modernong Filipino ang “sisidlan” kaysa “kutsara,” bagaman hindi nito tinutukoy ang eksaktong hugis.
- source_word: אַחַת
  choice: isang
  rationale: Payak na bilang na umaayon sa pambabaeng pangngalang כַּף.
- source_word: עֲשָׂרָה
  choice: sampung siklo
  rationale: Hindi inuulit sa Hebreo ang yunit ng timbang, ngunit malinaw itong ipinahihiwatig ng paulit-ulit na pormula sa kalapit na mga talata. Idinagdag ang “siklo” upang maging buo at malinaw sa Filipino.
- source_word: זָהָב
  choice: ginto
  rationale: Tinutukoy nito ang materyal na yari sa sisidlan; natural sa Filipino ang pariralang “sisidlang ginto.”
- source_word: מְלֵאָה
  choice: punô ng
  rationale: Pang-uring nagsasaad na ang sisidlan ay may lamang pumupuno rito; “punô ng” ang tuwiran at likas na katumbas.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang katawagan sa mabangong sangkap na sinusunog sa pagsamba.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignidad ang himig. Ginamit ang “sisidlan” bilang pangkalahatan ngunit malinaw na katawagan sa kagamitang panritwal, at pinanatili ang “siklo” bilang biblikal na yunit ng timbang.
