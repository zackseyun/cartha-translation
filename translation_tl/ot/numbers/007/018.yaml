  text: בַּ/יּוֹם֙ הַ/שֵּׁנִ֔י הִקְרִ֖יב נְתַנְאֵ֣ל בֶּן צוּעָ֑ר נְשִׂ֖יא יִשָּׂשכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/018.yaml
  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: tl
  text: Sa ikalawang araw, naghandog si Netanel na anak ni Zuar, ang pinuno ng Isacar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Sa ikalawang araw
  rationale: Likas na temporal na parirala sa modernong Tagalog at hindi nagdaragdag ng impormasyong wala sa talata.
- source_word: הִקְרִיב
  choice: naghandog
  rationale: Sa konteksto ng paghahandog at pagtatalaga, ang Hiphil ng קרב ay tumutukoy sa pagharap o pag-aalay ng handog. Ganap at natural sa Tagalog ang pandiwang “naghandog” kahit walang tahasang layon, kaya napapanatili ang pagkakaltas ng layon sa Hebreo.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Malapit na transliterasyon ng pangalang Hebreo at madaling basahin sa Filipino.
- source_word: בֶּן צוּעָר
  choice: anak ni Zuar
  rationale: Karaniwang Filipino na pagpapahayag ng ugnayang mag-ama.
- source_word: נְשִׂיא
  choice: pinuno
  rationale: Sa kontekstong pantribo, tumutukoy ito sa kinikilalang lider; mas malinaw ito kaysa sa “prinsipe,” na maaaring magpahiwatig ng pagiging maharlika.
- source_word: יִשָּׂשכָר
  choice: Isacar
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Bibliya sa Filipino.
