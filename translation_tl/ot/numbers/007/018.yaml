  register: Makabagong Filipino na malinaw at marangal. Pinanatiling maikli ang paulit-ulit na pormula ng salaysay at hindi dinagdagan ng tahasang layon ang pandiwang “naghandog,” yamang wala iyon sa tekstong Hebreo.
