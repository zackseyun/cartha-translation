  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Likas na salin ng waw-consecutive at pandiwang 'sabihin'; ipinagpapatuloy nito ang salaysay nang hindi labis na binibigyang-diin ang pagkakasunod ng oras.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Sinusunod ang tradisyunal at malawak na kinikilalang representasyon ng banal na pangalan sa tekstong Filipino, gamit ang malalaking titik upang maipakitang YHWH ang pinagmulan.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Natural na Filipino para sa pinatutunguhan ng pagsasalita.
- source_word: לֵאמֹר
  choice: '[hindi hiwalay na isinalin]'
  rationale: Ang pormulang Hebreo na literal na 'na sinasabi' ay nagsisilbing panimula sa tuwirang pahayag sa susunod na talata; sa modernong Filipino, sapat at mas natural ang kuwit pagkatapos ng 'Moises'.
theological_decisions:
- issue: Paglalarawan sa tetragrammaton יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Pinananatili ang pagkakakilanlan nito bilang banal na pangalan sa pamamagitan ng tipograpiyang malalaking titik, habang sumusunod sa pamilyar na gamit ng mga Bibliyang Filipino at sa audited consultation layer.
translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Pinanatili ang pormulang pambungad ng banal na pagsasalita, ngunit hindi isinalin nang mekanikal ang לֵאמֹר bilang 'na sinasabi' dahil hindi iyon natural sa kasalukuyang Filipino.
