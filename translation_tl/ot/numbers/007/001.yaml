  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: tl
  text: At nangyari, noong araw na matapos ni Moises ang pagtatayo ng tabernakulo[a], pinahiran niya ito ng langis at itinalaga, kasama ang lahat ng kagamitan nito, ang altar, at ang lahat ng kagamitan nito; pinahiran niya ang mga ito ng langis at itinalaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang matapos ni Moises na itayo ang tabernakulo.” Maaari ring isalin nang ganito ang Hebreong pahayag tungkol sa panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili nito ang pambungad na tungkulin ng Hebreong salaysay nang hindi gumagamit ng makalumang pananalita.
- source_word: בְּיוֹם כַּלּוֹת
  choice: nang araw na matapos
  rationale: Inilalarawan nito ang temporal na pariralang Hebreo at pinananatili ang pagbanggit sa 'araw,' habang ang talababa ay nagbibigay ng mas idiomatikong posibilidad.
- source_word: לְהָקִים
  choice: na maitayo
  rationale: Sa konteksto ng mishkan, ang Hiphil ng קום ay tumutukoy sa pagtatayo o pagtindig ng santuwaryo.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang 'tabernakulo' ay kilala at tumpak na terminong Filipino para sa naililipat na santuwaryo sa ilang.
- source_word: וַיִּמְשַׁח
  choice: pinahiran niya ... ng langis
  rationale: Nililinaw ng parirala ang ritwal na kahulugan ng משׁח sa natural na modernong Tagalog.
- source_word: וַיְקַדֵּשׁ
  choice: itinalaga
  rationale: Sa kontekstong ritwal, tumutukoy ito sa pagbubukod para sa banal na gamit; malinaw at dignified ang 'itinalaga' sa Filipino.
- source_word: כָּל כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Sapat ang malawak na 'kagamitan' para sa mga bagay ng tabernakulo at sa mga kasangkapan ng altar; iniiwasan nito ang artipisyal na pagkakaiba na hindi tahasang nakasaad sa salitang Hebreo.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Ito ang karaniwan at tumpak na salin ng מזבח sa modernong Filipino.
- source_word: וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: pinahiran niya ng langis at itinalaga ang altar at ang lahat ng kagamitan nito
  rationale: Ang mga hulaping maramihan ay tumutukoy sa mga nabanggit na bagay. Ang bahagyang pagbabagong-ayos ay umiiwas sa malabong panghalip na 'mga iyon' at naghahatid ng natural na Filipino nang hindi binabago ang diwa.
theological_decisions:
- issue: Terminolohiya ng ritwal na kabanalan
  choice: itinalaga
  alternative: pinabanal
  rationale: Ang konteksto ay ritwal na pagbubukod ng mga bagay para sa banal na gamit, hindi pagbabago sa moral na katangian. Ipinahahayag ito ng 'itinalaga' nang malinaw nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang pamilyar na terminong 'tabernakulo' at ang malinaw na ritwal na pariralang 'pinahiran ng langis.' Ang paghahati sa dalawang pangungusap ay nagpapalinaw sa mahabang Hebreong pangungusap habang pinananatili ang pagkakasunod-sunod at pag-uulit nito.
