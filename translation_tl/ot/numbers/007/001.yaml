  naturalness: Ang “nang araw na matapos” ay hindi natural na modernong Tagalog. Mas maayos ang “noong araw na matapos ni Moises ang pagtatayo ng …” Samantala, natural at angkop sa rehistrong pangkasulatan ang “pinahiran ... ng langis” at “itinalaga.”
  terminology: Ang “tabernakulo,” “altar,” at “kagamitan” ay angkop. Ang “itinalaga” ay katanggap-tanggap para sa ritwal na paglalaan/consecration sa kontekstong ito; hindi nito ipinahihiwatig ang moral na pagbabago.
