- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: Nang ikaanim na araw
  rationale: Likas na pormulang panahunan sa modernong Filipino para sa Hebreong literal na 'sa ikaanim na araw.'
- source_word: נָשִׂיא
