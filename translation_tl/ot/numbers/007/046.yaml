  text: isang lalaking kambing bilang handog para sa kasalanan;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas literal na salin, “para sa kasalanan.” Sa kontekstong ito ng paghahandog, ang salitang Hebreo ay karaniwang tumutukoy sa “handog para sa kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang parirala ay tumutukoy sa kambing na lalaki. Likas at malinaw sa modernong Tagalog ang “lalaking kambing,” at pinananatili nito ang kasariang tahasang ipinahihiwatig ng Hebreo.
- source_word: אֶחָד
  choice: isang
  rationale: Pinananatili ang tahasang bilang at ang paulit-ulit na estilong talaan ng Mga Bilang 7.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong paghahandog, ang חַטָּאת ay karaniwang teknikal na tawag sa handog na may kaugnayan sa kasalanan. Ang “bilang” ay natural na nagpapahayag ng pagkakatalaga ng hayop para sa handog.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa kontekstong pangsakripisyo
  choice: handog para sa kasalanan
  alternative: para sa kasalanan
  rationale: Sa mga talaan ng paghahandog, karaniwang tumutukoy ang חַטָּאת sa mismong handog, hindi lamang sa kasalanan. Pinananatili ng salin ang teknikal na diwa nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lalaking kambing” sa halip na mas bihira o rehiyonal na katawagan, at pinanatili ang maikling anyo ng talaang panghandog.
