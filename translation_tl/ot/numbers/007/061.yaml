translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling estilong patalaan ng Hebreo ngunit hinati sa dalawang pangungusap upang maging madaling basahin. Ginamit ang “siklo” bilang teknikal na yunit ng timbang at ipinaliwanag sa talababa ang pamantayan ng santuwaryo.
