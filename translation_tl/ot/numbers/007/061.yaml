base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: Ang handog niya ay isang pinggang pilak[a] na tumitimbang ng isang daan at tatlumpung siklo, at isang mangkok na pilak[b] na tumitimbang ng pitumpung siklo, ayon sa siklo ng santuwaryo[c]. Kapwa puno ang mga ito ng pinong harina na hinaluan ng langis para sa handog na butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bandehado” ang קַעֲרָה, isang mababaw na sisidlan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “palanggana” ang מִזְרָק, isang sisidlang ginagamit sa paglilingkod sa santuwaryo.
    reason: lexical_alternative
  - marker: c
    text: Ang “ayon sa siklo ng santuwaryo” ay nangangahulugang ayon sa pamantayang timbang ng santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Ang handog niya ay
  rationale: Ang קָרְבָּן ay handog na inihaharap sa kontekstong panritwal. Ang pandiwang “ay” ay nagbibigay ng natural na balangkas sa talaan sa Filipino.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang pinggang pilak
  rationale: Ang קְעָרָה ay isang mababaw na sisidlan o pinggan. Malinaw at likas sa modernong Filipino ang “pinggan,” habang inilalagay sa talababa ang posibleng “bandehado.”
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na tumitimbang ng isang daan at tatlumpung siklo
  rationale: Ipinahahayag nang natural sa Filipino ang literal na diwang “ang timbang nito ay isang daan at tatlumpu.”
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang mangkok na pilak
  rationale: Ang מִזְרָק ay sisidlang ginagamit sa paglilingkod sa santuwaryo. Ang “mangkok” ay malinaw at pangkalahatang katawagan; ang mas tiyak ngunit posibleng mapagkamalang sisidlang panlinis na “palanggana” ay inilalagay bilang alternatibo sa talababa.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na tumitimbang ng pitumpung siklo
  rationale: Nililinaw ng pariralang ito na timbang din ng ikalawang sisidlan ang tinutukoy.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Tumutukoy ang parirala sa pamantayang timbang na ginagamit sa santuwaryo, hindi sa ibang uri ng salapi o timbang.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Kapwa puno ang mga ito
  rationale: Pinananatili ang tahasang pagtukoy ng Hebreo sa dalawang sisidlan at ang paglalarawan sa mga ito bilang puno.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Karaniwang katawagan ito sa mahusay na naprosesong harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Tumpak at natural na ipinahahayag nito na ang harina ay inihalo sa langis.
- source_word: לְמִנְחָה
  choice: bilang handog na pagkaing butil
  rationale: Sa kontekstong pangsaserdote, ang מִנְחָה ay partikular na handog na mula sa butil, kaya mas tiyak ito kaysa sa pangkalahatang “handog.”
