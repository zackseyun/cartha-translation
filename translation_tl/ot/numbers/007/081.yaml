base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/081.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: tl
  text: isang toro mula sa kawan ng baka, isang lalaking tupa, at isang lalaking korderong isang taóng gulang, bilang handog na sinusunog;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Ang פַּר ay toro o batang toro, at ang בֶּן בָּקָר ay idyomang tumutukoy sa uri nitong mula sa bakahan. Pinananatili ng salin ang bilang at uri nang hindi gumagamit ng alanganing literal na pananalita.
- source_word: אַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Ang אַיִל ay adultong lalaking tupa; malinaw at likas sa modernong Filipino ang “lalaking tupa.”
- source_word: כֶּבֶשׂ אֶחָד
  choice: isang lalaking kordero
  rationale: Ang כֶּבֶשׂ ay lalaking batang tupa. Pinananatili ng “lalaking kordero” ang pagkakaibang pangkasarian sa Hebreo.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Ang idyoma ay nagsasaad na ang hayop ay isang taon ang edad; ito ang pinakanatural at eksaktong pahayag sa Filipino.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog. Ang pariralang ito ay malinaw sa karaniwang mambabasa at angkop sa anyong talaan.
theological_decisions: []
translation_notes:
  register: Makabago, dignificado, at malinaw na Filipino; pinanatili ang paulit-ulit na “isang” na bumubuo sa talaan ng mga handog. Ginamit ang “bakahan” para sa kolektibong uring baka at “kordero” para malinaw na maiba ang batang tupa sa adultong lalaking tupa.
