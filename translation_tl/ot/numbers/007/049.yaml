base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: Ang handog niya ay isang pinggang pilak[a] na tumitimbang ng 130 siklo, at isang mangkok na pilak na tumitimbang ng 70 siklo, ayon sa siklo ng santuwaryo. Kapuwa puno ang mga ito ng pinong harina na hinaluan ng langis bilang handog na pagkaing butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang bandehang pilak” para sa “isang pinggang pilak” (קַעֲרָה), at “isang palangganang pilak” para sa “isang mangkok na pilak” (מִזְרָק).
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Ang handog niya ay
  rationale: Sa kontekstong pansambahan, ang קָרְבָּן ay handog na inihaharap sa Diyos; natural at malinaw sa Filipino ang “handog.”
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang pinggang pilak
  rationale: Ang קַעֲרָה ay malapad na sisidlan; ang “pinggan” ay angkop at karaniwang salitang Filipino, habang inilalahad sa talababa ang posibleng “bandehado.”
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na tumitimbang ng 130 siklo
  rationale: Tumpak na inilalahad ang bigat ng unang sisidlan sa natural na ayos ng modernong Filipino.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang mangkok na pilak
  rationale: Ang מִזְרָק ay mangkok o palangganang ginagamit sa gawaing pansakripisyo; “mangkok” ang pinakanatural na pangkalahatang katawagan dito.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na tumitimbang ng 70 siklo
  rationale: Ginagawang tahasan ang ipinahihiwatig na sukat ng bigat ng ikalawang sisidlan.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Ipinapakita nitong ang siklo ng santuwaryo ang pamantayang ginamit sa pagtimbang, nang hindi ginagawang pang-uri na “banal” ang mismong yunit.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Kapuwa puno ang mga ito
  rationale: Malinaw na tumutukoy sa dalawang sisidlang pilak at pinananatili ang predikatibong diwa ng Hebreo.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Karaniwang tumpak na salin para sa harinang pinino na ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Likas na Filipino para sa harinang pinaghalo sa langis.
- source_word: לְמִנְחָה
  choice: bilang handog na pagkaing butil
  rationale: Sa kontekstong saserdotal, ang מִנְחָה ay partikular na handog mula sa butil; iniiwasan ng salin ang masyadong pangkalahatang “handog” lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignipikado at madaling maunawaan. Ginamit ang “siklo” bilang tradisyonal na pangalan ng sinaunang yunit ng timbang at ang “santuwaryo” para sa teknikal na kontekstong pansamba. Ang mga bilang ay nasa numerong anyo para sa malinaw na estilo ng talaan.
