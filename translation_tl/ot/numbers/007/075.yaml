  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/075.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: tl
  text: isang toro mula sa bakahan, isang lalaking tupa, at isang lalaking korderong isang taóng gulang, bilang handog na sinusunog;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Ang פַּר ay toro o batang toro, at ang idyomang בֶּן בָּקָר ay tumutukoy sa hayop na mula sa bakahan. Natural sa modernong Tagalog ang pinagsamang pariralang ito at napapanatili ang uri at bilang ng hayop.
- source_word: אַיִל
  choice: isang lalaking tupa
  rationale: Tumutukoy ito sa adultong lalaking tupa. Mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa hiram o di-gaanong pangkalahatang katawagan.
- source_word: כֶּבֶשׂ
  choice: isang lalaking kordero
  rationale: Tumutukoy ito sa kordero at, sa pormulang panghandog na ito, sa lalaking hayop. Pinananatili ng salin ang pagkakaiba nito sa adultong lalaking tupa.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Ito ang natural na Tagalog para sa idyomang nagsasaad na ang hayop ay nasa unang taon o isang taon ang edad.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubos na sinusunog. Ang “bilang” ay natural na nagpapahayag ng gamit na ipinahihiwatig ng לְ.
- source_word: אֶחָד
  choice: isang
  rationale: Inuulit ang bilang para sa bawat hayop, gaya ng malinaw na imbentaryo sa Hebreo.
theological_decisions:
- issue: Saklaw ng terminong עֹלָה
  choice: handog na sinusunog
  alternative: handog na lubos na sinusunog
  rationale: Pinili ang mas maikli at karaniwang katawagan sa tekstong ito. Ang kontekstong ritwal ang nagpapahiwatig na buong handog ang sinusunog, nang hindi nagdaragdag ng salitang wala sa tuwirang parirala.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at malinaw. Ginamit ang “bakahan,” “lalaking tupa,” at “lalaking kordero” upang maging tiyak ngunit natural ang listahan ng mga hayop na panghandog. Walang footnote dahil walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilahad sa mambabasa.
