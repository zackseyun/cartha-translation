  text: isang mangkok[a] na ginto na tumitimbang ng sampung siklo, na punô ng insenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang mangkok na ginto, sampu, punô ng insenso”; ipinahihiwatig ng paulit-ulit na pormula ng handog sa Bilang 7 ang yunit na “siklo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sisidlan
  rationale: Sa konteksto ng handog sa tabernakulo, tumutukoy ito sa isang maliit na seremonyal na lalagyan ng insenso. Mas malinaw at natural sa modernong Tagalog ang “sisidlan” kaysa “kutsara,” na maaaring magpahiwatig ng karaniwang kubyertos.
- source_word: אַחַת
  choice: isang
  rationale: Payak na bilang na umaayon sa pangngalang כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: tumitimbang ng sampung siklo
  rationale: Elliptical ang Hebreo at hindi tahasang binabanggit ang yunit, ngunit ipinahihiwatig ng paulit-ulit na pormula sa Bilang 7 na timbang ang tinutukoy. Idinagdag ang “siklo” upang maging malinaw sa Tagalog.
- source_word: זָהָב
  choice: ginto
  rationale: Tumutukoy sa materyal na yari ang sisidlan.
- source_word: מְלֵאָה
  choice: punô ng
  rationale: Likas at maikling paglalarawan sa nilalaman ng sisidlan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang salin para sa mabangong sangkap na inihahandog.
