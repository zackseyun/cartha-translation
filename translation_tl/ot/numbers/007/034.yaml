  text: isang lalaking kambing bilang handog para sa kasalanan;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “isang lalaking kambing ng mga kambing para sa handog para sa kasalanan.”
    reason: Ipinakikita ang konstruktong Hebreo ng שְׂעִיר עִזִּים nang hindi ipinahihiwatig na ang hayop ay “mula sa” mga kambing.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang pariralang Hebreo ay literal na tumutukoy sa isang “mabalahibo mula sa mga kambing,” ngunit isa itong idyomatikong tawag sa lalaking kambing. Malinaw at likas sa makabagong Filipino ang “lalaking kambing,” at napananatili nito ang tiyak na uri ng hayop na inihahandog.
- source_word: אֶחָד
  choice: isang
  rationale: Tahasang pinananatili ang bilang upang masundan ang paulit-ulit at maingat na pagtatala ng mga handog sa Bilang 7.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, ang חַטָּאת ay pangalan ng isang uri ng handog, hindi lamang ng abstraktong konsepto ng kasalanan. Ang “bilang” ay natural na nagpapahayag ng gamit o tungkulin ng hayop sa talaan ng mga handog.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa kontekstong kultiko
  choice: handog para sa kasalanan
  alternative: kasalanan
  rationale: Ang talata ay bahagi ng talaan ng mga hayop at kagamitang inihandog ng mga pinuno ng Israel. Kaya ang salita ay tumutukoy rito sa kategorya ng handog, hindi lamang sa kasalanan bilang konsepto. Hindi nito dinaragdagan ang teksto ng anumang natatanging doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng listahan at ang pangwakas na tuldok-kuwit ng konteksto.
