lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang pariralang Hebreo ay idyomatikong tumutukoy sa isang lalaking kambing. Malinaw at natural ito sa makabagong Tagalog at pinananatili ang tiyak na uri ng hayop na inihahandog.
- source_word: אֶחָד
  choice: isang
  rationale: Tuwirang binibilang ng numeral ang hayop na inihahandog at pinananatili ang estilong talaan ng Mga Bilang 7.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa konteksto ng paghahandog, ang חַטָּאת ay tumutukoy sa handog para sa kasalanan. Ang 'bilang' ay natural na nagpapahayag ng gamit o tungkulin ng hayop sa maikling talaang ito.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa konteksto ng paghahandog
  choice: handog para sa kasalanan
  alternative: kasalanan
  rationale: Dahil bahagi ito ng talaan ng mga handog, hinihingi ng konteksto ang teknikal na kahulugang sakripisyal, hindi lamang ang abstraktong 'kasalanan.'
translation_notes:
  register: Maikli, marangal, at natural na makabagong Tagalog; pinananatili ang paulit-ulit na estilong imbentaryo ng kabanata.
