  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: tl
  text: At naghandog ang mga pinuno ng Israel[a], ang mga pinuno ng mga angkan ng kanilang mga ninuno.[b] Sila ang mga pinuno ng mga lipi; sila ang mga nangangasiwa sa mga binilang sa sensus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “iniharap.” Literal na nangangahulugang “inilapit” ang pandiwang Hebreo; sa kontekstong ito, tumutukoy ito sa paghaharap ng mga kaloob para sa pagtatalaga.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga angkan ng kanilang mga ninuno” ay mga pangkat ng magkakamag-anak na nabibilang sa iisang sambahayan o angkan sa Israel.
    reason: cultural_note
  - marker: c
    text: Maaari ring “mga namamahala sa mga itinala” o “sa mga tinipon para bilangin.” Literal na inilalarawan sila ng Hebreo bilang mga “nakatayo sa ibabaw” ng mga nabilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: naghandog
  rationale: Ang Hiphil ng קרב ay literal na ‘nagpalapit’ o ‘nagharap’ at karaniwang tumutukoy sa paghaharap ng handog. Sa konteksto ng pagtatalaga sa Bilang 7, likas at malinaw sa Tagalog ang ‘naghandog,’ habang ang talababa ay nagpapanatili sa literal na larawan at sa posibilidad na ‘iniharap’ ang diin.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: mga pinuno ng Israel
  rationale: Ang נָשִׂיא ay pinuno o pangulong kinatawan ng isang pangkat. Ang ‘mga pinuno’ ay makabago at malinaw, at hindi nagpapahiwatig na mga anak sila ng hari gaya ng maaaring ipahiwatig ng ‘mga prinsipe.’
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: mga pinuno ng mga angkan ng kanilang mga ninuno
  rationale: Ang parirala ay tumutukoy sa mga yunit ng pagkakamag-anak na nakabatay sa angkan ng ama. Iniiwasan ng saling ito ang di-likas na literal na ‘mga bahay ng kanilang mga ama’ ngunit pinananatili ang dimensiyong ninuno at ang istruktura ng angkan.
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: Sila ang mga pinuno ng mga lipi
  rationale: Bagaman literal na ‘mga tungkod’ ang מַטּוֹת, isa itong karaniwang katawagan para sa mga lipi ng Israel sa kontekstong ito. Pinananatili rin ng ‘Sila ang’ ang mariing pag-uulit ng הֵם.
- source_word: הֵם הָעֹמְדִים עַל
  choice: sila ang mga nangangasiwa sa
  rationale: Ang עמד na may עַל ay literal na ‘nakatayo sa ibabaw/harap ng’ at maaaring magpahiwatig ng pamamahala o pangangasiwa. Mas natural sa modernong Tagalog ang ‘nangangasiwa sa,’ at ipinaliliwanag sa talababa ang kongkretong larawan ng Hebreo.
- source_word: הַפְּקֻדִים
  choice: mga binilang sa sensus
  rationale: Tumutukoy ito sa mga naitala o nabilang sa opisyal na pagbibilang. Nililinaw ng ‘sa sensus’ ang konteksto nang hindi ipinipilit na ang tinutukoy ay eksklusibong mga mandirigma.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, marangal, at madaling maunawaang Filipino. Pinili ang ‘angkan ng kanilang mga ninuno’ kaysa sa literal ngunit di-likas na ‘bahay ng kanilang mga ama,’ at ‘nangangasiwa’ para maipahayag nang natural ang awtoridad na nakapaloob sa Hebreong larawan ng pagtayo sa ibabaw ng isang pangkat.
