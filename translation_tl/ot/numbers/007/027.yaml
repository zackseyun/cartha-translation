base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/027.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: tl
  text: isang toro mula sa kawan ng mga baka[a], isang lalaking tupa, at isang lalaking kordero na isang taóng gulang[b], bilang handog na sinusunog;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang toro, anak ng mga baka.” Ang idyomang Hebreo ay tumutukoy sa isang toro mula sa kawan ng mga baka at maaari ring unawaing batang toro.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “anak ng taon nito,” isang idyomang Hebreo para sa lalaking korderong isang taóng gulang o nasa unang taon nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Ang פַּר ay toro, at ang idyomang בֶּן בָּקָר ay likas na maisasalin bilang “mula sa bakahan.” Pinananatili nito ang uri ng hayop nang hindi gumagamit ng di-likas na literal na “anak ng bakahan.”
- source_word: אַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Ang אַיִל ay adultong lalaking tupa; malinaw at karaniwan sa modernong Filipino ang “lalaking tupa.”
- source_word: כֶּבֶשׂ אֶחָד
  choice: isang lalaking kordero
  rationale: Ang כֶּבֶשׂ ay lalaking batang tupa. Pinananatili ng “lalaking kordero” ang kasariang tahasang ipinahihiwatig ng salitang Hebreo.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Ang idyoma ay tumutukoy sa hayop na isang taon ang edad o nasa unang taon nito; ang “isang taóng gulang” ang pinakanatural na pahayag sa Filipino.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog. Ang maikling “handog na sinusunog” ay natural at angkop sa talaan ng mga hain.
theological_decisions:
- issue: Saklaw ng “bilang handog na sinusunog”
  choice: Inilagay ang parirala pagkatapos ng buong listahan upang natural na tumukoy sa tatlong hayop.
  alternative: Maaaring iugnay lamang sa pinakamalapit na “lalaking kordero” ayon sa mahigpit na posisyon ng parirala.
  rationale: Sa pormula ng mga handog sa kabanata at sa sintaks ng talaan, ang tatlong hayop ang magkakasamang bumubuo sa handog na sinusunog; hindi ito pagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “bakahan,” “lalaking tupa,” at “lalaking kordero” upang maging malinaw ang uri at kasarian ng mga hayop. Ang bawat footnote marker ay nasa pangunahing teksto.
