base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: tl
  text: 'at para sa haing pangkapayapaan[a]: dalawang baka, limang lalaking tupa, limang lalaking kambing, at limang korderong isang taóng gulang. Ito ang handog ni Ahiezer na anak ni Ammishaddai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “haing para sa mabuting ugnayan” o “haing para sa kapakanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: at para sa haing pangkapayapaan
  rationale: Ipinakikita ng mga unlapi ang pagpapatuloy ng talaan at ang layon ng handog. Ang “haing pangkapayapaan” ay maikli, likas sa Filipino, at pinananatili ang kinikilalang katawagang pansakripisyo para sa שְׁלָמִים nang hindi inaalis ang iba pang posibleng diwa nito.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Ang בָּקָר ay pangkalahatang tawag sa mga alagang hayop na bovine at hindi tahasang nagsasaad ng kasarian; hindi ito labis na tinutukoy bilang mga toro o kapong baka.
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Tiyak na tumutukoy ang אֵילִם sa mga lalaking tupa; malinaw at pangkaraniwan sa modernong Filipino ang pariralang ito.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Ang עַתֻּדִים ay partikular na mga lalaking kambing, kaya pinanatili ang kasarian sa salin.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang korderong tig-iisang taóng gulang
  rationale: Likas na ipinahahayag nito sa Filipino ang literal na “mga korderong anak ng isang taon” at pinananatili ang mahalagang takdang edad ng mga hayop.
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Ang demonstratibong pormula ay maaaring likas na isalin sa kasalukuyang anyong “Ito ang” sa Filipino kahit nagsasalaysay ng natapos na paghahandog; ang קָרְבָּן ay “handog.”
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ahiezer na anak ni Ammishaddai
  rationale: Isinalin nang tuwiran ang בֶּן bilang “anak ni” at pinanatili ang transliterasyon ng mga pangalang Hebreo.
theological_decisions:
- issue: Saklaw ng kahulugan ng שְׁלָמִים
  choice: haing pangkapayapaan
  alternative: haing para sa mabuting ugnayan; haing para sa kagalingan
  rationale: Pinananatili sa pangunahing teksto ang tradisyonal at madaling makilalang terminong pangsakripisyo, habang inilalahad sa talababa ang tunay na lawak ng kahulugang maaaring tumukoy sa pakikipag-ugnayan o kabutihan/kagalingan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Ang “lalaking tupa” at “lalaking kambing” ay mas madaling maunawaan ng karaniwang mambabasa kaysa sa mas teknikal o lumang mga katawagan. Inilagay ang panandang [a] kaagad pagkatapos ng terminong tinutukoy nito.
