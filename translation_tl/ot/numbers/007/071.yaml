  - severity: low
    issue: Medyo mabigat ang “tig-iisang taóng gulang.”
    rationale: Nauunawaan ito, ngunit ang “isang taóng gulang” ay mas likas sa Filipino at pinananatili ang kinakailangang edad ng mga kordero.
