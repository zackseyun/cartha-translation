translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “sisidlan” upang mapanatili ang lawak ng kahulugan ng terminong Hebreo; nilinaw sa talababa ang mga posibleng hugis. Ginamit ang “siklo” bilang yunit ng timbang sa kontekstong biblikal.
