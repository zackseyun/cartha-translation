  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: tl
  text: isang gintong sisidlan[a] na tumitimbang ng sampung siklo at punô ng insenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mangkok” o “maliit na lalagyan.” Sa mga tradisyonal na salin, madalas itong isalin bilang “kutsara,” ngunit mas malawak ang kahulugan ng salitang Hebreo at tumutukoy sa isang maliit na sisidlang ginagamit sa seremonya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sisidlan
  rationale: Sa talaan ng mga kagamitang panseremonya, tumutukoy ito sa isang maliit na sisidlan. Ang “sisidlan” ay natural at hindi nagpapahiwatig ng karaniwang kutsara, habang pinananatili ang di-tiyak na hugis ng bagay.
- source_word: אַחַת
  choice: isang
  rationale: Payak na bilang na kaayon ng pangngalan.
- source_word: עֲשָׂרָה
  choice: tumitimbang ng sampung siklo
  rationale: Bagaman hindi tahasang inuulit ang yunit sa sugnay, ipinahihiwatig ng paulit-ulit na pormula at konteksto ng kabanata na timbang sa mga siklo ang tinutukoy.
- source_word: זָהָב
  choice: ginto
  rationale: Tumutukoy sa materyal na yari ang sisidlan.
- source_word: מְלֵאָה
  choice: punô ng
  rationale: Likas at tuwirang paglalarawan sa laman ng sisidlan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang makabagong salin para sa mabangong sangkap na sinusunog sa pagsamba.
