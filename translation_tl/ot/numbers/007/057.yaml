  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: tl
  text: isang toro mula sa kawan ng mga baka,[a] isang lalaking tupa, at isang lalaking korderong isang taóng gulang, bilang handog na sinusunog;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang toro, anak ng baka.” Ang parirala ay idyoma para sa torong kabilang sa kawan ng mga baka at maaari ring isaling “isang batang toro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: toro
  rationale: Tumutukoy ito sa isang toro o batang toro; malinaw at likas ang “toro” sa talaan ng mga hayop na inihahandog.
- source_word: אֶחָד
  choice: isa / isang
  rationale: Pangunahing bilang ito na nagsasaad ng tig-iisang hayop sa bawat uri; ginamit ang likas na anyong Filipino na “isang.”
- source_word: בֶּן בָּקָר
  choice: mula sa bakahan
  rationale: Literal na “anak ng bakahan/mga baka,” ngunit idyomatikong inuuri nito ang toro bilang mula sa kawan ng mga baka. Iniiwasan din nito ang di-kinakailangang pag-uulit.
- source_word: אַיִל
  choice: lalaking tupa
  rationale: Karaniwang tumutukoy sa adultong lalaking tupa; mas madaling maunawaan ng ordinaryong mambabasa kaysa sa hiram o teknikal na katawagan.
- source_word: כֶּבֶשׂ
  choice: lalaking kordero
  rationale: Tumutukoy sa kordero, karaniwang lalaki sa kontekstong panghandog; tahasang ipinapakita ng salin ang kasarian.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Idyomang Hebreo para sa hayop na isang taon ang gulang; natural at tiyak ito sa modernong Filipino.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay takdang katawagan para sa handog na sinusunog; ipinapahayag ng “bilang” ang layuning minamarkahan ng לְ.
