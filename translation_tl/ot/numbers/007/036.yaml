  source_fidelity: 'Tumpak ang salin sa Hebreo: naipapahayag ang panahong “nang ikalimang araw,” ang katungkulan ni Selumiel bilang pinuno, ang kaugnayan niya sa mga anak ni Simeon, at ang patronymic na “anak ni Zurisadai.” Ang ayos na inuuna ang pangalan at sinusundan ng pagtukoy sa kaniyang katungkulan ay katanggap-tanggap na Tagalog at umaayon sa English POB audit trail, nang hindi nagdaragdag ng kilos na wala sa talata.'
