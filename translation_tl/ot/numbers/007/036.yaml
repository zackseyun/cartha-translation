base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/036.yaml
  text: On the fifth day Shelumiel son of Zurishaddai[a], leader of the sons of Simeon,
translation:
  language: tl
  text: Nang ikalimang araw, si Selumiel na anak ni Zurisadai, ang pinuno ng mga anak ni Simeon[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng mga Simeonita.” Mas literal sa Hebreo ang “ng mga anak ni Simeon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: Nang ikalimang araw
  rationale: Likas na panandang temporal sa modernong Tagalog; pinananatili ang ordinal at hindi idinaragdag ang kontekstuwal na pariralang “ng pagtatalaga,” na wala sa talata.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Tumutukoy sa kinikilalang lider ng lipi; malinaw ito sa kasalukuyang Tagalog at umiiwas sa maharlikang kahulugang maaaring ipahiwatig ng “prinsipe.”
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: ng mga anak ni Simeon
  rationale: Pinananatili ang lantad na Hebreong pahayag ng kaugnayan kay Simeon at ang diwang ang pinuno ay kabilang sa o kumakatawan sa kaniyang mga inapo.
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Transliterasyon ng pangalang pantangi sa anyong natural at pamilyar sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang natural na anyo ng patronymic sa Tagalog.
- source_word: צוּרִישַׁדָּי
  choice: Zurisadai
  rationale: Transliterasyon ng pangalang pantangi sa anyong natural sa Filipino.
