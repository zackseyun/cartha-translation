translation:
  language: tl
  text: isang lalaking kambing bilang handog para sa kasalanan;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang handog para sa paglilinis.” Sa konteksto ng paghahandog, ang Hebreong חַטָּאת ay maaaring tumukoy sa handog na tumutugon sa kasalanan at sa karumihang ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang pariralang Hebreo ay tumutukoy sa isang kambing na lalaki. Malinaw at natural sa makabagong Filipino ang “lalaking kambing,” at pinananatili nito ang tiyak na uri ng hayop na inihahandog.
- source_word: אֶחָד
  choice: isang
  rationale: Hayagang pinananatili ang bilang na isa, alinsunod sa paulit-ulit na anyong talaan sa Bilang 7.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa konteksto ng paghahandog, ang חַטָּאת ay tumutukoy sa handog na may kaugnayan sa kasalanan at paglilinis, hindi lamang sa abstraktong kasalanan. Natural sa Filipino ang “bilang handog para sa kasalanan.”
theological_decisions:
- issue: Pag-render sa חַטָּאת sa konteksto ng paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Malinaw sa talaan ng mga handog na isang uri ng handog ang tinutukoy. Pinili ang kinikilalang katawagang “handog para sa kasalanan,” habang pinananatili sa talababa ang lehitimong alternatibong “handog para sa paglilinis,” sapagkat maaari ring saklawin ng ritwal ang paglilinis mula sa karumihang ritwal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang maikli at enumeratibong anyo ng talata.
