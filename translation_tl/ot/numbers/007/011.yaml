base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Isang pinuno bawat araw, isang pinuno bawat araw, ang maghahandog ng kani-kanilang handog para sa pagtatalaga ng altar.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “isang pinuno ng lipi bawat araw.” Inuulit sa Hebreo ang “isang pinuno bawat araw” upang idiin ang maayos at sunod-sunod na paghahandog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Pagkatapos, sinabi” habang pinananatili ang payak na diwa ng pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Sa konteksto, tumutukoy ito sa mga pinuno ng mga lipi ng Israel. Malinaw at hindi monarkikal ang “pinuno.”
- source_word: אֶחָד ... לַיּוֹם
  choice: isa ... bawat araw
  rationale: Pinananatili ang numeral at ang distributibong ayos ng sunod-sunod na paghahandog.
- source_word: יַקְרִיבוּ
  choice: maghahandog
  rationale: Ang Hiphil ng קרב sa kontekstong pansakripisyo ay nangangahulugang magharap o mag-alay ng handog; natural dito ang “maghahandog.”
- source_word: קָרְבָּנָם
  choice: kani-kanilang handog
  rationale: Ang hulaping pangmaramihang “kanila” ay tumutukoy sa mga pinunong isa-isang naghahandog; ipinahahayag ng “kani-kanilang” ang distributibong diwa nang hindi ginagawang kolektibo ang handog.
- source_word: לַחֲנֻכַּת
  choice: para sa pagtatalaga ng
  rationale: Tumutukoy ang pangngalan sa seremonya o layunin ng dedication; malinaw at angkop sa ritwal na konteksto ang “pagtatalaga.”
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Karaniwan, malinaw, at dignified na salin sa modernong Filipino para sa dambanang pinaghahandugan.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; Panginoon
  rationale: Tahasan ang Tetragrammaton sa Hebreo. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Sadyang pinanatili ang pag-uulit ng parirala upang maipakita ang diin at organisadong pagkakasunod-sunod sa Hebreo; ginamit ang “kani-kanilang” upang maging natural ang ugnayan ng maramihang paksa at ng handog ng bawat pinuno.
