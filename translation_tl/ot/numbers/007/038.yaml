  text: one gold dish[a], ten shekels[b], full of incense.
translation:
  language: tl
  text: isang gintong sisidlan[a] na tumitimbang ng sampung siklo[b] at puno ng insenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mangkok,” “maliit na kawali,” o, ayon sa tradisyon, “kutsara.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “isang sisidlan, sampu [ng] ginto, puno ng insenso.” Ipinahihiwatig dito ang “siklo” bilang yunit ng timbang batay sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sisidlan
  rationale: Sa talaan ng mga handog para sa tabernakulo, tumutukoy ito sa isang maliit na lalagyang panritwal. Mas malinaw sa modernong Tagalog ang “sisidlan” kaysa “kutsara,” na maaaring ipalagay na karaniwang kubyertos.
- source_word: אַחַת
  choice: isang
  rationale: Tuwirang salin ng pambilang na tumutukoy sa sisidlan.
- source_word: עֲשָׂרָה זָהָב
  choice: tumitimbang ng sampung siklo
  rationale: Pinaikling pormula ito ng timbang; ipinahihiwatig ng kalapit na konteksto at mga katulad na talata na siklo ang yunit. Ang “tumitimbang” ay nilinaw upang hindi mapagkamalang halaga o bilang ng mga bagay ang sampu.
- source_word: זָהָב
  choice: ginto
  rationale: Ipinapahayag ang materyales na ginamit sa sisidlan; natural sa Tagalog ang “sisidlang ginto.”
- source_word: מְלֵאָה
  choice: puno ng
  rationale: Tuwirang inilalarawan ang laman ng sisidlan sa maikli at natural na paraan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwan at malinaw na katawagan sa mabangong sangkap na inihahandog sa pagsamba.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sisidlan” bilang malawak at hindi mapanlinlang na tawag sa kagamitang panritwal; pinanatili sa talababa ang iba pang posibleng anyo nito. Ang eliptikong pormula ng timbang ay nilinaw sa pangunahing teksto.
