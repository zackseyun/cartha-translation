  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: tl
  text: Ngunit wala siyang ibinigay sa mga anak ni Kohat, sapagkat nasa kanila ang tungkulin sa mga banal na bagay; sa kanilang mga balikat nila dadalhin ang mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas literal na paraan: “Sapagkat nasa kanila ang paglilingkod sa santuwaryo; sa balikat nila iyon dadalhin.” Malamang na ang Hebreo ay partikular na tumutukoy sa mga banal na kagamitang ipinagkatiwala sa mga anak ni Kohat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: Ngunit ... sa mga anak ni Kohat
  rationale: Ang לִבְנֵי ay tumutukoy sa di-tuwirang layon at maaari ring mangahulugang mga inapo o angkan. Pinanatili ang pormal at pamilyar na katawagang “mga anak ni Kohat,” at isinalin ang וְ bilang “Ngunit” upang ipakita ang kaibahan sa mga kaloob sa naunang mga angkan.
- source_word: לֹא נָתָן
  choice: wala siyang ibinigay
  rationale: Likas na Tagalog ito at ipinahihiwatig ng konteksto na wala siyang ibinigay na mga kariton at baka sa kanila.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit walang ibinigay sa mga anak ni Kohat; ang “sapagkat” ay malinaw at marangal sa modernong Tagalog.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: maglingkod kaugnay ng mga banal na bagay
  rationale: Ang עֲבֹדָה ay paglilingkod o gawain, at sa kontekstong ito ang הַקֹּדֶשׁ ay malamang na tumutukoy sa mga banal na kagamitang ipinagkatiwala sa mga Kohatita. Hindi nito nililimitahan ang parirala sa santuwaryo bilang lugar.
- source_word: עֲלֵיהֶם
  choice: sila ang inatasan
  rationale: Ang literal na “nasa kanila” o “nakapatong sa kanila” ay idyoma ng pananagutan. Ang “inatasan” ay natural na naghahayag ng obligasyon nang hindi binabago ang diwa.
- source_word: בַּכָּתֵף
  choice: sa kanilang mga balikat
  rationale: Bagaman isahan ang Hebreong “balikat,” kolektibo ang gamit nito. Mas natural sa Tagalog ang maramihang anyo dahil marami ang mga tagapasan.
- source_word: יִשָּׂאוּ
  choice: papasanin nila ang mga iyon
  rationale: Ang imperfect ay nagpapahayag dito ng itinakdang tungkulin. Ang layon na “mga iyon” ay ipinuno mula sa konteksto at tumutukoy sa mga banal na bagay.
theological_decisions:
- issue: Ang tinutukoy ng עֲבֹדַת הַקֹּדֶשׁ
  choice: paglilingkod kaugnay ng mga banal na bagay
  alternative: paglilingkod sa santuwaryo
  rationale: Sa agarang konteksto ng pagdadala ng mga sagradong kagamitan, mas malamang na tumutukoy ang הַקֹּדֶשׁ sa mga banal na bagay. Gayunman, maaaring unawain ang anyo bilang paglilingkod sa santuwaryo, kaya itinala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mga anak ni Kohat” bilang pormal na katawagan sa angkan, “inatasan” para sa natural na pagpapahayag ng Hebreong idyoma ng pananagutan, at “papasanin” upang idiin ang aktuwal na pagdadala sa balikat.
