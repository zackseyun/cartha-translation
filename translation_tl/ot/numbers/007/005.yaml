base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: tl
  text: Kunin mo ang mga iyon mula sa kanila, at gamitin ang mga iyon sa paglilingkod sa Toldang Tipanan.[a] Ibigay mo ang mga iyon sa mga Levita, sa bawat isa ayon sa kanyang gawain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na salin: “at ang mga iyon ay maging ukol sa pagsasagawa ng paglilingkod sa Toldang Tipanan.” Mga bagay na gagamitin sa paglilingkod sa santuwaryo ang tinutukoy.'
    reason: lexical_alternative
  - marker: b
    text: O “sa bawat isa ayon sa kanyang nakatalagang paglilingkod.” Ipinamamahagi ang mga iyon ayon sa tungkuling iniatas sa bawat Levita.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Kunin mo
  rationale: Tuwirang pautos ng לקח kay Moises; natural at malinaw sa makabagong Tagalog.
- source_word: מֵאִתָּם
  choice: mula sa kanila
  rationale: 'Ipinahihiwatig ng parirala ang pinagmulan: kukunin ni Moises ang mga handog mula sa mga pinunong nagdala ng mga ito.'
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: gamitin ang mga iyon sa paglilingkod
  rationale: Literal na ipinapahayag ng Hebreo na ang mga bagay ay magiging ukol sa pagsasagawa ng paglilingkod. Dahil mga karwahe at baka ang tinutukoy, natural sa Tagalog ang gamit na nagpapakitang ilalaan o gagamitin ang mga iyon.
- source_word: עֲבֹדַת
  choice: paglilingkod
  rationale: Tumutukoy sa itinakdang gawain kaugnay ng santuwaryo; pinananatili ng 'paglilingkod' ang opisyal at panrelihiyong himig nang hindi labis na teknikal.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Likas at kinikilalang katawagan sa Tagalog para sa santuwaryong tolda kung saan nakikipagtagpo ang Diyos sa Israel; ang talababa ay nagpapanatili sa mas literal na kahulugan.
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: Ibigay mo ang mga iyon sa mga Levita
  rationale: Pinananatili ang karaniwang kahulugan ng נתן na 'ibigay'; sa konteksto, kasama rito ang paglalaan sa kanila para gamitin.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: sa bawat isa ayon sa kanyang gawain
  rationale: Ang אִישׁ ay distributibo rito, at ang כְּפִי עֲבֹדָתוֹ ay nangangahulugang ayon sa sukat o pangangailangan ng nakatalagang gawain ng bawat isa.
