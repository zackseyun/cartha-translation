lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang pariralang Hebreo ay tumutukoy sa isang kambing na lalaki sa konteksto ng paghahandog. Ang “lalaking kambing” ay malinaw at natural sa modernong Filipino at pinananatili ang kasariang hayagang ipinahihiwatig ng terminong Hebreo.
- source_word: אֶחָד
  choice: isang
  rationale: Tuwirang ipinapahayag nito ang bilang at pinananatili ang anyong talaan ng mga handog sa Bilang 7.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong ritwal, ang חַטָּאת ay pangalan ng isang uri ng handog, hindi lamang tumutukoy sa abstraktong kasalanan. Likas sa Filipino ang “bilang” para ipakita ang gamit o kategorya ng inihahandog.
theological_decisions:
- issue: Pagpapakahulugan sa terminong pansakripisyo na חַטָּאת
  choice: handog para sa kasalanan
  alternative: para sa kasalanan
  rationale: Sa talaan ng mga handog sa Bilang 7, tumutukoy ang חַטָּאת sa itinakdang uri ng handog. Pinananatili ng saling ito ang tiyak na kontekstong ritwal nang hindi ito ginagawang pangkalahatang pagtukoy lamang sa kasalanan.
translation_notes:
  register: Maikli, marangal, at likas sa modernong Filipino. Pinanatili ang enumeratibong anyo ng talata at ang panghuling tuldok-kuwit bilang bahagi ng nagpapatuloy na talaan.
