  text: isang lalaking kambing bilang handog para sa kasalanan;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Ang Hebreong חַטָּאת ay maaaring tumukoy sa handog na tumutugon sa kasalanan at sa ritwal na karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Ang pariralang Hebreo ay tumutukoy sa isang lalaking kambing. Likas at malinaw sa modernong Filipino ang “lalaking kambing,” at pinananatili nito ang tiyak na uri ng hayop na inihahandog.
- source_word: אֶחָד
  choice: isang
  rationale: Malinaw na pinananatili ang bilang na isa, ayon sa paulit-ulit na estilong talaan ng Mga Bilang 7.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, ang חַטָּאת ay tumutukoy sa handog na may kaugnayan sa kasalanan at ritwal na karumihan. Ang “bilang” ay natural na nagpapahayag dito ng gamit o tungkulin ng inihahandog.
theological_decisions:
- issue: Pagbibigay-kahulugan sa חַטָּאת bilang terminong pansakripisyo
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Tiyak na isang uri ng handog ang tinutukoy, ngunit maaaring idiin ng terminong Hebreo ang pagharap sa kasalanan o ang ritwal na paglilinis. Ginamit sa pangunahing teksto ang mas madaling makilalang “handog para sa kasalanan,” habang pinananatili sa talababa ang tunay na alternatibong diwa.
translation_notes:
  register: Maikli at pormal na estilong talaan, gaya ng orihinal. Gumamit ng natural at dignified na modernong Filipino, nang hindi inaalis ang teknikal na diwa ng terminong pansakripisyo.
