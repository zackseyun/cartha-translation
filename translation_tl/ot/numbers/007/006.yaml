  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: tl
  text: Pagkatapos, kinuha ni Moises ang mga kariton[a] at ang mga baka[b], at ibinigay niya ang mga ito sa mga Levita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga bagon.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong salita ay isang kolektibong termino para sa mga baka; ipinakikita ng konteksto sa kabanatang ito na mga bakang pantrabaho ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Ang Qal wayyiqtol ng לקח ay karaniwang nangangahulugang “kumuha.” Sa konteksto, tinanggap ni Moises sa kaniyang pangangalaga ang mga handog, ngunit pinananatili ng “kinuha” ang tuwirang diwa ng Hebreo.
- source_word: הָעֲגָלֹת
  choice: mga kariton
  rationale: Ang עֲגָלוֹת ay mga sasakyang ginagamit sa paghakot. Natural at malinaw sa makabagong Filipino ang “mga kariton”; maaari ring isaling “mga bagon.”
- source_word: הַבָּקָר
  choice: mga baka
  rationale: Ang בָּקָר ay kolektibong katawagan sa mga hayop na mula sa bakahan. Ang “mga baka” ang natural na katumbas sa Filipino at hindi nito tahasang pinakikitid ang salita sa “mga torong panghila,” bagaman iyon ang tinutukoy ng mas malawak na konteksto.
- source_word: וַיִּתֵּן
  choice: ibinigay niya
  rationale: Ang Qal wayyiqtol ng נתן ay tuwirang “nagbigay.” Hindi ginamit ang “itinalaga” upang hindi magdagdag ng administratibong diwang hindi tahasang nasa pandiwa.
- source_word: אוֹתָם
  choice: ang mga iyon
  rationale: Ang panlalaking pangmaramihang panghalip ay sama-samang tumutukoy sa mga kariton at mga baka. Ang “ang mga iyon” ay natural na layon ng pandiwang “ibinigay” sa Filipino.
- source_word: אֶל הַלְוִיִּם
  choice: sa mga Levita
  rationale: Ipinahihiwatig ng אֶל ang paglilipat patungo sa mga Levita; malinaw itong naihahayag ng “sa mga Levita.”
