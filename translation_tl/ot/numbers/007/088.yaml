revisions:
- from: At ang kabuuang bilang ng mga hayop para sa haing pangkapayapaan[a] ay dalawampu’t apat na toro, animnapung lalaking tupa, animnapung lalaking kambing, at animnapung korderong tig-iisang taóng gulang. Ito ang pagtatalaga sa altar matapos itong pahiran ng langis.
  to: Ang kabuuang mga hayop na para sa haing pangkapayapaan[a] ay dalawampu’t apat na toro, animnapung lalaking tupa, animnapung lalaking kambing, at animnapung korderong tig-iisang taóng gulang. Ito ang pagtatalaga ng altar matapos itong pahiran ng langis.
  rationale: Pinalitan ang pambungad upang mas natural na maipahayag ang pangwakas na kabuuan ng talaan nang hindi nagdaragdag ng “bilang.” Pinalitan din ang “pagtatalaga sa altar” ng “pagtatalaga ng altar” upang tumpak na maipakita ang ugnayang genitive sa Hebreo. Walang binagong kahulugan sa mga hayop, dami, uring hain, o pagpapahid.
