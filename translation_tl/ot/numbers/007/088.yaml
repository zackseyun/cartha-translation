language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: tl
  text: Ang kabuuang mga hayop na para sa haing pangkapayapaan[a] ay dalawampu’t apat na toro, animnapung lalaking tupa, animnapung lalaking kambing, at animnapung korderong tig-iisang taóng gulang. Ito ang pagtatalaga ng altar matapos itong pahiran ng langis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “haing pakikipag-isa” o “haing para sa kagalingan.”
    reason: Ipinakikita ang lehitimong lawak ng kahulugan ng שְׁלָמִים, na maaaring magdiin sa kapayapaan, pakikipag-isa, o mabuting kalagayan.
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: At ang kabuuang bilang ng mga hayop
  rationale: Sa konteksto ng pangwakas na talaan, ipinakikilala ng parirala ang kabuuan ng mga hayop na inialay. Ginamit ang “mga hayop” sa halip na literal na “mga baka” sapagkat kasunod na binibilang hindi lamang ang mga toro kundi pati mga tupa at kambing.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: haing pangkapayapaan
  rationale: Pinananatili ang kinikilalang katawagan para sa uring ito ng hain, habang inilalahad sa talababa ang mga lehitimong diwa ng pakikipag-isa at kagalingan.
- source_word: פָּרִים
  choice: mga toro
  rationale: Tuwirang tumutukoy sa mga lalaking baka sa konteksto ng paghahain; hindi idinagdag ang “batang” sapagkat hindi ito hinihingi ng teksto.
- source_word: אֵילִם
  choice: mga lalaking tupa
  rationale: Malinaw at makabagong Tagalog para sa mga barakong tupa, nang hindi gumagamit ng katawagang maaaring hindi pamilyar sa lahat ng mambabasa.
- source_word: עַתֻּדִים
  choice: mga lalaking kambing
  rationale: Pinananatili ang tinutukoy na kasarian sa malinaw at natural na Tagalog.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: mga korderong tig-iisang taóng gulang
  rationale: Pinananatili ang edad ng bawat kordero at nililinaw ng “tig-” na ang pagtukoy ay sa bawat isa sa animnapung kordero.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: pagtatalaga sa altar
  rationale: Sinasaklaw ng “pagtatalaga” ang pagpapasinaya o paglalaan ng altar sa banal na gamit nang hindi nagdaragdag ng salitang “handog,” na wala rito bilang hiwalay na salita.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: matapos itong pahiran ng langis
  rationale: Pinananatili ang di-tiyak na gumaganap ng pagpapahid at ginagawang malinaw sa Tagalog ang ritwal na kahulugan ng pagpapahid.
theological_decisions:
- issue: Kahulugan ng uring hain na שְׁלָמִים
  choice: haing pangkapayapaan
  alternative: haing pakikipag-isa; haing para sa kagalingan
  rationale: Ang tradisyonal na “pangkapayapaan” ay madaling makilala at kaugnay ng ugat ng salita, ngunit hindi nito lubos na naipapakita ang mga diwa ng pakikipag-isa at mabuting kalagayan. Kaya pinanatili sa talababa ang dalawang posibleng diin sa halip na pumili nang tahimik ng iisang interpretasyon.
- issue: Saklaw ng חֲנֻכָּה sa buod
  choice: pagtatalaga sa altar
  alternative: handog sa pagtatalaga ng altar
  rationale: Maaaring tumukoy ang konteksto sa mga handog na kaugnay ng pagtatalaga, ngunit ang Hebreo ay tuwirang nagsasabing “pagtatalaga ng altar.” Iniwasang idagdag sa pangunahing teksto ang “handog” upang hindi paliitin ang saklaw ng salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “dalawampu’t apat” at “animnapu” sa salita upang bumagay sa estilong pampanitikan ng teksto. Ang “pahiran ng langis” ay mas malinaw sa karaniwang mambabasa kaysa sa teknikal o hiram na katawagang “anoint.”
