  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: tl
  text: 'at para sa haing pangkapayapaan[a]: dalawang baka, limang lalaking tupa, limang lalaking kambing, at limang lalaking kordero na tig-iisang taong gulang. Ito ang handog ni Eliab na anak ni Helon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “haing pakikipag-isa” o “haing para sa mabuting kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: at para sa haing pangkapayapaan
  rationale: Ipinagpapatuloy ng וּ ang talaan, at ipinakikilala ng לְ ang layunin o kategorya ng hain. Ang “haing pangkapayapaan” ay maikli, pamilyar sa kontekstong pansamba, at pinananatili ang saklaw ng teknikal na terminong שְׁלָמִים nang hindi ito nililimitahan sa isang interpretasyon lamang.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Ang בָּקָר ay pangkalahatang katawagan sa mga bovine at hindi tumutukoy rito sa kasarian; kaya mas tumpak ang “baka” kaysa “toro” o “barakong baka.”
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Ang אֵילִם ay malinaw na tumutukoy sa mga tupang lalaki. Ginamit ang karaniwang pariralang Filipino upang mapanatili ang kasarian ng hayop.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Ang עַתֻּדִים ay partikular na mga kambing na lalaki, kaya tahasang pinanatili ang pagkakakilanlang ito.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang lalaking kordero na tig-iisang taong gulang
  rationale: Ang כְּבָשִׂים ay mga batang tupang lalaki sa ganitong talaan ng mga hain, at ang בְּנֵי שָׁנָה ay likas na isinalin bilang “tig-iisang taong gulang” dahil maramihan ang tinutukoy.
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Ang קָרְבָּן ay pangkalahatang handog na inihaharap sa Diyos. Ang “Ito ang handog” ay natural sa paulit-ulit na pangwakas na pormula at pinananatili ang present-like na anyo ng Hebreo.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: Eliab na anak ni Helon
  rationale: Isinalin ang patronymic sa natural at maikling anyong Filipino habang pinananatili ang mga pangalang pantangi.
theological_decisions:
- issue: Saklaw ng terminong שְׁלָמִים
  choice: haing pangkapayapaan
  alternative: haing pakikipag-isa; haing para sa mabuting kalagayan
  rationale: Maaaring magpahiwatig ang terminong Hebreo ng kapayapaan, pakikipag-isa, o mabuting kalagayan. Pinili ang kinikilalang terminong “haing pangkapayapaan,” ngunit inilagay sa talababa ang ibang lehitimong kahulugan upang hindi alisin ang tunay na lawak ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalaking tupa/kambing/kordero” sa halip na mas di-pamilyar o posibleng malabong katawagan, at ang “tig-iisang taong gulang” upang malinaw na ang bawat kordero ay ganoon ang edad.
