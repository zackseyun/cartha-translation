    rationale: Bagaman tama ang layon nito, mas malinaw sa modernong Filipino ang ayos na tahasang ikinakabit ang pagiging pari kay Aaron.
  revised_text: At ibinigay niya sa mga anak ni Merari ang apat na kariton at ang walong baka, ayon sa kanilang gawain, sa ilalim ng pangangasiwa ni Itamar, anak ng paring si Aaron.
