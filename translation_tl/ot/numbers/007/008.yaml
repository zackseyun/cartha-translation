  text: וְ/אֵ֣ת אַרְבַּ֣ע הָ/עֲגָלֹ֗ת וְ/אֵת֙ שְׁמֹנַ֣ת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י מְרָרִ֑י כְּ/פִי֙ עֲבֹ֣דָתָ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: tl
  text: At ibinigay niya sa mga anak ni Merari ang apat na kariton at ang walong baka, ayon sa kanilang gawain, sa ilalim ng pangangasiwa ni Itamar, anak ng paring si Aaron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: mga kariton
  rationale: Tumutukoy ang עֲגָלָה sa sasakyang may gulong na ginagamit sa paghakot; natural at angkop sa konteksto ang “kariton.”
- source_word: הַבָּקָר
  choice: mga baka
  rationale: Ang בָּקָר ay tumutukoy sa mga baka; sa kontekstong ito, sila ang mga hayop na hihila sa mga kariton. Hindi kailangang tukuyin bilang mga kapong lalaking baka dahil hindi iyon tahasang sinasabi ng Hebreo.
- source_word: נָתַן
  choice: ibinigay
  rationale: Pinananatili nito ang payak na kahulugan ng pandiwa; ipinahihiwatig ng konteksto ang opisyal na paglalaan ngunit hindi iyon kailangang idagdag sa pandiwa.
- source_word: לִבְנֵי מְרָרִי
  choice: sa mga anak ni Merari
  rationale: Pinananatili ang literal na pampamilya at pantribong pananalita ng Hebreo at malinaw pa rin sa modernong Tagalog.
- source_word: כְּפִי עֲבֹדָתָם
  choice: ayon sa gawaing itinakda sa kanila
  rationale: Ang כְּפִי ay idyomang nangangahulugang “ayon sa,” at ang עֲבֹדָה rito ay ang nakatalagang tungkulin o gawain nila kaugnay ng tabernakulo.
- source_word: בְּיַד אִיתָמָר
  choice: sa ilalim ng pangangasiwa ni Itamar
  rationale: Literal itong “sa kamay ni Itamar,” ngunit sa kontekstong administratibo ay nagsasaad ito ng pamamahala o pangangasiwa.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Sa balarila ng Hebreo, ang “pari” ay tumutukoy kay Aaron, hindi kay Itamar; nililinaw ito ng ayos na “ni Aaron na pari.”
