revisions:
- from: At ibinigay niya sa mga anak ni Merari ang apat na kariton at ang walong baka, ayon sa gawaing itinakda sa kanila, sa ilalim ng pangangasiwa ni Itamar na anak ni Aaron na pari.
  to: At ibinigay niya sa mga anak ni Merari ang apat na kariton at ang walong baka, ayon sa kanilang gawain, sa ilalim ng pangangasiwa ni Itamar, anak ng paring si Aaron.
  rationale: Inalis ang dagdag na “itinakda” upang panatilihin ang payak na saklaw ng כְּפִי עֲבֹדָתָם. Inayos ang huling parirala upang malinaw na si Aaron ang pari. Nagdagdag ng talababa para sa literal na idyoma ng בְּיַד, habang pinananatili sa pangunahing teksto ang likas na kahulugang administratibo nito.
