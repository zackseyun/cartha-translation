base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: tl
  text: At para sa haing pangkapayapaan:[a] dalawang baka, limang lalaking tupa, limang lalaking kambing, at limang lalaking kordero na tig-iisang taon ang edad. Ito ang handog ni Ahira na anak ni Enan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga handog para sa mabuting kalagayan” o “mga handog para sa pakikipagsamahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: At para sa handog na hain para sa kapayapaan
  rationale: Pinananatili ng “At para sa” ang pang-ugnay at pang-ukol, samantalang ipinahahayag ng “handog na hain” ang nominal na זֶבַח. Ang “para sa kapayapaan” ay tradisyonal at madaling maunawaang katawagan, habang inilalahad sa talababa ang iba pang posibleng diwa ng שְׁלָמִים.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Ang בָּקָר ay kolektibong katawagan para sa mga baka at hindi tahasang tumutukoy sa kasarian; natural sa Filipino ang “dalawang baka.”
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Partikular na tumutukoy ang אֵילִים sa mga lalaking tupa; malinaw at pangkaraniwan sa modernong Filipino ang salin.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Tumutukoy ang עַתֻּדִים sa mga lalaking kambing, kaya pinanatili ang kasariang hayagang nasa Hebreo.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang lalaking korderong tig-iisang taon
  rationale: Pinananatili ang bilang, kasarian, at edad na ipinahahayag ng pariralang Hebreo; ang “tig-iisang taon” ay natural na paglalarawan sa bawat isa sa limang kordero.
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Ginagawang natural sa Filipino ang pangwakas na pormula ng pagkakakilanlan nang hindi kailangang magdagdag ng panahunang wala namang tahasang minamarkahan sa Hebreo.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: Ahira na anak ni Enan
  rationale: Isinatinig ang mga pangalang pantangi at isinalin nang tuwiran ang patronimikong “anak ni.”
theological_decisions:
- issue: Saklaw ng kahulugan ng שְׁלָמִים
  choice: handog na hain para sa kapayapaan
  alternative: handog para sa mabuting kalagayan / handog ng pakikipag-ugnayan
  rationale: Hindi tiyak na iisang konsepto lamang ang saklaw ng teknikal na terminong ito. Pinili sa teksto ang maikli at kinikilalang katawagan, ngunit pinanatili sa talababa ang tunay na mga alternatibong diwa nang hindi nagpapasya para sa isang teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang malinaw na mga katawagan sa hayop at iniwasan ang labis na teknikal o makalumang bokabularyo. Nasa pangunahing teksto ang markang [a] at tumutugma ito sa talababa.
