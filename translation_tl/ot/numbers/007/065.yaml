  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: tl
  text: at para sa hain para sa kapayapaan:[a] dalawang baka, limang lalaking tupa, limang lalaking kambing, at limang lalaking korderong tig-iisang taong gulang. Ito ang handog ni Abidan na anak ni Gideoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa pakikipag-ugnayan” o “handog para sa kapakanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח
  choice: at para sa handog na hain
  rationale: Pinananatili ng “at para sa” ang kaugnayan sa naunang talaan, habang malinaw na ipinapahayag ng “handog na hain” ang kultikong diwa ng זֶבַח nang hindi nagiging teknikal o lipas ang pananalita.
- source_word: הַשְּׁלָמִים
  choice: para sa kapayapaan
  rationale: Ang parirala ay kumakatawan sa tradisyonal na “handog para sa kapayapaan,” habang ang talababa ay nagpapanatili sa iba pang lehitimong diwa ng pakikipag-ugnayan at kagalingan na taglay ng terminong Hebreo.
- source_word: בָּקָר שְׁנַיִם
  choice: dalawang baka
  rationale: Kolektibong katawagan ang בָּקָר para sa mga hayop na bovine at hindi nito tahasang tinutukoy ang kasarian; natural at sapat na malawak sa Filipino ang “dalawang baka.”
- source_word: אֵילִם חֲמִשָּׁה
  choice: limang lalaking tupa
  rationale: Tiyak na tumutukoy ang אֵילִם sa mga ram; malinaw sa karaniwang Filipino ang “lalaking tupa.”
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: limang lalaking kambing
  rationale: Ipinahihiwatig ng עַתֻּדִים ang mga lalaking kambing, kaya pinananatili ang kasariang mahalaga sa talaan ng mga hain.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: limang lalaking korderong tig-iisang taong gulang
  rationale: Pinananatili ang bilang, kasarian, at edad ng mga kordero; ipinahahayag ng “tig-iisang taong gulang” na bawat isa ay isang taong gulang.
- source_word: זֶה קָרְבַּן
  choice: Ito ang handog ni
  rationale: Likas sa Filipino ang nominal na pormulang ito at hindi nito ipinapasok ang tahasang panahunan na wala naman sa Hebreo.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: Abidan na anak ni Gideoni
  rationale: Isinasatitik ang mga pangalang pantangi at natural na isinasalin ang patronimikong konstruksyon bilang “na anak ni.”
theological_decisions:
- issue: Saklaw ng kahulugan ng שְׁלָמִים
  choice: handog na hain para sa kapayapaan
  alternative: handog para sa pakikipag-ugnayan; handog para sa kagalingan
  rationale: Pinili sa pangunahing teksto ang makikilala at malapit-sa-anyo na katawagan, ngunit hindi ipinagpapalagay na “kapayapaan” lamang ang buong saklaw ng terminong Hebreo; pinananatili sa talababa ang tunay na leksikal na lawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong listahan at ang pormulang pangwakas ng talata. Ginamit ang “lalaking tupa/kambing/kordero” sa halip na mas bihira o hiram na mga katawagang maaaring hindi agad maunawaan ng karaniwang mambabasa.
