  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: tl
  text: 'Dinala nila sa harap ni Yahweh ang kanilang handog: anim na karitong may takip[a] at labindalawang bakang panghila—isang kariton para sa bawat dalawang pinuno at isang bakang panghila para sa bawat isa. Iniharap nila ang mga iyon sa harap ng tabernakulo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anim na karitong may bubong.” Tradisyonal na nauunawaan ang pariralang Hebreo na עֶגְלֹת צָב bilang tumutukoy sa mga karitong pantransportasyon na may takip o kanopya.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: kanilang handog
  rationale: Ang קָרְבָּן ay isang bagay na inilalapit o inihaharap sa kontekstong panrelihiyon; natural at angkop sa seremonyal na tagpo ang “handog.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang spatial at relational na diwa ng לִפְנֵי at natural na ginagamit ang pantukoy na “ni” bago ang personal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: עֶגְלֹת צָב
  choice: mga karitong may takip
  rationale: Ang עֲגָלוֹת ay mga kariton, at tradisyonal na nauunawaan ang צָב bilang tumutukoy sa may takip o kanopyang sasakyan. Malinaw at likas sa Filipino ang parirala.
- source_word: בָּקָר
  choice: mga baka
  rationale: Maaaring tumukoy ang בָּקָר sa mga baka sa pangkalahatan. Sa Filipino, ang “baka” ang natural na katawagang sumasaklaw sa mga hayop na pantrabaho rito nang hindi nagpapahiwatig ng kasariang hindi tiyak sa unang termino.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: isang kariton para sa bawat dalawang pinuno
  rationale: 'Ipinahahayag nito ang distributibong ayos: tig-isang kariton ang bawat pares ng mga pinuno.'
- source_word: הַנְּשִׂאִים
  choice: mga pinuno
  rationale: Sa konteksto ng Mga Bilang, ang נָשִׂיא ay pinuno ng lipi; tumpak at madaling maunawaan ang “pinuno” at hindi ito nagdaragdag ng monarkikong kahulugan.
- source_word: וְשׁוֹר לְאֶחָד
  choice: at isang baka para sa bawat isa
  rationale: Pinananatili ng “bawat isa” ang distributibong pahayag at ang implicit na pagtukoy pabalik sa bawat pinuno.
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: Iniharap nila ang mga iyon
  rationale: Ang hiphil ng קרב ay maaaring mangahulugang ilapit o ihandog. Ang “iniharap” ay angkop sa mga kariton at baka at hindi ipinapalagay na kinatay ang mga ito bilang hain.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ang מִשְׁכָּן ay ang banal na tirahan o tabernakulo. Ang “tabernakulo” ay tiyak at kinikilalang terminong Filipino, at hindi ito ipinagkakamali sa אֹהֶל מוֹעֵד, ang tolda ng pagpupulong.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalang יְהוָה ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; hindi rin pinipili ang mas huling anyong “Jehova.”
- issue: Kahulugan ng וַיַּקְרִיבוּ para sa mga kariton at baka
  choice: iniharap
  alternative: inihandog o inilapit
  rationale: Ipinapakita ng konteksto ang seremonyal na paghaharap ng mga ari-arian sa tabernakulo. Iniiwasan ng “iniharap” ang hindi kinakailangang implikasyon na ang mga baka ay agad na inialay sa pamamagitan ng pagkatay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “karitong may takip” sa halip na mas lumang o mas teknikal na katawagan, “mga pinuno” para sa mga lider ng lipi, at “tabernakulo” bilang tiyak na terminong panrelihiyon. Hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga sugnay.
