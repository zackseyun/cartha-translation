  yaml_path: translation/ot/numbers/007/062.yaml
  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: tl
  text: isang sisidlang ginto na may bigat na sampung siklo[a], punô ng insenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang sisidlan, sampung ginto, punô ng insenso.” Nauunawaan mula sa paulit-ulit na pormula ng mga handog sa Bilang 7 na ang yunit ng timbang ay siklo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sisidlan
  rationale: Sa konteksto ng mga handog, tumutukoy ito sa isang maliit na lalagyan ng insenso. Mas natural at hindi labis na tiyak ang “sisidlan” kaysa “kutsara” o “mangkok.”
- source_word: אַחַת
  choice: isang
  rationale: Tuwirang nagpapahayag ng bilang na isa at likas na kasama ng pangngalan sa Filipino.
- source_word: עֲשָׂרָה זָהָב
  choice: may bigat na sampung siklo
  rationale: Hindi nakasulat ang yunit na שֶׁקֶל sa pinaikling linyang ito, ngunit malinaw itong ipinahihiwatig ng paulit-ulit na pormula sa Bilang 7. Ipinapahayag ng “may bigat na” na sukat ng gintong sisidlan ang tinutukoy.
- source_word: זָהָב
  choice: ginto
  rationale: Tumutukoy sa materyales ng sisidlan; natural sa Filipino ang pariralang “sisidlang ginto.”
- source_word: מְלֵאָה
  choice: punô ng
  rationale: Maikli at natural na katumbas ng pang-uring nagsasabing laman ang sisidlan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Karaniwang makabagong katawagan para sa mabangong sangkap na sinusunog sa pagsamba.
