base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/085.yaml
  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: tl
  text: Ang bawat pilak na pinggan ay may timbang na 130 siklo, at ang bawat mangkok ay 70 siklo. Ang kabuuang pilak ng mga sisidlan ay 2,400 siklo, ayon sa siklo ng santuwaryo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa siklong ginagamit sa santuwaryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: '130'
  rationale: Ang tambalang bilang sa Hebreo ay likas na ipinahahayag sa makabagong Filipino bilang 130.
- source_word: הַקְּעָרָה הָאַחַת כֶּסֶף
  choice: bawat pilak na pinggan
  rationale: Sa konteksto ng imbentaryo, ang isahang anyo na may pantukoy at bilang ay distributibo—tumutukoy sa bawat pinggan; ang כֶּסֶף ay materyal na pilak, hindi salapi.
- source_word: הַמִּזְרָק הָאֶחָד
  choice: bawat mangkok
  rationale: Ang מִזְרָק ay isang mangkok o palanggana para sa ritwal; malinaw at natural sa Filipino ang “mangkok,” at distributibo rito ang isahang anyo.
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: ang kabuuang pilak ng mga sisidlan
  rationale: Ipinahahayag ng כֹּל ang kabuuang dami, at ang כֵּלִים ay mga sisidlan o kagamitan; pinananatili ng salin ang pagtukoy sa pilak na bumubuo sa mga ito.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: 2,400
  rationale: Karaniwang malinaw na pagsulat sa makabagong Filipino ng kabuuang bilang.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Tinutukoy ng parirala ang pamantayan ng timbang na ginamit; natural at tumpak sa Filipino ang “ayon sa siklo ng santuwaryo.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siklo” bilang transliteradong sinaunang yunit ng timbang at ang “santuwaryo” para sa banal na lugar. Ang mga numerong 130, 70, at 2,400 ay ginawang digit para sa madaling pagbasa sa tekstong imbentaryo.
