  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: tl
  text: isang toro mula sa kawan ng mga baka, isang lalaking tupa, at isang lalaking korderong isang taóng gulang, bilang handog na sinusunog;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Sa konteksto ng paghahandog, ang פַּר ay toro, at ang בֶּן בָּקָר ay idyomatikong tumutukoy sa hayop na mula sa bakahan. Pinananatili ng salin ang uri at bilang ng hayop nang hindi literal na isinasalin ang Hebreong idyoma.
- source_word: אַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Ang אַיִל ay hustong gulang na lalaking tupa; malinaw at likas sa modernong Filipino ang “lalaking tupa.”
- source_word: כֶּבֶשׂ אֶחָד
  choice: isang lalaking kordero
  rationale: Ang כֶּבֶשׂ ay lalaking batang tupa. Ginagawang hayag ng “lalaking kordero” ang kasariang taglay ng salitang Hebreo.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Ito ang natural na Filipino para sa Hebreong idyomang nagsasaad na ang hayop ay nasa unang taon o isang taon ang gulang.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na ganap na sinusunog. Ang pariralang ito ay malinaw sa karaniwang mambabasa at angkop sa ayos ng talaan.
- source_word: אֶחָד
  choice: isang
  rationale: Ang paulit-ulit na bilang ay tumutukoy nang hiwalay sa bawat hayop; pinananatili ito sa salin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang maikli at enumeratibong anyo ng talata, kasama ang paulit-ulit na “isang.”
