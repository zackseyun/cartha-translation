translation_notes:
  register: Gumamit ng natural at dignified na modernong Filipino. Pinanatili ang paulit-ulit na 'isang' bilang katangian ng pormal na talaan. Ginamit ang 'lalaking tupa' at 'lalaking kordero' para sa malinaw na pag-unawa, at ang mga tunay na alternatibong leksikal ay inilagay sa mga talababa.
