  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: tl
  text: isang toro mula sa kawan ng mga baka[a], isang lalaking tupa, at isang lalaking korderong isang taóng gulang[b], bilang handog na sinusunog;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang toro, anak ng mga baka.” Isa itong Hebreong idyoma para sa isang hayop na mula sa kawan ng mga baka.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nasa unang taon nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Pinagsasama nito ang bilang, uri ng hayop, at Hebreong idyomang בֶּן בָּקָר ('anak ng bakahan') sa natural na modernong Tagalog habang pinananatili ang ideya na ang toro ay mula sa kawan ng mga baka.
- source_word: אַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa, lalo na sa mga talaan ng handog. Mas madaling maunawaan ng karaniwang mambabasa ang 'lalaking tupa' kaysa sa hiram na terminong 'barakong tupa' o 'ram'.
- source_word: כֶּבֶשׂ אֶחָד
  choice: isang lalaking kordero
  rationale: Ang כֶּבֶשׂ ay kordero at nasa panlalaking anyo; tahasang inilalahad ng salin ang kasarian na mahalaga sa espesipikasyon ng handog.
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Natural itong salin ng Hebreong idyoma tungkol sa edad; inilalagay sa talababa ang posibleng pagbasa na 'nasa unang taon nito.'
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubos na sinusunog. Ang pariralang ito ay malinaw at dignified sa modernong Tagalog, at ang 'bilang' ay natural na kumakatawan sa prefiks na לְ sa konteksto ng talaan.
- source_word: אֶחָד
  choice: isang
  rationale: Ang pag-uulit ng bilang sa bawat hayop ay pinananatili upang masundan ang pormal na ayos ng talaan sa Hebreo.
