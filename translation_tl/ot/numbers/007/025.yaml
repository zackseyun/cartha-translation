translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga numerong 130 at 70 para madaling mabasa ang talaan, at pinanatili ang “siklo” bilang sinaunang yunit ng timbang. Ang “santuwaryo” ay pormal ngunit karaniwang terminong biblikal.
