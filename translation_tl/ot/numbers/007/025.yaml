base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: tl
  text: Ang handog niya ay isang platong pilak[a] na may bigat na 130 siklo, at isang mangkok na pilak[b] na may bigat na 70 siklo, ayon sa siklo ng santuwaryo.[c] Kapuwa puno ang mga ito ng pinong harina na hinaluan ng langis bilang handog na butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang pinggang pilak.”
    reason: lexical_alternative
  - marker: b
    text: O “isang palangganang pilak.”
    reason: lexical_alternative
  - marker: c
    text: Ang “siklo ng santuwaryo” ay pamantayang timbang na ginagamit sa santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Ang handog niya ay
  rationale: Ang קָרְבָּן ay handog na inihaharap sa kontekstong ritwal. Likas sa Tagalog ang pagdaragdag ng “ay” sa pormulang talaan.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: isang platong pilak
  rationale: Ang קְעָרָה ay malapad o mababaw na sisidlan; malinaw at karaniwan ang “plato,” habang itinatala sa talababa ang posibleng “pinggan.”
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: na may bigat na 130 siklo
  rationale: Inililipat sa natural na ayos ng Tagalog ang literal na “tatlumpu at isang daan, ang bigat nito,” habang pinananatili ang yunit na siklo.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: isang palangganang pilak
  rationale: Ang מִזְרָק ay ritwal na sisidlang maaaring mangahulugang mangkok o palanggana. Pinili ang “palanggana” upang maiba sa karaniwang mangkok at maipahiwatig ang gamit bilang sisidlan.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: na may bigat na 70 siklo
  rationale: Ipinahahayag nang tahasan ang ipinahihiwatig na bigat upang maging malinaw at natural sa Tagalog.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Tumutukoy ang parirala sa pamantayang timbang na ginagamit sa santuwaryo. Pinananatili ng salin ang anyong “siklo ng santuwaryo,” at nililinaw ito sa talababa.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Kapuwa puno ang mga ito
  rationale: Pinananatili ang tahasang pagtukoy sa dalawang sisidlan at ang predikatibong diwa ng “puno.”
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwan at tumpak na katumbas para sa harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Ipinahahayag ng passive participle ang harinang inihanda sa pamamagitan ng paghahalo ng langis.
- source_word: לְמִנְחָה
  choice: bilang handog na butil
  rationale: Sa kontekstong pari at paghahandog, ang מִנְחָה ay tiyak na handog mula sa ani o butil, hindi lamang pangkalahatang handog.
