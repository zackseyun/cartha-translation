  text: בְּ/יוֹם֙ שְׁנֵ֣ים עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: tl
  text: Sa ikalabindalawang araw, ang pinuno ng mga anak ni Neftali ay si Ahira na anak ni Enan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר יוֹם
  choice: Nang ikalabindalawang araw
  rationale: Ang בְּיוֹם ay temporal, at ang שְׁנֵים עָשָׂר kasama ng יוֹם ay bumubuo ng ordinal na pahayag. Ang “Nang ikalabindalawang araw” ay likas sa modernong Tagalog at pinananatili ang pormulang temporal ng kabanata.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Sa kontekstong pantribo, tumutukoy ito sa kinikilalang namumuno ng lipi; malinaw ang “pinuno” at wala itong di-kinakailangang pahiwatig ng pagiging maharlika na maaaring dala ng “prinsipe.”
- source_word: לִבְנֵי נַפְתָּלִי
  choice: ng mga anak ni Neftali
  rationale: Ang לְ ay nagpapakita rito ng kaugnayan ng pinuno sa pangkat. Pinananatili ng “mga anak ni Neftali” ang panlalaking anyo at karaniwang katawagang pantribo ng Hebreo.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Isinalin sa titik ang personal na pangalan sa anyong madaling basahin sa Tagalog.
- source_word: בֶּן עֵינָן
  choice: anak ni Enan
  rationale: Tuwirang katumbas ito ng karaniwang Hebreong patronimiko; natural sa Tagalog ang “anak ni Enan.”
theological_decisions:
- issue: Panlalaking katawagang pantribo na בְּנֵי
  choice: mga anak ni Neftali
  alternative: mga inapo ni Neftali
  rationale: Ang Hebreo ay panlalaking maramihan at ginagamit bilang nakagawiang katawagan sa lipi. Pinananatili ng salin ang anyong ito nang hindi ginagawang neutral ang kasarian.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Nang” para sa natural na panimulang temporal, “pinuno” para sa kontekstong pantribo, at ang pangalang “Neftali” ayon sa nakasanayang anyong Tagalog.
