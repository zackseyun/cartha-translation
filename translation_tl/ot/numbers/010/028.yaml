translation:
  language: tl
  text: Ito ang mga yugto ng paglalakbay ng mga anak ni Israel ayon sa kani-kanilang pangkat[a], at umalis sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa kanilang mga hukbo” o “ayon sa kanilang mga dibisyon.” Ipinahihiwatig ng Hebreo ang organisadong mga pangkat para sa paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Ang pangmaramihang demonstratibo ay nagsisilbing panimulang buod. Natural sa Filipino ang “Ito ang” para tukuyin ang kabuuang ayos o talaan ng mga pagkilos.
- source_word: מַסְעֵי
  choice: mga yugto ng paglalakbay
  rationale: Ang construct plural ng מַסָּע ay tumutukoy sa sunod-sunod na yugto o hakbang ng paglalakbay; malinaw nitong naipapahayag ang mga magkakasunod na pag-alis sa ilang.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal at pampamilyang katawagan ng Hebreo, sa halip na gawing simpleng “mga Israelita.”
- source_word: לְצִבְאֹתָם
  choice: ayon sa kani-kanilang pangkat
  rationale: Ipinahihiwatig ng צבא ang organisadong mga pangkat o dibisyon sa paglalakbay. Ang “kani-kanilang pangkat” ay natural sa Filipino at hindi labis na nagpapahiwatig na aktuwal silang nakikipagdigma.
- source_word: וַיִּסָּעוּ
  choice: at humayo sila
  rationale: Ang wayyiqtol ng נסע ay nagsasaad ng pag-alis o pagsisimula ng paglalakbay; dignified at likas sa salaysay ang “humayo.”
