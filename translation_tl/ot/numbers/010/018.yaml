  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: tl
  text: Pagkatapos ay lumakad ang watawat[a] ng kampo ni Ruben ayon sa kanilang mga pangkat,[b] at si Elizur na anak ni Sedeur ang pinuno ng pangkat nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “estandarte.”
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa kanilang mga hanay” o “ayon sa kanilang mga hukbo.” Ang salitang Hebreo ay maaaring tumukoy sa organisadong mga pangkat na may anyong militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Pagkatapos ay lumakad
  rationale: Isinusulong ng waw na kasunod ang salaysay, at sa konteksto ng paglalakbay ng kampo, natural na ipinahahayag ng “Pagkatapos ay lumakad” ang sunod na pagkilos nang hindi idinaragdag ang diwang tahasang ‘nagligpit ng kampo.’
- source_word: דֶּגֶל
  choice: watawat
  rationale: Ang דֶּגֶל ay tumutukoy sa pantribong sagisag na pinagbubukluran at sinusundan ng pangkat sa paglalakbay. Malinaw at kongkreto sa modernong Filipino ang “watawat,” habang inilalagay sa talababa ang alternatibong “estandarte.”
- source_word: מַחֲנֵה רְאוּבֵן
  choice: kampo ni Ruben
  rationale: Natural na Filipino itong katumbas ng payak na ugnayang paari sa construct chain.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kanilang mga pangkat
  rationale: Sa konteksto ng Mga Bilang, ang צבא ay maaaring tumukoy sa organisadong mga yunit sa pagmamartsa, hindi lamang sa hukbong nakikipagdigma. Pinananatili ng “mga pangkat” ang maramihang anyo at ang ideya ng maayos na pagkakahati nang hindi labis na ginagawang militar ang pahayag.
- source_word: וְעַל צְבָאוֹ
  choice: at ... ang namumuno sa pangkat nito
  rationale: Ipinahihiwatig ng עַל ang pamamahala o pangangasiwa. Ang “pangkat nito” ay nagpapanatili ng kaugnayan sa naunang צבא ngunit wastong isahan ayon sa hulaping Hebreo.
- source_word: אֱלִיצוּר
  choice: Elizur
  rationale: Isinalin-titik ang pangalang pantangi sa anyong madaling basahin sa Filipino.
- source_word: בֶּן שְׁדֵיאוּר
  choice: anak ni Sedeur
  rationale: Natural na Filipino ang “anak ni” para sa patronymic, at isinalin-titik ang pangalan ng ama.
