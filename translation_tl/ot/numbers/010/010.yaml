id: NUM.10.10
reference: Numbers 10:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: tl
  text: Sa araw ng inyong pagsasaya, sa inyong mga itinakdang panahon, at sa mga unang araw ng inyong mga buwan[a], hihipan ninyo ang mga trumpeta sa ibabaw ng inyong mga handog na sinusunog at ng inyong mga haing pangkapayapaan[b]. Ang mga ito ay magiging pang-alaala para sa inyo sa harap ng inyong Diyos. Ako si Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga bagong buwan.” Literal sa Hebreo, “sa mga pasimula ng inyong mga buwan.”
    reason: lexical_alternative
  - marker: b
    text: O, “mga haing para sa pakikisama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: inyong pagsasaya
  rationale: Ipinahahayag nito ang kagalakan bilang isang okasyon at likas itong kaagapay ng pariralang “sa araw ng.”
- source_word: מוֹעֲדֵיכֶם
  choice: inyong mga itinakdang panahon
  rationale: Pinananatili nito ang malawak na diwa ng mga panahong itinakda para sa banal na pagtitipon o kapistahan nang hindi nililimitahan ang salita sa mga pista lamang.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: mga unang araw ng inyong mga buwan
  rationale: Malinaw at natural nitong inililipat ang literal na “mga pasimula ng inyong mga buwan,” habang ipinakikita ang kahulugang pangkalendaryo.
- source_word: וּתְקַעְתֶּם בַּחֲצֹצְרֹת
  choice: hihipan ninyo ang mga trumpeta
  rationale: Direkta at likas na paglalarawan ito sa pagpapatunog ng mga trumpeta.
- source_word: עַל עֹלֹתֵיכֶם
  choice: sa ibabaw ng inyong mga handog na sinusunog
  rationale: Pinananatili ng “sa ibabaw” ang batayang larawan ng pang-ukol na עַל at ng pagtugtog na kasabay ng paghahandog.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: inyong mga haing pangkapayapaan
  rationale: Pinananatili nito ang kaugnayan ng שְׁלָמִים sa kapayapaan at kagalingan, at ipinahahayag ng “haing” ang uri ng sakripisyo.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: Ang mga ito ay magiging pang-alaala para sa inyo
  rationale: Ang “mga ito” ay nagpapanatili ng sanggunian sa mga trumpeta o sa pagpapatunog sa konteksto, samantalang ang “pang-alaala” ay angkop sa rituwal na diwa ng זִכָּרוֹן.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: sa harap ng inyong Diyos
  rationale: Tuwirang inililipat nito ang diwang “sa harap” o “sa presensiya” ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng שְׁלָמִים
  choice: mga haing pangkapayapaan
  alternative: mga haing para sa pakikisama
  rationale: Pinananatili ng pangunahing salin ang semantikong ugnayan sa kapayapaan at kabuuang kagalingan, habang inilalagay sa talababa ang lehitimong pagbasa na nagbibigay-diin sa pakikisama.
- issue: Sanggunian ng pangmaramihang וְהָיוּ
  choice: Ang mga ito
  alternative: Ang mga tunog ng trumpeta
  rationale: Hindi tahasang pinapangalanan muli ng Hebreo ang simuno. Ang “mga ito” ay hindi sapilitang nagpapasiya kung ang tinutukoy ay ang mga trumpeta o ang pagpapatunog ng mga iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang rituwal na bokabularyo ngunit iniwasan ang labis na teknikal o denominasyonal na pananalita. Inilagay ang mga pananda [a] at [b] sa mismong mga pariralang ipinaliliwanag ng mga talababa.
