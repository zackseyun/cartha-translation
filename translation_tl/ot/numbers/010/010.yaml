  source_fidelity: Tapat ang salin sa Hebreo. Napananatili nito ang tatlong magkakaugnay na okasyon, ang paghipan sa mga trumpeta kaugnay ng mga handog, ang di-tiyak ngunit pangmaramihang sanggunian ng “Ang mga ito,” at ang banal na pangalan na Yahweh. Ang “mga unang araw ng inyong mga buwan” ay isang malinaw na pangkalendaryong pagsasalin ng רָאשֵׁי חָדְשֵׁיכֶם nang hindi itinatago ang literal na anyo sa talababa.
