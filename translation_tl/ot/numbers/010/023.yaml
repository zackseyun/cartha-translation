  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: tl
  text: At si Gamaliel na anak ni Pedasur ang namumuno sa pangkat ng lipi ng mga anak ni Manases.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na צְבָא ay maaari ring isaling “hukbo,” “kalipunan,” o “dibisyon”; dito, tumutukoy ito sa organisadong pangkat ng lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: At ang namumuno sa
  rationale: Sa paulit-ulit na pormula tungkol sa kaayusan ng paglalakbay, ipinakikilala ng וְעַל ang pinunong nakatalaga sa isang pangkat. Likas sa makabagong Tagalog ang “ang namumuno sa” at malinaw nitong ipinapahayag ang tungkulin.
- source_word: צְבָא
  choice: pangkat
  rationale: Tumutukoy rito sa organisadong pangkat ng isang lipi sa kaayusan ng kampo at paglalakbay, hindi lamang sa hukbo para sa pakikipagdigma. Pinananatili sa talababa ang ibang posibleng diwa.
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa kontekstong ito ng Mga Bilang, ang salita ay tumutukoy sa yunit na panliping nagmula sa isang ninuno.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: mga anak ni Manases
  rationale: Pinananatili ang literal at kinagawiang katawagang panlipi na “mga anak ni Manases,” na tumutukoy sa linyang nagmula sa kanya.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Isinatinig ang pangalang pantangi ayon sa kinagawiang anyo sa Tagalog.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwan at natural na paraan sa Tagalog upang ipahayag ang ugnayang genealogical.
- source_word: פְּדָה צוּר
  choice: Pedasur
  rationale: Itinuturing itong iisang pangalang pantangi at isinatinig sa anyong angkop sa Tagalog.
