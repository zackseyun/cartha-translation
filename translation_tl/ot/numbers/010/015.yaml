  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י יִשָׂשכָ֑ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: tl
  text: Ang namumuno sa pangkat[a] ng lipi ng mga anak ni Isacar ay si Netanel na anak ni Zuar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo” o “dibisyon.” Ang salitang Hebreo ay tumutukoy rito sa isang organisadong pangkat ng lipi na nasa kaayusan ng paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Ang namumuno sa
  rationale: Sa pormulang ito, ang וְעַל ay nagpapakilala sa taong nakatalaga sa pamumuno ng pangkat. Hindi na kailangang isalin nang hiwalay ang pang-ugnay na וְ dahil likas na ipinagpapatuloy ng pangungusap ang naunang talaan.
- source_word: צְבָא
  choice: pangkat
  rationale: Tumutukoy ito sa organisadong pangkat ng lipi sa kaayusan ng paglalakbay. Ang “pangkat” ay natural sa modernong Tagalog at hindi labis na nagpapahiwatig na hukbong pandigma.
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa kontekstong ito, malinaw na ang kahulugan ay isang yunit panlipi, hindi literal na tungkod.
- source_word: בְּנֵי יִשָׂשכָר
  choice: mga anak ni Isacar
  rationale: Pinananatili nito ang literal na panliping pormulang “mga anak ni Isacar,” na nauunawaan bilang kaniyang mga inapo.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Isinatinig ang pangalang Hebreo sa paraang madaling basahin sa Filipino.
- source_word: בֶּן צוּעָר
  choice: anak ni Zuar
  rationale: Tuwirang pinananatili ang ugnayang ama-anak na ipinahahayag ng Hebreong construct phrase.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ang namumuno sa” upang maging natural ang eliptikal na pormulang Hebreo, habang pinananatili ang organisadong kaayusan ng pangkat at ang tradisyonal na panliping katawagang “mga anak ni Isacar.”
