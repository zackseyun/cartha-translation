  yaml_path: translation/ot/numbers/010/005.yaml
  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: tl
  text: Kapag hinipan ninyo ang trumpeta bilang hudyat[a], aalis ang mga kampong nakahimpil sa silangang panig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang hudyat ng alarma.” Ang salitang Hebreo ay tumutukoy rito sa natatanging pagpapatunog ng trumpeta na naghuhudyat sa pagkilos ng kampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Kapag hinipan ninyo ang trumpeta
  rationale: Ang pandiwang תקע ay tumutukoy sa pag-ihip o pagpapatunog ng trumpeta. Ginawang temporal na sugnay ang magkakaugnay na mga pandiwa upang likas na maipahayag sa Tagalog ang tagubilin at kasunod na pagkilos; ipinahayag din ang trumpeta mula sa agarang konteksto.
- source_word: תְּרוּעָה
  choice: bilang hudyat
  rationale: Sa konteksto ng Mga Bilang 10, tumutukoy ang תְּרוּעָה sa natatanging tunog ng trumpeta na naghuhudyat sa pagkilos ng kampo. Ang “hudyat” ay malinaw at natural, habang pinananatili sa talababa ang maaaring diwang babala o alarma.
- source_word: וְנָסְעוּ
  choice: aalis
  rationale: Ang נסע, kapag tumutukoy sa pagkilos ng kampo, ay nangangahulugang umalis o magsimulang maglakbay. Ang “aalis” ay payak at natural sa makabagong Tagalog.
- source_word: הַמַּחֲנוֹת
  choice: ang mga kampo
  rationale: Tuwirang pinananatili ng maramihang “mga kampo” ang pagtukoy sa mga pangkat ng mga liping nakapuwesto sa paligid ng tabernakulo.
- source_word: הַחֹנִים
  choice: nakahimpil
  rationale: Ang participle ay naglalarawan sa kasalukuyang pagkakapuwesto ng mga kampo. Ang “nakahimpil” ay dignified ngunit madaling maunawaan at mas angkop sa organisadong kampamento kaysa sa kolokyal na “nagkakampo.”
- source_word: קֵדְמָה
  choice: sa silangang panig
  rationale: Sa talatang ito, ang anyo ay tumutukoy sa lokasyon ng mga kampo sa silangan, hindi sa direksiyon ng kanilang paglalakbay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “trumpeta” mula sa agarang konteksto upang maiwasan ang malabong “hinipan bilang hudyat,” at “nakahimpil” upang ilarawan nang maikli ang nakapirming ayos ng mga kampo.
