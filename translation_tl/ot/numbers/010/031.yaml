base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: tl
  text: At sinabi niya, “Huwag mo sana kaming iwan, sapagkat alam mo kung saan kami dapat magkampo sa ilang, at ikaw ay magiging mga mata para sa amin[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “magiging mga mata ka para sa amin”—isang paglalarawan sa pagiging gabay dahil sa kaalaman niya tungkol sa ilang.
    reason: Pagpapaliwanag sa metaporang Hebreo nang hindi ito inaalis sa pangunahing teksto.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ang pagkakasunod-sunod ng pangyayari.
- source_word: אַל נָא
  choice: Huwag mo sana
  rationale: Ang אַל ay pagbabawal, at ang נָא ay nagpapahayag ng magalang at taimtim na pakiusap; likas itong naihahatid ng “huwag mo sana” sa modernong Filipino.
- source_word: תַּעֲזֹב אֹתָנוּ
  choice: kaming iwan
  rationale: Ang עזב ay maaaring mangahulugang iwan, pabayaan, o talikuran. Ang “iwan” ang pinakanababagay sa konteksto ng paglalakbay at hindi nagdaragdag ng teolohikal na kulay.
- source_word: כִּי עַל כֵּן
  choice: sapagkat
  rationale: Ipinakikilala ng parirala ang dahilan ng pakiusap. Ang “sapagkat” ay malinaw, marangal, at likas sa ganitong tuwirang pananalita.
- source_word: יָדַעְתָּ
  choice: alam mo
  rationale: Bagaman perpektibo ang anyong Hebreo, ang kaalamang tinutukoy ay patuloy na mahalaga sa kasalukuyang sitwasyon, kaya ang pangkasalukuyang “alam mo” ang natural na salin.
- source_word: חֲנֹתֵנוּ
  choice: kung saan tayo dapat magkampo
  rationale: Ang anyo ay tumutukoy sa pagkakampo o mga lugar ng pagkakampo ng Israel. Ginagawang malinaw ng salin ang malamang na diwa sa konteksto, habang hindi inilalahad na tiyak na nasa anyong maramihan ang pinagmulan.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay malawak na lupaing ilang, hindi kinakailangang mabuhanging disyerto. Ang “ilang” ang maikli at nakaugaliang katumbas sa Filipino.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  choice: at ikaw ang magiging mga mata namin
  rationale: Pinananatili ang matingkad na metaporang Hebreo, literal na “magiging mga mata ka para sa amin,” habang ginagawang mas likas ang ayos ng pangungusap sa Filipino.
theological_decisions:
- issue: Ang kaugnayan ng patnubay ng taong bihasa sa ilang at ng patnubay ng Diyos sa salaysay
  choice: Panatilihin ang tuwirang pakiusap at ang metaporang “mga mata” nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag sa teksto na magiging gabay siya sa ilalim ng patnubay ng Diyos, o ituring ang pakiusap bilang kawalan ng pagtitiwala.
  rationale: Hindi nilulutas ng talata ang posibleng tensiyon. Ang pagdaragdag ng hatol tungkol sa pananampalataya o sa paraan ng banal na patnubay ay lalampas sa sinasabi ng tekstong Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “huwag mo sana” upang mapanatili ang mapakiusap na tono, at pinanatili ang metaporang “mga mata” sa halip na palitan lamang ng “gabay.”
