  source_fidelity: 'Tapat ang salin sa pormulang Hebreo: ang ugnayang pamumuno na ipinahihiwatig ng וְעַל ay malinaw na naihayag sa “ang namumuno sa”; ang צְבָא ay isinaling “pangkat”; at napanatili ang “lipi,” “mga anak ni Neftali,” at patronimikong “anak ni Enan.”'
