base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: tl
  text: At ang namumuno sa pangkat[a] ng lipi ng mga anak ni Neftali ay si Ahira na anak ni Enan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo,” “kalipunan,” o “dibisyon.” Ang salitang Hebreo ay tumutukoy rito sa organisadong pangkat ng lipi sa kaayusan ng pagkakampo at paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: At ang namumuno sa
  rationale: Sa paulit-ulit na pormula ng talaan, inuugnay ng וְ ang sugnay sa nauna, at ipinakikita ng עַל na si Ahira ang nakatalaga sa pamumuno sa pangkat. Ang tahasang pandiwang “namumuno” ay likas sa modernong Tagalog at malinaw na naghahatid ng ugnayang ito.
- source_word: צְבָא
  choice: pangkat
  rationale: Sa konteksto ng kaayusan ng kampamento at paglalakbay, tumutukoy ito sa organisadong pangkat ng isang lipi, na may katangiang militar. Hindi ipinahihiwatig ng “pangkat” na isa itong buong hukbo, habang pinananatili ng talababa ang ibang posibleng salin.
- source_word: מַטֵּה
  choice: lipi
  rationale: Dito, ang מַטֵּה ay tumutukoy sa yunit ng tribo, hindi sa literal na tungkod. Ang “lipi” ang karaniwan at angkop na salin sa Tagalog.
- source_word: בְּנֵי נַפְתָּלִי
  choice: mga anak ni Neftali
  rationale: Pinananatili nito ang tahasang pamilyang pananalita ng Hebreo, bagaman sa pormulang panlipi ay saklaw nito ang mga inapo ni Neftali.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Isinatinig ang pangalang pantangi ayon sa nakaugaliang anyo sa Tagalog.
- source_word: בֶּן עֵינָן
  choice: anak ni Enan
  rationale: Likas at maikli itong Tagalog para sa karaniwang patronimikong konstruksiyon sa Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ang namumuno sa” upang likas na maipahayag ang eliptikong pormulang Hebreo, at pinanatili ang “mga anak ni Neftali” bilang pamilyang katawagan ng tekstong pinagmulan.
