translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong tagubilin. Pinanatili ang teknikal na pagkakaiba ng karaniwang pag-ihip at ng hudyat ng alarma. Walang footnote dahil ang ibinigay na English footnote ay tila hindi tugma sa marker nito at ang kahulugang kontekstuwal ay sapat na naipahayag sa pangunahing teksto.
