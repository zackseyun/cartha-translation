  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: tl
  text: Ngunit kapag titipunin ninyo ang kapulungan, hihipan ninyo ang mga trumpeta, at hindi kayo magpapatunog ng hudyat ng alarma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hihip kayo ng hudyat ng alarma.” Pinaghahambing ng Hebreo ang karaniwang pag-ihip at ang natatanging hudyat na ginagamit sa pag-alis sa kalapit na konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/הַקְהִיל
  choice: Ngunit kapag titipunin
  rationale: Ang waw, preposisyon, at Hiphil infinitive construct ng קהל ay nagpapahayag ng panahong kalagayan at layuning pagpupulong; ipinakikita ng “ngunit” ang kaibahan sa hudyat para sa paglakad sa naunang konteksto.
- source_word: הַקָּהָל
  choice: ang kapulungan
  rationale: Ang קָהָל ay tumutukoy sa nagkakatipong pamayanan ng Israel. Ang “kapulungan” ay likas at marangal sa modernong Filipino at naihihiwalay ang pangkat sa kilos ng pagtitipon.
- source_word: תִּתְקְעוּ
  choice: hihipan ninyo ang mga trumpeta
  rationale: Ang תקע ay tumutukoy rito sa pag-ihip sa mga trumpetang binanggit sa konteksto. Isinama ang “mga trumpeta” sa Filipino upang maging likas at malinaw ang pandiwang “hihipan,” bagaman ipinahihiwatig lamang ang layon sa Hebreo.
- source_word: וְ/לֹא
  choice: ngunit huwag kayong
  rationale: Ang koordinasyong may pagtanggi ay ginawang tuwirang negatibong utos sa Filipino; ang “ngunit” ay malinaw na naghahambing sa ordinaryong pag-ihip at sa natatanging hudyat.
- source_word: תָרִיעוּ
  choice: magpatunog ng hudyat ng alarma
  rationale: Sa konteksto ng trumpeta, ang Hiphil ng רוע ay isang natatanging hudyat na kaugnay ng paglakad, hindi basta malakas na tunog o sigaw.
