  source_fidelity: Wasto ang pagtukoy sa Kaban at kay Moises mula sa agarang konteksto, at naipapahayag ng pangkasalukuyang anyo ang nakagawiang pananalita ng imperfect. Gayunman, ang “di-mabilang” ay mas malakas kaysa sa רִבְבֹות אַלְפֵי, na nagpapatingkad ng napakaraming bilang ngunit hindi kinakailangang nagsasabing hindi ito mabibilang.
  naturalness: Natural at angkop sa pampublikong pagbasa ang “At tuwing humihimpil ang Kaban” at “Bumalik ka, Yahweh.” Mas natural at mas tapat ang “napakaraming libu-libo” kaysa “di-mabilang na libu-libo.”
  terminology: Napanatili nang wasto ang “Yahweh” para sa יְהוָה. Ang “Kaban” ay angkop na pagpapaikli para sa Kaban ng Tipan sa kontekstong ito. Ang “napakaraming libu-libo ng Israel” ay pinananatili ang retorikal na pagpaparami ng bilang nang hindi ginagawang ganap na di-mabilang.
