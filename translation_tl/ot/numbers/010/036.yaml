base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: tl
  text: At tuwing humihimpil ang Kaban, sinasabi ni Moises, “Bumalik ka, Yahweh, sa napakaraming libu-libo ng Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: At kapag humihimpil ang Kaban
  rationale: Ang בְּ na may infinitive construct ay bumubuo ng temporal na sugnay. Ang hulaping pambabae sa נֻחֹה ay tumutukoy sa Kaban sa naunang konteksto; tahasan itong pinangalanan sa Tagalog upang maging malinaw at natural.
- source_word: יֹאמַר
  choice: sinasabi ni Moises
  rationale: Ang imperfect sa kontekstong ito ay nagsasaad ng nakaugaliang pananalita tuwing humihimpil ang Kaban. Nilinaw ang paksa mula sa naunang talata.
- source_word: שׁוּבָה
  choice: Bumalik ka
  rationale: Tuwirang pakiusap ito mula sa imperative ng שוב na may paragogic ה. Pinananatili ng “Bumalik ka” ang diwa nang hindi ipinapaliwanag kung sa anong tiyak na paraan babalik si Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
- source_word: רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: sa di-mabilang na libu-libo ng Israel
  rationale: Pinananatili ang pinatinding diwa ng magkapatong na malalaking bilang sa Hebreo, ngunit gumagamit ng likas at marangal na pananalitang Tagalog sa halip na literal ngunit alanganing “laksa-laksa ng mga libu-libo.”
theological_decisions:
- issue: Paglalarawan sa pagbabalik ni Yahweh
  choice: Bumalik ka, Yahweh, sa di-mabilang na libu-libo ng Israel
  alternative: Manumbalik ka, Yahweh, sa laksa-laksang libo ng Israel
  rationale: Pinananatili ang tuwirang utos/pakiusap at ang kaugnayan nito sa sambayanang Israel, nang hindi ipinapalagay kung ang “pagbalik” ay nangangahulugang presensiya, pamamalagi, o ibang tiyak na pagkilos.
- issue: Pagbigkas sa banal na pangalan יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; kaya pinanatili itong “Yahweh” at hindi pinalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “humihimpil” para sa paghinto ng Kaban sa paglalakbay at ang “di-mabilang na libu-libo” upang maipahayag ang matinding bilang ng Hebreo nang natural.
