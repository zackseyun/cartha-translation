  source_fidelity: 'Tumpak na naihahatid ng salin ang pormulang Hebreo: ang pinunong nangangasiwa sa organisadong pangkat ng lipi ng mga anak ni Zebulun ay si Eliab, anak ni Helon. Ang “namumuno naman sa” ay wastong nagpapahayag ng וְעַל sa paulit-ulit na talaan ng mga pinuno.'
