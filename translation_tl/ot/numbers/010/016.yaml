  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: tl
  text: Ang namumuno naman sa pangkat ng lipi ng mga anak ni Zebulun ay si Eliab na anak ni Helon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo” o “dibisyon” sa halip na “pangkat.” Ang salitang Hebreo ay tumutukoy sa organisadong pangkat ng tribo na nakaayos sa pagmamartsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Ang namumuno naman sa
  rationale: Ipinahihiwatig ng עַל sa paulit-ulit na pormulang ito ang pamumuno o pangangasiwa, samantalang ipinagpapatuloy ng וְ ang tala; likas na naipapahayag sa Filipino ang dalawang tungkuling ito sa “Ang namumuno naman sa.”
- source_word: צְבָא
  choice: pangkat
  rationale: Sa konteksto ng paglalakbay sa ilang, tumutukoy ito sa organisadong pangkat ng tribo na nakaayos sa pagmamartsa. Malinaw at natural ang “pangkat” at hindi nito labis na ipinahihiwatig ang isang permanenteng hukbo.
- source_word: מַטֵּה
  choice: lipi
  rationale: Dito, ang salita ay tumutukoy sa yunit panlipunan at pampolitika ng Israel, hindi sa literal na tungkod; “lipi” ang karaniwan at angkop na salin.
- source_word: בְּנֵי זְבוּלֻן
  choice: mga anak ni Zebulun
  rationale: Pinananatili nito ang tahasang pananalitang pampamilya ng Hebreo. Sa pormulang pantribo, saklaw nito ang mga inapo at kasapi ng liping nagmula kay Zebulun.
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Isinalin sa baybay na karaniwang ginagamit para sa pangalang Hebreo.
- source_word: בֶּן חֵלֹן
  choice: anak ni Helon
  rationale: Direkta at natural na salin ng karaniwang patronimikong konstruksiyon sa Hebreo.
