  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: tl
  text: Kapag umihip kayo ng hudyat sa ikalawang pagkakataon[a], aalis ang mga kampong nakahimpil sa gawing timog; hihip sila ng hudyat para sa kanilang pag-alis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malakas na tunog” o “senyas.” Ang salitang Hebreo ay tumutukoy rito sa natatanging tunog ng trumpeta na ginagamit upang pangasiwaan ang pagkilos ng mga kampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Kapag umihip kayo
  rationale: Ang pandiwang תקע ay tumutukoy sa pag-ihip ng trumpeta sa kontekstong ito. Pinananatili ng “kayo” ang pangalawang panauhang maramihan, at natural sa Filipino ang “kapag” para sa sunod-sunod na tagubilin.
- source_word: תְּרוּעָה
  choice: hudyat
  rationale: Sa konteksto ng Mga Bilang 10, ito ay natatanging tunog ng trumpeta na nagbibigay ng senyas sa mga kampo, hindi karaniwang sigaw o ingay.
- source_word: שֵׁנִית
  choice: sa ikalawang pagkakataon
  rationale: Malinaw at natural nitong ipinahahayag na ito ang pangalawang pag-ihip ng hudyat.
- source_word: וְנָסְעוּ
  choice: aalis
  rationale: Ang נסע sa konteksto ng kampo ay ang pagkalas at pagsisimula ng paglalakbay. Ang “aalis” ay payak at natural sa makabagong Filipino.
- source_word: הַמַּחֲנוֹת הַחֹנִים
  choice: ang mga kampong nakahimpil
  rationale: Pinananatili nito ang maramihang “mga kampo” at ang paglalarawan sa mga ito bilang kasalukuyang nakapuwesto o nakahimpil.
- source_word: תֵּימָנָה
  choice: sa gawing timog
  rationale: Sa konteksto, tinutukoy nito ang kinalalagyan ng mga kampo sa timog, hindi ang direksiyon ng kanilang paglalakbay.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: Hihip sila ng hudyat
  rationale: Pinananatili ang tahasang aktibong pandiwa at ang pangatlong panauhang maramihan ng Hebreo, pati ang pag-uulit sa “hudyat.”
- source_word: לְמַסְעֵיהֶם
  choice: tuwing aalis sila
  rationale: Ang maramihang anyo ay tumutukoy sa mga pagkakataon o yugto ng kanilang pag-alis. Ang “tuwing” ay natural na nagpapahayag ng paulit-ulit na gamit ng hudyat.
