translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakahimpil” para sa organisadong pagkakampo at “hudyat” para sa natatanging tunog ng trumpeta. Inilagay ang marker na [a] kaagad pagkatapos ng pariralang tinutukoy nito.
