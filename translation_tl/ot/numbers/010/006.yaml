  source_fidelity: 'Tumpak ang pangunahing daloy: ang kausap na maramihan ang magpaparinig ng ikalawang hudyat, saka aalis ang mga kampong nasa timog. Tumpak din na aktibo at maramihan ang huling pandiwa; hindi ito dapat gawing balintiyak. Gayunman, ang “tuwing aalis sila” ay nagdaragdag ng aspektong “sa bawat pagkakataon” na hindi tahasang ipinahahayag ng לְמַסְעֵיהֶם, na mas tuwirang tumutukoy sa kanilang mga pag-alis/pagsisimula ng paglalakbay.'
  naturalness: Malinaw at angkop sa makabagong Filipino ang “mga kampong nakahimpil sa gawing timog.” Mas natural at mas malapit sa gamit ng Hebreo ang “para sa kanilang pag-alis” kaysa “tuwing aalis sila.”
  terminology: Ang “hudyat” ay katanggap-tanggap para sa תְּרוּעָה sa kontekstong signal ng trumpeta. Nililinaw ng talababa na ito ay natatanging tunog ng trumpeta. Ang “malakas na tunog” ay mas malawak na alternatibo ngunit maaari pa ring manatili bilang lexical na posibilidad kung may paliwanag na pangkonteksto.
  issues:
