base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: tl
  text: Ang namumuno sa pangkat[a] ng lipi ng mga anak ni Simeon ay si Selumiel na anak ni Zurisadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dibisyon” o “hukbo.” Ang salitang Hebreo ay tumutukoy dito sa organisadong pangkat ng lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Ang namumuno sa
  rationale: Sa konteksto ng ayos ng paglalakbay, ipinakikilala ng עַל ang taong itinalagang mamuno sa pangkat. Natural sa modernong Tagalog ang ganitong sugnay, kahit hindi hiwalay na isinalin ang pang-ugnay na וְ.
- source_word: צְבָא
  choice: pangkat
  rationale: Tumutukoy ito rito sa organisadong pangkat ng isang lipi, hindi kinakailangang sa hukbong nakikipagdigma. Pinananatili ng “pangkat” ang pangkalahatang diwa; inilalagay sa talababa ang mga alternatibong mas militar o teknikal.
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa konteksto ng sensus at pagkakaayos ng kampo, ang מַטֵּה ay isang yunit panlipi; “lipi” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: בְּנֵי שִׁמְעוֹן
  choice: mga anak ni Simeon
  rationale: Pinananatili ang literal at nakaugaliang katawagang panlipi na “mga anak ni Simeon,” sa halip na ipakahulugang “mga inapo” o “mga tauhan.”
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Isinulat ang pangalang Hebreo ayon sa natural na anyong transliterado sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Direktang patronimiko ang gamit; “anak ni” ang malinaw at natural na katumbas.
- source_word: צוּרִי שַׁדָּי
  choice: Zurisadai
  rationale: Tinatrato bilang iisang personal na pangalan at isinusulat sa anyong madaling basahin sa Filipino.
