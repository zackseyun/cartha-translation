  yaml_path: translation/ot/numbers/010/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh[a] kay Moises:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring isaling “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive na may דִּבֵּר ay nagpapakilala ng kasunod na pangyayari sa salaysay. Ang “nagsalita” ang likas at tumpak na salin sa pormula ng banal na pagsasalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na anyo sa Tagalog bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakagawiang anyong Filipino ng pangalang biblikal na Moises.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ang infinitive construct na לֵאמֹר ay pormulang nagpapakilala sa nilalaman ng tuwirang sinabi. Pinananatili ng “na sinasabi” ang pormula at ang bahagyang pag-uulit ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay malapit na transliterasyon ng banal na pangalan at hindi ito pinapalitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang tradisyonal na pormula ng pagpapakilala sa banal na pananalita, bagaman mas karaniwan sa pang-araw-araw na Tagalog ang “at sinabi.”
