  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: tl
  text: Tuwing umaalis ang kaban[a], sinasabi ni Moises, “Bumangon ka, Yahweh[b], at mangalat ang iyong mga kaaway; tumakas sa harap mo ang mga napopoot sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “At nangyari, kapag umaalis ang kaban.” Maaaring isalin nang mas pormal ang Hebreong idyoma, ngunit malamang na tumutukoy ito rito sa paulit-ulit na pangyayari: “Tuwing umaalis ang kaban.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “Bumangon ka” ay panawagan kay Yahweh na kumilos nang makapangyarihan; hindi nito ipinahihiwatig na literal na hindi siya kumikilos.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: Tuwing lumalakad
  rationale: Sa kontekstong naglalarawan ng paulit-ulit na gawain, ipinahihiwatig ng parirala ang pangyayaring nagaganap sa bawat paglakad ng kaban. Ang “Tuwing” ay likas na Filipino at pinananatili ang temporal at paulit-ulit na diwa.
- source_word: הָאָרֹן
  choice: ang kaban
  rationale: “Kaban” ang tuwirang salin; hindi idinagdag ang “ng tipan” dahil wala iyon sa mismong talata.
- source_word: קוּמָה
  choice: Bumangon ka
  rationale: Pinananatili ang masiglang larawan ng pautos na pakiusap kay Yahweh na kumilos nang makapangyarihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinalitan ng isang titulo.
- source_word: וְיָפֻצוּ
  choice: at mangalat
  rationale: Ang imperfect kasunod ng pautos ay may jussive o pakiusap na diwa. Ang “mangalat” ay malinaw at likas na nagpapahayag ng hinihiling na resulta.
- source_word: אֹיְבֶיךָ
  choice: ang iyong mga kaaway
  rationale: Tuwirang inililipat ang pangmaramihang pangngalan at ang ikalawang panauhang hulapi na tumutukoy kay Yahweh.
- source_word: וְיָנֻסוּ
  choice: tumakas
  rationale: Tulad ng naunang pandiwa, mayroon itong jussive o pakiusap na diwa at pinananatili ang paralel na panalangin.
- source_word: מְשַׂנְאֶיךָ
  choice: ang mga napopoot sa iyo
  rationale: Ang participle ay naglalarawan sa mga taong palagiang salungat kay Yahweh; ang “mga napopoot sa iyo” ay natural at eksakto.
- source_word: מִפָּנֶיךָ
  choice: mula sa iyong harapan
  rationale: Pinananatili nito ang literal na larawang tumatakas ang mga kalaban sa harap o presensiya ni Yahweh.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa Hebreong teksto. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng pautos na קוּמָה kapag iniuukol sa Diyos
  choice: Bumangon ka
  alternative: Kumilos ka
  rationale: Pinananatili ang metaporang nasa Hebreo nang hindi ipinahihiwatig na literal na natutulog o walang ginagawa ang Diyos; panawagan ito na hayagang kumilos siya laban sa mga kaaway.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lumalakad ang kaban” sa diwang nagsisimula itong maglakbay, at pinanatili ang patulang paralelismo ng dalawang pakiusap ni Moises.
