  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: tl
  text: Kaya sa unang pagkakataon ay naglakbay sila ayon sa utos ni Yahweh sa pamamagitan ni Moises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “sa kamay ni Moises,” isang idyomang nangangahulugang sa pamamagitan ni Moises bilang kinatawan o tagapamagitan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: naglakbay sila
  rationale: Sa salaysay ng paglalakbay, ang נסע ay tumutukoy sa pag-alis ng kampo upang magpatuloy. Likas sa modernong Tagalog ang “naglakbay” sa kontekstong ito.
- source_word: בָּרִאשֹׁנָה
  choice: sa unang pagkakataon
  rationale: Ang anyong pang-abay ay maaaring mangahulugang “sa simula” o “sa unang pagkakataon”; dito ay tinutukoy nito ang unang organisadong pag-alis mula sa Sinai.
- source_word: עַל פִּי
  choice: ayon sa utos ni
  rationale: Literal itong “ayon sa bibig ng,” ngunit isang idyoma para sa pagkilos alinsunod sa utos o tagubilin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang literal na “sa kamay ni Moises” ay idyomang nagpapahayag ng pagkilos sa pamamagitan ng isang kinatawan o tagapamagitan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Direktang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan sa anyong karaniwang ginagamit sa makabagong transliterasyon.
- issue: Papel ni Moises sa pagpapahayag ng utos
  choice: sa pamamagitan ni Moises
  alternative: sa kamay ni Moises
  rationale: Ipinahihiwatig ng Hebreong idyoma ang ahensiya o pamamagitan, nang hindi sinasabing kay Moises nagmula ang utos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ayon sa utos” para sa natural na idyoma at pinanatili sa talababa ang literal na larawang “sa kamay ni Moises.”
