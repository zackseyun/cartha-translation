  - severity: low
    issue: Ang “Pagkatapos” ay bahagyang mas interpretatibo kaysa kailangan.
    rationale: Ang waw ay simpleng pagpapatuloy ng salaysay. Ang “At” ay mas tuwirang pinananatili ang ugnayang naratibo at natural pa rin sa pagsasalin ng talata.
