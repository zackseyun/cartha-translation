  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: tl
  text: At humayo ang mga Kohatita, na nagdadala ng mga banal na kagamitan[a], at naitayo ang tabernakulo bago sila dumating.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “mga tagapagdala ng santuwaryo” o “na nagdadala ng santuwaryo.” Sa kontekstong ito, tumutukoy ang parirala sa mga banal na kagamitang dinadala ng mga Kohatita, na naiiba sa mismong tabernakulong binanggit pagkatapos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: Pagkatapos, humayo
  rationale: Ipinahahayag ng waw at ng pandiwang נסע ang kasunod na yugto ng paglalakbay. Natural sa salaysay ang “Pagkatapos, humayo.”
- source_word: הַקְּהָתִים
  choice: ang mga Kohatita
  rationale: Ito ang pangmaramihang katawagan sa angkang nagmula kay Kohat.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: na pasan ang mga banal na kagamitan
  rationale: Literal itong tumutukoy sa mga tagapagdala ng santuwaryo, ngunit sa konteksto ay ang mga sagradong kagamitang nasa pangangalaga ng mga Kohatita ang dinadala, hindi ang balangkas ng tabernakulo.
- source_word: הַמִּקְדָּשׁ
  choice: mga banal na kagamitan
  rationale: Ginagamit dito ang “santuwaryo” bilang metonimiya para sa mga banal na bagay nito; nililinaw ito ng kasunod na pagbanggit sa tabernakulo na hiwalay na itinayo.
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: Itinayo naman ang tabernakulo
  rationale: Pangmaramihan ang pandiwa ngunit walang tahasang simuno. Pinananatili ng pasibong anyo ang hindi binanggit na tagapagtayo at iniiwasang ipahiwatig na ang mga Kohatita mismo ang nagtayo nito.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang “tabernakulo” ang kinikilalang katawagan sa toldang tahanan ng Diyos sa salaysay ng ilang.
- source_word: עַד בֹּאָם
  choice: bago sila dumating
  rationale: Ipinakikita ng parirala na naitayo na ang tabernakulo pagsapit ng mga Kohatita; natural itong ipinahahayag sa Filipino bilang “bago sila dumating.”
