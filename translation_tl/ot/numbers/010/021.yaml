  source_fidelity: 'Tumpak ang pangunahing diwa: humayo ang mga Kohatita na dala ang mga banal na kagamitan, at naitayo ang tabernakulo bago sila dumating. Gayunman, ang “na pasan” ay hindi ganap na likas sa ganitong sugnay at maaaring magmukhang paglalarawan ng pisikal na karga sa katawan, sa halip na tungkuling pagdadala ng mga kagamitang banal.'
  naturalness: Mas natural sa modernong Filipino ang “na nagdadala ng” kaysa “na pasan ang.” Ang “Pagkatapos” ay katanggap-tanggap, ngunit ang “At” ay mas malapit sa magkakasunod na naratibong waw nang hindi nagpapahiwatig ng mas malinaw na paghinto kaysa nasa Hebreo.
  terminology: Ang “mga Kohatita,” “mga banal na kagamitan,” at “tabernakulo” ay angkop at magkakatugma. Napananatili ng talababa ang literal na “santuwaryo” at ang kontekstuwal na metonimiya.
