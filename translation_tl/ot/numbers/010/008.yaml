    rationale: Ang payak na “ay hihip” ay mas tuwiran at natural, at sapat na nitong inilalahad ang tungkuling nakatalaga sa mga pari.
  - severity: medium
    issue: Masyadong makitid ang “ang mga ito” bilang sanggunian ng “magiging ... palatuntunan.”
    rationale: Bagaman pangmaramihan ang Hebreong pandiwa, ang kasunod na legal na pormula ay maaaring tumukoy sa kabuuang tagubilin o kaayusan. Ang kolektibong “ito” ay likas sa Tagalog at hindi sapilitang itinatali ang tuntunin sa mga trumpeta lamang.
  - severity: low
    issue: Hindi idiomatiko ang “isang palatuntunang permanente.”
    rationale: 'Mas karaniwan sa modernong Filipino ang pang-uring inuunahan ang pangngalan: “permanenteng tuntunin.”'
