  rationale: Inayos ang sintaks upang maging likas sa modernong Filipino, at ginawang kolektibo ang panghalip para maipahayag ang legal na pormula nang hindi ipinipilit ang isang makitid na sanggunian para sa pangmaramihang Hebreong pandiwa. Pinalitan ang hindi likas na “palatuntunang permanente” ng “permanenteng tuntunin.” Inilipat ang talababa sa dulo ng pariralang saklaw nito at inihanay ang mga alternatibo sa binagong termino.
