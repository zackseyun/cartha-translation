  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: tl
  text: At ang mga anak ni Aaron, ang mga pari, ay hihip sa mga trumpeta; at ito ay magiging permanenteng tuntunin para sa inyo sa lahat ng inyong salinlahi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tuntuning magpakailanman” o “walang-hanggang tuntunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: At ang mga anak ni Aaron
  rationale: Pinananatili ang literal na ugnayang pampamilya ng בְּנֵי bilang “mga anak,” sa natural na ayos ng modernong Tagalog.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Appositional na pagkakakilanlan ito ng mga anak ni Aaron; tuwiran at karaniwang salin ng כֹּהֲנִים ang “mga pari.”
- source_word: יִתְקְעוּ בַּחֲצֹצְרוֹת
  choice: ang siyang hihip sa mga trumpeta
  rationale: Sa kontekstong musikal at panseremonya, ang תקע na may חֲצֹצְרוֹת ay tumutukoy sa pag-ihip o pagpapatunog ng mga trumpeta. Ang “hihip” ay konkreto at natural sa Tagalog, at ang “ang siyang” ay nagpapakita na sa mga pari nakatalaga ang tungkulin.
- source_word: וְהָיוּ לָכֶם
  choice: at ang mga ito ay magiging … para sa inyo
  rationale: Pinananatili ang maramihang anyo ng pandiwang הָיוּ sa “ang mga ito.” Maaari itong tumukoy sa mga trumpeta o, sa mas malawak na diwa, sa kaayusang kaugnay ng mga ito; hindi sapilitang nilulutas ng salin ang sanggunian.
- source_word: לְחֻקַּת עוֹלָם
  choice: isang palatuntunang permanente
  rationale: Ang “palatuntunan” ay angkop sa legal at tipanang gamit ng חֻקָּה, samantalang ang “permanente” ay naghahatid ng nagpapatuloy na bisa ng עוֹלָם nang hindi agad nagpapasya na ito ay walang hanggan sa bawat posibleng kahulugan.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng salinlahi ninyo
  rationale: Natural na Tagalog na naghahatid ng pagpapatuloy ng kautusan sa magkakasunod na salinlahi.
theological_decisions:
- issue: Saklaw at tagal ng חֻקַּת עוֹלָם
  choice: isang palatuntunang permanente
  alternative: isang palatuntunan magpakailanman / isang walang-hanggang palatuntunan
  rationale: Maaaring ipahiwatig ng עוֹלָם ang napakahabang panahon o perpetuwal na bisa ayon sa konteksto. Pinananatili ng “permanente” ang matibay at nagpapatuloy na katangian ng kautusan sa buhay-tipan ng Israel nang hindi inaalis ang leksikal na pag-igting; inilalahad sa talababa ang mas literal na mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pari,” “trumpeta,” “palatuntunan,” at “salinlahi” bilang mga salitang madaling maunawaan ngunit angkop sa legal at panseremonyang konteksto. Inilagay ang talababa pagkatapos ng pariralang aktuwal nitong nililinaw.
