  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי אֶפְרַ֖יִם לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: tl
  text: Pagkatapos, humayo ang watawat[a] ng kampo ng mga anak ni Efraim ayon sa kani-kanilang pangkat[b]. Ang namumuno sa pangkat nito ay si Elisama na anak ni Amihud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bandila.” Ang salitang Hebreo ay tumutukoy sa sagisag ng tribo na sinusundan ng kampo sa paghayo.
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa kanilang mga hukbo.” Ipinahihiwatig ng Hebreo ang organisadong mga pangkat ng kampo na nakaayos na parang hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Pagkatapos, humayo
  rationale: Ipinagpapatuloy ng waw + qatal ang sunod-sunod na pagkilos sa salaysay. Likas sa konteksto ng pagmamartsa ang “humayo,” at malinaw na ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod.
- source_word: דֶּגֶל
  choice: watawat
  rationale: Tumutukoy ito sa sagisag ng pangkat o tribo na sinusundan nila sa pagkakampo at paghayo. Karaniwan at marangal sa modernong Filipino ang “watawat.”
- source_word: מַחֲנֵה
  choice: kampo
  rationale: Sa pariralang construct kasama ng דֶּגֶל, tinutukoy nito ang yunit ng kampo na nakaugnay sa watawat. Tuwiran at malinaw ang “kampo” sa konteksto ng paglalakbay sa ilang.
- source_word: בְנֵי אֶפְרַיִם
  choice: mga anak ni Efraim
  rationale: Pinananatili nito ang karaniwang anyong Hebreo para sa katawagan sa tribo at ang malinaw na kaugnayan kay Efraim.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kani-kanilang pangkat
  rationale: Ang צָבָא rito ay tumutukoy sa organisadong mga pangkat sa ayos ng paglalakbay, na may bahid ng organisasyong militar ngunit hindi kinakailangang aktuwal na nakikipagdigma.
- source_word: וְעַל צְבָאוֹ
  choice: Ang namumuno sa pangkat nito ay
  rationale: Natural na Filipino ito para sa Hebreong pahayag na literal na nagsasabing ang isang tao ay “nasa ibabaw” o may pamamahala sa pangkat. Pinananatili rin ng “nito” ang isahang hulaping tumutukoy sa yunit ng Efraim.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elisama na anak ni Amihud
  rationale: Isinalin ang ugnayang בֶּן bilang “anak ni,” at ginamit ang mga baybay na likas sa Filipino para sa mga pangalang biblikal.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang “mga anak ni Efraim” bilang tapat na katawagan sa tribo, habang ginawang natural ang parirala tungkol sa pinuno. Nasa pangunahing teksto ang lahat ng panandang talababa.
