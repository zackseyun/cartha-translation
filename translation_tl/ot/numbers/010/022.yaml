  source_fidelity: 'Tapat ang salin sa pagkakasunod ng Hebreo: ang watawat/kampo ng mga anak ni Efraim ay humayo ayon sa kanilang mga pangkat, at si Elisama na anak ni Amihud ang namuno sa pangkat nito. Napananatili ang maramihang hulapi sa “kani-kanilang pangkat” at ang isahang pagtukoy sa yunit sa “pangkat nito.”'
