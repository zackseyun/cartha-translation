- source_word: כִּי אִם
  choice: Sa halip
  rationale: Ipinahahayag ng parirala ang mariing pagtanggi na sinusundan ng kapalit na pasiya.
- source_word: מוֹלַדְתִּי
  choice: sarili kong angkan
  rationale: Dito ay tumutukoy sa mga kamag-anak o bayang pinagmulan, hindi lamang sa pisikal na lugar ng kapanganakan.
