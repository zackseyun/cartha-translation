  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: tl
  text: At ang namumuno sa pangkat[a] ng lipi ng mga anak ni Gad ay si Eliasaf na anak ni Deuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo” o “dibisyon.” Madalas na may diwang militar ang Hebreong צְבָא, ngunit dito ay tumutukoy ito sa organisadong pangkat ng lipi sa pagmamartsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: At ang namumuno sa
  rationale: Sa pormulang ito ng talaan, ipinakikilala ng וְעַל ang taong nakatalaga sa pamumuno ng pangkat. Ang likas na Tagalog na “At ang namumuno sa” ay nagpapanatili sa ugnayan sa naunang mga talata at sa diwang nangangasiwa.
- source_word: צְבָא
  choice: pangkat
  rationale: Tumutukoy rito ang צְבָא sa organisadong pangkat ng isang lipi sa pagmamartsa. Malinaw ang “pangkat” sa karaniwang mambabasa nang hindi labis na nililimitahan ang salita sa kahulugang hukbo.
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa kontekstong ito, ang מַטֶּה ay isang tribong yunit ng Israel, kaya ang karaniwang salin na “lipi” ang angkop.
- source_word: בְנֵי גָד
  choice: mga anak ni Gad
  rationale: Pinananatili nito ang literal at karaniwang Hebreong katawagan sa mga kabilang sa lipi ni Gad.
- source_word: אֶלְיָסָף
  choice: Eliasaf
  rationale: Isinatinig ang pangalang Hebreo sa anyong malinaw at angkop sa Tagalog.
- source_word: בֶּן דְּעוּאֵל
  choice: anak ni Deuel
  rationale: Tuwirang pinananatili ang Hebreong pormula ng pagbanggit sa ama.
