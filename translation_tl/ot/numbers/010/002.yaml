base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: tl
  text: “Gumawa ka para sa iyong sarili ng dalawang trumpeta mula sa pinukpok na pilak[a]. Gawin mo ang mga ito. Magiging gamit mo ang mga ito sa pagpapatawag sa kapulungan[b] at sa pagpapasimula ng paglalakbay ng mga kampo[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gawang pinukpok.” Isinasalin din ng ilan na “mula sa iisang piraso ng pilak.”
    reason: Pinananatili ang posibleng pagkakaiba kung paraan ng paggawa o resulta ng pagkakapukpok ang pangunahing diin ng מִקְשָׁה.
  - marker: b
    text: O “sa pagtawag sa kapulungan.”
    reason: Maaaring idiin ng מִקְרָא ang panawagan o ang opisyal na pagpapatawag sa kapulungan.
  - marker: c
    text: O “sa pag-alis ng mga kampo.”
    reason: Saklaw ng מַסַּע ang pag-alis, pagsisimula ng paglalakbay, o paglalakbay mula sa kampamento.
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Gumawa ka para sa iyong sarili
  rationale: Pinananatili ang personal na diwa ng לְךָ at ang tuwirang utos kay Moises, nang hindi ipinahihiwatig na siya lamang mismo ang kailangang gumawa.
- source_word: שְׁתֵּי חֲצֽוֹצְרֹת כֶּסֶף
  choice: dalawang trumpetang pilak
  rationale: Ang חֲצֹצְרָה ay tuwid na metal na trumpeta, hindi kurbadong sungay. Ang “trumpetang pilak” ay maikli, natural, at malinaw sa modernong Filipino.
- source_word: מִקְשָׁה תַּעֲשֶׂה אֹתָם
  choice: Gawin mo ang mga ito sa pamamagitan ng pagpukpok sa pilak
  rationale: Ipinapahayag ng מִקְשָׁה ang paraang paghubog sa metal sa pamamagitan ng pagpukpok. Iniiwasan ng salin ang sobrang tiyak na “mula sa iisang piraso,” na maaaring resulta ng proseso ngunit hindi tahasang sinasabi rito.
- source_word: וְהָיוּ לְךָ
  choice: Gagamitin mo ang mga ito
  rationale: Natural na Filipino para sa gamit o layuning ipinahihiwatig ng pariralang Hebreo; hindi lamang pagmamay-ari ang tinutukoy.
- source_word: לְמִקְרָא הָעֵדָה
  choice: sa pagtawag sa kapulungan
  rationale: Pinananatili ang diwa ng isang opisyal na pagtawag o pagpapatawag sa buong pamayanan. Hindi nito labis na nililinaw kung ang diin ay nasa panawagan o sa aktuwal na pagtitipon.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: at sa paghudyat ng pag-alis ng mga kampo
  rationale: Sa kontekstong ito, ginagamit ang mga trumpeta upang simulan o ihudyat ang paglalakbay ng mga kampo. Ang “paghudyat ng pag-alis” ay natural sa Filipino at hindi nakalilitong gaya ng literal na “paalisin ang mga kampo,” na maaaring mangahulugang itaboy ang mga ito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kapulungan” para sa עֵדָה at “mga kampo” para sa מַחֲנוֹת. Pinanatili ang pag-uulit ng utos ngunit ginawang natural ang pahayag tungkol sa layunin ng mga trumpeta.
