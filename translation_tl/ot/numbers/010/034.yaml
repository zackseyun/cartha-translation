  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: tl
  text: At ang ulap ni Yahweh ay nasa ibabaw nila sa maghapon kapag umaalis sila mula sa kampo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ay nakapatong sa kanila sa maghapon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲנַן
  choice: At ang ulap
  rationale: Ang עָנָן ay “ulap.” Pinanatili ang pang-ugnay na וַ bilang “At” upang maipakita ang kaugnayan nito sa naunang salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: עֲלֵיהֶם
  choice: ay nasa ibabaw nila
  rationale: Ang עַל na may hulaping panghalip ay tumutukoy sa kinalalagyang nasa ibabaw o nakapatong sa kanila. Ang “nasa ibabaw nila” ay malinaw at natural sa konteksto ng ulap.
- source_word: יוֹמָם
  choice: sa araw
  rationale: Ang יוֹמָם ay pang-abay na nangangahulugang “sa araw” o “sa panahon ng araw.”
- source_word: בְּנָסְעָם
  choice: tuwing umaalis sila
  rationale: Ang infinitive construct ng נסע na may בְּ ay may temporal na diwa, “sa kanilang pag-alis/paghayo.” Ipinapahayag ng “tuwing umaalis sila” ang paulit-ulit na pag-alis ng kampo nang natural sa Filipino.
- source_word: מִן הַמַּחֲנֶה
  choice: sa kampo
  rationale: Kasama ng pandiwang “umaalis,” natural na ipinahihiwatig ng “sa kampo” ang paggalaw mula roon; tumutukoy ang מַחֲנֶה sa kampo ng Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng עֲלֵיהֶם kaugnay ng ulap
  choice: nasa ibabaw nila
  alternative: nasa kanila
  rationale: Pinananatili ng pangunahing salin ang malinaw na lokatibong kahulugan, ngunit itinatala sa talababa ang mas malawak na posibleng pagbasa ng pang-ukol nang hindi nagpapasok ng tiyak na teolohikong interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tuwing umaalis sila” para sa natural na pagpapahayag ng temporal na parirala habang pinananatili ang diwa ng pagbuwag at pag-alis mula sa kampo.
