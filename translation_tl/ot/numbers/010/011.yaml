  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: tl
  text: Noong ikadalawampung araw ng ikalawang buwan ng ikalawang taon, umangat[a] ang ulap mula sa ibabaw ng tabernakulo ng patotoo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumaas” o “pumailanlang.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tabernakulo ng patotoo”; maaari ring isaling “tolda ng patotoo.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari na
  rationale: Pinananatili ang Hebreong panandang pasalaysay na nag-uugnay sa pangyayaring ito sa naunang salaysay, nang hindi gumagamit ng makalumang pananalita.
- source_word: בַּשָּׁנָה הַשֵּׁנִית בַּחֹדֶשׁ הַשֵּׁנִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: noong ikadalawampung araw ng ikalawang buwan ng ikalawang taon
  rationale: Inayos sa likas na pagkakasunod ng petsa sa modernong Filipino habang pinananatili ang lahat ng impormasyong temporal sa Hebreo; idinagdag ang “araw” na ipinahihiwatig ng Hebreong idyoma.
- source_word: נַעֲלָה
  choice: pumaitaas
  rationale: Ang anyo ng עלה ay nagsasaad na ang ulap mismo ay umakyat o tumaas. Ang “pumaitaas” ay malinaw na kilos na palayo sa ibabaw ng tabernakulo at hindi nagpapahiwatig ng tahasang tagapag-angat.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tuwirang salin ng tiyak na pangngalan na tumutukoy sa kilalang ulap na gumagabay sa Israel.
- source_word: מֵעַל
  choice: mula sa ibabaw
  rationale: Ipinahahayag kapwa ang pinagmulan ng kilos at ang dating puwesto ng ulap sa itaas ng tabernakulo.
- source_word: מִשְׁכַּן
  choice: tabernakulo
  rationale: Ito ang kinikilalang terminong Filipino para sa naililipat na santuwaryo sa ilang at mas tiyak sa kontekstong ito kaysa sa pangkalahatang “tahanan.”
- source_word: הָעֵדֻת
  choice: ng patotoo
  rationale: Pinananatili ang pangunahing kahulugang “patotoo” at ang kaugnayan nito sa patotoong iniingatan sa santuwaryo, sa halip na ipakahulugan agad bilang “tipan.”
theological_decisions:
- issue: Ang katawagang מִשְׁכַּן הָעֵדֻת para sa santuwaryo
  choice: tabernakulo ng patotoo
  alternative: tabernakulo ng tipan; tahanan ng patotoo
  rationale: Ang “patotoo” ang tuwirang katumbas ng עֵדוּת at pinananatili nito ang ugnayang pampanitikan sa ibang gamit sa Pentateuco. Ang “tipan” ay maaaring tumukoy sa kaugnay na bagay ngunit mas interpretatibo, samantalang ang “tahanan” ay posibleng leksikal ngunit hindi gaanong tiyak bilang katawagan sa santuwaryo.
translation_notes:
  register: Modernong, malinaw, at marangal na Filipino. Pinanatili ang tradisyonal ngunit nauunawaang “tabernakulo,” habang ang ayos ng petsa ay ginawang likas sa Filipino. Inilagay ang mga pananda ng talababa sa mismong mga salitang tinatalakay ng mga ito.
