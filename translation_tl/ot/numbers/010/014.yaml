  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: tl
  text: Ang watawat ng kampo ng mga anak ni Juda ang unang humayo, ayon sa kanilang mga pangkat;[a] at ang namumuno sa pangkat nito ay si Naason na anak ni Aminadab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa kanilang mga hukbo” o “ayon sa kanilang mga yunit.” Ang Hebreo ay gumagamit ng katawagang militar at pang-organisasyon para sa maayos na mga yunit ng tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: humayo
  rationale: Sa salaysay ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis ng kampo upang magpatuloy. Likas at marangal sa Filipino ang “humayo.”
- source_word: דֶּגֶל מַחֲנֵה
  choice: pangkat ng kampo ... sa ilalim ng kanilang watawat
  rationale: Maaaring tumukoy ang דֶּגֶל sa watawat o sa organisadong pangkat na kinakatawan nito. Inilalahad ng salin ang pangkat na humayo habang pinananatili ang kongkretong larawan ng watawat.
- source_word: בְנֵי יְהוּדָה
  choice: mga anak ni Juda
  rationale: Pinananatili ang pormal at pantribong katawagan ng Hebreo sa halip na gawing pangkalahatang “mga tao ng Juda.”
- source_word: בָּרִאשֹׁנָה
  choice: unang
  rationale: Ang anyong pang-abay ay nagsasaad ng pagkakasunod-sunod sa paghayo.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kanilang mga hukbo
  rationale: Ang צבא ay katawagang militar at pang-organisasyon para sa maayos na mga yunit ng Israel; pinananatili ng “mga hukbo” ang lakas ng terminong Hebreo.
- source_word: וְעַל צְבָאוֹ
  choice: at ang namumuno sa hukbo nito ay
  rationale: Ang על ay nagpapahayag ng pamumuno sa yunit. Ang “hukbo nito” ay pinananatiling isahan, gaya ng hulaping Hebreo, at tumutukoy sa yunit ng Juda.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Naason na anak ni Aminadab
  rationale: Ginamit ang mga anyo ng pangalan na natural at nakikilala sa tradisyong Filipino sa Bibliya.
