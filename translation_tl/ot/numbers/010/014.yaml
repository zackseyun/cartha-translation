  source_fidelity: 'Ang kasalukuyang salin ay bahagyang naglilipat ng tungkulin ng דֶּגֶל: sa Hebreo, ang “watawat/pamantayan ng kampo” ang paksa na unang humayo, hindi simpleng ang pangkat ng kampo na nasa ilalim ng watawat. Ang “mga hukbo” ay posible para sa צְבָאֹתָם, ngunit ang “mga pangkat” ay mas likas at sapat na tumpak sa kontekstong organisasyon ng martsa.'
  naturalness: Marangal at malinaw ang himig ng draft. Gayunman, mas tuwiran at mas tapat sa ayos ng Hebreo ang “watawat ng kampo ... ang unang humayo.” Ang “namumuno sa pangkat nito” ay natural na Filipino at malinaw na nagpapahayag ng force ng עַל.
  terminology: Pinananatili ang “mga anak ni Juda” para sa pormal na katawagang pantribo. Ang “watawat” ay angkop para sa דֶּגֶל, na may talababa para sa “bandila.” Ang “mga pangkat” ay angkop para sa organisadong mga yunit na tinutukoy ng צבא sa talata. Ang mga pangalang “Naason” at “Aminadab” ay mga nakikilalang anyong Filipino.
