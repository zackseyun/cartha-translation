base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: tl
  text: Kaya naglakbay sila mula sa bundok ni Yahweh sa layong katumbas ng tatlong araw na paglalakbay,[a] at ang kaban ng tipan ni Yahweh ay naglakbay sa unahan nila sa layong katumbas ng tatlong araw na paglalakbay, upang humanap[b] para sa kanila ng lugar na mapagpapahingahan nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “tatlong araw na paglalakbay.” Gayundin sa ikalawang paglitaw ng parirala.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “humanap” na “galugarin” o “saliksikin” upang makahanap ng mapagpapahingahan para sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: umalis sila
  rationale: Sa konteksto ng paglipat ng kampo, ang נסע ay nangangahulugang lumisan at magsimulang maglakbay. Natural sa makabagong Tagalog ang “umalis sila.”
- source_word: מֵהַר יְהוָה
  choice: mula sa bundok ni Yahweh
  rationale: Tuwirang isinasalin ang הַר bilang “bundok,” at natural sa Tagalog ang “ni Yahweh” para sa ugnayang ipinahahayag ng construct.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: para sa tatlong araw na paglalakbay
  rationale: Ang parirala ay tumutukoy sa sukat o layo ng paglalakbay na karaniwang nilalakbay sa loob ng tatlong araw, hindi lamang sa lumipas na panahon.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: at ang kaban ng tipan ni Yahweh
  rationale: Pinananatili ang ugnayan ng magkakasunod na construct sa malinaw at likas na anyong Tagalog.
- source_word: נֹסֵעַ
  choice: ay naglalakbay
  rationale: Ang participle ay naglalarawan ng nagpapatuloy o kasabay na pagkilos ng kaban habang naglalakbay ang bayan.
- source_word: לִפְנֵיהֶם
  choice: sa unahan nila
  rationale: Malinaw nitong ipinahahayag ang literal na puwestong nasa harap ng pangkat.
- source_word: לָתוּר
  choice: upang humanap
  rationale: Saklaw ng תור ang paghahanap o paggalugad. Dahil ang hinahanap ay mapagpapahingahan, hindi kailangan ang mas militar na diwa ng “maniktik.”
- source_word: מְנוּחָה
  choice: isang lugar na mapagpapahingahan
  rationale: Sa konteksto ng paglalakbay, konkreto itong tumutukoy sa isang lugar na maaari nilang hantungan at pagpahingahan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa banal na pangalan at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Pagkilos ng kaban sa unahan ng Israel
  choice: naglalakbay sa unahan nila
  alternative: nauna sa kanila
  rationale: Pinananatili ang spatial at nagpapatuloy na diwa ng לִפְנֵיהֶם at ng participle, nang hindi nagpapaliwanag kung paano nauugnay ang pagkilos ng kaban sa mga tagapagdala nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban ng tipan,” na pamilyar sa bokabularyong biblikal, habang iniwasan ang labis na arkaikong ayos. Pinanatili ang pag-uulit ng “tatlong araw na paglalakbay” dahil naroon ito sa Hebreo.
