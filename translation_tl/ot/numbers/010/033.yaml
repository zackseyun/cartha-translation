revisions:
- from: Kaya umalis sila mula sa bundok ni Yahweh para sa tatlong araw na paglalakbay,[a] at ang kaban ng tipan ni Yahweh ay naglalakbay sa unahan nila para sa tatlong araw na paglalakbay, upang humanap para sa kanila ng isang lugar na mapagpapahingahan.[b]
  to: Kaya naglakbay sila mula sa bundok ni Yahweh sa layong katumbas ng tatlong araw na paglalakbay,[a] at ang kaban ng tipan ni Yahweh ay naglakbay sa unahan nila sa layong katumbas ng tatlong araw na paglalakbay, upang humanap[b] para sa kanila ng lugar na mapagpapahingahan nila.
  rationale: Inayos ang idyoma para sa sukat ng paglalakbay, ginawang mas natural ang aspekto ng kilos ng kaban sa salaysay, at itinapat ang talababa b sa salitang nagbibigay-batayan dito. Pinanatili ang pag-uulit ng pariralang “tatlong araw na paglalakbay,” ang banal na pangalang Yahweh, at ang hindi-ipinapaliwanag na paglalarawan sa pagkilos ng kaban.
