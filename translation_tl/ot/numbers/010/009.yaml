id: NUM.10.9
reference: Numbers 10:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: tl
  text: At kapag nakipagdigma kayo sa inyong lupain laban sa kaaway na gumigipit sa inyo[a], patunugin ninyo ang mga trumpeta bilang hudyat ng panganib. Sa gayon, maaalaala kayo sa harap ni Yahweh na inyong Diyos[b], at maililigtas kayo mula sa inyong mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At kung makipagdigma kayo sa inyong lupain.” Maaaring magpakilala ang Hebreong pang-ugnay ng isang kondisyunal o pangyayaring kalagayan.
    reason: alternative_reading
  - marker: b
    text: O “maipapaalaala kayo sa harap ni Yahweh na inyong Diyos”; sa mas malayang pagkakasalin, “aalalahanin kayo ni Yahweh na inyong Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kapag
  rationale: Sa kontekstong nagbibigay ng mga tagubilin, ipinakikilala nito ang isang posibleng kalagayan sa hinaharap. Likas sa Tagalog ang “At kapag,” habang itinatala sa talababa ang maaari ring kondisyunal na diwa.
- source_word: תָבֹאוּ מִלְחָמָה
  choice: nakipagdigma kayo
  rationale: Ang Hebreong idyoma ay tumutukoy sa pagpasok o pakikilahok sa digmaan; malinaw at natural itong ipinahahayag ng “nakipagdigma.”
- source_word: בְּאַרְצְכֶם
  choice: sa inyong lupain
  rationale: Pinananatili ng “lupain” ang teritoryal at tipanang himig ng אֶרֶץ nang hindi ito ginagawang makabagong estadong pampolitika.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: laban sa kaaway na gumigipit sa inyo
  rationale: Kinakatawan ng “kaaway” ang pangngalang צַר at ng “gumigipit” ang aktibong participle na צֹרֵר, kaya hindi nawawala ang pag-uulit at tindi ng Hebreo.
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: patunugin ninyo ang mga trumpeta bilang hudyat ng panganib
  rationale: Sa konteksto ng mga trumpeta, ang Hiphil ng רוע ay isang hudyat o alarmang tunog, hindi lamang malakas na pag-ihip. Nililinaw ng parirala ang tungkuling militar ng tunog.
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: maaalaala kayo sa harap ni Yahweh na inyong Diyos
  rationale: Pinananatili ang balintiyak na anyo ng Niphal at ang diwang pagharap sa Diyos, sa halip na tahasang gawing Diyos ang simuno at lutasin ang sintaktikong tensiyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang tipan sa halip na palitan ito ng titulong “Panginoon.”
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: maililigtas kayo mula sa inyong mga kaaway
  rationale: Tumpak na ipinahahayag ng balintiyak na “maililigtas” ang Niphal ng ישׁע at ang pagliligtas sa konteksto ng digmaan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Diwa at tinig ng וֲנִזְכַּרְתֶּם
  choice: maaalaala kayo sa harap ni Yahweh na inyong Diyos
  alternative: aalalahanin kayo ni Yahweh na inyong Diyos
  rationale: Ang Hebreo ay balintiyak. Pinananatili ito upang hindi tahasang lutasin ang pormang “maaalaala” bilang aktibong pagkilos ng Diyos, bagaman iyon ang likas na ipinahihiwatig sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo/inyo” bilang pangmaramihan. Pinanatili ang pangalang Yahweh at ang balintiyak na “maaalaala” upang igalang ang anyo at teolohikal na tensiyon ng Hebreo.
