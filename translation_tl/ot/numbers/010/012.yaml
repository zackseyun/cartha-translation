id: NUM.10.12
reference: Numbers 10:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל לְ/מַסְעֵי/הֶ֖ם מִ/מִּדְבַּ֣ר סִינָ֑י וַ/יִּשְׁכֹּ֥ן הֶ/עָנָ֖ן בְּ/מִדְבַּ֥ר פָּארָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: tl
  text: At naglakbay nang yugto-yugto ang mga anak na lalaki ni Israel[a] mula sa ilang ng Sinai, at humimpil ang ulap sa ilang ng Paran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Sa Hebreo: “mga anak na lalaki ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: naglakbay
  rationale: Sa salaysay ng paglalakbay, tumutukoy ang נסע sa pag-alis ng kampo at pagpapatuloy ng paglalakbay. Ang “naglakbay” ay natural sa Tagalog at umaangkop sa kasunod na paglalarawan ng mga yugto.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak na lalaki ni Israel
  rationale: Pinananatili nito ang tahasang panlalaking katawagang בְנֵי (“mga anak na lalaki”) at ang pampamilyang anyo ng Hebreo. Inilalagay sa talababa ang mas idyomatikong kolektibong katawagang “mga Israelita.”
- source_word: לְמַסְעֵיהֶם
  choice: nang yugto-yugto
  rationale: Ang pangmaramihang מַסָּע ay tumutukoy sa sunod-sunod na yugto o hintuan ng paglalakbay. Malinaw at likas sa modernong Tagalog ang “nang yugto-yugto.”
- source_word: מִמִּדְבַּר סִינָי
  choice: mula sa ilang ng Sinai
  rationale: Ang “ilang” ay angkop sa מִדְבָּר bilang lupaing hindi sinasaka o kakaunti ang naninirahan, nang hindi ipinapalagay na pawang buhanginan ito.
- source_word: וַיִּשְׁכֹּן
  choice: humimpil
  rationale: Ang שכן ay nangangahulugang manirahan o lumagay. Dahil ulap ang simuno sa isang salaysay ng paglalakbay, ipinahahayag ng “humimpil” na tumigil at nanatili ito sa isang lugar.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tiyak ang pantukoy at tumutukoy sa kilalang ulap na gumagabay sa Israel; sapat at malinaw ang tuwirang salin.
- source_word: בְּמִדְבַּר פָּארָן
  choice: sa ilang ng Paran
  rationale: Pare-parehong isinasalin ang מִדְבָּר bilang “ilang,” at tinutumbasan ang pangalang pantangi na פָּארָן bilang “Paran.”
theological_decisions:
- issue: Paglilipat ng בְנֵי יִשְׂרָאֵל
  choice: ang mga anak na lalaki ni Israel
  alternative: ang mga Israelita
  rationale: Walang pangunahing usaping doktrinal dito, ngunit tahasang panlalaki at pampamilya ang anyo ng Hebreo. Pinananatili iyon sa teksto habang ibinibigay sa talababa ang likas na kolektibong katumbas sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ilang,” “yugto-yugto,” at “humimpil” upang manatiling maikli, natural, at malapit sa galaw at heograpiya ng tekstong Hebreo.
