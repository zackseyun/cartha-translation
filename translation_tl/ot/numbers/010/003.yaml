  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
translation:
  language: tl
  text: Kapag hinipan nila ang mga ito,[a] ang buong kapulungan ay magtitipon sa harap mo, sa pasukan ng Tolda ng Pagtatagpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “At hihipan nila ang mga ito, at ang buong kapulungan ay magtitipon sa iyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָקְעוּ
  choice: Kapag hinipan nila
  rationale: 'Sa konteksto ng sunod-sunod na tagubilin, ang anyo ng pandiwa ay likas na nagpapahayag ng panahong kondisyon: ang pagtitipon ay mangyayari kapag pinatunog ang mga trumpeta.'
- source_word: בָּהֵן
  choice: ang mga iyon
  rationale: Ang pambabaeng pangmaramihang panghalip ay tumutukoy sa dalawang pilak na trumpeta sa naunang talata. Ang “mga iyon” ay malinaw at natural kasunod ng “hinipan.”
- source_word: וְנוֹעֲדוּ
  choice: ay magtitipon
  rationale: Ang Niphal ng יעד dito ay tumutukoy sa pagtipon ng sambayanan bilang tugon sa itinakdang hudyat.
- source_word: אֵלֶיךָ
  choice: sa harap mo
  rationale: Bagaman literal na “sa iyo,” ipinahihiwatig ng konteksto ang pagharap ng kapulungan kay Moises sa itinakdang lugar.
- source_word: כָּל הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay ang sama-samang pamayanan ng Israel; malinaw at marangal na ipinahahayag ito ng “buong kapulungan.”
- source_word: פֶּתַח
  choice: pasukan
  rationale: Tumutukoy ang salita sa bukana o lugar ng pagpasok sa tolda; “pasukan” ang likas na makabagong katumbas.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Ang parirala ay tumutukoy sa banal na tolda kung saan nakikipagtagpo ang Diyos ayon sa itinakda. Ang “Toldang Tipanan” ay maikli, pamilyar, at angkop sa dignidad ng teksto.
theological_decisions:
- issue: Kahulugan ng אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  alternative: Tolda ng Pagtatagpo / Toldang Tagpuan
  rationale: Maaaring idiin ng מוֹעֵד ang itinakdang panahon o lugar ng pagtatagpo. Pinili ang nakaugaliang “Toldang Tipanan” nang hindi nilulutas nang labis ang saklaw ng katawagan; walang doktrinal na detalye ang idinagdag.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “kapulungan” para sa sama-samang pamayanan at pinanatili ang pormal na katawagang “Toldang Tipanan.”
