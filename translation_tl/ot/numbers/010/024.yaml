  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: tl
  text: At ang namumuno sa pangkat ng lipi ng mga anak ni Benjamin ay si Abidan na anak ni Gideoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo” o “dibisyon” sa halip na “pangkat”; ang salitang Hebreo ay maaaring tumukoy sa isang organisadong yunit na may kaayusang militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: At ang namumuno sa
  rationale: Ipinagpapatuloy ng וְ ang talaan, at ipinahihiwatig ng עַל sa pormulang ito na ang binanggit na tao ang nakatalaga sa pamumuno sa pangkat.
- source_word: צְבָא
  choice: pangkat
  rationale: Tumutukoy rito sa organisadong yunit sa paglalakbay na may kaayusang militar, hindi lamang sa hukbo sa aktuwal na pakikipagdigma. Likas at malinaw sa modernong Filipino ang “pangkat.”
- source_word: מַטֵּה
  choice: lipi
  rationale: Ang kahulugan dito ay yunit ng tribo, hindi literal na tungkod.
- source_word: בְּנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang anyong pangkan at genealogical ng Hebreong parirala habang nananatiling madaling maunawaan.
- source_word: אֲבִידָן
  choice: Abidan
  rationale: Karaniwang transliterasyon ng pangalang pantangi sa Filipino.
- source_word: בֶּן גִּדְעוֹנִי
  choice: anak ni Gideoni
  rationale: Likas na salin sa Filipino ng patronymic na pagkakakilanlan.
