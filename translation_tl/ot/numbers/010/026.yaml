  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: tl
  text: At ang namumuno sa pangkat ng lipi ng mga anak ni Asher ay si Pagiel na anak ni Ocran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbo,” “dibisyon,” o “hanay” sa halip na “pangkat”; ang salitang Hebreo ay tumutukoy sa isang organisadong pangkat sa kaayusan ng kampo ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: At ang namumuno sa
  rationale: Ipinagpapatuloy ng וְ ang talaan, at ipinahihiwatig ng עַל na si Pagiel ang nakatalaga sa pamumuno ng pangkat. Natural sa modernong Tagalog ang pariralang ito kaysa sa literal na “at sa ibabaw ng.”
- source_word: צְבָא
  choice: pangkat
  rationale: Sa kaayusan ng kampo at paglalakbay, tumutukoy ito sa isang organisadong pangkat ng tribo. Hindi nito labis na binibigyang-diin ang pakikidigma gaya ng maaaring gawin ng “hukbo.”
- source_word: מַטֵּה
  choice: lipi
  rationale: Ang kontekstuwal na kahulugan ay tribo o yunit pantribo, hindi literal na tungkod.
- source_word: בְּנֵי אָשֵׁר
  choice: mga anak ni Asher
  rationale: Pinananatili ang literal at nakaugaliang katawagang Hebreo para sa mga lalaking inapo ni Asher na kumakatawan sa lipi.
- source_word: פַּגְעִיאֵל
  choice: Pagiel
  rationale: Isinalin sa karaniwang transliterasyong ginagamit sa Tagalog ang pangalang pantangi.
- source_word: בֶּן עָכְרָן
  choice: anak ni Ocran
  rationale: Natural na katumbas sa Tagalog ng patronimikong Hebreo; transliterado ang pangalan ng ama.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “namumuno sa” upang natural na maipahayag ang eliptikong administratibong diwa ng Hebreo, at “pangkat” upang mapanatili ang organisadong katangian nang hindi labis na militar ang dating.
