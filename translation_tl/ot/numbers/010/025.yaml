base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: tl
  text: Pagkatapos, humayo ang watawat[a] ng kampo ng mga anak ni Dan, na nagsisilbing bantay sa hulihan[b] ng lahat ng kampo ayon sa kani-kanilang pangkat[c]. At si Ahiezer na anak ni Ammishaddai ang namumuno sa pangkat nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bandila” o “sagisag.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na bumubuo sa hulihan” o “na siyang nasa pinakahulihan.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo ay maaari ring isaling “mga hukbo” o “mga yunit”; dito, tumutukoy ito sa organisadong mga pangkat ng mga lipi ayon sa kaayusan ng kanilang paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Pagkatapos, humayo
  rationale: Isinusulong ng waw-consecutive ang salaysay, at natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod. Ang “humayo” ay angkop sa paglalakbay ng kampo.
- source_word: דֶּגֶל
  choice: watawat
  rationale: Tumutukoy ito sa sagisag na pinagtitipunan at sinusundan ng isang pangkat pantribo; malinaw at dignified ang “watawat” sa modernong Filipino.
- source_word: מַחֲנֵה
  choice: kampo
  rationale: Karaniwan at tuwirang katumbas ito ng kampo o himpilan ng pangkat ng Israel.
- source_word: בְנֵי דָן
  choice: mga anak ni Dan
  rationale: Pinananatili nito ang Hebreong pormulang pampamilya, na sa konteksto ay tumutukoy sa mga kaapu-apuhan o lipi ni Dan.
- source_word: מְאַסֵּף
  choice: bilang panghuling hanay
  rationale: Sa kaayusan ng pagmamartsa, tumutukoy ang participle sa pangkat na nasa hulihan. Iniiwasan nito ang labis na pagtukoy sa tungkuling pandigma na hindi tahasang sinasabi ng salita.
- source_word: לְכָל הַמַּחֲנֹת
  choice: ng lahat ng kampo
  rationale: Ipinakikita nito ang kaugnayan ng pangkat ni Dan sa buong hanay ng magkakahiwalay na kampo.
- source_word: לְצִבְאֹתָם
  choice: ayon sa kani-kanilang pangkat
  rationale: Ang צבאות dito ay mga organisadong yunit sa kaayusan ng paglalakbay, hindi kinakailangang mga hukbo sa makitid na kahulugang pandigma.
- source_word: וְעַל צְבָאוֹ
  choice: Ang namumuno sa pangkat nito ay
  rationale: Likas sa Filipino ang ganitong ayos at malinaw nitong ipinahahayag na si Ahiezer ang nakatalaga sa ibabaw ng yunit ng Dan.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: si Ahiezer na anak ni Ammishaddai
  rationale: Isinasalin ang Hebreong patronymic nang tuwiran habang tinatransliterate ang mga pangalang pantangi.
