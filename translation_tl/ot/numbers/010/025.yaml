translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang “mga anak ni Dan” upang maipakita ang pormulang pampamilya ng Hebreo. Ginamit ang “panghuling hanay” para sa מְאַסֵּף upang mapanatili ang kontekstuwal na diwa nang hindi sapilitang nililimitahan ito sa tungkuling militar; inilagay sa talababa ang mga posibleng kahalili.
