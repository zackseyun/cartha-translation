base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: tl
  text: Pagkatapos ay ibinaba ang tabernakulo, at humayo ang mga anak ni Gershon at ang mga anak ni Merari, mga tagapagdala ng tabernakulo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּרַד
  choice: ibinaba
  rationale: Ang Hophal ng ירד ay nagsasaad na ang tabernakulo ay ibinaba mula sa pagkakatayo nito. Pinananatili ng “ibinaba” ang larawan ng Hebreo nang hindi tahasang idinaragdag ang mas tiyak na ideya ng pagkalas.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang מִשְׁכָּן ang karaniwang tawag sa santuwaryong tolda ng Israel. Ang “tabernakulo” ay kinikilalang terminong biblikal sa Filipino at angkop sa kontekstong ito.
- source_word: וְנָסְעוּ
  choice: humayo
  rationale: Sa konteksto ng paglalakbay, ang נסע ay tumutukoy sa pag-alis ng kampo upang magpatuloy. Natural at marangal sa Filipino ang “humayo.”
- source_word: בְנֵי גֵרְשׁוֹן
  choice: ang mga anak ni Gershon
  rationale: Tuwirang pinananatili nito ang Hebreong ekspresyong pangangkan na “mga anak ni Gershon,” sa halip na gawing pangalan ng pangkat.
- source_word: וּבְנֵי מְרָרִי
  choice: ang mga anak ni Merari
  rationale: Pinananatili nito ang tahasang anyo at pagkakapantay ng mga parirala sa Hebreo.
- source_word: נֹשְׂאֵי
  choice: na may pasan
  rationale: Ang participle ay naglalarawan sa kanila bilang mga tagapagdala habang humahayo. Ang “may pasan” ay malinaw at natural, at naaangkop sa mabibigat na sangkap ng tabernakulo.
- source_word: הַמִּשְׁכָּן
  choice: ng tabernakulo
  rationale: Inuulit ng Hebreo ang mismong pangngalan. Hindi idinagdag sa pangunahing teksto ang “mga bahagi,” bagaman iyon ang ipinahihiwatig ng konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang literal na ekspresyong pangangkan at ang pag-uulit ng “tabernakulo,” habang iniwasang idagdag sa teksto ang hindi tahasang sinabing “mga bahagi nito.”
