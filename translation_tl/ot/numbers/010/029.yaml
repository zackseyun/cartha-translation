revisions:
- from: Sinabi ni Moises kay Hobab na anak ni Reuel na Midianita, na biyenan[a] ni Moises, “Papasok na kami sa paglalakbay patungo sa lugar na tungkol dito ay sinabi ni Yahweh, ‘Ibibigay ko iyon sa inyo.’ Sumama ka sa amin, at gagawan ka namin ng mabuti, sapagkat nagsalita si Yahweh ng mabuti tungkol sa Israel.”
  to: Sinabi ni Moises kay Hobab, na anak ni Reuel na Midianita at biyenan[a] ni Moises, “Aalis kami patungo sa lugar na sinabi ni Yahweh, ‘Ibibigay ko ito sa inyo.’ Sumama ka sa amin, at magiging mabuti kami sa iyo, sapagkat nagsalita si Yahweh ng mabuti tungkol sa Israel.”
  rationale: Pinalitan ang maling-matunog na paglalarawan ng paglalakbay ng “Aalis kami,” na tapat sa kontekstong pag-alis ng Israel. Ginawang mas natural ang pangakong gagawa ng mabuti kay Hobab, habang pinananatili ang saklaw ng Hebrew. Hindi binago ang pangunahing pag-unawa sa חֹתֵן, ngunit pinanatili at pinasimple ang talababa upang maipakita ang lehitimong kalabuan.
