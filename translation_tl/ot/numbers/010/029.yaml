source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: tl
  text: Sinabi ni Moises kay Hobab, na anak ni Reuel na Midianita at biyenan[a] ni Moises, “Aalis kami patungo sa lugar na sinabi ni Yahweh, ‘Ibibigay ko ito sa inyo.’ Sumama ka sa amin, at magiging mabuti kami sa iyo, sapagkat nagsalita si Yahweh ng mabuti tungkol sa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebrew na חֹתֵן ay maaari ring tumukoy nang mas malawak sa kamag-anak dahil sa pag-aasawa; kaya inuunawa ito ng ilan bilang “bayaw” o “kamag-anak dahil sa pag-aasawa,” sa halip na “biyenan.”
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבָב
  choice: Hobab
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang anyo nito sa Filipino.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Isinatinig ang pangalang pantangi sa halip na isalin ang kahulugan nito.
- source_word: הַמִּדְיָנִי
  choice: na Midianita
  rationale: Likas na katawagang Filipino para sa etnikong pagkakakilanlan, na inuugnay sa Reuel.
- source_word: חֹתֵן מֹשֶׁה
  choice: biyenan ni Moises
  rationale: Ang חֹתֵן ay madalas tumukoy sa biyenang lalaki ngunit maaari ring mas malawak na mangahulugang lalaking kamag-anak dahil sa pag-aasawa; pinananatili sa talababa ang tunay na kalabuan.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: Papasok na kami sa paglalakbay
  rationale: Ipinahahayag ng participle at panghalip ang nalalapit o nagsisimula nang pagkilos; ang parirala ay malinaw sa modernong Filipino.
- source_word: הַמָּקוֹם
  choice: ang lugar
  rationale: Tuwirang katumbas ng pangngalang may pantukoy.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: na tungkol dito ay sinabi ni Yahweh, ‘Ibibigay ko iyon sa inyo’
  rationale: Pinananatili ang kaugnay na konstruksyon at ang tuwirang pangako; ang “inyo” ay maramihan gaya ng Hebrew.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinatinig ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: לְכָה אִתָּנוּ
  choice: Sumama ka sa amin
  rationale: Natural na paanyaya sa Filipino at tapat sa diwa ng paglalakbay na magkakasama.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: gagawan ka namin ng mabuti
  rationale: Pinananatili ang ideya ng pagkilos para sa ikabubuti ng kausap nang hindi labis na binibigyang-kahulugan.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: nagsalita si Yahweh ng mabuti tungkol sa Israel
  rationale: Pinananatili ang pandiwang “nagsalita” at ang malawak na saklaw ng “mabuti,” sa halip na gawing tahasang “nangako.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebrew; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Eksaktong kaugnayan ng חֹתֵן kay Moises
  choice: biyenan
  alternative: kamag-anak dahil sa pag-aasawa o bayaw
  rationale: Karaniwang kahulugan ang “biyenan,” ngunit mas malawak ang maaaring saklaw ng salitang Hebrew. Hindi nilulutas nang lampas sa teksto ang tanong sa ugnayang pampamilya, kaya inilalahad ang kalabuan sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kami” dahil kausap ni Moises si Hobab at iniimbitahan niya itong sumama sa pangkat. Iniwasan ang “nangako” upang mapanatili ang mas tuwirang “nagsalita ng mabuti” ng Hebrew.
