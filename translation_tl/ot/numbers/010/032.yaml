    issue: Hindi gaanong likas ang “gagawan ka rin namin ng mabuti.”
    rationale: Bagaman nauunawaan, mas idiomatiko sa modernong Filipino ang “gagawan ka namin ng kabutihan.” Hindi rin tahasang ipinahihiwatig ng Hebreo ang “rin”; ang pangako ay simpleng resulta ng kondisyon.
  - severity: low
    issue: Ang talababa ay maaaring gawing mas malinaw ang pag-uulit ng pandiwang “gumawa ng mabuti.”
    rationale: Ang Hebreo ay inuulit ang ugat na יטב, ngunit ang kasalukuyang literal na anyo ay medyo mabigat sa Filipino. Maaaring ipakita ang pormal na “kabutihang iyon” at ang magkatugmang pandiwa nang mas malinaw.
  revised_text: At kung sasama ka sa amin, kung gayon, anumang kabutihang gawin ni Yahweh para sa amin ay gagawan ka namin ng kabutihan.
