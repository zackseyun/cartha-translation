- from: At kung sasama ka sa amin, kung gayon, anumang kabutihang gawin ni Yahweh sa amin[a] ay gagawan ka rin namin ng mabuti.
  to: At kung sasama ka sa amin, kung gayon, anumang kabutihang gawin ni Yahweh para sa amin ay gagawan ka namin ng kabutihan.
  rationale: Pinalitan ang hindi gaanong likas na “gagawan ka rin namin ng mabuti” ng “gagawan ka namin ng kabutihan.” Pinananatili nito ang kahulugan ng Hiphil ng יטב—gumawa ng mabuti o magbigay ng kabutihan sa isang tao—nang hindi idinaragdag na ang kabutihan ay eksaktong kapareho ng ginawa ni Yahweh. Ginawang “para sa amin” ang relasyon upang maging malinaw ang benepisyaryong diwa ng עִמָּנוּ sa konteksto.
