  source_fidelity: Tumpak na naipapahayag ng draft ang kondisyonal na pagsama, ang kabutihang gagawin ni Yahweh para sa Israel, at ang kasunod na pangako ng Israel na gumawa ng mabuti para sa kausap. Gayunman, ang “gagawan ka rin namin ng mabuti” ay hindi ang pinakanatural na modernong Filipino para sa וְהֵטַבְנוּ לָךְ.
  naturalness: Mas malinaw at likas ang “gagawan ka namin ng kabutihan.” Iniiwasan nito ang medyo pilit na konstruksiyong “gagawan ... ng mabuti,” habang pinananatili ang pandiwang ideya ng paggawa ng mabuti.
  terminology: Ang “Yahweh” ay wastong salin ng יהוה ayon sa itinakdang gamit. Ang “kabutihan” ay angkop para sa הַטּוֹב at pinananatili ang marangal ngunit makabagong rehistro.
  issues:
