  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: tl
  text: At kung sasama ka sa amin, kung gayon, anumang kabutihang gawin ni Yahweh para sa amin ay gagawan ka namin ng kabutihan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kung
  rationale: Ipinakikilala ng parirala ang isang kondisyon. Ang “At kung” ay natural sa makabagong Tagalog at hindi ginagawang tiyak ang bagay na kondisyonal pa sa Hebreo.
- source_word: תֵלֵךְ עִמָּנוּ
  choice: sasama ka sa amin
  rationale: Sa konteksto, ang הלך kasama ng עִם ay tumutukoy sa pagsama sa Israel sa kanilang paglalakbay. Mas natural sa Tagalog ang “sasama” kaysa sa literal na “lalakad.”
- source_word: וְהָיָה
  choice: kung gayon
  rationale: Ang ikalawang וְהָיָה ay nagpapakilala sa magiging bunga ng kondisyon. Malinaw itong ipinahahayag ng “kung gayon.”
- source_word: הַטּוֹב הַהוּא
  choice: anumang kabutihan
  rationale: Ang parirala ay tumutukoy sa kabutihang ipagkakaloob sa Israel, na nililinaw ng kasunod na sugnay. Ang “anumang kabutihan” ay natural at pinananatiling bukas ang saklaw nito.
- source_word: אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ
  choice: na gawin ni Yahweh sa amin
  rationale: Ang Hiphil ng יטב ay maaaring mangahulugang gumawa ng mabuti o pakitunguhan nang mabuti. Pinananatili ng salin ang pandiwang larawan at ang personal na pangalang Yahweh.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: ay gagawan ka rin namin ng mabuti
  rationale: Inuulit ng Hebreo ang ugat na יטב. Pinananatili ng “gagawan…ng mabuti” ang ugnayang ito nang hindi tahasang idinaragdag na eksaktong “iyon ding” kabutihan ang ibibigay.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ng Diyos ang tuwirang nasa tekstong Hebreo. Ang “Yahweh” ay transliterasyon nito at hindi pagpapalit ng pangalan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sasama” bilang likas na paglalarawan ng pakikipaglakbay at pinanatili ang pag-uulit ng konsepto ng paggawa ng mabuti.
