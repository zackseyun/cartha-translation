  text: וְ/אִם בְּ/אַחַ֖ת יִתְקָ֑עוּ וְ/נוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ הַ/נְּשִׂיאִ֔ים רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: tl
  text: Ngunit kung isang trumpeta lamang ang hihipan nila, ang mga tagapanguna—ang mga pinuno ng libu-libo ng Israel[a]—ang magtitipon sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “libu-libo ng Israel” ay malamang na tumutukoy sa mga pangkat ng Israel na binubuo o tinatawag na tig-iisang libo. Maaari rin itong isalin nang mas interpretibo bilang “mga angkan ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyong salungat sa tagubilin sa naunang talata, kung saan parehong trumpeta ang hinihipan.
- source_word: בְּ/אַחַת יִתְקָעוּ
  choice: kung isang trumpeta lamang ang hihipan nila
  rationale: Ang literal na “sa isa” ay eliptikong tumutukoy sa isa sa dalawang trumpeta; nilinaw ito sa natural na Tagalog nang hindi binabago ang kaibahan sa naunang talata.
- source_word: וְ/נוֹעֲדוּ אֵלֶי/ךָ
  choice: ang magtitipon sa iyo
  rationale: Ang Niphal ng יעד ay tumutukoy sa pagtitipon bilang tugon sa itinakdang hudyat, at ang אֵלֶיךָ ay nagsasaad ng paglapit kay Moises.
- source_word: הַ/נְּשִׂיאִים
  choice: ang mga tagapanguna
  rationale: Tumutukoy sa mga kinikilalang pinuno ng Israel; ang “tagapanguna” ay malinaw at marangal sa modernong Tagalog at hindi nagpapahiwatig ng pagiging maharlikang prinsipe.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: ang mga pinuno ng libu-libo ng Israel
  rationale: Pinananatili ang terminong “libu-libo” ng Hebreo at ang apposisyon na nagpapakilala kung sinu-sino ang mga tagapanguna, sa halip na tiyak na ipakahulugang mga angkan.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Tahasang binanggit ang “trumpeta,” na ipinahihiwatig ng Hebreong “isa,” upang maging natural at malinaw ang kondisyon. Pinanatili sa pangunahing teksto ang administratibo o militar na katawagang “libu-libo,” habang inilagay sa talababa ang posibleng interpretasyong “mga angkan.”
