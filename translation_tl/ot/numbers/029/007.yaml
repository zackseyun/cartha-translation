base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: tl
  text: Sa ikasampung araw ng ikapitong buwang ito, magkakaroon kayo ng isang banal na pagtitipon. Magpakasakit kayo[a], at huwag kayong gagawa ng anumang gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpakumbaba kayo” o “pagkaitan ninyo ang inyong mga sarili.” Sa literal, “pahirapan ninyo ang inyong mga sarili.” Isa itong ritwal na idyomang Hebreo tungkol sa pagkakait sa sarili, lalo na sa pag-aayuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר
  choice: Sa ikasampung araw
  rationale: Ang pang-ukol at bilang ay tumutukoy sa petsa sa kalendaryo; likas sa Tagalog na idagdag ang “araw.”
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: ng ikapitong buwang ito
  rationale: Pinananatili nito ang pagkakasunod ng buwan at ang demonstratibong הַזֶּה sa natural na Tagalog.
- source_word: מִקְרָא קֹדֶשׁ
  choice: isang banal na pagtitipon
  rationale: Ipinahihiwatig ng parirala ang opisyal na ipinatawag na sagradong kapulungan; malinaw at marangal ang “banal na pagtitipon” sa modernong Tagalog.
- source_word: יִהְיֶה לָכֶם
  choice: magkakaroon kayo
  rationale: Natural nitong ipinahahayag sa Tagalog na ang banal na pagtitipon ay itinakda para sa bayan.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Pahihirapan ninyo ang inyong sarili
  rationale: Pinananatili nito ang lakas at sadyang lawak ng ritwal na idyoma nang hindi ito nililimitahan sa pag-aayuno lamang o pinapalambot bilang panloob na pagpapakumbaba.
- source_word: נַפְשֹׁתֵיכֶם
  choice: ang inyong sarili
  rationale: Sa idyomang ito, ang reflexive na pananalita ang natural na katumbas at umiiwas sa pagpapahiwatig ng paghihiwalay ng kaluluwa at katawan.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: huwag kayong gagawa ng anumang gawain
  rationale: Malinaw nitong naihahatid ang ganap na pagbabawal sa lahat ng gawain sa natural na estilong legal sa Tagalog.
theological_decisions:
- issue: Pagpapahayag sa ritwal na idyomang וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Pahihirapan ninyo ang inyong sarili
  alternative: Magpakumbaba kayo / pagkaitan ninyo ang inyong sarili
  rationale: Ang piniling salin ay nagpapanatili sa penitensiyal at ritwal na bigat ng utos at sa tunay na lawak nito. Hindi nito ipinapalagay na pag-aayuno lamang ang tinutukoy, bagaman karaniwang kaugnay iyon ng idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “banal na pagtitipon” para sa pormal na katawagang panritwal, at pinanatili ang matinding anyo ng idyoma sa pangunahing teksto habang ipinaliliwanag sa talababa ang mga posibleng kahulugan.
