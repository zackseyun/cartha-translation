  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: tl
  text: 'At ang kanilang handog na pagkaing butil ay pinong harina na hinaluan ng langis: tatlong ikasampu para sa toro[a], at dalawang ikasampu para sa lalaking tupa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tatlong ikasampu” at “dalawang ikasampu” sa Hebreo ay mga ikasampung bahagi ng isang efa, isang panukat sa tuyong sangkap na ginagamit sa sistema ng paghahandog ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: At ang kanilang handog na pagkaing butil ay
  rationale: Sa konteksto ng paghahandog, ang מִנְחָה ay handog na mula sa butil, hindi lamang pangkalahatang handog. Pinanatili ang pang-ugnay na וּ bilang “At,” at nilagyan ng “ay” upang maging natural ang sugnay na walang tahasang pandiwa sa Hebreo.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Tumutukoy ang סֹלֶת sa mataas na uring harina na pinong giniling at ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: hinaluan ng langis
  rationale: Ipinahahayag ng anyong balintiyak na בְּלוּלָה ang paghahandang ginawa sa harina sa pamamagitan ng paghahalo rito ng langis.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tatlong ikasampu
  rationale: Ang עִשָּׂרוֹן ay isang ikasampung bahagi ng efa sa mga tuntunin ng paghahandog. Pinanatiling maikli sa pangunahing teksto at ipinaliwanag ang yunit sa talababa.
- source_word: לַפָּר
  choice: para sa toro
  rationale: Ang פַּר ay tumutukoy sa toro sa konteksto ng paghahandog; pinanatili ang anyong isahan.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dalawang ikasampu
  rationale: Tumutukoy ito sa dalawang ikasampung bahagi ng efa; ang yunit ay ipinaliliwanag sa talababa.
- source_word: לָאָיִל
  choice: para sa lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa, lalo na sa konteksto ng paghahandog; pinanatili ang isahan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “handog na pagkaing butil” upang maipakita ang teknikal na kahulugan ng מִנְחָה sa kontekstong ritwal, at “lalaking tupa” bilang madaling maunawaang katumbas ng ram. Inilagay ang panandang [a] pagkatapos ng unang sukat upang saklawin ng talababa ang dalawang magkaugnay na sukat.
