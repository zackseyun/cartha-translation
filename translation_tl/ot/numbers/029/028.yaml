  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: tl
  text: at isang lalaking kambing bilang handog para sa kasalanan, bukod sa palagiang handog na sinusunog at sa handog na butil at handog na inumin nito[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tuluy-tuloy na handog na sinusunog.”
    reason: lexical_alternative
  - marker: b
    text: Ang “handog na inumin” ay maaari ring tawaging “libasyon,” isang handog na ibinubuhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: at isang lalaking kambing
  rationale: Ang שָׂעִיר ay tumutukoy sa lalaking kambing, at pinananatili ng “at” ang pagpapatuloy ng talaan ng mga handog.
- source_word: חַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, ang חַטָּאת ay tumutukoy sa handog para sa kasalanan, hindi lamang sa abstraktong kasalanan.
- source_word: אֶחָד
  choice: isang
  rationale: Malinaw na pinananatili ang bilang ng hayop na ihahandog.
- source_word: מִ/לְּ/בַד
  choice: bukod pa sa
  rationale: Ipinahihiwatig na ang handog na ito ay karagdagan sa karaniwang pangkat ng mga handog.
- source_word: עֹלַת הַ/תָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Ang עֹלָה ay handog na sinusunog, samantalang ang תָּמִיד ay nagpapahayag ng palagian o regular na itinakdang paghahandog nang hindi labis na nililimitahan sa salitang “araw-araw.”
- source_word: וּ/מִנְחָתָ/הּ
  choice: sa handog na butil nito
  rationale: Sa mga listahang pansakripisyo, ang מִנְחָה ay handog na butil; ang hulaping panghalip ay tumutukoy sa handog na sinusunog.
- source_word: וְ/נִסְכָּ/הּ
  choice: at sa handog na inumin nito
  rationale: Ang נֶסֶךְ ay ibinubuhos na handog na inumin; ang hulaping panghalip ay muling tumutukoy sa handog na sinusunog.
