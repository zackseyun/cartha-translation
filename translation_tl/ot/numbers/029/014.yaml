  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: tl
  text: 'At ang kanilang handog na butil ay pinong harina na hinaluan ng langis: tatlong takal na tig-iikasampu para sa bawat toro[a], para sa labintatlong toro, at dalawang takal na tig-iikasampu para sa bawat lalaking tupa, para sa dalawang lalaking tupa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tatlong takal na tig-iikasampu” at “dalawang takal na tig-iikasampu” sa Hebreo ay tumutukoy sa mga takal na tig-iikasampu, na ayon sa tradisyon ay mga ikasampu ng isang efa.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: At ang kanilang handog na butil
  rationale: Sa konteksto ng paghahandog, ang מִנְחָה ay tumutukoy sa handog na mula sa butil, at ang hulaping pangmaramihan ay tumutukoy sa mga hayop na inihahandog sa talata.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang malinaw at karaniwang katawagan sa mahusay na giniling na harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: hinaluan ng langis
  rationale: Tumpak na ipinahahayag ang pasibong anyo at ang paghahalo ng harina sa langis sa natural na modernong Tagalog.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tatlong ikasampung takal
  rationale: Ang עִשָּׂרוֹן ay isang takal na isang ikasampu, tradisyonal na nauunawaang ikasampu ng isang efa. Ang salitang “takal” ay nilinaw sa teksto nang hindi isinasama roon ang hindi tahasang inuulit na “efa.”
- source_word: לַפָּר הָאֶחָד
  choice: para sa bawat toro
  rationale: Bagaman literal na “para sa isang toro,” distributibo ang gamit nito dahil sinusundan ito ng kabuuang bilang ng mga toro.
- source_word: לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: para sa labintatlong toro
  rationale: Tinutukoy nito ang buong pangkat ng mga torong tatanggap ng takdang dami para sa bawat isa.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dalawang ikasampung takal
  rationale: Pinananatili ang kaparehong terminolohiya ng panukat upang maging malinaw ang parallel sa tatlong ikasampung takal.
- source_word: לָאַיִל הָאֶחָד
  choice: para sa bawat lalaking tupa
  rationale: Distributibo rin ang parirala. Ginamit ang “lalaking tupa” upang malinaw na maiba ang אַיִל sa pangkalahatang tawag na tupa.
- source_word: לִשְׁנֵי הָאֵילִם
  choice: para sa dalawang lalaking tupa
  rationale: Ipinahahayag nito ang kabuuang bilang ng mga lalaking tupa sa handog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “handog na butil,” “pinong harina,” at “hinaluan ng langis” bilang natural ngunit tumpak na mga katawagan sa kontekstong pansamba. Ang “lalaking tupa” ay pinili kaysa sa hiram o mas teknikal na katawagan upang madaling maunawaan ng karaniwang mambabasa.
