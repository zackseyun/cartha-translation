revisions:
- from: Ang mga ito ang ihahandog ninyo kay Yahweh sa mga itinakdang panahon ninyo, bukod pa sa inyong mga handog na ipinanata at mga kusang-loob na handog—ang inyong mga handog na sinusunog, mga handog na butil, mga handog na inumin, at mga handog para sa kapayapaan.[a]
  to: Ang mga ito ang ihahandog ninyo kay Yahweh sa inyong mga itinakdang panahon, bukod pa sa inyong mga handog na ipinanata at mga kusang-loob na handog, para sa inyong mga handog na sinusunog, mga handog na butil, mga handog na inumin, at mga handog para sa kapayapaan.[a]
  rationale: Ginawa lamang ang maliliit na pagbabago para sa mas likas na Filipino at upang hindi maging sobrang tiyak ang sintaktikong ugnayan ng huling talaan sa mga handog na ipinanata at kusang-loob. Nananatili ang kahulugan, rehistro, banal na pangalan, at talababa ng draft.
