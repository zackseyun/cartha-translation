base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: tl
  text: Ang mga ito ang ihahandog ninyo kay Yahweh sa inyong mga itinakdang panahon, bukod pa sa inyong mga handog na ipinanata at mga kusang-loob na handog, para sa inyong mga handog na sinusunog, mga handog na butil, mga handog na inumin, at mga handog para sa kapayapaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga handog para sa mabuting ugnayan.” Ang terminong Hebreo ay tumutukoy sa isang uri ng handog na kaugnay ng kapayapaan, kabuuan, o mabuting kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תַּעֲשׂוּ
  choice: Ang mga ito ang ihahandog ninyo
  rationale: Ang אֵלֶּה ay tumutukoy sa mga handog na itinakda sa naunang konteksto. Bagaman literal na ‘gagawin’ ang תַּעֲשׂוּ, likas at tumpak sa kontekstong pansakripisyo ang ‘ihahandog.’
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tahasang pinananatili ang tipanang pangalan na יהוה; ang ‘kay’ ay natural na pananda sa paghahandog sa Diyos.
- source_word: בְּמוֹעֲדֵיכֶם
  choice: sa mga itinakdang panahon ninyo
  rationale: Pinananatili nito ang malawak na diwa ng מוֹעֵד bilang takdang banal na panahon o okasyon, sa halip na paliitin ito sa mga kapistahan lamang.
- source_word: מִנִּדְרֵיכֶם וְנִדְבֹתֵיכֶם
  choice: sa inyong mga handog na ipinanata at mga kusang-loob na handog
  rationale: Nililinaw na mga handog na kaugnay ng panata ang נֶדֶר at na kusang ibinibigay ang נְדָבָה.
- source_word: עֹלֹתֵיכֶם
  choice: inyong mga handog na sinusunog
  rationale: Karaniwan at malinaw na katawagan sa handog na lubusang sinusunog.
- source_word: מִנְחֹתֵיכֶם
  choice: mga handog na butil
  rationale: Sa kontekstong makasaserdote, ang מִנְחָה ay tumutukoy sa handog mula sa butil.
- source_word: נִסְכֵּיכֶם
  choice: mga handog na inumin
  rationale: Tumutukoy ang נֶסֶךְ sa likidong ibinubuhos bilang handog; madaling maunawaan ang katawagang ito sa modernong Filipino.
- source_word: שַׁלְמֵיכֶם
  choice: mga handog para sa kapayapaan
  rationale: Pinananatili ang kaugnayan ng שְׁלָמִים sa kapayapaan, kabuuan, at mabuting kalagayan, habang inilalagay sa talababa ang isa pang posibleng katawagan.
theological_decisions:
- issue: Paglalapat sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang banal na pangalan mismo; pinananatili ng ‘Yahweh’ ang pagkakakilanlan nito bilang tipanang pangalan.
- issue: Paglalapat sa שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa mabuting ugnayan
  rationale: Hindi ganap na sinasaklaw ng iisang katumbas ang saklaw ng terminong Hebreo. Pinananatili sa pangunahing teksto ang kaugnayan nito sa kapayapaan at kabuuan, at kinikilala sa talababa ang aspektong pakikipag-ugnayan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang gitling na em dash upang malinaw na iugnay ang huling talaan sa mga handog na ipinanata at kusang-loob na handog nang hindi nilulutas nang labis ang ugnayang sintaktiko ng magkakasunod na pariralang may לְ.
