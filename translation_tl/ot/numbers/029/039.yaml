  - severity: low
    issue: Em dash bago ng talaan ng mga uri ng handog
    rationale: Maaaring palakasin ng em dash ang isang appositional na pagbasa na hindi tahasang hinihingi ng Hebreo. Ang kuwit at pagpapatuloy na “para sa” ay mas maingat at mas malapit sa estruktura ng pinagmulan.
