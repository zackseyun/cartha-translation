base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/023.yaml
  text: 'And on the fourth day: ten bulls, two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: tl
  text: 'At sa ikaapat na araw: sampung toro, dalawang lalaking tupa, at labing-apat na korderong isang taóng gulang na walang kapintasan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הָ/רְבִיעִי
  choice: At sa ikaapat na araw
  rationale: Pinananatili ng “At” ang pagkakaugnay sa sunod-sunod na tala ng mga handog, at likas sa modernong Tagalog ang temporal na pariralang “sa ikaapat na araw.”
- source_word: פָּרִים עֲשָׂרָה
  choice: sampung toro
  rationale: Sa konteksto ng paghahandog, ang פָּרִים ay mga toro; tuwirang isinasaad ng עֲשָׂרָה ang bilang na sampu.
- source_word: אֵילִם שְׁנָיִם
  choice: dalawang lalaking tupa
  rationale: Ang אֵילִם ay tumutukoy sa mga ram. Mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa hiram o teknikal na katawagan.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: labing-apat na kordero
  rationale: Ang כְּבָשִׂים ay mga batang tupa o kordero, at ang kasunod na bilang ay labing-apat.
- source_word: בְּנֵי שָׁנָה
  choice: isang taóng gulang
  rationale: Natural at tumpak na Tagalog ito para sa Hebreong idyomang tumutukoy sa mga hayop na isang taon ang edad.
- source_word: תְּמִימִם
  choice: walang kapintasan
  rationale: Sa batas tungkol sa paghahandog, inilalarawan nito ang mga hayop na walang depekto; ang “walang kapintasan” ay malinaw at dignified na katumbas.
