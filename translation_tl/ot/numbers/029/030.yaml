base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: tl
  text: pati ang kanilang handog na butil at mga handog na inumin para sa mga toro, mga lalaking tupa, at mga kordero, ayon sa bilang ng mga iyon at ayon sa itinakdang tuntunin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa itinakdang paraan.” Ang salitang Hebreo ay tumutukoy sa umiiral na tuntunin kung paano dapat ihandog ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ang handog na butil
  rationale: Sa konteksto ng paghahandog, ang מִנְחָה ay tumutukoy sa handog na mula sa butil; pinanatili ang kolektibong anyong isahan.
- source_word: נִסְכֵּיהֶם
  choice: mga handog na inumin
  rationale: Ang נֶסֶךְ ay inuming ibinubuhos bilang handog; malinaw at likas sa modernong Filipino ang pariralang ito.
- source_word: לַפָּרִים
  choice: para sa mga toro
  rationale: Ang פַּר ay karaniwang tumutukoy sa toro sa mga talaan ng handog, at hindi tahasang tinutukoy rito ang edad.
- source_word: לָאֵילִם
  choice: mga lalaking tupa
  rationale: Ang אַיִל ay partikular na lalaking tupa; mas madaling maunawaan ito kaysa sa hiram na terminong maaaring hindi pamilyar sa lahat ng mambabasa.
- source_word: וְלַכְּבָשִׂים
  choice: at mga kordero
  rationale: Ang כֶּבֶשׂ ay kordero; hindi dinagdagan ng pagtukoy sa kasarian dahil hindi iyon kailangang idiin sa talata.
- source_word: בְּמִסְפָּרָם
  choice: ayon sa bilang ng mga iyon
  rationale: Ipinahahayag nito na ang mga kasamang handog ay dapat tumugma sa itinakdang bilang ng mga hayop.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa itinakdang tuntunin
  rationale: Dito ang מִשְׁפָּט ay ang umiiral na legal at ritwal na tuntunin kung paano ihahandog ang mga ito.
