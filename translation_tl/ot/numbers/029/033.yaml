base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: tl
  text: at ang kanilang handog na butil at mga handog na inumin para sa mga toro, mga lalaking tupa, at mga batang tupa, ayon sa bilang ng mga ito, ayon sa itinakdang tuntunin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ang handog nilang pagkaing butil
  rationale: Sa konteksto ng paghahandog, ang מִנְחָה ay handog na yari sa butil. Pinanatili ang kolektibong pang-isahan ng Hebreo sa natural na Tagalog.
- source_word: נִסְכֵּיהֶם
  choice: ang kanilang mga handog na inumin
  rationale: Ang נֶסֶךְ ay inuming ibinubuhos bilang handog; ipinahayag ang maramihan ng anyong Hebreo.
- source_word: לַפָּרִים
  choice: para sa mga toro
  rationale: Tuwirang katawagan ito sa mga toro sa talaan ng mga hayop na inihahandog; hindi idinagdag ang ideyang 'bata' na hindi tahasang sinasabi rito.
- source_word: לָאֵילִם
  choice: mga lalaking tupa
  rationale: Ang אַיִל sa kontekstong ito ay ram; malinaw at karaniwang-unawa ang 'lalaking tupa' sa modernong Tagalog.
- source_word: וְלַכְּבָשִׂים
  choice: at mga batang tupa
  rationale: Ang כֶּבֶשׂ ay batang tupa; hindi labis na tinukoy ang kasarian sapagkat hindi iyon kailangang ipahayag sa salin dito.
- source_word: בְּמִסְפָּרָם
  choice: ayon sa bilang ng mga ito
  rationale: Ipinahahayag nito na ang mga kasamang handog ay umaayon sa nakatalang bilang ng mga hayop.
- source_word: כְּמִשְׁפָּטָם
  choice: sa tuntuning itinakda para sa mga ito
  rationale: Ang מִשְׁפָּט dito ay ang itinakdang tuntunin o pamamaraan para sa mga handog. Ang parirala ay natural sa Tagalog at pinananatili ang panghalip na hulapi sa Hebreo nang hindi ipinapalagay na ang mga hayop mismo ang nagmamay-ari ng tuntunin.
theological_decisions:
- issue: Ang tinutukoy ng hulaping maramihan sa כְּמִשְׁפָּטָם
  choice: tuntuning itinakda para sa mga ito
  alternative: ayon sa itinakdang tuntunin
  rationale: Maaaring unawain ang hulapi bilang pagtukoy sa mga handog o hayop na saklaw ng tuntunin. Pinanatili ito sa pangunahing teksto at inilagay sa talababa ang mas pangkalahatang salin upang hindi sapilitang lutasin ang sanggunian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong panritwal—“handog na pagkaing butil” at “handog na inumin”—habang iniwasan ang labis na teknikal o makalumang pananalita.
