  naturalness: Nauunawaan ang draft, ngunit medyo mabigat ang “handog nilang pagkaing butil” at ang pag-uulit ng “para sa mga ito.” Mas likas ang tuwirang ayos na “ang kanilang handog na butil at mga handog na inumin.”
  terminology: Ginamit ang “handog na butil” para sa מִנְחָה at “mga handog na inumin” para sa נְסָכִים. Ang “lalaking tupa” at “batang tupa” ay malinaw na modernong Filipino para sa mga hayop na tinutukoy.
