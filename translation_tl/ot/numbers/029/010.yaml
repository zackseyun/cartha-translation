translation:
  language: tl
  text: ikasampung bahagi para sa bawat kordero[a], para sa pitong kordero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ikasampung bahagi, ikasampung bahagi.” Sa konteksto ng mga handog, tumutukoy ito sa tig-isang ikasampu ng isang efa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: ikasampung bahagi
  rationale: 'Ang inuulit na pangngalan ay may distributibong diwa: tig-isang ikasampung sukat. Hindi isinama sa pangunahing teksto ang “ng isang efa” dahil hindi ito tahasang nasa talata; ipinaliwanag ito sa talababa ayon sa konteksto ng handog na pagkaing butil.'
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para sa bawat isang kordero
  rationale: Literal itong “para sa isang kordero,” ngunit sa talaan ng mga handog ay distributibo ang diwa. Likas na ipinahahayag ng “bawat isang kordero” ang sukat na nauukol sa bawat hayop.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: para sa pitong kordero
  rationale: Tinutukoy nito ang buong pangkat ng pitong korderong binanggit sa naunang talata at pinananatili ang pag-uulit ng pinag-uukulan ng sukat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “kordero” bilang karaniwang katawagan sa batang tupa sa kontekstong pansakripisyo. Pinanatili ang maikli at pormulang anyo ng Hebreo, pati ang distributibong pag-uulit.
