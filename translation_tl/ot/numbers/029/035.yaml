  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: tl
  text: Sa ikawalong araw, magkakaroon kayo ng taimtim na pagtitipon[a]; huwag kayong gagawa ng anumang karaniwang trabaho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pangwakas na pagtitipon.” Ang Hebreong עֲצֶרֶת ay maaaring tumukoy sa pagtitipong nagtatapos sa isang kapistahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Sa ikawalong araw
  rationale: Likas at tuwirang salin ng tiyak na pariralang temporal; hindi idinaragdag sa teksto ang “ng kapistahan.”
- source_word: עֲצֶרֶת
  choice: isang banal na pagtitipon
  rationale: Ipinahahayag ang sagradong katangian ng kapulungang pangkapistahan sa malinaw na modernong Tagalog, habang inilalagay sa talababa ang posibleng diwang pangwakas.
- source_word: תִּהְיֶה לָכֶם
  choice: magkakaroon kayo ng
  rationale: Natural na Tagalog para sa literal na “magiging para sa inyo,” na may eksistensiyal o posesibong diwa.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: anumang karaniwang trabaho
  rationale: Tumutukoy ang tambalan sa karaniwang gawaing hanapbuhay na ipinagbabawal sa banal na araw, hindi sa ganap na pagbabawal sa lahat ng kilos. Iniiwasan din nito ang posibleng maling pakahulugan ng “mabigat na trabaho” bilang pisikal na pagpapagal lamang.
- source_word: לֹא תַעֲשׂוּ
  choice: huwag kayong gagawa ng
  rationale: Malinaw at marangal na anyo ng utos para sa ikalawang panauhang maramihan.
theological_decisions:
- issue: Kahulugan ng terminong pangkapistahan na עֲצֶרֶת
  choice: “banal na pagtitipon” sa pangunahing teksto
  alternative: “pangwakas na pagtitipon”
  rationale: Maaaring tumukoy ang salita sa sagradong kapulungan at, sa kontekstong ito, sa pagtitipong nagtatapos sa kapistahan. Hindi sapilitang nilulutas ng pangunahing teksto ang dalawang diin; pinananatili sa talababa ang tunay na leksikal na alternatibo nang walang pag-angkat ng partikular na tradisyong liturhiko.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong pambatas. Ginamit ang “kayo” upang panatilihin ang maramihang kausap at ang “karaniwang trabaho” upang malinaw na tukuyin ang gawaing pang-araw-araw o panghanapbuhay.
