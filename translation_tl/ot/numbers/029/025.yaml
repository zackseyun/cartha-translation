  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: tl
  text: at isang lalaking kambing bilang handog para sa kasalanan, bukod pa sa regular na handog na sinusunog, kasama ang handog na butil at handog na inumin nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, patuloy na handog na sinusunog.
    reason: Pinananatili ang posibleng diin ng תָּמִיד sa pagpapatuloy, bukod sa kahulugan nitong regular o palagian.
lexical_decisions:
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: at isang lalaking kambing
  rationale: Ang pariralang שְׂעִיר עִזִּים ay karaniwang katawagan sa lalaking kambing sa konteksto ng paghahandog; malinaw at natural sa modernong Filipino ang “lalaking kambing.”
- source_word: חַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong panghain, tumutukoy ito sa mismong handog, hindi lamang sa abstraktong kasalanan.
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Ipinapakita nitong karagdagan ang handog na ito sa palagiang itinakdang handog.
- source_word: עֹלַת הַתָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Ipinahihiwatig ng תָּמִיד ang regular at nagpapatuloy na paghahandog; pinananatili ng “palagian” ang saklaw nito nang hindi ito nililimitahan sa salitang “araw-araw.”
- source_word: מִנְחָתָהּ
  choice: handog na butil nito
  rationale: Sa mga talaan ng paghahandog, ang מִנְחָה ay ang kasamang handog na butil; tumutukoy ang hulaping pambabae sa handog na sinusunog.
- source_word: וְנִסְכָּהּ
  choice: at sa handog na inumin nito
  rationale: Ang נֶסֶךְ ay inuming ibinubuhos bilang handog; mas madaling maunawaan ang “handog na inumin” kaysa sa teknikal na “libasyon.”
