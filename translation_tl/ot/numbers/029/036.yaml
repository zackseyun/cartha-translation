  terminology: Ang “handog na sinusunog,” “kalugod-lugod na samyo,” “toro,” “lalaking tupa,” “kordero,” at “walang kapintasan” ay angkop. Pinananatili ang “Yahweh” alinsunod sa ibinigay na desisyong pangterminolohiya.
