  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: tl
  text: 'At maghahandog kayo ng handog na sinusunog, isang handog na iniaalay sa pamamagitan ng apoy, na may kalugod-lugod na samyo[a] para kay Yahweh: isang toro, isang lalaking tupa, at pitong korderong isang taóng gulang, na walang kapintasan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “samyo ng kapahingahan.” Isa itong takdang pananalita sa paghahandog para sa handog na katanggap-tanggap sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: maghahandog kayo
  rationale: Ang Hifil ng קרב sa kontekstong pansakripisyo ay nangangahulugang magharap o maghandog. Ang “maghahandog kayo” ay natural sa Tagalog at malinaw na naghahatid ng ritwal na diwa.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Tumutukoy ito sa handog na lubusang sinusunog. Ang pariralang ito ay malinaw at nauunawaan ng karaniwang mambabasa.
- source_word: אִשֵּׁה
  choice: handog na pinaraan sa apoy
  rationale: Ipinahihiwatig ng salita ang handog na iniaalay sa pamamagitan ng apoy. Iniiwasan ng saling ito ang labis na pagpapakahulugang “pagkaing handog.”
- source_word: רֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  rationale: Isa itong nakapirming pananalita sa kontekstong pansakripisyo na nagpapahayag na ang handog ay katanggap-tanggap sa Diyos. Natural at marangal sa modernong Tagalog ang “kalugod-lugod na samyo.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang ל ay nagpapakitang ang handog ay iniuukol kay Yahweh, at ang pangalan ng Diyos na יהוה ay pinanatili bilang “Yahweh.”
- source_word: פַּר אֶחָד
  choice: isang toro
  rationale: Ang פַּר ay toro mula sa bakahan; hindi hinihingi ng konteksto na idagdag ang “batang.”
- source_word: אַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Ang אַיִל ay tiyak na tumutukoy sa ram; ang “lalaking tupa” ang malinaw na karaniwang katumbas sa Tagalog.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: pitong korderong tig-iisang taóng gulang
  rationale: Ang idyomang “mga anak ng isang taon” ay likas na isinalin bilang tig-iisang taóng gulang. Hindi idinagdag ang kasarian sapagkat hindi ito tahasang hinihingi ng anyo ng pangngalan dito.
- source_word: תְּמִימִם
  choice: walang kapintasan
  rationale: Sa paghahandog, tumutukoy ito sa mga hayop na walang depekto; ang “walang kapintasan” ay malinaw at tumpak sa ritwal na konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng רֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  alternative: samyo ng kapahingahan
  rationale: Pinananatili ng pangunahing salin ang idyomatikong diwa ng handog na katanggap-tanggap sa Diyos, samantalang itinatala sa talababa ang mas literal na larawan nang hindi ipinapalagay na kailangang payapain o pakalmahin ang Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkahiwalay na mga katawagang pansakripisyo para sa עֹלָה at אִשֵּׁה, at iniwasan ang arkaikong bokabularyo. Inilagay ang talababa sa pariralang רֵיחַ נִיחֹחַ na talagang tinutukoy nito.
