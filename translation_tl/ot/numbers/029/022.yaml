base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/022.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: tl
  text: at isang lalaking kambing bilang handog para sa kasalanan, bukod pa sa palagiang handog na sinusunog[a] at sa handog na butil at handog na inumin na kasama nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tuluy-tuloy na handog na sinusunog.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “at ang handog na butil nito at ang handog na inumin nito”; tumutukoy ang “nito” sa palagiang handog na sinusunog.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: at isang lalaking kambing
  rationale: Ang שָׂעִיר ay tumutukoy sa lalaking kambing; pinananatili rin ng “at” ang pang-ugnay na וּ at ng “isang” ang bilang na kasunod sa Hebreo.
- source_word: חַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, ang חַטָּאת ay pangalan ng handog para sa kasalanan, hindi lamang ng abstraktong kasalanan.
- source_word: אֶחָד
  choice: isang
  rationale: Hayagang pinananatili ang bilang ng hayop na ihahandog.
- source_word: מִ/לְּ/בַד
  choice: bukod pa sa
  rationale: Ipinahihiwatig ng parirala na ang handog na ito ay karagdagan sa palagiang handog at mga kasamang handog nito.
- source_word: עֹלַת
  choice: handog na sinusunog
  rationale: Ito ang malinaw at likas na salin sa modernong Filipino para sa takdang handog na lubusang sinusunog.
- source_word: הַ/תָּמִיד
  choice: palagian
  rationale: Tumutukoy ito sa handog na regular at patuloy na inihahandog; pinananatili sa talababa ang alternatibong “tuluy-tuloy.”
- source_word: וּ/מִנְחָתָהּ
  choice: at sa handog na butil na kasama nito
  rationale: Sa kontekstong ito, ang מִנְחָה ay handog na butil. Ang hulaping pambabae ay tumutukoy pabalik sa עֹלָה, kaya nilinaw na kasama ito ng palagiang handog na sinusunog.
- source_word: וְ/נִסְכָּהּ
  choice: at handog na inumin na kasama nito
  rationale: Ang נֶסֶךְ ay ibinubuhos na kasamang handog; ang “handog na inumin” ay mas madaling maunawaan kaysa “libasyon.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa wikang pansamba. Ginamit ang mga karaniwang terminong pansakripisyo at nilinaw sa pangungusap ang tinutukoy ng mga hulaping panghalip sa Hebreo nang hindi binabago ang ugnayan ng mga handog.
