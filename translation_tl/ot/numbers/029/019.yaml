  text: at isang lalaking kambing bilang handog para sa kasalanan, bukod pa sa palagiang handog na sinusunog[a], handog na butil nito, at mga handog na inumin ng mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “patuloy na handog na sinusunog.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kanilang mga handog na inumin”; malamang na tumutukoy ang pangmaramihan sa mga handog na inumin na kasama ng kabuuan ng mga itinakdang handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: at isang lalaking kambing
  rationale: Ang שְׂעִיר עִזִּים ay karaniwang katawagan sa lalaking kambing na inihahandog, at malinaw na tinutukoy ng אֶחָד ang bilang na isa.
- source_word: חַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong panghandog, tumutukoy ito sa uri ng handog, hindi lamang sa abstraktong kasalanan.
- source_word: מִ/לְּ/בַד
  choice: bukod pa sa
  rationale: Ipinakikitang idinaragdag ang handog na ito sa nakatakdang palagiang handog.
- source_word: עֹלַת הַ/תָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Ipinahahayag ng תָּמִיד ang regular at patuloy na nakatakdang pag-aalay; likas at malinaw sa Filipino ang “palagiang.”
- source_word: וּ/מִנְחָתָ/הּ
  choice: sa handog na butil nito
  rationale: Sa batas tungkol sa paghahandog, ang מִנְחָה ay karaniwang handog na butil; ang hulaping pambabaeng isahan ay tumutukoy sa handog na sinusunog.
- source_word: וְ/נִסְכֵּי/הֶם
  choice: at sa mga handog na inumin ng mga iyon
  rationale: Pinananatili ang pangmaramihang anyo ng pangngalan at hulapi sa Hebreo, kahit maaaring tumukoy ang mga iyon sa kabuuan ng mga itinakdang handog.
