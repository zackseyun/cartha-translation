  yaml_path: translation/ot/numbers/029/034.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: tl
  text: at isang lalaking kambing bilang handog para sa kasalanan[a], bukod pa sa palagiang handog na sinusunog[b], kasama ang handog na pagkaing butil at handog na inumin para rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang kambing bilang handog para sa kasalanan.” Gayunman, tiyak na lalaking kambing ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “palagian” ay salin ng terminong Hebreo para sa patuloy at paulit-ulit na itinakdang handog; maaari rin itong isaling “araw-araw” o “patuloy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: at isang lalaking kambing
  rationale: Ang שְׂעִיר ay lalaking kambing sa kontekstong paghahandog, at ang אֶחָד ay tahasang nagsasaad ng bilang na isa. Pinananatili ng “at” ang pagpapatuloy ng talaan.
- source_word: חַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong pangsakripisyo, tumutukoy ito sa isang uri ng handog, hindi lamang sa abstraktong kasalanan.
- source_word: מִ/לְּ/בַד
  choice: bukod pa sa
  rationale: Malinaw nitong ipinahihiwatig na karagdagan ang nabanggit na handog sa palagiang handog.
- source_word: עֹלַת הַ/תָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Ang עֹלָה ay handog na sinusunog, at ang תָּמִיד ay nagsasaad ng patuloy at paulit-ulit na itinakdang paghahandog.
- source_word: מִנְחָתָ/הּ
  choice: handog na pagkaing butil para rito
  rationale: Sa ritwal na konteksto, ang מִנְחָה ay handog na butil. Ang hulaping pambabae ay tumutukoy sa עֹלָה; ginawang “para rito” upang maging likas at malinaw sa Filipino.
- source_word: וְ/נִסְכָּ/הּ
  choice: at handog na inumin para rito
  rationale: Ang נֶסֶךְ ay inuming ibinubuhos bilang handog. Ang “handog na inumin” ay mas madaling maunawaan kaysa sa teknikal na “libasyon.”
