  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: tl
  text: at isang lalaking kambing bilang handog para sa kasalanan, bukod pa sa palagiang handog na sinusunog, sa handog nitong butil, at sa handog nitong inumin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: at isang lalaking kambing
  rationale: Sa kontekstong pansakripisyo, ang שׂעִיר ay tumutukoy sa kambing na lalaki; malinaw at natural itong ipinahayag sa Tagalog.
- source_word: חַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, tumutukoy ito sa isang uri ng handog, hindi lamang sa abstraktong kasalanan.
- source_word: אֶחָד
  choice: isang
  rationale: Tuwirang ipinahahayag ang bilang ng hayop na ihahandog.
- source_word: מִ/לְּ/בַד
  choice: bukod pa sa
  rationale: Ipinakikitang karagdagan ang handog na ito sa dati nang itinakdang palagiang handog.
- source_word: עֹלַת הַ/תָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Pinananatili ang ideya ng עֹלָה bilang handog na sinusunog at ng תָּמִיד bilang regular o patuloy na inihahandog.
- source_word: וּ/מִנְחָתָ/הּ
  choice: at sa handog na butil ... na kasama nito
  rationale: Sa kontekstong pangsaserdote, ang מִנְחָה ay handog na butil; ang hulaping pambabae ay tumutukoy pabalik sa handog na sinusunog.
- source_word: וְ/נִסְכָּ/הּ
  choice: at handog na inumin na kasama nito
  rationale: Ang נֶסֶךְ ay likidong handog na kasama ng hain; ang hulapi ay tumutukoy rin sa handog na sinusunog.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “lalaking kambing” upang likas na maipahayag ang espesipikong kahulugan ng salitang Hebreo sa kontekstong pansakripisyo. Ang “na kasama nito” ay pinagsasaluhan ng dalawang kasamang handog upang maiwasan ang mabigat at paulit-ulit na pangungusap habang napapanatili ang reperensiya ng mga hulaping Hebreo.
