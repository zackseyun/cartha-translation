    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: tig-iisang ikasampung takal
  rationale: Ang inuulit na עִשָּׂרוֹן ay isang takal na ikasampung bahagi at may distributibong diwa. Ipinahahayag ito ng “tig-iisang” sa natural na Filipino. Hindi idinagdag sa pangunahing teksto ang “efa” dahil hindi ito tahasang binanggit sa talata.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para sa bawat kordero
  rationale: 'Bagaman literal na “para sa isang kordero,” distributibo ang gamit nito sa listahan: ang itinakdang dami ay para sa bawat hayop.'
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: sa labing-apat na kordero
  rationale: Tinutukoy nito ang buong pangkat ng labing-apat na kordero na saklaw ng tig-isang takal.
