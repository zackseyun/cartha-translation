  text: וּ/בַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ י֥וֹם תְּרוּעָ֖ה יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: tl
  text: At sa ikapitong buwan, sa unang araw ng buwan, magkakaroon kayo ng isang banal na pagtitipon. Huwag kayong gagawa ng anumang karaniwang gawain. Magiging araw ito ng malakas na tunog[a] para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “araw ng tunog ng trumpeta,” “araw ng sigaw,” o “araw ng pagbubunyi.” Ang Hebreong teruah ay tumutukoy sa isang malakas na tunog at, ayon sa konteksto, maaaring mangahulugan ng hudyat ng trumpeta, sigaw, o pagbubunyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הַ/שְּׁבִיעִי
  choice: At sa ikapitong buwan
  rationale: Pinananatili ng “At” ang sunod-sunod na estilong pambatas ng Hebreo, at likas na ipinahahayag ng “sa” ang panahong tinutukoy.
- source_word: בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: sa unang araw ng buwan
  rationale: Karaniwang pormulang pangkalendaryo ito sa Hebreo; nililinaw ng “araw” ang kahulugan para sa makabagong mambabasa.
- source_word: מִקְרָא קֹדֶשׁ
  choice: isang banal na pagtitipon
  rationale: Tumutukoy ito sa opisyal na ipinatawag na sagradong pagtitipon. Ang salin ay natural sa Filipino at pinananatili ang diwang panliturhiya.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: anumang karaniwang gawain
  rationale: Hindi nito ipinagbabawal ang lahat ng posibleng kilos, kundi ang karaniwang gawaing panghanapbuhay o paggawa na ipinagbabawal sa araw ng kapistahan.
- source_word: לֹא תַעֲשׂוּ
  choice: Huwag kayong gagawa
  rationale: Tuwirang utos na nagbabawal sa ikalawang panauhang maramihan, sa natural ngunit marangal na Filipino.
- source_word: יוֹם תְּרוּעָה
  choice: araw ng malakas na pagpapatunog
  rationale: Ang תְּרוּעָה ay malakas na tunog na maaaring tumukoy sa hudyat ng trumpeta, sigaw, o pagbubunyi. Hindi pinapangalanan ng Hebreo ang instrumento, kaya pinananatiling bahagyang bukas ang pangunahing salin at inilalagay sa talababa ang mahahalagang posibilidad.
- source_word: יִהְיֶה לָכֶם
  choice: Iyon ay magiging ... para sa inyo
  rationale: Ipinahahayag nito na ang araw ay itinakda para sa bayan sa gayong katangian; natural at malapit ito sa Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa katawagang pangkapistahan na יוֹם תְּרוּעָה
  choice: araw ng malakas na pagpapatunog
  alternative: araw ng pagpapatunog ng trumpeta; araw ng pagsigaw o pagbubunyi
  rationale: Pinapangalanan ang araw ayon sa natatanging malakas na tunog nito, hindi sa isang mas huling tradisyonal na pangalan. Dahil hindi tahasang binabanggit ng תְּרוּעָה ang instrumento at malawak ang saklaw ng kahulugan nito, hindi nilulutas nang tahimik ang tunay na leksikal na kalabuan; inilalahad ang mga posibilidad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang estilong pambatas ng talata nang hindi gumagamit ng lipas o labis na teknikal na pananalita. Ginamit ang “banal na pagtitipon” sa halip na mas teknikal na “banal na kapulungan,” at iniwasang tukuyin agad ang trumpeta sa pangunahing teksto upang mapanatili ang tunay na lawak ng תְּרוּעָה.
