  to: At sa ikapitong buwan, sa unang araw ng buwan, magkakaroon kayo ng isang banal na pagtitipon. Huwag kayong gagawa ng anumang karaniwang gawain. Magiging araw ito ng malakas na tunog[a] para sa inyo.
  rationale: Pinalitan ang “malakas na pagpapatunog” ng “malakas na tunog” upang maging natural at ganap ang Filipino, at upang mas tumpak na mapanatili ang malawak ngunit tiyak na saklaw ng teruah. Iningatan ng talababa ang mga pangunahing kontekstuwal na pagbasa, kabilang ang tunog ng trumpeta, sigaw, at pagbubunyi.
