base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/017.yaml
  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: tl
  text: 'At sa ikalawang araw: labindalawang toro mula sa kawan ng baka[a], dalawang lalaking tupa, at labing-apat na korderong isang taóng gulang na walang kapintasan,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “labindalawang toro, mga anak ng baka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: At sa ikalawang araw
  rationale: Pinananatili ng “At” ang pagpapatuloy ng talaan, at tuwirang isinasalin ng “ikalawang araw” ang ordinal na parirala.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: mga toro mula sa kawan
  rationale: Ang פָּרִים ay mga toro sa kontekstong panghandog; ang literal na “mga anak ng bakahan” ay idyomatikong tumutukoy sa mga hayop na mula sa kawan ng baka.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Tuwirang bilang na tumutukoy sa mga toro.
- source_word: אֵילִם שְׁנָיִם
  choice: dalawang lalaking tupa
  rationale: Ang אֵילִם ay mga adultong lalaking tupa; malinaw at natural sa modernong Filipino ang “lalaking tupa.”
- source_word: כְּבָשִׂים
  choice: mga kordero
  rationale: Karaniwang katawagan sa batang tupa sa talaan ng mga handog.
- source_word: בְּנֵי שָׁנָה
  choice: tig-iisang taóng gulang
  rationale: Ang literal na “mga anak ng isang taon” ay karaniwang idyoma para sa mga hayop na isang taon ang edad; ipinapakita ng “tig-iisa” na bawat kordero ay gayon ang edad.
- source_word: אַרְבָּעָה עָשָׂר
  choice: labing-apat
  rationale: Tuwirang bilang na tumutukoy sa mga kordero.
- source_word: תְּמִימִם
  choice: walang kapintasan
  rationale: Sa batas ukol sa paghahandog, tumutukoy ito sa mga hayop na walang depekto at karapat-dapat ihandog.
