base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/031.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: tl
  text: at isang lalaking kambing bilang handog para sa kasalanan, bukod pa sa palagiang handog na sinusunog[a], kasama ang handog na butil at mga handog na inumin[b] nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “patuloy na handog na sinusunog.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga handog na inumin” ay maaari ring tawaging “mga libasyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר
  choice: lalaking kambing
  rationale: Sa kontekstong panghandog, tumutukoy ito sa kambing na lalaki; malinaw at natural ang “lalaking kambing” sa makabagong Filipino.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Dito, ang salita ay tumutukoy sa handog na iniaalay kaugnay ng kasalanan, hindi sa abstraktong konsepto ng kasalanan.
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Ipinakikita nitong karagdagan ang handog na binanggit sa nakatakda at paulit-ulit na handog.
- source_word: עֹלַת הַתָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Pinananatili ng “palagiang” ang diwa ng regular at patuloy na itinakdang paghahandog, habang malinaw ang “handog na sinusunog.”
- source_word: מִנְחָתָהּ
  choice: handog na butil nito
  rationale: Sa talaan ng mga hain, ang מִנְחָה ay kasamang handog na mula sa butil; ang hulaping pambabae ay tumutukoy pabalik sa handog na sinusunog.
- source_word: וּנְסָכֶיהָ
  choice: at mga handog na inumin nito
  rationale: Ang נֶסֶךְ ay inuming ibinubuhos bilang handog. Mas madaling maunawaan ang “handog na inumin” kaysa sa teknikal na “libasyon,” at pinananatili ang anyong maramihan.
theological_decisions:
- issue: Paglalarawan sa חַטָּאת bilang isang uri ng handog
  choice: handog para sa kasalanan
  alternative: handog na panlinis
  rationale: Pinananatili ng salin ang malinaw na kaugnayan nito sa kasalanan nang hindi ipinapasok ang isang mas tiyak na interpretasyon tungkol sa eksaktong bisa ng ritwal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga karaniwang salitang panghandog at iniwasan ang labis na teknikal o makalumang bokabularyo. Itinama ang paglalagay ng mga panandang talababa ayon sa mismong salitang tinutukoy ng bawat paliwanag.
