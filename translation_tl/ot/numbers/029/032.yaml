  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: tl
  text: 'At sa ikapitong araw: pitong toro, dalawang lalaking tupa, at labing-apat na lalaking korderong isang taóng gulang, na walang kapintasan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang depekto.” Ang salitang Hebreo ay tumutukoy sa hayop na buo at walang pisikal na depekto para sa handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: At sa ikapitong araw
  rationale: Pinananatili ng “At” ang pagkakaugnay nito sa naunang pagkakasunod-sunod ng mga araw, habang ang “sa ikapitong araw” ay likas sa makabagong Filipino.
- source_word: פָּרִים שִׁבְעָה
  choice: pitong toro
  rationale: Sa konteksto ng paghahandog, ang פַּר ay tumutukoy sa toro; hindi tahasang isinasaad rito ang edad nito.
- source_word: אֵילִם שְׁנָיִם
  choice: dalawang lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa, kaya tahasang ipinahahayag ang kasarian upang maiba sa pangkalahatang “tupa.”
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: labing-apat na lalaking korderong tig-iisang taóng gulang
  rationale: Ang כֶּבֶשׂ ay lalaking batang tupa, at ang idyomang בְּנֵי שָׁנָה ay nangangahulugang isang taóng gulang. Ang “tig-iisang taóng gulang” ay malinaw na tumutukoy sa bawat isa sa labing-apat.
- source_word: תְּמִימִם
  choice: walang kapintasan
  rationale: Sa konteksto ng paghahandog, inilalarawan nito ang mga hayop na buo at walang pisikal na depektong makahahadlang sa pagiging handog.
theological_decisions:
- issue: Saklaw ng panghuling pang-uri na תְּמִימִם
  choice: Iniuugnay sa pinakamalapit na pangngalan, ang labing-apat na kordero, nang hindi tahasang pinalalawak sa lahat ng naunang hayop sa talaan.
  alternative: Basahing tumutukoy sa lahat ng toro, lalaking tupa, at kordero.
  rationale: Nasa hulihan ng parirala ang pang-uri at ang pinakamalapit nitong pangngalan ay “mga kordero.” Bagaman hinihingi rin sa mas malawak na konteksto na walang kapintasan ang mga handog, hindi tahasang nilulutas ng talatang ito lamang ang mas malawak na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na anyong talaan pagkatapos ng tutuldok, ayon sa maigsi at pormularyong estilo ng tekstong Hebreo.
