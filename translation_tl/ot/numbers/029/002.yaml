base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: tl
  text: 'At maghahandog kayo ng handog na sinusunog bilang kalugod-lugod na samyo[a] kay Yahweh: isang toro mula sa kawan, isang lalaking tupa, at pitong lalaking korderong tig-iisang taon, na walang kapintasan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakapapawing samyo” o “matamis na samyo.” Ang pariralang Hebreo ay isang nakapirming pormulang pansakripisyo na nagpapahiwatig na katanggap-tanggap ang handog kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: maghahandog kayo
  rationale: Bagaman literal na “gagawin ninyo,” sa kontekstong pansakripisyo kasama ng עֹלָה, natural itong nangangahulugang maghahain o maghahandog.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Tumutukoy ito sa handog na lubusang sinusunog; malinaw at likas sa modernong Filipino ang pariralang ito.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: bilang kalugod-lugod na samyo
  rationale: Pinananatili nito ang larawang pang-amoy at ang diwang katanggap-tanggap o nakalulugod ang handog, nang hindi labis na ipinapaliwanag sa pangunahing teksto.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יְהוָה bilang Yahweh; ang pang-ukol ay nagpapakitang sa kaniya inihahandog ang hain.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: isang toro
  rationale: Ang parirala ay tumutukoy sa isang torong mula sa bakahan. Sapat at natural sa Filipino ang “isang toro,” samantalang magiging mabigat at kalabisan dito ang literal na “anak ng bakahan.”
- source_word: אַיִל אֶחָד
  choice: isang barakong tupa
  rationale: Tiyak na tumutukoy ang אַיִל sa lalaking tupa; inihahayag ito nang malinaw sa karaniwang Filipino.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: pitong lalaking korderong tig-iisang taon
  rationale: Pinananatili ang bilang, kasarian, at edad ng mga kordero sa natural na ayos ng Filipino.
- source_word: תְּמִימִם
  choice: walang kapintasan
  rationale: Sa kontekstong pansakripisyo, nangangahulugan itong walang pisikal na depekto at angkop bilang handog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalang pantangi ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang tuwirang pagtukoy sa pangalan ng Diyos nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng לְרֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  alternative: samyo ng katiwasayan / mabangong samyo
  rationale: Isang nakapirming pormulang pansakripisyo ito na nagpapahiwatig na katanggap-tanggap ang handog kay Yahweh. Pinananatili ng salin ang konkretong talinghaga at hindi tahasang nilulutas ang buong teolohikal na pahiwatig nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang mga karaniwang terminong pansakripisyo nang hindi ginagawang labis na arkaiko ang pangungusap. Inilagay ang talababa upang luminaw na ang “walang kapintasan” ay sumasaklaw sa toro, barakong tupa, at mga kordero.
