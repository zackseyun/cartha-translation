translation:
  language: tl
  text: at tig-isang ikasampu para sa bawat isa sa pitong kordero[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang ikasampu”; sa konteksto ng mga handog, karaniwan itong nangangahulugang isang ikasampu ng isang efa.
    reason: cultural_note
lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: at tig-isang ikasampu
  rationale: Ang parirala ay literal na tumutukoy sa “isang ikasampu.” Ginamit ang “tig-” upang likas na maipahayag sa Tagalog ang pamamahaging sukat na inuukol sa bawat kordero, nang hindi idinaragdag sa pangunahing teksto ang yunit na hindi tahasang binanggit sa talata.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para sa bawat kordero
  rationale: Bagaman literal na “para sa isang kordero,” pamamahagi ang diwa nito sa listahan ng mga handog; malinaw at natural itong naipapahayag ng “para sa bawat kordero.”
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: sa pitong kordero
  rationale: Tinutukoy nito ang buong pangkat ng pitong kordero na saklaw ng sukat para sa bawat isa. Hindi kailangan sa natural na Tagalog ang hiwalay na pantukoy upang maipakita ang pagiging tiyak ng pangkat sa konteksto.
