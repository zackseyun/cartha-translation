base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: tl
  text: at isang lalaking kambing bilang handog para sa kasalanan[a], bukod pa sa handog para sa kasalanan ukol sa pagtubos[b], kasama ang handog na butil nito, at ang palagiang handog na sinusunog kasama ang mga handog na inumin ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Gayundin sa ikalawang paglitaw ng “handog para sa kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: Pangmaramihan ang anyo ng salitang Hebreo na isinaling “pagtubos”; sa kontekstong ito, maaari itong tumukoy sa ritwal ng Araw ng Pagtubos.
    reason: source_ambiguity
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Malinaw at natural na ipinapahayag nito ang uri at kasarian ng hayop na ihahandog nang hindi ginagaya ang alanganing literal na anyo ng Hebreo.
- source_word: אֶחָד
  choice: isang
  rationale: Pinananatili ang tiyak na bilang ng hayop.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Sa talaan ng mga hain, tumutukoy ang pangngalan sa handog at hindi lamang sa kasalanan bilang abstraktong diwa. Karaniwan at madaling maunawaan ang pariralang ito; inilalagay sa talababa ang posibleng 'handog para sa paglilinis.'
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Likas na ipinakikitang karagdagan ang handog na ito sa iba pang itinakdang handog.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: handog para sa kasalanan ukol sa pagtubos
  rationale: Pinananatili ang ugnayan ng handog at ng ritwal ng pagtubos nang hindi tahasang nililimitahan ang parirala sa isang pagpapakahulugan lamang.
- source_word: עֹלַת הַתָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Ipinahahayag ng 'palagian' ang regular o patuloy na pag-uulit ng itinakdang handog; malinaw sa karaniwang mambabasa ang 'handog na sinusunog.'
- source_word: מִנְחָתָהּ
  choice: handog na butil nito
  rationale: Sa kontekstong pansakripisyo, ang מִנְחָה ay handog na butil. Pinananatili ng 'nito' ang pambabaeng isahang hulapi na tumutukoy sa handog na sinusunog.
- source_word: נִסְכֵּיהֶם
  choice: mga handog na inumin ng mga iyon
  rationale: Pinananatili ang pangmaramihang anyo ng pangngalan at ng hulapi. Ang 'mga iyon' ay hindi tahasang nagpapasiya kung aling kabuuan ng naunang mga handog ang saklaw.
theological_decisions:
- issue: Kahulugang pansakripisyo ng חַטָּאת
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Itinatanghal ng talata ang isang listahan ng mga hain. Ang tradisyonal na katawagan ay malinaw at hindi nagpapasiya laban sa tungkulin nitong maglinis, kaya inilalahad ang alternatibo sa talababa.
- issue: Pagpapakahulugan sa הַכִּפֻּרִים
  choice: ukol sa pagtubos
  alternative: ukol sa mga pagtubos; handog sa Araw ng Pagtubos
  rationale: Ang anyong Hebreo ay pangmaramihan ngunit maaaring maging nakapirming katawagang kultiko. Hindi isiningit sa pangunahing teksto ang 'Araw' upang hindi lumampas sa mismong parirala, bagaman ipinahihiwatig iyon ng konteksto.
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinili ang mga katawagang madaling maunawaan—“handog na sinusunog,” “handog na butil,” at “handog na inumin”—habang pinananatili ang teknikal na katangian ng talaang pansakripisyo at ang mga tunay na kalabuan ng mga hulapi at katawagang Hebreo.
