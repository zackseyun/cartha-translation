base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: tl
  text: 'At sa ikatlong araw: labing-isang toro, dalawang lalaking tupa, labing-apat na korderong isang taong gulang na walang kapintasan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁלִישִׁי
  choice: At sa ikatlong araw
  rationale: Pinananatili ng “At” ang koordinasyong Hebreo sa sunod-sunod na talaan, at likas sa Tagalog ang “sa ikatlong araw.”
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: labing-isang toro
  rationale: Ang פָּרִים ay tumutukoy sa mga toro sa konteksto ng paghahandog; hindi tahasang isinasaad rito ng Hebreo na bata pa ang mga ito.
- source_word: אֵילִם שְׁנָיִם
  choice: dalawang lalaking tupa
  rationale: Ang אֵילִם ay mga adultong lalaking tupa; malinaw at pangkaraniwan sa modernong Filipino ang “lalaking tupa.”
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: labing-apat na korderong tig-iisang taóng gulang
  rationale: Ang כְּבָשִׂים ay mga kordero, at ang idyomang בְּנֵי שָׁנָה ay nangangahulugang isang taóng gulang. Nililinaw ng “tig-iisang” na ang edad ay para sa bawat kordero.
- source_word: תְּמִימִם
  choice: na pawang walang kapintasan
  rationale: Sa batas tungkol sa paghahandog, inilalarawan nito ang mga hayop na walang depekto. Ang “pawang” ay nagpapakitang tumutukoy ang pangmaramihang pang-uri sa lahat ng nabanggit na hayop.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at angkop sa isang talaan ng mga handog. Ginamit ang “lalaking tupa” sa halip na mas teknikal o di-gaanong pamilyar na katawagan, at pinanatili ang colon upang ipakilala ang listahan.
