translation_notes:
  register: Makabagong Filipino na may dignidad at angkop sa tekstong panritwal. Ginamit ang “tuntunin” sa halip na mas teknikal o makalumang katawagan, habang inilagay sa talababa ang posibleng diin sa itinakdang pamamaraan.
