translation:
  language: tl
  text: Kasama ang kanilang handog na butil at mga handog na inumin para sa mga toro, mga lalaking tupa, at mga batang tupa, ayon sa bilang ng mga hayop, ayon sa itinakdang tuntunin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ayon sa itinakdang paraan.” Ang Hebreong כַּמִּשְׁפָּט ay tumutukoy sa itinatag na tuntunin o pamamaraan para sa mga handog na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ang handog nilang butil
  rationale: Sa konteksto ng paghahandog, ang מִנְחָה ay handog na butil na kalakip ng handog na sinusunog. Pinananatili rin ng “nilang” ang panghalip na hulapi sa Hebreo.
- source_word: נִסְכֵּיהֶם
  choice: ang mga handog nilang inumin
  rationale: Ang נֶסֶךְ ay likidong handog na ibinubuhos. Ang “handog na inumin” ay malinaw at karaniwang katawagan sa makabagong Tagalog, at ipinapakita ng maramihan ang anyong Hebreo.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: para sa mga toro, mga lalaking tupa, at mga batang tupa
  rationale: Ang לְ ay tumutukoy sa kaukulang handog na kasama ng bawat uri ng hayop. Nililinaw ng “lalaking tupa” ang אֵיל at ipinagkaiba ito sa “batang tupa” para sa כֶּבֶשׂ.
- source_word: בְּמִסְפָּרָם
  choice: ayon sa bilang ng mga ito
  rationale: Ipinahihiwatig ng parirala na ang dami ng mga kalakip na handog ay naaayon sa bilang ng mga hayop. Nililinaw ng “mga ito” ang tinutukoy nang hindi nagdaragdag ng bagong diwa.
- source_word: כַּמִּשְׁפָּט
  choice: sa itinakdang tuntunin
  rationale: Dito, ang מִשְׁפָּט ay tumutukoy sa umiiral at itinakdang tuntunin o pamamaraan para sa mga handog. Ang salin ay nagpapanatili ng pormal na diwang legal at panritwal.
- source_word: וּ
  choice: kasama
  rationale: Nakadepende ang talata sa listahan ng mga handog sa naunang talata. Ang “kasama” ay likas na nagpapahayag na kalakip ng mga hayop ang mga handog na butil at inumin.
