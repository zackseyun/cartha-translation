  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: tl
  text: 'At maghahandog kayo ng handog na sinusunog, isang handog na inihahain sa apoy, na may samyong kalugod-lugod[a] kay Yahweh: labintatlong toro mula sa bakahan, dalawang lalaking tupa, at labing-apat na lalaking korderong tig-iisang taóng gulang. Dapat walang kapintasan ang mga ito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakapapayapang samyo” o “matamis na samyo.” Ang idyomang Hebreo ay nagpapahayag na ang handog ay katanggap-tanggap kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: maghahandog kayo
  rationale: Sa konteksto ng paghahain, ang Hiphil ng קרב ay tumutukoy sa pagdadala o paghahandog ng alay. Likas at malinaw sa Filipino ang “maghahandog.”
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Tumutukoy ito sa handog na lubusang sinusunog. Pinananatili ng salin ang kinikilalang uri ng handog nang hindi gumagamit ng malabong literal na “handog na umaakyat.”
- source_word: אִשֵּׁה
  choice: handog na pinaraan sa apoy
  rationale: Ipinahahayag nito na ang handog ay inihahain sa pamamagitan ng apoy, habang iniiwasang ipakahulugan ito bilang ibang hiwalay na uri ng handog.
- source_word: רֵיחַ נִיחֹחַ
  choice: samyong kalugod-lugod
  rationale: Likas na ipinahahayag sa Filipino ang idyomang nagsasaad na katanggap-tanggap kay Yahweh ang handog, habang pinananatili ang larawan ng samyo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: פָּרִים בְּנֵי בָקָר
  choice: mga toro mula sa bakahan
  rationale: Pinananatili nito ang uri ng hayop at ang kaugnayan nito sa bakahan nang hindi ipinapalagay na ang mga toro ay bata pa.
- source_word: אֵילִם
  choice: mga lalaking tupa
  rationale: Karaniwang salin ito ng mga lalaking tupa na tinutukoy sa listahan ng mga hain.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: mga lalaking korderong tig-iisang taóng gulang
  rationale: Pinananatili ang tiyak na kasarian ng כְּבָשִׂים at ang edad ng bawat kordero.
- source_word: תְּמִימִם
  choice: walang kapintasan
  rationale: Sa konteksto ng paghahain, nangangahulugan itong walang pisikal na depekto ang mga hayop.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng Hebreo ang mismong Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng רֵיחַ נִיחֹחַ
  choice: samyong kalugod-lugod
  alternative: nakapapayapang samyo
  rationale: Pinananatili ang metapora ng samyo at ang diwang katanggap-tanggap ang handog, nang hindi ipinahihiwatig na awtomatikong pinapawi ng hain ang galit ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tig-iisang taóng gulang” upang luminaw na ang edad ay para sa bawat isa sa labing-apat na kordero. Inilagay ang talababa sa pariralang “samyong kalugod-lugod,” na siyang aktuwal na tinatalakay nito.
