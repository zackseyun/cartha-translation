  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: tl
  text: 'Maghahandog kayo kay Yahweh ng handog na sinusunog, isang kalugod-lugod na samyo[a]: isang toro mula sa kawan, isang lalaking tupa, at pitong lalaking korderong tig-iisang taóng gulang. Dapat ay walang kapintasan ang mga ito para sa inyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “samyo na nagbibigay-ginhawa.” Ang pariralang Hebreo ay isang nakaugaliang pananalita tungkol sa handog na katanggap-tanggap kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Maghahandog kayo
  rationale: Ang Hiphil ng קרב sa kontekstong pansakripisyo ay nangangahulugang magharap o maghandog; natural at malinaw sa modernong Tagalog ang “maghahandog.”
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Tumutukoy ito sa handog na lubusang sinusunog; malinaw ang pariralang ito sa karaniwang mambabasa at pinananatili ang uri ng hain.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang ל ay nagsasaad kung kanino iniaalay ang handog, at ang יהוה ay isinalin bilang pangalang Yahweh.
- source_word: רֵיחַ נִיחֹחַ
  choice: isang kalugod-lugod na samyo
  rationale: Pinananatili nito ang nakapirming metaporang pansakripisyo para sa handog na katanggap-tanggap sa Diyos, nang hindi ipinahihiwatig na literal lamang ang pandamang pang-amoy.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: isang toro mula sa bakahan
  rationale: Natural na Tagalog ito para sa idyomatikong Hebreong “isang toro, anak ng bakahan,” at pinananatili ang pinagmulan at uri ng hayop.
- source_word: אַיִל אֶחָד
  choice: isang lalaking tupa
  rationale: Karaniwang katumbas ng אַיִל ang adultong lalaking tupa; mas madaling maunawaan ito kaysa sa hiram na terminong maaaring hindi pamilyar sa lahat.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: pitong lalaking korderong tig-iisang taóng gulang
  rationale: Pinananatili ang panlalaking kasarian, bilang na pito, at ang idyomang tumutukoy sa edad na isang taon.
- source_word: תְּמִימִם
  choice: walang kapintasan
  rationale: Sa kontekstong pansakripisyo, tumutukoy ito sa mga hayop na walang depekto at angkop ihandog.
- source_word: יִהְיוּ לָכֶם
  choice: Dapat walang kapintasan ang mga ito
  rationale: Likas sa Tagalog ang obligasyong ipinapahayag ng Hebreo. Hindi isinama ang literal na “para sa inyo” dahil magiging alanganin at hindi nito babaguhin ang hinihinging kalagayan ng mga hayop.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng רֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  alternative: samyo na nagbibigay-ginhawa; nakalulugod na halimuyak
  rationale: Pinananatili ang tunay na larawang pansakripisyo at ang diwa ng pagtanggap ng Diyos, nang hindi labis na nilulutas kung ang diin ay “nakalulugod” o “nakapagpapaginhawa.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “handog na sinusunog” sa halip na mas teknikal o makalumang katawagan, at hinati sa dalawang pangungusap upang maging malinaw ang talaan at ang kahingian na walang kapintasan.
