  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: tl
  text: 'at ang handog na butil para sa mga ito: pinong harina na hinaluan ng langis—tatlong ikasampung sukat[a] para sa toro at dalawang ikasampung sukat para sa iisang lalaking tupa;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tatlong ikasampung sukat” at “dalawang ikasampung sukat” sa Hebreo ay tumutukoy sa mga sukat na ikasampu; ayon sa tradisyon, ang bawat isa ay ikasampu ng isang efa.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: at ang handog na butil na kasama ng mga iyon
  rationale: Sa kontekstong panghandog, ang מִנְחָה ay handog na butil. Ang hulaping maramihan ay tumutukoy sa mga hayop na inihandog; ginawang tahasang 'na kasama ng mga iyon' upang maging natural sa Filipino nang hindi ipinahihiwatig na pag-aari ng mga hayop ang handog.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Tumutukoy sa de-kalidad at pinong giniling na harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: na hinaluan ng langis
  rationale: Ang balarilang Hebreo ay naglalarawan sa harinang inihalo sa langis; ito ang natural at tumpak na pahayag sa modernong Filipino.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tatlong ikasampung takal
  rationale: Ang עִשָּׂרוֹן ay isang yunit na katumbas ng ikasampu ng isang efa. Pinananatili ng 'ikasampung takal' ang sinaunang paraan ng pagsukat, habang ipinaliliwanag sa talababa ang karaniwang pagkaunawa rito.
- source_word: לַפָּר
  choice: para sa toro
  rationale: Ang pangngalang may tiyak na pantukoy ay tumutukoy sa torong nabanggit sa talaan ng mga handog.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dalawang ikasampung takal
  rationale: Pareho itong yunit ng takal sa naunang parirala, kaya tahasang inulit ang 'takal' para sa kalinawan sa Filipino.
- source_word: לָאַיִל הָאֶחָד
  choice: para sa nag-iisang lalaking tupa
  rationale: Pinananatili ng 'nag-iisa' ang diin ng הָאֶחָד sa bilang, at nililinaw ng 'lalaking tupa' ang kahulugan ng אַיִל.
