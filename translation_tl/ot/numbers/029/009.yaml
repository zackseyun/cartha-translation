translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang 'handog na butil,' 'pinong harina,' at 'langis' bilang malinaw na bokabularyong pangritwal. Pinanatili ang pagkakaugnay ng talata sa nauna sa pamamagitan ng panimulang 'at' at ang bantas na tuldok-kuwit dahil nagpapatuloy ang talaan.
