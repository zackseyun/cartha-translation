  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: tl
  text: at isang lalaking kambing bilang handog para sa kasalanan[a], bukod pa sa palagiang handog na sinusunog at sa handog nitong butil at handog nitong inumin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: lalaking kambing
  rationale: Tinutukoy ng pariralang Hebreo ang isang kambing na lalaki para sa paghahandog; malinaw at natural ito sa makabagong Filipino.
- source_word: אֶחָד
  choice: isang
  rationale: Tuwirang ipinapahayag ang bilang ng hayop na ihahandog.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Sa kontekstong panghandog, tumutukoy ito sa uri ng handog, hindi lamang sa abstraktong kasalanan. Pinananatili ng salin ang kinagawiang katawagan habang inilalagay sa talababa ang posibleng ritwal na diwa ng paglilinis.
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Ipinakikitang dagdag ang handog na ito sa palagiang itinakdang handog.
- source_word: עֹלַת הַתָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Ipinahahayag ang regular at paulit-ulit na katangian ng handog habang ginagamit ang malinaw na katawagang Filipino para sa burnt offering.
- source_word: מִנְחָתָהּ
  choice: handog na butil para rito
  rationale: Sa kontekstong ritwal, ang מִנְחָה ay handog na butil. Ang hulaping pambabae ay tumutukoy pabalik sa handog na sinusunog; ang “para rito” ay natural na nagpapalinaw nito sa Filipino.
- source_word: וְנִסְכָּהּ
  choice: at handog na inumin para rito
  rationale: Tumutukoy ito sa kasamang handog na ibinubuhos. Mas madaling maunawaan ang “handog na inumin” kaysa sa teknikal na “libasyon.”
theological_decisions:
- issue: Saklaw ng חַטָּאת sa ritwal na konteksto
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang pangunahing salin ay pamilyar at leksikal na matibay, ngunit hindi nito isinasara ang ritwal na diwa ng paglilinis, na pinananatili sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kasama ang” upang natural na maiugnay sa palagiang handog ang dalawang kasamang handog, alinsunod sa mga hulaping Hebreo.
