  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: tl
  text: at isang lalaking kambing bilang handog para sa kasalanan, upang magbayad-sala para sa inyo[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang magsagawa ng pagbabayad-sala para sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: at isang lalaking kambing
  rationale: Ang שְׂעִיר עִזִּים ay tumutukoy sa lalaking kambing, ang אֶחָד ay nagsasaad ng bilang na isa, at ang prefixed וּ ay isinaling “at.”
- source_word: חַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong paghahandog, ang חַטָּאת ay pangalan ng handog para sa kasalanan, hindi lamang ng abstraktong “kasalanan.”
- source_word: לְ/כַפֵּר
  choice: upang magbayad-sala
  rationale: Ang כפר sa kontekstong saserdotal ay tumutukoy sa ritwal na pagharap sa sala sa pamamagitan ng handog. Ang “magbayad-sala” ay maikli, likas sa modernong Filipino, at hindi nagtatakda ng isang makitid na paliwanag sa mekanismo nito.
- source_word: עֲלֵי/כֶם
  choice: para sa inyo
  rationale: Sa ganitong gamit kasama ng כפר, ang עַל ay tumutukoy sa mga taong pinagbabayaran ng sala o kinakatawan sa ritwal; natural itong ipinapahayag na “para sa inyo.”
theological_decisions:
- issue: Pagpapahayag sa wikang panghandog na כפר
  choice: upang magbayad-sala para sa inyo
  alternative: upang alisin ang inyong sala
  rationale: Pinananatili ng “magbayad-sala” ang malawak na kategoryang ritwal at teolohikal ng Hebreo nang hindi ipinipirmi kung ang diin ay pagtatakip, pag-aalis, paglilinis, o ibang aspekto ng pagbabayad-sala.
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang anyong listahan ng talata at ang pangwakas na gitling na nagpapakitang nagpapatuloy ang pangungusap.
