  source_fidelity: 'Ang pangunahing nilalaman ay tapat sa Hebreo: ang mga handog ay karagdagan sa mga naunang iniuutos, at napapanatili ang pagkakasunod ng handog na sinusunog, handog na butil, mga handog na inumin, itinakdang pamamaraan, mabangong samyo, at paghahandog kay Yahweh. Gayunman, ang sunod-sunod na paggamit ng “pati sa” ay hindi angkop sa sintaks ng listahan, at ang “bilang kalugod-lugod na samyo” ay maaaring gawing mas tuwiran at mas nakaugat sa nakapirming pormulang panghandog.'
  naturalness: Mas natural at malinaw ang magkakatugmang ugnayang “at sa,” ang panghalip na “nito” para sa bawat isahang handog na sinusunog, at ang pangwakas na “bilang mabangong samyo, isang handog na pagkain para kay Yahweh.” Pinananatili nito ang marangal ngunit makabagong rehistro.
