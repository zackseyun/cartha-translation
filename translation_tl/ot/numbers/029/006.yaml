base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: tl
  text: Bukod pa sa handog na sinusunog para sa buwan[a] at sa handog na butil nito, at sa palagiang handog na sinusunog at sa handog na butil nito, at sa mga handog na inumin ng mga iyon, ayon sa itinakdang tuntunin para sa mga iyon—bilang mabangong samyo, isang handog na pagkain[b] para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na tumutukoy ito sa handog para sa bagong buwan; literal sa Hebreo, “handog na sinusunog ng buwan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “isang handog na inihandog sa apoy” o “isang handog na apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Malinaw na ipinakikitang ang mga handog na ito ay dagdag sa mga naunang itinakda.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: handog na sinusunog para sa buwan
  rationale: Pinananatili ang literal na pagtukoy ng Hebreo sa ‘buwan’ habang inilalagay sa talababa ang malamang na kontekstuwal na kahulugang bagong buwan.
- source_word: מִנְחָתָהּ
  choice: handog na butil na kasama nito
  rationale: Sa kontekstong pansakripisyo, ang מִנְחָה ay handog na butil; nililinaw ng ‘kasama nito’ ang kaugnayan nito sa handog na sinusunog.
- source_word: עֹלַת הַתָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Ipinahahayag ng תָּמִיד ang regular at patuloy na paghahandog nang hindi higit na tinutukoy kaysa sa Hebreo.
- source_word: וְנִסְכֵּיהֶם
  choice: pati sa mga handog na inumin ng mga iyon
  rationale: Ang נֶסֶךְ ay likidong ibinubuhos bilang handog; pinananatili rin ang maramihang hulapi.
- source_word: כְּמִשְׁפָּטָם
  choice: ayon sa tuntuning itinakda para sa mga iyon
  rationale: Sa kontekstong ritwal, ang מִשְׁפָּט ay ang itinakdang tuntunin o paraang dapat sundin.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: bilang kalugod-lugod na samyo
  rationale: Natural sa makabagong Tagalog at pinananatili ang metaporang nagpapahayag ng pagtanggap ng Diyos sa handog.
- source_word: אִשֶּׁה
  choice: isang handog na pagkain
  rationale: Ginagamit bilang teknikal na katawagang pansakripisyo; inilalagay sa talababa ang tradisyonal na pagbasa na nakatuon sa apoy.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol ay nagpapahayag na ang handog ay inihahandog kay Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa teksto ang tipanang pangalan ng Diyos, kaya pinananatili ito bilang ‘Yahweh.’
- issue: Kahulugan ng teknikal na katawagang אִשֶּׁה
  choice: isang handog na pagkain
  alternative: isang handog na pinaraan sa apoy; isang handog na apoy
  rationale: Pinipili ang makabagong leksikal na pag-unawa ngunit hindi itinatago ang tradisyonal at posibleng alternatibong pagbasa; inilalahad iyon sa talababa.
- issue: Tinutuukoy ng ‘handog para sa buwan’
  choice: panatilihin sa pangunahing teksto ang ‘para sa buwan’
  alternative: handog para sa bagong buwan
  rationale: Malamang na handog sa bagong buwan ang tinutukoy sa konteksto, ngunit ‘buwan’ lamang ang tahasang nasa Hebreo, kaya pinananatili ang anyo nito at ipinaliliwanag sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong listahan ng tekstong Hebreo at ang teknikal na bokabularyong pansakripisyo, ngunit ginawang mas natural ang mga ugnayan sa pamamagitan ng ‘na kasama nito’ at ‘para sa mga iyon.’
