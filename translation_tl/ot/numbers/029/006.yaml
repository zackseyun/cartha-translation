  to: Bukod pa sa handog na sinusunog para sa buwan[a] at sa handog na butil nito, at sa palagiang handog na sinusunog at sa handog na butil nito, at sa mga handog na inumin ng mga iyon, ayon sa itinakdang tuntunin para sa mga iyon—bilang mabangong samyo, isang handog na pagkain[b] para kay Yahweh.
