    rationale: Ang לְרֵיחַ נִיחֹחַ ay literal na tumutukoy sa isang nakalulugod/mabangong amoy. Ang “mabangong samyo” ay natural na Tagalog at mas tuwirang pinananatili ang imahe, nang hindi dinaragdagan ang kahulugang evaluative.
