base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: tl
  text: at ang kanilang handog na butil at mga handog na inumin para sa toro, sa lalaking tupa, at sa mga kordero, ayon sa bilang ng mga ito at ayon sa itinakdang tuntunin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ang kanilang handog na butil
  rationale: Sa konteksto ng paghahandog, ang מִנְחָה ay handog na yari sa butil, hindi basta pangkalahatang handog. Pinanatili ang kolektibong isahan.
- source_word: וְנִסְכֵּיהֶם
  choice: at mga handog na inumin
  rationale: Ang נֶסֶךְ ay likidong ibinubuhos bilang handog; malinaw at likas sa makabagong Filipino ang “handog na inumin.”
- source_word: לַפָּר
  choice: para sa toro
  rationale: Tuwirang katumbas ng פַּר sa listahan ng mga hayop na inihahandog.
- source_word: לָאַיִל
  choice: sa lalaking tupa
  rationale: Ang אַיִל ay partikular na lalaking tupa; mas madaling maunawaan ito kaysa sa hiram o di-gaanong karaniwang terminong “barakong tupa.”
- source_word: וְלַכְּבָשִׂים
  choice: at sa mga kordero
  rationale: Ang כֶּבֶשׂ ay kordero; sapat at natural ang pangkalahatang katawagan sa kontekstong ito.
- source_word: בְּמִסְפָּרָם
  choice: ayon sa bilang ng mga ito
  rationale: Ipinapahayag nito na ang kalakip na mga handog ay tumutugma sa bilang ng mga hayop. Nilinaw ng “mga ito” ang tinutukoy nang hindi nagdaragdag ng bagong kahulugan.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa itinakdang tuntunin
  rationale: Dito, ang מִשְׁפָּט ay ang nakatakdang legal o seremonyal na pamantayan. Pinananatili ng “itinakdang tuntunin” ang pormal na diwa habang natural sa Filipino.
