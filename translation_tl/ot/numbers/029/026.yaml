  register: Modernong Filipino na malinaw, marangal, at angkop sa listahan ng mga handog. Ginamit ang tradisyonal ngunit madaling maunawaang mga katawagang 'toro,' 'lalaking tupa,' 'kordero,' at 'walang kapintasan.'
