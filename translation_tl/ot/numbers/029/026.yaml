  text: וּ/בַ/יּ֧וֹם הַ/חֲמִישִׁ֛י פָּרִ֥ים תִּשְׁעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: tl
  text: 'Sa ikalimang araw: siyam na toro[a], dalawang lalaking tupa, at labing-apat na lalaking korderong isang taóng gulang at walang kapintasan,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At sa ikalimang araw.” May pang-ugnay na “at” sa simula ng tekstong Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/חֲמִישִׁי
  choice: Sa ikalimang araw
  rationale: Likas at malinaw na panimula sa Filipino para sa pagkakasunod-sunod ng mga araw; ipinahihiwatig ng konteksto ang pang-ugnay na וּ, habang itinatala sa talababa ang literal na alternatibo.
- source_word: פָּרִים תִּשְׁעָה
  choice: siyam na toro
  rationale: Ang פָּר ay tumutukoy sa toro sa konteksto ng paghahandog; hindi hinihingi ng talata mismo ang pagdaragdag ng 'batang'.
- source_word: אֵילִם שְׁנָיִם
  choice: dalawang lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa; tahasang ipinapakita ng salin ang kasarian upang maiba sa pangkalahatang 'tupa'.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: labing-apat na lalaking kordero
  rationale: Sa konteksto ng paghahandog, ang כֶּבֶשׂ ay kordero, karaniwang lalaking hayop; natural at tiyak ang 'lalaking kordero' sa Filipino.
- source_word: בְּנֵי שָׁנָה
  choice: isang taóng gulang
  rationale: Karaniwang idyomang Hebreo para sa edad ng mga hayop; malinaw at likas sa modernong Filipino.
- source_word: תְּמִימִם
  choice: walang kapintasan
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa mga hayop na walang depekto, hindi sa abstraktong pagiging perpekto.
