  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/018.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: tl
  text: at ang kanilang handog na butil at mga handog na inumin para sa mga toro, sa mga lalaking tupa, at sa mga batang tupa, ayon sa bilang ng mga ito at ayon sa itinakdang tuntunin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa paraang itinakda.” Ang Hebreong כַּמִּשְׁפָּט ay tumutukoy sa itinatag na tuntunin o pamamaraan para sa mga handog na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ang kanilang handog na butil
  rationale: Sa konteksto ng mga paghahain, ang מִנְחָה ay handog na butil na kasama ng mga handog na sinusunog. Pinananatili ng “kanilang” ang ugnayang ipinahihiwatig ng hulaping Hebreo.
- source_word: נִסְכֵּיהֶם
  choice: mga handog na inumin
  rationale: Ang נֶסֶךְ ay likidong ibinubuhos bilang handog. Ang “handog na inumin” ay malinaw at karaniwang nauunawaan kaysa sa teknikal na “libasyon.”
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: para sa mga toro, sa mga lalaking tupa, at sa mga batang tupa
  rationale: 'Ang לְ ay distributibo rito: ang mga kasamang handog ay nakatalaga sa bawat uri ng hayop. Nililinaw ng “lalaking tupa” ang אַיִל at ng “batang tupa” ang כֶּבֶשׂ.'
- source_word: בְּמִסְפָּרָם
  choice: ayon sa bilang ng mga ito
  rationale: Ipinahihiwatig ng parirala na ang dami ng mga kasamang handog ay katumbas o nakaayon sa bilang ng mga hayop. Iniiwasan ng “mga ito” ang malabong kasariang panggramatika sa Filipino.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa itinakdang tuntunin
  rationale: Ang מִשְׁפָּט sa kontekstong ito ay ang nakapirming tuntunin o wastong pamamaraan para sa paghahain. Pinagsasama ng salin ang legal at pamamaraang diwa nang hindi labis na teknikal.
