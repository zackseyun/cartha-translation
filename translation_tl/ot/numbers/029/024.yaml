  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: tl
  text: at ang kanilang handog na pagkaing butil at mga handog na inumin para sa mga toro, mga lalaking tupa, at mga kordero, ayon sa bilang ng mga hayop at ayon sa itinakdang tuntunin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: kanilang mga handog na pagkaing butil
  rationale: Sa konteksto ng paghahain, ang מִנְחָה ay handog na mula sa butil, hindi isang pangkalahatang handog. Ginawang maramihan sa Filipino upang natural na tumugma sa maraming hayop at sa mga kasamang handog.
- source_word: וְנִסְכֵּיהֶם
  choice: at mga handog na inumin
  rationale: Ang נֶסֶךְ ay inuming ibinubuhos bilang handog. Malinaw at karaniwan sa modernong Filipino ang “handog na inumin.”
- source_word: לַפָּרִים
  choice: para sa mga toro
  rationale: Ipinapakita ng ל ang kaugnayan ng kasamang handog sa bawat uri ng hayop; natural itong ipinahahayag ng “para sa.”
- source_word: לָאֵילִם
  choice: mga lalaking tupa
  rationale: Ang אַיִל ay adultong lalaking tupa. Mas madaling maunawaan ng pangkalahatang mambabasa ang “lalaking tupa” kaysa sa mas teknikal o di-gaanong laganap na katawagan.
- source_word: וְלַכְּבָשִׂים
  choice: at mga kordero
  rationale: Ang כְּבָשִׂים ay mga batang tupa sa konteksto ng paghahain; “mga kordero” ang maikli at kinikilalang katumbas.
- source_word: בְּמִסְפָּרָם
  choice: ayon sa bilang ng mga iyon
  rationale: Ipinapahayag nito na ang dami ng mga kasamang handog ay tumutugma sa bilang ng mga hayop. Nilinaw ng “mga iyon” ang tinutukoy nang hindi nagdaragdag ng bagong diwa.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa itinakdang tuntunin
  rationale: Sa batas ukol sa paghahain, ang מִשְׁפָּט ay ang itinakda o iniresetang pamamaraan. Pinananatili ng “itinakdang tuntunin” ang legal at ritwal na diwa sa natural na Filipino.
