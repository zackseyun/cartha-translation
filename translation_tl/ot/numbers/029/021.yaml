base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: tl
  text: at ang handog nilang butil at mga handog nilang inumin para sa mga toro, mga lalaking tupa, at mga kordero, ayon sa bilang ng mga ito at ayon sa itinakdang tuntunin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ayon sa itinakdang paraan ng pagsasagawa.” Ang salitang Hebreo ay tumutukoy sa umiiral na tuntuning ritwal para sa mga handog na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: kanilang mga handog na pagkaing butil
  rationale: Sa konteksto ng paghahandog, ang מִנְחָה ay handog na mula sa butil na kalakip ng mga haing hayop. Nilinaw ng “pagkaing butil” ang uri ng handog, at ipinahayag sa natural na Filipino ang kolektibong anyo kasama ng hulaping maramihan.
- source_word: נִסְכֵּיהֶם
  choice: mga handog na inumin
  rationale: Tumutukoy ang נֶסֶךְ sa likidong ibinubuhos bilang handog. Ang “handog na inumin” ay malinaw at karaniwang maunawaan kaysa sa teknikal na “libasyon.”
- source_word: לַפָּרִים
  choice: para sa mga toro
  rationale: Ang פָּרִים sa talaan ng mga hain ay mga toro; hindi na idinagdag ang “batang” sapagkat hindi iyon tahasang nakasaad dito.
- source_word: לָאֵילִם
  choice: mga lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa, kaya ginamit ang tuwiran at madaling maunawaang katawagan sa Filipino.
- source_word: וְלַכְּבָשִׂים
  choice: at mga kordero
  rationale: Ang כֶּבֶשׂ ay kordero. Hindi tinukoy ang kasarian sa salin dahil hindi kailangang idiin iyon sa pariralang ito.
- source_word: בְּמִסְפָּרָם
  choice: ayon sa bilang ng mga ito
  rationale: Ipinahihiwatig ng parirala ang pagtutugma ng mga kalakip na handog sa itinakdang bilang ng bawat uri ng hayop.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa itinakdang tuntunin
  rationale: Dito ang מִשְׁפָּט ay tumutukoy sa umiiral na tuntuning ritwal o legal para sa mga handog. Pinananatili ng “itinakdang tuntunin” ang pormal na diwa nang hindi nagiging malabo.
