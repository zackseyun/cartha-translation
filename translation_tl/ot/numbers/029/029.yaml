base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: tl
  text: 'At sa ikaanim na araw: walong toro, dalawang lalaking tupa, at labing-apat na lalaking korderong tig-iisang taóng gulang, na walang kapintasan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שִּׁשִּׁי
  choice: At sa ikaanim na araw
  rationale: Likas na ipinagpapatuloy ng pang-ugnay, pang-ukol, at ordinal ang sunod-sunod na tala ng mga handog sa bawat araw.
- source_word: פָּרִים שְׁמֹנָה
  choice: walong toro
  rationale: Sa konteksto ng paghahandog, ang פָּרִים ay mga torong ihahandog; walang tahasang pagtukoy rito sa kanilang edad.
- source_word: אֵילִם שְׁנָיִם
  choice: dalawang lalaking tupa
  rationale: Ang אֵילִם ay mga ram, kaya malinaw at karaniwang Filipino ang “lalaking tupa.”
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: labing-apat na lalaking kordero
  rationale: Ang כְּבָשִׂים ay tumutukoy sa mga kordero at ang anyong panlalaki ay pinananatili upang maipahayag ang espesipikong uri ng hayop sa paghahandog.
- source_word: בְּנֵי שָׁנָה
  choice: tig-iisang taóng gulang
  rationale: Idyomatikong pahayag ito para sa bawat hayop na isang taon ang gulang; nililinaw ng “tig-iisa” na ang edad ay para sa bawat kordero.
- source_word: תְּמִימִם
  choice: na walang kapintasan
  rationale: Sa batas tungkol sa paghahandog, tumutukoy ito sa mga hayop na walang depekto o kapintasan.
theological_decisions: []
