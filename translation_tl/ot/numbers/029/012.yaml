  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: tl
  text: Sa ikalabinlimang araw ng ikapitong buwan, magkakaroon kayo ng banal na pagtitipon. Huwag kayong gagawa ng anumang karaniwang gawain, at ipagdiriwang ninyo ang isang kapistahan para kay Yahweh sa loob ng pitong araw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Sa ikalabinlimang araw
  rationale: Ang pariralang Hebreo ay isang pormulang pangkalendaryo. Natural sa makabagong Tagalog ang “sa ikalabinlimang araw”; hindi na kailangang isalin nang hiwalay ang panimulang pangatnig.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ng ikapitong buwan
  rationale: Tinutukoy nito kung saang buwan kabilang ang araw at tuwirang pinananatili ang ayos ng pormulang pangkalendaryo.
- source_word: מִקְרָא קֹדֶשׁ
  choice: banal na pagtitipon
  rationale: Ang מִקְרָא ay tumutukoy sa isang ipinatawag na kapulungang panrelihiyon. Malinaw at marangal ang “banal na pagtitipon” sa kasalukuyang Tagalog.
- source_word: יִהְיֶה לָכֶם
  choice: magkakaroon kayo
  rationale: Natural na ipinahahayag sa Tagalog ang literal na “magiging para sa inyo” bilang “magkakaroon kayo.”
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: anumang karaniwang gawain
  rationale: Tumutukoy ang parirala sa regular o pang-araw-araw na paggawa na ipinagbabawal sa banal na araw, hindi sa lahat ng posibleng pagkilos. Ipinahahayag ng “anumang” ang saklaw ng כָּל.
- source_word: לֹא תַעֲשׂוּ
  choice: Huwag kayong gagawa
  rationale: Pinananatili nito ang tuwirang lakas ng legal na pagbabawal sa natural na Tagalog.
- source_word: וְחַגֹּתֶם חַג
  choice: ipagdiriwang ninyo ang isang kapistahan
  rationale: Ang magkaugnay na pandiwa at pangngalan ay tumutukoy sa aktuwal na pagdiriwang ng kapistahan. Ang salin ay natural habang pinananatili ang parehong konsepto.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Maaaring ipahiwatig ng לְ na ang kapistahan ay ukol kay Yahweh o ginaganap bilang parangal sa kanya. Natural sa Tagalog ang “para kay.”
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Malinaw na ipinahahayag nito ang tagal ng pagdiriwang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang legal at liturhikal na himig nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
