  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הָ/הָ֣רָ/ה לֵּ֔כוּ פֶּֽן יִפְגְּע֥וּ בָ/כֶ֖ם הָ/רֹדְפִ֑ים וְ/נַחְבֵּתֶ֨ם שָׁ֜מָּ/ה שְׁלֹ֣שֶׁת יָמִ֗ים עַ֚ד שׁ֣וֹב הָ/רֹֽדְפִ֔ים וְ/אַחַ֖ר תֵּלְכ֥וּ לְ/דַרְכְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: tl
  text: At sinabi niya sa kanila, “Pumunta kayo sa kabundukan[a] upang hindi kayo makasalubong ng mga humahabol sa inyo.[b] Magtago kayo roon nang tatlong araw, hanggang sa makabalik ang mga humahabol. Pagkatapos, maaari na kayong magpatuloy sa inyong lakad.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bundok.” Ang salitang Hebreo ay maaaring tumukoy sa isang partikular na bundok o sa nakapaligid na kabundukan.
    reason: lexical_alternative
  - marker: b
    text: O “matagpuan” o “maabutan.” Ang pandiwa ay maaaring tumukoy sa pagkakatagpo sa isang tao; sa kontekstong ito, may masamang layunin ang pagkakatagpo dahil hinahabol sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: sa kabundukan
  rationale: Ang הַר ay maaaring tumukoy sa isang bundok o sa bulubunduking rehiyon. Sa konteksto ng pagtatago, natural sa Filipino ang “kabundukan” at pinananatili nito ang panrehiyong diwa.
- source_word: לֵּכוּ
  choice: Pumunta kayo
  rationale: Tuwirang pautos ang anyo ng הלך. Ang “Pumunta kayo” ay malinaw at likas sa modernong Filipino.
- source_word: פֶּן
  choice: upang hindi
  rationale: Ipinapakilala ng פֶּן ang pag-iwas sa isang maaaring mangyari. Ang “upang hindi” ay natural na nagpapahayag ng layuning mag-ingat.
- source_word: יִפְגְּעוּ בָכֶם
  choice: makasalubong kayo
  rationale: Ang פגע na may ב ay maaaring mangahulugang makatagpo, makasalubong, o maabutan. Ang “makasalubong” ay pinananatili ang pangunahing diwa nang hindi pinatitindi tungo sa “maabutan.”
- source_word: הָרֹדְפִים
  choice: mga humahabol sa inyo
  rationale: Ang participle ng רדף ay tumutukoy sa mga aktibong tumutugis. Mas malinaw at natural sa karaniwang Filipino ang “mga humahabol sa inyo.”
- source_word: וְנַחְבֵּתֶם
  choice: Magtago kayo
  rationale: Ang Niphal na pautos ay may diwang ang mga kausap mismo ang magtatago. Tuwiran at idiomatiko ang “Magtago kayo.”
- source_word: שָׁמָּה
  choice: roon
  rationale: Ang pang-abay ay tumutukoy sa lugar na pinapupuntahan. Ang “roon” ang natural na katumbas pagkatapos ng “Pumunta kayo sa kabundukan.”
- source_word: שְׁלֹשֶׁת יָמִים
  choice: nang tatlong araw
  rationale: Ipinahahayag nito ang tagal ng pagtatago; karaniwang gamit sa Filipino ang “nang tatlong araw.”
- source_word: עַד שׁוֹב
  choice: hanggang sa makabalik
  rationale: Itinatakda ng עַד at infinitive ng שוב ang hangganan ng paghihintay. Natural na katumbas ang “hanggang sa makabalik.”
- source_word: וְאַחַר
  choice: Pagkatapos
  rationale: Minamarkahan nito ang susunod na hakbang matapos ang tatlong araw. Payak at malinaw ang “Pagkatapos.”
- source_word: תֵּלְכוּ לְדַרְכְּכֶם
  choice: maaari na kayong magpatuloy sa inyong lakad
  rationale: Sa konteksto, ang imperfect ay nagpapahayag ng susunod na pinahihintulutang kilos. Ang “magpatuloy sa inyong lakad” ay natural na Filipino para sa paglakad sa sariling patutunguhan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may payak ngunit marangal na salaysay. Ginamit ang “kabundukan” upang katawanin ang posibleng panrehiyong kahulugan ng הַר, habang inilagay sa talababa ang “bundok.” Iniwasan ang masyadong pormal na “nang sa gayon ay hindi” at pinili ang likas na “upang hindi.”
