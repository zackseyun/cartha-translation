language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: tl
  text: Pagkatapos, lihim na nagsugo si Josue na anak ni Nun ng dalawang lalaki mula sa Sitim bilang mga espiya. Sinabi niya, “Humayo kayo at siyasatin ang lupain at ang Jerico.” Kaya humayo sila at dumating sa bahay ng isang prostituta na ang pangalan ay Rahab[a], at nahiga sila roon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Karaniwang nangangahulugang “prostituta” ang salitang Hebreo. Iminungkahi rin ng ilan ang “may-ari ng bahay-tuluyan,” ngunit hindi iyon ang karaniwang kahulugan ng salita.
    reason: alternative_reading
  - marker: b
    text: O “tumuloy sila roon.” Literal na sinasabi ng Hebreo, “nahiga sila roon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Likas na salin sa salaysay para sa pagpapadala ng mga tauhan upang gumanap ng isang atas.
- source_word: מִן הַשִּׁטִּים
  choice: mula sa Sitim
  rationale: Pinanatili bilang transliteradong pangalan ng lugar sa halip na isaling “Kakahuyan ng Akasya.”
- source_word: שְׁנַיִם אֲנָשִׁים
  choice: dalawang lalaki
  rationale: Tiyak na mga lalaking tauhan ang tinutukoy ng Hebreo.
- source_word: מְרַגְּלִים
  choice: bilang mga espiya
  rationale: Malinaw na ipinapahayag ang kanilang tungkuling lihim na kumuha ng impormasyon.
- source_word: חֶרֶשׁ
  choice: lihim
  rationale: Ginagamit nang pang-abay at tumutukoy sa palihim na paraan ng pagsusugo.
- source_word: לְכוּ רְאוּ
  choice: Humayo kayo at siyasatin
  rationale: Ang “siyasatin” ay natural sa konteksto ng pagmamanman at higit na angkop kaysa sa payak na “tingnan,” nang hindi nagdaragdag ng bagong ideya.
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: ang lupain at ang Jerico
  rationale: Pinananatili ang tahasang koordinasyong “at” sa Hebreo at hindi ipinapalagay na ang kahulugan ay “lalo na ang Jerico.”
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: bahay ng isang babaeng bayaran
  rationale: Ang זוֹנָה ay karaniwang nangangahulugang babaeng nagbebenta ng serbisyong seksuwal; ang “babaeng bayaran” ay malinaw at dignidad-preserving sa modernong Filipino.
- source_word: וּשְׁמָהּ רָחָב
  choice: na ang pangalan ay Rahab
  rationale: Natural na pag-uugnay sa Filipino habang buo ang pagkakakilanlan sa babae.
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: nahiga sila roon
  rationale: Pinananatili ang literal na diwa ng שכב at hindi ipinapalagay kung ito ay simpleng pagtuloy o pagtulog.
theological_decisions:
- issue: Hanapbuhay ni Rahab (זוֹנָה)
  choice: babaeng bayaran
  alternative: tagapangasiwa ng bahay-tuluyan
  rationale: Ang karaniwang leksikal na kahulugan ay prostituta o babaeng bayaran. Ang alternatibong “tagapangasiwa ng bahay-tuluyan” ay nakabatay sa interpretasyon at hindi sa karaniwang kahulugan ng salita.
- issue: Pahiwatig ng וַיִּשְׁכְּבוּ שָׁמָּה
  choice: nahiga sila roon
  alternative: tumuloy sila roon
  rationale: Hindi dapat ipahiwatig ng salin ang seksuwal na gawain, ngunit hindi rin nito dapat tahasang gawing pormal na panunuluyan ang kilos. Pinananatili ng literal na salin ang puwang ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Josue,” “Sitim,” at “Jerico” bilang mga nakaugaliang anyong Filipino ng mga pangalan. Iniwasan ang arkaikong “patutot” at ang mas klinikal na “prostituta” pabor sa malinaw ngunit hindi mapanghamak na “babaeng bayaran.”
