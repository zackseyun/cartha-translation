revisions:
- from: Pagkatapos, lihim na nagsugo si Josue na anak ni Nun ng dalawang lalaki mula sa Sitim bilang mga espiya. Sinabi niya, “Humayo kayo at siyasatin ang lupain at ang Jerico.” Kaya humayo sila at pumasok sa bahay ng isang babaeng bayaran na ang pangalan ay Rahab[a], at nahiga sila roon.[b]
  to: Pagkatapos, lihim na nagsugo si Josue na anak ni Nun ng dalawang lalaki mula sa Sitim bilang mga espiya. Sinabi niya, “Humayo kayo at siyasatin ang lupain at ang Jerico.” Kaya humayo sila at dumating sa bahay ng isang prostituta na ang pangalan ay Rahab[a], at nahiga sila roon.[b]
