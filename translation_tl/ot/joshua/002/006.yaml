  text: But she had brought them up to the roof and hidden them among the stalks of flax laid out for her on the roof.
translation:
  language: tl
  text: Ngunit nauna na niyang dinala sila sa bubong at itinago sa gitna ng mga tangkay ng lino na nakalatag para sa kaniya sa bubong.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגָּגָה / עַל־הַגָּג
  choice: sa bubong
  rationale: Ang גָּג ay patag na bubong na maaaring gamitin bilang lugar ng pagpapatuyo; sapat at natural sa Tagalog ang “bubong” sa kontekstong ito.
- source_word: וַתִּטְמְנֵם
  choice: at itinago
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagtatago sa kanila upang hindi makita.
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: sa gitna ng mga tangkay ng lino
  rationale: Ang parirala ay tumutukoy sa makahoy na mga tangkay ng halamang lino, hindi sa naprosesong telang lino; nililinaw ng “mga tangkay ng lino” ang bagay na pinagt taguan.
- source_word: הָעֲרֻכוֹת לָהּ
  choice: na inayos niya
  rationale: Ang participle ay pambabaeng maramihan at tumutukoy sa mga tangkay na inilatag o inayos; ang לָהּ ay maaaring may diwang “para sa kaniya” o kaugnay ng kaniyang pag-aayos. Pinili ang natural na “inayos niya,” na hindi labis na nagpapabigat sa idyomatikong panghalip.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na payak at marangal. Ginamit ang “Ngunit dinala na niya” upang maipakita ang pangyayaring nauna sa pagdating ng mga humahanap, gaya ng gamit ng sugnay sa salaysay. Walang kailangang talababa.
