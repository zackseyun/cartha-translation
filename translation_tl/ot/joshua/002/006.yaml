- from: Ngunit dinala na niya sila sa bubong at itinago sa gitna ng mga tangkay ng lino na inayos niya sa bubong.
  to: Ngunit nauna na niyang dinala sila sa bubong at itinago sa gitna ng mga tangkay ng lino na nakalatag para sa kaniya sa bubong.
  rationale: Pinalitan ang “na inayos niya” ng “na nakalatag para sa kaniya” upang maipahayag ang participle at ang לָהּ nang hindi nagpapasya nang lampas sa teksto kung sino ang naglatag ng lino. Pinanatili ang payak at marangal na rehistro at ang malinaw na pagtukoy sa mga tangkay ng lino.
