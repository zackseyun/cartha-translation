  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: dinala ni Rahab ang mga lalaki sa bubong at itinago sila sa mga tangkay ng lino roon. Gayunman, ang “inayos niya” ay naglilipat ng lamed na panghalip (לָהּ, “para sa kaniya”) tungo sa paggawa ni Rahab at hindi nito malinaw na isinasalin ang participle na “nakalatag/nakaayos.”'
  naturalness: Natural at malinaw sa makabagong Filipino ang “mga tangkay ng lino” at “sa gitna ng.” Ang “nauna na niyang dinala” ay maayos na naghahatid ng nakaraang pangyayaring ipinahihiwatig ng konteksto at ng English audit trail.
