base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: tl
  text: At sinabi nila kay Josue, “Tiyak na ibinigay ni Yahweh sa atin ang buong lupain, at nawalan ng lakas ng loob dahil sa atin ang lahat ng naninirahan sa lupain.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Tunay ngang
  rationale: Sa kontekstong ito, ipinakikilala nito ang matibay na konklusyon ng mga espiya, hindi lamang isang sugnay na sanhi.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: ibinigay sa atin
  rationale: Natural na Filipino para sa idyomang Hebreo na nangangahulugang ipinailalim sa kapangyarihan o pag-aari nila; hindi kailangang panatilihin nang literal ang 'sa ating kamay.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng tetragrammaton sa tekstong Hebreo.
- source_word: נָמֹגוּ
  choice: nanghihina sa takot
  rationale: Ipinahahayag ang matalinghagang 'natunaw' bilang pagkawala ng tapang dahil sa takot, gaya ng hinihingi ng konteksto.
- source_word: מִפָּנֵינוּ
  choice: sa atin
  rationale: Natural na pagpapahayag ng takot na dulot ng pagdating o pagharap ng Israel; iniiwasan ang di-likas na literal na 'mula sa harap natin.'
theological_decisions:
- issue: Ang katiyakan ng pagkakaloob ng lupain
  choice: ibinigay
  alternative: ibibigay
  rationale: 'Pinananatili ang aspektong ganap ng Hebreo: itinuturing ng mga espiya na tiyak at naganap na sa pasya ni Yahweh ang pagkakaloob, kahit hindi pa lubos na nasasakop ang lupain.'
- issue: Paglalarawan sa takot ng mga naninirahan
  choice: nanghihina sa takot
  alternative: natunaw
  rationale: Pinananatili ang diwa ng matalinghagang pananalita nang hindi lumilikha ng maling literal na larawan sa modernong Filipino.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “Josue,” ang nakaugaliang anyong Filipino ng pangalan, at pinanatili ang personal na pangalang “Yahweh.”
