translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Mangyari nawa” bilang bahagyang pormal ngunit madaling maunawaang pahayag ng pagsang-ayon; iniwasan ang sobrang arkaikong ayos. Inilagay ang pananda ng talababa kaagad pagkatapos ng “pulang tali,” ang mismong pariralang nililinaw nito.
