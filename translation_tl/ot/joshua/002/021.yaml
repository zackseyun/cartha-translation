  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: tl
  text: At sinabi niya, “Ayon sa inyong sinabi, gayon nga.” Pagkatapos ay pinayaon niya sila, at umalis sila. At itinali niya sa bintana ang iskarlatang tali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iskarlatang pisi,” “iskarlatang panali,” o “iskarlatang lubid.” Ang salitang Hebreo ay maaaring tumukoy sa tali, pisi, o lubid na ginamit bilang nakikitang palatandaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: ayon sa inyong sinabi
  rationale: Likas sa makabagong Tagalog at pinananatili ang pagtukoy sa mga salitang sinabi ng mga tiktik, bagaman hindi mekanikal na ginagaya ang pangmaramihang Hebreo.
- source_word: כֵּן הוּא
  choice: Mangyari nawa
  rationale: Ipinahahayag nito ang pagsang-ayon ni Rahab sa mga itinakdang kondisyon at katumbas ng Hebreong pormula ng pagpapatibay.
- source_word: וַתְּשַׁלְּחֵם
  choice: pinayaon niya sila
  rationale: Tumpak na ipinahihiwatig na pinaalis o pinahayo niya ang mga lalaki nang hindi nagdaragdag ng paraan ng kanilang pag-alis.
- source_word: וַיֵּלֵכוּ
  choice: umalis sila
  rationale: Natural na salaysay sa Tagalog para sa payak na pandiwang Hebreo na nangangahulugang sila ay yumaon o umalis.
- source_word: וַתִּקְשֹׁר
  choice: itinali niya
  rationale: Direkta at karaniwang katumbas ng pagkilos na pagtali o pagkakabit gamit ang tali.
- source_word: תִּקְוַת הַשָּׁנִי
  choice: ang pulang tali
  rationale: Sa konteksto, ang תִּקְוָה ay kongkretong tali o lubid, hindi “pag-asa”; ang הַשָּׁנִי ay tumutukoy sa matingkad na pulang kulay. Ang “pulang tali” ay malinaw at natural sa karaniwang Tagalog.
- source_word: בַּחַלּוֹן
  choice: sa bintana
  rationale: Ang pang-ukol ay tumutukoy sa lokasyon kung saan itinali ang palatandaan; “sa bintana” ang pinakanatural at hindi labis na tiyak na Tagalog.
