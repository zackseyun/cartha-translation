  text: Before they lay down[a], she went up to them on the roof.
translation:
  language: tl
  text: Bago sila mahiga[a], umakyat siya sa kinaroroonan nila sa bubong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bago sila matulog.” Literal na nangangahulugang “mahiga” ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: Bago
  rationale: Ipinapahayag ng salitang ito na naunang nangyari ang pag-akyat ng babae kaysa sa paghiga ng mga lalaki; “Bago” ang pinakanatural na katumbas sa modernong Tagalog.
- source_word: יִשְׁכָּבוּן
  choice: sila mahiga
  rationale: Ang pandiwang שׁכב ay literal na tumutukoy sa paghiga. Maaaring ipinahihiwatig sa konteksto ang pagtulog, ngunit hindi ito tahasang sinasabi ng Hebreo, kaya pinanatili ang “mahiga.”
- source_word: עָלְתָה
  choice: umakyat siya
  rationale: Ang Qal perfect ng עלה ay karaniwang nagsasaad ng paggalaw paitaas; natural ang “umakyat” para sa pagpunta sa bubong.
- source_word: עֲלֵיהֶם
  choice: upang puntahan sila
  rationale: Bagaman maaaring literal na “sa ibabaw nila” ang pang-ukol, sa pagsama nito sa pandiwa ng pag-akyat at sa mga taong tinutukoy, ipinahihiwatig nito ang paglapit o pagpunta sa kanila.
- source_word: עַל הַגָּג
  choice: sa bubong
  rationale: Tinutukoy nito ang kinaroroonan ng mga lalaki at ang lugar na inakyatan niya; “sa bubong” ang malinaw at natural na salin.
- source_word: וְהֵמָּה ... וְהִיא
  choice: sila ... siya
  rationale: Pinananatili ng ayos na “Bago sila ... siya ...” ang paghahambing ng mga kalahok na binibigyang-diin ng tahasang mga panghalip sa Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mahiga” upang mapanatili ang literal na kilos at ang posibilidad na tumutukoy rin ito sa pagtulog; nilinaw sa talababa ang mas malayang alternatibo.
