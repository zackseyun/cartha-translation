id: JOS.2.11
reference: Joshua 2:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: tl
  text: Nang marinig namin iyon, nanghina ang aming loob, at wala nang natirang lakas ng loob sa sinuman dahil sa inyo.[a] Sapagkat si Yahweh na inyong Diyos[b]—siya ang Diyos sa langit sa itaas at sa lupa sa ibaba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “wala nang bumangong espiritu sa sinuman.” Ang kahulugan ay wala nang natirang tapang o lakas ng loob sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ay kumakatawan sa banal na pangalang Hebreo na YHWH.
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: Nang marinig namin iyon
  rationale: Ipinahahayag ng anyong pandiwa ang kasunod na pangyayari, ngunit ang temporal na ugnayan ang pinakanatural sa Tagalog. Ang “iyon” ay likas na tumutukoy sa naunang balita.
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: nanghina ang aming loob
  rationale: Ang literal na larawan ay “natunaw ang aming puso,” isang idyoma para sa pagkawala ng tapang. Ang “nanghina ang aming loob” ang natural na katumbas sa modernong Tagalog.
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: wala nang natirang lakas ng loob sa sinuman
  rationale: Ang רוּחַ dito ay tumutukoy sa panloob na tapang o lakas ng loob, hindi sa Banal na Espiritu o hangin. Malinaw itong naihahatid ng parirala habang ang literal na larawan ay inilalahad sa talababa.
- source_word: מִפְּנֵיכֶם
  choice: dahil sa inyo
  rationale: Bagaman literal na may diwang “mula sa harapan/presensiya ninyo,” sanhi ng takot ang ipinahahayag nito sa konteksto.
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng dahilan sa takot at pagkawala ng tapang na binanggit sa unang sugnay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tumutukoy ito sa Diyos ng Israel at nakaugnay sa pangalang Yahweh.
- source_word: הוּא אֱלֹהִים
  choice: siya ang Diyos
  rationale: Pinananatili ang tahasang pahayag ng Hebreo nang hindi idinaragdag ang “tanging” o “tunay,” na hindi hayagang nasa teksto.
- source_word: בַּשָּׁמַיִם מִמַּעַל
  choice: sa langit sa itaas
  rationale: Natural sa Tagalog ang kolektibong “langit” at pinananatili nito ang patayong pagtutumbas sa lupa sa ibaba.
- source_word: וְעַל הָאָרֶץ מִתָּחַת
  choice: at sa lupa sa ibaba
  rationale: Binubuo nito kasama ng naunang parirala ang saklaw na langit at lupa, na nagpapahayag ng pansansinukob na paghahari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulong “PANGINOON.”
- issue: Saklaw ng pagpapahayag ni Rahab
  choice: siya ang Diyos sa langit sa itaas at sa lupa sa ibaba
  alternative: siya lamang ang Diyos; siya ang tunay na Diyos
  rationale: Maliwanag na ipinahahayag ng Hebreo ang pagka-Diyos at pansansinukob na kapangyarihan ni Yahweh, ngunit hindi hayagang ginagamit sa sugnay ang salitang “lamang” o “tunay.”
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “nanghina ang aming loob” at “lakas ng loob” upang maihatid ang dalawang magkaugnay na idyomang Hebreo nang malinaw, habang inilagay sa talababa ang mas literal na larawan ng ikalawang idyoma.
