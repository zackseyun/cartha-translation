base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: tl
  text: At sinabi niya sa mga lalaki, “Alam kong ibinigay na sa inyo ni Yahweh ang lupain, at nasindak kami dahil sa inyo, at nanghina ang loob ng lahat ng naninirahan sa lupain dahil sa inyo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “bumagsak sa amin ang sindak sa inyo, at natunaw ang lahat ng naninirahan sa lupain sa harap ninyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל הָאֲנָשִׁים
  choice: At sinabi niya sa mga lalaki
  rationale: Pinananatili ng “At” ang daloy ng salaysay na ipinahihiwatig ng waw-consecutive; ang “mga lalaki” ay tumutukoy sa tiyak na mga lalaking kausap ni Rahab.
- source_word: יָדַעְתִּי
  choice: Alam ko
  rationale: Ang anyong perfect ay stative at nagpapahayag dito ng matatag na kaalamang may kasalukuyang bisa.
- source_word: נָתַן יְהוָה לָכֶם אֶת הָאָרֶץ
  choice: ibinigay na sa inyo ni Yahweh ang lupain
  rationale: Ipinakikita ng perfect ang pagkakaloob bilang tiyak at para bang naganap na mula sa pananaw ni Rahab, kahit nagpapatuloy pa ang pananakop; natural itong naihahatid ng “ibinigay na.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: nasindak kami dahil sa inyo
  rationale: Natural na Filipino itong katumbas ng idyomang literal na nagsasabing ang sindak mula sa kanila ay “bumagsak” sa mga taga-lupain.
- source_word: נָמֹגוּ כָּל יֹשְׁבֵי הָאָרֶץ
  choice: nanghina ang loob ng lahat ng naninirahan sa lupain
  rationale: Ipinahahayag nito ang metaporikal na diwa ng נָמֹגוּ, ang pagkawala ng tapang, sa malinaw at likas na Filipino; itinatala sa talababa ang literal na larawang “natunaw.”
- source_word: מִפְּנֵיכֶם
  choice: dahil sa inyo
  rationale: Sa konteksto, ang idyoma ay nagpapahayag ng sanhi—nawalan sila ng tapang dahil sa pagdating o presensiya ng Israel—habang kinikilala sa talababa ang mas literal na “sa harap ninyo.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Ang pagkakaloob ng lupain habang hindi pa tapos ang pananakop
  choice: ibinigay na
  alternative: ibinibigay
  rationale: 'Pinananatili nito ang tensiyon ng perfect na Hebreo: itinuturing ni Rahab na tiyak at epektibo nang ipinagkaloob ang lupain, bagaman hindi pa ganap ang pag-angkin dito.'
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “nasindak” at “nanghina ang loob” para maging malinaw sa karaniwang mambabasa, habang inilagay sa talababa ang matingkad na mga idyomang Hebreo.
