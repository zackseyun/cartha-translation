  source_fidelity: 'Tumpak na naihahatid ng salin ang tatlong magkakaugnay na pahayag ni Rahab: alam niyang ibinigay na ni Yahweh ang lupain sa Israel, nasindak ang mga naninirahan dito dahil sa Israel, at nawalan sila ng tapang. Ang “ibinigay na” ay angkop sa Hebreong perfect, na nagpapakita ng pagkakaloob bilang tiyak at epektibo na.'
