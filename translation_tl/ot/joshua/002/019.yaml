  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: tl
  text: Ang sinumang lumabas sa mga pintuan ng bahay mo, ang dugo niya ay nasa sarili niyang ulo, at wala kaming pananagutan. Ngunit ang sinumang kasama mo sa loob ng bahay, ang dugo niya ay nasa aming mga ulo[a] kung may manakit sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ang dugo niya ay nasa sarili niyang ulo” at “ang dugo niya ay nasa aming mga ulo” ay mga legal na pahayag na nagtatalaga kung sino ang mananagot sa pagdanak ng dugo o sa kamatayan.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: hindi hiwalay na isinalin
  rationale: Ipinakikilala nito ang kasunod na kondisyon; likas sa Tagalog na tuwirang ilahad ang kondisyon nang walang hiwalay na panimulang pormula.
- source_word: כֹּל אֲשֶׁר
  choice: ang sinumang
  rationale: Tumutukoy ito nang pamahagi sa bawat taong saklaw ng kondisyon.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: lumabas sa mga pintuan ng bahay mo
  rationale: Naipahihiwatig na ng “lumabas” ang direksiyon patungo sa labas, kaya hindi na ito inuulit.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: ang dugo niya ay mapapasa kaniyang sariling ulo
  rationale: Pinananatili ang legal na larawang Hebreo na nagtatalaga ng pananagutan sa mangyayaring kamatayan.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: wala kaming pananagutan
  rationale: Sa konteksto ng sumpaan, ang kahulugan ay pagiging malaya sa pagkakasala o pananagutan; ito ang pinakanatural na legal na pahayag sa modernong Tagalog.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: ngunit ang sinumang kasama mo sa loob ng bahay
  rationale: Malinaw na ipinakikita ang kasalungat na kondisyon para sa sinumang nananatili sa proteksiyon ng bahay.
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: ang dugo niya ay mapapasa aming mga ulo
  rationale: Pinananatili ang katapat na idyoma at paralelismo ng talata, na ngayon ay nagtatalaga ng pananagutan sa mga espiya.
- source_word: אִם יָד תִּהְיֶה בּוֹ
  choice: kung siya ay pagbuhatan ng kamay
  rationale: Natural na idyomang Tagalog ito para sa pananakit o marahas na pagkilos at hindi nito tinutukoy kung sino ang gagawa.
theological_decisions:
- issue: Pagpapanatili sa idyoma tungkol sa dugo at ulo
  choice: Panatilihin sa pangunahing teksto ang “ang dugo niya ay mapapasa kaniyang sariling ulo / aming mga ulo.”
  alternative: “Siya ang mananagot sa sarili niyang kamatayan / kami ang mananagot sa kaniyang kamatayan.”
  rationale: Nananatili rito ang legal at taimtim na larawan ng Hebreo, habang nililinaw ng talababa ang ibig sabihin nito.
- issue: Kasarian sa pagtukoy sa di-tiyak na tao
  choice: Gamitin ang likas na neutral-sa-kasariang “ang sinuman” at “siya/niya.”
  alternative: Magdagdag ng tiyak na panlalaki o pambabaeng pagtukoy.
  rationale: Walang gramatikal na kasarian ang mga panghalip na Tagalog; tumpak nitong naihahatid ang pamamahaging singular nang hindi nagdaragdag ng kasariang hindi kailangang idiin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang legal na idyoma at paralelismo ng Hebreo; ginamit ang “pagbuhatan ng kamay” bilang likas na pahayag para sa pananakit.
