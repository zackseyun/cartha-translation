revisions:
- from: Ang sinumang lumabas sa mga pintuan ng bahay mo, ang dugo niya ay mapapasa kaniyang sariling ulo, at wala kaming pananagutan. Ngunit ang sinumang kasama mo sa loob ng bahay, ang dugo niya ay mapapasa aming mga ulo[a] kung siya ay pagbuhatan ng kamay.
  to: Ang sinumang lumabas sa mga pintuan ng bahay mo, ang dugo niya ay nasa sarili niyang ulo, at wala kaming pananagutan. Ngunit ang sinumang kasama mo sa loob ng bahay, ang dugo niya ay nasa aming mga ulo[a] kung may manakit sa kanya.
  rationale: Pinalitan ang “mapapasa” ng “nasa” upang maging mas malinaw at likas sa modernong Filipino ang legal na idyoma, nang hindi inaalis ang imahen ng dugo sa ulo. Pinalitan din ang di-karaniwang pasibong “pagbuhatan ng kamay” ng natural na pananalitang tumutukoy sa pananakit; pinananatili nitong hindi tinutukoy kung sino ang mananakit.
