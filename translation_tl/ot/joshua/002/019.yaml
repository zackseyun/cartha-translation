  naturalness: Marangal ang rehistro, ngunit hindi gaanong likas sa modernong Filipino ang “mapapasa kaniyang sariling ulo” at lalo na ang “kung siya ay pagbuhatan ng kamay.” Ang “nasa ... ulo” ay mas tuwirang nagpapanatili ng idyoma, at ang “kung may manakit sa kanya” ay malinaw at natural na walang pagtukoy sa salarin.
  terminology: Ang “wala kaming pananagutan” ay angkop para sa נְקִיִּם. Pinananatili sa rebisyon ang imahen ng dugo at ulo at ang legal na kahulugan nito sa talababa.
