id: JOS.2.10
reference: Joshua 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: tl
  text: Sapagkat narinig namin kung paanong pinatuyo ni Yahweh ang tubig ng Dagat na Pula[a] sa harapan ninyo nang lumabas kayo sa Ehipto, at kung ano ang ginawa ninyo sa dalawang hari ng mga Amoreo sa ibayo ng Jordan—kina Sihon at Og—na kapwa ninyo itinalaga sa pagkapuksa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Yam Suph, na tradisyonal na isinasaling “Dagat na Pula”; mas literal, “Dagat ng mga Tambo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng takot na binanggit sa konteksto; natural at malinaw ang “Sapagkat” sa Filipino.
- source_word: שָׁמַעְנוּ
  choice: narinig namin
  rationale: Ang aspektong ganap ay tumutukoy sa narinig na balitang may patuloy na epekto; sapat itong naihahayag ng natural na anyong Filipino.
- source_word: הוֹבִישׁ
  choice: pinatuyo
  rationale: Ang Hiphil ng יבש ay causative, “ginawang tuyo” o “pinatuyo”; ang “pinatuyo” ang pinakanatural at tuwiran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na tahasang nasa tekstong Hebreo.
- source_word: מֵי יַם סוּף
  choice: ang tubig ng Dagat na Pula
  rationale: Ginagamit ang nakaugaliang pangalang heograpiko sa Filipino, habang inilalagay sa talababa ang mas literal na “Dagat ng mga Tambo.”
- source_word: מִפְּנֵיכֶם
  choice: sa harapan ninyo
  rationale: Ipinahihiwatig na inalis o pinatuyo ang tubig na nasa daraanan nila; malapit ito sa Hebreo at natural sa Filipino.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: nang lumabas kayo sa Ehipto
  rationale: Natural na ipinapahayag ang temporal na infinitive construct nang hindi nawawala ang kahulugan.
- source_word: עֲשִׂיתֶם
  choice: kung ano ang ginawa ninyo
  rationale: Pinananatili ang malawak at bukas na kahulugan ng pandiwa bago tukuyin sa hulihan ang ganap na paglipol.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: sa dalawang hari ng mga Amoreo
  rationale: Malinaw at malapit sa construct phrase ng Hebreo.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: sa ibayo ng Jordan
  rationale: Maikli at dignidadong paglalarawan sa pook sa kabilang panig ng Jordan mula sa pananaw ng nagsasalita.
- source_word: לְסִיחֹן וּלְעוֹג
  choice: kina Sihon at Og
  rationale: Ang “kina” ay natural na Filipino para sa appositional na pagkilala sa dalawang taong pinangalanan.
- source_word: הֶחֱרַמְתֶּם
  choice: itinalaga ninyo sa pagkapuksa
  rationale: 'Pinananatili nito ang natatanging puwersa ng חרם: inilaan o itinalaga sa ganap na pagkapuksa, hindi lamang tinalo o karaniwang pinatay.'
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Pag-render sa wikang חרם
  choice: itinalaga sa pagkapuksa
  alternative: lubusang nilipol; isinailalim sa pagbabawal
  rationale: Pinananatili nito ang tensiyon sa pagitan ng pagtatalaga at pagkawasak na taglay ng terminong Hebreo, nang hindi ito pinapaliit sa karaniwang pagkatalo sa digmaan o dinaragdagan ng paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit dignidadoso. Ginamit ang “Sapagkat,” “sa ibayo,” at “pagkapuksa” upang mapanatili ang pormal na himig ng salaysay nang manatiling mauunawaan ng karaniwang mambabasa.
