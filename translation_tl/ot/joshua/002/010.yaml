  to: Sapagkat narinig namin kung paanong pinatuyo ni Yahweh ang tubig ng Dagat na Pula[a] sa harapan ninyo nang lumabas kayo sa Ehipto, at kung ano ang ginawa ninyo sa dalawang hari ng mga Amoreo sa ibayo ng Jordan—kina Sihon at Og—na kapwa ninyo itinalaga sa pagkapuksa.
