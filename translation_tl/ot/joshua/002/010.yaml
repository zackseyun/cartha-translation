review_pass:
  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing pagsasalin: naipapahayag ang sanhi, ang patuloy na bigat ng balitang narinig, ang pagpapatuyo ni Yahweh sa tubig ng Yam Suph, ang paglabas mula Ehipto, at ang ḥerem laban kina Sihon at Og. Gayunman, kailangang gawing tahasang maramihan ang huling sugnay, sapagkat ang Hebreong אֹתָם (“sila”) ay tumutukoy sa dalawang hari.'
  naturalness: Natural at angkop ang modernong Filipino Tagalog. Ang “na itinalaga ninyo” pagkatapos ng “Og” ay maaaring basahing tumutukoy lamang kay Og; ang pagdaragdag ng “kapwa” ay nag-aalis ng kalabuang ito nang hindi binabago ang diwa.
  terminology: Ang “Yahweh,” “Dagat na Pula,” “mga Amoreo,” at “itinalaga ... sa pagkapuksa” ay angkop. Pinananatili ng huling parirala ang natatanging kahulugan ng חרם nang hindi nagdaragdag ng paliwanag na wala sa teksto. Ang talababa ay wastong nagbibigay ng literal na alternatibo para sa Yam Suph.
  issues:
  - severity: medium
    issue: Hindi tahasang maramihan ang pinag-uukulan ng “na itinalaga ninyo sa pagkapuksa.”
    rationale: Ang hulíng panghalip sa Hebreo, אֹתָם, ay plural at tumutukoy kina Sihon at Og. Dahil kasunod agad ito ng pangalang “Og,” maaaring maling mabasa ang kasalukuyang Tagalog na para bang si Og lamang ang itinalaga sa pagkapuksa.
  revised_text: Sapagkat narinig namin kung paanong pinatuyo ni Yahweh ang tubig ng Dagat na Pula[a] sa harapan ninyo nang lumabas kayo sa Ehipto, at kung ano ang ginawa ninyo sa dalawang hari ng mga Amoreo sa ibayo ng Jordan—kina Sihon at Og—na kapwa ninyo itinalaga sa pagkapuksa.
