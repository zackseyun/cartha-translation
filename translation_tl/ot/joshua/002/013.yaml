  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: tl
  text: at panatilihin ninyong buhay ang aking ama at ina,[a] ang aking mga kapatid na lalaki at babae, at ang lahat ng kabilang sa kanila;[b] at iligtas ninyo kami sa kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hayaang mabuhay ang aking ama at ina … at iligtas kami mula sa kamatayan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “lahat ng kabilang sa kanila” ay malamang na tumutukoy sa iba pa nilang kasambahay o mga umaasa sa kanila; maaari rin itong isalin nang mas malawak na “lahat ng pag-aari nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: panatilihin ninyong buhay
  rationale: Ang Hiphil ng חיה ay nangangahulugang magpanatili o mag-ingat na buhay. Ang parirala ay natural sa Filipino at malinaw na nagpapanatili sa sanhiang diwa ng pandiwa.
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: aking ama at ina ... aking mga kapatid na lalaki at babae
  rationale: Tahasan nitong sinusundan ang pagkakasunod-sunod ng mga katawagang pampamilya sa Hebreo. Nilinaw ang kasarian ng mga kapatid upang maipakita ang magkahiwalay na pagbanggit sa mga kapatid na lalaki at babae.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: ang lahat ng kabilang sa kanila
  rationale: 'Pinananatili ng saling ito ang lawak at bahagyang kalabuan ng Hebreo: sa konteksto, malamang na mga kasambahay o umaasa sa kanila ang tinutukoy, ngunit maaari ring masaklaw ng parirala ang lahat ng pag-aari nila.'
- source_word: וְהִצַּלְתֶּם
  choice: iligtas ninyo
  rationale: Ang Hiphil ng נצל ay tumutukoy sa aktuwal na pagliligtas mula sa panganib. Karaniwan at marangal ang 'iligtas' sa modernong Filipino.
- source_word: נַפְשֹׁתֵינוּ
  choice: kami
  rationale: Sa kontekstong may banta ng kamatayan, ang נֶפֶשׁ ay tumutukoy sa mga tao o sa kanilang buhay, hindi sa hiwalay na di-materyal na 'kaluluwa.' Ang 'kami' ang pinakanatural na katumbas sa pariralang 'iligtas ang aming mga buhay.'
- source_word: מִמָּוֶת
  choice: sa kamatayan
  rationale: Kasunod ng 'iligtas,' natural na ipinahahayag sa Filipino ng 'sa kamatayan' ang pinagmumulan o kapahamakang dapat matakasan.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural ngunit marangal na modernong Filipino. Ang paulit-ulit na “aking” ay bahagyang pinaikli sa unang pares upang maging maayos ang daloy, samantalang pinanatili ang magkahiwalay na pagbanggit sa mga kapatid na lalaki at babae. Ginamit ang “kami” sa halip na literal ngunit di-likas na “aming mga buhay,” nang hindi ipinapasok ang konsepto ng di-materyal na kaluluwa.
