  text: וַ/יֹּ֧אמְרוּ לָ֣/הּ הָ/אֲנָשִׁ֗ים נַפְשֵׁ֤/נוּ תַחְתֵּי/כֶם֙ לָ/מ֔וּת אִ֚ם לֹ֣א תַגִּ֔ידוּ אֶת דְּבָרֵ֖/נוּ זֶ֑ה וְ/הָיָ֗ה בְּ/תֵת יְהוָ֥ה לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ וְ/עָשִׂ֥ינוּ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: tl
  text: Sinabi sa kanya ng mga lalaki, “Iaalay namin ang aming buhay kapalit ng inyo, hanggang kamatayan, kung hindi ninyo isisiwalat ang usaping ito tungkol sa amin. Kapag ibinigay sa amin ni Yahweh ang lupain, pakikitunguhan ka namin nang may tapat na pag-ibig at katapatan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “pakikitunguhan ka namin nang may kabaitan at katapatan.” Ang tambalang Hebreo na חֶסֶד וֶאֱמֶת ay madalas tumutukoy sa tapat, maaasahan, at matibay na pakikitungo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Tuwirang salin ng אֲנָשִׁים. Bagaman ipinakikilala sila ng konteksto bilang mga espiya, hindi iyon idinagdag sa mismong teksto.
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: Buhay namin ang kapalit ng buhay ninyo, hanggang kamatayan
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa buhay; ang תַּחַת ay nagpapahayag ng paghalili o pagiging kapalit, at pinananatili ng “hanggang kamatayan” ang lakas ng לָמוּת at ang anyong panunumpa ng pahayag.
- source_word: אִם לֹא תַגִּידוּ
  choice: kung hindi ninyo ibubunyag
  rationale: Ang נגד sa Hifil ay maaaring mangahulugang magsabi, mag-ulat, o maghayag. Ang “ibubunyag” ay natural sa konteksto ng isang lihim na misyon. Pinananatili ng “ninyo” ang maramihang anyo ng pandiwa sa Hebreo.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: ang bagay naming ito
  rationale: Maaaring mangahulugan ang דָּבָר ng salita, bagay, o usapin. Hindi labis na tinutukoy ng “bagay naming ito” kung ang tinutukoy ay ang kanilang misyon, kasunduan, o buong lihim na pangyayari.
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: Kapag ibinigay sa amin ni Yahweh ang lupain
  rationale: 'Ipinapahayag ng בְּ kasunod ng infinitive construct ang panahon o kalagayan: “kapag/sa pagbibigay.” Natural sa Tagalog ang ayos na ito at malinaw na si Yahweh ang nagbibigay ng lupain.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: pakikitunguhan ka namin
  rationale: Ang עשה na may עִם ay may diwang kumilos o makitungo sa isang tao. Ang “pakikitunguhan ka namin” ay likas at malinaw sa modernong Tagalog.
- source_word: חֶסֶד וֶאֱמֶת
  choice: katapatan sa tipan at katotohanan
  rationale: Pinananatiling magkahiwalay ang dalawang salitang Hebreo at ang taimtim na bigat ng tapat at maaasahang pananagutan. Iniiwasan nitong paliitin ang חֶסֶד sa pangkalahatang kabaitan lamang, habang isinasalin ang אֱמֶת bilang “katotohanan,” na maaari ring magpahiwatig ng pagiging maaasahan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang tuwirang ginagamit sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong tumutukoy sa Diyos.
- issue: Diwa ng חֶסֶד וֶאֱמֶת
  choice: katapatan sa tipan at katotohanan
  alternative: tapat na pag-ibig at katapatan; kabaitan at katapatan
  rationale: Mayaman at bahagyang idyomatiko ang tambalang Hebreo. Ipinahihiwatig nito ang tapat at maaasahang pagtupad sa ipinangakong pakikitungo, ngunit hindi tahasang binabanggit ng talata ang salitang “tipan.” Kaya pinananatili sa pangunahing teksto ang bigat na pangtipan, habang inilalahad sa talababa ang mas payak na mga posibilidad.
- issue: Pagbabago mula maramihan tungo sa isahan sa kausap
  choice: “ninyo” sa kondisyon at “ka” sa pangako
  alternative: gawing isahan ang dalawang pagtukoy kay Rahab
  rationale: Maramihan ang תַגִּידוּ at תַחְתֵּיכֶם, ngunit isahan ang עִמָּךְ. Pinananatili ng salin ang tunay na pagbabago sa bilang sa Hebreo sa halip na tahimik itong pag-isahin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at taimtim na anyo ng panunumpa, ang personal na pangalang Yahweh, at ang paglipat ng Hebreo mula sa maramihang kausap patungo sa isahan. Ang pariralang “katapatan sa tipan at katotohanan” ay sadyang mas pormal upang mapanatili ang teolohikal at relasyonal na bigat ng חֶסֶד וֶאֱמֶת; nililinaw ng talababa ang mga mas natural na alternatibo.
