revisions:
- from: Sinabi sa kanya ng mga lalaki, “Buhay namin ang kapalit ng buhay ninyo, hanggang kamatayan, kung hindi ninyo ibubunyag ang bagay naming ito. Kapag ibinigay sa amin ni Yahweh ang lupain, pakikitunguhan ka namin nang may katapatan sa tipan at katotohanan.”[a]
  to: Sinabi sa kanya ng mga lalaki, “Iaalay namin ang aming buhay kapalit ng inyo, hanggang kamatayan, kung hindi ninyo isisiwalat ang usaping ito tungkol sa amin. Kapag ibinigay sa amin ni Yahweh ang lupain, pakikitunguhan ka namin nang may tapat na pag-ibig at katapatan.”[a]
  rationale: Inayos ang mga pariralang mabigat sa Tagalog at pinalitan ang teknikal ngunit idinagdag na “katapatan sa tipan at katotohanan” ng mas likas na “tapat na pag-ibig at katapatan.” Pinanatili ang pagkakaiba ng plural na “ninyo” sa kondisyon at singular na “ka” sa pangako, gayundin ang pangalang Yahweh at ang maingat na hindi labis na pagtukoy sa “usapin.”
