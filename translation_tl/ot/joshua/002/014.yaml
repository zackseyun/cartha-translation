  source_fidelity: Ang draft ay wastong kumakatawan sa mga lalaki, sa plural na kausap sa kondisyon, sa singular na kausap sa pangako, at sa pangalang Yahweh. Gayunman, ang “katapatan sa tipan at katotohanan” ay nagdaragdag ng hayag na “tipan,” na wala sa talata, at ang “katotohanan” ay hindi natural na paglalarawan ng ipinangakong pakikitungo sa Tagalog. Ang rebisyon ay mas tapat sa relasyonal at maaasahang bisa ng חֶסֶד וֶאֱמֶת nang hindi nagdaragdag ng isang teknikal na kategorya.
  naturalness: Ang “bagay naming ito” at “Buhay namin ang kapalit ng buhay ninyo” ay nauunawaan ngunit mabigat sa modernong Tagalog. Ang “usaping ito tungkol sa amin” at “Iaalay namin ang aming buhay kapalit ng inyo” ay mas likas, habang pinananatili ang panunumpang paghalili. Ang “nang may tapat na pag-ibig at katapatan” ay mas malinaw at natural na pangako ng pakikitungo.
  terminology: Pinanatili ang “Yahweh.” Isinalin ang חֶסֶד bilang “tapat na pag-ibig” at אֱמֶת bilang “katapatan,” isang natural na pares sa Tagalog na naghahatid ng tapat, maaasahang pakikitungo. Ipinaliliwanag ng talababa ang alternatibong “kabaitan at katapatan” at ang idyomatikong lawak ng Hebreo nang hindi ipinapasok ang hindi tahasang salitang “tipan” sa pangunahing teksto.
