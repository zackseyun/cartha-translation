  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: tl
  text: Ngunit kung ibubunyag mo ang usapin naming ito[a], magiging malaya kami sa panunumpang ipinagawa mo sa amin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bagay naming ito,” “ang salitang ito mula sa amin,” o “ang gawaing ito na may kinalaman sa amin.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa salita, bagay, o usapin; dito, tumutukoy ito sa lihim na bagay ng mga espiya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “magiging malaya” o “walang-sala kami mula sa iyong panunumpa.” Ibig sabihin, hindi na sila nakatali sa panunumpang ipinagawa ni Rahab sa kanila kung ibubunyag niya ang kanilang lihim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ng pang-ugnay at kondisyunal na kataga ang pasalungat na kondisyon kaugnay ng naunang pangako.
- source_word: תַּגִּידִי
  choice: ibubunyag mo
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipahayag o ipaalam; sa konteksto, ang pagbubunyag ng lihim na usapan o misyon ang tinutukoy.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: ang bagay naming ito
  rationale: Maaaring tumukoy ang דָּבָר sa salita, bagay, o usapin. Pinananatili ng salin ang lawak at bahagyang kalabuan ng Hebreo habang natural na tumutukoy sa lihim na kasunduan o gawain ng mga espiya.
- source_word: וְהָיִינוּ נְקִיִּם
  choice: hindi na kami mananagot
  rationale: Ang idyomang היה + נקי ay nagsasaad ng pagiging malaya sa pananagutan o obligasyon, hindi lamang ng moral na kawalang-sala.
- source_word: מִשְּׁבֻעָתֵךְ
  choice: sa sumpa
  rationale: Ipinahihiwatig ng מן ang paglaya mula sa bisa ng sumpa. Sa Filipino, mas natural ang 'mananagot sa sumpa' kaysa literal na 'malaya mula sa iyong sumpa'; ang kaugnayan nito kay Rahab ay malinaw sa kasunod na sugnay.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: na ipinagawa mo sa amin
  rationale: 'Causative ang Hiphil ng שׁבע: si Rahab ang nagpasumpa sa kanila. Ang ''ipinagawa mo sa amin'' ay natural at tumpak na nagpapahayag nito.'
theological_decisions:
- issue: Kahulugan ng נְקִיִּם kaugnay ng sumpa
  choice: hindi na kami mananagot
  alternative: magiging walang-sala kami
  rationale: Sa konteksto, ang punto ay ang paglaya ng mga espiya sa pananagutang dulot ng sumpa kapag ibinunyag ni Rahab ang lihim. Hindi nito ipinapasya ang mas malawak na tanong tungkol sa moral na pagkakasala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ibubunyag” upang ipakita ang lihim na katangian ng bagay, at “hindi na kami mananagot” upang maipahayag nang natural ang idyomang Hebreo tungkol sa paglaya sa obligasyon.
