  text: וַ/תּוֹרִדֵ֥/ם בַּ/חֶ֖בֶל בְּעַ֣ד הַֽ/חַלּ֑וֹן כִּ֤י בֵיתָ/הּ֙ בְּ/קִ֣יר הַֽ/חוֹמָ֔ה וּ/בַֽ/חוֹמָ֖ה הִ֥יא יוֹשָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/015.yaml
  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
translation:
  language: tl
  text: Pagkatapos, ibinaba niya sila gamit ang isang lubid, palabas sa bintana,[a] sapagkat ang bahay niya ay nasa pader ng lungsod, at sa pader siya nakatira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bahay niya ay nasa ibabaw ng pader ng lungsod, at sa ibabaw ng pader siya nakatira.” Inilalarawan ng Hebreo ang tirahan niya bilang nasa loob, nakaugnay sa, o nasa ibabaw ng estruktura ng pader.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: Pagkatapos, ibinaba niya sila
  rationale: Ang Hiphil ng ירד ay causative, ‘pinababa’ o ‘ibinaba.’ Likas sa salaysay na Filipino ang ‘ibinaba niya sila,’ at ipinahihiwatig ng ‘Pagkatapos’ ang pagsulong ng salaysay na dala ng waw-consecutive.
- source_word: בַּחֶבֶל
  choice: gamit ang isang lubid
  rationale: Ang חֶבֶל ay ‘lubid’ o ‘tali,’ at instrumental ang gamit ng pang-ukol. Malinaw at natural sa modernong Filipino ang ‘gamit ang isang lubid.’
- source_word: בְּעַד הַחַלּוֹן
  choice: palabas sa bintana
  rationale: Ipinapahayag ng בְּעַד ang pagdaan sa isang bukasan. Sa konteksto ng pagbaba mula sa bahay, likas na isinasalin itong ‘palabas sa bintana,’ nang hindi dinaragdagan ang kilos.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ang כִּי ng dahilan kung bakit posible ang pagbaba sa kanila sa bintana. Ang ‘sapagkat’ ay malinaw, marangal, at angkop sa salaysay.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: ang bahay niya ay nasa pader ng lungsod
  rationale: Literal na inilalarawan ng parirala ang bahay bilang nasa o kaugnay ng mismong estruktura ng pader. Pinananatili ng ‘nasa pader’ ang posibleng saklaw na ‘nasa loob/nakalapat sa’ o ‘nasa ibabaw,’ habang ang ‘ng lungsod’ ay nililinaw ang kontekstuwal na kahulugan ng חוֹמָה bilang pader ng lungsod.
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: at sa pader siya nakatira
  rationale: Ang יָשַׁב ay maaaring mangahulugang ‘manirahan.’ Pinananatili ang pag-uulit at diin ng Hebreo, pati ang hindi tiyak na puwesto na maipapahayag ng בְּ bilang ‘sa.’
theological_decisions: []
translation_notes:
  register: Gumamit ng natural at dignified na modernong Filipino. Pinanatili ang pag-uulit ng ‘pader’ upang katawanin ang diin ng Hebreo, at iniwasang gawing tiyak ang eksaktong arkitektural na ayos ng bahay.
