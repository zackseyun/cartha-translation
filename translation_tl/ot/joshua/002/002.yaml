  text: וַ/יֵּ֣אָמַ֔ר לְ/מֶ֥לֶךְ יְרִיח֖וֹ לֵ/אמֹ֑ר הִנֵּ֣ה אֲ֠נָשִׁים בָּ֣אוּ הֵ֧נָּה הַ/לַּ֛יְלָה מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/חְפֹּ֥ר אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: tl
  text: May nagsabi sa hari ng Jerico, “Tingnan mo! May mga lalaking dumating dito ngayong gabi mula sa mga Israelita upang siyasatin ang lupain.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “manmanan ang lupain.” Ang pandiwang Hebreo ay maaaring mangahulugang saliksikin o siyasatin; sa kontekstong ito, tumutukoy ito sa lihim na pagkuha ng impormasyon tungkol sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: May nagsabi
  rationale: Nasa anyong balintiyak ang pandiwa at hindi tinutukoy ang nagsalita. Likas sa modernong Tagalog ang di-tiyak na “may nagsabi,” nang hindi nagdaragdag ng tiyak na tagapagbalita.
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: sa hari ng Jerico
  rationale: Tuwirang ipinahahayag ang titulo at ang lungsod na pinamamahalaan niya sa natural na ayos ng Tagalog.
- source_word: לֵאמֹר
  choice: ipinakilala sa pamamagitan ng tuwirang sipi
  rationale: Gumaganap itong pananda sa kasunod na pahayag; sapat at natural sa Tagalog ang paggamit ng panipi.
- source_word: הִנֵּה
  choice: Tingnan mo!
  rationale: Pinupukaw nito ang pansin ng hari sa isang apurahang ulat. Pinananatili ng pautos na isahan ang kausap at ang diin ng Hebreo.
- source_word: אֲנָשִׁים
  choice: mga lalaking
  rationale: Mga lalaki ang tinutukoy sa konteksto, kaya mas tiyak ito kaysa sa pangkalahatang “mga tao.”
- source_word: בָּאוּ הֵנָּה
  choice: dumating dito
  rationale: Malinaw at likas nitong ipinahahayag ang natapos nang pagdating sa lugar ng nagsasalita.
- source_word: הַלַּיְלָה
  choice: ngayong gabi
  rationale: Tumutukoy ito sa gabing kasalukuyan sa salaysay at ito ang karaniwang makabagong pananalita.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: mula sa mga Israelita
  rationale: Ipinahahayag nito ang kanilang pinagmulan o pagiging kabilang sa bayang Israel nang hindi gumagamit ng makalumang literal na “mga anak ni Israel.”
- source_word: לַחְפֹּר
  choice: upang siyasatin
  rationale: Ang pandiwa ay maaaring mangahulugang saliksikin o imbestigahan; sa konteksto, tumutukoy ito sa pagmamanman sa lupain. Pinananatili ng “siyasatin” ang mas malawak na leksikal na diwa.
- source_word: אֶת הָאָרֶץ
  choice: ang lupain
  rationale: Ang “lupain” ay natural at angkop sa teritoryong sinusuri sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “May nagsabi” upang likas na maipahayag ang di-tiyak na tagapagsalita, at pinanatili ang mas malawak na “siyasatin” sa pangunahing teksto habang inilagay sa talababa ang mas tiyak na diwang pagmamanman.
