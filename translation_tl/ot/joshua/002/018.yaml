base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: tl
  text: '“Tingnan mo[a]: Pagpasok namin sa lupain, itali mo ang pulang lubid na ito sa bintanang pinagdaanan namin nang ibinaba mo kami. Tipunin mo sa loob ng iyong bahay ang iyong ama, ina, mga kapatid na lalaki, at ang buong sambahayan ng iyong ama.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Narito.” Sa mas literal na pagkakasabi, “ang lubid/linyang ito ng pulang sinulid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Pakinggan mo
  rationale: Pantawag-pansin ang particle. Likas sa makabagong Tagalog ang “Pakinggan mo” sa isang taimtim na tagubilin at hindi kasing-arkāiko ng “Narito.”
- source_word: בָאִים בָּאָרֶץ
  choice: Pagpasok namin sa lupain
  rationale: Ang participle sa konteksto ay tumutukoy sa inaasahang pagpasok sa lupain; malinaw at natural ang anyong pangyayari na “Pagpasok namin.”
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: ang pulang lubid na ito
  rationale: Tumutukoy ang parirala sa lubid o panandang yari sa sinulid na matingkad na pula. Ang “pulang lubid” ay malinaw at angkop sa gamit nito sa salaysay; pinananatili sa talababa ang mas literal na anyo.
- source_word: תִּקְשְׁרִי
  choice: itali mo
  rationale: Ikalawang panauhang pambabae na pautos o tagubilin sa loob ng kasunduan; tuwiran at natural ang “itali mo.”
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: sa bintanang pinagbabaan mo sa amin
  rationale: Ipinapahayag ng causative verb na pinababa sila ni Rahab. Ang “pinagbabaan mo sa amin” ay natural na Tagalog at malinaw na inuugnay ang bintana sa kanilang pagtakas.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: Tipunin mo sa loob ng iyong bahay
  rationale: Sinasaklaw nito kapwa ang pagtitipon ng mga tao sa kaniya at ang patutunguhang loob ng bahay.
- source_word: אָבִיךְ ... אִמֵּךְ ... אַחַיִךְ
  choice: iyong ama, ina, mga kapatid na lalaki
  rationale: Tiyak na panlalaki ang anyong אַחַיִךְ, kaya tahasang isinalin na “mga kapatid na lalaki” sa halip na ang di-tiyak na “mga kapatid.”
- source_word: כָּל בֵּית אָבִיךְ
  choice: ang buong sambahayan ng iyong ama
  rationale: Ang “sambahayan” ay tumutukoy sa pangkat ng pamilya at mga kasambahay, hindi lamang sa gusali, at pinananatili ang patriyarkal na kayarian ng parirala.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tuwirang pautos upang mapanatili ang tono ng pormal na kasunduan. Isinama ang [a] sa pangunahing teksto at ipinaliwanag sa talababa ang pantawag-pansing particle at ang mas literal na anyo ng parirala tungkol sa pulang tali.
