  text: וַ/יְהִ֨י הַ/שַּׁ֜עַר לִ/סְגּ֗וֹר בַּ/חֹ֨שֶׁךְ֙ וְ/הָ/אֲנָשִׁ֣ים יָצָ֔אוּ לֹ֣א יָדַ֔עְתִּי אָ֥נָה הָלְכ֖וּ הָֽ/אֲנָשִׁ֑ים רִדְפ֥וּ מַהֵ֛ר אַחֲרֵי/הֶ֖ם כִּ֥י תַשִּׂיגֽוּ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: tl
  text: At nang malapit nang isara ang pintuang-bayan sa pagdilim[a], lumabas ang mga lalaki. Hindi ko alam kung saan sila nagpunta. Habulin ninyo sila agad, sapagkat maaabutan ninyo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang madilim na”; ipinahihiwatig ng pariralang Hebreo ang oras ng pagsasara ng pintuang-bayan sa pagsapit ng dilim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nang
  rationale: Ipinakikilala nito ang kasunod na pangyayari bilang temporal na tagpo, sa natural na makabagong Tagalog.
- source_word: הַשַּׁעַר
  choice: ang pintuang-bayan
  rationale: Bagaman literal na “pintuan,” malinaw sa konteksto na ito ang tarangkahan o pintuan ng lungsod; “pintuang-bayan” ay maikli at tiyak.
- source_word: לִסְגֹּר
  choice: isasara na
  rationale: Ipinahihiwatig ng infinitive sa konstruksiyong ito na malapit nang isara ang pintuan.
- source_word: בַּחֹשֶׁךְ
  choice: sa pagdilim
  rationale: Tumutukoy ito sa oras ng pagsasara sa pagsapit ng dilim, hindi lamang sa kalagayang madilim.
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: lumabas ang mga lalaki
  rationale: Pinananatili ang payak at kongkretong galaw ng pandiwang יצא.
- source_word: לֹא יָדַעְתִּי
  choice: Hindi ko alam
  rationale: Sa tuwirang pananalita, ang perpektong anyo ay natural na tumutukoy sa kasalukuyang pag-aangkin ni Rahab na wala siyang alam.
- source_word: אָ֥נָה הָלְכוּ
  choice: kung saan sila nagpunta
  rationale: Likas na Tagalog para sa tanong tungkol sa kanilang pinuntahang lugar o direksiyon.
- source_word: הָאֲנָשִׁים
  choice: sila
  rationale: Ang panghalip ay natural sa Tagalog at malinaw na tumutukoy pa rin sa mga lalaking kababanggit lamang.
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  choice: Dali ninyo silang habulin
  rationale: Ipinapahayag ng “dali ninyo” ang pang-abay na מַהֵר, samantalang likas na sinasaklaw ng “habulin” ang ideya ng pagpunta sa likuran nila.
- source_word: כִּי תַשִּׂיגֻם
  choice: at maaabutan ninyo sila
  rationale: Ang כי rito ay maaaring magpakilala ng batayan o katiyakang kaugnay ng utos. Sa Tagalog, natural na inuugnay ng “at” ang agarang paghahabol sa inaasahang pag-abot, habang pinananatili ng “maaabutan” ang larawan ng pagtugis.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “pintuang-bayan” upang malinaw na tumukoy sa tarangkahan ng Jerico nang hindi nagpapahaba. Ang tuwirang pananalita ay pinanatiling mabilis at kapani-paniwala sa konteksto ng salaysay.
