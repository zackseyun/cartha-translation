translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pintuang-bayan” upang maipahiwatig nang natural ang tarangkahan ng lungsod, at “mga tawiran” upang mapanatili ang pangkalahatang katawagan ng Hebreo nang may paliwanag sa talababa.
