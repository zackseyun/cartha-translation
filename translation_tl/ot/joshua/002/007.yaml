base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: tl
  text: At hinabol sila ng mga lalaki sa daang patungo sa Jordan, hanggang sa mga tawiran[a]. Isinara ang pintuang-bayan matapos lumabas ang mga humahabol upang habulin sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tawiran sa ilog”; ang tinutukoy ay mabababaw na bahagi ng Jordan na maaaring tawirin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: At ... ang mga lalaki
  rationale: Pinananatili ng “At” ang pang-ugnay sa salaysay; ang tiyak na “mga lalaki” ay tumutukoy sa pangkat na isinugo ng hari ayon sa konteksto.
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: hinabol sila
  rationale: Natural at tuwirang Filipino para sa paghabol sa mga tiktik; hindi na kailangan ang literal na “humabol kasunod nila.”
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: sa daang patungo sa Jordan
  rationale: Ipinahahayag ang rutang patungo sa Jordan, habang pinananatili ang diwa ng דֶּרֶךְ bilang daan.
- source_word: עַל הַמַּעְבְּרוֹת
  choice: hanggang sa mga tawiran
  rationale: Sa konteksto ng paglalakbay, ang עַל ay nagsasaad ng hangganan ng paghabol; ang מַעְבְּרוֹת ay mga lugar na maaaring tawiran sa ilog.
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: Isinara ang pintuang-bayan
  rationale: Ang tiyak na singular na “pinto” ay tumutukoy sa tarangkahan ng lungsod; “pintuang-bayan” ang malinaw at natural na katawagan sa Filipino.
- source_word: אַחֲרֵי כַּאֲשֶׁר יָצְאוּ
  choice: pagkalabas
  rationale: 'Maikli at natural na ipinahahayag ang temporal na pagkakasunod: isinara ang tarangkahan matapos lumabas ang mga humahabol.'
- source_word: הָרֹדְפִים אַחֲרֵיהֶם
  choice: mga humahabol sa kanila
  rationale: Pinananatili ang pag-uulit ng ugat na רדף at malinaw na ang mga tiktik ang hinahabol.
