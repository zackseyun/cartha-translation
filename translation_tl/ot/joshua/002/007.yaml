    text: O “mga tawiran sa ilog”; ang tinutukoy ay mabababaw na bahagi ng Jordan na maaaring tawirin.
    reason: lexical_alternative
  revision_rationale: Inayos ang malabong pagkakaugnay ng huling “sa kanila” sa pamamagitan ng tahasang pag-uugnay nito sa paghabol. Pinananatili ang saklaw ng Hebreo, ang hindi-tinutukoy na tagagawa ng pagsara ng pintuang-bayan, at ang talababa para sa mga tawiran.
