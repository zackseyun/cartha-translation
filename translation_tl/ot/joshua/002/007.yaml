review_pass:
  verdict: revise
  source_fidelity: 'Ang unang pangungusap ay tapat sa Hebreo: ang mga lalaki ay humabol sa mga tiktik sa daang patungo sa Jordan hanggang sa mga tawiran. Ang ikalawang pangungusap ay wastong nagpapahiwatig na isinara ang tarangkahan matapos lumabas ang mga humahabol, ngunit ang “pagkalabas ng mga humahabol sa kanila” ay maaaring maling mabasa na para bang lumabas sila mula sa mga tiktik. Nililinaw ng rebisyon ang layuning “upang habulin sila” nang hindi nagdaragdag ng kahulugan.'
  naturalness: Natural ang “mga tawiran” at “pintuang-bayan.” Mas malinaw at mas matatas sa modernong Filipino ang buong sugnay na “matapos lumabas ang mga humahabol upang habulin sila” kaysa sa pangngalang “pagkalabas ... sa kanila.”
  terminology: Ang “Jordan,” “mga tawiran,” at “pintuang-bayan” ay angkop. Pinananatili ang “humahabol” para sa substantibong participle na הָרֹדְפִים at ang pag-uulit ng motibong paghabol.
  issues:
  - severity: medium
    issue: Malabo ang ugnayan ng “pagkalabas ng mga humahabol sa kanila.”
    rationale: Ang “sa kanila” ay nakadikit sa “pagkalabas” at maaaring unawaing pinagmulan o kaugnay ng paglabas, sa halip na layon ng paghabol. Sa Hebreo, ang אַחֲרֵיהֶם ay malinaw na kaugnay ng “mga humahabol/pursuers.”
  revised_text: At hinabol sila ng mga lalaki sa daang patungo sa Jordan, hanggang sa mga tawiran[a]. Isinara ang pintuang-bayan matapos lumabas ang mga humahabol upang habulin sila.
  revised_footnotes:
