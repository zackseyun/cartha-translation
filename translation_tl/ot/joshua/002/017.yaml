  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: tl
  text: At sinabi sa kaniya ng mga lalaki, “Hindi kami mananagot sa sumpang ito na pinasumpa mo sa amin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Malaya kami sa sumpang ito” o “Wala kaming pananagutan sa sumpang ito.” Sa ganitong kontekstong legal o may tipan, ang salitang Hebreo ay tumutukoy sa pagiging malaya sa pananagutan o obligasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi
  rationale: Isinusulong ng wayyiqtol ang salaysay. Pinananatili ng “At sinabi” ang daloy ng Hebreong pagsasalaysay nang natural sa Filipino.
- source_word: אֵלֶיהָ
  choice: sa kaniya
  rationale: Tuwirang katumbas ito ng pang-ukol na אֶל na may hulaping pambabaeng isahan, na tumutukoy kay Rahab.
- source_word: הָאֲנָשִׁים
  choice: ng mga lalaki
  rationale: Karaniwang salitang “mga lalaki” ang ginamit sa Hebreo. Hindi isiningit sa teksto ang mas tiyak na tawag na “mga espiya,” kahit iyon ang papel nila sa konteksto.
- source_word: נְקִיִּם אֲנַחְנוּ
  choice: Hindi kami mananagot
  rationale: Sa kontekstong legal at may panunumpa, ang נָקִי ay nangangahulugang malaya sa pananagutan o obligasyon. Likas sa modernong Filipino ang “hindi kami mananagot,” at ang “kami” ay nagpapanatili sa tahasang panghalip ng Hebreo. Maaari itong tumukoy sa kalagayang bunga ng mga kundisyong susunod, kaya hindi ito nilimitahan sa usaping moral na kawalang-sala.
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: sa sumpa mong ito
  rationale: Ipinahahayag nito ang pagkalaya mula sa obligasyong dulot ng sumpa, habang pinananatili ng “mong” ang hulaping ikalawang panauhang pambabae at ng “ito” ang demonstratibo.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: na pinanumpa mo sa amin
  rationale: 'Causative ang Hiphil ng שׁבע: si Rahab ang nagpapanumpa sa mga lalaki. Iniiwasan nitong ipakahulugang si Rahab lamang ang nanumpa sa kanila.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “hindi kami mananagot” bilang natural na pahayag sa usaping panunumpa at pananagutan; iniwasan ang mas teknikal na “absuwelto” at ang “walang sala,” na maaaring magpahiwatig lamang ng moral na kawalang-kasalanan.
