base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: tl
  text: Ngunit kinuha na ng babae ang dalawang lalaki at itinago sila[a]. Sinabi niya, “Oo, pumunta sa akin ang mga lalaki, ngunit hindi ko alam kung taga-saan sila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang hulapi sa salitang “itinago” (literal, “itinago niya siya/ito”), ngunit ang konteksto ay tumutukoy sa dalawang lalaki bilang isang pangkat; kaya “itinago sila” ang ginamit sa salin.
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: itinago na
  rationale: Sa konteksto, ang pagkuha sa mga lalaki ay bahagi ng naunang pagkilos na nagbunga sa pagtatago sa kanila. Sa natural na Filipino, hindi kailangang isalin nang hiwalay ang literal na ‘kinuha’ kung magiging malabo o paulit-ulit; ipinahihiwatig ng ‘itinago na’ na naipasok na niya sila sa kaniyang pangangalaga bago siya nagsalita.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Tumutukoy ito kay Rahab bilang babae, hindi bilang asawa ng sinuman.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: ang dalawang lalaki
  rationale: Malinaw na dalawang lalaking Israelita ang tinutukoy.
- source_word: וַתִּצְפְּנוֹ
  choice: itinago ... ang dalawang lalaki
  rationale: Bagaman isahan ang hulaping Hebreo (‘siya/ito’), dalawa ang malinaw na tinutukoy sa konteksto; pinananatili sa salin ang maramihang reperente at ipinaliliwanag ang anyong isahan sa talababa.
- source_word: וַתֹּאמֶר
  choice: Sinabi niya
  rationale: Karaniwang panimula ito ng tuwirang pananalita sa salaysay.
- source_word: כֵּן
  choice: Oo
  rationale: Tahasang pinagtitibay ni Rahab ang pagdating ng mga lalaki.
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: pumunta rito sa akin ang mga lalaki
  rationale: Ang ‘pumunta rito sa akin’ ay natural na Filipino at malinaw na nagpapahayag na dumating sila sa kinaroroonan ni Rahab.
- source_word: וְלֹא יָדַעְתִּי
  choice: ngunit hindi ko alam
  rationale: 'Bagaman karaniwang ‘at’ ang waw, adversatibo ang ugnayan dito: inamin niya ang kanilang pagdating ngunit ikinaila ang kaalaman sa kanilang pinagmulan.'
- source_word: מֵאַיִן הֵמָּה
  choice: kung taga-saan sila
  rationale: Ang parirala ay nagtatanong tungkol sa pinagmulan; ‘taga-saan’ ang natural at malinaw na modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang ‘taga-saan’ upang natural na ipahayag ang pinagmulan, at pinanatili ang direkta at maikling himig ng salaysay.
