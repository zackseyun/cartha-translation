  text: וַ/יָּשֻׁ֜בוּ שְׁנֵ֤י הָֽ/אֲנָשִׁים֙ וַ/יֵּרְד֣וּ מֵֽ/הָ/הָ֔ר וַ/יַּעַבְרוּ֙ וַ/יָּבֹ֔אוּ אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וַ/יְסַ֨פְּרוּ ל֔/וֹ אֵ֥ת כָּל הַ/מֹּצְא֖וֹת אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: tl
  text: Bumalik ang dalawang lalaki, bumaba mula sa kabundukan, tumawid, at pumunta kay Josue na anak ni Nun. Isinalaysay nila sa kanya ang lahat ng nangyari sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng sumapit sa kanila”; mas literal, “lahat ng mga bagay na nakasumpong sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Bumalik
  rationale: Ang שוב sa sunod-sunod na salaysay ay likas na tumutukoy sa pagbabalik ng dalawang lalaki mula sa kanilang misyon.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: ang dalawang lalaki
  rationale: Pinananatili ang tahasang salitang Hebreo na 'mga lalaki' sa halip na idagdag ang katawagang 'mga espiya' mula sa konteksto.
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: bumaba mula sa kabundukan
  rationale: Maaaring tumukoy ang הָהָר sa bulubundukin o mataas na rehiyon, hindi lamang sa isang bundok; natural sa Filipino ang 'kabundukan' sa heograpikong kontekstong ito.
- source_word: וַיַּעַבְרוּ
  choice: tumawid
  rationale: Hindi binanggit sa Hebreo ang tahasang layon ng pagtawid, kaya hindi rin ito dinagdagan sa salin.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: pumunta kay Josue na anak ni Nun
  rationale: Natural na salin ng paglapit kay Josue, habang pinananatili ang pagkakakilanlan sa kanya bilang anak ni Nun.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: Isinalaysay nila sa kanya
  rationale: Ipinapahayag ng piel ng ספר ang pagkukuwento o pag-uulat nang buo; ang 'isinalaysay' ay malinaw at marangal sa modernong Filipino.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: ang lahat ng nangyari sa kanila
  rationale: Ang literal na larawan ng mga bagay na 'nakasumpong' sa kanila ay isang idyoma para sa lahat ng sumapit o nangyari sa kanila; pinananatili ng 'lahat' ang kabuuang saklaw ng כָּל.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tradisyonal at madaling makilalang anyong “Josue.” Pinanatiling walang tahasang layon ang “tumawid,” gaya ng Hebreo, at inilagay ang talababa sa pariralang aktuwal nitong nililinaw.
