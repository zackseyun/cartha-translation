id: JOS.2.12
reference: Joshua 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: tl
  text: At ngayon, pakisuyo, manumpa kayo sa akin sa ngalan ni Yahweh na, kung paanong nagpakita ako ng kabutihang-loob sa inyo, magpapakita rin kayo ng kabutihang-loob sa sambahayan ng aking ama at bibigyan ninyo ako ng isang tiyak na tanda[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tunay na tanda,” “maaasahang tanda,” o “mapagkakatiwalaang tanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang paglipat ni Rahab mula sa salaysay tungo sa agarang pakiusap.
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: pakisumpaan ninyo sa akin
  rationale: Likas na makabagong Tagalog para sa maramihang pautos na may magalang at mariing נָא.
- source_word: בַּיהוָה
  choice: sa pangalan ni Yahweh
  rationale: Ipinahahayag ang panunumpang ginagawa sa pamamagitan ng pagtawag sa banal na pangalan, at pinananatili ang pangalang Yahweh.
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: nagpakita ako ng tapat na kabutihan sa inyo
  rationale: Ang 'tapat na kabutihan' ay naghahatid sa katapatan at kagandahang-loob ng חֶסֶד nang hindi ito nililimitahan sa isang teknikal na kahulugang pangtipan.
- source_word: וַעֲשִׂיתֶם גַּם אַתֶּם
  choice: magpapakita rin kayo
  rationale: Ang anyo ay nauunawaan bilang hinihinging tugon sa ilalim ng panunumpa; ang hinaharap ay natural sa Tagalog.
- source_word: בֵּית אָבִי
  choice: sambahayan ng aking ama
  rationale: Pinananatili ang Hebreong diwa ng pamilya o sambahayang pinamumunuan ng ama, hindi lamang ang gusali.
- source_word: אוֹת אֱמֶת
  choice: isang mapagkakatiwalaang tanda
  rationale: Inihahatid ang tanda bilang tunay at maaasahang katiyakan, habang ang ibang posibleng pagbasa ay inilalagay sa talababa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng חֶסֶד
  choice: tapat na kabutihan
  alternative: kabutihan; katapatan sa tipan
  rationale: Pinananatili nito kapwa ang kagandahang-loob at katapatan sa ugnayan, nang hindi ipinapalagay na pormal nang kabilang si Rahab sa tipan.
translation_notes:
  register: Makabago, magalang, at marangal na Filipino. Ginamit ang maramihang “ninyo/kayo” dahil dalawang espiya ang kausap. Ang kuwit sa hulihan ay pinanatili sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
