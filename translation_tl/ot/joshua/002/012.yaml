revisions:
- from: At ngayon, pakisumpaan ninyo sa akin sa pangalan ni Yahweh na, kung paanong nagpakita ako ng tapat na kabutihan sa inyo, magpapakita rin kayo ng tapat na kabutihan sa sambahayan ng aking ama, at bibigyan ninyo ako ng isang mapagkakatiwalaang tanda[a],
  to: At ngayon, pakisuyo, manumpa kayo sa akin sa ngalan ni Yahweh na, kung paanong nagpakita ako ng kabutihang-loob sa inyo, magpapakita rin kayo ng kabutihang-loob sa sambahayan ng aking ama at bibigyan ninyo ako ng isang tiyak na tanda[a],
  rationale: Nilinaw ang panawagan para sa panunumpa, pinasimple ang salin ng ḥesed tungo sa likas na “kabutihang-loob” habang inuulit ito sa dalawang sugnay, at ginawang “tiyak na tanda” ang pangunahing salin ng אוֹת אֱמֶת. Pinanatili ang pangalang Yahweh, ang saklaw na pampamilya ng “sambahayan ng aking ama,” ang maramihang kausap, at ang hulihang kuwit dahil nagpapatuloy ang pangungusap sa susunod na talata.
