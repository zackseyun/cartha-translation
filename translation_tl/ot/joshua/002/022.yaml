base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: tl
  text: Kaya umalis sila at nagtungo sa maburol na lupain[a]. Nanatili sila roon nang tatlong araw, hanggang sa bumalik ang mga humahabol sa kanila. Hinanap sila ng mga humahabol sa buong kahabaan ng daan, ngunit hindi nila sila natagpuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa bundok” o “sa mga burol.” Malamang na tumutukoy ang Hebreo sa maburol na lupain sa kanluran ng Jerico, hindi sa iisang tuktok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: umalis sila at nagtungo
  rationale: Natural na inilalahad sa modernong Tagalog ang sunod-sunod na pagkilos sa Hebreo, habang pinananatili ang dalawang pandiwa.
- source_word: הָהָרָה
  choice: sa maburol na lupain
  rationale: Ang hulaping lokatibo ay nagpapahiwatig ng pagtungo sa lugar; sa konteksto, malamang na rehiyong maburol sa kanluran ng Jerico ang tinutukoy, hindi lamang isang tuktok.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Nanatili sila roon
  rationale: Dito, ang ישׁב ay pansamantalang pananatili, hindi permanenteng paninirahan.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: nang tatlong araw
  rationale: Tuwirang salin ng haba ng pananatili; ang 'nang' ang likas na panandang Tagalog para sa tagal.
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: hanggang sa makabalik ang mga humahabol sa kanila
  rationale: Ang שׁוב ay 'bumalik,' at ang participle na רֹדְפִים ay ginawang likas na pariralang Tagalog; idinagdag ang kontekstuwal na layong 'sa kanila.'
- source_word: וַיְבַקְשׁוּ הָרֹדְפִים
  choice: Hinanap sila ng mga humahabol
  rationale: Sa konteksto ng pagtugis, malinaw na 'hanapin' ang בּקשׁ; ang ipinahihiwatig na layon ay tahasang sinabi para sa natural na Tagalog.
- source_word: בְּכָל הַדֶּרֶךְ
  choice: sa buong kahabaan ng daan
  rationale: Ipinahahayag nito na nagsiyasat sila sa lahat ng bahagi ng rutang dinaanan.
- source_word: וְלֹא מָצָאוּ
  choice: ngunit hindi sila natagpuan
  rationale: Ang 'ngunit' ay natural na naghahayag ng pagsalungat sa kinalabasan; ang ipinahihiwatig na layon na 'sila' ay nilinaw.
