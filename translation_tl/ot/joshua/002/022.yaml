revisions:
- from: Kaya umalis sila at nagtungo sa maburol na lupain[a]. Nanatili sila roon nang tatlong araw, hanggang sa makabalik ang mga humahabol sa kanila. Hinanap sila ng mga humahabol sa buong kahabaan ng daan, ngunit hindi sila natagpuan.
  to: Kaya umalis sila at nagtungo sa maburol na lupain[a]. Nanatili sila roon nang tatlong araw, hanggang sa bumalik ang mga humahabol sa kanila. Hinanap sila ng mga humahabol sa buong kahabaan ng daan, ngunit hindi nila sila natagpuan.
