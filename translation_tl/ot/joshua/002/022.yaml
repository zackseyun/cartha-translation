  source_fidelity: Tumpak na naipapahayag ng draft ang sunod-sunod na pag-alis at pagdating, ang pansamantalang pagtatago nang tatlong araw, ang pagbabalik ng mga humahabol, at ang walang-resultang paghahanap sa buong daan. Gayunman, ang “makabalik” ay bahagyang nakatuon sa posibilidad o inaasahang pagbabalik; ang Hebreo ay simpleng nagsasaad na bumalik sila.
  naturalness: Malinaw at modernong Tagalog ang karamihan ng salin. Mas malinaw ang aktibong “hindi nila sila natagpuan” kaysa sa pasibong “hindi sila natagpuan,” na maaaring hindi agad magtukoy sa mga humahabol bilang nagsagawa ng paghahanap.
  terminology: Ang “maburol na lupain” ay angkop para sa הָהָרָה sa konteksto, at maayos na pinananatili ng talababa ang mga alternatibong “bundok” at “mga burol.” Ang “mga humahabol” ay likas at tapat na katumbas ng substantival participle na “mga pursuer.”
  issues:
