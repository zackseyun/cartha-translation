    issue: “ngunit hindi sila natagpuan”
    rationale: Bagaman mauunawaan, ang pasibong anyo ay hindi gaanong tuwiran at maaaring malabo ang ahente. Tahasang ipinapakita ng “ngunit hindi nila sila natagpuan” na ang mga humahabol ang hindi nakahanap sa kanila.
