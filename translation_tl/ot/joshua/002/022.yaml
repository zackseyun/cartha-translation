    rationale: Ang makabalik ay maaaring magpahiwatig ng kakayahan, posibilidad, o inaasahang pangyayari. Ang “hanggang sa bumalik” ay mas tuwirang katumbas ng עַד שָׁבוּ, “hanggang sa bumalik.”
