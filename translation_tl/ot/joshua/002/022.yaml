translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas sa karaniwang mambabasa. Ginamit ang “maburol na lupain” upang maipahayag ang heograpikong kahulugan nang hindi itinatanggi ang literal na anyong isahan ng Hebreo; kaya pinanatili sa talababa ang mga alternatibo.
