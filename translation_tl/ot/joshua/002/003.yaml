  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ מֶ֣לֶךְ יְרִיח֔וֹ אֶל רָחָ֖ב לֵ/אמֹ֑ר ה֠וֹצִיאִי הָ/אֲנָשִׁ֨ים הַ/בָּאִ֤ים אֵלַ֨יִ/ךְ֙ אֲשֶׁר בָּ֣אוּ לְ/בֵיתֵ֔/ךְ כִּ֛י לַ/חְפֹּ֥ר אֶת כָּל הָ/אָ֖רֶץ בָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: tl
  text: Kaya ipinasabi ng hari ng Jerico kay Rahab, “Ilabas mo ang mga lalaking pumunta sa iyo at pumasok sa bahay mo, sapagkat dumating sila upang siyasatin[a] ang buong lupain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tiktikan.” Sa kontekstong ito, maaaring tumukoy ang pandiwang Hebreo sa lihim na pagsusuri o pagmamanman sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ipinasabi
  rationale: Ipinahihiwatig ng pandiwang ‘nagpadala’ na may mensaheng inihatid kay Rahab. Natural sa modernong Tagalog ang ‘ipinasabi’ at hindi nito tinutukoy kung sino ang mensahero, gaya rin ng Hebreo.
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: hari ng Jerico
  rationale: 'Tuwirang ipinapahayag ang ugnayang construct: ang hari na namamahala sa Jerico.'
- source_word: אֶל רָחָב
  choice: kay Rahab
  rationale: Minamarkahan ng אֶל ang tumanggap ng ipinadalang mensahe.
- source_word: לֵאמֹר
  choice: ipinasabi … “…”
  rationale: Ang quotative infinitive ay likas na naipapaloob sa Tagalog na ‘ipinasabi’ bago ang tuwirang sipi.
- source_word: הוֹצִיאִי
  choice: Ilabas mo
  rationale: Pinananatili ang tuwirang utos sa isang babaeng kausap; hindi kailangang markahan sa pandiwang Tagalog ang kasarian.
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Partikular na tumutukoy ang pangngalan dito sa mga lalaking dumating kay Rahab.
- source_word: הַבָּאִים אֵלַיִךְ
  choice: mga lalaking pumunta sa iyo
  rationale: Ginawang sugnay na panuring ang participle, na may nakaraang kilos ayon sa konteksto.
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: at pumasok sa bahay mo
  rationale: Ipinahahayag ang pagdating sa loob ng bahay at iniiwasan ang alanganing pag-uulit ng ‘pumunta,’ nang hindi binabago ang diwa.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng utos sa isang marangal ngunit karaniwang rehistro.
- source_word: לַחְפֹּר
  choice: upang siyasatin
  rationale: Saklaw ng ‘siyasatin’ ang masusing pag-alam sa lupain nang hindi agad nilulutas sa pangunahing teksto kung militar na paniniktik ang tiyak na diin.
- source_word: אֶת כָּל הָאָרֶץ
  choice: ang buong lupain
  rationale: Ang הָאָרֶץ ay tumutukoy sa lupain o rehiyong pinag-uusapan, hindi sa buong daigdig.
- source_word: בָּאוּ
  choice: dumating sila
  rationale: Natural na nakaraang aspekto sa Tagalog, habang nananatiling dahilan ng kasalukuyang utos ang kanilang pagdating.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “ipinasabi” upang idiomatikong katawanin ang pagpapadala ng hari ng mensahe nang hindi nagdaragdag ng tahasang mensahero. Inilagay ang talababa sa “siyasatin,” ang salitang talagang may leksikal na alternatibo.
