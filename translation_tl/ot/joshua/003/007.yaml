source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Josue, “Sa araw na ito, sisimulan kitang gawing dakila sa paningin ng buong Israel,[a] upang malaman nila na kung paanong ako ay kasama ni Moises, ako rin ay sasaiyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sisimulan kitang itaas sa harap ng buong Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Karaniwang salaysay na anyo ito ng אמר, kaya likas sa modernong Tagalog ang “sinabi.”
- source_word: הַיּוֹם הַזֶּה
  choice: Sa araw na ito
  rationale: Tuwirang pinananatili ang diin ng pariralang Hebreo sa partikular na araw, habang nananatiling natural sa Tagalog.
- source_word: אָחֵל
  choice: sisimulan
  rationale: Ang anyong hiphil dito ay nangangahulugang “magsimula”; ipinahahayag ng konteksto ang nalalapit na gagawin ni Yahweh.
- source_word: גַּדֶּלְךָ
  choice: kitang gawing dakila
  rationale: Ipinahihiwatig ng piel ng גדל ang pagpapadakila o pagpapataas ng katayuan ni Josue sa pagkilala ng bayan, hindi lamang ang literal na pagpapalaki.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: sa paningin ng buong Israel
  rationale: Pinananatili nito ang idyomang Hebreo at malinaw na tumutukoy sa hayag na pagkilala ng buong Israel.
- source_word: אֲשֶׁר יֵדְעוּן
  choice: upang malaman nila
  rationale: Likas na ipinahahayag sa Tagalog ang layunin o nilalayong bunga ng pagpapadakila kay Josue.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: kung paanong kasama ako ni Moises
  rationale: Pinananatili ang tahasang paghahambing ng presensiya ni Yahweh kay Moises at kay Josue.
- source_word: אֶהְיֶה עִמָּךְ
  choice: gayundin ay makakasama mo ako
  rationale: Malinaw na naghahayag ng pangako ng patuloy na presensiya ng Diyos at natural na kinukumpleto ang paghahambing sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinanatili ang pangalang “Yahweh” sa halip na palitan ng titulong “Panginoon.”
- issue: Ugnayan ng presensiya ni Yahweh kay Moises at kay Josue
  choice: kung paanong kasama ako ni Moises, gayundin ay makakasama mo ako
  alternative: kung paanong tinulungan ko si Moises, tutulungan din kita
  rationale: Pinanatili ang mas malawak at teolohikong makahulugang wika ng banal na presensiya; hindi ito nilimitahan sa ideya lamang ng pagtulong.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Josue,” ang nakaugaliang anyo ng pangalang Joshua sa Tagalog. Pinanatili ang Hebreong idyoma na “sa paningin” dahil malinaw at natural pa rin ito sa kasalukuyang gamit.
