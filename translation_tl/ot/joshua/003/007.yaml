  verdict: revise
  source_fidelity: May isang mahalagang paglihis sa huling paghahambing. Ang Hebreo ay nagsasabing si Yahweh ay kasama ni Moises at magiging kasama ni Josue. Ang draft na “makakasama mo ako” ay bumabaligtad sa paksa at maaaring mangahulugang si Josue ang sasama kay Yahweh.
  naturalness: Natural at angkop sa modernong Filipino Tagalog ang karamihan ng salin. Mas tuwiran at mas malinaw ang “ako rin ay sasaiyo” para sa pangako ng presensiya.
  terminology: Wasto ang “Yahweh,” “Josue,” “Moises,” at “dakila.” Ang “sa paningin ng buong Israel” ay angkop na katumbas ng pampublikong pagkilala sa Hebreo.
  issues:
