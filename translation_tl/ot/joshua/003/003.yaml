  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: tl
  text: Iniutos nila sa bayan, “Kapag nakita ninyo ang kaban ng tipan ni Yahweh na inyong Diyos at ang mga paring Levita[a] na nagdadala nito, umalis kayo sa inyong kinaroroonan at sumunod dito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga pari, mga Levita.”
    reason: Pinananatili ang posibleng appositional na pagbasa ng הַכֹּהֲנִים הַלְוִיִּם.
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: Iniutos nila
  rationale: Pinananatili ng “iniutos” ang awtoritatibong diwa ng piel ng צוה at natural ito sa makabagong Tagalog.
- source_word: הָעָם
  choice: sa bayan
  rationale: Tumutukoy ang עַם sa buong kapulungan ng Israel bilang isang sambayanan; ang “bayan” ay malinaw at likas sa kontekstong ito.
- source_word: כִּרְאוֹתְכֶם
  choice: Kapag nakita ninyo
  rationale: Temporal ang gamit ng כְּ kasama ng infinitive construct; hindi nito kailangang ipahiwatig ang mas tiyak na “sa sandaling.”
- source_word: אֲרוֹן בְּרִית
  choice: ang kaban ng tipan
  rationale: Ang “kaban ng tipan” ang malinaw at nakaugaliang katawagan sa sagradong lalagyan ng tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: na inyong Diyos
  rationale: Likas na ipinapahayag nito sa Tagalog ang pangtipang pariralang “Yahweh na inyong Diyos.”
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: mga paring Levita
  rationale: Malinaw nitong ipinakikilalang mga Levita ang mga paring tinutukoy, habang inilalagay sa talababa ang posibleng appositional na pagbasa.
- source_word: נֹשְׂאִים אֹתוֹ
  choice: na pasan
  rationale: Ang נשא ay nangangahulugang magdala o pumasan; ang “pasan” ay angkop sa seremonyal na pagbuhat sa kaban.
- source_word: תִּסְעוּ מִמְּקוֹמְכֶם
  choice: umalis kayo sa inyong kinaroroonan
  rationale: Ipinahahayag nito ang pagsisimula ng paglalakbay mula sa kanilang lugar nang hindi dinaragdagan ang teksto ng tahasang “magligpit ng kampo.”
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: at sumunod dito
  rationale: Ang הלך אחרי ay natural na nangangahulugang humayo sa likuran o sumunod; malinaw sa “dito” na ang kaban ang tinutukoy.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Ugnayan ng הַכֹּהֲנִים at הַלְוִיִּם
  choice: mga paring Levita
  alternative: mga pari, ang mga Levita
  rationale: Maaaring unawain ang ikalawang pangngalan bilang panuring o apposition. Pinili sa teksto ang natural na “mga paring Levita,” ngunit pinananatili sa talababa ang mas pormal na estruktura upang hindi maitago ang anyo at posibleng diin ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino; iniwasan ang labis na arkaikong pananalita. Ginamit ang “kaban ng tipan” bilang pamilyar na katawagang biblikal, at inilagay ang tandang [a] kaagad pagkatapos ng pariralang tinatalakay ng talababa.
