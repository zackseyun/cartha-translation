id: JOS.3.13
reference: Joshua 3:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: tl
  text: Kapag lumapat sa tubig ng Jordan ang mga talampakan ng mga paring nagdadala ng Kaban ni Yahweh[a], ang Panginoon ng buong lupa, mapuputol ang tubig ng Jordan; at ang tubig na bumababa mula sa itaas[b] ay titindig bilang isang bunton.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang Kaban ng Panginoon ng buong lupa.” Maaaring iugnay nang mas malapit sa “Kaban” ang pariralang Hebreo na “Panginoon ng buong lupa,” bagaman itinuturing ito ng pangunahing teksto na titulo ni Yahweh.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “na nagmumula sa gawing itaas ng ilog.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: At mangyayari na kapag lumapat
  rationale: Ang וְהָיָה ay nagpapakilala ng tiyak na mangyayaring kalagayan, at ang כְּנוֹחַ ay temporal na ‘kapag/as soon as’ mula sa נוח, ‘magpahinga, lumapat.’ Natural sa Filipino ang ‘kapag lumapat’ para sa pagdampi at pananatili ng mga talampakan sa tubig.
- source_word: כַּפּוֹת רַגְלֵי
  choice: ang mga talampakan
  rationale: Tumutukoy ang כַּף sa ilalim o talampakan ng paa. Sapat at tiyak ang ‘mga talampakan’ sa modernong Filipino.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: ang mga paring pasan ang Kaban
  rationale: Ang participle na נֹשְׂאֵי ay naglalarawan sa mga paring nagdadala. Ang ‘pasan’ ay kongkreto at angkop sa sagradong kaban; ginawang malaking titik ang Kaban bilang natatanging banal na bagay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: ang Panginoon ng buong lupa
  rationale: Ang אֲדוֹן ay titulong nagpapahayag ng kapamahalaan. Ang ‘Panginoon ng buong lupa’ ay dignified at natural, at sa pangunahing teksto ay appositional na titulo ni Yahweh.
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: sa tubig ng Jordan
  rationale: Ang בְּ ay tumutukoy sa pagdampi o pagkalapat sa tubig. Natural sa Filipino ang ‘sa tubig ng Jordan’ at hindi nito ipinipilit kung gaano kalalim ang pagpasok.
- source_word: יִכָּרֵתוּן
  choice: mapuputol ... ang agos
  rationale: Ang Niphal ng כרת ay ‘maputol/maihiwalay.’ Idinagdag ang ‘agos’ bilang natural na Filipino na paglilinaw sa tubig na humihinto, habang pinananatili ang matingkad na larawan ng pagkaputol.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: ang agos ng tubig na bumababa mula sa itaas
  rationale: Pinananatili ng ‘bumababa mula sa itaas’ ang literal na direksiyon ng Hebreo; sa konteksto ng ilog, maaari rin itong unawain bilang nagmumula sa gawing itaas ng ilog.
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: at maiipon iyon na parang iisang bunton
  rationale: Literal na nagsasaad ang pandiwa ng ‘tatayo,’ ngunit sa tubig ang natural na Filipino ay ‘maiipon.’ Pinananatili ng ‘parang iisang bunton’ ang kongkretong larawan ng נֵד אֶחָד nang hindi nagpapahiwatig na literal na lupa ang tubig.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; ang transliterasyong ‘Yahweh’ ang nagpapanatili rito bilang personal na pangalan at hindi bilang karaniwang titulo.
- issue: Ugnayan ng ‘Panginoon ng buong lupa’ sa naunang parirala
  choice: 'Appositional na titulo ni Yahweh: ‘Kaban ni Yahweh, ang Panginoon ng buong lupa’'
  alternative: 'Isang pinagsamang pangalan ng Kaban: ‘Kaban ng Panginoon ng buong lupa’'
  rationale: Maaaring iugnay sa dalawang paraan ang sunod-sunod na mga parirala sa Hebreo. Pinili ng pangunahing teksto ang natural na pagbasa na kinikilala si Yahweh bilang Panginoon ng buong lupa, ngunit itinala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘pasan’ at ‘lumapat’ para sa kongkretong kilos, at iniwasan ang sobrang arkaiko o teknikal na pananalita. Ang mga marker na [a] at [b] ay parehong nasa pangunahing teksto.
