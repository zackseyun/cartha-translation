revisions:
- from: At mangyayari na kapag lumapat sa tubig ng Jordan ang mga talampakan ng mga paring pasan ang Kaban ni Yahweh[a], ang Panginoon ng buong lupa, mapuputol sa Jordan ang agos ng tubig na bumababa mula sa itaas[b], at maiipon iyon na parang iisang bunton.
  to: Kapag lumapat sa tubig ng Jordan ang mga talampakan ng mga paring nagdadala ng Kaban ni Yahweh[a], ang Panginoon ng buong lupa, mapuputol ang tubig ng Jordan; at ang tubig na bumababa mula sa itaas[b] ay titindig bilang isang bunton.
  rationale: Inalis ang hindi kinakailangang mabigat na pambungad, ginawang mas tuwiran ang paglalarawan sa mga paring nagdadala ng Kaban, at itinama ang huling larawan upang ipahayag ang aktuwal na pagtindig ng tubig bilang isang bunton sa halip na paghahambing lamang. Pinananatili rin ng rebisyon ang inuulit na pagtukoy sa tubig ng Jordan at ang dalawang footnote anchor.
