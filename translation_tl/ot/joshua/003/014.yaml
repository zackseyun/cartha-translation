base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: tl
  text: At nangyari, nang umalis ang mga tao mula sa kanilang mga tolda upang tumawid sa Jordan, ang mga paring nagdadala ng Kaban ng Tipan ay nasa harapan ng mga tao[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa unahan ng mga tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili ang pormulang pasalaysay ng Hebreo na naghuhudyat ng kasunod na pangyayari, nang hindi gumagamit ng makalumang pananalita.
- source_word: בִּנְסֹעַ הָעָם
  choice: nang umalis ang mga tao
  rationale: Ang ב na kasama ng infinitive construct ng נסע ay nagpapahayag ng panahong kasabay ng pangunahing pangyayari; natural sa Filipino ang “nang umalis” para sa pag-alis mula sa kampo.
- source_word: מֵאָהֳלֵיהֶם
  choice: sa kanilang mga tolda
  rationale: Tuwirang tinutukoy ng אֹהֶל ang tolda; ang pang-ukol na “sa” matapos ang “umalis” ay likas na katumbas ng Hebreong “mula sa.”
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: upang tumawid sa Jordan
  rationale: Ipinahahayag ng infinitive ang layunin ng pag-alis; malinaw at natural ang “tumawid sa Jordan” sa konteksto ng ilog.
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי
  choice: ang mga paring may pasan
  rationale: Inilalarawan ng participial/nominal na anyo ang mga pari bilang mga tagapagdala. Ang “may pasan” ay likas at nagpapahiwatig ng aktuwal na pagbubuhat.
- source_word: הָאָרוֹן הַבְּרִית
  choice: Kaban ng Tipan
  rationale: Ito ang malinaw at nakaugaliang terminong Filipino para sa sagradong kaban na kaugnay ng tipan.
- source_word: לִפְנֵי הָעָם
  choice: nangunguna sa mga tao
  rationale: Ipinahahayag ng לִפְנֵי ang puwestong nasa harapan; sa konteksto ng paglalakbay, natural na ipinahihiwatig ng “nangunguna” na nasa unahan sila ng bayan.
