  source_fidelity: 'Ang “nangunguna sa mga tao” ay maaaring magpahiwatig na sila ang namumuno o nangunguna sa pagkilos, samantalang ang לִפְנֵי הָעָם ay pangunahing nagsasaad ng kinalalagyan: nasa harapan ng mga tao. Mas tuwiran ding isalin ang מֵאָהֳלֵיהֶם bilang “mula sa kanilang mga tolda.”'
