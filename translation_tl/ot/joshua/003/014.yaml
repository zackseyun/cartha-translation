  terminology: Ang “mga pari,” “Kaban ng Tipan,” at “Jordan” ay angkop at matatag na mga termino. Ang “mga paring may pasan” ay nauunawaan, ngunit mas payak at malinaw ang “mga paring nagdadala.”
