source:
  edition: WLC
  text: וַ/יַּשְׁכֵּם֩ יְהוֹשֻׁ֨עַ בַּ/בֹּ֜קֶר וַ/יִּסְע֣וּ מֵֽ/הַ/שִּׁטִּ֗ים וַ/יָּבֹ֨אוּ֙ עַד הַ/יַּרְדֵּ֔ן ה֖וּא וְ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּלִ֥נוּ שָׁ֖ם טֶ֥רֶם יַעֲבֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: tl
  text: Maagang bumangon si Josue nang umagang iyon. Umalis sila mula sa Shitim at dumating sa Jordan—siya at ang lahat ng anak ni Israel[a]. Nagpalipas sila ng gabi roon bago sila tumawid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng mga Israelita.” Sa Hebreo, “lahat ng anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Maagang bumangon si Josue kinaumagahan
  rationale: Pinananatili ang diin ng pandiwang Hiphil sa maagang pagbangon at ang hiwalay na pariralang tumutukoy sa umaga, gamit ang likas na ayos sa modernong Tagalog.
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa salaysay ng paglalakbay, ipinahihiwatig ng pandiwa ang pag-alis o pagsisimula ng paglalakbay mula sa kampo. Ang “umalis sila” ay malinaw at natural sa Tagalog.
- source_word: מֵהַשִּׁטִּים
  choice: mula sa Shitim
  rationale: Isinalin bilang transliteradong pangalan ng lugar sa halip na gawing “Kakahuyan ng Akasya,” sapagkat toponimo ito sa konteksto.
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: dumating sa Jordan
  rationale: Ipinahahayag ng parirala ang pagdating hanggang sa Jordan. Ang “dumating sa Jordan” ay maikli, malinaw, at tapat sa direksiyon ng kilos.
- source_word: הוּא וְכָל בְּנֵי יִשְׂרָאֵל
  choice: siya at ang lahat ng mga anak ni Israel
  rationale: Pinananatili ang tahasang panghalip na tumutukoy kay Josue at ang anyong pampamilya ng Hebreong parirala. Dahil hindi gramatikal na minamarkahan ng “anak” ang kasarian sa Tagalog, naiiwasan din ang maling pahiwatig na mga lalaking Israelita lamang ang tinutukoy.
- source_word: וַיָּלִנוּ שָׁם
  choice: Nagpalipas sila ng gabi roon
  rationale: Likas na modernong Tagalog para sa pananatili nang magdamag.
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: bago sila tumawid
  rationale: Malinaw na ipinapakita ng “bago” ang naunang panahon, at sapat na ipinahihiwatig ng konteksto ng Jordan kung ano ang kanilang tatawirin.
theological_decisions:
- issue: Paglilipat ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Walang doktrinal na usaping ipinapasya rito. Pinananatili ng pangunahing teksto ang anyong angkan ng Hebreo, samantalang inilalagay sa talababa ang mas idyomatikong kolektibong katawagan. Hindi dinaragdagan ng “na lalaki” sapagkat ang Hebreong panlalaking maramihan ay gamit dito bilang pambansang katawagan at maaaring maling paliitin ng gayong Tagalog ang saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Josue,” “Shitim,” at “Jordan” bilang pamilyar na mga anyong pantanging pangalan. Inilipat ang pananda ng talababa sa pariralang aktuwal nitong tinutukoy.
