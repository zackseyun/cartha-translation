translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lipi” bilang karaniwang katawagan sa mga tribo ng Israel at ang “tig-iisa” upang natural na maipahayag ang Hebreong distributibong pag-uulit.
