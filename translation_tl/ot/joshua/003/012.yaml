translation:
  language: tl
  text: Ngayon, kumuha kayo ng labindalawang lalaki mula sa mga lipi ng Israel—tig-iisang lalaki mula sa bawat lipi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “isang lalaki, isang lalaki para sa lipi,” isang distributibong pahayag na nangangahulugang tig-iisang kinatawan mula sa bawat lipi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Likas na panandang diskurso sa modernong Filipino para sa susunod na tagubilin; hindi kailangang isalin nang hiwalay ang pang-ugnay na וְ.
- source_word: קְחוּ לָכֶם
  choice: kumuha kayo para sa inyong sarili
  rationale: Pinananatili ang pautos na diwa ng לקח at ang pakinabang o layuning ipinahihiwatig ng לָכֶם, bagaman sa Filipino ay bahagyang pormal ang buong parirala.
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: labindalawang lalaki
  rationale: Ang אִישׁ sa kontekstong ito ay tumutukoy sa mga lalaking kinatawan, kaya hindi ginawang neutral sa kasarian.
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: mula sa mga lipi ng Israel
  rationale: Tuwirang ipinapahayag ang pinagmulan ng mga pipiliing lalaki at natural sa Filipino.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: tig-iisang lalaki mula sa bawat lipi
  rationale: Ang 'tig-iisa' ay natural na Filipino para sa distributibong pag-uulit sa Hebreo at malinaw na nagsasaad ng isang kinatawan sa bawat lipi.
