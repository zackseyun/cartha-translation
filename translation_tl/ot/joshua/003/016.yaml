  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעַמְד֡וּ הַ/מַּיִם֩ הַ/יֹּרְדִ֨ים מִ/לְ/מַ֜עְלָ/ה קָ֣מוּ נֵד אֶחָ֗ד הַרְחֵ֨ק מְאֹ֜ד ב/אדם הָ/עִיר֙ אֲשֶׁר֙ מִ/צַּ֣ד צָֽרְתָ֔ן וְ/הַ/יֹּרְדִ֗ים עַ֣ל יָ֧ם הָ/עֲרָבָ֛ה יָם הַ/מֶּ֖לַח תַּ֣מּוּ נִכְרָ֑תוּ וְ/הָ/עָ֥ם עָבְר֖וּ נֶ֥גֶד יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: tl
  text: Ang tubig na umaagos mula sa itaas ay tumigil; tumindig ito bilang iisang bunton[a], napakalayo, sa Adam, ang lungsod na nasa tabi ng Zaretan. Ang tubig naman na umaagos patungo sa Dagat ng Araba, ang Dagat na Maalat[b], ay lubusang naputol, at tumawid ang bayan sa tapat ng Jerico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tumindig bilang isang bunton.” Inilalarawan ng Hebreo ang tubig na nagsama-sama at naging isang nakatayong tumpok o harang.
    reason: lexical_alternative
  - marker: b
    text: Ang “Dagat na Maalat” ay ang anyong-tubig na karaniwang tinatawag ngayon na Patay na Dagat.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: tumigil
  rationale: Sa konteksto, ang עמד ay tumutukoy sa paghinto ng normal na pag-agos ng tubig; natural at malinaw ito sa makabagong Tagalog.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: ang tubig na umaagos mula sa itaas
  rationale: Pinananatili ang direksiyon mula sa mas mataas na bahagi o upstream nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: קָמוּ נֵד אֶחָד
  choice: naipon ito na parang iisang bunton
  rationale: Inilalarawan ng parirala ang tubig na nagsama-sama bilang isang nakatayong tumpok o harang; pinananatili ng 'iisang bunton' ang kongkretong larawan.
- source_word: הַרְחֵק מְאֹד
  choice: sa napakalayong lugar
  rationale: Ipinahahayag ang pinatinding diwa ng malaking distansiya sa natural na Tagalog.
- source_word: בְאָדָם
  choice: sa Adam
  rationale: Ang אדם dito ay pangalan ng lugar, hindi ang karaniwang pangngalan para sa tao.
- source_word: הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: ang lungsod na nasa tabi ng Zaretan
  rationale: Ang מִצַּד ay nagpapahiwatig ng pagiging katabi o malapit; ang 'nasa tabi' ay tuwiran at natural.
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: Ang tubig naman na umaagos patungo sa Dagat ng Araba
  rationale: Nililinaw ang ipinahihiwatig na 'tubig' at pinananatili ang direksiyonal na puwersa ng parirala patungo sa dagat.
- source_word: יָם הַמֶּלַח
  choice: ang Dagat na Maalat
  rationale: Tuwirang isinasalin ang Hebreong pangalan sa halip na palitan ito ng mas huling karaniwang tawag na Patay na Dagat.
- source_word: תַּמּוּ נִכְרָתוּ
  choice: ay lubusang naputol
  rationale: Ang magkatambal na pandiwa ay nagdiriin sa ganap na paghinto at pagkaputol ng agos.
- source_word: וְהָעָם עָבְרוּ
  choice: Kaya tumawid ang bayan
  rationale: Ang 'tumawid' ay likas sa konteksto ng pagtawid sa Jordan; ang 'bayan' ay tumutukoy sa sambayanan, hindi sa isang lungsod.
- source_word: נֶגֶד יְרִיחוֹ
  choice: sa tapat ng Jerico
  rationale: Tumpak na ipinahahayag ng 'sa tapat ng' ang heograpikong posisyong kaharap o katapat ng Jerico.
