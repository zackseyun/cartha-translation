translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang baybay-Filipino na Zaretan at Jerico, samantalang pinanatili ang Adam bilang pangalan ng lugar. Iningatan ang kongkretong larawan ng tubig na naipon bilang iisang bunton at ang dobleng diin ng Hebreo sa ganap na pagkaputol ng agos.
