  to: Ang tubig na umaagos mula sa itaas ay tumigil; tumindig ito bilang iisang bunton[a], napakalayo, sa Adam, ang lungsod na nasa tabi ng Zaretan. Ang tubig naman na umaagos patungo sa Dagat ng Araba, ang Dagat na Maalat[b], ay lubusang naputol, at tumawid ang bayan sa tapat ng Jerico.
  rationale: Inalis ang “parang” upang hindi gawing paghahambing ang tuwirang imahen ng tubig na tumindig bilang isang bunton. Pinalitan ang “Kaya” ng “at” upang mapanatili ang payak na pag-uugnay ng Hebreo. Inayos din ang posisyon ng “napakalayo” para sa mas natural na daloy sa Tagalog, nang hindi binabago ang heograpikong pagtukoy.
