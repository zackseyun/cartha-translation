  terminology: Panatilihin ang “kaban ng tipan” at “Panginoon ng buong daigdig.” Ang pagdaragdag ng “ng” bago sa titulo ay hindi dagdag-doktrina kundi kinakailangang paglilinaw ng ugnayang panggramatika sa Filipino.
