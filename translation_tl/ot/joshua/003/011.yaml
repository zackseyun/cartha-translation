base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: tl
  text: Narito, ang kaban ng tipan ng Panginoon ng buong daigdig ay tumatawid sa Jordan[a] sa unahan ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “papasok sa Jordan.” Maaari ring magkaroon ng direksiyonal na diwa ang pariralang Hebreo sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Isang pantawag-pansin na may diwang pandama at agarang pagharap sa pangyayari; likas at marangal ito sa makabagong Filipino.
- source_word: אֲרוֹן הַבְּרִית
  choice: ang kaban ng tipan
  rationale: Tuwirang ipinapakita ang ugnayang construct ng dalawang pangngalan at ginagamit ang karaniwang katawagang biblikal sa Filipino.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: ang Panginoon ng buong daigdig
  rationale: Ipinahahayag ng אָדוֹן ang soberanong kapangyarihan. Ang “Panginoon” ang likas na titulong Filipino, at ang “buong daigdig” ay malinaw na nagpapakita ng saklaw na pansansinukob.
- source_word: עֹבֵר
  choice: ay tumatawid
  rationale: Pinananatili ng aspektong imperpektibo ng participle ang masigla at nalalapit o nagaganap na kilos, sa halip na gawin itong payak na pahayag sa hinaharap.
- source_word: לִפְנֵיכֶם
  choice: sa unahan ninyo
  rationale: Malinaw na ipinakikitang nauuna ang kaban sa pagkilos ng bayan.
- source_word: בַּיַּרְדֵּן
  choice: sa Jordan
  rationale: Malapit ito sa anyong Hebreo at likas sa Filipino kasama ng “tumatawid”; maaaring ipahiwatig ng konteksto ang pagtawid sa ilog o pagpasok dito.
theological_decisions:
- issue: Ang ugnayan ng אֲדוֹן כָּל הָאָרֶץ sa “kaban ng tipan”
  choice: 'Pinanatili bilang matinding apposition: “ang kaban ng tipan—ang Panginoon ng buong daigdig—”'
  alternative: “ang kaban ng tipan ng Panginoon ng buong daigdig”
  rationale: Pinaghihiwalay ng Masoretic accent sa הַבְּרִית ang kasunod na titulo, kaya hindi tahasang idinagdag ang “ng.” Pinananatili ng mga gitling ang kapansin-pansin at teolohikal na maigting na pagkakaugnay ng presensiya ng Panginoon at ng kaban nang hindi ipinapaliwanag o pinapawi ang ambiguwidad.
- issue: Pagsasalin sa titulong אֲדוֹן כָּל הָאָרֶץ
  choice: ang Panginoon ng buong daigdig
  alternative: ang amo ng buong daigdig
  rationale: Ang “Panginoon” ay angkop sa titulong nagsasaad ng soberanya at hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Narito” bilang malinaw na pantawag-pansin, “kaban ng tipan” bilang pamilyar na terminong biblikal, at mga gitling upang mapanatili ang di-pangkaraniwang apposition ng tekstong Hebreo.
