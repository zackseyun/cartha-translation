source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל הַ/כֹּהֲנִ֣ים לֵ/אמֹ֔ר שְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וְ/עִבְר֖וּ לִ/פְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וַ/יֵּלְכ֖וּ לִ/פְנֵ֥י הָ/עָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Josue sa mga pari, “Buhatin ninyo ang Kaban ng Tipan at tumawid kayo sa unahan ng sambayanan.” Kaya binuhat nila ang Kaban ng Tipan at naglakad sa unahan ng sambayanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa sunod-sunod na salaysay. Likas sa makabagong Filipino ang “Pagkatapos, sinabi” at malinaw nitong ipinakikita ang pagkakasunod ng mga pangyayari.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Tuwirang salin ng tiyak na pangmaramihang katawagan sa mga paring naglilingkod sa Israel; sapat na sa Filipino ang “mga pari” sa ganitong konstruksiyon.
- source_word: שְׂאוּ / וַיִּשְׂאוּ
  choice: Buhatin / binuhat
  rationale: Sa konteksto, ang נשׂא ay kapuwa pag-angat at pagdadala sa kaban. Pinananatili ng “buhatin/binuhat” ang kongkretong kilos at ang pag-uulit ng pandiwa sa utos at pagtupad.
- source_word: אֲרוֹן הַבְּרִית
  choice: ang Kaban ng Tipan
  rationale: Malinaw at tradisyonal na salin ng pariralang konstruktong tumutukoy sa sagradong kaban na kaugnay ng tipan.
- source_word: וְעִבְרוּ
  choice: tumawid kayo
  rationale: Ang עבר ay nangangahulugang tumawid o dumaan. Sa konteksto ng pagtawid sa Jordan, “tumawid” ang pinakatumpak at likas.
- source_word: לִפְנֵי הָעָם
  choice: sa unahan ng sambayanan
  rationale: Ipinahahayag ng לִפְנֵי ang posisyon sa harap o unahan. Ang “sambayanan” ay angkop sa Israel bilang sama-samang bayan at mas dignified kaysa simpleng “mga tao” sa kontekstong ito.
- source_word: וַיֵּלְכוּ
  choice: naglakad
  rationale: Ang הלך ay karaniwang pandiwang “lumakad/pumunta.” Ang “naglakad” ay nagpapanatili ng kongkretong kilos nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Paglalahad ng terminolohiyang tipan sa sagradong konteksto
  choice: Kaban ng Tipan
  alternative: kaban ng tipan / Kaban ng Kasunduan
  rationale: Ang “Kaban ng Tipan” ay malinaw, nakaugaliang terminolohiya sa Filipino at hindi nagdaragdag ng paliwanag na wala sa Hebreo. Ginamit ang malaking titik bilang katawagan sa partikular na sagradong bagay, hindi upang magpasok ng karagdagang doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng utos at ang tuwirang pagtupad dito. Walang talababa sapagkat walang tekstuwal o leksikal na kalabuan na kailangang ilahad sa mambabasa.
