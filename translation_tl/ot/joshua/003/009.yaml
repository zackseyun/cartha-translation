id: JOS.3.9
reference: Joshua 3:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל גֹּ֣שׁוּ הֵ֔נָּה וְ/שִׁמְע֕וּ אֶת דִּבְרֵ֖י יְהוָ֥ה אֱלֹֽהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/009.yaml
  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: tl
  text: Sinabi ni Josue sa mga anak ni Israel[a], “Lumapit kayo rito at pakinggan ninyo ang mga salita ni Yahweh na inyong Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang anyong pasalaysay na nagpapakilala ng tuwirang pananalita; natural at tiyak sa modernong Tagalog.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal na ugnayan ng pariralang Hebreo na 'mga anak ni Israel' at ang kolektibong pagtukoy nito sa bayang Israel.
- source_word: גֹּשׁוּ הֵנָּה
  choice: Lumapit kayo rito
  rationale: Ipinahahayag ang maramihang pautos at ang direksiyong patungo sa kinaroroonan ng nagsasalita.
- source_word: וְשִׁמְעוּ
  choice: at pakinggan ninyo
  rationale: Ang pautos na שׁמע ay tumutukoy rito sa sadyang pakikinig; mas natural sa Tagalog ang 'pakinggan' kaysa literal na 'dinggin' para sa pangkaraniwang mambabasa.
- source_word: אֶת דִּבְרֵי
  choice: ang mga salita
  rationale: Pinananatili ang maramihang 'mga salita' sa halip na ang mas interpretatibong 'mensahe.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong 'Yahweh' ang banal na pangalang YHWH sa tekstong Hebreo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal, tumutukoy ito sa iisang Diyos ng Israel; ang hulaping maramihang panghalip ay 'inyong.'
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalang YHWH ang nasa Hebreo, kaya pinanatili bilang 'Yahweh' sa halip na palitan ng titulo.
- issue: Paglilipat sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; mga supling ni Israel
  rationale: Pinananatili ng pangunahing teksto ang konkretong idyomang Hebreo, habang kinikilala na isa itong kolektibong katawagan sa mga Israelita at hindi lamang sa mga lalaking anak.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'Josue' bilang karaniwang pangalang biblikal sa Tagalog, 'Lumapit kayo rito' para sa malinaw na maramihang pautos, at 'pakinggan ninyo' upang ihatid ang aktibong pakikinig. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
