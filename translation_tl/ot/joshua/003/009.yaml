  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pagsasalita ni Josue, ang pangmaramihang pagtawag na בְּנֵי יִשְׂרָאֵל, ang dalawang pangmaramihang pautos na lumapit at makinig, at ang pariralang “mga salita ni Yahweh na inyong Diyos.” Wala itong idinagdag o inalis na kahulugan.'
