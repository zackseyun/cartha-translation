  text: וַ/יַּעַמְד֣וּ הַ/כֹּהֲנִ֡ים נֹ֠שְׂאֵי הָ/אָר֨וֹן בְּרִית יְהוָ֜ה בֶּ/חָֽרָבָ֛ה בְּ/ת֥וֹךְ הַ/יַּרְדֵּ֖ן הָכֵ֑ן וְ/כָל יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּ/חָ֣רָבָ֔ה עַ֤ד אֲשֶׁר תַּ֨מּוּ֙ כָּל הַ/גּ֔וֹי לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: tl
  text: Matatag na tumayo sa tuyong lupa sa gitna ng Jordan ang mga paring nagdadala ng kaban ng tipan ni Yahweh,[a] habang tumatawid sa tuyong lupa ang buong Israel, hanggang sa matapos tumawid sa Jordan ang buong bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, maaari ring unawain ang parirala bilang “kaban ni Yahweh na may kaugnayan sa tipan.”
    reason: lexical_alternative
  - marker: b
    text: O “ang buong bansa.” Ang salitang Hebreo ay isang pangngalang isahan na tumutukoy sa Israel bilang isang kabuuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ ... הָכֵן
  choice: Matatag na tumayo
  rationale: Pinagsama ang pandiwang עמד at ang pang-abay na הָכֵן upang ipahayag ang matatag at hindi matinag na pagtayo ng mga pari sa sahig ng ilog.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: ang mga paring nagdadala
  rationale: Ang participle na נֹשְׂאֵי ay nagsasaad ng nagpapatuloy na kilos ng mga pari; natural sa modernong Tagalog ang “nagdadala.”
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: kaban ng tipan ni Yahweh
  rationale: Pinananatili ang ugnayang construct ng kaban, tipan, at banal na pangalan sa malinaw at natural na ayos sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatinig ang personal na banal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בֶּחָרָבָה
  choice: sa tuyong lupa
  rationale: Tumutukoy sa lupang natuyo o nalantad mula sa tubig; inuulit ang parehong salin sa dalawang paglitaw nito.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: sa gitna ng Jordan
  rationale: Malinaw na ipinahahayag ng בְּתוֹךְ ang lokasyon sa loob o gitna ng ilog.
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: habang tumatawid ... ang buong Israel
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na pagkilos kasabay ng pagtayo ng mga pari; ipinakikita ng “habang” ang pagsabay na ito.
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: hanggang sa matapos
  rationale: Ipinahahayag ang hantungan ng patuloy na pagtawid nang natural sa Tagalog.
- source_word: כָּל הַגּוֹי
  choice: ang buong bayan
  rationale: Ang singular collective na גּוֹי ay tumutukoy sa Israel bilang isang buong sambayanan; mas natural dito ang “buong bayan” kaysa “buong bansa.”
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: tumawid sa Jordan
  rationale: Natural na katumbas sa Tagalog ng infinitive phrase na nagsasaad ng kilos na natapos ng bayan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Paglalarawan sa Israel sa כָּל הַגּוֹי
  choice: ang buong bayan
  alternative: ang buong bansa; ang lahat ng tao
  rationale: Pinananatili ang kolektibong diwa ng singular na גּוֹי nang hindi nagpapahiwatig ng modernong estadong pambansa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “tuyong lupa” at ang sabayang kilos ng mga pari at Israel. Iniwasan ang masyadong makalumang “saserdote” at ginamit ang karaniwang biblikal na “pari.”
