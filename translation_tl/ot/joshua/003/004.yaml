base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: tl
  text: Gayunman, magkakaroon ng agwat sa pagitan ninyo at nito—humigit-kumulang dalawang libong siko[a] ayon sa sukat. Huwag kayong lalapit dito, upang malaman ninyo ang daang inyong tatahakin, sapagkat hindi pa kayo dumaan sa daang ito noon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang siko ay sinaunang yunit ng haba, na humigit-kumulang sa haba mula siko hanggang dulo ng gitnang daliri.
    reason: cultural_note
  - marker: b
    text: Sa literal, “mula kahapon at noong makalawa,” isang idyomang nangangahulugang “dati” o “bago ngayon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Gayunman
  rationale: Ipinahahayag ang paglilimita o pagsalungat sa naunang tagubilin nang natural sa makabagong Tagalog.
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: magkakaroon ng agwat sa pagitan ninyo at nito
  rationale: Pinananatili ang pahayag na magkakaroon ng distansiya, sa halip na tahasang gawing utos; ang “nito” ay tumutukoy sa kaban ng tipan.
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: humigit-kumulang dalawang libong siko kung susukatin
  rationale: Ang “humigit-kumulang” ay nagpapakita ng tinatayang halaga ng כְּ; pinananatili ang sinaunang yunit at ang ideya ng aktuwal na pagsukat.
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: Huwag kayong lalapit dito
  rationale: Direkta at natural na pagbabawal sa maramihang kausap.
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: upang malaman ninyo
  rationale: Malinaw na ipinahahayag ang layunin ng pagpapanatili ng agwat.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: ang daang inyong tatahakin
  rationale: Natural na Tagalog para sa rutang kanilang pupuntahan, nang hindi nagdaragdag ng modal na “dapat.”
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: sapagkat hindi pa kayo dumaraan sa daang ito
  rationale: Isinasalin ang pagdaan o pagtahak sa isang ruta sa idiomatikong Tagalog.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: noon
  rationale: Ang parirala ay isang Hebreong idyoma para sa nakaraang panahon o dati; ang literal na anyo ay inilalagay sa talababa.
