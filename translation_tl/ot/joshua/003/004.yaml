revisions:
- from: Gayunman, magkakaroon ng agwat sa pagitan ninyo at nito—humigit-kumulang dalawang libong siko[a] kung susukatin. Huwag kayong lalapit dito, upang malaman ninyo ang daang inyong tatahakin, sapagkat hindi pa kayo dumaraan sa daang ito noon.[b]
  to: Gayunman, magkakaroon ng agwat sa pagitan ninyo at nito—humigit-kumulang dalawang libong siko[a] ayon sa sukat. Huwag kayong lalapit dito, upang malaman ninyo ang daang inyong tatahakin, sapagkat hindi pa kayo dumaan sa daang ito noon.[b]
  rationale: Inayos ang pariralang pangsukat upang maipahayag ang בַּמִּדָּה nang walang idinagdag na kondisyunal na kahulugan, at pinalitan ang aspektong nagpapatuloy ng pandiwang tumutugma sa perpektong Hebreo. Pinanatili ang mga anchor ng talababa sa wastong mga salita at hindi binago ang kahulugan ng talata.
