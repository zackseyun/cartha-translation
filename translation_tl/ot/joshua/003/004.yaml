translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Pinanatili ang sinaunang yunit na “siko,” habang ipinaliwanag ito sa talababa. Inayos ang pagkakaugnay ng mga marker: ang tala tungkol sa siko ay nasa “siko,” at ang tala tungkol sa Hebreong idyoma ay nasa “noon.”'
