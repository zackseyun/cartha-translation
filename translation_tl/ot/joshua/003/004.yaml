  - severity: medium
    issue: Ang “hindi pa kayo dumaraan” ay di-angkop ang aspektong pandiwa.
    rationale: Ang עֲבַרְתֶּם ay perpekto at tumutukoy sa katotohanang hindi pa nila nagawang dumaan sa rutang ito dati. Ang “hindi pa kayo dumaan” ang mas tapat at natural.
