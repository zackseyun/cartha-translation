lexical_decisions:
- source_word: וַיְהִי
  choice: Pagkalipas ...
  rationale: Ang anyong pasalaysay ay likas na naipapahayag sa Filipino sa pamamagitan ng tuwirang pariralang panahunan; hindi kailangan ang literal at mabigat na “at nangyari.”
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: Pagkalipas ng tatlong araw
  rationale: Ipinahahayag nito ang hangganang panahunan sa dulo ng tatlong araw sa natural na modernong Filipino.
- source_word: וַיַּעַבְרוּ
  choice: naglibot
  rationale: Sa kasunod na pariralang בְּקֶרֶב הַמַּחֲנֶה, tumutukoy ito sa pagdaan ng mga pinuno sa loob at iba't ibang bahagi ng kampo upang maghatid ng tagubilin.
- source_word: הַשֹּׁטְרִים
  choice: ang mga pinuno
  rationale: Tumutukoy ito sa mga itinalagang opisyal na nangangasiwa at naghahatid ng mga utos; “mga pinuno” ay malinaw at karaniwan sa Filipino, nang hindi ipinapalagay ang makabagong ranggong militar.
- source_word: בְּקֶרֶב הַמַּחֲנֶה
  choice: sa buong kampo
  rationale: Kasama ng pandiwang kilos, likas nitong ipinahihiwatig ang pagdaan sa loob ng kampo. Ang “sa buong kampo” ay malinaw at natural na naghahatid ng distribusyon ng pagkilos.
