  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: tl
  text: At sinabi ni Josue, “Sa pamamagitan nito ay malalaman ninyo na ang Diyos na buháy ay nasa gitna ninyo, at tiyak na itataboy[a] niya mula sa harapan ninyo ang mga Cananeo, Heteo, Heveo, Perezeo, Gergeseo, Amoreo, at Jebuseo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tiyak na aalisan niya ng lupain ang mga ito.” Binibigyang-diin ng pandiwang Hebreo ang tiyak na pagpapaalis sa kanila mula sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוֹשֻׁעַ
  choice: At sinabi ni Josue
  rationale: Pinananatili ng “At” ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ng mas tiyak na ugnayang temporal.
- source_word: בְּזֹאת
  choice: Sa pamamagitan nito
  rationale: 'Ipinahahayag ang instrumental na diwa: ang nalalapit na tanda o pangyayari ang magiging paraan upang makilala nila ang pagkilos ng Diyos.'
- source_word: תֵּדְעוּן
  choice: malalaman ninyo
  rationale: Ang imperfect na ikalawang panauhang maramihan ay may diwang panghinaharap sa konteksto.
- source_word: אֵל חַי
  choice: ang Diyos na buháy
  rationale: Natural sa modernong Tagalog at pinananatili ang diin na ang Diyos ay buháy, nang hindi ipinapasok ang pangalang YHWH na wala sa talata.
- source_word: בְּקִרְבְּכֶם
  choice: nasa gitna ninyo
  rationale: Tumutukoy sa presensya ng Diyos sa kalagitnaan ng bayan, hindi sa panloob na espirituwal na karanasan ng bawat indibidwal.
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: tiyak na itataboy niya
  rationale: Ang infinitive absolute na kasunod ng kaugnay na pandiwa ay nagbibigay-diin sa katiyakan ng pagpapaalis. Ang “itataboy” ay malinaw at natural, habang ang “tiyak” ay naghahatid ng empatikong anyo.
- source_word: מִפְּנֵיכֶם
  choice: mula sa harapan ninyo
  rationale: Pinananatili ang Hebreong larawang spatial ng pag-aalis sa mga taong nasa harap nila.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: ang mga Cananeo, Heteo, Heveo, Perezeo, Gergeseo, Amoreo, at Jebuseo
  rationale: Ang mga anyong isahang kolektibo sa Hebreo ay isinalin bilang mga pangalan ng mga bayan; ginamit ang nakaugaliang anyong Tagalog ng mga etnonimo.
theological_decisions:
- issue: Paglalarawan sa אֵל חַי nang hindi ipinapasok ang banal na pangalang wala sa talata
  choice: ang Diyos na buháy
  alternative: ang buháy na Makapangyarihan
  rationale: אֵל ang nakasulat, hindi יהוה. Ang “Diyos na buháy” ang tuwirang at natural na salin at pinananatili ang pahayag tungkol sa aktibong presensya ng Diyos.
- issue: Pagpapanatili sa lakas ng pandiwang pananakop
  choice: tiyak na itataboy niya
  alternative: tiyak na aalisan niya ng pag-aari
  rationale: Ipinahahayag ng Hebreo ang tiyak at mapagpasiyang pagpapaalis sa mga binanggit na bayan. Hindi nito pinahihina ang kilos o dinaragdagan ng paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang Hebreong daloy at diin, ngunit iniwasan ang sobrang literal na estrukturang magiging asiwa sa Tagalog. Ang diin sa “buháy” ay minarkahan upang maiwasang mabasa bilang pang-abay na “buhay.”
