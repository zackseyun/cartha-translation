translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Kaban” na may malaking titik bilang pinaikling tawag sa sagradong Kaban na tinutukoy sa konteksto. Pinanatili ang anyong parentetiko at ang pangungusap na nagpapatuloy sa susunod na talata sa pamamagitan ng mga gitling at pangwakas na kuwit.
