  text: וּ/כְ/ב֞וֹא נֹשְׂאֵ֤י הָֽ/אָרוֹן֙ עַד הַ/יַּרְדֵּ֔ן וְ/רַגְלֵ֤י הַ/כֹּֽהֲנִים֙ נֹשְׂאֵ֣י הָֽ/אָר֔וֹן נִטְבְּל֖וּ בִּ/קְצֵ֣ה הַ/מָּ֑יִם וְ/הַ/יַּרְדֵּ֗ן מָלֵא֙ עַל כָּל גְּדוֹתָ֔י/ו כֹּ֖ל יְמֵ֥י קָצִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: tl
  text: Nang makarating sa Jordan[a] ang mga nagdadala ng Kaban, at naisasawsaw sa gilid ng tubig ang mga paa ng mga paring nagdadala ng Kaban—umaapaw noon ang Jordan sa lahat ng pampang nito sa buong panahon ng pag-aani[b]—,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa Jordan.” Ipinahihiwatig ng Hebreo ang pag-abot sa ilog; nililinaw ng kasunod na pananalita na ang mga paa ay pumasok sa gilid ng tubig.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, nasa yugto ng pagbaha ang Jordan sa panahon ng pag-aani.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְבוֹא
  choice: Nang makarating
  rationale: Ang pang-ugnay, temporal na pang-ukol, at infinitive construct ay bumubuo ng sugnay na panahunan. Natural sa modernong Tagalog ang “Nang makarating” at malinaw na ipinapakita ang pagkakasunod ng pangyayari.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: ang mga may pasan ng Kaban
  rationale: Ang participle ay tumutukoy sa mga taong aktuwal na nagdadala ng Kaban. Ang “may pasan” ay likas sa Tagalog para sa mabigat o sagradong bagay na binubuhat at hindi nangangailangang idagdag ang “Tipan,” na wala sa talata.
- source_word: עַד הַיַּרְדֵּן
  choice: makarating sa Jordan
  rationale: Ang עַד ay nagpapahiwatig ng pag-abot sa isang hangganan o lugar. Sa konteksto, ang pagdating sa Jordan ay agad nililinaw ng kasunod na paglubog ng mga paa sa gilid ng tubig.
- source_word: וְרַגְלֵי הַכֹּהֲנִים
  choice: ang mga paa ng mga pari
  rationale: Pinananatili ang buong construct chain at ang diin ng Hebreo sa mga paa ng mga pari.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: mga paring may pasan ng Kaban
  rationale: Pinananatili ang inulit na participle sa Hebreo upang tukuyin kung aling mga pari ang tinutukoy.
- source_word: נִטְבְּלוּ
  choice: lumubog
  rationale: Ang Niphal ng טבל ay nagsasaad ng paglubog o pagkakasawsaw. Ang “lumubog” ay mas tiyak kaysa “sumayad” ngunit hindi naman ipinahihiwatig na lubusang nalubog ang buong katawan.
- source_word: בִּקְצֵה הַמָּיִם
  choice: sa gilid ng tubig
  rationale: Literal itong tumutukoy sa dulo o gilid ng tubig. Kasama ng “lumubog,” malinaw na pumasok sa tubig ang mga paa sa mismong pampang, kahit ang karaniwang Tagalog na pang-ukol ay “sa.”
- source_word: וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו
  choice: umaapaw noon ang Jordan sa lahat ng pampang nito
  rationale: Ang sugnay ay paliwanag na pangkaligiran. Ang “umaapaw” ay natural na naghahatid ng larawan ng ilog na punô at lumalampas sa mga pampang nito; ang “noon” ay naghuhudyat ng parentetikong kalagayan.
- source_word: כֹּל יְמֵי קָצִיר
  choice: sa buong panahon ng pag-aani
  rationale: Ipinapahayag nito ang kabuuan ng panahon ng anihan. Natural at malinaw sa modernong Tagalog ang “sa buong panahon ng pag-aani.”
