  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: tl
  text: Sinabi ni Josue sa mga tao, “Magpakabanal kayo, sapagkat bukas ay gagawa ang PANGINOON ng mga kababalaghan sa gitna ninyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: Italaga ninyo ang inyong sarili sa Diyos
  rationale: Ipinahahayag ang utos na ihanda at ibukod ang sarili bilang banal para sa pagkilos ng Diyos; idinagdag ang ‘sa Diyos’ upang maging likas at malinaw sa modernong Tagalog nang hindi tinutukoy ang isang ritwal na wala sa talata.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Ipinananatili ang sanhi o batayan ng utos: ang gagawin ng PANGINOON kinabukasan.'
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Karaniwang pormang Tagalog para sa banal na pangalan sa tradisyong gumagamit ng maliit na kapital upang maipakitang YHWH ang nasa Hebreo.
- source_word: בְּקִרְבְּכֶם
  choice: sa gitna ninyo
  rationale: Tuwirang pinananatili ang diwang spatial at pangkomunidad ng pariralang Hebreo.
- source_word: נִפְלָאוֹת
  choice: mga kababalaghan
  rationale: Natural at marangal na salin para sa pambihirang mga gawa ng Diyos na pumupukaw ng pagkamangha.
theological_decisions:
- issue: Kahulugan ng pagpapakabanal bago tumawid sa Jordan
  choice: Italaga ninyo ang inyong sarili sa Diyos
  alternative: Magpakabanal kayo
  rationale: Hindi tinukoy ng talata ang eksaktong ritwal. Iniiwasang magdagdag ng partikular na seremonya habang nililinaw na ang paglalaan ay nakatuon sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘Josue,’ ang nakaugaliang Tagalog na pangalan, at ang ‘PANGINOON’ bilang representasyon ng tetragrammaton.
