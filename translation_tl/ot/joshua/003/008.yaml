base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: tl
  text: 'At utusan mo ang mga paring nagdadala ng kaban ng tipan: “Pagdating ninyo sa gilid ng tubig ng Jordan[a], tumayo kayo sa Ilog Jordan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pinakadulo ng tubig ng Jordan.”
    reason: Pinananatili ang posibleng mas matinding diwa ng קְצֵה bilang dulo o pinakahangganan ng tubig.
lexical_decisions:
- source_word: וְאַתָּה
  choice: At ... mo
  rationale: Pinananatili ng “At” ang pagpapatuloy ng salaysay, habang ang hulaping “mo” sa pandiwa ay likas na naghahayag na si Josue ang tahasang kinakausap.
- source_word: תְּצַוֶּה
  choice: utusan mo
  rationale: Ang Piel imperfect na ito ay may puwersa ng tagubilin. Ang “utusan mo” ay tuwiran, natural, at angkop sa marangal na salaysay.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: ang mga paring nagdadala
  rationale: Isinasalin ang tiyak na pangngalan at ang kasunod na participle bilang likas na sugnay na panuring sa Tagalog.
- source_word: אֲרוֹן הַבְּרִית
  choice: kaban ng tipan
  rationale: Ito ang malinaw at nakaugaliang salin ng construct chain, at pinananatili ang kahalagahan ng tipan.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Sa modernong Tagalog, sapat at higit na natural ang tutuldok upang ipakilala ang mismong nilalaman ng utos kaysa sa tahasang “na sinasabi.”
- source_word: כְּבֹאֲכֶם
  choice: Pagdating ninyo
  rationale: Likas na ipinahahayag nito ang temporal na diwa ng pang-ukol at infinitive construct na may pangmaramihang hulapi.
- source_word: עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: sa gilid ng tubig ng Jordan
  rationale: Ipinapahayag ng parirala ang pag-abot sa dulo o gilid ng tubig. Ang “gilid” ay malinaw at natural, habang pinananatili ng “tubig ng Jordan” ang anyo ng Hebreong parirala.
- source_word: בַּיַּרְדֵּן
  choice: sa loob ng Jordan
  rationale: Ang בְּ ay lokatibo rito. Nililinaw ng “sa loob” na ang mga pari ay tatayo sa mismong ilog, hindi lamang sa pampang.
- source_word: תַּעֲמֹדוּ
  choice: tumayo kayo
  rationale: Tuwirang inilalarawan ng Qal imperfect 2mp ang iniutos na pagtayo o pagpuwesto ng mga pari sa ilog.
