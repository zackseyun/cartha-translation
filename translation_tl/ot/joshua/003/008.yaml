  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Jordan” alinsunod sa anyo ng pinagmulang teksto; ipinahihiwatig na ilog ito ng konteksto. Inilipat ang talababa sa pariralang aktuwal nitong tinutukoy.
