    issue: Nakalagay ang talababa [a] pagkatapos ng “Jerusalem,” ngunit ang nilalaman nito ay tungkol sa “hukbo/mga kampo.”
    rationale: Hindi tumutugma ang ankla sa salitang binibigyang-linaw ng talababa. Dapat itong ilagay kasunod ng “hukbo.”
  - severity: low
    issue: “Umahon” ang salin ng וַיַּעֲלוּ.
    rationale: Bagaman posible, mas natural at mas tuwirang pangkalahatang katumbas sa ganitong paglalakbay o pagkilos-militar ang “umakyat,” nang hindi nagdaragdag ng interpretasyon.
