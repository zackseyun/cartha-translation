  verdict: revise
  source_fidelity: Tumpak na naihahatid ng salin ang pagtitipon at pag-akyat ng limang haring Amoreo, ang isa-isang talaan ng kanilang mga lungsod, ang pagsama ng kanilang mga puwersa, at ang pagkakampo at pakikidigma laban sa Gibeon. Ang “umakyat” ay mas karaniwan at mas tuwirang katumbas ng וַיַּעֲלוּ kaysa “umahon.”
  naturalness: Malinaw at marangal ang rehistro. Ang paglalagay ng “kasama ang lahat ng kanilang hukbo” ay mas maayos na idinudugtong sa limang hari kaysa sa hulihang “sila at ...,” habang pinananatili ang kahulugan.
  terminology: Ang “mga Amoreo,” “hukbo,” at mga anyong Jerusalem, Hebron, Jarmut, Lakis, Eglon, at Gibeon ay angkop sa modernong Filipino Tagalog at sa karaniwang anyo ng mga pangalang biblikal. Ang “hukbo” ay katanggap-tanggap na kontekstuwal na salin ng מַחֲנֶה, na may talababa para sa literal na “mga kampo.”
  issues:
