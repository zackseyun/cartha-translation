  text: וַ/יֵּאָסְפ֨וּ וַֽ/יַּעֲל֜וּ חֲמֵ֣שֶׁת מַלְכֵ֣י הָ/אֱמֹרִ֗י מֶ֣לֶךְ יְרוּשָׁלִַ֜ם מֶֽלֶךְ חֶבְר֤וֹן מֶֽלֶךְ יַרְמוּת֙ מֶֽלֶךְ לָכִ֣ישׁ מֶֽלֶךְ עֶגְל֔וֹן הֵ֖ם וְ/כָל מַֽחֲנֵי/הֶ֑ם וַֽ/יַּחֲנוּ֙ עַל גִּבְע֔וֹן וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: tl
  text: Kaya nagtipon at umakyat ang limang hari ng mga Amoreo—ang hari ng Jerusalem, ang hari ng Hebron, ang hari ng Jarmut, ang hari ng Lakis, at ang hari ng Eglon—kasama ang lahat ng kanilang hukbo.[a] Nagkampo sila laban sa Gibeon at nakipagdigma rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lahat ng kanilang mga kampo.” Maaari itong tumukoy sa kanilang mga hukbo o puwersang militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: nagtipon
  rationale: Ipinahahayag ng anyong Niphal ang sama-samang pagtitipon; natural ito sa Filipino at hindi nagdaragdag ng ideya ng isang pormal na alyansa.
- source_word: וַיַּעֲלוּ
  choice: umahon
  rationale: Pinananatili nito ang karaniwang kahulugang ‘umakyat/umahon,’ na maaaring tumukoy sa topograpiya o sa nakaugaliang direksiyon ng paglalakbay.
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: ang limang hari ng mga Amoreo
  rationale: Pinananatili ang ugnayang construct at ang tahasang katawagang etniko sa Hebreo.
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: ang hari ng Jerusalem, ang hari ng Hebron, ang hari ng Jarmut, ang hari ng Lakis, at ang hari ng Eglon
  rationale: Inulit ang ‘ang hari ng’ gaya ng sinadyang isa-isang pagbanggit sa tekstong Hebreo.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: sila at ang lahat ng kanilang hukbo
  rationale: Ang מַחֲנֶה ay literal na ‘kampo’ ngunit sa kontekstong militar ay maaari ring tumukoy sa hukbo o mga puwersang nasa kampo. Mas malinaw sa karaniwang mambabasa ang ‘hukbo,’ habang inilalagay sa talababa ang kongkretong literal na larawan.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: Nagkampo sila laban sa Gibeon
  rationale: Dahil agad na kasunod ang pakikipagdigma, ang עַל ay may malinaw na diwang mapanlaban, hindi lamang tumutukoy sa lokasyon.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: nakipagdigma rito
  rationale: Ang pandiwa ay karaniwang salita para sa pakikidigma. Ang ‘rito’ ay natural na tumutukoy sa lungsod ng Gibeon at iniiwasan ang di-natural na pambabaeng panghalip ng Hebreo sa Filipino.
