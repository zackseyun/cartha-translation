reference: Joshua 10:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: tl
  text: At nilito sila ni Yahweh sa harap ng Israel[a], at nagdulot siya sa kanila ng malaking pagkatalo sa Gibeon. Hinabol niya sila sa daang paahon sa Bet-horon at pinabagsak niya sila hanggang Azeka at hanggang Makeda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sila’y pinasindak” o “sila’y nilito.” Ang pandiwang Hebreo ay tumutukoy sa pagdudulot ng kalituhan o sindak sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: nilito sila
  rationale: Ang pandiwang המם ay tumutukoy sa pagdudulot ng kalituhan o sindak sa labanan. Pinananatili ng “nilito sila” ang tuwirang pagkilos ni Yahweh nang hindi agad nililimitahan ang kahulugan sa resulta lamang na “tinalo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: sa harap ng Israel
  rationale: Pinananatili nito ang idyomang Hebreo, na maaaring tumukoy sa harapan o presensiya ng Israel sa konteksto ng labanan.
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: matindi niya silang pinuksa
  rationale: Sa konteksto ng labanan, ang נכה at מַכָּה ay nagsasaad ng marahas na pagwasak o pagpatay. Ang likas na pariralang Tagalog na ito ay naghahatid ng tindi ng “malaking paglipol” nang hindi gumagamit ng pilit na nominal na konstruksyon.
- source_word: וַיִּרְדְּפֵם
  choice: hinabol niya sila
  rationale: Tuwiran at likas na katumbas ng paghabol sa tumatakas na kaaway.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: sa daang paahon sa Bet-horon
  rationale: Pinananatili ang tiyak na topograpikong detalye ng daan at ahon patungong Bet-horon sa malinaw na modernong Tagalog.
- source_word: וַיַּכֵּם עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: patuloy niya silang pinabagsak hanggang Azeka at Makeda
  rationale: Ipinahahayag ng “patuloy” ang pagpapatuloy ng pagwasak habang hinahabol sila, at ng “hanggang” ang heograpikong lawak na minamarkahan ng עַד.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang יְהוָה sa teksto; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng banal na pagkilos sa mga pandiwa
  choice: Si Yahweh ang tahasang simuno ng pagkalito, pagpuksa, paghabol, at pagpabagsak
  alternative: Gawing Israel ang di-tahasang simuno ng paghabol at pagpatay
  rationale: Lahat ng pandiwa sa Hebreo ay nasa panlalaking isahan at ang tahasang simuno na pinakamalapit ay si Yahweh. Pinananatili ng salin ang gramatikal na ugnayang ito nang hindi ipinapalit ang Israel bilang simuno.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maiikling sugnay at likas na bokabularyong pandigma; iniwasan ang lipas na “sinalanta” o ang pilit na literal na “hinampas ng malaking hampas.”
