base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: tl
  text: Ibinigay ni Yahweh ang Lakish sa kamay ng Israel. Nasakop ito nang ikalawang araw, at pinatay sa talim ng tabak ang bawat taong naroon[a], gaya ng ginawa sa Libna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bawat kaluluwa na naroon,” isang idyomang tumutukoy sa bawat taong nasa lunsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan upang mapanatili ang tiyak na pangalang nasa tekstong Hebreo.
- source_word: וַיִּתֵּן ... בְּיַד
  choice: ibinigay ... sa kamay ng
  rationale: Pinananatili nito ang larawang Hebreo ng pagpapasailalim sa kapangyarihan ng Israel at likas pa rin itong maunawaan sa Filipino.
- source_word: לָכִישׁ
  choice: Lakish
  rationale: Malapit na transliterasyon sa anyong Hebreo at madaling bigkasin sa Filipino.
- source_word: וַיִּלְכְּדָהּ
  choice: nabihag iyon
  rationale: Ang pandiwa ay karaniwang tumutukoy sa pagsakop o pagkuha sa isang lunsod sa kontekstong militar.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: nang ikalawang araw
  rationale: Tuwirang pinananatili ang tiyak na detalye ng panahon sa Hebreo.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: nilipol niya sa talim ng tabak ang lunsod
  rationale: Sa konteksto ng pagpatay sa lahat ng naninirahan, ipinahahayag ng 'nilipol' ang puwersa ng נכה, habang pinananatili ng 'sa talim ng tabak' ang idyomatikong larawan ng Hebreo.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: ang bawat taong naroon
  rationale: Dito ang נֶפֶשׁ ay tumutukoy sa bawat buhay na tao, hindi sa 'kaluluwa' bilang hiwalay na bahagi ng tao.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: gaya ng ginawa niya sa Libna
  rationale: Pinananatili ang pang-isahang pandiwa ng Hebreo at ang paghahambing sa naunang sinapit ng Libna.
theological_decisions:
- issue: Pormula ng pananakop na naglalarawan sa pagpatay sa mga naninirahan
  choice: nilipol niya ... ang bawat taong naroon
  alternative: pinatay niya ... ang bawat kaluluwang naroon
  rationale: Hindi pinalalambot ang tindi ng salaysay, ngunit iniiwasang ipahiwatig ng 'kaluluwa' ang modernong paghihiwalay ng katawan at kaluluwa na wala sa gamit ng נֶפֶשׁ dito.
- issue: Paksa ng mga pang-isahang pandiwa
  choice: Josue / niya
  alternative: Israel / nila
  rationale: Pang-isahan ang mga pandiwa sa Hebreo. Tahasang pinangalanan si Josue upang maging malinaw sa Filipino ang tinutukoy ng panghalip, habang kinikilala siyang kinatawang pinuno ng Israel sa daloy ng salaysay.
translation_notes:
  register: Makabago at marangal na Filipino; tuwiran ang paglalarawan at hindi pinagaan ang karahasan ng salaysay. Ginamit ang karaniwang Filipinong anyo ng mga pangalang Josue, Lakish, at Libna.
