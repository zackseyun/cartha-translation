revisions:
- from: Ibinigay ni Yahweh ang Lakish sa kamay ng Israel. Nabihag iyon ni Josue nang ikalawang araw, at nilipol niya sa talim ng tabak ang lunsod at ang bawat taong naroon[a], gaya ng ginawa niya sa Libna.
  to: Ibinigay ni Yahweh ang Lakish sa kamay ng Israel. Nasakop ito nang ikalawang araw, at pinatay sa talim ng tabak ang bawat taong naroon[a], gaya ng ginawa sa Libna.
  rationale: Inalis ang hindi tahasang pangalang Josue upang mapanatili ang hindi tinukoy na paksa ng Hebreo. Pinalitan ang "nilipol ... ang lunsod" ng ayos na malinaw na ang bawat taong nasa Lakish ang pinatay sa tabak. Iningatan ang detalye ng ikalawang araw, ang pormulang "sa kamay ng Israel," at ang paghahambing sa Libna.
