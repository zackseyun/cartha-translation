revisions:
- from: Habang tumatakas sila mula sa harap ng Israel[a] at bumababa sa Bet-horon, binagsakan sila ni Yahweh ng malalaking bato mula sa langit hanggang sa Azeka, at namatay sila. Mas marami ang namatay dahil sa mga batong yelo kaysa sa napatay ng mga anak ni Israel sa pamamagitan ng tabak.
  to: Habang tumatakas sila palayo sa Israel at nasa pababang dalisdis ng Bet-horon, ipinukol ni Yahweh sa kanila ang malalaking bato mula sa langit hanggang sa Azeka, at namatay sila. Mas marami ang namatay dahil sa mga batong yelo kaysa sa napatay ng mga Israelita sa pamamagitan ng tabak.
  rationale: Inalis ang di-likas na literal na Hebraismo at ang hindi kailangang talababa. Inayos ang topograpikong parirala upang ipahayag ang “descent of Beth-horon,” at ginamit ang “mga Israelita” bilang tumpak na modernong Filipino para sa בְּנֵי יִשְׂרָאֵל sa kontekstong etniko. Pinanatili ang sinadyang pag-usad ng Hebreo mula sa “malalaking bato” tungo sa “mga batong yelo.”
  reviewer_model: gpt-5.6-terra
