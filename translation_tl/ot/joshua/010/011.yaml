base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: tl
  text: Habang tumatakas sila palayo sa Israel at nasa pababang dalisdis ng Bet-horon, ipinukol ni Yahweh sa kanila ang malalaking bato mula sa langit hanggang sa Azeka, at namatay sila. Mas marami ang namatay dahil sa mga batong yelo kaysa sa napatay ng mga Israelita sa pamamagitan ng tabak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: Habang tumatakas sila mula sa harap ng Israel
  rationale: Ipinapahayag ng infinitive construct na may ב ang kasabay na kilos. Pinananatili ng “mula sa harap ng Israel” ang larawang Hebreo ng pag-urong sa harap ng kalaban; inilagay sa talababa ang mas likas na kahulugan sa Filipino.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: bumababa sa Bet-horon
  rationale: Ang מוֹרַד ay pababang dalisdis o daan. Ang pandiwang “bumababa” ay natural sa Filipino at malinaw na naghahatid ng topograpikong detalye.
- source_word: וַיהוָה
  choice: ni Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: הִשְׁלִיךְ עֲלֵיהֶם
  choice: binagsakan sila
  rationale: Ipinahahayag nito ang paghagis o pagpapabagsak ng mga bato sa kanila mula sa langit, sa natural na Filipino.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: malalaking bato
  rationale: Pinananatili ang unang pangkalahatang paglalarawan bilang mga bato bago sila tukuyin ng kasunod na pangungusap bilang mga batong yelo.
- source_word: מִן הַשָּׁמַיִם
  choice: mula sa langit
  rationale: Pinananatili ang literal at teolohikal na dating ng pinagmulan sa itaas.
- source_word: עַד עֲזֵקָה
  choice: hanggang sa Azeka
  rationale: Ipinahahayag ang lawak ng pangyayari sa kahabaan ng ruta.
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: dahil sa mga batong yelo
  rationale: Tinutukoy nito ang naunang “malalaking bato” bilang mga tipak ng yelo, habang pinananatili ang leksikal na ugnayan sa “bato.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit na katumbas ng tradisyonal na etnonimong Hebreo at pinananatili ang gramatikal na anyo ng pinagmulan.
- source_word: בֶּחָרֶב
  choice: sa pamamagitan ng tabak
  rationale: Malinaw na ipinapakita ang instrumental na gamit ng ב at pinananatili ang kolektibong isahan na “tabak.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ang ginamit sa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kalikasan ng mga bagay na nahulog mula sa langit
  choice: Unang “malalaking bato,” saka “mga batong yelo”
  alternative: Gawing “malalaking batong yelo” agad sa unang banggit
  rationale: Pinananatili nito ang pag-usad ng paglalarawan sa Hebreo at hindi maagang nilulutas ang unang pangkalahatang pagtukoy.
- issue: Paglilipat sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang anyo ng Hebreo nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “Bet-horon” at “Azeka” bilang natural na anyo ng mga pangalang pantangi. Pinanatili ang bahagyang Hebreong kulay sa “mula sa harap ng Israel” at ipinaliwanag ito sa talababa.
