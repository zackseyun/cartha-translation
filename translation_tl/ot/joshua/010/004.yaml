  source_fidelity: Tumpak na naihahatid ang maramihang pautos na “umakyat,” ang pakiusap na tulungan ang nagsasalita, ang panawagang pangmaramihan na salakayin ang Gibeon, at ang dahilang nakipagpayapaan ang Gibeon kay Josue at sa mga anak ni Israel. Ang “nakipagpayapaan” ay angkop sa diplomatikong saklaw ng הִשְׁלִימָה at hindi nagpapataw ng mas tiyak na kahulugang gaya ng pagsuko o pormal na alyansa.
  naturalness: Likas, malinaw, at marangal ang modernong Filipino. Ang “Umakyat kayo rito sa akin” ay katanggap-tanggap na pananalitang nakapagpapanatili kapwa ng direksiyong “umakyat” at ng pananaw ng nagsasalita sa “sa akin.”
  terminology: Ang “Josue” ay wastong nakaugaliang anyong Filipino. Ang “mga anak ni Israel” ay tapat sa בני ישראל at ang talababa ay nagbibigay ng likas na alternatibong “mga Israelita” nang hindi binubura ang anyo ng Hebreo. Ang mga panandang [a] at [b] ay wastong nakakabit sa mga pariralang tinutukoy.
