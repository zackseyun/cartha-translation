id: JOS.10.4
reference: Joshua 10:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עֲלֽוּ אֵלַ֣/י וְ/עִזְרֻ֔/נִי וְ/נַכֶּ֖ה אֶת גִּבְע֑וֹן כִּֽי הִשְׁלִ֥ימָה אֶת יְהוֹשֻׁ֖עַ וְ/אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: tl
  text: “Umakyat kayo rito sa akin at tulungan ninyo ako, at salakayin natin ang Gibeon, sapagkat nakipagpayapaan[b] ito kay Josue at sa mga anak ni Israel.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga Israelita” o “sambayanang Israel.” Sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakipagkasundong pangkapayapaan.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpasok sa mapayapang ugnayan o sa kapayapaang itinatag sa pamamagitan ng kasunduan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֽוּ אֵלַי
  choice: Umakyat kayo rito sa akin
  rationale: Pinananatili ang maramihang pautos, ang diwa ng pag-akyat o paglapit mula sa mas mababang lugar, at ang pananaw ng nagsasalita sa אֵלַי.
- source_word: וְעִזְרֻנִי
  choice: at tulungan ninyo ako
  rationale: Likas at tuwirang salin ng maramihang pautos na may unang panauhang layon.
- source_word: וְנַכֶּה
  choice: at salakayin natin
  rationale: Ipinahahayag ang panawagang unang panauhang maramihan sa kontekstong militar. Mas natural sa Filipino ang “salakayin” kaysa literal na “hampasin,” nang hindi dinaragdagan ang kahulugan.
- source_word: אֶת גִּבְעוֹן
  choice: ang Gibeon
  rationale: Isinasalin ang Gibeon bilang pangalan ng lunsod; walang hiwalay na katumbas sa Filipino ang panandang tuwirang layon na אֶת.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng panawagan habang pinananatili ang marangal na himig.
- source_word: הִשְׁלִימָה
  choice: nakipagpayapaan
  rationale: Ipinapakita ang pagpasok sa mapayapang ugnayan o kasunduang pangkapayapaan. Hindi ito pinakikitid sa “nakipag-alyansa” at hindi rin pinalalakas bilang “sumuko.”
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: kay Josue at sa mga anak ni Israel
  rationale: Ang “kay/sa” ay likas na nagpapahayag ng mga kabilang sa pakikipagpayapaan. Pinananatili ng “mga anak ni Israel” ang pamilyal na anyo ng Hebreong בני ישראל.
theological_decisions:
- issue: Pagkasalin sa בני ישראל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ang hayag na pamilyal na larawan ng Hebreo, bagaman tumutukoy ito rito sa bansang Israel bilang isang kabuuan.
- issue: Saklaw ng הִשְׁלִימָה
  choice: nakipagpayapaan
  alternative: nakipag-alyansa; sumuko
  rationale: 'Pinananatili ang tunay na lawak ng pandiwa sa diplomatikong konteksto: maaari itong tumukoy sa mapayapang ugnayan o kapayapaang itinatag sa pamamagitan ng kasunduan, nang hindi tiyak na ginagawang alyansa o pagsuko.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue,” ang nakaugaliang anyong Filipino ng pangalan. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinutukoy ng mga ito.
