revisions:
- from: Nang mabalitaan ni Adoni-zedek, hari ng Jerusalem, na nabihag ni Josue ang Ai at itinalaga niya ito sa pagkawasak[a]—kung ano ang ginawa niya sa Jerico at sa hari nito ay siya rin niyang ginawa sa Ai at sa hari nito—at na nakipagpayapaan[b] sa Israel ang mga naninirahan sa Gibeon at nasa gitna na nila,
  to: Nang marinig ni Adoni-zedek, hari ng Jerusalem, na nabihag ni Josue ang Ai at itinalaga niya ito sa pagkawasak[a]—kung ano ang ginawa niya sa Jerico at sa hari nito ay siya rin niyang ginawa sa Ai at sa hari nito—at na nakipagpayapaan[b] sa Israel ang mga naninirahan sa Gibeon at kasama nila,
  rationale: Pinalitan ang “mabalitaan” ng “marinig” upang mas tuwirang katawanin ang pandiwang Hebreo. Pinalitan ang “nasa gitna na nila” ng “kasama nila” upang alisin ang idinagdag na aspektong “na” at maging mas likas ang Tagalog, habang nananatili ang pagtukoy sa mga taga-Gibeon bilang nasa piling ng Israel. Pinanatili ang nakabiting sintaks at pangwakas na kuwit, sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
