id: JOS.10.1
reference: Joshua 10:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: tl
  text: Nang marinig ni Adoni-zedek, hari ng Jerusalem, na nabihag ni Josue ang Ai at itinalaga niya ito sa pagkawasak[a]—kung ano ang ginawa niya sa Jerico at sa hari nito ay siya rin niyang ginawa sa Ai at sa hari nito—at na nakipagpayapaan[b] sa Israel ang mga naninirahan sa Gibeon at kasama nila,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lubusan niya itong winasak.” Ang Hebreo ay gumagamit ng salitang חרם, na tumutukoy sa pagtatalaga ng isang bagay sa pagkawasak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakipagkasundo sa Israel upang magkaroon ng kapayapaan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Ang pormulang pasalaysay ay likas na naipahahayag sa modernong Tagalog sa pamamagitan ng temporal na sugnay na “Nang mabalitaan,” nang hindi gumagamit ng makalumang “At nangyari.”
- source_word: כִשְׁמֹעַ
  choice: mabalitaan
  rationale: Ang infinitive construct na may כִּ ay nagsasaad ng panahong pangyayari. Ang “mabalitaan” ay natural kapag ang narinig ay balita tungkol sa mga naganap.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-zedek
  rationale: Isinalin-transliterado ang tambalang pangalang pantangi at pinanatili ang gitling upang makita ang dalawang sangkap nito.
- source_word: מֶלֶךְ יְרוּשָׁלַם
  choice: hari ng Jerusalem
  rationale: 'Tuwirang ipinahahayag ang ugnayang construct: ang titulo ay isinalin at ang pangalan ng lugar ay ginamit sa karaniwang anyo.'
- source_word: לָכַד
  choice: nabihag
  rationale: Tumpak at likas sa kontekstong militar ang “nabihag” para sa pagsakop sa isang lungsod.
- source_word: הָעַי
  choice: Ai
  rationale: Ginamit ang karaniwang transliterasyon ng pangalan ng lugar.
- source_word: וַיַּחֲרִימָהּ
  choice: itinalaga niya ito sa pagkawasak
  rationale: Pinananatili nito ang teknikal at sagradong diwa ng חרם—hindi lamang pagwasak kundi pagtatalaga sa pagkawasak—nang hindi gumagamit ng malabong terminong teknikal.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: kung ano ang ... ay siya rin
  rationale: Natural na katumbas sa Tagalog na nagpapanatili sa mahigpit na paghahambing at paralelismo ng Hebreo.
- source_word: עָשָׂה לִירִיחוֹ וּלְמַלְכָּהּ
  choice: ginawa niya sa Jerico at sa hari nito
  rationale: Pinananatili ang pag-uulit ng pandiwang “ginawa,” gaya ng diin ng Hebreo.
- source_word: הִשְׁלִימוּ
  choice: nakipagpayapaan
  rationale: Malinaw at maikling paglalarawan ng pagpasok sa mapayapang ugnayan, habang iniiwan sa talababa ang posibleng diin sa pakikipagkasundo.
- source_word: יֹשְׁבֵי גִבְעוֹן
  choice: ang mga naninirahan sa Gibeon
  rationale: Natural na modernong Tagalog para sa substantivized participle na tumutukoy sa mga residente.
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: at nasa gitna na nila
  rationale: Pinananatili ang larawan ng Hebreong בְּקֶרֶב at ang pagtukoy sa presensiya ng mga taga-Gibeon sa gitna ng Israel.
theological_decisions:
- issue: Paglalarawan sa חרם sa konteksto ng pananakop
  choice: itinalaga niya ito sa pagkawasak
  alternative: lubusan niya itong winasak
  rationale: 'Ang Hebreo ay may diwang higit sa karaniwang pagwasak: ang isang bagay ay inilalagay sa ilalim ng חרם at itinatalaga sa pagkawasak. Pinananatili ng salin ang bigat na ito nang hindi nagdaragdag ng paliwanag na wala sa talata.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang makalumang “At nangyari” at ginamit ang likas na temporal na pambungad. Pinanatili ang mahabang, nakabiting pangungusap at pangwakas na kuwit dahil nagpapatuloy ang sintaks at kaisipan sa kasunod na talata.
