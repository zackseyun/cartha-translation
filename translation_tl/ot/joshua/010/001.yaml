  terminology: Maayos ang mga pangalang Adoni-zedek, Jerusalem, Josue, Ai, Jerico, at Gibeon. Ang “itinalaga niya ito sa pagkawasak” ay angkop na salin ng חרם at pinananatili ang natatanging diwa nito. Ang talababa ay angkop at ang mga panandang [a] at [b] ay wastong nakalagay.
