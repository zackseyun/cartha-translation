base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: tl
  text: Walang araw na katulad ng araw na iyon, bago nito o pagkatapos nito, nang pakinggan ni Yahweh ang tinig ng isang tao, sapagkat si Yahweh ay nakipaglaban para sa Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “nang dinggin ni Yahweh ang kahilingan ng isang tao.” Sa literal na Hebreo: “pakinggan ni Yahweh ang tinig ng isang tao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא הָיָה
  choice: At wala nang ibang araw
  rationale: Likas na salin sa Filipino ng negatibong sugnay na nagsasaad ng pag-iral at nagbibigay-diin na walang maihahambing na araw.
- source_word: כַּיּוֹם הַהוּא
  choice: na gaya ng araw na iyon
  rationale: Pinananatili ang tahasang paghahambing ng כְּ at ang pagtukoy sa natatanging araw na iyon.
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: maging bago iyon o pagkatapos nito
  rationale: Ang mga hulaping panghalip ay pinakamalamang na tumutukoy sa araw; nililinaw ito sa Filipino nang hindi inuugnay sa isang tao.
- source_word: לִשְׁמֹעַ יְהוָה
  choice: nang pakinggan ni Yahweh
  rationale: Ginagamit ang pangyayari bilang katangiang dahilan kung bakit walang katulad ang araw; ang “pakinggan” ay nagpapanatili sa diwa ng pagtugon nang hindi ipinahihiwatig na sumunod ang Diyos sa utos ng tao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalan sa paraang pare-pareho at madaling makilala.
- source_word: בְּקוֹל אִישׁ
  choice: ang tinig ng isang tao
  rationale: Malapit sa literal na idyomang Hebreo at pinananatili ang kongkretong pagtukoy kay Josue bilang taong nagsalita.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ang paliwanag kung bakit natatangi ang pangyayari.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: nakipaglaban para sa Israel
  rationale: Ipinahahayag na si Yahweh mismo ang lumaban alang-alang sa Israel; ang aspektong perpektibo ay angkop na isinalin bilang buod ng naganap na pagkilos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah / PANGINOON
  rationale: Pinananatili ang personal na banal na pangalan sa tekstong Hebreo nang walang pagpasok ng natatanging denominasyonal na katawagan.
- issue: Diwa ng לִשְׁמֹעַ ... בְּקוֹל אִישׁ
  choice: pakinggan ni Yahweh ang tinig ng isang tao
  alternative: dinggin ni Yahweh ang kahilingan ng isang tao / sundin ni Yahweh ang isang tao
  rationale: Pinananatili ang Hebreong idyoma at ang kapansin-pansing teolohikal na tensiyon ng pagtugon ni Yahweh sa tao, ngunit iniiwasan ang mas interpretatibong “kahilingan” at ang maaaring magpahiwatig ng pagpapasakop na “sundin.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pormal na “tinig ng isang tao” dahil mahalaga ang literal na idyomang Hebreo, habang ginawang likas sa Filipino ang kabuuang ayos ng pangungusap.
