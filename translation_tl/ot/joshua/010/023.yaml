  text: וַ/יַּ֣עֲשׂוּ כֵ֔ן וַ/יֹּצִ֣יאוּ אֵלָ֗י/ו אֶת חֲמֵ֛שֶׁת הַ/מְּלָכִ֥ים הָ/אֵ֖לֶּה מִן הַ/מְּעָרָ֑ה אֵ֣ת מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶת מֶ֤לֶךְ חֶבְרוֹן֙ אֶת מֶ֣לֶךְ יַרְמ֔וּת אֶת מֶ֥לֶךְ לָכִ֖ישׁ אֶת מֶ֥לֶךְ עֶגְלֽוֹן־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: tl
  text: 'At ginawa nga nila iyon. Inilabas nila mula sa yungib at dinala sa kanya ang limang haring ito: ang hari ng Jerusalem, ang hari ng Hebron, ang hari ng Jarmut, ang hari ng Lakis, at ang hari ng Eglon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: At ginawa nga nila iyon
  rationale: Likas na salaysay sa modernong Tagalog na nagpapahayag ng pagsunod sa naunang utos; ang “nga” ay nagbibigay-diin na ginawa nila ang iniutos nang hindi nagdaragdag ng bagong kahulugan.
- source_word: וַיֹּצִיאוּ
  choice: Inilabas nila
  rationale: 'Tumpak na nagpapahayag ng causative na diwa ng יצא: pinangyari nilang lumabas ang mga hari mula sa yungib.'
- source_word: אֵלָיו
  choice: dinala sa kanya
  rationale: Pinananatili ang tuwirang diwa ng אֶל, “sa kanya,” habang natural na ikinakabit sa kilos ng paglalabas at pagdadala; hindi tahasang pinapangalanan si Josue sapagkat panghalip ang nasa Hebreo.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ang limang haring ito
  rationale: Tuwirang salin ng bilang, pangngalan, at demonstratibo; “hari” ang tiyak na katumbas ng מֶלֶךְ.
- source_word: מִן הַמְּעָרָה
  choice: mula sa yungib
  rationale: Ang “yungib” ay natural at dignified na katawagan sa cave, at malinaw na nagsasaad ng pinanggalingang lugar.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng lugar.
- source_word: יַרְמוּת
  choice: Jarmut
  rationale: Filipinisadong transliterasyon na malapit sa tunog ng Hebreong יַרְמוּת.
- source_word: לָכִישׁ
  choice: Lakis
  rationale: Filipinisadong transliterasyon na malapit sa Hebreong לָכִישׁ at madaling basahin sa Tagalog.
- source_word: עֶגְלוֹן
  choice: Eglon
  rationale: Karaniwang transliterasyon; sa talatang ito, pangalan ito ng lungsod na pinaghaharian, hindi ng hari ng Moab sa Mga Hukom.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Hinati sa dalawang pangungusap ang mahabang Hebreong koordinasyon upang maging natural, ngunit pinanatili ang pagkakasunod-sunod at lahat ng detalye ng pinagmulan.
