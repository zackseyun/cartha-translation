translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kolektibong “buong Israel” at iniwasan ang hindi kailangang talababa tungkol sa kasariang gramatikal, sapagkat walang ganitong pagtatangi ang panghalip na Tagalog na “ito.”
