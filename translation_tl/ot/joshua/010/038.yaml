  text: וַ/יָּ֧שָׁב יְהוֹשֻׁ֛עַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֖/וֹ דְּבִ֑רָ/ה וַ/יִּלָּ֖חֶם עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/038.yaml
  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
translation:
  language: tl
  text: Pagkatapos, bumalik si Josue at ang buong Israel na kasama niya sa Debir, at nilabanan nila ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Ang pandiwang שׁוב sa salaysay ay nagsasaad ng pagbabalik; tuwiran at likas sa makabagong Tagalog ang “bumalik.”
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Joshua sa Filipino.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: at ang buong Israel na kasama niya
  rationale: Pinananatili nito ang kolektibong “buong Israel” at malinaw na ipinahahayag ang עִמּוֹ, “kasama niya.”
- source_word: דְּבִרָה
  choice: sa Debir
  rationale: Ang hulaping directional ה ay nagpapahiwatig ng pagkilos patungo sa Debir; pagkatapos ng “bumalik,” natural itong isalin na “sa Debir.”
- source_word: וַיִּלָּחֶם
  choice: nilabanan nila
  rationale: Ang לָחַם dito ay tumutukoy sa pakikipaglaban laban sa isang lungsod. Ang “nilabanan” ay tuwiran at hindi kasing-tindi ng mas interpretatibong “sinalakay.”
- source_word: עָלֶיהָ
  choice: ito
  rationale: Ang pambabaeng panghalip sa Hebreo ay tumutukoy sa lungsod ng Debir. Sa Tagalog, likas na gamitin ang walang-kasariang “ito.”
