  text: So Joshua came upon them suddenly[b][a], having marched up from Gilgal all night.
translation:
  language: tl
  text: Kaya biglang dumating si Josue sa kanila[a], matapos siyang maglakbay nang buong gabi mula sa Gilgal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “dumating sa kanila.” Sa kontekstong militar, maaaring tumukoy ito sa biglaang paglapit ni Josue sa kaaway.
    reason: lexical_alternative
  - marker: b
    text: Literal na “umakyat mula sa Gilgal nang buong gabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: dumating sa kanila
  rationale: Ang בוא na may אֶל ay tuwirang nagsasaad ng pagdating o paglapit sa kanila. Pinananatili ng saling ito ang likas na di-tiyak na pahiwatig ng Hebreo; ang kontekstong militar ang nagpapakitang kaaway ang nilapitan.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Karaniwang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: פִּתְאֹם
  choice: biglang
  rationale: Likas at tuwirang katumbas sa Tagalog na nagpapahayag ng di-inaasahan o mabilis na pagdating.
- source_word: כָּל הַלַּיְלָה
  choice: nang buong gabi
  rationale: Malinaw na ipinapahayag ang haba ng panahong saklaw ng paglalakbay.
- source_word: עָלָה
  choice: maglakbay
  rationale: Sa salaysay-militar, tumutukoy ito sa pag-ahon o pagpunta mula sa Gilgal. Ginawang natural sa Tagalog ang kilos nang hindi tahasang nagdaragdag ng pakikipaglaban; inilalahad sa talababa ang literal na aspektong paahon.
- source_word: מִן הַגִּלְגָּל
  choice: mula sa Gilgal
  rationale: Tuwirang salin ng pinanggalingang lugar, na pinananatili ang pangalang pantangi.
