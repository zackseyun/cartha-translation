  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “dumating sa kanila” upang mapanatili ang literal na saklaw at kalabuan ng Hebreo, habang ang mga talababa ay nagbibigay ng militar at topograpikong pahiwatig.
