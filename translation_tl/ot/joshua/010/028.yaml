source:
  edition: WLC
  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: tl
  text: Nang araw ding iyon, sinakop ni Josue ang Makeda at sinalakay niya ito sa talim ng tabak. Itinalaga niya sa ganap na paglipol[a] ang hari nito at ang bawat taong nasa lungsod; wala siyang iniwang nakaligtas. Ginawa niya sa hari ng Makeda ang gaya ng ginawa niya sa hari ng Jerico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lubusang nilipol.” Ang pandiwang Hebreo ay tumutukoy sa pagtatalaga ng isang bagay o mga tao sa paglipol sa ilalim ng ban.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: sinakop
  rationale: Karaniwang gamit sa kontekstong militar para sa pagkuha ng isang lunsod; natural at malinaw sa modernong Filipino.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: pinuksa ito sa talim ng tabak
  rationale: Pinananatili ng “sa talim ng tabak” ang konkretong larawang Hebreo; ang “pinuksa” ay angkop sa malawakang pagpatay na nililinaw ng kasunod na sugnay.
- source_word: הֶחֱרִם
  choice: itinalaga ... sa ganap na paglipol
  rationale: Ipinahahayag nito ang ḥerem—pagtatalaga sa pagkawasak—sa halip na gawing payak lamang na “nilipol.”
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: ang bawat taong naroon
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa mga tao o buhay, hindi partikular sa di-materyal na kaluluwa.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: wala siyang iniwang nakaligtas
  rationale: Natural na Filipino at tuwirang katumbas ng pahayag na walang natirang survivor.
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: Ginawa niya sa hari ng Makeda ang gaya ng ginawa niya sa hari ng Jerico
  rationale: Pinananatili ang sadyang maikli at hindi detalyadong paghahambing ng Hebreo.
- source_word: יְהוֹשֻׁעַ / מַקֵּדָה / יְרִיחוֹ
  choice: Josue / Makeda / Jerico
  rationale: Ginamit ang mga anyong pangalang pamilyar at matagal nang kinikilala sa tradisyong Bibliyang Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa חרם sa salaysay ng pananakop
  choice: itinalaga ... sa ganap na paglipol
  alternative: lubusang nilipol; isinailalim sa pagbabawal
  rationale: Ang pandiwa ay may ideya ng pagtatalaga sa pagkawasak sa konteksto ng digmaan, hindi lamang pangkalahatang pagpatay. Pinananatili ng salin ang ritwal at teolohikal na bigat nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang maigsi at matinding himig ng salaysay, gayundin ang teknikal na diwa ng חרם sa pamamagitan ng pangunahing salin at talababa.
