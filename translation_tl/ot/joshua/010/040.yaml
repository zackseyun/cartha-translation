  to: Kaya sinalakay ni Josue ang buong lupain—ang kaburulan, ang Negev, ang mababang lupain, at ang mga dalisdis—at ang lahat ng kanilang hari. Wala siyang iniwang nakaligtas, kundi itinalaga niya sa ganap na paglipol[b] ang lahat ng may hininga[a], gaya ng iniutos ni Yahweh, ang Diyos ng Israel.
