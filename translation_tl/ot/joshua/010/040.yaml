id: JOS.10.40
reference: Joshua 10:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: tl
  text: Kaya sinalakay ni Josue ang buong lupain—ang kaburulan, ang Negev, ang mababang lupain, at ang mga dalisdis—at ang lahat ng kanilang hari. Wala siyang iniwang nakaligtas, kundi itinalaga niya sa ganap na paglipol[b] ang lahat ng may hininga[a], gaya ng iniutos ni Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat nilalang na humihinga.” Sa literal, ang Hebreo ay tumutukoy sa “lahat ng hininga” o “lahat ng may hininga.”
    reason: lexical_alternative
  - marker: b
    text: O “lubusang nilipol” o “isinailalim sa pagbabawal.” Ang pandiwang Hebreo ay tumutukoy sa di-mababawing pagtatalaga ng isang bagay sa ganap na paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: nilupig
  rationale: Ipinahahayag ng נכה ang pananakit o pagpapabagsak sa digmaan. Ang “nilupig” ay natural sa Filipino at angkop sa buod ng matagumpay na kampanya nang hindi gumagamit ng makalumang “sinaktan.”
- source_word: כָּל הָאָרֶץ
  choice: ang buong lupain
  rationale: Ang אֶרֶץ ay tumutukoy rito sa rehiyong saklaw ng kampanya, hindi sa buong daigdig.
- source_word: הָהָר
  choice: ang kaburulan
  rationale: Ginagamit dito ang הָהָר bilang katawagang panrehiyon para sa mataas at maburol na bahagi ng lupain.
- source_word: הַנֶּגֶב
  choice: ang Negev
  rationale: Pinanatili ang heograpikong pangalan ng tuyong rehiyon sa timog sa halip na ipakahulugan lamang bilang “timog.”
- source_word: הַשְּׁפֵלָה
  choice: ang mababang lupain
  rationale: Malinaw na inilalarawan nito ang mababang rehiyon sa pagitan ng kaburulan at baybayin.
- source_word: הָאֲשֵׁדוֹת
  choice: ang mga dalisdis
  rationale: Ang אֲשֵׁדוֹת ay tumutukoy sa mga pahilis na bahagi o pagbaba ng lupain; natural at maikli ang “mga dalisdis.”
- source_word: כָּל מַלְכֵיהֶם
  choice: ang lahat ng hari ng mga iyon
  rationale: Pinananatili nito ang ugnayan ng mga hari sa mga nabanggit na lupain habang iniiwasan ang malabong panghalip na maaaring tumukoy sa mga tao.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Wala siyang iniwang nakaligtas
  rationale: Ang שָׂרִיד ay isang nakaligtas o natira; ang parirala ay malinaw at natural sa konteksto ng digmaan.
- source_word: כָּל הַנְּשָׁמָה
  choice: ang lahat ng may hininga
  rationale: Pinananatili nito ang matindi at malawak na idyomang Hebreo nang hindi ito tahasang nililimitahan sa “bawat tao.”
- source_word: הֶחֱרִים
  choice: itinalaga niya sa paglipol
  rationale: Ang Hiphil ng חרם ay may diwang kultiko ng di-mababawing pagtatalaga sa pagwasak. Pinananatili ng salin ang diwang ito sa halip na gawing simpleng “nilipol.”
- source_word: כַּאֲשֶׁר צִוָּה
  choice: gaya ng iniutos
  rationale: Ipinakikita ng parirala na ang ginawa ni Josue ay ayon sa naunang utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng titulong “PANGINOON.”
theological_decisions:
- issue: Kahulugan ng חרם sa digmaan
  choice: itinalaga niya sa paglipol
  alternative: lubusang nilipol; isinailalim sa pagbabawal
  rationale: Pinananatili nito kapwa ang aktuwal na paglipol at ang natatanging diwa ng pagtatalaga sa ilalim ng ḥerem, nang hindi pinapahina o ginagawang labis na teknikal ang pahayag.
- issue: Saklaw ng כָּל הַנְּשָׁמָה
  choice: ang lahat ng may hininga
  alternative: bawat tao; bawat nilalang na humihinga
  rationale: Hindi nilulutas nang palihim ang saklaw ng idyoma. Inilalahad sa salin ang mismong larawang Hebreo at inilalagay sa talababa ang posibleng mas tahasang pagbasa.
translation_notes:
  register: 'Makabago ngunit marangal na Filipino. Ginamit ang mga karaniwang katawagang pangheograpiya at pinanatili ang “Negev” bilang pangalang pantangi. Magkasunod ang [a] at [b] dahil magkaibang salitang Hebreo sa iisang sugnay ang nililinaw ng mga ito: ang saklaw ng “may hininga” at ang kultikong diwa ng “itinalaga sa paglipol.”'
