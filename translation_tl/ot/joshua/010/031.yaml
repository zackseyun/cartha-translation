translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang anyong Tagalog ng mga pangalang Josue, Libna, at Lakis. Hinati sa dalawang pangungusap upang maging natural ang daloy, habang pinananatili ang pagkakasunod-sunod ng mga kilos sa Hebreo.
