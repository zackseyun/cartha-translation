revisions:
- from: Pagkatapos, umalis si Josue at ang buong Israel na kasama niya mula sa Libna patungong Lakis. Nagkampo sila laban dito at nakipaglaban dito.
  to: Pagkatapos, nagpatuloy si Josue, kasama ang buong Israel, mula sa Libna patungong Lakis. Nagkampo sila laban dito at nakipagdigma laban dito.
  rationale: Pinalitan ang “umalis” ng “nagpatuloy” upang higit na maipakita ang paggalaw mula sa isang lungsod tungo sa iba. Pinalitan ang huling parirala upang maging malinaw na ang Lakis ang kaaway na pinagdigmaan, hindi lamang ang lugar kung saan naganap ang labanan. Napanatili ang kolektibong Israel na kasama ni Josue at ang pagkakasunod-sunod ng mga kilos sa Hebreo.
