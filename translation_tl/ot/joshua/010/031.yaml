  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: tl
  text: Pagkatapos, nagpatuloy si Josue, kasama ang buong Israel, mula sa Libna patungong Lakis. Nagkampo sila laban dito at nakipagdigma laban dito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: umalis … mula … patungong
  rationale: Ang עבר ay may malawak na diwang ‘dumaan/lumipat.’ Sa kontekstong militar ng pagpunta mula sa isang lungsod tungo sa iba, likas sa modernong Tagalog ang ‘umalis … mula … patungong’ at hindi ito nagpapahiwatig ng pagtawid sa ilog.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: at ang buong Israel na kasama niya
  rationale: Tuwirang pinananatili ang kolektibong ‘Israel,’ na sa konteksto ay tumutukoy sa mga taong hukbong kasama ni Josue.
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: mula sa Libna patungong Lakis
  rationale: Ang hulaping direksiyonal sa לָכִישָׁה ay nagsasaad ng pagkilos tungo sa Lakis; malinaw itong naihahayag ng ‘patungong.’
- source_word: וַיִּחַן עָלֶיהָ
  choice: Nagkampo sila laban dito
  rationale: Ang חנה ay ‘magkampo,’ at ang עַל sa konteksto ng pagsalakay ay nagsasaad ng mapanlabang pagpuwesto, hindi lamang pagiging malapit sa lungsod.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: at nakipaglaban dito
  rationale: Ang Niphal ng לחם ay nangangahulugang ‘makipaglaban/makidigma.’ Ang ‘nakipaglaban dito’ ay natural na Tagalog at pinananatili ang lungsod bilang tinutukoy ng pambabaeng panghalip sa Hebreo.
