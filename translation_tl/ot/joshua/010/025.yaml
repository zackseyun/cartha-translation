  terminology: Ang "Josue" ay tanggap na nakaugaliang anyong Filipino, at ang "Yahweh" ay wastong pinananatili ayon sa proyekto. Ang "magpakatatag" at "lakasan ninyo ang inyong loob" ay mahusay na naghihiwalay sa dalawang pandiwang Hebreo.
