base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: tl
  text: At sinabi ni Josue sa kanila, “Huwag kayong matakot at huwag kayong masindak.[a] Magpakatatag kayo at lakasan ninyo ang inyong loob, sapagkat ganito ang gagawin ni Yahweh sa lahat ng inyong mga kaaway na nilalabanan ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “huwag kayong panghinaan ng loob” o “huwag kayong masiraan ng loob.”'
    reason: Ipinahihiwatig ng חתת ang pagkasindak, pagkadismaya, o pagkawasak ng loob.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: At sinabi ni Josue sa kanila
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “At sinabi.” Ginamit ang nakaugaliang anyong Tagalog na “Josue” para sa pangalan.
- source_word: אַל תִּירְאוּ
  choice: Huwag kayong matakot
  rationale: Tuwirang ipinapahayag ang maramihang pagbabawal at ang karaniwang kahulugan ng ירא.
- source_word: וְאַל תֵּחָתּוּ
  choice: at huwag panghinaan ng loob
  rationale: Sa Niphal, ang חתת ay tumutukoy sa pagkapanghina, pagkasindak, o pagkawasak ng loob. Ang pariralang ito ay natural sa Tagalog at hindi inuulit lamang ang “matakot.”
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Magpakatatag kayo at lakasan ninyo ang inyong loob
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit naiibang utos: maging matatag at magkaroon ng matapang na kapasiyahan.'
- source_word: כִּי כָכָה
  choice: sapagkat ganito
  rationale: Ipinapakita kapwa ang batayan ng panghihikayat (כִּי) at ang demonstratibong paraan o huwaran (כָכָה).
- source_word: יַעֲשֶׂה יְהוָה
  choice: ang gagawin ni Yahweh
  rationale: Ang yiqtol ay likas na tumutukoy sa hinaharap sa kontekstong ito; pinanatili ang personal na pangalang Yahweh.
- source_word: לְכָל אֹיְבֵיכֶם
  choice: sa lahat ng inyong kaaway
  rationale: Direktang ipinapahayag ang mga tatanggap ng gagawin ni Yahweh.
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: na inyong nilalabanan
  rationale: Natural na Tagalog para sa Hebreong konstruksiyong may pandiwang ‘makipaglaban’ at object marker; pinananatili ang kasalukuyang pakikipaglaban.
theological_decisions:
- issue: Pagpapahayag sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalang tipan ang tuwirang nasa tekstong Hebreo; pinananatili itong “Yahweh” nang hindi pinapalitan ng titulo.
- issue: Saklaw ng pangakong tagumpay
  choice: sa lahat ng inyong kaaway na inyong nilalabanan
  alternative: sa lahat ng kaaway sa pangkalahatan
  rationale: 'Pinananatili ang tiyak na saklaw ng pangungusap: ang mga kaaway na kinakaharap ng kausap sa kontekstong ito, nang hindi pinalalawak bilang pangkalahatang pangako.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo” ayon sa mga pandiwang Hebreo. Iniwasan ang sobrang arkaikong pananalita habang pinananatili ang maindayog na pares ng mga utos.
