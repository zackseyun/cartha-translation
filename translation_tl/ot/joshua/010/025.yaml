revisions:
- from: At sinabi ni Josue sa kanila, “Huwag kayong matakot at huwag panghinaan ng loob.[a] Magpakatatag kayo at lakasan ninyo ang inyong loob, sapagkat ganito ang gagawin ni Yahweh sa lahat ng inyong kaaway na inyong nilalabanan.”
  to: At sinabi ni Josue sa kanila, “Huwag kayong matakot at huwag kayong masindak.[a] Magpakatatag kayo at lakasan ninyo ang inyong loob, sapagkat ganito ang gagawin ni Yahweh sa lahat ng inyong mga kaaway na nilalabanan ninyo.”
  rationale: Pinalitan ang pangunahing katapat ng חתת ng "huwag kayong masindak" upang mas maipakita ang tiyak na puwersa nito at mapanatili ang pagkakaiba sa unang utos na "huwag kayong matakot." Inilipat sa talababa ang mga idiomatikong alternatibong tumutukoy sa panghihina o pagkasira ng loob. Idinagdag ang "mga" sa "mga kaaway" upang malinaw na maipahayag ang maramihang saklaw ng Hebreo. Hindi binago ang kahulugan o ang saklaw ng pangako.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:31:33Z'
