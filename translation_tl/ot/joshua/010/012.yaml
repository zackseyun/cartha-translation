    rationale: Ang Hebreo ay may “sa harap ng/bago ng mga anak ni Israel.” Ang “sa harap ng” ay dapat isama upang mapanatili ang tekstuwal na detalye.
  - severity: low
    issue: Ang “ikaw” sa ikalawang utos ay dagdag na hindi kailangan.
    rationale: Walang panghalip sa Hebreo; ang elipsis ng pandiwa sa “buwan” ay mas mahusay na mapananatili nang walang dagdag na panghalip.
