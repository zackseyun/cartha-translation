  verdict: revise
  source_fidelity: Ang draft ay wastong naghihiwalay sa 'nagsalita' (יְדַבֵּר) at 'sinabi' (וַיֹּאמֶר), pinananatili ang Yahweh, at maayos na isinasalin ang utos sa araw. Gayunman, ang pambungad na “Nang araw na” ay hindi ganap na likas, at ang “sa mga anak ni Israel” ay hindi naisasama ang spatial/public force ng לִפְנֵי (“sa harap ng/bago”).
  naturalness: Mas natural sa modernong Filipino ang “Noong araw na.” Ang pag-aalis sa dagdag na “ikaw” bago ng “buwan” ay mas malapit din sa siksik at patulang elipsis ng Hebreo, habang nananatiling malinaw sa tulong ng talababa.
  terminology: Ang “Yahweh,” “Josue,” “mga Amoreo,” “Israel,” “Gibeon,” at “Lambak ng Aijalon” ay angkop at pare-pareho. Ang “tumigil ka” ay isang ligtas na modernong salin ng דּוֹם sa kontekstong ito.
  issues:
