revisions:
- from: Nang araw na ibinigay ni Yahweh ang mga Amoreo sa mga anak ni Israel, nagsalita si Josue kay Yahweh. Sinabi niya sa harap ng Israel, “Araw, tumigil ka sa Gibeon; at ikaw, buwan, sa Lambak ng Aijalon.”[a]
  to: Noong araw na ibinigay ni Yahweh ang mga Amoreo sa harap ng mga anak ni Israel, nagsalita si Josue kay Yahweh. At sinabi niya sa harap ng Israel, “Araw, tumigil ka sa Gibeon; at buwan, sa Lambak ng Aijalon.”[a]
  rationale: Inayos ang panandang temporal para sa likas na Filipino, ibinalik ang “sa harap ng” upang katawanin ang לִפְנֵי, at pinanatili ang makatang elipsis sa ikalawang sugnay. Hindi binibigyan ng salin ng anumang paliwanag na pisikal o doktrinal ang utos sa araw at buwan.
