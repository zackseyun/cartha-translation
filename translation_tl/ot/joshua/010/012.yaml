  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: tl
  text: Noong araw na ibinigay ni Yahweh ang mga Amoreo sa harap ng mga anak ni Israel, nagsalita si Josue kay Yahweh. At sinabi niya sa harap ng Israel, “Araw, tumigil ka sa Gibeon; at buwan, sa Lambak ng Aijalon.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, walang pandiwang inuulit pagkatapos ng “buwan”; nauunawaan mula sa naunang utos ang “tumigil ka.” Maaari ring isalin ang דּוֹם na “manahimik ka” o “huwag kang kumilos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר
  choice: nagsalita
  rationale: Pinananatili ang kahulugang ‘magsalita’ at ang pagkakaiba nito sa kasunod na וַיֹּאמֶר, na isinaling ‘sinabi.’
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay tumutukoy sa kausap ni Josue, at ang pangalang יהוה ay tuwirang isinaling ‘Yahweh.’
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: Nang araw na ibinigay ni Yahweh
  rationale: Likas na salin sa Tagalog ng panandang temporal na בְּיוֹם kasama ng infinitive construct.
- source_word: הָאֱמֹרִי
  choice: ang mga Amoreo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo itong tumutukoy sa bayang Amoreo sa konteksto ng labanan.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Sa idyomang ‘ibinigay ... sa harap ng,’ ang diwa ay ipinailalim o ibinigay sa kapangyarihan ng Israel; ang ‘mga anak ni Israel’ ay nagpapanatili sa pamilyal na anyo ng Hebreo nang natural sa Tagalog.
- source_word: וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל
  choice: Sinabi niya sa harap ng Israel
  rationale: Ang לְעֵינֵי ay idyomang nagsasaad na sinabi ito nang hayagan at nasasaksihan ng Israel.
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: Araw, tumigil ka
  rationale: Maaaring mangahulugan ang דום ng pagiging tahimik, hindi pagkilos, o paghinto. Sa kontekstong kosmiko, malinaw at hindi labis na mapagpaliwanag ang ‘tumigil ka.’
- source_word: בְּגִבְעוֹן
  choice: sa Gibeon
  rationale: Pinananatili ng ‘sa’ ang malawak na puwang ng kahulugan ng preposisyong בְּ nang hindi ipinipilit kung ‘nasa’ o ‘sa ibabaw ng’ Gibeon.
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: at ikaw, buwan, sa Lambak ng Aijalon
  rationale: Walang inuulit na pandiwa sa ikalawang sugnay ng Hebreo; nauunawaan ang utos mula sa unang sugnay. Pinananatili ng salin ang elipsis na ito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo na יהוה ang nasa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang natatanging tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng himalang inilalarawan ng דום
  choice: tumigil ka
  alternative: manahimik ka; manatili kang hindi gumagalaw
  rationale: Hindi ipinaliliwanag ng talata ang mekanismong pisikal ng pangyayari. Ang ‘tumigil ka’ ay nagpapanatili sa utos at sa saklaw ng pandiwang Hebreo nang hindi nagdaragdag ng tiyak na modelong pang-agham.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘Josue,’ ‘mga Amoreo,’ at ‘Lambak ng Aijalon’ bilang mga pamilyar na anyong Tagalog. Pinanatili ang maikling, makatang ayos ng tuwirang utos at ang elipsis sa ikalawang sugnay.
