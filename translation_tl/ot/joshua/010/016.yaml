translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “yungib” bilang natural na salitang biblikal na nauunawaan pa rin ng ordinaryong mambabasa; iniwasan ang sobrang literal na ayos ng Hebreo.
