  text: But these five kings fled and hid in the cave at Makkedah[a].
translation:
  language: tl
  text: Ngunit tumakas ang limang haring ito at nagtago sa yungib sa Makkeda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At tumakas ang limang haring ito at nagtago sa yungib sa Makkeda.”
    reason: Pinananatili ang posibilidad na ang וַ ay karaniwang pang-ugnay lamang na “At,” sa halip na salungat na “Ngunit.”
lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: tumakas
  rationale: Ang pandiwang נוּס ay tumutukoy sa pagtakas mula sa panganib; natural at tuwiran ang “tumakas” sa makabagong Tagalog.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ang limang haring ito
  rationale: Pinananatili ng “ito” ang demonstratibong הָאֵלֶּה, habang natural sa Tagalog ang ayos na “ang limang haring ito.”
- source_word: וַיֵּחָבְאוּ
  choice: nagtago
  rationale: Ipinahahayag ng “nagtago” ang diwang reflexive ng חבא sa natural at karaniwang Tagalog.
- source_word: בַמְּעָרָה
  choice: sa yungib
  rationale: Ang “yungib” ay dignidad ngunit malinaw na katumbas ng מְעָרָה; ang “sa” ay natural na naghahatid ng lokatibo at hindi kailangang tahasang markahan ang definite article sa Tagalog.
- source_word: בְּמַקֵּדָה
  choice: sa Makkeda
  rationale: Ang pang-ukol na “sa” ay natural para sa lokasyon, at ang pangalang pook ay tinumbasan bilang “Makkeda” ayon sa karaniwang anyong Filipino.
- source_word: וַ
  choice: Ngunit
  rationale: Bagaman maaaring simpleng pang-ugnay na “At” ang waw, ipinahihiwatig ng “Ngunit” ang salungat na pagliko mula sa naunang tagpo nang hindi binabago ang pangyayari.
