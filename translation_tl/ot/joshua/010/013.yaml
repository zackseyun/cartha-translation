  to: Kaya tumigil ang araw[a], at huminto ang buwan, hanggang sa maghiganti ang bansa sa mga kaaway nito. Hindi ba ito nakasulat sa Aklat ni Jashar?[b] Tumigil ang araw sa gitna ng langit at hindi nagmadaling lumubog[c] sa loob ng halos isang buong araw.[d]
