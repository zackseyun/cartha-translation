  text: וַ/יִּדֹּ֨ם הַ/שֶּׁ֜מֶשׁ וְ/יָרֵ֣חַ עָמָ֗ד עַד יִקֹּ֥ם גּוֹי֙ אֹֽיְבָ֔י/ו הֲ/לֹא הִ֥יא כְתוּבָ֖ה עַל סֵ֣פֶר הַ/יָּשָׁ֑ר וַ/יַּעֲמֹ֤ד הַ/שֶּׁ֨מֶשׁ֙ בַּ/חֲצִ֣י הַ/שָּׁמַ֔יִם וְ/לֹא אָ֥ץ לָ/ב֖וֹא כְּ/י֥וֹם תָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: tl
  text: Kaya tumigil ang araw[a], at huminto ang buwan, hanggang sa maghiganti ang bansa sa mga kaaway nito. Hindi ba ito nakasulat sa Aklat ni Jashar?[b] Tumigil ang araw sa gitna ng langit at hindi nagmadaling lumubog[c] sa loob ng halos isang buong araw.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanahimik ang araw.” Ang pandiwang Hebreo ay maaari ring mangahulugang “tumigil” o “manahimik.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Aklat ni Jashar”; maaari ring “Aklat ng Matuwid.”
    reason: alternative_reading
  - marker: c
    text: Sa literal, “hindi nagmadaling pumaroon,” na sa konteksto ng araw ay nangangahulugang lumubog.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “gaya ng isang buong araw” o “halos isang buong araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  choice: tumigil ang araw
  rationale: Ang דמם ay maaaring mangahulugang manahimik o tumigil. Sa pagkakatulad nito sa paghinto ng buwan at sa kontekstong pangkalangitan, malinaw at natural sa Tagalog ang “tumigil.”
- source_word: וְיָרֵחַ עָמָד
  choice: at huminto ang buwan
  rationale: Literal na “tumayo” ang עמד, ngunit kapag ukol sa isang bagay sa langit, natural nitong ipinahihiwatig ang paghinto.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: hanggang sa makapaghiganti ang bansa sa mga kaaway nito
  rationale: Sa idyomang ito, ang נקם ay tumutukoy sa pagganti o pagtatamo ng katarungan laban sa mga kaaway. Pinananatili ng “bansa” ang karaniwang halaga ng גוי at ng “nito” ang kolektibong isahan.
- source_word: הֲלֹא הִיא כְתוּבָה
  choice: Hindi ba ito nakasulat
  rationale: Ang pambabaeng panghalip ay malamang na tumutukoy sa naunang salaysay o sipi; natural sa Tagalog ang “ito.”
- source_word: סֵפֶר הַיָּשָׁר
  choice: Aklat ni Jashar
  rationale: Itinuturing ang יָשָׁר bilang pangalan sa pamagat ng isang sangguniang aklat, habang inilalagay sa talababa ang posibleng kahulugang “Matuwid.”
- source_word: וַיַּעֲמֹד הַשֶּׁמֶשׁ בַּחֲצִי הַשָּׁמַיִם
  choice: Nanatili ang araw sa gitna ng langit
  rationale: Ang עמד ay literal na tumayo o manatili. Sa ikalawang paglalarawan, natural ang “nanatili,” at malinaw na tumutukoy ang “gitna ng langit” sa posisyon nito sa kalangitan.
- source_word: וְלֹא אָץ לָבוֹא
  choice: at hindi nagmadaling lumubog
  rationale: Ang אוץ ay “magmadali,” at ang בוא kapag tumutukoy sa araw ay idyomatikong nauugnay sa paglubog nito.
- source_word: כְּיוֹם תָּמִים
  choice: nang halos isang buong araw
  rationale: Ipinahihiwatig ng תמים ang kabuuan, samantalang pinananatili ng “halos” ang di-tiyak na puwersa ng pahambing na כ.
theological_decisions:
- issue: Kalikasan ng pambihirang pangyayaring pangkalangitan
  choice: Tuwirang isinalin bilang paghinto ng araw at buwan.
  alternative: Ituring lamang bilang pananalitang batay sa pagmamasid o bilang matalinghagang tula.
  rationale: Inilalahad ng salaysay ang pangyayari bilang pambihira. Hindi dapat ipasok ng salin ang makabagong paliwanag na siyentipiko ni bawasan ito tungo sa talinghaga lamang.
- issue: Diwa ng paghihiganti o pagbibigay-katarungan
  choice: makapaghiganti ang bansa sa mga kaaway nito
  alternative: maipaghiganti ng bansa ang sarili laban sa mga kaaway nito
  rationale: Kayang taglayin ng idyoma ang diwa ng paghihiganti at pagbibigay-katarungan; inilalagay sa talababa ang alternatibo upang mapanatili ang saklaw ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang pahayag tungkol sa araw at buwan, ang kolektibong “bansa,” at ang di-tiyak na sukat ng huling parirala. Ang lahat ng marker [a]–[d] ay nasa pangunahing teksto at tumutugma sa mga talababa.
