  to: Pagkatapos, nagpadala ng mga mensahero ang mga lalaki ng Gibeon kay Josue, sa kampo sa Gilgal, na nagsasabi, “Huwag mong pabayaan ang iyong mga lingkod.[a] Umakyat ka agad papunta sa amin! Iligtas mo kami at tulungan mo kami, sapagkat nagtipon laban sa amin ang lahat ng hari ng mga Amorita na naninirahan sa kaburulan.”
