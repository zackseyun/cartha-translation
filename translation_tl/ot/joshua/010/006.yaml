  text: וַ/יִּשְׁלְח֣וּ אַנְשֵׁי֩ גִבְע֨וֹן אֶל יְהוֹשֻׁ֤עַ אֶל הַֽ/מַּחֲנֶה֙ הַ/גִּלְגָּ֣לָ/ה לֵ/אמֹ֔ר אַל תֶּ֥רֶף יָדֶ֖י/ךָ מֵֽ/עֲבָדֶ֑י/ךָ עֲלֵ֧ה אֵלֵ֣י/נוּ מְהֵרָ֗ה וְ/הוֹשִׁ֤יעָ/ה לָּ֨/נוּ֙ וְ/עָזְרֵ֔/נוּ כִּ֚י נִקְבְּצ֣וּ אֵלֵ֔י/נוּ כָּל מַלְכֵ֥י הָ/אֱמֹרִ֖י יֹשְׁבֵ֥י הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: tl
  text: Pagkatapos, nagpadala ng mga mensahero ang mga lalaki ng Gibeon kay Josue, sa kampo sa Gilgal, na nagsasabi, “Huwag mong pabayaan ang iyong mga lingkod.[a] Umakyat ka agad papunta sa amin! Iligtas mo kami at tulungan mo kami, sapagkat nagtipon laban sa amin ang lahat ng hari ng mga Amorita na naninirahan sa kaburulan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “Huwag mong luwagan ang iyong kamay mula sa iyong mga lingkod”—isang idyomang nangangahulugang huwag tumigil sa pagtulong sa kanila o huwag sila pabayaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן
  choice: nagsugo ang mga lalaki ng Gibeon
  rationale: Pinananatili ng “nagsugo” ang sunod na kilos sa salaysay, at ng “mga lalaki” ang tahasang panlalaking anyo na malamang tumutukoy sa mga kinatawan ng lungsod.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: kay Josue sa kampo sa Gilgal
  rationale: Likas sa Tagalog ang ganitong ayos para ipahayag na ang mensahe ay ipinadala kay Josue, na nasa kampo sa Gilgal; ang hulaping patunguhan sa גִּלְגָּלָה ay hindi kailangang ilantad nang pilit.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: Huwag mong pabayaan ang iyong mga lingkod
  rationale: Ang literal na larawan ng hindi pagpapahina o pag-aalis ng kamay ay isang idyoma para sa hindi paghinto ng pagtulong o hindi pag-abandona. Ang “pabayaan” ay malinaw at natural, habang inilalahad sa talababa ang larawan sa Hebreo.
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: Dali kang umahon dito sa amin
  rationale: Inihahayag ng “umahon” ang pag-akyat mula Gilgal tungo sa kaburulan, at ng “dali” ang agarang pakiusap.
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: Iligtas mo kami at tulungan
  rationale: Direktang pinananatili ang magkaugnay ngunit magkahiwalay na mga pakiusap na iligtas at tulungan sila sa panganib militar.
- source_word: כִּי נִקְבְּצוּ אֵלֵינוּ
  choice: sapagkat nagtipon laban sa amin
  rationale: Sa kontekstong mapanlaban, ang אֶל ay may diwang paglapit laban sa kanila, hindi basta pagtitipon sa kanilang kinaroroonan.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר
  choice: ang lahat ng hari ng mga Amorita na naninirahan sa kaburulan
  rationale: Ang kolektibong pangalang Amorita ay likas na isinaling maramihan sa Tagalog, at ang הָהָר dito ay tumutukoy sa rehiyong maburol o kaburulan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Josue” bilang nakaugaliang anyong Tagalog ng pangalang biblikal. Pinanatili ang topograpikong diwa sa “umahon” at iniwasan ang labis na teolohikong pagpapakahulugan sa “iligtas.”
