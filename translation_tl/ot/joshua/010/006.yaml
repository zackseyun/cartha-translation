  source_fidelity: 'Tumpak ang pangunahing diwa ng Hebreo: nagsumamo ang mga kinatawan ng Gibeon kay Josue na huwag silang pabayaan, umakyat agad upang iligtas at tulungan sila, sapagkat nagkatipon laban sa kanila ang mga hari ng mga Amorita sa kaburulan. Ang idyoma tungkol sa ‘kamay’ ay wastong ipinaliwanag sa talababa.'
  naturalness: 'May dalawang kailangang ayusin para sa likas at wastong modernong Tagalog: ang ‘Dali kang umahon’ ay hindi likas na anyo ng agarang utos, at ang ‘tulungan’ ay kulang sa tuwirang layon/angkop na panghalip sa pangungusap. Nilinaw rin ang ipinadalang mensahero, na ipinahihiwatig ng pandiwang Hebreo sa kontekstong ito.'
  terminology: Ang ‘Josue,’ ‘mga lingkod,’ ‘Amorita,’ at ‘kaburulan’ ay angkop sa marangal ngunit modernong rehistro. Ang ‘iligtas’ ay tapat sa kontekstong militar nang hindi nagdaragdag ng doktrinal na kahulugan.
