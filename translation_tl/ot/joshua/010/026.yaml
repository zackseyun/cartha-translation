  terminology: Ang “ibinitin” at “mga puno” ay angkop at hindi labis na nagtatakda ng paraan ng pagsuspinde. Ang paliwanag sa talababa ay maingat na pinananatili ang di-tiyak na alternatibong “itinarak.”
