  text: וַ/יַּכֵּ֨/ם יְהוֹשֻׁ֤עַ אַֽחֲרֵי כֵן֙ וַ/יְמִיתֵ֔/ם וַ/יִּתְלֵ֕/ם עַ֖ל חֲמִשָּׁ֣ה עֵצִ֑ים וַ/יִּֽהְי֛וּ תְּלוּיִ֥ם עַל הָ/עֵצִ֖ים עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: tl
  text: Pagkatapos nito, sinaktan sila ni Josue at pinatay niya sila. Ibinitin niya sila sa limang puno[a], at nanatili silang nakabitin sa mga puno hanggang sa kinagabihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinabit sila.” Ang pandiwang Hebreo ay tumutukoy sa pagsuspinde ng mga katawan sa kahoy o puno. Posible rin ang diwang “itinarak sila sa mga tulos,” ngunit hindi ito tiyak dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: sinaktan sila
  rationale: Ang Hifil ng נכה ay tumutukoy sa marahas na pananakit o paghampas. Pinananatili ng “sinaktan” na hiwalay ang kilos na ito sa kasunod na וַיְמִיתֵם, na tahasang nagsasabing pinatay sila.
- source_word: אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Natural na makabagong Tagalog para sa karaniwang pahayag ng pagkakasunod-sunod sa salaysay.
- source_word: וַיְמִיתֵם
  choice: at pinatay
  rationale: Malinaw at natural na ipinapahayag ang causative na diwa ng Hifil ng מות sa konteksto ng pagbitay.
- source_word: וַיִּתְלֵם
  choice: Ibinitin niya sila
  rationale: Ang תלה ay tumutukoy sa pagsuspinde ng tao o bangkay sa kahoy o puno para sa pampublikong pagtatanghal. Hindi tinutukoy ng “ibinitin” kung lubid, tulos, o ibang paraan ang ginamit.
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: sa limang puno
  rationale: Ang עֵץ ay karaniwang “puno” o “kahoy.” Ang “puno” ang pinakadirekta rito at umiiwas sa pagdaragdag ng espesipikong kasangkapang hindi tahasang binanggit.
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: nanatili silang nakabitin
  rationale: Naipapakita ng “nanatili” ang nagpapatuloy na kalagayang ipinahihiwatig ng היה kasama ng passive participle.
- source_word: עַד הָעָרֶב
  choice: hanggang gabi
  rationale: Direkta at likas na salin ng hangganang panahong tinutukoy; hindi nito ginagawang mas tiyak na “paglubog ng araw” ang הָעָרֶב.
theological_decisions:
- issue: Kahulugan ng עֵץ sa konteksto ng pagbitay at pagtatanghal ng mga katawan
  choice: mga puno
  alternative: mga tulos na kahoy / bitayan
  rationale: Pinananatili ng “mga puno” ang payak at malawak na kahulugan ng Hebreo, nang hindi nagpapasok ng isang tiyak na paraan o kasangkapan sa pagbitay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatiling magkahiwalay ang pananakit at tahasang pagpatay, at iniwasang tukuyin nang higit sa Hebreo ang paraan ng pagbibitin.
