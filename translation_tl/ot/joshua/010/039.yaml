  text: וַֽ/יִּלְכְּדָ֞/הּ וְ/אֶת מַלְכָּ֤/הּ וְ/אֶת כָּל עָרֶ֨י/הָ֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל נֶ֣פֶשׁ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/חֶבְר֗וֹן כֵּן עָשָׂ֤ה לִ/דְבִ֨רָ/ה֙ וּ/לְ/מַלְכָּ֔/הּ וְ/כַ/אֲשֶׁ֥ר עָשָׂ֛ה לְ/לִבְנָ֖ה וּ/לְ/מַלְכָּֽ/הּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: tl
  text: Sinakop niya ito, pati ang hari nito at ang lahat ng mga bayan nito. Pinuksa nila ang mga iyon sa talim ng tabak, at itinalaga nila sa ganap na paglipol[a] ang bawat taong naroon. Wala siyang iniwang nakaligtas. Kung ano ang ginawa niya sa Hebron, iyon din ang ginawa niya sa Debir at sa hari nito, gaya ng ginawa niya sa Libna at sa hari nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lubusan nilang nilipol.” Ginagamit ng Hebreo ang terminong ḥerem para sa isang bagay o mga taong itinalaga sa ganap na paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: Sinakop niya ito
  rationale: Ang לָכַד ay tumutukoy sa pagsakop o pagkuha sa isang lugar sa konteksto ng digmaan. Pinanatili ang pang-isahang paksa ng pandiwang Hebreo at ang panghalip na tumutukoy sa Debir.
- source_word: וְאֶת מַלְכָּהּ וְאֶת כָּל עָרֶיהָ
  choice: pati ang hari nito at ang lahat ng mga bayang sakop nito
  rationale: Ang mga hulaping pambabae ay tumutukoy sa lunsod ng Debir. Ang עָרֶיהָ ay natural na nauunawaan bilang mga nakapalibot o nasasakupang bayan nito, hindi lamang bilang magkakapantay na malalaking lunsod.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: Pinuksa nila ang mga iyon sa talim ng tabak
  rationale: Pinananatili ng “sa talim ng tabak” ang larawang Hebreo na פִי חֶרֶב, literal na “bibig/talim ng tabak,” habang malinaw na ipinahahayag ng “pinuksa” ang marahas na kilos sa konteksto.
- source_word: וַיַּחֲרִימוּ
  choice: itinalaga nila sa ganap na paglipol
  rationale: Ang Hiphil ng חרם ay teknikal na pananalita para sa paglalagay sa ilalim ng ḥerem, na dito ay humahantong sa lubos na paglipol. Pinananatili ng “itinalaga” ang higit-sa-karaniwang kahulugan ng termino.
- source_word: אֶת כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: ang bawat taong naroon
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa tao o naninirahan, hindi sa kaluluwang hiwalay sa katawan.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Wala siyang iniwang nakaligtas
  rationale: Ang שָׂרִיד ay isang nakaligtas. Hayagang ipinakita ng “niya” ang pagbabalik ng tekstong Hebreo sa pang-isahang paksa.
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה לִדְבִרָהּ
  choice: Kung ano ang ginawa niya sa Hebron, iyon din ang ginawa niya sa Debir
  rationale: Natural na katumbas ito ng pormulang paghahambing sa Hebreo at pinananatili ang pang-isahang paksa.
- source_word: וְכַאֲשֶׁר עָשָׂה לְלִבְנָה וּלְמַלְכָּהּ
  choice: gaya ng ginawa niya sa Libna at sa hari nito
  rationale: Pinananatili ang huling paghahambing at ang tahasang pagbanggit sa lunsod at hari nito.
theological_decisions:
- issue: Teknikal na pananalita ng חרם sa digmaan
  choice: itinalaga nila sa ganap na paglipol
  alternative: nilipol nila nang lubusan
  rationale: Ipinahihiwatig ng חרם ang paglalagay ng isang bagay o mga tao sa isang natatanging kalagayang humahantong sa ganap na pagkawasak. Hindi ito pinagaan sa simpleng “tinalo,” ngunit hindi rin dinagdagan ng paliwanag na pangdoktrina sa pangunahing teksto.
- issue: Pagpapalit ng pang-isahan at pangmaramihang paksa
  choice: Pinanatili ang “niya,” “nila,” at muling “niya” ayon sa mga pandiwang Hebreo
  alternative: Gawing pawang pangmaramihan o pawang pang-isahan ang mga pandiwa
  rationale: Nagpapalit ang Hebreo sa pang-isahan at pangmaramihan, malamang na sa pagitan ni Josue bilang pinuno at ng sama-samang hukbo. Hindi nilutas o pinakinis ang tensiyong ito nang lampas sa ebidensiya ng teksto.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “tabak” bilang pamilyar na salitang biblikal ngunit malinaw pa rin sa karaniwang mambabasa. Inilagay ang talababa sa mismong pariralang nagsasalin sa חרם, at pinanatili ang sinadyang pagpapalit ng bilang ng paksa sa Hebreo.
