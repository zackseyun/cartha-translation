id: JOS.10.15
reference: Joshua 10:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב יְהוֹשֻׁ֨עַ֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/015.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: tl
  text: Pagkatapos, bumalik si Josue[a], kasama ang buong Israel, sa kampo sa Gilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May kahawig na pahayag tungkol sa pagbabalik sa Gilgal sa Josue 10:43. Itinuturing ito ng ilang tagapagpaliwanag na paunang pahayag o tekstong nalipat ng kinalalagyan, ngunit isinalin dito ang tekstong Hebreo ayon sa anyo nito.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Pagkatapos, bumalik
  rationale: Ang wayyiqtol ng שׁוב ay nagsasaad ng kasunod na pangyayari sa salaysay at ng pagbabalik sa dating lugar. Likas sa modernong Tagalog ang “Pagkatapos, bumalik.”
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Bibliyang Tagalog.
- source_word: וְכָל יִשְׂרָאֵל
  choice: kasama ang buong Israel
  rationale: Pinananatili ang kolektibong “Israel” sa halip na tukuying mga Israelita o hukbo lamang, sapagkat hindi iyon nililinaw ng Hebreo.
- source_word: עִמּוֹ
  choice: kasama
  rationale: Natural na Tagalog para sa “with him”; malinaw sa ayos ng pangungusap na kasama ni Josue ang buong Israel.
- source_word: אֶל הַמַּחֲנֶה
  choice: sa kampo
  rationale: Ang מַחֲנֶה ay kampo, lalo na sa kontekstong militar; ang “sa” ay natural na pananda ng patutunguhan pagkatapos ng “bumalik.”
- source_word: הַגִּלְגָּלָה
  choice: sa Gilgal
  rationale: Ang hulaping patungo sa lugar ay nagpapahiwatig ng galaw tungo sa Gilgal. Ang “sa kampo sa Gilgal” ay likas at eksaktong Tagalog.
theological_decisions:
- issue: Pagkakalagay sa salaysay at posibleng pag-uulit sa Josue 10:43
  choice: Isinalin ang Tekstong Masoretiko ayon sa anyo nito rito, nang hindi inaalis o itinutugma sa talata 43.
  alternative: Ituring ang talata bilang paunang pahayag o tekstong nalipat dahil may kahawig na pahayag sa Josue 10:43.
  rationale: Hindi dapat lutasin ng pangunahing teksto ang usaping pampanitikan o tekstuwal na hindi nilulutas mismo ng Hebreo; pinananatili ng talababa ang mahalagang impormasyon.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang kolektibong “buong Israel” upang hindi labis na tukuyin kung buong bayan o hukbong kasama ni Josue ang tinutukoy.
