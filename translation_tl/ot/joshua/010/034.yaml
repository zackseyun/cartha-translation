base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: tl
  text: Pagkatapos, umalis si Josue mula sa Lakis patungong Eglon, kasama ang buong Israel. Nagkampo sila laban dito at nilabanan nila ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: umalis ... patungong
  rationale: Sa konteksto ng sunod-sunod na pagsulong mula sa isang lungsod tungo sa isa pa, ipinahahayag nito ang pag-alis at pagpapatuloy ng hukbo nang hindi nagpapahiwatig ng pagtawid sa isang tiyak na hangganan o anyong-tubig.
- source_word: עִמּוֹ
  choice: kasama
  rationale: Likas na salin ng pariralang nagsasaad na ang buong Israel ay sumama kay Josue.
- source_word: מִלָּכִישׁ
  choice: mula sa Lakis
  rationale: Malinaw na tinutukoy ng מִן ang pinanggalingan ng hukbo.
- source_word: עֶגְלֹנָה
  choice: patungong Eglon
  rationale: Ang directional he ay nagsasaad ng kilos tungo sa Eglon; natural itong ipahayag sa Filipino bilang “patungong Eglon.”
- source_word: וַיַּחֲנוּ
  choice: nagkampo sila
  rationale: Karaniwan at makabagong pananalita para sa paghimpil ng hukbo.
- source_word: עָלֶיהָ
  choice: laban dito
  rationale: Kasunod ng pandiwang “nagkampo” sa konteksto ng paglusob, ang עַל ay nagsasaad ng mapanlabang pagpuwesto laban sa lungsod, hindi lamang ng pagiging malapit dito.
- source_word: וַיִּלָּחֲמוּ
  choice: nakipaglaban
  rationale: Natural na katumbas sa Filipino ng pandiwang ginagamit para sa pakikidigma o paglahok sa labanan.
- source_word: עָלֶיהָ
  choice: dito
  rationale: Sa “nakipaglaban dito,” ang panghalip ay tumutukoy sa Eglon bilang lungsod na nilalabanan, at iniiwasan ang mabigat na pag-uulit ng “laban dito.”
- source_word: וְכָל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili ang kolektibong katawagan sa Israel na kasama ni Josue sa kampanya.
