revisions:
- from: Sinakop nila iyon nang araw na iyon at pinuksa sa talim ng espada.[a] Ang bawat taong naroon ay itinalaga niya sa pagkalipol nang araw na iyon,[b] gaya ng lahat ng ginawa niya sa Lakis.
  to: Sinakop nila iyon noong araw ring iyon at pinuksa nila iyon sa talim ng espada.[a] Ang bawat taong naroon ay itinalaga niya sa pagkalipol noong araw ring iyon,[b] gaya ng ginawa niya sa Lakis.
