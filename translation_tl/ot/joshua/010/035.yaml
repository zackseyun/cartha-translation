    issue: Hindi likas ang “nang araw na iyon” sa dalawang paglitaw nito.
    rationale: Mas karaniwang modernong Filipino ang “noong araw ring iyon,” na pinananatili ang pag-uulit at diin ng בַּיּוֹם הַהוּא.
  - severity: low
