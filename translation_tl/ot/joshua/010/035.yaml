base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: tl
  text: Sinakop nila iyon noong araw ring iyon at pinuksa nila iyon sa talim ng espada.[a] Ang bawat taong naroon ay itinalaga niya sa pagkalipol noong araw ring iyon,[b] gaya ng ginawa niya sa Lakis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa bibig ng espada,” isang idyomang tumutukoy sa pagpatay o pagpuksa sa pamamagitan ng espada.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lubusan niyang nilipol.” Ang pandiwang Hebreo ay tumutukoy sa pagtatalaga sa pagkalipol sa ilalim ng ḥerem, isang pagbabawal o pagtatalagang sakral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: Sinakop nila iyon
  rationale: Ang לכד sa kontekstong militar ay tumutukoy sa pagsakop o pagbihag sa isang lungsod. Likas sa makabagong Filipino ang “sinakop” at malinaw nitong ipinapahayag ang diwang militar.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Karaniwang panandang pamanahon sa Filipino na nagpapanatili sa diin na nangyari ang pagsakop sa mismong araw na iyon.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: pinuksa sa talim ng espada
  rationale: Ang לְפִי חֶרֶב ay literal na “sa bibig/talim ng espada.” Pinananatili ng “sa talim ng espada” ang larawang Hebreo, samantalang ipinahihiwatig ng “pinuksa” ang malawakang pagpatay sa lungsod.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: ang bawat taong naroon
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa mga taong nasa lungsod, hindi partikular sa di-materyal na kaluluwa. Ang “bawat taong naroon” ay malinaw at hindi nag-aangkat ng di-kinakailangang antropolohikal na pakahulugan.
- source_word: הֶחֱרִים
  choice: itinalaga niya sa pagkalipol
  rationale: Ang Hiphil ng חרם ay teknikal na tumutukoy sa pagtatalaga sa ganap na paglipol sa ilalim ng ḥerem. Pinananatili ng salin ang sagradong-militar na bigat nito, sa halip na gawing simpleng “nilipol.”
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: gaya ng lahat ng ginawa niya sa Lakis
  rationale: Pinananatili nito ang paghahambing sa naunang ginawa sa Lakis at ang pang-isahang anyo ng pandiwang עָשָׂה.
theological_decisions:
- issue: Pagbibigay-kahulugan sa חרם/החרים sa konteksto ng pananakop
  choice: itinalaga niya sa pagkalipol
  alternative: lubusan niyang nilipol; inilagay niya sa ilalim ng pagbabawal
  rationale: May natatanging sagradong-militar na diwa ang pandiwa, higit sa karaniwang pagwasak o pagpatay. Pinananatili ng “itinalaga sa pagkalipol” ang bigat at tensiyong ito nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Pagbibigay-kahulugan sa נֶפֶשׁ bilang populasyon ng lungsod
  choice: tao
  alternative: kaluluwa; buhay na nilalang
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa mga taong nasa lungsod. Ang “kaluluwa” ay maaaring magpahiwatig ng teolohikal na antropolohiyang hindi siyang punto ng talata.
- issue: Pagpapanatili sa paglipat mula pangmaramihan tungo sa pang-isahang tagaganap
  choice: “nila” sa pagsakop at pagpatay, ngunit “niya” sa pagtatalaga sa pagkalipol at sa paghahambing kay Lakis
  alternative: gawing pangmaramihan ang lahat ng pandiwa
  rationale: Pangmaramihan ang וַיִּלְכְּדוּהָ at וַיַּכּוּהָ, ngunit pang-isahan ang הֶחֱרִים at עָשָׂה. Pinananatili ng salin ang tunay na gramatikal na pagbabago at hindi ito tahimik na pinapantay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “espada” at “Lakis,” na karaniwan at madaling maunawaan. Sadyang pinanatili ang paglipat mula sa pangmaramihang “nila” tungo sa pang-isahang “niya” ayon sa morpolohiyang Hebreo.
