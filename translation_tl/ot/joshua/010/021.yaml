  text: וַ/יָּשֻׁבוּ֩ כָל הָ/עָ֨ם אֶל הַ/מַּחֲנֶ֧ה אֶל יְהוֹשֻׁ֛עַ מַקֵּדָ֖ה בְּ/שָׁל֑וֹם לֹֽא חָרַ֞ץ לִ/בְנֵ֧י יִשְׂרָאֵ֛ל לְ/אִ֖ישׁ אֶת לְשֹׁנֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: tl
  text: At ang buong bayan ay ligtas na bumalik sa kampo, kay Josue na nasa Makeda. Walang sinumang nagsalita[a] laban sa kahit sinuman sa mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Walang naghasa ng kaniyang dila laban sa mga anak ni Israel”; isang idyoma ito na nangangahulugang walang nagsalita laban sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: bumalik
  rationale: Nagsasaad ang wayyiqtol ng שׁוּב ng pisikal na pagbabalik mula sa pagtugis; natural at tuwiran ang “bumalik.”
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Bagaman hukbo ang nasa agarang konteksto, ang עָם ay “bayan/mga tao,” hindi teknikal na salita para sa hukbo. Pinananatili ng “buong bayan” ang kolektibong diwa.
- source_word: הַמַּחֲנֶה
  choice: sa kampo
  rationale: Karaniwan at natural na katumbas sa kontekstong militar.
- source_word: אֶל יְהוֹשֻׁעַ מַקֵּדָה
  choice: kay Josue sa Makeda
  rationale: Siksik ang sintaks ng Hebreo; ipinahihiwatig nito ang pagbabalik kay Josue na nasa Makeda.
- source_word: בְּשָׁלוֹם
  choice: ligtas na
  rationale: Sa kontekstong ito, ang שָׁלוֹם ay tumutukoy sa ligtas at walang pinsalang pagbabalik. Mas natural sa modernong Tagalog ang “ligtas na” kaysa literal na “sa kapayapaan.”
- source_word: לֹא חָרַץ ... אֶת־לְשֹׁנוֹ
  choice: Walang sinumang nangahas magsalita laban
  rationale: Idyoma ito para sa hindi pagbigkas ng anumang salitang salungat o mapanlaban. Inihahatid ng salin ang pragmatikong diwa, habang inilalagay sa talababa ang literal na larawan.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa alinman sa mga anak ni Israel
  rationale: Pinananatili ang tahasang anyong “mga anak ni Israel,” isang pambansa at tipanang katawagan, sa halip na patagin bilang “mga Israelita.”
theological_decisions:
- issue: Ang pambansa at tipanang katawagang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng “mga anak ni Israel” ang anyo at biblikal na alingawngaw ng Hebreo nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Ang idyomang לֹא חָרַץ ... אֶת־לְשֹׁנוֹ
  choice: Walang sinumang nangahas magsalita laban
  alternative: Walang sinumang naghasa/naggalaw ng kaniyang dila laban
  rationale: Ang pangunahing teksto ay ginawang malinaw at natural sa Tagalog, ngunit pinanatili sa talababa ang matalinghagang larawan at ang posibilidad ng mas pangkalahatang diwang walang nagsalita laban sa kanila.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang tradisyonal ngunit karaniwan pa ring mga pangalang “Josue” at “Makeda.” Inilipat ang בְּשָׁלוֹם bilang “ligtas na” upang maging natural ang daloy at malinaw ang kontekstuwal na kahulugan.
