  source_fidelity: Ang “ligtas na bumalik” ay wastong kontekstuwal na pagsasalin ng בְּשָׁלוֹם. Gayunman, ang “nangahas magsalita” ay nagdaragdag ng diwang ‘nagkaroon ng lakas ng loob/dared’ na wala sa Hebreong idyoma. Ang idyoma ay nagsasaad na walang nagsalita laban sa mga anak ni Israel.
  naturalness: Natural at angkop ang pangkalahatang rehistro. Mas malinaw ang “kay Josue na nasa Makeda” para maipakita ang siksik na Hebreong pagkakaugnay ng Josue at Makeda. Ang “kahit sinuman sa mga anak ni Israel” ay mas likas kaysa “alinman sa mga anak ni Israel” sa negatibong pangungusap.
  terminology: Ang “Josue,” “Makeda,” “kampo,” at “mga anak ni Israel” ay angkop at pinananatili ang anyo at rehistro ng pinagmulan. Ang talababa ay dapat tumukoy sa literal na idyoma nang hindi binabago ang saklaw nito sa “sinuman sa mga anak.”
