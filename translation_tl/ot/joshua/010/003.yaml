base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: tl
  text: 'Kaya nagpadala si Adoni-Zedek, hari ng Jerusalem, ng mensahe kay Hoham, hari ng Hebron, kay Piram, hari ng Yarmut, kay Yafia, hari ng Lakis, at kay Debir, hari ng Eglon, na nagsasabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kaya nagpadala ng mensahe
  rationale: Ang wayyiqtol ng שׁלח ay nagpapatuloy sa salaysay at nakakaugnay sa naunang talata. Likas sa modernong Tagalog ang “Kaya,” at nililinaw ng “ng mensahe” na ang ipinadala ay pahayag sa mga pinunong binanggit.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Zedek
  rationale: Pangngalang pantangi ito kaya tinumbasan sa pamamagitan ng transliterasyon; pinananatili ng gitling ang tambalang anyo ng pangalan.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: hari ng Jerusalem
  rationale: Tuwirang salin ng pariralang construct, gamit ang nakaugaliang anyo ng pangalan ng lungsod sa Filipino.
- source_word: אֶל
  choice: kina
  rationale: Tinutukoy ng pang-ukol ang maraming taong pinagpadalhan. Ang “kina” ay natural at maikli sa Tagalog bago ang sunod-sunod na mga pangalan.
- source_word: הוֹהָם
  choice: Hoham
  rationale: Transliterasyon ng pangngalang pantangi.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Nakaugaliang transliterasyon ng pangalan ng lugar.
- source_word: פִּרְאָם
  choice: Piram
  rationale: Transliterasyon ng pangngalang pantangi.
- source_word: יַרְמוּת
  choice: Jarmut
  rationale: Transliterasyong angkop sa palabaybayang Filipino, kung saan hindi kailangan ang hulíng h upang katawanin ang tunog /t/.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: Transliterasyong madaling basahin sa Filipino; ginagamit ang j para sa paunang tunog na karaniwang kinakatawan ng yod sa pangalang ito ayon sa nakaugaliang anyo.
- source_word: לָכִישׁ
  choice: Lakis
  rationale: Transliterasyong inangkop sa palabaybayang Filipino, gamit ang s para sa tunog ng שׁ sa pangalang ito.
- source_word: דְּבִיר
  choice: Debir
  rationale: Pangalan ito ng hari sa konteksto, kaya transliterasyon ang ginamit sa halip na anumang karaniwang kahulugan ng salita sa ibang konteksto.
- source_word: עֶגְלוֹן
  choice: Eglon
  rationale: Transliterasyon ng pangalan ng lugar.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ang Hebreong pormula ay nagpapakilala sa tuwirang sasabihin sa kasunod na talata. Ang “Sinabi niya,” ay natural na tulay sa Filipino at pinananatili ang di-kumpletong pangungusap ng talata.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniiwasan ang lumang “Jerusalem ay nagsugo kay...” na ayos at ang mas pormal na “na nagsasabi.” Pinananatili ang mga pangalan bilang transliterasyon, na may ilang pag-aangkop sa palabaybayang Filipino.
