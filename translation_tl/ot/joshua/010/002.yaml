base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: tl
  text: At labis silang natakot, sapagkat ang Gibeon ay isang dakilang lungsod, tulad ng isa sa mga maharlikang lungsod, at sapagkat ito ay mas dakila kaysa sa Ai at magigiting ang lahat ng kalalakihan nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga magigiting na mandirigma ang lahat ng kalalakihan nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: labis silang natakot
  rationale: Natural na salaysay sa modernong Filipino na pinananatili ang pandiwang ירא at ang matinding diin ng מְאֹד.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinahahayag ang sanhi ng kanilang matinding takot sa dignified ngunit madaling maunawaang Filipino.
- source_word: עִיר גְּדוֹלָה
  choice: isang dakilang lungsod
  rationale: Ang “dakila” ay nagpapanatili sa posibleng saklaw ng גָּדוֹל bilang laki at kahalagahan, sa halip na limitahan ito sa pisikal na sukat.
- source_word: גִּבְעוֹן
  choice: Gibeon
  rationale: Karaniwang anyo ng pangalan ng lugar sa Filipino biblical usage.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: tulad ng isa sa mga maharlikang lungsod
  rationale: Ipinahahayag nang natural ang paghahambing sa mga lungsod na may ranggo o kaugnayan sa paghahari.
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: Mas dakila ito kaysa sa Ai
  rationale: Pinananatili ang parehong malawak na diwa ng גָּדוֹל—laki o kahalagahan—at malinaw na tumutukoy ang “ito” sa lungsod.
- source_word: וְכָל אֲנָשֶׁיהָ
  choice: ang lahat ng kalalakihan nito
  rationale: Ang אֲנָשִׁים sa kontekstong militar ay tumutukoy sa mga lalaking kabilang sa lungsod, hindi sa buong populasyon nang walang pagtatangi.
- source_word: גִּבֹּרִים
  choice: magigiting
  rationale: Natural na salitang Filipino para sa mga lalaking may tapang at lakas sa kontekstong pandigma; ang mas tahasang “mandirigma” ay inilagay bilang alternatibo sa talababa.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na dignified at malinaw. Ginamit ang “dakila” upang hindi isara ang ambigüidad ng גָּדוֹל sa “malaki” lamang. Hinati sa dalawang pangungusap para sa natural na daloy, habang pinananatili ang ugnayang sanhi at ang lahat ng nilalaman ng Hebreo.
