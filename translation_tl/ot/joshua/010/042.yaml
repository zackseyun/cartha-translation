  text: וְ/אֵ֨ת כָּל הַ/מְּלָכִ֤ים הָ/אֵ֨לֶּה֙ וְ/אֶת אַרְצָ֔/ם לָכַ֥ד יְהוֹשֻׁ֖עַ פַּ֣עַם אֶחָ֑ת כִּ֗י יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל נִלְחָ֖ם לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: tl
  text: Binihag ni Josue ang lahat ng haring ito at sinakop ang kanilang lupain sa iisang pagkakataon[a], sapagkat si Yahweh, ang Diyos ng Israel, ang nakipaglaban para sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa iisang kampanya.” Literal sa Hebreo, “sa isang pagkakataon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: nasakop
  rationale: Karaniwang tumutukoy ang pandiwa sa pagdakip o pagsakop. Ang “nasakop” ay angkop sa iisang pandiwang sumasaklaw kapwa sa mga hari at sa kanilang lupain, at pinananatili ang diwang militar nang hindi labis na nagpapakahulugan.
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: ang lahat ng haring ito
  rationale: Tuwiran at likas na salin ng pariralang may demonstratibo; sapat na ipinahihiwatig ng “ito” ang Hebreong הָאֵלֶּה.
- source_word: וְאֶת אַרְצָם
  choice: at ang kanilang lupain
  rationale: Ang אֶרֶץ ay maaaring mangahulugang lupain, bansa, o nasasakupan. Pinakamalawak at pinakanatural dito ang “lupain.”
- source_word: פַּעַם אֶחָת
  choice: sa isang pagkakataon
  rationale: Malapit ito sa literal na “isang pagkakataon.” Maaaring tumukoy ang konteksto sa iisang kampanya, ngunit iniingatan sa pangunahing teksto ang lawak ng Hebreong pahayag at inilalagay sa talababa ang mas kontekstuwal na pagbasa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng tagumpay ni Josue. Ang “sapagkat” ay malinaw, dignipikado, at natural sa ganitong salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at natural na salin ng Hebreong pariralang construct.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: ang nakipaglaban para sa Israel
  rationale: Ipinahahayag ng Niphal ng לחם na may ל ang pakikipaglaban alang-alang sa isang panig. Ang hulmaing “si Yahweh … ang nakipaglaban” ay likas sa Filipino at naipakikita ang diin na nasa Diyos bilang dahilan ng tagumpay.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue,” ang karaniwang anyo ng pangalang Joshua sa Filipino, at pinanatili ang bahagyang kalabuan ng פַּעַם אֶחָת sa pangunahing teksto habang nililinaw sa talababa ang posibleng kahulugang militar.
