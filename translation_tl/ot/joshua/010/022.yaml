translation:
  language: tl
  text: Pagkatapos, sinabi ni Josue, “Buksan ninyo ang bunganga ng yungib, at ilabas ninyo sa akin ang limang haring iyon mula sa yungib.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa modernong Tagalog ang “Pagkatapos” habang pinananatili ang daloy.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Karaniwang anyo ng pangalang Joshua sa tradisyong Tagalog sa Bibliya.
- source_word: פִּתְחוּ
  choice: Buksan ninyo
  rationale: Pangmaramihang pautos ang pandiwa; malinaw na ipinahahayag ng “ninyo” na higit sa isang tao ang inuutusan.
- source_word: פִּי הַמְּעָרָה
  choice: ang bunganga ng yungib
  rationale: Pinananatili ang kongkretong idyomang Hebreo na “bunganga ng yungib,” na natural at madaling maunawaan sa Tagalog.
- source_word: וְהוֹצִיאוּ
  choice: at ilabas ninyo
  rationale: Ang Hiphil na pautos ay nagpapahiwatig ng pagpapalabas; direkta at natural ang “ilabas ninyo.”
- source_word: אֵלַי
  choice: sa akin
  rationale: Tuwirang ipinahahayag ang kilos patungo kay Josue; sapat nang ipinakikita ng “ilabas” ang kilos mula sa loob.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ang limang haring iyon
  rationale: Tinutukoy ang limang tiyak at dati nang nakilalang hari; natural sa salaysay ang “iyon,” bagaman maaari ring isalin na “ito.”
- source_word: מִן הַמְּעָרָה
  choice: mula sa yungib
  rationale: Tapat na inilalahad ang pinagmulan ng paglabas; ang kahulugang palabas ay malinaw na sa pandiwang “ilabas.”
