revisions:
- from: Sinakop nila ang lunsod at pinuksa sa pamamagitan ng tabak[a] ang hari nito, ang lahat ng mga lunsod nito, at ang bawat taong naroon. Wala siyang iniwang nakaligtas, gaya ng ginawa niya sa Eglon. Itinalaga niya ang lunsod sa pagkapuksa, kasama ang bawat taong naroon.
  to: Sinakop nila ang lunsod at pinuksa ito sa pamamagitan ng talim ng tabak[a], kasama ang hari nito, ang lahat ng mga lunsod nito, at ang bawat taong naroon. Wala siyang iniwang nakaligtas, gaya ng ginawa niya sa Eglon. Itinalaga niya ang lunsod sa pagkapuksa, kasama ang bawat taong naroon.
  rationale: Inayos ang saklaw ng unang pandiwa upang maisama nang malinaw ang lunsod, na siyang tinutukoy ng panghalip sa Hebreo. Pinalitan din ang pangkalahatang 'tabak' ng 'talim ng tabak' upang mapanatili ang idiomatikong larawan ng pinagmulan. Walang binago sa kahulugan ng paglalagom, sa pang-isahang paksa ng mga sumunod na sugnay, o sa maingat na pagsasalin ng חרם.
