  text: וַ/יִּלְכְּד֣וּ/הָ וַ/יַּכּֽוּ/הָ לְ/פִי חֶ֠רֶב וְ/אֶת מַלְכָּ֨/הּ וְ/אֶת כָּל עָרֶ֜י/הָ וְ/אֶת כָּל הַ/נֶּ֤פֶשׁ אֲשֶׁר בָּ/הּ֙ לֹֽא הִשְׁאִ֣יר שָׂרִ֔יד כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/עֶגְל֑וֹן וַ/יַּחֲרֵ֣ם אוֹתָ֔/הּ וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּֽ/הּ־־־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: tl
  text: Sinakop nila ang lunsod at pinuksa ito sa pamamagitan ng talim ng tabak[a], kasama ang hari nito, ang lahat ng mga lunsod nito, at ang bawat taong naroon. Wala siyang iniwang nakaligtas, gaya ng ginawa niya sa Eglon. Itinalaga niya ang lunsod sa pagkapuksa, kasama ang bawat taong naroon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa bibig ng tabak,” isang idyoma para sa pagkilos sa pamamagitan ng talim ng tabak.
    reason: Ipinaliliwanag ang larawang Hebreo sa לְפִי חֶרֶב habang pinananatiling natural ang pangunahing teksto.
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: Sinakop nila ang lunsod
  rationale: Ang לכד ay tumutukoy sa pagkuha o pagsakop sa isang lunsod. Inulit ang tahasang 'lunsod' sa halip na 'ito' upang maging natural at malinaw sa Tagalog.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: pinuksa sa pamamagitan ng tabak
  rationale: Ang נכה kasama ng idyomang לְפִי חֶרֶב ay nagsasaad ng nakamamatay na pagsalakay sa pamamagitan ng tabak. Ang 'pinuksa' ay natural sa kontekstong ito, habang ang talab ng idyoma ay ipinaliliwanag sa talababa.
- source_word: מַלְכָּהּ
  choice: ang hari nito
  rationale: Tuwirang ipinapahayag ang hari ng nasakop na lunsod.
- source_word: כָּל עָרֶיהָ
  choice: ang lahat ng mga lunsod nito
  rationale: Ang עִיר ay maaaring lunsod o bayan; pinanatili rito ang mas malapit na 'mga lunsod' para sa mga pamayanang sakop nito.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: ang bawat taong naroon
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa tao o buhay na tao, hindi partikular sa di-materyal na kaluluwa.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Wala siyang iniwang nakaligtas
  rationale: Natural at eksaktong pagpapahayag ng kawalan ng sinumang survivor; pinananatili rin ang biglang paglipat sa pang-isahang paksa, na malamang ay si Josue.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְעֶגְלוֹן
  choice: gaya ng ginawa niya sa Eglon
  rationale: Malinaw na paghahambing sa naunang ginawa kay Eglon.
- source_word: וַיַּחֲרֵם אוֹתָהּ
  choice: Itinalaga niya ang lunsod sa pagkapuksa
  rationale: 'Pinananatili ng ''itinalaga ... sa pagkapuksa'' ang teknikal na diwa ng חרם: inilaan sa ganap na pagkawasak, sa halip na gawing simpleng kasingkahulugan lamang ng ''winasak.'''
theological_decisions:
- issue: Pagpapahayag ng חרם sa konteksto ng digmaan
  choice: Itinalaga niya ang lunsod sa pagkapuksa
  alternative: Lubos niya itong pinuksa; inilagay niya ito sa ilalim ng pagbabawal
  rationale: Pinananatili ng salin ang magkaugnay na diwa ng pagtatalaga at pagwasak nang hindi nagdaragdag ng paliwanag na denominasyonal o nilulutas ang teolohikal na tensiyon ng termino.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'lunsod,' 'pinuksa,' at 'nakaligtas' bilang malinaw na bokabularyo sa salaysay ng digmaan. Pinanatili ang pangmaramihang paksa sa simula at ang pang-isahan sa sumunod na mga sugnay, gaya ng Hebreo.
