  register: Makabago, malinaw, at marangal na Filipino. Inalis ang literal na katumbas ng לֵאמֹר dahil sapat ang direktang panipi sa natural na salaysay sa Filipino. Inilagay ang talababa pagkatapos ng “Josue” gaya ng hinihinging marker, bagaman ang nilalaman nito ay nagpapaliwanag sa “nagtatago.”
