  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: tl
  text: At iniulat kay Josue, “Natagpuan ang limang hari na nagtatago[a] sa yungib sa Makeda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Natagpuan ang limang hari na nakatago sa yungib sa Makeda.” Ang participle sa Hebreo ay maaaring tumukoy sa kilos na “nagtatago” o sa kalagayang “nakatago.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: At iniulat
  rationale: Pinananatili ang pasibong diwa ng pandiwa at ang pagkakaugnay nito sa salaysay; natural sa makabagong Filipino.
- source_word: לִיהוֹשֻׁעַ
  choice: kay Josue
  rationale: Karaniwang anyo ng pangalang Joshua sa Bibliyang Tagalog at natural na layon ng pandiwang pasibo.
- source_word: לֵאמֹר
  choice: direktang panipi
  rationale: Ang Hebreong panandang pambanggit ay likas na naipahahayag sa Filipino sa pamamagitan ng tuwirang panipi; ang literal na “na sinasabi” ay hindi kailangan at magiging asiwa.
- source_word: נִמְצְאוּ
  choice: Natagpuan
  rationale: Tumpak na pasibong salin ng plural na pandiwa; hindi kailangang markahan ang bilang sa pandiwang Filipino.
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: ang limang hari
  rationale: Tuwirang ipinapahayag ang tiyak at dati nang nabanggit na pangkat.
- source_word: נֶחְבְּאִים
  choice: na nagtatago
  rationale: Ipinapahayag ang participle bilang nagpapatuloy na kilos o kalagayan; nananatiling posible ang alternatibong estadong “nakapagtago.”
- source_word: בַּמְּעָרָה
  choice: sa yungib
  rationale: Natural at marangal na katawagan sa isang cave sa kontekstong biblikal.
- source_word: בְּמַקֵּדָה
  choice: sa Makeda
  rationale: Ang pang-ukol na “sa” ay natural para sa lokasyon, at ang pangalan ay isina-Filipinong transliterasyon.
