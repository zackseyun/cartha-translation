base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: tl
  text: Nilupig ni Josue ang mga ito mula sa Kades-barnea hanggang sa Gaza,[a] pati ang buong lupain ng Gosen hanggang sa Gibeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tinalo” o “sinaktan.” Ang pandiwang Hebreo ay maaaring tumukoy sa isang dagok o pagkatalo sa digmaan nang hindi laging tinutukoy ang eksaktong paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: Nilupig ... ang mga ito
  rationale: Ang pandiwang נכה ay tumutukoy rito sa pananakit o pagtalo sa kontekstong militar. Natural sa makabagong Tagalog ang “nilupig” at hindi nito tahasang ipinapalagay na pinatay ang bawat isa.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: mula sa Kades-barnea
  rationale: Pinananatili ang pangalang pook at ang מִן bilang panimulang hangganan ng saklaw.
- source_word: וְעַד עַזָּה
  choice: hanggang sa Gaza
  rationale: Ang עַד ay nagpapahayag ng lawak o hangganan, kaya ang “hanggang sa” ang natural at tumpak na katumbas.
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: pati ang buong lupain ng Gosen
  rationale: Ipinakikilala ng אֵת ang isa pang sakop ng pagkilos. Nililinaw ng “pati” ang pagdaragdag nang hindi binabago ang heograpikong diwa.
- source_word: וְעַד גִּבְעוֹן
  choice: hanggang sa Gibeon
  rationale: Muling ipinahahayag ng עַד ang hangganan ng nasakop na lugar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nilupig” bilang likas na salitang militar, habang pinanatili sa talababa ang lawak ng kahulugan ng pandiwang Hebreo. Ang mga pangalan ng pook ay nasa karaniwang anyong Filipino.
