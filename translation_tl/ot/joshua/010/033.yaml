base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: tl
  text: Nang panahong iyon, umakyat si Horam, na hari ng Gezer, upang tulungan ang Lakish. At tinalo ni Josue si Horam at ang mga tao niya hanggang sa wala siyang iniwang kahit isang nakaligtas para kay Horam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang natirang sinuman.” Ang salitang Hebreo ay maaaring tumukoy sa isang nakaligtas o sa isang taong natira.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Nang panahong iyon
  rationale: Likas na panandang pasalaysay sa Filipino na nagpapahayag ng kasunod na pangyayari nang hindi labis na tinutukoy ang eksaktong oras.
- source_word: עָלָה
  choice: umahon
  rationale: Pinananatili ang saligang diwa ng pag-akyat o pagpunta pataas, na maaari ring tumukoy sa pagsulong sa kontekstong militar.
- source_word: הֹרָם מֶלֶךְ גֶּזֶר
  choice: si Horam na hari ng Gezer
  rationale: Itinumbas nang tuwiran ang pangalan, katungkulan, at lungsod; ginamit ang karaniwang transliterasyon ng mga pangalang pantangi.
- source_word: לַעְזֹר אֶת לָכִישׁ
  choice: upang tulungan ang Lakish
  rationale: Malinaw at natural na pagpapahayag ng layuning magbigay ng tulong sa Lakish.
- source_word: וַיַּכֵּהוּ
  choice: tinalo ni Josue si Horam
  rationale: Sa kontekstong militar, maaaring mangahulugan ang נכה ng paghampas o paggapi. Ang “tinalo” ay natural sa Filipino at hindi inuulit ang ganap na resulta na nililinaw ng kasunod na sugnay.
- source_word: וְאֶת עַמּוֹ
  choice: at ang kanyang bayan
  rationale: Pinananatili ang malawak na kahulugan ng עַם bilang bayan o mga tao sa halip na paliitin ito sa hukbo lamang.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: hanggang sa wala siyang iniwang sinumang nakaligtas
  rationale: Inihahatid ang lawak at kinalabasan ng pagkatalo; ang “nakaligtas” ang pinakanatural na katumbas ng שָׂרִיד sa konteksto.
