translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “umahon” upang mapanatili ang larawang heograpiko ng Hebreo, at “bayan” upang huwag ipakahulugan ang עַם bilang hukbo lamang. Inilipat ang talababa sa “nakaligtas,” ang salitang tunay na tinutukoy ng leksikal na alternatibo.
