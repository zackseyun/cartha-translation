reference: Joshua 10:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Josue, “Huwag kang matakot sa kanila, sapagkat ibinigay ko na sila sa iyong kamay. Walang sinuman sa kanila ang makatatayo sa harap mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyong “Yahweh” upang panatilihin ang personal na pangalang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang panimulang pandiwa ito sa tuwirang pananalita sa salaysay; natural at malinaw sa modernong Tagalog ang “Sinabi.”
- source_word: אַל תִּירָא מֵהֶם
  choice: Huwag kang matakot sa kanila
  rationale: Tuwirang ipinahahayag ang pagbabawal at ang pinatutungkulan ng takot sa natural na Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos na huwag matakot; ang “sapagkat” ay marangal ngunit madaling maunawaan.
- source_word: בְיָדְךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang larawang Hebreo ng pagbibigay sa kamay, na sa konteksto ay nangangahulugang pagpapasailalim sa kapangyarihan ni Josue.
- source_word: נְתַתִּים
  choice: ibinigay ko na sila
  rationale: Ang ganap na anyo sa pahayag ng Diyos ay naglalarawan ng pasyang tiyak na para bang naisakatuparan na; naipahahayag ito ng “ibinigay ko na.”
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: Walang sinuman sa kanila ang makatatayo
  rationale: 'Ang אִישׁ ay isahang kinatawang gamit. Ang “walang sinuman” ay natural sa Tagalog at hindi binabago ang saklaw: wala ni isa sa pangkat ng mga lalaking mandirigma.'
- source_word: בְּפָנֶיךָ
  choice: sa harap mo
  rationale: Pinananatili ang Hebreong idyoma; sa kontekstong militar, ipinahihiwatig nitong walang makalalaban o makatatagal laban kay Josue.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Paglalarawan sa אִישׁ sa pangungusap na לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: Walang sinuman sa kanila
  alternative: Walang lalaki sa kanila; wala ni isa sa kanila
  rationale: Bagaman mga lalaking mandirigma ang tinutukoy ng konteksto, ang isahang אִישׁ ay gumaganap sa negatibong pahayag na may diwang “wala ni isa.” Natural na naihahatid ito ng “walang sinuman” nang hindi ipinapalagay na tumutukoy ito sa sangkatauhan sa pangkalahatan.
- issue: Lakas ng ganap na נְתַתִּים sa pahayag ng Diyos
  choice: ibinigay ko na sila
  alternative: ibinibigay ko sila; ipagkakaloob ko sila
  rationale: Pinananatili ng “ibinigay ko na” ang ganap na anyo at ang katiyakan ng pasya ng Diyos, nang hindi tahasang nilulutas kung ito ay retorikal na prolepsis o isang kilos na itinuturing nang ganap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pangalang “Yahweh” at ang mga larawang “sa iyong kamay” at “sa harap mo,” habang ginawang natural ang balangkas ng pangungusap.
