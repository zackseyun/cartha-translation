source:
  edition: WLC
  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: tl
  text: Nang dalhin nila ang mga haring ito kay Josue, tinawag ni Josue ang lahat ng kalalakihan ng Israel[a] at sinabi sa mga pinuno ng mga mandirigmang sumama sa kanya[b], “Lumapit kayo at ilagay ninyo ang inyong mga paa sa leeg ng mga haring ito.” Kaya lumapit sila at inilagay ang kanilang mga paa sa leeg ng mga hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bawat lalaki ng Israel”; sa kontekstong militar, tumutukoy ito sa mga lalaking Israelitang naroon kasama ng hukbo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga kumander ng mga mandirigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: Nang mailabas nila
  rationale: Ang pormulang pasalaysay na וַיְהִי na sinusundan ng כְּ at infinitive construct ay likas na naipapahayag sa Tagalog bilang sugnay na pamanahon. Pinananatili ng “Nang mailabas nila” ang pagkakasunod-sunod ng pangyayari nang hindi gumagamit ng mekanikal na “At nangyari.”
- source_word: אֶת הַמְּלָכִים הָאֵלֶּה אֶל יְהוֹשֻׁעַ
  choice: ang mga haring ito at maiharap kay Josue
  rationale: Ipinahihiwatig ng אֶל ang paglalabas sa mga hari patungo o sa harap ni Josue. Ginagawang malinaw ng “maiharap kay Josue” ang direksiyon sa natural na Tagalog nang hindi dinaragdagan ang diwa.
- source_word: וַיִּקְרָא ... אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: tinawag ni Josue ang lahat ng kalalakihan ng Israel
  rationale: Ang כָּל אִישׁ יִשְׂרָאֵל ay literal na tumutukoy sa “bawat lalaki ng Israel.” Sa kontekstong militar, ang “lahat ng kalalakihan ng Israel” ay nagpapanatili sa panlalaking sanggunian at natural sa Tagalog.
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: mga pinuno ng mga mandirigma
  rationale: Ang קְצִינֵי ay mga pinuno o kumander, at ang אַנְשֵׁי הַמִּלְחָמָה ay mga lalaking pandigma. Ang “mga pinuno ng mga mandirigma” ay malinaw, maikli, at nagpapanatili sa estrukturang militar.
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: sumama sa kanya
  rationale: Inilalarawan nito ang mga pinunong kasama ni Josue sa kampanya. Ang “sumama sa kanya” ang natural na katumbas sa modernong Tagalog.
- source_word: קִרְבוּ
  choice: Lumapit kayo
  rationale: Tuwirang maramihang utos ito na lumapit nang pisikal. Ang “Lumapit kayo” ay likas at malinaw.
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: ilagay ninyo ang inyong mga paa sa mga leeg ng
  rationale: Pinananatili nito ang kongkreto at mariing larawan ng ritwal ng pagsupil; hindi pinalalambot o ginagawang abstrakto ang kilos.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: Kaya lumapit sila at inilagay
  rationale: Ipinagpapatuloy ng magkasunod na pandiwa ang salaysay at ipinakikita ang agarang pagsunod. Ang “Kaya” ay maayos na nag-uugnay sa utos at pagtupad.
- source_word: עַל צַוְּארֵיהֶם
  choice: sa mga leeg ng mga ito
  rationale: Ang hulaping panghalip ay tumutukoy sa mga hari. Iniiwasan ng “mga ito” ang posibleng kalituhan sa Tagalog kung “kanilang mga leeg” ang gagamitin.
theological_decisions:
- issue: Panlalaking wika sa כָּל אִישׁ יִשְׂרָאֵל at kontekstong militar
  choice: lahat ng kalalakihan ng Israel
  alternative: lahat ng Israel / lahat ng mga Israelita
  rationale: Tahasang panlalaki ang anyong Hebreo at militar ang tagpo. Pinananatili ng salin ang sangguniang ito sa halip na gawing neutral, ngunit hindi nito ipinapalagay na literal na naroon ang bawat lalaki sa buong bansa.
- issue: Kongkretong kilos ng pagsupil sa mga natalong hari
  choice: ilagay ninyo ang inyong mga paa sa mga leeg ng mga haring ito
  alternative: pasukuin ninyo nang lubusan ang mga haring ito
  rationale: Literal at simboliko ang kilos sa teksto. Pinananatili ang matinding larawan at hindi ito pinapalitan ng paliwanag o pinalalambot na paraphrase.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Josue,” ang nakaugaliang anyong Tagalog ng pangalan. Pinanatili ang tuwiran at mabigat na larawang militar ng Hebreo, habang inayos ang sintaks para maging likas sa Tagalog. Ang mga panandang talababa ay inilagay sa mga pariralang aktuwal na ipinapaliwanag ng mga ito.
