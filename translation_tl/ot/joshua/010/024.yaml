  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang paglalabas ng mga hari kay Josue, ang pagtawag niya sa lahat ng kalalakihan ng Israel, ang utos sa mga pinunong militar, at ang aktuwal na paglalagay ng mga paa sa mga leeg ng mga hari. Gayunman, ang “maiharap kay Josue” ay bahagyang mas interpretatibo kaysa sa payak na direksiyonal na “dalhin ... kay Josue,” at ang “mga ito” sa hulihan ay medyo malabo kahit malinaw ang malamang na tinutukoy.'
  naturalness: Natural at marangal ang pangkalahatang Tagalog. Mas tuwiran at mas likas sa modernong Tagalog ang “Nang dalhin nila ang mga haring ito kay Josue” kaysa sa tambalang “Nang mailabas nila ... at maiharap kay Josue.” Sa huling pangungusap, “sa leeg ng mga hari” ay mas malinaw at hindi kasing demonstrative-heavy ng “sa mga leeg ng mga ito.”
  terminology: Ang “Josue,” “kalalakihan ng Israel,” “mga pinuno,” at “mga mandirigma” ay angkop. Gayunman, ang talababa b na “mga lalaking pandigma” ay masyadong literal at hindi gaanong natural; “mga mandirigma” ang malinaw na alternatibong Tagalog para sa pariralang militar. Ang maramihang “leeg” ay katanggap-tanggap dahil plural ang mga hari, ngunit mas idiomatiko ang “sa leeg ng mga haring ito / mga hari” kapag isang paa sa leeg ng bawat hari ang inilalarawan.
  issues:
