revisions:
- from: Nang mailabas nila ang mga haring ito at maiharap kay Josue, tinawag ni Josue ang lahat ng kalalakihan ng Israel[a] at sinabi sa mga pinuno ng mga mandirigmang sumama sa kanya[b], “Lumapit kayo at ilagay ninyo ang inyong mga paa sa mga leeg ng mga haring ito.” Kaya lumapit sila at inilagay ang kanilang mga paa sa mga leeg ng mga ito.
  to: Nang dalhin nila ang mga haring ito kay Josue, tinawag ni Josue ang lahat ng kalalakihan ng Israel[a] at sinabi sa mga pinuno ng mga mandirigmang sumama sa kanya[b], “Lumapit kayo at ilagay ninyo ang inyong mga paa sa leeg ng mga haring ito.” Kaya lumapit sila at inilagay ang kanilang mga paa sa leeg ng mga hari.
