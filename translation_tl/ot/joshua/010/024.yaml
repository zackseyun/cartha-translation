    issue: Ang “maiharap kay Josue” ay nagdaragdag ng bahagyang interpretasyong ceremonial.
    rationale: Ang Hebreong אֶל יְהוֹשֻׁעַ ay payak na nagsasaad na dinala o inilabas ang mga hari patungo kay Josue. Ang “dalhin ... kay Josue” ay mas direktang katumbas at sapat na natural.
  - severity: low
    issue: Malabo nang kaunti ang “mga ito” sa huling sugnay.
    rationale: Bagaman ang tinutukoy ay ang mga hari, mas malinaw na banggitin silang muli bilang “mga hari,” alinsunod sa hulaping panghalip ng Hebreo na tumutukoy sa mga hari.
  - severity: low
    issue: Hindi natural ang alternatibong “mga lalaking pandigma” sa talababa b.
    rationale: Mas karaniwan at malinaw sa modernong Filipino ang “mga mandirigma.” Hindi kailangang ulitin ng talababa ang panlalaking anyo, sapagkat ang pangunahing teksto at unang talababa na ang tumatalakay sa gendered na parirala.
