  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ גֹּ֛לּוּ אֲבָנִ֥ים גְּדֹל֖וֹת אֶל פִּ֣י הַ/מְּעָרָ֑ה וְ/הַפְקִ֧ידוּ עָלֶ֛י/הָ אֲנָשִׁ֖ים לְ/שָׁמְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: tl
  text: Sinabi ni Josue, “Igulong ninyo ang malalaking bato sa bukana ng yungib, at magtalaga kayo roon ng mga lalaking magbabantay sa kanila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pagsulong ng salaysay sa Tagalog; hindi kailangang laging tumbasan ng tahasang pang-ugnay ang wayyiqtol.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: גֹּלּוּ
  choice: Igulong ninyo
  rationale: Tuwirang ipinapahayag ang maramihang pautos mula sa גלל at ang kilos na angkop sa malalaking bato.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: malalaking bato
  rationale: Natural at tumpak na salin ng sukat na ipinahihiwatig ng parirala.
- source_word: אֶל פִּי הַמְּעָרָה
  choice: sa bukana ng yungib
  rationale: Ang פִּי ay literal na 'bibig,' ngunit ang 'bukana' ang natural na Filipino para sa pasukan o bungad ng yungib habang pinananatili ang konkretong larawan.
- source_word: וְהַפְקִידוּ
  choice: at magtalaga kayo
  rationale: Ipinapakita ang causative na diwa ng pag-atas o pagtatalaga sa isang tungkulin.
- source_word: עָלֶיהָ
  choice: roon
  rationale: Sa konteksto, tumutukoy ito sa paglalagay ng mga tao sa may yungib upang mamahala o magbantay; mas natural sa Filipino ang lokatibong 'roon' kaysa literal na 'sa ibabaw nito.'
- source_word: אֲנָשִׁים
  choice: mga lalaki
  rationale: Pinananatili ang tiyak na panlalaking katawagan ng Hebreo at hindi idinaragdag ang mas espesipikong pangngalang 'mga bantay.'
- source_word: לְשָׁמְרָם
  choice: magbabantay sa kanila
  rationale: Ang hulaping layon ay panlalaking maramihan, kaya malamang na tumutukoy sa mga haring nakakulong sa yungib, hindi sa iisang yungib.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang 'yungib' bilang natural na salitang biblikal para sa cave, at pinanatili ang maramihang layon sa 'sa kanila' ayon sa gramatika at konteksto ng Hebreo.
