  yaml_path: translation/ot/joshua/010/036.yaml
  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: tl
  text: Pagkatapos, umahon si Josue at ang buong Israel na kasama niya mula sa Eglon patungong Hebron, at nilabanan nila ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “laban sa kaniya”; ang panghalip na pambabae ay tumutukoy sa lunsod ng Hebron.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon
  rationale: Pinananatili nito ang direksiyonal na diwa ng עלה, na karaniwang nangangahulugang umakyat o umahon, at natural sa salaysay ng paglalakbay.
- source_word: וְכָל יִשְׂרָאֵל
  choice: at ang buong Israel
  rationale: Pinananatili ang kolektibong katawagang nasa Hebreo, na sa konteksto ay tumutukoy sa mga Israelitang kasama ni Josue.
- source_word: עִמּוֹ
  choice: na kasama niya
  rationale: Likas na salin ng pariralang tumutukoy kay Josue bilang pinunong sinamahan ng Israel.
- source_word: מֵעֶגְלוֹנָה
  choice: mula sa Eglon
  rationale: Ang מִן ay nagpapahayag ng pinanggalingan; malinaw at natural itong naihahayag ng “mula sa.”
- source_word: חֶבְרוֹנָה
  choice: patungong Hebron
  rationale: Ipinahihiwatig ng hulaping direksiyonal na ה ang pagkilos tungo sa Hebron; ang “patungong” ay nagpapanatili ng direksiyonal na diwa.
- source_word: וַיִּלָּחֲמוּ
  choice: at nakipaglaban sila
  rationale: Ang Niphal ng לחם ay tumutukoy sa pakikipaglaban; karaniwan at malinaw ang pariralang ito sa modernong Filipino.
- source_word: עָלֶיהָ
  choice: sa lunsod na iyon
  rationale: Ang עַל ay may diwang “laban sa,” at ang hulaping pambabae ay tumutukoy sa Hebron bilang lunsod. Sa Filipino, natural na gawing tahasan ang tinutukoy upang maiwasan ang malabong panghalip.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatili ang “buong Israel” bilang kolektibong pahayag at ang direksiyonal na diwa ng pag-ahon at pagtungo.
