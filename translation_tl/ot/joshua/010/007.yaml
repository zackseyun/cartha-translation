  yaml_path: translation/ot/joshua/010/007.yaml
  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
translation:
  language: tl
  text: Kaya umahon si Josue mula sa Gilgal—siya at ang lahat ng mga mandirigmang kasama niya, at ang lahat ng magigiting na mandirigma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon
  rationale: Pinananatili ang karaniwang diwang patungo sa mas mataas na lugar ng pandiwang עלה nang hindi dinaragdagan ng tiyak na paraang militar gaya ng “nagmartsa.”
- source_word: מִן הַגִּלְגָּל
  choice: mula sa Gilgal
  rationale: Tuwirang isinasalin ang מן bilang “mula sa” at pinananatili ang pangalang pantanging Gilgal.
- source_word: הוּא
  choice: siya
  rationale: Pinananatili ang tahasang panghalip na nagbibigay-diin na si Josue mismo ay kasama sa pag-ahon.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: ang lahat ng tauhang pandigma
  rationale: Ipinahahayag nito sa likas na makabagong Tagalog ang literal na “lahat ng bayan/mga tao ng digmaan” bilang pangkat ng mga lalaking lumalaban, nang hindi ito gawing mas malawak na “buong hukbo.”
- source_word: עִמּוֹ
  choice: na kasama niya
  rationale: Likas at tuwirang katumbas ng pariralang Hebreo para sa mga sumama kay Josue.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: ang lahat ng magigiting na mandirigma
  rationale: Ipinakikita ang lakas, katapangan, at kakayahang militar ng nakaugaliang pariralang Hebreo, habang malinaw na naihihiwalay sa naunang “tauhang pandigma.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “umahon” upang mapanatili ang direksiyonal na larawan ng Hebreo, at ang gitling na em dash upang maging malinaw ang paliwanag na “siya at…” nang hindi pinapawi ang tahasang panghalip sa pinagmulan.
