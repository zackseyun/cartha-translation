- from: Kaya umahon si Josue mula sa Gilgal—siya at ang lahat ng tauhang pandigma na kasama niya, at ang lahat ng magigiting na mandirigma.
  to: Kaya umahon si Josue mula sa Gilgal—siya at ang lahat ng mga mandirigmang kasama niya, at ang lahat ng magigiting na mandirigma.
  rationale: Pinalitan lamang ang “tauhang pandigma” ng mas likas at malinaw na “mga mandirigma.” Pinanatili ang “umahon,” ang tahasang “siya,” at ang ikalawang “lahat ng magigiting na mandirigma” upang maipakita ang direksiyonal na pandiwa at ang estruktura ng Hebreo nang hindi binubura ang pag-uulit nito.
