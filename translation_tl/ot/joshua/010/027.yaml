base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: tl
  text: Nang palubog na ang araw[a], nag-utos si Josue, at ibinaba nila ang mga iyon mula sa mga punongkahoy at itinapon sa yungib na pinagtataguan nila roon[b], at naglagay sila ng malalaking bato sa bunganga ng yungib; naroon ang mga batong ito hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa oras ng pagpasok ng araw,” isang Hebreong paraan ng pagsasabing lumulubog ang araw.
    reason: lexical_alternative
  - marker: b
    text: 'Tahasan sa Hebreo ang salitang “roon”: “na pinagtataguan nila roon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: Nang palubog na ang araw
  rationale: Likas na salitang Filipino para sa panahon ng paglubog ng araw, habang pinananatili ang kilos at temporal na diwa ng pariralang Hebreo.
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: nag-utos si Josue
  rationale: Tuwirang katumbas ng pandiwang 'mag-utos' at malinaw na ang kasunod na mga kilos ay isinagawa ng ibang tao.
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: ibinaba nila ang mga iyon mula sa mga punongkahoy
  rationale: Tumpak na inilalarawan ang pag-aalis at pagbaba sa kanila mula sa mga punong pinagsabitan.
- source_word: וַיַּשְׁלִכֻם
  choice: itinapon
  rationale: Tuwiran at masiglang katumbas ng Hebreong pandiwa na nangangahulugang ihagis o itapon.
- source_word: הַמְּעָרָה
  choice: yungib
  rationale: Karaniwan, marangal, at eksaktong katawagan sa isang natural na kuweba sa salaysay na biblikal.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: na pinagt taguan nila roon
  rationale: Pinananatili ang tahasang שָׁם ('roon') at ang naunang pagkukubli ng mga hari; ang pag-uulit ng lokasyon ay katanggap-tanggap sa Filipino bilang pagbibigay-diin.
- source_word: וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת
  choice: naglagay sila ng malalaking bato
  rationale: Natural na Filipino para sa sadyang paglalagay ng mga batong malalaki ang sukat.
- source_word: עַל פִּי הַמְּעָרָה
  choice: sa bunganga ng yungib
  rationale: Pinananatili ang metaporang Hebreo na 'bibig/bunganga' para sa bukana ng yungib; ipinahihiwatig ng konteksto na hinarangan ito ng mga bato.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Likas na idyomang Filipino para sa kalagayang nagpapatuloy hanggang sa panahon ng tagapagsalaysay.
theological_decisions:
- issue: Tinutukoy ng huling parirala na nagpapatuloy hanggang sa araw na ito
  choice: at naroon ang mga iyon hanggang sa araw na ito
  alternative: hanggang sa araw na ito
  rationale: Ang Hebreo ay walang tahasang pandiwa o inuulit na simuno sa huling parirala. Ginawang malinaw sa Filipino na ang malalaking bato ang nananatili, ayon sa pinakamalapit na antecedent, nang hindi nagdaragdag ng doktrinal na pakahulugan.
translation_notes:
  register: Makabagong Filipino na may marangal na himig. Ginamit ang “Josue” bilang nakaugaliang anyong Filipino ng pangalan at “yungib” bilang malinaw na katawagang biblikal. Iniwasan ang lipas o labis na literal na ayos, ngunit pinanatili sa talababa ang Hebreong larawan at diin.
