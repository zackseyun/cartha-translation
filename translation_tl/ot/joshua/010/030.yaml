  to: Ibinigay din ni Yahweh ang lunsod at ang hari nito sa kamay ng Israel. Sinalakay ni Josue ang lunsod sa pamamagitan ng espada at pinatay ang bawat taong nasa loob nito.[a] Wala siyang iniwang sinumang nakaligtas doon. Ginawa niya sa hari nito ang ginawa niya sa hari ng Jerico.
