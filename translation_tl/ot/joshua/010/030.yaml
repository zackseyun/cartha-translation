source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: tl
  text: Ibinigay din ni Yahweh ang lunsod at ang hari nito sa kamay ng Israel. Sinalakay ni Josue ang lunsod sa pamamagitan ng espada at pinatay ang bawat taong nasa loob nito.[a] Wala siyang iniwang sinumang nakaligtas doon. Ginawa niya sa hari nito ang ginawa niya sa hari ng Jerico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bawat kaluluwa na nasa loob nito,” isang paraan ng pagsasabing bawat taong nasa lunsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: ibinigay ... sa kamay ng Israel
  rationale: Pinananatili ang malinaw at nauunawaang larawang Hebreo na tumutukoy sa pagpapasailalim sa kapangyarihan ng Israel.
- source_word: אוֹתָהּ ... וְאֶת־מַלְכָּהּ
  choice: ang lunsod at ang hari nito
  rationale: Ang pambabaeng panghalip ay tumutukoy sa Libna, ang lunsod na binanggit sa konteksto; nilinaw ang reperente upang maging natural sa Tagalog.
- source_word: וַיַּכֶּהָ לְפִי־חֶרֶב
  choice: nilipol ... sa talim ng espada
  rationale: Sa kontekstong pandigma, ang נכה kasama ng idyomang 'sa bibig/talim ng espada' ay nagsasaad ng pagpatay sa pamamagitan ng espada; ang 'nilipol' ay natural at kaayon ng kasunod na pahayag na walang nakaligtas.
- source_word: כָּל־הַנֶּפֶשׁ אֲשֶׁר־בָּהּ
  choice: ang bawat taong naroon
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa bawat tao sa lunsod, hindi sa di-materyal na 'kaluluwa.'
- source_word: לֹא הִשְׁאִיר בָּהּ שָׂרִיד
  choice: Wala siyang iniwang sinumang nakaligtas doon
  rationale: Ipinahahayag nang natural sa Tagalog ang ganap na kawalan ng survivor nang hindi dinaragdagan ang saklaw ng teksto.
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: Ginawa niya sa hari nito ang ginawa niya sa hari ng Jerico
  rationale: Pinananatili ang pag-uulit ng pandiwang עשה at ang paghahambing sa sinapit ng hari ng Jerico.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa salaysay ng digmaan
  choice: bawat tao
  alternative: bawat kaluluwa
  rationale: Tumutukoy ang salita sa mga taong nasa lunsod at hindi gumagawa ng doktrinal na pahayag tungkol sa likas na katangian ng kaluluwa.
- issue: Hayag na paksa ng mga pandiwa pagkatapos ng unang sugnay
  choice: Josue
  alternative: siya
  rationale: Ang gramatikal na paksa ay hindi muling pinangalanan sa Hebreo, ngunit si Josue ang malinaw na gumaganap mula sa konteksto. Isang beses siyang pinangalanan sa Tagalog upang maiwasang mapagkamalang si Yahweh ang tuwirang paksa ng 'nilipol,' habang ginagamit ang 'siya' sa kasunod na pangungusap.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lunsod” para sa malinaw na reperente, “espada” bilang karaniwang modernong salita, at maiikling pangungusap upang luminaw ang sunod-sunod na kilos. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang ipinaliliwanag nito.
