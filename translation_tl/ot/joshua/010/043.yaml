  yaml_path: translation/ot/joshua/010/043.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: tl
  text: Pagkatapos, bumalik si Josue, kasama ang buong Israel, sa kampo sa Gilgal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Ang pandiwang שׁוב sa sunod-sunod na salaysay ay likas na isinasalin sa payak na aspektong naganap bilang “bumalik.”
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang modernong anyo ng pangalan sa Bibliyang Tagalog.
- source_word: וְכָל יִשְׂרָאֵל
  choice: kasama ang buong Israel
  rationale: Pinananatili nito ang kolektibong diwa ng literal na “at ang buong Israel,” habang likas na inuugnay sa naunang pandiwa sa Tagalog.
- source_word: עִמּוֹ
  choice: kasama
  rationale: Tuwirang ipinahahayag ang pagsama nila kay Josue; malinaw na ang tinutukoy sa ayos ng pangungusap kaya hindi na kailangang idagdag ang “niya.”
- source_word: אֶל הַמַּחֲנֶה
  choice: sa kampo
  rationale: Sa Tagalog, ang “sa” ay natural na pananda ng patutunguhan; ang “kampo” ay ang karaniwang katawagan sa himpilang militar.
- source_word: הַגִּלְגָּלָה
  choice: sa Gilgal
  rationale: Ang hulaping direksiyonal na -ה ay nagsasaad ng pagpunta sa Gilgal. Sa pariralang “sa kampo sa Gilgal,” natural na ipinapakita ang lokasyon ng kampong pinuntahan.
