  source_fidelity: Tumpak na naipapahayag ang mariing pagtuon sa “kayo,” ang utos na huwag tumigil, ang pagtugis, at ang pag-atake sa hulihan ng mga kaaway. Ang “huwag ninyo silang hayaang makapasok” ay wastong katumbas ng idyomang Hebreo na pagbabawal ng pagpapahintulot, at ang “ibinigay na sila ... sa inyong kamay” ay pinananatili ang perpektong aspekto at idyomang Hebreo.
  naturalness: Makabago, malinaw, at angkop ang rehistro. Ang mga maramihang utos na “huwag kayong,” “habulin ninyo,” at “huwag ninyo” ay natural at wastong tumutugon sa maramihang kausap.
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה at “inyong Diyos” para sa אֱלֹהֵיכֶם. Ang “nasa hulihan nila” ay maingat na salin ng וְזִנַּבְתֶּם nang hindi labis na itinatakda na pormal na rear guard ang tinutukoy.
