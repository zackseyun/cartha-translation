base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: tl
  text: Ngunit kayo, huwag kayong tumigil. Habulin ninyo ang inyong mga kaaway at salakayin ang nasa hulihan nila.[a] Huwag ninyo silang hayaang makapasok sa kanilang mga lungsod, sapagkat ibinigay na sila ni Yahweh na inyong Diyos sa inyong kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “salakayin ang hulihan nila” o “salakayin ang mga nahuhuli sa kanila.” Ang pandiwang Hebreo ay tumutukoy sa pag-atake sa pinakahuling bahagi ng isang tumatakas na hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ngunit kayo
  rationale: Ipinahahayag ng pang-ugnay at tahasang panghalip ang mariing paglipat at pagsalungat sa naunang utos.
- source_word: אַל תַּעֲמֹדוּ
  choice: huwag kayong tumigil
  rationale: Bagaman literal na tumutukoy sa pagtayo ang pandiwa, sa kontekstong militar ay ipinagbabawal ang paghinto sa pagtugis.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: Habulin ninyo ang inyong mga kaaway
  rationale: Natural at tuwirang Filipino para sa idyomang Hebreo na nangangahulugang patuloy na tugisin ang kaaway.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: salakayin ang nasa hulihan nila
  rationale: Ang pandiwa ay kaugnay ng 'buntot' at tumutukoy sa pag-atake sa pinakahuling bahagi o mga nahuhuli sa tumatakas na hukbo; hindi nito tiyak na ipinapalagay na pormal na rear guard ang tinutukoy.
- source_word: אַל תִּתְּנוּם לָבוֹא
  choice: Huwag ninyo silang hayaang makapasok
  rationale: Ang נתן na may pawatas dito ay idyomang nangangahulugang magpahintulot.
- source_word: אֶל עָרֵיהֶם
  choice: sa kanilang mga lungsod
  rationale: Ang עִיר ay lungsod o bayan; ang 'mga lungsod' ay angkop sa konteksto ng mga napapaderang pamayanan.
- source_word: כִּי נְתָנָם
  choice: sapagkat ibinigay na sila
  rationale: Ipinakikita ng perpektong anyo na ang tagumpay ay itinuturing nang tiyak dahil sa pagkilos ng Diyos; pinananatili ng 'ibinigay na' ang idyomang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tuwirang salin ng anyong construct na may hulaping pangmaramihang ikalawang panauhan.
- source_word: בְּיֶדְכֶם
  choice: sa inyong kamay
  rationale: Pinananatili ang Hebreong idyoma ng 'kamay' bilang kapangyarihan o kontrol, na nauunawaan din sa Filipino.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang nakasulat sa Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang anyo ng mga utos upang maipakita ang maramihang ikalawang panauhan sa Hebreo; iniwasan ang labis na teknikal na terminong militar upang mapanatili ang tunay na lawak ng kahulugan.
