source:
  edition: WLC
  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ/הַכּוֹתָ֛/ם מַכָּ֥ה גְדוֹלָֽה מְאֹ֖ד עַד תֻּמָּ֑/ם וְ/הַ/שְּׂרִידִים֙ שָׂרְד֣וּ מֵ/הֶ֔ם וַ/יָּבֹ֖אוּ אֶל עָרֵ֥י הַ/מִּבְצָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: tl
  text: At nangyari na nang matapos ni Josue at ng mga Israelita[a] na lipulin sila sa napakalaking pagpatay, hanggang sa maubos sila, ang mga nakaligtas mula sa kanila ay nakaligtas[b] at nakapasok sa mga lungsod na pinatibay,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Literal na inuulit ng Hebreo ang magkaugnay na salita: “ang mga nakaligtas … ay nakaligtas.”'
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari na
  rationale: Ipinakikilala nito ang sumunod na yugto ng salaysay at pinananatili ang ugnayan sa naunang pangyayari.
- source_word: כְּכַלּוֹת
  choice: nang matapos
  rationale: Ang infinitive construct na may כְּ ay temporal dito; likas sa Filipino ang “nang matapos.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at malinaw na makabagong Filipino para sa kolektibong idyomang Hebreo na literal na “mga anak ni Israel.”
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: na lipulin sila sa napakalaking pagpatay
  rationale: Sa kontekstong militar, ang נכה at מַכָּה ay tumutukoy sa matinding nakamamatay na pagsalakay; inihahayag ng “pagpatay” ang bigat ng pangyayari nang hindi pinapalambot ito.
- source_word: עַד תֻּמָּם
  choice: hanggang sa maubos sila
  rationale: Ipinahihiwatig ng pahayag ang pagdadala sa kalaban sa ganap na wakas. Pinanatili ang tensiyon nito sa kasunod na pagbanggit sa mga nakaligtas.
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: ang mga nakaligtas sa kanila ay nakaligtas
  rationale: Pinananatili ang sadyang pag-uulit ng magkaugnay na pangngalan at pandiwa sa Hebreo, pati ang pagkakakilanlan ng mga nakaligtas bilang kabilang sa natalong pangkat.
- source_word: עָרֵי הַמִּבְצָר
  choice: mga napapaderang lungsod
  rationale: Ang mga lungsod ay may pananggalang na kuta; ang “napapaderang lungsod” ay malinaw at karaniwang paglalarawan nito sa Filipino.
theological_decisions:
- issue: Ang tila ganap na pagkaubos at ang kasunod na pagbanggit sa mga nakaligtas
  choice: Pinanatili ang “hanggang sa maubos sila” kasabay ng tahasang pagbanggit sa mga nakaligtas.
  alternative: “hanggang sa halos maubos sila”
  rationale: Walang salitang “halos” sa Hebreo. Hindi dapat tahimik na lutasin ng salin ang retorikal o salaysay na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mga Israelita” para sa likas na daloy, at pinanatili sa pangunahing teksto ang kapansin-pansing pag-uulit tungkol sa mga nakaligtas. Nagtatapos ang talata sa kuwit sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
