  to: At nangyari na nang matapos ni Josue at ng mga Israelita[a] na lipulin sila sa napakalaking pagpatay, hanggang sa maubos sila, ang mga nakaligtas mula sa kanila ay nakaligtas[b] at nakapasok sa mga lungsod na pinatibay,
