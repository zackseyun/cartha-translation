  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: tl
  text: Pagkatapos, nagpatuloy si Josue, kasama ang buong Israel, mula sa Makeda patungong Libna, at nakipaglaban siya laban sa Libna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “nakipaglaban kasama ng Libna”; sa idyomang ito, ang Libna ang kalaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: nagpatuloy
  rationale: Ipinapahayag ng עבר ang paglipat o pagpapatuloy mula sa isang lugar patungo sa susunod. Ang “nagpatuloy” ay natural sa salaysay ng sunod-sunod na kampanyang militar at hindi nagpapahiwatig ng pagtawid sa ilog.
- source_word: עִמּוֹ
  choice: na kasama niya
  rationale: Tuwirang pinananatili nito ang diwa ng pagsama ng buong Israel kay Josue.
- source_word: מִמַּקֵּדָה
  choice: mula sa Makeda
  rationale: Ang unlaping מִן ay tumutukoy sa pinanggalingan; isinalin sa karaniwang anyong Filipino ang pangalan ng lugar.
- source_word: לִבְנָה
  choice: patungong Libna
  rationale: Ipinakikita ng לְ ang destinasyon ng pagkilos; ang “patungong” ay natural sa Filipino.
- source_word: וַיִּלָּחֶם
  choice: nakipaglaban siya
  rationale: Ang Niphal ng לחם ay nangangahulugang lumaban o makipaglaban. Ginamit ang panghalip na isahan upang mapanatili ang isahang pandiwang Hebreo na tumutukoy kay Josue.
- source_word: עִם לִבְנָה
  choice: sa Libna
  rationale: Pagkatapos ng pandiwang לחם, ang עִם ay idyomatikong nagpapakilala sa kalaban. Sa Filipino, malinaw sa konteksto ng “nakipaglaban” na ang Libna ang kalaban.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pokus kay Josue sa pamamagitan ng isahang “siya,” habang ang “buong Israel” ay inilalarawang kasama niya. Ginamit ang karaniwang anyong Filipino na Josue, Makeda, at Libna.
