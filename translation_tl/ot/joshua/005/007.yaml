  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶם֙ הֵקִ֣ים תַּחְתָּ֔/ם אֹתָ֖/ם מָ֣ל יְהוֹשֻׁ֑עַ כִּי עֲרֵלִ֣ים הָי֔וּ כִּ֛י לֹא מָ֥לוּ אוֹתָ֖/ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: tl
  text: At ang kanilang mga anak na lalaki[a], na ibinangon bilang kapalit nila, ay tinuli ni Josue, sapagkat hindi tuli ang mga ito; hindi nila tinuli ang mga ito habang nasa paglalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na pumalit sa kanila.” Ipinahihiwatig ng pariralang Hebreo na ang mga anak na ito ang humalili sa naunang salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: At
  rationale: Ipinagpapatuloy ng pang-ugnay ang salaysay; hindi hiwalay na isinasalin ang pananda ng tuwirang layon.
- source_word: בְּנֵיהֶם
  choice: mga anak nilang lalaki
  rationale: Sa konteksto ng pagtutuli, tumutukoy ito sa mga lalaking anak, kaya mas tiyak ito kaysa sa pangkalahatang “mga anak.”
- source_word: הֵקִים תַּחְתָּם
  choice: na pinalit niya sa kanila
  rationale: Ipinahahayag ng parirala ang pagbangon ng bagong salinlahi bilang kapalit ng nauna. Pinananatili ng “niya” ang di-tahasang simuno ng pandiwang Hebreo.
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: tinuli ni Josue
  rationale: Ang מוּל ang karaniwang pandiwa para sa literal na pagtutuli; natural sa Tagalog ang ayos na pandiwa–tagaganap.
- source_word: כִּי עֲרֵלִים הָיוּ
  choice: sapagkat hindi tuli ang mga ito
  rationale: Malinaw na inilalahad ang dahilan at ang literal na kalagayan ng mga lalaking anak.
- source_word: כִּי לֹא מָלוּ אֹתָם
  choice: hindi nila tinuli ang mga ito
  rationale: Pinananatili ang di-tiyak na maramihang tagaganap ng Hebreo sa halip na idagdag ang “walang sinuman.”
- source_word: בַּדָּרֶךְ
  choice: habang naglalakbay
  rationale: Natural na Tagalog ito para sa panahong ginugol sa paglalakbay sa ilang, na siyang tinutukoy ng parirala.
theological_decisions:
- issue: Pisikal at tipanang kahulugan ng עֲרֵלִים
  choice: hindi tuli
  alternative: may balat ng masama
  rationale: Literal na pagtutuli bilang tanda ng tipan ang paksa, hindi isang metaporikal na kalagayang espirituwal. Ang “hindi tuli” ang malinaw at karaniwang modernong pagpapahayag.
- issue: Di-tahasang simuno ng הֵקִים
  choice: niya
  alternative: ng Diyos
  rationale: Hindi tahasang pinangalanan sa talata ang simuno ng pandiwa. Ang panghalip ay nagpapanatili sa anyo at bahagyang kalabuan ng Hebreo sa halip na tahasang idagdag ang “Diyos,” bagaman iyon ang ipinahihiwatig ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue,” ang nakaugaliang anyo ng pangalan sa Tagalog. Iniwasan ang labis na teknikal o lumang pananalita, habang pinananatili ang mga panghalip at ugnayang sanhi ng Hebreo.
