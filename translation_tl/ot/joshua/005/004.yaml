translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Josue” at “Ehipto” bilang mga pangalang karaniwang nakikilala sa tradisyong Tagalog. Pinili ang “ilang” bilang maikli at pamilyar na katawagang biblikal; iniwasan ang sobrang literal ngunit alanganing ayos ng mga appositional na parirala sa Hebreo.
