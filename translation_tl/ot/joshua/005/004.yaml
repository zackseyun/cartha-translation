  to: 'At ito ang dahilan[a] kung bakit sila tinuli ni Josue: lahat ng taong lumabas sa Ehipto—ang mga lalaki, lahat ng mandirigma[b]—ay namatay sa ilang habang nasa daan, pagkalabas nila sa Ehipto.'
