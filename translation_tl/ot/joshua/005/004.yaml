base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: tl
  text: 'At ito ang dahilan[a] kung bakit sila tinuli ni Josue: lahat ng taong lumabas sa Ehipto—ang mga lalaki, lahat ng mandirigma[b]—ay namatay sa ilang habang nasa daan, pagkalabas nila sa Ehipto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “At ito ang usapin hinggil sa pagtutuli ni Josue: ang buong bayan…” Idyomatikong pananalita ito sa Hebreo na nagpapakilala sa paliwanag ng ginawa ni Josue.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga mandirigma” ay maaari ding isaling “mga lalaking pandigma” o “mga lalaking nakikipaglaban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר
  choice: At ito ang dahilan
  rationale: Ang literal na “ito ang bagay/usapin” ay isang idyomang nagpapakilala sa paliwanag ng ginawa ni Josue. Likas sa modernong Tagalog ang “ito ang dahilan” at pinananatili nito ang puwersang nagpapaliwanag ng Hebreo.
- source_word: אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: kung bakit sila tinuli ni Josue
  rationale: Elliptical ang sugnay sa Hebreo. Ipinahihiwatig ng konteksto na ipinaliliwanag nito ang pagtutuli ni Josue; ang “sila” ay hayag na idinagdag mula sa kasunod na pangkat na tinutukoy.
- source_word: מָל
  choice: tinuli
  rationale: Ito ang karaniwan, tuwiran, at tiyak na salin ng pandiwang tumutukoy sa pagtutuli.
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים
  choice: lahat ng lalaki sa bayang lumabas sa Ehipto
  rationale: Pinananatili ng “lalaki” ang tahasang pagtukoy sa kasarian, samantalang inilalahad ng “sa bayang lumabas” ang ugnayan ng appositional na parirala sa natural na Tagalog.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: lahat ng mandirigma
  rationale: Natural at dignipikadong katawagan ito para sa mga lalaking nakatalaga sa pakikipagdigma, nang hindi nagdaragdag ng ranggo o ibang tiyak na tungkulin.
- source_word: מֵתוּ בַמִּדְבָּר
  choice: ay namatay sa ilang
  rationale: Ang “ilang” ay angkop sa konteksto ng paglalakbay ng Israel at hindi nililimitahan ang lugar sa purong buhangin gaya ng maaaring ipahiwatig ng “disyerto.”
- source_word: בַּדֶּרֶךְ בְּצֵאתָם מִמִּצְרָיִם
  choice: habang nasa daan, pagkalabas nila sa Ehipto
  rationale: Inilalarawan nito ang pagkamatay sa panahon ng paglalakbay na sumunod sa paglabas nila sa Ehipto, habang pinananatili ang bahagyang maluwag na ugnayang temporal ng Hebreo.
