translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “buong bayan” para sa kolektibong Israel at ang “kani-kanilang lugar” upang maipahayag ang idyomang Hebreo nang hindi nagiging literal at malabo.
