  text: וַ/יְהִ֛י כַּ/אֲשֶׁר תַּ֥מּוּ כָל הַ/גּ֖וֹי לְ/הִמּ֑וֹל וַ/יֵּשְׁב֥וּ תַחְתָּ֛/ם בַּֽ/מַּחֲנֶ֖ה עַ֥ד חֲיוֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/008.yaml
  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: tl
  text: Nang matapos tuliin ang buong bayan, nanatili sila sa kani-kanilang lugar sa kampo hanggang sa gumaling sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa manumbalik ang kanilang lakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Ipinakikilala ng pormulang Hebreo ang isang sugnay na panahunan; natural na ipinahahayag ito ng “Nang” sa makabagong Tagalog.
- source_word: תַּמּוּ
  choice: matapos
  rationale: Ipinahihiwatig ng pandiwa ang pagkakumpleto ng gawain; ang “matapos” ay malinaw at likas kasama ng kasunod na pawatas.
- source_word: כָל הַגּוֹי
  choice: ang buong bayan
  rationale: Tumutukoy ito sa Israel bilang isang kolektibong sambayanan. Pinananatili ng “buong bayan” ang pang-isahang kolektibong diwa at mas natural ito kaysa “buong bansa” sa konteksto.
- source_word: לְהִמּוֹל
  choice: tuliin
  rationale: Ang anyong Niphal ay nagpapahayag na ang bayan ang tumanggap ng pagtutuli. Sa Tagalog, natural na naihahayag ang diwang pasibo sa konstruksyong “matapos tuliin ang buong bayan.”
- source_word: וַיֵּשְׁבוּ
  choice: nanatili sila
  rationale: Bagaman maaari itong literal na mangahulugang “umupo,” sa konteksto ay tumutukoy ito sa pananatili habang nagpapagaling.
- source_word: תַחְתָּם
  choice: sa kani-kanilang lugar
  rationale: Idyomatikong tumutukoy ang salita sa pananatili kung nasaan sila, hindi sa literal na pagiging “nasa ilalim.”
- source_word: בַּמַּחֲנֶה
  choice: sa kampo
  rationale: Karaniwang lokatibong salin ito ng pariralang Hebreo.
- source_word: עַד חֲיוֹתָם
  choice: hanggang sa gumaling sila
  rationale: Sa konteksto ng pagtutuli, ang חיה ay tumutukoy sa pagbabalik ng kalusugan o lakas. Likas at malinaw ang “gumaling,” habang itinatala sa talababa ang posibleng diwang “manumbalik ang lakas.”
