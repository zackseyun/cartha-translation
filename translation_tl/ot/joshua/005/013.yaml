revisions:
- from: At nangyari, habang si Josue ay nasa may Jerico[a], itiningala niya ang kanyang mga mata at tumingin. Naroon ang isang lalaking nakatayo sa tapat niya, at ang espada nito ay nakabunot sa kamay. Lumapit si Josue sa kanya at nagtanong, “Kakampi ka ba namin o ng aming mga kaaway?”
  to: At nangyari, habang si Josue ay nasa may Jerico[a], itiningala niya ang kanyang mga mata at tumingin. Naroon ang isang lalaking nakatayo sa tapat niya, na may hawak na nakabunot na espada. Lumapit si Josue sa kanya at nagtanong, “Kakampi ka ba namin o ng aming mga kaaway?”
  rationale: Pinalitan ang di-ganap na natural at posibleng malabong parirala tungkol sa espada ng “na may hawak na nakabunot na espada.” Pinananatili nito ang impormasyong ang espada ay nakabunot at nasa kamay ng lalaki, nang walang pagdaragdag sa kaniyang pagkakakilanlan o tungkulin.
