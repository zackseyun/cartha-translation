  text: וַ/יְהִ֗י בִּֽ/הְי֣וֹת יְהוֹשֻׁעַ֮ בִּ/ירִיחוֹ֒ וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִישׁ֙ עֹמֵ֣ד לְ/נֶגְדּ֔/וֹ וְ/חַרְבּ֥/וֹ שְׁלוּפָ֖ה בְּ/יָד֑/וֹ וַ/יֵּ֨לֶךְ יְהוֹשֻׁ֤עַ אֵלָי/ו֙ וַ/יֹּ֣אמֶר ל֔/וֹ הֲ/לָ֥/נוּ אַתָּ֖ה אִם לְ/צָרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: tl
  text: At nangyari, habang si Josue ay nasa may Jerico[a], itiningala niya ang kanyang mga mata at tumingin. Naroon ang isang lalaking nakatayo sa tapat niya, na may hawak na nakabunot na espada. Lumapit si Josue sa kanya at nagtanong, “Kakampi ka ba namin o ng aming mga kaaway?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Jerico” o “malapit sa Jerico.” Malawak ang maaaring ipahiwatig ng pang-ukol sa Hebreo at hindi nito tiyak na sinasabing nasa loob siya ng lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili ang panandang pasalaysay ng Hebreo sa paraang malinaw at hindi makaluma sa Tagalog.
- source_word: בִּהְיוֹת
  choice: habang ... ay nasa
  rationale: Ang infinitive construct na may בְּ ay naglalahad ng kalagayang kasabay ng sumunod na pangyayari.
- source_word: בִּירִיחוֹ
  choice: nasa may Jerico
  rationale: Nagpapahayag ng malawak na lokasyon nang hindi tiyak na nagsasabing nasa loob siya ng lungsod.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: itiningala niya ang kanyang mga mata at tumingin
  rationale: Pinananatili ang matingkad na idyomang Hebreo at kinakatawan nang hiwalay ang dalawang pandiwa.
- source_word: וְהִנֵּה
  choice: Naroon
  rationale: Likas na panawag-pansin sa makabagong Tagalog na naghaharap ng bigla at matingkad na tanawin.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Hindi dinaragdagan ang pagkakakilanlan ng tauhan na sa talatang ito ay tinatawag lamang na lalaki.
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: nakatayo sa tapat niya
  rationale: Tumpak na ipinahahayag ang posisyong kaharap o kasalungat ni Josue.
- source_word: חַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: ang espada nito ay nakabunot sa kamay
  rationale: Malinaw na inilalarawan ang sandatang nahugot na at hawak ng lalaki.
- source_word: וַיֵּלֶךְ ... אֵלָיו
  choice: Lumapit si Josue sa kanya
  rationale: Natural na Tagalog para sa pagkilos ni Josue patungo sa lalaki.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: Kakampi ka ba namin o ng aming mga kaaway?
  rationale: Ipinahahayag nang natural ang tanong tungkol sa panig o katapatan sa kontekstong militar.
theological_decisions:
- issue: Pagkakakilanlan ng lalaking nakatagpo ni Josue
  choice: isang lalaki
  alternative: isang anghel, ang anghel ni Yahweh, o isang pagpapakita ng Diyos o ni Cristo bago ang pagkakatawang-tao
  rationale: Sa talatang ito, אִישׁ lamang ang tawag sa tauhan. Hindi dapat pangunahan ng salin ang pagkakakilanlang maaaring ipakahulugan mula sa kasunod na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong larawan sa pagtitingala at ang neutral na pagkakakilanlan ng lalaki, habang ginawang natural ang tanong tungkol sa panig na kinabibilangan.
