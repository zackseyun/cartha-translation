id: JOS.5.1
reference: Joshua 5:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: tl
  text: Nang mabalitaan ng lahat ng hari ng mga Amoreo na nasa gawing kanluran ng Jordan, at ng lahat ng hari ng mga Cananeo na nasa tabing-dagat[a], na pinatuyo ni Yahweh ang tubig ng Jordan sa harap ng mga anak ni Israel hanggang sa makatawid kami[b], natunaw ang kanilang puso at wala na silang lakas ng loob[c] dahil sa mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nasa baybayin”; ang “tabing-dagat” ay tumutukoy sa rehiyong baybayin.
    reason: lexical_alternative
  - marker: b
    text: May mga manuskrito at sinaunang salin na kababasahan ng “hanggang sa makatawid sila” sa halip na “hanggang sa makatawid kami.”
    reason: textual_variant
  - marker: c
    text: Sa Hebreo, “wala nang espiritu sa kanila,” isang idyoma para sa pagkawala ng tapang o paninindigan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Nang mabalitaan
  rationale: Ang temporal na konstruksiyon ay likas na naipapahayag sa Tagalog sa pamamagitan ng “Nang mabalitaan”; hindi na kailangang isalin nang hiwalay ang pormulang pasalaysay na וַיְהִי.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי
  choice: lahat ng hari ng mga Amoreo
  rationale: Pinananatili ang kolektibong pagtukoy sa mga hari at ang pangalang etniko.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: nasa gawing kanluran ng Jordan
  rationale: Ipinahahayag nang malinaw ang lokasyong nasa kanlurang panig ng Jordan; ang יָמָּה ay tumutukoy sa direksiyong pakanluran o patungo sa dagat.
- source_word: עַל הַיָּם
  choice: nasa tabing-dagat
  rationale: Likas na Tagalog para sa mga hari sa rehiyong baybayin, habang pinananatili ang larawan ng pagiging malapit sa dagat.
- source_word: הוֹבִישׁ
  choice: pinatuyo
  rationale: 'Ang Hiphil ng יבש ay causative: ginawa ni Yahweh na matuyo ang tubig.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: מִפְּנֵי בְנֵי יִשְׂרָאֵל
  choice: sa harap ng mga anak ni Israel
  rationale: Pinananatili ang larawan ng tubig na inalis sa kanilang harapan at ang pamilyal-pambansang katawagang “mga anak ni Israel.”
- source_word: עַד עברנו
  choice: hanggang sa makatawid kami
  rationale: Sinusunod sa pangunahing teksto ang unang panauhang maramihan ng nakasulat na anyong Masoretiko; inilalagay sa talababa ang kilalang ikatlong-panauhang pagbasa.
- source_word: וַיִּמַּס לְבָבָם
  choice: natunaw ang kanilang puso
  rationale: Pinananatili ang isahang kolektibong “puso” at ang matingkad na metapora ng Hebreo para sa lubos na panghihina ng tapang.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: wala na silang lakas ng loob
  rationale: Sa konteksto, ang רוּחַ ay tumutukoy sa tapang o panloob na tatag. Ang salin ay natural sa Tagalog, at ang literal na larawan ay itinatala sa talababa.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Pambansang katawagang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang pamilyal at pambansang anyo ng Hebreo nang hindi nilalagyan ng dagdag na teolohikal na pagpapakahulugan.
- issue: Panauhan sa עַד עברנו
  choice: hanggang sa makatawid kami
  alternative: hanggang sa makatawid sila
  rationale: Pinananatili sa pangunahing teksto ang unang panauhang anyo ng tekstong Masoretiko at hayagang kinikilala sa talababa ang ikatlong-panauhang variant, sa halip na tahimik na lutasin ang tensiyong tekstuwal.
- issue: Kahulugan ng רוּחַ sa idyoma
  choice: lakas ng loob
  alternative: espiritu
  rationale: Dito, ang pagkawala ng רוּחַ ay pagkawala ng tapang o paninindigan, hindi isang pahayag tungkol sa kalagayang espirituwal ng mga hari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong “Jordan,” ang mga pangalang “Amoreo” at “Cananeo,” at ang pamilyal na katawagang “mga anak ni Israel.” Pinanatili ang metaporang “natunaw ang kanilang puso,” ngunit isinalin nang idyomatiko ang kasunod na pariralang tungkol sa pagkawala ng רוּחַ upang maging natural at madaling maunawaan.
