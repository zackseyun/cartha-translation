  source_fidelity: 'Tumpak na naipapahayag ang Hebreo: si Yahweh ang nagsasalita kay Josue; ang kilos na “iginulong ko palayo” ay pinananatili ang mahalagang paglalaro ng salita sa Gilgal; at ang “kahihiyan ng Ehipto” ay hindi labis na binibigyan ng isang tiyak na pakahulugan. Ang “palayo sa inyo” ay isang likas na katumbas ng מֵעֲלֵיכֶם, kahit hindi nito literal na inuulit ang imaheng “mula sa ibabaw ninyo.”'
