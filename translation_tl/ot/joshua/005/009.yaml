  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֗וֹם גַּלּ֛וֹתִי אֶת חֶרְפַּ֥ת מִצְרַ֖יִם מֵ/עֲלֵי/כֶ֑ם וַ/יִּקְרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ גִּלְגָּ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: tl
  text: Sinabi ni Yahweh kay Josue, “Ngayon ay iginulong ko palayo sa inyo ang kahihiyan ng Ehipto.[a]” Kaya tinawag na Gilgal[b] ang lugar na iyon hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kadustaan ng Ehipto” o “ang pag-alipusta ng Ehipto.” Maaaring tumukoy ang parirala sa kahihiyan ng nakaraan ng Israel sa Ehipto, sa pag-alipusta mula sa Ehipto, o sa kahihiyang may kaugnayan sa tipan na inalis na ngayon.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang “Gilgal” ay kahawig sa tunog ng pandiwang isinaling “iginulong ko palayo,” kaya may paglalaro rito sa mga salita.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa anyong malapit sa Hebreo at karaniwang ginagamit sa makabagong saling Filipino.
- source_word: גַּלּוֹתִי
  choice: iginulong ko palayo
  rationale: Ang pandiwang mula sa גלל ay may diwang “igulong.” Pinananatili ng pariralang ito ang larawan ng pag-aalis at ang paglalaro sa tunog ng pangalang גִּלְגָּל.
- source_word: חֶרְפַּת מִצְרַיִם
  choice: ang kahihiyan ng Ehipto
  rationale: Ang חֶרְפָּה ay maaaring tumukoy sa kahihiyan, kadustaan, o pag-alipusta. Ang “kahihiyan ng Ehipto” ay likas sa Filipino at hindi nagpapasiya kung ang Ehipto ang pinagmulan, tagaganap, o kaugnay na kalagayan ng kahihiyan.
- source_word: מֵעֲלֵיכֶם
  choice: palayo sa inyo
  rationale: Likas na ipinahahayag sa Filipino ang pag-aalis ng isang pasaning dating nakapatong sa kanila, bagaman hindi literal na inuulit ang “mula sa ibabaw ninyo.”
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: Kaya tinawag na Gilgal ang lugar na iyon
  rationale: Natural na pormula ito ng pagpapangalan sa Filipino. Hindi rin nito sapilitang tinutukoy ang di-hayag na simuno ng pandiwang Hebreo.
- source_word: גִּלְגָּל
  choice: Gilgal
  rationale: Isinalin sa transliterasyon ang pangalan ng lugar upang mapanatili ang pagkakakilanlan nito at maipaliwanag ang paglalaro sa tunog sa talababa.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Pinananatili nito ang pananaw ng tagapagsalaysay at ang karaniwang pormulang temporal ng Hebreo.
theological_decisions:
- issue: Kahulugan ng “kahihiyan ng Ehipto”
  choice: Pinanatili bilang malawak at sadyang hindi tiyak na pahayag.
  alternative: Tahasang tukuyin ito bilang kahihiyan ng pagkaalipin, pag-alipusta ng mga Ehipsiyo, o kahihiyang kaugnay ng di-pagtutuli at katayuan sa tipan.
  rationale: Hindi nililinaw ng pariralang Hebreo kung aling kahulugan ang natatangi. Ang pagpapanatili sa “kahihiyan ng Ehipto” ay umiiwas sa pagpasok ng isang tiyak na paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue,” ang nakaugaliang anyong Filipino ng pangalan, at iniwasan ang sobrang literal ngunit di-likas na “mula sa ibabaw ninyo.”
