  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: tl
  text: Nang panahong iyon, sinabi ni Yahweh kay Josue, “Gumawa ka para sa iyo ng mga kutsilyong yari sa batong pingkian,[a] at muli mong tuliin ang mga anak na lalaki ng Israel[b] sa ikalawang pagkakataon.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kutsilyong batong pingkian.” Tumutukoy ang Hebreong parirala sa mga kasangkapang pamputol na gawa sa batong pingkian at ginagamit dito sa pagtutuli.
    reason: lexical_alternative
  - marker: b
    text: Hebreo, “mga anak na lalaki ng Israel”; maaari ring isaling “mga Israelita,” ngunit mga lalaki ang partikular na tinutukoy sa kontekstong ito.
    reason: lexical_alternative
  - marker: c
    text: Ang “muli ... sa ikalawang pagkakataon” ay tumutukoy sa muling pagsasagawa ng pagtutuli sa Israel bilang isang bayan, hindi kinakailangang pagtutuli nang dalawang beses sa parehong mga indibidwal.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Likas at malinaw na salin ng karaniwang pananalitang nagtatakda ng panahon sa salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עֲשֵׂה לְךָ
  choice: Gumawa ka para sa sarili mo
  rationale: Inilalarawan ang pautos at ang diwang pabor o pakinabang para sa kinakausap nang natural sa modernong Tagalog.
- source_word: חַרְבוֹת צֻרִים
  choice: mga kutsilyong batong pingkian
  rationale: Sa konteksto ng pagtutuli, ang חַרְבוֹת ay mga kasangkapang pamputol, at ang צֻרִים ay tumutukoy sa flint o batong pingkian.
- source_word: וְשׁוּב
  choice: muli
  rationale: Bagaman mula sa pandiwang ‘bumalik,’ ginagamit ito rito bilang panandang pag-uulit ng kasunod na utos.
- source_word: מֹל
  choice: tuliin
  rationale: Direkta at karaniwang pandiwang Tagalog para sa pagsasagawa ng pagtutuli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ng Israel
  rationale: Pinananatili ang panlalaking kahulugan ng Hebreo, na mahalaga rito sapagkat ang mga lalaking kabilang sa Israel ang tinutuli.
- source_word: שֵׁנִית
  choice: sa ikalawang pagkakataon
  rationale: Pinananatili ang tahasang pagbanggit ng ikalawang pagkakataon, bukod sa kahulugang ‘muli’ ng וְשׁוּב.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang banal na pangalan; pinananatili itong personal na pangalan at hindi pinapalitan ng titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ng Israel
  alternative: mga Israelita; mga anak ng Israel
  rationale: Ang agarang konteksto ng pagtutuli ay nagpapakitang mga lalaki ang tinutukoy, kaya pinananatili ang kasariang hayag sa pariralang Hebreo.
- issue: Kahulugan ng ‘muli ... sa ikalawang pagkakataon’
  choice: Pag-uulit ng pagtutuli sa Israel bilang bayan
  alternative: Muling pagtutuli sa mismong mga indibidwal
  rationale: Pinananatili ang dobleng pahayag ng Hebreo nang hindi ipinahihiwatig na dalawang beses tinuli ang parehong mga tao; nililinaw ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Josue,” ang nakaugaliang anyong Tagalog ng pangalan, at ang pang-araw-araw ngunit disenteng “para sa sarili mo.” Pinanatili ang parehong tanda ng pag-uulit sa וְשׁוּב at שֵׁנִית upang hindi mawala ang diin at tensiyon ng tekstong Hebreo.
