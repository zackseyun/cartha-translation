base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: tl
  text: Sinabi ng pinuno ng hukbo ni Yahweh[a] kay Josue, “Hubarin mo ang iyong sandalyas sa iyong paa[b], sapagkat banal ang lugar na kinatatayuan mo.” At ginawa iyon ni Josue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinuno ng hukbo ng PANGINOON.” Ang “Yahweh” ang personal na pangalang kinakatawan ng apat na titik na Hebreo na יהוה.
    reason: lexical_alternative
  - marker: b
    text: 'Isahan sa Hebreo: “ang iyong sandalyas ... ang iyong paa.” Ihambing ang mas pamilyar na anyong maramihan sa Exodo 3:5.'
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר
  choice: pinuno
  rationale: Sa kontekstong militar, malinaw na ipinahihiwatig ng “pinuno” ang pamumuno sa hukbo. Mas likas ito sa karaniwang Filipino kaysa “prinsipe,” at hindi nito nililimitahan ang ranggo gaya ng maaaring gawin ng “kapitan.”
- source_word: צְבָא יְהוָה
  choice: hukbo ni Yahweh
  rationale: Ang צָבָא ay hukbo o kalipunan ng mga mandirigma. Ang “hukbo” ay malinaw at likas sa modernong Filipino, at ang יְהוָה ay pinanatili bilang personal na pangalang “Yahweh.”
- source_word: שַׁל
  choice: Hubarin mo
  rationale: Tuwirang utos itong alisin ang suot sa paa; “hubarin” ang natural na pandiwang Filipino para rito.
- source_word: נַעַלְךָ
  choice: ang sandalyas
  rationale: Mas angkop sa sinaunang uri ng kasuotan sa paa ang “sandalyas” kaysa sa pangkalahatang “sapatos.” Hindi tahasang minarkahan ng Filipino ang bilang, ngunit nililinaw ng kasunod na pariralang “sa paa mo” at ng talababa ang anyong isahan sa Hebreo.
- source_word: מֵעַל רַגְלְךָ
  choice: sa paa mo
  rationale: Pinananatili ang isahang “paa” ng Hebreo. Kasama ng pandiwang “hubarin,” likas nang nauunawaan ang diwang pag-aalis mula sa paa.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עֹמֵד עָלָיו
  choice: ang lugar na kinatatayuan mo
  rationale: Likas na Filipino ito para sa “lugar na kinatatayuan mo”; hindi na kailangang ulitin ang tahasang “sa ibabaw nito” sapagkat nakapaloob na iyon sa “kinatatayuan.”
- source_word: קֹדֶשׁ הוּא
  choice: banal
  rationale: Ang “banal” ang karaniwan at may angkop na bigat na salin ng קֹדֶשׁ sa kontekstong biblikal.
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן
  choice: At ginawa nga iyon ni Josue
  rationale: Likas na pormula ito sa Filipino para sa pagsunod ni Josue; ang “nga” ay nagbibigay-diin na ginawa niya ang iniutos nang hindi nagdaragdag ng bagong pangyayari.
theological_decisions:
- issue: Pagkakakilanlan at katayuan ng שַׂר צְבָא יְהוָה
  choice: Isinalin lamang bilang “pinuno ng hukbo ni Yahweh.”
  alternative: Tukuyin siya bilang anghel, pagpapakita ni Yahweh, o pagpapakita ni Cristo bago ang pagkakatawang-tao.
  rationale: Titulo lamang ang tahasang ibinibigay ng talata. Hindi nito tuwirang nilulutas kung sino ang tauhang ito, kaya pinananatili ng salin ang teolohikal na tensiyon at hindi nagdaragdag ng isang tiyak na interpretasyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “Josue,” ang nakaugaliang anyong Filipino ng pangalan. Pinanatili ang “Yahweh” bilang personal na pangalan ng Diyos, ang isahang “paa,” at ang hindi tiyak na pagkakakilanlan ng nagsasalita.
