base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: tl
  text: Nagkampo ang mga anak ni Israel[a] sa Gilgal, at ipinagdiwang nila ang Paskuwa noong ikalabing-apat na araw ng buwan, sa gabi, sa kapatagan ng Jerico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ang mga Israelita.” Literal sa Hebreo: “ang mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: Nagkampo
  rationale: Likas at makabagong katumbas ng pandiwang חנה, na tumutukoy sa pagtatayo o pananatili sa kampo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang tahasang pampamilyang anyo ng Hebreo at ang panlalaking pangmaramihang pahayag, habang nananatiling malinaw sa Filipino.
- source_word: בַּגִּלְגָּל
  choice: sa Gilgal
  rationale: Ang “sa” ang natural na panandang panlunan sa Filipino para sa pangalan ng lugar.
- source_word: וַיַּעֲשׂוּ אֶת־הַפֶּסַח
  choice: ipinagdiwang nila ang Paskuwa
  rationale: Idyomatiko ang עשה kasama ng פֶּסַח at nangangahulugang isagawa o ipagdiwang ang pagdiriwang, hindi lamang literal na “gawin.”
- source_word: הַפֶּסַח
  choice: ang Paskuwa
  rationale: Karaniwan at nakikilalang katawagan sa Filipino para sa kapistahan at kaugnay na ritwal.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ng ikalabing-apat na araw ng buwan
  rationale: Natural at eksaktong pormang pangkalendaryo sa Filipino; kasama ng “nang gabi” ay malinaw nitong itinatakda ang petsa at oras.
- source_word: בָּעֶרֶב
  choice: nang gabi
  rationale: Direkta at natural na pahayag ng oras sa makabagong Filipino.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: sa kapatagan ng Jerico
  rationale: Ipinahahayag ng עַרְבוֹת ang malawak at patag na rehiyon; “kapatagan” ang malinaw at natural na heograpikong katumbas.
theological_decisions:
- issue: Pagpapahayag sa בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Walang doktrinal na usaping nilulutas dito. Pinananatili ng napiling anyo ang pampamilya at panlalaking pangmaramihang pahayag ng Hebreo; inilalagay sa talababa ang mas idyomatikong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na pampamilyang katawagan sa pangunahing teksto, ngunit gumamit ng natural na ayos ng pangungusap at idyomatikong pandiwa para sa pagdiriwang ng Paskuwa.
