id: JOS.5.6
reference: Joshua 5:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: tl
  text: Sapagkat apatnapung taon na naglakbay sa ilang ang mga anak ni Israel, hanggang sa maubos ang buong bayan—ang mga lalaking mandirigma na lumabas mula sa Ehipto—dahil hindi sila nakinig sa tinig ni Yahweh. Sumumpa si Yahweh sa kanila na hindi niya sila pahihintulutang makita ang lupain na isinumpa ni Yahweh sa kanilang mga ninuno na ibibigay niya sa atin[a], isang lupaing dinadaluyan ng gatas at pulot-pukyutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “ibibigay niya sa atin”; mababasa sa ilang sinaunang bersiyon at salin ang “ibibigay niya sa kanila.”'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa naunang talata at natural na pinananatili ang paliwanag na ugnayan.
- source_word: הָלְכוּ
  choice: naglakbay
  rationale: Ang literal na diwang 'lumakad/pumunta' ay tumutukoy rito sa mahabang paglalakbay sa ilang; mas natural sa modernong Tagalog ang 'naglakbay' nang hindi binabago ang kahulugan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang anyo ng Hebreong katawagan at ang kaugnayan nila kay Israel, habang malinaw pa rin sa karaniwang mambabasa.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang 'ilang' ang maikli at nakaugaliang salin para sa ilang na pook; hindi nito nililimitahan ang tagpuan sa purong disyerto lamang.
- source_word: עַד תֹּם
  choice: hanggang sa maubos
  rationale: Ipinahahayag nito ang pagdating sa wakas ng pangkat nang hindi tahasang dinaragdagan ang Hebreo ng paraan ng kanilang pagkamatay.
- source_word: כָּל הַגּוֹי
  choice: ang buong bayan
  rationale: Kolektibong tinutukoy ng גּוֹי ang sambayanan o pangkat dito; nililinaw ng kasunod na parirala na ang tinutukoy ay ang mga lalaking mandirigma.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: mga lalaking mandirigma
  rationale: Pinananatili ang tahasang panlalaking pagtukoy at ang tungkuling militar ng parirala.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: hindi sila nakinig sa tinig ni Yahweh
  rationale: Pinananatili ang konkretong idyomang 'makinig sa tinig,' na sa konteksto ay may diwa rin ng pagsunod.
- source_word: נִשְׁבַּע ... לְבִלְתִּי הַרְאוֹתָם
  choice: Isinumpa ... na hindi niya sila hahayaang makita
  rationale: Natural na Tagalog ito para sa nilalaman ng sumpa at pinananatili ang causative na diwa ng Hebreong pandiwa.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: isang lupaing dinadaluyan ng gatas at pulot-pukyutan
  rationale: Pinananatili ang matingkad na tradisyonal na larawan ng kasaganaan sa Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Unang panauhang maramihan sa לָנוּ
  choice: sa atin
  alternative: sa kanila
  rationale: Ang Masoretic Text ay tahasang may unang panauhang maramihan. Hindi ito pinakinis tungo sa inaasahang ikatlong panauhan; inilagay sa talababa ang sinaunang alternatibo.
- issue: Diwa ng hindi pakikinig sa tinig ni Yahweh
  choice: hindi sila nakinig sa tinig ni Yahweh
  alternative: hindi nila sinunod si Yahweh
  rationale: Pinananatili ang Hebreong metapora at ang tensiyon sa pagitan ng literal na pakikinig at ipinahihiwatig na pagsunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sa ilang,' 'mga anak ni Israel,' at 'tinig ni Yahweh' upang mapanatili ang mahahalagang larawang Hebreo; inilagay ang [a] kaagad pagkatapos ng mismong variant na 'sa atin.'
