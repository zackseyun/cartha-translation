  naturalness: Likas ang karamihan ng wika. Mas idiomatiko ang “kumain sila ng ilan sa ani” kaysa “kinain nila ang ilan sa ani.” Ang “sa mismong araw na iyon” ay natural din at mas may diin.
  terminology: Ang “Paskuwa,” “tinapay na walang pampaalsa,” at “inihaw na butil” ay angkop sa modernong Filipino Tagalog. Hindi wasto ang “pinatuyong butil” bilang alternatibo para sa roasted/parched grain; ang “binusang butil” ay mas tumpak. Inilipat ang bawat talababa sa salitang tinutukoy nito.
