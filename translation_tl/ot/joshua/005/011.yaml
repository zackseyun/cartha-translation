translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'Paskuwa' bilang pamilyar na katawagang biblikal. Inilagay ang mga panandang talababa kasunod mismo ng 'inihaw na butil,' ayon sa mga alternatibong leksikal na tinutukoy ng mga ito.
