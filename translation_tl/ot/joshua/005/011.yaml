base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: tl
  text: 'At kumain sila ng ilan sa ani ng lupain[a] kinabukasan ng Paskuwa: tinapay na walang pampaalsa at inihaw na butil[b], sa mismong araw na iyon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa dating ani ng lupain.” Ang salitang Hebreo ay maaaring tumukoy sa ani o bunga ng lupain; nauunawaan ng ilan mula sa konteksto na ito ay nakaimbak na ani mula sa nakaraang anihan.
    reason: lexical_alternative
  - marker: b
    text: O “binusang butil.” Ang Hebreo ay tumutukoy sa butil na inihanda sa pamamagitan ng pag-iihaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: At kinain nila
  rationale: Pinananatili ang sunod-sunod na daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ang temporal na diwa.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: ang ilan sa ani ng lupain
  rationale: Ang עֲבוּר ay tumutukoy sa ani o bunga ng lupain. Likas sa Tagalog ang 'ang ilan sa ani' para katawanin ang partitive na מִן; hindi tahasang sinasabing luma o nakaimbak ang ani.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: kinabukasan ng Paskuwa
  rationale: Malinaw at likas na modernong Tagalog para sa araw na kasunod ng Paskuwa.
- source_word: מַצּוֹת
  choice: tinapay na walang pampaalsa
  rationale: Karaniwan at madaling maunawaang katumbas sa konteksto ng Paskuwa, at iniiwasang ipakahulugan lamang na patag ang tinapay.
- source_word: וְקָלוּי
  choice: at inihaw na butil
  rationale: Tumutukoy ang קָלוּי sa butil na inihanda sa pamamagitan ng pag-iihaw; mas malinaw ito sa kasalukuyang Tagalog kaysa sa isang teknikal o lumang katawagan.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: sa araw ding iyon
  rationale: Ipinahahayag ang diin sa eksaktong araw sa natural na salaysay na Tagalog; ang 'iyon' ay angkop sa retrospektibong pananaw ng salaysay bagaman 'ito' ang anyo ng Hebreo.
