revisions:
- from: At kinabukasan, nang makakain sila mula sa ani ng lupain, tumigil na ang manna.[a] Wala nang manna para sa mga anak ni Israel,[b] at nang taong iyon ay kumain sila mula sa ani ng lupain ng Canaan.
  to: Kinabukasan, matapos silang kumain mula sa ani ng lupain, tumigil ang manna.[a] Wala nang manna para sa mga anak ni Israel,[b] at noong taong iyon ay kumain sila mula sa ani ng lupain ng Canaan.
  rationale: Inayos ang dalawang anyong hindi natural sa Filipino at pinalitan ang talababa a upang tumpak nitong katawanin ang leksikal na alternatibong nasa Hebreo. Hindi binago ang kahulugan, pangalan, o antas ng literalidad ng talata.
