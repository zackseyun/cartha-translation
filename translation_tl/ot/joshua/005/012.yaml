base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: tl
  text: Kinabukasan, matapos silang kumain mula sa ani ng lupain, tumigil ang manna.[a] Wala nang manna para sa mga anak ni Israel,[b] at noong taong iyon ay kumain sila mula sa ani ng lupain ng Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring: “mula sa lumang ani ng lupain.” Maaaring mas tiyak na tumukoy ang Hebreong salita sa nakaimbak na ani mula sa ani ng nakaraang taon.'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga anak ni Israel”; maaari rin itong isaling “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: tumigil na
  rationale: Ang pandiwang שׁבת dito ay tumutukoy sa paghinto, hindi sa pangingilin ng Sabbath. Ang “tumigil na” ay natural at malinaw sa modernong Filipino.
- source_word: הַמָּן / מָן
  choice: ang manna / manna
  rationale: Pinanatili ang kinikilalang katawagang “manna” para sa pagkaing ibinigay sa ilang.
- source_word: מִמָּחֳרָת
  choice: kinabukasan
  rationale: Natural na temporal na salin ito para sa araw na kasunod ng pagkain na binanggit sa naunang talata.
- source_word: בְּאָכְלָם
  choice: nang makakain sila
  rationale: 'Ipinahahayag nito ang temporal na ugnayan at ang pagkakasunod: kumain muna sila mula sa ani ng lupain, saka tumigil ang manna.'
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: mula sa ani ng lupain
  rationale: Ang עֲבוּר ay tumutukoy sa ani o bunga ng lupain. Ang posibleng mas tiyak na kahulugang nakaimbak na ani mula sa nakaraang taon ay inilagay sa talababa.
- source_word: וְלֹא הָיָה עוֹד
  choice: Wala nang
  rationale: Maikli at natural na katumbas ng Hebreong eksistensiyal na pahayag na hindi na ito nagpatuloy.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Pinananatili nito ang pormal na larawan ng Hebreong “mga anak ni Israel,” habang nananatiling nauunawaan sa Filipino.
- source_word: וַיֹּאכְלוּ
  choice: at ... kumain sila
  rationale: Tuwirang inililipat ang payak na pagpapatuloy ng salaysay.
- source_word: מִתְּבוּאַת
  choice: mula sa ani
  rationale: Ang תְּבוּאָה ay tumutukoy sa ani o ibinubunga ng lupa. Natural ang “ani” sa kontekstong agrikultural.
- source_word: אֶרֶץ כְּנַעַן
  choice: lupain ng Canaan
  rationale: Pinananatili ang buong construct phrase sa Hebreo.
- source_word: בַּשָּׁנָה הַהִיא
  choice: nang taong iyon
  rationale: Natural na Filipino para sa temporal na pariralang “sa taong iyon.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “ani” para sa dalawang magkaugnay ngunit magkaibang Hebreong katawagan dahil iyon ang pinakanatural sa Filipino; pinanatili sa talababa ang leksikal at temporal na kalabuan.
