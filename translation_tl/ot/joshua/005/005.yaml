translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tuli na” at “hindi tinuli” bilang natural na pananalita, at iniwasang paliitin ang “bayan/mga tao” tungo sa “mga lalaki” kung hindi iyon tahasang sinasabi ng Hebreo.
