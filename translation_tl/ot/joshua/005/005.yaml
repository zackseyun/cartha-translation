  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: tl
  text: Sapagkat tuli na ang lahat ng taong lumabas, ngunit ang lahat ng ipinanganak sa ilang habang naglalakbay sila mula sa Ehipto ay hindi tinuli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na ayos: “ngunit ang lahat ng taong ipinanganak sa ilang, sa daan nang lumabas sila mula sa Ehipto, ay hindi tinuli.”'
    reason: Pinananatili nito ang mas mahigpit na ayos at ang bahagyang alanganing ugnayang pangpanahon ng pariralang Hebreo.
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag sa naunang talata; malinaw at marangal ang “Sapagkat” sa ganitong ugnayang pangdiskurso.
- source_word: מֻלִים הָיוּ
  choice: tuli na
  rationale: Ipinahihiwatig ng pandiwaring balintiyak na kasama ng הָיָה ang dati nang kalagayan ng mga lumabas; likas na ipinapahayag ito sa Tagalog sa pamamagitan ng “tuli na.”
- source_word: כָּל הָעָם
  choice: lahat ng taong
  rationale: Pinananatili ang kolektibong diwa ng עָם nang hindi isinasalin bilang “mga lalaki,” bagaman sa mga lalaki isinasagawa ang pagtutuli.
- source_word: הַיֹּצְאִים
  choice: lumabas
  rationale: Tumutukoy ang substantibong pandiwari sa salinlahing lumabas; maikli at natural ang “mga taong lumabas.”
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: ngunit ... ang lahat ng ipinanganak
  rationale: Ginawang “ngunit” ang pangatnig upang malinaw na maipakita ang tunay na paghahambing sa dalawang salinlahi.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay karaniwan at angkop na salin ng מִדְבָּר sa konteksto ng paglalakbay mula sa Ehipto.
- source_word: בַּדֶּרֶךְ בְּצֵאתָם מִמִּצְרַיִם
  choice: habang naglalakbay sila pagkalabas nila mula sa Ehipto
  rationale: Likas na Tagalog ito para sa paglalakbay na kaugnay ng kanilang paglabas mula sa Ehipto, samantalang inilalahad sa talababa ang mas pormal na ayos ng parirala.
- source_word: לֹא מָלוּ
  choice: hindi tinuli
  rationale: Bagaman aktibo ang anyong Hebreo, hindi binabanggit ang gumagawa; ang balintiyak na Tagalog ay likas at pinananatiling nakatuon ang pahayag sa mga hindi tinuli.
