revisions:
- from: Sapagkat tuli na ang lahat ng taong lumabas, ngunit hindi tinuli ang lahat ng ipinanganak sa ilang habang naglalakbay sila pagkalabas nila mula sa Ehipto.[a]
  to: Sapagkat tuli na ang lahat ng taong lumabas, ngunit ang lahat ng ipinanganak sa ilang habang naglalakbay sila mula sa Ehipto ay hindi tinuli.[a]
  rationale: Inayos ang saklaw ng pagkalatag ng pangungusap upang malinaw na ang lahat ng ipinanganak sa ilang ang hindi tinuli, hindi lamang na may ilan sa kanila na hindi tinuli. Pinagaan din ang pariralang pangpanahon nang hindi inaalis ang kaugnayan ng kapanganakan sa ilang at ng paglalakbay mula sa Ehipto.
