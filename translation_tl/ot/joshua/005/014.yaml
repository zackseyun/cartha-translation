  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: tl
  text: Sinabi niya[a], “Hindi; sa halip, naparito ako ngayon bilang pinuno ng hukbo ni Yahweh.” At nagpatirapa si Josue, na nakasubsob ang mukha sa lupa, at yumukod siya. At sinabi niya sa kanya[b], “Ano ang sinasabi ng panginoon ko sa kanyang lingkod?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Wala sa dalawa; naparito ako ngayon bilang pinuno ng hukbo ni Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo na isinaling “yumukod” ay maaari ring isaling “sumamba.” Pinanatili rito ang mismong kilos nang hindi ipinapasiya, batay lamang sa talatang ito, ang pagkakakilanlan ng tauhan o ang eksaktong uri ng pagpipitagan ni Josue.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא ... כִּי
  choice: Hindi; sa halip
  rationale: Tuwirang itinatanggi ang dalawang pagpipiliang ibinigay ni Josue sa naunang talata, saka itinatama ang batayan ng tanong. Ang “sa halip” ay natural na nagpapahayag ng puwersang pasalungat o mapagtuwid ng כִּי rito; ang “Wala sa dalawa” ay pinanatili sa talababa bilang posibleng pagpapalinaw.
- source_word: שַׂר צְבָא יְהוָה
  choice: pinuno ng hukbo ni Yahweh
  rationale: Sa kontekstong militar, malinaw at kasalukuyang Tagalog ang “pinuno.” Ipinananatili ng “hukbo” ang pangunahing kahulugan ng צְבָא, at ang pangalang יְהוָה ay isinasalin bilang “Yahweh.”
- source_word: עַתָּה בָאתִי
  choice: naparito ako ngayon
  rationale: Ang “naparito” ay natural na nagsasaad ng pagdating sa kinaroroonan ni Josue, samantalang pinananatili ng “ngayon” ang עַתָּה.
- source_word: וַיִּפֹּל ... אֶל פָּנָיו אַרְצָה
  choice: nagpatirapa si Josue, na nakasubsob ang mukha sa lupa
  rationale: Inilalarawan nito nang malinaw ang pagbagsak ni Josue na ang mukha ay nakaharap at nakadikit sa lupa, nang hindi tunog-salitang pagsasalin.
- source_word: וַיִּשְׁתָּחוּ
  choice: yumukod
  rationale: Maaaring tumukoy ang pandiwa sa pagyukod bilang pagpipitagan o sa pagsamba. Ang “yumukod” ay nagpapanatili sa nakikitang kilos nang hindi agad nagpapasiya sa eksaktong teolohikal na katangian nito.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Magalang na tawag ito ng isang nagpapakumbabang lingkod sa nakatataas. Maliit na titik ang ginamit upang hindi paunang kilalanin ang kausap bilang Diyos batay lamang sa talatang ito.
- source_word: מָה אֲדֹנִי מְדַבֵּר אֶל עַבְדּוֹ
  choice: Ano ang sinasabi ng panginoon ko sa kanyang lingkod?
  rationale: Pinananatili ng “sinasabi” ang nagpapatuloy na aspekto ng participle, at ng “kanyang lingkod” ang mapagpakumbabang pagtukoy ni Josue sa sarili.
theological_decisions:
- issue: Kung ang kilos ni Josue ay dapat tahasang isaling pagsamba
  choice: “yumukod” sa pangunahing teksto
  alternative: “sumamba”
  rationale: Maaaring mangahulugan ang שׁחה ng pagyukod bilang pagpipitagan o ng pagsamba. Hindi sapilitang nilulutas ng talatang ito lamang ang pagkakakilanlan ng tauhan o ang eksaktong uri ng kilos ni Josue, kaya pinananatili ang tensiyon at inilalagay ang ibang pagbasa sa talababa.
- issue: Kung dapat tukuyin ang pinuno bilang anghel, pagpapakita ng Diyos, o pagpapakita ni Cristo
  choice: Hindi siya tinukoy nang higit sa “pinuno ng hukbo ni Yahweh”
  alternative: Tahasan siyang tawaging anghel o banal na pagpapakita
  rationale: Titulo lamang ang tahasang ibinibigay ng Hebreo sa talatang ito. Iniiwasan ng salin ang pagpasok ng isang partikular na interpretasyong ontolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Josue,” ang karaniwang anyong Tagalog ng pangalan, at “Yahweh” para sa banal na pangalan. Iniwasan ang mas lumang “kawal” o “hukbo ng Panginoon” kung makalalabo sa pagkakaiba ng banal na pangalan at titulong “panginoon ko.”
