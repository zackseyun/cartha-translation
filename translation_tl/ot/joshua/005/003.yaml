  text: So Joshua made for himself flint knives and circumcised the sons of Israel at Gibeath-haaraloth[a][b][c].
translation:
  language: tl
  text: At gumawa si Josue para sa kanyang sarili ng mga kutsilyong yari sa batong pingkian[a] at tinuli niya ang mga anak na lalaki ng Israel[b] sa Burol ng mga Balat ng Ari[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga talim na batong pingkian.” Ang salitang Hebreo para sa kasangkapan ay madalas mangahulugang “tabak,” ngunit dito ay tumutukoy sa mga kasangkapang panghiwa na ginamit sa pagtutuli.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga anak na lalaki ng Israel”; maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, Gibeath-haaraloth, na nangangahulugang “Burol ng mga Balat ng Ari.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לּוֹ
  choice: gumawa si Josue para sa sarili niya
  rationale: Tuwirang ipinapahayag ng parirala ang paggawa o paghahanda ni Josue ng mga kasangkapan para sa sarili niyang paggamit; natural sa modernong Filipino ang ganitong ayos.
- source_word: חַרְבוֹת צֻרִים
  choice: mga kutsilyong batong pingkian
  rationale: Bagaman karaniwang nangangahulugang “mga tabak” ang חַרְבוֹת, sa konteksto ng pagtutuli ay mga kasangkapang panghiwa ang tinutukoy. Ang צֻרִים ay tumutukoy sa matigas na batong gaya ng flint; pinananatili ng “batong pingkian” ang materyal nang hindi ipinahihiwatig na metal ang mga kutsilyo.
- source_word: וַיָּמָל
  choice: tinuli niya
  rationale: Ang pandiwang מול ay tahasang nangangahulugang tumuli; ang aktibong anyo ay nagpapanatili kay Josue bilang simuno ng salaysay.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ng Israel
  rationale: Pinananatili nito ang tahasang panlalaking anyo ng Hebreo, na mahalaga rito dahil pagtutuli ang kilos; mas tiyak ito kaysa sa pangkalahatang “mga Israelita.”
- source_word: אֶל גִּבְעַת הָעֲרָלוֹת
  choice: sa Burol ng mga Balat ng Masama
  rationale: Sa konteksto, ang אֶל ay likas na isinasaling “sa” bilang pook ng pangyayari. Isinalin ang malinaw na kahulugan ng pangalang-pook upang maunawaan ng mambabasa, habang ibinibigay sa talababa ang transliterasyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinili ang “Josue,” ang karaniwang anyo ng pangalang biblikal sa Tagalog. Ang “balat ng masama” ay tuwiran ngunit hindi bulgar na katawagan sa foreskin; pinanatili ang kapansin-pansing kahulugan ng pangalang-pook.
