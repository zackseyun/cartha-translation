  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: tl
  text: At sampung bahagi ang napunta sa Manases[a], bukod sa lupain ng Gilead at Basan na nasa kabila ng Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sampung takdang bahagi ang napunta sa Manases” o “Sampung bahagi ang napunta kay Manases sa pamamagitan ng palabunutan.” Ginagamit sa Hebreo ang idyomang “nahulog” sa konteksto ng paghahati ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: ang napunta
  rationale: Sa konteksto ng paghahati ng lupain sa pamamagitan ng palabunutan, ang נפל ay literal na ‘nahulog’ ngunit idiomatikong nangangahulugang napunta o naitalaga. Ang ‘napunta’ ay natural sa modernong Tagalog at hindi labis na nagpapaliwanag sa mekanismo.
- source_word: חַבְלֵי
  choice: bahagi
  rationale: Ang חבל ay maaaring tumukoy sa panukat na lubid, nasasakupan, o bahaging inilaan. Ang ‘bahagi’ ay malinaw at hindi sobrang espesipiko.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: עֲשָׂרָה
  choice: sampung
  rationale: Tuwirang salin ng bilang na sampu, na panuring sa ‘bahagi.’
- source_word: לְבַד
  choice: bukod pa sa
  rationale: Ipinakikita nitong ang sampung bahagi ay hiwalay at dagdag sa lupain sa silangan ng Jordan; natural sa Tagalog ang ‘bukod pa sa.’
- source_word: מֵאֶרֶץ
  choice: lupain ng
  rationale: Kasama ng לְבַד, idiomatikong tinutukoy nito ang lupaing hindi kabilang sa sampung bahaging binanggit.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: Gilead at Basan
  rationale: Mga karaniwang anyo sa Tagalog ng mga pangalang pook.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: na nasa kabila ng Jordan
  rationale: Tumpak at natural na pahayag ng lokasyon; pinananatili nito ang perspektibong ‘kabila’ nang hindi tinutukoy kung silangan o kanluran.
