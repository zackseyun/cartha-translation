base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: tl
  text: Ang hangganan ng Manases ay mula sa Asher hanggang sa Micmetat, na nasa tapat ng Sicem[a]. Pagkatapos, ang hangganan ay nagtungo sa kanan[b], patungo sa mga naninirahan sa En-Tapua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasa harap ng Sicem” o “nakaharap sa Sicem.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa kanan.” Sa mga paglalarawan ng hangganan, maaari itong tumukoy sa direksiyong patimog.
    reason: lexical_alternative
  - marker: c
    text: Ang En-Tapua ay nangangahulugang “bukal ng Tapua.”
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: hangganan
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa guhit na nagtatakda sa sakop ng lupain, hindi sa buong teritoryo.
- source_word: מֵאָשֵׁר
  choice: mula sa Asher
  rationale: Ipinahihiwatig ng pang-ukol ang panimulang heograpikong sanggunian ng paglalarawan sa hangganan; pinananatiling pangalang pantangi ang Asher.
- source_word: הַמִּכְמְתָת
  choice: Micmetat
  rationale: Pangalan ito ng lugar, kaya isinalin sa pamamagitan ng transliterasyong angkop sa modernong Filipino.
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: na nasa tapat ng Sicem
  rationale: Pinananatili nito ang ugnayang heograpiko nang hindi ipinapalagay ang tiyak na direksiyong gaya ng silangan.
- source_word: וְהָלַךְ הַגְּבוּל
  choice: Mula roon, ang hangganan ay lumiko
  rationale: Sa paglalarawan ng mga hangganan, ang pandiwa ay tumutukoy sa naging takbo ng linya; natural sa Filipino ang 'lumiko' kasunod ng pahiwatig na pakanan.
- source_word: אֶל־הַיָּמִין
  choice: pakanan
  rationale: Ito ang tuwirang kahulugan ng Hebreo at pinananatili ang posibleng kalabuan; maaaring mangahulugan itong patimog sa sinaunang heograpikong oryentasyon.
- source_word: יֹשְׁבֵי
  choice: mga naninirahan sa
  rationale: Natural at malinaw itong katumbas ng participle na tumutukoy sa mga taong nakatira sa lugar.
- source_word: עֵין תַּפּוּחַ
  choice: En-Tapua
  rationale: Pangalan ito ng lugar kaya tinranslitera sa pangunahing teksto; inilagay sa talababa ang literal na kahulugan.
