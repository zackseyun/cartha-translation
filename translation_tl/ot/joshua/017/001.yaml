  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: tl
  text: Napunta sa lipi ni Manases ang bahaging itinakda sa pamamagitan ng palabunutan, sapagkat siya ang panganay ni Jose. Kay Makir—ang panganay ni Manases at ama ng Gilead[a]—napunta ang Gilead at Basan, sapagkat isa siyang mandirigma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ninuno ng Gilead” o “tagapagtatag ng Gilead.” Ang Hebreong “ama ng” ay maaaring tumukoy sa isang ninuno o tagapagtatag, hindi lamang sa mismong biyolohikal na ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: ang bahaging itinakda sa pamamagitan ng palabunutan ay napunta
  rationale: Ipinahahayag ng parirala ang kinalabasan ng palabunutan para sa lupaing mana. Nililinaw ng salin ang kahulugan ng גּוֹרָל sa kontekstong ito nang hindi ito ginagawang literal na bagay lamang.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: sa lipi ni Manases
  rationale: Ang מַטֶּה rito ay tumutukoy sa lipi bilang pangkat ng Israel, hindi sa literal na tungkod.
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: sapagkat siya ang panganay ni Jose
  rationale: Pinananatili ang paliwanag ng כִּי at ang pagtukoy ng panghalip kay Manases.
- source_word: לְמָכִיר
  choice: Kay Makir
  rationale: Ipinakikita ng kay ang tumanggap ng takdang lupain sa loob ng lipi ni Manases.
- source_word: בְּכוֹר מְנַשֶּׁה
  choice: ang panganay ni Manases
  rationale: Tuwirang pinananatili ang ugnayang genealogical at ang katayuan bilang panganay.
- source_word: אֲבִי הַגִּלְעָד
  choice: ama ng Gilead
  rationale: Pinananatili ang idyomang Hebreo; maaaring mangahulugan ang אָב ng ama, ninuno, o tagapagtatag, kaya nilagyan ng talababa.
- source_word: אִישׁ מִלְחָמָה
  choice: mandirigma
  rationale: Natural at marangal na makabagong Tagalog ito para sa isang lalaking bihasa o napatunayan sa pakikidigma.
- source_word: וַיְהִי לוֹ הַגִּלְעָד וְהַבָּשָׁן
  choice: napunta ang Gilead at Basan
  rationale: Sa konteksto ng mana, ipinahahayag nito na ang mga lupaing ito ay naging takdang pag-aari ni Makir.
