  text: וְ/לִ/צְלָפְחָד֩ בֶּן חֵ֨פֶר בֶּן גִּלְעָ֜ד בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֗ה לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: tl
  text: 'Si Zelofehad, anak ni Hefer, anak ni Gilead, anak ni Makir, anak ni Manases, ay walang mga anak na lalaki, kundi mga anak na babae lamang. Ito ang mga pangalan ng kanyang mga anak na babae: Mahla, Noa[a], Hogla, Milca, at Tirza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Noa rito ay anak na babae ni Zelofehad; iba siya kay Noe, ang lalaking binanggit sa Genesis.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: Si Zelofehad
  rationale: Ang וְלִפְלָפְחָד ay idyomatikong nagpapakilala sa kaso ni Zelofehad. Hindi dinagdagan ng tahasang temporal na “Ngayon,” sapagkat wala nito sa Hebreo.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: anak ni ... anak ni ... anak ni ... anak ni
  rationale: Pinanatili ang paulit-ulit na anyong pangangkanan ng Hebreo. Sa Tagalog, natural na magagamit ang “anak ni” sa bawat salinlahi nang hindi ipinapalagay na “inapo” lamang ang kahulugan.
- source_word: לֹא הָיוּ לוֹ בָּנִים
  choice: ay walang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng בָּנִים, hindi lahat ng anak, at mahalaga ang kaibahan sa mga anak na babae sa usapin ng mana.
- source_word: כִּי אִם בָּנוֹת
  choice: kundi mga anak na babae lamang
  rationale: 'Ipinapahayag ng כִּי אִם ang eksklusibong pagsalungat matapos ang pagtanggi: walang anak na lalaki, mga anak na babae lamang.'
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Ito ang mga pangalan ng kanyang mga anak na babae
  rationale: Natural na makabagong Tagalog para sa pormulang Hebreo na nagpapakilala ng talaan ng mga pangalan.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milca, at Tirza
  rationale: Isinalin sa mga anyong transliterasyong madaling basahin sa Filipino habang nananatiling malapit sa mga pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak na lalaki” at “anak na babae” upang malinaw na mapanatili ang kaibahang mahalaga sa konteksto ng mana. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
