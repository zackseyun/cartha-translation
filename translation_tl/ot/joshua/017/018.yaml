  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: tl
  text: Ngunit mapapasaiyo ang bulubundukin[a]; sapagkat kagubatan iyon, at puputulin mo ang mga puno roon, at mapapasaiyo ang buong lawak nito.[b] Sapagkat palalayasin mo ang mga Cananeo[c], kahit mayroon silang mga karwaheng bakal at kahit malalakas sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kabundukan” o “ang mataas na lupain.” Ang salitang Hebreo ay maaaring tumukoy sa isang bundok o sa isang maburol na rehiyon; dito, malamang na tinutukoy nito ang mataas na lupaing inilaan sa sambahayan ni Jose.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, maaari ring isalin na “ang mga dulo nito” o “ang mga panlabas na bahagi nito.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, pang-isahan ang “Cananeo ... mayroon siya ... malakas siya,” ngunit kolektibo itong tumutukoy sa mga Cananeo bilang isang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: ang bulubundukin
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa mataas at maburol na rehiyon, hindi lamang sa isang bundok.
- source_word: יִהְיֶה לָּךְ
  choice: mapapasaiyo
  rationale: Likas na ipinahahayag sa Filipino ang pag-aari o pagkakaloob ng lupain.
- source_word: יַעַר
  choice: kagubatan
  rationale: Tuwirang tumutukoy sa lupaing natatakpan ng mga puno.
- source_word: וּבֵרֵאתוֹ
  choice: lilinisin mo iyon
  rationale: Ang Piel na anyo ay tumutukoy sa paglilinis ng makahoy na lupain upang magamit o matirhan.
- source_word: תֹּצְאֹתָיו
  choice: hanggang sa mga hangganan nito
  rationale: Ipinahihiwatig ang buong lawak ng lupain hanggang sa mga panlabas na dulo nito, habang pinananatili sa talababa ang alternatibong mas literal.
- source_word: תוֹרִישׁ
  choice: palalayasin mo
  rationale: Ipinahahayag ang pagpapaalis sa mga Cananeo mula sa lupaing hawak nila; mas natural ito sa Filipino kaysa sa teknikal na 'aalisan ng pag-aari.'
- source_word: הַכְּנַעֲנִי
  choice: ang mga Cananeo
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo itong tumutukoy sa pangkat ng mga tao.
- source_word: רֶכֶב בַּרְזֶל
  choice: mga karwaheng bakal
  rationale: Malinaw at karaniwang salin ng mga karwaheng nilagyan o pinatibay ng bakal.
- source_word: חָזָק הוּא
  choice: malalakas sila
  rationale: Ang pang-isahang anyo sa Hebreo ay tumutukoy nang kolektibo sa mga Cananeo; ginawang maramihan para sa malinaw at natural na Filipino.
theological_decisions:
- issue: Kolektibong pang-isahan para sa mga Cananeo
  choice: 'Isinalin bilang maramihan: “ang mga Cananeo ... mayroon silang ... malalakas sila.”'
  alternative: 'Panatilihin ang pormal na pang-isahan: “ang Cananeo ... mayroon siya ... malakas siya.”'
  rationale: Karaniwang gumagamit ang Hebreo ng pang-isahang katawagan sa isang lahi bilang kolektibo. Mas malinaw sa makabagong Filipino ang maramihang anyo nang hindi binabago ang diwa.
- issue: Magkakaibang gamit ng כִּי sa talata
  choice: Isinalin ang unang gamit bilang panalungat na “Ngunit,” ang kasunod bilang sanhi na “sapagkat,” at ang mga huli bilang sanhi at pagpap concessive na “Sapagkat ... kahit ... at kahit.”
  alternative: Ulit-ulitin ang iisang katumbas na “sapagkat” sa lahat ng paglitaw.
  rationale: May iba’t ibang tungkuling pangdiskurso ang כִּי ayon sa konteksto; ang sari-saring salin ay nagpapanatili sa lohika ng pangungusap nang hindi pinapantay ang mga gamit nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mapapasaiyo” upang panatilihin ang diwa ng pagkakaloob at pag-aari, at “palalayasin” bilang natural na pagpapahayag ng pagpapaalis sa dating may hawak ng lupain. Inilagay ang lahat ng talababa sa mismong teksto sa ayos [a], [b], [c].
