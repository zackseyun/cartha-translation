base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: tl
  text: Pagkatapos, bumaba ang hangganan hanggang sa Batis ng Kana[a], sa timog ng batis. Ang mga lunsod na ito ay pag-aari ng Efraim, sa gitna ng mga lunsod ng Manases[b]. Ang hangganan naman ng Manases ay nasa hilagang panig ng batis, at nagtapos ito sa dagat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Wadi ng Kana.” Ang salitang Hebreo na נחל ay maaaring tumukoy sa batis, bangin, o daluyan ng tubig na pana-panahon lamang may agos.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, may mga lunsod na pag-aari ng Efraim na nasa loob ng lupaing inilaan sa Manases.
    reason: cultural_note
  - marker: c
    text: Ang “dagat” dito ay ang Dagat Mediteraneo.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: Pagkatapos, bumaba
  rationale: Sa paglalarawan ng mga hangganan, ang ירד ay tumutukoy sa pagbaba o pagpapatuloy ng guhit ng hangganan. Likas sa modernong Tagalog ang “bumaba,” at ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod.
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Ang גבול dito ay ang guhit na nagtatakda sa sakop ng lupain; “hangganan” ang malinaw at karaniwang salin.
- source_word: נַחַל קָנָה
  choice: Batis ng Kana
  rationale: Ang נחל ay maaaring batis, bangin, o daluyan ng tubig na pana-panahon lamang may agos. Ginamit ang “Batis” bilang madaling maunawaang katawagan, habang nililinaw sa talababa ang mas malawak na kahulugan.
- source_word: נֶגְבָּה לַנַּחַל
  choice: sa timog ng batis
  rationale: Ang נֶגְבָּה ay nagsasaad ng timog o panig na timog. Sa konteksto ng hangganan, pinakamaayos itong unawain bilang lokasyon sa timog ng batis, nang hindi tinutukoy kung tumatakbo mismo sa tabi nito ang hangganan.
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: Ang mga lunsod na ito ay sa Efraim
  rationale: Ang sugnay na walang tahasang pandiwa ay nagpapahayag ng pag-aari o pagkakatalaga. Pinananatili ng “ay sa Efraim” ang maikli at tuwirang anyo ng Hebreo.
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: bagaman nasa gitna ng mga lunsod ng Manases
  rationale: 'Ang בְּתוֹךְ ay nagsasaad ng pagkakalagay sa loob o gitna. Idinagdag ang “bagaman” upang malinaw at likas na maipakita ang kaibhan: ang mga lunsod ay sa Efraim ngunit nasa sakop na kaugnay ng Manases.'
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: Ang hangganan naman ng Manases ay nasa hilagang panig ng batis
  rationale: Ang מִצְּפוֹן ay tumutukoy sa lokasyon sa hilaga. Ang “hilagang panig” ay malinaw at angkop sa paglalarawan ng hangganan.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: at nagtapos ito sa dagat
  rationale: Sa mga pormula ng hangganan, ang תֹצְאוֹת ay tumutukoy sa dulo o labasan ng hangganan. Ang “nagtapos ito” ay natural sa Tagalog; ang dagat ay tinutukoy sa talababa bilang Mediteraneo.
