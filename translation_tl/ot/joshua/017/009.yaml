revisions:
- from: Pagkatapos, bumaba ang hangganan patungo sa Batis ng Kana[a], sa timog ng batis. Ang mga lunsod na ito ay sa Efraim, bagaman nasa gitna ng mga lunsod ng Manases[b]. Ang hangganan naman ng Manases ay nasa hilagang panig ng batis, at nagtapos ito sa dagat[c].
  to: Pagkatapos, bumaba ang hangganan hanggang sa Batis ng Kana[a], sa timog ng batis. Ang mga lunsod na ito ay pag-aari ng Efraim, sa gitna ng mga lunsod ng Manases[b]. Ang hangganan naman ng Manases ay nasa hilagang panig ng batis, at nagtapos ito sa dagat[c].
  rationale: Inalis ang “bagaman” upang hindi magdagdag ng ugnayang pasalungat na wala sa pinagmulan. Pinalitan ang “patungo sa” ng “hanggang sa” upang mas maayos na katawanin ang pagdating ng hangganan sa pinangalanang batis. Nilinaw ang pag-aari ng mga lunsod sa pamamagitan ng “pag-aari ng Efraim,” habang pinanatili ang lokasyong “sa gitna ng mga lunsod ng Manases.”
