translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lunsod” at “hangganan” para sa dignified biblical register, at pinanatili ang mga pangalang Kana, Efraim, at Manases sa karaniwang anyong Tagalog. Inayos ang mahahabang sugnay bilang tatlong pangungusap para sa linaw nang hindi binabago ang ugnayang heograpiko.
