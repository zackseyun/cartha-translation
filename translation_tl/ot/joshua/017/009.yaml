  naturalness: Marangal at malinaw ang pangkalahatang Tagalog. Mas natural at tiyak ang “hanggang sa” kaysa “patungo sa” para sa pagdating ng guhit ng hangganan, at ang pag-aalis ng “bagaman” ay nagpapadaloy sa pangungusap nang hindi nagdaragdag ng interpretasyon.
  terminology: Ang “hangganan,” “Batis ng Kana,” “Efraim,” “Manases,” at “Dagat Mediteraneo” ay angkop at magkakatugma. Ang “mga lunsod” ay nararapat sa rehistrong biblikal.
