base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: tl
  text: Ngunit hindi nagawang paalisin ng mga inapo ni Manases ang mga naninirahan sa mga lungsod na ito, at nagpumilit ang mga Cananeo na manatili sa lupaing ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nagpasiyang manirahan sa lupaing ito ang Cananeo.” Isahan at kolektibo ang katawagang Hebreo, at ang pandiwa ay maaaring magpahiwatig ng pagkukusa o matibay na pagpapasiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: hindi nagawang
  rationale: Tuwirang ipinapahayag ang kawalan ng kakayahan, hindi lamang ang kawalan ng pagnanais.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: mga lipi ni Manases
  rationale: Ang literal na “mga anak ni Manases” ay tumutukoy rito sa pangkat ng tribo; mas malinaw at natural sa makabagong Filipino ang “mga lipi ni Manases.”
- source_word: לְהוֹרִישׁ אֶת הֶעָרִים הָאֵלֶּה
  choice: paalisin ... ang mga naninirahan sa mga lungsod na ito
  rationale: Sa konteksto ng pananakop, ang Hiphil ng ירש ay nangangahulugang magtaboy o mag-alis sa dating naninirahan. Ginawang hayag sa Filipino ang metonimikong layon na “mga lungsod” upang maiwasan ang di-likas na “paalisin ang mga lungsod.”
- source_word: וַיּוֹאֶל
  choice: nagpumilit
  rationale: Ipinahihiwatig nito ang kusang-loob at matibay na hangaring magpatuloy, nang hindi lubusang nilulutas ang saklaw sa pagitan ng pagnanais at determinasyon.
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Bagaman nasa anyong isahan sa Hebreo, kolektibong tumutukoy ito sa pangkat etniko; natural sa Filipino ang maramihan.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: na manatili sa lupaing iyon
  rationale: Ang ישב ay tumutukoy sa patuloy na paninirahan, at ang אֶרֶץ ay ang teritoryong tinatalakay. Ginamit ang “iyon” sapagkat ang lupain ay tinukoy sa naunang parirala bilang lokasyon ng mga lungsod.
theological_decisions:
- issue: Antas ng pananagutan sa hindi pagpapaalis
  choice: Pinanatili ang tahasang kawalan ng kakayahan ng mga lipi ni Manases at ang matibay na pananatili ng mga Cananeo.
  alternative: Ipahiwatig na ayaw lamang paalisin ng Manases ang mga Cananeo o na simpleng nanatili lamang ang mga Cananeo.
  rationale: Hindi dapat gawing kawalan ng kalooban ang יכל, ni alisin ang diwa ng pagkukusa o determinasyon sa יאל.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lipi ni Manases” para sa kolektibong tribo at ginawang hayag ang mga naninirahan bilang metonimikong layon ng pagpapaalis.
