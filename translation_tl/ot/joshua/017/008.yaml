base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/008.yaml
  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: tl
  text: Ang lupain ng Tapuah ay nauukol sa Manases[a], ngunit ang Tapuah na nasa hangganan ng Manases ay nauukol sa mga anak ni Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na pagkakasalin: “Para sa Manases ang lupain ng Tapuah; ngunit ang Tapuah sa hangganan ng Manases ay para sa mga anak ni Efraim.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִמְנַשֶּׁה הָיְתָה
  choice: ay nauukol sa Manases
  rationale: Ang לְ kasama ng הָיְתָה ay nagpapahayag ng pag-aari o pagkakabahagi. Likas sa Filipino ang “nauukol sa” sa konteksto ng paghahati ng lupain, habang pinananatili ng talababa ang mas pormal na ayos.
- source_word: אֶרֶץ
  choice: lupain
  rationale: Tumutukoy ito sa teritoryong inilaan, kaya mas angkop ang “lupain” kaysa “bansa.”
- source_word: תַּפּוּחַ
  choice: Tapuah
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyong angkop sa baybay ng Filipino.
- source_word: וְתַפּוּחַ
  choice: ngunit ang bayang Tapuah
  rationale: Bagaman karaniwang “at” ang וְ, malinaw na may paghahambing dito sa lupain at sa mismong lugar na Tapuah. Idinagdag ang “bayang” upang likas na maipakita ang ipinahihiwatig na kaibhan nang hindi binabago ang pangalan.
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: na nasa hangganan ng Manases
  rationale: Sa paglalarawan ng hangganan, ang אֶל ay may diwang lokatibo o malapit sa hangganan. Ang “nasa hangganan” ay malinaw at natural sa Filipino.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: ay nauukol sa mga anak ni Efraim
  rationale: Pinananatili ng “mga anak ni Efraim” ang Hebreong katawagang pangangkan at ang pagkakakilanlan ng lipi, sa halip na gawing mas interpretibong “mga Efraimita.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nauukol sa” para sa pagmamay-ari o pagkakabahagi ng teritoryo; pinanatili sa talababa ang mas pormal at mas malapit-sa-anyo na “para sa.”
