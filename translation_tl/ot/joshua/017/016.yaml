  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יוֹסֵ֔ף לֹֽא יִמָּ֥צֵא לָ֖/נוּ הָ/הָ֑ר וְ/רֶ֣כֶב בַּרְזֶ֗ל בְּ/כָל הַֽ/כְּנַעֲנִי֙ הַ/יֹּשֵׁ֣ב בְּ/אֶֽרֶץ הָ/עֵ֔מֶק לַֽ/אֲשֶׁ֤ר בְּ/בֵית שְׁאָן֙ וּ/בְנוֹתֶ֔י/הָ וְ/לַֽ/אֲשֶׁ֖ר בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: tl
  text: Sinabi ng mga anak ni Jose, “Hindi sapat sa amin ang lupaing maburol[a], at may mga karwaheng bakal[b] ang lahat ng Cananeong naninirahan sa lupaing lambak—kapwa ang mga nasa Bet-sean at mga bayang sakop nito[c], at ang mga nasa Lambak ng Jezreel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “hindi masumpungan para sa amin ang bundok/lupaing maburol”; sa konteksto, ang diwa ay hindi sapat para sa mga lipi ni Jose ang lupaing maburol.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga karwahe ng bakal,” malamang ay mga karwaheng pandigmang ginamitan o nilagyan ng bakal.
    reason: lexical_alternative
  - marker: c
    text: Ang literal na “mga anak na babae nito” ay tumutukoy sa mas maliliit na bayang nakaugnay at nasasakupan ng pangunahing lungsod.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: mga anak ni Jose
  rationale: Pinananatili nito ang anyong Hebreo habang natural na tumutukoy sa mga liping nagmula kay Jose.
- source_word: הָהָר
  choice: lupaing maburol
  rationale: Sa kontekstong pangheograpiya, tumutukoy ito sa mataas at maburol na rehiyong inilaan sa mga lipi ni Jose, hindi lamang sa isang bundok.
- source_word: לֹא יִמָּצֵא לָנוּ
  choice: Hindi sapat sa amin
  rationale: Bagaman literal na maaaring sabihing ‘hindi masumpungan para sa amin,’ ipinahihiwatig ng gamit ng Niphal na מצא kasama ng לְ at ng konteksto na hindi kasya o sapat ang lupa para sa kanila.
- source_word: רֶכֶב בַּרְזֶל
  choice: mga karwaheng bakal
  rationale: Malapit ito sa maikling pariralang Hebreo at likas na katawagan sa mga karwaheng pandigma na ginamitan o nilagyan ng bakal, nang hindi pinalalabis na buong-buo silang yari sa bakal.
- source_word: הַכְּנַעֲנִי
  choice: lahat ng Cananeo
  rationale: Isahan ang anyong Hebreo ngunit kolektibo ang kahulugan; ang ‘lahat ng Cananeo’ ay malinaw at natural sa Filipino.
- source_word: הַיֹּשֵׁב
  choice: naninirahan
  rationale: Ang pang-isahang participle ay umaayon sa kolektibong pangngalan; sa Filipino, maayos itong isinasalin bilang panuring sa buong pangkat.
- source_word: אֶרֶץ הָעֵמֶק
  choice: lupaing lambak
  rationale: Pinananatili nito ang pagkakaiba ng mababang lupain sa naunang lupaing maburol nang hindi ginagawang mas teknikal kaysa sa Hebreo.
- source_word: בְּבֵית שְׁאָן
  choice: nasa Bet-sean
  rationale: Ginamit ang malinaw na transliterasyong Filipino ng pangalang Hebreo.
- source_word: וּבְנוֹתֶיהָ
  choice: mga bayang sakop nito
  rationale: Ang literal na ‘mga anak na babae nito’ ay idyomang Hebreo para sa mas maliliit na pamayanang nakaugnay at nasasakupan ng isang pangunahing lungsod.
- source_word: עֵמֶק יִזְרְעֶאל
  choice: Lambak ng Jezreel
  rationale: Tuwirang ipinapahayag nito ang heograpikong pangalang nasa Hebreo.
- source_word: בְּכָל
  choice: may ... ang lahat
  rationale: Natural nitong ipinahahayag sa Filipino na ang pagkakaroon ng mga karwaheng bakal ay katangian ng buong populasyong Cananeo sa mababang lupain.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “lupaing maburol” at “lupaing lambak” upang malinaw ang heograpikong paghahambing. Ang “mga bayang sakop nito” ay inuuna ang pagkaunawa ng karaniwang mambabasa, habang inilalagay sa talababa ang orihinal na talinghagang Hebreo.
