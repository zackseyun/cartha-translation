  - severity: low
    issue: Idinagdag ng “ang bahagi ... ay itinakda” ang hayagang konseptong wala sa mismong Hebreong pahayag.
    rationale: Bagaman ang paglalaan ng lupain ang konteksto, ang talata ay literal na nagpapakilala ng mga tatanggap at kanilang mga angkan. Hindi kailangang dagdagan ang pandiwang “itinakda” upang maging malinaw sa Tagalog.
