  source_fidelity: Ang “iba pang” ay hindi sapat na tumpak para sa הַנּוֹתָרִים, na nangangahulugang “nalalabi/natitira.” Dagdag pa, ang “ang bahagi ... ay itinakda” ay nagpapasok ng mga salitang wala sa talata, kahit na kaugnay ito ng mas malawak na konteksto ng paghahati ng lupain. Mas maingat na panatilihin ang eliptikong pormula ng Hebreo bilang paglalaan “para sa” mga nalalabing linya.
  naturalness: Natural at malinaw ang pangkalahatang talaang Tagalog. Ang binagong simula ay mas maikli, mas natural, at mas malapit sa pormula ng pinagmulan. Ang paulit-ulit na “para sa mga anak ni” ay angkop sa pormal na estilo ng talaan.
  terminology: Ang “angkan” para sa mishpachah at “mga lalaking inapo” para sa male descendants ay angkop. Pinananatili ang mga pangalan sa anyong madaling basahin sa Filipino at ang genealogical na “Manases, anak ni Jose.”
