base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: tl
  text: At para sa mga nalalabing anak ni Manases[a], ayon sa kani-kanilang angkan:[b] para sa mga anak ni Abiezer, para sa mga anak ni Helek, para sa mga anak ni Asriel, para sa mga anak ni Shekem, para sa mga anak ni Hefer, at para sa mga anak ni Semida. Ang mga ito ang mga lalaking inapo[c] ni Manases, anak ni Jose, ayon sa kani-kanilang angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “ang nalalabing mga anak ni Manases”; sa ganitong talaangkanan, ang “mga anak” ay maaari ring tumukoy sa mga inapo o mga linya ng angkan.
    reason: lexical_alternative
  - marker: b
    text: Ang “angkan” ay salin ng Hebreong mishpachah, isang kinikilalang pangkat ng magkakamag-anak sa loob ng isang lipi; maaari rin itong isaling “pamilya.”
    reason: cultural_note
  - marker: c
    text: Binibigyang-diin ng Hebreo na ang mga ito ang mga lalaking linya ni Manases, bilang kaibahan sa mga anak na babae ni Zelofehad na binanggit sa nakapaligid na salaysay.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: At ang bahagi para sa iba pang mga anak ni Manases ay itinakda
  rationale: Ang Hebreong pormula ay nagpapakilala sa paglalaan para sa natitirang mga linya ni Manases. Ginawang likas sa Tagalog ang eliptikong pahayag sa pamamagitan ng “ang bahagi” at “itinakda,” na malinaw mula sa konteksto ng paghahati ng lupain.
- source_word: הַנּוֹתָרִים
  choice: iba pang
  rationale: Sa konteksto, tumutukoy ito sa nalalabing mga linya ni Manases bukod sa kasong tinalakay sa naunang talata. Mas likas sa kasalukuyang Tagalog ang “iba pang” kaysa “mga nalalabi.”
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה rito ay isang pangkat ng magkakamag-anak sa loob ng lipi; mas tiyak ang “angkan” kaysa sa modernong kahulugan ng “pamilya.”
- source_word: לִבְנֵי אֲבִיעֶזֶר ... וְלִבְנֵי שְׁמִידָע
  choice: para sa mga anak ni Abiezer ... at sa mga anak ni Semida
  rationale: Pinanatili ang paulit-ulit na pormulang “mga anak ni” upang maipakita ang legal at talaang anyo ng Hebreo, bagaman ang tinutukoy ay mga linya ng angkan.
- source_word: אַשְׂרִיאֵל / שֶׁכֶם / חֵפֶר / שְׁמִידָע
  choice: Asriel / Shekem / Hefer / Semida
  rationale: Gumamit ng tuwirang transliterasyong madaling basahin sa modernong Filipino at malapit sa mga katinig ng Hebreo.
- source_word: הַזְּכָרִים
  choice: mga lalaking inapo
  rationale: Ipinahahayag nito na ang nakalistang mga linya ay panlalaki, bilang kaibahan sa mga anak na babae ni Zelofehad sa kalapit na salaysay. Iniiwasan ng “lalaking inapo” ang alanganing pag-uulit na “mga lalaking anak.”
- source_word: בְּנֵי מְנַשֶּׁה בֶּן יוֹסֵף
  choice: mga ... inapo ni Manases na anak ni Jose
  rationale: 'Pinananatili ang ugnayang genealogical: ang mga nakalista ay nagmula kay Manases, at si Manases ang anak ni Jose.'
theological_decisions:
- issue: Pagbibigay-diin sa mga lalaking linya ng angkan
  choice: mga lalaking inapo
  alternative: mga anak na lalaki
  rationale: Malinaw na pinananatili ang kaibahang kasarian sa הַזְּכָרִים nang hindi ipinapalagay na ang lahat ng nakalista ay tuwirang mga anak ni Manases.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paulit-ulit na estruktura ng talaan, habang nilinaw sa natural na Tagalog ang eliptikong pormula ng paglalaan sa simula ng talata.
