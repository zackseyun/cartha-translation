revisions:
- from: At ang bahagi para sa iba pang mga anak ni Manases[a] ay itinakda ayon sa kani-kanilang angkan:[b] para sa mga anak ni Abiezer, sa mga anak ni Helek, sa mga anak ni Asriel, sa mga anak ni Shekem, sa mga anak ni Hefer, at sa mga anak ni Semida. Ang mga ito ang mga lalaking inapo[c] ni Manases na anak ni Jose, ayon sa kani-kanilang angkan.
  to: At para sa mga nalalabing anak ni Manases[a], ayon sa kani-kanilang angkan:[b] para sa mga anak ni Abiezer, para sa mga anak ni Helek, para sa mga anak ni Asriel, para sa mga anak ni Shekem, para sa mga anak ni Hefer, at para sa mga anak ni Semida. Ang mga ito ang mga lalaking inapo[c] ni Manases, anak ni Jose, ayon sa kani-kanilang angkan.
