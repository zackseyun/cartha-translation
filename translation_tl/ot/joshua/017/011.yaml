  text: וַ/יְהִ֨י לִ/מְנַשֶּׁ֜ה בְּ/יִשָּׂשכָ֣ר וּ/בְ/אָשֵׁ֗ר בֵּית שְׁאָ֣ן וּ֠/בְנוֹתֶי/הָ וְ/יִבְלְעָ֨ם וּ/בְנוֹתֶ֜י/הָ וְֽ/אֶת יֹשְׁבֵ֧י דֹ֣אר וּ/בְנוֹתֶ֗י/הָ וְ/יֹשְׁבֵ֤י עֵֽין דֹּר֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֤י תַעְנַךְ֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֥י מְגִדּ֖וֹ וּ/בְנוֹתֶ֑י/הָ שְׁלֹ֖שֶׁת הַ/נָּֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: tl
  text: 'May bahagi ang Manases sa mga lupain ng Isacar at Aser: ang Bet-sean at ang mga bayang sakop nito[a], ang Ibleam at ang mga bayang sakop nito, ang mga naninirahan sa Dor at ang mga bayang sakop nito, ang mga naninirahan sa En-dor at ang mga bayang sakop nito, ang mga naninirahan sa Taanac at ang mga bayang sakop nito, at ang mga naninirahan sa Megido at ang mga bayang sakop nito—ang tatlong pook.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak na babae nito,” isang idyomang Hebreo para sa maliliit na bayan o pamayanang nakadepende sa pangunahing bayan.
    reason: cultural_note
  - marker: b
    text: Mahirap tiyakin ang kahulugan ng pariralang Hebreo. Maaari rin itong isaling “ang tatlong rehiyon,” “ang tatlong distrito,” o “ang tatlong matataas na lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: May mga pag-aari ang Manases
  rationale: Ang idyomang ויהי ל ay nagpapahayag ng pag-aari o pagkakabilang sa bahaging inilaan sa isang lipi. Likas sa Tagalog ang “may mga pag-aari” at angkop ito sa kasunod na talaan ng mga lugar.
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: sa loob ng Isacar at Aser
  rationale: Ipinahihiwatig ng ב na ang mga pag-aari ng Manases ay nasa teritoryo ng dalawang ibang lipi; nililinaw ito ng “sa loob ng.”
- source_word: בֵּית שְׁאָן
  choice: Bet-sean
  rationale: Transliterasyong angkop sa tunog ng Hebreo at sa ortograpiyang Filipino.
- source_word: בְנוֹתֶיהָ
  choice: mga bayang sakop nito
  rationale: Literal itong “mga anak na babae nito,” isang idyomang Hebreo para sa maliliit at nakadependeng pamayanan sa paligid ng pangunahing bayan. Inihahatid ng “mga bayang sakop nito” ang ugnayang iyon nang natural sa Tagalog.
- source_word: יִבְלְעָם
  choice: Ibleam
  rationale: Transliterasyon ng pangalan ng lugar ayon sa anyong Hebreo.
- source_word: יֹשְׁבֵי
  choice: mga naninirahan sa
  rationale: Pinananatili ang tahasang pagtukoy ng tekstong Hebreo sa mga naninirahan, sa halip na tahimik na gawing pangalan lamang ng bayan ang parirala.
- source_word: עֵין דֹּר
  choice: En-dor
  rationale: Transliterasyong nagpapanatili sa tambalang anyo ng pangalan.
- source_word: תַעְנַךְ
  choice: Taanac
  rationale: Transliterasyong nababagay sa ortograpiyang Filipino.
- source_word: מְגִדּוֹ
  choice: Megido
  rationale: Transliterasyong nababagay sa ortograpiyang Filipino.
- source_word: שְׁלֹשֶׁת הַנָּפֶת
  choice: ang tatlong nasasakupan
  rationale: Malabo ang eksaktong diwa ng נפת dito. Ang “nasasakupan” ay maaaring tumukoy sa heograpiko o administratibong pagpapangkat nang hindi labis na tinutukoy ang uri nito; inilalahad sa talababa ang iba pang posibilidad.
