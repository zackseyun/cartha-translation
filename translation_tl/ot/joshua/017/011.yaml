translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinanatili ang di-pantay na anyo ng talaan—mga pangalan ng bayan sa unang bahagi at “mga naninirahan” sa kasunod—dahil gayon ang Hebreo. Ang mga pangalan ng lugar ay isina-Filipinong transliterasyon.
