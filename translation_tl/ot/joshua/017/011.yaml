revisions:
- from: 'May mga pag-aari ang Manases sa loob ng Isacar at Aser: ang Bet-sean at ang mga bayang sakop nito[a], ang Ibleam at ang mga bayang sakop nito, ang mga naninirahan sa Dor at ang mga bayang sakop nito, ang mga naninirahan sa En-dor at ang mga bayang sakop nito, ang mga naninirahan sa Taanac at ang mga bayang sakop nito, at ang mga naninirahan sa Megido at ang mga bayang sakop nito—ang tatlong nasasakupan.[b]'
  to: 'May bahagi ang Manases sa mga lupain ng Isacar at Aser: ang Bet-sean at ang mga bayang sakop nito[a], ang Ibleam at ang mga bayang sakop nito, ang mga naninirahan sa Dor at ang mga bayang sakop nito, ang mga naninirahan sa En-dor at ang mga bayang sakop nito, ang mga naninirahan sa Taanac at ang mga bayang sakop nito, at ang mga naninirahan sa Megido at ang mga bayang sakop nito—ang tatlong pook.[b]'
  rationale: Pinalitan ang pananalitang tumutukoy sa ari-arian ng isang salitang nagpapahayag ng bahaging teritoryal ng Manases sa loob ng mga lupain ng Isacar at Aser. Pinalitan din ang “nasasakupan” ng mas neutral na “pook” upang hindi magpasya sa pagitan ng mga heograpiko at administratibong pagbasa ng mahirap na pangwakas na parirala. Napanatili ang lahat ng elemento ng talaan, ang di-pantay na sintaks ng Hebreo, at ang mga footnote anchor.
