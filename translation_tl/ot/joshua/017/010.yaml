translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng karaniwang bokabularyong heograpiko. Pinanatili ang maikli at paralelong estilo ng talaan ng mga hangganan, ngunit nilinaw ang eliptikong unang sugnay sa pamamagitan ng “ang lupain.”
