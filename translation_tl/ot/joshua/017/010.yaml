base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: tl
  text: Sa timog, ang lupain ay para sa Efraim, at sa hilaga naman ay para sa Manases. Ang dagat ang hangganan nito. Sa hilaga, umabot sila sa Aser, at sa silangan, sa Isacar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sa hilaga, humangga sila sa Aser, at sa silangan, sa Isacar.” Sa mga paglalarawan ng teritoryo, ang pandiwang Hebreo ay maaaring mangahulugang “umabot,” “dumikit,” o “humangga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם
  choice: Sa timog, ang lupain ay para sa Efraim
  rationale: Ang directional form na נֶגְבָּה ay tumutukoy sa timog na panig, at ang לְ ay nagpapahiwatig ng pagkakatalaga ng lupain. Idinagdag ang “ang lupain” upang maging malinaw sa natural na Tagalog ang eliptikong Hebreo.
- source_word: וְצָפוֹנָה לִמְנַשֶּׁה
  choice: at sa hilaga naman ay para sa Manases
  rationale: Pinananatili ang paralelismo sa unang sugnay; ang “naman” ay natural na naghahayag ng pagtutumbas o pag-iiba ng dalawang panig.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: Ang dagat ang hangganan nito
  rationale: Tuwirang ipinapahayag na ang dagat ang nagsilbing hangganan ng teritoryong tinutukoy. Ang “hangganan” ay karaniwang salitang Filipino para sa גְּבוּל sa kontekstong heograpiko.
- source_word: וּבְאָשֵׁר יִפְגְּעוּן
  choice: umabot sila sa Aser
  rationale: Sa mga paglalarawan ng hangganan, ang פגע ay maaaring mangahulugang umabot, dumikit, o humanggan sa isang teritoryo. Ang “umabot” ay malinaw at natural habang pinananatili ang pangmaramihang anyo ng pandiwa.
- source_word: מִצָּפוֹן ... מִמִּזְרָח
  choice: Sa hilaga ... sa silangan
  rationale: Sa pormulang ito ng hangganan, ipinakikita ng mga parirala ang panig ng pagkakadugtong ng mga teritoryo, hindi kinakailangang galaw mula sa isang direksiyon.
- source_word: וּבְיִשָּׂשכָר
  choice: at sa silangan, sa Isacar
  rationale: Ang pandiwang “umabot sila” mula sa naunang sugnay ay nauunawaan ding saklaw nito, gaya ng elipsis sa Hebreo.
