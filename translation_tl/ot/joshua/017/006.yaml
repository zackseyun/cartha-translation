base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: tl
  text: Sapagkat ang mga anak na babae ni Manases ay tumanggap ng mana kasama ng kanyang mga anak na lalaki,[a] at ang lupain ng Gilead ay napunta sa natitirang mga anak na lalaki ni Manases.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa gitna ng kanyang mga anak na lalaki.”
    reason: Pinananatili ng tala ang mas literal na anyo at ang tahasang paghahambing ng mga anak na babae at mga anak na lalaki.
  - marker: b
    text: O “ang lupain ng Gilead ay para sa natitirang mga anak na lalaki ni Manases.”
    reason: Ibinibigay ang mas literal na alternatibo para sa pariralang nagsasaad ng pagmamay-ari o pagkakaloob ng bahagi.
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagpapaliwanag sa naunang kaayusan ng paghahati ng lupain.
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: ang mga anak na babae ni Manases
  rationale: Tahasang pinananatili ang kasarian dahil inihahambing sila sa mga anak na lalaki sa usapin ng mana.
- source_word: נָחֲלוּ נַחֲלָה
  choice: tumanggap ng mana
  rationale: Natural sa modernong Tagalog at malinaw na nagpapahayag ng pagtanggap ng minanang bahagi, nang hindi ginagaya ang di-likas na pag-uulit ng pandiwa at pangngalan sa Hebreo.
- source_word: בְּתוֹךְ בָּנָיו
  choice: kasama ng kanyang mga anak na lalaki
  rationale: Ang בְּתוֹךְ ay nangangahulugang nasa gitna o kasama ng isang pangkat; pinananatili ng 'mga anak na lalaki' ang tahasang kaibahan sa mga anak na babae. Ang 'kanyang' ay tumutukoy kay Manases.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: at ang lupain ng Gilead
  rationale: Tuwiran, pormal, at natural na salin ng pariralang tumutukoy sa teritoryo.
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: ay napunta sa iba pang mga anak na lalaki ni Manases
  rationale: Ipinahahayag nito ang kinalabasan ng paghahati ng mana. Ang 'iba pang' ay tumutukoy sa mga anak na lalaking naiiba sa mga anak na babaeng tumanggap din ng bahagi.
theological_decisions:
- issue: Pagkakaiba ng mga anak na babae at mga anak na lalaki sa pamana
  choice: Pinanatili nang tahasan ang parehong katawagan at ang paglahok ng mga anak na babae sa mana.
  alternative: Gamitin ang pangkalahatang 'mga anak' at alisin ang pagkakaiba ng kasarian.
  rationale: Mahalaga sa legal at salaysay na konteksto ang tahasang pagkakaiba sa tekstong Hebreo; hindi ito dapat palabuin o bigyan ng dagdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang biblikal na anyong “Manases” at ang natural na pariralang “tumanggap ng mana.” Iniwasan ang arkaikong pananalita at pinanatili ang legal na kaibahan ng mga anak na babae at lalaki.
