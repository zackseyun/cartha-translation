source:
  edition: WLC
  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: tl
  text: Kaya lumapit sila sa harap ni Eleazar na pari, sa harap ni Josue na anak ni Nun, at sa harap ng mga pinuno. Sinabi nila, “Iniutos ni Yahweh kay Moises na bigyan kami ng mana kasama ng aming mga kapatid na lalaki.” Kaya binigyan niya sila, ayon sa utos ni Yahweh[a], ng mana kasama ng mga kapatid na lalaki ng kanilang ama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ayon sa bibig ni Yahweh,” isang idyomang nangangahulugang ayon sa kaniyang utos.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid na lalaki ng kanilang ama” ay tumutukoy sa angkan nila sa panig ng ama, na sa loob nito ibinigay ang kanilang bahagi sa lupain.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: lumapit sila
  rationale: Ang Qal wayyiqtol na 3fp ay tumutukoy sa mga anak na babae ni Zelofehad; natural sa Tagalog ang “lumapit sila” at nananatili ang diwa ng pormal na pagharap.
- source_word: לִפְנֵי
  choice: sa harap ni/ng
  rationale: Ang tatlong pag-uulit ay nagpapakita ng pormal at pampublikong pagharap sa mga awtoridad; pinagsama sa natural na pangungusap sa Tagalog nang hindi inaalis ang tatlong kinauukulan.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Karaniwang katumbas ng כֹּהֵן; malinaw na inilalarawan ang katungkulan ni Eleazar.
- source_word: הַנְּשִׂיאִים
  choice: mga pinuno
  rationale: Tumutukoy sa mga pinuno ng mga lipi o pamayanan; mas malinaw sa modernong Tagalog kaysa “mga prinsipe.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: צִוָּה אֶת־מֹשֶׁה
  choice: iniutos ni Yahweh kay Moises
  rationale: Pinananatili ang lakas ng pandiwang צוה bilang tahasang pag-uutos.
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: bigyan kami ng mana
  rationale: Sa Josue, ang נַחֲלָה ay ang minanang bahagi ng lupain; maikli at likas ang “mana” sa Tagalog.
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: kasama ng aming mga kapatid na lalaki
  rationale: Pinananatili ang panlalaking tiyak na kahulugan ng אַחֵינוּ at ang legal na konteksto ng paghingi ng bahagi sa lupain sa loob ng angkan.
- source_word: וַיִּתֵּן
  choice: binigyan niya sila
  rationale: Pinananatili ang isahang simuno ng Hebreo; malamang na si Josue ang gumaganap, ngunit hindi ito tahasang pinapangalanan sa salin.
- source_word: אֶל־פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Likas na salin ng idyomang literal na “ayon sa bibig ni Yahweh,” na nagpapahayag ng banal na kapahintulutan o utos.
- source_word: אֲחֵי אֲבִיהֶן
  choice: mga kapatid na lalaki ng kanilang ama
  rationale: Pinananatili ang tiyak na ugnayang pampamilya ng Hebreo at hindi ito pinapantay lamang sa pangkalahatang “mga kamag-anak.”
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili nito bilang pangalan sa halip na gawing titulo.
- issue: Kasariang ipinahihiwatig ng אַחֵינוּ
  choice: aming mga kapatid na lalaki
  alternative: aming mga kapatid; aming mga kamag-anak
  rationale: Sa kontekstong legal, ang mga babaeng anak ay humihingi ng bahagi sa loob ng nakagawiang pamana ng mga lalaking kaangkan; pinananatili ng salin ang espesipikong pananalita ng pinagmulan.
- issue: Tiyak na saklaw ng אֲחֵי אֲבִיהֶן
  choice: mga kapatid na lalaki ng kanilang ama
  alternative: mga tiyuhin nila sa ama; mga kamag-anak ng kanilang ama
  rationale: Literal at tiyak ang Hebreo, bagaman sa praktikal na konteksto ay tumutukoy ito sa kanilang angkan sa panig ng ama.
- issue: Di-tahasang simuno ng וַיִּתֵּן
  choice: binigyan niya sila
  alternative: binigyan sila ni Josue
  rationale: Isahan ang pandiwa ngunit hindi tahasang pinapangalanan ang simuno; pinananatili ng panghalip ang bahagyang kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling unawaing himig. Ginamit ang “Josue,” ang nakaugaliang anyong Tagalog ng Joshua, at pinanatili ang legal at pampamilyang katiyakan ng talata nang hindi nilulutas ang di-tahasang pagkakakilanlan ng simuno ng “binigyan.”
