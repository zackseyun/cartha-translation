  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: tl
  text: Sinabi ni Josue sa sambahayan ni Jose—sa Efraim at Manases—“Marami kayong tao[a], at malaki ang lakas ninyo. Hindi lamang iisang bahaging mana[b] ang mapapasainyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Isa kayong dakilang bayan.” Ang pariralang Hebreo ay maaaring tumukoy sa dami o sa kadakilaan; sa konteksto ng paghahati ng lupain, mas malamang na dami ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “palabunot.” Sa aklat ng Josue, madalas itong tumukoy sa bahaging mana na itinalaga sa pamamagitan ng palabunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: sambahayan ni Jose
  rationale: Pinananatili nito ang pampamilya at pantribong idyoma ng Hebreo, habang likas pa ring nauunawaan sa makabagong Tagalog.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: sa Efraim at Manases
  rationale: Tinutukoy ng parirala kung sino ang saklaw ng “sambahayan ni Jose”; pinananatili ang dalawang pangalan bilang paliwanag na nakasingit.
- source_word: עַם רַב
  choice: Marami kayong tao
  rationale: Sa konteksto ng paghahati ng lupain, malamang na bilang ng populasyon ang diin ng רַב, hindi katayuan o karangalan.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: at malaki ang inyong lakas
  rationale: Malapit ito sa anyong Hebreo na nag-uukol ng malaking lakas o kakayahan sa sambahayan ni Jose, at natural sa marangal na Tagalog.
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: Hindi lamang iisang bahagi ang mapapasainyo
  rationale: Sa Josue, ang גּוֹרָל ay madalas tumutukoy sa bahaging mana na itinalaga sa pamamagitan ng palabunutan. Ipinahihiwatig ng konteksto na hindi sila lilimitahan sa isa lamang.
- source_word: לֵאמֹר
  choice: Sinabi
  rationale: Ang pormulang Hebreo na literal na “sinabi ... na sinasabi” ay likas na ipinapahayag sa Tagalog sa pamamagitan ng isang pandiwang pambungad sa tuwirang pananalita.
