  to: Sinabi sa kanila ni Josue, “Kung marami kayo, umakyat kayo sa kagubatan at maghawan kayo roon para sa inyong sarili sa lupain ng mga Perezeo at mga Refaim, sapagkat masikip para sa inyo ang kaburulan ng Efraim.”
