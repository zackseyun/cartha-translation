base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: tl
  text: Sinabi sa kanila ni Josue, “Kung marami kayo, umakyat kayo sa kagubatan at maghawan kayo roon para sa inyong sarili sa lupain ng mga Perezeo at mga Refaim, sapagkat masikip para sa inyo ang kaburulan ng Efraim.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַם רַב
  choice: marami nga kayo
  rationale: Ipinahahayag ng parirala ang dami ng sambayanan. Likas sa modernong Tagalog ang “marami kayo,” at pinananatili ng “nga” ang diwa ng kondisyong tumutugon sa kanilang pahayag na marami sila.
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: umahon kayo sa kagubatan
  rationale: Ang עֲלֵה ay pag-ahon o pagpunta sa mataas na lugar, at ang הַיַּעְרָה ay may direksiyonal na diwang patungo sa kagubatan. Ginamit ang maramihang “kayo” ayon sa kolektibong kausap sa Tagalog.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: maglinis doon ng lupa para sa inyong sarili
  rationale: Ang Piel na ברא rito ay tumutukoy sa paghawan o paglilinis ng makahoy na lupain. Nilinaw ng “ng lupa” ang ipinahiwatig na layon, at tinumbasan ng “para sa inyong sarili” ang benefaktibong לְךָ.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: sa lupain ng mga Perezeo at mga Refaim
  rationale: Pinanatili bilang mga pangalan ng pangkat ang dalawang katawagan. Ang “Refaim” ay transliterasyon upang hindi agad ipakahulugan ang katawagang maaaring etniko o heograpiko rito.
- source_word: כִּי אָץ לְךָ
  choice: sapagkat napakasikip para sa inyo
  rationale: Ang אָץ ay naghahatid ng diwa ng pagkakakipot o kakulangan ng espasyo. Ang “napakasikip para sa inyo” ay malinaw at likas sa Tagalog sa konteksto ng lupaing hindi sapat sa kanilang dami.
- source_word: הַר אֶפְרָיִם
  choice: kaburulan ng Efraim
  rationale: Sa kontekstong teritoryal, ang הַר ay tumutukoy sa mataas at maburol na rehiyon, hindi kinakailangang sa isang bundok lamang. Ang “kaburulan” ay maikli at heograpikong angkop.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “Josue,” “Perezeo,” at “Efraim” bilang karaniwang anyong Tagalog ng mga pangalang biblikal, samantalang pinanatili ang “Refaim” upang maiwasan ang interpretibong salin. Ang mga panghalip na maramihan ay natural na tumutugma sa kolektibong sambayanang kinakausap, kahit isahan ang anyong gramatikal sa Hebreo.
