base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: tl
  text: 'Nagsalita ang mga anak ni Jose kay Josue: “Bakit isang kapalaran at isang bahagi ng lupain[a] lamang ang ibinigay mo sa akin bilang mana, gayong isa akong bayang maraming tao, yamang pinagpala ako ni Yahweh hanggang ngayon?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang sakop” o “isang teritoryo.” Ang salitang Hebreo ay maaaring tumukoy sa isang sinusukat na bahagi ng lupain, gaya ng bahaging itinakda sa pamamagitan ng panukat na lubid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ בְּנֵי יוֹסֵף
  choice: At nagsalita ang mga anak ni Jose
  rationale: Pinananatili ang karaniwang panimulang salaysay at ang tuwirang katawagang pantribo na “mga anak ni Jose,” bagaman tumutukoy ito sa mga liping nagmula sa kanya.
- source_word: אֶת יְהוֹשֻׁעַ לֵאמֹר
  choice: kay Josue. Sinabi nila,
  rationale: Isinasalin nang natural sa Tagalog ang dobleng pormula ng pagpapakilala sa pagsasalita, nang hindi inuulit ang alanganing “nagsalita ... na sinasabi.”
- source_word: נָתַתָּה לִּי נַחֲלָה
  choice: ibinigay mo sa akin bilang mana
  rationale: Ang נַחֲלָה sa konteksto ng Josue ay lupaing minana o inilaan; pinananatili rin ang isahang “akin” sapagkat nagsasalita ang pangkat bilang isang kabuuan.
- source_word: גּוֹרָל אֶחָד
  choice: iisang palabunutan
  rationale: Ang גּוֹרָל ay tumutukoy sa lot o bahaging itinakda sa pamamagitan ng palabunutan. Ang “palabunutan” ay malinaw sa konteksto ng paghahati ng lupain.
- source_word: וְחֶבֶל אֶחָד
  choice: at iisang bahagi ng lupain[a]
  rationale: Ang חֶבֶל ay maaaring tumukoy sa sinusukat na bahagi, sakop, o teritoryo. Ang “bahagi ng lupain” ay natural at malinaw, samantalang inilalagay sa talababa ang saklaw ng salitang Hebreo.
- source_word: וַאֲנִי עַם רָב
  choice: gayong isa akong bayang napakarami
  rationale: Pinananatili ang kapansin-pansing pang-isahang tinig ng kolektibong bayan at ang diwa ng malaking bilang, sa halip na katayuan o kadakilaan.
- source_word: עַד אֲשֶׁר עַד כֹּה בֵּרְכַנִי
  choice: yamang pinagpala ako ... hanggang ngayon
  rationale: Pinananatili ang sanhi at ang temporal na diwa ng masinsing pariralang Hebreo, nang hindi ito ginagawang “lubhang pinagpala” lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang banal na pangalan; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kolektibong pang-isahang pananalita ng mga lipi ni Jose
  choice: “sa akin” at “isa akong bayan”
  alternative: “sa amin” at “kami ay napakarami”
  rationale: Bagaman mas karaniwan sa Tagalog ang maramihan, mahalaga sa anyo ng Hebreo ang pagharap ng pangkat bilang iisang kolektibong persona. Pinananatili ito upang hindi mapawi ang tensiyon sa gramatika.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinili ang “Josue” bilang nakasanayang anyong Filipino ng pangalan. Inilipat ang talababa sa “bahagi ng lupain,” ang salitang talagang nililinaw nito. Sadyang pinanatili ang kolektibong pang-isahang “akin/ako” ng Hebreo, kahit bahagyang di-karaniwan sa Tagalog.
