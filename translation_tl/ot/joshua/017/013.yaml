  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: tl
  text: At nang lumakas ang mga anak ni Israel[a], sapilitang pinagtrabaho nila ang mga Cananeo[b], ngunit hindi nila lubusang pinalayas ang mga ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isinailalim nila sa sapilitang paglilingkod ang mga Cananeo” o “pinatawan nila ng tributo ang mga Cananeo.”
    reason: lexical_alternative
  - marker: c
    text: 'Binibigyang-diin ng anyong Hebreo ang pandiwa: “hindi nila lubusan o ganap na pinalayas ang mga ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: At nang
  rationale: Ang konstruksiyong Hebreo ay nagbubukas ng isang bagong pangyayari at inilalahad ang kalagayan nito. Ang “At nang” ay natural sa makabagong Filipino at napapanatili ang daloy ng salaysay nang hindi gumagamit ng mabigat na “At nangyari na nang.”
- source_word: חָזְקוּ
  choice: lumakas
  rationale: Ipinahihiwatig ng pandiwa ang pagkakaroon o paglago ng lakas at kapangyarihan; malinaw na naihahatid ito ng “lumakas.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na pananalitang pampamilya sa Hebreo, na ginagamit din bilang pambansang katawagan.
- source_word: וַיִּתְּנוּ אֶת הַכְּנַעֲנִי לָמַס
  choice: sapilitang pinagtrabaho nila ang mga Cananeo
  rationale: Sa kontekstong ito, ang מַס ay tumutukoy sa sapilitang paggawa o paglilingkod. Ginawang maramihan sa Filipino ang kolektibong isahan na “Cananeo” sa Hebreo upang maging natural at upang tumugma ang kasunod na panghalip.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: ngunit hindi nila lubusang pinalayas ang mga ito
  rationale: Ang pawatas na ganap na kasunod ng pandiwang may takdang anyo ay nagbibigay-diin sa kilos; ipinahahayag ito ng “lubusang.” Ang “pinalayas” ay malinaw sa konteksto ng pagpapaalis sa lupain.
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng napiling anyo ang pampamilyang larawan ng tekstong Hebreo nang hindi ikinakaila na isa rin itong karaniwang katawagan sa sambayanang Israel.
- issue: Kahulugan ng מַס
  choice: sapilitang pinagtrabaho
  alternative: pinatawan ng tributo
  rationale: Mas malamang sa konteksto ang sapilitang paggawa, ngunit tunay na maaaring saklawin ng salitang Hebreo ang sapilitang paglilingkod o tributo; kaya inilalahad ang alternatibo sa talababa.
- issue: Diin ng הוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: hindi ... lubusang pinalayas
  alternative: tiyak na hindi nila pinalayas
  rationale: Ang pagkakaugnay ng pawatas na ganap at ng pandiwang may takdang anyo ay nagpapalakas sa pahayag. Sa kontekstong ito, ang “lubusang” ang pinakanatural na pagpapahayag ng diing iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang arkaikong “nagkagayon” at ang teknikal na “corvée,” habang pinanatili sa talababa ang tunay na lawak ng kahulugan ng מַס. Ginamit ang “mga Cananeo” bilang natural na kolektibong katawagan sa Filipino.
