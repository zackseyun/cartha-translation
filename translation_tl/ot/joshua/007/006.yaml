  source_fidelity: Tumpak sa kabuuan ang kilos ni Josue, ang pagpapatirapa sa harap ng kaban ni Yahweh hanggang gabi, ang pakikilahok ng mga matatanda ng Israel, at ang paglalagay ng alikabok sa ulo. Gayunman, ang “matatandang pinuno” ay nagpapasok ng paliwanag na wala sa mismong teksto; sapat at mas malapit ang “matatanda ng Israel.”
  naturalness: Natural at marangal ang karamihan ng salin. Ang “nagpatirapa sa lupa” ay maaaring linawin nang bahagya upang maipakita ang “sa kanyang mukha” ng Hebreo, at mas karaniwan ang “alikabok” kaysa “alabok” sa modernong Filipino.
  terminology: Ang “Josue,” “kaban ni Yahweh,” at “matatanda ng Israel” ay angkop. Pinananatili ng “Yahweh” ang personal na pangalan sa Hebreo. Hindi kailangan ang interpretibong dagdag na “pinuno.”
