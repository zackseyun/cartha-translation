    rationale: Ang זִקְנֵי יִשְׂרָאֵל ay literal na “matatanda ng Israel.” Bagaman madalas silang mga pinuno, hindi ito kailangang idagdag sa pangunahing teksto.
  - severity: low
    issue: Hindi ganap na naipahahayag ang “sa kanyang mukha”
    rationale: Ang “nagpatirapa sa lupa” ay malapit, ngunit ang pagbanggit na nakasubsob ang mukha ay mas malinaw na kumakatawan sa עַל־פָּנָיו.
  - severity: low
    issue: “Alabok” sa halip na mas karaniwang “alikabok”
    rationale: Mas natural at mas malaganap sa modernong Filipino ang “alikabok,” nang hindi nagbabago ang kahulugan.
