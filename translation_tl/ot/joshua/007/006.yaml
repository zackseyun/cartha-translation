  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: tl
  text: Pagkatapos, pinunit ni Josue ang kanyang mga damit at nagpatirapa siya, nakasubsob ang mukha sa lupa, sa harap ng kaban ni Yahweh hanggang gabi—siya at ang matatanda ng Israel. Naglagay sila ng alikabok sa kanilang mga ulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang paglalagay ng alikabok sa ulo ay nakaugaliang tanda ng pagdadalamhati, pagpapakumbaba, o pagluluksa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע ... שִׂמְלֹתָיו
  choice: pinunit ... ang kanyang mga damit
  rationale: Tuwirang inilalarawan ng קרע ang pagpunit ng kasuotan bilang tanda ng matinding dalamhati; natural sa modernong Filipino ang “pinunit ang kanyang mga damit.”
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: nagpatirapa sa lupa
  rationale: Ang parirala ay tumutukoy sa pagbagsak nang nakasubsob ang mukha. Ang “nagpatirapa sa lupa” ay malinaw, marangal, at likas sa Filipino.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: sa harap ng kaban ni Yahweh
  rationale: Pinananatili ng “sa harap” ang diwa ng לִפְנֵי, ng “kaban” ang אֲרוֹן, at ng “Yahweh” ang personal na pangalang יְהוָה.
- source_word: עַד הָעֶרֶב
  choice: hanggang gabi
  rationale: Payak at natural na katumbas ng temporal na parirala.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: kasama ang matatandang pinuno ng Israel
  rationale: Ipinahihiwatig ng pariralang appositional na kasama ni Josue ang mga זְקֵנִים. Idinagdag ang “pinuno” upang luminaw na mga nakatatandang tagapanguna ang tinutukoy, hindi lamang matatanda sa edad.
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: Naglagay sila ng alabok sa kanilang mga ulo
  rationale: Ipinapahayag nito nang natural ang ritwal na kilos ng pagluluksa o pagpapakumbaba nang hindi ginagawang mas marahas kaysa sa hinihingi ng Hebreo.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo; pinananatili ng transliterasyong “Yahweh” ang pagkakaiba nito sa isang titulo.
- issue: Saklaw ng pariralang “siya at ang matatanda ng Israel”
  choice: Iniuugnay ang mga matatanda sa pagpapatirapa/pananatili hanggang gabi
  alternative: Iugnay lamang sila sa paglalagay ng alabok
  rationale: Ang הוּא וְזִקְנֵי יִשְׂרָאֵל ay kasunod ng “hanggang gabi” at pinakamalamang na nagsasaad na kasama ni Josue ang matatanda sa pagharap sa kaban, samantalang tahasang pangmaramihan ang sumunod na kilos. Hindi ipinahihiwatig na sila rin ang pumunit sa damit ni Josue.
translation_notes:
  register: Modernong Filipino na may marangal at madaling maunawaang himig. Ginamit ang “Josue,” ang karaniwang anyong Filipino ng pangalan, at “matatandang pinuno” upang maiwasang mapagkamalang edad lamang ang tinutukoy ng זִקְנֵי.
