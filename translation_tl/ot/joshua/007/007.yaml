  naturalness: Marangal ngunit makabagong Tagalog ang kabuuan. Natural ang “Ay,” “bakit mo pa,” at “Kung pumayag na lamang sana.” Ang pagdaragdag ng “kami” sa ikalawang pandiwa ay nagpapalinaw sa sintaks nang hindi nagpapabigat sa daloy.
  terminology: Ang “Panginoong Yahweh” ay angkop na katumbas ng אֲדֹנָי יְהוִה at pinananatili ang banal na pangalan. Ang “bayang ito,” “mga Amoreo,” at ang idyomang “sa kamay” ay tapat at nauunawaan sa Filipino. Ang talababa ay angkop at wastong nakaangkla sa [a].
