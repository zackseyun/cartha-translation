id: JOS.7.7
reference: Joshua 7:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: tl
  text: At sinabi ni Josue, “Ay, Panginoong Yahweh[a], bakit mo pa pinatawid ang bayang ito sa Jordan? Upang ibigay kami sa kamay ng mga Amoreo at lipulin kami? Kung pumayag na lamang sana kaming manatili sa ibayo ng Jordan!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, “Adonai YHWH”: ang “Adonai” ay “Panginoon,” at ang YHWH ay ang banal na pangalang isinaling “Yahweh.”'
    reason: Nililinaw ang tambalang banal na tawag at ang pagpapahayag sa personal na pangalan ng Diyos.
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ay
  rationale: Isang biglaang daing ng dalamhati at pagkabalisa; natural at tuwiran sa makabagong Tagalog.
- source_word: אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  rationale: 'Pinananatili ang dalawang sangkap ng Hebreong tawag: ang titulong Adonai at ang personal na pangalang YHWH.'
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: bakit mo pa pinatawid
  rationale: Ang pandiwang causative at infinitive absolute ay nagbibigay-diin sa pagtawid; ipinahahayag ng “pa” ang mapait at mariing tanong nang natural sa Tagalog.
- source_word: אֶת־הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang עָם ay tumutukoy sa sambayanan bilang isang kolektibong bayan, hindi lamang sa magkakahiwalay na mga tao.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: ibigay kami sa kamay ng mga Amoreo
  rationale: Pinananatili ang Hebreong metapora ng pagbibigay sa kamay, ibig sabihin ay pagpapasailalim sa kapangyarihan ng kaaway.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo itong tumutukoy sa pangkat ng mga Amoreo.
- source_word: לְהַאֲבִידֵנוּ
  choice: lipulin
  rationale: Tuwiran at mabigat na salitang nagsasaad ng lubos na pagpuksa, angkop sa panganib na ipinaghihinagpis ni Josue.
- source_word: וְלוּ הוֹאַלְנוּ
  choice: Kung pumayag na lamang sana kami
  rationale: Ipinakikita ang isang hangaring salungat sa nangyari at pinananatili ang diwa ng kusang pagsang-ayon, nang hindi ipinapasok ang ideya ng pagiging nasisiyahan.
- source_word: וַנֵּשֶׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: manatili sa ibayo ng Jordan
  rationale: Sa loob ng pangungusap na naghahayag ng panghihinayang, natural na ipinakikita ng “manatili” ang hindi sana pagtuloy mula sa dating kinaroroonan sa silangan ng Jordan.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalan sa אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIOS; Panginoon kong Yahweh
  rationale: Ang “Yahweh” ay hayagang kumakatawan sa tetragrammaton at iniiwasang pag-isahin ang personal na pangalan at ang titulong Adonai. Hindi idinaragdag ang “kong” sapagkat walang tahasang unang-panauhang hulapi sa anyong nasa talata.
- issue: Ang tanong ni Josue tungkol sa layunin ng Diyos
  choice: Pinanatili bilang matinding tanong at daing
  alternative: Gawing mahinahong kahilingan para sa paliwanag
  rationale: 'Hindi nilulutas o pinapahinahon ng salin ang teolohikal na tensiyon: sa pagkatalo, tahasang itinatanong ni Josue kung pinatawid sila upang ibigay sa kaaway at lipulin.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Josue,” “Jordan,” at “mga Amoreo” bilang malinaw at pamilyar na anyo ng mga pangalan. Pinanatili ang emosyonal na tindi ng panaghoy at ang Hebreong larawang “sa kamay,” ngunit inayos ang sintaks upang maging natural na bigkas sa Tagalog.
