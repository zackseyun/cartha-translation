base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: tl
  text: Pagkatapos, iniharap niya ang angkan ni Juda, at natukoy ang angkan ng mga Zerahita. Iniharap naman niya ang angkan ng mga Zerahita, isa-isa ang mga lalaki[a], at natukoy si Zabdi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa mga lalaki.” Malamang na ang ibig sabihin ay isa-isang iniharap ang mga lalaki ng angkan ng mga Zerahita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: iniharap niya
  rationale: Ang Hiphil ng קרב ay nangangahulugang maglapit o magharap. Sa prosesong ito ng pagtukoy, mas natural sa modernong Tagalog ang “iniharap” kaysa sa literal na “inilapit.”
- source_word: מִשְׁפַּחַת
  choice: angkan
  rationale: Tumutukoy ito sa pangkat ng magkakamag-anak sa loob ng isang lipi. Ang “angkan” ang likas at angkop na katumbas sa Tagalog.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog na tradisyong biblikal.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: natukoy
  rationale: Bagaman ang ugat ay maaaring mangahulugang “hulihin,” sa kontekstong ito tumutukoy ito sa pagkakakilanlan sa proseso ng pagpili. Iniiwasan ng “natukoy” ang maling impresyon na dinakip sila sa labanan, habang pinananatili ang diwa ng pasibong resulta.
- source_word: הַזַּרְחִי
  choice: mga Zerahita
  rationale: Anyong gentiliko ito para sa mga inapo o angkan ni Zerah. Ang “mga Zerahita” ay maikli at natural sa Tagalog.
- source_word: לַגְּבָרִים
  choice: isa-isang lalaki
  rationale: Literal itong “sa/ayon sa mga lalaki,” ngunit sa konteksto ay nagpapahiwatig ng paghaharap sa mga indibidwal na lalaki. Ang “isa-isang lalaki” ay malinaw at natural, habang nilalagyan ng talababa ang literal na anyo.
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Transliterasyon ng pangalang pantangi sa Hebreo.
