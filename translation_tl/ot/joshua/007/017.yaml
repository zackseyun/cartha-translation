translation_notes:
  register: Gumamit ng natural, marangal, at madaling maunawaang modernong Tagalog. Pinanatili ang sunod-sunod na proseso ng paghaharap at pagtukoy, nang hindi ipinapalagay ang tiyak na mekanismo ng pagpili.
