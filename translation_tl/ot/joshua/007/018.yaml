translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘sambahayan’ para sa yunit ng pamilya at ‘nabunot’ upang natural na ipahayag ang pagtukoy sa pamamagitan ng palabunutan.
