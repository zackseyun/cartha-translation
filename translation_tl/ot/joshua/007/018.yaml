revisions:
- from: Pagkatapos, iniharap niya ang sambahayan nito nang isa-isang lalaki[a], at nabunot si Acan na anak ni Carmi, na anak ni Zabdi, na anak ni Zera, mula sa lipi ni Juda.
  to: Pagkatapos, iniharap niya ang sambahayan ni Zera, isa-isa, bilang mga lalaki[a], at natukoy si Acan na anak ni Carmi, na anak ni Zabdi, na anak ni Zera, mula sa lipi ni Juda.
  rationale: Pinalitan ang pandiwang “nabunot” ng “natukoy” upang hindi gawing mas tiyak kaysa sa Hebreo ang paraan ng pagpili. Nilinaw ang reperensiya ng “kanyang sambahayan” bilang sambahayan ni Zera, ayon sa agarang konteksto, at inayos ang parirala ukol sa mga lalaki upang maging mas natural sa modernong Tagalog habang nananatili ang alternatibong pagbasa sa talababa.
