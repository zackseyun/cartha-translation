base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: tl
  text: Pagkatapos, iniharap niya ang sambahayan ni Zera, isa-isa, bilang mga lalaki[a], at natukoy si Acan na anak ni Carmi, na anak ni Zabdi, na anak ni Zera, mula sa lipi ni Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa mga lalaki.” Maikli ang pariralang Hebreo at maaaring tumukoy sa pagharap sa sambahayan ayon sa mga pangkat ng kalalakihan para sa palabunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: iniharap niya
  rationale: Ang Hifil ng קרב ay ‘ilapit’ o ‘iharap.’ Sa konteksto ng pagtukoy sa pamamagitan ng palabunutan, natural at malinaw sa Tagalog ang ‘iniharap.’
- source_word: בֵּיתוֹ
  choice: ang sambahayan nito
  rationale: Ang בַּיִת ay maaaring tumukoy sa bahay, pamilya, o sambahayan. Dito, ang yunit ng pamilya ang inihaharap, kaya ‘sambahayan’ ang angkop.
- source_word: לַגְּבָרִים
  choice: nang isa-isang lalaki
  rationale: Maikli at maaaring bigyang-kahulugan sa higit sa isang paraan ang pariralang Hebreo. Malamang na inilalarawan nito ang pagharap sa mga indibiduwal na lalaki sa loob ng sambahayan; pinananatili sa talababa ang alternatibong pagbasa.
- source_word: וַיִּלָּכֵד
  choice: nabunot
  rationale: Literal na ‘nahuli/nakuha’ ang Niphal ng לכד, ngunit sa konteksto ng pagtukoy sa pamamagitan ng palabunutan, malinaw at natural ang ‘nabunot’ habang pinananatili ang prosesong ipinahihiwatig ng salaysay.
- source_word: עָכָן
  choice: Acan
  rationale: Isinalin sa karaniwang anyong Tagalog ang pangalang pantangi.
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: anak ni Carmi, na anak ni Zabdi, na anak ni Zera
  rationale: Buong pinanatili ang magkakasunod na talaangkanan sa natural na anyong Tagalog.
- source_word: לְמַטֵּה יְהוּדָה
  choice: mula sa lipi ni Juda
  rationale: Sa kontekstong panlipi, ang מַטֶּה ay nangangahulugang ‘lipi.’ Malinaw na ipinapahayag ng parirala ang kaugnayan ni Acan sa lipi ni Juda.
