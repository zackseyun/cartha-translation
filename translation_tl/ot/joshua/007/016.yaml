  text: וַ/יַּשְׁכֵּ֤ם יְהוֹשֻׁ֨עַ֙ בַּ/בֹּ֔קֶר וַ/יַּקְרֵ֥ב אֶת יִשְׂרָאֵ֖ל לִ/שְׁבָטָ֑י/ו וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: tl
  text: Maagang bumangon si Josue nang umagang iyon at pinalapit ang Israel ayon sa mga lipi nito, at ang lipi ni Juda ang natukoy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nahuli” o “nakuha”; isang idyoma para sa pagiging natukoy o napili sa prosesong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: Kinaumagahan, maagang bumangon
  rationale: Pinagsasama nito ang temporal na pariralang “sa umaga” at ang diwa ng Hiphil ng שׁכם, “bumangon nang maaga,” sa natural na makabagong Tagalog.
- source_word: וַיַּקְרֵב
  choice: pinalapit
  rationale: 'Pinananatili ang sanhiing diwa ng Hiphil: dinala o pinaharap ni Josue ang Israel sa proseso ng pagkilala.'
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Tumutukoy sa bayan bilang isang kabuuan at tuwirang katumbas ng Hebreong pangalan.
- source_word: לִשְׁבָטָיו
  choice: ayon sa mga lipi nito
  rationale: Ipinahahayag ang pagkakaayos ng Israel batay sa mga pangkat-lipi, nang hindi dinaragdagan ang teksto ng “isa-isa.”
- source_word: וַיִּלָּכֵד
  choice: ang nabunot
  rationale: Sa kontekstong ito, ang Niphal ng לכד ay isang idyoma para sa natukoy o napiling pangkat. Ang “nabunot” ay natural sa Tagalog para sa kinalabasan ng isang sagradong pagpili, habang hindi tahasang dinaragdagan kung sino ang pumili.
- source_word: שֵׁבֶט יְהוּדָה
  choice: ang lipi ni Juda
  rationale: Karaniwan, malinaw, at tuwirang anyong Tagalog ng ugnayang konstrakto.
theological_decisions:
- issue: Paraan ng pagpili na ipinahihiwatig ng וַיִּלָּכֵד
  choice: ang nabunot
  alternative: ang napili / ang natukoy / ang nahuli
  rationale: Hindi tahasang sinasabi ng sugnay kung paano isinagawa ang pagpili o kung sino ang kumilos. Ang “nabunot” ay nagpapanatili sa idyomatikong pasibo at sa konteksto ng proseso, samantalang ipinapaliwanag sa talababa ang literal na larawan ng Hebreo.
translation_notes:
  register: Makabago at marangal na salaysay. Ginamit ang “Josue,” “Juda,” at “lipi,” na karaniwang anyo sa Bibliyang Tagalog. Iniwasan ang tahasang “sa pamamagitan ng palabunutan” dahil hindi iyon nakasaad sa mismong sugnay.
