  source_fidelity: 'Ang pangunahing nilalaman ay tapat sa Hebreo: ang malaking bunton ay inilagay sa ibabaw ni Acan, tumigil ang galit ni Yahweh, at ipinaliwanag ang pangalang Lambak ng Acor. Gayunman, mas malinaw na panatilihing si Yahweh ang tahasang paksa ng ikalawang pangungusap, gaya ng וַיָּשָׁב יְהוָה.'
  naturalness: Marangal at pangkalahatang natural ang Filipino. Ang “nagtayo sila ... ng isang malaking bunton” ay mas tuwiran at mas likas kaysa “nagpatong sila ... ng isang malaking bunton.” Ang binagong ikalawang pangungusap ay nananatiling natural habang mas malapit sa estruktura ng pinagmulan.
  terminology: Wasto ang “Yahweh” para sa יהוה at “Lambak ng Acor” para sa pangalan ng lugar. Ang talababa ay pinanatili ang transliteradong pangalan at ipinaliwanag ang larong-salita nang hindi isinasalin ang toponimo sa pangunahing teksto.
  issues:
  - severity: low
    issue: Hindi tahasang si Yahweh ang paksa sa “humupa ang nag-aalab na galit ni Yahweh.”
    rationale: Bagaman naipahihiwatig nito ang kontekstuwal na resulta, ang Hebreo ay tahasang nagsasabing si Yahweh ay “bumalik/mula” sa pag-aalab ng kanyang galit. Ang “tumigil si Yahweh sa ...” ay nag-iingat ng paksa at diwa nang hindi pinipilit ang literal ngunit di-likas na idyoma.
  - severity: low
    issue: Medyo di-likas ang “nagpatong sila ... ng isang malaking bunton.”
    rationale: Ang “nagtayo sila sa ibabaw niya ng isang malaking bunton ng mga bato” ay mas malinaw na Filipino para sa pagtatatag o pagbubunton ng heap of stones.
