base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: tl
  text: At nagtayo sila sa ibabaw niya ng isang malaking bunton ng mga bato na naroon hanggang sa araw na ito. Pagkatapos, tumigil si Yahweh sa nag-aalab niyang galit. Kaya tinawag na Lambak ng Acor[a] ang lugar na iyon, at iyon pa rin ang tawag dito hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Acor ay kahawig ng salitang Hebreo na nangangahulugang “gulo” o “kapahamakan.” Ihambing sa Josue 7:25.
    reason: Ipinapaliwanag ang larong-salita sa pangalan ng lugar nang hindi isinasalin ang pangalan sa pangunahing teksto.
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  choice: nagpatong sila sa ibabaw niya ng isang malaking bunton ng mga bato
  rationale: Ang Hiphil ng קום ay nagpapahiwatig ng pagtatayo o pagbubunton. Natural sa Filipino ang “nagpatong ... ng isang malaking bunton,” at malinaw na ang bunton ay nasa ibabaw niya.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: na naroon hanggang sa araw na ito / hanggang sa araw na ito
  rationale: Sa unang gamit, idinagdag ang “na naroon” upang maging malinaw at natural sa Filipino na ang bunton, hindi ang pagkilos ng pagbubunton, ang nananatili. Sa pangalawa, pinanatili ang karaniwang idyomang “hanggang sa araw na ito.”
- source_word: וַיָּשָׁב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: humupa ang nag-aalab na galit ni Yahweh
  rationale: Ang שׁוב מן sa kontekstong ito ay nagsasaad ng pagtalikod o paghupa ng galit. Ang “nag-aalab na galit” ay nagpapanatili sa larawang ipinahihiwatig ng חֲרוֹן אַף habang natural sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Natural at malinaw na panandang sanhi at bunga sa modernong Filipino.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: tinawag ... ang lugar na iyon, at iyon pa rin ang tawag dito
  rationale: Ang impersonal na “tinawag” ay angkop sa di-tiyak na paksa ng Hebreo. Ang kasunod na sugnay ay likas na nagpapahayag ng nagpapatuloy na resulta hanggang sa panahon ng tagapagsalaysay.
- source_word: עֵמֶק עָכוֹר
  choice: Lambak ng Acor
  rationale: Pinanatili ang pangalan ng lugar sa pangunahing teksto; ipinaliwanag sa talababa ang larong-salita nito sa Hebreo.
theological_decisions:
- issue: Paglalarawan sa paghupa ng galit ng Diyos
  choice: humupa ang nag-aalab na galit ni Yahweh
  alternative: tumalikod si Yahweh mula sa pag-aalab ng kanyang galit
  rationale: Ang pinili ay natural sa Filipino at tapat sa kontekstuwal na diwa ng שׁוב מן, habang pinananatili ang metaporang apoy sa galit. Hindi nito ipinapaliwanag nang higit sa teksto ang likas o paraan ng pagbabagong inilalarawan.
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at iniiwasang palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bunton ng mga bato” sa halip na teknikal na katawagan. Ang unang “hanggang sa araw na ito” ay ginawang malinaw sa Filipino sa pamamagitan ng “na naroon,” upang maiwasang magmukhang nagpatuloy hanggang noon ang mismong pagkilos ng pagbubunton.
