revisions:
- from: Ngunit naging di-tapat ang mga Israelita tungkol sa mga bagay na itinalagang lipulin[a], sapagkat kumuha si Akan—na anak ni Carmi, na anak ni Zabdi, na anak ni Zerah, mula sa lipi ni Juda—ng ilan sa mga bagay na iyon. Kaya nag-alab ang galit ni Yahweh laban sa mga Israelita.
  to: Ngunit naging di-tapat ang mga Israelita tungkol sa mga bagay na inilaan para sa paglipol[a], sapagkat si Akan—anak ni Carmi, anak ni Zabdi, anak ni Zerah, na kabilang sa lipi ni Juda—ay kumuha ng ilan sa mga bagay na iyon. Kaya nag-alab ang galit ni Yahweh laban sa mga Israelita.
  rationale: Pinalitan ang di-malinaw na “itinalagang lipulin” ng “inilaan para sa paglipol” upang maipahayag nang wasto ang saklaw ng חֵרֶם. Inayos din nang bahagya ang pariralang tumutukoy sa lipi upang malinaw na si Akan ang kabilang sa lipi ni Juda. Hindi binago ang kahulugan, ang kolektibong pananagutan, o ang antas ng katiyakan ng Hebreo.
