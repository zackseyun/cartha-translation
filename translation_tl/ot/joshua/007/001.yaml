  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: tl
  text: Ngunit naging di-tapat ang mga Israelita tungkol sa mga bagay na inilaan para sa paglipol[a], sapagkat si Akan—anak ni Carmi, anak ni Zabdi, anak ni Zerah, na kabilang sa lipi ni Juda—ay kumuha ng ilan sa mga bagay na iyon. Kaya nag-alab ang galit ni Yahweh laban sa mga Israelita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bagay na inilaan,” o sa mas literal na paraan, “ang itinalaga sa ilalim ng pagbabawal.” Ang Hebreong חֵרֶם ay tumutukoy sa mga tao o bagay na ibinukod para sa Diyos upang lipulin o alisin sa karaniwang gamit ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: naging di-tapat
  rationale: Ang ugat na מעל at ang kaugnay nitong pangngalan ay nagpapahiwatig ng pagtataksil o pagsira sa ipinagkatiwalang ugnayan, hindi lamang ng pangkalahatang pagkakasala. Ang “naging di-tapat” ay natural sa modernong Tagalog at pinananatili ang puwersang ito.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Natural at malinaw ito sa modernong Tagalog, habang pinananatili ang kolektibong pananagutan ng Israel na ipinahahayag ng maramihang simuno.
- source_word: בַּחֵרֶם / מִן־הַחֵרֶם
  choice: mga bagay na itinalagang lipulin
  rationale: Sa kontekstong ito, ang חֵרֶם ay tumutukoy sa mga bagay na ibinukod para sa Diyos at inalis sa karaniwang gamit ng tao, lalo na sa pamamagitan ng paglipol. Ginagawang malinaw ng salin ang kahulugan nang hindi gumagamit ng di-pamilyar na teknikal na termino.
- source_word: וַיִּקַּח ... מִן
  choice: kumuha ... ng ilan
  rationale: Ipinahihiwatig ng partitive na מִן na bahagi lamang ng kabuuan ang kinuha ni Akan. Likas sa Tagalog ang “ng ilan” sa ganitong pangungusap.
- source_word: לְמַטֵּה יְהוּדָה
  choice: mula sa lipi ni Juda
  rationale: Ang מַטֶּה ay tumutukoy rito sa tribong kinabibilangan ni Akan. Ang “lipi” ay karaniwan, maikli, at angkop sa genealogical na konteksto.
- source_word: וַיִּחַר אַף יְהוָה
  choice: nag-alab ang galit ni Yahweh
  rationale: Pinananatili nito ang matingkad na Hebreong talinghaga ng galit na nagliliyab at likas pa rin itong pakinggan sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON,” alinsunod sa tahasang anyo ng tekstong Hebreo.
theological_decisions:
- issue: Kolektibong pananagutan ng Israel sa kasalanang ginawa ng isang tao
  choice: Pinanatili ang maramihang simunong “ang mga Israelita” at pagkatapos ay tahasang kinilala si Akan bilang indibiduwal na kumuha.
  alternative: Iukol lamang kay Akan ang pagiging di-tapat, o gawing malabong “nagkasala ang Israel.”
  rationale: Sinasadyang pagsamahin ng Hebreo ang pagkilos ng isang miyembro at ang pananagutan at kahihinatnan para sa buong sambayanan. Hindi nilulutas o pinapawi ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga Israelita” sa halip na ang mas literal ngunit di-gaanong likas na “mga anak ni Israel.” Pinanatili ang genealogical na pagkakasunod-sunod at ang Hebreong talinghaga sa “nag-alab ang galit.”
