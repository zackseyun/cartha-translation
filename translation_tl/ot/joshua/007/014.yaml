  text: וְ/נִקְרַבְתֶּ֥ם בַּ/בֹּ֖קֶר לְ/שִׁבְטֵי/כֶ֑ם וְ/הָיָ֡ה הַ/שֵּׁבֶט֩ אֲשֶׁר יִלְכְּדֶ֨/נּוּ יְהוָ֜ה יִקְרַ֣ב לַ/מִּשְׁפָּח֗וֹת וְ/הַ/מִּשְׁפָּחָ֞ה אֲשֶֽׁר יִלְכְּדֶ֤/נָּה יְהוָה֙ תִּקְרַ֣ב לַ/בָּתִּ֔ים וְ/הַ/בַּ֨יִת֙ אֲשֶׁ֣ר יִלְכְּדֶ֣/נּוּ יְהוָ֔ה יִקְרַ֖ב לַ/גְּבָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: tl
  text: Sa umaga, lalapit kayo ayon sa inyong mga lipi. Ang liping matutukoy[a] ni Yahweh ay lalapit ayon sa mga angkan nito; ang angkang matutukoy ni Yahweh ay lalapit ayon sa mga sambahayan nito; at ang sambahayang matutukoy ni Yahweh ay lalapit nang isa-isang lalaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahuhuli” o “masasakop.” Ang pandiwang Hebreo ay karaniwang nangangahulugang “hulihin” o “sakupin,” ngunit dito ay tumutukoy sa pangkat na itinuturo ni Yahweh, malamang sa pamamagitan ng banal na palabunutan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lalaki bawat lalaki,” na nagsasaad ng isa-isang pagtukoy sa mga lalaki sa loob ng sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם
  choice: lalapit kayo
  rationale: Pinananatili ang paulit-ulit na pandiwang קרב at ang diwa ng pormal na paglapit para sa pagtukoy, nang hindi agad dinaragdagan ng interpretasyong “iharap ang sarili.”
- source_word: לְשִׁבְטֵיכֶם
  choice: ayon sa inyong mga lipi
  rationale: Ipinahahayag ang maayos at pangkat-pangkat na paglapit ng mga lipi.
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: matutukoy
  rationale: Bagaman karaniwang nangangahulugang “hulihin” o “sakupin” ang לכד, tumutukoy ito rito sa pangkat na mahahayag sa proseso ng pagpili, malamang sa pamamagitan ng banal na palabunutan. Ang “matutukoy” ay natural sa Filipino at hindi nagpapahiwatig ng pisikal na paghuli.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang יהוה sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: לַמִּשְׁפָּחוֹת
  choice: ayon sa mga angkan nito
  rationale: Sa kaayusang panlipunan ng Israel, ang מִשְׁפָּחָה ay yunit na mas maliit sa lipi ngunit mas malawak kaysa karaniwang nuklear na pamilya; ang “angkan” ang likas na katumbas.
- source_word: לַבָּתִּים
  choice: ayon sa mga sambahayan nito
  rationale: Ang בַּיִת dito ay tumutukoy sa yunit ng sambahayan, hindi sa gusali.
- source_word: לַגְּבָרִים
  choice: nang isa-isang lalaki
  rationale: Pinananatili ang panlalaking kahulugan at distributibong diwa ng גְּבָרִים habang natural na ipinapakita ang huling antas ng pagtukoy.
- source_word: וְהָיָה
  choice: Ang … ay
  rationale: Isinalin ang pormulang nagpapakilala sa kasunod na resulta sa natural na ayos ng modernong Filipino, sa halip na gumamit ng mabigat na literal na parirala.
theological_decisions:
- issue: Paglalarawan sa paraang tinutukoy ni Yahweh ang lipi, angkan, at sambahayan
  choice: matutukoy ni Yahweh
  alternative: mahuhuli ni Yahweh
  rationale: Hindi tiyak na binabanggit ng talata ang mekanismo, bagaman malamang na banal na palabunutan ang konteksto. Iniiwasan ng salin ang maling larawan ng pisikal na paghuli habang hindi rin tahasang idinaragdag sa pangunahing teksto ang “sa pamamagitan ng palabunutan.”
- issue: Paglalapat ng pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na pagliit mula lipi, patungo sa angkan, sambahayan, at indibiduwal na lalaki, pati ang paulit-ulit na estruktura ng tekstong Hebreo.
