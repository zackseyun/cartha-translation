source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יְהוֹשֻׁ֨עַ אֲנָשִׁ֜ים מִֽ/ירִיח֗וֹ הָ/עַ֞י אֲשֶׁ֨ר עִם בֵּ֥ית אָ֨וֶן֙ מִ/קֶּ֣דֶם לְ/בֵֽית אֵ֔ל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ לֵ/אמֹ֔ר עֲל֖וּ וְ/רַגְּל֣וּ אֶת הָ/אָ֑רֶץ וַֽ/יַּעֲלוּ֙ הָ/אֲנָשִׁ֔ים וַֽ/יְרַגְּל֖וּ אֶת הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: tl
  text: Nagsugo si Josue mula sa Jerico ng mga lalaki tungo sa Ai[a], na malapit sa Bet-aven, sa silangan ng Bethel. Sinabi niya sa kanila, “Umakyat kayo at tiktikan ang lupain.” Kaya umakyat ang mga lalaki at tiniktikan ang Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nasa tabi ng Bet-aven.” Sa Hebreo, literal na “na kasama ng Bet-aven”; ang ginamit na pang-ukol ay maaaring magpahiwatig ng heograpikong pagkalapit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Likas na salin ng karaniwang pandiwang pasalaysay na שלח at malinaw na ipinapakitang ipinadala ni Josue ang mga lalaki para sa isang atas.
- source_word: אֲנָשִׁים
  choice: mga lalaki
  rationale: Tahasang panlalaking maramihan ang Hebreo at angkop ito sa konteksto ng pangangalap ng impormasyong militar.
- source_word: מִירִיחוֹ הָעַי
  choice: mula sa Jerico patungo sa Ai
  rationale: Inililinaw ng “patungo sa” ang destinasyon ng pagsusugo, samantalang pinananatili ng “mula sa Jerico” ang pinanggalingan.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: na malapit sa Bet-aven
  rationale: Bagaman literal na “kasama ng” ang עִם, maaari itong magpahayag ng heograpikong pagkalapit; natural at malinaw sa Tagalog ang “malapit sa.”
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: sa silangan ng Bethel
  rationale: Ipinahahayag ng parirala ang lokasyon ng Ai kaugnay ng Bethel.
- source_word: עֲלוּ / וַיַּעֲלוּ
  choice: Umakyat kayo / umakyat
  rationale: Pinananatili ang direksiyonal o topograpikong diwa ng עלה at ang pag-uulit sa utos at pagtupad.
- source_word: וְרַגְּלוּ / וַיְרַגְּלוּ
  choice: tiktikan / tiniktikan
  rationale: Ang Piel ng רגל ay tumutukoy sa lihim o militar na pagmamanman; karaniwan at nauunawaang katumbas sa modernong Tagalog ang “tiktikan.”
- source_word: אֶת הָאָרֶץ
  choice: ang lupain
  rationale: Pinananatili ang malawak na kahulugan ng אֶרֶץ bilang teritoryong susuriin, nang hindi ito nililimitahan sa lungsod lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagsugo,” “umakyat,” at “tiktikan” upang mapanatili ang tuwirang daloy at ang militar na konteksto. Ang mga pangalang Jerico, Ai, Bet-aven, at Bethel ay nasa karaniwang anyong Filipino/Biblikal.
