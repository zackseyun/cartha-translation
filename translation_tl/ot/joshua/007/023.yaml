id: JOS.7.23
reference: Joshua 7:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקָּחוּ/ם֙ מִ/תּ֣וֹךְ הָ/אֹ֔הֶל וַ/יְבִאוּ/ם֙ אֶל יְהוֹשֻׁ֔עַ וְ/אֶ֖ל כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּצִּקֻ֖/ם לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: tl
  text: Kinuha nila ang mga iyon mula sa loob ng tolda at dinala kay Josue at sa lahat ng mga anak ni Israel.[a] Inilatag nila ang mga iyon sa harap ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng mga Israelita.” Ang literal na katawagang Hebreo ay “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “ibinuhos nila ang mga iyon sa harap ni Yahweh.” Ang pandiwang Hebreo ay maaaring literal na mangahulugang “ibuhos,” ngunit dito ay malamang na tumutukoy sa paglalatag o paglalagay ng mga nakuhang bagay sa presensiya ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: Kinuha nila ang mga iyon
  rationale: Ang לָקַח ay karaniwang nangangahulugang “kunin.” Ang “mga iyon” ay malinaw na tumutukoy sa mga bagay na natagpuan sa tolda.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: mula sa loob ng tolda
  rationale: Pinananatili nito ang tiyak na diwang panlunan ng מִתּוֹךְ, hindi lamang ang mas payak na “mula sa tolda.”
- source_word: וַיְבִאוּם
  choice: dinala
  rationale: Ang Hiphil ng בוא ay likas na “dalhin”; hindi kinakailangang dagdagan ito ng seremonyal na diwa gaya ng “iniharap.”
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: kay Josue at sa lahat ng mga anak ni Israel
  rationale: Ang “mga anak ni Israel” ay nagpapanatili sa tradisyonal at tipanang katawagan ng Hebreo, habang nananatiling nauunawaan sa makabagong Filipino.
- source_word: וַיַּצִּקֻם
  choice: Inilatag nila ang mga iyon
  rationale: Bagaman literal na maaaring mangahulugang “ibinuhos,” mga nakuhang bagay ang tinutukoy rito. Ang “inilatag” ay natural na naghahayag na inilagay o ipinakita ang mga iyon, habang inilalagay sa talababa ang literal na posibilidad.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay natural na “sa harap” o “sa presensiya,” at ang יְהוָה ay isinasalin bilang personal na pangalang “Yahweh.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Paglalahad sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang anyo ng katawagang Hebreo nang hindi ipinahihiwatig na ang tinutukoy ay mga anak na lalaki lamang; sa konteksto, katawagan ito sa sambayanan ng Israel.
- issue: Kahulugan ng וַיַּצִּקֻם sa konteksto
  choice: inilatag nila ang mga iyon
  alternative: ibinuhos nila ang mga iyon
  rationale: Hindi likido kundi sari-saring nakuhang bagay ang layon ng pandiwa. Pinipili ang natural na kontekstuwal na diwa ngunit hindi itinatago ang mas literal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda,” “Josue,” at “Yahweh” bilang madaling maunawaang mga anyo. Bahagyang pormal ang “mga anak ni Israel” upang mapanatili ang katawagang tipanan ng pinagmulang teksto; nilinaw sa talababa ang mas karaniwang “mga Israelita.”
