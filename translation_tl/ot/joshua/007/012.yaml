  to: Kaya hindi makapanindigan ang mga Israelita sa harap ng kanilang mga kaaway. Tatalikod sila sa kanilang mga kaaway, sapagkat sila ay naging itinalaga sa paglipol. Hindi na ako mananatiling kasama ninyo malibang lipulin ninyo mula sa gitna ninyo ang bagay na itinalaga sa paglipol.[a]
