  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: tl
  text: Kaya hindi makapanindigan ang mga Israelita sa harap ng kanilang mga kaaway. Tatalikod sila sa kanilang mga kaaway, sapagkat sila ay naging itinalaga sa paglipol. Hindi na ako mananatiling kasama ninyo malibang lipulin ninyo mula sa gitna ninyo ang bagay na itinalaga sa paglipol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na חֵרֶם (ḥerem) ay tumutukoy sa isang tao o bagay na inilaan sa Diyos upang wasakin sa ilalim ng pagbabawal. Madalas itong isalin noon bilang “isinumpang bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Natural at malinaw na makabagong Tagalog para sa kolektibong katawagang Hebreo; hindi kailangang literal na “mga anak ng Israel,” na maaaring magmukhang tumutukoy lamang sa tuwirang mga anak ni Jacob.
- source_word: לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: makapanindigan sa harap ng kanilang mga kaaway
  rationale: Pinananatili ang larawan ng pagtayo habang malinaw na ipinahihiwatig ang kakayahang humarap o manatiling matatag laban sa kaaway.
- source_word: עֹרֶף יִפְנוּ
  choice: tumatalikod sila
  rationale: Inililipat sa natural na Tagalog ang literal na larawan ng pagbaling ng batok, na nagpapahiwatig ng pag-urong sa pagkatalo.
- source_word: הָיוּ לְחֵרֶם
  choice: sila mismo ay napailalim sa paglipol
  rationale: Ipinahahayag ang katayuan ng Israel sa ilalim ng חֵרֶם nang hindi ito pinapaliit sa pangkalahatang ideya lamang ng sumpa; ang “mismo” ay nililinaw ang kaibahan sa bagay na nasa kanilang gitna.
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: Hindi na ako mananatiling kasama ninyo
  rationale: Natural na ipinapahayag ang paghinto ng patuloy na presensiya ng Diyos.
- source_word: תַשְׁמִידוּ
  choice: lipulin ninyo
  rationale: Ang “lipulin” ay angkop sa mariin at ganap na pagkawasak na hinihingi ng Hiphil ng שׁמד.
- source_word: הַחֵרֶם
  choice: ang bagay na itinalaga sa paglipol
  rationale: Konkretong tumutukoy sa ipinagbabawal na bagay sa kampo at pinananatili ang kaugnayan nito sa naunang katayuang חֵרֶם.
- source_word: מִקִּרְבְּכֶם
  choice: mula sa gitna ninyo
  rationale: Pinananatili ang komunal at tipanang larawan ng pag-aalis mula sa loob ng bayan.
theological_decisions:
- issue: Magkaugnay ngunit magkaibang gamit ng חֵרֶם sa iisang talata
  choice: “napailalim sa paglipol” para sa katayuan ng Israel at “bagay na itinalaga sa paglipol” para sa konkretong bagay
  alternative: “nasumpa” at “isinumpang bagay”
  rationale: Pinananatili nito ang hudisyal at kultikong diwa ng חֵרֶם at ang leksikal na ugnayan ng dalawang gamit, nang hindi ipinapalagay na karaniwang sumpa lamang ang tinutukoy.
- issue: Saklaw ng maramihang ikalawang panauhan sa pangako ng presensiya
  choice: “kasama ninyo”
  alternative: “kasama mo”
  rationale: Maramihan ang עִמָּכֶם at תַשְׁמִידוּ; ang pahayag ay para sa Israel bilang pamayanan, hindi lamang kay Josue.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “makapanindigan” upang mapanatili ang larawang militar ng Hebreo, at ang “itinalaga sa paglipol” upang ihatid ang natatanging diwa ng חֵרֶם nang hindi umaasa sa malabong tradisyonal na katawagang “isinumpa.”
