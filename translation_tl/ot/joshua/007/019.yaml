  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל עָכָ֗ן בְּנִ/י֙ שִֽׂים נָ֣א כָב֗וֹד לַֽ/יהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל וְ/תֶן ל֣/וֹ תוֹדָ֑ה וְ/הַגֶּד נָ֥א לִ/י֙ מֶ֣ה עָשִׂ֔יתָ אַל תְּכַחֵ֖ד מִמֶּֽ/נִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Josue kay Acan, “Anak ko, pakisuyo, magbigay ka ng kaluwalhatian kay Yahweh, ang Diyos ng Israel, at magpasalamat ka sa kanya.[a] Pakisuyo, sabihin mo sa akin kung ano ang ginawa mo; huwag mo itong ilihim sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at magbigay ka sa kanya ng papuri,” o, sa kontekstong ito, posibleng “at umamin ka sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Anak ko
  rationale: Pinananatili nito ang literal na panawagang panlalaki at ang mahabagin ngunit taimtim na himig ni Josue.
- source_word: שִׂים נָא כָבוֹד
  choice: pakisuyong magbigay ka ng kaluwalhatian
  rationale: Ang literal na 'ilagay ang kaluwalhatian' ay isang idyoma; natural na ipinahahayag sa Tagalog bilang pagbibigay ng kaluwalhatian. Isinasalin ng 'pakisuyo' ang magalang na pakiusap ng נָא.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה at ang pang-ukol na ל, nang hindi pinapalitan ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Likas at tuwirang salin ng pariralang konstruktong kumikilala sa Diyos kaugnay ng Israel.
- source_word: וְתֶן לוֹ תוֹדָה
  choice: at magbigay ka sa kanya ng pasasalamat
  rationale: Pinananatili ng 'pasasalamat' ang karaniwang saklaw ng תוֹדָה, habang inilalahad sa talababa ang posibleng diwang pagpapahayag o pag-amin sa kontekstong ito.
- source_word: וְהַגֶּד נָא לִי
  choice: Pakisuyong sabihin mo sa akin
  rationale: Malinaw at natural na salin ng Hiphil imperative ng נגד, at pinananatili ng 'pakisuyo' ang pakiusap na ipinahihiwatig ng נָא.
- source_word: מֶה עָשִׂיתָ
  choice: kung ano ang ginawa mo
  rationale: Natural na Tagalog para sa natapos na gawa na kasalukuyang paksa ng pagsisiyasat.
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: huwag mo itong ilihim sa akin
  rationale: Tumpak na ipinahahayag ng 'ilihim' ang diwa ng כחד na huwag ikubli o ipagkait ang impormasyon; ang 'ito' ay likas na tahasang layon sa Tagalog.
theological_decisions:
- issue: Kahulugan ng תוֹדָה sa konteksto ng pag-amin
  choice: pasasalamat sa pangunahing teksto, na may talababa tungkol sa posibleng diwang pag-amin
  alternative: papuri; o pag-amin sa kanya
  rationale: Maaaring tumukoy ang תוֹדָה sa pasasalamat, papuri, o—sa ilang konteksto—pag-amin. Dahil hinihimok si Acan na magsabi ng totoo sa harap ng Diyos, naroon ang diwang pag-amin, ngunit hindi ito dapat gawing tanging kahulugan sa pangunahing teksto.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang 'pakisuyo' upang maipakita ang magalang ngunit taimtim na pakiusap; pinanatili ang pangalang Yahweh at ang tunay na kalabuan ng תוֹדָה sa pamamagitan ng talababa.
