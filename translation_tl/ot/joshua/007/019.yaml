  to: Pagkatapos, sinabi ni Josue kay Acan, “Anak ko, pakisuyo, magbigay ka ng kaluwalhatian kay Yahweh, ang Diyos ng Israel, at magpasalamat ka sa kanya.[a] Pakisuyo, sabihin mo sa akin kung ano ang ginawa mo; huwag mo itong ilihim sa akin.”
  rationale: Pinalitan ang di-likas na “magbigay ka sa kanya ng pasasalamat” ng idiomatikong “magpasalamat ka sa kanya,” habang pinananatili sa talababa ang papuri at pag-amin bilang kontekstuwal na mga posibilidad ng תוֹדָה. Inayos din ang paglalagay ng “Pakisuyo” para sa mas likas na modernong Filipino nang hindi binabago ang antas ng paggalang o ang kahulugan.
