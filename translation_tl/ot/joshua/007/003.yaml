  to: Bumalik sila kay Josue at sinabi sa kanya, “Huwag nang paahunin ang buong bayan. Mga dalawang libo o mga tatlong libong lalaki lamang ang paahunin upang umahon at salakayin ang Ai. Huwag mo nang pagurin doon ang buong bayan,[a] sapagkat kakaunti lamang sila.”
