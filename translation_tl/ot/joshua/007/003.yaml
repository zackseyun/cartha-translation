translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Josue” at “Ai” bilang karaniwang anyong Filipino ng mga pangalan. Iniwasan ang makalumang “saktan” o “lipulin” para sa נכה dahil ang konteksto ay mas malinaw na nagsasaad ng pagsalakay, hindi pa ng tiyak na tagumpay.
