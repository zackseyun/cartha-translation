base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: tl
  text: Bumalik sila kay Josue at sinabi sa kanya, “Huwag nang paahunin ang buong bayan. Mga dalawang libo o mga tatlong libong lalaki lamang ang paahunin upang umahon at salakayin ang Ai. Huwag mo nang pagurin doon ang buong bayan,[a] sapagkat kakaunti lamang sila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, ang “buong bayan” ay maaaring tumukoy lalo na sa buong puwersang panlaban ng Israel. Maaari ring isalin ang pariralang ito na “Huwag mo nang gambalain doon ang buong bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל־יְהוֹשֻׁעַ וַיֹּאמְרוּ אֵלָיו
  choice: Bumalik sila kay Josue at sinabi sa kanya
  rationale: Likas na salaysay sa modernong Tagalog at tuwirang pinananatili ang pagbabalik ng mga tagamasid kay Josue.
- source_word: אַל־יַעַל כָּל־הָעָם
  choice: Huwag nang paahunin ang buong bayan
  rationale: Ang sanhiing anyong “paahunin” ay natural na nagpapahayag ng payong huwag ipasampa ni Josue ang lahat. Pinanatili ang “umahon” dahil maaaring may topograpikal at militar na diwa ang עלה.
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: Mga dalawang libo o tatlong libong lalaki lamang
  rationale: Ipinahihiwatig ng כְּ ang pagtatantiya; natural itong ipinapahayag ng “mga.” Ang “lalaki” ay angkop sa puwersang panlaban na tinutukoy.
- source_word: יַעֲלוּ וְיַכּוּ אֶת־הָעָי
  choice: ang umahon at sumalakay sa Ai
  rationale: Pinanatili ng “umahon” ang paggalaw na ipinahihiwatig ng עלה, samantalang malinaw at natural na katumbas sa kontekstong militar ang “sumalakay” para sa נכה.
- source_word: אַל־תְּיַגַּע שָׁמָּה אֶת־כָּל־הָעָם
  choice: Huwag mo nang pagurin doon ang buong bayan
  rationale: Ang Piel ng יגע ay maaaring mangahulugang magpagod o magpabigat sa pamamagitan ng di-kailangang pagsisikap. Tuwiran at natural sa Tagalog ang “pagurin.”
- source_word: כִּי מְעַט הֵמָּה
  choice: sapagkat kakaunti lamang sila
  rationale: Tumutukoy ang panghalip sa mga naninirahan o tagapagtanggol ng Ai; pinananatili ang maikli at di-labis na paliwanag ng Hebreo.
- source_word: הָעָם
  choice: ang buong bayan
  rationale: Pinananatili ang malawak na kahulugan ng הָעָם sa halip na paliitin agad sa “hukbo,” kahit malinaw sa konteksto na ang puwersang panlaban ang tinutukoy.
