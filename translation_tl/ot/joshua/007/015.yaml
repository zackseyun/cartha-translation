  - severity: low
    issue: Medyo di-likas ang “lahat ng kanya.”
    rationale: Mas idiomatiko ang “lahat ng sa kanya,” habang hindi nililimitahan ang saklaw sa mga materyal na ari-arian lamang.
  - severity: low
    issue: Kailangang ipakitang tradisyonal na alternatibo ang “isinumpang bagay.”
    rationale: Nakakatulong itong maiwasang magmukhang ganap na katumbas ang alternatibo ng pangunahing semantikong diwa ng ḥerem.
