  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: tl
  text: At ang sinumang mahuling may taglay ng itinalagang bagay[a] ay susunugin sa apoy—siya at ang lahat ng sa kanya—sapagkat nilabag niya ang tipan ni Yahweh at gumawa siya ng isang kahindik-hindik na bagay sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, ayon sa tradisyon, na “isinumpang bagay.” Ang Hebreong ḥerem ay tumutukoy sa bagay na inilagay sa ilalim ng pagbabawal at itinalaga sa paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: ang mahuli
  rationale: Ang pasibong anyo ng לכד ay tumutukoy sa taong matutukoy sa isinasagawang pagpili. Ang “mahuli” ay likas sa Tagalog at hindi nagpapahiwatig na nabihag siya sa digmaan.
- source_word: בַּחֵרֶם
  choice: may taglay ng itinalagang bagay
  rationale: Ang חֵרֶם ay bagay na ibinukod para sa Diyos at ipinagbawal sa karaniwang paggamit, madalas upang lipulin. Ipinahahayag ng “itinalagang bagay” ang katayuan nitong inilaan, samantalang ipinapakita ng “may taglay” ang pagkakaugnay ng taong natukoy sa bagay.
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: susunugin sa apoy
  rationale: Tuwirang salin ng pasibong pandiwa at ng pariralang tumutukoy sa apoy bilang paraan ng pagsunog; natural din ito sa makabagong Tagalog.
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: siya at ang lahat ng kanya
  rationale: Pinananatili nito ang malawak na saklaw ng Hebreo nang hindi nililimitahan sa mga materyal na pag-aari lamang.
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: nilabag niya ang tipan ni Yahweh
  rationale: Sa konteksto ng tipan, ang עבר ay nangangahulugang lumampas sa itinakdang hangganan o sumuway; malinaw at may legal na bigat ang “nilabag.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: נְבָלָה
  choice: isang kahindik-hindik na bagay
  rationale: Dito ang נְבָלָה ay hindi simpleng kamangmangan kundi isang gawaing lubhang kahiya-hiya at nakagigimbal sa moral na diwa.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: 'Pinananatili ang lokatibong diwa: ginawa ang kasalanan sa loob ng sambayanan ng tipan.'
theological_decisions:
- issue: Kahulugan ng חֵרֶם sa konteksto ng paghatol ayon sa tipan
  choice: itinalagang bagay
  alternative: isinumpang bagay; bagay na itinalaga sa paglipol; bagay na nasa ilalim ng pagbabawal
  rationale: Ipinakikita ng pangunahing salin na ang bagay ay inilaan at inalis sa karaniwang paggamit, habang nililinaw ng talababa na kalakip nito ang pagbabawal at pagtalaga sa paglipol. Hindi nito basta tinutumbasan ang pagiging itinalaga ng pagiging isinumpa.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mga gitling upang maipakitang ang “siya at ang lahat ng kanya” ay nagpapaliwanag sa saklaw ng hatol. Pinanatili ang malawak na pahayag na “lahat ng kanya” upang hindi tahimik na limitahan ang Hebreo sa mga ari-arian lamang.
