revisions:
- from: At ang mahuling may taglay ng itinalagang bagay[a] ay susunugin sa apoy—siya at ang lahat ng kanya—sapagkat nilabag niya ang tipan ni Yahweh at gumawa siya ng isang kahindik-hindik na bagay sa Israel.
  to: At ang sinumang mahuling may taglay ng itinalagang bagay[a] ay susunugin sa apoy—siya at ang lahat ng sa kanya—sapagkat nilabag niya ang tipan ni Yahweh at gumawa siya ng isang kahindik-hindik na bagay sa Israel.
  rationale: Inayos ang dalawang parirala para sa higit na malinaw at natural na modernong Tagalog. Pinanatili ang pagkakaugnay ng tao sa ḥerem sa “may taglay ng,” ang malawak na saklaw ng “siya at ang lahat ng sa kanya,” at ang hindi pinahihinang moral na puwersa ng נְבָלָה. Nilinaw rin ng talababa na tradisyonal ang “isinumpang bagay,” samantalang ang pangunahing salin ay nagpapanatili sa diwa ng bagay na itinalaga sa ilalim ng banal na pagbabawal.
  reviewer_model: gpt-5.6-terra
