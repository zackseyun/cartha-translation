revisions:
- from: Nang makita ko sa mga nasamsam ang isang magandang balabal mula sa Sinar[a], dalawang daang siklong pilak, at isang pirasong ginto na hugis-dila[b] at may bigat na limampung siklo, inimbot ko ang mga iyon at kinuha. Naroon ang mga iyon, nakabaon sa lupa sa loob ng tolda ko, at ang pilak ay nasa ilalim ng balabal[c].
  to: Nakita ko sa mga nasamsam ang isang magandang balabal mula sa Sinar[a], dalawang daang siklong pilak, at isang pirasong gintong hugis-dila[b] na tumitimbang ng limampung siklo. Inimbot ko ang mga iyon at kinuha. At heto, nakabaon ang mga iyon sa lupa sa loob ng tolda ko, at ang pilak ay nasa ilalim ng balabal[c].
  rationale: Pinalitan ang temporal na “Nang makita ko” ng payak na “Nakita ko” upang masundan ang anyong pasalaysay ng Hebrew. Pinakinis din ang pariralang “pirasong gintong hugis-dila.” Pinanatili ang mga talababa at ang maingat na pagtukoy sa balabal bilang malamang na pinatutungkulan ng huling panghalip.
