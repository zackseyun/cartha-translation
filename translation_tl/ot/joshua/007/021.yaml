translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “siklo” bilang sinaunang yunit ng timbang, “balabal” para sa maringal na panlabas na kasuotan, at “inimbot” upang mapanatili ang moral na bigat ng pag-amin. Inilantad sa talababa ang literal na larawan ng “dila ng ginto” at ang bahagyang kawalang-katiyakan ng huling panghalip.
