  text: ו/אראה בַ/שָּׁלָ֡ל אַדֶּ֣רֶת שִׁנְעָר֩ אַחַ֨ת טוֹבָ֜ה וּ/מָאתַ֧יִם שְׁקָלִ֣ים כֶּ֗סֶף וּ/לְשׁ֨וֹן זָהָ֤ב אֶחָד֙ חֲמִשִּׁ֤ים שְׁקָלִים֙ מִשְׁקָל֔/וֹ וָֽ/אֶחְמְדֵ֖/ם וָֽ/אֶקָּחֵ֑/ם וְ/הִנָּ֨/ם טְמוּנִ֥ים בָּ/אָ֛רֶץ בְּ/ת֥וֹךְ הָ/אָֽהֳלִ֖/י וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: tl
  text: Nakita ko sa mga nasamsam ang isang magandang balabal mula sa Sinar[a], dalawang daang siklong pilak, at isang pirasong gintong hugis-dila[b] na tumitimbang ng limampung siklo. Inimbot ko ang mga iyon at kinuha. At heto, nakabaon ang mga iyon sa lupa sa loob ng tolda ko, at ang pilak ay nasa ilalim ng balabal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Sinar” ay sinaunang pangalan ng isang rehiyong kaugnay ng Babilonia.
    reason: historical_context
  - marker: b
    text: Sa Hebrew, “isang dila ng ginto.” Malamang na isang piraso itong hugis-dila; maaari ring isaling “baras” o “kalso ng ginto.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebrew, “sa ilalim nito.” Pambabae at isahan ang panghalip, kaya malamang na tumutukoy ito sa balabal.
    reason: referent_ambiguity
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: sa mga nasamsam
  rationale: Tumutukoy ang שָׁלָל sa samsam sa digmaan; natural at malinaw sa modernong Filipino ang “mga nasamsam.”
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: isang magandang balabal mula sa Sinar
  rationale: Ang אַדֶּרֶת ay maringal na panlabas na kasuotan o balabal; ipinahihiwatig ng טוֹבָה ang magandang kalidad o anyo, at ang Sinar ang pinagmulan nito.
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: dalawang daang siklong pilak
  rationale: Pinananatili ang sinaunang yunit na siklo bilang sukat ng timbang, nang hindi ito tiyak na tinutumbasan ng makabagong halaga.
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: isang pirasong ginto na hugis-dila
  rationale: Literal na “dila ng ginto” ang parirala; ipinananatili ng salin ang hugis na ipinahihiwatig ng Hebrew nang hindi ipinapalagay na ito ay bar o kalso.
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: may bigat na limampung siklo
  rationale: Direkta at natural na ipinapahayag ang timbang ng pirasong ginto.
- source_word: וָאֶחְמְדֵם
  choice: inimbot ko ang mga iyon
  rationale: Ang חמד ay matinding pagnanasa na may maling moral na diwa sa kontekstong ito; ang “inimbot” angkop sa pag-amin ni Acan.
- source_word: וָאֶקָּחֵם
  choice: at kinuha
  rationale: Karaniwang kahulugan ng לקח ang “kumuha”; hindi kailangan ang mas mariing pandiwa.
- source_word: וְהִנָּם
  choice: Naroon ang mga iyon
  rationale: Ipinapakita ng הִנָּם ang agarang pagturo sa kinaroroonan ng mga bagay; natural itong ihayag bilang “Naroon ang mga iyon.”
- source_word: טְמוּנִים בָּאָרֶץ
  choice: nakabaon sa lupa
  rationale: Bagaman maaaring “nakatago,” nililinaw ng “sa lupa” na nakabaon ang mga bagay; natural at eksakto ang parirala sa konteksto.
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: sa loob ng tolda ko
  rationale: Payak at kasalukuyang Filipino para sa lokasyon sa loob ng sariling tolda.
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: at ang pilak ay nasa ilalim ng balabal
  rationale: Ang hulaping pambabae na isahan ay malamang na tumutukoy sa balabal; inuulit ang pangngalan sa pangunahing teksto upang maiwasan ang malabong panghalip.
