revisions:
- from: 'Bumangon ka. Italaga mo bilang banal ang sambayanan at sabihin mo, ‘Italaga ninyo ang inyong sarili bilang banal para sa bukas, sapagkat ganito ang sinabi ni Yahweh, ang Diyos ng Israel: May bagay na itinalaga sa paglipol[a] sa gitna ninyo, Israel. Hindi ninyo kayang tumindig sa harap ng inyong mga kaaway hangga''t hindi ninyo inaalis sa gitna ninyo ang bagay na itinalaga sa paglipol.’'
  to: 'Bumangon ka. Italaga mo bilang banal ang sambayanan at sabihin mo, ‘Italaga ninyo ang inyong sarili bilang banal para sa bukas, sapagkat ganito ang sabi ni Yahweh, ang Diyos ng Israel: May bagay na itinalaga sa paglipol[a] sa gitna ninyo, Israel. Hindi ninyo kayang tumindig sa harap ng inyong mga kaaway hanggang sa alisin ninyo sa gitna ninyo ang bagay na itinalaga sa paglipol.’'
  rationale: Ginawa lamang ang maliliit na rebisyon para sa mas likas na Filipino, mas malapit na paglalapat ng pormulang Hebreo, at talababang hindi nagdaragdag ng hindi tahasang isinasaad ng talata. Hindi binago ang kahulugan o ang maingat na pagsasalin ng חֵרֶם.
