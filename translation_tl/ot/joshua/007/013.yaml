source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: tl
  text: 'Bumangon ka. Italaga mo bilang banal ang sambayanan at sabihin mo, ‘Italaga ninyo ang inyong sarili bilang banal para sa bukas, sapagkat ganito ang sabi ni Yahweh, ang Diyos ng Israel: May bagay na itinalaga sa paglipol[a] sa gitna ninyo, Israel. Hindi ninyo kayang tumindig sa harap ng inyong mga kaaway hanggang sa alisin ninyo sa gitna ninyo ang bagay na itinalaga sa paglipol.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong חֵרֶם (ḥerem) ay tumutukoy sa isang bagay na di-mababawing itinalaga; sa kontekstong ito, itinalaga ito sa paglipol. Tradisyonal din itong isinasaling “bagay na lubos na itinalaga” o “bagay na nasa ilalim ng pagbabawal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻם
  choice: Bumangon ka
  rationale: Tuwirang pautos kay Josue na kumilos agad; natural sa modernong Tagalog at pinananatili ang agarang diin.
- source_word: קַדֵּשׁ אֶת הָעָם
  choice: Italaga mo bilang banal ang sambayanan
  rationale: Ipinapahayag ang Piel na sanhi o aktibong paghahanda sa bayan bilang banal, habang iniiwasang ipakahulugan lamang bilang paglilinis.
- source_word: הִתְקַדְּשׁוּ
  choice: Italaga ninyo ang inyong sarili bilang banal
  rationale: Pinananatili ang reflexive na lakas ng Hitpael at ang leksikal na kaugnayan nito sa naunang קַדֵּשׁ.
- source_word: לְמָחָר
  choice: para sa bukas
  rationale: Nagsasaad ng paghahandang nakatuon sa susunod na araw.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: חֵרֶם
  choice: bagay na itinalaga sa paglipol
  rationale: Sinasalamin ang bagay na inilagay sa di-mababawing pagtatalaga, na sa kontekstong ito ay para sa pagwasak o paglipol; nililinaw ito sa talababa.
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: sa gitna ninyo, Israel
  rationale: Natural na Filipino ang maramihang pagtukoy sa bayan, habang pinananatili ang tuwirang pagtawag sa Israel bilang isang kabuuan.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: Hindi ninyo kayang tumindig sa harap ng inyong mga kaaway
  rationale: Pinananatili ang larawang 'tumindig sa harap' na nangangahulugang makapanatili o makalaban sa mga kaaway.
- source_word: עַד הֲסִירְכֶם
  choice: hangga't hindi ninyo inaalis
  rationale: Ipinahahayag ang hangganang may kondisyong kailangang matupad bago muling makapanindigan ang Israel.
theological_decisions:
- issue: Kahulugan ng חֵרֶם sa konteksto ng banal na digmaan at paghatol
  choice: bagay na itinalaga sa paglipol
  alternative: bagay na lubos na itinalaga; bagay na nasa ilalim ng pagbabawal; isinumpang bagay
  rationale: Hindi lamang ito isang bagay na 'isinumpa,' kundi isang bagay na di-mababawing inilaan, dito ay para sa paglipol. Pinananatili ng salin at talababa ang saklaw at bigat ng termino nang hindi nagdaragdag ng sektaryong paliwanag.
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo sa malinaw at kinikilalang anyong Filipino.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sambayanan” para sa tipanang bayan at ang mas malinaw na pariralang “italaga bilang banal” upang mapanatili ang ugnayan ng dalawang anyo ng ugat קדש. Ang mga panghalip ay maramihan sa pagsasalita sa Israel, bagaman korporatibong isahan ang anyong Hebreo.
