- from: Pagkatapos, isinama ni Josue si Acan na anak ni Zera, pati ang pilak, ang balabal, ang pirasong ginto na hugis-dila[a], ang kanyang mga anak na lalaki at babae, ang kanyang baka, asno, kawan, tolda, at lahat ng pag-aari niya. Sumama kay Josue ang buong Israel, at dinala nila ang mga ito sa Lambak ng Acor.[b]
  to: Pagkatapos, kinuha ni Josue si Acan na anak ni Zera, ang pilak, ang balabal, ang piraso ng gintong hugis-dila[a], ang kanyang mga anak na lalaki at babae, ang kanyang baka, asno, kawan, tolda, at lahat ng pag-aari niya, kasama niya ang buong Israel. Dinala nila ang mga iyon sa Lambak ng Acor.[b]
