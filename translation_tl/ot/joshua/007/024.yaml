  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Josue si Acan na anak ni Zera, ang pilak, ang balabal, ang piraso ng gintong hugis-dila[a], ang kanyang mga anak na lalaki at babae, ang kanyang baka, asno, kawan, tolda, at lahat ng pag-aari niya, kasama niya ang buong Israel. Dinala nila ang mga iyon sa Lambak ng Acor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “dila ng ginto,” ibig sabihin, isang pirasong ginto na hugis-dila; tradisyonal ding isinasalin na “kalso ng ginto.”
    reason: lexical_alternative
  - marker: b
    text: Ang Acor ay kahawig sa tunog ng salitang Hebreo para sa “kaguluhan.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Pagkatapos, isinama ni Josue
  rationale: Ang waw-consecutive ay nagsusulong ng salaysay. Sa kontekstong may mga tao at ari-ariang dinala sa isang lugar, natural sa Filipino ang “isinama” at hindi nito ipinahihiwatig ang dahas na wala sa pandiwa.
- source_word: עָכָן בֶּן זֶרַח
  choice: si Acan na anak ni Zera
  rationale: Ginamit ang nakaugaliang anyong Filipino ng mga pangalang biblikal, at tuwirang pinanatili ang patronimiko.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Literal na pilak ang kahulugan ng כֶּסֶף dito at iyon ang ninakaw na bagay na tinutukoy sa konteksto; hindi ito pinalawak bilang salapi.
- source_word: הָאַדֶּרֶת
  choice: ang balabal
  rationale: Ang אדרת ay isang natatanging panlabas na kasuotan. Ang “balabal” ay malinaw, marangal, at likas sa modernong Filipino.
- source_word: לְשׁוֹן הַזָּהָב
  choice: ang pirasong ginto na hugis-dila
  rationale: Pinananatili nito ang konkretong larawan ng literal na “dila ng ginto” habang nililinaw na isang pirasong ginto ang tinutukoy, nang hindi ito ipinapalagay na espesipikong bareta o kalso.
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: ang kanyang mga anak na lalaki at babae
  rationale: Hayagang pinag-iiba ng Hebreo ang mga anak na lalaki at mga anak na babae, kaya pinanatili ang detalye.
- source_word: שׁוֹרוֹ
  choice: ang kanyang baka
  rationale: Ang שׁוֹר ay tumutukoy sa isang bovine na hayop. Mas pangkaraniwan at hindi masyadong teknikal sa Filipino ang “baka,” habang pinananatili ang isahan.
- source_word: חֲמֹרוֹ
  choice: asno
  rationale: Ang “asno” ang malinaw at dignified na katumbas ng חמור sa Filipino.
- source_word: צֹאנוֹ
  choice: kawan
  rationale: Kolektibong tawag ang צֹאן sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Pinananatili ng “kawan” ang hindi tiyak na uri.
- source_word: אָהֳלוֹ
  choice: tolda
  rationale: Ito ang tuwiran at pangkaraniwang modernong katumbas ng “tent.”
- source_word: כָּל אֲשֶׁר לוֹ
  choice: lahat ng pag-aari niya
  rationale: Natural nitong ipinapahayag sa Filipino ang kabuuan ng mga bagay na kanya.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: Sumama kay Josue ang buong Israel
  rationale: Nililinaw ang malamang na tinutukoy ng hulaping “kasama niya,” si Josue, at iniiwasan ang posibleng maling pagbasa na ang buong Israel ay kabilang sa mga bagay o taong kinuha.
- source_word: וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר
  choice: dinala nila ang mga ito sa Lambak ng Acor
  rationale: Ang “dinala” ay natural na salaysay sa Filipino; ang maramihang “mga ito” ay pinananatili ang saklaw at bahagyang kalabuan ng Hebreong panghalip.
theological_decisions:
- issue: Kung ipahihiwatig ang pagkakasala o kawalang-sala ng pamilya ni Acan
  choice: Inilista lamang ang kanyang mga anak na lalaki at babae nang walang paliwanag tungkol sa kanilang pananagutan
  alternative: Sabihing kasabwat sila, o sabihing naroon lamang sila at hindi pinarusahan
  rationale: Hindi tahasang sinasabi ng talatang ito ang antas ng kanilang kaalaman, pakikibahagi, o pananagutan. Pinananatili ng salin ang tensiyong nasa teksto.
- issue: Saklaw ng maramihang panghalip sa “dinala nila ang mga ito”
  choice: Panatilihin ang maramihang panghalip nang hindi tinutukoy kung alin sa mga nakalista ang humantong sa kasunod na hatol
  alternative: Linawin sa pangunahing teksto na lahat ng tao, hayop, at ari-arian ay pare-parehong pinarusahan
  rationale: Sinasabi lamang ng talata na dinala sila o ang mga ito sa lambak; hindi dapat ipasok sa talatang ito ang interpretasyon ng kasunod na pangyayari.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang mga nakaugaliang anyong Filipino na Josue, Acan, Zera, at Acor. Hinati sa dalawang pangungusap ang mahabang Hebreong pangungusap upang maging malinaw ang kilos ni Josue at ang pagsama ng buong Israel, nang hindi binabago ang pagkakasunod-sunod ng salaysay.
