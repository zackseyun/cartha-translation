  source_fidelity: Ang “isinama” ay bahagyang mas makitid kaysa sa וַיִּקַּח (“kinuha”); ligtas at mas tuwiran ang “kinuha.” Napananatili ng rebisyon ang listahan, ang isahang baka/asno/tolda, ang kolektibong “kawan,” at ang hindi nilulutas na saklaw ng mga taong dinala.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “kinuha ni Josue” at ang hiwalay na pangungusap para sa pagdadala sa lambak. Ang “piraso ng gintong hugis-dila” ay maayos na Filipino at hindi nagtatakda na ito ay kalso o bareta.
  terminology: Pinanatili ang mga nakaugaliang pangalang Josue, Acan, Zera, at Acor; ang “balabal,” “asno,” at “Lambak ng Acor” ay angkop sa marangal ngunit modernong rehistro. Ang talang Acor ay pinasimple upang tumpak na iugnay ang pangalan sa Hebreong salita para sa kaguluhan/trouble nang hindi labis na nagpapaliwanag.
