base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Josue, “Bumangon ka! Bakit ka nakadapa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salaysay na anyo ng אמר; natural sa modernong Filipino ang “Sinabi.”
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: קֻם לָךְ
  choice: Bumangon ka
  rationale: Ang pautos na קֻם ay tuwirang nag-uutos kay Josue na tumigil sa pagkakadapa; ang לָךְ ay idyomatiko at likas na naipapahiwatig ng “ka.”
- source_word: לָמָּה זֶּה
  choice: Bakit
  rationale: Ang “Bakit” ang natural na katumbas sa Filipino; ang karagdagang זֶּה ay nagbibigay-diin ngunit hindi kailangang isalin nang hiwalay sa kontekstong ito.
- source_word: אַתָּה נֹפֵל עַל־פָּנֶיךָ
  choice: ka nakadapa
  rationale: Sa konteksto, inilalarawan ng participle ang kasalukuyang kalagayan ni Josue na nakasubsob ang mukha sa lupa. Ang “nakadapa” ay natural at malinaw na katumbas ng Hebreong idyoma.
theological_decisions:
- issue: Pagbibigay ng pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang banal na pangalan; pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan at hindi bilang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang natural ang Hebreong idyoma na “nahuhulog sa iyong mukha” bilang “nakadapa,” nang hindi dinaragdagan ang kahulugan.
