  source_fidelity: 'Tapat ang salin sa Hebreo: ang וַיֹּאמֶר ay “Sinabi,” ang pangalan ng Diyos ay pinanatiling “Yahweh,” ang קוּם־לְךָ ay likas na “Bumangon ka,” at ang idyomang נֹפֵל עַל־פָּנֶיךָ ay wastong naipahayag bilang “nakadapa.” Ang simpleng “Bakit” ay katanggap-tanggap na natural na pagsasalin ng לָמָּה זֶּה; naipapahiwatig nito ang diin ng tanong nang walang pilit na literalismo.'
