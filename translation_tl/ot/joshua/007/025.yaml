base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: tl
  text: At sinabi ni Josue, “Bakit mo kami ginulo? Guguluhin ka ni Yahweh sa araw na ito.”[a] Binato siya ng buong Israel ng mga bato.[b][c] Sinunog nila sa apoy ang mga iyon at binato nila ang mga iyon ng mga bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iisang pandiwang Hebreo ang nasa “ginulo” at “guguluhin”; pinananatili rito ang pagtutumbasan ng sinabi ni Josue.
    reason: lexical_alternative
  - marker: b
    text: Mula sa isahang “siya,” lumilipat ang Hebreo sa maramihang “ang mga iyon.” Maaaring saklaw nito si Acan kasama ng iba o kasama ng kanyang sambahayan at mga ari-arian; hindi nilulutas ng salin ang tinutukoy ng maramihan.
    reason: alternative_reading
  - marker: c
    text: Dalawang magkaibang pandiwang Hebreo para sa pagbato ang ginamit sa talatang ito; kapuwa tumutukoy sa pagbato gamit ang mga bato.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכֳּרְךָ
  choice: ginulo mo kami / guguluhin ka
  rationale: Ginagamit sa dalawang sugnay ang iisang salitang-ugat upang mapanatili ang pagtutumbasan at paglalaro sa inuulit na pandiwang Hebreo, habang nananatiling malinaw at natural sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: בַּיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili nito ang solemneng diin at agarang panahon ng pariralang Hebreo.
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: pinagbabato siya ... ng mga bato
  rationale: Malinaw nitong ipinahahayag ang pagpatay sa pamamagitan ng pagbato at pinananatili ang tahasang pagbanggit sa bato bilang kasangkapan.
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: sinunog nila sa apoy ang mga iyon
  rationale: Pinananatili ang paglipat ng tekstong Hebreo mula sa isahang “siya” tungo sa maramihang “ang mga iyon,” pati ang tahasang pagbanggit sa apoy.
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: binato [ang mga iyon] ng mga bato
  rationale: Ang ikalawang pandiwang Hebreo para sa pagbato ay isinalin sa natural na Tagalog; nananatili ang maramihang layon nang hindi nilulutas kung sino o ano ang saklaw nito.
theological_decisions:
- issue: Paglipat mula sa isahang layon tungo sa maramihang layon
  choice: Pinanatili ang “siya” sa unang pagbato at “ang mga iyon” sa pagsunog at ikalawang pagbato.
  alternative: Gawing isahan ang lahat ng pagtukoy kay Acan, o tukuying tahasan na mga ari-arian lamang ang saklaw ng maramihan.
  rationale: Tahasan ang paglipat sa Masoretic Text. Pinananatili ng salin ang tensiyong ito at hindi ipinapalagay kung ang maramihan ay tumutukoy sa sambahayan, sa mga ari-arian, o sa kapuwa mga tao at bagay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na pananalita, ang solemneng hatol, ang pangalang Yahweh, at ang hindi malinaw na paglipat mula isahan tungo sa maramihan.
