base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: tl
  text: Pinabagsak ng mga taga-Ai ang humigit-kumulang tatlumpu't anim na lalaki mula sa pangkat ng mga Israelita. Hinabol nila ang mga Israelita mula sa harap ng pintuang-bayan hanggang sa Shebarim[a] at pinabagsak sila sa daang pababa. Kaya natunaw ang puso ng bayan at naging parang tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang sa mga tibagan ng bato” o “hanggang sa mga wasak na lugar.” Maaaring unawain ang Hebreong שְׁבָרִים bilang pangalang-pook o bilang karaniwang pangngalan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: Pinabagsak ... sa kanila
  rationale: Sa konteksto ng labanan, ang נכה ay tumutukoy sa marahas at malamang nakamamatay na pagpabagsak. Pinananatili ng “pinabagsak” ang puwersang militar nang hindi ginagawang tahasang “pinatay” ang hindi tahasang sinabi ng pandiwa.
- source_word: אַנְשֵׁי הָעַי
  choice: mga taga-Ai
  rationale: Likas sa modernong Tagalog ang “mga taga-Ai” para sa mga lalaking mandirigma mula sa lunsod ng Ai; malinaw na ang konteksto ay labanan.
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: humigit-kumulang tatlumpu't anim na lalaki
  rationale: Ipinahahayag ng כ ang pagtatantiya, kaya ginamit ang “humigit-kumulang.” Isinalin ang tahasang אִישׁ bilang “lalaki.”
- source_word: וַיִּרְדְּפוּם
  choice: Hinabol nila
  rationale: Ang “hinabol” ay natural at malinaw na salin ng militar na paghabol na ipinahihiwatig ng רדף.
- source_word: לִפְנֵי הַשַּׁעַר
  choice: mula sa harap ng pintuang-bayan
  rationale: Pinananatili nito ang espasyal na diwa ng לִפְנֵי at nililinaw na tarangkahan ng lunsod ang tinutukoy.
- source_word: עַד הַשְּׁבָרִים
  choice: hanggang sa Shebarim[a]
  rationale: Pinanatili sa pangunahing teksto ang posibleng pangalang-pook, samantalang inilagay sa talababa ang leksikal na alternatibo.
- source_word: בַּמּוֹרָד
  choice: sa daang pababa
  rationale: Likas sa Tagalog at malinaw na inilalarawan nito ang pababang bahagi ng ruta o dalisdis.
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: natunaw ang puso ng bayan
  rationale: Pinananatili ang matingkad na Hebreong metapora ng lubos na pagkawala ng tapang sa halip na palitan lamang ito ng paliwanag.
- source_word: וַיְהִי לְמָיִם
  choice: naging parang tubig
  rationale: Pinananatili ang kasunod na larawang Hebreo at ipinakikitang paghahambing ito sa natural na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkakaugnay na metaporang “natunaw ang puso” at “naging parang tubig,” at iniwasang gawing tahasang paliwanag lamang ang pagkawala ng tapang.
