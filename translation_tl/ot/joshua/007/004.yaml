  source_fidelity: Kailangang isalin ang וַיַּעֲלוּ bilang galaw na ‘umakyat’ o ‘pumaitaas.’ Ang ‘humayo’ ay nagsasaad lamang ng pag-alis/pagpunta at hindi pinananatili ang mahalagang direksiyong nasa pandiwang Hebreo. Wasto ang pagtatantiyang ‘humigit-kumulang,’ ang ‘mula sa bayan’ para sa מִן־הָעָם, at ang pagtukoy sa mga lalaki ng Ai.
  naturalness: Natural at marangal ang pangungusap matapos palitan ang ‘humayo’ ng ‘umakyat.’ Ang ‘tumakas sila sa harap ng’ ay katanggap-tanggap na pormal na Tagalog sa salaysay at malinaw na tumutukoy sa pagtakas mula sa mga taga-Ai.
