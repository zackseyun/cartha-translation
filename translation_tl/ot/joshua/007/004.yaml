translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘humayo’ upang maging natural ang galaw patungo sa Ai, at ‘bayan’ para sa kolektibong Israel nang hindi ipinapalagay na ang salitang Hebreo mismo ay nangangahulugang hukbo. Walang kailangang talababa sa talatang ito.
