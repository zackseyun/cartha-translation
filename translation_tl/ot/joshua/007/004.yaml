  yaml_path: translation/ot/joshua/007/004.yaml
  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: tl
  text: Kaya, umakyat roon ang humigit-kumulang tatlong libong lalaki mula sa bayan, ngunit tumakas sila sa harap ng mga lalaki ng Ai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: humayo
  rationale: Ang pandiwang עלה ay literal na ‘umahon/pumaitaas,’ ngunit sa konteksto ng pagpunta sa Ai, mas natural sa modernong Tagalog ang ‘humayo’ nang hindi idinaragdag sa mismong pandiwa ang ideya ng pagsalakay.
- source_word: מִן הָעָם
  choice: mula sa bayan
  rationale: Ang עַם ay ‘bayan’ o ‘sambayanan’; dito, tumutukoy ito sa pangkat na kinuha mula sa Israel. Pinananatili ng ‘mula sa bayan’ ang kolektibong diwa nang hindi ito pinakikitid sa ‘hukbo.’
- source_word: שָׁמָּה
  choice: roon
  rationale: Ipinahihiwatig ng pang-abay ang patutunguhan na nabanggit na sa konteksto; ang ‘roon’ ang maikli at natural na katumbas.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: humigit-kumulang tatlong libong lalaki
  rationale: Ang כִּ sa bilang ay nagpapahayag ng pagtatantiya. Ang אִישׁ ay panukat sa mga tao, kaya ‘lalaki’ ang ginamit sa halip na idagdag ang mas tiyak na ‘kawal.’
- source_word: וַיָּנֻסוּ
  choice: tumakas sila
  rationale: Ang נוס ay nangangahulugang ‘tumakas’ o ‘tumakas palayo’; malinaw at angkop sa salaysay ang ‘tumakas sila.’
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Sa konstruksiyong ito, inilalarawan ng לִפְנֵי ang pag-urong mula sa presensiya ng kalaban. Pinananatili ng ‘sa harap ng’ ang larawang Hebreo at likas pa rin sa pormal na salaysay.
- source_word: אַנְשֵׁי הָעָי
  choice: mga lalaki ng Ai
  rationale: Ang אַנְשֵׁי ay construct plural ng אִישׁ at tumutukoy rito sa mga lalaking tagapagtanggol o mandirigma ng lunsod. Hindi idinagdag ang ‘kawal’ sapagkat hindi iyon tahasang nasa parirala; pinanatili ang Ai bilang pangalan ng lugar.
