  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: חָטָא֙ יִשְׂרָאֵ֔ל וְ/גַם֙ עָבְר֣וּ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי אוֹתָ֑/ם וְ/גַ֤ם לָֽקְחוּ֙ מִן הַ/חֵ֔רֶם וְ/גַ֤ם גָּֽנְבוּ֙ וְ/גַ֣ם כִּֽחֲשׁ֔וּ וְ/גַ֖ם שָׂ֥מוּ בִ/כְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: tl
  text: Nagkasala ang Israel. Nilabag din nila ang aking tipang ipinag-utos kong sundin nila. Kumuha rin sila ng ilan sa mga bagay na itinalagang lipulin[a]; nagnakaw din sila, nanlinlang din sila[b], at inilagay rin nila ang mga iyon kasama ng sarili nilang mga pag-aari[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “mula sa mga bagay na itinalaga” o “mula sa mga bagay na nasa ilalim ng pagbabawal.” Sa kontekstong ito, ang mga iyon ay itinalagang lipulin at hindi maaaring angkinin.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nagsinungaling sila” o “ikinaila nila iyon.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “sa kanilang mga sisidlan/kagamitan.” Tumutukoy ang parirala sa paglalagay o pagtatago ng mga ipinagbabawal na bagay kasama ng sarili nilang mga pag-aari.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָא
  choice: nagkasala
  rationale: Tuwirang ipinahahayag ng pandiwa ang pagkakasala laban sa Diyos at pinananatili nito ang bigat na moral at teolohikal ng Hebreo.
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinananatili ang kolektibong paksa ng Hebreo. Bagaman si Acan ang tuwirang gumawa, ang buong Israel ang tinutukoy ng talata.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: nilabag nila ang aking tipan
  rationale: Likas at malinaw sa modernong Tagalog ang “nilabag” para sa paglabag sa hangganan at pananagutan ng tipan.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: na iniutos ko sa kanila
  rationale: Malapit ito sa payak na pahayag ng Hebreo at hindi tahasang nagdaragdag ng “na sundin,” bagaman iyon ang ipinahihiwatig.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: kumuha sila mula sa mga bagay na itinalagang lipulin
  rationale: 'Ipinababatid nito ang kontekstuwal na diwa ng חֵרֶם: mga bagay na inilaan sa Diyos sa pamamagitan ng ganap na paglipol o pagbabawal na angkinin.'
- source_word: גָּנְבוּ
  choice: nagnakaw din sila
  rationale: Tuwirang katumbas ito ng pandiwa at pinananatili ng “din” ang naiipong diin ng sunod-sunod na mga paratang.
- source_word: כִּחֲשׁוּ
  choice: nagsinungaling din sila
  rationale: Malinaw at maikli ito sa kontekstong moral at hudisyal, habang inilalahad sa talababa ang saklaw na maaari ring mangahulugang nanlinlang o nagkaila.
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: inilagay pa nila ang mga iyon sa sarili nilang mga gamit
  rationale: Malawak ang kahulugan ng כְּלִים—mga sisidlan, kagamitan, o pag-aari. Ang “mga gamit” ay natural at hindi labis na makitid; ipinahihiwatig ng konteksto na itinago ang mga bagay kasama ng kanilang pag-aari.
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: din ... rin ... din ... din ... pa
  rationale: Pinananatili ang paulit-ulit at tumitinding retorika ng Hebreo sa paraang natural sa Tagalog; ginagamit ang “pa” sa huling sugnay upang ipakita ang karagdagang paratang.
theological_decisions:
- issue: Kolektibong pagbibintang ng kasalanan sa Israel kahit isang tao ang tuwirang gumawa
  choice: Panatilihin ang “ang Israel” bilang kolektibong paksa at ang maramihang panghalip na “nila.”
  alternative: Limitahan ang pahayag kay Acan sa pamamagitan ng pagpapaliwanag o paraphrase.
  rationale: Tahasang iniuugnay ng tekstong Hebreo ang kasalanan sa Israel bilang bayang nasa tipan. Hindi dapat alisin ng salin ang tensiyong ito sa pamamagitan ng pagliit ng pananagutan kay Acan lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang kolektibong “Israel,” ang sunod-sunod na diin ng וְגַם sa pamamagitan ng paulit-ulit na “din/rin/pa,” at ang leksikal na lawak ng חֵרֶם, כִּחֲשׁוּ, at כְּלִים sa mga talababa.
