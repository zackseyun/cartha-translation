revisions:
- from: Nagkasala ang Israel. Nilabag din nila ang aking tipan na iniutos ko sa kanila. Kumuha rin sila mula sa mga bagay na itinalagang lipulin[a]; nagnakaw din sila, nagsinungaling din sila[b], at inilagay pa nila ang mga iyon sa sarili nilang mga gamit[c].
  to: Nagkasala ang Israel. Nilabag din nila ang aking tipang ipinag-utos kong sundin nila. Kumuha rin sila ng ilan sa mga bagay na itinalagang lipulin[a]; nagnakaw din sila, nanlinlang din sila[b], at inilagay rin nila ang mga iyon kasama ng sarili nilang mga pag-aari[c].
  rationale: Inayos ang dalawang di-likas na konstruksyon, nilinaw ang partitive na “ilan sa,” at ginamit ang mas malawak na “nanlinlang” para sa כִּחֲשׁוּ. Pinanatili ang kolektibong pananagutan ng Israel, ang pag-uulit ng mga paratang, at ang mga anchor ng talababa.
