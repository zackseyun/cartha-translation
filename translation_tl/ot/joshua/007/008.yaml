base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: tl
  text: O[a] Panginoon, ano ang sasabihin ko matapos tumalikod ang Israel sa harap ng mga kaaway nito?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo rito ay nagpapahayag ng taimtim at magalang na pakiusap; maaari ring isaling “Nakikiusap ako, Panginoon.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “iniharap ang likod o batok sa mga kaaway nito,” isang idyomang Hebreo para sa pag-urong sa labanan.
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: O
  rationale: Ang salitang Hebreo ay pantawag na nagpapahayag ng taimtim at magalang na pagsusumamo sa isang nakatataas. Ang “O” ay natural at marangal sa panalangin sa Filipino; ipinaliliwanag sa talababa ang diwa ng pakiusap.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Dito, ito ay banal na titulong tuwirang itinatawag sa Diyos. Ang “Panginoon” ang karaniwan at magalang na salin, nang hindi ipinapalit dito ang pangalan ng tipan na wala sa talata.
- source_word: מָה אֹמַר
  choice: ano ang sasabihin ko
  rationale: Pinananatili nito ang payak na tanong sa Hebreo at ang retorikal na kawalang-magawa ni Josue, nang hindi dinaragdagan ng “pa” o binabago tungo sa tahasang pahayag.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: matapos
  rationale: Likas nitong ipinakikilala sa Filipino ang pangyayaring pinagmulan ng tanong ni Josue.
- source_word: הָפַךְ עֹרֶף
  choice: tumalikod
  rationale: Ang pariralang literal na tumutukoy sa pagharap ng likod o batok ay isang idyomang militar para sa pag-urong sa pagkatalo. Ang “tumalikod” ay nagpapanatili sa larawan ng Hebreo, habang nililinaw ng talababa ang kahulugan nito.
- source_word: לִפְנֵי אֹיְבָיו
  choice: sa harap ng mga kaaway nito
  rationale: Ang “sa harap ng” ay malapit sa anyo ng Hebreo at ang “nito” ay natural na tumutukoy sa Israel bilang isang bansa o sambayanan.
theological_decisions:
- issue: Pagsasalin sa banal na titulong אֲדֹנָי
  choice: Panginoon
  alternative: aking Panginoon
  rationale: Sa ganitong tuwirang pananalangin, ang anyo ay gumaganap bilang nakaugaliang banal na titulo. Ang “Panginoon” ay nagpapanatili ng magalang na pagtawag sa Diyos nang hindi labis na iginigiit ang pagmamay-aring maaaring ipahiwatig ng “aking.”
- issue: Pagpapahayag sa pagkatalo ng Israel
  choice: tumalikod ... sa harap ng mga kaaway nito
  alternative: umurong mula sa mga kaaway nito
  rationale: Pinananatili sa pangunahing teksto ang kongkretong idyoma ng Hebreo at ipinapaliwanag sa talababa na tumutukoy ito sa pag-urong sa labanan. Sa gayon, hindi nawawala ang orihinal na larawan ngunit malinaw pa rin ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa isang panalangin ng matinding dalamhati. Pinanatili ang maigsi at retorikal na anyo ng Hebreo, pati ang larawang “tumalikod,” habang inilagay sa talababa ang paliwanag sa idyomang militar.
