base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: tl
  text: Sumagot si Acan kay Josue at sinabi, “Tunay ngang nagkasala ako laban kay Yahweh, ang Diyos ng Israel. Ganito ang ginawa ko[a]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ganito at ganito ang ginawa ko.” Idyomang Hebreo ito na nagpapakilala sa mga detalyeng susunod tungkol sa kaniyang ginawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang gamit sa salaysay para sa tugon sa taong kinakausap; natural at pormal pa rin sa makabagong Tagalog.
- source_word: עָכָן
  choice: Acan
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Pinananatili ang magkasunod na pandiwang Hebreo na 'sumagot ... at sinabi' nang hindi nagiging di-natural.
- source_word: אָמְנָה
  choice: Tunay ngang
  rationale: Ipinahahayag ang mariin at taimtim na pagkilala sa kasalanan.
- source_word: אָנֹכִי חָטָאתִי
  choice: nagkasala ako
  rationale: Ang hayag na panghalip ay may diin; natural itong naipahihiwatig sa Tagalog sa pagkakalagay ng 'ako' at sa konteksto ng personal na pag-amin.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Sa kasamang חטא, tinutukoy ng ל ang Diyos na pinagkasalahan; ang 'kay' ang natural na Tagalog para sa personal na pantukoy.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang konstrakto na nagpapakilala kay Yahweh.
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: Ganito ang ginawa ko
  rationale: Idyomatikong pormula itong nagpapakilala sa mga detalyeng susunod; malinaw at natural ang 'Ganito ang ginawa ko' sa modernong Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal at tipanang pangalan nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Ang ugnayan ng חטא at ל
  choice: nagkasala ako kay Yahweh
  alternative: nagkasala ako laban kay Yahweh
  rationale: Parehong maaaring ipahayag ang Diyos bilang pinagkasalahan, ngunit mas likas sa pangkalahatang Tagalog ang 'nagkasala kay'; hindi nito binabago ang moral at teolohikal na bigat ng pag-amin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang literal na 'ganito at ganito' dahil ang pariralang Hebreo ay idyomang nagpapakilala sa mga detalyeng ilalahad sa susunod na talata.
