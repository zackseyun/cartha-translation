base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: tl
  text: Kaya nagsugo si Josue ng mga mensahero, at tumakbo sila sa tolda. At naroon nga ito, nakatago sa loob ng tolda niya, at ang pilak ay nasa ilalim nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kasama ang pilak sa ilalim nito.” Payak na pinag-uugnay ng Hebreo ang “at ang pilak” sa naunang pahayag, kaya maaari itong unawain bilang karagdagang detalye sa tagpo o bilang hiwalay na sugnay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Karaniwang salin ng שלח sa salaysay; malinaw na ipinadala ni Josue ang mga tauhan upang gampanan ang isang utos.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Mga taong isinugo ni Josue ang tinutukoy rito, hindi mga anghel. Pinananatili ng “mga mensahero” ang pangkalahatang kahulugan ng salita.
- source_word: וַיָּרֻצוּ
  choice: tumakbo sila
  rationale: Tuwirang inilalarawan ng רוץ ang pagtakbo at pinananatili nito ang mabilis at masiglang kilos sa salaysay.
- source_word: הָאֹהֱלָה
  choice: papunta sa tolda
  rationale: Ipinahihiwatig ng directional he ang pagkilos patungo sa tolda. Hindi idinagdag sa teksto ang pangalan ni Acan sapagkat “ang tolda” lamang ang nasa Hebreo.
- source_word: וְהִנֵּה
  choice: Naroon nga
  rationale: Natural na pahayag sa modernong Filipino na naghahayag ng biglaang pagkakita o pagkakatuklas, habang pinananatili ang dramatikong diin ng הִנֵּה.
- source_word: טְמוּנָה
  choice: nakatago iyon
  rationale: Isinasalin ang pambabaeng isahang anyo bilang isang bagay na itinago. Hindi ginamit ang “nakabaon” dahil mas tiyak iyon kaysa sa mismong kahulugan ng salita.
- source_word: בְּאָהֳלוֹ
  choice: sa loob ng tolda niya
  rationale: Tuwirang lokatibong parirala; ang panlalaking isahang hulapi ay tumutukoy kay Acan ayon sa konteksto.
- source_word: וְהַכֶּסֶף
  choice: at ang pilak
  rationale: Pinananatili ang payak na koordinasyon ng Hebreo sa halip na tahasang ipakahulugang kasama lamang ito ng naunang bagay.
- source_word: תַּחְתֶּיהָ
  choice: nasa ilalim nito
  rationale: Ang pambabaeng isahang hulapi ay pinakamalamang na tumutukoy sa balabal na binanggit sa naunang talata. Ang “nito” ay likas sa Filipino at hindi inuulit ang pangngalang wala sa talatang ito.
