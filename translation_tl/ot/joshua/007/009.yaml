  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יִשְׁמְע֣וּ הַֽ/כְּנַעֲנִ֗י וְ/כֹל֙ יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נָסַ֣בּוּ עָלֵ֔י/נוּ וְ/הִכְרִ֥יתוּ אֶת שְׁמֵ֖/נוּ מִן הָ/אָ֑רֶץ וּ/מַֽה תַּעֲשֵׂ֖ה לְ/שִׁמְ/ךָ֥ הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: tl
  text: Sapagkat mababalitaan ito ng mga Cananeo at ng lahat ng naninirahan sa lupain; paliligiran nila kami at papawiin ang aming pangalan sa lupa[a]. Ano ang gagawin mo alang-alang sa iyong dakilang pangalan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “papawiin ang aming pangalan sa lupa” ay idyomang Hebreo para sa paglipol sa isang bayan at pagpawi sa patuloy nitong pag-iral at alaala.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: mababalitaan ito
  rationale: 'Ang Qal imperfect ay tumutukoy sa inaasahang mangyayari: malalaman ng mga bansa ang pagkatalo ng Israel. Idinagdag ang “ito” bilang likas na layon sa Filipino ayon sa konteksto.'
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang pagtukoy nito sa pangkat ng mga Cananeo.
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: at ng lahat ng naninirahan sa lupain
  rationale: Ang יֹשְׁבֵי ay tumutukoy sa mga naninirahan, at ang הָאָרֶץ dito ay ang lokal na lupain, hindi ang buong daigdig.
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: Paliligiran nila kami
  rationale: Ang נסב na may עַל ay natural na tumutukoy sa pag-ikot o pagkubkob sa isang kalaban.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: lilipulin kami nang lubusan[a]
  rationale: Ang literal na “puputulin ang aming pangalan mula sa lupa” ay isang idyomang Hebreo para sa lubusang pagpuksa sa isang bayan at sa pagpawi ng patuloy nitong pag-iral at alaala. Isinalin nang natural sa pangunahing teksto at pinanatili ang literal na larawan sa talababa.
- source_word: וּמַה תַּעֲשֶׂה
  choice: Kung magkagayon, ano ang gagawin mo
  rationale: Pinananatili ang tuwirang tanong sa Diyos; ang “kung magkagayon” ay likas na naghahayag sa Filipino ng bunga ng naunang pangamba.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: alang-alang sa iyong dakilang pangalan
  rationale: Sa konteksto, ang לְ ay nagpapahayag ng malasakit para sa pangalan, dangal, at reputasyon ng Diyos sa harap ng mga bansa.
theological_decisions:
- issue: Kahulugan ng “iyong dakilang pangalan” sa panawagan ni Josue
  choice: Panawagan ito hinggil sa dangal at reputasyon ng Diyos sa harap ng mga bansa, na kaugnay ng kapalaran ng Israel.
  alternative: Maaaring basahin bilang pangkalahatang malasakit lamang sa pangalan ng Diyos na walang hayag na kaugnayang tipan.
  rationale: Ipinakikita ng konteksto na nangangamba si Josue na ang pagkalipol ng Israel ay makaaapekto sa pagkilala ng mga nakapaligid na bansa sa PANGINOON. Hindi pinalalawak ng salin ang pahayag nang higit sa sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Cananeo,” “lupain,” at “alang-alang” bilang mga salitang madaling maunawaan ngunit angkop sa banal na kasulatan. Iniwasan ang sobrang literal na idyoma sa pangunahing teksto upang hindi magmukhang pagkawala lamang ng reputasyon ang banta.
