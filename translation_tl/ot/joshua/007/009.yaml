- from: Sapagkat mababalitaan ito ng mga Cananeo at ng lahat ng naninirahan sa lupain. Paliligiran nila kami at lilipulin kami nang lubusan[a]. Kung magkagayon, ano ang gagawin mo alang-alang sa iyong dakilang pangalan?
  to: Sapagkat mababalitaan ito ng mga Cananeo at ng lahat ng naninirahan sa lupain; paliligiran nila kami at papawiin ang aming pangalan sa lupa[a]. Ano ang gagawin mo alang-alang sa iyong dakilang pangalan?
  rationale: Ibinalik sa pangunahing teksto ang “aming pangalan” upang mapanatili ang imahen at retorika ng Hebreo, habang pinanatiling malinaw sa talababa ang idiomatikong kahulugan nito. Inalis ang hindi kinakailangang “Kung magkagayon” upang hindi magdagdag ng pananalita na wala sa pinagmulan.
