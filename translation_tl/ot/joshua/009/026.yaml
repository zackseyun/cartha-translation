base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: tl
  text: Kaya ginawa niya ito para sa kanila, at iniligtas niya sila mula sa kamay ng mga anak ni Israel[a], at hindi sila pinatay ng mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: Kaya gayon ang ginawa niya para sa kanila
  rationale: Pinananatili ng “gayon ang ginawa” ang idyomang עשה כן at ang pagbabalik nito sa naunang pasiya o kilos, habang natural pa rin sa makabagong Tagalog.
- source_word: וַיַּצֵּל
  choice: iniligtas niya
  rationale: Ang Hiphil ng נצל ay nangangahulugang magligtas o mag-agaw mula sa panganib; ang “iniligtas” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: אוֹתָם
  choice: sila
  rationale: Tuwirang layon ito na tumutukoy sa mga Gibeonita; sa Tagalog, ginagamit ang “sila” bilang panghalip na layon pagkatapos ng pandiwa.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili nito ang konkretong Hebreong talinghaga ng kamay bilang kapangyarihan o kontrol, at nauunawaan pa rin sa dignified na Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit itong tumutugma sa tahasang anyong Hebreo at pinananatili ang tradisyonal na pambansang katawagan; inilalagay sa talababa ang mas natural na “mga Israelita.”
- source_word: וְלֹא הֲרָגוּם
  choice: at hindi sila pinatay ng mga ito
  rationale: Ang “pinatay” ang payak na kahulugan ng הרג. Nililinaw ng “mga ito” na ang pangmaramihang simuno ay ang mga anak ni Israel, hindi si Josue, nang hindi binabago ang ugnayang ipinahihiwatig ng Hebreo.
theological_decisions:
- issue: May kasariang pangkalahatang katawagan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Tahasan sa Hebreo ang panlalaking pangmaramihang “mga anak ni Israel,” bagaman isa rin itong nakaugaliang katawagan para sa buong bayan. Pinananatili sa teksto ang anyong pinagmulan at ibinibigay sa talababa ang likas na pambansang katumbas nang hindi ipinipilit ang isang teolohikal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang sunod-sunod na mga sugnay na pinag-uugnay ng “at,” gayundin ang talinghagang “mula sa kamay,” upang manatiling malapit sa anyo at diin ng Hebreo.
