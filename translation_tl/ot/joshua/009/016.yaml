base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: tl
  text: At nangyari, pagkaraan ng tatlong araw mula nang makipagtipan sila sa mga iyon, nabalitaan nila na malapit sa kanila ang mga iyon at naninirahan sa gitna nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: pagkaraan ng tatlong araw
  rationale: Natural na Filipino para sa Hebreong panandang-panahon na literal na 'sa dulo ng tatlong araw.'
- source_word: כָּרְתוּ לָהֶם בְּרִית
  choice: makipagtipan sila sa mga iyon
  rationale: Pinananatili ang diwa ng idyomang Hebreo na 'pumutol ng tipan' sa karaniwang salitang Filipino na 'makipagtipan.'
- source_word: קְרֹבִים הֵם אֵלָיו
  choice: malapit lamang sa kanila ang mga iyon
  rationale: Ang panghalip na isahan sa Hebreo ay kolektibong tumutukoy sa Israel; ginawang maramihan sa Filipino para sa malinaw at natural na pagtukoy.
- source_word: וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: naninirahan sa kanilang nasasakupan
  rationale: Ipinahahayag ang spatial na diwang 'sa gitna nito/niya' bilang paninirahan sa teritoryong kinabibilangan ng Israel, nang hindi ipakahulugang nakihalo na sila sa mismong pamayanan.
theological_decisions:
- issue: Ang saklaw ng בְּקִרְבּוֹ
  choice: sa kanilang nasasakupan
  alternative: kasama nila / sa gitna nila
  rationale: Sa konteksto, ang natuklasan ay malapit ang mga Gibeonita at nakatira sa lupaing kinaroroonan ng Israel. Iniiwasan ng salin ang posibleng maling pahiwatig na dati na silang naninirahang kahalo ng kampo ng Israel.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'mga iyon' upang malinaw na maiba ang mga Gibeonita sa kolektibong 'sila' na tumutukoy sa Israel.
