revisions:
- from: At nangyari, pagkaraan ng tatlong araw mula nang makipagtipan sila sa mga iyon, nabalitaan nilang malapit lamang sa kanila ang mga iyon at naninirahan sa kanilang nasasakupan.
  to: At nangyari, pagkaraan ng tatlong araw mula nang makipagtipan sila sa mga iyon, nabalitaan nila na malapit sa kanila ang mga iyon at naninirahan sa gitna nila.
  rationale: Inalis ang dagdag na diin ng «lamang» at pinalitan ang interpretatibong «sa kanilang nasasakupan» ng «sa gitna nila,» na mas malapit sa Hebreo at pinananatili ang saklaw na hindi ganap na tinutukoy ng panghalip sa pinagmulan.
