  text: וּ/נְעָל֨וֹת בָּל֤וֹת וּ/מְטֻלָּאוֹת֙ בְּ/רַגְלֵי/הֶ֔ם וּ/שְׂלָמ֥וֹת בָּל֖וֹת עֲלֵי/הֶ֑ם וְ/כֹל֙ לֶ֣חֶם צֵידָ֔/ם יָבֵ֖שׁ הָיָ֥ה נִקֻּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: tl
  text: Nakasuot sila ng mga pudpod at tagpi-tagping sandalyas sa kanilang mga paa, at ng mga damit na pudpod. Ang lahat ng tinapay na baon nila ay tuyot at pira-piraso[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inaamag.” Bihira ang salitang Hebreo at maaaring tumukoy sa tuyong tinapay na nagkapira-piraso, bagaman inuunawa ito ng ilan bilang “inaamag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: mga sandalyas
  rationale: Tumutukoy sa karaniwang uri ng sapin sa paa sa sinaunang Malapit na Silangan; mas tiyak at likas dito ang “sandalyas” kaysa sa pangkalahatang “sapatos.”
- source_word: בָּלוֹת
  choice: pudpod
  rationale: Ipinahihiwatig ng salita ang pagkasira dahil sa katagalan o paggamit. Ang “pudpod” ay angkop kapwa sa sandalyas at damit at hindi lamang nagsasabing luma ang mga ito.
- source_word: מְטֻלָּאוֹת
  choice: tagpi-tagpi
  rationale: Ipinakikita ng anyong balintiyak na inayos ang mga sandalyas sa pamamagitan ng pagtatagpi; natural at malinaw sa modernong Filipino ang “tagpi-tagpi.”
- source_word: בְּרַגְלֵיהֶם
  choice: sa kanilang mga paa
  rationale: Pinananatili ang kongkretong lokatibong detalye ng Hebreo.
- source_word: שְׂלָמוֹת
  choice: mga damit
  rationale: Pangkalahatang katawagan ito sa kasuotan; malinaw at natural ang “mga damit” nang hindi labis na tinutukoy ang uri nito.
- source_word: עֲלֵיהֶם
  choice: Nakasuot sila ... ng
  rationale: Isinama sa natural na konstruksiyong Filipino ang ideyang nasa katawan nila ang mga kasuotan, sa halip na gamitin ang pilit na literal na “sa ibabaw nila.”
- source_word: לֶחֶם צֵידָם
  choice: tinapay na baon nila
  rationale: Pinananatili ang tiyak na “tinapay,” habang likas na ipinahahayag ng “baon” na bahagi ito ng kanilang panustos sa paglalakbay.
- source_word: יָבֵשׁ הָיָה
  choice: ay tuyo ... na
  rationale: Tuwirang inilalarawan ang kalagayan ng tinapay; ipinahihiwatig ng “na” na ganito na ang sinasabing kalagayan nito.
- source_word: נִקֻּדִים
  choice: duróg
  rationale: Bihira at di-tiyak ang salitang Hebreo. Sa konteksto, maaaring tumukoy ito sa tinapay na natuyo at nagkapira-piraso; pinananatili ng “duróg” ang malamang na pisikal na kalagayan nang hindi isinasara ang alternatibong “inaamag,” na inilagay sa talababa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “Nakasuot sila” upang maging natural ang magkakaugnay na paglalarawan sa mga sandalyas at damit, habang pinanatili ang kongkretong detalye ng mga paa at tinapay. Inilagay ang talababa sa mismong salitang pinagtatalunan, “duróg,” sa halip na sa pariralang tungkol sa mga paa.
