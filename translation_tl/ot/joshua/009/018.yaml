  to: 'Ngunit hindi sila sinaktan ng mga Israelita[a], sapagkat ang mga pinuno ng sambayanan ay nanumpa sa kanila sa pangalan ni Yahweh, ang Diyos ng Israel. At nagreklamo ang buong sambayanan laban sa mga pinuno.


    [a] Maaari ring “hindi sila sinalakay” o “hindi sila pinatay.” Ang pandiwang Hebreo ay tumutukoy sa pananakit o paghampas at, sa kontekstong ito, maaaring magpahiwatig ng pagpatay.'
