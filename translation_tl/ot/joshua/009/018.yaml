revisions:
- from: 'Ngunit hindi sila pinatay ng mga Israelita[a], sapagkat ang mga pinuno ng sambayanan ay nanumpa sa kanila sa pangalan ni Yahweh, ang Diyos ng Israel. Kaya nagreklamo ang buong sambayanan laban sa mga pinuno.


