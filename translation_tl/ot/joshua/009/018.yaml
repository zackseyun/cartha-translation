  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: tl
  text: 'Ngunit hindi sila sinaktan ng mga Israelita[a], sapagkat ang mga pinuno ng sambayanan ay nanumpa sa kanila sa pangalan ni Yahweh, ang Diyos ng Israel. At nagreklamo ang buong sambayanan laban sa mga pinuno.


    [a] Maaari ring “hindi sila sinalakay” o “hindi sila pinatay.” Ang pandiwang Hebreo ay tumutukoy sa pananakit o paghampas at, sa kontekstong ito, maaaring magpahiwatig ng pagpatay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi sila sinalakay” o “hindi sila pinatay.” Ang pandiwang Hebreo ay tumutukoy sa pananakit o paghampas at, sa kontekstong ito, maaaring magpahiwatig ng pagpatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּם
  choice: pinatay sila
  rationale: Ang נכה ay literal na ‘humampas/sumakit,’ ngunit sa kontekstong militar ng talata ay tumutukoy sa marahas at malamang na nakamamatay na pagkilos. Natural sa Tagalog ang ‘pinatay,’ habang inilalahad sa talababa ang mas malawak na saklaw.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at malinaw na katumbas sa modernong Tagalog ng Hebreong idyomang ‘mga anak na lalaki ng Israel,’ na tumutukoy sa bayang Israel bilang kabuuan.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: mga pinuno ng sambayanan
  rationale: Ang נְשִׂיאִים ay mga kinikilalang pinuno, at ang עֵדָה rito ay ang organisadong pamayanan ng Israel. Ang ‘sambayanan’ ay marangal at likas sa Tagalog nang hindi nagpapahiwatig ng isang institusyong pansimbahan.
- source_word: נִשְׁבְּעוּ לָהֶם בַּיהוָה
  choice: nanumpa sa kanila sa pangalan ni Yahweh
  rationale: Ipinahahayag nito na ang sumpa ay ibinigay sa mga Gibeonita at pinagtibay sa pamamagitan ng banal na pangalan. Mas natural sa Tagalog ang ‘sa pangalan ni’ kaysa sa literal na ‘sa pamamagitan ni.’
- source_word: וַיִּלֹּנוּ
  choice: nagreklamo
  rationale: Ang pandiwa ay tumutukoy sa sama-samang pagrereklamo o pagbulong laban sa mga pinuno. Ang ‘nagreklamo’ ay malinaw at kasalukuyang gamit sa Filipino.
- source_word: כָל הָעֵדָה
  choice: buong sambayanan
  rationale: Pinananatili nito ang kabuuang puwersa ng כָל at ang kolektibong kahulugan ng עֵדָה.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng עֵדָה
  choice: sambayanan
  alternative: kapulungan; kongregasyon
  rationale: Ang ‘sambayanan’ ay tumutukoy sa Israel bilang sama-samang pamayanang tipan at umiiwas sa posibleng makitid na makabagong kahulugang pansimbahan ng ‘kongregasyon.’
- issue: Bunga ng הִכּוּם
  choice: pinatay sila
  alternative: sinalakay sila; sinaktan sila
  rationale: Ipinahihiwatig ng salaysay ang pag-iwas sa nakamamatay na aksiyong militar, ngunit hindi lubusang tinutukoy ng pandiwa lamang ang resulta. Kaya inilalagay sa talababa ang mga mas literal at hindi gaanong tiyak na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas basahin. Ginamit ang ‘mga Israelita’ sa halip na literal na ‘mga anak na lalaki ng Israel,’ at ‘sambayanan’ para sa kolektibong pamayanan. Pinanatili ang pangalang Yahweh.
