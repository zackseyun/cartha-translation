  source_fidelity: Tumpak na naipapahayag ng salin ang pasalungat na tugon ng mga pinuno, ang panunumpang ginawa kay Yahweh na Diyos ng Israel, at ang kasalukuyang hadlang na bunga nito. Ang “galawin” ay angkop na literal-idyomatikong katumbas ng לִנְגֹּעַ sa kontekstong ito.
