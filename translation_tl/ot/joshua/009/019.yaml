  terminology: Wasto at pare-pareho ang “mga pinuno” para sa נְשִׂיאִים, “kapulungan” para sa עֵדָה, at “Yahweh, ang Diyos ng Israel” para sa banal na pangalan at construct chain. Ang talababa ay wastong nakakabit sa “galawin” at nagbibigay ng kinakailangang saklaw na idyomatiko.
