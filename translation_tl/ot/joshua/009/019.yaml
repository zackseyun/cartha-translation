  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: tl
  text: Ngunit sinabi ng lahat ng pinuno sa buong kapulungan, “Nanumpa kami sa kanila sa pangalan ni Yahweh, ang Diyos ng Israel, kaya ngayon ay hindi namin sila maaaring galawin[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “saktan” o “salakayin”; literal, “hipuin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ngunit sinabi
  rationale: Bagaman karaniwang ipinagpapatuloy ng waw-consecutive ang salaysay bilang “at sinabi,” pasalungat ang tugon ng mga pinuno sa reklamo ng kapulungan sa konteksto; natural itong ipinahahayag ng “Ngunit.”
- source_word: כָל הַנְּשִׂיאִים
  choice: lahat ng pinuno
  rationale: Ang נָשִׂיא ay tumutukoy rito sa mga namumunong kinatawan ng Israel. Mas malinaw at makabago ang “mga pinuno” kaysa “mga prinsipe.”
- source_word: כָּל הָעֵדָה
  choice: buong kapulungan
  rationale: Ang עֵדָה ay ang sama-samang pamayanan o kapulungan ng Israel; pinananatili ng “buong kapulungan” ang kolektibong diwa at ang כָל.
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: Nanumpa kami sa kanila
  rationale: Ang Niphal ng שׁבע ay “manumpa” o “gumawa ng panunumpa.” Ipinahihiwatig ng konteksto na nananatiling may bisa ang nagawang sumpa.
- source_word: בַּיהוָה
  choice: sa pangalan ni Yahweh
  rationale: Kasama ng pandiwang “manumpa,” ipinakikilala ng ב ang Diyos na siyang pinanumpaan. Ang “sa pangalan ni Yahweh” ang natural na ekspresyon sa Filipino para sa panunumpa na gumagamit sa Diyos bilang saksi at garantiya.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng construct chain na nagpapakilala kay Yahweh kaugnay ng Israel.
- source_word: וְעַתָּה
  choice: kaya ngayon
  rationale: Ang parirala ay nagpapakilala sa kasalukuyang bunga ng panunumpa. Ginagawang malinaw ng “kaya ngayon” ang ugnayang lohikal na likas sa konteksto.
- source_word: לֹא נוּכַל
  choice: hindi namin ... maaaring
  rationale: Ang יכל ay nagsasaad ng kawalan ng kakayahan; dito, ang panunumpa ang lumilikha ng moral na hadlang. Pinananatili ng “hindi ... maaaring” ang parehong praktikal at moral na diwa nang hindi ito labis na nililinaw.
- source_word: לִנְגֹּעַ בָּהֶם
  choice: sila ... galawin
  rationale: Literal na “hipuin” ang נגע, ngunit sa kontekstong ito ay idyoma ito para sa paglalagay ng kamay sa kanila upang saktan o salakayin. Ang “galawin” ay nagpapanatili ng matalinghagang anyo habang natural na nagpapahiwatig ng pananakit sa Filipino.
theological_decisions:
- issue: Pagbibigay-salin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Likas ng hadlang na ipinahahayag ng לֹא נוּכַל
  choice: hindi namin ... maaaring
  alternative: hindi namin ... kayang; hindi namin ... dapat
  rationale: Nagpapahayag ang teksto ng kawalan ng kakayahang kumilos dahil sa panunumpa, na may moral na bigat ngunit hindi tahasang gumagamit ng salitang “dapat.” Pinananatili ng napiling salin ang tensiyong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” para sa pampamayanang pagtitipon ng Israel at “galawin” upang mapanatili ang idyomatikong puwersa ng Hebreo. Inilagay ang talababa pagkatapos ng “galawin,” ang salitang talagang tinutukoy nito.
