  terminology: Ang “kamay,” “paningin,” “mabuti,” at “matuwid” ay angkop na modernong Filipino at maayos na tumutugon sa Hebreong בְּיָדֶךָ, בְּעֵינֶיךָ, טוֹב, at יָשָׁר. Walang terminong teolohikal na nangangailangan ng pagbabago.
