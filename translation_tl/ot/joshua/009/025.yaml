lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang pangpanahong עַתָּה, na naghuhudyat ng kasalukuyang pagpapasakop ng mga Gibeonita.
- source_word: הִנְנוּ
  choice: narito kami
  rationale: Likas at kasalukuyang salin ng presentatibong pahayag; naipapahayag nito ang diwang “heto kami” nang may dignidad.
- source_word: בְיָדֶךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang malinaw na metaporang Hebreo para sa pagiging nasa ilalim ng kapangyarihan o pagpapasya ng isang tao.
- source_word: כַּטּוֹב וְכַיָּשָׁר
  choice: ang mabuti at matuwid
  rationale: Tuwirang inililipat ang dalawang katangiang טוֹב at יָשָׁר nang hindi pinagsasama o binabawasan ang kanilang etikal na diin.
- source_word: בְּעֵינֶיךָ
  choice: sa iyong paningin
  rationale: Pinananatili ang karaniwang idyomang Hebreo tungkol sa sariling paghatol o pagtataya; natural din ito sa Filipino.
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: Gawin mo sa amin kung ano ang …
  rationale: Isinasalin nang natural ang infinitibo at pautos na magkasunod sa Hebreo, habang pinananatili ang tuwirang kahilingang sila ay pakitunguhan ayon sa pasya ni Josue.
