  source_fidelity: 'Tumpak ang pangunahing diwa: ang mga Gibeonita ay nagpapasakop kay Josue at ipinauubaya sa kanya ang pasya kung ano ang gagawin sa kanila. Napananatili ang mga larawang “sa iyong kamay” at “sa iyong paningin.” Gayunman, ang “Gawin mo sa amin kung ano ang mabuti...” ay bahagyang alanganin sa Filipino, sapagkat maaaring magmukhang ang “kung ano” ang direktang bagay na ginagawa sa kanila. Ang binagong ayos ay mas malinaw na ipinapakitang sila ang tatanggap ng gagawin.'
