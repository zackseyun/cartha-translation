translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Josue” bilang tradisyonal at pamilyar na anyo ng pangalan. Inilipat sa hulihan ang pariralang nagsasaad ng pagkakaisa upang maging natural ang daloy, habang pinananatili ang lahat ng pangunahing sangkap ng Hebreo.
