translation:
  language: tl
  text: Nagtipon silang sama-sama upang labanan si Josue at ang Israel nang may iisang layunin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang bibig”; idyomang Hebreo ito na nangangahulugang kumilos nang lubos na nagkakaisa o nagkakasundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: Nagtipon sila
  rationale: Ang Niphal na anyo ng קבץ ay nagsasaad ng sama-samang pagtitipon; natural at malinaw sa modernong Tagalog ang “nagtipon sila.”
- source_word: יַחְדָּו
  choice: magkakasama
  rationale: Binibigyang-diin ng pang-abay ang sama-sama at nagkakaisang pagkilos, nang hindi dinaragdagan ang motibo ng mga tauhan.
- source_word: לְהִלָּחֵם
  choice: upang labanan
  rationale: Ang Niphal infinitive ng לחם ay tumutukoy sa pakikipaglaban; malinaw na ipinahahayag ng “upang labanan” ang layunin ng pagtitipon.
- source_word: עִם יְהוֹשֻׁעַ וְעִם יִשְׂרָאֵל
  choice: si Josue at ang Israel
  rationale: Pagkatapos ng pandiwang tumutukoy sa pakikipaglaban, adversatibo ang gamit ng עִם. Nasa pandiwang “labanan” na ang diwang “against,” kaya hindi kailangang ulitin ito sa Tagalog.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ito ang nakaugaliang anyo ng pangalan sa Tagalog na Bibliya at madaling makilala ng karaniwang mambabasa.
- source_word: פֶּה אֶחָד
  choice: nang may iisang pasiya
  rationale: Literal itong “isang bibig,” isang idyomang Hebreo para sa lubos na pagkakaisa o pagkakasundo. Natural sa Tagalog ang “may iisang pasiya” at pinananatili ang diwa ng nagkakaisang layunin.
