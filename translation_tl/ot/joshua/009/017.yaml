source:
  edition: WLC
  text: וַ/יִּסְע֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יָּבֹ֛אוּ אֶל עָרֵי/הֶ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וְ/עָרֵי/הֶם֙ גִּבְע֣וֹן וְ/הַ/כְּפִירָ֔ה וּ/בְאֵר֖וֹת וְ/קִרְיַ֥ת יְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: tl
  text: Kaya humayo ang mga anak ni Israel[a] at dumating sa kanilang mga lungsod nang ikatlong araw. Ang mga lungsod nila ay Gibeon, Kefira, Beerot, at Kiriat-jearim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: humayo
  rationale: Ang pandiwang נסע ay nagsasaad ng pag-alis at paglalakbay. Likas at marangal sa salaysay ang “humayo,” nang hindi nagdaragdag ng tiyak na larawang nagligpit sila ng kampo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tuwirang inililipat nito ang Hebreong idyoma at malinaw pa rin sa modernong Filipino; inilalahad sa talababa ang likas na etnikong katumbas na “mga Israelita.”
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: dumating sa kanilang mga lungsod
  rationale: Ang בוא kasunod ng אֶל ay likas na nangangahulugang dumating o makarating sa isang lugar. Mas natural sa Filipino ang “dumating sa” kaysa “pumaroon sa loob ng.”
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: nang ikatlong araw
  rationale: Pinananatili nito ang karaniwang pansamantalang kahulugan na nangyari ang pagdating sa ikatlong araw, hindi lamang bago sumapit o pagsapit nito.
- source_word: וְעָרֵיהֶם
  choice: Ang mga lungsod nila ay
  rationale: Ang pangatnig ay nagpapakilala ng paliwanag na naglilista sa mga lungsod. Hindi na kailangang isalin nang mekanikal bilang “at” sa Filipino.
- source_word: גִּבְעוֹן
  choice: Gibeon
  rationale: Malinaw na transliterasyon ng pangalang Hebreo at pamilyar na anyo sa mga saling Filipino.
- source_word: הַכְּפִירָה
  choice: Kefira
  rationale: Iniaangkop sa baybay at bigkas ng Filipino ang Hebreong Kefirah; hindi ginagamit ang Ingles na “Chephirah,” na maaaring magbigay ng maling bigkas sa Filipino.
- source_word: בְּאֵרוֹת
  choice: Beerot
  rationale: Malapit na transliterasyon sa Hebreo at iniaangkop ang hulíng katinig sa ortograpiyang Filipino sa halip na panatilihin ang Ingles na “Beeroth.”
- source_word: קִרְיַת יְעָרִים
  choice: Kiriat-jearim
  rationale: Pinananatili ang tambalang pangalan at ang gitling para madaling mabasa; ang anyo ay malapit sa mga katinig at hati ng pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal at tuwirang himig ng salaysay. Pinanatili ang Hebreong idyomang “mga anak ni Israel” sa teksto ngunit nilinaw ang karaniwang etnikong kahulugan sa talababa. Ang mga pangalang pantangi ay isina-Filipino ang transliterasyon kung saan ang lumang baybay-Ingles ay maaaring magdulot ng maling bigkas.
