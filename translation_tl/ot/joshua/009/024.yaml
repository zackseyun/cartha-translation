  naturalness: Marangal at karaniwang nauunawaang modernong Tagalog ang rehistro. Ang ‘labis kaming natakot para sa aming mga buhay’ ay mas likas bilang ‘labis kaming natakot para sa aming buhay,’ at mas maayos ang pagkakalagay ng pariralang ‘sa inyong harapan.’
  terminology: Ang ‘Yahweh,’ ‘Diyos,’ ‘lingkod,’ ‘buong lupain,’ at ‘lipulin’ ay angkop. Ang ‘tiyak na ipinaalam’ ay mas natural at mas malapit sa binigyang-diin na pasibong pahayag kaysa ‘malinaw na ibinalita.’
  issues:
