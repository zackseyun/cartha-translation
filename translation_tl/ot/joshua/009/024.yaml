  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: tl
  text: 'Sumagot sila kay Josue at sinabi, “Sapagkat tiyak na ipinaalam sa iyong mga lingkod[a] ang iniutos ni Yahweh na iyong Diyos sa lingkod niyang si Moises: na ibigay sa inyo ang buong lupain at lipulin ang lahat ng naninirahan sa lupain sa inyong harapan. Kaya labis kaming natakot para sa aming buhay dahil sa inyo, at ginawa namin ang bagay na ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “malinaw na ipinaalam sa iyong mga lingkod.” Gumagamit ang Hebreo ng infinitive absolute kasama ng isang finite passive na pandiwa upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ
  choice: Sumagot sila kay Josue
  rationale: Natural na panandang diyalogo sa Tagalog; hindi na inulit ang literal na “at sinabi” dahil kalabisan iyon sa modernong Tagalog, habang buo ang diwa ng tugon.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng ginawa ng mga Gibeonita, sa marangal ngunit madaling maunawaang rehistro.
- source_word: הֻגֵּד הֻגַּד
  choice: malinaw na ibinalita
  rationale: Isinasalin ang diin ng infinitive absolute na kasama ng finite passive verb nang hindi ginagawang alanganin ang Tagalog.
- source_word: לַעֲבָדֶיךָ
  choice: sa iyong mga lingkod
  rationale: Magalang na pagtukoy nila sa sarili sa diplomatikong pananalita; hindi pangunahing tumutukoy sa pagkaalipin.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalan ng Diyos at ang kaugnayan ng Diyos kay Josue.
- source_word: עַבְדּוֹ
  choice: lingkod niyang si Moises
  rationale: Ang עבד para kay Moises ay marangal na katawagan sa kanyang paglilingkod at atas mula sa Diyos.
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: ibigay sa inyo ang buong lupain
  rationale: Direktang pinananatili ang nilalaman ng utos at ang lupain bilang ipinagkaloob sa Israel.
- source_word: וּלְהַשְׁמִיד
  choice: at lipulin
  rationale: Malakas at likas na katumbas ng ganap na pagwasak o pag-aalis sa konteksto ng pagsakop.
- source_word: כָּל־יֹשְׁבֵי הָאָרֶץ מִפְּנֵיכֶם
  choice: ang lahat ng naninirahan sa lupain ... sa harap ninyo
  rationale: Pinananatili ang larawan ng pag-aalis sa harap ng pagsulong o presensya ng Israel.
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ
  choice: labis kaming natakot para sa aming mga buhay
  rationale: Likas na Tagalog na nagpapahayag ng matinding takot para sa kaligtasan ng kanilang buhay.
- source_word: וַנַּעֲשֵׂה אֶת־הַדָּבָר הַזֶּה
  choice: at ginawa namin ang bagay na ito
  rationale: Pinananatili ang sadyang pangkalahatang paraan ng Hebreo sa pagtukoy sa kanilang panlilinlang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito sa transliterasyong Yahweh.
- issue: Lakas at saklaw ng וּלְהַשְׁמִיד
  choice: lipulin
  alternative: wasakin; pawiin
  rationale: Hindi pinalalambot ang marahas na nilalaman ng utos, ngunit hindi rin dinaragdagan ng mga ideyang wala sa mismong pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “Josue,” ang nakaugaliang anyo ng pangalan sa Tagalog. Inalis sa pambungad ang literal na dobleng pormulang “sumagot ... at sinabi” bilang hindi likas na pag-uulit sa Tagalog, ngunit pinanatili ang lahat ng mahalagang nilalaman at ang diin ng Hebreo sa pamamagitan ng talababa.
