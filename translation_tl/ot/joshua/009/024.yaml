revisions:
- from: 'Sumagot sila kay Josue, “Sapagkat malinaw na ibinalita sa iyong mga lingkod[a] ang iniutos ni Yahweh na iyong Diyos sa lingkod niyang si Moises: ibigay sa inyo ang buong lupain at lipulin sa harap ninyo ang lahat ng naninirahan sa lupain. Kaya labis kaming natakot para sa aming mga buhay dahil sa inyo, at ginawa namin ang bagay na ito.”'
  to: 'Sumagot sila kay Josue at sinabi, “Sapagkat tiyak na ipinaalam sa iyong mga lingkod[a] ang iniutos ni Yahweh na iyong Diyos sa lingkod niyang si Moises: na ibigay sa inyo ang buong lupain at lipulin ang lahat ng naninirahan sa lupain sa inyong harapan. Kaya labis kaming natakot para sa aming buhay dahil sa inyo, at ginawa namin ang bagay na ito.”'
  rationale: Pinanatili ang kahulugan at antas ng pananalita ng draft, ngunit ibinalik ang dalawang pandiwang pambungad ng Hebreo, nilinaw ang nilalaman ng utos sa pamamagitan ng ‘na,’ inayos ang natural na Tagalog ng parirala tungkol sa kanilang buhay, at ginawang mas tumpak ang paliwanag sa talababa tungkol sa Hebreong pagbibigay-diin.
