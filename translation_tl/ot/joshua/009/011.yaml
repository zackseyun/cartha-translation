base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: tl
  text: Kaya sinabi sa amin ng aming mga nakatatanda at ng lahat ng naninirahan sa aming lupain, ‘Magdala kayo ng baon para sa paglalakbay at humayo upang salubungin sila. Sabihin ninyo sa kanila, “Mga lingkod ninyo kami”[a]; at ngayon, gumawa kayo ng tipan sa amin[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga lingkod ninyo” ay mapagpakumbabang pananalitang diplomatiko; ang salitang Hebreo ay maaari ring mangahulugang “mga alipin” sa ibang konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pumutol kayo ng tipan sa amin,” isang idyomang Hebreo na nangangahulugang gumawa o magtatag ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: aming mga nakatatanda
  rationale: Tumutukoy ito sa kinikilalang mga pinuno ng pamayanan, hindi lamang sa matatandang lalaki. Likas sa modernong Filipino ang “mga nakatatanda” para sa ganitong tungkuling panlipunan.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: lahat ng naninirahan sa aming lupain
  rationale: Pinananatili nito ang kolektibong diwa ng lahat ng mga taong nakatira sa kanilang lupain.
- source_word: צֵידָה לַדֶּרֶךְ
  choice: baon para sa paglalakbay
  rationale: Ang צֵידָה ay panustos, lalo na pagkain, na dinadala sa paglalakbay. Ang “baon” ay maikli, natural, at malinaw sa Filipino.
- source_word: בְיֶדְכֶם
  choice: magdala kayo
  rationale: Ang literal na “sa inyong kamay” ay idyomatikong nagpapahiwatig ng pagdadala. Isinasalin ito nang natural sa pandiwang “magdala” nang hindi binabago ang diwa.
- source_word: לִקְרָאתָם
  choice: upang salubungin sila
  rationale: Ipinahihiwatig ng parirala ang pagpunta upang humarap o makipagtagpo sa kanila; tumpak at natural dito ang “salubungin.”
- source_word: עַבְדֵיכֶם
  choice: mga lingkod ninyo
  rationale: Bagaman maaari ring mangahulugang “mga alipin” ang עֲבָדִים sa ibang konteksto, dito ay mapagpakumbabang wikang diplomatiko ang gamit sa paghiling ng kasunduan.
- source_word: וְעַתָּה
  choice: at ngayon
  rationale: Pinananatili nito ang payak na transisyon ng Hebreo patungo sa tuwirang kahilingan.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: gumawa kayo ng tipan sa amin
  rationale: Ang כרת ברית ay nakaugaliang Hebreong idyoma para sa pagtatatag ng tipan. Pinananatili ng “gumawa ng tipan” ang mahalagang katawagang biblikal habang malinaw sa Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa בְּרִית bilang tipan o kasunduan
  choice: tipan
  alternative: kasunduan o tratadong pangkapayapaan
  rationale: May diplomatikong katangian ang hinihingi sa konteksto, ngunit ang בְּרִית ay mas malawak na katawagang biblikal. Ang “tipan” ay nagpapanatili sa kategorya ng salitang pinagmulan nang hindi itinatangging may anyong pampolitika ang kasunduang ito.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “mga nakatatanda,” “baon,” at “salubungin” ay madaling maunawaan ng karaniwang mambabasa, samantalang pinanatili ang “tipan” bilang mahalagang katawagang biblikal. Inayos ang mga panandang talababa upang tumapat ang paliwanag sa “mga lingkod” at “tipan.”
