  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: tl
  text: Kaya nakipagpayapaan sa kanila si Josue at nakipagtipan sa kanila upang hayaan silang mabuhay, at nanumpa sa kanila ang mga pinuno ng kapulungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם יְהוֹשֻׁעַ שָׁלוֹם
  choice: nakipagpayapaan sa kanila si Josue
  rationale: Ang idyomang Hebreo ay tumutukoy sa pagtatatag ng mapayapang ugnayan. Likas sa modernong Tagalog ang “nakipagpayapaan” at malinaw na kapwa panig ang sangkot.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Bibliya sa Tagalog.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: nakipagtipan sa kanila
  rationale: Ang literal na idyoma ay “pumutol ng tipan,” ngunit hindi ito likas o malinaw sa Tagalog. Pinananatili ng “nakipagtipan” ang pormal at legal na diwa ng בְּרִית.
- source_word: לְחַיּוֹתָם
  choice: upang hindi sila patayin
  rationale: Sa konteksto, layunin ng tipan na iligtas ang kanilang buhay. Ang negatibong pahayag ay natural sa Tagalog at hindi nagpapahiwatig na sila ay bubuhayin mula sa kamatayan.
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: nanumpa sa kanila
  rationale: Tuwirang ipinahahayag ng pandiwa ang panunumpa; maikli at natural ang salin.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: mga pinuno ng kapulungan
  rationale: Ang נְשִׂיאִים ay mga kinikilalang pinuno, at ang עֵדָה ay ang nagkakatipong pamayanan ng Israel. Iniiwasan ng “kapulungan” ang posibleng makabagong eklesiyastikong pahiwatig ng “kongregasyon.”
theological_decisions:
- issue: Paglilipat sa idyoma ng pakikipagtipan
  choice: nakipagtipan
  alternative: literal na “pumutol ng tipan”
  rationale: Pinananatili ang legal at teolohikal na diwa ng tipan nang hindi gumagamit ng idyomang hindi mauunawaan nang natural sa Tagalog.
- issue: Kahulugan ng הָעֵדָה
  choice: kapulungan
  alternative: pamayanan; kongregasyon
  rationale: Saklaw nito ang nagkakatipong sambayanan ng Israel at hindi ito nag-aangkat ng mas huling estrukturang pansimbahan.
- issue: Layunin ng tipan sa לְחַיּוֹתָם
  choice: upang hindi sila patayin
  alternative: upang hayaan silang mabuhay; upang iligtas ang kanilang buhay
  rationale: Ipinahahayag nito ang layuning iligtas sa pagpatay sa konteksto ng pagsakop, nang hindi nagdaragdag ng partikular na doktrinal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakipagtipan” at “kapulungan” upang mapanatili ang pormal at pangkomunidad na himig ng talata nang walang lipas o sektaryong pananalita.
