    rationale: Bagaman ang pag-iwas sa pagpatay ay nasa konteksto, ang Hebreong infinitive ay nagsasaad ng layuning panatilihin o hayaang mabuhay sila. Dapat panatilihin ang positibong pahayag upang hindi maikulong ang kahulugan sa isang partikular na paraan lamang ng pagkamatay.
  revised_text: Kaya nakipagpayapaan sa kanila si Josue at nakipagtipan sa kanila upang hayaan silang mabuhay, at nanumpa sa kanila ang mga pinuno ng kapulungan.
