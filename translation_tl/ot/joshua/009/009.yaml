  to: At sinabi nila sa kanya, “Dumating ang iyong mga lingkod mula sa isang napakalayong lupain dahil sa pangalan ni Yahweh na Diyos mo, sapagkat narinig namin ang kanyang kabantugan[a] at ang lahat ng ginawa niya sa Ehipto.”
