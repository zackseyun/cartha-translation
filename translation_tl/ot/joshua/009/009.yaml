  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו מֵ/אֶ֨רֶץ רְחוֹקָ֤ה מְאֹד֙ בָּ֣אוּ עֲבָדֶ֔י/ךָ לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּֽי שָׁמַ֣עְנוּ שָׁמְע֔/וֹ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: tl
  text: At sinabi nila sa kanya, “Dumating ang iyong mga lingkod mula sa isang napakalayong lupain dahil sa pangalan ni Yahweh na Diyos mo, sapagkat narinig namin ang kanyang kabantugan[a] at ang lahat ng ginawa niya sa Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “narinig namin ang ulat tungkol sa kanya” o “narinig namin ang kanyang reputasyon.” Gumagamit ang Hebreo ng magkaugnay na pandiwa at pangngalan, na literal na “narinig namin ang kanyang ulat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: At sinabi nila sa kanya
  rationale: Pinananatili ng “At” ang karaniwang daloy ng salaysay sa Hebreo, at malinaw na ipinakikilala ang tuwirang pananalita.
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: mula sa isang napakalayong lupain
  rationale: Likas sa makabagong Tagalog at pinananatili ang diin ng מְאֹד, “napaka-/lubhang.”
- source_word: בָּאוּ עֲבָדֶיךָ
  choice: Naparito ang inyong mga lingkod
  rationale: Ipinahahayag ng “naparito” ang pagdating sa kinaroroonan ng kausap; ang “mga lingkod” ay angkop sa mapagpakumbabang pansariling katawagan sa diplomatikong pananalita, nang hindi ipinipilit ang diwang “alipin.”
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: dahil sa pangalan ni Yahweh na inyong Diyos
  rationale: Ipinakikita ng parirala ang pangalan o kabantugan ni Yahweh bilang dahilan ng kanilang pagparito, habang tahasang pinananatili ang banal na pangalang יְהוָה bilang “Yahweh.”
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: nabalitaan namin ang tungkol sa kanya
  rationale: Natural na Tagalog para sa idyomang Hebreo na maaaring tumukoy sa narinig na ulat, reputasyon, o kabantugan tungkol sa kanya; pinananatili sa talababa ang tunay na saklaw ng kahulugan.
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: at ang lahat ng ginawa niya sa Ehipto
  rationale: Tuwiran, malinaw, at natural na paglilipat ng pariralang tumutukoy sa kabuuan ng kanyang mga ginawa sa Ehipto.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng pagparito “sa pangalan” ni Yahweh
  choice: dahil sa pangalan ni Yahweh
  alternative: alang-alang sa pangalan ni Yahweh; dahil sa kabantugan ni Yahweh
  rationale: Pinananatili ang salitang “pangalan” at ang maaaring saklaw nitong reputasyon, kapangyarihan, at pagkakakilanlan, nang hindi ito nililimitahan sa iisang teolohikong pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “inyong” at “mga lingkod” upang maipakita ang magalang at diplomatikong tono, ngunit hindi dinagdagan ng “po,” na walang tuwirang katumbas sa pinagmulang teksto.
