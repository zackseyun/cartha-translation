    issue: Hindi tugma ang panghalip na 'inyong' sa kausap na isahan.
    rationale: Ang אֵלָיו, עֲבָדֶיךָ, at אֱלֹהֶיךָ ay tumutukoy sa isang lalaking kausap. Dapat itong maging 'sa kanya,' 'iyong mga lingkod,' at 'Diyos mo.'
  - severity: low
