  source_fidelity: 'May kailangang itama: ang mga hulaping panghalip sa Hebreo ay isahan (''sa kanya,'' ''iyong mga lingkod,'' ''Diyos mo''), samantalang ang draft ay hindi magkakatugma sa paggamit ng ''inyong.'' Ang cognate na שָׁמַעְנוּ שָׁמְעוֹ ay mas mahusay na maipapahayag sa pangunahing teksto bilang pagkarinig sa kabantugan/ulat niya, na may talababa para sa mga alternatibo.'
  naturalness: Marangal at makabago ang register. Mas natural at mas malinaw ang 'Dumating ang iyong mga lingkod' kaysa 'Naparito ang inyong mga lingkod,' at ang 'narinig namin ang kanyang kabantugan' kaysa 'nabalitaan namin ang tungkol sa kanya.'
  terminology: Ang 'Yahweh' ay wastong salin ng tetragrammaton ayon sa ibinigay na patakaran. Ang 'mga lingkod' ay angkop na mapagpakumbabang katawagang diplomatiko. Pinananatili ang 'pangalan' nang hindi ipinipilit ang isang makitid na pagpapakahulugan.
