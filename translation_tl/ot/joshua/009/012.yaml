  text: זֶ֣ה לַחְמֵ֗/נוּ חָ֞ם הִצְטַיַּ֤דְנוּ אֹת/וֹ֙ מִ/בָּ֣תֵּ֔י/נוּ בְּ/י֥וֹם צֵאתֵ֖/נוּ לָ/לֶ֣כֶת אֲלֵי/כֶ֑ם וְ/עַתָּה֙ הִנֵּ֣ה יָבֵ֔שׁ וְ/הָיָ֖ה נִקֻּדִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: tl
  text: “Ang tinapay naming ito ay mainit pa nang baunin namin ito mula sa aming mga bahay noong araw na umalis kami upang pumunta sa inyo. Ngunit ngayon, tingnan ninyo—tuyo na ito at batik-batik na.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inaamag na,” “bitak-bitak na,” o “marupok at nadudurog na.” Ang salitang Hebreo ay literal na tumutukoy sa isang bagay na may mga tuldok o batik. Sa konteksto ng lumang tinapay, hindi tiyak kung ang tinutukoy ay mga batik ng amag, mga bitak, o pagkarupok dahil sa pagkatuyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: Ang tinapay naming ito
  rationale: Pinananatili ang demonstratibong diin ng Hebreo habang gumagamit ng likas na ayos ng mga salita sa modernong Tagalog.
- source_word: חָם
  choice: mainit pa
  rationale: Tuwirang inilalarawan ng חָם ang init ng tinapay. Ang “pa” ay natural na naghahambing sa dating kalagayan nito at sa kasalukuyang pagkatuyo nang hindi pinapalitan ang salita ng mas interpretibong “sariwa.”
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: kunin namin itong baon
  rationale: Ang pandiwa ay tumutukoy sa paglalaan o pagdadala ng panustos para sa paglalakbay. Ang “baon” ay maikli at likas sa Tagalog, at nananatiling tinapay ang tuwirang bagay.
- source_word: מִבָּתֵּינוּ
  choice: mula sa aming mga bahay
  rationale: Pinananatili ang tahasang maramihang “mga bahay” sa Hebreo sa halip na gawing mas malayang “mga tahanan.”
- source_word: בְּיוֹם צֵאתֵנוּ
  choice: noong araw na umalis kami
  rationale: Malinaw at natural na ipinahahayag ang panahong nagsimula ang kanilang paglalakbay.
- source_word: לָלֶכֶת אֲלֵיכֶם
  choice: upang pumunta sa inyo
  rationale: Pinananatili ang payak na kahulugan ng Hebreong “pumunta” at ang layunin ng kanilang pag-alis.
- source_word: וְעַתָּה הִנֵּה
  choice: Ngunit ngayon, tingnan ninyo
  rationale: Ipinapakita ng “ngunit” ang paghahambing sa dating kalagayan, at ng “tingnan ninyo” ang deiktikong panawagan ng הִנֵּה na suriin ang ebidensiya.
- source_word: יָבֵשׁ
  choice: tuyo na ito
  rationale: Tuwirang inilalarawan ang kasalukuyang kalagayan; ang “na” ay likas na nagpapahiwatig ng pagbabagong naganap.
- source_word: וְהָיָה נִקֻּדִים
  choice: at batik-batik na
  rationale: Ang נִקֻּדִים ay literal na tumutukoy sa pagkakaroon ng mga tuldok o batik. Pinananatili ng “batik-batik” ang nakikitang paglalarawan nang hindi tiyak na ipinapakahulugang amag, pagbitak, o pagdurog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “baon” bilang likas na katumbas ng panustos sa paglalakbay. Ang panawagang “tingnan ninyo” at ang gitling na em dash ay nagpapanatili sa dramatikong pagpapakita ng tinapay. Inilagay ang talababa sa “batik-batik” sapagkat iyon ang salitang may tunay na leksikal na di-katiyakan.
