id: JOS.9.7
reference: Joshua 9:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: ו/יאמרו אִֽישׁ יִשְׂרָאֵ֖ל אֶל הַ/חִוִּ֑י אוּלַ֗י בְּ/קִרְבִּ/י֙ אַתָּ֣ה יוֹשֵׁ֔ב וְ/אֵ֖יךְ אכרות לְ/ךָ֥ בְרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: tl
  text: Ngunit sinabi ng mga lalaki ng Israel sa Hivita, “Baka naninirahan ka sa gitna namin[a]. Kung gayon, paano ako makikipagtipan sa iyo[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa gitna ko”; malamang na nagsasalita ang isang kinatawan para sa Israel.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “puputol ako ng tipan sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: mga lalaki ng Israel
  rationale: Bagaman nasa anyong isahan ang אִישׁ, maramihan ang pandiwang ויאמרו at tumutukoy ito sa mga kinatawang Israelita. Pinananatili ng salin ang panlalaking kolektibong diwa nang hindi lumilikha ng mapanlinlang na iisang tao lamang.
- source_word: הַחִוִּי
  choice: Hivita
  rationale: Pinananatili ang isahang anyo ng Hebreo, na malamang ay tumutukoy sa kinatawan ng pangkat na kinakausap.
- source_word: אוּלַי
  choice: Baka
  rationale: Likas at malinaw sa makabagong Filipino ang “baka” para sa naghihinalang posibilidad na ipinahahayag ng particle.
- source_word: בְּקִרְבִּי
  choice: sa gitna namin
  rationale: Literal itong “sa gitna ko,” ngunit ang nagsasalita ay kumakatawan sa Israel bilang isang pangkat. Ang “sa gitna namin” ay malinaw na naghahatid ng heograpiko at kolektibong kahulugan; itinala sa talababa ang isahang anyo.
- source_word: יוֹשֵׁב
  choice: naninirahan
  rationale: Ipinahahayag nito ang patuloy na paninirahan o pagtira, hindi lamang ang literal na pag-upo.
- source_word: וְאֵיךְ
  choice: Kung gayon, paano
  rationale: Malinaw nitong iniuugnay ang hinihinalang paninirahan sa kasunod na tanong tungkol sa posibilidad ng pakikipagtipan.
- source_word: אכרות ... בְרִית
  choice: makikipagtipan
  rationale: Likas na katumbas sa Filipino ng idyomang Hebreo na literal na “pumutol ng tipan,” habang pinananatili ang pormal at teolohikal na konsepto ng tipan.
- source_word: לְךָ
  choice: sa iyo
  rationale: Pinananatili ang isahang kausap ng tekstong Hebreo at likas itong kaakibat ng pandiwang “makikipagtipan.”
theological_decisions:
- issue: Mga isahang anyo sa pananalita ng kinatawan ng Israel
  choice: Gawing kolektibo ang “sa gitna namin” ngunit panatilihin ang “ako” sa “paano ako makikipagtipan”
  alternative: 'Panatilihing isahan ang lahat: “sa gitna ko ... paano ako makikipagtipan”; o gawing kolektibo ang lahat: “sa gitna namin ... paano kami makikipagtipan”'
  rationale: May tunay na pag-igting sa Hebreo sa pagitan ng pangkat na nagsasalita at ng isahang tinig ng kinatawan. Ang salin ay nililinaw ang kolektibong lokasyon ngunit pinananatili ang isahang pandiwa sa ikalawang sugnay upang hindi tuluyang burahin ang representatibong pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Hivita” bilang natural na anyong Filipino ng pangalang-bayan, “naninirahan” para sa patuloy na pagtira, at “makikipagtipan” para sa malinaw ngunit hindi arkaikong pagpapahayag ng idyomang Hebreo.
