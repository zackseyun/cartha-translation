  text: וַ/יֹּאמְר֥וּ אֶל יְהוֹשֻׁ֖עַ עֲבָדֶ֣י/ךָ אֲנָ֑חְנוּ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֧ם יְהוֹשֻׁ֛עַ מִ֥י אַתֶּ֖ם וּ/מֵ/אַ֥יִן תָּבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/008.yaml
  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: tl
  text: Sinabi nila kay Josue[a], “Mga lingkod mo kami.” Pagkatapos, sinabi ni Josue sa kanila, “Sino kayo, at saan kayo nanggaling?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mga alipin mo kami.” Ang salitang Hebreo na עֲבָדֶיךָ ay maaaring mangahulugang “mga lingkod mo” o “mga alipin mo.” Dito, “mga lingkod” ang ginamit dahil magalang at diplomatikong nagpapakumbaba ang mga nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: mga lingkod mo
  rationale: Maaaring tumukoy ang עֶבֶד sa lingkod o alipin. Sa kontekstong ito, magalang at diplomatikong nagpapakumbaba ang mga nagsasalita, kaya mas likas ang “mga lingkod mo”; inilalagay sa talababa ang “mga alipin mo” bilang tunay na alternatibo.
- source_word: אֲנָחְנוּ
  choice: kami
  rationale: Walang tahasang copula sa nominal clause ng Hebreo. Sa natural na Tagalog, naipapahayag ang diwang “we are” sa hulmahang “Mga lingkod mo kami.”
- source_word: מִי אַתֶּם
  choice: Sino kayo
  rationale: Tuwirang katumbas ito ng interrogative at panghalip, nang walang idinadagdag na pangngalang wala sa Hebreo.
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: at saan kayo nanggaling
  rationale: Ang מֵאַיִן ay nagtatanong tungkol sa pinagmulan. Likas sa modernong Tagalog ang “saan kayo nanggaling” para sa tanong na ito.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: Sinabi nila … Pagkatapos, sinabi ni Josue
  rationale: Isinasalin ang sunod-sunod na anyong pasalaysay sa malinaw na nagdaang panahunan; ipinakikita ng “Pagkatapos” ang pagpapalit ng nagsasalita.
