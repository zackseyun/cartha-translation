base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: tl
  text: Sila rin ay kumilos nang may katusuhan. Humayo sila at nagbalatkayo[a]. Kumuha sila ng mga luma at sira-sirang sako para sa kanilang mga asno, at ng mga sisidlang-balat ng alak na luma, nabiyak, at tinalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naghanda ng mga baon para sa paglalakbay” o “nagkunwaring mga sugo.” Mahirap tiyakin ang kahulugan ng pandiwang Hebreo; pinapaboran dito ng konteksto ang “nagbalatkayo.”
    reason: alternative_reading
  - marker: b
    text: Ang “tinalian” ay maaari ring isaling “binigkis” o, ayon sa ipinahihiwatig na layunin nito, “tinagpian.” Malamang na itinali ang mga sisidlang-balat matapos mabiyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הֵמָּה
  choice: Sila rin
  rationale: Likas na ipinahahayag sa Tagalog na kumilos din ang mga Gibeonita, gaya ng ibang mga pangkat sa naunang konteksto.
- source_word: בְּעָרְמָה
  choice: nang may katusuhan
  rationale: Pinananatili ang diwa ng tuso at mapanlinlang na pagkilos nang hindi nagdaragdag ng higit sa ipinahihiwatig ng salaysay.
- source_word: וַיֵּלְכוּ
  choice: Humayo sila
  rationale: Direktang salaysay na katumbas ng pandiwang 'pumunta/humayo'; ang 'humayo' ay dignificado ngunit madaling maunawaan.
- source_word: וַיִּצְטַיָּרוּ
  choice: nagbalatkayo
  rationale: Mahirap at pinagtatalunang anyo ang pandiwa. Ang pagpapanggap ng mga Gibeonita sa kasunod na salaysay at ang mga lumang kagamitang dala nila ay sumusuporta sa kahulugang nagkunwari o nagbalatkayo; pinananatili sa talababa ang ibang pangunahing pagbasa.
- source_word: שַׂקִּים בָּלִים
  choice: mga luma at sira-sirang sako
  rationale: Ipinahahayag ang pagkasira dahil sa katandaan o gamit, hindi lamang ang pagiging luma.
- source_word: לַחֲמוֹרֵיהֶם
  choice: para sa kanilang mga asno
  rationale: Ipinakikita ang kaugnayan ng mga sako sa mga asnong magdadala ng mga ito nang hindi ipinipilit kung nakasakay na ang mga sako sa mga hayop.
- source_word: נֹאדוֹת יַיִן
  choice: mga sisidlang-balat ng alak
  rationale: Malinaw na inilalarawan ang mga sisidlang yari sa balat na ginagamit para sa alak, yamang walang ganap na pangkaraniwang iisang salita sa modernong Tagalog.
- source_word: מְבֻקָּעִים
  choice: biyak
  rationale: Tuwirang inilalarawan ang mga sisidlang nabiyak o nahati.
- source_word: מְצֹרָרִים
  choice: tinalian
  rationale: Mas malapit sa anyong Hebreo na tumutukoy sa pagkakatali o pagkakabigkis, malamang bilang paraan ng pagkukumpuni.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignificado. Ginamit ang “nagbalatkayo” bilang likas na salin ng kontekstuwal na kahulugan, ngunit hindi ikinubli ang tunay na kahirapan ng pandiwang Hebreo. Ang “sisidlang-balat ng alak” ay sadyang mapaglarawan upang maunawaan ng karaniwang mambabasa ang sinaunang lalagyan.
