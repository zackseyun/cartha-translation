  source_fidelity: 'Ang pangunahing diwa ay tumpak: isinumpa ang mga kausap at patuloy na magmumula sa kanilang pangkat ang mga alipin para sa gawaing pagputol ng kahoy at pag-iigib ng tubig para sa bahay ng Diyos. Gayunman, ang “hindi mawawala sa inyo ang mga alipin” ay maaaring mangahulugang hindi mawawalan sila ng mga aliping pag-aari nila. Ang “mawawala mula sa inyo” ay mas malinaw na tumutugma sa מִכֶּם (“mula sa inyo”).'
