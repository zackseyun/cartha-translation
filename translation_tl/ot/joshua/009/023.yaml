base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you servants, cutters of wood and drawers of water for the house of my God.
translation:
  language: tl
  text: Kaya ngayon, isinumpa kayo, at hinding-hindi mawawala mula sa inyo ang mga alipin[a]—mga tagaputol ng kahoy at mga tagapag-igib ng tubig para sa bahay ng aking Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na pagkakasabi: “hindi mapuputol mula sa inyo ang isang alipin.” Ipinahihiwatig ng Hebreo na patuloy na magmumula sa kanilang pangkat ang mga gagawa ng ganitong paglilingkod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Likas na panandang diskurso sa Filipino na nag-uugnay sa naunang hatol at sa kasunod nitong bunga.
- source_word: אֲרוּרִים
  choice: isinumpa kayo
  rationale: Tuwirang ipinapahayag ang kalagayang dala ng sumpa; pinananatili ang maramihang kausap.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: hindi mawawala sa inyo ang mga alipin
  rationale: Ipinahahayag ng Niphal ng כרת kasama ng מן ang hindi pagkaputol o pagkawala mula sa kanilang lipi. Ginawang maramihan sa Filipino ang kolektibong עֶבֶד upang maging natural at malinaw ang patuloy na kalagayang ipinapataw sa pangkat.
- source_word: עֶבֶד
  choice: mga alipin
  rationale: Mas malinaw kaysa 'mga lingkod' sa pagpapakita ng sapilitan at nakabababang katayuang ipinataw bilang sumpa.
- source_word: חֹטְבֵי עֵצִים
  choice: mga tagaputol ng kahoy
  rationale: Malinaw at makabagong paglalarawan sa itinakdang gawain, habang nananatiling malapit sa kongkretong larawan ng Hebreo.
- source_word: שֹׁאֲבֵי מַיִם
  choice: mga tag-igib ng tubig
  rationale: '''Tag-igib'' ang natural na terminong Filipino para sa taong kumukuha ng tubig mula sa balon o bukal.'
- source_word: לְבֵית אֱלֹהָי
  choice: para sa bahay ng aking Diyos
  rationale: Pinananatili ang pormal na larawan ng 'bahay,' na sa konteksto ay tumutukoy sa santuwaryo o tabernakulo ng Diyos.
theological_decisions:
- issue: Paglalarawan sa ipinataw na kalagayang alipin sa sumpa ni Josue
  choice: mga alipin
  alternative: mga lingkod
  rationale: Ang konteksto ay sapilitang habambuhay na mababang paglilingkod, kaya maaring pahinain ng 'mga lingkod' ang bigat ng sumpa. Hindi naman dinaragdagan ang teksto ng isang partikular na sistemang panlipunan na hindi nito tahasang tinutukoy.
- issue: Saklaw at pagpapatuloy ng hatol
  choice: hindi mawawala sa inyo ang mga alipin
  alternative: ang ilan sa inyo ay hindi titigil sa pagiging mga alipin
  rationale: Mas malapit ito sa Hebreong idyoma at hindi nagpapahiwatig na ilan lamang sa kanila ang isinumpa; ang diwa ay patuloy na magmumula sa kanilang pangkat ang gagawa ng ganitong paglilingkod.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'tag-igib' bilang pangkaraniwan at kongkretong termino, at pinanatili ang 'bahay ng aking Diyos' upang huwag takpan ang larawang santuwaryo sa Hebreo.
