  terminology: Wasto ang “isinumpa,” “mga alipin,” at “bahay ng aking Diyos.” Pinananatili ng “mga alipin” ang sapilitan at mababang katayuang ipinahahayag ng עֶבֶד. Inilipat ang talababa sa pariralang tinatalakay nito sa halip na sa “isinumpa.”
