id: JOS.9.22
reference: Joshua 9:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א לָ/הֶם֙ יְהוֹשֻׁ֔עַ וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם לֵ/אמֹ֑ר לָ/מָּה֩ רִמִּיתֶ֨ם אֹתָ֜/נוּ לֵ/אמֹ֗ר רְחוֹקִ֨ים אֲנַ֤חְנוּ מִ/כֶּם֙ מְאֹ֔ד וְ/אַתֶּ֖ם בְּ/קִרְבֵּ֥/נוּ יֹשְׁבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: tl
  text: Pagkatapos, ipinatawag sila ni Josue at sinabi sa kanila, “Bakit ninyo kami nilinlang sa pagsasabing, ‘Napakalayo namin sa inyo,’ gayong naninirahan kayo sa gitna namin[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama namin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: ipinatawag sila
  rationale: Sa konteksto, ipinatawag ni Josue ang mga Gibeonita upang harapin at kausapin; ipinahihiwatig ng “ipinatawag” na dinala sila sa harap niya.
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: sinabi sa kanila
  rationale: Likas na makabagong Tagalog para sa karaniwang Hebreong pambungad sa tuwirang pananalita, nang hindi inuulit ang di-likas na “nagsalita ... na sinasabi.”
- source_word: לָמָּה
  choice: Bakit
  rationale: Tuwiran at natural na katumbas ng salitang pananong.
- source_word: רִמִּיתֶם אֹתָנוּ
  choice: ninyo kami nilinlang
  rationale: Ipinahahayag ng piel na anyo ng רמה ang sinadyang panlilinlang; ang “nilinlang” ay malinaw at may angkop na bigat.
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: Napakalayo namin sa inyo
  rationale: Pinananatili ng “napakalayo” ang diin ng מְאֹד at natural ang ayos sa tuwirang pananalita.
- source_word: בְּקִרְבֵּנוּ
  choice: sa gitna namin
  rationale: Malapit sa idyomang Hebreo na nangangahulugang nasa mismong kinaroroonan o kapaligiran ng Israel, habang nananatiling malinaw sa Tagalog.
- source_word: יֹשְׁבִים
  choice: naninirahan kayo
  rationale: Ipinakikita ng participle ang nagpapatuloy at nakapirming paninirahan, hindi lamang pansamantalang paglagi.
theological_decisions:
- issue: Ang ipinahihiwatig na paratang tungkol sa kasunduan
  choice: Inilahad lamang ang tuwirang paratang na nagsinungaling sila tungkol sa kanilang layo.
  alternative: Palawakin ang sinabi upang tahasang banggitin ang paglabag o panlilinlang kaugnay ng kasunduan.
  rationale: Ang mismong talata ay nakatuon sa kasinungalingan tungkol sa kanilang pinanggalingan; hindi nito tahasang binibigkas ang mas malawak na teolohikal o tipanang implikasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangalang “Josue,” ang nakaugaliang anyo sa Tagalog. Ang “ipinatawag” at “naninirahan” ay nagpapanatili sa pormal na himig ng salaysay nang hindi nagiging makaluma.
