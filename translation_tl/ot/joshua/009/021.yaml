translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinanatili ang paulit-ulit na “mga pinuno” dahil naroon din ang pag-uulit sa Hebreo at nililinaw nito na natupad ang kanilang naunang pasiya.
