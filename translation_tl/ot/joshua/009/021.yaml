base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: tl
  text: Sinabi ng mga pinuno sa kanila, “Hayaan silang mabuhay.” Kaya sila'y naging mga tagaputol ng kahoy at mga tagaigib ng tubig[a] para sa buong kapulungan, gaya ng sinabi sa kanila ng mga pinuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “mga pumuputol ng kahoy at mga umiigib ng tubig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: mga pinuno
  rationale: Tumutukoy ito sa kinikilalang mga namumuno sa kapulungan ng Israel. Ang “mga pinuno” ay malinaw, makabago, at hindi nagpapahiwatig ng maharlikang titulong maaaring dala ng “mga prinsipe.”
- source_word: יִחְיוּ
  choice: Hayaan silang mabuhay
  rationale: 'Ang imperfect ay may puwersang jussive dito: isang pasiya o utos na huwag silang patayin. Likas na ipinapahayag ito sa Filipino ng “Hayaan silang mabuhay.”'
- source_word: וַיִּהְיוּ
  choice: Kaya naging
  rationale: Ipinahihiwatig ng pandiwa ang naging bunga o bagong kalagayang itinakda sa mga Gibeonita, hindi lamang ang isang dati nang katayuan.
- source_word: חֹטְבֵי עֵצִים
  choice: mga tagaputol ng kahoy
  rationale: Ang participial na parirala ay tumutukoy sa patuloy na tungkulin. Ang “tagaputol ng kahoy” ay tuwiran at madaling maunawaan sa modernong Filipino.
- source_word: שֹׁאֲבֵי מַיִם
  choice: tagaigib ng tubig
  rationale: Ang שׁאב ay tumutukoy sa pagsalok o pag-igib ng tubig mula sa balon o ibang bukal. Pinananatili ng “tagaigib ng tubig” ang kongkretong larawan at ang tungkuling ipinataw sa kanila.
- source_word: לְכָל הָעֵדָה
  choice: para sa buong kapulungan
  rationale: Ang עֵדָה ay ang sama-samang pamayanan o kapulungan ng Israel. Ang “buong kapulungan” ay dignified at mas tiyak kaysa sa pangkalahatang “komunidad.”
- source_word: כַּאֲשֶׁר דִּבְּרוּ לָהֶם
  choice: ayon sa sinabi sa kanila
  rationale: Ikinakabit ng parirala ang kinalabasan sa naunang pahayag ng mga pinuno. Natural sa Filipino ang “ayon sa sinabi sa kanila” at malinaw ang pagbabalik-tanaw sa pasiya.
