- from: Sinabi sa kanila ng mga pinuno, “Hayaan silang mabuhay.” Kaya naging mga tagaputol sila ng kahoy at tagaigib ng tubig[a] para sa buong kapulungan, ayon sa sinabi sa kanila ng mga pinuno.
  to: Sinabi ng mga pinuno sa kanila, “Hayaan silang mabuhay.” Kaya sila'y naging mga tagaputol ng kahoy at mga tagaigib ng tubig[a] para sa buong kapulungan, gaya ng sinabi sa kanila ng mga pinuno.
  rationale: Inayos ang pagkakasunod ng mga salita upang maging mas natural ang Filipino at ginawang magkapareho ang anyong pangmaramihan ng dalawang tungkulin. Pinalitan ang “ayon sa” ng “gaya ng” upang mas tuwirang tumbasan ang כַּאֲשֶׁר (“kung paano/gaya ng”), habang pinanatili ang pagbabalik sa pahayag ng mga pinuno.
