base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: tl
  text: Ito ang gagawin natin sa kanila at hahayaan natin silang mabuhay[a], upang hindi tayo datnan ng poot[b] dahil sa panunumpang ginawa natin sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pananatilihin natin silang buhay” o “hindi natin sila papatayin.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na poot ng Diyos ang tinutukoy ayon sa konteksto, bagaman hindi tahasang sinasabi rito ng tekstong Hebreo na ito ay poot ng PANGINOON.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: Ito ang gagawin natin sa kanila
  rationale: Ipinahahayag ng demonstratibo at ng Qal imperfect ang napagpapasyahang gagawin; likas at tuwiran ito sa modernong Tagalog.
- source_word: וְהַחֲיֵה אוֹתָם
  choice: hahayaan natin silang mabuhay
  rationale: Ang Hiphil ng חיה ay maaaring mangahulugang hayaang mabuhay o panatilihing buhay. Pinananatili ng salin ang diwa nang hindi agad pinipili ang mas interpretatibong ‘ililigtas sa kamatayan.’
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: upang hindi tayo datnan ng poot
  rationale: Ipinahihiwatig ng pagkakasunod ng mga sugnay ang layunin o iniiwasang bunga. Ang ‘datnan ng poot’ ay likas na Tagalog para sa poot na maaaring sumapit sa kanila.
- source_word: קֶצֶף
  choice: poot
  rationale: Pinananatili ng ‘poot’ ang bigat ng salitang Hebreo at hindi tahasang nagdaragdag kung kaninong poot iyon.
- source_word: עַל הַשְּׁבוּעָה אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: dahil sa panunumpang ginawa natin sa kanila
  rationale: Ginagawang malinaw ng ‘dahil sa’ ang sanhi ng kinatatakutang poot, habang natural na ipinapahayag ng ‘panunumpang ginawa natin sa kanila’ ang panunumpa sa isang kausap o panig.
theological_decisions:
- issue: Kung ang קֶצֶף ay tahasang tumutukoy sa poot ng PANGINOON
  choice: poot
  alternative: poot ng PANGINOON
  rationale: Malamang na poot ng Diyos ang tinutukoy sa konteksto ng paglabag sa panunumpa, ngunit hindi tahasang pinangalanan ng tekstong Hebreo ang PANGINOON. Kaya pinananatili sa pangunahing teksto ang tunay na di-tiyak na pagtukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng tutuldok upang natural na ihayag na ang pagpapabaya sa kanila na mabuhay ang nilalaman ng gagawin, habang pinananatili ang ugnayan ng mga sugnay sa Hebreo.
