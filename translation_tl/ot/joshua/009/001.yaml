translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pambungad na pormulang pasalaysay at ang nakabiting hulihan ng talata, sapagkat nagpapatuloy ang pangungusap sa susunod na talata. Ginamit ang mga nakaugaliang anyong Filipino ng mga pangalan ng bayan at lugar.
