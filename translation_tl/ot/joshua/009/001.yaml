  naturalness: Likas at angkop sa makabagong Filipino ang karamihan ng salin. Ang “mga hari ng mga Heteo, ...” ang mas malinaw at natural na paraan upang maipakita ang kaugnayan ng mga hari sa anim na pangkat.
  terminology: Ang mga anyong Heteo, Amoreo, Cananeo, Perezeo, Hiveo, at Jebuseo ay pare-pareho at angkop. Napananatili rin ang “Malaking Dagat” bilang literal na katawagang Hebreo.
