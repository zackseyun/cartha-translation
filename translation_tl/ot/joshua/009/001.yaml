  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּֽל הַ/מְּלָכִ֡ים אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בְ/כֹל֙ ח֚וֹף הַ/יָּ֣ם הַ/גָּד֔וֹל אֶל מ֖וּל הַ/לְּבָנ֑וֹן הַֽ/חִתִּי֙ וְ/הָ֣/אֱמֹרִ֔י הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: tl
  text: At nangyari, nang mabalitaan ito[a] ng lahat ng hari sa ibayo ng Jordan[b]—sa bulubunduking lupain, sa mababang lupain[c], at sa buong baybayin ng Malaking Dagat patungong Lebanon—ang mga hari ng mga Heteo, Amoreo, Cananeo, Perezeo, Hiveo, at Jebuseo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “nang mabalitaan ng lahat ng hari …” Walang tahasang layon ang pandiwang “mabalitaan”; ang “ito” ay idinagdag mula sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa kabilang panig ng Jordan.” Nagbabago ang pagtukoy ayon sa heograpikong pananaw ng nagsasalita.
    reason: lexical_alternative
  - marker: c
    text: O “sa Shephelah,” ang rehiyon ng mabababang burol sa kanluran ng bulubunduking lupain.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Karaniwang panandang pasalaysay na nagbubukas ng isang bagong pangyayari; pinananatili ang tungkulin ng Hebreo nang hindi gumagamit ng makalumang pananalita.
- source_word: כִשְׁמֹעַ
  choice: nang mabalitaan ito
  rationale: Ang כ na may infinitive construct ay nagsasaad ng panahong kalagayan. Likas sa Filipino ang sugnay na “nang mabalitaan”; idinagdag ang “ito” mula sa konteksto dahil walang tahasang layon sa Hebreo.
- source_word: כָּל הַמְּלָכִים
  choice: lahat ng hari
  rationale: Tuwirang katumbas ng panlahat na pantukoy at pangngalan.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: sa ibayo ng Jordan
  rationale: Pinananatili ang pangkalahatang heograpikong pahayag nang hindi tahasang nagpapasya kung silangan o kanluran ang tinutukoy na panig.
- source_word: בָּהָר
  choice: sa bulubunduking lupain
  rationale: Tumutukoy rito ang הַר sa rehiyon ng matataas na lupain, hindi lamang sa isang bundok.
- source_word: וּבַשְּׁפֵלָה
  choice: sa mababang lupain
  rationale: Malinaw na salin para sa rehiyong שְׁפֵלָה; inilalagay sa talababa ang pangalang Shephelah at ang mas tiyak na heograpikong paliwanag.
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: at sa buong baybayin ng Malaking Dagat
  rationale: Ang חוֹף ay baybayin, at pinananatili ang katawagang Hebreo na “Malaking Dagat” para sa Mediteraneo.
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: patungong Lebanon
  rationale: Natural na ipinahahayag ang oryentasyon o paglawak ng lugar na nakaharap sa direksiyon ng Lebanon.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: ang mga haring Heteo, Amoreo, Cananeo, Perezeo, Hiveo, at Jebuseo
  rationale: Ang mga pangalang-bayan na nasa kolektibong isahan sa Hebreo ay likas na iniuugnay sa “mga hari” sa Filipino, habang nananatiling malinaw ang anim na pangkat.
