  text: וַ/יִּתְּנֵ֨/ם יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא חֹטְבֵ֥י עֵצִ֛ים וְ/שֹׁ֥אֲבֵי מַ֖יִם לָֽ/עֵדָ֑ה וּ/לְ/מִזְבַּ֤ח יְהוָה֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר יִבְחָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: tl
  text: Kaya nang araw na iyon, ginawa sila ni Josue na mga tagaputol ng kahoy at mga tagaigib ng tubig para sa kapulungan at para sa altar ni Yahweh, hanggang sa araw na ito, sa lugar na pipiliin niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: ginawa sila
  rationale: Ang נתן ay literal na “ibinigay/itinalaga,” ngunit kasama ng mga panaguring pandiwari ay nangangahulugang ginawa o inatasan sila bilang isang uri ng mga manggagawa.
- source_word: חֹטְבֵי עֵצִים
  choice: mga tagaputol ng kahoy
  rationale: Tuwirang ipinahahayag ang patuloy na tungkuling pagputol ng kahoy sa natural na modernong Tagalog.
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: mga tagaigib ng tubig
  rationale: Ang שאב ay tumutukoy sa pagsalok o pag-igib ng tubig; “tagaigib” ang likas at tumpak na katawagan sa manggagawang gumagawa nito.
- source_word: לָעֵדָה
  choice: para sa kapulungan
  rationale: Ang עֵדָה ay ang sama-samang bayan o kapulungan ng Israel; pinananatili ng “kapulungan” ang kolektibo at panrelihiyong diwa.
- source_word: וּלְמִזְבַּח יְהוָה
  choice: at para sa altar ni Yahweh
  rationale: Ipinakikita nitong ang kanilang paglilingkod ay kaugnay ng altar at pagsamba; natural sa Tagalog ang “altar ni Yahweh” para sa ugnayang genitibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang idyoma ito para sa kalagayang nagpatuloy mula sa pangyayari hanggang sa panahon ng tagapagsalaysay.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: sa lugar na pipiliin niya
  rationale: Tumutukoy ito sa lugar ng santuwaryong pipiliin ni Yahweh. Ang “pipiliin” ay natural na kumakatawan sa yiqtol na tumitingin sa hinaharap mula sa panahon ni Josue.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Tinutukoy ng paksa sa “lugar na pipiliin niya”
  choice: Ang “niya” ay tumutukoy kay Yahweh
  alternative: “sa lugar na pipiliin” na walang tahasang personal na paksa
  rationale: Sa karaniwang pananalita ng Deuteronomio at Josue, si Yahweh ang pumipili ng lugar ng pagsamba. Pinananatili ang panghalip upang huwag gawing pasibo at upang mapanatili ang pahiwatig ng banal na pagpili.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Josue,” “kapulungan,” “tagaigib,” at “altar” bilang malinaw at karaniwang mga terminong biblikal. Walang talababa dahil hindi kailangan ng alternatibong leksikal upang maunawaan ang talata.
