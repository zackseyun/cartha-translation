  source_fidelity: Tumpak na naipapahayag ng salin ang pagtatalaga ni Josue sa mga Gibeonita bilang mga tagaputol ng kahoy at tagaigib ng tubig para sa kapulungan at sa altar ni Yahweh. Napananatili rin ang saklaw na "hanggang sa araw na ito" at ang hinaharap na pananaw sa "lugar na pipiliin niya," kung saan si Yahweh ang likas na tinutukoy ng panghalip.
  naturalness: Natural at malinaw ang modernong Tagalog. Ang "mga tagaigib ng tubig," "kapulungan," at "altar ni Yahweh" ay angkop sa marangal ngunit madaling unawaing rehistro ng salaysay. Ang ayos na "Kaya nang araw na iyon" ay katanggap-tanggap at maayos sa konteksto.
  terminology: Wasto at pare-pareho ang "Josue" at "Yahweh." Ang "kapulungan" ay angkop para sa עֵדָה, at ang "tagaigib ng tubig" ay tumpak na katumbas ng tungkuling ipinahahayag ng שֹׁאֲבֵי מַיִם. Walang kailangang talababa, sapagkat walang nawawalang mahalagang alternatibong kahulugan sa kasalukuyang salin.
