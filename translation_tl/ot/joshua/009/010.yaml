base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: tl
  text: at ang lahat ng ginawa niya sa dalawang hari ng mga Amoreo sa kabila ng Jordan[a]—kay Sihon na hari ng Hesbon at kay Og na hari ng Bashan, na nasa Ashtarot[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kabilang panig ng Jordan.”
    reason: lexical_alternative
  - marker: b
    text: O “na nasa Ashtarot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: at
  rationale: Ipinagpapatuloy ng וְ at panandang tuwirang layon ang talaan mula sa naunang talata; sapat ang likas na pang-ugnay na “at” sa Tagalog.
- source_word: כָּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Ipinahahayag nito ang kabuuan ng mga gawang ibinabalita at natural na kaugnay ng “ginawa.”
- source_word: עָשָׂה
  choice: ginawa niya
  rationale: Malawak ang kahulugan ng עשה na “gumawa”; pinananatili ng “ginawa niya” ang di-tahasang pagkakakilanlan ng paksa sa Hebreo at umaasa sa konteksto.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: sa dalawang hari ng mga Amoreo
  rationale: Pinananatili ng “sa” ang di-tiyak na relasyon ng לְ sa pandiwang “ginawa,” sa halip na idagdag ang mas mapagpasyang “laban sa.” Ang kolektibong הָאֱמֹרִי ay likas na tinutukoy sa Tagalog bilang “mga Amoreo.”
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Ang בְּעֵבֶר ay tumutukoy sa kabilang panig mula sa pananaw ng nagsasalita. Maikli at natural ang “sa kabila ng Jordan,” habang iniiwan sa konteksto ang eksaktong heograpikong pananaw.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: kay Sihon na hari ng Hesbon
  rationale: Ginagamit ang “kay” para sa personal na layon at ang “na hari ng Hesbon” bilang malinaw at likas na apposition sa modernong Tagalog.
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: at kay Og na hari ng Bashan
  rationale: Pinananatili ang paralel na ayos ng parirala tungkol kay Sihon at ang mga pangalang pantangi bilang transliterasyon.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: na nasa Ashtarot
  rationale: Pinakamalapit na tinutukoy ng sugnay si Og. Ang “nasa” ay natural na katumbas ng lokatibong בְּ ngunit maaari ring isalin na “nakatira sa,” kaya itinatala ang alternatibo sa talababa.
theological_decisions:
- issue: Di-tahasang paksa ng עָשָׂה
  choice: “ginawa niya,” nang hindi tahasang idinaragdag ang “Panginoon”
  alternative: “ginawa ng PANGINOON”
  rationale: Pangatlong panauhang panlalaki ang pandiwa ngunit walang tahasang paksa sa talatang ito. Tinutukoy ng konteksto ang PANGINOON, subalit pinananatili ng salin ang anyo at bahagyang di-pagtukoy ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga Amoreo” bilang karaniwang anyong etniko, “Hesbon” at “Ashtarot” bilang mga transliterasyong angkop sa baybay-Tagalog, at pinanatili ang bitin na pangwakas na gitling dahil bahagi ang talata ng nagpapatuloy na pangungusap.
