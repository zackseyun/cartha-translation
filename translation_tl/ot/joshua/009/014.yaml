base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: tl
  text: Kaya kumuha ang mga lalaki ng ilan sa kanilang baon, ngunit hindi nila hiningi ang pasiya ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “ang bibig ni Yahweh”; ibig sabihin, ang kanyang patnubay o pasiya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: kumuha
  rationale: Tuwirang katumbas ng pangunahing diwa ng לקח na ‘kumuha’; hindi nito dinaragdagan kung tinanggap, sinuri, o tinikman nila ang baon.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Pinananatili ang payak na kahulugan ng pangngalan. Bagaman ipinakikilala sila ng konteksto bilang mga kinatawan ng Israel, hindi iyon tahasang sinasabi sa sugnay.
- source_word: מִצֵּידָם
  choice: ng ilan sa kanilang baon
  rationale: Ang צֵיד ay pagkaing panlakbay o panustos, at ang מִן ay partitive dito. Likas sa Filipino ang ‘ilan sa kanilang baon’ at ipinahihiwatig nitong bahagi lamang ang kinuha.
- source_word: פִּי יְהוָה
  choice: ang pasiya ni Yahweh
  rationale: Literal itong ‘bibig ni Yahweh,’ isang idyoma para sa kapahayagan, patnubay, o pasiyang hinihingi mula sa Diyos. Ang ‘pasiya’ ay natural at hindi labis na nagpapaliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa transliterasyon ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לֹא שָׁאָלוּ
  choice: hindi nila hiningi
  rationale: Ang שׁאל ay ‘magtanong’ o ‘humingi.’ Kasama ng idyomang פִּי יְהוָה, natural sa Filipino ang ‘hiningi ang pasiya,’ na nagpapahayag ng hindi nila pagsangguni kay Yahweh.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pagpapakahulugan sa idyomang פִּי יְהוָה
  choice: ang pasiya ni Yahweh
  alternative: ang bibig ni Yahweh; ang salita ni Yahweh; ang payo ni Yahweh
  rationale: Ang literal na ‘bibig ni Yahweh’ ay tumutukoy sa tugon o kapasyahang nagmumula sa kanya. Inihahatid ng ‘pasiya’ ang idyomatikong diwa habang inilalagay sa talababa ang literal na larawan at ang saklaw nitong maaaring patnubay o pasiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘baon’ bilang karaniwang katawagan sa pagkaing dala sa paglalakbay, at ‘pasiya’ para sa idyomang tumutukoy sa tugon o direksiyon ni Yahweh.
