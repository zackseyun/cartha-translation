  text: וְ/יֹשְׁבֵ֨י גִבְע֜וֹן שָׁמְע֗וּ אֵת֩ אֲשֶׁ֨ר עָשָׂ֧ה יְהוֹשֻׁ֛עַ לִֽ/ירִיח֖וֹ וְ/לָ/עָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/003.yaml
  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: tl
  text: Ngunit narinig ng mga naninirahan sa Gibeon ang ginawa ni Josue sa Jerico at sa Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At narinig ng mga naninirahan sa Gibeon ang ginawa ni Josue sa Jerico at sa Ai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: Ngunit ... ng mga naninirahan sa
  rationale: Ang יֹשְׁבֵי ay tumutukoy sa mga naninirahan sa isang lugar. Isinalin ang וְ bilang “Ngunit” upang ipakita ang pagkontra ng tugon ng Gibeon sa tugon ng mga hari sa naunang konteksto.
- source_word: גִבְעוֹן
  choice: Gibeon
  rationale: Pangalan ng lugar; ginamit ang karaniwang anyo sa makabagong saling Filipino.
- source_word: שָׁמְעוּ
  choice: nang mabalitaan
  rationale: Pangunahing diwa nito ang “narinig,” ngunit sa konteksto, natural na ipinapahayag ng “mabalitaan” na nalaman nila ang ulat tungkol sa ginawa ni Josue.
- source_word: אֵת אֲשֶׁר
  choice: ang ginawa
  rationale: Ipinakikilala ng pariralang Hebreo ang nilalaman ng kanilang nabalitaan; likas sa Filipino ang “ang ginawa.”
- source_word: עָשָׂה
  choice: ginawa
  rationale: Tuwirang katumbas ng pandiwang “gumawa.” Ipinahihiwatig na ng anyong Filipino at ng konteksto na nauna ang mga kilos kaysa sa pagkarinig tungkol sa mga ito.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga Bibliyang Filipino.
- source_word: לִֽ/ירִיחוֹ
  choice: sa Jerico
  rationale: Ang לְ ay tumutukoy sa lungsod na pinakitunguhan o ginawan ni Josue. Mas natural sa Filipino ang “ang ginawa ... sa Jerico” kaysa “kay Jerico,” yamang lungsod ito; hindi idinagdag ang mas interpretibong “laban sa.”
- source_word: וְ/לָ/עָי
  choice: at sa Ai
  rationale: Pinananatili ang pagkakapantay ng parirala sa Jerico at ang payak na ugnayang ipinahahayag ng Hebreo.
theological_decisions:
- issue: Pagkasalin sa panimulang וְ
  choice: Ngunit
  alternative: At
  rationale: Hindi ito usaping doktrinal kundi pandiskurso. Maaaring payak na pang-ugnay ang וְ, ngunit dito ay inililihis nito ang salaysay mula sa tugon ng mga hari tungo sa naiibang tugon ng Gibeon. Inilagay sa talababa ang literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “mga naninirahan” bilang tumpak ngunit karaniwang pananalita; ginamit ang “nang mabalitaan” upang maging natural ang sugnay na nakabitin at nagpapatuloy sa susunod na talata. Napanatili sa talababa ang mas pormal at tuwirang “At narinig.”
