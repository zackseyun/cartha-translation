base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: tl
  text: At ang mga sisidlang yari sa balat para sa alak na ito, na pinuno namin noong bago pa ang mga ito—tingnan ninyo, nabiyak na ang mga ito[a]. At itong mga damit at sandalyas namin ay naluma dahil sa napakahabang paglalakbay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumutok na” o “nabiyak at bumuka na.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “dahil sa sobrang haba ng paglalakbay, labis-labis.” Ang diwa ay napakahaba ng kanilang paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: mga sisidlang balat para sa alak
  rationale: Ang נֹאד ay sisidlang yari sa balat na ginagamit para sa likido gaya ng alak. Mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa isang hiram o teknikal na katawagan.
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: pinuno namin noong bago pa ang mga ito
  rationale: Ipinahihiwatig ng חֲדָשִׁים ang kalagayan ng mga sisidlan nang punuin ang mga iyon; natural at malinaw sa Tagalog ang sugnay na temporal.
- source_word: וְהִנֵּה
  choice: tingnan ninyo
  rationale: Pinananatili nito ang pantawag-pansing lakas ng הִנֵּה sa likas na modernong Tagalog.
- source_word: הִתְבַּקָּעוּ
  choice: pumutok na
  rationale: Ang pandiwa ay tumutukoy sa pagkabiyak o pagkapunit nang bumuka. Ang “pumutok” ay natural para sa sisidlang balat, habang inilalagay sa talababa ang malapit na alternatibo.
- source_word: שַׂלְמוֹתֵינוּ וּנְעָלֵינוּ
  choice: mga damit at sandalyas namin
  rationale: Malawak ang kahulugan ng שַׂלְמוֹת bilang mga kasuotan, at ang “sandalyas” ang angkop sa sinaunang konteksto ng נְעָלִים.
- source_word: בָּלוּ
  choice: naluma
  rationale: Ipinapahayag ng pandiwa ang pagkasira o pagkaluma dahil sa matagal na paggamit. Ang “naluma” ay maikli at likas sa Filipino.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: dahil sa napakahabang paglalakbay
  rationale: Ipinapahayag ng parirala ang sanhi at ang sukdulang haba o lawak ng paglalakbay. Ang saling ito ay natural habang pinananatili ang diin ng מְאֹד.
