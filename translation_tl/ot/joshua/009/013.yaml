  to: At ang mga sisidlang yari sa balat para sa alak na ito, na pinuno namin noong bago pa ang mga ito—tingnan ninyo, nabiyak na ang mga ito[a]. At itong mga damit at sandalyas namin ay naluma dahil sa napakahabang paglalakbay[b].
