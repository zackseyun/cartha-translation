source:
  edition: WLC
  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: tl
  text: Pumunta sila kay Josue sa kampo sa Gilgal at sinabi sa kanya at sa mga lalaki ng Israel, “Nanggaling kami sa isang malayong lupain. Kaya ngayon, makipagtipan kayo sa amin.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gumawa kayo ng kasunduan sa amin.” Literal sa Hebreo, “pumutol kayo ng tipan kasama namin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Pumunta sila
  rationale: Karaniwang nangangahulugang ‘pumunta/lumakad’ ang הלך. Ang ‘pumunta sila’ ay natural sa makabagong Filipino at pinananatili ang galaw patungo sa tinukoy na destinasyon.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּל
  choice: kay Josue sa kampo sa Gilgal
  rationale: Ipinahihiwatig ng inuulit na אֶל ang paglapit kay Josue at sa kampong nasa Gilgal. Ang ayos na ito ay natural sa Filipino nang hindi nawawala ang tao at lugar na pinuntahan.
- source_word: הַמַּחֲנֶה
  choice: kampo
  rationale: Ang מַחֲנֶה ay kampo o himpilan; ‘kampo’ ang pinakanatural at malinaw sa konteksto.
- source_word: אֵלָיו וְאֶל אִישׁ יִשְׂרָאֵל
  choice: sa kanya at sa mga lalaki ng Israel
  rationale: Ang אִישׁ יִשְׂרָאֵל ay kolektibong anyong isahan na tumutukoy sa mga lalaking Israelita. Pinananatili ng salin ang tahasang panlalaking anyo at ang kolektibong diwa.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: mula sa isang malayong lupain
  rationale: Ang אֶרֶץ ay maaaring ‘lupain’ o ‘bansa,’ at ang רְחוֹקָה ay ‘malayo.’ Ang ‘malayong lupain’ ay malinaw at hindi labis na nagpapakitid sa kahulugan.
- source_word: בָּאנוּ
  choice: Galing kami
  rationale: Sa natural na Filipino, malinaw na ipinahahayag ng ‘galing kami’ ang pinanggalingan at kasalukuyang pagdating ng mga nagsasalita; iniiwasan nito ang mas mabigat na ‘naparito kami.’
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Bukod sa temporal na ‘ngayon,’ ipinakikita ng parirala ang paghinuha patungo sa kahilingan; natural itong naihahatid ng ‘Kaya ngayon.’
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: makipagtipan kayo sa amin
  rationale: Ang כרת ברית ay idyomang literal na ‘pumutol ng tipan.’ Ang ‘makipagtipan’ ay natural na Filipino, pinananatili ang mahalagang salitang ‘tipan,’ at ang ‘kayo’ ay tumutugma sa pangmaramihang pautos.
theological_decisions:
- issue: Pagpapakahulugan sa בְרִית sa konteksto ng kasunduang pampolitika
  choice: tipan
  alternative: kasunduan
  rationale: Bagaman diplomatiko ang konteksto, בְרִית ang karaniwang salitang biblikal para sa ‘tipan.’ Pinananatili ito sa pangunahing teksto upang mapanatili ang leksikal at teolohikal na ugnayan, habang inilalagay sa talababa ang mas pangkontekstong ‘kasunduan.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Josue’ ayon sa nakagawiang anyong Tagalog ng pangalan. Pinanatili ang ‘mga lalaki ng Israel’ upang katawanin ang panlalaking kolektibong anyo ng Hebreo, at ‘tipan’ bilang pangunahing katumbas ng בְרִית.
