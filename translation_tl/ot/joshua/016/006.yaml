base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: tl
  text: Pagkatapos, ang hangganan ay umabot pakanluran[a] hanggang sa Mikmetat sa gawing hilaga. Lumiko ang hangganan pasilangan patungong Taanat-silo, dinaanan ito sa silangang bahagi, at nagpatuloy patungong Janoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “patungo sa dagat,” isang Hebreong paraan ng pagsasabi ng “pakanluran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Mula roon, ... ay umabot
  rationale: Sa paglalarawan ng mga hangganan, ipinapakita ng יָצָא ang pagpapatuloy o pag-abot ng guhit ng hangganan. Likas sa modernong Tagalog ang “umabot,” at ang “Mula roon” ay maayos na naghuhudyat ng pagpapatuloy ng ruta.
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Tumutukoy ito sa guhit na naghihiwalay sa mga lupaing inilaan, kaya mas angkop ang “hangganan” kaysa “teritoryo.”
- source_word: הַיָּמָּה
  choice: pakanluran
  rationale: Literal itong “patungo sa dagat,” isang karaniwang Hebreong idyoma para sa direksiyong kanluran. Inilagay sa talababa ang literal na larawan.
- source_word: הַמִּכְמְתָת
  choice: Mikmetat
  rationale: Isinalin sa baybay-Tagalog ang pangalan ng lugar ayon sa tunog ng Hebreo.
- source_word: מִצָּפוֹן
  choice: sa gawing hilaga
  rationale: Pinananatili nito ang maikling topograpikong paglalarawan ng Hebreo nang hindi labis na tinutukoy kung ang tinutukoy ay eksaktong hilaga ng bayan o ang hilagang panig ng ruta.
- source_word: וְנָסַב
  choice: lumiko
  rationale: Sa talaan ng mga hangganan, inilalarawan ng pandiwa ang pagbabago ng direksiyon ng guhit.
- source_word: מִזְרָחָה
  choice: pasilangan
  rationale: Malinaw at likas na katumbas ito ng anyong Hebreo na nagsasaad ng kilos patungo sa silangan.
- source_word: תַּאֲנַת שִׁלֹה
  choice: Taanat-silo
  rationale: Isinalin sa baybay-Tagalog ang tambalang pangalan ng lugar at ginamitan ng gitling upang ipakita ang pagkakaugnay ng dalawang bahagi.
- source_word: וְעָבַר אֹתוֹ
  choice: dinaanan ito
  rationale: Sa konteksto ng hangganan, nangangahulugan itong nagpatuloy ang guhit at dumaan sa tabi o lampas sa lugar na kababanggit lamang; ang “ito” ay tumutukoy sa Taanat-silo.
- source_word: מִמִּזְרַח
  choice: sa silangang bahagi
  rationale: Ipinahahayag nito ang kaugnayan ng daan ng hangganan sa silangang panig ng Taanat-silo habang iniiwasang gawing sobrang tiyak ang bahagyang maigsi at maaaring ambiguwong Hebreong parirala.
- source_word: יָנוֹחָה
  choice: Janoa
  rationale: Isinalin sa baybay-Tagalog ang pangalan ng lugar ayon sa karaniwang pagbigkas ng anyong Hebreo.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog na angkop sa heograpikong talaan. Pinanatiling maigsi ang sunod-sunod na kilos ng hangganan at hindi labis na nilutas ang sintaktikong kaiklian ng “sa gawing hilaga” at “sa silangang bahagi.”
