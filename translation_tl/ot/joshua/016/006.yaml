  revised_text: Pagkatapos, ang hangganan ay umabot pakanluran[a] hanggang sa Mikmetat sa gawing hilaga. Lumiko ang hangganan pasilangan patungong Taanat-silo, dinaanan ito sa silangang bahagi, at nagpatuloy patungong Janoa.
