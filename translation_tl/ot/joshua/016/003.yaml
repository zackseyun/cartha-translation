  text: וְ/יָֽרַד יָ֜מָּ/ה אֶל גְּב֣וּל הַ/יַּפְלֵטִ֗י עַ֣ד גְּב֧וּל בֵּית חוֹרֹ֛ן תַּחְתּ֖וֹן וְ/עַד גָּ֑זֶר וְ/הָי֥וּ תצאת/ו יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/003.yaml
  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: tl
  text: Pagkatapos, bumaba ang hangganan pakanluran patungo sa hangganan ng mga Yafletita, hanggang sa hangganan ng Mababang Beth-horon at hanggang sa Gezer; at nagwakas ito sa dagat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang mga labasan nito ay nasa dagat,” isang pormula sa paglalarawan ng hangganan na tumutukoy sa mga dulo o hantungan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Pagkatapos, bumaba ang hangganan
  rationale: Sa paglalarawan ng mga hangganan, ipinahihiwatig ng pandiwa ang pagbaba ayon sa lupain o pagpapatuloy ng linya. Idinagdag ang tahasang simunong “ang hangganan” mula sa konteksto upang maging malinaw at natural sa Tagalog.
- source_word: יָמָּה
  choice: pakanluran
  rationale: Ang anyong paturol mula sa “dagat” ay karaniwang nangangahulugang patungo sa kanluran sa mga heograpikong paglalarawan ng Hebreo.
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: patungo sa hangganan ng mga Yafletita
  rationale: Pinananatili ng “hangganan” ang teknikal na kahulugan ng גְּבוּל, at ang gentiliko ay tinumbasan bilang pangalan ng pangkat sa natural na anyong Tagalog.
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: hanggang sa hangganan ng Mababang Beth-horon
  rationale: Ang עַד ay nagsasaad ng saklaw o dulong naaabot. Ang תַּחְתּוֹן ay pagkakakilanlan sa Mababang Beth-horon bilang kaiba sa Mataas na Beth-horon.
- source_word: וְעַד גָּזֶר
  choice: at hanggang sa Gezer
  rationale: Pinananatili ang inulit na pormula ng saklaw at ang pangalang pantangi.
- source_word: וְהָיוּ תצאתיו יָמָּה
  choice: at nagwakas ito sa dagat
  rationale: Ang תֹּצְאוֹתָיו sa pormula ng hangganan ay tumutukoy sa mga dulo o hantungan nito. Ang idiomatikong “nagwakas ito” ay malinaw sa modernong Tagalog, habang ang panghuling יָמָּה ay inuunawang konkretong hantungan sa dagat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paulit-ulit na ayos ng paglalarawan sa hangganan, ngunit ginawang idiomatiko ang pangwakas na pormulang Hebreo. Ginamit ang “Yafletita” upang ilapit ang pangalan sa Hebreong Yafleti; pinanatili ang karaniwang anyo ng mga pangalang Beth-horon at Gezer.
