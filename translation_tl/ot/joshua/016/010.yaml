revisions:
- from: Ngunit hindi nila pinalayas ang mga Cananeong naninirahan sa Gezer. Kaya nanatiling naninirahan ang mga Cananeo sa gitna ng Efraim hanggang sa araw na ito at naging mga sapilitang manggagawa.
  to: Ngunit hindi nila pinalayas ang mga Cananeong naninirahan sa Gezer, at patuloy na naninirahan ang mga Cananeo sa gitna ng Efraim hanggang sa araw na ito at naging mga sapilitang manggagawa.
  rationale: Pinalitan ang paulit-ulit na “nananatiling naninirahan” ng mas natural na “patuloy na naninirahan” at ang “Kaya” ng “at” upang mas maingat na maipakita ang pagkakasunod ng salaysay sa Hebreo. Pinanatili ang “naging mga sapilitang manggagawa,” na naghahayag ng pagpasok ng mga Cananeo sa katayuang labor levy nang hindi tahasang nagtatakda ng ahenteng hindi binanggit ng pandiwa.
