base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: tl
  text: Ngunit hindi nila pinalayas ang mga Cananeong naninirahan sa Gezer, at patuloy na naninirahan ang mga Cananeo sa gitna ng Efraim hanggang sa araw na ito at naging mga sapilitang manggagawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: pinalayas
  rationale: Sa kontekstong ito, ang Hifil ng ירש ay tumutukoy sa pagpapaalis o pagtataboy sa mga naninirahan sa lupain, hindi lamang sa pag-angkin dito.
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: sa gitna ng Efraim
  rationale: Pinananatili ang heograpiko at panlipunang diwa ng paninirahan sa loob ng nasasakupan o pamayanan ng Efraim.
- source_word: לְמַס עֹבֵד
  choice: mga sapilitang manggagawa
  rationale: Ang parirala ay tumutukoy sa katayuang napaillkang paggawa o labor levy; natural at malinaw ito sa modernong Tagalog.
theological_decisions:
- issue: Ugnayan ng hindi pagpapaalis at patuloy na paninirahan
  choice: Hinati sa dalawang pangungusap at ginamit ang “Kaya” upang ipakita ang bunga.
  alternative: Pagdugtungin lamang sa “at” o “kaya” sa iisang pangungusap.
  rationale: Ang waw sa וַיֵּשֶׁב ay maaaring simpleng magpatuloy ng salaysay, ngunit malinaw sa konteksto ang resultang ugnayan; hindi nito dinaragdagan ang teksto ng doktrinal na interpretasyon.
- issue: Panahunan ng וַיְהִי
  choice: naging
  alternative: ay naging / at sila ay ginawang
  rationale: Ang anyo ay nagsasaad ng pagpasok sa isang kalagayan. Iniiwasan ang tahasang “ginawang,” na maaaring magtakda ng ahenteng hindi tuwirang binanggit sa pandiwa.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong “Cananeo” at “Efraim,” at iniwasan ang sobrang teknikal o makalumang pananalita.
