  yaml_path: translation/ot/joshua/016/002.yaml
  text: Then it went out from Bethel to Luz[a], and passed on to the border of the Arkites at Ataroth.
translation:
  language: tl
  text: Ang hangganan ay nagpatuloy mula sa Bethel patungong Luz at patungo sa hangganan ng mga Arkita[a], sa Atarot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isulat na “mga Arkio”; tumutukoy ito sa pangkat na Arkita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: ang hangganan ay nagtuloy
  rationale: Ipinahihiwatig ng konteksto na ang hangganan mula sa naunang talata ang paksa; natural sa Filipino na tahasang banggitin ito. Ang “nagtuloy” ay angkop sa paglalarawan ng ruta.
- source_word: מִבֵּית אֵל
  choice: Mula sa Bethel
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: לוּזָה
  choice: patungong Luz
  rationale: Ipinahahayag ng directional he ang pagkilos patungo sa Luz; malinaw itong naihahatid ng “patungong.”
- source_word: וְעָבַר
  choice: at dumaan
  rationale: Sa talaan ng mga hangganan, inilalarawan ng pandiwa ang pagpapatuloy ng linya sa isang pook, hindi kinakailangang pagtawid.
- source_word: אֶל גְּבוּל
  choice: sa hangganan ng
  rationale: Ang גְּבוּל ay tumutukoy sa hangganan o sakop; pinananatili ng “hangganan” ang heograpikong diwa.
- source_word: הָאַרְכִּי
  choice: mga Arkeo
  rationale: Gentiliko ito na tumutukoy sa pangkat o angkan; ang maramihang “mga Arkeo” ay natural sa Filipino.
- source_word: עֲטָרוֹת
  choice: Atarot
  rationale: Tuwirang transliterasyon ng pangalang Hebreo na עֲטָרוֹת, gamit ang anyong madaling basahin sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Tahasang ibinalik ang ipinahiwatig na paksang “ang hangganan” upang maging natural at maunawaan ang talata nang hindi binabago ang heograpikong diwa.
