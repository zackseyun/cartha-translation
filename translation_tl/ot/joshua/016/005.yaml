base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: tl
  text: 'Ganito ang nasasakupan ng mga anak ni Efraim ayon sa kani-kanilang angkan: ang hangganan ng kanilang mana sa silangan ay Atarot-adar[a] hanggang sa Mataas na Bet-horon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang hangganan ng kanilang mana sa dakong silangan ay Atarot-adar.” Maaaring unawain nang bahagyang naiiba ang pagkakaugnay ng pariralang Hebreo nang hindi nagbabago ang pangkalahatang heograpikal na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: nasasakupan / hangganan
  rationale: Dalawang ulit itong ginamit. Sa una, tumutukoy ito sa kabuuang teritoryo ng lipi, kaya natural ang “nasasakupan”; sa ikalawa, sa guhit ng hangganan na inilalarawan ng mga pangalan ng lugar, kaya “hangganan.”
- source_word: בְּנֵי אֶפְרַיִם
  choice: mga anak ni Efraim
  rationale: Pinananatili ang malinaw na idyomang pangangkanan ng Hebreo at ang pagkakaugnay nito sa lipi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa konteksto ng paghahati ng lupain, ang מִשְׁפָּחָה ay mga angkan na bumubuo sa lipi; nililinaw ng “kani-kanilang” ang distributibong diwa.
- source_word: נַחֲלָתָם
  choice: kanilang mana
  rationale: Tumutukoy sa lupaing minana o itinakdang bahagi; pinananatili ng “mana” ang mahalagang diwa ng נחלה.
- source_word: מִזְרָחָה
  choice: sa silangan
  rationale: Ipinakikita ang silangang bahagi o direksiyon ng hangganan sa natural na Filipino.
- source_word: עַטְרוֹת אַדָּר
  choice: Atarot-adar
  rationale: Pangalan ng lugar na isinalin-tunog ayon sa anyong Hebreo.
- source_word: עַד
  choice: hanggang sa
  rationale: Malinaw na naghahayag ng abot ng hangganan sa paglalarawang heograpikal.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: Mataas na Bet-horon
  rationale: Ang עֶלְיוֹן ay pantukoy na nagbubukod sa lugar na ito mula sa Mababang Bet-horon; natural sa Filipino ang pagkakasunod na ito.
