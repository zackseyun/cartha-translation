translation:
  language: tl
  text: At ang mga lungsod na ibinukod para sa mga anak ni Efraim sa loob ng mana ng mga anak ni Manases—lahat ng mga lungsod na iyon at ang mga nayon ng mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang mga lungsod na inihiwalay para sa mga anak ni Efraim.” Binibigyang-diin ng pandiwaring Hebreo na ang mga lungsod na ito ay itinangi mula sa teritoryo ng Manases para sa Efraim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: mga lungsod
  rationale: Karaniwang tumutukoy ang עִיר sa lungsod o bayan; pinananatili ng “mga lungsod” ang terminolohiyang angkop sa mga talaan ng teritoryo sa Josue.
- source_word: הַמִּבְדָּלוֹת
  choice: na ibinukod
  rationale: Ang pandiwaring mula sa בדל ay nagsasaad ng paghihiwalay o pagtatangi; malinaw na ipinahihiwatig ng “ibinukod” na ang mga lungsod ay nakalaan sa Efraim bagaman nasa mana ng Manases.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: para sa mga anak ni Efraim
  rationale: Pinananatili ang literal na pormulang pantribo na “mga anak ni Efraim,” na tumutukoy sa mga kaanib o salinlahi ng tribo.
- source_word: בְּתוֹךְ
  choice: sa loob ng
  rationale: Likas at malinaw itong nagpapahayag na ang mga lungsod ay nasa teritoryong inilaan sa ibang tribo.
- source_word: נַחֲלַת
  choice: mana
  rationale: Ang נַחֲלָה sa Josue ay tumutukoy sa lupaing minana o inilaan; pinananatili ng “mana” ang mahalagang diwa ng pagmamana sa lupain.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: mga anak ni Manases
  rationale: Pinananatili ang pormulang pantribo ng Hebreo at itinutugma sa pagkakasalin ng “mga anak ni Efraim.”
- source_word: כָּל הֶעָרִים
  choice: ang lahat ng lungsod
  rationale: Ipinahahayag ng כָּל ang kabuuan ng mga lungsod na ibinukod.
- source_word: וְחַצְרֵיהֶן
  choice: at ang mga nayon ng mga iyon
  rationale: Sa mga talaang panteritoryo, ang חָצֵר ay karaniwang tumutukoy sa mga nakadependeng nayon o pamayanang hindi napapaderan; nililinaw ng “ng mga iyon” na ang mga nayon ay kaugnay ng nabanggit na mga lungsod.
