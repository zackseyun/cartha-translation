base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/007.yaml
  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: tl
  text: Pagkatapos, bumaba ang hangganan mula sa Janoah patungong Atarot at Naarah[a], umabot sa Jerico[b], at nagtapos sa Jordan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Naarah; maaaring kaugnay ang pangalang ito sa Naarat na matatagpuan sa ibang tradisyon ng pangalan ng lugar.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “dumikit sa Jerico”; ang pandiwang Hebreo ay maaaring tumukoy sa pagtatagpo o pagdikit ng isang linya ng hangganan sa isang lugar.
    reason: lexical_alternative
  - marker: c
    text: Mas literal, “lumabas sa Jordan”; inilalarawan ng idyomang Hebreo ang tinahak o huling hantungan ng hangganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Pagkatapos, bumaba ang hangganan
  rationale: Sa paglalarawan ng mga hangganan, ang ירד ay tumutukoy sa pagbaba ng linya ayon sa taas ng lupa o direksiyon. Idinagdag ang tahasang “ang hangganan” para maging malinaw sa natural na Tagalog ang ipinahihiwatig na simuno.
- source_word: מִיָּנוֹחָה
  choice: mula sa Janoah
  rationale: Isinalin ang prefiks na מִן bilang “mula sa,” at tinumbasan ang pangalan ng lugar sa anyong madaling basahin sa Tagalog.
- source_word: עֲטָרוֹת
  choice: Atarot
  rationale: Isinatinig ang pangalan ng lugar sa halip na isalin ang kahulugan nito; ang “t” ay tuwirang kumakatawan sa panghuling ת.
- source_word: וְנַעֲרָתָה
  choice: at Naarah[a]
  rationale: Sinunod sa pangunahing teksto ang anyong Naarah ng Masoretikong pagbigkas, habang inilagay sa talababa ang posibleng kaugnayan nito sa Naarat.
- source_word: וּפָגַע בִּירִיחוֹ
  choice: umabot sa Jerico[b]
  rationale: Sa mga pormula tungkol sa teritoryo, maaaring mangahulugan ang פגע na sumapit, umabot, o dumikit ang linya sa isang lugar. Natural sa Tagalog ang “umabot sa” at hindi nito ipinapalagay na tumagos ang hangganan sa lungsod.
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: at nagtapos sa Jordan[c]
  rationale: Sa konteksto ng hangganan, ipinahihiwatig ng יצא ang labasan o huling hantungan ng linya. Malinaw na naipapahayag ng “nagtapos sa” ang tungkuling ito, habang itinatala sa talababa ang mas literal na idyoma.
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Ginamit ang nakaugaliang anyo ng pangalan ng ilog sa Tagalog; malinaw na sa konteksto na ilog ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginawang tahasan ang ipinahihiwatig na simulong “ang hangganan” upang maiwasan ang malabong “ito.” Pinanatiling mga transliterasyon ang mga pangalan ng lugar, at inilagay kaagad ang bawat panandang talababa pagkatapos ng salitang o pariralang tinutukoy nito.
