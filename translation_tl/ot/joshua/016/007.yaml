  source_fidelity: 'Tapat ang salin sa Hebreong paglalarawan ng galaw ng hangganan: ang ipinahiwatig na simuno na “ang hangganan” ay wastong ginawang tahasan; naipahayag ang pagbaba mula sa Janoah, ang pagpunta sa Atarot at Naarah, ang pag-abot/pagtagpo sa Jerico, at ang pagdating ng hangganan sa Jordan. Ang “umabot sa” at “nagtapos sa” ay kapwa katanggap-tanggap na pangkontekstong salin ng mga pandiwang ginagamit sa mga pormula ng hangganan, nang hindi nagpapataw ng mas tiyak na ruta kaysa sa Hebreo.'
