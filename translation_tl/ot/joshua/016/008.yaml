base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: tl
  text: Mula sa Tapuah, nagpapatuloy ang hangganan pakanluran hanggang sa Batis ng Cana[a], at ang mga dulong bahagi nito ay nasa dagat. Ito ang mana ng lipi ng mga anak ni Efraim ayon sa kani-kanilang angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “batis” ay maaari ring isaling “wadi” o “pana-panahong daluyan ng tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: Mula sa Tapuah
  rationale: Ipinahihiwatig ng מִן ang panimulang punto ng hangganan; ang pangalang pantangi ay isinatitik bilang Tapuah, na madaling basahin sa Filipino.
- source_word: יֵלֵךְ הַגְּבוּל
  choice: ang hangganan ay patungong
  rationale: Sa paglalarawan ng lupain, ang הלך kasama ng גְּבוּל ay tumutukoy sa direksiyong tinatahak ng linya ng hangganan; natural sa Filipino ang 'ay patungong.'
- source_word: יָמָּה
  choice: kanluran
  rationale: Ang anyong direksiyonal mula sa יָם ay karaniwang nangangahulugang pakanluran sa mga paglalarawan ng hangganan, sapagkat nasa kanluran ang dagat.
- source_word: נַחַל קָנָה
  choice: Batis ng Cana
  rationale: Maaaring tumukoy ang נַחַל sa batis, tuyong ilog, o wadi. Ang 'Batis' ay malinaw sa karaniwang mambabasa habang pinananatili sa talababa ang alternatibong heograpikal.
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: at nagtatapos ito sa dagat
  rationale: Ang תֹצְאֹתָיו sa pormulang panghangganan ay tumutukoy sa dulo o hantungan ng hangganan. Ang isahang 'ito' ay tumutukoy sa hangganan, at ang הַיָּמָּה rito ay konkretong hantungan sa dagat.
- source_word: זֹאת נַחֲלַת מַטֵּה
  choice: Ito ang mana ng lipi
  rationale: Ang parirala ay buod ng teritoryong inilaan; ang מַטֵּה sa kontekstong ito ay isang lipi, hindi literal na tungkod.
- source_word: בְנֵי אֶפְרַיִם
  choice: mga anak ni Efraim
  rationale: Pinananatili nito ang tahasang pampamilyang anyo ng Hebreo at ang karaniwang katawagan sa mga kabilang sa lipi ni Efraim.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa kontekstong panlipi, ang מִשְׁפָּחוֹת ay mga angkan o malalaking pangkat ng pamilya; mas tiyak dito ang 'angkan' kaysa 'pamilya.'
theological_decisions:
- issue: May-kasariang katawagang panlipi sa בְנֵי אֶפְרַיִם
  choice: mga anak ni Efraim
  alternative: mga inapo ni Efraim / sambayanan ni Efraim
  rationale: Pinananatili ang literal at pamantayang katawagang panlipi ng Hebreo nang hindi ito ginagawang tahasang neutral, ngunit likas pa rin ang parirala sa Filipino.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang ''hangganan,'' ''mana,'' at ''angkan'' bilang natural ngunit tumpak na mga terminong pangteritoryo at panlipi. Ang dalawang gamit ng יָמָּה ay pinag-iba: direksiyon na ''kanluran'' sa una at konkretong ''dagat'' sa ikalawa.'
