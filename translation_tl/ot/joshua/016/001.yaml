base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: tl
  text: Ang nabunot na bahagi para sa mga inapo ni Jose[a] ay mula sa Jordan sa Jerico, patungo sa mga tubig ng Jerico sa silangan[b], sa ilang na umaahon mula sa Jerico tungo sa kaburulan ng Bethel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumabas ang palabunot para sa mga anak ni Jose.” Sa kontekstong ito, ang palabunot ang paraan ng pagtatakda ng bahaging lupain.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tubig ng Jerico” ay maaaring tumukoy sa bukal o pinagkukunan ng tubig ng lungsod.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: ang nabunot na bahagi
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa naging resulta ng palabunutan. Mas likas ito sa modernong Tagalog kaysa sa literal na “lumabas ang palabunot,” habang pinananatili ang paraan ng paglalaan.
- source_word: לִבְנֵי יוֹסֵף
  choice: para sa mga inapo ni Jose
  rationale: Bagaman literal na “mga anak ni Jose,” pangkalahatang tumutukoy rito ang parirala sa mga liping nagmula kay Jose; malinaw at natural ang “mga inapo.”
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: mula sa Jordan sa Jerico
  rationale: Ipinahahayag ang panimulang dako sa Jordan na kaugnay ng Jerico nang hindi labis na tinutukoy kung eksaktong katapat o malapit dito.
- source_word: לְמֵי יְרִיחוֹ
  choice: patungo sa mga tubig ng Jerico
  rationale: Pinananatili ang kolektibo o maramihang anyo ng Hebrew at hindi ipinapalagay na iisang bukal lamang ang tinutukoy.
- source_word: מִזְרָחָה
  choice: sa silangan
  rationale: Natural na panandang heograpiko sa Tagalog para sa silangang panig o direksiyon.
- source_word: הַמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay angkop sa biblikal na heograpiya at hindi kinakailangang mangahulugang mabuhanging disyerto.
- source_word: עֹלֶה מִירִיחוֹ
  choice: paahon mula sa Jerico
  rationale: Ipinakikita ang pagtaas ng lupain mula sa mababang kinaroroonan ng Jerico patungo sa kaburulan.
- source_word: בָּהָר בֵּית אֵל
  choice: tungo sa kaburulan ng Bethel
  rationale: Dito ang הָר ay tumutukoy sa mataas o maburol na rehiyon, hindi lamang sa isang bundok.
