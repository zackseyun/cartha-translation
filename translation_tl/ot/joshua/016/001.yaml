  source_fidelity: Tumpak na naihahatid ng salin ang pagkakaloob sa mga inapo ni Jose sa pamamagitan ng palabunutan, ang Jordan na kaugnay ng Jerico, ang mga tubig ng Jerico sa silangan, at ang pag-ahon patungo sa kaburulan ng Bethel. Ang “mga inapo” ay isang angkop na pangkalahatang pagtukoy sa “mga anak ni Jose” sa kontekstong pantribo.
  naturalness: May bahagyang alanganin sa ugnayang “dumaraan sa ilang at paahon mula sa Jerico,” dahil hindi malinaw kung ano ang dumaraan at umaahon. Ang paglalagay ng “na” ay mas malinaw at mas likas na naglalarawan sa ilang bilang umaahon mula sa Jerico.
  terminology: Ang “nabunot na bahagi,” “ilang,” at “kaburulan” ay angkop sa modernong Filipino at sa rehistro ng salaysay na panghangganan. Panatilihin ang Jerico, Jose, at Bethel bilang mga pangalang lugar/personal na ginagamit sa draft. Ang tala a ay bahagyang nilinaw upang ang “palabunot” ay maipakitang paraan ng paglalaan, hindi isang hiwalay na kahulugang ipinapalit sa Hebreo.
