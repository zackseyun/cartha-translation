translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “nabunot na bahagi” upang maging malinaw ang sinaunang paraan ng paglalaan ng lupain, at “kaburulan” upang natural na maipahayag ang topograpiya.
