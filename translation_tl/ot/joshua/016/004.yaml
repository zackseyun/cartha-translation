  text: And the sons of Joseph[a], Manasseh and Ephraim, received their inheritance.
translation:
  language: tl
  text: At tinanggap ng mga anak ni Jose—sina Manases at Efraim—ang kanilang mana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “minana ang kanilang mana” o “inangkin ang kanilang mana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: At minana ... ang kanilang mana
  rationale: Ang Qal wayyiqtol ng נחל ay tumutukoy rito sa pagtanggap o pagtatamo ng bahaging inilaan bilang mana. Likas sa Tagalog ang pandiwang “minana,” habang ang “ang kanilang mana” ay tahasang nagpapahayag sa layon na ipinahihiwatig ng Hebreo at umaangkop sa konteksto ng paghahati ng lupain.
- source_word: בְנֵי יוֹסֵף
  choice: mga anak ni Jose
  rationale: Pinananatili nito ang pormal na katawagang pangangkanan ng Hebreo. Sa konteksto, tumutukoy ito sa mga liping nagmula kay Jose, na kinakatawan nina Manases at Efraim.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang pangalang nakasanayan sa modernong saling Tagalog para sa personal at pantribong pangalan.
- source_word: וְאֶפְרָיִם
  choice: at Efraim
  rationale: Ginamit ang nakasanayang anyong Tagalog ng pangalan at tuwirang pinanatili ang pang-ugnay.
- source_word: וַ
  choice: At
  rationale: Tuwirang ipinapakita ang pagpapatuloy ng salaysay na ipinahahayag ng waw sa wayyiqtol.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sina” upang likas na ipakilala sina Manases at Efraim bilang mga anak ni Jose, at ang mga gitling upang luminaw ang aposisyon. Pinanatili ang terminolohiyang “mana” dahil sentral ito sa konteksto ng paghahati ng lupain.
