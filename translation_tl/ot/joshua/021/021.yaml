base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: tl
  text: Ibinigay nila sa kanila ang Shekem at ang mga pastulan nito sa kaburulan ng Efraim[b]—ang lungsod na kanlungan para sa taong nakapatay[a]—at ang Gezer at ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “para sa pumatay.” Ang salitang Hebreo rito ay isang katawagang legal para sa taong naging sanhi ng pagkamatay ng iba at maaaring tumakas upang humanap ng kanlungan habang hinihintay ang paghatol; hindi nito kinakailangang sabihing nahatulan na siyang mamamatay-tao.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa Bundok ng Efraim”; ibig sabihin, sa kaburulan ng Efraim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ibinigay nila
  rationale: Isinalin ang wayyiqtol ng נתן bilang payak na nagdaang kilos sa salaysay; hindi na isinama ang panimulang pangatnig upang maging natural sa modernong Tagalog.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Tahasang panghalip na tumutukoy sa mga Levita ayon sa konteksto.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: ang lungsod na kanlungan para sa taong nakapatay
  rationale: Pinananatili ang legal na diwa ng lungsod na matatakbuhan ng isang nakapatay nang hindi agad ipinapalagay na nahatulan siya ng pagpatay.
- source_word: שְׁכֶם
  choice: Shekem
  rationale: Transliterasyong malapit sa pangalang Hebreo at madaling basahin sa Filipino.
- source_word: מִגְרָשֶׁיהָ
  choice: ang mga pastulan nito
  rationale: Tumutukoy sa mga bukas na lupaing nakalaan sa paligid ng lungsod, lalo na para sa pagpapastol at karaniwang gamit.
- source_word: בְּהַר אֶפְרָיִם
  choice: sa kaburulan ng Efraim
  rationale: Sa heograpikong gamit, ang הַר ay tumutukoy rito sa bulubunduking rehiyon ng Efraim, hindi lamang sa isang bundok.
- source_word: גֶּזֶר
  choice: Gezer
  rationale: Karaniwang malinaw na transliterasyon ng pangalan ng lugar.
theological_decisions:
- issue: Antas ng pananagutan ng הָרֹצֵחַ
  choice: taong nakapatay
  alternative: mamamatay-tao
  rationale: Hindi ipinahihiwatig ng legal na katawagan sa talatang ito na sadyang pumatay o nahatulan na ang tao; pinananatili ng salin ang pagiging bukas ng usapin habang hinihintay ang paghatol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod na kanlungan” sa halip na isang mas teknikal o denominasyonal na katawagan, at ang mga gitling na em dash ay naglilinaw na ang Shekem ang lungsod na kanlungang tinutukoy.
