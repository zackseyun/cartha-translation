  yaml_path: translation/ot/joshua/021/015.yaml
  text: Holon with its pasturelands[a], and Debir with its pasturelands.
translation:
  language: tl
  text: ang Holon, kasama ang mga pastulan nito,[a] at ang Debir, kasama ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na tala sa 1 Cronica 6:58, “Hilen” ang pangalan ng bayang ito; “Holon” naman ang mababasa rito sa Josue.
    reason: cross_reference
lexical_decisions:
- source_word: חֹלֹן
  choice: Holon
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon. Ang anyong nasa teksto ng Josue ay חֹלֹן (Holon).
- source_word: מִגְרָשֶׁהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ ay tumutukoy sa bukás na lupaing nakalaan sa isang bayan, lalo na para sa pagpapastol at sama-samang gamit. Sa konteksto ng mga lunsod ng mga Levita, malinaw at natural ang “mga pastulan nito.”
- source_word: דְּבִר
  choice: Debir
  rationale: Pangalan ito ng lugar, kaya direktang isinalin sa anyong transliterado.
- source_word: וְאֶת
  choice: at / kasama ang
  rationale: Hindi hiwalay na isinasalin ang panandang tuwirang layon na אֶת. Ang וְ ay “at,” samantalang ang ugnayan ng bawat bayan sa nakapaligid na lupa nito ay likas na ipinahayag sa Filipino bilang “kasama ang.”
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang anyong talaan ng talata at ang mga pangalan ng lugar; ginamit ang “mga pastulan” bilang malinaw na katawagan sa bukás na lupaing kaugnay ng bawat bayan.
