base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/035.yaml
  text: Dimnah with its pasturelands[b][a], and Nahalal with its pasturelands—four cities.
translation:
  language: tl
  text: ang Dimna at ang pastulan nito,[a][b] at ang Nahalal at ang pastulan nito—apat na lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nagkakaiba ang mga manuskritong Hebreo at sinaunang salin tungkol sa pagsama at pagkakaayos ng ilang pangalan ng lungsod sa bahaging ito; ihambing ang katumbas na talaan sa 1 Cronica 6:62 [6:77 sa ilang saling Ingles].
    reason: textual_variant
  - marker: b
    text: Maaari ring “lupang panlahat” sa halip na “pastulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְנָה
  choice: Dimna
  rationale: Pangalan ng lugar; tinumbasan sa karaniwang anyong transliterasyon sa modernong Filipino.
- source_word: מִגְרָשֶׁהָ
  choice: ang pastulan nito
  rationale: Ang מִגְרָשׁ ay lupang bukás sa paligid na nakatalaga sa bayan, lalo na bilang pastulan; malinaw at natural ang “pastulan” sa konteksto ng mga lungsod ng mga Levita. Ang hulaping pambabaeng isahan ay tumutukoy sa bawat lungsod.
- source_word: נַהֲלָל
  choice: Nahalal
  rationale: Pangalan ng lugar; pinanatili sa transliteradong anyo.
- source_word: עָרִים אַרְבַּע
  choice: apat na lungsod
  rationale: Tuwirang buod ng bilang ng mga lungsod sa listahan at kaayon ng gamit ng עָרִים sa mga talaan ng pamamahagi sa Josue.
