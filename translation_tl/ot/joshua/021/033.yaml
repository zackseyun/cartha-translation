  text: All the cities of the Gershonites by their families were thirteen cities[a], with their pasturelands.
translation:
  language: tl
  text: Ang kabuuang bilang ng mga lungsod ng mga Gershonita, ayon sa kanilang mga angkan, ay labintatlo, kasama ang mga pastulan ng mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: lahat
  rationale: Tuwirang ipinahahayag ang kabuuang bilang ng mga lungsod na inilaan sa pangkat na ito.
- source_word: עָרֵי
  choice: mga lungsod
  rationale: Ang עִיר ay tumutukoy sa isang lungsod o bayan; pinanatili ang karaniwang katawagang “lungsod” sa konteksto ng paghahati ng mga pamayanan.
- source_word: הַגֵּרְשֻׁנִּי
  choice: mga Gershonita
  rationale: Ang anyong gentiliko na isahan ay kolektibong tumutukoy sa mga inapo ni Gershon; natural sa Filipino ang maramihang “mga Gershonita.”
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinakikita ng לְ ang pag-uuri o pamamahagi batay sa mga angkan. Nililinaw ng “kani-kanilang” na higit sa isang angkan ang tinutukoy.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: labintatlong lungsod
  rationale: Natural na ayos sa Filipino ang bilang bago ang pangngalan.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: kasama ang mga pastulan ng mga iyon
  rationale: Ang מִגְרָשׁ sa kontekstong ito ay bukas na lupa sa paligid ng lungsod na ginagamit bilang pastulan. Ang “kasama” ay natural na katumbas ng pandugtong na וּ sa pormulang ito, at ang “ng mga iyon” ay tumutukoy sa mga lungsod.
