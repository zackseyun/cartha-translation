translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” sa halip na “pamilya” dahil ang konteksto ay pagkakahati ng lipi sa malalaking pangkat ng magkakamag-anak. Walang talababa sapagkat hindi kailangang ilahad sa publikasyong teksto ang simpleng pagkakaiba ng “at” at “kasama” sa וּ.
