base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/014.yaml
  text: Jattir with its pasturelands[a], and Eshtemoa with its pasturelands.
translation:
  language: tl
  text: ang Jatir at ang pastulan nito,[a] at ang Estemoa at ang pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupang panlahat,” ang lupa sa palibot ng bawat bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַתִּר
  choice: Jatir
  rationale: Pangalan ng lugar; ginamit ang anyong transliterado na natural sa ortograpiyang Filipino, kung saan karaniwang kumakatawan ang J sa tunog ng Hebreong yod sa mga pangalang biblikal.
- source_word: מִגְרָשֶׁהָ
  choice: ang pastulan nito
  rationale: Ang מִגְרָשׁ ay bukás na lupa sa palibot ng bayan na ginagamit bilang pastulan o lupang panlahat. Malinaw at likas sa modernong Filipino ang “pastulan,” habang pinananatili sa talababa ang mas malawak na alternatibo.
- source_word: אֶשְׁתְּמֹעַ
  choice: Estemoa
  rationale: Pangalan ng lugar; transliterado sa paraang madaling basahin sa Filipino, na hindi na pinananatili ang kumpol-katinig na “sht” ng kumbensiyong Ingles.
- source_word: וְאֶת
  choice: at
  rationale: Hindi tuwirang isinasalin ang pananda ng tiyak na layon na אֶת; ang prefiks na וְ ay likas na ipinahahayag bilang “at” sa talaan.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Pinanatili ang anyong talaan at ang pag-uulit ng “ang pastulan nito” sa tekstong Hebreo; ang talababa ay nakakabit sa unang paglitaw ngunit tumutukoy sa parehong gamit ng salita.
