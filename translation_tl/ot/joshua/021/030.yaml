  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: tl
  text: 'At mula sa lipi ni Aser: ang Misal[a] at ang mga pastulan nito,[b] at ang Abdon at ang mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybaying “Mishal.” Nagkakaiba ang mga transliterasyon ng pangalan ng lugar na ito.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga pastulan” ay tumutukoy sa bukás na lupaing pag-aari o nakatalaga sa bayan, lalo na para sa pagpapastol at iba pang kaugnay na gamit ng pamayanan.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: At mula sa lipi ni
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi. Isinasalin din ang pangatnig at pang-ukol bilang “At mula sa.”
- source_word: אָשֵׁר
  choice: Aser
  rationale: Karaniwang anyong Filipino ng pangalan ng lipi ni Asher.
- source_word: אֶת
  choice: —
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang tuwirang katumbas na kailangang ilahad sa Filipino.
- source_word: מִשְׁאָל
  choice: Misal
  rationale: Pangalan ng lugar na isina-Filipino ang baybay; pinananatili sa talababa ang alternatibong transliterasyong “Mishal.”
- source_word: מִגְרָשֶׁהָ
  choice: ang mga pastulan nito
  rationale: Ang מִגְרָשׁ ay bukás na lupaing nakatalaga sa bayan, lalo na para sa pagpapastol at kaugnay na gamit ng pamayanan. Natural at pamilyar sa Filipino ang “mga pastulan nito.”
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Tuwirang transliterasyon ng pangalan ng lugar at ang nakaugaliang anyo nito sa Filipino.
- source_word: וְ/אֶת
  choice: at ang
  rationale: Isinasalin ang pangatnig bilang “at,” samantalang ipinahihiwatig ng “ang” ang tiyak na layon sa natural na balangkas ng Filipino.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Isina-Filipino ang mga pangalang Asher at Mishal bilang “Aser” at “Misal,” habang pinanatili ang “Abdon.” Ang ayos ng pangungusap ay sumusunod sa anyo ng talaan sa konteksto.
