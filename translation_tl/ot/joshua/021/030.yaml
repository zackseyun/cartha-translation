  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pangatnig at pinagmulan na “mula sa lipi ni Aser,” pati ang dalawang bayang Misal at Abdon at ang kani-kanilang מִגְרָשֶׁהָ. Ang “mga pastulan nito” ay katanggap-tanggap na kontekstuwal na salin para sa bukás na lupang nakaugnay sa mga bayan.'
