id: JOS.21.38
reference: Joshua 21:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: tl
  text: 'At mula sa lipi ni Gad: ang Ramot sa Gilead, ang lungsod na kanlungan ng nakapatay[a], kasama ang mga pastulan nito[b], at ang Mahanaim, kasama ang mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pumatay.” Hindi ipinahihiwatig ng salitang ginamit dito na tiyak na sinadya ang pagpatay.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga pastulan” ay ang mga lupaing nakapaligid sa lungsod na inilaan upang gamitin kasama nito.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִמַּטֵּה גָד
  choice: At mula sa lipi ni Gad
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi; natural na pinagsama sa Tagalog ang pang-ugnay at pang-ukol bilang “At mula sa.”
- source_word: עִיר מִקְלַט
  choice: lungsod na kanlungan
  rationale: Ipinahahayag nito ang legal na tungkulin ng lungsod bilang takbuhan at proteksiyon para sa taong nakapatay.
- source_word: הָרֹצֵחַ
  choice: nakapatay
  rationale: Sa batas tungkol sa mga lungsod na kanlungan, hindi dapat ipalagay agad na sinadya ang pagpatay; ang “nakapatay” ay neutral at angkop sa konteksto.
- source_word: רָמֹת בַּגִּלְעָד
  choice: Ramot sa Gilead
  rationale: Isinalin ang pang-ukol nang natural at tinumbasan sa karaniwang baybay-Filipino ang pangalang Ramoth bilang Ramot.
- source_word: מִגְרָשֶׁהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ sa mga talaan ng mga lungsod ng mga Levita ay lupang nakapaligid sa lungsod, lalo na para sa pagpapastol.
- source_word: מַחֲנַיִם
  choice: Mahanaim
  rationale: Pangalan ito ng lugar at pinanatili sa transliterasyon.
theological_decisions:
- issue: Antas ng pananagutan ng הָרֹצֵחַ
  choice: nakapatay
  alternative: mamamatay-tao
  rationale: Hindi tahasang nilulutas ng talata kung sinadya o di-sinasadya ang pagpatay. Iniiwasan ng “nakapatay” ang pagpapalagay na napatunayan na ang pagpaslang.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang anyong talaan ng Hebreo at gumamit ng mga pangalang lugar na madaling basahin sa Filipino.
source_grounding:
  english_pob_role: consult_only
