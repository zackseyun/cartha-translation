  text: וַֽ/יִּגְּשׁ֗וּ רָאשֵׁי֙ אֲב֣וֹת הַ/לְוִיִּ֔ם אֶל אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וְ/אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וְ/אֶל רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: tl
  text: Pagkatapos, lumapit ang mga pinuno ng mga angkan[a] ng mga Levita kay Eleazar na pari, kay Josue na anak ni Nun, at sa mga pinuno ng mga angkan ng mga lipi ng mga anak ni Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga pinuno ng mga ama”; isang idyomang Hebreo para sa mga pinuno ng mga sambahayan o mga angkang nagmula sa iisang ninuno.
    reason: lexical_alternative
  - marker: b
    text: O “mga Israelita.” Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: lumapit
  rationale: Tumpak at likas na katumbas ng נגשׁ sa salaysay; ipinahihiwatig nito ang paglapit sa mga pinuno upang magharap ng usapin.
- source_word: רָאשֵׁי אֲבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Inihahatid ng “angkan” ang pangkat na nakabatay sa pinagmulang pamilya, samantalang likas sa makabagong Filipino ang “mga pinuno” para sa mga kinatawan nito.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang katawagan sa Filipino para sa pangkat na nagmula kay Levi.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Eleazar na pari
  rationale: Direkta at malinaw na salin ng pangalan at tungkuling כֹּהֵן.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josue na anak ni Nun
  rationale: Ginamit ang nakaugaliang anyong Filipino na “Josue” at likas na patronimikong pariralang “anak ni Nun.”
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: mga pinuno ng mga angkan ng mga lipi
  rationale: 'Pinananatili ang magkakaugnay na antas ng kaayusang panlipunan: mga pinuno ng angkan sa loob ng mga lipi.'
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ng mga anak ni Israel
  rationale: Pinananatili ang tahasang pananalitang pampamilya ng Hebreo at malinaw sa Filipino na tumutukoy ito sa mga inapo ni Israel.
theological_decisions:
- issue: Pananalitang pangkamag-anakan na may panlalaking anyo sa kaayusang panlipunan ng Israel
  choice: Pinanatili sa pangunahing teksto ang “mga anak ni Israel,” habang isinalin ang idyomang “mga ama” bilang “mga angkan.”
  alternative: “mga Israelita” at “mga sambahayan ng mga ama”
  rationale: Ang “mga anak ni Israel” ay nagpapanatili sa pampamilya at pangtipang anyo ng Hebreo. Sa kabilang banda, ang literal na “mga sambahayan ng mga ama” ay hindi likas at maaaring malabo sa Filipino, kaya “mga angkan” ang piniling malinaw na katumbas nang hindi binubura ang istrukturang batay sa angkan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “angkan” kaysa sa mas literal ngunit asiwa at malabong “sambahayan ng mga ama,” habang pinanatili ang “mga anak ni Israel” upang manatiling hayag ang pampamilyang larawan ng pinagmulang Hebreo.
