  rationale: Inayos ang dalawang di-likas na konstruksiyon (“Walang isa mang” at “mula sa lahat”) upang maging malinaw at natural ang Filipino. Inilipat ang talababa sa dulo ng buong pahayag dahil ang alternatibong “pangako” ay nakaaapekto sa dalawang paglitaw ng “salita” at sa diwa ng buong talata. Pinanatili ang ambigwidad ng דָּבָר sa pangunahing teksto bilang “salita.”
