base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: tl
  text: Wala ni isang salita sa lahat ng mabuting salitang sinabi ni Yahweh sa sambahayan ng Israel ang nabigo; natupad ang lahat ng iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Wala ni isang pangako sa lahat ng mabubuting pangakong sinabi ni Yahweh sa sambahayan ng Israel ang nabigo; natupad ang lahat ng iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: Walang isa mang salita ang nabigo
  rationale: Pinananatili ang isahang דָּבָר bilang “salita” at ipinapahayag sa likas na Filipino ang idyomang נָפַל bilang “nabigo,” ibig sabihi’y walang sinabi ang hindi natupad.
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: mula sa lahat ng mabuting salita
  rationale: Ang “mula sa lahat” ay sumasalamin sa paghihiwalay na ipinahihiwatig ng מִן, habang ang “mabuting salita” ay nagpapanatili sa pag-uulit ng דָּבָר at sa kolektibong diwa ng parirala.
- source_word: אֲשֶׁר דִּבֶּר
  choice: na sinabi
  rationale: Direktang inilalarawan ang naunang pagsasalita at pinananatili ang ugnayan ng דִּבֶּר sa “salita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: sa sambahayan ng Israel
  rationale: Pinananatili ang pormal at kolektibong larawan ng בֵּית יִשְׂרָאֵל; mas natural sa modernong Filipino ang “sambahayan” kaysa literal na “bahay” sa ganitong gamit.
- source_word: הַכֹּל בָּא
  choice: natupad ang lahat ng iyon
  rationale: Ang literal na “dumating ang lahat” ay idyoma para sa pagsasakatuparan. Ang “natupad” ay malinaw at likas sa Filipino, at ang “iyon” ay tumutukoy pabalik sa lahat ng sinabi.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kung isasalin ang דָּבָר bilang “salita” o “pangako”
  choice: salita
  alternative: pangako
  rationale: Ang “salita” ay nagpapanatili sa leksikal na pag-uulit at ugnayan sa pandiwang “sinabi.” Ang “pangako” ay makatuwirang pagpapakahulugan sa konteksto ngunit mas tiyak kaysa sa mismong salitang Hebreo, kaya inilagay bilang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang bahagyang pormal na “sambahayan ng Israel” upang maihatid ang kolektibo at tipanang himig ng Hebreo; ginamit ang “natupad” para sa malinaw na pagpapahayag ng idyomang הַכֹּל בָּא.
