  text: וּ/מִ/מַּ֨טֵּה דָ֔ן אֶֽת אֶלְתְּקֵ֖א וְ/אֶת מִגְרָשֶׁ֑/הָ אֶֽת גִּבְּת֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/023.yaml
  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: tl
  text: 'At mula sa lipi ni Dan: ang Elteke at ang pastulan nito,[a] at ang Gibeton at ang pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupang pastulan sa paligid nito” o “lupang panlahat nito” para sa Hebreong מִגְרָשֶׁהָ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: At mula sa lipi ni Dan
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi. Likas sa Tagalog ang pagsasama ng pang-ugnay at pang-ukol bilang “At mula sa.”
- source_word: אֶת
  choice: ang
  rationale: Walang tuwirang katumbas sa Tagalog ang Hebreong pananda ng tiyak na layon; ginamit ang “ang” upang likas na ipakilala ang mga bayang nakatala, hindi bilang mekanikal na salin ng אֶת.
- source_word: אֶלְתְּקֵא
  choice: Elteke
  rationale: Isinatinig ang pangalan ng lugar ayon sa anyong Hebreo at sa likas na baybay sa Filipino.
- source_word: מִגְרָשֶׁהָ
  choice: ang pastulan nito
  rationale: Ang מִגְרָשׁ ay lupang nakapaligid sa bayan na ginagamit bilang pastulan o lupang panlahat. Malinaw at maikli sa kasalukuyang Tagalog ang “pastulan,” at ang hulaping 3fs ay ipinahayag na “nito,” na tumutukoy sa bayan.
- source_word: גִּבְּתוֹן
  choice: Gibeton
  rationale: Isinatinig ang pangalan ng lugar mula sa Hebreong גִּבְּתוֹן sa paraang madaling basahin sa Filipino.
- source_word: וְ/אֶת
  choice: at ang
  rationale: Isinalin ang pang-ugnay na וְ bilang “at”; hindi mekanikal na isinalin ang pananda ng layon, ngunit ginamit ang “ang” para sa likas na balangkas ng talaan sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng talaan at ang pag-uulit sa Hebreo. Ginamit ang “pastulan” bilang madaling maunawaang pangunahing katawagan, habang inilagay sa talababa ang mas malalawak na posibleng kahulugan.
