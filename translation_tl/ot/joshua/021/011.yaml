base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: tl
  text: At ibinigay nila sa kanila ang Kiriat-arba (si Arba ang ama ni Anak)[a], na siyang Hebron, sa kaburulan ng Juda, kasama ang mga pastulan nito sa paligid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Arba ang ama o ninuno ni Anak.” Sa Hebreo, maaaring tumukoy ang salitang “ama” sa mismong ama o sa isang mas naunang ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Kaya ibinigay nila
  rationale: Ipinapakita ng wayyiqtol ang kasunod na pangyayari sa salaysay; natural sa modernong Tagalog ang “Kaya” habang pinananatili ang daloy mula sa naunang konteksto.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Pinananatili ang panghalip na panlalaking maramihan ng Hebreo sa halip na tahasang tukuyin sa talata ang mga Levitang tinutukoy ng konteksto.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiriat-arba
  rationale: Itinuturing itong pangalan ng lugar at isinasalin sa baybay na madaling bigkasin sa Filipino, sa halip na gawing literal na “Lungsod ni Arba.”
- source_word: אֲבִי הָעֲנֹוק
  choice: si Arba ang ama ni Anak
  rationale: Ginagawang buo at natural ang paningit na pagkakakilanlan. Pinananatili ang “ama,” ngunit inilalahad sa talababa na maaari rin itong tumukoy sa isang ninuno.
- source_word: הִיא חֶבְרוֹן
  choice: na siya ring Hebron
  rationale: Malinaw at likas na ipinahahayag sa Tagalog na ang Kiriat-arba ay ang lugar ding tinatawag na Hebron.
- source_word: בְּהַר יְהוּדָה
  choice: sa kaburulan ng Juda
  rationale: Ang הַר dito ay tumutukoy sa mataas at maburól na rehiyon ng Juda, hindi sa iisang bundok.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ ay bukas na lupa sa paligid ng isang bayan na ginagamit lalo na sa pagpapastol; malinaw at maikli ang “mga pastulan.”
- source_word: סְבִיבֹתֶיהָ
  choice: sa palibot nito
  rationale: Natural na inilalarawan nito ang lokasyon ng mga pastulan sa paligid ng lungsod.
