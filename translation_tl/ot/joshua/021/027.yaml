base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: tl
  text: Mula sa kalahating lipi ni Manases ay ibinigay sa mga anak ni Gershon, mula sa mga angkan ng mga Levita, ang Golan sa Bashan, ang lunsod ng kanlungan para sa nakapatay ng tao, kasama ang mga pastulan nito, at ang Beeshtera[a] kasama ang mga pastulan nito—dalawang lunsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Beeshterah; ihambing ang 1 Cronica 6:71, na may Ashtarot.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: At sa mga anak ni Gershon
  rationale: Pinananatili ng “mga anak ni Gershon” ang anyong pangkanunu-nunuan ng Hebreong בְנֵי habang malinaw na tumutukoy sa kanyang mga inapo.
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: mula sa mga angkan ng mga Levita
  rationale: Ang מִשְׁפָּחוֹת ay mga pangkat na magkakamag-anak sa loob ng lipi; mas tiyak dito ang “mga angkan” kaysa “mga pamilya.”
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: mula sa kalahating lipi ni Manases
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay “lipi”; natural sa Filipino ang “kalahating lipi.”
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: ang lunsod-kanlungan para sa nakapatay ng tao
  rationale: Ipinahahayag ng “lunsod-kanlungan” ang legal na katawagan, samantalang ang “nakapatay ng tao” ay hindi agad nagpapakahulugang sinadya ang pagpatay.
- source_word: גלון בַּ/בָּשָׁן
  choice: Golan sa Bashan
  rationale: Mga pangalang pook ang dalawang salita at isinalin sa pamamagitan ng transliterasyon.
- source_word: מִגְרָשֶׁהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ ay bukas na lupa sa paligid ng lunsod na ginagamit, bukod sa iba pa, sa pagpapastol; malinaw at maikli ang “mga pastulan.”
- source_word: בְּעֶשְׁתְּרָה
  choice: Beeshtera
  rationale: Sinusunod ng pangunahing teksto ang pangalan sa Masoretic Text at hindi ito itinutugma sa Ashtarot ng kahawig na tala sa 1 Cronica 6:71.
- source_word: עָרִים שְׁתָּיִם
  choice: dalawang lunsod
  rationale: Tuwirang pinananatili ang pangwakas na bilang ng mga lunsod.
- source_word: implicit verbal sense in allotment list
  choice: ibinigay nila
  rationale: Walang tahasang pandiwa sa talata, ngunit ipinagpapatuloy nito ang pormula ng pagbibigay sa nakapaligid na talaan; nililinaw ito sa Filipino upang mabuo ang pangungusap.
theological_decisions:
- issue: Legal na diwa ng הָרֹצֵחַ
  choice: nakapatay ng tao
  alternative: mamamatay-tao
  rationale: Sa mga batas tungkol sa lunsod-kanlungan, maaaring kabilang ang pagpatay na hindi sinadya. Iniiwasan ng “nakapatay ng tao” ang pagpapasyang may masamang hangarin habang pinananatili ang legal na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lunsod” at “angkan” para sa malinaw na estilong pangkasulatan; inilagay ang talababa sa Beeshtera, ang salitang aktuwal na tinutukoy ng alternatibong pagbasa.
