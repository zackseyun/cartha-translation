revisions:
- from: At sa mga anak ni Gershon, mula sa mga angkan ng mga Levita, ibinigay nila mula sa kalahating lipi ni Manases ang Golan sa Bashan—ang lunsod-kanlungan para sa nakapatay ng tao—kasama ang mga pastulan nito, at ang Beeshtera[a] kasama ang mga pastulan nito—dalawang lunsod.
  to: Mula sa kalahating lipi ni Manases ay ibinigay sa mga anak ni Gershon, mula sa mga angkan ng mga Levita, ang Golan sa Bashan, ang lunsod ng kanlungan para sa nakapatay ng tao, kasama ang mga pastulan nito, at ang Beeshtera[a] kasama ang mga pastulan nito—dalawang lunsod.
  rationale: Inayos ang ayos ng pangungusap upang ang “mula sa kalahating lipi ni Manases” ay malinaw na tumukoy sa mga lunsod na inilaan para sa mga anak ni Gershon. Pinalitan ang “lunsod-kanlungan” ng mas natural na “lunsod ng kanlungan,” nang walang pagbabago sa legal na diwa. Nilinaw rin sa talababa ang anyong Hebreo habang pinananatili ang transliterasyong Beeshtera sa pangunahing teksto.
