  text: Helkath with its pasturelands, and Rehob with its pasturelands—four cities.
translation:
  language: tl
  text: ang Helkat at ang pastulan nito, at ang Rehob at ang pastulan nito—apat na lungsod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקָת
  choice: Helkat
  rationale: Pangalan ng lugar; tinumbasan ayon sa bigkas ng Hebreo at sa likas na baybay sa Filipino.
- source_word: מִגְרָשֶׁהָ
  choice: ang pastulan nito
  rationale: Tumutukoy sa lupaing nakalaan sa paligid ng bawat lungsod para sa pagpapastol at kaugnay na gamit; mas tiyak at natural ito kaysa sa 'lupa sa paligid.' Ang hulaping pambabae sa Hebreo ay tumutukoy sa bawat lungsod.
- source_word: רְחֹב
  choice: Rehob
  rationale: Pangalan ng lugar; pinanatili ang anyong madaling makilala at bigkasin sa Filipino.
- source_word: עָרִים אַרְבַּע
  choice: apat na lungsod
  rationale: Tuwirang buod ng bilang ng mga lungsod na nakalista rito at sa naunang talata.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: ang ... at ang ... at ang ... at ang ...
  rationale: Hindi tuwirang isinasalin ang panandang layon na אֶת; ang mga pang-ugnay at pantukoy sa Filipino ang malinaw na naghahanay sa mga lungsod at kani-kanilang pastulan.
