base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: tl
  text: Ang Ain at ang pastulan nito[a], ang Juta at ang pastulan nito, at ang Bet-semes at ang pastulan nito—siyam na lungsod mula sa dalawang liping ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lupaing panlahat” o “lupaing nakapaligid”; tumutukoy sa lupaing nakatalaga sa bawat lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Ain
  rationale: Pangalan ng lugar; pinanatili sa transliterasyon. Ang “Ain” ay malinaw at malapit sa anyong Hebreo.
- source_word: מִגְרָשֶׁיהָ
  choice: ang pastulan nito
  rationale: Tumutukoy sa bukás na lupaing nakatalaga sa isang lungsod, lalo na para sa pagpapastol. Natural sa modernong Filipino ang “pastulan,” habang inilalahad sa talababa ang mas malawak na saklaw ng salita.
- source_word: יֻטָּה
  choice: Juta
  rationale: Pangalan ng lugar; ginamit ang anyong transliterado na madaling basahin sa Filipino, kung saan ang J ay karaniwang kumakatawan sa tunog na kaugnay ng Hebreong yod sa mga pangalang biblikal.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-semes
  rationale: Itinatag na pangalan ng lugar at hindi isinaling literal na “Bahay ng Araw.” Ang transliterasyon ay iniangkop sa karaniwang baybay at bigkas sa Filipino.
- source_word: עָרִים תֵּשַׁע
  choice: siyam na lungsod
  rationale: Ang עָרִים ay tumutukoy sa mga sentrong pamayanan; “mga lungsod” ang kumbensiyonal at angkop na salin sa konteksto ng paghahati ng mga lugar.
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: mula sa dalawang liping ito
  rationale: Pinananatili ang diwa ng pinagmulan o pagkakaloob mula sa dalawang liping nabanggit sa konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang anyong listahan ng Hebreo, ginamit ang “at” sa bawat pangalan, at inilagay ang buod na bilang pagkatapos ng gatlang.
