  terminology: Napananatili ang “Yahweh,” “buong lupain,” at “mga ninuno.” Idinagdag ang talababa para sa leksikal na posibilidad ng ירשׁ bilang “minana,” alinsunod sa English POB audit trail, nang hindi ipinipilit ang covenantal nuance sa pangunahing teksto.
