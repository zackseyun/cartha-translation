  text: וַ/יִּתֵּ֤ן יְהוָה֙ לְ/יִשְׂרָאֵ֔ל אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/תֵ֣ת לַ/אֲבוֹתָ֑/ם וַ/יִּרָשׁ֖וּ/הָ וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: tl
  text: Kaya ibinigay ni Yahweh sa Israel ang buong lupain na ipinangako niya sa kanilang mga ninuno sa pamamagitan ng panunumpa. Naging pag-aari nila iyon[a], at nanirahan sila roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “minana nila iyon”; ang pandiwang Hebreo ay maaari ring mangahulugang “magmana,” lalo na sa konteksto ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang banal na YHWH bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Payak at tuwirang ipinapahayag ng נתן ang pagkakaloob ng lupa.
- source_word: כָּל הָאָרֶץ
  choice: ang buong lupain
  rationale: Ang אָרֶץ ay tumutukoy rito sa lupaing ipinangako, hindi sa buong daigdig; malinaw na pinananatili ng “buong” ang saklaw ng כָּל.
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: na isinumpa niyang ibibigay
  rationale: Pinananatili ang tahasang diwa ng panunumpa sa שׁבע at ang naunang pangakong magkaloob.
- source_word: לַאֲבוֹתָם
  choice: sa kanilang mga ninuno
  rationale: Sa kontekstong ito, tumutukoy ang “kanilang mga ama” sa mga naunang ama ng Israel; ang “mga ninuno” ay likas at malinaw sa modernong Tagalog nang hindi binabago ang reperente.
- source_word: וַיִּרָשׁוּהָ
  choice: Inangkin nila iyon
  rationale: Naipapahayag ang aktuwal na pagkuha at paghawak sa lupa bilang pag-aari, habang hindi pinipilit ang pandiwa sa teknikal na kahulugang “minana.”
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: nanirahan doon
  rationale: Likas na Tagalog para sa paninirahan sa lupa at tuwirang tumutugma sa ישׁב ב.
- source_word: וַ
  choice: Kaya
  rationale: Ipinakikita ang buod o bungang kaugnayan ng talata sa naunang salaysay, hindi lamang ang payak na pagkakasunod.
theological_decisions:
- issue: Saklaw at lakas ng pahayag tungkol sa katuparan ng pangako sa lupain
  choice: Panatilihin ang mariing pahayag na ibinigay ni Yahweh sa Israel ang buong ipinangakong lupain at na inangkin at tinirhan nila iyon.
  alternative: Ipaliwanag itong bahagyang katuparan lamang, o gawing ganap na pormulang lumulutas sa lahat ng ibang teksto tungkol sa pananakop.
  rationale: Tahasan sa Hebreo ang כָּל (“buong/lahat”) at ang sunod-sunod na mga pandiwa ng pag-angkin at paninirahan. Dapat manatili ang sariling diin at tensiyon ng talata nang walang idinadagdag na sistematikong paglilinaw.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “lupain” para sa teritoryong ipinangako at ang “doon” upang maging natural ang pagtukoy sa lugar. Walang talababa dahil walang kinakailangang marker sa pangunahing teksto.
