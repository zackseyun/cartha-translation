revisions:
- from: Kaya ibinigay ni Yahweh sa Israel ang buong lupaing isinumpa niyang ibibigay sa kanilang mga ninuno. Inangkin nila iyon at nanirahan doon.
  to: Kaya ibinigay ni Yahweh sa Israel ang buong lupain na ipinangako niya sa kanilang mga ninuno sa pamamagitan ng panunumpa. Naging pag-aari nila iyon[a], at nanirahan sila roon.
  rationale: Pinalitan ang posibleng mapanligaw na “isinumpa” ng hayag na pahayag ng panunumpa. Inayos rin ang salin ng ירשׁ sa natural na Tagalog na nagsasaad ng aktuwal na pagmamay-ari, habang itinatala sa talababa ang alternatibong “minana.” Hindi binabago ng mga ito ang saklaw o lakas ng pahayag na ang buong ipinangakong lupain ay ibinigay at pinanirahan.
