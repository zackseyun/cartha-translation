  source_fidelity: 'Ang pangkalahatang diwa ay tapat sa Hebreo: ibinigay ni Yahweh ang buong lupain, at inari/pinamahayan ito ng Israel. Gayunman, ang “isinumpa niyang ibibigay” ay madaling unawaing “cursed,” samantalang ang נִשְׁבַּע ay malinaw na tumutukoy sa panunumpa. Kailangang linawin ang oath-bound na pangako.'
