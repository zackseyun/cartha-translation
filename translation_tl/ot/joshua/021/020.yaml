reference: Joshua 21:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/לְ/מִשְׁפְּח֤וֹת בְּנֵֽי קְהָת֙ הַ/לְוִיִּ֔ם הַ/נּוֹתָרִ֖ים מִ/בְּנֵ֣י קְהָ֑ת וַֽ/יְהִי֙ עָרֵ֣י גֽוֹרָלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: tl
  text: At para sa mga angkan ng mga anak ni Kohat—ang natitirang mga Levita mula sa mga anak ni Kohat—ang mga lungsod na napunta sa kanila sa pamamagitan ng palabunutan[a] ay mula sa lipi ni Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga lungsod ng kanilang bahagi sa palabunutan.”
    reason: Pinananatili ang mas literal na idyoma ng Hebreo bilang alternatibo habang malinaw ang pangunahing teksto.
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  choice: para sa mga angkan
  rationale: Ipinahihiwatig ng ל ang mga pangkat na tatanggap sa konteksto ng pamamahagi; natural at malinaw sa modernong Tagalog ang “para sa mga angkan.”
- source_word: בְּנֵי קְהָת
  choice: mga anak ni Kohat
  rationale: Pinananatili nito ang pormal na pananalitang pangangkan ng Hebreo, bagaman tumutukoy ito sa mga inapo ni Kohat.
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: ang natitirang mga Levita
  rationale: Tumutukoy ang participle sa mga Levitang hindi pa nasasaklaw ng naunang mga pamamahagi.
- source_word: מִבְּנֵי קְהָת
  choice: mula sa mga anak ni Kohat
  rationale: 'Pinananatili ng “mula sa” ang partitive na diwa ng מן: kabilang sila sa mas malawak na angkan ni Kohat.'
- source_word: עָרֵי גוֹרָלָם
  choice: ang mga lungsod na napunta sa kanila sa pamamagitan ng palabunutan
  rationale: Ginagawang malinaw sa likas na Tagalog na ang mga lungsod ay itinakda sa kanila sa pamamagitan ng lot/allotment, sa halip na gamitin ang di-natural na literal na “mga lungsod ng kanilang palabunutan.”
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: mula sa lipi ni Efraim
  rationale: Sa talaan ng mga lipi, ang מַטֶּה ay tumutukoy sa tribo; “lipi” ang karaniwan at marangal na salin sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig. Ginamit ang em dash upang luminaw na ang “natitirang mga Levita” ay paliwanag tungkol sa mga anak ni Kohat. Ang “palabunutan” ay pinanatili upang katawanin ang גורל at ang paraan ng pagtatalaga.
