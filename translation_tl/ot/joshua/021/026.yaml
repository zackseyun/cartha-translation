base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: tl
  text: Sa kabuuan, sampu ang mga lungsod, kasama ang mga pastulan ng mga ito,[a] para sa mga angkan ng natitirang mga anak ni Kohat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga pastulan” ay ang mga bukas na lupaing nakaugnay sa mga lungsod, lalo na para sa pagpapastol at iba pang kaugnay na gamit.
    reason: cultural_note
  - marker: b
    text: O “mga angkan ng natitirang mga Kohatita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: Sa kabuuan, sampu ang mga lungsod
  rationale: Ipinahahayag ng Hebreo ang kabuuang bilang bilang pangwakas na buod ng naunang talaan. Natural sa modernong Tagalog ang ayos na ito habang napapanatili ang diin sa bilang na sampu.
- source_word: מִגְרְשֵׁיהֶן
  choice: mga pastulan ng mga ito
  rationale: Ang מִגְרָשׁ sa mga talaan ng mga lungsod ng mga Levita ay tumutukoy sa bukas na lupaing nakaugnay sa lungsod, lalo na para sa pagpapastol at kaugnay na gamit. Nililinaw ng pariralang “ng mga ito” na ang mga lupain ay nauukol sa mga lungsod.
- source_word: לְמִשְׁפְּחוֹת
  choice: para sa mga angkan
  rationale: Ang מִשְׁפָּחוֹת ay mga pangkat ng magkakamag-anak sa loob ng isang lipi; mas tiyak dito ang “angkan” kaysa “pamilya.” Ipinahihiwatig ng לְ ang pagkakaloob o pag-uukol sa kanila.
- source_word: בְּנֵי קְהָת
  choice: mga anak ni Kohat
  rationale: Pinananatili nito ang literal at genealogical na pananalita ng Hebreo, samantalang maaari rin itong tumukoy nang mas malawak sa mga inapo o Kohatita.
- source_word: הַנּוֹתָרִים
  choice: natitirang
  rationale: Tinutukoy nito ang mga angkan ni Kohat na hindi kabilang sa sangay na naunang binigyan ng mga lungsod.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino; ginamit ang “Sa kabuuan” upang natural na maipakita ang pangwakas na pormula ng Hebreo, at “angkan” para sa yunit ng magkakamag-anak na mas malawak kaysa karaniwang pamilya.
