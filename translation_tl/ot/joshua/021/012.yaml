  text: But the fields of the city and its villages they gave to Caleb son of Jephunneh as his possession[a].
translation:
  language: tl
  text: Ngunit ang bukirin ng lungsod at ang mga pamayanan nito ay ibinigay nila kay Caleb na anak ni Jefune bilang kanyang pag-aari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nayon nito.” Ang salitang Hebreo ay maaaring tumukoy sa maliliit na pamayanan o mga pook sa labas na kaugnay ng isang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: ang bukirin ng lungsod
  rationale: Bagaman isahan ang anyong Hebreo, maaari itong tumukoy nang kolektibo sa lupang pansaka ng lungsod. Likas at malinaw sa Tagalog ang “bukirin” para sa kabuuang sakahang sakop nito.
- source_word: חֲצֵרֶיהָ
  choice: ang mga nayong sakop nito
  rationale: Sa kontekstong ito, tumutukoy ang salita sa maliliit o nakapailalim na pamayanang kaugnay ng lungsod, hindi lamang sa mga bakuran. Pinananatili ng “mga nayong sakop nito” ang ugnayang iyon nang hindi ito ginagawang pastulan.
- source_word: נָתְנוּ
  choice: ibinigay nila
  rationale: Tuwirang katumbas ito ng karaniwang pandiwang Hebreo na “magbigay” at pinananatili ang pangmaramihang simuno na ipinahihiwatig ng pandiwa.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: kay Caleb na anak ni Jefune
  rationale: Natural na Tagalog para sa di-tuwirang layon at sa pariralang nagpapakilala sa ama.
- source_word: בַּאֲחֻזָּתוֹ
  choice: bilang kanyang pag-aari
  rationale: Ipinahahayag nito ang legal at pangmatagalang paghawak sa lupa nang hindi awtomatikong nililinaw bilang mana.
- source_word: וְאֶת
  choice: Ngunit
  rationale: 'Ang pang-ugnay ay contrastive sa naunang talata: ang lungsod at pastulan nito ay para sa mga Levita, samantalang ang bukirin at mga nayong sakop nito ay kay Caleb.'
