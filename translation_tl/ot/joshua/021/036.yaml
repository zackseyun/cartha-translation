  yaml_path: translation/ot/joshua/021/036.yaml
  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: tl
  text: 'At mula sa lipi ni Ruben: ang Bezer at ang mga pastulan nito[b], at ang Jahaz[a] at ang mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Jahaz ay tinatawag ding Jahzah o Jahazah sa ibang mga salin.
    reason: lexical_alternative
  - marker: b
    text: Hindi taglay ng ilang manuskritong Hebreo at ng mga sinaunang saksi sa teksto ang Josue 21:36–37; ang mga lungsod na nakatala rito ay katumbas ng nasa 1 Cronica 6:78–79.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: At mula sa lipi ni
  rationale: Sa konteksto ng paghahati ng mga lungsod ayon sa Israelitang lipi, ang מַטֶּה ay likas na isinasaling “lipi”; pinananatili ng “At mula sa” ang ugnayan nito sa nagpapatuloy na talaan.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Karaniwang anyong Filipino ng pangalan ng tao at lipi.
- source_word: אֶת בֶּצֶר
  choice: ang Bezer
  rationale: Hindi isinasalin nang hiwalay ang panandang tuwirang layon na אֶת; tinutumbasan ng “ang” ang gamit ng pangalan sa pangungusap, at tina-transliterate ang pangalan ng lungsod.
- source_word: מִגְרָשֶׁהָ
  choice: ang mga pastulan nito
  rationale: Sa konteksto ng mga lungsod ng mga Levita, ang מִגְרָשׁ ay bukás na lupa sa palibot ng lungsod na ginagamit, bukod sa iba pa, bilang pastulan. Ang “mga pastulan” ay malinaw at natural sa modernong Filipino, samantalang ang “nito” ay tumutukoy sa lungsod.
- source_word: יַהְצָה
  choice: Jahaz
  rationale: Tina-transliterate ang pangalan ng lugar bilang “Jahaz”; inilalahad sa talababa ang iba pang kinaugaliang anyo ng pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lipi” para sa tribal allotment at “mga pastulan” para sa bukás na lupang nakatalaga sa paligid ng bawat lungsod. Inilagay ang tekstuwal na talababa sa unang sugnay ng talatang pinagtatalunan, at ang alternatibong baybay pagkatapos ng Jahaz.
