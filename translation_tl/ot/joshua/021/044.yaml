revisions:
- from: At binigyan sila ni Yahweh ng kapahingahan sa lahat ng dako, ayon sa lahat ng isinumpa niya sa kanilang mga ninuno. Walang isa man sa lahat ng kanilang mga kaaway ang nakapanindigan sa harap nila[a]; ibinigay ni Yahweh sa kanilang kamay ang lahat ng kanilang mga kaaway.[b]
  to: At binigyan sila ni Yahweh ng kapahingahan sa lahat ng panig, ayon sa lahat ng ipinanumpa niyang gagawin para sa kanilang mga ninuno. Walang isa man sa lahat ng kanilang mga kaaway ang nakapanindigan sa harap nila[a]; ibinigay ni Yahweh sa kanilang kamay ang lahat ng kanilang mga kaaway.[b]
  rationale: Pinalitan ang malabong “isinumpa niya” ng “ipinanumpa niyang gagawin” upang malinaw na maipahayag ang panunumpa ni Yahweh at ang saklaw ng ipinangako, nang walang pagdaragdag ng tiyak na nilalaman ng panunumpa. Pinalitan din ang “sa lahat ng dako” ng “sa lahat ng panig” upang mas tapat na maihatid ang spatial-total na diwa ng מִסָּבִיב. Napanatili ang wastong mga pananda at paliwanag ng talababa.
