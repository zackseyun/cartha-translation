  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֨נַח יְהוָ֤ה לָ/הֶם֙ מִ/סָּבִ֔יב כְּ/כֹ֥ל אֲשֶׁר נִשְׁבַּ֖ע לַ/אֲבוֹתָ֑/ם וְ/לֹא עָ֨מַד אִ֤ישׁ בִּ/פְנֵי/הֶם֙ מִ/כָּל אֹ֣יְבֵי/הֶ֔ם אֵ֚ת כָּל אֹ֣יְבֵי/הֶ֔ם נָתַ֥ן יְהוָ֖ה בְּ/יָדָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: tl
  text: At binigyan sila ni Yahweh ng kapahingahan sa lahat ng panig, ayon sa lahat ng ipinanumpa niyang gagawin para sa kanilang mga ninuno. Walang isa man sa lahat ng kanilang mga kaaway ang nakapanindigan sa harap nila[a]; ibinigay ni Yahweh sa kanilang kamay ang lahat ng kanilang mga kaaway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nakapanindigan sa harap nila” ay idyomang Hebreo na nangangahulugang matagumpay na lumaban o pumigil sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kanilang kamay” ay karaniwang idyomang Hebreo para sa pagbibigay ng isang tao sa kapangyarihan ng iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: binigyan ... ng kapahingahan
  rationale: Ang Hiphil ng נוח ay nagsasaad ng pagdudulot o pagbibigay ng pahinga. Pinananatili ng “binigyan ... ng kapahingahan” ang tema ng katuparan ng pangako at katiwasayan matapos ang pakikipaglaban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: מִסָּבִיב
  choice: sa lahat ng dako
  rationale: Ipinahihiwatig ng parirala ang ganap na katiwasayan laban sa mga bantang nakapaligid sa Israel; natural at malinaw ito sa modernong Tagalog.
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: ayon sa lahat ng isinumpa niya
  rationale: Pinananatili nito kapuwa ang diwa ng eksaktong pagtupad at ang kabuuang saklaw ng ipinangako sa pamamagitan ng sumpa.
- source_word: לַאֲבוֹתָם
  choice: sa kanilang mga ninuno
  rationale: Bagaman literal na “mga ama,” ang tinutukoy sa konteksto ay ang mga naunang salinlahing tumanggap ng pangako. Ang “mga ninuno” ang natural na panumbas sa Tagalog nang hindi binabago ang sanggunian.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  choice: Walang isa man ... ang nakapanindigan sa harap nila
  rationale: Pinananatili ang larawang Hebreo ng pagtayo sa harap ng kalaban habang ipinahihiwatig na walang sinumang matagumpay na nakalaban o nakapigil sa kanila.
- source_word: מִכָּל אֹיְבֵיהֶם
  choice: sa lahat ng kanilang mga kaaway
  rationale: 'Isinasama ang partitive na diwa: walang kahit isa mula sa kabuuan ng kanilang mga kaaway.'
- source_word: נָתַן ... בְּיָדָם
  choice: ibinigay ... sa kanilang kamay
  rationale: Pinananatili ang karaniwang idyomang Hebreo na tumutukoy sa pagbibigay ng mga kaaway sa kapangyarihan ng Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Nasa tekstong Hebreo ang personal na pangalan; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Saklaw ng pahayag na walang kaaway na nakapanindigan
  choice: Walang isa man sa lahat ng kanilang mga kaaway ang nakapanindigan sa harap nila
  alternative: Walang sinuman sa kanilang mga kaaway ang makalaban sa kanila
  rationale: Pinananatili ng napiling anyo ang idyomang “tumayo sa harap” at ang pangkalahatang pahayag ng tagumpay, nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- issue: Paglalarawan sa katuparan ng sumpa sa mga ama
  choice: ayon sa lahat ng isinumpa niya sa kanilang mga ninuno
  alternative: gaya ng lahat ng ipinangako niya sa kanilang mga ama
  rationale: Mahalaga ang sangkap ng sumpa sa נִשְׁבַּע, kaya hindi ito pinahina tungo sa karaniwang “ipinangako” lamang.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at biblikal na himig. Ginamit ang “kapahingahan” upang mapanatili ang temang teolohikal ng pahinga, at ang mga idyomang “nakapanindigan sa harap” at “sa kanilang kamay” ay pinanatili ngunit nilinaw sa mga talababa. Ang bawat pananda ng talababa ay nasa pangunahing teksto.
