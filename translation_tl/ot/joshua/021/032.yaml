base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: tl
  text: 'At mula sa lipi ni Neftali: ang Kedesh sa Galilea, ang lungsod na kanlungan para sa taong nakapatay[a], kasama ang mga pastulan nito; ang Hamot-dor, kasama ang mga pastulan nito[b]; at ang Kartan, kasama ang mga pastulan nito—tatlong lungsod.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa pumatay.” Ang salitang Hebreo ay tumutukoy sa taong nakapatay, lalo na sa legal na konteksto ng pagpapakupkop, at hindi kinakailangang sa taong sadyang pumatay.
    reason: lexical_alternative
  - marker: b
    text: “Hamot-dor” ang mababasa sa tekstong Hebreo; iniuugnay ito ng ilang tradisyon sa lugar na tinatawag na Hamat.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: At mula sa lipi ni Neftali
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod. Likas sa Tagalog ang pinagsamang salin ng pangatnig at pang-ukol bilang “At mula sa.”
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: ang lungsod na kanlungan ng nakapatay
  rationale: Ang עִיר מִקְלַט ay legal na katawagan para sa lungsod na kanlungan. Ang הָרֹצֵחַ ay tumutukoy sa taong nakapatay sa konteksto ng batas tungkol sa pagpapakupkop at hindi kinakailangang nagpapahiwatig ng sinadyang pagpaslang; kaya iniwasan ang “mamamatay-tao.”
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: ang Kedesh sa Galilea
  rationale: Isinalin ang pangalang pook sa karaniwang transliterasyong “Kedesh,” at ang rehiyon bilang “Galilea,” na natural at kilala sa modernong Filipino.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ ay bukás na lupaing nakapaligid at nakatalaga sa bayan, madalas para sa pagpapastol. Malinaw at likas sa Filipino ang “mga pastulan nito” sa paulit-ulit na pormula ng talaan.
- source_word: חַמֹּת דֹּאר
  choice: Hamot-dor
  rationale: Ang tekstong Masoretiko ay nagpapakita ng tambalang pangalan ng pook; pinananatili ng gitling ang anyo nito at ang transliterasyon ay iniangkop sa baybay Filipino.
- source_word: קַרְתָּן
  choice: Kartan
  rationale: Pangalan ito ng pook at tuwirang tinranslitera mula sa anyong Hebreo.
- source_word: עָרִים שָׁלֹשׁ
  choice: tatlong lungsod
  rationale: Isinaayos sa natural na ayos ng mga salita sa Filipino ang pangwakas na buod ng Hebreo.
theological_decisions:
- issue: Kung ang הָרֹצֵחַ ay nagpapahiwatig ng sinadyang pagpatay
  choice: nakapatay
  alternative: mamamatay-tao; pumaslang
  rationale: Pinananatili ng “nakapatay” ang legal na lawak at tunay na kalabuan ng salitang Hebreo sa konteksto ng mga lungsod na kanlungan, nang hindi agad ipinapalagay ang masamang hangarin o sinadyang pagpatay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormulang pangtalaan at ang pag-uulit ng “kasama ang mga pastulan nito,” habang iniwasan ang salitang “mamamatay-tao” dahil mas tiyak itong nagpapahiwatig ng kriminal at sinadyang pagpatay kaysa sa Hebreo.
