  yaml_path: translation/ot/joshua/021/028.yaml
  text: 'And from the tribe of Issachar: Kishion with its pasturelands, and Dabrath with its pasturelands.'
translation:
  language: tl
  text: 'At mula sa lipi ni Isacar: ang Kisyon kasama ang pastulan nito, at ang Daberat kasama ang pastulan nito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה יִשָּׂשכָר
  choice: lipi ni Isacar
  rationale: Ang מַטֶּה ay literal na 'tungkod' ngunit karaniwang tumutukoy sa isang lipi sa kontekstong ito; natural at tumpak sa modernong Tagalog ang 'lipi.'
- source_word: קִשְׁיוֹן
  choice: Kisyon
  rationale: Transliterasyon ng pangalang Hebreo na Qishyôn ayon sa karaniwang baybay at bigkas sa Filipino.
- source_word: מִגְרָשֶׁהָ
  choice: mga pastulan nito
  rationale: Tumutukoy ang מִגְרָשׁ sa nakapalibot na bukas na lupain ng lungsod na ginagamit, bukod sa iba pa, sa pagpapastol; pinananatili ng 'mga pastulan' ang gamit ng lupain at ang maramihang anyo ng salin.
- source_word: דָּבְרַת
  choice: Daberat
  rationale: Malapit na transliterasyon ng Hebreong Dāḇərat; pinananatili ang maikling patinig na ipinahihiwatig ng shewa sa halip na ang pinaikling Ingles na 'Dabrath.'
