  rationale: Pangalan ng lugar; ginamit ang anyong karaniwang makikilala sa tradisyong biblikal sa Filipino.
- source_word: מִגְרָשֶׁהָ
  choice: ang pastulan nito
  rationale: Tumutukoy sa lupaing nakalaan sa paligid ng lungsod, na karaniwang ginagamit sa pagpapastol; likas at malinaw ang isahang kolektibong 'pastulan' sa Filipino.
- source_word: גַּת רִמּוֹן
  choice: Gat-rimon
  rationale: Isinatinig ang tambalang pangalan ng lugar; pinanatili ng gitling na iisa itong pangalan.
- source_word: עָרִים אַרְבַּע
