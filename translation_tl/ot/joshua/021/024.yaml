  naturalness: Kailangan ang malaking titik sa simula ng talata. Ang “kasama ang pastulan nito” ay mas likas at malinaw sa modernong Filipino para sa pormulang “city with its pastureland.”
  terminology: Ang “pastulan” ay angkop bilang kolektibong katawagan para sa מִגְרָשׁ. Sa talababa, ang “lupaing para sa lahat” ay maaaring magpahiwatig ng lupang bukás sa lahat ng tao at hindi sapat na naihahatid ang kahulugang lupang nauukol sa lungsod; mas tumpak ang “lupaing pangkomunidad.”
