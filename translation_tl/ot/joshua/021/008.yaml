base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: tl
  text: Kaya ibinigay ng mga Israelita sa mga Levita ang mga lunsod na ito, kasama ang mga pastulang lupain ng mga lunsod na iyon, ayon sa iniutos ni Yahweh sa pamamagitan ni Moises[a], sa pamamagitan ng pagpapalabunutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “sa kamay ni Moises,” isang Hebreong idyoma na nangangahulugang “sa pamamagitan ni Moises.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ibinigay
  rationale: Tuwirang katumbas ng נתן sa salaysay; ipinahihiwatig dito ang pagbibigay o pagtatalaga ng mga lunsod sa mga Levita.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na ‘mga anak ni Israel,’ ang parirala ay pangkalahatang katawagan sa bayan ng Israel; mas likas at malinaw sa modernong Filipino ang ‘mga Israelita.’
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Tuwirang tumutukoy sa mga tumanggap ng mga lunsod.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ang mga lunsod na ito
  rationale: Pinananatili ang tiyak na pagtukoy ng demonstratibong הָאֵלֶּה sa mga lunsod na inilista sa konteksto.
- source_word: מִגְרְשֵׁיהֶן
  choice: mga pastulan ng mga iyon
  rationale: Ang מִגְרָשׁ ay bukás na lupain sa tabi ng isang lunsod, lalo na para sa pagpapastol at gamit ng pamayanan. Ang ‘mga iyon’ ay tumutukoy sa mga lunsod.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ayon sa iniutos
  rationale: Ipinahahayag ang pagsunod ng pagbibigay sa naunang utos; likas sa Filipino ang ‘ayon sa iniutos.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Isinasalin nang idiomatiko ang Hebreong pahayag na literal na ‘sa kamay ni Moises,’ na nagsasaad ng namamagitang kinatawan.
- source_word: בַּגּוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Tumutukoy sa paraan ng paghahati o pagtatalaga sa pamamagitan ng paghahagis ng lot; malinaw sa Filipino ang ‘palabunutan.’
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya ‘Yahweh’ ang ginamit upang mapanatili ang pagkakaiba nito sa titulong ‘Panginoon.’
- issue: Namamagitang pagkilos sa pariralang בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  alternative: sa kamay ni Moises
  rationale: Ang parirala ay Hebreong idyoma para sa utos na ipinaabot sa pamamagitan ni Moises. Iniiwasan ng pangunahing salin ang posibleng maling literal na pagkaunawa, habang itinatala sa talababa ang anyong salita-sa-salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga Israelita’ bilang likas na katawagan sa buong bayan, at ‘lunsod’ upang mapanatili ang pormal ngunit karaniwang rehistro. Ang bahagyang pag-uulit ng ‘sa pamamagitan’ ay pinanatili upang malinaw na maihiwalay ang tagapamagitan ng utos sa paraan ng pagtatalaga.
