revisions:
- from: Kaya ibinigay ng mga Israelita sa mga Levita ang mga lunsod na ito, kasama ang mga pastulan ng mga iyon, ayon sa iniutos ni Yahweh sa pamamagitan ni Moises[a], sa pamamagitan ng palabunutan.
  to: Kaya ibinigay ng mga Israelita sa mga Levita ang mga lunsod na ito, kasama ang mga pastulang lupain ng mga lunsod na iyon, ayon sa iniutos ni Yahweh sa pamamagitan ni Moises[a], sa pamamagitan ng pagpapalabunutan.
