translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “lunsod” para sa pormal na konteksto at “pastulan” para sa bukás na lupang nakapaligid at nakatalaga sa bawat lunsod. Pinanatili ang distributibong diin ng tekstong Hebreo sa “ang bawat isa,” at inilagay ang kinakailangang panandang [a] sa pangunahing teksto.
