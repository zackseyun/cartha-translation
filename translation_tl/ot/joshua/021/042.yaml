  text: Each of these cities had its surrounding pasturelands[a]; so it was for all these cities.
translation:
  language: tl
  text: Ang bawat lunsod na ito ay may mga pastulan sa paligid nito[a]; ganoon ang kalagayan ng lahat ng lunsod na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “lunsod sa bawat lunsod at ang mga pastulan nito sa palibot nito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶינָה
  choice: ay may
  rationale: Ang Qal imperfect na 3fp ng היה ay naglalarawan at nagbubuod ng kalagayan ng mga lunsod. Sa natural na Tagalog, ang pag-iral ng kalakip na pastulan ay malinaw na naipahahayag sa “ay may.”
- source_word: הֶעָרִים הָאֵלֶּה
  choice: mga lunsod na ito
  rationale: Karaniwang tumutukoy ang עִיר sa lunsod o bayan; ang “mga lunsod” ay angkop sa pormal na konteksto ng paghahati at pagtatalaga ng mga lugar.
- source_word: עִיר עִיר
  choice: ang bawat isa
  rationale: Ang pag-uulit na literal na “lunsod-lunsod” ay distributibo at tumutukoy sa bawat lunsod nang isa-isa. Natural itong ipinahahayag sa Tagalog bilang “ang bawat isa.”
- source_word: וּמִגְרָשֶׁיהָ
  choice: pastulan
  rationale: Ang מִגְרָשׁ ay bukás na lupang nakatalaga sa isang lunsod, lalo na bilang pastulan. Ang “pastulan” ay malinaw at likas sa modernong Tagalog.
- source_word: סְבִיבֹתֶיהָ
  choice: sa palibot nito
  rationale: Pinananatili nito ang lokatibong diwa na ang mga pastulan ay nasa paligid ng bawat lunsod.
- source_word: כֵּן
  choice: gayundin
  rationale: Dito, ang כֵּן ay nagbubuod at nagpapatunay na iisa ang kaayusan sa buong pangkat; natural itong isalin na “gayundin.”
- source_word: לְכָל הֶעָרִים הָאֵלֶּה
  choice: ang lahat ng lunsod na ito
  rationale: Ipinapakita ng parirala na ang inilalarawang kaayusan ay umiiral sa kabuuan ng mga lunsod na nabanggit.
