  text: וְ/לִ/בְנֵ֣י גֵרְשׁ֗וֹן מִ/מִּשְׁפְּח֣וֹת מַטֵּֽה יִשָּׂשכָ֣ר וּ/מִ/מַּטֵּֽה אָ֠שֵׁר וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י וּ֠/מֵ/חֲצִי מַטֵּ֨ה מְנַשֶּׁ֤ה בַ/בָּשָׁן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: tl
  text: At sa mga anak ni Gershon, mula sa mga angkan[a] ng lipi ni Isacar, mula sa lipi ni Aser, mula sa lipi ni Naftali, at mula sa kalahating lipi ni Manases na nasa Basan—labintatlong lungsod sa pamamagitan ng palabunutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pamilya.” Ang salitang Hebreo ay tumutukoy sa malalaking pangkat ng magkakamag-anak o mga angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: At sa mga anak ni Gershon
  rationale: Pinananatili ang pagpapatuloy ng talaan sa וְ at ang diwang paglalaan ng לְ. Ang “mga anak” ay malapit sa pormal na anyo ng בְּנֵי at malinaw rin bilang mga inapo o pangkat na nagmula kay Gershon.
- source_word: מִ/מִּשְׁפְּח֣וֹת
  choice: mula sa mga angkan[a]
  rationale: Sa kontekstong pantribo, ang מִשְׁפָּחוֹת ay tumutukoy sa malalaking pangkat ng magkakamag-anak; mas tiyak dito ang “mga angkan” kaysa sa karaniwang “mga pamilya,” ngunit inilalahad sa talababa ang tunay na alternatibo.
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa talaan ng paghahati ng lupain, ang מַטֶּה ay yunit pantribo; ang “lipi” ang natural at nakaugaliang salin sa Filipino.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: at mula sa kalahating lipi ni Manases
  rationale: Tumpak na inilalarawan ng “kalahating lipi” ang חֲצִי מַטֶּה at pinananatili ang paulit-ulit na “mula sa” ng tekstong Hebreo.
- source_word: בַ/בָּשָׁן
  choice: na nasa Basan
  rationale: Iniuugnay ng parirala ang kalahating lipi ni Manases sa rehiyong Basan; ang “na nasa” ay natural sa Filipino at hindi nagdaragdag ng kahulugan.
- source_word: בַּ/גּוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Ipinahahayag nito ang paraang ginamit sa pamamahagi. Ang “palabunutan” ay malinaw na modernong Filipino para sa paglalaan sa pamamagitan ng lot.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: labintatlong lungsod
  rationale: Ang עָרִים ay mga lungsod o bayan; “mga lungsod” ang angkop sa pormal na talaan ng mga inilaan na lugar sa Josue.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan at ang pag-uulit ng mga pinagmulan, habang inayos ang hulihang parirala upang maging natural sa Filipino. Ginamit ang karaniwang anyong Filipino ng mga pangalang Isacar, Aser, Naftali, Manases, at Basan; pinanatili ang Gershon upang malinaw na katawanin ang pangalang Hebreo.
