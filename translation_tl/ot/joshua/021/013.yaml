  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֣ן הַ/כֹּהֵ֗ן נָֽתְנוּ֙ אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת חֶבְר֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: tl
  text: At para sa mga anak ng paring si Aaron, ibinigay nila ang Hebron, ang lungsod na kanlungan para sa taong nakapatay[a], kasama ang mga pastulan nito, at ang Libna, kasama ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa nakapatay.” Ang salitang Hebreo rito ay terminong legal para sa isang taong nakapatay at maaaring tumakas sa isang lungsod na kanlungan; hindi nito kinakailangang ipahiwatig na sinadya o pinagplanuhan ang pagpatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: At sa mga anak ng paring si Aaron
  rationale: Pinananatili ang di-tuwirang layon na ipinahihiwatig ng לְ at ang anyong 'mga anak ni Aaron,' na tumutukoy sa linya ng mga pari. Ang 'paring si Aaron' ay likas at malinaw na pagkakakilanlan sa Filipino.
- source_word: נָתְנוּ
  choice: ibinigay nila
  rationale: Tuwirang katumbas ng pandiwang נתן at angkop sa konteksto ng pagbibigay ng mga lungsod bilang bahagi.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: ang kanlungang-lungsod para sa nakapatay
  rationale: Ipinapahayag ng 'kanlungang-lungsod' ang legal na tungkulin ng lugar. Ang 'nakapatay' ay hindi agad nagpapahiwatig ng sinadyang pagpaslang, kaya napapanatili ang saklaw at tensiyon ng terminong Hebreo sa kontekstong ito.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Karaniwang anyo ng pangalan ng lugar sa Filipino at sa mga salin ng Biblia.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ ay bukas na lupa sa paligid ng lungsod na ginagamit, bukod sa iba pa, bilang pastulan. Malinaw at natural ang 'mga pastulan' sa konteksto ng mga lungsod ng mga Levita.
- source_word: לִבְנָה
  choice: Libna
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
theological_decisions:
- issue: Kung ang הָרֹצֵחַ ay dapat isaling 'mamamatay-tao' o sa paraang hindi nagpapalagay ng sinadyang pagpatay
  choice: nakapatay
  alternative: mamamatay-tao / pumatay
  rationale: Sa batas tungkol sa mga kanlungang-lungsod, maaaring tumukoy ang salita sa taong nakapatay na may karapatang tumakas doon, kaya hindi dapat ipalagay ng salin na sadya o pinagplanuhan ang pagpatay.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na legal na katawagang 'kanlungang-lungsod.' Ginamit ang maayos na ayos ng pangungusap upang mapanatili ang diin sa mga tumanggap at sa mga lungsod na ibinigay.
