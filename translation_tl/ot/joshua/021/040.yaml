base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: tl
  text: Ang lahat ng lunsod para sa mga anak ni Merari[a], ayon sa kanilang mga angkan—ang mga natitira sa mga angkan ng mga Levita[b]—ay labindalawa; ang mga ito ang bahaging itinalaga sa kanila sa pamamagitan ng palabunutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Merari” o “mga Merarita.”
    reason: lexical_alternative
  - marker: b
    text: O “ang mga natitira mula sa mga angkan ng mga Levita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Ang lahat ng lunsod
  rationale: Ang עִיר ay maaaring ‘lunsod’ o ‘bayan.’ Pinili ang ‘lunsod’ upang maging pare-pareho sa talaan ng mga pamayanang ipinamahagi.
- source_word: לִבְנֵי מְרָרִי
  choice: para sa mga anak ni Merari
  rationale: Pinananatili ng ‘mga anak ni Merari’ ang anyong Hebreo, habang nililinaw sa talababa na maaari itong tumukoy sa mga inapo o angkan ni Merari.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa konteksto ng pamamahagi sa mga pangkat na nagmula sa iisang ninuno, mas tiyak ang ‘angkan’ kaysa sa karaniwang ‘pamilya.’
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: ang mga natitira sa mga angkan ng mga Levita
  rationale: Pinananatili nito ang substantibong diwa ng participle na ‘mga natitira’ at ang kaugnayan nila sa mas malawak na mga angkan ng mga Levita.
- source_word: וַיְהִי גּוֹרָלָם
  choice: ito ang bahaging napunta sa kanila sa palabunutan
  rationale: Natural nitong ipinahahayag sa Filipino ang literal na ‘at ang kanilang kapalaran/bahagi sa palabunutan ay,’ nang hindi ipinahihiwatig na nagkataon lamang ang kinalabasan.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: ay labindalawa
  rationale: Dahil nabanggit na ang ‘mga lunsod’ sa simula, natural sa Filipino ang ‘ay labindalawa’ at iniiwasan ang di-kailangang pag-uulit.
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang ‘angkan’ para sa mga pangkat na genealogical at ang ‘palabunutan’ para sa paraang ginamit sa paghahati ng mga lunsod.
