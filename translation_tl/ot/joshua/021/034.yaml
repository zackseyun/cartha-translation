base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: tl
  text: 'At sa mga angkan ng mga anak ni Merari, ang nalalabing mga Levita, mula sa lipi ni Zebulun: ang Jokneam at ang mga pastulan nito, at ang Kartah[a] at ang mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kartah ay isinusulat ding “Kartha” sa ilang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּחוֹת
  choice: At sa mga angkan ng
  rationale: Ipinagpapatuloy ng וּ at לְ ang talaan ng pamamahagi mula sa naunang talata. Ang “mga angkan” ay malinaw na tumutukoy sa mga sangay ng isang lipi at natural sa makabagong Filipino.
- source_word: בְּנֵי מְרָרִי
  choice: mga anak ni Merari
  rationale: Pinananatili nito ang karaniwang anyong pangangkanan ng Hebreo nang hindi pinapalitan ng mas interpretatibong “mga inapo.”
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: ang nalalabing mga Levita
  rationale: Tumutukoy ito sa pangkat ng mga Levita na hindi pa nabibigyan sa naunang bahagi ng pamamahagi.
- source_word: מֵאֵת מַטֵּה זְבוּלֻן
  choice: mula sa lipi ni Zebulun
  rationale: Sa konteksto ng pamamahagi ng lupain, ang מַטֶּה ay “lipi,” at ipinakikilala ng מֵאֵת ang pinagmulan ng mga lunsod.
- source_word: יָקְנְעָם
  choice: Jokneam
  rationale: Transliterasyon ng pangalang-lugar ayon sa kinikilalang anyo nito.
- source_word: מִגְרָשֶׁהָ
  choice: ang mga pastulan nito
  rationale: Ang מִגְרָשׁ ay bukas na lupa sa paligid ng isang lunsod, lalo na para sa pagpapastol; malinaw at likas sa Filipino ang “mga pastulan.”
- source_word: קַרְתָּה
  choice: Karta
  rationale: Malapit na transliterasyon sa Hebreong pangalang-lugar at umaayon sa ortograpiyang Filipino.
