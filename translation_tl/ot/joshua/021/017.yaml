  text: 'and from the tribe of Benjamin: Gibeon with its pasturelands[a], and Geba with its pasturelands;'
translation:
  language: tl
  text: 'at mula sa lipi ni Benjamin: ang Gibeon at ang mga pastulan sa paligid nito[a], at ang Geba at ang mga pastulan sa paligid nito;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lupang panlahat” o “mga bukas na lupain,” na tumutukoy sa lupa sa paligid ng bawat lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: at mula sa lipi ni
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi. Isinalin din ang mga unlapi bilang “at mula sa” upang mapanatili ang pagkakaugnay sa naunang talaan.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Karaniwang anyo sa modernong saling Tagalog ng pangalan ng lipi.
- source_word: אֶת גִּבְעוֹן
  choice: ang Gibeon
  rationale: Hindi hiwalay na isinasalin ang pananda ng tuwirang layon na אֶת; ginamit ang kinaugaliang anyo ng pangalang-lugar.
- source_word: מִגְרָשֶׁהָ
  choice: ang mga pastulan sa paligid nito
  rationale: Ang מִגְרָשׁ ay lupang nakapaligid sa lungsod na inilaan bilang bukas o panlahatang lupa, lalo na para sa pagpapastol. Malinaw at likas sa Tagalog ang pariralang ito, at ang hulaping pambabae ay tumutukoy sa lungsod.
- source_word: גֶּבַע
  choice: Geba
  rationale: Ginamit ang kinaugaliang transliterasyon ng pangalang-lugar.
- source_word: וְ/אֶת
  choice: at ang
  rationale: Ang pang-ugnay ay nagdurugtong sa mga lungsod sa talaan; hindi hiwalay na kinakatawan ang אֶת maliban sa likas na panandang Tagalog na “ang.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan at ang pang-ugnay sa naunang talata. Ginamit ang “mga pastulan sa paligid nito” upang ipakita kapwa ang gamit at lokasyon ng lupain nang hindi ikinukubli ang iba pang posibleng kahulugan.
