base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: tl
  text: Kaya ibinigay ng mga anak ni Israel[a] sa mga Levita, mula sa kanilang minanang lupain, ayon sa utos ni Yahweh[b], ang mga lunsod na ito at ang kani-kanilang mga pastulan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa bibig ni Yahweh,” isang idyomang nangangahulugang ayon sa kanyang utos.
    reason: lexical_alternative
  - marker: c
    text: Tumutukoy ito sa bukás na lupain sa paligid na kabilang sa bawat lunsod, na maaaring gamitin bilang pastulan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ibinigay
  rationale: Karaniwang kahulugan ng נתן sa salaysay; tapat sa Hebreo at natural sa konteksto ng pagbabahagi ng lupain.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal na pananalitang pampamilya sa Hebreo; ang likas na kolektibong katumbas na “mga Israelita” ay inilagay sa talababa.
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Tuwirang ipinapakita ang mga tumanggap; “Levita” ang karaniwang katawagan sa Filipino.
- source_word: מִנַּחֲלָתָם
  choice: mula sa kanilang mana
  rationale: Ang נַחֲלָה ay tumutukoy dito sa minanang bahaging lupain ng mga lipi; maikli at malinaw ang “mana.”
- source_word: אֶל־פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Idyomatikong ipinahahayag ang diwang “ayon sa bibig ni Yahweh,” na nangangahulugang ayon sa kanyang utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ang mga lunsod na ito
  rationale: Tuwirang salin ng pariralang may panturo; ang “lunsod” ay angkop sa talaan ng mga bahaging lupain.
- source_word: מִגְרְשֵׁיהֶן
  choice: ang mga pastulan ng mga ito
  rationale: Tumutukoy sa bukás na lupa sa paligid na kabilang sa mga lunsod at ginagamit, bukod sa iba pa, sa pagpapastol.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Literal na pananalitang בְנֵי יִשְׂרָאֵל o kolektibong katumbas
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili sa pangunahing teksto ang pormang pampamilya ng Hebreo nang hindi ipinagkakait sa talababa ang mas likas na kolektibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pormal na “mga anak ni Israel” dahil kapansin-pansin ang anyong pampamilya sa Hebreo, habang ginawang likas sa Filipino ang idyomang “ayon sa bibig” bilang “ayon sa utos.”
