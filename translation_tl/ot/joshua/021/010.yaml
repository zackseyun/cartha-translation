translation_notes:
  register: Modernong Filipino na dignified at malinaw. Ginamit ang “angkan” para sa pangkat na pantribo at pinanatili ang pormal na genealogical na “mga anak ni Aaron/Levi.” Hindi isinama ang footnote ng English consultation text dahil ang ibinigay nitong alternatibo ay waring hindi tumutugma sa marker nito; ang tunay na leksikal na alternatibo sa מִשְׁפְּחוֹת ay kinatawan na ng salitang “angkan.”
