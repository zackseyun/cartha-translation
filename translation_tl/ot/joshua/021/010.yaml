  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: tl
  text: Ito ay para sa mga anak ni Aaron, mula sa mga angkan ng mga Kohatita, na mula sa mga anak ni Levi, sapagkat sila ang unang nabunutan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ito ay para sa
  rationale: Sa konteksto ng pamamahagi, likas sa Filipino ang konstruksiyong ito at pinananatili nito ang diwa ng pagkakaroon o pagkakatalaga nang hindi pilit na isinasalin ang panimulang waw.
- source_word: לִבְנֵי אַהֲרֹן
  choice: para sa mga anak ni Aaron
  rationale: Ang ל ay nagsasaad ng pinaglaanan, at pinananatili ng “mga anak ni Aaron” ang pormal na pananalitang pangangkan.
- source_word: מִמִּשְׁפְּחוֹת
  choice: mula sa mga angkan ng
  rationale: Sa kontekstong pantribo, mas tiyak ang “angkan” kaysa “pamilya” para sa malalaking pangkat na magkakamag-anak.
- source_word: הַקְּהָתִי
  choice: mga Kohatita
  rationale: Tumutukoy ang anyong gentilic sa pangkat na nagmula kay Kohat; malinaw at natural sa Filipino ang “mga Kohatita.”
- source_word: מִבְּנֵי לֵוִי
  choice: na mula sa mga anak ni Levi
  rationale: Pinananatili ang mas malawak na kaugnayang pangangkan at nililinaw ng “na” ang pagkakaugnay ng mga parirala.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinahahayag nito ang sanhi o paliwanag para sa naunang pahayag sa isang marangal ngunit karaniwang rehistro.
- source_word: לָהֶם
  choice: sa kanila napunta
  rationale: Likas itong paglalarawan sa Filipino ng pagtanggap o pagkakatalaga ng bahagi sa pamamagitan ng palabunutan.
- source_word: הַגּוֹרָל
  choice: palabunutan
  rationale: Sa konteksto, tumutukoy ito sa lot bilang paraan o resulta ng pamamahagi; nauunawaan sa modernong Filipino ang “palabunutan” nang hindi ipinahihiwatig ang sugal.
- source_word: רִאשֹׁנָה
  choice: unang
  rationale: Tuwirang ipinakikita ang pagkakasunod-sunod ng pamamahagi.
