base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: tl
  text: At lumabas ang kapalaran para sa mga angkan ng mga Kohatita[a]. Ang mga anak ni Aaron na pari, na mula sa mga Levita, ay tumanggap sa pamamagitan ng palabunutan ng labintatlong lungsod mula sa lipi ni Juda, mula sa lipi ni Simeon, at mula sa lipi ni Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Nabunot ang kapalaran para sa mga angkan ng mga Kohatita.” Literal na nagsasabing “lumabas ang kapalaran” ang idyomang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: lumabas ang palabunutan
  rationale: Pinananatili nito ang konkretong idyomang Hebreo na ‘lumabas ang lot,’ habang nauunawaan sa Filipino bilang kinalabasan ng paghahati sa pamamagitan ng palabunutan.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: para sa mga angkan ng mga Kohatita
  rationale: Ang מִשְׁפָּחָה ay maaaring tumukoy sa pamilya o angkan; ‘angkan’ ang mas angkop dito sa malalaking pangkat ng mga inapo ni Kohat.
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: Sa mga anak ng paring si Aaron ... napunta
  rationale: Isinasalin nang natural ang eliptikong Hebreo at pinananatili ang katawagang pangkamag-anakang ‘mga anak ni Aaron.’
- source_word: מִן הַלְוִיִּם
  choice: na kabilang sa mga Levita
  rationale: 'Nililinaw nito ang partitive na diwa: ang mga anak ni Aaron ay isang pangkat sa loob ng mga Levita.'
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: mula sa lipi ni Juda, sa lipi ni Simeon, at sa lipi ni Benjamin
  rationale: Ang מַטֶּה ay tumutukoy rito sa lipi. Ang pag-uulit ng ‘sa lipi ni’ ay umaayon sa estruktura ng Hebreo at malinaw sa Filipino.
- source_word: בַּגּוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Ipinapahayag nito ang paraan ng pagtatalaga ng mga lungsod at natural sa modernong Filipino.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: labintatlong lungsod
  rationale: Ang ‘lungsod’ ay pare-pareho at angkop na salin ng עִיר sa konteksto ng paghahating panlupain.
