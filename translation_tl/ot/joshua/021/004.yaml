  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘angkan’ para sa mga pangkat ng pamilya at ‘palabunutan’ para sa pamamaraang gamit sa paghahati, habang pinananatili ang konkretong larawan ng Hebreo sa pangunahing teksto.
