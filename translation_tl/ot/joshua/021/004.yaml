    text: Maaari ring isalin na “Nabunot ang kapalaran para sa mga angkan ng mga Kohatita.” Literal na nagsasabing “lumabas ang kapalaran” ang idyomang Hebreo.
    reason: lexical_alternative
  revision_rationale: Pinalitan ang “palabunutan” ng “kapalaran” kung saan ang Hebreo ay tumutukoy sa lot mismo, habang pinanatili ang “sa pamamagitan ng palabunutan” para sa paraan ng pagtatalaga. Inayos din ang ikalawang pangungusap para sa malinaw at natural na Filipino, nang hindi binabago ang saklaw ng mga pangkat, paraan ng pagtatalaga, o bilang at pinagmulan ng mga lungsod.
