  text: Heshbon with its pasturelands[a], and Jazer with its pasturelands—four cities in all.
translation:
  language: tl
  text: ang Hesbon at ang mga pastulan nito,[a] at ang Jazer at ang mga pastulan nito—apat na lungsod lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lupaing panlahat” o “mga nakapaligid na lupain.” Ang salitang Hebreo ay tumutukoy sa bukas na lupaing pag-aari o nakalaan sa isang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Pangalan ng lugar; ginamit ang anyong karaniwang angkop sa baybay-Filipino at malapit sa anyong Hebreo.
- source_word: מִגְרָשֶׁהָ
  choice: ang mga pastulan nito
  rationale: Tumutukoy ang מִגְרָשׁ sa bukas na lupaing nakalaan sa isang lungsod, madalas para sa pagpapastol; natural at malinaw sa Filipino ang 'mga pastulan nito.'
- source_word: יַעְזֵר
  choice: Jazer
  rationale: Pangalan ng lugar; tinumbasan sa pamamagitan ng transliterasyon.
- source_word: כָּל עָרִים אַרְבַּע
  choice: apat na lungsod lahat
  rationale: Natural na Filipino para sa Hebreong buod na literal na 'lahat ng mga lungsod, apat,' habang napapanatili ang diwa ng כָּל.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: ang ... at ang ... at ang ... at ang ...
  rationale: Walang tuwirang katumbas sa Filipino ang panandang tuwirang layon na אֶת; ipinahihiwatig ang talaan at koordinasyon sa pamamagitan ng mga pananda at pang-ugnay.
