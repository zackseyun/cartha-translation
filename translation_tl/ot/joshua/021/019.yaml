  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
translation:
  language: tl
  text: Ang lahat ng lunsod ng mga anak ni Aaron, na mga pari, ay labintatlong lunsod, kasama ang mga pastulan ng mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: ang lahat ng lunsod
  rationale: Tuwirang ipinahahayag ang kabuuang bilang ng mga lunsod sa buod, sa natural na ayos ng modernong Tagalog.
- source_word: בְנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Pinananatili ang pormal na pananalitang pampamilya ng Hebreo at ang pagtukoy sa angkan ni Aaron, nang hindi ito tahasang pinapalitan ng mas interpretatibong “mga inapo.”
- source_word: הַכֹּהֲנִים
  choice: na mga pari
  rationale: Isinasalin ang appositional na pagkakakilanlan ng mga anak ni Aaron sa malinaw at likas na Tagalog.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: labintatlong lunsod
  rationale: Tuwiran at idiomatikong salin ng bilang at pangngalan; ginagamit ang “lunsod” para sa pagkakapare-pareho sa talaan ng mga pamayanan.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: kasama ang mga pastulan ng mga iyon
  rationale: Ang מִגְרָשׁ sa konteksto ng mga lunsod ng mga Levita ay tumutukoy sa bukas na lupang nakapaligid na ginagamit bilang pastulan. Ipinahahayag ng “kasama” ang ugnayang idinudugtong ng waw sa natural na Tagalog, habang nililinaw ng “ng mga iyon” na sa mga lunsod nauukol ang mga pastulan.
