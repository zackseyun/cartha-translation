  terminology: Ang “Yahweh,” “sa pamamagitan ni Moises,” at “mga lungsod” ay angkop. Ang “mga pastulan ng mga iyon” ay nagpapahayag ng מִגְרְשֵׁיהֶן bilang lupaing kaugnay ng mga lungsod, nang hindi ipinipilit na ang termino ay nangangahulugan lamang ng pastulan.
