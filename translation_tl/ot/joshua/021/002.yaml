revisions:
- from: At nagsalita sila sa mga ito sa Shilo, sa lupain ng Canaan, at sinabi, “Iniutos ni Yahweh sa pamamagitan ni Moises[a] na bigyan kami ng mga lungsod na matitirhan, kasama ang mga lupaing pastulan[b] para sa aming mga hayop.”
  to: At sinabi nila sa kanila sa Shilo, sa lupain ng Canaan, “Iniutos ni Yahweh sa pamamagitan ni Moises[a] na bigyan kami ng mga lungsod na matitirhan, kasama ang mga pastulan ng mga iyon[b] para sa aming mga alagang hayop.”
  rationale: Pinalitan ang hindi likas na “sa mga ito” ng “sa kanila” at pinasimple ang dobleng pandiwang pangsabi sa isang likas na pagpapakilala ng tuwirang pananalita. Ginawang “mga alagang hayop” ang livestock at nilinaw na ang mga pastulan ay kaugnay ng mga lungsod. Inayos din ang mga alternatibong termino sa talababa para sa mas likas na Filipino.
