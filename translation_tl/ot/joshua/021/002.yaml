source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֲלֵי/הֶ֜ם בְּ/שִׁלֹ֗ה בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה בְ/יַד מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ עָרִ֖ים לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֖ן לִ/בְהֶמְתֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: tl
  text: At sinabi nila sa kanila sa Shilo, sa lupain ng Canaan, “Iniutos ni Yahweh sa pamamagitan ni Moises[a] na bigyan kami ng mga lungsod na matitirhan, kasama ang mga pastulan ng mga iyon[b] para sa aming mga alagang hayop.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “sa pamamagitan ng kamay ni Moises”; isang idyomang Hebreo na nangangahulugang “sa pamamagitan ni Moises.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga bukas na lupain” o “mga lupang komunal.” Tumutukoy ang salitang Hebreo sa lupain sa paligid ng mga lungsod, na ginagamit para sa pagpapastol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  choice: At nagsalita sila sa mga ito
  rationale: Pinananatili ang karaniwang kahulugan ng piel na דּבר bilang “nagsalita” at ang direksiyon ng אֶל bilang “sa.” Ang “mga ito” ay tumutukoy sa mga pinunong binanggit sa naunang talata.
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  choice: sa Shilo, sa lupain ng Canaan
  rationale: Pinananatili ang tahasang salitang אֶרֶץ, “lupain,” at ginagamit ang likas na anyong Filipino para sa lokasyon.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Likas na Filipino na panimula sa tuwirang pananalita; ipinahahayag nito ang tungkulin ng infinitibong Hebreo nang hindi gumagamit ng mabigat na literalismong “na nagsasabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: צִוָּה בְיַד מֹשֶׁה
  choice: Iniutos ... sa pamamagitan ni Moises
  rationale: Ang צוה ay “mag-utos,” at ang idyomang בְיַד, literal na “sa pamamagitan ng kamay,” ay nagsasaad dito ng tagapamagitan o ahensiya.
- source_word: לָתֶת לָנוּ עָרִים לָשָׁבֶת
  choice: na bigyan kami ng mga lungsod na matitirhan
  rationale: Ang נתן ay tuwirang “magbigay,” ang עָרִים ay “mga lungsod,” at ang לָשָׁבֶת ay nagpapahayag ng layuning manirahan sa mga iyon. Ang “matitirhan” ay natural at malinaw sa modernong Filipino.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: kasama ang mga lupaing pastulan
  rationale: Ang מִגְרָשׁ ay tumutukoy sa bukas o panlahatang lupain sa paligid ng isang lungsod, na ginagamit dito para sa mga hayop. Ang “lupaing pastulan” ay malinaw ngunit hindi lubusang ikinukubli ang mas malawak na saklaw ng salita.
- source_word: לִבְהֶמְתֵּנוּ
  choice: para sa aming mga hayop
  rationale: Ang בְּהֵמָה ay tumutukoy sa mga domestikadong hayop o livestock; ang “aming mga hayop” ay natural at sapat sa konteksto.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalang pantangi ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Ahensiya sa pariralang בְיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  alternative: sa kamay ni Moises / kay Moises
  rationale: Ipinakikita ng idyoma na si Moises ang tagapamagitan ng utos. Hindi nito ginagawang pinagmulan ng utos si Moises, sapagkat tahasang si Yahweh ang paksa ng pandiwa.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “matitirhan” sa halip na mas makalumang “pananahanan,” at pinanatili ang “mga lungsod” upang tumugma sa terminong Hebreo at sa konteksto ng paghahati ng lupain.
