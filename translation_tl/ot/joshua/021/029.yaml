  yaml_path: translation/ot/joshua/021/029.yaml
  text: Jarmuth with its pasturelands[a], and En-gannim with its pasturelands—four cities.
translation:
  language: tl
  text: ang Jarmut kasama ang mga pastulan nito, at ang En-Ganim[a] kasama ang mga pastulan nito—apat na lunsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding baybayin ang En-Ganim na “Ain-Ganim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְמוּת
  choice: Jarmut
  rationale: Isinalin bilang pangalang-pook ayon sa likas na baybay sa modernong Filipino, na malapit sa anyong Hebreo.
- source_word: מִגְרָשֶׁהָ
  choice: mga pastulan nito
  rationale: Sa mga talaan ng mga lunsod na inilaan, tumutukoy ang מִגְרָשׁ sa bukás na lupa sa paligid ng lunsod na ginagamit bilang pastulan; ipinahahayag ng “nito” ang hulaping tumutukoy sa bawat lunsod.
- source_word: עֵין גַּנִּים
  choice: En-Ganim
  rationale: Pinanatili bilang pangalang-pook sa halip na isalin ang mga sangkap nitong literal na nangangahulugang “bukal ng mga hardin.”
- source_word: עָרִים אַרְבַּע
  choice: apat na lunsod
  rationale: Likas at karaniwang salin ng pormulang nagbubuod sa bilang ng mga lunsod sa talaan.
theological_decisions: []
translation_notes:
  register: Gumamit ng maikli, marangal, at likas na Filipino na angkop sa isang talaan ng mga lunsod. Ang “kasama ang” ay malinaw na nag-uugnay sa bawat lunsod at sa mga pastulan nito nang hindi nagdaragdag ng interpretasyong wala sa tekstong Hebreo.
