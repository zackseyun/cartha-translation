  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: tl
  text: 'Mula sa lipi ng mga anak ni Juda at mula sa lipi ng mga anak ni Simeon, ibinigay nila ang mga lunsod na ito[a], na tinukoy ayon sa pangalan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na tinatawag ayon sa pangalan” o “na nakatala ang kani-kanilang pangalan.” Ipinahihiwatig ng Hebreo na isa-isang pinangalanan ang mga lunsod sa sumusunod na talaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ibinigay nila
  rationale: Tuwirang isinasalin ang נתן bilang “ibinigay” habang pinananatili ang diwa ng pagtatalaga ng mga lunsod sa konteksto ng paghahati.
- source_word: מִמַּטֵּה
  choice: mula sa lipi ng
  rationale: Sa konteksto ng pamamahagi ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod.
- source_word: בְּנֵי יְהוּדָה
  choice: mga anak ni Juda
  rationale: Pinananatili ang pampamilyang anyo ng Hebreo at ang karaniwang katawagan sa pangkat na nagmula kay Juda.
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: at mula sa lipi ng mga anak ni Simeon
  rationale: Pinananatili ang paralelismo sa naunang parirala at ang literal na tribal na katawagang “mga anak ni Simeon.”
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: ang mga lunsod na ito
  rationale: Ang parirala ay tuwirang tumutukoy sa mga lunsod na ibinigay at ililista pagkatapos nito.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: na isa-isang binanggit ang pangalan
  rationale: Ipinahahayag nang natural sa Tagalog ang idyomang Hebreo na nagsasaad na ang bawat lunsod ay papangalanan sa kasunod na talaan, nang hindi tinutukoy kung sino ang bumabanggit.
