  text: וְ/לִ/בְנֵ֨י קְהָ֜ת הַ/נּוֹתָרִ֗ים מִ/מִּשְׁפְּחֹ֣ת מַטֵּֽה אֶ֠פְרַיִם וּֽ/מִ/מַּטֵּה דָ֞ן וּ/מֵ/חֲצִ֨י מַטֵּ֧ה מְנַשֶּׁ֛ה בַּ/גּוֹרָ֖ל עָרִ֥ים עָֽשֶׂר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: tl
  text: At para sa natitirang mga anak ni Kohat[a], mula sa mga angkan ng lipi ni Efraim, mula sa lipi ni Dan, at mula sa kalahating lipi ni Manases, sampung lungsod ang napunta sa kanila sa pamamagitan ng palabunutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iba pang mga Kohatita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: At para sa natitirang mga anak ni Kohat
  rationale: Pinananatili ang genealogical na pananalitang 'mga anak ni Kohat' at ang participle na tumutukoy sa mga Kohatita na hindi kabilang sa naunang pangkat.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: mula sa mga angkan ng
  rationale: Sa konteksto ng paghahati-hati ayon sa lipi, ang מִשְׁפָּחָה ay mas tiyak na tumutukoy sa angkan kaysa sa karaniwang sambahayan o pamilya.
- source_word: מַטֵּה
  choice: lipi
  rationale: Dito ang מַטֶּה ay tribal unit, hindi literal na tungkod; 'lipi' ang natural at nakaugaliang katumbas sa Filipino.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: at mula sa kalahating lipi ni Manases
  rationale: Malinaw na ipinapahayag ang teritoryal na pagkakahati ng lipi ni Manases habang sinusundan ang parallel na estruktura ng Hebreo.
- source_word: בַּ/גּוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Ipinahihiwatig nito ang paraang ginamit sa pagtatalaga; ang 'palabunutan' ay natural na Filipino at hindi binubura ang aktuwal na proseso ng paghahati.
- source_word: עָרִים עָשֶׂר
  choice: sampung lungsod
  rationale: Tuwirang katumbas ng bilang at pangngalan sa tekstong Hebreo.
- source_word: implicit verbless clause
  choice: sampung lungsod ang napunta sa kanila
  rationale: Elliptical at walang tahasang pandiwa ang Hebreo. Ang suplay na 'napunta sa kanila' ay natural sa Filipino at malinaw na naghahatid ng distributive sense ng konteksto nang hindi nagdaragdag ng partikular na tagaganap.
theological_decisions: []
translation_notes:
  register: Makabagong, dignified, at madaling maunawaang Filipino. Ginamit ang 'angkan,' 'lipi,' at 'palabunutan' bilang malinaw na mga terminong angkop sa talaan ng paghahati ng mga lungsod. Ang footnote ay nagpapanatili sa alternatibong pagbasa ng genealogical na parirala bilang pangalan ng pangkat.
