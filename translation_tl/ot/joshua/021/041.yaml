base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: tl
  text: Ang lahat ng lungsod ng mga Levita na nasa loob ng pag-aaring lupain ng mga anak ni Israel[a] ay apatnapu't walo, kasama ang mga pastulan[b] ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “mga lupang bukás” o “mga lupang panlahat,” na tumutukoy sa lupaing nakapaligid sa mga lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Ang lahat
  rationale: Tumutukoy sa kabuuang bilang ng mga lungsod na inilaan sa mga Levita; likas at malinaw ito sa makabagong Tagalog.
- source_word: עָרֵי הַלְוִיִּם
  choice: mga lungsod ng mga Levita
  rationale: Pinananatili ang ugnayang pagmamay-ari o paglalaan na hayag sa pariralang Hebreo, sa halip na gawing mas interpretatibong pang-uri.
- source_word: בְּתוֹךְ
  choice: sa loob ng
  rationale: Tumpak na nagpapahayag na ang mga lungsod ay nasa saklaw ng mas malawak na lupaing hawak ng Israel.
- source_word: אֲחֻזַּת
  choice: pag-aaring lupain
  rationale: Ipinahahayag ang diwa ng isang teritoryal na pag-aari o permanenteng hawak na lupa, nang hindi awtomatikong ipinapasok ang mas teolohikal na salitang 'mana.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit sa anyong Hebreo at isa ring likas, pamilyar, at marangal na pambansang katawagan sa Tagalog.
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: ay apatnapu't walong lungsod
  rationale: Nililinaw sa natural na pangungusap sa Tagalog ang appositional na pagbubuod ng eksaktong bilang.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: kasama ang mga pastulan ng mga iyon
  rationale: Sa konteksto ng pamamahagi ng mga lungsod, ang מִגְרָשׁ ay lupang nakapaligid at kaugnay ng lungsod, karaniwang ginagamit na pastulan; ang 'ng mga iyon' ay malinaw na tumutukoy sa mga lungsod.
theological_decisions:
- issue: Ang pambansang katawagang may anyong panlalaki na בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang pormal na larawan ng Hebreong 'mga anak ni Israel' habang nauunawaan itong katawagan sa buong bayang Israel, hindi lamang isang pahayag tungkol sa kasarian.
- issue: Ang kahulugan ng אֲחֻזָּה bilang lupang hawak
  choice: pag-aaring lupain
  alternative: mana
  rationale: Pinipili ang teritoryal na kahulugan at hindi pinatitindi nang di-kailangan ang posibleng teolohikal na himig ng 'mana,' bagaman maaari rin itong ipakahulugan bilang minanang pag-aari sa mas malawak na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang 'mga anak ni Israel' dahil natural pa rin itong pambansang katawagan at mas malapit sa Hebreo. Ginamit ang 'pag-aaring lupain' upang iwasan ang di-kinakailangang pagresolba sa pagitan ng simpleng pag-aari at minanang lupain.
