  register: Modernong Filipino na malinaw at marangal, na may payak na estruktura para sa talaan ng mga lungsod. Ginamit ang nakaugaliang mga anyong Filipino ng mga pangalan at pinanatili ang tekstuwal na talababa nang hindi nagpapasya sa pagitan ng mga variant.
