base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: tl
  text: 'At mula sa kalahating lipi ni Manases: ang Taanac at ang pastulan nito,[a] at ang Gat-rimon at ang pastulan nito—dalawang lungsod.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nagkakaiba ang ilang manuskritong Hebreo at ang katumbas na tala sa 1 Cronica 6:70 tungkol sa mga pangalan ng mga bayang inilaan mula sa Manases.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה
  choice: At mula sa kalahating lipi
  rationale: Ipinahahayag ng pariralang Hebreo ang pinagmulan ng bahaging inilaan. Natural sa modernong Filipino ang “kalahating lipi,” at pinananatili nito ang diwang distributibo.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng lipi.
- source_word: תַּעְנַךְ
  choice: Taanac
  rationale: Transliterasyong angkop sa ortograpiyang Filipino ng pangalang-lugar.
- source_word: מִגְרָשֶׁהָ
  choice: ang pastulan nito
  rationale: Ang מִגְרָשׁ ay bukas na lupain sa paligid ng lungsod, karaniwang ginagamit na pastulan. Malinaw at natural sa Filipino ang “pastulan nito.”
- source_word: גַּת רִמּוֹן
  choice: Gat-rimon
  rationale: Transliterasyong angkop sa Filipino, na pinananatiling tambalang pangalang-lugar sa pamamagitan ng gitling.
- source_word: עָרִים שְׁתָּיִם
  choice: dalawang lungsod
  rationale: Tuwirang isinasalin ang pangwakas na bilang ng mga pamayanang nakalista; ang “lungsod” ang karaniwang katumbas sa ganitong talaan.
theological_decisions: []
