  yaml_path: translation/ot/joshua/021/037.yaml
  text: 'Kedemoth with its pasturelands[a], and Mephaath with its pasturelands: four cities.'
translation:
  language: tl
  text: Ang Kedemot kasama ang lupang pastulan nito, at ang Mefaat kasama ang lupang pastulan nito—apat na lungsod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Kedemot
  rationale: Pangalan ng lugar; tinumbasan sa baybay na natural sa Filipino at malapit sa anyong Hebreo.
- source_word: מִגְרָשֶׁהָ
  choice: ang pastulan nito
  rationale: Tumutukoy ang מִגְרָשׁ sa bukás o panlahatang lupa na nakalaan sa isang lungsod, lalo na bilang pastulan. Ang hulaping pambabaeng isahan ay tumutukoy sa bawat lungsod.
- source_word: מֵיפָעַת
  choice: Mefaat
  rationale: Pangalan ng lugar; ang baybay ay sumusunod nang malapit sa tunog ng Hebreo at madaling basahin sa Filipino.
- source_word: עָרִים אַרְבַּע
  choice: apat na lungsod
  rationale: Tuwirang buod ng bilang ng mga pamayanang nakalista; pinananatili ang karaniwang salin ng עָרִים bilang “mga lungsod.”
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: ang ... at ang ... at ang ...
  rationale: Ang inuulit na pananda ng tuwirang layon ay likas na inihayag sa Filipino sa pamamagitan ng mga pariralang may “ang” at “at,” nang hindi artipisyal na ginagaya ang estrukturang Hebreo.
