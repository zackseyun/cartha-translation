  yaml_path: translation/ot/joshua/021/018.yaml
  text: 'Anathoth with its pasturelands[a], and Almon with its pasturelands: four cities.'
translation:
  language: tl
  text: Ang Anatot, kasama ang pastulan nito, at ang Almon, kasama ang pastulan nito—apat na lungsod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupang panlahat” o “lupang nakapaligid.” Ang salitang Hebreo ay tumutukoy sa bukás na lupaing kaugnay ng isang lungsod, na karaniwang ginagamit sa pagpapastol.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתוֹת
  choice: Anatot
  rationale: Pangalan ng lugar; isinalin sa karaniwang transliterasyong Filipino mula sa Hebreo.
- source_word: מִגְרָשֶׁהָ
  choice: ang pastulan nito
  rationale: Tumutukoy ang מִגְרָשׁ sa bukás na lupaing nakalaan sa isang lungsod, madalas para sa pagpapastol. Pinananatili ng “pastulan” ang pangunahing gamit ng lupa at natural ito sa modernong Filipino; ang hulaping pambabaeng isahan ay tinumbasan ng “nito,” na tumutukoy sa bawat lungsod.
- source_word: עַלְמוֹן
  choice: Almon
  rationale: Pangalan ng lugar; tinumbasan sa pamamagitan ng transliterasyon.
- source_word: עָרִים אַרְבַּע
  choice: apat na lungsod
  rationale: Tuwirang buod ng bilang ng mga bayang nakalista; ang “lungsod” ay angkop sa konteksto ng paghahati ng mga lungsod para sa mga Levita.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: anglk; kinatawan sa pag-uugnay ng “at”
  rationale: Walang tuwirang katumbas sa Filipino ang paulit-ulit na pananda ng tiyak na layon na אֶת; naipakikita ang kayarian sa pagkakahanay at pag-uugnay ng mga pangalan at pastulan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “pastulan” bilang malinaw at likas na katumbas, habang inilagay sa talababa ang mas malalawak na posibleng kahulugan. Ang gitling na mahaba bago ang “apat na lungsod” ay naghihiwalay sa pangwakas na buod ng bilang.
