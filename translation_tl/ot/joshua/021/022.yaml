  text: and Kibzaim with its pasturelands[a], and Beth-horon with its pasturelands—four cities.
translation:
  language: tl
  text: at Kibzaim kasama ang mga lupain sa paligid nito,[a] at Bet-horon kasama ang mga lupain sa paligid nito—apat na lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pastulan” o “mga lupaing panlahat.” Ang salitang Hebreo ay tumutukoy sa bukas na lupain sa paligid na nakatalaga sa isang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  choice: Kibzaim
  rationale: Isang pangalang-pook; tinumbasan sa pamamagitan ng transliterasyon mula sa Hebreo.
- source_word: מִגְרָשֶׁהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ ay tumutukoy sa bukas na lupaing nakalaan sa isang lungsod, kabilang ang lugar na mapagpapastulan; natural at malinaw sa modernong Tagalog ang “mga pastulan nito.”
- source_word: בֵּית חוֹרֹן
  choice: Bet-horon
  rationale: Pangalang-pook na isinalin sa karaniwang anyong transliterado, hindi ayon sa literal na kahulugan ng mga bahagi nito.
- source_word: עָרִים אַרְבַּע
  choice: apat na lungsod
  rationale: Tuwirang buod ng bilang sa hulihan ng talaan; ang עָרִים ay ang pangmaramihang anyo ng “lungsod.”
- source_word: וְאֶת ... וְאֶת
  choice: at ... at
  rationale: Pinananatili ang paulit-ulit na pangatnig na bumubuo sa talaan, samantalang hindi tahasang isinasalin ang mga pananda sa tuwirang layon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “kasama ang” upang malinaw na ipahayag na kabilang sa bawat lungsod ang kaugnay nitong bukas na lupain; pinanatili ang anyong talaan at ang pangwakas na buod.
