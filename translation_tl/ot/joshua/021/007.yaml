base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: tl
  text: Para sa mga anak ni Merari,[a] ayon sa kani-kanilang angkan, labindalawang lunsod mula sa lipi ni Ruben, sa lipi ni Gad, at sa lipi ni Zebulun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Sa mga anak ni Merari, ayon sa kani-kanilang angkan: labindalawang lunsod mula sa lipi ni Ruben, sa lipi ni Gad, at sa lipi ni Zebulun.”'
    reason: Ipinakikita ang maaaring pagbasa sa לִבְנֵי bilang “sa” at ang anyong nominal o walang hayag na pandiwa ng pangungusap sa Hebreo.
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Para sa mga anak ni Merari
  rationale: Ang ל ay nagpapahiwatig ng paglalaan sa kontekstong ito, at pinananatili ng “mga anak” ang tuwirang pananalitang pampamilya ng בְּנֵי, na tumutukoy rito sa mga inapo ni Merari.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה ay tumutukoy sa pangkat na angkan sa loob ng lipi. Ipinahahayag ng “kani-kanilang” ang distributibong diwa nang natural sa Filipino.
- source_word: מִמַּטֵּה
  choice: mula sa lipi ni
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay nangangahulugang “lipi,” hindi literal na tungkod.
- source_word: רְאוּבֵן / גָד / זְבוּלֻן
  choice: Ruben / Gad / Zebulun
  rationale: Ginamit ang mga pangalang pamilyar sa makabagong saling Filipino; pinanatili ang anyong “Zebulun” na malapit sa Hebreo.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: labindalawang lunsod
  rationale: Natural na ayos sa Filipino para sa bilang at pangngalan; ang “lunsod” ay angkop sa terminolohiya ng talaan ng mga lupaing inilaan.
