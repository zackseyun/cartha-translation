base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/023.yaml
  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: tl
  text: Ang Jordan ang hangganan ng mga anak ni Ruben.[a] Ito ang mana ng mga anak ni Ruben ayon sa kani-kanilang angkan—ang mga lungsod at ang mga nayon ng mga lungsod na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang Jordan at hangganan.” Siksik ang pariralang Hebreo at maaaring unawain bilang pagtukoy sa Jordan bilang guhit ng hangganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Sa pormulang panghangganan, inilalarawan nito kung ano ang naging hangganan; natural sa Tagalog ang panaguring may “ay” nang hindi labis na idinidiin ang proseso ng pagiging.
- source_word: גְּבוּל
  choice: hangganan
  rationale: Ang “hangganan” ang malinaw at karaniwang salin sa konteksto ng pagtatakda ng sakop ng lupain.
- source_word: בְּנֵי רְאוּבֵן
  choice: mga anak ni Ruben
  rationale: Pinananatili nito ang Hebreong pananalitang pangangkan at nauunawaan din bilang tribo o mga inapo ni Ruben.
- source_word: הַיַּרְדֵּן וּגְבוּל
  choice: ang Jordan bilang hangganan
  rationale: Ang siksik na pariralang Hebreo ay pinakamalinaw na nauunawaan dito bilang pagtukoy sa Jordan na mismong guhit ng hangganan, habang kinikilala sa talababa ang literal na anyo at tunay na kalabuan.
- source_word: נַחֲלַת
  choice: mana
  rationale: Ang “mana” ay natural at tradisyonal na katawagan sa lupaing ipinagkaloob sa isang tribo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחוֹת ay tumutukoy sa mga dibisyong pangangkan sa loob ng tribo; nililinaw ng “kani-kanilang” ang distributibong diwa.
- source_word: הֶעָרִים
  choice: mga lungsod
  rationale: Ito ang tuwirang katumbas sa mga talaan ng paghahati ng lupain, kahit maaaring maliit ang ilan ayon sa makabagong pamantayan.
- source_word: וְחַצְרֵיהֶן
  choice: at ang mga nayon ng mga iyon
  rationale: Tumutukoy ito sa maliliit at karaniwang di-napapaderang pamayanang kaugnay ng mga lungsod; nililinaw ng “ng mga iyon” na ang mga nayon ay sakop o kaugnay ng nabanggit na mga lungsod.
