  register: Makabago, dignified, at madaling maunawaang Filipino. Pinanatili ang pormal na katawagang “mga anak ni Ruben” at ang heograpikong “Jordan,” habang ginawang natural ang siksik na pormulang Hebreo. Ang panandang [a] ay inilagay kaagad pagkatapos ng pariralang nililinaw nito.
