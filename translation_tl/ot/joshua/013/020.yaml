  yaml_path: translation/ot/joshua/013/020.yaml
  text: and Beth-peor[a], and the slopes of Pisgah, and Beth-jeshimoth.
translation:
  language: tl
  text: at Bet-Peor, ang mga dalisdis ng Pisga,[a] at Bet-Jesimot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bukal ng Pisga” o “mga paanan ng Pisga.” Mahigit sa isang kahulugang pangheograpiya ang maaaring taglayin ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: Bet-Peor
  rationale: Pangalan ito ng isang lugar, kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin bilang “bahay ni Peor.” Ginamit ang anyong “Bet” na madaling makilala at malapit sa Hebreong בֵית.
- source_word: אַשְׁדּוֹת
  choice: mga dalisdis
  rationale: Sa kontekstong pangheograpiya kasama ng Pisga, malamang na tumutukoy ito sa mga pababang bahagi o gilid ng bundok. Likas at malinaw sa modernong Filipino ang “mga dalisdis,” habang pinananatili sa talababa ang tunay na leksikal na posibilidad na tumukoy ito sa mga bukal o paanan.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Ginamit dito bilang pangalang pangheograpiya, kaya isinalin sa pamamagitan ng transliterasyon. Hindi tahasang kinatawan ang pantukoy na Hebreo sapagkat hindi karaniwang nilalagyan ng “ang” ang ganitong pangalan ng lugar sa Filipino.
- source_word: בֵית הַיְשִׁמוֹת
  choice: Bet-Jesimot
  rationale: Pangalan ito ng lugar, kaya transliterasyon ang ginamit sa halip na literal na saling “bahay ng mga kapanglawan.” Ang baybay ay iniangkop sa karaniwang tunog at ortograpiyang Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong listahan ng mga lugar at ginamit ang “sa” upang maging natural na karugtong ng mas malawak na pangungusap ng talata. Ang lahat ng pangalang pantangi ay isinalin sa pamamagitan ng transliterasyon.
