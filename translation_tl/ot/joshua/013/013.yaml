  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: tl
  text: Ngunit hindi pinalayas ng mga anak ni Israel ang mga Gesureo at ang mga Maacateo, at nanirahan ang Gesur at Maacat sa gitna ng Israel hanggang sa araw na ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang karaniwang pormang Hebreo para sa kolektibong Israel habang malinaw at likas pa rin sa Tagalog.
- source_word: הוֹרִישׁוּ
  choice: pinalayas
  rationale: Sa causative na kontekstong ito, tumutukoy ito sa pagpapaalis o pagtataboy sa mga naninirahan sa lupain.
- source_word: הַגְּשׁוּרִי ... הַמַּעֲכָתִי
  choice: mga Gesureo ... mga Maacateo
  rationale: Ginamit ang natural na Tagalog na anyo para sa mga pangkat-etniko.
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Isinasaad ng pandiwa ang patuloy na paninirahan bilang bunga ng hindi pagpapaalis.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: sa gitna ng Israel
  rationale: Malapit sa Hebreo at malinaw na nangangahulugang kasama o nasa loob ng sambayanan ng Israel.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Pinananatili ang pormulang pangkasaysayan ng pinagmulang teksto.
