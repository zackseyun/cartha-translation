base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: tl
  text: 'Ang kanilang teritoryo ay mula sa Mahanaim: ang buong Bashan, ang buong kaharian ni Og, na hari ng Bashan, at ang lahat ng nayon ni Jair[a] na nasa Bashan—animnapung lungsod.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Havvoth-jair,” ang tradisyonal na transliterasyon ng Hebreong pangalan ng mga pamayanang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: ang nasasakupan nila
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ang גְבוּל hindi lamang sa hangganang guhit kundi sa teritoryong nasa loob nito. Likas at malinaw sa modernong Tagalog ang “nasasakupan.”
- source_word: מִמַּחֲנַיִם
  choice: Mula sa Mahanaim
  rationale: Ipinahihiwatig ng מִן ang panimulang lugar ng paglalarawan sa teritoryo. Pinanatili ang pangalang Mahanaim sa transliterasyon.
- source_word: כָּל הַבָּשָׁן
  choice: ang buong Bashan
  rationale: Pinananatili ng “buong” ang saklaw ng כָּל at natural itong pakinggan sa heograpikong paglalarawan.
- source_word: מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: ang buong kaharian ni Og na hari ng Bashan
  rationale: Tuwirang isinasalin ang מַמְלְכוּת bilang “kaharian” at pinananatili ang pagkakakilanlan kay Og bilang hari ng Bashan.
- source_word: חַוֹּת יָאִיר
  choice: ang lahat ng nayon ni Jair
  rationale: Ang חַוֹּת ay tumutukoy sa mga pamayanan o nayon na kaugnay ni Jair. Mas madaling maunawaan ng karaniwang mambabasa ang “mga nayon”; ibinibigay sa talababa ang tradisyonal na transliterasyon.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: na nasa Bashan
  rationale: Natural na heograpikong paglalarawan sa Tagalog na malinaw na nag-uugnay sa mga nayon sa Bashan.
- source_word: שִׁשִּׁים עִיר
  choice: animnapung lungsod
  rationale: Karaniwang kahulugan ng עִיר ang lungsod o bayan. Pinili ang “lungsod” bilang tradisyonal na katawagan sa mga talaan ng teritoryo, nang hindi ipinapalagay na kasinlaki ang mga ito ng modernong lungsod.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang pambungad na “Mula sa Mahanaim” ay nagpapakita ng panimulang punto ng teritoryo nang hindi ginagawang hiwalay na item sa kasunod na talaan. Pinanatili ang tatlong ulit na komprehensibong diwa ng כָּל sa pamamagitan ng “buong” at “lahat.”
