base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
translation:
  language: tl
  text: Ito ang mga lupaing ipinamahagi ni Moises bilang mana sa kapatagan ng Moab, sa kabila ng Jordan[a], sa silangan ng Jerico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kabilang panig ng Jordan.” Ang pariralang Hebreo ay isang karaniwang heograpikong pormula na maaaring isalin nang iba ayon sa pananaw ng nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Ito ang mga lupaing
  rationale: Ang pariralang Hebreo ay panimulang buod na tumutukoy sa mga lupaing kababanggit; idinagdag ang “lupain” bilang likas at malinaw na ipinahihiwatig ng konteksto.
- source_word: נִחַל
  choice: ipinamamahagi ... bilang mana
  rationale: Ang causative na anyo ng נחל ay tumutukoy sa pamamahagi o pagtatalaga ng lupain bilang minanang pag-aari.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: sa kapatagan ng Moab
  rationale: Ang עֲרָבוֹת ay tumutukoy sa malawak at patag na rehiyong kapatagan o steppe; “kapatagan” ang pinakapamilyar at angkop na katawagan.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Pinananatili nito ang karaniwang heograpikong pormula ng Hebreo nang hindi ipinapalagay ang pananaw ng nagsasalita.
- source_word: יְרִיחוֹ מִזְרָחָה
  choice: sa silangan ng Jerico
  rationale: Natural na salin ng panandang direksiyon at malinaw na tinutukoy ang lokasyon kaugnay ng Jerico.
