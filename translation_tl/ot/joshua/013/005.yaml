base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/005.yaml
  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
translation:
  language: tl
  text: at ang lupain ng mga Gebalita, at ang buong Lebanon sa dakong sikatan ng araw, mula sa Baal-gad sa ibaba ng Bundok Hermon hanggang sa Lebo-hamat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa pasukan ng Hamat.” Maaaring unawain ang Hebreo bilang paglalarawan ng hangganan sa halip na pangalan ng isang tiyak na lugar.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: ang lupain ng mga Gebalita
  rationale: Ipinapahayag ang rehiyon ng pangkat na kaugnay ng Gebal; pinananatili ng “mga Gebalita” ang ugnayan sa pangalan ng lugar at likas itong pakinggan sa Filipino.
- source_word: כָל הַלְּבָנוֹן
  choice: ang buong Lebanon
  rationale: Tuwirang ipinapahayag ang kabuuan ng rehiyon ng Lebanon.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: sa dakong sikatan ng araw
  rationale: Pinananatili ang konkretong Hebreong idyoma para sa silangan habang nananatiling malinaw at marangal sa Filipino.
- source_word: מִבַּעַל גָּד
  choice: mula sa Baal-gad
  rationale: Pangalan ito ng lugar, kaya isinalin sa pamamagitan ng transliterasyon.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: sa ibaba ng Bundok Hermon
  rationale: Tumpak na inilalarawan ang mas mababang lokasyon kaugnay ng bundok nang hindi labis na tinutukoy ang eksaktong topograpiya.
- source_word: עַד לְבוֹא חֲמָת
  choice: hanggang sa Lebo-hamat
  rationale: Ginagamit sa pangunahing teksto bilang pangalan ng hangganang lugar, ngunit pinananatili sa talababa ang posibleng pagbasa rito bilang isang naglalarawang parirala.
