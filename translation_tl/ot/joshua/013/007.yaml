base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/007.yaml
  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: tl
  text: Ngayon, hatiin mo ang lupaing ito bilang mana para sa siyam na lipi at sa kalahating lipi ni Manases.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At ngayon, hatiin mo ang lupaing ito upang maging mana ng siyam na lipi at ng kalahati ng lipi ni Manases.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Likas na panandang pangdiskurso sa makabagong Tagalog para sa paglipat sa kasunod na utos; maaari rin ang “At ngayon.”
- source_word: חַלֵּק
  choice: hatiin mo
  rationale: Tuwirang pautos kay Josue at malinaw na nagsasaad ng paghahati o pamamahagi ng lupain.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: ang lupaing ito
  rationale: Pinananatili ang demonstratibo at ang malawak na kahulugan ng אֶרֶץ bilang lupaing tinutukoy.
- source_word: בְּנַחֲלָה
  choice: bilang mana
  rationale: Ipinahahayag ang lupang itinakdang matanggap at ariin ng mga lipi, habang pinananatili ang diwang legal at tipan ng נַחֲלָה.
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: para sa siyam na lipi
  rationale: Ang לְ ay tumutukoy sa mga tatanggap; natural sa Tagalog ang “para sa” kasunod ng “hatiin ... bilang mana.”
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: at sa kalahating lipi
  rationale: Malinaw na tumutukoy sa kinikilalang kalahating bahagi ng lipi at inaangkop ang pang-ukol sa koordinadong tatanggap.
- source_word: הַמְנַשֶּׁה
  choice: ni Manases
  rationale: Ginagamit ang nakaugaliang anyong Tagalog ng pangalang Manasseh at ang “ni” upang ipakita ang kaugnayan sa lipi.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lupaing ito,” “mana,” at “lipi” bilang natural ngunit tumpak na pananalita sa konteksto ng paghahati ng lupa. Ang panandang [a] ay inilagay sa pangunahing teksto.
