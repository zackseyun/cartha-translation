  text: from Aroer, which is on the edge of the Arnon Valley, and the city that is in the middle of the valley, and all the tableland from Medeba to Dibon,
translation:
  language: tl
  text: mula sa Aroer, na nasa gilid ng Lambak ng Arnon, at ang lunsod na nasa gitna ng lambak, at ang buong talampas mula Medeba hanggang Dibon,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂפַת
  choice: gilid
  rationale: Literal na 'labi' ngunit heograpikong tumutukoy sa gilid o hangganan; pinananatili nito ang saklaw ng Hebreo nang hindi ipinapalagay na pampang lamang.
- source_word: נַחַל
  choice: lambak
  rationale: Maaaring tumukoy sa batis o sa bangin/lambak na dinadaluyan nito; sa heograpiya ng Arnon, natural at angkop ang 'Lambak ng Arnon'.
- source_word: הַמִּישֹׁר
  choice: talampas
  rationale: Tumutukoy sa patag at mataas na rehiyon ng Transjordan; mas tiyak ang 'talampas' kaysa pangkalahatang 'kapatagan'.
- source_word: בְּתוֹךְ הַנַּחַל
  choice: nasa gitna ng lambak
  rationale: Malapit sa anyo ng Hebreo at hindi nilulutas kung ang lunsod ay nasa mismong daluyan, sa isang pulo, o sa gitnang bahagi ng bangin.
