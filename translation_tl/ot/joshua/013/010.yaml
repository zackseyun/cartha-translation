  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: tl
  text: at ang lahat ng mga lungsod ni Sihon, hari ng mga Amoreo, na naghari sa Hesbon, hanggang sa hangganan ng mga anak ni Ammon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Ammonita.” Sa Hebreo: “mga anak ni Ammon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: at ang lahat
  rationale: Pinananatili ng “at” ang ugnayan sa naunang paglalarawan ng lupain, at ipinahahayag ng “lahat” ang kabuuang saklaw ng כֹל.
- source_word: עָרֵי סִיחוֹן
  choice: mga lungsod ni Sihon
  rationale: Ang construct phrase ay likas na naipahahayag sa Tagalog bilang pagmamay-ari o kaugnayan gamit ang “ni”; ang “mga lungsod” ay angkop sa listahan ng mga nasasakupan.
- source_word: מֶלֶךְ הָ/אֱמֹרִי
  choice: hari ng mga Amoreo
  rationale: Ipinapakita nito nang malinaw ang ugnayang construct at kinikilala ang אֱמֹרִי bilang kolektibong katawagan sa bayang pinaghaharian ni Sihon.
- source_word: אֲשֶׁר מָלַךְ
  choice: na ... naghari
  rationale: Pinananatili ng “naghari” ang tiyak na diwang maharlika ng pandiwang מָלַךְ, sa halip na mas malawak na “namahala.”
- source_word: בְּ/חֶשְׁבּוֹן
  choice: sa Hesbon
  rationale: Ang “sa” ang natural na pananda sa Tagalog para sa lugar kung saan naghari si Sihon.
- source_word: עַד גְּבוּל
  choice: hanggang sa hangganan ng
  rationale: Tuwirang ipinahahayag nito ang dulo o lawak ng teritoryo na tinutukoy ng עַד.
- source_word: בְּנֵי עַמּוֹן
  choice: mga anak ni Ammon
  rationale: Pinananatili nito ang literal na anyong pampamilya ng Hebreo, habang ang karaniwang etnikong katumbas ay inilalagay sa talababa.
