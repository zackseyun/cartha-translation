  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: tl
  text: 'pati ang lahat ng lungsod sa talampas[a] at ang buong kaharian ni Sihon, na hari ng mga Amoreo at naghari sa Hesbon, na pinabagsak ni Moises—siya at ang mga pinuno ng Midian: sina Evi, Rekem, Zur, Hur, at Reba, na mga prinsipe ni Sihon[c] at naninirahan sa lupain[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lungsod sa kapatagan” o “mga bayan sa mataas na patag na lupain.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “hinampas”; sa kontekstong militar, nangangahulugan itong lubusang tinalo o pinabagsak.
    reason: lexical_alternative
  - marker: c
    text: 'Dalawang magkaibang katawagan sa ranggo ang ginamit sa Hebreo: “mga pinuno ng Midian” (נְשִׂיאֵי) at “mga prinsipe ni Sihon” (נְסִיכֵי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: mga lungsod sa talampas
  rationale: Ang מִישׁוֹר ay tumutukoy sa patag at mataas na lupain sa Transjordan; malinaw at heograpikong angkop ang “talampas.”
- source_word: מַמְלְכוּת סִיחוֹן
  choice: kaharian ni Sihon
  rationale: Tuwirang ipinapahayag ng מַמְלְכוּת ang kaharian o nasasakupan ng isang hari.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: hari ng mga Amoreo
  rationale: Pinananatili nito ang ugnayang konstruktong Hebreo at natural ito sa modernong Tagalog.
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: naghari sa Hesbon
  rationale: Ang מָלַךְ ay partikular na nangangahulugang maghari bilang hari, hindi lamang mamahala.
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: ay pinabagsak ni Moises
  rationale: Sa kontekstong militar, ang נכה ay nagpapahiwatig ng tiyak na pagkatalo; natural na naihahatid ito ng “pinabagsak.”
- source_word: נְשִׂיאֵי מִדְיָן
  choice: mga pinuno ng Midian
  rationale: Ang נָשִׂיא ay pinuno o pangulo ng pangkat; iniiwasan ng “pinuno” ang pagkapareho sa kasunod na natatanging ranggong נְסִיכֵי.
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: Evi, Rekem, Zur, Hur, at Reba
  rationale: Isinalin sa karaniwang transliterasyon ang mga pangalang pantangi.
- source_word: נְסִיכֵי סִיחוֹן
  choice: mga prinsipe ni Sihon
  rationale: Ang נָסִיךְ ay prinsipe o pinunong nasa ilalim ng isang hari; pinananatili ring naiiba sa נְשִׂיאֵי.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: naninirahan sa lupaing iyon
  rationale: Ang participle na יֹשְׁבֵי ay nangangahulugang mga naninirahan; nililinaw ng “iyon” na tinutukoy ang nabanggit na lupain.
theological_decisions:
- issue: Kaugnayan ng mga pinuno ng Midian kay Sihon
  choice: Ipinanatiling parehong “mga pinuno ng Midian” at “mga prinsipe ni Sihon” ang limang lalaking pinangalanan.
  alternative: Ituring silang dalawang magkahiwalay na pangkat o gawing iisang pangkalahatang titulong “mga pinuno.”
  rationale: Dalawang magkaibang terminong Hebreo ang ginamit sa iisang magkakaugnay na paglalarawan; hindi dapat burahin ang posibleng dalawahang katayuan o ugnayang pampolitika.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Inayos ang mahabang pangungusap upang maging natural sa Tagalog habang pinananatili ang lahat ng ugnayan at titulo sa Hebreo; ginamit ang “Amoreo” bilang nakasanayang anyong Filipino at “Hesbon” para sa Heshbon.
