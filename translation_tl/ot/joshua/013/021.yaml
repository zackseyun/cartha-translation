  source_fidelity: Ang pangunahing nilalaman at mga pangalan ay tumpak na naihahatid. Gayunman, ang “lupaing iyon” ay nagdaragdag ng demonstratibong “iyon” na wala sa Hebreo, na simpleng “ang lupain” ang sinasabi. Ang ayos na “Siya at ... ay pinabagsak” ay maaari ring linawin upang mas tuwirang maipakita na si Moises ang kumilos laban kay Sihon at sa mga pinuno ng Midian.
  naturalness: Natural ang karamihan ng Tagalog, ngunit magiging mas malinaw at mas maayos ang daloy kung ang pandiwang “pinabagsak” ay ilalagay agad kasunod ng “ni Moises,” sa halip na paghiwalayin ang paksa sa isang nakaraang buong pangungusap.
  terminology: Ang “talampas,” “kaharian,” “Amoreo,” “mga pinuno,” at “mga prinsipe” ay angkop. Napananatili nang maayos ang kaibhan ng נְשִׂיאֵי at נְסִיכֵי.
  issues:
