  to: 'pati ang lahat ng lungsod sa talampas[a] at ang buong kaharian ni Sihon, na hari ng mga Amoreo at naghari sa Hesbon, na pinabagsak ni Moises—siya at ang mga pinuno ng Midian: sina Evi, Rekem, Zur, Hur, at Reba, na mga prinsipe ni Sihon[c] at naninirahan sa lupain[b].'
