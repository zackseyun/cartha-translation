source:
  edition: WLC
  text: חֶשְׁבּ֥וֹן וְ/כָל עָרֶ֖י/הָ אֲשֶׁ֣ר בַּ/מִּישֹׁ֑ר דִּיבוֹן֙ וּ/בָמ֣וֹת בַּ֔עַל וּ/בֵ֖ית בַּ֥עַל מְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
translation:
  language: tl
  text: 'Hesbon at ang lahat ng mga lungsod nito na nasa talampas: Dibon[a], Bamot-baal, at Bet-baal-meon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa kapatagan” o “na nasa patag na mataas na lupain.” Ang salitang Hebreo ay tumutukoy sa patag at mataas na rehiyon sa Transjordan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Pangalan ng lugar; ginamit ang payak na transliterasyong angkop sa Filipino.
- source_word: וְכָל עָרֶיהָ
  choice: at ang lahat ng mga lungsod nito
  rationale: Ang hulaping pambabaeng isahan ay tumutukoy sa Hesbon; natural sa Filipino ang “nito” para sa isang lungsod.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: na nasa talampas
  rationale: Sa heograpiyang Transjordan, ang מִישׁוֹר ay tumutukoy sa patag at mataas na lupain, kaya mas tiyak ang “talampas” kaysa “kapatagan.”
- source_word: דִּיבוֹן
  choice: Dibon
  rationale: Pangalan ng lugar; transliterado.
- source_word: וּבָמוֹת בַּעַל
  choice: Bamot-baal
  rationale: Isang pangalan ng lugar sa kontekstong ito, hindi isinalin bilang karaniwang pariralang “matataas na dako ni Baal.”
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: at Bet-baal-meon
  rationale: Tambalang pangalan ng lugar; pinanatili ang anyong transliterado sa halip na isalin ang בֵּית bilang “bahay.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatiling transliterado ang mga pangalan ng lugar at ginamit ang “talampas” upang maipahayag nang natural ang heograpikong diwa ng מִישׁוֹר.
