base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: tl
  text: mula sa timog, ang buong lupain ng mga Cananeo, at ang Meara[a] na kabilang sa mga Sidonio, hanggang sa Apek, hanggang sa hangganan ng mga Amoreo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang yungib na kabilang sa mga Sidonio,” kung ang Meara ay ituturing na karaniwang pangngalan sa halip na pangalan ng lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: mula sa timog
  rationale: Karaniwang tumutukoy ang תֵּימָן sa timog o katimugang dako. Sa talaan ng saklaw ng lupain, ang heograpikong kahulugan ang pinakaangkop kaysa ituring itong pangalang Teman.
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: ang buong lupain ng mga Cananeo
  rationale: Literal na isahan ang katawagang etniko sa Hebreo ngunit kolektibo ang gamit; natural itong ipinahahayag sa Filipino sa pamamagitan ng maramihang “mga Cananeo.”
- source_word: וּמְעָרָה
  choice: at ang Meara
  rationale: Bagaman kaugnay ang anyo sa karaniwang pangngalang nangangahulugang “yungib,” malamang na pangalan ito ng lugar sa konteksto ng talaang heograpiko. Pinananatili ng transliterasyon ang posibilidad na ito nang hindi labis na nagpapakahulugan.
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: na sakop ng mga Sidonio
  rationale: Ipinahihiwatig ng ל ang pag-aari o pagkakaugnay sa mga Sidonio. Ang “sakop ng” ay natural sa paglalarawan ng teritoryo at hindi nangangailangang magpahiwatig ng pribadong pagmamay-ari.
- source_word: עַד אֲפֵקָה
  choice: hanggang sa Afec
  rationale: Ang עַד ay nagsasaad ng abot o hangganan, at ang hulaping patungo sa lugar ay likas nang naihahayag ng “hanggang sa.”
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: hanggang sa hangganan ng mga Amoreo
  rationale: Ang גְּבוּל ay tuwirang nangangahulugang hangganan sa kontekstong panlupain. Kolektibo ang isahang anyong etniko na הָאֱמֹרִי, kaya natural ang “mga Amoreo.”
theological_decisions: []
translation_notes:
  register: 'Makabago at marangal na Filipino, na may mga pangalang Cananeo, Sidonio, Afec, at Amoreo ayon sa nakagawiang anyong Filipino. Pinanatili ang sunod-sunod na “hanggang” upang katawanin ang dalawang עַד ng Hebreo. Walang talababa dahil ang ibinigay na unang talababa sa English consultation layer ay tila hindi tugma sa marker nito: ang alternatibong “yungib” ay nauukol sa Meara, hindi sa “mula sa timog.”'
