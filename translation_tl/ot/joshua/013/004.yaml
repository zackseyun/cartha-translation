  naturalness: Natural ang estruktura ng pangungusap bilang bahagi ng mas mahabang talaan ng mga teritoryo. Mas malinaw at neutral ang “na kabilang sa mga Sidonio” kaysa “na sakop ng mga Sidonio.”
  terminology: Pinanatili ang mga pangkat-etnikong Cananeo, Sidonio, at Amoreo. Ginamit ang “Apek” bilang mas karaniwang transliterasyong Filipino ng Aphek. Nagdagdag ng talababa sa Meara upang maitala ang leksikal na posibilidad na karaniwang pangngalan itong “yungib,” nang hindi ipinipilit ang isang pagbasa.
  issues:
