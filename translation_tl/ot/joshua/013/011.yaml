translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga taga-” para natural na maipahayag ang mga kolektibong katawagang etniko sa Hebrew. Pinanatili ang anyong pira-piraso at ang gitling sa dulo dahil bahagi ang talata ng nagpapatuloy na talaan mula sa nakaraang talata.
