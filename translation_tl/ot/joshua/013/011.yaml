  text: וְ/הַ/גִּלְעָ֞ד וּ/גְב֧וּל הַ/גְּשׁוּרִ֣י וְ/הַ/מַּעֲכָתִ֗י וְ/כֹ֨ל הַ֥ר חֶרְמ֛וֹן וְ/כָל הַ/בָּשָׁ֖ן עַד סַלְכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/011.yaml
  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: tl
  text: at ang Gilead, ang nasasakupan[a] ng mga taga-Geshur at taga-Maaca, ang buong Bundok Hermon[b], at ang buong Basan hanggang Salca—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hangganan ng mga taga-Geshur at taga-Maaca.” Ang salitang Hebrew ay maaaring tumukoy sa isang guhit ng hangganan o sa teritoryong sakop ng isang bayan; sa talaang ito, mas angkop ang mas malawak na diwang “nasasakupan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebrew, “ang buong Bundok Hermon.” Maaaring tumukoy ito sa buong kabundukan o bulubunduking rehiyon ng Hermon, hindi lamang sa tuktok nito.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Pangalan ito ng isang rehiyon. Hindi kailangan sa natural na Filipino ang artikulong katumbas ng Hebrew na הַ sa harap ng pangalang pantangi.
- source_word: גְבוּל
  choice: nasasakupan
  rationale: Sa talaang ito ng mga lupain, tumutukoy ang salita sa teritoryong sakop ng isang bayan, hindi lamang sa guhit ng hangganan. Pinananatili sa talababa ang tunay na posibilidad na ang ibig sabihin ay hangganan.
- source_word: הַגְּשׁוּרִי
  choice: mga taga-Geshur
  rationale: Ang isahang pang-uri para sa lahi o bayan ay kolektibo sa Hebrew. Ang “mga taga-Geshur” ay natural sa modernong Filipino at malinaw na tumutukoy sa mga taong kaugnay ng Geshur.
- source_word: הַמַּעֲכָתִי
  choice: mga taga-Maaca
  rationale: Gaya ng הַגְּשׁוּרִי, kolektibo ang isahang anyo sa Hebrew. Ang “mga taga-Maaca” ay malinaw at likas na katumbas sa Filipino.
- source_word: כֹל הַר חֶרְמוֹן
  choice: ang buong Bundok Hermon
  rationale: Maaaring mangahulugan ang הַר ng bundok o bulubunduking lupain. “Buong Bundok Hermon” ang pinakanatural na pangunahing salin, habang nililinaw ng talababa na maaaring mas malawak kaysa sa tuktok lamang ang tinutukoy.
- source_word: כָל הַבָּשָׁן
  choice: ang buong Basan
  rationale: Pangalan ng rehiyon ang Basan, at ipinahahayag ng “buong” ang saklaw ng כָל.
- source_word: עַד סַלְכָה
  choice: hanggang Salca
  rationale: Ipinakikita ng עַד ang hangganan o pinakadulong abot ng teritoryo. Natural at tuwiran sa Filipino ang “hanggang.”
