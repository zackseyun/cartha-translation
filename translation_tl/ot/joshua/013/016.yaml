base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: tl
  text: Ang hangganan nila ay mula sa Aroer, na nasa gilid ng Lambak ng Arnon[a], at ang lungsod na nasa gitna ng lambak, at ang buong mataas na kapatagan[b] hanggang Medeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pampang ng Wadi ng Arnon.” Ang salitang Hebreo na נַחַל ay maaaring tumukoy sa daluyan ng tubig, wadi, o lambak na bangin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “talampas” o “kapatagan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Ang hangganan nila ay
  rationale: Likas at malinaw sa makabagong Tagalog, habang pinananatili ang tahasang pagtukoy ng Hebreo sa hangganan.
- source_word: מֵעֲרוֹעֵר
  choice: mula sa Aroer
  rationale: Ipinahihiwatig ng מִן ang pinagmumulan ng hangganan; pinanatili ang pangalan ng lugar sa transliterasyon.
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: na nasa gilid ng Lambak ng Arnon
  rationale: Ang שָׂפָה ay literal na labi ngunit nangangahulugang gilid o pampang; maaaring tumukoy ang נַחַל sa lambak, bangin, o wading dinadaluyan ng tubig. Ang 'gilid ng Lambak' ay malinaw sa karaniwang mambabasa, at inilalahad sa talababa ang ibang posibleng anyong-lupa.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: at kasama ang lungsod na nasa gitna ng lambak
  rationale: Pinananatili ng 'nasa gitna' ang puwestong ipinahahayag ng בְּתוֹךְ. Idinagdag ang 'kasama' upang maging malinaw sa Tagalog na kabilang ang lungsod sa inilalarawang saklaw, nang hindi binabago ang heograpikong diwa.
- source_word: וְכָל הַמִּישֹׁר
  choice: at ang buong mataas na kapatagan
  rationale: Ang מִישׁוֹר dito ay patag na lupaing mataas sa Transjordan. Iniiwasan ng 'mataas na kapatagan' ang impresyong mababang kapatagan lamang, habang nananatiling madaling maunawaan.
- source_word: עַל מֵידְבָא
  choice: hanggang Medeba
  rationale: Sa paglalarawan ng hangganan, ipinahihiwatig ng עַל ang abot o lawak patungo sa isang lugar; natural itong ipahayag bilang 'hanggang Medeba.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangalang Aroer, Arnon, at Medeba. Ginamit ang 'mataas na kapatagan' upang maipahiwatig ang patag ngunit nakaangat na lupain, at inilagay ang mga alternatibong heograpikong katawagan sa mga talababa.
