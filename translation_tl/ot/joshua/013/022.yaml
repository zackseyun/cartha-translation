  text: וְ/אֶת בִּלְעָ֥ם בֶּן בְּע֖וֹר הַ/קּוֹסֵ֑ם הָרְג֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בַּ/חֶ֖רֶב אֶל חַלְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/022.yaml
  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
translation:
  language: tl
  text: At pinatay ng mga anak ni Israel sa pamamagitan ng tabak si Balaam na anak ni Beor, ang manghuhula, kasama ng iba pa nilang napatay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kabilang sa mga napatay nila.” Di-pangkaraniwan ang pariralang Hebreo sa hulihan; ipinahihiwatig nitong pinatay si Balaam kasama o kaugnay ng iba pang pinatay ng Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: At
  rationale: Ang וְ ay nagdaragdag ng isa pang detalye sa talaan ng pananakop; hindi hiwalay na isinasalin ang pantukoy sa tuwirang layon na אֶת sa Tagalog.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: si Balaam na anak ni Beor
  rationale: Likas na modernong Tagalog para sa pangalan at Hebreong patronimiko.
- source_word: הַקּוֹסֵם
  choice: ang manghuhula
  rationale: Tumutukoy ang קֹסֵם sa taong nagsasagawa ng panghuhula o divinasyon. Maikli, malinaw, at may angkop na negatibong pahiwatig ang “manghuhula.”
- source_word: הָרְגוּ בְנֵי יִשְׂרָאֵל
  choice: pinatay ng mga anak ni Israel
  rationale: Pinananatili ang tahasang “mga anak ni Israel” sa Hebreo at natural na ipinapahayag ang pandiwang pagpatay sa Tagalog.
- source_word: בַּחֶרֶב
  choice: sa pamamagitan ng tabak
  rationale: Malinaw na ipinahahayag ang instrumental na gamit ng בְּ at ang paraan ng pagpatay.
- source_word: אֶל חַלְלֵיהֶם
  choice: kasama ng iba pa nilang napatay
  rationale: Ang di-karaniwang parirala ay nagpapahiwatig na pinatay si Balaam kaugnay o kasama ng iba pang napatay ng Israel. Ang “iba pa” ay nililinaw ang idiom nang hindi binabago ang ugnayang ipinahihiwatig.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “manghuhula” bilang karaniwang salitang mauunawaan ng ordinaryong mambabasa, at pinanatili ang “mga anak ni Israel” bilang malapit na katumbas ng anyong Hebreo.
