translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tradisyonal na “mana” at “mga anak ni Gad,” ngunit ginamit ang natural na “kani-kanilang angkan.” Ang gitling-pahaba ay naghihiwalay sa buod at sa paliwanag kung ano ang saklaw ng mana.
