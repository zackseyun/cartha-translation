  text: This was the inheritance of the sons of Gad according to their clans—the cities and their villages[a].
translation:
  language: tl
  text: Ito ang mana ng mga anak ni Gad ayon sa kani-kanilang angkan—ang mga lungsod at mga nayon ng mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ito ang mana ng mga anak ni Gad ayon sa kani-kanilang angkan: ang mga lungsod at mga nayon ng mga ito.” Walang tahasang pandiwang nagsasaad ng panahon sa pormulang Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Ito ang
  rationale: Ang pambabaeng panghalip na pamatlig ay tumutukoy sa mana o lupaing kababanggit. Hindi kailangang lagyan ng panahunang pandiwa sa natural na Tagalog, kaya napapanatili ang posibilidad ng Hebreo na unawain bilang buod na “ito ang” sa kasalukuyan o kaugnay ng naunang salaysay.
- source_word: נַחֲלַת
  choice: mana
  rationale: Karaniwang tumutukoy ang נַחֲלָה sa minana o itinalagang bahagi ng lupain. Ang “mana” ay maikli, natural, at nagpapanatili sa diwang tipan at lupain sa Josue.
- source_word: בְּנֵי גָד
  choice: mga anak ni Gad
  rationale: Pinananatili nito ang pormal at heneyalohikal na katawagan sa tribo, habang malinaw na tumutukoy sa mga inapo ni Gad.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinahihiwatig ng parirala ang paghahati o pag-uuri ng lupain ayon sa mga pangkat ng magkakamag-anak sa loob ng tribo. Nililinaw ng “kani-kanilang” ang distributibong diwa.
- source_word: הֶעָרִים
  choice: mga lungsod
  rationale: Ang עָרִים ang karaniwang katawagan sa mga bayang may permanenteng pamayanan sa mga talaan ng paghahati ng lupain. Ang “mga lungsod” ang kumbensiyonal at malinaw na salin.
- source_word: וְחַצְרֵיהֶם
  choice: at mga nayon ng mga iyon
  rationale: Sa pormulang panteritoryo, ang חָצֵר ay tumutukoy sa maliliit at nakadependeng pamayanang kaugnay ng mga lungsod. Ang “mga nayon” ay natural; ang “ng mga iyon” ay malinaw na iniuugnay ang mga nayon sa mga lungsod, gaya ng hulaping panghalip sa Hebreo.
