  register: Makabagong, dignified, at madaling maunawaang Filipino. Ginamit ang “lipi” at “angkan” upang malinaw na maipakita ang magkaibang antas ng pagkakahating panlipi. Ang tutuldok ay pinanatili dahil ipinakikilala ng talata ang kasunod na paglalarawan ng teritoryo.
