  text: And Moses gave to the tribe of the sons of Reuben according to their clans:[a]
translation:
  language: tl
  text: At ibinigay ni Moises sa lipi ng mga anak ni Ruben ayon sa kani-kanilang angkan:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sa lipi ng mga Rubenita.” Literal sa Hebreo: “sa lipi ng mga anak ni Ruben.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: At ibinigay
  rationale: Ang wayyiqtol ng נתן ay nagpapatuloy sa salaysay; likas na ipinahahayag ito sa Tagalog bilang “At ibinigay.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: לְמַטֵּה
  choice: sa lipi
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi; ang לְ ay minamarkahan ang tumatanggap.
- source_word: בְנֵי רְאוּבֵן
  choice: ng mga anak ni Ruben
  rationale: Pinananatili ang literal na ekspresyong pangkamag-anakan sa Hebreo habang malinaw pa rin sa modernong Tagalog.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה rito ay mga angkan sa loob ng lipi, at ipinahahayag ng לְ ang pamamahagi o pagsasaayos ayon sa mga ito.
- source_word: implicit object of וַיִּתֵּן
  choice: ang kanilang bahagi
  rationale: Bagaman walang tahasang layon sa talata, ipinahihiwatig ng konteksto ng pamamahagi ng lupain kung ano ang ibinigay. Idinagdag ito para sa likas at malinaw na Tagalog nang hindi tinutukoy nang higit sa sinasabi ng konteksto.
