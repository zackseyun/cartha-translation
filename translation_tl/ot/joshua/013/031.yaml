base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: tl
  text: at ang kalahati ng Gilead, at ang Ashtarot at Edrei, na mga lungsod ng kaharian ni Og sa Bashan[a], ay ibinigay sa mga anak ni Makir, na anak ni Manases—sa kalahati ng mga anak ni Makir[b], ayon sa kani-kanilang angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “ang mga lungsod ng kaharian ni Og sa Bashan.” Maaari ring unawain bilang “ang mga maharlikang lungsod ni Og sa Bashan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Makir” ay maaari ring tumukoy nang mas malawak sa mga inapo ni Makir; pinanatili rito ang pananalitang pampamilya ng Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: at ang kalahati ng Gilead
  rationale: Ipinagpapatuloy ng וַ ang talaan ng mga lupa mula sa naunang talata. Tuwirang inilalarawan ng חֲצִי ang kalahating bahagi ng teritoryo ng Gilead.
- source_word: וְעַשְׁתָּרוֹת וְאֶדְרֶעִי
  choice: kasama ang Ashtarot at Edrei
  rationale: Pinananatili ang mga pangalang pantangi sa anyong transliterado. Ginamit ang “kasama” upang maging natural sa Filipino ang pagpapatuloy ng listahan nang hindi binabago ang ugnayan ng mga lugar.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: ang mga lungsod ng kaharian ni Og sa Bashan
  rationale: Tuwirang pinananatili ang construct chain ng Hebreo at hindi ipinapalagay na ang mga ito ay mga kabisera o natatanging “maharlikang lungsod.”
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: ay ibinigay sa mga anak ni Makir na anak ni Manases
  rationale: Ipinahihiwatig ng לִ ang pagtatalaga ng lupain. Idinagdag ang pandiwang “ibinigay” upang maging ganap at natural ang sugnay sa Filipino, samantalang pinananatili ang literal na pananalitang “mga anak.”
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: samakatuwid, sa kalahati ng mga anak ni Makir
  rationale: Nililinaw ng parirala kung aling bahagi ng mga anak o lahi ni Makir ang tumanggap ng lupain. Hindi idinagdag ang “kalahating lipi” sapagkat walang katumbas na salita para sa “lipi” sa pariralang Hebreo.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa konteksto ng paghahati ng lupain, ang מִשְׁפָּחוֹת ay tumutukoy sa mga yunit ng angkan sa loob ng lipi. Mas tiyak dito ang “angkan” kaysa sa makabagong kahulugan ng “pamilya.”
