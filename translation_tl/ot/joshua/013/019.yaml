base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/019.yaml
  text: and Kiriathaim[a], and Sibmah, and Zereth-shahar on the hill of the valley,
translation:
  language: tl
  text: at Kiriataim, at Sibma, at Zeret-sahar[a] sa burol ng lambak,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “Zeret ng bukang-liwayway,” kung susuriin ang pangalan ayon sa kahulugan nito sa halip na panatilihin ang anyong pangalan ng lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: Kiriataim
  rationale: Pangalan ito ng isang lugar, kaya tinumbasan sa paraang angkop sa makabagong baybay at pagbigkas sa Filipino sa halip na isalin ang kahulugan nito.
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Isinalin-baybay bilang pangalan ng lugar; ang unang katinig na sin ay likas na kinakatawan ng “s” sa Filipino.
- source_word: צֶרֶת הַשַּׁחַר
  choice: Zeret-sahar
  rationale: Itinuring na tambalang pangalan ng lugar dahil kabilang ito sa talaan ng mga bayan. Pinanatili ang anyong pangalan sa pangunahing teksto, habang inilagay sa talababa ang posibleng pagsusuring ayon sa kahulugan.
- source_word: בְּהַר הָעֵמֶק
  choice: sa burol ng lambak
  rationale: Ang בְּ ay lokatibo, ang הַר ay maaaring tumukoy sa bundok o burol, at ang konstruktong may הָעֵמֶק ay tuwirang pinanatili bilang “ng lambak.” Pinili ang “burol” bilang natural na paglalarawan sa lokal na topograpiya.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ayos ng talaan at ang bahagyang di-tiyak na ugnayang topograpiko sa pariralang “sa burol ng lambak.” Inilipat ang marker sa “Zeret-sahar,” na siyang salitang tinutukoy ng talababa.
