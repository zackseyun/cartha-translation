  source_fidelity: 'Tapat ang salin sa Hebreong talaan ng mga lugar: napanatili ang magkakaugnay na pantulong na “at,” ang mga pangalang-lugar ay naisalin-baybay sa halip na isalin, at ang בְּהַר הָעֵמֶק ay wastong naipahayag bilang lokatibong “sa burol ng lambak.” Ang “burol” ay isang katanggap-tanggap na modernong katumbas ng הַר sa lokal na topograpikong kontekstong ito.'
