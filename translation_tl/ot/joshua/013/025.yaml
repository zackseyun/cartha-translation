base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: tl
  text: Ang nasasakupan nila ay Jazer, ang lahat ng lunsod sa Gilead, at ang kalahati ng lupain ng mga Ammonita, hanggang sa Aroer na nasa tapat ng Rabba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nakaharap sa Rabba.” Literal sa Hebreo, “na nasa harap ng Rabba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Ang nasasakupan nila ay
  rationale: Sa konteksto ng listahan ng mga lugar na kabilang sa bahagi ng lipi, ang גְּבוּל ay tumutukoy sa saklaw ng lupaing ipinamahagi, hindi lamang sa guhit ng hangganan. Natural at malinaw sa modernong Filipino ang “nasasakupan.”
- source_word: יַעְזֵר
  choice: Jazer
  rationale: Transliterasyon ng pangalang Hebreo na iniangkop sa karaniwang anyo ng pangalan sa Bibliyang Filipino.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: ang lahat ng lunsod sa Gilead
  rationale: Ang עָרִים ay maaaring “mga lunsod” o “mga bayan.” Pinanatili ng “mga lunsod” ang marangal na rehistro ng talaang panteritoryo, at ang “sa Gilead” ay likas na Filipino para sa mga lunsod na nasa rehiyon.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: at ang kalahati ng lupain ng mga Ammonita
  rationale: Ang בְּנֵי עַמּוֹן ay karaniwang katawagang etniko para sa mga Ammonita; ang אֶרֶץ ay “lupain” sa kontekstong heograpiko.
- source_word: עַד
  choice: hanggang sa
  rationale: Malinaw na ipinapahayag nito ang hangganan o dulo ng nasasakupan.
- source_word: עֲרוֹעֵר
  choice: Aroer
  rationale: Tuwirang transliterasyon ng pangalan ng lugar.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: na nasa tapat ng Rabba
  rationale: Ang idyomang עַל־פְּנֵי ay maaaring mangahulugang “sa harap ng,” “nakaharap sa,” o “nasa tapat ng.” Hindi tinutukoy ng salin ang tiyak na direksiyon na wala sa Hebreo.
