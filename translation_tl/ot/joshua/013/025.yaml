  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nasasakupan” upang ipakita ang teritoryong inilalarawan ng kasunod na talaan, at pinanatili sa talababa ang saklaw ng kahulugan ng Hebreong idyomang panlunan.
