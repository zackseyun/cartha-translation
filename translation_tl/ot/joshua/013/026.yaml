  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: tl
  text: At mula sa Hesbon hanggang sa Ramat-mizpa at Betonim, at mula sa Mahanaim hanggang sa hangganan patungo sa Debir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hangganan ng Debir.” Maaaring unawain ang לִדְבִר bilang direksiyonal na “patungo sa Debir” o bilang pagtukoy sa hangganang kaugnay ng Debir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  choice: mula sa Hesbon
  rationale: Ang מִן ay nagsasaad ng pinagmulan o pasimula ng saklaw; hindi kailangang isalin nang hiwalay ang pambungad na ו sa Filipino dahil bahagi ito ng nagpapatuloy na talaan.
- source_word: עַד
  choice: hanggang sa
  rationale: Sa paglalarawan ng mga hangganan, likas nitong ipinapahayag ang abot o dulo ng saklaw.
- source_word: רָמַת הַ/מִּצְפֶּה
  choice: Ramat-mizpa
  rationale: Pangalan ito ng lugar; pinanatili ang anyong transliterado sa halip na isaling “mataas na dako ng bantayan.”
- source_word: וּ/בְטֹנִים
  choice: at Betonim
  rationale: Pangalan ng lugar na may pang-ugnay na ו, kaya “at Betonim.”
- source_word: וּ/מִֽ/מַּחֲנַיִם
  choice: at mula sa Mahanaim
  rationale: Pinananatili ang pang-ugnay at ang diwang pinagmulan ng מִן; transliterado ang pangalan ng lugar.
- source_word: גְּב֥וּל
  choice: hangganan
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa linyang nagtatakda sa sakop ng teritoryo.
- source_word: לִדְבִר
  choice: patungong Debir
  rationale: Pinananatili ang direksiyonal na puwersa ng לְ; maaari rin itong unawain bilang kaugnayang “hangganan ng Debir.”
