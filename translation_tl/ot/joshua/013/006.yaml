  source_fidelity: 'Tumpak ang pangunahing diwa: saklaw nito ang mga naninirahan sa kabundukan, ang mga taga-Sidon, ang mariing pangako ng Diyos na palalayasin sila, at ang utos kay Josue na italaga ang lupain sa Israel bilang mana. Gayunman, ang “pati” ay nagmumungkahing simpleng dagdag lamang ang mga taga-Sidon, samantalang ang Hebreo ay mas mabuting ipakita bilang appositional o paglilinaw na pangkat. Ang alternatibong tala b ay dapat ding iwasang magpahiwatig na ang mga tao ay aalisan lamang ng ari-arian sa halip na palalayasin/dispossess mula sa lupain.'
