  terminology: Ang “kabundukan,” “mga anak ni Israel,” “taga-Sidon,” at “mana” ay angkop. Pinananatili ang Misrefot-maim bilang pangalang-pook at ang tala tungkol sa di-tiyak na kahulugan nito. Ang tala sa palabunutan ay angkop na paliwanag sa idyoma ng paglalaan ng lupain.
