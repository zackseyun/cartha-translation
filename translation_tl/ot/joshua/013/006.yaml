revisions:
- from: Ang lahat ng naninirahan sa kabundukan mula sa Lebanon hanggang sa Misrefot-maim[a], pati ang lahat ng taga-Sidon—ako mismo ang magpapalayas sa kanila sa harap ng mga anak ni Israel.[b] Basta italaga mo ang lupa sa Israel bilang mana[c], ayon sa iniutos ko sa iyo.
  to: Lahat ng naninirahan sa kabundukan, mula Lebanon hanggang Misrefot-maim[a]—lahat ng taga-Sidon—ako mismo ang magpapalayas sa kanila sa harap ng mga anak ni Israel.[b] Ipamahagi mo lamang ito sa Israel bilang mana[c], ayon sa iniutos ko sa iyo.
  rationale: Inayos ang pagmamarka sa “lahat ng taga-Sidon” upang hindi pahinain ang estruktura ng Hebreo, pinalitan ang kolokyal na “Basta” ng restriktibong “lamang,” at ginawang “ipamahagi” ang pandiwa upang malinaw ang paglalaan ng lupain bilang mana. Nilinaw rin ang lexical-alternative footnote upang hindi maling maunawaan ang dispossession bilang pagkuha lamang ng ari-arian.
