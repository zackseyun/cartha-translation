id: JOS.13.6
reference: Joshua 13:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: tl
  text: Lahat ng naninirahan sa kabundukan, mula Lebanon hanggang Misrefot-maim[a]—lahat ng taga-Sidon—ako mismo ang magpapalayas sa kanila sa harap ng mga anak ni Israel.[b] Ipamahagi mo lamang ito sa Israel bilang mana[c], ayon sa iniutos ko sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Misrefot-maim ay isang pangalang-pook. Maaaring ang ibig sabihin ng pangalan ay gaya ng “mga pagsusunog sa tubig,” ngunit hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “Ako mismo ang mag-aalis sa kanila sa harap ng mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: c
    text: Ang “ipamahagi” ay sumasalamin sa Hebreong idyoma ng paghahati at pagtatalaga ng lupain, karaniwan sa pamamagitan ng palabunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: mga naninirahan sa kabundukan
  rationale: Ang participial construct ay tumutukoy sa mga naninirahan, at sa kontekstong heograpikal ang הָהָר ay mas natural na tumutukoy sa kabundukan kaysa sa iisang bundok.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: mula sa Lebanon hanggang sa Misrefot-maim
  rationale: Kapuwa pangalang-pook ang Lebanon at Misrefot-maim; pinanatili ang transliterasyon sa halip na magbigay ng tiyak ngunit haka-hakang kahulugan sa huling pangalan.
- source_word: כָּל צִידֹנִים
  choice: pati ang lahat ng taga-Sidon
  rationale: Kolektibong tinutukoy ang populasyong Sidonio. Natural sa modernong Tagalog ang “mga taga-Sidon,” at ipinahihiwatig ng “pati” na kasama sila sa naunang saklaw.
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: ako mismo ang magpapalayas sa kanila
  rationale: Ipinapakita ng “ako mismo” ang diin ng hiwalay na panghalip na אָנֹכִי. Ang Hiphil ng ירשׁ dito ay pag-aalis o pagpapalayas sa mga naninirahan sa lupain.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: sa harap ng mga anak ni Israel
  rationale: Pinananatili nito ang relasyonal na larawan ng Hebreo—pag-aalis habang sumusulong o nasa harap ang Israel—at ang tahasang filial na katawagan.
- source_word: רַק
  choice: Basta
  rationale: 'Sa konteksto, nililimitahan ng רַק ang sinabi: ang Diyos ang magpapalayas, ngunit tungkulin pa rin ni Josue na italaga ang lupain. Ang “Basta” ay natural na utos na may gayong paglilimita.'
- source_word: הַפִּלֶהָ
  choice: italaga mo ang lupa
  rationale: Ang causative idiom ng נפל ay tumutukoy sa paghahati o pagtatalaga ng lupain, karaniwang sa pamamagitan ng palabunutan. Nilinaw bilang “lupa” ang pambabaeng isahang layon na ipinahihiwatig ng hulapi.
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: sa Israel bilang mana
  rationale: Ang נַחֲלָה ay minanang pag-aari, lalo na sa konteksto ng lupaing ipinagkaloob sa tipan; ang “mana” ay maikli, natural, at nagpapanatili sa legal at teolohikal na pahiwatig.
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: ayon sa iniutos ko sa iyo
  rationale: Tumutukoy ang perfect verb sa nauna nang utos ng Diyos kay Josue na nananatiling may bisa.
theological_decisions:
- issue: Paglilipat ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanang Israel
  rationale: Pinananatili ang tahasang filial na anyo at pangtipang katawagan ng Hebreo nang hindi ito ginagawang neutral.
- issue: Paglilipat ng נַחֲלָה sa konteksto ng paghahati ng lupain
  choice: mana
  alternative: pag-aari / pamana
  rationale: Ipinahahayag ng “mana” na ang lupa ay ipinagkaloob bilang minanang bahagi, hindi lamang karaniwang teritoryo, nang hindi nagdaragdag ng doktrinang wala sa teksto.
- issue: Ahensiya sa אָנֹכִי אוֹרִישֵׁם
  choice: ako mismo ang magpapalayas sa kanila
  alternative: ako ang mag-aalis sa kanila sa kanilang pag-aari
  rationale: Pinananatili ang diin sa banal na ahensiya at ang semantikong saklaw ng dispossession, habang natural ang pangunahing salin sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kabundukan,” “taga-Sidon,” at “mana” bilang natural na mga katumbas; pinanatili ang “mga anak ni Israel” upang katawanin ang anyong filial ng pinagmulang teksto. Ang gitling na pahaba ay nagpapanatili sa biglang pagdiin sa banal na pangako.
