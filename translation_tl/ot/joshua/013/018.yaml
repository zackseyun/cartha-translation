lexical_decisions:
- source_word: וְ/יַהְצָה
  choice: at ang Jahaz
  rationale: Pangalan ito ng isang lugar sa talaan ng mga lunsod. Isinulat ito ayon sa karaniwang anyong ginagamit sa mga saling Tagalog, sa halip na isalin ang kahulugan nito.
- source_word: וּ/קְדֵמֹת
  choice: Kedemot
  rationale: Pangalan ito ng lugar at hindi karaniwang pangngalang dapat isalin. Ginamit ang anyong madaling bigkasin sa Tagalog, kung saan ang pangwakas na th ng Ingles ay kinakatawan ng t.
- source_word: וּ/מֵפָעַת
  choice: Mefaat
  rationale: Pangalan ito ng lugar at tinumbasan sa baybay na angkop sa Tagalog. Pinanatili ang pagkakasunod ng mga patinig na mas malapit sa Hebreong מֵפָעַת.
