  to: 'Mula sa Sihor, na nasa silangan ng Ehipto, hanggang sa hangganan ng Ekron sa hilaga—ibinibilang ito sa mga Cananeo—ang limang pinuno ng mga Filisteo: ang taga-Gaza, taga-Asdod, taga-Askelon, taga-Gat, at taga-Ekron, at ang mga Avita.[a]'
