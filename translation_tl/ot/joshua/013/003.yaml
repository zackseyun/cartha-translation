  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: tl
  text: 'Mula sa Sihor, na nasa silangan ng Ehipto, hanggang sa hangganan ng Ekron sa hilaga—ibinibilang ito sa mga Cananeo—ang limang pinuno ng mga Filisteo: ang taga-Gaza, taga-Asdod, taga-Askelon, taga-Gat, at taga-Ekron, at ang mga Avita.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring iugnay ang “mga Avita” sa pariralang “sa timog” sa simula ng kasunod na talata: “at ang mga Avita sa timog.”'
    reason: Hindi ganap na tiyak ang paghahati ng sintaks sa pagitan ng Josue 13:3 at 13:4. Bagaman nagtatapos ang Masoretic Text sa “mga Avita,” posible ring basahin ang kasunod na “sa timog” bilang kaugnay nito.
lexical_decisions:
- source_word: שִׁיחוֹר
  choice: Sihor
  rationale: Isinalin bilang pangalang pantangi, alinsunod sa anyo ng Hebreo, sa halip na tukuyin nang tiyak ang ilog na tinutukoy.
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: nasa silangan ng Ehipto
  rationale: Sa kontekstong heograpikal, maaaring tumukoy ang idyomang ‘al-pene sa dakong nakaharap o nasa silangan ng Ehipto; pinili ang natural na direksiyonal na salin habang kinikilalang literal itong ‘sa harap ng Ehipto.’
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Ang seranim ay natatanging titulo ng limang pinunong Filisteo; ang ‘mga pinuno’ ay malinaw at hindi nag-aangkat ng mas tiyak na sistemang pampolitika.
- source_word: הָעַזָּתִי ... הָעֶקְרוֹנִי
  choice: ang pinuno ng Gaza ... ng Ekron
  rationale: Ang mga anyong gentiliko ay kaugnay ng limang naunang pinuno; ginawang tahasan sa Tagalog upang maiwasan ang alanganing ‘Gazita’ at maipakita ang sintaktikong ugnayan.
- source_word: הָעַוִּים
  choice: mga Avita
  rationale: Ginamit ang pangalang-etnikong anyong madaling maunawaan sa Tagalog, nang hindi ipinapalagay ang eksaktong lokasyon o kaugnayan nila sa naunang limang sakop.
theological_decisions:
- issue: Pagbilang sa teritoryo bilang Cananeo kahit sakop ng mga Filisteo
  choice: itinuturing itong lupain ng mga Cananeo
  alternative: ibinibilang ito sa mga Cananeo
  rationale: 'Pinananatili ang tensiyon sa tekstong Hebreo: ang lupaing pinamumunuan ng mga Filisteo ay itinuturing o ibinibilang na Cananeo, nang hindi ipinapaliwanag o pinagkakasundo ang dalawang katawagan.'
- issue: Ugnayan ng mga Avita sa listahan
  choice: kasama rin ang mga Avita, na may talababa tungkol sa posibleng pagkakaugnay sa kasunod na talata
  alternative: at ang mga Avita sa timog
  rationale: Nagtatapos ang Masoretic Text sa ‘mga Avita,’ ngunit maaaring syntactically iugnay ang parirala sa kasunod na ‘sa timog.’ Pinanatili sa pangunahing teksto ang dibisyon ng talata at inilagay sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga kilalang anyong Tagalog ng mga pangalan ng lugar at bayan. Idinagdag ang ‘nasasakupan’ at inulit ang ‘pinuno’ upang maging natural at malinaw ang putol-putol na listahan sa Hebreo, nang hindi binabago ang heograpikal at pampolitikang nilalaman.
