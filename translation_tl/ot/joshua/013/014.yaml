  to: Tanging sa lipi ni Levi ay hindi siya nagbigay ng mana. Ang mga handog na sinusunog para kay Yahweh, ang Diyos ng Israel, ang siyang mana nito[a], gaya ng sinabi niya sa liping iyon.
