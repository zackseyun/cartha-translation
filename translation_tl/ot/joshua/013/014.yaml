base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: tl
  text: Tanging sa lipi ni Levi ay hindi siya nagbigay ng mana. Ang mga handog na sinusunog para kay Yahweh, ang Diyos ng Israel, ang siyang mana nito[a], gaya ng sinabi niya sa liping iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “Si Yahweh, ang Diyos ng Israel, ang siyang mana nito.”'
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Sa konteksto, minamarkahan nito ang eksepsiyon sa naunang pamamahagi ng lupain; natural sa Tagalog ang “Ngunit” habang nananatili ang paghihigpit ng Hebreo.
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: sa lipi ni Levi
  rationale: Karaniwang Tagalog ito para sa tatanggap kasunod ng pandiwang “nagbigay,” at malinaw na tumutukoy sa tribo ni Levi.
- source_word: לֹא נָתַן נַחֲלָה
  choice: hindi siya nagbigay ng mana
  rationale: Tuwirang isinasalin ang negadong pandiwa at ang נַחֲלָה; sa konteksto, ang “mana” ay tumutukoy sa bahaging lupain.
- source_word: אִשֵּׁי יְהוָה
  choice: ang mga handog na sinusunog para kay Yahweh
  rationale: Pinananatili ang kaugnayan ng אִשֵּׁי sa mga handog na inihahandog sa apoy, nang hindi ito nilalabnaw bilang pangkalahatang handog lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalan.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Natural na salin ng construct chain at appositional na paglalarawan kay Yahweh.
- source_word: הוּא נַחֲלָתוֹ
  choice: ang siyang mana nito
  rationale: Iniuugnay ng pangunahing teksto ang mana sa pinakamalapit na pariralang “mga handog,” habang ginagamit ang kolektibong “siyang” at “nito” upang tumukoy sa lipi ni Levi.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: gaya ng sinabi niya rito
  rationale: Pinananatili ang literal na diwang “sinabi” sa halip na ipakahulugang “ipinangako”; ang “rito” ay tumutukoy nang kolektibo sa lipi ni Levi.
theological_decisions:
- issue: Ang likas ng mana ng lipi ni Levi
  choice: Ang mga handog na sinusunog para kay Yahweh ... ang siyang mana nito
  alternative: Si Yahweh, ang Diyos ng Israel, ang siyang mana nito
  rationale: Mas tuwirang inuugnay ng agarang sintaks ang panghalip sa naunang mga handog. Gayunman, pinananatili sa talababa ang alternatibong pagbasa dahil maaari itong maunawaan ayon sa kalapit na mga talata at sa singular na הוּא.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lipi” at “mana” bilang pamilyar na bokabularyong biblikal. Iniwasan ang sobrang teknikal na “handog sa apoy,” ngunit pinanatili ang ideya ng pagsusunog sa “mga handog na sinusunog.”
