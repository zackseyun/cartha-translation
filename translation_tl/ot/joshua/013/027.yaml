base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: tl
  text: 'at sa lambak: Bet-haram, Bet-nimra, Sucot, at Zafon—ang nalalabing bahagi ng kaharian ni Sihon, na hari ng Hesbon—na ang Jordan ang hangganan nito hanggang sa ibabang dulo[a] ng Dagat ng Kineret, sa kabilang panig ng Jordan, sa silangan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa gilid ng Dagat ng Kineret” o “hanggang sa dulong bahagi ng Dagat ng Kineret.”
    reason: Pinananatili ang saklaw ng kahulugan ng קְצֵה, na maaaring tumukoy sa dulo, gilid, o dulong bahagi; hindi ganap na tiyak sa mismong salita ang heograpikong “ibabang” direksiyon.
lexical_decisions:
- source_word: וּ/בָ/עֵמֶק
  choice: at sa lambak
  rationale: Karaniwang tumutukoy ang עֵמֶק sa lambak o mababang lupain. Ang “lambak” ay natural at malinaw sa makabagong Filipino.
- source_word: בֵּית הָרָם וּ/בֵית נִמְרָה וְ/סֻכּוֹת וְ/צָפוֹן
  choice: Bet-haram, Bet-nimra, Sucot, at Zafon
  rationale: Mga pangalan ito ng lugar, kaya isinalin ang mga ito sa anyong transliterasyon na madaling basahin sa Filipino. Ang צָפוֹן dito ay Zafon na pangalan ng bayan, hindi ang karaniwang salitang “hilaga.”
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: ang nalalabing bahagi ng kaharian ni Sihon na hari ng Hesbon
  rationale: Ang יֶתֶר ay “nalabi” o “nalalabing bahagi,” at ang מַמְלָכוּת ay likas na maisasaling “kaharian” sa kontekstong ito.
- source_word: הַ/יַּרְדֵּן וּ/גְבֻל
  choice: na ang Jordan ang hangganan
  rationale: Masinsin at appositional ang Hebreo; nililinaw ng pariralang Filipino na ang Ilog Jordan ang nagsilbing hangganan ng teritoryo nang hindi nagdaragdag ng bagong impormasyon.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: hanggang sa ibabang dulo[a] ng Dagat ng Kineret
  rationale: Ang קְצֵה ay maaaring mangahulugang dulo, gilid, o hangganang bahagi. Ang “ibabang dulo” ay angkop sa heograpikong paglalarawan, habang pinananatili sa talababa ang tunay na leksikal na alternatibo.
- source_word: עֵבֶר הַ/יַּרְדֵּן מִזְרָחָ/ה
  choice: sa silangang ibayo ng Jordan
  rationale: Ito ay pormulang panteritoryo na tumutukoy sa panig sa silangan ng Jordan. Ang “sa silangang ibayo” ay maikli, marangal, at natural sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit, na may malinaw na ayos para sa talaan ng mga lugar. Pinanatili ang pangalang Kineret mula sa Hebreo sa halip na palitan ito ng mas huling pangalang Galilea. Inilagay ang talababa sa “ibabang dulo,” ang pariralang tunay na may leksikal na alternatibo.
