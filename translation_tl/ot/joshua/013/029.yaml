base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: tl
  text: 'Binigyan ni Moises ang kalahati ng lipi ni Manases, at ito ay para sa kalahati ng lipi ng mga anak ni Manases[a], ayon sa kanilang mga angkan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Manases,” isang pananalitang pangkamag-anakan na tumutukoy sa mga inapo ni Manases bilang isang lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Binigyan
  rationale: Sa konteksto ng paghahati ng lupain, ipinahihiwatig ng pandiwa na pinagkalooban ni Moises ang tinutukoy na pangkat. Likas sa Tagalog ang pandiwang nakatuon sa tumanggap kapag hindi tahasang binanggit ang bagay na ibinigay.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: ang kalahati ng lipi ni Manases
  rationale: Tuwirang ipinapahayag ang kalahating bahagi ng lipi; ang “lipi” ang karaniwang makabagong salin ng שֵׁבֶט sa kontekstong pantribo.
- source_word: וַיְהִי
  choice: at ang bahaging iyon ay para sa
  rationale: Pinananatili ang diwa ng Hebreong “at ito ay para sa” sa pormula ng pamamahagi. Ang “bahaging iyon” ay nilinaw lamang bilang ipinahiwatig na pamana o takdang bahagi, nang hindi tinutukoy kung lupain o ibang teknikal na termino.
- source_word: מַטֵּה
  choice: lipi
  rationale: Bagaman maaari itong mangahulugang “tungkod,” tumutukoy ito rito sa yunit na pantribo. Isinalin itong kapareho ng שֵׁבֶט dahil iisa ang tinutukoy na panlipunang pangkat sa konteksto.
- source_word: בְנֵי מְנַשֶּׁה
  choice: mga anak ni Manases
  rationale: Pinananatili ang tahasang pananalitang pangkamag-anakan ng Hebreo; sa konteksto, tumutukoy ito sa mga inapo at kasapi ng lipi ni Manases.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Ang מִשְׁפָּחוֹת ay mga pangkat ng magkakamag-anak sa loob ng lipi; ang “ayon sa” ay nagpapahayag ng pamamahagi batay sa mga angkang iyon.
