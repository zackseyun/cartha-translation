base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/002.yaml
  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
translation:
  language: tl
  text: 'Ito ang lupaing natitira: ang lahat ng mga rehiyon[a] ng mga Filisteo, at ang lahat ng mga Gesureo[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga nasasakupan.” Ang salitang Hebreo na גְּלִילוֹת ay tumutukoy sa mga teritoryal na lugar na kaugnay ng mga Filisteo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang Gesureo,” na nasa anyong isahan ngunit ginagamit bilang kolektibong tawag; inililinaw ng “mga Gesureo” ang kolektibong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ
  choice: Ito ang lupain
  rationale: Likas na presentatibong parirala sa Filipino; pinananatili ng “lupain” ang heograpiko at teritoryal na diwa ng אֶרֶץ.
- source_word: הַנִּשְׁאָרֶת
  choice: na natitira
  rationale: Isinasalin ang Niphal participle bilang kasalukuyang kalagayan ng lupaing hindi pa nasasakop.
- source_word: כָּל גְּלִילוֹת
  choice: ang lahat ng mga rehiyon
  rationale: Ang גְּלִילוֹת ay tumutukoy sa mga teritoryal na sakop o rehiyon; ang “mga rehiyon” ay malinaw at likas sa makabagong Filipino nang hindi nagpapahiwatig ng tiyak na modernong sistemang administratibo.
- source_word: הַפְּלִשְׁתִּים
  choice: ng mga Filisteo
  rationale: Pangalan ito ng pangkat ng mga tao, kaya pinananatili ang ugnayang “mga rehiyon ng mga Filisteo” sa halip na palitan ng pangalan ng lupain.
- source_word: וְכָל הַגְּשׁוּרִי
  choice: at ang lahat ng mga Gesureo
  rationale: Bagaman anyong isahan ang gentiliko sa Hebreo, kolektibo ang gamit nito. Likas na ipinahahayag sa Filipino ang kolektibong kahulugan sa pamamagitan ng “mga Gesureo.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “rehiyon” sa halip na “distrito” upang maiwasan ang masyadong tiyak na modernong administratibong kahulugan. Pinanatili ang tutuldok at pangwakas na gatlang upang ipakitang nagpapatuloy ang talaan sa kasunod na talata.
