id: JOS.13.8
reference: Joshua 13:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: tl
  text: Kasama niya[a], tinanggap ng mga lipi ni Ruben at ni Gad ang kanilang mana, na ibinigay sa kanila ni Moises sa silangan ng Ilog Jordan, gaya ng ibinigay sa kanila ni Moises na lingkod ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “niya” ay tumutukoy sa kalahating lipi ni Manases na binanggit sa naunang talata.
    reason: contextual_clarification
lexical_decisions:
- source_word: עִמּוֹ
  choice: Kasama niya
  rationale: Ang hulaping panlalaking isahan ay likas na tumutukoy sa naunang binanggit na kalahating lipi ni Manases; pinananatili rin nito ang reperensiyang nakasalalay sa konteksto.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: ang mga lipi ni Ruben at ni Gad
  rationale: Bagaman isahan ang anyong gentiliko sa Hebreo, kolektibo ang gamit nito para sa dalawang lipi; malinaw at natural ito sa modernong Tagalog.
- source_word: לָקְחוּ
  choice: tinanggap
  rationale: Maaaring mangahulugang ‘kumuha’ o ‘tumanggap’; sa konteksto ng manang ipinagkaloob ni Moises, mas natural ang ‘tinanggap’ nang hindi binabago ang diwa.
- source_word: נַחֲלָתָם
  choice: kanilang mana
  rationale: Ang נַחֲלָה ay tumutukoy sa lupaing minana o itinakdang bahagi; ang ‘mana’ ay maikli at pinananatili ang mahalagang diwang tipan at pagmamana.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: sa silangan ng Ilog Jordan
  rationale: Tahasang nililinaw ng מִזְרָחָה na ang tinutukoy na kabilang ibayo ng Jordan ay ang silangang panig; natural ito sa Tagalog.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Pinananatili nito ang paghahambing o pagpapatibay na nasa Hebreo, pati ang kapansin-pansing pag-uulit ng pagkakaloob ni Moises.
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Ang ‘lingkod’ ay natural na pantawag na pandangal kay Moises, at ang banal na pangalan ay isinasatitik bilang ‘Yahweh’ sa halip na palitan ng titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ng Diyos ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong ‘Yahweh’ nang hindi pinapalitan ng isang titulo.
- issue: Pag-uulit ng pagkakaloob ni Moises
  choice: Pinanatili ang ‘na ibinigay... gaya ng ibinigay...’
  alternative: Paikliin sa iisang pagbanggit upang iwasan ang pag-uulit
  rationale: Naroon mismo sa Hebreo ang pag-uulit. Hindi ito pinakinis nang labis upang hindi mawala ang diin o estruktura ng pinagmulang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘mga lipi ni Ruben at ni Gad’ upang maipahayag ang kolektibong gentiliko, at ‘Ilog Jordan’ para sa agarang linaw. Pinanatili ang pag-uulit ng Hebreo sa halip na tahimik na paikliin ito.
