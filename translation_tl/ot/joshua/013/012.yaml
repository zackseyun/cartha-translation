  text: כָּל מַמְלְכ֥וּת עוֹג֙ בַּ/בָּשָׁ֔ן אֲשֶׁר מָלַ֥ךְ בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶ֑עִי ה֤וּא נִשְׁאַר֙ מִ/יֶּ֣תֶר הָ/רְפָאִ֔ים וַ/יַּכֵּ֥/ם מֹשֶׁ֖ה וַ/יֹּרִשֵֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: tl
  text: Ang buong kaharian ni Og sa Bashan, na naghari sa Ashtarot at Edrei; isa siya sa mga natira sa mga Refaim[a]. Pinabagsak sila ni Moises at inalisan sila ng kanilang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga higante.” Sa Hebreo, “mga Refaim,” malamang na pangalan ng isang sinaunang pangkat ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: ang buong kaharian ni Og sa Bashan
  rationale: Ang כָּל kasama ng isahang מַמְלְכוּת ay tumutukoy sa kabuuan ng nasasakupan ni Og; natural sa Tagalog ang “buong kaharian.” Pinananatili ng “sa Bashan” ang lokatibong diwa ng בְּ.
- source_word: אֲשֶׁר מָלַךְ בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: na naghari sa Ashtarot at Edrei
  rationale: Ang “naghari” ay nagpapanatili sa maharlikang diwa ng מלך. Ginamit ang mga transliterasyong Ashtarot at Edrei bilang mga pangalan ng lugar.
- source_word: הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים
  choice: Siya ay natira sa nalalabing mga Refaim
  rationale: Pinananatili ng “natira” ang Nifal na diwa ng pagiging kabilang sa mga nanatili, nang hindi idinaragdag na siya lamang ang natira. Ang “Refaim” ay pinanatiling pangalan ng sinaunang pangkat sa halip na ipakahulugang “mga higante.”
- source_word: וַיַּכֵּם מֹשֶׁה
  choice: Pinabagsak sila ni Moises
  rationale: Ipinahahayag ng “pinabagsak” ang malakas at pangmilitar na diwa ng נכה at pinananatili ang maramihang layon ng hulaping -ם.
- source_word: וַיֹּרִשֵׁם
  choice: at inagawan ng lupain
  rationale: Sa konteksto ng pananakop, ang Hifil ng ירשׁ ay tumutukoy sa pag-aalis sa pagmamay-ari o sakop ng isang pangkat. Ang parirala ay likas sa Tagalog at mas tiyak kaysa sa payak na “pinalayas.”
theological_decisions:
- issue: Pagpapakahulugan sa רְפָאִים
  choice: mga Refaim
  alternative: mga higante
  rationale: Maaaring pangalan ito ng isang sinaunang pangkat, kaya hindi ito tahasang isinalin bilang “mga higante.” Pinananatili ng transliterasyon ang pagkakaugnay ng katawagan sa iba pang talata at iniiwasang magtakda ng isang pinagtatalunang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang ayos na “Siya” at ang kasunod na maramihang “sila” upang maipakita ang tunay na paglipat sa Hebreo mula kay Og tungo sa pangkat na kanyang kinakatawan.
