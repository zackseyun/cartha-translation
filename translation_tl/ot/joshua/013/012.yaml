  verdict: revise
  source_fidelity: Maayos ang pangunahing pagtutumbas ng mga pangalan at ng saklaw ng kaharian. Gayunman, ang “inagawan ng lupain” ay walang hayag na layon at hindi malinaw na isinasabi na ang mga tinutukoy ang inalisan ng pag-aari. Ang “inalisan sila ng kanilang lupain” ay mas tapat sa Hifil ng ירשׁ sa kontekstong ito.
  naturalness: Mas natural at malinaw sa modernong Tagalog ang pag-uugnay sa sugnay tungkol kay Og sa pamamagitan ng tuldok-kuwit at ang paggamit ng “isa siya sa mga natira sa mga Refaim.” Iniiwasan nito ang medyo malabong “natira sa nalalabing mga Refaim.”
  terminology: Pinanatili ang Og, Bashan, Ashtarot, Edrei, at Refaim. Ang “mga Refaim” ay wastong pinananatiling pangalan ng pangkat; ang alternatibong “mga higante” ay nananatili lamang sa talababa.
  issues:
  - severity: medium
    issue: Hindi ganap ang layon ng “inagawan ng lupain.”
    rationale: Ang Hebreong וַיֹּרִשֵׁם ay may maramihang layon (“sila”). Kailangang malinaw sa Tagalog na sila ang inalisan ng lupain o pag-aari.
  - severity: low
    issue: Medyo malabo ang “Siya ay natira sa nalalabing mga Refaim.”
    rationale: Maaaring basahin na lokatibo ang “sa.” Ang “isa siya sa mga natira sa mga Refaim” ay natural na nagpapahayag na si Og ay kabilang sa natirang pangkat nang hindi idinaragdag na siya lamang ang natira.
  revised_text: Ang buong kaharian ni Og sa Bashan, na naghari sa Ashtarot at Edrei; isa siya sa mga natira sa mga Refaim[a]. Pinabagsak sila ni Moises at inalisan sila ng kanilang lupain.
