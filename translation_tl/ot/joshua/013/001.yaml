base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: tl
  text: Matanda na si Josue at may-edad na. Sinabi sa kanya ni Yahweh, “Matanda ka na at may-edad na, at napakarami pang lupain ang natitira upang angkinin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “manahin ito.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkuha at pagtataglay ng lupain bilang mana.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: matanda na
  rationale: Likas at tuwirang paglalarawan ito sa kalagayan ni Josue; ipinahihiwatig ng “na” na umabot na siya sa katandaan nang hindi nagdaragdag ng diwa na wala sa Hebreo.
- source_word: בָּא בַּיָּמִים
  choice: may-edad na
  rationale: Idyoma itong literal na “nakarating sa mga araw” at tumutukoy sa pagiging lubhang matanda. Ang “may-edad na” ay malinaw at likas sa makabagong Filipino, at pinananatili ang pag-uulit kasunod ng “matanda na.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Ang “lupain” ay angkop sa heograpiko at tipanang diwa ng salita sa aklat ni Josue, at mas likas dito kaysa sa “bansa” o “teritoryo.”
- source_word: נִשְׁאֲרָה הַרְבֵּה מְאֹד
  choice: napakarami pang lupain ang natitira
  rationale: Pinagsasama ng “napakarami” ang dobleng pagpapatindi sa Hebreo, samantalang ipinapahayag ng “pang” at “natitira” na marami pa ang hindi nasasakop.
- source_word: לְרִשְׁתָּהּ
  choice: angkinin
  rationale: Sa konteksto, tumutukoy ito sa pagkuha at pagtataglay ng lupain. Maikli at natural ang “angkinin,” habang inilalahad sa talababa ang kaugnay na diwa ng pagtanggap bilang mana.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang tuwirang ginamit sa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng ירשׁ kaugnay ng lupang ipinangako
  choice: angkinin
  alternative: manahin
  rationale: Hindi nililimitahan ng pangunahing salin ang pandiwa sa mana lamang, sapagkat maaari rin itong tumukoy sa aktuwal na pagkuha at pagtataglay sa lupain. Pinananatili sa talababa ang tunay na alternatibong “manahin.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang daloy, ngunit pinanatili ang sinadyang pag-uulit ng paglalarawan sa edad ni Josue. Ginamit ang “ngunit” upang ihayag ang kontrast na likas sa magkatabing kalagayan—matanda na si Josue, samantalang marami pang lupa ang natitira—nang hindi nilulutas ang tensiyon ng talata.
