  yaml_path: translation/ot/joshua/013/024.yaml
  text: And Moses gave to the tribe of Gad[a], to the sons of Gad, according to their clans.
translation:
  language: tl
  text: Nagbigay si Moises sa lipi ni Gad—sa mga anak ni Gad[a]—ayon sa kani-kanilang angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga inapo ni Gad.” Literal sa Hebreo ang “mga anak na lalaki ni Gad,” isang karaniwang pananalita tungkol sa lahi o lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Nagbigay
  rationale: Tuwirang ipinapahayag ang ginawa ni Moises sa konteksto ng paghahati ng lupain, habang iniiwang di-binanggit ang bagay na ibinigay gaya sa Hebreo.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang Hebreo sa makabagong saling Tagalog.
- source_word: לְמַטֵּה
  choice: sa lipi ni
  rationale: Sa konteksto ng talaangkanan at paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod.
- source_word: גָד
  choice: Gad
  rationale: Karaniwang transliterasyon ng pangalan ng tao at ng liping nagmula sa kaniya.
- source_word: לִבְנֵי
  choice: sa mga anak ni
  rationale: Pinananatili ang kongkretong pananalitang talaangkanan ng Hebreo; sa ganitong pormula maaari rin itong tumukoy sa mga inapo o kasapi ng lipi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinahahayag nito ang pamamahagi batay sa bawat pangkat ng magkakamag-anak sa loob ng lipi; nililinaw ng “kani-kanilang” ang distributibong diwa.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “lipi” para sa mas malawak na tribo at “angkan” para sa mga pangkat ng magkakamag-anak sa loob nito. Pinanatiling di-binanggit ang bagay na ibinigay, gaya ng nasa tekstong Hebreo.
