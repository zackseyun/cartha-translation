  source_fidelity: 'Tumpak ang salin sa Hebreo: naipapakita ang pagkokontrast sa ibang pamamahagi, ang hindi pagbibigay ni Moises ng mana sa lipi ni Levi, at ang pahayag na si Yahweh, ang Diyos ng Israel, mismo ang kanilang mana. Ang “gaya ng sinabi niya sa kanila” ay maingat na katumbas ng כַּאֲשֶׁר דִּבֶּר לָהֶם at hindi nagdaragdag ng kahulugang “ipinangako.”'
