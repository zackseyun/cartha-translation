id: JOS.13.33
reference: Joshua 13:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: tl
  text: Ngunit sa lipi ni Levi ay walang ibinigay na mana si Moises. Si Yahweh, ang Diyos ng Israel, ang kanilang mana, gaya ng sinabi niya sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  choice: Ngunit sa lipi ni Levi
  rationale: Ipinahihiwatig ng וּ ang pagsalungat sa naunang mga pamamahagi ng lupain; natural sa makabagong Tagalog ang “Ngunit sa,” at ang “lipi ni Levi” ay tumutukoy sa buong tribo.
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  choice: ay walang ibinigay na mana si Moises
  rationale: Pinananatili nito ang payak na nagdaang kilos at malinaw na pagtanggi. Ang “mana” ay likas na katumbas ng נַחֲלָה at nag-iingat sa kahulugang tipan at pamamahagi ng lupain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Natural at tuwirang salin ng pariralang construct, habang pinananatili ang pagkakakilanlang kaugnay ng tipan.
- source_word: הוּא נַחֲלָתָם
  choice: ang kanilang mana
  rationale: Ang tahasang panghalip na הוּא ay may diin; sa Tagalog, ang hulma na “Si Yahweh ... ang kanilang mana” ay likas at malinaw na nagpapanatili sa predikasyon.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: gaya ng sinabi niya sa kanila
  rationale: Ang דבר ay nangangahulugang magsalita o magsabi. Hindi pinalalakas ang kahulugan tungo sa “ipinangako,” kaya nananatiling malapit sa Hebreo.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ang personal na pangalan sa halip na palitan ng titulo.
- issue: Ang kalikasan ng mana ng lipi ni Levi
  choice: Si Yahweh mismo ang kanilang mana
  alternative: Si Yahweh ang kanilang bahagi
  rationale: Tahasang ipinapantay ng teksto si Yahweh sa mana ng lipi ni Levi. Pinananatili ang metapora at teolohikal na tensiyon sa halip na ipaliwanag ito bilang mga pribilehiyong pangpari lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mana” sa dalawang paglitaw ng נַחֲלָה upang mapanatili ang leksikal at teolohikal na ugnayan. Walang talababa dahil ang “bahagi” ay posibleng alternatibo ngunit hindi kailangang ilahad upang maunawaan ang talata.
