  register: Modernong Filipino na malinaw at marangal. Pinanatili ang mga pangalan bilang mga transliteradong toponimo, gumamit ng em dash bago ang pangwakas na bilang, at inilagay ang talababa upang mapanatili ang tekstuwal at sintaktikong tensiyon tungkol sa bilang ng mga pangalan.
