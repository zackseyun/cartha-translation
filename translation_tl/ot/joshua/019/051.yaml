  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/נְּחָלֹ֡ת אֲשֶׁ֣ר נִחֲל֣וּ אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וִ/יהוֹשֻׁ֪עַ בִּן נ֟וּן וְ/רָאשֵׁ֣י הָֽ/אָב֣וֹת לְ/מַטּוֹת֩ בְּנֵי יִשְׂרָאֵ֨ל בְּ/גוֹרָ֤ל בְּ/שִׁלֹה֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יְכַלּ֕וּ מֵֽ/חַלֵּ֖ק אֶת הָ/אָֽרֶץ׀־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: tl
  text: Ito ang mga mana na ipinamahagi sa pamamagitan ng palabunutan sa Shilo nina Eleazar na pari, Josue na anak ni Nun, at ng mga pinuno ng mga angkan ng mga lipi ng mga anak ni Israel[a], sa harap ni Yahweh, sa pasukan ng Tolda ng Tagpuan. Sa gayon, natapos nilang hatiin ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “mga anak ni Israel”; ang ekspresyon ay kolektibong tumutukoy sa sambayanan ng Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: mga mana
  rationale: Pinananatili ng “mga mana” ang legal at tipanang diwa ng mga lupaing inilaan bilang minanang pag-aari ng bawat lipi.
- source_word: נִחֲלוּ
  choice: ipinamahagi
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pamamahagi o paglalaan ng mga mana; likas sa Filipino ang “ipinamahagi” kasama ng “sa pamamagitan ng palabunutan.”
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Ang parirala ay tumutukoy sa mga pinuno ng mga sambahayan o angkang nagmula sa mga ninuno; malinaw at natural ang “mga pinuno ng mga angkan” sa modernong Filipino.
- source_word: לְמַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: ng mga lipi ng mga anak ni Israel
  rationale: Isinasalin ang מַטּוֹת bilang “mga lipi” at pinananatili ang kongkretong ekspresyong Hebreo na “mga anak ni Israel,” habang nililinaw sa talababa ang kolektibong kahulugan nito.
- source_word: בְּגוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Malinaw na ipinahihiwatig nito ang paraan ng paglalaan ng lupain sa pamamagitan ng sapalarang banal na pasiya, nang hindi dinaragdagan ang teksto.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang ideya ng pagkilos sa presensiya ng Diyos at tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng Tolda ng Tagpuan
  rationale: Ang “pasukan” ay natural na katumbas ng פֶּתַח, at ang “Tolda ng Tagpuan” ay malinaw na nagsasaad ng itinakdang lugar ng pakikipagtagpo nang hindi ipinagkakamali ang מוֹעֵד sa salitang “tipan.”
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: Sa gayon, natapos nilang hatiin ang lupain
  rationale: Ipinapahayag ng “Sa gayon” ang pagsulong at kinalabasan ng salaysay; tuwiran at natural namang isinasalin ng kasunod na parirala ang pagtatapos ng paghahati sa lupain.
theological_decisions:
- issue: Paglilipat sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Kolektibong ekspresyong בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: sambayanan ng Israel / mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang anyong pangkamag-anakang nasa Hebreo, ngunit ipinapaliwanag sa talababa na kolektibo itong tumutukoy sa sambayanan ng Israel.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “mga mana” at “mga anak ni Israel” upang hindi mawala ang legal, pampamilya, at tipanang himig ng Hebreo; ginamit ang mas likas na “mga pinuno ng mga angkan” sa halip na literal ngunit asiwa sa Filipino na “mga pinuno ng mga sambahayan ng mga ama.”
