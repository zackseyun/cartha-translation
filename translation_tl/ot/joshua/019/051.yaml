  source_fidelity: 'Tapat ang salin sa pangunahing mga sangkap ng Hebreo: ang mga mana/lupang minana, ang paglalaan sa pamamagitan ng palabunutan, ang mga nangangasiwa, ang Shilo, ang pagkilos sa harap ni Yahweh sa pasukan ng Tolda ng Tagpuan, at ang pagtatapos ng paghahati ng lupain. Ang ''mga pinuno ng mga angkan'' ay angkop na modernong katumbas ng mga pinuno ng mga sambahayan/angkan ng mga ama.'
