lexical_decisions:
- source_word: עֶבְרֹן
  choice: Ebron
  rationale: Tuwirang tinumbasan bilang pangalan ng lugar ayon sa anyong katinig ng tekstong Masoretiko; ang ibang tradisyong tekstuwal ay may “Abdon,” kaya inilagay ang variant sa talababa.
- source_word: רְחֹב
  choice: Rehob
  rationale: Transliterasyong madaling basahin sa modernong Filipino at malapit sa pangalang Hebreo.
- source_word: חַמּוֹן
  choice: Hammon
  rationale: Pinanatili bilang transliteradong pangalan ng lugar; ang dobleng m ay kumakatawan sa mariing katinig sa Hebreo.
- source_word: קָנָה
  choice: Kana
  rationale: Ginamit ang natural na transliterasyong Filipino; hindi na isinama ang h sa hulihan sapagkat ang pangwakas na ה ay hindi binibigkas dito.
- source_word: עַד
  choice: hanggang sa
  rationale: Malinaw na ipinahahayag ang hangganan o lawak ng nasasakupan.
- source_word: צִידוֹן רַבָּה
  choice: Dakilang Sidon
  rationale: Pinananatili ang pang-uring רַבָּה bilang paglalarawan sa tanyag o pangunahing lungsod ng Sidon.
