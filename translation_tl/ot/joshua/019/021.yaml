  text: Remeth[a], En-gannim, En-haddah, and Beth-pazzez.
translation:
  language: tl
  text: Remet[a], En-ganim, En-hada, at Bet-pazez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mga pangalang Hebreo ng mga lugar ang mga ito. Ang “En-ganim” ay malamang na nangangahulugang “bukal ng mga hardin,” ang “En-hada” ay nagsisimula sa salitang “bukal,” at ang “Bet-pazez” ay nagsisimula sa “bahay ng.” Isinatinig ang mga ito sa pangunahing teksto dahil ginagamit dito bilang mga pangalan ng bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶמֶת
  choice: Remet
  rationale: Pangalan ng isang bayan sa talaan; tinumbasan sa baybay na malapit sa Hebreo sa halip na isalin ang pangalan.
- source_word: עֵין גַּנִּים
  choice: En-ganim
  rationale: Tambalang pangalan ng lugar mula sa עֵין ('bukal') at גַּנִּים ('mga hardin'). Isinatinig bilang pangalan ng bayan; ginamit ang gitling upang luminaw ang mga bahagi nito.
- source_word: עֵין חַדָּה
  choice: En-hada
  rationale: Pangalan ng lugar na nagsisimula sa עֵין ('bukal'). Hindi tiyak ang wastong semantikong pagbasa sa ikalawang bahagi, kaya pinanatili ang buong pangalan sa transliterasyon.
- source_word: בֵית פַּצֵּץ
  choice: Bet-pazez
  rationale: Tambalang pangalan ng lugar na nagsisimula sa בֵית ('bahay ng'). Dahil pangalan ito ng bayan, transliterasyon ang ginamit sa pangunahing teksto.
- source_word: וְ
  choice: at
  rationale: Ang paulit-ulit na pang-ugnay ay likas na ipinahayag sa Filipino sa pamamagitan ng mga kuwit at ng 'at' bago ang huling pangalan.
