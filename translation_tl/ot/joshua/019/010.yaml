base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: tl
  text: Ang ikatlong bunot ay lumabas[a] para sa mga anak ni Zebulun, ayon sa kanilang mga angkan, at ang hangganan ng kanilang mana ay umabot hanggang Sarid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay nabunot.” Literal sa Hebreo, “umakyat” o “lumabas” ang bunot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ay napunta
  rationale: Sa konteksto ng palabunutan, likas sa Tagalog ang “napunta” upang ipahayag kung kanino tumama ang ikatlong bunot. Hindi nito mekanikal na ginagaya ang literal na “umakyat,” ngunit pinananatili sa talababa ang larawan at alternatibong pagbasa ng Hebreo.
- source_word: הַגּוֹרָל הַשְּׁלִישִׁי
  choice: ang ikatlong palabunutan
  rationale: Ang גּוֹרָל ay ang bunot na ginamit sa pagtatalaga ng lupa. Ang “palabunutan” ay malinaw at karaniwang salitang Filipino para sa paraang ito, samantalang ang “kapalaran” ay maaaring magpahiwatig ng tadhanang hindi tahasang nasa konteksto.
- source_word: לִבְנֵי זְבוּלֻן
  choice: sa mga anak ni Zebulun
  rationale: Pinananatili ang literal at pantribong katawagang “mga anak ni Zebulun,” na tumutukoy sa kaniyang mga inapo bilang isang lipi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa paghahati ng lupa sa Israel, ang מִשְׁפָּחָה ay tumutukoy sa mga angkan o pangkat-pamilya sa loob ng lipi; ipinahahayag ng “ayon sa” ang pamamahaging batay sa mga angkang iyon.
- source_word: גְּבוּל נַחֲלָתָם
  choice: ang hangganan ng kanilang mana
  rationale: Ang גְּבוּל ay hangganan ng lupain, at ang נַחֲלָה ay lupang minana o itinalaga sa lipi. Ang “mana” ay maikli, natural, at nagpapanatili sa diwa ng minanang bahagi.
- source_word: עַד שָׂרִיד
  choice: umabot hanggang Sarid
  rationale: Ang עַד ay nagtatakda ng lawak ng hangganan; natural sa paglalarawang heograpiko ang “umabot hanggang.” Ang Sarid ay pinanatiling pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Pinanatili ang pantribong “mga anak ni Zebulun,” ginamit ang “angkan” para sa panloob na mga pangkat ng lipi, at iniwasan ang “kapalaran” upang hindi magdagdag ng diwa ng tadhana.
