- source_word: עֵין חָצוֹר
  choice: En-hazor
  rationale: Tambalang pangalan ng lugar. Bagaman maaaring mangahulugan ang עֵין na “bukal,” ang gamit dito sa talaan ng mga bayan ay onomastiko, kaya pinanatili bilang transliterasyon.
- source_word: וְ
  choice: at
  rationale: Pinanatili ang paulit-ulit na pang-ugnay ng Hebrew upang maipakita ang ayos ng listahan.
