lexical_decisions:
- source_word: וְ
  choice: at
  rationale: Inulit ang pangatnig na “at” bago ang bawat pangalan upang mapanatili ang anyo at indayog ng listahan sa Hebreo.
- source_word: שַׁעֲלַבִּין
  choice: Shaalabin
  rationale: Pangalan ito ng lugar. Ang “Shaalabin” ay transliterasyong angkop sa makabagong Filipino at malapit sa anyong katinig at pagbigkas ng Hebreo sa talatang ito.
- source_word: אַיָּלוֹן
  choice: Ayalon
  rationale: Pangalan ito ng lugar. Ang “Ayalon” ay tuwirang transliterasyon na natural basahin sa Filipino at mas malinaw na kumakatawan sa tunog ng Hebreo kaysa sa tradisyonal na Ingles na “Aijalon.”
- source_word: יִתְלָה
  choice: Itla
  rationale: Pangalan ito ng lugar. Ang “Itla” ay payak na transliterasyon ng anyong Hebreo; hindi idinagdag ang tradisyonal na paunang J na nagmula sa mas matatandang kombensiyon sa Ingles.
