    issue: Ang “Umabot ito” ay hindi gaanong tiyak para sa פגע sa hangganang-teritoryal na konteksto.
    rationale: Ang pandiwa ay nagsasaad ng pagdating o pakikipag-ugnayan ng guhit ng hangganan sa ibang teritoryo. Ang “sumapit” ay natural at hindi nagdaragdag ng interpretasyong higit sa teksto.
