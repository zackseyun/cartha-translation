  to: Pagkatapos, lumiko ang hangganan pakanluran patungo sa Aznot-tabor. Mula roon ay tumuloy ito sa Hukok. Sumapit ito sa Zebulun sa timog, sa Aser sa kanluran, at sa Juda, sa Jordan, sa silangan, kung saan sumisikat ang araw.[a]
