base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: tl
  text: Pagkatapos, lumiko ang hangganan pakanluran patungo sa Aznot-tabor. Mula roon ay tumuloy ito sa Hukok. Sumapit ito sa Zebulun sa timog, sa Aser sa kanluran, at sa Juda, sa Jordan, sa silangan, kung saan sumisikat ang araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at sa Juda, ang Jordan, sa silangan [ng] araw.” Mahirap ipaliwanag ang heograpiya sapagkat, ayon sa karaniwang pagkaunawa, hindi tuwirang karatig ng Naftali ang teritoryo ng lipi ni Juda. Iba ang pagkaunawa ng ilan sa mga salitang ito, at iniisip naman ng iba na maaaring may suliranin sa tekstong naipasa; ngunit isinalin dito ang tekstong Hebreo ayon sa pagkakasulat nito.
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: Pagkatapos, lumiko ... ang hangganan
  rationale: Sa mga paglalarawan ng hangganan, ang שׁוב ay karaniwang tumutukoy sa pagbabago ng direksiyon. Natural sa Filipino ang “lumiko,” habang ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod.
- source_word: יָמָּה
  choice: pakanluran
  rationale: Literal itong tumutukoy sa direksiyon ng dagat, ngunit kanluran ang heograpikong diwa sa kontekstong ito.
- source_word: אַזְנוֹת תָּבוֹר
  choice: Aznot-tabor
  rationale: Pangalan ito ng lugar kaya tinumbasan sa anyong transliterado at madaling basahin sa Filipino.
- source_word: וְיָצָא מִשָּׁם
  choice: Mula roon ay tumuloy ito
  rationale: Sa pormula ng mga hangganan, ang יצא ay nagsasaad na nagpapatuloy ang guhit mula sa isang punto; mas natural sa Filipino ang “tumuloy” kaysa literal na “lumabas.”
- source_word: חוּקֹקָה
  choice: Hukok
  rationale: Transliterasyon ng pangalan ng lugar sa anyong angkop sa baybay-Filipino.
- source_word: וּפָגַע
  choice: Umabot ito
  rationale: Sa konteksto ng teritoryo, ang פגע ay nangangahulugang sumapit o dumikit ang hangganan sa isa pang teritoryo o palatandaan.
- source_word: בִּזְבֻלוּן מִנֶּגֶב
  choice: sa Zebulun sa timog
  rationale: Pinananatili nito ang Zebulun bilang katabing teritoryo sa bahaging timog ng hangganan.
- source_word: וּבְאָשֵׁר פָּגַע מִיָּם
  choice: sa Aser sa kanluran
  rationale: Ang מִיָּם ay literal na may kaugnayan sa dagat ngunit tumutukoy rito sa kanlurang panig. “Aser” ang malinaw na anyong Filipino ng pangalan.
- source_word: וּבִיהוּדָה הַיַּרְדֵּן
  choice: at sa Juda sa Jordan
  rationale: Pinananatili ang mahirap na pagkakasunod ng mga pangalan sa tekstong Masoretiko sa halip na baguhin o ipaliwanag ito sa mismong talata.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: sa dakong silangan na sinisikatan ng araw
  rationale: Pinagsasama nito ang malinaw na direksiyong “silangan” at ang kongkretong larawan ng Hebreo na “sinisikatan ng araw.”
theological_decisions:
- issue: Ang heograpikong mahirap na pariralang tumutukoy sa Juda sa Jordan sa silangan
  choice: Pinanatili sa pangunahing teksto ang pagkakasabi ng tekstong Masoretiko nang hindi itinutuwid o pinapakinis ang heograpiya.
  alternative: Ituring ang “Juda” bilang pagkakamali ng tagakopya, ipakahulugan itong di-tuwirang pagtukoy sa mga pamayanan sa silangan ng Jordan, o alisin ang tila direktang hangganan sa Juda.
  rationale: Bagaman hindi ito usaping doktrinal, mahalaga ang katapatan sa tunay na tekstuwal at heograpikong tensiyon. Hindi dapat lutasin sa salin ang isang suliraning hindi tiyak ang sagot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling pangungusap upang madaling masundan ang paglalarawan ng hangganan, habang pinanatili sa huling sugnay ang tunay na heograpikong hirap ng Hebreo. Inilagay ang talababa sa mismong mahirap na parirala, hindi sa pangalang Aznot-tabor.
