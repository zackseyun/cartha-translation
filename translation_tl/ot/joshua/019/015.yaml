base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: tl
  text: at ang Kattat, Nahalal, Shimron, Idala, at Betlehem[a]—labindalawang lungsod at kanilang mga nayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Betlehem dito ay pangalan ng lugar, hindi pagsasalin ng pariralang nangangahulugang “bahay ng tinapay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: Kattat
  rationale: Pangalan ng lugar; tinumbasan sa baybay na madaling basahin sa Filipino habang pinananatili ang huling katinig ng Hebreo.
- source_word: נַהֲלָל
  choice: Nahalal
  rationale: Pangalan ng lugar; tuwirang transliterasyon na natural basahin sa Filipino.
- source_word: שִׁמְרוֹן
  choice: Shimron
  rationale: Pangalan ng lugar; pinanatili ang karaniwang anyong transliterado.
- source_word: יִדְאֲלָה
  choice: Idala
  rationale: Pangalan ng lugar; ang paunang yod ay kinatawan ng I, at hindi na isinama ang English-style na h sa hulihan.
- source_word: בֵית לָחֶם
  choice: Betlehem
  rationale: Kilalang pangalang pantangi sa Filipino; hindi isinalin bilang literal na ‘bahay ng tinapay.’
- source_word: עָרִים
  choice: mga lungsod
  rationale: Karaniwang salin ng עִיר sa mga talaan ng teritoryo at angkop sa mga pamayanang binabanggit.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: labindalawa
  rationale: Likas na anyong Filipino ng bilang na tumutukoy sa mga lungsod.
- source_word: חַצְרֵיהֶן
  choice: mga nayon ng mga ito
  rationale: Tumutukoy sa mga nakaugnay o nasasakupang pamayanan; mas malinaw kaysa sa maaaring ipakahulugang pag-aari ng mga lungsod ang ‘kanilang mga nayon.’
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang panimulang ‘at’ dahil bahagi ang talata ng nagpapatuloy na talaan. Ginamit ang mga anyong pangalan na madaling bigkasin sa Filipino.
