  verdict: revise
  source_fidelity: Tumpak ang pangkalahatang daloy ng hangganan at ang mga pangalan ng lugar. Gayunman, ang "Nagpatuloy ito" para sa וְיָצָא ay masyadong pangkalahatan at hindi naipapakita ang kongkretong paglabas/pag-abot ng hangganan tungo sa Daberat.
  naturalness: Natural at malinaw ang karamihan ng draft. Mas idiomatiko at mas malinaw sa modernong Filipino ang "sa silangan, patungo sa pagsikat ng araw" kaysa "pasilangan, patungo sa sikatan ng araw."
  terminology: Ang "hangganan," "Sarid," "Kislot-tabor," "Daberat," at "Jafia" ay angkop. Pinananatili ng rebisyon ang heograpikong pandiwang "umaahon" para sa עלה.
