  - severity: low
    issue: Hindi gaanong likas ang “sikatan ng araw” sa pariralang direksiyonal.
    rationale: Ang “pagsikat ng araw” ang mas karaniwang Filipino para sa imaheng Hebreo ng pagsikat ng araw at mas mahusay na tumutugma sa talababa.
