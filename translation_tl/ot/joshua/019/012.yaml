base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: tl
  text: Pagkatapos, mula sa Sarid ay lumiko ang hangganan sa silangan[a], patungo sa pagsikat ng araw, hanggang sa hangganan ng Kislot-tabor. Lumabas ito patungo sa Daberat at umahon patungong Jafia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa silangan, patungo sa silangan”; literal, “sa silangan, pagsikat ng araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: Pagkatapos ... ay lumiko ang hangganan
  rationale: Sa paglalarawan ng mga hangganan, ang pandiwang שוב ay tumutukoy sa pagbabago ng direksiyon. Nilinaw ang ipinahihiwatig na paksa na 'hangganan' upang maging natural sa Tagalog.
- source_word: מִשָּׂרִיד
  choice: mula sa Sarid
  rationale: Pangalan ng lugar; pinanatili sa transliterasyon, at isinalin ang מן bilang 'mula sa'.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: pasilangan, patungo sa sikatan ng araw
  rationale: Pinananatili ang dalawang magkaugnay na pahayag ng direksiyon at ang larawan ng pagsikat ng araw sa Hebreo.
- source_word: עַל גְּבוּל
  choice: hanggang sa hangganan ng
  rationale: Sa konteksto ng pagguhit ng teritoryo, ipinahihiwatig ng parirala ang pag-abot ng linya sa hangganan ng isang lugar.
- source_word: כִּסְלֹת תָּבֹר
  choice: Kislot-tabor
  rationale: Transliterasyon ng tambalang pangalan ng lugar, na may gitling upang ipakitang iisang toponimo.
- source_word: וְיָצָא
  choice: Nagpatuloy ito
  rationale: Sa mga paglalarawan ng hangganan, ang יצא ay maaaring tumukoy sa paglabas o pagpapatuloy ng linya. Ang 'nagpatuloy' ay natural sa Tagalog at hindi nagpapasok ng tiyak na topograpikong detalye.
- source_word: אֶל הַדָּבְרַת
  choice: sa Daberat
  rationale: Transliterasyon ng pangalan ng lugar; hindi isinama ang artikulong Hebreo dahil hindi ito natural bago ang pangalang pantangi sa Tagalog.
- source_word: וְעָלָה
  choice: umahon patungong
  rationale: Pinananatili ang topograpikong diwa ng עלה bilang pag-akyat sa mas mataas na lugar.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: Transliterasyon ng pangalan ng lugar na angkop sa makabagong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'hangganan' bilang ipinahihiwatig na paksa upang madaling masundan ang heograpikong paglalarawan, habang pinanatili sa talababa ang pag-uulit at literal na larawan ng pariralang Hebreo.
