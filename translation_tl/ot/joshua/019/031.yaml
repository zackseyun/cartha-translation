  yaml_path: translation/ot/joshua/019/031.yaml
  text: This was the inheritance of the tribe of the sons of Asher according to their clans—these cities and their settlements[a][b].
translation:
  language: tl
  text: Ito ang mana ng lipi ng mga anak ni Asher ayon sa kani-kanilang angkan—ang mga lunsod na ito at ang mga pamayanan ng mga ito.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ito ang naging mana ...” Walang tahasang pandiwa ang nominal na pangungusap sa Hebreo; ang “Ito ang” ay mas pormal, samantalang maaaring gamitin ang panahunang nagdaan bilang buod ng salaysay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang mga nayon ng mga ito.” Tumutukoy ang Hebreo sa mga nakaugnay na pamayanang rural na nasa ilalim ng mga nakalistang lunsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Ito ang
  rationale: Ang pambabaeng isahang demonstratibo ay tumutukoy sa manang kababanggit lamang. Ang nominal na pangungusap sa Hebreo ay walang tahasang pandiwa; natural sa Filipino ang “Ito ang,” na hindi kailangang magtakda ng panahunan.
- source_word: נַחֲלַת
  choice: mana
  rationale: Sa konteksto ng paghahati ng lupain sa Josue, tumutukoy ito sa bahaging lupaing minana; pinananatili ng “mana” ang pampamilya at pangtipang diwa.
- source_word: מַטֵּה
  choice: lipi
  rationale: Dito ay katawagan ito sa malaking pangkat panlipi, hindi sa literal na tungkod. Ang “lipi” ang karaniwan at natural na salin sa Filipino.
- source_word: בְנֵי אָשֵׁר
  choice: mga anak ni Asher
  rationale: Pinananatili nito ang literal na pananalitang pampamilya ng Hebreo para sa pagkakakilanlan ng lipi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה ay mga angkang bumubuo sa lipi, at ipinahihiwatig ng parirala ang pamamahagi ayon sa mga ito. Nililinaw ng “kani-kanilang” ang distributibong diwa.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ang mga lunsod na ito
  rationale: Karaniwang tumutukoy ang עָרִים sa mga sentrong tinitirhan. Ang “lunsod” ay marangal at nakasanayang terminong biblikal, kahit maaaring maliit ang ilan ayon sa makabagong pamantayan.
- source_word: וְחַצְרֵיהֶן
  choice: at ang mga pamayanan ng mga iyon
  rationale: Ang חָצֵר ay tumutukoy rito sa mga nakaugnay at karaniwang di-napapaderang pamayanang nasa ilalim ng mga lunsod. Mas malawak at mas eksakto ang “pamayanan” kaysa “nayon.”
