base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/040.yaml
  text: For the tribe of the sons of Dan, according to their clans, the seventh lot came out.
translation:
  language: tl
  text: Para sa lipi ng mga anak ni Dan, ayon sa kani-kanilang mga angkan, ang ikapitong kapalaran ay lumabas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: Para sa lipi
  rationale: Sa konteksto ng paghahati ng lupain sa Josue, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod; likas na ipinahahayag ng “para sa” ang pagtatalaga.
- source_word: בְנֵי דָן
  choice: mga anak ni Dan
  rationale: Pinananatili nito ang tahasang katawagang pampag-anak sa Hebreo habang malinaw at natural sa modernong Tagalog.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחוֹת ay mga sangay na angkan sa loob ng lipi; nililinaw ng “kani-kanilang” ang pangmaramihang hulaping tumutukoy sa kanila.
- source_word: יָצָא
  choice: lumabas
  rationale: Malapit ito sa literal na kahulugan ng pandiwa at angkop sa kinalabasan ng palabunutan.
- source_word: הַגּוֹרָל
  choice: ang palabunutan
  rationale: Sa konteksto, ang גוֹרָל ay tumutukoy sa lot na ginamit upang italaga ang bahagi ng lupain; “palabunutan” ang karaniwang salitang Tagalog na madaling maunawaan.
- source_word: הַשְּׁבִיעִי
  choice: ikapitong
  rationale: Tuwirang isinasalin ang bilang na panunuran at inilalarawan ang pagkakasunod-sunod ng palabunutan.
