translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tubig” bilang karaniwang pangngalang kolektibo, “pati” para sa natural na pag-uugnay sa talaan, at mga anyong biblikal na Jarkon, Rakon, at Jope.
