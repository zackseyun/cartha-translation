  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
translation:
  language: tl
  text: at ang tubig ng Jarkon[a] at Rakkon, pati ang hangganan[b] na nasa tapat ng Jope.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain ang Hebreo bilang pangalang-lugar na “Me-Jarkon” sa halip na “ang tubig ng Jarkon.”
    reason: lexical_alternative
  - marker: b
    text: O “teritoryong nasa tapat ng Jope.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵי הַיַּרְקוֹן
  choice: at ang tubig ng Jarkon
  rationale: Ang מֵי ay construct plural ng מַיִם, kaya natural itong isaling “tubig ng.” Pinanatili ang Jarkon bilang pangalang pantangi; ang alternatibong pagbasa na isang buong pangalan ng lugar ay inilagay sa talababa.
- source_word: וְ/הָרַקּוֹן
  choice: at Rakon
  rationale: Isinalin bilang pangalang pantangi at ginamit ang anyong Rakon na natural basahin sa Filipino, nang hindi mekanikal na inililipat ang pantukoy na Hebreo.
- source_word: עִם
  choice: pati
  rationale: Sa talaan ng mga lugar at hangganan, malinaw at natural na ipinahahayag ng “pati” ang pagdaragdag na diwa ng “kasama.”
- source_word: הַ/גְּבוּל
  choice: ang hangganan
  rationale: Maaaring tumukoy ang גְּבוּל sa linyang hangganan o sa nasasakupang teritoryo. Ang “hangganan” ang pinakadirektang pagpili rito, habang pinananatili sa talababa ang posibleng “teritoryo.”
- source_word: מוּל
  choice: nasa tapat ng
  rationale: Ipinahahayag nito ang relasyong panlugar na “opposite/facing”; natural sa Filipino ang “nasa tapat ng” sa paglalarawan ng hangganan.
- source_word: יָפוֹ
  choice: Jope
  rationale: Ginamit ang nakaugaliang biblikal na anyong Filipino na “Jope” para sa Joppa/Japho.
