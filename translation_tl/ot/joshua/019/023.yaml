  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
translation:
  language: tl
  text: Ito ang mana ng lipi ng mga anak ni Isacar, ayon sa kani-kanilang angkan—ang mga lungsod at ang mga nayon ng mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: Ito ang
  rationale: Ang Hebreo ay sugnay na walang tahasang pandiwa. Likas sa Tagalog ang nominal na pormulang “Ito ang,” na hindi kailangang magtakda ng panahong pangkasalukuyan o pangnakaraan.
- source_word: נַחֲלַת
  choice: mana
  rationale: Sa Josue, tumutukoy ito sa lupaing tinanggap bilang minanang pag-aari; pinananatili ng “mana” ang tipanang diwa nang mas malinaw kaysa sa administratibong “bahagi.”
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa konteksto ng paghahati ng lupain, ang salita ay tumutukoy sa tribo. Ang “lipi” ay natural at marangal sa modernong Tagalog.
- source_word: בְנֵי יִשָּׂשכָר
  choice: mga anak ni Isacar
  rationale: Pinananatili nito ang Hebreong pananalitang pangkamag-anakan at ang salinlahing pagkakakilanlan ng lipi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Tumutukoy ang מִשְׁפָּחוֹת sa mga pangkat-angkan sa loob ng lipi, at ipinahihiwatig ng לְ ang pamamahagi ayon sa mga ito. Nililinaw ng “kani-kanilang” ang distribusyon.
- source_word: הֶעָרִים
  choice: mga lungsod
  rationale: Karaniwang katawagan ito sa mga sentrong tinitirhan sa mga talaan ng lupain sa Josue, kahit maaaring maliit ang ilan ayon sa makabagong pamantayan.
- source_word: וְחַצְרֵיהֶן
  choice: at ang mga nayon ng mga iyon
  rationale: Ang חָצֵר dito ay mga nakadependeng pamayanang rural na kaugnay ng mga lungsod. Ang “mga iyon” ay nagpapanatili sa pambabaeng maramihang reperensiya ng hulapi pabalik sa mga lungsod.
