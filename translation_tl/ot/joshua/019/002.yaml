  text: And they had in their inheritance Beer-sheba[a], Sheba, and Moladah.
translation:
  language: tl
  text: Kabilang sa kanilang mana ang Beer-seba[a], Seba, at Molada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Beer-seba at Seba.” Nauunawaan ito ng ilan bilang iisang pangalang-pook (“Beer-seba”), na may di-karaniwang anyo sa teksto o estilo, sa halip na dalawang magkahiwalay na bayan.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: At ang nasa kanila ay
  rationale: Ang idyomang Hebreo na ויהי + ל ay nagpapahayag ng pag-aari o pagkakaloob. Ang “ang nasa kanila ay” ay likas sa modernong Filipino at akma sa talaan ng mga bayang inilaan sa lipi.
- source_word: בְּנַחֲלָתָם
  choice: sa kanilang mana
  rationale: Ang נַחֲלָה ay tumutukoy sa minanang pag-aari o bahaging lupa na inilaan sa isang lipi. Pinananatili ng “sa kanilang mana” ang diwa at anyo ng Hebreo nang hindi labis na nagpapaliwanag.
- source_word: בְּאֵר שֶׁבַע
  choice: Beer-seba
  rationale: Isinalin sa baybay-Filipino ang pangalang-pook, habang pinananatili ang gitling upang makita ang dalawang bahagi ng pangalang Hebreo.
- source_word: וְשֶׁבַע
  choice: Seba
  rationale: Itinuturing ng tekstong Masoretiko ang Seba bilang hiwalay na pangalan sa talaan. Ang suliraning maaaring iisang pangalan lamang ito kasama ng Beer-seba ay pinanatili sa talababa.
- source_word: וּמוֹלָדָה
  choice: at Molada
  rationale: Isinalin sa baybay-Filipino ang pangalang-pook at pinanatili ang pangatnig bilang huling item sa talaan.
