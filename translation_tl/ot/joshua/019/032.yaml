  yaml_path: translation/ot/joshua/019/032.yaml
  text: For the sons of Naphtali[a], the sixth lot came out, for the sons of Naphtali according to their clans.
translation:
  language: tl
  text: Para sa mga anak ni Neftali, lumabas ang ikaanim na bunot[a]—para sa mga anak ni Neftali ayon sa kani-kanilang angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “napunta.” Literal sa Hebreo, “lumabas,” na tumutukoy sa resultang nakuha sa pagbubunot.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי נַפְתָּלִי
  choice: para sa mga anak ni Neftali
  rationale: Pinananatili ang pormal na pantribong idyomang “mga anak ni,” habang natural na ipinahahayag ng “para sa” na sila ang tumanggap ng bahagi.
- source_word: יָצָא
  choice: lumabas
  rationale: Ito ang tuwirang kahulugan ng pandiwa at angkop sa resulta ng palabunutan; hindi nito tahimik na pinapalitan ng mas interpretatibong “napunta.”
- source_word: הַגּוֹרָל
  choice: ang palabunutan
  rationale: Sa konteksto, tumutukoy ito sa loteng binunot upang italaga ang lupain. Mas malinaw sa karaniwang Filipino ang “palabunutan” kaysa sa “lote,” na maaaring unawaing parsela ng lupa.
- source_word: הַשִּׁשִּׁי
  choice: ang ikaanim
  rationale: Tuwirang salin ng ordinal na naglalarawan sa palabunutan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang “angkan” ay angkop sa mga pangkat ng magkakamag-anak sa loob ng lipi; nililinaw ng “kani-kanilang” ang pamamahagi ayon sa mga pangkat na iyon.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na dignified at madaling maunawaan. Pinanatili ang pag-uulit ng “mga anak ni Neftali” mula sa Hebreo at ang pormal na idyomang pantribo; ginamit ang gitling upang natural na maipakita ang inuulit na parirala.
