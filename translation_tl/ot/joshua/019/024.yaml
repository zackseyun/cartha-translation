  rationale: Pinalitan ang “palabunutan” ng “palabunot” upang tukuyin ang mismong lot, at inayos ang pagkakasunod ng mga salita upang maging likas sa modernong Filipino. Pinanatili ang “lumabas” bilang pangunahing salin ng וַיֵּצֵא; ang mas kontekstuwal na “nabunot” ay nananatili sa talababa. Idinagdag ang “mga” sa “mga angkan” para sa likas na plural na pagpapahayag ng מִשְׁפְּחוֹתָם.
