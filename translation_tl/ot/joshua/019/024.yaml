  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: tl
  text: Lumabas ang ikalimang palabunot para sa lipi ng mga anak ni Asher[a], ayon sa kani-kanilang mga angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang ikalimang palabunot ay nabunot para sa lipi ng mga anak ni Asher, ayon sa kani-kanilang mga angkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ay lumabas
  rationale: Pinananatili ang literal na larawan ng pandiwang יצא (“lumabas”) sa pormula ng pagpapalabunutan, sa halip na gawing mas interpretatibong “nabunot.”
- source_word: הַגּוֹרָל
  choice: palabunutan
  rationale: Sa kontekstong ito, tumutukoy ang גּוֹרָל sa lot na ginagamit o sa resulta ng pagpapasiya sa pamamagitan ng lot. Ang “palabunutan” ay malinaw at natural sa modernong Filipino at pinananatili ang paraan ng pagtatalaga.
- source_word: הַחֲמִישִׁי
  choice: ikalimang
  rationale: Tuwirang salin ng bilang na panunuran na naglalarawan sa palabunutan.
- source_word: לְמַטֵּה
  choice: para sa lipi ng
  rationale: Bagaman maaari ring mangahulugang “tungkod” ang מַטֶּה, ang matatag na kahulugan nito rito ay isang lipi ng Israel.
- source_word: בְנֵי אָשֵׁר
  choice: mga anak ni Asher
  rationale: Pinananatili ang pormal na pananalitang pangangkan na “mga anak ni Asher,” habang malinaw na ang tinutukoy ay ang lipi.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinahihiwatig ng מִשְׁפָּחוֹת ang mga pangkat-angkan sa loob ng lipi. Ang “kani-kanilang” ay natural na naghahayag ng pamamahagi ayon sa mga angkang iyon.
