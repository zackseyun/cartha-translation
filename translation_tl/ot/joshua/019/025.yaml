  text: And their border was Helkath[a], Hali, Beten, and Akshaph.
translation:
  language: tl
  text: Ang kanilang hangganan ay Helkat, Hali, Beten, at Aksaf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Ipinagpapatuloy ng wayyiqtol ng היה ang salaysay ng talaan ng hangganan; natural sa Tagalog ang payak na panaguring “ay” nang hindi labis na isinasalin ang anyong pandiwa.
- source_word: גְּבוּלָם
  choice: kanilang hangganan
  rationale: Ang גְּבוּל ay tumutukoy sa hangganan o guhit na nagtatakda ng lupain; malinaw at likas sa konteksto ng paghahati ng lupain ang “hangganan.” Ang hulaping 3mp ay isinaling “kanilang.”
- source_word: חֶלְקַת
  choice: Helkat
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon; ang huling ת ay kinatawan ng “t.”
- source_word: וַחֲלִי
  choice: Hali
  rationale: Pangalan ng lugar; ginamit ang payak at madaling basahing anyo sa Filipino, na kinakatawan ang ח ng “H.”
- source_word: וָבֶטֶן
  choice: Beten
  rationale: Pangalan ng lugar na tuwirang isinalin sa mga titik na angkop sa Filipino.
- source_word: וְאַכְשָׁף
  choice: Aksaf
  rationale: Pangalan ng lugar; ang כְשׁ ay kinatawan ng “ks” at ang ף ng “f,” ayon sa makabagong bigkas at ortograpiyang Filipino.
