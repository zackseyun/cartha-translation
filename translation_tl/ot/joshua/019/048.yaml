translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Ito ang” upang hindi magdagdag ng panahong pandiwa na wala sa Hebreo, at “angkan” para sa mga sangay ng pagkakamag-anak sa loob ng lipi.
