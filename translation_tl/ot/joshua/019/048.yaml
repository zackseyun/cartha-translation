base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: tl
  text: 'Ito ang mana[a] ng lipi ng mga anak ni Dan, ayon sa kani-kanilang angkan: ang mga lunsod na ito at ang mga nayon ng mga ito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bahaging inilaan” sa halip na “mana”; maaaring bigyang-diin ng salitang Hebreo ang bahaging itinakda o ang katangian nitong minana.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Ito ang
  rationale: Ang demonstratibong pormula ay walang tahasang pandiwang pantukoy sa Hebreo. Natural sa Tagalog ang walang-panahong “Ito ang,” kaya napapanatili nito ang maaaring kasalukuyan o buod na diwa nang hindi pinipilit ang nakaraan.
- source_word: נַחֲלַת
  choice: mana
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa bahaging lupang minana o itinakda sa isang lipi. Pinananatili ng “mana” ang diwang minana, samantalang posibleng alternatibo ang “bahaging inilaan.”
- source_word: מַטֵּה
  choice: lipi
  rationale: Ito ang karaniwang kahulugan ng salita bilang yunit panlipi sa kontekstong ito, hindi ang literal na “tungkod.”
- source_word: בְנֵי דָן
  choice: mga anak ni Dan
  rationale: Malapit ito sa pormang Hebreo at malinaw na tumutukoy sa mga inapo o sambayanan ni Dan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang “angkan” ay angkop sa mga pangkat ng magkakamag-anak sa loob ng lipi; ipinahahayag ng “kani-kanilang” ang pamamahagi ayon sa mga pangkat na iyon.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ang mga lunsod na ito
  rationale: Tuwirang salin ng pariralang tumutukoy pabalik sa naunang talaan; ang “lunsod” ang kumbensiyonal na katumbas sa mga listahan ng teritoryo.
- source_word: וְחַצְרֵיהֶן
  choice: at ang mga nayon ng mga iyon
  rationale: Tumutukoy ang חצר sa mas maliliit o nakaugnay na pamayanang sakop ng mga lunsod. Nililinaw ng “ng mga iyon” na ang mga nayon ay kaugnay ng mga lunsod.
