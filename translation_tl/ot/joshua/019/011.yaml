  yaml_path: translation/ot/joshua/019/011.yaml
  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: tl
  text: At ang hangganan nila ay umakyat pakanluran patungong Marala, umabot sa Dabeset, at umabot sa batis na nasa tapat ng Jokneam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: ay paakyat
  rationale: Pinananatili ang heograpikong kilos na ‘umakyat’ o ‘pumaakyat’ habang natural na inilalarawan ang takbo ng hangganan.
- source_word: לַיָּמָּה
  choice: pakanluran
  rationale: Ang literal na ‘patungo sa dagat’ ay karaniwang idyoma sa Hebreo para sa direksiyong kanluran.
- source_word: וּפָגַע
  choice: umabot
  rationale: Sa paglalarawan ng hangganan, ipinahihiwatig ng pandiwa ang pagdating o pagsalubong sa isang pook; ang ‘umabot’ ay malinaw at natural sa Filipino.
- source_word: הַנַּחַל
  choice: batis
  rationale: Maaaring tumukoy sa batis o lambak-ilog na pana-panahong may tubig; ‘batis’ ang maikli at karaniwang katumbas, nang hindi dinaragdagan ang teksto.
- source_word: עַל פְּנֵי
  choice: nasa tapat ng
  rationale: Inihahayag ang lokasyong kaharap o katapat ng Jokneam.
