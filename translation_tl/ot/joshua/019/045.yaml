lexical_decisions:
- source_word: וִיהֻד
  choice: Yehud
  rationale: Pangalan ito ng isang bayan sa talaan. Isinatinig ito ayon sa Hebreong unang katinig na yod bilang Y, sa halip na isalin ang pangalan.
- source_word: וּבְנֵי בְרַק
  choice: Bene-berak
  rationale: Itinuring itong tambalang pangalan ng isang bayan, hindi ang karaniwang pariralang maaaring mangahulugang “mga anak ni Berak.” Ipinakikita ng gitling na iisang lugar ang tinutukoy.
- source_word: וְגַת רִמּוֹן
  choice: Gat-rimon
  rationale: Tambalang pangalan ito ng isang bayan. Ginamit ang baybay na madaling bigkasin sa Filipino at ang gitling upang malinaw na iisang lugar lamang ang tinutukoy.
