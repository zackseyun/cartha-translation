translation_notes:
  register: 'Maikli at marangal na anyo para sa talaan ng mga bayan. Pinanatili ang mga pangalan bilang transliterasyon, gamit ang baybay at bantas na likas at malinaw sa mga modernong mambabasang Filipino. Itinama ang pagkakalagay ng mga pananda ng talababa ayon sa nilalaman ng mga talababa: [a] sa Bene-berak at [b] sa Gat-rimon.'
