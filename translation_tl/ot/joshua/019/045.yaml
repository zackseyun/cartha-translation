  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Bene-berak—isang pangalan ng lugar na binubuo ng mga salitang maaari ring mangahulugang “mga anak ni Berak” sa ibang konteksto; dito, pangalan ito ng isang bayan.
