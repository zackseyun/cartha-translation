lexical_decisions:
- source_word: אֶלְתּוֹלַד
  choice: Eltolad
  rationale: Pangalan ng isang lugar sa talaan ng mga bayan. Isinatinig ito nang tuwiran at malinaw para sa mambabasang Filipino.
- source_word: בְתוּל
  choice: Betul
  rationale: Pangalan ng lugar. Ang anyong “Betul” ay malapit sa Hebreong bigkas at natural basahin sa Filipino; hindi ito isinalin ayon sa posibleng kahulugan ng pangalan.
- source_word: חָרְמָה
  choice: Horma
  rationale: Pangalan ng lugar. Ginamit ang nakasanayang anyong Filipino na “Horma,” na kumakatawan sa unang katinig na ח sa paraang madaling basahin, nang hindi isinasalin ang ugat ng pangalan.
- source_word: וְ / וּ
  choice: at
  rationale: Ang mga unlaping pang-ugnay ay nagdurugtong sa mga pangalan sa isang payak na talaan. Sa natural na Filipino, kuwit ang ginamit sa pagitan ng mga unang pangalan at “at” bago ang huli.
