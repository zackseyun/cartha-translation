reference: Joshua 19:50
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: tl
  text: Ayon sa utos ni Yahweh, ibinigay nila sa kanya ang lungsod na hiniling niya—ang Timnat-sera, sa kaburulan ng Efraim. Itinayo niya ang lungsod[a] at nanirahan doon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain sa konteksto na: “Muli niyang itinayo ang lungsod.” Ang pandiwang Hebreo ay karaniwang nangangahulugang “magtayo”; bagaman maaaring ipahiwatig ng konteksto ang muling pagtatayo o pagpapanumbalik, hindi ito tahasang sinasabi ng pandiwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: Ayon sa utos ni Yahweh
  rationale: Ang idyomang עַל־פִּי ay nagpapahiwatig ng makapangyarihang utos o tagubilin. Likas sa modernong Tagalog ang “ayon sa utos,” at pinananatili ang personal na pangalang Yahweh.
- source_word: נָתְנוּ לוֹ
  choice: ibinigay nila sa kanya
  rationale: Tuwirang inililipat ang payak na diwa ng נתן at ang di-tiyak na pangmaramihang simuno ng Hebreo.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: ang lungsod na hiniling niya
  rationale: Ang שׁאל ay “humingi” o “humiling”; ang “hiniling niya” ay malinaw at marangal sa kasalukuyang Tagalog.
- source_word: תִּמְנַת סֶרַח
  choice: Timnat-sera
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino habang malapit sa pangalang Hebreo.
- source_word: בְּהַר אֶפְרָיִם
  choice: sa kaburulan ng Efraim
  rationale: Sa konteksto, ang הַר ay tumutukoy sa maburol o bulubunduking rehiyon, hindi lamang sa isang bundok.
- source_word: וַיִּבְנֶה אֶת־הָעִיר
  choice: Itinayo niya ang lungsod
  rationale: Karaniwang kahulugan ng בנה ang “magtayo.” Dahil umiiral na ang lungsod nang ibigay ito, posible rin sa konteksto ang “muling itinayo” o “ipinaayos,” kaya inilalahad ang alternatibo sa talababa.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: at nanirahan doon
  rationale: Ang ישׁב ay maaaring mangahulugang manirahan o mamalagi. Ang “nanirahan doon” ay natural sa Tagalog at malinaw ang tinutukoy na lugar.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kung itinayo o muling itinayo ang lungsod
  choice: Itinayo niya ang lungsod, na may talababa
  alternative: Muli niyang itinayo ang lungsod; ipinaayos niya ang lungsod
  rationale: Hindi tahasang may panlaping “muli” ang pandiwang Hebreo, ngunit maaaring iyon ang diwa sa konteksto dahil lungsod na ito nang ibigay kay Josue. Pinananatili ng pangunahing teksto ang payak na leksikal na kahulugan at ng talababa ang kontekstuwal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagsasalaysay. Ginamit ang “kaburulan” para sa heograpikong rehiyon at iniwasan ang labis na teknikal o makalumang pananalita.
