base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/041.yaml
  text: And the border of their inheritance was Zorah[a], Eshtaol, and Ir-shemesh.
translation:
  language: tl
  text: At ang hangganan ng kanilang mana ay ang Zora, Estaol, at Ir-semes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Ir-semes ay nangangahulugang “Lungsod ng Araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At ... ay
  rationale: Ipinananatili ng “At” ang ugnayang pasalaysay ng waw-consecutive, samantalang ang karaniwang ayos na may “ay” ay likas at malinaw sa modernong Filipino.
- source_word: גְּבוּל
  choice: hangganan
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa hangganan ng bahaging minana; mas tiyak dito ang “hangganan” kaysa “teritoryo.”
- source_word: נַחֲלָתָם
  choice: kanilang mana
  rationale: Pinananatili ng “mana” ang diwa ng lupaing ibinigay bilang minanang bahagi, at ang hulaping pangmaramihan ay tumutukoy sa lipi ni Dan.
- source_word: צָרְעָה
  choice: Zora
  rationale: Transliterasyong angkop sa bigkas at baybay ng Filipino para sa pangalan ng lugar.
- source_word: אֶשְׁתָּאוֹל
  choice: Estaol
  rationale: Transliterasyong angkop sa Filipino, nang hindi isinasalin ang pangalan ng lugar.
- source_word: עִיר שָׁמֶשׁ
  choice: Ir-semes
  rationale: Pinananatili bilang transliteradong pangalan ng lugar; ibinibigay sa talababa ang malinaw na kahulugan ng mga salitang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang maikling anyong talaan ng tekstong Hebreo at ginamit ang karaniwang salitang “mana” para sa tribal na bahaging lupain.
