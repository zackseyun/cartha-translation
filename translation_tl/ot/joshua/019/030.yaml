lexical_decisions:
- source_word: עֻמָה
  choice: Uma
  rationale: Pangalan ng lugar; tinumbasan ayon sa tunog ng Hebreo sa paraang natural basahin sa Filipino.
- source_word: אֲפֵק
  choice: Afek
  rationale: Pangalan ng lugar; ginamit ang “f” upang katawanin ang tunog ng Hebreong פ sa pangalang ito.
- source_word: רְחֹב
  choice: Rehob
  rationale: Pangalan ng lugar; pinanatili ang anyong malapit sa Hebreo at sa nakasanayang biblikal na transliterasyon.
- source_word: עָרִים
  choice: mga lungsod
  rationale: Karaniwang katawagan sa mga bayang nakatala sa paghahati ng lupain; hindi nito kinakailangang ipahiwatig na malalaki ang lahat ng pamayanan.
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: dalawampu't dalawa
  rationale: Tuwirang salin ng bilang na ibinigay para sa kabuuang mga lungsod.
- source_word: חַצְרֵיהֶן
  choice: mga nayon ng mga iyon
  rationale: Tumutukoy sa maliliit o rural na pamayanang kaugnay at nakadepende sa mga nakalistang lungsod; nilinaw ng “ng mga iyon” ang hulaping panghalip na pambabaeng maramihan sa Hebreo.
