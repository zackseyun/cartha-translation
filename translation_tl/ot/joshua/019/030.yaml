  text: 'Ummah[a], Aphek, and Rehob: twenty-two cities, with their villages.'
translation:
  language: tl
  text: 'Ummah[a], Afek, at Rehob: dalawampu’t dalawang lungsod, kasama ang kanilang mga nayon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin na “Umah.”
