base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: tl
  text: Pagkatapos, lumiko ang hangganan patungong Rama, hanggang sa napapaderang lungsod ng Tiro; pagkatapos, lumiko ang hangganan patungong Hosa, at ang mga dulong bahagi nito ay patungo sa dagat[a], mula sa rehiyon ng Aczib[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa dagat” o “pakanluran.” Literal na “patungo sa dagat,” isang karaniwang heograpikong pagpapahayag para sa kanluran.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mula sa distrito ng Aczib” o “mula sa teritoryo ng Aczib.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: lumiko
  rationale: Sa mga paglalarawan ng hangganan, ang pandiwa ay karaniwang nagpapahiwatig ng pagbabago ng direksiyon. Natural at malinaw sa Filipino ang “lumiko.”
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Tumutukoy ito sa guhit na nagtatakda sa sakop ng lupa; “hangganan” ang karaniwang katumbas sa modernong Filipino.
- source_word: הָרָמָה
  choice: Rama
  rationale: Pangalan ng lugar; ginamit ang anyong karaniwan sa mga saling Filipino.
- source_word: עִיר מִבְצַר צֹר
  choice: ang napapaderang lungsod ng Tiro
  rationale: Ipinahihiwatig ng parirala na ang Tiro ay isang lungsod na pinatibay para sa pagtatanggol. Ang “napapaderang lungsod” ay natural at madaling maunawaan.
- source_word: חֹסָה
  choice: Hosa
  rationale: Pangalan ng lugar, na isinalin sa karaniwang transliterasyong Filipino.
- source_word: וִיהְיוּ תֹצְאֹתָיו
  choice: humantong ito
  rationale: Sa pormula ng mga hangganan, tumutukoy ang pangngalan sa dulo o labasan ng linya. Ang pandiwang “humantong” ay likas na paraan sa Filipino upang ihayag ang heograpikong kahulugan.
- source_word: הַיָּמָּה
  choice: sa dagat
  rationale: May panlaping paturol sa direksiyon ang Hebreo at literal na tumutukoy sa dagat; sa konteksto ng pinakahantungan ng hangganan, natural ang “sa dagat,” habang inilalagay sa talababa ang posibleng kahulugang direksiyonal.
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: mula sa nasasakupan ng Aczib
  rationale: Ang חֶבֶל ay maaaring tumukoy sa isang takdang lupain, distrito, o rehiyon. Ang “nasasakupan” ay nagpapanatili ng heograpikong diwa nang hindi nagpapalagay ng tiyak na uri ng administratibong yunit.
