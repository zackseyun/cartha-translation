  to: Pagkatapos, lumiko ang hangganan patungong Rama, hanggang sa napapaderang lungsod ng Tiro; pagkatapos, lumiko ang hangganan patungong Hosa, at ang mga dulong bahagi nito ay patungo sa dagat[a], mula sa rehiyon ng Aczib[b].
