base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: tl
  text: Lumabas ang ikalawang bunot para kay Simeon[a]—para sa lipi ng mga anak ni Simeon, ayon sa kani-kanilang angkan[b]. Ang mana nila ay nasa loob ng mana ng mga anak ni Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Ang ikalawang bunot ay napunta kay Simeon.” Literal na “lumabas” ang pandiwang Hebreo, na ginagamit dito para sa kinalabasan ng pagbubunot.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Simeon” at “mga anak ni Juda” ay mga katawagang Hebreo para sa mga lipi; tumutukoy ang mga ito sa mga inapo o kasapi ng mga liping iyon.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל הַשֵּׁנִי
  choice: Ang ikalawang palabunutan ay lumabas
  rationale: Pinananatili ng “lumabas” ang larawan ng pandiwang יצא, samantalang ang “palabunutan” ay natural na tumutukoy sa lot at sa paraang ginamit sa paghahati ng lupain.
- source_word: לְשִׁמְעוֹן
  choice: para kay Simeon
  rationale: Ipinapakita ng “para kay” ang tatanggap ng kinalabasan ng palabunutan.
- source_word: לְמַטֵּה בְנֵי שִׁמְעוֹן
  choice: para sa lipi ng mga anak ni Simeon
  rationale: Ang מַטֶּה ay “lipi” sa konteksto ng paghahati ng lupain; pinananatili ang Hebreong katawagang pampamilya na “mga anak ni Simeon.”
- source_word: לְמִשְׁפְּחוֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Mas malinaw ang “angkan” kaysa “pamilya” para sa mas malaking yunit panlipunan sa loob ng isang lipi; ipinahihiwatig ng “kani-kanilang” ang pamamahagi ayon sa mga angkan.
- source_word: נַחֲלָתָם
  choice: mana nila
  rationale: Ang “mana” ay natural at maikli, at pinananatili ang legal at tipanang diwa ng נַחֲלָה bilang lupaing minana o itinakdang bahagi.
- source_word: בְּתוֹךְ נַחֲלַת בְּנֵי יְהוּדָה
  choice: nasa loob ng mana ng mga anak ni Juda
  rationale: Tuwirang ipinapahayag ang lokasyon sa loob ng teritoryong mana ng Juda at pinananatili ang magkaparehong salitang “mana” para sa נַחֲלָה.
