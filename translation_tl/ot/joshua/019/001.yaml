translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palabunutan,” “lipi,” “angkan,” at “mana” bilang mga salitang madaling maunawaan ngunit angkop sa salaysay ng paghahati ng lupain. Ang gitling na mahaba ay tumutulong na ipakitang nililinaw ng kasunod na parirala kung sino ang Simeon na tinutukoy.
