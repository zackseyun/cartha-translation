  text: וּ/מִ/שָּׁ֤ם עָבַר֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה גִּתָּ֥/ה חֵ֖פֶר עִתָּ֣ה קָצִ֑ין וְ/יָצָ֛א רִמּ֥וֹן הַ/מְּתֹאָ֖ר הַ/נֵּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: tl
  text: Mula roon, dumaan ang hangganan pasilangan[a], patungo sa dakong sikatan ng araw, hanggang Gat-hefer at Et-kazin[b]. Pagkatapos, lumabas ito patungong Rimon, na umaabot hanggang Nea.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Mula roon, dumaan ito sa silangan.” Dalawang panandang direksiyon ang ginamit sa Hebreo, na literal na “pasilangan, patungo sa sikatan ng araw,” marahil bilang pagdidiin.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Et-kazin”; inuunawa naman ng ilan ang anyo bilang “Ita-kazin.”
    reason: alternative_reading
  - marker: c
    text: Mahirap unawain ang Hebreo sa bahaging ito; literal itong maaaring tumbasan ng “Rimon, ang minarkahan, ang Nea,” o katulad nito. Nauunawaan ito ng marami na ang hangganan ay umabot mula Rimon hanggang Nea.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Mula roon
  rationale: Likas sa salaysay ng mga hangganan ang “Mula roon”; ipinahihiwatig na ng pagkakasunod-sunod ang panandang pang-ugnay na וְ.
- source_word: עָבַר
  choice: dumaan ang hangganan
  rationale: Sa mga paglalarawan ng teritoryo, tumutukoy ang pandiwa sa pagdaan ng guhit ng hangganan. Nilinaw ang ipinahihiwatig na simuno upang maging natural sa Tagalog.
- source_word: קֵדְמָה מִזְרָחָה
  choice: pasilangan, patungo sa dakong sikatan ng araw
  rationale: Pinananatili ang dalawang magkasunod na panandang direksiyon sa Hebreo sa halip na pagsamahin ang mga ito sa iisang salita.
- source_word: גִּתָּה חֵפֶר
  choice: Gat-hefer
  rationale: Transliterasyon ng tambalang pangalan ng lugar na angkop sa bigkas at baybay sa Tagalog.
- source_word: עִתָּה קָצִין
  choice: Et-kazin
  rationale: Itinuring na iisang pangalan ng lugar ayon sa paghahati ng tekstong Masoretiko, habang inilalahad sa talababa ang posibleng alternatibong pagbasa.
- source_word: וְיָצָא
  choice: lumabas ito patungong
  rationale: Pinananatili ang larawang pangkalawakan ng יצא sa pormula ng hangganan, bagaman sa konteksto ay maaari rin itong mangahulugang umabot o nagpatuloy.
- source_word: רִמּוֹן
  choice: Rimon
  rationale: Transliterasyon ng pangalan ng lugar sa natural na ortograpiyang Tagalog.
- source_word: הַמְּתֹאָר
  choice: na umaabot
  rationale: Ang anyo ay mahirap unawain, ngunit ang “umaabot” ay akma sa konteksto ng hangganan nang hindi lubusang ikinukubli ang kawalang-katiyakan, na ipinaliliwanag sa talababa.
- source_word: הַנֵּעָה
  choice: hanggang Nea
  rationale: Itinuring ang Nea bilang pangalan ng lugar at ang anyo bilang dulo ng pag-abot ng hangganan.
