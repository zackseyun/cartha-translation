  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Tagalog. Tahasang binanggit ang “hangganan” bilang ipinahihiwatig na simuno upang luminaw ang heograpikong paglalarawan. Pinanatili ang dobleng direksiyon ng Hebreo at inilagay sa talababa ang tunay na hirap ng huling parirala.
