- source_word: תִמְנָתָה
  choice: Timna
  rationale: Pangalan ito ng isang lugar. Ginamit ang nakaugaliang payak na anyong “Timna”; ang hulaping -ָה ay maaaring katawanin sa mas pormal na transliterasyon ngunit hindi kailangang ipakita sa karaniwang anyo ng pangalan.
- source_word: עֶקְרוֹן
  choice: Ekron
  rationale: Tuwirang transliterasyon ng pangalan ng lugar na angkop sa Filipino.
- source_word: וְ
