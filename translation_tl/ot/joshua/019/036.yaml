- source_word: חָצוֹר
  choice: Hazor
  rationale: Pangalan ito ng lugar at isinatitik bilang “Hazor,” ayon sa karaniwang anyo sa Filipino.
- source_word: וְ
  choice: at
  rationale: Pinag-uugnay ng pangatnig ang mga pangalan sa payak na talaan; likas sa Filipino na ilagay ang “at” bago ang huling pangalan.
