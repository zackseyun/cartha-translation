lexical_decisions:
- source_word: חֲפָרַיִם
  choice: Hafaraim
  rationale: Pangalan ng isang lugar sa talaan ng mga bayan; tinumbasan sa baybay na madaling basahin sa Filipino, at ginamit ang “f” para sa tunog ng Hebrew pe na may spirantisasyon.
- source_word: שִׁיאֹן
  choice: Shion
  rationale: Pangalan ng lugar; pinanatili ang karaniwang maikli at malinaw na transliterasyon.
- source_word: אֲנָחֲרַת
  choice: Anaharat
  rationale: Pangalan ng lugar; ang gitnang ח ay kinatawan ng “h” para sa natural na bigkas at pagbasa sa Filipino.
- source_word: וַ / וְ
  choice: at
  rationale: Ang mga unlaping pang-ugnay ay nagdurugtong sa mga pangalan sa talaan; sa Filipino, kuwit at panghuling “at” ang natural na anyo.
