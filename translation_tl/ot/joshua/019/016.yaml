base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/016.yaml
  text: This was the inheritance of the sons of Zebulun according to their clans[a], these cities and their villages.
translation:
  language: tl
  text: 'Ito ang mana ng mga anak ni Zebulun ayon sa kani-kanilang mga angkan: ang mga lungsod na ito at ang mga nayon ng mga lungsod na ito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: Ito ang
  rationale: Ang pambabaeng isahang demonstratibo ay tumutukoy sa naunang inil列 na bahagi ng lupain. Ang likas na sugnay na walang pandiwa sa Tagalog ay hindi tahasang nagtatakda kung kasalukuyan o nakaraan, kaya napapanatili ang kalabuan ng Hebreo.
- source_word: נַחֲלַת
  choice: mana
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa bahaging tinanggap bilang minanang pag-aari; pinananatili ng “mana” ang legal at tipanang diwa.
- source_word: בְּנֵי זְבוּלֻן
  choice: mga anak ni Zebulun
  rationale: Pinananatili ang literal na pananalitang pampamilya ng Hebreo, na dito ay sama-samang tumutukoy sa lipi ni Zebulun.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinapakita ng parirala ang pamamahagi ayon sa mga pangkat-pamilya sa loob ng lipi; malinaw sa “kani-kanilang” na ang mana ay hinati ayon sa mga angkan.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ang mga lungsod na ito
  rationale: Buod ito ng mga sentrong panirahan na naunang binanggit; ang “mga lungsod” ang karaniwang katumbas sa mga talaan ng teritoryo sa Josue.
- source_word: וְחַצְרֵיהֶן
  choice: at ang mga nayon ng mga ito
  rationale: Ang חָצֵר sa ganitong pormula ay tumutukoy sa maliliit na pamayanang nakaugnay o nakapalibot sa mga lungsod; natural at malinaw ang “mga nayon.”
theological_decisions:
- issue: Panahunan ng pormulang pangbuod
  choice: 'Gumamit ng sugnay na walang pandiwa: “Ito ang mana,” nang walang tahasang panandang pangkasalukuyan o pangnakaraan.'
  alternative: “Ito ang naging mana” o “Ito ang mana noon”
  rationale: Walang pandiwa ang Hebreong sugnay, kaya maaaring unawain bilang “ito ang” o, ayon sa daloy ng salaysay, “ito ang naging.” Hindi kailangang lutasin ng Tagalog ang kalabuang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tutuldok upang ipakitang ang “mga lungsod na ito at ang mga nayon ng mga ito” ay nagpapaliwanag kung ano ang saklaw ng mana.
