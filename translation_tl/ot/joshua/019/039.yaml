  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/039.yaml
  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
translation:
  language: tl
  text: Ito ang mana ng lipi ng mga anak ni Neftali ayon sa kani-kanilang angkan—ang mga lungsod at ang mga nayon ng mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ni Neftali.” Ang katawagang Hebreo ay tumutukoy sa mga inapo o mga kasapi ng lipi ni Neftali.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Ito ang
  rationale: Ang Hebreo ay isang nominal na sugnay na walang hayag na pandiwang panahunan. Pinananatili ng natural na pormulang Filipino na “Ito ang” ang hindi tiyak na panahon sa halip na piliting gawing nakaraan o kasalukuyan.
- source_word: נַחֲלַת
  choice: mana
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa bahaging lupaing minana; pinananatili ng “mana” ang ugnayang tipan at pagmamana.
- source_word: מַטֵּה
  choice: lipi
  rationale: Dito, ito ang terminong panlipi at hindi ang literal na “tungkod.” Natural sa Filipino ang “lipi” para sa tribo ni Neftali.
- source_word: בְנֵי נַפְתָּלִי
  choice: mga anak ni Neftali
  rationale: Malapit itong sumusunod sa literal na katawagang pangangkan sa Hebreo at tumutukoy sa mga inapo o kasapi ng lipi, hindi lamang sa mga lalaking anak.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinahahayag ng לְ ang pamamahagi o pag-uuri ayon sa mga angkan. Nililinaw ng “kani-kanilang” ang distributibong diwa.
- source_word: הֶעָרִים
  choice: mga lungsod
  rationale: Karaniwang kahulugan ng עִיר at angkop sa paulit-ulit na pormula ng talaan ng mga lupain sa Josue.
- source_word: וְחַצְרֵיהֶן
  choice: at ang mga nayon ng mga iyon
  rationale: Ang חָצֵר dito ay mga nakapailalim na pamayanang nasa paligid ng mga lungsod. Ginagawang malinaw ng “ng mga iyon” na ang panghalip na pambabae sa Hebreo ay tumutukoy sa mga lungsod.
