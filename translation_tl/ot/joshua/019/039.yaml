  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Ito ang” upang natural na mapanatili ang kawalan ng hayag na panahunan sa nominal na sugnay ng Hebreo; hindi na kailangan ang hiwalay na talababa tungkol sa present o past tense sa Filipino.
