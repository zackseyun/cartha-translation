translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang panliping katawagang “mga anak ni Dan,” ang konkretong larawang “talim ng tabak,” at ang tunay na kalabuan ng unang sugnay. Ginamit ang baybay na “Lesem” ayon sa karaniwang pagpapalapit ng tunog sa Filipino.
