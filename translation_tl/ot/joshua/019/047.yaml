base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: tl
  text: Ngunit lumampas sa kanila ang hangganan ng mga anak ni Dan.[a] Kaya umakyat ang mga anak ni Dan at nakipaglaban sa Lesem. Sinakop nila ito at nilupig sa talim ng tabak. Inangkin nila ito at nanirahan doon. Tinawag nilang Dan ang Lesem,[b] ayon sa pangalan ng kanilang amang si Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “lumawak nang higit sa kanila ang hangganan ng mga anak ni Dan.” Isinasalin ito ng ilan ayon sa konteksto bilang “napakaliit para sa kanila ang lupain ng mga anak ni Dan,” ngunit mas tuwirang spatial ang pananalita sa Hebreo.
    reason: alternative_reading
  - marker: b
    text: Ang Lesem ay iniuugnay sa Lais sa Mga Hukom 18:7, 14, 27, 29.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: lumampas sa kanila ang hangganan ng mga anak ni Dan
  rationale: Pinananatili ang kongkretong spatial na diwa ng mahirap na parirala sa Hebreo. Ang גְבוּל ay isinaling “hangganan” sa halip na idagdag sa pangunahing teksto ang interpretasyong “napakaliit para sa kanila.”
- source_word: בְּנֵי דָן
  choice: mga anak ni Dan
  rationale: Tuwirang pinananatili ang panlipi at pampamilyang idyoma ng Hebreo, na nauunawaan din sa modernong Filipino.
- source_word: וַיַּעֲלוּ
  choice: umahon
  rationale: Inihahatid ang karaniwang diwa ng עלה na pag-akyat o pagpunta paitaas, na maaari ring tumukoy sa kilos-militar.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: nakipaglaban sa Lesem
  rationale: Natural na Filipino para sa pakikipagdigma laban sa isang lungsod; malinaw sa konteksto na ang Lesem ang kanilang nilabanan.
- source_word: לֶשֶׁם
  choice: Lesem
  rationale: Sinusunod ang anyo ng pangalan sa tekstong Masoretiko at ginagamit ang likas na baybay-Filipino; hindi ito pinalitan ng Lais.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: sinakop nila iyon
  rationale: Ang לכד sa kontekstong militar ay pagkuha o pagsakop sa isang lungsod; natural at malinaw ang “sinakop.”
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: pinuksa sa pamamagitan ng talim ng tabak
  rationale: Pinananatili ng “talim ng tabak” ang larawang Hebreo. Ang “pinuksa” ay naghahatid ng marahas at malawakang pagpatay na ipinahihiwatig ng idyomang militar, nang hindi tinutukoy nang higit sa teksto kung sino-sino ang napatay.
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: inangkin nila iyon
  rationale: Ipinapahayag ang pagkuha nila sa lugar bilang pag-aari o nasasakupan, ang pangunahing diwa ng ירשׁ dito.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: nanirahan doon
  rationale: Natural na modernong Filipino para sa paninirahan sa nasakop na lungsod.
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: tinawag nilang Dan ang Lesem
  rationale: Malapit sa kayarian at kahulugan ng Hebreo habang malinaw na ipinakikitang binigyan nila ng bagong pangalan ang lungsod.
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: ayon sa pangalan ng kanilang amang si Dan
  rationale: Pinananatili ang “ama” bilang idyomang panlipi para sa ninuno, at likas ang ayos sa Filipino.
