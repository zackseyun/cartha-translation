revisions:
- from: Ngunit lumampas sa kanila ang hangganan ng mga anak ni Dan.[a] Kaya umahon ang mga anak ni Dan at nakipaglaban sa Lesem. Sinakop nila iyon at pinuksa sa pamamagitan ng talim ng tabak. Inangkin nila iyon at nanirahan doon. Tinawag nilang Dan ang Lesem,[b] ayon sa pangalan ng kanilang amang si Dan.
  to: Ngunit lumampas sa kanila ang hangganan ng mga anak ni Dan.[a] Kaya umakyat ang mga anak ni Dan at nakipaglaban sa Lesem. Sinakop nila ito at nilupig sa talim ng tabak. Inangkin nila ito at nanirahan doon. Tinawag nilang Dan ang Lesem,[b] ayon sa pangalan ng kanilang amang si Dan.
  rationale: Pinanatili ang mas literal na kalabuan ng unang sugnay, gaya ng English audit trail, at ang lahat ng pangalan at talababa. Ang mga pagbabago ay para sa mas natural na modernong Filipino at upang huwag palawakin ang saklaw ng marahas na idyomang Hebreo.
