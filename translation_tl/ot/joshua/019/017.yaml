  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: tl
  text: Para sa Isacar, lumabas ang ikaapat na bunot, para sa mga anak ni Isacar[a] ayon sa kani-kanilang angkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Isacar.” Ang Hebreo ay literal na “mga anak ni Isacar,” isang karaniwang pananalita para sa mga nagmula sa ninuno ng isang lipi.
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa kani-kanilang pamilya.” Sa kontekstong panlipi, ang mga “pamilya” ay malalaking pangkat ng magkakamag-anak o mga angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: Para kay Isacar
  rationale: Ipinahihiwatig ng לְ kung aling lipi ang tatanggap ng bahaging itinakda sa palabunutan. Likas sa Tagalog ang “para kay Isacar” kapag ang pangalan ng ninuno ang kumakatawan sa lipi.
- source_word: יָצָא הַגּוֹרָל הָרְבִיעִי
  choice: ang ikaapat na lumabas sa palabunutan
  rationale: Pinananatili ng “lumabas” ang larawan ng pandiwang יָצָא sa proseso ng pagbunot, samantalang malinaw na ipinahihiwatig ng “sa palabunutan” ang kahulugan ng גּוֹרָל sa kontekstong ito. Iniwasan ang “ikaapat na bahagi” dahil teritoryo na ang tuwirang itutukoy niyon sa halip na ang loteng binunot.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: para sa mga anak ni Isacar
  rationale: Tuwirang pinananatili ang panlipi at pangangkan na pananalitang “mga anak ni Isacar.” Sa konteksto, kabilang dito ang mga inapo at mga kasapi ng liping nagmula kay Isacar.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa paghahati ng lupa sa mga lipi, ang מִשְׁפָּחוֹת ay tumutukoy sa mas maliliit na pangkat ng angkan. Mas tiyak dito ang “angkan” kaysa sa modernong “pamilya,” at ipinahahayag ng “kani-kanilang” ang pangmaramihang hulaping “kanila.”
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “palabunutan” upang maging malinaw sa karaniwang mambabasa ang sinaunang paraan ng pagtatalaga, habang pinanatili ng “lumabas” ang kongkretong larawan ng tekstong Hebreo. Ang bahagyang pag-uulit ng “para” at “Isacar” ay sinadyang panatilihin dahil naroon din ang diin at pag-uulit sa Hebreo.
