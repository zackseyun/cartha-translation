  text: Eltekeh, Gibbethon, and Baalath.
translation:
  language: tl
  text: Elteke, Gibeton, at Baalat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְתְּקֵה
  choice: Elteke
  rationale: Pangalan ng isang lugar sa talaan ng mga bayan. Isinatinig ito ayon sa anyong Hebreo at sa likas na baybay sa modernong Filipino.
- source_word: גִבְּתוֹן
  choice: Gibeton
  rationale: Pangalan ng lugar. Ginamit ang “Gibeton” bilang malinaw at madaling bigkasing transliterasyon sa Filipino; hindi kailangang katawanin ng dobleng titik ang dagesh ng Hebreo.
- source_word: בַעֲלָת
  choice: Baalat
  rationale: Pangalan ng lugar, kaya isinalin ito sa pamamagitan ng transliterasyon at hindi ayon sa kahulugan ng kaugnay na salitang Baal. Pinanatili ng hulaping “t” ang huling tav.
- source_word: וְ / וּ
  choice: at
  rationale: Ang mga pang-ugnay na Hebreo ay nagdurugtong sa mga pangalan sa payak na talaan. Sa natural na Filipino, kuwit ang ginamit sa unang pagitan at “at” bago ang huling pangalan.
theological_decisions: []
translation_notes:
  register: Maikli at dignified na modernong Filipino para sa talaan ng mga bayan. Ang mga pangalan ay transliterado sa paraang madaling basahin at bigkasin ng karaniwang mambabasang Filipino.
