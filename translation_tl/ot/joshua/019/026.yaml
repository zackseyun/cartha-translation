base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/026.yaml
  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: tl
  text: at ang Alamelec, Amad, at Misal; umabot ang hangganan sa Carmel pakanluran[a], at sa Sihor-libnat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “patungo sa dagat”; sa kontekstong heograpiko, nangangahulugan itong “pakanluran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלַּמֶּלֶךְ
  choice: Alamelec
  rationale: Pangalan ng lugar; isinatitik sa anyong madaling basahin sa Filipino sa halip na isalin ang posibleng kahulugan nito.
- source_word: עַמְעָד
  choice: Amad
  rationale: Pangalan ng lugar; ginamit ang payak at malinaw na transliterasyon.
- source_word: מִשְׁאָל
  choice: Misal
  rationale: Pangalan ng lugar; isinatitik ayon sa bigkas na angkop sa karaniwang ortograpiyang Filipino.
- source_word: וּפָגַע
  choice: umabot ang hangganan
  rationale: Sa talaan ng mga hangganan, ang pandiwa ay nangangahulugang umabot, sumagi, o nakatagpo sa isang palatandaan. Nilinaw ang ipinahihiwatig na simuno na 'ang hangganan' upang maging natural sa Filipino nang hindi nagdaragdag ng bagong heograpikong detalye.
- source_word: בְּכַרְמֶל
  choice: sa Carmel
  rationale: Ipinakikita ng pang-ukol ang lugar na inabot ng hangganan; natural sa Filipino ang 'sa' sa ganitong paglalarawan.
- source_word: הַיָּמָּה
  choice: pakanluran
  rationale: Literal itong tumutukoy sa direksiyong patungo sa dagat, ngunit sa heograpiyang Hebreo karaniwang nangangahulugan itong pakanluran dahil nasa kanluran ang Dagat Mediteraneo.
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: at sa Sihor-libnat
  rationale: Itinuring na tambalang pangalan ng lugar at pinanatili ang gitling; ipinagpapatuloy ng 'sa' ang paglalarawan sa mga puntong inabot ng hangganan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyo ng talaan ng mga lugar, at ginawang tahasan ang ipinahihiwatig na 'hangganan' upang maging likas ang pangungusap. Inilipat ang talababa sa 'pakanluran,' ang salitang aktuwal nitong ipinapaliwanag.
