  source_fidelity: 'Tapat ang salin sa Hebreong talaan ng mga lugar: napanatili ang pangatnig at ang tatlong toponimo. Ang anyong Filipino na “Bet-marcabot” at “Hazar-susa” ay katanggap-tanggap na transliterasyon ng mga pangalang lugar; ang kanilang mga kahulugan ay hindi ipinilit sa pangunahing teksto.'
