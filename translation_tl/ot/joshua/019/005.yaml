  text: at Ziklag, Bet-marcabot[a], at Hazar-susa[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bet-marcabot ay malamang na nangangahulugang “bahay ng mga karwahe.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hazar-susa ay malamang na nangangahulugang “pamayanan ng mga kabayo” o “kulungan ng mga kabayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Pangalan ng isang lugar; ginamit ang karaniwang anyong transliterado sa Filipino.
- source_word: בֵית הַמַּרְכָּבוֹת
  choice: Bet-marcabot
  rationale: Tambalang pangalan ng lugar mula sa mga salitang nangangahulugang ‘bahay’ at ‘mga karwahe.’ Pinanatili bilang pangalan sa pangunahing teksto at ipinaliwanag ang kahulugan sa talababa.
- source_word: חֲצַר סוּסָה
  choice: Hazar-susa
  rationale: Tambalang pangalan ng lugar na kaugnay ng isang pamayanan o kulungan at ng mga kabayo. Pinanatili bilang pangalan sa pangunahing teksto at ipinaliwanag ang posibleng kahulugan sa talababa.
- source_word: וְ / וּ / וַ
  choice: at
  rationale: Ang mga anyo ng pangatnig na waw ay nag-uugnay sa mga pangalan sa talaan; natural na isinalin sa Filipino bilang ‘at.’
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Isina-Filipino ang transliterasyon ng mga tambalang pangalan, habang pinanatili sa mga talababa ang posibleng literal na kahulugan. Ang panimulang ‘at’ at pangwakas na tuldok-kuwit ay angkop sa pagpapatuloy ng talaan ng mga bayan.
