  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְכַלּ֥וּ לִ/נְחֹל אֶת הָ/אָ֖רֶץ לִ/גְבֽוּלֹתֶ֑י/הָ וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל נַחֲלָ֛ה לִ/יהוֹשֻׁ֥עַ בִּן נ֖וּן בְּ/תוֹכָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: tl
  text: Nang matapos nilang ipamahagi bilang mana ang lupain ayon sa mga hangganan nito[a], binigyan ng mga anak ni Israel[b] si Josue na anak ni Nun ng mana sa kanilang gitna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa mga teritoryo nito.” Maaaring tumukoy ang Hebreo sa mga hangganan o sa mga teritoryal na dibisyon.
    reason: lexical_alternative
  - marker: b
    text: O “mga Israelita.” Literal na “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: Nang matapos nila
  rationale: Ang pandiwa ay nagsasaad ng natapos na kilos sa daloy ng salaysay; likas sa Tagalog ang sugnay na temporal na “Nang matapos nila” bago ang sumunod na pangyayari.
- source_word: לִנְחֹל
  choice: hati-hatiin bilang mana
  rationale: Sa konteksto ng Josue 13–19, tumutukoy ito sa pamamahagi ng lupain bilang minanang bahagi, hindi lamang sa pag-angkin o paninirahan dito.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa lupaing ipinamahagi sa mga lipi, hindi sa buong daigdig.
- source_word: לִגְבוּלֹתֶיהָ
  choice: ayon sa mga nasasakupan nito
  rationale: Maaaring tumukoy ang גְּבוּל sa hangganan o sa teritoryong nasasakupan. Ipinapahayag ng salin ang mga teritoryal na bahagi habang pinananatili sa talababa ang kahulugang nakatuon sa mga guhit ng hangganan.
- source_word: וַיִּתְּנוּ
  choice: binigyan
  rationale: Tuwirang ipinapahayag ng karaniwang pandiwang נתן ang pagbibigay; nililinaw ng konteksto na mana o takdang bahagi sa lupain ang ibinigay.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pormal na pambansang katawagan sa Hebreo, samantalang inilalahad sa talababa ang mas karaniwang “mga Israelita.”
- source_word: נַחֲלָה
  choice: mana
  rationale: Pinananatili ng “mana” ang legal at tipanang diwa ng lupaing natanggap bilang itinakdang bahagi.
- source_word: לִיהוֹשֻׁעַ בִּן נוּן
  choice: si Josue na anak ni Nun
  rationale: Ito ang malinaw at likas na anyo ng pangalan at patronimiko sa modernong Tagalog.
- source_word: בְּתוֹכָם
  choice: sa gitna nila
  rationale: Ipinakikitang ang mana ni Josue ay ibinigay sa loob ng pamayanan at ng mga bahaging ipinamahagi sa Israel, hindi hiwalay sa kanila.
theological_decisions:
- issue: Pambansang katawagang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang literal na anyo ay isang nakaugaliang pambansang katawagan sa salaysay. Pinanatili ito sa pangunahing teksto nang hindi ipinapalagay na mga lalaking Israelita lamang ang tinutukoy; ibinigay ang mas idiomatikong alternatibo sa talababa.
- issue: Diwa ng נַחֲלָה sa pamamahagi ng lupain
  choice: mana
  alternative: takdang bahagi; pag-aari
  rationale: Ang “mana” ay nagpapanatili sa legal at tipanang diwa ng lupaing ipinagkaloob bilang bahagi, nang hindi ito pinapakitid sa karaniwang pag-aari lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hati-hatiin bilang mana” upang maging madaling maunawaan ang gawaing pamamahagi nang mapanatili ang mahalagang diwa ng mana; pinanatili rin ang pormal na “mga anak ni Israel,” na may idiomatikong alternatibo sa talababa.
