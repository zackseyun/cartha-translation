translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lunsod,” “nayon,” “lipi,” at “angkan” upang maipakita ang mga antas ng pamayanan at pagkakamag-anak nang hindi nagiging teknikal. Pinanatili ang pagpapatuloy mula sa naunang talaan sa panimulang “pati.”
