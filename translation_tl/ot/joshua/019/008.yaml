base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: tl
  text: pati ang lahat ng nayong nakapaligid sa mga lunsod na ito, hanggang sa Baalat-beer, Ramat-negeb.[a] Ito ang mana ng lipi ng mga anak ni Simeon ayon sa kani-kanilang angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Posible ring: “Baalat-beer, na siya ring Ramat-negeb,” kung ang ikalawang pangalan ay nagpapakilala sa una bilang pangalan din ng lugar na iyon.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  choice: pati ang lahat ng nayon
  rationale: Ipinahihiwatig ng וְ ang pagpapatuloy ng naunang talaan, kaya likas sa Filipino ang “pati.” Sa kontekstong ito, ang חֲצֵרִים ay mga nakabababang pamayanang kaugnay ng mga lunsod, kaya “mga nayon” ang malinaw at karaniwang katumbas.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: nakapaligid sa mga lunsod na ito
  rationale: Tuwirang inilalarawan nito ang lokasyon ng mga nayon sa paligid ng mga nabanggit na lunsod; pinananatili ng “ito” ang malapit na demonstratibo.
- source_word: עַד
  choice: hanggang sa
  rationale: Ipinapakita nito ang hangganan o lawak ng nasasakupan sa paglalarawang heograpikal.
- source_word: בַּעֲלַת בְּאֵר
  choice: Baalat-beer
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon at hindi isinalin ang mga sangkap nito.
- source_word: רָאמַת נֶגֶב
  choice: Ramat-negeb
  rationale: Pinanatili bilang transliteradong pangalan upang hindi ipasiya kung ito ay hiwalay na lugar o ibang tawag sa Baalat-beer.
- source_word: זֹאת נַחֲלַת
  choice: Ito ang mana
  rationale: Ang sugnay sa Hebreo ay walang hayag na pandiwa. Ang kasalukuyang anyong Filipino ay natural at hindi kailangang magdagdag ng panahunan; ang “mana” ay angkop sa lupaing ipinamahagi bilang minanang pag-aari.
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: lipi ng mga anak ni Simeon
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֵּה ay tumutukoy sa isang lipi. Pinananatili ng “mga anak ni Simeon” ang genealogical na pahayag ng Hebreo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחוֹת ay mga pangkat-angkan sa loob ng lipi; ipinahihiwatig ng “kani-kanilang” ang pamamahaging naaayon sa mga pangkat na iyon.
