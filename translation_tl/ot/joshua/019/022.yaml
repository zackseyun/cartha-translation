base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: tl
  text: Sumapit ang hangganan sa Tabor[a], Shahazuma, at Bet-semes, at ang dulo ng kanilang hangganan ay nasa Jordan[b]—labing-anim na bayan, pati ang mga nayon ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umabot” o “nakipagtagpo.” Maaaring tumukoy ang pandiwang Hebreo sa pagdating ng isang linya ng hangganan sa isang lugar o sa pakikipagtagpo nito roon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang mga labasan ng kanilang hangganan ay ang Jordan.” Isa itong pormula sa paglalarawan ng hangganan na tumutukoy sa hantungan o saklaw nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע
  choice: sumapit
  rationale: Sa mga paglalarawan ng hangganan, ipinapahayag ng pandiwang פגע na ang linya ng hangganan ay umabot o nakatagpo sa isang lugar. Likas sa makabagong Filipino ang “sumapit” at pinananatili nito ang heograpikong diwa.
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Ang גְּבוּל sa mga talaan ng paghahati ng lupain ay tumutukoy sa linya o saklaw ng teritoryo; “hangganan” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: בְּתָבוֹר
  choice: sa Tabor
  rationale: Pangalan ng lugar; tinumbasan sa anyong transliterado.
- source_word: וְשַׁחֲצוּמָה
  choice: Sahazuma
  rationale: Pangalan ng lugar; transliterado ayon sa anyong Hebreo sa halip na isalin ang pangalan.
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Bet-semes
  rationale: Pangalan ng lugar; transliterado sa paraang madaling basahin sa Filipino at hindi isinalin bilang “Bahay ng Araw.”
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם
  choice: at ang dulo ng kanilang hangganan ay nasa
  rationale: Ang תֹּצְאוֹת ay literal na mga “labasan” o “pinakadulo” sa pormula ng hangganan. Ipinahahayag ng salin ang hantungan ng linya nang natural sa Filipino, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng ilog; sapat ang “Jordan” sa kontekstong heograpiko.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: labing-anim na bayan
  rationale: Tuwirang bilang at pangngalan. Ang “bayan” ay angkop sa sinaunang mga sentrong pamayanan at hindi nagpapahiwatig ng makabagong antas ng urbanisasyon.
- source_word: וְחַצְרֵיהֶן
  choice: pati ang mga nayon ng mga ito
  rationale: Sa mga talaan ng mga bayan, ang חָצֵר ay karaniwang tumutukoy sa mga nakaugnay na maliit o di-napapaderang pamayanan. Nililinaw ng “ng mga ito” na ang mga nayon ay kaugnay ng nabanggit na mga bayan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hangganan,” “bayan,” at “nayon” bilang mga salitang madaling maunawaan ngunit angkop sa sinaunang heograpikong tala. Transliterado ang mga pangalan ng lugar sa anyong madaling bigkasin sa Filipino.
