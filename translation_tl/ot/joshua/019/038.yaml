  text: וְ/יִרְאוֹן֙ וּ/מִגְדַּל אֵ֔ל חֳרֵ֥ם וּ/בֵית עֲנָ֖ת וּ/בֵ֣ית שָׁ֑מֶשׁ עָרִ֥ים תְּשַֽׁע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/038.yaml
  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: tl
  text: at Yiron, Migdal-El[a], Horem, Beth-Anat[b], at Beth-Shemesh[b]—labinsiyam na lunsod, kasama ang mga nayon ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pangalan ng lugar ang Migdal-El; literal na maaaring mangahulugan ang mga bahagi nito na “tore ng Diyos/El.”
    reason: lexical_alternative
  - marker: b
    text: Mga pangalan ng lugar ang Beth-Anat at Beth-Shemesh; literal na “bahay ni Anat” at “bahay ng araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִרְאוֹן
  choice: at Yiron
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon; ang וְ ay likas na iniugnay bilang “at” sa pagpapatuloy ng talaan.
- source_word: וּ/מִגְדַּל אֵל
  choice: Migdal-El
  rationale: Tambalang pangalan ng lugar; pinanatili ang pangalan sa halip na isalin ang literal na kahulugang “tore ng Diyos/El.”
- source_word: חֳרֵם
  choice: Horem
  rationale: Pangalan ng lugar na tuwirang isinalin sa titik na Filipino.
- source_word: וּ/בֵית עֲנָת
  choice: Beth-Anat
  rationale: Tambalang pangalan ng lugar; ginamit ang transliterasyon sa halip na literal na “bahay ni Anat.”
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: Beth-Shemesh
  rationale: Tambalang pangalan ng lugar; ginamit ang transliterasyon sa halip na literal na “bahay ng araw.”
- source_word: עָרִים
  choice: mga lunsod
  rationale: Karaniwang katumbas sa mga talaan ng paghahati ng lupain, kahit maaaring mas maliit sa modernong konsepto ng lunsod ang ilan sa mga pamayanan.
- source_word: תְּשַׁע עֶשְׂרֵה
  choice: labinsiyam
  rationale: Likas at tuwirang anyo ng bilang sa modernong Filipino.
- source_word: וְ/חַצְרֵי/הֶן
  choice: kasama ang mga nayon ng mga iyon
  rationale: Sa pormula ng paghahati ng lupain, tumutukoy ang חָצֵר sa mga nakaugnay o di-napapaderang pamayanan; nilinaw ng “mga iyon” na ang mga nayon ay sakop ng binanggit na mga lunsod.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangalan ng lugar sa transliteradong anyo at ginamit ang karaniwang pormula ng talaan. Ang pambungad na “at” ay angkop dahil bahagi ang talata ng nagpapatuloy na listahan.
