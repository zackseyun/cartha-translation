  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: tl
  text: At lumiko ang hangganan sa palibot nito, sa hilaga ng Hanaton[a], at ang mga dulo nito[b] ay nasa Lambak ng Ifta-el.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa hilaga ng Hanaton.” Maaaring unawain ang pariralang Hebreo bilang posisyon (“sa hilaga ng”) o bilang direksiyon (“mula sa hilaga ng”).
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga labasan nito,” isang katawagang ginagamit sa mga hangganan para sa mga dulo o dulong bahagi ng linya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: At lumiko ... sa palibot
  rationale: Sa mga paglalarawan ng hangganan, ang pandiwa ay tumutukoy sa pagliko o pagkurba ng linya ng hangganan; natural sa Filipino ang pariralang ito at pinananatili ang galaw.
- source_word: אֹתוֹ
  choice: nito
  rationale: Ang panghalip ay tumutukoy sa naunang pook o puntong heograpiko, hindi sa isang tao.
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Karaniwang tumutukoy ang salita sa linya ng teritoryo; malinaw at likas sa modernong Filipino ang “hangganan.”
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: sa hilaga ng Hanaton
  rationale: Maaaring ipahiwatig ng מִן kasama ng צפון ang posisyon ng hangganan kaugnay ng isang palatandaan; pinananatili ng salin ang heograpikong ugnayan at ang likas na kalabuan nito.
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: at ang mga dulo nito ay nasa
  rationale: Ang anyong maramihan ay isang terminong panghangganan para sa mga dulong bahagi o labasan ng linya; pinanatili ang maramihan sa Filipino.
- source_word: גֵּי
  choice: Lambak ng
  rationale: Ang גֵּי ay lambak o bangin; ginagamit ang “Lambak” bilang bahagi ng pangalang heograpiko.
- source_word: יִפְתַּח אֵל
  choice: Ifta-el
  rationale: Pangalan ito ng pook kaya tinumbasan sa malapit na transliterasyong madaling bigkasin sa Filipino, sa halip na isalin ang posibleng kahulugan.
