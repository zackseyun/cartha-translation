source:
  edition: WLC
  text: וַ/יְהִ֣י גְבוּלָ֗/ם מֵ/חֵ֨לֶף מֵֽ/אֵל֜וֹן בְּ/צַעֲנַנִּ֗ים וַ/אֲדָמִ֥י הַנֶּ֛קֶב וְ/יַבְנְאֵ֖ל עַד לַקּ֑וּם וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: tl
  text: Ang hangganan nila ay mula sa Helef, mula sa malaking puno sa Zaananim[a], at sa Adami-nekeb at Jabneel, hanggang sa Lakum; at nagtapos ito sa Jordan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa Elon-bezaananim.” Maaaring unawain ang Hebreo bilang pangalan ng isang lugar o bilang “ang malaking puno sa Zaananim.”
    reason: alternative_reading
  - marker: b
    text: Sa literal na Hebreo, “ang mga labasan nito ay ang Jordan,” isang pahayag na nangangahulugang sa Jordan umabot at nagtapos ang hangganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: ang hangganan nila
  rationale: Karaniwang tumutukoy ang גְּבוּל sa guhit o saklaw ng hangganan; malinaw na ang hulaping maramihan ay tumutukoy sa lipi ni Neftali.
- source_word: מֵחֵלֶף
  choice: mula sa Helef
  rationale: Pangalan ng lugar ito, kaya isinalin sa paraang transliterasyon na angkop sa modernong Filipino.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: mula sa malaking puno sa Zaananim
  rationale: Maaaring tumukoy ang אֵלוֹן sa isang malaki at kilalang puno, gaya ng roble o terebinto. Iniiwasan ng 'malaking puno' ang di-tiyak na pagkilala sa uri nito, habang pinananatili sa talababa ang posibilidad na iisang pangalan ng lugar ang buong parirala.
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: at sa Adami-nekeb
  rationale: Sa talaan ng mga hangganan, pinakamalamang na tambalang pangalan ito ng isang lugar; kaya hindi isinalin ang נֶקֶב bilang 'daanan' o 'lagusan.'
- source_word: וְיַבְנְאֵל
  choice: at Jabneel
  rationale: Pangalan ng lugar, kaya tinranslitera.
- source_word: עַד לַקּוּם
  choice: hanggang sa Lakum
  rationale: Ipinahihiwatig ng עַד ang abot ng hangganan hanggang sa isang lugar.
- source_word: תֹּצְאֹתָיו
  choice: nagtapos ito
  rationale: Literal itong tumutukoy sa mga labasan o dulong bahagi. Sa paglalarawan ng hangganan, natural na ipinapahayag sa Filipino na doon nagtapos ang hangganan.
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Ito ang karaniwang pangalan ng ilog; sapat at natural sa konteksto ang 'Jordan' nang hindi na idinaragdag ang salitang 'Ilog.'
theological_decisions: []
translation_notes:
  register: Gumamit ng natural at marangal na modernong Filipino. Pinanatili bilang mga pangalan ng lugar ang Helef, Adami-nekeb, Jabneel, at Lakum. Ginamit ang 'malaking puno' upang hindi magtakda ng tiyak na uri ng punong hindi matiyak sa אֵלוֹן, at inilagay sa talababa ang alternatibong pagbasa bilang pangalan ng lugar.
