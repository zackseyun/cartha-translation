  naturalness: Hindi gaanong natural ang “ang hangganan nila ay patungo sa Jezreel, Kesulot, at Sunem,” dahil ang “patungo sa” ay ginagawang direksiyon ang kasunod na magkakatabing listahan ng mga lugar. Ang simpleng listahan ay mas malinaw at marangal sa modernong Filipino.
  terminology: Wasto ang “hangganan” para sa גְּבוּלָם. Ang Jezreel, Kesulot, at Sunem ay katanggap-tanggap na mga anyong Filipino ng mga pangalan ng lugar. Ang ikalawang talababa ng draft ay nag-uulit lamang ng magiging pangunahing salin at samakatuwid ay hindi na nagbibigay ng tunay na alternatibo.
