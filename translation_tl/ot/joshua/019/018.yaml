  text: And their border was Jezreel[a], Chesulloth[b], and Shunem.
translation:
  language: tl
  text: At ang hangganan nila ay Jezreel[a], Kesulot, at Sunem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, may pangwakas na anyong direksiyonal ang “Jezreel”; maaari itong magpahiwatig ng “patungo sa Jezreel” o “sa Jezreel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At ... ay
  rationale: Ipinagpapatuloy ng anyong pandiwa ang salaysay at ipinakikilala ang kasunod na paglalarawan sa hangganan; natural itong naipahahayag sa Filipino sa pamamagitan ng “At ... ay.”
- source_word: גְּבוּלָם
  choice: ang hangganan nila
  rationale: Ang גְּבוּל ay tumutukoy sa hangganan ng lupain, at ang hulaping panghalip ay pangmaramihang “nila,” na tumutukoy sa naunang binanggit na lipi.
- source_word: יִזְרְעֶאלָה
  choice: patungo sa Jezreel
  rationale: Pinananatili ng “patungo sa” ang direksiyonal na hulaping -ה sa pangalan ng lugar nang hindi ipinapalagay kung ang Jezreel ay rutang dinaanan o tiyak na dulong hangganan.
- source_word: הַכְּסוּלֹת
  choice: Kesulot
  rationale: Pangalan ito ng lugar. Isinulat ito ayon sa malinaw at natural na transliterasyong Filipino; hindi hiwalay na isinalin ang pantukoy na הַ dahil bahagi ito ng anyo ng sinaunang pangalan sa kontekstong ito.
- source_word: שׁוּנֵם
  choice: Sunem
  rationale: Isinalin sa karaniwang anyong transliterado para sa mambabasang Filipino.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “hangganan” bilang natural na katawagan sa guhit o saklaw ng lupa, at pinanatili ang tunay na kalabuan ng direksiyonal na anyo sa “Jezreel” sa pamamagitan ng pangunahing salin at talababa.
