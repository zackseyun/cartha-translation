  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: tl
  text: Mula sa bahagi ng lipi ni Juda ang mana ng lipi ni Simeon[a], sapagkat napakalaki para sa kanila ang bahaging naukol sa lipi ni Juda; kaya tumanggap ng mana ang lipi ni Simeon sa loob ng mana ng Juda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak ni Juda” at “mga anak ni Simeon,” mga katawagang tumutukoy rito sa lipi ni Juda at sa lipi ni Simeon.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang lupang inilaan sa Simeon ay nasa loob ng teritoryong inilaan sa Juda.
    reason: cultural_note
lexical_decisions:
- source_word: מֵ/חֶבֶל
  choice: Mula sa bahagi
  rationale: Sa konteksto ng paghahati ng lupain, ang חֶבֶל ay isang takdang sukat o bahagi ng lupain. Likas sa Tagalog ang “bahagi” at malinaw na tumutukoy sa teritoryong inilaan.
- source_word: נַחֲלַת
  choice: ang mana
  rationale: Ang נַחֲלָה sa Josue ay lupang minana o ipinagkaloob bilang pag-aari. Pinananatili ng “mana” ang diwang pampamana at tipan, hindi lamang ang administratibong paghahati.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: lipi ni Juda / lipi ni Simeon
  rationale: Bagaman literal na “mga anak ni,” ang mga parirala rito ay karaniwang katawagan sa buong tribo. Mas natural at tiyak sa modernong Tagalog ang “lipi,” nang hindi binabago ang tinutukoy.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit nasa bahagi ng Juda ang mana ng Simeon.
- source_word: חֵלֶק
  choice: bahaging naukol
  rationale: Tumutukoy ito sa nakatalagang parte ng Juda. Ipinahihiwatig ng “naukol” ang pormal na pagkakaloob ng bahagi nang hindi nagdaragdag ng ahensiyang hindi tahasang binanggit.
- source_word: רַב מֵ/הֶם
  choice: napakalaki para sa kanila
  rationale: Ipinahahayag ng parirala na higit sa naaangkop o kailangan ng Juda ang bahaging natanggap nila. Ang salin ay natural at pinananatili ang paghahambing na nakapaloob sa Hebrew.
- source_word: וַ/יִּנְחֲלוּ
  choice: tumanggap ng mana
  rationale: Sa kontekstong ito, ang pandiwang נחל ay tumutukoy sa pagtanggap at pag-angkin sa lupang inilaan bilang mana.
- source_word: בְּ/תוֹךְ נַחֲלָתָם
  choice: sa loob ng mana ng Juda
  rationale: Ang בְּתוֹךְ ay lokatibo at nangangahulugang nasa loob. Nilinaw ang tinutukoy ng hulaping “kanila” bilang Juda ayon sa konteksto, upang maiwasan ang nakalilitong “kanilang mana.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lipi” bilang natural na katumbas ng tribal designation at “mana” upang mapanatili ang mahalagang bokabularyo ng pamana ng lupain. Ang huling reperensiya ay nilinaw bilang “mana ng Juda” ayon sa konteksto.
