base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: tl
  text: Mula roon ay lumiko ang hangganan pasilangan, patungo sa sikatan ng araw, sa Bet-Dagon. Umabot ito sa Zebulun at sa Lambak ng Ifta-El sa gawing hilaga, sa Bet-Emek at Neiel. Pagkatapos, nagpatuloy ito patungong Cabul sa kaliwang panig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa kaliwa.” Sa mga paglalarawan ng hangganan, maaaring tumukoy ito sa hilagang panig, depende sa direksiyong hinaharap ng nagmamasid.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: Mula roon ay lumiko ang hangganan
  rationale: Sa paglalarawan ng mga hangganan, ang pandiwa ay tumutukoy sa pagbabago ng direksiyon. Idinagdag ang “ang hangganan” bilang malinaw na paksa mula sa konteksto.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: pasilangan, patungo sa sikatan ng araw
  rationale: Ipinahahayag ng “pasilangan” ang heograpikong diwa, samantalang pinananatili ng “patungo sa sikatan ng araw” ang larawan ng idyomang Hebreo.
- source_word: בֵּית דָּגֹן
  choice: Bet-Dagon
  rationale: Pangalan ng lugar; isinalin sa baybay na madaling basahin sa modernong Filipino sa halip na isalin ang mga bahagi ng pangalan.
- source_word: וּפָגַע
  choice: Umabot ito
  rationale: Sa mga talaan ng hangganan, ipinahihiwatig ng pandiwa na ang guhit ng hangganan ay sumapit o dumikit sa isang lupain.
- source_word: בִּזְבֻלוּן
  choice: sa Zebulun
  rationale: Tinutukoy ang teritoryong inabot ng hangganan; pinanatili ang kinikilalang pangalan.
- source_word: וּבְגֵי יִפְתַּח אֵל
  choice: at sa Lambak ng Ifta-El
  rationale: Isinalin ang karaniwang pangngalang גֵי bilang “Lambak” at tinumbasan nang malapit sa Hebreo ang pangalang Ifta-El.
- source_word: צָפוֹנָה
  choice: sa gawing hilaga
  rationale: Natural na Filipino para sa pang-abay na nagsasaad ng direksiyon o hilagang panig.
- source_word: בֵּית הָעֵמֶק
  choice: Bet-Emek
  rationale: Pangalan ng lugar; isinalin sa baybay sa halip na gawing “Bahay ng Lambak.”
- source_word: וּנְעִיאֵל
  choice: at Neiel
  rationale: Pinanatili bilang pangalan ng lugar sa anyong madaling basahin sa Filipino.
- source_word: וְיָצָא
  choice: Pagkatapos, nagpatuloy ito
  rationale: Sa pormulang panghangganan, inilalarawan ng pandiwa ang pagpapatuloy o paglabas ng guhit patungo sa susunod na palatandaan; “nagpatuloy” ang mas natural na heograpikong pahayag sa Filipino.
- source_word: אֶל כָּבוּל
  choice: patungong Kabul
  rationale: Pangalan ng lugar na tinumbasan nang malapit sa tunog ng Hebreo; ang K ay angkop sa modernong ortograpiyang Filipino.
- source_word: מִשְּׂמֹאל
  choice: sa kaliwang panig
  rationale: Pinananatili sa pangunahing teksto ang kongkretong “kaliwa” sa halip na tahimik na ipalit ang interpretasyong “hilaga.” Ipinaliliwanag sa talababa ang literal na anyo at posibleng heograpikong diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hangganan” bilang tahasang paksa upang madaling masundan ang mahabang talaang heograpiko. Isinalin ang karaniwang katawagang “lambak,” ngunit tinransliterado ang mga pangalan ng lugar. Inilagay ang talababa sa “kaliwang panig,” ang pariralang talagang kaugnay ng paliwanag sa Hebreo.
