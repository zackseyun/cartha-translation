revisions:
- from: Mula roon ay lumiko ang hangganan pasilangan, patungo sa sikatan ng araw, sa Bet-Dagon. Umabot ito sa Zebulun at sa Lambak ng Ifta-El sa gawing hilaga, hanggang sa Bet-Emek at Neiel. Pagkatapos, nagpatuloy ito patungong Kabul sa kaliwang panig.[a]
  to: Mula roon ay lumiko ang hangganan pasilangan, patungo sa sikatan ng araw, sa Bet-Dagon. Umabot ito sa Zebulun at sa Lambak ng Ifta-El sa gawing hilaga, sa Bet-Emek at Neiel. Pagkatapos, nagpatuloy ito patungong Cabul sa kaliwang panig.[a]
  rationale: Pinalitan ang "hanggang sa" ng simpleng "sa" upang hindi magdagdag ng relasyong heograpiko na hindi tahasang nasa Hebreo. Ginawang "Cabul" ang pangalan upang maging pare-pareho sa audit trail at sa karaniwang biblikal na baybay. Pinanatili ang lahat ng iba pang mahahalagang kahulugan, kabilang ang literal na "kaliwang panig" at ang talababa nito.
