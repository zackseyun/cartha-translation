  terminology: Ang "hangganan," "Lambak," at mga transliteradong pangalan ay angkop. Pinananatili ang literal na "kaliwang panig" at ang maingat na talababa hinggil sa posibleng heograpikong implikasyon nito. Ginamit ang "Cabul" upang iayon sa kumbensiyonal na anyong biblikal at maiwasan ang kalituhan sa modernong Kabul.
