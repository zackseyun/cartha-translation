  source_fidelity: Ang talaan ng limang lugar at ang pang-ugnay na “At” ay wastong kumakatawan sa Hebreong teksto. Gayunman, ang “mga lunsod na may kuta” ay maaaring mangahulugang mga lunsod na mayroon lamang kuta sa loob o malapit sa mga ito, samantalang ang עָרֵי מִבְצָר ay tumutukoy sa mga lunsod na pinatibay o kinutaang lunsod.
  naturalness: Natural at malinaw ang sintaksis at ang talaan ng mga pangalan. Mas tiyak at likas sa modernong Filipino ang “mga pinatibay na lunsod” para sa paglalarawang militar.
