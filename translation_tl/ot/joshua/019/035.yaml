  text: וְ/עָרֵ֖י מִבְצָ֑ר הַ/צִּדִּ֣ים צֵ֔ר וְ/חַמַּ֖ת רַקַּ֥ת וְ/כִנָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/035.yaml
  text: And the fortified cities were Ziddim[a], Zer, Hammath, Rakkath, and Kinnereth.
translation:
  language: tl
  text: At ang mga pinatibay na lunsod ay ang Ziddim[a], Zer, Hammat, Rakkat, at Kinneret.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lunsod-kuta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: At ang mga lunsod na may kuta
  rationale: Ipinagpapatuloy ng וְ ang talaan, kaya natural ang “At.” Ang pariralang construct na עָרֵי מִבְצָר ay malinaw at likas na naipapahayag sa modernong Tagalog bilang “mga lunsod na may kuta,” habang pinananatili ang diwang militar.
- source_word: הַ/צִּדִּים
  choice: Ziddim
  rationale: Pangalan ng lugar ito; hindi isinama ang artikulong Hebreo sa salin, gaya ng karaniwang ginagawa sa talaan ng mga pangalan ng bayan.
- source_word: צֵר
  choice: Zer
  rationale: Tuwirang transliterasyon ng pangalan ng lugar.
- source_word: וְ/חַמַּת
  choice: Hammat
  rationale: Transliterasyon ng pangalan na kumakatawan sa dobleng katinig sa anyong Hebreo at naiiwasang ipagkamali sa mas kilalang Hamath.
- source_word: רַקַּת
  choice: Rakkat
  rationale: Transliterasyon na kumakatawan sa dobleng gitnang katinig at gumagamit ng anyong madaling basahin sa Filipino.
- source_word: וְ/כִנָּרֶת
  choice: Kinneret
  rationale: Transliterasyon ng pangalan ayon sa anyong Hebreo, na natural basahin sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “lunsod” para sa mga bayang nakatala at “may kuta” bilang natural na paglalarawan sa עָרֵי מִבְצָר. Pinanatili ang mga pangalan bilang transliterasyon, na may baybay na angkop sa Filipino.
