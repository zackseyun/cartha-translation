  yaml_path: translation/ot/joshua/019/006.yaml
  text: 'Beth-lebaoth and Sharuhen: thirteen cities[a], with their villages.'
translation:
  language: tl
  text: Bet-lebaot at Sharuhen[a]—labintatlong lungsod, kasama ang mga nayon ng mga lungsod na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sharuhen ang nasa tekstong Hebreo rito; Shilhim naman ang baryanteng pangalan sa kahilerang talaan sa Josue 15:32.
    reason: textual_variant
lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: Bet-lebaot
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin ang literal na kahulugang “bahay ng mga babaeng leon.”
- source_word: שָׁרוּחֶן
  choice: Sharuhen
  rationale: Sinunod ang pangalang mababasa sa tekstong Masoretiko rito; ang Shilhim sa Josue 15:32 ay inilagay sa talababa bilang baryante sa kahilerang talaan.
- source_word: עָרִים
  choice: mga lungsod
  rationale: Karaniwang katumbas ng עִיר sa mga talaan ng paghahati ng lupain at angkop sa marangal na rehistro ng teksto.
- source_word: שְׁלֹשׁ עֶשְׂרֵה
  choice: labintatlo
  rationale: Tuwirang makabagong Tagalog para sa bilang na labintatlo.
- source_word: חַצְרֵיהֶן
  choice: mga nayon ng mga iyon
  rationale: Sa pormula ng mga takdang lupain, tumutukoy ito sa mga nakaugnay at karaniwang di-napapaderang pamayanan; nililinaw ng “ng mga iyon” na ang mga nayon ay kaugnay ng nabanggit na mga lungsod.
