  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר תְּנ֤וּ לָ/כֶם֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁר דִּבַּ֥רְתִּי אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: tl
  text: 'Sabihin mo sa mga anak ni Israel: ‘Magtalaga kayo para sa inyong mga sarili ng mga lungsod na kanlungan na sinabi ko sa inyo sa pamamagitan ni Moises.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sabihin mo
  rationale: Ang Piel imperative ay tuwirang utos kay Josue. Mas natural sa makabagong Tagalog ang “Sabihin mo” kaysa “Magsalita ka” kapag may kasunod na taong pagsasabihan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pamilyang anyo ng Hebreo at ang tradisyonal na katawagan sa bayang tipan, sa halip na gawing etnikong katawagang “mga Israelita.”
- source_word: לֵאמֹר
  choice: ipinahihiwatig ng panipi
  rationale: Ang quotative infinitive ay likas na naipapahayag sa Tagalog sa pamamagitan ng pandiwang “sabihin” at tuwirang panipi; ang hiwalay na “na sinasabi” ay magiging mabigat at di-likas.
- source_word: תְּנוּ לָכֶם
  choice: Magtalaga kayo para sa inyong sarili
  rationale: 'Bagaman literal na “magbigay,” administratibo rito ang diwa: italaga o ibukod ang mga lungsod para sa isang tiyak na tungkulin. Pinananatili rin ang reflexive na לָכֶם.'
- source_word: עָרֵי הַמִּקְלָט
  choice: mga lungsod na kanlungan
  rationale: Malinaw at natural na katawagan para sa mga lungsod na itinakdang pagtakbuhan at proteksiyon; hindi nito dinaragdagan ang legal na konsepto.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: na sinabi ko sa inyo
  rationale: Natural sa Tagalog ang “sinabi ... sa inyo” upang tukuyin ang naunang tagubilin tungkol sa mga lungsod; hindi kailangang idagdag ang mabigat na “tungkol sa mga iyon.”
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang idyomang Hebreo na literal na “sa kamay ni Moises” ay nagpapahayag ng mediated agency. Tumpak at natural itong naihahatid ng “sa pamamagitan ni Moises.”
theological_decisions:
- issue: Ang pamilyang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang tunay na panlalaking maramihang pamilyang pahayag ng pinagmulan, na nakagawiang tumutukoy sa buong bayang tipan, nang hindi ito pinapalitan ng mas pangkalahatang etnikong katawagan.
- issue: Ang idyoma ng agency na בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  alternative: sa kamay ni Moises
  rationale: Ipinakikita nito na ang Diyos ang nagsalita at si Moises ang tagapamagitan ng naunang utos. Ang literal na “sa kamay” ay maaaring mapagkamalang pisikal na paglalarawan sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang utos at pangkaraniwang bokabularyo, habang pinananatili ang pormal na katawagang “mga anak ni Israel.” Walang talababa dahil walang kailangang alternatibong pagbasa para maunawaan ang talata.
