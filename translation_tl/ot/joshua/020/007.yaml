base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: tl
  text: Kaya itinalaga nila ang Kedes sa Galilea, sa kabundukan ng Naftali; ang Shekem sa kabundukan ng Efraim; at ang Kiriat-arba[a] (iyon ay Hebron) sa kabundukan ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Kiriat-arba, iyon ay Hebron”—ibig sabihin, ang Kiriat-arba ay isa pang pangalan ng Hebron.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: itinalaga nila
  rationale: Sa kontekstong legal at panlungsod, tumutukoy ang pandiwa sa pormal na paglalaan ng mga lungsod para sa natatanging layunin bilang mga lungsod na kanlungan. Mas malinaw dito ang “itinalaga” kaysa sa mga salitang nagpapahiwatig ng rituwal na pagpapabanal.
- source_word: קֶדֶשׁ
  choice: Kedes
  rationale: Pangalan ng lugar; ginamit ang anyong transliterado at madaling bigkasin sa Filipino.
- source_word: בַּגָּלִיל
  choice: sa Galilea
  rationale: Karaniwang anyong Filipino ng pangalan ng rehiyong Galilea.
- source_word: בְּהַר נַפְתָּלִי
  choice: sa kabundukan ng Naftali
  rationale: Ang הַר dito ay tumutukoy sa mataas o mabundok na rehiyon, hindi sa iisang bundok.
- source_word: שְׁכֶם
  choice: Shekem
  rationale: Pangalan ng lugar; transliterasyon na nagpapanatili sa tunog ng Hebreo.
- source_word: בְּהַר אֶפְרָיִם
  choice: sa kabundukan ng Efraim
  rationale: Ipinahihiwatig ng parirala ang mataas na rehiyong kaugnay ng Efraim, hindi ang isang tuktok lamang.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiriat-arba
  rationale: Itinuring bilang nakapirming pangalan ng lugar sa halip na isaling “Lungsod ni Arba.”
- source_word: הִיא חֶבְרוֹן
  choice: (iyon ay ang Hebron)
  rationale: Malinaw at natural na ipinapakita ang pagkakakilanlan ng Kiriat-arba bilang Hebron habang pinananatili ang paliwanag na nasa tekstong Hebreo.
- source_word: בְּהַר יְהוּדָה
  choice: sa kabundukan ng Juda
  rationale: Tumutukoy ang parirala sa mabundok na rehiyon ng Juda.
