translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kabundukan” para sa panrehiyong diwa ng הַר at ang mga semicolon upang madaling maunawaan ang tatlong magkakatumbas na lugar sa talaan. Inilagay ang talababa sa “Kiriat-arba,” ang pangalang talagang ipinaliliwanag nito.
