  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lunsod” at “pintuang-bayan” upang mapanatili ang pampublikong at legal na tagpuan. Inilipat ang mga panandang talababa sa mismong mga pariralang tinatalakay ng mga ito.
