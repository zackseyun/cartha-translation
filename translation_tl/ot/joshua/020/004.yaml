base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: tl
  text: Tatakas siya patungo sa isa sa mga lunsod na ito at tatayo sa pasukan ng pintuang-bayan. Ilalahad niya sa pandinig ng mga matatanda ng lunsod na iyon ang kanyang usapin.[a] Pagkatapos, dadalhin nila siya sa lunsod upang makasama nila,[b] at bibigyan nila siya ng lugar, at maninirahan siya kasama nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanyang mga salita” o “ang kanyang bagay”; maaaring tumukoy ang Hebreo sa mismong mga salitang binigkas niya o sa usaping iniharap niya.
    reason: lexical_alternative
  - marker: b
    text: O “tatanggapin nila siya sa lunsod sa kanilang piling”; ang pandiwang Hebreo ay maaaring mangahulugang “tipunin,” “dalhin papasok,” o “tanggapin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: Tatakas siya
  rationale: Ang anyong pandiwa sa konteksto ng sunod-sunod na legal na tagubilin ay tumutukoy sa dapat na susunod na kilos; malinaw at natural sa Filipino ang panghinaharap.
- source_word: אַחַת מֵהֶעָרִים הָאֵלֶּה
  choice: isa sa mga lunsod na ito
  rationale: Tumpak at likas na Filipino para sa partitive na konstruksyon.
- source_word: וְעָמַד פֶּתַח שַׁעַר הָעִיר
  choice: tatayo sa pasukan ng pintuang-bayan
  rationale: Pinananatili ang larawan ng pagharap sa bukana ng tarangkahan, na sentro rin ng pampublikong pamamahala at paghatol.
- source_word: וְדִבֶּר בְּאָזְנֵי
  choice: Ilalahad niya sa pandinig ng
  rationale: Ang idyomang Hebreo ay nangangahulugang magsalita upang marinig; ang “ilalahad” ay angkop sa pormal na paghaharap ng usapin.
- source_word: זִקְנֵי הָעִיר הַהִיא
  choice: mga matatandang pinuno ng lunsod na iyon
  rationale: Ipinahihiwatig na ang tinutukoy ay mga kinikilalang nakatatandang tagapamahala, hindi lamang matatanda sa edad, at pinananatili ang pagiging tiyak ng “lunsod na iyon.”
- source_word: אֶת דְּבָרָיו
  choice: ang kanyang usapin
  rationale: Sa kontekstong panghukuman, ang דָּבָר ay maaaring tumukoy sa mga sinabi, bagay, o kasong inilalahad; “usapin” ang malinaw ngunit sapat na malawak na salin.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: tatanggapin nila siya sa kanilang lunsod
  rationale: Ipinapahayag nito ang opisyal na pagtanggap at pagpapapasok sa loob ng pamayanan, habang hindi ginagawang mas tiyak kaysa sa Hebreo ang paraan ng pagkilos.
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: bibigyan ng isang lugar
  rationale: Pinananatili ang malawak na kahulugan ng מָקוֹם at hindi nililimitahan ito sa matutuluyan lamang.
- source_word: וְיָשַׁב עִמָּם
  choice: maninirahan siya kasama nila
  rationale: Sa kontekstong ito, ang יָשַׁב ay tumutukoy sa paninirahan o pagtahan, hindi lamang sa pag-upo.
