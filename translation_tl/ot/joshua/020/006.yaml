source:
  edition: WLC
  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: tl
  text: At mananatili siya sa lungsod na iyon hanggang sa humarap siya sa kapulungan para sa paghatol[a], hanggang sa mamatay ang punong pari na nanunungkulan sa panahong iyon. Pagkatapos, maaari nang bumalik ang nakapatay at pumunta sa kanyang lungsod at sa kanyang bahay[b], sa lungsod na pinagtakasan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pamayanan.” Ang Hebreo ay tumutukoy sa nagkakatipong pamayanan na nagsasagawa ng legal na paghatol.
    reason: lexical_alternative
  - marker: b
    text: Ang “nakapatay” ay hindi awtomatikong nangangahulugang “mamamatay-tao.” Sa batas tungkol sa mga lungsod-kanlungan, hindi pa ipinapalagay na sinadya ang pagpatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב בָּעִיר הַהִיא
  choice: mananatili siya sa lungsod na iyon
  rationale: Sa legal na konteksto ng lungsod-kanlungan, ipinahihiwatig ng ישב ang patuloy na paninirahan o pananatili. Ang “mananatili” ay natural sa Filipino at malinaw na nagpapahayag ng obligasyong huwag umalis.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: hanggang sa humarap siya sa kapulungan upang hatulan
  rationale: Ang עמד לפני ay idyomang nangangahulugang humarap sa isang may awtoridad. Ang לַמִּשְׁפָּט ay tumutukoy sa legal na paghatol; pinananatili ng salin ang kapulungan bilang katawang nagsasagawa ng pagdinig.
- source_word: הָעֵדָה
  choice: kapulungan
  rationale: Tumutukoy ito sa nagkakatipong pamayanan ng Israel, dito ay gumaganap sa usaping legal. Ang “kapulungan” ay pormal ngunit madaling maunawaan; maaaring ding isalin na “pamayanan.”
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל
  choice: hanggang sa mamatay ang punong pari
  rationale: Direkta at natural na salin ng pariralang tumutukoy sa kamatayan ng הכהן הגדול. Ang “punong pari” ang karaniwang titulong Filipino.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: na nanunungkulan nang mga panahong iyon
  rationale: Tinutukoy ng sugnay ang punong paring nasa tungkulin sa panahong iyon. Nililinaw ng “nanunungkulan” ang gampaning tinutukoy nang hindi nagdaragdag ng doktrinal na kahulugan.
- source_word: אָז יָשׁוּב
  choice: Pagkatapos, makababalik
  rationale: Sa batas na ito, ang pagbabalik ay pinahihintulutan matapos matupad ang itinakdang kondisyon. Ang “makababalik” ay nagpapahayag ng pinahintulutang pagbabalik nang hindi ito ginagawang sapilitang pangyayari.
- source_word: הָרֹצֵחַ
  choice: ang nakapatay
  rationale: Sa konteksto ng mga lungsod-kanlungan, hindi pa ipinapalagay ng salita na sadyang pagpatay ang naganap. Ang “nakapatay” ay neutral sa antas ng pananagutan at mas natural kaysa sa makalumang “mamamatay-tao,” na madaling maunawaang mamamatay.
- source_word: וּבָא אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: at makauuwi sa kanyang lungsod at sa kanyang bahay
  rationale: Ipinapanumbalik ng Hebreo ang tao kapuwa sa kanyang lungsod at sambahayan. Ang “makauuwi” ay natural na katumbas ng pagbabalik at pagdating, habang pinananatili ang dalawang hantungan.
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: sa lungsod na kanyang tinakasan
  rationale: Natural na inilalahad sa Filipino ang pinanggalingang lungsod na iniwan niya sa pagtakas, habang pinananatili ang pag-uulit na nagbibigay-linaw sa hantungan.
theological_decisions:
- issue: Legal na katayuan ng הָרֹצֵחַ sa batas tungkol sa lungsod-kanlungan
  choice: “ang nakapatay,” hindi “mamamatay-tao” o “mamatay-tao”
  alternative: “ang pumatay,” “ang salarin,” o “ang mamamatay-tao”
  rationale: Ibinubukod ng mas malawak na konteksto ang di-sinasadyang pagpatay sa sinadyang pagpaslang. Hindi dapat ipasok ng salin ang hatol na mamamatay ang tao bago iyon matukoy sa legal na pagdinig.
- issue: Lakas ng pandiwang אָז יָשׁוּב matapos mamatay ang punong pari
  choice: “makababalik,” bilang pinahintulutang pagbabalik
  alternative: “babalik,” bilang simpleng hinaharap o utos
  rationale: Ang konteksto ay legal na pag-aalis ng restriksiyon. Ipinahihiwatig ng “makababalik” ang pahintulot nang hindi sinasabing tiyak o sapilitan siyang babalik.
- issue: Ugnayan ng pagharap sa kapulungan at pananatili hanggang sa kamatayan ng punong pari
  choice: Pinanatili ang dalawang sugnay na “hanggang” nang hindi nilulutas ang kanilang eksaktong kronolohikal na ugnayan
  alternative: Ipaliwanag na matapos ang paglilitis ay mananatili siya roon hanggang mamatay ang punong pari
  rationale: May siksik na legal na pagkakasunod-sunod ang Hebreo. Pinananatili ng salin ang tunay na anyo at tensiyon nito sa halip na magdagdag ng paliwanag na wala mismo sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod,” “kapulungan,” at “punong pari” para sa dignidad ng legal na teksto, ngunit iniwasan ang labis na makalumang bokabularyo. Ang dalawang talababa ay kapwa may katugmang marker sa pangunahing teksto.
