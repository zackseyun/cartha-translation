base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: tl
  text: upang doon makatakas ang sinumang nakapatay ng tao nang hindi sinasadya[a] at nang walang kaalaman, at ang mga iyon ay magsisilbing kanlungan ninyo laban sa tagapaghiganti ng dugo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nakapatay” o “tagapatay”; nililinaw ng “nang hindi sinasadya” at “nang walang kaalaman” na hindi sinadyang mamamatay-tao ang tinutukoy rito.
    reason: lexical_alternative
  - marker: b
    text: Ang “tagapaghiganti ng dugo” ay ang taong may pananagutang ipaghiganti ang pagkamatay ng isang kaanak sa sistemang pampamilya at legal ng sinaunang Israel.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: makatakas doon
  rationale: Ipinapahayag ng infinitive na may ל ang layunin ng pagtatalaga sa mga lungsod. Likas sa modernong Tagalog ang “upang makatakas doon.”
- source_word: רוֹצֵחַ
  choice: sinumang makapatay
  rationale: Sa kontekstong ito, nililinaw ng kasunod na mga parirala na hindi sinadya ang pagkamatay. Iniiwasan ng “makapatay” ang pahiwatig ng sinadyang pagpaslang na taglay ng “mamamatay-tao.”
- source_word: מַכֵּה נֶפֶשׁ
  choice: makapatay ng tao
  rationale: Ang literal na larawan ay paghampas sa isang נֶפֶשׁ, ngunit sa legal na idyomang ito ay tumutukoy ito sa pagkitil ng buhay ng isang tao. Malinaw at likas sa Tagalog ang “makapatay ng tao.”
- source_word: נֶפֶשׁ
  choice: tao
  rationale: Dito ay tumutukoy ang salita sa isang taong pinatay, hindi sa “kaluluwa” bilang hiwalay na konsepto.
- source_word: בִּשְׁגָגָה
  choice: nang hindi sinasadya
  rationale: Tumpak nitong ipinahahayag ang di-sinasadyang pagkilos sa legal na konteksto.
- source_word: בִּבְלִי דָעַת
  choice: at hindi nalalaman
  rationale: Pinananatili nito ang hiwalay na pariralang Hebreo tungkol sa kawalan ng kaalaman, sa halip na lubusang isama iyon sa “hindi sinasadya.”
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: at ang mga iyon ay magsisilbing kanlungan ninyo
  rationale: Ang pangmaramihang pandiwa ay tumutukoy sa mga lungsod. Nililinaw ng “ang mga iyon” ang reperensiya habang nananatiling natural ang pangungusap.
- source_word: מִקְלָט
  choice: kanlungan
  rationale: Karaniwan, malinaw, at marangal na salitang Tagalog ito para sa lugar na nagbibigay-proteksiyon.
- source_word: מִגֹּאֵל הַדָּם
  choice: laban sa tagapaghiganti ng dugo
  rationale: Pinananatili ng salin ang teknikal at kultural na larawan ng Hebreo. Ipinapaliwanag sa talababa ang papel nito sa sistemang pampamilya at legal ng Israel.
theological_decisions:
- issue: Legal na pagkakakilanlan ng nakapatay
  choice: Isang taong nakapatay nang hindi sinasadya at hindi nalalaman
  alternative: “Mamamatay-tao” o isang pangkalahatang “tagapatay”
  rationale: 'Ang בִּשְׁגָגָה at בִּבְלִי דָעַת ay kapuwa naglilimita sa רוֹצֵחַ: hindi inilalarawan ng talata ang sinadyang pagpaslang. Kaya hindi ginamit ang “mamamatay-tao,” na karaniwang nagpapahiwatig ng masamang layunin.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “makapatay” sa halip na “mamamatay-tao” upang huwag magpahiwatig ng sinadyang pagpaslang. Pinanatili ang tradisyonal na legal na pariralang “tagapaghiganti ng dugo,” na may paliwanag sa talababa.
