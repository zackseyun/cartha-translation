  naturalness: Ang pangungusap ay karaniwang malinaw at nasa angkop na modernong rehistro. Mas natural at malinaw ang “nang walang kaalaman” para sa hiwalay na Hebreong pariralang בִּבְלִי דָעַת. Ang “nakapatay” ay mas tuwirang naglalarawan sa taong saklaw ng tuntuning legal kaysa sa potensyal na “makapatay.”
  terminology: Ang “kanlungan” at “tagapaghiganti ng dugo” ay angkop at pinananatili ang legal-kultural na katangian ng teksto. Ang “mamamatay-tao” ay wastong iniiwasan sa pangunahing teksto, sapagkat karaniwan itong nagpapahiwatig ng sinadyang pagpatay.
