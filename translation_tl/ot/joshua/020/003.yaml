revisions:
- from: upang makatakas doon ang sinumang makapatay ng tao nang hindi sinasadya[a] at hindi nalalaman, at ang mga iyon ay magsisilbing kanlungan ninyo laban sa tagapaghiganti ng dugo.[b]
  to: upang doon makatakas ang sinumang nakapatay ng tao nang hindi sinasadya[a] at nang walang kaalaman, at ang mga iyon ay magsisilbing kanlungan ninyo laban sa tagapaghiganti ng dugo.[b]
  rationale: Inayos ang hindi ganap na “at hindi nalalaman” bilang “at nang walang kaalaman,” na likas na Tagalog at nananatiling malapit sa hiwalay na Hebreong pagbibigay-diin sa kawalan ng kaalaman. Ginawang “nakapatay” ang paglalarawan sa tao upang maging mas tuwiran ang legal na pagtukoy. Inayos din ang talababa a upang huwag ilarawan ang “mamamatay-tao” bilang di-sinasadya, samantalang pinananatiling malinaw na hindi sinadyang pagpatay ang kaso.
