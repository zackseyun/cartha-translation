  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֤ן יְרִיחוֹ֙ מִזְרָ֔חָ/ה נָתְנ֞וּ אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בַּ/מִּישֹׁ֖ר מִ/מַּטֵּ֣ה רְאוּבֵ֑ן וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ מִ/מַּטֵּה גָ֔ד וְ/אֶת גלון בַּ/בָּשָׁ֖ן מִ/מַּטֵּ֥ה מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: tl
  text: At sa kabila ng Jordan, sa silangan ng Jerico, itinalaga nila ang Bezer sa ilang, sa talampas na sakop ng lipi ni Ruben; ang Ramot sa Gilead, na sakop ng lipi ni Gad; at ang Golan sa Basan, na sakop ng lipi ni Manases.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרִיחוֹ מִזְרָחָה
  choice: At sa kabila ng Jordan, sa silangan ng Jerico
  rationale: Pinananatili ang pananaw mula sa Canaan at malinaw na inilalarawan ang lokasyon sa silangan ng Jerico. Ang “Jordan” ay karaniwang nauunawaan bilang ilog sa kontekstong ito.
- source_word: נָתְנוּ
  choice: itinalaga nila
  rationale: Sa konteksto ng mga kanlungang-lungsod, tumutukoy ito sa opisyal na pagpili o pagtatalaga, hindi lamang sa simpleng pagbibigay.
- source_word: בֶּצֶר בַּמִּדְבָּר בַּמִּישֹׁר
  choice: ang Bezer sa ilang, sa talampas
  rationale: Ang מִדְבָּר ay malawak na di-sinasakang lupain o ilang, at ang מִישֹׁר ay ang patag at mataas na rehiyon sa silangan ng Jordan; malinaw itong naipapahayag ng “talampas.”
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: na sakop ng lipi ni Ruben
  rationale: Ipinahihiwatig ng parirala ang pagkakabilang ng lugar sa takdang lupain ng lipi; mas natural sa Filipino ang “sakop ng lipi” kaysa literal na “mula sa lipi.”
- source_word: רָאמֹת בַּגִּלְעָד
  choice: ang Ramot sa Gilead
  rationale: Pinananatili ang anyo ng Hebreo bilang pangalan ng lungsod at rehiyon, sa halip na gawing tambalang pangalang hinango sa tradisyong Ingles.
- source_word: גלון בַּבָּשָׁן
  choice: ang Golan sa Basan
  rationale: Mga pangalang pantangi at panrehiyon ang mga ito; ginamit ang karaniwang anyong Filipino ng transliterasyon.
- source_word: מִמַּטֵּה גָד / מִמַּטֵּה מְנַשֶּׁה
  choice: na sakop ng lipi ni Gad / na sakop ng lipi ni Manases
  rationale: Pare-parehong isinalin ang pormulang tumutukoy sa tribal na pagkakasakop ng bawat lungsod.
