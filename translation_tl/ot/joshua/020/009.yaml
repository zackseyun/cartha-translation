  to: Ito ang mga lungsod na itinalaga para sa lahat ng mga Israelita at para sa dayuhang naninirahan sa gitna nila,[a] upang doon makatakas ang sinumang makapatay ng tao nang hindi sinasadya at hindi siya mamatay sa kamay ng tagapaghiganti ng dugo hanggang sa humarap siya sa kapulungan.[b]
