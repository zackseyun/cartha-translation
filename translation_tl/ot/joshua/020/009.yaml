  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: tl
  text: Ito ang mga lungsod na itinalaga para sa lahat ng mga Israelita at para sa dayuhang naninirahan sa gitna nila,[a] upang doon makatakas ang sinumang makapatay ng tao nang hindi sinasadya at hindi siya mamatay sa kamay ng tagapaghiganti ng dugo hanggang sa humarap siya sa kapulungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dayuhang naninirahan” ay isang di-Israelitang nakatira sa loob ng pamayanan ng Israel at sakop ng kaayusang pangkomunidad nito.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin ang “kapulungan” bilang “pagtitipon ng pamayanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: mga lungsod na itinalaga
  rationale: Tuwirang ipinahahayag ang ideya ng mga lungsod na opisyal na itinakda, nang hindi idinaragdag sa pariralang ito ang salitang “kanlungan,” na ipinahihiwatig lamang ng konteksto.
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: para sa lahat ng mga Israelita
  rationale: Ang “mga Israelita” ang natural at malinaw na modernong Tagalog para sa pambansang katawagang Hebreo na literal na “mga anak na lalaki ni Israel”; saklaw ng pormulang ito ang sambayanang Israel.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: at para sa dayuhang naninirahang kasama nila
  rationale: Ipinakikita ng גֵּר ang isang di-katutubong residenteng namumuhay sa loob ng pamayanan, hindi lamang isang panandaliang bisita o di-kilalang estranghero.
- source_word: לָנוּס שָׁמָּה
  choice: upang makatakas doon
  rationale: Pinananatili ang layuning ipinahahayag ng ל at ang kongkretong diwa ng נוּס na pagtakas patungo sa isang lugar.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: ang sinumang makapatay ng tao
  rationale: Sa kontekstong legal, ang idyoma ay tumutukoy sa sinumang nakapatay ng isang tao. Ang “makapatay” ay natural sa Tagalog at hindi nagmumungkahi ng sinasadyang pagpatay.
- source_word: בִּשְׁגָגָה
  choice: nang hindi sinasadya
  rationale: Malinaw na pinananatili ang legal na pagkakaiba sa pagitan ng di-sinasadya at sinasadyang pagpatay.
- source_word: וְלֹא יָמוּת בְּיַד גֹּאֵל הַדָּם
  choice: at hindi siya mamatay sa kamay ng tagapaghiganti ng dugo
  rationale: Ang “tagapaghiganti ng dugo” ay nagpapanatili sa pormal na katawagang legal para sa kamag-anak na may tungkuling ipaghiganti ang napatay; ang “sa kamay” ay natural ding pahayag ng ahensiya sa Tagalog.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: bago siya humarap sa kapulungan
  rationale: 'Sa negatibong sugnay, natural na isinasalin ang עַד bilang “bago”: hindi siya dapat mamatay bago ang pagharap niya. Ang “humarap” ay idiomatikong katumbas ng literal na “tumayo sa harap,” at ang kapulungan ay gumaganap dito bilang pangkomunidad at panghukumang lupon.'
theological_decisions:
- issue: Saklaw ng pambansang ekspresyong בְּנֵי יִשְׂרָאֵל
  choice: lahat ng mga Israelita
  alternative: lahat ng mga anak na lalaki ni Israel
  rationale: Bagaman panlalaking maramihan ang anyong Hebreo, isa itong nakaugaliang pambansang katawagan. Ang literal na “mga anak na lalaki” sa modernong Tagalog ay madaling mapagkamalang naglilimita sa mga lalaking anak, kaya pinanatili ang tunay na kolektibong saklaw sa “mga Israelita.”
- issue: Katayuang legal ng גֵּר
  choice: dayuhang naninirahang kasama nila
  alternative: nakikipamayang dayuhan
  rationale: Pinananatili ang pagkakaiba niya sa katutubong Israelita at ang katotohanang permanente o matagal siyang nakatira sa loob ng pamayanan, nang hindi nag-aangkat ng makabagong kategoryang pampolitika o pang-imigrasyon.
- issue: Papel ng גֹּאֵל הַדָּם
  choice: tagapaghiganti ng dugo
  alternative: kamág-anak na tagapaghiganti
  rationale: Pinananatili ang teknikal at may tensiyong katawagang legal ng teksto sa halip na ipaliwanag sa pangunahing talata ang buong tungkulin ng pinakamalapit na kamag-anak.
- issue: Kahulugan ng הָעֵדָה sa paghatol
  choice: kapulungan
  alternative: pamayanan
  rationale: Ang “kapulungan” ay nagpapanatili sa ideya ng pamayanang nagtitipon para dinggin ang usapin, nang hindi tiyakang tinatawag itong modernong hukuman.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Gumamit ng “lungsod,” “itinalaga,” at “kapulungan” para sa dignidad ng legal na buod, ngunit iniwasan ang labis na arkaikong pananalita. Inayos ang pangungusap upang maging natural sa Tagalog habang pinananatili ang layunin, di-sinasadyang pagpatay, pansamantalang proteksiyon, at pagharap sa kapulungan.
