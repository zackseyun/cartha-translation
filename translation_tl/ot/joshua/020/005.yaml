revisions:
- from: At kung habulin siya ng tagapaghiganti ng dugo, huwag nilang ibigay sa kamay nito ang taong nakapatay, sapagkat nahampas niya ang kanyang kapwa nang hindi sinasadya at hindi naman niya ito kinapootan noon pa man.[a]
  to: At kung habulin siya ng tagapaghiganti ng dugo, hindi nila dapat ibigay ang taong nakapatay sa kamay ng tagapaghiganti ng dugo, sapagkat natamaan niya ang kanyang kapwa nang hindi sinasadya at hindi niya ito kinapootan noon pa man.[a]
  rationale: Inayos ang legal na modalidad, nilinaw ang reperensiya ng "kamay," at pinalitan ang hindi gaanong likas na "nahampas" ng "natamaan." Walang idinagdag na paghatol tungkol sa antas ng pagkakasala, at pinanatili ang temporal na idyoma at ang talababa nito.
