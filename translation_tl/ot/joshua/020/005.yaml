base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: tl
  text: At kung habulin siya ng tagapaghiganti ng dugo, hindi nila dapat ibigay ang taong nakapatay sa kamay ng tagapaghiganti ng dugo, sapagkat natamaan niya ang kanyang kapwa nang hindi sinasadya at hindi niya ito kinapootan noon pa man.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula kahapon at noong makalawa,” isang Hebreong idyoma na nangangahulugang “dati” o “noon pa man.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Ipinagpapatuloy nito ang legal na tagubilin at pinananatili ang kondisyonal na diwa.
- source_word: גֹּאֵל הַדָּם
  choice: tagapaghiganti ng dugo
  rationale: Ipinahahayag nito ang natatanging tungkulin ng kamag-anak na naghihiganti sa pagdanak ng dugo sa konteksto ng mga lunsod-kanlungan.
- source_word: וְלֹא יַסְגִּרוּ ... בְּיָדוֹ
  choice: huwag nilang ibigay sa kamay nito
  rationale: Pinananatili ang larawan ng Hebreong idyoma na tumutukoy sa pagsuko ng isang tao sa kapangyarihan ng iba.
- source_word: הָרֹצֵחַ
  choice: ang taong nakapatay
  rationale: Iniiwasan ang “mamamatay-tao,” na maaaring magpahiwatig agad ng sinasadyang pagpaslang, samantalang itinatanggi ng talata ang dating poot at intensiyon.
- source_word: בִּבְלִי דַעַת
  choice: nang hindi sinasadya
  rationale: Natural itong Filipino para sa kawalan ng kaalaman o layuning pumatay sa legal na kontekstong ito.
- source_word: הִכָּה
  choice: nahampas
  rationale: Pinananatili ang pangunahing diwa ng pandiwang “humampas/tumama” sa halip na isingit sa mismong pandiwa ang bunga nitong kamatayan.
- source_word: רֵעֵהוּ
  choice: kanyang kapwa
  rationale: Ang “kapwa” ay likas at malawak na katumbas ng רֵעַ, nang hindi nililimitahan ito sa kapitbahay sa heograpikal na diwa.
- source_word: וְלֹא שֹׂנֵא הוּא לוֹ
  choice: at hindi naman niya ito kinapootan
  rationale: Malinaw nitong ipinapahayag ang kawalan ng dating personal na poot o masamang hangarin.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: noon pa man
  rationale: Isinasalin nang natural ang Hebreong idyoma para sa naunang panahon; inilalagay sa talababa ang literal na larawan.
theological_decisions:
- issue: Legal na katayuan ng הָרֹצֵחַ sa konteksto ng lunsod-kanlungan
  choice: ang taong nakapatay
  alternative: mamamatay-tao
  rationale: Hindi pa itinuturing ng teksto na sadyang mamamatay-tao ang taong ito; tahasang binibigyang-diin ang kawalan ng intensiyon at dating poot.
- issue: Diwa ng בִּבְלִי דַעַת
  choice: nang hindi sinasadya
  alternative: nang walang kaalaman
  rationale: Mas malinaw sa karaniwang mambabasa ang legal na diwa ng hindi sinasadyang pagkakapatay, nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taong nakapatay” upang maiwasan ang mapanghatol na pahiwatig ng “mamamatay-tao,” at inilapit ang talababa sa temporal na idyomang ipinapaliwanag nito.
