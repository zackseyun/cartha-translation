  naturalness: Mas natural at malinaw sa makabagong Filipino ang "kung habulin siya..." at "hindi nila dapat ibigay ... sa kamay ng tagapaghiganti ng dugo." Ang "natamaan niya ang kanyang kapwa nang hindi sinasadya" ay mas idiomatiko kaysa "nahampas niya" habang hindi isinasalin ang הִכָּה bilang "pinatay."
  terminology: Ang "tagapaghiganti ng dugo" at "taong nakapatay" ay angkop sa legal na konteksto at iniiwasan ang maagang paghatol na "mamamatay-tao." Ang "kapwa" ay katanggap-tanggap para sa רֵעֵהוּ. Pinananatili ang temporal na idyoma sa pamamagitan ng "noon pa man" at ng talababa.
