  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: tl
  text: At nagsalita si Yahweh kay Josue:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagkatapos, nagsalita si Yahweh kay Josue:” Maaaring isalin ang anyong pasalaysay sa Hebreo bilang “at” o “pagkatapos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive at pandiwang דּבר ay nagpapatuloy sa salaysay at tumutukoy sa pagsasalita o pakikipag-usap. Likas sa modernong Tagalog ang “Pagkatapos, nagsalita” bilang panimulang pormula.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ito ang karaniwang Tagalog na pananda para sa taong pinatutungkulan ng pagsasalita.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginagamit ang nakaugaliang modernong anyo ng pangalang biblikal sa Tagalog.
- source_word: לֵאמֹר
  choice: tutuldok pagkatapos ng sugnay
  rationale: Ang infinitibong לֵאמֹר ay pormulang nagpapakilala sa kasunod na tuwirang pahayag. Sa natural na Tagalog, sapat at malinaw itong ipinahihiwatig ng tutuldok, sa halip na ng alanganing “na sinasabi.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan at iniiwasang gawin itong titulong “PANGINOON.”
- issue: Pormulang לֵאמֹר sa pagpapakilala ng banal na pahayag
  choice: tutuldok
  alternative: na sinasabi; at sinabi
  rationale: Hindi binabago kung sino ang nagsasalita o ang katayuan ng kasunod na pahayag; likas lamang na ipinakikilala ito ayon sa bantas ng modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Josue,” ang karaniwang anyong Tagalog ng pangalan. Ipinakilala ang kasunod na pahayag sa pamamagitan ng tutuldok, na mas natural kaysa literal na “na sinasabi.”
