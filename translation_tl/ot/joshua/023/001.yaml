id: JOS.23.1
reference: Joshua 23:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִ/יָּמִ֣ים רַבִּ֔ים אַ֠חֲרֵי אֲשֶׁר הֵנִ֨יחַ יְהוָ֧ה לְ/יִשְׂרָאֵ֛ל מִ/כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִ֑יב וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: tl
  text: At nangyari, makalipas ang mahabang panahon, matapos bigyan ni Yahweh ang Israel ng kapahingahan mula sa lahat ng kaaway nila sa paligid, si Josue ay matanda na at lipas na sa gulang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “dumating sa mga araw,” isang idyoma para sa pagiging lipas na sa gulang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Karaniwang panandang pasalaysay na nagbubukas ng bagong tagpo; malapit sa Hebreo at hindi makaluma.
- source_word: מִיָּמִים רַבִּים
  choice: makalipas ang mahabang panahon
  rationale: Likas na Filipino para sa idyomang tumutukoy sa malaking paglipas ng panahon; iniiwasan ang literal ngunit alanganing 'pagkaraan ng maraming araw.'
- source_word: אַחֲרֵי אֲשֶׁר
  choice: matapos
  rationale: Malinaw na ipinakikilala ang pangyayaring nagsisilbing panandang temporal.
- source_word: הֵנִיחַ
  choice: bigyan ... ng kapahingahan
  rationale: Ang Hiphil ng נוח dito ay nangangahulugang magbigay ng pahinga o katiwasayan mula sa mga kaaway.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang יהוה, sa halip na palitan ito ng isang titulo.
- source_word: לְיִשְׂרָאֵל
  choice: ang Israel
  rationale: Pangalan ng bayan o bansa; pinanatili bilang Israel.
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: mula sa lahat ng kaaway nila sa palibot
  rationale: Pinananatili ang kabuuang saklaw at ang spatial na diin ng מִסָּבִיב.
- source_word: וִיהוֹשֻׁעַ
  choice: si Josue
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Joshua; natural na iniugnay sa mahabang temporal na panimula.
- source_word: זָקֵן
  choice: matanda na
  rationale: Tuwiran at likas na paglalarawan sa katandaan ni Josue.
- source_word: בָּא בַּיָּמִים
  choice: may kalakihan na ang edad
  rationale: Natural na Filipino para sa idyomang Hebreo na literal na 'dumating sa mga araw,' na nangangahulugang lubhang may edad na.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong transliterado sa halip na palitan ng titulo.
- issue: Kahulugan ng kapahingahang ibinigay sa Israel
  choice: kapahingahan mula sa lahat ng kaaway nila
  alternative: katiwasayan mula sa lahat ng kaaway nila
  rationale: Pinananatili ng 'kapahingahan' ang mahalagang terminong נוח at ang diwang kaluwagan mula sa digmaan, nang hindi dinaragdagan ang teksto ng ganap o permanenteng kapayapaan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “makalipas ang mahabang panahon” para sa likas na daloy, “kapahingahan” upang mapanatili ang mahalagang biblikal na konsepto, at “Josue” bilang nakaugaliang anyong Filipino ng pangalan.
