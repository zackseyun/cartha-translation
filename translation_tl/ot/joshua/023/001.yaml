- from: At nangyari, makalipas ang mahabang panahon, matapos bigyan ni Yahweh ang Israel ng kapahingahan mula sa lahat ng kaaway nila sa palibot, si Josue ay matanda na at may kalakihan na ang edad.[a]
  to: At nangyari, makalipas ang mahabang panahon, matapos bigyan ni Yahweh ang Israel ng kapahingahan mula sa lahat ng kaaway nila sa paligid, si Josue ay matanda na at lipas na sa gulang.[a]
  rationale: Pinalitan ang di-likas na “may kalakihan na ang edad” ng “lipas na sa gulang,” isang malinaw at marangal na katumbas ng Hebreong idyoma. Pinanatili ang dobleng paglalarawan—“matanda na at lipas na sa gulang”—upang maipakita ang diin ng זָקֵן at בָּא בַּיָּמִים.
