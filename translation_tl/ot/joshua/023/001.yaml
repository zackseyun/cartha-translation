  terminology: Ang “Yahweh,” “Israel,” “Josue,” at “kapahingahan” ay angkop at pare-pareho sa mga pasyang leksikal. Napananatili rin ang diin na ang kapahingahan ay mula sa lahat ng kaaway sa paligid.
