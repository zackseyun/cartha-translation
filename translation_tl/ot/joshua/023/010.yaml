reference: Joshua 23:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: tl
  text: Isang lalaki mula sa inyo ang hahabol sa isang libo[a], sapagkat si Yahweh[b] na inyong Diyos ang siyang nakikipaglaban para sa inyo, gaya ng sinabi niya sa inyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tutugis sa isang libo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ay salin-titik ng banal na pangalang Hebreo na YHWH, na karaniwang isinasaling “PANGINOON.”
    reason: lexical_alternative
  - marker: c
    text: O “gaya ng ipinangako niya sa inyo”; mas literal sa Hebreo, “gaya ng sinalita niya sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד מִכֶּם
  choice: Isang lalaki mula sa inyo
  rationale: Pinananatili ang panlalaking isahan ng Hebreo at ang partitive na diwa ng מִכֶּם, sa natural na modernong Tagalog.
- source_word: יִרְדָּף
  choice: hahabol
  rationale: Karaniwan at malinaw na katumbas ng militar na diwang ‘hahabol’ o ‘tutugis,’ nang hindi dinaragdagan ang tahasang layon.
- source_word: אָלֶף
  choice: isang libo
  rationale: Tuwirang pinananatili ang bilang at ang matinding paghahambing sa teksto; hindi idinaragdag ang ‘kaaway’ bagaman ipinahihiwatig iyon ng konteksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang sanhi ng tagumpay habang pinananatili ang marangal na rehistro.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: si Yahweh na inyong Diyos
  rationale: Ginagamit ang personal na pangalang nasa Hebreo at natural na inuugnay rito ang pariralang ‘inyong Diyos.’
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: ang siyang nakikipaglaban para sa inyo
  rationale: Ipinahahayag ng ‘ang siyang’ ang diin ng הוּא, at ng ‘nakikipaglaban’ ang katangiang nagpapatuloy na inilalarawan ng participle.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: gaya ng sinabi niya sa inyo
  rationale: Malapit ito sa literal na ‘gaya ng sinalita niya sa inyo’ ngunit mas natural sa Tagalog; hindi tahasang ginagawang ‘ipinangako’ ang pandiwa kahit maaaring iyon ang diwa sa konteksto.
theological_decisions:
- issue: Paglalarawan sa pinagmumulan ng tagumpay
  choice: si Yahweh ... ang siyang nakikipaglaban para sa inyo
  alternative: si Yahweh ... ang nakikipaglaban para sa inyo
  rationale: 'Pinananatili ng ‘ang siyang’ ang emphatic na panghalip הוּא: ang tagumpay ay iniuugnay sa pagkilos ng Diyos, hindi sa lakas ng isang mandirigma.'
- issue: Pagbaybay sa banal na pangalan יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang pinagmulang Hebreo ay may personal na pangalang YHWH; inilalathala ito bilang ‘Yahweh,’ habang ipinapaliwanag sa talababa ang tradisyonal na pamalit na titulo.
- issue: Panlalaking kinatawang pananalita sa אִישׁ אֶחָד
  choice: Isang lalaki
  alternative: Isang tao
  rationale: Ang anyo ay panlalaking isahan sa isang kontekstong militar. Pinananatili ito nang hindi nagpapalawak o nagpapakitid pa sa pahiwatig ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘sapagkat’ at ‘ang siyang’ upang mapanatili ang dignidad at diin ng Hebreo, ngunit iniwasan ang lipas o sobrang pormal na mga anyo. Lahat ng marker na [a], [b], at [c] ay nasa pangunahing teksto.
