base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: tl
  text: upang hindi kayo makihalubilo sa mga bansang ito na naiwan pa na kasama ninyo. Huwag ninyong banggitin[a] ang pangalan ng kanilang mga diyos, huwag ninyong pasumpain ang sinuman sa pangalan ng mga diyos na iyon[b], huwag ninyong paglingkuran ang mga diyos na iyon, at huwag kayong yumukod sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tawagin ang pangalan.” Ang pandiwang Hebreo ay maaaring mangahulugang “banggitin” o, sa kontekstong panrelihiyon, “tawagin” o “dalanginin.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, causative ang pandiwa—literal na “magpasumpa.” Maaaring kabilang dito ang pagpapasumpa sa iba sa pangalan ng mga diyos na iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: upang hindi kayo makihalubilo sa mga bansang ito
  rationale: Ang לְבִלְתִּי kasama ng pawatas ay nagpapahayag ng layunin o pag-iwas. Sa kontekstong ito, ang בוא בַּגּוֹיִם ay hindi lamang heograpikong pagpasok kundi pakikisama sa mga bansang naiwan; malinaw at likas sa modernong Tagalog ang “makihalubilo.”
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: na nalalabi kasama ninyo
  rationale: Pinananatili ng “nalalabi” ang diwa ng participle mula sa שׁאר, at tuwirang tinutumbasan ng “kasama ninyo” ang אִתְּכֶם.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: Huwag ninyong banggitin ang pangalan ng kanilang mga diyos
  rationale: Ang Hiphil na הזכיר ay maaaring mangahulugang banggitin o tawagin/dalanginin. Pinili ang tuwirang “banggitin,” habang inilalahad sa talababa ang posibleng kultikong diwa.
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: huwag ninyong pasumpain ang sinuman sa pangalan ng mga iyon
  rationale: Causative ang Hiphil ng שׁבע, kaya “pasumpain” sa halip na simpleng “manumpa.” Ipinahihiwatig lamang sa Hebreo ang layon, kaya idinagdag ang “ang sinuman” para sa malinaw na Tagalog; ang “sa pangalan ng mga iyon” ay natural na pagpapahayag ng panunumpa sa mga diyos.
- source_word: וְלֹא תַעַבְדוּם
  choice: huwag ninyong paglingkuran ang mga iyon
  rationale: Pinananatili ng “paglingkuran” ang pangunahing diwa ng עבד at ang pagkakaiba nito sa kasunod na pisikal na kilos ng pagyukod.
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: huwag kayong yumukod sa mga iyon
  rationale: Ang pandiwa ay tumutukoy sa pagyukod o pagpapatirapa. Ang “yumukod” ay malinaw, dignificado, at hindi inuulit lamang ang pangkalahatang salitang “sumamba.”
theological_decisions:
- issue: Magkakahiwalay na gawaing kaugnay ng katapatan sa mga diyos ng ibang mga bansa
  choice: Panatilihin ang pagkakasunod-sunod na banggitin, pasumpain, paglingkuran, at yumukod.
  alternative: Ibuod ang lahat bilang “huwag sumamba sa kanila.”
  rationale: Nagtatala ang Hebreo ng magkakaugnay ngunit magkakaibang kilos. Ang pagpapanatili sa bawat pandiwa ay nag-iingat sa kongkretong diin ng teksto laban sa idolatriya nang hindi ito pinapasimple sa isang teolohikal na buod.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignificado. Ginamit ang “makihalubilo” upang ihayag ang pakikisama na ipinahihiwatig ng konteksto, at pinanatiling magkahiwalay ang mga pandiwa ng pagbabawal. Inilagay ang mga pananda ng talababa sa mismong mga pariralang kanilang ipinapaliwanag.
