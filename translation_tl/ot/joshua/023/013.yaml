  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang mariing יָדוֹעַ תֵּדְעוּ, ang pagtigil ni Yahweh sa pagpapaalis ng mga bansa, ang magkapares na bitag/silo, ang masakit na metapora sa mga tagiliran at mata, at ang pagkapuksa mula sa mabuting lupain. Hindi nito pinapaliit o dinaragdagan ang babala.'
  naturalness: Marangal at malinaw ang modernong Tagalog. Ang “Tiyak na dapat ninyong malaman” ay angkop na paraan upang ihatid ang mariing pormula ng Hebreo. Ang “mula sa inyong harapan” ay bahagyang pormal ngunit nauunawaan at pinananatili ang imaheng spatial ng pinagmulan.
  terminology: Wastong pinanatili ang “Yahweh” para sa tetragrammaton. Ang “bitag at silo,” “mga tinik sa inyong mga mata,” at “mabuting lupaing ito” ay angkop. Ang “panhagupit” ay isang maingat na pangunahing salin para sa mahirap na שֹׁטֵט, at ang talababa ay sapat na nagsasaad ng kawalang-katiyakan nang hindi pinipilit ang isang pakahulugan.
