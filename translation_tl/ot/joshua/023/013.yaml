reference: Joshua 23:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: tl
  text: Tiyak na dapat ninyong malaman na hindi na palalayasin ni Yahweh na inyong Diyos ang mga bansang ito mula sa inyong harapan. Sa halip, sila ay magiging bitag at silo sa inyo, panghagupit sa inyong mga tagiliran[a], at mga tinik sa inyong mga mata, hanggang sa malipol kayo mula sa mabuting lupaing ito na ibinigay sa inyo ni Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap tiyakin ang kahulugan ng salitang Hebreo rito. Maaari rin itong tumukoy sa isang hagupit o sa masakit na pahirap sa mga tagiliran.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: Tiyak na dapat ninyong malaman
  rationale: Ipinahahayag ang diin ng infinitive absolute at finite verb sa natural at marangal na Tagalog.
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: hindi na palalayasin
  rationale: Ang יסף na may infinitive ay nagsasaad ng paghinto sa karagdagang pagkilos; iniiwasan ng 'hindi na' ang paulit-ulit na diwa habang pinananatili ang aspektong ito.
- source_word: מִלִּפְנֵיכֶם
  choice: mula sa inyong harapan
  rationale: Pinananatili ang Hebreong larawang spatial at ang konteksto ng pagpapaalis sa mga bansa.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: bitag at silo
  rationale: Pinananatiling magkahiwalay ang dalawang magkaugnay na larawan ng kapahamakan.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: panghagupit sa inyong mga tagiliran
  rationale: Ang bihira at mahirap na salitang שֹׁטֵט ay nauunawaan dito bilang kasangkapang humahagupit o masakit na pagpapahirap; pinananatili ang pisikal na metapora.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: mga tinik sa inyong mga mata
  rationale: Direkta at pamilyar na larawan para sa matalim at patuloy na pasakit.
- source_word: עַד אֲבָדְכֶם
  choice: hanggang sa malipol kayo
  rationale: Malinaw na ipinakikita ang hantungan ng babala nang hindi dinaragdagan ang sanhi o paraan ng pagkalipol.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: mula sa mabuting lupaing ito
  rationale: Ang אֲדָמָה ay tumutukoy sa lupaing kaloob ng Diyos; natural sa Tagalog ang 'mula sa' at sapat itong nagpapahayag ng pagkaalis doon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalang nasa tekstong Hebreo, sa halip na palitan ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pinananatili ang personal na pangalang tahasang nasa pinagmulang Hebreo nang hindi nag-aangkat ng denominasyonal na katawagan.
- issue: Ugnayan ng pagtigil ng Diyos sa pagpapaalis at ng kapahamakan ng Israel
  choice: Pinananatiling magkakaugnay sa babala ngunit hindi dinaragdagan ng paliwanag
  alternative: Ipaliwanag ito bilang purong prediksiyong militar o tahasang lagyan ng sistematikong paliwanag tungkol sa tipan
  rationale: Ipinakikita ng teksto ang pagtigil ni Yahweh sa pagpapaalis, ang pananakit ng mga bansa, at ang pagkawala ng Israel sa lupa; pinananatili ang tensiyong ito nang walang dagdag na doktrina.
- issue: Di-tiyak na kahulugan ng שֹׁטֵט
  choice: panghagupit
  alternative: salot / masakit na pahirap
  rationale: Pinipili ang konkretong larawang malamang na ipinahihiwatig ng salita, habang inilalahad sa talababa ang leksikal na kawalang-katiyakan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang maramihang 'ninyo/inyong' upang katawanin ang pangmaramihang ikalawang panauhan sa Hebreo. Pinanatili ang matitinding larawang 'tagiliran' at 'mga mata' at iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
