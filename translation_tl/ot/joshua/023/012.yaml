  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י אִם שׁ֣וֹב תָּשׁ֗וּבוּ וּ/דְבַקְתֶּם֙ בְּ/יֶ֨תֶר֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וְ/הִֽתְחַתַּנְתֶּ֥ם בָּ/הֶ֛ם וּ/בָאתֶ֥ם בָּ/הֶ֖ם וְ/הֵ֥ם בָּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: tl
  text: Sapagkat kung talagang tatalikod kayo at kakapit sa mga natitirang bansang ito[a]—sa mga nananatiling nasa piling ninyo—at makikipag-asawa sa kanila, at makikisalamuha kayo sa kanila at sila naman sa inyo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahigpit na kakapit” sa halip na “kakapit.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pupunta kayo sa kanila at sila naman sa inyo” o “makikipag-ugnayan kayo sa kanila at sila naman sa inyo.” Mas malawak ang idyomang Hebreo kaysa sa literal na pagpunta lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sapagkat kung
  rationale: Ipinagpapatuloy nito ang babala sa naunang talata at malinaw na nagpapakilala ng kondisyon.
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: talagang tatalikod kayo
  rationale: Ipinahahayag ng infinitive absolute at pandiwang may hangganan ang diin; ang “talagang” ay likas na Filipino, at ang “tatalikod” ay angkop sa negatibong pagbawi sa katapatan sa tipan.
- source_word: וּדְבַקְתֶּם
  choice: kakapit
  rationale: Pinananatili nito ang matinding larawan ng malapit at matatag na pagkalakip nang hindi nilulutas ang ugnayang pahiwatig nito.
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה
  choice: sa mga nalabi sa mga bansang ito
  rationale: Ang “mga nalabi” ay tuwirang tumutukoy sa mga taong naiwan mula sa mga bansang iyon at umiiwas sa di-kinakailangang positibong teolohikal na pakahulugan ng “nalabing lahi.”
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: sa mga nananatiling kasama ninyo
  rationale: Pinananatili ang inuulit na pagtukoy sa mismong mga bansang naroon pa sa piling ng Israel.
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: at makikipag-asawa sa kanila
  rationale: Malinaw at natural na Filipino para sa pagpasok sa mga ugnayang pampamilya sa pamamagitan ng pag-aasawa.
- source_word: וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: at makikisalamuha kayo sa kanila at sila naman sa inyo
  rationale: Ipinakikita ang kapwa at malawak na pakikihalubilo ng idyoma; hindi ito nililimitahan sa literal na pagpunta o sa seksuwal na pahiwatig.
theological_decisions:
- issue: Kahulugang pangtipan ng שׁוֹב תָּשׁוּבוּ
  choice: tatalikod
  alternative: babalik
  rationale: Sa konteksto, ang kilos ay pagtalikod sa katapatan kay Yahweh at pagkapit sa natitirang mga bansa; mas malinaw ang negatibong direksiyon ng “tatalikod” kaysa sa neutral na “babalik.”
- issue: Posibleng labis na teolohikal na pagbasa sa יֶתֶר
  choice: mga nalabi
  alternative: nalabing lahi
  rationale: Ang parirala ay tumutukoy lamang sa mga bansang naiwan; iniiwasan ng salin ang pag-aangkat ng positibong konsepto ng isang banal na “nalabi.”
- issue: Saklaw ng magkatugmang idyomang וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: makikisalamuha kayo sa kanila at sila naman sa inyo
  alternative: pupunta kayo sa kanila at sila sa inyo
  rationale: Dahil nabanggit na ang pag-aasawa, pinananatili ng “makikisalamuha” ang mas malawak na panlipunang ugnayan at ang kapwa pagkilos nang hindi ito ginagawang seksuwal na eupemismo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang mahabang kondisyunal na pangungusap at ang pangwakas na kuwit dahil nagpapatuloy ang babala sa susunod na talata. Ginamit ang “bansa” para sa גּוֹיִם at iniwasan ang salitang maaaring magpasok ng denominasyonal o labis na teolohikal na pakahulugan.
