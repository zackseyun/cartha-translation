revisions:
- from: Sapagkat kung talagang tatalikod kayo at kakapit sa mga nalabi sa mga bansang ito[a]—sa mga nananatiling kasama ninyo—at makikipag-asawa sa kanila, at makikisalamuha kayo sa kanila at sila naman sa inyo[b],
  to: Sapagkat kung talagang tatalikod kayo at kakapit sa mga natitirang bansang ito[a]—sa mga nananatiling nasa piling ninyo—at makikipag-asawa sa kanila, at makikisalamuha kayo sa kanila at sila naman sa inyo[b],
  rationale: Pinalitan ang “mga nalabi sa mga bansang ito” ng “mga natitirang bansang ito” upang mas tapat na katawanin ang pariralang Hebreo at maiwasan ang hindi kailangang pagliit nito sa mga indibidwal. Ang “nasa piling ninyo” ay mas natural kaysa “kasama ninyo” para sa patuloy na presensiya ng mga bansang ito sa gitna ng Israel. Pinanatili ang malawak at kapwa kahulugan ng huling idyoma, ang mga angkla ng talababa, at ang nakabiting sintaks ng talata.
