base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: tl
  text: Masdan ninyo, ipinamahagi ko na sa inyo ang mga bansang ito na nalalabi bilang pamana para sa inyong mga lipi, mula sa Jordan—kasama ang lahat ng bansang nilipol ko—hanggang sa Malaking Dagat, sa dakong paglubog ng araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa dakong pinapasukan ng araw,” isang idyoma para sa kanluran.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Masdan ninyo
  rationale: Pautos na maramihan ito na mariing tumatawag ng pansin. Ang “Masdan ninyo” ay marangal at malinaw nang hindi gumagamit ng lipas na pananalita.
- source_word: הִפַּלְתִּי
  choice: ipinamahagi ko na ... sa pamamagitan ng palabunutan
  rationale: Ang Hiphil ng נפל ay tumutukoy rito sa pagtatalaga o pamamahagi sa pamamagitan ng palabunutan. Nililinaw ng salin ang idyomatikong diwa sa konteksto ng paghahati ng lupain.
- source_word: בְּנַחֲלָה
  choice: bilang pamana
  rationale: Ang נַחֲלָה sa Josue ay karaniwang tumutukoy sa minanang pag-aari o teritoryo. Pinananatili ng “bilang pamana” ang ugnayan nito sa lupang ipinagkaloob sa mga lipi.
- source_word: לְשִׁבְטֵיכֶם
  choice: ng inyong mga lipi
  rationale: Ipinakikita ng parirala kung sino ang tatanggap ng pamana. Sa Filipino, likas ang “pamana ng inyong mga lipi” para sa pamanang nakatalaga sa kanila.
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: ang mga bansang ito na nalalabi
  rationale: 'Pinananatili nito ang pandiwaring diwa ng נִשְׁאָרִים: ang mga bansang nananatili pa, sa halip na gawing pang-uri lamang.'
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: mula sa Jordan ... hanggang sa Malaking Dagat
  rationale: Bagaman waw ang nasa harap ng “Malaking Dagat,” inilalarawan ng parirala ang lawak ng hangganan. Likas at malinaw sa Filipino ang hulma na “mula ... hanggang ...”.
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: kasama ang lahat ng bansang nilipol ko
  rationale: Ang כרת sa kontekstong ito ay nangangahulugang puksain o lipulin. Ang “nilipol” ay malinaw sa karaniwang mambabasa, samantalang iniiwasan ang malabong literal na “pinutol.”
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: sa dakong paglubog ng araw
  rationale: Idyoma ito para sa kanluran. Pinananatili ng salin ang larawang Hebreo at nananatiling madaling maunawaan sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang tuwirang pagtukoy sa mga bansa bilang bagay na ipinamahagi, sa halip na idagdag sa pangunahing teksto ang salitang “lupain,” na wala sa Hebreo. Gumamit ng gitling na em upang malinaw na maikabit ang pariralang tumutukoy sa mga bansang nilipol.
