base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: tl
  text: Kaya't magpakatatag kayo nang lubos upang sundin at gawin ang lahat ng nakasulat sa Aklat ng Kautusan ni Moises[a], upang hindi kayo lumihis dito sa kanan man o sa kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Aklat ng Tagubilin ni Moises.” Ang Hebreong torah ay maaaring mangahulugang “tagubilin” o “turo,” gayundin ng “kautusan”; dito ay partikular itong tumutukoy sa kalipunan ng mga kautusang kaugnay ni Moises.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: magpakatatag kayo nang lubos
  rationale: Ang pandiwang חזק ay panawagan sa maramihang kausap na maging matatag o determinado, at pinatitindi ito ng מְאֹד. Likas sa makabagong Tagalog ang pariralang ito at hindi nito nililimitahan ang diwa sa tapang lamang.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: upang sundin at gawin
  rationale: Sa kontekstong tipan at kautusan, ang שׁמר ay tumutukoy sa maingat na pagsunod, samantalang pinananatili ng “gawin” ang tuwirang diwa ng עשה at ang tambalang pagpapahayag ng Hebreo.
- source_word: כָּל הַכָּתוּב
  choice: ang lahat ng nakasulat
  rationale: Malinaw at likas itong komprehensibong pagtukoy sa buong nakasulat na nilalaman.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: sa Aklat ng Kautusan ni Moises
  rationale: Maaaring mangahulugan ang סֵפֶר ng aklat o balumbon, ngunit ang “Aklat” ang malinaw at kinikilalang tawag sa Tagalog. Sa pormulang ito, ang תּוֹרָה ay tumutukoy sa nakasulat na kalipunan ng kautusang iniugnay kay Moises.
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: Huwag kayong lumihis dito
  rationale: Natural na ipinapahayag sa Tagalog bilang hiwalay na pagbabawal ang layuning huwag lumayo sa tinutukoy na kautusan. Ang “dito” ay nagpapanatili sa isahang reperensiya ng hulaping Hebreo.
- source_word: יָמִין וּשְׂמֹאול
  choice: maging sa kanan o sa kaliwa
  rationale: Pinananatili nito ang Hebreong talinghaga para sa anumang uri ng paglihis, sa likas at malinaw na Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa תּוֹרָה sa konteksto ng tipang Mosaiko
  choice: Kautusan sa “Aklat ng Kautusan ni Moises”
  alternative: Tagubilin sa “Aklat ng Tagubilin ni Moises”
  rationale: Bagaman maaaring mangahulugan ang תּוֹרָה ng “tagubilin” o “turo,” sa pormulang ito ay partikular itong tumutukoy sa legal at tipang kalipunang kaugnay ni Moises. Pinakamalinaw sa mga karaniwang mambabasa ang “Kautusan,” habang inilalahad sa talababa ang mas malawak na saklaw ng salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang maramihang “kayo” ayon sa Hebreo. Iniwasan ang arkaikong ayos at pinanatili ang idiomang kanan at kaliwa nang hindi ito ipinapaliwanag sa mismong talata.
