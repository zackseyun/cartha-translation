  naturalness: Likas at marangal ang karamihan ng Tagalog. Mas tuwiran at idiomatiko ang “sa kanan man o sa kaliwa” kaysa “maging sa kanan o sa kaliwa” sa pagpapahayag ng dalawang direksiyon ng paglihis.
