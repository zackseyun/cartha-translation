  source_fidelity: Tumpak na naihahatid ang utos na magbantay nang masidhi at ang layuning ibigin si Yahweh. Ang pabalik-sa-sariling puwersa ng לְנַפְשֹׁתֵיכֶם ay natural na nakapaloob sa “mag-ingat kayong mabuti,” nang hindi lumilikha ng di-natural na calque.
  naturalness: Natural at marangal ang modernong Filipino. Ang “Kaya,” “mag-ingat kayong mabuti,” at “upang ibigin ninyo” ay malinaw at angkop sa pormal na panawagan sa tipan. Ang “ibigin” ay bahagyang mas mataas ang rehistro ngunit angkop sa kontekstong ito.
