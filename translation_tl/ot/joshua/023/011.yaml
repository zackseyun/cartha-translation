translation:
  language: tl
  text: Kaya mag-ingat kayong mabuti upang ibigin ninyo si Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: Kaya mag-ingat kayo
  rationale: Ang pandiwa ay nananawagan ng masusing pagbabantay sa sarili. Ang “Kaya” ay natural na nag-uugnay sa pangangatwiran ng naunang konteksto.
- source_word: מְאֹד
  choice: mabuti
  rationale: Kasama ng “mag-ingat,” natural na ipinahahayag ng “mabuti” ang matinding antas ng pag-iingat.
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: nakapaloob sa “mag-ingat kayong mabuti”
  rationale: Ang parirala ay may pabalik-sa-sariling diwa at tumutukoy sa buong pagkatao, hindi lamang sa isang hiwalay na “kaluluwa.” Sa Filipino, sapat at natural itong naipahihiwatig ng “mag-ingat kayo.”
- source_word: לְאַהֲבָה
  choice: upang ibigin ninyo
  rationale: Ipinahahayag ng infinitive ang layunin ng masusing pag-iingat; malinaw itong naihahatid ng “upang.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tuwirang ipinahahayag ang ikalawang panauhang maramihang hulapi at ang tipanang kaugnayan.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa pangaral na may kaugnayan sa tipan
  choice: Pabalik-sa-sariling diwa na nakapaloob sa “mag-ingat kayong mabuti”
  alternative: “ingatan ninyong mabuti ang inyong mga sarili/buhay/kaluluwa”
  rationale: Sa idyomang ito, ang נֶפֶשׁ ay tumutukoy sa buong sarili at nagpapatindi sa pananagutang magbantay, hindi sa isang hiwalay na di-materyal na bahagi ng tao. Iniiwasan nitong magpasok ng antropolohiyang hindi hinihingi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ibigin” upang mapanatili ang bigat ng tipanang panawagan, habang nananatiling natural ang buong pangungusap.
