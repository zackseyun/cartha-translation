  text: וַ/יִּקְרָ֤א יְהוֹשֻׁ֨עַ֙ לְ/כָל יִשְׂרָאֵ֔ל לִ/זְקֵנָי/ו֙ וּ/לְ/רָאשָׁ֔י/ו וּ/לְ/שֹׁפְטָ֖י/ו וּ/לְ/שֹֽׁטְרָ֑י/ו וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אֲנִ֣י זָקַ֔נְתִּי בָּ֖אתִי בַּ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: tl
  text: Pagkatapos, ipinatawag ni Josue ang buong Israel—ang mga nakatatanda nito, mga pinuno[b], mga hukom, at mga opisyal—at sinabi sa kanila, “Matanda na ako; malayo na ang narating ng aking edad.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Literal: “mga ulo nito,” ibig sabihin, mga pangunahing pinuno nito.'
    reason: Pinananatili ang literal na larawan bilang alternatibong leksikal.
  - marker: c
    text: 'Idyomang Hebreo: “dumating ako sa mga araw,” ibig sabihin, malayo na ang narating ng aking edad.'
    reason: Ipinaliliwanag ang idyoma at ang mas literal na anyo nito.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ipinatawag
  rationale: Sa kayariang קרא na may לְ, ang diwa ay pagtawag o pagpapapunta sa mga tao. Likas sa modernong Tagalog ang “ipinatawag” at malinaw na tumutukoy sa pagpapaharap sa mga pinuno.
- source_word: לְכָל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili ang tahasang kolektibong pagtukoy ng Hebreo. Hindi ito pinalitan ng “lahat ng pinuno ng Israel,” sapagkat ang kasunod na talaan ang naglalarawan kung sino ang kumakatawan sa buong Israel.
- source_word: לִזְקֵנָיו
  choice: ang mga matatanda nito
  rationale: Ang hulaping panghalip ay bumabalik sa Israel bilang isang kolektibong bayan. Ang “mga matatanda” ay karaniwang katawagan sa kinikilalang nakatatandang pinuno ng pamayanan.
- source_word: וּלְרָאשָׁיו
  choice: mga pinuno
  rationale: Literal itong “mga ulo,” ngunit sa talaan ng mga katungkulan ay tumutukoy sa mga pangunahing pinuno. Ang “mga pinuno” ay malinaw at natural sa Tagalog, samantalang itinatala sa talababa ang literal na larawan.
- source_word: וּלְשֹׁפְטָיו
  choice: mga hukom
  rationale: Tuwirang tumutukoy ang anyo mula sa שׁפט sa mga opisyal na may tungkuling humatol.
- source_word: וּלְשֹׁטְרָיו
  choice: mga opisyal
  rationale: Tumutukoy ang שֹׁטְרִים sa mga opisyal na tagapangasiwa. Sapat na malawak at likas ang “mga opisyal” sa kontekstong pampamahalaan.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: at sinabi sa kanila
  rationale: Payak at marangal na panimula ito sa tuwirang pananalita.
- source_word: אֲנִי זָקַנְתִּי
  choice: Matanda na ako
  rationale: Ipinapahayag ng Hebrew perfect ang kasalukuyang kalagayang bunga ng pagtanda. Natural itong ipinahahayag sa Tagalog bilang “Matanda na ako.”
- source_word: בָּאתִי בַּיָּמִים
  choice: lubha na akong may edad
  rationale: Ang literal na “dumating ako sa mga araw” ay idyomang Hebreo para sa pagiging malayo na sa katandaan. Ang salin ay likas sa Tagalog at pinananatili ang ikalawang, nagbibigay-diin na pahayag.
theological_decisions:
- issue: Ang tinutukoy ng “buong Israel” kaugnay ng kasunod na talaan ng mga pinuno
  choice: Pinanatili ang “buong Israel,” at itinuring ang kasunod na mga pangkat bilang mga kinatawan nito.
  alternative: Isalin bilang “lahat ng pinuno ng Israel,” na tahasang nililimitahan ang tinawag sa mga lider.
  rationale: Tahasan sa Hebreo ang “buong Israel,” kasunod ang mga matatanda, pinuno, hukom, at opisyal. Pinananatili ng salin ang dalawang sangkap at hindi isinasara ang paraan ng pagkakaugnay ng kolektibong bayan at ng mga kinatawan nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Josue,” ang nakaugaliang anyong Tagalog ng pangalan. Pinanatili ang pag-uulit ng dalawang pahayag tungkol sa katandaan at ang kolektibong “buong Israel,” habang nilinaw sa mga talababa ang idyoma at mga larawang Hebreo.
