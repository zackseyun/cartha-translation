  source_fidelity: Tumpak na naipapahayag ng draft ang pagtawag ni Josue, ang kolektibong “buong Israel” na sinusundan ng talaan ng mga pangkat, at ang dalawang pahayag tungkol sa katandaan. Gayunman, ang talababa sa “buong Israel” ay nagtatakda na mga kinatawan lamang ang tinutukoy, samantalang hindi kailangang ipasya ng Hebreo ang eksaktong ugnayan ng kolektibong katawagan at ng kasunod na talaan.
  naturalness: Marangal at madaling unawain ang daloy. Mas angkop ang “mga nakatatanda” kaysa “mga matatanda” para sa kinikilalang pangkat ng mga elder. Ang “lubha na akong may edad” ay masidhi at medyo di-likas; ang “malayo na ang narating ng aking edad” ay mas maayos na katumbas ng idyomang “dumating sa mga araw” nang hindi nagdaragdag ng tindi.
  terminology: Ang “Josue,” “mga pinuno,” “mga hukom,” at “mga opisyal” ay angkop sa modernong Filipino Tagalog at sa administratibong talaan. Pinananatili ng “mga nakatatanda” ang gamit na pampamayanan ng זקנים.
