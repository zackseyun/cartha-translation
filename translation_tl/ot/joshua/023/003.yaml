- from: At nakita ninyo mismo ang lahat ng ginawa ni Yahweh na inyong Diyos sa lahat ng bansang ito sa harap ninyo[a], sapagkat si Yahweh na inyong Diyos ang siyang nakipaglaban para sa inyo.
  to: At kayo mismo ang nakakita ng lahat ng ginawa ni Yahweh na inyong Diyos sa lahat ng bansang ito alang-alang sa inyo, sapagkat si Yahweh na inyong Diyos ang siyang lumaban alang-alang sa inyo.
