base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: tl
  text: At kayo mismo ang nakakita ng lahat ng ginawa ni Yahweh na inyong Diyos sa lahat ng bansang ito alang-alang sa inyo, sapagkat si Yahweh na inyong Diyos ang siyang lumaban alang-alang sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם רְאִיתֶם
  choice: At nakita ninyo mismo
  rationale: Pinananatili ng “at” ang pagpapatuloy ng pahayag, at ipinahahayag ng “mismo” ang diin ng hiwalay na panghalip na אַתֶּם.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: ang lahat ng ginawa
  rationale: Likas at malawak na salin ito ng buong layon at ng pangkalahatang pandiwang עָשָׂה, nang hindi labis na tinutukoy ang uri ng pagkilos.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang pangmaramihang tipanang pagtukoy na “inyong Diyos.”
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: sa lahat ng bansang ito
  rationale: Ang לְ ay tumutukoy sa mga bansang naapektuhan ng ginawa ni Yahweh; ang “sa” ay natural sa Filipino at hindi labis na nagpapakahulugang “laban sa.”
- source_word: מִפְּנֵיכֶם
  choice: sa harap ninyo
  rationale: Malapit ito sa idyomang Hebreo na literal na “mula sa harap ninyo,” habang ipinauubaya sa talababa ang pahiwatig na itinaboy sila mula sa presensiya ng Israel.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan o paliwanag sa naunang pahayag.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: ang siyang nakipaglaban para sa inyo
  rationale: Ang “ang siyang” ay nagpapanatili sa diin ng הוּא at sa substantibong participle; ang “nakipaglaban para sa inyo” ay natural na pagbabalik-tanaw sa pagkilos ni Yahweh alang-alang sa Israel.
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Tagaganap ng pakikipaglaban
  choice: si Yahweh na inyong Diyos ang siyang nakipaglaban para sa inyo
  alternative: nakipaglaban si Yahweh kasama ninyo
  rationale: Ang לָכֶם ay nagpapahiwatig ng kapakinabangan o pagkilos alang-alang sa Israel, hindi lamang ng pakikisama sa kanila; pinananatili rin ang mariing pagtuon kay Yahweh bilang tagaganap.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ninyo/inyong” para sa pangmaramihang kausap at ang “nakipaglaban” bilang natural na katumbas ng pandiwang pandigma nang hindi binabago ang diin na si Yahweh ang kumilos para sa Israel.
