base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/008.yaml
  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: tl
  text: Sa halip, kumapit kayong mahigpit[a] kay Yahweh, na inyong Diyos, gaya ng inyong ginawa hanggang ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “manatili kayong mahigpit na nakaugnay”; ipinahahayag ng pandiwa ang malapit at matatag na pagkakaugnay sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sa halip
  rationale: Ipinakikita ng mga katagang ito ang matinding pagsalungat sa naunang babala. Mas malinaw sa Filipino ang “Sa halip” kaysa isang kondisyunal na pagbasa.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Kasama ng דבק, ang בְּ ay tumutukoy sa persona na mahigpit na kinakapitán o pinananatiliang kaugnayan; natural sa Filipino ang pang-ukol na “kay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman maramihan ang anyo ng אֱלֹהִים, isahan ang kahulugan nito kapag tumutukoy kay Yahweh; malinaw rin sa hulapi ang kaugnayang “inyong Diyos.”
- source_word: תִּדְבָּקוּ
  choice: manatili kayong mahigpit na nakaugnay
  rationale: Ang דבק ay nagpapahayag ng matatag, malapit, at tipanang pagkakapit. Iniiwasan ng pariralang ito ang di-natural na literal na “kumapit” habang pinananatili ang patuloy na katapatan at malapit na ugnayan.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Natural na ipinakikilala nito ang paghahambing sa kanilang naging asal hanggang sa kasalukuyang araw.
- source_word: עֲשִׂיתֶם
  choice: ginawa ninyo
  rationale: Tumutukoy ito sa kanilang naging pagkilos na umabot sa sandali ng pagsasalita; sapat na naipahahayag sa Filipino ng “ginawa ninyo” ang aspektong ito kasama ng kasunod na pariralang temporal.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Ito ang natural at dignified na katumbas ng karaniwang Hebreong pahayag para sa pagpapatuloy hanggang sa kasalukuyang sandali.
theological_decisions:
- issue: Paglalahad sa tipanang pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng pandiwang דבק
  choice: manatili kayong mahigpit na nakaugnay
  alternative: kumapit kayo; manatili kayong tapat
  rationale: Pinananatili ng salin ang larawan ng malapit at matatag na pagkakapit nang hindi ito nililimitahan sa abstraktong “katapatan” lamang o ginagawang pisikal na pagkapit lamang.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “manatili kayong mahigpit na nakaugnay” upang likas na maipahayag ang tipanang puwersa ng דבק, at inilagay ang [a] kaagad pagkatapos ng pariralang nililinaw nito.
