  to: At si Yahweh na inyong Diyos—siya mismo ang magtataboy sa kanila mula sa inyong harapan at mag-aalis sa kanila mula sa inyong harapan. At aangkinin ninyo ang kanilang lupain[a], gaya ng sinabi sa inyo ni Yahweh na inyong Diyos.[b]
