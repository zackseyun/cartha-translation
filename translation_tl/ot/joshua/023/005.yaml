  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: tl
  text: At si Yahweh na inyong Diyos—siya mismo ang magtataboy sa kanila mula sa inyong harapan at mag-aalis sa kanila mula sa inyong harapan. At aangkinin ninyo ang kanilang lupain[a], gaya ng sinabi sa inyo ni Yahweh na inyong Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mamanahin ninyo ang kanilang lupain.” Ang pandiwang Hebreo ay maaaring mangahulugang “manahin” o “angkinin”; pinili rito ang “aangkinin” dahil sa konteksto ng pagkuha sa lupain.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gaya ng ipinangako sa inyo.” Literal na “gaya ng sinabi sa inyo”; ang sinabi ay gumaganap bilang pangako sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh na inyong Diyos
  rationale: Pinananatili ang pangalang tipan na Yahweh at ang ikalawang panauhang maramihang panuring na 'inyong Diyos' sa natural at marangal na Tagalog.
- source_word: הוּא
  choice: siya mismo
  rationale: 'Ipinapahayag ang diin ng hiwalay na panghalip sa Hebreo: si Yahweh mismo ang kikilos para sa Israel.'
- source_word: יֶהְדֳּפֵם
  choice: magtataboy sa kanila
  rationale: Ipinahihiwatig ng pandiwang הדף ang sapilitang pagpapaalis o pagtataboy; malinaw at natural ito sa konteksto ng lupain.
- source_word: מִפְּנֵיכֶם / מִלִּפְנֵיכֶם
  choice: mula sa inyong harapan / sa harap ninyo
  rationale: Pinananatili ang inuulit na larawang spatial ng Hebreo habang iniiwasan ang lubhang mekanikal na pag-uulit sa Tagalog.
- source_word: וְהוֹרִישׁ אֹתָם
  choice: mag-aalis sa kanila sa lupaing iyon
  rationale: Ang Hiphil ng ירש ay tumutukoy sa pagkakait sa dating mga naninirahan ng kanilang pag-aari o paninirahan. Inihihiwalay ng saling ito ang diwa nito mula sa naunang 'magtataboy' at iniiwasan ang teknikal at di-karaniwang 'aalisan ng pag-aari.'
- source_word: וִירִשְׁתֶּם אֶת־אַרְצָם
  choice: aangkinin ninyo ang kanilang lupain
  rationale: Sa konteksto, ang Qal ng ירש ay aktuwal na pagkuha at paghawak sa lupain. Ang 'aangkinin' ay natural na Tagalog at pinananatili ang posibleng kaugnayan sa mana sa talababa.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: gaya ng sinabi
  rationale: Ang דִּבֶּר ay literal na 'nagsalita/nagsabi.' Pinananatili ng 'sinabi' ang leksikal na anyo at hindi tahasang pinapalitan ng 'ipinangako,' bagaman pangako ang gamit nito sa konteksto.
- source_word: לָכֶם
  choice: sa inyo
  rationale: Natural na Tagalog para sa di-tuwirang layon ng pagsasalita ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Direktang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng 'Yahweh' ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Magkaibang gamit ng ugat na ירש
  choice: mag-aalis sa kanila sa lupaing iyon / aangkinin ninyo ang kanilang lupain
  alternative: Gamitin ang iisang salitang 'aangkin' o 'itataboy' sa dalawang sugnay
  rationale: 'Magkaiba ang stem at tungkulin ng dalawang anyo: kikilos ang Diyos upang mawalan ng hawak ang mga bansa, at kukunin naman ng Israel ang lupain. Pinananatili ng magkaibang salin ang kontrast na ito.'
- issue: Kung tahasang isasalin bilang pangako ang דִּבֶּר
  choice: gaya ng sinabi
  alternative: gaya ng ipinangako
  rationale: Ang sinabi ng Diyos ay may bisa ng pangako sa konteksto, ngunit ang mismong pandiwa ay 'nagsalita/nagsabi.' Pinananatili ng pangunahing teksto ang leksikal na kahulugan at inilalagay sa talababa ang alternatibong kontekstuwal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'inyong' dahil maramihan ang kausap. Ang gitling-pahaba pagkatapos ng 'Diyos' ay nagpapalinaw sa diin ng הוּא. Parehong marker na [a] at [b] ay nasa pangunahing teksto at tumutugma sa mga talababa.
