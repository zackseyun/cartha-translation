revisions:
- from: Sapagkat pinalayas ni Yahweh mula sa harapan ninyo ang malalaki at makapangyarihang mga bansa[a]. At kayo naman, wala ni isang taong nakapanindigan sa harapan ninyo hanggang sa araw na ito.[b]
  to: Sapagkat pinalayas ni Yahweh mula sa harapan ninyo ang malalaki at makapangyarihang mga bansa[a], at kayo naman, walang ni isang taong nakalaban sa inyo nang matagumpay hanggang sa araw na ito.[b]
  rationale: Pinalitan ang di-likas na “nakapanindigan sa harapan ninyo” ng malinaw na idyomatikong Tagalog na naghahatid ng kahulugang walang kalabang matagumpay na nakasulong laban sa Israel. Inayos din ang unang talababa upang mas malinaw na maipahayag ang alternatibong diwa ng pag-aagaw ng lupain. Pinanatili ang ayos, panahon, pagbibigay-diin, at ahensiya ng Hebreo.
