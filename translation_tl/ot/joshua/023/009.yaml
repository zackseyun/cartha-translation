base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: tl
  text: Sapagkat pinalayas ni Yahweh mula sa harapan ninyo ang malalaki at makapangyarihang mga bansa[a], at kayo naman, walang ni isang taong nakalaban sa inyo nang matagumpay hanggang sa araw na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inagawan ng lupain” o “itinaboy.” Maaaring idiin ng pandiwang Hebreo ang pag-aalis sa mga bayan mula sa lupain upang mapasakamay ito ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “walang taong tumayo sa harapan ninyo,” isang idyomang nangangahulugang walang sinumang matagumpay na nakalaban sa inyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: pinalayas
  rationale: Sa Hiphil, ang ירשׁ ay tumutukoy rito sa pagpapaalis o pag-aalis sa mga bayan upang mapasakamay ng Israel ang lupain. Natural sa makabagong Tagalog ang “pinalayas,” habang ang alternatibong diwa na “inalisan ng lupain” ay inilagay sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מִפְּנֵיכֶם
  choice: mula sa harapan ninyo
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo ng pag-aalis sa mga kaaway mula sa harap o landas ng Israel.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: malalaki at makapangyarihang mga bansa
  rationale: Ang “malalaki” ay nagpapahayag ng lawak o kadakilaan ng mga bansa, at ang “makapangyarihan” ay naghahatid ng lakas na nasa עָצוּם.
- source_word: וְאַתֶּם
  choice: At kayo naman
  rationale: Ipinakikita ng “naman” ang pagbibigay-diin at paglipat ng pokus sa Israel nang hindi pinatitindi ang pang-ugnay bilang tahasang pagsalungat.
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  choice: wala ni isang taong nakapanindigan sa harapan ninyo
  rationale: Ang “wala ni isang tao” ay natural na kumakatawan sa singular na אִישׁ, at ang “nakapanindigan sa harapan” ay nagpapanatili sa larawan ng Hebreo habang ipinahihiwatig ang hindi matagumpay na paglaban.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang Tagalog itong katumbas ng idyomang nagsasaad na nagpatuloy ang kalagayan hanggang sa kasalukuyang sandali ng pagsasalaysay.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Dahil personal na pangalan ang tuwirang nasa tekstong Hebreo, inililipat ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Ahensiya ng tagumpay sa pananakop
  choice: Si Yahweh ang tahasang gumawa ng pagpapaalis
  alternative: Ipahiwatig lamang na nagapi ng Israel ang mga bansa
  rationale: Ang pandiwa ay tahasang may יְהוָה bilang simuno; kaya pinananatiling malinaw na ang pagpapaalis sa mga bansa ay gawa ni Yahweh.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang ilang kongkretong larawang Hebreo, gaya ng “mula sa harapan ninyo” at “nakapanindigan sa harapan ninyo,” ngunit nilinaw sa talababa ang idyomatikong diwa.
