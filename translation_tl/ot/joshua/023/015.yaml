  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: tl
  text: 'At mangyayari: kung paanong dumating sa inyo ang bawat mabuting salita na sinabi ni Yahweh na inyong Diyos sa inyo, gayon din dadalhin ni Yahweh sa inyo ang bawat masamang salita[a], hanggang sa lipulin niya kayo at alisin kayo sa mabuting lupaing ito na ibinigay sa inyo ni Yahweh na inyong Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bawat masamang bagay” o “lahat ng kapahamakan.” Sa Hebreo, “bawat masamang salita/bagay,” na katapat ng “bawat mabuting salita” sa unang bahagi ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At mangyayari
  rationale: Ipinakikilala nito ang tiyak na pangyayari sa hinaharap nang may solemneng diin, ngunit hindi gumagamit ng lipas na pananalita.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: kung paanong ... gayon din
  rationale: Malinaw na pinananatili ang paghahambing sa pagitan ng natupad na pagpapala at ng darating na hatol.
- source_word: בָּא עֲלֵיכֶם
  choice: dumating sa inyo
  rationale: Ipinahahayag ang natupad nang sinabi ng Diyos at natural ito sa modernong Tagalog.
- source_word: כָּל הַדָּבָר הַטּוֹב
  choice: ang bawat mabuting salita
  rationale: Pinananatili ang literal na diwa ng דָּבָר at ang sadyang pagkakatulad nito sa ‘bawat masamang salita’ sa ikalawang bahagi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang tipanang pangalan ng Diyos na kinakatawan ng Tetragrammaton.
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: dadalhin ... sa inyo
  rationale: Ipinakikita ang causative na diwa ng Hiphil ng בוא sa natural na Tagalog.
- source_word: כָּל הַדָּבָר הָרָע
  choice: ang bawat masamang salita
  rationale: Pinananatili ang leksikal na paralelismo sa ‘bawat mabuting salita,’ habang nililinaw sa talababa na maaari rin itong tumukoy sa masamang bagay o kapahamakan.
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: hanggang sa lipulin niya kayo
  rationale: Malinaw na ipinahahayag ang hantungan o sukdulan ng hatol.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: sa mabuting lupaing ito
  rationale: Sa Tagalog, ang ‘lipulin kayo sa lupaing ito’ ay natural na naghahatid ng diwang aalisin sila mula roon sa pamamagitan ng paglipol; iniiwasan ang alanganing literalismong ‘mula sa ibabaw ng.’
theological_decisions:
- issue: Paglalarawan sa hatol ng Diyos sa pamamagitan ng רָע
  choice: masamang salita
  alternative: kapahamakan; masamang bagay
  rationale: Hindi nilulutas nang lampas sa teksto ang tensiyon sa pagitan ng mabuti at masama. Pinananatili ang paralelismo ng ‘salita,’ samantalang ipinapaliwanag ng talababa na ang ‘masama’ rito ay maaaring tumukoy sa kapahamakan o hatol, hindi sa moral na kasamaan ng Diyos.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal at tipanang pangalan na nasa tekstong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na paghahambing na ‘kung paanong ... gayon din’ at ang sadyang pag-uulit ng ‘salita’ sa Hebreo.
