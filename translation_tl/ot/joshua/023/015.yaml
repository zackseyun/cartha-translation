  source_fidelity: Ang draft ay maayos na pinananatili ang paghahambing na כַּאֲשֶׁר ... כֵּן, ang paralelismong “mabuting salita / masamang salita,” at ang pangalang Yahweh. Gayunman, ang “lipulin niya kayo sa mabuting lupaing ito” ay maaaring mangahulugang magaganap ang paglipol habang naroon sila, samantalang ang מֵעַל ay malinaw na nagsasaad ng pag-aalis mula sa lupain. Kailangang ihayag ang direksiyong ito.
  naturalness: Makabago at marangal ang pangkalahatang Tagalog. Mas natural ang ayos na “na sinabi ni Yahweh na inyong Diyos sa inyo.” Ang “alisin niya kayo sa mabuting lupaing ito” ay malinaw at idiomatiko sa kontekstong hatol.
  terminology: Tama ang “Yahweh,” “mabuting salita,” at “masamang salita.” Ang talababa ay wastong nagpapakita na ang דָּבָר ay maaari ring mangahulugang bagay o kapahamakan, nang hindi binubura ang paralelismo sa pangunahing teksto.
  issues:
