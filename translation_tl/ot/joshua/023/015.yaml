    issue: Hindi naipahahayag nang sapat ang מֵעַל sa hulihan ng talata.
    rationale: Ang “sa mabuting lupaing ito” ay lokatibo lamang; ang Hebreo ay nagsasabing lilipulin sila mula sa ibabaw/ng lupain. Idinaragdag ang malinaw na “aalisin niya kayo sa” upang mapanatili ang direksiyong ito.
  - severity: low
    issue: Medyo alanganin ang ayos na “na sinabi sa inyo ni Yahweh.”
    rationale: Hindi mali, ngunit mas malinaw at mas natural sa modernong Filipino ang “na sinabi ni Yahweh na inyong Diyos sa inyo.”
