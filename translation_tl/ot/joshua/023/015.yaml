  to: 'At mangyayari: kung paanong dumating sa inyo ang bawat mabuting salita na sinabi ni Yahweh na inyong Diyos sa inyo, gayon din dadalhin ni Yahweh sa inyo ang bawat masamang salita[a], hanggang sa lipulin niya kayo at alisin kayo sa mabuting lupaing ito na ibinigay sa inyo ni Yahweh na inyong Diyos.'
