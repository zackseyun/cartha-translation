source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: tl
  text: At narito, ngayon ay tatahak na ako sa daan ng lahat ng tao.[a] Alam ninyo sa buong puso ninyo at buong kaluluwa ninyo na wala ni isang salita ang nabigo mula sa lahat ng mabubuting salitang sinabi ni Yahweh, na inyong Diyos, tungkol sa inyo. Natupad sa inyo ang lahat ng iyon; wala ni isang salita sa mga iyon ang nabigo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “daan ng lahat ng tao” ay idyomang Hebreo para sa karaniwang hantungan ng lahat ng tao, lalo na ang kamatayan.
    reason: cultural_note
  - marker: b
    text: Sa literal na Hebreo, “wala ni isang salita ang nahulog.” Ang “nahulog” ay idyomang tumutukoy sa pagkabigo o hindi pagkakatupad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang maringal na panawag-pansin sa simula ng pahayag, ngunit likas pa rin sa kasalukuyang Filipino.
- source_word: אָנֹכִי הוֹלֵךְ הַיּוֹם בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: ngayon ay patungo na ako sa daang tinatahak ng lahat ng nasa lupa
  rationale: Pinananatili ang talinghaga ng paglalakbay at ang diwang nalalapit na pagpanaw, sa halip na tahasang palitan ito ng ‘mamamatay na ako.’
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: nang buong puso at buong kaluluwa
  rationale: Pinananatili ang magkatambal na ‘puso’ at ‘kaluluwa’ at ipinahahayag ang ganap at panloob na katiyakan.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: wala ni isang salita ang nabigo
  rationale: Ang ‘salita’ ay nagpapanatili ng ugnayan sa pandiwang ‘sinabi,’ samantalang ang ‘nabigo’ ay likas na Filipino para sa idyomang Hebreo na literal na ‘nahulog.’
- source_word: מִכֹּל הַדְּבָרִים הַטּוֹבִים
  choice: sa lahat ng mabubuting salita
  rationale: Pinananatili ang pag-uulit ng דָּבָר at ang kaugnayan nito sa pagsasalita ng Diyos, nang hindi agad nililimitahan ang kahulugan sa teknikal na ‘mga pangako.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalang tipan ayon sa anyong Yahweh sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר דִּבֶּר ... עֲלֵיכֶם
  choice: sinabi ... tungkol sa inyo
  rationale: Ang ‘tungkol sa inyo’ ay maingat na kumakatawan sa עַל at hindi ito basta ginagawang ‘sa inyo.’
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: Natupad sa inyo ang lahat ng iyon
  rationale: Ipinahahayag nang natural sa Filipino ang larawan ng mga salitang ‘dumating’ sa Israel, na sa konteksto ay tumutukoy sa katuparan ng mga ito.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; ang ‘Yahweh’ ay tuwirang kumakatawan rito nang hindi ito ginagawang titulo.
- issue: Kung tatawaging tahasang ‘mga pangako’ ang הַדְּבָרִים הַטּוֹבִים
  choice: mabubuting salita
  alternative: mabubuting pangako
  rationale: Tumutukoy ang konteksto sa mga pangakong natupad, ngunit pinananatili ng ‘mabubuting salita’ ang leksikal na ugnayan sa ‘sinabi’ at hindi inaalis ang lawak ng דָּבָר.
- issue: Kung tahasang isasalin bilang kamatayan ang ‘daan ng lahat ng nasa lupa’
  choice: panatilihin ang talinghaga sa pangunahing teksto
  alternative: mamamatay na ako
  rationale: Malinaw na tumutukoy ang idyoma sa karaniwang hantungan ng sangkatauhan, lalo na sa kamatayan, ngunit mahalagang panatilihin ang maringal na talinghaga at ipaliwanag ito sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang mga susing talinghaga at pag-uulit ng Hebreo, habang ginawang natural ang pahayag ng katuparan. Ang ‘kayo’ ay maramihan sa buong talata.
