revisions:
- from: At narito, ngayon ay patungo na ako sa daang tinatahak ng lahat ng nasa lupa.[a] Alam ninyo nang buong puso at buong kaluluwa na wala ni isang salita ang nabigo[b] sa lahat ng mabubuting salitang sinabi ni Yahweh na inyong Diyos tungkol sa inyo. Natupad sa inyo ang lahat ng iyon; wala ni isang salita ang nabigo.
  to: At narito, ngayon ay tatahak na ako sa daan ng lahat ng tao.[a] Alam ninyo sa buong puso ninyo at buong kaluluwa ninyo na wala ni isang salita ang nabigo mula sa lahat ng mabubuting salitang sinabi ni Yahweh, na inyong Diyos, tungkol sa inyo. Natupad sa inyo ang lahat ng iyon; wala ni isang salita sa mga iyon ang nabigo.[b]
  rationale: Pinalitan ang posibleng malabong “lahat ng nasa lupa” ng “lahat ng tao” upang maipahayag ang tinutukoy ng idyoma nang hindi inaalis ang metaporang “daan.” Nilinaw rin ang magkatambal na “puso” at “kaluluwa,” at inayos ang huling pag-uulit upang maipakita na walang isa man sa mga salitang iyon ang nabigo. Inilipat ang talababa tungkol sa “nahulog” sa huling paglitaw nito, kung saan nakalapat ang marker sa idyomang ipinaliliwanag.
