reference: Joshua 23:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: tl
  text: Kung[a] lalabagin ninyo ang tipan ni Yahweh na inyong Diyos, na iniutos niya sa inyo, at tutungo kayo upang maglingkod sa ibang mga diyos at yuyukod sa kanila, mag-aalab ang galit ni Yahweh laban sa inyo, at mabilis kayong mapaparam mula sa mabuting lupaing ibinigay niya sa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pambungad na Hebreo ay maaari ring isaling, “Kapag nilabag ninyo ang tipan ni Yahweh na inyong Diyos.” Maaaring temporal o kondisyonal ang konstruksyon.
    reason: alternative_reading
  - marker: b
    text: Ang “mula sa mabuting lupain” ay nagdiriin sa pag-aalis mula sa lupaing ibinigay ni Yahweh sa kanila.
    reason: lexical_clarification
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: Kung lalabagin ninyo
  rationale: Ang ב na may infinitive construct ay maaaring temporal o kondisyonal; sa konteksto ng babala, natural ang kondisyonal na “kung.” Ang עבר ברית ay idyomang nangangahulugang lumabag sa tipan.
- source_word: בְּרִית
  choice: tipan
  rationale: Karaniwang salitang Tagalog na nagpapanatili sa legal at teolohikal na bigat ng covenant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: na iniutos niya sa inyo
  rationale: Tuwirang salin ng sugnay; hindi idinagdag ang “na tuparin,” na wala namang tahasang katumbas sa Hebreo.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: at hahayo kayo upang maglingkod
  rationale: Pinananatili ng “hahayo” ang diwa ng pagpunta, samantalang ang “maglingkod” ay nagpapanatili sa leksikal na kaibhan nito sa kasunod na pagyukod.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Likas at tuwirang salin ng pariralang tumutukoy sa mga karibal na diyos.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: at yuyukod sa kanila
  rationale: Ipinahahayag ang tiyak na kilos ng pagpapatirapa o pagyukod nang hindi ito ipinapantay lamang sa naunang “maglingkod.”
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: mag-aalab ang galit ni Yahweh laban sa inyo
  rationale: Pinananatili ang Hebreong metapora ng nagliliyab na galit at ang direksiyon nitong laban sa bayan.
- source_word: וַאֲבַדְתֶּם מְהֵרָה מֵעַל הָאָרֶץ הַטּוֹבָה
  choice: at mabilis kayong mapaparam mula sa mabuting lupain
  rationale: Ang “mapaparam” ay nagpapanatili sa matinding babala ng אבד, at ang “mula sa” ay nagpapakita ng pag-aalis sa lupaing ibinigay sa kanila.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinanatili itong personal na pangalan sa transliterasyong “Yahweh.”
- issue: Kondisyonal o temporal na pagbasa sa pambungad
  choice: Kung lalabagin ninyo
  alternative: Kapag nilabag ninyo
  rationale: Maaaring kondisyonal o temporal ang Hebreong konstruksyon. Ang “kung” ay angkop sa konteksto ng babalang nakasalalay sa pagtalikod at hindi nagpapahiwatig na tiyak na mangyayari iyon.
- issue: Saklaw ng אבד kaugnay ng lupain
  choice: mapaparam mula sa mabuting lupain
  alternative: mawawala kayo sa mabuting lupain; lilipulin kayo
  rationale: Pinananatili nito ang bigat ng pagkapahamak at ang tahasang diin ng kasunod na parirala sa pagkawala o pag-aalis mula sa lupain, nang hindi nililimitahan ang salita sa isang denominasyonal na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tipan,” “lalabagin,” at “mapaparam” upang mapanatili ang bigat ng babalang pangtipan; malinaw pa rin ang pangungusap para sa karaniwang mambabasa.
