language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: tl
  text: At nang umahon mula sa gitna ng Jordan ang mga paring nagdadala ng kaban ng tipan ni Yahweh, at maiahon ang mga talampakan ng mga pari sa tuyong lupa, bumalik ang tubig ng Jordan sa kinalalagyan nito at muling umapaw sa lahat ng pampang nito gaya ng dati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “gaya ng kahapon at noong makalawa,” isang idyomang nangangahulugang “gaya ng dati” o “gaya noong una.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: At nang makaahon
  rationale: Ang וַיְהִי ay karaniwang panandang pasalaysay, at ang בַעֲלוֹת ay temporal na infinitive. Sa modernong Tagalog, likas na naihahatid ng “At nang makaahon” ang pagsulong ng salaysay at ang ugnayang temporal nang hindi gumagamit ng mabigat na “at nangyari.”
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: ang mga paring may pasan sa kaban ng tipan ni Yahweh
  rationale: Ang “may pasan” ay malinaw at marangal na katumbas ng participle נֹשְׂאֵי. Pinananatili ng “kaban ng tipan ni Yahweh” ang construct chain at ang personal na banal na pangalan.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: mula sa gitna ng Jordan
  rationale: Tuwirang ipinahahayag ang paglabas mula sa loob o gitna ng ilog.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: pagkapahid ng mga talampakan nila sa tuyong lupa
  rationale: Sa konteksto, inilalarawan ng נִתְּקוּ ang sandaling maialis o maiahon ang mga paa mula sa ilog at sumayad sa tuyong lupa. Ang “pagkapahid” ay natural sa Tagalog para sa agarang temporal na sandali ng pagkakadikit, habang ang “mga talampakan” ay tumpak para sa כַּפּוֹת רַגְלֵי.
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: bumalik ang tubig ng Jordan sa dati nitong kinalalagyan
  rationale: Pinananatili ang kilos ng tubig na ‘bumalik’ sa lugar nito; idinagdag ang “dati” bilang likas na paglilinaw sa Tagalog.
- source_word: וַיֵּלְכוּ ... עַל כָּל גְּדוֹתָיו
  choice: umapaw muli sa lahat ng pampang nito
  rationale: Bagaman literal na ‘pumunta’ ang וַיֵּלְכוּ, sa konteksto ng tubig at ng עַל כָּל גְּדוֹתָיו, malinaw at natural ang “umapaw ... sa lahat ng pampang nito,” na tumutukoy sa karaniwang bahang lagpas sa mga pampang.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: gaya ng dati
  rationale: Ang literal na ‘gaya kahapon at noong makalawa’ ay isang Hebreong idyoma para sa dating kalagayan; natural itong isinalin na “gaya ng dati,” habang inilalahad sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang יְהוָה sa teksto. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Iniwasan ang lipas na “at nangyari” bilang pambungad; ginamit ang mas likas na temporal na ayos. Pinanatili ang “Jordan,” “kaban ng tipan,” at “Yahweh” bilang mga pamilyar at tumpak na katawagan.
