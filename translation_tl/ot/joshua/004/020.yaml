  text: And Joshua set up these twelve stones at Gilgal, which they had taken from the Jordan.
translation:
  language: tl
  text: At itinayo ni Josue sa Gilgal ang labindalawang batong ito na kinuha nila mula sa Jordan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: At
  rationale: Iniuugnay ng וְ ang talata sa naunang salaysay; walang tuwirang katumbas sa Tagalog ang panandang layon na אֵת.
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: ang labindalawang batong ito
  rationale: Likas na ayos sa modernong Tagalog ang bilang bago ang pangngalan at ang demonstratibo pagkatapos nito; napananatili ang bilang at pagtukoy ng Hebreo.
- source_word: אֲשֶׁר לָקְחוּ
  choice: na kinuha nila
  rationale: Ang sugnay na may אֲשֶׁר ay tumutukoy sa mga bato. Ipinahihiwatig na ng aspektong Tagalog at ng konteksto na nauna ang pagkuha sa pagtatayo.
- source_word: מִן הַיַּרְדֵּן
  choice: mula sa Jordan
  rationale: Malinaw sa konteksto na ang Jordan ang ilog; hindi kailangang idagdag ang 'Ilog' upang katawanin ang tekstong Hebreo.
- source_word: הֵקִים
  choice: itinayo
  rationale: Sa konteksto ng mga batong inilagay bilang bantayog, natural at tumpak ang 'itinayo,' na naghahayag ng paglalagay sa nakatayong ayos.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa tradisyong Tagalog sa Bibliya.
- source_word: בַּגִּלְגָּל
  choice: sa Gilgal
  rationale: Ang 'sa' ang natural na katumbas ng בְּ para sa lokasyon sa modernong Tagalog.
