  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: tl
  text: upang maging tanda ito sa gitna ninyo. Kapag nagtanong ang inyong mga anak[a] sa hinaharap[b], ‘Ano ang ibig sabihin ng mga batong ito para sa inyo?’[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “inyong mga anak na lalaki”; dito ay tumutukoy ito sa mga anak o sa susunod na salinlahi sa pangkalahatan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bukas”; maaari itong tumukoy sa darating na panahon.
    reason: lexical_alternative
