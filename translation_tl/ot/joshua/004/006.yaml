    text: 'Mas literal: “Ano ang mga batong ito sa inyo?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin at pinananatili ang purposive force ng Hebreo.
- source_word: תִּהְיֶה זֹאת אוֹת
  choice: maging tanda ito
  rationale: Ipinapahayag ang nilalayong resulta; ang אוֹת ay tuwirang isinaling “tanda” nang hindi dinaragdagan ng “alaala.”
- source_word: בְּקִרְבְּכֶם
  choice: sa gitna ninyo
  rationale: Tumutukoy sa presensiya ng tanda sa loob ng pamayanan at malapit sa anyo ng Hebreo.
- source_word: כִּי יִשְׁאָלוּן
  choice: Kapag nagtanong
  rationale: Sa konteksto, ipinakikilala ng כִּי ang inaasahang pangyayari kung kailan gagampanan ng tanda ang layunin nito.
- source_word: בְּנֵיכֶם
  choice: inyong mga anak
  rationale: Literal na “inyong mga anak na lalaki,” ngunit kumakatawan dito sa susunod na salinlahi; natural at hindi mapanlinlang ang “mga anak.”
- source_word: מָחָר
  choice: sa hinaharap
  rationale: Bagaman literal na “bukas,” idiomatiko itong tumutukoy rito sa darating na panahon.
- source_word: לֵאמֹר
  choice: omitted as a separate word
  rationale: Ang tuwirang sipi kasunod ng “nagtanong” ay sapat at mas natural sa Filipino; taglay pa rin nito ang quotative function.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה לָכֶם
  choice: Ano ang kahulugan sa inyo ng mga batong ito?
  rationale: Ipinahahayag sa natural na Filipino ang literal na “Ano ang mga batong ito sa inyo?” habang pinananatili ang personal/community relation na nasa לָכֶם.
theological_decisions:
- issue: Saklaw ng בְּנֵיכֶם
  choice: inyong mga anak
  alternative: inyong mga anak na lalaki
  rationale: Ang panlalaking anyo ay ginagamit nang representatibo para sa susunod na salinlahing magtatanong tungkol sa tanda; hindi ipinapalagay ng konteksto na mga lalaki lamang ang tinutukoy.
- issue: Kahulugan ng tanong na מָה ... לָכֶם
  choice: Ano ang kahulugan sa inyo ng mga batong ito?
  alternative: Ano ang mga batong ito sa inyo?
  rationale: Ang natural na salin ay nagpapakita na itinatanong ang kabuluhan ng mga bato, ngunit ang “sa inyo” ay pinanatili upang hindi gawing purong impersonal ang tanong.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “sa gitna ninyo” upang mapanatili ang larawang pampamayanan, at hinati sa dalawang pangungusap gaya ng natural na daloy sa Filipino. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
