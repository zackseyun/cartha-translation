  to: At nagtayo si Josue ng labindalawang bato sa gitna ng Jordan, sa ilalim ng lugar na kinatatayuan ng mga paring nagdadala ng Kaban ng Tipan.[a] At naroon ang mga iyon hanggang sa araw na ito.
