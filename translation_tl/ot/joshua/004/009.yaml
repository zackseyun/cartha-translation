source:
  edition: WLC
  text: וּ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה אֲבָנִ֗ים הֵקִ֣ים יְהוֹשֻׁעַ֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ תַּ֗חַת מַצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הַ/בְּרִ֑ית וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: tl
  text: At nagtayo si Josue ng labindalawang bato sa gitna ng Jordan, sa ilalim ng lugar na kinatatayuan ng mga paring nagdadala ng Kaban ng Tipan.[a] At naroon ang mga iyon hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa ilalim ng puwestong kinatatayuan ng mga paa ng mga pari.” Tumutukoy ang Hebreong pananalita sa mismong lugar na kinatatayuan ng mga pari habang dala nila ang Kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: nagtayo
  rationale: Ang Hiphil ng קום ay nangangahulugang magtayo o maglagay nang nakatayo. Ang “nagtayo” ay likas sa Filipino at angkop sa mga batong nagsisilbing alaala.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: sa gitna ng Jordan
  rationale: Pinananatili nito ang tuwirang lokasyong ipinahahayag ng תּוֹךְ—ang gitna o kaloob-looban ng Jordan—nang hindi pinapawi ang tensiyon sa konteksto.
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: sa ilalim ng kinatatayuan ng mga paa
  rationale: Pinananatili ng “sa ilalim” ang puwersa ng תַּחַת, habang likas na ipinahahayag ng “kinatatayuan” ang מַצַּב bilang lugar o puwestong tinatayuan.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: mga paring nagdadala ng Kaban ng Tipan
  rationale: Malinaw at pangkaraniwang salin ng participle נֹשְׂאֵי ang “nagdadala”; pinananatili ng “Kaban ng Tipan” ang natatanging katawagan sa sagradong kaban.
- source_word: וַיִּהְיוּ שָׁם
  choice: Naroon ang mga iyon
  rationale: Sa kaugnayan nito sa “hanggang sa araw na ito,” ipinapakita nito ang patuloy na kalagayan mula sa pananaw ng tagapagsalaysay.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Ito ang likas at tapat na katumbas ng pormulang Hebreo para sa pananatili hanggang sa panahon ng tagapagsalaysay.
theological_decisions:
- issue: Tensiyon sa salaysay sa pagitan ng mga batong itinayo sa Jordan sa talatang ito at ng labindalawang batong itinayo sa Gilgal sa nakapaligid na konteksto
  choice: Isinalin nang tuwiran na nagtayo si Josue ng labindalawang bato sa gitna mismo ng Jordan.
  alternative: Ituring itong buod ng mga batong kinuha sa Jordan at itinayo sa ibang lugar, o baguhin ang diwa upang iisa lamang ang alaala.
  rationale: Maliwanag na sinasabi ng tekstong Hebreo na itinayo ni Josue ang mga bato בְּתוֹךְ הַיַּרְדֵּן, “sa gitna ng Jordan.” Hindi dapat tahimik na pagtugmain ng salin ang posibleng tensiyon.
- issue: Puwersa ng pormulang pang-alaala na עַד הַיּוֹם הַזֶּה
  choice: “Naroon ang mga iyon hanggang sa araw na ito,” bilang patuloy na kalagayan mula sa pananaw ng tagapagsalaysay.
  alternative: “Naroon ang mga iyon noon hanggang sa araw na ito.”
  rationale: Pinananatili nito ang pananaw sa panahon ng tagapagsalaysay nang hindi sinasabing naroon pa o nakikita pa ang mga bato sa kasalukuyang panahon ng mambabasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue,” “Jordan,” at “Kaban ng Tipan” bilang pamilyar na mga katawagang biblikal. Pinanatili ang medyo kongkretong pananalitang “kinatatayuan ng mga paa” dahil mahalaga sa Hebreo ang eksaktong puwesto, at nilinaw ito sa talababa.
