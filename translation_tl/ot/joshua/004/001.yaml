  source_fidelity: Tumpak na naihahatid ng salin ang temporal na sugnay, ang natapos na pagtawid ng kolektibong Israel sa Jordan, at ang kasunod na pagsasalita ni Yahweh kay Josue. Ang natural na Tagalog na “Nang” ay sapat na katumbas sa naratibong “at nangyari, nang/kapag” nang hindi nagiging artipisyal ang pangungusap.
