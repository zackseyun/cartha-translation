id: JOS.4.1
reference: Joshua 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֙ כַּ/אֲשֶׁר תַּ֣מּוּ כָל הַ/גּ֔וֹי לַ/עֲב֖וֹר אֶת הַ/יַּרְדֵּ֑ן וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־־־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
translation:
  language: tl
  text: Nang matapos tumawid sa Jordan ang buong bansa[a], sinabi ni Yahweh kay Josue,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang buong bayan.” Isahang kolektibong katawagan ang salitang Hebreo para sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Ang kombinasyong ito ay nagbubukas ng kasunod na pangyayari sa salaysay at ng sugnay na panahunan. Sa natural na Tagalog, sapat ang “Nang” upang ipakita ang temporal na ugnayan nang hindi gumagamit ng mabigat na “At nangyari.”
- source_word: תַּמּוּ ... לַעֲבוֹר
  choice: matapos tumawid
  rationale: Ipinahihiwatig ng תמם ang pagkakumpleto ng pagtawid. Ang “matapos tumawid” ay malinaw at likas na Tagalog para sa kilos na natapos bago nagsalita si Yahweh.
- source_word: כָל הַגּוֹי
  choice: ang buong bansa
  rationale: Pinananatili nito ang isahang kolektibong larawan ng גּוֹי para sa Israel, habang nananatiling maunawaan sa modernong Tagalog.
- source_word: אֶת הַיַּרְדֵּן
  choice: sa Jordan
  rationale: Karaniwang anyong heograpikal sa Tagalog ang “Jordan”; ang pang-ukol na “sa” ay likas na kasama ng pandiwang “tumawid.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר ... אֶל יְהוֹשֻׁעַ לֵאמֹר
  choice: sinabi ni Yahweh kay Josue,
  rationale: Likas na Tagalog para sa karaniwang pormula ng pagpapakilala sa tuwirang pananalita; ipinahihiwatig ng kuwit na nagpapatuloy sa susunod na talata ang nilalaman ng sinabi.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ang “Josue” ang nakaugaliang anyo ng pangalang biblikal na ito sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi ipinapasok ang isang partikular na tradisyong denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang natural na ayos ng pangungusap at ang nakaugaliang pangalang “Josue,” habang pinanatili ang kolektibong diwa ng “buong bansa.”
