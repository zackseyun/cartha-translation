  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: tl
  text: At ang mga paring nagdadala ng Kaban ay nakatayo sa gitna ng Jordan hanggang sa matapos ang lahat ng iniutos ni Yahweh kay Josue na sabihin sa bayan[a], ayon sa lahat ng iniutos ni Moises kay Josue. Nagmadali ang bayan at tumawid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hanggang sa matapos ang buong bagay/usapin.” Ang parirala ay tumutukoy sa pagkumpleto ng kabuuan ng iniutos ni Yahweh kay Josue na sabihin sa bayan.
    reason: Ipinapakita ang mas literal na saklaw ng דָּבָר (“bagay, usapin, salita”) at nililinaw kung bakit idiomatikong isinalin ang parirala bilang “lahat ng iniutos,” nang hindi nagdaragdag ng tiyak na interpretasyon.
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang salin ng tiyak na pangmaramihang pangngalan; pinananatili ang pantukoy.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: may pasan ng Kaban
  rationale: Ipinahahayag ng participle ang patuloy nilang pagdadala. Natural sa Filipino ang “may pasan,” at pinananatili ng malaking titik ang natatanging banal na Kaban sa konteksto.
- source_word: עֹמְדִים
  choice: nanatiling nakatayo
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy na tindig habang isinasagawa ang ibang pangyayari; malinaw itong naipahahayag ng pariralang Filipino.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: sa gitna ng Jordan
  rationale: Tuwirang pinananatili ang lokasyong nasa gitna o loob ng ilog, nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: hanggang sa matapos ang buong bagay
  rationale: Pinananatili ang malawak at bahagyang malabong kahulugan ng דָּבָר bilang “bagay/usapin/salita,” sa halip na tahimik na ipakahulugang mga gawain lamang.
- source_word: צִוָּה יְהוָה
  choice: iniutos ni Yahweh
  rationale: Likas na anyong Filipino para sa naunang utos; ang pangalang tipan na יהוה ay tinutumbasang Yahweh.
- source_word: לְדַבֵּר אֶל הָעָם
  choice: na sabihin sa bayan
  rationale: Natural na Filipino para sa pagsasalita sa bayan at hindi nililimitahan ang nilalaman sa pagbibigay lamang ng impormasyon.
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: ayon sa lahat ng iniutos ni Moises kay Josue
  rationale: Pinananatili ang diwa ng ganap na pagsunod o pagkakaayon na ipinahahayag ng כְּכֹל.
- source_word: וַיְמַהֲרוּ
  choice: nagmadali
  rationale: Karaniwan at kasalukuyang salitang Filipino na malinaw na naghahatid ng pagmamadali.
- source_word: וַיַּעֲבֹרוּ
  choice: tumawid
  rationale: Sa konteksto ng Jordan, likas at sapat ang “tumawid” upang ipahayag ang paglipat sa kabilang panig.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasan ang Tetragrammaton sa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng isang titulo.
- issue: Saklaw ng “buong bagay” at kaugnayan nito sa utos na magsalita
  choice: Pinanatili sa pangunahing teksto ang “buong bagay,” na may paliwanag sa talababa
  alternative: lahat ng iniutos ni Yahweh; lahat ng dapat gawin
  rationale: Maaaring tumukoy ang דָּבָר sa salita, bagay, o kabuuang usapin. Hindi dapat ganap na lutasin ng salin kung ang diin ay nasa natapos na pagsasalita o sa kabuuan ng iniutos na pangyayari.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa pampublikong pagbasa. Ginamit ang “bayan” para sa kolektibong הָעָם, “Josue” bilang nakaugaliang anyong Filipino ng pangalan, at “Kaban” bilang pinaikling pantukoy sa Kaban ng Tipan na malinaw na sa konteksto.
