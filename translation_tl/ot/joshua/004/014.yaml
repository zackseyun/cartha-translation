  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: tl
  text: Noong araw na iyon, ginawang dakila ni Yahweh si Josue sa paningin ng buong Israel. Kinatakutan nila siya[a] gaya ng pagkatakot nila kay Moises sa buong panahon ng buhay ni Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “namangha sila sa kanya” o “nagpitagan sila sa kanya”; ang pandiwang Hebreo ay maaaring tumukoy sa takot, pagkamangha, o pagpipitagan ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Noong araw na iyon
  rationale: Likas na panandang temporal sa salaysay at malinaw na tumutukoy sa tiyak na araw na binanggit.
- source_word: גִּדַּל
  choice: ginawang dakila
  rationale: 'Pinananatili ang causative na diwa ng Piel: si Yahweh ang dahilan kung bakit kinilala si Josue bilang dakila.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: sa paningin ng buong Israel
  rationale: Pinananatili ang larawang Hebreo at malinaw na ipinahahayag ang pampublikong pagkilala kay Josue.
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: Kinatakutan nila siya
  rationale: Pinananatili ang lawak ng ירא, na maaaring magpahiwatig ng takot, pagpipitagan, o pagkamangha ayon sa konteksto.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Natural na naghahayag ng tuwirang paghahambing sa naging saloobin nila kay Moises.
- source_word: יָרְאוּ אֶת מֹשֶׁה
  choice: pagkatakot nila kay Moises
  rationale: Pinananatili ang leksikal na pagkakatulad ng dalawang gamit ng ירא at ang paghahambing kina Josue at Moises.
- source_word: כָּל יְמֵי חַיָּיו
  choice: sa lahat ng araw ng buhay niya
  rationale: Malapit sa idyomang Hebreo at pinananatili ang kabuuang saklaw ng panahon; sa konteksto, ang panghalip ay pinakamalapit na tumutukoy kay Moises.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng ירא kaugnay ni Josue
  choice: Kinatakutan nila siya
  alternative: Pinagpitaganan nila siya / namangha sila sa kanya
  rationale: Hindi nililimitahan ng salin ang salita sa simpleng paggalang lamang. Pinananatili nito ang tensiyon sa pagitan ng takot, pagkamangha, at pagpipitagan, habang ipinapaliwanag sa talababa ang saklaw ng kahulugan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang mga nakasanayang anyong Tagalog na “Josue” at “Moises.” Pinanatili ang larawang “sa paningin” at ang bahagyang pormal na himig ng “sa lahat ng araw ng buhay niya” upang maingatan ang ritmo at saklaw ng Hebreo.
