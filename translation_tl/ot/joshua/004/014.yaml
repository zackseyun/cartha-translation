- from: Noong araw na iyon, ginawang dakila ni Yahweh si Josue sa paningin ng buong Israel. Kinatakutan nila siya[a] gaya ng pagkatakot nila kay Moises sa lahat ng araw ng buhay niya.
  to: Noong araw na iyon, ginawang dakila ni Yahweh si Josue sa paningin ng buong Israel. Kinatakutan nila siya[a] gaya ng pagkatakot nila kay Moises sa buong panahon ng buhay ni Moises.
  rationale: Pinalitan ang pangwakas na panghalip ng “ni Moises” upang tahasang maipakita ang reperenteng hinihingi ng konteksto at ng Hebreo. Inayos ang isang alternatibo sa talababa tungo sa mas likas na modernong Filipino. Napanatili ang paghahambing, ang saklaw na “buong panahon,” at ang sinadyang lawak ng ירא.
