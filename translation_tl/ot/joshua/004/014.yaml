  terminology: Ang “Yahweh,” “Josue,” at “Moises” ay angkop at pare-pareho. Ang “kinatakutan” ay mapanghahawakang salin ng ירא at pinananatili ang intensiyonal na lawak nito; sinusuportahan ito ng talababa.
