  source_fidelity: 'Tapat ang pangunahing diwa: si Yahweh ang nagbigay kay Josue ng dakilang katayuan sa paningin ng buong Israel, at ang tugon ng Israel ay inihambing sa naging tugon nila kay Moises. Gayunman, ang panghalip na “niya” sa hulihan ay maaaring pansamantalang iugnay sa Josue sa modernong Filipino, samantalang malinaw na si Moises ang tinutukoy ng Hebreo.'
