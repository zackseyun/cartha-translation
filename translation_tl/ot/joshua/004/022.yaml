base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/022.yaml
  text: then you shall let your children know[a], saying, ‘Israel crossed this Jordan on dry ground.’
translation:
  language: tl
  text: ipaalam ninyo sa inyong mga anak[a] at sabihin, ‘Tumawid ang Israel sa Jordang ito sa tuyong lupa.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak na lalaki”; maaaring tumukoy ang salitang Hebreo sa mga anak na lalaki lamang o sa mga anak sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: ipaalam ninyo
  rationale: 'Ang Hiphil ng ידע ay nagpapahayag ng sanhi: ‘ipaalam’ o ‘ipabatid.’ Likas at malinaw sa modernong Filipino ang ‘ipaalam ninyo.’'
- source_word: בְּנֵיכֶם
  choice: inyong mga anak
  rationale: Maaaring tumukoy ang בנים sa mga anak na lalaki o, ayon sa konteksto, sa mga anak sa pangkalahatan. Ang konteksto ng pagtuturo sa susunod na salinlahi ay sumusuporta sa mas malawak na ‘mga anak,’ habang inilalahad sa talababa ang mas makitid na posibilidad.
- source_word: לֵאמֹר
  choice: at sabihin
  rationale: Ipinakikilala nito ang mismong nilalaman ng ipaaalam. Mas natural sa Filipino ang ‘at sabihin’ kaysa sa literal na ‘na nagsasabi.’
- source_word: בַּיַּבָּשָׁה
  choice: sa tuyong lupa
  rationale: Ang pangngalan ay nangangahulugang tuyong lupa. Ang ‘sa tuyong lupa’ ay natural at pinananatili ang diin na tumawid ang bayan sa bahaging walang tubig.
- source_word: עָבַר
  choice: tumawid
  rationale: Karaniwang kahulugan ng עבר sa tuwirang layon na Jordan ang pagtawid; malinaw at kasalukuyang Filipino ang ‘tumawid.’
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pamantayang anyo sa Filipino para sa pangalan ng bayan.
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: sa Jordang ito
  rationale: Pinananatili ng ‘Jordang ito’ ang demonstratibong diin ng Hebreo. Nilalagyan ng pang-angkop ang pangalan upang maging natural sa Filipino, nang hindi idinaragdag ang salitang ‘Ilog’ na wala sa anyong ito ng tekstong Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa sa Bibliya. Ginamit ang tuwirang utos na ‘ipaalam ninyo’ at natural na pambungad sa sipi na ‘at sabihin.’
