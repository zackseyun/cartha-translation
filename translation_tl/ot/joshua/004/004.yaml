  text: So Joshua called the twelve men whom he had appointed from the sons of Israel[b][a], one man from each tribe.
translation:
  language: tl
  text: Kaya tinawag ni Josue ang labindalawang lalaking itinalaga niya mula sa mga anak ni Israel[a]—tig-isang lalaki mula sa bawat lipi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa mga Israelita.” Sa Hebreo, “mula sa mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Ang pandiwa ay nagsasaad na ipinatawag ni Josue sa kaniya ang mga lalaking napili na; natural at hindi labis ang lakas ng “tinawag.”
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: ang labindalawang lalaki
  rationale: Tumutukoy ito sa tiyak na pangkat na nauna nang kinatawan mula sa mga lipi.
- source_word: אֲשֶׁר הֵכִין
  choice: itinalaga niya
  rationale: Bagaman maaari ring mangahulugang “inihanda,” sa konteksto ay tumutukoy ito sa pagpili o pagtatalaga sa mga kinatawan.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  rationale: Pinananatili nito ang anyo ng Hebreong pananalita habang malinaw pa rin bilang tawag sa sambayanang Israel.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: tig-isang lalaki mula sa bawat lipi
  rationale: Natural na Filipino ang “tig-isa” para sa distributibong pag-uulit ng Hebreo at malinaw nitong ipinahahayag ang isang kinatawan sa bawat lipi.
