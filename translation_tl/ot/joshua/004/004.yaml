translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “Josue,” ang karaniwang anyong Tagalog ng pangalan, at “lipi” para sa tribal division ng Israel. Isang talababa lamang ang kailangan upang mapanatili ang literal na anyo at idiomatikong alternatibo ng מִבְּנֵי יִשְׂרָאֵל.
