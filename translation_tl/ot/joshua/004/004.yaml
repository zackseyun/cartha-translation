  source_fidelity: 'Tapat ang salin sa Hebreo: si Josue ang tumawag sa tiyak na labindalawang lalaki na dati na niyang itinalaga mula sa mga anak ni Israel, na tig-iisa mula sa bawat lipi. Ang distributibong diwa ng אִישׁ אֶחָד אִישׁ אֶחָד ay mahusay na naipahayag sa “tig-isang lalaki.”'
