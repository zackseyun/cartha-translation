translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “kaban” bilang pamilyar na katawagan sa banal na ark at iniwasang iayon ang “patotoo” sa tradisyonal ngunit naiibang “tipan.”
