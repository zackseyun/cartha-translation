  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: tl
  text: “Utusan mo ang mga paring nagdadala ng kaban ng patotoo na umahon mula sa Jordan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaban ng saksi.” “Patotoo” ang nasa Hebreo rito, hindi ang mas pamilyar na “tipan” na ginagamit sa marami pang pagbanggit sa kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: Utusan mo
  rationale: Tuwirang pautos na 2ms ng צוה; pinananatili ng “Utusan mo” ang lakas ng imperatibo at natural ito sa modernong Tagalog.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang katumbas ng כהנים, na pinananatili ang tiyak na pantukoy.
- source_word: נֹשְׂאֵי
  choice: nagdadala
  rationale: Ang Qal participle plural construct ay naglalarawan sa mga pari; natural itong isinalin bilang sugnay na “mga paring nagdadala.”
- source_word: אֲרוֹן הָעֵדוּת
  choice: kaban ng patotoo
  rationale: Pinananatili ang construct chain at ang tiyak na עֵדוּת, “patotoo,” sa halip na iayon sa mas pamilyar na “kaban ng tipan.”
- source_word: וְיַעֲלוּ
  choice: na umahon
  rationale: Ang עלה ay nangangahulugang umakyat o umahon; sa konteksto ng paglabas mula sa ilog, natural at malinaw ang “umahon.”
- source_word: מִן הַיַּרְדֵּן
  choice: mula sa Jordan
  rationale: Ipinahihiwatig ng מן ang paggalaw mula sa ilog; pinananatili ng “mula sa Jordan” ang anyo at hindi dinaragdagan ng paliwanag na wala sa Hebreo.
