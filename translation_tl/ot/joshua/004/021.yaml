base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/021.yaml
  text: And he said to the sons of Israel[a], “When your children ask their fathers in time to come, saying[c][b], ‘What are these stones?’”
translation:
  language: tl
  text: Sinabi niya sa mga anak ng Israel, “Kapag tanungin ng inyong mga anak[a] ang kanilang mga ama sa panahong darating[b], ‘Ano ang mga batong ito?’[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo “inyong mga anak na lalaki.” Dito, malamang na tumutukoy ang pananalita sa mga anak o inapo sa pangkalahatan.
    reason: lexical_alternative
  - marker: b
    text: Hebreo “bukas,” na ginamit dito bilang idyoma para sa isang panahon o salinlahing darating.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin nang mas nagpapakahulugan: “Ano ang ibig sabihin ng mga batong ito?” Mas literal sa Hebreo ang “Ano ang mga batong ito?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Likas na salin ng pananalaysay na wayyiqtol ng אמר; ipinagpapatuloy nito ang sunod-sunod na kilos nang hindi dinaragdagan ang tiyak na ugnayang temporal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  rationale: Pinananatili ang literal at pampamilyang katawagan ng Hebreo, na may kabuluhang pangtipan, sa halip na gawing mas pangkalahatang “mga Israelita.”
- source_word: אֲשֶׁר יִשְׁאָלוּן
  choice: Kapag ... ay tanungin
  rationale: Sa konteksto, ipinakikilala ng אֲשֶׁר ang isang pangyayari sa hinaharap; natural itong ipinahahayag sa Filipino sa hulmahang “kapag ... ay.”
- source_word: בְּנֵיכֶם
  choice: inyong mga anak
  rationale: Literal na “inyong mga anak na lalaki,” ngunit malamang na tumutukoy rito sa mga anak o inapo sa pangkalahatan; ang “mga anak” ay natural at hindi sobra ang pagpapakahulugan.
- source_word: מָחָר
  choice: sa panahong darating
  rationale: Bagaman literal na “bukas,” gamit ito rito bilang idyoma para sa isang panahon o salinlahing darating.
- source_word: אֶת אֲבוֹתָם
  choice: ang kanilang mga ama
  rationale: Tuwirang pinananatili ang larawan ng mga anak na nagtatanong sa kanilang mga ama; hindi ito pinalalawak bilang “mga ninuno.”
- source_word: לֵאמֹר
  choice: ipinakilala sa pamamagitan ng tuwirang sipi
  rationale: Ang ikalawang לֵאמֹר ay nagpapakilala sa mismong tanong ng mga anak; sapat at natural sa Filipino ang tuwirang sipi.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: Ano ang mga batong ito?
  rationale: Pinananatili ang literal na tanong na nagpapakilala sa mga bato. Ang kahulugang “Ano ang ibig sabihin ng mga batong ito?” ay ipinahihiwatig ng konteksto ngunit hindi tahasang sinasabi.
theological_decisions:
- issue: Pagpapanatili sa di-ganap na pangungusap sa hangganan ng talata
  choice: Iniwan ang sugnay na “Kapag...” upang magpatuloy ang diwa sa kasunod na talata
  alternative: Buuin ang pangungusap sa pamamagitan ng pag-angkat ng sagot mula sa talata 22
  rationale: Ang Hebreong talata 21 ay nagtatapos sa tanong at ang tugon ay nagpapatuloy sa talata 22; hindi dapat magdagdag ng materyal na wala sa ibinigay na talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang katawagang “mga anak ng Israel” at ang “kanilang mga ama” upang manatiling malinaw ang pampamilya at pangtipang larawan ng Hebreo. Inayos ang mga panandang talababa ayon sa mga salitang aktuwal na ipinapaliwanag.
