  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: tl
  text: Humigit-kumulang apatnapung libong kawal na handa para sa digmaan ang tumawid sa harap ni Yahweh upang makipaglaban, patungo sa kapatagan ng Jerico.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאַרְבָּעִים אֶלֶף
  choice: Humigit-kumulang apatnapung libo
  rationale: Ipinahahayag ng prefiks na כְּ ang pagtatantiya; likas at malinaw sa modernong Filipino ang “humigit-kumulang.”
- source_word: חֲלוּצֵי הַצָּבָא
  choice: mga kawal na nasasandatahan
  rationale: Tumutukoy ang parirala sa mga lalaking may sandata at nakahanda para sa gawaing militar. Hindi ginamit ang “taliba” upang hindi magdagdag ng tiyak na posisyong militar na hindi kinakailangan ng konteksto.
- source_word: עָבְרוּ
  choice: tumawid
  rationale: Sa konteksto ng Josue 3–4, malinaw na ang tinutukoy ay ang pagtawid sa Jordan; sapat at natural sa Filipino ang “tumawid.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang karaniwang kahulugan na “sa harap” o “sa presensiya” at ang konkretong larawan ng tekstong Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipanang pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לַמִּלְחָמָה
  choice: upang makipaglaban
  rationale: Ipinakikita ng parirala ang layunin ng pagtawid. Mas natural ito sa pangungusap na Filipino kaysa sa literal na “para sa labanan,” habang pinananatili ang diwang militar.
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: patungo sa kapatagan ng Jerico
  rationale: Ang עַרְבוֹת ay tumutukoy sa mababang kapatagan o steppe sa rehiyon ng Jordan. Ang “kapatagan ng Jerico” ay malinaw at hindi labis na teknikal.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinanatili itong “Yahweh” upang maihiwalay sa titulong “Panginoon” at hindi pumili ng ibang tradisyonal na transliterasyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “Yahweh” bilang pangalang pantangi, at ginamit ang “Jerico,” ang karaniwang anyong Filipino ng pangalan ng lugar.
