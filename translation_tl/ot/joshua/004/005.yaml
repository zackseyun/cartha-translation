base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: tl
  text: At sinabi ni Josue sa kanila, “Tumawid kayo sa harap ng kaban ni Yahweh na inyong Diyos hanggang sa gitna ng Ilog Jordan. Bawat lalaki ay buhatin ang tig-isang bato sa kanyang balikat, ayon sa bilang ng mga lipi ng mga anak ni Israel[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel.” Isa itong pormal na katawagang pangtipan; maaari rin itong ipahayag bilang “mga Israelita” o “bayan ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi labis na tinutukoy ang eksaktong ugnayang temporal.
- source_word: עִבְרוּ
  choice: Tumawid kayo
  rationale: Ang pautos na anyo ng עבר ay tumutukoy sa pagtawid o pagdaan sa konteksto ng Ilog Jordan; natural at malinaw ito sa modernong Tagalog.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Tuwirang inilalarawan ang posisyon ng mga lalaki kaugnay ng kaban.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: kaban ni Yahweh na inyong Diyos
  rationale: Likas na Tagalog na pagpapahayag sa construct chain, habang pinananatili ang tipanang pangalan na Yahweh at ang ikalawang panauhang maramihan.
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: patungo sa gitna ng Jordan
  rationale: Pinananatili ng “gitna” ang kahulugan ng תּוֹךְ bilang loob o kalagitnaan, hindi lamang pagpasok sa ilog.
- source_word: וְהָרִימוּ לָכֶם אִישׁ
  choice: Bawat lalaki ay magbuhat
  rationale: Inihahayag ang distributibong puwersa ng אִישׁ at ang pautos ng Hiphil; ang “lalaki” ay angkop sa labindalawang lalaking kinatawan sa konteksto.
- source_word: אֶבֶן אַחַת
  choice: tig-isang bato
  rationale: Ang “tig-” ay natural na Tagalog para sa isang batong kukunin ng bawat lalaki.
- source_word: עַל שִׁכְמוֹ
  choice: sa kanyang balikat
  rationale: Pinananatili ang isahang panghalip na tumutugma sa distributibong “bawat lalaki.”
- source_word: לְמִסְפַּר
  choice: ayon sa bilang ng
  rationale: Malinaw na ipinapahayag ang pagtutugma ng bilang ng mga bato sa bilang ng mga lipi.
- source_word: שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: mga lipi ng mga anak ni Israel
  rationale: Pinananatili ang dalawang sangkap ng pormal na Hebreong katawagan sa halip na paikliin lamang bilang “mga lipi ng Israel.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kasarian sa אִישׁ
  choice: bawat lalaki
  alternative: bawat isa; bawat tao
  rationale: Mas tiyak sa anyong panlalaki ng pinagmulan at sa agarang konteksto ng mga lalaking kinatawan mula sa bawat lipi.
- issue: Pormal na katawagang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; bayan ng Israel
  rationale: Pinananatili ang pormal at tipanang anyo ng Hebreo nang hindi pinapantay sa mas pangkalahatang katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kaban” bilang maikli at pamilyar na katawagan sa kaban ng tipan, at pinanatili ang “Jordan” ayon sa karaniwang anyo ng pangalang pantangi. Inilipat ang talababa sa mismong pariralang tinatalakay nito.
