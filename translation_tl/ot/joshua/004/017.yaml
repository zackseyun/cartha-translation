base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/017.yaml
  text: So Joshua commanded the priests, saying, “Come up out of the Jordan.”
translation:
  language: tl
  text: Kaya inutusan ni Josue ang mga pari, “Umahon kayo mula sa Jordan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Kaya inutusan
  rationale: Ang צוה ay tumutukoy sa pagbibigay ng may-awtoridad na utos. Ang “inutusan” ay natural sa makabagong Tagalog at pinananatili ang puwersa ng pandiwa; ang “Kaya” ay naghuhudyat ng pagpapatuloy at bunga sa salaysay.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog na Bibliya.
- source_word: אֶת הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tuwirang katumbas ng tiyak at maramihang pangngalang “mga pari.”
- source_word: לֵאמֹר
  choice: hindi isinalin nang hiwalay
  rationale: Sa natural na Tagalog, sapat nang ipakilala ng kuwit at panipi ang tuwirang sinabi; ang pagdaragdag ng “na sinasabi” ay magiging mabigat at di-likas.
- source_word: עֲלוּ
  choice: Umahon kayo
  rationale: Ang עלה ay nangangahulugang umakyat o umahon. Dahil nasa ilog ang mga pari, malinaw at idiomatiko ang “umahon,” at ipinahihiwatig ng “kayo” ang maramihang pautos.
- source_word: מִן הַיַּרְדֵּן
  choice: mula sa Jordan
  rationale: Ipinapahayag ng מן ang paggalaw palayo o palabas. Sa pagsama sa “umahon,” natural at malinaw na ang pinanggalingan ay ang Jordan nang hindi kailangang idagdag ang salitang “Ilog.”
