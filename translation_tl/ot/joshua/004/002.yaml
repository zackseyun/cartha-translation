translation:
  language: tl
  text: Kumuha kayo para sa inyong mga sarili ng labindalawang lalaki mula sa bayan—tig-iisang lalaki mula sa bawat lipi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na inuulit sa Hebreo ang pariralang distributibo: “isang lalaki, isang lalaki mula sa isang lipi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Kumuha kayo
  rationale: Ang Qal imperative plural ng לקח ay tuwirang nangangahulugang “kumuha.” Pinananatili nito ang lakas ng utos nang hindi ipinapalagay na ang tiyak na diwa ay “pumili.”
- source_word: לָכֶם
  choice: para sa inyong sarili
  rationale: Ipinahahayag ng ל na may hulaping pangalawang panauhang maramihan ang benefactive o reflexive na diwa; malinaw itong naihahatid ng “para sa inyong sarili.”
- source_word: מִן הָעָם
  choice: mula sa bayan
  rationale: Ang עָם dito ay tumutukoy sa sambayanan ng Israel. Ang “bayan” ay natural at marangal sa salaysay, at hindi ito nagpapahiwatig ng mas maliit na pangkat.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: labindalawang lalaki
  rationale: Tuwirang tumutukoy ang parirala sa labindalawang lalaking nasa hustong gulang; pinananatili ng salin ang kasariang hayagang nasa Hebreo.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: tig-iisang lalaki
  rationale: Ang pag-uulit ay distributibo. Likas sa modernong Tagalog ang “tig-iisang lalaki,” habang itinatala sa talababa ang literal na anyo.
- source_word: מִשָּׁבֶט
  choice: mula sa bawat lipi
  rationale: Sa konteksto, ang שֵׁבֶט ay isa sa mga lipi ng Israel. Idinaragdag ng “bawat” ang distributibong diwang ipinahahayag ng pag-uulit sa Hebreo.
