  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kayo” upang ipakita ang maramihang kausap, at “tig-iisang” upang natural na ihatid ang distributibong pag-uulit ng Hebreo.
