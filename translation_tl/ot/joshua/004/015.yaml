  text: And Yahweh said to Joshua,[a]
translation:
  language: tl
  text: At sinabi ni Yahweh kay Josue,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “na nagsasabi”; ipinakikilala nito ang tuwirang pananalita sa susunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Ang waw-consecutive kasama ng אָמַר ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “At sinabi” at napapanatili nito ang ugnayan sa naunang pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na anyo sa Tagalog bago ang pangalan ng tao.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: “Josue” ang nakagawiang anyong Tagalog ng pangalang Hebreo na יְהוֹשֻׁעַ.
- source_word: לֵאמֹר
  choice: ','
  rationale: Ipinakikilala ng infinitibong ito ang tuwirang pananalita sa susunod na talata. Sa natural na Tagalog, sapat ang kuwit; ipinaliliwanag sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong, malinaw, at marangal na Tagalog. Ginamit ang “Josue,” ang karaniwang anyong Tagalog ng Joshua, at pinanatili ang “Yahweh” bilang banal na pangalan.
