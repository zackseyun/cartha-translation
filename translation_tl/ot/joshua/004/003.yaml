base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: tl
  text: At utusan ninyo sila sa pagsasabing, ‘Kumuha kayo para sa inyong sarili ng labindalawang bato mula rito, mula sa gitna ng Jordan, mula sa lugar kung saan matatag na nakatayo ang mga paa ng mga pari.[a] Itawid ninyo ang mga ito kasama ninyo at ilapag ninyo ang mga ito sa lugar na tutuluyan[b] ninyo sa gabing ito.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “mula sa kinatatayuan ng mga paa ng mga pari, na matatag na nakapuwesto.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “lugar na tutuluyan” ay ang lugar na pansamantalang titigilan ng Israel nang magdamag matapos tumawid, hindi kinakailangang isang permanenteng pamayanan.
    reason: cultural_note
lexical_decisions:
- source_word: וְצַוּוּ
  choice: At utusan ninyo
  rationale: Pinananatili ng “utusan” ang tuwirang lakas ng Piel imperative ng צוה; maramihan ang anyo dahil kinakausap si Josue kasama ng naunang utos sa konteksto.
- source_word: שְׂאוּ לָכֶם
  choice: Kumuha kayo para sa inyo
  rationale: Ipinahahayag ng “kumuha” ang pagbuhat o pagkuha sa mga bato, habang pinananatili ng “para sa inyo” ang datibong לָכֶם nang hindi kinakailangang magpahiwatig ng pribadong pag-aari.
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: mula rito, mula sa gitna ng Jordan
  rationale: Pinananatili ang dobleng pariralang pang-ukol ng Hebreo upang idiin ang tiyak na lugar na pinagmulan ng mga bato.
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: mula sa lugar na matatag na kinatatayuan ng mga paa ng mga pari
  rationale: Likas sa Tagalog ang ganitong pagsasaad at ipinapakita nito kapwa ang “lugar na kinatatayuan” at ang diin ng הָכִין sa pagiging matatag ng kanilang pagkakatayo.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: labindalawang bato
  rationale: Tuwirang katumbas ng bilang at pangngalan sa Hebreo.
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: Itawid ninyo ang mga ito kasama ninyo
  rationale: Ipinahahayag ng “itawid” ang causative na diwa ng Hiphil ng עבר at pinananatili ang tahasang ideya ng pagsama sa mga bato.
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: at ilapag
  rationale: Ang “ilapag” ay kongkreto at natural para sa paglalagay ng mga batong binuhat.
- source_word: בַּמָּלוֹן
  choice: sa lugar na tutuluyan
  rationale: Sinasalamin nito ang pansamantalang lugar ng pagtigil o pagtulog, nang hindi ito labis na tinutukoy bilang permanenteng pamayanan o kampong militar.
- source_word: אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: ninyo ngayong gabi
  rationale: Kasama ng “lugar na tutuluyan,” natural nitong ipinahahayag ang panghinaharap na magdamagang pananatili sa konteksto.
