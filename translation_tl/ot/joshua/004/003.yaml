translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang pag-uulit na “mula rito, mula sa gitna ng Jordan” dahil mahalaga ito sa pagiging tiyak at masigla ng Hebreo. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang ipinaliliwanag ng mga talababa.
