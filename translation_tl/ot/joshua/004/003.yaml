revisions:
- from: At utusan ninyo sila, sabihin ninyo, ‘Kumuha kayo para sa inyo ng labindalawang bato mula rito, mula sa gitna ng Jordan, mula sa lugar na matatag na kinatatayuan ng mga paa ng mga pari.[a] Itawid ninyo ang mga ito kasama ninyo at ilapag sa lugar na tutuluyan[b] ninyo ngayong gabi.’
  to: At utusan ninyo sila sa pagsasabing, ‘Kumuha kayo para sa inyong sarili ng labindalawang bato mula rito, mula sa gitna ng Jordan, mula sa lugar kung saan matatag na nakatayo ang mga paa ng mga pari.[a] Itawid ninyo ang mga ito kasama ninyo at ilapag ninyo ang mga ito sa lugar na tutuluyan[b] ninyo sa gabing ito.’
  rationale: Inayos ang sintaks upang maging malinaw na ang mga paa ng mga pari ang matatag na nakatayo, hindi ang lugar. Ginawang mas natural ang panandang nagpapakilala sa sinasabing utos at ang katumbas ng datibong “para sa inyong sarili.” Pinanatili ang pagkakasunod at mahahalagang detalye ng Hebreo, pati ang dalawang footnote anchor.
