  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: tl
  text: At sasabihin ninyo sa kanila, “Naputol ang daloy ng tubig ng Jordan sa harap ng kaban ng tipan ni Yahweh. Nang tumawid ito sa Jordan, naputol ang daloy ng tubig ng Jordan.” At ang mga batong ito ay magiging alaala para sa mga anak ni Israel[a] magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga Israelita.” Sa literal, “mga anak na lalaki ni Israel”; isa itong pangkatang katawagan para sa bayang Israel.
    reason: Nililinaw ang panlalaking anyo ng Hebreo at ang pangkatang gamit nito, habang nagbibigay ng likas na alternatibong Tagalog.
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: naputol ang daloy
  rationale: Sa konteksto ng ilog, likas na ipinapahayag nito na nahinto o naputol ang pagdaloy ng tubig, habang pinananatili ang larawan ng Hebreong כרת.
- source_word: מֵימֵי / מֵי הַיַּרְדֵּן
  choice: ang daloy ng tubig ng Jordan
  rationale: Ipinapakita ng “daloy ng tubig” na ang tinutukoy ay ang tubig ng ilog na nahinto, hindi na nawala ang mismong ilog.
- source_word: מִפְּנֵי
  choice: sa harap ng
  rationale: 'Pinananatili nito ang tuwirang diwang panlunan: nangyari ang paghinto ng tubig sa harap o presensiya ng kaban.'
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: kaban ng tipan ni Yahweh
  rationale: Likas at tumpak na pariralang Tagalog na pinananatili ang buong titulong pangtipan at ang personal na pangalan ng Diyos.
- source_word: בְּעָבְרוֹ
  choice: nang tumawid ito
  rationale: Ang panlalaking isahang hulapi ay tumutukoy sa kaban; ang “ito” ay angkop sa Tagalog at hindi ginagawang tao ang kaban.
- source_word: לְזִכָּרוֹן
  choice: magiging alaala
  rationale: Ipinahahayag nito na ang mga bato ay isang nananatiling bagay na nagpapaalaala sa ginawang pagliligtas ni Yahweh.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Pinananatili ang Hebreong anyong “mga anak ni Israel,” na tumutukoy sa bayang nagmula kay Israel; ibinibigay sa talababa ang mas karaniwang katumbas.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Ito ang malinaw at marangal na modernong katumbas ng idyomang tumutukoy sa walang hanggang pag-iral bilang alaala.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya isinasalin ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng לִבְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambahayan ng Israel
  rationale: Pinananatili ng pangunahing teksto ang larawan ng angkan mula kay Israel nang hindi nililimitahan ang tinutukoy sa mga anak na lalaki lamang.
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Iningatan ang pag-uulit ng pahayag tungkol sa tubig ng Jordan at ang panlunang “sa harap ng,” habang ginawang malinaw sa karaniwang mambabasa na ang daloy ng tubig ang naputol.
