id: JOS.4.8
reference: Joshua 4:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: tl
  text: Gayon nga ang ginawa ng mga anak ni Israel[a], ayon sa iniutos ni Josue. Bumuhat sila ng labindalawang bato mula sa gitna ng Ilog Jordan, ayon sa sinabi ni Yahweh kay Josue, ayon sa bilang ng mga lipi ng mga anak ni Israel. Itinawid nila ang mga ito kasama nila patungo sa kanilang tutuluyan[b] at inilapag doon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel”; maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “himpilan” o “kampong tutuluyan”; tumutukoy ang salitang Hebreo sa pansamantalang lugar ng pagtigil, lalo na para sa magdamag.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilyang pahayag ng Hebreo sa halip na paikliin bilang “mga Israelita,” bagaman natural pa rin itong mauunawaan sa Filipino.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Ginawa iyon
  rationale: Natural na katumbas sa Filipino ng pagsunod sa naunang utos.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ipinapahayag ang awtoritatibong tagubilin na taglay ng pandiwang Hebreo.
- source_word: וַיִּשְׂאוּ
  choice: Kumuha sila
  rationale: Sa konteksto, saklaw nito ang pagbuhat at pagdadala sa mga bato; ang kasunod na pangungusap ang tahasang nagsasaad ng pagdadala sa kabila.
- source_word: שְׁתֵּי עֶשְׂרֵה אֲבָנִים
  choice: labindalawang bato
  rationale: Tuwirang salin ng bilang at pangngalan.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: mula sa gitna ng Ilog Jordan
  rationale: Pinananatili ang kongkretong puwersang panlunan ng תּוֹךְ at nililinaw sa natural na Filipino na Jordan ang ilog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: דִּבֶּר ... אֶל יְהוֹשֻׁעַ
  choice: sinabi ni Yahweh kay Josue
  rationale: Natural na salaysay sa Filipino para sa pagsasalita ni Yahweh kay Josue nang hindi dinaragdagan ang nilalaman.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: na katumbas ng bilang ng mga lipi ng mga anak ni Israel
  rationale: Pinananatili ang pagtutugma ng labindalawang bato sa bilang ng mga lipi nang hindi tahasang nagdaragdag ng “tig-isa,” na ipinahihiwatig lamang ng konteksto.
- source_word: וַיַּעֲבִרוּם עִמָּם
  choice: Dinala nila ang mga bato
  rationale: Ipinapahayag sa natural na Filipino ang pagpapatawid o pagdadala nila sa mga bato kasama nila; inuulit ang “mga bato” upang maging malinaw ang tinutukoy.
- source_word: הַמָּלוֹן
  choice: lugar na kanilang tutuluyan
  rationale: Inilalarawan ang pansamantalang hintuan o himpilan para sa magdamag nang hindi awtomatikong ipinapalagay na permanenteng kampo.
- source_word: וַיַּנִּחוּם שָׁם
  choice: inilapag ang mga iyon doon
  rationale: Tumpak at natural para sa paglalagay o pagpapahinga ng mga batong dinala.
theological_decisions:
- issue: Paglalarawan sa bayan bilang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang pampamilyang larawan ng tekstong Hebreo nang hindi ito binibigyan ng dagdag na doktrinal na pakahulugan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pangalan ang ginamit sa salin sa halip na isang pamalit na titulo.
- issue: Ugnayan ng labindalawang bato at mga lipi
  choice: katumbas ng bilang ng mga lipi
  alternative: tig-isang bato para sa bawat lipi
  rationale: Ang alternatibo ay makatuwirang hinuha, ngunit ang pangunahing teksto ay nananatili sa mas eksaktong pahayag ng Hebreo at hindi ginagawang tahasan ang ipinahihiwatig lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue” bilang nakasanayang anyo ng pangalang biblikal sa Filipino, “Ilog Jordan” para sa likas na pagkakakilanlan ng lugar, at maiikling pangungusap upang maging madaling basahin nang hindi binabago ang pagkakasunod-sunod at diin ng Hebreo.
