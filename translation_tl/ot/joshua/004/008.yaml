  to: Gayon nga ang ginawa ng mga anak ni Israel[a], ayon sa iniutos ni Josue. Bumuhat sila ng labindalawang bato mula sa gitna ng Ilog Jordan, ayon sa sinabi ni Yahweh kay Josue, ayon sa bilang ng mga lipi ng mga anak ni Israel. Itinawid nila ang mga ito kasama nila patungo sa kanilang tutuluyan[b] at inilapag doon.
