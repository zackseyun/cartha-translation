id: JOS.4.19
reference: Joshua 4:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָ/עָ֗ם עָלוּ֙ מִן הַ/יַּרְדֵּ֔ן בֶּ/עָשׂ֖וֹר לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן וַֽ/יַּחֲנוּ֙ בַּ/גִּלְגָּ֔ל בִּ/קְצֵ֖ה מִזְרַ֥ח יְרִיחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: tl
  text: Umahon ang bayan mula sa Jordan[a] noong ikasampung araw ng unang buwan, at nagkampo sila sa Gilgal, sa silangang hangganan ng Jerico.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Umakyat ang bayan mula sa Jordan.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa Gilgal, sa silangan ng Jerico.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלוּ
  choice: Umahon
  rationale: Ang עָלָה ay maaaring mangahulugang umakyat o umahon. Sa konteksto ng paglabas mula sa Jordan, natural sa Tagalog ang “umahon” at napananatili nito ang kilos mula sa mababang bahagi ng ilog.
- source_word: מִן הַיַּרְדֵּן
  choice: mula sa Jordan
  rationale: Ipinapahayag ng parirala ang paggalaw mula sa Jordan. Sapat at likas sa konteksto ang pangalang “Jordan” bilang pagtukoy sa ilog.
- source_word: בֶּעָשׂוֹר
  choice: noong ikasampung araw
  rationale: Ang Hebreong pormula ay tumutukoy sa petsa; nilinaw sa Tagalog ang salitang “araw.”
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ng unang buwan
  rationale: Sa kontekstong pangkalendaryo, ang חֹדֶשׁ ay “buwan,” at ang הָרִאשׁוֹן ay “una.”
- source_word: וַיַּחֲנוּ
  choice: nagkampo sila
  rationale: Ang חנה ay nangangahulugang humimpil o magkampo. Ang “nagkampo sila” ay malinaw at karaniwang gamit sa modernong Tagalog.
- source_word: בַּגִּלְגָּל
  choice: sa Gilgal
  rationale: Pinanatili ang pangalang-pook na Gilgal sa transliterasyon at ginamit ang natural na pang-ukol na “sa.”
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  choice: sa silangang hangganan ng Jerico
  rationale: Ang קָצֶה ay maaaring tumukoy sa dulo, gilid, o hangganan, samantalang ang מִזְרַח ay tumutukoy sa silangan. Ang salin ay pormal ngunit natural at pinananatili ang heograpikong kaugnayan sa Jerico.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Ang “bayan” ay kumakatawan sa kolektibong הָעָם, at ang mga pangalang Gilgal, Jordan, at Jerico ay pinanatiling madaling makilala ng karaniwang mambabasa.
