id: JOS.4.23
reference: Joshua 4:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲשֶׁר הוֹבִישׁ֩ יְהוָ֨ה אֱלֹהֵי/כֶ֜ם אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵי/כֶ֖ם עַֽד עָבְרְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשָׂה֩ יְהוָ֨ה אֱלֹהֵי/כֶ֧ם לְ/יַם ס֛וּף אֲשֶׁר הוֹבִ֥ישׁ מִ/פָּנֵ֖י/נוּ עַד עָבְרֵֽ/נוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: tl
  text: Sapagkat pinatuyo ni Yahweh na inyong Diyos ang tubig ng Jordan sa harap ninyo hanggang sa makatawid kayo, gaya ng ginawa ni Yahweh na inyong Diyos sa Dagat ng mga Tambo[a], na pinatuyo niya sa harap namin hanggang sa makatawid kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasaling “Dagat na Pula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: pinatuyo
  rationale: Ang Hiphil ng יבש ay nagpapahayag na pinatuyo o inalis ni Yahweh ang tubig upang makatawid ang bayan; natural at tuwiran sa Tagalog ang “pinatuyo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Kasama ng יְהוָה at nasa isahang diwa, malinaw na tumutukoy ito sa Diyos ng Israel; ang “inyong” ay angkop sa marangal na pangmaramihang pagtukoy sa kausap.
- source_word: מֵי הַיַּרְדֵּן
  choice: ang tubig ng Jordan
  rationale: Pinananatili nito ang kongkretong larawan ng tubig ng ilog habang natural ang pagkakabuo sa Tagalog.
- source_word: מִפְּנֵיכֶם / מִפָּנֵינוּ
  choice: sa harap ninyo / sa harap namin
  rationale: Natural na inililipat ang Hebreong idyoma ng presensiya o harapan at pinananatili ang pagbabago mula sa ikalawang panauhan tungo sa unang panauhan.
- source_word: עַד עָבְרְכֶם / עַד עָבְרֵנוּ
  choice: hanggang sa makatawid kayo / hanggang sa makatawid kami
  rationale: Ipinahahayag ang tagal hanggang sa ganap na pagtawid at pinananatili ang sinadyang pag-uulit ng parirala.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: gaya ng ginawa
  rationale: Malinaw at natural na ipinapakita ang paghahambing ng himala sa Jordan at ng naunang pagtawid sa dagat.
- source_word: יַם סוּף
  choice: Dagat ng mga Tambo
  rationale: Ang סוּף ay tuwirang tumutukoy sa mga tambo; inuuna ng salin ang ebidensiya ng wikang pinagmulan habang inilalagay sa talababa ang tradisyonal na pangalan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay mas tuwirang kumakatawan rito kaysa sa pagpapalit nito ng titulong “ang PANGINOON.”
- issue: Paglilipat sa יַם סוּף
  choice: Dagat ng mga Tambo
  alternative: Dagat na Pula
  rationale: Mas tuwirang ipinahahayag ng pangunahing salin ang kahulugan ng Hebreong סוּף, ngunit kinikilala sa talababa ang nakaugaliang pangalan upang matulungan ang mga mambabasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang magkatulad na ayos ng dalawang pagtawid at ang pagkakaiba ng “ninyo/kayo” at “namin/kami.”
