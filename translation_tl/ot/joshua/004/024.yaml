base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: tl
  text: upang malaman ng lahat ng mga bayan sa daigdig[a] na malakas ang kamay ni Yahweh, at upang matakot kayo[b] kay Yahweh na inyong Diyos sa lahat ng inyong mga araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng mga bayan sa lupain,” kung lokal ang saklaw ng salitang Hebreo sa halip na pandaigdig.
    reason: lexical_alternative
  - marker: b
    text: Ang “matakot” dito ay kinabibilangan ng pagpipitagan at banal na paghanga kay Yahweh, hindi lamang pagkasindak.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: upang malaman
  rationale: Likas na ipinahahayag sa Filipino ang layunin ng unang sugnay, habang pinananatili ang puwersang purposive ng לְמַעַן at infinitive construct.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: lahat ng mga bayan sa buong daigdig
  rationale: Ang עַמִּים ay mga 'bayan' o mga pangkat ng tao, hindi lamang mga estadong politikal; ipinahihiwatig ng 'buong daigdig' ang malawak na saklaw ng הָאָרֶץ, habang itinatala sa talababa ang posibleng lokal na pagbasa.
- source_word: יַד יְהוָה
  choice: kamay ni Yahweh
  rationale: Pinananatili ang malinaw at mahalagang larawang Hebreo sa halip na ipakahulugan lamang bilang 'kapangyarihan.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na kinakatawan ng Tetragrammaton.
- source_word: כִּי חֲזָקָה הִיא
  choice: na malakas
  rationale: Tuwirang katumbas ng חֲזָקָה at natural na panaguri para sa 'kamay' sa Filipino.
- source_word: לְמַעַן יְרָאתֶם
  choice: at upang matakot kayo
  rationale: Pinananatili ang ikalawang layuning sugnay at ang buong saklaw ng ירא, kabilang ang takot, pagpipitagan, at paghanga.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Ang anyong maramihan ay tumutukoy rito sa nag-iisang Diyos, si Yahweh, sa konteksto ng tipan.
- source_word: כָּל הַיָּמִים
  choice: habang kayo'y nabubuhay
  rationale: Natural na idyomang Filipino para sa panghabambuhay na tagal na ipinahahayag ng Hebreong 'lahat ng mga araw.'
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng 'Yahweh' ang pagkakakilanlan nito bilang pangalang tipan.
- issue: Saklaw ng ירא
  choice: matakot
  alternative: magpitagan; mamangha
  rationale: Hindi pinapahina ang tuwirang kahulugan ng pandiwa. Ipinapaliwanag sa talababa na sa kontekstong ito ay kasama rin ang pagpipitagan at banal na paghanga.
- issue: Saklaw ng הָאָרֶץ
  choice: buong daigdig
  alternative: lupain
  rationale: Mas angkop sa konteksto ang pandaigdig na pagpapakilala sa ginawa ni Yahweh, ngunit tunay na maaari ring maging lokal ang kahulugan ng salitang Hebreo kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang biblikal na larawang 'kamay ni Yahweh' at ang teolohikal na tensiyon ng 'matakot.' Ang mga panandang talababa [a] at [b] ay kapuwa lumilitaw sa pangunahing teksto.
