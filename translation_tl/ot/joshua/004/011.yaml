  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: tl
  text: Nang makatawid na ang buong bayan, tumawid ang Kaban ni Yahweh at ang mga pari sa harap ng bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa presensiya ng bayan.” Ang pariralang Hebreo ay maaaring tumukoy sa posisyon sa harap ng bayan o sa pagiging nasa presensiya ng bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Ang pariralang Hebreo ay nagsisilbing likas na panandang temporal at pasulong na salaysay; sapat at natural sa Filipino ang “Nang.”
- source_word: תַּם כָּל הָעָם לַעֲבוֹר
  choice: makatawid na ang buong bayan
  rationale: Ipinahahayag ng תַּם ang ganap na pagkakatapos. Ang “makatawid na” ay natural na Filipino para sa natapos na pagtawid, at pinananatili ng “buong bayan” ang diin ng כָּל.
- source_word: וַיַּעֲבֹר
  choice: tumawid din
  rationale: Pinananatili ng “tumawid” ang pag-uulit ng ugat עבר. Idinagdag ang “din” bilang likas na ugnayang Filipino sa naunang pagtawid ng bayan, nang hindi binabago ang pangyayari.
- source_word: אֲרוֹן יְהוָה
  choice: ang Kaban ni Yahweh
  rationale: Ang construct chain ay tumutukoy sa sagradong kaban na nauugnay kay Yahweh. Ginamit ang “Kaban” bilang maikli at dignified na tawag sa bagay na kilala na sa konteksto.
- source_word: וְהַכֹּהֲנִים
  choice: at ang mga pari
  rationale: Pinananatili ang tahasang pang-ugnay at ang mga pari bilang kasamang simuno ng pandiwang “tumawid.”
- source_word: לִפְנֵי הָעָם
  choice: sa harap ng bayan
  rationale: Likas itong basahin bilang posisyong nasa harapan, ngunit maaari ring ipahiwatig ng Hebreo ang presensiya ng bayan; pinananatili sa talababa ang tunay na ambiguwidad.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Ugnayan ng kaban at mga pari sa pagtawid
  choice: 'Kapwa simuno: “ang Kaban ni Yahweh at ang mga pari”'
  alternative: Ang mga pari bilang kasama lamang ng kaban
  rationale: Pinakamalapit sa gramatika ng וְ ang koordinasyon ng dalawang kalahok, habang hindi nilulutas dito kung paano pisikal na dinala ng mga pari ang kaban.
translation_notes:
  register: Modernong Filipino na malinaw, maikli, at marangal. Ginamit ang “bayan” para sa kolektibong הָעָם at “Kaban” bilang pamilyar na katawagan sa sagradong kaban. Ang marker na [a] ay inilagay mismo pagkatapos ng pariralang may ambiguwidad.
