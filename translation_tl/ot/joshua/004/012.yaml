base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: tl
  text: At ang mga anak ni Ruben[a], ang mga anak ni Gad, at ang kalahating lipi ni Manases ay tumawid na nakasandata[c] sa unahan ng mga anak ni Israel[b], gaya ng sinabi sa kanila ni Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Rubenita, ang mga Gadita, at ang kalahating lipi ni Manases.” Mas literal sa Hebreo ang “ang mga anak ni Ruben … ang mga anak ni Gad …”
    reason: lexical_alternative
  - marker: b
    text: O “mga Israelita.” Mas literal sa Hebreo ang “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo na isinaling “nakasandata” ay maaari ring tumukoy sa pagiging nasangkapan o nakaayos para sa labanan; iminungkahi rin ng ilan ang mas literal na diwang “nakaayos sa mga hanay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: tumawid
  rationale: Sa salaysay na ito, tumutukoy ang עבר sa pagtawid sa Jordan; natural at tiyak sa modernong Tagalog ang “tumawid.”
- source_word: בְּנֵי רְאוּבֵן ... וּבְנֵי גָד
  choice: ang mga anak ni Ruben ... ang mga anak ni Gad
  rationale: Pinananatili nito ang literal na pananalitang pangkamag-anakan sa Hebreo; ang mas idyomatikong “mga Rubenita ... mga Gadita” ay inilagay bilang alternatibo sa talababa.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: ang kalahating lipi ni Manases
  rationale: Malinaw at likas itong katumbas ng Hebreong construct chain at pinananatili ang pagtukoy sa kalahati ng lipi.
- source_word: חֲמֻשִׁים
  choice: nasasandatahan
  rationale: Ipinahihiwatig ng konteksto ang pagiging handa at may sandata para sa labanan; pinananatili sa talababa ang posibleng diwa ng pagkakaayos para sa pakikidigma.
- source_word: לִפְנֵי
  choice: sa unahan ng
  rationale: Ipinapakita nito ang kanilang posisyon sa harap ng iba pang Israelita habang tumatawid.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal na Hebreong ekspresyon; ang “mga Israelita” ay mas idyomatiko at ibinigay sa talababa.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: gaya ng sinabi sa kanila ni Moises
  rationale: Ang כַּאֲשֶׁר ay nagsasaad ng pagsunod sa naunang sinabi ni Moises. Sa Tagalog, sapat nang ipinahihiwatig ng konteksto ang pagkauna ng pagsasalita nang hindi nangangailangan ng tahasang past perfect.
