  source_fidelity: Tumpak ang pangunahing daloy at mga heograpikong ugnayan. Gayunman, ang "mga lahi" ay hindi ang pinakanatural o pinakatiyak na katawagan para sa mga pangkat ni Ruben at Gad sa modernong Tagalog. Ang pandiwang Niphal na נֹאחֲזוּ ay mas maayos na maipapahayag bilang pagtanggap nila sa lupain bilang pag-aari; dapat manatiling malinaw na ang utos ni Yahweh sa pamamagitan ni Moises ay may kaugnayan sa pagkakaloob/pagkakaroon ng lupaing iyon.
  naturalness: Marangal at malinaw ang register, ngunit mas natural ang "mga Rubenita" at "mga Gadita" kaysa "mga lahi ni Ruben at ni Gad." Inilipat ang panandang talababa upang tuwirang tumukoy sa pandiwang leksikal na tinatalakay.
  terminology: Pinanatili ang "lipi" para sa שֵׁבֶט, "lupain" para sa אֶרֶץ, at "Yahweh" para sa יהוה. Ang mga pangalang Ruben, Gad, Manases, Shilo, Canaan, Gilead, at Moises ay pare-pareho at angkop.
