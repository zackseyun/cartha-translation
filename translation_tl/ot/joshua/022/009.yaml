reference: Joshua 22:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ וַ/יֵּלְכ֡וּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/שִּׁלֹ֖ה אֲשֶׁ֣ר בְּ/אֶֽרֶץ כְּנָ֑עַן לָ/לֶ֜כֶת אֶל אֶ֣רֶץ הַ/גִּלְעָ֗ד אֶל אֶ֤רֶץ אֲחֻזָּתָ/ם֙ אֲשֶׁ֣ר נֹֽאחֲזוּ בָ֔/הּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: tl
  text: Kaya, bumalik at umalis mula sa mga Israelita ang mga Rubenita, mga Gadita, at ang kalahati ng lipi ni Manases. Mula sa Shilo, na nasa lupain ng Canaan, nagtungo sila sa lupain ng Gilead, sa lupaing pag-aari nila, na kanilang tinanggap[a] ayon sa utos ni Yahweh sa pamamagitan ni Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na kanilang inangkin bilang pag-aari.” Maaaring idiin ng pandiwang Hebreo ang pagtanggap at paghawak sa lupain o ang pag-angkin dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: bumalik at umalis
  rationale: 'Pinananatili ang dalawang magkasunod na pandiwa sa Hebreo: ang pagbabalik sa sariling teritoryo at ang pag-alis mula sa kapulungan sa Shilo.'
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: mga lahi ni Ruben at ni Gad
  rationale: Sa kontekstong pantribo, ang בְּנֵי ay tumutukoy sa mga inapo o pangkat ni Ruben at Gad; mas likas ito kaysa literal na 'mga anak' sa modernong Tagalog.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: ang kalahati ng lipi ni Manases
  rationale: Tuwirang pinananatili ang pagkakahating pantribo na ipinahihiwatig ng חֲצִי שֵׁבֶט.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga Israelita
  rationale: Malinaw na ipinapahayag ang paghiwalay nila sa mas malaking kapulungan ng Israel nang hindi gumagamit ng di-likas na 'mga anak ng Israel.'
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: Mula sa Shilo, na nasa lupain ng Canaan
  rationale: Pinananatili ang hayag na sugnay na pangheograpiya ng Hebreo.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: sa lupain ng Gilead
  rationale: Pinananatili ang אֶרֶץ upang idiin ang teritoryo, hindi lamang ang pangalan ng rehiyon.
- source_word: אֶל אֶרֶץ אֲחֻזָּתָם
  choice: sa lupaing pag-aari nila
  rationale: Ang אֲחֻזָּה ay isang lupaing hawak o minanang pag-aari; ang salin ay likas ngunit pinananatili ang legal-teritoryal na diwa.
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: na kanilang tinanggap bilang pag-aari
  rationale: Ipinapakita ang resultative o receptive na diwa ng Niphal ng אחז, habang kinikilala sa talababa ang maaaring diin sa aktuwal na pag-angkin o paghawak sa lupain.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang idyomang עַל־פִּי ay nangangahulugang ayon sa salita o utos; ginagamit ang pangalang Yahweh para sa Tetragrammaton.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Likas na ipinapahayag sa Tagalog ang diwa ng ahensiya o pamamagitan ng idyomang 'sa kamay ni Moises.'
theological_decisions:
- issue: Paglalarawan sa pagtanggap o pag-angkin sa lupain
  choice: tinanggap bilang pag-aari
  alternative: inangkin bilang pag-aari / pinamayanang pag-aari
  rationale: Maaaring idiin ng Niphal נֹאחֲזוּ ang pagkakatatag sa lupain o ang pagkamit at paghawak dito. Hindi nilulutas nang lubos ang leksikal na tensiyon; inilalahad ang alternatibo sa talababa.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalang tipan ang tahasang nasa tekstong Hebreo; pinananatili itong pangalang pantangi sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'mga lahi' para sa mga pangkat pantribo at 'lipi' para sa teknikal na שֵׁבֶט. Bahagyang inayos ang mahabang pangungusap upang maging malinaw sa Tagalog habang pinananatili ang pagkakasunod-sunod at mga ugnayang pangheograpiya ng Hebreo.
