revisions:
- from: Kaya bumalik at umalis mula sa mga Israelita ang mga lahi ni Ruben at ni Gad, at ang kalahati ng lipi ni Manases. Mula sa Shilo, na nasa lupain ng Canaan, nagtungo sila sa lupain ng Gilead—sa lupaing pag-aari nila, na kanilang tinanggap bilang pag-aari[a] ayon sa utos ni Yahweh sa pamamagitan ni Moises.
  to: Kaya, bumalik at umalis mula sa mga Israelita ang mga Rubenita, mga Gadita, at ang kalahati ng lipi ni Manases. Mula sa Shilo, na nasa lupain ng Canaan, nagtungo sila sa lupain ng Gilead, sa lupaing pag-aari nila, na kanilang tinanggap[a] ayon sa utos ni Yahweh sa pamamagitan ni Moises.
  rationale: Pinalitan ang hindi gaanong natural na "mga lahi" ng mga pangkatang pangalang "mga Rubenita" at "mga Gadita," nang hindi binabago ang tinutukoy ng Hebreong בני. Pinanatili ang dalawang pandiwa, ang hayag na pagtukoy sa Shilo sa Canaan, ang dobleng pagtukoy sa lupain, at ang pamamagitan ni Moises. Inilapit ang footnote anchor sa pandiwang may leksikal na alternatibo.
