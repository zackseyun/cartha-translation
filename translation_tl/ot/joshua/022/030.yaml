  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע פִּֽינְחָ֣ס הַ/כֹּהֵ֗ן וּ/נְשִׂיאֵ֨י הָ/עֵדָ֜ה וְ/רָאשֵׁ֨י אַלְפֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר אִתּ֔/וֹ אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֧ר דִּבְּר֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד וּ/בְנֵ֣י מְנַשֶּׁ֑ה וַ/יִּיטַ֖ב בְּ/עֵינֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: tl
  text: Nang marinig ni Finehas na pari, ng mga pinuno ng kapulungan, at ng mga pinuno ng mga pangkat ng Israel[a] na kasama niya ang mga salitang sinabi ng mga anak ni Ruben, ng mga anak ni Gad, at ng mga anak ni Manases, naging mabuti iyon sa kanilang paningin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga pinuno ng libu-libo ng Israel.” Malamang na tumutukoy ito sa mga pinuno ng mga angkan o ng mga pangkat na pantribo, hindi kinakailangang sa mga yunit na eksaktong tig-iisang libo.
    reason: lexical_alternative
  - marker: b
    text: O, “Nalugod sila rito,” o “Minabuti nila iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nang marinig
  rationale: Ipinahahayag nito ang kasunod na pangyayaring pasalaysay at hindi idinaragdag ang diwang sadyang pakikinig na hindi hinihingi ng anyo.
- source_word: פִּינְחָס הַכֹּהֵן
  choice: Finehas na pari
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan at ang tuwirang katawagang “pari.”
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: mga pinuno ng kapulungan
  rationale: Ang “mga pinuno” ay malinaw na tumutukoy sa mga kinikilalang lider, at ang “kapulungan” ay angkop sa nagkakatipong sambayanan ng Israel.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: mga pinuno ng mga pangkat ng Israel
  rationale: Bagaman literal na “mga pinuno ng libu-libo ng Israel,” maaaring tumukoy ang אַלְפֵי sa mga yunit na panlipunan, pantribo, o pangmilitar, hindi lamang sa eksaktong bilang. Inilagay sa talababa ang literal na anyo upang mapanatili ang saklaw ng kahulugan.
- source_word: אֲשֶׁר אִתּוֹ
  choice: na kasama niya
  rationale: Pinananatili ang panghalip ng Hebreo; malinaw sa konteksto na si Finehas ang tinutukoy.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: ang mga salitang sinabi
  rationale: Natural sa Tagalog ang “mga salitang sinabi” at malinaw nitong pinananatili ang kaugnayan ng pangngalan at ng pandiwa ng pagsasalita.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: mga anak ni Ruben, mga anak ni Gad, at mga anak ni Manases
  rationale: Pinananatili ang tatlong ulit na pormulang “mga anak ni” upang maipakita ang estruktura at indayog ng Hebreo at ang pagkakakilanlang pantribo.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: naging mabuti iyon sa kanilang paningin
  rationale: Pinananatili ang idyomang Hebreo nang nauunawaan pa rin sa Tagalog; nililinaw sa talababa ang mas idyomatikong katumbas.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang pag-uulit ng “mga anak ni” at ang idyomang “sa kanilang paningin” upang maipakita ang anyo at himig ng Hebreo, habang ipinaliliwanag sa mga talababa ang mga posibleng kahulugang hindi likas na ganap sa Tagalog.
