revisions:
- from: Pagkatapos, si Finehas na anak ng paring si Eleazar, kasama ang mga pinuno, ay bumalik mula sa mga anak ni Ruben at sa mga anak ni Gad, mula sa lupain ng Gilead patungo sa lupain ng Canaan, sa mga anak ni Israel[b], at nagdala sila ng balita sa kanila.[a]
  to: Pagkatapos, si Finehas, na anak ng paring si Eleazar, at ang mga pinuno ay bumalik mula sa mga anak ni Ruben at mula sa mga anak ni Gad, mula sa lupain ng Gilead patungo sa lupain ng Canaan, sa mga anak ni Israel[b], at nagdala ng balita sa kanila.[a]
  rationale: Inulit ang “mula sa” upang katawanin ang magkahiwalay na pariralang “mula sa” sa Hebreo para sa mga anak ni Ruben at mga anak ni Gad. Inayos din ang sintaks ng tambalang simuno at inalis ang hindi kailangang pag-uulit ng panghalip sa huling sugnay. Walang binagong kahulugan o doktrinal na pagpapakahulugan.
