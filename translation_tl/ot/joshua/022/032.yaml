translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit ng “mga anak ni” at “lupain” upang masalamin ang Hebreong teksto, ngunit ginamit ang “kasama ang mga pinuno” upang maging natural at malinaw ang ugnayan ng mga simuno.
