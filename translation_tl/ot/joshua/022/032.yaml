  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: tl
  text: Pagkatapos, si Finehas, na anak ng paring si Eleazar, at ang mga pinuno ay bumalik mula sa mga anak ni Ruben at mula sa mga anak ni Gad, mula sa lupain ng Gilead patungo sa lupain ng Canaan, sa mga anak ni Israel[b], at nagdala ng balita sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “at iniulat nila sa kanila ang bagay na iyon.” Ang salitang Hebreo na דָּבָר ay maaaring mangahulugang “salita,” “bagay,” “balita,” o “ulat,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa mga anak ni Israel”; ibig sabihin, sa mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Ang pandiwang שׁוב sa anyong wayyiqtol ay nagsasaad ng natapos na pagbabalik; malinaw at likas sa makabagong Tagalog ang “bumalik.”
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: si Finehas na anak ng paring si Eleazar
  rationale: Pinananatili ang pangalan, ang kaugnayang ama-anak, at ang tungkulin ni Eleazar; natural sa Tagalog ang ayos na “anak ng paring si Eleazar.”
- source_word: וְהַנְּשִׂיאִים
  choice: kasama ang mga pinuno
  rationale: Sa konteksto, ang נְשִׂיאִים ay mga pinuno ng mga lipi, hindi mga monarka. Nililinaw ng “kasama” na sila rin ang bumalik kasama ni Finehas.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: mula sa mga anak ni Ruben at sa mga anak ni Gad
  rationale: Pinananatili ang inuulit na pariralang “mga anak ni” at ang dalawang pinagmulan, habang nananatiling nauunawaan bilang mga pangkat ng lipi.
- source_word: מֵאֶרֶץ הַגִּלְעָד
  choice: mula sa lupain ng Gilead
  rationale: Tuwirang inilalarawan ng אֶרֶץ ang heograpikong lupain o teritoryo.
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: patungo sa lupain ng Canaan
  rationale: Pinananatili ang “lupain” upang maipakita ang heograpikong paghahambing sa Gilead.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang literal na anyo ng Hebreo, bagaman tumutukoy ito sa sambayanang Israel.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: at nagdala sila ng balita sa kanila
  rationale: Ipinahahayag nito ang idyomatikong diwa ng pagbabalik na may dalang salita, mensahe, o ulat, nang hindi pinipilit ang דָּבָר sa iisang makitid na kahulugan.
