  naturalness: Marangal at madaling unawaan ang rehistro. Mas maayos at likas ang tambalang simuno na “si Finehas ... at ang mga pinuno ay bumalik,” at hindi na kailangan ang hiwalay na “sila” sa huling sugnay.
  terminology: Ang “Finehas,” “Eleazar,” “Gilead,” at “Canaan” ay katanggap-tanggap na anyo ng mga pangalan. Ang “mga pinuno” ay angkop para sa נְשִׂיאִים. Ang “mga anak ni Israel” ay literal na salin at sinusuportahan ng talababa.
