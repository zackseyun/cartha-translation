revisions:
- from: Sapagkat ginawa ni Yahweh na hangganan ang Jordan sa pagitan namin at ninyo, kayong mga anak ni Ruben at mga anak ni Gad. Wala kayong bahagi kay Yahweh. Kaya maaaring patigilin ng inyong mga anak ang aming mga anak sa pagkatakot kay Yahweh.
  to: Sapagkat itinakda ni Yahweh ang Ilog Jordan bilang hangganan sa pagitan namin at ninyo, kayong mga anak ni Ruben at mga anak ni Gad. Wala kayong bahagi kay Yahweh. Kaya maaaring maging dahilan ang inyong mga anak upang tumigil ang aming mga anak sa pagkatakot kay Yahweh.
  rationale: Pinalitan ang mas literal ngunit mabigat na ayos na 'ginawa ... na hangganan' ng natural na 'itinakda ... bilang hangganan.' Inayos ang panghuling causative na sugnay upang malinaw na ang mga anak ng kausap ang posibleng maging sanhi ng pagtigil ng mga anak ng nagsasalita sa pagkatakot kay Yahweh. Walang kinakailangang talababa, sapagkat walang mahalagang alternatibong pagbasa o saling kailangang iangkla sa talata.
