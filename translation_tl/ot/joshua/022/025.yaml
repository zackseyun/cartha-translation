  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: tl
  text: Sapagkat itinakda ni Yahweh ang Ilog Jordan bilang hangganan sa pagitan namin at ninyo, kayong mga anak ni Ruben at mga anak ni Gad. Wala kayong bahagi kay Yahweh. Kaya maaaring maging dahilan ang inyong mga anak upang tumigil ang aming mga anak sa pagkatakot kay Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: ginawa ... na hangganan
  rationale: Sa pagsasama ng נָתַן at גְּבוּל, ang diwa ay pagtatakda o paggawa sa Jordan bilang hangganan; natural at malinaw ito sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶת הַיַּרְדֵּן
  choice: ang Jordan
  rationale: Sapat at natural sa Tagalog ang pangalang Jordan; malinaw sa konteksto na ilog ang tinutukoy.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: mga anak ni Ruben at mga anak ni Gad
  rationale: Pinananatili ang tahasang pantribong katawagang 'mga anak ni' ng Hebreo nang hindi ginagawang mas teknikal.
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: Wala kayong bahagi kay Yahweh
  rationale: Ang חֵלֶק ay 'bahagi' o 'parte.' Ang 'bahagi kay Yahweh' ay sadyang nagpapanatili sa malawak at teolohikal na tensiyon ng parirala nang hindi ito nililimitahan sa mana lamang.
- source_word: וְהִשְׁבִּיתוּ
  choice: maaaring patigilin
  rationale: Ipinahahayag ng Hiphil ang pagpapahinto. Ang 'maaaring' ay angkop sa kinatatakutang posibleng kahihinatnan sa konteksto.
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: sa pagkatakot kay Yahweh
  rationale: Pinananatili ang tradisyonal at tuwirang biblikal na diwa ng ירא bilang pagkatakot na may pagpipitagan, sa halip na pahinain ito bilang paggalang lamang.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya isinasalin ito bilang Yahweh sa halip na palitan ng titulong PANGINOON.
- issue: Kahulugan ng חֵלֶק בַּיהוָה
  choice: bahagi kay Yahweh
  alternative: mana kay Yahweh
  rationale: Hindi tahasang ginagamit ng teksto ang terminong 'mana.' Ang 'bahagi' ay nagpapanatili sa posibleng diwa ng pakikibahagi, kaugnayan, o karapatan sa tipan nang hindi pumipili ng iisang paliwanag.
- issue: Lakas ng kinatatakutang resulta sa וְהִשְׁבִּיתוּ
  choice: maaaring patigilin
  alternative: patitigilin
  rationale: Sa konteksto, binabanggit ang kinatatakutang maaaring gawin ng susunod na salinlahi, hindi isang tiyak na hulang mangyayari.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'kayong mga anak ni Ruben...' bilang tuwirang panawag upang maipakita na ang parirala ay tumutukoy sa 'ninyo.' Walang talababa sapagkat walang alternatibong kailangan upang maunawaan ang talata.
