base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Tinupad ninyo ang lahat ng iniutos sa inyo ni Moises na lingkod ni Yahweh, at nakinig kayo sa aking tinig[a] sa lahat ng iniutos ko sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinunod ninyo ako sa lahat ng iniutos ko sa inyo.” Ang idyomang Hebreo na “makinig sa tinig” ay madalas nangangahulugang tumugon nang may pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: At sinabi niya sa kanila
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “At sinabi niya sa kanila” habang pinananatili ang ugnayan sa naunang pangyayari.
- source_word: שְׁמַרְתֶּם
  choice: Tinupad ninyo
  rationale: Sa konteksto ng mga utos, ang שׁמר ay nangangahulugang ingatan, sundin, o tuparin. Ang “tinupad” ay malinaw at likas sa Tagalog at nagpapahiwatig ng masunuring pagsasagawa.
- source_word: כָּל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: ang lahat ng iniutos sa inyo
  rationale: Pinananatili nito ang kabuuang saklaw ng כָּל אֲשֶׁר at ang awtoritatibong diwa ng צוה.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: ni Moises na lingkod ni Yahweh
  rationale: Ang עֶבֶד ay isang marangal na katawagan kay Moises bilang inatasang naglilingkod sa Diyos; mas angkop dito ang “lingkod” kaysa “alipin.” Isinasalin ang banal na pangalan bilang “Yahweh.”
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: at nakinig kayo sa aking tinig
  rationale: Pinananatili ng salin ang larawang pandinig ng idyomang Hebreo, samantalang ipinahihiwatig ng konteksto ang masunuring pagtugon.
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: sa lahat ng iniutos ko sa inyo
  rationale: Ipinahahayag nito ang komprehensibong saklaw ng mga utos ni Josue at natural ang ayos sa Tagalog.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng עֶבֶד bilang katawagan kay Moises
  choice: lingkod
  alternative: alipin
  rationale: Bagaman maaaring mangahulugan ng “alipin” ang עֶבֶד, dito ay marangal na katawagan ito kay Moises bilang tapat at inatasang lingkod ni Yahweh.
- issue: Saklaw ng idyomang שׁמע בקול
  choice: nakinig sa aking tinig, na may talababa tungkol sa pagsunod
  alternative: sinunod ako
  rationale: Pinananatili ng pangunahing teksto ang tunay na idyomang Hebreo at ang larawang pandinig nito, habang nililinaw sa talababa na madalas itong tumutukoy sa masunuring pagtugon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tinupad” para sa pagsunod sa mga utos at pinanatili ang idyomang “nakinig sa aking tinig,” na ipinaliwanag sa talababa.
