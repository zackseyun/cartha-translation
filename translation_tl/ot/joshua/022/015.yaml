base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: tl
  text: Dumating sila sa mga anak ni Ruben, sa mga anak ni Gad, at sa kalahating lipi ni Manases, sa lupain ng Gilead,[a] at nakipag-usap sila sa kanila at sinabi:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa lupain ng Gilead.” Maaaring unawain ang pang-ukol sa Hebreo bilang nagsasaad ng direksiyon, ngunit maaari rin nitong tukuyin dito ang lugar kung saan sila dumating sa mga lipi sa silangan.
    reason: lexical_alternative
  - marker: b
    text: O “at nakipag-usap sila sa kanila, na nagsasabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dumating sila
  rationale: Ang Qal wayyiqtol ng בוא ay nagsasaad ng pagdating o pagpunta. Ang “dumating” ay likas sa salaysay at malinaw na ipinahihiwatig ang pag-abot nila sa kinaroroonan ng mga lipi sa silangan.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Sa pormulang panlipi, ang בְּנֵי ay tradisyonal na katawagan sa mga kabilang sa angkan o lipi. Pinananatili ng “mga anak ni” ang kongkretong anyo ng Hebreo at nauunawaan sa kontekstong genealogical.
- source_word: חֲצִי שֵׁבֶט
  choice: kalahating lipi
  rationale: Ito ang maikli, natural, at pormal na katumbas ng karaniwang katawagang panlipi sa Josue.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: sa lupain ng Gilead
  rationale: Bagaman karaniwang direksiyonal ang אֶל, dito ang parirala ay maaaring magtakda ng lokasyon o patutunguhan ng pagdating. Ang “sa” ay sadyang nagpapanatili ng parehong posibilidad sa Tagalog.
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: nakipag-usap sila sa kanila
  rationale: Ang דבר na may אֵת ay maaaring mangahulugang pakikipag-usap, hindi lamang pagsasalita patungo sa isang tagapakinig. Ipinakikita ng “nakipag-usap” ang tuwirang pakikitungo nang hindi ipinapalagay ang tugon.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang infinitive formula na nagpapakilala sa tuwirang pananalita sa kasunod na talata, bagaman medyo pormal ang anyo.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang mga katawagang panlipi at ang pormulang nag-uugnay sa tuwirang pananalita ng kasunod na talata. Ginamit ang “sa” upang hindi sapilitang lutasin ang lokatibo/direksiyonal na posibilidad ng אֶל.
