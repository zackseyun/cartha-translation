language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: tl
  text: Nang makarating sila sa pook sa may Jordan, sa lupain ng Canaan[a], nagtayo roon ang mga anak ni Ruben, ang mga anak ni Gad, at ang kalahating lipi ni Manases ng isang altar sa tabi ng Jordan—isang altar na malaki at kapansin-pansin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga distrito” o “mga hangganan” sa may Jordan.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “isang altar na malaki sa paningin,” ibig sabihin, malaki at madaling mapansin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: lupain sa may Jordan
  rationale: Ang גְּלִילוֹת ay tumutukoy sa nakapaligid na pook o distrito. Natural sa modernong Tagalog ang “lupain sa may Jordan” at naiiwasan ang malabong literal na “mga bilog.”
- source_word: וַיָּבֹאוּ אֶל
  choice: Nang makarating sila sa
  rationale: Isinusulong ng anyong pandiwa ang salaysay at, ayon sa konteksto, natural na ipinahahayag ng “Nang makarating sila” ang temporal na ugnayan sa sumunod na pangyayari.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: na nasa lupain ng Canaan
  rationale: Pinananatili nito ang hayagang paglilinaw sa heograpiya sa tekstong Hebreo.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: ang mga anak ni Ruben / ang mga anak ni Gad
  rationale: Pinananatili ang pampamilya at panliping idyoma ng Hebreo habang malinaw pa rin sa karaniwang mambabasa.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: ang kalahating lipi ni Manases
  rationale: Direkta, maikli, at malinaw na katumbas ng pariralang Hebreo.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Ang “altar” ang karaniwan at madaling maunawaang salin para sa gusaling ginagamit sa paghahandog.
- source_word: עַל הַיַּרְדֵּן
  choice: sa tabi ng Jordan
  rationale: Sa heograpikal na kontekstong ito, ang עַל ay natural na nagpapahiwatig ng kalapitan, hindi kinakailangang literal na nasa ibabaw ng ilog.
- source_word: מִזְבֵּחַ גָּדוֹל לְמַרְאֶה
  choice: isang altar na malaki at kapansin-pansin
  rationale: Ipinahahayag nito ang laki at hayag na anyo ng altar. Ang talababa ay nagpapanatili sa mas literal at bahagyang alanganing diwa ng לְמַרְאֶה.
theological_decisions:
- issue: Posibleng pahiwatig na karibal na altar para sa pagsamba
  choice: Inilarawan lamang ang pagtatayo at kapansin-pansing anyo ng altar nang walang paghatol sa layunin nito.
  alternative: “nagtayo ng isang kahanga-hanga o mapanghamong altar”
  rationale: Hindi pa sinasabi ng talata kung para sa paghahandog o bilang karibal ng sentral na santuwaryo ang altar. Kaya hindi dinaragdagan ng salin ang moral o teolohikal na paghatol at pinananatili ang tensiyon ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang tradisyonal at malinaw na “altar,” ang mga pangalang Ruben, Gad, Manases, Jordan, at Canaan, at ang panliping idyomang “mga anak ni.”
