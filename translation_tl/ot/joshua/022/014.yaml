translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tig-isang” upang natural na ihatid ang distributibong pag-uulit sa Hebreo. Pinanatili ang “mga libu-libo” sa teksto at ipinaliwanag ang posibleng teknikal na kahulugan sa talababa upang hindi alisin ang kalabuan ng pinagmulan.
