base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: tl
  text: At kasama niya ang sampung pinuno, tig-isang pinuno para sa bawat angkan ng ama mula sa lahat ng lipi ng Israel. Ang bawat isa sa kanila ay pinuno ng angkan ng kanyang ama sa mga libo[a] ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga libo ng Israel.” Dito, ang “mga libo” ay maaaring tumukoy sa mga pangkat ng angkan o mas malalaking yunit ng pamilya sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: mga pinuno / pinuno
  rationale: Tumutukoy ito sa mga taong may opisyal na katayuan bilang mga pinuno. Ang “pinuno” ay natural at marangal sa makabagong Tagalog, nang hindi nagpapahiwatig ng maharlikang titulong “prinsipe.”
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Tuwirang ipinahahayag ang pagsama kay Finehas, na tinutukoy sa naunang talata.
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: tig-isang pinuno
  rationale: Ang pag-uulit sa Hebreo ay distributibo. Likas na naihahayag ito sa Tagalog sa pamamagitan ng “tig-isa.”
- source_word: לְבֵית אָב
  choice: mula sa bawat angkan ng mga ninuno
  rationale: Ang בֵּית אָב ay isang yunit ng pagkakamag-anak at pamamahala. Mas malinaw sa ordinaryong mambabasa ang “angkan ng mga ninuno” kaysa literal na “bahay ng ama.”
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: sa lahat ng lipi ng Israel
  rationale: Pinananatili ang saklaw ng parirala at ang kinatawang ugnayan ng mga pinuno sa mga lipi.
- source_word: וְאִישׁ
  choice: bawat isa sa kanila
  rationale: Distributibo ang gamit ng אִישׁ dito at tumutukoy sa bawat isa sa sampung lalaking kinatawan.
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: pinuno ng angkan ng kanyang mga ninuno
  rationale: Inihahayag ng “pinuno” ang kahulugan ng רֹאשׁ bilang ulo o namumuno, habang pinananatili ang istrukturang pampamilya ng בֵית אֲבוֹתָם.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: sa mga libu-libo ng Israel
  rationale: Pinananatili sa pangunahing teksto ang pormal na larawan at tunay na leksikal na kalabuan ng אֶלֶף, sa halip na tahimik na piliin ang kahulugang “mga angkan.” Nililinaw sa talababa ang posibleng panlipunan o pampamahalaang gamit.
