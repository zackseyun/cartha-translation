  source_fidelity: Tumpak na naipapahayag ng salin ang wayyiqtol na pambungad na paliwanag (“Kaya sinabi namin”), ang panukalang pangmaramihan na may pagpapahiwatig ng paghimok (“Magtayo tayo ngayon”), ang benepaktibong “para sa atin,” at ang dalawang magkaibang pagtanggi sa gamit ng altar. Ang “handog na sinusunog” para sa עֹלָה at “hain” para sa זֶבַח ay hindi nagpapantay o labis na naglilimita sa dalawang terminong Hebreo.
  naturalness: Natural, malinaw, at angkop ang marangal na modernong Filipino. Maayos ang daloy ng “Magtayo tayo ngayon ng altar para sa atin,” at ang em dash ay mabisang naghihiwalay sa paglilinaw ng hindi nilalayong gamit ng altar.
  terminology: Ang “altar,” “handog na sinusunog,” at “hain” ay pare-pareho, madaling maunawaan, at angkop sa rehistrong panritwal. Hindi ipinapasok ng salin ang anumang doktrinal na pagpapakahulugan.
