  text: וַ/נֹּ֕אמֶר נַעֲשֶׂה נָּ֣א לָ֔/נוּ לִ/בְנ֖וֹת אֶת הַ/מִּזְבֵּ֑חַ לֹ֥א לְ/עוֹלָ֖ה וְ/לֹ֥א לְ/זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/026.yaml
  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: tl
  text: Kaya[a] sinabi namin, “Magtayo tayo ngayon ng altar para sa atin[b]—hindi para sa handog na sinusunog at hindi para sa hain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At sinabi namin” o “Pagkatapos ay sinabi namin.” Maaaring isalin sa iba’t ibang natural na paraan ang pang-ugnay sa Hebreo ayon sa pagkakaugnay nito sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Gumawa tayo ngayon para sa atin, upang itayo ang altar”—isang idyomang ang diwa ay “Magtayo tayo ngayon ng altar para sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Kaya sinabi namin
  rationale: Ang wayyiqtol na unang panauhang maramihan ng אמר ay nagpapatuloy sa paliwanag ng pangkat. Ipinahihiwatig ng “Kaya” ang lohikal na kaugnayan sa naunang talata, habang nananatiling posible ang mas payak na “At” o ang sunurang “Pagkatapos.”
- source_word: נַעֲשֶׂה נָּא לָנוּ לִבְנוֹת
  choice: Magtayo tayo ngayon ng altar para sa atin
  rationale: Ang cohortative na נַעֲשֶׂה, kasama ng infinitive na לִבְנוֹת, ay nagpapahayag ng sama-samang pasiya o mungkahi. Natural itong isinasalin sa Filipino bilang “Magtayo tayo”; ang נָא ay ipinahayag na “ngayon,” at ang לָנוּ bilang “para sa atin.”
- source_word: אֶת הַמִּזְבֵּחַ
  choice: ang altar
  rationale: May tiyak na pantukoy ang Hebreo at tumutukoy sa partikular na altar na pinag-uusapan. Ang “altar” ay malinaw at karaniwang katawagan sa makabagong Filipino.
- source_word: לֹא לְעוֹלָה
  choice: hindi para sa handog na sinusunog
  rationale: Ang עוֹלָה ay handog na buong sinusunog; pinananatili ng parirala ang layuning itanggi ang ganitong gamit ng altar.
- source_word: וְלֹא לְזָבַח
  choice: at hindi para sa hain
  rationale: Ang זֶבַח ay pangkalahatang katawagan sa haing kinakatay at naiiba rito sa עוֹלָה. Ang “hain” ay maikli, malinaw, at hindi labis na nagtatakda ng uri nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” “handog na sinusunog,” at “hain” bilang madaling maunawaang mga katawagang panritwal, habang pinananatili ang pag-uulit na “hindi ... at hindi” ng Hebreo.
