  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Bumalik kayo sa inyong mga tolda na may napakalaking yaman, napakaraming alagang hayop, pilak, ginto, tanso[a], bakal, at napakaraming kasuotan. Ibahagi ninyo sa inyong mga kapatid[b] ang samsam mula sa inyong mga kaaway.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bronse.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” dito ay tumutukoy sa kanilang mga kapwa Israelita mula sa ibang mga lipi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: Sinabi niya sa kanila
  rationale: Likas sa modernong Tagalog at ganap na naihahatid ang pormulang Hebreo; hindi na inuulit ang literal na ‘na sinasabi,’ na magiging kalabisan.
- source_word: בִּנְכָסִים רַבִּים
  choice: na may dalang saganang kayamanan
  rationale: Ang נְכָסִים ay malawak na tumutukoy sa ari-arian o yaman. Ipinahihiwatig ng ‘may dalang’ na taglay nila ito sa kanilang pagbabalik.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: Bumalik kayo sa inyong mga tolda
  rationale: Pinananatili ang kongkretong ‘mga tolda’ at ang makasaysayang tagpuan, sa halip na gawing interpretatibong ‘mga tahanan.’
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: napakaraming alagang hayop
  rationale: Ang מִקְנֶה ay kolektibong tawag sa mga hayop na pag-aari, hindi lamang baka; malinaw na naihahatid ng ‘napakarami’ ang matinding diin ng מְאֹד.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: pilak, ginto
  rationale: Tuwirang katumbas ng dalawang materyal at natural sa isang talaan sa Tagalog.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: tanso, bakal
  rationale: Karaniwang katumbas sa Tagalog; dahil maaaring tumukoy ang נְחֹשֶׁת sa tanso o bronse, inilagay ang alternatibo sa talababa.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: at napakaraming kasuotan
  rationale: Malawak at marangal na salin ang ‘kasuotan’ para sa mga damit o balabal, at pinananatili ng ‘napakarami’ ang diin.
- source_word: חִלְקוּ שְׁלַל אֹיְבֵיכֶם
  choice: Hatiin ninyo ... ang nasamsam ninyo sa inyong mga kaaway
  rationale: Pinananatili ang pautos na maramihan at ang militar na diwa ng שָׁלָל bilang mga bagay na nasamsam sa kaaway.
- source_word: עִם אֲחֵיכֶם
  choice: sa inyong mga kapatid
  rationale: Pinananatili ang salitang pagkakamag-anak, samantalang nililinaw sa talababa na tumutukoy ito sa mga kapwa Israelita.
theological_decisions:
- issue: Ang panlalaking katawagang pagkakamag-anak na אֲחֵיכֶם
  choice: sa inyong mga kapatid
  alternative: sa inyong mga kapwa Israelita
  rationale: Pinananatili ng pangunahing teksto ang konkretong katawagang ‘mga kapatid’ nang hindi dinaragdagan ng ‘mga kapatid na babae’; ipinapaliwanag sa talababa ang kontekstuwal na saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang tutuldok upang natural na ipakilala ang mga tiyak na anyo ng kayamanang binanggit, nang hindi binabago ang ugnayan ng mga parirala sa Hebreo.
