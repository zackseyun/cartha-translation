revisions:
- from: 'Sinabi niya sa kanila, “Bumalik kayo sa inyong mga tolda na may dalang saganang kayamanan: napakaraming alagang hayop, pilak, ginto, tanso[a], bakal, at napakaraming kasuotan. Hatiin ninyo sa inyong mga kapatid[b] ang nasamsam ninyo sa inyong mga kaaway.”'
  to: Sinabi niya sa kanila, “Bumalik kayo sa inyong mga tolda na may napakalaking yaman, napakaraming alagang hayop, pilak, ginto, tanso[a], bakal, at napakaraming kasuotan. Ibahagi ninyo sa inyong mga kapatid[b] ang samsam mula sa inyong mga kaaway.”
  rationale: Inalis ang bahagyang dagdag na “may dalang,” at pinalitan ang pariralang maaaring magpahiwatig ng isang mas tiyak na kilos ng pagsamsam. Ginawang “Ibahagi ninyo sa inyong mga kapatid” upang natural na maipahayag ang pautos na חִלְקוּ at ang עִם, habang pinananatili ang diwa ng samsam na nauugnay sa kanilang mga kaaway. Ang pagbabagong “mula sa inyong mga kaaway” ay natural na Tagalog para sa kontekstuwal na genitive at hindi nagpapataw ng karagdagang doktrinal na pagbasa.
