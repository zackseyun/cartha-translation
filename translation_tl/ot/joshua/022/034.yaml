base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: tl
  text: At tinawag ng mga anak ni Ruben at ng mga anak ni Gad ang altar na “Saksi,”[a] sapagkat saksi ito sa pagitan natin na si Yahweh ang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas malawak na pagkaunawa: “Pinangalanan nila ang altar na ‘Isang Saksi sa Pagitan Natin na si Yahweh ang Diyos,’” kung ituturing na bahagi ng pangalan ang kasunod na paliwanag sa halip na dahilan lamang ng pangalan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: tinawag … na
  rationale: Sa kayariang ito, ang קרא na may ל ay tumutukoy sa pagtawag o pagbibigay ng pangalan. Likas sa Tagalog ang “tinawag ang altar na.”
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: mga anak ni Ruben at mga anak ni Gad
  rationale: Pinananatili nito ang tahasang anyo ng Hebreo at ang ugnayan ng mga lipi sa kanilang mga ninuno.
- source_word: לַמִּזְבֵּחַ
  choice: ang altar
  rationale: Karaniwan at malinaw na salin ng מִזְבֵּחַ; ito ang bagay na pinangalanan.
- source_word: עֵד
  choice: Saksi
  rationale: Direktang katumbas ng pangngalang nangangahulugang saksi o patotoo. Ang malaking titik at panipi ay nagpapakitang ginagamit ito bilang pangalan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ang unang כִּי ay natural na nagpapakilala sa paliwanag o dahilan ng pangalan.
- source_word: הוּא
  choice: ito
  rationale: Tumutukoy ang panghalip sa altar; “ito” ang likas na panghalip sa Tagalog.
- source_word: בֵּינֹתֵינוּ
  choice: sa pagitan natin
  rationale: Pinananatili ang ugnayan sa pagitan ng mga pangkat na kinakatawan ng mga lipi.
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: na si Yahweh ang Diyos
  rationale: Ang ikalawang כִּי ay nagpapakilala sa nilalaman ng pinatototohanan ng altar. Ang hulma na “si Yahweh ang Diyos” ay natural at may malinaw na puwersang pagpapahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kung dapat bang tahasang magbigay ng pangalan sa altar lampas sa eksaktong ayos ng tekstong Hebreo
  choice: “Saksi” lamang ang inilagay na pangalan sa pangunahing teksto, at ang kasunod na sugnay ay itinuring na paliwanag.
  alternative: 'Maaaring unawain ang buong pahayag bilang pangalan: “Isang Saksi sa Pagitan Natin na si Yahweh ang Diyos.”'
  rationale: Walang hiwalay at malinaw na mas mahabang pormal na pangalan sa ibinigay na tekstong Masoretiko. Pinananatili ng pangunahing salin ang “Saksi” bilang maikling pangalan, habang inilalahad sa talababa ang posibilidad na bahagi ng pangalan ang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “mga anak ni” bilang pormal na katumbas ng Hebreo sa halip na gawing mga pangalang panlipi. Ginamit ang “altar,” isang malawak nang nauunawaang salitang panrelihiyon sa Filipino.
