reference: Joshua 22:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: tl
  text: Sinabi ni Finehas, na anak ng paring si Eleazar, sa mga anak ni Ruben, sa mga anak ni Gad, at sa mga anak ni Manases, “Ngayon ay alam naming nasa gitna natin si Yahweh[a], sapagkat hindi kayo nagtaksil kay Yahweh sa bagay na ito.[b] Sa gayon, iniligtas ninyo ang mga anak ni Israel mula sa kamay ni Yahweh.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama natin si Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “hindi kayo nagtaksil kay Yahweh sa pagtataksil na ito.” Ang magkaugnay na mga salita ay tumutukoy sa pagtataksil o paglabag sa katapatan sa tipan.
    reason: lexical_alternative
  - marker: c
    text: Ang “mula sa kamay ni Yahweh” ay idyomang Hebreo na nangangahulugang naligtas mula sa kapangyarihan o hatol ni Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na panimulang pandiwa sa salaysay sa Filipino; hindi ipinipilit kung temporal na “pagkatapos” o simpleng pagpapatuloy ang waw-consecutive.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Finehas, na anak ng paring si Eleazar
  rationale: Malinaw na iniuugnay ang titulong “pari” kay Eleazar, alinsunod sa ayos at konteksto ng Hebreo.
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד וְאֶל בְּנֵי מְנַשֶּׁה
  choice: sa mga anak ni Ruben, sa mga anak ni Gad, at sa mga anak ni Manases
  rationale: Pinananatili ang paulit-ulit na estruktura at ang literal na katawagang pantribo na “mga anak ni,” habang nananatiling natural sa Filipino.
- source_word: הַיּוֹם יָדַעְנוּ
  choice: Ngayon ay alam namin
  rationale: Ipinahahayag ang kasalukuyang katiyakang natamo dahil sa paliwanag ng mga lipi; mas natural ito kaysa sa literal na aspektong perpekto.
- source_word: בְתוֹכֵנוּ
  choice: nasa gitna natin
  rationale: Malinaw at marangal na paglalarawan ng presensiya ni Yahweh sa sambayanan; maaari ring unawain bilang “kasama natin.”
- source_word: מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: hindi kayo nagtaksil kay Yahweh sa bagay na ito
  rationale: Ang מעל ay tumutukoy sa pagtataksil o paglabag sa katapatan sa tipan. Isinasalin ang magkaugnay na pandiwa at pangngalan nang hindi inuulit nang pilit sa Filipino.
- source_word: אָז
  choice: Sa gayon
  rationale: Ipinakikita ang bunga o konklusyon ng naunang pahayag, habang hindi ginagawang mas tiyak kaysa sa Hebreo ang eksaktong lohikal na ugnayan.
- source_word: הִצַּלְתֶּם
  choice: iniligtas ninyo
  rationale: Karaniwang katumbas sa Filipino ng Hiphil ng נצל, na nangangahulugang magligtas o sumagip mula sa panganib.
- source_word: מִיַּד יְהוָה
  choice: mula sa kamay ni Yahweh
  rationale: Pinananatili ang matingkad na idyomang Hebreo tungkol sa kapangyarihan o hatol ni Yahweh, at nililinaw sa talababa.
theological_decisions:
- issue: Ang presensiya ni Yahweh sa sambayanan
  choice: nasa gitna natin si Yahweh
  alternative: kasama natin si Yahweh
  rationale: Pinananatili ang pahayag tungkol sa aktuwal na presensiya ni Yahweh sa Israel nang hindi nagdaragdag ng mas huling sistematikong pagpapakahulugan.
- issue: Ang diwa ng מעל
  choice: nagtaksil kay Yahweh
  alternative: gumawa ng paglabag laban kay Yahweh
  rationale: Mas malinaw na naipahahayag ng “nagtaksil” ang paglabag sa katapatan sa tipan kaysa sa isang pangkalahatan o teknikal lamang na pagkakasala.
- issue: Ang kahulugan ng “mula sa kamay ni Yahweh”
  choice: pinanatili ang literal na idyoma
  alternative: mula sa hatol ni Yahweh
  rationale: Ipinahihiwatig ng konteksto ang panganib ng kaparusahan ng Diyos, ngunit hindi tahasang ginagamit ng teksto ang salitang “hatol”; kaya pinananatili ang talinghaga at ipinapaliwanag sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang mga pangalang pantribo bilang “mga anak ni,” ang pangalang Yahweh, at ang idyomang “kamay ni Yahweh,” ngunit iniwasan ang lipas o labis na teknikal na pananalita.
