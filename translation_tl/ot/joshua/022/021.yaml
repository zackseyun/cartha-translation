  text: וַֽ/יַּעֲנוּ֙ בְּנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֔ד וַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה וַֽ/יְדַבְּר֔וּ אֶת רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: tl
  text: Sumagot ang mga anak ni Ruben, ang mga anak ni Gad, at ang kalahating lipi ni Manases, at nagsalita sila sa mga pinuno ng mga angkan ng Israel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga pinuno ng mga libo ng Israel,” na malamang ay tumutukoy sa mga pinuno ng mga angkan o mga pangkat ng lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Sumagot
  rationale: Ang qal na ענה sa salaysay ay karaniwang nagpapakilala ng tugon sa naunang sinabi o paratang; natural at tumpak ang “sumagot” sa Filipino.
- source_word: בְּנֵי רְאוּבֵן
  choice: ang mga anak ni Ruben
  rationale: Pinananatili nito ang literal at pangangkanang anyo ng Hebreo, sa halip na gawing “mga Rubenita.”
- source_word: וּבְנֵי גָד
  choice: ang mga anak ni Gad
  rationale: Pinananatili ang kaparehong pangangkanang pahayag at ang paralelismo sa “mga anak ni Ruben.”
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: at ang kalahating lipi ni Manases
  rationale: Ito ang natural na salin ng pariralang construct at malinaw na tumutukoy sa kalahati ng lipi ni Manases.
- source_word: וַיְדַבְּרוּ
  choice: at sinabi nila
  rationale: Bagaman literal na “at nagsalita sila,” mas natural sa modernong Filipino ang “at sinabi nila” bilang pambungad sa tuwirang pananalita, habang hindi inaalis ang hiwalay na pandiwang “sumagot.”
- source_word: אֶת רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: sa mga pinuno ng mga angkan ng Israel
  rationale: Ang רָאשֵׁי ay “mga pinuno,” at ang אַלְפֵי, bagaman literal na “mga libo,” ay malamang na tumutukoy rito sa mga pangkat na panlipunan o pangangkanan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinanatili ang pangangkanang katawagang “mga anak ni” at ang dalawang pandiwa ng Hebreo, ngunit ginawang natural ang ikalawang pandiwa bilang “sinabi nila.”
