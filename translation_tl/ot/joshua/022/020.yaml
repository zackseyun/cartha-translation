  to: Hindi ba si Acan na anak ni Zera ang nagtaksil hinggil sa bagay na itinalagang wasakin, at dumating ang poot sa buong kapulungan ng Israel? Ngunit hindi siya lamang ang namatay dahil sa kanyang kasamaan.
