  naturalness: Maayos at marangal ang rehistro, ngunit bahagyang mas natural ang “hinggil sa” kaysa “tungkol sa” pagkatapos ng “nagtaksil,” at ang “Ngunit hindi siya lamang” ay mas malinaw na Filipino para sa pangwakas na pagdidiin.
  terminology: Pinananatili ang Acan at Zera. Ang “bagay na itinalagang wasakin” ay malinaw, likas, at sapat na naghahatid ng ḥerem bilang bagay na itinalaga sa pagwasak, nang hindi nagdaragdag ng paliwanag tungkol sa Diyos o sa ritwal na katayuan nito.
