  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: tl
  text: Hindi ba si Acan na anak ni Zera ang nagtaksil hinggil sa bagay na itinalagang wasakin, at dumating ang poot sa buong kapulungan ng Israel? Ngunit hindi siya lamang ang namatay dahil sa kanyang kasamaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: nagtaksil
  rationale: Ang pandiwang מעל ay tumutukoy sa malubhang pagtataksil o paglabag sa pananagutang banal; natural at mariing naipapahayag ito ng “nagtaksil.”
- source_word: בַּחֵרֶם
  choice: tungkol sa bagay na itinalagang lipulin
  rationale: Ang חֵרֶם dito ay bagay na ibinukod sa Diyos at, sa konteksto ng Jerico, itinakdang lipulin; pinananatili ng parirala ang sakral at mapangwasak na dimensiyon nito.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: kapulungan ng Israel
  rationale: Ang “kapulungan” ay malinaw at marangal na katumbas ng kolektibong pamayanan o assembly ng Israel.
- source_word: קָצֶף
  choice: poot
  rationale: Tumutukoy ito sa matinding galit o poot, na sa konteksto ay hatol ng Diyos, nang hindi kinakailangang idagdag ang paksa na hindi tahasang binanggit sa sugnay.
- source_word: בַּעֲוֹנוֹ
  choice: dahil sa kanyang kasamaan
  rationale: Ang עָוֹן ay maaaring tumukoy sa kasamaan, pagkakasala, o pananagutang dulot nito; ang “dahil sa kanyang kasamaan” ay natural at pinananatili ang ugnayang sanhi.
theological_decisions:
- issue: Kung tahasang kikilalanin na poot ng Diyos ang קָצֶף
  choice: “dumating ang poot” nang walang idinagdag na “ng Diyos”
  alternative: “dumating ang poot ng Diyos”
  rationale: Malinaw sa mas malawak na salaysay na banal na poot ang tinutukoy, ngunit walang tahasang “ng Diyos” sa Hebreo; hindi ito idinagdag upang manatiling malapit sa teksto.
- issue: Saklaw ng kamatayang dulot ng kasalanan ni Acan
  choice: “hindi lamang siya ang namatay”
  alternative: “hindi siya namatay na nag-iisa”
  rationale: Ipinahihiwatig ng Hebreo na may iba pang napahamak dahil sa kanyang kasamaan. Ang piniling anyo ay natural sa Filipino at hindi tinutukoy nang higit sa sinasabi ng talata kung sino ang iba.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang tradisyonal at karaniwang baybay na “Acan” at “Zera,” at iniwasan ang sobrang teknikal na pananalita.
