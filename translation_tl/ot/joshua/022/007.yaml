  text: וְ/לַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה נָתַ֣ן מֹשֶׁה֮ בַּ/בָּשָׁן֒ וּ/לְ/חֶצְי֗/וֹ נָתַ֤ן יְהוֹשֻׁ֨עַ֙ עִם אֲחֵי/הֶ֔ם מ/עבר הַ/יַּרְדֵּ֖ן יָ֑מָּ/ה וְ֠/גַם כִּ֣י שִׁלְּחָ֧/ם יְהוֹשֻׁ֛עַ אֶל אָהֳלֵי/הֶ֖ם וַ/יְבָרֲכֵֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: tl
  text: Sa isang kalahati ng lipi ni Manases ay naibigay na ni Moises ang lupain sa Basan, ngunit sa isa pang kalahati ay ibinigay ni Josue ang lupain kasama ng kanilang mga kapatid[a] sa kabilang panig ng Jordan, sa kanluran. Nang pauwiin sila ni Josue sa kanilang mga tolda, binasbasan niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanilang mga kapatid.” Tumutukoy ito sa mga kapwa Israelita nila mula sa iba pang mga lipi.
    reason: Nililinaw ang saklaw ng katawagang pangkamag-anak nang hindi inaalis ang literal na anyo sa pangunahing teksto.
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: sa isang kalahati ng lipi ni Manases
  rationale: Nililinaw ng “isang kalahati” ang paghahambing sa kasunod na “isa pang kalahati,” habang pinananatili ang pagkakahati ng lipi.
- source_word: נָתַן מֹשֶׁה
  choice: nagbigay si Moises ng lupain
  rationale: Ang bagay na “lupain” ay nauunawaan mula sa konteksto ng paghahati ng lupain at ginagawang malinaw ang pangungusap sa Tagalog.
- source_word: בַּבָּשָׁן
  choice: sa Basan
  rationale: Karaniwang anyong Tagalog ng pangalan ng rehiyon.
- source_word: וּלְחֶצְיוֹ
  choice: ngunit sa isa pang kalahati
  rationale: Ang hulaping panghalip ay tumutukoy pabalik sa lipi ni Manases; natural na ipinahahayag sa Tagalog ang pagkokontrast bilang “isa pang kalahati.”
- source_word: נָתַן יְהוֹשֻׁעַ
  choice: nagbigay si Josue ng lupain
  rationale: Inuulit ang ipinahihiwatig na bagay na “lupain” upang maging malinaw at maayos ang daloy sa Tagalog.
- source_word: עִם אֲחֵיהֶם
  choice: kasama ng kanilang mga kapatid
  rationale: Pinananatili ang kongkretong katawagang pangkamag-anak ng Hebreo; tumutukoy ito sa mga kapwa Israelita nila.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: sa kabilang panig ng Jordan, sa kanluran
  rationale: Pinananatili kapwa ang ideya ng pagtawid o kabilang panig at ang tahasang direksiyong pakanluran.
- source_word: וְגַם כִּי
  choice: Nang
  rationale: Likas na ipinahahayag sa Tagalog ang temporal na ugnayan nang hindi dinaragdagan ng mabigat na panandang pandiskurso.
- source_word: שִׁלְּחָם
  choice: pauwiin sila
  rationale: Ipinahahayag ang diwa ng pagpapayaon sa kanila patungo sa kanilang tinitirhan; ang destinasyon ay tahasang sumusunod bilang “mga tolda.”
- source_word: אֶל אָהֳלֵיהֶם
  choice: sa kanilang mga tolda
  rationale: Pinananatili ang literal at makasaysayang kongkretong larawan ng mga tolda.
- source_word: וַיְבָרֲכֵם
  choice: binasbasan niya sila
  rationale: Karaniwan at marangal na salin ng pagkilos na pagbibigay ng basbas sa kontekstong ito.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang “mga kapatid” at “mga tolda” bilang kongkretong pananalita ng Hebreo, at nilinaw sa talababa ang tinutukoy ng “mga kapatid.”
