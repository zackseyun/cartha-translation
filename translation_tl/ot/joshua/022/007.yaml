    issue: Hindi naipahahayag ng “ay nagbigay si Moises” ang pagkilos na nauna sa pagkakaloob ni Josue.
    rationale: Ang qatal na נָתַן sa kontekstong ito ay tumutukoy sa naunang pagbibigay ni Moises. Ang “naibigay na ni Moises” ay ligtas at natural na paraan upang maipakita ito sa Tagalog.
