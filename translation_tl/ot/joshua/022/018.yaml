  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: tl
  text: At tumatalikod kayo ngayon sa pagsunod kay Yahweh.[a] Kung maghihimagsik kayo ngayon laban kay Yahweh, bukas ay magagalit siya[b] sa buong kapulungan ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin nang mas literal, “bumabalik kayo ngayon mula sa pagsunod kay Yahweh.” Ang pandiwang Hebreo ay maaaring mangahulugang “bumalik” o “tumalikod”; sa kontekstong ito, tumutukoy ito sa di-tapat na pagtalikod at pagtigil sa pagsunod.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “magagalit siya”; ipinahihiwatig ng konteksto na si Yahweh ang tinutukoy.
    reason: implicit_subject
lexical_decisions:
- source_word: תָּשֻׁבוּ מֵאַחֲרֵי
  choice: tatalikod ... sa pagsunod
  rationale: Ang שׁוב na may מֵאַחֲרֵי ay tumutukoy rito sa pagtalikod at pagtigil sa pagsunod, hindi sa karaniwang pagbabalik. Ang tanong na retorikal ay natural sa Filipino at umaangkop sa pahayag na may interrogative force sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalan, ayon sa patakaran ng proyekto.
- source_word: תִּמְרְדוּ בַּיהוָה
  choice: maghihimagsik ... laban kay Yahweh
  rationale: Ang מרד na may בְּ ay hayagang paghihimagsik laban sa lehitimong awtoridad; pinananatili ng salin ang bigat ng tipanang pagsuway.
- source_word: וּמָחָר
  choice: bukas
  rationale: Pinananatili ang agarang temporal na babala ng Hebreo.
- source_word: יִקְצֹף
  choice: magagalit siya
  rationale: Likas at malinaw na katumbas ng קצף; hindi tahasang binabanggit ng Hebreo ang simuno.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: buong kapulungan ng Israel
  rationale: Ang 'kapulungan' ay nagpapanatili sa kolektibo at tipanang diwa ng עֵדָה nang hindi nagiging teknikal o makaluma.
theological_decisions:
- issue: Di-tahasang simuno ng יִקְצֹף
  choice: Pinanatili sa pangunahing teksto bilang “siya,” na tumutukoy kay Yahweh ayon sa konteksto.
  alternative: 'Tahasan: “magagalit si Yahweh”; o impersonal: “darating ang galit.”'
  rationale: Walang nakasaad na simuno sa pandiwang Hebreo, ngunit si Yahweh ang malinaw na tinutukoy sa agarang konteksto. Pinananatili ng panghalip ang anyo at bahagyang implicitness ng pinagmulan.
- issue: Ugnayan ng וְהָיָה sa kasunod na babala
  choice: Isinalin bilang kondisyong “Kung ...”
  alternative: 'Mas pormal: “At mangyayari, maghihimagsik kayo ...”'
  rationale: Sa daloy ng babala, ipinakikilala ng konstruksyon ang kahihinatnan ng posibleng paghihimagsik; ang “Kung” ay natural sa Filipino nang hindi binabago ang teolohikal na bigat.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “tatalikod,” “maghihimagsik,” at “kapulungan” upang mapanatili ang lakas ng babala at ang kolektibong pananagutan ng Israel. Iningatan ang pag-uulit ng “ngayon” at ang biglaang “bukas.”
