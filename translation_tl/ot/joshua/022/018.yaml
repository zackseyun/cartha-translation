  to: At tumatalikod kayo ngayon sa pagsunod kay Yahweh.[a] Kung maghihimagsik kayo ngayon laban kay Yahweh, bukas ay magagalit siya[b] sa buong kapulungan ng Israel.
  rationale: Inalis ang “ba” at tandang pananong upang mapanatili ang deklaratibong anyo ng Hebreo at ang agarang paratang ng talata. Pinalitan ang “tatalikod” ng “tumatalikod” upang maipakita ang kasalukuyang diin ng babalang “ngayon.” Inayos din ang talababa a para maging mas likas na Filipino, habang pinananatili ang impormasyong leksikal at ang idyomatikong kahulugan.
