  terminology: Ang “Yahweh,” “pagsunod,” “maghihimagsik,” at “kapulungan” ay angkop at pare-pareho sa rehistro. Pinananatili ang di-tahasang simuno ng “magagalit siya,” na malinaw sa konteksto ngunit hindi idinaragdag sa pangunahing teksto.
