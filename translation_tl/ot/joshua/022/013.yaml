id: JOS.22.13
reference: Joshua 22:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד אֶת פִּינְחָ֖ס בֶּן אֶלְעָזָ֥ר הַ/כֹּהֵֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: tl
  text: Pagkatapos, isinugo ng mga Israelita si Finehas, na anak ng paring si Eleazar, sa lupain ng Gilead—sa mga Rubenita, sa mga Gadita, at sa kalahating lipi ni Manases.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Pagkatapos, isinugo
  rationale: Ang waw-consecutive ay nagsusulong sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos,” at ipinakikita ng “isinugo” na ipinadala si Finehas para sa isang atas.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak ni Israel,” ang “mga Israelita” ang malinaw at likas na katawagan sa buong bayan sa kasalukuyang Tagalog.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: mga Rubenita / mga Gadita
  rationale: Sa kontekstong pantribo, ang בְּנֵי ay tumutukoy sa mga kabilang o inapo ng mga lipi, kaya mas natural at hindi nakalilinlang ang mga katawagang gentiliko kaysa literal na “mga anak.”
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: kalahating lipi ni Manases
  rationale: Tuwirang ipinahahayag nito ang kalahating bahagi ng lipi ni Manases at ginagamit ang karaniwang salitang “lipi” para sa שֵׁבֶט.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: sa lupain ng Gilead
  rationale: Ang parirala ay nagsasaad ng patutunguhan at lokasyon ng mga tatanggap. Inilagay ito bago ang paliwanag na talaan upang maging malinaw sa Tagalog na nasa Gilead ang pinadalhan.
- source_word: פִּינְחָס
  choice: Finehas
  rationale: Transliterasyong angkop sa bigkas at baybay sa Filipino.
- source_word: בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: anak ng paring si Eleazar
  rationale: Pinananatili nito ang ugnayang ama-anak at malinaw na ikinakabit ang titulong “pari” kay Eleazar, ayon sa pinakamalapit na sintaktikong kaugnayan sa Hebreo.
theological_decisions:
- issue: Kung kanino ikinakabit ang titulong הַכֹּהֵן (“ang pari”)
  choice: 'Kay Eleazar: “anak ng paring si Eleazar”'
  alternative: 'Kay Finehas: “si Finehas na pari, na anak ni Eleazar”'
  rationale: Sa pariralang Hebreo, kaagad na kasunod ng “Eleazar” ang “ang pari,” kaya ang pinakanatural na pagbasa ay na si Eleazar ang tinutukoy ng titulo. Hindi idinaragdag sa talata ang ibang posibleng pagkakakilanlan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga Israelita,” “mga Rubenita,” at “mga Gadita” bilang likas na katawagang pantribo; ang em dash ay nagpapakitang ang kasunod na talaan ang mga taong pinuntahan sa Gilead.
