  text: וַֽ/יִּשְׁמְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה לַ/עֲל֥וֹת עֲלֵי/הֶ֖ם לַ/צָּבָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: tl
  text: Nang marinig iyon ng mga anak ni Israel[a], nagtipon sa Shilo ang buong kapulungan ng mga anak ni Israel upang humayo laban sa kanila at makipagdigma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita.” Literal sa Hebreo ang “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Literal sa Hebreo, “umahon laban sa kanila para sa digmaan,” isang karaniwang idyoma para sa pagkilos-militar.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Nang marinig iyon
  rationale: Ang qal wayyiqtol ng שׁמע ay tuwirang nangangahulugang “narinig.” Idinagdag ang “iyon” bilang likas na layon sa Tagalog, na tumutukoy sa balitang nabanggit sa naunang konteksto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawan ng Hebreong “mga anak ni Israel” at pareho ang salin sa dalawang paglitaw nito sa talata.
- source_word: וַיִּקָּהֲלוּ
  choice: nagtipon
  rationale: Ang קהל ay nangangahulugang magtipon o bumuo ng kapulungan; natural at malinaw sa makabagong Tagalog ang “nagtipon.”
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ang buong kapulungan ng mga anak ni Israel
  rationale: Ipinahahayag ng עֵדָה ang sama-samang pamayanan o kapulungan, at likas na isinasalin ng “buong” ang כָּל sa pariralang ito.
- source_word: שִׁלֹה
  choice: Shilo
  rationale: Isinulat ang pangalang-pook ayon sa karaniwang anyong madaling bigkasin sa Filipino.
- source_word: לַעֲלוֹת עֲלֵיהֶם
  choice: upang humayo laban sa kanila
  rationale: Sa kontekstong militar, ang עלה + על ay pagpunta o pagsulong laban sa isang kalaban. Iniiwasan ng “humayo laban” ang di-likas na literal na “umahon laban” habang hindi pa tahasang ginagawang “lumusob.”
- source_word: לַצָּבָא
  choice: at makipagdigma
  rationale: Dito ang צָבָא ay tumutukoy sa digmaan o pagkilos-militar. Malinaw at natural sa Tagalog ang “makipagdigma.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong katawagang “mga anak ni Israel” para sa katapatan sa anyo ng pinagmulan, ngunit ginawang likas sa Tagalog ang idyomang militar.
