reference: Joshua 22:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם לֹ֤א מִ/דְּאָגָה֙ מִ/דָּבָ֔ר עָשִׂ֥ינוּ אֶת זֹ֖את לֵ/אמֹ֑ר מָחָ֗ר יֹאמְר֨וּ בְנֵי/כֶ֤ם לְ/בָנֵ֨י/נוּ֙ לֵ/אמֹ֔ר מַה לָּ/כֶ֕ם וְ/לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: tl
  text: Hindi! Sa halip, ginawa namin ito dahil sa pangamba na baka sa hinaharap ay sabihin ng inyong mga anak sa aming mga anak, ‘Ano ang kaugnayan ninyo kay Yahweh, ang Diyos ng Israel?’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדְּאָגָה מִדָּבָר
  choice: dahil sa pangamba
  rationale: Ipinahahayag ng parirala ang pagkilos bunsod ng balisa o nababahalang pag-iingat; natural sa Tagalog ang “dahil sa pangamba” nang hindi dinaragdagan ang di-tiyak na bagay na kinatatakutan.
- source_word: מָחָר
  choice: sa hinaharap
  rationale: Bagaman literal na “bukas,” ginagamit ito rito sa diwang panahong darating, gaya ng ipinakikita ng pagtukoy sa susunod na salinlahi.
- source_word: מַה־לָּכֶם וְלַיהוָה
  choice: Ano ang kaugnayan ninyo kay Yahweh
  rationale: Ang Hebreong idyoma ay nagtatanong kung ano ang ugnayan, bahagi, o pakialam ng isang panig sa isa; pinananatili ng “kaugnayan” ang saklaw nito nang natural sa Tagalog.
- source_word: יהוה
  choice: Yahweh
  rationale: Isinasalin ang natatanging pangalan ng Diyos bilang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON,” upang malinaw na kumatawan sa tetragrammaton.
theological_decisions:
- issue: Lakas ng pambungad na pagtanggi וְאִם־לֹא
  choice: Hindi! Sa halip,
  alternative: Kung hindi dahil sa pangamba
  rationale: Sa konteksto ng panunumpa at pagtatanggol sa naunang mga talata, ang pormula ay mariing tumatanggi sa paratang at ipinakikilala ang tunay na dahilan; gayunman, hindi nito binabago ang teolohikal na punto ng talata.
- issue: Kahulugan ng tanong tungkol sa ugnayan kay Yahweh
  choice: Ano ang kaugnayan ninyo kay Yahweh
  alternative: Ano ang kinalaman ninyo kay Yahweh
  rationale: Ang “kaugnayan” ay bahagyang mas marangal at kayang saklawin kapwa ang pakikibahagi sa tipan at karapatang sumamba nang hindi tahasang nagpapasya kung alin lamang ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” para sa banal na pangalan at “sa hinaharap” para sa idiomatikong gamit ng “bukas.”
