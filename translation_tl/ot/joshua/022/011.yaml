  text: וַ/יִּשְׁמְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הִנֵּ֣ה בָנ֣וּ בְנֵֽי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה אֶת הַ/מִּזְבֵּ֗חַ אֶל מוּל֙ אֶ֣רֶץ כְּנַ֔עַן אֶל גְּלִילוֹת֙ הַ/יַּרְדֵּ֔ן אֶל עֵ֖בֶר בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: tl
  text: 'At narinig ng mga Israelita ang balitang ito: “Narito, nagtayo ng altar ang mga anak ni Ruben, ang mga anak ni Gad, at ang kalahati ng lipi ni Manases sa tapat ng lupain ng Canaan, sa mga pook sa may Jordan,[a] sa panig ng mga Israelita.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa mga pook o distrito ng Jordan.” Hindi tiyak ang eksaktong heograpikong kahulugan ng parirala.
    reason: cultural_note
  - marker: b
    text: Mahirap tiyakin ang huling pariralang heograpiko. Maaari rin itong mangahulugang “sa panig na nakaharap sa mga Israelita” o “sa kabilang panig mula sa mga Israelita.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  choice: narinig ng mga Israelita ang balitang ito
  rationale: Likas na Filipino para sa pormulang Hebreo na literal na ‘narinig ... na sinasabi’; malinaw nitong ipinakikilalang ulat ang sumusunod nang hindi pinananatili ang alanganing sintaks.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Karaniwan at malinaw na katawagan sa makabagong Filipino para sa pambansang pangkat; hindi kailangang literal na ‘mga anak ni Israel’ dito.
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Pinananatili ang pantawag-pansing lakas ng הִנֵּה sa natural at marangal na Filipino.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: mga anak ni Ruben, ang mga anak ni Gad
  rationale: Pinananatili ang tahasang pampamilyang anyo ng Hebreo sa pagtukoy sa mga lipi.
- source_word: בָנוּ ... אֶת הַמִּזְבֵּחַ
  choice: nagtayo ng altar
  rationale: Ang בָנוּ ay natapos na kilos sa ulat. Bagaman tiyak ang pangngalan sa Hebreo, mas natural sa Filipino ang ‘ng altar’ sa unang pagbanggit sa loob ng ganitong konstruksiyon.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: sa tapat ng lupain ng Canaan
  rationale: Ipinahahayag ang ugnayang heograpiko ng מוּל nang hindi labis na tinutukoy kung ito ay ‘nakaharap’ o ‘nasa kabila.’
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: mga pook sa may Jordan
  rationale: Sinasalamin ang maramihang ‘mga distrito/pook’ at natural na ipinahahayag ang di-ganap na tiyak na heograpikong kaugnayan sa Jordan.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: sa panig ng mga Israelita
  rationale: Malapit sa sintaks ng Hebreo at sadyang hindi nilulutas ang mahirap na tanong kung ang ibig sabihin ay panig na kinaroroonan o panig na nakaharap sa kanila.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga Israelita’ para sa pambansang katawagan, ngunit pinanatili ang ‘mga anak ni Ruben/Gad’ bilang likas na katawagan sa mga lipi. Iningatan sa talababa ang tunay na kalabuan ng dalawang huling pariralang heograpiko.
