source:
  edition: WLC
  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: tl
  text: '“Ang Makapangyarihan[a], ang Diyos, si Yahweh! Ang Makapangyarihan, ang Diyos, si Yahweh! Alam niya, at ang Israel mismo ay makaaalam: kung ito’y paghihimagsik, o kung ito’y pagtataksil kay Yahweh[b], huwag mo kaming iligtas sa araw na ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalawang ulit na inuulit sa Hebreo ang banal na panawagan: “El, Elohim, Yahweh; El, Elohim, Yahweh.” Taimtim at tila panunumpa ang diin nito.'
    reason: cultural_note
  - marker: b
    text: Ang salitang isinaling “pagtataksil” ay maaari ring mangahulugang “paglabag sa katapatan” o “pagsira sa tiwala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Ang Makapangyarihan, ang Diyos, si Yahweh
  rationale: Pinananatili ang tatlong bahaging banal na panawagan at ang buong pag-uulit nito. Isinalin ang אֵל bilang pamagat na “Ang Makapangyarihan,” ang אֱלֹהִים bilang “ang Diyos,” at ang pangalang tipan na יְהוָה bilang “Yahweh.”
- source_word: הוּא יֹדֵעַ
  choice: Alam niya
  rationale: Likas at tuwirang Filipino para sa kasalukuyang kaalaman ng Diyos; hindi dinaragdagan ang payak na pahayag ng Hebreo.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: at malalaman din mismo ng Israel
  rationale: Ang “mismo” ay naghahatid ng diin ng הוּא, at ang “malalaman” ay nagpapanatili sa hinaharap na puwersa ng imperfect.
- source_word: אִם בְּמֶרֶד
  choice: kung ito’y paghihimagsik
  rationale: Pinananatili ang maikli at halos eliptikong anyo ng kondisyong Hebreo habang ginagawang malinaw sa Filipino ang tinutukoy na gawain.
- source_word: וְאִם בְּמַעַל
  choice: o kung ito’y pagtataksil
  rationale: Ang “pagtataksil” ay natural na Filipino para sa paglabag sa katapatan o tiwala, kabilang ang kontekstong tipan, nang hindi nililimitahan ito sa isang denominasyonal na pakahulugan.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Sa Filipino, ang “pagtataksil kay Yahweh” ay likas na naghahatid ng adbersatibo at relasyonal na diwa ng pang-ukol sa kontekstong ito.
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: huwag niya kaming iligtas
  rationale: Ang negatibong pakiusap o sumpang pansarili ay nasa ikatlong panauhan ayon sa anyong Masoretiko ng pandiwa; kaya iniiwasang gawing tuwirang ikalawang-panauhang “huwag mo.” Ang “iligtas” ang tuwirang katumbas ng Hiphil ng ישׁע.
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili ang taimtim na diin ng pariralang Hebreo nang mas pormal kaysa sa payak na “ngayon.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Lakas ng dalawang ulit na banal na panawagan
  choice: Inulit nang buo ang “Ang Makapangyarihan, ang Diyos, si Yahweh!”
  alternative: Pagsamahin o paikliin bilang isang banal na titulo
  rationale: Mahalaga sa taimtim at tila panunumpang retorika ng Hebreo ang eksaktong pag-uulit; hindi ito dapat pakinisin o bawasan.
- issue: Panauhan ng אַל תּוֹשִׁיעֵנוּ
  choice: huwag niya kaming iligtas
  alternative: huwag mo kaming iligtas
  rationale: Ang nakasulat na anyo ay ikatlong panauhan, kaya pinanatili iyon sa pangunahing teksto kahit maaaring maunawaan ang pahayag bilang apela sa Diyos. Hindi tahimik na nilulutas ang posibleng retorikal na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang taimtim na pag-uulit, ang pangalang Yahweh, at ang maigsi at kondisyunal na estruktura. Ginamit ang karaniwang maliliit na titik sa mga panghalip na tumutukoy sa Diyos. Ang mga tandang [a] at [b] ay kapuwa nasa pangunahing teksto.
