id: JOS.22.4
reference: Joshua 22:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: tl
  text: Ngayon ay pinagkalooban na ni Yahweh na inyong Diyos ng kapahingahan ang inyong mga kapatid[a], gaya ng sinabi niya sa kanila. Kaya ngayon, bumalik na kayo sa inyong mga tolda[b], sa lupaing pag-aari ninyo na ibinigay sa inyo ni Moises na lingkod ni Yahweh, sa kabila ng Jordan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy sa mga kapwa Israelita nila.
    reason: lexical_alternative
  - marker: b
    text: O “mga tahanan.” Literal na “mga tolda.”
    reason: lexical_alternative
  - marker: c
    text: O “sa kabilang panig ng Jordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵנִיחַ
  choice: pinagkalooban ... ng kapahingahan
  rationale: 'Ang Hiphil ng נוח ay causative: pinagpahinga o binigyan ng ginhawa mula sa digmaan. Natural sa Tagalog ang “pinagkalooban ng kapahingahan” at napananatili nito ang mahalagang tema ng kapahingahan.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tumutukoy ito sa Diyos ng Israel at nasa ikalawang panauhang maramihan ang hulaping paari.
- source_word: לַאֲחֵיכֶם
  choice: ang inyong mga kapatid
  rationale: Nananatiling malapit sa panlalaking maramihang anyo ng Hebreo; sa konteksto, ang tinutukoy ay ang mga kapwa Israelita.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: gaya ng sinabi niya sa kanila
  rationale: Direktang sinasalamin ang karaniwang kahulugan ng דבר nang hindi tahasang ginagawang “ipinangako,” bagaman pangako ang bisa nito sa konteksto.
- source_word: פְּנוּ וּלְכוּ לָכֶם
  choice: bumalik na kayo
  rationale: Sa konteksto ng pagpapaalis sa kanila patungo sa sariling tirahan, natural na ipinahahayag sa Tagalog ng “bumalik na kayo” ang pinagsamang utos na humarap palayo at umalis; hindi kailangang isalin ang ethical dative nang hiwalay.
- source_word: לְאָהֳלֵיכֶם
  choice: sa inyong mga tolda
  rationale: Pinananatili ang literal na larawan at makasaysayang tagpuan; maaari rin itong idiomatikong mangahulugang mga tahanan.
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: sa lupaing pag-aari ninyo
  rationale: Ang אֲחֻזָּה ay lupang pag-aari o paghawak. Malinaw ito sa modernong Tagalog at hindi awtomatikong ipinapalit ang mas teolohikal na “mana.”
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: na ibinigay sa inyo ni Moises
  rationale: Ang נתן ay tuwirang “magbigay”; hindi na kailangang palitan ng mas interpretibong “itinalaga.”
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Sa marangal na titulo ni Moises, “lingkod” ang angkop kaysa “alipin.”
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Karaniwang paraan ito sa Tagalog upang tukuyin ang kabilang panig ng Ilog Jordan ayon sa lokasyon ng nagsasalita.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng kapahingahang ibinigay
  choice: kapahingahan
  alternative: ginhawa mula sa digmaan
  rationale: Pinananatili ang mas malawak na salita at temang Hebreo; ipinahihiwatig ng konteksto ang katiwasayan mula sa labanan nang hindi nililimitahan dito ang kahulugan.
- issue: דבר bilang sinabi o ipinangako
  choice: sinabi
  alternative: ipinangako
  rationale: Ang pandiwa ay literal na “nagsalita/nagsabi.” Bagaman tumutukoy ito sa katuparan ng banal na pangako, hindi tahasang nilulutas ng salin ang interpretibong puwang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayo/inyong” para sa maramihang kausap. Iniwasan ang sobrang literal na “humarap kayo at humayo para sa inyong sarili,” at ginawang natural na “bumalik na kayo” habang pinananatili ang direksiyon ng utos.
