  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
translation:
  language: tl
  text: Pagkatapos, binasbasan sila ni Josue, saka niya sila pinayaon, at nagtungo sila sa kanilang mga tolda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanilang mga tahanan”—literal na “sa kanilang mga tolda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: binasbasan sila
  rationale: Tuwirang ipinahahayag nito ang pagbibigay ni Josue ng basbas sa kanila at natural ito sa marangal na makabagong Tagalog.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: וַיְשַׁלְּחֵם
  choice: pinayaon
  rationale: Ipinahihiwatig ng pandiwa ang pagpapahintulot o pagpapadala sa kanila upang umalis; maikli at angkop sa tagpo ang 'pinayaon.'
- source_word: וַיֵּלְכוּ
  choice: umuwi sila
  rationale: Bagaman karaniwang nangangahulugang 'pumunta,' ipinakikita ng pariralang patungo sa kanilang mga tolda na umuwi sila; natural itong pakinggan sa Tagalog nang hindi binabago ang patutunguhan.
- source_word: אֶל
  choice: sa
  rationale: Karaniwang panandang Tagalog ito para sa patutunguhan kasunod ng pandiwang 'umuwi.'
- source_word: אָהֳלֵיהֶם
  choice: kani-kanilang tolda
  rationale: Pinananatili ang literal na larawang 'mga tolda,' habang malinaw na ipinahahayag ng 'kani-kanilang' ang pamamahaging taglay ng Hebreong hulaping pangmaramihan.
