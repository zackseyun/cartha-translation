  to: Sa halip, ito ay saksi sa pagitan namin at ninyo, at sa pagitan ng aming mga salinlahing darating, upang magampanan namin sa harap niya ang paglilingkod kay Yahweh sa pamamagitan ng aming mga handog na sinusunog, mga hain, at mga handog pangkapayapaan, upang hindi sabihin balang araw ng inyong mga anak sa aming mga anak, ‘Wala kayong bahagi kay Yahweh.’
