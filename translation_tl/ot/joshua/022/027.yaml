base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: tl
  text: Sa halip, ito ay saksi sa pagitan namin at ninyo, at sa pagitan ng aming mga salinlahing darating, upang magampanan namin sa harap niya ang paglilingkod kay Yahweh sa pamamagitan ng aming mga handog na sinusunog, mga hain, at mga handog pangkapayapaan, upang hindi sabihin balang araw ng inyong mga anak sa aming mga anak, ‘Wala kayong bahagi kay Yahweh.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵד
  choice: saksi
  rationale: Tuwirang ipinapahayag na ang altar ay nagsisilbing patunay o saksi sa ugnayan ng dalawang pangkat.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: maglilingkod kami kay Yahweh
  rationale: Iniiwasan ang mabigat at paulit-ulit na ‘gawin ang paglilingkod’ habang pinananatili ang diwa ng pagsasagawa ng nakatalagang pagsamba kay Yahweh.
- source_word: עֹלוֹתֵינוּ
  choice: aming mga handog na sinusunog
  rationale: Ipinapakita ang natatanging uri ng handog na inihahandog sa pamamagitan ng pagsunog.
- source_word: שְׁלָמֵינוּ
  choice: aming mga handog pangkapayapaan
  rationale: Karaniwang katawagang biblikal para sa mga handog na שְׁלָמִים, nang hindi nililimitahan ang malawak nitong ritwal na diwa.
- source_word: חֵלֶק בַּיהוָה
  choice: bahagi kay Yahweh
  rationale: Pinananatili ang matapang at siksik na pahayag ng Hebreo tungkol sa bahagi o karapatan sa pakikipag-ugnayan at pagsamba kay Yahweh.
theological_decisions:
- issue: Paglitaw ng banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Isinasalin bilang pangalang pantangi ang tetragrammaton sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng ‘bahagi kay Yahweh’
  choice: Pinanatili ang literal at malawak na pahayag
  alternative: ‘karapatang sumamba kay Yahweh’
  rationale: Maaaring saklawin ng parirala ang karapatan sa pagsamba, tipan, at pagkabilang sa bayan; hindi tahasang nilulutas ng salin ang lawak nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Sa halip’ upang ipakita ang pagsalungat sa naunang ipinagkakailang layunin ng altar. Ang ‘mga salinlahi naming susunod sa amin’ ay likas na paglalahad ng אַחֲרֵינוּ nang hindi binabago ang ugnayang pangsalinlahi.
