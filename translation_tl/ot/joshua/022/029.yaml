  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang mariing pagtanggi, ang paghihimagsik laban kay Yahweh, ang pagtalikod sa pagsunod sa kanya, at ang ipinagbabawal na pagtatayo ng karagdagang altar para sa mga handog. Napananatili rin ang tatlong uri ng handog at ang pagtukoy sa altar na nasa harap ng tabernakulo.
  naturalness: Natural at marangal ang kabuuang modernong Filipino. Gayunman, kailangan ng bantas sa "Yahweh, na aming Diyos" upang malinaw na ang "aming Diyos" ay pagpapakilala kay Yahweh, hindi isang restriktibong panuring na maaaring lumabo ang ugnayan sa pariralang "altar ni Yahweh."
  terminology: Ang "Yahweh," "altar," "handog na sinusunog," "handog na butil," "hain," at "tabernakulo" ay angkop at pare-pareho sa rehistro at sa sakripisyal na konteksto. Ang "bukod sa" ay tapat sa מִלְּבַד.
