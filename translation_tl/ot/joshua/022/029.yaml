  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: tl
  text: Malayong mangyari sa amin na maghimagsik laban kay Yahweh at tumalikod ngayon sa pagsunod kay Yahweh sa pamamagitan ng pagtatayo ng altar para sa handog na sinusunog, handog na butil, o hain, bukod sa altar ni Yahweh, na aming Diyos, na nasa harap ng kanyang tabernakulo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: Malayong mangyari sa amin
  rationale: Natural na idyomang Filipino para sa mariing pagtanggi at pagkasuklam sa iminungkahing gawain.
- source_word: לִמְרֹד בַּיהוָה
  choice: na maghimagsik laban kay Yahweh
  rationale: Ipinahahayag ng מָרַד ang hayagang paghihimagsik, at adversatibo ang diwa ng בְּ sa pariralang ito.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: at tumalikod ngayon sa pagsunod kay Yahweh
  rationale: Pinananatili ang Hebreong larawan ng pagtalikod mula sa pagsunod sa likuran ni Yahweh, ngunit ipinahahayag ito sa natural na Filipino.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: sa pamamagitan ng pagtatayo ng altar
  rationale: Ipinakikita ng infinitive ang paraang magpapamalas ng paghihimagsik at pagtalikod.
- source_word: לְעֹלָה
  choice: para sa handog na sinusunog
  rationale: Teknikal na katawagan sa haing lubusang sinusunog; malinaw at madaling maunawaan sa modernong Filipino.
- source_word: לְמִנְחָה
  choice: handog na butil
  rationale: Sa kontekstong pangsakripisyo, tumutukoy ang מִנְחָה sa handog na mula sa ani o butil.
- source_word: וּלְזָבַח
  choice: o hain
  rationale: Pangkalahatang katawagang pangsakripisyo ang זֶבַח rito; hindi tinutukoy ang isang mas makitid na uri ng hain.
- source_word: מִלְּבַד
  choice: bukod sa
  rationale: Malinaw na inihihiwalay ang anumang bagong altar mula sa lehitimong altar sa santuwaryo.
- source_word: מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: altar ni Yahweh na aming Diyos
  rationale: Natural na Filipino para sa construct chain at pinananatili ang pahayag ng tipan na 'aming Diyos.'
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: na nasa harap ng kanyang tabernakulo
  rationale: Pinananatili ang lokasyong ipinahahayag ng לִפְנֵי at ang ikatlong-panauhang panlalaking hulapi sa מִשְׁכָּנוֹ.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; ang 'Yahweh' ay nagpapanatili sa personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang 'tabernakulo' bilang pamilyar na terminong biblikal, habang iniwasan ang labis na teknikal o makalumang pananalita.
