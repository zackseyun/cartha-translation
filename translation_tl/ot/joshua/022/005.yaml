reference: Joshua 22:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: tl
  text: 'Mag-ingat lamang kayong mabuti na tuparin ang utos at ang Kautusan[a] na iniutos sa inyo ni Moises, na lingkod ni Yahweh: ibigin si Yahweh na inyong Diyos, lumakad sa lahat ng kanyang mga daan, sundin ang kanyang mga utos, kumapit sa kanya, at paglingkuran siya nang buong puso at nang buong pagkatao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “turo” para sa “Kautusan” (Hebreo: torah).'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Sa konteksto ng pagpapaalis at pagpapala sa naunang talata, nagpapakilala ito ng mariing pasubali o panghuling paalala. Mas natural sa Filipino ang “Ngunit” kaysa sa literal na “Tanging,” habang napapanatili ang puwersang panawagan.
- source_word: שִׁמְרוּ מְאֹד לַעֲשׂוֹת
  choice: ingatan ninyong mabuti na tuparin
  rationale: Ipinahahayag ng שׁמר + מְאֹד ang matinding pag-iingat, at ng infinitibong לַעֲשׂוֹת ang aktuwal na pagsasagawa. Ang “tuparin” ay natural na Filipino para sa pagsasakatuparan ng utos.
- source_word: הַמִּצְוָה
  choice: ang utos
  rationale: Pinananatili ang isahan at ang diwang tipanan ng מִצְוָה sa malinaw at kasalukuyang salitang Filipino.
- source_word: הַתּוֹרָה
  choice: ang Kautusan
  rationale: Sa kontekstong Mosaiko, kinikilala ng “Kautusan” ang tiyak at tipanang gamit ng torah. Gayunman, ang leksikal na kahulugang “turo” ay pinananatili sa talababa.
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Ang עֶבֶד ay isang marangal na titulo para kay Moises dito; ang “lingkod” ay angkop at hindi labis na nagtatampok ng kahulugang pagkaalipin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang nasa tekstong Hebreo, sa halip na palitan ng isang titulo.
- source_word: לְאַהֲבָה
  choice: ibigin
  rationale: Tuwirang ipinapahayag ang tipanang panawagang umibig; marangal at natural ang “ibigin” sa ganitong rehistro.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: lumakad sa lahat ng kanyang mga daan
  rationale: Pinananatili ang malinaw at mahalagang metaporang Hebreo ng paglakad bilang pamumuhay ayon sa mga daan ng Diyos.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: sundin ang kanyang mga utos
  rationale: Sa Filipino, “sundin” ang natural na paglalarawan ng pag-iingat o pagtupad sa mga utos at malinaw nitong ipinahahayag ang hinihinging pagsunod.
- source_word: וּלְדָבְקָה בּוֹ
  choice: kumapit sa kanya
  rationale: Pinananatili ng “kumapit” ang masidhi at relasyonal na larawan ng malapit at matatag na pagkakaugnay.
- source_word: וּלְעָבְדוֹ
  choice: paglingkuran siya
  rationale: Mas malawak ang “paglingkuran” kaysa “sambahin” at pinananatili nito ang saklaw ng עבד, na maaaring magsama ng pagsamba at masunuring paglilingkod.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: nang buong puso at buong pagkatao
  rationale: Ang נֶפֶשׁ ay hindi lamang tumutukoy sa hiwalay na di-materyal na “kaluluwa”; dito ay saklaw nito ang buong buhay o sarili. Ang “buong pagkatao” ay natural at hindi naglilimita sa antropolohikal na kahulugan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit mismo ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipanan sa halip na palitan ito ng titulo.
- issue: Mga metaporang tipanan
  choice: “lumakad sa lahat ng kanyang mga daan” at “kumapit sa kanya”
  alternative: “mamuhay ayon sa lahat ng kanyang kalooban” at “manatiling tapat sa kanya”
  rationale: Ang literal ngunit nauunawaang mga larawan ay may relasyonal at etikal na bigat. Ang pagpapanatili sa mga ito ay umiiwas sa pagpapakahulugang lampas sa sinasabi ng teksto.
- issue: Saklaw ng נֶפֶשׁ
  choice: buong pagkatao
  alternative: buong kaluluwa; buong buhay
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa sarili, buhay, o buong persona. Ang “pagkatao” ay nagpapahayag ng buong-pusong paglilingkod nang hindi ipinapalagay na isang hiwalay na sangkap lamang ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga metaporang Hebreo kung natural pa ring mauunawaan, ngunit ginamit ang idiomatikong “tuparin” at “sundin” para sa malinaw na panawagan sa pagsasagawa. Ang marker na [a] ay inilagay agad pagkatapos ng “Kautusan.”
