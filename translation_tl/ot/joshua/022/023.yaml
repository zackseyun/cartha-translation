  naturalness: Likas at marangal ang Tagalog. Mas natural ang tambalang “mga handog pangkapayapaan” kaysa “mga handog para sa kapayapaan,” habang pinananatili ang teknikal na kahulugan.
  terminology: Ang “Yahweh,” “altar,” “handog na sinusunog,” at “handog na butil” ay angkop. Ang “mga handog pangkapayapaan” ay maikli, malinaw, at tumutugma sa terminong pangsakripisyo.
  issues:
