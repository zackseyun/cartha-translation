revisions:
- from: Kung nagtayo kami ng altar para sa aming sarili upang tumalikod sa pagsunod kay Yahweh, o upang maghandog doon ng handog na sinusunog o handog na butil, o upang mag-alay doon ng mga handog para sa kapayapaan[a]—si Yahweh mismo ang maningil sa amin dahil dito.[b]
  to: Kung nagtayo kami ng altar para sa aming sarili upang tumalikod sa pagsunod kay Yahweh, o upang maghandog doon ng handog na sinusunog o handog na butil, o upang mag-alay doon ng mga handog pangkapayapaan[a]—nawa’y si Yahweh mismo ang maningil sa amin dahil dito.[b]
  rationale: Idinagdag ang “nawa’y” upang malinaw na maipahayag ang puwersang imprecatory ng pangwakas na sugnay nang hindi ipinipilit ang isang payak na hinaharap na pagbasa. Pinalitan ang “mga handog para sa kapayapaan” ng mas natural na “mga handog pangkapayapaan.” Iningatan ang mga anchor ng talababa at ang lahat ng nilalaman ng talata.
