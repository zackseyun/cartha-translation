  text: לִ/בְנ֥וֹת לָ֨/נוּ֙ מִזְבֵּ֔חַ לָ/שׁ֖וּב מֵ/אַחֲרֵ֣י יְהוָ֑ה וְ/אִם לְ/הַעֲל֨וֹת עָלָ֜י/ו עוֹלָ֣ה וּ/מִנְחָ֗ה וְ/אִם לַ/עֲשׂ֤וֹת עָלָי/ו֙ זִבְחֵ֣י שְׁלָמִ֔ים יְהוָ֖ה ה֥וּא יְבַקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: tl
  text: Kung nagtayo kami ng altar para sa aming sarili upang tumalikod sa pagsunod kay Yahweh, o upang maghandog doon ng handog na sinusunog o handog na butil, o upang mag-alay doon ng mga handog pangkapayapaan[a]—nawa’y si Yahweh mismo ang maningil sa amin dahil dito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga handog pangkapayapaan” ay maaari ring isaling “mga handog para sa pakikisama.”
    reason: lexical_alternative
  - marker: b
    text: O “si Yahweh mismo ang maniningil sa amin dahil dito,” ibig sabihin, pananagutin niya kami.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: Kung nagtayo kami ng altar para sa aming sarili
  rationale: Ang infinitibong may ל ay gumaganap na kondisyon sa konteksto ng panunumpa sa naunang talata. Pinanatili ng “para sa aming sarili” ang לָנוּ, at ang “altar” ang likas at karaniwang salin ng מִזְבֵּחַ.
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: upang tumalikod sa pagsunod kay Yahweh
  rationale: Ipinapahayag nito kapwa ang diwa ng pagtalikod at ang konkretong larawan ng paghinto sa pagsunod na nasa מֵאַחֲרֵי.
- source_word: וְאִם לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: o upang maghandog doon ng handog na sinusunog o handog na butil
  rationale: Ang הַעֲלוֹת ay sakripisyal na paghahandog, ang עוֹלָה ay handog na sinusunog, at ang מִנְחָה sa kontekstong kultiko ay handog na butil. Ginamit ang “o” sa pagitan ng dalawang uri upang malinaw na katawanin ang saklaw ng kondisyong וְאִם, bagaman waw ang tuwirang pang-ugnay sa Hebreo.
- source_word: וְאִם לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: o upang mag-alay doon ng mga handog para sa kapayapaan
  rationale: Ang עָשָׂה ay idyomatikong tumutukoy sa pag-aalay ng sakripisyo. Ang “mga handog para sa kapayapaan” ay nagpapanatili sa ugnayan ng זִבְחֵי at שְׁלָמִים habang nananatiling nauunawaan sa modernong Filipino.
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: si Yahweh mismo ang maningil sa amin dahil dito
  rationale: Sa konteksto ng sumpang laban sa sarili, ang בִּקֵּשׁ ay may diwang maningil o humingi ng pananagutan. Kinakatawan ng “mismo” ang pagbibigay-diin ng הוּא; tahasang idinagdag ang “sa amin” bilang likas na layon na ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Direktang ginamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Puwersa ng pangwakas na sugnay sa konteksto ng panunumpa
  choice: si Yahweh mismo ang maningil sa amin dahil dito
  alternative: si Yahweh mismo ang maniningil sa amin dahil dito
  rationale: Ang anyong “ang maningil” ay naghahatid ng mapakiusap o sumpang-laban-sa-sariling puwersa (“may he require it”) sa halip na gawing payak na hula sa hinaharap.
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa pakikisama
  rationale: Maaaring idiin ng termino ang kabuuan, kapayapaan, o salu-salong pakikisama. Pinili ang tradisyonal ngunit malinaw na “kapayapaan,” at inilagay sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na estruktura ng kondisyong panunumpa, ngunit gumamit ng likas na pandiwang “mag-alay” at “maningil.” Ang mga marker na [a] at [b] ay kapwa lumilitaw sa pangunahing teksto.
