  text: Pagkatapos, ipinatawag ni Josue ang mga Rubenita, ang mga Gadita, at ang kalahating lipi ni Manases.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Panandang temporal ito na nag-uugnay sa kasunod na pangyayari sa daloy ng salaysay. Natural sa makabagong Filipino ang “Pagkatapos.”
- source_word: יִקְרָא
  choice: ipinatawag
  rationale: Ang Qal na pandiwa ay nangangahulugang tumawag o magpatawag. Sa konteksto, tinawag ni Josue ang mga pangkat upang humarap sa kaniya; malinaw at natural dito ang “ipinatawag.”
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: לָרֽאוּבֵנִי
  choice: ang mga Rubenita
  rationale: Ang pang-isahang katawagang gentiliko ay kolektibo rito at tumutukoy sa pangkat mula sa lipi ni Ruben.
- source_word: וְלַגָּדִי
  choice: ang mga Gadita
  rationale: Gaya ng “Rubenita,” ang pang-isahang gentiliko sa Hebreo ay ginagamit nang kolektibo para sa pangkat mula sa lipi ni Gad.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: at ang kalahating lipi ni Manases
  rationale: Ang מַטֶּה ay tumutukoy rito sa lipi bilang pangkat panlipi. Ang “kalahating lipi ni Manases” ay maikli, malinaw, at likas sa Filipino.
