source:
  edition: WLC
  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: tl
  text: Hindi pa ba sapat para sa atin ang kasamaan ng Peor[a][b], na hanggang sa araw na ito ay hindi pa natin nalilinis ang ating mga sarili mula rito, at nagkaroon ng salot sa kapulungan ni Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “pagkakasala” o “pananagutan dahil sa kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: “Peor” lamang ang nasa Hebreo; sa kaugnay na mga talata ay ginagamit ang mas buong katawagang “Baal-Peor.”
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: Hindi pa ba sapat para sa atin
  rationale: Ito ang natural na anyo sa modernong Tagalog ng retorikal na tanong na literal na ‘Napakaliit ba para sa atin?’ Pinananatili nito ang mariing pagsaway nang hindi nagiging alanganin ang pananalita.
- source_word: עֲוֺן
  choice: kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa masamang gawa, pagkakasala o pananagutang bunga nito. Ang ‘kasamaan’ ay nagpapanatili sa bigat na moral nang hindi nililimitahan ang salita sa parusa lamang; inilalahad sa talababa ang tunay na kalabuan.
- source_word: פְּעוֹר
  choice: Peor
  rationale: ‘Peor’ lamang ang nasa tekstong Hebreo, kaya hindi idinagdag sa pangunahing teksto ang mas buong katawagang ‘Baal-Peor’ mula sa kaugnay na mga talata.
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: na ... hindi pa natin nalilinis ang ating sarili mula rito
  rationale: Pinananatili ng ‘ating sarili’ ang reflexive na diwa ng hitpael ng טהר, at malinaw na ang komunidad ang hindi pa lubos na nakapaglinis o nakapagpadalisay mula sa kasamaan at karumihang kaugnay nito.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Tuwirang katumbas ito ng karaniwang Hebreong idyoma at nagpapahiwatig na nagpapatuloy pa ang kalagayan sa panahon ng nagsasalita.
- source_word: וַיְהִי הַנֶּגֶף
  choice: at nagkaroon ng salot
  rationale: Ang payak na ‘at’ ay pinananatili upang huwag magdagdag ng tahasang kontrast na wala sa Hebreo. Ang ‘nagkaroon ng salot’ ay natural na Tagalog para sa pagdating o paglitaw ng nakamamatay na salot.
- source_word: בַּעֲדַת יְהוָה
  choice: sa kapulungan ni Yahweh
  rationale: Ang עֵדָה ay ang sama-samang pamayanan ng Israel, kaya ang ‘kapulungan’ ay angkop at marangal. Isinasalin ang pangalang tipan na יְהוָה bilang ‘Yahweh.’
theological_decisions:
- issue: 'Saklaw ng עֲוֺן: masamang gawa, pagkakasala, o pananagutan'
  choice: kasamaan, na may talababa tungkol sa ‘pagkakasala/pananagutan’
  alternative: pagkakasala; pananagutan dahil sa kasalanan
  rationale: Hindi dapat tahimik na lutasin ang semantikong lawak ng salita. Ang pangunahing salin ay nagpapatampok sa moral na kasamaan, habang pinananatili ng talababa ang posibilidad ng pananagutan o guilt.
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang nasa pinagmulang teksto; pinananatili ng ‘Yahweh’ ang hayagang pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng salot sa nagpapatuloy na kasamaan
  choice: payak na ‘at’
  alternative: gayong; ngunit; at gayunma’y
  rationale: Ang waw sa teksto ay hindi tahasang nagtatakda ng kontrast. Pinananatili ng payak na pang-ugnay ang tensiyon at hinahayaang ang retorikal na konteksto ang magpahiwatig ng relasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang natural na retorikal na ‘Hindi pa ba sapat’ sa halip na literal ngunit alanganing ‘Napakaliit pa ba.’ Pinanatili ang isang tuloy-tuloy na tanong, ang payak na koordinasyong ‘at,’ at ang pangkomunidad na ‘kapulungan.’
