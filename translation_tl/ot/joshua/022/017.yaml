  to: Hindi pa ba sapat para sa atin ang kasamaan ng Peor[a][b], na hanggang sa araw na ito ay hindi pa natin nalilinis ang ating mga sarili mula rito, at nagkaroon ng salot sa kapulungan ni Yahweh?
