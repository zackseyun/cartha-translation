reference: Joshua 22:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: tl
  text: Ngunit kung marumi ang lupaing pag-aari ninyo[a], tumawid kayo sa lupaing pag-aari ni Yahweh, kung saan nananahan ang tabernakulo ni Yahweh[b], at magtamo kayo ng lupain sa piling namin[c]. Huwag lamang kayong maghimagsik laban kay Yahweh o laban sa amin sa pamamagitan ng pagtatayo ninyo ng isang altar para sa inyong sarili bukod sa altar ni Yahweh na ating Diyos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lupaing minana ninyo” o “lupain ng inyong mana.” Ang salitang Hebreo ay maaaring tumukoy sa isang pag-aaring minana.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kung saan nakatira ang tabernakulo ni Yahweh.” Literal na sinasabi ng Hebreo na nananahan doon ang tabernakulo ni Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “at manirahan kayo sa piling namin.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtatamo ng lupain o pag-aari, o sa paninirahan sa isang lugar.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “hiwalay sa” o “bilang karagdagan sa” altar ni Yahweh na ating Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: Ngunit
  rationale: Likas na panandang pasalungat sa Filipino na nagpapanatili sa matinding paglilinaw ng Hebreo.
- source_word: טְמֵאָה
  choice: marumi
  rationale: Pinananatili ang maaaring ritwal, moral, o retorikal na diwa ng karumihan nang hindi ito nililimitahan sa isang paliwanag.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: lupaing pag-aari ninyo
  rationale: Ipinahahayag ang lupa bilang hawak o minanang ari-arian at pinananatili ang pagkakatulad nito sa pag-aari ni Yahweh.
- source_word: עִבְרוּ לָכֶם
  choice: tumawid kayo
  rationale: Malinaw ang utos na tumawid, malamang sa Jordan; hindi na tahasang isinalin ang benefactive pronoun dahil magiging pilit ang 'para sa inyong sarili' sa kasalukuyang Filipino.
- source_word: אֶל אֶרֶץ אֲחֻזַּת יְהוָה
  choice: sa lupain na pag-aari ni Yahweh
  rationale: Pinananatili ang sadyang pagtutulad sa 'lupaing pag-aari ninyo' at ang banal na pangalang Yahweh.
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: kung saan nananahan ang tabernakulo ni Yahweh
  rationale: Pinananatili ang personipikadong pandiwang 'nananahan' para sa tabernakulo at ang kultikong terminong משכן.
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: at magkaroon kayo ng pag-aari sa gitna namin
  rationale: Ipinakikita ang diwa ng pagtatamo ng lupa o pag-aari, hindi lamang ang pangkalahatang paninirahan.
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ
  choice: Huwag lamang kayong maghimagsik laban kay Yahweh
  rationale: Ang 'lamang' ay naghahayag ng mariing paghihigpit, at ang 'maghimagsik laban' ay tuwirang tumutugma sa layon ng paghihimagsik.
- source_word: וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: o laban sa amin
  rationale: Likas sa Filipino ang hindi pag-uulit sa pandiwa habang malinaw na saklaw pa rin ng pagbabawal ang ikalawang layon.
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: sa pamamagitan ng pagtatayo ninyo ng isang altar para sa inyong sarili
  rationale: Ipinapakita ang pagtatayo ng altar bilang paraan ng paghihimagsik at pinananatili ang reflexive o benefactive na diwa.
- source_word: מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: bukod sa altar ni Yahweh na ating Diyos
  rationale: Ang 'bukod sa' ay maaaring magpahiwatig ng hiwalay o karagdagang altar nang hindi ipinapasya kung alin ang eksaktong diin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Uri ng karumihan ng lupain sa silangan ng Jordan
  choice: Isinalin nang payak bilang 'marumi' nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: Tukuyin itong ritwal na nadungisan o hindi angkop dahil nasa labas ng lupain ng santuwaryo.
  rationale: Hindi ipinaliliwanag ng Hebreo kung ritwal, heograpiko, o retorikal ang karumihan; pinananatili ng salin ang kalabuan.
- issue: Katayuan ng isa pang altar
  choice: Ipinagbawal ang pagtatayo ng altar 'bukod sa' altar ni Yahweh.
  alternative: Sabihing lahat ng ikalawang altar ay likas na bawal, o tukuying altar lamang na panghandog at karibal ng sentral na santuwaryo ang tinutukoy.
  rationale: Tinututulan ng talata ang hiwalay o karagdagang altar ngunit hindi nito tahasang inilalahad ang buong saklaw ng pagbabawal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang 'tabernakulo' bilang kilalang terminong biblikal, ang pangalang 'Yahweh,' at ang pag-uulit ng konsepto ng pag-aari. Inayos ang ayos ng mga talababa upang lumitaw ang bawat pananda sa mismong pariralang tinutukoy nito.
