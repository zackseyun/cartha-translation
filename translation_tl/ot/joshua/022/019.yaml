revisions:
- from: Ngunit kung marumi ang lupaing pag-aari ninyo[a], tumawid kayo sa lupain na pag-aari ni Yahweh, kung saan nananahan ang tabernakulo ni Yahweh[b], at magkaroon kayo ng pag-aari sa gitna namin[c]. Huwag lamang kayong maghimagsik laban kay Yahweh o laban sa amin sa pamamagitan ng pagtatayo ninyo ng isang altar para sa inyong sarili bukod sa altar ni Yahweh na ating Diyos[d].
  to: Ngunit kung marumi ang lupaing pag-aari ninyo[a], tumawid kayo sa lupaing pag-aari ni Yahweh, kung saan nananahan ang tabernakulo ni Yahweh[b], at magtamo kayo ng lupain sa piling namin[c]. Huwag lamang kayong maghimagsik laban kay Yahweh o laban sa amin sa pamamagitan ng pagtatayo ninyo ng isang altar para sa inyong sarili bukod sa altar ni Yahweh na ating Diyos[d].
  rationale: Pinalitan lamang ang hindi idiomatikong ‘magkaroon kayo ng pag-aari sa gitna namin’ ng ‘magtamo kayo ng lupain sa piling namin.’ Pinananatili nito ang land-tenure na diwa ng Hebreo, samantalang mas malinaw at natural sa modernong Filipino. Inangkop din ang talababa c upang tumugma sa binagong pangunahing teksto. Walang binagong interpretasyong teolohikal o karagdagang paglilinaw sa kalabuan ng pinagmulan.
