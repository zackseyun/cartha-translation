    rationale: Bagaman malapit sa literal na diwa ng וְהֵאָחֲזוּ בְּתוֹכֵנוּ, hindi karaniwang Filipino ang ‘magkaroon ng pag-aari sa gitna namin.’ Ang ‘magtamo kayo ng lupain sa piling namin’ ay mas idiomatiko at pinananatili ang diwa ng pagtamo ng isang holding, hindi lamang basta paninirahan.
