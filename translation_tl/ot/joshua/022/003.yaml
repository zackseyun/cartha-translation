  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: tl
  text: Hindi ninyo pinabayaan ang inyong mga kapatid[a] sa mahabang panahong ito, hanggang sa araw na ito, at tinupad ninyo ang tungkuling ipinag-utos ni Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inyong mga kapwa Israelita.” Literal na “inyong mga kapatid” ang Hebreo, isang panlalaking maramihang katawagang pampamilya na maaari ring tumukoy nang malawakan sa mga kabilang sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: hindi ninyo pinabayaan
  rationale: Ang עזב ay nangangahulugang iwan, pabayaan, o talikuran. Ang “pinabayaan” ay natural sa Filipino at nagpapanatili ng bigat ng patuloy na katapatan sa kanilang mga kapatid.
- source_word: אֲחֵיכֶם
  choice: ang inyong mga kapatid
  rationale: Tuwirang pinananatili nito ang panlalaking maramihang katawagang pampamilya sa Hebreo. Maaaring mas malawak ang tinutukoy nito—ang kapwa nila mga Israelita—kaya nilinaw iyon sa talababa.
- source_word: זֶה יָמִים רַבִּים
  choice: sa loob ng maraming araw na ito
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma tungkol sa maraming araw, habang malinaw na ipinahahayag ang mahabang tagal.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang pahayag ito ng pagpapatuloy mula sa nakaraan hanggang sa kasalukuyang araw.
- source_word: וּשְׁמַרְתֶּם
  choice: at tinupad ninyo
  rationale: Sa kontekstong may iniatang na tungkulin, ang שׁמר ay tumutukoy sa matapat na pag-iingat o pagsunod. Ang “tinupad” ang pinakanatural na katumbas sa Filipino.
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: ang tungkuling iniutos
  rationale: Ang parirala ay tumutukoy sa pananagutan o tungkuling iniatang sa pamamagitan ng isang utos. Inilalahad ito nang natural sa Filipino nang hindi inaalis ang ugnayan ng tungkulin at utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: na inyong Diyos
  rationale: Pinananatili nito ang tipanang katawagang “inyong Diyos” na kaugnay ng pangalang Yahweh.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng katawagang אֲחֵיכֶם
  choice: inyong mga kapatid
  alternative: inyong mga kapwa Israelita
  rationale: Panlalaking maramihan ang anyo sa Hebreo, kaya pinanatili sa pangunahing teksto ang literal na katawagang pampamilya. Hindi tahasang nilutas ang maaaring mas malawak na saklaw nito; inilagay iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “mga kapatid” at ang pangalang “Yahweh,” habang ginawang natural sa Filipino ang pormal na pariralang Hebreo tungkol sa pag-iingat ng iniatang na utos.
