revisions:
- from: Naging mabuti sa paningin ng mga anak ni Israel[a] ang bagay na iyon, at pinagpala nila ang Diyos[b]. Hindi na nila sinabi na sasalakayin ang mga ito sa digmaan upang wasakin ang lupaing tinitirhan ng mga anak ni Ruben at ng mga anak ni Gad.[c]
  to: Naging mabuti sa paningin ng mga anak ni Israel[a] ang bagay na iyon, at pinagpala nila ang Diyos[b]. Hindi nila binanggit ang paglusob laban sa kanila upang makidigma at wasakin ang lupaing tinitirhan ng mga anak ni Ruben at ng mga anak ni Gad.[c]
  rationale: Inalis ang di-sinusuportahang "na" at pinalitan ang konstruksyon ng likas na Tagalog na nagpapanatili sa diwa ng Hebreong "hindi nila sinabi/binanggit na lumusob laban sa kanila para sa digmaan." Nilinaw rin ang talababa tungkol sa Hebreong idyomang militar, nang hindi dinaragdagan ang kahulugan ng talata.
