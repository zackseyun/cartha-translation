base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: tl
  text: Naging mabuti sa paningin ng mga anak ni Israel[a] ang bagay na iyon, at pinagpala nila ang Diyos[b]. Hindi nila binanggit ang paglusob laban sa kanila upang makidigma at wasakin ang lupaing tinitirhan ng mga anak ni Ruben at ng mga anak ni Gad.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “pinuri nila ang Diyos.” Literal na kahulugan ng pandiwang Hebreo ang “pinagpala.”
    reason: lexical_alternative
  - marker: c
    text: Literal, “Hindi nila sinabi na umahon laban sa kanila para sa digmaan.” Ang “umahon laban sa” ay isang idyomang militar sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: Naging mabuti sa paningin ... ang bagay na iyon
  rationale: Pinananatili nito ang Hebreong idyomang evaluative na “mabuti sa paningin,” habang ang “bagay na iyon” ay tumutukoy sa paliwanag na katatapos lamang ibigay.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tuwirang sinasalamin nito ang panlalaking pangmaramihang anyo ng Hebreo; ibinibigay sa talababa ang mas karaniwang “mga Israelita.”
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: pinagpala nila ang Diyos
  rationale: Pinananatili ang pangunahing kahulugan ng ברך kapag Diyos ang layon; sa konteksto maaari rin itong unawaing pagpuri, kaya inilagay ang alternatibo sa talababa.
- source_word: וְלֹא אָמְרוּ
  choice: Hindi na nila sinabi
  rationale: Malapit ito sa literal na “at hindi nila sinabi,” at sa konteksto ay nagpapahiwatig na hindi na nila itinuloy o ipinahayag ang balak na makidigma.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: sasalakayin ang mga ito sa digmaan
  rationale: Ang Hebreong “umahon/lumaban laban sa kanila para sa hukbo/digmaan” ay isang idyomang militar; ang “sasalakayin ... sa digmaan” ay malinaw at likas sa modernong Tagalog.
- source_word: לְשַׁחֵת אֶת הָאָרֶץ
  choice: upang wasakin ang lupain
  rationale: Isinasalin ang layuning infinitive bilang “upang wasakin” at ang אֶרֶץ bilang teritoryal na “lupain.”
- source_word: יֹשְׁבִים בָּהּ
  choice: tinitirhan
  rationale: Likas na Tagalog para sa nagpapatuloy na paninirahang ipinahihiwatig ng Hebreong participle.
