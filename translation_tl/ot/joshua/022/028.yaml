  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: tl
  text: Kaya sinabi namin, “Kung sa hinaharap ay may sabihin sila sa amin o sa mga susunod naming salinlahi, sasabihin namin, ‘Tingnan ninyo ang wangis[a] ng altar ni Yahweh na ginawa ng aming mga ninuno—hindi para sa handog na sinusunog at hindi para sa hain, kundi saksi ito sa pagitan namin at ninyo.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anyo,” “huwaran,” “modelo,” o “kopya.” Tumutukoy ang salitang Hebreo sa anyo o pagkakahawig ng altar; ang altar na ito ay ginawa bilang saksi, hindi upang paghandugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Kaya sinabi namin
  rationale: Isinusulong ng waw-consecutive ang salaysay at, ayon sa konteksto, ipinakikita rin ang bunga o paliwanag; natural itong naihahatid ng “Kaya sinabi namin.”
- source_word: וְהָיָה כִּי
  choice: Kung sa hinaharap ay
  rationale: Ipinakikilala ng idyoma ang isang maaaring mangyari sa hinaharap; pinananatili ng “kung” ang kondisyonal na diwa.
- source_word: יֹאמְרוּ אֵלֵינוּ וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: sabihin nila ito sa amin o sa mga susunod naming salinlahi
  rationale: Ang מָחָר ay tumutukoy rito sa panahong darating, hindi lamang sa literal na kinabukasan; ang דֹּרֹת ay pinanatiling “mga salinlahi.” Ang “o” ay natural na naghahayag ng mga posibleng kausap sa sitwasyong inilalarawan.
- source_word: וְאָמַרְנוּ
  choice: sasabihin namin
  rationale: Ito ang tugon sa loob ng ipinapalagay na pangyayari sa hinaharap.
- source_word: רְאוּ
  choice: Tingnan ninyo
  rationale: Natural na makabagong Filipino para sa pangmaramihang pautos na humihiling ng pansin.
- source_word: תַּבְנִית
  choice: wangis
  rationale: Ang salita ay maaaring mangahulugang anyo, huwaran, modelo, o kopya. Ang “wangis” ay nagpapahiwatig ng pagkakahawig o representasyon nang hindi ipinapalagay na ito mismo ang awtorisadong altar para sa paghahain.
- source_word: מִזְבַּח יְהוָה
  choice: altar ni Yahweh
  rationale: Direktang inilalarawan ang altar na kinakatawan, habang pinananatili ang personal na pangalang Yahweh.
- source_word: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ
  choice: na ginawa ng aming mga ninuno
  rationale: Sa kontekstong ito, ang “mga ninuno” ang natural at malinaw na Filipino para sa kolektibong אָבוֹתֵינוּ at hindi nito binabago ang sanggunian sa naunang henerasyon.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: hindi para sa handog na sinusunog at hindi para sa hain
  rationale: Pinananatili ang inuulit na pagtanggi na לֹא...וְלֹא para sa diin. Tinutukoy nang espesipiko ng עֹלָה ang handog na sinusunog, samantalang mas pangkalahatan ang זֶבַח.
- source_word: כִּי עֵד הוּא
  choice: kundi saksi ito
  rationale: Ipinakikita ng כִּי ang tunay na layunin bilang pagsalungat sa hindi nito layunin; pinananatili ng “saksi ito” ang tahasang predikasyon ng Hebreo.
- source_word: בֵּינֵינוּ וּבֵינֵיכֶם
  choice: sa pagitan namin at ninyo
  rationale: Direkta at natural na salin ng ugnayang ipinahahayag ng parirala; malinaw sa “ninyo” ang pangmaramihang kausap.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Papel ng itinayong altar
  choice: wangis at saksi, hindi altar na ginagamit sa paghahain
  alternative: ang mismong awtorisadong altar para sa paghahain
  rationale: Malinaw na itinatanggi ng talata ang gamit nito para sa handog na sinusunog at hain, at tahasang tinatawag itong saksi. Hindi na higit pang tinutukoy ng salin ang eksaktong legal o ritwal na katayuan nito.
- issue: Saklaw ng אֲבוֹתֵינוּ
  choice: aming mga ninuno
  alternative: aming mga ama
  rationale: Maaaring literal na isalin na “mga ama,” ngunit sa kolektibong makasaysayang gamit, malinaw at natural sa modernong Filipino ang “mga ninuno,” nang hindi nagdaragdag ng doktrinal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” “handog na sinusunog,” at “hain” bilang madaling maunawaang bokabularyong biblikal. Pinanatili ang dobleng pagtanggi at ang pahayag na “saksi ito” upang mapanatili ang diin at estruktura ng Hebreo.
