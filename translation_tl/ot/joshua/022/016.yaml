  source_fidelity: Ang salin ay wastong kumikilala sa mga pangunahing elemento—ang buong kapulungan, Yahweh, ang Diyos ng Israel, altar, at paghihimagsik. Gayunman, hinahati nito ang iisang patanong na paratang sa Hebreo sa isang tanong at dalawang pahayag na nasa nakaraang panahon. Dahil dito, nababawasan ang ugnayan ng mga infinitive sa paratang at ang retorikal na diin ng talata.
  naturalness: Marangal at karaniwang nauunawaan ang Tagalog, ngunit mas natural at mas malapit sa sintaksis ng pinagmulan ang pagpapanatili sa lahat ng paratang sa loob ng iisang tanong. Ang “sa pamamagitan ng pagtatayo ninyo ... upang maghimagsik” ay malinaw na naghahayag ng kaugnayan nang hindi labis na nilulutas kung paraan, resulta, o layunin ang diin.
  terminology: Ang “kapulungan,” “Yahweh,” “Diyos ng Israel,” at “altar” ay angkop. Ang “paglabag sa katapatan” ay mas tiyak para sa מַעַל kaysa “pagtataksil,” na sa modernong Tagalog ay maaaring magpahiwatig ng personal na pagkakanulo nang higit kaysa paglabag sa tipan o pagsamba.
  issues:
