source:
  edition: WLC
  text: כֹּ֣ה אָמְר֞וּ כֹּ֣ל עֲדַ֣ת יְהוָ֗ה מָֽה הַ/מַּ֤עַל הַ/זֶּה֙ אֲשֶׁ֤ר מְעַלְתֶּם֙ בֵּ/אלֹהֵ֣י יִשְׂרָאֵ֔ל לָ/שׁ֣וּב הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה בִּ/בְנֽוֹתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ לִ/מְרָדְ/כֶ֥ם הַ/יּ֖וֹם בַּ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: tl
  text: 'Ganito ang sinabi ng buong kapulungan ni Yahweh: “Ano itong paglabag sa katapatan na ginawa ninyo laban sa Diyos ng Israel[a], sa pagtalikod ninyo ngayon sa pagsunod kay Yahweh sa pamamagitan ng pagtatayo ninyo ng altar para sa inyo, upang maghimagsik kayo ngayon laban kay Yahweh?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “paglabag sa katapatan” ay maaari ring isaling “pagtataksil” o “kawalang-katapatan.” Ang salitang Hebreo ay tumutukoy lalo na sa paglabag sa katapatan sa tipan o sa wastong pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: Ganito ang sinabi
  rationale: Likas na pormulang Tagalog sa paghahatid ng mensahe; pinananatili ng aspektong naganap ang anyong perfect ng pandiwang Hebreo.
- source_word: כֹּל עֲדַת יְהוָה
  choice: buong kapulungan ni Yahweh
  rationale: Ang “kapulungan” ay dignidad ngunit madaling maunawaang katawagan sa nagkakatipong sambayanan ng tipan; ang pangalang יהוה ay isinaling Yahweh.
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: Ano itong pagtataksil na ginawa ninyo
  rationale: Ang מַעַל ay tumutukoy sa malubhang kawalang-katapatan, lalo na sa tipan o pagsamba. Natural sa Tagalog ang pariralang “pagtataksil na ginawa” at naipahihiwatig nito ang paglabag sa katapatan.
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: laban sa Diyos ng Israel
  rationale: Sa konstruksiyong מעל + ב, ang Diyos ang pinagtaksilan o nilabag; malinaw itong ipinahahayag ng “laban sa.”
- source_word: לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: Tinalikuran ninyo ngayon ang pagsunod kay Yahweh
  rationale: Pinananatili ang idyomang ‘tumalikod mula sa pagsunod’ sa natural na Tagalog at ang diin ng הַיּוֹם, “ngayon.”
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: nang magtayo kayo ng altar para sa inyong sarili
  rationale: Ang בְּ + infinitive ay nagpapahayag ng kalagayan o paraan; ang “nang” ay natural na nag-uugnay sa pagtatayo ng altar at sa pagtalikod.
- source_word: לִמְרָדְכֶם הַיּוֹם בַּיהוָה
  choice: at sa araw na ito ay naghimagsik kayo laban kay Yahweh
  rationale: Ang מרד ay tahasang paghihimagsik, at ang בְּ ay tumutukoy sa pinaghihimagsikan. Pinanatili rin ang ikalawang pagbanggit sa ‘ngayon/sa araw na ito’ para sa retorikal na diin.
theological_decisions:
- issue: Kahulugan ng מַעַל bilang paglabag sa katapatan sa tipan
  choice: pagtataksil
  alternative: kawalang-katapatan; paglabag sa tiwala
  rationale: Ang “pagtataksil” ay may sapat na bigat para sa relihiyoso at pangtipang paglabag nang paliitin ito sa karaniwang kasalanan lamang. Inilalahad sa talababa ang saklaw ng terminong Hebreo.
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng isang titulo.
- issue: Ugnayan ng pagtatayo ng altar sa pagtalikod at paghihimagsik
  choice: Inilahad bilang batayan ng paratang, nang hindi pinatutunayang tama na agad ang paratang
  alternative: Isalin bilang tahasang layuning maghimagsik
  rationale: Ang mga infinitive at pang-ukol ay maaaring magpahiwatig ng paraan, resulta, o layunin. Pinananatili ng salin ang lakas ng paratang ngunit hindi nito nilulutas nang higit sa teksto ang layunin ng mga nagtayo ng altar.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “kapulungan,” “altar,” at “naghimagsik” upang mapanatili ang pormal at pangtipang tono, habang iniwasan ang lipas o labis na teknikal na pananalita. Pinanatili ang pag-uulit ng temporal na diin sa dalawang magkaibang natural na anyo: “ngayon” at “sa araw na ito.”'
