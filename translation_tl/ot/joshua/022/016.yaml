    issue: Nabago ang iisang tanong na paratang tungo sa magkakahiwalay na pahayag.
    rationale: Ang Hebreo ay nagsisimula sa “Ano itong ...?” at ang kasunod na mga infinitive ay nagpapalawak sa paratang. Ang “Tinalikuran ninyo...” at “naghimagsik kayo...” bilang mga nakapag-iisang pahayag ay hindi gaanong tumutugma sa anyo at retorika ng pinagmulan.
  - severity: medium
    issue: Ang “nang magtayo kayo” at “naghimagsik kayo” ay nagtatakda ng nakaraang pangyayari.
    rationale: Ang mga infinitive na may pang-ukol ay maaaring magpahiwatig ng paraan, kalagayan, resulta, o layunin. Ang saling “sa pamamagitan ng pagtatayo ... upang maghimagsik” ay pinananatili ang paratang at ang kaunting sintaktikong kalabuan nang hindi tahasang ipinapakitang tapos na ang paghihimagsik.
  - severity: low
    issue: Ang “pagtataksil” ay mas makitid na katumbas ng מַעַל.
    rationale: Saklaw ng מַעַל ang kawalang-katapatan o paglabag sa katapatan sa tipan, lalo na sa usapin ng pagsamba. Ang “paglabag sa katapatan” ay mas tuwirang naghahatid ng saklaw na ito.
