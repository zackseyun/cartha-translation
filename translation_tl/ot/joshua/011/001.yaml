translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mabalitaan” at “nagpasugo” upang maging likas sa salaysay habang pinananatili ang di-tiyak na bagay na ipinadala. Pinanatili ang karaniwang mga anyo ng pangalan at nilagyan lamang ng talababa ang impormasyong ipinahihiwatig o tekstuwal na pagkakakilanlan.
