base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: tl
  text: Nang mabalitaan ito[a] ni Jabin na hari ng Hazor, nagpadala siya kay Jobab na hari ng Madon, sa hari ng Shimron[b], at sa hari ng Acshaf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, mas pormal: “At nangyari, nang marinig ni Jabin na hari ng Hazor.” Walang tahasang layon ang “marinig”; ang “ito” ay ipinahihiwatig ng naunang salaysay.'
    reason: lexical_alternative
  - marker: b
    text: Iniuugnay ng ilan ang “Shimron” dito sa “Shimron-meron” na binanggit sa Josue 12:20, ngunit “Shimron” lamang ang nakasulat dito sa Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang mabalitaan ito
  rationale: Ang pormulang Hebreo na wayhi + ki + pawatas ay nagpapakilala ng isang pangyayaring kasabay o nauuna sa susunod na kilos. Likas sa makabagong Tagalog ang “Nang mabalitaan” kaysa sa literal na “At nangyari, nang marinig.” Idinagdag ang “ito” bilang ipinahihiwatig na layon mula sa naunang konteksto.
- source_word: יָבִין
  choice: Jabin
  rationale: Karaniwang anyong Filipino ng personal na pangalan; transliterasyon ito at hindi pagsasalin ng pangalan.
- source_word: מֶלֶךְ חָצוֹר
  choice: hari ng Hazor
  rationale: Tuwirang inilalahad ang ugnayang konstruktong Hebreo bilang titulo at pangalan ng lugar.
- source_word: וַיִּשְׁלַח אֶל
  choice: nagpasugo ... kay/sa
  rationale: Ang pandiwang שלח na may אֶל ay nangangahulugang magpadala o magsugo patungo sa isang tao. Ang “nagpasugo” ay likas sa Tagalog at hindi tiyak kung mensahe o mga sugo ang ipinadala, gaya rin ng Hebreo.
- source_word: יוֹבָב מֶלֶךְ מָדוֹן
  choice: Jobab na hari ng Madon
  rationale: Pinananatili ang personal at heograpikong pangalan at likas na iniuugnay sa Tagalog ang titulo sa pamamagitan ng “na.”
- source_word: שִׁמְרוֹן
  choice: Shimron
  rationale: Sinusunod ng pangunahing teksto ang mismong anyo sa tekstong Masoretiko; hindi ito pinalalawak bilang “Shimron-meron.”
- source_word: אַכְשָׁף
  choice: Acshaf
  rationale: Transliterasyong angkop sa ortograpiyang Filipino, kung saan kinakatawan ng “sh” ang tunog na שׁ at ng “f” ang pangwakas na פ.
