translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hukbo” sa pangunahing teksto dahil mas malinaw ito sa kontekstong militar, habang pinanatili sa talababa ang literal na “kampo.” Ang mga gitling na pahaba ay tumutulong upang malinaw na maiugnay ang paglalarawan sa napakalaking pinagsamang puwersa.
