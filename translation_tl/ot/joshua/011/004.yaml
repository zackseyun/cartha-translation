  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: tl
  text: Lumabas sila, kasama ang lahat ng kanilang mga hukbo[a]—isang napakaraming tao[b], sindami ng buhangin sa dalampasigan—na may napakaraming kabayo at karwahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kanilang mga kampo.” Maaari ring tumukoy ang salitang Hebreo sa mga hukbong nakahimpil sa mga kampong iyon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “isang malaking bayan.” Dito, tumutukoy ang parirala sa napakaraming tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Lumabas sila
  rationale: Pinananatili nito ang payak na diwa ng paglabas o paglakad mula sa isang lugar nang hindi nagdaragdag ng tahasang militar na kilos na wala sa pandiwa.
- source_word: מַחֲנֵיהֶם
  choice: kanilang mga hukbo
  rationale: Maaaring tumukoy ang מַחֲנֶה sa kampo o sa hukbong nakahimpil doon. Sa konteksto ng magkakasamang hari at digmaan, mas natural sa modernong Tagalog ang “mga hukbo,” habang inilalagay sa talababa ang literal na larawan ng mga kampo.
- source_word: עַם רָב
  choice: isang napakalaking karamihan
  rationale: Bagaman literal na “isang malaking bayan/sambayanan,” ang עַם dito ay tumutukoy sa napakaraming taong nagtipon para sa digmaan. Inihahayag ng “karamihan” ang bilang nang natural at hindi ipinahihiwatig na iisa silang etnikong bayan.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: sindami ng buhangin sa dalampasigan
  rationale: Likas na idyomang Tagalog ito para sa paghahambing ng napakalaking bilang at pinananatili ang kongkretong larawan ng tekstong Hebreo.
- source_word: סוּס
  choice: mga kabayo
  rationale: Kolektibong isahan ang anyong Hebreo; ang maramihan ang natural sa Tagalog sa talaan ng kagamitang militar.
- source_word: רֶכֶב
  choice: mga karwahe
  rationale: Ang רֶכֶב ay maaaring tumukoy sa mga karwahe o sa puwersang gumagamit ng mga ito. “Mga karwahe” ang malinaw at tuwirang salin sa kontekstong ito.
- source_word: רַב מְאֹד
  choice: napakarami
  rationale: Tumpak nitong ipinahahayag ang matinding dami ng mga kabayo at karwahe sa natural na modernong Tagalog.
