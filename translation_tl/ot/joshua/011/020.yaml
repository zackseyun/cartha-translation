base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Sapagkat si Yahweh ang nagpatigas ng kanilang mga puso[a] upang harapin nila ang Israel sa labanan, upang italaga niya sila sa pagkapuksa[b], upang walang kahabagan para sa kanila,[c] kundi upang lipulin niya sila, gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “palakasin ang kanilang mga puso.” Dito, ang diwa ay ginawa silang matatag sa kanilang pagtutol—samakatuwid, pinatigas ang kanilang mga puso.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay teknikal na tumutukoy sa pagtatalaga ng isang tao o bagay sa pagkapuksa bilang paghatol; maaari ring isalin na “lubusang lipulin” o “ilagay sa ilalim ng pagbabawal.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “walang pabor para sa kanila” o “walang pagsusumamo para sa kanila.” Maikli ang pariralang Hebreo at maaaring tumukoy sa kawalan ng kahabagan o sa kawalan ng pagsusumamong humihingi nito.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: si Yahweh ang
  rationale: Ipinahahayag ng parirala na kay Yahweh nagmula ang pagkilos. Ang tuwirang ayos na ito ay natural sa modernong Tagalog at hindi pinahihina ang tahasang banal na pagkilos sa talata.
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: nagpatigas ng kanilang mga puso
  rationale: Bagaman ang חזק ay karaniwang nangangahulugang ‘palakasin,’ sa kontekstong ito ang pagpapatatag sa kanilang pagtutol ay idiomatikong ‘pagpapatigas’ ng puso. Inilalagay sa talababa ang mas literal na alternatibo.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: upang harapin nila ang Israel sa labanan
  rationale: Malinaw at natural na ipinapakita nito ang pakikipagsagupa nila sa Israel sa digmaan.
- source_word: לְמַעַן הַחֲרִימָם
  choice: nang sa gayon ay italaga niya sila sa pagkapuksa
  rationale: Pinananatili ng ‘italaga ... sa pagkapuksa’ ang teknikal na diwa ng חרם—paglalagay sa ilalim ng pagbabawal o pagtatalaga sa paghatol—sa halip na gawin lamang itong pangkalahatang paglipol.
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: at walang awa para sa kanila
  rationale: Pinananatili ang maikli at bahagyang malabong anyo ng Hebreo. Ang תְּחִנָּה ay maaaring tumukoy sa awa o pabor, o sa pagsusumamong humihingi nito.
- source_word: כִּי לְמַעַן הַשְׁמִידָם
  choice: kundi lipulin niya sila
  rationale: Ang שמד ay matinding salita para sa pagwasak o paglipol. Ang ‘kundi’ ay nagpapakita ng pagsalungat sa kawalan ng awa nang hindi dinaragdagan ang teksto.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Natural na Tagalog ito para sa pagkakatugma ng nangyari sa naunang utos kay Moises.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagpapatigas ng puso ng mga hari
  choice: 'Tahasan: ‘si Yahweh ang nagpatigas ng kanilang mga puso’'
  alternative: Pinahintulutan ni Yahweh na tumigas ang kanilang mga puso
  rationale: Tuwirang iniuugnay ng Hebreo kay Yahweh ang pagpapatigas. Hindi ito pinahina tungo sa pahintulot lamang; pinananatili ang tensiyon sa pagitan ng banal na pagkilos at ng aktuwal na pakikipagdigma ng mga hari.
- issue: Ang teknikal na kahulugan ng חרם
  choice: ‘italaga niya sila sa pagkapuksa’ sa pangunahing teksto
  alternative: ‘lubusan niya silang lipulin’ o ‘ilagay sila sa ilalim ng pagbabawal’
  rationale: Pinananatili nito ang natatanging kategorya ng pagtatalaga sa mapanghatol na pagkapuksa, samantalang ipinapaliwanag sa talababa ang mga posibleng katumbas.
- issue: Ang kahulugan ng תְּחִנָּה
  choice: ‘walang awa para sa kanila’ na may talababa tungkol sa ‘pagsusumamo’
  alternative: ‘walang pagsusumamo para sa kanila’ o ‘hindi sila kahahabagan’
  rationale: Sadyang maikli ang Hebreo at maaaring tumukoy sa awa/pabor o sa paghingi nito. Ang salin at talababa ay nagpapanatili sa saklaw na ito nang hindi tiyakang pinapangalanan kung sino ang magsusumamo o magkakaloob ng awa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Yahweh” ayon sa consultation layer. Iniwasan ang labis na teknikal na pananalita sa pangunahing teksto, habang inilagay sa mga talababa ang mahahalagang alternatibong leksikal at ang tunay na kalabuan ng Hebreo.
