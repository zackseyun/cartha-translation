revisions:
- from: Sapagkat si Yahweh ang nagpatigas ng kanilang mga puso[a] upang harapin nila ang Israel sa labanan, nang sa gayon ay italaga niya sila sa pagkapuksa[b] at walang awa para sa kanila,[c] kundi lipulin niya sila, gaya ng iniutos ni Yahweh kay Moises.
  to: Sapagkat si Yahweh ang nagpatigas ng kanilang mga puso[a] upang harapin nila ang Israel sa labanan, upang italaga niya sila sa pagkapuksa[b], upang walang kahabagan para sa kanila,[c] kundi upang lipulin niya sila, gaya ng iniutos ni Yahweh kay Moises.
