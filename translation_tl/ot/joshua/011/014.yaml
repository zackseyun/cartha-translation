  text: וְ֠/כֹל שְׁלַ֞ל הֶ/עָרִ֤ים הָ/אֵ֨לֶּה֙ וְ/הַ/בְּהֵמָ֔ה בָּזְז֥וּ לָ/הֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֣ק אֶֽת כָּל הָ/אָדָ֞ם הִכּ֣וּ לְ/פִי חֶ֗רֶב עַד הִשְׁמִדָ/ם֙ אוֹתָ֔/ם לֹ֥א הִשְׁאִ֖ירוּ כָּל נְשָׁמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: tl
  text: At ang lahat ng nasamsam mula sa mga lunsod na ito, pati ang mga alagang hayop, ay kinuha ng mga anak ni Israel bilang samsam para sa kanilang sarili. Ngunit pinatay nila sa talim ng espada ang lahat ng tao hanggang sa malipol nila ang mga ito. Wala silang iniwang sinumang humihinga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Wala silang iniwang anumang humihinga” o “Wala silang iniwang buháy na may hininga.” Ang salitang Hebreo ay kaugnay ng “hininga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַל הֶעָרִים הָאֵלֶּה
  choice: lahat ng nasamsam mula sa mga lunsod na ito
  rationale: Ang שְׁלַל ay mga ari-ariang kinuha sa digmaan. Likas sa Tagalog ang nominal na “mga nasamsam,” at malinaw na ang mga ito ay mula sa mga lunsod na tinutukoy.
- source_word: הַבְּהֵמָה
  choice: mga alagang hayop
  rationale: Sa konteksto ng pananakop, tumutukoy ito sa mga domestikadong hayop na maituturing na pag-aari; mas tiyak ito kaysa sa pangkalahatang “mga hayop.”
- source_word: בָּזְזוּ לָהֶם
  choice: kinuha ... para sa kanilang sarili
  rationale: Ipinapahayag ng pandiwa ang pagkuha bilang samsam, habang pinananatili ng “para sa kanilang sarili” ang benepaktibong diwa ng לָהֶם.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na pananalitang pampamilya sa Hebreo at likas pa ring katawagan sa dignified na Tagalog.
- source_word: כָּל הָאָדָם
  choice: lahat ng tao
  rationale: Ang kolektibong אָדָם ay tumutukoy sa buong populasyong tao bilang kaibahan sa mga alagang hayop, hindi lamang sa mga lalaking nasa hustong gulang.
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: pinatay nila sa talim ng espada
  rationale: Ang literal na “bibig ng espada” ay isang idyomang Hebreo. Ang “sa talim ng espada” ay nagpapanatili sa larawan, at ang “pinatay” ay malinaw na naaayon sa konteksto.
- source_word: עַד הִשְׁמִדָם אוֹתָם
  choice: hanggang sa malipol ang mga ito
  rationale: Tuwirang inilalarawan ng Hiphil ng שׁמד ang ganap na pagpuksa; hindi idinaragdag ang teknikal na ideya ng ḥerem na wala sa sugnay.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: Wala silang iniwang sinumang humihinga
  rationale: Pinananatili nito ang kongkretong imahen ng נְשָׁמָה, “hininga/bagay na humihinga,” habang natural na ipinahahayag sa Tagalog na walang nakaligtas na tao.
theological_decisions:
- issue: Saklaw ng אָדָם sa populasyong pinatay
  choice: lahat ng tao
  alternative: bawat lalaki
  rationale: Kolektibo ang singular na אָדָם sa kontekstong ito at ikinukumpara sa mga alagang hayop. Ang “lahat ng tao” ay hindi tahimik na naglilimita sa mga lalaking nasa hustong gulang.
- issue: Pagpapanatili sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Nananatiling malinaw sa Tagalog ang literal na katawagang pampamilya at hindi kailangang palitan ng etnikong katawagan.
- issue: Kahulugan ng שׁמד
  choice: malipol
  alternative: italaga sa ganap na pagwasak
  rationale: Ang talata ay gumagamit ng שׁמד, hindi ng terminong ḥerem; kaya iniiwasang ipasok ang isang mas teknikal na teolohikal na konsepto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lunsod” at “espada” bilang pamilyar na biblikal ngunit kasalukuyang nauunawaang mga salita. Hinati sa tatlong pangungusap upang maging natural ang mabigat na sintaks ng Hebreo nang hindi binabago ang pagkakasunod ng mga pangyayari.
