  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa, kabilang ang pagkakaiba ng mga alagang hayop at populasyong tao at ang pangwakas na pahayag na walang iniwang humihinga. Gayunman, ang “kinuha” ay mas mahina kaysa sa pandiwang Hebreo para sa pagsamsam/plunder, at ang pasibong “malipol ang mga ito” ay bahagyang nagpapalabo sa kilos ng mga anak ni Israel na malinaw sa Hebreo.
  naturalness: Malinaw at marangal ang Tagalog. Mas natural at mas tiyak ang “kinuha nila bilang samsam,” at ang “hanggang sa malipol nila ang mga ito” ay nagpapanatili ng malinaw na tagaganap nang hindi nagiging di-likas.
  terminology: Ang “mga anak ni Israel,” “mga lunsod,” “mga alagang hayop,” at “talim ng espada” ay angkop. Pinananatili ang “lahat ng tao” para sa kolektibong אָדָם at hindi ipinapasok ang terminong ḥerem.
  issues:
