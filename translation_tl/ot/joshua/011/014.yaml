    issue: Mahina ang “kinuha” para sa בָּזְזוּ.
    rationale: Ang pandiwa ay tumutukoy sa pagkuha bilang samsam sa digmaan. Ang “kinuha nila bilang samsam” ay malinaw na naghahatid ng aspektong ito, samantalang iniiwasan ang paulit-ulit na “sinamsam” kasunod ng “nasamsam.”
  - severity: low
    issue: Malabo ang tagaganap sa “hanggang sa malipol ang mga ito.”
    rationale: 'Ang Hebreo ay may aktibong tagaganap: pinuksa sila ng mga anak ni Israel. Ang aktibong Tagalog ay mas tapat sa sintaks at mas malinaw.'
  - severity: low
    issue: Hindi ganap na likas ang alternatibong salin sa talababa.
    rationale: Ang “buháy na anumang humihinga” ay alanganin ang ayos. Maaaring ilahad ang alternatibo nang mas likas habang pinananatili ang imahen ng hininga.
