  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
translation:
  language: tl
  text: Ngunit hindi sinunog ng Israel ang alinman sa mga lungsod na nakatayo sa kani-kanilang bunton[a], maliban sa Hazor lamang; sinunog iyon ni Josue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kani-kanilang tel”—samakatuwid, sa mga bunton ng pamayanan na nabuo sa magkakasunod na sapin ng paninirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Ipinahahayag ang pagsalungat at ang pagbubukod kaugnay ng naunang salaysay; natural ito sa makabagong Tagalog.
- source_word: כָּל הֶעָרִים ... לֹא שְׂרָפָם
  choice: hindi sinunog ... ang alinman sa mga lunsod
  rationale: Sa ilalim ng pagtanggi, malinaw at natural na ipinahahayag ng “alinman” ang distributibong diwa ng Hebrew.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: na nakatayo sa kani-kanilang bunton
  rationale: Pinananatili ng “nakatayo” ang larawang nasa participle, at ng “kani-kanilang bunton” ang diwa ng mga lunsod na nasa mga bunton ng paninirahan.
- source_word: זוּלָתִי אֶת חָצוֹר לְבַדָּהּ
  choice: maliban sa Hazor lamang
  rationale: Tuwirang ipinakikita ang Hazor bilang nag-iisang eksepsiyon.
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: sinunog iyon ni Josue
  rationale: Pinananatili ang pag-uulit ng pandiwang “sinunog,” samantalang ang “iyon” ay natural na tumutukoy sa Hazor.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
