  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang hanay ng utos mula kay Yahweh tungo kay Moises at mula kay Moises tungo kay Josue, gayundin ang ganap na pagsunod ni Josue. Gayunman, ang ayos ng unang sugnay ay maaaring pansamantalang magpalabo kung ang “na lingkod niya” ay kaugnay ni Moises o ng iniutos. Mas malinaw ang paggamit ng kuwit at ng “kanyang lingkod.”
  naturalness: Makabago at marangal ang register, ngunit mas natural at tuwiran sa Filipino ang “Wala siyang kinaligtaan” kaysa “Wala siyang iniwang hindi natupad.” Iniiwasan din nito ang bahagyang di-likas na pasibong “hindi natupad,” na maaaring magmungkahi na ang utos mismo ang hindi naganap sa halip na hindi ito sinunod ni Josue.
  terminology: Ang “Yahweh,” “Moises,” “Josue,” at “lingkod” ay angkop. Pinananatili ng “iniutos” ang awtoridad ng Hebreong צִוָּה at ng “gayon din” ang paralelong pagbuo ng pangungusap.
  issues:
