base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: tl
  text: Kung paanong iniutos ni Yahweh kay Moises, na kanyang lingkod, gayon din ang iniutos ni Moises kay Josue, at gayon nga ang ginawa ni Josue. Wala siyang kinaligtaan sa lahat ng iniutos ni Yahweh kay Moises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Hindi niya inalis ang isang bagay mula sa lahat ng iniutos ni Yahweh kay Moises”; maaari ring isalin, “Wala siyang iniwang hindi natupad sa lahat ng iniutos ni Yahweh kay Moises.”
    reason: Ipinapakita ang literal na Hebreong idyoma at ang isang natural na alternatibong salin.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kung paanong
  rationale: Likas na panandang Filipino para sa tahasang pagtutulad ng iniutos ni Yahweh kay Moises at ng iniutos ni Moises kay Josue.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ipinananatili ang awtoritatibong diwa ng pandiwa at ang magkakaugnay na utos sa talata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: עַבְדּוֹ
  choice: lingkod niya
  rationale: Sa marangal at tipanang paglalarawan kay Moises, ang 'lingkod' ay natural at hindi labis na nagtatampok ng kalagayang pagkaalipin.
- source_word: כֵּן
  choice: gayon din / gayon nga
  rationale: Pinananatili ang pag-uulit at pagkakatugma ng utos at pagsunod, habang ginagawang likas ang daloy sa Filipino.
- source_word: עָשָׂה
  choice: ang ginawa
  rationale: Pinananatili ang malawak at payak na diwa ng pandiwa; nililinaw ng kasunod na pangungusap ang ganap na pagsunod.
- source_word: לֹא הֵסִיר דָּבָר
  choice: Wala siyang iniwang hindi natupad
  rationale: Natural na ipinahahayag sa Filipino ang idyomang tumutukoy sa hindi pagkakaltas o pagpapabaya sa anumang iniutos.
- source_word: מִכֹּל אֲשֶׁר
  choice: sa lahat ng
  rationale: Ipinahahayag ang kabuuan ng mga iniutos at ang saklaw ng ganap na pagsunod ni Josue.
theological_decisions:
- issue: Paglalarawan sa ganap na pagsunod ni Josue
  choice: Wala siyang iniwang hindi natupad
  alternative: Wala siyang inalis na anuman
  rationale: Ipinakikita ng konteksto na ang Hebreong idyoma ay tumutukoy sa hindi pagpapabaya sa alinmang iniutos. Pinananatili sa talababa ang mas literal na anyo nang hindi ipinipilit na ang 'pag-alis' ay pisikal.
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreong teksto; pinananatili ito bilang 'Yahweh' sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Josue,' ang karaniwang anyong Filipino ng pangalan. Pinanatili ang paghahambing at pag-uulit ng Hebreo nang hindi nagiging mabigat ang pangungusap.
