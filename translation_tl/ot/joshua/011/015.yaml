  to: Kung paanong iniutos ni Yahweh kay Moises, na kanyang lingkod, gayon din ang iniutos ni Moises kay Josue, at gayon nga ang ginawa ni Josue. Wala siyang kinaligtaan sa lahat ng iniutos ni Yahweh kay Moises.[a]
  rationale: Ang rebisyon ay paglilinaw lamang ng sintaks at pagpapalit sa mas natural na Filipino ng idyomatikong pahayag para sa lubos na pagsunod. Hindi nito binabago ang kahulugan, ang pag-uulit ng Hebreo, o ang paggamit ng pangalang Yahweh.
