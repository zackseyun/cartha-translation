  text: וַ֠/יַּכּוּ אֶת כָּל הַ/נֶּ֨פֶשׁ אֲשֶׁר בָּ֤/הּ לְ/פִי חֶ֨רֶב֙ הַֽחֲרֵ֔ם לֹ֥א נוֹתַ֖ר כָּל נְשָׁמָ֑ה וְ/אֶת חָצ֖וֹר שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: tl
  text: Pinatay nila sa talim ng tabak ang bawat taong naroon at itinalaga silang lahat sa pagkapuksa[a]. Wala ni isang may hiningang nilalang ang natira[b], at sinunog niya[c] sa apoy ang lungsod ng Hazor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lubusang nilipol silang lahat.” Ginagamit dito ng Hebreo ang חרם (ḥerem), na tumutukoy sa pagtatalaga sa ganap na pagkapuksa.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “walang anumang hiningang natira”—isang idyomang nangangahulugang walang nakaligtas.
    reason: lexical_alternative
  - marker: c
    text: Lumilipat ang Hebreo mula sa maramihan (“pinatay nila”) tungo sa isahan (“sinunog niya”); malamang na si Josue ang tinutukoy sa huling sugnay.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: Pinatay nila
  rationale: Ang Hifil ng נכה sa konteksto ng digmaan ay tumutukoy sa pagpapabagsak o pagpatay. Natural at malinaw sa modernong Filipino ang “pinatay” habang pinananatili ang maramihang simuno.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: ang bawat taong naroon
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa mga taong buhay sa loob ng lungsod, hindi sa hiwalay na di-materyal na “kaluluwa.”
- source_word: לְפִי חֶרֶב
  choice: sa talim ng tabak
  rationale: Ito ang natural na katumbas ng idyomang Hebreo na literal na “sa bibig ng tabak,” at pinananatili nito ang matingkad na larawang militar.
- source_word: הַחֲרֵם
  choice: itinalaga silang lahat sa pagkapuksa
  rationale: Pinananatili ng salin ang natatanging diwa ng חרם—pagtatalaga sa pagkapuksa—sa halip na gawing pangkalahatang pahayag lamang na “lubusang nilipol.”
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: Wala ni isang may hiningang natira
  rationale: Pinananatili nito ang larawang nakaugat sa “hininga” at malinaw na ipinahahayag na walang nakaligtas.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Ginamit ang nakagawiang anyo ng pangalan ng lugar sa mga saling biblikal.
- source_word: שָׂרַף בָּאֵשׁ
  choice: sinunog niya sa apoy
  rationale: Pinananatili ang isahang pandiwa at ang tahasang pagbanggit sa apoy, gaya ng Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa חרם sa salaysay ng pananakop
  choice: itinalaga silang lahat sa pagkapuksa
  alternative: lubusang nilipol silang lahat; isinailalim silang lahat sa pagbabawal
  rationale: 'Ipinahihiwatig ng חרם ang higit pa sa karaniwang pagpatay: pagtatalaga ng isang bagay o mga tao sa ganap na pagkapuksa. Pinananatili ng salin ang bigat na ito nang hindi nagdaragdag ng paliwanag na sektaryan o doktrinal.'
- issue: Paglipat ng simuno mula maramihan tungo sa isahan
  choice: Pinatay nila … sinunog niya
  alternative: Pinatay nila … sinunog nila
  rationale: Maramihan ang וַיַּכּוּ ngunit isahan ang שָׂרַף. Pinanatili ang pagbabagong ito; malamang na si Josue ang tinutukoy ng “niya,” ngunit hindi idinagdag ang pangalan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabak” at “pagkapuksa” upang mapanatili ang biblikal na bigat nang hindi nagiging lipas o labis na teknikal; pinanatili rin ang tunay na pagbabago ng bilang ng simuno sa Hebreo.
