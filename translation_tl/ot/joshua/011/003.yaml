base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: tl
  text: ang mga Cananeo sa silangan at sa kanluran[a], ang mga Amoreo, Heteo, Perezeo, at Jebuseo sa kaburulan, at ang mga Hiveo sa ibaba ng Hermon, sa lupain ng Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “at mula sa dagat”; malamang na heograpikong katawagan dito ang “dagat” para sa kanluran.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: ang mga Cananeo
  rationale: Ang isahang pangalang-etniko na may pantukoy ay kolektibo sa Hebreo; natural sa modernong Tagalog ang maramihang anyo para sa isang pangkat ng mga tao.
- source_word: מִמִּזְרָח
  choice: sa silangan
  rationale: Bagaman literal na may diwang “mula sa,” lokatibo ang gamit nito sa heograpikong talaan at katapat ng kasunod na direksiyon.
- source_word: וּמִיָּם
  choice: at sa kanluran
  rationale: Ang “dagat” ay karaniwang heograpikong katawagan sa kanluran dahil naroon ang Mediteraneo; nililinaw ng salin ang direksiyon habang inilalagay sa talababa ang literal na anyo.
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: ang mga Amoreo, Heteo, Perezeo, at Jebuseo
  rationale: Kolektibong isahan ang bawat katawagang-etniko sa Hebreo; ginawang maramihan sa Tagalog para sa likas at malinaw na pagtukoy sa mga bayan.
- source_word: בָּהָר
  choice: sa kaburulan
  rationale: Tumutukoy ito sa mataas o maburol na rehiyon, hindi kinakailangang sa matataas na bundok; “kaburulan” ang likas na heograpikong katawagan.
- source_word: הַחִוִּי
  choice: ang mga Hiveo
  rationale: Kolektibong isahan sa Hebreo, ngunit natural na maramihan sa Tagalog bilang pangalan ng isang pangkat.
- source_word: תַּחַת חֶרְמוֹן
  choice: sa paanan ng Hermon
  rationale: Spatial ang תַּחַת at tumutukoy sa lugar sa ibaba o sa mababang dalisdis ng Hermon; natural at tiyak sa Tagalog ang “sa paanan.”
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: sa lupain ng Mizpa
  rationale: Ang אֶרֶץ ay teritoryo o lupain, at ang Mizpa ay pinanatiling pangalang-pook.
