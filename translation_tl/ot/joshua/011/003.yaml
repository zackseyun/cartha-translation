  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maramihang anyo ng mga pangalang-etniko dahil kolektibo ang isahang anyo sa Hebreo at mas natural ito sa Filipino. Pinanatili ang sunod-sunod na estruktura ng talaan.
