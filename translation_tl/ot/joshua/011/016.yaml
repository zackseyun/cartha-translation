  naturalness: Malinaw at angkop sa modernong Tagalog ang listahan ng mga rehiyon. Ang “Kinuha ni Josue” ay natural sa marangal na rehistro ng salaysay-bibliya.
  terminology: Ang “kabundukan,” “Negev,” “Araba,” at “mababang lupain” ay angkop. Dapat gawing hindi kategoryikal ang paliwanag sa Goshen, sapagkat ang pangunahing teksto ay hindi tahasang nagbibigay ng pagkakakilanlan nito.
