  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: tl
  text: 'Kinuha ni Josue ang buong lupaing ito: ang kabundukan, ang buong Negev[a], ang buong lupain ng Goshen[b], ang mababang lupain[c], ang Araba[d], ang kabundukan ng Israel, at ang mababang lupain nito[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Negev” ay ang tuyong rehiyon sa timog; maaari ring isaling “katimugang lupain.”
    reason: lexical_alternative
  - marker: b
    text: Ang Goshen dito ay malamang na isang rehiyon sa Canaan, hindi kinakailangang ang Goshen sa Ehipto.
    reason: cultural_note
  - marker: c
    text: O “Shefela.” Ito ang mababang rehiyong maburol sa pagitan ng gitnang kabundukan at kapatagang baybayin.
    reason: lexical_alternative
  - marker: d
    text: Ang “Araba” ay katawagang pangheograpiya para sa bahagi ng mahabang lambak o tuyong kapatagan; isinasalin din itong “Lambak ng Jordan” o “kapatagang disyerto,” depende sa konteksto.
    reason: lexical_alternative
  - marker: e
    text: Ang “nito” ay malamang na tumutukoy sa kabundukan ng Israel.
    reason: referent_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nasakop
  rationale: Ang literal na diwa ay “kinuha,” ngunit sa buod na ito ng digmaan, malinaw na ang tinutukoy ay pagsakop sa lupain. Mas natural sa modernong Tagalog ang “nasakop” at hindi nito ipinahihiwatig na ganap nang napanahanan o napamahalaan ang bawat bahagi.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: ang buong lupaing ito
  rationale: Pinananatili nito ang lawak ng כָּל, ang pangheograpiyang diwa ng אֶרֶץ, at ang pantukoy na הַזֹּאת.
- source_word: הָהָר
  choice: ang kabundukan
  rationale: Sa konteksto ng Josue, tumutukoy ito sa mataas na rehiyon, hindi lamang sa isang bundok. Natural at malinaw ang “kabundukan” bilang pangalang panrehiyon.
- source_word: הַנֶּגֶב
  choice: ang buong Negev
  rationale: Ang Negev ay kinikilalang pangalang pangheograpiya. Pinananatili rin ng “buong” ang כָּל na tahasang kasama nito sa Hebreo.
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: ang buong lupain ng Goshen
  rationale: Tuwirang inilalarawan ng pariralang Hebreo ang teritoryo ng Goshen; pinananatili ng “buong” ang kasamang כָּל.
- source_word: הַשְּׁפֵלָה
  choice: ang mababang lupain
  rationale: Ang שְׁפֵלָה ay mababang rehiyon o paanan ng mga burol sa pagitan ng kabundukan at kapatagang baybayin. Ang saling ito ay mas madaling maunawaan kaysa transliterasyong “Shefela.”
- source_word: הָעֲרָבָה
  choice: ang Araba
  rationale: Isa itong katawagang pangrehiyon. Pinananatili ng transliterasyon ang saklaw nito at iniiwasang paliitin ito sa “Lambak ng Jordan” lamang.
- source_word: הַר יִשְׂרָאֵל
  choice: ang kabundukan ng Israel
  rationale: Ang הַר ay may panrehiyong diwa rito, gaya ng naunang הָהָר, kaya “kabundukan” ang angkop.
- source_word: וּשְׁפֵלָתוֹ
  choice: at ang mababang lupain nito
  rationale: Pinananatili ng “nito” ang panghalip na hulapi sa Hebreo at ang kaugnayan nito sa naunang “kabundukan ng Israel,” nang hindi dinaragdagan ang teksto.
