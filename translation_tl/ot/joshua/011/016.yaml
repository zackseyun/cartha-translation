translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Josue,” ang nakasanayang anyo ng pangalang Joshua sa Tagalog. Pinanatili bilang mga pangalang pangrehiyon ang Negev at Araba, habang isinalin nang pagpapakahulugan ang mga karaniwang katawagang topograpiko.
