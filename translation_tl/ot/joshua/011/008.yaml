  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: tl
  text: At ibinigay ni Yahweh ang mga ito sa kamay ng Israel. Nilupig sila ng mga Israelita at hinabol hanggang sa Dakilang Sidon, hanggang sa Misrefot-maim[a], at hanggang sa Lambak ng Mizpa sa silangan. Nilupig nila ang mga ito. Wala silang iniwang kahit isang nakaligtas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Misrefot-maim ay pangalan ng lugar; maaaring ang kahulugan ng Hebreo ay “mga pagsunog sa tubig.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, isahan ang pandiwang “iniwan”: “hanggang sa wala siyang iniwang nakaligtas.” Maaaring kolektibong tumukoy ang isahang anyo sa Israel, o tumukoy kay Josue bilang kinatawan nito.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: ibinigay sila ... sa kamay ng Israel
  rationale: Pinananatili ang Hebreong larawan ng pagbibigay sa kamay, isang idyoma para sa pagpapasailalim sa kapangyarihan ng Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyon ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: tinalo sila / pinuksa nila ang mga ito
  rationale: Sa konteksto ng labanan, ang נכה ay maaaring tumukoy sa pagdaig o pagpatay. Ang unang paglitaw ay isinaling 'tinalo' sapagkat sumunod pa ang pagtugis; ang ikalawa ay 'pinuksa' dahil nililinaw ng kasunod na parirala na walang natirang nakaligtas.
- source_word: וַיִּרְדְּפוּם
  choice: hinabol
  rationale: Likas at tuwirang makabagong Tagalog para sa pagtugis sa tumatakas na kaaway.
- source_word: צִידוֹן רַבָּה
  choice: Dakilang Sidon
  rationale: Pinananatili ang pang-uri sa pangalan ng lungsod sa isang dignified at natural na anyong Tagalog.
- source_word: מִשְׂרְפוֹת מַיִם
  choice: Misrefot-maim
  rationale: Itinuturing itong pangalan ng lugar at isinasalin sa transliterasyon; ang posibleng literal na kahulugan ay inilalagay sa talababa.
- source_word: בִּקְעַת מִצְפֶּה
  choice: Lambak ng Mizpa
  rationale: Ang בִּקְעָה ay isang malawak na lambak o kapatagang-lambak; 'Lambak' ang malinaw at natural na katumbas.
- source_word: מִזְרָחָה
  choice: sa silangan
  rationale: Natural na Tagalog para sa patungong o nasa dakong silangan sa kontekstong heograpiko.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: hanggang sa wala silang iniwang kahit isang nakaligtas
  rationale: Malinaw na ipinahahayag ang ganap na kawalan ng survivor habang ang talababa ay nagpapanatili sa pormal na singular ng pandiwang Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh at hindi pinapalitan ng titulong 'PANGINOON'.
- issue: Paksa ng הִשְׁאִיר sa huling sugnay
  choice: maramihang 'sila' ayon sa kolektibong diwa ng Israel/mga Israelita
  alternative: isahang 'siya,' maaaring tumukoy sa Israel bilang kolektibo o kay Josue bilang kinatawan
  rationale: Pormal na isahan ang pandiwang Hebreo, ngunit maaaring kolektibo ang Israel bilang paksa. Ginawang maramihan ang pangunahing teksto para sa likas na Tagalog at tuloy-tuloy na salaysay, habang pinananatili sa talababa ang tunay na gramatikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyomang 'sa kamay ng Israel,' ngunit ginamit ang 'mga Israelita' sa kasunod na pangungusap upang maging malinaw ang gumagawa ng kilos. Ang mga pangalang pook ay inangkop sa karaniwang bigkas at baybay sa Filipino.
