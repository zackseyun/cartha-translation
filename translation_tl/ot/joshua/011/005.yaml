translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may payak na sintaks na angkop sa pampublikong pagbasa. Ginamit ang “nagkampo” sa halip na mas pormal na “humimpil,” at pinanatili ang “mga tubig ng Merom” upang hindi gawing mas tiyak kaysa sa Hebreong pinagmulan ang anyong heograpikal.
