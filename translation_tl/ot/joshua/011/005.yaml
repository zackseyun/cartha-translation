  text: All these kings met by agreement[a], and they came and encamped together at the waters of Merom to fight against Israel.
translation:
  language: tl
  text: Nagtipon ang lahat ng haring ito ayon sa napagkasunduan[a]. Dumating sila at sama-samang nagkampo sa mga tubig ng Merom upang makipaglaban sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagtipon ayon sa kasunduan” o “sama-samang nagtipon.” Ipinahihiwatig ng pandiwang Hebreo ang isang pagtitipong planado at pinag-ugnay, hindi isang nagkataong pagkikita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲדוּ
  choice: Nagtipon ayon sa napagkasunduan
  rationale: Ipinahihiwatig ng Niphal ng יעד ang pagtitipong pinag-usapan o isinaayos nang maaga, hindi isang di-sinasadyang pagkikita. Likas sa modernong Filipino ang pariralang ito at pinananatili nito ang koordinadong pagkilos ng mga hari.
- source_word: כֹּל הַמְּלָכִים הָאֵלֶּה
  choice: ang lahat ng haring ito
  rationale: Tuwirang pinananatili ang saklaw ng כֹּל at ang demonstratibong puwersa ng הָאֵלֶּה, na tumutukoy sa mga haring kababanggit lamang.
- source_word: וַיָּבֹאוּ
  choice: Dumating sila
  rationale: Ang בוא ay karaniwang pandiwang pasalaysay para sa pagdating; malinaw at natural dito ang “dumating.”
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Ang חנה ay tumutukoy sa pagtatayo o pananatili sa kampo. Ang “nagkampo” ay kasalukuyan, natural, at angkop sa kontekstong militar.
- source_word: יַחְדָּו
  choice: sama-samang
  rationale: Binibigyang-diin nito ang nagkakaisang pagkilos ng magkakaalyadong hari habang nagkakampo.
- source_word: אֶל מֵי מֵרוֹם
  choice: sa may mga tubig ng Merom
  rationale: Pinananatili ang pangmaramihang מֵי bilang “mga tubig” at ipinahahayag ng “sa may” ang lokasyong pinuntahan at pinagkampuhan nang hindi ito ipinapalit sa mas tiyak ngunit wala sa Hebreong “lawa.”
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: upang makipaglaban sa Israel
  rationale: Sa kontekstong militar, ang לחם na may עִם ay adversatibo. Sa Filipino, likas nang nangangahulugang pakikipaglaban laban sa kabilang panig ang “makipaglaban sa Israel,” kaya hindi kailangang dagdagan ng “laban.”
