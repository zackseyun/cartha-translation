base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: tl
  text: Walang lungsod na nakipagpayapaan sa mga Israelita[a], maliban sa mga Hivita na naninirahan sa Gibeon. Kinuha nila ang lahat sa digmaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mga anak na lalaki ng Israel,” isang katawagan sa mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: nakipagpayapaan sa
  rationale: Ang Hiphil ng שׁלם kasama ng אֶל ay tumutukoy rito sa pagpasok sa mapayapang ugnayan o pakikipagkasundo. Likas sa makabagong Filipino ang “nakipagpayapaan sa” at hindi nito labis na tinutukoy na pagsuko ang ginawa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ng Israel,” ang parirala ay pambansang katawagan sa Israel. Ang “mga Israelita” ang malinaw, natural, at hindi nagmumungkahing mga lalaki lamang ang tinutukoy.
- source_word: בִּלְתִּי
  choice: maliban sa
  rationale: Ipinakikilala nito ang tanging eksepsiyon sa naunang pasalungat na pahayag.
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: mga Hivita na naninirahan sa Gibeon
  rationale: Pinananatili ng “naninirahan” ang participial na diwa ng יֹשְׁבֵי sa natural na modernong Filipino.
- source_word: אֶת הַכֹּל
  choice: ang lahat ng iba pa
  rationale: Ang “lahat” ay tumutukoy sa kabuuan ng mga lungsod o bayan na nasa konteksto. Idinagdag ang “iba pa” upang maging malinaw sa Filipino na hindi kasama ang naunang binanggit na eksepsiyon.
- source_word: לָקְחוּ
  choice: sinakop nila
  rationale: Pangkalahatang nangangahulugang “kinuha” ang לקח, ngunit sa kontekstong militar at sa bagay na mga lungsod, ang “sinakop” ang natural na katumbas nang hindi binabago ang pangunahing diwa.
- source_word: בַמִּלְחָמָה
  choice: sa pakikipagdigma
  rationale: Ipinahahayag nito ang paraang militar ng pagkakasakop; natural ito sa Filipino at pinananatili ang lawak ng “sa digmaan/pakikipagdigma.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” bilang natural na pambansang katawagan, habang inilagay sa talababa ang mas literal na anyo. Ang huling sugnay ay ginawang malinaw sa Filipino ngunit may talababa para sa mas literal at bahagyang mas malabong Hebreo.
