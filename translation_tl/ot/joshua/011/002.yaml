id: JOS.11.2
reference: Joshua 11:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְֽ/אֶל הַ/מְּלָכִ֞ים אֲשֶׁ֣ר מִ/צְּפ֗וֹן בָּ/הָ֧ר וּ/בָ/עֲרָבָ֛ה נֶ֥גֶב כִּֽנֲר֖וֹת וּ/בַ/שְּׁפֵלָ֑ה וּ/בְ/נָפ֥וֹת דּ֖וֹר מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/002.yaml
  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: tl
  text: at sa mga haring nasa hilaga—sa kaburulan, sa Araba sa timog ng Kinerot, sa mababang lupain, at sa mga kaitaasan ng Dor[a] sa gawing kanluran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nasasakupan ng Dor,” “rehiyon ng Dor,” o “mga dalisdis ng Dor.” Bihira ang salitang Hebreo, at pinagtatalunan ang tiyak na kahulugang topograpiko nito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa dagat”; sa heograpiyang Hebreo, karaniwan itong nangangahulugang “sa gawing kanluran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: at sa
  rationale: Ipinagpapatuloy ng pang-ugnay at pang-ukol ang talaan mula sa naunang talata at ipinakikitang kasama ang mga haring ito sa mga pinadalhan ng mensahe.
- source_word: הַמְּלָכִים
  choice: mga hari
  rationale: Tuwirang katumbas ito ng מֶלֶךְ at mas tiyak kaysa sa mas malawak na salitang “mga pinuno.”
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: nasa hilaga
  rationale: Tinutukoy ng parirala ang kinaroroonang rehiyon ng mga hari; natural at malinaw sa Tagalog ang “nasa hilaga.”
- source_word: בָּהָר
  choice: sa kaburulan
  rationale: Sa mga paglalarawang pangheograpiya sa Josue, tumutukoy ang הַר sa bulubundukin o rehiyong maburol, hindi lamang sa isang bundok.
- source_word: וּבָעֲרָבָה
  choice: sa Araba
  rationale: Pinanatili ang kinikilalang pangalang pangheograpiya upang hindi ito mapagkamalang karaniwang kapatagan lamang.
- source_word: נֶגֶב כִּנֲרוֹת
  choice: sa timog ng Kinerot
  rationale: Dito ay direksiyonal ang נֶגֶב at inilalarawan ang lugar na nasa timog ng Kinerot, hindi ang rehiyong Negeb sa katimugan.
- source_word: וּבַשְּׁפֵלָה
  choice: sa mababang lupain
  rationale: Inihahayag nito sa madaling maunawaang Tagalog ang mababang lupain o paanan ng kabundukan na tinutukoy ng שְׁפֵלָה.
- source_word: וּבְנָפוֹת דּוֹר
  choice: sa mga kaitaasan ng Dor
  rationale: Ang bihira at pinagtatalunang נָפוֹת ay malamang na may topograpikong diwa rito. Pinananatili ng “mga kaitaasan” ang diwang iyon, habang inilalahad sa talababa ang iba pang posibleng pakahulugan.
- source_word: מִיָּם
  choice: sa gawing kanluran
  rationale: Bagaman literal na may salitang “dagat,” karaniwang ginagamit ang יָם bilang direksiyonal na pagtukoy sa kanluran sa heograpiyang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang mga anyong “Araba” at “Kinerot” bilang transliterasyong angkop sa Filipino. Ang gitling na mahaba ay tumutulong na ipakitang ang kasunod na mga parirala ay naglilista ng mga lugar na nasa hilaga.
