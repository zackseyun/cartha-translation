reference: Joshua 11:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֨א יְהוֹשֻׁ֜עַ בָּ/עֵ֣ת הַ/הִ֗יא וַ/יַּכְרֵ֤ת אֶת הָֽ/עֲנָקִים֙ מִן הָ/הָ֤ר מִן חֶבְרוֹן֙ מִן דְּבִ֣ר מִן עֲנָ֔ב וּ/מִ/כֹּל֙ הַ֣ר יְהוּדָ֔ה וּ/מִ/כֹּ֖ל הַ֣ר יִשְׂרָאֵ֑ל עִם עָרֵי/הֶ֖ם הֶחֱרִימָ֥/ם יְהוֹשֻֽׁעַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: tl
  text: Noong panahong iyon, dumating si Josue at pinuksa ang mga Anakim mula sa kabundukan—mula sa Hebron, Debir, at Anab, at mula sa buong kabundukan ng Juda at mula sa buong kabundukan ng Israel. Itinalaga sila ni Josue sa paglipol[a], kasama ang kanilang mga lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inilagay sa ilalim ng ban.” Ang pandiwang Hebreo ay tumutukoy sa pagtatalaga ng mga tao o bagay sa paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Ang בוא ay maaaring mangahulugang “dumating” o “pumunta” ayon sa pananaw ng salaysay. Natural sa Tagalog ang “dumating” bilang pagpapakilala sa pagkilos ni Josue sa panahong iyon.
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Karaniwang panandang temporal ito na likas at malinaw sa makabagong Tagalog.
- source_word: וַיַּכְרֵת
  choice: pinuksa
  rationale: Literal na “pinutol” o “inalis,” ngunit sa kontekstong ito ay tumutukoy sa pagpuksa sa isang pangkat mula sa rehiyon. Ipinapanatili itong bukod sa teknikal na חרם sa hulihan ng talata.
- source_word: הָעֲנָקִים
  choice: mga Anakim
  rationale: Transliterasyon ng pangalan ng pangkat; ang “mga” ang natural na pananda ng maramihan sa Tagalog.
- source_word: מִן הָהָר
  choice: sa kabundukan
  rationale: Sa Josue, ang הָהָר ay karaniwang tumutukoy sa mataas na rehiyon, hindi sa iisang bundok.
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: mula sa Hebron, Debir, at Anab
  rationale: Pinanatili ang mga pangalang-pook. Ang minsanang “mula sa” bago ang koordinadong talaan ay mas natural sa Tagalog nang hindi binabago ang saklaw.
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: at mula sa buong kabundukan ng Juda
  rationale: Ipinahahayag ang kabuuan ng mataas na rehiyong kaugnay ng Juda.
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: at sa buong kabundukan ng Israel
  rationale: Pinanatili ang Israel bilang pangalang heograpiko at pampolitika nang hindi ito pinalawak sa “mga Israelita.”
- source_word: עִם עָרֵיהֶם
  choice: kasama ang kanilang mga lungsod
  rationale: Ang עִם ay nagpapahayag ng pagsasama, at ang “mga lungsod” ay angkop sa marangal na rehistro ng salaysay.
- source_word: הֶחֱרִימָם
  choice: Itinalaga sila ... sa paglipol
  rationale: Ipinapakita ng Hiphil ng חרם ang pagtatalaga ng mga tao o bagay sa pagwasak. Pinananatili nito ang natatanging ritwal-teolohikal na diwa at hindi lamang inuulit ang “pinuksa.”
theological_decisions:
- issue: Paglalarawan sa terminong חרם sa digmaan
  choice: Itinalaga sila ni Josue sa paglipol
  alternative: Lubusan silang nilipol ni Josue / isinailalim sila ni Josue sa pagbabawal
  rationale: Ginagamit ng talata ang parehong כרת at חרם, kaya kailangang maiba ang pagkakasalin sa dalawa. Ang “itinalaga ... sa paglipol” ay nagpapanatili sa ideya ng sadyang pagtatalaga sa pagkawasak nang hindi nagpapasok ng dagdag na paliwanag o denominasyonal na doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang kinaugaliang anyong “Josue” at “Juda,” at ang “kabundukan” upang ipahiwatig ang rehiyong mataas sa halip na isang bundok lamang. Inilagay ang talababa sa mismong pariralang tumutugma sa חרם.
