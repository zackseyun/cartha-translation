  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִן הָ/הָ֤ר הֶֽ/חָלָק֙ הָ/עוֹלֶ֣ה שֵׂעִ֔יר וְ/עַד בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן תַּ֖חַת הַר חֶרְמ֑וֹן וְ/אֵ֤ת כָּל מַלְכֵי/הֶם֙ לָכַ֔ד וַ/יַּכֵּ֖/ם וַ/יְמִיתֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: tl
  text: mula sa Bundok Halak[a], na umaahon patungong Seir, hanggang sa Baal-gad sa Lambak ng Lebanon[b], sa ibaba ng Bundok Hermon. Binihag niya ang lahat ng kanilang mga hari, sinaktan sila, at pinatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang makinis na bundok.” Maaaring unawain nang deskriptibo ang Hebreo, ngunit malamang na pangalan ng lugar dito ang “Bundok Halak.”
    reason: lexical_alternative
  - marker: b
    text: O “sa Kapatagan ng Lebanon.” Ang salitang Hebreo ay maaaring tumukoy sa isang malawak na lambak o kapatagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: Bundok Halak
  rationale: Itinuring na pangalang heograpiko ayon sa konteksto; pinananatili sa talababa ang posibleng deskriptibong kahulugang “makinis na bundok.”
- source_word: הָעֹלֶה שֵׂעִיר
  choice: na umaahon patungong Seir
  rationale: Pinananatili ang topograpikong diwa ng participle עֹלֶה at ang direksiyon na ipinahihiwatig ng kasunod na Seir.
- source_word: וְעַד
  choice: hanggang sa
  rationale: Likas na Filipino para sa hangganan o lawak ng nasakop na lupain.
- source_word: בַּעַל גָּד
  choice: Baal-gad
  rationale: Isinalin sa transliterasyon bilang pangalan ng lugar, hindi bilang karaniwang parirala.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: sa Lambak ng Lebanon
  rationale: Ang בִּקְעָה ay maaaring tumukoy sa malawak na lambak o kapatagan; “Lambak” ang natural na pangunahing salin, habang inilalahad sa talababa ang alternatibo.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: sa ibaba ng Bundok Hermon
  rationale: Malinaw na nagpapahayag ng mas mababang lokasyong kaugnay ng Bundok Hermon nang hindi dinaragdagan ang teksto.
- source_word: לָכַד
  choice: Binihag
  rationale: Ang pandiwa ay nangangahulugang hulihin o sakupin; dahil mga hari ang tuwirang layon, ang “binihag” ay tiyak at natural.
- source_word: וַיַּכֵּם
  choice: pinabagsak ang mga ito
  rationale: Pinananatili ang marahas na kilos ng נכה at inihihiwalay ito sa kasunod na tahasang pagpatay.
- source_word: וַיְמִיתֵם
  choice: pinatay
  rationale: Tahasang ipinapahayag ng causative na anyo ng מות ang pagdudulot ng kamatayan; ang “pinatay” ay malinaw at dignified sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “hari” bilang kolektibong pangngalan matapos ang “lahat,” at ang “mga ito” upang malinaw na tumukoy sa lahat ng nahuling hari. Napanatili ang tatlong magkakasunod na kilos—pagbihag, pagpapabagsak, at pagpatay—nang hindi pinagsasama ang kanilang diwa.
