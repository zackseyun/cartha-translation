translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Josue,” “Hazor,” at “tabak” bilang pamilyar na anyong biblikal; pinanatili ang metaporang “ulo” upang hindi burahin ang larawan sa Hebreo. Inilagay ang bawat panandang talababa sa mismong sugnay na tinutukoy nito.
