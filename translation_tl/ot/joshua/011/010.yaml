base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: tl
  text: Nang panahong iyon, bumalik si Josue[a] at sinakop ang Hazor. Hinampas niya ng tabak ang hari nito[b], sapagkat dati ang Hazor ang ulo ng lahat ng kahariang ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagbalik.” Maaaring tumukoy ang pandiwang Hebreo sa pagbalik o pagbaling pabalik sa takbo ng kampanya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hinampas niya ng tabak.” Sa konteksto, malamang na ipinahihiwatig nito ang pagpatay.
    reason: lexical_alternative
  - marker: c
    text: O “ang pangunahin sa lahat ng kahariang ito.” Sa literal, “ang ulo,” isang metapora para sa pagiging pinuno o pinakamahalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Ang pandiwang mula sa שוב ay nagsasaad ng pagbabalik o pagbalik sa dinaanan sa takbo ng kampanya. Natural sa Filipino ang “bumalik”; maaaring idiin ng “lumingon pabalik” o “nagbalik” ang direksiyon, ngunit hindi iyon kailangan dito.
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Karaniwang pahayag na temporal ito at hindi kinakailangang tumukoy sa isang eksaktong sandali.
- source_word: וַיִּלְכֹּד
  choice: sinakop
  rationale: Ang לכד ay karaniwang ginagamit sa pagkuha ng isang lungsod sa digmaan. Mas natural sa Filipino ang “sinakop” kaysa literal na “binihag” kapag lungsod ang layon.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Isinalin sa karaniwang transliterasyong Filipino ng pangalang Hebreo.
- source_word: מַלְכָּהּ
  choice: ang hari nito
  rationale: Ang hulaping pambabae sa Hebreo ay tumutukoy sa lungsod ng Hazor; sa natural na Filipino, “nito” ang angkop.
- source_word: הִכָּה בֶחָרֶב
  choice: Pinuksa niya sa tabak
  rationale: Literal na ‘hinampas/sinaktan sa pamamagitan ng tabak’ ang parirala, ngunit sa kontekstong militar ay karaniwang nagpapahiwatig ng pagpatay. Pinananatili ng “pinuksa sa tabak” ang tradisyonal na idyomang pandigma nang hindi tahasang pinapalitan ang pandiwa ng “pinatay.”
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng paliwanag tungkol sa kahalagahan ng Hazor.
- source_word: לְפָנִים
  choice: dati
  rationale: Natural at malinaw na tumutukoy sa dating kalagayan.
- source_word: רֹאשׁ
  choice: ulo
  rationale: Pinananatili ang kongkretong metapora ng Hebreo para sa pagiging pangunahin o pinuno.
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: lahat ng kahariang ito
  rationale: Tuwirang salin na nagpapanatili sa saklaw ng ‘lahat’ at sa demonstratibong ‘ito.’
