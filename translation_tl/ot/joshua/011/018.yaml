  text: Joshua made war against all these kings for many days[a].
translation:
  language: tl
  text: Matagal na nakipagdigma si Josue sa lahat ng haring ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa loob ng maraming araw ay nakipagdigma si Josue sa lahat ng haring ito.” Literal na “maraming araw” ang nasa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: Matagal
  rationale: Literal na “maraming araw,” ngunit idiomatikong tumutukoy sa mahabang panahon. Ang “matagal” ay natural sa modernong Tagalog at malinaw na naghahatid ng diwa.
- source_word: עָשָׂה ... מִלְחָמָה
  choice: nakipagdigma
  rationale: Ang literal na pariralang “gumawa ng digmaan” ay isang Hebreong idyoma para sa pagsasagawa o pakikipagdigma. “Nakipagdigma” ang natural at dignified na katumbas sa Tagalog.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Bibliya sa Tagalog.
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: sa lahat ng haring ito
  rationale: Sa loob ng pandiwang “nakipagdigma,” natural na ipinahahayag ng “sa” ang mga kalabang hari; pinananatili ng “lahat” at “ito” ang saklaw at demonstratibo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinili ang idiomatikong “nakipagdigma” sa halip na ang di-natural na literal na “gumawa ng digmaan,” habang inilagay sa talababa ang mas pormal na anyo ng panahong parirala.
