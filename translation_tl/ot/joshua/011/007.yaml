  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: tl
  text: Dumating si Josue at ang lahat ng mandirigmang kasama niya laban sa kanila sa mga tubig ng Merom, at bigla nila silang nilusob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: sinalakay
  rationale: Sa konstruksiyong וַיָּבֹא ... עֲלֵיהֶם, ang paglapit ay may malinaw na layuning pandigma. Isinama sa natural na pandiwang Filipino ang diwang ‘dumating/lumusob laban sa,’ habang ang kasunod na וַיִּפְּלוּ בָהֶם ay pinagsama sa iisang malinaw na paglalarawan ng pagsalakay.
- source_word: עַם הַמִּלְחָמָה
  choice: lahat ng mandirigma
  rationale: Ang parirala ay literal na kolektibong ‘mga taong pandigma.’ Ang ‘mga mandirigma’ ay natural at marangal na modernong Filipino, hindi gaya ng alanganing ‘mga tao ng digmaan,’ at hindi rin nito ipinapasok ang tahasang kasariang wala sa עַם.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Tuwirang ipinahahayag ang pagsama kay Josue.
- source_word: עֲלֵיהֶם
  choice: ang mga iyon
  rationale: Ang hulaping panghalip ay tumutukoy sa mga kalabang binanggit sa konteksto; dahil nasa pandiwang ‘sinalakay’ na ang relasyong mapanlaban, ginawang layon ang ‘mga iyon.’
- source_word: עַל מֵי מֵרוֹם
  choice: sa may tubig ng Merom
  rationale: Ipinahihiwatig ng parirala ang lokasyon sa tabi o paligid ng katubigang tinatawag na Merom. Natural sa Filipino ang ‘sa may tubig ng Merom’ at hindi nito ipinapalagay na nasa ibabaw mismo ng tubig ang pangyayari.
- source_word: פִּתְאֹם
  choice: biglang
  rationale: Direktang katumbas ng biglaan o di-inaasahang pagkilos at pinananatili ang pagkabigla ng paglusob.
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: sinalakay ... ang mga iyon
  rationale: Ang נפל na may ב ay idyomang pandigma para sa paglusob o pagsalakay. Ang ‘sinalakay’ ang likas na katumbas sa modernong Filipino; pinagsama ito sa naunang kilos upang maiwasan ang di-likas na literalismong ‘bumagsak sa kanila.’
- source_word: וְ
  choice: Kaya
  rationale: Ang pambungad na waw ay nagpapatuloy sa salaysay at, ayon sa konteksto, maaaring natural na ihayag bilang resulta o kasunod na kilos sa pamamagitan ng ‘Kaya.’
