base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: tl
  text: 'At ginawa ni Josue sa kanila ang gaya ng sinabi ni Yahweh sa kaniya: pinutol niya ang mga litid sa hulihang paa ng kanilang mga kabayo at sinunog niya sa apoy ang kanilang mga karwahe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: ginawa ni Josue sa kanila
  rationale: Pinananatili nito ang tuwirang diwa ng idyomang עשה + ל, na tumutukoy sa ginawa niya laban o ukol sa kanila sa konteksto ng digmaan.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: ang mismong sinabi sa kanya
  rationale: Ipinahahayag ng “mismong” ang paghahambing at eksaktong pagsunod na dala ng כַּאֲשֶׁר, sa natural na ayos ng modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
- source_word: סוּסֵיהֶם
  choice: kanilang mga kabayo
  rationale: Karaniwang at malinaw na salin ng pangmaramihang anyo para sa kanilang mga kabayo.
- source_word: עִקֵּר
  choice: pinilay
  rationale: Naghahatid ito ng resulta ng pagkilos sa natural na Tagalog; nililinaw sa talababa na mas espesipikong tumutukoy ang Hebreo sa pagputol sa litid sa likod ng paa.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: kanilang mga karwahe
  rationale: Ang “karwahe” ay malinaw at karaniwang salin para sa sasakyang pandigma na hinihila ng mga kabayo.
- source_word: שָׂרַף בָּאֵשׁ
  choice: sinunog sa apoy
  rationale: Pinananatili ang tahasang pagbanggit sa apoy sa tekstong Hebreo, kahit medyo inuulit nito ang ideya ng pandiwang “sinunog.”
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pinilay” sa pangunahing teksto para sa natural na pagbasa, habang pinanatili sa talababa ang espesipikong pisikal na kahulugan ng pandiwang Hebreo.
