  terminology: Ang “Yahweh,” “Josue,” at “mga karwahe” ay angkop sa modernong Filipino Tagalog at sa itinakdang pag-render ng banal na pangalan. Ginawang tiyak sa pangunahing teksto ang paghamstring sa pamamagitan ng “pinutol ... ang mga litid sa hulihang paa.”
