source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: tl
  text: Kinuha ni Josue ang buong lupain[a], ayon sa lahat ng sinabi ni Yahweh kay Moises. Ibinigay iyon ni Josue sa Israel bilang mana, ayon sa paghahati-hati sa kanilang mga lipi. At tumahimik ang lupain mula sa digmaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lahat ng lupain.” Binubuod ng parirala ang pagkuha ni Josue sa lupaing tinatalakay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “At nagpahinga ang lupain mula sa digmaan.” Ang pananalitang Hebreo ay tumutukoy sa pamamahinga o katahimikan matapos ang labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nakuha
  rationale: Ang לקח ay pangunahing nangangahulugang “kunin.” Sa buod na ito ng pananakop, ipinahihiwatig ng “nakuha” ang matagumpay na pag-angkin sa lupain nang hindi labis na nililinaw ang paraan gaya ng “sinakop.”
- source_word: כָּל הָאָרֶץ
  choice: ang buong lupain
  rationale: Ang אָרֶץ ay tumutukoy sa lupaing tinatalakay sa salaysay, hindi sa buong daigdig. Pinananatili ng “buong lupain” ang malawak na saklaw ng buod at ang tensiyon nito sa mga talatang bumabanggit sa mga lugar na natitira pa.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: ayon sa lahat ng sinabi
  rationale: Ipinahahayag ng parirala ang pagtupad na kaayon ng naunang sinabi. Natural sa makabagong Tagalog ang “ayon sa lahat ng sinabi” at hindi nito dinaragdagan ang teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: וַיִּתְּנָהּ
  choice: Ibinigay iyon
  rationale: Ang hulaping pambabae ay tumutukoy pabalik sa lupain. Ang “iyon” ay natural sa Tagalog at iniiwasan ang mabigat na pag-uulit.
- source_word: לְנַחֲלָה
  choice: bilang mana
  rationale: Ang נַחֲלָה ay minanang pag-aari o takdang bahagi, lalo na ang lupaing ipinagkaloob sa Israel. Napananatili ng “mana” ang legal at tipanang diwa.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: ayon sa kanilang mga pagkakahati-hati sa kani-kanilang lipi
  rationale: Pinananatili nito kapwa ang ideya ng paghahati o paglalaan at ang kaayusang panlipi, sa malinaw at kasalukuyang Tagalog.
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: nagpahinga ang lupain mula sa digmaan
  rationale: Ang שׁקט ay nagpapahiwatig ng katahimikan o pamamahinga matapos ang labanan. Ang personipikasyong “nagpahinga ang lupain” ay malapit sa Hebreo at hindi kinakailangang mangahulugan ng ganap at permanenteng kawalan ng anumang labanan.
theological_decisions:
- issue: Saklaw ng buod na “buong lupain”
  choice: Panatilihin ang pahayag bilang buod ng matagumpay na pagkuha ni Josue sa lupaing tinatalakay.
  alternative: Ipaliwanag ito bilang ganap na pagsakop at agarang paninirahan sa bawat bahagi, o tahasang tawagin itong pagmamalabis.
  rationale: Buod ang anyo ng Hebreo. Hindi dapat lutasin ng salin ang tensiyon sa ibang mga talatang nagsasabing may mga lupaing hindi pa nasasakop.
- issue: Kahulugan ng pamamahinga mula sa digmaan
  choice: Panatilihin ang larawang ang lupain ay “nagpahinga” mula sa digmaan.
  alternative: Isalin bilang lubos at pangmatagalang kapayapaan sa buong lupain.
  rationale: Ipinahihiwatig ng pandiwa ang katahimikan matapos ang labanan, ngunit hindi nito sapilitang sinasagot kung wala nang anumang susunod na tunggalian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” para sa banal na pangalan at pinanatili ang maikling anyo ng Hebreong buod. Ang “kani-kanilang lipi” ay karaniwang pariralang Filipino na malinaw na nagpapakita ng pamamahaging panlipi.
