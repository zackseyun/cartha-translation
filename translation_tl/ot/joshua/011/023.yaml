  terminology: Ang “Yahweh,” “mana,” “Israel,” “Josue,” at “lipi” ay angkop at pare-pareho. Pinananatili ng “buong lupain” ang saklaw ng Hebreong buod nang hindi nilulutas ang mga usaping interpretatibo tungkol sa ganap na pananakop.
