revisions:
- from: Kaya nakuha ni Josue ang buong lupain[a], ayon sa lahat ng sinabi ni Yahweh kay Moises. Ibinigay iyon ni Josue sa Israel bilang mana, ayon sa kanilang mga pagkakahati-hati sa kani-kanilang lipi. At nagpahinga ang lupain mula sa digmaan.[b]
  to: Kinuha ni Josue ang buong lupain[a], ayon sa lahat ng sinabi ni Yahweh kay Moises. Ibinigay iyon ni Josue sa Israel bilang mana, ayon sa paghahati-hati sa kanilang mga lipi. At tumahimik ang lupain mula sa digmaan.[b]
