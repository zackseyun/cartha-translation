  to: Nabihag ni Josue ang lahat ng lungsod ng mga haring ito. Pinabagsak niya sa talim ng espada ang lahat ng kanilang hari at itinalaga sila sa paglipol,[a] gaya ng iniutos ni Moises, na lingkod ni Yahweh.
