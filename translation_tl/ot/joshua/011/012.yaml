    rationale: Hindi sinasabi ng Hebreo na nabihag ni Josue ang mga hari. Nabihag niya ang mga lungsod; pinabagsak niya sa talim ng espada ang lahat ng kanilang hari, at itinalaga sila sa paglipol.
  - severity: low
    issue: Hindi malinaw ang panghalip na “sila” sa ikalawang pangungusap.
    rationale: Dahil binanggit sa naunang pangungusap ang mga lungsod at mga hari, mas mabuting tahasang tukuyin ang “lahat ng kanilang hari,” upang maipakita ang layon ng Hebreo.
  revised_text: Nabihag ni Josue ang lahat ng lungsod ng mga haring ito. Pinabagsak niya sa talim ng espada ang lahat ng kanilang hari at itinalaga sila sa paglipol,[a] gaya ng iniutos ni Moises, na lingkod ni Yahweh.
