base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: tl
  text: Nabihag ni Josue ang lahat ng lungsod ng mga haring ito. Pinabagsak niya sa talim ng espada ang lahat ng kanilang hari at itinalaga sila sa paglipol,[a] gaya ng iniutos ni Moises, na lingkod ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lubos niya silang nilipol.” Gumagamit ang Hebreo ng teknikal na pandiwa para sa paglalagay ng mga tao o bagay sa ilalim ng ḥerem—ibig sabihin, ang hindi na mababawi na pagtatalaga sa paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: mga lungsod ng mga haring ito
  rationale: Pinananatili nito ang literal na ugnayan ng construct chain—ang mga lungsod na nauugnay sa mga haring nabanggit—nang hindi ito pinakahulugang simpleng “mga maharlikang lungsod.”
- source_word: לָכַד
  choice: nabihag
  rationale: Sa konteksto ng pananakop, saklaw ng pandiwa ang pagkuha sa mga lungsod at sa kanilang mga hari. Ang “nabihag” ay likas sa Filipino at naiiwasang ulitin o hatiin ang iisang pandiwang Hebreo.
- source_word: וַיַּכֵּם
  choice: pinabagsak niya sila
  rationale: Malawak ang kahulugan ng נכה, ngunit ang kasunod na pariralang “sa talim ng espada” ay nagpapahiwatig ng nakamamatay na pananakit. Iniiwasan ng “pinabagsak” ang makalumang pananalita habang hindi ginagawang mas tiyak kaysa sa mismong pandiwa.
- source_word: לְפִי חֶרֶב
  choice: sa talim ng espada
  rationale: Ito ang malinaw at konkretong katumbas ng idyomang Hebreo na literal na “sa bibig ng espada.”
- source_word: הֶחֱרִים
  choice: itinalaga ang mga iyon sa paglipol
  rationale: 'Pinananatili nito ang teknikal na diwa ng ḥerem: ang di-mababawing pagtatalaga ng mga tao o bagay sa pagwasak, hindi lamang pangkalahatang pagpatay o pagsira.'
- source_word: כַּאֲשֶׁר צִוָּה
  choice: gaya ng iniutos
  rationale: Ipinahahayag nito ang pagsunod ng ginawa ni Josue sa naunang utos ni Moises.
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Ang “lingkod” ay angkop sa marangal at tipanang titulo ni Moises; hindi kailangan dito ang “alipin,” na maaaring maghatid ng di-angkop na konotasyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “Panginoon.”
theological_decisions:
- issue: Paglalahad ng חרם sa konteksto ng pananakop
  choice: itinalaga ang mga iyon sa paglipol
  alternative: lubos niyang nilipol ang mga iyon; inilagay niya ang mga iyon sa ilalim ng pagbabawal
  rationale: Teknikal na salita ang חרם para sa di-mababawing pagtatalaga sa pagwasak. Pinananatili ng salin ang teolohikal at tipanang bigat nito nang hindi ipinapalagay na isa lamang itong karaniwang pandiwa para sa paglipol.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton, kaya pinananatili bilang personal na pangalan sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “espada” sa halip na “tabak” dahil mas karaniwan ito sa kasalukuyang Filipino, habang pinanatili ang konkretong larawang “talim.” Ang marker na [a] ay inilagay kaagad pagkatapos ng teknikal na pariralang ipinapaliwanag nito.
