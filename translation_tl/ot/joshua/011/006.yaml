revisions:
- from: Sinabi ni Yahweh kay Josue, “Huwag kang matakot sa kanila, sapagkat bukas sa ganitong oras[a], ibibigay ko silang lahat sa harap ng Israel bilang mga napatay.[b] Puputulin mo ang mga litid sa paa ng kanilang mga kabayo at susunugin mo sa apoy ang kanilang mga karwaheng pandigma.”
  to: Sinabi ni Yahweh kay Josue, “Huwag kang matakot sa kanila, sapagkat bukas sa ganitong oras[a], ibibigay ko silang lahat sa harap ng Israel bilang mga napatay sa labanan.[b] Puputulin mo ang mga litid ng paa ng kanilang mga kabayo at susunugin mo sa apoy ang kanilang mga karwaheng pandigma.”
  rationale: Inayos ang isang hindi sapat na paliwanag sa talababa upang malinaw na maipakita ang kahulugang pandigma ng “mga napatay,” at pinakinis ang parirala para sa litid ng paa. Hindi binago ang saklaw ng pangako, ang pananaw na ibinibigay ng Diyos ang mga kaaway sa Israel, o ang tahasang utos na sunugin ang mga karwahe sa apoy.
