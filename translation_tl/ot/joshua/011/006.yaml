  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Josue, “Huwag kang matakot sa kanila, sapagkat bukas sa ganitong oras[a], ibibigay ko silang lahat sa harap ng Israel bilang mga napatay sa labanan.[b] Puputulin mo ang mga litid ng paa ng kanilang mga kabayo at susunugin mo sa apoy ang kanilang mga karwaheng pandigma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bukas, humigit-kumulang sa ganitong oras.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ibinibigay ko silang lahat sa harap ng Israel bilang mga napatay”; ibig sabihin, ibibigay sila upang patayin ng Israel sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo, sa anyong karaniwang makikilala ng mga mambabasang Filipino.
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: Huwag kang matakot sa kanila
  rationale: Natural at tuwirang Filipino para sa pagbabawal na matakot dahil sa mga kaaway.
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: bukas sa ganitong oras
  rationale: Pinananatili ang temporal na idyoma; maaaring tumukoy sa mismong oras o humigit-kumulang sa ganitong oras, kaya inilagay ang alternatibo sa talababa.
- source_word: אָנֹכִי נֹתֵן
  choice: ibibigay ko
  rationale: Sa konteksto ng pangako tungkol sa susunod na araw, likas sa Filipino ang panghinaharap; hindi nito inaalis ang tiyak at nalalapit na diwa ng Hebreong participle.
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: ibibigay ko silang lahat sa harap ng Israel bilang mga napatay
  rationale: Pinananatili ang larawan ng paghaharap o pagbibigay sa Israel at ang kahulugang pandigma ng חֲלָלִים, sa halip na gawing pangkalahatang ‘mga patay’ lamang.
- source_word: תְּעַקֵּר
  choice: Puputulin mo ang mga litid sa paa
  rationale: Malinaw na inilalarawan sa karaniwang Filipino ang pagpaparalisa sa mga kabayo sa pamamagitan ng pagputol sa litid, sa halip na gumamit ng bihira o malabong teknikal na pandiwa.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: kanilang mga karwaheng pandigma
  rationale: Nililinaw na ang tinutukoy ay mga sasakyang pandigma, hindi karaniwang karwahe.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: susunugin mo sa apoy
  rationale: Pinananatili ang tahasang pagbanggit sa apoy na nasa Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton. Ang ‘Yahweh’ ay nagpapanatili rito bilang personal na pangalan nang hindi pinapalitan ng titulo.
- issue: Paglalarawan sa tiyak na pagkatalo ng mga kaaway
  choice: ibibigay ko silang lahat sa harap ng Israel bilang mga napatay
  alternative: ipapapatay ko silang lahat sa Israel
  rationale: Hindi ginawang higit na tahasang sanhi ang pahayag kaysa sa Hebreo. Pinananatili nito ang tensiyon sa pagitan ng banal na pagbibigay at ng aktuwal na pagpatay ng Israel.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Josue,” ang nakaugaliang anyong Filipino ng pangalan. Iniwasan ang sobrang teknikal na “hamstring” sa pamamagitan ng malinaw na paglalarawan sa pagputol ng mga litid sa paa ng kabayo; idinagdag ang “pandigma” sa karwahe upang malinaw ang sinaunang kontekstong militar.
