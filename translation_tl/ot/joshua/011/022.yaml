base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/022.yaml
  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: tl
  text: Walang natirang Anakim sa lupain ng mga anak ni Israel; tanging sa Gaza, Gat, at Asdod may natirang mga Anakim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נוֹתַר עֲנָקִים
  choice: Walang natirang mga Anakim
  rationale: Ang Nifal na נוֹתַר ay nagsasaad ng nalabing buhay o naroon matapos ang mga kampanya. Natural sa Tagalog ang “walang natirang,” at pinananatili ang Anakim bilang pangalan ng pangkat-etniko.
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: sa lupain ng mga anak ni Israel
  rationale: Tuwirang inililipat ang pariralang konstruktong Hebreo na “lupain ng mga anak ni Israel,” nang hindi ito pinapantay sa mas pangkalahatang “mga Israelita.”
- source_word: רַק
  choice: tanging … na lamang
  rationale: Ipinahahayag ng kombinasyong ito ang mahigpit na pagtatangi o limitasyon ng רַק sa natural na modernong Tagalog.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: sa Gaza, Gat, at Asdod
  rationale: Ginamit ang karaniwang anyong Tagalog ng mga pangalan ng lugar; isang “sa” lamang ang kailangan sa magkakaugnay na talaan.
- source_word: נִשְׁאָרוּ
  choice: may mga natira
  rationale: Ang pandiwang maramihan ay muling tumutukoy sa mga Anakim. Natural na ipinakikita ng “may mga natira” na ilan sa kanila ang nanatili sa mga lungsod na binanggit.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pag-uulit ng “natira” dahil kapansin-pansin din sa Hebreo ang magkaugnay na נוֹתַר at נִשְׁאָרוּ, habang ginawang natural ang paghahambing sa pamamagitan ng “tanging … na lamang.”
