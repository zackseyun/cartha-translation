base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: tl
  text: Gawin mo sa Ai at sa hari nito ang ginawa mo sa Jerico at sa hari nito. Ang samsam at mga alagang hayop nito lamang ang maaari ninyong kunin bilang samsam para sa inyo.[a] Maglagay ka ng tambang[b] sa likuran ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kukunin ninyo ito bilang samsam para sa inyo.” Ang anyong Hebreo ay maaaring basahin bilang simpleng pahayag sa hinaharap o bilang ipinahihintulot na utos; ginamit sa teksto ang “maaari” upang ipakita ang kaibahan sa Jerico, kung saan ipinagbawal ang pagkuha ng samsam.
    reason: lexical_alternative
  - marker: b
    text: O “mga taong nakapuwesto upang manambang.” Maaaring tukuyin ng pang-isahang anyo sa Hebreo ang tambang bilang isang kabuuan o ang pangkat ng mga taong nananambang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gawin mo
  rationale: Ang pandiwang nasa anyong perpekto na may pang-ugnay ay gumaganap bilang tagubilin sa kontekstong ito; natural at tuwiran ang pautos na Tagalog.
- source_word: לָעַי
  choice: sa Ai
  rationale: Isinalin ang pang-ukol at pinanatili ang kinikilalang anyo ng pangalan ng lugar.
- source_word: וּלְמַלְכָּהּ
  choice: at sa hari nito
  rationale: Pinananatili ang ugnayan ng hari sa lungsod nang hindi inuulit nang di-kailangan ang pangalan.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: ang ginawa mo
  rationale: Natural na Tagalog na paghahambing pagkatapos ng 'Gawin mo,' at malinaw na tumutukoy sa naunang ginawa sa Jerico.
- source_word: לִירִיחוֹ וּלְמַלְכָּהּ
  choice: sa Jerico at sa hari nito
  rationale: Pinananatili ang magkatambal na mga layon ng ginawa ni Josue.
- source_word: רַק
  choice: Ngunit
  rationale: Dito ay naghahayag ito ng mahalagang pagtatangi sa pagkakatulad sa Jerico; mas natural sa modernong Tagalog ang 'Ngunit' kaysa literal na 'Tanging.'
- source_word: שְׁלָלָהּ
  choice: ang mga samsam
  rationale: Ang 'samsam' ay kasalukuyan, malinaw, at angkop sa mga ari-ariang kinukuha sa digmaan.
- source_word: וּבְהֶמְתָּהּ
  choice: at mga alagang hayop nito
  rationale: Tumutukoy sa mga domestikadong hayop bilang pag-aari; mas malawak at mas eksakto ito kaysa 'mga baka.'
- source_word: תָּבֹזּוּ לָכֶם
  choice: ay maaari ninyong samsamin para sa inyong sarili
  rationale: Ang ikalawang panauhang maramihan ay tumutukoy sa mga tauhan ni Josue. Ipinahahayag ng 'maaari' ang pahintulot na salungat sa pagbabawal sa samsam sa Jerico, habang inilalagay sa talababa ang posibleng tuwirang pautos o hinaharap na pagbasa.
- source_word: שִׂים לְךָ
  choice: Maghanda ka
  rationale: Natural na utos sa Tagalog para sa pagsasaayos ng isang taktikang militar; naipahihiwatig ng konteksto ang kapakinabangan nito para kay Josue at sa kanyang hukbo.
- source_word: אֹרֵב
  choice: ng tambang
  rationale: Maaaring tukuyin ng anyong Hebreo ang mismong tambang o ang pangkat na tatambang; maikli at natural ang pangunahing salin.
- source_word: לָעִיר מֵאַחֲרֶיהָ
  choice: sa likuran ng lungsod
  rationale: Malinaw na inilalahad ang puwesto ng tambang na nasa likod ng lungsod, ayon sa pananaw ng hukbong sasalakay.
