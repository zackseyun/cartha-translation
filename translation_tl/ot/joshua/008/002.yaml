translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Ginamit ang mga karaniwang salitang “samsam,” “alagang hayop,” at “tambang,” at iniwasan ang makaluma o labis na teknikal na pananalita. Ang paglipat mula sa isahang “mo/ka” tungo sa maramihang “ninyo” ay pinananatili dahil si Josue ang tuwirang inuutusan, samantalang ang hukbo ang pinahihintulutang kumuha ng samsam.
