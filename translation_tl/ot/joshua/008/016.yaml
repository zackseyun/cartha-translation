  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: tl
  text: Tinawag ang lahat ng taong nasa lungsod upang habulin sila,[a] at hinabol nila si Josue, at nailayo sila sa lungsod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagsigawan”; maaaring tumukoy ang pandiwang Hebreo sa pagsigaw, ngunit sa kontekstong ito ay malamang na tumutukoy ito sa pagtawag o pagpapakilos sa kanila upang humabol.
    reason: lexical_alternative
  - marker: b
    text: O “nahiwalay sila sa lungsod.” Ipinahihiwatig ng Hebreo na nailabas sila at sa gayon ay nahiwalay sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: Tinawag
  rationale: Ang anyong Niphal ng זעק ay maaaring tumukoy sa pagtawag o pagpapakilos sa mga tao. Sa kontekstong militar, likas sa Tagalog ang “Tinawag” at hindi nito nililimitahan ang kahulugan sa pagsigaw lamang.
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: ang lahat ng taong nasa lungsod
  rationale: Pinananatili ng “mga tao” ang lawak ng עָם nang hindi dinaragdagan ang tekstong Hebreo ng espesipikong “mga lalaki” o “mga kawal.”
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: upang habulin sila
  rationale: Ang רדף + אחרי ay karaniwang idyoma para sa paghabol o pagtugis; ang “habulin” ay malinaw at natural sa salaysay.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: hinabol nila si Josue
  rationale: Inuulit ang pandiwa ng paghabol at pinananatili ang paglipat ng tuon mula sa maramihang “sila” tungo kay Josue bilang pinuno.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: kaya nailayo sila sa lungsod
  rationale: Ipinahihiwatig ng Niphal ng נתק ang pagkakahila o pagkakahiwalay mula sa isang lugar. Inilalahad ng “nailayo” ang taktikal na bunga nang hindi ipinapalagay na pisikal silang pinutol mula sa lungsod.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na “habulin” sa salaysay na militar at pinanatili ang bahagyang pag-uulit at paglipat ng tuon ng tekstong Hebreo.
