  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Josue, “Huwag kang matakot ni panghinaan ng loob. Isama mo ang lahat ng mandirigma[a]. Bumangon ka at umakyat sa Ai. Tingnan mo, ibinigay ko na sa iyong kamay ang hari ng Ai, ang kanyang bayan, ang kanyang lungsod, at ang kanyang lupain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lahat ng taong pandigma”; maaari ring isaling “buong hukbo” o “lahat ng mandirigma.” Tumutukoy ito sa puwersang panlaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang pamilyar at matagal nang anyo ng pangalang Joshua sa Tagalog.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Huwag kang matakot o panghinaan ng loob
  rationale: Likas sa modernong Tagalog ang tambalang ito at ipinahahayag kapwa ang takot at ang pagkasira ng loob na saklaw ng dalawang pandiwang Hebreo.
- source_word: קַח עִמְּךָ
  choice: Isama mo
  rationale: Natural na naipapahayag sa Tagalog ang utos na kunin o dalhin silang kasama ni Josue.
- source_word: כָּל עַם הַמִּלְחָמָה
  choice: ang lahat ng mandirigma
  rationale: Ang literal na “lahat ng bayan ng digmaan” ay tumutukoy sa puwersang panlaban; malinaw at dignified ang “mga mandirigma” nang hindi ipinapalagay na saklaw ang buong populasyon.
- source_word: וְקוּם עֲלֵה הָעָי
  choice: Tumindig ka at sumalakay sa Ai
  rationale: Pinananatili ng “tumindig” ang hiwalay na unang pautos, samantalang ang “sumalakay sa” ay natural na kontekstuwal na katumbas ng pag-akyat laban sa isang lungsod.
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Pinananatili ang tahasang pautos na nagbibigay-diin sa kasunod na katiyakan ng Diyos.
- source_word: נָתַתִּי בְיָדְךָ
  choice: ibinigay ko na sa iyong kamay
  rationale: Pinananatili ang perfect na anyo bilang tiyak at waring ganap nang pagkakaloob, pati ang Hebreong idyoma ng paglalagay sa kamay o kapangyarihan.
- source_word: עַמּוֹ וְאֶת עִירוֹ וְאֶת אַרְצוֹ
  choice: ang kanyang bayan, ang kanyang lungsod, at ang kanyang lupain
  rationale: Pinanatili ang magkakasunod na panghalip na tumutukoy sa hari, gaya ng gramatika ng Hebreo.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang Tetragrammaton sa teksto; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Aspekto ng נָתַתִּי sa pangako ng Diyos
  choice: ibinigay ko na
  alternative: ibinibigay ko; ibibigay ko
  rationale: Ang Hebreong perfect sa banal na pahayag ay naglalarawan sa tagumpay bilang tiyak o ganap na sa pasiya ng Diyos. Hindi ito ginawang payak na panghinaharap.
- issue: Saklaw ng כָּל עַם הַמִּלְחָמָה
  choice: lahat ng mandirigma
  alternative: buong hukbo; lahat ng taong pandigma
  rationale: Tumutukoy ang parirala sa puwersang lumalaban, hindi sa bawat mamamayan. Ang salin ay hindi nagdaragdag ng denominasyonal o doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Josue,” ang pamilyar na anyo sa Tagalog, at iniwasan ang labis na arkaikong pananalita. Pinanatili ang Hebreong pagkakasunod at diin kung natural, ngunit ginawang idyomatiko ang kilos ng pagpunta laban sa Ai bilang “sumalakay sa Ai.”
