  source_fidelity: Kailangang itama ang “sumalakay sa Ai,” sapagkat ang dalawang pautos na וְקוּם עֲלֵה ay “bumangon/tumindig” at “umakyat/pumunta,” hindi tahasang utos na lumusob. Ang “umakyat sa Ai” ay nagpapanatili ng direksiyonal na pandiwang Hebreo nang walang idinadagdag na paraan ng pagkilos. Napananatili nang wasto ang katiyakan ng perfect sa “ibinigay ko na” at ang idyomang “sa iyong kamay.”
  naturalness: Ang “Bumangon ka at umakyat sa Ai” ay malinaw at likas sa modernong Filipino Tagalog sa marangal na rehistro. Mas tumpak ito kaysa “Tumindig ka at sumalakay sa Ai,” na nagdaragdag ng kahulugang wala sa mismong pautos.
  terminology: Ang “Yahweh,” “Josue,” “Ai,” at “mga mandirigma” ay angkop. Ang talababa ay inayos upang hindi maging malabo ang literal na “bayan,” na sa modernong Tagalog ay maaari ring mangahulugang isang lugar o pamayanan.
