    issue: Maaaring malabo ang “lahat ng bayan ng digmaan” sa talababa.
    rationale: Sa modernong Tagalog, ang “bayan” ay madaling unawaing lungsod, pamayanan, o bansa. Ang “lahat ng taong pandigma” ay mas malinaw na literal na paglalarawan ng pormang Hebreo.
