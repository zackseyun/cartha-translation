  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: tl
  text: Nang matapos patayin ng Israel ang lahat ng taga-Ai na nasa parang, sa ilang kung saan nila hinabol ang mga ito, at silang lahat ay nabuwal sa talim ng tabak hanggang sa tuluyan silang maubos[a], bumalik sa Ai ang buong Israel at sinalakay ito sa talim ng tabak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hanggang sa ganap silang nalipol” o “hanggang sa wala nang natira sa kanila.”'
    reason: Pinananatili ang saklaw ng עַד תֻּמָּם, na maaaring magpahiwatig ng ganap na pagkaubos o pagdating sa wakas.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Nang matapos
  rationale: Ang temporal na parirala ay likas na isinasalin sa Tagalog bilang “Nang matapos,” at malinaw nitong ipinapakita na nauna ang pagpatay bago ang pagbabalik sa Ai.
- source_word: לַהֲרֹג
  choice: patayin
  rationale: Tuwirang katumbas ito ng הרג at hindi pinapalambot ang karahasan ng salaysay.
- source_word: יֹשְׁבֵי הָעַי
  choice: mga taga-Ai
  rationale: Natural at kasalukuyang paraan ito ng pagtukoy sa mga naninirahan sa isang lugar.
- source_word: בַּשָּׂדֶה
  choice: nasa parang
  rationale: Ang “parang” ay bukas na lupain sa labas ng lungsod at angkop sa kaibahan nito sa Ai.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay tumutukoy sa di-nilinang at ilang na lupain, hindi kinakailangang mabuhanging disyerto.
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: na pinaghulugan nila sa mga ito
  rationale: 'Ipinananatili nito ang lokatibong diwa: ang ilang ang lugar kung saan hinabol ng Israel ang mga taga-Ai.'
- source_word: וַיִּפְּלוּ כֻלָּם
  choice: mabuwal silang lahat
  rationale: Ang “mabuwal” ay natural na idyoma sa konteksto ng pagkamatay sa labanan.
- source_word: לְפִי חֶרֶב
  choice: sa talim ng tabak
  rationale: Pinananatili nito ang larawang Hebreo ng “bibig ng tabak” sa isang natural na idyomang Tagalog.
- source_word: עַד תֻּמָּם
  choice: hanggang sa tuluyan silang maubos
  rationale: Ipinahahayag nito ang ganap na pagkaubos ng hinahabol na pangkat habang pinananatili ang diwa ng pagkumpleto o pagtatapos.
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: bumalik sa Ai ang buong Israel
  rationale: Tuwirang ipinahahayag ang pagbabalik at ang patutunguhan.
- source_word: וַיַּכּוּ אֹתָהּ
  choice: nilipol iyon
  rationale: Ang pambabaeng isahang layon ay tumutukoy sa lungsod ng Ai; sa kontekstong pandigma at kasunod ng “sa talim ng tabak,” ang “nilipol” ay natural at matindi, ngunit hindi nagdaragdag ng bagong layon.
theological_decisions:
- issue: Paglalarawan sa ganap na karahasan ng digmaan
  choice: Panatilihin ang tahasang “patayin,” “mabuwal,” “maubos,” at “nilipol”
  alternative: Palambutin bilang “tinalo” o dagdagan ng paliwanag na ito ay hatol ng Diyos
  rationale: Tahasan ang Hebreong teksto tungkol sa pagpatay at ganap na pagkaubos. Hindi ito dapat palambutin, ngunit hindi rin dapat dagdagan ng teolohikal na paliwanag na wala sa mismong talata.
translation_notes:
  register: Makabagong Filipino na marangal at tuwiran. Ginamit ang “parang” at “ilang” para sa topograpiya, at hindi pinalambot ang marahas na wikang pandigma.
