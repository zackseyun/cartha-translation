revisions:
- from: Nang matapos patayin ng Israel ang lahat ng taga-Ai na nasa parang, sa ilang na pinaghulugan nila sa mga ito, at nang mabuwal silang lahat sa talim ng tabak hanggang sa tuluyan silang maubos[a], bumalik sa Ai ang buong Israel at nilipol iyon sa talim ng tabak.
  to: Nang matapos patayin ng Israel ang lahat ng taga-Ai na nasa parang, sa ilang kung saan nila hinabol ang mga ito, at silang lahat ay nabuwal sa talim ng tabak hanggang sa tuluyan silang maubos[a], bumalik sa Ai ang buong Israel at sinalakay ito sa talim ng tabak.
  rationale: Itinuwid ang maling pandiwang “pinaghulugan” upang maipahayag ang paghabol sa loob ng ilang. Pinalitan ang “nilipol” ng “sinalakay” upang hindi higitan ang saklaw ng וַיַּכּוּ, habang pinananatili ang tahasang marahas na larawan ng “sa talim ng tabak.”
