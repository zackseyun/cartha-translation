  text: רַ֣ק הַ/בְּהֵמָ֗ה וּ/שְׁלַל֙ הָ/עִ֣יר הַ/הִ֔יא בָּזְז֥וּ לָ/הֶ֖ם יִשְׂרָאֵ֑ל כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה אֶת יְהוֹשֻֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: tl
  text: Tanging ang mga alagang hayop at ang samsam mula sa lungsod na iyon ang kinuha ng Israel para sa kanilang sarili, ayon sa iniutos ni Yahweh kay Josue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Tanging
  rationale: Ipinahahayag nito ang pagbubukod sa mga bagay na winasak sa naunang salaysay at pinananatili ang diin ng Hebreo sa mga bagay na pinahintulutang kunin.
- source_word: הַבְּהֵמָה
  choice: ang mga alagang hayop
  rationale: Tumutukoy sa mga domestikadong hayop na maaaring kuning samsam; malinaw at pangkaraniwan ito sa modernong Filipino.
- source_word: וּשְׁלַל הָעִיר הַהִיא
  choice: at ang samsam mula sa lungsod na iyon
  rationale: Ang שׁלל ay mga ari-ariang kinukuha sa digmaan. Nililinaw ng “mula sa” ang kaugnayang ipinahahayag ng Hebreong konstruksyong “samsam ng lungsod na iyon.”
- source_word: בָּזְזוּ לָהֶם
  choice: ang kinuha ... para sa kanilang sarili
  rationale: Ipinahahayag ng parirala ang pagkuha ng samsam para mapakinabangan o maangkin ng Israel, habang iniiwasan ang mabigat na pag-uulit na “sinamsam ang samsam.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinananatili ang nakaugaliang pangalan ng bayang Israel bilang kolektibong simuno.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: ayon sa iniutos ni Yahweh kay Josue
  rationale: Natural na ipinahahayag sa Filipino ang pagsunod sa salitang naglalaman ng utos. Pinananatili ang pinagmulan ng utos, ang banal na pangalan, at ang tumanggap nito.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na banal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Pinanatili ang paunang diin ng רַק sa hulma na “Tanging ... ang ...,” at ginamit ang nakaugaliang Filipino na pangalang “Josue.”
