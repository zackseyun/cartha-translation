  source_fidelity: 'Tumpak ang salin sa pangunahing mga elemento ng Hebreo: ang “mga tao,” ang buong kampo sa hilaga ng lungsod, ang hulihan nito sa kanluran, at ang pagpunta ni Josue sa gitna ng lambak nang gabing iyon. Ang pagkakahanay ng dalawang lokasyong militar ay napanatili nang walang labis na pagpapakahulugan.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang ellipsis sa “at ang hulihan nito” ay katanggap-tanggap at sumasalamin sa magkakaugnay na ayos ng Hebreo. Ang “Nang gabing iyon” ay maayos na panandang panahon.
  terminology: 'Ang “kampo,” “hulihan,” “kanluran,” at “lambak” ay angkop at pare-pareho sa rehistro. Ang “Josue” ay ang karaniwang anyong Tagalog ng pangalan. Maayos ang mga talababa: ang [a] ay nakaugnay sa “hulihan,” at ang [b] sa direksiyonal na “kanluran.”'
