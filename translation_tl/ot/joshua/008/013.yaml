  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּשִׂ֨ימוּ הָ/עָ֜ם אֶת כָּל הַֽ/מַּחֲנֶ֗ה אֲשֶׁר֙ מִ/צְּפ֣וֹן לָ/עִ֔יר וְ/אֶת עֲקֵב֖/וֹ מִ/יָּ֣ם לָ/עִ֑יר וַ/יֵּ֧לֶךְ יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: tl
  text: Kaya inilagay ng mga tao ang buong kampo sa hilaga ng lungsod, at ang hulihan nito[a] sa kanluran ng lungsod.[b] Nang gabing iyon, pumunta si Josue sa gitna ng lambak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang bantay sa hulihan nito.”
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, literal na “sa gawing dagat ng lungsod.” Ginagamit dito ang “dagat” bilang katawagang direksiyonal na nangangahulugang “kanluran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: inilagay
  rationale: Ang שׂים ay malawak na pandiwang nangangahulugang ‘ilagay’ o ‘italaga sa puwesto.’ Ang ‘inilagay’ ay tuwiran at natural, habang malinaw sa kontekstong militar na sinadya ang pagkakapuwesto.
- source_word: הָעָם
  choice: mga tao
  rationale: Literal na ‘ang bayan/mga tao’ ang Hebreo, hindi tahasang ‘hukbo.’ Pinananatili ng ‘mga tao’ ang mas malawak na katawagan ng pinagmulan kahit mga mandirigma ang tinutukoy sa konteksto.
- source_word: כָּל הַמַּחֲנֶה
  choice: ang buong kampo
  rationale: Tuwirang ipinahahayag ng ‘buong kampo’ ang כָּל at ang karaniwang kahulugan ng מַחֲנֶה.
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: sa hilaga ng lungsod
  rationale: Natural na modernong Tagalog para sa lokasyon ng kampo sa gawing hilaga ng lungsod; hindi kailangang ulitin ang kamag-anak na sugnay upang mapanatili ang diwa.
- source_word: עֲקֵבוֹ
  choice: ang hulihan nito
  rationale: Ang עָקֵב ay literal na kaugnay ng ‘sakong’ at maaaring tumukoy sa hulihan. Ang ‘hulihan’ ay hindi nagpapasya kung bahagi lamang ito ng kampo o isang natatanging bantay sa likuran.
- source_word: מִיָּם לָעִיר
  choice: sa kanluran ng lungsod
  rationale: Bagaman literal na ‘mula sa dagat’ ang יָם, karaniwan itong direksiyonal na katawagan para sa kanluran sa Hebreo.
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Payak at natural na katumbas ng karaniwang pandiwang הלך sa kontekstong ito.
- source_word: בַּלַּיְלָה הַהוּא
  choice: Nang gabing iyon
  rationale: Likas na salin sa Tagalog ng panandang-panahong Hebreo.
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: sa gitna ng lambak
  rationale: Pinananatili ang ‘gitna’ at ‘lambak.’ Sa Tagalog, sapat na ang ‘pumunta ... sa’ upang ipahayag ang kilos patungo sa lugar nang hindi pilit na gamitin ang ‘papasok.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang ‘Josue,’ ang nakasanayang anyo ng pangalan sa Tagalog. Iniwasan ang mas kolokyal na ‘puwinesto’ at pinanatili ang mas malawak na ‘mga tao’ sa halip na ipakahulugang ‘hukbo.’
