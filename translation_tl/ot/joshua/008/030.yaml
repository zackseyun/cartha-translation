id: JOS.8.30
reference: Joshua 8:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָ֣ז יִבְנֶ֤ה יְהוֹשֻׁ֨עַ֙ מִזְבֵּ֔חַ לַֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר עֵיבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: tl
  text: Pagkatapos, nagtayo si Josue ng isang altar para kay Yahweh[a], ang Diyos ng Israel, sa Bundok Ebal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH (יהוה), ang personal na pangalan ng Diyos; karaniwang binibigkas na “Yahweh.”'
    reason: Nililinaw ang pinagmulan at anyo ng banal na pangalan.
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Minamarkahan nito ang kasunod na pangyayari sa salaysay; natural sa makabagong Filipino ang “Pagkatapos.”
- source_word: יִבְנֶה
  choice: nagtayo
  rationale: Bagaman anyong imperfect ang pandiwa, nagkakaroon ito ng puwersang pangnagdaan matapos ang אָז sa ganitong salaysay.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ito ang nakasanayang anyo ng pangalang Joshua sa Filipino at malinaw sa karaniwang mambabasa.
- source_word: מִזְבֵּחַ
  choice: isang altar
  rationale: Tumutukoy ito sa altar na ginagamit sa paghahandog; ang “isang” ay natural sa unang pagbanggit dito.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinapakita ng ל ang paglalaan o patutunguhan; ang “para kay” ay natural sa Filipino para sa altar na inilaan sa Diyos.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang pinananatili ang construct phrase at ang pagkakakilanlan kay Yahweh bilang Diyos ng Israel.
- source_word: בְּהַר עֵיבָל
  choice: sa Bundok Ebal
  rationale: Tumutukoy ang parirala sa lokasyon sa bundok na pinangalanang Ebal; natural at malinaw ang “sa Bundok Ebal.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng altar kay Yahweh sa לַיהוָה
  choice: para kay Yahweh
  alternative: kay Yahweh
  rationale: Maaaring magpahiwatig ang ל ng paglalaan o patutunguhan. Ang “para kay Yahweh” ay natural at pinananatili ang diwang ang altar ay itinayo at inilaan sa kaniya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue,” “altar,” at “Bundok Ebal” bilang mga anyong pamilyar sa karaniwang mambabasang Filipino; iniwasan ang sobrang arkaikong pananalita.
