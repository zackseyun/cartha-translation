source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: tl
  text: Nang makita ito ng hari ng Ai, nagmadali at maagang bumangon ang mga lalaki ng lungsod. Lumabas sila upang harapin ang Israel sa labanan—ang hari at ang buong bayan niya—sa takdang lugar[a] sa harap ng Araba.[b] Ngunit hindi alam ng hari na may mga nakatambang sa kanya sa likod ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa takdang oras.” Ang salitang Hebreo ay maaaring tumukoy sa itinakdang panahon o lugar.
    reason: lexical_alternative
  - marker: b
    text: O “sa harap ng kapatagan.” Ang salitang Hebreo ay maaaring tumukoy sa rehiyong Araba o, sa mas pangkalahatan, sa isang tuyong kapatagan o steppe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Nang makita
  rationale: Ang וַיְהִי ay bahagi ng daloy ng salaysay, at ang כִּרְאוֹת ay temporal na pariralang nangangahulugang “nang makita.” Sa modernong Tagalog, likas na naipahahayag ng “Nang” ang pagpasok sa pangyayari nang hindi gumagamit ng makalumang “At nangyari.”
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: nagmadali silang bumangon nang maaga
  rationale: 'Pinananatili nito ang maramihang pandiwa at ang dalawang diwa: pagmamadali at maagang pagbangon, sa isang natural na pariralang Tagalog.'
- source_word: אַנְשֵׁי הָעִיר
  choice: mga lalaki ng lungsod
  rationale: Literal na “mga lalaki ng lungsod”; ang tiyak na panlalaking katawagan ay angkop sa konteksto ng pakikidigma.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: upang harapin ang Israel sa labanan
  rationale: Ang לִקְרַאת ay pagpunta upang salubungin o harapin, at malinaw na ginagawang militar ng לַמִּלְחָמָה ang konteksto.
- source_word: הוּא וְכָל עַמּוֹ
  choice: ang hari at ang buong bayan niya
  rationale: Inuulit ang “hari” sa halip na gumamit ng malabong panghalip, habang pinananatili ang karaniwang kahulugan ng עַם na “bayan/people” at hindi ito ginagawang tahasang “hukbo.”
- source_word: לַמּוֹעֵד
  choice: sa takdang lugar
  rationale: Maaaring tumukoy ang מוֹעֵד sa takdang panahon o lugar. Mas malamang dito ang lokasyong kahulugan dahil sinusundan ito ng heograpikong pariralang לִפְנֵי הָעֲרָבָה, ngunit inilalahad sa talababa ang tunay na alternatibo.
- source_word: לִפְנֵי הָעֲרָבָה
  choice: sa harap ng Araba
  rationale: Pinananatili ng “sa harap ng” ang karaniwang kahulugan ng לִפְנֵי at ng “Araba” ang posibleng pangalang heograpiko; inilalahad sa talababa ang mas pangkalahatang kahulugan ng lupain.
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: may mga nakatambang sa kanya sa likod ng lungsod
  rationale: Natural na Tagalog ito para sa kolektibong diwa ng אֹרֵב, at pinananatili ang pagpuntirya sa hari at ang lokasyon sa likod ng lungsod.
