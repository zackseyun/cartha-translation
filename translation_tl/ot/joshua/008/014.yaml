translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lungsod,” “labanan,” at “nakatambang” bilang mga salitang madaling maunawaan ngunit angkop sa salaysay. Inilagay ang mga marker sa mismong mga pariralang tinutukoy ng mga talababa.
