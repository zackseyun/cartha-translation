base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: tl
  text: Pagkatapos nito, binasa niya ang lahat ng salita ng Kautusan[a]—ang pagpapala at ang sumpa—ayon sa lahat ng nakasulat sa Aklat ng Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Kautusan” ay salin ng Hebreong torah, na maaari ring mangahulugang “tagubilin.” Sa kontekstong ito ng nakasulat na dokumento ng tipan, “Kautusan” ang higit na angkop.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַֽחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa modernong Filipino at pinananatili ang pagkakasunod ng mga pangyayari.
- source_word: קָרָא
  choice: binasa niya nang malakas
  rationale: Sa konteksto ng hayagang pagbigkas sa buong kapulungan, tumutukoy ang pandiwa sa pampublikong pagbasa; nililinaw ng “nang malakas” ang ipinahihiwatig ng konteksto nang hindi ginagawang simpleng pagpapahayag lamang.
- source_word: אֶת כָּל דִּבְרֵי הַ/תּוֹרָה
  choice: ang lahat ng salita ng Kautusan
  rationale: Pinananatili ng “mga salita” ang kongkretong diwa ng דִּבְרֵי, samantalang ang “Kautusan” ang angkop sa konteksto ng nakasulat na dokumento ng tipan.
- source_word: הַ/בְּרָכָה וְ/הַ/קְּלָלָה
  choice: ang pagpapala at ang sumpa
  rationale: Tuwirang pinananatili ang mga isahang kategorya ng pagpapala at sumpa sa tipan, nang walang idinaragdag na salitang gaya ng “pormula.”
- source_word: כְּ/כָל הַ/כָּתוּב
  choice: ayon sa lahat ng nakasulat
  rationale: Ipinahahayag nito ang pagsunod ng pagbasa sa kabuuan ng nakasulat na pamantayan.
- source_word: בְּ/סֵפֶר הַ/תּוֹרָה
  choice: sa Aklat ng Kautusan
  rationale: Ang סֵפֶר ay nakasulat na dokumento o aklat; ang parirala ay natural at marangal na tawag sa dokumentong tinutukoy sa salaysay.
theological_decisions:
- issue: Saklaw ng “lahat ng salita ng Kautusan” kaugnay ng “pagpapala at sumpa”
  choice: Pinanatili ang mga parirala sa apposition sa pamamagitan ng mga gitling, nang hindi tahasang sinasabing ang pagpapala at sumpa lamang ang buong nilalaman.
  alternative: Isalin na “kabilang ang pagpapala at sumpa,” o ipakahulugang ang dalawang ito lamang ang binasa.
  rationale: Maaaring maunawaan ang Hebreo na ang “pagpapala at sumpa” ay paglalarawan o pagbubuod sa binasang Kautusan. Pinananatili ng anyo ang ugnayan at ang bahagyang ambiguwidad nito.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “binasa nang malakas” upang likas na maipahayag ang pampublikong pagbasa sa konteksto. Naka-capitalize ang “Kautusan” at “Aklat ng Kautusan” bilang kinikilalang katawagan sa dokumento sa salaysay.
