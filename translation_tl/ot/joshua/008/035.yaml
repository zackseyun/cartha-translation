base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: tl
  text: Sa lahat ng iniutos ni Moises, walang kahit isang salita ang hindi binasa ni Josue sa harap ng buong kapulungan ng Israel, at ng mga babae, maliliit na bata, at ng dayuhang naninirahan sa gitna nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dayuhan” dito ay tumutukoy sa isang dayuhang naninirahan sa Israel bilang bahagi ng pamayanan. Nasa isahang anyo ang Hebreo, ngunit maaari itong tumukoy sa gayong mga taong naninirahan sa kanilang gitna sa pangkalahatan.
    reason: cultural_note
lexical_decisions:
- source_word: דָבָר
  choice: salita
  rationale: Ang “salita” ang pinakanababagay sa konteksto ng mga utos na binasa nang malakas; pinananatili rin nito ang ugnayan sa pandiwang “binasa.”
- source_word: צִוָּה
  choice: iniutos
  rationale: Ipinahahayag nito ang awtoridad ng mga tagubilin ni Moises sa konteksto ng kautusan at tipan.
- source_word: קָרָא
  choice: binasa
  rationale: Ang konteksto ay hayagang pagbasa ng kautusan, kaya mas tiyak dito ang “binasa” kaysa “ipinahayag” o “isinigaw.”
- source_word: נֶגֶד
  choice: sa harap ng
  rationale: Natural itong Filipino para sa gawaing isinagawa sa presensya ng buong kapulungan.
- source_word: קְהַל
  choice: kapulungan
  rationale: Ipinahahayag nito ang Israel bilang pormal na nagkatipong sambayanan nang hindi nag-aangkat ng kalaunang katawagang pansimbahan.
- source_word: הַטַּף
  choice: maliliit na bata
  rationale: Nililinaw nito na ang tinutukoy ay mga batang musmos o maliliit, hindi lamang mga anak sa pangkalahatan.
- source_word: הַגֵּר
  choice: mga dayuhan
  rationale: Sa talatang ito, ang גֵּר ay hindi basta estranghero kundi dayuhang nakikipamayan sa Israel; ginamit ang maramihang anyo sa Filipino upang maipahayag ang pangkalahatan o kolektibong diwa ng Hebreong isahan.
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: naninirahan sa gitna nila
  rationale: Bagaman literal na may larawang “lumalakad sa gitna nila,” idiomatiko itong tumutukoy sa pamumuhay o pakikipamayan sa loob ng komunidad.
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: walang kahit isang ... ang hindi
  rationale: 'Pinananatili ng likas na dobleng pagtanggi sa Filipino ang mariing kabuuan ng Hebreo: binasa ni Josue ang lahat nang walang iniwan.'
theological_decisions:
- issue: Saklaw ng pampublikong pagtuturo ng tipan
  choice: Hayagang pinangalanan ang mga babae, maliliit na bata, at mga dayuhang nakikipamayan bilang kasama sa buong kapulungan na nakarinig ng pagbasa.
  alternative: Isama lamang sila nang di-tuwiran sa pangkalahatang pariralang “buong Israel.”
  rationale: Tahasan silang itinatala ng Hebreo pagkatapos ng “buong kapulungan ng Israel,” kaya hindi dapat burahin ng salin ang diin sa kanilang pagkakasama.
- issue: Diwa ng Hebreong dobleng pagtanggi
  choice: “Walang kahit isang salita ang hindi binasa”
  alternative: “Binasa ni Josue ang bawat salita”
  rationale: Pareho ang pangkalahatang kahulugan, ngunit mas mahusay na pinananatili ng napiling anyo ang mariing istruktura at retorikal na diin ng Hebreo nang nananatiling natural sa Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mariing dobleng pagtanggi ng Hebreo, samantalang isinalin nang idiomatiko ang pariralang literal na “lumalakad sa gitna nila” bilang “naninirahan sa gitna nila.”
