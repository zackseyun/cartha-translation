base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: tl
  text: Isinugo ni Josue ang mga ito[a], at nagpunta sila sa lugar ng pananambang at nanatili sa pagitan ng Bethel at Ai, sa kanluran ng Ai. At nagpalipas si Josue ng gabing iyon sa gitna ng mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pangkat na nananambang.” Ang salitang Hebreo ay maaaring tumukoy sa pangkat na nananambang o sa lugar ng pananambang; sa kontekstong ito, mas malamang na tumutukoy ito sa lugar na pinuwestuhan nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: pinapunta sila
  rationale: Ang שלח ay nangangahulugang isinugo o pinayaong pumunta. Ang “pinapunta sila” ay natural sa modernong Filipino at malinaw sa konteksto.
- source_word: הַמַּאְרָב
  choice: lugar ng pananambang
  rationale: Maaaring tumukoy ang pangngalan sa pangkat na nananambang o sa kinalalagyan nito. Dahil pumunta roon ang mga lalaki at nanatili roon, malinaw at natural ang lokatibong diwa.
- source_word: וַיֵּשְׁבוּ
  choice: nanatili
  rationale: Ang ישב ay maaaring mangahulugang umupo, manirahan, o manatili. Sa salaysay-militar na ito, tumutukoy ito sa pananatili nila sa kanilang puwesto nang hindi labis na nagpapakahulugan.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: sa pagitan ng Bethel at Ai
  rationale: Tuwirang pahayag ito ng lokasyon; pinanatili ang karaniwang transliterasyon ng mga pangalan ng lugar.
- source_word: מִיָּם לָעָי
  choice: sa kanluran ng Ai
  rationale: Bagaman literal na “dagat” ang יָם, sa heograpikong gamit ay nangangahulugan itong kanluran.
- source_word: וַיָּלֶן
  choice: nanatili
  rationale: Ang לון ay tumutukoy sa pananatili o pagpapalipas ng gabi. Kasama ng pariralang “nang gabing iyon,” likas at malinaw ang “nanatili.”
- source_word: בַּלַּיְלָה הַהוּא
  choice: nang gabing iyon
  rationale: Natural na temporal na katumbas sa modernong Filipino.
- source_word: בְּתוֹךְ הָעָם
  choice: sa gitna ng mga tao
  rationale: Tumpak na ipinahahayag ang pagiging kasama at nasa loob ng pangkat; dignified at karaniwan sa Filipino.
