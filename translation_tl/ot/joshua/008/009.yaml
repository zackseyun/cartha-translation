translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Josue,” “Bethel,” at “Ai” bilang pamilyar na anyo ng mga pangalan. Pinanatili ang payak na pang-ugnay na “At” sa huling pangungusap upang hindi magdagdag ng diwang pagsalungat na wala sa Hebreo.
