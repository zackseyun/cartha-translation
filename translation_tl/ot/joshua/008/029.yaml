  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: tl
  text: At ibinitin ni Josue ang hari ng Ai sa isang puno hanggang sa gabi.[a] Sa paglubog ng araw, nag-utos si Josue, at ibinaba nila mula sa puno ang bangkay niya. Itinapon nila ito sa bungad ng tarangkahan ng lungsod, at nagpatong sila sa ibabaw nito ng isang malaking bunton ng mga bato. Ang bunton ay nananatili hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isinabit”; ang pandiwang Hebreo ay nangangahulugang “ibitin” o “isabit” at hindi nito tiyak na sinasabi kung ang hari ay pinatay sa pagbitin o ibinitin matapos mamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּלָה
  choice: ibinitin
  rationale: Ang pandiwa ay nangangahulugang ibitin o isabit. Hindi nito tiyak na sinasabi kung pagbitay o pagpapako ang paraan, kaya pinanatili ang mas malawak na kahulugan.
- source_word: הָעֵץ
  choice: isang puno
  rationale: Karaniwang nangangahulugan ang עֵץ ng puno o kahoy. Ang 'puno' ang payak at likas na salin, nang hindi ipinapalagay ang isang tiyak na uri ng kahoy na estruktura.
- source_word: עַד עֵת הָעָרֶב
  choice: hanggang sa gabi
  rationale: Likas itong Filipino at tapat sa panandang temporal na umaabot hanggang gabi.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: Pagsapit ng paglubog ng araw
  rationale: Ipinapahayag ng Hebreong idyoma ang pagsapit ng sunset; malinaw at natural ang salin sa modernong Filipino.
- source_word: נִבְלָתוֹ
  choice: ang bangkay nito
  rationale: Ang נְבֵלָה ay patay na katawan. Pinananatili ng 'bangkay' ang tahasang diwa nang hindi nagiging di-natural.
- source_word: וַיַּשְׁלִיכוּ אוֹתָהּ
  choice: Itinapon nila iyon
  rationale: Ang pambabaeng hulapi ay tumutukoy sa pambabaeng pangngalang נְבֵלָה. Ang 'iyon' ay natural na pantukoy sa bangkay sa Filipino.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: sa pasukan ng tarangkahan ng lungsod
  rationale: Pinananatili nito ang parehong ideya ng pasukan at tarangkahan, at malinaw na tumutukoy sa lugar sa bungad ng tarangkahan.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: isang malaking bunton ng mga bato
  rationale: Ang גַּל ay bunton o tumpok. Ang 'bunton ng mga bato' ay malinaw at madaling maunawaan.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: naroon pa rin hanggang sa araw na ito
  rationale: Nililinaw ang ipinahihiwatig na patuloy na pag-iral ng bunton hanggang sa panahon ng tagapagsalaysay.
theological_decisions:
- issue: Paksa ng pambungad na sugnay
  choice: 'Si Josue ang tahasang pinangalanang paksa: ''ibinitin ni Josue'''
  alternative: 'Panatilihin ang panghalip lamang: ''ibinitin niya,'' o gawing maramihan: ''ibinitin nila'''
  rationale: Ang Hebreo ay may pandiwang 3ms na walang tahasang paksa, at si Josue ang pinangalanan sa kasunod na sugnay. Siya ang pinakamalamang na ipinahihiwatig na paksa; ang pagbanggit sa pangalan ay umiiwas sa malabong panghalip sa isang hiwalay na talata.
- issue: Paraan o kalagayan ng pagbitin
  choice: Hindi tinukoy kung ang hari ay pinatay sa pagbitin o ibinitin matapos mamatay
  alternative: Isalin bilang 'binitay' o 'ipinako'
  rationale: Ang תָּלָה ay nagsasaad ng pagbitin o pagsabit ngunit hindi nito rito nilulutas ang eksaktong paraan o pagkakasunod ng kamatayan. Pinananatili ng 'ibinitin' ang ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Josue' bilang karaniwang Tagalog na anyo ng pangalan at 'tarangkahan' para sa malinaw na gate ng lungsod. Pinanatili ang tahasang salitang 'bangkay' at ang ambiguwidad ng Hebreong תָּלָה.
