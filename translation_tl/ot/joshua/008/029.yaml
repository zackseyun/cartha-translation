  to: At ibinitin ni Josue ang hari ng Ai sa isang puno hanggang sa gabi.[a] Sa paglubog ng araw, nag-utos si Josue, at ibinaba nila mula sa puno ang bangkay niya. Itinapon nila ito sa bungad ng tarangkahan ng lungsod, at nagpatong sila sa ibabaw nito ng isang malaking bunton ng mga bato. Ang bunton ay nananatili hanggang sa araw na ito.
