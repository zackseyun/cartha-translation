base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: tl
  text: Agad tumindig mula sa kinaroroonan nito ang mga kawal na nag-aabang at tumakbo nang iunat niya ang kanyang kamay.[a] Pumasok sila sa lunsod, sinakop iyon, at agad nilang sinunog ang lunsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sandaling iunat niya ang kanyang kamay.” Itinatakda ng pagkakabuo sa Hebreo ang oras ng hudyat ni Josue at maaari itong isalin sa alinman sa dalawang magkalapit na paraang temporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: ang mga kawal na nag-aabang
  rationale: Ang anyong participle ay tumutukoy nang pangkatan sa puwersang nakatago at naghihintay. Mas malinaw at natural sa Filipino ang tahasang pagtukoy sa mga kawal kaysa sa abstraktong “pananambang.”
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: Agad tumindig mula sa kinaroroonan nito
  rationale: Ipinahihiwatig ng קום ang mabilis na pagkilos mula sa pagkakatago, at ng מְהֵרָה ang pagiging agaran. Pinananatili ng “nito” ang kolektibong pagkakaisip sa puwersa na nasa anyong isahan sa Hebreo.
- source_word: וַיָּרֻצוּ
  choice: tumakbo
  rationale: Ito ang tuwirang kahulugan ng pandiwa at tumutugma sa maramihang kasapi ng puwersang nag-aabang.
- source_word: כִּנְטוֹת יָדוֹ
  choice: nang iunat niya ang kanyang kamay
  rationale: Ang כ na kasama ng infinitive construct ay nagtatakda sa sandali ng hudyat. Likas sa Filipino ang “nang,” ngunit maaari rin itong maunawaan bilang “sa sandaling,” kaya inilalahad sa talababa ang temporal na alternatibo.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: Pumasok sila sa lunsod
  rationale: Natural na katumbas sa Filipino ng pagdating papasok sa isang pook ang “pumasok sa lunsod.”
- source_word: וַיִּלְכְּדוּהָ
  choice: sinakop iyon
  rationale: Sa salaysay-militar at kapag lunsod ang layon, malinaw na ipinapahayag ng “sinakop” ang pagkuha at pagkontrol dito.
- source_word: וַיְמַהֲרוּ
  choice: agad nilang
  rationale: Ginawang pang-abay upang maipahayag nang natural sa Filipino ang bilis ng kasunod na kilos.
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: sinunog ang lunsod
  rationale: Ipinapahayag ng “sinunog” ang causative na diwa ng pagsisilab o pagsusunog sa lunsod; hindi na kailangang idagdag ang “sa apoy” sa natural na Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lunsod” para sa dignified narrative register at “mga kawal na nag-aabang” upang maging kongkreto ang kolektibong puwersang tinutukoy ng Hebreo. Ang panghalip na “niya” ay nagpapanatili sa implicit na reperente sa teksto, na ayon sa konteksto ay si Josue.
