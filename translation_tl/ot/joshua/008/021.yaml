    rationale: Hindi ito karaniwang pandiwa sa modernong Filipino para sa usok. Ang «pumailanlang» ay natural at pinananatili ang imaheng ‘umakyat’ ng עָלָה.
  - severity: low
    issue: Maaaring kulang sa tiyak na pagtukoy ang «mga nag-abang.»
    rationale: Ang הָאֹרֵב ay ang ambush force. Ang «pangkat na nakaabang» ay malinaw na tumutukoy sa pangkat na nagsagawa ng pananambang.
  revised_text: Nang makita ni Josue at ng buong Israel na nabihag na ng pangkat na nakaabang ang lungsod at pumailanlang na ang usok ng lungsod, bumalik sila at pinabagsak ang mga lalaki ng Ai.
