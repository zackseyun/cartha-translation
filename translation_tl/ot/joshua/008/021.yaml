  to: Nang makita ni Josue at ng buong Israel na nabihag na ng pangkat na nakaabang ang lungsod at pumailanlang na ang usok ng lungsod, bumalik sila at pinabagsak ang mga lalaki ng Ai.
  rationale: Pinalitan ang di-likas na «pumaitaas» ng «pumailanlang» at nilinaw ang kolektibong participle na הָאֹרֵב bilang «pangkat na nakaabang.» Hindi binago ang pagkakasunod-sunod o saklaw ng mga pangyayari sa Hebreo.
