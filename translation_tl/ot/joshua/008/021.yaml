base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: tl
  text: Nang makita ni Josue at ng buong Israel na nabihag na ng pangkat na nakaabang ang lungsod at pumailanlang na ang usok ng lungsod, bumalik sila at pinabagsak ang mga lalaki ng Ai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאוּ
  choice: makita
  rationale: Pinananatili ang konkretong diwa ng pagkakita; ang sumusunod na dalawang sugnay ang nagsasaad ng kanilang nakita.
- source_word: כִּי ... וְכִי
  choice: na ... at
  rationale: Ipinakikilala ng mga pangatnig ang nilalaman ng nakita ni Josue at ng Israel.
- source_word: לָכַד הָאֹרֵב
  choice: nabihag na ng mga nag-abang
  rationale: Ang לָכַד ay pagkuha o pagbihag, at ang participle na הָאֹרֵב ay tumutukoy sa pangkat na nag-abang upang sumalakay. Likas sa Tagalog ang tahasang pagtukoy sa mga kumilos.
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Tuwirang salin ng pangngalang may pantukoy; inulit gaya sa Hebreo para sa kalinawan.
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: pumaitaas na ang usok mula sa lungsod
  rationale: Pinananatili ang larawan ng usok na umaakyat at ipinahihiwatig ng 'na' na nauna na itong nangyari bago sila bumalik.
- source_word: וַיָּשֻׁבוּ
  choice: bumalik sila
  rationale: Sa konteksto ng labanan, nagbago sila ng direksiyon upang muling harapin ang kaaway.
- source_word: וַיַּכּוּ
  choice: pinabagsak
  rationale: Inihahayag ang marahas at malamang na nakamamatay na paghampas sa digmaan nang hindi higit na tinutukoy kaysa sa pandiwang Hebreo.
- source_word: אַנְשֵׁי הָעָי
  choice: ang mga lalaki ng Ai
  rationale: Tuwirang pinananatili ang 'mga lalaki' sa Hebreo at hindi ito pinakikitid sa 'mga mandirigma.'
