translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tradisyonal at karaniwang anyong 'Josue' at ang pangalang 'Ai.' Tahasang isinalin ang kolektibong participle bilang 'mga nag-abang' upang maging natural at malinaw sa Filipino.
