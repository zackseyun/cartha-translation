  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: tl
  text: At doon, isinulat niya sa mga bato ang isang kopya ng Kautusan ni Moises[a], na isinulat ni Moises sa harap ng mga anak ni Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang pag-uulit ng Kautusan ni Moises” o “isang duplikado ng Kautusan ni Moises.” Ang salitang Hebreo ay maaaring tumukoy sa isang kopya o sa isang inulit na bersiyon.
    reason: lexical_alternative
  - marker: b
    text: O “sa presensiya ng mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: isinulat niya
  rationale: Karaniwang pandiwang nagsasaad ng pagsulat ang כתב. Hindi ginamit ang mas tiyak na “inukit” dahil hindi iyon tahasang ipinahihiwatig ng pandiwang Hebreo.
- source_word: שָׁם
  choice: doon
  rationale: Likas na katumbas sa salaysay ng pang-abay na tumutukoy sa lugar.
- source_word: עַל הָאֲבָנִים
  choice: sa mga bato
  rationale: Ipinakikita ng עַל na ang mga bato ang ibabaw na sinulatan; maikli at natural ito sa Filipino.
- source_word: אֵת מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: isang kopya ng Kautusan ni Moises
  rationale: Maaaring mangahulugan ang מִשְׁנֵה ng kopya, duplikado, o pag-uulit. Pinakamalinaw sa konteksto ng pagsulat sa mga bato ang “isang kopya,” nang hindi tinutukoy kung gaano kalawak ang nilalaman.
- source_word: תּוֹרַת מֹשֶׁה
  choice: Kautusan ni Moises
  rationale: Sa kontekstong tipan at legal, “Kautusan ni Moises” ang likas at kinikilalang katumbas, bagaman maaari ring mangahulugan ang תּוֹרָה ng “tagubilin.”
- source_word: אֲשֶׁר כָּתַב
  choice: na isinulat niya
  rationale: Pinananatili ang panghalip ng Hebreo at ang posibleng kalabuan ng tinutukoy nito, sa halip na tahasang pangalanan si Moises o si Josue.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili ang maikling pananalita ng Hebreo, na maaaring magpahiwatig ng lokasyon sa harap nila o ng paggawa nito sa kanilang presensiya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo at malinaw pa rin sa marangal na Filipino; ang “anak” sa Filipino ay hindi likas na nagtatakda ng kasarian.
theological_decisions:
- issue: Saklaw ng מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: “isang kopya ng Kautusan ni Moises,” nang hindi sinasabi kung buong Torah o isang bahagi ng kautusan ang isinulat
  alternative: “isang pag-uulit ng Kautusan ni Moises” o “isang duplikado ng Kautusan ni Moises”
  rationale: Hindi nililinaw ng talata ang lawak ng isinulat; iniiwasan ng salin ang pagpasok ng isang harmonisado o makitid na interpretasyon.
- issue: Tinutukoy ng paksa sa אֲשֶׁר כָּתַב
  choice: panatilihin ang “niya”
  alternative: tahasang “isinulat ni Moises” o “isinulat ni Josue”
  rationale: Walang nakapangalan na paksa sa sugnay na Hebreo. Ang pagpapanatili sa panghalip ay hindi tahimik na nagpapasya sa posibleng ugnayan nito kay Moises o sa gumaganap sa pangunahing sugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kopya” bilang pangkaraniwang salitang madaling maunawaan, at pinanatili ang “mga anak ni Israel” para sa pormal na pagkakalapit sa Hebreo. Ang mga talababa ay inilagay sa mismong pariralang tinutukoy ng bawat isa.
