id: JOS.8.26
reference: Joshua 8:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: tl
  text: At hindi iniurong ni Josue ang kamay niyang iniunat na may hawak na sibat hanggang sa italaga niya sa pagkapuksa ang lahat ng naninirahan sa Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hanggang sa lubusan niyang malipol ang lahat ng naninirahan sa Ai.” Ang pandiwang Hebreo ay tumutukoy sa paglalagay sa ilalim ng pagbabawal, samakatuwid, sa pagtatalaga sa pagkapuksa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: hindi iniurong
  rationale: Ang hiphil ng שוב na may יָדוֹ bilang layon ay nangangahulugang hindi niya ibinalik o iniurong ang nakaunat niyang kamay; natural sa Tagalog ang “hindi iniurong.”
- source_word: יָדוֹ
  choice: ang kamay niyang
  rationale: Pinananatili ang literal na pagtukoy sa kamay, na ikinakabit nang natural sa kasunod na sugnay.
- source_word: נָטָה
  choice: iniunat
  rationale: Tuwirang ipinapahayag ang pag-uunat o pagpapahaba ng kamay; ang aspektong naganap na ay malinaw sa kaugnay na sugnay.
- source_word: בַּכִּידוֹן
  choice: na may hawak na sibat
  rationale: Ang כידון ay isang sandatang tulad ng sibat o javelin. Mas madaling maunawaan ng karaniwang mambabasa ang “sibat,” at ipinahihiwatig ng בּ ang kaugnayan nito sa nakaunat na kamay.
- source_word: הֶחֱרִים
  choice: italaga niya sa pagkapuksa
  rationale: Pinananatili nito ang teknikal na diwa ng חרם—ang pagtatalaga sa ilalim ng pagbabawal para sa pagkapuksa—sa halip na patagin lamang bilang “lipulin.”
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: ang lahat ng naninirahan sa Ai
  rationale: Natural at malinaw na salin ng “lahat ng mga naninirahan sa Ai.”
- source_word: וִיהוֹשֻׁעַ
  choice: At ... ni Josue
  rationale: Pinananatili ang pang-ugnay at ginagamit ang nakaugaliang anyong Tagalog ng pangalan.
theological_decisions:
- issue: Pagpapahayag ng חרם sa konteksto ng hatol sa digmaan
  choice: italaga niya sa pagkapuksa ang lahat ng naninirahan sa Ai
  alternative: lubusan niyang nilipol ang lahat ng naninirahan sa Ai
  rationale: Ang napiling salin ay nagpapanatili sa natatanging legal at panrelihiyong diwa ng חרם nang hindi nagdaragdag ng paliwanag o doktrinang wala sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sibat” kaysa sa mas teknikal na “dyabelin,” at pinanatili sa pangunahing teksto ang teknikal na diwa ng חרם. Inilagay ang talababa [a] pagkatapos ng buong pahayag na tinutukoy nito.
