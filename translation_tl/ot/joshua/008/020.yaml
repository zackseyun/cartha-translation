base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: tl
  text: Paglingon ng mga lalaki ng Ai sa kanilang likuran, nakita nila na umaakyat sa langit ang usok ng lungsod.[a] Wala silang kakayahang tumakas sa alinmang direksiyon,[b] at ang mga taong tumatakas patungo sa ilang ay bumaling laban sa humahabol sa kanila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “umaakyat patungo sa kalangitan.” Ang Hebreo ay literal na nagsasaad ng direksiyong paitaas, “patungo sa langit/kalangitan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Idyoma sa Hebreo: “walang mga kamay sa kanila,” ibig sabihin, wala silang kapangyarihan o kakayahang makatakas.'
    reason: cultural_note
  - marker: c
    text: Isahan sa Hebreo ang “humahabol,” ngunit maaaring kolektibong tumukoy sa hukbong humahabol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אַנְשֵׁי הָעַי אַחֲרֵיהֶם וַיִּרְאוּ
  choice: lumingon ang mga lalaki ng Ai at nakita nila
  rationale: Pinananatili ang dalawang magkasunod na kilos—paglingon at pagkakita—sa natural na modernong Tagalog. Ang “mga lalaki ng Ai” ay tuwirang katumbas ng אַנְשֵׁי הָעַי sa kontekstong militar.
- source_word: וְהִנֵּה
  choice: nakita nilang
  rationale: Ipinahahayag sa natural na salaysay ang biglaang pagkaunawa na minamarkahan ng הִנֵּה, nang hindi gumagamit ng masyadong makalumang “narito.”
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: umaakyat sa langit ang usok mula sa lungsod
  rationale: Ang “umaakyat” ay nagpapakita ng nagpapatuloy na kilos; ang “sa langit” ay natural na katumbas ng direksiyonal na הַשָּׁמַיְמָה at sa konteksto ay tumutukoy sa kalangitan.
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: wala silang kakayahan
  rationale: Isinasalin ang idyomang Hebreo na literal na “walang mga kamay sa kanila” ayon sa kahulugan nitong wala silang kapangyarihan o kakayahang kumilos.
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: tumakas sa alinmang direksiyon
  rationale: Natural na Tagalog para sa diwang wala silang matatakasan “dito man o doon,” habang pinananatili ang ganap na kawalan ng daan ng pagtakas.
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: ang mga taong tumakas patungo sa ilang
  rationale: Tinutukoy ang pangkat ayon sa nauna nilang pagkilos. Ang “ilang” ay dignificado at karaniwang katawagan sa ilang o di-tinitirhang lupain.
- source_word: נֶהְפַּךְ אֶל הָרֹדֵף
  choice: bumalik upang harapin ang humahabol sa kanila
  rationale: Ipinakikita ang pagbaligtad ng direksiyon at ang mapanlabang pagharap. Ang isahang participle na הָרֹדֵף ay pinanatiling isahan sa “ang humahabol,” ngunit idinagdag ang “sa kanila” para sa kalinawan.
