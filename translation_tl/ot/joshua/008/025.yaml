base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: tl
  text: Ang lahat ng nabuwal noong araw na iyon, mula sa lalaki hanggang sa babae, ay labindalawang libo—ang lahat ng taga-Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng mga lalaki ng Ai.” Maaari itong maging idyomang tumutukoy sa buong populasyon o sa lahat ng naninirahan sa Ai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Ang anyo ng היה na may waw ay naghaharap dito ng buod ng kinalabasan. Likas na ipinahahayag sa Filipino sa pamamagitan ng panaguring “ay” sa halip na literal na “at nangyari.”
- source_word: כָל הַנֹּפְלִים
  choice: ang lahat ng nabuwal
  rationale: Ang participle ng נפל ay literal na tumutukoy sa mga bumagsak o nabuwal; sa konteksto ng labanan, ang tinutukoy ay ang mga namatay. Pinananatili ng “nabuwal” ang larawang Hebreo at malinaw ang diwa sa konteksto.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Karaniwan at natural na panandang temporal sa Filipino.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: mula sa lalaki hanggang sa babae
  rationale: Pinananatili ang isahang distributibong anyo at ang saklaw na tahasang binabanggit ang lalaki at babae.
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: labindalawang libo
  rationale: Tuwirang salin ng bilang.
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: ang lahat ng taga-Ai
  rationale: Bagaman literal na “lahat ng mga lalaki ng Ai,” maaari itong gumana bilang panlahatang idyoma para sa populasyon ng lunsod. Ang “taga-Ai” ay natural sa Filipino at kaayon ng naunang tahasang pagsama sa lalaki at babae; itinatala sa talababa ang literal na anyo.
theological_decisions:
- issue: Kasarian at saklaw ng buod ng mga nasawi
  choice: Panatilihin ang “mula sa lalaki hanggang sa babae,” at isalin ang pangwakas na idyoma bilang “ang lahat ng taga-Ai.”
  alternative: “ang lahat ng kalalakihan ng Ai” o “ang lahat ng naninirahan sa Ai”
  rationale: Tahasan sa Hebreo ang saklaw mula lalaki hanggang babae, samantalang ang אַנְשֵׁי הָעָי ay literal na panlalaki ngunit maaaring kolektibong tumukoy sa mga mamamayan o populasyon ng Ai. Hindi dapat ipahiwatig ng salin na mga lalaki lamang ang kabuuang labindalawang libo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nabuwal” bilang malinaw ngunit hindi labis na nagpapaliwanag na katawagan sa mga namatay sa labanan; iniwasan ang lipas na “at nangyari.”
