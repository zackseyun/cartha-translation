  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ נְ֠טֵה בַּ/כִּיד֤וֹן אֲשֶׁר בְּ/יָֽדְ/ךָ֙ אֶל הָ/עַ֔י כִּ֥י בְ/יָדְ/ךָ֖ אֶתְּנֶ֑/נָּה וַ/יֵּ֧ט יְהוֹשֻׁ֛עַ בַּ/כִּיד֥וֹן אֲשֶׁר בְּ/יָד֖/וֹ אֶל הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Josue, “Iunat mo ang sibat[a] na hawak mo patungo sa Ai, sapagkat ibibigay ko ito sa iyong kamay.” Kaya iniunat ni Josue ang sibat na hawak niya patungo sa lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sibat na panghagis.” Ang Hebreong כִּידוֹן ay tumutukoy sa sandatang maaaring isaling “sibat,” “sibat na panghagis,” o “lance,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang tinutumbasan ang banal na pangalan sa pamamagitan ng karaniwang transliterasyong Yahweh, sa halip na palitan ito ng isang titulo.
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: Iunat / iniunat
  rationale: Pinananatili ang pisikal na kilos ng pag-uunat o pagpapahaba ng sandatang hawak, nang hindi ito nililimitahan sa simpleng pagturo.
- source_word: כִּידוֹן
  choice: sibat
  rationale: Ang כידון ay sandatang maaaring tumukoy sa javelin, spear, o lance. Ang “sibat” ang pinakanatural at malawak na katumbas sa modernong Tagalog; inilalahad sa talababa ang mas tiyak na alternatibo.
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: na hawak mo / na hawak niya
  rationale: Natural na Tagalog ito para sa literal na “nasa iyong/kaniyang kamay,” habang pinananatili ang tahasang pagbanggit sa sandatang hawak.
- source_word: אֶל הָעַי / אֶל הָעִיר
  choice: patungo sa Ai / patungo sa lungsod
  rationale: Ipinahahayag ng אֶל ang direksiyon ng kilos. Pinananatili rin ang pagbabago ng Hebreo mula sa pangalang Ai tungo sa “lungsod.”
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: sapagkat ibibigay ko ito sa iyong kamay
  rationale: Pinananatili ang Hebreong idyoma ng pagbibigay sa kamay, na nangangahulugang pagpapasailalim sa kapangyarihan o pagkontrol ni Josue.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Kahulugan ng “ibibigay ko ito sa iyong kamay”
  choice: Pinanatili ang idyomang “sa iyong kamay”
  alternative: “ipapasakop ko ito sa iyo”
  rationale: Ang literal na idyoma ay malinaw sa Tagalog at pinananatili ang imahen at pormulasyon ng Hebreo nang hindi labis na ipinapaliwanag ang teolohikal na diwa ng tagumpay na ipinagkakaloob ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue,” ang nakaugaliang anyong Tagalog ng Joshua. Pinanatili ang pag-uulit at ang pagbabago mula “Ai” tungo sa “lungsod,” ngunit ginawang natural ang mga pariralang tumutukoy sa sandatang hawak.
