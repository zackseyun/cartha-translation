base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: tl
  text: At ang mga ito ay lumabas mula sa lungsod upang salubungin sila. Kaya napagitnaan ng Israel ang mga taga-Ai—ang mga ito sa isang panig at ang mga iyon sa kabila.[a] Pinabagsak nila ang mga taga-Ai hanggang wala silang iniwang kahit isang nakaligtas o nakatakas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga ito mula sa panig na ito at ang mga iyon mula sa panig na iyon,” na naglalarawang napalibutan sila ng mga pangkat ng Israel mula sa magkabilang panig.
    reason: lexical_alternative
  - marker: b
    text: 'Ang huling sugnay sa Hebreo ay gumagamit ng di-karaniwang isahang pandiwa at panghalip: sa mas literal na anyo, “hanggang hindi siya nag-iwan para sa kaniya ng isang nakaligtas o nakatakas.” Maaaring kolektibong pagtukoy ito sa Israel o sa mga taga-Ai.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ang mga ito
  rationale: Pinananatili ang tahasang panturong pananalita na tumutukoy sa pangkat ng Israel na nanambang at naunang binanggit.
- source_word: יָצְאוּ מִן־הָעִיר
  choice: ay lumabas mula sa lungsod
  rationale: Tuwirang inilalarawan ang paglabas ng pangkat mula sa Ai patungo sa labanan.
- source_word: לִקְרָאתָם
  choice: upang salubungin sila
  rationale: Ang 'salubungin' ay likas sa Tagalog at maaaring magpahiwatig ng pakikipagharap; ang kontekstong pandigma ang nagpapalinaw sa mapanlabang diwa.
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: Kaya napagitnaan ng Israel ang mga taga-Ai
  rationale: 'Ipinahahayag nang malinaw at natural ang bunga ng kilos: ang hukbo ng Ai ay nasa pagitan ng dalawang pangkat ng Israel. Ang tahasang ''mga taga-Ai'' ay nililinaw ang reperente mula sa konteksto.'
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: ang mga ito sa isang panig at ang mga iyon sa kabila
  rationale: Pinananatili ang magkatapat na panturo at ang larawan ng pagkakulong sa pagitan ng dalawang panig.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Pinabagsak nila ang mga taga-Ai
  rationale: Sa kontekstong pandigma, ang נכה ay tumutukoy sa marahas at nakamamatay na paggapi. Ang 'pinabagsak' ay nagpapanatili sa lakas nito nang hindi ginagawang simpleng katumbas lamang ng 'pinatay.'
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: hanggang wala silang iniwang
  rationale: Natural na ipinapahayag sa Tagalog ang sukdulang resulta. Ginawang maramihan ang gumagawa ayon sa kolektibong hukbo ng Israel, habang itinatala sa talababa ang di-karaniwang isahang anyo ng Hebreo.
- source_word: שָׂרִיד וּפָלִיט
  choice: nakaligtas ni nakatakas
  rationale: 'Pinananatiling magkahiwalay ang dalawang ideya: ang nanatiling buhay at ang nakatakas mula sa labanan.'
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang 'lungsod' at mga payak na pandiwang pandigma; nilinaw lamang ang mga reperenteng kailangan para maiwasan ang nakalilitong sunod-sunod na panghalip, habang inilagay sa talababa ang di-karaniwang isahang sintaks ng Hebreo.
