revisions:
- from: At ang lahat ng mandirigmang kasama niya ay umahon at lumapit. Pumunta sila sa tapat ng lungsod at nagkampo sa hilaga ng Ai, habang ang lambak ay nasa pagitan niya at ng Ai.[a]
  to: At ang lahat ng mandirigmang kasama niya ay umakyat at lumapit, at pumunta sila sa tapat ng lungsod at nagkampo sa hilaga ng Ai; ang lambak ay nasa pagitan niya at ng Ai.[a]
  rationale: Pinalitan ang imperpektibong “umaahon” ng perpektibong “umakyat” upang maitugma ang aspektong pasalaysay ng Hebreo. Pinalitan ang “habang” ng lokasyonal na pahayag upang malinaw na ang lambak, hindi isang pangyayaring kasabay, ang nasa pagitan. Walang binago sa sinadyang pagpapanatili ng pang-isahang panghalip o sa talababa nito.
