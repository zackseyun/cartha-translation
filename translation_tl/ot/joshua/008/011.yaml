base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: tl
  text: At ang lahat ng mandirigmang kasama niya ay umakyat at lumapit, at pumunta sila sa tapat ng lungsod at nagkampo sa hilaga ng Ai; ang lambak ay nasa pagitan niya at ng Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagitan niya at ng Ai.” Malamang na tumutukoy kay Josue ang pang-isahang panghalip, bagaman inuunawa ito ng ilan sa kolektibong diwang “sa pagitan nila at ng Ai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: ang lahat ng mandirigma
  rationale: Tumutukoy ang parirala sa buong pangkat ng mga lumalaban, hindi sa mga sibilyan. Likas at malinaw sa Filipino ang “mga mandirigma,” at hindi nito dinaragdagan ang Hebreo ng tahasang pagtukoy sa kasarian.
- source_word: אֲשֶׁר אִתּוֹ
  choice: kasama niya
  rationale: Maikli at natural na salin ng sugnay na tumutukoy sa mga hukbong kasama ni Josue.
- source_word: עָלוּ
  choice: umahon
  rationale: Pinananatili ang payak na diwang direksiyon ng עלה na “umakyat/umahon” nang hindi ito ginagawang mas interpretatibong “nagmartsa.”
- source_word: וַיִּגְּשׁוּ
  choice: lumapit
  rationale: Malinaw at karaniwang katumbas ng נגשׁ, na nangangahulugang lumapit o dumaong nang malapit.
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: Pumunta sila sa tapat ng lungsod
  rationale: Ipinahahayag ng “sa tapat” ang posisyong kaharap o nasa harapan ng lungsod, hindi ang pagpasok dito.
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Natural at kasalukuyang Filipino para sa pagtatayo o pananatili sa kampo.
- source_word: מִצְּפוֹן לָעַי
  choice: sa hilaga ng Ai
  rationale: Direkta at natural na pagpapahayag ng lokasyon kaugnay ng Ai.
- source_word: הַגַּי
  choice: ang lambak
  rationale: Malawak at madaling maunawaang katumbas ng גַּי; ang “bangin” ay posibleng salin ngunit mas tiyak kaysa sa hinihingi ng konteksto.
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: sa pagitan niya at ng Ai
  rationale: Pinananatili ang mahirap ngunit tunay na pang-isahang panlalaking hulapi sa tekstong Hebreo. Malamang na si Josue ang tinutukoy, bagaman maaari itong unawain sa kolektibong diwa.
