  text: וְ/לֹֽא נִשְׁאַ֣ר אִ֗ישׁ בָּ/עַי֙ וּ/בֵ֣ית אֵ֔ל אֲשֶׁ֥ר לֹֽא יָצְא֖וּ אַחֲרֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעַזְב֤וּ אֶת הָ/עִיר֙ פְּתוּחָ֔ה וַֽ/יִּרְדְּפ֖וּ אַחֲרֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: tl
  text: Walang kahit isang lalaking naiwan sa Ai o Bethel na hindi lumabas upang habulin ang Israel[b]. Iniwan nilang bukás ang lungsod[a] at hinabol ang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas malayang salin, “Iniwan nilang walang bantay ang lungsod.” Literal na mababasa sa Hebreo, “bukás ang lungsod.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kahit isang lalaki” ay salin ng Hebreong אִישׁ, isang panlalaking anyong isahan na maaaring gamitin dito sa pangkalahatang diwa para sa sinumang naiwan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: Walang kahit isang lalaking naiwan
  rationale: Pinananatili ang pasibong diwa ng נִשְׁאַר at ang panlalaking isahan ng אִישׁ, habang natural pa rin sa makabagong Tagalog.
- source_word: בָּעַי וּבֵית אֵל
  choice: sa Ai o Bethel
  rationale: Sa saklaw ng negatibong pahayag, likas sa Tagalog ang “o” upang ipahiwatig na walang naiwan sa alinman sa dalawang lugar.
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: na hindi lumabas upang habulin ang Israel
  rationale: Isinasalin ang paglabas at ang militar na diwa ng pagpunta kasunod ng Israel nang malinaw at natural.
- source_word: וַיַּעַזְבוּ
  choice: Iniwan nila
  rationale: Payak at tuwirang salin ng עזב na angkop sa salaysay.
- source_word: הָעִיר פְּתוּחָה
  choice: bukás ang lungsod
  rationale: Pinananatili ang kongkretong larawan ng Hebreong פְּתוּחָה, sa halip na agad itong ipakahulugang “walang bantay.”
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: hinabol ang Israel
  rationale: Ang “hinabol” ay natural na makabagong Tagalog para sa רדף sa kontekstong militar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bukás” na may tuldik upang hindi mapagkamalang “bukas” na tumutukoy sa susunod na araw. Inayos ang mga marker ayon sa salitang ipinapaliwanag ng bawat talababa.
