revisions:
- from: At hahabulin nila tayo hanggang sa mailayo natin sila sa lungsod.[a] Sapagkat sasabihin nila, ‘Tumatakas sila sa harap natin gaya noong una,’[b] kaya tatakas tayo sa harap nila.
  to: Lalabas sila at hahabulin tayo hanggang sa mailayo natin sila mula sa lungsod.[a] Sapagkat sasabihin nila, ‘Tumatakas sila palayo sa atin gaya noong una,’[b] at tatakas tayo palayo sa kanila.
  rationale: Idinagdag ang “Lalabas sila” upang maisalin ang unang pandiwang Hebreo at pinalitan ang “kaya” ng “at” upang hindi magdagdag ng sanhi-bungang ugnayan. Ginawang “palayo sa” ang idyomang “sa harap ng” para sa likas na Tagalog, habang pinanatili ang magkatugmang anyo sa magkabilang panig ng talata. Inayos din ang talababa upang ilarawan ang naunang pag-atras nang hindi labis na tinatawag itong “pagtakas.”
