base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: tl
  text: Lalabas sila at hahabulin tayo hanggang sa mailayo natin sila mula sa lungsod.[a] Sapagkat sasabihin nila, ‘Tumatakas sila palayo sa atin gaya noong una,’[b] at tatakas tayo palayo sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “hanggang sa maakay natin silang lumayo mula sa lungsod.” Ang pandiwang Hebreo ay nangangahulugang hilahin o ilayo; mas tahasang ipinakikita ng “maakay” ang taktika.
    reason: lexical_alternative
  - marker: b
    text: Ang “gaya noong una” ay tumutukoy sa naunang pag-atras ng Israel sa harap ng Ai (tingnan ang Josue 7:4–5).
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: At hahabulin nila tayo
  rationale: Sa kontekstong militar, ang literal na paglabas nila ‘kasunod natin’ ay likas na ipinahahayag sa modernong Tagalog bilang paghabol; pinananatili nito ang direksiyon at layunin ng kilos.
- source_word: עַד הַתִּיקֵנוּ אוֹתָם מִן הָעִיר
  choice: hanggang sa mailayo natin sila sa lungsod
  rationale: Ang Hiphil ng נתק ay nagpapahiwatig ng paghila o paglalayo. Ang ‘mailayo’ ay natural at hindi tahasang nagdaragdag ng interpretibong ideya ng panlilinlang.
- source_word: כִּי יֹאמְרוּ
  choice: Sapagkat sasabihin nila
  rationale: Ipinakikita ng כִּי ang dahilan kung bakit gagana ang taktika; malinaw at marangal sa Tagalog ang ‘sapagkat.’
- source_word: נָסִים לְפָנֵינוּ
  choice: Tumatakas sila sa harap natin
  rationale: Ang participle ay nagsasaad ng nagpapatuloy na kilos. Pinananatili ng ‘sa harap natin’ ang Hebreong idyoma at ang pagkakatulad nito sa hulíng parirala.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: gaya noong una
  rationale: Tumutukoy ito sa naunang pag-atras ng Israel laban sa Ai; ang parirala ay maikli at pinananatili ang tiyak na pagtukoy sa unang pagkakataon.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: kaya tatakas tayo sa harap nila
  rationale: Ang planadong kilos ay natural na nasa aspektong panghinaharap. Ang ‘kaya’ ay naghahayag ng praktikal na kasunod na hakbang sa plano, habang ang ‘sa harap nila’ ay nagpapanatili ng paralelismo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘lungsod’ at ‘sapagkat’ para sa dignidad ng salaysay, ngunit iniwasan ang lipas o labis na pormal na balangkas. Pinanatili ang magkatugmang ‘sa harap natin / sa harap nila.’
