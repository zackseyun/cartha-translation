  text: So Joshua burned Ai and made it a permanent mound[a], a desolation to this day.
translation:
  language: tl
  text: Sinunog ni Josue ang Ai at ginawa niya itong isang bunton na mananatili magpakailanman[a], isang tiwangwang na lugar hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang bunton na mananatili sa napakahabang panahon.” Ang Hebreong עוֹלָם ay maaaring tumukoy sa napakahaba o walang takdang panahon, at madalas ding isinasaling “magpakailanman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: sinunog
  rationale: Tuwirang ipinapahayag ng pandiwang שׂרף ang pagsunog sa apoy; natural at malinaw ang “sinunog” sa salaysay.
- source_word: הָעָי
  choice: Ai
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa karaniwang transliterasyong “Ai.”
- source_word: וַיְשִׂימֶהָ
  choice: ginawa itong
  rationale: Ang שׂים na may hulaping tumutukoy sa pambabaeng isahan ay may resultang diwang “ginawa itong,” na angkop sa kasunod na panaguri.
- source_word: תֵּל
  choice: bunton
  rationale: Ang תֵּל ay bunton, lalo na ang nakaumbok na labi ng isang nawasak na lunsod. Maikli at madaling maunawaan ang “bunton” nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: עוֹלָם
  choice: mananatili magpakailanman
  rationale: Ipinahahayag ng עוֹלָם ang napakahaba o walang takdang pananatili. Pinananatili ng parirala ang lakas at tunay na lawak ng salitang Hebreo, habang nililinaw ng talababa na maaari itong tumukoy sa di-tiyak na mahabang panahon.
- source_word: שְׁמָמָה
  choice: isang lugar na wasak
  rationale: Ang pangngalan ay tumutukoy sa pagkawasak o kalagayang tiwangwang. Natural sa modernong Filipino ang “isang lugar na wasak” bilang ikalawang paglalarawan sa Ai.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Malapit ito sa anyo ng idyomang Hebreo at malinaw na tumutukoy sa panahon ng tagapagsalaysay.
