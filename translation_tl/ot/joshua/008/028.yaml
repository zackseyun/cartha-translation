translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue” bilang nakaugaliang anyo ng pangalan sa Tagalog at ang “Ai” bilang pangalan ng lugar. Pinanatili ang pag-uulit ng dalawang paglalarawan—bunton at lugar na wasak—na nasa Hebreo.
