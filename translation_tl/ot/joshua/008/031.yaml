  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: tl
  text: 'gaya ng iniutos ni Moises, na lingkod ni Yahweh, sa mga anak ni Israel, ayon sa nakasulat sa Aklat ng Kautusan ni Moises: isang altar na yari sa mga batong buo pa rin[a], na hindi ginamitan ng kasangkapang bakal. Sa ibabaw nito ay naghandog sila kay Yahweh ng mga handog na sinusunog nang buo, at nag-alay sila ng mga handog para sa kapayapaan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga batong hindi tinabas.” Literal na “mga batong buo,” na nagbibigay-diin na iniwang buo ang mga bato at hindi hinubog sa pamamagitan ng bakal.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga handog para sa pakikisama” o “mga handog para sa kagalingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר צִוָּה
  choice: gaya ng iniutos
  rationale: Ipinahahayag nito na ang ginawa ay alinsunod sa naunang utos; likas sa modernong Tagalog at pinananatili ang paghahambing ng Hebreo.
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Ang “lingkod” ay angkop sa marangal na titulong ibinigay kay Moises at hindi labis na itinatampok ang kahulugang pagkaalipin.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilya at pangkalahatang katawagan ng Hebreo sa halip na gawing simpleng “mga Israelita.”
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: sa Aklat ng Kautusan ni Moises
  rationale: Malinaw at pormal na salin na pinananatili kapwa ang “aklat” at ang “kautusan/tagubilin.”
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: isang altar na yari sa mga batong buo
  rationale: Ang “buo” ay malapit sa שְׁלֵמוֹת at nagpapahiwatig na ang mga bato ay iniwang walang pagbabago; inilagay sa talababa ang mas interpretibong “hindi tinabas.”
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: na hindi ginamitan ng kasangkapang bakal
  rationale: Ipinahahatid nang malinaw ang idyomang Hebreo tungkol sa hindi pag-angat o paggamit ng bakal laban sa mga bato.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog nang buo
  rationale: Tinutukoy nito ang natatanging handog na lubusang sinusunog, hindi lamang anumang handog na inilalagay sa apoy.
- source_word: שְׁלָמִים
  choice: mga handog para sa kapayapaan
  rationale: Pinananatili ang tradisyonal na kaugnayan sa kapayapaan habang inilalahad sa talababa ang saklaw na pakikisama at kagalingan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Pangkalahatang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ang hayag na pampamilya at pangkalahatang anyo ng Hebreo nang hindi ipinapalagay na mga lalaki lamang ang tinutukoy.
- issue: Saklaw ng katawagang pansakripisyo na שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa pakikisama; mga handog para sa kagalingan
  rationale: May saklaw ang salita na kinabibilangan ng kapayapaan, pakikisama, at kagalingan; kaya pinili ang isang makikilalang salin at pinanatili sa talababa ang ibang posibleng diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” isang karaniwan at madaling maunawaang terminong biblikal. Pinanatili ang pambungad na “gaya ng” sapagkat ipinagpapatuloy ng talata ang kilos sa naunang talata; ginamit ang tutuldok upang luminaw ang pagkakaugnay ng utos at ng uri ng altar.
