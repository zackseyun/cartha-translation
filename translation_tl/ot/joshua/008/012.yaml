  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֕ח כַּ/חֲמֵ֥שֶׁת אֲלָפִ֖ים אִ֑ישׁ וַ/יָּ֨שֶׂם אוֹתָ֜/ם אֹרֵ֗ב בֵּ֧ין בֵּֽית אֵ֛ל וּ/בֵ֥ין הָ/עַ֖י מִ/יָּ֥ם לָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/012.yaml
  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: tl
  text: Kumuha siya ng humigit-kumulang limang libong lalaki[a] at inilagay niya silang nakatambang sa pagitan ng Betel at Ai, sa kanluran ng lungsod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “humigit-kumulang limang libong lalaki”; ang unlaping כ sa salitang “lima” ay malamang na nagpapahiwatig ng pagtatantiya, hindi ng eksaktong bilang.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mula sa dagat ng lungsod.” Ginagamit dito ang “dagat” bilang katawagan para sa “kanluran.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kumuha siya
  rationale: Ang לָקַח sa sunod-sunod na salaysay ay karaniwang nangangahulugang “kumuha.” Maaaring ipinahihiwatig ng kontekstong militar na pumili siya mula sa mas malaking hukbo, ngunit hindi iyon tahasang nililinaw ng Hebreo.
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: humigit-kumulang limang libong lalaki
  rationale: Ang unlaping כ sa bilang ay nagpapahiwatig ng pagtatantiya, kaya pinanatili ang di-eksaktong dami. Ang אִישׁ pagkatapos ng bilang ay kolektibong tumutukoy sa mga lalaki.
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: at inilagay niya silang nakatambang
  rationale: Ang שׂים ay “ilagay,” at ang אֹרֵב ay tumutukoy sa pagtambang o sa pangkat na nag-aabang upang sumalakay. Ang “inilagay niya silang nakatambang” ay natural sa Filipino at hindi nagdaragdag ng di-tahasang detalye.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: sa pagitan ng Betel at Ai
  rationale: Tuwirang lokatibong parirala; ginamit ang karaniwang anyong Filipino ng mga pangalang Betel at Ai.
- source_word: מִיָּם לָעִיר
  choice: sa kanluran ng lungsod
  rationale: Ang יָם, na literal na “dagat,” ay ginagamit bilang heograpikong katawagan para sa “kanluran.” Malinaw na inilalarawan ng parirala ang kinaroroonan ng pangkat kaugnay ng lungsod.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakatambang” bilang likas na paglalarawan ng isang pangkat na inilagay upang mag-abang at biglang sumalakay; pinanatili rin ang tinatayang bilang sa Hebreo.
