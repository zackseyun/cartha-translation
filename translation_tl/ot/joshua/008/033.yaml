revisions:
- from: Ang buong Israel[a]—kasama ang kanilang matatandang pinuno, mga opisyal, at mga hukom—ay nakatayo sa magkabilang panig ng Kaban, kaharap ng mga paring Levita na may pasan sa Kaban ng Tipan ni Yahweh. Naroon kapuwa ang dayuhang naninirahan at ang katutubong Israelita. Ang kalahati nila ay nakaharap sa Bundok Gerizim, at ang kalahati naman ay nakaharap sa Bundok Ebal, ayon sa iniutos noong una[b] ni Moises na lingkod ni Yahweh, upang pagpalain ang bayang Israel.
  to: Ang buong Israel—kasama ang kanilang mga nakatatanda, mga opisyal, at mga hukom—ay nakatayo sa magkabilang panig ng Kaban, kaharap ng mga paring Levita na nagdadala ng Kaban ng Tipan ni Yahweh. Naroon kapuwa ang dayuhang naninirahan at ang katutubong mamamayan[a]. Ang kalahati nila ay nakaharap sa Bundok Gerizim, at ang kalahati naman ay nakaharap sa Bundok Ebal, ayon sa iniutos noon[b] ni Moises na lingkod ni Yahweh, na basbasan ang bayang Israel.
  rationale: Ginawa ang ligtas na pagwawasto upang maging malinaw na ang mga paring Levita ang nagdadala ng Kaban. Inayos ang anchor ng talababa a upang tumukoy ito sa mga katagang may kaugnayang leksikal. Pinanatili ang kalabuan ng “noon/ noong una” sa pangunahing teksto at talababa, pati ang pagkakasunod at saklaw ng seremonyal na paglalarawan.
