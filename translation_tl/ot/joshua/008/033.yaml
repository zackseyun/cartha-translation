source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֡ל וּ/זְקֵנָ֡י/ו וְ/שֹׁטְרִ֣ים וְ/שֹׁפְטָ֡י/ו עֹמְדִ֣ים מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לָ/אָר֡וֹן נֶגֶד֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם נֹשְׂאֵ֣י אֲר֣וֹן בְּרִית יְהוָ֗ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח חֶצְי/וֹ֙ אֶל מ֣וּל הַר גְּרִזִ֔ים וְ/הַֽ/חֶצְי֖/וֹ אֶל מ֣וּל הַר עֵיבָ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֜ה מֹשֶׁ֣ה עֶֽבֶד יְהוָ֗ה לְ/בָרֵ֛ךְ אֶת הָ/עָ֥ם יִשְׂרָאֵ֖ל בָּ/רִאשֹׁנָֽה־׀׀׀׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: tl
  text: Ang buong Israel—kasama ang kanilang mga nakatatanda, mga opisyal, at mga hukom—ay nakatayo sa magkabilang panig ng Kaban, kaharap ng mga paring Levita na nagdadala ng Kaban ng Tipan ni Yahweh. Naroon kapuwa ang dayuhang naninirahan at ang katutubong mamamayan[a]. Ang kalahati nila ay nakaharap sa Bundok Gerizim, at ang kalahati naman ay nakaharap sa Bundok Ebal, ayon sa iniutos noon[b] ni Moises na lingkod ni Yahweh, na basbasan ang bayang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang residenteng dayuhan at ang katutubong ipinanganak.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “noong una.” Maaaring ang ibig sabihin ay “bilang unang gawain,” o maaaring tumukoy ito sa naunang utos ni Moises tungkol sa pagpapala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Ang buong Israel
  rationale: Likas sa modernong Tagalog at pinananatili ang kolektibong diwa ng buong kapulungan.
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: kasama ang kanilang matatandang pinuno, mga opisyal, at mga hukom
  rationale: Nililinaw ng 'kanilang' na ang mga pinunong ito ay kabilang sa Israel; ang 'matatandang pinuno' ay mas malinaw kaysa sa literal na 'matatanda' lamang.
- source_word: מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: sa magkabilang panig ng Kaban
  rationale: Maikli at natural na katumbas sa Tagalog ng distributibong lokasyong nasa magkabilang panig ng kaban.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: mga paring Levita
  rationale: Pinananatili ang ugnayan ng mga pari sa mga Levita nang hindi nagpapasya nang higit sa maaaring appositional na Hebreo.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: na may pasan sa Kaban ng Tipan ni Yahweh
  rationale: Ang 'may pasan' ay tuwirang naglalarawan sa kasalukuyang kilos ng participle at angkop sa pisikal na pagdadala ng kaban.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: kapuwa ang dayuhang naninirahan at ang katutubong Israelita
  rationale: Ipinahahayag ang magkapantay na pagsama ng residenteng dayuhan at ng katutubo; idinagdag ang 'Israelita' upang maging malinaw ang konteksto ng אֶזְרָח.
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: Ang kalahati nila ... at ang kalahati naman
  rationale: Ginagawang hayag ang tinutukoy ng mga hulapi at natural ang paghahati sa dalawang pangkat.
- source_word: בָּרִאשֹׁנָה
  choice: noong una
  rationale: Pinananatili sa teksto ang literal at tunay na malabong temporal na parirala, habang ipinapaliwanag sa talababa ang posibleng saklaw.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan ng Diyos.
- issue: Pagkakasama ng גֵּר at אֶזְרָח
  choice: kapuwa ang dayuhang naninirahan at ang katutubong Israelita
  alternative: ang nakikipamayan at ang katutubo
  rationale: Pinananatili ang panlipunan at pangtipang pagkakaiba ng dalawang pangkat nang hindi nag-aangkat ng mga teolohikong kategorya sa ibang panahon.
- issue: Saklaw ng pariralang בָּרִאשֹׁנָה
  choice: ayon sa iniutos noong una ni Moises ... upang pagpalain
  alternative: bilang unang gawain ... upang pagpalain
  rationale: Hindi tiyak kung tumutukoy ito sa naunang utos ni Moises o sa pagpapala bilang unang gawain; pinananatili ang literal na parirala at inilalahad ang kalabuan sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Kaban' at 'Kaban ng Tipan' bilang pamilyar na terminong biblikal; ang mga gitling-pahaba ay tumutulong upang malinaw na iugnay ang mga pinuno sa buong Israel. Lahat ng marker ng talababa ay nasa pangunahing teksto.
