    reason: lexical_alternative
  revision_rationale: Ginawa ang ligtas na pagwawasto upang maging malinaw na ang mga paring Levita ang nagdadala ng Kaban. Inayos ang anchor ng talababa a upang tumukoy ito sa mga katagang may kaugnayang leksikal. Pinanatili ang kalabuan ng “noon/ noong una” sa pangunahing teksto at talababa, pati ang pagkakasunod at saklaw ng seremonyal na paglalarawan.
