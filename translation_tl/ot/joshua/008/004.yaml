    issue: Idinagdag ang “upang lusubin ito.”
    rationale: Walang katumbas na pandiwang “lusubin” sa talata. Ang Hebreo ay nag-uutos na mag-ambang laban sa lungsod mula sa likuran nito; ang aktuwal na pag-atake ay hindi ipinapahayag dito.
  - severity: low
    issue: “Makinig kayo” para sa רְאוּ.
    rationale: Bagaman maaari itong gumana bilang pantawag-pansin, ang pandiwa ay literal na “tingnan.” Ang “Tingnan ninyo” ay nananatiling natural sa ganitong tuwirang tagubilin at mas malapit sa pinagmulan.
