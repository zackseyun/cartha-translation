  verdict: revise
  source_fidelity: Ang dagdag na “upang lusubin ito” ay wala sa Hebreo. Ang utos ay maghanda ng pananambang laban sa lungsod mula sa likuran nito, hindi pa tahasang utos na lusubin ito. Ang “Makinig kayo” ay isang posibleng pragmatikong pantawag-pansin, ngunit ang רְאוּ ay mas malapit sa “Tingnan ninyo.”
  naturalness: Malinaw at modernong Tagalog ang karamihan ng draft. Gayunman, mas likas at mas tumpak ang “magtago kayo upang tambangan” upang maipahayag ang ambush, kaysa “mag-abang ... upang lusubin.”
  terminology: Ang “lungsod,” “lumayo,” at “handa” ay angkop. Ang “tambangan” ay wastong modernong terminong militar para sa אֹרְבִים at hindi nagdaragdag ng susunod na kilos na paglusob.
  issues:
