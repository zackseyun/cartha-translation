base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/003.yaml
  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: tl
  text: At bumangon si Josue at ang lahat ng mandirigma upang lusubin ang Ai.[a] Pumili si Josue ng tatlumpung libong lalaki—mga magigiting na mandirigma[b]—at ipinadala sila noong gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “umakyat patungo/laban sa Ai.” Ang pandiwang Hebreo ay maaaring tumukoy sa pag-akyat o pagpunta roon; sa kontekstong militar, ipinahihiwatig nito ang paglusob sa lunsod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga mandirigmang malalakas at matatapang.” Saklaw ng pariralang Hebreo ang lakas, kakayahan, at kagitingan sa pakikipagdigma.
    reason: lexical_range
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Pinananatili ang karaniwang diwa ng קום bilang pagsisimula ng pagkilos nang hindi agad ipinapakahulugang umalis na sila.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: ang lahat ng mandirigma
  rationale: Natural na modernong Tagalog para sa kolektibong pariralang literal na 'lahat ng bayan/mga tao ng digmaan'; iniiwasan ang alanganing literalismo at ang bahagyang mas institusyonal na 'buong hukbo.'
- source_word: לַעֲלוֹת הָעָי
  choice: upang umahon laban sa Ai
  rationale: Pinananatili ng 'umahon' ang direksiyonal na idyoma ng עלה, samantalang ipinahihiwatig ng 'laban sa' ang malinaw na kontekstong militar nang hindi ito pinaiikli sa 'salakayin.'
- source_word: וַיִּבְחַר
  choice: pumili
  rationale: Tuwirang salin ng בחר at natural sa salaysay.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: tatlumpung libong lalaki
  rationale: Pinananatili ang tahasang 'lalaki' ng Hebreo sa halip na ipalit ang mas interpretatibong 'sundalo.'
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: mga magigiting na mandirigma
  rationale: Malinaw at dignified na modernong katumbas ng isang pariralang tumutukoy sa malalakas, may kakayahan, at matatapang na lalaking pandigma.
- source_word: וַיִּשְׁלָחֵם
  choice: pinayaon sila
  rationale: Ipinapahayag ang pagpapadala sa kanila palayo kay Josue; ang 'pinayaon' ay natural sa dignified na salaysay at hindi kasing teknikal ng 'itinalaga.'
- source_word: לָיְלָה
  choice: nang gabi
  rationale: Natural na adberbiyal na pahayag ng panahong ipinahihiwatig ng Hebreo.
