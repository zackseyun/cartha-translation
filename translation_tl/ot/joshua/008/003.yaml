- from: Kaya bumangon si Josue at ang lahat ng mandirigma upang umahon laban sa Ai.[a] Pumili si Josue ng tatlumpung libong lalaki—mga magigiting na mandirigma[b]—at pinayaon sila nang gabi.
  to: At bumangon si Josue at ang lahat ng mandirigma upang lusubin ang Ai.[a] Pumili si Josue ng tatlumpung libong lalaki—mga magigiting na mandirigma[b]—at ipinadala sila noong gabi.
  rationale: Pinalitan ang hindi likas na “umahon laban sa Ai” ng natural na “lusubin ang Ai,” na tapat sa tungkuling militar ng parirala sa konteksto, at iningatan ang literal na idyomang “umakyat” sa talababa. Inalis ang dagdag na implikasyong sanhi-bunga ng “Kaya” at ginawang mas tuwiran ang pagsasalin sa pagpapadala sa gabi.
