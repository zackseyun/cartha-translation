  source_fidelity: 'Tapat ang salin sa Hebreo: ang hari ng Ai ay binihag nang buhay at dinala kay Josue. Ang “Ngunit” ay isang katanggap-tanggap na kontekstuwal na paglalapat ng וְ, at malinaw na itinatala ng talababa ang payak na alternatibong “At.” Ang “dinala siya kay Josue” ay likas na Tagalog at sapat na naihahatid ang pagdadala sa kaniya bilang patutunguhan, bagaman mas literal ang “inilapit.”'
