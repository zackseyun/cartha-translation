  yaml_path: translation/ot/joshua/008/023.yaml
  text: But they captured the king of Ai alive and brought him to Joshua[a].
translation:
  language: tl
  text: Ngunit binihag nila nang buháy ang hari ng Ai at dinala siya kay Josue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At binihag nila nang buháy ang hari ng Ai at dinala siya kay Josue.”
    reason: Pinananatili ang posibleng payak na pang-ugnay na kahulugan ng וְ bilang “At,” sa halip na ang kontekstuwal na “Ngunit.”
lexical_decisions:
- source_word: וְ/אֶת
  choice: Ngunit
  rationale: 'Ang וְ ay nag-uugnay sa kasunod na pangyayari ngunit may bahagyang pagsalungat sa malawakang pagpatay sa naunang konteksto: ang hari ay hindi pinatay kundi binihag nang buháy. Posible rin ang mas pormal na “At.”'
- source_word: מֶלֶךְ הָעַי
  choice: ang hari ng Ai
  rationale: Likas at tuwirang salin ito ng construct chain; pinanatili ang Ai bilang pangalan ng lugar.
- source_word: תָּפְשׂוּ
  choice: binihag nila
  rationale: Sa kontekstong militar, malinaw na ipinahihiwatig ng pandiwa ang paghuli sa isang kaaway bilang bihag, hindi lamang ang pisikal na pagdakma.
- source_word: חָי
  choice: nang buháy
  rationale: Ipinakikitang nahuli ang hari nang hindi pinapatay; nilagyan ng tuldik ang “buháy” upang malinaw ang bigkas at kahulugan.
- source_word: וַיַּקְרִבוּ
  choice: dinala
  rationale: Ang Hiphil ng קרב ay literal na “inilapit.” Sa modernong Tagalog, natural na ipinahahayag ng “dinala ... kay” ang paglapit sa taong patutunguhan nang hindi nagdaragdag ng di-tiyak na seremonyal o hudisyal na diwa.
- source_word: אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: siya kay Josue
  rationale: Tinutukoy ng panghalip at אֶל si Josue bilang patutunguhan. Ang “kay Josue” ang natural na katumbas sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas sa salaysay. Ginamit ang “binihag” para sa tiyak na kontekstong militar at “Josue” bilang nakaugaliang anyo ng pangalang biblikal.
