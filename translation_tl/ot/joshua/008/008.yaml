base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: tl
  text: Kapag nasakop na ninyo ang lungsod, sunugin ninyo ito. Gawin ninyo ito ayon sa salita ni Yahweh.[a] Tingnan ninyo, iniutos ko na ito sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Gawin ninyo ito ayon sa utos ni Yahweh.” Literal na “ayon sa salita ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: Kapag nasakop na ninyo
  rationale: Ang parirala ay nagpapakilala ng pangyayaring mauuna sa kasunod na utos. Likas sa modernong Tagalog ang “kapag … na,” at ang “nasakop” ay angkop sa pagkuha ng isang lungsod sa kontekstong militar.
- source_word: אֶת־הָעִיר
  choice: ang lungsod
  rationale: Karaniwang katumbas ng עִיר sa salaysay na ito ang “lungsod.”
- source_word: תַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ
  choice: sunugin ninyo ito
  rationale: Ang Hiphil na תַּצִּיתוּ ay nangangahulugang pagsiklabin o sunugin. Ang “sunugin” ay natural at malinaw sa Tagalog; ang panghalip na “ito” ay umiiwas sa di-likas na agarang pag-uulit ng “lungsod” nang hindi nawawala ang tinutukoy.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Pinananatili ng “salita” ang malawak at literal na diwa ng דָּבָר, sa halip na agad itong paliitin sa “utos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang pamagat.
- source_word: תַּעֲשׂוּ
  choice: Gawin ninyo
  rationale: Tuwirang utos ito sa maramihang tagapakinig; natural at malinaw ang anyong pautos sa Tagalog.
- source_word: רְאוּ
  choice: Tandaan ninyo
  rationale: Ginagamit dito ang רְאוּ bilang panawag-pansin. Mas natural sa modernong Tagalog ang “Tandaan ninyo” kaysa sa literal ngunit alanganing “Tingnan ninyo” bago ang pahayag tungkol sa utos.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: iniutos ko ito sa inyo
  rationale: Ipinahahayag ng perfect ang nauna nang pagbibigay ng utos. Nililinaw ng “ito” na ang tinutukoy ay ang tagubiling kababanggit lamang.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng pamagat.
- issue: Kahulugan ng כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  alternative: ayon sa utos ni Yahweh
  rationale: Maaaring tumukoy ang דָּבָר sa salita, pahayag, o utos. Pinananatili sa pangunahing teksto ang mas malawak na “salita,” habang ibinibigay sa talababa ang kontekstuwal na alternatibong “utos.”
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “nasakop” para sa kontekstong militar at “Tandaan ninyo” bilang natural na panawag-pansin. Ang talababa ay inilagay pagkatapos ng pariralang talagang tinutukoy nito.
