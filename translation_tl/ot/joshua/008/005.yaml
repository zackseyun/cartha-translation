  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: tl
  text: Ako at ang lahat ng taong kasama ko ay lalapit sa lungsod.[a] Kapag lumabas sila upang salubungin kami, gaya ng dati,[b] tatakas kami palayo sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalapit sa lungsod.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “gaya noong una.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי וְכָל הָעָם אֲשֶׁר אִתִּי
  choice: Ako at ang buong bayang kasama ko
  rationale: Pinananatili ang payak na kahulugan ng עָם bilang “bayan” at ang saklaw ng buong pangkat na kasama ni Josue, nang hindi ito pinakikitid sa “mga kawal” o “mga lalaki.” Natural sa Filipino ang isahang “kasama ko” bilang paglalarawan sa kolektibong “bayan.”
- source_word: נִקְרַב אֶל הָעִיר
  choice: ay lalapit sa lungsod
  rationale: Ang Qal imperfect na נִקְרַב ay nagpapahayag ng nakaplanong kilos sa hinaharap. Ang “lalapit” ay tuwiran at natural, at hindi nagdaragdag ng layuning wala sa Hebreo.
- source_word: וְהָיָה כִּי
  choice: Kapag
  rationale: Ang karaniwang temporal na konstruksiyong Hebreo ay natural na naihahayag sa Filipino sa pamamagitan ng “Kapag,” nang hindi pinananatili ang kahoy na anyong “at mangyayari na.”
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: lumabas sila upang salubungin kami
  rationale: Ipinahahayag nito ang paglabas nila patungo sa pangkat ni Josue. Ang “salubungin” ay nagpapanatili sa pangunahing kahulugan nang hindi tahasang dinaragdagan ng “lusubin.”
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: gaya ng dati
  rationale: Natural at maikli itong pagtukoy sa naunang sagupaan. Ang mas literal na anyo ay inilagay sa talababa upang mapanatili ang ekspresyon ng pinagmulang teksto.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: tatakas kami sa harap nila
  rationale: Ang “tatakas” ay nagpapanatili sa lakas ng נוּס at sa anyo ng kunwaring pagtakas; ang “sa harap nila” ay malapit sa idyomang לִפְנֵיהֶם at hindi ito pinapahinang maging simpleng pag-urong.
