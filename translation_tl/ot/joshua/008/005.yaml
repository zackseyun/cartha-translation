translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod” para sa הָעִיר at “bayan” para sa kolektibong הָעָם. Pinanatili sa pangunahing teksto ang taktikal na pagkakasunod-sunod at ang literal na lakas ng “tatakas,” habang ang mga tunay na alternatibong leksikal ay inilagay sa mga talababa.
