  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: tl
  text: Pagkatapos, bumangon kayo mula sa inyong pananambang at sakupin ninyo ang lungsod[a], sapagkat ibibigay ni Yahweh na inyong Diyos ang lungsod sa inyong kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ariin ninyo ang lungsod.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkuha nito bilang pag-aari, hindi lamang sa pagsakop dito sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: bumangon kayo
  rationale: Ang Qal imperfect na 2mp ng קום ay tagubilin sa sunod-sunod na pagkilos militar. Likas sa Filipino ang “bumangon kayo” at ipinahihiwatig nito ang paglabas upang kumilos.
- source_word: מֵהָאוֹרֵב
  choice: mula sa inyong pinagtataguan
  rationale: Ang אֹרֵב ay tumutukoy sa pananambang o sa puwestong pinagtataguan ng mga nananambang. Sa kontekstong ito, malinaw at natural ang “inyong pinagtataguan,” nang hindi ipinagpapalagay na ang abstraktong kilos mismo ang kanilang pinanggalingan.
- source_word: וְהוֹרַשְׁתֶּם
  choice: sakupin ninyo
  rationale: Ang Hiphil ng ירשׁ ay maaaring mangahulugang ariin, angkinin, o sakupin. Sa konteksto ng paglusob sa lungsod, pinananatili ng “sakupin” ang parehong pagkubkob at pagkuha ng pamamahala; inilalahad sa talababa ang mas tahasang diwa ng pag-aari.
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Tuwirang salin ng עִיר na may tiyak na pantukoy.
- source_word: וּנְתָנָהּ
  choice: ibibigay ito
  rationale: Bagaman perfect ang anyo, sa kasunod na serye ng mga tagubilin ipinahahayag nito ang tiyak na resultang darating. Ang panghinaharap na “ibibigay” ang likas na katumbas sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tuwirang isinasalin ang construct form na may hulaping pangmaramihang ikalawang panauhan.
- source_word: בְּיֶדְכֶם
  choice: sa inyong kamay
  rationale: Pinananatili ang Hebreong idyoma ng paghahatid sa kapangyarihan o kontrol ng isang tao; nauunawaan din ito sa dignified na Filipino.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton bilang personal na pangalan ng Diyos. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Saklaw ng וְהוֹרַשְׁתֶּם
  choice: sakupin ninyo
  alternative: ariin ninyo / kunin ninyo bilang pag-aari
  rationale: Sa kontekstong militar, ang pandiwa ay tumutukoy sa pagkuha ng lungsod, ngunit maaari ring idiin ang pag-angkin o pagmamay-ari. Hindi isinasara ng pangunahing salin ang saklaw na ito, at itinatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod” sa halip na “siyudad,” at pinanatili ang biblikal na idyomang “sa inyong kamay” dahil nauunawaan ito bilang paglalagay sa kanilang kapangyarihan.
