  text: וַ/יִּנָּֽגְע֛וּ יְהוֹשֻׁ֥עַ וְ/כָל יִשְׂרָאֵ֖ל לִ/פְנֵי/הֶ֑ם וַ/יָּנֻ֖סוּ דֶּ֥רֶךְ הַ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/015.yaml
  text: And Joshua and all Israel let themselves be beaten before them and fled by the way of the wilderness[a][b].
translation:
  language: tl
  text: Nagpatalo sa harap nila si Josue at ang buong Israel[a], at tumakas sila sa daang patungo sa ilang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “natalo sa harap nila.” Sa konteksto, malamang na bahagi ito ng pagkukunwaring pagkatalo upang mailayo sa lungsod ang mga tauhan ng Ai.
    reason: lexical_alternative
  - marker: b
    text: O “sa daang dumaraan sa ilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: nagpatalo
  rationale: Sa kontekstong militar, ipinahihiwatig ng anyong Niphal ang pagkatalo o pagpapakitang natalo. Likas sa Tagalog ang “nagpatalo” para sa sinadyang anyo ng pagkatalo sa estratehiya ng pagtambang, ngunit inilalahad sa talababa ang mas payak na pasibong pagbasa.
- source_word: לִפְנֵיהֶם
  choice: sa harap nila
  rationale: Tuwirang pinananatili nito ang panlunan at relasyonal na diwa ng לִפְנֵי + hulapi, na mahalaga sa tagpong militar.
- source_word: וַיָּנֻסוּ
  choice: tumakas
  rationale: Karaniwang kahulugan ng נוּס ang pagtakas. Ang “tumakas” ay tuwiran at hindi nito pinapalitan ang salita ng mas interpretatibong “umurong.”
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: sa daang patungo sa ilang
  rationale: Maaaring tumukoy ang דֶּרֶךְ sa daan o ruta, at natural na ipinahahayag sa Tagalog ng pariralang ito ang pagtakbo sa rutang patungo sa ilang. Nasa talababa ang alternatibong pagbasa na maaaring tumukoy sa pagdaan sa ilang.
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: si Josue at ang buong Israel
  rationale: Pinananatili ang tahasang pangalan ni Josue at ang kolektibong katawagang “buong Israel,” sa halip na gawing “lahat ng Israelita.”
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Pinili ang “nagpatalo” bilang maikli at natural na paglalarawan ng taktikang pagkatalo, habang pinananatili sa talababa ang tunay na posibilidad ng payak na pasibong pagbasa. Ginamit ang “ilang” para sa הַמִּדְבָּר at “Josue” bilang karaniwang anyo ng pangalan sa Tagalog.
