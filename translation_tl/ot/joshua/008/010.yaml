  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tradisyonal at karaniwang pangalang “Josue,” at ang “matatandang pinuno” upang maging malinaw sa ordinaryong mambabasa ang tungkulin ng mga elder.
