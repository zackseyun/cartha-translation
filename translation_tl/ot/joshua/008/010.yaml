  yaml_path: translation/ot/joshua/008/010.yaml
  text: Joshua rose early in the morning and mustered the people[a], and he and the elders of Israel went up before the people to Ai.
translation:
  language: tl
  text: Maagang bumangon si Josue kinaumagahan at tinipon niya ang mga tao[a], at siya at ang mga nakatatanda ng Israel ay umahon sa unahan ng mga tao patungong Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binilang ang mga tao” o “sinuri ang mga tao.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbibilang, pagsusuri, pagtatalaga, o pagtitipon at paghahanda; pinapaboran ng kontekstong militar ang huling diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: Maagang bumangon ... kinaumagahan
  rationale: Ipinananatili ang diin ng Hebreo sa maagang pagbangon at ang tahasang pagtukoy sa umaga sa natural na makabagong Tagalog.
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: tinipon niya ang mga tao
  rationale: Malawak ang saklaw ng פקד—maaaring bilangin, siyasatin, o tipunin/ihanda. Sa kontekstong militar, ang 'tinipon' ay likas sa Tagalog at nagpapahiwatig ng paghahanda nang hindi ginagawang tahasang 'hukbo' ang הָעָם.
- source_word: הָעָם
  choice: mga tao
  rationale: Pinananatili ang pangkalahatang katawagan ng Hebreo sa halip na paliitin ito bilang 'mga kawal' o 'hukbo.'
- source_word: וַיַּעַל
  choice: umahon
  rationale: Tumutugma sa karaniwang kahulugan ng עלה na 'umakyat/umahon' at pinananatili ang posibleng topograpikong diwa ng paglalakbay.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: siya at ang matatandang pinuno ng Israel
  rationale: Malinaw na kapwa paksa sina Josue at ang mga זקנים. Ang 'matatandang pinuno' ay naghahatid ng katungkulan ng mga elder, hindi lamang ng kanilang edad.
- source_word: לִפְנֵי הָעָם
  choice: sa unahan ng mga tao
  rationale: Natural na Tagalog para sa literal na 'sa harap ng mga tao' at pinananatili ang larawan ng kanilang puwesto nang hindi labis na ipinapakahulugang namumuno sila sa martsa.
- source_word: הָעָי
  choice: Ai
  rationale: Ginagamit ang karaniwang anyo ng pangalang pook nang hindi inililipat ang artikulong Hebreo.
