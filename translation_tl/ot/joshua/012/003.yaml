  text: וְ/הָ/עֲרָבָה֩ עַד יָ֨ם כִּנְר֜וֹת מִזְרָ֗חָ/ה וְ֠/עַד יָ֣ם הָ/עֲרָבָ֤ה יָם הַ/מֶּ֨לַח֙ מִזְרָ֔חָ/ה דֶּ֖רֶךְ בֵּ֣ית הַיְשִׁמ֑וֹת וּ/מִ֨/תֵּימָ֔ן תַּ֖חַת אַשְׁדּ֥וֹת הַ/פִּסְגָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: tl
  text: at ang Araba[a] hanggang sa Dagat ng Kinerot, sa silangan, at hanggang sa Dagat ng Araba, ang Dagat na Maalat[b], sa silangan, patungo sa Bet-Yesimot, at sa timog, sa ibaba ng mga dalisdis ng Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapatagan.” Dito, malamang na tumutukoy ang Araba sa tiyak na rehiyon ng lambak at bitak ng Jordan, hindi lamang sa isang karaniwang kapatagan.
    reason: lexical_alternative
  - marker: b
    text: Ang “Dagat ng Araba, ang Dagat na Maalat” ay ang dagat na kalaunang karaniwang tinawag na Dagat na Patay.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: ang Araba
  rationale: Pinanatili bilang pangalang heograpiko para sa kilalang rehiyon ng lambak at bitak ng Jordan, sa halip na gawing pangkalahatang “kapatagan.”
- source_word: יָם כִּנְרוֹת
  choice: Dagat ng Kinerot
  rationale: Tuwirang isinalin ang יָם bilang “Dagat” at tinumbasan sa transliterasyong Filipino ang pangalang Hebreo na Kinerot.
- source_word: מִזְרָחָה
  choice: sa silangan
  rationale: Natural na pariralang Filipino para sa direksiyonal na gamit ng anyong Hebreo, habang pinananatili ang maikling estilo ng paglalarawan sa hangganan.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: Dagat ng Araba, ang Dagat na Maalat
  rationale: Pinanatili ang magkatabing katawagan sa Hebreo at hindi ipinalit sa mismong teksto ang mas huling pangalang “Dagat na Patay.”
- source_word: דֶּרֶךְ בֵּית הַיְשִׁמוֹת
  choice: sa gawing Bet-Yesimot
  rationale: Sa konteksto ng hangganan, ipinahihiwatig ng דֶּרֶךְ ang direksiyon o dakong patungo sa isang lugar; mas natural ito kaysa sa literal na “sa daan ng.”
- source_word: וּמִתֵּימָן
  choice: at sa timog
  rationale: Pinananatiling maikli at bahagyang bukas ang heograpikong ugnayan ng parirala, na maaaring tumukoy sa timog na panig o direksiyon.
- source_word: תַּחַת אַשְׁדּוֹת הַפִּסְגָּה
  choice: sa ibaba ng mga dalisdis ng Pisga
  rationale: Ang “mga dalisdis” ay malinaw at topograpikong angkop na katumbas ng אַשְׁדּוֹת; ang Pisga ay pinanatiling pangalan ng lugar.
