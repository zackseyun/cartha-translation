lexical_decisions:
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Tumutukoy sa pinuno ng bawat lungsod-estado. Likas sa Filipino ang pariralang “ang hari ng” sa ganitong talaan.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Pangalan ng lugar; ginamit ang karaniwang anyo sa Filipino.
- source_word: אֶחָד
  choice: isa
  rationale: Nagsisilbing bilang sa talaan ng mga natalong hari. Pinananatili ng “isa” ang maikli at pormulang estilo ng Hebreo.
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Inulit na may kaparehong kahulugan at tungkulin sa ikalawang tala.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Pangalan ng lugar; ginamit ang karaniwang transliterasyon.
- source_word: אֶחָד
  choice: isa
  rationale: Inulit na bilang at isinalin nang pareho upang mapanatili ang pormulang kayarian.
