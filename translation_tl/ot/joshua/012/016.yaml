  rationale: Pangalan ng lugar; tinumbasan sa karaniwang baybay-Filipino sa halip na isalin ang kahulugan.
- source_word: אֶחָד
  choice: isa
  rationale: Nagsisilbing bilang ng bawat natalong hari. Pinanatili ang maikli at paulit-ulit na anyo ng talaang Hebreo.
- source_word: בֵּית אֵל
