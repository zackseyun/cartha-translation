  language: tl
  text: ang hari ng Libna, isa; ang hari ng Adulam, isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring gawing mas tahasan: “ang hari ng Libna, isang hari; ang hari ng Adulam, isang hari.” Inuulit lamang sa Hebreo ang “isa” bilang pormula ng pagbibilang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Anyo itong construct na tumutukoy sa pinuno ng bawat lungsod-estado; natural sa Filipino ang pariralang “ang hari ng.”
- source_word: לִבְנָה
  choice: Libna
  rationale: Pangalan ng lugar; tinumbasan ayon sa karaniwang anyong Filipino ng pangalang biblikal.
- source_word: אֶחָד
  choice: isa
  rationale: Bilang sa talaan ng mga haring natalo; pinananatili ang maikli at paulit-ulit na pormula ng Hebreo.
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Inulit na anyong construct para sa ikalawang tala; isinalin nang pareho para mapanatili ang estruktura.
- source_word: עֲדֻלָּם
  choice: Adulam
  rationale: Pangalan ng lugar; transliterasyon na natural sa ortograpiyang Filipino.
- source_word: אֶחָד
  choice: isa
  rationale: Inulit na bilang sa pormula ng talaan; pinanatiling kapareho upang maingatan ang ritmo at pagtutuos ng Hebreo.
