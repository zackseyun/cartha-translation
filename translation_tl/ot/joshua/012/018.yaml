  text: the king of Aphek[a], one; the king of Sharon, one.
translation:
  language: tl
  text: ang hari ng Afek, isa; ang hari ng Sharon,[a] isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang hari ng rehiyon ng Sharon, isa.” May pantukoy ang “Sharon” sa Hebreo, na nagpapakitang tumutukoy ito sa rehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Sa talaan ng mga nalupig na pinuno, ipinakikilala ng מֶלֶךְ ang bawat hari. Likas sa Tagalog ang “ang hari ng” para sa kaugnayan ng hari sa lugar.
- source_word: אֲפֵק
  choice: Afek
  rationale: Pangalan ito ng lugar, kaya isinalin sa pamamagitan ng transliterasyong angkop sa baybay ng Tagalog.
- source_word: אֶחָד
  choice: isa
  rationale: Ginagamit dito bilang bilang ng bawat haring nakatala. Pinananatili ng “isa” ang maikli at paulit-ulit na anyo ng Hebreong talaan.
- source_word: לַ/שָּׁרוֹן
  choice: ng Sharon
  rationale: Ang anyo ay may pang-ukol at pantukoy bago ang pangalang Sharon. Sa natural na Tagalog, sapat ang “ng Sharon”; ipinaliliwanag sa talababa ang mas tahasang pagtukoy sa rehiyon.
theological_decisions: []
translation_notes:
  register: Maikli at pormal ang pagkakasalin upang mapanatili ang estilong patalaan ng talata. Ginamit ang makabagong baybay na “Afek” at ang karaniwang pangalang “Sharon.”
