lexical_decisions:
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Anyo itong construct na sinusundan ng pangalan ng lugar; natural sa Filipino ang pariralang “ang hari ng” sa talaan.
- source_word: יַרְמוּת
  choice: Jarmut
  rationale: Pangalan ng lugar na tinumbasan ayon sa bigkas ng Hebreo at sa karaniwang anyong Filipino.
- source_word: אֶחָד
  choice: isa
  rationale: Gumaganap bilang maikling bilang o tally sa listahan ng mga haring natalo; pinanatili ang maigsi at paulit-ulit na pormula ng Hebreo.
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Inulit na construct phrase para ipakilala ang susunod na pinuno ng lungsod-estado; isinalin nang pareho sa unang paglitaw.
- source_word: לָכִישׁ
  choice: Lakis
  rationale: Pangalan ng lugar na tinumbasan ayon sa bigkas ng Hebreo at sa karaniwang anyong Filipino.
- source_word: אֶחָד
  choice: isa
  rationale: Inulit na bilang sa talaan; isinalin nang pareho sa unang paglitaw.
