  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: tl
  text: At ito ang mga hari ng lupain na nilupig ni Josue at ng mga Israelita sa kabila ng Jordan, sa dakong kanluran, mula sa Baal-gad sa Libis ng Lebanon hanggang sa Bundok Halak, na umaahon patungong Seir[a]; at ibinigay ni Josue ang lupaing iyon sa mga lipi ng Israel bilang mana, ayon sa kani-kanilang bahagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na paakyat tungo sa Seir.”
    reason: Pinananatili ang alternatibong pagpapahayag ng participle הָעֹלֶה, na maaaring ilarawan ang paahong direksiyon o ang topograpiya.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ang pang-ugnay sa naunang tala at natural na ipinakikilala ang kasunod na listahan.
- source_word: מַלְכֵי הָאָרֶץ
  choice: mga hari ng lupain
  rationale: Tuwirang salin na nagpapanatili sa teritoryal na diwa ng אֶרֶץ nang hindi nagpapahiwatig ng modernong bansang-estado.
- source_word: אֲשֶׁר הִכָּה
  choice: na nilupig
  rationale: Sa konteksto ng pananakop, ang נכה ay tumutukoy sa paggapi sa labanan; mas natural sa Filipino ang 'nilupig' kaysa literal na 'pinabagsak' o 'sinaktan.'
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: at ng mga Israelita
  rationale: Bagaman literal na 'mga anak na lalaki ni Israel,' ang parirala ay karaniwang katawagan sa sambayanan; 'mga Israelita' ang malinaw at likas na modernong Filipino.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: sa kabila ng Jordan, sa dakong kanluran
  rationale: Pinananatili kapwa ang heograpikong perspektiba ng 'sa kabila' at ang tahasang direksiyong kanluran.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: sa Libis ng Lebanon
  rationale: Ang בִּקְעָה ay malapad na libis o kapatagan; 'Libis' ay malinaw at angkop bilang heograpikong pangalan.
- source_word: וְעַד הָהָר הֶחָלָק
  choice: hanggang sa Bundok Halak
  rationale: Itinuturing ang הָהָר הֶחָלָק bilang pangalan ng lugar at tinutumbasan sa transliterasyong Halak, sa halip na isaling 'makinis na bundok.'
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: na paakyat patungong Seir
  rationale: Pinananatili ang maaaring topograpiko o panrutang diwa ng participle עֹלֶה nang hindi nagpapasyang ang bundok mismo ang 'tumataas.'
- source_word: וַיִּתְּנָהּ
  choice: Ibinigay ni Josue ang lupaing iyon
  rationale: Ang pambabaeng isahang hulapi ay tumutukoy sa lupain; ginawang tahasan ang referent upang maging malinaw sa Filipino.
- source_word: יְרֻשָּׁה
  choice: bilang mana
  rationale: Ipinahahayag nito ang lupaing ipinamahagi bilang minanang pag-aari, isang pangunahing diwa ng termino sa Josue.
- source_word: כְּמַחְלְקֹתָם
  choice: ayon sa kani-kanilang bahagi
  rationale: Ipinapakita ang pamamahagi sa mga nakatalagang bahagi ng bawat lipi sa natural na Filipino.
