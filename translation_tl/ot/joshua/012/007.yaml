translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang kinagawiang pangalang “Josue” at mga transliterasyong Jordan, Baal-gad, Lebanon, Halak, at Seir. Hindi pinanatili nang literal ang Hebreong idyomang “mga anak na lalaki ni Israel,” sapagkat tumutukoy ito rito sa mga Israelita bilang bayan.
