  yaml_path: translation/ot/joshua/012/022.yaml
  text: the king of Kedesh[a], one; the king of Jokneam by Carmel, one.
translation:
  language: tl
  text: ang hari ng Kedesh, isa; ang hari ng Jokneam sa may Carmel,[a] isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang hari ng Jokneam sa Carmel.” Maaaring tumukoy ang pariralang Hebreo sa kinaroroonan o sa kaugnayan nito sa rehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Sa talaan ng mga natalong hari, ipinakikilala ng מֶלֶךְ ang pinuno ng bawat lungsod-estado; natural sa Filipino ang pariralang “ang hari ng.”
- source_word: קֶדֶשׁ
  choice: Kedesh
  rationale: Pangalan ng lugar; tinumbasan sa karaniwang transliterasyong Filipino sa halip na isalin ang kahulugan.
- source_word: אֶחָד
  choice: isa
  rationale: Pinananatili ang paulit-ulit na paraan ng pagbibilang sa Josue 12, kung saan nagtatapos sa “isa” ang bawat tala.
- source_word: יָקְנֳעָם
  choice: Jokneam
  rationale: Pangalan ng lugar; ginamit ang nakaugaliang anyo ng pangalan.
- source_word: לַ/כַּרְמֶל
  choice: sa may Carmel
  rationale: Maaaring magpahiwatig ang ל ng kinaroroonan o kaugnayang panrehiyon. Ang “sa may Carmel” ay natural at hindi labis na nagtatakda kung bundok o rehiyon ang tinutukoy.
