  register: Modernong Filipino na malinaw at marangal. Pinanatili ang mga pangalang panrehiyong Araba at Negev, ngunit isinalin nang malinaw ang ibang anyong-lupa. Ginamit ang mga nakaugaliang anyong Filipino ng mga pangalan ng bayan at ang maramihan upang maipahayag ang kolektibong gamit ng mga anyong isahan sa Hebreo.
