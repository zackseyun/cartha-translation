  text: בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בָֽ/עֲרָבָה֙ וּ/בָ֣/אֲשֵׁד֔וֹת וּ/בַ/מִּדְבָּ֖ר וּ/בַ/נֶּ֑גֶב הַֽ/חִתִּי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: tl
  text: sa kabundukan, sa mababang lupain[a], sa Araba[b], sa mga dalisdis, sa ilang, at sa Negev[c]—ang mga Heteo, mga Amoreo, mga Cananeo, mga Perezeo, mga Hivita, at mga Jebuseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Shepela,” ang pangalan ng mababang lupain at rehiyon ng mga paanan ng burol sa kanluran.
    reason: lexical_alternative
  - marker: b
    text: Ang “Araba” ay pangalang panrehiyon para sa lambak o tuyong kapatagan sa malaking lamat ng lupa; maaari ring isalin na “sa tuyong kapatagan.”
    reason: lexical_alternative
  - marker: c
    text: O “sa katimugang lupain”; ang Hebreong Negev ay maaaring tumukoy kapuwa sa timog at sa partikular na rehiyon sa timog.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: sa kabundukan
  rationale: Ang הַר ay maaaring tumukoy sa bundok o sa isang bulubunduking rehiyon; sa talaang heograpiko rito, ang panrehiyong diwa ang nangingibabaw.
- source_word: וּבַשְּׁפֵלָה
  choice: sa mababang lupain
  rationale: Ang שְׁפֵלָה ay tumutukoy sa mababang lupain o paanan ng mga burol sa kanluran; malinaw sa karaniwang mambabasa ang saling ito habang inilalagay sa talababa ang pangalang Shepela.
- source_word: וּבָעֲרָבָה
  choice: sa Araba
  rationale: Dito, ang עֲרָבָה ay malamang na pangalang panrehiyon para sa lambak o tigang na kapatagan ng rift valley, kaya pinanatili ang pantanging pangalang Araba.
- source_word: וּבָאֲשֵׁדוֹת
  choice: sa mga dalisdis
  rationale: Ang אֲשֵׁדוֹת ay mga dalisdis o pahilis na gilid ng kabundukan; tuwiran at likas sa Filipino ang “mga dalisdis.”
- source_word: וּבַמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay karaniwang tigang at kakaunting-tinirhang lupain, hindi kinakailangang mabuhanging disyerto; ang “ilang” ay maikli at angkop.
- source_word: וּבַנֶּגֶב
  choice: sa Negev
  rationale: Maaaring mangahulugan ang נֶגֶב na “timog,” ngunit sa sunud-sunod na mga rehiyon dito ay mas malamang na tumutukoy ito sa rehiyong Negev.
- source_word: הַחִתִּי
  choice: ang mga Heteo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang katawagan sa pangkat ng mga tao; ginamit ang nakaugaliang pangalang Filipino na nasa maramihan.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Kolektibong katawagan sa isang pangkat ng mga tao, kaya natural na isinalin sa maramihan.
- source_word: וְהַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Kolektibong etnonimo; pinili ang nakaugaliang anyong Filipino at maramihan.
- source_word: הַפְּרִזִּי
  choice: mga Perezeo
  rationale: Kolektibong etnonimo na isinalin sa nakaugaliang anyong Filipino at maramihan.
- source_word: הַחִוִּי
  choice: mga Hivita
  rationale: Kolektibong etnonimo na isinalin sa nakaugaliang anyong Filipino at maramihan.
- source_word: וְהַיְבוּסִי
  choice: mga Jebuseo
  rationale: Kolektibong etnonimo na isinalin sa nakaugaliang anyong Filipino at maramihan.
