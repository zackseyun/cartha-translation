- source_word: אֶחָד
  choice: isa
  rationale: Tuwirang bilang ng hari mula sa lungsod na ito, ayon sa padron ng talaan.
- source_word: כָּל מְלָכִים
  choice: Lahat ng hari
  rationale: Pinananatili ang karaniwang kahulugan ng כָּל bilang panandang nagbubuod sa lahat ng haring naitala.
- source_word: שְׁלֹשִׁים וְאֶחָד
  choice: tatlumpu't isa
  rationale: Likas at pamantayang anyo sa modernong Filipino ng Hebreong tambalang bilang na literal na “tatlumpu at isa.”
