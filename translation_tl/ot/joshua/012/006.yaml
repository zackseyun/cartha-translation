id: JOS.12.6
reference: Joshua 12:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: tl
  text: Nilupig sila ni Moises na lingkod ni Yahweh, kasama ng mga Israelita. At ibinigay ni Moises na lingkod ni Yahweh ang lupa bilang mana sa mga Rubenita, mga Gadita, at sa kalahati ng lipi ni Manases.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: lingkod
  rationale: Sa titulong tumutukoy kay Moises, ang salita ay nagpapahayag ng tapat na paglilingkod at tungkuling mula sa Diyos; natural at marangal sa Filipino ang “lingkod.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” isa itong karaniwang Hebreong katawagan sa sambayanang Israel. Ang “mga Israelita” ang natural at tumpak na katumbas sa modernong Filipino.
- source_word: הִכּוּם
  choice: nilupig sila
  rationale: Sa buod ng pananakop, ang נכה ay tumutukoy sa paggapi sa mga hari at hukbo. Inihahayag ng “nilupig” ang militar na diwa nang hindi ipinapalagay na bawat indibidwal ay pinatay.
- source_word: וַיִּתְּנָהּ
  choice: ibinigay ... ang lupa
  rationale: Ang pambabaeng hulapi ay tumutukoy sa lupa o teritoryong nauunawaan mula sa konteksto; tahasang binanggit ang “lupa” upang maging malinaw at natural sa Filipino.
- source_word: יְרֻשָּׁה
  choice: bilang mana
  rationale: Ipinapahayag nito ang lupa bilang minanang pag-aari, at malinaw na naihahatid ng maikling pariralang Filipino ang tipanang diwa.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: sa mga Rubenita, mga Gadita
  rationale: Ang mga pangngalang gentiliko na nasa anyong isahan sa Hebreo ay kolektibong tumutukoy sa mga kaanib ng dalawang lipi.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: sa kalahati ng lipi ni Manases
  rationale: Direkta at likas itong paglalarawan sa bahaging iyon ng lipi ni Manases na tumanggap ng lupa sa silangan ng Jordan.
theological_decisions:
- issue: Paglalarawan kay Moises bilang עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  alternative: alipin ni Yahweh
  rationale: Ang parirala ay isang marangal na titulo ng itinalaga at tapat na paglilingkod ni Moises; ang “alipin” ay maaaring magbigay ng di-inaasahang diin sa sapilitang pagkaalipin.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang pangalan sa tekstong Hebreo at hindi ito pinapalitan ng titulong “Panginoon.”
- issue: Saklaw ng בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak na lalaki ni Israel
  rationale: Kolektibong tawag ito sa bayan, hindi isang pahayag na nililimitahan ang tinutukoy sa mga literal na anak na lalaki. Iniiwasan ng natural na kolektibong katawagan ang maling gender restriction.
- issue: Lakas ng kahulugan ng הִכּוּם
  choice: nilupig sila
  alternative: pinatay sila
  rationale: Maaaring mangahulugan ang pandiwa ng paghampas, paggapi, o pagpatay sa kontekstong militar. Pinananatili ng “nilupig” ang saklaw at hindi tahimik na nilulutas ang posibleng lawak ng pagkamatay.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “kasama ng” upang natural na ipahayag na kapwa kumilos si Moises at ang mga Israelita, at hinati sa dalawang pangungusap ang mahabang Hebreong pangungusap para sa madaling pagbasa. Walang talababa dahil hindi kailangan para sa malinaw at tumpak na salin.
