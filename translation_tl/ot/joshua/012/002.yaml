  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: tl
  text: Si Sihon na hari ng mga Amoreo, na naninirahan sa Hesbon at namamahala mula sa Aroer, na nasa gilid ng Lambak ng Arnon, at mula sa gitna ng lambak, kabilang ang kalahati ng Gilead, hanggang sa Lambak ng Jabok[a], na hangganan ng mga anak ni Ammon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na נחל ay maaaring mangahulugang lambak, wadi, o daluyan ng tubig. Dito, ang Arnon at Jabok ay nagsisilbing mga hangganan ng teritoryo.
    reason: cultural_note
  - marker: b
    text: Ibig sabihin, ang mga Ammonita.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Bagaman pang-isahan ang anyong Hebreo bilang katawagan kay Sihon, likas sa Filipino ang “hari ng mga Amoreo” para sa pangkat-etniko.
- source_word: הַיּוֹשֵׁב
  choice: naninirahan
  rationale: Ang participle ng ישב ay tumutukoy dito sa paninirahan, hindi sa literal na pag-upo.
- source_word: מֹשֵׁל
  choice: namamahala
  rationale: Ipinahihiwatig ng participle ang aktuwal na paghahari o pamamahala ni Sihon sa teritoryong inilalarawan.
- source_word: מֵעֲרוֹעֵר
  choice: mula sa Aroer
  rationale: Ang מִן ay nagtatakda ng panimulang dako ng nasasakupan.
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: pampang ng Lambak ng Arnon
  rationale: Ang שפה ay gilid o pampang, samantalang ang נחל ay maaaring tumukoy sa lambak, wadi, o daluyan ng tubig; iniiwasan ng “Lambak” na ipalagay na palaging umaagos na ilog ito.
- source_word: וְתוֹךְ הַנַּחַל
  choice: at mula sa gitna ng lambak
  rationale: Ang תוך ay “gitna.” Inulit sa Filipino ang “mula sa” na ipinahihiwatig ng balangkas ng paglalarawan sa lawak ng teritoryo.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: sakop ang kalahati ng Gilead
  rationale: Nililinaw nang natural sa Filipino na ang kalahati ng Gilead ay bahagi ng teritoryong pinamahalaan, nang hindi binabago ang lawak na sinasabi ng Hebreo.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: hanggang sa Lambak ng Jabok
  rationale: Ang עַד ay nagtatakda ng dulong hangganan; ang נחל ay isinaling “Lambak” gaya sa Arnon upang panatilihin ang topograpikong diwa.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: hangganan ng mga anak ni Ammon
  rationale: Pinananatili ang literal na Hebreong katawagang “mga anak ni Ammon,” na tumutukoy sa mga Ammonita, at ginagamit ang “hangganan” para sa kontekstong teritoryal.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “naninirahan” at “namamahala” bilang malinaw at karaniwang pananalita. Pinanatili ang anyong pangungusap na nakatuon kay Sihon at inayos lamang ang pagkakasunod ng mga pariralang teritoryal upang maging likas sa Filipino.
