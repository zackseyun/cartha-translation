  to: Si Sihon na hari ng mga Amoreo, na naninirahan sa Hesbon at namamahala mula sa Aroer, na nasa gilid ng Lambak ng Arnon, at mula sa gitna ng lambak, kabilang ang kalahati ng Gilead, hanggang sa Lambak ng Jabok[a], na hangganan ng mga anak ni Ammon.[b]
