lexical_decisions:
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Sa talaan ng mga natalong hari, ang מֶלֶךְ ay nasa anyong construct at nagpapakilala sa bawat entry bilang “hari ng ….”
- source_word: דּוֹר
  choice: Dor
  rationale: Pangalan ito ng lugar, kaya isinalin sa pamamagitan ng transliterasyon.
- source_word: לְנָפַת דּוֹר
  choice: sa distrito ng Dor
  rationale: Ang נָפָה sa heograpikong pariralang ito ay tumutukoy sa isang rehiyon o nasasakupan. Ang “distrito ng Dor” ay malinaw at likas sa modernong Filipino, habang ang posibleng topograpikong diwang “kaburulan” ay inilagay sa talababa.
- source_word: אֶחָד
  choice: isa
  rationale: Paulit-ulit itong ginagamit bilang pananda ng bilang pagkatapos ng bawat hari; pinananatili ng “isa” ang maikli at enumeratibong estilo ng Hebreo.
- source_word: גּוֹיִם
  choice: Goiim
  rationale: Karaniwan itong nangangahulugang “mga bansa” o “mga bayan,” ngunit sa kontekstong ito maaari itong maging pangalan ng lugar o teritoryo. Pinananatili ng transliterasyon ang tunay na kalabuan.
- source_word: לְגִלְגָּל
  choice: sa Gilgal
  rationale: Ang לְ ay nag-uugnay sa hari sa lokalidad; natural sa Filipino ang “sa Gilgal” para sa ganitong heograpikong kaugnayan.
