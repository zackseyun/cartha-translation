  text: ang hari ng Dor sa Nafat-Dor[a], isa; ang hari ng Goiim[b] sa Gilgal, isa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain bilang “sa kaburulan ng Dor” o “sa rehiyon/distrito ng Dor.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na גּוֹיִם ay karaniwang nangangahulugang “mga bansa” o “mga bayan.” Kaya maaari ring unawain ang parirala bilang “ang hari ng mga bansa sa Gilgal,” ngunit dito ay maaaring pangalan ito ng lugar o teritoryo.
