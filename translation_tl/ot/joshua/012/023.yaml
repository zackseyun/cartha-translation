translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at tila talaang ayos ng Hebreo, pati ang paulit-ulit na “isa.” Itinama ang pagkakaugnay ng mga talababa: ang paliwanag sa נָפַת ay nakatapat sa “distrito ng Dor,” at ang paliwanag sa גּוֹיִם ay nakatapat sa “Goiim.”'
