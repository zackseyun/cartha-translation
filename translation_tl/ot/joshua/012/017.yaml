  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Ang anyong construct ay nag-uugnay sa hari sa kasunod na pangalan ng lugar; natural sa Filipino ang pariralang “ang hari ng.”
- source_word: תַּפּוּחַ
  choice: Tapua
  rationale: Pangalan ng lugar; tinumbasan sa paraang transliterasyon na angkop sa bigkas at baybay sa Filipino.
- source_word: אֶחָד
  choice: isa
  rationale: Pamilang na ginamit nang eliptikal upang isa-isang bilangin ang mga natalong hari; pinananatili ang maigsi at paulit-ulit na anyo ng Hebreo.
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Inulit na pariralang construct para sa ikalawang tala; isinalin nang pareho sa unang paglitaw.
- source_word: חֵפֶר
  choice: Hefer
  rationale: Pangalan ng lugar; transliterasyon na kumakatawan sa katinig na פ bilang f sa pangalang Hebreo.
- source_word: אֶחָד
  choice: isa
  rationale: Kaparehong eliptikal na pormula ng pagbibilang; pinanatili para tularan ang ritmo ng listahan sa Hebreo.
