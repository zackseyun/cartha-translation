translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Hinati sa dalawang pangungusap ang mahabang Hebreong pangungusap para sa linaw, habang pinananatili ang saklaw at pagkakasunod ng mga detalyeng heograpiko.
