source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: tl
  text: Ito ang mga hari ng lupain na tinalo ng mga anak ni Israel[a], at kinuha nila ang lupain ng mga ito sa kabilang panig ng Jordan, sa silangan, mula sa Lambak ng Arnon[b] hanggang sa Bundok Hermon, at ang buong Araba[c] sa silangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang mga Israelita; sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa isang libis na may batis o agos, na maaari ring matuyo sa ilang panahon; maaari ring isaling “Batis ng Arnon.”
    reason: cultural_note
  - marker: c
    text: Ang “Araba” ay tiyak na tawag sa rehiyon ng malalim na lambak; maaari rin itong isaling “kapatagan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Likas na panimula sa Filipino para sa isang talaan; hindi nagdaragdag ng temporal na diwa na wala sa Hebreo.
- source_word: מַלְכֵי הָאָרֶץ
  choice: mga hari sa lupain
  rationale: Pinananatili ang malawak na heograpikong kahulugan ng אֶרֶץ at natural ang ugnayan sa Filipino.
- source_word: אֲשֶׁר הִכּוּ
  choice: na tinalo
  rationale: Sa kontekstong militar, ang נכה ay tumutukoy sa paggapi; malinaw ito nang hindi ipinapalagay na personal na pinatay ang bawat hari.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit sa literal na Hebreong idyoma; may talababa upang ipaliwanag ang kolektibong kahulugang mga Israelita.
- source_word: וַיִּרְשׁוּ אֶת אַרְצָם
  choice: Sinakop nila ang lupain ng mga ito
  rationale: Ang ירשׁ sa konteksto ng pananakop ay pag-angkin o pagkuha ng lupain; ang 'sinakop' ay maikli at natural sa Filipino.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרְחָה הַשָּׁמֶשׁ
  choice: sa silangan ng Jordan
  rationale: Ang kasunod na pariralang literal na 'sa dakong sikatan ng araw' ang naglilinaw kung aling panig ng Jordan; ang pinagsamang salin ay malinaw at likas.
- source_word: מִנַּחַל אַרְנוֹן
  choice: mula sa Lambak ng Arnon
  rationale: Ang נַחַל ay maaaring tumukoy sa batis at sa libis o wadi na dinadaluyan nito; 'Lambak' ay madaling maunawaan at ipinaliliwanag sa talababa.
- source_word: עַד הַר חֶרְמוֹן
  choice: hanggang sa Bundok Hermon
  rationale: Tuwirang ipinapakita ang hangganan ng nasasakupan.
- source_word: וְכָל הָעֲרָבָה מִזְרָחָה
  choice: pati ang buong Araba sa silangan
  rationale: Pinananatili ang Araba bilang tiyak na pangalang heograpiko sa halip na gawing pangkalahatang 'kapatagan.'
