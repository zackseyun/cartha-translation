revisions:
- from: Ito ang mga hari sa lupain na tinalo ng mga anak ni Israel[a]. Sinakop nila ang lupain ng mga ito sa silangan ng Jordan, mula sa Lambak ng Arnon[b] hanggang sa Bundok Hermon, pati ang buong Araba[c] sa silangan.
  to: Ito ang mga hari ng lupain na tinalo ng mga anak ni Israel[a], at kinuha nila ang lupain ng mga ito sa kabilang panig ng Jordan, sa silangan, mula sa Lambak ng Arnon[b] hanggang sa Bundok Hermon, at ang buong Araba[c] sa silangan.
  rationale: Inayos ang construct phrase upang maging “mga hari ng lupain” at pinalitan ang “Sinakop nila” ng “kinuha nila ang lupain” upang malinaw na maisalin ang magkahiwalay na kilos na paggapi sa mga hari at pagkuha ng kanilang lupain. Ang mga detalye ng silangang panig ng Jordan at ng saklaw ng teritoryo ay pinanatili nang hindi nagdaragdag ng interpretasyon.
