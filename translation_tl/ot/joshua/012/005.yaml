base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: tl
  text: at namamahala sa Bundok Hermon[a], sa Salca, at sa buong Basan hanggang sa hangganan ng mga Gesurita at mga Maacatita, at sa kalahati ng Galaad hanggang sa hangganan ni Sihon na hari ng Hesbon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at pinamahalaan niya ang Bundok Hermon, Salca, at ang buong Basan.” Ang Hebrew ay gumagamit ng participle na nagpapatuloy sa paglalarawan mula sa naunang talata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: at namamahala
  rationale: Ang participle ay nagpapatuloy sa paglalarawan kay Og mula sa naunang talata at nagpapahayag ng kanyang patuloy na pamamahala sa nasasakupan.
- source_word: בְּהַר חֶרְמוֹן
  choice: sa Bundok Hermon
  rationale: Kasunod ng 'namamahala,' likas sa Filipino ang 'sa' upang tukuyin ang sakop ng pamamahala.
- source_word: וּבְסַלְכָה
  choice: sa Saleca
  rationale: Pangalan ito ng lugar sa nasasakupan ni Og; ginamit ang anyong madaling basahin sa Filipino.
- source_word: וּבְכָל הַבָּשָׁן
  choice: at sa buong Basan
  rationale: Pinananatili ng 'buong' ang saklaw ng Hebrew כָל, habang ang 'sa' ay umaayon sa pandiwang 'namamahala.'
- source_word: עַד גְּבוּל
  choice: hanggang sa hangganan ng
  rationale: Tuwirang ipinahahayag nito ang sukdulang heograpikal ng nasasakupan.
- source_word: הַגְּשׁוּרִי
  choice: mga Gesurita
  rationale: Bagaman pang-isahang gentilic ang anyong Hebrew, tumutukoy ito sa bayang etniko na ang hangganan ay binabanggit.
- source_word: וְהַמַּעֲכָתִי
  choice: at mga Maacatita
  rationale: Inihahayag bilang pangalan ng pangkat ng mga tao, kaagapay ng mga Gesurita.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: at sa kalahati ng Galaad
  rationale: Malinaw at likas na Filipino para sa bahaging teritoryal na sakop ng pamamahala.
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: hanggang sa hangganan ni Sihon na hari ng Hesbon
  rationale: Nililinaw ng inuulit na 'hanggang sa' ang hangganan ng kalahati ng Galaad; ang 'na hari ng Hesbon' ay natural na apposition sa Filipino.
