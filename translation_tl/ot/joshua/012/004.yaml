base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/004.yaml
  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
translation:
  language: tl
  text: at ang nasasakupan ni Og, hari ng Basan, na kabilang sa mga natira sa mga Refaim[a] at nanirahan sa Astarot at Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga higante.” Ang Hebreong Refaim ay maaaring tumukoy sa isang sinaunang pangkat ng mga taong inaalalang may pambihirang tangkad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְבוּל
  choice: at ang nasasakupan ni
  rationale: Ang גְּבוּל ay maaaring mangahulugang hangganan o nasasakupang lupain. Sa buod ng mga kahariang nilupig, ang tinutukoy ay ang teritoryong pinamunuan ni Og, kaya natural at angkop ang “nasasakupan.” Isinalin ang ו bilang “at” upang ipagpatuloy ang talaan mula sa naunang talata.
- source_word: עוֹג
  choice: Og
  rationale: Pangalan ng tao; tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: מֶלֶךְ הַ/בָּשָׁן
  choice: hari ng Basan
  rationale: Tuwirang pariralang tumutukoy sa paghahari ni Og. Ang Basan ay pangalang heograpiko at tinumbasan sa anyong karaniwan sa Filipino.
- source_word: מִ/יֶּתֶר
  choice: isa sa mga nalabi sa
  rationale: Ipinahihiwatig ng יֶתֶר ang natira o nalabi. Nilinaw ng “isa sa mga nalabi” na kabilang si Og sa mga natira sa pangkat, nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
- source_word: הָ/רְפָאִים
  choice: mga Refaim
  rationale: Pinanatili ang pangalan ng sinaunang pangkat sa halip na isalin agad bilang “mga higante,” upang hindi gawing tiyak sa pangunahing teksto ang isang interpretasyong leksikal. Inilagay sa talababa ang alternatibo.
- source_word: הַ/יּוֹשֵׁב
  choice: nanirahan
  rationale: Karaniwang nangangahulugan ang יָשַׁב ng manirahan. Isahan ang participle sa Hebreo at tumutukoy kay Og; ang ayos ng pangungusap ay nag-uugnay ng pandiwa sa kanya.
- source_word: בְּ/עַשְׁתָּרוֹת
  choice: sa Astarot
  rationale: Pangalang pook; tinumbasan sa transliterasyong Filipino. Ang בְּ ay natural na isinaling “sa” para sa lugar na tinitirhan.
- source_word: וּ/בְ/אֶדְרֶעִי
  choice: at Edrei
  rationale: Pangalang pook; pinanatili ang pang-ugnay na ו bilang “at.” Sapat na ang iisang “sa” bago ang magkatambal na Astarot at Edrei sa natural na Filipino.
theological_decisions:
- issue: Pagkakakilanlan ng mga רְפָאִים
  choice: Pinanatili bilang pangalang-pangkat na “mga Refaim” sa pangunahing teksto.
  alternative: Isalin bilang “mga higante.”
  rationale: Maaaring tumukoy ang termino sa isang sinaunang pangkat na iniuugnay sa pambihirang tangkad, ngunit hindi nararapat na ipako sa pangunahing teksto ang paliwanag na “mga higante.” Pinananatili ng talababa ang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nasasakupan” sa halip na mas teknikal na “hangganan” upang tumugma sa konteksto ng talaan ng mga kaharian. Pinanatili ang anyong parirala dahil nagpapatuloy ang talata sa estruktura ng naunang bersikulo.
