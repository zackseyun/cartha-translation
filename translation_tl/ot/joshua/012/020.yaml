  text: the king of Shimron-meron[a], one; the king of Achshaph, one.
translation:
  language: tl
  text: ang hari ng Shimron-Meron[a], isa; ang hari ng Acsaf, isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O posibleng dalawang magkahiwalay na pangalan ng lugar, “Shimron” at “Meron.” Gayunman, karaniwang itinuturing dito ang Hebreo na tambalang pangalang “Shimron-Meron,” na umaayon sa bilang na dalawang hari sa talata.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Sa pormula ng talaan ng mga nalupig na hari, ipinakikilala ng מֶלֶךְ ang pinuno ng bawat lungsod-estado. Likas sa Tagalog ang anyong “ang hari ng” sa ganitong talaan.
- source_word: שִׁמְרוֹן מְראוֹן
  choice: Shimron-Meron
  rationale: Karaniwang inuunawa ang dalawang salitang Hebreo bilang tambalang pangalan ng lugar. Kaayon ito ng kayarian ng talata, na nagbibilang lamang ng dalawang hari. Isinatinig ang pangalan sa halip na isalin.
- source_word: אֶחָד
  choice: isa
  rationale: Sa paulit-ulit na pormula ng kabanata, ang אֶחָד ay maikling bilang para sa bawat hari. Pinananatili ng “isa” ang maikli at ritmikong anyo ng pinagmulan.
- source_word: אַכְשָׁף
  choice: Acsaf
  rationale: Pangalan ito ng lugar at isinatinig ayon sa anyong madaling basahin sa modernong Filipino, kung saan ang “cs” ay kumakatawan sa tunog na /ks/.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at talaang-talaan ang himig, na pinananatili ang eliptikong pagbilang na “isa.” Ginamit ang modernong Filipino na “hari ng” at malinaw na pagsasatinig ng mga pangalan ng lugar.
