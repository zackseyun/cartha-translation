lexical_decisions:
- source_word: מֶלֶךְ
  choice: ang hari ng
  rationale: Ang anyong construct ay tumutukoy sa haring namamahala sa bawat pinangalanang lungsod-estado; natural sa Filipino ang pariralang “ang hari ng.”
- source_word: תַּעְנַךְ
  choice: Taanac
  rationale: Pangalan ng lugar; tinumbasan ayon sa karaniwang anyong ginagamit sa mga saling Tagalog, habang pinananatili ang pagkakakilanlan ng pangalang Hebreo.
- source_word: אֶחָד
  choice: isa
  rationale: Literal na “isa,” na nagsisilbing bilang sa paulit-ulit na pormula ng talaan; pinanatili ang maikli at tahasang anyo ng Hebreo.
- source_word: מְגִדּוֹ
  choice: Megido
  rationale: Pangalan ng lugar; isinalin sa karaniwang transliterasyong Filipino.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at mala-talaang pananalita. Pinanatili ang pag-uulit ng “isa” upang maipakita ang pormula at diin ng tekstong Hebreo; inilagay ang panandang talababa sa dulo ng talata upang hindi maputol ang magkatimbang na dalawang sugnay.
