  text: the king of Taanach[a], one; the king of Megiddo, one.
translation:
  language: tl
  text: ang hari ng Taanac, isa; ang hari ng Megido, isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “isa” ay inuulit bilang pormula ng pagbilang sa talaang ito.
