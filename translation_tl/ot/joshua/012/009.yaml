  text: the king of Jericho[a], one; the king of Ai, which is beside Bethel, one.
translation:
  language: tl
  text: ang hari ng Jerico, isa; ang hari ng Ai, na nasa tabi ng Bethel, isa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: hari
  rationale: Karaniwang katumbas sa Tagalog para sa isang lalaking pinuno; nilagyan ng “ang” ayon sa natural na anyo ng talaan.
- source_word: יְרִיחוֹ
  choice: Jerico
  rationale: Karaniwang makabagong baybay sa Bibliyang Tagalog para sa pangalan ng lugar.
- source_word: אֶחָד
  choice: isa
  rationale: Pinananatili ang maikli at paulit-ulit na pormula ng pagbibilang sa talaan; ipinahihiwatig na “isang hari.”
- source_word: הָעַי
  choice: Ai
  rationale: Itinatanghal bilang pangalang pantangi ng lugar; hindi inililipat sa Tagalog ang artikulong Hebreo.
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na pang-ugnay sa Tagalog para sa sugnay na naglalarawan sa Ai.
- source_word: מִצַּד
  choice: nasa tabi ng
  rationale: Malinaw at likas na pagpapahayag ng lokasyon o pagiging malapit sa Bethel.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Karaniwang anyo ng pangalan ng lugar sa Tagalog.
