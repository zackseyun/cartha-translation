  text: Then Joshua commanded the officers of the people, saying,
translation:
  language: tl
  text: 'Pagkatapos, inutusan ni Josue ang mga opisyal ng bayan:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Pagkatapos, inutusan
  rationale: Ang wayyiqtol ng צוה ay nagsusulong sa salaysay at nagpapahayag ng matibay na utos. Likas sa modernong Tagalog ang “Pagkatapos” para sa pagkakasunod-sunod, at pinananatili ng “inutusan” ang lakas ng pandiwa.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Bibliya sa Filipino.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tuwirang layon sa Hebreo at wala itong hiwalay na katumbas sa Tagalog; makikita ang tungkulin nito sa pagkakabuo ng “inutusan ... ang mga opisyal.”
- source_word: שֹׁטְרֵי
  choice: mga opisyal
  rationale: Tumutukoy ang שֹׁטֵר sa mga tagapangasiwa o opisyal na may tungkuling administratibo, hindi partikular sa mga kumander ng hukbo. Mas tiyak ang “mga opisyal” kaysa “mga pinuno.”
- source_word: הָעָם
  choice: ng bayan
  rationale: Tumutukoy ang עָם sa sambayanan bilang isang kabuuan. Natural at marangal sa kontekstong ito ang “bayan,” habang hindi ipinapalagay na isang makabagong estadong-bansa ang tinutukoy.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Pormula ito na nagpapakilala sa tuwirang pananalita sa susunod na talata. Sa natural na modernong Tagalog, malinaw na naipahihiwatig ng tutuldok ang tungkuling iyon nang hindi gumagamit ng mabigat na “na sinasabi.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, dignified, at malinaw. Ginamit ang aktibong ayos at tutuldok upang likas na ipakilala ang utos na sumusunod sa susunod na talata.
