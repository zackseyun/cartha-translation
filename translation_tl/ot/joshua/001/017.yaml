  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: tl
  text: Kung paanong pinakinggan namin si Moises sa lahat ng bagay[a], gayundin ay pakikinggan ka namin. Nawa'y sumaiyo si Yahweh na iyong Diyos, kung paanong sumama siya kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinunod namin si Moises … susundin ka namin.” Ang pandiwang Hebreo na שׁמע ay maaaring mangahulugang “makinig” o “sumunod,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: pinakinggan namin / pakikinggan namin
  rationale: Ang שׁמע na may אֶל ay tumutukoy sa pakikinig o pagbibigay-pansin sa isang tao at madalas na nagpapahiwatig ng pagsunod. Pinananatili ng “pinakinggan/pakikinggan” ang lawak ng kahulugan nang hindi ginagawang tahasang “sinunod/susundin” ang pahiwatig.
- source_word: כְּכֹל אֲשֶׁר
  choice: kung paanong ... sa lahat ng bagay
  rationale: Sabay nitong ipinapahayag ang paghahambing at ang kabuuang saklaw ng kanilang pangako.
- source_word: רַק
  choice: nawa lamang
  rationale: Ipinakikilala ng רַק ang tanging hangarin o pasubali kasunod ng pangakong makikinig sila kay Josue.
- source_word: יִהְיֶה
  choice: nawa ... ay sumaiyo
  rationale: Sa kontekstong ito, ang imperfect ay nagpapahayag ng hangarin sa halip na payak na prediksiyon tungkol sa hinaharap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang banal sa halip na palitan iyon ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang inililipat ang anyong construct na may panlaping panghalip na ikalawang panauhang panlalaki at isahan.
- source_word: עִמָּךְ / עִם
  choice: sumaiyo / sumasa kay Moises
  rationale: Pinananatili ng mga pariralang ito ang diwa ng presensiya at pakikisama at ang eksaktong paghahambing kina Josue at Moises.
- source_word: כַּאֲשֶׁר
  choice: kung paanong
  rationale: Malinaw nitong ipinakikita ang paghahambing sa presensiya ni Yahweh kay Josue at kay Moises.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na gumamit ng pamalit na titulo.
- issue: Pakikinig bilang pagsunod
  choice: pinakinggan / pakikinggan
  alternative: sinunod / susundin
  rationale: Maaaring saklawin ng שׁמע ang kapuwa pakikinig at pagsunod. Pinananatili sa teksto ang mas malawak na salitang “pakikinggan,” habang inilalahad sa talababa ang lehitimong kahulugang “susundin.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang bahagyang mataas na anyong “sumaiyo/sumasa” upang maipahayag nang maikli ang Hebreong ‘maging kasama’ at mapanatili ang magkatimbang na paghahambing, samantalang nananatiling madaling maunawaan ang kabuuang pangungusap.
