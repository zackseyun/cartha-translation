base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: tl
  text: Magpakatatag ka at lakasan mo ang iyong loob, sapagkat ipamamana mo sa bayang ito ang lupain[a] na ipinangako ko sa ilalim ng panunumpa sa kanilang mga ama na ibibigay ko sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “sa pamamagitan mo ay mamanahin ng bayang ito ang lupain,” o “ibibigay mo sa bayang ito ang lupain bilang mana.” Causative ang pandiwang Hebreo: pangungunahan ni Josue ang bayan upang matanggap nila ang lupain bilang mana.'
    reason: lexical_alternative
  - marker: b
    text: Ang “kanilang mga ama” ay tumutukoy sa mga ninunong lalaki ng Israel, lalo na sa mga patriyarka; maaari ring isaling “kanilang mga ninuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק
  choice: Magpakatatag ka
  rationale: Ang Qal imperative na panlalaking isahan ay tuwirang utos kay Josue. Ang “magpakatatag” ay likas at malinaw na nagpapahayag ng lakas at katatagan.
- source_word: וֶאֱמָץ
  choice: at lakasan mo ang iyong loob
  rationale: Sa tambalan nito sa חזק, ipinahahayag ng אמץ ang tapang at matibay na pagpapasya. Ang pariralang ito ay natural sa makabagong Filipino at hindi lamang tumutukoy sa pisikal na lakas.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang utos; pinananatili ng “sapagkat” ang malinaw na ugnayang sanhi.
- source_word: תַּנְחִיל
  choice: ipamamana mo
  rationale: 'Ang Hiphil ng נחל ay causative: sa pamumuno ni Josue, matatanggap ng bayan ang lupa bilang mana. Maikli at likas sa Filipino ang “ipamamana,” bagaman maaari rin itong ipaliwanag bilang pagbibigay o paghahati ng lupa bilang mana.'
- source_word: הָעָם הַזֶּה
  choice: sa bayang ito
  rationale: Pinananatili ng “bayang ito” ang kolektibo at pambansang diwa ng isahang pangngalang Hebrew.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto ng tipan sa Josue, tumutukoy ito sa lupaing ipinangako. Ang “lupain” ay mas angkop kaysa sa pangkalahatang “lupa.”
- source_word: נִשְׁבַּעְתִּי
  choice: isinumpa ko
  rationale: Tumutukoy ang Niphal perfect sa taimtim na panunumpa ng Diyos sa nakaraan. Ang anyong ito ay tuwiran at likas sa Filipino.
- source_word: לַאֲבוֹתָם
  choice: sa kanilang mga ama
  rationale: Literal na “kanilang mga ama,” na sa konteksto ay tumutukoy sa mga ninunong lalaki ng Israel, lalo na sa mga patriyarka. Pinananatili sa teksto ang panlalaking pagtukoy ng Hebrew.
- source_word: לָתֵת לָהֶם
  choice: ibibigay sa kanila
  rationale: Ipinahahayag ng infinitive at panghalip ang nilalaman ng sumpa; malinaw na pinananatili ang Diyos bilang tagapagbigay at ang mga ama bilang tatanggap.
theological_decisions:
- issue: Causative na diwa ng תַּנְחִיל
  choice: ipamamana mo sa bayang ito ang lupain
  alternative: sa pamamagitan mo ay mamanahin ng bayang ito ang lupain / ibibigay mo sa bayang ito ang lupain bilang mana
  rationale: Pinananatili ng pangunahing salin ang tungkuling ibinigay kay Josue na pangasiwaan ang pagtanggap ng Israel sa mana, nang hindi ipinahihiwatig na siya ang tunay na pinagmulan ng pangako.
- issue: Pagtukoy ng לַאֲבוֹתָם sa mga patriyarkang ninuno
  choice: kanilang mga ama
  alternative: kanilang mga ninuno
  rationale: Ang Hebrew ay tahasang panlalaking maramihan at tumutukoy sa mga ninunong lalaki ng Israel. Pinananatili ng “mga ama” ang anyong iyon, habang nililinaw ng talababa ang kontekstuwal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lakasan mo ang iyong loob” bilang likas na katumbas ng utos na maging matapang, at “bayang ito” upang mapanatili ang kolektibong diwa. Ang “mga ama” ay sadyang mas literal; nililinaw ito sa talababa upang maiwasan ang pag-aakalang tumutukoy lamang sa agarang mga magulang.
