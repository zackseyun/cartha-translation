  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: tl
  text: Namatay na si Moises, ang aking lingkod. Kaya ngayon, bumangon ka at tumawid sa Jordan na ito—ikaw at ang buong bayang ito—patungo sa lupaing ibinibigay ko sa kanila, sa mga anak na lalaki ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga Israelita” o “sa mga anak ni Israel.” Sa Hebreo, “sa mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: aking lingkod
  rationale: Ang עֶבֶד ay maaaring mangahulugang lingkod o alipin, ngunit dito ay marangal na pagtukoy kay Moises bilang naglilingkod sa Diyos; ang “aking lingkod” ang likas at angkop sa konteksto.
- source_word: מֵת
  choice: namatay na
  rationale: Inihahayag ng qatal ang kamatayan ni Moises bilang naganap nang katotohanang mahalaga sa kasalukuyang tagubilin. Likas at tuwiran sa Filipino ang “namatay na.”
- source_word: וְעַתָּה
  choice: kaya ngayon
  rationale: Ikinakabit nito ang kamatayan ni Moises sa kasunod na pag-aatas kay Josue at ipinahihiwatig ang bunga o lohikal na paglipat.
- source_word: קוּם
  choice: bumangon ka
  rationale: Ang pautos ay panawagan sa agarang pagkilos. Pinananatili ng “bumangon ka” ang konkretong larawan at ang marangal na himig nang hindi nagiging lipas ang pananalita.
- source_word: עֲבֹר
  choice: tumawid
  rationale: Kapag ang Jordan ang tuwirang layon, malinaw na tumutukoy ang pandiwa sa pagtawid.
- source_word: אֶת־הַיַּרְדֵּן הַזֶּה
  choice: sa Jordan na ito
  rationale: Pinananatili ang tahasang demonstratibong הַזֶּה. Hindi idinagdag ang “Ilog,” na wala sa Hebreo, sapagkat malinaw na ang pangalang Jordan sa konteksto.
- source_word: אַתָּה וְכָל־הָעָם הַזֶּה
  choice: ikaw at ang buong bayang ito
  rationale: Ang “bayang ito” ay natural na kolektibong panumbas sa singular na הָעָם at pinananatili ang demonstratibo.
- source_word: אֶל־הָאָרֶץ
  choice: papunta sa lupain
  rationale: Sa konteksto ng pagkilos at pagtawid, ipinahahayag nito ang pagpasok patungo sa lupaing tinutukoy.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: na ibinibigay ko sa kanila
  rationale: Pinananatili ng aspektong nagpapatuloy ng “ibinibigay” ang participle נֹתֵן bilang kasalukuyan at nalalapit na pagkakaloob ng Diyos.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak na lalaki ni Israel
  rationale: Tahasan nitong inilalarawan ang masculine plural na בְּנֵי habang ang talababa ay nagpapaliwanag na ang tinutukoy ay ang sambayanang Israel sa kabuuan.
theological_decisions:
- issue: Ang panlalaking kolektibong katawagan sa לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak na lalaki ni Israel
  alternative: sa mga Israelita; sa mga anak ni Israel
  rationale: Ginamit sa Hebreo ang masculine plural na “mga anak na lalaki.” Pinananatili ito sa pangunahing teksto upang hindi maitago ang anyo ng pinagmulan, habang nililinaw sa talababa ang karaniwang kolektibong kahulugan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga karaniwang anyong “namatay na,” “bumangon,” at “tumawid,” habang pinanatili ang mariing pag-aatas at ang kolektibong diwa ng “bayang ito.”
