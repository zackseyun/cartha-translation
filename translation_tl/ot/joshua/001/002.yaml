  to: Namatay na si Moises, ang aking lingkod. Kaya ngayon, bumangon ka at tumawid sa Jordan na ito—ikaw at ang buong bayang ito—patungo sa lupaing ibinibigay ko sa kanila, sa mga anak na lalaki ni Israel.[a]
