  terminology: Ang «aking lingkod,» «Jordan,» «bayang ito,» at «lupain» ay angkop. Pinananatili ang literal na panlalaking anyo ng בְנֵי sa «mga anak na lalaki ni Israel,» at ipinaliliwanag ng talababa ang mga mas idiomatikong alternatibo nang hindi binabago ang pangunahing salin.
