  naturalness: May isang maliit ngunit kapaki-pakinabang na pagwawasto para sa likas na modernong Filipino. Ang “gaya ng ibinigay niya sa inyo” ay nauunawaan, ngunit kulang ang hayag na pantukoy sa “kapahingahan” at maaaring pansamantalang magmukhang ang lupain ang ibinigay sa mga kausap. Ang “gaya rin ng ibinigay niya sa inyo” ay mas malinaw at nananatiling matapat sa elipsis ng Hebreo.
  terminology: Ang “Yahweh,” “kapahingahan,” “mga kapatid,” “angkinin,” “lingkod,” at “sa dakong sikatan ng araw” ay angkop at magkakatugma sa pinagmulan. Ang mga talababa ay wastong nakaangkla at may tamang saklaw.
