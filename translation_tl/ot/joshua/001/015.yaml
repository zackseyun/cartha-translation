reference: Joshua 1:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: tl
  text: hanggang sa bigyan ni Yahweh ng kapahingahan ang inyong mga kapatid[a], gaya rin ng ibinigay niya sa inyo, at maangkin din nila ang lupaing ibinibigay sa kanila ni Yahweh na inyong Diyos. Pagkatapos, babalik kayo sa lupaing inyong pag-aari at aangkinin ninyo iyon—ang lupaing ibinigay sa inyo ni Moises na lingkod ni Yahweh sa kabila ng Jordan, sa dakong sikatan ng araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kapwa Israelita ninyo.” Sa Hebreo, “mga kapatid ninyo,” na tumutukoy dito sa iba pang mga lipi ng Israel.
    reason: lexical_alternative
  - marker: b
    text: O “sa silangan”; literal, “sa dakong sikatan ng araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: bigyan ... ng kapahingahan
  rationale: Ang Hiphil ng נוח ay tumutukoy rito sa pagkakaloob ng kapahingahan at katiwasayan mula sa labanan; pinananatili ng salin ang mahalagang temang 'kapahingahan' sa aklat.
- source_word: לַאֲחֵיכֶם
  choice: inyong mga kapatid
  rationale: Tuwirang pinananatili ang panlalaking maramihang katawagan sa Hebreo; sa konteksto, tumutukoy ito sa iba pang mga lipi ng Israel.
- source_word: כָּכֶם
  choice: gaya ng ibinigay niya sa inyo
  rationale: Eliptikal ang Hebreo, literal na 'gaya ninyo'; isinusuplay ang kilos ng pagbibigay ng kapahingahan upang maging malinaw at likas sa Tagalog.
- source_word: וְיָרְשׁוּ / וִירִשְׁתֶּם אֹתָהּ
  choice: maangkin / aangkinin
  rationale: Sa konteksto ng pananakop at paghahati ng lupain, ang ירשׁ ay pagkuha at pagtataglay sa lupaing ipinagkaloob; ang 'angkinin' ay likas at naipapakita ang parehong aktibo at pamanaang diwa.
- source_word: נֹתֵן
  choice: ibinibigay
  rationale: Pinananatili ang nagpapatuloy o nalalapit na aspekto ng participle at ang Diyos bilang tagapagkaloob ng lupain.
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: lupaing inyong pag-aari
  rationale: Ipinapahayag ang lupaing inilaan sa kanila bilang mana at pag-aari nang hindi pinipilit ang isang mas makitid na kahulugan.
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Ang עבד ay marangal na opisyal na titulo para kay Moises sa kontekstong ito; ang 'lingkod' ang angkop kaysa 'alipin.'
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Karaniwang heograpikong pahayag ito at pinananatili ang pananaw na ipinahihiwatig ng konteksto.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: sa dakong sikatan ng araw
  rationale: Pinananatili ang kongkretong larawang Hebreo habang malinaw na tumutukoy sa silangan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan ng tipan ang tahasang nasa tekstong Hebreo; ginagamit ang 'Yahweh' upang katawanin ito bilang pangalan, hindi bilang titulo.
- issue: Kasariang ipinahihiwatig ng אֲחֵיכֶם
  choice: inyong mga kapatid
  alternative: inyong mga kapwa Israelita
  rationale: Pinananatili ang literal na katawagang pangkamag-anak sa tekstong Hebreo, habang nililinaw sa talababa ang saklaw nito sa konteksto.
- issue: Kahulugan ng kapahingahang ipinagkakaloob
  choice: kapahingahan
  alternative: kaginhawahan / katiwasayan
  rationale: Hindi nililimitahan ang salita sa isang tiyak na doktrinal na kahulugan; sa konteksto, kasama rito ang pamamahinga at katiwasayan mula sa digmaan upang manirahan sa lupain.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kapahingahan' upang mapanatili ang tematikong salita, 'angkinin' para sa aktibong pagtataglay ng ipinagkaloob na lupain, at 'sa dakong sikatan ng araw' upang mapanatili ang imahen ng orihinal. Ang mga panghalip na maramihan ay isinaling 'inyong/kayo' upang ipakita na ang utos ay para sa pangkat.
