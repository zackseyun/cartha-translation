  source_fidelity: Tumpak na naihahatid ng salin ang panahong kasunod ng kamatayan ni Moises, ang titulong “lingkod ni Yahweh,” ang pagsasalita ni Yahweh kay Josue na anak ni Nun, at ang tungkulin ni Josue bilang מְשָׁרֵת ni Moises. Ang tutuldok ay sapat na katumbas sa gamit ng לֵאמֹר bilang panimula sa kasunod na pananalita.
  naturalness: Malinaw at likas ang makabagong Filipino. Ang “Pagkamatay ni Moises” ay maayos na panandang pansalaysay at hindi nagdaragdag ng tahasang “ngayon.”
  terminology: Ang “Yahweh,” “lingkod,” “Josue,” at “tagapaglingkod” ay angkop at magkakatugma sa piniling rehistro. Ang “tagapaglingkod” ay isang katanggap-tanggap na rendering ng מְשָׁרֵת; ang talababa ay wastong nagbibigay ng mga mas malalapit na alternatibo.
