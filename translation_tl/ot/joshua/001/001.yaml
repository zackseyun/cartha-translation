id: JOS.1.1
reference: Joshua 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: tl
  text: 'Pagkamatay ni Moises, na lingkod ni Yahweh, sinabi ni Yahweh kay Josue na anak ni Nun, na tagapaglingkod ni Moises[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “tagapaglingkod ni Moises” bilang “alalay ni Moises” o “lingkod ni Moises.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת
  choice: Pagkamatay
  rationale: Likas at maikli itong panandang pangyayari sa salaysay. Ipinahahayag nito ang temporal na diwa ng ‘pagkatapos mamatay’ nang hindi nagdaragdag ng tahasang salitang ‘ngayon,’ na wala sa Hebreo.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa makabagong salin sa Filipino.
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Sa titulong ito para kay Moises, ang עֶבֶד ay tumutukoy sa marangal na paglilingkod at tungkulin sa Diyos; mas angkop ang ‘lingkod’ kaysa ‘alipin.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Karaniwan at tuwirang katumbas ito ng pandiwang אמר sa pagpapakilala ng sasabihin ng Diyos.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josue na anak ni Nun
  rationale: Ginamit ang nakasanayang Filipino na anyo ng Joshua at natural na ipinahayag ang patronimiko.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: tagapaglingkod ni Moises
  rationale: Ipinahahayag nito ang patuloy na personal na paglilingkod o pag-aasikaso ni Josue kay Moises, nang hindi nagdadala ng makabagong eklesyastikal na diwa ng ‘ministro.’
- source_word: לֵאמֹר
  choice: ':'
  rationale: Natural na ginagampanan ng tutuldok sa makabagong Filipino ang tungkulin nitong magpakilala sa tuwirang pananalitang kasunod.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang pagkakaiba nito sa titulong ‘Panginoon.’
- issue: Kahulugan ng עֶבֶד sa titulo ni Moises
  choice: lingkod
  alternative: alipin
  rationale: Bagaman maaaring mangahulugan ng ‘alipin’ ang salita sa ibang konteksto, dito ay marangal na titulong naglalarawan sa katapatan at tungkulin ni Moises kay Yahweh.
- issue: Tungkulin ni Josue bilang מְשָׁרֵת ni Moises
  choice: tagapaglingkod
  alternative: alalay, katuwang, o lingkod
  rationale: Pinananatili ng ‘tagapaglingkod’ ang diwa ng personal na pag-aasikaso at paglilingkod, habang kinikilala sa talababa ang saklaw ng posibleng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang lipas na pormulang katumbas ng ‘at nangyari’ at ang di-likas na ‘na sinasabi,’ habang pinanatili sa tutuldok ang pagpapakilala sa kasunod na tuwirang pananalita.
