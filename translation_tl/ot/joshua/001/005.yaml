base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: tl
  text: Walang sinumang makatatayo sa harap mo sa lahat ng araw ng buhay mo.[a] Noon, kung paanong ako'y kasama ni Moises, makakasama mo rin ako. Hindi kita bibiguin[b] ni pababayaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Walang sinumang makatatagal laban sa iyo.” Ang idyomang Hebreo ay maaaring mangahulugang walang magtatagumpay sa paglaban sa iyo.
    reason: lexical_alternative
  - marker: b
    text: O “Hindi kita bibitawan.” Ang unang pandiwa ay maaaring magpahiwatig ng hindi pagluwag ng hawak, hindi pagpapabagsak, o hindi pagkukulang sa pag-alalay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב
  choice: makatatayo
  rationale: Pinananatili nito ang larawang Hebreo ng pagtayo sa harap ng isang tao; sa konteksto, tumutukoy ito sa matagumpay na paglaban kay Josue.
- source_word: אִישׁ
  choice: sinuman
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, pangkalahatan ang gamit nito at tumutukoy sa sinumang taong haharap bilang kalaban. Ang “sinuman” ang likas at tumpak na katumbas sa makabagong Tagalog.
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Tuwirang pinananatili ang idyomang Hebreo, habang ipinahihiwatig ng kontekstong militar ang pagharap bilang kalaban.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: sa lahat ng araw ng buhay mo
  rationale: Malapit ito sa kayarian ng Hebreo at malinaw na tumutukoy sa buong panahon ng buhay ni Josue.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: Kung paanong kasama ako ni Moises
  rationale: Malinaw na ipinapahayag ang paghahambing sa presensiya ng Diyos kay Moises.
- source_word: אֶהְיֶה עִמָּךְ
  choice: gayon din ako makakasama mo
  rationale: Likas na ipinapahayag sa Tagalog ang pangakong mananatili ang presensiya ng Diyos kay Josue at ang pagtutulad nito sa karanasan ni Moises.
- source_word: אַרְפְּךָ
  choice: bibiguin
  rationale: Saklaw nito ang diwang hindi pagkukulang sa pagsuporta o hindi pagpapabaya na bumagsak, nang hindi ito ipinapareho sa kasunod na pandiwang “pababayaan.”
- source_word: אֶעֶזְבֶךָּ
  choice: pababayaan
  rationale: Natural at marangal itong katumbas ng pag-iwan o pagtalikod, at angkop sa taimtim na pangako ng Diyos.
theological_decisions:
- issue: Pangkalahatang gamit ng panlalaking isahang אִישׁ
  choice: Walang sinuman
  alternative: Walang taong makatatayo
  rationale: Pangkalahatan ang kahulugan ng pangngalang Hebreo rito, hindi isang pahayag na ang mga lalaki lamang ang tinutukoy. Inihahatid ng “sinuman” ang aktuwal na saklaw nito sa natural na Tagalog nang hindi nagdaragdag ng isang tiyak na uri ng kalaban.
- issue: Diwa ng dalawang pangakong לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ
  choice: Hindi kita bibiguin ni pababayaan
  alternative: Hindi kita bibitawan ni pababayaan
  rationale: Pinananatili ng salin ang pagkakaiba ng hindi pagkukulang sa pag-alalay at ng hindi pag-iwan. Inilalahad sa talababa ang mas kongkretong larawan ng unang pandiwa nang hindi nilulutas nang labis ang lawak ng kahulugan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang idyomang “makatatayo sa harap mo” at ipinaliwanag ang diwang militar sa talababa. Ginamit ang “ni” sa tambalang pagtanggi upang maging maikli at taimtim ang pangwakas na pangako.
