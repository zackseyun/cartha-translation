  yaml_path: translation/ot/joshua/001/016.yaml
  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: tl
  text: At sumagot sila kay Josue, “Gagawin namin ang lahat ng iniutos mo sa amin, at pupunta kami saanman mo kami ipadala.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: At sumagot sila
  rationale: Ang qal wayyiqtol ng ענה ay karaniwang nagsasaad ng tugon sa salaysay; natural sa Tagalog ang “sumagot sila.”
- source_word: אֶת יְהוֹשֻׁעַ
  choice: kay Josue
  rationale: Bagaman minamarkahan ng אֶת ang tuwirang layon sa Hebreo, si Josue ang taong kinakausap; likas sa Tagalog ang “sumagot ... kay Josue.”
- source_word: לֵאמֹר
  choice: '[ipinahiwatig ng panipi]'
  rationale: Ipinakikilala ng pormulang ito ang tuwirang pananalita. Sa modernong Tagalog, sapat at mas natural ang kuwit at panipi kaysa idagdag ang mabigat na “na sinasabi.”
- source_word: כֹּל אֲשֶׁר צִוִּיתָנוּ
  choice: ang lahat ng iniutos mo sa amin
  rationale: Pinananatili nito ang kabuuang saklaw ng כֹּל אֲשֶׁר at ang awtoritatibong diwa ng צוה nang natural sa Tagalog.
- source_word: נַעֲשֶׂה
  choice: Gagawin namin
  rationale: Ang עשה ay tuwirang nangangahulugang gawin o isakatuparan; malinaw na tumutukoy rito sa pagsunod sa mga iniutos.
- source_word: וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ
  choice: at pupunta kami saanman mo kami ipadala
  rationale: 'Locative ang diwa ng parirala: anumang lugar na pagpadalhan sa kanila. Ang “saanman ... ipadala” ay tumpak at likas sa modernong Tagalog.'
- source_word: נֵלֵךְ
  choice: pupunta kami
  rationale: Ang הלך ay karaniwang pandiwang “pumunta/lumakad”; “pupunta kami” ang angkop sa ipinahiwatig na destinasyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang pangalang “Josue,” ang nakaugaliang anyo sa Bibliyang Tagalog. Hindi na isinalin nang hiwalay ang לֵאמֹר dahil malinaw na ipinakikilala ng panipi ang tuwirang sinabi; walang tunay na kalabuan o tekstuwal na usaping nangangailangan ng talababa.
