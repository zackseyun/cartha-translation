  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: tl
  text: 'Alalahanin ninyo ang iniutos sa inyo ni Moises na lingkod ni Yahweh: “Si Yahweh na inyong Diyos ay nagbibigay sa inyo ng kapahingahan at ibinigay na niya[a] sa inyo ang lupaing ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at ibibigay niya sa inyo ang lupaing ito.” Maaaring tumukoy ang anyong Hebreo sa natapos nang kilos o sa isang tiyak na pangyayaring magaganap sa hinaharap.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָכוֹר
  choice: Alalahanin ninyo
  rationale: Ang Qal imperative ay pang-isahan sa anyo, ngunit si Josue ay nakikipag-usap sa mga lipi bilang isang pangkat at ang kasunod na mga panghalip ay maramihan. Likas sa modernong Tagalog ang “Alalahanin ninyo.”
- source_word: הַדָּבָר אֲשֶׁר צִוָּה אֶתְכֶם
  choice: ang iniutos sa inyo
  rationale: Maaaring mangahulugan ang דָּבָר ng salita, bagay, o usapin. Dito, nililinaw ng צִוָּה na ang tinutukoy ay ang naunang utos ni Moises; ang pinagsamang salin ay natural at hindi paulit-ulit sa Tagalog.
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Sa kontekstong ito, ang עֶבֶד ay marangal na katawagan sa paglilingkod ni Moises sa Diyos, kaya “lingkod” ang angkop kaysa “alipin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: מֵנִיחַ לָכֶם
  choice: Binibigyan kayo ng kapahingahan
  rationale: Ang Hiphil participle ay nagsasaad ng pagkakaloob ng pahinga, katiwasayan, at paninirahan. Pinananatili ng aspektong nagpapatuloy ng “binibigyan” ang anyong participle.
- source_word: וְנָתַן לָכֶם
  choice: at ibinigay na niya sa inyo
  rationale: Ang qatal ay maaaring tumukoy sa natapos na pagkakaloob. Ang mga liping kinakausap ay natanggap na ang kanilang lupain sa silangan ng Jordan, kaya ang natapos na kilos ang pinakamalinaw sa agarang konteksto, habang inilalahad sa talababa ang posibleng pagpapakahulugang panghinaharap.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ang lupaing ito
  rationale: Natural na katumbas ito ng pariralang pantukoy sa teritoryong ipinagkaloob sa mga lipi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Aspekto ng וְנָתַן at ang pagkakaloob ng lupain
  choice: ibinigay na niya
  alternative: ibibigay niya
  rationale: Kayang ipahayag ng anyong Hebreo ang natapos na kilos o isang tiyak na panghinaharap. Pinapaboran ng konteksto ng mga liping nakatanggap na ng lupain sa silangan ng Jordan ang natapos na kilos, ngunit tunay ang alternatibong panghinaharap at kaya isinama sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang “iniutos” upang maging natural ang pangungusap, at pinanatili ang “kapahingahan” dahil saklaw nito kapwa ang paghinto sa pakikidigma at ang katiwasayan sa lupain.
