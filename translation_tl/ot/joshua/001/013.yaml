  source_fidelity: Tumpak na naipapahayag ng salin ang utos na alalahanin ang iniutos ni Moises, ang marangal na titulong “lingkod ni Yahweh,” ang pagkakaloob ng kapahingahan, at ang lupaing tinutukoy. Ang “ibinigay na niya” ay isang maaaring salin ng Hebreong וְנָתַן sa kontekstong ito; wastong pinananatili sa talababa ang posibleng panghinaharap na pagbasa.
