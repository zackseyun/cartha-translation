  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: tl
  text: Huwag mawala sa iyong bibig ang aklat na ito ng Kautusan. Pagbulayan[a] mo ito araw at gabi upang maingat mong sundin ang lahat ng nakasulat dito. Sa gayon, magiging matagumpay ang iyong landas at kikilos ka nang may karunungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring mangahulugang “usalin” o “bigkasin nang pabulong.” Maaaring kabilang sa salitang Hebreo ang tahimik na paulit-ulit na pagbigkas, hindi lamang ang panloob na pagninilay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּשׁ
  choice: mawawala
  rationale: Ipinapahayag nito ang pag-alis o pagkawala, at sa pariralang “sa iyong bibig” ay natural na pinananatili ang larawang palaging binibigkas o handang bigkasin ang Kautusan.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: ang aklat na ito ng Kautusan
  rationale: Ang סֵפֶר ay aklat o balumbon; ang תּוֹרָה rito ay ang nakasulat na tipanang Kautusang dapat sundin ni Josue. Ginamit ang malaking titik upang tukuyin ang partikular na corpus, hindi ang batas sa pangkalahatan.
- source_word: מִפִּיךָ
  choice: sa iyong bibig
  rationale: Pinananatili ang kongkretong idyomang Hebreo na nagpapahiwatig ng pagsasalita, pagbigkas, at patuloy na pagdadala nito sa mga labi.
- source_word: וְהָגִיתָ
  choice: Pagbulayan mo
  rationale: Maaaring tumukoy ang הגה sa mahinang pagbigkas, pag-usal, o mapagnilay na pagbubulay. Natural sa modernong Tagalog ang “pagbulayan,” habang inilalahad sa talababa ang oral na diwa.
- source_word: יוֹמָם וָלַיְלָה
  choice: araw at gabi
  rationale: Tuwirang katumbas at likas na merismo sa Tagalog para sa patuloy na gawain.
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: upang maingat mong gawin
  rationale: Ipinahahayag ang layunin at ang maingat na pagsunod, nang hindi ginagawang mabigat o di-likas ang Tagalog.
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: ang lahat ng nakasulat dito
  rationale: Pinananatili ang kabuuang saklaw ng כְּכָל at ang nakasulat na pamantayang tinutukoy.
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: pauunlarin mo ang iyong landas
  rationale: 'Pinananatili ang causative na anyo ng Hiphil: si Josue ang gramatikal na paksa na magpapaging maunlad o matagumpay sa kanyang landas, hindi lamang tatanggap ng pag-unlad.'
- source_word: תַּשְׂכִּיל
  choice: kikilos ka nang may karunungan
  rationale: Pinananatili ang diwa ng pagkilos nang may unawa o karunungan at iniiwasang ipantay ito sa nauna nang pandiwang may diwa ng pag-unlad.
theological_decisions:
- issue: Kahulugan ng תּוֹרָה sa konteksto ng tipan
  choice: Kautusan
  alternative: tagubilin; Torah
  rationale: Bagaman maaaring mangahulugan ng “tagubilin” ang תּוֹרָה, tumutukoy ito rito sa partikular na nakasulat na corpus ng tipan na dapat sundin ni Josue. Malinaw at pamilyar ang “Kautusan” nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Pagbubulay bilang tahimik na pagninilay o pasalitang pag-usal
  choice: Pagbulayan mo ito, na may talababa tungkol sa mahinang pagbigkas
  alternative: usalin mo ito; bigkasin mo ito nang pabulong
  rationale: 'Magkasama sa talata ang pasalita at mapagnilay na aspekto: hindi ito mawawala sa bibig ni Josue, at gagawin niya ang הגה araw at gabi. Pinananatili ng pangunahing teksto ang natural na pagbasa at ng talababa ang tunay na leksikal na lawak.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang kongkretong “sa iyong bibig,” ang causative na diwa ng “pauunlarin mo,” at ang pagkakaiba ng pag-unlad at pagkilos nang may karunungan. Ang marker na [a] ay nasa pangunahing teksto.
