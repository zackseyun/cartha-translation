id: JOS.1.4
reference: Joshua 1:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מֵ/הַ/מִּדְבָּר֩ וְ/הַ/לְּבָנ֨וֹן הַ/זֶּ֜ה וְֽ/עַד הַ/נָּהָ֧ר הַ/גָּד֣וֹל נְהַר פְּרָ֗ת כֹּ֚ל אֶ֣רֶץ הַֽ/חִתִּ֔ים וְ/עַד הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֣וֹא הַ/שָּׁ֑מֶשׁ יִֽהְיֶ֖ה גְּבוּלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: tl
  text: Mula sa ilang at sa Lebanon na ito hanggang sa malaking ilog, ang Ilog Eufrates—ang buong lupain ng mga Heteo—at hanggang sa Malaking Dagat[a], sa dakong nilulubugan ng araw[b], ang magiging hangganan ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang Dagat Mediteraneo.
    reason: cross_reference
  - marker: b
    text: O “sa dakong kanluran”; literal, “sa dakong pinapasukan ng araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: Mula sa ilang
  rationale: Ang מִדְבָּר ay tumutukoy sa ilang o tigang na lupa. Pinili ang “ilang” bilang likas at kinikilalang katawagang pangheograpiya sa Tagalog nang hindi labis na tinutukoy ang uri ng lupain.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: at sa Lebanon na ito
  rationale: Pinanatili ang tahasang demonstratibong הַזֶּה bilang “na ito,” at ang Lebanon bilang pangalang pantangi.
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: hanggang sa malaking ilog, ang Ilog Eufrates
  rationale: 'Iningatan ang aposisyon ng Hebreo: una ang “malaking ilog,” saka ang tiyak na pagkakakilanlang “Ilog Eufrates.” Ang “hanggang sa” ay angkop sa gamit ng עַד sa paglalarawan ng hangganan.'
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: ang buong lupain ng mga Heteo
  rationale: Isinasalin ng “buong” ang כֹּל at pinananatili ng “lupain ng mga Heteo” ang etniko at heograpikong pagtukoy ng parirala.
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: at hanggang sa Malaking Dagat
  rationale: Pinanatili sa pangunahing teksto ang literal na katawagang “Malaking Dagat” sa halip na palitan ito ng interpretatibong pangalang “Dagat Mediteraneo”; inilagay ang pagkakakilanlan sa talababa.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: sa dakong nilulubugan ng araw
  rationale: Pinananatili nito ang larawang Hebreo ng paglubog ng araw habang likas na ipinahahayag ang direksiyon sa Tagalog. Ang idiomatikong kahulugang “kanluran” ay ibinigay sa talababa.
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: ang magiging hangganan ninyo
  rationale: Sa konteksto ng pagtatakda ng lawak ng lupain, ang גְּבוּל ay pinakamalinaw na “hangganan.” Ang “magiging” ay natural na nagpapahayag ng di-ganap na pandiwang Hebreo bilang pahayag na may bisa sa hinaharap.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang mga heograpikong katawagang nasa Hebreo at ang larawan ng paglubog ng araw, habang ang mga paliwanag na makatutulong sa karaniwang mambabasa ay inilagay sa mga talababa.
