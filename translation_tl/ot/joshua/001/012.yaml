base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/012.yaml
  text: And to the Reubenites[a], and to the Gadites, and to the half-tribe of Manasseh, Joshua said,
translation:
  language: tl
  text: At sinabi ni Josue sa mga Rubenita, sa mga Gadita, at sa kalahating lipi ni Manases,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “na sinasabi.” Ipinakikilala ng salitang ito ang sasabihin ni Josue, na nagpapatuloy sa susunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: sa mga Rubenita
  rationale: Ang pang-uring pantangi na nasa isahan sa Hebreo ay kolektibo ang gamit. Likas at malinaw sa Tagalog ang maramihang “mga Rubenita”; ang pang-ukol na לְ ay isinaling “sa.”
- source_word: וְ/לַ/גָּדִי
  choice: sa mga Gadita
  rationale: Kolektibo rin ang isahang anyo sa Hebreo, kaya ginamit ang natural na maramihang “mga Gadita.”
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַֽ/מְנַשֶּׁה
  choice: at sa kalahating lipi ni Manases
  rationale: Tuwirang ipinahahayag ng parirala ang kalahati ng lipi ni Manases. Ang “kalahating lipi” ay maikli, malinaw, at natural sa Tagalog.
- source_word: אָמַר
  choice: sinabi
  rationale: Karaniwang pandiwa ito para sa pagsasabi. Sa ayos na “At sinabi ni Josue…” ay malinaw na ipinakikilala ang susunod na tuwirang pananalita.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong Bibliyang Tagalog.
- source_word: לֵ/אמֹר
  choice: ','
  rationale: Ang literal na “na sinasabi” ay panandang nagpapakilala sa mismong pananalitang nagpapatuloy sa susunod na talata. Mas natural sa Tagalog na katawanin ito ng bantas, habang ipinaliliwanag sa talababa.
