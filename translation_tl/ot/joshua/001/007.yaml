  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: tl
  text: Magpakatatag ka lamang at lakasan mo nang lubos ang iyong loob. Tiyakin mong maingat na sundin ang buong Kautusang iniutos sa iyo ni Moises na aking lingkod. Huwag kang lumihis dito, sa kanan man o sa kaliwa, upang kumilos ka nang may karunungan[a] saan ka man pumunta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang magtagumpay ka” o “upang maging matagumpay ka” saan ka man pumunta.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: lamang
  rationale: Nagbibigay ito ng paghihigpit at matinding pagdiriin sa mahalagang utos nang hindi nagdaragdag ng bagong ideya.
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: magpakatatag ka ... at lakasan mo nang lubos ang iyong loob
  rationale: Likas sa makabagong Filipino ang tambalang pahayag na ito at naipapakita nito kapwa ang katatagan at matapang na pagpapasiya; ang “nang lubos” ang katumbas ng matinding diin ng מְאֹד.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: tiyakin mong maingat na sundin
  rationale: Pinagsasama nito ang diwa ng maingat na pagbabantay o pagtupad at ng aktuwal na paggawa, sa natural na Filipino.
- source_word: כְּכָל הַתּוֹרָה
  choice: ang buong Kautusan
  rationale: Tinutukoy sa konteksto ang kabuuan ng kautusang ibinigay sa pamamagitan ni Moises; pinananatili ng “buong” ang saklaw ng כָּל.
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: iniutos sa iyo ni Moises na aking lingkod
  rationale: Tuwirang pinananatili ang utos kay Josue at ang banal na pagtukoy kay Moises bilang “aking lingkod.”
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: Huwag kang lumihis dito, sa kanan man o sa kaliwa
  rationale: Malinaw na pinananatili ang larawan ng hindi paglihis sa itinakdang landas sa alinmang panig.
- source_word: לְמַעַן
  choice: upang
  rationale: Natural na nagpapahayag ng layunin o inaasahang bunga.
- source_word: תַּשְׂכִּיל
  choice: kumilos ka nang may karunungan
  rationale: Itinatampok nito ang pangunahing diwa ng maingat at may-unawang pagkilos, habang inilalagay sa talababa ang lehitimong kahulugan ng pagtatagumpay.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: saan ka man pumunta
  rationale: Pinananatili nito ang pandiwang “pumunta/lumakad” at natural na ipinahahayag ang ganap na saklaw.
theological_decisions:
- issue: Kahulugan ng תּוֹרָה sa konteksto ng tipan
  choice: Kautusan
  alternative: tagubilin
  rationale: Dahil tahasang tinutukoy ang iniutos ni Moises, nangingibabaw rito ang legal at pangtipang diwa, bagaman mas malawak din ang maaaring kahulugan ng salitang Hebreo.
- issue: Kahulugan ng תַּשְׂכִּיל
  choice: kumilos nang may karunungan
  alternative: magtagumpay / maging matagumpay
  rationale: Maaaring tumukoy ang anyong Hebreo sa pagkilos nang may unawa at sa ibinubunga nitong tagumpay. Iniiwasan ng pangunahing teksto ang labis na pagpapatingkad sa materyal na kasaganaan, samantalang pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” bilang kinikilalang katawagan sa Kautusan ni Moises, ngunit iniwasan ang lipas o labis na pormal na ayos. Ang “lakasan mo nang lubos ang iyong loob” ay mas natural sa karaniwang mambabasa kaysa sa literal ngunit matigas na “maging matapang nang lubos.”
