  source_fidelity: 'Tapat ang salin sa Hebreo: ang mga asawa, anak, at alagang hayop ay mananatili sa lupain sa kabila ng Jordan, samantalang ang mga mandirigma ay tatawid nang una upang tumulong. Ang “sa kabila ng Jordan” ay angkop at hindi nagpapataw ng direksiyonal na pananaw na wala sa teksto.'
