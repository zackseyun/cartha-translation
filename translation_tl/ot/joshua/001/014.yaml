id: JOS.1.14
reference: Joshua 1:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: tl
  text: Ang inyong mga asawa, mga anak, at mga alagang hayop ay mananatili sa lupaing ibinigay sa inyo ni Moises sa kabila ng Jordan. Ngunit kayong lahat na magigiting na mandirigma ay tatawid na armado[a] sa unahan ng inyong mga kapatid[b] at tutulungan ninyo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakaayos para sa labanan” o “handa sa digmaan.”
    reason: alternative_reading
  - marker: b
    text: Ibig sabihin, ang kanilang mga kapuwa Israelita; gumagamit ang Hebreo ng panlalaking katawagang pangkamag-anak na may kolektibong saklaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: inyong mga asawa
  rationale: Sa kontekstong sambahayan at militar, tumutukoy ito sa mga asawa ng mga lalaking kinakausap; natural sa Filipino ang “mga asawa.”
- source_word: טַפְּכֶם
  choice: mga anak
  rationale: Ang טַף ay karaniwang tumutukoy sa maliliit na anak o mga batang umaasa sa sambahayan. Ang “mga anak” ay malinaw at likas sa modernong Filipino nang hindi nagpapasok ng di-tiyak na eksaktong edad.
- source_word: וּמִקְנֵיכֶם
  choice: at mga alagang hayop
  rationale: Tumutukoy ang מִקְנֶה rito sa mga domestikadong hayop o kawan; mas malinaw sa karaniwang mambabasa ang “mga alagang hayop” kaysa sa mas makitid na “mga baka.”
- source_word: יֵשְׁבוּ
  choice: ay mananatili
  rationale: Sa konteksto, ang diwa ng ישב ay pananatili sa lupaing naibigay habang tumatawid ang mga mandirigma.
- source_word: בָּאָרֶץ
  choice: sa lupaing
  rationale: Ang אֶרֶץ ay tumutukoy sa teritoryong tinahanan sa silangan ng Jordan; “lupain” ang likas at angkop na salin.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: ibinigay sa inyo ni Moises
  rationale: Ipinahihiwatig ng qatal ang natapos nang pagbibigay mula sa pananaw ng salaysay.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Pinananatili nito ang heograpikong pahayag ng Hebreo nang hindi tahasang nilulutas ang direksiyonal na pananaw.
- source_word: וְאַתֶּם תַּעַבְרוּ
  choice: Ngunit ... ay tatawid
  rationale: Ang “ngunit” ay malinaw na naghahayag ng pagsalungat sa pagitan ng mga maiiwan at ng mga tatawid.
- source_word: חֲמֻשִׁים
  choice: armado
  rationale: Sa kontekstong militar, malamang na nangangahulugang nasasandatahan o handa para sa labanan; inilalagay sa talababa ang ibang posibleng himig.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: sa unahan ng inyong mga kapatid
  rationale: Ipinapahayag nito ang pag-una sa kapuwa mga Israelita at natural sa Filipino.
- source_word: אֲחֵיכֶם
  choice: inyong mga kapatid
  rationale: Ang “kapatid” sa Filipino ay hindi minamarkahan ang kasarian, ngunit tapat na naghahatid ng ugnayang pangkamag-anak ng Hebreo; nililinaw sa talababa ang kolektibong tinutukoy.
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: kayong lahat na magigiting na mandirigma
  rationale: Naglalarawan ito sa lahat ng malalakas at may-kakayahang lalaking pandigma; malinaw at marangal sa modernong Filipino ang “magigiting na mandirigma.”
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: at tutulungan ninyo sila
  rationale: Tuwirang ipinapahayag ang tungkuling tumulong sa ibang mga Israelita sa pananakop.
theological_decisions:
- issue: Kasariang ipinahihiwatig ng אֲחֵיכֶם
  choice: inyong mga kapatid
  alternative: inyong mga kapuwa Israelita
  rationale: Masinsinang pangngalang panlalaki ang nasa Hebreo ngunit kolektibo ang saklaw. Dahil likas na hindi gender-marked ang “kapatid” sa Filipino, napapanatili nito kapwa ang talinghagang pampamilya at ang malawak na tinutukoy nang hindi nagdaragdag ng “mga kapatid na lalaki.”
- issue: Kahulugan ng חֲמֻשִׁים
  choice: armado
  alternative: nakaayos para sa labanan / handa sa digmaan
  rationale: Pinakamalamang sa konteksto ang pagiging nasasandatahan o nakahanda sa labanan, ngunit hindi ganap na tiyak ang eksaktong nuance kaya pinananatili sa talababa ang mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Jordan” bilang nakagawiang pangalan, “lupain” para sa teritoryo, at “magigiting na mandirigma” upang maiwasan ang sobrang makalumang pananalita. Inilagay kaagad ang “armado” sa pandiwang pagtawid upang maging malinaw ang ugnayan nito sa mga mandirigma.
