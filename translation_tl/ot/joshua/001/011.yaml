  text: עִבְר֣וּ בְּ/קֶ֣רֶב הַֽ/מַּחֲנֶ֗ה וְ/צַוּ֤וּ אֶת הָ/עָם֙ לֵ/אמֹ֔ר הָכִ֥ינוּ לָ/כֶ֖ם צֵידָ֑ה כִּ֞י בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים אַתֶּם֙ עֹֽבְרִים֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם נֹתֵ֥ן לָ/כֶ֖ם לְ/רִשְׁתָּֽ/הּ׀־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: tl
  text: '“Dumaan kayo sa gitna ng kampo at iutos ninyo sa bayan: ‘Maghanda kayo ng mga baon, sapagkat sa loob ng tatlong araw[a] ay tatawid kayo sa Jordan na ito upang pumasok at angkinin ang lupain na ibinibigay sa inyo ni Yahweh na inyong Diyos upang ariin ito.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tatlong araw pa” o “pagkalipas ng tatlong araw.” Ipinahihiwatig ng Hebreo ang maikling panahong nalalabi bago ang pagtawid; “sa loob ng tatlong araw” ang pinakamalinaw na pagpapahayag dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: Lumibot kayo sa gitna ng kampo
  rationale: Ang utos ay sa mga pinunong kikilos sa loob at sa gitna ng kampo. Mas natural sa modernong Tagalog ang “lumibot” kaysa sa literal ngunit malabong “dumaan,” habang pinananatili ng “sa gitna” ang larawan ng Hebreo.
- source_word: וְצַוּוּ אֶת־הָעָם לֵאמֹר
  choice: at utusan ang mga tao
  rationale: Pinananatili ng “utusan” ang awtoritatibong puwersa ng צוה; ipinakikilala ng tutuldok ang tuwirang sinabi nang hindi na kailangang isalin nang kahoy ang לֵאמֹר.
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: Maghanda kayo ng mga baon
  rationale: Ang צֵידָה ay pagkaing panustos para sa paglalakbay. Ang “mga baon” ay likas at madaling maunawaang Tagalog sa kontekstong ito; ang reflexive na diwa ng לָכֶם ay sapat nang naipahihiwatig ng utos sa kanila.
- source_word: כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: sapagkat sa loob ng tatlong araw
  rationale: Ipinahahayag nito ang maikling panahong nalalabi bago tumawid, nang hindi ipinipilit ang eksaktong alternatibong “pagkalipas ng tatlong araw.”
- source_word: אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן הַזֶּה
  choice: tatawid kayo sa Jordan na ito
  rationale: Natural sa Tagalog ang panghinaharap para sa nalalapit at tiyak na pagkilos; pinananatili ng “na ito” ang demonstratibong immediacy ng Hebreo.
- source_word: לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ
  choice: upang pumasok at angkinin ang lupain
  rationale: Inilalahad ng magkakaugnay na infinitive ang pagpasok na may layuning kunin bilang pag-aari ang lupain. Ang “angkinin” ay naghahatid ng diwa ng ירשׁ sa konteksto ng pamana at pananakop.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh na inyong Diyos
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang pangalang tipan na יהוה; natural sa Tagalog ang “na inyong Diyos.”
- source_word: נֹתֵן לָכֶם לְרִשְׁתָּהּ
  choice: ibinibigay sa inyo ... upang ariin ninyo
  rationale: Pinananatili ng “ibinibigay” ang kasalukuyan at tiyak na kilos ng participle, at ng “upang ariin ninyo” ang inuulit na layunin ng pag-aangkin sa hulihan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Nasa Hebreo mismo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng banal na kaloob at pag-angkin ng Israel
  choice: “ibinibigay ... upang ariin”
  alternative: “ibibigay ... kapag nasakop”
  rationale: 'Pinananatili ang tensiyon ng teksto: kasalukuyan at tiyak ang pagkakaloob ni Yahweh, ngunit kailangan pa ring pumasok ang Israel at angkinin ang lupain. Hindi ginawang kondisyon o purong kinabukasan ang kaloob.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kampo,” “baon,” at “lupain” bilang natural at pamilyar na mga salita; iniwasan ang sobrang makaluma o kahoy na sintaks. Nasa pangunahing teksto ang marker na [a].
