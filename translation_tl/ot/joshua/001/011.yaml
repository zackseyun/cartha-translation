  to: '“Dumaan kayo sa gitna ng kampo at iutos ninyo sa bayan: ‘Maghanda kayo ng mga baon, sapagkat sa loob ng tatlong araw[a] ay tatawid kayo sa Jordan na ito upang pumasok at angkinin ang lupain na ibinibigay sa inyo ni Yahweh na inyong Diyos upang ariin ito.’”'
