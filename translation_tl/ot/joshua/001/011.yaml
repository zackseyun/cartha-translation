    issue: Ang “Lumibot kayo” ay hindi tumpak para sa עִבְרוּ.
    rationale: Ang pandiwa ay utos na dumaan o magtungo sa loob ng kampo; ang “lumibot” ay maaaring magpahiwatig ng pag-ikot sa paligid o paggala.
  - severity: low
    issue: Ang “utusan ang mga tao” ay hindi gaanong malinaw na katumbas ng utos sa sambayanan.
    rationale: Maaaring basahin ang “utusan” bilang pagpapagawa ng isang gawain sa mga indibidwal. Ang “iutos ninyo sa bayan” ay mas tiyak na naghahatid ng צַוּוּ אֶת־הָעָם.
