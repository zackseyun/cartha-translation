id: JOS.1.3
reference: Joshua 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כָּל מָק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם נְתַתִּ֑י/ו כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: tl
  text: Bawat lugar na tatapakan ng talampakan ng inyong paa[a] ay ibinigay ko na sa inyo, gaya ng sinabi ko kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bawat lugar kung saan tatapak ang talampakan ng inyong paa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: Bawat lugar
  rationale: 'Pinananatili nito ang distributibong diwa ng כָּל kasama ng מָקוֹם: ang bawat lugar, hindi lamang isang kabuuang pook.'
- source_word: אֲשֶׁר ... בּוֹ
  choice: na ...
  rationale: Likas sa modernong Tagalog ang pang-ugnay na “na” sa sugnay na naglalarawan sa “lugar”; hindi kailangang ilantad nang hiwalay ang lokatibong בּוֹ dahil malinaw na ito sa pandiwang “tatapakan.”
- source_word: תִּדְרֹךְ
  choice: tatapakan
  rationale: Inilalarawan ng דרך ang aktuwal na pagtapak at pinananatili ang kongkretong larawan ng pag-angkin sa lupain.
- source_word: כַּף רַגְלְכֶם
  choice: talampakan ng inyong paa
  rationale: Tiyak na tumutukoy ang כַּף רֶגֶל sa talampakan. Pinananatili ng “inyong” ang pangmaramihang kausap, habang natural sa ganitong distributibong pahayag ang isahang “paa.”
- source_word: לָכֶם
  choice: sa inyo
  rationale: Ipinakikita nito ang mga tumatanggap ng kaloob at natural na kaakibat ng “ibinigay.”
- source_word: נְתַתִּיו
  choice: ibinigay ko na
  rationale: Pinananatili ang perpektong anyo bilang kaloob na tiyak nang ipinagkaloob, bagaman ang aktuwal na pag-aangkin ay magaganap pa. Ang “na” ay natural na nagpapahiwatig ng aspektong ganap sa Tagalog.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Malinaw nitong ipinahahayag ang pagtutugma ng kasalukuyang pahayag sa naunang sinabi kay Moises.
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: sinabi ko kay Moises
  rationale: Natural sa Tagalog ang “sinabi ko kay Moises” para sa דבר אל. Hindi ginamit ang “ipinangako” upang hindi magdagdag ng pagpapakahulugang hindi tahasang nasa pandiwa.
theological_decisions:
- issue: Aspekto ng banal na pagkakaloob
  choice: ibinigay ko na
  alternative: ibibigay ko / ibinibigay ko
  rationale: Ang perpektong נְתַתִּיו ay naghaharap sa lupain bilang naipagkaloob na sa bisa ng pasya ng Diyos, kahit unti-unti pa itong aangkinin sa kasaysayan. Hindi ito ginawang payak na panghinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “talampakan” upang mapanatili ang kongkretong larawang Hebreo at ang “ibinigay ko na” upang likas na maipahayag ang ganap at tiyak na pagkakaloob.
