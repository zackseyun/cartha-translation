  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: tl
  text: Ang sinumang lalaking maghimagsik laban sa iyong utos[a] at hindi makinig sa iyong mga salita sa lahat ng iuutos mo sa kanya ay papatayin. Magpakatatag ka lamang at magpakatapang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “iyong bibig.” Sa Hebreo, ang idyomang “iyong bibig” ay tumutukoy sa iyong utos o salitang may awtoridad.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: ang sinumang lalaking
  rationale: Pinananatili ang panlalaking pangngalang אִישׁ at ang pamamahaging diwa ng כָּל, ngunit ginagamit ang likas na pariralang Filipino na “ang sinumang lalaking” sa halip na ang matigas na “bawat lalaki.”
- source_word: יַמְרֶה
  choice: maghimagsik laban sa
  rationale: Ang Hiphil ng מרה ay tumutukoy sa pagsalungat o paghihimagsik laban sa lehitimong awtoridad; mas buo ito kaysa sa payak na “sumuway.”
- source_word: אֶת־פִּיךָ
  choice: iyong utos
  rationale: Literal itong “iyong bibig,” ngunit ang idyoma ay tumutukoy sa makapangyarihang salita o utos ni Josue. Inilalagay sa talababa ang literal na anyo.
- source_word: וְלֹא יִשְׁמַע אֶת־דְּבָרֶיךָ
  choice: at hindi makinig sa iyong mga salita
  rationale: Pinananatili ng “makinig” ang leksikal na pagkakaiba mula sa naunang “maghimagsik,” habang ipinahihiwatig pa rin sa konteksto ang pagsunod.
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: sa lahat ng iuutos mo sa kanya
  rationale: Malapit sa saklaw ng Hebreo at natural sa modernong Filipino; ipinakikitang ang hinihinging pakikinig ay sumasaklaw sa lahat ng iuutos.
- source_word: יוּמָת
  choice: ay papatayin
  rationale: Ang Hophal/imposed passive na anyo ay nagsasaad ng ipapataw na kamatayan, hindi lamang na mamamatay ang tao.
- source_word: רַק
  choice: basta't
  rationale: Sa pangwakas na paghimok, ipinahahayag ng רַק ang nag-iisang kondisyon o mariing panawagan. Ang “basta't” ay natural na nag-uugnay sa pangako ng pagsuporta sa paalalang dapat manatiling matatag si Josue.
- source_word: חֲזַק וֶאֱמָץ
  choice: magpakatatag ka at magpakatapang
  rationale: 'Inihahatid ang dalawang magkaugnay ngunit magkaibang utos: lakas o katatagan, at tapang o matibay na loob. Ang anyong “magpaka-” ay likas na panghikayat sa Filipino.'
theological_decisions:
- issue: Panlalaking kinatawang pananalita
  choice: ang sinumang lalaking
  alternative: ang sinuman
  rationale: Tahasang gumagamit ang Hebreo ng אִישׁ, “lalaki,” sa pamamahaging konstruksyon. Pinananatili ang kasarian ng anyo nang hindi ipinapalagay na may karagdagang doktrinal na punto rito.
- issue: Pagkakasabi ng parusang kamatayan
  choice: ay papatayin
  alternative: ay mamamatay
  rationale: Ipinakikita ng pasibong pandiwa na ang kamatayan ay ipapataw bilang parusa; hindi lamang nito inilalarawan ang karaniwang pagkamatay.
- issue: Lakas ng pangwakas na רַק
  choice: Basta't
  alternative: Tanging magpakatatag ka at magpakatapang
  rationale: Ang “Basta't” ay likas na Filipino para sa mariing kondisyon/paghihikayat sa kontekstong ito. Hindi nito nilulutas nang labis kung ang רַק ay pangunahing panlimita o pantransisyon.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang “maghimagsik,” “utos,” at “papatayin” upang mapanatili ang awtoritatibo at hudisyal na bigat ng talata; iniwasan ang sobrang pormal o makalumang ayos.
