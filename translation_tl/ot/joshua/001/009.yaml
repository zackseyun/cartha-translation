base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: tl
  text: Hindi ba kita inutusan? Magpakatatag ka at magpakatapang. Huwag kang masindak at huwag kang panghinaan ng loob, sapagkat si Yahweh, ang iyong Diyos, ay kasama mo saan ka man pumunta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא צִוִּיתִיךָ
  choice: Hindi ba't iniutos ko sa iyo?
  rationale: Pinananatili ang mariing retorikal na tanong at ang tuwirang diwa ng pandiwang צוה (‘mag-utos’).
- source_word: חֲזַק וֶאֱמָץ
  choice: Magpakatatag ka at magpakatapang
  rationale: Inihihiwalay ang magkatuwang na diwa ng lakas o katatagan at tapang, sa natural na makabagong Tagalog.
- source_word: אַל תַּעֲרֹץ
  choice: Huwag kang masindak
  rationale: Ang ערץ ay nagpapahiwatig ng matinding takot o pagkasindak, mas malakas kaysa pangkalahatang ‘matakot.’
- source_word: וְאַל תֵּחָת
  choice: o panghinaan ng loob
  rationale: Sa kontekstong ito, ang חתת ay tumutukoy sa pagkasira ng loob o pagkasiphayo; natural sa Tagalog ang ‘panghinaan ng loob.’
- source_word: כִּי עִמְּךָ
  choice: sapagkat kasama mo
  rationale: Ipinapahayag ang dahilan ng mga utos—ang patuloy na presensiya ng Diyos—sa malinaw at dignified na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tapat na inilalarawan ang ikalawang panauhang panlalaking isahan na hulapi bilang ‘iyong.’
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: saan ka man pumunta
  rationale: Natural na katumbas sa Tagalog ng distributibong kahulugang ‘wherever you go.’
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng tradisyonal na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang ‘ka/iyo’ sapagkat si Josue ang tuwirang kinakausap. Ang ‘magpakatatag’ at ‘magpakatapang’ ay natural na pares na nagpapanatili sa pagkakaiba ng dalawang utos.
