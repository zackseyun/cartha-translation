base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: tl
  text: Ang kanilang mana ay itinalaga sa pamamagitan ng palabunutan, ayon sa iniutos ni Yahweh sa pamamagitan ni Moises[a], para sa siyam na lipi at sa kalahating lipi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kamay ni Moises,” isang idyoma na nagpapahiwatig ng pamamagitan o ahensiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Ipinapahayag ng בְּ ang paraan ng paghahati, at ang גּוֹרָל ay tumutukoy sa palabunutan. Likas sa makabagong Tagalog ang pariralang ito at malinaw nitong ipinapakita ang paraang ginamit sa pamamahagi.
- source_word: נַחֲלָתָם
  choice: ang kanilang mana
  rationale: Sa konteksto, ang נַחֲלָה ay ang lupaing ipinagkaloob at ibinahagi bilang mana. Ang “mana” ay maikli, natural, at angkop sa tipanang konteksto.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ayon sa iniutos
  rationale: Ang כַּאֲשֶׁר ay nag-uugnay sa pamamahagi sa naunang utos, at ang anyong “iniutos” ay natural na nagpapahiwatig na nauna nang ibinigay ang utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang literal na “sa kamay ni Moises” ay idyomang Hebreo para sa ahensiya o pamamagitan. Malinaw at natural sa Tagalog ang “sa pamamagitan ni Moises.”
- source_word: לְתִשְׁעַת הַמַּטּוֹת
  choice: para sa siyam na lipi
  rationale: Dito, ang לְ ay tumutukoy sa mga tatanggap ng mana, at ang מַטֶּה ay nangangahulugang lipi.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: at sa kalahating lipi
  rationale: Ang parirala ay tumutukoy sa kalahati ng isang lipi bilang hiwalay na yunit sa pamamahagi. Ang “kalahating lipi” ay malinaw at karaniwang pahayag sa kontekstong ito.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi bilang pamalit na titulo.
- issue: Kahulugan ng בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  alternative: sa kamay ni Moises
  rationale: Ang Hebreong parirala ay idyoma ng pamamagitan o ahensiya. Iniiwasan ng salin ang maling literal na larawan habang itinatala sa talababa ang anyong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “palabunutan” upang madaling maunawaan ang sinaunang paraan ng pagtatalaga, at pinanatili ang “Yahweh” bilang banal na pangalan. Inilipat ang talababa sa pariralang “sa pamamagitan ni Moises,” kung saan talaga nauukol ang paliwanag nito.
