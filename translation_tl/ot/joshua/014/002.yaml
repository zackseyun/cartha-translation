- from: Ang kanilang mana ay hinati sa pamamagitan ng palabunutan, ayon sa iniutos ni Yahweh sa pamamagitan ni Moises[a], para sa siyam na lipi at sa kalahating lipi.
  to: Ang kanilang mana ay itinalaga sa pamamagitan ng palabunutan, ayon sa iniutos ni Yahweh sa pamamagitan ni Moises[a], para sa siyam na lipi at sa kalahating lipi.
  rationale: Pinalitan ang “hinati” ng “itinalaga” upang maipahayag ang paglalaan ng mana sa pamamagitan ng lot-casting nang hindi binabawasan ang kahulugan sa karaniwang paghahati lamang. Walang binago sa banal na pangalan, mga pangkat na tumatanggap, o sa talababa para sa idyomang Hebreo.
