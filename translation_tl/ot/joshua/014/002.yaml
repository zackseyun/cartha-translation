  source_fidelity: Ang “hinati” ay masyadong tiyak at maaaring magpahiwatig lamang ng pisikal na paghahati. Ang בְּגוֹרָל ay tumutukoy sa pagtatalaga/paglalaan sa pamamagitan ng palabunutan. Mas tumpak ang “itinalaga ... sa pamamagitan ng palabunutan.” Napananatili ng “ayon sa iniutos ni Yahweh sa pamamagitan ni Moises” ang utos at ang idyomang Hebreo ng pamamagitan.
  naturalness: Likas at marangal sa makabagong Tagalog ang “Ang kanilang mana ay itinalaga sa pamamagitan ng palabunutan.” Mas malinaw ito kaysa “hinati,” habang hindi nagdaragdag ng paliwanag sa teksto.
  terminology: Ang “mana,” “lipi,” at “Yahweh” ay angkop. Ang “kalahating lipi” ay pinanatili bilang karaniwang katawagan para sa kalahati ng isang lipi. Ang talababa ay wastong nakakabit sa “sa pamamagitan ni Moises.”
