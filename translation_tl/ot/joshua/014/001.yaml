    issue: Idinagdag ang “bawat” sa “mga angkan ng bawat lipi.”
    rationale: Walang katumbas na “bawat” sa Hebreo. Ang parirala ay tumutukoy sa mga pinuno ng mga sambahayang pampamilya/angkan na kaugnay ng mga lipi, hindi tahasang nagsasabing tig-iisa mula sa bawat lipi.
