  source_fidelity: Tumpak ang pangunahing diwa ng pagtanggap at pormal na pamamahagi ng lupain bilang mana. Gayunman, ang “bawat lipi” ay nagdaragdag ng distributibong diwang wala sa Hebreo, at ang “hinati-hati” ay mas madaling mangahulugang pinagputul-putol kaysa ipinamahagi bilang mana.
  naturalness: Marangal at madaling maunawaan ang Tagalog. Mas malinaw at mas natural sa kontekstong legal-administratibo ang “ipinamahagi sa kanila bilang mana” kaysa “hinati-hati sa kanila bilang mana.”
  terminology: Ang “mga anak ni Israel,” “lupain,” “mana,” “paring si Eleazar,” at “Josue na anak ni Nun” ay angkop. Binago ang parirala para sa mga pinuno upang huwag idagdag ang “bawat” at upang mailapit ang “mga sambahayan ng mga ninuno” sa estrukturang “mga bahay ng mga ama.”
  issues:
