    issue: Ang “hinati-hati” ay maaaring magpahiwatig ng pisikal na paghahati-hati ng lupa.
    rationale: Ang נִחֲלוּ sa sugnay na ito ay tumutukoy sa pormal na paglalaan o pamamahagi ng mana. Ang “ipinamahagi ... bilang mana” ay mas tumpak at natural.
