  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: tl
  text: Ito ang mga lupaing tinanggap bilang mana ng mga anak ni Israel sa lupain ng Canaan[a], na ipinamahagi sa kanila bilang mana[b] ng paring si Eleazar, ni Josue na anak ni Nun, at ng mga pinuno ng mga sambahayan ng mga ninuno ng mga lipi ng mga anak ni Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Israel” ay maaari ring isaling “mga Israelita.” Literal na pampamilyang katawagan ang ginamit sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: 'Iisang salitang-ugat para sa “mana” ang inuulit sa Hebreo: tumanggap ang Israel bilang mana, at ipinamahagi naman ito sa kanila bilang mana.'
    reason: lexical_note
  - marker: c
    text: Ang “mga sambahayan ng mga ninuno” ay tumutukoy sa mga pangkat ng magkakamag-anak na nakabatay sa sambahayan at pinagmulan ng ninuno sa loob ng mga lipi.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang mga
  rationale: Ipinakikilala nito ang bagong seksiyon habang nagpapatuloy ang salaysay; hindi dinagdagan ng tahasang temporal na “ngayon.”
- source_word: נָחֲלוּ
  choice: tinanggap bilang mana
  rationale: Ipinahahayag ng Qal ang pagtanggap ng Israel sa mga lupaing inilaan sa kanila, nang hindi ipinahihiwatig na namana lamang ang mga ito dahil sa pagkamatay ng dating may-ari.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang tahasang pampamilyang katawagan sa Hebreo at ang kaugnayan nito kay Israel bilang ninuno at bayan.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang “lupain,” na mahalaga sa konteksto ng mana at paghahati ng teritoryo.
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: Ang mga ito ay hinati-hati sa kanila bilang mana
  rationale: Ang anyo ng pandiwa ay tumutukoy sa pormal na pamamahagi ng mana ng mga pinunong binanggit; pinananatili rin ang pag-uulit ng ideya ng mana.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ng paring si Eleazar
  rationale: Natural na Tagalog para sa pangalan at titulong Hebreo.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: ni Josue na anak ni Nun
  rationale: Ginamit ang karaniwang pangalang Filipino na Josue at malinaw na pinanatili ang ugnayang ama-anak.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: mga pinuno ng mga angkan ng bawat lipi
  rationale: Ang “mga angkan” ay natural at nauunawaang katumbas ng mga pangkat na nakabatay sa sambahayan ng mga ninuno; ang “bawat lipi” ay nililinaw ang kaugnayan ng mga pinuno sa organisasyong panlipi.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ng mga anak ni Israel
  rationale: Iniuugnay ang mga lipi sa bayan ng Israel alinsunod sa sintaks ng Hebreo.
theological_decisions:
- issue: Pampamilyang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang literal na pampamilyang katawagan ng Hebreo, habang inilalagay sa talababa ang mas maikling etnikong katumbas.
- issue: Terminolohiya ng אֲבוֹת sa kaayusang panlipi
  choice: mga angkan
  alternative: mga sambahayan ng mga ninuno
  rationale: Ang “mga angkan” ay malinaw sa karaniwang mambabasa at hindi nagpapasok ng makabagong institusyon; itinatala sa talababa ang mas lantad na estrukturang ninuno ng parirala.
- issue: Pag-uulit ng ugat נחל
  choice: tinanggap bilang mana ... hinati-hati ... bilang mana
  alternative: minana ... ipinamana
  rationale: Pinananatili ang konsepto ng mana sa dalawang sugnay ngunit iniiwasan ang “ipinamana,” na maaaring magpahiwatig ng paglilipat bunga ng kamatayan sa halip na pormal na paglalaan ng lupain.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lupain,” “mana,” “lipi,” at “angkan” upang mapanatili ang legal, teritoryal, at pampamilyang diwa ng Hebreo nang hindi nagiging labis na literal o lipas ang pananalita.
