  rationale: Pinalitan ang hindi gaanong likas na “dinala ko pabalik sa kanya ang ulat” ng idiomatikong “nagbalik ako sa kanya ng ulat.” Pinanatili ang lahat ng mahahalagang elemento ng Hebreo, kabilang ang temporal na “nang,” ang pinagmulan sa Kadesh-barnea, ang reconnaissance na “tiktikan,” at ang sadyang di-inaayos na talinghaga ng pusong nasa hulihan.
