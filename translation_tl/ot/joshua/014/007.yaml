  naturalness: Nauunawaan ang kasalukuyang teksto, ngunit ang “dinala ko pabalik sa kanya ang ulat” ay hindi gaanong likas sa modernong Tagalog. Mas idiomatiko ang “nagbalik ako sa kanya ng ulat,” na pinananatili ang diwa ng Hebreong idyoma.
  terminology: Ang “Yahweh,” “Kadesh-barnea,” “lupain,” at “tiktikan” ay angkop. Ang “ayon sa nasa puso ko” ay maingat na pinananatili ang talinghaga at ang hindi ganap na natitiyak na saklaw ng Hebreong parirala.
