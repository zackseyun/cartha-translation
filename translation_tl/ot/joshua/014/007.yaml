  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אָנֹכִ֗י בִּ֠/שְׁלֹחַ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֥ה אֹתִ֛/י מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לְ/רַגֵּ֣ל אֶת הָ/אָ֑רֶץ וָ/אָשֵׁ֤ב אֹת/וֹ֙ דָּבָ֔ר כַּ/אֲשֶׁ֖ר עִם לְבָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: tl
  text: Apatnapung taong gulang ako nang isugo ako ni Moises, na lingkod ni Yahweh, mula sa Kadesh-barnea upang tiktikan ang lupain, at nagbalik ako sa kanya ng ulat ayon sa nasa puso ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa aking puso.”
    reason: Pinananatili ng alternatibo ang mas maikli at mas pormal na anyo ng Hebreong talinghaga. Ang parirala ay maaaring tumukoy sa panloob na paniniwala o tapat na pagtataya ni Caleb.
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: Apatnapung taong gulang ako
  rationale: Ang literal na Hebreong idyoma ay “anak ng apatnapung taon”; ginamit ang likas na pananalita sa modernong Tagalog para sa edad.
- source_word: בִּשְׁלֹחַ
  choice: nang suguin ako
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng panahong pangyayari; malinaw at natural sa Tagalog ang “nang suguin ako.”
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Ang “lingkod” ay angkop sa marangal at opisyal na pagtukoy kay Moises sa kaugnayan niya sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na nasa tekstong Hebreo.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: mula sa Kadesh-barnea
  rationale: Isinalin ang pang-ukol at isinalin-titik ang pangalan ng lugar.
- source_word: לְרַגֵּל
  choice: upang tiktikan
  rationale: Ipinahihiwatig ng pandiwa ang palihim o masusing pagmamanman sa lupain; pinananatili ng “tiktikan” ang diwa ng reconnaissance sa salaysay.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy sa teritoryong sinusuri at sa konteksto ay sa lupaing ipinangako; ang “lupain” ay natural at tiyak.
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: At dinala ko pabalik sa kanya ang ulat
  rationale: Ang Hebreong idyoma ay tumutukoy sa pagbabalik ng salita o mensahe; ang “ulat” ang likas na katumbas sa konteksto ng pagmamanman.
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: ayon sa nasa puso ko
  rationale: Pinananatili ang talinghaga ng puso at ang posibilidad na tumukoy ito sa panloob na paniniwala o tapat na pagtataya ni Caleb, nang hindi ito nililimitahan sa isang pagpapakahulugan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng pariralang כַּאֲשֶׁר עִם לְבָבִי
  choice: ayon sa nasa puso ko
  alternative: ayon sa aking puso; nang buong katapatan
  rationale: Hindi tahasang nilulutas ng Hebreo kung ang diin ay nasa panloob na paniniwala, tapat na pagtataya, o katapatan; pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pangalang Yahweh, ang talinghaga ng puso, at ang pangalan ng lugar; iniwasan ang labis na pagpapakahulugan sa motibo ni Caleb.
