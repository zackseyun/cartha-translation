  terminology: Ang “lipi,” “Levita,” “bahagi sa lupain,” at “mga pastulan” ay angkop sa modernong Filipino Tagalog at sa kontekstong paghahati ng lupain. Pinananatili ang mga karaniwang anyong “Manases” at “Efraim.”
