source:
  edition: WLC
  text: כִּֽי הָי֧וּ בְנֵֽי יוֹסֵ֛ף שְׁנֵ֥י מַטּ֖וֹת מְנַשֶּׁ֣ה וְ/אֶפְרָ֑יִם וְ/לֹֽא נָתְנוּ֩ חֵ֨לֶק לַ/לְוִיִּ֜ם בָּ/אָ֗רֶץ כִּ֤י אִם עָרִים֙ לָ/שֶׁ֔בֶת וּ/מִ֨גְרְשֵׁי/הֶ֔ם לְ/מִקְנֵי/הֶ֖ם וּ/לְ/קִנְיָנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: tl
  text: Sapagkat dalawang lipi ang mga anak ni Jose—ang Manases at Efraim—at hindi nila binigyan ng bahagi sa lupain ang mga Levita, maliban sa mga lungsod na matitirhan nila, kasama ang mga pastulan[a] ng mga iyon para sa kanilang mga alagang hayop at mga ari-arian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga pastulan” ay bukas na lupain sa paligid ng mga lungsod ng mga Levita, lalo na para sa pagpapastol at iba pang kaugnay na gamit.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag kaugnay ng naunang pahayag; pinananatili ng “Sapagkat” ang ugnayang iyon.
- source_word: בְנֵי יוֹסֵף
  choice: ang mga anak ni Jose
  rationale: Pinananatili ang Hebreong idyomang pampamilya, na sa konteksto ay tumutukoy sa mga inapo ni Jose bilang mga lipi.
- source_word: שְׁנֵי מַטּוֹת
  choice: dalawang lipi
  rationale: Ang מַטּוֹת dito ay tumutukoy sa mga pangkat panlipi, hindi sa literal na mga tungkod.
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: Manases at Efraim
  rationale: Karaniwang anyo ng mga pangalang biblikal sa Filipino.
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: Walang ibinigay na bahagi
  rationale: Natural na Filipino na pinananatili ang di-tiyak na gumagawa sa Hebreong maramihang pandiwa; ang “bahagi” ay angkop sa paghahati ng lupain.
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Tumutukoy sa mga kabilang sa lipi ni Levi bilang isang pangkat.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Tumutukoy sa lupaing hinahati-hati bilang mana.
- source_word: כִּי אִם
  choice: maliban sa
  rationale: Malinaw na ipinahahayag ang eksepsiyon kasunod ng pagtangging walang ibinigay na bahagi.
- source_word: עָרִים לָשֶׁבֶת
  choice: mga lungsod na matitirhan nila
  rationale: Natural na ipinahahayag ang layunin ng mga lungsod bilang tirahan ng mga Levita.
- source_word: מִגְרְשֵׁיהֶם
  choice: mga pastulan sa paligid ng mga iyon
  rationale: Ipinahahayag kapwa ang lokasyon at pangunahing gamit ng bukas na lupa sa palibot ng mga lungsod.
- source_word: לְמִקְנֵיהֶם
  choice: para sa kanilang mga alagang hayop
  rationale: Ang מִקְנֶה ay malawak na tumutukoy sa mga hayop na pag-aari; malinaw at makabago ang parirala sa Filipino.
- source_word: וּלְקִנְיָנָם
  choice: at iba pang ari-arian
  rationale: Ang קִנְיָן ay tumutukoy sa pag-aari o tinamong ari-arian; ipinakikita ng “iba pang” na hiwalay ito sa naunang binanggit na mga alagang hayop.
theological_decisions:
- issue: Kung ang “mga anak ni Jose” ay literal na mga anak o mas malawak na mga inapo
  choice: Pinanatili sa teksto ang idyomang “mga anak ni Jose.”
  alternative: “mga inapo ni Jose”
  rationale: Ang konteksto ay malinaw na panlipi, ngunit pinananatili ng literal na idyoma ang anyo ng Hebreo nang hindi lumilikha ng suliranin sa modernong Filipino.
- issue: Ang paksa ng pandiwang “nagbigay”
  choice: Gumamit ng di-tiyak na anyong “Walang ibinigay.”
  alternative: “Hindi sila nagbigay”
  rationale: Maramihan ang pandiwa sa Hebreo ngunit hindi tahasang pinangalanan ang paksa sa talata; iniiwasan ng Filipino na salin ang sapilitang pagtukoy kung sino ang “sila.”
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “lipi,” “bahagi sa lupain,” at “mga Levita” bilang madaling maunawaang bokabularyong biblikal; iniwasan ang labis na arkaikong pananalita.
