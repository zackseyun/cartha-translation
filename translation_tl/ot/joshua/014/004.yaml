  to: Sapagkat dalawang lipi ang mga anak ni Jose—ang Manases at Efraim—at hindi nila binigyan ng bahagi sa lupain ang mga Levita, maliban sa mga lungsod na matitirhan nila, kasama ang mga pastulan[a] ng mga iyon para sa kanilang mga alagang hayop at mga ari-arian.
  rationale: Inalis ang di-sinasadyang ideya ng pagbabago sa “naging,” ginawang mas malinaw ang aktibong pandiwang Hebreo sa “hindi nila binigyan,” at inalis ang dagdag na “iba pang.” Pinanatili ang saklaw ng “mga ari-arian,” na tumutugma sa malawak na kahulugan ng קִנְיָנָם, nang hindi pinipilit ang mas tiyak na interpretasyon.
