  text: But my brothers who went up with me made the heart of the people melt, while I wholly followed the LORD my God.
translation:
  language: tl
  text: Ngunit pinanghina ng mga kapatid kong umakyat na kasama ko ang loob ng bayan, samantalang lubos akong sumunod sa PANGINOON na aking Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: mga kapatid ko
  rationale: Pinananatili ang karaniwang anyong panlalaki at pampangkat ng Hebreo; sa konteksto, tumutukoy ito sa mga kasamang Israelitang espiya ni Caleb.
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: pinanghinaan ng loob ang mga tao dahil sa kanila
  rationale: Ang literal na larawan ay ‘tinunaw nila ang puso ng bayan.’ Ang likas na katumbas sa modernong Tagalog ay ang pag-alis ng tapang o pagpanghina ng loob; inayos ang pangungusap upang malinaw na ang mga kasamahan ang sanhi.
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: buong katapatan akong sumunod
  rationale: Ang idyomang Hebreo ay literal na ‘pinuspos ko ang pagsunod sa likod ng,’ na nagpapahayag ng ganap at matapat na pagsunod. Inilalahad ang parehong diin sa natural na Tagalog.
- source_word: יְהוָה אֱלֹהָי
  choice: PANGINOON na aking Diyos
  rationale: Ginagamit ang nakaugaliang anyong PANGINOON para sa banal na pangalang YHWH, kasunod ang tahasang personal na ugnayang ‘aking Diyos.’
theological_decisions:
- issue: Lakas ng pahayag ni Caleb tungkol sa pagsunod
  choice: buong katapatan akong sumunod
  alternative: lubos akong sumunod
  rationale: Pinananatili ang diin ng Hebreong idyoma sa ganap at tapat na pagsunod nang hindi pinalalawak ito tungo sa pahayag ng kawalang-kasalanan.
- issue: Ugnayan ng dalawang sugnay
  choice: samantalang
  alternative: ngunit
  rationale: Ang וְ dito ay maaaring magpakita ng paghahambing o pagsalungat. Ang ‘samantalang’ ay natural na naghahambing sa epekto ng mga kasamang espiya at sa sariling tugon ni Caleb, nang hindi labis na pinatitindi ang pagsalungat.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang idyomatikong ‘pinanghinaan ng loob’ sa halip na literal na ‘natunaw ang puso,’ at pinanatili ang solemne ngunit natural na ‘PANGINOON na aking Diyos.’
