id: JOS.14.6
reference: Joshua 14:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: tl
  text: Pagkatapos, lumapit kay Josue sa Gilgal ang mga anak ni Juda, at sinabi sa kanya ni Caleb, anak ni Jefone na Kenizita, “Alam mo ang salitang[a] sinabi ni Yahweh kay Moises, ang tao ng Diyos, tungkol sa akin at sa iyo sa Kades-barnea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bagay” o “ang usapin” na sinabi ni Yahweh kay Moises.
    reason: Pinananatili ang lawak ng kahulugan ng הַדָּבָר, na maaaring tumukoy sa salita, bagay, o usapin.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: lumapit
  rationale: Likas na katumbas ng נגשׁ sa salaysay at malinaw na ipinapakita ang paglapit kay Josue.
- source_word: בְנֵי יְהוּדָה
  choice: mga anak ni Juda
  rationale: Pinananatili ang literal na pantribo at pampamilyang anyo ng Hebreo, sa halip na gawing pangkalahatang “mga tao ng Juda.”
- source_word: בַּגִּלְגָּל
  choice: sa Gilgal
  rationale: Karaniwang lokatibong gamit para sa pangalan ng lugar.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Caleb na anak ni Jefone, na Kenizita
  rationale: Pinananatili ang personal na pangalan, ugnayang pampamilya, at katawagang pangangkan o etniko.
- source_word: אַתָּה יָדַעְתָּ
  choice: Alam mo
  rationale: Ang perfect form ay tumutukoy rito sa kasalukuyang kalagayan ng pagkakaalam; ito ang natural na Filipino.
- source_word: הַדָּבָר
  choice: ang salita
  rationale: Bagaman maaari ring mangahulugang “bagay” o “usapin,” tumutukoy ito rito sa tiyak na ipinahayag ni Yahweh, kaya ang “salita” ay angkop habang pinananatili sa talababa ang ibang posibilidad.
- source_word: דִּבֶּר יְהוָה
  choice: sinabi ni Yahweh
  rationale: Natural sa Filipino ang “sinabi” para sa iniulat na banal na pahayag, at tuwirang pinananatili ang banal na pangalan.
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: Moises na lingkod ng Diyos
  rationale: Sa modernong Filipino, ang “lingkod ng Diyos” ay marangal at madaling maunawaang titulo, bagaman literal na “tao ng Diyos.”
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: tungkol sa akin at sa iyo
  rationale: Malinaw at natural na katumbas ng idyomang nangangahulugang “hinggil sa”; hindi kailangang ulitin ang “tungkol” sa Filipino.
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: sa Kades-barnea
  rationale: Karaniwang anyong lokatibo at angkop na transliterasyon sa Filipino.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili ang transliterasyong Yahweh sa halip na palitan ng titulo.
- issue: Katawagan kay Moises na אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  alternative: tao ng Diyos
  rationale: Ang literal na “tao ng Diyos” ay posibleng salin, ngunit maaaring maging malabo sa karaniwang Filipino. Ang “lingkod ng Diyos” ay natural na katawagang nagpapahayag ng opisyal na kaugnayan ni Moises sa Diyos nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Pantribong katawagang בְנֵי יְהוּדָה
  choice: mga anak ni Juda
  alternative: mga tao ng Juda; mga lalaki ng Juda
  rationale: Pinananatili ang tahasang pampamilya at pantribong anyo ng Hebreo, habang hindi ipinapalagay na eksklusibong mga adultong lalaki ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga karaniwang Filipinong anyo ng pangalang Josue, Moises, Jefone, at Kades-barnea; pinanatili ang Caleb at Yahweh. Inayos ang ayos ng pangungusap upang maging natural sa Filipino nang hindi inaalis ang pantribong pagtukoy at ang saklaw ng banal na pahayag.
