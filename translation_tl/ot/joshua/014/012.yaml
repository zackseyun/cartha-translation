reference: Joshua 14:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: tl
  text: At ngayon, ibigay mo sa akin ang lupaing mabundok na ito na sinabi ni Yahweh noong araw na iyon.[a] Sapagkat ikaw mismo ang nakarinig noong araw na iyon na naroon ang mga Anakim at mga lunsod na malalaki at napapaderan. Marahil ay sasamahan ako ni Yahweh, at mapapalayas ko sila, gaya ng sinabi ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bundok na ito.” Ang salitang Hebreo ay maaaring tumukoy sa isang bundok o sa isang rehiyong mabundok; sa kontekstong ito, mas malamang ang mas malawak na lupain.
    reason: lexical_alternative
  - marker: b
    text: 'Literal na Hebreo: “Marahil si Yahweh [ay] kasama ko.” Walang pandiwa sa sugnay; ipinahihiwatig nito ang inaasahang presensiya at tulong ni Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbing panandang diskurso na nag-uugnay sa naunang sinabi ni Caleb sa kasalukuyan niyang kahilingan; natural sa Tagalog ang “Kaya ngayon.”
- source_word: תְּנָה לִּי
  choice: ibigay mo sa akin
  rationale: Tuwirang katumbas ng pautos na anyo ng נתן na may di-tuwirang layon, at pinananatili ang tapang ng kahilingan.
- source_word: אֶת־הָהָר הַזֶּה
  choice: ang lupaing mabundok na ito
  rationale: Maaaring tumukoy ang הַר sa isang bundok o sa isang rehiyong mabundok. Sa konteksto ng pamamahagi ng lupain, rehiyon ang mas malamang na tinutukoy.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: na binanggit ni Yahweh
  rationale: Pinananatili ang diwa ng “nagsalita tungkol sa” nang hindi ginagawang tahasang “ipinangako,” na mas interpretibo kaysa sa mismong pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: Ikaw mismo ang nakarinig
  rationale: Ipinapakita ng “mismo” ang diin ng tahasang panghalip na אַתָּה.
- source_word: כִּי עֲנָקִים שָׁם
  choice: na naroon ang mga Anakim
  rationale: Pinananatili ang tawag sa pangkat na Anakim at ang lokatibong diwa ng שָׁם.
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: at may malalaki at napapaderang mga lungsod
  rationale: Likas na Tagalog na nagpapahayag ng parehong laki at katangiang depensibo ng mga lungsod.
- source_word: אוּלַי יְהוָה אוֹתִי
  choice: Marahil ay sasamahan ako ni Yahweh
  rationale: Isinasalin ang eliptikong sugnay bilang inaasahang presensiya ni Yahweh sa darating na labanan, habang pinananatili ng “Marahil” ang pagpapakumbaba at di-tiyak na anyo.
- source_word: וְהוֹרַשְׁתִּים
  choice: at mapapalayas ko sila
  rationale: Ang Hiphil ng ירשׁ sa kontekstong ito ay tumutukoy sa pagpapaalis o pag-aalis sa mga naninirahan sa lupain; malinaw at natural ang “mapapalayas ko sila.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalan at hindi titulo.
- issue: Lakas ng אוּלַי יְהוָה אוֹתִי
  choice: Marahil ay sasamahan ako ni Yahweh
  alternative: Marahil ay tutulungan ako ni Yahweh / Marahil ay kasama ko si Yahweh
  rationale: Pinananatili nito ang “marahil” at ang eliptikong pahayag tungkol sa presensiya ni Yahweh, nang hindi tahasang pinapalitan ang presensiya ng mas interpretibong “tulong.”
- issue: Ugnayan ng sinabi ni Yahweh sa lupain
  choice: na binanggit ni Yahweh
  alternative: na ipinangako ni Yahweh
  rationale: Bagaman may diwang pangako ang konteksto, “nagsalita” ang tahasang pandiwa. Iniwasang gawing mas tiyak ang teolohikal na pormulasyon kaysa sa orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lupaing mabundok” sa halip na teknikal o makalumang pananalita, at pinanatili ang pangalang “Anakim.” Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
