  to: At ngayon, ibigay mo sa akin ang lupaing mabundok na ito na sinabi ni Yahweh noong araw na iyon.[a] Sapagkat ikaw mismo ang nakarinig noong araw na iyon na naroon ang mga Anakim at mga lunsod na malalaki at napapaderan. Marahil ay sasamahan ako ni Yahweh, at mapapalayas ko sila, gaya ng sinabi ni Yahweh.[b]
