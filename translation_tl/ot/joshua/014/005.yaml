id: JOS.14.5
reference: Joshua 14:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: tl
  text: Kung ano ang iniutos ni Yahweh kay Moises, iyon ang ginawa ng mga anak ni Israel[a], at hinati nila ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Ang Hebreo ay literal na “mga anak ni Israel,” isang karaniwang panlahatang katawagan sa sambayanan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Kung ano ang ... iyon ang
  rationale: Likas na hulma sa modernong Tagalog na malinaw na nagpapanatili sa pagtutugma ng utos ni Yahweh at ng ginawa ng Israel.
- source_word: צִוָּה
  choice: iniutos
  rationale: Tuwirang nagpapahayag ng pagbibigay ng utos; ipinahihiwatig na nauna ang utos kaysa sa pagsasagawa nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Sa Tagalog, ang taong inutusan ay likas na ipinahahayag sa pariralang “iniutos ... kay Moises.”
- source_word: עָשׂוּ
  choice: ginawa
  rationale: Pinananatili ang payak at malawak na kahulugan ng pandiwang Hebreo nang hindi dinaragdagan ang di-tahasang layon nito.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit sa anyong Hebreo at gumaganap bilang panlahatang katawagan sa sambayanan ng Israel; nililinaw sa talababa ang likas na alternatibong “mga Israelita.”
- source_word: וַיַּחְלְקוּ
  choice: hinati nila
  rationale: Tuwirang salin ng pandiwang nangangahulugang hatiin o bahaginan; hindi ipinapasok sa pangunahing teksto ang mas tiyak na interpretasyong “ipinamahagi.”
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto ng Josue, tumutukoy ito sa lupaing hinahati bilang mana, hindi sa buong daigdig.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Paglilipat ng panlahatang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa teksto ang konkretong anyong “mga anak ni Israel,” habang kinikilala sa talababa na isa itong karaniwang panlahatang katawagan sa buong bayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang katutubong hulma na “Kung ano ang ... iyon ang” upang likas na maipahayag ang mariing pagtutugma sa Hebreo. Inilagay ang pananda ng talababa pagkatapos ng “mga anak ni Israel,” ang pariralang talagang ipinaliliwanag nito.
