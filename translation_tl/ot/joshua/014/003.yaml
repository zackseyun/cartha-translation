  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: tl
  text: Sapagkat naibigay na ni Moises ang mana ng dalawang lipi at ng kalahating lipi sa kabila ng Jordan[a], ngunit hindi niya binigyan ng mana ang mga Levita sa gitna ng mga liping iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kabilang panig ng Jordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag sa konteksto.
- source_word: נָתַן
  choice: naibigay na
  rationale: Natural na ipinahihiwatig sa Filipino na nauna nang naganap ang pagbibigay ni Moises kaysa sa kasalukuyang tagpo ng salaysay.
- source_word: נַחֲלַת
  choice: ang mana
  rationale: Tumutukoy sa lupaing minana o itinakdang pag-aari ng mga lipi; pinananatili rin nito ang mahalagang terminong ginagamit sa ikalawang sugnay.
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: ang dalawang lipi
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay malinaw na tumutukoy sa lipi, hindi sa literal na tungkod.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: at ng kalahating lipi
  rationale: Tumpak at natural na katawagan para sa kalahating lipi sa konteksto ng pamamahagi ng lupain.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Pinananatili ang Hebreong heograpikong idyoma at ang likas nitong kalabuan hinggil sa pananaw ng nagsasalita.
- source_word: וְלַלְוִיִּם
  choice: ngunit ... sa mga Levita
  rationale: Bagaman literal na pang-ugnay ang 'at,' kontrastibo ang gamit nito rito; natural sa Filipino ang 'ngunit.'
- source_word: לֹא נָתַן נַחֲלָה
  choice: hindi siya nagbigay ... ng mana
  rationale: Direktang isinasalin ang negatibong sugnay at pinananatili ang parehong salitang 'mana.'
- source_word: בְּתוֹכָם
  choice: sa gitna nila
  rationale: Malapit sa anyo ng Hebreo at ipinahihiwatig na walang karaniwang lupaing panlipi ang mga Levita kasama ng ibang mga lipi.
theological_decisions:
- issue: Saklaw ng kawalan ng mana ng mga Levita
  choice: Pinanatili ang pahayag na hindi sila binigyan ng mana 'sa gitna nila,' na sa konteksto ay tumutukoy sa karaniwang lupaing panlipi.
  alternative: Isaling lubos na walang anumang mana o panustos ang mga Levita.
  rationale: Hindi itinatanggi ng talata ang lahat ng panustos para sa mga Levita. Ang pariralang 'sa gitna nila' ay nagpapanatili sa sariling paglilimita ng teksto nang hindi nagdaragdag ng paliwanag sa pangunahing salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mana' bilang pangkaraniwang terminong biblikal para sa lupaing itinakdang pag-aari, at 'naibigay na' upang natural na ipakita ang naunang kilos sa daloy ng salaysay.
