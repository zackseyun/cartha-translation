language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: tl
  text: 'Nang araw na iyon, nanumpa si Moises: “Tiyak na[a] ang lupaing tinapakan ng iyong paa ay magiging mana para sa iyo at sa iyong mga anak na lalaki magpakailanman[b], sapagkat lubos kang sumunod kay Yahweh na aking Diyos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang literal na Hebreong pormula ay “kung hindi,” ngunit sa isang panunumpa ginagamit ito bilang matinding pagpapatibay; kaya “Tiyak na.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at sa iyong mga inapo.” Literal na “sa iyong mga anak na lalaki” ang nasa Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: nanumpa
  rationale: Tuwirang ipinahahayag ang taimtim at may-bisang panunumpa ni Moises.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Likas na makabagong Tagalog para sa malinaw na pagtukoy sa panahong binanggit.
- source_word: לֵאמֹר
  choice: ipinahihiwatig ng tutuldok at tuwirang sipi
  rationale: Sa Tagalog, hindi kailangang isalin nang hiwalay bilang “na sinasabi”; malinaw at mas natural na ipinakikilala ng tutuldok ang mismong sinabi.
- source_word: אִם לֹא
  choice: Tiyak na
  rationale: Sa konteksto ng panunumpa, isa itong Hebreong pormula ng matinding pagpapatibay, hindi karaniwang kondisyon na “kung hindi.”
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: ang lupaing tinapakan ng iyong paa
  rationale: Pinananatili ang kongkretong larawan at ang isahang “paa” ng Hebreo habang natural pa rin sa Tagalog.
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: ay magiging mana mo
  rationale: Maikli at natural na ipinahahayag ang hinaharap na pag-aari bilang minanang bahagi o lupain.
- source_word: וּלְבָנֶיךָ
  choice: at ng iyong mga anak na lalaki
  rationale: Pinananatili ang tahasang panlalaking pangngalang “mga anak na lalaki” sa Hebreo; binabanggit sa talababa ang posibleng mas malawak na diwa sa konteksto ng salinlahi.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Karaniwan, marangal, at sapat na mabigat na katumbas ng patuloy o walang-takdang tagal.
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: sapagkat lubos kang sumunod
  rationale: Inihahatid ang idyomang ganap o buong pagsunod nang hindi nagdaragdag ng larawang wala sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָי
  choice: na aking Diyos
  rationale: 'Pinananatili ang tahasang unang panauhang isahan: si Moises ay nagsasabing “aking Diyos.”'
theological_decisions:
- issue: Paglalapat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ang tuwirang transliterasyon at hindi ito pinapalitan ng titulo.
- issue: Saklaw ng וּלְבָנֶיךָ
  choice: iyong mga anak na lalaki
  alternative: iyong mga anak o iyong mga inapo
  rationale: Tahasan ang panlalaking anyo sa Hebreo, kaya pinanatili ito sa pangunahing teksto; gayunman, maaaring tumukoy ang pangakong mana sa nagpapatuloy na salinlahi, kaya ibinigay ang alternatibo sa talababa.
- issue: Tagal ng pangakong עַד עוֹלָם
  choice: magpakailanman
  alternative: sa habang panahon
  rationale: Pinananatili ang malakas at bukas na pahayag ng Hebreo tungkol sa tagal nang hindi nililimitahan o ipinapaliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang natural na ayos na “At nang araw na iyon ay nanumpa si Moises” at ang tutuldok upang ipakilala ang tuwirang sipi, sa halip na ang mas kahoy na “na sinasabi.” Pinanatili ang kongkretong larawang “tinapakan ng iyong paa,” ang tahasang “mga anak na lalaki,” at ang pangalang Yahweh.
