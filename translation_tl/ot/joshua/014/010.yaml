revisions:
- from: At ngayon, narito, pinanatili akong buhay[a] ni Yahweh, gaya ng sinabi niya, sa loob ng apatnapu’t limang taon mula nang sabihin ni Yahweh ang salitang ito[b] kay Moises, habang naglalakbay ang Israel sa ilang.[c] At ngayon, narito, walumpu’t limang taong gulang na ako sa araw na ito.
  to: At ngayon, narito, pinanatili akong buhay[a] ni Yahweh, gaya ng sinabi niya. Apatnapu’t limang taon na mula nang sabihin ni Yahweh kay Moises ang salitang ito[b], noong naglalakbay ang Israel sa ilang.[c] At ngayon, narito, walumpu’t limang taong gulang na ako sa araw na ito.
  rationale: Inayos ang pagpapahayag ng lumipas na panahon sa 'Apatnapu’t limang taon na mula nang...' upang mas malinaw na tumbasan ang Hebreong idiom. Pinalitan ang 'habang' ng 'noong' upang ipakitang ang paglalakbay ng Israel sa ilang ang kalagayan/panahon nang magsalita si Yahweh kay Moises, hindi isang kasabay na kilos na walang malinaw na panimulang punto. Napanatili ang lahat ng footnote anchor at ang kahulugan ng talata.
