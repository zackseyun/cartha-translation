reference: Joshua 14:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: tl
  text: At ngayon, narito, pinanatili akong buhay[a] ni Yahweh, gaya ng sinabi niya. Apatnapu’t limang taon na mula nang sabihin ni Yahweh kay Moises ang salitang ito[b], noong naglalakbay ang Israel sa ilang.[c] At ngayon, narito, walumpu’t limang taong gulang na ako sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “iniingatan akong buhay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “salitang ito” ay maaari ring isaling “bagay na ito” o, nang mas interpretibo, “pangakong ito.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “noong lumalakad ang Israel sa ilang.”
    reason: literal_rendering
lexical_decisions:
- source_word: הֶחֱיָה
  choice: pinanatili akong buhay
  rationale: Ang Hiphil ng חיה ay tumutukoy rito sa patuloy na pagpapanatiling buhay kay Caleb sa lumipas na mga taon, hindi sa unang pagbibigay sa kaniya ng buhay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: gaya ng sinabi niya
  rationale: Natural itong Tagalog at pinananatili ang payak na diwa ng pandiwang ‘nagsalita/nagsabi’ nang hindi ipinapalagay na pormal na pangako ang tinutukoy.
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה
  choice: sa loob ng apatnapu’t limang taon
  rationale: Malinaw nitong ipinahahayag ang haba ng panahong lumipas hanggang sa kasalukuyan.
- source_word: מֵאָז
  choice: mula nang
  rationale: Ipinakikilala nito ang panimulang punto ng apatnapu’t limang taong yugto.
- source_word: הַדָּבָר הַזֶּה
  choice: ang salitang ito
  rationale: Pinananatili nito ang pangunahing kahulugan ng דָּבָר at ang pagtukoy sa naunang sinabi ni Yahweh, nang hindi tahasang binibigyang-kahulugang ‘pangako.’
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: habang naglalakbay ang Israel sa ilang
  rationale: Sa konteksto, ang הלך ay tumutukoy sa paglalakbay ng Israel sa ilang; mas natural ito sa modernong Tagalog kaysa sa literal na ‘lumakad.’
- source_word: הִנֵּה
  choice: narito
  rationale: Pinananatili nito ang pantawag-pansing diin ng Hebreong kataga sa isang marangal ngunit mauunawaang anyo.
- source_word: אָנֹכִי הַיּוֹם
  choice: ako sa araw na ito
  rationale: Pinananatili ang tahasang pagdiriin ng Hebreo sa kasalukuyang araw.
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: walumpu’t limang taong gulang
  rationale: Ito ang likas na katumbas sa Tagalog ng Hebreong idyoma para sa edad.
theological_decisions:
- issue: Paglalarawan sa naunang sinabi ni Yahweh
  choice: salitang ito
  alternative: pangakong ito
  rationale: Bagaman maaaring tumukoy sa isang pangako ang konteksto, mas malawak ang kahulugan ng דָּבָר. Ang ‘salitang ito’ ay nagpapanatili sa leksikal at teolohikal na kaluwagan ng teksto.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton; kaya pinananatili ang banal na pangalan sa transliterasyong Yahweh sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “narito” upang mapanatili ang retorikal na diin ng הִנֵּה, at “ilang” bilang nakaugaliang salitang biblikal para sa wilderness. Iniwasan ang labis na interpretibong “pangako” sa pangunahing teksto.
