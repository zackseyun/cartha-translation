base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: tl
  text: Malakas pa rin ako ngayon gaya noong araw na isinugo ako ni Moises; kung gaano ang lakas ko noon, ganoon din ang lakas ko ngayon para sa pakikipaglaban at sa paglabas at pagpasok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “paglabas at pagpasok” ay isang idyomang Hebreo na tumutukoy sa ganap na kakayahang kumilos at gampanan ang mga tungkulin, at maaari ring tumukoy sa aktibong pagkilos o pamumuno.
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם חָזָק
  choice: Malakas pa rin ako ngayon
  rationale: Likas na Filipino ang ayos na ito at malinaw na ipinahahayag ang nagpapatuloy na kalagayan ni Caleb hanggang sa kasalukuyan.
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: gaya noong araw na isugo ako ni Moises
  rationale: Pinananatili ang tiyak na pagtukoy sa araw ng pagsusugo at ang paghahambing sa lakas ni Caleb noon at ngayon.
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: Kung gaano ang lakas ko noon, ganoon din ang lakas ko ngayon
  rationale: Ipinapakita ang balanseng paghahambing ng dalawang pariralang Hebreo at nililinaw sa natural na Filipino ang walang-pandiwang pangungusap.
- source_word: לַמִּלְחָמָה
  choice: para sa pakikipaglaban
  rationale: Sa konteksto, tumutukoy ito sa personal na kakayahan at kahandaan sa labanan, hindi lamang sa digmaan bilang malawak na pangyayari.
- source_word: וְלָצֵאת וְלָבוֹא
  choice: at sa paglabas at pagpasok
  rationale: Pinananatili ang konkretong idyomang Hebreo sa halip na paliitin ito sa isang tiyak na interpretasyon; ipinaliliwanag ang saklaw nito sa talababa.
