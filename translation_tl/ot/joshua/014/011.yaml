revisions:
- from: Malakas pa rin ako ngayon gaya noong araw na isugo ako ni Moises. Kung gaano ang lakas ko noon, ganoon din ang lakas ko ngayon para sa pakikipaglaban at sa paglabas at pagpasok.[a]
  to: Malakas pa rin ako ngayon gaya noong araw na isinugo ako ni Moises; kung gaano ang lakas ko noon, ganoon din ang lakas ko ngayon para sa pakikipaglaban at sa paglabas at pagpasok.[a]
  rationale: Pinalitan ang “isugo” ng “isinugo” upang tumpak at likas na maipahayag ang nakaraang pagkilos ni Moises. Pinanatili ang balanseng paghahambing, ang kahandaang lumaban, at ang idyomang Hebreo; nilinaw lamang nang maingat ang talababa nang hindi itinatakda ang isang eksklusibong interpretasyon.
