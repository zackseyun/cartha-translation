  text: עַל כֵּ֣ן הָיְתָֽה חֶ֠בְרוֹן לְ/כָלֵ֨ב בֶּן יְפֻנֶּ֤ה הַ/קְּנִזִּי֙ לְֽ/נַחֲלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה יַ֚עַן אֲשֶׁ֣ר מִלֵּ֔א אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: tl
  text: Kaya ang Hebron ay naging mana ni Caleb na anak ni Jefune, na Kenizeo, hanggang sa araw na ito, sapagkat buong katapatan niyang sinunod[a] si Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lubos niyang sinunod.” Literal na gumagamit ang Hebreong idyoma ng pandiwang “punuin” kasama ng pariralang “pagkatapos ni Yahweh”; ipinahihiwatig nito ang ganap at buong-loob na katapatan sa pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Ipinahahayag nito ang bunga ng naunang pagkakaloob at likas itong pakinggan sa makabagong Tagalog.
- source_word: הָיְתָה ... לְנַחֲלָה
  choice: ay naging mana
  rationale: 'Ipinakikita ng parirala ang pagpasok sa bagong kalagayan: ang Hebron ay napunta kay Caleb bilang minanang bahagi, hindi lamang basta dating pag-aari niya.'
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Karaniwang anyong ginagamit sa Tagalog para sa pangalan ng lugar.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: ni Caleb na anak ni Jefune, na Kenizeo
  rationale: Malinaw na ipinahahayag ang pagmamay-ari at pinananatili ang pagkakakilanlan ni Caleb bilang anak ni Jefune at isang Kenizeo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Tuwirang salin ng idyomang nagsasaad na nagpapatuloy ang kalagayan hanggang sa panahon ng tagapagsalaysay.
- source_word: יַעַן אֲשֶׁר
  choice: sapagkat
  rationale: Dignificado at malinaw na panandang nagbibigay ng dahilan.
- source_word: מִלֵּא אַחֲרֵי
  choice: buong katapatan niyang sinunod
  rationale: Ang Hebreong idyoma ay tumutukoy sa ganap at taos-pusong pagsunod o katapatan; inihahatid ng saling ito ang kahulugan nang natural sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at natural na salin ng construct chain at pinananatili ang pagkakakilanlan ng Diyos kaugnay ng Israel.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreong teksto; ang transliterasyong “Yahweh” ang pinakamalinaw na nagpapanatili rito nang hindi ito ginagawang titulo.
- issue: Diwa ng מִלֵּא אַחֲרֵי
  choice: buong katapatan niyang sinunod
  alternative: lubos niyang sinunod
  rationale: Pinagsasama ng idyoma ang ganap na pagsunod at buong-loob na katapatan. Pinananatili ng pangunahing salin ang dalawang diwang ito nang hindi ito nililimitahan sa mekanikal na pagsunod lamang.
translation_notes:
  register: Makabago, malinaw, at dignipikadong Tagalog. Ginamit ang “mana” sa konteksto ng paghahati ng lupain, at inilagay ang talababa sa mismong idyomang nililinaw nito.
