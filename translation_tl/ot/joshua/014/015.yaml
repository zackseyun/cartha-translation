base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: tl
  text: 'Ang dating pangalan ng Hebron ay Kiriat-arba[a]. Si Arba ang pinakadakilang tao sa mga Anakim.[b] At nagkaroon ng kapahingahan ang lupain mula sa digmaan.[c]


    [a] Ang “Kiriat-arba” ay malamang na nangangahulugang “lungsod ni Arba.”


    [b] Maaari rin itong isalin na “ang dakilang tao sa mga Anakim.” Maaaring ipinahihiwatig ng Hebreo na si Arba ang pinakakilalang taong kaugnay ng mga Anakim.


    [c] O “At natahimik ang lupain mula sa digmaan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Kiriat-arba” ay malamang na nangangahulugang “lungsod ni Arba.”
    reason: lexical_alternative
  - marker: b
    text: Maaari rin itong isalin na “ang dakilang tao sa mga Anakim.” Maaaring ipinahihiwatig ng Hebreo na si Arba ang pinakakilalang taong kaugnay ng mga Anakim.
    reason: alternative_reading
  - marker: c
    text: O “At natahimik ang lupain mula sa digmaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁם חֶבְרוֹן לְ/פָנִים
  choice: Ang dating pangalan ng Hebron
  rationale: Ang שֵׁם ay “pangalan,” at ang לְפָנִים ay “noong una/dati.” Ang “dating pangalan” ay natural sa modernong Filipino at hindi na nangangailangan ng hiwalay na panimulang “at.”
- source_word: קִרְיַת אַרְבַּע
  choice: Kiriat-arba
  rationale: Pinanatili bilang pangalang pantangi; ang anyong Kiriat ay malapit sa pagbigkas ng Hebreo. Ipinaliliwanag sa talababa ang malamang na kahulugang “lungsod ni Arba.”
- source_word: הָאָדָם הַגָּדוֹל בָּעֲנָקִים הוּא
  choice: Si Arba ang pinakadakilang tao sa mga Anakim
  rationale: Ang הוּא ay tumutukoy kay Arba. Maaaring unawain ang may-tiyak na הַגָּדוֹל bilang nagpapahayag ng pagiging pangunahin o pinakadakila, ngunit pinananatili sa talababa ang mas tuwirang “ang dakilang tao.”
- source_word: עֲנָקִים
  choice: mga Anakim
  rationale: Tuwirang transliterasyon ng pangalang-etniko sa Hebreo, sa halip na gumamit ng mas interpretibong katawagan.
- source_word: וְ/הָ/אָרֶץ שָׁקְטָה מִ/מִּלְחָמָה
  choice: At nagkaroon ng kapahingahan ang lupain mula sa digmaan
  rationale: Ang שָׁקַט ay nagsasaad ng pagiging tahimik, panatag, o malaya sa kaguluhan. Ang “nagkaroon ng kapahingahan” ay malinaw sa konteksto ng pagtigil ng labanan, habang pinananatili sa talababa ang mas literal na “natahimik.”
theological_decisions:
- issue: Kung ang הַגָּדוֹל ay nangangahulugang “pinakadakila” o “dakila” lamang
  choice: pinakadakilang tao
  alternative: ang dakilang tao
  rationale: Maaaring ipahiwatig ng tiyak na parirala ang pangunahing tao sa mga Anakim, ngunit hindi lubos na hayag ang superlatibo sa anyong Hebreo; kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangalang Hebreo bilang Hebron, Kiriat-arba, at Anakim. Iniwasan ang labis na lumang pananalita, habang pinanatili ang maikli at salaysay na himig ng talata.
