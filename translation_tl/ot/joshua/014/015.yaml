  to: 'Ang dating pangalan ng Hebron ay Kiriat-arba[a]. Si Arba ang pinakadakilang tao sa mga Anakim.[b] At nagkaroon ng kapahingahan ang lupain mula sa digmaan.[c]


    [a] Ang “Kiriat-arba” ay malamang na nangangahulugang “lungsod ni Arba.”


    [b] Maaari rin itong isalin na “ang dakilang tao sa mga Anakim.” Maaaring ipinahihiwatig ng Hebreo na si Arba ang pinakakilalang taong kaugnay ng mga Anakim.


