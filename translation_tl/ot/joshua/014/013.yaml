  text: Then Joshua blessed him and gave Hebron to Caleb son of Jephunneh as an inheritance[a].
translation:
  language: tl
  text: Pagkatapos, binasbasan siya ni Josue at ibinigay ni Josue ang Hebron kay Caleb na anak ni Jefune bilang mana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “binasbasan ni Josue si Caleb”; “binasbasan siya” ang nasa Hebreo, at malinaw sa konteksto na si Caleb ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: binasbasan siya
  rationale: Ang pandiwang ברך na may hulaping panlalaking isahan ay literal na “binasbasan siya.” Pinananatili ng salin ang panghalip; malinaw sa konteksto na si Caleb ang tinutukoy.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang makabagong anyo ng pangalang biblikal sa Filipino.
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Tuwirang katumbas ng karaniwang pandiwang נתן at angkop sa konteksto ng pagkakaloob ng lupain.
- source_word: אֶת חֶבְרוֹן
  choice: ang Hebron
  rationale: Ang אֶת ay pananda ng tiyak na layon at hindi isinasalin bilang hiwalay na salita; pinanatili ang pangalang Hebron sa karaniwang transliterasyon.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: kay Caleb na anak ni Jefone
  rationale: Ang לְ ay nagmamarka sa di-tuwirang layon. Natural sa Filipino ang “kay Caleb na anak ni Jefone” para sa pormulang genealogical.
- source_word: לְנַחֲלָה
  choice: bilang mana
  rationale: Ang נַחֲלָה ay lupain o ari-ariang ipinagkaloob bilang mana. Maikli at natural ang “bilang mana” habang pinananatili ang diwa ng pamana at takdang bahagi.
