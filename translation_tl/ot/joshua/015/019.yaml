base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: tl
  text: Sinabi niya, “Bigyan mo sana ako ng isang pagpapala[a]. Yamang ibinigay mo sa akin ang lupain ng Negev[b], bigyan mo rin ako ng mga bukal ng tubig[c].” Kaya ibinigay niya sa kanya ang mga bukal sa mataas na bahagi at ang mga bukal sa mababang bahagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang kaloob.” “Pagpapala” ang literal na salita sa Hebreo, ngunit dito ay tumutukoy ito sa isang kapaki-pakinabang na kaloob.
    reason: lexical_alternative
  - marker: b
    text: Ang “Negev” ay maaari ring mangahulugang “katimugan” o “tuyong rehiyon sa timog.”
    reason: lexical_alternative
  - marker: c
    text: Maaaring tumukoy ang salitang Hebreo sa mga bukal, tipunan, o imbakan ng tubig; “mga bukal” ang pinakaangkop sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: isang pagpapala
  rationale: Karaniwang nangangahulugang “pagpapala” ang salita, ngunit dito ay tumutukoy ito sa isang kapaki-pakinabang na kaloob na hinihingi sa ama. Pinananatili ng “pagpapala” ang mismong larawan at saklaw ng Hebreo.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: ang lupain ng Negev
  rationale: Maaaring tumukoy ang נֶגֶב sa timog o tuyong rehiyon, ngunit dito ay ginagamit bilang pangalang heograpiko. Kaya pinanatili ang “Negev,” kasama ang “lupain” para sa אֶרֶץ.
- source_word: גֻּלֹּת מָיִם
  choice: mga bukal ng tubig
  rationale: Hindi ganap na tiyak ang eksaktong anyo ng mga pinagkukunan ng tubig na tinutukoy ng גֻּלֹּת; maaaring mga bukal, tipunan, o lunas ng tubig. Ang “mga bukal ng tubig” ang pinakaangkop sa konteksto at sa paghahati sa mataas at mababang bahagi.
- source_word: תְּנָה
  choice: Bigyan mo sana ako
  rationale: Ang pautos na anyo ay isang magalang na pakiusap sa konteksto. Likas na ipinahahayag sa Filipino ng “sana” ang mapakiusap na tono nang hindi ginagawang tahasang bahagi ng leksikal na kahulugan.
- source_word: וְנָתַתָּה לִי
  choice: bigyan mo rin ako
  rationale: Ipinapakita ng “rin” na humihingi siya ng karagdagang kaloob bukod sa lupaing naibigay na.
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: ang mga bukal sa mataas na bahagi
  rationale: Ipinahihiwatig ng עִלִּיּוֹת ang mas mataas na kinalalagyan. Mas malinaw sa modernong Filipino ang “sa mataas na bahagi” kaysa sa literal ngunit maaaring malabong “mga bukal sa itaas.”
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: ang mga bukal sa mababang bahagi
  rationale: Katapat ito ng mga bukal sa mataas na bahagi at tumutukoy sa mas mababang kinalalagyan.
- source_word: וַיִּתֶּן לָהּ
  choice: Kaya ibinigay niya sa kanya
  rationale: Isinusulong ng narrative waw ang salaysay, at ang “Kaya” ay natural na nag-uugnay sa ibinigay sa naunang pakiusap.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sana” upang ihayag ang magalang na pakiusap, at ang “mataas/mababang bahagi” upang gawing malinaw ang heograpikong paghahambing. Pinanatili ang “Negev” bilang pangalang heograpiko at nilagyan ng paliwanag sa talababa.
