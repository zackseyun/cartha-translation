lexical_decisions:
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Pangalan ng isang lugar; tinumbasan sa pamamagitan ng transliterasyon. Pinanatili ang anyong “Ziklag,” na malinaw na kumakatawan sa mga katinig ng Hebreo at karaniwan sa mga saling Filipino.
- source_word: מַדְמַנָּה
  choice: Madmana
  rationale: Pangalan ng isang lugar; ginamit ang payak at natural na transliterasyong Filipino. Hindi kailangang katawanin ng dobleng “n” ang dagesh sa modernong baybay-Filipino.
- source_word: סַנְסַנָּה
  choice: Sansana
  rationale: Pangalan ng isang lugar; ginamit ang transliterasyong naaayon sa bigkas at baybay-Filipino. Hindi isinama ang tahimik na h na ginagamit sa ilang anyong Ingles.
- source_word: וְ
  choice: at
  rationale: Ang pang-ugnay na may unlapi ay nagdurugtong sa mga pangalan sa talaan. Sa natural na Filipino, kuwit ang naghihiwalay sa unang mga pangalan at “at” ang inilalagay bago ang huli.
