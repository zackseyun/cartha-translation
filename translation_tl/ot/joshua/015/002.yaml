id: JOS.15.2
reference: Joshua 15:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֤י לָ/הֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֖ה יָ֣ם הַ/מֶּ֑לַח מִן הַ/לָּשֹׁ֖ן הַ/פֹּנֶ֥ה נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/002.yaml
  text: Their southern border was from the end of the Salt Sea[b][a], from the tongue that faces southward.
translation:
  language: tl
  text: Ang hangganan nila sa timog ay mula sa dulo ng Dagat na Maalat[b], mula sa look[a] na nakaharap sa timog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “dila,” isang katawagang topograpikal para sa hugis-dilang look o pasok ng tubig.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang Dagat na Patay.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: Ang hangganan nila ... ay
  rationale: Likas na pagmamay-aring parirala sa Tagalog na naghahatid sa diwa ng Hebrew היה na may ל at hulaping panghalip, nang hindi ginagaya nang matigas ang sintaks.
- source_word: גְּבוּל נֶגֶב
  choice: hangganan ... sa timog
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ang גְּבוּל sa guhit ng hangganan, at direksiyonal ang נֶגֶב, hindi pangalang-pook na Negev.
- source_word: מִקְצֵה
  choice: mula sa dulo ng
  rationale: Pinananatili nito ang diwa ng isang sukdulan o dulong puntong heograpikal.
- source_word: יָם הַמֶּלַח
  choice: Dagat na Maalat
  rationale: Tapat na isinasalin ang literal na tawag sa Hebrew sa halip na ipalit sa pangunahing teksto ang mas makabagong pangalang Dagat na Patay.
- source_word: מִן הַלָּשׁוֹן
  choice: mula sa look
  rationale: Bagaman literal na 'dila,' topograpikal ang gamit at tumutukoy sa hugis-dilang look o pasok ng tubig; natural at malinaw ang 'look' sa modernong Tagalog, habang iniingatan sa talababa ang larawan ng orihinal.
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: na nakaharap sa timog
  rationale: Ipinahahayag ang oryentasyon ng anyong heograpikal at pinananatili ang direksiyonal na puwersa ng hulaping -ה.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hangganan sa timog” sa halip na “timog na hangganan” para sa likas na daloy, at “look” para sa agarang pagkaunawa sa topograpiya. Parehong nasa pangunahing teksto ang mga panandang [a] at [b].
