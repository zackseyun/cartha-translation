  source_fidelity: 'Tapat ang salin sa dalawang sugnay ng Hebreo: ang silangang hangganan ay ang Dagat na Maalat hanggang sa bukana ng Jordan, at ang hilagang hangganan ay nagsisimula sa “dila ng dagat,” kaugnay ng bukana ng Jordan. Ang “bukana” ay angkop na heograpikong paglilinaw ng קְצֵה הַיַּרְדֵּן sa kontekstong ito at umaayon sa English POB audit trail na “mouth of the Jordan.”'
