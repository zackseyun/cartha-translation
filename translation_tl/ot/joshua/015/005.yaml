base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/005.yaml
  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: tl
  text: Ang hangganan sa silangan ay ang Dagat na Maalat hanggang sa bukana ng Jordan. Ang hangganan sa hilagang panig ay mula sa dila ng dagat, sa bukana ng Jordan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: Dagat na Maalat
  rationale: Tuwirang isinasalin ang heograpikong pangalang “Sea of Salt” sa natural at malinaw na Filipino.
- source_word: קְצֵה הַיַּרְדֵּן
  choice: bukana ng Jordan
  rationale: Bagaman literal na “dulo ng Jordan,” sa kontekstong heograpiko tumutukoy ito sa bahaging pinagsasalubungan ng Ilog Jordan at ng Dagat na Maalat; “bukana” ang likas na katawagan dito.
- source_word: לְשׁוֹן הַיָּם
  choice: dila ng dagat
  rationale: Pinananatili ang konkretong metaporang Hebreo para sa nakausling bahagi o look ng dagat, nang hindi tinutukoy nang higit sa sinasabi ng teksto.
- source_word: לִפְאַת צָפוֹנָה
  choice: sa hilagang panig
  rationale: Natural na Filipino para sa direksiyonal na pariralang tumutukoy sa panig na nasa hilaga.
