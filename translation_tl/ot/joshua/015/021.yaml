base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/021.yaml
  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: tl
  text: At ang mga lunsod sa pinakadulong bahagi ng lupain ng lipi ng mga anak ni Juda[a], sa bandang hangganan ng Edom sa Negev[b], ay Kabzeel, Eder, at Jagur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa dulo ng lupain ng lipi ng mga anak ni Juda.” Ang Hebreong pananalita ay tumutukoy sa dulo o panlabas na gilid ng nasasakupan ng Juda.
    reason: lexical_alternative
  - marker: b
    text: Ang “Negev” ay maaari ring isaling “timog” o “katimugang rehiyon.” Dito, malamang na tinutukoy nito ang tiyak na katimugang rehiyon ng Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: At ang mga lunsod … ay ang
  rationale: Ipinakikilala ng pandiwang היה ang kasunod na talaan ng mga lunsod. Pinananatili ng Tagalog na ayos ang pang-ugnay na “At” at likas na inilalahad ang nominativong talaan.
- source_word: מִקְצֵה
  choice: sa pinakadulong bahagi ng lupain
  rationale: Ang קָצֶה ay tumutukoy sa dulo o panlabas na gilid. Idinagdag ang “lupain” bilang malinaw na ipinahihiwatig ng kontekstong pangteritoryo, hindi bilang bagong impormasyon.
- source_word: לְמַטֵּה בְנֵי יְהוּדָה
  choice: ng lipi ng mga anak ni Juda
  rationale: Ang מַטֶּה rito ay tribong pangkat, at ang בְנֵי יְהוּדָה ay ang karaniwang katawagang panlipi na literal na “mga anak ni Juda.”
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: sa gawing hangganan ng Edom
  rationale: Ipinahahayag ng אֶל ang direksiyon o pagkakaharap sa hangganan, nang hindi iginigiit na ang bawat lunsod ay mismong nasa guhit ng hangganan.
- source_word: בַּנֶּגְבָּה
  choice: sa Negev
  rationale: Sa paglalarawang heograpikal na ito, malamang na tinutukoy ang timog na rehiyong kilala bilang Negev; pinananatili sa talababa ang mas pangkalahatang kahulugang “timog.”
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: Kabzeel, Eder, at Jagur
  rationale: Isinalin sa baybay na karaniwang transliterasyon ang tatlong pangalang-pook.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino; malinaw sa karaniwang mambabasa. Pinanatili ang tradisyonal na katawagang panlipi na “mga anak ni Juda” at ang pangalang heograpikal na “Negev,” habang inilalagay sa mga talababa ang tunay na mga alternatibong leksikal.
