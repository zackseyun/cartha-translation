translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Idinagdag ang “ang hangganan” bilang kontekstuwal na paksa upang maging natural ang heograpikong talaan. Pinanatili ang mga pangalang pantangi sa anyong madaling bigkasin sa Filipino at ang magkakasunod na pandiwa upang madama ang ruta ng hangganan.
