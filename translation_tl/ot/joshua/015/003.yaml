  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: tl
  text: Pagkatapos, ang hangganan ay tumuloy patimog sa Paahon ng Akrabim[a], dumaan patungong Zin, umahon mula sa timog patungong Kades-barnea, dumaan sa Hezron, umahon patungong Adar, at lumiko patungong Karka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Akrabim ay malamang na nangangahulugang “mga alakdan”; pinanatili rito ang salitang Hebreo bilang pangalan ng lugar.
    reason: lexical_alternative
  - marker: b
    text: Ang baybay ng pangalan ng lugar na ito ay hindi tiyak; maaari rin itong baybaying “Karkaa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: ang hangganan ay tumuloy
  rationale: Sa paglalarawan ng hangganan, ang di-tiyak na paksa ng pandiwa ay ang linya ng hangganan. Ang “tumuloy” ay natural sa modernong Tagalog at pinananatili ang larawan ng sunod-sunod na pag-usad.
- source_word: אֶל מִנֶּגֶב
  choice: patimog
  rationale: Malinaw at maikli itong panandang-direksiyon para sa pag-usad ng hangganan sa dakong timog.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: sa Ahunan ng Akrabim
  rationale: Ang מַעֲלֵה ay isang paahong daan o ahunan. Pinanatiling pangalan ng lugar ang Akrabim sa halip na isaling “mga alakdan.”
- source_word: וְעָבַר צִנָה
  choice: dumaan patungong Zin
  rationale: Sa pormula ng hangganan, ang עבר ay nagsasaad ng pagdaan o pagtawid ng linya. Ang hulaping lokatibo sa צִנָה ay nagbibigay ng direksiyong patungo sa Zin.
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: umahon mula sa timog patungong Kades-barnea
  rationale: Pinananatili nito ang tahasang galaw mula sa timog patungo sa Kades-barnea, nang hindi ginagawang simpleng lokasyong nasa timog lamang ng lungsod.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Pangalan ng lugar na tinumbasan ayon sa karaniwang transliterasyong Filipino.
- source_word: אַדָּרָה
  choice: patungong Adar
  rationale: Pangalan ng lugar; ang hulaping lokatibo ay natural na ipinahayag sa “patungong.”
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: lumiko patungong Karka
  rationale: Ang נסב ay tumutukoy sa pagliko ng hangganan, at ang hulaping lokatibo sa pangalan ay nagpapahiwatig ng direksiyon nang hindi tiyak na sinasabing umabot ito roon.
