    rationale: Maaaring bahagyang mabasa na ang lipi mismo ang “nakuha sa palabunutan.” Ang “bahaging iginawad sa pamamagitan ng palabunutan para sa lipi” ay mas tuwirang tumutukoy sa allotment.
  - severity: low
    issue: Hindi gaanong likas ang “sa pinakadulong bahagi ng timog.”
    rationale: Ang “sa pinakatimog” ay mas idiomatiko sa modernong Tagalog at sapat na naghahatid ng kahulugang nasa sukdulang timugang dulo, habang pinananatili ng talababa ang alternatibong pagbasa ng תימן.
