base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: tl
  text: At ang bahaging iginawad sa pamamagitan ng palabunutan para sa lipi ng mga anak ni Juda[a], ayon sa kani-kanilang angkan, ay umabot hanggang sa hangganan ng Edom—sa ilang ng Zin, sa timog, sa pinakatimog.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Juda” ay tumutukoy sa mga kaapu-apuhan ni Juda na bumubuo sa liping ito.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “mula sa dulo ng timog.” Ang salitang Hebreo na isinaling “timog” ay maaari ring unawain bilang pangalang Teman.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: At ang bahaging nakuha sa palabunutan
  rationale: Ipinahahayag nito kapwa ang resulta at ang kongkretong paraan ng paghahati ng lupain. Mas natural ito sa Tagalog kaysa sa literal na “at ang palabunot ay,” ngunit hindi inaalis ang ideya ng pagpapalabunutan.
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: ng lipi ng mga anak ni Juda
  rationale: Ang מַטֶּה ay “lipi” sa kontekstong ito, at pinananatili ng “mga anak ni Juda” ang Hebreong pananalitang tumutukoy sa mga kaapu-apuhan ni Juda.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang “angkan” ay angkop sa mga pangkat na bumubuo sa isang lipi; ipinakikita ng “kani-kanilang” na ang pamamahagi ay ayon sa mga angkan nila.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: ay umabot sa hangganan ng Edom
  rationale: Ginagawang malinaw sa natural na Tagalog ang saklaw ng bahaging inilalarawan, habang pinananatili ang hangganan ng Edom bilang limitasyong heograpikal.
- source_word: מִדְבַּר צִן
  choice: sa ilang ng Zin
  rationale: Ang “ilang” ay natural at marangal na katumbas ng מִדְבָּר bilang tuyot at di-tinitirhang lupain.
- source_word: נֶגְבָּה
  choice: sa timog
  rationale: Dito ay direksiyon o kinalalagyang timog ang pinakanaaangkop na diwa, hindi kinakailangang ang pantanging pangalang Negeb.
- source_word: מִקְצֵה תֵימָן
  choice: sa pinakadulong bahagi ng timog
  rationale: Ipinahahayag nito ang matinding hangganang nasa timog. Ang talababa ay nagpapanatili sa posibilidad ng mas literal na pagbasa at ng Teman bilang pangalang pantangi.
