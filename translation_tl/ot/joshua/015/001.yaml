translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bahaging nakuha sa palabunutan” upang maging likas ang pangungusap nang hindi nawawala ang mekanismo ng palabunutan; pinanatili ang sinaunang katawagang “mga anak ni Juda” at ipinaliwanag ito sa talababa.
