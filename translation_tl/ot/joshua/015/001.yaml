revisions:
- from: At ang bahaging nakuha sa palabunutan ng lipi ng mga anak ni Juda[a], ayon sa kani-kanilang angkan, ay umabot sa hangganan ng Edom—sa ilang ng Zin sa timog, sa pinakadulong bahagi ng timog.[b]
  to: At ang bahaging iginawad sa pamamagitan ng palabunutan para sa lipi ng mga anak ni Juda[a], ayon sa kani-kanilang angkan, ay umabot hanggang sa hangganan ng Edom—sa ilang ng Zin, sa timog, sa pinakatimog.[b]
  rationale: Nilinaw ang ugnayan ng lupaing inilaan, ng palabunutan, at ng lipi ni Juda. Pinalitan ang masalimuot na pangwakas na parirala ng “sa pinakatimog,” isang likas na Tagalog na katumbas ng sukdulang timugang hangganan. Pinanatili ang dalawang talababa at ang maingat na alternatibong pagbasa para sa תימן.
