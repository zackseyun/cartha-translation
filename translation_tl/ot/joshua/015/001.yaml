  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang lupaing inilaan sa pamamagitan ng palabunutan para sa lipi ni Juda, ayon sa kanilang mga angkan, ay inilalarawan hanggang sa hangganan ng Edom at sa ilang ng Zin sa timog. Gayunman, mas malinaw na ipahayag na ang bahagi ay iginawad sa pamamagitan ng palabunutan, at mas tapat at natural ang “sa pinakatimog” para sa matinding timugang hangganan.'
  naturalness: Natural at marangal ang pangkalahatang Tagalog, ngunit medyo mabigat ang “bahaging nakuha sa palabunutan ng lipi” at paulit-ulit na mahaba ang “sa pinakadulong bahagi ng timog.” Ang binagong pananalita ay mas malinaw nang hindi nawawala ang pormal na rehistro.
  terminology: Ang “lipi,” “angkan,” “ilang,” at “Edom” ay angkop. Pinananatili ang “mga anak ni Juda” bilang malapit na katumbas ng Hebreo, na may paliwanag sa talababa. Ang “palabunutan” ay pinanatili upang huwag mawala ang mekanismo ng lot.
