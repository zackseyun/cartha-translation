  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/גְב֣וּל יָ֔ם הַ/יָּ֥מָּ/ה הַ/גָּד֖וֹל וּ/גְב֑וּל זֶ֠ה גְּב֧וּל בְּנֵֽי יְהוּדָ֛ה סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: tl
  text: At ang hangganan sa kanluran ay ang Malaking Dagat at ang baybayin nito[a]. Ito ang hangganan ng mga anak ni Juda sa buong palibot, ayon sa kanilang mga angkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang dagat, ang Malaking Dagat, at ang hangganan nito”; ito ang Dagat Mediteraneo, na bumubuo sa hangganan ng Juda sa kanluran.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “para sa kanilang mga angkan.” Ang salitang Hebreo ay tumutukoy sa mga pangkat ng magkakamag-anak sa loob ng tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: At ang hangganan sa kanluran
  rationale: Sa mga paglalarawan ng hangganan, ang יָם ay idiomatikong tumutukoy sa gawing dagat, samakatuwid ay sa kanluran; likas at malinaw ito sa modernong Tagalog.
- source_word: הַיָּמָּה הַגָּדוֹל
  choice: ang Malaking Dagat
  rationale: Ito ang karaniwang heograpikong tawag sa Dagat Mediteraneo; pinananatili ng salin ang anyo ng Hebreo at ipinapaliwanag sa talababa.
- source_word: וּגְבוּל
  choice: bilang hangganan
  rationale: Ang ikalawang גְּבוּל ay isang maikling appositional o predicative na parirala. Ang “bilang hangganan” ay nagpapahayag ng tungkulin ng dagat nang hindi inaalis ang pag-uulit sa Hebreo.
- source_word: זֶה גְּבוּל
  choice: Ito ang hangganan
  rationale: Walang tahasang pandiwa sa Hebreo. Natural sa Tagalog ang nominal na pangungusap na ito at hindi kailangang magtakda ng panahunan.
- source_word: בְּנֵי יְהוּדָה
  choice: mga anak ni Juda
  rationale: Pinananatili nito ang tahasang panlalaking pansamahang katawagan ng Hebreo para sa mga inapo at tribo ni Juda.
- source_word: סָבִיב
  choice: sa buong palibot
  rationale: Ipinahahayag nito na ang inilalarawang mga hangganan ay nakapalibot sa teritoryo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa konteksto ng paghahati ng lupain, ang מִשְׁפָּחָה ay tumutukoy sa mga pangkat ng magkakamag-anak sa loob ng tribo. Ang “ayon sa” ay nagpapanatili sa posibleng distributibong ugnayan.
theological_decisions:
- issue: Panlalaking katawagang pantribo sa בְּנֵי יְהוּדָה
  choice: mga anak ni Juda
  alternative: mga inapo ni Juda / sambayanan ni Juda
  rationale: Walang natatanging usaping doktrinal, ngunit ang literal na ugnayang anak-magulang sa pansamahang katawagan ng Hebreo ay maaaring panatilihin nang natural sa Tagalog.
- issue: Ugnayan ng לְמִשְׁפְּחֹתָם sa buod ng hangganan
  choice: ayon sa kanilang mga angkan
  alternative: para sa kanilang mga angkan
  rationale: Maaaring ipahiwatig ng parirala ang kaayusan ayon sa mga pangkat ng angkan o ang paglalaan para sa kanila. Pinili ang “ayon sa” upang huwag gawing mas tiyak kaysa sa Hebreo ang layunin ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong heograpiko. Pinanatili ang bahagyang pormal na “mga anak ni Juda” at “Malaking Dagat,” habang iniwasan ang makaluma o labis na teknikal na pananalita.
