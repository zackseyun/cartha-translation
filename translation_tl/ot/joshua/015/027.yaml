translation:
  language: tl
  text: Hazar-Gada[a], Hesmon, at Bet-Pelet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isulat na “Hazar-Gada” nang walang gitling: “Hazargada.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר גַּדָּה
  choice: Hazar-Gada
  rationale: Pangalan ito ng isang lugar sa teritoryo ng Juda, kaya tinumbasan sa pamamagitan ng transliterasyong angkop sa makabagong Filipino. Ginamit ang gitling upang ipakitang tambalang pangalan ito.
- source_word: חֶשְׁמוֹן
  choice: Hesmon
  rationale: Isang pangalan ng lugar; isinalin sa anyong transliterado at hindi binigyan ng kahulugang wala sa talaan.
- source_word: בֵית פָּלֶט
  choice: Bet-Pelet
  rationale: Tambalang pangalan ng lugar. Pinanatili ang elementong Bet sa halip na isaling 'Bahay ni Pelet,' sapagkat gumaganap ang buong parirala bilang pantanging pangalan.
- source_word: וְ / וּ
  choice: at
  rationale: Ang mga pang-ugnay na Hebreo ay nagdurugtong sa tatlong pangalan; natural na inilagay ang 'at' bago ang huling pangalan sa Filipino.
