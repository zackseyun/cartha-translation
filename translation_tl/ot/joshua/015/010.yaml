  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: tl
  text: Pagkatapos, lumiko ang hangganan mula sa Baala pakanluran[a] patungo sa Bundok Seir. Dumaan ito patungo sa hilagang dalisdis ng Bundok Jearim (na siyang Kesalon), bumaba sa Bet-semes, at nagpatuloy sa Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “patungo sa dagat,” isang karaniwang Hebreong paraan ng pagsasabi ng “pakanluran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: lumiko ang hangganan
  rationale: Sa paglalarawan ng hangganan, ipinahihiwatig ng pandiwa ang pagbabago ng direksiyon; natural at malinaw sa Filipino ang “lumiko.”
- source_word: מִבַּעֲלָה
  choice: mula sa Baala
  rationale: Pangalan ng lugar; isinalin sa paraang transliterasyon na madaling bigkasin sa Filipino.
- source_word: יָמָּה
  choice: pakanluran
  rationale: Ang literal na idyoma ay “patungo sa dagat,” ngunit karaniwan itong tumutukoy sa kanluran sa heograpiya ng Israel; pinananatili ng talababa ang literal na anyo.
- source_word: אֶל הַר שֵׂעִיר
  choice: patungo sa Bundok Seir
  rationale: Maaaring mangahulugan ang הַר ng bundok o bulubundukin; “Bundok Seir” ang tuwiran at angkop na pangalan ng palatandaang heograpiko rito.
- source_word: וְעָבַר אֶל כֶּתֶף
  choice: dumaan ito sa ... dalisdis
  rationale: Sa pormula ng hangganan, ang וְעָבַר ay tumutukoy sa pagpapatuloy o pagdaan ng linya; ang כֶּתֶף, literal na “balikat/tagiliran,” ay natural na naipahahayag bilang “dalisdis” ng bundok.
- source_word: הַר יְעָרִים מִצָּפוֹנָה
  choice: hilagang dalisdis ng Bundok Jearim
  rationale: Tinutukoy ng parirala ang hilagang panig o dalisdis ng bundok; malinaw at natural ito sa Filipino.
- source_word: הִיא כְסָלוֹן
  choice: (na siyang Kesalon)
  rationale: Pinananatili ang paliwanag o pagkakakilanlan ng naunang lugar nang hindi nilulutas nang higit sa sinasabi ng Hebreo ang eksaktong ugnayan ng mga pangalan.
- source_word: וְיָרַד בֵּית שֶׁמֶשׁ
  choice: bumaba sa Bet-semes
  rationale: Pinananatili ng “bumaba” ang topograpikong diwa ng pandiwa; transliterado ang pangalan ng lugar.
- source_word: וְעָבַר תִּמְנָה
  choice: nagpatuloy sa Timna
  rationale: Sa konteksto ng ruta ng hangganan, natural na ipinahahayag ng “nagpatuloy” ang pagdaan o pag-abot nito sa susunod na lugar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hangganan” at magkakaugnay na pandiwang heograpiko upang maging natural ang paglalarawan ng ruta, habang pinanatili ang mga pangalan ng lugar sa transliterasyong angkop sa Filipino.
