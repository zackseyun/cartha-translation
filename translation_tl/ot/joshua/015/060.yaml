source:
  edition: WLC
  text: קִרְיַת בַּ֗עַל הִ֛יא קִרְיַ֥ת יְעָרִ֖ים וְ/הָֽ/רַבָּ֑ה עָרִ֥ים שְׁתַּ֖יִם וְ/חַצְרֵי/הֶֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: tl
  text: Kiriat-baal (na Kiriat-jearim din), at Raba—dalawang lungsod, kasama ang mga pamayanang sakop ng mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: Kiriat-baal
  rationale: Pangalan ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon, hindi isinaling “Lungsod ni Baal.” Ang baybay na “Kiriat” ay mas madaling basahin sa modernong Filipino.
- source_word: הִיא
  choice: na … din
  rationale: Dito, ipinakikilala ng panghalip ang Kiriat-jearim bilang ibang pangalan ng Kiriat-baal. Likas sa Filipino ang parentetikong “na … din” para sa ganitong paliwanag.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriat-jearim
  rationale: Pangalan ng lugar kaya transliterado; hindi isinalin ang etimolohikong kahulugang “Lungsod ng mga Kagubatan.”
- source_word: הָרַבָּה
  choice: Raba
  rationale: Pangalan ng lugar kaya transliterado. Hindi isinama ang Hebreong pantukoy bilang hiwalay na bahagi ng pangalan.
- source_word: עָרִים שְׁתַּיִם
  choice: dalawang lungsod
  rationale: Tuwirang ipinahahayag ang bilang at ang karaniwang kahulugan ng עָרִים sa talaan ng mga nasasakupan.
- source_word: חַצְרֵיהֶן
  choice: mga pamayanang sakop ng mga ito
  rationale: Ang חָצֵר sa ganitong talaan ay tumutukoy sa maliliit o nakadependeng pamayanan na kaugnay ng mga pinangalanang lungsod. Nililinaw ng “sakop” ang ugnayan nang hindi nililimitahan ang mga ito sa isang partikular na uri gaya ng nayon o maliit na baryo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang mga pangalan bilang transliterasyon at ginamit ang parenthesis upang natural na ipakita na ang Kiriat-jearim ay ibang pangalan ng Kiriat-baal. Walang talababa dahil sapat na naipahahayag sa teksto ang kahulugan ng חַצְרֵיהֶן.
