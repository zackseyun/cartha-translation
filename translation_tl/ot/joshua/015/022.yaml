lexical_decisions:
- source_word: קִינָה
  choice: Kina
  rationale: Pangalan ng lugar; tinumbasan sa baybay na likas at madaling basahin sa modernong Filipino, kung saan ang ק ay kinakatawan ng k at hindi kailangang panatilihin ang h sa hulihan.
- source_word: דִימוֹנָה
  choice: Dimona
  rationale: Pangalan ng lugar; ang anyong Dimona ay tuwirang nagsasa-Filipino sa transliterasyon at malinaw na kumakatawan sa pangwakas na patinig ng Hebreo.
- source_word: עַדְעָדָה
  choice: Adada
  rationale: Pangalan ng lugar; pinananatili ng Adada ang inuulit na padron ng mga katinig sa Hebreo sa natural na baybay-Filipino.
- source_word: וְ
  choice: at
  rationale: Ang pang-ugnay ay inuulit sa tekstong Hebreo sa bawat pangalan; pinanatili ang bawat “at” upang maipakita ang polisindetikong anyo ng listahan.
