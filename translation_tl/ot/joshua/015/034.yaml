translation:
  language: tl
  text: Zanoa, En-ganim[a], Tapua[b], at Enam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang En-ganim ay malamang na nangangahulugang “bukal ng mga hardin.”
    reason: lexical_alternative
  - marker: b
    text: Ang Tapua ay pangalan ng lugar; ang salitang Hebreo na pinagmulan nito ay maaari ring tumukoy sa “mansanas” o sa isang punong namumunga.
    reason: lexical_alternative
  - marker: c
    text: Ang Enam ay pangalan ng lugar; may pantukoy ang anyong Hebreo nito, kaya maaari itong unawain na “ang mga bukal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנוֹחַ
  choice: Zanoa
  rationale: Pangalan ng lugar sa talaan ng mga bayan; isinalin sa baybay na likas sa modernong Filipino sa halip na isalin ang kahulugan.
- source_word: עֵין גַּנִּים
  choice: En-ganim
  rationale: Tambalang pangalan ng lugar mula sa עֵין, “bukal,” at גַּנִּים, “mga hardin.” Pinanatili bilang transliteradong toponimo, na may paliwanag sa talababa.
- source_word: תַּפּוּחַ
  choice: Tapua
  rationale: Dito ay pangalan ng lugar, bagaman ang salitang Hebreo ay maaari ring tumukoy sa mansanas o isang punong namumunga; kaya transliterasyon ang ginamit sa pangunahing teksto.
- source_word: הָעֵינָם
  choice: Enam
  rationale: Pangalan ng lugar na may kasamang pantukoy sa anyong Hebreo. Hindi ibinukod ang pantukoy sa transliterasyon sapagkat gumaganap ang buong anyo bilang isang tiyak na pangalan.
