id: JOS.15.9
reference: Joshua 15:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/תָאַ֨ר הַ/גְּב֜וּל מֵ/רֹ֣אשׁ הָ/הָ֗ר אֶל מַעְיַן֙ מֵ֣י נֶפְתּ֔וֹחַ וְ/יָצָ֖א אֶל עָרֵ֣י הַר עֶפְר֑וֹן וְ/תָאַ֤ר הַ/גְּבוּל֙ בַּעֲלָ֔ה הִ֖יא קִרְיַ֥ת יְעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/009.yaml
  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: tl
  text: Mula sa tuktok ng bundok, lumiko[a] ang hangganan patungo sa bukal ng tubig ng Neftoa, at nagpatuloy ito patungo sa mga bayan sa Bundok Efron. Pagkatapos, lumiko ang hangganan patungo sa Baala (na siyang Kiriat-Jearim).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iginuhit ang hangganan” o “bumaling ang hangganan.” Sa paglalarawang ito ng mga hangganan, ang pandiwang Hebreo ay maaaring tumukoy sa pagtunton sa guhit ng hangganan o sa pagbabago ng direksiyon nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: lumiko
  rationale: Sa paglalarawan ng hangganan, maaaring tumukoy ang pandiwa sa pagbabago ng direksiyon o sa pagtunton ng guhit nito. Likas at malinaw sa modernong Tagalog ang “lumiko” sa kontekstong heograpiko, habang pinananatili sa talababa ang ibang posibleng diwa.
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Karaniwang salitang Tagalog para sa linyang naghihiwalay sa mga teritoryo.
- source_word: מֵרֹאשׁ הָהָר
  choice: mula sa tuktok ng bundok
  rationale: Tumpak at natural na katumbas ng heograpikong gamit ng רֹאשׁ, na literal na “ulo” ngunit dito ay nangangahulugang tuktok.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: ang bukal ng tubig ng Neftoa
  rationale: Pinananatili ang ugnayan ng construct chain habang iniiwasan ang di-likas na pariralang “bukal ng mga tubig” sa Tagalog; isinalin sa baybay-Tagalog ang pangalang Neftoa.
- source_word: וְיָצָא
  choice: nagpatuloy ito patungo
  rationale: Sa pormulang naglalarawan ng hangganan, ipinapakita ng pandiwa ang pagpapatuloy ng linya. Mas natural ito kaysa sa literal na “lumabas” at hindi nito ipinapalagay na tiyak na umabot na ang hangganan sa huling hantungan.
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: mga bayan sa Bundok Efron
  rationale: Ang “mga bayan” ay natural na katumbas ng עָרֵי sa ganitong konteksto, at ang “Bundok Efron” ay tuwirang kumakatawan sa הַר עֶפְרוֹן. Ginamit ang “sa” upang maging malinaw at natural ang heograpikong ugnayan.
- source_word: בַּעֲלָה
  choice: Baala
  rationale: Pangalan ng lugar na isinalin sa baybay na angkop sa Tagalog.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: na siyang Kiriat-Jearim
  rationale: Malinaw na ipinakikilala nito ang Kiriat-Jearim bilang isa pang pangalan ng Baala nang hindi nagdaragdag ng interpretasyon.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, dignificado, at madaling maunawaang Filipino. Pinanatili ang anyo ng isang heograpikong paglalarawan, ngunit iniwasan ang sobrang literal na mga pariralang magiging alanganin sa Tagalog. Isinalin sa karaniwang baybay-Tagalog ang mga pangalang pantangi.
