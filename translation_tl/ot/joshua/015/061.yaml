  text: 'Sa ilang: Bet-araba, Midin, at Sekaka.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: Sa ilang
  rationale: Ang בַּ ay panandang panlunan, at ang מִדְבָּר dito ay tumutukoy sa ilang na rehiyon ng Juda kung saan matatagpuan ang mga kasunod na bayan. Likas at maikli sa modernong Tagalog ang “sa ilang.”
- source_word: בֵּית הָעֲרָבָה
  choice: Bet-araba
  rationale: Pangalan ito ng lugar kaya tinumbasan sa paraang transliterasyon, hindi isinalin ang literal na kahulugang “bahay ng Araba.” Ang “Bet” ay malapit sa anyong Hebreo at madaling basahin sa Tagalog.
- source_word: מִדִּין
  choice: Midin
  rationale: Pangalan ng lugar; tuwirang transliterasyon sa baybay na angkop sa Tagalog.
- source_word: וּסְכָכָה
  choice: at Secaca
  rationale: Isinalin ang pang-ugnay na וּ bilang “at,” at ang pangalan ng lugar ay binaybay ayon sa pagbigkas na madaling basahin sa Tagalog.
