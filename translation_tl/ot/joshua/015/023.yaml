lexical_decisions:
- source_word: קֶדֶשׁ
  choice: Kedesh
  rationale: Pangalan ng isang lugar sa talaan ng mga bayan. Tinumbasan ito sa pamamagitan ng transliterasyon; pinananatili ng “Kedesh” ang patinig ng anyong Hebreo sa talatang ito.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Pangalan ng lugar; ginamit ang karaniwang transliterasyong “Hazor” sa halip na isalin ang posibleng kahulugan ng pangalan.
- source_word: יִתְנָן
  choice: Itnan
  rationale: Pangalan ng lugar; natural sa Filipino ang “Itnan,” samantalang maaaring gamitin ang “Yitnan” sa mas mahigpit na transliterasyon ng panimulang titik na yod.
- source_word: וְ
  choice: at
  rationale: Ang mga unlaping pang-ugnay ay nagdurugtong sa mga pangalan sa isang payak na talaan; natural sa Filipino ang mga kuwit at isang “at” bago ang huling pangalan.
theological_decisions: []
translation_notes:
  register: Maikli at tuwirang talaan ng mga pangalan ng lugar. Ginamit ang mga anyong madaling basahin sa modernong Filipino habang pinananatili sa mga talababa ang makabuluhang alternatibong transliterasyon. Inilipat ang ikalawang marker sa Itnan sapagkat ang kaugnay na tala ay tumutukoy sa יִתְנָן, hindi sa Hazor.
