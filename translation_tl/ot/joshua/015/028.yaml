  text: Hazar-shual[a], Beersheba, and Bizjothjah.
translation:
  language: tl
  text: Hazar-sual, Beer-seba[a], at Bizyotya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Beer-seba ay maaaring mangahulugang “balon ng pito” at, sa paglalaro ng salita, “balon ng panunumpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: Hazar-sual
  rationale: Isinalin sa baybay na angkop sa Filipino ang pangalan ng lugar, sa halip na isalin ang kahulugang etimolohikal nitong maaaring ‘pamayanan ng soro/jackal.’
- source_word: בְּאֵר שֶׁבַע
  choice: Beer-seba
  rationale: Pinanatili bilang kilalang pangalan ng lugar at binaybay ayon sa natural na anyong Filipino. Ang posibleng paglalaro sa mga salitang ‘pito’ at ‘panunumpa’ ay inilagay sa talababa.
- source_word: בִּזְיוֹתְיָה
  choice: Bizyotya
  rationale: Hindi tiyak ang pinagmulan ng pangalan, kaya tinumbasan ito sa baybay na madaling basahin sa Filipino sa halip na bigyan ng haka-hakang salin.
- source_word: וַ / וּ
  choice: at
  rationale: Ang mga pang-ugnay na Hebreo ay nagdurugtong lamang sa mga pangalan sa talaan; natural itong ipinahayag sa Filipino sa pamamagitan ng mga kuwit at ‘at’ bago ang huling pangalan.
theological_decisions: []
translation_notes:
  register: Maikli at tuwirang talaan ng mga lugar, gamit ang makabagong baybay-Filipino sa mga pangalang Hebreo. Inilipat ang marker sa Beer-seba, ang pangalang talagang ipinaliliwanag ng talababa.
