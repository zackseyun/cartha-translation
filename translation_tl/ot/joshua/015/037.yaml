translation:
  language: tl
  text: Zenan, Hadasa, at Migdal-gad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring mas literal na isalin ang Migdal-gad bilang “Tore ni Gad,” ngunit pinanatili rito ang anyo nito bilang pangalan ng lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְנָן
  choice: Zenan
  rationale: Pangalan ito ng isang lugar sa talaan ng mga bayan ng Juda, kaya isinalin sa pamamagitan ng transliterasyon sa halip na ibigay ang posibleng kahulugan nito.
- source_word: חֲדָשָׁה
  choice: Hadasa
  rationale: Bagaman kaugnay ang anyo nito sa salitang nangangahulugang “bago,” ginagamit ito rito bilang pangalan ng lugar. Ang “Hadasa” ay likas na anyong Filipino ng transliterasyon.
- source_word: מִגְדַּל גָּד
  choice: Migdal-gad
  rationale: Tambalang pangalan ito ng lugar. Pinanatili ang pangalan sa transliterasyon dahil bahagi ito ng talaan ng mga bayan, sa halip na isaling “Tore ni Gad.”
- source_word: וַ / וּ
  choice: at
  rationale: Mga pangatnig na nag-uugnay sa mga pangalan sa talaan; sapat na ang isang likas na “at” bago ang huling pangalan sa Filipino.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na modernong Filipino, na pinananatili ang anyo ng talatang ito bilang bahagi ng talaan ng mga pangalan ng lugar. Inilagay ang panandang talababa pagkatapos ng Migdal-gad, ang pangalang tinatalakay nito.
