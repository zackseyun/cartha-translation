lexical_decisions:
- source_word: ו/ינים
  choice: at Janim
  rationale: Isinalin ang pang-ugnay na ו bilang “at” at tinumbasan ang pangalang-lugar na ינים sa anyong “Janim,” ayon sa bigkas ng tekstong Masoretiko.
- source_word: וּ/בֵית תַּפּוּחַ
  choice: at Bet-Tapua
  rationale: Isinalin ang וּ bilang “at.” Pinanatili bilang tambalang pangalang-lugar ang בֵית תַּפּוּחַ; ginamit ang “Bet” at “Tapua” bilang likas na transliterasyon sa Filipino, kasama ang gitling upang malinaw na iisang pangalan ito.
- source_word: וַ/אֲפֵקָה
  choice: at Afeka
  rationale: Isinalin ang וַ bilang “at” at tinumbasan ang אֲפֵקָה bilang “Afeka,” na pinananatili ang hulaping -ah ng Hebreo sa anyong mas natural sa ortograpiyang Filipino.
