base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/048.yaml
  text: 'In the hill country: Shamir[a], Jattir[c][b], and Socoh.'
translation:
  language: tl
  text: 'Sa kabundukan: Samir, Jatir, at Soco.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “At sa kabundukan”; iniuugnay ng panimulang “at” ang talatang ito sa nagpapatuloy na talaan ng mga bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בָ/הָר
  choice: Sa bulubundukin
  rationale: Ang parirala ay literal na ‘at sa bundok/bulubunduking lupain.’ Sa konteksto ng talaan ng mga bayan sa kabundukan ng Juda, natural at malinaw sa modernong Filipino ang ‘Sa bulubundukin.’ Hindi na isinama sa pangunahing teksto ang panimulang pangatnig dahil nagpapatuloy lamang ito sa naunang talaan.
- source_word: שָׁמִיר
  choice: Samir
  rationale: Pangalan ng lugar; itinumbas sa baybay-Filipino ang tunog ng Hebreong שָׁמִיר.
- source_word: וְ/יַתִּיר
  choice: Jatir
  rationale: Pangalan ng lugar na may prefiks na pangatnig; ang pangatnig ay likas na kinakatawan ng pagkakahanay at ng ‘at’ bago ang huling pangalan. Ang ‘Jatir’ ay madaling basahin sa Filipino at kumakatawan sa Hebreong יַתִּיר.
- source_word: וְ/שׂוֹכֹה
  choice: Soco
  rationale: Pangalan ng lugar na may prefiks na pangatnig. Ang ‘Soco’ ay baybay na madaling basahin sa Filipino para sa Hebreong שׂוֹכֹה; ang huling ה ay hindi kailangang katawanin bilang hiwalay na katinig.
theological_decisions: []
translation_notes:
  register: Maikli at dignified na heograpikong talaan sa modernong Filipino. Ginamit ang mga baybay na Samir, Jatir, at Soco ayon sa karaniwang pagbasa ng mga pangalang Hebreo sa Filipino; iniwasan ang mga baybay-Ingles na Shamir, Jattir, at Socoh.
