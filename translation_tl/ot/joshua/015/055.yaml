translation:
  language: tl
  text: Maon[a], Carmel, Zif, at Juta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang Hebreo ay binubuo lamang ng mga pangalan ng lugar sa isang talaan ng mga pamayanan: “Maon, Carmel, Zif, at Juta.”'
    reason: cultural_note
lexical_decisions:
- source_word: מָעוֹן
  choice: Maon
  rationale: Pangalan ito ng isang bayan sa talaan, kaya tinumbasan sa pamamagitan ng transliterasyon at hindi isinalin bilang karaniwang pangngalang “tirahan.”
- source_word: כַּרְמֶל
  choice: Carmel
  rationale: Pangalan ito ng bayan sa Juda; ginamit ang anyong pamilyar sa mga saling Tagalog sa halip na isalin ang posibleng kahulugan nito bilang karaniwang pangngalan.
- source_word: וָזִיף
  choice: Zif
  rationale: Ang ו ay pang-ugnay, at ang זִיף ay pangalan ng lugar. Ginamit ang “Zif,” na natural na kumakatawan sa tunog ng pangalang Hebreo sa baybay Filipino; hindi na inulit ang “at” dahil mas natural sa Tagalog na ilagay ito bago ang huling pangalan sa serye.
- source_word: וְיוּטָּה
  choice: at Juta
  rationale: Ang ו ay isinaling “at,” at ang pangalan ng lugar ay tinransliterang “Juta,” na angkop sa baybay at bigkas ng Filipino.
