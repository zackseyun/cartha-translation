  language: tl
  text: Goshen, Holon, at Giloh—labing-isang lungsod, kasama ang mga nayon ng mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹשֶׁן
  choice: Goshen
  rationale: Pangalan ng lugar; ginamit ang anyong transliterado na pamilyar sa modernong Filipino.
- source_word: חֹלֹן
  choice: Holon
  rationale: Pangalan ng lugar; tuwirang transliterasyon na malinaw at natural sa Filipino.
- source_word: גִלֹה
  choice: Giloh
  rationale: Pangalan ng lugar; pinanatili ang anyong kumakatawan sa hulaping Hebreo at kaayon ng anyong biblikal.
- source_word: עָרִים
  choice: mga lungsod
  rationale: Karaniwang salin ng terminong tumutukoy sa mga sentrong pamayanan sa mga talaan ng nasasakupan.
- source_word: אַחַת עֶשְׂרֵה
  choice: labing-isang
  rationale: Likas na anyong Filipino ng bilang na labing-isa kapag tuwirang inilalarawan ang pangngalan.
- source_word: חַצְרֵיהֶן
  choice: mga nayon ng mga ito
  rationale: Tumutukoy sa mga nakaugnay na maliliit o di-napapaderang pamayanan; ipinakikita ng “ng mga ito” ang hulaping panghalip na pambabaeng maramihan na bumabalik sa mga lungsod.
