base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: tl
  text: Ang Asdod, ang mga bayang sakop nito[a] at ang mga nayon nito; ang Gaza, ang mga bayang sakop nito at ang mga nayon nito; hanggang sa Batis ng Ehipto[b] at sa dagat[c], na siyang hangganan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mga anak na babae nito,” isang idyoma para sa maliliit o nakadependeng bayang kaugnay ng isang pangunahing lungsod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Wadi ng Ehipto.” Ang salitang Hebreo ay maaaring tumukoy sa daluyang may tubig lamang sa ilang panahon.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang Dagat Mediterranean.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: mga bayang sakop nito
  rationale: Sa mga talaan ng lupain, ang literal na “mga anak na babae nito” ay idyoma para sa maliliit o nakasandig na bayang nasa ilalim ng pangunahing lungsod. Likas at malinaw sa modernong Filipino ang “mga bayang sakop nito,” habang ipinapaliwanag sa talababa ang metapora ng Hebreo.
- source_word: חֲצֵרֶיהָ
  choice: mga nayon nito
  rationale: Sa kontekstong heograpiko, tumutukoy ito sa mas maliliit na pamayanang nasa labas ng lungsod. Naiiba nang malinaw ang “mga nayon” sa “mga bayang sakop.”
- source_word: נַחַל מִצְרָיִם
  choice: Batis ng Ehipto
  rationale: Itinuturing ang buong parirala bilang pangalan ng palatandaan sa timog na hangganan. Pamilyar at madaling maunawaan ang “Batis,” ngunit pinananatili sa talababa ang posibilidad na pana-panahong daluyan o wadi ang נַחַל.
- source_word: הַיָּם הַגָּדוֹל
  choice: Malaking Dagat
  rationale: Pinananatili ang tradisyonal na heograpikong katawagan ng Hebreo at hindi ito tahasang pinapalitan sa pangunahing teksto ng makabagong pangalang Mediterranean; nililinaw ang tinutukoy sa talababa.
- source_word: וּגְבוּל
  choice: na siyang hangganan
  rationale: Maikli at eliptikal ang pangwakas na Hebreo. Ipinahahayag ng salin na ang dagat ang nagsisilbing hangganan, nang hindi dinaragdagan ang heograpikong impormasyon.
- source_word: עַד
  choice: hanggang sa
  rationale: Ito ang likas na modernong Filipino para sa panandang nagsasaad ng abot ng isang lupain.
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: Asdod / Gaza
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, marangal, at madaling maunawaang Filipino. Pinili ang “mga bayang sakop” kaysa sa literal na “mga anak na bayan” upang maging natural, habang inilagay sa talababa ang orihinal na metapora. Pinanatili ang “Malaking Dagat” bilang katawagang biblikal at nilinaw ang modernong pangalan nito sa talababa.
