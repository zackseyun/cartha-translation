  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: tl
  text: Pinalayas[a] ni Caleb mula roon ang tatlong anak ni Anak—sina Sesai, Ahiman, at Talmai, na mga inapo ni Anak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “inagawan ng lupain.” Maaaring idiin ng pandiwang Hebreo ang pag-angkin sa lupain sa pamamagitan ng pagpapaalis sa mga dating naninirahan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Anak” at “mga ipinanganak ni Anak.” Dalawang magkaugnay na pananalitang pangkanununuan ang ginamit para sa iisang pangkat; ang ikalawa ay maaari ring mangahulugang “mga inapo ni Anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: Pinalayas
  rationale: Sa anyong Hiphil at may mga tao bilang layon, ang pandiwa ay tumutukoy sa pagpapaalis sa mga dating naninirahan at sa pagkakait sa kanila ng pag-aari. Natural sa Filipino ang “pinalayas,” habang ipinapaliwanag sa talababa ang diwa ng pag-aalis sa pagmamay-ari.
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Tuwirang katumbas na lokatibo sa natural na makabagong Filipino.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: ang tatlong anak ni Anak
  rationale: Pinananatili ang pormal na salitang “mga anak” sa Hebreo at ang Anak bilang pangalang pantangi, sa halip na agad itong gawing “mga inapo” o “mga Anakim.”
- source_word: שֵׁשַׁי
  choice: Sesai
  rationale: Transliterasyong angkop sa baybay at bigkas ng Filipino.
- source_word: אֲחִימַן
  choice: Ahiman
  rationale: Malinaw at karaniwang transliterasyon ng pangalang pantangi.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Malinaw at karaniwang transliterasyon ng pangalang pantangi.
- source_word: יְלִידֵי הָעֲנָק
  choice: mga isinilang kay Anak
  rationale: Pinananatili ang ikalawang, kaugnay ngunit naiibang pananalitang pangkanununuan sa Hebreo; mas malapit ito sa literal na “mga ipinanganak kay Anak” kaysa sa simpleng pag-uulit ng “mga anak.”
