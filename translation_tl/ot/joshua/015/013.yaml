  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: tl
  text: 'At binigyan niya si Caleb na anak ni Jefune ng isang bahagi sa gitna ng mga anak ni Juda, ayon sa utos[a] ni Yahweh kay Josue: ang Kiriat-arba (si Arba ang ama ni Anak[b]), na siyang Hebron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “ayon sa salita ni Yahweh.” Literal sa Hebreo: “ayon sa bibig ni Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “ama ni Anak” ay maaari ring mangahulugang “ninuno ni Anak” o “tagapagtatag ng lahi ni Anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב בֶּן יְפֻנֶּה
  choice: At si Caleb na anak ni Jefune
  rationale: Pinananatili ang pang-ugnay at ang ugnayang ama-anak, gamit ang karaniwang anyo ng mga pangalang biblikal sa Filipino.
- source_word: נָתַן חֵלֶק
  choice: ay binigyan niya ng bahagi
  rationale: Ipinapahayag ang pagbibigay ng nakalaang bahagi habang iniiwang hindi tahasang tinutukoy ang gumagawa, gaya sa Hebreo.
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: sa gitna ng mga anak ni Juda
  rationale: Malapit sa pormal na diwa ng 'among/in the midst of the sons of Judah' at malinaw na tumutukoy sa lipi ni Juda.
- source_word: אֶל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang idyomang literal na 'ayon sa bibig' ay likas na nangangahulugang ayon sa utos o salita; ang 'utos' ay angkop sa konteksto ng paghahati ng lupain.
- source_word: לִיהוֹשֻׁעַ
  choice: kay Josue
  rationale: Ang pang-ukol ay pinakanatural na nagpapakilala kay Josue bilang tumanggap ng utos.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiriat-arba
  rationale: Isinalin-baybay bilang pangalan ng lugar at pinanatili ang pagkakaugnay ng dalawang bahagi ng pangalan.
- source_word: אֲבִי הָעֲנָק
  choice: si Arba ang ama ni Anak
  rationale: Nililinaw ng panaklong na si Arba, hindi ang lungsod, ang tinutukoy na ama; pinananatili ng 'ama' ang malawak na salitang Hebreo.
- source_word: הִיא חֶבְרוֹן
  choice: na siyang Hebron
  rationale: Natural na pagkakakilanlan sa Filipino ng Kiriat-arba bilang Hebron.
theological_decisions:
- issue: Ang hindi tahasang paksa ng נָתַן ('nagbigay')
  choice: Pinanatiling hindi pinangalanan sa pariralang 'binigyan niya.'
  alternative: Tukuyin si Josue o si Yahweh bilang tahasang paksa.
  rationale: Walang nakasaad na paksa sa mismong sugnay na Hebreo. Ang tahasang pagbanggit kay Josue o kay Yahweh ay magpapasya sa isang bagay na iniwang di-tiyak ng teksto.
- issue: Saklaw ng אָב sa paglalarawan kay Arba
  choice: ama
  alternative: ninuno o tagapagtatag
  rationale: Ang 'ama' ang pinakadirektang katumbas, ngunit maaaring mas malawak ang kahulugan nito; pinananatili sa talababa ang tunay na leksikal na posibilidad.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang pangalang Yahweh at ang pormal na pananalitang “mga anak ni Juda,” gayundin ang hindi tahasang paksa ng pandiwang Hebreo.
