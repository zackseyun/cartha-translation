lexical_decisions:
- source_word: עֲנָב
  choice: Anab
  rationale: Pangalan ng lugar sa talaan ng mga bayan; tinumbasan sa paraang transliterasyon. Pinananatili ng “Anab” ang anyong Hebreo at malinaw itong basahin sa Filipino.
- source_word: אֶשְׁתְּמֹה
  choice: Estemo
  rationale: Pangalan ng lugar; ang “Estemo” ay likas bigkasin sa Filipino at malapit sa tunog ng anyong Hebreo. Hindi isinama ang huling he bilang hiwalay na tunog sapagkat malamang na hindi ito binibigkas.
- source_word: עָנִים
  choice: Anim
  rationale: Pangalan ng lugar na bagaman mukhang anyong maramihan sa Hebreo ay ginagamit bilang toponimo; kaya transliterasyon ang ginamit sa halip na isalin ang anyo.
- source_word: וְ
  choice: at
  rationale: Ang pang-ugnay ay nagdurugtong sa mga pangalan sa payak na talaan; ang “at” ang natural na katumbas sa Filipino.
