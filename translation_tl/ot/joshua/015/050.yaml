  register: Maikli at tuwirang talaan ng mga pangalan ng lugar, gamit ang makabago, malinaw, at marangal na Filipino. Ang baybay ay iniangkop sa karaniwang ponolohiya ng Filipino habang nananatiling malapit sa Hebreo.
