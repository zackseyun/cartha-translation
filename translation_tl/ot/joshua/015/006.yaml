  text: וְ/עָלָ֤ה הַ/גְּבוּל֙ בֵּ֣ית חָגְלָ֔ה וְ/עָבַ֕ר מִ/צְּפ֖וֹן לְ/בֵ֣ית הָעֲרָבָ֑ה וְ/עָלָ֣ה הַ/גְּב֔וּל אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: tl
  text: Pagkatapos, umahon ang hangganan patungong Bet-hogla at dumaan sa hilaga ng Bet-araba. Mula roon, umahon ang hangganan patungo sa Bato ni Bohan na anak ni Ruben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: umahon
  rationale: Sa paglalarawan ng hangganan, ipinahihiwatig ng pandiwa ang pagpapatuloy ng guhit paakyat, kaya pinananatili ng “umahon” ang topograpikong diwa.
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Tumutukoy ito sa guhit na naghihiwalay sa mga lupain; natural at tiyak sa Filipino ang “hangganan.”
- source_word: בֵּית חָגְלָה
  choice: Bet-hogla
  rationale: Isinalin sa baybay-Filipino ang transliterasyon ng pangalan ng lugar sa halip na isalin ang kahulugan nito.
- source_word: וְעָבַר מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: dumaan sa hilaga ng Bet-araba
  rationale: Ang pormulang panghangganan ay nagsasaad na nagpatuloy ang guhit sa gawing hilaga ng naturang lugar; malinaw at natural ito sa Filipino.
- source_word: אֶבֶן בֹּהַן
  choice: Bato ni Bohan
  rationale: Pinananatili ang ugnayang construct ng Hebreo habang ginagamit ang likas na anyong Filipino para sa isang palatandaang ipinangalan kay Bohan.
- source_word: בֶּן רְאוּבֵן
  choice: anak ni Ruben
  rationale: Tuwirang pinananatili ang tahasang Hebreong “anak ni Ruben” sa halip na gawing mas interpretatibong “Rubenita.”
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “Mula roon” upang maging natural ang daloy ng inuulit na pandiwang וְעָלָה nang hindi binabago ang pagkakasunod-sunod ng mga palatandaan. Walang footnote ang kailangan; ang ibinigay na English footnote ay tila hindi tumutugma sa marker nito, sapagkat ang alternatibong “Bohan’s stone” ay para sa אֶבֶן בֹּהַן at hindi sa Bet-hogla.
