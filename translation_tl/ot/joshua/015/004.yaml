base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/004.yaml
  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: tl
  text: Pagkatapos, dumaan ito sa Azmon at umabot sa Batis ng Ehipto[a]. Nagtapos sa dagat ang hangganan. Ito ang magiging hangganan ninyo sa timog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Wadi ng Ehipto.” Ang salitang Hebreo na naḥal ay madalas tumukoy sa isang pana-panahong daluyan ng tubig o wadi. Tradisyonal din ang saling “Ilog ng Ehipto,” ngunit maaaring magbigay iyon ng maling impresyon na ang Ilog Nilo ang tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Pagkatapos, dumaan ito
  rationale: Sa paglalarawan ng hangganan, ipinahihiwatig ng עבר ang pagpapatuloy ng guhit mula sa isang lugar patungo sa susunod. Likas sa Filipino ang “dumaan ito” at hindi nito ipinapalagay na may tiyak na bagay na tinawid.
- source_word: עַצְמֹנָה
  choice: Azmon
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon.
- source_word: וְיָצָא
  choice: at umabot
  rationale: Bagaman literal na “lumabas” ang יצא, sa talaan ng mga hangganan ay inilalarawan nito ang pag-abot o paglabas ng guhit sa isang patutunguhan. Mas natural sa modernong Filipino ang “umabot” sa kontekstong ito.
- source_word: נַחַל מִצְרַיִם
  choice: Batis ng Ehipto
  rationale: Ang נחל ay karaniwang tumutukoy sa batis, bangin na dinadaluyan ng tubig, o pana-panahong daluyan, hindi sa isang malaking ilog. Iniiwasan ng “Batis ng Ehipto” ang maling pag-aakalang Nilo ang tinutukoy; nililinaw sa talababa ang mas heograpikong salitang “wadi.”
- source_word: וְהָיָה תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: Nagtapos sa dagat ang hangganan
  rationale: Ang תוצאות הגבול ay tumutukoy sa hantungan o dulo ng hangganan, at ang ימה ay “patungo sa dagat.” Malinaw at natural na ipinapahayag ng salin na ang dagat ang dulo ng hangganan.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: Ito ang magiging hangganan ninyo sa timog
  rationale: Direksiyonal ang נגב rito—“timog”—sa halip na pangalang pantangi ng rehiyong Negev. Pinananatili rin ng “ninyo” ang pangmaramihang לָכֶם.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong “batis” sa pangunahing teksto, habang ipinaliwanag sa talababa ang mas tiyak ngunit hindi gaanong pamilyar na “wadi.”
