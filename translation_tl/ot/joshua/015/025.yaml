  text: and Hazor-hadattah[a], and Kerioth-hezron (that is, Hazor)[b],
translation:
  language: tl
  text: at Hazor-hadata[a], at Keriot-hezron (iyon ay Hazor)[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Posible ring: “Hazor, Hadata, at Keriot-hezron; iyon ay Hazor,” kung ituturing ang חֲדַתָּה na hiwalay na pangalan ng bayan sa halip na bahagi ng tambalang pangalang “Hazor-hadata.”'
    reason: alternative_reading
  - marker: b
    text: Ang “Keriot” ay maaari ding baybayin na “Kiriot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חָצוֹר
  choice: at Hazor
  rationale: Pangalan ng lugar ang חָצוֹר, na tinumbasan sa nakasanayang anyong Filipino na “Hazor”; ang prefiks na וְ ay “at.”
- source_word: חֲדַתָּה
  choice: -hadata
  rationale: Itinuring na ikalawang bahagi ng tambalang pangalan na “Hazor-hadata,” alinsunod sa Masoretikong paglalagay ng diin at sa konteksto ng talaan ng mga bayan. Hindi ito isinaling “bago” upang mapanatili ang gamit nito bilang bahagi ng toponimo.
- source_word: וּ/קְרִיּוֹת
  choice: at Keriot
  rationale: Sa talaan ng mga bayan, mas malamang na pangalang pantangi ang קְרִיּוֹת kaysa karaniwang pangngalang “mga bayan.” Ginamit ang “Keriot,” isang natural na transliterasyon sa Filipino.
- source_word: חֶצְרוֹן
  choice: -hezron
  rationale: Ikinabit sa naunang pangalan bilang tambalang toponimong “Keriot-hezron.”
- source_word: הִיא
  choice: iyon ay
  rationale: Dito, nagpapakilala ang panghalip ng paliwanag o pagkakakilanlan. Natural sa Filipino ang “iyon ay” at pinananatili nito ang puwersang appositional.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Pangalan ng lugar na tumutukoy o nagpapaliwanag sa naunang tambalang pangalan; pinanatiling pareho ang transliterasyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Isinalin ang pang-ugnay na וְ bilang “at,” habang isina-Filipino ang transliterasyon ng mga pangalan sa halip na sundin ang anyong Ingles. Pinanatili sa talababa ang tunay na kalabuan kung hiwalay na bayan ang Hadata.
