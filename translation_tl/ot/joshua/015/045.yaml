  footnotes:
  - marker: a
    text: Literal, “at ang mga anak na babae nito at ang mga nayon nito.” Dito, ang “mga anak na babae” ay idyomang Hebreo para sa mga bayang nakadepende o nasasakupan ng isang mas malaking lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶקְרוֹן
  choice: Ekron
  rationale: Pangalan ng lugar; tinumbasan sa karaniwang transliterasyong Filipino sa halip na isalin.
- source_word: וּבְנֹתֶיהָ
  choice: kasama ang mga bayang sakop nito
  rationale: Ang literal na “mga anak na babae nito” ay isang idyomang Hebreo para sa maliliit na bayang nakadepende o nasasakupan ng isang pangunahing lungsod. Nililinaw ng “mga bayang sakop nito” ang ugnayang iyon sa natural na Filipino.
- source_word: וַחֲצֵרֶיהָ
  choice: at ang mga nayon nito
  rationale: Sa talaan ng mga lupaing hinati-hati, tumutukoy ang חֲצֵרִים sa mas maliliit na pamayanan o nayon. Ang “mga nayon” ang malinaw at likas na katumbas sa modernong Filipino.
