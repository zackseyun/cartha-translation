  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: tl
  text: at Maarat, at Bet-anot, at Eltekon—anim na lungsod[b], kasama ang mga nayon ng mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ang maliliit na pamayanan ng mga ito.” Ang salitang Hebreo ay tumutukoy sa mga pamayanang kaugnay ng nakalistang mga lungsod.
    reason: lexical_alternative
  - marker: b
    text: Tatlong pangalan lamang ng lungsod ang nakalista sa tekstong Hebreo ng talatang ito, bagaman anim ang ibinigay na kabuuang bilang.
    reason: textual_issue
lexical_decisions:
- source_word: וּ/מַעֲרָת
  choice: at Maarat
  rationale: Pangalan ng lugar; isinalin sa baybay na madaling basahin sa Filipino. Pinanatili ang pang-ugnay na ו bilang “at.”
- source_word: וּ/בֵית עֲנוֹת
  choice: Bet-anot
  rationale: Tambalang pangalan ng lugar; tinumbasan sa transliterasyong Filipino at ginamitan ng gitling upang malinaw na iisang pangalan ito. Hindi na inulit ang “at” para sa mas natural na daloy ng talaan sa Filipino.
- source_word: וְ/אֶלְתְּקֹן
  choice: at Eltekon
  rationale: Pangalan ng lugar; isinalin sa baybay na madaling basahin sa Filipino, kasama ang pang-ugnay na “at.”
- source_word: עָרִים
  choice: mga lungsod
  rationale: Karaniwang tawag sa mga pangunahing pamayanan sa mga talaan ng nasasakupan; pinananatili rin nito ang nakasanayang biblikal na gamit, bagaman maaari ring sabihing “mga bayan.”
- source_word: שֵׁשׁ
  choice: anim
  rationale: Tuwirang salin ng bilang na tumutukoy sa mga lungsod.
- source_word: וְ/חַצְרֵי/הֶן
  choice: kasama ang mga nayon ng mga ito
  rationale: Sa ganitong talaan ng mga lupain, ang חָצֵר ay tumutukoy sa mas maliliit at nakaugnay na pamayanang nasa paligid o nasasakupan ng mga lungsod, hindi sa literal na mga bakuran.
