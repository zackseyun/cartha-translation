lexical_decisions:
- source_word: יִפְתָּח
  choice: Ifta
  rationale: Pangalan ng isang bayan sa talaan; tinumbasan sa anyong madaling bigkasin sa modernong Filipino habang malapit sa tunog ng Hebreo.
- source_word: אַשְׁנָה
  choice: Asna
  rationale: Pangalan ng lugar; isinalin sa karaniwang baybay-Filipino, na hindi gumagamit ng “sh” para sa tunog na /ʃ/.
- source_word: נְצִיב
  choice: Nezib
  rationale: Pangalan ng lugar; pinanatili ang anyong transliterado. Ang katinig na צ ay maaari ring katawanin nang mas mahigpit bilang “ts,” gaya ng nasa talababa.
- source_word: וְ
  choice: at
  rationale: Ang panlaping pang-ugnay ay nagdurugtong sa mga bayan sa nagpapatuloy na talaan; pinanatili ang “at” sa una at huling pangalan para maging natural sa Filipino nang hindi nawawala ang seryal na kayarian.
