  text: 'and Shaaraim[a], and Adithaim, and Gederah, and Gederothaim: fourteen cities with their villages.'
translation:
  language: tl
  text: at Shaaraim[a], Aditaim, Gedera, at Gederotaim—labing-apat na lungsod kasama ang mga nayon nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Napapansin ng ilang tagapagpaliwanag na ang apat na pangalan ng lugar na nakatala sa talatang ito ay hindi mukhang bumubuo sa sinabing “labing-apat na lungsod.” Maaaring may kaugnayan dito ang tekstuwal na kasaysayan ng mas malawak na bahaging ito, ngunit isinalin dito ang tekstong Hebreo ayon sa pagkakatala nito.
    reason: textual_variant
lexical_decisions:
- source_word: שַׁעֲרַיִם
  choice: Shaaraim
  rationale: Pangalan ng lugar; tinumbasan sa pamamagitan ng transliterasyon at pinanatili ang anyong malapit sa Hebreo.
- source_word: עֲדִיתַיִם
  choice: Aditaim
  rationale: Pangalan ng lugar; ginamit ang payak at likas na transliterasyong Filipino.
- source_word: הַגְּדֵרָה
  choice: Gedera
  rationale: Pangalan ng lugar. Hindi hiwalay na isinalin ang pantukoy na Hebreo dahil bahagi ito ng gamit ng toponimo at hindi likas ang paglalagay ng “ang” sa mismong pangalan sa Filipino.
- source_word: גְדֵרֹתָיִם
  choice: Gederotaim
  rationale: Pangalan ng lugar; ginamit ang transliterasyong madaling basahin sa Filipino.
- source_word: עָרִים
  choice: mga lungsod
  rationale: Karaniwang katumbas ng עִיר sa mga talaan ng teritoryo at angkop sa administratibong diwa ng mga pamayanan.
- source_word: אַרְבַּע עֶשְׂרֵה
  choice: labing-apat
  rationale: Likas na anyo ng bilang sa Filipino.
- source_word: חַצְרֵיהֶן
  choice: mga nayon ng mga ito
  rationale: Tumutukoy sa mas maliliit o di-napapaderang pamayanang nakaugnay sa mga lungsod; malinaw at natural ang “mga nayon.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatiling transliterado ang mga pangalan ng lugar, at ginamit ang “kasama ang” upang natural na ipahayag ang ugnayan ng mga lungsod at ng mga nakapailalim na nayon.
