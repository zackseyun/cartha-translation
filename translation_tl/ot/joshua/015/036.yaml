    issue: May idinagdag na "ang" bago ng Shaaraim.
    rationale: Walang pantukoy na katapat nito sa unang pangalan sa Hebreo; ang "at" lamang ay mas tapat at mas likas para sa isang listahan.
  - severity: low
    issue: Medyo di-matatag ang pananalita ng talababa tungkol sa "kasaysayan ng pagkakahalin ng teksto."
    rationale: Ang tinutukoy ng audit trail ay ang tekstuwal na kasaysayan ng mas malaking seksiyon, hindi ang kasaysayan ng pagsasalin. Nilinaw ito nang hindi nagmumungkahi ng tiyak na solusyon sa discrepancy.
