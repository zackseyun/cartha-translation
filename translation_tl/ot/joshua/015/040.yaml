  text: Kabbon, Lahmas, at Kitlish.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַבּוֹן
  choice: Kabbon
  rationale: Pangalan ito ng isang bayan sa talaan. Isinatinig ito ayon sa mga katinig at patinig ng Hebreo; ang K ay likas at malinaw sa makabagong baybay sa Filipino.
- source_word: לַחְמָס
  choice: Lahmas
  rationale: Pangalan ito ng isang lugar at hindi isinalin ang kahulugan. Ginamit ang Lahmas bilang payak at madaling basahing anyo sa Filipino; hindi na minarkahan nang bukod ang guttural na ח.
- source_word: כִתְלִישׁ
  choice: Kitlish
  rationale: Pangalan ito ng isang lugar. Ang Kitlish ay tuwirang pagsasatinig na angkop sa baybay at bigkas sa Filipino; hindi kailangan ang mga alternatibong Ingles na gumagamit ng C o Ch.
- source_word: וְ
  choice: at
  rationale: Ang inuulit na pang-ugnay sa Hebreo ay nagdurugtong sa mga pangalan. Sa likas na Filipino, sapat ang mga kuwit at ang panghuling “at” sa payak na talaan.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at likas na Filipino para sa isang talaan ng mga pangalan ng lugar. Pinanatili ang mga pangalang pantangi sa paraang madaling basahin ng karaniwang mambabasa, nang walang mga talababa para sa mga alternatibong baybay na nakabatay lamang sa lumang kaugaliang Ingles.
