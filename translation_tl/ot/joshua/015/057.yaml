  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili nito ang tatlong pangalan ng lugar, ang pormulang “sampung lunsod,” at ang kahulugang ang חַצְרֵיהֶן ay mga nakadependeng pamayanang kaugnay ng mga lunsod. Hindi nito sinusubukang ipaliwanag o ayusin ang hindi pagtutugma ng bilang sa talata at ng mga pangalang nakalista, kaya napapanatili ang anyo ng pinagmulan.'
