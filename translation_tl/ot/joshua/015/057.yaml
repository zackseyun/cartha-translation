  text: הַ/קַּ֖יִן גִּבְעָ֣ה וְ/תִמְנָ֑ה עָרִ֥ים עֶ֖שֶׂר וְ/חַצְרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/057.yaml
  text: 'Hak-kain[a], Gibeah, and Timnah: ten cities with their settlements.'
translation:
  language: tl
  text: Hakain, Gibea, at Timna—sampung lunsod kasama ang mga pamayanang sakop ng mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ang kanilang mga nayon.” Ang salitang Hebreo ay tumutukoy sa mas maliliit na pamayanang kaugnay at sakop ng mga binanggit na lunsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקַּיִן
  choice: Hakain
  rationale: Pangalan ito ng lugar. Pinanatili sa transliterasyon ang pantukoy na nakadikit sa pangalang Hebreo, alinsunod sa anyong Hak-kain, ngunit ginawang mas natural sa ortograpiyang Filipino.
- source_word: גִּבְעָה
  choice: Gibea
  rationale: Pangalan ito ng lugar sa talaan ng mga lunsod, kaya isinalin sa pamamagitan ng transliterasyon at hindi bilang karaniwang pangngalang “burol.”
- source_word: תִמְנָה
  choice: Timna
  rationale: Pangalan ito ng lugar; ang Timna ay malinaw at natural na transliterasyon sa Filipino.
- source_word: עָרִים עֶשֶׂר
  choice: sampung lunsod
  rationale: Tuwirang inilalahad ng Hebreo ang kabuuang bilang ng mga lunsod sa karaniwang pormula ng mga talaang panteritoryo.
- source_word: חַצְרֵיהֶן
  choice: mga pamayanang sakop ng mga ito
  rationale: Tumutukoy ang חָצֵר dito sa mas maliliit at umaasang pamayanan na kaugnay ng mga binanggit na lunsod. Ipinahihiwatig ng “sakop” ang ugnayang iyon nang hindi labis na tinutukoy ang laki o pagkakakuta ng mga pamayanan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na tuwiran at marangal. Ginamit ang mga anyong pangalang angkop sa baybay Filipino at pinanatili ang maikling estilo ng talaan. Ang panghalip na “mga ito” ay umiiwas sa di-natural na kasariang gramatikal at malinaw na tumutukoy sa mga lunsod.
