  text: This was the inheritance of the tribe of the sons of Judah according to their clans[a].
translation:
  language: tl
  text: Ito ang mana ng lipi ng mga anak ni Juda ayon sa kani-kanilang angkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ito ang mana ng lipi ng mga anak ni Juda ayon sa kanilang mga angkan.”
    reason: Pinananatili ng alternatibo ang distributibong diwa ng לְמִשְׁפְּחֹתָם nang hindi nagdaragdag ng pandiwang “hinati” na wala sa pinagmulan.
lexical_decisions:
- source_word: זֹאת
  choice: Ito ang
  rationale: Ang demonstratibong pambabae na isahan ay tumutukoy sa lupaing kababanggit lamang. Walang tahasang pandiwang panaguri sa Hebreo, kaya likas sa Tagalog ang “Ito ang”; hindi nito kailangang pagpasiyahan kung “ito ay” o “ito noon.”
- source_word: נַחֲלַת
  choice: mana
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa lupaing minana o itinakdang ari-arian. Pinananatili ng “mana” ang ugnayang tipan at pagmamana nang mas maikli at natural kaysa “minanang pag-aari.”
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa tribo, hindi sa literal na tungkod. Ang “lipi” ay dignified at karaniwang katawagan sa Tagalog para sa isang tribo ng Israel.
- source_word: בְנֵי יְהוּדָה
  choice: ng mga anak ni Juda
  rationale: Pinananatili nito ang literal at mahalagang pananalitang pangangkan na “mga anak ni Juda,” sa halip na paikliin lamang bilang “Juda” o gawing “mga mamamayan ng Juda.”
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחָה rito ay mga pangkat ng magkakamag-anak sa loob ng lipi. Ipinahahayag ng “kani-kanilang” ang distributibong diwa ng prefiks na לְ, samantalang mas tiyak ang “angkan” kaysa “pamilya.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lipi” at “angkan” upang maipakita ang dalawang antas ng organisasyong pangangkan. Ang walang-pandiwang sugnay na Hebreo ay isinalin bilang “Ito ang,” na natural sa Tagalog at nagpapanatili sa posibleng kasalukuyan o pansalaysay na pagbasa.
