base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/044.yaml
  text: 'Keilah[a], Achzib, and Mareshah: nine cities with their villages.'
translation:
  language: tl
  text: Keila, Aczib, at Maresa—siyam na lungsod kasama ang kanilang mga nayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang mga pamayanan.” Ang salitang Hebreo ay maaaring tumukoy sa mga nakadependeng pamayanang rural na kaugnay ng isang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְעִילָה
  choice: Keila
  rationale: Pangalan ng lugar; ginamit ang anyong madaling basahin at bigkasin sa modernong Filipino.
- source_word: אַכְזִיב
  choice: Aczib
  rationale: Pangalan ng lugar; tinumbasan sa anyong transliterasyong Filipino habang pinananatili ang pagkakakilanlan ng pangalang Hebreo.
- source_word: מָרֵאשָׁה
  choice: Maresa
  rationale: Pangalan ng lugar; ginamit ang natural na anyong Filipino ng transliterasyon.
- source_word: עָרִים
  choice: mga lungsod
  rationale: Karaniwang katawagan sa mga sentrong pamayanan sa mga talaan ng teritoryo; pinananatili ang administratibong diwa ng Hebreo.
- source_word: תֵּשַׁע
  choice: siyam
  rationale: Tuwirang salin ng bilang na tumutukoy sa kabuuang mga lungsod.
- source_word: חַצְרֵיהֶן
  choice: mga nayon ng mga ito
  rationale: Tumutukoy sa mga nakaugnay at karaniwang di-napapaderang pamayanang rural na nasasakupan ng mga lungsod; natural sa Filipino ang “mga nayon.”
- source_word: וְ
  choice: at / kasama ang
  rationale: Ang mga pang-ugnay na Hebreo ay isinalin ayon sa natural na daloy ng listahan at sa ugnayan ng mga lungsod sa kanilang mga nayon.
