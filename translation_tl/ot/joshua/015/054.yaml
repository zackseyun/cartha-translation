base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: tl
  text: Humta, Kiriat-arba (na siyang Hebron)[a], at Zior—siyam na lungsod kasama ang mga pamayanan ng mga lungsod na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “Kiriat-arba, siya ang Hebron” ay kumikilala sa Kiriat-arba bilang Hebron.
    reason: cross_reference
  - marker: b
    text: O “mga nayon ng mga ito.” Ang salitang Hebreo ay maaaring tumukoy sa mas maliliit na pamayanang nakaugnay sa mga nakalistang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: Humta
  rationale: Pangalan ng lugar; isinatitik ayon sa likas na bigkas at baybay sa modernong Filipino.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiriat-arba
  rationale: Pinanatili bilang tambalang pangalan ng lugar sa halip na isaling 'Lungsod ni Arba,' sapagkat pangalan mismo ang gamit nito sa talaan.
- source_word: הִיא חֶבְרוֹן
  choice: na siyang Hebron
  rationale: Likas na pariralang Filipino na pinananatili ang tuwirang pagkakakilanlan ng Kiriat-arba bilang Hebron.
- source_word: צִיעֹר
  choice: Zior
  rationale: Pangalan ng lugar; transliterasyon na malinaw at madaling basahin sa Filipino.
- source_word: עָרִים תֵּשַׁע
  choice: siyam na lungsod
  rationale: Tuwirang salin ng bilang at pangngalan; ang 'lungsod' ay angkop sa ganitong talaan ng mga nasasakupang lugar.
- source_word: חַצְרֵיהֶן
  choice: mga pamayanan ng mga ito
  rationale: Sinasaklaw ng 'mga pamayanan' ang maliliit at nakaugnay na tirahan nang hindi labis na tinutukoy kung nayon, purok, o pamayanang walang pader.
