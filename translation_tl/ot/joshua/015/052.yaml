  footnotes:
  - marker: a
    text: 'Tatlong pangalan ng lugar sa bulubunduking lupain ng Juda ang nasa Hebreo: Arab, Ruma, at Esan. Sa ilang salin, ang huling pangalan ay binabaybay na “Esean.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרַב
  choice: Arab
  rationale: Pangalan ito ng isang bayan sa bulubunduking lupain ng Juda, kaya isinalin sa pamamagitan ng tuwirang transliterasyon sa makabagong baybay-Filipino.
- source_word: וְ/רוּמָה
  choice: at Ruma
  rationale: Ang וְ ay isinaling “at,” at ang pangalang רוּמָה ay tinumbasan ng “Ruma,” na malapit sa bigkas ng Hebreo at natural sa ortograpiyang Filipino.
- source_word: וְ/אֶשְׁעָן
  choice: at Esan
  rationale: Ang וְ ay isinaling “at.” Ang אֶשְׁעָן ay tinransliterang “Esan”; ang titik שׁ ay kinakatawan ng “s” ayon sa karaniwang baybay-Filipino, sa halip na ng anyong Ingles na “sh.”
