base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/062.yaml
  text: 'and Nibshan[a], the City of Salt, and En-gedi: six cities with their settlements.'
translation:
  language: tl
  text: at ang Nibshan, ang Lungsod ng Asin, at ang En-gedi—anim na lungsod kasama ang mga pamayanan nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama ang kanilang mga nayon.” Ang salitang Hebreo ay maaaring tumukoy sa mas maliliit na pamayanang kaugnay ng mga nakalistang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: Nibshan
  rationale: Pangalan ng lugar; tinumbasan sa transliterasyon at hindi isinama ang pantukoy na Hebreo bilang bahagi ng pangalan.
- source_word: עִיר הַמֶּלַח
  choice: ang Lungsod ng Asin
  rationale: Isinalin ang malinaw na kahulugan ng pariralang pantukoy sa lugar, sa natural at marangal na Filipino.
- source_word: עֵין גֶּדִי
  choice: En-gedi
  rationale: Kinilalang pangalan ng lugar; pinanatili sa transliterasyon sa halip na isalin ang mga sangkap nitong nangangahulugang bukal at batang kambing.
- source_word: עָרִים שֵׁשׁ
  choice: anim na lungsod
  rationale: Tuwirang buod ng bilang ng mga nakalistang lugar; pinanatili ang karaniwang salin ng עָרִים sa mga talaang panteritoryo.
- source_word: חַצְרֵיהֶן
  choice: mga pamayanang sakop ng mga ito
  rationale: Ipinahihiwatig ng salita ang maliliit o di-napapaderang pamayanang kaugnay at nakadepende sa mga pangunahing lungsod; malinaw na ipinapakita ng 'sakop' ang ugnayang iyon.
- source_word: וְ
  choice: at / kasama
  rationale: Pinanatili ang pagkakaugnay ng mga pangalan sa talaan; ginamit ang 'kasama' sa pangwakas na buod upang maging natural sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na natural at marangal. Pinanatili ang anyo ng nagpapatuloy na talaan sa pambungad na “at,” at gumamit ng gitling sa En-gedi ayon sa ibinigay na anyo ng pangalan.
