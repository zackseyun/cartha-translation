  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
translation:
  language: tl
  text: Gederot, Bet-Dagon[a], Naama, at Makeda—labing-anim na lunsod kasama ang mga nayon ng mga lunsod na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bet-Dagon ay literal na nangangahulugang “bahay ni Dagon,” ngunit dito ay pangalan ito ng lugar kaya pinanatili ito sa transliteradong anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: Gederot
  rationale: Pangalan ng lugar na may panandang pang-ugnay; tinumbasan sa transliterasyong angkop sa Filipino.
- source_word: בֵּית דָּגוֹן
  choice: Bet-Dagon
  rationale: Tambalang pangalan ng lugar na literal na nangangahulugang “bahay ni Dagon”; pinanatili bilang transliteradong toponimo.
- source_word: וְ/נַעֲמָה
  choice: Naama
  rationale: Pangalan ng lugar; ginamit ang payak na transliterasyong madaling basahin sa Filipino.
- source_word: וּ/מַקֵּדָה
  choice: Makeda
  rationale: Pangalan ng lugar; ginamit ang transliterasyong angkop sa Filipino.
- source_word: עָרִים
  choice: mga lunsod
  rationale: Sa talaan ng mga nasasakupan, tumutukoy ito sa mga sentrong may naninirahang pamayanan; “mga lunsod” ang karaniwan at angkop na salin.
- source_word: שֵׁשׁ עֶשְׂרֵה
  choice: labing-anim
  rationale: Tuwirang bilang na naglalarawan sa mga lunsod.
- source_word: וְ/חַצְרֵיהֶן
  choice: kasama ang mga nayon ng mga iyon
  rationale: Tumutukoy sa mga nakaugnay at nakabababang pamayanang rural; natural na katumbas sa Filipino ang “mga nayon.” Ginamit ang “ng mga iyon” upang sundan ang pambabaeng maramihang panghalip sa Hebreo na tumutukoy sa mga lunsod.
