  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “asawa niya” upang maging natural at malinaw ang panlalaking panghalip sa konteksto, habang pinanatili sa talababa ang lawak ng kahulugan ng pangunahing mga idyoma at pandiwa.
