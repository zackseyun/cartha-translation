  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: tl
  text: Nang dumating si Acsa, hinimok niya ang kanyang asawa[a] na humingi ng bukid sa kanyang ama. Pagkatapos, bumaba siya mula sa asno[b]. Sinabi ni Caleb sa kanya, “Ano ang gusto mo?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinikayat” o, sa mas negatibong diwa, “sinulsulan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bigla siyang bumaba mula sa asno”; maaaring magpahiwatig ng biglaan o mariing pagbaba ang pandiwang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Literal sa Hebreo, “Ano ang nasa iyo?” Ibig sabihin, “Ano ang gusto mo?” o “Ano ang bumabagabag sa iyo?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: Nang dumating siya
  rationale: Ang ב prefixed sa infinitive construct, kasama ang hulaping 3fs, ay bumubuo ng temporal na sugnay. Hindi tinutukoy sa Hebreo ang eksaktong destinasyon, kaya hindi ito idinagdag.
- source_word: וַתְּסִיתֵהוּ
  choice: hinimok niya ang asawa niya
  rationale: Ang סות ay maaaring mangahulugang humimok, manghikayat, o manulsol. Ang “hinimok” ay natural sa konteksto at hindi nagpapataw ng tiyak na negatibong diwa. Nilinaw ang panlalaking panghalip bilang asawa niya batay sa agarang konteksto.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: na humingi ng bukid sa kanyang ama
  rationale: Ipinapahayag nang natural sa Tagalog ang שאל ... מאת bilang paghingi ng isang bagay sa isang tao. Ang שָׂדֶה ay tuwirang isinaling “bukid,” bagaman maaari rin itong tumukoy sa isang bahagi ng lupain.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: bumaba siya mula sa asno
  rationale: Sa salaysay, ipinahihiwatig ng צנח ang pagbaba mula sa sinasakyang asno; maaaring may biglaan o mariing himig, ngunit hindi iyon pinalabis sa pangunahing teksto.
- source_word: מַה לָּךְ
  choice: Ano ang gusto mo?
  rationale: Ang literal na idyomang “Ano ang nasa iyo?” ay nagtatanong kung ano ang nais o ikinababahala niya. Sa konteksto ng nalalapit na kahilingan, “Ano ang gusto mo?” ang malinaw at likas na salin.
