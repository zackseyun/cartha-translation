  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Baala” ang mababasa sa tekstong Masoretiko. “Bala” ang nasa ilang salin, marahil dahil iniayon iyon sa magkaugnay na mga talaan ng mga bayan.
    reason: alternative_reading
  - marker: b
    text: Maaaring kaugnay ang pangalang “Iyim” sa salitang Hebreo para sa “mga guho” o “mga bunton,” ngunit pangalan ito ng lugar sa kontekstong ito kaya hindi isinalin ang kahulugan nito.
    reason: lexical_alternative
  - marker: c
    text: Ang “Atsem” ay sumusunod sa patinig at sa katinig na ts ng Hebreo sa talatang ito. Matatagpuan din sa ibang tradisyon ng pagsasalin ang mga baybay na “Ezem” at “Azem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָה
  choice: Baala
  rationale: Pangalan ito ng isang bayan. Isinulat ito ayon sa bigkas ng tekstong Masoretiko; hindi na nilagyan ng h sa hulihan sapagkat ang panghuling ה ay pananda ng patinig at hindi binibigkas na katinig.
- source_word: עִיִּים
  choice: Iyim
  rationale: Sa talaang ito, pangalan ito ng isang lugar kaya tinumbasan sa pamamagitan ng transliterasyon, hindi isinalin ayon sa posibleng kahulugang ‘mga guho’ o ‘mga bunton.’ Ang ‘Iyim’ ay natural basahin sa Filipino at kumakatawan sa tunog ng Hebreo.
- source_word: עָצֶם
  choice: Asem
  rationale: Pangalan ito ng isang bayan. Ang ‘Asem’ ay malapit sa patinig at katinig ng Hebreong ʿāṣem sa paraang malinaw sa karaniwang mambabasang Filipino; hindi kinakatawan sa karaniwang baybay ang panimulang guttural na ע.
- source_word: וְ / וָ
  choice: at
  rationale: Ang mga unlaping pang-ugnay ay nagdurugtong sa mga pangalan sa isang simpleng talaan; ‘at’ ang likas na katumbas sa Filipino.
