  text: 'In the lowland: Eshtaol[a], Zorah, and Ashnah.'
translation:
  language: tl
  text: 'Sa mababang lupain[a]: Estaol, Zora, at Asna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sa Shepela,” ang rehiyon ng mga paanan ng burol sa Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁפֵלָה
  choice: Sa mababang lupain
  rationale: Tumutukoy ang salita sa heograpikong rehiyon ng mga paanan ng burol at mababang lupain ng Juda. Malinaw sa karaniwang mambabasa ang saling ito, habang inilalagay sa talababa ang pangalang transliterado.
- source_word: אֶשְׁתָּאֹל
  choice: Estaol
  rationale: Pangalan ng lugar; isina-Filipino ang transliterasyon ayon sa bigkas ng Hebreo.
- source_word: וְצָרְעָה
  choice: Zora
  rationale: Pangalan ng lugar; pinanatili ang tunog na malapit sa Hebreo sa isang anyong madaling basahin sa Filipino. Ang pang-ugnay na וְ ay likas na kinakatawan ng kuwit sa talaan.
- source_word: וְאַשְׁנָה
  choice: at Asna
  rationale: Pangalan ng lugar; isina-Filipino ang transliterasyon, at tahasang isinalin ang pang-ugnay na וְ bilang “at” sa huling pangalan sa talaan.
