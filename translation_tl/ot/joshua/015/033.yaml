  register: Maikli at dignified ang anyo, na angkop sa talaan ng mga bayan. Ginamit ang pangkaraniwang “mababang lupain” sa pangunahing teksto at pinanatili sa talababa ang transliterasyong “Shepela” bilang pangalan ng rehiyon.
