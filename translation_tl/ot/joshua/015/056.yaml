  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isa lamang itong payak na talaan ng mga pangalan ng bayan sa pamanang lupain ng Juda.
    reason: cultural_note
lexical_decisions:
- source_word: יִזְרְעֶאל
  choice: Jezreel
  rationale: Pangalan ng isang bayan sa listahan; ginamit ang nakaugaliang anyong Filipino na batay sa tradisyunal na transliterasyon sa halip na isalin ang kahulugan.
- source_word: יָקְדְעָם
  choice: Jokdeam
  rationale: Pangalan ng isang bayan; pinanatili bilang transliterasyon, gamit ang anyong madaling basahin sa Filipino.
- source_word: זָנוֹחַ
  choice: Zanoa
  rationale: Pangalan ng isang bayan; ginamit ang nakaugaliang anyong Filipino na “Zanoa,” na natural bigkasin at kumakatawan sa Hebreong pangalan.
- source_word: וְ
  choice: at
  rationale: Ang prefiks na pang-ugnay ay nagdurugtong sa mga pangalan; natural sa Filipino ang mga kuwit at ang panghuling “at” sa isang payak na talaan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na maikli at marangal, angkop sa isang talaan ng mga lugar. Pinanatili ang mga pangalan bilang mga transliteradong pantangi at inilagay ang kinakailangang panandang talababa sa pangunahing teksto.
