- source_word: חַלְחוּל
  choice: Halhul
  rationale: Pangalan ito ng isang lugar sa kaburulan ng Juda, kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin ang kahulugan.
- source_word: בֵּית צוּר
  choice: Bet-zur
  rationale: Tambalang pangalan ito ng lugar. Ginamit ang anyong “Bet-zur,” na malapit sa bigkas ng Hebreo at may gitling upang ipakita ang pagkakabuo ng pangalan.
- source_word: וּגְדוֹר
  choice: at Gedor
  rationale: Isinalin ang pang-ugnay na וּ bilang “at” upang mapanatili ang ayos ng talaan, at nilapatan ng transliterasyon ang pangalang גְדוֹר bilang “Gedor.”
