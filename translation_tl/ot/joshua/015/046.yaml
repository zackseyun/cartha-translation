base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/046.yaml
  text: from Ekron westward, all that is beside Ashdod, and their villages.
translation:
  language: tl
  text: mula sa Ekron pakanluran, pati ang lahat ng nasa tabi ng Ashdod at ang mga nayon ng mga iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָיָמָּה
  choice: pakanluran
  rationale: Ang literal na direksiyon ay “patungo sa dagat,” ngunit sa heograpiya ng lupain ito ang karaniwang pananalita para sa kanluran.
- source_word: עַל יַד אַשְׁדּוֹד
  choice: nasa tabi ng Ashdod
  rationale: Pinananatili ang spatial na diwa ng idyomang “sa kamay/tagiliran ng Ashdod” nang hindi ito ginagawang mas tiyak kaysa sa Hebreo.
- source_word: וְחַצְרֵיהֶן
  choice: at ang mga nayon ng mga iyon
  rationale: Ang חֲצֵרִים sa mga talaan ng lupain ay tumutukoy sa maliliit na pamayanan o nayong nakaugnay sa mga nabanggit na lugar; ang pangmaramihang hulaping pambabae ay pinanatili sa “mga iyon” upang hindi tahasang tukuyin ang antecedent.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na maikli at angkop sa anyo ng talaan ng mga lugar. Ginamit ang “pakanluran” bilang likas na katumbas ng direksiyong Hebreo at “mga iyon” upang mapanatili ang bahagyang kalabuan ng pangmaramihang reperensiya.
