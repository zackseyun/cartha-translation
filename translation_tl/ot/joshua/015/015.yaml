  text: From there he went up against the inhabitants of Debir[a]. (Formerly the name of Debir was Kiriath-sepher.)
translation:
  language: tl
  text: Mula roon ay umakyat siya laban sa mga naninirahan sa Debir[a]. (Ang dating pangalan ng Debir ay Kiriat-sefer.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kiriat-sefer ay maaaring mangahulugang “Lungsod ng Aklat” o “Lungsod ng Pagsulat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon siya laban sa
  rationale: Pinananatili ng “umahon” ang literal na larawan ng pag-akyat, samantalang ipinahihiwatig ng “laban sa” ang pagsulong na militar ayon sa konteksto.
- source_word: מִשָּׁם
  choice: Mula roon
  rationale: Likas at maikling katumbas ng pang-abay na tumutukoy sa paggalaw mula sa naunang lugar.
- source_word: אֶל יֹשְׁבֵי דְּבִר
  choice: laban sa mga naninirahan sa Debir
  rationale: Ang יֹשְׁבֵי ay tumutukoy sa mga naninirahan; sa kontekstong militar, ang אֶל ay likas na naipahahayag bilang “laban sa.”
- source_word: דְּבִר
  choice: Debir
  rationale: Pangalan ng lugar, kaya isinalin sa pamamagitan ng transliterasyon.
- source_word: וְשֵׁם דְּבִר לְפָנִים
  choice: Ang dating pangalan ng Debir ay
  rationale: Ipinahahayag nang natural sa modernong Tagalog ang temporal na kahulugan ng לְפָנִים, “noong una” o “dati.”
- source_word: קִרְיַת סֵפֶר
  choice: Kiriat-sefer
  rationale: Pinanatili bilang transliteradong pangalan ng lugar; inilagay sa talababa ang posibleng kahulugan ng mga sangkap nito.
