base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/032.yaml
  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
translation:
  language: tl
  text: Lebaot, Silhim, Ain, at Rimon—dalawampu't siyam na lunsod lahat, kasama ang mga nayon ng mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “mga nayon ng mga ito” ay maaari ring isaling “mga pamayanan ng mga ito” o “maliliit na pamayanan ng mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: Lebaot
  rationale: Pangalan ng isang lugar sa talaan ng mga lunsod; isinalin sa anyong transliterasyon na angkop sa modernong Filipino.
- source_word: וְשִׁלְחִים
  choice: Silhim
  rationale: Pangalan ng lugar; ginamit ang payak na transliterasyong Filipino.
- source_word: וְעַיִן
  choice: Ain
  rationale: Sa kontekstong ito, pangalan ito ng lugar at hindi karaniwang pangngalang nangangahulugang “mata” o “bukal.”
- source_word: וְרִמּוֹן
  choice: Rimon
  rationale: Pangalan ng lugar sa talaan; hindi isinalin ayon sa karaniwang kahulugan nitong “granada.”
- source_word: כָּל עָרִים
  choice: na lunsod lahat
  rationale: Likas na buod sa Filipino ng kabuuang bilang ng mga nakatalang lunsod.
- source_word: עֶשְׂרִים וָתֵשַׁע
  choice: dalawampu't siyam
  rationale: Tuwirang salin ng bilang na dalawampu't siyam.
- source_word: וְחַצְרֵיהֶן
  choice: kasama ang mga nayon ng mga ito
  rationale: Ang חָצֵר sa mga talaang panteritoryo ay tumutukoy sa mga nakaugnay o nasasakupang nayon, pamayanan, o maliliit na pamayanan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang mga pangalan bilang transliterasyon at ginamit ang maikling estruktura ng isang talaan. Inilagay ang pananda ng talababa sa pariralang tinutukoy nito.
