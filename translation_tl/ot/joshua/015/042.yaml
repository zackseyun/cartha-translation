- source_word: לִבְנָה
  choice: Libna
  rationale: Pangalan ito ng isang bayan sa talaan; tinumbasan sa karaniwang anyong Filipino nang hindi isinasalin ang posibleng kahulugang leksikal.
- source_word: וָ/עֶתֶר
  choice: Eter
  rationale: Ang pang-ugnay na ו ay likas na naipapahayag ng “at” sa serye, at ang עתר ay itinumbas bilang pangalang-pook na Eter.
- source_word: וְ/עָשָׁן
  choice: at Asan
  rationale: Ang ו ay isinaling “at,” at ang עשן ay itinuring na pangalang-pook sa konteksto, hindi bilang karaniwang pangngalang nangangahulugang “usok.”
