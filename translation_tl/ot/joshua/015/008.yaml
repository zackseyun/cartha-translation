  source_fidelity: 'Ang pangunahing pagkakasunod at mga palatandaang heograpiko ay tapat sa Hebreo: umaakyat ang hangganan sa Lambak ng Ben-Hinom, patungo sa dalisdis ng Jebuseo/Jerusalem, at saka sa tuktok ng bundok na nasa kanluran ng Lambak ng Hinom, sa hilagang dulo ng Lambak ng Refaim. Gayunman, ang “lugar ng mga Jebuseo” ay nagpapalit sa isahang anyong “ang Jebuseo” at nagdaragdag ng “lugar” na wala sa teksto.'
  naturalness: Malinaw at natural ang “paakyat na dumaan ang hangganan,” “tuktok ng bundok,” at “hilagang dulo.” Mas maingat at mas malapit sa pinagmulan ang “dalisdis ng Jebuseo sa timog,” na sinusundan ng tahasang pagkakakilanlang “iyon ang Jerusalem.”
  terminology: Ang “hangganan,” “Lambak,” “dalisdis,” at mga pangalang Ben-Hinom, Hinom, Jerusalem, at Refaim ay angkop sa makabagong Filipino at sa pormal na rehistro ng talaang panghangganan. Pinananatili ang “Jebuseo” bilang katawagang nasa teksto nang hindi ipinapalagay ang higit na tiyak na paliwanag.
