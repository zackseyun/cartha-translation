base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: tl
  text: Pagkatapos, paakyat na dumaan ang hangganan sa Lambak ng Ben-Hinom patungo sa dalisdis ng Jebuseo sa timog—iyon ang Jerusalem. Mula roon, paakyat na dumaan ang hangganan sa tuktok ng bundok na nasa kanluran[a] ng Lambak ng Hinom, sa hilagang dulo ng Lambak ng Refaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “patungo sa dagat,” isang karaniwang paraan ng pagsasabi ng “kanluran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: Pagkatapos, paakyat na dumaan
  rationale: Sa paglalarawan ng hangganan, ipinahihiwatig ng pandiwa ang sunod na pag-usad ng guhit ng hangganan pataas; natural sa Filipino ang 'paakyat na dumaan.'
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Tumutukoy ito sa guhit na nagtatakda sa sakop ng lupain; 'hangganan' ang malinaw at karaniwang salin.
- source_word: גֵּי בֶן הִנֹּם
  choice: Lambak ng Ben-Hinom
  rationale: Pinanatili ang katangian nito bilang pangalang heograpiko sa halip na literal na isaling 'anak ni Hinom.'
- source_word: כֶּתֶף הַיְבוּסִי מִנֶּגֶב
  choice: timog na dalisdis ng lugar ng mga Jebuseo
  rationale: Ang כֶּתֶף ay literal na 'balikat' ngunit topograpikong tumutukoy sa tagiliran o dalisdis. Ginawang tahasan ang ipinahihiwatig na lugar na kaugnay ng mga Jebuseo upang maging likas sa Filipino.
- source_word: הִיא יְרוּשָׁלִָם
  choice: ito ang Jerusalem
  rationale: Pinananatili ang tahasang pagkakakilanlan sa Hebreo nang hindi nilulutas nang higit sa hinihingi ng teksto ang eksaktong antecedent ng panghalip.
- source_word: רֹאשׁ הָהָר
  choice: tuktok ng bundok
  rationale: Karaniwang idyoma ito para sa pinakamataas na bahagi ng bundok.
- source_word: יָמָּה
  choice: kanluran
  rationale: Literal itong 'patungo sa dagat,' ngunit isa itong karaniwang Hebreong panandang direksiyon para sa kanluran; inilagay sa talababa ang literal na anyo.
- source_word: בִּקְצֵה עֵמֶק רְפָאִים צָפֹנָה
  choice: sa hilagang dulo ng Lambak ng Refaim
  rationale: Ipinapahayag nito ang kinaroroonan ng bundok sa hilagang sukdulan o dulo ng lambak.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng malinaw na bokabularyong heograpiko. Isinalin ang כֶּתֶף bilang 'dalisdis' sa topograpikong diwa, at pinanatili bilang mga pangalang pantangi ang Ben-Hinom at Refaim.
