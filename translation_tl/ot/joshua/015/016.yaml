    issue: Ang “dito” sa “sumakop dito” ay hindi tumutukoy nang tuwiran sa Kiriat-sefer bilang layon ng pandiwa.
    rationale: Ang hulaping -הּ sa וּלְכָדָהּ ay “ito” (ang lungsod), hindi isang pang-abay na “dito.” Ang “sasakop ito” ay pinanatili ang tuwirang pagtukoy sa lungsod.
  - severity: low
    issue: Hindi tumutugma ang umiiral na talababa sa lexical-alternative na tala ng English audit trail.
    rationale: Ang English footnote ay nagbibigay ng alternatibong ayos para sa indefinite relative clause, samantalang ang draft ay nagtatala ng opsyon sa wayyiqtol. Hindi mali ang obserbasyon sa wayyiqtol, ngunit mas mainam na ihanay ang talababa sa suportadong alternatibong pagbasa nang hindi nagdadagdag ng bagong pokus.
  revised_text: Sinabi ni Caleb[a], “Ang sinumang lumusob sa Kiriat-sefer at sasakop dito, ibibigay ko sa kanya bilang asawa ang anak kong si Acsa.”
