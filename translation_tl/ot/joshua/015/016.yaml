  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: tl
  text: Sinabi ni Caleb[a], “Ang sinumang lumusob sa Kiriat-sefer at sasakop dito, ibibigay ko sa kanya bilang asawa ang anak kong si Acsa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang taong lulusob sa Kiriat-sefer at sasakop dito.”
    reason: Ipinapakita ang mas tahasang alternatibong ayos para sa di-tiyak na pantukoy na אֲשֶׁר, kaayon ng English audit trail.
lexical_decisions:
- source_word: וַיֹּאמֶר כָּלֵב
  choice: Sinabi ni Caleb
  rationale: Natural na salaysay sa Filipino; ipinahihiwatig ng pagkakasunod ng mga pangyayari ang puwersa ng wayyiqtol nang hindi kailangang laging idagdag ang “at” o “pagkatapos.”
- source_word: אֲשֶׁר
  choice: ang sinumang
  rationale: Nagpapakilala ng di-tiyak na sugnay na tumutukoy sa sinumang tutugon sa hamon ni Caleb.
- source_word: יַכֶּה
  choice: lumusob sa
  rationale: Sa kontekstong militar at may lungsod bilang layon, malinaw at natural na ipinapahayag ng “lumusob sa” ang pag-atake, habang hindi pa nito ipinapalagay ang tagumpay na malinaw na sinasabi ng kasunod na pandiwa.
- source_word: קִרְיַת סֵפֶר
  choice: Kiriat-sefer
  rationale: Transliterasyon ng pangalang-pook ayon sa bigkas na malapit sa Hebreo at madaling basahin sa Filipino.
- source_word: וּלְכָדָהּ
  choice: at sumakop dito
  rationale: Ang לכד sa kontekstong militar ay tumutukoy sa pagsakop o pag-agaw sa lungsod; ang “dito” ay tumutukoy sa Kiriat-sefer.
- source_word: וְנָתַתִּי לוֹ
  choice: ibibigay ko sa kanya
  rationale: Direkta at natural na pangako sa Filipino, na pinananatili ang tagatanggap na nasa panlalaking anyo sa Hebreo.
- source_word: עַכְסָה בִתִּי
  choice: ang anak kong si Acsa
  rationale: Natural na ayos sa Filipino para sa personal na pangalan na may kaugnayang pampamilya.
- source_word: לְאִשָּׁה
  choice: bilang asawa
  rationale: Karaniwang pariralang tumutukoy sa pagbibigay sa isang babae sa pag-aasawa nang hindi nagdaragdag ng hindi tahasang possessive.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino na malinaw at marangal. Ginamit ang “lumusob” at “sumakop” upang mapanatili ang dalawang magkahiwalay na kilos sa Hebreo: pag-atake at matagumpay na pagkuha sa lungsod. Ang lahat ng pangalan ay tinranslitera sa paraang madaling basahin sa Filipino.'
