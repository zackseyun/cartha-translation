base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
translation:
  language: tl
  text: Sinakop iyon[a] ni Otniel na anak ni Kenaz at kapatid ni Caleb,[b] kaya ibinigay ni Caleb kay Otniel ang anak niyang si Acsa bilang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iyon ay ang lunsod ng Kiriat-sefer, na tinatawag ding Debir, na binanggit sa naunang talata.
    reason: cross_reference
  - marker: b
    text: Maaari ring “kamag-anak ni Caleb,” sapagkat kung minsan ay mas malawak ang kahulugan ng “kapatid” at tumutukoy sa isang malapit na kamag-anak; ang payak na kahulugan ay “kapatid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: Sinakop iyon
  rationale: Ang לָכַד ay tumutukoy sa pagsakop o pagbihag, lalo na ng isang lunsod. Ang hulaping pambabae ay tumutukoy sa lunsod na binanggit sa naunang talata; natural sa Filipino ang “iyon.”
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: בֶּן קְנַז
  choice: anak ni Kenaz
  rationale: Tuwirang salin ng ugnayang ipinahahayag ng בֶּן.
- source_word: אֲחִי כָלֵב
  choice: kapatid ni Caleb
  rationale: Ang payak na kahulugan ng אָח ay “kapatid.” Maaari rin itong gamitin nang mas malawak para sa isang malapit na kamag-anak, kaya inilagay ang alternatibo sa talababa.
- source_word: וַיִּתֶּן לוֹ
  choice: at ibinigay niya sa kanya
  rationale: Pinananatili ang mga panghalip ng tekstong Hebreo at ang payak na daloy ng salaysay. Mula sa konteksto, si Caleb ang nagbigay at si Otniel ang tumanggap.
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: ang anak niyang si Acsa
  rationale: Natural na ayos sa Filipino para sa pangalang sinusundan sa Hebreo ng paglalarawang “kanyang anak.”
- source_word: לְאִשָּׁה
  choice: bilang asawa
  rationale: Malinaw at likas na salin ng idyomang tumutukoy sa pagbibigay sa isang babae upang mapangasawa.
theological_decisions:
- issue: Lawak ng kahulugan ng אֲחִי
  choice: kapatid ni Caleb
  alternative: kamag-anak ni Caleb
  rationale: Pinili sa pangunahing teksto ang karaniwang kahulugan na “kapatid,” ngunit hindi inalis ang posibleng mas malawak na kahulugang “kamag-anak.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na takbo ng salaysay at ang mga panghalip sa Hebreo, habang nilinaw sa talababa ang tinutukoy ng “iyon” at ang posibleng lawak ng kahulugang “kapatid.”
