translation_notes:
  register: Makabago at dignified na Filipino, na gumagamit ng payak na pandiwang pangheograpiya. Pinanatili ang mga pangalan ng lugar sa anyong madaling basahin sa Filipino. Ang teknikal na “wadi” ay pinanatili dahil wala itong ganap na katumbas sa maikling Tagalog, ngunit ipinaliwanag ito sa talababa.
