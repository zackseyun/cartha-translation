  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: tl
  text: Umakyat ang hangganan mula sa Lambak ng Acor patungong Debir. Pagkatapos, lumiko ito pahilaga patungong Gilgal[a], na nasa tapat ng Akyatan ng Adummim, na nasa timog ng wadi.[b] Mula roon, dumaan ang hangganan patungo sa mga tubig ng En-semes, at nagtapos ito sa En-rogel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang Gilgal.” Maaaring tumukoy ang Hebreo sa direksiyon patungo sa lugar o sa pagdating mismo roon.
    reason: lexical_alternative
  - marker: b
    text: Ang “wadi” ay daluyan ng tubig, o tuyong higaan nito, na karaniwang nagkakaroon lamang ng agos sa ilang panahon.
    reason: cultural_note
  - marker: c
    text: Sa literal, “ang mga labasan nito ay nasa En-rogel.” Gumagamit ang Hebreo ng maramihang anyo upang tukuyin ang mga dulo o hantungan ng hangganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  choice: paahon ang hangganan
  rationale: Sa paglalarawan ng hangganan, ang עלה ay nagpapahiwatig ng pag-akyat o pagpapatuloy sa mas mataas na lugar. Likas sa Filipino ang “paahon ang hangganan” at napananatili nito ang topograpikong diwa.
- source_word: דְּבִרָה
  choice: patungong Debir
  rationale: Ipinahihiwatig ng directional he ang kilos tungo sa Debir; ang “patungong” ay angkop sa pagsubaybay sa linya ng hangganan.
- source_word: מֵעֵמֶק עָכוֹר
  choice: mula sa Lambak ng Acor
  rationale: Tuwirang isinasalin ang עֵמֶק bilang “Lambak,” habang tinutumbasan sa baybay-Filipino ang pangalang Achor bilang “Acor.”
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: lumiko ito pahilaga
  rationale: Ang פנה kasama ng direksiyong צפונה ay nagsasaad ng pagliko o pagharap sa hilaga. Sa konteksto ng hangganan, pinakanatural ang “lumiko ito pahilaga.”
- source_word: אֶל הַגִּלְגָּל
  choice: patungong Gilgal
  rationale: Maaaring ipahiwatig ng אֶל ang direksiyon tungo sa lugar o ang pagdating dito. Pinananatili ng “patungong” ang direksiyonal na diwa nang hindi tiyak na nagpapasya kung umabot mismo ang linya sa Gilgal.
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: na nasa tapat ng Akyatan ng Adummim
  rationale: Ang נֹכַח ay “nasa tapat” o “nakaharap,” at ang מַעֲלֵה ay isang paakyat na daan o ahunan. Ginamit ang “Akyatan” upang mapanatili ang katangiang pangheograpiya ng pangalan.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: na nasa timog ng wadi
  rationale: Dito, direksiyon ang נֶגֶב, samantalang ang נַחַל ay maaaring pana-panahong daluyan ng tubig o bangin. Ang “wadi” ang pinakamaikling tumpak na terminong pangheograpiya, na ipinaliliwanag sa talababa.
- source_word: וְעָבַר הַגְּבוּל
  choice: nagpatuloy ang hangganan
  rationale: Sa mga pormula ng hangganan, ang עבר ay maaaring mangahulugang dumaan o nagpatuloy sa susunod na palatandaan. Iniiwasan ng “nagpatuloy” ang hindi kinakailangang pagpapahiwatig na may tiyak na tinawid.
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: sa tubig ng En-semes
  rationale: Pinananatili ang literal na maramihang מֵי, “tubig ng,” at ang pangalan ng lugar ay tinutumbasan sa baybay-Filipino bilang En-semes.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: at nagtapos sa En-rogel
  rationale: Sa paglalarawan ng hangganan, ang תֹצְאוֹת ay tumutukoy sa labasan, dulo, o hantungan nito. Ang “nagtapos” ay natural sa Filipino, habang ang literal na maramihang anyo ay itinatala sa talababa.
