  naturalness: Kailangan ang mas likas na pandiwang “Umakyat ang hangganan” at mas malinaw na “dumaan ang hangganan patungo sa mga tubig.” Ang natitirang daloy ay angkop sa makabago ngunit marangal na Filipino.
  terminology: 'Pinanatili ang mga pangalan ng lugar sa anyong ginagamit sa draft. Ang “wadi” ay maaaring panatilihin, ngunit dapat tumpak ang talababa: hindi ito simpleng “bangin,” kundi pana-panahong daluyan ng tubig o tuyong higaan nito.'
