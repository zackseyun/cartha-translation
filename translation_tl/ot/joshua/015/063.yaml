revisions:
- from: Ngunit hindi napaalis ng mga anak ni Juda ang mga Jebuseo[a] na naninirahan sa Jerusalem. Kaya nanirahan ang mga Jebuseo kasama ng mga anak ni Juda sa Jerusalem hanggang sa araw na ito.
  to: Ngunit hindi nagawang paalisin ng mga anak ni Juda ang mga Jebuseo[a] na naninirahan sa Jerusalem. Kaya hanggang sa araw na ito, naninirahan ang mga Jebuseo kasama ng mga anak ni Juda sa Jerusalem.
  rationale: Pinalitan ang “hindi napaalis” ng “hindi nagawang paalisin” upang tahasang maisalin ang kawalan ng kakayahang ipinahahayag ng Hebreo. Inayos ang huling pangungusap upang idiin sa natural na Tagalog ang nagpapatuloy na paninirahan hanggang sa panahon ng tagapagsalaysay. Walang pagbabagong ginawa sa kahulugan ng etniko, pangalan ng lugar, o sa maingat na “kasama ng” para sa di-pangkaraniwang konstruksiyong Hebreo.
