  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם לֹֽא יוכלו בְנֵֽי יְהוּדָ֖ה לְ/הֽוֹרִישָׁ֑/ם וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: tl
  text: Ngunit hindi nagawang paalisin ng mga anak ni Juda ang mga Jebuseo[a] na naninirahan sa Jerusalem. Kaya hanggang sa araw na ito, naninirahan ang mga Jebuseo kasama ng mga anak ni Juda sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, pang-isahan ang katawagang etniko: “ang Jebuseo,” ngunit kolektibo ang kahulugan nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Ngunit
  rationale: Sa daloy ng salaysay, ipinakikilala ng pang-ugnay ang isang pagbubukod o pagsalungat sa naunang talaan ng mga nasakop na lupain; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “Ngunit.”
- source_word: הַיְבוּסִי
  choice: mga Jebuseo
  rationale: Bagaman pang-isahang kolektibo ang anyong Hebreo, tumutukoy ito sa buong pangkat-etniko; likas sa Tagalog ang maramihang “mga Jebuseo.”
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: na naninirahan sa Jerusalem
  rationale: Ang participial na parirala ay nagpapakilala sa mga Jebuseo bilang mga residente ng Jerusalem; malinaw at natural ang sugnay na ito sa modernong Tagalog.
- source_word: לֹא יוכלו
  choice: hindi napaalis
  rationale: 'Isinasama ng “hindi napaalis” ang ipinahihiwatig na kawalan ng kakayahan sa konteksto: hindi nila nagawang paalisin ang mga Jebuseo.'
- source_word: בְנֵי יְהוּדָה
  choice: mga anak ni Juda
  rationale: Pinananatili nito ang pampamilya at pantribong idyoma ng Hebreo habang nauunawaan sa Tagalog bilang mga inapo o kabilang sa lipi ni Juda.
- source_word: לְהוֹרִישָׁם
  choice: mapaalis
  rationale: Sa konteksto ng pananakop, ang Hiphil ng ירשׁ ay tumutukoy sa pag-aalis sa isang pangkat mula sa kanilang kinaroroonan o pag-aari. Ang “mapaalis” ay natural at hindi labis na teknikal.
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Ang pandiwa ay nagsasaad ng patuloy na paninirahan; kasama ng “hanggang sa araw na ito,” malinaw na umaabot ang kalagayan sa panahon ng tagapagsalaysay.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: kasama ng mga anak ni Juda
  rationale: Di-pangkaraniwan ang literal na sintaks, ngunit ang konteksto ay nagpapahiwatig ng magkasamang paninirahan. Pinananatili ng “kasama ng” ang ugnayan nang hindi nagpapalabis sa uri nito.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Ito ang tuwiran at karaniwang Tagalog para sa pormulang Hebreo na nagsasaad ng pagpapatuloy hanggang sa panahon ng tagapagsalaysay.
theological_decisions:
- issue: Pagpapakahulugan sa בְנֵי יְהוּדָה
  choice: mga anak ni Juda
  alternative: mga taga-Juda / lipi ni Juda
  rationale: Pinananatili ang pantribong idyomang pampamilya ng Hebreo. Kolektibo itong tumutukoy sa mga inapo o kasapi ng Juda, hindi lamang sa mga literal na anak o sa mga lalaki.
- issue: Ugnayan sa huling sugnay na וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה
  choice: nanirahan ... kasama ng mga anak ni Juda
  alternative: nanirahan ... sa gitna ng mga anak ni Juda
  rationale: Hindi karaniwan ang konstruksiyong Hebreo, ngunit nagpapahiwatig ito ng magkasamang paninirahan. Ang “kasama ng” ay nagpapanatili ng kaunting lawak ng kahulugan nang hindi tiyak na inilalarawan ang kanilang panlipunan o pampolitikang relasyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga anak ni Juda” upang mapanatili ang pantribong idyoma ng pinagmulan, at “mapaalis” bilang likas na salin ng pandiwang tumutukoy sa pag-aalis sa mga naninirahan sa lupain.
