  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יָצָ֨א הַ/גְּב֜וּל אֶל כֶּ֣תֶף עֶקְרוֹן֮ צָפוֹנָ/ה֒ וְ/תָאַ֤ר הַ/גְּבוּל֙ שִׁכְּר֔וֹנָ/ה וְ/עָבַ֥ר הַר הַֽ/בַּעֲלָ֖ה וְ/יָצָ֣א יַבְנְאֵ֑ל וְ/הָי֛וּ תֹּצְא֥וֹת הַ/גְּב֖וּל יָֽמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: tl
  text: Pagkatapos, ang hangganan ay umabot sa hilagang gilid ng Ekron[a]. Mula roon, lumiko ang hangganan patungong Shikeron, dumaan sa Bundok Baala, at umabot sa Jabneel. Ang mga dulo ng hangganan ay nasa dagat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “balikat ng Ekron, pahilaga”; maaari ring isaling “sa balikat ng Ekron patungong hilaga.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “patungo sa dagat” o “pakanluran.” Malamang na ang Dagat Mediteraneo ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: umabot
  rationale: Sa paglalarawan ng mga hangganan, ipinahihiwatig ng pandiwa ang pagpapatuloy ng linya hanggang sa susunod na pook; mas natural sa modernong Tagalog ang “umabot” kaysa literal na “lumabas.”
- source_word: גְּבוּל
  choice: hangganan
  rationale: Karaniwan at malinaw na salitang Tagalog para sa linyang naghihiwalay sa mga teritoryo.
- source_word: כֶּתֶף עֶקְרוֹן צָפוֹנָה
  choice: hilagang gilid ng Ekron
  rationale: Ang כֶּתֶף ay literal na “balikat” ngunit topograpikong tumutukoy sa gilid o tagiliran; pinagsama ito sa anyong patungong hilaga upang maging likas at malinaw sa Tagalog.
- source_word: תָּאַר
  choice: lumiko ... patungong
  rationale: Sa mga pormula ng hangganan, inilalarawan nito ang pagbabago ng direksiyon o pagkurba ng linya.
- source_word: שִׁכְּרוֹנָה
  choice: Shikeron
  rationale: Isinalin-titik ang pangalan ng pook ayon sa bigkas na madaling basahin sa Filipino.
- source_word: עָבַר
  choice: dumaan sa
  rationale: Ipinapahayag ang pagdaan ng linya ng hangganan sa o sa ibabaw ng isang heograpikong bahagi nang hindi labis na tinutukoy kung tinawid o nilampasan iyon.
- source_word: הַר הַבַּעֲלָה
  choice: Bundok Baala
  rationale: Ang הַר ay bundok o mataas na burol; ang “Bundok” ay maikli at karaniwang anyo sa pangalan ng pook.
- source_word: יַבְנְאֵל
  choice: Jabneel
  rationale: Isinalin-titik ang pangalan ng pook, pinananatili ang nakaugaliang anyong biblikal sa Filipino.
- source_word: תֹּצְאוֹת הַגְּבוּל
  choice: dulo ng hangganan
  rationale: Tumutukoy sa hantungan o dulong bahagi ng linya; natural at malinaw ang “dulo” sa konteksto.
- source_word: יָמָּה
  choice: nasa dagat
  rationale: Maaaring mangahulugang “pakanluran” o “patungo sa dagat,” ngunit sa sugnay na ito ay pinakaangkop bilang hantungan ng hangganan sa dagat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “hangganan” bilang pare-parehong terminong heograpiko at natural na mga pandiwa para sa pag-usad ng linya. Pinanatili sa mga talababa ang tunay na kalabuan ng mga pariralang כֶּתֶף ... צָפוֹנָה at יָמָּה.
