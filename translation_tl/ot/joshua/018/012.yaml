  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “hangganan,” “dalisdis,” “bulubundukin,” at “ilang” bilang natural na mga terminong heograpiko. Isinalin ang mga pangalang pantangi bilang Jordan, Jerico, at Bet-aven.
