base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: tl
  text: Ang hangganan nila sa hilagang panig ay mula sa Jordan. Mula roon, umahon ang hangganan patungo sa hilagang dalisdis ng Jerico; saka ito umahon sa bulubundukin patungong kanluran, at ang dulo nito ay nasa ilang ng Bet-aven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong salitang isinaling “dulo” ay nasa anyong pangmarihan na topograpiko at maaari ring isaling “mga dulo nito” o “mga labasan nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: sa hilagang panig
  rationale: Ang פאה ay tumutukoy sa panig o gilid; natural at malinaw sa paglalarawan ng hangganan ang “sa hilagang panig.”
- source_word: מִן הַיַּרְדֵּן
  choice: nagsimula sa Jordan
  rationale: Ipinahihiwatig ng מִן ang pinagmulan ng guhit ng hangganan. Idinagdag ang “nagsimula” upang maging natural sa Tagalog nang hindi binabago ang diwa.
- source_word: וְעָלָה הַגְּבוּל
  choice: umahon ang hangganan
  rationale: Pinananatili ng “umahon” ang topograpikong galaw ng עלה at karaniwan itong mauunawaan sa paglalarawan ng rutang paakyat.
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: sa dalisdis sa hilaga ng Jerico
  rationale: Ang כֶּתֶף ay literal na “balikat,” ngunit sa heograpikong gamit ay panig o dalisdis; tinutukoy ng מִצָּפוֹן ang hilagang bahagi nito.
- source_word: בָהָר יָמָּה
  choice: patungong kanluran sa bulubundukin
  rationale: Ang הָר ay maaaring tumukoy sa maburol o bulubunduking lupain, at ang יָמָּה ay direksiyonal na “pakanluran.” Hindi ipinilit ang “dumaan sa” sapagkat ang ב ay maaaring mangahulugang nasa o papasok sa lupain.
- source_word: תֹּצְאֹתָיו
  choice: nagtapos
  rationale: Sa mga pormula ng hangganan, tumutukoy ang pangmaramihang topograpikong terminong ito sa hantungan o dulo ng hangganan; natural itong maisalin bilang pandiwang “nagtapos.”
- source_word: מִדְבָּרָה בֵּית אָוֶן
  choice: sa ilang ng Bet-aven
  rationale: Ang hulaping direksiyonal ay tumutukoy sa hantungan patungo sa ilang ng Bet-aven; kasunod ng “nagtapos,” malinaw at natural ang “sa.”
