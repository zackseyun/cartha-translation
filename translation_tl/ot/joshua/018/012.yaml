  to: Ang hangganan nila sa hilagang panig ay mula sa Jordan. Mula roon, umahon ang hangganan patungo sa hilagang dalisdis ng Jerico; saka ito umahon sa bulubundukin patungong kanluran, at ang dulo nito ay nasa ilang ng Bet-aven.[a]
