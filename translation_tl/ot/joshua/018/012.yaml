    issue: Ang “nagsimula sa Jordan” ay bahagyang nagpapalawak sa “mula sa Jordan.”
    rationale: Bagaman katanggap-tanggap sa kahulugan, mas malapit sa Hebreo at mas matipid ang “ay mula sa Jordan.”
  - severity: low
