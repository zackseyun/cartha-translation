  source_fidelity: Tumpak sa kabuuan ang ruta ng hangganan. Gayunman, ang “nagsimula” ay isang maliit na pagpapalinaw na wala sa Hebreo, na mas tuwirang nagsasabing ang hangganan ay “mula sa Jordan.” Mas malinaw rin na ilapat ang “hilaga” sa dalisdis mismo, hindi lamang sa lokasyon nito kaugnay ng Jerico.
  naturalness: Natural ang pangkalahatang rehistro, ngunit mas malinaw at mas maayos ang daloy sa “patungo sa hilagang dalisdis ng Jerico” at “umahon sa bulubundukin patungong kanluran.”
  terminology: Ang “hangganan,” “dalisdis,” “bulubundukin,” at “ilang” ay angkop na modernong Filipino. Pinanatili ang Jordan, Jerico, at Bet-aven bilang mga pangalang pantangi. Inaayos ang talababa upang tumugma ito sa binagong pangunahing salin na “dulo.”
  issues:
