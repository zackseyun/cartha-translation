base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: tl
  text: Pagkatapos, lumiko ang hangganan pahilaga at umabot sa En-Semes[a], at umabot sa Gelilot[b], na nasa tapat ng Paakyat na Daan ng Adumim[c], at bumaba sa bato ni Bohan na anak ni Ruben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang En-Semes ay nangangahulugang “Bukal ng Araw,” ngunit pangalan ng lugar ang ginamit sa pangunahing teksto.
    reason: lexical_alternative
  - marker: b
    text: Ang Gelilot ay maaari ring unawain bilang “mga bilog” o “mga distrito,” ngunit itinuring dito bilang pangalan ng lugar.
    reason: lexical_alternative
  - marker: c
    text: O “Lagusan ng Adumim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: lumiko ang hangganan
  rationale: Sa paglalarawan ng hangganan, ipinapahiwatig ng pandiwa ang pagbabago ng direksiyon o pagkakaguhit ng linya. Nilinaw ang ipinahihiwatig na simuno upang maging natural sa Tagalog.
- source_word: מִצָּפוֹן
  choice: pahilaga
  rationale: Sa sunod-sunod na pandiwa ng paggalaw, pinakamalamang na direksiyon ng takbo ng hangganan ang tinutukoy.
- source_word: וְיָצָא
  choice: umabot
  rationale: Sa mga pormula tungkol sa hangganan, ipinahihiwatig nito ang pag-abot o paglabas ng linya patungo sa isang pook. Mas natural ang “umabot” sa Tagalog kaysa literal na “lumabas.”
- source_word: עֵין שֶׁמֶשׁ
  choice: En-Semes
  rationale: Itinuring itong pangalan ng lugar at isina-Tagalog ang transliterasyon, sa halip na isalin ang kahulugan nito.
- source_word: גְּלִילוֹת
  choice: Gelilot
  rationale: Gumaganap dito bilang pangalan ng lugar, bagaman may leksikal na kahulugang “mga bilog” o “mga distrito.”
- source_word: נֹכַח
  choice: nasa tapat ng
  rationale: Malinaw at natural na panandang heograpikal ito para sa isang lugar na kaharap o katapat ng isa pa.
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: Akyatan ng Adumim
  rationale: Ang מַעֲלֵה ay paakyat na daan o dalisdis; pinanatiling pangalan ang Adumim.
- source_word: וְיָרַד
  choice: bumaba
  rationale: Tuwirang inilalarawan ang pababang takbo ng hangganan ayon sa lupain.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: bato ni Bohan na anak ni Ruben
  rationale: Natural na Tagalog para sa palatandaang batong ipinangalan kay Bohan, na kinikilalang anak o inapo ni Ruben.
