  text: at ang Hamizpe[a], ang Hakkefira, at ang Hammoza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring: “ang Mizpe, ang Kefira, at ang Moza,” kung ituturing ang unlaping ha- bilang karaniwang pantukoy sa halip na bahagi ng transliterasyon ng mga pangalan ng lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: at
  rationale: Ang pang-ugnay na may unlaping waw ay nagdurugtong sa mga pangalan ng bayan sa naunang talaan; natural itong isinalin na “at.”
- source_word: הַמִּצְפֶּה
  choice: Hamizpe
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa paraang transliterasyon sa halip na isaling “bantayan.” Pinanatili ang unlaping ha- bilang bahagi ng anyong pangalan.
- source_word: הַכְּפִירָה
  choice: Hakefira
  rationale: 'Pangalan ito ng lugar at isinatagalog ang baybay ayon sa karaniwang pagpapalit ng tunog: k para sa kaf at f para sa pe na walang dagesh. Pinanatili ang ha- sa transliterasyon.'
- source_word: הַמֹּצָה
  choice: Hamoza
  rationale: Pangalan ito ng lugar, kaya tinranslitera at hindi isinalin. Pinanatili ang ha- bilang bahagi ng anyong pangalan.
