translation_notes:
  register: Modernong Filipino na simple at marangal. Ginamit ang mga anyong Hamizpe, Hakefira, at Hamoza upang katawanin ang mga pangalang Hebreo at mapanatili ang tunay na pag-aalinlangan kung ang ha- ay pantukoy o bahagi ng nakaugaliang anyo ng pangalan.
