  text: Beth-arabah[a], Zemaraim, and Bethel.
translation:
  language: tl
  text: Bet-araba[a], Zemaraim, at Bethel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga ito ay pangalang Hebreo ng mga lugar. Ang “Bet-araba” ay maaaring literal na isaling “bahay ng Araba,” at ang “Bethel” naman ay “bahay ng Diyos,” ngunit pinanatili sa pangunahing teksto ang mga ito bilang mga pangalan ng lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית הָעֲרָבָה
  choice: Bet-araba
  rationale: Pangalan ito ng isang lugar sa talaan ng mga bayan. Isinalin sa baybay-Filipino ang tunog ng pangalang Hebreo sa halip na isalin ang mga bahagi nito.
- source_word: צְמָרַיִם
  choice: Zemaraim
  rationale: Isang pangalang pantangi ng lugar; pinanatili ng transliterasyon ang anyong Hebreo, kabilang ang hulaping -ayim.
- source_word: בֵית אֵל
  choice: Bethel
  rationale: Ginamit ang nakasanayang anyo ng pangalan ng lugar sa Filipino, sa halip na literal na “bahay ng Diyos.”
- source_word: וּ
  choice: at
  rationale: Ang unlaping pang-ugnay ay nagdurugtong sa mga pangalan sa talaan; kuwit at “at” ang natural na ayos sa Filipino.
theological_decisions: []
translation_notes:
  register: Maikli at dignified na modernong Filipino, angkop sa isang talaan ng mga bayan. Ginamit ang baybay na “Bet-araba” upang madaling mabasa ng karaniwang mambabasang Filipino, samantalang pinanatili ang nakasanayang “Bethel.”
