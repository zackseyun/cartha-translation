  text: וְ/הִֽתְחַלְּק֥וּ אֹתָ֖/הּ לְ/שִׁבְעָ֣ה חֲלָקִ֑ים יְהוּדָ֞ה יַעֲמֹ֤ד עַל גְּבוּל/וֹ֙ מִ/נֶּ֔גֶב וּ/בֵ֥ית יוֹסֵ֛ף יַעַמְד֥וּ עַל גְּבוּלָ֖/ם מִ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: tl
  text: At hahatiin nila iyon sa pitong bahagi. Mananatili ang Juda sa hangganan nito sa timog[a], at mananatili ang sambahayan ni Jose sa hangganan nila sa hilaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tatayo sa hangganan nito” at “tatayo sa hangganan nila.” Literal na nangangahulugang “tumayo” ang pandiwang Hebreo, ngunit dito ay malamang na tumutukoy ito sa pananatili sa dati nang takdang mga hangganan ng teritoryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: At hahatiin nila iyon
  rationale: Ang Hitpael ng חלק ay tumutukoy rito sa paghahati-hati o pagbabahagi ng lupain. Likas sa modernong Tagalog ang “hahatiin nila iyon” at pinananatili nito ang tahasang maramihang simuno ng pandiwang Hebreo.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: sa pitong bahagi
  rationale: Ang חֲלָקִים ay mga bahagi o takdang hati ng lupain; malinaw at natural ang “pitong bahagi” sa konteksto ng pamamahagi.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ito ang nakasanayang anyo ng pangalan sa Tagalog.
- source_word: יַעֲמֹד עַל גְּבוּלוֹ
  choice: mananatili ang Juda sa hangganan nito
  rationale: Bagaman literal na “tatayo” ang עמד, sa pahayag tungkol sa teritoryo ay malamang na nangangahulugang mananatili sa dati nang takdang hangganan. Pinananatili ng “nito” ang isahang hulapi sa Hebreo.
- source_word: מִנֶּגֶב
  choice: sa timog
  rationale: Dito ay panandang heograpikal ang נֶגֶב, na katapat ng “sa hilaga,” at hindi partikular na pangalan ng rehiyong Negev.
- source_word: וּבֵית יוֹסֵף
  choice: at ang sambahayan ni Jose
  rationale: Ang “sambahayan ni Jose” ay nagpapanatili sa kolektibong idyomang בית יוסף para sa mga liping nagmula kay Jose.
- source_word: יַעַמְדוּ עַל גְּבוּלָם
  choice: mananatili ang sambahayan ni Jose sa hangganan nila
  rationale: Ang maramihang pandiwa at hulapi sa Hebreo ay nagpapakita na kolektibo ngunit maramihan ang tinutukoy na sambahayan ni Jose; kaya ginamit ang “nila,” hindi “nito.”
- source_word: מִצָּפוֹן
  choice: sa hilaga
  rationale: Panandang heograpikal ito para sa hilagang panig at maayos na katapat ng “sa timog.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mananatili” bilang natural na kahulugan sa kontekstong teritoryal, habang inilagay sa talababa ang mas literal na “tatayo.” Pinanatili ang pagkakaiba ng isahang “nito” para sa Juda at maramihang “nila” para sa kolektibong sambahayan ni Jose.
