base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: tl
  text: Magtalaga kayo ng tigatlong lalaki mula sa bawat lipi[a], at isusugo ko sila. Tatayo sila at maglalakad sa lupain at itatala nila ito ayon sa kani-kanilang mana[b], at pupunta sila sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Maglaan kayo ng tatlong lalaki para sa bawat lipi.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, itatala nila ang lupain kaugnay ng mga bahaging ilalaan bilang mana sa mga lipi.
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Pumili kayo
  rationale: Sa kontekstong ito, ang pautos ay humihiling na maglaan o humirang sila ng mga lalaki mula sa kanilang sariling mga lipi. Ang “Pumili kayo” ay likas sa modernong Tagalog at malinaw na naghahatid ng praktikal na diwa.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: tatlong lalaki
  rationale: Tahasang panlalaki ang Hebreo at tumutukoy sa mga lalaking kinatawan.
- source_word: לַשָּׁבֶט
  choice: mula sa bawat lipi
  rationale: 'Bagaman isahan ang anyo, distributibo ang gamit: tatlong lalaki ang kukunin sa bawat lipi.'
- source_word: וְאֶשְׁלָחֵם
  choice: at isusugo ko sila
  rationale: Ang “isusugo” ay angkop sa pagpapadala para sa isang atas o misyon.
- source_word: וְיָקֻמוּ וְיִתְהַלְּכוּ בָאָרֶץ
  choice: Lalakad sila sa buong lupain
  rationale: Ang magkakasunod na pandiwa ay nagsasaad ng pagbangon at paglilibot. Sa natural na Tagalog, sapat ang “lalakad ... sa buong lupain” upang ihatid ang aktuwal na paglibot nang hindi mabigat ang literal na “babangon.”
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: at itatala iyon
  rationale: Tumutukoy ang panghalip sa lupain. Ang “itatala iyon” ay malapit sa literal na pagsulat nito at hindi nagdaragdag ng tiyak na uri ng paglalarawan o survey.
- source_word: לְפִי נַחֲלָתָם
  choice: ayon sa kani-kanilang mana
  rationale: Ang idyoma ay tumutukoy sa lupain kaugnay ng mga bahaging mamanahin. Pinananatili ng “kani-kanilang mana” ang ugnayan sa mga liping kinakatawan nang hindi labis na nililinaw ang paraan ng paghahati.
- source_word: וְיָבֹאוּ אֵלָי
  choice: Pagkatapos, pupunta sila sa akin
  rationale: Literal na “darating/pupunta sila sa akin.” Hindi ginamit ang “babalik” sapagkat hindi tahasang nakasaad sa Hebreo ang ideya ng pagbabalik.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Pumili” sa halip na literal na “Magbigay,” at “itatala” upang mapanatili ang pagiging bukas ng Hebreo kung ano mismo ang anyo ng isusulat.
