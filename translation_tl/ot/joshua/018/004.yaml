revisions:
- from: Pumili kayo ng tatlong lalaki mula sa bawat lipi[a], at isusugo ko sila. Lalakad sila sa buong lupain at itatala iyon ayon sa kani-kanilang mana[b]. Pagkatapos, pupunta sila sa akin.
  to: Magtalaga kayo ng tigatlong lalaki mula sa bawat lipi[a], at isusugo ko sila. Tatayo sila at maglalakad sa lupain at itatala nila ito ayon sa kani-kanilang mana[b], at pupunta sila sa akin.
  rationale: Pinalitan ang “Pumili” ng “Magtalaga” upang maipahayag ang paglalaan/pagtatalaga na hinihingi ng Hebreo. Idinagdag ang “Tatayo sila” upang mapanatili ang hiwalay na pandiwang וְיָקֻמוּ, at inalis ang mga di-tahasang pagpapalawak na “buong” at “Pagkatapos.” Inayos din ang unang talababa upang tumugma sa binagong pangunahing salin at nilinaw ang ikalawa bilang paliwanag lamang, hindi bilang dagdag sa teksto.
