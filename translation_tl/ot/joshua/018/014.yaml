  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/תָאַ֣ר הַ/גְּבוּל֩ וְ/נָסַ֨ב לִ/פְאַת יָ֜ם נֶ֗גְבָּ/ה מִן הָ/הָר֙ אֲשֶׁ֨ר עַל פְּנֵ֥י בֵית חֹרוֹן֮ נֶגְבָּ/ה֒ ו/היה תֹֽצְאֹתָ֗י/ו אֶל קִרְיַת בַּ֨עַל֙ הִ֚יא קִרְיַ֣ת יְעָרִ֔ים עִ֖יר בְּנֵ֣י יְהוּדָ֑ה זֹ֖את פְּאַת יָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: tl
  text: Pagkatapos, nagpatuloy ang hangganan at lumiko sa gawing kanluran, patimog mula sa bundok na nasa tapat ng Bet-horon sa timog. Nagtapos ito sa Kiriat-baal (na siyang Kiriat-jearim), isang lungsod ng mga anak ni Juda.[a] Ito ang gawing kanluran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Juda” ay katawagang pantribo para sa mga tao o mga inapo ni Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר הַגְּבוּל
  choice: bumaling ang hangganan
  rationale: Sa paglalarawan ng hangganan, ipinapahiwatig ng pandiwa ang pagpapatuloy ng guhit nito na may pagbabago ng direksiyon. Ang “bumaling” ay likas sa Filipino at angkop sa topograpikong konteksto.
- source_word: וְנָסַב
  choice: at lumiko
  rationale: Tumutukoy ito sa pag-ikot o pagbabago ng direksiyon. Pinananatili ng “lumiko” ang hiwalay na pandiwa sa Hebreo nang hindi nagiging mabigat ang pangungusap.
- source_word: לִפְאַת יָם
  choice: sa gawing kanluran
  rationale: Sa mga pormula tungkol sa hangganan, ang “dagat” ay tumutukoy sa kanluran. Isinalin ang idyoma ayon sa heograpikong kahulugan nito.
- source_word: נֶגְבָּה
  choice: patimog
  rationale: Ang anyong direksiyonal ay nagpapahiwatig ng kilos tungo sa timog.
- source_word: מִן הָהָר
  choice: mula sa bundok
  rationale: Tuwirang salin ng tiyak at isahang pangngalan; tumutukoy ito sa isang partikular na mataas na lupain sa ruta ng hangganan.
- source_word: אֲשֶׁר עַל־פְּנֵי בֵית חֹרוֹן נֶגְבָּה
  choice: na nasa tapat ng Bet-horon sa timog
  rationale: Ang עַל־פְּנֵי sa heograpikong gamit ay “nasa tapat” o “nakaharap sa.” Pinanatili ang ikalawang pagtukoy sa timog nang hindi tinutukoy nang higit sa sinasabi ng Hebreo kung bundok o Bet-horon ang nasa timog.
- source_word: וְהָיָה תֹצְאֹתָיו
  choice: Nagtapos ito
  rationale: Karaniwang idyoma ito para sa dulo o hantungan ng isang hangganan. Ang pandiwang Filipino ay malinaw at natural.
- source_word: אֶל קִרְיַת בַּעַל הִיא קִרְיַת יְעָרִים
  choice: sa Kiriat-baal (na siyang Kiriat-jearim)
  rationale: Ipinakikilala ng panghalip ang ibang pangalan ng iisang lungsod. Ang panaklong ay malinaw na nagpapakita ng pagkakakilanlan.
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: isang lungsod ng mga anak ni Juda
  rationale: Pinananatili ang literal na pananalitang pantribo na “mga anak ni Juda,” na tumutukoy sa mga inapo o sambayanan ni Juda.
- source_word: זֹאת פְּאַת יָם
  choice: Ito ang gawing kanluran
  rationale: Maikli at tuwirang isinasalin ang pangwakas na pagkilala sa kanlurang panig ng hangganan.
theological_decisions:
- issue: Ang saklaw ng ikalawang נֶגְבָּה (“sa timog”)
  choice: na nasa tapat ng Bet-horon sa timog
  alternative: na nasa timog ng Bet-horon
  rationale: Maaaring iugnay ang pariralang direksiyonal sa bundok o sa lokasyon nito kaugnay ng Bet-horon. Pinili ang ayos na malapit sa Hebreo at hindi lubusang nilulutas ang sintaktikong kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga anyong “Bet-horon,” “Kiriat-baal,” at “Kiriat-jearim” bilang madaling basahing transliterasyon. Inilagay ang talababa pagkatapos ng “mga anak ni Juda,” ang pariralang aktuwal nitong ipinapaliwanag.
