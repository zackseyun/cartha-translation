source:
  edition: WLC
  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: tl
  text: Sapagkat walang bahagi sa lupain ang mga Levita sa gitna ninyo, sapagkat ang pagkapari kay Yahweh ang kanilang mana.[a] Natanggap na ng Gad, Ruben, at kalahati ng lipi ni Manases ang kanilang mana sa kabila ng Jordan, sa silangan, na ibinigay sa kanila ni Moises na lingkod ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kanyang mana.” Ang isahan ay malamang na tumutukoy nang kolektibo kay Levi o sa mga Levita; kaya “kanilang mana” ang nasa pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶק
  choice: bahagi sa lupain
  rationale: Ang חֵלֶק ay bahagi o takdang bahagi; nilinaw ng “sa lupain” ang konteksto ng paghahati ng lupain at naiba ito sa נַחֲלָה, “mana.”
- source_word: לַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang makabagong Tagalog na tawag sa pangkat mula sa lipi ni Levi.
- source_word: בְּקִרְבְּכֶם
  choice: sa gitna ninyo
  rationale: Pinananatili ang larawan ng Hebreo at natural pa rin sa marangal na Tagalog.
- source_word: כְהֻנַּת יְהוָה
  choice: ang pagkapari para kay Yahweh
  rationale: Ang כְהֻנָּה ay tumutukoy sa katungkulan o paglilingkod bilang pari. Ang “para kay Yahweh” ay malinaw na naghahayag na ang pagkapari ay paglilingkod sa kanya, nang hindi ipinapalagay na pag-aari niya ang pagkapari sa ibang diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: נַחֲלָתוֹ
  choice: kanilang mana
  rationale: Bagaman isahan ang hulaping Hebreo, kolektibo nitong tinutukoy ang Levi o ang mga Levita; natural sa Tagalog ang maramihang panghalip.
- source_word: לָקְחוּ
  choice: tumanggap na
  rationale: Sa konteksto ng legal na paghahati ng lupain, ipinahihiwatig ng pandiwa ang pagtanggap sa itinakdang mana, hindi sapilitang pag-agaw.
- source_word: נַחֲלָתָם
  choice: kanilang mana
  rationale: Maikli at natural na katumbas ng minanang takdang lupain sa konteksto ng Josue.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: sa kabila ng Jordan, sa silangan
  rationale: Malinaw na tinutukoy ang silangang panig ng Jordan at iniiwasan ang kalabuan ng “pasSilangan.”
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Ang “lingkod” ang natural at marangal na salin ng honoripikong titulong עֶבֶד sa kontekstong ito.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili bilang Yahweh sa halip na palitan ng titulo.
- issue: Kolektibong isahan sa נַחֲלָתוֹ
  choice: kanilang mana
  alternative: kanyang mana
  rationale: Isahan ang anyong Hebreo ngunit ang tinutukoy ay ang mga Levita bilang isang kolektibong pangkat. Inilalagay sa talababa ang literal na anyo upang mapanatili ang tekstuwal na detalye.
- issue: Ugnayan sa pariralang כְהֻנַּת יְהוָה
  choice: ang pagkapari para kay Yahweh
  alternative: ang pagkapari ni Yahweh / ang paglilingkod bilang pari kay Yahweh
  rationale: Pinananatili ang institusyonal na diwa ng “pagkapari” at ginagawang natural ang ugnayan nito kay Yahweh nang hindi labis na nilulutas ang lawak ng genitibong parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahagi sa lupain” upang maging hayag ang konteksto ng pamamahagi, habang pinanatili ang “mana” para sa נַחֲלָה. Ang lahat ng pangalan ay nasa karaniwang anyong Filipino.
