revisions:
- from: Sapagkat walang bahagi sa lupain ang mga Levita sa gitna ninyo, dahil ang pagkapari para kay Yahweh ang kanilang mana.[a] Ang Gad, Ruben, at ang kalahati ng lipi ni Manases ay tumanggap na ng kanilang mana sa kabila ng Jordan, sa silangan—ang ibinigay sa kanila ni Moises na lingkod ni Yahweh.
  to: Sapagkat walang bahagi sa lupain ang mga Levita sa gitna ninyo, sapagkat ang pagkapari kay Yahweh ang kanilang mana.[a] Natanggap na ng Gad, Ruben, at kalahati ng lipi ni Manases ang kanilang mana sa kabila ng Jordan, sa silangan, na ibinigay sa kanila ni Moises na lingkod ni Yahweh.
  rationale: Pinalitan ang “pagkapari para kay Yahweh” ng “pagkapari kay Yahweh” upang mas tumpak at natural na maipahayag ang pariralang Hebreo. Inayos din ang huling sugnay upang malinaw na ang mana, hindi ang lokasyong silangan, ang ibinigay ni Moises. Pinanatili ang talababa dahil wasto nitong tinatala ang kolektibong kahulugan ng isahang hulaping Hebreo.
