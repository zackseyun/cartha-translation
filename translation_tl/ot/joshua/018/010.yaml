  text: וַ/יַּשְׁלֵךְ֩ לָ/הֶ֨ם יְהוֹשֻׁ֧עַ גּוֹרָ֛ל בְּ/שִׁלֹ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְחַלֶּק שָׁ֨ם יְהוֹשֻׁ֧עַ אֶת הָ/אָ֛רֶץ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל כְּ/מַחְלְקֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: tl
  text: Pagkatapos, nagpalabunot si Josue para sa kanila sa Shilo, sa harapan ni Yahweh. Doon ay hinati ni Josue ang lupain para sa mga anak ni Israel[a] ayon sa kani-kanilang bahagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak na lalaki ni Israel.” Kolektibong tumutukoy ang pananalitang ito sa bayan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: nagpalabunutan
  rationale: Ang pariralang Hebreo ay idyoma para sa pagtatalaga sa pamamagitan ng palabunutan. Natural ito sa modernong Tagalog at malinaw na tumutukoy sa pamamaraang ginamit sa paghahati ng lupain.
- source_word: בְּשִׁלֹה
  choice: sa Shilo
  rationale: Karaniwang gamit sa Tagalog ang “sa” para sa lokasyon ng isang pangyayari sa isang bayan.
- source_word: לִפְנֵי יְהוָה
  choice: sa harapan ni Yahweh
  rationale: Pinananatili nito ang diwa ng pagkilos sa presensiya ni Yahweh, malamang sa santuwaryo, nang hindi nagdaragdag ng detalyeng hindi tahasang sinabi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalang Hebreo ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיְחַלֶּק
  choice: hinati
  rationale: Tuwirang ipinapahayag ng pandiwa ang paghahati o pamamahagi ng lupain; naipahihiwatig na ng palabunutan ang paraan ng pagtatalaga.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto ng Josue, tumutukoy ito sa teritoryong ibinabahagi sa Israel, kaya mas angkop ang “lupain” kaysa “lupa” o “daigdig.”
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Pinananatili ang anyong pampamilya ng Hebreo habang nauunawaan ang parirala bilang kolektibong tawag sa bayan ng Israel.
- source_word: כְּמַחְלְקֹתָם
  choice: ayon sa kani-kanilang bahagi
  rationale: Likas sa Tagalog ang pariralang ito at malinaw nitong inilalarawan ang mga bahaging inilaan sa bawat pangkat, nang hindi ipinapalagay na indibidwal na bahagi ang tinutukoy.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Ang “Yahweh” ay malapit na transliterasyon at iniiwasang gawing titulo ang pangalan.
- issue: Kolektibong kahulugan ng בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; mga anak na lalaki ni Israel
  rationale: Pinananatili ng salin ang larawang pampamilya ng orihinal, samantalang nililinaw sa talababa na kolektibong tumutukoy ito sa bayan at hindi lamang sa mga lalaking anak.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagpalabunutan” bilang likas na katumbas ng idyomang Hebreo, at “kani-kanilang bahagi” upang maiwasan ang matigas at di-likas na “ayon sa kanilang mga pagkakahati.”
