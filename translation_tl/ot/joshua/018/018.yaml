translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang metaporang “balikat” at ang pangalang “Araba,” ngunit nilinaw ang mga ito sa maiikling talababa. Inayos ang pagkakasunod bilang “balikat na nasa hilaga, sa tapat ng Araba” upang natural na maipahayag sa Filipino ang lokasyong tinutukoy ng Hebreo.
