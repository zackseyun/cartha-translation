  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: tl
  text: Pagkatapos, nagpatuloy ang hangganan sa balikat[b] na katapat ng Araba[a] sa hilaga, at bumaba patungo sa Araba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring mangahulugang “kapatagan” ang salitang Hebreo; maaari itong tumukoy kapuwa sa isang uri ng anyong-lupa at sa isang rehiyong may ganitong pangalan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “balikat”—isang larawang topograpikal para sa gilid, tagaytay, o dalisdis.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָבַר
  choice: Pagkatapos, nagpatuloy ang hangganan
  rationale: Sa paglalarawan ng mga hangganan, ipinahihiwatig ng pandiwa ang pagpapatuloy ng linya patungo sa susunod na palatandaan. Idinagdag ang tahasang “hangganan” bilang likas na paksa sa Filipino.
- source_word: אֶל
  choice: sa
  rationale: Likas na panandang direksiyon o hantungan sa Filipino sa kontekstong heograpikal.
- source_word: כֶּתֶף
  choice: balikat
  rationale: Pinananatili ang konkretong metaporang topograpikal ng Hebreo para sa gilid, tagaytay, o dalisdis; nililinaw ito sa talababa.
- source_word: מוּל
  choice: sa tapat ng
  rationale: Malinaw na ipinapahayag ang ugnayang panglokasyon nang hindi pinapalagay na may pagtawid.
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Pinananatili bilang pangalang heograpikal ang terminong Hebreo, habang kinikilala sa talababa na maaari rin itong maging karaniwang katawagan sa anyong-lupa.
- source_word: צָפֹנָה
  choice: na nasa hilaga
  rationale: Inilalarawan nito ang hilagang kinalalagyan ng balikat, sa halip na ipahiwatig ang kilos na pahilaga.
- source_word: וְיָרַד
  choice: at bumaba
  rationale: Natural at tuwirang salin ng pagbaba ayon sa anyo ng lupain.
- source_word: הָעֲרָבָתָה
  choice: sa Araba
  rationale: Ipinahihiwatig ng hulaping direksiyonal ang pagpunta patungo sa Araba; ang “sa” ay natural sa Filipino at hindi labis na nagpapasiya kung hanggang o papasok dito.
