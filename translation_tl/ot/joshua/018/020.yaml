- from: At ang Jordan ang naging hangganan nito sa silangang panig.[a] Ito ang mana ng mga inapo ni Benjamin, ayon sa mga hangganan nito sa palibot, para sa kani-kanilang angkan.
  to: Ang Jordan ang nagsilbing hangganan nito sa silangang panig.[a] Ito ang mana ng mga inapo ni Benjamin, ayon sa mga hangganan nito sa palibot, ayon sa kani-kanilang angkan.
  rationale: Ginawang mas likas ang unang pangungusap, nilinaw ang distributibong ugnayan sa “mga angkan,” at inayos ang Tagalog ng talababa. Walang binagong impormasyon o idinagdag na interpretasyong pangdoktrina.
