base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: tl
  text: Ang Jordan ang nagsilbing hangganan nito sa silangang panig.[a] Ito ang mana ng mga inapo ni Benjamin, ayon sa mga hangganan nito sa palibot, ayon sa kani-kanilang angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang nagtakda ng hangganan nito” o “ang nagsilbing hangganan nito.” Ipinahihiwatig ng pandiwang Hebreo na ang Jordan ang nagsilbing hangganan ng teritoryo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: At ang Jordan
  rationale: Ang pangalang Jordan ay karaniwang nauunawaan bilang ilog; hindi kailangang idagdag ang “Ilog” sa pangunahing teksto.
- source_word: יִגְבֹּל אֹתוֹ
  choice: ang naging hangganan nito
  rationale: Sa kontekstong teritoryal, ang גבל ay nagsasaad na ang Jordan ang nagsilbing hangganan ng lupain; natural ito sa modernong Tagalog.
- source_word: לִפְאַת קֵדְמָה
  choice: sa silangang panig
  rationale: Tuwirang ipinapahayag ang panig o gilid ng teritoryo na nasa silangan.
- source_word: נַחֲלַת
  choice: mana
  rationale: Pinananatili ang diwa ng lupaing minana o itinakdang bahagi ng lipi, gamit ang maikli at likas na salitang Tagalog.
- source_word: בְּנֵי בִנְיָמִן
  choice: mga inapo ni Benjamin
  rationale: Bagaman literal na “mga anak na lalaki ni Benjamin,” isa itong katawagang panlipi; ang “mga inapo” ay malinaw at hindi nagmumungkahing mga tuwirang anak lamang.
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: ayon sa mga hangganan nito sa palibot
  rationale: Inilalarawan nito ang kabuuang nakatakdang mga hangganan sa paligid ng mana.
- source_word: לְמִשְׁפְּחֹתָם
  choice: para sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחוֹת ay tumutukoy sa mga pangkat-angkan sa loob ng lipi; ipinakikita ng “kani-kanilang” ang pamamahagi ayon sa mga angkan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mana” para sa lupaing inilaan sa lipi, “mga inapo” para sa panliping katawagang בְּנֵי, at “angkan” para sa pangkat-pamilyang מִשְׁפָּחָה.
