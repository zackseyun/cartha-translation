  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: tl
  text: At sinabi ni Josue sa mga anak ni Israel[a], “Hanggang kailan kayo magpapabaya na pumasok upang angkinin ang lupaing ibinigay sa inyo ni Yahweh, ang Diyos ng inyong mga ama?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Israelita.” Literal na, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang pagsulong ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ang ugnayang lohikal.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ito ang nakasanayang anyo ng pangalang biblikal sa Filipino.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tuwirang pinananatili ang pampamilyang pahayag ng Hebreo; nililinaw sa talababa ang mas natural na alternatibong panumbas.
- source_word: עַד־אָנָה
  choice: Hanggang kailan
  rationale: Natural na idyomang Filipino para sa temporal na hamong may pagsaway.
- source_word: מִתְרַפִּים
  choice: magpapabaya
  rationale: Ipinahahayag ang pagiging maluwag, kulang sa pagkilos, o pabaya nang hindi pinatitindi ito bilang tahasang katamaran.
- source_word: לָבוֹא
  choice: sa pagpasok
  rationale: Ipinakikita ang pagkilos papasok sa lupa at likas na inuugnay sa pandiwang “magpapabaya.”
- source_word: לָרֶשֶׁת
  choice: upang angkinin
  rationale: Sinasaklaw ang pagkuha at pagtatalaga sa sarili ng lupa bilang pag-aari, nang hindi nililimitahan ang diwa sa legal na pagmamana lamang.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Tumutukoy sa tiyak na lupang ipinangako sa Israel.
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: ibinigay sa inyo
  rationale: Pinananatili ang ganap na pagkakaloob ng Diyos kahit hindi pa lubusang nasasakop ng Israel ang lupa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: ang Diyos ng inyong mga ama
  rationale: Pinananatili ang literal at tipanang pormula ng Hebreo, kasama ang pagtukoy sa mga lalaking ninuno.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na gumamit ng pamalit na titulo.
- issue: Naibigay na ang lupa ngunit kailangan pa itong angkinin
  choice: “ibinigay sa inyo” kasabay ng “angkinin”
  alternative: “ibibigay sa inyo”
  rationale: 'Pinananatili ang tensiyon sa Hebreo: ganap nang ipinagkaloob ng Diyos ang lupa, ngunit kailangan pa itong pasukin at ariin ng Israel.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pormal na “mga anak ni Israel” at “Diyos ng inyong mga ama” upang maipakita ang pampamilya at tipanang wika ng Hebreo; ang natitirang pangungusap ay ginawang natural para sa karaniwang mambabasa.
