base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: tl
  text: Pagkatapos, dumaan ang hangganan sa hilagang dalisdis ng Bet-hogla. Nagtapos ang hangganan sa hilagang bahaging hugis-dila[a] ng Dagat na Asin[b], sa timog na dulo ng Jordan. Ito ang hangganan sa timog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “dila”; isang heograpikong paglalarawan sa bahaging hugis-dila, gaya ng isang look, pasukan ng tubig, o nakausling bahagi.
    reason: lexical_alternative
  - marker: b
    text: Tinatawag din na “Dagat na Patay”; “Dagat na Asin” ang nasa tekstong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: Pagkatapos, dumaan ang hangganan
  rationale: Sa paglalarawan ng mga hangganan, ang עָבַר ay tumutukoy sa pagpapatuloy o pagdaan ng linya ng hangganan sa isang lugar. Natural at malinaw sa Filipino ang “dumaan.”
- source_word: כֶּתֶף
  choice: dalisdis
  rationale: Literal itong “balikat,” ngunit sa heograpiya ay tumutukoy sa tagiliran o dalisdis ng isang lupain. Pinananatili ng “dalisdis” ang topograpikong diwa nang hindi nagiging malabo sa karaniwang mambabasa.
- source_word: בֵּית חָגְלָה
  choice: Bet-hogla
  rationale: Isinalin sa baybay-Filipino bilang pangalan ng lugar, sa halip na isalin ang mga bahagi ng pangalan.
- source_word: צָפוֹנָה
  choice: hilagang
  rationale: Dito ay inilalarawan nito ang kinalalagyan ng dalisdis ng Bet-hogla at ng bahaging hugis-dila ng dagat.
- source_word: תצאותיו הַגְּבוּל
  choice: Nagtapos ang hangganan
  rationale: Sa pormula ng pagtatakda ng hangganan, tumutukoy ito sa hantungan o dulo ng linya. Ang “nagtapos” ay malinaw at likas sa modernong Filipino.
- source_word: לְשׁוֹן
  choice: bahaging hugis-dila
  rationale: Literal na “dila” at ginamit bilang heograpikong larawan. Ang “bahaging hugis-dila” ay nagpapanatili sa kongkretong larawan ng Hebreo nang hindi tiyakang nagpapasya kung ito ay look, pasukan ng tubig, o nakausling lupain.
- source_word: יָם הַמֶּלַח
  choice: Dagat na Asin
  rationale: Pinananatili ang mismong pangalang nasa tekstong Hebreo sa halip na palitan agad ng makabagong tawag na “Dagat na Patay.”
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: sa timog na dulo ng Jordan
  rationale: Ang קָצֶה ay “dulo” o “hangganang bahagi,” at tinutukoy ng נֶגְבָּה ang timog na panig.
- source_word: זֶה גְּבוּל נֶגֶב
  choice: Ito ang hangganan sa timog
  rationale: Sa kontekstong ito, direksiyon ang gamit ng נֶגֶב, hindi pangalan ng rehiyong Negev.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinanatili ang pormula ng sinaunang paglalarawan ng hangganan, habang iniwasan ang sobrang literal na “balikat” at ang malabong nag-iisang salitang “dila” sa pangunahing teksto.
