translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong pangheograpiya at malapit na transliterasyong angkop sa pagbasa ng Filipino; pinanatili sa talababa ang literal na larawang 'balikat' at ang alternatibong anyo ng pangalan.
