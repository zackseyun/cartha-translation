base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: tl
  text: Mula roon, dumaan ang hangganan patungong Luz[a], sa timog na dalisdis ng Luz[b] (iyon ay Bethel). Pagkatapos, bumaba ang hangganan patungong Atrot-adar[c], sa bundok na nasa timog ng Mababang Beth-horon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dito, ang Luz ay kinikilalang Bethel.
    reason: cross_reference
  - marker: b
    text: O “sa balikat ng Luz sa timog.” Ginagamit dito ang salitang Hebreo para sa “balikat” upang tukuyin ang gilid o dalisdis ng isang burol.
    reason: lexical_alternative
  - marker: c
    text: Ang Atrot-adar ay binabaybay ding “Atarot-adar” sa ilang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: dumaan
  rationale: Likas na paglalarawan sa pag-usad ng guhit ng hangganan, nang hindi ipinahihiwatig na mga tao ang tumatawid.
- source_word: הַגְּבוּל
  choice: ang hangganan
  rationale: Karaniwang makabagong salitang Filipino para sa hangganang panteritoryo.
- source_word: לוּזָה
  choice: patungong Luz
  rationale: Pinanatili ang pangalang-pook at ipinahayag sa 'patungong' ang Hebreong hulaping nagsasaad ng direksiyon.
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: sa dalisdis sa timog ng Luz
  rationale: Ang כֶּתֶף ay literal na 'balikat' ngunit tumutukoy sa gilid o dalisdis sa kontekstong topograpiko; malinaw at likas dito ang 'dalisdis sa timog.'
- source_word: הִיא בֵּית אֵל
  choice: iyon ay Bethel
  rationale: Pinananatili ang tahasang pagkakakilanlan sa teksto nang hindi dinaragdagan ang paliwanag.
- source_word: וְיָרַד
  choice: bumaba
  rationale: Pinananatili ang topograpikong larawan ng pagbaba ng hangganan.
- source_word: עַטְרוֹת אַדָּר
  choice: Atarot-adar
  rationale: Malapit na transliterasyon sa bigkas ng Hebreo at madaling basahin sa Filipino.
- source_word: עַל הָהָר
  choice: sa bundok
  rationale: Pinananatili ang tiyak at isahang anyo ng topograpikong reperensiya.
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: na nasa timog ng Mababang Beth-horon
  rationale: Tuwirang ipinahahayag ang lokasyon sa timog at isinasalin ang panuring na תַּחְתּוֹן bilang bahagi ng pagkilala sa pook.
