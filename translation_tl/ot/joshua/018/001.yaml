id: JOS.18.1
reference: Joshua 18:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: tl
  text: At nagtipon sa Shilo ang buong kapulungan ng mga anak ni Israel. Itinayo nila roon ang Toldang Tipanan, at ang lupain ay nasakop na sa harap nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang lupain ay napasuko na sa harap nila.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: nagtipon
  rationale: Likas na makabagong Tagalog para sa Niphal ng קהל, habang pinananatili ang diwa ng sama-samang pagbuo ng kapulungan.
- source_word: כָּל עֲדַת
  choice: ang buong kapulungan
  rationale: Tuwirang ipinapahayag ang כָּל at ang kolektibo at pormal na diwa ng עֵדָה.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang anyo ng Hebreong pananalita at ang katawagang pangtipan, sa paraang natural din sa tradisyong Tagalog.
- source_word: שִׁלֹה
  choice: Shilo
  rationale: Karaniwang anyong transliterado sa Filipino para sa pangalang-lugar.
- source_word: וַיַּשְׁכִּינוּ
  choice: Itinayo nila
  rationale: Sa konteksto ng tolda, malinaw at natural itong katumbas ng Hiphil na may diwang 'pinamalagi' o 'inilagay'; iniiwasan ang kahoy na literalismo.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Dignified at pamilyar na katawagang Filipino para sa sagradong tolda ng pakikipagtagpo; ipinahihiwatig ang itinakdang pakikipagtagpo nang hindi gumagamit ng mas malabong 'tabernakulo.'
- source_word: נִכְבְּשָׁה
  choice: nasakop na
  rationale: Ipinapakita ang pasibong kalagayan na ang lupain ay napailalim na sa kanilang kapangyarihan. Ang 'na' ay natural na naghahayag ng resultang kalagayan sa Tagalog.
- source_word: לִפְנֵיהֶם
  choice: sa harap nila
  rationale: Pinananatili ang Hebreong idyomang literal, sa halip na tahasang bigyang-kahulugang 'sa ilalim ng kanilang kapangyarihan.'
theological_decisions:
- issue: Kolektibong katawagan sa Israel
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang kongkretong Hebreong anyo at pagkakakilanlang pangtipan nang hindi ipinapalagay na bawat tinutukoy ay lalaking nasa hustong gulang.
- issue: Saklaw ng pananakop na ipinahihiwatig ng נִכְבְּשָׁה
  choice: ang lupain ay nasakop na sa harap nila
  alternative: ang lupain ay napasuko na sa harap nila
  rationale: Ipinahahayag ang pagkapailalim ng lupain ngunit hindi dinaragdagan ang talata ng pahayag na ganap at lubos nang nasakop ang bawat bahagi nito; inilalahad sa talababa ang mas malapit na alternatibong 'napasuko.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Gumamit ng malinaw na mga pandiwa at pinanatili ang Hebreong idyomang “sa harap nila.” Ang pangungusap ay hinati sa dalawa para sa likas na daloy sa Filipino nang hindi binabago ang ugnayan ng mga sugnay.
