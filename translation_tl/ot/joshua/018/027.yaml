- source_word: רֶקֶם
  choice: Rekem
  rationale: Pangalan ng isang lugar sa talaan ng mga bayan. Isinatinig ito ayon sa anyong Hebreo sa halip na isalin ang posibleng kahulugan.
- source_word: יִרְפְּאֵל
  choice: Irpeel
  rationale: Pangalan ng isang lugar. Pinanatili ang nakasanayang anyong “Irpeel,” na malinaw at madaling basahin sa Filipino; ang unang yod ay kinakatawan ng I.
- source_word: תַרְאֲלָה
  choice: Tarala
  rationale: Pangalan ng isang lugar sa mana ng Benjamin. Ang hulihang ה ay bahagi ng patinig na pangwakas, kaya natural itong isinatinig bilang “Tarala” sa Filipino.
- source_word: וְ
  choice: at
  rationale: Ang unlaping pang-ugnay ay nagdurugtong sa mga pangalan sa payak na talaan; sa natural na Filipino, mga kuwit at “at” bago ang huling pangalan ang ginamit.
