id: JOS.18.15
reference: Joshua 18:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/פְאַת נֶ֕גְבָּ/ה מִ/קְצֵ֖ה קִרְיַ֣ת יְעָרִ֑ים וְ/יָצָ֤א הַ/גְּבוּל֙ יָ֔מָּ/ה וְ/יָצָ֕א אֶל מַעְיַ֖ן מֵ֥י נֶפְתּֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: tl
  text: Ang timog na panig ay mula sa dulo ng Kiriat-jearim. Ang hangganan ay tumuloy pakanluran[a] at umabot sa bukal ng tubig ng Neftoa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “patungo sa dagat”; sa heograpiyang ito, ang ibig sabihin ay “pakanluran.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “bukal ng mga tubig ng Neftoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: Ang timog na panig
  rationale: Ang פֵאָה ay panig o gilid, at ang נֶגְבָּה ay tumutukoy rito sa timog na panig ng hangganan.
- source_word: מִקְצֵה
  choice: mula sa dulo ng
  rationale: Ang קָצֶה ay dulo, gilid, o kadulu-duluhan. Ang “dulo” ay natural sa paglalarawan ng hangganan.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriat-jearim
  rationale: Isinalin sa baybay-Tagalog ang transliterasyon ng pangalan ng lugar sa halip na isalin ang kahulugan nito.
- source_word: וְיָצָא הַגְּבוּל
  choice: Ang hangganan ay tumuloy
  rationale: Sa mga pormula ng hangganan sa Josue, ang יָצָא ay naglalarawan sa pagpapatuloy o pag-abot ng guhit ng hangganan. Mas natural sa Filipino ang “tumuloy” kaysa literal na “lumabas.”
- source_word: יָמָּה
  choice: pakanluran
  rationale: Literal itong “patungo sa dagat,” ngunit sa heograpiya ng Israel ay karaniwang direksiyong kanluran ang tinutukoy.
- source_word: וְיָצָא אֶל
  choice: at umabot sa
  rationale: Pinananatili ang ikalawang pandiwang יָצָא bilang panibagong paggalaw ng hangganan, ngunit ginawang natural sa Filipino bilang “umabot sa.”
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: bukal ng tubig ng Neftoa
  rationale: Ang מַעְיָן ay “bukal,” at ang מֵי ay anyong maramihan ng “tubig.” Ang pariralang Filipino ay malinaw at natural habang pinananatili ang ugnayang nasa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang karaniwang bokabularyo sa paglalarawan ng hangganan, at pinanatili sa mga talababa ang mga literal na anyong Hebreo na magiging mabigat sa pangunahing teksto.
