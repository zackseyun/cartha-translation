- from: Lumabas ang palabunot para sa lipi ng mga anak ni Benjamin, ayon sa kanilang mga angkan. Ang teritoryong napunta sa kanila sa palabunutan[a] ay nasa pagitan ng mga anak ni Juda at ng mga anak ni Jose.[b]
