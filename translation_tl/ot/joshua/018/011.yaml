  text: וַ/יַּ֗עַל גּוֹרַ֛ל מַטֵּ֥ה בְנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יֵּצֵא֙ גְּב֣וּל גּֽוֹרָלָ֔/ם בֵּ֚ין בְּנֵ֣י יְהוּדָ֔ה וּ/בֵ֖ין בְּנֵ֥י יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: tl
  text: At lumabas ang palabunot para sa lipi ng mga anak ni Benjamin, ayon sa kanilang mga angkan, at ang teritoryong itinakda ng kanilang palabunot[a] ay nasa pagitan ng mga anak ni Juda at ng mga anak ni Jose.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang “teritoryo” bilang “hangganan”: “ang hangganan ng bahaging itinakda ng kanilang palabunot.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Jose” ay kolektibong tumutukoy sa mga liping nagmula kay Jose, lalo na sa Efraim at Manases.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: Lumabas
  rationale: Pinananatili nito ang konkretong larawan ng loteng lumalabas sa proseso ng palabunutan, nang hindi ito ginagawang tahasang pasibo na “nabunot.”
- source_word: גּוֹרָל
  choice: palabunot
  rationale: Tumutukoy ito sa loteng ginagamit sa paghahati ng lupain. Mas malinaw sa kasalukuyang Tagalog ang “palabunot” kaysa sa “kapalaran,” na maaaring unawaing tadhana.
- source_word: מַטֵּה
  choice: lipi
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa pangkat-tribo, hindi sa literal na tungkod. Ang “lipi” ay likas at marangal na salin sa Tagalog.
- source_word: בְנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang Hebreong pananalitang nakabatay sa angkan habang malinaw na tumutukoy sa mga kabilang sa lipi ni Benjamin.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Ang מִשְׁפָּחוֹת ay mga pangkat-angkan sa loob ng lipi; mas tiyak dito ang “angkan” kaysa sa pangkalahatang “pamilya.”
- source_word: וַיֵּצֵא
  choice: napunta
  rationale: Sa ikalawang sugnay, natural nitong ipinapahayag ang kinalabasan ng palabunutan sa Tagalog habang hindi inuulit nang alanganin ang “lumabas.”
- source_word: גְּבוּל גּוֹרָלָם
  choice: teritoryong napunta sa kanila sa palabunutan
  rationale: Dito, ang גְּבוּל ay maaaring tumukoy sa lupaing nasasaklaw ng hangganan. Ang saling ito ay likas sa Tagalog at pinananatili ang kaugnayan sa palabunutan; inilalahad sa talababa ang mas literal na “hangganan.”
- source_word: בֵּין ... וּבֵין
  choice: nasa pagitan ng ... at ng ...
  rationale: Tuwirang ipinapahayag nito ang kinalalagyan ng bahagi ni Benjamin sa pagitan ng Juda at Jose.
- source_word: בְנֵי יְהוּדָה
  choice: mga anak ni Juda
  rationale: Pinananatili ang Hebreong pormulang pangkamag-anakan at ang pagkakatugma sa “mga anak ni Benjamin” at “mga anak ni Jose.”
- source_word: בְנֵי יוֹסֵף
  choice: mga anak ni Jose
  rationale: Pormal na pinananatili ang Hebreong pananalita; nililinaw sa talababa na kolektibo itong tumutukoy sa mga liping nagmula kay Jose.
theological_decisions:
- issue: Saklaw ng pariralang “mga anak ni Jose”
  choice: Panatilihin ang literal na pananalita at linawin sa talababa ang kolektibong kahulugan nito.
  alternative: Isalin nang tahasan bilang “mga lipi nina Efraim at Manases.”
  rationale: Hindi tahasang pinapangalanan ng talata sina Efraim at Manases. Ang literal na anyo ay nagpapanatili sa wika at bahagyang implikasyon ng pinagmulan, samantalang ang talababa ay nagbibigay ng kinakailangang kontekstong pangkasaysayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “palabunot” upang iwasan ang posibleng kahulugan ng “kapalaran” bilang tadhana, at hinati sa dalawang pangungusap upang maging natural basahin nang hindi nawawala ang sunod-sunod na kilos sa Hebreo.
