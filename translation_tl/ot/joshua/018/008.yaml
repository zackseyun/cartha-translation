language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּקֻ֥מוּ הָ/אֲנָשִׁ֖ים וַ/יֵּלֵ֑כוּ וַ/יְצַ֣ו יְהוֹשֻׁ֡עַ אֶת הַ/הֹלְכִים֩ לִ/כְתֹּ֨ב אֶת הָ/אָ֜רֶץ לֵ/אמֹ֗ר לְ֠כוּ וְ/הִתְהַלְּכ֨וּ בָ/אָ֜רֶץ וְ/כִתְב֤וּ אוֹתָ/הּ֙ וְ/שׁ֣וּבוּ אֵלַ֔/י וּ֠/פֹה אַשְׁלִ֨יךְ לָ/כֶ֥ם גּוֹרָ֛ל לִ/פְנֵ֥י יְהוָ֖ה בְּ/שִׁלֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: tl
  text: Kaya tumindig ang mga lalaki at umalis. Inutusan ni Josue ang mga pupunta upang itala ang lupain[a]. Sinabi niya, “Humayo kayo at libutin ang lupain. Itala ninyo ito at bumalik kayo sa akin. Dito sa Shilo, magpapalabunutan ako para sa inyo sa harap ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ilarawan sa sulat ang lupain.” Literal sa Hebreo, “isulat ang lupain”; tumutukoy ito sa paggawa ng nakasulat na pagsisiyasat o paglalarawan para sa paghahati-hati ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: tumindig ang mga lalaki at umalis
  rationale: Pinananatili ng “tumindig” ang sunod-sunod na kilos ng salaysay, at tumpak na tinutukoy ng “mga lalaki” ang partikular na mga lalaking kinatawan.
- source_word: וַיְצַו
  choice: Inutusan
  rationale: Ipinahahayag nito ang tagubilin ni Josue na may awtoridad nang hindi nagiging di-likas sa makabagong Tagalog.
- source_word: לִכְתֹּב אֶת הָאָרֶץ
  choice: upang itala ang lupain
  rationale: Literal na “isulat ang lupain,” ngunit sa konteksto ay tumutukoy sa paggawa ng nakasulat na tala o paglalarawan para sa paghahati-hati nito.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: libutin ang lupain
  rationale: Ang anyong Hitpael ay nagpapahiwatig ng paglalakad o paggalaw sa iba't ibang bahagi ng lupain; natural itong naipahahayag ng “libutin.”
- source_word: וְכִתְבוּ אוֹתָהּ
  choice: Itala ninyo ito
  rationale: Ang panghalip ay tumutukoy sa lupain, at pinananatili ng “itala” ang diwa ng paggawa ng nakasulat na rekord.
- source_word: וְשׁוּבוּ אֵלַי
  choice: bumalik kayo sa akin
  rationale: Tuwiran at natural na katumbas ng utos na bumalik kay Josue.
- source_word: אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: magpapalabunutan ako para sa inyo
  rationale: Natural na idyomang Filipino para sa pagpapasiya o pagtatalaga sa pamamagitan ng palabunutan; ang isahang Hebrew na גּוֹרָל ay tumutukoy sa paraang ito ng pagtatalaga.
- source_word: בְּשִׁלֹה
  choice: sa Shilo
  rationale: Karaniwang malinaw na transliterasyon sa Filipino ng pangalang pook.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit sa teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kasarian ng הָאֲנָשִׁים
  choice: mga lalaki
  alternative: mga tao
  rationale: Ang salita ay panlalaking maramihan at sa konteksto ay tumutukoy sa mga lalaking kinatawang isinugo upang siyasatin at itala ang lupain.
- issue: Kahulugan ng palabunutan sa harap ni Yahweh
  choice: magpapalabunutan ako para sa inyo sa harap ni Yahweh
  alternative: itatalaga ko sa inyo ang lupain sa pamamagitan ng palabunutan
  rationale: Pinananatili nito ang mismong kilos sa teksto at ang ugnayan nito sa presensya ni Yahweh, nang hindi labis na ipinapaliwanag ang teolohikal na mekanismo ng pasiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Humayo” sa tuwirang utos para sa bahagyang pormal na himig ng salaysay, ngunit pinanatiling natural ang iba pang mga pandiwa. Iniwasan ang teknikal na “imapa” dahil mas tiyak iyon kaysa sa ipinahahayag ng Hebrew.
