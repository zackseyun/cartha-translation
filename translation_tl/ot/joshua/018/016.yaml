  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga pangalang pantangi sa anyong madaling bigkasin sa Tagalog. Iniwasan ang tahasang pagdaragdag ng ‘lungsod’ sa ‘Jebuseo’ upang mapanatili ang porma at kalabuan ng Hebreo.
