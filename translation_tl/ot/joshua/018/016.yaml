id: JOS.18.16
reference: Joshua 18:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יָרַ֨ד הַ/גְּב֜וּל אֶל קְצֵ֣ה הָ/הָ֗ר אֲשֶׁר֙ עַל פְּנֵי֙ גֵּ֣י בֶן הִנֹּ֔ם אֲשֶׁ֛ר בְּ/עֵ֥מֶק רְפָאִ֖ים צָפ֑וֹנָ/ה וְ/יָרַד֩ גֵּ֨י הִנֹּ֜ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ נֶ֔גְבָּ/ה וְ/יָרַ֖ד עֵ֥ין רֹגֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: tl
  text: Pagkatapos, bumaba ang hangganan sa dulo ng bundok na nakaharap sa Lambak ng Ben-Hinom[a], na nasa hilagang bahagi ng Lambak ng Refaim. Mula roon, bumaba ito sa Lambak ng Hinom patungo sa timog na dalisdis ng Jebuseo[b], at bumaba hanggang sa En-Rogel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Lambak ng anak ni Hinom”; ginamit dito ang “Ben-Hinom” bilang pangalan ng lugar.
    reason: lexical_alternative
  - marker: b
    text: O “sa timog na tagiliran ng Jebuseo.” Maaaring tumukoy ang “Jebuseo” sa pamayanang Jebuseo, samakatuwid ay sa Jerusalem, ngunit walang salitang “lungsod” sa Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Pangalan ng lugar ang En-Rogel; literal itong nangangahulugang “bukal ng Rogel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: bumaba ang hangganan
  rationale: Pinananatili ang topograpikong diwa ng ירד na ‘bumaba’ at ang גְּבוּל bilang guhit ng hangganan ng lupain.
- source_word: קְצֵה הָהָר
  choice: sa dulo ng bundok
  rationale: Tuwirang inilalarawan ng קָצֶה ang dulo o dulong bahagi, at ng הָר ang bundok; hindi pinapalitan ng mas tiyak na ‘burol’ dahil hindi iyon hinihingi ng Hebreo.
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: na nakaharap sa Lambak ng Ben-Hinom
  rationale: Ang עַל־פְּנֵי ay nagsasaad dito ng ugnayang panglokasyon na ‘nakaharap sa’ o ‘katapat ng.’ Ginamit ang Ben-Hinom bilang pangalang pantangi.
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: na nasa hilagang bahagi ng Lambak ng Refaim
  rationale: Ipinahahayag ang direksiyong צָפוֹנָה nang natural, habang iniiwasang gawing tiyak na ‘hilagang dulo’ ang maaaring mangahulugang lokasyon sa gawing hilaga.
- source_word: וְיָרַד גֵּי הִנֹּם
  choice: Mula roon, bumaba ito sa Lambak ng Hinom
  rationale: Ang ‘ito’ ay tumutukoy sa hangganan. Ang ‘Mula roon’ ay likas na pang-ugnay sa Filipino at hindi nagdaragdag ng bagong lokasyong wala sa konteksto.
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: patungo sa timog na dalisdis ng Jebuseo
  rationale: Ang כֶּתֶף, literal na ‘balikat,’ ay topograpikong tumutukoy sa dalisdis o tagiliran. Hindi idinagdag ang ‘lungsod’ dahil wala ito sa Hebreo; pinananatili ng ‘ng Jebuseo’ ang metonimikong kalabuan ng pinagmulan.
- source_word: עֵין רֹגֵל
  choice: En-Rogel
  rationale: Pangalan ito ng lugar kaya isinalin sa pamamagitan ng transliterasyon sa halip na gawing ‘bukal ni Rogel.’
