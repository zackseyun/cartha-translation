  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: tl
  text: Kaya nagpunta ang mga lalaki at nilibot ang lupain. Itinala nila ito ayon sa mga lungsod, sa pitong bahagi, sa isang nakasulat na dokumento. Pagkatapos, pumunta sila kay Josue sa kampo sa Shilo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ הָאֲנָשִׁים
  choice: umalis ang mga lalaki
  rationale: Ang הלך ay karaniwang pandiwa ng pagkilos sa salaysay. Ang “umalis” ay likas sa konteksto ng mga lalaking isinugo, at pinananatili ng “mga lalaki” ang tiyak na pagtukoy sa mga kinatawang binanggit sa naunang talata.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: nilibot nila ang lupain
  rationale: Sa kontekstong ito, ang עבר ב ay tumutukoy sa pagdaan o pagtawid sa buong teritoryo upang siyasatin ito. Mas natural sa Filipino ang “nilibot” kaysa sa literal na “dumaan sa,” nang hindi dinaragdagan ang layunin ng gawain.
- source_word: וַיִּכְתְּבוּהָ
  choice: Itinala nila ito
  rationale: Ang hulaping pambabae na isahan ay tumutukoy pabalik sa “lupain.” Ipinahahayag ng “itinala” ang pagsulat ng nakalap na paglalarawan, samantalang ang “ito” ay nagpapanatili sa reperensiya ng Hebreo.
- source_word: לֶעָרִים
  choice: ayon sa mga lungsod
  rationale: Malamang na inilalarawan ng parirala ang paraan ng pagsasaayos ng tala—lungsod ayon sa lungsod. Pinananatili ng “ayon sa” ang ugnayang ipinahihiwatig ng ל nang hindi ito ginagawang mas tiyak kaysa sa Hebreo.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: sa pitong bahagi
  rationale: Ang חֲלָקִים ay mga bahagi o paghahati. Ang neutral na “bahagi” ay angkop sa paghahati ng lupain at hindi agad ipinapalagay ang teknikal na kahulugang “mga mana.”
- source_word: עַל סֵפֶר
  choice: sa isang kasulatan
  rationale: Ang סֵפֶר ay maaaring tumukoy sa balumbon, aklat, o nakasulat na dokumento. Ang “kasulatan” ay natural na pangkalahatang tawag sa nakasulat na tala at hindi nagtatakda ng tiyak na pisikal na anyo.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ
  choice: pumunta sila kay Josue
  rationale: Literal na nagsasaad ang בוא na sila ay dumating o pumunta kay Josue. Hindi ginamit ang “bumalik” sapagkat bagaman ipinahihiwatig iyon ng konteksto, hindi iyon tahasang nasa pandiwang Hebreo.
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: sa kampo sa Shilo
  rationale: Tinutukoy ng parirala ang kinaroroonan ni Josue. Ang “sa kampo sa Shilo” ay malinaw at likas sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinili ang maiikling sugnay upang maging madaling basahin habang pinananatili ang sunod-sunod na pagkilos sa Hebreong salaysay. Ginamit ang tradisyonal na anyong Filipino na “Josue” at ang tuwirang transliterasyong “Shilo.”
