- from: Kaya umalis ang mga lalaki at nilibot nila ang lupain. Itinala nila ito ayon sa mga lungsod[a], sa pitong bahagi, sa isang kasulatan[b]. Pagkatapos, pumunta sila kay Josue sa kampo sa Shilo.
  to: Kaya nagpunta ang mga lalaki at nilibot ang lupain. Itinala nila ito ayon sa mga lungsod, sa pitong bahagi, sa isang nakasulat na dokumento. Pagkatapos, pumunta sila kay Josue sa kampo sa Shilo.
