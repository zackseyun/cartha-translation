source:
  edition: WLC
  text: וְ/צֵלַ֡ע הָאֶ֜לֶף וְ/הַ/יְבוּסִ֨י הִ֤יא יְרֽוּשָׁלִַ֨ם֙ גִּבְעַ֣ת קִרְיַ֔ת עָרִ֥ים אַרְבַּֽע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶ֑ן זֹ֛את נַֽחֲלַ֥ת בְּנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: tl
  text: Zela, Haelef[a], ang Jebuseo[b] (na siyang Jerusalem), Gibea[a], at Kiriat[c]—labing-apat na lungsod kasama ang mga nayon ng mga iyon. Ito ang mana ng mga anak ni Benjamin ayon sa kani-kanilang angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Haelef ay isinasalin din bilang “Elef,” at ang Gibea bilang “Gibeat” o “Gibeath.”
    reason: alternative_reading
  - marker: b
    text: 'Literal sa Hebreo: “ang Jebuseo, iyon ay Jerusalem.” Bagaman karaniwang katawagan sa isang Jebuseo ang anyong ito, ginagamit ito rito bilang pangalan o pantukoy sa lugar.'
    reason: lexical_alternative
  - marker: c
    text: “Kiriat” lamang ang mababasa sa tekstong Hebreo ng talatang ito; wala rito ang “Jearim” ng pangalang Kiriat-jearim.
    reason: textual_clarification
lexical_decisions:
- source_word: וְ/צֵלַע
  choice: Zela
  rationale: Pangalan ng lugar; tinumbasan sa baybay na angkop sa Filipino sa halip na isalin ang kahulugan.
- source_word: הָאֶלֶף
  choice: Haelef
  rationale: Pinanatili ang anyong may panlaping pantukoy na ha- sa tekstong Hebreo; ginamit ang f para sa letrang pe na may tunog /f/.
- source_word: וְ/הַ/יְבוּסִי הִיא יְרוּשָׁלִַם
  choice: ang Jebuseo (na siyang Jerusalem)
  rationale: Ang Jebuseo ay pormal na katawagan sa isang tao o pangkat, ngunit dito ay ginagamit bilang pantukoy sa lugar. Pinanatili ng pariralang “na siyang Jerusalem” ang paliwanag ng Hebreong הִיא.
- source_word: גִּבְעַת
  choice: Gibea
  rationale: Ginamit ang likas at nakikilalang anyo ng pangalang ito sa Filipino; ang mas mahigpit na transliterasyong “Gibeat” ay inilalahad bilang posibilidad sa talababa.
- source_word: קִרְיַת
  choice: Kiriat
  rationale: Pangalan ng lugar na isinalin ayon sa anyong aktuwal na nasa talata; hindi idinagdag ang “Jearim,” na wala sa tekstong Hebreo rito.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה
  choice: labing-apat na lungsod
  rationale: Tuwirang salin ng bilang at ng pangmaramihang עָרִים sa talaan ng mga pamayanan.
- source_word: וְ/חַצְרֵי/הֶן
  choice: kasama ang mga nayon ng mga iyon
  rationale: Sa konteksto ng paghahati ng lupain, ang חָצֵר ay tumutukoy sa maliliit o hindi napapaderang pamayanang kaugnay ng mga lungsod.
- source_word: זֹאת נַחֲלַת
  choice: Ito ang mana
  rationale: Pinanatili ang walang pandiwang pangwakas na pormula ng Hebreo at ginamit ang karaniwang salitang Filipino para sa minanang bahagi ng lupain.
- source_word: בְּנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinanatili ang pampamilya at pantribong idyomang “mga anak ni Benjamin” sa halip na gawing pangkalahatang “mga mamamayan.”
- source_word: לְ/מִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa paghahati ng lupain, ang מִשְׁפָּחָה ay tumutukoy sa mga sangay o angkan sa loob ng tribo; ipinahihiwatig ng “kani-kanilang” ang pamamahagi ayon sa mga pangkat na iyon.
