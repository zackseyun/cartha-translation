base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: tl
  text: At ang mga lunsod na nauukol sa lipi ng mga anak ni Benjamin, ayon sa kanilang mga angkan, ay Jerico, Bet-hogla, at Emek-keziz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “Lambak ng Keziz,” kung inuunawa ito bilang mapaglarawang pangalan ng lugar sa halip na isang pangngalang pantangi na tinranslitera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: At ... ay
  rationale: Ipinagpapatuloy ng pang-ugnay at ng pandiwang היה ang talaan ng mga lunsod; natural itong ipinahahayag sa Filipino bilang sugnay na may “At ... ay.”
- source_word: הֶעָרִים
  choice: ang mga lunsod
  rationale: Tuwirang katumbas ng tiyak na pangngalang maramihan at angkop sa konteksto ng mga pamayanang kabilang sa bahagi ng lupain.
- source_word: לְמַטֵּה
  choice: na nauukol sa lipi ng
  rationale: Ipinahihiwatig ng לְ ang pagkakaugnay o pagkakatalaga ng mga lunsod sa tribo; malinaw at natural dito ang “nauukol sa lipi ng.”
- source_word: בְּנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang Hebreong pananalitang pangkamag-anakan nang hindi ito ginagawang isang katawagang etniko lamang.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: ayon sa kanilang mga angkan
  rationale: Sa paghahati ng lupa, ang מִשְׁפָּחָה ay pangkat sa loob ng isang lipi; mas tiyak ang “angkan” kaysa “pamilya.”
- source_word: יְרִיחוֹ
  choice: Jerico
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: בֵית חָגְלָה
  choice: Bet-hogla
  rationale: Isinalin-tunog ang tambalang pangalan ng lugar sa paraang madaling basahin sa Filipino.
- source_word: עֵמֶק קְצִיץ
  choice: Emek-keziz
  rationale: Itinuturing ang buong parirala bilang pangalan ng lugar, habang pinananatili sa talababa ang posibleng mapaglarawang pagbasa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang panlipi at ang ayos ng talaan, ngunit ginamit ang likas na sintaks ng Filipino. Inilipat ang talababa sa Emek-keziz, ang salitang tunay na tinutukoy nito.
