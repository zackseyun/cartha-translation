  footnotes:
  - marker: a
    text: Ang Hebreong הָעַוִּים ay maaari ding unawain bilang “ang mga Avvim.” Sa talaang ito ng nasasakupan, itinuring itong pangalan ng isang bayan sa halip na katawagan sa isang pangkat ng mga tao.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעַוִּים
  choice: Avvim
  rationale: Pangalan ito ng isang bayan sa talaan ng mga lugar. Posible ring unawain ang anyo bilang katawagang pangkat na “ang mga Avvim,” kaya pinanatili sa talababa ang tunay na kalabuan.
- source_word: הַפָּרָה
  choice: Para
  rationale: Pangalan ng lugar sa nasasakupan ng Benjamin. Hindi isinama sa transliterasyon ang pantukoy na Hebreo, at ginamit ang anyong likas basahin sa Filipino.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Pangalan ng lugar; ang “Ofra” ay malinaw at madaling bigkasing transliterasyon sa modernong Filipino.
- source_word: וְ
  choice: at
  rationale: Ang inuulit na pangatnig ay nag-uugnay sa mga pangalan sa payak na talaan; natural sa Filipino ang mga kuwit at isang “at” bago ang huling pangalan.
