translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang panimulang וּ at ang mga kasunod na pang-ugnay ay likas na ipinagpapatuloy mula sa naunang talaan sa pamamagitan ng “at.” Ginamit ang gitling bago ang pangwakas na bilang upang malinaw na ibukod ang buod sa listahan.
