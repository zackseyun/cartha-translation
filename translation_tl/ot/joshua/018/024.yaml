  yaml_path: translation/ot/joshua/018/024.yaml
  text: 'And Chephar-ammoni[a], Ophni, and Geba: twelve cities with their villages.'
translation:
  language: tl
  text: at Kefar-ha-Amoni[a], Ofni, at Geba—labindalawang lungsod kasama ang kani-kanilang mga nayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kefar-ha-Amoni ay maaari ring baybayin na “Kefar-Amoni” o sa kahalintulad na transliterasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפַר העמני
  choice: Kefar-ha-Amoni
  rationale: Pangalan ng lugar; tinumbasan sa paraang transliterasyon na angkop sa bigkas at baybay ng modernong Filipino, sa halip na isalin ang posibleng kahulugang “nayon ng Amonita.”
- source_word: הָעָפְנִי
  choice: Ofni
  rationale: Pangalan ng lugar sa talaan ng mga lungsod; ginamit ang natural na transliterasyong Filipino at hindi hiwalay na isinalin ang artikulo.
- source_word: גָבַע
  choice: Geba
  rationale: Pangalan ng isang pamayanan sa Benjamin; pinanatili bilang pantanging pangalan at hindi isinaling “burol.”
- source_word: עָרִים
  choice: mga lungsod
  rationale: Karaniwang katawagan sa mga bayang nakapaloob sa paghahati ng lupain; pinananatili ang pormal na terminolohiya ng teksto.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: labindalawa
  rationale: Tuwirang bilang na tumutukoy sa kabuuang mga lungsod.
- source_word: חַצְרֵיהֶן
  choice: mga nayon ng mga ito
  rationale: Tumutukoy sa mga nakaugnay na maliliit o di-napapaderang pamayanan sa paligid ng mga lungsod; malinaw at natural ang “mga nayon” sa Filipino.
