  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: tl
  text: At isulat ninyo ang paglalarawan ng lupain sa pitong bahagi, at dalhin ninyo ito rito sa akin. Pagkatapos, magpapalabunot ako para sa inyo rito, sa harap ng PANGINOON na ating Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת־הָאָרֶץ
  choice: isulat ninyo ang paglalarawan ng lupain
  rationale: Sa konteksto ng pagsusuri at paghahati sa lupain, ang Hebreong parirala ay tumutukoy sa pagtatala o paglalarawan nito, hindi sa literal na pagsulat sa mismong lupa.
- source_word: שִׁבְעָה חֲלָקִים
  choice: ayon sa pitong bahagi
  rationale: Pinananatili ang bilang at ang ideya ng pagkakahati sa pitong takdang bahagi.
- source_word: וְיָרִיתִי לָכֶם גּוֹרָל
  choice: bubunutin ko ... ang palabunutan para sa inyo
  rationale: Ang גּוֹרָל ay ang palabunot na ginagamit upang italaga ang bahagi; ang natural na idyomang Filipino na “bubunutin ... ang palabunutan” ay naghahayag ng aktuwal na proseso nang hindi ipinapalagay na maraming magkakahiwalay na palabunot.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: sa harap ng PANGINOON na ating Diyos
  rationale: Pinananatili ang pormulang tumutukoy sa banal na presensiya at ginagamit ang nakagawiang salin na PANGINOON para sa banal na pangalan.
theological_decisions:
- issue: Ang banal na pangalan יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ang “PANGINOON” ay dignified at malawak na nakikilalang tradisyon sa Bibliyang Filipino; hindi nito dinaragdagan o binabago ang teolohikal na pahayag ng talata.
- issue: Paggamit ng palabunutan sa harap ng Diyos
  choice: Pinanatili bilang kilos ni Josue “sa harap ng PANGINOON”
  alternative: Ipaliwanag bilang tuwirang pasiya o kalooban ng Diyos
  rationale: Hindi tahasang ipinapaliwanag ng talata ang ugnayan ng palabunutan at banal na pagpapasiya, kaya pinananatili ang teolohikal na tensiyon nang walang idinagdag na interpretasyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang maramihang “ninyo” upang katawanin ang Hebreong pangmaramihang utos, at hinati sa dalawang pangungusap para sa natural na daloy nang hindi binabago ang lohika ng orihinal.
