translation:
  language: tl
  text: Ngunit may pitong lipi pa sa mga anak ni Israel[a] na hindi pa nababahaginan ng kanilang mana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga Israelita.” Mas literal sa Hebreo ang “sa mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “na hindi pa naghahati ng kanilang mana” o “na hindi pa nakatatanggap ng kanilang mana ayon sa pagkakabahagi.” Maaaring tumukoy ang pandiwang Hebreo sa pakikibahagi ng mga lipi sa paghahati o sa hindi pa pagtatalaga sa kanila ng lupang mana.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: may natitira pa
  rationale: Ang Niphal na anyo ng יתר ay nagsasaad ng mga nananatili o natitira; natural sa modernong Tagalog ang “may natitira pa.”
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili nito ang literal at pampamilyang pananalita ng Hebreo; maaaring gawing mas idyomatiko bilang “sa mga Israelita.”
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: na hindi pa naghahati-hati
  rationale: Ang חלק sa konteksto ng pamamahagi ng lupain ay nangangahulugang hatiin o ipamahagi sa mga bahagi. Pinananatili ng aktibong anyo ang balarila ng Hebreo, samantalang ipinahihiwatig ng “pa” na hindi pa natatapos ang paghahati o pagtatalaga.
- source_word: אֶת נַחֲלָתָם
  choice: ng kanilang mana
  rationale: Ang נחלה ay tumutukoy sa minanang bahagi ng lupain; ang “mana” ang maikli, karaniwan, at may angkop na teolohikal na kulay na katumbas nito.
- source_word: שִׁבְעָה שְׁבָטִים
  choice: pitong lipi
  rationale: Ang “lipi” ang natural na tawag sa pitong pangkat ng Israel na tinutukoy ng שְׁבָטִים.
