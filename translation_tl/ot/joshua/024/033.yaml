base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: tl
  text: Namatay rin si Eleazar na anak ni Aaron, at inilibing nila siya sa Gibeat-Pinehas, na kaugnay ng anak niyang si Pinehas, na ibinigay sa kaniya sa kabundukan ng Efraim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “na ibinigay sa kaniya”; maaaring tumukoy kay Pinehas o kay Eleazar.
    reason: Pinananatili ang tunay na kalabuan ng panghalip na לוֹ at iniiwasang ipakitang tiyak ang isang antecedent.
lexical_decisions:
- source_word: גִבְעַת פִּינְחָס
  choice: Gibeat-Pinehas
  rationale: Itinuturing na pangalang-pook ang parirala, na karaniwang nauunawaan bilang “burol ni Pinehas”; isinatinig sa Filipino nang hindi isinasalin ang pangalan.
- source_word: בְּהַר אֶפְרָיִם
  choice: sa kabundukan ng Efraim
  rationale: Ang הַר sa ganitong heograpikong gamit ay tumutukoy sa bulubundukin o mataas na lupain, kaya natural at tumpak ang “kabundukan.”
- source_word: אֲשֶׁר נִתַּן לוֹ
  choice: na ibinigay kay Pinehas
  rationale: Ang hulaping panghalip na לוֹ ay literal na “sa kaniya.” Tinukoy sa teksto bilang Pinehas upang maging malinaw sa Filipino, habang minamarkahan sa talababa ang posibleng sintaktikong kalabuan.
theological_decisions:
- issue: Kung sino ang tumanggap ng lupa
  choice: Si Pinehas ang tinutukoy ng “sa kaniya,” kasunod ng pinakamalapit na tahasang pangngalan at ng karaniwang pagbasa sa pangungusap.
  alternative: Maaaring unawain ang “sa kaniya” bilang tumutukoy kay Eleazar.
  rationale: Hindi ito usaping doktrinal kundi sintaktikong kalabuan. Pinili sa pangunahing teksto ang mas natural na antecedent sa Hebrew, ngunit pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Namatay rin” para sa pang-ugnay na וְ, at “kabundukan” bilang natural na heograpikong katawagan. Iningatan ang pangalang-pook na Gibeat-Pinehas.
