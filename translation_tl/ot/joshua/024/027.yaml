source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: tl
  text: Sinabi ni Josue sa buong bayan, “Tingnan ninyo, ang batong ito ay magiging saksi laban sa atin,[a] sapagkat narinig nito[b] ang lahat ng salitang sinabi sa atin ni Yahweh. Magiging saksi rin ito laban sa inyo, upang hindi ninyo itatwa ang inyong Diyos.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “saksi para sa atin” o “saksi sa atin.” Maaaring unawain nang mas neutral ang pang-ukol sa Hebreo, ngunit sa konteksto, ang bato ay nagpapatotoo laban sa pagtataksil sa tipan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “narinig.” Inilalarawan ang bato na parang isang taong nakarinig at makapagpapatotoo sa mga salita ng tipan.
    reason: cultural_note
  - marker: c
    text: Maaari ring “magtaksil kayo sa inyong Diyos” o “maging di-tapat kayo sa inyong Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Likas at makabagong panawag-pansin sa maramihang kausap, nang hindi gumagamit ng makalumang pananalita.
- source_word: הָאֶבֶן הַזֹּאת
  choice: ang batong ito
  rationale: Karaniwang kahulugan ng אֶבֶן ang “bato,” at angkop ito sa batong itinayong tanda ng tipan.
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: ay magiging saksi
  rationale: Pinananatili ang legal at tipanang diwa ng עֵדָה bilang patotoong saksi.
- source_word: בָּנוּ / בָכֶם
  choice: laban sa atin / laban sa inyo
  rationale: Bagaman maaaring mas neutral ang pang-ukol, ang babala laban sa paglabag sa tipan ay nagbibigay rito ng adversatibong diwa; itinatala sa talababa ang tunay na alternatibo.
- source_word: שָׁמְעָה
  choice: narinig nito
  rationale: Tuwirang pinananatili ang personipikasyon ng bato bilang nakarinig sa mga salita ng tipan.
- source_word: כָּל אִמְרֵי יְהוָה
  choice: ang lahat ng salitang ... ni Yahweh
  rationale: Natural ang “mga salita” para sa אִמְרֵי at malinaw na pinananatili ang banal na pangalang YHWH bilang Yahweh.
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: sinabi sa atin
  rationale: Natural sa Filipino ang pariralang ito; ang עִם ay maaaring literal na “kasama natin,” ngunit sa konteksto ng pagsasalita, “sinabi sa atin” ang malinaw na idiomatikong katumbas.
- source_word: פֶּן
  choice: upang hindi
  rationale: Natural na Filipino para sa preventive o warning force ng פֶּן, nang hindi gumagamit ng mabigat o makalumang anyo.
- source_word: תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: itatwa ang inyong Diyos
  rationale: Malinaw nitong ipinahahayag ang pagtatanggi o pagtataksil sa Diyos sa konteksto ng tipan; inilalahad sa talababa ang alternatibong “magtaksil.”
theological_decisions:
- issue: Personipikasyon ng bato bilang nakarinig at saksi
  choice: Panatilihin nang tahasan ang personipikasyon
  alternative: Ipaliwanag lamang ang bato bilang sagisag o alaala ng tipan
  rationale: Tahasan sa Hebreo na “narinig” ng bato ang mga salita at magiging “saksi” ito; hindi dapat patagin ang retorika sa isang paliwanag lamang.
- issue: Ang direksiyon ng patotoo ng bato
  choice: “laban sa atin” at “laban sa inyo” sa pangunahing teksto
  alternative: “para sa atin/inyo” o “sa atin/inyo”
  rationale: Ang konteksto ay babala tungkol sa kataksilan sa tipan, kaya ang adversatibong pagbasa ang pinakamalinaw, habang pinananatili sa talababa ang leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue,” ang karaniwang anyong Filipino ng pangalan, at “Yahweh” upang katawanin nang tuwiran ang banal na pangalang יהוה. Iniwasan ang makalumang “narito” at ang hindi likas na “nagsalita kasama natin,” ngunit pinanatili ang pag-uulit at personipikasyon ng Hebreo.
