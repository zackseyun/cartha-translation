  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֶּאֶסֹ֧ף יְהוֹשֻׁ֛עַ אֶת כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁכֶ֑מָ/ה וַ/יִּקְרָא֩ לְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל וּ/לְ/רָאשָׁ֗י/ו וּ/לְ/שֹֽׁפְטָי/ו֙ וּ/לְ/שֹׁ֣טְרָ֔י/ו וַ/יִּֽתְיַצְּב֖וּ לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: tl
  text: Pagkatapos, tinipon ni Josue ang lahat ng lipi ng Israel patungong Shekem[a]. Ipinatawag niya ang mga nakatatanda ng Israel, ang mga pinuno nito[b], ang mga hukom nito, at ang mga opisyal nito. At humarap sila sa Diyos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Shekem.” Paturol sa direksiyon ang anyo sa Hebreo, na literal na nangangahulugang “patungong Shekem.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga ulo nito,” ibig sabihin, mga pinuno ng Israel.
    reason: lexical_alternative
  - marker: c
    text: Sinasabi ng Hebreo na humarap sila “sa harap ng Diyos.” Maaaring ipinahihiwatig nito na humarap sila sa isang santuwaryo o banal na pook ng tipanan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: tinipon
  rationale: Ipinapahayag ng אָסַף sa kontekstong ito ang pagtitipon ng mga tao sa isang kapulungan. Likas at malinaw sa modernong Filipino ang “tinipon.”
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: mga lipi ng Israel
  rationale: Ang “lipi” ang karaniwang salin ng שֵׁבֶט kapag tumutukoy sa mga pangkat na bumubuo sa Israel.
- source_word: שְׁכֶמָה
  choice: sa Shekem
  rationale: May hulaping paturol sa direksiyon ang Hebreo, literal na “patungong Shekem.” Sa Filipino, mas likas ang “tinipon ... sa Shekem” para sa kapulungang naganap doon; pinanatili sa talababa ang anyong paturol.
- source_word: וַיִּקְרָא לְ
  choice: ipinatawag niya
  rationale: Sa kontekstong ito, ang קרא na may ל ay nangangahulugang pormal na pagtawag o pagpapapunta sa mga itinalagang kinatawan.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: mga nakatatanda ng Israel
  rationale: Tumutukoy ito sa kinikilalang pangkat ng matatandang namumuno; ang “mga nakatatanda” ay malinaw at hindi ipinagkakamali sa simpleng edad lamang.
- source_word: רָאשָׁיו
  choice: mga pinuno nito
  rationale: Literal itong “mga ulo nito,” ngunit ang larawang ito ay likas na tumutukoy sa mga pinuno. Ang panghalip na isahan sa Hebreo ay tumutukoy sa Israel bilang isang kabuuan.
- source_word: שֹׁפְטָיו
  choice: mga hukom nito
  rationale: Tuwirang katumbas ito ng titulong panghukuman at pansibiko sa konteksto.
- source_word: שֹׁטְרָיו
  choice: mga opisyal nito
  rationale: Ang שֹׁטֵר ay tumutukoy sa mga tagapangasiwa o opisyal na gumaganap ng tungkuling administratibo.
- source_word: וַיִּתְיַצְּבוּ
  choice: humarap sila
  rationale: Ipinahihiwatig ng hitpael ang pormal na pagharap o paglalagay ng sarili sa itinakdang kalagayan. Natural sa Filipino ang “humarap sila” at angkop sa seremonyal na tagpo.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: sa Diyos
  rationale: Sa pariralang “humarap ... sa Diyos,” malinaw na naipapahayag ang literal na לִפְנֵי הָאֱלֹהִים, “sa harap ng Diyos,” nang hindi pinapalitan ang אֱלֹהִים ng pangalang YHWH o ng isang pook.
theological_decisions:
- issue: Kahulugan ng לִפְנֵי הָאֱלֹהִים sa isang kapulungang tipanan
  choice: humarap sila sa Diyos
  alternative: humarap sila sa santuwaryo ng Diyos; humarap sila sa PANGINOON
  rationale: Tahasan sa Hebreo ang “Diyos,” hindi ang banal na pangalang YHWH at hindi rin ang salitang “santuwaryo.” Kaya hindi idinagdag sa pangunahing teksto ang mga interpretasyong iyon. Gayunman, maaaring magpahiwatig ang pagharap sa Diyos ng pagharap sa isang banal na pook, kaya binanggit ito sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Pinanatiling magkakahiwalay ang mga katawagang pamunuan—mga nakatatanda, pinuno, hukom, at opisyal—at iniwasang gawing tahasang “santuwaryo” o “PANGINOON” ang “Diyos.”
