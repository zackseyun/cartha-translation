  source_fidelity: 'Tapat ang salin sa Hebreo: malinaw ang pormulang pambungad, ang pagtukoy kay Yahweh bilang Diyos ng Israel, ang paninirahan ng mga ninuno sa ibayo ng Ilog noong unang panahon, ang paulit na pagtukoy kay Terah bilang ama nina Abraham at Nahor, at ang paglilingkod sa ibang mga diyos. Ang “inyong mga ninuno” ay wastong kontekstuwal na salin ng literal na “inyong mga ama,” at maayos itong nilinaw sa talababa.'
