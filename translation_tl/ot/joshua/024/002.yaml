id: JOS.24.2
reference: Joshua 24:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: tl
  text: 'Sinabi ni Josue sa buong bayan, “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Noong unang panahon, nanirahan sa ibayo ng Ilog[a] ang inyong mga ninuno[b]—si Terah, na ama ni Abraham at ama ni Nahor—at naglingkod sila sa ibang mga diyos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kabilang panig ng Ilog”; malamang na ang tinutukoy ay ang Ilog Eufrates.
    reason: cultural_note
  - marker: b
    text: Sa Hebreo, “inyong mga ama”; ibig sabihin, ang inyong mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na salin ng pandiwang pasalaysay na nagpapakilala sa sumunod na pananalita; hindi nito dinaragdagan ang tiyak na temporal na diin.
- source_word: אֶל כָּל הָעָם
  choice: sa buong bayan
  rationale: Tumutukoy sa buong nagkakatipong sambayanan ng tipan. Ang “bayan” ay natural at marangal sa modernong Filipino.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Pinananatili ang pormulang mensahero o propetiko sa isang natural na pariralang Filipino na hindi kailangang magtakda ng panahunan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Malinaw na inilalarawan ang kaugnayan ni Yahweh sa Israel at sinusunod ang anyong konstruktibo ng Hebreo.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: sa ibayo ng Ilog
  rationale: Pinananatili ang heograpikong pananalita ng Hebreo nang hindi tahasang ipinapalit sa pangunahing teksto ang pangalang Eufrates.
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Ang pandiwa ay nangangahulugang tumira o manahan; ang “nanirahan” ay malinaw at natural sa salaysay tungkol sa mga ninuno.
- source_word: אֲבוֹתֵיכֶם
  choice: inyong mga ninuno
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking ninuno, lalo na kay Terah. Ang “mga ninuno” ang natural na modernong Filipino; nililinaw sa talababa ang literal na anyo.
- source_word: מֵעוֹלָם
  choice: Noong unang panahon
  rationale: Dito ay tumutukoy sa sinaunang nakaraan, hindi sa walang hanggan.
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: si Terah, na ama ni Abraham at ama ni Nahor
  rationale: Pinananatili ang pag-uulit ng “ama” sa Hebreo at malinaw na ipinakikilala si Terah bilang paliwanag sa mga ninuno.
- source_word: וַיַּעַבְדוּ
  choice: at naglingkod sila
  rationale: Ang עבד kapag mga diyos ang layon ay may diwang panrelihiyong paglilingkod o pagsamba. Pinananatili ng “naglingkod” ang pangunahing larawan at ang kultikong diwa.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang pinananatili ang maramihang pagtukoy sa ibang mga diyos.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito sa salin sa halip na palitan ng titulo.
- issue: Paglalarawan sa אֲבוֹתֵיכֶם
  choice: inyong mga ninuno
  alternative: inyong mga ama
  rationale: Ang Hebreo ay literal na “inyong mga ama,” ngunit sa kontekstong pangkasaysayan ay nangangahulugang mga ninuno. Ang natural na kahulugan sa Filipino ay inilagay sa teksto, habang pinananatili sa talababa ang literal at panlalaking anyo.
- issue: Diwa ng paglilingkod sa ibang mga diyos
  choice: naglingkod sila sa ibang mga diyos
  alternative: sumamba sila sa ibang mga diyos
  rationale: Ang pandiwang Hebreo ay maaaring magpahiwatig ng pagsamba sa kontekstong ito, ngunit ang “naglingkod” ay nagpapanatili sa mas malawak na leksikal na diwa nang hindi inaalis ang relihiyosong kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ibayo” bilang bahagyang pormal na heograpikong termino, na nilinaw sa talababa; iniwasan ang makalumang balangkas at ang denominasyonal na bokabularyo.
