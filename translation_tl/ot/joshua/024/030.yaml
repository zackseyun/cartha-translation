id: JOS.24.30
reference: Joshua 24:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת סֶ֖רַח אֲשֶׁ֣ר בְּ/הַר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: tl
  text: At inilibing nila siya sa nasasakupan ng kanyang mana[a], sa Timnat-sera, na nasa kaburulan ng Efraim, sa hilaga ng Bundok Gaas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa hangganan ng kanyang mana.” Ang salitang Hebreo ay maaaring tumukoy sa hangganan o sa teritoryong nasasakupan nito; dito, malamang na ang tinutukoy ay ang lupaing inilaan kay Josue bilang mana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: At inilibing nila siya
  rationale: Ang wayyiqtol na may pangatnig ay nagpapatuloy sa salaysay, at ang אֹתוֹ ay tahasang tumutukoy kay Josue bilang layon.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: sa nasasakupan ng kanyang mana
  rationale: Maaaring mangahulugan ang גְּבוּל ng hangganan o ng teritoryong sakop nito. Sa konteksto ng lugar ng libing, natural na tumutukoy ito sa lupaing nakapaloob sa bahaging inilaan kay Josue; pinananatili ng “mana” ang diwa ng נַחֲלָה.
- source_word: בְּתִמְנַת סֶרַח
  choice: sa Timnat-sera
  rationale: Isinalin bilang pangalang-pook sa anyong madaling bigkasin sa Filipino; ang “sa” ay natural para sa tiyak na lokasyon.
- source_word: בְּהַר אֶפְרָיִם
  choice: nasa kaburulan ng Efraim
  rationale: Dito ang הַר ay tumutukoy sa bulubundukin o rehiyong maburol, hindi sa iisang bundok. Ang “kaburulan” ay malinaw at likas sa modernong Filipino.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: sa hilaga ng Bundok Gaas
  rationale: Ipinapahayag ng parirala ang relatibong lokasyon ng Timnat-sera kaugnay ng Bundok Gaas.
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “nasasakupan” upang natural na ipahayag ang teritoryal na kahulugan nang hindi ikinukubli ang alternatibong “hangganan,” na inilagay sa talababa. Ang mga pangalang-pook ay inangkop sa karaniwang baybay Filipino: Timnat-sera, Efraim, at Gaas.'
