base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: tl
  text: At sinabi ni Josue sa mga tao, “Hindi ninyo kayang maglingkod kay Yahweh, sapagkat siya ay isang banal na Diyos[a]; siya ay Diyos na mapanibughuin. Hindi niya patatawarin[b] ang inyong mga pagsalansang at mga kasalanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, maramihan ang anyo ng mga salitang isinaling “Diyos” at “banal,” ngunit isahan ang kasunod na panghalip. Sa literal na ayos: “Diyos, banal, siya.” Ipinakikita ng isahang panghalip na ang tinutukoy ay ang iisang Diyos ng Israel.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Hindi niya papasanin” o “hindi niya aalisin ang inyong mga pagsalansang at mga kasalanan.” Ang Hebreong idyoma ay karaniwang ginagamit para sa pagpapatawad.
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: kayang
  rationale: Ang pandiwang יכל ay tumutukoy sa kakayahan o kapasidad. Likas sa modernong Tagalog ang “hindi ninyo kayang” at malinaw nitong pinananatili ang diin sa kawalan ng kakayahan.
- source_word: לַעֲבֹד
  choice: maglingkod
  rationale: Mas malawak ang עבד kaysa pagsamba lamang; sa konteksto ng tipan, saklaw nito ang pagsamba, pagsunod, at paglilingkod. Pinananatili ng “maglingkod” ang lawak na ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: siya ay Diyos na banal
  rationale: Bagaman maramihan ang anyo ng אֱלֹהִים at קְדֹשִׁים, isahan ang panghalip na הוּא at iisa ang tinutukoy. Isahan ang salin upang hindi magpahiwatig ng maraming diyos, habang ipinaliliwanag sa talababa ang di-pangkaraniwang anyong Hebreo.
- source_word: אֵל קַנּוֹא
  choice: Diyos na mapanibughuin
  rationale: Ipinahahayag ng קַנּוֹא ang eksklusibong pag-angkin ni Yahweh sa katapatan ng kanyang bayan at ang hindi niya pagtanggap sa karibal na pagsamba. Pinananatili ng “mapanibughuin” ang matinding relasyonal at pangtipang diwa ng salita.
- source_word: לֹא יִשָּׂא
  choice: Hindi niya patatawarin
  rationale: Kapag kasalanan o pagsalansang ang layon, ang נשא ay isang idyomang maaaring mangahulugang magpatawad o mag-alis ng sala. Malinaw at natural sa Tagalog ang “patatawarin,” samantalang inilalagay sa talababa ang mas literal na larawan.
- source_word: פִשְׁעֲכֶם
  choice: inyong mga pagsalansang
  rationale: Ang פשע ay nagpapahiwatig ng paghihimagsik o paglabag laban sa lehitimong awtoridad. Ang “pagsalansang” ay nagpapanatili sa pangtipang bigat nito at naiiba sa mas pangkalahatang “mga kasalanan.”
- source_word: חַטֹּאותֵיכֶם
  choice: inyong mga kasalanan
  rationale: Ang חטאת ang karaniwang katawagan para sa kasalanan; “mga kasalanan” ang tuwiran at natural na katumbas sa Tagalog.
theological_decisions:
- issue: Maramihang anyo ng אֱלֹהִים קְדֹשִׁים ngunit isahang panghalip na הוּא
  choice: Isinalin sa isahan bilang “siya ay Diyos na banal,” na may talababa tungkol sa anyong Hebreo.
  alternative: Kahoy na saling maramihan na maaaring magmukhang tumutukoy sa maraming diyos.
  rationale: Ang isahang panghalip at ang konteksto ay malinaw na tumutukoy sa iisang Diyos ng Israel. Hindi dapat lumikha ang salin ng maling pahiwatig na wala sa pinagmulan, ngunit dapat ding itala ang tunay na kakaibang morpolohiya.
- issue: Kahulugan ng לֹא יִשָּׂא kaugnay ng mga pagsalansang at kasalanan
  choice: Isinaling “Hindi niya patatawarin,” na may talababa sa literal na larawang “papasanin/aangkatin.”
  alternative: “Hindi niya papasanin” o “hindi niya aalisin” ang inyong mga pagsalansang at kasalanan.
  rationale: Karaniwang idyoma ang נשא para sa pagpapatawad kapag kasalanan ang layon. Gayunman, mahalagang panatilihin sa talababa ang literal na larawang pinagmumulan ng idyoma at ang posibleng pagbasa nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “hindi ninyo kayang maglingkod” upang maging natural at mapanatili ang diin sa kakayahan; ginamit ang “mapanibughuin” bilang tradisyonal ngunit nauunawaang salitang pangtipan. Inilipat ang mga pananda ng talababa sa mismong mga pariralang kanilang ipinapaliwanag.
