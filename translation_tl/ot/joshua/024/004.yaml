base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: tl
  text: At ibinigay ko kay Isaac sina Jacob at Esau. Ibinigay ko kay Esau ang kabundukan ng Seir[a] upang angkinin niya iyon. Ngunit[b] bumaba sa Ehipto si Jacob at ang kanyang mga anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Bundok Seir” o “mga bundok ng Seir.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “At bumaba sa Ehipto si Jacob at ang kanyang mga anak.” Ang Hebreong pang-ugnay ay payak na “at”; ginamit sa pangunahing teksto ang “ngunit” upang hayagang ipakita ang paghahambing sa sinapit ni Esau.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: ibinigay ko
  rationale: Tuwirang ipinapahayag ng נתן ang pagkakaloob ng mga anak at ng lupain, at pinananatili ng salin ang pag-uulit ng kilos ng Diyos.
- source_word: לְיִצְחָק
  choice: kay Isaac
  rationale: Ginamit ang karaniwang anyo ng pangalang Isaac sa makabagong saling Filipino, kasama ang panandang pantukoy na angkop sa di-tuwirang layon.
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: sina Jacob at Esau
  rationale: Ang “sina” ang likas na pananda sa Filipino para sa dalawa o higit pang pangalang pantao na layon ng pandiwa.
- source_word: הַר שֵׂעִיר
  choice: ang kabundukan ng Seir
  rationale: Sa konteksto, ang הַר ay tumutukoy sa bulubunduking teritoryong ipinagkaloob kay Esau, hindi lamang sa isang taluktok.
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: upang angkinin niya iyon
  rationale: Ipinahihiwatig ng ירש ang pagkuha at pagkakaroon ng lupain bilang pag-aari. Nilinaw ng “niya” ang simuno ng pawatas sa natural na Filipino habang pinananatili ang bagay na tinutukoy ng אֹתוֹ.
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: Ngunit bumaba sa Ehipto si Jacob at ang kanyang mga anak
  rationale: Ginawang “ngunit” ang waw upang natural na maipakita sa Filipino ang kontekstuWal na paghahambing sa magkaibang sinapit ni Esau at ng sambahayan ni Jacob; itinala sa talababa ang literal na “at.”
- source_word: יָרְדוּ מִצְרָיִם
  choice: bumaba sa Ehipto
  rationale: Pinananatili nito ang karaniwang heograpiko at salaysay na idyoma ng ירד, at natural itong nauunawaan sa Filipino.
theological_decisions:
- issue: Ugnayan ng huling sugnay sa pagkakaloob ng Seir kay Esau
  choice: Ngunit
  alternative: At
  rationale: Ang Hebreong וְ ay payak na pang-ugnay at maaaring isaling “at,” ngunit ipinaghahambing ng konteksto ang pagtanggap ni Esau sa Seir at ang pagbaba ng sambahayan ni Jacob sa Ehipto. Ipinahahayag ng “ngunit” ang kontekstuwal na pagsalungat nang hindi nagdaragdag ng doktrinang wala sa teksto; pinananatili sa talababa ang pormal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang mga pangalang biblikal na Isaac, Jacob, Esau, Seir, at Ehipto. Ang maiikling pangungusap ay nagpapalinaw sa magkakasunod na pagkakaloob at sa pangwakas na paghahambing.
