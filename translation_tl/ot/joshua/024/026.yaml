  text: וַ/יִּכְתֹּ֤ב יְהוֹשֻׁ֨עַ֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/סֵ֖פֶר תּוֹרַ֣ת אֱלֹהִ֑ים וַ/יִּקַּח֙ אֶ֣בֶן גְּדוֹלָ֔ה וַ/יְקִימֶ֣/הָ שָּׁ֔ם תַּ֚חַת הָֽ/אַלָּ֔ה אֲשֶׁ֖ר בְּ/מִקְדַּ֥שׁ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: tl
  text: Isinulat ni Josue ang mga salitang ito sa aklat ng Kautusan ng Diyos. At kumuha si Josue ng isang malaking bato at itinindig niya ito roon, sa ilalim ng puno ng terebinto[a] na nasa santuwaryo ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “puno ng ensina.” Hindi tiyak kung terebinto o ensina ang eksaktong uri ng punong tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na malapit sa santuwaryo ni Yahweh.” Maaaring unawain nang mas maluwag ang pang-ukol na Hebreo sa kontekstong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Isinulat
  rationale: Tuwirang ipinapahayag ng כתב ang pagsulat; ang anyong Filipino ay natural habang pinananatili ang kilos na dokumentaryo.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Maaaring mangahulugan ang דְּבָרִים ng mga salita, bagay, o usapin. Dito, ang isinusulat sa aklat ay pinakamalinaw na maipahayag bilang “mga salitang ito.”
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: sa aklat ng Kautusan ng Diyos
  rationale: Ang סֵפֶר ay aklat o balumbon, at ang תּוֹרָה ay kautusan o tagubilin. Ang “aklat ng Kautusan ng Diyos” ay malinaw at pinananatili ang ugnayang gramatikal ng Hebreo.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: kumuha siya ng isang malaking bato
  rationale: Ang גְּדוֹלָה ay tumutukoy rito sa pisikal na laki; “malaking bato” ang likas na modernong Filipino.
- source_word: וַיְקִימֶהָ
  choice: itinayo iyon
  rationale: Ang causative na anyo ng קום ay nangangahulugang pinatayo o itinindig ang bato. Ang “itinayo iyon” ay malinaw at hindi labis na teknikal.
- source_word: תַּחַת הָאַלָּה
  choice: sa ilalim ng puno ng terebinto
  rationale: Ang אַלָּה ay karaniwang tumutukoy sa terebinto, bagaman maaari itong unawain bilang ensina. Ginamit ang mas tiyak na katawagang “terebinto” at inilagay sa talababa ang tunay na leksikal na alternatibo.
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: na nasa santuwaryo ni Yahweh
  rationale: Ang מִקְדָּשׁ ay banal na lugar o santuwaryo, at karaniwang kahulugan ng בְּ ay “nasa/sa loob ng.” Pinanatili sa talababa ang posibleng mas maluwag na lokasyong “malapit sa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Lokasyon ng puno kaugnay ng מִקְדַּשׁ יְהוָה
  choice: nasa santuwaryo ni Yahweh
  alternative: malapit sa santuwaryo ni Yahweh
  rationale: Pinapaboran ng karaniwang gamit ng pang-ukol na בְּ ang “nasa,” ngunit maaaring mas maluwag ang diwang panlunan sa konteksto; kaya hindi inalis ang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino na may marangal ngunit payak na himig. Ginamit ang “Josue,” ang nakasanayang anyong Filipino ng pangalan, at “santuwaryo” upang maipahayag nang maikli ang banal na lugar. Ang mga tunay na kalabuan tungkol sa uri ng puno at lokasyon nito ay pinanatili sa mga talababa.
