  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng salin ang pagsulat ni Josue, ang aklat ng Kautusan ng Diyos, ang malaking bato, at ang lokasyon nito sa ilalim ng puno sa santuwaryo ni Yahweh. Gayunman, ang “Pagkatapos” ay nagbibigay ng mas tiyak na sunod-sunod na oras kaysa sa simpleng pang-ugnay na וַ; mas maingat ang “At.”
  naturalness: Natural at marangal ang modernong Filipino. Mas tuwiran at mas malapit sa daloy ng Hebreo ang “At kumuha si Josue ... at itinindig niya ito roon” kaysa sa “Pagkatapos, kumuha siya ... itinayo iyon.”
  terminology: Ang “Josue,” “Kautusan ng Diyos,” “santuwaryo,” at “Yahweh” ay angkop at pare-pareho. Ang “terebinto” ay wastong teknikal na pangunahing salin para sa punong hindi ganap na tiyak ang species; ang alternatibong “ensina” ay angkop na nasa talababa.
