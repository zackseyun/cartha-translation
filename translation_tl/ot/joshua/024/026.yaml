  to: Isinulat ni Josue ang mga salitang ito sa aklat ng Kautusan ng Diyos. At kumuha si Josue ng isang malaking bato at itinindig niya ito roon, sa ilalim ng puno ng terebinto[a] na nasa santuwaryo ni Yahweh.[b]
