  text: Then Joshua sent the people away[a], each man to his inheritance.
translation:
  language: tl
  text: Pagkatapos, pinauwi ni Josue ang mga tao, bawat isa sa sarili niyang mana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: pinauwi
  rationale: Sa kontekstong ito, ang piel ng שׁלח ay tumutukoy sa pagpapaalis sa kapulungan upang umuwi. Natural sa modernong Tagalog ang “pinauwi” at malinaw nitong ipinahihiwatig ang pagtatapos ng pagtitipon.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Tagalog.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Ang עָם ay kolektibong tumutukoy sa sambayanan; sa konteksto, ang “mga tao” ay natural at hindi labis na tumutukoy sa kanila bilang isang bansa.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Ginagamit nang distributibo ang panlalaking pang-isahang אִישׁ. Ang “bawat isa” ay natural at tumpak sa Tagalog at hindi nagpapahiwatig na mga lalaki lamang ang saklaw.
- source_word: לְנַחֲלָתוֹ
  choice: sa sarili niyang mana
  rationale: Sa Josue, ang נַחֲלָה ay karaniwang tumutukoy sa lupaing minana o itinakdang bahagi. Pinananatili ng “mana” ang ugnayan nito sa tipan at sa lupang ipinagkaloob.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “pinauwi” bilang likas na katumbas ng pagpapaalis sa kapulungan, at “bawat isa” upang ipahayag ang distributibong diwa nang hindi maging mabigat o eksklusibong panlalaki.
