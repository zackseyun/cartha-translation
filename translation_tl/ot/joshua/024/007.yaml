  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: tl
  text: Pagkatapos, sumigaw sila kay Yahweh, at naglagay siya ng kadiliman sa pagitan ninyo at ng mga Ehipsiyo. Pinasapit niya ang dagat sa kanya at tinakpan siya[a]. Nakita ng inyong mga mata ang ginawa ko sa Ehipto. Pagkatapos, nanirahan kayo sa ilang sa loob ng maraming araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isahan ang mga panghalip sa Hebreo: “sa kanya” at “siya.” Maaaring kolektibo itong tumukoy sa Ehipto o sa hukbo ng mga Ehipsiyo; kaya “sa kanila” ang salin ng maraming bersiyon.'
    reason: Pinananatili ang isahang anyo at ang kalabuan ng Hebreo habang ipinaliliwanag ang posibleng kolektibong kahulugan.
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: sumigaw sila
  rationale: Ang צעק ay masidhing pagsigaw o pagdaing upang humingi ng saklolo. Ang “sumigaw sila kay Yahweh” ay natural at pinananatili ang tindi at malinaw na patutunguhan ng kanilang pagsamo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “Panginoon.”
- source_word: מַאֲפֵל
  choice: kadiliman
  rationale: Ang salita ay tumutukoy sa dilim o matinding karimlan. Ang “kadiliman” ay malinaw, marangal, at hindi labis na tumutukoy sa antas ng dilim.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: sa pagitan ninyo at ng mga Ehipsiyo
  rationale: Pinananatili nito ang ikalawang panauhang maramihan sa pakikipag-usap ni Josue sa Israel, bagaman ang tinutukoy ay ang karanasan ng kanilang mga ninuno.
- source_word: וַיָּבֵא עָלָיו אֶת הַיָּם
  choice: Pinadagsa niya sa kanya ang dagat
  rationale: Ipinahahayag ng causative na pandiwa na pinasapit ng Diyos ang dagat sa tinutukoy na kalaban. Ang “pinadagsa” ay likas sa Filipino sa ganitong tagpo, samantalang pinananatili ng “sa kanya” ang isahang hulapi ng Hebreo.
- source_word: וַיְכַסֵּהוּ
  choice: at tinakpan siya
  rationale: Pinananatili ng “tinakpan” ang payak na kahulugan ng כסה, at ng “siya” ang isahang hulapi, nang hindi ito tahimik na ginagawang maramihan.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: Nakita ng inyong mga mata
  rationale: Tahasan ding binabanggit ng Hebreo ang “inyong mga mata.” Pinananatili ito upang maipahayag ang diin sa pagiging saksi.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: ang ginawa ko sa Ehipto
  rationale: Ang “sa Ehipto” ay tuwirang tumutugma sa בְּמִצְרָיִם at hindi nagpapasya kung dapat itong unawain bilang “laban sa Ehipto.”
- source_word: וַתֵּשְׁבוּ
  choice: nanirahan kayo
  rationale: Sa konteksto, ang ישב ay nangangahulugang manirahan o manatili. Ang “nanirahan” ay natural at nagpapahiwatig ng matagal na pamamalagi.
- source_word: יָמִים רַבִּים
  choice: maraming araw
  rationale: Pinananatili ang literal na pahayag na “maraming araw” sa halip na palawakin ito bilang “maraming taon” o gawing “mahabang panahon.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon na hindi pinapalitan ang pangalan ng isang titulo.
- issue: Kung gagawing maramihan ang mga isahang panghalip na tumutukoy sa puwersang Ehipsiyo
  choice: Panatilihin sa pangunahing teksto ang isahang “sa kanya” at “siya”
  alternative: Gawing “sa kanila” at “sila,” o tukuying tahasan ang hukbo ng mga Ehipsiyo
  rationale: Isahan ang mga hulaping Hebreo sa עָלָיו at וַיְכַסֵּהוּ. Maaaring kolektibo ang tinutukoy—Ehipto o ang hukbo nito—ngunit ang paggawa nitong maramihan ay mag-aalis sa tunay na anyo at bahagyang kalabuan ng pinagmulan.
- issue: Paglipat mula sa ikatlong panauhan patungo sa unang panauhan sa pagsasalaysay tungkol sa Diyos
  choice: Panatilihin ang “siya” at pagkatapos ay “ginawa ko”
  alternative: Pantayin ang buong pahayag sa ikatlong panauhan
  rationale: Mismong tekstong Hebreo ang lumilipat mula sa “siya” patungo sa salita ng Diyos na “ginawa ko.” Hindi ito pinantay upang mapanatili ang retorikal na anyo ng talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang payak at madaling maunawaang ayos, habang pinanatili ang “maraming araw,” ang tahasang “inyong mga mata,” ang biglang paglipat sa “ginawa ko,” at ang kapansin-pansing isahang mga panghalip ng tekstong Hebreo.
