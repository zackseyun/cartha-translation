revisions:
- from: Pagkatapos, sumigaw sila kay Yahweh, at naglagay siya ng kadiliman sa pagitan ninyo at ng mga Ehipsiyo. Pinadagsa niya sa kanya ang dagat at tinakpan siya[a]. Nakita ng inyong mga mata ang ginawa ko sa Ehipto. At nanirahan kayo sa ilang nang maraming araw.
  to: Pagkatapos, sumigaw sila kay Yahweh, at naglagay siya ng kadiliman sa pagitan ninyo at ng mga Ehipsiyo. Pinasapit niya ang dagat sa kanya at tinakpan siya[a]. Nakita ng inyong mga mata ang ginawa ko sa Ehipto. Pagkatapos, nanirahan kayo sa ilang sa loob ng maraming araw.
