  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: tl
  text: Pinalayas ni Yahweh sa aming harapan ang lahat ng mga bansa, pati[a] ang mga Amoreo na naninirahan sa lupain. Kami rin ay maglilingkod kay Yahweh, sapagkat siya ang aming Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “at ang mga Amoreo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: Pinalayas
  rationale: Ang גּרש ay tumutukoy sa sapilitang pagpapaalis. Ang “pinalayas” ay natural sa modernong Tagalog at malinaw na naghahayag ng pag-aalis sa mga naninirahan nang hindi nagdaragdag ng tiyak na paraang militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin sa transliterasyon ang banal na pangalang יהוה upang mapanatili itong personal na pangalan at hindi mapalitan ng isang titulo.
- source_word: כָּל הָעַמִּים
  choice: ang lahat ng mga bayan
  rationale: Maramihan ang עַמִּים at tumutukoy sa mga pangkat-etniko o mga sambayanan. Ang “mga bayan” ay maikli, dignificado, at likas sa Tagalog.
- source_word: וְאֶת הָאֱמֹרִי
  choice: pati ang mga Amoreo
  rationale: Ang “pati” ay natural na nagpapakitang kabilang o partikular na binibigyang-diin ang mga Amoreo sa mga bayang nabanggit. Dahil maaari ring tuwirang mangahulugang “at” ang וְ, pinanatili ang alternatibo sa talababa.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: na naninirahan sa lupain
  rationale: Ang participle na יֹשֵׁב ay nagsasaad ng patuloy na paninirahan at inilalarawan nito ang mga Amoreo.
- source_word: מִפָּנֵינוּ
  choice: mula sa harap namin
  rationale: Pinananatili nito ang larawang nasa idyomang Hebreo—inalis ni Yahweh ang mga bayan mula sa harapan ng Israel—habang nananatiling mauunawaan sa Tagalog.
- source_word: גַּם אֲנַחְנוּ
  choice: Kami rin
  rationale: Malinaw nitong ipinahahayag ang pagtugon at pakikiisa ng bayan sa naunang pangako ni Josue.
- source_word: נַעֲבֹד
  choice: maglilingkod
  rationale: Saklaw ng עבד ang pagsamba, katapatan, at paglilingkod sa Diyos. Hindi ito pinakikitid sa gawaing panliturhiya lamang.
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: sapagkat siya ang aming Diyos
  rationale: Ipinahahayag ng כִּי ang dahilan ng kanilang pangakong maglingkod. Ang “sapagkat” ay natural at may dignidad sa ganitong pahayag.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng עבד sa konteksto ng tipan
  choice: maglilingkod
  alternative: sasamba
  rationale: 'Kasama sa pandiwa ang pagsamba ngunit mas malawak ito: ipinahahayag din nito ang katapatan at paglilingkod sa Diyos. Pinananatili ng “maglilingkod” ang lawak na iyon.'
- issue: Ugnayan ng “mga Amoreo” sa “lahat ng mga bayan”
  choice: pati ang mga Amoreo
  alternative: at ang mga Amoreo
  rationale: Maaaring unawain ang mga Amoreo bilang partikular na kabilang sa mga bayang pinaalis, ngunit literal ding maaaring panatilihin ang pang-ugnay na “at.” Hindi tuluyang nilulutas ang bahagyang kalabuan; inilalagay sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “mga bayan” para sa maramihang pangkat ng mga tao, “mga Amoreo” bilang karaniwang pangalang pangkat, at “maglilingkod” upang mapanatili ang malawak na diwa ng katapatan at pagsamba sa konteksto ng tipan.
