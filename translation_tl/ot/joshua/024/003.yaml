  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: tl
  text: Pagkatapos, kinuha ko ang inyong amang si Abraham mula sa kabila ng Ilog[a]. Pinaraan ko siya sa buong lupain ng Canaan, pinarami ko ang kanyang lahi[b], at ibinigay ko sa kanya si Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na ang “Ilog” ay tumutukoy sa Eufrates.
    reason: cultural_note
  - marker: b
    text: O “mga inapo”; sa Hebreo, “binhi,” isang pangngalang isahan na may kolektibong kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Pagkatapos, kinuha ko
  rationale: Ang Qal wayyiqtol na nasa unang panauhang isahan ay nagsasalaysay ng sunod na ginawa ng Diyos. Likas sa makabagong Tagalog ang “Pagkatapos” bilang pang-ugnay ng pagkakasunod-sunod.
- source_word: אֲבִיכֶם אֶת־אַבְרָהָם
  choice: ang inyong amang si Abraham
  rationale: Pinananatili ng “ama” ang tahasang pampamilya at pangtipang pananalita ng Hebreo; ginagawang natural ng pang-angkop at pantukoy na “si” ang parirala sa Tagalog.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: mula sa kabila ng Ilog
  rationale: Tuwirang inilalarawan nito ang kabilang panig ng isang ilog. Ang malaking titik sa “Ilog” ay nagpapakitang kilalang heograpikong katawagan ito sa konteksto nang hindi ipinapasok sa pangunahing teksto ang pangalang Eufrates.
- source_word: וָאוֹלֵךְ אוֹתוֹ בְּכָל אֶרֶץ כְּנָעַן
  choice: Dinala ko siya sa buong lupain ng Canaan
  rationale: 'Ang Hiphil ng הלך ay sanhi: pinayaon o dinala siya ng Diyos. Ang “dinala” ay malinaw at likas sa Tagalog, at ang “sa buong lupain” ay nagpapanatili sa lawak na ipinahahayag ng בְּכָל.'
- source_word: וָאַרְבֶּה אֶת־זַרְעוֹ
  choice: pinarami ko ang kanyang lahi
  rationale: Ang Hiphil ng רבה ay nangangahulugang gawing marami. Ang “lahi” ay likas na kolektibong katawagan para sa זֶרַע at hindi kasing-literal o malabo ng “binhi” sa modernong Tagalog.
- source_word: וָאֶתֶּן לוֹ אֶת־יִצְחָק
  choice: at ibinigay ko sa kanya si Isaac
  rationale: Pinananatili nito si Isaac bilang tuwirang layon at bilang kaloob ng Diyos kay Abraham, sa natural na ayos ng pangungusap sa Tagalog.
theological_decisions:
- issue: Pagtukoy kay Abraham bilang ama ng Israel
  choice: inyong amang si Abraham
  alternative: inyong ninunong si Abraham
  rationale: Tahasan ang “inyong ama” sa Hebreo. Pinananatili ng salin ang pampamilya at pangtipang retorika sa halip na gawing mas pangkalahatan ang katawagang “ninuno.”
- issue: Pagkakakilanlan ng “Ilog”
  choice: Ilog
  alternative: Ilog Eufrates
  rationale: Karaniwang pangngalang may tiyak na pantukoy ang nasa Hebreo, hindi ang mismong pangalang Eufrates. Kaya nananatili sa pangunahing teksto ang anyong “Ilog,” habang inilalagay sa talababa ang malamang na pagkakakilanlan.
- issue: Kolektibong kahulugan ng זֶרַע
  choice: lahi
  alternative: mga inapo
  rationale: Pinananatili ng “lahi” ang kolektibong katangian ng isahang pangngalang Hebreo at hindi nililimitahan ang diwa sa isang anak lamang, samantalang kinikilala sa talababa ang posibleng saling “mga inapo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “inyong” upang bumagay sa pormal na pahayag ng Diyos sa buong Israel, at iniwasan ang labis na teknikal o makalumang pananalita.
