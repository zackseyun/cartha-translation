  text: וַ/יָּ֨קָם בָּלָ֤ק בֶּן צִפּוֹר֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵ֑ל וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א לְ/בִלְעָ֥ם בֶּן בְּע֖וֹר לְ/קַלֵּ֥ל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: tl
  text: Pagkatapos, bumangon[a] si Balak na anak ni Zipor, na hari ng Moab, at nakipaglaban siya sa Israel[b]. Nagsugo siya at ipinatawag si Balaam na anak ni Beor upang sumpain kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumindig.” Sa Hebreo, maaari itong magpahiwatig ng pagsisimula ng isang tiyak na pagkilos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakipagdigma sa Israel” o “lumaban laban sa Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Maaaring tumukoy ang קום sa literal na pagtayo o, gaya rito sa salaysay, sa pagsisimula ng tiyak na pagkilos. Pinananatili ng “bumangon” ang larawan at galaw ng Hebreo nang hindi nililimitahan ito sa pisikal na pagtayo.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: nakipaglaban siya sa Israel
  rationale: Ang לחם na may ב ay nagsasaad ng pakikipaglaban laban sa isang kaaway. Likas sa modernong Tagalog ang “nakipaglaban sa Israel” at malinaw sa konteksto ang paglalaban.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: Nagsugo siya at ipinatawag
  rationale: Pinananatili ang dalawang magkasunod na pandiwa ng Hebreo. Ipinahihiwatig ng “nagsugo” ang pagpapadala ng mensahero, at natural na ipinapahayag ng “ipinatawag” ang layunin ng pagtawag kay Balaam.
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: si Balaam na anak ni Beor
  rationale: Isinalin ang ugnayang pampamilya sa karaniwang Tagalog at pinanatili ang kinikilalang anyo ng mga pangalang pantangi.
- source_word: לְקַלֵּל אֶתְכֶם
  choice: upang sumpain kayo
  rationale: Tuwirang ipinapahayag ng “sumpain” ang pagbigkas o paghiling ng sumpa laban sa kausap, nang walang di-kailangang pagpapalawak.
theological_decisions:
- issue: Ang pahayag na nakipaglaban si Balak sa Israel, samantalang itinatampok sa Mga Bilang ang pagtatangka niyang ipasumpa ang Israel kay Balaam
  choice: Pinanatili ang tahasang diwa na “nakipaglaban siya sa Israel.”
  alternative: Paluwagin bilang “kumilos siya laban sa Israel,” o baguhin bilang “naghanda siyang makipaglaban.”
  rationale: Maliwanag na ginagamit ng tekstong Hebreo ang וַיִּלָּחֶם בְּיִשְׂרָאֵל. Hindi dapat baguhin ng salin ang buod sa Josue upang alisin ang tensiyon nito sa paglalahad ng ibang talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagkatapos” bilang natural na panandang pasalaysay, at pinanatili ang magkasunod na kilos sa “Nagsugo siya at ipinatawag” nang hindi ginagawang mabigat ang pangungusap.
