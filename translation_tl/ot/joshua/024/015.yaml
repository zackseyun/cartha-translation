source:
  edition: WLC
  text: וְ/אִם֩ רַ֨ע בְּֽ/עֵינֵי/כֶ֜ם לַ/עֲבֹ֣ד אֶת יְהוָ֗ה בַּחֲר֨וּ לָ/כֶ֣ם הַ/יּוֹם֮ אֶת מִ֣י תַעֲבֹדוּ/ן֒ אִ֣ם אֶת אֱלֹהִ֞ים אֲשֶׁר עָבְד֣וּ אֲבוֹתֵי/כֶ֗ם אֲשֶׁר֙ ב/עבר הַ/נָּהָ֔ר וְ/אִם֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/אָנֹכִ֣י וּ/בֵיתִ֔/י נַעֲבֹ֖ד אֶת יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: tl
  text: Ngunit kung masama sa paningin ninyo ang maglingkod kay Yahweh[a], piliin ninyo ngayon para sa inyong sarili kung sino ang paglilingkuran ninyo—ang mga diyos na pinaglingkuran ng inyong mga ama[b] sa ibayo ng Ilog[c], o ang mga diyos ng mga Amoreo, na sa lupain nila kayo naninirahan. Ngunit para sa akin at sa aking sambahayan[d], maglilingkod kami kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mali para sa inyo” o “hindi kalugod-lugod sa inyo”; literal, “masama sa paningin ninyo.”
    reason: lexical_alternative
  - marker: b
    text: O “inyong mga ninuno”; literal, “inyong mga ama.”
    reason: lexical_alternative
  - marker: c
    text: Ang “Ilog” ay tumutukoy sa Ilog Eufrates.
    reason: cultural_note
  - marker: d
    text: O “aking buong sambahayan”; tumutukoy sa mga taong kabilang sa kanyang bahay, hindi lamang sa gusali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahahayag ang kondisyong may pagsalungat sa naunang panawagan.
- source_word: רַע בְּעֵינֵיכֶם
  choice: masama sa paningin ninyo
  rationale: Pinananatili ang matalas at sadyang konkretong idyoma ng Hebreo, habang malinaw pa rin sa modernong Filipino.
- source_word: לַעֲבֹד / תַעֲבֹדוּן / עָבְדוּ / נַעֲבֹד
  choice: maglingkod / paglilingkuran / pinaglingkuran / maglilingkod
  rationale: Pinananatili ang pag-uulit ng ugat na עבד at ang malawak na diwa nito ng paglilingkod, pagsamba, at katapatan, nang hindi ito pinakikitid sa 'sumamba' lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa tekstong Hebreo sa pamamagitan ng karaniwang transliterasyong Yahweh.
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: piliin ninyo ngayon
  rationale: Natural na utos sa Filipino na pinananatili ang diin at kagyat na panahon ng 'ngayon'; ang diwang 'para sa inyong sarili' ay likas nang nasa pangmaramihang pautos.
- source_word: אֶת מִי תַעֲבֹדוּן
  choice: kung sino ang paglilingkuran ninyo
  rationale: Ang 'kung sino' ay natural na Filipino pagkatapos ng 'piliin' at malinaw na tumutukoy sa pagpili ng paglilingkuran.
- source_word: אֲשֶׁר עָבְדוּ אֲבוֹתֵיכֶם
  choice: na pinaglingkuran ng inyong mga ninuno
  rationale: Ang אָבוֹת ay literal na 'mga ama,' ngunit sa kontekstong pangkasaysayan ay tumutukoy sa mga naunang salinlahi; 'mga ninuno' ang malinaw at likas na Filipino.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: sa ibayo ng Ilog
  rationale: Pinananatili ang kinikilalang heograpikong katawagang 'ang Ilog,' na tumutukoy sa Eufrates.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Karaniwang anyong Filipino ng pangalan ng pangkat-etniko.
- source_word: אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם
  choice: na ang lupain ay tinitirhan ninyo
  rationale: Malinaw na inuugnay ang lupain sa mga Amoreo at pinananatili ang kasalukuyang kalagayan ng paninirahan.
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: Ngunit ako at ang aking sambahayan
  rationale: Inihahatid ang mariing pagsalungat ng panig ni Josue; ang 'sambahayan' ay natural na katumbas ng בַּיִת kapag tumutukoy sa buong household, hindi lamang sa gusali.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa Hebreo, kaya pinananatili ito sa transliterasyon sa halip na palitan ng isang titulo.
- issue: Saklaw ng relihiyosong pandiwang עבד
  choice: maglingkod
  alternative: sumamba
  rationale: Sinasaklaw ng 'maglingkod' ang pagsamba at tipanang katapatan at pinananatili ang paulit-ulit na pandiwa sa buong talata.
- issue: Kahulugan ng וּבֵיתִי
  choice: ang aking sambahayan
  alternative: ang aking bahay
  rationale: Maaaring tumukoy ang 'bahay' sa gusali o angkan; sa konteksto, ang mga taong kabilang sa sambahayan ni Josue ang maglilingkod kay Yahweh.
- issue: Paglalarawan sa pasiya ng mga tagapakinig sa רַע בְּעֵינֵיכֶם
  choice: masama sa paningin ninyo
  alternative: mali para sa inyo; hindi kalugod-lugod sa inyo
  rationale: Pinananatili ang retorikal na tindi at pananaw ng mga tagapakinig nang hindi ipinapakahulugang talagang masama ang paglilingkod kay Yahweh.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong idyomang “masama sa paningin ninyo,” ang pag-uulit ng “maglingkod,” at ang mariing paghahambing sa huling pangungusap. Inilagay ang bawat talababa sa mismong pariralang nililinaw nito.
