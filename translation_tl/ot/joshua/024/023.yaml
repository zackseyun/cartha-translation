id: JOS.24.23
reference: Joshua 24:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הָסִ֛ירוּ אֶת אֱלֹהֵ֥י הַ/נֵּכָ֖ר אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֑ם וְ/הַטּוּ֙ אֶת לְבַבְ/כֶ֔ם אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: tl
  text: Kaya ngayon, alisin ninyo ang mga diyos ng ibang bayan na nasa gitna ninyo, at ituon ninyo ang inyong puso kay Yahweh, ang Diyos ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ikiling ninyo ang inyong puso kay Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahihiwatig ng וְ kasama ng עַתָּה ang agarang panghuling panawagan batay sa naunang sinabi; natural itong ipinapahayag sa Filipino bilang “Kaya ngayon.”
- source_word: הָסִירוּ
  choice: alisin ninyo
  rationale: Ang causative plural imperative ay tuwirang utos na tanggalin o iwaksi ang mga diyos; malinaw at kasalukuyang Filipino ang “alisin ninyo.”
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: ang mga diyos ng ibang bayan
  rationale: Tumutukoy ang parirala sa mga diyos na kaugnay ng mga banyagang bayan o pagsamba, hindi lamang sa mga diyos na kakaiba.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: na nasa gitna ninyo
  rationale: Pinananatili nito ang posibleng konkretong diwa ng presensiya ng mga diyus-diyosan sa loob ng sambayanan at iniiwasang gawing tiyak na panloob lamang ang kahulugan.
- source_word: וְהַטּוּ
  choice: at ituon ninyo
  rationale: Ang נטה na may “puso” at אֶל ay larawan ng pagkiling o pagtutuon ng kalooban patungo sa isang tinutukoy; natural ang “ituon” habang pinananatili ang direksiyonal na diwa.
- source_word: לְבַבְכֶם
  choice: ang inyong puso
  rationale: Pinananatili ang singular na kolektibong “puso,” na maaaring maglarawan sa nagkakaisang kalooban at katapatan ng buong bayan.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ipinahahayag ng אֶל ang direksiyon ng puso patungo kay YHWH, at pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at likas na salin ito ng construct phrase na kumikilala kay Yahweh bilang Diyos ng Israel.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Ang “Yahweh” ay tuwirang transliterasyon na hindi pinapalitan ang pangalan ng isang titulo.
- issue: Kalikasan ng “puso” sa utos
  choice: singular na kolektibong “inyong puso”
  alternative: “inyong mga puso”
  rationale: Singular ang לְבַב na may pangmaramihang hulapi. Pinananatili ng salin ang gramatikal at kolektibong tensiyon sa halip na awtomatikong gawing maramihan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa sa publiko. Ginamit ang “mga diyos ng ibang bayan” upang maging natural ngunit tumpak ang ideya ng foreign gods. Ang footnote marker [a] ay inilagay sa pangunahing teksto.
