  source_fidelity: 'Tumpak na naihahatid ang magkakaugnay na mga pautos sa Hebreo: ang agarang panawagan (“Kaya ngayon”), ang pag-aalis ng mga banyagang diyos na nasa gitna ng bayan, at ang pagtutuon ng kolektibong puso tungo kay Yahweh. Ang “mga diyos ng ibang bayan” ay isang katanggap-tanggap na pagpapahayag ng אֱלֹהֵי הַנֵּכָר, bagaman may bahagyang mas tuwirang alternatibong “mga banyagang diyos.”'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang “alisin ninyo,” “nasa gitna ninyo,” at “ituon ninyo ang inyong puso” ay angkop sa pampublikong pagbasa at hindi pilit.
  terminology: Wastong pinanatili ang Yahweh para sa יהוה at “Diyos ng Israel” para sa אֱלֹהֵי יִשְׂרָאֵל. Ang singular na “inyong puso” ay naaayon sa kolektibong singular ng Hebreo. Ang talababa ay wastong nagbibigay ng leksikal na alternatibo para sa וְהַטּוּ.
