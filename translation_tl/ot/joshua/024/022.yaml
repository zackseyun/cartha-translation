  terminology: Ang “Josue,” “bayan,” “Yahweh,” “paglingkuran,” at “mga saksi” ay angkop at pare-pareho sa rehistro. Ang “laban sa sarili ninyo” ay wastong pangunahing pagbasa sa legal-tipanang konteksto, habang pinananatili ng talababa ang mas di-tiyak na alternatibo.
