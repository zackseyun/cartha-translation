base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Josue sa bayan[a], “Kayo ang mga saksi laban sa sarili ninyo na pinili ninyo si Yahweh para sa inyong sarili upang paglingkuran siya.” At sinabi nila, “Kami ang mga saksi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kayo ang mga saksi tungkol sa sarili ninyo,” ibig sabihin, ang sarili ninyong mga salita ang nagpapatotoo sa pinili ninyo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos, sinabi” habang pinananatili ang pagkakasunod-sunod.
- source_word: הָעָם
  choice: sa bayan
  rationale: Tumutukoy ang עָם sa nagkakatipong sambayanan; ang “bayan” ay maikli, natural, at angkop sa konteksto.
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: Kayo mismo ang mga saksi laban sa inyong sarili
  rationale: Sa legal at tipanang konteksto, ipinahihiwatig ng בָּכֶם na ang sarili nilang pahayag ang nagpapatotoo laban sa kanila. Pinananatili ng “kayo mismo” ang diin sa אַתֶּם.
- source_word: כִּי
  choice: na
  rationale: 'Ipinakikilala nito ang nilalaman ng kanilang patotoo: pinili nila si Yahweh.'
- source_word: בְּחַרְתֶּם לָכֶם
  choice: pinili ninyo
  rationale: Malinaw na naipahahayag ng aktibong parirala ang sarili nilang kusang pagpili; ang reflexive na diin ng לָכֶם ay naipahihiwatig na rin ng “kayo mismo” at “inyong sarili,” kaya iniwasan ang mabigat na pag-uulit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang isinasalin sa titik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: לַעֲבֹד אֹתוֹ
  choice: upang paglingkuran siya
  rationale: Masaklaw ang עבד sa katapatan, paglilingkod, at pagsamba; pinananatili ng “paglingkuran” ang lawak nito.
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: At sinabi nila, “Kami ang mga saksi.”
  rationale: Elliptical ang Hebreong tugon. Ang pagdagdag ng “Kami ang” ay kailangan para sa malinaw at natural na Tagalog nang hindi nagdaragdag ng bagong kahulugan.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Puwersa ng patotoo sa עֵדִים אַתֶּם בָּכֶם
  choice: mga saksi laban sa inyong sarili
  alternative: mga saksi sa inyong sarili
  rationale: Ang kontekstong tipanan at legal ay nagpapahiwatig na maaaring managot ang bayan batay sa sarili nilang pahayag, ngunit itinatala sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Josue,” “bayan,” at “paglingkuran” bilang natural at pamilyar na mga anyo; pinanatili ang legal at tipanang diin nang hindi ginagawang teknikal ang pangungusap.
