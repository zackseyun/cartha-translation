  text: וַ/יֹּ֥אמֶר הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ לֹ֕א כִּ֥י אֶת יְהוָ֖ה נַעֲבֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: tl
  text: Ngunit sinabi ng bayan kay Josue, “Hindi! Si Yahweh ang paglilingkuran namin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר הָעָם
  choice: sinabi ng bayan
  rationale: Ang anyong pasalaysay ng אמר ay likas na isinasaling “sinabi,” at ang עָם ay tumutukoy sa nagkakatipong bayang Israel.
- source_word: אֶל יְהוֹשֻׁעַ
  choice: kay Josue
  rationale: Ang אֶל ay nagmamarka sa kinausap; “Josue” ang kinagawiang anyo ng pangalang Hebreo sa Filipino.
- source_word: לֹא
  choice: Hindi!
  rationale: Nakatayong mag-isa ang לֹא bilang mariing pagtanggi sa naunang sinabi ni Josue; ipinahahayag ng tandang padamdam ang diin nang hindi nagdaragdag ng kahulugan.
- source_word: כִּי
  choice: ngunit … ang
  rationale: Pagkatapos ng mariing לֹא, ang כִּי ay nagpapakilala ng pagsalungat o pagtutuwid. Sa natural na Filipino, naihahatid ito ng “ngunit” at ng pangungusap na may pokus sa bagay na paglilingkuran.
- source_word: אֶת יְהוָה
  choice: Si Yahweh ang
  rationale: Ang אֵת ay pananda sa tiyak na layon at hindi kailangang isalin nang hiwalay. Ang paglalagay kay Yahweh sa pokus ay nagpapanatili sa diin ng nauunang layon sa Hebreo.
- source_word: נַעֲבֹד
  choice: paglilingkuran namin
  rationale: Ang Qal imperfect na unang panauhang maramihan ng עבד ay nagpapahayag ng pasiya o pangakong maglingkod. Ang “paglilingkuran” ay nagpapanatili sa malawak na diwa ng katapatan at pagsamba sa tipan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang pangalang tipan na יהוה. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng kahulugan ng עבד
  choice: paglilingkuran
  alternative: sasambahin
  rationale: Kasama sa pandiwa ang pagsamba ngunit mas malawak ito, sapagkat tumutukoy rin sa katapatan at paglilingkod sa Diyos; hindi ito dapat paliitin sa gawaing pagsamba lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa sama-samang pamayanan ng Israel at ang karaniwang Filipinong anyong “Josue.” Ang hulma na “Si Yahweh ang paglilingkuran namin” ay natural sa Filipino at pinananatili ang diin ng Hebreo kay Yahweh bilang tanging paglilingkuran.
