id: JOS.24.32
reference: Joshua 24:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: tl
  text: Ang mga buto ni Jose, na iniakyat ng mga anak ni Israel mula sa Ehipto, ay inilibing nila sa Shekem, sa bahagi ng bukid[a] na binili ni Jacob mula sa mga anak ni Hamor, ang ama ni Shekem,[b] sa halagang isang daang kesita.[c] At iyon ay naging mana ng mga anak ni Jose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kapirasong lupain.” Ang salitang Hebreo ay tumutukoy sa isang takdang bahagi o parsela ng lupa.
    reason: lexical_alternative
  - marker: b
    text: Ang “ama” ay maaari ring gamitin sa mas malawak na diwang “tagapagtatag” o “pangunahing ninuno” ng Shekem.
    reason: lexical_alternative
  - marker: c
    text: Ang kesita ay isang sinaunang yunit ng halaga o salapi; hindi tiyak ang eksaktong katumbas nito.
    reason: cultural_note
lexical_decisions:
- source_word: עַצְמוֹת
  choice: mga buto
  rationale: Tuwirang katumbas ito ng konkretong salitang Hebreo at pinananatili ang ugnay sa tradisyon tungkol sa paglilibing kay Jose.
- source_word: הֶעֱלוּ
  choice: iniakyat
  rationale: Ang Hiphil ng עלה ay nangangahulugang ‘ipinaakyat’ o ‘dinala paitaas.’ Likas sa salaysay ng pag-alis mula sa Ehipto ang ‘iniakyat,’ at malinaw na nauna ang kilos sa paglilibing.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pampamilyang pahayag ng Hebreo sa paraang malinaw at likas pa rin sa modernong Tagalog.
- source_word: קָבְרוּ
  choice: inilibing nila
  rationale: Pinananatili ang aktibong pandiwa at ang tahasang maramihang gumaganap ng kilos.
- source_word: בִּשְׁכֶם
  choice: sa Shekem
  rationale: Ang ‘sa’ ang natural na panandang Tagalog para sa lugar ng paglilibing.
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: sa bahagi ng bukid
  rationale: Ang חֶלְקָה ay isang takdang bahagi o parsela ng lupain. Malinaw ang ‘bahagi ng bukid’ at malapit sa anyo ng Hebreo.
- source_word: קָנָה
  choice: binili
  rationale: Sa konteksto ng ibinayad na halaga, mas tiyak ang ‘binili’ kaysa sa mas malawak na ‘tinamo’ o ‘nakuha.’
- source_word: בְּנֵי חֲמוֹר
  choice: mga anak ni Hamor
  rationale: Tuwirang pinananatili ang Hebreong ‘mga anak ni Hamor’ sa halip na ipakahulugang agad na ‘mga inapo.’
- source_word: אֲבִי שְׁכֶם
  choice: ama ni Shekem
  rationale: Ito ang pinakadirektang salin. Ang posibleng mas malawak na diwang ‘tagapagtatag’ o ‘pangunahing ninuno’ ay inilagay sa talababa.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: sa halagang isang daang kesita
  rationale: Hindi tiyak ang eksaktong katumbas ng sinaunang yunit na קְשִׂיטָה, kaya tinumbasan ito sa baybay-Tagalog nang hindi nagbibigay ng huwad na modernong halaga.
- source_word: וַיִּהְיוּ לִבְנֵי יוֹסֵף לְנַחֲלָה
  choice: At naging mana iyon ng mga anak ni Jose
  rationale: Ang ‘naging mana’ ay natural na katumbas ng לְנַחֲלָה. Ang ‘iyon’ ay hindi tahasang nagtatakda ng bilang at pinahihintulutang manatiling bahagyang bukas ang reperensiya, bagaman sa konteksto ay malamang na tumutukoy sa lupain.
theological_decisions:
- issue: Pampamilyang katawagang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing salin ang pampamilya at tipanang anyo ng Hebreo nang hindi nagiging di-likas sa Tagalog.
- issue: Hindi tiyak na sinaunang yunit na קְשִׂיטָה
  choice: kesita
  alternative: salapi o piraso ng salapi
  rationale: Ang transliterasyon ay umiiwas sa labis na katiyakan tungkol sa uri at halaga ng yunit; ipinaliliwanag sa talababa ang kawalang-katiyakan.
- issue: Reperensiya ng וַיִּהְיוּ
  choice: naging mana iyon
  alternative: ang lupain ay naging mana; ang mga iyon ay naging mana
  rationale: Maramihan ang pandiwang Hebreo, ngunit hindi ganap na malinaw ang tinutukoy nito; sa konteksto, malamang na ang biniling lupain ang naging mana. Ang ‘iyon’ ay natural sa Tagalog at hindi labis na nilulutas ang gramatikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tradisyonal at pamilyar na mga anyong pangalang Jose, Israel, Jacob, Hamor, Shekem, at Ehipto. Iniwasan ang sobrang teknikal na pananalita sa pangunahing teksto; ang mga kailangang paglilinaw ay nasa mga talababa.
