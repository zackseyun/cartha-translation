revisions:
- from: Ang mga buto ni Jose, na iniakyat ng mga anak ni Israel mula sa Ehipto, ay inilibing nila sa Shekem, sa bahagi ng bukid[a] na binili ni Jacob sa mga anak ni Hamor na ama ni Shekem,[b] sa halagang isang daang kesita.[c] At naging mana iyon ng mga anak ni Jose.
  to: Ang mga buto ni Jose, na iniakyat ng mga anak ni Israel mula sa Ehipto, ay inilibing nila sa Shekem, sa bahagi ng bukid[a] na binili ni Jacob mula sa mga anak ni Hamor, ang ama ni Shekem,[b] sa halagang isang daang kesita.[c] At iyon ay naging mana ng mga anak ni Jose.
  rationale: Inayos ang pagkakabit ng “ama ni Shekem” upang malinaw na si Hamor, hindi ang kaniyang mga anak, ang tinutukoy. Inayos din nang bahagya ang huling sugnay para sa mas natural na modernong Tagalog, nang hindi nilulutas nang higit sa teksto ang bahagyang tensiyon sa maramihang pandiwang Hebreo.
