source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of servants, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: tl
  text: Sapagkat si Yahweh na ating Diyos ang siyang naglabas sa atin at sa ating mga ninuno mula sa lupain ng Ehipto, mula sa bahay ng mga alipin,[a] at gumawa ng mga dakilang tanda na ito sa harap ng ating mga mata. Iningatan niya tayo sa buong daang nilakbay natin at sa gitna ng lahat ng mga bansang dinaanan natin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bahay ng mga alipin”; maaari ring ipakahulugang “lugar ng pagkaalipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ang dahilan ng ipinahayag na paninindigan ng bayan sa naunang talata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang tahasang pangalang tipan ng Diyos sa tekstong Hebreo.
- source_word: אֱלֹהֵינוּ הוּא
  choice: si Yahweh na ating Diyos ang siyang
  rationale: Ang “ang siyang” ay natural na paraan sa Tagalog upang maipahayag ang diin ng hiwalay na panghalip na הוּא.
- source_word: הַמַּעֲלֶה אֹתָנוּ
  choice: naglabas sa atin
  rationale: Bagaman literal na may larawang “nagpaahon,” sa konteksto ng Exodo ang “naglabas” ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: אֲבוֹתֵינוּ
  choice: ating mga ninuno
  rationale: Saklaw nito ang mga naunang salinlahi ng Israel at mas natural kaysa literal na “mga ama” sa kontekstong pangkasaysayan.
- source_word: מִבֵּית עֲבָדִים
  choice: mula sa bahay ng mga alipin
  rationale: Pinananatili ang kongkretong pangmaramihang pangngalang “mga alipin,” sa halip na gawing abstraktong “pagkaalipin.”
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: mga dakilang tandang ito
  rationale: Ang “mga tanda” ay nagpapanatili sa malawak na kahulugan ng אוֹת nang hindi agad nililimitahan sa “mga himala” o “mga kababalaghan.”
- source_word: וַיִּשְׁמְרֵנוּ
  choice: Iningatan niya tayo
  rationale: Malinaw nitong ipinahahayag ang mapag-ingat at mapagtanggol na kilos ng pandiwa.
- source_word: בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ
  choice: sa buong daang nilakbay natin
  rationale: Likas sa Tagalog at pinananatili ang saklaw ng “buong daan” at ang paglalakbay ng bayan.
- source_word: וּבְכֹל הָעַמִּים אֲשֶׁר עָבַרְנוּ בְּקִרְבָּם
  choice: sa gitna ng lahat ng bayang dinaanan natin
  rationale: Pinananatili ang larawan ng pagdaan sa gitna ng mga bayan, habang gumagamit ng natural na ayos sa Tagalog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasan ang Tetragrammaton sa Hebreo; ang transliterasyong “Yahweh” ay nagpapanatili sa personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng עֲבָדִים sa pormula ng Exodo
  choice: mga alipin
  alternative: pagkaalipin
  rationale: Pangmaramihang kongkretong pangngalan ang Hebreo. Pinananatili ng “mga alipin” ang kalagayang panlipunan na hayagang tinutukoy ng teksto.
- issue: Saklaw ng אוֹת
  choice: mga tanda
  alternative: mga himala
  rationale: Ang “tanda” ay hindi nag-aalis sa mahimalang katangian ng mga gawa ngunit pinananatili ang pangunahing diwa ng mga ito bilang mga tandang nagpapakilala sa gawa ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga ninuno” sa halip na literal na “mga ama,” at hinati sa dalawang pangungusap ang mahabang Hebreong pangungusap para sa likas at malinaw na pagbasa. Lahat ng panandang talababa ay nasa pangunahing teksto.
