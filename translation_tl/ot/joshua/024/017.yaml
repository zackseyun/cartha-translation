  - severity: low
    issue: Ang “mga dakilang tandang ito” ay hindi gaanong likas kaysa “mga dakilang tanda.”
    rationale: Sa modernong Tagalog, ang “tanda” ang karaniwang anyo para sa sign; malinaw na ang plural dahil sa “mga.”
  - severity: low
    issue: Ang talababa b ay hindi kinakailangan at ang angkla nito sa hulihan ay hindi tumutugma sa ibinibigay nitong paliwanag.
    rationale: Ang binagong pangunahing teksto ay direktang isinasalin ang הָעַמִּים bilang “mga bansa,” kaya wala nang kailangang alternatibong tala sa puntong iyon.
