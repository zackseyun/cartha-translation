  naturalness: Marangal at likas sa modernong Tagalog ang kabuuang daloy. Mas malinaw at mas natural ang “mga dakilang tanda” kaysa “mga dakilang tandang ito,” at ang “mga bansang dinaanan natin” ay mas tiyak sa kasalukuyang konteksto.
  terminology: Ang “Yahweh,” “Diyos,” “mga ninuno,” at “mga alipin” ay angkop. Pinananatili ang kongkretong “mga alipin” para sa עֲבָדִים. Ang talababa sa dulo ay hindi tumutugma sa anumang tunay na leksikal na alternatibong kailangang markahan doon at mas mabuting alisin.
