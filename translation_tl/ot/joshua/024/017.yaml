  to: Sapagkat si Yahweh na ating Diyos ang siyang naglabas sa atin at sa ating mga ninuno mula sa lupain ng Ehipto, mula sa bahay ng mga alipin,[a] at gumawa ng mga dakilang tanda na ito sa harap ng ating mga mata. Iningatan niya tayo sa buong daang nilakbay natin at sa gitna ng lahat ng mga bansang dinaanan natin.
