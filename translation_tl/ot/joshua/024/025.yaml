  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: tl
  text: Noong araw na iyon, nakipagtipan si Josue sa bayan[a], at doon sa Sichem ay nagtakda siya para sa kanila ng tuntunin at kautusan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pumutol ng tipan.”
    reason: lexical_alternative
  - marker: b
    text: O “batas at ordinansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: nakipagtipan
  rationale: Ang כרת ברית ay literal na “pumutol ng tipan,” ngunit ang likas at malinaw na katumbas sa modernong Tagalog ay “nakipagtipan.” Napananatili nito ang may-bisang ugnayang ipinahihiwatig ng idyoma.
- source_word: בְּרִית
  choice: tipan
  rationale: Ang “tipan” ang karaniwang dignified at teolohikal-legal na katumbas ng בְּרִית; higit nitong napapanatili ang bigat ng salita kaysa “kasunduan.”
- source_word: לָעָם
  choice: sa bayan
  rationale: Sa pariralang כרת ברית, ang ל ay tumutukoy sa kabilang panig na kasangkot sa tipan. Ang “nakipagtipan ... sa bayan” ay natural sa Tagalog at hindi nagpapahiwatig na tagapamagitan lamang si Josue.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural na temporal na pagpapahayag sa Tagalog na tapat sa Hebreong “sa araw na iyon.”
- source_word: וַיָּשֶׂם
  choice: nagtakda
  rationale: Sa legal na konteksto, ang שׂים ay hindi lamang pisikal na “maglagay” kundi magtakda o magtatag ng mga pamantayan. Ang “nagtakda” ay malinaw at natural.
- source_word: לוֹ
  choice: para sa kanila
  rationale: Bagaman pang-isahan ang anyo, bumabalik ito sa עָם bilang kolektibong pangngalan. Ang maramihang “kanila” ang natural na pagtukoy sa mga taong bumubuo sa bayan.
- source_word: חֹק
  choice: tuntunin
  rationale: Ipinahihiwatig ng חֹק ang itinakdang batas o alituntunin. Ang “tuntunin” ay madaling maunawaan at may sapat na legal na bigat.
- source_word: וּמִשְׁפָּט
  choice: kahatulan
  rationale: Pinananatili ng “kahatulan” ang mas literal at posibleng hudisyal na diwa ng מִשְׁפָּט, sa halip na ipirmi ito bilang isa lamang pangkalahatang ordinansa.
- source_word: בִּשְׁכֶם
  choice: doon sa Sichem
  rationale: Ang “sa Sichem” ang tuwirang lokatibong kahulugan; ang “doon” ay natural na panandang diskurso na nag-uugnay sa kilos sa tagpong binabanggit.
theological_decisions:
- issue: Ang likas ng pakikipagtipan ni Josue
  choice: nakipagtipan si Josue sa bayan
  alternative: pinanibago ni Josue ang tipan para sa bayan
  rationale: Si Josue ang tahasang simuno ng pandiwang pakikipagtipan sa talata. Hindi tahasang sinasabi rito na pinanibago lamang niya ang tipan o na kumilos siya bilang kinatawan ng ibang partido, kaya hindi idinagdag ang gayong paliwanag.
- issue: Saklaw ng חֹק וּמִשְׁפָּט
  choice: tuntunin at kahatulan
  alternative: batas at alituntunin
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong legal na termino. Ang “kahatulan” ay nag-iiwan ng puwang sa hudisyal na diwa ng מִשְׁפָּט.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang tradisyonal na anyong “Josue” at “Sichem,” at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
