id: JOS.24.14
reference: Joshua 24:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: tl
  text: Kaya ngayon, matakot kayo kay Yahweh at paglingkuran ninyo siya nang may integridad at katapatan[a]. Alisin ninyo ang mga diyos na pinaglingkuran ng inyong mga ninuno sa ibayo ng Ilog[b] at sa Ehipto, at paglingkuran ninyo si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga salitang Hebreo ay nagpapahiwatig ng kabuuan, katapatan ng kalooban, katotohanan, at pagiging maaasahan.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, sa ibayo ng Ilog Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinakikita nito na ang utos ay kongklusyon at tugon sa naunang pagsasalaysay ng ginawa ni Yahweh. Mas natural ito sa modernong Tagalog kaysa sa payak na “At ngayon.”
- source_word: יְרָאוּ אֶת־יְהוָה
  choice: matakot kayo kay Yahweh
  rationale: Pinananatili ng “matakot” ang bigat ng karaniwang salitang Hebreo para sa takot sa Diyos, na sa konteksto ay may kasamang pagpipitagan at pagsunod.
- source_word: וְעִבְדוּ אֹתוֹ
  choice: at paglingkuran ninyo siya
  rationale: Saklaw ng עבד ang pagsamba, katapatan, at pagsunod. Mas malawak at mas malapit sa Hebreo ang “paglingkuran” kaysa sa “sambahin” lamang.
- source_word: בְּתָמִים וּבֶאֱמֶת
  choice: nang may integridad at katapatan
  rationale: Ipinahahayag ng תמים ang kabuuan at kawalan ng pagkukunwari, samantalang maaaring ipahiwatig ng אמת ang katotohanan, pagiging maaasahan, o katapatan. Ang pares na ito ay natural sa modernong Tagalog at hindi nagpapahiwatig ng ganap na kawalang-kasalanan.
- source_word: וְהָסִירוּ
  choice: Alisin ninyo
  rationale: Tuwirang utos itong itakwil o alisin ang mga karibal na diyos.
- source_word: אֶת־אֱלֹהִים
  choice: ang mga diyos
  rationale: Walang tahasang salitang “banyaga” sa Hebreo, kaya hindi iyon idinagdag sa pangunahing teksto.
- source_word: אֲבוֹתֵיכֶם
  choice: inyong mga ninuno
  rationale: Ang “mga ninuno” ang natural at malinaw na katumbas sa Tagalog para sa mga naunang salinlahi ng pamilya; ang literal na “mga ama” ay madaling mapagkamalang tumutukoy lamang sa kanilang mga magulang.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: sa ibayo ng Ilog
  rationale: Pinananatili ang nakasanayang heograpikong katawagang Hebreo; inilalagay sa talababa ang pagkakakilanlan ng Ilog bilang Eufrates.
- source_word: וּבְמִצְרַיִם
  choice: at sa Ehipto
  rationale: Tuwirang katumbas ng pariralang panlunan.
- source_word: וְעִבְדוּ אֶת־יְהוָה
  choice: at paglingkuran ninyo si Yahweh
  rationale: Pinananatili ang inuulit na utos at ang pang-ugnay na “at,” sa halip na ipasok ang mas tahasang pagsalungat na “ngunit.”
theological_decisions:
- issue: Pag-render sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang banal na pangalan; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kung palalambutin ang “takot” bilang pagpipitagan lamang
  choice: matakot kayo kay Yahweh
  alternative: igalang ninyo si Yahweh
  rationale: Bagaman kabilang sa diwa ang pagpipitagan, ang pandiwang Hebreo ay karaniwang salita para sa “matakot.” Pinananatili nito ang teolohikal na tensiyon sa pagitan ng takot, pagpipitagan, at masunuring katapatan.
- issue: Diwa ng תמים sa paglilingkod sa Diyos
  choice: integridad
  alternative: walang kapintasan
  rationale: Tumutukoy rito ang salita sa buo at hindi pakunwaring debosyon, hindi sa pag-aangking ganap na walang kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “paglingkuran” upang mapanatili ang mas malawak na diwa ng pagsamba at pagsunod, at “mga ninuno” upang maiwasan ang maling pagkaunawa sa literal ngunit di-likas na “mga ama.”
