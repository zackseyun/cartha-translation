  source_fidelity: 'Tumpak na naihahatid ng salin ang sunod-sunod na mga utos sa Hebreo: matakot kay Yahweh, paglingkuran siya nang may integridad at katapatan, alisin ang mga diyos na pinaglilingkuran ng mga naunang salinlahi, at paglingkuran si Yahweh. Ang “Kaya ngayon” ay katanggap-tanggap na pagpapahayag ng panandang pangdiskurso na וְעַתָּה sa konteksto ng pangwakas na panawagan ni Josue.'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang “paglingkuran ninyo” ay angkop sa inuulit na עבד at pinananatili ang saklaw nitong paglilingkod at katapatan, hindi lamang ritwal na pagsamba. Ang “mga ninuno” ay likas na Tagalog at malinaw na tumutukoy sa mga naunang salinlahi sa idiomatikong gamit ng “mga ama” sa Hebreo.
  terminology: Wastong pinananatili ang “Yahweh.” Ang “integridad at katapatan” ay isang maingat at natural na pagsasalin ng בְּתָמִים וּבֶאֱמֶת, nang hindi ipinipilit ang ganap na kawalang-kasalanan. Hindi idinagdag ang “banyaga” sa “mga diyos,” at ang pagkilala sa Ilog bilang Eufrates ay nasa talababa lamang.
