  text: וַ/יַּ֤עַן הָ/עָם֙ וַ/יֹּ֔אמֶר חָלִ֣ילָ/ה לָּ֔/נוּ מֵ/עֲזֹ֖ב אֶת יְהוָ֑ה לַ/עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: tl
  text: Sumagot ang mga tao, “Hinding-hindi namin tatalikuran si Yahweh upang maglingkod sa ibang mga diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: Sumagot ang mga tao
  rationale: Ang magkatuwang na pormulang Hebreo na literal na ‘sumagot ... at nagsabi’ ay likas na naipahahayag sa modernong Tagalog bilang ‘sumagot,’ nang hindi nawawala ang tungkulin nito bilang pambungad sa tuwirang pananalita.
- source_word: חָלִילָה לָּנוּ
  choice: Hinding-hindi namin
  rationale: Nagpapahayag ang idyomang Hebreo ng mariin at ganap na pagtanggi. Natural sa Tagalog ang ‘hinding-hindi namin’ at hindi nito idinaragdag ang pangalan ng Diyos na wala sa mismong idyoma.
- source_word: מֵעֲזֹב
  choice: tatalikuran
  rationale: 'Sa konteksto ng tipan, higit ito sa simpleng pag-alis: tumutukoy ito sa pagtalikod sa katapatan. Ang ‘tatalikuran’ ay natural at may angkop na bigat sa Tagalog.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לַעֲבֹד
  choice: upang maglingkod
  rationale: Ang infinitive na may לְ ay maaaring magpahayag ng layunin o resultang kaugnay ng pagtalikod. Pinananatili ng ‘upang maglingkod’ ang gramatikal na ugnayang iyon at ang malawak na diwa ng paglilingkod, pagsamba, at pagkilala ng katapatan.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang katumbas ito ng pariralang Hebreo at hindi nagdaragdag ng diwang ‘dayuhan’ na hindi tahasang nakasaad.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehova
  rationale: Personal na pangalan ang tahasang nasa pinagmulang Hebreo; pinananatili itong ‘Yahweh’ upang hindi mapalitan ng titulo.
- issue: Mariing idyomang חָלִילָה לָּנוּ
  choice: Hinding-hindi namin
  alternative: Huwag nawang ipahintulot ng Diyos na kami ay
  rationale: Ipinahahayag ng pinili ang matinding pagtanggi nang hindi tahasang nagdaragdag ng Diyos bilang paksa, sapagkat hindi siya binabanggit sa Hebreong idyoma.
- issue: Ugnayan ng pagtalikod at paglilingkod
  choice: tatalikuran si Yahweh upang maglingkod
  alternative: tatalikuran si Yahweh at maglilingkod
  rationale: Ang לַעֲבֹד ay infinitive na may pang-ukol na לְ, kaya ang ‘upang maglingkod’ ay mas tuwirang nagpapanatili sa anyo at posibleng layuning ugnayan ng dalawang kilos, nang ikaila na magkaugnay ang pagtalikod at paglilingkod sa ibang mga diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang salitang ‘talikuran namin’ pagkatapos ng ‘malayo sa amin,’ na magiging pilit sa Tagalog; ginamit ang likas at mariing ‘Hinding-hindi namin.’ Hindi kailangan ang talababa sapagkat malinaw na naipapahayag sa pangunahing teksto ang puwersa ng idyoma nang walang idinagdag na teolohikal na sangkap.
