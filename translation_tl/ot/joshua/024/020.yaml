base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: tl
  text: 'Kung tatalikuran ninyo si Yahweh at maglilingkod kayo sa mga diyos ng ibang bayan, babaguhin niya ang pakikitungo niya sa inyo: magpapasapit siya ng kapahamakan sa inyo[a] at lilipulin kayo[b], pagkatapos niyang gumawa ng mabuti sa inyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gagawa siya ng masama sa inyo.” Ang pandiwang Hebreo rito ay tumutukoy sa pagdudulot ng pinsala o kapahamakan, hindi sa paggawa ng moral na kasamaan.
    reason: lexical_alternative
  - marker: b
    text: O “uubusin kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Sa konteksto ng babalang ito, ipinakikilala nito ang kondisyong hahantong sa kasunod na kaparusahan.
- source_word: תַֽעַזְבוּ
  choice: tatalikuran ninyo
  rationale: Ipinahahayag ng pandiwa ang pagtalikod sa katapatan kay Yahweh, hindi lamang pisikal na pag-alis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: וַעֲבַדְתֶּם
  choice: maglilingkod kayo
  rationale: Tuwirang ipinahahayag ang relihiyosong paglilingkod at katapatan sa mga diyos.
- source_word: אֱלֹהֵי נֵכָר
  choice: mga diyos ng ibang bayan
  rationale: Natural sa modernong Tagalog at malinaw na tumutukoy sa mga diyos na banyaga sa Israel.
- source_word: וְשָׁב
  choice: babaguhin niya ang pakikitungo niya sa inyo
  rationale: Ipinapakita ang pagbabaligtad ng dating mabuting pakikitungo ni Yahweh; mas malinaw ito sa Tagalog kaysa sa literal na 'babalik siya'.
- source_word: וְהֵרַע לָכֶם
  choice: magpapasapit siya ng kapahamakan sa inyo
  rationale: Ang Hiphil ng רעה rito ay pagdudulot ng pinsala o sakuna, hindi paggawa ng moral na kasamaan.
- source_word: וְכִלָּה אֶתְכֶם
  choice: lilipulin kayo
  rationale: Ipinahahayag ang pagdadala sa ganap na wakas o pagkawasak sa natural at maringal na Tagalog.
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: matapos niya kayong gawan ng mabuti
  rationale: Pinananatili ang malinaw na kaibahan ng naunang kabutihan at ng kasunod na paghatol.
theological_decisions:
- issue: Ang paghatol ng Diyos matapos ang nauna niyang kabutihan
  choice: Tuwirang iniuugnay kay Yahweh ang pagbabaligtad ng pakikitungo at ang pagpapasapit ng kapahamakan bilang tugon sa pagtalikod ng Israel.
  alternative: Ilarawan lamang ang kapahamakan bilang likas na bunga ng idolatriya.
  rationale: Ang mga pandiwang Hebreo ay tuwirang nagtatakda kay Yahweh bilang gumagawa ng paghatol. Pinananatili ng salin ang tensiyong ito nang hindi pinahihina ang banal na pagkilos o nagdaragdag ng isang sistematikong paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at maringal. Ginamit ang “tatalikuran” para sa tipanang pag-abandona, at pinalinaw ang וְשָׁב bilang pagbabaligtad ng pakikitungo. Nasa pangunahing teksto ang lahat ng panandang talababa.
