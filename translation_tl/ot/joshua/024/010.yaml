  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: tl
  text: Ngunit hindi ko niloob na pakinggan si Balaam, at talagang pinagpala niya kayo[a]; kaya iniligtas ko kayo mula sa kanyang kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, idinidiin ang kilos sa pamamagitan ng magkaugnay na anyo ng salitang “pagpalain”; maaari ring isaling “pinagpala nga niya kayo.”
    reason: Ipinaliliwanag ang emphatic infinitive absolute nang hindi ito binibigyang-kahulugang tiyak na paulit-ulit na pagkilos.
lexical_decisions:
- source_word: אָבִיתִי
  choice: hindi ko niloob
  rationale: Ipinahahayag ng אבה ang pagkukusa o pagsang-ayon, hindi lamang kakayahan. Pinananatili ng “hindi ko niloob” ang volitional na diwa sa pananalita ng Diyos.
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: na pakinggan si Balaam
  rationale: Ang שׁמע na may ל ay maaaring mangahulugang makinig o tumalima sa isang tao. Likas sa Tagalog ang “pakinggan” at hindi nito labis na nililinaw kung simpleng pakikinig o pagsang-ayon ang tinutukoy.
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: talagang pinagpala niya
  rationale: Ang pandiwa na sinundan ng kauring infinitive absolute ay nagbibigay-diin sa kilos. Ipinahahayag ng “talagang” ang diin nang hindi ipinapalagay na ang anyo mismo ay nangangahulugang paulit-ulit na pagpapala.
- source_word: אֶתְכֶם
  choice: kayo
  rationale: Tuwirang katumbas ng ikalawang panauhang maramihang layon.
- source_word: וָאַצִּל
  choice: iniligtas ko
  rationale: Ang נצל ay nangangahulugang sagipin o iligtas mula sa panganib o kapangyarihan ng iba. Natural at angkop sa salaysay ang “iniligtas.”
- source_word: מִיָּדוֹ
  choice: mula sa kanyang kamay
  rationale: Pinananatili nito ang Hebreong larawang tumutukoy sa kapangyarihan o kontrol ng isang tao, habang nananatiling mauunawaan sa Tagalog.
theological_decisions:
- issue: Ang gumaganap ng pagpapala kay Balaam
  choice: Si Balaam ang simuno ng “pinagpala niya kayo.”
  alternative: 'Ang Diyos ang ipinahihiwatig na simuno: “pinagpala ko kayo.”'
  rationale: Ang pandiwa ay nasa ikatlong panauhang panlalaking isahan at kasunod ng pagbanggit kay Balaam, kaya si Balaam ang pinaka-natural na simuno ayon sa balarila. Ipinakikita ng mas malawak na konteksto na nanaig ang Diyos sa balak ni Balaam, ngunit hindi kailangang baguhin ang tahasang ahensiya ng pangungusap.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “niloob” upang ipahayag ang kusang hindi pagsang-ayon ng Diyos, “pinagpala” bilang karaniwang biblikal ngunit malinaw na salita, at “mula sa kanyang kamay” upang mapanatili ang larawang Hebreo ng kapangyarihan o kontrol.
