source:
  edition: WLC
  text: וַ/תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֮ וַ/תָּבֹ֣אוּ אֶל יְרִיחוֹ֒ וַ/יִּלָּחֲמ֣וּ בָ/כֶ֣ם בַּעֲלֵֽי יְ֠רִיחוֹ הָֽ/אֱמֹרִ֨י וְ/הַ/פְּרִזִּ֜י וְ/הַֽ/כְּנַעֲנִ֗י וְ/הַֽ/חִתִּי֙ וְ/הַ/גִּרְגָּשִׁ֔י הַֽ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וָ/אֶתֵּ֥ן אוֹתָ֖/ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: tl
  text: Pagkatapos, tumawid kayo sa Jordan at nakarating sa Jerico, at nakipaglaban sa inyo ang mga tao ng Jerico[a]—ang mga Amoreo, Perezeo, Cananeo, Heteo, Gergeseo, Heveo, at Jebuseo—at ibinigay ko sila sa inyong kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga panginoon ng Jerico” o “mga pangunahing lalaki ng Jerico.” Literal na “mga panginoon/may-ari ng Jerico” ang Hebreo; maaaring tumukoy ito sa mga namumuno o pangunahing tao ng lungsod, at hindi kinakailangang sa lahat ng naninirahan doon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: tumawid kayo sa Jordan
  rationale: Ang pandiwang עבר ay tumutukoy sa aktuwal na pagtawid sa Ilog Jordan. Likas at malinaw sa modernong Tagalog ang “tumawid,” at sapat na ang kilalang pangalang “Jordan” sa konteksto.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: nakarating sa Jerico
  rationale: Maaaring mangahulugan ang בוא + אֶל ng pagdating o pagpasok. Pinananatili ng “nakarating sa Jerico” ang direksiyon at pagdating nang hindi ipinapalagay na agad silang pumasok sa loob ng lungsod.
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: Nakipaglaban sa inyo
  rationale: Ang לחם na may ב ay nagpapahayag ng labanang laban sa isang panig. Sa Tagalog, malinaw sa konteksto ang mapanlabang diwa ng “nakipaglaban sa inyo.”
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: ang mga pinuno ng Jerico
  rationale: Ang בַּעֲלֵי ay literal na “mga panginoon/may-ari” at sa kontekstong panlungsod ay maaaring tumukoy sa mga namumuno o pangunahing lalaki ng lungsod. Ang “mga pinuno” ay natural at dignified, habang inilalagay sa talababa ang tunay na leksikal na kalabuan.
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: ang mga Amoreo, Perezeo, Cananeo, Heteo, Gergeseo, Heveo, at Jebuseo
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibong katawagan ang mga ito sa mga bayan. Ginamit ang karaniwang anyong Filipino ng mga pangalan at ang “mga” upang ipahayag ang kolektibong kahulugan.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: ibinigay ko sila sa inyong kamay
  rationale: Pinananatili nito ang karaniwang idyomang Hebreo ng pagbibigay sa kaaway sa kapangyarihan ng Israel. Nauunawaan pa rin sa Tagalog ang “sa inyong kamay” at napapanatili ang kongkretong larawang biblikal.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa tagumpay ng Israel
  choice: “ibinigay ko sila sa inyong kamay”
  alternative: “ipinasailalim ko sila sa inyong kapangyarihan”
  rationale: Tahasang iniuukol ng unang panauhang pananalita ng Diyos sa kanya ang tagumpay. Hindi ito pinalalambot bilang pahintulot lamang, at pinananatili ang idyomang nasa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang tradisyonal at pamilyar na anyong Filipino ng mga pangalan ng mga bayan. Pinanatili ang idyomang “sa inyong kamay” dahil malinaw ito sa konteksto at mahalaga sa estilo at teolohiya ng talata.
