  naturalness: Natural at angkop sa makabagong Filipino ang karamihan ng salin. Mas idiomatiko ang “pinalayas nito sila mula sa inyong harapan” kaysa “itinaboy nito mula sa harapan ninyo,” at malinaw na naipapakita nito ang layon ng pandiwa.
  terminology: Ang “putakti” at “mga Amoreo” ay angkop. Ang talababa ay wasto sa pangkalahatan ngunit dapat iwasan ang maramihang “mga putakti,” dahil isahan ang literal na katawagan sa Hebreo, bagaman maaari itong unawain nang kolektibo.
