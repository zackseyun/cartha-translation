base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: tl
  text: At ipinadala ko sa unahan ninyo ang putakti[a], at pinalayas nito sila mula sa inyong harapan—ang dalawang hari ng mga Amoreo—hindi sa pamamagitan ng iyong tabak ni ng iyong pana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Posible ring matalinghagang pagpapahayag ito para sa pagkataranta o sindak na ipinadala ng Diyos, sa halip na literal na putakti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: At ipinadala ko
  rationale: Pinananatili ang sunod-sunod na kilos ng Qal wayyiqtol, habang natural sa salaysay na Tagalog.
- source_word: לִפְנֵיכֶם
  choice: sa unahan ninyo
  rationale: Likas na ipinahihiwatig ang pagpapadala nang nauuna sa Israel at sinasalamin ang literal na diwang ‘sa harap ninyo.’
- source_word: הַצִּרְעָה
  choice: ang putakti
  rationale: Pinananatili ang kongkretong leksikal na kahulugan ng pangngalan sa halip na ipalit sa teksto ang posibleng matalinghagang interpretasyong ‘takot’ o ‘pang sindak.’ Maaaring gamitin ang isahan bilang kolektibo o kinatawang katawagan.
- source_word: וַתְּגָרֶשׁ אוֹתָם
  choice: at itinaboy nito
  rationale: Ang ‘itinaboy’ ay natural na katumbas ng גרשׁ na ‘palayasin/itaboy’; ang ‘nito’ ay nagpapanatili sa putakti bilang simuno ng kilos.
- source_word: מִפְּנֵיכֶם
  choice: mula sa harapan ninyo
  rationale: Malapit sa Hebreong idyoma at malinaw na inilalarawan ang pagpapaalis sa mga kaaway mula sa kinaroroonan ng Israel.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: ang dalawang hari ng mga Amoreo
  rationale: Tumpak at likas na salin ng construct chain, nang hindi tinutukoy sa pangunahing teksto kung sinu-sinong hari ang tinutukoy.
- source_word: לֹא בְחַרְבְּךָ וְלֹא בְקַשְׁתֶּךָ
  choice: hindi sa pamamagitan ng inyong tabak ni ng inyong pana
  rationale: Ipinakikita ang instrumental na gamit ng ב at pinananatili ang magkatulad na diin na hindi sariling sandata ng Israel ang sanhi ng tagumpay. Ang panghalip na maramihan ay natural na tumutukoy sa bayang kinakausap, bagaman isahan ang anyong Hebreo bilang kolektibong pagtawag.
theological_decisions:
- issue: Kung literal o matalinghaga ang הַצִּרְעָה
  choice: Literal na ‘putakti’ sa pangunahing teksto
  alternative: ‘Sindak,’ ‘takot,’ o ‘pagkataranta’ na ipinadala ng Diyos
  rationale: Ang pangunahing leksikal na kahulugan ay isang uri ng putakti. Hindi malinaw na hinihingi ng konteksto ang pagpapalit nito ng interpretasyon, kaya pinananatili sa teksto ang kongkretong larawan at inilalagay sa talababa ang tunay na posibilidad ng matalinghagang kahulugan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang ‘Amoreo’ bilang karaniwang biblikal na pangalang-etniko. Ginamit ang ‘ninyo/inyong’ para sa natural na kolektibong pagtukoy sa Israel; ang Hebreo ay nagbabago mula maramihan sa unang bahagi tungo sa isahan sa ‘iyong tabak’ at ‘iyong pana,’ na maaaring kolektibong pagtawag sa bayan.
