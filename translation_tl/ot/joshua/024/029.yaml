  source_fidelity: Tumpak na naipapahayag ng salin ang pagkakasunod sa salaysay, ang pagkamatay ni Josue, ang pagkakakilanlan niyang anak ni Nun at lingkod ni Yahweh, at ang edad na 110. Ang “mga pangyayaring ito” ay angkop sa kontekstuwal na gamit ng Hebreong parirala, bagaman mas literal ang “mga bagay na ito.” Ang hindi hiwalay na pagsasalin sa panimulang וַיְהִי ay katanggap-tanggap sa natural na modernong Tagalog at hindi nag-aalis ng mahalagang kahulugan.
