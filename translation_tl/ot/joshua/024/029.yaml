  text: וַ/יְהִ֗י אַֽחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, namatay si Josue na anak ni Nun, ang lingkod ni Yahweh, sa edad na isandaan at sampung taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Ang וַיְהִי ay bahagi ng salaysay at hindi kailangang isalin nang hiwalay bilang “at nangyari” sa natural na modernong Tagalog. Sa kontekstong temporal, ang דְּבָרִים ay likas na tumutukoy sa mga pangyayari.
- source_word: וַיָּמָת
  choice: namatay
  rationale: Tuwirang kahulugan ng pandiwang מות; hindi ito pinalambot bilang “pumanaw.”
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: si Josue na anak ni Nun
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Joshua at ang natural na Tagalog na pagpapahayag ng ugnayang ama-anak.
- source_word: עֶבֶד יְהוָה
  choice: ang lingkod ni Yahweh
  rationale: Bagaman maaaring mangahulugan ang עֶבֶד na alipin, dito ay marangal na titulo ito ng paglilingkod kay Yahweh; pinananatili rin ang personal na banal na pangalan.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: sa edad na isandaan at sampung taon
  rationale: Natural na Tagalog para sa Hebreong idyoma ng edad, habang pinananatili ang buong bilang.
theological_decisions:
- issue: Paglalarawan sa עֶבֶד bilang titulo ni Josue
  choice: lingkod
  alternative: alipin
  rationale: Parehong saklaw ng salita ang mga ito, ngunit sa konteksto ang diin ay marangal at tapat na paglilingkod kay Yahweh, hindi katayuang pagkaalipin.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Iniwasan ang makalumang “at nangyari” sapagkat sapat na ipinahihiwatig ng ayos ng salaysay ang pagkakasunod ng pangyayari.
