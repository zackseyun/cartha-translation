  terminology: Ang “Josue,” “Nun,” at “Yahweh” ay pare-pareho at angkop. Ang “lingkod” ay wastong render ng עֶבֶד bilang marangal na titulo sa talatang ito; hindi nito ipinipilit ang mas makitid na pakahulugang “alipin.”
