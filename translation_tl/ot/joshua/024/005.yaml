base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/005.yaml
  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: tl
  text: Pagkatapos, isinugo ko sina Moises at Aaron, at hinampas[a] ko ang Ehipto ayon sa ginawa ko sa gitna nito.[b] Pagkatapos niyon, inilabas ko kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinalot.” Ang pandiwang Hebreo ay maaaring mangahulugang “hinampas” o “pinasakitan”; dito, tumutukoy ito sa mga dagok ng PANGINOON laban sa Ehipto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa ginawa ko sa gitna nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: isinugo ko
  rationale: Ang Qal ng שׁלח ay karaniwang nangangahulugang ‘magpadala’ o ‘magsugo.’ Ang ‘isinugo ko’ ay likas sa konteksto ng pagbibigay ng Diyos ng atas kina Moises at Aaron.
- source_word: מֹשֶׁה וְאֶת־אַהֲרֹן
  choice: sina Moises at Aaron
  rationale: Ginamit ang karaniwang anyo ng mga pangalan sa Filipino at ang pantukoy na ‘sina’ para sa dalawang tao.
- source_word: וָאֶגֹּף
  choice: hinampas ko
  rationale: Ang נגף ay maaaring tumukoy sa paghampas o pagpasapit ng salot. Pinananatili ng ‘hinampas’ ang tuwiran at malawak na diwa ng Hebreo nang hindi agad nililimitahan sa salitang ‘sinalot.’
- source_word: מִצְרַיִם
  choice: ang Ehipto
  rationale: Karaniwang pangalang Filipino para sa Egypt; maaari nitong tukuyin dito ang bansa bilang isang kabuuan.
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: ayon sa ginawa ko sa gitna nito
  rationale: Pinananatili nito ang siksik at bahagyang di-tiyak na pagkakaugnay ng sugnay sa Hebreo. Ang panghalip na isahan ay tumutukoy sa Ehipto bilang isang kabuuan.
- source_word: וְאַחַר
  choice: Pagkatapos niyon
  rationale: Malinaw at natural na pagpapahayag ng kasunod na pangyayari.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: inilabas ko kayo
  rationale: Tuwirang ipinapahayag ng Hiphil ng יצא ang pagpapalabas. Pinananatili ang ikalawang panauhang maramihan ng Hebreo.
theological_decisions:
- issue: Tinutukoy ng ikalawang panauhang maramihan na אֶתְכֶם
  choice: Pinanatili bilang ‘kayo,’ na kolektibong kinakausap ang Israel.
  alternative: Ipaliwanag bilang ‘ang inyong mga ninuno.’
  rationale: Tuwirang sinasabi ng Hebreo na ‘inilabas ko kayo.’ Pinananatili nito ang retorika ng pakikipagtipan at ang pagkakaisa ng kasalukuyang Israel sa salinlahing inilabas mula sa Ehipto, nang hindi ito nilulutas sa isang paliwanag na paraprasis.
- issue: Kahulugan ng paghampas sa Ehipto
  choice: ‘hinampas’ na may talababa tungkol sa posibleng ‘sinalot.’
  alternative: Isalin sa pangunahing teksto bilang ‘sinalot.’
  rationale: Saklaw ng pandiwang Hebreo ang parehong paghampas at pagpapahirap o pagpasapit ng salot. Hindi ikinukubli ng salin ang lawak ng salita, bagaman malinaw sa konteksto na tumutukoy ito sa mga dagok ng PANGINOON laban sa Ehipto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘isinugo’ at ‘inilabas’ bilang pamilyar ngunit dignified na mga salita. Pinanatili ang bahagyang siksik na estruktura ng sugnay tungkol sa ginawa ng Diyos sa gitna ng Ehipto, at nilinaw sa talababa ang literal na anyo.
