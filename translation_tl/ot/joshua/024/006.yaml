  source_fidelity: 'Tumpak na naihahatid ng salin ang sunod-sunod na pagkilos sa Hebreo: inilabas ng Diyos ang mga ninuno mula sa Ehipto, dumating ang kausap na Israel sa dagat sa kinatawang pananalita, at hinabol sila ng mga Ehipsiyo na may mga karwahe at mangangabayo hanggang sa Dagat na Pula. Ang plural na “mga Ehipsiyo” ay angkop para sa maramihang pandiwang Hebreo at malinaw na tumutukoy sa mga puwersa ng Ehipto.'
