  terminology: Ang “mga ninuno” ay natural na Tagalog para sa kinatawang pagtukoy sa mga naunang salinlahi, nang hindi binabago ang saklaw ng talata. Ang “karwahe,” “mga mangangabayo,” at “Dagat na Pula” ay angkop. Wasto at kapaki-pakinabang ang talababa na nagbibigay ng mas literal na “Dagat ng mga Tambo.”
