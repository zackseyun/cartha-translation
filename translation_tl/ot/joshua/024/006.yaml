  text: וָֽ/אוֹצִ֤יא אֶת אֲבֽוֹתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/תָּבֹ֖אוּ הַ/יָּ֑מָּ/ה וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵ֧י אֲבוֹתֵי/כֶ֛ם בְּ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: tl
  text: Pagkatapos, inilabas ko mula sa Ehipto ang inyong mga ninuno, at nakarating kayo sa dagat. Hinabol ng mga Ehipsiyo ang inyong mga ninuno sa pamamagitan ng mga karwahe at mga mangangabayo hanggang sa Dagat na Pula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal, “Dagat ng mga Tambo.” Sa Hebreo: yam suf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: Pagkatapos, inilabas ko
  rationale: Ang Hiphil ng יצא ay nangangahulugang “ilabas” o “pangunahing palabas.” Ipinahahayag ng “Pagkatapos” ang pagsulong ng salaysay na dala ng waw.
- source_word: אֲבוֹתֵיכֶם
  choice: inyong mga ninuno
  rationale: Literal itong “inyong mga ama,” ngunit sa konteksto ay tumutukoy sa naunang mga salinlahi ng Israel. Ang “mga ninuno” ay natural at malinaw sa modernong Tagalog nang hindi nililimitahan ang diwa sa agarang mga ama.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Tuwirang ipinapahayag ang pinagmulan; kasama ng “inilabas,” malinaw ang pag-alis mula sa Ehipto.
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: at nakarating kayo sa dagat
  rationale: Ang בוא at hulaping patungo ay nagsasaad ng pagdating sa dagat. Pinananatili ang ikalawang panauhan upang maipakita ang pagkakaugnay ng kasalukuyang kausap sa salinlahi ng Exodo.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: Hinabol ng mga Ehipsiyo
  rationale: Bagaman literal na “Ehipto” ang kolektibong paksa, maramihan ang pandiwa at ang tinutukoy ay mga puwersang Ehipsiyo. Ito ang pinakanatural at tumpak na Tagalog.
- source_word: בְּרֶכֶב וּבְפָרָשִׁים
  choice: sa pamamagitan ng mga karwahe at mga mangangabayo
  rationale: Ang רכב ay tumutukoy sa mga karwaheng pandigma o puwersang gumagamit nito, at ang פָּרָשִׁים ay mga mangangabayo. Malinaw na ipinakikita ng parirala ang ginamit na puwersang militar.
- source_word: יַם סוּף
  choice: Dagat na Pula
  rationale: Ang tradisyonal at madaling makilalang tawag sa pangyayaring ito ay “Dagat na Pula.” Inilalagay sa talababa ang mas literal na “Dagat ng mga Tambo” upang maging lantad ang leksikal na usapin.
theological_decisions:
- issue: Kinatawang pakikipag-usap sa sumunod na salinlahi ng Israel
  choice: 'Panatilihin ang ikalawang panauhan: “nakarating kayo sa dagat”'
  alternative: 'Gawing ikatlong panauhan: “nakarating sila sa dagat”'
  rationale: Sinasadya ng pananalita ni Josue na ituring ang kasalukuyang Israel bilang kaugnay at kaisa ng kanilang mga ninuno sa kasaysayan ng tipan. Pinananatili nito ang retorikal na lakas ng Hebreo.
- issue: Pagbibigay-kahulugan sa יַם סוּף
  choice: “Dagat na Pula” sa pangunahing teksto
  alternative: “Dagat ng mga Tambo”
  rationale: Pinananatili ng “Dagat na Pula” ang malawak na pagkakakilanlan sa pangyayari, samantalang itinatala sa talababa ang mas literal na kahulugan ng Hebreo nang hindi nagpapasya sa heograpikal na usapin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga ninuno” bilang natural na katawagan sa mga naunang salinlahi, “karwahe” para sa sasakyang pandigma, at pinanatili ang tuwirang “kayo” ng Hebreo.
