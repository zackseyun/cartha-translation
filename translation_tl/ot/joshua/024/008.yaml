  to: Pagkatapos, dinala ko kayo sa lupain ng mga Amoreo na naninirahan sa ibayo ng Jordan. Nakipaglaban sila sa inyo.[a] Ibinigay ko sila sa inyong kamay. Inangkin ninyo ang kanilang lupain, at pinuksa ko sila mula sa inyong harapan.
  rationale: Inalis ang di-sinusuportahang “ngunit” upang mapanatili ang payak na pagkakasunod-sunod ng salaysay sa Hebreo. Inayos ang talababa upang tumpak nitong tukuyin ang ikalawang panauhang panghalip at maitala ang literal na alternatibo nang hindi ipinahihiwatig na magkaalyado ang mga Amoreo at Israel.
