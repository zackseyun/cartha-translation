base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: tl
  text: Pagkatapos, dinala ko kayo sa lupain ng mga Amoreo na naninirahan sa ibayo ng Jordan. Nakipaglaban sila sa inyo.[a] Ibinigay ko sila sa inyong kamay. Inangkin ninyo ang kanilang lupain, at pinuksa ko sila mula sa inyong harapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nakipaglaban sila kasama ninyo.” Literal na “nakipaglaban sila kasama ninyo,” ngunit malinaw sa konteksto na magkalaban sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: dinala ko kayo
  rationale: Ang Hiphil ng בוא ay causative, kaya nangangahulugang “dinala,” hindi lamang “pumunta.”
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: sa lupain ng mga Amoreo
  rationale: Ang אֶל ay tumutukoy sa pagpasok o pagdating sa lupain; likas sa Tagalog ang “sa lupain.” Ang anyong isahan sa Hebreo ay kolektibong tumutukoy sa bayang Amoreo.
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: na naninirahan sa ibayo ng Jordan
  rationale: Ang participle na יֹשֵׁב ay naglalarawan sa mga Amoreo bilang mga naninirahan doon. Pinananatili ng “sa ibayo ng Jordan” ang relatibong pananaw ng pariralang Hebreo nang hindi tahasang dinaragdagan ng “silangan” o “kanluran.”
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: Nakipaglaban sila sa inyo
  rationale: Ang לחם kasama ng אֵת/עִם ay nagsasaad ng pakikipaglaban o pakikidigma; ipinakikita ng konteksto na magkalaban ang dalawang panig.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: ibinigay ko sila sa inyong kamay
  rationale: Pinananatili ang karaniwang idyomang Hebreo na נתן ביד, na nangangahulugang ibinigay ang kaaway sa kapangyarihan ng iba, at malinaw pa rin ito sa Tagalog.
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: Inangkin ninyo ang kanilang lupain
  rationale: Sa konteksto, ang ירש ay tumutukoy sa pagkuha at pag-aari sa lupain matapos ang tagumpay. Ang “inangkin” ay natural at hindi ipinipilit ang kahulugang “minana.”
- source_word: וָאַשְׁמִידֵם מִפְּנֵיכֶם
  choice: pinuksa ko sila mula sa inyong harapan
  rationale: Ang שׁמד ay matinding pandiwa ng pagpuksa o pagwasak. Pinananatili ng “mula sa inyong harapan” ang diwa ng מִפְּנֵיכֶם bilang pag-aalis sa harapan o presensiya nila.
theological_decisions:
- issue: Tuwirang paglalarawan sa pagkilos ng Diyos sa pananakop
  choice: Pinanatili ang mga pahayag na “ibinigay ko sila sa inyong kamay” at “pinuksa ko sila.”
  alternative: Palambutin bilang “tinalo ko sila” o “inalis ko sila.”
  rationale: Tuwiran at mariin ang wikang pandigmaan at pagpuksa sa tekstong Hebreo. Hindi ito dapat pahinain, palawakin, o bigyan ng paliwanag na doktrinal sa mismong salin.
translation_notes:
  register: Makabago at marangal na Filipino; malinaw sa karaniwang mambabasa habang pinananatili ang idyomang “sa inyong kamay” at ang relatibong heograpikong pariralang “sa ibayo ng Jordan.”
