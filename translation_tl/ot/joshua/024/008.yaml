  verdict: revise
  source_fidelity: Ang dagdag na “ngunit” bago ang “ibinigay ko sila” ay walang katumbas sa Hebreo, na sunod-sunod na nagsasalaysay ng mga pangyayari gamit ang pangatnig na “at.” Dapat itong alisin. Ang iba pang pangunahing pandiwa—dinala, nakipaglaban, ibinigay, inangkin, at pinuksa—ay tapat sa diwa at tindi ng Hebreo.
  naturalness: Malinaw at marangal ang salin sa modernong Filipino. Ang “Nakipaglaban sila sa inyo” ang likas at hindi-malinaw-sa-mali na Tagalog na paglalarawan ng pag-atake; ang literal na alternatibo ay mas angkop ilagay sa talababa.
  terminology: Ang “mga Amoreo,” “Jordan,” “sa inyong kamay,” at “pinuksa” ay angkop at magkakatugma sa rehistro ng salin. Pinananatili ng “pinuksa” ang matinding wikang שׁמד nang hindi ito pinapalambot.
