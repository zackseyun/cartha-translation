  terminology: 'Ang "lupain," "lungsod," at "ubasan" ay angkop. Mas karaniwan sa modernong Filipino ang "mga puno ng olibo" kaysa "mga punong olibo." Walang kailangang talababa: pinananatili ng "mga puno ng olibo" ang tuwirang larawan ng Hebreong זֵיתִים, na maaaring tumukoy sa mga olibo o punong olibo.'
