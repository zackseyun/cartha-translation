  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Hebreo: ang Diyos ang nagbibigay, ang Israel ay hindi nagpagal sa lupain o nagtayo ng mga lungsod, naninirahan sila roon, at nakikinabang sila sa mga tanim na hindi nila itinanim. Ang maramihang "ninyo/kayo" ay wastong paglilinaw sa kolektibong Israel nang hindi sapilitang ginagaya ang salit-salit na anyong isahan at maramihan sa Hebreo.'
