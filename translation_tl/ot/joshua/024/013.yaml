base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: tl
  text: At ibinigay ko sa inyo ang isang lupain na hindi ninyo pinaghirapan, at mga lungsod na hindi ninyo itinayo; naninirahan kayo sa mga iyon. Kumakain kayo ng bunga ng mga ubasan at mga puno ng olibo na hindi ninyo itinanim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: At ibinigay ko
  rationale: Ang Qal wayyiqtol na unang panauhang isahan ng נתן ay nagsasalaysay ng nakaraang pagkilos ng Diyos; natural dito ang payak na naganap na aspekto.
- source_word: אֶרֶץ אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: isang lupain na hindi ninyo pinaghirapan
  rationale: Ang יגע ay tumutukoy sa pagpapagal o mabigat na paggawa. Likas sa Filipino ang “pinaghirapan” para sa lupaing hindi nila pinagpaguran upang mapasakanila o mapakinabangan.
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: at mga lungsod na hindi ninyo itinayo
  rationale: Ang עִיר ay karaniwang “lungsod,” at ang בנה ay tuwirang “magtayo” o “bumuo.”
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: naninirahan kayo sa mga iyon
  rationale: Maaaring mangahulugan ang ישב ng maupo, manirahan, o tumahan. Ipinahahayag dito ang kasalukuyang bunga ng ibinigay na mga lungsod, kaya natural ang “naninirahan kayo.”
- source_word: כְּרָמִים
  choice: mga ubasan
  rationale: Ito ang karaniwan at tuwirang katumbas ng כרמים.
- source_word: וְזֵיתִים
  choice: mga punong olibo
  rationale: Ang זיתים ay literal na mga olibo o mga punong olibo. Pinili ang “mga punong olibo” upang panatilihin ang tuwirang leksikal na larawan at ang bagay na itinatanim.
- source_word: אַתֶּם אֹכְלִים
  choice: Kumakain kayo mula sa
  rationale: Ang tahasang panghalip na אַתֶּם kasama ng participle ay may mariin at nagpapatuloy na kasalukuyang diwa. Ang “mula sa” ay nilinaw dahil ang ubasan at mga puno ang pinagmumulan ng kinakain.
theological_decisions:
- issue: Pangkalahatang pagtukoy sa Israel sa kabila ng pagpapalit ng isahan at maramihang ikalawang panauhan
  choice: Gamitin ang maramihang “ninyo/kayo” sa buong talata bilang pakikipag-usap sa Israel bilang isang bayan
  alternative: Markahan ang unang anyo bilang isahan, gaya ng “hindi mo pinaghirapan,” saka lumipat sa maramihan
  rationale: Ang Hebreo ay may 2ms sa יָגַעְתָּ ngunit maramihan sa iba pang anyo. Ang tinutukoy ay ang Israel bilang kolektibong bayan; ang literal na pagpapalit sa Filipino ay magiging nakalilito at maaaring magmukhang nagbago ang kausap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang unang panauhan ng Diyos at ang kasalukuyang bunga ng kaloob sa mga pandiwang “naninirahan” at “kumakain.”
