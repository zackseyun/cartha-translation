  to: At ibinigay ko sa inyo ang isang lupain na hindi ninyo pinaghirapan, at mga lungsod na hindi ninyo itinayo; naninirahan kayo sa mga iyon. Kumakain kayo ng bunga ng mga ubasan at mga puno ng olibo na hindi ninyo itinanim.
