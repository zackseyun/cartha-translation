  text: וַ/יֹּאמְר֥וּ הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ אֶת יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ נַעֲבֹ֔ד וּ/בְ/קוֹל֖/וֹ נִשְׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: tl
  text: Sinabi ng bayan kay Josue, “Maglilingkod kami[a] kay Yahweh na aming Diyos, at susundin namin ang kanyang tinig[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sasambahin namin.” Ang pandiwang Hebreo ay maaaring tumukoy sa paglilingkod sa Diyos bilang pagsamba, ngunit mas malawak ang kahulugang pangtipan ng “maglilingkod” dito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “makikinig kami sa kanyang tinig,” isang idyomang nangangahulugang susunod sila sa sinasabi niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Sinabi
  rationale: Karaniwang salaysay na nagpapakilala sa tuwirang sinabi; hindi kailangan ang “sumagot” dahil hindi iyon tahasang nakasaad sa pandiwa.
- source_word: הָעָם
  choice: ang bayan
  rationale: Tumutukoy sa nagkakatipong sambayanan ng tipan; natural at marangal sa modernong Filipino ang “bayan.”
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang natatanging pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: אֱלֹהֵינוּ
  choice: aming Diyos
  rationale: Pinananatili ang unang panauhang maramihan at ang ugnayang ipinahahayag ng hulaping Hebreo.
- source_word: נַעֲבֹד
  choice: Maglilingkod kami
  rationale: Saklaw ng עבד ang tapat na paglilingkod at pagsambang nauukol sa Diyos; hindi ito nililimitahan sa gawaing panliturhiya lamang.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: at susundin namin ang kanyang tinig
  rationale: Ipinahahayag ng נִשְׁמָע ang masunuring pakikinig, habang pinananatili ng “kanyang tinig” ang larawan at diwang pangtipan ng idyomang Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Nasa talata mismo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at pangtipang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Relihiyosong kahulugan ng עבד sa konteksto ng tipan
  choice: maglilingkod
  alternative: sasamba
  rationale: Ang pangako ay tumutukoy sa malawak na katapatan at pagkilos sa ilalim ng tipan. Maaaring kasama rito ang pagsamba, ngunit mas makitid ang “sasamba.”
- issue: Kahulugan ng pakikinig sa tinig ng Diyos
  choice: susundin namin ang kanyang tinig
  alternative: makikinig kami sa kanyang tinig / susundin namin siya
  rationale: Ipinakikita ng konteksto na masunuring pagtugon ang diwa, ngunit pinananatili ang literal na “tinig” upang hindi mawala ang Hebreong idyoma.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “bayan” para sa sambayanang pangtipan, at pinanatili ang “tinig” kahit bahagyang di-karaniwan sa Filipino upang maingatan ang Hebreong larawan; nilinaw sa talababa ang idyomatikong kahulugan.
