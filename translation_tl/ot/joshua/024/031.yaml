  source_fidelity: 'Tumpak ang pangunahing diwa: ang Israel ay naglingkod kay Yahweh sa panahon ni Josue at ng mga nakatatandang nagpatuloy mabuhay pagkatapos niya. Gayunman, ang “nabuhay nang mas matagal kaysa kay Josue” ay maaaring mangahulugang mas mahaba ang kabuuang buhay nila kaysa sa kanya, hindi lamang na nalampasan nila siya sa buhay. Dapat itong gawing maliwanag na nabuhay sila pagkatapos mamatay si Josue.'
