source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: tl
  text: Naglingkod ang Israel kay Yahweh sa buong panahon ni Josue at sa buong panahon ng mga nakatatandang nabuhay pa pagkamatay ni Josue at nakaaalam ng lahat ng ginawa[a] ni Yahweh para sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: Naglingkod
  rationale: Ang עבד na may Yahweh bilang layon ay tumutukoy sa paglilingkod na nagpapahayag ng katapatan sa tipan; kasama rito ang pagsamba ngunit mas malawak ang diwa kaysa ritwal na pagsamba lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כֹּל יְמֵי
  choice: sa buong panahon
  rationale: Natural itong temporal na pahayag sa modernong Tagalog at malinaw na sumasaklaw sa buong panahong tinutukoy ng Hebreo.
- source_word: הַזְּקֵנִים
  choice: mga nakatatanda
  rationale: Ipinahahayag nito ang kinikilalang matatandang kasapi ng pamayanan nang hindi labis na nililimitahan ang salita sa edad lamang o sa isang tiyak na opisyal na katungkulan.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: nabuhay nang mas matagal kaysa kay Josue
  rationale: Natural na inilalahad ang idyomang Hebreo na nangangahulugang nanatili silang buhay lampas sa panahon ng buhay ni Josue.
- source_word: יָדְעוּ
  choice: nakaalam
  rationale: Pinananatili ang malawak na diwa ng ידע bilang personal na pagkakilala o kaalaman sa mga ginawa ni Yahweh, nang hindi tahasang nililimitahan ito sa pagkakita lamang.
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: lahat ng ginawa ni Yahweh
  rationale: Natural sa Tagalog ang nominalized na 'ginawa' para sa kolektibong מַעֲשֶׂה; ang mas pormal na 'lahat ng gawa' ay inilagay bilang leksikal na alternatibo sa talababa.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: ginawa ... para sa Israel
  rationale: Ang לְ ay nauunawaan dito bilang pagkilos alang-alang sa Israel; malinaw at natural itong naihahayag ng 'para sa Israel.'
theological_decisions:
- issue: Paglalarawan sa paglilingkod ng Israel kay Yahweh
  choice: Naglingkod
  alternative: Sumamba
  rationale: Hindi nililimitahan ng 'naglingkod' ang עבד sa gawaing panrelihiyon lamang; pinananatili nito ang mas malawak na diwa ng katapatan at pagsunod sa tipan.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang pinananatili ang personal na pangalan sa anyong Yahweh, sa halip na gumamit ng pamalit na titulo o ng alternatibong tradisyonal na transliterasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'Josue' bilang nakaugaliang anyong Filipino ng pangalan. Pinanatili ang kolektibong 'Israel' at ang bahagyang lawak ng 'nakaalam' upang hindi gawing mas tiyak kaysa sa Hebreong ידע ang paraan ng kanilang pagkakilala sa mga gawa ni Yahweh.
