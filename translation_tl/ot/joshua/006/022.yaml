  terminology: Pinanatili ang Josue. Ang “prostituta” ay tapat sa זוֹנָה nang hindi gumagamit ng arkaiko o eupemistikong termino. Ang “lahat ng sa kaniya” ay pinananatiling malawak gaya ng כָּל אֲשֶׁר לָהּ.
