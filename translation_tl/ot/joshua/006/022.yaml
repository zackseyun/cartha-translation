base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: tl
  text: At sa dalawang lalaking nagmanman sa lupain ay sinabi ni Josue, “Pumasok kayo sa bahay ng prostituta at ilabas ninyo mula roon ang babae at ang lahat ng sa kaniya, gaya ng ipinangako ninyo sa kaniya nang nanumpa kayo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: At ... sa dalawang lalaki
  rationale: Pinananatili ng “At” ang ugnayang pasalaysay ng waw, samantalang ang “sa dalawang lalaki” ang likas na katumbas ng pariralang tumutukoy sa mga kinausap ni Josue.
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: nagmanman sa lupain
  rationale: Sa kontekstong militar, ang רגל ay tumutukoy sa lihim na pagmamasid o reconnaissance. Ang “nagmanman” ay malinaw at likas sa modernong Filipino.
- source_word: בֹּאוּ בֵּית
  choice: Pumasok kayo sa bahay
  rationale: Bagaman maaaring literal na “pumarito” ang בוא, ang utos na pumunta at pumasok sa bahay ay likas na ipinapahayag sa Filipino bilang “Pumasok kayo sa bahay.”
- source_word: הָאִשָּׁה הַזּוֹנָה
  choice: babaeng bayaran
  rationale: Tuwirang tumutukoy ang זוֹנָה sa isang babaeng nakikipagtalik kapalit ng bayad. Ang “babaeng bayaran” ay kasalukuyan, madaling maunawaan, at hindi arkaiko.
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: at ilabas ninyo mula roon
  rationale: Ang Hiphil ng יצא ay nangangahulugang “ilabas,” at tahasang pinananatili ng “mula roon” ang מִשָּׁם.
- source_word: אֶת הָאִשָּׁה
  choice: ang babae
  rationale: Inuulit ng Hebreo ang “ang babae” sa halip na gumamit ng panghalip; pinanatili ito upang masalamin ang diin at kayarian ng teksto.
- source_word: וְאֶת כָּל אֲשֶׁר לָהּ
  choice: at ang lahat ng nauukol sa kaniya
  rationale: Malawak ang Hebreong parirala at maaaring sumaklaw hindi lamang sa mga ari-arian kundi sa lahat ng nasa ilalim ng kaniyang sambahayan o pangangalaga. Iniiwasan ng “nauukol sa kaniya” ang di-makatwirang pagpapakitid sa mga bagay lamang.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: gaya ng ipinangako ninyo sa kaniya nang may panunumpa
  rationale: Ipinahahayag nito ang pangakong pinagtibay ng panunumpa. Iniiwasan ang “isinumpa ninyo sa kaniya,” na sa Filipino ay maaaring mapagkamalang pagsumpa o pagkondena sa babae.
theological_decisions:
- issue: Paglalarawan kay Rahab sa salitang זוֹנָה
  choice: babaeng bayaran
  alternative: prostituta; patutot
  rationale: Hindi pinapalambot ng salin ang malinaw na kahulugan ng Hebreo. Pinili ang kasalukuyan at nauunawaang katawagan nang hindi gumagamit ng arkaiko o labis na mapanlait na salita.
- issue: Saklaw ng כָּל אֲשֶׁר לָהּ
  choice: lahat ng nauukol sa kaniya
  alternative: lahat ng pag-aari niya
  rationale: Pinananatili ang lawak ng parirala upang hindi ipasiya na materyal na ari-arian lamang ang tinutukoy; ayon sa konteksto, kabilang din ang mga taong kasama ng babae.
translation_notes:
  register: Modernong Filipino na likas ngunit marangal ang himig. Ginamit ang pangalang “Josue,” ang nakaugaliang anyong Filipino. Iniwasan ang sobrang literal na mga pariralang maaaring maging malabo o magbago ng kahulugan sa kasalukuyang Tagalog.
