  verdict: revise
  source_fidelity: Ang pangunahing diwa ng חֵרֶם ay naipapahayag nang wasto bilang pagtatalaga sa pagkapuksa, at napananatili ang babala na ang kampo ng Israel ay madadamay. Gayunman, ang “dahil kumuha kayo” ay nakaraang-panahon at ginagawang isang hayag na paliwanag ng sanhi ang magkakaugnay na pandiwang Hebreo sa loob ng babala. Ang “sa gayon ay mapasailalim” ay nagpapalabo rin sa tuwirang causative na “gawin ninyong ... ang kampo.”
  naturalness: Marangal at karaniwang nauunawaan ang rehistro, ngunit hindi likas sa isang babalang nakatuon sa hinaharap ang “Baka ... dahil kumuha kayo.” Mas malinaw at mas natural ang pagbuo sa pagkuha bilang kilos na nagdudulot ng kinatatakutang bunga.
  terminology: Ang “itinalaga sa pagkapuksa” ay angkop at pare-pareho para sa חֵרֶם sa kontekstong ito. Ang “mapasailalim sa pagkapuksa” ay isang katanggap-tanggap na pagpapahayag ng resultang kahulugan ng תַּחֲרִימוּ. Pinanatili ang alternatibong tala tungkol sa “ilagay ninyo ang inyong sarili sa ilalim ng pagbabawal.”
  issues:
