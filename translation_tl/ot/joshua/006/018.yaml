  to: Ngunit kayo, mag-ingat kayo sa anumang itinalaga sa pagkapuksa[a], baka kayo mismo ay mapasailalim sa pagkapuksa sa pagkuha ninyo mula sa anumang itinalaga sa pagkapuksa, at gawin ninyong nakatalaga sa pagkapuksa ang kampo ng Israel at magdulot dito ng kapahamakan[c][b].
