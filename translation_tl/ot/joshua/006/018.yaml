    issue: Hindi angkop ang nakaraang-panahong “dahil kumuha kayo” sa loob ng babalang “Baka ...”
    rationale: Ang mga pandiwang Hebreo ay bahagi ng inaasahang kahihinatnan/kilos sa babala, hindi pagsangguni sa pagkuha na naganap na. Ang “sa pagkuha ninyo” ay nagpapanatili ng ugnayan nang hindi inililipat sa nakaraan.
  - severity: medium
    issue: Nawawala ang malinaw na causative na puwersa sa “mapasailalim din sa pagkapuksa ang kampo ng Israel.”
    rationale: Ang וְשַׂמְתֶּם ay nagsasaad na sila ang maglalagay o gagawa sa kampo bilang חֵרֶם. Dapat itong ipahayag nang tuwiran sa Tagalog.
