reference: Joshua 6:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: tl
  text: Ngunit kayo, mag-ingat kayo sa anumang itinalaga sa pagkapuksa[a], baka kayo mismo ay mapasailalim sa pagkapuksa sa pagkuha ninyo mula sa anumang itinalaga sa pagkapuksa, at gawin ninyong nakatalaga sa pagkapuksa ang kampo ng Israel at magdulot dito ng kapahamakan[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay חֵרֶם (kherem), na tumutukoy rito sa anumang di-mababawing itinalaga sa Diyos upang lipulin; tradisyonal din itong isinasaling “nasa ilalim ng pagbabawal” o “bagay na isinumpa.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “baka ilagay ninyo ang inyong sarili sa ilalim ng pagbabawal.”'
    reason: alternative_reading
  - marker: c
    text: Ang “magdulot dito ng kapahamakan” ay umaalingawngaw sa salaysay tungkol sa kasalanan ni Acan at sa ibinunga nito sa Israel (Josue 7:1, 25).
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: Ngunit kayo
  rationale: Ipinahahayag nito ang matinding pagsalungat at diin ng רַק kasama ng tahasang panghalip, nang hindi nagiging mabigat sa makabagong Tagalog.
- source_word: שִׁמְרוּ מִן־הַחֵרֶם
  choice: mag-ingat kayo sa anumang itinalaga sa pagkapuksa
  rationale: Ang שמר מן ay babala na umiwas o magbantay laban sa isang bagay. Ang 'anumang itinalaga sa pagkapuksa' ay nagpapanatili sa kolektibo at hindi tiyak na saklaw ng חֵרֶם.
- source_word: תַּחֲרִימוּ
  choice: kayo mismo ay mapasailalim sa pagkapuksa
  rationale: Sa konteksto, inilalarawan nito ang kalagayang sasapitin nila kapag nilabag nila ang pagbabawal, hindi lamang ang isang kilos na gagawin nila.
- source_word: וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: dahil kumuha kayo mula sa anumang itinalaga sa pagkapuksa
  rationale: Ang koordinasyong Hebreo ay likas na nauunawaan bilang kilos na magbubunga ng babalang kahihinatnan; nililinaw ng 'dahil' ang ugnayan nang hindi dinaragdagan ang nilalaman.
- source_word: וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: at sa gayon ay mapasailalim din sa pagkapuksa ang kampo ng Israel
  rationale: Ipinahahayag ang causative na bunga ng שׂים at inuulit ang parehong diwa ng חֵרֶם sa natural na Tagalog.
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: at magdala kayo rito ng kapahamakan
  rationale: Ang עכר ay tumutukoy sa pagdadala ng matinding ligalig o kapahamakan; ang 'rito' ay malinaw na tumutukoy sa kampo ng Israel.
theological_decisions:
- issue: Kahulugan ng חֵרֶם sa konteksto ng banal na paghatol
  choice: itinalaga sa pagkapuksa / mapasailalim sa pagkapuksa
  alternative: isinumpa; nasa ilalim ng pagbabawal; itinalaga lamang
  rationale: 'Pinananatili nito ang dalawang sangkap ng salita: ang di-mababawing pagtatalaga sa Diyos at ang pagkapuksa bilang kahihinatnan sa kontekstong ito, nang hindi gumagamit ng malabo o denominasyonal na katawagan.'
- issue: Diwa ng תַּחֲרִימוּ
  choice: resultang mapasailalim sila sa pagkapuksa
  alternative: italaga nila ang kanilang sarili sa pagkapuksa
  rationale: Ang konteksto ay nagbababala na ang pagkuha sa ipinagbawal ay maglalagay sa kanila sa parehong hatol; iniiwasan ng salin ang pagpapahiwatig na kusa nilang isinasagawa ang isang ritwal ng pagtatalaga.
- issue: Saklaw ng pananagutan
  choice: ang paglabag ng ilan ay maaaring magdala ng hatol sa buong kampo
  alternative: ang lumabag lamang ang paparusahan
  rationale: Tahasang binabanggit ng Hebreo ang kampo ng Israel bilang tatamaan ng kalagayang חֵרֶם at ng kapahamakan, kaya pinananatili ang kolektibong tensiyon ng teksto.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'pagkapuksa' upang maipahayag ang bigat ng חֵרֶם, at iniwasan ang masyadong teknikal na 'ban' at ang posibleng nakalilitong 'sumpa.' Ang mga pang-ugnay na 'dahil' at 'sa gayon' ay nagpapalinaw sa lohika ng mahabang babalang pangungusap habang pinananatili ang pagkakasunod ng Hebreo.
