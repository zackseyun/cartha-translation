  - severity: low
    issue: Medyo pilit ang “pinahaba ang ihip sa sungay.”
    rationale: Mas likas ang “pinahaba ang pag-ihip sa sungay,” habang pinananatili ang imahen ng pagpapahaba ng tunog/ihip na nasa בִּמְשֹׁךְ.
