base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: tl
  text: At kapag pinahaba ang pag-ihip sa sungay ng lalaking tupa[a], pagkarinig ninyo sa tunog ng trumpeta, sisigaw nang napakalakas ang buong bayan. Guguho pababa ang pader ng lungsod[b], at aakyat ang buong bayan, bawat lalaki ay tutuloy nang tuwid sa kanyang harapan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kapag tumunog nang matagal ang sungay ng lalaking tupa” o “kapag pinahaba ang tunog nito.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “babagsak ang pader ng lungsod sa ilalim ng sarili nito,” na malamang ay nangangahulugang tuwid itong guguho pababa.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “bawat isa ay didiretso sa unahan” o “bawat lalaki ay tutuloy nang tuwid sa nasa harap niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ
  choice: pinahaba ang ihip
  rationale: Ang משׁך sa idyomang ito ay tumutukoy sa pagpapahaba ng tunog o ihip ng sungay. Likas sa modernong Tagalog ang parirala at napapanatili nito ang diwa ng pagpapahaba.
- source_word: קֶרֶן הַיּוֹבֵל
  choice: sungay ng lalaking tupa
  rationale: Sa kontekstong ito, ang יוֹבֵל ay tumutukoy sa lalaking tupa o sa sungay nito bilang instrumentong hinihipan, hindi sa teknikal na kahulugang 'jubileo.'
- source_word: ק֣וֹל הַשּׁוֹפָר
  choice: tunog ng trumpeta
  rationale: Ang שׁוֹפָר ay isang sungay na ginagamit bilang trumpeta. Isinasalin ang karaniwang pangngalan sa halip na tumbasan lamang ng transliterasyong 'shofar.'
- source_word: יָרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: sisigaw nang napakalakas
  rationale: Magkasamang ipinahahayag ng pandiwa at layon ang pagbugso ng isang malakas na sigaw. Ang saling ito ay natural sa Tagalog at hindi ipinapalagay na tiyak na sigaw-pandigma iyon.
- source_word: תַּחְתֶּיהָ
  choice: guguho pababa
  rationale: Literal na inilalarawan ng Hebreo ang pader na babagsak 'sa ilalim ng sarili nito.' Ipinahahayag ng pangunahing salin ang malamang na larawan ng tuwid na pagguho, habang inilalagay sa talababa ang di-pangkaraniwang literal na anyo.
- source_word: וְעָלוּ
  choice: aakyat
  rationale: Pinananatili ang pangunahing kahulugan ng עלה na 'umakyat' nang hindi tahasang dinaragdagan ng mas interpretibong 'lulusob.'
- source_word: אִישׁ נֶגְדּוֹ
  choice: bawat lalaki'y didiretso sa tapat niya
  rationale: May pamudmod na diwa ang panlalaking isahang אִישׁ, at ipinakikita ng נֶגְדּוֹ na bawat lalaki ay kikilos nang tuwid sa bahaging nasa harap niya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lalaking tupa” sa halip na teknikal na transliterasyon, at pinanatili ang “aakyat” upang hindi labis na bigyang-kahulugang militar ang pandiwa. Ang di-pangkaraniwang larawan ng pagbagsak ng pader ay nilinaw sa talababa nang hindi inaalis ang ambiguwidad ng Hebreo.
