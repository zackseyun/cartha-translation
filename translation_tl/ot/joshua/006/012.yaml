  text: Joshua rose early in the morning[a], and the priests carried the ark of Yahweh.
translation:
  language: tl
  text: Maagang bumangon si Josue nang umagang iyon, at binuhat ng mga pari ang kaban ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: Maagang bumangon
  rationale: Ang Hiphil ng שׁכם ay karaniwang nangangahulugang bumangon o magsimula nang maaga. Likas sa modernong Tagalog ang “maagang bumangon” at pinananatili nito ang diin sa pagiging maaga.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: בַּבֹּקֶר
  choice: nang umaga
  rationale: Tuwirang ipinahahayag ng parirala ang oras ng pangyayari. Bagaman may bahagyang pag-uulit kasunod ng “maagang bumangon,” taglay rin ito ng Hebreo at pinananatili rito ang diin nito.
- source_word: וַיִּשְׂאוּ
  choice: pinasan
  rationale: Maaaring mangahulugan ang נשׂא na buhatin, dalhin, o pasanin. Sa konteksto ng mga paring nagdadala ng kaban, malinaw at angkop ang “pinasan.”
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tuwirang salin ng tiyak na pangngalang maramihan.
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Natural na isinasalin sa Tagalog ang construct phrase bilang “ang kaban ni Yahweh,” na nagpapakitang ang kaban ay kaugnay kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulong “PANGINOON”; hindi rin pinipili ang tradisyonal ngunit hindi gaanong nakabatay sa malamang na sinaunang bigkas na “Jehova.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang bahagyang semitikong pag-uulit sa “Maagang bumangon … nang umaga” dahil kapuwa naroon sa pinagmulang Hebreo ang pandiwang may diing maaga at ang pariralang tumutukoy sa umaga. Walang footnote dahil walang alternatibong pagbasa na kailangang ilagay sa publikasyong teksto.
