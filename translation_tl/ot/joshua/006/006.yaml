revisions:
- from: Kaya tinawag ni Josue na anak ni Nun ang mga pari at sinabi sa kanila, “Buhatin ninyo ang kaban ng tipan, at pitong pari ang magdala ng pitong trumpeta na sungay ng lalaking tupa sa unahan ng kaban ni Yahweh.”
  to: Tinawag ni Josue, na anak ni Nun, ang mga pari at sinabi sa kanila, “Buhatin ninyo ang kaban ng tipan, at magdala ang pitong pari ng pitong trumpeta na yari sa sungay ng mga lalaking tupa sa unahan ng kaban ni Yahweh.”
  rationale: 'Inayos ang ayos ng appositive, inalis ang di-kailangang “Kaya,” at pinalitan ang hindi idiomatikong paglalarawan sa mga trumpeta. Walang footnote na kailangan sa Filipino text: ang kahulugang “yari sa sungay ng mga lalaking tupa” ay malinaw na nakasaad sa pangunahing teksto. Ang mga footnote anchor sa English audit trail ay hindi maaasahang huwaran dito, sapagkat hindi tugma ang pagkakalagay ng mga ito sa mga paliwanag na ibinigay.'
