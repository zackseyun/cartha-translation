  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: tl
  text: Tinawag ni Josue, na anak ni Nun, ang mga pari at sinabi sa kanila, “Buhatin ninyo ang kaban ng tipan, at magdala ang pitong pari ng pitong trumpeta na yari sa sungay ng mga lalaking tupa sa unahan ng kaban ni Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Ang Qal wayyiqtol ng קרא ay nagpapakilala rito sa pagtawag at pakikipag-usap ni Josue sa mga pari; natural at hindi labis ang lakas ng “tinawag.”
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josue na anak ni Nun
  rationale: Ginagamit ang nakaugaliang anyong Filipino na “Josue,” at tuwirang isinasalin ang ugnayang pampamilya.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwan at malinaw na salin ng כֹּהֵן sa kontekstong panrelihiyon.
- source_word: שְׂאוּ
  choice: Buhatin ninyo
  rationale: Ang pautos na anyo ng נשׂא ay maaaring mangahulugang buhatin o dalhin; ipinahihiwatig rito ang pag-angat at pagdadala sa kaban.
- source_word: אֲרוֹן הַבְּרִית
  choice: ang kaban ng tipan
  rationale: Nakaugaliang saling Filipino ng construct phrase at malinaw sa karaniwang mambabasa.
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: at pitong pari ang magdala
  rationale: Ang imperfect kasunod ng pautos ay may puwersang tagubilin; ang “ang magdala” ay natural na utos sa Filipino sa loob ng tuwirang pananalita.
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: pitong trumpeta na sungay ng lalaking tupa
  rationale: Ang שׁוֹפָר ay tambuli o trumpeta, at ang יוֹבְלִים dito ay tumutukoy sa sungay ng lalaking tupa, hindi sa teknikal na kahulugang jubileo.
- source_word: לִפְנֵי
  choice: sa unahan ng
  rationale: Malinaw nitong inilalarawan ang posisyon sa prusisyon.
- source_word: אֲרוֹן יְהוָה
  choice: kaban ni Yahweh
  rationale: Pinananatili ang tuwirang banal na pangalang יְהוָה at ang ugnayang ipinahahayag ng construct phrase.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “pari,” “kaban ng tipan,” at “trumpeta” bilang mga salitang madaling maunawaan, habang pinananatili ang anyong “Yahweh” para sa banal na pangalan.
