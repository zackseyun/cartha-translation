source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: tl
  text: Nang magsalita si Josue sa bayan, lumakad sa unahan ni Yahweh ang pitong paring may dalang pitong trumpeta na yari sa sungay ng lalaking tupa[a] at hinipan nila ang mga trumpeta. Ang kaban ng tipan ni Yahweh ay sumunod sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pitong shofar ng yobel.” Malamang na tumutukoy ito sa mga trumpeta na yari sa sungay ng lalaking tupa, bagaman posible rin ang saling “mga trumpeta ng Jubileo.”
    reason: lexical_alternative
  - marker: b
    text: O, “Ang kaban ng tipan ni Yahweh ay lumakad sa likuran nila.”
    reason: clarifies the spatial sense of the Hebrew expression “went behind them.”
lexical_decisions:
- source_word: וַיְהִי כֶּאֱמֹר
  choice: Nang makapagsalita na
  rationale: Ipinahihiwatig ng temporal na parirala ang paglipat sa sumunod na pangyayari matapos magsalita si Josue. Hindi na isinalin nang hiwalay ang pormulang וַיְהִי upang maging likas sa modernong Tagalog.
- source_word: הָעָם
  choice: bayan
  rationale: Tumutukoy ito sa sambayanang Israel na kinausap ni Josue, hindi lamang sa hukbo.
- source_word: נֹשְׂאִים
  choice: may dala
  rationale: Likas at malinaw na paglalarawan sa mga paring nagdadala ng mga trumpeta.
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: pitong trumpeta na yari sa sungay ng lalaking tupa
  rationale: Ipinapahayag nito kapwa ang gamit bilang instrumentong hinihipan at ang malamang na kahulugan ng יוֹבֵל sa konteksto, habang inilalagay sa talababa ang tunay na alternatibong pagbasa.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang pansarili at panlunan na diwa ng 'sa harap ng/in the presence of' nang hindi nilulutas kung ito ay tumutukoy sa ayos ng prusisyon o sa presensiya ni Yahweh.
- source_word: עָבְרוּ
  choice: nagpatuloy
  rationale: Sa konteksto ng prusisyon, ang pandiwa ay tumutukoy sa pagpapatuloy o pagdaan pasulong, hindi sa pagtawid sa isang hangganan.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: at hinipan ang mga trumpeta
  rationale: Karaniwan at malinaw na salin ng pagtunog sa shofar.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: kaban ng tipan ni Yahweh
  rationale: Tapat at likas na pagpapahayag ng construct chain, na pinananatili ang kahalagahan ng tipan.
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: Sumunod sa kanila
  rationale: Likas na Tagalog na naghahatid ng patuloy na pagkilos ng kaban sa likuran ng mga pari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginamit ang transliterasyong Yahweh upang mapanatili ang personal na pangalan sa tekstong Hebreo at hindi ito palitan ng isang titulo.
- issue: Kahulugan ng לִפְנֵי יְהוָה sa prusisyon
  choice: sa harap ni Yahweh
  alternative: sa presensiya ni Yahweh
  rationale: Pinananatili ng pangunahing salin ang konkretong larawang panlunan; kinikilala sa talababa ang posibleng diin sa banal na presensiya nang hindi pumipili ng isang teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bayan,” “mga pari,” at “kaban ng tipan” bilang mga pamilyar na terminong biblikal; iniwasan ang lipas na pormulang “at nangyari.”
