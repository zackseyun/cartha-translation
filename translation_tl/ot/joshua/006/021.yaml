  to: Itinalaga nila ang lahat ng nasa lungsod[a] sa ganap na pagkalipol—lalaki at babae, bata at matanda, pati baka, tupa, at asno—sa pamamagitan ng talim ng espada.
  rationale: Inayos lamang ang pagkakasunod ng mga salita para sa higit na likas na daloy sa Tagalog at pinalitan ang di-idiomatikong “hindi na mababaling” ng “di-mababawing.” Hindi binago ang saklaw, tindi, o teknikal na kahulugan ng ḥerem, ni ang paglalarawan ng marahas na kilos sa teksto.
