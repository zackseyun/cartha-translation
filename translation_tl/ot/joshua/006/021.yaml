base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: tl
  text: Itinalaga nila ang lahat ng nasa lungsod[a] sa ganap na pagkalipol—lalaki at babae, bata at matanda, pati baka, tupa, at asno—sa pamamagitan ng talim ng espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lubusang nilipol” o “isinailalim sa pagbabawal.” Ang pandiwang Hebreo ay tumutukoy sa di-mababawing pagtatalaga ng isang tao o bagay sa pagkalipol sa ilalim ng ḥerem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: itinalaga nila sa ganap na pagkalipol
  rationale: 'Pinananatili nito ang teknikal na diwa ng Hiphil ng חרם: ang hindi na mababawi na pagtatalaga ng mga tao o bagay sa pagkalipol, at hindi lamang pangkalahatang pagpatay.'
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: ang lahat ng nasa lungsod
  rationale: Likas sa modernong Tagalog at malinaw na saklaw ang lahat ng taong naninirahan at mga hayop na kasunod na binanggit.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: lalaki at babae
  rationale: Inihahatid ang merismong sumasaklaw sa dalawang kasarian nang natural sa Tagalog.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: bata at matanda
  rationale: Natural na katumbas ng karaniwang merismong Hebreo para sa buong saklaw ng edad.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: pati baka, tupa, at asno
  rationale: Ipinakikita ng “pati” na umaabot ang saklaw maging sa mga alagang hayop; pinananatili ang tatlong uring tahasang binanggit.
- source_word: לְפִי חָרֶב
  choice: sa pamamagitan ng talim ng espada
  rationale: Pinananatili ang larawang Hebreo ng “talim/bibig ng espada” habang malinaw na ipinahahayag ang paraan ng pagpatay.
theological_decisions:
- issue: Paglalarawan sa חרם sa konteksto ng hatol sa digmaan
  choice: itinalaga sa ganap na pagkalipol
  alternative: lubusang nilipol; isinailalim sa pagbabawal
  rationale: Pinananatili ng salin ang teknikal at hindi na mababaling pagtatalaga sa pagkalipol, nang hindi pinahihina ang tindi ng teksto o nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod,” “asno,” at “espada” bilang mga karaniwang salitang biblikal na nauunawaan pa rin ngayon; ang mga gitling na pahaba ay nagpapalinaw sa talaan ng kabuuang saklaw.
