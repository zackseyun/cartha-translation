  naturalness: Marangal at malinaw ang pangungusap, ngunit mas natural ang ayos na ilagay agad ang layon ng “itinalaga.” Sa talababa, mas likas sa makabagong Filipino ang “di-mababawing” kaysa “hindi na mababaling.”
