language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: tl
  text: Nang panahong iyon, pinasumpa ni Josue ang mga tao[a], na nagsasabi, “Sumpain sa harap ni Yahweh ang sinumang bumangon at muling magtayo ng lunsod na ito, ang Jerico. Sa halaga ng kanyang panganay ay ilalatag niya ang pundasyon nito, at sa halaga ng kanyang bunso ay itatayo niya ang mga pintuang-bayan nito.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “inilagay sila sa ilalim ng panunumpa.” Ang pandiwang Hebreo ay causative: pinasumpa ni Josue ang mga taong naroon.'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “Sa/kasama ng kanyang panganay ay ilalatag niya ang pundasyon nito, at sa/kasama ng kanyang bunso ay itatayo niya ang mga pintuan nito.” Malamang na ipinahihiwatig nito na mawawala sa kanya ang mga ito bilang kapalit, ngunit hindi tahasang sinasabi kung paano iyon mangyayari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: pinanumpa sila
  rationale: 'Ang Hiphil ng שׁבע ay causative: pinasumpa o inilagay ni Josue sa ilalim ng panunumpa ang mga taong naroon. Likas sa Filipino ang paglalagay ng ipinahihiwatig na layon na “sila.”'
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Karaniwan at marangal na panandang temporal sa makabagong Filipino.
- source_word: אָרוּר הָאִישׁ
  choice: Sumpain ... ang sinumang
  rationale: Pinananatili ang pormula ng sumpa, habang ang “sinumang” ay natural na naghahayag ng generic na gamit ng panlalaking singular na הָאִישׁ.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang inilalarawan ang pagharap o pagiging nasa presensiya ni Yahweh at pinananatili ang banal na pangalan ayon sa ibinigay na project rendering.
- source_word: יָקוּם וּבָנָה
  choice: magtatangkang muling itayo
  rationale: Ang magkapares na pandiwa ay nagpapahiwatig ng pagbangon o pagkilos upang itayong muli ang winasak na lunsod; natural itong naipapahayag sa Filipino nang hindi binabawasan ang sinasadyang pagkilos.
- source_word: הָעִיר הַזֹּאת אֶת יְרִיחוֹ
  choice: ang lunsod na ito, ang Jerico
  rationale: Pinananatili ang appositional na pagkakakilanlan ng lunsod bilang Jerico.
- source_word: בִּבְכֹרוֹ ... וּבִצְעִירוֹ
  choice: Sa halaga ng buhay ng kanyang panganay ... at sa halaga ng buhay ng kanyang bunso
  rationale: Ipinahahayag ang malamang na diwang kapalit o pagkalugi ng beth sa konteksto ng sumpa. Idinagdag ang “buhay” upang maging malinaw at natural sa Filipino ang pagkawala, ngunit hindi tinutukoy kung paano mamamatay ang mga anak.
- source_word: יְיַסְּדֶנָּה
  choice: ilalatag niya ang pundasyon nito
  rationale: Pinananatili ang kongkretong kahulugan ng יסד sa konteksto ng pagtatayo.
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: itatayo niya ang mga pintuang-bayan nito
  rationale: Sa konteksto ng napapaderang lunsod, ang דְּלָתֶיהָ ay tumutukoy sa mga pinto ng tarangkahan; “mga pintuang-bayan” ang malinaw at likas na katumbas.
theological_decisions:
- issue: Kalikasan ng pahayag ni Josue
  choice: Isang taimtim na sumpa sa harap ni Yahweh laban sa sinumang muling magtatayo ng Jerico
  alternative: Isang pansariling hangarin lamang ni Josue o isang pagbabawal na walang teolohikal na bigat
  rationale: Ang pariralang לִפְנֵי יְהוָה ay nagbibigay sa sumpa ng malinaw na banal at tipanang konteksto, nang hindi dinaragdagan ang teksto ng paliwanag tungkol sa eksaktong mekanismo nito.
- issue: Kahulugan ng kapalit na panganay at bunso
  choice: Mawawala ang buhay ng panganay at bunso kaugnay ng dalawang yugto ng muling pagtatayo
  alternative: Sadyang ihahandog sila bilang alay, o makararanas lamang sila ng di-tiyak na kasawian
  rationale: Ang konteksto ng sumpa at ang magkatulad na mga parirala ay nagpapahiwatig ng matinding pagkawala. Hindi sinasabi ng salin na paghahandog ng bata ang mekanismo, sapagkat hindi iyon tahasang tinutukoy ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue” at “Jerico,” na pamilyar na anyong Filipino ng mga pangalan. Pinanatili ang “Yahweh” ayon sa project-level lexical decision na ibinigay sa konsultasyong Ingles. Ang mga marker na [a] at [b] ay parehong nasa pangunahing teksto.
