  naturalness: Mas natural at malinaw sa modernong Filipino ang “pinasumpa ni Josue ang mga tao” at “na nagsasabi.” Ang pormulang “Sumpain sa harap ni Yahweh” ay marangal at idiomatiko para sa isang taimtim na sumpa.
  terminology: Pinanatili ang “Josue,” “Jerico,” at “Yahweh,” gayundin ang “lunsod,” “pundasyon,” at “mga pintuang-bayan.” Ang “sa halaga ng kanyang panganay/bunso” ay naglalahad ng diwang kapinsalaan nang hindi itinatakda ang mekanismo o tahasang sinasabing kamatayan.
