- from: Nang panahong iyon, pinanumpa sila ni Josue[a]. Sinabi niya, “Sumpain sa harap ni Yahweh ang sinumang magtatangkang muling itayo ang lunsod na ito, ang Jerico. Sa halaga ng buhay ng kanyang panganay ay ilalatag niya ang pundasyon nito, at sa halaga ng buhay ng kanyang bunso ay itatayo niya ang mga pintuang-bayan nito.”[b]
  to: Nang panahong iyon, pinasumpa ni Josue ang mga tao[a], na nagsasabi, “Sumpain sa harap ni Yahweh ang sinumang bumangon at muling magtayo ng lunsod na ito, ang Jerico. Sa halaga ng kanyang panganay ay ilalatag niya ang pundasyon nito, at sa halaga ng kanyang bunso ay itatayo niya ang mga pintuang-bayan nito.”[b]
  rationale: Nilinaw ang causative na pandiwa para sa panunumpa, inalis ang idinagdag na ideya ng pagtatangka, at inalis ang tahasang pagbanggit sa pagkawala ng buhay upang huwag lumampas sa ipinahihiwatig ng Hebreo. Pinanatili ang solemne at makabagong Filipino na rehistro at ang ambigwidad tungkol sa mekanismo ng sumpa.
