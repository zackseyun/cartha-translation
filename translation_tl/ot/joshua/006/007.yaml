base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: tl
  text: At sinabi nila sa bayan, “Magpatuloy kayo at libutin ang lungsod, at ang mga armadong lalaki[a] ay magpatuloy sa unahan ng Kaban ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pangunang pangkat,” samakatuwid, ang mga armadong lalaking nauuna sa Kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Pinananatili ang pangmaramihang pandiwa at ang sunod-sunod na daloy ng salaysay na ipinahihiwatig ng wayyiqtol.
- source_word: אֶל־הָעָם
  choice: sa bayan
  rationale: Ang עָם ay karaniwang tumutukoy sa bayan o mga tao. Hindi ito pinakitid sa ‘hukbo’ kahit militar ang konteksto.
- source_word: עִבְרוּ
  choice: Humayo kayo
  rationale: Sa kontekstong ito, utos itong sumulong sa prusisyon, hindi tumawid sa isang ilog o hangganan.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: at libutin ang lungsod
  rationale: Likas na ipinahahayag ng ‘libutin’ ang pag-ikot sa palibot ng lungsod nang hindi nagdaragdag ng di-tahasang kahulugang militar.
- source_word: וְהֶחָלוּץ
  choice: ang mga lalaking nasasandatahan
  rationale: Tumutukoy ang חָלוּץ sa mga nakahanda o nasasandatahan para sa labanan. Malinaw ang salin, habang inilalagay sa talababa ang posibleng diin sa kanilang tungkulin bilang pangunang pangkat.
- source_word: יַעֲבֹר
  choice: ay lumakad
  rationale: Isinasalin ang diwang pautos ng imperfect sa likas na Tagalog na kasunod ng ‘ay,’ habang ang lokasyong ‘sa unahan’ ang nagpapalinaw sa kilos.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: sa unahan ng Kaban ni Yahweh
  rationale: Tuwirang ipinahahayag ng לִפְנֵי ang posisyon sa harap o unahan; ang ‘Kaban’ ay dignified at nauunawaang katawagan sa banal na kaban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton sa Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya ‘Yahweh’ ang ginamit sa halip na palitan ito ng isang titulo.
- issue: Pagkakakilanlan ng הֶחָלוּץ
  choice: mga lalaking nasasandatahan
  alternative: pangunang pangkat
  rationale: Pinananatili sa pangunahing teksto ang tahasang kahulugan ng pagiging handa o armado para sa digmaan, nang hindi isinasara ang posibilidad na sila rin ang pangunang pangkat; inilalahad ang huli sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘bayan’ upang mapanatili ang lawak ng עָם, at ‘lumakad sa unahan’ para sa likas na paglalarawan ng ayos ng prusisyon.
