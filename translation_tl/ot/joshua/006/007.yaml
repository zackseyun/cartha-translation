- from: At sinabi nila sa bayan, “Humayo kayo at libutin ang lungsod, at ang mga lalaking nasasandatahan[a] ay lumakad sa unahan ng Kaban ni Yahweh.”
  to: At sinabi nila sa bayan, “Magpatuloy kayo at libutin ang lungsod, at ang mga armadong lalaki[a] ay magpatuloy sa unahan ng Kaban ni Yahweh.”
  rationale: Inayos ang ikalawang pandiwa upang maipahayag ang puwersang pautos ng Hebreo at pinalitan ang mas di-likas na parirala para sa mga armadong tao ng karaniwang modernong Filipino. Hindi binago ang kahulugan, ayos ng prusisyon, banal na pangalan, o alternatibong pagbasa sa talababa.
