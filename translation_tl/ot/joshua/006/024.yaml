  source_fidelity: 'Tapat ang salin sa Hebreo: ang lungsod at lahat ng naroon ay sinunog, samantalang ang pilak, ginto, at mga bagay na tanso at bakal ay ibinukod at inilagay sa kabang-yaman ng bahay ni Yahweh. Napananatili ang saklaw ng כְּלֵי sa pamamagitan ng “mga kagamitan,” at ang “bahay” ay hindi anakronistikong ginawang templo.'
