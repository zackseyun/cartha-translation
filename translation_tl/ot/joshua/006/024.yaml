source:
  edition: WLC
  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: tl
  text: Sinunog nila sa apoy ang lungsod at ang lahat ng naroon. Tanging ang pilak, ang ginto, at ang mga kagamitang[a] tanso at bakal ang inilagay nila sa kabang-yaman ng bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sisidlang tanso at bakal.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa mga kagamitan, kasangkapan, o sisidlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: sinunog nila sa apoy
  rationale: Tuwirang ipinapahayag ng Qal perfect na pandiwa ang maramihang gumagawa, at ang בָאֵשׁ ay nagsasaad ng paraang ginamit. Likas at malinaw sa Tagalog ang pariralang ito.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: at ang lahat ng naroon
  rationale: Saklaw nito ang lahat ng nasa loob ng lungsod; maikli at natural sa modernong Tagalog ang “lahat ng naroon.”
- source_word: רַק
  choice: Tanging
  rationale: Ipinakikilala nito ang mga bagay na hindi kasama sa ganap na pagsunog na kababanggit lamang.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: ang pilak, ang ginto
  rationale: Pinananatili ang tiyak at tila imbentaryong pagkakahanay ng mga metal sa Hebreo.
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: at ang mga kagamitang tanso at bakal
  rationale: Malawak ang saklaw ng כְּלֵי at maaaring tumukoy sa mga kagamitan, kasangkapan, o sisidlan. Ang “mga kagamitan” ay natural at hindi labis na nagpapakitid sa kahulugan; ang נְחֹשֶׁת ay isinaling “tanso,” ang karaniwang salitang Filipino para sa metal na tinutukoy sa ganitong konteksto.
- source_word: נָתְנוּ
  choice: inilagay nila
  rationale: Sa konteksto ng paghahabilin ng mahahalagang metal sa isang imbakan, mas tiyak at natural ang “inilagay” kaysa sa literal ngunit malawak na “ibinigay.”
- source_word: אוֹצַר
  choice: kabang-yaman
  rationale: Tumutukoy rito sa lagakan ng mahahalagang bagay na nakatalaga sa santuwaryo; ang “kabang-yaman” ang malinaw at angkop na katumbas.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang anyo ng Hebreo at iniiwasan ang mas tiyak at maaaring anakronistikong “templo”; isinasalin ang banal na pangalan bilang “Yahweh.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Patutunguhan ng mga metal
  choice: sa kabang-yaman ng bahay ni Yahweh
  alternative: sa kabang-yamang pag-aari ng bahay ni Yahweh
  rationale: 'Pinananatili nito ang ugnayan ng construct chain sa Hebreo: ang lagakan ay kaugnay ng bahay ni Yahweh. Hindi nagdaragdag ang salin ng paliwanag tungkol sa eksaktong anyo o pamamahala ng kabang-yaman.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at mariing paghahambing sa pagitan ng ganap na pagsunog at ng tanging mga metal na inilaan sa kabang-yaman. Inilagay ang panandang [a] sa “mga kagamitan,” ang mismong salitang tinatalakay ng talababa.
