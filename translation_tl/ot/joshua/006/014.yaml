  text: וַ/יָּסֹ֨בּוּ אֶת הָ/עִ֜יר בַּ/יּ֤וֹם הַ/שֵּׁנִי֙ פַּ֣עַם אַחַ֔ת וַ/יָּשֻׁ֖בוּ הַֽ/מַּחֲנֶ֑ה כֹּ֥ה עָשׂ֖וּ שֵׁ֥שֶׁת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/014.yaml
  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: tl
  text: Nang ikalawang araw, inikutan nila ang lungsod nang isang beses[a] at bumalik sila sa kampo. Ganito ang ginawa nila sa loob ng anim na araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lumibot sila nang isang beses sa palibot ng lungsod.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Ganito ang ginawa nila nang anim na araw,” ibig sabihin, inulit nila ang paraang ito sa loob ng anim na araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: inikutan nila
  rationale: Ang pandiwang סבב ay nangangahulugang umikot o lumibot sa palibot ng isang bagay. Ang “inikutan nila” ay natural sa modernong Filipino at hindi nagdaragdag ng tahasang diwang militar.
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Ang עִיר ay karaniwang tumutukoy sa isang lungsod; ang “lungsod” ang angkop na katawagan para sa Jerico sa kontekstong ito.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Nang ikalawang araw
  rationale: Likas at malinaw na salin ng pariralang temporal sa salaysay.
- source_word: פַּעַם אַחַת
  choice: nang isang beses
  rationale: Tuwirang ipinahahayag ang bilang ng pag-ikot. Mas malinaw dito ang “isang beses” kaysa sa “minsan,” na maaari ring mangahulugang isang panahong hindi tiyak.
- source_word: וַיָּשֻׁבוּ
  choice: at bumalik sila
  rationale: Ang שוב ay nangangahulugang bumalik. Pinananatili ng salin ang kasunod na kilos sa salaysay.
- source_word: הַמַּחֲנֶה
  choice: sa kampo
  rationale: Ang מַחֲנֶה ay “kampo.” Idinagdag ang “sa” ayon sa likas na balarila ng Filipino upang tukuyin ang patutunguhan.
- source_word: כֹּה עָשׂוּ
  choice: Ganito ang ginawa nila
  rationale: Ang כֹּה ay tumutukoy sa paraang katatapos ilarawan, at ang עשה ay karaniwang “gumawa.” Malinaw at natural na binubuod ng parirala ang paulit-ulit na gawain.
- source_word: שֵׁשֶׁת יָמִים
  choice: sa loob ng anim na araw
  rationale: Ipinahahayag nito ang tagal ng inuulit na kilos. Ang “sa loob ng” ay likas sa Filipino habang hindi binabago ang bilang ng mga araw.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinili ang “inikutan” sa halip na “nagmartsa sa palibot” upang hindi magdagdag ng diwang militar na hindi tahasang nasa pandiwa. Pinanatili sa pangalawang pangungusap ang maikli at buod na anyo ng Hebreo.
