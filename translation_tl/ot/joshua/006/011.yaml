base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: tl
  text: Kaya, ang kaban ni Yahweh ay umilibot sa lungsod nang isang beses. Pagkatapos, pumunta sila sa kampo at nagpalipas ng gabi sa kampo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: umikot
  rationale: Ang anyong Hiphil ng סבב ay naglalarawan ng paglibot sa lungsod. Natural sa Filipino ang “umikot,” habang pinananatiling kaban ang paksa ayon sa gramatika ng Hebreo.
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Tuwirang salin ng construct phrase; ginagamit ang pangalang Yahweh para sa יהוה.
- source_word: הָעִיר
  choice: sa lungsod
  rationale: Tumutukoy sa tiyak na lungsod, ang Jerico sa konteksto, ngunit pinananatili ang pangkalahatang katawagang nasa Hebreo.
- source_word: הַקֵּף פַּעַם אֶחָת
  choice: nang isang beses
  rationale: Ang infinitive absolute na הַקֵּף ay inuulit o nililinaw ang pag-ikot, at ang פַּעַם אֶחָת ay nangangahulugang isang ulit. Sa Filipino, sapat at natural ang “umikot ... nang isang beses.”
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: pumasok sila sa kampo
  rationale: Ang בוא ay maaaring mangahulugang dumating o pumasok; dahil kampo ang patutunguhan, malinaw at natural ang “pumasok ... sa kampo” nang hindi ipinapalagay na “bumalik.”
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: doon nagpalipas ng gabi
  rationale: Ang לון ay nangangahulugang magpalipas ng gabi. Ginamit ang “doon” bilang likas na pagtukoy muli sa kampo, bagaman tahasang inuulit ng Hebreo ang salita.
theological_decisions:
- issue: Paglalarawan sa kaban bilang gumagawa ng kilos
  choice: 'Pinanatiling paksa ang kaban: “ang kaban ni Yahweh ay umikot”'
  alternative: “inilibot nila ang kaban ni Yahweh”
  rationale: Ang kaban ang gramatikal na paksa sa Hebreo. Hindi tahasang binabago ang pahayag upang gawing paksa ang mga paring nagbuhat dito; ipinapaliwanag sa talababa ang personipikasyon o karaniwang salaysay na pagpapaikli.
- issue: Pagsasalin ng pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ang personal na pangalang tipan bilang “Yahweh.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling daloy ng salaysay at ang pambalarilang personipikasyon ng kaban; iniwasan ang mas interpretibong “bumalik.”
