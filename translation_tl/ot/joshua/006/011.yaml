    issue: Hindi tahasang naipapanatili sa pangunahing teksto ang ikalawang pagbanggit ng kampo.
    rationale: Ang Hebreo ay may “pumunta sila sa kampo” at “nagpalipas sila ng gabi sa kampo.” Bagaman malinaw ang “doon,” ligtas at mas tapat na ulitin ang “sa kampo.”
  - severity: low
    issue: Medyo hindi likas ang pariralang “na nililibot iyon” sa talababa.
    rationale: Hindi ito karaniwang modernong Filipino at malabo ang panghalip. Mas malinaw na ilarawan ang parirala bilang “gumawa ng isang paglibot.”
  revised_text: Kaya, ang kaban ni Yahweh ay umilibot sa lungsod nang isang beses. Pagkatapos, pumunta sila sa kampo at nagpalipas ng gabi sa kampo.
  revised_footnotes:
