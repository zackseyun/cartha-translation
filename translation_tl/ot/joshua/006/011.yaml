  verdict: revise
  source_fidelity: Ang “umikot” ay nauunawaan at pinananatili ang kaban bilang paksa, ngunit mas tumpak ang “umilibot,” na malinaw na nagpapahayag ng pag-ikot sa palibot ng lungsod. Dapat ding panatilihin sa pangunahing teksto ang tahasang pag-uulit ng “sa kampo,” gaya ng Hebreo.
  naturalness: Natural at marangal ang daloy pagkatapos ng maliliit na pagsasaayos. Ang “na nililibot iyon” sa talababa ay hindi likas at hindi kailangan; mas malinaw ang “gumawa ng isang paglibot.”
  terminology: Ang “kaban ni Yahweh” at “kampo” ay angkop sa modernong Filipino Tagalog. Ang paggamit ng “Yahweh” ay kaayon ng ibinigay na patakaran.
  issues:
