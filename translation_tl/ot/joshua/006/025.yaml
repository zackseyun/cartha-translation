revisions:
- from: Ngunit pinanatiling buhay ni Josue si Rahab na nagbebenta ng aliw[a], pati ang sambahayan ng kaniyang ama at lahat ng nasa kaniya. Nanirahan siya sa gitna ng Israel hanggang sa araw na ito, sapagkat itinago niya ang mga sugo[b] na ipinadala ni Josue upang maniktik sa Jerico.
  to: Ngunit pinanatiling buhay ni Josue si Rahab na isang patutot[a], pati ang sambahayan ng kanyang ama at lahat ng kanya. Nanirahan siya sa gitna ng Israel hanggang sa araw na ito, sapagkat itinago niya ang mga sugo[b] na ipinadala ni Josue upang maniktik sa Jerico.
  rationale: Pinalitan ang euphemistic na katawagan ng tuwirang “patutot,” habang inilalagay ang mas maingat na alternatibong pananalita sa talababa. Inayos din ang “lahat ng nasa kaniya” bilang “lahat ng kanya” upang maging natural ngunit manatiling malawak ang tinutukoy. Ang angkla ng talababa tungkol sa mga sugo ay inilagay sa “mga sugo,” na siyang salitang nililinaw nito.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:30:24Z'
