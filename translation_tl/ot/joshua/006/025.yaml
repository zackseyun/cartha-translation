  terminology: “Patutot” ang direktang katumbas ng זוֹנָה; ang tala ay nagbibigay ng mas euphemistic na alternatibo. “Mga sugo” ay angkop para sa מַלְאָכִים, samantalang ang “upang maniktik” ang naglilinaw ng misyon nang hindi pinapalitan ang pangunahing katawagan ng “mga espiya.”
