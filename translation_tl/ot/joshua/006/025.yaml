base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: tl
  text: Ngunit pinanatiling buhay ni Josue si Rahab na isang patutot[a], pati ang sambahayan ng kanyang ama at lahat ng kanya. Nanirahan siya sa gitna ng Israel hanggang sa araw na ito, sapagkat itinago niya ang mga sugo[b] na ipinadala ni Josue upang maniktik sa Jerico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “babaeng nagbebenta ng aliw.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga mensahero”; tumutukoy ito sa mga lalaking ipinadala ni Josue upang maniktik sa Jerico.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: nagbebenta ng aliw
  rationale: Malinaw at kasalukuyang katawagan sa Filipino para sa isang babaeng sangkot sa prostitusyon; iniiwasan nito ang mas lumang katawagang maaaring tumunog na mapanlait, habang pinananatili ang tahasang pagkakakilanlan sa teksto.
- source_word: בֵּית אָבִיהָ
  choice: sambahayan ng kaniyang ama
  rationale: Ang parirala ay tumutukoy sa yunit ng pamilya o sambahayan ng ama, hindi lamang sa gusaling tinitirhan nila.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: lahat ng nasa kaniya
  rationale: Pinananatili nitong malawak ang saklaw ng Hebreo, na maaaring sumaklaw sa mga tao at ari-ariang kaugnay sa kaniya, nang hindi nililimitahan sa mga pag-aari lamang.
- source_word: הֶחֱיָה
  choice: pinanatiling buhay
  rationale: 'Tuwirang ipinapahayag ang causative na diwa ng pandiwa: hindi sila pinatay kundi hinayaang manatiling buhay.'
- source_word: וַתֵּשֶׁב
  choice: nanirahan siya
  rationale: Natural na salaysay sa Filipino; ang kasunod na 'hanggang sa araw na ito' ang nagpapahayag na nagpatuloy ang kalagayan hanggang sa panahon ng tagapagsalaysay.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: sa gitna ng Israel
  rationale: Malapit sa idyomang Hebreo at pinananatili ang pahayag ng pagkakabilang o paninirahan niya sa loob ng pamayanan ng Israel nang hindi nagdaragdag ng teolohikal na paliwanag.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang Filipino para sa pagpapatuloy mula sa nakaraan hanggang sa kasalukuyan ng tagapagsalaysay.
- source_word: הֶחְבִּיאָה
  choice: itinago
  rationale: Tuwiran at natural na katumbas ng pagtatago o pagkukubli sa kontekstong ito.
- source_word: הַמַּלְאָכִים
  choice: mga sugo
  rationale: Pinananatili ang pangkalahatang salitang 'messengers' sa Hebreo; nililinaw ng kasunod na layuning maniktik ang kanilang tungkulin.
- source_word: לְרַגֵּל
  choice: upang maniktik
  rationale: Malinaw na ipinahahayag ang lihim na pagmamatyag o reconnaissance na layunin ng kanilang pagpapadala.
theological_decisions:
- issue: Ang paninirahan ni Rahab sa loob ng Israel
  choice: Nanirahan siya sa gitna ng Israel hanggang sa araw na ito
  alternative: Nanirahan siya kasama ng mga Israelita hanggang sa araw na ito
  rationale: Pinananatili ng napiling anyo ang mismong katawagang 'Israel' at ang patuloy na paninirahan ni Rahab sa pamayanan, nang hindi nagpapasok ng higit na konklusyong teolohikal kaysa sa sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniya” para sa pormal ngunit natural na rehistro, “sambahayan” para sa yunit ng pamilya, at “mga sugo” upang mapanatili ang leksikal na kaibhan sa pagitan ng mga mensahero at ng kanilang gawaing paniniktik.
