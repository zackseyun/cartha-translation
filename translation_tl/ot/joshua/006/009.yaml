  text: וְ/הֶ/חָל֣וּץ הֹלֵ֔ךְ לִ/פְנֵי֙ הַ/כֹּ֣הֲנִ֔ים תקעו הַ/שּֽׁוֹפָר֑וֹת וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַחֲרֵ֣י הָ/אָר֔וֹן הָל֖וֹךְ וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: tl
  text: Ang mga lalaking armado ay naglalakad sa unahan ng mga paring umiihip ng mga tambuli[a], at ang bantay sa hulihan ay naglalakad sa likuran ng kaban, habang patuloy na hinihipan ang mga tambuli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: shofarot, mga tambuling yari sa sungay, na madalas tukuying “mga sungay ng lalaking tupa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: mga lalaking armado
  rationale: Tumutukoy ito sa armadong pangkat na nasa unahan ng hanay. Malinaw at natural ang parirala sa makabagong Filipino, nang hindi ginagawang mas teknikal kaysa sa Hebreo.
- source_word: הֹלֵךְ
  choice: naglalakad
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na pagkilos sa loob ng prusisyon; ang aspektong imperpektibo ng Filipino ay angkop dito.
- source_word: לִפְנֵי
  choice: sa unahan ng
  rationale: Likas na pagpapahayag ito ng puwestong nauuna sa ayos ng prusisyon.
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Karaniwang salin ng katawagan sa kontekstong panrelihiyon at pasalaysay.
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: mga paring umiihip ng mga tambuli
  rationale: Sa tekstong Masoretiko, ang anyong תקעו ay malamang na abnormal na pagsulat o pagbasa sa kontekstong ito; ayon sa sintaks at daloy, inilalarawan ng parirala ang patuloy na pag-ihip ng mga pari. Ang 'tambuli' ay natural na katawagang Filipino para sa instrumentong sungay na hinihipan.
- source_word: הַמְאַסֵּף
  choice: ang bantay sa hulihan
  rationale: Ipinahahayag nito ang pangkat na nasa hulihan at gumaganap bilang rear guard; malinaw ang tungkuling militar nang hindi labis na teknikal.
- source_word: אַחֲרֵי
  choice: sa likuran ng
  rationale: Pinananatili ang pangunahing spatial na kahulugan sa paglalarawan ng ayos ng hanay.
- source_word: הָאָרוֹן
  choice: kaban
  rationale: Sapat ang maikling katawagan dahil natukoy na sa konteksto ang kaban; hindi idinaragdag sa talata ang 'ng tipan,' na wala rito.
- source_word: הָלוֹךְ וְתָקוֹעַ
  choice: habang patuloy na hinihipan
  rationale: Ipinahahayag ng konstruksiyon ang tuloy-tuloy o paulit-ulit na pagkilos habang umuusad ang prusisyon. Natural sa Filipino ang passive na anyo at hindi nito tiyak na itinatali sa bantay sa hulihan ang pag-ihip.
- source_word: בַּשּׁוֹפָרוֹת
  choice: ang mga tambuli
  rationale: Pinananatili ang konkretong instrumentong sungay at ang pag-uulit nito sa talata.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tambuli' sa halip na pangkalahatang 'trumpeta' upang mas direktang katawanin ang shofar, habang nililinaw sa talababa ang materyal at karaniwang alternatibong katawagan. Ang huling sugnay ay sadyang hindi tahasang pinapangalanan ang umiihip upang mapanatili ang bahagyang sintaktikong kalabuan ng Hebreo.
