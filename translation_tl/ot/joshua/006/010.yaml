    issue: Ang pariralang “magparinig man ng inyong tinig” ay hindi ang pinakanatural na paraan upang sabihin ang “cause your voice to be heard.”
    rationale: Ang “magparinig” ay maaaring magpahiwatig ng patama o pagpaparinig sa karaniwang gamit. Ang “iparinig ang inyong tinig” ay mas tuwiran at mas malapit sa causative na Hebreo.
  - severity: low
    issue: Medyo di-karaniwan ang tambalang “sigaw-pandigma” sa talababa.
    rationale: Mas malinaw sa modernong Filipino ang “sigaw sa pakikipagdigma” bilang alternatibong pagpapakahulugan ng sigaw sa kontekstong militar.
