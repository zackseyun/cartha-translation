  to: 'At inutusan ni Josue ang mga tao: “Huwag kayong sumigaw[a], ni iparinig ang inyong tinig, at huwag lumabas sa inyong bibig ang kahit isang salita[b] hanggang sa araw na sabihin ko sa inyo, ‘Sumigaw kayo!’ Saka kayo sumigaw.”'
  rationale: Pinalitan ang “magparinig man ng inyong tinig” ng “iparinig ang inyong tinig” upang maging natural at maiwasan ang posibleng ibang pakahulugan, habang pinananatili ang causative na diwa ng Hebreo. Pinakinis din ang alternatibong talababa para sa sigaw na pandigma. Walang binago sa kahulugan, pagkakasunod-sunod, o pag-uulit ng mga pangunahing pandiwa.
