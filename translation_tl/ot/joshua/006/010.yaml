base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: tl
  text: 'At inutusan ni Josue ang mga tao: “Huwag kayong sumigaw[a], ni iparinig ang inyong tinig, at huwag lumabas sa inyong bibig ang kahit isang salita[b] hanggang sa araw na sabihin ko sa inyo, ‘Sumigaw kayo!’ Saka kayo sumigaw.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas tiyak na diwa sa konteksto, “Huwag kayong magbigay ng sigaw sa pakikipagdigma.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at walang salitang lalabas mula sa inyong bibig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוָּה
  choice: inutusan
  rationale: Ipinahihiwatig ng pandiwa ang makapangyarihang pag-uutos, hindi lamang pagbibigay ng payo o tagubilin.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Karaniwang salita ito para sa bayan o mga tao; hindi ito isinaling ‘hukbo’ upang hindi lumabis sa tiyak na kahulugan ng Hebreo.
- source_word: לֹא תָרִיעוּ
  choice: Huwag kayong sumigaw
  rationale: Ang Hiphil ng רוע ay tumutukoy sa malakas na sigaw, madalas bilang sigaw ng pakikipagdigma o pagtatagumpay. Pinananatili ng ‘sumigaw’ ang lawak ng kahulugan, habang inilalagay sa talababa ang mas tiyak na posibilidad.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: o magparinig man ng inyong tinig
  rationale: Tinatapatan nito ang causative na diwa na ‘iparinig ang tinig’ sa natural ngunit marangal na Filipino.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: at huwag lumabas sa inyong bibig ang kahit isang salita
  rationale: Pinananatili ang larawan ng salitang lumalabas sa bibig at ang isahang דָּבָר, habang nililinaw sa Filipino ang ganap na pananahimik.
- source_word: עַד יוֹם
  choice: hanggang sa araw
  rationale: Pinananatili ang kongkretong temporal na pananalita ng Hebreo.
- source_word: אָמְרִי אֲלֵיכֶם
  choice: na sabihin ko sa inyo
  rationale: Natural na Filipino para sa temporal na gamit ng infinitive construct na may hulaping unang panauhan.
- source_word: הָרִיעוּ
  choice: Sumigaw kayo!
  rationale: Tuwirang pautos ito at inuulit ang parehong salitang ginamit sa naunang pagbabawal.
- source_word: וַהֲרִיעֹתֶם
  choice: Saka kayo sumigaw
  rationale: Ipinakikita ng ‘saka’ ang kasunod na kilos na bunga ng ibibigay na utos, habang pinananatili ang pag-uulit ng ugat na רוע.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Josue,’ ang nakaugaliang anyo ng pangalan sa mga saling Tagalog. Pinanatili ang tatlong magkakaugnay na pagbabawal at ang pag-uulit ng ‘sumigaw’ upang maipakita ang estruktura at diin ng Hebreo.
