revisions:
- from: At ang lungsod at ang lahat ng naroon ay dapat italagang wasakin para kay Yahweh.[a] Si Rahab lamang na bayarang babae ang mananatiling buhay—siya at ang lahat ng kasama niya sa bahay—sapagkat itinago niya ang mga sugo na isinugo natin.[b]
  to: At ang lungsod, pati ang lahat ng nasa loob nito, ay itatalaga kay Yahweh upang lubusang wasakin.[a] Si Rahab lamang na prostituta ang mananatiling buhay—siya at ang lahat ng kasama niya sa bahay—sapagkat itinago niya ang mga sugong isinugo natin.[b]
  rationale: Inayos ang pahayag ng חֵרֶם upang ipakita kapuwa ang paglalaan kay Yahweh at ang ganap na pagkawasak, nang walang pagdaragdag ng doktrinal na kahulugan. Pinalitan ang eupemistikong katawagan kay Rahab ng tuwiran at modernong “prostituta,” at pinakinis ang sintaksis ng mga sugo at mga talababa.
  reviewer_model: gpt-5.6-terra
