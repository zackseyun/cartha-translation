  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: tl
  text: At ang lungsod, pati ang lahat ng nasa loob nito, ay itatalaga kay Yahweh upang lubusang wasakin.[a] Si Rahab lamang na prostituta ang mananatiling buhay—siya at ang lahat ng kasama niya sa bahay—sapagkat itinago niya ang mga sugong isinugo natin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itakda sa ilalim ng pagbabawal.” Ang salitang Hebreo ay tumutukoy sa isang bagay na di-mababawing inilaan kay Yahweh—sa talatang ito, sa pamamagitan ng pagkawasak.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga sugo.” Sa konteksto, sila ang mga lalaking isinugo ni Josue upang maniktik sa lupain.
    reason: lexical_clarification
lexical_decisions:
- source_word: חֵרֶם
  choice: italagang wasakin
  rationale: Pinananatili nito kapuwa ang diwang ang lungsod ay lubusang inilaan sa Diyos at ang tiyak na kahihinatnan nitong pagkawasak; hindi lamang ito nangangahulugang 'isinumpa.'
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng ל ang paglalaan kay YHWH. Ginamit ang 'Yahweh' upang tuwirang katawanin ang banal na pangalan sa tekstong Hebreo.
- source_word: רַק
  choice: lamang
  rationale: Malinaw nitong ipinakikilala si Rahab bilang tanging tahasang eksepsiyon sa hatol sa lungsod.
- source_word: הַזּוֹנָה
  choice: bayarang babae
  rationale: Natural at kasalukuyang katawagan ito sa Filipino para sa babaeng nagbebenta ng serbisyong seksuwal, nang hindi gumagamit ng lipas na 'patutot.'
- source_word: תִּחְיֶה
  choice: mananatiling buhay
  rationale: Ipinapahayag nito ang literal na diwang 'mabubuhay' sa konteksto ng pagkaligtas mula sa pagkawasak, nang hindi nagdaragdag kung paano siya ililigtas.
- source_word: אִתָּהּ בַּבַּיִת
  choice: kasama niya sa bahay
  rationale: Tumutukoy ito sa mga taong pisikal na kasama ni Rahab sa loob ng bahay, hindi sa sambahayan bilang abstraktong yunit.
- source_word: הֶחְבְּאַתָה
  choice: itinago niya
  rationale: Tuwirang katumbas ito ng Hiphil ng חבא at hindi nagdaragdag ng higit na pahiwatig gaya ng 'kinupkop.'
- source_word: הַמַּלְאָכִים
  choice: mga sugo
  rationale: Pinananatili ang pangkalahatang kahulugang 'mga mensahero/sugo'; ipinakikita ng konteksto na sila ang mga lalaking isinugo upang maniktik.
- source_word: שָׁלָחְנוּ
  choice: isinugo natin
  rationale: Likas na Filipino ito para sa unang panauhang maramihang qatal na tumutukoy sa naunang pagsusugo.
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: At ang lungsod at ang lahat ng naroon ay dapat italagang wasakin
  rationale: Natural ang ayos sa modernong Filipino habang pinananatili ang saklaw ng hatol sa lungsod at sa lahat ng nasa loob nito.
theological_decisions:
- issue: Pagpapakahulugan sa terminong pananakop na חֵרֶם
  choice: italagang wasakin
  alternative: ilagay sa ilalim ng pagbabawal; lubusang ihandog; sumpain
  rationale: Hindi nito pinalalambot ang karahasan ng hatol at hindi rin nito ipinakakahulugang simpleng isinumpa lamang ang lungsod. Pinananatili nito ang tensiyon na ang bagay ay di-mababawing inilaan kay Yahweh sa pamamagitan ng pagkawasak.
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang tinutukoy ng Hebreo ang personal na banal na pangalan; ang transliterasyong 'Yahweh' ay nagpapanatili ng pagkakaibang ito mula sa titulong 'Panginoon.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'italagang wasakin' upang maipakita ang dobleng puwersa ng חֵרֶם—paglalaan at pagkawasak. Ang gitling na pahaba sa ikalawang pangungusap ay nagpapanatili sa diin ng Hebreo kay Rahab at sa lahat ng kasama niya.
