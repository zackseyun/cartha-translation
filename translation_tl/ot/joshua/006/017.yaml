    issue: “dapat italagang wasakin”
    rationale: Ang “dapat” ay karaniwang nagpapahiwatig ng nararapat na tungkulin sa Filipino. Mas angkop ang pormang “ay itatalaga ... upang lubusang wasakin,” na tumutugma sa proklamasyon/utos at nililinaw ang puwersa ng חֵרֶם.
  - severity: low
