  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: tl
  text: At ang pitong pari, na may dalang pitong trumpetang yari sa sungay ng lalaking tupa[a] sa unahan ng kaban ni Yahweh, ay patuloy na naglalakad at humihihip ng mga trumpeta. Ang mga armadong lalaki ay naglalakad sa unahan nila, at ang pangkat na nasa hulihan ay naglalakad sa likuran ng kaban ni Yahweh habang patuloy silang humihihip ng mga trumpeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pitong trumpeta ng jubileo” o “pitong sungay ng lalaking tupa.” Ang pariralang Hebreo ay tumutukoy sa mga shofar na yari sa o iniuugnay sa sungay ng lalaking tupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: mga trumpetang yari sa sungay ng lalaking tupa
  rationale: Ang שׁוֹפָר ay isang trumpetang sungay, at iniuugnay ito ng הַיֹּבְלִים sa mga lalaking tupa. Malinaw sa karaniwang mambabasa ang salin at hindi ito napagkakamalang metal na trumpeta; inilalagay sa talababa ang posibleng kaugnayan sa jubileo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: הֹלְכִים הָלוֹךְ
  choice: patuloy na lumakad
  rationale: Ipinahihiwatig ng pandiwa at kasunod na infinitive absolute ang nagpapatuloy na pagkilos ng prusisyon.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: habang hinihipan ang mga trumpeta
  rationale: Likas sa Tagalog ang “hinihipan” para sa pagtunog ng trumpetang sungay at ipinakikita ng aspektong di-ganap ang nagpapatuloy na kilos.
- source_word: הֶחָלוּץ
  choice: mga armadong lalaki
  rationale: Tumutukoy ito sa pangkat na nasasandatahan at nauuna sa prusisyon; mas malinaw ito kaysa teknikal na katawagang militar.
- source_word: לִפְנֵיהֶם
  choice: sa unahan nila
  rationale: Pinananatili ang tuwirang ugnayang panlunan; ang “nila” ay likas na tumutukoy sa mga paring kababanggit lamang.
- source_word: הַמְאַסֵּף
  choice: bantay sa hulihan
  rationale: Sa kontekstong militar at prusisyonal, ito ang pangkat na nasa pinakahuli o rear guard.
- source_word: אַחֲרֵי אֲרוֹן יְהוָה
  choice: sa likuran ng kaban ni Yahweh
  rationale: Ang panlunang “sa likuran” ang malinaw na kahulugan sa ayos ng prusisyon.
- source_word: הוֹלֵךְ וְתָקוֹעַ
  choice: habang patuloy na hinihipan ang mga trumpeta
  rationale: Ipinananatili nito ang duratibo at paulit-ulit na pagtunog nang hindi lumilikha ng mabigat na literal na pag-uulit sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Tiyak na kahulugan ng שׁוֹפְרוֹת הַיֹּבְלִים
  choice: mga trumpetang yari sa sungay ng lalaking tupa
  alternative: mga trumpeta ng jubileo; mga sungay ng lalaking tupa
  rationale: Pinagsasama ng pangunahing salin ang anyo o pinagmulan at gamit ng instrumento, ngunit hindi itinatago ng talababa na maaari ring maunawaan ang parirala bilang kaugnay ng jubileo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” para sa ark at karaniwang mga salitang “armadong lalaki” at “bantay sa hulihan” upang madaling mailarawan ang ayos ng prusisyon. Pinanatili ang mahahabang magkakaugnay na kilos ng Hebreo ngunit hinati sa dalawang pangungusap para sa likas na daloy sa Tagalog.
