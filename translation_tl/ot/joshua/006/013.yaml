revisions:
- from: At ang pitong pari, na may dalang pitong trumpetang yari sa sungay ng lalaking tupa[a] sa unahan ng kaban ni Yahweh, ay patuloy na lumakad habang hinihipan ang mga trumpeta. Ang mga armadong lalaki ay lumakad sa unahan nila, at ang bantay sa hulihan ay lumakad sa likuran ng kaban ni Yahweh, habang patuloy na hinihipan ang mga trumpeta.
  to: At ang pitong pari, na may dalang pitong trumpetang yari sa sungay ng lalaking tupa[a] sa unahan ng kaban ni Yahweh, ay patuloy na naglalakad at humihihip ng mga trumpeta. Ang mga armadong lalaki ay naglalakad sa unahan nila, at ang pangkat na nasa hulihan ay naglalakad sa likuran ng kaban ni Yahweh habang patuloy silang humihihip ng mga trumpeta.
  rationale: Inayos ang aspekto ng mga pandiwa upang maipakita ang nagpapatuloy na kilos ng prusisyon sa Hebreo. Nilinaw rin ang panghuling sugnay at ang kolektibong katangian ng hulihang pangkat, nang hindi binabago ang ayos o nilalaman ng talata. Pinanatili ang lahat ng terminong pangunahing leksikal at ang talababa.
