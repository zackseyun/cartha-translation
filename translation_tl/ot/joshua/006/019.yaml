base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: tl
  text: Ngunit ang lahat ng pilak at ginto, pati ang mga kagamitang yari sa tanso[a] at bakal, ay banal para kay Yahweh[b]; mapupunta ang mga iyon sa kabang-yaman ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanso o bronse.” Ang salitang Hebreo ay maaaring tumukoy sa copper o sa haluang metal na bronze.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, isahan ang “ito ay banal” at “mapupunta,” sapagkat itinuturing na isang kolektibong kabuuan ang lahat ng nakalistang metal at kagamitan.
    reason: source_form
lexical_decisions:
- source_word: וְ/כֹל
  choice: Ngunit ang lahat ng
  rationale: Maaaring simpleng mangahulugang “at” ang וְ, ngunit sa konteksto ay itinatangi ng talata ang mahahalagang metal mula sa mga bagay na pupuksain; likas na ipinahahayag ito ng “ngunit.” Tuwirang katumbas ng כֹל ang “lahat ng.”
- source_word: כֶּסֶף וְ/זָהָב
  choice: pilak at ginto
  rationale: Mga metal ang tinutukoy, hindi salapi, gaya ng ipinakikita ng pagkakahanay sa tanso at bakal.
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: pati ang mga kagamitang yari sa tanso at bakal
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa mga sisidlan, kagamitan, o iba pang bagay. Ang “mga kagamitan” ay natural at hindi labis na nagpapakitid sa kahulugan. Nililinaw ng “yari sa” na ang kasunod na mga salita ay materyales.
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: ay banal para kay Yahweh
  rationale: Pinananatili ng “banal” ang tuwirang konsepto ng קֹדֶשׁ, samantalang ipinahihiwatig ng “para kay Yahweh” na ang mga bagay ay ibinukod at inukol sa kaniya nang hindi ginagawang simpleng pag-aari lamang ang pahayag.
- source_word: אוֹצַר יְהוָה
  choice: kabang-yaman ni Yahweh
  rationale: Ang אוֹצָר ay imbakan o kabang-yaman. Ang “kabang-yaman” ang angkop sa konteksto ng pilak, ginto, at mahahalagang kagamitang inilaan sa santuwaryo.
- source_word: יָבֹוא
  choice: mapupunta ang mga iyon
  rationale: Isahan ang pandiwang Hebreo dahil kolektibong kabuuan ang naunang talaan. Sa natural na Tagalog, tinutukoy ang maraming bagay sa pamamagitan ng “mga iyon.” Hindi ginawang tahasang balintiyak na “dadalhin” sapagkat hindi binanggit sa Hebreo ang tagagawa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Kahulugan ng pagiging קֹדֶשׁ לַיהוָה ng mga metal at kagamitan
  choice: banal para kay Yahweh
  alternative: nakalaan kay Yahweh
  rationale: Ang “nakalaan” ay malinaw sa gamit ngunit maaaring mawala ang tahasang wika ng kabanalan. Pinananatili ng salin ang salitang “banal” at hinahayaang manatili ang ugnayan ng kabanalan, pagtatalaga, at pag-aari sa Diyos.
- issue: Pagpapahayag sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa pinagmulang teksto; ang “Yahweh” ay tuwirang kumakatawan rito at iniiwasang ipalit ang isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kabang-yaman” bilang malinaw at pamilyar na katumbas ng treasury, at “mga kagamitan” upang mapanatili ang malawak na saklaw ng כְּלִי. Ang estruktura ay malapit sa Hebreo ngunit inayos ang pagtutugma ng bilang ayon sa natural na gamit sa Tagalog.
