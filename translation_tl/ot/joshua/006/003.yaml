base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/003.yaml
  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: tl
  text: Umikot kayo sa paligid ng lungsod, kayong lahat na lalaking mandirigma; ikutin ninyo ang lungsod nang isang beses. Ganito ang gawin mo sa loob ng anim na araw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: Libutin ninyo
  rationale: Ang pandiwang mula sa סבב ay nasa ikalawang panauhang maramihan at tumutukoy sa pag-ikot sa lungsod. Ang “libutin ninyo” ay likas na utos sa Filipino at angkop sa organisadong pagkilos ng hukbo.
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Tuwirang salin ng pangngalang עִיר na may pantukoy. Bagaman Jerico ang tinutukoy sa konteksto, pinanatili ang karaniwang katawagang ginamit sa Hebreo.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: lahat kayong lalaking mandirigma
  rationale: Pinananatili nito ang tahasang panlalaking sanggunian at ang diwang militar ng literal na pariralang “lahat ng mga lalaki ng digmaan,” ngunit gumagamit ng natural na Filipino.
- source_word: הַקֵּיף
  choice: ikutan ninyo
  rationale: Muling ipinahahayag ng Hebreo ang pag-ikot sa lungsod. Pinanatili ang pag-uulit sa paraang malinaw at hindi labis na alanganin sa Filipino.
- source_word: פַּעַם אֶחָת
  choice: nang isang beses
  rationale: Likas na Filipino para sa isang ganap na pag-ikot o isang pagkakataon.
- source_word: כֹּה
  choice: Ganito
  rationale: Ang pang-abay ay tumutukoy sa itinakdang paraan ng pagsasagawa. Ang “Ganito” ay malinaw at karaniwan sa makabagong Filipino.
- source_word: תַעֲשֶׂה
  choice: ang gagawin mo
  rationale: Pinananatili ng “mo” ang ikalawang panauhang isahan, na lumilipat mula sa maramihang kausap tungo kay Josue bilang pinunong may pananagutan sa utos.
- source_word: שֵׁשֶׁת יָמִים
  choice: sa loob ng anim na araw
  rationale: Malinaw nitong ipinahahayag ang tagal ng paulit-ulit na pagsasagawa ng tagubilin.
theological_decisions:
- issue: Kasarian sa אַנְשֵׁי הַמִּלְחָמָה
  choice: lahat kayong lalaking mandirigma
  alternative: lahat kayong mandirigma
  rationale: Tahasang panlalaki ang pariralang Hebreo at tumutukoy sa mga lalaking nakikidigma; kaya hindi inalis ang sangguniang iyon sa pangunahing teksto.
- issue: Paglipat mula maramihan tungo sa isahang kausap
  choice: “ninyo/kayong” na sinusundan ng “mo”
  alternative: Gawing pawang maramihan o pawang isahan ang mga panghalip
  rationale: Ang Hebreo ay lumilipat mula ikalawang panauhang maramihan sa ikalawang panauhang isahan. Pinananatili ito upang maipakita ang mga mandirigmang kikilos at si Josue bilang pinunong pananagutan ang pagpapatupad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang pautos na “Libutin ninyo” at pinanatili ang sadyang pag-uulit ng pag-ikot sa Hebreo, pati ang mahalagang paglipat mula sa maramihang “ninyo” tungo sa isahang “mo.”
