  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: tl
  text: Kaya pumasok ang mga kabataang lalaking espiya at inilabas nila si Rahab, ang kanyang ama, ina, mga kapatid na lalaki, at lahat ng kabilang sa kanya.[a] Inilabas nila ang lahat ng angkan niya[b] at inilagay sila sa labas ng kampo ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng pag-aari niya.” Malawak ang pananalitang Hebreo at maaaring sumaklaw hindi lamang sa mga tao, bagaman sa kontekstong ito ay malamang na pangunahing tumutukoy ito sa mga kabilang sa kanyang sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng kanyang mga pamilya” o “lahat ng kanyang mga kamag-anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: mga kabataang lalaki
  rationale: Karaniwang tumutukoy ang נַעַר sa batang lalaki o kabataang lalaki. Iniiwasan ng saling ito ang posibleng pahiwatig ng “binata” na walang asawa at hindi rin ito ginagawang pangkalahatang “mga lingkod.”
- source_word: הַמְרַגְּלִים
  choice: mga espiya
  rationale: Ang participle mula sa רגל ay tumutukoy kung aling mga kabataang lalaki ang tinutukoy. Ang “mga espiya” ay tuwiran at hindi nagdaragdag ng layong gaya ng “lupain,” na hindi tahasang binanggit sa talata.
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: inilabas
  rationale: Ang Hiphil ng יצא ay nangangahulugang maglabas o magpangyaring lumabas. Pinananatili ng “inilabas” ang pag-uulit ng pandiwa sa Hebreo.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: lahat ng nauukol sa kanya
  rationale: Malawak ang parirala at maaaring tumukoy sa mga tao o mga bagay na kanya. Pinananatili ng “nauukol sa kanya” ang saklaw at likas na kalabuan nito sa halip na limitahan ito sa ari-arian o sambahayan lamang.
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: lahat ng angkan niya
  rationale: Ang מִשְׁפָּחָה ay maaaring tumukoy sa angkan o mas malawak na pangkat ng magkakamag-anak. Mas angkop dito ang “angkan” kaysa simpleng “pamilya” dahil nabanggit na ang malalapit na kasambahay.
- source_word: וַיַּנִּיחוּם
  choice: inilagay sila
  rationale: Ang Hiphil ng נוח ay maaaring mangahulugang ilagay, iwan, o pagpahingahin sa isang lugar. Ang “inilagay sila” ay nagpapahayag ng sinadyang paglalagay nang hindi ipinapaliwanag ang dahilan.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: sa labas ng kampo ng Israel
  rationale: Tuwirang pinananatili nito ang pook na tinutukoy at ang ugnayang nasa pariralang Hebreo.
theological_decisions:
- issue: Dahilan ng paglalagay kay Rahab at sa kanyang mga kasama sa labas ng kampo
  choice: Isinalin lamang ang pahayag tungkol sa kanilang kinalalagyan nang walang idinagdag na dahilan.
  alternative: Ipaliwanag ito bilang pansamantalang rituwal na paghihiwalay, pag-iingat, o paghihintay bago tanggapin sa Israel.
  rationale: Hindi sinasabi ng tekstong Hebreo kung bakit sila inilagay sa labas ng kampo. Ang hindi pagdaragdag ng paliwanag ay nagpapanatili sa salaysay at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kabataang lalaki” sa halip na “mga binata” upang maiwasan ang di-kinakailangang pahiwatig tungkol sa kalagayang pangmag-asawa; pinanatili rin ang kalabuan ng כָּל אֲשֶׁר לָהּ sa pangunahing teksto.
