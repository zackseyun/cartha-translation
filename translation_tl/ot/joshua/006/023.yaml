  source_fidelity: Tumpak na naihahatid ng draft ang dalawang kabataang lalaki na mga espiya, ang paulit-ulit na 'inilabas,' ang mas malawak na mga pangkat-kamag-anak, at ang paglalagay sa labas ng kampo nang walang idinagdag na dahilan. Gayunman, ang 'lahat ng nauukol sa kanya' ay maaaring mangahulugang lahat ng may kaugnayan sa kanya, hindi ang lahat ng kanya o kabilang sa kanya (כָּל אֲשֶׁר לָהּ).
  naturalness: Makabago at malinaw ang pangkalahatang rehistro. Ang 'lahat ng kabilang sa kanya' ay mas likas at mas malapit sa saklaw ng Hebreo kaysa 'lahat ng nauukol sa kanya.'
  terminology: Ang 'mga kabataang lalaking espiya,' 'angkan,' at 'kampo ng Israel' ay angkop. Pinananatili ng 'kabilang sa kanya' ang bukas na saklaw ng parirala nang hindi ito ginagawang ari-arian lamang o mga tao lamang.
  issues:
