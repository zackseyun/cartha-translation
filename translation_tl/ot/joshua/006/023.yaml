    rationale: Ang 'nauukol sa' ay karaniwang 'may kinalaman sa,' samantalang ang Hebreo ay tumutukoy sa lahat ng kanya o kabilang sa kanya. Maaaring saklawin ng huli ang mga tao at, sa literal na antas, iba pang pag-aari.
