revisions:
- from: Kaya pumasok ang mga kabataang lalaking espiya at inilabas nila si Rahab, ang kanyang ama, ina, mga kapatid na lalaki, at lahat ng nauukol sa kanya.[a] Inilabas nila ang lahat ng angkan niya[b] at inilagay sila sa labas ng kampo ng Israel.
  to: Kaya pumasok ang mga kabataang lalaking espiya at inilabas nila si Rahab, ang kanyang ama, ina, mga kapatid na lalaki, at lahat ng kabilang sa kanya.[a] Inilabas nila ang lahat ng angkan niya[b] at inilagay sila sa labas ng kampo ng Israel.
  rationale: Pinalitan ang 'nauukol sa kanya' ng 'kabilang sa kanya' upang maipahayag ang pagmamay-ari o pagkakabilang na nasa Hebreo, habang pinananatili ang sinadyang kalabuan kung mga tao lamang ba o mas malawak pa ang saklaw. Walang idinagdag na paliwanag tungkol sa dahilan ng paglalagay sa labas ng kampo.
