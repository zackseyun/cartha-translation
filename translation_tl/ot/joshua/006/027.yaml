  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: tl
  text: At si Yahweh ay kasama ni Josue, at kumalat sa buong lupain ang balita tungkol kay Josue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ulat tungkol sa kanya,” “ang kanyang reputasyon,” o “ang kanyang katanyagan.” Ang salitang Hebreo ay maaaring tumukoy sa ulat, balita, reputasyon, o katanyagan; sa kontekstong ito, ipinahihiwatig nito ang malawakang pagkakilala kay Josue.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיְהִי יְהוָה אֶת יְהוֹשֻׁעַ
  choice: At kasama ni Yahweh si Josue
  rationale: Ang היה na may אֶת at isang tao ay nagsasaad dito ng presensya o pagsama. Likas sa modernong Tagalog ang ayos na ito.
- source_word: שָׁמְעוֹ
  choice: naging tanyag siya
  rationale: Maaaring tumukoy ang pangngalan sa ulat, balita, reputasyon, o katanyagan. Sa konteksto, ipinahihiwatig nito ang lumalaganap na pagkakilala kay Josue, kaya natural ang pandiwang pahayag na 'naging tanyag siya,' habang inilalagay sa talababa ang tunay na lawak ng kahulugan.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong lupain
  rationale: Ang הָאָרֶץ ay tumutukoy sa lupaing saklaw ng salaysay, hindi kinakailangang sa buong daigdig. Ang 'sa buong lupain' ay malinaw at natural.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Direktang pinananatili ang personal na pangalan sa tekstong Hebreo at iniiwasang palitan ito ng titulong 'Panginoon.'
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang karaniwang pangalang Filipino na “Josue,” at pinanatili ang “Yahweh” bilang banal na pangalan. Ang dalawang sugnay ay pinagdudugtong ng “At” upang mapanatili ang payak na daloy ng salaysay sa Hebreo.
