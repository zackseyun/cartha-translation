base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: tl
  text: Noong ikapitong araw, bumangon sila nang maaga, nang magbukang-liwayway, at umikot sila sa lungsod nang pitong ulit ayon sa paraang ito. Sa araw na iyon lamang sila umikot sa lungsod nang pitong ulit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Sa kontekstong pasalaysay, natural na ipinakikilala nito sa Tagalog ang pangyayari at oras nang hindi kinakailangang literal na ulitin ang ‘at nangyari.’
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: sa pagsikat ng bukang-liwayway
  rationale: Pinananatili ang larawang unti-unting pag-angat o pagsikat ng liwanag ng madaling-araw sa isang likas at marangal na parirala.
- source_word: וַיָּסֹבּוּ אֶת־הָעִיר
  choice: umikot sa lungsod
  rationale: Tuwirang ipinahahayag ang paglibot sa buong lungsod. Hindi idinagdag ang ‘nagmartsa’ sapagkat ang pandiwang Hebreo ay tumutukoy sa pag-ikot o paglibot, hindi tahasang sa paraan ng paglakad.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: ayon sa paraang iyon
  rationale: Dito ang מִשְׁפָּט ay tumutukoy sa itinakdang pamamaraan o kaayusan, hindi sa hatol na panghukuman.
- source_word: רַק בַּיּוֹם הַהוּא
  choice: Sa araw na iyon lamang
  rationale: Inilalagay ang diin ng רַק sa pagiging natatangi ng ikapitong araw.
