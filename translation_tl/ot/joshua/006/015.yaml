revisions:
- from: Nang ikapitong araw, bumangon sila nang maagang-maaga, sa pagsikat ng bukang-liwayway, at umikot sa lungsod nang pitong ulit ayon sa paraang iyon. Sa araw na iyon lamang sila umikot sa lungsod nang pitong ulit.
  to: Noong ikapitong araw, bumangon sila nang maaga, nang magbukang-liwayway, at umikot sila sa lungsod nang pitong ulit ayon sa paraang ito. Sa araw na iyon lamang sila umikot sa lungsod nang pitong ulit.
  rationale: Inayos ang demonstratibong panghalip upang masundan ang “paraang ito” sa Hebreo at pinakinis ang pambungad para sa likas na modernong Filipino. Pinanatili ang pag-uulit ng pag-ikot nang pitong ulit, ang diin na ito lamang ang araw na iyon, at ang hindi-mas-espesipikong pandiwang “umikot,” na hindi nagdaragdag ng paraan ng paglakad.
