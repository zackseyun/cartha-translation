translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘lungsod’ para sa dignidad ng salaysay at ‘maagang-maaga’ upang likas na maipahayag ang masidhing pagbangon nang maaga. Pinanatili ang pag-uulit sa huling pangungusap dahil mahalagang diin ito ng tekstong Hebreo.
