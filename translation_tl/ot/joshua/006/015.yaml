    issue: Demonstratibo sa “ayon sa paraang iyon”
    rationale: Ang כַּמִּשְׁפָּט הַזֶּה ay literal na tumutukoy sa “paraang ito.” Bagaman nauunawaan ang “iyon” sa konteksto, ang “ito” ay mas malapit sa pinagmulan at nananatiling likas sa Tagalog.
  - severity: low
    issue: Pagpapahayag ng bukang-liwayway
    rationale: Ang “nang magbukang-liwayway” ay mas idyomatiko at malinaw na tumutukoy sa pagdating ng liwanag ng madaling-araw, habang pinananatili ang temporal na diin ng Hebreo.
