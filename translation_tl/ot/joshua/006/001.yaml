  yaml_path: translation/ot/joshua/006/001.yaml
  text: Jericho was tightly shut up because of the sons of Israel[a]; no one went out[b], and no one came in.
translation:
  language: tl
  text: Ang Jerico ay mahigpit na nakasara[b] dahil sa mga Israelita[a]; walang lumalabas at walang pumapasok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak na lalaki ng Israel,” isang karaniwang panlahatang tawag sa sambayanan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Gumagamit ang Hebreo ng magkatambal na anyo ng pandiwang “isara” upang idiin na lubusang nakasara ang Jerico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירִיחוֹ
  choice: Ang Jerico
  rationale: Ginamit ang karaniwang makabagong baybay ng pangalan ng lugar. Hindi dinagdagan ng tahasang temporal na panandang gaya ng “ngayon,” sapagkat ang וְ־ rito ay pang-ugnay sa daloy ng salaysay.
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: mahigpit na nakasara
  rationale: Ang magkatambal na anyo mula sa סגר ay nagpapalakas sa diwang lubusang isinara at tiniyak ang pagkakasara ng lungsod. Likas sa Filipino ang “mahigpit na nakasara” at naihahatid nito ang diin nang hindi pilit na inuulit ang pandiwa.
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Ipinahahayag dito ang dahilan o okasyon ng pagkakasara kaugnay ng presensiya ng Israel. Hindi idinagdag ang “sa takot sa,” dahil hindi tahasang sinasabi ng Hebreo ang damdaming iyon.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ng Israel,” isa itong nakaugaliang panlahatang tawag sa sambayanan ng Israel. Ang “mga Israelita” ay natural, malinaw, at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: walang lumalabas at walang pumapasok
  rationale: Pinananatili ang pangkasalukuyang anyo ng mga participle bilang paglalarawan sa umiiral na lubos na pagkakasara ng lungsod. Natural din sa Filipino ang magkatambal na pahayag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” sa pangunahing teksto para sa likas na panlahatang pagtukoy, habang inilagay sa talababa ang literal na anyong Hebreo. Ang mga pandiwang “lumalabas” at “pumapasok” ay nagpapanatili sa aspektong naglalarawan ng kalagayang umiiral noon.
