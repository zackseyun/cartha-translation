  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: tl
  text: Sa ikapitong pagkakataon,[a] hinipan ng mga pari ang mga tambuli, at sinabi ni Josue sa mga tao, “Sumigaw kayo, sapagkat ibinigay na sa inyo ni Yahweh ang lungsod!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto, tumutukoy ito sa ikapitong pag-ikot nila sa lungsod nang araw na iyon.
    reason: Nililinaw ang tinutukoy ng “ikapitong pagkakataon” batay sa konteksto nang hindi isinasama ang pagpapaliwanag sa pangunahing teksto.
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Sa tuloy-tuloy na salaysay, likas na ipinahahayag ng temporal na “Nang” ang pagdating ng kasunod na pangyayari nang hindi gumagamit ng makalumang pormula.
- source_word: בַּפַּעַם הַשְּׁבִיעִית
  choice: ikapitong pagkakataon
  rationale: Ang פַּעַם ay tumutukoy sa isang pag-uulit o pagkakataon; pinananatili nitong pangkalahatan ang pahayag habang nauunawaan sa konteksto na ito ang ikapitong pag-ikot.
- source_word: תָּקְעוּ
  choice: hinipan
  rationale: 'Karaniwang kahulugan ng תקע kapag instrumento ang layon: hipan o patunugin.'
- source_word: שּׁוֹפָרוֹת
  choice: mga tambuli
  rationale: Ang שופר ay isang sungay na ginagamit bilang instrumentong pantunog. Ang “tambuli” ay natural at dignified sa Filipino at mas tumpak kaysa sa pangkalahatang “mga trumpeta.”
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Payak at karaniwang panimula sa tuwirang pananalita.
- source_word: הָרִיעוּ
  choice: Sumigaw kayo
  rationale: Ang utos ay magtaas ng malakas na sigaw; hindi idinaragdag sa pangunahing teksto ang mas interpretibong “sigaw ng digmaan.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos at angkop sa dignified na modernong Filipino.
- source_word: נָתַן
  choice: ibinigay na
  rationale: Ang Hebreong perfect ay naglalarawan sa pagbibigay bilang tiyak at ganap na mula sa pananaw ni Josue, kahit ang pagsakop sa lungsod ay kasunod pa lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Tumutukoy ang tiyak na pangngalan sa Jerico, ngunit pinananatili ang mismong anyo ng Hebreo na “ang lungsod.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay tuwirang transliterasyon at hindi nagpapalit ng pangalan sa isang titulo.
- issue: Ganap na aspekto ng נָתַן bago pa bumagsak ang lungsod
  choice: ibinigay na
  alternative: ibibigay
  rationale: Pinananatili ang anyong perfect at ang tensiyon ng tiyak na banal na pagkakaloob sa kabila ng nalalapit pa lamang na aktuwal na pagsakop; hindi ito ginagawang tahasang future.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Josue,” ang nakasanayang anyo ng pangalan sa Tagalog, at “tambuli” para sa instrumentong sungay. Iniwasan ang makalumang “at nangyari” at ang sobrang interpretibong “sigaw ng digmaan.”
