  to: Kaya sumigaw ang bayan, at hinipan nila ang mga tambuli.[a] Nang marinig ng bayan ang tunog ng tambuli, sumigaw sila nang napakalakas. Gumuho ang pader sa sarili nitong kinalalagyan,[b] at umakyat ang bayan papasok sa lungsod; bawat lalaki ay sumulong nang tuwid sa harap niya, at nabihag nila ang lungsod.
  rationale: Inayos ang pariralang pamahagi upang ihatid ang direksiyong “sa harap niya,” pinigil ang sobrang pagtitiyak sa paraan ng pagbagsak ng pader, at ginawang “nabihag” ang pagkuha sa lungsod. Napanatili ang mga footnote anchor at ang hindi tiyak na katangian ng mahirap na Hebreong parirala.
