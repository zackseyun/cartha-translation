  text: וַ/יָּ֣רַע הָ/עָ֔ם וַֽ/יִּתְקְע֖וּ בַּ/שֹּֽׁפָר֑וֹת וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הָ/עָ֜ם אֶת ק֣וֹל הַ/שּׁוֹפָ֗ר וַ/יָּרִ֤יעוּ הָ/עָם֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וַ/תִּפֹּ֨ל הַֽ/חוֹמָ֜ה תַּחְתֶּ֗י/הָ וַ/יַּ֨עַל הָ/עָ֤ם הָ/עִ֨ירָ/ה֙ אִ֣ישׁ נֶגְדּ֔/וֹ וַֽ/יִּלְכְּד֖וּ אֶת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: tl
  text: Kaya sumigaw ang bayan, at hinipan nila ang mga tambuli.[a] Nang marinig ng bayan ang tunog ng tambuli, sumigaw sila nang napakalakas. Gumuho ang pader sa sarili nitong kinalalagyan,[b] at umakyat ang bayan papasok sa lungsod; bawat lalaki ay sumulong nang tuwid sa harap niya, at nabihag nila ang lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tambuli” ay salin ng Hebreong shofar, isang sungay na ginagamit bilang instrumentong pansenyas; maaari ring mas tiyak na isaling “sungay ng lalaking tupa.”
    reason: cultural_note
  - marker: b
    text: Sa literal, “bumagsak ang pader sa ilalim nito,” isang di-karaniwang pahayag sa Hebreo. Maaaring ipinahihiwatig nito na gumuho ang pader sa sarili nitong lugar; maaari ring isalin, “bumagsak nang patag ang pader.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: sumigaw / sumigaw nang napakalakas
  rationale: Ang ugat na רוע at pangngalang תְּרוּעָה ay tumutukoy sa malakas na sigaw, madalas sa digmaan o pagsamba. Pinananatili ng “sumigaw” ang malawak na kahulugan nang hindi ipinapalagay na tahasang sigaw-pandigma iyon.
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: mga tambuli / tambuli
  rationale: Ang שׁוֹפָר ay isang sungay na ginagamit bilang instrumentong pantawag o pansenyas. Ang “tambuli” ang natural at dignidadong salin sa Filipino; ipinaliliwanag sa talababa ang anyo nito.
- source_word: קוֹל הַשּׁוֹפָר
  choice: tunog ng tambuli
  rationale: Ang קוֹל ay “tunog” o “tinig”; kapag instrumento ang tinutukoy, malinaw at likas sa Filipino ang “tunog.”
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: gumuho ang pader sa kinatatayuan nito
  rationale: Ang pambihirang pariralang תַּחְתֶּיהָ ay literal na “sa ilalim nito.” Ipinahihiwatig nito na ang pader ay bumagsak nang tuwid sa sarili nitong lugar; pinananatili sa talababa ang literal at ang tradisyonal na posibilidad.
- source_word: וַיַּעַל ... הָעִירָה
  choice: umakyat ... papasok sa lungsod
  rationale: Pinananatili ng “umakyat” ang karaniwang diwa ng עלה, at ipinapahayag ng “papasok” ang direksiyonal na hulapi ng עִירָה.
- source_word: אִישׁ נֶגְדּוֹ
  choice: bawat lalaki ay dumiretso mula sa kanyang kinaroroonan
  rationale: Ang אִישׁ ay panlalaking pangngalang ginamit nang pamahagi. Ang נֶגְדּוֹ ay nagsasaad ng tuwirang pagsulong sa nasa harap ng bawat isa; likas itong naipahahayag sa Filipino bilang pagdiretso mula sa sariling kinaroroonan.
- source_word: וַיִּלְכְּדוּ
  choice: sinakop
  rationale: Sa salaysay ng digmaan, ang לכד ay nangangahulugang bihagin o sakupin ang isang lungsod. “Sinakop” ang pinakanatural dito.
theological_decisions:
- issue: Panlalaking pamahaging pahayag na אִישׁ נֶגְדּוֹ
  choice: bawat lalaki ay dumiretso mula sa kanyang kinaroroonan
  alternative: bawat isa ay dumiretso
  rationale: Tahasang panlalaki ang אִישׁ at inilalarawan ng tagpo ang mga lalaking sumusugod sa lungsod. Kaya pinanatili ang kasarian sa halip na gawing neutral.
- issue: Paraan ng pagbagsak ng pader
  choice: gumuho ang pader sa kinatatayuan nito
  alternative: bumagsak nang patag ang pader
  rationale: Hindi ganap na tiyak ang pambihirang Hebreong תַּחְתֶּיהָ. Hindi tinutukoy ng pangunahing teksto ang eksaktong mekanismo; inilalahad ng talababa ang literal at tradisyonal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “bayan” para sa kolektibong הָעָם, “tambuli” para sa shofar, at “lungsod” para sa עִיר. Iniwasan ang masyadong teknikal o denominasyonal na pananalita.
