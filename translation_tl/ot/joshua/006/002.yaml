  source_fidelity: 'Tapat ang salin sa Hebreo: napanatili ang daloy ng waw-consecutive (“At sinabi”), ang panawag-pansin ng רְאֵה (“Tingnan mo”), ang perfect na “ibinigay ko na,” at ang idyomang pagbibigay “sa iyong kamay.” Wasto ring naisama ang Jerico, ang hari nito, at ang mga magigiting na mandirigma.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “Tingnan mo” at “ibinigay ko na sa iyong kamay” ay angkop sa marangal ngunit di-arkaykong rehistro ng salaysay. Ang “magigiting na mandirigma” ay idiomatiko at malinaw sa kasalukuyang gamit.
  terminology: Ang “Yahweh,” “Josue,” at “Jerico” ay magkakatugma sa napiling anyo ng mga pangalan. Ang “magigiting na mandirigma” ay sapat na sumasaklaw sa lakas at kagitingang pandigma na nasa גִּבּוֹרֵי הֶחָיִל. Ang talababa ay maayos na nakaangkla at nagbibigay ng lehitimong alternatibong leksikal.
