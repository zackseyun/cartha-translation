  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ רְאֵה֙ נָתַ֣תִּי בְ/יָֽדְ/ךָ֔ אֶת יְרִיח֖וֹ וְ/אֶת מַלְכָּ֑/הּ גִּבּוֹרֵ֖י הֶ/חָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Josue, “Tingnan mo, ibinigay ko na sa iyong kamay ang Jerico, kasama ang hari nito at ang magigiting na mandirigma.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malalakas na mandirigma” o “mga mandirigmang matatapang.” Pinagsasama ng pariralang Hebreo ang mga diwa ng lakas at kagitingan sa pakikipaglaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Likas na ipinagpapatuloy nito ang daloy ng salaysay at tumutugma sa waw-consecutive ng Hebreo.
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Direkta at makabagong panawag-pansin na nagpapanatili sa puwersa ng pautos.
- source_word: נָתַתִּי
  choice: ibinigay ko na
  rationale: Ipinahahayag ng perfect na anyo ang pagkilos bilang tiyak at ganap na mula sa pananaw ng nagsasalita, kahit hindi pa nagaganap ang labanan.
- source_word: בְיָדְךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang malinaw na idyomang Hebreo ng pagsasailalim sa kapangyarihan ng isang tao.
- source_word: יְרִיחוֹ
  choice: Jerico
  rationale: Karaniwang anyo ng pangalan ng lugar sa tradisyong Biblikal na Filipino.
- source_word: מַלְכָּהּ
  choice: ang hari nito
  rationale: Ang hulaping pambabae ay tumutukoy sa lungsod; ang “nito” ang natural na katumbas sa Filipino.
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: ang magigiting na mandirigma
  rationale: Pinagsasama nito ang mga diwa ng lakas, kakayahang militar, at kagitingan sa natural na modernong Filipino.
theological_decisions:
- issue: Puwersa ng perfect na נָתַתִּי bago ang labanan
  choice: “ibinigay ko na,” isang pahayag ng tiyak na tagumpay
  alternative: “ibinibigay ko” o “ibibigay ko”
  rationale: Pinananatili ng salin ang kilos bilang naganap na mula sa pananaw ni Yahweh, nang hindi ipinapaliwanag o nilulutas sa mismong teksto ang tensiyon na hindi pa nasasakop ang lungsod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang idyomang “sa iyong kamay” dahil nauunawaan ito sa konteksto at inilalapit nito ang mambabasa sa larawan ng Hebreo. Inilagay ang talababa sa mismong pariralang tinutukoy nito.
