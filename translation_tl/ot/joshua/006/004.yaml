base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/004.yaml
  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: tl
  text: At pitong pari ang magdadala ng pitong trumpeta na yari sa sungay ng lalaking tupa[a] sa harap ng Kaban. Sa ikapitong araw, pitong beses ninyong lilibutin ang lungsod, at hihipan ng mga pari ang mga trumpeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pitong sungay ng lalaking tupa” o “pitong shofar na yari sa sungay ng lalaking tupa.” Ang pariralang Hebreo ay tumutukoy sa mga instrumentong sungay, na malamang ay yari sa sungay ng lalaking tupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: magdadala
  rationale: Karaniwang kahulugan ng נשא ang magdala o pumasan; natural ang “magdadala” para sa konkretong pagkilos ng mga pari.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: mga trumpeta na yari sa sungay ng lalaking tupa
  rationale: Ipinahahayag nito kapwa ang gamit bilang instrumentong hinihipan at ang malamang na pinagmulan nitong sungay ng lalaking tupa, nang hindi gamitin ang posibleng mapanlinlang na “trumpeta ng jubileo.”
- source_word: לִפְנֵי הָאָרוֹן
  choice: sa unahan ng Kaban
  rationale: Ang לִפְנֵי ay tumutukoy sa puwestong nasa harap o unahan. Hindi idinagdag ang “ng tipan,” sapagkat wala iyon sa talata.
- source_word: תָּסֹבּוּ
  choice: lilibutin ninyo
  rationale: Ang סבב ay mangahulugang umikot o lumibot. Ang “lilibutin” ay malinaw at natural sa konteksto ng prusisyong militar.
- source_word: פְּעָמִים
  choice: beses
  rationale: Kapag inuulit ang isang kilos kasunod ng bilang, ang natural na katumbas sa Filipino ay “beses.”
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: hihipan ... ang mga trumpeta
  rationale: Ito ang karaniwang idyoma para sa pagpapatunog ng isang tambuli o trumpetang sungay; malinaw at natural ang “hihipan.”
