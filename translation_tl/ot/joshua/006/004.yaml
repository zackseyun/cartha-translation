    issue: Hindi likas ang “sa unahan ng Kaban.”
    rationale: Bagaman nauunawaan, ang “sa harap ng Kaban” ang mas karaniwang modernong Filipino para sa spatial na לִפְנֵי.
  - severity: medium
    issue: Mali ang pagkakabuo ng alternatibong “pitong shofar na sungay ng lalaking tupa” sa talababa.
    rationale: Ang “shofar” ay pangalan ng instrumento, hindi panuring sa “sungay” sa ganitong anyo. Kailangang maging “pitong shofar na yari sa sungay ng lalaking tupa” upang maging gramatikal at malinaw.
