  text: וַ/תֹּ֖אמֶר ר֣וּת הַ/מּוֹאֲבִיָּ֑ה גַּ֣ם כִּי אָמַ֣ר אֵלַ֗/י עִם הַ/נְּעָרִ֤ים אֲשֶׁר לִ/י֙ תִּדְבָּקִ֔י/ן עַ֣ד אִם כִּלּ֔וּ אֵ֥ת כָּל הַ/קָּצִ֖יר אֲשֶׁר לִֽ/י׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Ruth na Moabita, “Sinabi rin niya sa akin, ‘Manatili kang malapit sa mga kabataang lalaki ko[a] hanggang matapos nilang anihin ang lahat ng ani ko.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga kabataang lalaki.” Sa 2:8, sinabi ni Boaz kay Ruth na manatiling malapit sa kanyang “mga kabataang babae.”
    reason: Pinananatili at nililinaw ang pagkakaiba ng panlalaking salita sa talatang ito at ng pambabaeng salita sa naunang pahayag ni Boaz.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: Ruth na Moabita
  rationale: Pinananatili ang pangalan at likas na isinasalin ang katawagang etniko sa makabagong Tagalog.
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: Sinabi rin niya sa akin
  rationale: Ipinahihiwatig ng גַּם ang karagdagang sinabi ni Boaz; malinaw at natural ang “rin” sa konteksto.
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: sa mga kabataang lalaki ko
  rationale: Masculine plural ang נְעָרִים at tumutukoy sa mga kabataang lalaking tauhan ni Boaz. Ang “mga kabataang lalaki” ay nagpapanatili sa anyong panlalaki ng Hebreo nang hindi ipinapalagay na walang asawa ang mga ito.
- source_word: תִּדְבָּקִין
  choice: Manatili kang malapit
  rationale: Ang דבק ay nagsasaad ng pagkapit o pananatiling dikit/malapit; ipinapahayag ng salin ang praktikal na tagubilin sa natural na Tagalog.
- source_word: עַד אִם כִּלּוּ
  choice: hanggang matapos nilang anihin
  rationale: Malinaw na ipinapakita ang hangganan ng pananatili ni Ruth at natural na iniuugnay ang pagtatapos sa gawain ng pag-aani.
- source_word: אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: ang lahat ng ani ko
  rationale: Pinananatili ang kabuuan at ang pag-aari ni Boaz sa maikli at karaniwang pananalita.
theological_decisions:
- issue: Kasarian ng mga tauhang binanggit ni Ruth
  choice: mga kabataang lalaki ko
  alternative: mga kabataang babae ko / mga tauhan ko
  rationale: Masculine plural ang mismong salitang Hebreo sa talatang ito. Bagaman “mga kabataang babae” ang binanggit ni Boaz sa 2:8, hindi tahimik na pinapantay ng salin ang dalawang anyo; itinatala sa talababa ang tensiyong tekstuwal at kontekstuwal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Moabita” bilang likas na katawagang etniko, at iniwasan ang “mga binata” dahil maaari itong magpahiwatig na walang asawa ang mga tauhan. Pinanatili ang panlalaking anyo ng Hebreo at ipinaliwanag ang pagkakaiba nito sa konteksto sa talababa.
