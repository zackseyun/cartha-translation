base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: tl
  text: Sinabi ni Boaz kay Ruth, “Hindi ba't narinig mo, anak ko? Huwag kang pumunta sa ibang bukid upang mamulot ng mga naiwang uhay, at huwag ka ring lumayo rito. Sa halip, manatili kang kasama ng aking mga kabataang babae.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Makinig ka
  rationale: Bagaman anyong retorikal na tanong ang Hebreo, ginagamit ito rito bilang magiliw ngunit mariing panawag-pansin; natural itong naipahahayag sa modernong Tagalog bilang utos.
- source_word: לִלְקֹט
  choice: mamulot ng mga natirang uhay
  rationale: Ang pandiwa ay tumutukoy sa pamumulot ng ani na naiwan ng mga manggagapas; nilinaw ang bagay na pinupulot upang madaling maunawaan ang gawaing paghi glean.
- source_word: תִדְבָּקִין
  choice: manatili kang malapit
  rationale: Ang ugat דבק ay literal na dumikit o kumapit at sa kontekstong ito ay nangangahulugang manatiling kasama o malapit.
- source_word: נַעֲרֹתָי
  choice: aking mga dalaga
  rationale: Ang pambabaeng pangmaramihang anyo ay tumutukoy sa mga kabataang babaeng manggagawa o kasambahay ni Boaz; pinanatili ang payak at dignified na katawagang “mga dalaga.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magiliw at may dignidad. Ginamit ang “anak” bilang mapagmahal at nakatatandang tawag ni Boaz kay Ruth, hindi bilang pahayag ng literal na kaugnayang pampamilya.
