translation:
  language: tl
  text: Pagkatapos, sinabi ni Boaz sa binata niyang nakatalagang mamahala sa mga tagapag-ani, “Kanino ang kabataang babaeng ito?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kanino nabibilang ang kabataang babaeng ito?” Ang tanong sa Hebreo ay maaaring tumukoy sa kaniyang kaugnayan o sa sambahayang kinabibilangan niya, hindi lamang sa pagmamay-ari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: לְנַעֲרוֹ
  choice: sa binata niya
  rationale: Ang נַעַר ay maaaring tumukoy sa binata, lingkod, o tauhan. Pinananatili ng “binata” ang pangunahing leksikal na diwa, habang ipinapahayag ng kasunod na parirala ang kaniyang tungkulin.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: na nangangasiwa sa mga tagapag-ani
  rationale: Ipinahihiwatig ng Niphal participle kasama ng עַל na siya ay nakatalaga o namamahala sa mga umaani. Mas natural sa Filipino ang “nangangasiwa” kaysa literal na “nakatayo sa ibabaw.”
- source_word: לְמִי
  choice: Kanino ang
  rationale: Ang idyomang Hebreo ay nagtatanong tungkol sa kaugnayan, sambahayan, o kinabibilangan ng babae. Likas at maikli sa Filipino ang “Kanino ang…?”
- source_word: הַנַּעֲרָה
  choice: dalaga
  rationale: Tumutukoy ang נַעֲרָה sa isang batang babae o kabataang babae. Ang “dalaga” ay natural, marangal, at hindi nagdaragdag ng katayuang alipin o utusan.
- source_word: הַזֹּאת
  choice: ito
  rationale: Karaniwang katumbas sa Filipino ng demonstratibong tumutukoy sa babaeng naroon.
