base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: tl
  text: Sinabi ni Ruth na taga-Moab kay Naomi, “Pakiusap, hayaan mo akong pumunta sa bukid at mamulot ng mga uhay sa likuran ng sinumang lalaking magkakaloob sa akin ng lingap[a].” Sinabi naman ni Naomi sa kanya, “Sige, anak ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sa likuran ng sinumang lalaking makasusumpong ako ng lingap sa kanyang paningin.” Ang “makasumpong ng lingap sa paningin” ng isang tao ay idyoma para sa pagtanggap ng kanyang mabuting pagtingin o pabor.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: na taga-Moab
  rationale: Malinaw at likas sa modernong Filipino ang pagtukoy sa pinagmulan ni Ruth; pinananatili nito ang diin ng salaysay sa pagiging dayuhan niya nang walang makalumang katawagan.
- source_word: אֵלְכָה נָּא
  choice: Pakiusap, hayaan mo akong pumunta
  rationale: Ipinahahayag ng cohortative na may נָא ang magalang na pakiusap at kusang hangarin ni Ruth, hindi lamang isang panghinaharap na kilos.
- source_word: הַשָּׂדֶה
  choice: sa bukid
  rationale: Ang “bukid” ang natural na katawagan sa Filipino para sa sakahang pinangyayarihan ng pag-aani at pamumulot.
- source_word: וַאֲלַקֳטָּה
  choice: at mamulot
  rationale: Sa konteksto, ang לקט ay pamumulot ng naiwang ani. Naipahihiwatig ito nang malinaw ng “mamulot” kasama ng “mga uhay,” nang hindi gumagamit ng teknikal o di-pamilyar na salita.
- source_word: בַשִּׁבֳּלִים
  choice: ng mga uhay
  rationale: Tumutukoy ang שִׁבֳּלִים sa mga uhay o ulo ng butil, hindi sa mga nakataling bigkis.
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: sa likuran ng sinumang magkaloob sa akin ng lingap
  rationale: Pinananatili ng “sa likuran” ang larawan ng pagsunod sa mga nag-aani, samantalang likas na isinasalin ng “magkaloob sa akin ng lingap” ang Hebreong idyoma tungkol sa pagkakaroon ng pabor sa paningin ng isang tao. Ang “sinuman” ay nagpapanatili sa di-tiyak na tinutukoy.
- source_word: חֵן
  choice: lingap
  rationale: Ang “lingap” ay angkop sa pabor at mabuting pagtanggap na hinihingi ng kalagayang panlipunan, at hindi ito kusang nagdadala ng mas teknikal na teolohikong pakahulugan.
- source_word: לְכִי בִתִּי
  choice: Sige, anak ko
  rationale: Natural na ipinahahayag ng “Sige” ang pahintulot na nakapaloob sa pautos na “Humayo ka,” at pinananatili ng “anak ko” ang magiliw na pakikitungo ni Naomi.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taga-Moab” sa halip na isang makalumang katawagang etniko, at “mamulot ng mga uhay” upang maunawaan ng karaniwang mambabasa ang gawain nang hindi nawawala ang larawang agrikultural. Pinanatili sa talababa ang Hebreong idyoma at ang di-tiyak na tinutukoy.
