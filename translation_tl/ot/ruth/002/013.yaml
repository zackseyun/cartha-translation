base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: tl
  text: At sinabi niya, “Nawa’y makasumpong ako ng lingap sa inyong paningin, panginoon ko, sapagkat binigyan ninyo ako ng kaaliwan at nagsalita kayo sa puso ng inyong alilang babae[a], gayong hindi naman ako tulad ng isa sa inyong mga alilang babae.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabait ninyo akong kinausap.” Sa Hebreo, literal na “nagsalita kayo sa puso ng inyong alilang babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: Nawa’y makasumpong ako ng lingap
  rationale: Pinananatili ang Hebreong idyoma bilang magalang at mapagpakumbabang paghiling, sa halip na ituring na payak na pahayag tungkol sa hinaharap.
- source_word: בְּעֵינֶיךָ
  choice: sa inyong paningin
  rationale: Likas na katumbas sa Filipino ng Hebreong idyoma tungkol sa pagtinging may pagsang-ayon o kagandahang-loob.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Magalang na tawag ito ni Ruth kay Boaz, hindi banal na titulo. Pinananatili nito ang antas ng paggalang sa pinagmulang teksto.
- source_word: נִחַמְתָּנִי
  choice: binigyan ninyo ako ng kaaliwan
  rationale: Ipinapahayag ang emosyonal na pag-aliw o pagpapatatag sa kalagayan ni Ruth sa natural na modernong Filipino.
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: nagsalita kayo sa puso ng
  rationale: Pinananatili sa pangunahing teksto ang matingkad na larawang Hebreo, habang inilalagay sa talababa ang mas idyomatikong kahulugan.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: inyong alilang babae / inyong mga alilang babae
  rationale: Tiyak na tumutukoy ang pangngalan sa babaeng alipin o katulong. Ang “alilang babae” ay nagpapanatili ng kasarian at mababang katayuang panlipunan nang hindi ipinagpapalagay ang eksaktong anyo ng pagkaalipin.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: gayong hindi naman ako tulad ng isa
  rationale: 'Ipinapakita ng “gayong” ang diwang konsesibo: napakabait ni Boaz kay Ruth kahit hindi siya kabilang o kapantay ng mga alilang babae nito. Ang kasalukuyang anyo ay likas na nagpapahayag ng estadong tinutukoy.'
