translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig. Ginamit ang magalang na panghalip na “ninyo/inyong” para sa pakikipag-usap ni Ruth kay Boaz, at pinanatili ang Hebreong larawang “sa inyong paningin” at “nagsalita kayo sa puso” nang may paliwanag sa talababa.
