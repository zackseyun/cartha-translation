  - severity: medium
    issue: Ang “kung kanino siya nagtrabaho” ay naglilipat ng kahulugan mula sa “ang ginawa niya kasama niya” tungo sa “ang taong pinagtatrabahuhan niya.”
    rationale: Bagaman kontekstuwal ang “nagtrabaho,” dapat mapanatili ang kaugnayang “kasama niya” at ang mas malawak na saklaw ng ulat ni Ruth.
