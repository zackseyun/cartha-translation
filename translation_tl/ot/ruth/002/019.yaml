base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: tl
  text: Sinabi sa kanya ng biyenan niyang babae, “Saan ka namulot ng mga natirang uhay ngayon, at saan ka nagtrabaho? Pagpalain nawa ang taong pumansin sa iyo.” Kaya ikinuwento niya sa biyenan niyang babae ang ginawa niya kasama ng lalaking iyon. Sinabi niya, “Boaz ang pangalan ng lalaking kasama kong nagtrabaho ngayon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: kanyang biyenang babae
  rationale: Tiyak na tumutukoy sa ina ng asawa; nililinaw ng “babae” ang kasarian sa Tagalog, yamang maaaring pangkalahatan ang “biyenan.”
- source_word: לִקַּטְתְּ
  choice: namulot ng mga natirang uhay
  rationale: Inilalarawan ang tiyak na gawaing agrikultural na pagpulot ng naiwang ani; mas madaling maunawaan kaysa sa teknikal o di-karaniwang katumbas.
- source_word: וְאָנָה עָשִׂית
  choice: at saan ka nagtrabaho
  rationale: Bagaman malawak ang kahulugan ng עשה na “gumawa,” ang konteksto ay paggawa sa bukid, kaya natural ang “nagtrabaho.”
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: Pagpalain ang taong pumansin sa iyo
  rationale: Pinananatili ang pormulang pagpapala at ang diwa ng pagkilala o pagbibigay-pansin kay Ruth.
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: kung kanino siya nagtrabaho
  rationale: Ang literal na “kung ano ang ginawa niya kasama niya” ay maaaring maging malabo o mapanlinlang sa Tagalog; ipinahahayag ng salin ang kontekstuwal na paggawa sa bukid.
- source_word: אֲשֶׁר עָשִׂיתִי עִמּוֹ
  choice: pinagtatrabahuhan ko
  rationale: Natural na Tagalog para sa paggawa sa bukid na nasa ilalim o pahintulot ng may-ari; hindi nito ipinahihiwatig na magkapantay silang magkasamang manggagawa.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Karaniwang transliterasyon ng pangalang Hebreo sa modernong Filipino.
