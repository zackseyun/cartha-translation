revisions:
- from: Sinabi sa kanya ng kanyang biyenang babae, “Saan ka namulot ng mga natirang uhay ngayon, at saan ka nagtrabaho? Pagpalain ang taong pumansin sa iyo.” Kaya sinabi niya sa kanyang biyenang babae kung kanino siya nagtrabaho. Sinabi niya, “Boaz ang pangalan ng lalaking pinagtatrabahuhan ko ngayon.”
  to: Sinabi sa kanya ng biyenan niyang babae, “Saan ka namulot ng mga natirang uhay ngayon, at saan ka nagtrabaho? Pagpalain nawa ang taong pumansin sa iyo.” Kaya ikinuwento niya sa biyenan niyang babae ang ginawa niya kasama ng lalaking iyon. Sinabi niya, “Boaz ang pangalan ng lalaking kasama kong nagtrabaho ngayon.”
  rationale: Pinalitan ang mga pahayag na maaaring magpahiwatig na employer ni Ruth si Boaz. Ang “ginawa niya kasama ng lalaking iyon” ay mas malapit sa Hebreo at pinananatili ang lawak nito, samantalang ang huling pangungusap ay malinaw na ipinapahayag ang kontekstuwal na pagtatrabaho kasama ni Boaz. Walang kinakailangang talababa dahil sapat na ang natural na salin sa pangunahing teksto.
