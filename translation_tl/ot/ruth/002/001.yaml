id: RUT.2.1
reference: Ruth 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּֽ/לְ/נָעֳמִ֞י מידע לְ/אִישָׁ֗/הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִ/מִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּ/שְׁמ֖/וֹ בֹּֽעַז׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: tl
  text: May isang kamag-anak[a] ang asawa ni Naomi—isang lalaking may malaking kakayahan at katayuan[b] mula sa angkan ni Elimelec[c]—at Boaz ang pangalan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kakilala” o “taong may kaugnayan”; hindi ganap na tiyak ang salitang Hebreo, ngunit ipinahihiwatig ng pagbanggit sa angkan ni Elimelec na kamag-anak siya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang makapangyarihang lalaki,” “isang kilalang lalaki,” o “isang mayamang lalaki.” Pinagsasama ng pananalitang Hebreo ang mga diwa ng lakas, kakayahan, katayuan, at kayamanan.
    reason: lexical_alternative
  - marker: c
    text: O “pamilya ni Elimelec”; maaari itong tumukoy sa mas malawak na pangkat ng magkakamag-anak o angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מידע
  choice: kamag-anak
  rationale: Tumutukoy ito sa isang taong kilala o may kaugnayan sa asawa ni Naomi. Dahil sinasabing kabilang siya sa angkan ni Elimelec, ang “kamag-anak” ang pinakanatural sa konteksto, nang hindi pa ipinapalagay ang tiyak na papel ng isang tagatubos.
- source_word: לְאִישָׁהּ
  choice: ang asawa ni Naomi
  rationale: Nililinaw ng parirala na ang kaugnayan ng lalaki ay sa asawa ni Naomi. Ang ayos na ito ay natural sa Filipino at hindi nagpapahiwatig na sarili niyang kamag-anak ang lalaki.
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: isang lalaking may malaking kakayahan at katayuan
  rationale: Saklaw ng idyomang Hebreo ang lakas, kakayahan, yaman, at mataas na katayuan. Sa di-militar na konteksto ng Ruth, iniiwasan ng saling ito ang di-kailangang diwa ng mandirigma habang pinananatili ang lawak ng papuri.
- source_word: מִמִּשְׁפַּחַת
  choice: mula sa angkan ni
  rationale: Ang מִשְׁפָּחָה ay maaaring tumukoy sa mas malawak na pangkat ng magkakamag-anak, hindi lamang sa sambahayan o malapit na pamilya.
- source_word: וּשְׁמוֹ
  choice: at Boaz ang pangalan niya
  rationale: Natural na paraan ito sa salaysay na Filipino upang ipakilala ang pangalan ng tauhan.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Ginamit ang nakaugaliang transliterasyon ng pangalang Hebreo.
- source_word: וּלְנָעֳמִי
  choice: May ... ang asawa ni Naomi
  rationale: Isinama ang pang-ugnay sa natural na daloy ng pangungusap sa Filipino, nang hindi nagdaragdag ng tahasang panandang panahong katumbas ng “ngayon.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katayuan” at “kakayahan” upang mapanatili ang malawak na diwa ng idyomang Hebreo nang hindi ito ginagawang militar. Pinanatili ang pangalang “Naomi” ayon sa mas tuwirang transliterasyon, samantalang “Elimelec” at “Boaz” ay madaling makilala at natural basahin sa Filipino.
