base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: tl
  text: Nawa’y suklian ni Yahweh ang iyong ginawa, at maging lubos nawa ang gantimpala mo mula kay Yahweh, ang Diyos ng Israel, na nilapitan mo upang manganlong sa ilalim ng kanyang mga pakpak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at maging ganap nawa ang iyong kabayaran.” Ang salitang Hebreo ay maaaring mangahulugang kabayaran o gantimpala, at ang “lubos/ganap” ay kaugnay ng ugat ng salitang isinaling “suklian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: Gantihan nawa
  rationale: Ang Piel na anyong ito ay nagpapahayag ng pagpapala o hangarin. Likas sa Filipino ang “gantihan nawa” at pinananatili nito ang diwa ng banal na pagganti o pagtumbas sa kabutihang ginawa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos, hindi bilang isang titulo.
- source_word: פָּעֳלֵךְ
  choice: ang iyong ginawa
  rationale: Maaaring mangahulugang gawa o ginawa. Sa konteksto, malinaw at natural itong tumutukoy sa tapat na pagkilos ni Ruth.
- source_word: וּתְהִי
  choice: at maging ... nawa
  rationale: Pinananatili ang kaagapay na anyo ng paghiling o pagpapala sa unang sugnay.
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: ang gantimpala mo
  rationale: Ang salita ay maaaring tumukoy sa upa o gantimpala. Dito, banal na pagganti ang konteksto, kaya “gantimpala” ang mas angkop.
- source_word: שְׁלֵמָה
  choice: lubos
  rationale: Ipinahahayag ang pagiging buo o ganap at bahagyang pinananatili ang ugnayang semantiko nito sa ugat ng יְשַׁלֵּם.
- source_word: מֵעִם
  choice: mula kay
  rationale: Ipinakikita rito ang pinagmumulan ng gantimpala.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang construct.
- source_word: לַחֲסוֹת
  choice: upang manganlong
  rationale: Natural at marangal na Filipino para sa sadyang paglapit upang humanap o tumanggap ng kanlungan.
- source_word: תַּחַת כְּנָפָיו
  choice: sa ilalim ng kanyang mga pakpak
  rationale: Pinananatili ang matingkad na larawang Hebreo ng proteksiyon sa halip na gawing abstraktong “pag-iingat.”
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Larawan ng pagkanlong sa ilalim ng mga pakpak ng Diyos
  choice: Pinanatili nang literal ang “sa ilalim ng kanyang mga pakpak”
  alternative: sa ilalim ng kanyang pag-iingat
  rationale: Ang metapora ay mahalagang bahagi ng teolohikal at makatang pahayag; hindi ito dapat patagin bilang abstraktong proteksiyon lamang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” upang malinaw na maipahayag ang pagpapala o hangarin, at pinanatili ang metapora ng mga pakpak. Inilagay ang pananda ng talababa sa dulo ng pangungusap upang saklawin ang magkakaugnay na larong-salita tungkol sa pagganti at lubos na gantimpala.
