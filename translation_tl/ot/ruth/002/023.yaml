revisions:
- from: Kaya nanatili siyang malapit sa mga dalagang manggagawa ni Boaz upang mamulot[a] hanggang sa matapos ang pag-aani ng sebada at ng trigo. At nanirahan siya kasama ng kaniyang biyenang babae.[b]
  to: Kaya nanatili siyang malapit sa mga kabataang babaeng manggagawa ni Boaz upang mamulot[a] hanggang sa matapos ang pag-aani ng sebada at ang pag-aani ng trigo. At nanirahan siyang kasama ng kaniyang biyenang babae.[b]
  rationale: Pinalitan ang “dalagang manggagawa” upang huwag magdagdag ng ideyang walang asawa. Inulit ang “pag-aani” upang maipakita ang dalawang magkahiwalay na ani sa Hebreo, inayos ang daloy ng huling pangungusap, at ginawang paliwanag sa halip na alternatibong salin ang unang talababa.
