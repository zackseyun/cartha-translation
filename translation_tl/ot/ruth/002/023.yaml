    rationale: Magkakahiwalay na binabanggit ng Hebreo ang pag-aani ng sebada at ang pag-aani ng trigo; ang pag-uulit ng “pag-aani” ay nagpapanatili ng pagkakasunod at tagal.
  - severity: low
