base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: tl
  text: Kaya nanatili siyang malapit sa mga kabataang babaeng manggagawa ni Boaz upang mamulot[a] hanggang sa matapos ang pag-aani ng sebada at ang pag-aani ng trigo. At nanirahan siyang kasama ng kaniyang biyenang babae.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mamulot” dito ay tumutukoy sa pangunguha ng mga uhay na naiwan sa bukid pagkatapos ng ani.
    reason: cultural_clarification
  - marker: b
    text: O “At nanatili siyang kasama ng kaniyang biyenang babae.” Ang pandiwang Hebreo ay maaaring mangahulugang “nanatili” o “nanirahan,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: nanatili siyang malapit
  rationale: Ang דבק ay may diwang dumikit o manatiling mahigpit na kaugnay. Sa salaysay, likas na ipinahahayag ng pariralang ito ang patuloy na pagsama ni Ruth sa mga manggagawa ni Boaz nang hindi nagpapahiwatig ng literal na pagkapit.
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: sa mga dalagang manggagawa ni Boaz
  rationale: Ang נַעֲרוֹת ay tumutukoy sa mga kabataang babae ni Boaz na nagtatrabaho sa bukid. Idinagdag ang “manggagawa” upang maging malinaw ang tungkulin nila sa konteksto, habang pinananatili ng “dalaga” ang kasarian at karaniwang diwa ng salita.
- source_word: לְלַקֵּט
  choice: upang mamulot
  rationale: Ang infinitive ay nagsasaad ng layunin. Ang “mamulot” ay natural na salitang Filipino para sa pagkuha ng mga uhay na naiwan matapos ang pag-aani.
- source_word: עַד כְּלוֹת
  choice: hanggang sa matapos
  rationale: Tumpak at likas nitong ipinahahayag ang tagal hanggang sa ganap na pagtatapos.
- source_word: קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: ang pag-aani ng sebada at ng trigo
  rationale: Pinananatili ang dalawang magkasunod na panahon ng pag-aani at ang lawak ng panahong patuloy na namulot si Ruth.
- source_word: וַתֵּשֶׁב
  choice: nanirahan siya
  rationale: Maaaring mangahulugan ang ישב na umupo, manatili, o manirahan. Sa ugnayan nito sa biyenang babae ni Ruth, malinaw at natural ang kahulugang paninirahan, bagaman posible rin ang “nanatili.”
- source_word: אֶת חֲמוֹתָהּ
  choice: kasama ng kaniyang biyenang babae
  rationale: Sa konstruksiyong ito, likas na ipinahahayag sa Filipino ang paninirahang kasama ang isang tao. Nililinaw ng “babae” na ang tinutukoy ay mother-in-law, dahil maaaring hindi tiyak ang kasarian ng “biyenan” lamang.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “sebada” bilang karaniwang tawag sa barley at “biyenang babae” upang maiwasan ang kalabuan sa kasarian. Pinanatili ang payak na daloy ng salaysay at ang leksikal na posibilidad ng וַתֵּשֶׁב sa talababa.
