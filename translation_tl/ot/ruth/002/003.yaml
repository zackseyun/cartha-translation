  terminology: Ang “angkan” ay angkop para sa מִשְׁפָּחָה sa kontekstong ito. Ang “bahagi ng bukid na pag-aari ni Boaz” ay tumpak para sa parsela o bahagi ng sakahan na kaugnay ni Boaz. Pinanatili ang “Boaz” at “Elimelec” gaya ng nasa draft.
