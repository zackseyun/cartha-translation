  text: וַ/תֵּ֤לֶךְ וַ/תָּבוֹא֙ וַ/תְּלַקֵּ֣ט בַּ/שָּׂדֶ֔ה אַחֲרֵ֖י הַ/קֹּצְרִ֑ים וַ/יִּ֣קֶר מִקְרֶ֔/הָ חֶלְקַ֤ת הַ/שָּׂדֶה֙ לְ/בֹ֔עַז אֲשֶׁ֖ר מִ/מִּשְׁפַּ֥חַת אֱלִימֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: tl
  text: Umalis siya, pumunta at dumating sa bukid, at namulot ng mga natirang uhay sa likuran ng mga tagapag-ani. Nagkataong napunta siya[a] sa bahagi ng bukid na pag-aari ni Boaz, na mula sa angkan ni Elimelec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “at nagkataon ang kaniyang pagkakataon”—isang idyomang nagpapahayag ng waring nagkataon lamang mula sa pananaw ng tao. Gayunman, inaanyayahan din ng mas malawak na salaysay ang mambabasa na makita rito ang patnubay ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: umalis siya, pumunta
  rationale: Pinananatili ang sunod-sunod na galaw ng salaysay sa Hebreo, ngunit ipinapahayag ito sa natural na modernong Tagalog.
- source_word: וַתְּלַקֵּט
  choice: namulot ng mga natirang uhay
  rationale: Sa konteksto ng pag-aani, ang לקט ay pamumulot ng naiwan ng mga tagapag-ani; mas madaling maunawaan ito kaysa sa teknikal o makalumang katawagan.
- source_word: בַּשָּׂדֶה
  choice: sa bukid
  rationale: Natural na katumbas ng field sa kontekstong agrikultural.
- source_word: אַחֲרֵי הַקֹּצְרִים
  choice: sa likuran ng mga tagapag-ani
  rationale: 'Ang אַחֲרֵי ay panlunan dito: sumusunod si Ruth sa mga nag-aani upang pulutin ang kanilang naiwan.'
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: Nagkataong napunta siya
  rationale: Natural na Tagalog para sa idyomang Hebreo na literal na tumutukoy sa nangyari sa kaniya bilang pagkakataon, nang hindi ipinapasok sa pangunahing teksto ang tahasang paliwanag tungkol sa kalooban ng Diyos.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: bahagi ng bukid
  rationale: Tumpak at madaling maunawaang salin para sa isang takdang bahagi o parsela ng lupang sakahan.
- source_word: לְבֹעַז
  choice: na pag-aari ni Boaz
  rationale: Nililinaw sa natural na Tagalog ang ugnayang pagmamay-ari na ipinahihiwatig ng lamed.
- source_word: מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: mula sa angkan ni Elimelec
  rationale: Ang 'angkan' ay angkop sa mas malawak na grupong pampamilya na tinutukoy ng מִשְׁפָּחָה at malinaw pa rin sa karaniwang mambabasa.
theological_decisions:
- issue: Ang waring pagkakataon at ang pahiwatig ng patnubay ng Diyos
  choice: Nagkataong napunta siya
  alternative: Sa patnubay ng Diyos ay napunta siya
  rationale: Inilalarawan ng Hebreo ang pangyayari bilang waring nagkataon mula sa pananaw ng tao. Hindi tahasang binabanggit sa talata ang pagkilos ng Diyos, kaya pinananatili ng salin ang tensiyong pampanitikan sa halip na lutasin ito sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'namulot ng mga natirang uhay' upang maipaliwanag sa karaniwang mambabasa ang tiyak na gawaing לקט. Isinulat ang pangalang Elimelech bilang 'Elimelec' ayon sa mas natural na baybay-Filipino.
