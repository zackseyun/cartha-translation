base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: tl
  text: Sumagot si Boaz at sinabi sa kanya, “Lubos na naibalita sa akin ang lahat ng ginawa mo para sa iyong biyenan pagkamatay ng iyong asawa—kung paanong iniwan mo ang iyong ama at ina at ang lupaing iyong sinilangan, at pumunta ka sa isang pangkat ng mga taong hindi mo dating kilala.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “na hindi mo kilala kahapon o noong makalawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: Naiulat sa akin nang buo
  rationale: Pinananatili nito ang tinig na balintiyak at ang pagpapatindi ng infinitive absolute kasama ng finite Hophal, sa natural na modernong Tagalog.
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: ang lahat ng ginawa mo para sa iyong biyenan
  rationale: Ang “lahat” ay tumutumbas sa totalizing כֹּל, at likas sa Tagalog ang “ginawa ... para sa” upang ipahayag ang kabutihang ginawa para sa biyenan.
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: pagkamatay ng iyong asawa
  rationale: Malinaw at marangal na katumbas ng nominal na pariralang Hebreo, nang hindi nagdaragdag ng paliwanag.
- source_word: וַתַּעַזְבִי אָבִיךְ וְאִמֵּךְ
  choice: iniwan mo ang iyong ama at ina
  rationale: Pinananatili ang hiwalay na pagbanggit sa ama at ina at gumagamit ng karaniwang makabagong pandiwa.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: ang lupaing iyong sinilangan
  rationale: Malapit sa kahulugan ng lugar o lupaing pinagmulan at natural sa Tagalog.
- source_word: וַתֵּלְכִי אֶל עַם
  choice: pumunta ka sa isang bayan
  rationale: Pinananatili ang perspektiba ng pag-alis at pagpunta ni Ruth. Ang “bayan” dito ay tumutukoy sa isang pangkat ng mga tao, hindi lamang sa isang heograpikong bayan.
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: hindi mo dating kilala
  rationale: Ipinahihiwatig ng ידע ang personal na pagkakilala o pagiging pamilyar; ang “dating” ay malinaw na naglalagay nito sa panahong bago siya pumunta roon.
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: dating
  rationale: Ang idyomang literal na “kahapon o noong makalawa” ay nangangahulugang dati o noong nakaraan; inilalagay sa talababa ang literal na anyo.
