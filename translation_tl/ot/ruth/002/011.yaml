translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “biyenan” ayon sa konteksto upang tumukoy sa ina ng yumaong asawa. Ang “bayan” ay pinili para sa עַם bilang isang sambayanan o pangkat-etniko, hindi bilang modernong estadong pampolitika.
