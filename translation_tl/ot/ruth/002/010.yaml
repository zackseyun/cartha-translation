base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: tl
  text: Nagpatirapa siya at yumukod hanggang sa lupa. Sinabi niya sa kaniya, “Bakit ako nakatagpo ng lingap sa iyong paningin, kaya't pinansin mo ako[a], gayong isa akong dayuhang babae?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kinilala mo ako,” “itinuring mo ako,” o “pinahalagahan mo ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: Nagpatirapa siya
  rationale: Ipinahahayag nito sa likas na Tagalog ang pagbagsak nang padapa bilang kilos ng matinding pagpapakumbaba, nang hindi ginagawang malamya ang literal na larawan.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: at yumukod hanggang sa lupa
  rationale: Pinananatili nito ang pisikal na kilos ng malalim na pagyukod nang hindi ipinahihiwatig na pagsambang panrelihiyon ang ginawa ni Ruth.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: ako nakatagpo ng lingap sa iyong paningin
  rationale: Pinananatili ang Hebreong idyoma at ang larawang kaugnay ng paningin; ang “lingap” ay angkop sa pabor na ipinakita ni Boaz at hindi labis na teolohikal.
- source_word: לְהַכִּירֵנִי
  choice: pinansin mo ako
  rationale: Sa konteksto, tumutukoy ito sa pagkilala o pagbibigay-pansin ni Boaz kay Ruth. Ang “pinansin” ang pinakanatural na modernong Tagalog habang pinananatili sa talababa ang iba pang posibleng diwa.
- source_word: וְאָנֹכִי נָכְרִיָּה
  choice: gayong isa akong dayuhang babae
  rationale: Ipinakikita ng “gayong” ang kontras na ipinahihiwatig ng pang-ugnay, at pinananatili ng “dayuhang babae” ang pambabaeng anyo ng salitang Hebreo.
theological_decisions:
- issue: Posibleng panrelihiyong diwa ng וַתִּשְׁתַּחוּ
  choice: Isinalin bilang kilos ng malalim na paggalang kay Boaz, hindi bilang pagsamba
  alternative: Isalin sa salitang tahasang nangangahulugang “sumamba”
  rationale: Sa konteksto ng salaysay, nagpapakita si Ruth ng pagpapakumbaba at paggalang kay Boaz; walang batayan upang ipakahulugan ang kilos bilang pagsambang ukol sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong larawan ng pagkakaroon ng lingap “sa iyong paningin,” habang ginawang natural ang paglalarawan sa pagpapatirapa at ang pagpapahayag ng kontras sa pagiging dayuhan ni Ruth.
