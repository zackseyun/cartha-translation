  text: וַ/תָּ֖קָם לְ/לַקֵּ֑ט וַ/יְצַו֩ בֹּ֨עַז אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר גַּ֣ם בֵּ֧ין הָֽ/עֳמָרִ֛ים תְּלַקֵּ֖ט וְ/לֹ֥א תַכְלִימֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: tl
  text: Nang tumayo siya upang mamulot, inutusan ni Boaz ang kanyang mga binata, “Hayaan ninyo siyang mamulot kahit sa gitna ng mga bigkis[a], at huwag ninyo siyang hiyain[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pagitan ng mga bigkis.”
    reason: lexical_alternative
  - marker: b
    text: O “ipahiya.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagdudulot ng kahihiyan o pampublikong paghamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Nang tumayo siya
  rationale: Isinusulong ng waw-consecutive ang salaysay, at natural na ipinahahayag ng “Nang” ang kaugnayang temporal sa sumunod na utos ni Boaz.
- source_word: לְלַקֵּט
  choice: upang mamulot
  rationale: Ang infinitive ay nagsasaad ng layunin. Sa konteksto ng pag-aani, ang “mamulot” ay natural na tawag sa pagkuha ng mga naiwang uhay.
- source_word: וַיְצַו ... לֵאמֹר
  choice: inutusan ni Boaz ...
  rationale: May malinaw na puwersang nag-uutos ang צוה. Hindi na hiwalay na isinalin ang לֵאמֹר sapagkat sapat at mas natural sa Filipino ang tuwirang sipi pagkatapos ng pandiwang “inutusan.”
- source_word: נְעָרָיו
  choice: ang kanyang mga binata
  rationale: Pinananatili ng “mga binata” ang kahulugang kabataang lalaki at ang panlalaking reperensiya sa mga tauhan ni Boaz sa bukid.
- source_word: גַּם
  choice: kahit
  rationale: Ipinakikita ng “kahit” ang pagpapalawak ng pahintulot ni Boaz lampas sa karaniwang lugar ng pamumulot.
- source_word: בֵּין הָעֳמָרִים
  choice: sa gitna ng mga bigkis
  rationale: Ang בֵּין ay “sa pagitan/gitna,” at ang עֳמָרִים ay mga natipong bigkis ng inaning butil. Natural sa Filipino ang “sa gitna ng mga bigkis” sa ganitong tagpo.
- source_word: תְּלַקֵּט
  choice: Hayaan ninyo siyang mamulot
  rationale: Ang imperfect ay ginagamit dito bilang pahintulot na nasa anyong utos sa mga manggagawa ni Boaz.
- source_word: וְלֹא תַכְלִימוּהָ
  choice: at huwag ninyo siyang hiyain
  rationale: Ang Hiphil ng כלם ay tumutukoy sa pagdudulot ng hiya o kahihiyan; malinaw, natural, at sapat ang lakas ng “hiyain” sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “mamulot” ayon sa konteksto ng pag-aani; pinananatili ng talababa ang mas literal na puwang na ipinahihiwatig ng בֵּין at ang saklaw ng pandiwang כלם.
