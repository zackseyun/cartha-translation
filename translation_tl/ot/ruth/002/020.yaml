    rationale: Ang “magpabaya” ay karaniwang tumutukoy sa pagiging negligent o pagpapabaya sa tungkulin, hindi sa pag-iwan o hindi pagkakait ng kabutihan. Hindi rin natural ang pagkakabit nito sa “kabutihan.”
  - severity: low
