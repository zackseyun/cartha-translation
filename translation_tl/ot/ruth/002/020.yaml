base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: tl
  text: Sinabi ni Noemi sa kanyang manugang na babae[a], “Pagpalain nawa siya ni Yahweh, na hindi nagkait ng kanyang tapat na kabutihan sa mga buhay at sa mga patay.” Sinabi pa ni Noemi sa kanya, “Ang lalaking iyon ay malapit na kamag-anak natin; isa siya sa mga tagapagtubos[b] natin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Pagpalain nawa siya ni Yahweh, sapagkat hindi niya ipinagkait ang kanyang kabutihan sa mga buhay at sa mga patay,” kung ang “kanyang kabutihan” ay tumutukoy kay Boaz sa halip na kay Yahweh.'
    reason: alternative_reading
  - marker: b
    text: Ang Hebreong salita ay tumutukoy sa isang malapit na kamag-anak na may kinikilalang tungkulin o karapatang tubusin ang isang kapamilya o ari-arian ng pamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: Pagpalain nawa siya ni Yahweh
  rationale: Likas sa modernong Tagalog ang pormulang panalangin na “Pagpalain nawa,” at ipinapahayag nito ang basbas na nagmumula kay Yahweh.
- source_word: חַסְדּוֹ
  choice: kanyang tapat na kabutihan
  rationale: Pinagsasama nito ang diwa ng kabutihan at matapat na pagmamalasakit na saklaw ng חֶסֶד, nang hindi ito nililimitahan sa isang teknikal na teolohikal na kahulugan.
- source_word: לֹא עָזַב
  choice: hindi nagpabaya
  rationale: Ipinapanatili nito ang relational na diwa ng hindi pag-iwan o pagpapabaya, at natural itong iugnay sa “tapat na kabutihan” sa Tagalog.
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: sa mga buhay at sa mga patay
  rationale: Tuwirang pinananatili ang Hebreong “at” at ang kabuuang saklaw ng pahayag.
- source_word: קָרוֹב לָנוּ
  choice: malapit nating kamag-anak
  rationale: Malinaw na ipinahihiwatig ang lapit sa pagkakamag-anak, hindi lapit sa lugar.
- source_word: מִגֹּאֲלֵנוּ
  choice: isa sa mga tagapagtubos natin
  rationale: Isinasalin ang gampaning pampamilya at legal ng גאל habang iniiwasan ang hindi likas na tambalang katawagan sa pangunahing teksto.
theological_decisions:
- issue: Ang tinutukoy ng mga panghalip sa sugnay ng pagpapala
  choice: Si Boaz ang ipinapanalangin ni Noemi na pagpalain, at ang “kanyang tapat na kabutihan” ay tumutukoy kay Yahweh.
  alternative: Maaaring tumukoy kay Boaz ang “kanyang tapat na kabutihan,” kaya ang diwa ay hindi niya ipinagkait ang kabutihan sa mga buhay at mga patay.
  rationale: Si Boaz ang likas na tinutukoy ng “siya” ayon sa agarang konteksto, samantalang maaaring iugnay ang kasunod na sugnay kay Yahweh bilang pinakamalapit na antecedent. Dahil tunay na malabo ang Hebreo, inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Yahweh” bilang pantanging pangalan at ang “tagapagtubos” bilang malinaw na salin ng legal-pampamilyang katawagan. Inilagay ang marker [b] pagkatapos ng buong pahayag na nangangailangan ng paliwanag.
