  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “anak ko” bilang likas na katawagang mapagmahal at ang “gambalain” upang mapanatili ang negatibong pahiwatig at bahagyang kalabuan ng פגע sa konteksto.
