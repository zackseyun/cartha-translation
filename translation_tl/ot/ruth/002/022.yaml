base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: tl
  text: At sinabi ni Naomi kay Ruth na kaniyang manugang, “Mabuti, anak ko, na sumama ka sa kaniyang mga dalaga, upang hindi ka gambalain ng iba sa ibang bukid.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa salaysay na Tagalog ang “At sinabi” habang pinananatili ang pagkakasunod-sunod.
- source_word: כַּלָּתָהּ
  choice: na kanyang manugang
  rationale: Tuwirang ipinahahayag ang ugnayan ni Ruth kay Naomi; sapat at likas sa Tagalog ang “manugang” sa konteksto.
- source_word: טוֹב
  choice: Mabuti
  rationale: Pinananatili ang payak na positibong pagtataya ni Naomi nang hindi ginagawang superlatibong “pinakamabuti.”
- source_word: בִּתִּי
  choice: anak ko
  rationale: Likas na katawagan ng pagmamahal at ugnayang pampamilya sa modernong Tagalog, hindi pahayag na literal niyang anak si Ruth.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng itinuturing ni Naomi na mabuti.
- source_word: תֵצְאִי עִם
  choice: sumama ka sa
  rationale: Bagaman literal na “lumabas ka kasama,” mas natural sa Tagalog ang “sumama ka sa” at malinaw nitong ipinapahayag ang pakikisama ni Ruth sa pangkat.
- source_word: נַעֲרוֹתָיו
  choice: kanyang mga dalaga
  rationale: Tumutukoy sa mga kabataang babaeng kasama o manggagawa ni Boaz; ang “mga dalaga” ay maikli, natural, at hindi labis na nagtatakda ng katayuang alipin o utusan.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: upang hindi ka nila gambalain
  rationale: Maaaring mangahulugan ang פגע ng pagsalubong o engkuwentrong nakapipinsala. Sa konteksto ng pag-iingat kay Ruth, ipinahihiwatig ng “gambalain” ang panganib nang hindi tiyak na ginagawang pisikal na pananakit o seksuwal na pag-atake.
- source_word: בְּשָׂדֶה אַחֵר
  choice: sa ibang bukid
  rationale: Tuwiran at natural na salin ng pariralang panlunan.
