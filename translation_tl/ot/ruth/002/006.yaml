base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: tl
  text: Sumagot ang binatang namamahala sa mga tagapag-ani, “Isa siyang kabataang babaeng Moabita na bumalik kasama ni Naomi mula sa mga bukirin ng Moab.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa bukirin ng Moab”; ang isahang salitang Hebreo ay maaaring tumukoy nang kolektibo sa mga bukirin o lupang pansakahan ng Moab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Sumagot
  rationale: Ang magkapares na Hebreong pormulang ‘sumagot at nagsabi’ ay likas na naihahatid sa modernong Tagalog sa pamamagitan ng ‘Sumagot,’ nang hindi binabago ang tungkulin nito bilang pambungad sa tuwirang sinabi.
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Tumutukoy ang נַעַר sa isang kabataang lalaki; ang tungkulin niya ay hiwalay na ipinahahayag ng kasunod na parirala, kaya hindi ito isinaling agad na ‘tagapangasiwa’ o ‘utusan.’
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: namamahala sa mga tagapag-ani
  rationale: Sa kontekstong ito, ipinahihiwatig ng נצב na may עַל ang nakatalagang pangangasiwa. Natural at malinaw sa Tagalog ang ‘namamahala’ habang pinananatili ang ugnayan ng awtoridad.
- source_word: הַקּוֹצְרִים
  choice: mga tagapag-ani
  rationale: Tuwirang tumutukoy ang participle ng קצר sa mga taong umaani ng butil.
- source_word: נַעֲרָה מוֹאֲבִיָּה
  choice: dalagang Moabita
  rationale: Ipinahahayag ng ‘dalaga’ ang isang kabataang babae sa natural at dignified na Tagalog, at pinananatili ng ‘Moabita’ ang tahasang katawagang etniko o pambansa.
- source_word: הִיא
  choice: Siya ang
  rationale: Ang malayang panghalip ay bahagi ng isang pahayag na nagpapakilala; natural sa Tagalog ang konstruksyong ‘Siya ang ...’.
- source_word: הַשָּׁבָה
  choice: na bumalik
  rationale: Pinananatili ng ‘bumalik’ ang pangunahing kahulugan ng שוב at ang motif ng pagbabalik sa salaysay, kahit si Ruth ay hindi tubong Juda.
- source_word: עִם נָעֳמִי
  choice: na kasama ni Naomi
  rationale: Payak at natural na pagpapahayag ito ng pagsama kay Naomi.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: mula sa lupain ng Moab
  rationale: Maaaring kolektibo o panrehiyon ang isahang שְׂדֵה. Ang ‘lupain’ ay natural sa Tagalog at naihahatid ang teritoryo o bukiring rehiyon nang sapilitang gawing maramihan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘binata,’ ‘dalaga,’ at ‘tagapag-ani’ bilang pangkaraniwang salitang hindi arkaiko. Pinaikli ang Hebreong idyomang ‘sumagot at nagsabi’ sa natural na ‘Sumagot.’
