  text: וַ/תֹּ֗אמֶר אֲלַקֳטָה נָּא֙ וְ/אָסַפְתִּ֣י בָֽ/עֳמָרִ֔ים אַחֲרֵ֖י הַ/קּוֹצְרִ֑ים וַ/תָּב֣וֹא וַֽ/תַּעֲמ֗וֹד מֵ/אָ֤ז הַ/בֹּ֨קֶר֙ וְ/עַד עַ֔תָּה זֶ֛ה שִׁבְתָּ֥/הּ הַ/בַּ֖יִת מְעָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: tl
  text: Sinabi niya,[a] ‘Maaari po ba akong mamulot at magtipon sa gitna ng mga bigkis, kasunod ng mga manggagapas?’ Kaya dumating siya at nanatili mula pa umaga hanggang ngayon; sandali lamang siyang naupo sa bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sandali lamang siyang nagpahinga sa silungan.” Mahirap unawain ang Hebreo sa huling sugnay; ang “bahay” ay maaaring tumukoy sa silungan ng mga manggagawa sa bukid.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה נָּא
  choice: Pahintulutan ninyo akong mamulot
  rationale: Ang cohortative na may נָּא ay isang magalang na pakiusap. Likas sa modernong Tagalog ang pormang ito, at ang “mamulot” ay malinaw sa konteksto ng pagkuha ng mga naiwang uhay.
- source_word: וְאָסַפְתִּי
  choice: at magtipon
  rationale: 'Pinananatili nito ang pagkakaiba sa לקט: ang una ay pamumulot, samantalang ang אסף ay pagtitipon ng napulot.'
- source_word: בָעֳמָרִים
  choice: sa gitna ng mga bigkis
  rationale: Ang עֳמָרִים ay mga nakataling bungkos ng inaning tangkay. Ang “mga bigkis” ay maikli, tumpak, at angkop sa tagpong agrikultural.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: kasunod ng mga manggagapas
  rationale: 'Ipinahahayag nito ang pangunahing lokatibong diwa: namumulot si Ruth sa likuran o kasunod ng mga manggagapas.'
- source_word: וַתָּבֹא וַתַּעֲמוֹד
  choice: Kaya pumarito siya at nanatili
  rationale: Bagaman literal na “dumating at tumayo,” ipinahihiwatig ng kasunod na pariralang pangpanahon ang patuloy niyang pananatili at paggawa. Ang “pumarito” ay angkop sa pananaw ng katiwala na nagsasalita sa bukid.
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: mula umaga hanggang ngayon
  rationale: Natural at tuwirang ipinapahayag ang tagal mula sa umaga hanggang sa oras ng pag-uulat.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: saglit lamang siyang naupo sa silungan
  rationale: Mahirap at siksik ang Hebreong sugnay. Ipinapakita ng salin ang malamang na diwa na kaunti lamang ang kaniyang pamamahinga; sa konteksto ng bukid, maaaring tumukoy ang הַבַּיִת sa silungan ng mga manggagawa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamulot” sa halip na teknikal o di-pamilyar na katawagan, habang pinananatili sa talababa ang tunay na kahirapan at posibilidad ng ibang pagbasa sa huling sugnay.
