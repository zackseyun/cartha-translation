base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: tl
  text: Manatili kang nakatingin sa bukid na ginagapas nila, at sumunod ka sa likuran nila. Hindi ba’t inutusan ko ang mga binata na huwag kang hipuin?[a] Kapag nauhaw ka, pumunta ka sa mga banga at uminom ng tubig na sinalok ng mga binata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, ayon sa konteksto, “huwag kang pagbuhatan ng kamay.” Literal na “huwag kang hipuin” ang Hebreo; maaaring kabilang dito ang pag-iingat laban sa panliligalig o pananakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ בַּשָּׂדֶה
  choice: Manatili kang nakatingin sa bukid
  rationale: Ang literal na “ang iyong mga mata ay nasa bukid” ay may ipinahihiwatig na utos. Ipinapahayag ng salin ang patuloy na pagbabantay sa likas na modernong Tagalog.
- source_word: אֲשֶׁר יִקְצֹרוּן
  choice: na ginagapas nila
  rationale: Tinutukoy ng sugnay ang bukid ayon sa kasalukuyang gawain ng mga manggagapas; pinananatili ng “ginagapas” ang larawang agrikultural.
- source_word: וְהָלַכְתְּ אַחֲרֵיהֶן
  choice: at sumunod ka sa likuran nila
  rationale: Pinananatili nito ang kilos ng pagsunod at ang ugnayang panlunan ng אַחֲרֵי. Ang hulaping pambabaeng maramihan ay hindi tahasang pinalawak sa pangunahing teksto upang hindi magdagdag nang higit sa anyo ng Hebreo.
- source_word: הֲלוֹא צִוִּיתִי
  choice: Hindi ba't inutusan ko
  rationale: Pinananatili ang anyo ng retorikal na tanong at ang awtoridad ng utos ni Boaz sa natural na Tagalog.
- source_word: הַנְּעָרִים
  choice: mga binata
  rationale: Tumutukoy ito rito sa mga lalaking kabataang manggagawa ni Boaz at pinananatili ang pagkakaiba nila sa naunang pangkat na pambabae.
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: na huwag kang galawin
  rationale: Pinananatili ang pangunahing kahulugan ng נגע na “humipo o gumalaw,” habang ang posibleng diwa ng pananakit o panliligalig ay inilalagay sa talababa.
- source_word: וְצָמִת
  choice: Kapag nauhaw ka
  rationale: Likas na ipinahahayag sa Tagalog ang inaasahang kalagayan o pagkakataon.
- source_word: הַכֵּלִים
  choice: mga banga
  rationale: Bagaman malawak ang kahulugan ng salita bilang mga sisidlan, ang “mga banga” ay angkop at kongkreto sa konteksto ng inuming sinalok.
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים
  choice: at uminom ng sinalok ng mga binata
  rationale: Malinaw sa konteksto na ang tinutukoy ay inuming sinalok; iniiwasan ang mabigat na literalismong “uminom mula sa anumang sasalukin.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang karaniwang anyong “Hindi ba't” para sa retorikal na tanong at iniwasan ang labis na pormal o makalumang bokabularyo.
