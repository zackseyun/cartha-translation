revisions:
- from: Manatili kang nakatingin sa bukid na ginagapas nila, at sumunod ka sa likuran nila. Hindi ba't inutusan ko ang mga binata na huwag kang galawin?[a] Kapag nauhaw ka, pumunta ka sa mga banga at uminom ng sinalok ng mga binata.
  to: Manatili kang nakatingin sa bukid na ginagapas nila, at sumunod ka sa likuran nila. Hindi ba’t inutusan ko ang mga binata na huwag kang hipuin?[a] Kapag nauhaw ka, pumunta ka sa mga banga at uminom ng tubig na sinalok ng mga binata.
  rationale: Pinalitan ang “galawin” ng “hipuin” upang mas tapat na maipakita ang literal na pandiwa sa Hebreo at inayos ang talababa nang hindi pinipilit ang isang tiyak na uri ng banta. Nilinaw ang bagay na iniinom bilang “tubig,” na malinaw na ipinahihiwatig ng konteksto at ng pandiwang ‘sumalok.’
