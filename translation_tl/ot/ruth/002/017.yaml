revisions:
- from: Kaya namulot siya ng mga natirang uhay sa bukid hanggang gabi. Pagkatapos, pinalo niya ang kanyang napulot, at ang nakuha niyang sebada ay halos isang efa[a].
  to: Kaya namulot siya ng mga naiwang uhay sa bukid hanggang dapithapon. Pagkatapos, binayo niya ang mga napulot niya, at ito ay humigit-kumulang isang efa ng sebada[a].
  rationale: Pinalitan ang “halos” ng “humigit-kumulang” upang tumpak na maipahayag ang pagtatantiyang nasa כְּאֵיפָה. Pinalitan din ang “pinalo” ng “binayo” upang mas malinaw ang gawaing paghihiwalay ng butil, nang hindi nagdaragdag ng detalyeng wala sa teksto. Ang “dapithapon” ay angkop na katumbas ng ‘evening’ sa saklaw ng paggawa sa bukid.
