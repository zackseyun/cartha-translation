translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ipinaliwanag sa mismong teksto ang teknikal na diwa ng pamumulot ng mga naiwang uhay, ngunit pinanatili ang sinaunang yunit na “efa” at ipinaliwanag ito sa talababa.
