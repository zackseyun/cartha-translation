  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: tl
  text: Kaya namulot siya ng mga naiwang uhay sa bukid hanggang dapithapon. Pagkatapos, binayo niya ang mga napulot niya, at ito ay humigit-kumulang isang efa ng sebada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang efa ay isang sinaunang panukat ng tuyong bagay, na humigit-kumulang 20–22 litro.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: Kaya namulot siya ng mga natirang uhay
  rationale: Ang לקט ay tumutukoy sa pamumulot ng mga naiwang uhay matapos ang pag-aani. Nilinaw ng “mga natirang uhay” ang sinaunang gawaing ito para sa makabagong mambabasa, habang ang “Kaya” ay maayos na nag-uugnay sa naunang salaysay.
- source_word: בַּשָּׂדֶה
  choice: sa bukid
  rationale: Karaniwan at natural na katumbas ng שׂדה sa kontekstong agrikultural ang “bukid.”
- source_word: עַד הָעָרֶב
  choice: hanggang gabi
  rationale: Tuwirang ipinapahayag nito ang tagal ng kanyang paggawa at natural ito sa modernong Tagalog.
- source_word: וַתַּחְבֹּט
  choice: pinalo niya
  rationale: Ang חבט ay ang pagpalo sa mga napulot na uhay upang maihiwalay ang butil. Pinananatili ng salin ang konkretong paraan ng paggawa sa halip na gumamit ng mas malawak na terminong “giniik.”
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: ang kanyang napulot
  rationale: Natural at maikli itong tumutukoy sa mga uhay na pinulot niya, nang hindi nagdaragdag ng detalyeng wala sa Hebreo.
- source_word: וַיְהִי כְּאֵיפָה
  choice: ang nakuha niyang sebada ay halos isang efa
  rationale: Ipinapakita ng “halos” ang pagtatantiyang dala ng prefiks na כְּ, at pinananatili ang sinaunang yunit na “efa” para sa katumpakang pangkasaysayan.
- source_word: שְׂעֹרִים
  choice: sebada
  rationale: Ang “sebada” ang karaniwang makabagong salin ng barley at malinaw na tumutukoy sa uri ng butil na nakuha ni Ruth.
