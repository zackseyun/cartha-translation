  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang pagkakasunod ng mga kilos at ang mga pangunahing diwa ng Hebreo. Gayunman, ang “itinira niya” ay maaaring magpahiwatig na sadyang nagtabi si Ruth ng pagkain, samantalang ang הוֹתִירָה ay ligtas ding isalin bilang kung ano ang natira sa kaniya. Mas maingat ang rebisyong iyon upang huwag magdagdag ng intensiyon.
  naturalness: Makabago at malinaw ang daloy. Mas likas ang “Binuhat niya ito” kaysa “Binuhat niya ang mga iyon,” dahil hindi tahasang tinutukoy ng Hebreo ang maramihang bagay sa talatang ito. Mas malinaw rin ang “ibinigay sa kaniyang biyenan” kaysa sa datibong “ibinigay dito.”
  terminology: Ang “bayan,” “biyenan,” at “napulot” ay angkop. Ang “napulot” ay hindi tahasang teknikal na katumbas ng “magpulot ng naiwan sa anihan,” ngunit sapat ito sa natural na Filipino at hindi binabago ang kahulugan sa konteksto.
