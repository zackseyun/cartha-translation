  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: tl
  text: Binuhat niya ito at pumasok sa bayan.[a] Nakita ng kaniyang biyenan ang napulot niya. Pagkatapos, inilabas niya at ibinigay sa kaniyang biyenan ang natira sa kaniya matapos siyang mabusog.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lungsod.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa kaniyang pagkabusog.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: Binuhat niya ang mga iyon
  rationale: Ang נׂשא ay nangangahulugang ‘buhatin’ o ‘dalhin.’ Tumutukoy ito sa mga butil na napulot ni Ruth, kaya natural ang maramihang ‘mga iyon’ sa Filipino.
- source_word: הָעִיר
  choice: bayan
  rationale: Maaaring tumukoy ang עִיר sa lungsod o bayan. Mas natural ang ‘bayan’ para sa Bethlehem sa kontekstong ito, habang inilalagay sa talababa ang ‘lungsod’ bilang leksikal na alternatibo.
- source_word: חֲמוֹתָהּ
  choice: kaniyang biyenan
  rationale: Karaniwang katawagan ito sa ina ng asawa; malinaw sa salaysay na si Noemi ang tinutukoy.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: ang napulot niya
  rationale: Ang לקט ay teknikal na tumutukoy sa pamumulot ng naiwan sa pag-aani. Sa Filipino, malinaw at natural ang ‘napulot’ sa konteksto ng bukid.
- source_word: וַתּוֹצֵא
  choice: inilabas niya
  rationale: Ang Hiphil ng יצא ay ‘ilabas.’ Ipinakikita nitong inilabas ni Ruth ang pagkaing itinabi niya.
- source_word: וַתִּתֶּן לָהּ
  choice: ibinigay dito
  rationale: Ang ‘dito’ ay natural na tumutukoy sa malapit nang binanggit na biyenan at iniiwasan ang malabong sunod-sunod na panghalip.
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: ang itinira niya
  rationale: Ang יתר sa anyong ito ay nangangahulugang mag-iwan ng natira. Ipinahihiwatig ng konteksto na sadyang itinabi ni Ruth ang bahagi ng kaniyang pagkain.
- source_word: מִשָּׂבְעָהּ
  choice: matapos siyang mabusog
  rationale: Ipinahihiwatig ng מִן kasama ng שׂבע ang kalagayan o panahong kasunod ng pagkabusog. Ito ang pinakanatural na pagpapahayag sa Filipino nang hindi dinaragdagan ang diwa.
