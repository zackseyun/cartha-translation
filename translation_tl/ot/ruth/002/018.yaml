translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mabilis na daloy ng magkakasunod na kilos sa Hebreo, ngunit hinati sa maiikling pangungusap para sa likas na pagbasa. Ginamit ang ‘bayan’ kaysa ‘lungsod’ bilang mas karaniwang paglalarawan sa Bethlehem, nang hindi itinatago ang alternatibo.
