    issue: “ang itinira niya”
    rationale: Maaari nitong ipahiwatig ang kusang pagtatabi o sinadyang pag-iwan. Ang teksto ay nagsasaad lamang ng natira matapos siyang mabusog; dapat panatilihin ang ganitong antas ng kahulugan.
  - severity: low
    issue: “ibinigay dito”
    rationale: Bagaman nauunawaan, mas malinaw at mas karaniwang modernong Filipino ang tahasang “ibinigay sa kaniyang biyenan.”
