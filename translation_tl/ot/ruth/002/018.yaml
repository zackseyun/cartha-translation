  to: Binuhat niya ito at pumasok sa bayan.[a] Nakita ng kaniyang biyenan ang napulot niya. Pagkatapos, inilabas niya at ibinigay sa kaniyang biyenan ang natira sa kaniya matapos siyang mabusog.[b]
