id: RUT.2.4
reference: Ruth 2:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִנֵּה בֹ֗עַז בָּ֚א מִ/בֵּ֣ית לֶ֔חֶם וַ/יֹּ֥אמֶר לַ/קּוֹצְרִ֖ים יְהוָ֣ה עִמָּ/כֶ֑ם וַ/יֹּ֥אמְרוּ ל֖/וֹ יְבָרֶכְ/ךָ֥ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/004.yaml
  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: tl
  text: At narito[a], dumating si Boaz mula sa Betlehem at sinabi sa mga manggagapas, “Sumainyo nawa si Yahweh.” Sumagot sila sa kanya, “Pagpalain ka nawa ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “narito” ay tumutumbas sa Hebreong panandang tumatawag ng pansin at masiglang nagpapakilala sa pagdating ni Boaz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang masigla at pansin-tawag na gamit ng Hebreong panandang pasalaysay, sa isang pormal ngunit nauunawaang ekspresyon sa makabagong Tagalog.
- source_word: בֹעַז
  choice: Boaz
  rationale: Karaniwang transliterasyon ng pangalang pantangi sa Filipino.
- source_word: בָּא
  choice: dumating
  rationale: Likas sa Tagalog ang “dumating” para sa pagdating ni Boaz sa pinangyayarihan; malinaw nitong ipinahihiwatig ang simpleng kilos ng בוא.
- source_word: מִבֵּית לֶחֶם
  choice: mula sa Betlehem
  rationale: Tuwirang isinasalin ang pang-ukol na מִן bilang “mula sa,” at ginagamit ang karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: לַקֹּצְרִים
  choice: sa mga manggagapas
  rationale: Tumpak at likas na katawagan sa mga taong gumagapas ng ani; pinananatili ang agrikultural na tagpo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: עִמָּכֶם
  choice: Sumainyo nawa
  rationale: Ang literal na sugnay na “Yahweh [ay] kasama ninyo” ay gumaganap bilang pagbati o pagpapala. Ang “Sumainyo nawa” ay natural na Filipino at pinananatili ang hangaring ipinahihiwatig ng konteksto.
- source_word: יְבָרֶכְךָ
  choice: Pagpalain ka nawa
  rationale: Ipinahahayag ng anyong Hebreo ang isang hangarin o pagpapala; malinaw itong naipapakita ng “nawa” sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulo.
- issue: Lakas ng pagbating יְהוָה עִמָּכֶם
  choice: Sumainyo nawa si Yahweh
  alternative: Kasama ninyo si Yahweh
  rationale: Maaaring literal na basahin ang walang-pandiwang sugnay bilang isang pahayag, ngunit sa palitan ng pagbati rito ay mas malamang na pagpapala o hangarin ang gamit. Isinasalin ang pragmatikong bisa nang hindi ginagawang mas tiyak kaysa kailangan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “manggagapas” upang mapanatili ang sinaunang tagpong agrikultural, at ang “nawa” upang natural na maipahayag ang dalawang pagbabasbas. Ang panghalip sa “Sumainyo” ay maramihan, gaya ng Hebreo.
