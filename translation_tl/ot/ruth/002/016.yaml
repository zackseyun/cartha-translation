  - marker: b
    text: O “upang mamulot siya.” Ang pandiwang Hebreo ay ang karaniwang termino para sa pamumulot ng naiwang ani sa bukid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: At ... din
  rationale: Pinananatili nito ang pang-ugnay at ang dagdag na tagubilin ni Boaz sa naunang utos.
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: sadyang magbunot kayo
  rationale: Ipinahahayag ng “sadyang” ang diin ng infinitive absolute at ang kusang pag-aalis ng mga tangkay, hindi ang di-sinasadyang pagkalaglag ng mga ito.
- source_word: לָהּ
  choice: para sa kanya
  rationale: Ipinakikita ng parirala na ginagawa ito para sa kapakinabangan ni Ruth.
- source_word: מִן הַצְּבָתִים
  choice: mula sa mga bigkis
  rationale: Ang צְבָתִים ay mga natipon at tinaling kumpol ng mga tangkay; natural at tiyak sa konteksto ng pag-aani ang “mga bigkis.”
- source_word: וַעֲזַבְתֶּם
  choice: at iwan ninyo ang mga iyon
  rationale: Tumutukoy ito sa mga binunot na tangkay na iiwan upang mapulot ni Ruth.
- source_word: וְלִקְּטָה
  choice: upang mapulot niya
  rationale: Ang לקט ay karaniwang pandiwa para sa pamumulot ng naiwang ani. Malinaw at natural sa modernong Tagalog ang “mapulot niya,” habang ipinapaliwanag sa talababa ang natatanging konteksto nito.
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: Huwag ninyo siyang sawayin
  rationale: Ang “sawayin” ay nagpapahayag ng mariing pagsita o pagpigil nang hindi nagiging labis na kolokyal.
