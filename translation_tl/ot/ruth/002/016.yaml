  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: tl
  text: At sadyang magbunot din kayo mula sa mga bigkis[a] para sa kanya, at iwan ninyo ang mga nabunot upang pulutin niya[b]; huwag ninyo siyang sawayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bungkos ng uhay.” Ang salitang Hebreo ay tumutukoy sa natipong mga kumpol ng mga tangkay.
