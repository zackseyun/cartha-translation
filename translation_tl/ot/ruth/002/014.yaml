revisions:
- from: Nang oras na ng pagkain, sinabi ni Boaz sa kanya, “Lumapit ka rito at kumain ka ng tinapay. Isawsaw mo ang piraso mo sa maasim na alak.[a]” Kaya umupo siya sa tabi ng mga tagapag-ani, at inabutan siya ni Boaz ng inihaw na butil. Kumain siya hanggang mabusog, at may natira pa.
  to: Nang oras ng pagkain, sinabi ni Boaz sa kanya, “Lumapit ka rito at kumain ka ng tinapay. Isawsaw mo ang iyong subo sa maasim na alak.[a]” Kaya umupo siya sa tabi ng mga tagapag-ani, at inabutan siya ni Boaz ng inihaw na butil. Kumain siya hanggang mabusog, at may natira pa siyang pagkain.
  rationale: Inayos ang dalawang pahayag upang maging mas likas sa modernong Filipino at nilinaw ang natirang pagkain. Pinanatili ang pagkakaiba ng ‘maasim na alak’ at ‘suka’ sa talababang leksikal, gayundin ang saklaw na di-ganap na tiyak ng פִּתֵּךְ sa pamamagitan ng ‘iyong subo.’
