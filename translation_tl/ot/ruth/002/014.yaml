base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: tl
  text: Nang oras ng pagkain, sinabi ni Boaz sa kanya, “Lumapit ka rito at kumain ka ng tinapay. Isawsaw mo ang iyong subo sa maasim na alak.[a]” Kaya umupo siya sa tabi ng mga tagapag-ani, at inabutan siya ni Boaz ng inihaw na butil. Kumain siya hanggang mabusog, at may natira pa siyang pagkain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa suka.” Ang salitang Hebreo na חֹמֶץ ay maaaring tumukoy sa suka o sa maasim na inuming alak; sa kontekstong ito ng pagkain ng mga manggagawa sa bukid, malamang na maasim na alak ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: Nang oras na ng pagkain
  rationale: Natural na pagpapahayag sa modernong Tagalog ng panahong itinakda para kumain, habang pinananatili ang temporal na diwa ng Hebreo.
- source_word: גֹּשִׁי הֲלֹם
  choice: Lumapit ka rito
  rationale: Tuwirang ipinahahayag ang utos na pisikal na lumapit; mas tiyak ito kaysa simpleng “halika” at natural pa rin sa Tagalog.
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: kumain ka ng tinapay
  rationale: Ang partitive na gamit ng מִן ay likas na naipahihiwatig sa Tagalog nang hindi kailangang idagdag ang “kaunti.”
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: Isawsaw mo ang piraso mo sa maasim na alak
  rationale: Ang פַּת ay piraso o subo, na sa konteksto ay malamang na tinapay; pinananatili ng “piraso” ang bahagyang kalabuan. Ang חֹמֶץ ay maaaring suka o maasim na inuming alak, at ang huli ay malamang sa pagkain ng mga manggagawa.
- source_word: מִצַּד הַקּוֹצְרִים
  choice: sa tabi ng mga tagapag-ani
  rationale: Malinaw at natural na katumbas ng posisyong nasa gilid o katabi ng mga umaani.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: inabutan siya ni Boaz ng inihaw na butil
  rationale: Ang pambihirang pandiwa ay tumutukoy sa pag-abot o pagbibigay ng pagkain. Ginawang tahasan ang pangalang Boaz upang maiwasan ang malabong reperensiya ng panghalip sa Tagalog. Ang קָלִי ay butil na inihaw o binusa.
- source_word: וַתִּשְׂבַּע
  choice: hanggang mabusog
  rationale: Natural na Tagalog para sa pagkain hanggang maging ganap na sapat o busog.
- source_word: וַתֹּתַר
  choice: may natira pa
  rationale: Pinananatili ang diwang may sobrang pagkain matapos siyang mabusog, nang hindi labis na tinutukoy kung itinabi niya ito o basta hindi naubos.
