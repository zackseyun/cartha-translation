translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa salaysay. Ginamit ang karaniwang “tagapag-ani” at ang madaling maunawaang “inihaw na butil”; iniwasan ang makaluma o labis na teknikal na pananalita.
