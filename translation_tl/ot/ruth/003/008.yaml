  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: tl
  text: Pagsapit ng hatinggabi, nanginig ang lalaki at pumihit[a]; at naroon ang isang babaeng nakahiga sa paanan niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bihira ang pandiwang Hebreo at hindi tiyak ang eksaktong kilos; maaari itong magpahiwatig na siya ay gumalaw, pumilipit, o yumuko dahil sa pagkabigla.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “sa paanan niya”; maaari ring tumukoy ang pananalitang Hebreo sa lugar sa may mga paa o ibabang bahagi ng mga binti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Isinama sa likas na Tagalog na panandang pasalaysay at temporal; iniiwasan ang mabigat at di-likas na literal na ‘at nangyari.’
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: maghahatinggabi
  rationale: Likas at maikling katumbas sa Tagalog ng ‘kalagitnaan ng gabi/midnight.’
- source_word: וַיֶּחֱרַד
  choice: nanginig
  rationale: Pinananatili ang pisikal na reaksiyong saklaw ng חרד nang hindi tiyakang ipinapalagay kung takot, gulat, o ibang pagkabigla ang dahilan.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Tuwirang tumutukoy kay Boaz bilang lalaking nasa tagpo; hindi nito ipinapasok ang kahulugang ‘asawa.’
- source_word: וַיִּלָּפֵת
  choice: napihit
  rationale: Maingat na inilalarawan ang biglaang paggalaw ng katawan. Dahil bihira at di-tiyak ang pandiwang Hebreo, inilalagay sa talababa ang iba pang posibleng kilos.
- source_word: וְהִנֵּה
  choice: At naroon ... !
  rationale: Ipinahahayag ng ayos at tandang padamdam ang biglaang pagkatuklas at pagkagulat na dala ng הִנֵּה, sa natural na makabagong Tagalog.
- source_word: אִשָּׁה
  choice: isang babae
  rationale: Payak na kahulugan sa konteksto; ang ‘asawa’ ay hindi angkop rito.
- source_word: שֹׁכֶבֶת
  choice: nakahiga
  rationale: Ipinakikita ang nagpapatuloy na kalagayan o posisyon ng babae nang matuklasan siya.
- source_word: מַרְגְּלֹתָיו
  choice: sa paanan niya
  rationale: Natural na Tagalog para sa lokasyon sa may mga paa, habang ang mas malawak na maaaring saklaw nito ay nililinaw sa talababa.
theological_decisions:
- issue: Posibleng seksuwal o eupemistikong pagbasa sa tagpo
  choice: Tuwirang isinalin na nakahiga ang babae sa paanan ni Boaz.
  alternative: Gumamit ng mas malabong ‘sa may mga paa o ibabang bahagi ng mga binti niya’ upang idiin ang posibleng pahiwatig.
  rationale: Walang tahasang sinasabi ang Hebreo na nagkaroon ng seksuwal na kilos. Pinananatili ng tuwirang salin ang tensiyon ng salaysay nang hindi nagdaragdag ng moral o teolohikal na pasiya; ang lawak ng kahulugan ng lokasyon ay binabanggit lamang sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘maghahatinggabi’ at ‘paanan’ bilang mga likas na anyo, at iniwasan ang arkaikong pormula. Ang tandang padamdam ay naghahatid ng biglaang pagkatuklas na ipinahihiwatig ng וְהִנֵּה.
