base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/017.yaml
  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: tl
  text: Sinabi niya, “Ibinigay niya sa akin ang anim na sukat ng sebada na ito[a], sapagkat sinabi niya, ‘Huwag kang umuwi sa iyong biyenan nang walang dala.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang anim na sebada na ito.” Hindi tinukoy ang yunit ng sukat; idinagdag ang “sukat” para sa kalinawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sinabi niya
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay at nagpapakilala sa iniulat ni Ruth; likas sa modernong Tagalog na hindi na isama ang panimulang pang-ugnay.
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: ang anim na takal na sebada na ito
  rationale: Tiyak ang bilang at ang sebada, ngunit hindi binanggit sa Hebreo ang yunit. Ipinahihiwatig ng konteksto ang anim na dami o sukat; ginamit ang “takal” para sa malinaw at likas na Tagalog, habang ipinaliliwanag sa talababa na hindi espesipiko ang orihinal.
- source_word: נָתַן לִי
  choice: Ibinigay niya sa akin
  rationale: Ang Qal perfect na may unang panauhang layon ay natural na isinasalin bilang natapos na kilos.
- source_word: כִּי אָמַר
  choice: sapagkat sinabi niya
  rationale: Ipinakikilala ng כִּי ang dahilan ng regalo at ng naunang pahayag.
- source_word: אַל תָּבוֹאִי
  choice: Huwag kang umuwi
  rationale: Ang negatibong anyong para sa ikalawang panauhang babae ay utos o mariing tagubilin. Sa konteksto ng pagbabalik ni Ruth kay Naomi, mas likas ang “umuwi” kaysa literal na “pumaroon” o “dumating.”
- source_word: רֵיקָם
  choice: nang walang dala
  rationale: Ang adberbio ay nangangahulugang umalis o bumalik na walang anumang dala; malinaw at idiomatiko ito sa Tagalog.
- source_word: אֶל חֲמוֹתֵךְ
  choice: sa iyong biyenan
  rationale: Ang חֲמוֹת ay tumutukoy sa biyenang babae. Hindi kailangang idagdag ang “na babae” dahil malinaw sa konteksto na si Naomi ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang pananalita at ang demonstratibong “na ito.” Ginamit ang “takal” bilang di-tiyak na katawagan sa dami, hindi bilang pangalan ng isang tiyak na sinaunang yunit.
