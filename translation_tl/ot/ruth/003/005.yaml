  text: And she said to her[a], “All that you say, I will do.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Gagawin ko ang lahat ng sasabihin mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sinabi niya
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay. Likas at tuwiran sa makabagong Filipino ang “Sinabi niya.”
- source_word: אֵלֶיהָ
  choice: sa kanya
  rationale: Ang אֶל na may hulaping ikatlong panauhang pambabae ay tumutukoy sa taong pinagsabihan. Tumpak at natural ang “sa kanya” nang hindi nagdaragdag ng pangalang wala sa Hebreo.
- source_word: כֹּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Ipinahahayag ng parirala ang kabuuan na sinusundan ng sugnay na panuring. Pinananatili ng “ang lahat ng” ang saklaw at ayos ng diwa sa natural na Filipino.
- source_word: תֹּאמְרִי
  choice: sasabihin mo
  rationale: Ang Qal imperfect na ikalawang panauhang pambabae ay tumutukoy sa tagubiling ibibigay ni Naomi. Ang “sasabihin mo” ay likas sa Filipino at hindi nagdaragdag ng layong hindi tahasang nasa Hebreo.
- source_word: אֶעֱשֶׂה
  choice: gagawin ko
  rationale: Ang Qal imperfect na unang panauhan ay nagpapahayag ng matibay na pasiya o layunin. Tuwirang tinutumbasan ito ng “gagawin ko.”
