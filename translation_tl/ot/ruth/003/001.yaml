  to: Pagkatapos, sinabi ni Noemi, na biyenan ni Ruth, sa kanya, “Anak ko, hindi ba dapat kitang hanapan ng isang pahingahan[a] na makabubuti sa iyo?”
  rationale: Inayos ang pagtukoy kay Noemi bilang biyenan ni Ruth at ang ayos ng pangungusap. Pinasimple ang “pahingahang lugar” bilang “pahingahan,” at ginawang “na makabubuti sa iyo” ang huling sugnay upang mas malapit sa Hebreo habang nananatiling natural sa Filipino. Napanatili ang leksikal na kalabuan ng מָנוֹחַ sa teksto at tala.
