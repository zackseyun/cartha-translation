base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Noemi, na biyenan ni Ruth, sa kanya, “Anak ko, hindi ba dapat kitang hanapan ng isang pahingahan[a] na makabubuti sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pahinga,” “kapanatagan,” o “tahanan.” Sa konteksto, hinahangad ni Noemi ang matatag at maayos na kalagayan ni Ruth, malamang sa pamamagitan ng pag-aasawa, ngunit “pahinga” o “pahingahang lugar” ang literal na sinasabi ng Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa makabagong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: נָעֳמִי
  choice: Noemi
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: חֲמוֹתָהּ
  choice: kanyang biyenan
  rationale: Tuwirang ipinahahayag ng pangngalang may hulaping panghalip ang kaugnayan ni Noemi kay Ruth; hindi tinutukoy ng salitang Filipino ang kasarian ng biyenan ngunit malinaw ito sa pangalan at konteksto.
- source_word: בִּתִּי
  choice: Anak ko
  rationale: Natural at magiliw na pantawag sa Filipino na pinananatili ang ugnayang pampamilya nang hindi nagdaragdag ng labis na damdamin.
- source_word: הֲלֹא
  choice: hindi ba dapat akong
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: אֲבַקֶּשׁ
  choice: humanap
  rationale: Karaniwang makabagong katumbas ng “maghanap” o “hanapin,” at ipinakikita ang aktibong pagkilos ni Noemi nang hindi tinutukoy agad kung ano ang kaniyang plano.
- source_word: מָנוֹחַ
  choice: isang pahingahang lugar
  rationale: Pinananatili ang konkretong talinghaga ng pahinga o lugar ng panatag na pamumuhay; hindi tahasang ipinapasok sa teksto ang pag-aasawa bagaman iyon ang malamang na ipinahihiwatig ng konteksto.
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: upang mapabuti ang kalagayan mo
  rationale: Likas na Filipino para sa layuning maging mabuti o maayos ang buhay ni Ruth, habang pinananatili ang malawak na diwa ng kapakanan.
theological_decisions:
- issue: Kung tahasang tutukuyin ang pag-aasawa bilang layunin ng מָנוֹחַ
  choice: Pinanatili sa pangunahing teksto ang “pahingahang lugar.”
  alternative: “tahanan” o “asawang magbibigay sa iyo ng kapanatagan”
  rationale: Ipinahihiwatig ng konteksto ang matatag na kapakanan sa pamamagitan ng pag-aasawa, ngunit hindi tahasang binabanggit ng Hebreo ang asawa o kasal; pinananatili ng salin ang tunay na lawak ng talinghaga.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Anak ko” bilang karaniwang magiliw na pantawag at “mapabuti ang kalagayan mo” upang malinaw na maipahayag ang kapakanan nang hindi nilulutas ang pahiwatig tungkol sa pag-aasawa.
