  naturalness: 'Hindi natural at may maling pagtukoy ang “sinabi sa kanya ni Noemi na kanyang biyenan”: ang “kanyang” ay maaaring tumukoy kay Noemi at hindi malinaw ang ugnayan. Mas malinaw at likas ang “Sinabi ni Noemi, na biyenan ni Ruth, sa kanya.” Ang “isang pahingahan” ay mas idiomatiko kaysa “isang pahingahang lugar.”'
