base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: tl
  text: Kumain at uminom si Boaz, at sumaya ang kanyang kalooban.[a] Pagkatapos, pumunta siya sa dulo ng bunton ng mga butil upang mahiga. Tahimik na lumapit si Ruth, tinanggal ang takip sa mga paa ni Boaz,[b] at nahiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “natuwa ang kanyang puso” o “maganda ang kanyang pakiramdam.” Ang idyomang Hebreo ay nagpapahiwatig ng kasiyahan, ngunit hindi nito mismo sinasabing lasing siya.
    reason: lexical_alternative
  - marker: b
    text: Literal, “tinanggal ang takip sa mga paa ni Boaz.” Nauunawaan ito ng ilan bilang isang payak at literal na kilos; nakikita naman ng iba na maaaring may pahiwatig ito. Maingat ang pananalita ng Hebreo at hindi tahasang naglalarawan ng seksuwal na gawain.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל ... וַיֵּשְׁתְּ
  choice: kumain at uminom
  rationale: Tuwirang isinasalin ang magkasunod na pandiwang nagsasalaysay, nang hindi ipinahihiwatig na nalasing si Boaz.
- source_word: וַיִּיטַב לִבּוֹ
  choice: naging masaya ang kanyang kalooban
  rationale: Natural na salin ng idyomang Hebreo na literal na tumutukoy sa pagiging mabuti o kaaya-aya ng puso; nagpapahayag ito ng kasiyahan ngunit hindi sapilitang pagkalasing.
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: pumunta siya ... upang mahiga
  rationale: Ang kilos ay natural na ipinahahayag sa Tagalog bilang pagpunta, at ang שׁכב ay pinananatiling ‘mahiga’ sa halip na gawing ‘matulog,’ na mas tiyak kaysa sa Hebreo.
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: sa dulo ng bunton ng mga butil
  rationale: Ang קצה ay dulo o gilid, at ang ערמה ay bunton; nililinaw ng konteksto ng giikan na mga butil ang nakabunton.
- source_word: בַלָּט
  choice: tahimik na lumapit
  rationale: Ipinahahayag ang maingat at hindi napapansing paglapit nang hindi dinaragdagan ng negatibong moral na pahiwatig ng ‘palihim.’
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: tinanggal ang takip sa mga paa niya
  rationale: Pinananatili ang payak at konkretong larawan ng Hebreo. Hindi ito pinalalawak upang tahasang magpahiwatig ng seksuwal na kilos.
- source_word: וַתִּשְׁכָּב
  choice: nahiga
  rationale: Tuwirang salin ng pandiwang ‘humiga’; hindi nilalagyan ng seksuwal na kahulugang hindi tahasang sinasabi ng talata.
theological_decisions:
- issue: Kung dapat bang tahasang magpahiwatig ng seksuwal na kilos ang ginawa ni Ruth
  choice: 'Panatilihin ang literal at maingat na paglalarawan: tinanggal niya ang takip sa mga paa ni Boaz at nahiga.'
  alternative: Isalin ito nang mas interpretatibo bilang pang-aakit o seksuwal na pakikipag-ugnayan.
  rationale: Pigil at hindi tahasan ang pananalita ng tekstong Hebreo. Pinananatili ng salin ang tunay na posibilidad ng pahiwatig, ngunit hindi nito ginagawang lantad ang hindi naman tahasang sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalooban” upang natural na maipahayag ang idyoma tungkol sa puso, at pinanatiling payak ang paglalarawan sa ginawa ni Ruth upang hindi lutasin nang sapilitan ang sinadyang pagpipigil ng salaysay.
