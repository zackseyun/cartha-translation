source:
  edition: WLC
  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: tl
  text: Manatili ka rito ngayong gabi. Pagsapit ng umaga, kung tutubusin ka niya[a], mabuti—hayaan siyang tumubos sa iyo. Ngunit kung ayaw ka niyang tubusin, ako mismo ang tutubos sa iyo. Buhay si Yahweh! Humiga ka hanggang umaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tubusin” dito ay tumutukoy sa tungkulin ng isang kamag-anak na tumubos para sa pamilya; madalas itong tawaging tungkulin ng “kamag-anak na tagapagtubos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: Manatili ka rito ngayong gabi
  rationale: Ang לון ay tumutukoy sa pananatili o pagpapalipas ng gabi. Natural sa modernong Tagalog ang pariralang ito at hindi nito ipinahihiwatig ang higit sa sinasabi ng konteksto.
- source_word: וְהָיָה בַבֹּקֶר
  choice: Pagsapit ng umaga
  rationale: Malinaw at likas itong panandang temporal para sa mangyayari kinabukasan.
- source_word: יִגְאָלֵךְ / לְגָאֳלֵךְ / וּגְאַלְתִּיךְ
  choice: tutubusin ka / tubusin ka / tutubos sa iyo
  rationale: Pinananatili ng 'tubos' ang paulit-ulit na salitang-ugat גאל at ang mahalagang temang legal-pampamilya at teolohikal ng aklat. Ipinaliliwanag sa talababa ang natatanging tungkuling pampamilya.
- source_word: טוֹב יִגְאָל
  choice: mabuti—hayaan mo siyang tumubos sa iyo
  rationale: Pinananatili ng 'mabuti' ang maikli at eliptikong pagsang-ayon ng Hebreo; ipinapakita ng kasunod na parirala ang pahintulot sa mas malapit na tagapagtubos.
- source_word: לֹא יַחְפֹּץ
  choice: ayaw
  rationale: Natural at malinaw sa kasalukuyang Tagalog ang 'ayaw' para sa kawalan ng pagnanais o kahandaang gawin ang pagtubos.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: ako mismo ang tutubos sa iyo
  rationale: Ipinahahayag ng 'ako mismo' ang diin ng אָנֹכִי at ang personal na paninindigan ni Boaz.
- source_word: חַי יְהוָה
  choice: Saksi ang buhay ni Yahweh!
  rationale: Isinasalin ito bilang malinaw na pormula ng panunumpa sa dignified na modernong Tagalog, sa halip na literal ngunit di-likas na 'Buhay si Yahweh.'
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: Humiga ka hanggang umaga
  rationale: Direkta at natural na salin ng utos na manatiling nakahiga hanggang umaga.
theological_decisions:
- issue: Kahulugan ng גאל sa kontekstong legal-pampamilya ng Ruth
  choice: Panatilihin ang wikang 'tubos' sa pangunahing teksto at ipaliwanag ang tungkuling pampamilya sa talababa
  alternative: Gampanan ang tungkulin bilang kamag-anak na tagapagtubos
  rationale: Pinananatili ng 'tubos' ang tematikong bigat at pag-uulit ng Hebreo nang hindi isinisiksik sa pangunahing teksto ang buong paliwanag sa sinaunang kaugalian.
- issue: Paglalahad sa pormula ng panunumpang חַי יְהוָה
  choice: Saksi ang buhay ni Yahweh!
  alternative: Buhay si Yahweh / Habang buhay si Yahweh
  rationale: Malinaw nitong ipinahihiwatig na panunumpa ang pahayag, habang pinananatili ang buhay ni Yahweh bilang batayan ng taimtim na pangako.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili rito ang personal na pangalang Yahweh sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang maikling diin ng Hebreo sa 'mabuti' at ang pag-uulit ng 'tubos.' Ang panghalip at mga pandiwa ay pambabae sa Hebreo ngunit hindi minamarkahan ng kasarian sa Tagalog. Ang [a] ay inilagay sa unang paglitaw ng 'tutubusin'.
