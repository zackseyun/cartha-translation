    rationale: Ang חַי יְהוָה ay nakabatay sa pahayag na “Buhay si Yahweh,” isang karaniwang pormula ng sumpa o taimtim na panunumpa. Mas malinaw ito nang hindi nagdaragdag ng konseptong “saksi.”
