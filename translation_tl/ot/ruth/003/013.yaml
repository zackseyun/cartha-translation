  to: Manatili ka rito ngayong gabi. Pagsapit ng umaga, kung tutubusin ka niya[a], mabuti—hayaan siyang tumubos sa iyo. Ngunit kung ayaw ka niyang tubusin, ako mismo ang tutubos sa iyo. Buhay si Yahweh! Humiga ka hanggang umaga.
