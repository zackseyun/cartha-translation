  source_fidelity: 'Tapat ang salin sa sunod-sunod na mga tagubilin sa Hebreo: paghuhugas/paliligo, pagpapahid ng langis, pagsusuot ng balabal, pagpunta sa giikan, at hindi pagpapakilala hanggang matapos kumain at uminom ang lalaki. Maingat ding napanatili ang di-pangalan na “ang lalaki,” sa halip na tahasang “si Boaz.”'
  naturalness: Malinaw, natural, at marangal ang modernong Tagalog. Ang “Maligo ka,” “pahiran mo ng langis ang iyong sarili,” at “Huwag kang magpakilala” ay madaling maunawaan at angkop sa konteksto. Ang “giikan” ay isang matatag at tumpak na terminong biblikal para sa גֹּרֶן.
  terminology: Ang “balabal” ay angkop para sa שִׂמְלָה bilang panlabas na kasuotan. Ang “pahiran ... ng langis” ay mas tumpak kaysa sa interpretibong “magpabango.” Wasto ring itinuturing ng talababa ang “maghugas ka” bilang leksikal na alternatibo at ipinapaliwanag ang di-karaniwang anyong katinig sa utos na “bumaba ka.”
