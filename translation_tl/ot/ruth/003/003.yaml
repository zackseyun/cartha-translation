  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: tl
  text: Maligo ka[a], pahiran mo ng langis ang iyong sarili, at isuot mo ang iyong balabal[b]. Pagkatapos, bumaba ka sa giikan[c]. Huwag kang magpakilala sa lalaki hanggang sa matapos siyang kumain at uminom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maghugas ka.” Maaaring tumukoy ang pandiwang Hebreo sa paghuhugas o paliligo ng katawan.
    reason: lexical_alternative
  - marker: b
    text: O “isuot mo ang iyong kasuotan.” Pangkalahatang tumutukoy ang salitang Hebreo sa isang kasuotan o panlabas na damit; ipinapalagay ng ilang salin na ito ay marangya o pinakamagandang damit.
    reason: lexical_alternative
  - marker: c
    text: 'Di-karaniwan ang anyong katinig ng Hebreo rito. Batay sa konteksto, karaniwan itong inuunawa bilang pagpapatuloy ng tagubilin ni Naomi kay Ruth: “bumaba ka sa giikan.”'
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: Maligo ka
  rationale: Maaaring tumukoy ang רחץ sa paghuhugas o paliligo ng katawan. Likas at malinaw sa modernong Tagalog ang “maligo ka” sa paghahandang inilalarawan dito.
- source_word: וָסַכְתְּ
  choice: pahiran mo ng langis ang iyong sarili
  rationale: Ang סוך ay karaniwang nangangahulugang pagpahid o pagpapahid ng langis/pamahid. Pinananatili nito ang konkretong larawan ng Hebreo at hindi ipinapalagay na pabango lamang ang ginamit.
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: isuot mo ang iyong balabal
  rationale: Ang שִׂמְלָה ay pangkalahatang kasuotan, madalas ay panlabas na damit o balabal. Hindi idinagdag ang interpretasyong “pinakamagandang damit,” na hindi tahasang nasa Hebreo.
- source_word: וירדתי הַגֹּרֶן
  choice: Pagkatapos, bumaba ka sa giikan
  rationale: Bagaman di-karaniwan ang anyong katinig sa tekstong Hebreo, hinihingi ng konteksto ang utos na pambabae na isahan kay Ruth. Ang גֹּרֶן ay giikan.
- source_word: אַל תִּוָּדְעִי
  choice: Huwag kang magpakilala
  rationale: 'Ang anyong Niphal ng ידע rito ay may diwang pasibo/reflexive: hindi dapat ipaalam o ihayag ni Ruth ang kaniyang presensiya. Ang “magpakilala” ay natural ngunit pinananatili ang pananagutan niyang huwag munang magpahalata.'
- source_word: לָאִישׁ
  choice: sa lalaki
  rationale: Tumutukoy ito sa tiyak na lalaki sa konteksto, si Boaz, ngunit “ang lalaki” ang mismong sinabi ng Hebreo kaya hindi ipinalit ang pangalan.
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: hanggang sa matapos siyang kumain at uminom
  rationale: Ipinahahayag ng כלה kasama ng mga pawatas ang pagtatapos ng pagkain at pag-inom; natural at eksakto ang salin sa Tagalog.
