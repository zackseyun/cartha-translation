translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “giikan,” isang tumpak at pamilyar na terminong biblikal-agrikultural. Iniwasan ang masyadong interpretibong “magpabango” at “pinakamagandang damit,” at pinanatili sa mga talababa ang tunay na mga alternatibong leksikal at suliraning tekstuwal.
