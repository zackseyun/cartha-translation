base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: tl
  text: Sinabi niya, “Sino ka?” Sumagot siya, “Ako si Ruth, ang iyong lingkod. Iunat mo ang iyong pakpak[a] sa ibabaw ng iyong lingkod, sapagkat ikaw ay isang manunubos[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Iunat mo ang sulok ng iyong damit sa ibabaw ng iyong lingkod.” Ang salitang Hebreo ay maaaring mangahulugang “pakpak” o ang dulo ng kasuutan, at maaaring sinasadyang ipahiwatig dito kapuwa ang pagkalinga at isang pahiwatig na may kaugnayan sa pag-aasawa.
    reason: lexical_alternative
  - marker: b
    text: O, “kamag-anak na manunubos”—isang kamag-anak na may kinikilalang pananagutang kumilos para sa kapakanan ng isang kapamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָתּ
  choice: Sino ka?
  rationale: Tuwirang tanong ito tungkol sa pagkakakilanlan at natural ang anyong ito sa makabagong Tagalog.
- source_word: אָנֹכִי רוּת
  choice: Ako si Ruth
  rationale: Likas na isinasalin sa Tagalog ang sugnay na walang tahasang pandiwa bilang pagpapakilala sa sarili.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: iyong lingkod
  rationale: Ang אמה ay babaeng lingkod o alipin. Pinananatili ng “iyong lingkod” ang mapagpakumbabang pagpapakilala ni Ruth nang hindi gumagamit ng lipas o di-likas na katawagan; malinaw na babae si Ruth mula sa konteksto.
- source_word: וּפָרַשְׂתָּ
  choice: Iladlad mo
  rationale: Ipinahahayag nito ang pag-uunat o paglalatag ng isang bagay sa ibabaw ng iba at maaari itong gamitin kapuwa sa pakpak at sa bahagi ng kasuutan.
- source_word: כְנָפֶךָ
  choice: ang iyong pakpak
  rationale: Ang כנף ay pangunahing nangangahulugang “pakpak” ngunit maaari ring tumukoy sa laylayan o sulok ng kasuutan. Pinananatili sa pangunahing teksto ang konkretong larawang “pakpak,” habang inilalagay sa talababa ang posibleng kahulugan na may kaugnayan sa damit.
- source_word: עַל
  choice: sa ibabaw ng
  rationale: Malinaw at natural nitong ipinahahayag ang larawan ng pagtakip o pagkalinga.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kahilingan ni Ruth; marangal at malinaw ang “sapagkat” sa salaysay.
- source_word: גֹאֵל
  choice: isang manunubos
  rationale: Pinananatili ng “manunubos” ang pangunahing diwa ng גאל. Ipinaliliwanag sa talababa ang mahalagang papel nito sa loob ng angkan nang hindi binibigatan ang mismong diyalogo.
theological_decisions:
- issue: Ang talinghagang “iyong pakpak” sa kahilingan ni Ruth
  choice: Panatilihin ang literal na “iyong pakpak” sa pangunahing teksto at hayaang manatiling pahiwatig ang kaugnayan nito sa kasuutan at pag-aasawa.
  alternative: Isalin bilang “laylayan ng iyong damit” upang itampok ang pahiwatig ng pag-aasawa.
  rationale: Maaaring sinasadyang pagsamahin ng Hebreo ang larawan ng pakpak bilang pagkalinga at ang laylayan ng kasuutan bilang pahiwatig ng pag-angkin o pag-aasawa. Ang pagpapanatili sa “pakpak” at pagbanggit sa alternatibo sa talababa ay hindi nag-aalis sa alinmang posibilidad.
- issue: Ang kahulugan at papel ng גֹאֵל
  choice: Gamitin ang “manunubos” sa pangunahing teksto at ipaliwanag sa talababa ang pananagutan nito bilang kamag-anak.
  alternative: “kamag-anak na manunubos” o “tagapagtubos ng angkan”
  rationale: May legal, pampamilya, at mapanumbalik na saklaw ang terminong Hebreo. Pinananatili ng “manunubos” ang susing salita, samantalang inililinaw ng talababa ang konteksto nito sa aklat ng Ruth nang hindi nagpapasok ng natatanging doktrinang denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit ng “iyong lingkod” at ang konkretong larawang “pakpak.” Inilagay ang mga pananda ng talababa sa mismong mga salitang tinatalakay upang maiwasan ang kalituhan.
