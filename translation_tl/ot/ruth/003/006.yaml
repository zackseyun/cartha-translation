  text: So she went down to the threshing floor and did according to all that her mother-in-law had commanded her[a].
translation:
  language: tl
  text: Kaya bumaba siya sa giikan at ginawa niya ang lahat ng iniutos sa kanya ng kanyang biyenan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagkatapos ay bumaba siya sa giikan at ginawa niya ang lahat ayon sa lahat ng iniutos sa kanya ng kanyang biyenan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: bumaba siya
  rationale: Pinananatili nito ang karaniwang diwa ng ירד na pababang pagkilos, sa natural na makabagong Tagalog.
- source_word: הַגֹּרֶן
  choice: sa giikan
  rationale: Ang גֹּרֶן ay ang lugar na pinaggigiikan ng ani; ang “giikan” ang maikli at likas na katumbas sa Tagalog.
- source_word: וַתַּעַשׂ
  choice: at ginawa
  rationale: Ang עשה ay malawak na pandiwang “gumawa”; sa konstruksiyong ito, likas ang “ginawa ang lahat ng…”
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ng
  rationale: Sa pariralang “ginawa ang lahat ng iniutos,” naipahahayag ang ganap na pagsunod na tinutukoy ng כְּכֹל אֲשֶׁר nang hindi nagiging alanganin ang Tagalog.
- source_word: צִוַּתָּה
  choice: iniutos
  rationale: Pinananatili ng “iniutos” ang lakas ng צוה, sa halip na palambutin ito bilang payo o simpleng tagubilin.
- source_word: חֲמוֹתָהּ
  choice: kanyang biyenan
  rationale: Ang חֲמוֹת ay tiyak na tumutukoy sa biyenang babae, ngunit karaniwang sapat at natural sa Tagalog ang “biyenan”; malinaw sa konteksto na si Noemi ang tinutukoy.
- source_word: וַ
  choice: Kaya
  rationale: Ipinagpapatuloy nito ang salaysay at ipinahihiwatig ang tugon ni Ruth sa naunang tagubilin; maaari ring isalin na “Pagkatapos” o “At.”
