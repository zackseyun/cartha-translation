  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Maghintay ka, anak ko, hanggang sa malaman mo kung ano ang kahihinatnan ng usapin, sapagkat hindi magpapahinga ang lalaki hangga’t hindi niya matatapos ang usapin ngayong araw.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁבִי
  choice: Maghintay ka
  rationale: Bagaman literal na “umupo” o “manatili,” ang pautos dito ay pragmatikong humihiling kay Ruth na manatili at hintayin ang kalalabasan.
- source_word: בִתִּי
  choice: anak ko
  rationale: Pinananatili ang magiliw na tawag ni Naomi at ang tahasang panghalip na paari.
- source_word: תֵּדְעִין
  choice: malaman mo
  rationale: Ipinahihiwatig ng ידע rito ang pagkakaroon ng kaalaman sa hinaharap kapag nahayag na ang resulta.
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: kung ano ang kahihinatnan ng bagay na ito
  rationale: Natural na Tagalog para sa idyomang literal na “kung paano babagsak ang bagay,” nang hindi ipinapalagay kung ano ang magiging resulta.
- source_word: הָאִישׁ
  choice: ang lalaking iyon
  rationale: Tumutukoy sa konteksto kay Boaz ngunit hindi pinapangalanan ng Hebreo; pinananatili ang nominal na pagtukoy.
- source_word: יִשְׁקֹט
  choice: hindi magpapahinga
  rationale: Ipinapahayag ang determinasyong hindi titigil o mananatiling walang ginagawa hanggang maresolba ang usapin.
- source_word: כִּי אִם
  choice: hangga't hindi
  rationale: 'Natural na ipinapahayag sa Tagalog ang limitasyon: hindi siya magpapahinga bago matapos ang bagay.'
- source_word: כִּלָּה
  choice: natatapos
  rationale: Malapit sa pangunahing diwang “tapusin” o “lubusin,” habang ang konteksto ang nagpapakitang usaping legal at pampamilya ang kinukumpleto.
- source_word: הַדָּבָר
  choice: ang bagay na ito
  rationale: Sapat na malawak upang tukuyin ang nakabinbing usapin nang hindi dinaragdagan ang espesipikong interpretasyon.
- source_word: הַיּוֹם
  choice: ngayong araw
  rationale: Tuwirang temporal na salin na natural at malinaw sa modernong Tagalog.
