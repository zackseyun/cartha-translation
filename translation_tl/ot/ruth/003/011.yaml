  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: tl
  text: At ngayon, anak ko, huwag kang matakot. Anuman ang sabihin mo ay gagawin ko para sa iyo, sapagkat alam ng lahat ng kababayan ko sa pintuang-bayan[a] na ikaw ay isang babaeng may dangal at kakayahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “pintuang-bayan” ang pampublikong lugar ng pagkilala ng pamayanan at ng mga paglilitis at kasunduang legal. Maaari ring isalin ang parirala: “alam ng lahat ng aking kababayan.”'
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “isang karapat-dapat na babae,” “isang mahusay na babae,” o “isang babaeng may lakas ng loob.” Saklaw ng salitang Hebreo ang dangal, lakas, halaga, at kakayahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  choice: anak ko
  rationale: Pinananatili ang magiliw at mapagkalingang katawagan ni Boaz. Hindi nito ipinahihiwatig na tunay niyang anak si Ruth.
- source_word: אַל תִּירְאִי
  choice: huwag kang matakot
  rationale: Likas at malinaw na Filipino para sa negatibong pautos na nagbibigay rin ng katiyakan.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: Anuman ang sabihin mo ay gagawin ko para sa iyo
  rationale: Pinananatili ang malawak at tuwirang diwa ng pandiwang 'sabihin' sa halip na paliitin ito sa 'hilingin,' bagaman kahilingan ang ipinahihiwatig ng konteksto.
- source_word: שַׁעַר
  choice: pintuang-bayan
  rationale: Tumutukoy ito sa tarangkahan o pintuan ng bayan, ang pampublikong lugar ng pagkilala, pagpupulong, at mga usaping legal sa sinaunang Israel.
- source_word: כָּל שַׁעַר עַמִּי
  choice: lahat ng kababayan ko sa pintuang-bayan
  rationale: Isinasalin nang likas ang metonimikong idyoma habang pinananatili ang mahalagang larawang pangkultura ng pintuang-bayan.
- source_word: אֵשֶׁת חַיִל
  choice: isang babaeng may dangal at kakayahan
  rationale: Sinasalamin ang lawak ng חַיִל—halaga, lakas, husay, kakayahan, at marangal na pagkatao—nang hindi nililimitahan sa pagiging moral lamang o binibigyan ng di-kinakailangang tonong militar.
theological_decisions:
- issue: Paglalarawan kay Ruth sa אֵשֶׁת חַיִל
  choice: isang babaeng may dangal at kakayahan
  alternative: isang karapat-dapat na babae; isang mahusay na babae; isang babaeng may lakas ng loob
  rationale: Ipinahahayag ng parirala ang kinikilalang halaga, integridad, lakas, at kakayahan ni Ruth. Pinananatili ng salin ang lawak nito at ang pagkakatulad sa parirala ng Kawikaan 31 nang hindi ito ipinapako sa isang makitid na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak ko” bilang magiliw na katawagan, at pinanatili ang “pintuang-bayan” upang hindi mawala ang sinaunang kontekstong pampamayanan at legal.
