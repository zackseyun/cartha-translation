base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: tl
  text: Kapag nakahiga na siya, tandaan mo ang lugar kung saan siya hihiga. Pagkatapos, pumunta ka roon, alisin mo ang takip sa paanan niya[a], at humiga ka[b]. At siya ang magsasabi sa iyo kung ano ang dapat mong gawin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga paa niya” o “dakong ibaba ng katawan niya.” Ang salitang Hebreo ay maaaring tumukoy sa mga paa mismo o sa dakong paanan kung saan naroon ang mga ito.
    reason: lexical_alternative
  - marker: b
    text: Ang nakasulat na anyong Hebreo ay “at mahihiga ako,” ngunit ang tradisyonal na pagbasa at ang konteksto ay “at humiga ka.”
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: Kapag humiga na siya
  rationale: Ang ב na kasama ng infinitive construct ay temporal. Likas sa modernong Tagalog ang “kapag humiga na siya” at malinaw nitong ipinagpapatuloy ang sunod-sunod na tagubilin.
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: tandaan mo ang lugar
  rationale: Bagaman literal na “alamin” ang ידע, hinihiling dito kay Ruth na pagmasdan at tandaan ang eksaktong lugar; malinaw at natural ang “tandaan mo.”
- source_word: אֲשֶׁר יִשְׁכַּב שָׁם
  choice: na hinihigaan niya
  rationale: Tinutukoy ng sugnay ang lugar na pinaghihigaan ni Boaz. Hindi na kailangang isalin nang hiwalay ang שָׁם dahil taglay na ng “lugar na” ang diwa ng “doon.”
- source_word: וּבָאת
  choice: Pagkatapos, lumapit ka
  rationale: Maaaring mangahulugang “pumaroon” o “lumapit” ang בוא ayon sa pananaw. Dito, ang “lumapit ka” ay natural at tiyak sa pagkilos ni Ruth patungo kay Boaz.
- source_word: וְגִלִּית מַרְגְּלֹתָיו
  choice: alisin mo ang takip sa paanan niya
  rationale: Ang גלה ay “alisan ng takip” o “ilantad,” at ang מַרְגְּלוֹתָיו ay maaaring tumukoy sa mga paa o sa dakong paanan. Iniiwasan ng saling ito ang maling larawan na mismong mga paa ang may takip, habang pinananatili sa talababa ang lawak ng kahulugan.
- source_word: וְשָׁכָבְתִּי / וְשָׁכַבְתְּ
  choice: at mahiga ka roon
  rationale: Ang nakasulat na anyo ay unang panauhan, ngunit ang tradisyonal na pagbasa at konteksto ay ikalawang panauhang pambabae. Ang “mahumiga ka roon” ay malinaw na tagubilin kay Ruth; ipinapaliwanag sa talababa ang pagkakaibang tekstuwal.
- source_word: וְהוּא יַגִּיד לָךְ
  choice: Siya ang magsasabi sa iyo
  rationale: Karaniwang nangangahulugang “magsabi” ang Hiphil ng נגד. Naipapakita ng ayos na “Siya ang” ang bahagyang diin ng tahasang panghalip na וְהוּא.
- source_word: אֵת אֲשֶׁר תַּעַשִׂין
  choice: kung ano ang dapat mong gawin
  rationale: Ipinahihiwatig ng konteksto na bibigyan siya ng tagubilin. Natural sa Tagalog ang “dapat mong gawin” at hindi nito dinaragdagan ang nilalaman.
theological_decisions:
- issue: Posibleng seksuwal na pahiwatig sa pag-aalis ng takip sa paanan ni Boaz at paghiga ni Ruth
  choice: Panatilihin ang konkretong kilos nang hindi tahasang ginagawang seksuwal o lubos na inosente.
  alternative: Ipaliwanag ito bilang eupemismo para sa seksuwal na paglapit, o bilang praktikal lamang na paraan upang gisingin si Boaz.
  rationale: May sadyang tensiyon at posibleng kalabuan ang salaysay sa Hebreo. Hindi dapat lutasin ng salin ang hindi tahasang nilulutas ng teksto; kaya tuwiran ang pangunahing teksto at limitado sa leksikal na paliwanag ang talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “paanan” upang maipahayag ang posibleng lokatibong diwa ng מַרְגְּלוֹתָיו nang hindi inaalis ang kalabuan, at iniwasan ang mga salitang may dagdag na denominasyonal o moral na pagpapakahulugan.
