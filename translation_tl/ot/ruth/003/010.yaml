  text: וַ/יֹּ֗אמֶר בְּרוּכָ֨ה אַ֤תְּ לַֽ/יהוָה֙ בִּתִּ֔/י הֵיטַ֛בְתְּ חַסְדֵּ֥/ךְ הָ/אַחֲר֖וֹן מִן הָ/רִאשׁ֑וֹן לְ/בִלְתִּי לֶ֗כֶת אַחֲרֵי֙ הַ/בַּ֣חוּרִ֔ים אִם דַּ֖ל וְ/אִם עָשִֽׁיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: tl
  text: At sinabi niya, “Pagpalain ka nawa ni Yahweh, anak ko. Mas dakila ang huli mong ipinakitang katapatan[a] kaysa sa una, sapagkat hindi ka humabol sa mga binata, mahirap man o mayaman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabaitan,” “tapat na pag-ibig,” o “matapat na pagmamalasakit” para sa katapatan (חֶסֶד).
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: Pagpalain ka nawa ni Yahweh
  rationale: Likás at marangal na pormula ng pagpapala sa Filipino; pinananatili ng “nawa” ang benediktibong puwersa, at tuwirang inililipat ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: בִּתִּי
  choice: anak ko
  rationale: Karaniwang magiliw na tawag ng isang nakatatanda sa nakababatang babae sa Filipino. Pinananatili nito ang ugnayang panlipunan at pagmamalasakit nang hindi ipinahihiwatig na literal na anak ni Boaz si Ruth.
- source_word: הֵיטַבְתְּ ... הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: Mas dakila ang ipinakita mong ... ngayon kaysa noong una
  rationale: Malinaw na ipinahahayag ang paghahambing ng kasalukuyang gawa ni Ruth at ng nauna niyang gawa; mas natural ito kaysa sa literal na “pinabuti mo ang huli kaysa una.”
- source_word: חַסְדֵּךְ
  choice: katapatan
  rationale: Sa konteksto, tumutukoy ito sa tapat at mapagbigay na pagkilos ni Ruth para sa sambahayan ni Naomi. Mas mahusay na naipahahayag ng “katapatan” ang relasyonal na loyalty kaysa ng pangkalahatang “kabaitan,” habang hindi nito labis na tinutukoy ang isang teknikal na tipan.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: sapagkat hindi ka humabol sa
  rationale: Ipinapakita ng “sapagkat” kung paano naging higit ang kasalukuyang katapatan ni Ruth, at natural na inililipat ng “humabol sa” ang idyoma ng paghahangad ng mapapangasawa.
- source_word: הַבַּחוּרִים
  choice: mga binata
  rationale: Ang “mga binata” ay natural at tiyak sa mga kabataang lalaking maaaring mapangasawa; hindi nito sapilitang ginagawang tahasang paghahambing kay Boaz.
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: mahirap man o mayaman
  rationale: Direkta at idyomatikong Filipino para sa merismong sumasaklaw sa lahat ng kalagayang pangkabuhayan.
theological_decisions:
- issue: Kahulugan ng חֶסֶד sa papuri ni Boaz
  choice: katapatan
  alternative: kabaitan; tapat na pag-ibig; matapat na pagmamalasakit
  rationale: Pinupuri rito ang kongkretong katapatan ni Ruth sa pamilya ni Naomi sa halip na paghahangad ng kabataan o yaman. Pinananatili ng “katapatan” ang relasyonal na bigat ng חֶסֶד nang hindi isinasara ang salita sa isang denominasyonal o teknikal na pagbasa.
- issue: Paglilipat ng יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na banal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak ko” bilang likas na magiliw na tawag ng nakatatanda, at “mga binata” para sa konteksto ng maaaring mapangasawa. Walang talababa dahil walang marker na kailangan sa pangunahing teksto; ang semantikong lawak ng חֶסֶד ay naitala sa mga pasyang leksikal at teolohikal.
