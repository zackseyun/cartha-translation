  text: וְ/עַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י אם גֹאֵ֖ל אָנֹ֑כִי וְ/גַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: tl
  text: At ngayon, totoo ngang isa akong manunubos[a], ngunit mayroon pang manunubos na mas malapit na kamag-anak kaysa sa akin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kamag-anak na manunubos” o “kamag-anak na tagapagtanggol.” Ang salitang Hebreo ay tumutukoy sa isang malapit na kamag-anak na may kinikilalang mga tungkulin ng pagtubos para sa pamilya.
    reason: lexical_alternative
  - marker: b
    text: Ang “mas malapit” dito ay nangangahulugang mas malapit ang pagkakamag-anak at samakatuwid ay nauuna sa karapatang tumubos; hindi ito tumutukoy lamang sa pisikal na distansiya.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang temporal o pandiskurso na עַתָּה, habang natural na ipinagpapatuloy ang sinabi ni Boaz.
- source_word: כִּי אָמְנָם כִּי אִם
  choice: totoong
  rationale: Ipinahahayag ng magkakaugnay na parirala ang mariing pagpapatunay o pag-amin sa kasunod na pahayag. Ang “totoong” ay natural sa Filipino at hindi labis na nagpapakahulugan sa konstruksyon.
- source_word: גֹאֵל
  choice: manunubos
  rationale: Tumutukoy ito sa malapit na kamag-anak na may kinikilalang pananagutang tubusin o ipagsanggalang ang mga karapatan at ari-arian ng pamilya. Pinananatili ng “manunubos” ang pangunahing diwa; inililinaw sa talababa ang natatanging kontekstong pampamilya at legal.
- source_word: אָנֹכִי
  choice: isa akong
  rationale: Ipinahahayag ang tahasang panghalip at ang panaguring pangngalan sa natural na ayos ng Filipino; may bahagyang diin ang pagkilala ni Boaz sa sarili bilang isang manunubos.
- source_word: וְגַם יֵשׁ
  choice: ngunit mayroon pang
  rationale: Ang sugnay ay kapuwa nagdaragdag at naglilimita sa naunang pahayag. Ipinakikita ng “ngunit” ang kontekstuwal na pagsalungat, samantalang ipinananatili ng “pang” ang diwang pandagdag ng גַּם.
- source_word: קָרוֹב מִמֶּנִּי
  choice: mas malapit na kamag-anak kaysa sa akin
  rationale: Sa kontekstong ito, ang pagiging “malapit” ay antas ng pagkakamag-anak at kaugnay na karapatang tumubos, hindi pisikal na distansiya. Ginagawang malinaw ng salin ang likas na kahulugan sa Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa גֹאֵל sa kontekstong legal at pampamilya
  choice: manunubos
  alternative: kamag-anak na manunubos; kamag-anak na tagapagtanggol
  rationale: Ang talata ay tungkol sa kinikilalang tungkulin ng isang malapit na kamag-anak sa sinaunang Israel, hindi lamang sa pangkalahatan o espirituwal na pagtubos. Pinananatili sa pangunahing teksto ang maikli at pamilyar na “manunubos,” at inilalagay sa talababa ang mas tiyak na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isa akong” at “mayroon pang” para sa natural na daloy, habang pinanatili ang legal-pampamilyang diwa ng talata. Inilagay ang mga pananda ng talababa kaagad pagkatapos ng mga salitang talagang ipinapaliwanag ng mga ito.
