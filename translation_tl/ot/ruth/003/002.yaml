  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/לֹ֥א בֹ֨עַז֙ מֹֽדַעְתָּ֔/נוּ אֲשֶׁ֥ר הָיִ֖ית אֶת נַעֲרוֹתָ֑י/ו הִנֵּה ה֗וּא זֹרֶ֛ה אֶת גֹּ֥רֶן הַ/שְּׂעֹרִ֖ים הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: tl
  text: At ngayon, hindi ba kamag-anak natin si Boaz, na ang mga dalagang manggagawa niya ay nakasama mo?[a] Masdan mo, magtatahip siya ng sebada sa giikan ngayong gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dalaga niya.” Maaari ring tumukoy ang Hebreo sa mga babaeng manggagawa o tagapaglingkod ni Boaz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang panahong עַתָּה habang natural na ipinakikilala ang susunod na hakbang sa plano ni Naomi.
- source_word: הֲלֹא
  choice: hindi ba
  rationale: Likas na anyong Filipino para sa retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: מֹדַעְתָּנוּ
  choice: kamag-anak natin
  rationale: Sa konteksto, tumutukoy ito sa ugnayang pampamilya o pangangkan, hindi lamang sa isang kakilala.
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: na ang mga dalagang manggagawa niya ay nakasama mo
  rationale: Ipinahahayag na nakisama si Ruth sa mga babaeng nagtatrabaho kay Boaz; nililinaw ng “manggagawa” ang konteksto nang hindi ipinapalagay na alipin sila.
- source_word: הִנֵּה
  choice: Masdan mo
  rationale: Nananawagan ito ng pansin sa mahalagang kasalukuyan o nalalapit na pangyayari; dignificado ngunit nauunawaan sa makabagong Filipino.
- source_word: זֹרֶה
  choice: magtatahip siya
  rationale: Ang participle ay maaaring tumukoy sa kasalukuyan o nalalapit na gawain. Sa konteksto ng “ngayong gabi,” natural sa Filipino ang aspektong magaganap.
- source_word: אֶת גֹּרֶן הַשְּׂעֹרִים
  choice: ng sebada sa giikan
  rationale: Bagaman pambihira ang tuwirang layon na גֹּרֶן, ang malinaw na diwa sa konteksto ay ang pagtatahip ng sebada sa lugar ng giikan, hindi ang pagtatahip sa mismong giikan.
- source_word: הַלָּיְלָה
  choice: ngayong gabi
  rationale: Natural na katumbas ng adverbial na pagtukoy sa gabing iyon.
theological_decisions: []
translation_notes:
  register: Makabago at dignifikadong Filipino. Ginamit ang “magtatahip” bilang karaniwang salitang pang-agrikultura at “giikan” para sa threshing floor. Iniwasan ang masyadong arkaikong “narito” o “dinggin,” at pinanatili ang retorikal na tanong.
