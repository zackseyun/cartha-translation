base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: tl
  text: Nang dumating siya sa kanyang biyenan[a], sinabi ng kanyang biyenan, “Sino ka, anak ko?” Pagkatapos, ikinuwento niya sa kanya ang lahat ng ginawa ng lalaki para sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas interpretibong salin, “Kumusta ang nangyari sa iyo, anak ko?” Literal sa Hebreo, “Sino ka, anak ko?” Maaaring ang tanong ay tungkol sa nabagong kalagayan ni Ruth o sa kinalabasan ng pakikipagtagpo niya kay Boaz.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא
  choice: Nang dumating siya
  rationale: Isinusulong ng wayyiqtol ng בוא ang salaysay; natural sa Tagalog ang temporal na “Nang dumating siya” bilang tulay sa kasunod na pananalita.
- source_word: אֶל חֲמוֹתָהּ
  choice: sa kanyang biyenan
  rationale: Ang חֲמוֹת ay tiyak na tumutukoy sa biyenang babae. Sa modernong Tagalog, karaniwang sapat ang “biyenan,” at malinaw sa konteksto na si Noemi ang tinutukoy.
- source_word: וַתֹּאמֶר
  choice: sinabi nito
  rationale: Ang “nito” ay natural na tumutukoy sa pinakamalapit na pangngalang “biyenan” at iniiwasan ang kalituhan kung sino ang nagsalita.
- source_word: מִי אַתְּ
  choice: Sino ka
  rationale: Pinananatili ang literal at sadyang αmbiguong tanong ng Hebreo. Maaaring ipinahihiwatig nito ang kalagayan ni Ruth o ang kinalabasan ng pagkikita, ngunit hindi iyon tahasang nilulutas sa pangunahing teksto.
- source_word: בִּתִּי
  choice: anak ko
  rationale: Likas at magiliw na pantawag ito sa Tagalog, at pinananatili ang ugnayang pampamilya sa literal na “my daughter.”
- source_word: וַתַּגֶּד לָהּ
  choice: Pagkatapos, ikinuwento niya rito
  rationale: Ang Hiphil ng נגד ay “magsabi/mag-ulat.” Ang “ikinuwento” ay natural para sa detalyadong pagsasalaysay, at ang “rito” ay malinaw na tumutukoy sa biyenan.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Tumpak at natural na ipinakikilala nito ang kabuuang nilalaman ng iniulat ni Ruth.
- source_word: עָשָׂה לָהּ הָאִישׁ
  choice: ginawa ng lalaki para sa kanya
  rationale: Pinananatili ang “lalaki” sa halip na pangalanang si Boaz, gaya ng Hebreo. Ang “para sa kanya” ay nagpapahayag ng mapagkalingang diwa ng לָהּ nang hindi nagmumungkahi ng kapinsalaan.
theological_decisions:
- issue: Kahulugan ng tanong na מִי אַתְּ
  choice: Panatilihin sa teksto ang literal na “Sino ka?”
  alternative: “Kumusta ang nangyari sa iyo?” o “Ano na ang kalagayan mo?”
  rationale: May posibleng pahiwatig ang tanong tungkol sa bagong kalagayan ni Ruth o sa kinalabasan ng pakikipagtagpo niya kay Boaz, ngunit hindi tahasang sinasabi ng Hebreo kung alin. Pinananatili ng literal na salin ang tunay na tensiyon at kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “biyenan” ayon sa karaniwang gamit; nilinaw ng mga panghalip na “nito” at “rito” na si Noemi ang kausap nang hindi inuulit ang kanyang pangalan. Pinanatili sa pangunahing teksto ang literal at αmbiguong “Sino ka?”
