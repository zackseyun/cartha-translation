base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: tl
  text: Pagkatapos, sinabi niya, “Iabot mo rito ang balabal na suot mo at hawakan mo itong nakabuka.” Kaya hinawakan niya iyon nang nakabuka. Nagsukat siya ng anim na takal ng sebada[a] at ipinatong iyon sa kanya. Pagkatapos, pumasok si Boaz sa lungsod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anim na sebada”; hindi binanggit ang yunit ng panukat.
    reason: lexical_alternative
  - marker: b
    text: 'Ang panlalaking pandiwa sa Tekstong Masoretiko ay tumutukoy kay Boaz. Sa ilang sinaunang bersiyon at maraming salin, pambabae ang pagbasa: “Pumasok si Ruth sa lungsod.”'
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: Iabot mo rito
  rationale: Pautos na pambabaeng isahan na humihiling kay Ruth na iharap o iabot ang kasuotang gagamitin sa paglalagay ng sebada.
- source_word: הַמִּטְפַּחַת
  choice: ang balabal na suot mo
  rationale: Tumutukoy sa isang balot o panlabas na kasuotang sapat ang laki upang paglagyan at ipasan ang butil; mas angkop ang “balabal” kaysa “belo.”
- source_word: וְאֶחֳזִי בָהּ
  choice: at hawakan mo ito nang nakabuka
  rationale: Ang pandiwang אחז ay “hawakan” o “kapitan”; nililinaw ng “nang nakabuka” ang kilos na kailangan upang masalinan ng sebada ang balabal.
- source_word: וַיָּמָד
  choice: Nagsukat siya
  rationale: Pinananatili ang sadyang pagsukat at pagbabahagi ng butil.
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: anim na takal ng sebada
  rationale: Literal na “anim na sebada” ang Hebreo at walang tinukoy na yunit. Ang “takal” ay likas na panukat na pangkalahatan sa Filipino, habang ipinapaliwanag sa talababa na hindi nakasaad ang eksaktong yunit.
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: at ipinasan iyon sa kanya
  rationale: Ipinahihiwatig ng parirala na inilagay kay Ruth ang kargang sebada upang dalhin niya; natural sa Filipino ang “ipinasan” para sa ganitong karga.
- source_word: וַיָּבֹא הָעִיר
  choice: Pagkatapos, pumasok siya sa lungsod
  rationale: Bagaman hindi nagpapakita ng kasarian ang Filipino na “siya,” tinutukoy rito sa salin ang lalaking paksa ayon sa panlalaking pandiwa ng Tekstong Masoretiko; nililinaw sa talababa ang pagkakaiba ng sinaunang mga bersiyon.
theological_decisions:
- issue: Paksa ng huling sugnay וַיָּבֹא הָעִיר
  choice: Ang lalaki (si Boaz) ang pumasok sa lungsod, ayon sa panlalaking anyo ng pandiwa sa Tekstong Masoretiko.
  alternative: Ang babae (si Ruth) ang pumasok sa lungsod, ayon sa ilang sinaunang bersiyon at maraming salin.
  rationale: Hindi ito usaping doktrinal kundi tekstuwal at pasalaysay. Sinusunod ng pangunahing teksto ang WLC/MT, ngunit pinananatili sa talababa ang mahalagang alternatibo. Dahil walang kasarian ang panghalip na “siya” sa Filipino, tahasang ipinapaliwanag ng talababa ang pagbasa.
translation_notes:
  register: Modernong Filipino na magalang at salaysay ang himig. Ginamit ang “balabal” bilang malinaw na panlabas na kasuotan, “takal” bilang di-tiyak na yunit, at “ipinasan” upang natural na ilarawan ang paglalagay ng kargang sebada kay Ruth. Pareho ang anyo ng panlalaki at pambabaeng “siya” sa Filipino, kaya nilinaw sa talababa ang tekstuwal na pagkakaiba.
