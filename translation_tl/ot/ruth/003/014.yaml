  naturalness: Likas at marangal ang pangkalahatang Filipino. Mas maayos ang isang tuloy-tuloy na unang pangungusap upang maipakita na nanatili siyang nakahiga hanggang umaga. Ang “Huwag ipaalam” ay natural na paraan upang ihayag ang balintiyak na pagbabawal na huwag mabunyag ang bagay na ito.
  terminology: Ang “sa paanan niya,” “kapwa niya,” at “giikan” ay angkop na mga katumbas. Wastong pinanatili ang “ang babae” bilang tiyak na pagtukoy at hindi pinangalanan si Boaz sa pangunahing teksto.
