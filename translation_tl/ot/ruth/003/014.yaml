base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: tl
  text: Nanatili siyang nakahiga sa paanan niya hanggang umaga, at bumangon siya bago pa makilala ng isang tao ang kapwa niya.[a] At sinabi niya,[b] “Huwag ipaalam na dumating ang babae sa giikan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bago makilala ng isang tao ang kapwa niya.” Ang idyomang Hebreo ay nangangahulugang bago pa makilala o matukoy ng mga tao ang isa’t isa sa mahinang liwanag.
    reason: lexical_alternative
  - marker: b
    text: Malamang na si Boaz ang nagsasalita ayon sa konteksto, ngunit “At sinabi niya” lamang ang nasa tekstong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  choice: sa paanan niya
  rationale: Tumutukoy ang pangngalan sa kinaroroonan ng mga paa o sa dulong paanan ng hinihigaan. Likas sa Filipino ang “sa paanan niya” at hindi nito dinaragdagan ang salaysay ng tiyak na ayos ng higaan o katawan.
- source_word: בטרום
  choice: bago pa
  rationale: Ipinahahayag nito ang panahong nauna sa isang pangyayari. Natural sa makabagong Filipino ang “bago pa” sa ganitong sugnay.
- source_word: יכיר
  choice: makilala
  rationale: Ang pandiwa rito ay tumutukoy sa pagkilala o pagkakakilanlan sa isang tao. Sa kasunod na sugnay at sa konteksto ng mahinang liwanag, ang “makilala” ay nagpapahiwatig na hindi pa malinaw na matukoy ang mukha o pagkakakilanlan.
- source_word: איש את רעהו
  choice: ng isang tao ang kapwa niya
  rationale: Malapit ito sa anyong isahan ng Hebreo, “isang lalaki/tao ang kapwa niya,” habang ginagamit ang likas na pangkalahatang katawagang Filipino na “tao.” Ipinaliliwanag sa talababa ang idyomatikong diwa.
- source_word: אל יוודע
  choice: Huwag ipaalam
  rationale: Ang negatibong anyong balintiyak ay naghahayag na hindi dapat mabunyag ang pangyayari. Ang “Huwag ipaalam” ay malinaw at natural na pagbabawal sa Filipino nang hindi tinutukoy kung kanino ito sasabihin.
- source_word: האשה
  choice: ang babae
  rationale: Pinananatili nito ang tiyak na pantukoy ng Hebreo at tumutukoy kay Ruth bilang partikular na babaeng sangkot sa pangyayari.
- source_word: הגרן
  choice: giikan
  rationale: Ang “giikan” ang karaniwan at tuwirang katawagang Filipino para sa pook na pinaggigiikan.
- source_word: ויאמר
  choice: At sinabi niya
  rationale: Lalaking isahan ang di-binanggit na simuno sa Hebreo. Malamang na si Boaz ito ayon sa konteksto, ngunit hindi idinaragdag ang kaniyang pangalan sa pangunahing teksto.
theological_decisions:
- issue: Pagkilala sa nagsasalita sa ויאמר
  choice: “At sinabi niya” nang hindi pinapangalanan si Boaz sa pangunahing teksto.
  alternative: “At sinabi ni Boaz” para sa higit na tahasang paglilinaw.
  rationale: Malinaw na malamang si Boaz ang nagsasalita ayon sa konteksto, ngunit hindi hayagang binabanggit ng Hebreo ang kaniyang pangalan. Pinananatili ng salin ang di-tahasang simuno at inilalagay sa talababa ang makatuwirang pagkilala sa kaniya.
- issue: Moral o seksuwal na pahiwatig ng paghiga ni Ruth sa paanan
  choice: Tuwirang ilarawan ang kinalalagyan bilang “nahiga siya sa paanan niya,” nang walang karagdagang interpretasyon.
  alternative: Gumamit ng eupemismong nagpapahiwatig ng pakikipagtalik, o magdagdag ng paliwanag na tahasang itinatanggi ang gayong pahiwatig.
  rationale: Kinalalagyan at oras lamang ang tahasang inilalarawan ng talata. Hindi nito sinasabing may naganap na seksuwal na gawain, ngunit hindi rin ito nagdaragdag ng tahasang pagtatanggi; kaya pinananatili ang tensiyon ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na daloy ng salaysay, ang di-tahasang pagkakakilanlan ng nagsasalita, at ang hindi nalutas na pahiwatig ng tagpo. Inilipat ang panandang [a] sa sugnay na aktuwal nitong ipinaliliwanag.
