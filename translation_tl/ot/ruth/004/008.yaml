translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapagtubos” bilang maikli ngunit makabuluhang legal-pampamilyang katawagan, kalakip ang talababa upang hindi mawala ang saklaw nito. Inilagay ang pangkulturang talababa pagkatapos ng “sandalyas,” ang mismong kilos na ipinapaliwanag nito.
