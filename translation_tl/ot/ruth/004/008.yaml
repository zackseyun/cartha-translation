  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: tl
  text: At sinabi ng tagapagtubos[a] kay Boaz, “Bilhin mo para sa iyong sarili.” At hinubad ng tagapagtubos ang kanyang sandalyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kamag-anak na tagapagtubos.” Ang salitang Hebreo ay tumutukoy sa isang malapit na kamag-anak na may legal na pananagutang tubusin ang ari-arian ng pamilya o pangalagaan ang pagpapatuloy ng angkan.
    reason: lexical_alternative
  - marker: b
    text: Ang paghuhubad ng sandalyas ay nakaugaliang legal na tanda sa ganitong transaksiyon; ihambing sa Ruth 4:7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kaya sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay at ipinahihiwatig dito ang bunga ng naunang usapan; natural sa Tagalog ang “Kaya sinabi.”
- source_word: הַגֹּאֵל
  choice: ang tagapagtubos
  rationale: Tumutukoy ang גאל sa malapit na kamag-anak na may pananagutang tubusin ang ari-arian o ipagpatuloy ang angkan. Pinananatili ng “tagapagtubos” ang mahalagang salitang-ugat nang hindi isinasama sa talata ang buong paliwanag legal.
- source_word: לְבֹעַז
  choice: kay Boaz
  rationale: Karaniwang Tagalog na anyo para sa pang-ukol na tumutukoy sa taong kinakausap at sa pangalang pantangi.
- source_word: קְנֵה
  choice: Bilhin
  rationale: Tuwirang pautos ng קנה sa konteksto ng legal na transaksiyon; mas natural at tiyak ang “bilhin” kaysa “kunin” o “angkinin.”
- source_word: לָךְ
  choice: para sa iyong sarili
  rationale: Ipinakikita ng parirala na si Boaz mismo ang kukuha ng karapatang bumili; malinaw na naihahayag ng reflexive na pariralang ito ang diin ng Hebreo.
- source_word: וַיִּשְׁלֹף
  choice: At hinubad niya
  rationale: Ang pandiwa ay nangangahulugang bunutin o alisin; para sa kasuotan sa paa, natural sa Tagalog ang “hinubad.”
- source_word: נַעֲלוֹ
  choice: ang kanyang sandalyas
  rationale: Ang נַעַל ay kasuotang pangpaa na angkop isaling “sandalyas” sa sinaunang konteksto; pinananatili ng “kanyang” ang panlalaking isahang hulapi.
