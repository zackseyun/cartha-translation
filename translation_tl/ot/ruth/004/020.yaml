base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/020.yaml
  text: Amminadab fathered Nahshon[a], and Nahshon fathered Salmah.
translation:
  language: tl
  text: At si Aminadab ang naging ama ni Naason, at si Naason ang naging ama ni Salma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Salma; ginagamit ng ilang salin ang “Salmon” upang iayon sa magkakatulad na talaangkanan.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּינָדָב
  choice: Aminadab
  rationale: Pangalan ng tao; isinalin sa baybay na likas at madaling basahin sa Filipino.
- source_word: הוֹלִיד
  choice: naging ama ni
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay nangangahulugang ‘magkaanak bilang ama’ o ‘maging ama ni.’ Likas ito sa modernong Filipino at pinananatili ang panlalaking ugnayang ipinahihiwatig ng Hebreo.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at wala itong hiwalay na katumbas na salita sa Filipino.
- source_word: נַחְשׁוֹן
  choice: Naason
  rationale: Pangalan ng tao; ang baybay ay iniangkop sa karaniwang pagbigkas at ortograpiyang Filipino habang kinakatawan ang pangalang Hebreo.
- source_word: וְ
  choice: at
  rationale: Payak na pang-ugnay sa dalawang sugnay ng talaangkanan.
- source_word: שַׂלְמָה
  choice: Salma
  rationale: Tuwirang kinakatawan ang anyong Hebreo na שַׂלְמָה; hindi ito pinalitan ng tradisyonal na anyong ‘Salmon’ mula sa magkakatulad na talaangkanan.
theological_decisions: []
translation_notes:
  register: Gumamit ng payak, marangal, at makabagong Filipino. Ang pariralang “naging ama ni” ay mas natural kaysa sa makalumang “ipinanganak si” o “begot,” at malinaw na nagpapahayag ng ugnayang patrilinyal sa talaangkanan. Inilagay ang talababa pagkatapos ng “Salma,” sapagkat iyon ang pangalang tinatalakay nito.
