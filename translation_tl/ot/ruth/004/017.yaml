  to: Pagkatapos, binigyan siya ng mga babaeng kapitbahay ng isang pangalan. Sinabi nila, “Isang anak na lalaki ang ipinanganak para kay Noemi.”[a] At pinangalanan nila siyang Obed. Siya ang ama ni Jesse, ang ama ni David.
