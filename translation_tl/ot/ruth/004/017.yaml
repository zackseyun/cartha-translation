base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: tl
  text: Pagkatapos, binigyan siya ng mga babaeng kapitbahay ng isang pangalan. Sinabi nila, “Isang anak na lalaki ang ipinanganak para kay Noemi.”[a] At pinangalanan nila siyang Obed. Siya ang ama ni Jesse, ang ama ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi sinasabing si Noemi ang biyolohikal na ina. Tinutukoy ng mga babae ang pagpapanumbalik ng kanyang sambahayan at ang pagpapatuloy ng kanyang angkan sa pamamagitan ng anak ni Ruth.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: mga babaeng kapitbahay
  rationale: Tiyak na pambabae at maramihan ang anyong Hebreo; malinaw at natural sa modernong Filipino ang pariralang ito.
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: binigyan siya ng pangalan
  rationale: Pinananatili nito ang di-tuwirang anyo ng idyomang Hebreo at inihihiwalay sa kasunod na pormulang tahasang nagsasaad ng pangalang Obed.
- source_word: לֵאמֹר
  choice: Sinabi nila
  rationale: Natural na panimulang panipi sa Filipino na naghahayag ng nilalaman ng sinabi ng mga babae.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: Isang anak na lalaki ang ipinanganak para kay Noemi
  rationale: 'Pinananatili ang balintiyak na pandiwa at ang di-karaniwang ugnayang ipinahihiwatig ng לְ: si Noemi ang tumatanggap o nakikinabang sa pagsilang, nang hindi siya ipinakikilalang biyolohikal na ina.'
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: Pinangalanan nila siyang Obed
  rationale: Ito ang malinaw at likas na katumbas sa Filipino ng karaniwang pormula ng pagbibigay-pangalan sa Hebreo.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Isinalin-baybay bilang pangalang pantangi sa halip na isalin ang posibleng kahulugang kaugnay ng paglilingkod.
- source_word: אֲבִי
  choice: ama ni
  rationale: Tuwirang pagkaama ang ipinakikita ng malapit na talaangkanang Obed–Jesse–David, kaya hindi kailangang gawing mas malawak na 'ninuno ni.'
- source_word: יִשַׁי
  choice: Jesse
  rationale: Ginamit ang kinagawiang anyo ng pangalang ito sa mga saling Bibliya sa Filipino.
- source_word: דָוִד
  choice: David
  rationale: Ginamit ang kinagawiang anyo ng pangalang ito sa Filipino.
theological_decisions:
- issue: Ang kaugnayan ni Noemi sa sanggol sa pahayag na יֻלַּד בֵּן לְנָעֳמִי
  choice: Panatilihin sa pangunahing teksto ang 'ipinanganak para kay Noemi.'
  alternative: Isang apo ang ipinanganak kay Noemi; Nagkaroon ng anak si Noemi
  rationale: Ipinagdiriwang ng pananalita ng mga kapitbahay ang pagpapanumbalik ng sambahayan at ang pagpapatuloy ng angkan ni Noemi sa pamamagitan ng anak ni Ruth. Hindi dapat gawing tahasang 'apo' ang Hebreo, ni ipahiwatig na si Noemi ang biyolohikal na ina.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang 'mga babaeng kapitbahay' upang panatilihin ang kasarian at ugnayang panlokal sa Hebreo; pinanatili rin ang pampanitikang tensiyon ng 'para kay Noemi.'
