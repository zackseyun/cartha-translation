  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: tl
  text: At siya ang magpapanumbalik ng iyong buhay at magtataguyod sa iyo sa iyong katandaan[a], sapagkat ang iyong manugang, na nagmamahal sa iyo, ang nagsilang sa kanya—siya na mas mabuti para sa iyo kaysa pitong anak na lalaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “iyong uban”; isang Hebreong paraan ng pagtukoy sa katandaan.
    reason: lexical_alternative
  - marker: b
    text: Ang “pitong anak na lalaki” ay larawan ng ganap o saganang pagpapala. Ipinahihiwatig nito na mas mahalaga kay Naomi si Ruth kaysa sa inaakalang sukdulang pagpapala ng pagkakaroon ng maraming anak na lalaki.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: At siya ang magiging
  rationale: Ang anyong pandiwa sa konteksto ay nagpapahayag ng magiging bunga o katiyakan tungkol sa sanggol; gayunman, sa buong pangungusap, ang natural na Filipino ay naipahayag sa hulma na 'siya ang magpapanumbalik ... at mag-aaruga.'
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: magpapanumbalik ng iyong buhay
  rationale: Ang מֵשִׁיב ay tumutukoy sa pagpapanumbalik, at ang נֶפֶשׁ dito ay buhay o sarili, hindi kinakailangang 'kaluluwa.' Isinama ang 'iyong' upang malinaw ang patungkol kay Naomi, na likas na ipinahihiwatig ng Hebrew.
- source_word: וּלְכַלְכֵּל
  choice: at mag-aaruga sa iyo
  rationale: Ang כלכל ay nagsasaad ng patuloy na pagtustos, pagsuporta, o pag-aaruga. Ang 'mag-aaruga sa iyo' ay natural sa Filipino at angkop sa pag-aalaga sa katandaan.
- source_word: אֶת שֵׂיבָתֵךְ
  choice: sa iyong katandaan
  rationale: Literal itong tumutukoy sa 'iyong uban,' ngunit idyomatikong nangangahulugang panahon ng katandaan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag o pagpapala.
- source_word: כַלָּתֵךְ
  choice: iyong manugang
  rationale: Ito ang natural at kontekstuwal na tawag sa kaugnayan ni Ruth kay Naomi sa Filipino.
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: na nagmamahal sa iyo
  rationale: Bagaman perpektibo ang anyo sa Hebrew, inilalarawan nito ang napatunayan at nagpapatuloy na pag-ibig ni Ruth kay Naomi.
- source_word: יְלָדַתּוּ
  choice: isinilang siya
  rationale: Ang panlalaking hulapi ay tumutukoy sa sanggol na lalaki. Ang baligtad na ayos na 'isinilang siya ng iyong manugang' ay malinaw at natural sa Filipino.
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: siya na higit na mabuti para sa iyo
  rationale: Pinananatili nito ang paghahambing at ang relasyonal na pakinabang o halaga ni Ruth para kay Naomi.
- source_word: מִשִּׁבְעָה בָּנִים
  choice: kaysa pitong anak na lalaki
  rationale: Hayagang 'mga anak na lalaki' ang Hebrew. Pinananatili ang pito bilang larawang kultural ng kasaganaan o kaganapan.
theological_decisions:
- issue: Pagpapakahulugan sa נֶפֶשׁ
  choice: buhay
  alternative: kaluluwa; sarili
  rationale: Ang konteksto ay ang pagpapanumbalik ng buhay at kinabukasan ni Naomi sa loob ng pamilya, hindi isang pahayag tungkol sa hiwalay na di-materyal na kaluluwa.
- issue: Kasariang tinutukoy sa מִשִּׁבְעָה בָּנִים
  choice: pitong anak na lalaki
  alternative: pitong anak
  rationale: Tiyak na panlalaki ang בָּנִים at mahalaga ang sinaunang kultural na paghahambing; hindi ito dapat gawing neutral.
- issue: Tiyak na pahayag o hiling sa וְהָיָה
  choice: pahayag tungkol sa magiging papel ng sanggol
  alternative: nawa'y siya ang maging
  rationale: Maaaring madama ang konteksto bilang pagpapala, ngunit ang anyo ay likas na mababasa bilang pahayag ng magiging resulta. Pinananatili ng panghinaharap na mga pandiwa ang diwang iyon nang hindi ginagawang tahasang kahilingan.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang 'mag-aaruga' sa halip na mas teknikal na 'tutustos' upang saklawin ang patuloy na suporta at pangangalaga. Pinanatili ang 'anak na lalaki' at ang bilang na pito dahil mahalaga ang mga ito sa sinaunang paghahambing.
