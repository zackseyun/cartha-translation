revisions:
- from: At siya ang magpapanumbalik ng iyong buhay at mag-aaruga sa iyo sa iyong katandaan[a], sapagkat isinilang siya ng iyong manugang na nagmamahal sa iyo—siya na higit na mabuti para sa iyo kaysa pitong anak na lalaki.[b]
  to: At siya ang magpapanumbalik ng iyong buhay at magtataguyod sa iyo sa iyong katandaan[a], sapagkat ang iyong manugang, na nagmamahal sa iyo, ang nagsilang sa kanya—siya na mas mabuti para sa iyo kaysa pitong anak na lalaki.[b]
  rationale: Pinalitan ang “mag-aaruga” ng “magtataguyod” upang maipahayag ang patuloy na pagsuporta at pagtustos na nasa וּלְכַלְכֵּל. Inayos ang sugnay tungkol sa panganganak upang maging malinaw at likas sa modernong Filipino, nang hindi nagdaragdag ng kahulugan. Pinanatili ang hinaharap na pahayag, ang paghahambing sa pitong anak na lalaki, at ang mga umiiral na footnote anchor.
