source:
  edition: WLC
  text: וּ/בֹ֨עַז עָלָ֣ה הַ/שַּׁעַר֮ וַ/יֵּ֣שֶׁב שָׁם֒ וְ/הִנֵּ֨ה הַ/גֹּאֵ֤ל עֹבֵר֙ אֲשֶׁ֣ר דִּבֶּר בֹּ֔עַז וַ/יֹּ֛אמֶר ס֥וּרָ/ה שְׁבָ/ה פֹּ֖ה פְּלֹנִ֣י אַלְמֹנִ֑י וַ/יָּ֖סַר וַ/יֵּשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: tl
  text: Umakyat si Boaz sa pintuang-bayan at umupo roon.[a] At narito, dumaraan ang kamag-anak na tagatubos na binanggit ni Boaz. Sinabi niya, “Lumihis ka at umupo rito, Ginoong Kuwan.[b]” Kaya lumihis siya at umupo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pintuang-bayan ang karaniwang pampublikong lugar para sa mga usaping legal at sibiko.
    reason: cultural_note
  - marker: b
    text: Sa Hebreo, “Peloni Almoni,” isang idyomang katulad ng “kuwan” o “si ganito,” na sadyang hindi binabanggit ang pangalan ng lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: Umakyat ... sa pintuang-bayan
  rationale: Pinananatili ng “umakyat” ang direksiyonal na diwa ng עָלָה, habang nililinaw ng “pintuang-bayan” na ang tinutukoy ay ang pampublikong tarangkahan ng pamayanan.
- source_word: וְהִנֵּה
  choice: At iyon nga
  rationale: Isang natural ngunit marangal na panandang pasalaysay na nagtutuon ng pansin sa mahalagang pagdating ng lalaki, nang hindi nagpapahiwatig na nagkataon lamang ito.
- source_word: הַגֹּאֵל
  choice: kamag-anak na tagatubos
  rationale: Ipinahahayag nito kapwa ang ugnayang pampamilya at ang tungkuling legal ng גֹּאֵל sa konteksto ng Ruth; ang “tagatubos” lamang ay maaaring magkubli sa mahalagang aspektong pampamilya.
- source_word: עֹבֵר
  choice: dumaraan
  rationale: Ang aspektong nagpapatuloy ng Hebreong participle ay natural na naipahahayag sa “dumaraan.”
- source_word: סוּרָה שְׁבָה פֹה
  choice: Lumihis ka muna at maupo rito
  rationale: Pinananatili ng “lumihis” ang paanyayang lumihis sa dinaraanan; ang “muna” ay natural na panandang magalang sa Filipino at hindi binabago ang layon ng utos.
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: Ginoong Kuwan
  rationale: Ang “Kuwan” ay likas na pamalit sa pangalang hindi sinasabi sa Filipino, at ang “Ginoong” ay angkop sa tuwirang pagtawag sa isang lalaking hindi pinangalanan.
- source_word: וַיָּסַר וַיֵּשֶׁב
  choice: lumihis ang lalaki at umupo
  rationale: Inuulit ng “lumihis” ang pandiwang ginamit sa paanyaya ni Boaz, gaya ng pag-uulit sa Hebreo, at malinaw na ipinakikitang sumunod ang lalaki.
theological_decisions:
- issue: Saklaw ng kahulugan ng גֹּאֵל
  choice: kamag-anak na tagatubos
  alternative: tagatubos / pinakamalapit na kamag-anak
  rationale: Hindi ito tinumbasan ng terminong may natatanging denominasyonal na kahulugan. Pinananatili ang legal na pagtubos at ang pagkakamag-anak nang hindi ipinapalagay dito ang lahat ng detalye ng tungkulin o kung siya ang pinakamalapit na kamag-anak.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pintuang-bayan” sa halip na payak na “pintuan” upang maiwasang mapagkamalan itong pintuan ng isang gusali. Ang “Ginoong Kuwan” ay bahagyang may kulay na pasalita ngunit angkop sa tuwirang tawag at malinaw na nagpapanatili sa sinadyang di-pagbanggit sa pangalan.
