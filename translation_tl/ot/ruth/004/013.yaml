base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: tl
  text: Kaya kinuha ni Boaz si Ruth, at siya ay naging asawa niya. Sinipingan niya si Ruth, at ipinagkaloob ni Yahweh sa kaniya ang paglilihi[a]. At nagsilang siya ng isang anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibinigay ni Yahweh sa kaniya ang paglilihi”; maaari ring, “binigyan siya ni Yahweh ng kakayahang maglihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... אֶת רוּת וַתְּהִי לוֹ לְאִשָּׁה
  choice: kinuha ni Boaz si Ruth bilang asawa
  rationale: Pinagsama sa isang likas na pariralang Filipino ang literal na ‘kinuha si Ruth’ at ang kasunod na paglilinaw na ‘naging asawa niya ito.’ Napananatili nito ang kahulugang pag-aasawa nang hindi lumilikha ng di-likas o mapanlinlang na pahayag na tila pag-aari lamang ang tinutukoy.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: Sinipingan niya ito
  rationale: Ang Hebreo ay isang mahinhing idyoma para sa pagtatalik ng mag-asawa. Ang ‘sinipingan’ ay malinaw ngunit marangal at hindi labis na tahasan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na banal na pangalan sa halip na palitan ito ng titulong ‘PANGINOON.’
- source_word: וַיִּתֵּן ... לָהּ הֵרָיוֹן
  choice: ipinagkaloob ... na magdalang-tao siya
  rationale: Inihahayag nito nang natural sa Filipino ang Diyos bilang nagbibigay ng paglilihi o pagdadalang-tao, habang pinananatili ang diwa ng pandiwang ‘nagbigay’ sa magalang na ‘ipinagkaloob.’
- source_word: וַתֵּלֶד בֵּן
  choice: nagsilang siya ng isang anak na lalaki
  rationale: Likas at tuwirang salin ito ng panganganak ng isang anak na lalaki, na angkop sa salaysay.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Ang pagkilos ng Diyos sa pagdadalang-tao ni Ruth
  choice: ipinagkaloob ni Yahweh na magdalang-tao siya
  alternative: ibinigay ni Yahweh sa kaniya ang paglilihi; binigyan siya ni Yahweh ng kakayahang maglihi
  rationale: Tahasang iniuugnay ng Hebreo kay Yahweh ang pagkakaroon ni Ruth ng paglilihi o pagdadalang-tao. Hindi nilalagyan ng salin ng karagdagang paliwanag ang uri o paraan ng pagkilos na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘sinipingan’ bilang mahinhing idyoma, at inilagay ang talababa pagkatapos ng pariralang tungkol sa pagdadalang-tao, na siyang aktuwal na tinutukoy nito.
