translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kamag-anak na manunubos” upang maunawaan ng karaniwang mambabasa ang pampamilyang papel, at pinanatili ang salitang-ugat na “tubos” sa buong talata hangga't hindi nagiging pilit ang pangungusap.
