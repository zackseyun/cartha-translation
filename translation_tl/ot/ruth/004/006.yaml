base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: tl
  text: Sinabi ng kamag-anak na manunubos[a], “Hindi ko ito matutubos para sa sarili ko, baka mapinsala ko ang sarili kong mana. Ikaw na ang tumubos nito para sa sarili mo sa bisa ng karapatan kong tumubos[b], sapagkat hindi ko ito matutubos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kamag-anak na manunubos” ay ang mas malapit na kamag-anak na may unang karapatan bago si Boaz. May legal siyang karapatan at tungkuling tubusin ang ari-arian ng pamilya.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “ang pagtubos ko.” Sa kontekstong ito, ang pangngalang Hebreo ay tumutukoy sa legal na karapatan o tungkuling tumubos sa ari-arian at panatilihin ang linya ng pamilya sa pamamagitan ng pag-aasawa kay Ruth.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: ang kamag-anak na manunubos
  rationale: Ang participle mula sa גאל ay tumutukoy rito sa lalaking may pampamilyang karapatan at tungkuling tumubos. Ginagawang hayag ng “kamag-anak” ang papel na malinaw sa salaysay, samantalang pinananatili ng “manunubos” ang mahalagang salitang-ugat.
- source_word: לִגְאֹל / גְּאַל / גְּאֻלָּתִי
  choice: tubusin / tumubos / karapatan kong tumubos
  rationale: Pinananatili hangga't natural ang pag-uulit ng salitang-ugat na גאל. Sa kontekstong legal, ang pangngalang גְּאֻלָּה ay tumutukoy sa karapatan o pananagutang tumubos, kaya mas malinaw ang “karapatan kong tumubos” kaysa sa literal ngunit malabong “pagtubos ko.”
- source_word: לִי
  choice: para sa sarili ko
  rationale: Ipinahahayag nito ang personal na kapakinabangan o epekto sa nagsasalita, hindi lamang ang simpleng “para sa akin.”
- source_word: פֶּן
  choice: baka
  rationale: Natural na ipinahahayag ng “baka” ang kinatatakutang kahihinatnan na ipinakikilala ng Hebrew פֶּן.
- source_word: אַשְׁחִית
  choice: mapinsala ko
  rationale: Ang Hiphil ng שׁחת dito ay nangangahulugang magdulot ng malubhang pinsalang pangkabuhayan o legal sa mana, hindi kinakailangang literal na wasakin ito.
- source_word: נַחֲלָתִי
  choice: ang sarili kong mana
  rationale: Tumutukoy ito sa minanang ari-arian o patrimonyo ng lalaki. Ipinakikita ng “sarili kong” ang kaibahan nito sa ari-ariang tutubusin.
- source_word: לְךָ אַתָּה
  choice: para sa sarili mo
  rationale: Natural nitong naihahayag sa Filipino ang diin ng hiwalay na panghalip אַתָּה kasabay ng pariralang לְךָ.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag na inuulit ang dahilan ng pagtanggi ng lalaki; ang “sapagkat” ay malinaw at marangal sa tuwirang pananalita.
