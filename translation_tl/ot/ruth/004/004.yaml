  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְ/ךָ֣ לֵ/אמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽ/יֹּשְׁבִים֮ וְ/נֶ֣גֶד זִקְנֵ֣י עַמִּ/י֒ אִם תִּגְאַל֙ גְּאָ֔ל וְ/אִם לֹ֨א יִגְאַ֜ל הַגִּ֣ידָ/ה לִּ֗/י ו/אדע כִּ֣י אֵ֤ין זוּלָֽתְ/ךָ֙ לִ/גְא֔וֹל וְ/אָנֹכִ֖י אַחֲרֶ֑י/ךָ וַ/יֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: tl
  text: 'Kaya naisip kong ipaalam ito sa iyo[a]: ‘Bilhin mo ito sa harap ng mga nakaupo rito at ng mga nakatatanda ng aking bayan. Kung tutubusin mo ito, tubusin mo; ngunit kung hindi niya ito tutubusin[b], sabihin mo sa akin upang malaman ko, sapagkat walang iba maliban sa iyo na maaaring tumubos nito, at ako ang kasunod mo.’ Sumagot siya, ‘Tutubusin ko ito.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ilantad ang iyong tainga,” isang idyomang nangangahulugang “ipaalam sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: Mababasa sa tekstong Hebreo, “kung hindi niya ito tutubusin.” Dahil ang kausap ay tuwirang tinatawag na “ikaw” sa mga katabing pangungusap, nauunawaan ito ng ilan bilang “kung hindi mo ito tutubusin.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: ipaalam ito sa iyo
  rationale: Natural na salin ng idyomang literal na ‘ilantad ang iyong tainga’; malinaw nitong ipinahihiwatig ang pagpapabatid nang hindi dinadala sa pangunahing teksto ang di-likas na literal na larawan.
- source_word: קְנֵה
  choice: Bilhin mo ito
  rationale: Sa konteksto ng lupain at pampublikong transaksiyon, ang ‘bilhin’ ang pinakanatural na modernong Tagalog para sa קנה, habang ang kasunod na ‘tubusin’ ang nagpapanatili sa natatanging legal-pampamilyang katangian ng gawain.
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: sa harap ng mga nakaupo rito
  rationale: Ipinapakita ng נגד ang pagkilos sa kanilang harapan bilang mga saksi; idinagdag ang ‘rito’ mula sa malinaw na tagpo upang maging natural sa Tagalog.
- source_word: זִקְנֵי עַמִּי
  choice: matatandang pinuno ng aking bayan
  rationale: Ang זקנים ay hindi lamang matatanda sa edad kundi kinikilalang mga pinuno ng pamayanan. Pinananatili ng ‘aking bayan’ ang lawak ng עמי nang hindi ito pinakikitid sa angkan.
- source_word: תִּגְאַל ... גְּאָל
  choice: Kung tutubusin mo ito, tubusin mo
  rationale: Pinananatili ang pag-uulit ng ugat גאל at ang diin ng Hebreo. Ang ‘tubusin’ ay angkop sa legal at pampamilyang pagbawi ng ari-arian.
- source_word: וְאִם לֹא יִגְאַל
  choice: ngunit kung hindi niya ito tutubusin
  rationale: Pinananatili ang ikatlong panauhang anyo ng tekstong Masoretiko, kahit bigla itong lumilihis mula sa tuwirang pakikipag-usap sa ikalawang panauhan; ipinaliliwanag sa talababa ang mas makinis na alternatibo.
- source_word: הַגִּידָה לִּי
  choice: sabihin mo sa akin
  rationale: Direkta, natural, at sapat na marangal na katumbas ng pautos na pandiwa.
- source_word: אֵין זוּלָתְךָ לִגְאוֹל
  choice: walang ibang maaaring tumubos nito maliban sa iyo
  rationale: Malinaw na ipinahahayag ang pagiging bukod-tangi ng kausap sa pagkakasunod ng karapatang tumubos; ang ‘maaaring’ ay tumutukoy sa legal na kakayahan sa konteksto, hindi lamang sa pisikal na posibilidad.
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: at ako ang kasunod mo
  rationale: Natural na Tagalog para sa pagkakasunod sa legal na karapatan o tungkulin, nang hindi pinapalabo bilang simpleng pisikal na pagsunod.
- source_word: אָנֹכִי אֶגְאָל
  choice: Tutubusin ko ito
  rationale: Tuwirang pagtanggap sa karapatan o tungkuling tumubos; ang bagay na ‘ito’ ay malinaw na ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa גאל sa legal-pampamilyang konteksto
  choice: tubusin
  alternative: gampanan ang tungkulin bilang kamag-anak na manunubos / bilhing muli
  rationale: Pinananatili ng ‘tubusin’ ang mahalagang legal at teolohikal na ugnayan ng termino nang hindi ipinapasok sa bawat gamit ang mas mahabang interpretibong katawagang ‘kamag-anak na manunubos.’
- issue: Paglipat mula ikalawa tungo sa ikatlong panauhan sa וְאִם לֹא יִגְאַל
  choice: kung hindi niya ito tutubusin
  alternative: kung hindi mo ito tutubusin
  rationale: Sinusunod ng pangunahing teksto ang nakasulat at binigkas na anyong ikatlong panauhan sa WLC/MT, sa halip na tahimik itong pakinisin. Inilalagay sa talababa ang kontekstuwal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘matatandang pinuno’ upang maipahayag ang pampamayanang tungkulin ng זקנים, at pinanatili ang ‘tubusin’ bilang susing legal-pampamilyang termino. Ang di-inaasahang ikatlong panauhan ng MT ay hindi pinakinis sa pangunahing teksto.
