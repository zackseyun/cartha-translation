  text: Then he took ten men from the elders of the city and said[a], “Sit here,” and they sat down.
translation:
  language: tl
  text: Pagkatapos, kumuha siya[a] ng sampung lalaki mula sa mga nakatatandang pinuno ng lungsod at sinabi, “Maupo kayo rito.” At umupo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumili siya ng sampung lalaki mula sa mga nakatatandang pinuno ng lungsod.” Ang pandiwang Hebreo ay maaaring mangahulugang kumuha para sa isang layunin; dito, malamang na pinili niya sila para sa isang legal na usapin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kumuha siya
  rationale: Pinananatili nito ang karaniwang kahulugan ng לקח, habang ipinahihiwatig ng konteksto na kinuha o pinili sila para sa isang pampublikong legal na gawain.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: sampung lalaki
  rationale: Tuwirang tumutukoy ang parirala sa sampung lalaking nasa hustong gulang na kalahok sa pampublikong pagdinig.
- source_word: מִזִּקְנֵי הָעִיר
  choice: mula sa matatandang pinuno ng lungsod
  rationale: Ang זקני העיר ay mga kinikilalang nakatatandang pinuno ng pamayanan; nililinaw ng “pinuno” ang kanilang tungkuling pansibiko, at pinananatili ng “mula sa” ang partitive na diwa ng מִן.
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Ito ang tuwiran at likas na salin ng karaniwang pandiwang panalaysay bago ang siniping utos.
- source_word: שְׁבוּ
  choice: Maupo kayo
  rationale: Magalang at natural na maramihang pautos sa modernong Tagalog, angkop sa pag-anyaya sa mga pinuno na lumuklok para sa pagdinig.
- source_word: פֹה
  choice: rito
  rationale: Likas na deiktikong katumbas ng פֹה kapag tumutukoy sa lugar na malapit sa nagsasalita.
- source_word: וַיֵּשֵׁבוּ
  choice: umupo sila
  rationale: Pinananatili ang pag-uulit ng ugat na ישב at malinaw na inilalahad ang pagtugon nila sa utos.
