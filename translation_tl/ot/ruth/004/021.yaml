  text: And Salmon fathered Boaz[a], and Boaz fathered Obed.
translation:
  language: tl
  text: At si Salmon ang naging ama ni Boaz[a], at si Boaz ang naging ama ni Obed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagkaroon si Salmon ng anak na si Boaz.” Ang pandiwang Hebreo ay karaniwang katawagan sa talaan ng lahi at nangangahulugang “naging ama ng” o “nagkaanak ng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׂלְמוֹן
  choice: At si Salmon
  rationale: Isinalin ang pang-ugnay na וְ bilang “At” upang mapanatili ang sunod-sunod na ayos ng talaan ng lahi; ginamit ang karaniwang anyong Filipino ng pangalang Salmon.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Sa Hiphil at sa konteksto ng talaan ng lahi, ang ילד ay nangangahulugang magkaanak o maging ama ng isang anak. Pinili ang natural at dignified na pariralang Filipino na malinaw na nagpapanatili sa ugnayang panlalaking ipinahahayag ng Hebreo.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang likas na tuwirang katumbas sa Filipino.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalan sa Filipino.
- source_word: וּ/בֹעַז
  choice: at si Boaz
  rationale: Hayagang isinalin ang prefixed conjunction bilang “at” upang mapanatili ang koordinasyon at ritmo ng talaan ng lahi.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Inulit ang parehong salin upang maging pare-pareho ang pormula ng talaan ng lahi.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalan sa Filipino.
