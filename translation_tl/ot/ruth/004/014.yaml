  text: וַ/תֹּאמַ֤רְנָה הַ/נָּשִׁים֙ אֶֽל נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛/ךְ גֹּאֵ֖ל הַ/יּ֑וֹם וְ/יִקָּרֵ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: tl
  text: Sinabi ng mga babae kay Noemi, “Purihin si Yahweh, na hindi ka pinabayaang mawalan ng isang manunubos[a] sa araw na ito. Nawa'y makilala ang pangalan niya sa Israel[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “manunubos” ay maaari ring isaling “kamag-anak na manunubos” o “kamag-anak na tagapagtanggol”—isang malapit na kamag-anak na may tungkuling ibalik at ingatan ang ari-arian at pangalan ng angkan. Maaaring ang bagong silang na bata ang tuwirang tinutukoy dito bilang magpapanumbalik kay Noemi, bagaman maaaring kasama rin sa diwa ang ginampanang pagtubos ni Boaz.
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: Sa Hebreo, literal na “at nawa'y matawag ang pangalan niya sa Israel,” na nangangahulugang makilala, mabanggit, o parangalan ang pangalan niya sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה הַנָּשִׁים אֶל נָעֳמִי
  choice: Sinabi ng mga babae kay Noemi
  rationale: Natural na salaysay sa modernong Tagalog; ipinahihiwatig ng anyong pandiwa ang kasunod na pangyayari nang hindi kailangang piliting isalin ang waw bilang “at” o “pagkatapos.”
- source_word: בָּרוּךְ יְהוָה
  choice: Purihin si Yahweh
  rationale: Natural at marangal na anyo ng pormulang Hebreo ng pagpapala/papuri, habang pinananatili ang personal na pangalang Yahweh.
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: na hindi ka pinabayaang mawalan ng
  rationale: 'Ipinahahayag ang idyomatikong diwa ng Hiphil ng שבת: hindi hinayaang mawalan o maiwang walang manunubos si Noemi.'
- source_word: גֹּאֵל
  choice: manunubos
  rationale: Pinananatili ang pangunahing salitang legal-pampamilya sa Ruth. Ipinaliliwanag sa talababa ang tungkulin ng malapit na kamag-anak na nagbabalik at nag-iingat sa angkan.
- source_word: הַיּוֹם
  choice: sa araw na ito
  rationale: Malinaw at marangal na salin ng panahong tinutukoy; natural din ang “ngayon,” ngunit mas angkop dito ang bahagyang pormal na “sa araw na ito.”
- source_word: וְיִקָּרֵא שְׁמוֹ בְּיִשְׂרָאֵל
  choice: Nawa'y makilala ang pangalan niya sa Israel
  rationale: 'Ipinapahayag ang idyomatikong lakas ng literal na “matawag ang pangalan niya”: maging kilala, binabanggit, o pinararangalan sa Israel.'
theological_decisions:
- issue: Ang tinutukoy ng גֹּאֵל (“manunubos”)
  choice: Hindi tahasang tinukoy sa pangunahing teksto kung ang manunubos ay ang bagong silang na bata o kung saklaw rin ng pahayag ang ginampanang pagtubos ni Boaz.
  alternative: Tahasang tukuyin ang sanggol na si Obed bilang manunubos; o tukuyin si Boaz bilang manunubos.
  rationale: Mas malapit na tinutukoy ng konteksto ang bagong silang na bata, lalo na dahil kasunod ang “pangalan niya.” Gayunman, mahalaga rin sa buong kabanata ang legal na papel ni Boaz. Pinananatili ng salin ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Noemi,” ang karaniwang anyong Filipino ng pangalan. Iniwasan ang sobrang teknikal na salita sa pangunahing teksto at inilagay sa talababa ang legal-pampamilyang saklaw ng גֹּאֵל. Ang lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
