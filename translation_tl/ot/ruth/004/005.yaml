  text: וַ/יֹּ֣אמֶר בֹּ֔עַז בְּ/יוֹם קְנוֹתְ/ךָ֥ הַ/שָּׂדֶ֖ה מִ/יַּ֣ד נָעֳמִ֑י וּ֠/מֵ/אֵת ר֣וּת הַ/מּוֹאֲבִיָּ֤ה אֵֽשֶׁת הַ/מֵּת֙ קניתי לְ/הָקִ֥ים שֵׁם הַ/מֵּ֖ת עַל נַחֲלָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Boaz, “Sa araw na bilhin mo ang bukid mula kay Noemi, kukunin mo rin si Ruth na Moabita[a], ang asawa ng namatay, upang maitaguyod ang pangalan ng namatay sa kanyang mana[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa tekstong Hebreo, ang pandiwang kasunod ng pagbanggit kay Ruth ay literal na “binili ko” o “kinuha ko.” Dahil sa konteksto, marami ang umuunawa rito bilang “kukunin mo rin.”
    reason: textual_variant
  - marker: b
    text: Ibig sabihin, upang mapanatili ang pangalan at angkan ng namatay, pati ang kaugnayan nito sa minana niyang ari-arian.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: Sa araw na bilhin mo
  rationale: Pinananatili ang legal at temporal na diwa ng pariralang Hebreo, ngunit gumagamit ng likas na pananalita sa Tagalog.
- source_word: הַשָּׂדֶה
  choice: ang bukid
  rationale: Tuwirang tumutukoy sa tiyak na lupang pinag-uusapan sa transaksiyon.
- source_word: מִיַּד נָעֳמִי
  choice: mula kay Noemi
  rationale: Ang literal na ‘mula sa kamay ni Noemi’ ay idyoma ng paglilipat mula sa pag-aari o kapangyarihan niya; ang pinaikling anyo ang mas likas sa modernong Tagalog.
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה ... קניתי
  choice: kukunin mo rin si Ruth na Moabita
  rationale: 'Ipinahahayag ang kahulugang hinihingi ng daloy ng salaysay: kalakip ng pagtubos sa bukid ang pananagutan kay Ruth. Ang unang panauhang anyo sa tekstong Masoretiko ay itinatala sa talababa.'
- source_word: אֵשֶׁת הַמֵּת
  choice: ang asawa ng namatay
  rationale: Malapit sa literal na Hebreo at hindi ipinapalit ang mas interpretatibong ‘balo.’
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: upang maipagpatuloy ang pangalan ng namatay
  rationale: Natural na Tagalog para sa idyomang tumutukoy sa pagpapanatili ng angkan, pangalan, at karapatan ng namatay.
- source_word: עַל נַחֲלָתוֹ
  choice: sa kanyang mana
  rationale: Pinananatili ang ugnayan ng pangalan ng namatay sa minana niyang ari-arian, nang hindi gumagamit ng alanganing literal na ‘sa ibabaw ng kanyang mana.’
theological_decisions:
- issue: Tekstuwal at sintaktikong suliranin sa קניתי at sa sugnay tungkol kay Ruth
  choice: 'Isinalin ang pangunahing diwa bilang utos o pananagutang nakaatang sa mas malapit na manunubos: ‘kukunin mo rin si Ruth.’'
  alternative: 'Ayon sa pagkakabigkas ng tekstong Masoretiko: ‘kinuha ko’ o ‘binili ko si Ruth na Moabita’; maaari ring iugnay sa ibang paraan ang ‘mula kay Ruth’ sa pagbili ng bukid.'
  rationale: Sa konteksto, ipinaliliwanag ni Boaz kung ano ang pananagutan ng kamag-anak kapag tinubos nito ang bukid. Gayunman, hindi ikinukubli ang tunay na tekstuwal na tensiyon at inilalahad sa talababa ang unang-panauhang anyo.
- issue: Kahulugan ng pagpapatuloy sa pangalan ng namatay
  choice: Pinanatili sa teksto ang idyomang ‘maipagpatuloy ang pangalan’ nang walang dagdag na doktrinal na paliwanag.
  alternative: Tahasan itong iparaprasang ‘upang mapanatili ang angkan at karapatan sa lupa ng namatay.’
  rationale: Ang maikling idyoma ay nag-iingat sa legal-pampamilyang diwa ng talata; sapat ang talababa upang ipaliwanag ang kontekstong pangkultura.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘bilhin’ para sa bukid at ‘kukunin’ para kay Ruth upang maiwasan ang tunog na para bang isang taong ipinagbibili lamang, habang pinananatili ang legal na pananagutang ipinahihiwatig ng konteksto. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
