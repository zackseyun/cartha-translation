reference: Ruth 4:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: tl
  text: At gayundin, itinamo ko para sa aking sarili si Ruth na Moabita, ang asawa ni Mahlon, bilang aking asawa[a], upang maipagpatuloy ang pangalan ng namatay sa kanyang mana[b], upang hindi maputol ang pangalan ng namatay mula sa kanyang mga kapatid at mula sa tarangkahan ng kanyang bayan[c]. Kayo ang mga saksi ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “binili ko para sa aking sarili bilang asawa.” Ang pandiwang Hebreo ay maaaring mangahulugang pagtatamo sa pamamagitan ng pagbili sa isang legal na transaksiyon.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, upang mapanatili ang angkan at legal na katayuan ng namatay kaugnay ng minana niyang ari-arian.
    reason: cultural_note
  - marker: c
    text: Ang tarangkahan ng bayan ang pampublikong lugar kung saan sinasaksihan at pinagpapasiyahan ang mga usaping legal.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: At gayundin
  rationale: Pinananatili ang pandagdag na ugnayan at diin ng pahayag sa naunang legal na transaksiyon.
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: si Ruth na Moabita
  rationale: Likas na modernong Tagalog para sa pangalan at katawagang etniko.
- source_word: אֵשֶׁת מַחְלוֹן
  choice: na asawa ni Mahlon
  rationale: Sinusunod ang tahasang 'asawa ni Mahlon' sa Hebreo sa halip na gawing 'balo,' bagaman iyon ang kalagayan niya sa konteksto.
- source_word: קָנִיתִי לִי לְאִשָּׁה
  choice: inangkin ko ... upang maging asawa ko
  rationale: Ang 'inangkin' ay nagpapanatili ng legal na diwa ng pagkamit o pagtatamo sa transaksiyon, habang malinaw na itinatakda ng kasunod na parirala ang layuning pag-aasawa. Inilalahad sa talababa ang mas tuwirang alternatibo.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: para maipagpatuloy ang pangalan ng namatay
  rationale: Ang idyomang Hebreo na literal na 'ibangon ang pangalan' ay tumutukoy sa pagpapanatili ng angkan at legal na pagkakakilanlan ng namatay; ang saling ito ay malinaw at natural sa Tagalog.
- source_word: עַל נַחֲלָתוֹ
  choice: kaugnay ng kanyang mana
  rationale: Ipinakikita ang pagkakaugnay ng pangalan ng namatay at ng minanang ari-arian nang hindi pilit ang literal na 'sa ibabaw ng kanyang mana.'
- source_word: וְלֹא יִכָּרֵת
  choice: hindi mabura
  rationale: Natural na Tagalog para sa pagkawala ng pangalan o alaala, habang pinananatili ang bigat ng legal at pampamilyang bunga.
- source_word: מֵעִם אֶחָיו
  choice: mula sa kanyang mga kapatid
  rationale: Pinananatili ang literal na panlalaking maramihan sa Hebreo, kahit maaaring mas malawak ang saklaw nito sa angkan sa konteksto.
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: mula sa pintuang-bayan ng kanyang lugar
  rationale: Pinananatili ang larawang Hebreo ng pintuang-bayan bilang sentro ng pampublikong pagkilala at legal na paglilitis.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Kayo ang mga saksi sa araw na ito
  rationale: Malinaw at marangal na legal na deklarasyon sa mga taong nagtitipon.
theological_decisions:
- issue: Kalikasan ng ginawa ni Boaz kay Ruth sa konteksto ng pagtubos at batas
  choice: inangkin ko ... upang maging asawa ko
  alternative: binili ko ... upang maging asawa ko; kinuha ko bilang asawa
  rationale: Pinananatili nito ang legal at transaksiyonal na puwersa ng קנה, ngunit hindi nito ipinahihiwatig na hiwalay na binili si Ruth bilang isang bagay; tahasang nananatili ang layuning pag-aasawa at pagpapanumbalik ng mana at pangalan.
- issue: Kahulugan ng pagpapatuloy sa pangalan ng namatay
  choice: maipagpatuloy ang pangalan ng namatay kaugnay ng kanyang mana
  alternative: ibangon ang pangalan ng namatay sa ibabaw ng kanyang mana
  rationale: Inihahatid ang idyomatikong diwa ng pagpapanatili sa angkan at legal na katayuan nang hindi nagdaragdag ng isang tiyak na doktrinal na paliwanag.
- issue: Saklaw ng אֶחָיו
  choice: kanyang mga kapatid
  alternative: kanyang mga kamag-anak; kanyang mga kaangkan
  rationale: Sinusunod ang tiyak na salita ng pinagmulang teksto, habang hindi itinatanggi na maaaring may mas malawak na pang-angkan na saklaw sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na himig ng pampublikong deklarasyong legal, iniwasan ang lipas na bokabularyo, at ipinaliwanag sa mga talababa ang transaksiyonal at pangkulturang mga detalye.
