translation:
  language: tl
  text: Pagkatapos, kinuha ni Noemi ang bata at inilagay niya ito sa kanyang kandungan, at siya ang naging tagapag-alaga ng bata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקַּח
  choice: kinuha
  rationale: Karaniwang kahulugan ng לָקַח sa sunod-sunod na salaysay ang “kunin”; ang kasunod na paglalagay sa bata sa kandungan ay nagpapakitang pisikal na pagkilos ang tinutukoy.
- source_word: הַיֶּלֶד
  choice: ang bata
  rationale: Maaaring mangahulugang “bata” o “batang lalaki” ang יֶלֶד. Ang “bata” ay natural sa Filipino at angkop sa sanggol sa konteksto nang hindi dinaragdagan ang mismong salita.
- source_word: וַתְּשִׁתֵהוּ
  choice: inilagay ito
  rationale: Ang pandiwa ay nangangahulugang ilagay o ipuwesto. Natural ang “inilagay” para sa maingat na paglalagay ng bata sa kandungan.
- source_word: בְחֵיקָהּ
  choice: sa kanyang kandungan
  rationale: Ang חֵיק ay tumutukoy sa kandungan o dibdib na kinalalagyan o kinakandungan ng bata. “Sa kanyang kandungan” ang malinaw at natural na larawan sa modernong Filipino.
- source_word: וַתְּהִי לוֹ
  choice: siya ang naging ... ng bata
  rationale: Ang היה + ל ay nagpapahiwatig ng pagkakaroon ng bagong tungkulin o ugnayan. Ang “naging” ay natural na naghahayag ng pagbabagong ito; inulit ang “bata” upang maiwasan ang malabong panghalip.
- source_word: לְאֹמֶנֶת
  choice: tagapag-alaga
  rationale: Ang אֹמֶנֶת ay babaeng nag-aaruga, nagpapalaki, o kung minsan ay nagpapasuso sa bata. Mas malinaw sa kasalukuyang Filipino ang “tagapag-alaga” kaysa “nars,” na karaniwang nauunawaang propesyonal sa medisina.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang payak na takbo ng salaysay at ginamit ang “kandungan” para sa konkretong larawan ng חֵיק. Iniwasan ang “nars” dahil sa makabagong medikal na kahulugan nito.
