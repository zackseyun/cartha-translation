base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa tagapagtubos, “Ipinagbibili[b] ni Naomi, na nagbalik mula sa lupain ng Moab[c], ang bahagi ng bukid[a] na pag-aari ng ating kamag-anak na si Elimelec.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang parsela ng lupa.”
    reason: lexical_alternative
  - marker: b
    text: O “naipagbili.” Maaaring unawain ang anyong Hebreo bilang natapos nang kilos, ngunit dito ay isinalin itong kasalukuyang pagbebenta dahil bahagi pa ito ng nagpapatuloy na legal na usapan.
    reason: alternative_reading
  - marker: c
    text: Sa Hebreo, “mula sa bukid ng Moab,” isang idyoma para sa lupain o kanayunan ng Moab.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi niya
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural sa makabagong Filipino ang “Pagkatapos” bilang panandang sunod-sunod na pangyayari.
- source_word: לַגֹּאֵל
  choice: sa tagapagtubos
  rationale: Ang גֹּאֵל ay kamag-anak na may legal na pananagutang tumubos para sa angkan. Pinananatili ng “tagapagtubos” ang pangunahing legal na konsepto nang hindi nagdaragdag ng paliwanag sa mismong talata.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: ang bahagi ng bukid
  rationale: Malapit ito sa literal na anyo ng Hebreo at likas pa rin sa Filipino; maaaring tumukoy ang חֶלְקָה sa isang bahagi o parsela.
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: na pag-aari ng ating kamag-anak na si Elimelec
  rationale: Ipinahahayag ng konstruksiyong may לְ ang pag-aari o kaugnayan. Sa kontekstong pang-angkan, maaaring mas malawak kaysa literal na kapatid ang אָחִינוּ, kaya “ating kamag-anak” ang natural at kontekstuwal na katumbas.
- source_word: מָכְרָה
  choice: Ipinagbibili
  rationale: Bagaman ganap ang anyong Hebreo at maaari itong unawaing natapos na, inilalahad dito ang lupa bilang kasalukuyang paksa ng legal na transaksiyon. Pinananatili sa talababa ang alternatibong “naipagbili.”
- source_word: נָעֳמִי
  choice: Naomi
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
- source_word: הַשָּׁבָה
  choice: na nagbalik
  rationale: Tinutukoy ng anyong participial si Naomi bilang ang bumalik; malinaw at natural ang “na nagbalik” sa Filipino.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: mula sa kaparangan ng Moab
  rationale: Ang literal na “bukid ng Moab” ay idyomang tumutukoy sa lupain o kanayunan ng Moab. Ang “kaparangan” ay nagpapanatili ng kongkretong larawang panlupa nang hindi nagpapahiwatig na iisang bukid lamang iyon.
theological_decisions:
- issue: Saklaw ng terminong גֹּאֵל
  choice: tagapagtubos
  alternative: kamag-anak na tagapagtubos / pinakamalapit na kamag-anak
  rationale: Ang maikling katawagang “tagapagtubos” ay nagpapanatili sa legal at pampamilyang papel na binuo ng konteksto, nang hindi tinutukoy nang higit sa sinasabi ng talata ang eksaktong antas ng pagkakamag-anak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinagbibili” upang maging natural ang legal na eksena, habang pinanatili sa talababa ang tunay na ambiguwidad ng aspektong Hebreo. Inayos ang mga pananda ng talababa upang bawat isa ay nakakabit sa salitang talagang ipinaliliwanag nito.
