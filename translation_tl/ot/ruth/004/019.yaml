  text: Hezron fathered Ram, and Ram fathered Amminadab.
translation:
  language: tl
  text: Naging ama ni Ram si Hezron, at naging ama ni Aminadab si Ram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  choice: Hezron
  rationale: Pangngalang pantangi; ginamit ang karaniwang anyong biblikal sa Filipino. Hindi na hiwalay na isinalin ang unang וְ dahil ipinagpapatuloy nito ang talaangkanan mula sa naunang talata.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa konteksto ng talaangkanan, ipinahahayag ng Hiphil ng ילד ang pagkakaroon o pagiging ama ng isang anak. Ang hulma na “naging anak ni X si Y” ay natural at malinaw sa modernong Filipino, habang pinananatili ang ugnayang genealogical.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang sariling katumbas na salita sa Filipino; ipinakikita ang tungkulin nito sa ayos ng pangungusap.
- source_word: רָם
  choice: Ram
  rationale: Pangngalang pantangi; tinumbasan sa karaniwang anyong biblikal na Ram.
- source_word: וְ/רָם
  choice: at naging anak ni Ram
  rationale: Ang וְ ay tahasang isinalin na “at” upang pagdugtungin ang dalawang sugnay ng talaangkanan.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Inulit ang parehong hulma upang mapanatili ang paralelismo at pagkakapare-pareho ng dalawang sugnay.
- source_word: עַמִּינָדָב
  choice: Aminadab
  rationale: Ginamit ang nakaugaliang anyong biblikal sa Filipino; hindi kailangang katawanin ng dobleng m ang Hebreong pagdodoble ng katinig sa natural na baybay-Filipino.
