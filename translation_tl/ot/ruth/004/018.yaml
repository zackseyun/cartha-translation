  text: וְ/אֵ֨לֶּה֙ תּוֹלְד֣וֹת פָּ֔רֶץ פֶּ֖רֶץ הוֹלִ֥יד אֶת חֶצְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/018.yaml
  text: 'These are the generations of Perez: Perez fathered Hezron[a].'
translation:
  language: tl
  text: 'Ito ang talaangkanan[a] ni Perez: Si Perez ang ama ni Hezron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga salinlahi ni Perez” o “linya ng angkan ni Perez.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala ng parirala ang isang bagong seksiyong genealogical. Hindi na isinama ang ו bilang tahasang “At” dahil mas natural sa modernong Tagalog ang tuwirang pambungad, habang nananatili ang tungkulin nitong magpakilala ng talaan.
- source_word: תּוֹלְדוֹת
  choice: talaangkanan
  rationale: Sa kontekstong ito, ipinakikilala ng salita ang tala ng linya ng angkan. Ang “talaangkanan” ay malinaw at pormal ngunit nauunawaan sa modernong Tagalog; inilagay sa talababa ang mga posibleng alternatibong pagbasa.
- source_word: פָּרֶץ
  choice: Perez
  rationale: Isinalin ang pangalang Hebreo ayon sa karaniwang modernong anyo nito.
- source_word: הוֹלִיד
  choice: ang ama ni
  rationale: Ang Hiphil ng ילד sa mga talaangkanan ay nangangahulugang naging ama o nagkaanak. Ang “Si Perez ang ama ni Hezron” ay likas at malinaw sa Tagalog, at hindi gumagamit ng makalumang pananalita.
- source_word: אֶת
  choice: '[pananda ng tuwirang layon, hindi isinalin]'
  rationale: Panandang gramatikal ito sa Hebreo at walang kailangang tuwirang katumbas sa Tagalog.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Isinalin ang pangalang Hebreo ayon sa karaniwang modernong anyo nito.
