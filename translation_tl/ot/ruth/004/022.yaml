  text: At si Obed ay naging ama ni Jesse[a], at si Jesse ay naging ama ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Si Obed ang ama ni Jesse.” Karaniwang ginagamit sa mga talaangkanan ang pandiwang Hebreo sa kahulugang “maging ama ni” o “magkaanak.”
