lexical_decisions:
- source_word: וְ
  choice: At
  rationale: Payak na pinag-uugnay nito ang huling pahayag sa talaangkanan sa naunang talata.
- source_word: עֹבֵד
  choice: Obed
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: הוֹלִיד
  choice: naging anak ni … si …
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay nangangahulugang ‘magkaanak’ o ‘maging ama ni.’ Ang hulma na ‘naging anak ni X si Y’ ay natural at malinaw sa modernong Tagalog habang pinananatili ang ugnayang genealogical.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas na kailangan sa Tagalog.
- source_word: יִשַׁי / יִשָׁי
  choice: Jesse
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Bibliyang Tagalog.
- source_word: דָּוִד
  choice: David
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Bibliyang Tagalog.
theological_decisions:
- issue: Pagsasalin ng pandiwang genealogical
  choice: naging anak ni … si …
  alternative: naging ama ni; ipinanganak ni; naging anak ni … si … / begot
  rationale: Tuwirang talaangkanan ang talata. Malinaw na ipinapahayag ng napiling hulma ang ugnayan ng ama at anak nang hindi gumagamit ng lipas o hindi natural na pananalita at nang walang idinaragdag na teolohikal na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na simple, natural, at marangal. Pinili ang hulmang ‘naging anak ni X si Y’ dahil mas karaniwan at madaling maunawaan kaysa sa literal ngunit mas mabigat na ‘naging ama ni X si Y.’
