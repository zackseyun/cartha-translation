revisions:
- from: Sinabi ng lahat ng taong nasa pintuang-bayan, pati ng matatandang pinuno, “Mga saksi kami. Nawa’y gawin ni Yahweh na tulad nina Raquel at Lea ang babaeng papasok sa iyong sambahayan. Silang dalawa ang nagtatag ng sambahayan ng Israel. Magtagumpay ka[a] sa Efrata at magkaroon ka ng tanyag na pangalan sa Betlehem.”
  to: Sinabi ng lahat ng taong nasa pintuang-bayan at ng matatanda, “Mga saksi kami. Nawa’y gawin ni Yahweh na tulad nina Raquel at Lea ang babaeng papasok sa iyong sambahayan, na kapwa nagpatatag sa sambahayan ng Israel. Maging matagumpay ka[a] sa Efrata at magkaroon ka ng tanyag na pangalan sa Betlehem.”
  rationale: Inayos ang pagbubuo ng mga nagsalita, idinikit muli ang relativong sugnay sa Raquel at Lea, at ginawang mas likas na pormula ng basbas ang salin ng עֲשֵׂה חַיִל. Pinanatili ang kahulugan, ang ambigwidad ng pariralang Hebreo sa pamamagitan ng talababa, at ang lahat ng wastong pangalan at footnote anchor.
