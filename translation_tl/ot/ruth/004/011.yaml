  text: וַ/יֹּ֨אמְר֜וּ כָּל הָ/עָ֧ם אֲשֶׁר בַּ/שַּׁ֛עַר וְ/הַ/זְּקֵנִ֖ים עֵדִ֑ים יִתֵּן֩ יְהוָ֨ה אֶֽת הָ/אִשָּׁ֜ה הַ/בָּאָ֣ה אֶל בֵּיתֶ֗/ךָ כְּ/רָחֵ֤ל וּ/כְ/לֵאָה֙ אֲשֶׁ֨ר בָּנ֤וּ שְׁתֵּי/הֶם֙ אֶת בֵּ֣ית יִשְׂרָאֵ֔ל וַ/עֲשֵׂה חַ֣יִל בְּ/אֶפְרָ֔תָה וּ/קְרָא שֵׁ֖ם בְּ/בֵ֥ית לָֽחֶם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: tl
  text: Sinabi ng lahat ng taong nasa pintuang-bayan at ng matatanda, “Mga saksi kami. Nawa’y gawin ni Yahweh na tulad nina Raquel at Lea ang babaeng papasok sa iyong sambahayan, na kapwa nagpatatag sa sambahayan ng Israel. Maging matagumpay ka[a] sa Efrata at magkaroon ka ng tanyag na pangalan sa Betlehem.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpakita ka ng lakas,” “kumilos ka nang may katapangan,” o “magpakita ka ng dangal.” Malawak ang saklaw ng salitang Hebreo at maaari itong tumukoy sa lakas, katapangan, yaman, kakayahan, o matagumpay na pag-unlad.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים
  choice: Mga saksi kami
  rationale: Nominal ang Hebreo (‘mga saksi’), ngunit likas sa tuwirang pagsasalita sa Tagalog ang paglalagay ng ipinahihiwatig na panaguri bilang ‘Mga saksi kami.’
- source_word: יִתֵּן יְהוָה
  choice: Nawa’y gawin ni Yahweh
  rationale: Bagaman karaniwang ‘magbigay’ ang נתן, sa hulma ng basbas na may paghahambing, malinaw na ‘gawin ... na tulad’ ang idyomatikong diwa; pinananatili ng ‘nawa’y’ ang pakiusap o basbas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: ang babaeng papasok sa iyong sambahayan
  rationale: Ipinahahayag ng ‘papasok’ ang nalalapit na pagpasok sa tahanan sa pamamagitan ng pag-aasawa; ‘sambahayan’ ang likas na Tagalog para sa bahay bilang pamilya o angkan.
- source_word: כְּרָחֵל וּכְלֵאָה
  choice: tulad nina Raquel at Lea
  rationale: Likas sa Tagalog ang ‘nina’ para sa dalawang personal na pangalang pinagtutularan; ginagamit ang karaniwang anyong Tagalog ng mga pangalan.
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: Silang dalawa ang nagtatag ng sambahayan ng Israel
  rationale: Ang בנה na may ‘bahay’ ay tumutukoy sa pagtatatag ng pamilya o bayan. Pinananatili ng ‘sambahayan’ ang larawang pampamilya nang hindi ito ginagawang literal na gusali.
- source_word: וַעֲשֵׂה חַיִל
  choice: Magtagumpay ka
  rationale: Sa konteksto ng basbas sa pag-aasawa, malinaw at likas ang ‘magtagumpay,’ habang inilalagay sa talababa ang mas malawak na saklaw ng חַיִל.
- source_word: בְּאֶפְרָתָה
  choice: sa Efrata
  rationale: Pinananatili ang pangalang-pook at ginagamit ang anyong madaling basahin sa modernong Tagalog.
- source_word: וּקְרָא שֵׁם
  choice: magkaroon ka ng tanyag na pangalan
  rationale: Ang literal na ‘tumawag ng pangalan’ ay isang idyoma para sa pagkakaroon ng pangalan o kabantugan. Ginagawang malinaw sa Tagalog ang reputasyong tinutukoy nang pinananatili ang larawang ‘pangalan.’
- source_word: בְּבֵית לָחֶם
  choice: sa Betlehem
  rationale: Karaniwang anyong Tagalog ng pangalang-pook; ang ‘sa’ ay angkop sa lokal na reputasyon sa bayan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulong ‘PANGINOON.’
- issue: Diwa ng basbas na וַעֲשֵׂה חַיִל
  choice: Magtagumpay ka
  alternative: Magpakita ka ng lakas o katapangan; magkaroon ka ng yaman o karangalan
  rationale: Hindi nililimitahan ang חַיִל sa isang doktrinal na pakahulugan. Pinili ang pinakanatural na diwa sa konteksto at itinabi sa talababa ang tunay na leksikal na lawak.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘pintuang-bayan’ para sa pampublikong lugar ng paglilitis at transaksiyon, at ‘matatandang pinuno’ upang malinaw na hindi lamang edad kundi tungkuling pangkomunidad ang tinutukoy. Inilipat ang talababa sa ‘Magtagumpay ka,’ ang pariralang talagang may leksikal na alternatibo.
