  text: וַ/יֹּאמֶר֩ בֹּ֨עַז לַ/זְּקֵנִ֜ים וְ/כָל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ הַ/יּ֔וֹם כִּ֤י קָנִ֨יתִי֙ אֶת כָּל אֲשֶׁ֣ר לֶֽ/אֱלִימֶ֔לֶךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/כִלְי֖וֹן וּ/מַחְל֑וֹן מִ/יַּ֖ד נָעֳמִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Boaz sa mga nakatatanda at sa lahat ng tao, “Kayo ang mga saksi ngayon na nakuha ko[a] mula kay Noemi[b] ang lahat ng pag-aari ni Elimelec at ang lahat ng pag-aari nina Quilion at Mahlon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binili ko.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkuha sa pamamagitan ng pagbili sa isang legal na transaksiyon.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa kamay ni Noemi,” isang idyoma para sa mula sa pag-aari, pag-iingat, o kapangyarihan ni Noemi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod nang hindi ginagawang paulit-ulit ang “At.”
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: sa mga nakatatanda at sa buong bayan
  rationale: Ang “mga nakatatanda” ay malinaw na tumutukoy sa mga elder na gumaganap sa pampublikong usaping legal. Sa tagpong ito, ang הָעָם ay ang sambayanang naroon, kaya natural ang “buong bayan.”
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Kayo ang mga saksi ngayon
  rationale: Pinananatili nito ang diin sa mga taong kinikilalang saksi at gumagamit ng kasalukuyan at karaniwang pananalita.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng patotoo, hindi ang sanhi o dahilan.
- source_word: קָנִיתִי
  choice: nakuha ko
  rationale: Maaaring mangahulugan ang קנה ng pagkuha o pagbili. Ang “nakuha ko” ay nagpapanatili sa mas malawak na kahulugan ng legal na pagtatamo, samantalang inilalahad sa talababa ang mas tiyak na posibilidad na pagbili.
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: ang lahat ng pag-aari ni Elimelec
  rationale: Ang Hebreong pariralang literal na “lahat ng ukol kay Elimelec” ay likas na idyoma ng pagmamay-ari; malinaw itong ipinapahayag ng “lahat ng pag-aari.”
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: at ang lahat ng pag-aari nina Quilion at Mahlon
  rationale: Pinananatili ang paralelismo sa naunang parirala at ang ayos ng mga pangalan sa tekstong Hebreo.
- source_word: מִיַּד נָעֳמִי
  choice: mula kay Noemi
  rationale: Ang literal na “mula sa kamay ni Noemi” ay idyoma para sa pagkuha mula sa kaniyang pag-iingat, pagmamay-ari, o kapangyarihang maglipat. Ang natural na Tagalog ay inilagay sa teksto at ang literal na larawan ay pinanatili sa talababa.
theological_decisions:
- issue: Uri ng transaksiyon ni Boaz
  choice: Ipinahayag bilang legal na pagkuha ng ari-arian, gamit ang “nakuha ko.”
  alternative: “binili ko” o “tinubos ko”
  rationale: Tumutukoy ang tuwirang layon sa lahat ng pag-aari nina Elimelec, Quilion, at Mahlon. Hindi ginamit ang “tinubos” sapagkat hindi iyon ang mismong pandiwa sa talata, at maaaring magpasok ng mas tiyak na teolohikal o legal na pakahulugan. Hindi rin nilimitahan sa “binili” ang pangunahing teksto dahil mas malawak ang maaaring saklaw ng קנה, bagaman lehitimong alternatibo iyon sa kontekstong legal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga nakatatanda” para sa pampublikong lupon ng mga elder at “buong bayan” para sa sambayanang naroon bilang mga saksi. Iniwasan ang sobrang teknikal na wikang legal, ngunit pinanatili ang pormal at pampublikong tono ng pahayag.
