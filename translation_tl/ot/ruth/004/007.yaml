base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: tl
  text: 'Ganito ang dating kaugalian sa Israel tungkol sa pagtubos at pagpapalitan: upang pagtibayin ang anumang usapin,[a] hinuhubad ng isang lalaki ang kanyang sandalyas at ibinibigay ito sa kanyang kapwa; ito ang katibayan sa Israel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang bagay.”
    reason: lexical_alternative
  - marker: b
    text: O “Ito ang patotoo sa Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: dating
  rationale: Ipinahahayag nito na ang inilalarawang gawain ay kaugalian noong unang panahon; natural at maikli ang “dating” sa modernong Filipino.
- source_word: הַגְּאוּלָּה
  choice: pagtubos
  rationale: Tuwirang ipinapahayag ang legal at pampamilyang konsepto ng muling pagkuha o pagtubos sa konteksto ng Ruth 4.
- source_word: הַתְּמוּרָה
  choice: pagpapalitan
  rationale: Pinananatili ang pangkalahatang diwa ng palitan o pagpapalit nang hindi labis na tinutukoy ang eksaktong legal na mekanismo.
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: upang pagtibayin ang anumang kasunduan
  rationale: Ang לְקַיֵּם ay ‘pagtibayin’ o ‘patunayan,’ at sa legal na konteksto ang דָּבָר ay natural na mauunawaan bilang usapin o kasunduan. Isinama sa talababa ang mas literal na alternatibo.
- source_word: שָׁלַף
  choice: hinuhubad
  rationale: Sa sandalyas bilang layon, ito ang natural na Filipino para sa pag-alis ng suot na sapin sa paa.
- source_word: נַעֲלוֹ
  choice: kanyang sandalyas
  rationale: Ang “sandalyas” ang pinakaangkop na katawagan sa uri ng sapin sa paa sa sinaunang konteksto.
- source_word: לְרֵעֵהוּ
  choice: sa kanyang kapwa
  rationale: Malapit ito sa malawak na kahulugan ng רֵעַ bilang kapwa, kasama, o kabilang panig, nang hindi tahasang dinaragdagan ang teksto ng “kabilang panig sa kasunduan.”
- source_word: הַתְּעוּדָה
  choice: katibayan
  rationale: Natural na inilalarawan ng “katibayan” ang sandalyas o kilos bilang nagpapatunay at nagpapatibay sa kasunduan; ang “patotoo” ay lehitimong alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Ganito ang dating kaugalian” upang natural na maipakilala ang paliwanag tungkol sa sinaunang gawain. Ang hulíng sugnay ay ginawang “nagsisilbing katibayan” para sa malinaw na Filipino habang pinananatili sa talababa ang mas tuwirang “patotoo.”
