  to: Maging nawa ang sambahayan mo gaya ng sambahayan ni Perez,[a] na isinilang ni Tamar para kay Juda, mula sa supling[b] na ibibigay sa iyo ni Yahweh sa pamamagitan ng dalagang ito.
  rationale: Inayos ang ayos ng pagpapala para sa likas na Filipino, nilinaw ang sugnay tungkol kay Perez nang hindi dinaragdagan ang kahulugan, at inilagay ang talababa tungkol sa “binhi” sa salitang “supling” na siyang tinutukoy nito. Pinananatili ng “mula sa supling” ang pangunahing puwersa ng מִן, samantalang ang “sa pamamagitan ng dalagang ito” ay natural na Filipino para sa maternal na pinagmumulan ng kaloob.
