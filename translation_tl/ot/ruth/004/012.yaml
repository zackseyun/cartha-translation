  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: tl
  text: Maging nawa ang sambahayan mo gaya ng sambahayan ni Perez,[a] na isinilang ni Tamar para kay Juda, mula sa supling[b] na ibibigay sa iyo ni Yahweh sa pamamagitan ng dalagang ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sambahayan” dito ay tumutukoy sa pamilya o linya ng angkan, hindi lamang sa isang bahay na tirahan.
    reason: cultural_note
  - marker: b
    text: Sa Hebreo, literal na “mula sa binhi.” Ang “binhi” ay karaniwang idyoma para sa supling o mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: nawa ay maging
  rationale: Ipinahahayag ng anyong jussive ang isang pagpapala o hangarin; likas itong naipapahayag sa Tagalog sa pamamagitan ng “nawa.”
- source_word: בֵיתְךָ / כְּבֵית פֶּרֶץ
  choice: ang sambahayan mo / gaya ng sambahayan ni Perez
  rationale: Sa kontekstong pangangkanan, ang בַּיִת ay tumutukoy sa sambahayan o angkan, hindi lamang sa gusali. Pinananatili ng “sambahayan” ang ugnayan sa pamilya nang hindi ito nililimitahan sa bahay na tirahan.
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: na ipinanganak ni Tamar para kay Juda
  rationale: Tuwirang ipinahahayag ang panganganak ni Tamar at pinananatili ang diwang genealogical ng לִיהוּדָה bilang “para kay Juda.”
- source_word: מִן הַזֶּרַע
  choice: sa pamamagitan ng supling
  rationale: Ang זֶרַע ay literal na “binhi” ngunit karaniwang tumutukoy sa anak o mga inapo. Sa pangungusap na ito, ipinakikita ng unang מִן ang paraan o batayan kung paano magiging gaya ng sambahayan ni Perez ang sambahayan ni Boaz.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: na ibibigay sa iyo ni Yahweh
  rationale: Ang imperfect ng נתן sa loob ng pagpapala ay likas na naipapahayag bilang inaasahang kaloob ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” alinsunod sa tahasang anyo ng tekstong Hebreo.
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: mula sa dalagang ito
  rationale: Ang נַעֲרָה ay isang batang babae o dalaga; sa konteksto ng kasal at pag-aanak, natural at marangal ang “dalagang ito.” Pinananatili ng “mula sa” ang literal na puwersa ng מִן bilang pinagmulan.
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang personal na banal na pangalan, kaya pinananatili ito sa salin sa halip na palitan ng isang titulo.
- issue: Kahulugan ng בֵּית sa pagpapalang may kinalaman sa mga inapo
  choice: sambahayan
  alternative: angkan
  rationale: Saklaw ng “sambahayan” ang pamilya at nagpapatuloy na linya ng angkan, habang hindi gaanong tahasang nilulutas ang lawak nito bilang “angkan” lamang.
- issue: Ugnayan ng מִן הַזֶּרַע sa pangunahing pagpapala
  choice: sa pamamagitan ng supling
  alternative: mula sa supling
  rationale: Maaaring ipahiwatig ng מִן ang pinagmulan o paraan. Ang “sa pamamagitan ng” ay malinaw sa Tagalog at hindi nagdaragdag ng tahasang sanhi gaya ng “dahil sa,” ngunit kinikilala sa talababa ang mas literal na “mula sa.”
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “nawa” upang panatilihin ang anyo ng pagpapala, “sambahayan” para sa malawak na genealogical na diwa ng בֵּית, at “dalaga” bilang natural na katumbas ng נַעֲרָה sa konteksto.
