  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: tl
  text: Muli nilang itinaas ang kanilang mga tinig at umiyak. Hinalikan ni Orpa ang kaniyang biyenang babae[a], ngunit mahigpit na kumapit si Ruth sa kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at mahigpit na kumapit si Ruth sa kaniya.” Ang pang-ugnay sa Hebreo ay maaari ring isaling payak na “at,” ngunit ipinahihiwatig ng konteksto ang pagkakaiba ng paghalik ni Orpa at ng patuloy na pagkapit ni Ruth.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן
  choice: inilakas ang kanilang pag-iyak
  rationale: Ang Hebreong idyoma ay literal na ‘itinaas nila ang kanilang tinig.’ Sa konteksto ng pagdadalamhati, natural na ipinahahayag nito ang malakas at naririnig na pag-iyak; iniiwasan din ng salin ang di-likas na ‘itinaas ang kanilang mga tinig.’
- source_word: וַתִּבְכֶּינָה עוֹד
  choice: Muli ... pag-iyak
  rationale: Ang pandiwa ay tumutukoy sa pag-iyak, at ang עוֹד ay nagpapakitang naulit ito matapos ang naunang pag-iyak sa talata 9.
- source_word: וַתִּשַּׁק
  choice: Hinalikan
  rationale: Tuwirang katumbas ng pandiwang Hebreo at natural sa salaysay.
- source_word: לַחֲמוֹתָהּ
  choice: ang kaniyang biyenan
  rationale: Ang pangngalan ay partikular na tumutukoy sa ina ng asawa. Sa Filipino, ‘biyenan’ ang natural na katawagan, at malinaw sa konteksto na si Noemi ang tinutukoy.
- source_word: דָּבְקָה בָּהּ
  choice: mahigpit na kumapit ... sa kaniya
  rationale: Ipinahahayag ng דבק ang matibay at malapit na pagkapit o pananatiling nakaugnay. Ang ‘mahigpit na kumapit’ ay natural at pinananatili ang pisikal at emosyonal na puwersa nang hindi nagdaragdag ng tiyak na teolohikal na kahulugan.
- source_word: וְ
  choice: ngunit
  rationale: Bagaman karaniwang nangangahulugang ‘at,’ may malinaw na paghahambing dito sa ginawa ni Orpa at sa patuloy na pagkapit ni Ruth. Minarkahan sa talababa ang literal na alternatibo upang mapanatili ang tunay na saklaw ng pang-ugnay.
- source_word: עָרְפָּה
  choice: Orpa
  rationale: Karaniwang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: רוּת
  choice: Ruth
  rationale: Karaniwang anyo ng pangalang biblikal sa modernong Filipino.
