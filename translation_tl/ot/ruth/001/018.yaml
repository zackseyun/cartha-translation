  yaml_path: translation/ot/ruth/001/018.yaml
  text: When she saw that she was determined to go with her[a], she stopped speaking to her.
translation:
  language: tl
  text: Nang makita ni Noemi na buo ang loob ni Ruth na sumama sa kanya, hindi na siya nagsalita kay Ruth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, tumigil na si Noemi sa pagsasalita kay Ruth.
    reason: Mas pormal at mas malapit sa anyo ng Hebreong וַתֶּחְדַּל לְדַבֵּר אֵלֶיהָ.
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Nang makita ni Noemi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, at likas sa Tagalog ang temporal na “Nang makita.” Nilinaw ang tinutukoy na babae bilang si Noemi ayon sa konteksto.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nakita o naunawaan ni Noemi.
- source_word: מִתְאַמֶּצֶת הִיא
  choice: buo ang loob ni Ruth
  rationale: Ang Hitpael ng אמץ ay nagpapahayag ng matatag na pagpapasiya o pagpapatibay ng sarili. Ang “buo ang loob” ay natural at marangal na Tagalog na nagpapanatili sa diin ng hiwalay na panghalip na הִיא.
- source_word: לָלֶכֶת אִתָּהּ
  choice: na sumama sa kanya
  rationale: Sa konteksto ng paglalakbay, ang לָלֶכֶת ay “pumunta,” at ang אִתָּהּ ay “kasama niya.” Pinagsasama itong natural sa Tagalog bilang “sumama sa kanya.”
- source_word: וַתֶּחְדַּל לְדַבֵּר אֵלֶיהָ
  choice: hindi na siya nagsalita pa kay Ruth
  rationale: Ang חדל ay nangangahulugang huminto o tumigil, at ang לדבר אליה ay literal na magsalita sa kaniya. Natural na ipinahahayag sa Tagalog ang pagtatapos ng kilos sa “hindi na ... pa,” nang hindi dinaragdagan ang layunin ng pagsasalita.
theological_decisions:
- issue: Kung ang pagsasalita ni Noemi ay partikular na panghihikayat kay Ruth na bumalik
  choice: Hindi tinukoy ang layunin; isinalin lamang na hindi na siya nagsalita pa kay Ruth.
  alternative: Hindi na niya hinikayat si Ruth na bumalik.
  rationale: Bagaman ipinahihiwatig ng konteksto na tumigil si Noemi sa pagpipilit na pauwiin si Ruth, ang Hebreo ay nagsasabing tumigil siyang “magsalita sa kaniya.” Pinananatili ng salin ang hindi tahasang sinabi ng teksto.
translation_notes:
  register: Makabagong Filipino Tagalog na natural ngunit marangal. Ginamit ang mga pangalang Noemi at Ruth upang maiwasan ang kalituhan sa sunod-sunod na panghalip na pambabae sa Hebreo.
