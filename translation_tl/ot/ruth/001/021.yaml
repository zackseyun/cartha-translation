revisions:
- from: Punô ako nang umalis ako, ngunit ibinalik ako ni Yahweh na walang-wala. Bakit ninyo ako tinatawag na Naomi, gayong nagpatotoo si Yahweh laban sa akin[a], at nagdulot sa akin ng kapahamakan ang Makapangyarihan sa Lahat[b]?
  to: Punô ako nang umalis ako, ngunit ibinalik ako ni Yahweh nang walang-wala. Bakit ninyo ako tinatawag na Naomi, gayong sumaksi si Yahweh laban sa akin[a], at nagdulot sa akin ng kapahamakan ang Makapangyarihan sa Lahat[b]?
  rationale: Pinalitan ang ‘nagpatotoo’ ng mas likas na ‘sumaksi’ sa pangunahing teksto, habang pinanatili ang pinag-aalitang forensikong nuwansa sa talababa. Ginawang ‘nang walang-wala’ ang pang-abay na parirala upang mas malinaw na inilalarawan nito ang paraan o kalagayan ng pagbabalik. Walang binago sa kahulugan, banal na pangalan, o tahasang pag-uugnay ng kapahamakan sa pagkilos ng Diyos.
