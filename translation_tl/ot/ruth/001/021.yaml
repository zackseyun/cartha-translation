id: RUT.1.21
reference: Ruth 1:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: tl
  text: Punô ako nang umalis ako, ngunit ibinalik ako ni Yahweh nang walang-wala. Bakit ninyo ako tinatawag na Naomi, gayong sumaksi si Yahweh laban sa akin[a], at nagdulot sa akin ng kapahamakan ang Makapangyarihan sa Lahat[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpatotoo laban sa akin” o “sumagot laban sa akin.” Maaaring tumukoy ang pandiwang Hebreo sa pagsagot o pagsaksi laban sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gumawa sa akin ng masama” o “nagdulot sa akin ng kasawian.” Ang pananalitang Hebreo ay tumutukoy sa pinsala, kapahamakan, o masamang sinapit ni Naomi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: punô
  rationale: Pinananatili ang matinding tuwirang paghahambing sa רֵיקָם (‘walang-wala’) at ang malawak na saklaw ng sinabi ni Naomi tungkol sa dati niyang kalagayan.
- source_word: הָלַכְתִּי
  choice: umalis ako
  rationale: Likas na Filipino para sa pag-alis ni Naomi sa Betlehem at tapat sa payak na pandiwang Hebreo.
- source_word: וְרֵיקָם
  choice: na walang-wala
  rationale: Ipinahahayag ang lubos na kawalan at malinaw na itinatapat sa ‘punô’; hindi nililimitahan ang kawalan sa materyal na ari-arian lamang.
- source_word: הֱשִׁיבַנִי
  choice: ibinalik ako
  rationale: Pinananatili ang causative na diwa ng Hiphil at ang tahasang pagkilos ni Yahweh bilang may-akda ng pagbabalik.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: Bakit ninyo ako tinatawag na Naomi
  rationale: Ang ‘ninyo’ ay nagpapakita na higit sa isang babae ang kinakausap; pinananatili ang retorikal na tanong at hindi isinasalin sa pangunahing teksto ang kahulugan ng pangalang Naomi.
- source_word: עָנָה בִי
  choice: nagpatotoo ... laban sa akin
  rationale: Pinananatili ang posibleng hudisyal na diwa ng konstruksiyon at hindi ito agad ipinapareho sa kasunod na pahayag tungkol sa kapahamakan.
- source_word: שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulo sa malinaw at kinikilalang Filipino habang pinananatili ang pagkakaiba nito sa personal na pangalang Yahweh.
- source_word: הֵרַע לִי
  choice: nagdulot sa akin ng kapahamakan
  rationale: Ipinahahayag ang sanhi ng masamang pangyayari o kasawian nang hindi ipinahihiwatig na gumawa ang Diyos ng moral na kasamaan.
theological_decisions:
- issue: Ang tuwirang pag-uugnay ni Naomi sa Diyos at sa kanyang pagdurusa
  choice: 'Pinanatili ang tahasang banal na pagkilos: ibinalik siya ni Yahweh, nagpatotoo si Yahweh laban sa kanya, at nagdulot sa kanya ng kapahamakan ang Makapangyarihan sa Lahat.'
  alternative: Palambutin bilang ‘hinayaan ni Yahweh na mangyari’ o ‘dumating sa akin ang kapahamakan.’
  rationale: Tuwirang iniuugnay ng Hebreo ang mabigat na sinapit ni Naomi kay Yahweh at kay Shaddai. Dapat manatili ang teolohikal na tensiyong ito sa halip na ipaliwanag o palambutin.
- issue: Ang kahulugan ng עָנָה בִי
  choice: nagpatotoo ... laban sa akin
  alternative: sumagot laban sa akin; pinahirapan ako
  rationale: Maaaring magkaroon ang parirala ng hudisyal na diwa ng pagsaksi o pagpapatotoo laban sa isang tao. Pinananatili ito sa pangunahing teksto, habang kinikilala sa talababa ang leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘walang-wala’ upang maging likas ang salungatan sa ‘punô’ nang hindi nililimitahan ang sinabi ni Naomi sa pagiging ‘walang dala.’ Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang tinatalakay ng mga talababa.
