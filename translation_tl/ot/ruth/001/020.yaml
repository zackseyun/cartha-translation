base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Huwag ninyo akong tawaging Noemi;[a] tawagin ninyo akong Mara, sapagkat ginawa akong lubhang mapait ng Makapangyarihan sa Lahat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Noemi ay nangangahulugang “kaaya-aya,” samantalang ang Mara ay nangangahulugang “mapait.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶן
  choice: Ngunit sinabi niya sa kanila
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit ang “Ngunit” ay likas na naghuhudyat ng pagtutuwid ni Noemi sa sinabi ng mga babae. Ang hulaping pambabaeng maramihan sa אֲלֵיהֶן ay sapat nang naipahahayag ng konteksto sa “sa kanila.”
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: Huwag ninyo akong tawaging Noemi
  rationale: Ang maramihang anyo ng pandiwa ay likas na naipapakita sa “ninyo.” Pinananatili bilang pangalan ang Noemi, samantalang ipinaliliwanag sa talababa ang kaugnayan nito sa pagiging kaaya-aya.
- source_word: קְרֶאןָ לִי מָרָא
  choice: tawagin ninyo akong Mara
  rationale: Inuulit ang “tawagin” upang mapanatili ang tahasang paghahambing ng dalawang pangalan. Isinalin sa baybay na “Mara” bilang personal na katawagan at ipinaliwanag ang kahulugan sa talababa.
- source_word: כִּי הֵמַר ... לִי מְאֹד
  choice: sapagkat ginawang napakapait ... ang buhay ko
  rationale: Ipinahahayag ng Hiphil הֵמַר ang pagpapait o paggawa na mapait, at pinatitindi ito ng מְאֹד. Ang “ang buhay ko” ay isang likas na pagpapahayag sa Filipino ng karanasang tinutukoy ng לִי, nang hindi ipinahihiwatig na naging mapait lamang ang ugali ni Noemi; pinananatili rin nito ang laro ng salita sa pangalang Mara.
- source_word: שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulo upang maipahayag ang kinikilalang diwa nito sa malinaw at marangal na modernong Filipino.
theological_decisions:
- issue: Pagpapahayag sa banal na titulong שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  alternative: Shaddai
  rationale: Titulo ang שַׁדַּי at hindi tahasang personal na pangalan sa talatang ito. Ang salin ay malinaw sa karaniwang mambabasa habang iniiwasang magdagdag ng isang partikular na paliwanag sa pinagmulan ng salita.
- issue: Paglalarawan ni Noemi sa pagkilos ng Diyos
  choice: ginawang napakapait ... ang buhay ko
  alternative: labis na naging mapait sa akin / pinakitunguhan ako nang napakapait
  rationale: Pinananatili ang matinding pag-aangkin ni Noemi na ang Makapangyarihan sa Lahat ang sanhi ng kanyang mapait na kalagayan, nang hindi ito pinahihina o ipinapaliwanag palayo. Kasabay nito, hindi nito hinahatulan kung tama o ganap ang pagkaunawa niya sa kanyang dinanas.
translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Filipino. Pinili ang “Noemi,” ang karaniwang anyo ng pangalan sa Filipino, at “Mara” upang mapanatili ang pag-iiba ng mga pangalan. Ang “ginawang napakapait ang buhay ko” ay mas natural kaysa sa literal ngunit malabong “ginawa akong mapait,” at malinaw na tumutukoy sa mapait na karanasan ni Noemi.
