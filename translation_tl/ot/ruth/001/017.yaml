base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: tl
  text: Kung saan ka mamamatay, doon din ako mamamatay, at doon ako ililibing. Nawa’y gawin ni Yahweh sa akin ang gayon, at higit pa rito,[a] kung may anuman maliban sa kamatayan ang maghihiwalay sa akin at sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “Gayon nawa ang gawin ni Yahweh sa akin, at gayon nawa ang idagdag niya.” Isa itong Hebreong pormula ng panunumpa na nananawagan ng hatol ng Diyos kapag nilabag ang panata.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin nang mas pormal: “sapagkat kamatayan ang maghihiwalay sa akin at sa iyo.” Sa konteksto ng panunumpa, karaniwang nauunawaan ang diwa bilang: kamatayan lamang ang maaaring maghiwalay sa kanila.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Kung saan
  rationale: Ipinakikilala ng בַּאֲשֶׁר ang lugar na tinutukoy. Likas sa makabagong Tagalog ang “kung saan” at hindi nito pinalalawak ang diwa tungo sa “saanman.”
- source_word: תָּמוּתִי אָמוּת
  choice: ka mamatay, ... ako mamamatay
  rationale: Pinananatili ang taimtim na magkatugmang panata sa dalawang anyo ng pandiwang מות; ang “mamamatay” ay natural na nagpapahayag ng tiyak na pasiya tungkol sa hinaharap.
- source_word: וְשָׁם אֶקָּבֵר
  choice: at doon ako ililibing
  rationale: Ang וְשָׁם ay tuwirang tumutukoy sa nabanggit na lugar, at ang Niphal na אֶקָּבֵר ay wastong ipinahahayag sa pasibong “ililibing.”
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: Gawin sana ito sa akin ni Yahweh, at higit pa rito
  rationale: Pinananatili nito ang solemneng pormula ng sumpang nananawagan ng hatol ng Diyos, habang nananatiling mauunawaan sa kasalukuyang Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: יַפְרִיד בֵּינִי וּבֵינֵךְ
  choice: maghiwalay sa atin
  rationale: Ang Hiphil ng פרד ay nagpapahiwatig ng sanhi ng paghihiwalay. Ang “maghiwalay sa atin” ang likas na Tagalog para sa paghihiwalay sa dalawang taong tinutukoy.
- source_word: כִּי הַמָּוֶת
  choice: kung ... maliban sa kamatayan
  rationale: Sa loob ng pormula ng panunumpa, ipinahahayag nito ang pagkaunawang tanging kamatayan ang pinapayagang maghiwalay sa kanila. Itinatala sa talababa ang mas pormal na pagbasa ng כִּי bilang “sapagkat/tiyak na.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang nasa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw at kondisyon ng panata ni Ruth
  choice: kung may anumang maghiwalay sa atin maliban sa kamatayan
  alternative: sapagkat kamatayan ang maghihiwalay sa akin at sa iyo
  rationale: Ang pormula ng panunumpa at ang konteksto ay sumusuporta sa diwang kamatayan lamang ang maaaring pumutol sa ugnayan. Gayunman, hindi lubusang inaalis ang pormal na posibilidad ng ibang pagbasa, kaya inilalahad iyon sa talababa.
translation_notes:
  register: Makabago ngunit marangal at taimtim ang rehistro. Ginamit ang payak na “kung saan,” “doon,” at “maghiwalay sa atin” upang maging malinaw sa karaniwang mambabasa, habang pinanatili sa pangunahing teksto ang pormal na bigat ng panunumpa at inilagay sa mga talababa ang literal na pormula at tunay na sintaktikong tensiyon.
