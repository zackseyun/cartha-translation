base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: tl
  text: Nagpatuloy silang dalawa hanggang sa makarating sila sa Betlehem. Pagdating nila sa Betlehem, nabulabog ang buong bayan dahil sa kanila, at sinabi ng mga babae, “Si Noemi ba ito?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  choice: nagpatuloy silang dalawa
  rationale: Ipinahihiwatig ng anyong pasalaysay ng הלך ang pagpapatuloy ng paglalakbay, habang pinananatili ng “silang dalawa” ang tahasang pagdiriin sa pares.
- source_word: עַד בֹּאָנָה
  choice: hanggang sa makarating sila
  rationale: Tinutukoy ng עַד kasama ng בוא ang hantungan ng paglalakbay; natural at malinaw sa modernong Tagalog ang pariralang ito.
- source_word: בֵּית לָחֶם
  choice: Betlehem
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa karaniwang anyong Tagalog sa halip na isaling literal bilang “bahay ng tinapay.”
- source_word: וַיְהִי כְּבֹאָנָה
  choice: Pagdating nila
  rationale: Natural na inilalahad nito ang temporal na ugnayan ng sumunod na pangyayari nang hindi mekanikal na isinasalin ang pormulang Hebreo.
- source_word: וַתֵּהֹם
  choice: nagkagulo
  rationale: Ang pandiwang mula sa המה ay nagsasaad ng matinding pagkilos, ingay, o pagkabahala ng pamayanan. Ang “nagkagulo” ay likas sa Tagalog at hindi ipinapalagay kung tuwa o pangamba ang sanhi.
- source_word: כָּל הָעִיר
  choice: ang buong bayan
  rationale: Bagaman maaaring mangahulugang “lungsod” ang עִיר, mas angkop sa Betlehem sa tagpong ito ang “bayan,” at pinananatili ng “buong” ang saklaw ng Hebreo.
- source_word: עֲלֵיהֶן
  choice: dahil sa kanila
  rationale: Dito, ipinakikita ng עַל ang dahilan o okasyon ng pagkakagulo—ang pagdating nina Noemi at Ruth.
- source_word: וַתֹּאמַרְנָה
  choice: sinabi ng mga babae
  rationale: Pambabaeng maramihan ang anyo ng pandiwa, kaya tahasang tinutukoy na mga babae ang nagsalita.
- source_word: הֲזֹאת נָעֳמִי
  choice: Si Noemi ba ito?
  rationale: Direkta nitong pinananatili ang tanong ng nagulat na pagkilala nang hindi nagdaragdag ng “talaga” o ibang pagpapalakas na hindi tahasang nasa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpatuloy,” “bayan,” at “nagkagulo” upang maging natural ang salaysay habang pinananatili ang pag-usad, kolektibong reaksiyon, at hindi tiyak na emosyon ng orihinal. Walang talababa sapagkat tahasang naisalin sa pangunahing teksto ang pambabaeng maramihang anyo ng וַתֹּאמַרְנָה bilang “mga babae.”
