revisions:
- from: Kaya nagpatuloy silang dalawa hanggang sa makarating sila sa Betlehem. Pagdating nila sa Betlehem, nagkagulo ang buong bayan dahil sa kanila, at sinabi ng mga babae, “Si Noemi ba ito?”
  to: Nagpatuloy silang dalawa hanggang sa makarating sila sa Betlehem. Pagdating nila sa Betlehem, nabulabog ang buong bayan dahil sa kanila, at sinabi ng mga babae, “Si Noemi ba ito?”
  rationale: Pinalitan ang “nagkagulo” ng “nabulabog” upang maipahayag ang komosyon o pagkabahala ng bayan nang hindi nagdaragdag ng larawan ng lantad na kaguluhan. Inalis ang “Kaya” upang manatiling payak ang pag-usad ng salaysay gaya ng Hebreo. Pinanatili ang iba pang tumpak at likas na salin.
