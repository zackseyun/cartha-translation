base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: tl
  text: Kaya umalis siya mula sa lugar na tinirhan niya, kasama ang dalawa niyang manugang na babae[a], at nagpatuloy silang maglakbay sa daan upang bumalik sa lupain ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal sa simula: “lumabas siya mula sa lugar.” Ang pandiwang Hebreo ay “lumabas”; ang “umalis” ay likas na salin sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Kaya umalis siya
  rationale: Isinusulong ng waw-consecutive ang salaysay at iniuugnay ito sa naunang talata. Ang “umalis” ang likas na katumbas sa Tagalog sa kontekstong pag-alis sa isang lugar; ipinapaliwanag sa talababa ang mas literal na “lumabas.”
- source_word: מִן־הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: sa lugar na tinirhan niya
  rationale: Likas na Tagalog ito para sa lugar ng dati niyang paninirahan. Hindi na inuulit ang lokatibong “doon,” na magiging mabigat sa Tagalog.
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: kasama ang dalawa niyang manugang na babae
  rationale: Sa konteksto, ang כַּלָּה ay mga manugang na babae. Nililinaw ng “na babae” ang relasyon at pinananatili ang bilang na dalawa.
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: Habang naglalakbay sila
  rationale: Pinagsama sa natural na Tagalog ang pambabaeng maramihang pandiwa at ang pariralang tumutukoy sa daan o paglalakbay, nang hindi iginigiit na naglakad lamang sila.
- source_word: לָשׁוּב
  choice: pabalik
  rationale: Pinananatili ang mahalagang diwa ng שׁוּב na pagbabalik, hindi lamang simpleng pagpunta.
- source_word: אֶל־אֶרֶץ יְהוּדָה
  choice: sa lupain ng Juda
  rationale: Tahasan nitong isinasalin ang אֶרֶץ bilang “lupain” at pinananatili ang Juda bilang tiyak na destinasyon.
