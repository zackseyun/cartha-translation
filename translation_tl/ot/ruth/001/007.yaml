translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “manugang na babae” para alisin ang posibleng kalabuan ng “manugang,” at pinanatili ang temang pagbabalik sa pamamagitan ng “pabalik.”
