revisions:
- from: Kaya umalis siya sa lugar na tinirhan niya[a], kasama ang dalawa niyang manugang na babae. Habang naglalakbay sila, patungo sila pabalik sa lupain ng Juda.
  to: Kaya umalis siya mula sa lugar na tinirhan niya, kasama ang dalawa niyang manugang na babae[a], at nagpatuloy silang maglakbay sa daan upang bumalik sa lupain ng Juda.
  rationale: Inayos ang ikalawang sugnay upang maipakita ang sunod-sunod na pagkilos sa salaysay at ang layuning bumalik sa lupain ng Juda. Iningatan ang konkretong “mula sa lugar,” ang dating paninirahan ni Noemi, ang bilang na dalawa, ang ugnayang manugang, at ang temang “bumalik.” Inilipat ang talababa sa dulo ng pariralang may kaugnayan sa leksikal na alternatibo at ginawang mas tumpak ang paliwanag nito.
