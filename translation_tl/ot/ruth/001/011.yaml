base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: tl
  text: Ngunit sinabi ni Noemi, “Bumalik kayo, mga anak kong babae.[a] Bakit pa kayo sasama sa akin? May mga anak na lalaki pa ba sa sinapupunan ko na magiging mga asawa ninyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga anak kong babae.” Magiliw na tinatawag ni Noemi sa ganitong paraan ang kaniyang mga manugang na babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ngunit sinabi ni Noemi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit sa konteksto ay sumasalungat si Noemi sa pasiya nilang sumama; kaya natural ang “Ngunit” kaysa sa payak na “At.”
- source_word: שֹׁבְנָה
  choice: Bumalik na kayo
  rationale: Ang pandiwang שוב ay nangangahulugang bumalik o magbalik. Ang “Bumalik na kayo” ay likas na pakiusap sa modernong Tagalog at pinananatili ang maramihang kausap.
- source_word: בְנֹתַי
  choice: mga anak ko
  rationale: Literal itong “mga anak kong babae,” ngunit magiliw na katawagan ito ni Noemi sa kaniyang mga manugang na babae. Ang “mga anak ko” ang natural na katumbas sa Tagalog; nililinaw sa talababa ang literal na anyo.
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: Bakit pa kayo sasama sa akin?
  rationale: Ang imperfect ay prospektibo at retorikal dito. Ipinahahayag ng “sasama” ang balak na paglalakbay kasama niya, at ng “pa” ang himig ng pagtutol ni Noemi.
- source_word: הַעוֹד לִי בָנִים
  choice: May mga anak na lalaki pa ba
  rationale: Ipinahahayag ng הַעוֹד לִי ang patuloy na pag-iral o pag-aari. Mahalaga ang “anak na lalaki,” hindi lamang “anak,” dahil sila ang inaasahang magiging asawa ng mga babae.
- source_word: בְּמֵעַי
  choice: sa sinapupunan ko
  rationale: Bagaman maaaring tumukoy ang מֵעֶה sa mga panloob na bahagi ng katawan, malinaw na reproduktibo ang diwa rito; ang “sinapupunan” ang tiyak at marangal na katumbas.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: na maaaring maging asawa ninyo
  rationale: Sa konstruksiyong ito, ang אֲנָשִׁים ay “mga asawa,” hindi lamang “mga lalaki.” Pinananatili ng “maaaring maging” ang hipotetikal na bunga nang hindi ito ginagawang tiyak.
theological_decisions:
- issue: Pahiwatig ng pag-aasawa sa loob ng pamilya ng yumao
  choice: Isinalin nang tuwiran ang tanong ni Noemi nang hindi pinangalanan o ipinapaliwanag ang isang tiyak na institusyong legal.
  alternative: Ipaliwanag sa teksto bilang tahasang pagtukoy sa pag-aasawang levirato.
  rationale: Ipinahihiwatig ng konteksto ang tungkulin ng mga anak na lalaki bilang maaaring asawa, ngunit hindi pinangalanan ng talata ang batas o institusyon. Iniiwasan ng salin ang pagdaragdag ng interpretasyong wala sa mismong pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Noemi,” “sinapupunan,” at “asawa” para sa malinaw na biblikal na rehistro nang hindi nagiging makaluma. Ang maramihang “kayo/ninyo” ay tumutugma sa mga babaeng kinakausap ni Noemi.
