base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: tl
  text: Pagkatapos, namatay si Elimelec, ang asawa ni Noemi, at naiwan si Noemi at ang dalawa niyang anak na lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Pagkatapos, namatay
  rationale: Ang wayyiqtol ay nagsusulong ng sunod-sunod na pangyayari sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos” upang ipakita ang kasunod na pangyayari nang hindi mekanikal na inuulit ang “at.”
- source_word: אֱלִימֶלֶךְ
  choice: Elimelec
  rationale: Isinalin sa karaniwang anyong Filipino ang personal na pangalang Hebreo.
- source_word: אִישׁ נָעֳמִי
  choice: na asawa ni Noemi
  rationale: Sa konstruksyong ito, ang אִישׁ ay tumutukoy sa asawa, hindi lamang sa isang lalaki. Malinaw at natural sa Tagalog ang “asawa ni Noemi.”
- source_word: וַתִּשָּׁאֵר
  choice: naiwan
  rationale: Ipinahihiwatig ng שׁאר ang pananatili matapos ang pagkawala o kamatayan. Ang “naiwan” ay natural na nagpapahayag ng resultang ito sa konteksto ng pangungulila.
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: si Noemi kasama ang dalawa nilang anak na lalaki
  rationale: Nililinaw ng pag-uulit sa pangalang “Noemi” ang tinutukoy ng tahasang panghalip na הִיא, at ipinapakitang siya at ang dalawang anak ang mga nanatiling buhay. Ginamit ang “kasama” bilang likas na Tagalog para sa Hebreong koordinasyon sa kontekstong ito; ang “nilang” ay tumutukoy kina Noemi at Elimelec bilang mga magulang.
