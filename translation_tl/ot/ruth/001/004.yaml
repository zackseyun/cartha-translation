- from: At kumuha sila para sa kanilang sarili ng mga asawang Moabita.[a] Ang pangalan ng isa ay Orpa, at ang pangalan ng ikalawa ay Ruth. At nanirahan sila roon nang mga sampung taon.
  to: At kumuha sila ng mga asawang Moabita para sa kanilang sarili.[a] Ang pangalan ng isa ay Orpa, at ang pangalan ng ikalawa ay Rut. At nanirahan sila roon nang mga sampung taon.
  rationale: Inayos ang ayos ng literal na idyoma upang maging mas natural sa Tagalog at ginawang “Rut” ang pangalan upang umayon sa Hebreong pinagmulan at karaniwang Tagalog na anyo. Pinanatili ang pagtatantiya sa “mga sampung taon” at ang ordinal na “ikalawa.”
