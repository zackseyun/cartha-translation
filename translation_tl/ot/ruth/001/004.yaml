  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: tl
  text: At kumuha sila ng mga asawang Moabita para sa kanilang sarili.[a] Ang pangalan ng isa ay Orpa, at ang pangalan ng ikalawa ay Rut. At nanirahan sila roon nang mga sampung taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nag-asawa sila ng mga babaeng Moabita.” Literal na sinasabi sa Hebreo, “kumuha sila ng mga asawang Moabita para sa kanilang sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם
  choice: kumuha sila para sa kanilang sarili
  rationale: Pinananatili nito ang Hebreong idyoma ng ‘pagkuha’ ng asawa at ang diwang pansarili ng לָהֶם; malinaw ang kahulugang pag-aasawa dahil sa kasunod na ‘mga asawang.’
- source_word: נָשִׁים מֹאֲבִיּוֹת
  choice: mga asawang Moabita
  rationale: Tinutukoy ng parirala kapuwa ang katayuan nila bilang mga asawa at ang kanilang pagka-Moabita.
- source_word: שֵׁם הָאַחַת
  choice: Ang pangalan ng isa ay
  rationale: Malapit sa Hebreong pormula ng pagpapangalan at natural na naihahambing sa ‘ikalawa.’
- source_word: עָרְפָּה
  choice: Orpa
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: at ang pangalan ng ikalawa ay
  rationale: Tuwirang pinananatili ang ordinal na kahulugan ng הַשֵּׁנִית at ang paralelismo ng dalawang pangalan.
- source_word: רוּת
  choice: Ruth
  rationale: Karaniwang anyo ng pangalan sa mga saling Tagalog at malinaw na transliterasyon ng pangalang Hebreo.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: At nanirahan sila roon
  rationale: Ang ‘nanirahan’ ay natural at angkop sa matagal na pananatiling ipinahihiwatig ng konteksto.
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: nang mga sampung taon
  rationale: Ipinahahayag ng ‘mga’ ang pagtatantiya ng prefiks na כְּ, hindi eksaktong sampung taon.
