base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/009.yaml
  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: tl
  text: “Ipagkaloob nawa ni Yahweh na makatagpo kayo ng kapahingahan[a], bawat isa sa tahanan ng kani-kaniyang asawa.” Pagkatapos, hinalikan niya sila, at itinaas nila ang kanilang mga tinig at umiyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katiwasayan” o “panatag na kalagayan.” Dito, ang Hebreong salitang isinaling “kapahingahan” ay tumutukoy sa matatag at panatag na pamumuhay sa tahanan ng asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן יְהוָה
  choice: Ipagkaloob nawa sa inyo ni Yahweh
  rationale: Ipinahahayag ng anyong pandiwa ang isang basbas o hangarin; likas itong naihahatid sa Filipino sa pamamagitan ng “nawa.” Pinananatili rin ang personal na pangalang Yahweh.
- source_word: וּמְצֶאןָ מְנוּחָה
  choice: na ... ay makatagpo ng kapahingahan
  rationale: Ang pandiwa ay nagpapatuloy sa hangarin ng basbas, at ang “kapahingahan” ay nagpapanatili sa pangunahing larawan ng Hebreong מְנוּחָה habang ipinahihiwatig ng konteksto ang panatag at matatag na pamumuhay.
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: ang bawat isa sa inyo ... sa tahanan ng magiging asawa niya
  rationale: 'Distributibo ang parirala: ang bawat babae ay inaasahang makatatagpo ng kapahingahan sa sambahayan ng sarili niyang asawa. Nilinaw ng “magiging” na tinutukoy ni Noemi ang inaasam na muling pag-aasawa ng mga balo, hindi ang mga yumao nilang asawa.'
- source_word: וַתִּשַּׁק לָהֶן
  choice: Pagkatapos, hinalikan niya sila
  rationale: Likas na salaysay sa Filipino ang “Pagkatapos” para sa payak na pagkakasunod ng mga pangyayari.
- source_word: וַתִּשֶּׂאנָה קוֹלָן וַתִּבְכֶּינָה
  choice: At humagulgol sila nang malakas
  rationale: Ang literal na idyomang “itinaas nila ang kanilang tinig at umiyak” ay tumutukoy sa malakas at hayagang pag-iyak. Ang “humagulgol ... nang malakas” ay natural sa modernong Filipino at pinagsasama nang tumpak ang idyoma at kasunod na pandiwa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng “kapahingahan” sa tahanan ng asawa
  choice: Pinanatili ang “kapahingahan,” na may talababa tungkol sa panatag at matatag na kalagayan
  alternative: katiwasayan / panatag na pamumuhay
  rationale: Pinananatili nito ang leksikal na larawan ng Hebreo at hindi nililimitahan sa iisang paliwanag ang kahulugan, habang nililinaw ng konteksto at talababa ang kaugnayan nito sa buhay sa sambahayan ng asawa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nawa” upang likas na maipahayag ang basbas, at “humagulgol nang malakas” upang maihatid ang Hebreong idyoma ng malakas na pag-iyak nang hindi nagiging salitang-salita.
