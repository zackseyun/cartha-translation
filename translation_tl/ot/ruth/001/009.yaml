- from: “Ipagkaloob nawa sa inyo ni Yahweh na ang bawat isa sa inyo ay makatagpo ng kapahingahan[a] sa tahanan ng magiging asawa niya.” Pagkatapos, hinalikan niya sila. At humagulgol sila nang malakas.
  to: “Ipagkaloob nawa ni Yahweh na makatagpo kayo ng kapahingahan[a], bawat isa sa tahanan ng kani-kaniyang asawa.” Pagkatapos, hinalikan niya sila, at itinaas nila ang kanilang mga tinig at umiyak.
  rationale: Inalis ang hindi hayagang aspektong “magiging” upang mapanatili ang anyo ng Hebreo, habang ang “kani-kaniyang” ay malinaw na naghahatid ng distributibong kahulugan. Ibinabalik din ng huling sugnay ang dalawang magkahiwalay ngunit magkaugnay na pandiwa ng Hebreo—pagtaas ng tinig at pag-iyak—nang natural sa Filipino.
