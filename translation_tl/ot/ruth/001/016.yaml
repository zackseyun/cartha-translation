base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: tl
  text: Ngunit sinabi ni Ruth, “Huwag mo akong himukin[a] na iwan ka at tumalikod sa pagsunod sa iyo.[b] Sapagkat kung saan ka pupunta, pupunta rin ako; at kung saan ka manunuluyan, manunuluyan din ako.[c] Ang bayan mo ay bayan ko, at ang Diyos mo ay Diyos ko.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mariing himukin,” “pakiusapan,” o “kulitin.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “bumalik mula sa likuran mo,” isang idyoma para sa pagtigil sa pagsunod sa iyo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kung saan ka magpapalipas ng gabi, doon din ako magpapalipas ng gabi.”
    reason: lexical_alternative
  - marker: d
    text: 'Walang pandiwang pang-ugnay ang mga sugnay na Hebreo: “Ang bayan mo, bayan ko; at ang Diyos mo, Diyos ko.” Maaari ring unawain o isaling may panghinaharap na diwa: “Ang bayan mo ay magiging bayan ko, at ang Diyos mo ay magiging Diyos ko.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: pilitin
  rationale: Sa pagkakagamit na may ב, ang פגע ay maaaring mangahulugang mariing humimok, makiusap, o mangulit. Ang “pilitin” ay natural sa makabagong Tagalog para sa pakiusap ni Ruth na tigilan na siya ni Naomi sa paggigiit, bagaman hindi ito tumutukoy sa pisikal na pamimilit.
- source_word: לְעָזְבֵךְ
  choice: iwan ka
  rationale: Ang עזב ay karaniwang nangangahulugang iwan o pabayaan. Ang “iwan ka” ang pinakanatural dito at hindi nagdaragdag ng mas mabigat na pahiwatig na hindi hinihingi ng konteksto.
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: tumalikod sa pagsunod sa iyo
  rationale: Pinagsasama nito ang diwa ng שׁוב na pagbalik o pagtalikod at ng מֵאַחֲרָיִךְ na literal na “mula sa likuran mo,” isang idyoma para sa paghinto sa pagsunod sa isang tao.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala rito ng כִּי ang dahilan ng pakiusap ni Ruth. Ang “Sapagkat” ay malinaw, marangal, at angkop sa tuwirang pananalita.
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: kung saan ka pupunta, pupunta rin ako
  rationale: Likas na Tagalog ito para sa konstruksiyong nagsasaad ng patutunguhan at pinananatili nito ang paralelismo ng Hebreo.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: kung saan ka manunuluyan, manunuluyan din ako
  rationale: Ang לון ay tumutukoy sa pagtuloy o pagpapalipas ng gabi. Pinananatili ng “manunuluyan” ang konkretong diwa at ang panulaan ng magkatugmang mga sugnay.
- source_word: עַמֵּךְ עַמִּי
  choice: Ang bayan mo ay bayan ko
  rationale: Walang tahasang pandiwang pang-ugnay ang Hebreo. Natural sa Tagalog ang nominal na pahayag na ito at hindi kailangang tiyaking pangkasalukuyan o panghinaharap ang diwa.
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: at ang Diyos mo ay Diyos ko
  rationale: Pinananatili nito ang maikli at mariing pagtatapat ni Ruth. Ang anyong Hebreo at ang konteksto ay tumutukoy sa Diyos ni Naomi, hindi sa maraming diyos.
theological_decisions:
- issue: Panahunan ng dalawang sugnay ng pagkakakilanlan na walang pandiwa
  choice: 'Gamitin ang natural na nominal na mga sugnay: “Ang bayan mo ay bayan ko, at ang Diyos mo ay Diyos ko.”'
  alternative: 'Lagyan ng tahasang panghinaharap: “Ang bayan mo ay magiging bayan ko, at ang Diyos mo ay magiging Diyos ko.”'
  rationale: Walang copula o pandiwang nagsasaad ng panahunan sa Hebreo. Kayang panatilihin ng Tagalog na nominal na anyo ang maigsi at mariing pahayag, pati ang pag-igting sa pagitan ng kasalukuyang pagkilala at ipinapangakong katapatan, nang hindi nagpapasya nang higit sa teksto.
translation_notes:
  register: Makabago, natural, at marangal na Filipino Tagalog. Ginamit ang “bayan” para sa עַם bilang pangkat ng mga taong kinabibilangan, hindi lamang isang pook; pinanatili rin ang paralelismo at maigsi, panatang himig ng pananalita ni Ruth.
