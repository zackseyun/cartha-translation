    issue: Ang “Kaya” ay nagdaragdag ng ugnayang sanhi.
    rationale: Ang Hebreong וַיֵּלֶךְ ay simpleng pagpapatuloy ng salaysay (“at pumunta”); hindi sinasabi ng talata na ang pag-alis ay bunga ng taggutom sa paraang ipinahihiwatig ng “Kaya.”
  - severity: low
    issue: Ang “dalawa nilang anak na lalaki” ay higit sa tahasang saklaw ng parirala.
    rationale: Ang וּשְׁנֵי בָנָיו ay “ang dalawa niyang anak na lalaki.” Bagaman malinaw sa mas malawak na salaysay ang kaugnayan ng asawa, hindi ito kailangang ipasok sa mismong salin.
