  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: tl
  text: Noong panahong namamahala ang mga hukom,[a] nagkaroon ng taggutom sa lupain. At isang lalaki mula sa Bethlehem sa Juda ang pumunta sa mga bukirin ng Moab upang pansamantalang manirahan doon bilang tagalabas[b]—kasama ang kanyang asawa at ang dalawa niyang anak na lalaki.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “noong humahatol ang mga hukom.” Inuulit sa Hebreo ang iisang salitang-ugat para sa “humatol” at “mga hukom”; maaari rin itong mangahulugang “noong namumuno ang mga hukom.”'
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang Hebreo ay maaaring magpahiwatig ng pansamantalang paninirahan bilang isang tagalabas, hindi kinakailangang permanenteng paninirahan.
    reason: cultural_note
  - marker: c
    text: 'Mas literal: “siya, ang kanyang asawa, at ang dalawa niyang anak na lalaki.”'
    reason: translation_note
lexical_decisions:
- source_word: וַיְהִי
  choice: nagkaroon
  rationale: Sa ikalawang paglitaw nito, ipinakikilala ng narrative wayyiqtol ng היה ang pangyayaring nagkaroon ng taggutom. Hindi na kailangan sa natural na Tagalog ang hiwalay na panimulang “At nangyari” sapagkat maayos na naihahatid ng “Nang panahong…” ang balangkas ng salaysay.
- source_word: בִּימֵי שְׁפֹט הַשֹּׁפְטִים
  choice: Nang panahong namamahala ang mga hukom
  rationale: Ang שׁפט ay maaaring tumukoy sa paghatol o pamamahala. Mas natural sa modernong Tagalog ang “namamahala ang mga hukom” sa kontekstong tumutukoy sa panahon ng mga hukom; inilalagay sa talababa ang mas literal na pag-uulit ng ugat.
- source_word: רָעָב
  choice: taggutom
  rationale: Karaniwan at tiyak na salitang Tagalog para sa malawak at matinding kakulangan ng pagkain.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Pinananatili ang bahagyang di-tiyak na pagtukoy ng Hebrew sa “lupain,” na mauunawaan sa konteksto bilang lupain ng Juda o Israel.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tumpak na pinananatili ang panlalaking katauhan na kalauna'y kikilalaning si Elimelec.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: mula sa Bethlehem sa Juda
  rationale: Likas sa Tagalog ang “Bethlehem sa Juda,” at malinaw nitong itinatangi ang bayang ito ayon sa lokasyon nito.
- source_word: לָגוּר
  choice: upang pansamantalang manirahan doon bilang dayuhan
  rationale: 'Ipinapahayag ang dalawang mahalagang pahiwatig ng גור: pansamantalang paninirahan at katayuan bilang tagalabas o dayuhan.'
- source_word: בִּשְׂדֵי מוֹאָב
  choice: sa mga bukirin ng Moab
  rationale: Pinananatili ang konkretong pangmaramihang “mga bukirin,” bagaman maaari rin itong tumukoy sa nasasakupan o lupain ng Moab.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: kasama ang kanyang asawa at dalawa nilang anak na lalaki
  rationale: Natural na Tagalog para sa appositional na talaan ng mga kasamang miyembro ng pamilya; nililinaw ng “kanilang” na mga anak sila ng mag-asawa nang hindi binabago ang kahulugan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “namamahala” sa pangunahing teksto para sa natural na daloy, habang pinanatili sa talababa ang pag-uulit at lawak ng kahulugan ng שׁפט. Isinalin nang tahasan ang pansamantalang at dayuhang diwa ng גור; pinanatili ang konkretong “mga bukirin ng Moab.”
