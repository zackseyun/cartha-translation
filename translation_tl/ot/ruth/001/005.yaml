translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “ang babae” at “mga anak” upang hindi lampasan ang tiyak na pananalita ng Hebreo. Ginamit ang mga gitling na em upang maayos na ilahad ang mga pangalan bilang paliwanag sa “silang dalawa.”
