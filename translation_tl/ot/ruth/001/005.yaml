  yaml_path: translation/ot/ruth/001/005.yaml
  text: Then both of them also died[a], Mahlon and Chilion, and the woman was left without her two children and without her husband.
translation:
  language: tl
  text: Pagkatapos, namatay rin silang dalawa—sina Mahlon at Kilion—at naiwan ang babae na wala ang dalawa niyang anak[a] at ang kanyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalawa niyang anak na lalaki.” Ang salitang Hebreo ay literal na “mga anak” at maaari ring tumukoy sa mga supling sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: Pagkatapos, namatay
  rationale: Ang wayyiqtol ng מוּת ay nagsusulong sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos, namatay” upang ipakita ang kasunod na pangyayari.
- source_word: גַם שְׁנֵיהֶם
  choice: din silang dalawa
  rationale: Pinananatili ng “din” ang dagdag na pagpanaw kasunod ng naunang pagkawala, at malinaw na ipinapahayag ng “silang dalawa” na kapwa namatay ang dalawang anak.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Mahlon at Kilion
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang Hebreo; ang כ sa כִלְיוֹן ay kinakatawan ng K sa “Kilion.”
- source_word: וַתִּשָּׁאֵר
  choice: kaya naiwan
  rationale: Ang שׁאר ay nangangahulugang manatili o maiwan. Sa konteksto ng pangungulila, natural na ipinahihiwatig ng “naiwan” ang kalagayan ng babaeng nabuhay matapos mawala ang kanyang pamilya; ang “kaya” ay nagpapalinaw sa bunga ng mga pagpanaw nang hindi nagdaragdag ng teolohikal na paliwanag.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Pinananatili ang tiyak ngunit hindi pinangalanang katawagan ng Hebreo, sa halip na ipalit ang “si Naomi” o “ang asawa.”
- source_word: מִשְּׁנֵי יְלָדֶיהָ
  choice: nang wala ang dalawa niyang anak
  rationale: Ang מִן kasunod ng שׁאר ay nagpapahayag ng pagkawalay o pagkawala. Ang יְלָדִים ay literal na “mga anak” o “mga supling,” kahit mga lalaking nasa hustong gulang ang tinutukoy rito.
- source_word: וּמֵאִישָׁהּ
  choice: at ang kanyang asawa
  rationale: Sa hulma ng “naiwan ... nang wala,” ipinagpapatuloy ng parirala ang kahulugan ng pagkakait o pagkawala. Ang אִישׁ na may hulaping paari ay tumutukoy rito sa kanyang asawa.
