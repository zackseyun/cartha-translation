base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: tl
  text: Bumalik kayo[a], mga anak kong babae; humayo na kayo, sapagkat napakatanda ko na para mag-asawa pa. Kahit sabihin ko[b], ‘May pag-asa pa ako’—kahit magkaasawa ako ngayong gabi at magsilang pa ng mga anak na lalaki—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Manumbalik kayo.”
    reason: lexical_alternative
  - marker: b
    text: 'Naglalahad ang Hebreo ng magkakaugnay na palagay: “Sapagkat kung sabihin kong, ‘May pag-asa ako,’ kahit magkaroon ako ng asawa ngayong gabi at magsilang din ng mga anak na lalaki—”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: Bumalik kayo
  rationale: Pambabaeng pangmaramihang pautos mula sa שוב. Sa konteksto, hinihimok ni Noemi sina Ruth at Orpa na bumalik at huwag na siyang samahan.
- source_word: בְנֹתַי
  choice: mga anak ko
  rationale: Literal na katawagang pampamilya at mapagmahal sa mga manugang; natural itong pakinggan sa modernong Filipino.
- source_word: לֵכְנָה
  choice: humayo na kayo
  rationale: Ikalawang pambabaeng pangmaramihang pautos. Ang “humayo na” ay nagsasaad na ipagpatuloy nila ang sarili nilang lakad, habang pinananatili ang marangal na rehistro.
- source_word: זָקַנְתִּי
  choice: napakatanda ko na
  rationale: Ipinapahayag ng perfect ang kasalukuyang kalagayang bunga ng pagtanda; ipinahihiwatig ng konteksto na lampas na siya sa makatotohanang pag-asang makapag-asawa muli.
- source_word: מִהְיוֹת לְאִישׁ
  choice: upang mag-asawa pa
  rationale: Ang literal na Hebreong idyoma ay “mula sa pagiging para sa isang lalaki/asawa.” Sa Filipino, “mag-asawa pa” ang malinaw at natural na katumbas nang hindi ipinapasok ang di-likas na ideya ng pagmamay-ari.
- source_word: כִּי אָמַרְתִּי
  choice: Kahit sabihin ko
  rationale: Nagsisimula rito ang isang di-malamang na sunod-sunod na palagay. Pinananatili ng “kahit” ang retorikal na pag-igting.
- source_word: יֶשׁ לִי תִקְוָה
  choice: May pag-asa pa ako
  rationale: Natural na Filipino para sa eksistensiyal na pariralang “may pag-asa para sa akin”; ipinapakita ng “pa” na pansamantalang ipinagpapalagay ni Noemi ang isang nalalabing posibilidad.
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: kahit mag-asawa ako ngayong gabi
  rationale: Ipinapalagay ang agarang pagkakaroon ng asawa o pagsasamang mag-asawa. Hindi nito labis na tinutukoy kung seremonya o pagtatalik ang pokus ng Hebreong idyoma.
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: at magsilang pa ng mga anak na lalaki
  rationale: Tahasang tumutukoy ang ילד sa panganganak at ang בָנִים sa mga anak na lalaki; mahalaga ang kasariang ito sa argumento tungkol sa maaaring mapangasawa ng mga biyuda.
theological_decisions:
- issue: Pagpapanatili sa tiyak na kasarian ng magiging supling sa konteksto ng pagpapatuloy ng angkan
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Tahasang בָנִים ang Hebreo, at nakasalalay ang argumento ni Noemi sa posibilidad ng mga lalaking anak na maaaring lumaki upang maging asawa nina Ruth at Orpa. Hindi dapat gawing neutral ang kasarian.
- issue: Ugnayan ng pag-aasawa at pagsilang sa hipotetikal na pangangatwiran
  choice: Pinanatili bilang sunod-sunod na imposibleng-palagay na nagtatapos sa gitling
  alternative: Gawing tahasang kondisyong may idinagdag na konklusyon
  rationale: Hindi pa natatapos ang pangungusap sa talatang ito; ipinagpapatuloy sa susunod na talata ang tanong ni Noemi. Ang gitling ay nagpapanatili sa tensiyon at hindi nagdaragdag ng konklusyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga anak ko” bilang natural na mapagmahal na tawag sa mga manugang. Ang “humayo” ay bahagyang mataas ang rehistro ngunit malinaw at angkop sa salaysay. Pinanatili ang nakabiting pangungusap sa dulo dahil nagpapatuloy ang lohika sa Ruth 1:13.
