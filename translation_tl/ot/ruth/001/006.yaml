base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: tl
  text: Pagkatapos, bumangon siya kasama ang kanyang mga manugang na babae at bumalik mula sa lupain ng Moab, sapagkat habang nasa lupain ng Moab ay nabalitaan niyang dinalaw ni Yahweh ang kanyang bayan upang bigyan sila ng pagkain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tinapay”; maaari ring tumukoy ang salitang Hebreo sa pagkain o panustos sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Pagkatapos, tumindig siya
  rationale: Ang wayyiqtol ay nagsusulong sa salaysay. Likas at marangal sa Filipino ang “tumindig,” at ipinahihiwatig ng “Pagkatapos” ang pagkakasunod ng pangyayari.
- source_word: וְכַלֹּתֶיהָ
  choice: kasama ang mga manugang niyang babae
  rationale: Nililinaw ng “babae” na ang tinutukoy ay mga daughter-in-law, yamang maaaring tumukoy sa alinmang kasarian ang “manugang” sa Filipino; ang pang-ugnay ay likas na ipinahayag bilang pagsama.
- source_word: וַתָּשָׁב מִשְּׂדֵי מוֹאָב
  choice: umalis sa lupain ng Moab upang bumalik
  rationale: Ang שׁוב ay nangangahulugang bumalik. Iniiwasan ng ayos na ito ang di-likas na “bumalik mula” at malinaw na ipinakikitang nagsimula siyang umalis sa Moab para sa pagbabalik, nang hindi ipinahihiwatig na natapos na agad ang paglalakbay.
- source_word: שְׂדֵי / שְׂדֵה מוֹאָב
  choice: lupain ng Moab / habang nasa Moab
  rationale: Sa kontekstong heograpiko, ang שׂדה ay maaaring tumukoy sa kaparangan, teritoryo, o rehiyon, hindi lamang sa isang bukid. Ang mga pariralang ito ay natural sa modernong Filipino at pinananatili ang rehiyonal na diwa.
- source_word: שָׁמְעָה
  choice: nabalitaan niya
  rationale: Ang qatal ay nagbibigay ng naunang impormasyong naging dahilan ng pagkilos. Ang “nabalitaan” ay natural na nagsasaad na may ulat siyang narinig habang nasa Moab.
- source_word: פָּקַד
  choice: dinalaw
  rationale: Pinananatili ng “dinalaw” ang pangunahing larawan ng פקד at ang diwa ng mabuting pakikialam ni Yahweh, nang hindi labis na tinutukoy ang paraan ng kanyang pagtulong.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: עַמּוֹ
  choice: kanyang bayan
  rationale: Ang “bayan” ay natural na katumbas ng עם sa kontekstong tipan at pinananatili ang ugnayan sa pagitan ni Yahweh at ng Israel.
- source_word: לָתֵת לָהֶם לָחֶם
  choice: binigyan sila ng pagkain
  rationale: Ang infinitive na לָתֵת ay nagpapaliwanag kung paano nagpakita ang pagdalaw ni Yahweh. Ang לֶחֶם ay literal na tinapay ngunit maaari ring tumukoy sa pagkain sa pangkalahatan, lalo na sa konteksto ng taggutom.
theological_decisions:
- issue: Paglalarawan sa pagkilos ni Yahweh sa pandiwang פקד
  choice: dinalaw ni Yahweh ang kanyang bayan
  alternative: tinulungan ni Yahweh ang kanyang bayan
  rationale: Ang “dinalaw” ay nagpapanatili ng sadyang lawak ng Hebreo—paglingap at aktuwal na pakikialam—samantalang ang “tinulungan” ay mas tahasang interpretasyon.
- issue: Paglalahad ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga manugang niyang babae” para alisin ang kalabuan ng kasarian sa Filipino. Ang “umalis ... upang bumalik” ay angkop sa yugto ng salaysay: nagsimula pa lamang ang pagbabalik mula sa Moab. Inilagay ang talababa pagkatapos ng “pagkain,” ang salitang tinutukoy nito.'
