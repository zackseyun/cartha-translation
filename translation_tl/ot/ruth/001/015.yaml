base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: tl
  text: Sinabi niya, “Tingnan mo, bumalik[a] na ang hipag mo sa kanyang mga kababayan at sa kanyang mga diyos.[b] Bumalik ka at sumunod sa hipag mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang pandiwang Hebreo na isinaling “bumalik” ay inuulit sa talatang ito: una para sa ginawa ni Orpa at pagkatapos bilang utos ni Noemi kay Rut. Maaari rin itong isaling “nagbalik.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa kanyang mga diyos.” Maaari rin itong unawain bilang “sa kanyang diyos,” ngunit malamang na tumutukoy ang maramihan sa mga diyos ng Moab.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sinabi niya
  rationale: Karaniwang anyong pasalaysay na nagpapakilala sa sinabi ni Noemi. Pinananatili ng panghalip na “niya” ang di-tahasang pagbanggit sa nagsasalita sa Hebreo.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pantawag-pansin ito sa kalagayan ni Orpa. Natural at malinaw ang “Tingnan mo” sa makabagong Filipino.
- source_word: שָׁבָה / שׁוּבִי
  choice: bumalik / Bumalik ka
  rationale: Magkaparehong ugat na שוב ang kilos ni Orpa at ang utos kay Ruth. Ang pag-uulit ng “bumalik” ay nagpapanatili sa sadyang pag-uugnay ng dalawang pahayag.
- source_word: יְבִמְתֵּךְ
  choice: hipag mo
  rationale: Sa konteksto, tumutukoy ito sa babaeng kamag-anak sa pamamagitan ng pag-aasawa. Ang “hipag” ang maikli at natural na katumbas sa Filipino, at pareho itong ginamit sa dalawang paglitaw.
- source_word: אֶל עַמָּהּ
  choice: sa kanyang mga kababayan
  rationale: Ang עַם ay tumutukoy sa kinabibilangang pangkat o bayan ni Orpa, hindi lamang sa malapit niyang pamilya. Binibigyang-diin ng “mga kababayan” ang mga tao sa halip na isang heograpikong lugar.
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: at sa kanyang mga diyos
  rationale: Malamang na tumutukoy ang anyong maramihan sa mga diyos ng Moab. Pinananatili ng salin ang kaibahan sa pagsamba sa Diyos ng Israel nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: אַחֲרֵי
  choice: kasunod ng
  rationale: Tuwirang inilalarawan nito ang pagsunod ni Ruth sa landas o ginawa ng kanyang hipag, habang iniiwasang gawing mas tiyak kaysa sa Hebreo ang ugnayan.
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהֶיהָ kaugnay ng pagsamba ng mga Moabita
  choice: kanyang mga diyos
  alternative: kanyang diyos
  rationale: Bagaman maaaring gamitin ang אֱלֹהִים bilang isahan sa ibang konteksto, dito ay bumabalik si Orpa sa kanyang bayang Moabita at sa pagsamba nito. Malamang na maramihan ang diwa, ngunit binabanggit sa talababa ang posibleng isahang pagbasa upang mapanatili ang tunay na kalabuan ng anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “hipag” at “mga kababayan,” at pinanatili ang pag-uulit ng “bumalik” at ang bahagyang bukas na diwa ng “kasunod ng.”
