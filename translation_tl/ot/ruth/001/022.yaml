base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: tl
  text: Kaya bumalik si Noemi, kasama niya si Ruth na Moabita, ang kanyang manugang, na bumalik mula sa mga bukirin ng Moab.[a] Dumating sila sa Betlehem sa pasimula ng anihan ng sebada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas idyomatikong pananalita, “mula sa lupain ng Moab.” Sa Hebreo, “mula sa mga bukirin ng Moab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: bumalik
  rationale: Tuwirang katumbas ng pandiwang mula sa שוב at pinananatili ang ugnayang pasalaysay sa kasunod na participle.
- source_word: הַמּוֹאֲבִיָּה
  choice: na Moabita
  rationale: Pinananatili ang tahasang katawagang etniko kay Ruth, na mahalaga sa salaysay.
- source_word: כַלָּתָהּ
  choice: ang kanyang manugang
  rationale: Likas at karaniwang katumbas sa Filipino ng katawagang pampamilya; hindi na kailangang tukuying babae sapagkat malinaw na si Ruth ang tinutukoy.
- source_word: עִמָּהּ
  choice: kasama niya
  rationale: Natural na Filipino para sa ideya ng pagsama kay Noemi.
- source_word: הַשָּׁבָה
  choice: na bumalik
  rationale: Isinasalin ang pambabaeng isahang participle bilang sugnay na naglalarawan, nang hindi dinaragdagan ang aspektong wala sa Hebreo.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: mula sa mga bukirin ng Moab
  rationale: Pinananatili ang literal na larawang 'mga bukirin,' habang inilalagay sa talababa ang mas malawak na idyomatikong kahulugan.
- source_word: בָּאוּ
  choice: dumating
  rationale: Mas natural sa Filipino para sa pagdating sa tahasang destinasyong Betlehem kaysa sa literal na 'pumaroon.'
- source_word: בֵּית לֶחֶם
  choice: Betlehem
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng lugar.
- source_word: בִּתְחִלַּת קְצִיר שְׂעֹרִים
  choice: sa pasimula ng anihan ng sebada
  rationale: Malinaw at natural na pagpapahayag ng panahong nagsisimula ang pag-aani ng sebada.
theological_decisions:
- issue: Ang tinutukoy ng pambabaeng isahang participle הַשָּׁבָה
  choice: Sa pangunahing teksto, pinakamalapit na tumutukoy ito kay Ruth, ngunit minarkahan ang kalabuan sa talababa.
  alternative: Maaaring tumukoy ito kay Noemi, ang pangunahing simuno ng pandiwang 'bumalik.'
  rationale: Parehong pambabae at isahan sina Ruth at Noemi, kaya pinahihintulutan ng anyong Hebreo ang dalawang pagbasa. Ang lapit ng parirala kay Ruth ay pumapabor sa pagbasa na si Ruth ang tinutukoy, ngunit hindi dapat ikubli ang tunay na kalabuan.
translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinanatili ang 'Moabita' bilang mahalagang katawagang etniko at ang 'mga bukirin' bilang konkretong larawan ng Hebreo; iniwasan ang sobrang pormal o lumang ayos ng pangungusap.
