base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: tl
  text: Hihintayin ba ninyo sila hanggang sa lumaki sila? Magpipigil ba kayong mag-asawa dahil sa kanila?[a] Hindi, mga anak ko, sapagkat higit na mapait ang kalagayan ko kaysa sa inyo, dahil kumilos laban sa akin ang kamay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mananatili ba kayong hindi mag-asawa dahil sa kanila?” Bihira ang pandiwang Hebreo at malamang na tumutukoy sa pagpipigil sa pag-aasawa habang naghihintay ng magiging asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: hihintayin ba ninyo
  rationale: Ang pandiwa ay may diwang maghintay o umasa; sa konteksto, praktikal na paghihintay sa mga ipinapalagay na anak na lalaki ang tinutukoy.
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: hanggang sa lumaki sila
  rationale: Likas na Tagalog para sa paghihintay hanggang umabot sa sapat na gulang ang mga ipinapalagay na anak.
- source_word: תֵּעָגֵנָה לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: magpipigil ba kayong mag-asawa
  rationale: Bihira ang pandiwang עגן, ngunit nililinaw ng kasunod na parirala na tumutukoy ito sa pagpigil o pananatiling hindi nag-aasawa habang naghihintay.
- source_word: אַל בְּנֹתַי
  choice: Huwag na, mga anak ko
  rationale: Ipinahahayag ng אַל ang madamdaming pagtanggi ni Noemi; natural sa Tagalog ang “Huwag na” at napapanatili ang bahagyang puwersang nagbabawal.
- source_word: כִּי מַר לִי מְאֹד מִכֶּם
  choice: sapagkat higit na mapait ang sinapit ko kaysa sa inyo
  rationale: Ginagawang malinaw ang paghahambing at ginagamit ang “sinapit” upang maging natural ang metaporang “mapait” sa Tagalog nang hindi inaalis ito.
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: kumilos laban sa akin ang kamay ni Yahweh
  rationale: Pinananatili ang larawan ng kamay bilang banal na pagkilos at ang tahasang diwang laban kay Noemi, habang natural ang pandiwa sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Ang pahayag ni Noemi tungkol sa pagkilos ng Diyos sa kanyang pagdurusa
  choice: dahil kumilos laban sa akin ang kamay ni Yahweh
  alternative: dahil ang kamay ni Yahweh ay lumabas laban sa akin
  rationale: Tahasan sa Hebreo na iniuugnay ni Noemi ang kanyang kapighatian sa kamay ni Yahweh. Pinananatili ang tensiyong teolohikal nang hindi pinahihina o ipinapaliwanag palayo, ngunit ginagawang likas sa Tagalog ang idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Isinalin nang tuwiran sa pangunahing teksto ang malamang na kahulugan ng bihirang pandiwa, kaya hindi kinailangan ang talababa.
