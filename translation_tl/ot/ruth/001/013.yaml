  to: Hihintayin ba ninyo sila hanggang sa lumaki sila? Magpipigil ba kayong mag-asawa dahil sa kanila?[a] Hindi, mga anak ko, sapagkat higit na mapait ang kalagayan ko kaysa sa inyo, dahil kumilos laban sa akin ang kamay ni Yahweh.
