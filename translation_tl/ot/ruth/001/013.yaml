  terminology: Ang “Yahweh” ay wastong transliterasyon ng יהוה ayon sa ibinigay na patakaran. Ang “mag-asawa” ay angkop para sa diwang ng bihirang עגן kasama ng לבלתי היות לאיש. Dahil bihira at hindi ganap na tiyak ang pandiwa, dapat maglaan ng talababa para sa alternatibong “manatiling hindi mag-asawa.”
