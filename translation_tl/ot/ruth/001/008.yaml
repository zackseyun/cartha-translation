base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: tl
  text: Sinabi ni Noemi sa dalawa niyang manugang na babae, “Humayo kayo, bumalik kayo—bawat isa sa bahay ng sarili niyang ina. Nawa’y magpakita si Yahweh sa inyo ng kabutihang-loob[a], gaya ng ipinakita ninyo sa mga namatay at sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “tapat na pag-ibig,” “matibay na pag-ibig,” o “katapatan sa tipan” (Hebreo: hesed).'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: dalawa niyang manugang na babae
  rationale: Ang כַּלָּה rito ay tumutukoy sa asawa ng anak na lalaki. Nililinaw ng “na babae” ang kahulugan sapagkat maaaring tumukoy ang salitang Tagalog na “manugang” sa lalaki o babae.
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: Humayo kayo at bumalik
  rationale: Pinananatili ang dalawang pautos upang maipahayag ang mariing paghimok ni Noemi, sa halip na pagsamahin ang mga ito sa iisang pandiwa.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: bawat isa sa bahay ng sarili niyang ina
  rationale: Ipinahahayag ng “bawat isa” ang distributibong gamit ng אִשָּׁה. Pinananatili ang tiyak na “bahay ng ina” sa halip na gawing pangkalahatang tahanan ng pamilya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa anyong “Yahweh” ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Sinasaklaw ng parirala ang kabutihan at katapatang nakapaloob sa חֶסֶד. Ang iba pang posibleng diwa ay inilalahad sa talababa.
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: gaya ng ipinakita ninyo sa mga yumao at sa akin
  rationale: Sa ugnayan nito sa חֶסֶד, ang עשה ay likas na naipahahayag bilang “ipinakita.” Ang “mga yumao” ay magalang at malinaw na katumbas ng pangmaramihang “mga patay.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Lawak ng kahulugan ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: kabutihang-loob, matibay na pag-ibig, o katapatan sa tipan
  rationale: Hindi nililimitahan ang salita sa simpleng kabaitan lamang. Ipinahahayag ng “tapat na pag-ibig” ang kapuwa malasakit at katapatan, habang kinikilala sa talababa ang tunay na lawak ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “manugang na babae” para sa katumpakan, ang “mga yumao” bilang natural at magalang na pagtukoy sa mga namatay, at ang gitling na em dash upang malinaw na iugnay ang dalawang pautos sa distributibong parirala.
