revisions:
- from: Sinabi ni Noemi sa dalawa niyang manugang na babae, “Humayo kayo at bumalik—bawat isa sa bahay ng sarili niyang ina. Pagpakitaan nawa kayo ni Yahweh ng tapat na pag-ibig[a], gaya ng ipinakita ninyo sa mga yumao at sa akin.”
  to: Sinabi ni Noemi sa dalawa niyang manugang na babae, “Humayo kayo, bumalik kayo—bawat isa sa bahay ng sarili niyang ina. Nawa’y magpakita si Yahweh sa inyo ng kabutihang-loob[a], gaya ng ipinakita ninyo sa mga namatay at sa akin.”
  rationale: Inayos ang pangunahing salin ng חֶסֶד at ang katumbas na pandiwa upang maging natural sa modernong Filipino, habang pinananatili ang lawak ng Hebreong salita sa talababa. Ginawang magkahiwalay ang “Humayo kayo, bumalik kayo” upang malinaw na mapanatili ang diin ng dalawang imperatibo. Pinalitan ang euphemistic na “mga yumao” ng “mga namatay” para sa mas tuwirang pagtutumbas sa pinagmulan.
  reviewer_model: gpt-5.6-terra
