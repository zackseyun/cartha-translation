translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang Hebreong ayos ng pagpapakilala sa mga pangalan ngunit iniangkop ang mga panghalip at daloy sa likas na Tagalog. Ginamit ang mga nakasanayang anyong Filipino ng mga pangalan at inilagay sa talababa ang tunay na mga alternatibong leksikal.
