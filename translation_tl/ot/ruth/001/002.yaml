base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: tl
  text: Ang pangalan ng lalaki ay Elimelec, at ang pangalan ng kanyang asawa ay Noemi. Ang dalawang anak niyang lalaki ay sina Mahlon at Kilion.[a] Sila ay mga Efrateo mula sa Betlehem sa Juda. Dumating sila sa mga bukid ng Moab[b] at naroon sila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kilion ay maaari ring baybayin na “Chilion” sa ibang paraan ng pagsasatinig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lupain ng Moab” o “nasasakupan ng Moab.” Literal sa Hebreo, “mga bukid ng Moab.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “at nanatili sila roon.” Literal sa Hebreo, “at sila ay naroon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאִישׁ
  choice: Ang pangalan ng lalaki ay
  rationale: Pinananatili ang Hebreong pormula ng pagpapangalan sa natural at malinaw na Tagalog.
- source_word: אֱלִימֶלֶךְ
  choice: Elimelec
  rationale: Isinatinig ang pangalang Hebreo ayon sa karaniwang baybay sa Filipino.
- source_word: אִשְׁתּוֹ
  choice: asawa niya
  rationale: Likas na Tagalog para sa 'kanyang asawa'; malinaw na tumutukoy sa asawa ni Elimelec.
- source_word: נָעֳמִי
  choice: Noemi
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Filipino.
- source_word: שְׁנֵי בָנָיו
  choice: dalawa nilang anak na lalaki
  rationale: Tumpak na ipinahahayag ang dalawang lalaking anak ng mag-asawang naunang binanggit.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Mahlon at Kilion
  rationale: Isinatinig ang mga pangalan; ang K sa Kilion ay tuwirang kumakatawan sa Hebreong כ.
- source_word: אֶפְרָתִים
  choice: mga Efrateo
  rationale: Tumutukoy sa mga taong kaugnay ng Efrata, hindi sa tribo ng Efraim.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: mula sa Betlehem sa Juda
  rationale: Natural na tinutukoy ang Betlehem na nasa teritoryo ng Juda.
- source_word: וַיָּבֹאוּ
  choice: Dumating sila
  rationale: Ipinahahayag ang pagdating sa destinasyon nang hindi inilalagay ang pananaw ng nagsasalita sa 'pumarito' o 'pumunta.'
- source_word: שְׂדֵי מוֹאָב
  choice: kaparangan ng Moab
  rationale: Pinananatili ang konkretong larawan ng maramihang 'mga bukid/latag na lupain' habang natural na ipinahahayag ang rehiyon o malawak na lupain.
- source_word: וַיִּהְיוּ שָׁם
  choice: at nanatili roon
  rationale: Natural na Tagalog para sa literal na 'at naroon sila'; inilalahad ang pagpapatuloy ng kanilang paninirahan sa lugar.
