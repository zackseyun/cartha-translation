  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “sasama kami sa iyo pabalik” upang natural na maipahayag ang pagsama at pagbabalik, at pinanatili sa talababa ang mas literal at posibleng pagbasa sa כִּי.
