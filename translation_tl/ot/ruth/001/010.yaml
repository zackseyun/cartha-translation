  text: Ngunit sinabi nila sa kanya, “Hindi! Babalik kaming kasama mo sa iyong bayan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Sapagkat babalik kaming kasama mo sa iyong bayan.”
