lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Ngunit sinabi nila
  rationale: Isinusulong ng waw-consecutive ang salaysay; ipinahihiwatig ng “Ngunit” ang pagsalungat ng mga manugang sa naunang paghimok ni Noemi.
- source_word: לָּהּ
  choice: sa kanya
  rationale: Ang ל na may hulaping ikatlong panauhang pambabae ay tumutukoy kay Noemi bilang pinagsabihan.
- source_word: כִּי
  choice: Hindi!
  rationale: Sa tugon sa naunang paghimok ni Noemi, gumaganap ang כִּי bilang mariing pagsalungat o pagpipilit. Natural itong ipinahahayag sa Filipino bilang “Hindi!” habang inilalagay sa talababa ang mas literal na pagbasa.
- source_word: אִתָּךְ
  choice: sasama kami sa iyo
  rationale: Ipinapahayag ng pang-ukol na may hulaping ikalawang panauhang pambabae ang pagsama kay Noemi; isinama ito sa pandiwang parirala para sa natural na Filipino.
- source_word: נָשׁוּב
  choice: pabalik
  rationale: Ang שׁוּב ay nangangahulugang bumalik o magbalik. Sa pariralang “sasama kami sa iyo pabalik,” napapanatili ang diwa ng pagbabalik at naiiwasan ang hindi natural na “babalik kami kasama mo.”
- source_word: לְעַמֵּךְ
  choice: sa iyong bayan
  rationale: Ang עַם ay tumutukoy sa sambayanan o pangkat na kinabibilangan ni Noemi, hindi lamang sa malapit na kamag-anak. Ang “bayan” ay natural at marangal na katumbas sa kontekstong ito.
