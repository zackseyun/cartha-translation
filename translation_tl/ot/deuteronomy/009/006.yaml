  to: Kaya alamin mong hindi dahil sa iyong katuwiran ibinibigay sa iyo ni Yahweh na iyong Diyos ang mabuting lupaing ito upang angkinin[a], sapagkat ikaw ay isang bayang matigas ang batok.
