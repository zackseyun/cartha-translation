  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: tl
  text: Kaya alamin mong hindi dahil sa iyong katuwiran ibinibigay sa iyo ni Yahweh na iyong Diyos ang mabuting lupaing ito upang angkinin[a], sapagkat ikaw ay isang bayang matigas ang batok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang manahin.” Maaaring tumukoy ang pandiwang Hebreo sa pagtanggap ng mana, ngunit sa Deuteronomio madalas din nitong saklaw ang pagkuha at pag-aari sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Kaya alamin mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki at isahan ay may puwersang pautos o mapanghikayat sa konteksto. Ipinahahayag ng “Kaya” ang ugnayang kongklusyon sa naunang argumento.
- source_word: לֹא בְצִדְקָתְךָ
  choice: hindi dahil sa iyong katuwiran
  rationale: Ang בְּ ay tumutukoy rito sa batayan o dahilan, hindi sa kasangkapan. Pinananatili ng “katuwiran” ang moral at tipanang diwa ng צְדָקָה.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Tuwirang pinananatili ang banal na pangalan at ang tipanang kaugnayang ipinahahayag ng hulaping ikalawang panauhan.
- source_word: נֹתֵן לְךָ
  choice: ibinibigay sa iyo
  rationale: Ang participle ay nagpapahiwatig ng kasalukuyan o nalalapit na pagkilos habang nakahanda ang Israel na pumasok sa lupain.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: ang mabuting lupaing ito
  rationale: Likas sa Tagalog ang ayos na ito at napapanatili nito ang diin ng pantukoy at ang positibong paglalarawan sa lupain.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Sa Deuteronomio, ang ירשׁ ay madalas tumukoy sa pagkuha at paghawak sa lupain bilang pag-aari. Ang “angkinin” ay maikli at likas, habang maaaring tumukoy rin ang salita sa pagtanggap bilang mana.
- source_word: כִּי עַם קְשֵׁה עֹרֶף אָתָּה
  choice: sapagkat ikaw ay isang bayang matigas ang batok
  rationale: Ang ikalawang כִּי ay nagpapakilala ng paliwanag. Pinananatili ng “matigas ang batok” ang kongkretong Hebreong talinghaga para sa katigasan ng ulo at paghihimagsik.
theological_decisions:
- issue: Batayan ng pagtanggap ng Israel sa lupain
  choice: Malinaw na itinatanggi na ang sariling katuwiran ng Israel ang dahilan ng pagkakaloob ng lupain.
  alternative: Gawing pangkalahatang aral lamang tungkol sa pagpapakumbaba.
  rationale: Tahasang inihahambing ng Hebreo ang hindi sapat na katuwiran ng Israel, ang pagbibigay ng Diyos, at ang katigasan ng Israel; pinananatili ang tensiyong ito nang walang idinadagdag na mas malawak na sistemang doktrinal.
- issue: Kolektibong isahang kausap
  choice: Gamitin ang isahang “ikaw” para sa Israel bilang isang bayang kolektibo.
  alternative: Palawakin bilang maramihang “kayong lahat.”
  rationale: Isahan ang mga panghalip sa Hebreo at kolektibo ang עַם. Pinananatili ng “ikaw” at “isang bayan” ang gramatika at retorika ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang “Yahweh,” ang kolektibong isahang “ikaw,” at ang Hebreong talinghagang “matigas ang batok.”
