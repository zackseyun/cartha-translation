revisions:
- from: Alalahanin mo—huwag mong kalilimutan—kung paano mo ginalit si Yahweh na iyong Diyos sa ilang.[a] Mula nang araw na lumabas ka sa lupain ng Ehipto hanggang sa dumating kayo sa lugar na ito, patuloy kayong naghimagsik laban kay Yahweh.[b]
  to: Alalahanin mo—huwag mong kalimutan—kung paano mo pinagalit si Yahweh na iyong Diyos sa ilang.[a] Mula noong araw na lumabas ka sa lupain ng Ehipto hanggang sa dumating kayo sa lugar na ito, paulit-ulit kayong naghimagsik laban kay Yahweh.[b]
  rationale: Inayos ang di-likas na panandang panahon, ginawang mas tuwiran ang negatibong utos, at pinalitan ang aspektong maaaring magpahiwatig ng walang patid na pagkilos ng habitual na “paulit-ulit.” Inilipat din ang talababa b sa salitang ipinapaliwanag nito. Walang binagong kahulugan o idinagdag na interpretasyong doktrinal.
