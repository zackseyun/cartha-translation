  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: tl
  text: Alalahanin mo—huwag mong kalimutan—kung paano mo pinagalit si Yahweh na iyong Diyos sa ilang.[a] Mula noong araw na lumabas ka sa lupain ng Ehipto hanggang sa dumating kayo sa lugar na ito, paulit-ulit kayong naghimagsik laban kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kung paano mo pinukaw sa galit si Yahweh na iyong Diyos sa ilang.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kasama ni Yahweh”; sa konteksto ng paghihimagsik, ang diwa ay “laban kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: Alalahanin mo—huwag mong kalilimutan
  rationale: Pinananatili ang dalawang magkaugnay na utos at ang mariing pag-uulit sa Hebreo.
- source_word: אֲשֶׁר הִקְצַפְתָּ
  choice: kung paano mo ginalit
  rationale: 'Likas sa modernong Tagalog at naipapahayag ang causative na diwa ng Hiphil: naging sanhi sila ng galit ni Yahweh.'
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: si Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na banal na pangalan at ang pang-isahang pananalita kay Israel.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang 'ilang' ang maikli at tradisyonal ngunit nauunawaang katumbas para sa lupaing wilderness, na hindi kinakailangang puro buhangin.
- source_word: לְמִן הַיּוֹם אֲשֶׁר יָצָאתָ
  choice: Mula nang araw na lumabas ka
  rationale: Malinaw na itinatakda ang simula ng panahong tinutukoy at pinananatili ang pang-isahang anyo.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: hanggang sa dumating kayo sa lugar na ito
  rationale: Pinananatili ang paglipat ng Hebreo mula sa pang-isahang 'ka' tungo sa pangmaramihang 'kayo' sa likas na Tagalog.
- source_word: מַמְרִים הֱיִיתֶם
  choice: patuloy kayong naghimagsik
  rationale: Ipinahihiwatig ang tuloy-tuloy na asal sa buong panahong binanggit; ang 'naghimagsik' ay angkop sa pagsuway laban sa awtoridad.
- source_word: עִם יְהוָה
  choice: laban kay Yahweh
  rationale: Bagaman karaniwang 'kasama' ang עִם, adversative ang diwa nito kasunod ng pandiwang tumutukoy sa paghihimagsik.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang pinananatili ang tipanang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Tagal ng paghihimagsik ng Israel
  choice: patuloy kayong naghimagsik
  alternative: naghimagsik kayo
  rationale: Ipinapakita ng saklaw na mula sa paglabas sa Ehipto hanggang sa kasalukuyang lugar ang paulit-ulit at nagpapatuloy na asal, nang hindi nagdaragdag ng higit sa teksto.
- issue: Diwa ng עִם pagkatapos ng ממרים
  choice: laban kay Yahweh
  alternative: kasama ni Yahweh
  rationale: Sa konteksto ng paghihimagsik, adversative ang ugnayan; inilalahad sa talababa ang literal na anyo upang mapanatili ang tunay na leksikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang pang-isahang 'mo/ka' at saka ang pangmaramihang 'kayo' upang makita ang paglipat ng bilang sa Hebreo. Ang 'sa ilang' at 'naghimagsik' ay bahagyang mataas ang register ngunit karaniwan at angkop sa tekstong biblikal.
