base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: tl
  text: At kinuha ko ang inyong kasalanan—ang guya na ginawa ninyo—at sinunog ko iyon sa apoy. Pagkatapos, dinurog ko iyon at giniling nang husto hanggang sa maging kasingpino ng alabok. At itinapon ko ang alabok nito sa batis[a] na umaagos pababa mula sa bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapa.” Ang salitang Hebreo ay maaaring tumukoy sa batis, daluyan ng rumaragasang tubig, o tuyong libis na dinadaluyan ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: ang inyong kasalanan
  rationale: Pinananatili nito ang matindi at tuwirang pagtukoy ng Hebreo sa guya bilang sagisag at mismong kapahayagan ng kasalanan ng Israel, sa halip na palambutin bilang isang bagay lamang na makasalanan.
- source_word: הָעֵגֶל
  choice: ang guya
  rationale: Ito ang karaniwan at malinaw na katumbas sa konteksto ng ginintuang guya.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: sinunog ko iyon sa apoy
  rationale: Likas sa modernong Tagalog at pinananatili ang hayagang pagbanggit sa apoy sa Hebreong parirala.
- source_word: וָאֶכֹּת אֹתוֹ טָחוֹן הֵיטֵב
  choice: dinurog ko iyon at giniling nang pino
  rationale: Ipinahahayag ng “dinurog” ang paghampas o pagdurog, habang ang “giniling nang pino” ay nagpapanatili sa proseso at tindi ng lubos na paggiling.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: hanggang sa maging singpinong alabok
  rationale: Malinaw na ipinahahayag ang sukdulang pagkapino ng dinurog na guya at pinananatili ang kaugnayan nito sa alabok.
- source_word: עֲפָרוֹ
  choice: ang alabok nito
  rationale: Tumutukoy sa pinulbos na labi ng guya at inuugnay ang parirala sa naunang “alabok,” nang hindi nililimitahan ang kahulugan sa abo lamang.
- source_word: הַנַּחַל
  choice: ang batis
  rationale: Madaling maunawaan sa Tagalog at angkop sa umaagos na tubig sa konteksto, habang ang mas malawak na saklaw ng salitang Hebreo ay inilalahad sa talababa.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: na umaagos pababa mula sa bundok
  rationale: Natural na paglalarawan sa Tagalog ng agos ng batis at pinananatili ang patuloy na kilos ng participle sa Hebreo.
theological_decisions:
- issue: Tuwirang pagtukoy sa guya bilang “inyong kasalanan”
  choice: ang inyong kasalanan—ang guya na ginawa ninyo
  alternative: ang makasalanang bagay na ginawa ninyo, ang guya
  rationale: 'Ang apposition sa Hebreo ay sadyang matindi: tuwirang tinatawag na kasalanan ang guya. Pinananatili ng salin ang bigat na ito nang hindi ipinapakahulugan bilang handog para sa kasalanan.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ninyo/inyong” para sa maramihang kausap, at pinanatili ang sunod-sunod at mariing kilos ng tekstong Hebreo.
