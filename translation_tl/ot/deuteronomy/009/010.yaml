reference: Deuteronomy 9:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: tl
  text: At ibinigay sa akin ni Yahweh ang dalawang tapyas na bato, na isinulat sa pamamagitan ng daliri ng Diyos, at nakasulat sa mga iyon ang lahat ng salitang sinabi ni Yahweh sa inyo[a] sa bundok, mula sa gitna ng apoy, noong araw ng pagtitipon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kasama ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos na tuwirang nasa tekstong Hebreo.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: dalawang tapyas na bato
  rationale: Ang “tapyas na bato” ay likas at malinaw na Filipino para sa mga patag na batong sulatan, nang hindi nagdaragdag ng ideyang wala sa Hebreo.
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: na isinulat sa pamamagitan ng daliri ng Diyos
  rationale: Inilalahad ang instrumental na gamit ng בְּ at pinananatili ang malinaw at makapangyarihang larawang “daliri ng Diyos.”
- source_word: וַעֲלֵיהֶם כְּכָל הַדְּבָרִים
  choice: at nakasulat sa mga iyon ang lahat ng salita
  rationale: Natural na ipinahihiwatig ng sugnay na walang tahasang pandiwa na nasa mga tapyas ang buong nilalaman ng mga salitang tinutukoy.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: na sinabi ni Yahweh sa inyo
  rationale: Ang “sinabi … sa inyo” ang natural na Filipino sa kontekstong nagsalita si Yahweh sa Israel; ang mas literal na puwersa ng עִם ay itinatala sa talababa.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mula sa gitna ng apoy
  rationale: Pinananatili ang tiyak at maringal na larawan ng tinig na nagmumula sa loob ng apoy.
- source_word: בְּיוֹם הַקָּהָל
  choice: noong araw ng pagtitipon
  rationale: Ang “pagtitipon” ay malinaw na tumutukoy sa araw na nagkatipon ang sambayanan, at mas natural sa modernong Filipino kaysa “kapulungan” bilang pangalan ng araw.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagkilos ng Diyos
  choice: sa pamamagitan ng daliri ng Diyos
  alternative: sa pamamagitan ng kapangyarihan ng Diyos / ng Diyos mismo
  rationale: Tahasang gumagamit ang Hebreo ng larawang “daliri ng Diyos.” Hindi ito pinalalabnaw o ipinapaliwanag sa paraang nawawala ang konkretong teolohikal na larawan.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pinananatili ang tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Puwersa ng עִמָּכֶם sa pagsasalita ni Yahweh
  choice: sa inyo
  alternative: kasama ninyo
  rationale: Ang “sa inyo” ang natural na pagpapahayag sa Filipino para sa pagsasalita na nakatuon sa Israel. Gayunman, itinatala sa talababa ang literal na anyong “kasama ninyo” upang hindi maitago ang anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tapyas na bato” at “pagtitipon” bilang malinaw na karaniwang pananalita; pinanatili ang solemne at konkretong larawang “daliri ng Diyos” at “mula sa gitna ng apoy.”
