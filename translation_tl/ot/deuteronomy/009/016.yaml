  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: tl
  text: 'At tumingin ako, at nakita ko na nagkasala kayo kay Yahweh na inyong Diyos: gumawa kayo para sa inyong mga sarili ng isang guya na hinulma mula sa tinunaw na metal. Mabilis kayong lumihis sa daang iniutos ni Yahweh na sundin ninyo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: At tumingin ako, at nakita kong
  rationale: Pinananatili ng “tumingin ako” ang kilos ng pagmasid, habang ang “nakita kong” ay natural na naghahatid sa Filipino ng pansin at biglang pagkakatuklas na ipinahihiwatig ng וְהִנֵּה, nang hindi gumagamit ng lipas na “narito.”
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: nagkasala kayo kay Yahweh na inyong Diyos
  rationale: Ang ל pagkatapos ng חטא ay natural na naipapahayag bilang “kay” sa Filipino; ang naganap nang kilos ay malinaw sa salaysay kahit hindi tahasang markahan bilang pluperfect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: gumawa kayo para sa inyong sarili
  rationale: Ipinapakita ng “para sa inyong sarili” ang benepaktibong gamit ng לָכֶם at iniiwasang ipahiwatig na sila mismo ang bagay na ginawa.
- source_word: עֵגֶל מַסֵּכָה
  choice: isang guya na hinulma mula sa tinunaw na metal
  rationale: Malinaw na ipinapahayag nito kapwa ang anyong guya at ang paraang paghuhulma sa metal na saklaw ng מַסֵּכָה; mas nauunawaan ito sa modernong Filipino kaysa sa literal ngunit di-likas na “tinunaw na guya.”
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: Mabilis kayong lumihis sa daan
  rationale: Pinananatili ng “lumihis sa daan” ang talinghagang moral at tipan ng Hebreong סור at דרך, at tuwirang tinutumbasan ng “mabilis” ang מַהֵר.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: na iniutos sa inyo ni Yahweh
  rationale: Natural sa Filipino ang pag-unawa na ang “daan” ay ang paraang iniutos, kahit ang pandiwang “iniutos” ay mas karaniwang kumukuha ng bagay kaysa tao bilang layon.
theological_decisions:
- issue: Paglalarawan sa kasalanan laban kay Yahweh
  choice: nagkasala kayo kay Yahweh na inyong Diyos
  alternative: nagkasala kayo laban kay Yahweh na inyong Diyos
  rationale: Mas natural sa Filipino ang “nagkasala kay,” samantalang nananatiling malinaw ang personal at tipanang paglabag; hindi nito nilulutas o pinapahina ang bigat ng kasalanan.
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Iniwasan ang lipas na “masdan” o “narito,” ngunit pinanatili ang solemneng tono at ang talinghaga ng paglihis sa daan.
