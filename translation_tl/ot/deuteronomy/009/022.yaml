base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: tl
  text: At sa Tabera, sa Masa, at sa Kibrot-hataava[a], patuloy ninyong ginalit si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kibrot-hataava ay pangalan ng lugar; literal itong nangangahulugang “mga libingan ng pagnanasa” o “mga libingan ng paghahangad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/תַבְעֵרָה
  choice: At sa Tabera
  rationale: Ang וּבְ ay nagpapakilala ng isa pang lokasyon sa talaan; ginamit ang karaniwang Filipino na anyo ng pangalan ng lugar.
- source_word: וּ/בְ/מַסָּה
  choice: sa Masa
  rationale: Ipinahahayag ng בְ ang lokasyon, at pinanatili bilang transliterasyon ang pangalan ng lugar.
- source_word: וּ/בְ/קִבְרֹת הַתַּאֲוָה
  choice: at sa Kibrot-hataava[a]
  rationale: Itinuring itong nakapirming pangalan ng lugar at isinalin sa transliterasyon; inilagay sa talababa ang literal na kahulugan nito.
- source_word: מַקְצִפִים הֱיִיתֶם
  choice: patuloy ninyong ginalit
  rationale: Ang היה kasama ng Hiphil participle ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na kilos sa nakaraan. Pinananatili ng “ginalit” ang causative na diwa ng קצף.
- source_word: אֶת יְהוָה
  choice: si Yahweh
  rationale: Hindi isinasalin ang pantukoy sa tuwirang layon na אֶת; ang pangalang tipan na יהוה ay inililipat bilang Yahweh.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang nasa pinagmulang teksto nang hindi ito pinapalitan ng isang titulo.
- issue: Diwa ng pagpukaw sa galit ng Diyos
  choice: ginalit si Yahweh
  alternative: hinamon si Yahweh na magalit
  rationale: Ang Hiphil ng קצף ay causative, kaya malinaw na ipinahahayag na ang kilos ng bayan ay naging sanhi ng galit, nang hindi nagdaragdag ng paliwanag sa motibo o antas nito.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na ayos ng pangungusap. Ginamit ang “patuloy ninyong ginalit” upang maipahayag ang nagpapatuloy o paulit-ulit na kilos ng periphrastic Hebrew construction. Ang mga pangalan ng lugar ay tinagalog ang baybay ngunit hindi isinalin sa pangunahing teksto.
