language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: tl
  text: Baka sabihin ng lupain na pinagmulan namin, na mula roon ay inilabas mo kami[a], ‘Dahil hindi kaya ni Yahweh na dalhin sila sa lupaing ipinangako niya sa kanila[b], at dahil kinapopootan niya sila, inilabas niya sila upang patayin sila sa ilang.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang lupain na mula roon ay inilabas mo kami.” Ang “lupain” ay kumakatawan sa mga naninirahan dito.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “sa lupaing sinabi niya sa kanila [tungkol dito].”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Baka
  rationale: Ipinakikilala nito ang kinatatakutang maaaring sabihin ng iba bilang bunga ng paghatol; natural ito sa modernong Tagalog at pinananatili ang puwersa ng babala.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: ang lupaing pinanggalingan namin nang ilabas mo kami roon
  rationale: Pinananatiling paksa ang ‘lupain,’ gaya sa Hebreo, bagaman metonimiya ito para sa mga naninirahan doon. Inayos ang parirala upang maging malinaw at natural sa Tagalog.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: Dahil hindi kaya ni Yahweh
  rationale: Tuwirang ipinahahayag ng parirala ang ibibintang na kawalan ng kakayahan. Ang pahayag ay nasa bibig ng mga tagaibang lupain at hindi pagsang-ayon ng tagapagsalaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang tipan na nasa tekstong Hebreo.
- source_word: לַהֲבִיאָם
  choice: na dalhin sila
  rationale: Malinaw na tumutukoy sa pagdadala sa Israel patungo sa lupang kasunod na binanggit.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: sa lupaing ipinangako niya sa kanila
  rationale: Bagaman literal na ‘lupaing sinabi niya sa kanila,’ ipinahihiwatig ng konteksto ang ipinangakong lupain; inilalagay sa talababa ang mas literal na anyo upang mapanatili ang lexical na detalye.
- source_word: וּמִשִּׂנְאָתוֹ אֹתָם
  choice: at dahil kinapopootan niya sila
  rationale: Ipinapahayag ang ibinibintang na sanhi o motibo. Ang ‘kinapopootan’ ay marangal ngunit nauunawaan at may bigat na angkop sa pahayag.
- source_word: הוֹצִיאָם
  choice: inilabas niya sila
  rationale: Pinananatili ang pag-uulit ng pandiwang יצא at ang alusyon sa paglabas mula sa Ehipto.
- source_word: לַהֲמִתָם
  choice: upang patayin
  rationale: Tumpak na ipinapahayag ang causative na diwa ng Hiphil ng מות sa malinaw na Tagalog.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang ‘ilang’ ay maikli, dignified, at karaniwang salin sa Bibliya para sa ilang o disyertong lugar na dinaanan ng Israel.
theological_decisions:
- issue: Paglalapat ng kawalan ng kakayahan at pagkapoot kay Yahweh
  choice: Inilalahad ang mga ito bilang mismong paratang sa loob ng sipi
  alternative: Palambutin o ipaliwanag sa pangunahing teksto na hindi totoong kulang ang kapangyarihan ni Yahweh
  rationale: Ang Hebreo ay sadyang naglalahad ng kinatatakutang paninirang-puri ng mga bansa. Hindi dapat alisin ang teolohikal na tensiyon sa pamamagitan ng pagpapaliwanag sa mismong salin.
- issue: Pagsasalin sa דִּבֶּר לָהֶם
  choice: ipinangako niya sa kanila
  alternative: sinabi niya sa kanila tungkol dito
  rationale: Sa konteksto ng tipan, ang pagsasalita tungkol sa lupain ay may puwersa ng pangako. Gayunman, inilalahad sa talababa ang mas literal na pagbasa.
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan na tahasang nasa pinagmulang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignified. Pinanatili ang ‘lupain’ bilang nagsasalita upang huwag burahin ang metonimiya ng Hebreo, ngunit inayos ang sugnay para maging natural. Ang mga panandang [a] at [b] ay inilagay sa mismong pariralang tinutukoy ng bawat talababa.
