    issue: Hindi malinaw ang direksiyong “mula sa” sa unang sugnay.
    rationale: Ang מִשָּׁם ay tumutukoy sa lugar na pinagmulan ng paglabas. Ang kasalukuyang “nang ilabas mo kami roon” ay mas madaling unawain bilang paglalabas sa lugar na iyon kaysa paglalabas mula roon.
  - severity: medium
    issue: Naiwan ang tahasang layon ng “patayin.”
    rationale: Ang לַהֲמִתָם ay “upang patayin sila.” Bagaman mahihinuha ang layon mula sa konteksto, dapat itong ihayag upang mapanatili ang suffix ng Hebreo.
