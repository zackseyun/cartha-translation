base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: tl
  text: Kaya nagpatirapa ako sa harap ni Yahweh sa loob ng apatnapung araw at apatnapung gabi—sa buong panahong iyon ay nagpatirapa ako—sapagkat sinabi ni Yahweh na lilipulin niya kayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Kaya nagpatirapa ako
  rationale: Ang hitpael ng נפל ay tumutukoy rito sa kusang pagpapatirapa ni Moises sa pamamagitan. Ang “Kaya” ay naghahayag ng ugnayang bunga sa naunang salaysay.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas na ipinapahayag ng “sa harap” ang kahulugang espasyal at relasyonal ng לִפְנֵי, at pinananatili ang pangalang tipan na Yahweh.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה אֲשֶׁר הִתְנַפָּלְתִּי
  choice: sa loob ng apatnapung araw at apatnapung gabi
  rationale: Ang accusative ay nagsasaad ng tagal. Sa Tagalog, ang “sa loob ng” ay natural; ang kasunod na sugnay ay inuulit lamang ang pagpapatirapa sa panahong iyon at maaaring isama nang hindi lumilikha ng mabigat na pag-uulit.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagpapatirapa ni Moises.
- source_word: אָמַר יְהוָה
  choice: sinabi ni Yahweh
  rationale: Ang payak na aspektong Tagalog ay natural na nagpapahiwatig na nauna ang pahayag ni Yahweh ayon sa konteksto, nang hindi kailangang dagdagan ng tahasang katumbas ng pluperfect.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: na lilipulin niya kayo
  rationale: Ipinahahayag ng pawatas na may ל ang nilalayong pagkilos pagkatapos ng “sinabi.” Ang “lilipulin” ay malinaw at matindi ngunit hindi kinakailangang ipakahulugang lubos na pag-ubos ng lahi.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kilos ni Moises bilang pamamagitan
  choice: nagpatirapa
  alternative: nagpatumba; yumukod
  rationale: Ipinakikita ng anyong pandiwa ang kusang paglapag o pagpapatirapa sa harap ng Diyos, ngunit hindi idinaragdag sa pangunahing teksto ang salitang “namagitan,” na pahiwatig lamang ng konteksto.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “nagpatirapa” upang maging tumpak ngunit madaling maunawaan, at iniwasan ang mabigat na literal na pag-uulit ng pariralang tumutukoy sa apatnapung araw at gabi.
