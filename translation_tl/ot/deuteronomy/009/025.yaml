  source_fidelity: Naisasalin nang tumpak ang pagpapatirapa ni Moises, ang tagal na apatnapung araw at gabi, ang dahilan, at ang banta ni Yahweh. Gayunman, hindi naipapakita ng pangunahing teksto ang tahasang pag-uulit sa Hebreo ng panahong pinatirapan niya ang sarili; mahalaga ang pag-uulit na ito bilang diin.
  naturalness: Marangal at likas ang pangunahing pananalita. Ang idinagdag na maikling sugnay na “sa buong panahong iyon ay nagpatirapa ako” ay pinananatili ang diin ng Hebreo nang hindi nagiging mabigat o mekanikal ang pag-uulit.
  terminology: Ang “Yahweh,” “nagpatirapa,” at “lilipulin” ay angkop sa modernong Filipino Tagalog at sa tindi ng mga terminong Hebreo. Ang talababa ay nagbibigay ng lehitimong alternatibong paglalarawan ng kilos.
