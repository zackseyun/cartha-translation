- from: isang malaki at matangkad na bayan—ang mga anak ni Anak[a]—na kilala mo at tungkol sa kanila ay narinig mong sinabi, “Sino ang makatatayo sa harap ng mga anak ni Anak?”
  to: isang malaking bayan na matatangkad—ang mga anak ni Anak[a]—na kilala mo at narinig mong sinasabi, “Sino ang makatatayo sa harap ng mga anak ni Anak?”
  rationale: Inayos ang paglalarawan upang ang pisikal na taas ay malinaw na tumukoy sa mga taong bumubuo sa bayan, at pinasimple ang pagpapakilala sa narinig na retorikal na tanong. Pinanatili ang lahat ng pangunahing leksikal at retorikal na elemento ng Hebreo at ang umiiral na talababa.
