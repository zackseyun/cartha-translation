base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: tl
  text: isang malaking bayan na matatangkad—ang mga anak ni Anak[a]—na kilala mo at narinig mong sinasabi, “Sino ang makatatayo sa harap ng mga anak ni Anak?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Anakim.” Literal sa Hebreo, “mga anak ni Anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: bayan
  rationale: Ang עַם ay tumutukoy rito sa isang pangkat ng mga tao. Likas sa makabagong Tagalog ang “bayan” para sa isang kinikilalang pangkat, hindi lamang sa isang lugar.
- source_word: גָּדוֹל
  choice: malaki
  rationale: Sa paglalarawan sa nakakatakot na laki at tindig ng pangkat, tuwirang ipinapahayag ng “malaki” ang sukat at dami nang hindi nagdaragdag ng di-tiyak na diwang karangalan.
- source_word: וָרָם
  choice: matangkad
  rationale: Ang רָם ay literal na “mataas,” ngunit sa konteksto ng pisikal na anyo ng mga anak ni Anak, “matangkad” ang malinaw at natural na katumbas.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: mga anak ni Anak
  rationale: Pinananatili nito ang literal na pananalitang pampamilya sa Hebreo at ang pangalang Anak, sa halip na gawing pangalang-etniko lamang.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: na kilala mo
  rationale: Tuwiran at natural itong katumbas ng perpektong pandiwa sa Hebreo at nagpapahiwatig na pamilyar na sa Israel ang pangkat na ito.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: at tungkol sa kanila ay narinig mong sinabi
  rationale: Ginagawang malinaw sa Tagalog na ang kasunod na tanong ay isang kasabihang narinig nila, habang pinananatili ang ugnayan ng dalawang sugnay.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: Sino ang makatatayo sa harap ng
  rationale: Pinananatili ang larawan ng pagtayo sa harap ng isang kalaban at ang retorikal na diwa ng kakayahang humarap o lumaban.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “makatatayo” bilang pormal ngunit karaniwang anyo, at pinanatili ang retorikal na tanong at ang literal na katawagang “mga anak ni Anak.”
