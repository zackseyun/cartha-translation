base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: tl
  text: Maging sa Horeb,[a] ginalit ninyo si Yahweh, at nagalit si Yahweh sa inyo upang lipulin kayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At sa Horeb” o “Sa Horeb.” Maaaring ipinagpapatuloy lamang ng pangatnig sa Hebreo ang salaysay, bagaman malamang na nagbibigay ito ng diin dito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at nagalit nang labis si Yahweh sa inyo, hanggang sa punto ng paglipol niya sa inyo.” Tuwirang iniuugnay ng Hebreo ang galit ni Yahweh sa bantang paglipol sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: Maging sa Horeb
  rationale: Sa konteksto, ang pangatnig na וּ ay maaaring simpleng magpatuloy sa salaysay, ngunit malamang na may diin dito; likas na naipapahayag iyon ng “Maging sa Horeb.”
- source_word: הִקְצַפְתֶּם
  choice: ginalit ninyo
  rationale: 'Ang Hiphil ng קצף ay causative: naging sanhi ang Israel ng galit ni Yahweh. Ang “ginalit ninyo” ay tuwiran, natural, at malinaw sa modernong Tagalog.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang tipanang pangalan ng Diyos na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וַיִּתְאַנַּף יְהוָה בָּכֶם
  choice: matindi ang galit ni Yahweh sa inyo
  rationale: Ang אנף ay tumutukoy sa matinding galit, at ang בָּכֶם ay likas na isinasalin bilang “sa inyo” sa pariralang ito.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: hanggang sa punto na lilipulin niya kayo
  rationale: Pinananatili nito ang tuwirang ugnayan ng galit ni Yahweh at ng bantang pagpuksa, habang hindi sapilitang nilulutas kung ang infinitive ay layunin o bunga.
theological_decisions:
- issue: Paglalapat ng galit ni Yahweh sa bantang paglipol
  choice: hanggang sa punto na lilipulin niya kayo
  alternative: upang lipulin kayo
  rationale: Maaaring ipahayag ng לְ infinitive ang layunin o ang kinalabasan/saklaw ng galit. Pinananatili ng napiling salin ang mahigpit na ugnayan nang hindi labis na nilulutas ang gramatikal na tensiyon.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “ginalit” sa halip na mas matalinghagang “pinukaw sa poot,” at “lilipulin” upang mapanatili ang bigat ng שׁמד nang hindi nagiging kolokyal.
