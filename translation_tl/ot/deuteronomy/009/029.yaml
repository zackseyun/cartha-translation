  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: tl
  text: Ngunit sila ang iyong bayan at ang iyong mana,[a] na inilabas mo sa pamamagitan ng iyong dakilang kapangyarihan at ng iyong nakaunat na bisig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At sila ang iyong bayan at ang iyong mana.” Maaari ring isalin ang pang-ugnay na Hebreo bilang simpleng “at”; ipinakikita ng “ngunit” ang malamang na pagsalungat sa pakiusap ni Moises.
    reason: lexical_alternative
  - marker: b
    text: Ang “nakaunat na bisig” ay karaniwang pananalita sa salaysay ng Exodo para sa makapangyarihang pagliligtas ng PANGINOON.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: Ngunit sila ang
  rationale: Maaaring simpleng mangahulugang “at” ang ו, ngunit sa konteksto ay ipinapakita nito ang pagsalungat sa posibilidad na lipulin ang Israel. Likas sa makabagong Tagalog ang “ngunit” para sa pakiusap ni Moises, habang pinananatili sa talababa ang payak na alternatibo.
- source_word: עַמְּךָ
  choice: iyong bayan
  rationale: Ang עַם ay tumutukoy sa isang sambayanan, lalo na rito sa bayang may kaugnayan sa Diyos. Mas natural at marangal sa kontekstong biblikal ang “iyong bayan” kaysa “iyong mga tao.”
- source_word: וְנַחֲלָתֶךָ
  choice: at ang iyong mana
  rationale: Pinananatili ng “mana” ang diwa ng נַחֲלָה bilang minana o itinakdang pag-aari at ang mahalagang wikang tipan ng talata.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: na inilabas mo
  rationale: 'Ang Hiphil ng יצא ay karaniwang pahayag tungkol sa Exodo: pinangyari ng Diyos na makalabas ang bayan. Ang “inilabas mo” ay tuwiran at natural.'
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: sa pamamagitan ng iyong dakilang kapangyarihan
  rationale: Malinaw na ipinahahayag nito ang instrumental na בְּ at malapit na tinutumbasan ang כֹחַ הַגָּדֹל nang hindi pinahihina ang diin.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: at ng iyong nakaunat na bisig
  rationale: Pinananatili ang kongkretong larawang Hebreo ng bisig bilang sagisag ng makapangyarihang pagliligtas ng Diyos. Ang “nakaunat na bisig” ay natural at matapat sa participle נְטוּיָה.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagkilos ng Diyos
  choice: Panatilihin ang “iyong nakaunat na bisig.”
  alternative: Isalin nang dinamiko bilang “iyong makapangyarihang mga gawa.”
  rationale: Sinasadya ng Hebreo ang larawan ng bisig, na mahalagang pananalita tungkol sa pagliligtas sa Exodo. Hindi ito dapat gawing abstraktong pahayag lamang.
- issue: Wika ng kaugnayan at pag-aari sa נַחֲלָה
  choice: Isalin bilang “mana.”
  alternative: “pamana” o “pag-aari”
  rationale: Ang “mana” ay pinakamalapit sa pangunahing diwa at pinananatili ang tensiyon ng pahayag na ang Israel ay mana ng Diyos, nang hindi ito ipinapaliwanag nang higit sa teksto.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong עַם, “mana” upang mapanatili ang wikang tipan, at “nakaunat na bisig” upang hindi mawala ang mahalagang talinghagang Hebreo. Inayos ang mga marker ayon sa puntong tinutukoy ng bawat talababa.
