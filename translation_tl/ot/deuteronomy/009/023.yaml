id: DEU.9.23
reference: Deuteronomy 9:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: tl
  text: Nang suguin kayo ni Yahweh mula sa Kades-barnea, sinabi niya, “Umahon kayo at angkinin ninyo ang lupaing ibinigay ko sa inyo.” Ngunit naghimagsik kayo laban sa utos[a] ni Yahweh na inyong Diyos. Hindi kayo nagtiwala sa kanya[b] at hindi ninyo pinakinggan ang kanyang tinig.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bibig ni Yahweh na inyong Diyos,” isang idyoma para sa kanyang utos o salita.
    reason: lexical_alternative
  - marker: b
    text: O “Hindi kayo naniwala sa kanya.”
    reason: lexical_alternative
  - marker: c
    text: Ang “pinakinggan ang kanyang tinig” ay maaari ring mangahulugang “sinunod siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: Nang suguin
  rationale: Ang infinitive construct na may בְּ ay nagpapakilala ng pangyayaring panahunan; natural itong ipahayag sa Tagalog bilang “Nang suguin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: mula sa Kades-barnea
  rationale: Isinalin sa baybay na madaling basahin sa Tagalog ang tambalang pangalan ng lugar.
- source_word: לֵאמֹר
  choice: sinabi niya
  rationale: Ang karaniwang Hebreong panandang pambanggit ay ginawang natural na pambungad sa tuwirang pananalita sa Tagalog.
- source_word: עֲלוּ
  choice: Umahon kayo
  rationale: Pinananatili ang ideya ng pag-akyat patungo sa lupain nang hindi gumagamit ng labis na teknikal na pananalita.
- source_word: וּרְשׁוּ
  choice: angkinin ninyo
  rationale: Ipinahahayag nito ang pagkuha at paghawak sa lupa bilang pag-aari; mas natural ito kaysa sa literal ngunit matigas na “ariin,” at hindi nito nililimitahan ang diwa sa militar na pananakop lamang.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Pinananatili ang karaniwang tipanang pagtukoy sa lupa nang walang idinagdag na paliwanag.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: na ibinigay ko sa inyo
  rationale: Ang Hebreong perfect ay inilalahad bilang isang tiyak at natapos na pagkakaloob.
- source_word: וַתַּמְרוּ
  choice: Ngunit sinuway ninyo
  rationale: Ang pandiwa ay tumutukoy sa mapaghimagsik na pagsalungat sa awtoridad; ipinakikita ng “sinuway” ang kilos sa malinaw at natural na Tagalog.
- source_word: אֶת־פִּי יְהוָה אֱלֹהֵיכֶם
  choice: ang utos ni Yahweh na inyong Diyos
  rationale: Ang literal na “bibig ni Yahweh” ay isang Hebreong idyoma para sa kanyang makapangyarihang sinabi o utos; “utos” ang pinakamalinaw na katumbas sa konteksto.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: Hindi kayo nagtiwala sa kanya
  rationale: Ang Hiphil ng אמן ay maaaring mangahulugang maniwala o magtiwala. Sa konteksto ng pagtanggi sa pangako at utos ng Diyos, natural ang “nagtiwala,” habang itinatala sa talababa ang ibang lehitimong pagbasa.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: at hindi ninyo pinakinggan ang kanyang tinig
  rationale: Pinananatili ang pandinig na larawan ng Hebreong idyoma habang nananatiling malinaw ang pahiwatig ng pagsunod.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang transliterasyong “Yahweh” ay nagpapanatili rito nang hindi ito pinapalitan ng titulo.
- issue: Diwa ng נָתַתִּי sa pagkakaloob ng lupain
  choice: ibinigay ko sa inyo
  alternative: ibinibigay ko sa inyo
  rationale: Pinananatili ng pangnagdaang anyo ang Hebreong perfect at ang pagkakalahad sa kaloob bilang tiyak na naipagkaloob na, nang hindi nagdaragdag ng sistematikong paliwanag.
- issue: Ugnayan ng paniniwala at pagtitiwala sa וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: Hindi kayo nagtiwala sa kanya
  alternative: Hindi kayo naniwala sa kanya
  rationale: Parehong saklaw ng pandiwa ang paniniwala at pagtitiwala. Pinili ang mas natural sa konteksto, ngunit pinanatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “Umahon” at “angkinin” upang mapanatili ang galaw at diwa ng pagkuha sa lupain nang hindi maging kahoy o labis na militar ang pananalita. Ang maiikling pangungusap pagkatapos ng sipi ay nagpapalinaw sa magkakaugnay na paratang habang pinananatili ang Hebreong pag-uulit.
