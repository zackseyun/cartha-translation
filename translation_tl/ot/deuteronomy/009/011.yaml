  text: וַ/יְהִ֗י מִ/קֵּץ֙ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה נָתַ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵ֛י לֻחֹ֥ת הָ/אֲבָנִ֖ים לֻח֥וֹת הַ/בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: tl
  text: At nang matapos ang apatnapung araw at apatnapung gabi, ibinigay sa akin ni Yahweh ang dalawang tapyas na bato, ang mga tapyas ng tipan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: At
  rationale: Nagsisilbi itong panandang pasalaysay na natural na naisasama sa kasunod na pariralang temporal sa Tagalog.
- source_word: מִקֵּץ
  choice: nang matapos ang
  rationale: Ipinahahayag nito ang punto ng pagkalubos ng takdang panahon; mas natural sa modernong Tagalog kaysa sa literal na 'sa katapusan ng'.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: apatnapung araw at apatnapung gabi
  rationale: Tuwirang pinananatili ang karaniwang Hebreong pahayag at ang pag-uulit ng bilang.
- source_word: נָתַן
  choice: ibinigay
  rationale: Karaniwang katumbas na hindi nagdaragdag ng diwang gaya ng paghahatid o pag-aabot.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- source_word: אֵלַי
  choice: sa akin
  rationale: Natural na Tagalog para sa tumatanggap sa pandiwang 'ibinigay'.
- source_word: שְׁנֵי
  choice: dalawang
  rationale: Malinaw na ipinahahayag ang tiyak na pares sa konteksto nang hindi nangangailangan ng hiwalay na pantukoy sa Tagalog.
- source_word: לֻחֹת הָאֲבָנִים
  choice: tapyas na bato
  rationale: Ang 'tapyas' ay malinaw at dignified na tawag sa patag na pirasong sulatan; ang 'na bato' ay nagpapahayag ng materyal.
- source_word: לֻחֹת הַבְּרִית
  choice: ang mga tapyas ng tipan
  rationale: Pinananatili ang appositional na pag-uulit ng לֻחֹת at ang mahalagang ugnayan ng mga tapyas sa tipan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton; ang 'Yahweh' ay nagpapanatili rito bilang personal na pangalan sa halip na gawing titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'tapyas' sa halip na mas teknikal o kolokyal na mga salita, at pinanatili ang pag-uulit na 'ang mga tapyas ng tipan' upang masalamin ang estruktura at diin ng Hebreo. Hindi isinama ang footnote ng English consultation layer sapagkat ang mungkahing alternatibong 'Yahweh gave me' ay hindi isang tunay na alternatibong pagbasa sa Hebreo kundi bahagi na ng pangunahing sugnay.
