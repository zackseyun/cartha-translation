translation_notes:
  register: Makabago at marangal na Filipino, na may likas na daloy ng salaysay. Ginamit ang “tapyas” bilang malinaw na katawagan sa mga tabletang kinasusulatan, at iniwasang idagdag ang “bato” sapagkat hindi ito tahasang nasa talatang ito.
