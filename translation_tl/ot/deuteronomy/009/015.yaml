  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: tl
  text: Bumaling ako at bumaba mula sa bundok, at nagliliyab sa apoy ang bundok,[a] at hawak ko sa dalawa kong kamay[b] ang dalawang tapyas ng tipan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “habang nagliliyab sa apoy ang bundok.” Maaaring ipahiwatig ng sugnay na ito ang pangyayaring kasabay ng pagbaba ni Moises.'
    reason: alternative_reading
  - marker: b
    text: 'Sa literal: “sa ibabaw ng aking dalawang kamay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Kaya bumaling ako
  rationale: Ang wayyiqtol ng פנה ay nagsasaad ng kasunod na kilos na “bumaling.” Ipinahihiwatig ng “Kaya” ang daloy ng salaysay nang hindi mekanikal na inuulit ang “at.”
- source_word: וָאֵרֵד מִן הָהָר
  choice: at bumaba mula sa bundok
  rationale: Ang ירד ay “bumaba,” at malinaw sa konteksto na ang הָהָר ay ang tiyak na bundok na pinanggalingan ni Moises.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: habang nagliliyab sa apoy ang bundok
  rationale: Likas sa Tagalog ang “habang” para sa pangyayaring kasabay ng pagbaba, ngunit maaaring payak na pag-uugnay lamang ang Hebreong וְ; kaya inilalahad sa talababa ang alternatibo. Pinananatili ng “nagliliyab sa apoy” ang mariing pagbanggit ng בָּאֵשׁ.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: ang dalawang tapyas ng tipan
  rationale: Sa kontekstong ito, ang לֻחֹת ay mga tapyas na kinasusulatan, at ang הַבְּרִית ay ang tipan. Ang “dalawang tapyas ng tipan” ay malinaw, maigsi, at karaniwang biblikal na pananalita.
- source_word: עַל שְׁתֵּי יָדָי
  choice: hawak ko sa dalawa kong kamay
  rationale: Literal na “sa ibabaw ng aking dalawang kamay” ang parirala, ngunit ang ipinahihiwatig ay dala o hawak ni Moises ang mga tapyas. Ang salin ay natural sa Tagalog at pinananatili ang tahasang bilang na dalawa.
