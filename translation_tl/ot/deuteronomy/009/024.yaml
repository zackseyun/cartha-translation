  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: tl
  text: Kayo’y mapaghimagsik laban kay Yahweh mula pa nang makilala ko kayo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kasama ni Yahweh”; sa kontekstong ito, ang parirala ay nangangahulugang pagsalungat sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: mapaghimagsik
  rationale: Ipinahahayag ng salitang mula sa ugat na מרה ang patuloy na paghihimagsik o paglaban sa awtoridad. Ang “mapaghimagsik” ay likas at marangal na Filipino at akma bilang panaguri kasama ng הֱיִיתֶם.
- source_word: הֱיִיתֶם
  choice: naging … na kayo
  rationale: Ang Qal perfect na ikalawang panauhang maramihan ay lumilingon sa naging asal ng Israel mula nang makilala sila ni Moises. Kasama ng “mula pa nang,” ipinahihiwatig nito ang asal na nagsimula noon at nagpatuloy.
- source_word: עִם
  choice: laban kay
  rationale: 'Bagaman karaniwang nangangahulugang “kasama,” adversatibo ang diwa nito kapag kaugnay ng מרה: pagsalungat o paghihimagsik laban sa isang tao. Nililinaw sa talababa ang literal na anyo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מִיּוֹם דַּעְתִּי אֶתְכֶם
  choice: mula pa nang makilala ko kayo
  rationale: Natural na Filipino ito para sa panandang panahong nagsasaad ng simula. Ang ידע rito ay tumutukoy sa pagkakilala ni Moises sa Israel mula sa simula ng pakikitungo niya sa kanila.
theological_decisions:
- issue: Paglalarawan sa ugnayan ng Israel kay Yahweh sa pariralang עִם יְהוָה
  choice: laban kay Yahweh
  alternative: kasama ni Yahweh
  rationale: Ang literal na “kasama” ay maaaring magbigay ng maling positibong diwa sa Filipino. Sa konteksto ng paghihimagsik, malinaw na pagsalungat kay Yahweh ang tinutukoy, habang pinananatili sa talababa ang pormal na anyong Hebreo.
- issue: Paglilipat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang transliterasyong “Yahweh” ang tuwirang nagpapanatili rito nang hindi ito ginagawang titulo.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Inuna ang pariralang temporal upang maging natural ang daloy, habang pinananatili ang saklaw at diin ng paratang sa Hebreo.
