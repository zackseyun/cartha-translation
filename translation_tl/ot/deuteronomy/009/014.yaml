  source_fidelity: Malapit sa Hebreo ang pangunahing salin at naipapahayag nito ang tuwirang utos na magbigay-daan, ang paglipol, pagbura ng pangalan, at ang pangakong gawing higit na makapangyarihan at marami si Moises. Gayunman, ang “Hayaan mo ako” ay maaaring tunog pahintulot lamang sa modernong Tagalog; ang “Huwag mo akong pigilan” ay mas malinaw na naghahatid ng idiomang הֶרֶף מִמֶּנִּי sa konteksto. Gayundin, ang “mula sa silong ng langit” ay hindi ang pinakanatural na Tagalog para sa idiomang ‘from under the heavens’; mas malinaw ang “sa ilalim ng langit,” na may talababa para sa idiomatikong kahulugan.
  naturalness: Ang daloy at rehistro ay marangal at madaling maunawaan. Mas likas at tiyak sa modernong Filipino ang “Huwag mo akong pigilan” kaysa “Hayaan mo ako,” at “mula sa ilalim ng langit” kaysa “mula sa silong ng langit.”
  terminology: Ang “lipulin,” “pawiin ang kanilang pangalan,” “bansa,” “mas makapangyarihan,” at “mas marami” ay angkop. Pinananatili ng “pawiin ang kanilang pangalan” ang Hebreong idyoma nang hindi inuunahan ang paliwanag sa pangunahing teksto.
