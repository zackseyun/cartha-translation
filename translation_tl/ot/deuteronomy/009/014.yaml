  text: הֶ֤רֶף מִמֶּ֨/נִּי֙ וְ/אַשְׁמִידֵ֔/ם וְ/אֶמְחֶ֣ה אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וְ/אֶֽעֱשֶׂה֙ אֽוֹתְ/ךָ֔ לְ/גוֹי עָצ֥וּם וָ/רָ֖ב מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: tl
  text: Huwag mo akong pigilan[a], upang lipulin ko sila at pawiin ang kanilang pangalan mula sa ilalim ng langit[b]; at gagawin kitang isang bansang mas makapangyarihan at mas marami kaysa sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Hayaan mo ako, upang lipulin ko sila at pawiin ang kanilang pangalan mula sa ilalim ng langit.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa ilalim ng mga langit”; ang parirala ay tumutukoy sa pag-aalis sa kanila mula sa daigdig, pati sa alaala ng mga tao.
    reason: cultural_note
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: Hayaan mo ako
  rationale: Ang pautos na רפה na may מן at panghalip ay idyomang nangangahulugang tumigil sa pagpigil o mamagitan. Natural sa modernong Tagalog ang “Hayaan mo ako” at hindi ito nagdaragdag ng diwa.
- source_word: וְאַשְׁמִידֵם
  choice: upang lipulin ko sila
  rationale: Ang שׁמד ay tumutukoy sa lubusang pagwasak o paglipol. Ipinahahayag ng “upang” ang layunin o resultang ugnayan ng waw kasunod ng pautos, habang pinananatili ang tindi ng pahayag.
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: at pawiin ang kanilang pangalan
  rationale: Sa idyomang ito, ang מחה ay pag-aalis ng pangalan, alaala, at patuloy na pag-iral. Ang “pawiin ang kanilang pangalan” ay malinaw, marangal, at likas sa Tagalog.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: mula sa silong ng langit
  rationale: Pinananatili ng “mula sa silong ng langit” ang larawan ng Hebreo at malinaw na tumutukoy sa pag-aalis mula sa daigdig. Bagaman maramihan ang שׁמים sa anyong Hebreo, karaniwang isahan ang “langit” sa idyomang Tagalog.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: at gagawin kitang isang bansa
  rationale: Tumpak na ipinahahayag ng “gagawin kitang isang bansa” ang pagbabagong isinasaad ng עשה + layon + ל, at natural ang pagkakabuo nito sa Tagalog.
- source_word: עָצוּם
  choice: mas makapangyarihan
  rationale: Sa paghahambing na may מִמֶּנּוּ, ang עָצוּם ay tumutukoy sa higit na lakas o kapangyarihan; malinaw itong naihahatid ng “mas makapangyarihan.”
- source_word: וָרָב
  choice: mas marami
  rationale: Sa konteksto ng isang bansa o bayan, tumutukoy ang רַב sa dami ng mga tao. Ang “mas marami” ang pinakanatural na paghahambing sa Tagalog.
- source_word: מִמֶּנּוּ
  choice: kaysa sa kanila
  rationale: Isahan ang hulapi sa Hebreo dahil kolektibong tinutukoy ang Israel bilang bayan o bansa. Natural sa Tagalog na gamitin ang maramihang “kanila” para sa mga taong bumubuo rito.
theological_decisions:
- issue: Ang pahayag ng Diyos tungkol sa paghatol at sa paggawa kay Moises na isang higit na makapangyarihan at maraming bansa
  choice: Isinalin bilang tuwirang pahayag ng paghatol at pangako sa loob ng salaysay.
  alternative: Ipahiwatig sa salin na retorikal lamang ito o isang pagsubok kay Moises.
  rationale: Tuwirang pananalita ng Diyos ang nasa Hebreo. Dapat panatilihin ng salin ang tensiyong teolohikal at huwag ipasok sa pangunahing teksto ang isang paliwanag na hindi tahasang sinasabi rito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “lipulin” at “pawiin” upang mapanatili ang bigat ng hatol nang hindi nagiging labis na teknikal o makaluma. Ginamit ang karaniwang idyomang Tagalog na “silong ng langit,” habang ipinaliwanag sa talababa ang maramihang anyo ng Hebreo.
