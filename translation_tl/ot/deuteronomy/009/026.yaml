  text: וָ/אֶתְפַּלֵּ֣ל אֶל יְהוָה֮ וָ/אֹמַר֒ אֲדֹנָ֣/י יְהוִ֗ה אַל תַּשְׁחֵ֤ת עַמְּ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ אֲשֶׁ֥ר פָּדִ֖יתָ בְּ/גָדְלֶ֑/ךָ אֲשֶׁר הוֹצֵ֥אתָ מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: tl
  text: At nanalangin ako kay Yahweh at sinabi ko, “Panginoong Yahweh, huwag mong lipulin ang iyong bayan at ang iyong mana, na tinubos mo sa pamamagitan ng iyong kadakilaan, na inilabas mo mula sa Ehipto sa pamamagitan ng malakas na kamay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל יְהוָה וָאֹמַר
  choice: Kaya nanalangin ako kay Yahweh at sinabi ko
  rationale: Ang magkakasunod na wayyiqtol ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Kaya” bilang ugnay sa naunang konteksto, habang malinaw na pinananatili ang dalawang kilos.
- source_word: אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  rationale: 'Pinananatili nito ang dalawang sangkap ng tambalang titulo: אֲדֹנָי bilang “Panginoon” at ang pangalang tipan na יְהוָה bilang “Yahweh,” nang walang artipisyal na pag-uulit.'
- source_word: אַל תַּשְׁחֵת
  choice: huwag mong lipulin
  rationale: Ang “lipulin” ay natural at maringal na katumbas ng pagbabawal na may שׁחת sa konteksto ng bantang ganap na pagkawasak sa bayan.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: ang iyong bayan at ang iyong mana
  rationale: Ang “bayan” ay tuwirang katumbas ng עַם. Ang “mana” ay nagpapanatili sa larawang tipan ng נַחֲלָה, kung saan ang Israel ang bahaging pag-aari ni Yahweh.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: na tinubos mo
  rationale: Karaniwan at angkop sa konteksto ng Exodo ang “tinubos” para sa פדה, nang hindi nililimitahan ang larawan sa isang komersiyal na pantubos.
- source_word: בְּגָדְלֶךָ
  choice: sa pamamagitan ng iyong kadakilaan
  rationale: Tuwirang pinananatili ang pangngalang גֹּדֶל na “kadakilaan” at ang instrumental na gamit ng ב, sa halip na ipakahulugang “dakilang kapangyarihan.”
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם
  choice: na inilabas mo sa Ehipto
  rationale: Ang “inilabas” ay tuwirang tumutugma sa hulma ng pahayag tungkol sa Exodo; natural sa Tagalog na gamitin ang “sa Ehipto” bilang pinanggalingan pagkatapos ng pandiwang ito.
- source_word: בְּיָד חֲזָקָה
  choice: sa pamamagitan ng makapangyarihang kamay
  rationale: Ang idyomang “makapangyarihang kamay” ay natural at madaling maunawaan sa Tagalog, habang pinananatili ang kongkretong larawan ng יָד at ang lakas na ipinahihiwatig ng חֲזָקָה.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang transliterasyong “Yahweh” ay hayagang nagpapanatili sa personal na pangalang tipan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Paglilipat sa tambalang titulong אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS
  rationale: Ang “Panginoong Yahweh” ay kapuwa nagpapanatili sa titulong אֲדֹנָי at sa personal na pangalang יְהוָה. Hindi nito ikinukubli ang pagkakaiba ng dalawang elementong nasa Hebreo.
- issue: Kahulugan ng נַחֲלָה tungkol sa Israel
  choice: mana
  alternative: pag-aari
  rationale: Pinananatili ng “mana” ang teolohikal at tipanang larawan nang hindi ito ipinapaliwanag nang lampas sa sinabi ng teksto; ang “pag-aari” ay posible ngunit mas pinapawi ang metapora.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Panginoong Yahweh” upang maging natural ang tambalang titulo. Walang talababa dahil ang mahahalagang pagkakaiba ay mailalahad nang malinaw sa mismong salin at walang kailangang markahang tekstuwal o leksikal na kalabuan.
