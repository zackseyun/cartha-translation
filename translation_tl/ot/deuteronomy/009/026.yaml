  to: At nanalangin ako kay Yahweh at sinabi ko, “Panginoong Yahweh, huwag mong lipulin ang iyong bayan at ang iyong mana, na tinubos mo sa pamamagitan ng iyong kadakilaan, na inilabas mo mula sa Ehipto sa pamamagitan ng malakas na kamay.”
