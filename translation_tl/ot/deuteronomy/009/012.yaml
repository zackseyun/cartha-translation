language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: tl
  text: At sinabi sa akin ni Yahweh, “Tumayo ka at bumaba ka agad mula rito, sapagkat nagpakasama ang iyong bayan na inilabas mo mula sa Ehipto. Mabilis silang lumihis sa daang iniutos ko sa kanila; gumawa sila para sa kanilang sarili ng imaheng hinulma sa metal.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “imaheng binubo.” Ang salitang Hebreo ay tumutukoy sa imaheng ginawa sa pamamagitan ng pagbuhos ng tunaw na metal sa isang hulmahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos ayon sa tekstong Hebreo at sa pamantayan ng proyekto.
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: Tumayo ka at bumaba ka agad mula rito
  rationale: Napananatili ang sunod-sunod at apurahang mga utos, habang gumagamit ng natural na makabagong Tagalog.
- source_word: שִׁחֵת
  choice: nagpakasama
  rationale: Ipinahahayag ang moral at panrelihiyong pagkasira na may diwang kusang pagsasadlak ng sarili, nang hindi nililimitahan ang salita sa simpleng 'gumawa ng masama.'
- source_word: עַמְּךָ אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: ang iyong bayan na inilabas mo mula sa Ehipto
  rationale: Pinananatili ang tuwirang pagtukoy ng Diyos kay Moises at ang retorikal na paglalayo sa bayang nagkasala.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Mabilis silang lumihis sa daan
  rationale: Ang 'lumihis sa daan' ay natural na Tagalog at pinananatili ang metapora ng pagtalikod sa iniutos na pamumuhay; inuulit din ang diwa ng pagmamadali sa מַהֵר.
- source_word: מַסֵּכָה
  choice: imaheng hinulma sa metal
  rationale: Malinaw na inilalarawan ang isang imaheng ginawa sa pamamagitan ng pagbubuhos o paghulma ng tunaw na metal, sa halip na gawing pangkalahatang 'diyus-diyosan' lamang.
theological_decisions:
- issue: Retorikal na paglalayo sa pariralang 'iyong bayan na inilabas mo mula sa Ehipto'
  choice: Pinanatili ang 'iyong bayan' at 'inilabas mo' bilang pagsaway ng Diyos kay Moises.
  alternative: Palitan ng 'aking bayan na inilabas ko' o gawing mas banayad ang pahayag.
  rationale: Sadyang matalas ang anyo ng Hebreo at dapat panatilihin ang teolohikal at retorikal na tensiyon nito.
- issue: Kahulugan ng שִׁחֵת
  choice: nagpakasama
  alternative: naging masama; kumilos nang tiwali; ipinahamak ang kanilang sarili
  rationale: Ipinakikita ng konteksto ang malubhang pagkasira at apostasya. Iniiwasan ng salin ang sobrang tiyak na interpretasyong 'ipinahamak ang kanilang sarili' habang naipadarama ang aktibong pagkakasala.
- issue: Kongkretong anyo ng מַסֵּכָה
  choice: imaheng hinulma sa metal
  alternative: diyus-diyosan; imaheng binubo; imaheng tinunaw
  rationale: Pinananatili ang pisikal na paraan ng paggawa na tinutukoy ng Hebreo, nang hindi pinapalitan ng mas pangkalahatang teolohikal na katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'agad' sa unang מַהֵר at 'mabilis' sa ikalawa upang maging natural ang daloy habang pinananatili ang pag-uulit ng diwa. Ang pangalang 'Yahweh' ay hindi pinalitan ng titulong 'PANGINOON.'
