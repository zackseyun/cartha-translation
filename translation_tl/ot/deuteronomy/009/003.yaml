revisions:
- from: Kaya alamin mo ngayon na si Yahweh na iyong Diyos ang tumatawid sa unahan mo[a], isang apoy na tumutupok[b]. Lilipulin niya sila at pasusukuin sa harap mo. Aagawan mo sila ng lupain[c] at mabilis silang papawiin, gaya ng sinabi sa iyo ni Yahweh[d].
  to: Kaya alamin mo ngayon na si Yahweh na iyong Diyos ang tumatawid sa unahan mo[a], isang apoy na tumutupok[b]. Lilipulin niya sila at pasusukuin niya sila sa harap mo. Aalisin mo sila sa kanilang lupain[c] at mabilis mo silang papawiin, gaya ng sinabi sa iyo ni Yahweh[d].
  rationale: 'Inayos ang dalawang pandiwang may layon upang maipakita ang mga ahenteng itinatakda ng Hebreo: si Yahweh ang lilipol at magpapasuko sa kanila, samantalang ang Israel ang mag-aalis sa kanila sa lupain at magpapapawi sa kanila nang mabilis. Pinahusay din ang naturalness at linaw ng dispossession nang walang pagbabagong kahulugan o pagpapalawak sa marahas na larawang pangkasaysayan.'
