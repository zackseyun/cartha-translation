id: DEU.9.3
reference: Deuteronomy 9:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: tl
  text: Kaya alamin mo ngayon na si Yahweh na iyong Diyos ang tumatawid sa unahan mo[a], isang apoy na tumutupok[b]. Lilipulin niya sila at pasusukuin niya sila sa harap mo. Aalisin mo sila sa kanilang lupain[c] at mabilis mo silang papawiin, gaya ng sinabi sa iyo ni Yahweh[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nauuna sa iyo.” Literal na inilalarawan ng pandiwaring Hebreo si Yahweh bilang tumatawid sa unahan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: O “isang apoy na lumalamon.”
    reason: lexical_alternative
  - marker: c
    text: O “palalayasin mo sila” o “aalisan mo sila ng pag-aari.” Saklaw ng pandiwang Hebreo ang pagpapaalis sa mga naninirahan at pag-angkin sa kanilang lupain.
    reason: lexical_alternative
  - marker: d
    text: O “gaya ng sinalita sa iyo ni Yahweh.” Ang diwa ay magaganap ito alinsunod sa naunang sinabi ni Yahweh sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: Kaya alamin mo ngayon
  rationale: Ipinahahayag ng pang-ugnay at pandiwa ang bunga o paghikayat batay sa naunang konteksto; natural sa modernong Tagalog ang “Kaya alamin mo ngayon.”
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: si Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang tuwirang tipanang pananalitang “iyong Diyos.”
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: ang tumatawid sa unahan mo
  rationale: Pinananatili ang masiglang pandiwaring Hebreo at ang konkretong larawan ng pagtawid ni Yahweh na nauuna sa Israel.
- source_word: אֵשׁ אֹכְלָה
  choice: isang apoy na tumutupok
  rationale: Natural at matimbang itong paglalarawan sa mapanirang presensiya ng Diyos, habang pinananatili ang talinghaga ng orihinal.
- source_word: יַשְׁמִידֵם
  choice: Lilipulin niya sila
  rationale: Ang Hiphil ng שׁמד ay nagpapahiwatig ng lubos na pagwasak; malinaw at matindi ang “lilipulin” nang hindi gumagamit ng modernong teknikal na termino.
- source_word: יַכְנִיעֵם לְפָנֶיךָ
  choice: pasusukuin sa harap mo
  rationale: Sa kontekstong militar, ang causative na anyo ay tumutukoy sa pagpapababa o pagpapasuko sa mga bansa sa harap ng Israel.
- source_word: וְהוֹרַשְׁתָּם
  choice: Aagawan mo sila ng lupain
  rationale: 'Ipinahahayag nito ang legal at teritoryal na puwersa ng Hiphil ng ירשׁ: mawawalan sila ng pag-aari habang inaangkin ng Israel ang lupain.'
- source_word: וְהַאֲבַדְתָּם מַהֵר
  choice: mabilis silang papawiin
  rationale: Ibinubukod ang אבד mula sa naunang שׁמד at ipinakikita ang causative na pagkawala o pagkapawi, kasama ang bilis na ipinahahayag ng מַהֵר.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: gaya ng sinabi sa iyo ni Yahweh
  rationale: Pinananatili ang pagtukoy sa naunang salita ni Yahweh nang hindi ito labis na binibigyang-kahulugang isang pangako.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Larawan ng banal na pakikidigma sa אֵשׁ אֹכְלָה
  choice: isang apoy na tumutupok
  alternative: isang apoy na lumalamon
  rationale: Pinananatili ang matinding talinghaga ng banal at mapanirang presensiya ng Diyos, nang hindi ito pinahihina o dinaragdagan ng paliwanag na doktrinal.
- issue: Ugnayan ng pagkilos ni Yahweh at ng Israel
  choice: Lilipulin niya… pasusukuin… Aagawan mo… papawiin
  alternative: Iisang gumagawa lamang ang idiin
  rationale: 'Pinananatili ang tensiyon ng orihinal: si Yahweh ang unang kumikilos laban sa mga bansa, ngunit may tunay ding gawaing isasagawa ang Israel.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “iyong” sa pariralang tipanan para sa dignidad, ngunit pinanatili ang karaniwang “mo” sa natitirang pangungusap. Iniwasan ang labis na teknikal o denominasyonal na pananalita; pinanatili ang konkretong larawan, tindi, at pagkakaugnay ng pagkilos ni Yahweh at ng Israel.
