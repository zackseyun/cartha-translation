    issue: Mali ang ahente at pokus sa “mabilis silang papawiin.”
    rationale: 'Ang וְהַאֲבַדְתָּם ay Hiphil, ikalawang panauhang panlalaki isahan: “ikaw ang magpapapawi/lilipol sa kanila,” hindi “sila ay papawiin.”'
