    issue: Ang “Aagawan mo sila ng lupain” ay di-gaanong tuwiran para sa dispossession.
    rationale: Bagaman nauunawaan, mas malinaw na ipinahahayag ng “aalisin mo sila sa kanilang lupain” ang pagpapaalis/pag-aalis ng pagmamay-ari na saklaw ng Hiphil ng ירשׁ.
