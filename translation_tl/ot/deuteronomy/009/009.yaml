base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: tl
  text: Nang umakyat ako sa bundok upang tanggapin[a] ang mga tapyas na bato—ang mga tapyas ng tipang ginawa[b] ni Yahweh kasama ninyo—nanatili ako sa bundok nang apatnapung araw at apatnapung gabi. Hindi ako kumain ng tinapay at hindi uminom ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “kunin.” Sa kontekstong ito, umaakyat si Moises upang tanggapin ang mga tapyas na ibibigay sa kaniya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “pinutol ni Yahweh kasama ninyo,” isang karaniwang idyoma para sa paggawa ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי הָהָרָה
  choice: Nang umakyat ako sa bundok
  rationale: Ang ב plus infinitive construct ay temporal, kaya likas sa Tagalog ang “Nang umakyat ako.” Ipinahihiwatig ng hulaping lokatibo sa הָהָרָה ang paggalaw patungo sa tiyak na bundok.
- source_word: לָקַחַת
  choice: upang tanggapin
  rationale: Karaniwang nangangahulugang “kunin” ang pandiwa, ngunit sa konteksto ay umaakyat si Moises upang tanggapin ang mga tapyas na ibibigay sa kaniya. Pinananatili sa talababa ang literal na alternatibo.
- source_word: לוּחֹת הָאֲבָנִים
  choice: mga tapyas na bato
  rationale: Malinaw at likas na salin ng construct phrase na tumutukoy sa mga patag na tapyas na yari sa bato.
- source_word: לוּחֹת הַבְּרִית
  choice: mga tapyas ng tipan
  rationale: Pinananatili ang pag-uulit na appositional sa Hebreo upang idiin na ang mga tapyas na bato ang mga tapyas ng tipan.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: tipang ginawa ni Yahweh sa inyo
  rationale: Ang כָּרַת בְּרִית, literal na “pumutol ng tipan,” ay nakaugaliang Hebreong idyoma para sa paggawa o pagtatatag ng tipan. Ang “ginawa ... sa inyo” ay malinaw at hindi nagdaragdag ng denominasyonal na pakahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וָאֵשֵׁב
  choice: nanatili ako
  rationale: Bagaman maaaring mangahulugang “umupo” o “tumira,” ang diin dito ay ang pananatili sa bundok sa itinakdang haba ng panahon.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: apatnapung araw at apatnapung gabi
  rationale: Tuwirang pinananatili ang karaniwang Hebreong pahayag ng tagal.
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  choice: Hindi ako kumain ng tinapay ni uminom ng tubig
  rationale: Pinananatili ang kongkretong “tinapay” sa halip na palawakin ito bilang “pagkain,” at ginagamit ang “ni” upang likas na maipahayag ang magkatambal na pagtanggi sa Tagalog.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan nang hindi ito pinapalitan ng titulo o ng ibang anyong transliterasyon.
- issue: Kahulugan ng idyomang כָּרַת ... בְּרִית
  choice: tipang ginawa ni Yahweh sa inyo
  alternative: tipang pinagtibay ni Yahweh sa inyo; tipang literal na “pinutol” ni Yahweh sa inyo
  rationale: Karaniwang idyoma ito para sa paggawa ng tipan. Hindi ginawang literal ang “pumutol,” ngunit binanggit ito sa talababa upang mapanatili ang katangian ng pinagmulang wika nang walang artipisyal na Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tapyas” para sa mga stone tablets, “tipan” para sa בְּרִית, at maikling mga pangungusap upang madaling maunawaan habang pinananatili ang pag-uulit at diin ng Hebreo.
