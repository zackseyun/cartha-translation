base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: tl
  text: Pagkatapos ay sinabi sa akin ni Yahweh, “Nakita ko ang bayang ito, at narito, ito’y bayang matigas ang batok.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Pagkatapos ay” upang ipakita ang pagkakasunod-sunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֵלַי לֵאמֹר
  choice: sinabi sa akin
  rationale: Likas at sapat na panimula sa tuwirang pananalita sa Tagalog; magiging paulit-ulit ang tahasang pagsasalin ng לֵאמֹר bilang “na sinasabi.”
- source_word: רָאִיתִי
  choice: Nakita ko
  rationale: Tuwirang ipinapahayag ng Hebreong perfect ang nakita at natiyak ni Yahweh; natural sa Tagalog ang aspektong perpektibo.
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang “bayan” ay natural na kolektibong katawagan sa isang sambayanan at pinananatili ang isahang anyo ng Hebreo.
- source_word: וְהִנֵּה
  choice: at masdan mo
  rationale: Pinananatili ang pansin at diin ng הִנֵּה sa marangal ngunit nauunawaang pananalita.
- source_word: קְשֵׁה עֹרֶף
  choice: matigas ang batok
  rationale: Pinananatili ang konkretong Hebreong talinghaga para sa katigasan ng ulo at pagrerebelde.
- source_word: הוּא
  choice: sila ay isang bayan
  rationale: Bagaman isahan ang Hebreong kolektibong pangngalan, natural sa Tagalog na tukuyin ang mga taong bumubuo sa bayan sa panghalip na “sila,” habang inuulit ang “bayan” gaya ng pinagmulan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng קְשֵׁה עֹרֶף
  choice: matigas ang batok
  alternative: matigas ang ulo
  rationale: Pinananatili ang orihinal na metapora at ang teolohikal na diin sa sadyang pagtutol, nang hindi nililimitahan ito sa mas payak na paraprasang “matigas ang ulo.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Pinili ang “bayan” bilang likas na kolektibong katawagan at “matigas ang batok” upang mapanatili ang biblikal na larawan. Walang footnote dahil walang kinakailangang alternatibong pagbasa na mahalaga sa pag-unawa sa talata.
