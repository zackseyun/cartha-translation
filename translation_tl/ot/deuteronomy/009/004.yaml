  source_fidelity: Kailangang ituring ang dalawang sanhi—ang inaangking katuwiran ng Israel at ang kasamaan ng mga bansa—bilang nilalaman ng ipinagbabawal na panloob na pagsasalita. Ang “Sa halip” sa draft ay mas malakas kaysa sa simpleng pang-ugnay na וּ at inilalabas ang huling sugnay mula sa saklaw ng “saying.” Inalis din ang “rito,” na walang tuwirang katumbas sa Hebreo.
  naturalness: Mas natural at malinaw ang “samantalang” para sa kontras na ugnayan. Ang “mula sa harap mo” ay pinananatili upang maihatid ang spatial idiom ng Hebreo nang hindi masyadong literal o magaspang ang ayos.
  terminology: Ang “Yahweh,” “katuwiran,” at “lupaing ito” ay angkop at tapat sa mahahalagang termino. Ang “ariin” ay natural na katumbas dito ng pag-aari/pagkuha ng lupain.
