source:
  edition: WLC
  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: tl
  text: Huwag mong sabihin sa iyong puso[a], kapag itinataboy ni Yahweh na iyong Diyos ang mga ito mula sa harap mo, na, “Dahil sa aking katuwiran ay dinala ako ni Yahweh upang ariin ang lupaing ito, samantalang dahil sa kasamaan ng mga bansang ito ay pinalalayas sila ni Yahweh mula sa harap mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa iyong puso: idyomang Hebreo na nangangahulugang “sa iyong sarili” o “sa loob-loob mo.”'
    reason: Nililinaw ang metaporang Hebreo habang pinananatili ito sa pangunahing teksto.
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Huwag mong sabihin
  rationale: Ang אַל na may imperfect ay nagpapahayag ng pagbabawal; ito ang natural at tuwirang katumbas sa modernong Tagalog.
- source_word: בִּלְבָבְךָ
  choice: sa iyong puso
  rationale: Pinananatili nito ang metapora ng Hebreo para sa panloob na pag-iisip o pagsasalita sa sarili, at malinaw pa rin ito sa Tagalog.
- source_word: בַּהֲדֹף
  choice: kapag itinaboy
  rationale: Ang בְּ na may infinitive construct ay temporal dito, at ang נדף ay tumutukoy sa pagtataboy o pagpapaalis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּצִדְקָתִי
  choice: Dahil sa aking katuwiran
  rationale: Ipinapahayag nito ang ipinagbabawal na pag-aangkin na ang sariling moral na katuwiran ng Israel ang dahilan ng pagtanggap nito sa lupain.
- source_word: הֱבִיאַנִי
  choice: dinala ako rito
  rationale: Ang Hiphil ng בוא ay nangangahulugang ‘ipinasok’ o ‘dinala papasok’; nililinaw ng ‘rito’ ang pagpasok sa lupaing tinutukoy nang hindi nagdaragdag ng bagong ideya.
- source_word: לָרֶשֶׁת
  choice: upang angkinin
  rationale: Sa unang gamit, ang ירשׁ ay tumutukoy sa pagkuha at paghawak sa lupain bilang pag-aari; natural dito ang ‘angkinin.’
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: Sa halip, dahil sa kasamaan ng mga bansang ito
  rationale: 'Ang waw ay contrastive sa konteksto: hindi sariling katuwiran ng Israel kundi kasamaan ng mga bansang iyon ang binibigyang-diin.'
- source_word: מוֹרִישָׁם
  choice: pinalalayas sila
  rationale: Ang Hiphil participle ng ירשׁ ay may diwang pag-aalis sa mga bansa mula sa kanilang kinaroroonan o pag-aari; ang ‘pinalalayas’ ay malinaw at natural na Tagalog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong personal na pangalan at hindi pinapalitan ng titulo.
- issue: Ang maling pag-aangkin na nakamit ng Israel ang lupain dahil sa sariling kabutihan
  choice: Dahil sa aking katuwiran
  alternative: Dahil mabuti ako
  rationale: Pinananatili ng ‘katuwiran’ ang teolohikal at moral na bigat ng צְדָקָה at ang mismong pag-aangking tinututulan ni Moises.
- issue: Ugnayan ng katuwiran ng Israel at kasamaan ng mga bansa
  choice: Sa halip, dahil sa kasamaan ng mga bansang ito
  alternative: At dahil sa kasamaan ng mga bansang ito
  rationale: Ang konteksto ay nagpapakita ng malinaw na pagsalungat, ngunit hindi ipinahihiwatig na ang kasamaan ng mga bansa ang tanging dahilang ibinibigay sa mas malawak na talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang ‘sa iyong puso,’ ‘katuwiran,’ at ‘Yahweh’ dahil mahalaga ang mga ito sa anyo at teolohikal na tensiyon ng tekstong Hebreo; ginamit ang ‘sa halip’ upang natural na maipakita ang contrastive na waw.
