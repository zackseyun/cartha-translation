  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: tl
  text: Pagkatapos, nagpatirapa akong muli sa harap ni Yahweh, gaya noong una,[a] sa loob ng apatnapung araw at apatnapung gabi. Hindi ako kumain ng tinapay ni uminom ng tubig dahil sa lahat ng kasalanang ginawa ninyo—ginawa ninyo ang masama sa paningin ni Yahweh at ginalit ninyo siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gaya ng dati” o “tulad noong nakaraan.” Tinutukoy ng pariralang Hebreo ang naunang apatnapung araw ni Moises sa harap ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Pagkatapos, nagpatirapa ako
  rationale: Ang hitpael ng נפל ay tumutukoy sa kusang pagpapatirapa ni Moises sa harap ng Diyos; natural sa Filipino ang “nagpatirapa” at malinaw nitong ipinapakita ang pisikal na tindig.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang relasyonal at pansiwang diwa ng לִפְנֵי at ang tahasang pangalang tipan na יְהוָה.
- source_word: כָּרִאשֹׁנָה
  choice: muli ... gaya noong una
  rationale: Itinuturo ng parirala ang naunang apatnapung araw ni Moises; ang “gaya noong una” ang tuwirang katumbas, samantalang ang “muli” ay tumutulong sa likas na daloy sa Filipino.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: sa loob ng apatnapung araw at apatnapung gabi
  rationale: Tuwirang inilalahad ang tagal sa natural na anyong Filipino.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: Hindi ako kumain ng tinapay
  rationale: Pinananatili ang espesipikong “tinapay” ng Hebreo sa halip na gawing pangkalahatang “pagkain.”
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: ni uminom ng tubig
  rationale: Maikli at natural na koordinasyon sa naunang negatibong sugnay.
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: dahil sa lahat ng kasalanang ginawa ninyo
  rationale: Ang עַל ay nagpapahayag dito ng dahilan; ang kolektibong isahan na חַטָּאת ay maayos na naihahatid ng “lahat ng kasalanan.”
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: ginawa ninyo ang masama sa paningin ni Yahweh
  rationale: Pinananatili ang karaniwang idyoma ng banal na paghatol, “sa paningin,” at malinaw na iniuugnay ang masamang gawa sa kanilang kasalanan.
- source_word: לְהַכְעִיסוֹ
  choice: ginalit ninyo siya
  rationale: 'Natural na Filipino para sa causative na diwa ng hiphil ng כעס: ang kanilang ginawa ay pumukaw sa galit niya. Hindi nito ipinipilit kung layunin o bunga ang diin ng infinitive.'
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasan ang Tetragrammaton sa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang personal at pangtipang pangalan nang hindi ito ginagawang titulo.
- issue: Ugnayan ng לְהַכְעִיסוֹ sa masamang gawa
  choice: at ginalit ninyo siya
  alternative: upang galitin siya; na ikinagalit niya
  rationale: Maaaring magpahiwatig ang infinitive ng layunin o resulta. Pinipili ang koordinasyong natural sa Filipino at hindi tahasang nagpapasyang sinadya nilang galitin ang Diyos.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nagpatirapa” upang malinaw ang tindig ni Moises, at pinanatili ang “tinapay,” “sa paningin,” at ang pangalang “Yahweh” bilang mahahalagang sangkap ng tekstong Hebreo.
