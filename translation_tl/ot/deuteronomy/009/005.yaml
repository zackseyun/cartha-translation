    issue: Ang “salitang isinumpa ni Yahweh” at kaugnay na talababa ay gumagamit ng “isinumpa.”
    rationale: Sa makabagong Filipino, ang karaniwang kahulugan ng “isinumpa” ay ‘sinumpa/cursed,’ hindi ‘swore.’ Maaari nitong baligtarin o lubhang palabuin ang kahulugan ng Hebreong נִשְׁבַּע.
  - severity: low
    issue: “Mula sa harapan mo” para sa מִפָּנֶיךָ.
    rationale: Ang parirala ay literal na maaaring ‘mula sa harap mo,’ ngunit ang likas na Filipino sa kontekstong ito ay “sa harap mo,” na naghahayag na itinataboy sila ni Yahweh habang sumusulong ang Israel.
