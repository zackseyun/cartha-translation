  verdict: revise
  source_fidelity: Ang pangunahing diwa at ang dalawang ipinahahayag na batayan—ang kasamaan ng mga bansang ito at ang pagtupad ni Yahweh sa kanyang panunumpa sa mga patriyarka—ay nasa draft. Gayunman, ang “isinumpa” sa modernong Filipino ay karaniwang nangangahulugang ‘cursed,’ kaya hindi ito ligtas na salin ng נִשְׁבַּע (‘sumumpa’).
  naturalness: Marangal at malinaw ang kabuuang rehistro. Mas likas at tumpak ang “sa harap mo” kaysa “mula sa harapan mo” para sa מִפָּנֶיךָ.
  terminology: Ang “katuwiran,” “pagiging matuwid ng iyong puso,” “mga bansa,” at “Yahweh” ay angkop. Pinalitan ang posibleng mapanlinlang na “isinumpa” ng malinaw na pananalitang tumutukoy sa pangakong ginawa sa pamamagitan ng panunumpa.
  issues:
