source:
  edition: WLC
  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: tl
  text: Hindi dahil sa iyong katuwiran o sa pagiging matuwid ng iyong puso kaya ka papasok upang angkinin ang kanilang lupain. Kundi dahil sa kasamaan ng mga bansang ito, itinataboy sila ni Yahweh na iyong Diyos sa harap mo[a], at upang tuparin ang pangakong ginawa ni Yahweh sa iyong mga ama sa pamamagitan ng panunumpa—kina Abraham, Isaac, at Jacob[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inaalisan niya sila ng pag-aari sa harap mo.” Maaaring idiin ng pandiwang Hebreo ang pagkawala nila ng pag-aari sa lupain, hindi lamang ang pagtataboy sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang salitang ginawa ni Yahweh sa iyong mga ama sa pamamagitan ng panunumpa.” Ang “salita” rito ay tumutukoy sa isang pangakong pinagtibay sa pamamagitan ng panunumpa.
    reason: lexical_alternative
  - marker: c
    text: 'Ang “iyong mga ama” ay partikular na tumutukoy sa mga patriyarkang pinangalanan dito: Abraham, Isaac, at Jacob.'
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: dahil sa iyong katuwiran
  rationale: Causal ang ב sa konteksto ng pagtanggi; ang “katuwiran” ay tuwirang tumutukoy sa moral na pagiging tama.
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: o sa pagiging matuwid ng iyong puso
  rationale: Pinananatili nito ang Hebreong idyoma tungkol sa panloob na moral na kalagayan habang natural sa makabagong Filipino.
- source_word: בָא לָרֶשֶׁת אֶת־אַרְצָם
  choice: papasok upang angkinin ang kanilang lupain
  rationale: Ipinahahayag ng בוא kasama ng pawatas ang pagpasok at layunin; malinaw na tinutukoy ng “angkinin” ang pagkuha ng lupain bilang pag-aari.
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: dahil sa kasamaan ng mga bansang ito
  rationale: Causal ang parirala at katapat ng naunang itinangging dahilan; ang גּוֹיִם ay angkop na “mga bansa” rito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: itinataboy sila ... mula sa harapan mo
  rationale: Ang Hiphil ng ירשׁ ay maaaring tumukoy sa pagtataboy o pag-aalis sa pag-aari; pinili ang natural na pangunahing salin at inilagay sa talababa ang leksikal na alternatibo.
- source_word: וּלְמַעַן הָקִים
  choice: at upang pagtibayin
  rationale: Ang לְמַעַן ay nagsasaad ng layunin, at ang הקים kasama ng דָּבָר sa konteksto ng panunumpa ay nangangahulugang pagtitibay o pagtatatag.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: ang salitang isinumpa
  rationale: Pinananatili ang literal na “salita” habang ipinakikita ng “isinumpa” na isa itong ipinangakong salita.
- source_word: לַאֲבֹתֶיךָ
  choice: sa iyong mga ama
  rationale: Partikular na tumutukoy ang panlalaking pangmaramihan sa mga patriyarkang kasunod na pinangalanan.
theological_decisions:
- issue: Batayan ng pag-angkin ng Israel sa lupain
  choice: Hindi katuwiran ng Israel, kundi kapwa ang kasamaan ng mga bansa at ang katapatan ni Yahweh sa kanyang isinumpang salita
  alternative: Bigyang-diin lamang ang kasamaan ng mga bansa o lamang ang pangako sa mga patriyarka
  rationale: Malinaw na pinananatili ng Hebreo ang dalawang dahilan sa כִּי at וּלְמַעַן; hindi dapat alisin o pag-isahin ang alinman.
- issue: Paglilipat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katuwiran,” “pagiging matuwid ng puso,” at “pagtibayin” upang mapanatili ang mga pangunahing konseptong Hebreo nang hindi nagiging lipas o labis na teknikal. Lahat ng marker ng talababa ay nasa pangunahing teksto.
