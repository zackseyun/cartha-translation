revisions:
- from: Hindi dahil sa iyong katuwiran o sa pagiging matuwid ng iyong puso kaya ka papasok upang angkinin ang kanilang lupain. Sa halip, dahil sa kasamaan ng mga bansang ito, itinataboy sila ni Yahweh na iyong Diyos mula sa harapan mo[a], at upang pagtibayin ang salitang isinumpa ni Yahweh sa iyong mga ama—kina Abraham, Isaac, at Jacob[b][c].
  to: Hindi dahil sa iyong katuwiran o sa pagiging matuwid ng iyong puso kaya ka papasok upang angkinin ang kanilang lupain. Kundi dahil sa kasamaan ng mga bansang ito, itinataboy sila ni Yahweh na iyong Diyos sa harap mo[a], at upang tuparin ang pangakong ginawa ni Yahweh sa iyong mga ama sa pamamagitan ng panunumpa—kina Abraham, Isaac, at Jacob[b][c].
  rationale: 'Iningatan ng rebisyon ang ayos at saklaw ng Hebreo: hindi katuwiran o katapatan ng kalooban ng Israel ang dahilan ng pag-angkin ng lupain; ang mga dahilan ay ang kasamaan ng mga bansa at ang layuning tuparin ang ipinangakong salita sa mga patriyarka. Nilinaw ang panunumpa upang maiwasan ang maling modernong pagbasa ng “isinumpa,” at ginawang mas natural ang lokatibong parirala.'
