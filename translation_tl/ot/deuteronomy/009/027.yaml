source:
  edition: WLC
  text: זְכֹר֙ לַ/עֲבָדֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב אַל תֵּ֗פֶן אֶל קְשִׁי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/אֶל רִשְׁע֖/וֹ וְ/אֶל חַטָּאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: tl
  text: Alalahanin mo ang iyong mga lingkod—sina Abraham, Isaac, at Jacob. Huwag mong pansinin[a] ang pagmamatigas[b] ng bayang ito, ni ang kasamaan nito, ni ang kasalanan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Huwag kang bumaling sa” o “Huwag mong pagtuunan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “katigasan”; tumutukoy dito sa matigas na kalooban o sadyang pagtutol, hindi sa espesipikong idyomang “matigas ang leeg” na ginagamit sa ibang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Alalahanin mo
  rationale: Tuwirang pautos sa Diyos sa panalangin ni Moises. Likas sa Filipino ang “alalahanin” at angkop ito sa konteksto ng pagsusumamo batay sa tipan.
- source_word: לַעֲבָדֶיךָ
  choice: ang iyong mga lingkod
  rationale: Ang עבד ay maaaring mangahulugang lingkod o alipin. Dito, marangal na tawag ito sa mga patriyarka bilang mga lingkod ng Diyos, kaya hindi itinatampok ang kalagayang pagkaalipin.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: sina Abraham, Isaac, at Jacob
  rationale: Ginamit ang “sina” upang natural na ipakilala sa Filipino ang tatlong taong tinutukoy bilang mga lingkod.
- source_word: אַל תֵּפֶן אֶל
  choice: Huwag mong pansinin
  rationale: Ang literal na diwa ay huwag bumaling patungo sa isang bagay; sa konteksto ng panalangin, nangangahulugan itong huwag itong pagtuunan o isaalang-alang. Natural at malinaw sa modernong Filipino ang “huwag mong pansinin.”
- source_word: קְשִׁי
  choice: pagmamatigas
  rationale: Ang pangngalan ay tumutukoy sa katigasan o pagiging matigas ang kalooban. Ipinahahayag ng “pagmamatigas” ang moral at sadyang pagtutol nang hindi ipinapasok ang naiibang Hebreong idyomang “matigas ang leeg.”
- source_word: הָעָם הַזֶּה
  choice: ng bayang ito
  rationale: Ang עם ay tumutukoy sa sambayanan. Ang “bayang ito” ay natural sa Filipino at pinananatili ang puwersa ng demonstratibo.
- source_word: רִשְׁעוֹ
  choice: ang kasamaan nito
  rationale: Tinutukoy ng רשע ang moral na kasamaan. Ang hulaping isahan sa Hebreo ay tumutukoy sa kolektibong “bayan,” kaya pinanatili ang kolektibong isahan na “nito,” na natural din sa Filipino.
- source_word: חַטָּאתוֹ
  choice: ang kasalanan nito
  rationale: Pinananatili ng “kasalanan” ang kongkretong diwa ng moral na pagsuway. Ang “nito” ay umaayon sa kolektibong pangngalang “bayan” at sa hulaping isahan ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa mga patriyarka bilang עבד
  choice: mga lingkod
  alternative: mga alipin
  rationale: Sa panalanging ito, marangal na katawagang may kaugnayan sa tipan ang salita para kina Abraham, Isaac, at Jacob; hindi pangunahing itinatampok ang legal o panlipunang kalagayan ng isang alipin.
- issue: Mga hulaping isahan sa “kasamaan” at “kasalanan”
  choice: kasamaan nito … kasalanan nito
  alternative: kanilang kasamaan … kanilang kasalanan
  rationale: Ang tinutukoy ay ang bayang kolektibo. Parehong posible sa Filipino ang kolektibong isahan at maramihan, ngunit ang “nito” ay natural na tumutugma sa “bayang ito” at mas malapit na nagpapanatili sa anyong isahan ng Hebreo nang hindi binabago ang kahulugan.
translation_notes:
  register: Modernong Filipino na magalang at marangal ang rehistro. Ginamit ang “iyong” sa halip na “mong” sa unang pangungusap para sa mahinahong himig ng panalangin, habang pinanatili ang natural na “Huwag mong pansinin” sa ikalawa. Ang em dash at “sina” ay malinaw na nagpapakitang sina Abraham, Isaac, at Jacob ang mga lingkod na tinutukoy.
