source:
  edition: WLC
  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: tl
  text: 'Pakinggan mo, Israel: tatawid ka ngayon sa Jordan upang pumasok at sakupin[a] ang mga bansang mas malalaki at mas makapangyarihan kaysa sa iyo, na may malalaki at napapaderang mga lungsod na abot hanggang langit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “angkinin” o “ariin.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkuha ng pag-aari; sa kontekstong ito ng pananakop, kabilang dito ang pagpapaalis sa mga dating naninirahan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “hanggang sa kalangitan,” isang matinding paglalarawan sa napakataas na mga muog.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע
  choice: Pakinggan mo
  rationale: Isahan ang pautos sapagkat kinakausap ang Israel bilang isang kabuuan. Likas ito sa modernong Filipino at pinananatili ang diin ng panawagang makinig.
- source_word: עֹבֵר הַיּוֹם
  choice: tatawid ka ngayon
  rationale: Ipinahihiwatig ng participle kasama ng 'ngayon' ang nalalapit na pagkilos; mas natural sa Filipino ang aspektong kontemplatibo rito kaysa literal na progresibo.
- source_word: אֶת־הַיַּרְדֵּן
  choice: sa Jordan
  rationale: Karaniwang anyo ng pangalang heograpiko; sapat na sa konteksto ang 'Jordan' kahit hindi idagdag ang 'Ilog.'
- source_word: לָבֹא
  choice: upang pumasok
  rationale: Pinananatili ang layunin at direksiyon ng pagpasok sa lupain matapos tumawid sa Jordan.
- source_word: לָרֶשֶׁת
  choice: palayasin
  rationale: Sa konteksto ng pananakop, ang pandiwa ay tumutukoy sa pag-aalis sa mga dating naninirahan upang makuha ang kanilang pag-aari. Ang talababa ay nagpapanatili sa kaugnay na diwa ng pag-angkin.
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy sa magkakahiwalay na mga pangkat-bayan o bansa at tuwirang katumbas sa karaniwang gamit sa Deuteronomio.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: mas malalaki at mas makapangyarihan kaysa sa iyo
  rationale: Pinananatili ang dalawang paghahambing—laki o kadakilaan at lakas—at ang tuwirang paghahambing sa Israel.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת
  choice: malalaki at napapaderang mga lungsod
  rationale: Ang 'napapaderan' ay malinaw at likas na paglalarawan sa mga lungsod na pinatibay bilang tanggulan.
- source_word: בַּשָּׁמָיִם
  choice: abot hanggang langit
  rationale: Pinananatili ang matinding larawang Hebreo para sa napakataas na mga kuta sa halip na pahinain ito bilang payak na paraphrase.
theological_decisions:
- issue: Matinding paglalarawan sa taas ng mga kuta ng lungsod
  choice: abot hanggang langit
  alternative: napakataas at napakatibay
  rationale: Ang pananalita ay retorikal na pagmamalabis, ngunit mahalagang panatilihin ang mismong larawan ng tekstong Hebreo nang hindi ito itinuturing na literal na sukat o pinapahina sa paliwanag lamang.
- issue: Diwa ng ירשׁ sa konteksto ng pananakop
  choice: palayasin
  alternative: angkinin o ariin
  rationale: Dahil mga bansa ang tuwirang layon, malinaw sa konteksto ang diwa ng pag-aalis sa mga dating may hawak. Gayunman, inilalahad sa talababa ang leksikal na kaugnayan nito sa pagkuha o pag-angkin ng pag-aari.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang 'Pakinggan mo' upang maipakita ang isahang pautos sa Israel bilang isang kabuuan. Iniwasan ang lipas na bokabularyo, habang pinanatili ang masidhing larawang 'abot hanggang langit.'
