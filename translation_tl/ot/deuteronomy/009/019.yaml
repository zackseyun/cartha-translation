revisions:
- from: Sapagkat natakot ako dahil sa galit at matinding poot ni Yahweh laban sa inyo, na anupa’t lilipulin niya kayo.[a] Ngunit dininig ako ni Yahweh nang pagkakataong iyon din.[b]
  to: Sapagkat natakot ako dahil sa galit at matinding poot ni Yahweh laban sa inyo—sa tindi ng galit niya—upang lipulin kayo.[a] Ngunit dininig ako ni Yahweh[b] noon ding pagkakataong iyon.
  rationale: Pinalitan ang resultang “na anupa’t lilipulin niya kayo” ng “upang lipulin kayo” upang mapanatili ang layuning ipinahahayag ng Hebreong infinitibo. Idinagdag ang maikling pagpapahayag ng tindi ng pagkagalit upang hindi tuluyang mawala ang קָצַף, ngunit iniwasan ang hindi likas na “galit na ikinagalit.” Inayos din ang pangwakas na parirala at inilipat ang talababa tungkol sa “dininig” sa salitang tinutukoy nito.
