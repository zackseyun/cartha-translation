  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: tl
  text: Sapagkat natakot ako dahil sa galit at matinding poot ni Yahweh laban sa inyo—sa tindi ng galit niya—upang lipulin kayo.[a] Ngunit dininig ako ni Yahweh[b] noon ding pagkakataong iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa galit at matinding poot na ikinagalit ni Yahweh laban sa inyo, upang lipulin kayo.”
    reason: Pinananatili ng pangunahing salin ang tindi ng pandiwang Hebreo para sa pagkagalit nang natural sa Filipino; ang alternatibo ay mas malapit sa ayos ng Hebreo.
  - marker: b
    text: O “pinakinggan ako ni Yahweh” o “narinig ako ni Yahweh.” Literal na “nakinig si Yahweh sa akin.” Sa konteksto, ipinahihiwatig nitong tumugon siya nang mabuti sa pamamagitan ni Moises.
    reason: Pinananatili ang saklaw ng kahulugan ng שׁמע na may אֶל, habang ipinapaliwanag ang kontekstuwal na diwa ng kanais-nais na pakikinig.
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: natakot ako
  rationale: Tuwirang ipinahahayag ng Qal perfect 1cs ang personal na takot o pangamba ni Moises; natural sa makabagong Tagalog ang “natakot ako.”
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Sa idyomang ito, ipinakikita ng parirala ang sanhi ng pagkatakot, hindi literal na lokasyon sa harapan.
- source_word: הָאַף וְהַחֵמָה
  choice: galit at matinding poot
  rationale: Kapuwa tumutukoy sa matinding pagkagalit ang dalawang salitang Hebreo. Pinananatili ng pares na ito ang diin ng orihinal habang likas pa rin sa Tagalog.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: ni Yahweh laban sa inyo
  rationale: Ipinahihiwatig na ng “galit at matinding poot” ang pandiwang קָצַף; ang mas payak na ayos ay umiiwas sa di-likas na pag-uulit ng “galit na ikinagalit” ngunit pinananatili ang pagtutol laban sa Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: na anupa’t lilipulin niya kayo
  rationale: Ang שׁמד sa Hiphil ay nangangahulugang maglipol o magwasak. Ang “anupa’t” ay likas na nag-uugnay sa matinding galit at sa napipintong paglipol, bagaman maaaring unawain ang לְ bilang layunin.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Ngunit dininig ako ni Yahweh
  rationale: Ang שׁמע na may אֶל ay higit sa pisikal na pagkarinig at maaaring mangahulugang pakikinig na may pagsang-ayon o pagtugon. Ang “dininig” ay angkop sa konteksto ng pamamagitan ni Moises.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: nang pagkakataong iyon din
  rationale: 'Pinananatili ng “din” ang dagdag na diwa ng גַּם: isa rin ito sa mga pagkakataong pinakinggan si Moises.'
theological_decisions:
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Ugnayan ng galit ni Yahweh at ng paglipol sa Israel
  choice: na anupa’t lilipulin niya kayo
  alternative: upang lipulin kayo
  rationale: Maaaring magpahiwatig ang לְהַשְׁמִיד ng layunin o ng kinahinatnang banta. Gumagamit ang pangunahing teksto ng likas na ugnayang resulta sa Tagalog, habang itinatala sa talababa ang mas tuwirang pagbasa bilang layunin upang hindi mawala ang tunay na tensiyon.
- issue: Kahulugan ng pakikinig ni Yahweh kay Moises
  choice: dininig ako ni Yahweh
  alternative: narinig ako ni Yahweh
  rationale: Sa konteksto ng pamamagitan, ipinahihiwatig ng pandiwa ang kanais-nais na pagtugon, ngunit hindi dinaragdagan ng salin ang teksto ng tahasang pahayag kung paano tumugon si Yahweh.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “matinding poot” upang maipadama ang pinagsamang lakas ng mga salitang Hebreo para sa galit, at “dininig” bilang maikli at pamilyar na pananalita para sa kanais-nais na pakikinig sa isang pakiusap.
