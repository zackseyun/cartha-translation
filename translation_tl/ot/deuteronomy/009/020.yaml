  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: tl
  text: Labis na nagalit si Yahweh kay Aaron[a], upang lipulin siya; at nanalangin din ako para kay Aaron nang panahong iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “laban kay Aaron”; maaaring isalin sa alinmang paraan ang pang-ukol na Hebreo sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: Labis ding nagalit ... kay Aaron
  rationale: Ginawang layon ng galit si Aaron, gaya ng likas na gamit sa Filipino; ipinahihiwatig ng “din” ang kaugnayan nito sa naunang salaysay. Posible rin ang “laban kay Aaron,” kaya pinanatili sa talababa ang alternatibo.
- source_word: הִתְאַנַּף ... מְאֹד
  choice: labis na nagalit
  rationale: Pinagsama ang pandiwa ng matinding galit at ang paningit na מְאֹד sa natural at marangal na Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinumbasan ang banal na pangalang YHWH sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: לְהַשְׁמִידוֹ
  choice: at ibig niya itong lipulin
  rationale: Ang infinitibong may לְ ay nagpapahayag ng layunin o intensiyon. Ang “lipulin” ay nagpapanatili sa tindi ng שׁמד nang hindi tinutukoy ang paraan ng pagwasak.
- source_word: וָאֶתְפַּלֵּל
  choice: Kaya nanalangin ... ako
  rationale: Ang “nanalangin” ang tuwirang katumbas ng Hitpael ng פלל. Ang “kaya” ay natural na naghahayag ng bunga sa konteksto, bagaman waw-consecutive ang anyong Hebreo.
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: din ako para kay Aaron
  rationale: Ang “din” ay kumakatawan sa גַּם, at ang “para kay” ay malinaw na nagpapahayag ng panalanging alang-alang kay Aaron nang hindi gumagamit ng mas interpretibong “namagitan.”
- source_word: בָּעֵת הַהִוא
  choice: nang panahong iyon
  rationale: Natural na temporal na parirala sa modernong Filipino na malinaw na tumutukoy sa panahong kasalukuyang isinasalaysay.
theological_decisions:
- issue: Paglalapat ng galit ni Yahweh kay Aaron
  choice: kay Aaron
  alternative: laban kay Aaron
  rationale: Sa mga pandiwa ng galit, maaaring markahan ng בְ ang taong kinagagalitan. Ang “kay Aaron” ang mas likas sa Filipino, habang kinikilala sa talababa ang posibleng mas adversatibong pagbasa.
- issue: Paglalahad ng layuning lipulin si Aaron
  choice: ibig niya itong lipulin
  alternative: upang lipulin siya
  rationale: Ipinahahayag ng לְ + infinitibo ang layunin o intensiyon. Nililinaw ng “ibig niya” ang ugnayan nang hindi sinasabing aktuwal na isinagawa ang paglipol.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili ang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “lipulin” upang mapanatili ang bigat ng banta, at iniwasan ang mas teknikal na “namagitan” dahil “nanalangin para kay” ang mas tuwirang salin.
