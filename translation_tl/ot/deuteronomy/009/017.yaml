translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tapyas” para sa mga tabletang sulatan at pinanatili ang masinsing larawang “dalawa kong kamay” at “sa harap ng inyong mga mata.”
