  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: tl
  text: Kaya't hinawakan ko ang dalawang tapyas, inihagis ko ang mga ito mula sa aking dalawang kamay, at binasag ko ang mga ito sa harap ng inyong mga mata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at binali ko ang mga ito.” Ang pandiwang Hebreo ay maaari ring isaling “binasag” o “binali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: hinawakan ko
  rationale: Ang תפשׂ ay nangangahulugang humawak o dumakma. Likas at malinaw sa modernong Filipino ang “hinawakan ko” at hindi nito dinaragdagan ang tindi ng kilos.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: ang dalawang tapyas
  rationale: Ang לֻחוֹת ay mga tapyas na sulatan; kilala na sa konteksto ang mga tapyas ng tipan. Hindi idinagdag ang “bato” dahil hindi ito tahasang binanggit sa talata.
- source_word: וָאַשְׁלִכֵם
  choice: inihagis ang mga iyon
  rationale: Karaniwang kahulugan ng שלך ang maghagis. Ang “inihagis” ay tuwiran, makabago, at angkop sa pisikal na kilos.
- source_word: מֵעַל שְׁתֵּי יָדַי
  choice: mula sa dalawa kong kamay
  rationale: Pinananatili nito ang tahasang pagbanggit ng Hebreo sa dalawang kamay, sa halip na paikliin bilang “mula sa aking mga kamay.”
- source_word: וָאֲשַׁבְּרֵם
  choice: binasag ang mga iyon
  rationale: Ang שׁבר ay nangangahulugang basagin o baliin. Ang “binasag” ang pinakanatural na pandiwa para sa matitigas na tapyas at hindi nito ipinapalagay nang higit sa sinasabi ng Hebreo ang antas ng pagkadurog.
- source_word: לְעֵינֵיכֶם
  choice: sa harap ng inyong mga mata
  rationale: Malapit itong tumutugma sa idyomang Hebreo at malinaw na nagpapahiwatig na nasaksihan mismo ng mga kausap ang ginawa.
