  terminology: Ang “iniibig,” “mga bayan,” “mga banal,” “iyong kamay,” at “iyong paanan” ay wasto at hindi nagpapasok ng makitid na interpretasyong teolohikal. Ang “ibinuwal” ay posibleng pahiwatig para sa alternatibong ‘struck down,’ ngunit ang “ibinagsak” ay mas tuwiran at mas natural para sa modernong Filipino.
