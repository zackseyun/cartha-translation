base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: tl
  text: Tunay ngang iniibig niya ang mga bayan; ang lahat ng kanyang mga banal ay nasa iyong kamay. Sila’y nakaupo[a] sa iyong paanan; bawat isa’y tumatanggap ng iyong mga salita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang pandiwang Hebreo. Maaari rin itong unawain na “nagtipon,” “yumukod,” o maging “ibinagsak.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “bawat isa’y kumukuha mula sa iyong mga salita” o “nagdadala ng iyong mga pahayag.” Bihira at mahirap unawain ang pariralang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Tunay nga
  rationale: Ginamit bilang mariing panimulang kataga, hindi lamang bilang dagdag na “din” o “kahit.”
- source_word: חֹבֵב
  choice: iniibig
  rationale: Ipinahahayag ng participle ang patuloy na disposisyon ng pag-ibig; natural at marangal ang “iniibig” sa Filipino.
- source_word: עַמִּים
  choice: ang mga bayan
  rationale: Pinananatili ang maramihang kolektibong diwa at hindi ito agad nililimitahan sa mga bansang Hentil.
- source_word: כָּל קְדֹשָׁיו
  choice: ang lahat ng kanyang mga banal
  rationale: Pinananatiling malawak ang pagtukoy sa mga itinalaga bilang banal, nang hindi ipinapalagay kung sila ay mga anghel o Israel lamang.
- source_word: בְּיָדֶךָ
  choice: nasa iyong kamay
  rationale: Pinananatili ang literal at malinaw na idyoma, pati ang biglang paglipat ng tula mula ikatlo tungo sa ikalawang panauhan.
- source_word: תֻּכּוּ
  choice: nakaupo
  rationale: Bagaman lubhang hindi tiyak ang anyong Hebreo, ang kahulugang pag-upo o pagyukod ay angkop sa larawan ng mga nasa paanan upang makinig; inilalahad sa talababa ang ibang posibilidad.
- source_word: לְרַגְלֶךָ
  choice: sa iyong paanan
  rationale: Natural na katumbas sa Filipino para sa larawan ng pag-upo, pagpapasakop, o pakikinig sa paanan.
- source_word: יִשָּׂא
  choice: tumatanggap
  rationale: Ang pangunahing diwa ay magbuhat o magdala, ngunit sa kaugnayan nito sa mga salita, malinaw at likas ang idiomatikong “tumatanggap”; nananatili sa talababa ang literal na posibilidad.
- source_word: מִדַּבְּרֹתֶיךָ
  choice: ng iyong mga salita
  rationale: Ang pambihirang anyo ay tumutukoy sa pananalita o mga pahayag; “mga salita” ang pinakanatural, habang itinatala sa talababa ang puwersa ng unlaping מִן.
theological_decisions:
- issue: Paglipat ng mga panghalip sa tula
  choice: Pinanatili ang “niya/kanyang” at pagkatapos ay “iyong.”
  alternative: Gawing pawang ikatlong panauhan o pawang ikalawang panauhan ang talata.
  rationale: Tunay na katangian ng tekstong Hebreo ang biglang pagpapalit ng panauhan; ang pagsasaayos nito ay magtatago ng umiiral na tensiyong patula.
- issue: Tinutukoy ng “mga banal”
  choice: Hindi tinukoy kung mga anghel, Israel, o ibang pangkat.
  alternative: Isalin bilang “mga anghel,” “mga banal ng Israel,” o mas tiyak na katawagan.
  rationale: Hindi sapat ang talata upang tiyakin ang referent, kaya pinananatili ang sadyang malawak na katawagan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong patula, ang paglipat ng panauhan, at ang mahahalagang kawalang-katiyakan ng Hebreo; iniwasan ang katawagang may makitid na denominasyonal na pakahulugan.
