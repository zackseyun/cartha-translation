  - severity: low
    issue: Pagpili ng alternatibong “ibinuwal” sa talababa a
    rationale: Bagaman maiuugnay ito sa isang posibleng pagbasa, mas malinaw at karaniwang modernong Filipino ang “ibinagsak” para sa alternatibong pagkaunawang ‘were struck down.’
