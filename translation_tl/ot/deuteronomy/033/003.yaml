  to: Tunay ngang iniibig niya ang mga bayan; ang lahat ng kanyang mga banal ay nasa iyong kamay. Sila’y nakaupo[a] sa iyong paanan; bawat isa’y tumatanggap ng iyong mga salita.[b]
