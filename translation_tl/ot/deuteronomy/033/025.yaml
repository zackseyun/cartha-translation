  yaml_path: translation/ot/deuteronomy/033/025.yaml
  text: Your bars shall be iron and bronze[a], and as your days[b], so shall your strength be.
translation:
  language: tl
  text: Ang iyong mga trangka ay magiging bakal at bronse[a]; at kung gaano kahaba ang iyong mga araw, ganoon din ang iyong lakas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga sandalyas/sapatos mo ay magiging bakal at bronse.” Maaaring tumukoy sa kasuotan sa paa ang pangngalang Hebreo, ngunit inuunawa ito ng marami bilang mga trangka o halang dahil sa imahen ng mga metal at sa konteksto ng seguridad.
    reason: lexical_alternative
  - marker: b
    text: O “ang iyong kapahingahan/seguridad.” Bihira at hindi tiyak ang huling salitang Hebreo; ang “lakas” ay tradisyonal na saling nababagay sa konteksto ng basbas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: bakal
  rationale: Karaniwang tawag sa metal na iron at malinaw na kapares ng נְחֹשֶׁת.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Maaaring tumukoy ang salitang Hebreo sa tanso o bronse; pinili ang “bronse” dahil natural itong kapares ng “bakal” sa larawang metaliko ng talata.
- source_word: מִנְעָלֶיךָ
  choice: mga halang mo
  rationale: Bagaman maaari itong mangahulugang mga sandalyas o sapatos, ang mga halang na bakal at bronse ay angkop sa larawan ng matibay na seguridad sa basbas kay Asher. Pinanatili sa talababa ang tunay na alternatibong leksikal.
- source_word: וּכְיָמֶיךָ
  choice: at kasintagal ng iyong mga araw
  rationale: Ipinahahayag ng כ ang paghahambing o pagkakatugma. Ang “kasintagal” ay natural sa Filipino at iniuugnay ang tagal ng mga araw sa kasunod na pangngalan nang hindi ginagawang tahasang paliwanag ang pahayag.
- source_word: דָּבְאֶךָ
  choice: ang iyong lakas
  rationale: Bihira at hindi tiyak ang salitang Hebreo. Ang “lakas” ay tradisyonal at nababagay sa konteksto ng basbas, ngunit inilalahad sa talababa ang mahahalagang alternatibo.
theological_decisions:
- issue: Larawan at pangako sa basbas
  choice: Matibay na seguridad at lakas na tumatagal sa buong panahon ng buhay
  alternative: Matibay na kasuotan sa paa at patuloy na sigla; o kapahingahan/seguridad na kaayon ng mga araw
  rationale: Umaangkop ang pangunahing pagbasa sa mga metal at sa konteksto ng basbas, ngunit hindi tiyak ang dalawang pangunahing salitang Hebreo. Kaya hindi isinasara ng salin ang usapin at tahasang pinananatili sa mga talababa ang ibang posibleng pagbasa.
translation_notes:
  register: 'Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mo/iyong” ayon sa natural na daloy: “mo” sa unang sugnay at “iyong” sa mas pormal na patulang paghahambing. Napanatili ang maikli at paralelong anyo ng Hebreo, habang ang mga tunay na kawalang-katiyakan ay inilagay sa mga talababa.'
