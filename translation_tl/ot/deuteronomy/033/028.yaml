language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁכֹּן֩ יִשְׂרָאֵ֨ל בֶּ֤טַח בָּדָד֙ עֵ֣ין יַעֲקֹ֔ב אֶל אֶ֖רֶץ דָּגָ֣ן וְ/תִיר֑וֹשׁ אַף שָׁמָ֖י/ו יַֽעַרְפוּ טָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: tl
  text: Kaya nanirahan ang Israel nang tiwasay, hiwalay sa iba[b]; ang bukal ni Jacob[a] ay nasa lupaing may butil at bagong alak; maging ang kanyang kalangitan ay nagtutulo ng hamog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mata ni Jacob.” Ang salitang Hebreo ay maaaring mangahulugang “mata” o “bukal.”
    reason: lexical_alternative
  - marker: b
    text: O “Nanirahan ang Israel nang tiwasay, nang mag-isa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: nanirahan
  rationale: Likas at marangal na katumbas ng pandiwang tumutukoy sa paninirahan o pananatili sa isang lugar.
- source_word: בֶּטַח
  choice: nang tiwasay
  rationale: Ipinapahayag ang kalagayang ligtas at walang pangamba, ayon sa pang-abay na gamit nito sa talata.
- source_word: בָּדָד
  choice: at bukod
  rationale: Pinananatili ang diwa ng hiwalay at hindi ginagambalang paninirahan nang hindi ipinahihiwatig ang malungkot na pag-iisa.
- source_word: עֵין יַעֲקֹב
  choice: ang bukal ni Jacob
  rationale: Ang עֵין ay maaaring mangahulugang “mata” o “bukal.” Pinili ang “bukal” dahil umaayon ito sa kasunod na larawan ng matabang lupain at hamog, habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: אֶל אֶרֶץ
  choice: ay nasa lupain
  rationale: Bagaman karaniwang nangangahulugang “patungo sa” ang אֶל, maaari itong magpahayag ng kaugnayan o kinalalagyan sa tulang Hebreo; nilinaw ng “nasa” ang lokasyon nang hindi dinaragdagan ang larawan.
- source_word: דָּגָן
  choice: butil
  rationale: Pangkalahatang tawag ito sa ani ng mga halamang butil; mas tumpak kaysa sa isang tiyak na uri ng pananim.
- source_word: תִירוֹשׁ
  choice: bagong alak
  rationale: Pinananatili ang pagtukoy sa sariwa o bagong alak bilang bahagi ng larawang pang-agrikultura.
- source_word: אַף
  choice: maging
  rationale: 'Ipinahahayag ang mariing pagdaragdag: hindi lamang ang lupain kundi maging ang langit ay nagbibigay ng pagpapala.'
- source_word: שָׁמָיו
  choice: ang langit niya
  rationale: Pinananatili ang panlalaking isahang hulapi na tumutukoy kay Israel/Jacob, sa natural na anyong Tagalog.
- source_word: יַעַרְפוּ
  choice: nagpapatak
  rationale: Ang pandiwa ay naglalarawan sa pagpapatak o pagpatak ng halumigmig; ang anyong ito ay malinaw at angkop sa patulang larawan.
- source_word: טָל
  choice: hamog
  rationale: Tuwirang katumbas na nagpapanatili sa larawan ng kasaganaan at pagpapala sa agrikultura.
theological_decisions:
- issue: Kahulugan ng עֵין יַעֲקֹב
  choice: “ang bukal ni Jacob” sa pangunahing teksto
  alternative: “ang mata ni Jacob”
  rationale: Leksikal at patulang usapin ito, hindi pagpapasya sa doktrina. Mas umaayon ang “bukal” sa butil, bagong alak, at hamog, ngunit pinananatili sa talababa ang posibleng literal na “mata.”
- issue: Diwa ng בָּדָד
  choice: “bukod” bilang payapa at hiwalay na kalagayan
  alternative: “mag-isa” o “nang hiwalay”
  rationale: Ang konteksto ng pagpapala ay tumutukoy sa ligtas at hindi ginagambalang pagkakabukod, hindi sa pagpapabaya o malungkot na pag-iisa.
- issue: Ugnayang sintaktiko ng בֶּטַח בָּדָד
  choice: “nang tiwasay at bukod”
  alternative: “nanirahang tiwasay nang bukod”
  rationale: Magkakaugnay ang dalawang paglalarawan sa Hebreo. Pinili ang likas na pariralang Tagalog habang kinikilala sa talababa ang mas dikit na pag-uugnay ng mga salita.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Pinanatili ang maikling patulang daloy at ang bahagyang di-pangkaraniwang larawang “bukal ni Jacob,” habang nililinaw sa talababa ang leksikal at sintaktikong mga alternatibo.
