base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/022.yaml
  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: tl
  text: 'Tungkol naman kay Dan, sinabi niya: “Si Dan ay isang batang leon; lumulukso siya mula sa Bashan.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְדָן
  choice: At tungkol kay Dan
  rationale: Ipinakikilala ng pang-ukol ang susunod na pagpapala sa tribo; natural sa modernong Tagalog ang “tungkol kay” para sa diwang “hinggil kay Dan.”
- source_word: אָמַר
  choice: ay sinabi niya
  rationale: Payak at tuwirang katumbas ng karaniwang pandiwa para sa pagsasalita, habang pinananatili ang pormulang ginagamit sa mga pagpapala.
- source_word: דָּן
  choice: Dan
  rationale: Pangalan ng tao at tribo, kaya pinanatili sa karaniwang transliterasyon.
- source_word: גּוּר אַרְיֵה
  choice: anak ng leon
  rationale: Tumutukoy ang pariralang Hebreo sa batang leon. Ang “anak ng leon” ay malinaw, marangal, at natural, at pinananatili ang ugnayang construct ng parirala.
- source_word: יְזַנֵּק
  choice: lumulukso siya
  rationale: Ipinahihiwatig ng pandiwa ang biglaan at masiglang paglukso o pagsirit. Ang “lumulukso” ay matingkad ngunit hindi nagdaragdag ng tiyak na layuning gaya ng “sumasalakay.”
- source_word: מִן הַבָּשָׁן
  choice: mula sa Bashan
  rationale: Ang מִן ay nagpapahayag ng pinagmulan; tuwiran at natural ang “mula sa Bashan.”
