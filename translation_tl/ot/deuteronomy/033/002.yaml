reference: Deuteronomy 33:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: tl
  text: 'At sinabi niya:


    “Dumating si Yahweh mula sa Sinai;

    sumikat siya mula sa Seir sa kanila.

    Nagliwanag siya mula sa Bundok Paran,

    at dumating mula sa laksa-laksang kabanalan.[a]

    Mula sa kanyang kanang kamay

    ay dumating para sa kanila ang nagliliyab na kautusan.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa laksa-laksang mga banal.” Maaaring tumukoy ang pariralang Hebreo sa mga banal na tagapaglingkod, hindi lamang sa abstraktong kabanalan.
    reason: alternative_reading
  - marker: b
    text: Mahirap at hindi tiyak ang salitang Hebreo rito. Tradisyonal itong isinasaling “nagliliyab na kautusan,” ngunit maaari rin itong tumukoy sa mga kislap ng apoy o sa apoy na nagmumula sa kanyang kanang kamay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: מִסִּינַי בָּא
  choice: dumating mula sa Sinai
  rationale: Inilalarawan ng pandiwa ang maringal na pagdating o pagpapakita ni Yahweh, habang pinananatili ng “mula sa” ang direksiyon ng Hebreo.
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: sumikat siya mula sa Seir sa ibabaw nila
  rationale: Ang זרח ay karaniwang tumutukoy sa pagsikat o pagliwanag, gaya ng araw. Ipinahihiwatig ng “sa ibabaw nila” ang liwanag na sumisikat sa bayan.
- source_word: הוֹפִיעַ
  choice: nagliwanag siya
  rationale: Ipinapanatili nito ang larawan ng maningning na pagpapakita sa anyong likas sa makabagong Tagalog.
- source_word: מֵהַר פָּארָן
  choice: mula sa Bundok Paran
  rationale: Tuwirang isinasalin ang הַר bilang “Bundok” at pinananatili ang pangalang Paran.
- source_word: וְאָתָה
  choice: at dumating
  rationale: Pinananatili ang magkakatulad na mga pandiwa ng banal na pagdating sa tula.
- source_word: מֵרִבְבֹת קֹדֶשׁ
  choice: mula sa laksa-laksang kabanalan
  rationale: Sadyang pormal at bukas ang parirala upang huwag agad pagpasyahan kung ang קֹדֶשׁ ay abstraktong “kabanalan” o tumutukoy sa mga banal na nilalang; inilalahad sa talababa ang karaniwang alternatibo.
- source_word: מִימִינוֹ
  choice: mula sa kanyang kanang kamay
  rationale: Ang מִן ay likas na “mula sa,” kaya inilalarawan ang bagay na nagmumula sa kanang kamay ni Yahweh.
- source_word: אשדת
  choice: ang nagliliyab na kautusan
  rationale: Sinusunod nito ang tradisyonal na pagkaunawa sa mahirap na anyong Hebreo bilang “maapoy na kautusan,” ngunit ginawang mas natural sa Tagalog at malinaw na minarkahan ang katiyakan nito sa talababa.
- source_word: לָמוֹ
  choice: para sa kanila
  rationale: Ipinahahayag ang ikatlong panauhang maramihan at ang pagbibigay ng kautusan para sa bayan.
theological_decisions:
- issue: Pagkakakilanlan ng banal na paksa sa makatang pagpapakita
  choice: Tahasang pinangalanan ang paksa bilang Yahweh ayon sa tekstong Hebreo.
  alternative: Basahin ang talata bilang tuwirang pagtukoy sa isang pagpapakita ni Cristo.
  rationale: Inilalarawan ng talata ang pagpapakita ni Yahweh kaugnay ng Sinai, Seir, at Paran. Hindi idinaragdag sa salin ang isang mas huling kristolohikal na pagbasa.
- issue: Kahulugan ng מֵרִבְבֹת קֹדֶשׁ
  choice: Pinanatili sa pangunahing teksto ang pormal na “laksa-laksang kabanalan.”
  alternative: “laksa-laksang mga banal” o “di-mabilang na mga banal na nilalang”
  rationale: Maaaring tumukoy ang parirala sa kabanalan o sa mga banal na tagapaglingkod. Hindi tahimik na nilulutas ng salin ang tunay na kalabuan.
- issue: Kahulugan ng אשדת
  choice: Ginamit ang tradisyonal na “nagliliyab na kautusan,” na may talababa tungkol sa kawalang-katiyakan.
  alternative: “nagliliyab na apoy,” “mga kislap ng apoy,” o apoy na nagmumula sa kanyang kanang kamay
  rationale: Napakahirap at malamang na may suliranin ang anyong Hebreo. Ang tradisyonal na pagbasa ay angkop sa konteksto ng Sinai, ngunit hindi ito dapat iharap na tiyak.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at patula, ngunit madaling maunawaan. Ginamit ang maiikling linyang patula upang maipakita ang magkakatulad na larawan ng pagdating, pagsikat, at pagliwanag. Ang “laksa-laksa” ay isang pamilyar at marangal na paraan upang ipahiwatig ang napakaraming bilang.
