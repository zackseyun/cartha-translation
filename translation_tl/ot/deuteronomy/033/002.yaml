  to: 'At sinabi niya:


    “Dumating si Yahweh mula sa Sinai;

    sumikat siya mula sa Seir sa kanila.

    Nagliwanag siya mula sa Bundok Paran,

    at dumating mula sa laksa-laksang kabanalan.[a]

    Mula sa kanyang kanang kamay

    ay dumating para sa kanila ang nagliliyab na kautusan.”[b]'
  rationale: Pinalitan lamang ang di-likas na “sa ibabaw nila” ng “sa kanila” upang maging idiomatiko ang Tagalog habang pinananatili ang tinutukoy ng Hebreong לָמוֹ. Walang binagong interpretasyon sa mga pinagtatalunang pariralang מֵרִבְבֹת קֹדֶשׁ at אשדת; nananatili ang kanilang kalabuan at ang mga kaugnay na talababa.
