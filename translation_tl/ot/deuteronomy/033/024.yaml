  to: 'At tungkol kay Asher, sinabi niya:


    “Si Asher ang pinakapinagpala sa mga anak na lalaki[a];


    nawa’y kalugdan siya ng kanyang mga kapatid[b],


    at nawa’y ilubog niya ang kanyang paa sa langis.”[c]'
  rationale: Idinagdag ang “nawa’y” sa huling linya upang malinaw na maipakita ang magkakaugnay na diwa ng pagpapala sa Hebreo. Inayos din ang ayos ng mga salita para sa mas likas na modernong Tagalog, habang pinanatili ang isahang “paa,” ang literal na “langis,” at ang di-tiyak na saklaw ng paghahambing sa unang linya.
