base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: tl
  text: 'At tungkol kay Asher, sinabi niya:


    “Si Asher ang pinakapinagpala sa mga anak na lalaki[a];


    nawa’y kalugdan siya ng kanyang mga kapatid[b],


    at nawa’y ilubog niya ang kanyang paa sa langis.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari rin: “Pinagpala nang higit sa mga anak na lalaki si Asher.” Maaaring unawain ang paghahambing sa Hebreo bilang pahambing o pasukdol.'
    reason: lexical_alternative
  - marker: b
    text: Ang “kanyang mga kapatid” ay malamang na tumutukoy sa iba pang mga lipi ng Israel.
    reason: cultural_note
  - marker: c
    text: Ang larawang “ilubog niya ang kanyang paa sa langis” ay malamang na nagpapahiwatig ng kasaganaan o kaunlaran, ngunit pinanatiling literal ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר אָמַר
  choice: At tungkol kay Asher ay sinabi niya
  rationale: Ipinakikilala ng לְ ang susunod na pagpapala para sa isang lipi. Likas sa modernong Tagalog ang “tungkol kay Asher,” samantalang pinananatili ng “sinabi niya” ang payak na pormula ng pagsasalaysay.
- source_word: בָּרוּךְ מִבָּנִים אָשֵׁר
  choice: Si Asher ang pinakapinagpala sa mga anak na lalaki
  rationale: Maaaring magkaroon ng pahambing o pasukdol na diwa ang מִן sa pariralang ito. Ang “pinakapinagpala sa” ay malinaw at likas, habang ipinapakita sa talababa ang tunay na alternatibong pagbasa.
- source_word: יְהִי רְצוּי אֶחָיו
  choice: nawa'y kalugdan siya ng kanyang mga kapatid
  rationale: Ang יְהִי ay may diwang paghiling sa konteksto ng pagpapala. Ang רְצוּי ay tumutukoy sa pagiging katanggap-tanggap o kinalulugdan; ang “kalugdan” ay natural, marangal, at nagpapanatili sa relasyonal na diwa.
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  choice: at ilubog niya sa langis ang kanyang paa
  rationale: Pinananatili ang kongkretong larawan, ang isahang “paa,” at ang diwa ng pagpapalang kaagapay ng naunang paghiling. Hindi idinaragdag sa pangunahing teksto ang interpretasyong kasaganaan.
theological_decisions:
- issue: Diwa ng larawang “ilubog sa langis ang kanyang paa”
  choice: Panatilihing literal ang talinghaga sa pangunahing teksto.
  alternative: Ipaliwanag ito bilang kasaganaan sa langis ng olibo, kaunlaran, o marangyang kalagayan.
  rationale: Matingkad ngunit hindi ganap na ipinaliliwanag ng Hebreo ang larawan. Ang literal na salin ay nagpapanatili sa makatang kalabuan at umiiwas sa pagtakda ng iisang simbolikong kahulugan.
- issue: Pahambing o pasukdol na diwa ng בָּרוּךְ מִבָּנִים
  choice: Gamitin sa teksto ang pasukdol na “pinakapinagpala sa mga anak na lalaki.”
  alternative: “Pinagpala nang higit sa mga anak na lalaki si Asher.”
  rationale: Kapuwa maaaring suportahan ng anyong Hebreo ang pahambing at pasukdol. Pinili ang natural na pasukdol sa Tagalog at pinanatili sa talababa ang pahambing na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang maikling paralelismong patula, ang pananalitang pampagpapala na “nawa'y,” at ang literal na larawang langis at paa nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
