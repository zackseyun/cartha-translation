id: DEU.33.11
reference: Deuteronomy 33:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: tl
  text: Pagpalain mo, Yahweh, ang kanyang lakas[a], at tanggapin mo ang gawa ng kanyang mga kamay. Durugin mo ang mga balakang[b] ng mga bumabangon laban sa kanya at ng mga napopoot sa kanya, upang hindi na sila makabangon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanyang kayamanan” o “kanyang hukbo.” Ang salitang Hebreo ay maaaring tumukoy sa lakas, mga ari-arian, kakayahan, o puwersang militar.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga balakang.” Sa Hebreong larawan, ang balakang ay kaugnay ng lakas; ang pagdurog dito ay larawan ng ganap na paggapi.
    reason: cultural_note
  - marker: c
    text: Masinsin ang Hebreo at literal na mababasa na “mula sa pagbangon.” Malamang na ipinahihiwatig nito na hindi na muling makababangon ang mga kaaway.
    reason: textual_clarity
lexical_decisions:
- source_word: בָּרֵךְ
  choice: Pagpalain mo
  rationale: Tuwirang pautos na nakatuon kay Yahweh. Pinananatili ng “pagpalain” ang pangunahing diwa nang hindi ito nililimitahan sa pagpapayaman o pagtatagumpay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: חֵילוֹ
  choice: ang kanyang lakas
  rationale: Maaaring tumukoy ang חַיִל sa lakas, kayamanan, kakayahan, o hukbo. Ang “lakas” ang pinakamalawak at pinakamaingat na katumbas sa kontekstong ito.
- source_word: וּפֹעַל יָדָיו
  choice: ang gawa ng kanyang mga kamay
  rationale: Pinananatili ang kongkretong Hebreong larawan para sa kanyang gawain o paglilingkod.
- source_word: תִּרְצֶה
  choice: tanggapin mo
  rationale: Sa konteksto ng paglilingkod ni Levi, humihiling ito ng pagsang-ayon at pagtanggap ng Diyos. Likas sa Filipino ang “tanggapin mo” at hindi nito labis na tinutukoy ang uri ng gawain.
- source_word: מְחַץ
  choice: Durugin mo
  rationale: Pinananatili ang marahas at mariing lakas ng pandiwang nangangahulugang dumurog o bumuwag.
- source_word: מָתְנַיִם
  choice: ang mga balakang
  rationale: Literal itong tumutukoy sa mga balakang, isang Hebreong larawang kaugnay ng lakas. Pinanatili ang matinding patulang talinghaga sa pangunahing teksto.
- source_word: קָמָיו
  choice: mga bumabangon laban sa kanya
  rationale: Pinananatili ang pandiwang larawan ng mga kalabang tumitindig o bumabangon laban sa kanya.
- source_word: וּמְשַׂנְאָיו
  choice: mga napopoot sa kanya
  rationale: Tuwirang ipinahahayag ng participle ang personal na pagkapoot, hindi lamang pangkalahatang pagsalungat.
- source_word: מִן יְקוּמוּן
  choice: upang hindi na sila makabangon
  rationale: Masinsin at eliptikal ang Hebreo. Ipinapahayag ng salin ang malamang na resultang diwa—ang lubos na pagkadurog ng mga kaaway kaya hindi na sila makababangon—habang itinatala sa talababa ang literal na anyo.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na “kanya” at “siya”
  choice: Pinanatili ang isahang panghalip na tumutukoy kay Levi sa agarang konteksto.
  alternative: Maaaring unawain bilang pagtukoy sa kinatawang pari o sa sama-samang paglilingkod ng lipi ni Levi.
  rationale: Ang talata ay bahagi ng pagpapala kay Levi sa Deuteronomio 33:8–11. Pinananatili ng isahang panghalip ang anyo ng Hebreo nang hindi ipinapasok sa pangunahing teksto ang isang mas tiyak na interpretasyon.
- issue: Diwa ng huling pariralang מִן יְקוּמוּן
  choice: 'Isinalin bilang bunga: “upang hindi na sila makabangon.”'
  alternative: Mas literal na “mula sa pagbangon,” o mas mariing “nang hindi na sila kailanman bumangon.”
  rationale: Eliptikal ang konstruksiyon at sumusunod sa utos na durugin ang mga kalaban. Ang piniling salin ay malinaw sa Filipino ngunit hindi dinaragdagan ng “kailanman,” na maaaring maging mas tiyak kaysa sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang lakas ng pagpapala, ang personal na pangalang “Yahweh,” at ang kongkretong larawang “mga balakang,” habang ipinaliwanag sa mga talababa ang mahahalagang alternatibong leksikal at ang eliptikal na hulihan.
