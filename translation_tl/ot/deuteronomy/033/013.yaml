  text: וּ/לְ/יוֹסֵ֣ף אָמַ֔ר מְבֹרֶ֥כֶת יְהֹוָ֖ה אַרְצ֑/וֹ מִ/מֶּ֤גֶד שָׁמַ֨יִם֙ מִ/טָּ֔ל וּ/מִ/תְּה֖וֹם רֹבֶ֥צֶת תָּֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: tl
  text: 'At tungkol kay Jose ay sinabi niya:


    “Pagpalain nawa ni Yahweh ang lupain ni Jose

    ng pinakamainam na mula sa langit[a],

    ng hamog,

    at ng kalalimang nakahimlay sa ilalim[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ng mahahalagang bagay na mula sa langit.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kalaliman” ay malamang na tumutukoy sa malalim na tubig sa ilalim ng lupa na nagbibigay ng tubig sa lupain.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף
  choice: At tungkol kay Jose
  rationale: Sa pormula ng mga pagpapala sa mga lipi, ang לְ ay likas na naipapahayag sa Tagalog bilang “tungkol kay”; pinananatili rin ng “At” ang pagkakaugnay nito sa naunang mga pagpapala.
- source_word: אָמַר
  choice: ay sinabi niya
  rationale: Payak at likas na salin ng karaniwang pandiwang אמר, habang pinananatili ang balangkas ng tuwirang pananalita.
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: Pagpalain nawa ni Yahweh ang kanyang lupain
  rationale: Ipinahahayag ng anyong participle ang pagpapala sa kontekstong ito. Ang “Pagpalain nawa” ay likas na pormula ng basbas sa Tagalog at hindi ginagawang karaniwang salaysay lamang ang pahayag.
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: sa pinakamainam na nagmumula sa langit
  rationale: Ang מֶגֶד ay tumutukoy sa mahalaga, mainam, o piling kasaganaan. Pinananatili ng “pinakamainam” ang malawak na kahulugan nang hindi tiyakang dinaragdagan ng “kaloob” o “bunga.”
- source_word: מִטָּל
  choice: sa hamog
  rationale: Ang hamog ay isa sa mga pinagmumulan o sangkap ng pagpapala sa lupain; ang “sa” ay natural na nag-uugnay sa sunod-sunod na pariralang may מן.
- source_word: וּמִתְּהוֹם
  choice: at sa kalaliman
  rationale: Ang תְּהוֹם ay malalim na katubigan o kalaliman. Ang “kalaliman” ay nagpapanatili sa matalinghagang lawak ng salita nang hindi ito agad pinapakahulugang isang doktrinal na “bangin.”
- source_word: רֹבֶצֶת תָּחַת
  choice: nakahimlay sa ilalim
  rationale: Ang participle ay literal na naglalarawan ng paghimlay o pagyukod sa ibaba. Ang “nakahimlay sa ilalim” ay malinaw at marangal na Tagalog na nagpapanatili sa buhay na larawan ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa pahayag bilang basbas o bilang deklarasyon
  choice: Pagpalain nawa ni Yahweh ang kanyang lupain
  alternative: Pinagpala ni Yahweh ang kanyang lupain
  rationale: Maaaring basahin ang predicative participle bilang kalagayang ipinahahayag, ngunit dahil bahagi ito ng pormal na basbas ni Moises, ang anyong “Pagpalain nawa” ang mas likas sa Tagalog habang hindi itinatangging may deklaratibong himig ang Hebreo.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Kahulugan ng תְּהוֹם sa konteksto
  choice: kalaliman
  alternative: malalim na tubig sa ilalim ng lupa
  rationale: Pinananatili sa pangunahing teksto ang mas malawak at matalinghagang salita. Inilalagay sa talababa ang malamang na heograpikong tinutukoy upang hindi gawing labis na tiyak ang salin.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang ayos na patula ay sumusunod sa mga magkakapantay na parirala ng Hebreo. Iniwasan ang teknikal o denominasyonal na pananalita, at pinanatili ang larawan ng langit, hamog, at kalalimang nasa ilalim.
