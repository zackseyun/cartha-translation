  to: 'At tungkol kay Jose ay sinabi niya:


    “Pagpalain nawa ni Yahweh ang lupain ni Jose

    ng pinakamainam na mula sa langit[a],

    ng hamog,

    at ng kalalimang nakahimlay sa ilalim[b].”'
  rationale: Pinalitan ang mga panandang “sa” ng “ng” upang maipakita ang magkakatulad na mga kaloob o pinagmumulan ng pagpapala sa Hebreo. Nilinaw ang “kanyang lupain” bilang “lupain ni Jose.” Hindi binago ang optatibong anyo ng basbas, ang pangalang Yahweh, o ang maingat na hindi labis na tiyak na “kalaliman.”
