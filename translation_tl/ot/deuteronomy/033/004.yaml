  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: tl
  text: 'Isang kautusan ang iniutos sa atin ni Moises—

    isang mana ng kapulungan ni Jacob.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Iniutos sa atin ni Moises ang isang kautusan, ang mana ng kapulungan ni Jacob.” Siksik ang sintaks ng Hebreo, at maaaring iugnay nang tuwiran ang “mana” sa “kautusan.”'
    reason: alternative_reading
  - marker: b
    text: Ang “kautusan” ay maaari ring isaling “pagtuturo,” at ang “mana” ay maaari ring isaling “pamanang pag-aari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: kautusan
  rationale: Maaaring tumukoy ang תּוֹרָה sa pagtuturo o, gaya rito sa konteksto ng tipan at ni Moises bilang tagapamagitan, sa kautusang ibinigay sa bayan. Ang “kautusan” ay natural at malinaw sa modernong Filipino; hindi ginamit ang transliterasyong “Torah” para sa karaniwang pangngalan.
- source_word: צִוָּה
  choice: iniutos
  rationale: Pinananatili nito ang awtoritatibong lakas ng pandiwang צוה, sa halip na palambutin bilang “ibinigay.”
- source_word: לָנוּ
  choice: sa atin
  rationale: Ang ל ay maaaring “sa” o “para sa.” Sa konstruksiyong “iniutos sa atin,” natural na ipinahahayag ng “sa atin” ang mga tumanggap at inatasan ng kautusan.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang Moses sa Filipino.
- source_word: מוֹרָשָׁה
  choice: mana
  rationale: Tumutukoy ang מוֹרָשָׁה sa pag-aaring tinanggap bilang minanang bahagi. Ang “mana” ay payak at konkreto, at pinananatili ang diwa ng tipan.
- source_word: קְהִלַּת
  choice: kapulungan ni
  rationale: Ipinahahayag ng “kapulungan” ang sama-samang bayan o komunidad nang hindi nag-aangkat ng mas huling institusyunal na kahulugan ng “iglesia.”
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Tahasang “Jacob” ang Hebreo, kaya hindi ito pinalitan ng interpretatibong “Israel.”
theological_decisions:
- issue: Ugnayang sintaktiko ng תּוֹרָה at מוֹרָשָׁה
  choice: 'Inilalahad ang ikalawang linya bilang paglalarawan sa kautusan: ito ay mana para sa kapulungan ni Jacob.'
  alternative: “Iniutos sa atin ni Moises ang isang kautusan, ang mana ng kapulungan ni Jacob.”
  rationale: Siksik ang sintaks ng Hebreo at walang pandiwa ang ikalawang hati. Pinananatili ng dash at paghahati sa dalawang linyang patula ang malapit na apposisyon nang hindi lubusang nilulutas kung hiwalay na pahayag o tuwirang appositive ang “mana.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang patulang ikli at parallelism sa dalawang linya. Ginamit ang “kapulungan” sa halip na “kongregasyon” upang maging natural at maiwasan ang labis na institusyunal na tunog.
