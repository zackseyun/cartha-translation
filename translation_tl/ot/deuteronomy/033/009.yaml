source:
  edition: WLC
  text: הָ/אֹמֵ֞ר לְ/אָבִ֤י/ו וּ/לְ/אִמּ/וֹ֙ לֹ֣א רְאִיתִ֔י/ו וְ/אֶת אֶחָי/ו֙ לֹ֣א הִכִּ֔יר וְ/אֶת בנ/ו לֹ֣א יָדָ֑ע כִּ֤י שָֽׁמְרוּ֙ אִמְרָתֶ֔/ךָ וּ/בְרִֽיתְ/ךָ֖ יִנְצֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: tl
  text: na nagsabi tungkol sa kanyang ama at ina,[a] “Hindi ko siya pinansin,” at hindi kumilala sa kanyang mga kapatid na lalaki ni kumilala sa kanyang mga anak na lalaki; sapagkat tinupad nila ang iyong salita at iningatan ang iyong tipan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Hindi ko siya nakita.” Sa kontekstong ito, malamang na ang diwa ay “Hindi ko siya itinuring” o “Hindi ko siya pinansin,” yamang inuuna ang katapatan sa tipan kaysa sa ugnayang pampamilya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: na nagsabi
  rationale: Ang substantival participle ay gumaganap bilang kaugnay na sugnay tungkol kay Levi; natural sa Tagalog ang “na nagsabi.”
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: tungkol sa kanyang ama at ina
  rationale: Maaaring ipakilala ng לְ kasama ng אמר ang taong tinutukoy o kinakausap. Ang “tungkol sa” ay umaangkop sa kasunod na pahayag at hindi nagpapasya nang labis sa sintaktikong posibilidad.
- source_word: לֹא רְאִיתִיו
  choice: Hindi ko siya pinansin
  rationale: Literal itong “Hindi ko siya nakita,” ngunit sa konteksto ay tumutukoy sa hindi pagbibigay-pansin o pagkilala sa pag-aangkin ng kamag-anak dahil sa katapatan sa tipan. Pinananatili sa talababa ang literal na anyo.
- source_word: הִכִּיר
  choice: kumilala
  rationale: Ang Hiphil ng נכר ay nagpapahiwatig ng pagkilala o pagturing sa isang ugnayan; ang “kumilala” ay malinaw at likas sa Tagalog.
- source_word: אֶחָיו
  choice: kanyang mga kapatid
  rationale: Ang Hebreo ay panlalaking maramihan na maaaring tumukoy sa mga kapatid na lalaki; sa karaniwang Tagalog, likas ang “mga kapatid,” habang hindi kailangang magdagdag ng kasariang hindi karaniwang ipinahahayag sa salitang Tagalog.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na “mga anak na lalaki” ang panlalaking maramihan sa Hebreo, kaya pinananatili ang espesipikong kasarian.
- source_word: יָדָע
  choice: kumilala
  rationale: Bagaman pangunahing nangangahulugang “malaman” o “makilala,” relational ang diwa rito at kapantay ng naunang pagtangging kumilala. Mas natural sa Filipino ang “kumilala” kaysa “malaman ang kanyang mga anak.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pagtanggi sa mga pag-aangkin ng pamilya; ang “sapagkat” ay marangal at malinaw.
- source_word: שָׁמְרוּ
  choice: tinupad
  rationale: Ang שׁמר ay maaaring “ingatan” o “sundin.” Sa kaugnayan sa salita ng Diyos, malinaw na ipinahahayag ng “tinupad” ang pagsunod at iniiwasan ang mekanikal na pag-uulit sa kasunod na pandiwa.
- source_word: אִמְרָתֶךָ
  choice: iyong salita
  rationale: Hindi ito labis na nililimitahan bilang isang partikular na utos at natural na katumbas ng אמרה.
- source_word: בְּרִיתְךָ
  choice: iyong tipan
  rationale: Ang “tipan” ang pamantayan at malinaw na salin ng ברית sa kontekstong biblikal.
- source_word: יִנְצֹרוּ
  choice: iningatan
  rationale: Ang נצר ay may diwa ng maingat na pagbabantay o pag-iingat. Ang “iningatan” ay nagpapanatili ng kaibhan nito sa naunang שׁמר.
theological_decisions:
- issue: Ang tinutukoy ng isahan at maramihang anyo sa talata
  choice: Pinanatili ang paglipat mula sa kumakatawang isahan tungkol kay Levi tungo sa maramihang “nila” tungkol sa mga Levita.
  alternative: Gawing pare-parehong isahan ang buong talata, o gawing pare-parehong maramihan bilang tuwirang pagtukoy sa tribo.
  rationale: Sadyang lumilipat ang Hebreo mula sa mga anyong isahan sa kaugnay na sugnay patungo sa maramihang mga pandiwa sa dahilan. Hindi ito pinakinis upang mapanatili ang kolektibo at kumakatawang paglalarawan kay Levi.
- issue: Katapatan sa tipan laban sa mga pag-aangkin ng pinakamalapit na pamilya
  choice: Isinalin ang mga pandiwa bilang pagtangging pansinin o kilalanin ang ugnayang pampamilya sa kontekstong ito.
  alternative: Unawain lamang ang mga pandiwa bilang literal na hindi pagkakita o hindi pagkakilala sa mukha.
  rationale: Ipinapakita ng magkakatulad na sugnay at ng ibinigay na dahilan—pagtupad sa salita at pag-iingat sa tipan—na covenant loyalty ang diin, ngunit inilalahad sa talababa ang literal na kahulugan ng ראה upang hindi maitago ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sapagkat” at “tipan” para sa biblikal na rehistro, habang pinanatiling likas ang ayos ng pangungusap. Ang marker na [a] ay nasa pangunahing teksto at tumutugma sa talababa.
