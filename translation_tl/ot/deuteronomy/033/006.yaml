  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: tl
  text: Mabuhay nawa si Ruben at huwag siyang mamatay, at maging kakaunti nawa ang mga tao niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at mabilang nawa ang mga tao niya.” Mahirap unawain ang Hebreo sa huling sugnay. Maaari rin itong unawain bilang panalangin na huwag maging walang kabuluhan si Ruben o maalis sa bilang ng mga lipi.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: Mabuhay nawa
  rationale: Ang Qal jussive ng חיה ay nagpapahayag ng hangarin o pagpapala. Likas sa makabagong Tagalog ang “Mabuhay nawa” at pinananatili nito ang puwersang bolitibo.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: וְאַל יָמֹת
  choice: at huwag mamatay
  rationale: Ang אַל kasama ng jussive ay negatibong hangarin. Tuwirang ipinapahayag ng “huwag mamatay” ang payak na kahulugan ng מות at natural itong kaugnay ng naunang pagpapala.
- source_word: וִיהִי
  choice: at maging ... nawa
  rationale: Ang ikalawang jussive ay isa pang hangarin o pagpapala; pinananatili ng “maging ... nawa” ang kaagapay na estruktura.
- source_word: מְתָיו
  choice: ang kanyang mga tauhan
  rationale: Mahirap ang salita sa talatang ito, ngunit malamang na tumutukoy sa mga lalaki o mga kabilang sa lipi, hindi sa “mga patay.” Ang “mga tauhan” ay malinaw at likas sa Tagalog habang naitatala sa talababa ang kahirapan ng buong parirala.
- source_word: מִסְפָּר
  choice: kakaunti
  rationale: Literal itong “bilang,” ngunit sa konstruksiyong kasama ng היה ay malamang na nangangahulugang kakaunti o kayang bilangin. Ang “kakaunti” ang pinakanatural na pagpapahayag ng malamang na diwa, habang pinananatili sa talababa ang alternatibong pagbasa.
theological_decisions:
- issue: Pagpapakahulugan sa huling sugnay na וִיהִי מְתָיו מִסְפָּר
  choice: “at maging kakaunti nawa ang kanyang mga tauhan,” isang pagpapalang humihiling na manatili si Ruben kahit maliit ang bilang
  alternative: “at mabilang nawa ang kanyang mga tauhan,” na maaaring mangahulugang huwag siyang mawala o maalis sa talaan ng mga lipi
  rationale: Maikli at mahirap ang tekstong Masoretiko. Ang pinakatuwirang pagbasa sa מִסְפָּר kasama ng היה ay “kakaunti/kayang bilangin.” Gayunman, tunay ang kalabuan at may matagal nang alternatibong pagbasa na tumutukoy sa pagkabilang sa talaan; kaya hindi ito tahimik na nilulutas kundi itinatala sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “nawa” upang ipakita ang anyong pagpapala ng mga jussive; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto at inilagay sa talababa ang tunay na kalabuan ng huling sugnay.
