base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: tl
  text: 'At ito ang sinabi niya tungkol kay Juda:


    “Yahweh, dinggin mo ang tinig ni Juda,

    at dalhin mo siya sa kanyang bayan.

    Ipaglaban siya ng kanyang mga kamay,[a]

    at tulungan mo siya laban sa kanyang mga kaaway.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nawa’y maging sapat para sa kanya ang kanyang mga kamay.” Mahirap unawain ang pariralang Hebreo at maaari itong basahin sa mahigit isang paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה וַיֹּאמַר
  choice: At ito ang sinabi niya tungkol kay Juda
  rationale: Likas na panimula sa susunod na pagpapala; ang לְ ay nagsasaad ng paksa o taong tinutukoy.
- source_word: שְׁמַע יְהוָה קוֹל יְהוּדָה
  choice: Yahweh, dinggin mo ang tinig ni Juda
  rationale: Pinananatili ang tuwirang panawagan kay Yahweh at ang konkretong larawan ng קוֹל bilang “tinig,” nang hindi ito nililimitahan sa “daing.”
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: at ibalik mo siya sa kanyang bayan
  rationale: Sa konteksto ng panalangin para sa Juda at ng pakikidigma, natural sa Tagalog ang “ibalik,” bagaman literal na “dalhin siya sa kanyang bayan”; ipinahihiwatig nito ang ligtas na pagbabalik nang hindi dinaragdagan ang layon.
- source_word: יָדָיו רָב לוֹ
  choice: Ipaglaban siya ng kanyang mga kamay
  rationale: Ang masalimuot na parirala ay inuunawa mula sa diwang pakikipaglaban o pagpupunyagi. Pinananatili ang “mga kamay” at ang kontekstong militar, habang inilalagay sa talababa ang ibang posibleng pagbasa.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: at tulungan mo siya laban sa kanyang mga kaaway
  rationale: Ang ikalawang panauhan ay tumutukoy kay Yahweh; ang מִן ay natural na nagpapahayag dito ng tulong laban sa mga kalaban.
theological_decisions:
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang personal na pangalan sa tekstong Hebreo at pinananatili ito bilang “Yahweh” alinsunod sa patakaran ng proyekto.
- issue: Kahulugan ng יָדָיו רָב לוֹ
  choice: Ipaglaban siya ng kanyang mga kamay
  alternative: Nawa’y maging sapat para sa kanya ang kanyang mga kamay
  rationale: Malabo at siksik ang Hebreo. Ang pangunahing salin ay umaangkop sa konteksto ng mga kaaway, ngunit hindi itinatago ang tunay na alternatibong pagbasa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “bayan” para sa עַם bilang kolektibong sambayanan, “tinig” upang mapanatili ang larawan ng Hebreo, at “mga kaaway” bilang karaniwang katumbas ng mga kalaban. Nasa pangunahing teksto ang marker na [a].
