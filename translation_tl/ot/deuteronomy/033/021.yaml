id: DEU.33.21
reference: Deuteronomy 33:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: tl
  text: Pinili niya para sa sarili ang pinakamainam na lupain[a], sapagkat doon inilaan ang bahagi ng pinuno. Dumating siyang kasama ng mga pinuno ng bayan; isinagawa niya ang katuwiran ni Yahweh[b] at ang Kanyang mga hatol, kasama ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pangunahing bahagi para sa sarili.” Maaari ring ipahiwatig ng Hebreo ang una o piling bahagi ng lupain. Ang salitang isinaling “pinuno” ay maaari ring mangahulugang “tagapagbigay ng kautusan”; may ilang nagpapalagay na tumutukoy ito kay Moises.
    reason: alternative_reading
  - marker: b
    text: O “ang katarungan ni Yahweh” o “ang matuwid na mga gawa ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Pinili niya
  rationale: Bagaman literal na “nakita,” ang pariralang “nakita para sa sarili” ay idiomatikong tumutukoy sa pagpili.
- source_word: רֵאשִׁית
  choice: ang pinakamainam na lupain
  rationale: Sa konteksto ng takdang lupain ni Gad, tumutukoy ito sa pangunahin o piling bahagi, hindi lamang sa temporal na “simula.”
- source_word: חֶלְקַת
  choice: ang bahagi
  rationale: Tumutukoy ito sa takdang bahagi o mana sa lupain.
- source_word: מְחֹקֵק
  choice: pinuno
  rationale: Maaaring mangahulugang pinuno o tagapagbigay ng kautusan. Pinananatili ng “pinuno” ang pangkalahatang diwa nang hindi tiyak na kinikilalang si Moises ang tinutukoy.
- source_word: סָפוּן
  choice: inilaan
  rationale: Ipinahihiwatig ng anyo na ang bahagi ay ibinukod o itinabi.
- source_word: וַיֵּתֵא
  choice: Dumating siya
  rationale: Naglalarawan ito ng pagkilos o pagdating kasama ng mga pinuno ng bayan.
- source_word: רָאשֵׁי עָם
  choice: mga pinuno ng bayan
  rationale: Natural na Tagalog para sa literal na “mga ulo ng bayan,” na tumutukoy sa mga lider o pangulo nito.
- source_word: צִדְקַת יְהוָה
  choice: ang matuwid na kalooban ni Yahweh
  rationale: Ipinahahayag nito ang katuwiran ni Yahweh na isinagawa sa gawa, habang pinananatili ang maaaring diwa ng katuwiran, katarungan, o matuwid na mga gawa.
- source_word: וּמִשְׁפָּטָיו
  choice: ang Kanyang mga hatol
  rationale: Direktang tumutukoy sa mga pasiya o tuntuning hatol ni Yahweh.
- source_word: עִם יִשְׂרָאֵל
  choice: kasama ng Israel
  rationale: Pinananatili ang tuwirang kahulugan ng pang-ukol at ang diwang kumilos si Gad kasabay ng Israel.
theological_decisions:
- issue: Pagkakakilanlan at kahulugan ng מְחֹקֵק
  choice: Isinaling pangkalahatan bilang “pinuno.”
  alternative: “tagapagbigay ng kautusan,” na maaaring ipakahulugang tumutukoy kay Moises
  rationale: Masiksik at pinagtatalunan ang pariralang Hebreo. Hindi tahasang hinihingi ng teksto ang pagkilala sa isang tiyak na tao, kaya hindi iyon ipinilit sa salin.
- issue: Saklaw ng צִדְקַת יְהוָה
  choice: “ang matuwid na kalooban ni Yahweh”
  alternative: “ang katarungan ni Yahweh” o “ang matuwid na mga gawa ni Yahweh”
  rationale: Pinananatili ng salin ang ugnayan sa katuwiran ni Yahweh ngunit ipinapakitang ito ay isang bagay na isinagawa, nang hindi lubusang nilulutas ang leksikal na lawak ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” upang katawanin ang banal na pangalang יהוה. Iniwasan ang sobrang literal na “mga ulo ng bayan” alang-alang sa likas na Tagalog, habang pinanatili ang matimbang na himig ng patula at tipanang pananalita.
