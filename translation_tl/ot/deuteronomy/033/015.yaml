lexical_decisions:
- source_word: מֵרֹאשׁ
  choice: mula sa pinakamainam na bunga ng
  rationale: Maaaring tumukoy ang רֹאשׁ sa literal na “tuktok” o sa “pinakamainam.” Sa konteksto ng pagpapala at kaagapay ng מֶגֶד, mas malamang dito ang kwalitatibong diwa; idinagdag ang “bunga” bilang likas na Tagalog na pagpapahayag ng biyayang nagmumula sa mga bundok.
- source_word: הַרְרֵי
  choice: mga bundok
  rationale: Tuwirang salin ng maramihang anyong construct ng הַר, at pinananatiling naiiba sa kasunod na גִּבְעוֹת, “mga burol.”
- source_word: קֶדֶם
  choice: noong unang panahon
  rationale: Bagaman maaari itong mangahulugang “silangan,” mas angkop dito ang temporal na diwa dahil sa patulang pagkapares nito sa עוֹלָם.
- source_word: מִמֶּגֶד
  choice: mula sa masaganang bunga ng
  rationale: Ang מֶגֶד ay tumutukoy sa mahalaga o saganang ani/bunga. Ang “masaganang bunga” ay malinaw at natural sa modernong Tagalog habang pinananatili ang diwa ng mayamang biyaya.
- source_word: גִּבְעוֹת
  choice: mga burol
  rationale: Karaniwang kahulugan ng גִּבְעָה at malinaw na ikinaiiba sa “mga bundok” sa unang hati.
- source_word: עוֹלָם
  choice: walang hanggan
  rationale: Pinananatili ang mataas at patulang lakas ng salitang nagsasaad ng walang takdang tagal, bagaman maaari rin nitong ipahiwatig ang napakatandang panahon.
