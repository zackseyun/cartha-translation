  source_fidelity: 'Tumpak ang pangunahing larawan at mga termino: ang panganay na toro, mga sungay ng ligaw na bovine, pagsuwag, mga bayan, mga dulo ng lupa, at ang bilang ng Efraim at Manases. Gayunman, ang “ang sama-sama” ay mali ang kayarian at hindi naisasalin nang malinaw ang יַחְדָּו.'
  naturalness: Marangal at makata ang kabuuang rehistro. Ang “ligaw na toro” ay mas tuwirang katumbas at mas likas kaysa “mailap na toro” para sa רְאֵם. Ang paglalagay ng “nang sabay-sabay” sa pandiwa ay nagbibigay ng natural na Filipino para sa saklaw na “together/all at once.”
  terminology: Panatilihin ang Efraim at Manases, mga anyong matatag sa Filipino. Ang “sampu-sampung libo” at “libo-libo” ay maayos na naghahayag ng numerikal na parallelismo. Hindi kailangan ng doktrinal na pagpapaliwanag.
  issues:
