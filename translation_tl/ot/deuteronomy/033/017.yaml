    rationale: Ang יַחְדָּו ay pang-abay na naglalarawan sa pagsuwag sa mga bayan. Ang kasalukuyang anyo ay may maling pantukoy at nakalilitong sintaks.
  - severity: low
    issue: “Mailap na toro” ay hindi pinakatumpak na paglalarawan ng רְאֵם.
    rationale: Ang salitang Hebreo ay tumutukoy sa isang ligaw na makapangyarihang bovine; ang “mailap” ay nagdaragdag ng ideyang pagiging mahirap hulihin sa halip na pagiging ligaw.
