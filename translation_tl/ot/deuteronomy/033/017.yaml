  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: tl
  text: 'Ang panganay niyang toro ay maringal;

    ang mga sungay nito ay gaya ng mga sungay ng ligaw na toro.[a]

    Sa pamamagitan ng mga iyon ay sabay-sabay niyang susuwagin ang mga bayan

    hanggang sa mga dulo ng lupa.

    Ang mga ito ang sampu-sampung libo ng Efraim,[b]

    at ang mga ito ang libo-libo ng Manases.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay malamang na tumutukoy sa isang makapangyarihang ligaw na uri ng baka, marahil ang aurochs. Isinasalin itong “unicorn” sa ilang matatandang salin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “laksa-laksa ng Efraim.” Ang salitang Hebreo ay literal na maaaring tumukoy sa mga pangkat na tig-sampung libo at ginagamit din para sa napakalaking bilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: ang panganay niyang toro
  rationale: Pinananatili nito ang konkretong larawan ng panganay na lalaking baka at ang posibilidad na tumutukoy ang talinghaga kay Jose o, nang mas tiyak, sa nangingibabaw niyang inapo.
- source_word: הָדָר לוֹ
  choice: ay maringal
  rationale: Likas at marangal na salin ng nominal na pahayag tungkol sa karilagan o kadakilaan, nang hindi ito pinabibigat sa Filipino.
- source_word: קַרְנֵי רְאֵם
  choice: mga sungay ng mailap na toro
  rationale: Ang רְאֵם ay malamang na isang makapangyarihang ligaw na bovine, hindi isang mitolohikong unicorn. Ang “mailap na toro” ay malinaw at pinananatili ang pagkakaugnay sa larawan ng toro sa unang taludtod.
- source_word: יְנַגַּח
  choice: susuwagin
  rationale: Tiyak na tumutukoy ang pandiwa sa pagsalakay gamit ang sungay; pinananatili ng “susuwagin” ang pisikal na larawan.
- source_word: עַמִּים
  choice: mga bayan
  rationale: Saklaw nito ang maraming pangkat ng mga tao at hindi ipinapalagay na pormal na mga bansang-estado ang tinutukoy.
- source_word: יַחְדָּו
  choice: nang sama-sama
  rationale: Pinananatili ang diwa ng sabay-sabay o sama-samang saklaw ng pagsuwag sa mga bayan.
- source_word: אַפְסֵי אָרֶץ
  choice: hanggang sa mga dulo ng lupa
  rationale: Ito ang likas na makatang idyoma para sa pinakamalalayong bahagi ng daigdig.
- source_word: רִבְבוֹת אֶפְרַיִם
  choice: sampu-sampung libo ng Efraim
  rationale: Ipinakikita nito ang napakalaking bilang at pinananatili ang paghahambing sa “libo-libo” ng Manases.
- source_word: אַלְפֵי מְנַשֶּׁה
  choice: libo-libo ng Manases
  rationale: Mas pinapaboran ng parallelismo sa רִבְבוֹת ang numerikal na kahulugan kaysa sa posibleng kahulugang mga angkan.
- source_word: אֶפְרַיִם / מְנַשֶּׁה
  choice: Efraim / Manases
  rationale: Ginamit ang karaniwang anyo ng mga pangalang ito sa tradisyong biblikal na Filipino.
theological_decisions:
- issue: Ang tiyak na tinutukoy ng larawan ng panganay na toro
  choice: Pinanatiling bukas kung ang larawan ay pangkalahatang tumutukoy kay Jose o mas tiyak kay Efraim bilang pangunahing inapo niya.
  alternative: Tahasang tukuyin ang toro bilang si Efraim.
  rationale: Si Jose ang kausap sa pagpapala, ngunit kinikilala sa huling taludtod ang Efraim at Manases. Hindi tahasang nilulutas ng Hebreo ang ugnayan ng mga tinutukoy, kaya hindi rin ito nilulutas ng salin.
- issue: Ang tinutukoy ng “mga iyon” sa huling dalawang taludtod
  choice: Pinanatili ang panghalip na tumutukoy sa mga sungay at, sa talinghaga, sa napakaraming kabilang sa Efraim at Manases.
  alternative: Idagdag ang “mga mandirigma” upang gawing tahasan ang militar na diwa.
  rationale: Malakas ang militar na larawan ngunit walang tahasang pangngalang “mga mandirigma” sa Hebreo; ang pagdaragdag nito ay magpapaliit sa sadyang masinsing talinghaga.
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Ginamit ang “susuwagin” upang mapanatili ang matingkad na larawan ng mga sungay, at iniwasang idagdag ang “mga mandirigma” dahil wala ito nang tahasan sa Hebreo.
