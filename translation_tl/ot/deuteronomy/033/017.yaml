  to: 'Ang panganay niyang toro ay maringal;

    ang mga sungay nito ay gaya ng mga sungay ng ligaw na toro.[a]

    Sa pamamagitan ng mga iyon ay sabay-sabay niyang susuwagin ang mga bayan

    hanggang sa mga dulo ng lupa.

    Ang mga ito ang sampu-sampung libo ng Efraim,[b]

    at ang mga ito ang libo-libo ng Manases.'
  rationale: Inayos ang maling kayarian ng pang-abay na “ang sama-sama” bilang “sabay-sabay niyang susuwagin,” na pinananatili ang kolektibo o sabayang saklaw ng יַחְדָּו. Pinalitan ang “mailap” ng “ligaw” upang mas tumpak na ihayag ang רְאֵם at maging tugma sa talababa. Ang “Ang mga ito” ay nagpapanatili ng plural na pagtukoy ng Hebreo nang hindi nililinaw nang lampas sa teksto ang eksaktong saklaw ng talinghaga.
