base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/018.yaml
  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: tl
  text: Tungkol naman kay Zebulun ay sinabi niya, “Magalak ka, Zebulun, sa iyong paglabas,[a] at ikaw, Isacar, sa iyong mga tolda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapag lumalabas ka.” Maaaring tumukoy ang pananalitang Hebreo sa larangan ng gawain o kasaganaan ni Zebulun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: Tungkol naman kay Zebulun
  rationale: Ipinakikilala ng pang-ukol ang susunod na pagpapala, na nauukol kay Zebulun. Likas sa modernong Tagalog ang “Tungkol naman kay” at ipinahihiwatig ng “naman” ang paglipat sa susunod na lipi.
- source_word: אָמַר
  choice: ay sinabi niya
  rationale: Karaniwang salin ng pandiwang אמר at malinaw na pinananatili ang pormula ng pagpapakilala sa sinabi ni Moises.
- source_word: שְׂמַח
  choice: Magalak ka
  rationale: Pinananatili ang pautos na anyo at ang marangal na himig ng pagpapala.
- source_word: זְבוּלֻן
  choice: Zebulun
  rationale: Pinananatili ang kinikilalang transliterasyon ng pangalan ng tao at lipi.
- source_word: בְּ/צֵאתֶךָ
  choice: sa iyong paglabas
  rationale: Pinananatili ang konkretong larawan at ang posibleng kahulugan ng pangyayari o larangan ng gawain, nang hindi ito nililimitahan sa mas interpretibong “mga pakikipagsapalaran” o “kalakalan.”
- source_word: וְ/יִשָּׂשכָר
  choice: at ikaw, Isacar
  rationale: Nililinaw sa natural na Tagalog na si Isacar ang ikalawang tuwirang kinakausap, habang pinananatili ang koordinasyon ng dalawang lipi.
- source_word: בְּ/אֹהָלֶיךָ
  choice: sa iyong mga tolda
  rationale: Pinananatili ang maramihang anyo at konkretong larawan ng Hebreo, pati ang paralelismo sa “sa iyong paglabas.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang patulang paralelismo at kolektibong isahang pananalita sa bawat lipi. Ginamit ang “tolda” sa halip na ang mas lumang “tolda/tahanan” na pagpapakahulugan upang manatiling malapit sa konkretong larawan ng pinagmulan.
