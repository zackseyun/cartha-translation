lexical_decisions:
- source_word: מֶגֶד
  choice: pinakamainam
  rationale: Sa konteksto ng pagpapala, tumutukoy ito sa mahalaga at mataas na uring biyaya o ani. Likas sa Filipino ang “pinakamainam” at napananatili nito ang pag-uulit sa dalawang magkatulad na parirala.
- source_word: תְּבוּאֹת
  choice: ani
  rationale: Malawak ang saklaw ng salita sa anumang ibinubunga ng lupa. Ang “ani” ay malinaw at likas sa kontekstong agrikultural, bagaman maaari ring isalin na “bunga ng lupa.”
- source_word: שָׁמֶשׁ
  choice: araw
  rationale: Ang araw ay inilalarawang kaugnay ng paglago at paghinog ng ani. Idinagdag ang “pinahinog ng” upang maipahayag nang natural sa Filipino ang ugnayang ipinahihiwatig ng Hebreo.
- source_word: גֶּרֶשׁ
  choice: bungang inilalabas
  rationale: Ang bihirang salitang ito ay tumutukoy sa bagay na inilalabas o pinatutubo. Napananatili ng parirala ang larawan ng paglitaw ng bunga nang hindi gumagamit ng malabo o sobrang literal na pananalita.
- source_word: יְרָחִים
  choice: buwan-buwan
  rationale: Ang pangmaramihang anyo ay karaniwang tumutukoy sa mga buwan at may kaugnayan din sa buwan sa langit. Ang “buwan-buwan” ay natural na nagpapahayag ng paulit-ulit na pamumunga sa takbo ng mga buwan.
