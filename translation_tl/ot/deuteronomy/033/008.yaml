  to: 'At tungkol kay Levi ay sinabi niya:


    “Ang iyong Tumim at ang iyong Urim ay para sa iyong taong tapat[a],

    na sinubok mo sa Masah[b],

    na nakipagtalo ka sa kanya sa mga tubig ng Meriba.”'
  rationale: Inalis ang interpretibong dagdag na “lingkod” upang mapanatili ang hindi tinukoy na pang-isahang reperente ng Hebreo. Pinalitan ang “kinalaban” ng “nakipagtalo ka sa kanya,” na mas tumpak na naghahatid ng pandiwang ריב nang hindi pinalalakas ito bilang pagkakaaway. Ginawang “sa mga tubig ng Meriba” upang maipakita ang plural na anyo ng pinagmulan.
