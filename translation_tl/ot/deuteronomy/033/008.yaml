base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: tl
  text: 'At tungkol kay Levi ay sinabi niya:


    “Ang iyong Tumim at ang iyong Urim ay para sa iyong taong tapat[a],

    na sinubok mo sa Masah[b],

    na nakipagtalo ka sa kanya sa mga tubig ng Meriba.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong taong maka-Diyos” o “iyong tapat.” Ang salitang Hebreo ay maaaring tumukoy sa isang taong may katapatan sa tipan.
    reason: lexical_alternative
  - marker: b
    text: Ang Masah ay nangangahulugang “pagsubok,” at ang Meriba ay kaugnay ng “pakikipagtalo” o “pagtatalo” (tingnan ang Exodo 17:1–7; Mga Bilang 20:1–13).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: At tungkol kay Levi
  rationale: Ipinakikilala ng לְ ang tribong tinutukoy sa bahaging ito ng pagpapala. Likas sa modernong Tagalog ang “tungkol kay Levi” at hindi nito ipinahihiwatig na si Levi mismo ang tuwirang kinakausap.
- source_word: אָמַר
  choice: ay sinabi niya
  rationale: Pinananatili ang payak na panimulang pahayag at ang hindi tahasang pinangalanang tagapagsalita ng Hebreo.
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: Ang iyong Tumim at ang iyong Urim
  rationale: Ang Tumim at Urim ay mga teknikal na katawagang kaugnay ng gawain ng saserdote; mas mainam na baybayin ang mga pangalan kaysa tumbasan ng “mga kasakdalan” at “mga liwanag,” na maaaring magbigay ng huwad na katiyakan tungkol sa kahulugan at anyo ng mga ito.
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: ay para sa iyong tapat na lingkod
  rationale: Ang לְ ay likas na naipapahayag na “para sa,” at ang חָסִיד ay tumutukoy sa katapatan o katapatan sa tipan. Ginagawang malinaw ng “lingkod” ang kaugnayan sa Diyos nang hindi tinutukoy kung ito ay si Aaron, ang ninunong Levi, o isang kolektibong kinatawan ng lipi.
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: na sinubok mo
  rationale: Tuwirang ipinapahayag nito ang karaniwang kahulugan ng נסה at pinananatili ang Diyos bilang gumagawa ng pagsubok.
- source_word: בְּמַסָּה
  choice: sa Masah
  rationale: Pangalan ito ng pook at pangyayari; pinananatili ang pangalan sa halip na isaling “sa Pagsubok.”
- source_word: תְּרִיבֵהוּ
  choice: na iyong kinalaban
  rationale: Ipinakikita ng ריב ang pakikipagtalo o pakikipagtunggali. Ang “kinalaban” ay natural at marangal sa Tagalog habang pinananatili ang matinding diwa ng tuwirang tunggalian.
- source_word: עַל מֵי מְרִיבָה
  choice: sa may tubig ng Meriba
  rationale: Ang עַל ay ginagamit dito sa lokatibong diwa kaugnay ng pangyayari; ang “sa may tubig” ay natural na tumutukoy sa lugar nang hindi inaalis ang kaugnayan nito sa tubig.
theological_decisions:
- issue: Ang tinutukoy ng “iyong tapat na lingkod” sa pagpapala kay Levi
  choice: Panatilihing pang-isahan at huwag tukuyin kung sino ito.
  alternative: Tukuyin ito bilang si Aaron, ang ninunong Levi, o ang buong lipi ni Levi.
  rationale: Pinahihintulutan ng pang-isahang Hebreo ang ilang posibleng reperente. Hindi dapat lutasin sa salin ang sadyang hindi tinukoy ng teksto.
- issue: Ang Diyos bilang nakipagtunggali sa tapat na lingkod
  choice: Panatilihin ang tuwirang pahayag na “iyong kinalaban.”
  alternative: Palambutin bilang “na sinubok muli” o ipakahulugang ang Israel ang nakipagtalo.
  rationale: Magkaiba ang mga pandiwang נסה at ריב. Pinananatili ng salin ang teolohikal at salaysay na tensiyon sa halip na pag-isahin o palambutin ang mga ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling basahin. Ginamit ang “Tumim,” “Urim,” “Masah,” at “Meriba” bilang mga pangalang teknikal at pantangi. Ang mga taludtod ay inayos bilang panulaan, at lahat ng panandang talababa ay nasa pangunahing teksto.
