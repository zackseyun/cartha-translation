base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: tl
  text: 'Tungkol naman kay Neftali ay sinabi niya:


    “Neftali, puspos ng lingap

    at puno ng pagpapala ni Yahweh,

    angkinin mo ang dagat[a] at ang timog.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “ang kanluran at ang timog,” sapagkat ang “dagat” ay maaari ring gamiting katawagan sa direksiyong kanluran sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי
  choice: Tungkol naman kay Neftali
  rationale: Ipinakikilala ng לְ ang tribo bilang paksa o kinauukulan ng kasunod na pagpapala; natural itong sabihin sa modernong Tagalog bilang “Tungkol naman kay Neftali.”
- source_word: אָמַר
  choice: sinabi niya
  rationale: Pinananatili nito ang payak at karaniwang diwa ng pandiwang אָמַר.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Ginamit ang nakasanayang anyong Tagalog ng pangalan ng tribo.
- source_word: שְׂבַע רָצוֹן
  choice: sagana sa lingap
  rationale: Ang שְׂבַע ay tumutukoy sa pagiging lubos o nasisiyahan dahil sa kasaganaan, samantalang ang רָצוֹן ay lingap o mabuting pagtanggap. Ang “sagana sa lingap” ay natural, marangal, at angkop sa anyo ng pagpapala.
- source_word: וּמָלֵא
  choice: at puspos
  rationale: Ipinapahayag nito ang pagiging ganap na puno at mahusay na kaagapay ng “sagana” sa naunang linya.
- source_word: בִּרְכַּת יְהוָה
  choice: ng pagpapala ni Yahweh
  rationale: Tuwirang isinasalin ang pariralang konstruktong Hebreo at pinananatili ang personal na pangalan ng Diyos.
- source_word: יָם
  choice: ang dagat
  rationale: Ang pangunahing kahulugan ng יָם ay “dagat.” Maaari rin itong tumukoy sa kanluran bilang direksiyon, kaya inilagay ang alternatibong iyon sa talababa.
- source_word: וְדָרוֹם
  choice: at ang timog
  rationale: Ang דָרוֹם ay tumutukoy sa timog o sa katimugang lupain; “ang timog” ang pinakamaikli at pinakamalinaw na katumbas.
- source_word: יְרָשָׁה
  choice: angkinin mo
  rationale: Ipinahahayag ng pandiwa ang pagkuha at pagmamay-ari sa isang lupain. Ang “angkinin mo” ay nagpapanatili sa tuwirang utos o pahayag ng pagpapala.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinanatili ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Lakas ng יְרָשָׁה bilang utos sa loob ng pagpapala
  choice: angkinin mo
  alternative: mamana mo; ariin mo
  rationale: Pinananatili ng “angkinin mo” ang anyong tuwirang pananalita at ang diwa ng pagkuha ng teritoryo nang hindi ginagawang tiyak kung ito ay utos lamang o mabisang pahayag ng pagpapala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang maikling makatang ayos ng pagpapala at iniwasan ang labis na literal na pananalitang magiging matigas sa Tagalog.
