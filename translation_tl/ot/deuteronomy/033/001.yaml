base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: tl
  text: 'Ito ang pagpapalang ibinigay ni Moises, ang tao ng Diyos, sa mga anak ni Israel[a] bago mamatay si Moises:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel,” isang karaniwang kolektibong tawag sa bayan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Ito ang
  rationale: Ipinakikilala ng pang-ugnay at panghalip pamatlig ang isang bagong bahagi. Likas sa modernong Tagalog ang “Ito ang” at hindi na kailangang dagdagan ng temporal na “ngayon.”
- source_word: הַבְּרָכָה אֲשֶׁר בֵּרַךְ
  choice: pagpapalang ibinigay
  rationale: Ang parirala ay tumutukoy sa pormal na pagpapalang iginawad o ipinahayag ni Moises. Ang “pagpapalang ibinigay” ay natural sa Tagalog at pinananatili ang kaugnayan ng pangngalan at pandiwang mula sa iisang salitang-ugat sa Hebreo ayon sa diwa.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalan sa Tagalog.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang tao ng Diyos
  rationale: Pinananatili nito ang kinikilalang titulong Hebreo para sa isang taong itinalaga ng Diyos nang hindi ito pinapakahulugang “propeta” o “lingkod,” na hindi tahasang nakasaad rito.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang pampamilyang ekspresyong literal na “mga anak ni Israel.” Nililinaw ng talababa na kolektibo itong tumutukoy sa bayang Israel.
- source_word: לִפְנֵי מוֹתוֹ
  choice: bago siya namatay
  rationale: Natural na pandiwang pagpapahayag sa modernong Tagalog ng temporal na pariralang “bago ang kanyang kamatayan,” nang walang pagbabago sa kahulugan.
theological_decisions:
- issue: Kolektibong kahulugan ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / bayan ng Israel
  rationale: Pinananatili ng salin ang pampamilya at may-kasariang anyo ng Hebreo, habang ipinapaliwanag sa talababa na ang tinutukoy ay ang buong bayang Israel at hindi lamang ang literal na mga anak na lalaki.
- issue: Titulong אִישׁ הָאֱלֹהִים
  choice: ang tao ng Diyos
  alternative: ang lingkod ng Diyos / ang propeta ng Diyos
  rationale: Ang “tao ng Diyos” ang pinakamalapit at pinakadi-tiyak na salin. Ang mga alternatibo ay magdaragdag ng tungkuling hindi tahasang binanggit sa parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tao ng Diyos” bilang tuwirang titulo at ang “mga anak ni Israel” upang mapanatili ang pampamilyang larawan ng Hebreo. Inilagay ang tandang [a] kaagad pagkatapos ng pariralang ipinaliliwanag nito.
