base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: tl
  text: 'Tungkol kay Benjamin, sinabi niya:


    “Ang minamahal ni Yahweh


    ay mananahang ligtas sa piling niya.[a]


    Kukupkupin niya ito buong araw,


    at siya’y mananahan sa pagitan ng kanyang mga balikat.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mananahang ligtas sa tabi niya,” “sa ilalim niya,” o “sa ibabaw niya.” Maikli at maraming posibleng ugnayang panlunan ang ipinahahayag ng pang-ukol sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa pagitan ng kanyang mga balikat.” Maaaring larawan ito ng malapit na pagkalinga. Iniuugnay naman ito ng iba sa mga dalisdis ng lupaing maburol ni Benjamin o sa santuwaryong nasa teritoryo nito. Hindi rin ganap na tiyak kung si Yahweh o si Benjamin ang tinutukoy ng “siya” at “kanyang.”
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: Tungkol kay Benjamin
  rationale: Sa pormula ng pagpapala sa bawat lipi, natural sa modernong Filipino ang “Tungkol kay Benjamin,” habang pinananatili ang diwang paksa ng Hebreong לְ.
- source_word: יְדִיד יְהוָה
  choice: ang minamahal ni Yahweh
  rationale: Ang יְדִיד ay tumutukoy sa isang iniibig o itinatangi; malinaw at marangal ang “minamahal.” Pinanatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: mananahang ligtas
  rationale: Pinagsasama nito ang literal na diwa ng שכן, “manahan,” at ng לָבֶטַח, “nang ligtas/tiwasay,” sa natural na anyong patula.
- source_word: עָלָיו
  choice: sa piling niya
  rationale: Ipinahahayag nito ang malapit at mapag-ingat na ugnayan nang hindi lubusang nilulutas ang malawak na puwersa ng על; inilalahad sa talababa ang ibang posibleng ugnayang panlunan.
- source_word: חֹפֵף עָלָיו כָּל הַיּוֹם
  choice: Kukupkupin niya ito buong araw
  rationale: Ang חֹפֵף ay larawan ng pagtatakip bilang pag-iingat. Ang “kukupkupin” ay likas sa Filipino at nagpapanatili ng diwa ng proteksiyon; ang “buong araw” ay malinaw at patula.
- source_word: וּבֵין כְּתֵיפָיו שָׁכֵן
  choice: at mananahan ito sa pagitan ng kanyang mga balikat
  rationale: Pinananatili ang literal at siksik na larawang “sa pagitan ng mga balikat” at ang pag-uulit ng ugat na שכן. Hindi tahasang nilulutas sa pangunahing teksto kung kanino tumutukoy ang mga panghalip.
theological_decisions:
- issue: Tinutukoy ng mga panghalip at ang gumagawa ng mga kilos
  choice: Sa pangunahing teksto, ang minamahal/Benjamin ang nananahang ligtas, at si Yahweh ang kumukupkop sa kanya; pinanatiling hindi tahasang tinukoy ang may-ari ng “mga balikat.”
  alternative: Maaaring unawain na si Yahweh ang nananahan sa ibabaw ni Benjamin at sa pagitan ng mga balikat nito, o na si Benjamin ang nananahan sa pagitan ng mga balikat ni Yahweh.
  rationale: Dahil siksik ang tulang Hebreo at maaaring magbago ang tinutukoy ng mga panlalaking panghalip, hindi dapat piliting lutasin ang lahat ng reperensiya. Ang karaniwang diwa ng banal na pag-iingat ay malinaw, ngunit ang huling larawan ay sadyang pinanatiling bukas.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino na may katamtamang himig patula. Ginamit ang “manahan” upang mapanatili ang pag-uulit at larawang panahanan sa Hebreo; ginamit ang “ito” para sa Benjamin/minamahal bilang kolektibong lipi at upang maiwasan ang kalituhan sa sunod-sunod na “niya.”
