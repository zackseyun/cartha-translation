  to: 'Tungkol kay Benjamin, sinabi niya:


    “Ang minamahal ni Yahweh


    ay mananahang ligtas sa piling niya.[a]


    Kukupkupin niya ito buong araw,


    at siya’y mananahan sa pagitan ng kanyang mga balikat.”[b]'
  rationale: Pinalitan ang panghuling “ito” ng “siya’y” upang huwag tahasang lutasin kung sino ang paksa ng huling “mananahan.” Pinalinaw rin ang talababa upang saklawin kapwa ang di-tiyak na may-ari ng “mga balikat” at ang di-tiyak na paksa ng pangwakas na pandiwa. Walang binago sa pangunahing kahulugan ng talata.
