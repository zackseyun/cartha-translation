  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: tl
  text: Walang katulad ang Diyos, O Jeshurun[a]! Siya’y nakasakay sa kalangitan upang tulungan ka[b], at sa mga alapaap sa kanyang kamahalan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Jeshurun ay patulang pangalan para sa Israel.
    reason: cultural_note
  - marker: b
    text: O, “bilang iyong saklolo.”
    reason: lexical_alternative
  - marker: c
    text: O, “sa mga ulap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: Walang gaya ng Diyos
  rationale: Pinananatili nito ang ganap na paghahambing ng Hebreo at natural itong pakinggan sa makabagong Tagalog. Ang אֵל ay isinalin bilang karaniwang katawagan na “Diyos,” hindi bilang pangalang “El.”
- source_word: יְשֻׁרוּן
  choice: Jeshurun
  rationale: Isa itong patulang pantanging pangalan para sa Israel, kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin bilang “matuwid.”
- source_word: רֹכֵב
  choice: Sumasakay siya
  rationale: Ang participle ay naglalarawan sa maringal at katangiang pagkilos ng Diyos. Ang tahasang panghalip ay nagbibigay ng malinaw at natural na pangungusap sa Tagalog.
- source_word: שָׁמַיִם
  choice: kalangitan
  rationale: Ang “kalangitan” ay dignificado at natural na katumbas ng maramihang anyong Hebreo, at napapanatili ang patulang larawan.
- source_word: בְעֶזְרֶךָ
  choice: upang tulungan ka
  rationale: Ang בְּ ay nauunawaan dito bilang layunin o kapakinabangan. Malinaw itong ipinahahayag ng “upang tulungan ka,” habang itinatala sa talababa ang mas pormal na alternatibo.
- source_word: וּבְגַאֲוָתוֹ
  choice: taglay ang kanyang kamahalan
  rationale: Kapag tumutukoy sa Diyos, ang גַּאֲוָה ay nagpapahayag ng kadakilaan o kamahalan, hindi ng masamang pagmamataas. Ang “taglay” ay natural na naghahatid ng gamit ng pang-ukol.
- source_word: שְׁחָקִים
  choice: mga ulap
  rationale: Maaaring tumukoy ang patulang salita sa mga ulap o sa mataas na himpapawid. Pinili ang “mga ulap” upang maiba sa naunang “kalangitan” at mapanatili ang kongkretong patulang larawan; nasa talababa ang alternatibo.
theological_decisions:
- issue: Ang tinutukoy at diwa ng אֵל sa paghahambing
  choice: Karaniwang katawagang “Diyos”
  alternative: Pantanging pangalang “El” o titulong “Makapangyarihan”
  rationale: Ipinagdiriwang ng talata ang walang kapantay na Diyos ng Israel. Ang “Diyos” ang pinakanatural na katumbas at hindi nagpapahiwatig ng ibang hiwalay na diyos.
- issue: Ang pagkakakilanlan ng Jeshurun
  choice: Pinanatili bilang patulang pangalan at ipinaliwanag sa talababa
  alternative: Isalin sa teksto bilang “matuwid” o “matuwid na bayan”
  rationale: Ang יְשֻׁרוּן ay ginagamit dito bilang pantanging patulang tawag sa Israel. Ang transliterasyon ay umiiwas sa pagpapalit ng pangalan ng isang interpretatibong paglalarawan.
translation_notes:
  register: Makabago ngunit marangal at patula ang rehistro. Ginamit ang padamdam pagkatapos ng tuwirang tawag na “O Jeshurun” upang luminaw ang bokatibo, at hinati ang pahayag upang maging natural sa Tagalog nang hindi binabago ang ugnayan ng mga larawan sa Hebreo.
