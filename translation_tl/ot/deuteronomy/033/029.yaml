reference: Deuteronomy 33:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: tl
  text: Mapalad ka, Israel! Sino ang tulad mo—isang bayang iniligtas ni Yahweh? Siya ang kalasag na tumutulong sa iyo at ang tabak ng iyong kadakilaan. Magpapasakop sa iyo ang iyong mga kaaway[a], at yuyurakan mo ang kanilang matataas na dako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magkukunwaring nagpapasakop sa iyo” o “mapipilitang yumukod sa iyo.” Maaaring magpahiwatig ang pandiwang Hebreo ng sapilitan o pakunwaring pagpapasakop.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kanilang mga kaitaasan” o “kanilang mga tanggulan.” May ilan ding umuunawa rito bilang “kanilang mga likod,” ngunit “matataas na dako” ang mas tuwirang kahulugan ng pangngalang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: Mapalad ka
  rationale: Ang pormulang אַשְׁרֵי ay isang masiglang pahayag tungkol sa kalagayang pinagpala at kahanga-hanga; natural at marangal sa modernong Tagalog ang “Mapalad ka.”
- source_word: מִי כָמוֹךָ
  choice: Sino ang tulad mo
  rationale: Pinananatili nito ang retorikal na tanong na nagpapahayag na walang maihahambing sa Israel sa kalagayang inilalarawan.
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: isang bayang iniligtas ni Yahweh
  rationale: Ang Niphal participle na נוֹשַׁע ay naglalarawan sa Israel bilang bayang tumanggap ng pagliligtas; malinaw ang pasibong “iniligtas” at ang בַּיהוָה ay natural na naipapahayag sa Tagalog bilang ahensiyang “ni Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: מָגֵן עֶזְרֶךָ
  choice: ang kalasag na tumutulong sa iyo
  rationale: 'Ipinahahayag nang natural ang siksik na construct phrase: si Yahweh ang pananggalang at pinagmumulan ng tulong ng Israel, nang hindi ginagawang dalawang magkahiwalay na katawagan.'
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: at ang tabak ng iyong kadakilaan
  rationale: Pinananatili ang parallel na paglalarawan kay Yahweh bilang tabak na kaugnay ng kadakilaan o pagkadakila ng Israel. Ang “kadakilaan” ay hindi kusang naglalagay ng negatibong kahulugan na maaaring taglayin ng “pagmamataas.”
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: Magpapasakop sa iyo ang iyong mga kaaway
  rationale: Malinaw nitong ipinahahayag ang pagyukod o pagsuko ng mga kaaway, samantalang inilalagay sa talababa ang tunay na leksikal na posibilidad na sapilitan, mapagkunwari, o mapanlinlang ang kanilang pagpapasakop.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: yuyurakan mo ang kanilang matataas na dako
  rationale: Malapit ito sa karaniwang kahulugan ng בָּמוֹת bilang mga kaitaasan o matataas na dako at pinananatili ang matinding larawang militar ng pagtapak; ang ibang posibleng pagbasa ay inilalahad sa talababa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng גַּאֲוָתֶךָ
  choice: iyong kadakilaan
  alternative: iyong pagmamataas, pagkadakila, o karangalan
  rationale: Ang konteksto ay positibong pagpapala. Pinananatili ng “kadakilaan” ang diwa ng exaltasyon nang hindi ipinapalagay ang negatibong moral na kahulugan ng pagmamataas.
- issue: Uri ng pagpapasakop ng mga kaaway
  choice: Pangkalahatang “magpapasakop” sa teksto, na may paliwanag sa talababa
  alternative: magkukunwaring nagpapasakop o mapipilitang yumukod
  rationale: Maaaring magpahiwatig ang pandiwang כחשׁ ng mapanlinlang, pakunwari, o sapilitang pagsuko. Hindi pinipili nang tahimik ang isa lamang sa mga magkakaugnay na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa patulang pagpapala. Ginamit ang malinaw na pangungusap at kasalukuyang bokabularyo, habang pinanatili ang retorikal na tanong, parallel na mga larawan ng kalasag at tabak, at ang hindi tiyak na mga pahiwatig ng dalawang huling parirala.
