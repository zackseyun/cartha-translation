  text: וּ/מִ/מֶּ֗גֶד אֶ֚רֶץ וּ/מְלֹאָ֔/הּ וּ/רְצ֥וֹן שֹׁכְנִ֖י סְנֶ֑ה תָּב֨וֹאתָ/ה֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: tl
  text: 'at ng pinakamainam na yaman ng lupa at ng lahat ng narito,


    at ng lingap ng nanahan sa palumpong[a].


    Dumating nawa ang mga ito sa ulo ni Jose,


    at sa bumbunan ng ibinukod sa kanyang mga kapatid[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tumutukoy ito sa Diyos na nagpakita kay Moises sa palumpong na nagliliyab ngunit hindi natutupok (Exodo 3:2–4).
    reason: allusion_explanation
  - marker: b
    text: Maaari ring isalin na “ang pinuno sa kanyang mga kapatid” o “ang itinalaga sa gitna ng kanyang mga kapatid.” Maaaring ipahiwatig ng salitang Hebreo kapuwa ang pagkakabukod at ang natatanging katayuan ni Jose.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּגֶד אֶרֶץ
  choice: ng pinakamainam na mga bunga ng lupa
  rationale: Sa konteksto ng pagpapala, ang מֶגֶד ay tumutukoy sa mahalaga o piling ani at biyaya ng lupain. Ginagawang lantad ng “mga bunga” ang likas na diwa sa agrikultural na konteksto nang hindi nililimitahan sa iisang uri ng ani.
- source_word: וּמְלֹאָהּ
  choice: at ng lahat ng naroon
  rationale: Tumutukoy ito sa lahat ng pumupuno o nilalaman ng lupa. Mas natural ito sa modernong Filipino kaysa sa literal ngunit di-karaniwang “kapuspusan nito.”
- source_word: וּרְצוֹן
  choice: at ng lingap
  rationale: Ang רָצוֹן dito ay mabuting kalooban o pabor ng Diyos. Ang “lingap” ay maikli, marangal, at natural sa isang pahayag ng pagpapala.
- source_word: שֹׁכְנִי סְנֶה
  choice: ng Siyang nanahan sa mababang punongkahoy
  rationale: Pinananatili ng pariralang naglalarawan ang alusyon sa pagpapakita ng Diyos kay Moises. Ang סְנֶה ay isang mababang punongkahoy o palumpong; iniiwasan ng salin na idagdag sa pangunahing teksto ang “nagniningas,” na hindi tahasang nasa pariralang ito.
- source_word: תָּבוֹאתָה
  choice: Mapasa ... nawa ang mga pagpapalang ito
  rationale: Ipinahahayag nito ang optatibo o basbas na diwa ng pandiwa. Ang maramihang “mga pagpapalang ito” ay natural na Filipino para sa pinagsama-samang mga biyayang binanggit sa tulang Hebreo.
- source_word: לְרֹאשׁ יוֹסֵף
  choice: sa ulo nawa ni Jose
  rationale: Pinananatili nito ang karaniwang larawang Hebreo ng pagpapalang dumarating sa ulo ng pinagpapala.
- source_word: וּלְקָדְקֹד
  choice: at sa tuktok ng ulo
  rationale: Ang קָדְקֹד ay ang pinakatuktok o bumbunan ng ulo. Pinananatili ng “tuktok ng ulo” ang paralelismo at malinaw ito sa ordinaryong mambabasa.
- source_word: נְזִיר אֶחָיו
  choice: niya na ibinukod sa kanyang mga kapatid
  rationale: Ang נָזִיר ay pangunahing nagsasaad ng pagiging nakatalaga o ibinukod, ngunit maaari ring magpahiwatig ng katanyagan o pangunguna. Pinananatili ng salin ang pangunahing diwa nang hindi tiyak na ginagawang “prinsipe” si Jose.
theological_decisions:
- issue: Pagkakakilanlan ng “Siyang nanahan sa mababang punongkahoy”
  choice: Isang mapitagang paglalarawan sa Diyos na nagpakita kay Moises sa mababang punongkahoy
  alternative: Isang mas pangkalahatang pagtukoy sa banal na pagpapakita sa Horeb o Sinai
  rationale: Malinaw na umaalingawngaw ang parirala sa Exodo 3, ngunit inilalarawan lamang ito ng pangunahing teksto at hindi dinaragdagan ng doktrinal na pagpapaliwanag.
- issue: Kahulugan ng נְזִיר kaugnay ni Jose
  choice: ibinukod sa kanyang mga kapatid
  alternative: pinuno sa kanyang mga kapatid; itinalaga sa gitna ng kanyang mga kapatid
  rationale: Ang “ibinukod” ang pinakamalapit sa leksikal na ubod at maaari ring sumaklaw sa pagkahiwalay at natatanging katayuan ni Jose. Inilalahad sa talababa ang posibleng diwa ng pangunguna.
translation_notes:
  register: Makabagong Filipino na marangal at patula, ngunit madaling maunawaan. Ginamit ang “mababang punongkahoy” sa halip na mas teknikal na pangalan ng halaman, at iniwasang idagdag sa pangunahing teksto ang “nagniningas” sapagkat alusyon iyon mula sa Exodo, hindi bahagi ng mismong pariralang Hebreo rito. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
