  to: 'at ng pinakamainam na yaman ng lupa at ng lahat ng narito,


    at ng lingap ng nanahan sa palumpong[a].


    Dumating nawa ang mga ito sa ulo ni Jose,


    at sa bumbunan ng ibinukod sa kanyang mga kapatid[b].'
  rationale: Pinalawak ang katumbas ng מֶגֶד upang hindi malimitahan sa prutas o bunga, pinalitan ang di-natural na “mababang punongkahoy” ng “palumpong,” at inayos ang ayos ng pangwakas na pangungusap upang malinaw na ang sama-samang mga pagpapala ay hinihiling na dumating kay Jose. Napanatili ang mapitagang patulang rehistro, ang alusyon sa Exodo sa talababa lamang, at ang maingat na pagsasalin ng נְזִיר.
