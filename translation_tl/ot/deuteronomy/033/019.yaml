  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: tl
  text: Tatawagin nila ang mga bayan patungo sa bundok[a]; doon sila mag-aalay ng mga haing matuwid[b], sapagkat tatanggap sila mula sa kasaganaan ng mga dagat[c] at mula sa mga kayamanang nakatago sa buhangin[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungo sa isang bundok.” Hindi tinutukoy sa Hebreo kung aling bundok ito.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mga hain ng katuwiran” o “mga haing karapat-dapat.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sususuhin nila ang kasaganaan ng mga dagat,” isang larawan ng pagtanggap ng kabuhayan o yaman mula sa dagat.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “mga nakatagong bagay sa buhangin.” Malamang na tumutukoy ito sa mga yamang kaugnay ng dalampasigan o mabuhanging lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: mga bayan
  rationale: Pinananatili nito ang maramihang kolektibong diwa ng mga pangkat ng tao, sa halip na mga indibidwal lamang.
- source_word: הַר
  choice: bundok
  rationale: Walang pantukoy ang pangngalan sa Hebreo at hindi tinutukoy ng talata kung aling bundok; ang 'patungo sa bundok' ay natural sa Filipino habang pinananatili ang di-tiyak na pagkakakilanlan nito.
- source_word: יִקְרָאוּ
  choice: tatawagin
  rationale: Saklaw ng 'tatawagin' ang maaaring diwa ng pag-anyaya o pagpapapunta nang hindi pumipili nang labis sa isa.
- source_word: יִזְבְּחוּ
  choice: maghahandog
  rationale: Sa konteksto ng pagsamba, likas sa modernong Filipino ang 'maghahandog' at malinaw na tumutukoy sa sakripisyal na paghahandog.
- source_word: זִבְחֵי צֶדֶק
  choice: mga handog na matuwid
  rationale: Pinananatili nito ang kaugnayan ng צֶדֶק sa mga handog nang hindi ipinapasok kung ang diin ay ritwal na katanggap-tanggap o moral na katuwiran.
- source_word: שֶׁפַע יַמִּים
  choice: kasaganaan ng mga dagat
  rationale: Malawak ang 'kasaganaan' at maaaring tumukoy sa pagkain, likas na yaman, o pakinabang mula sa dagat nang hindi nagpapakitid ng kahulugan.
- source_word: יִינָקוּ
  choice: tatanggap sila mula sa
  rationale: Ipinahahayag nito ang metaporikal na pagkuha ng kabuhayan o yaman, habang inilalagay sa talababa ang literal na larawang 'sususuhin.'
- source_word: וּשְׂפוּנֵי טְמֻנֵי חוֹל
  choice: at mula sa mga kayamanang nakatago sa buhangin
  rationale: Sinasalamin nito ang dobleng diwa ng mga bagay na itinago o ibinaon, ngunit hindi tinutukoy kung anong uri ng yamang nasa buhangin o baybayin.
theological_decisions:
- issue: Kalikasan ng זִבְחֵי צֶדֶק
  choice: mga handog na matuwid
  alternative: mga handog ng katuwiran; mga handog na karapat-dapat
  rationale: Pinananatili ang moral at panritwal na puwang ng parirala, nang hindi ito ikinakabit sa isang mas huling sistemang teolohikal.
- issue: Tinutukoy na bundok
  choice: hindi pinangalanan ang bundok
  alternative: Zion; Sinai; isang santuwaryo sa bundok; teritoryong mabundok ng mga lipi
  rationale: Hindi espesipikong pinapangalanan ng tekstong Hebreo ang bundok, kaya hindi dapat magdagdag ng pagkakakilanlan ang salin.
- issue: Pinagmumulan ng kasaganaan at nakatagong yaman
  choice: iniwang pangkalahatan
  alternative: yamang-dagat, kalakalan sa dagat, o partikular na mineral at produktong mula sa baybayin
  rationale: Makatula at hindi espesipiko ang teksto; hindi nito tahasang kinikilala ang mismong mga yaman.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'mga bayan' para sa kolektibong mga pangkat ng tao at 'maghahandog' para sa malinaw ngunit likas na wikang panritwal. Pinanatili sa mga talababa ang literal na metapora at mga tunay na alternatibong pagbasa.
