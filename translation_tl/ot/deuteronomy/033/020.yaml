base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: tl
  text: 'At tungkol kay Gad ay sinabi niya:

    “Pinagpala ang nagpapalawak sa nasasakupan ni Gad.[a]

    Nananahan siyang gaya ng isang leon,[b]

    at nilalapa ang bisig, pati ang tuktok ng ulo.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Pagpalain nawa ang nagpapalawak sa nasasakupan ni Gad.” Maaaring Diyos ang ipinahihiwatig na gumagawa, bagaman hindi siya tahasang binanggit sa Hebreo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “gaya ng isang leona”; ang salitang Hebreo ay maaaring tumukoy sa isang makapangyarihang leon sa pangkalahatan.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “bisig, pati tuktok ng ulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגָד
  choice: At tungkol kay Gad
  rationale: Likas na panimula sa Filipino para sa orakulo o pagpapalang ukol sa tribo ni Gad.
- source_word: אָמַר
  choice: ay sinabi niya
  rationale: Pinananatili ang payak na pormulang nagsasaad ng pagsasalita ni Moises.
- source_word: בָּרוּךְ
  choice: Pinagpala
  rationale: Isinasalin bilang pahayag ng pagpapala, hindi ginagawang tahasang panalangin o kahilingan.
- source_word: מַרְחִיב גָּד
  choice: ang nagpapalawak sa nasasakupan ni Gad
  rationale: Ipinahahayag ang sanhiing diwa ng Hiphil na ‘nagbibigay ng higit na lawak’; idinagdag ang ‘nasasakupan’ upang maging malinaw at natural sa Filipino nang hindi pinapangalanan ang di-tiyak na gumagawa.
- source_word: כְּלָבִיא
  choice: gaya ng isang leon
  rationale: Ang לָבִיא ay maaaring tumukoy sa leon o leona, lalo na sa isang malakas at ganap nang hayop; ang pangkalahatang ‘leon’ ay natural sa Filipino habang itinatala sa talababa ang alternatibo.
- source_word: שָׁכֵן
  choice: Nananahan siya
  rationale: Pinananatili ang diwang paninirahan o pananatili, na angkop kapwa sa tribong nasa lupain at sa talinghaga ng leon.
- source_word: וְטָרַף
  choice: at nilalapa
  rationale: Ipinapakita ang marahas at mapanilang pagkilos ng טרף sa natural na Filipino.
- source_word: זְרוֹעַ
  choice: ang bisig
  rationale: Pinananatili ang konkretong bahagi ng katawan sa halip na gawing abstraktong ‘lakas.’
- source_word: אַף קָדְקֹד
  choice: pati ang tuktok ng ulo
  rationale: Ang אַף ay pandagdag at pampatindi, at ang קָדְקֹד ay tumutukoy sa korona o tuktok ng ulo.
theological_decisions:
- issue: Ang tinutukoy ng ‘nagpapalawak sa nasasakupan ni Gad’
  choice: Hindi tahasang pinangalanan ang gumagawa; nananatiling ‘ang nagpapalawak.’
  alternative: 'Tahasan itong tukuyin bilang Diyos: ‘Pinagpala ang Diyos na nagpapalawak sa nasasakupan ni Gad.’'
  rationale: Maaaring ipinahihiwatig ng Hebreo na Diyos ang gumagawa, ngunit hindi siya tahasang pinangalanan sa talata; pinananatili ng salin ang kalabuan ng orihinal.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘nasasakupan’ upang likas na maipahayag ang pagpapalawak ng espasyo o lupain ni Gad. Iningatan ang hindi tiyak na paksa ng מַרְחִיב at ang marahas na talinghaga ng mandaragit.
