  text: מְעֹנָה֙ אֱלֹ֣הֵי קֶ֔דֶם וּ/מִ/תַּ֖חַת זְרֹעֹ֣ת עוֹלָ֑ם וַ/יְגָ֧רֶשׁ מִ/פָּנֶ֛י/ךָ אוֹיֵ֖ב וַ/יֹּ֥אמֶר הַשְׁמֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: tl
  text: Ang Diyos mula pa noong unang panahon ang tahanan[a], at nasa ilalim ang mga bisig na walang hanggan. Itinaboy niya ang kaaway mula sa harapan mo at sinabi, “Puksain!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang walang hanggang Diyos ang iyong kanlungan.” Maaaring unawain ang Hebreo sa ganitong tradisyonal at mas interpretatibong paraan, bagaman ang mas tuwirang pananalita ay, “Ang Diyos mula pa noong unang panahon ang tahanan.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: tahanan
  rationale: Tumutukoy ang pangngalan sa isang tirahan o dakong masisilungan. Pinananatili ng “tahanan” ang tuwirang larawan ng Hebreo nang hindi agad nililimitahan sa metaporikal na “kanlungan.”
- source_word: אֱלֹהֵי קֶדֶם
  choice: Ang Diyos mula pa noong unang panahon
  rationale: Ang קֶדֶם ay pangunahing tumutukoy sa sinaunang panahon o mga panahong lumipas. Likas sa modernong Tagalog ang pariralang ito at mas tuwirang kumakatawan sa Hebreo kaysa “Diyos na walang hanggan.”
- source_word: וּמִתַּחַת
  choice: at sa ilalim
  rationale: Pinananatili nito ang malinaw na larawang panlunan at ang makatang pagkakatapat sa naunang sugnay.
- source_word: זְרֹעֹת עוֹלָם
  choice: ang walang hanggang mga bisig
  rationale: Ang “mga bisig” ay nagpapanatili sa metapora ng lakas at pagsuporta, samantalang ang “walang hanggan” ay nagpapahayag ng patuloy at di-naglalahong bisa ng עוֹלָם.
- source_word: וַיְגָרֶשׁ
  choice: Itinaboy niya
  rationale: Ang pandiwang גרש ay nangangahulugang magtaboy o magpalayas; ang “itinaboy” ay malinaw, mariin, at angkop sa kontekstong militar.
- source_word: מִפָּנֶיךָ
  choice: mula sa harapan mo
  rationale: Mas malapit ito sa literal na “mula sa iyong mukha/presensiya” habang nananatiling nauunawaan bilang pag-aalis sa kaaway na nasa daraanan ng Israel.
- source_word: אוֹיֵב
  choice: ang kaaway
  rationale: Pinananatili ang anyong isahan ng Hebreo, na maaari ring magkaroon ng kolektibong diwa.
- source_word: וַיֹּאמֶר
  choice: at sinabi
  rationale: Payak na pagpapatuloy ng salaysay; ang Diyos ang pinakamalinaw na paksa mula sa naunang pandiwa.
- source_word: הַשְׁמֵד
  choice: Lipulin mo!
  rationale: Ang Hiphil imperative ay nag-uutos ng ganap na pagwasak. Ang “lipulin” ay mariin at natural sa Tagalog, at malinaw na pautos sa ikalawang panauhan.
theological_decisions:
- issue: Kung ang קֶדֶם sa אֱלֹהֵי קֶדֶם ay isasaling “mula pa noong unang panahon” o bibigyang-kahulugang “walang hanggan”
  choice: Ang Diyos mula pa noong unang panahon
  alternative: Ang Diyos na walang hanggan ang iyong kanlungan
  rationale: Mas tuwirang ipinapahayag ng קֶדֶם ang sinaunang panahon o panahong lumipas. Gayunman, matagal nang kinikilalang interpretasyon ang “Diyos na walang hanggan,” kaya pinananatili ito sa talababa kasama ng “kanlungan” bilang mas interpretatibong pagbasa.
translation_notes:
  register: Makata, marangal, at malinaw na modernong Tagalog. Ginamit ang “tahanan” upang mapanatili ang kongkretong larawan ng מְעֹנָה, at ang mas interpretatibong “kanlungan” ay inilagay sa talababa. Ang “Lipulin mo!” ay nagpapanatili sa mariing pautos at hindi nagdaragdag ng tiyak na layon na wala sa Hebreo.
