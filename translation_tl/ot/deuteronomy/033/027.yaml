- from: Ang Diyos mula pa noong unang panahon ang tahanan[a], at sa ilalim ay ang walang hanggang mga bisig. Itinaboy niya ang kaaway mula sa harapan mo at sinabi, “Lipulin mo!”
  to: Ang Diyos mula pa noong unang panahon ang tahanan[a], at nasa ilalim ang mga bisig na walang hanggan. Itinaboy niya ang kaaway mula sa harapan mo at sinabi, “Puksain!”
  rationale: Pinakinis ang ayos ng dalawang makatang parirala upang maging mas natural sa modernong Tagalog, habang pinananatili ang sintaktikong pagkakabit at imahen ng Hebreo. Pinalitan ang pautos ng anyong hindi nagpapahiwatig ng isang layong hindi hayag sa pinagmulan. Iningatan ang alternatibong tradisyonal na pagbasa sa talababa at ang angkla nito.
