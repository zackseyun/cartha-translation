  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יוֹר֤וּ מִשְׁפָּטֶ֨י/ךָ֙ לְ/יַעֲקֹ֔ב וְ/תוֹרָתְ/ךָ֖ לְ/יִשְׂרָאֵ֑ל יָשִׂ֤ימוּ קְטוֹרָה֙ בְּ/אַפֶּ֔/ךָ וְ/כָלִ֖יל עַֽל מִזְבְּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: tl
  text: Ituturo nila ang iyong mga hatol kay Jacob at ang iyong kautusan[a] sa Israel; maghahandog sila ng insenso sa harap mo[b] at ng handog na lubusang sinusunog sa iyong altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagubilin” para sa “kautusan” (תּוֹרָה).
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa iyong ilong,” isang antropomorpikong pahayag tungkol sa insensong inihaharap sa Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: Ituturo nila
  rationale: Ang Hiphil ng ירה ay karaniwang nangangahulugang magturo o magbigay ng tagubilin, lalo na sa kontekstong legal at makasaserdote.
- source_word: מִשְׁפָּטֶיךָ
  choice: ang iyong mga hatol
  rationale: Pinananatili ng “mga hatol” ang legal na diwa ng מִשְׁפָּט at ang pagkakatapat nito sa kautusan.
- source_word: לְיַעֲקֹב
  choice: kay Jacob
  rationale: Likas na ipinapahayag ng “kay” ang di-tuwirang layon na minamarkahan ng ל at pinananatili ang makatang pagtutumbas kay Jacob at sa Israel.
- source_word: וְתוֹרָתְךָ
  choice: at ang iyong kautusan
  rationale: Maaaring mangahulugan ang תּוֹרָה ng pagtuturo o tagubilin, ngunit sa kontekstong tipan at kasabay ng “mga hatol,” ang “kautusan” ay malinaw at angkop; inilagay sa talababa ang alternatibo.
- source_word: לְיִשְׂרָאֵל
  choice: sa Israel
  rationale: Tuwiran at natural na salin ng לְיִשְׂרָאֵל, habang pinananatili ang paralelismo sa “kay Jacob.”
- source_word: יָשִׂימוּ
  choice: maghahandog sila
  rationale: Literal na “ilalagay nila,” ngunit sa kontekstong pansamba, mas natural sa Filipino ang “maghahandog” at malinaw nitong ipinapakita ang ritwal na kilos nang hindi dinaragdagan ang uri ng handog.
- source_word: קְטוֹרָה
  choice: ng insenso
  rationale: Ang קְטוֹרָה ay tumutukoy sa insenso; sapat at natural ang karaniwang salitang Filipino na “insenso.”
- source_word: בְּאַפֶּךָ
  choice: sa harap mo
  rationale: Literal itong “sa iyong ilong/butas ng ilong,” isang antropomorpikong pahayag kaugnay ng insensong inihaharap sa Diyos. Inihahatid ng “sa harap mo” ang kahulugan nang hindi nagiging malabo o katawa-tawa.
- source_word: וְכָלִיל
  choice: at ng mga handog na susunuging buo
  rationale: Ang כָּלִיל ay handog na lubusang tinutupok sa altar. Ang maramihang anyo ay natural bilang kolektibong paglalarawan sa paulit-ulit na gawaing panghandog.
- source_word: עַל מִזְבְּחֶךָ
  choice: sa iyong altar
  rationale: Natural na salin sa Filipino ng lokasyong ipinahihiwatig ng עַל sa kontekstong paghahandog.
theological_decisions:
- issue: Kahulugan ng תּוֹרָה sa konteksto ng tipan
  choice: kautusan
  alternative: tagubilin
  rationale: Ipinapakita ng talata ang tungkulin ng mga Levita na ituro ang mga kahilingan ng Diyos sa tipan. Pinananatili ng “kautusan” ang legal na puwersa, samantalang kinikilala sa talababa ang mas malawak na diwang “tagubilin.”
- issue: Antropomorpikong pahayag na בְּאַפֶּךָ
  choice: sa harap mo
  alternative: sa iyong ilong/butas ng ilong
  rationale: Hindi natural at maaaring makalito ang lubhang literal na salin. Ang “sa harap mo” ay nagpapanatili sa diwa ng insensong inihaharap sa Diyos nang hindi ipinapakahulugan ang parirala bilang galit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kay Jacob” at “sa Israel” ayon sa natural na tuntunin ng Tagalog. Ang “maghahandog” ay isang katamtamang dinamikong salin ng literal na “maglalagay,” at ang “mga handog na susunuging buo” ay nagpapaliwanag sa teknikal na terminong panghandog nang hindi gumagamit ng di-pamilyar na katawagan.
