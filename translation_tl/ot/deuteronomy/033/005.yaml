base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: tl
  text: At siya ay hari sa Jeshurun[a] nang sama-samang magtipon ang mga pinuno ng bayan at ang mga lipi ng Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Jeshurun” ay patulang pangalan para sa Israel. Maaari ring isalin ang unang bahagi na, “At ang PANGINOON ay hari sa Jeshurun”; inuunawa naman ng iba na si Moises ang tinutukoy. Hindi tahasang binabanggit sa Hebreo kung sino ang paksa.
    reason: alternative_reading_and_cultural_note
  - marker: b
    text: O, “nang magtipon ang mga pinuno ng bayan, ang mga lipi ng Israel na sama-sama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At siya ay naging
  rationale: Maaaring mangahulugang “siya ay” o “siya ay naging” ang anyo ng היה. Pinili ang “naging” upang maipahayag ang paglitaw o pagsisimula ng pagiging hari, habang hindi tinutukoy kung sino ang paksa.
- source_word: בִישֻׁרוּן
  choice: sa Jeshurun
  rationale: Ang Jeshurun ay patulang pangalan para sa Israel. Pinanatili itong pantanging pangalan, at likas sa Filipino ang “sa” para sa korporatibo o lokatibong diwa ng ב.
- source_word: מֶלֶךְ
  choice: hari
  rationale: Karaniwang katumbas ng pangngalan; hindi nito tahasang tinutukoy kung sino ang hari.
- source_word: בְּהִתְאַסֵּף
  choice: nang ... magtipon
  rationale: Ang infinitive construct na may ב ay may temporal na diwa; natural itong naipahahayag sa Filipino sa pamamagitan ng “nang ... magtipon.”
- source_word: רָאשֵׁי עָם
  choice: mga pinuno ng bayan
  rationale: Literal itong “mga ulo ng bayan,” ngunit ang idyoma ay tumutukoy sa mga lider o pinuno. Ang “mga pinuno” ang malinaw at natural na katumbas sa modernong Filipino.
- source_word: יַחַד
  choice: sama-sama
  rationale: Ipinahahayag nito ang sama-samang pagkilos at pagkakaisa ng pagtitipon.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ang mga lipi ng Israel
  rationale: Inunawa bilang pariralang nagpapaliwanag kung sino ang bayang nagtipon sa katauhan ng mga pinuno nito. Pinananatili ng gitling-pahaba ang siksik at bahagyang malabong ugnayang sintaktiko ng Hebreo.
theological_decisions:
- issue: Kung sino ang tinutukoy na hari
  choice: Pinanatili sa pangunahing teksto ang panghalip na “siya” nang hindi pinapangalanan ang tinutukoy.
  alternative: “Ang PANGINOON ay naging hari sa Jeshurun” o “Si Moises ay naging hari sa Jeshurun.”
  rationale: Walang tahasang paksa sa Hebreo. Maaaring tumukoy ito sa PANGINOON o kay Moises, kaya hindi dapat lutasin sa salin ang tunay na kalabuan ng teksto.
- issue: Pagkakaisa ng Israel sa pagtitipon
  choice: “nang sama-samang magtipon ang mga pinuno ng bayan—ang mga lipi ng Israel”
  alternative: Unawain ito bilang isang pormal na pagluklok sa hari o bilang isang tiyak na pagtitipong pangtipan.
  rationale: Malinaw ang sama-samang pagtitipon ng Israel, ngunit hindi tahasang tinutukoy ng talata ang eksaktong politikal o liturhikong katangian nito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga pinuno” sa halip na literal na “mga ulo,” at pinanatili ang Jeshurun bilang patulang pantanging pangalan. Ang gitling-pahaba ay tumutulong upang maipakita ang siksik na appositional na ayos ng Hebreo nang hindi ito labis na nililinaw.
