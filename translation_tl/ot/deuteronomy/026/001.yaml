  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: tl
  text: At kapag pumasok ka sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos bilang mana, at inangkin mo ito[a] at nanirahan ka rito[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at kinuha mo ito bilang pag-aari.” Sa kontekstong ito, ang pandiwang Hebreo ay tumutukoy sa pagkuha o pag-angkin sa lupain.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at tumira ka rito” o “at nanahan ka rito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Karaniwang pormulang Hebreo ito na nagpapakilala ng isang pangyayari sa hinaharap. Likas sa modernong Tagalog ang “At kapag” at pinananatili nito ang temporal na diwa.
- source_word: תָבֹוא אֶל הָאָרֶץ
  choice: pumasok ka na sa lupain
  rationale: Ang בוא kasama ng אֶל ay tumutukoy sa pagpasok, hindi lamang sa paglapit. Ang “ka” ay nagpapanatili sa ikalawang panauhang isahan ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili nito ang anyong may hulaping ikalawang panauhang isahan at ang tipanang pagtukoy sa Diyos ng Israel.
- source_word: נֹתֵן לְךָ
  choice: ibinibigay sa iyo
  rationale: Ang participle na נֹתֵן ay nagpapahiwatig ng kasalukuyan o nalalapit na pagkilos; likas sa Tagalog ang aspektong imperpektibo ng “ibinibigay.”
- source_word: נַחֲלָה
  choice: bilang mana
  rationale: Ang נַחֲלָה ay minanang o itinakdang pag-aari. Pinananatili ng “mana” ang tipanang kahulugan nang hindi nagiging mabigat ang parirala.
- source_word: וִירִשְׁתָּהּ
  choice: at inangkin mo na iyon
  rationale: Sa konteksto ng lupain, ang ירשׁ ay tumutukoy sa pagkuha o pag-angkin ng pag-aari. Ang “inangkin” ay nagpapahayag ng aktibong pagkuha nang hindi inuulit ang “mana.”
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: at nanirahan ka roon
  rationale: Ang ישׁב ay maaaring mangahulugang manirahan o mamalagi. Ang “nanirahan ka roon” ay natural at malinaw na nagpapahayag ng matatag na paninirahan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng kaloob ng Diyos at pag-angkin ng Israel sa lupain
  choice: 'Pinanatili ang pagkakasunod-sunod: ibinibigay ng Diyos ang lupain bilang mana, saka ito inaangkin at tinitirhan ng Israel.'
  alternative: Pagsamahin ang mga kilos sa isang payak na pahayag tungkol sa pagtanggap ng lupain.
  rationale: Magkaiba ngunit magkaugnay sa Hebreo ang banal na pagkakaloob at ang kasunod na pag-angkin at paninirahan; hindi dapat burahin ang tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lupain” upang tukuyin ang teritoryo, “mana” para sa tipanang kaloob, at mga likas na pandiwang Tagalog. Pinanatili ang ikalawang panauhang isahan at ang pangungusap na bukas ang sintaks sapagkat nagpapatuloy ang diwa sa susunod na talata.
