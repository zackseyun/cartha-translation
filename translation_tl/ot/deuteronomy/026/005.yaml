base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: tl
  text: 'At sasagot ka at magsasabi sa harap ni Yahweh, na iyong Diyos: “Ang aking ama ay isang Arameong pagala-gala[a]. Bumaba siya sa Ehipto at nanirahan doon bilang dayuhan, kasama ang iilang tao. At doon siya naging isang bansang malaki, makapangyarihan, at matao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari rin itong isalin: “Ang aking ama ay isang Arameong nanganganib na mapahamak.” Ang participle sa Hebreo ay maaaring mangahulugang “pagala-gala” o “nanganganib na mapahamak.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: At sasagot ka at sasabihin
  rationale: Pinananatili ang tambalang pormulang Hebreo na nagpapakilala sa isang pormal na pagbigkas sa seremonya.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: sa harap ni Yahweh na iyong Diyos
  rationale: Likas na katumbas ng לִפְנֵי at tuwirang pinangalanan ang YHWH bilang Yahweh ayon sa patakaran ng proyekto.
- source_word: אֲרַמִּי אֹבֵד אָבִי
  choice: Ang aking ama ay isang Arameong pagala-gala
  rationale: Ang 'Arameo' ang tiyak na katawagang etniko. Ang participle na אֹבֵד ay maaaring mangahulugang pagala-gala o napapahamak; pinili sa teksto ang una dahil akma ito sa kasunod na salaysay ng pandarayuhan, habang pinananatili sa talababa ang tunay na alternatibo.
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: Bumaba siya sa Ehipto
  rationale: Pinananatili ang karaniwang Hebreong direksiyonal na idyoma ng pagbaba patungong Ehipto.
- source_word: וַיָּגָר שָׁם
  choice: nanirahan doon bilang dayuhan
  rationale: Ipinahahayag ang diwa ng גור na paninirahan bilang dayuhan o dayuhang naninirahan, nang hindi gumagamit ng makalumang salita.
- source_word: בִּמְתֵי מְעָט
  choice: kasama ang iilang tao
  rationale: Likas sa Tagalog at malinaw na tumutukoy sa maliit na bilang ng pangkat na kasama niya.
- source_word: וַיְהִי שָׁם לְגוֹי
  choice: At doon siya naging isang bansa
  rationale: 'Pinananatili ang isahang kinatawang paksa: ang ninuno ay naging bansa sa pamamagitan ng kanyang mga inapo.'
- source_word: גָּדוֹל עָצוּם וָרָב
  choice: dakila, makapangyarihan, at napakarami
  rationale: Pinananatili ang tatluhang diin sa laki, lakas, at dami sa natural na makabagong Tagalog.
theological_decisions:
- issue: Kahulugan ng אֲרַמִּי אֹבֵד אָבִי
  choice: Ang aking ama ay isang Arameong pagala-gala
  alternative: Ang aking ama ay isang Arameong napapahamak
  rationale: Kapwa posible sa leksikon ang 'pagala-gala' at 'napapahamak.' Ang una ay maayos na kaugnay ng paglusong at paninirahan bilang dayuhan; inilalagay sa talababa ang ikalawa upang hindi alisin ang tunay na kalabuan ng Hebreo. Hindi pinili ang mas interpretibong 'Isang Arameo ang nagtangkang lumipol sa aking ama' sapagkat hindi iyon ang pinakasimpleng pagbasa ng tekstong Masoretiko.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na himig ng liturhikong pagpapahayag, ngunit iniwasan ang mga salitang makaluma o hindi madaling maunawaan.
