revisions:
- from: Pagkatapos ay sasabihin mo sa harap ni Yahweh na iyong Diyos, “Inalis ko na sa bahay ang banal na bahagi[a], at ibinigay ko rin ito sa Levita, sa dayuhang naninirahan dito[b], sa ulila[c], at sa biyuda, ayon sa buong utos na iniutos mo sa akin. Hindi ko nilabag ang iyong mga utos, at hindi ko kinalimutan ang mga iyon.”
  to: Pagkatapos ay sasabihin mo sa harapan ni Yahweh, ang iyong Diyos, “Inalis ko na mula sa bahay ang banal na bahagi[a], at ibinigay ko rin ito sa Levita, sa dayuhang naninirahan[b], sa ulila[c], at sa biyuda, ayon sa lahat ng utos na iniutos mo sa akin. Hindi ko nilabag ang iyong mga utos ni hindi ko kinalimutan ang mga ito.”
  rationale: Pinahusay ang katapatan sa direksiyong “mula sa bahay,” inalis ang hindi kailangang “dito” at “permanenteng” sa paglalarawan ng residenteng dayuhan, at ginawang mas likas ang kolektibong utos at ang pangwakas na magkaugnay na pagtanggi. Pinanatili ang Yahweh, ang ritwal na rehistro, ang mga kategoryang panlipunan, at ang mga angkla ng talababa sa mismong mga terminong ipinapaliwanag.
