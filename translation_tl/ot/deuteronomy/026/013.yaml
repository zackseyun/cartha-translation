language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: tl
  text: Pagkatapos ay sasabihin mo sa harapan ni Yahweh, ang iyong Diyos, “Inalis ko na mula sa bahay ang banal na bahagi[a], at ibinigay ko rin ito sa Levita, sa dayuhang naninirahan[b], sa ulila[c], at sa biyuda, ayon sa lahat ng utos na iniutos mo sa akin. Hindi ko nilabag ang iyong mga utos ni hindi ko kinalimutan ang mga ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sagradong bahagi” o “banal na bagay.” Tumutukoy ang Hebreo sa ikapu o ani na itinalaga upang ipamahagi.
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa isang dayuhang naninirahan sa pamayanan, hindi lamang sa pansamantalang bisita.
    reason: lexical_clarification
  - marker: c
    text: Maaari ring “walang ama.” Ang salitang Hebreo ay tumutukoy lalo na sa batang walang ama, isang karaniwang kategorya ng mga mahina at nangangailangan sa kautusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Pagkatapos ay sasabihin mo
  rationale: Ipinahihiwatig ng waw na nagpapatuloy ang sunod-sunod na ritwal na tagubilin; natural na ipinapahayag ito ng “Pagkatapos” sa Tagalog.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: sa harap ni Yahweh na iyong Diyos
  rationale: Tuwirang inilalarawan ng לִפְנֵי ang pagsasalita sa presensiya ng Diyos, at pinananatili ang pangalang tipan na Yahweh.
- source_word: בִּעַרְתִּי
  choice: Inalis ko na
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa ganap na pag-aalis ng ikapu o bahaging itinalaga, hindi sa literal na pagsunog.
- source_word: הַקֹּדֶשׁ
  choice: ang banal na bahagi
  rationale: Literal itong “ang banal na bagay,” ngunit sa konteksto ay ang itinalagang ani o ikapu na ipamamahagi; malinaw at hindi labis na nagpapaliwanag ang “banal na bahagi.”
- source_word: מִן הַבַּיִת
  choice: sa bahay
  rationale: Kasama ng pandiwang “inalis,” likas sa Tagalog ang “inalis ... sa bahay” para sa Hebreong “mula sa bahay,” nang hindi idinaragdag ang “aking.”
- source_word: לַלֵּוִי
  choice: sa Levita
  rationale: Levita ang tahasang kategoryang binanggit; hindi ito nililimitahan sa mga paring Levita.
- source_word: לַגֵּר
  choice: sa dayuhang naninirahan dito
  rationale: Ang גֵּר ay isang dayuhang naninirahan sa pamayanan, hindi lamang isang bisita o di-kilalang tao.
- source_word: לַיָּתוֹם
  choice: sa ulila
  rationale: Ang “ulila” ang natural na modernong Tagalog para sa kategoryang mahina at walang magulang o ama na tinutukoy ng יָתוֹם.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: ayon sa buong utos na iniutos mo sa akin
  rationale: Pinananatili ang kolektibong isahan ng מִצְוָה at ang sadyang pag-uulit ng salitang-ugat na “utos,” bagaman bahagyang paulit-ulit din sa Tagalog.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: Hindi ko nilabag ang iyong mga utos
  rationale: Sa legal na kontekstong ito, ang עבר מן ay nangangahulugang lumabag o sumuway, hindi lamang literal na lumampas.
- source_word: וְלֹא שָׁכָחְתִּי
  choice: at hindi ko kinalimutan ang mga iyon
  rationale: Ipinakikita ng idinagdag na “ang mga iyon” ang ipinahihiwatig na layon—ang mga utos—nang hindi binabago ang kahulugan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng הַקֹּדֶשׁ sa pahayag tungkol sa ikapu
  choice: banal na bahagi
  alternative: banal na bagay; bahaging itinalaga
  rationale: Pinananatili ng “banal” ang teolohikal na diwa ng bagay na ibinukod para sa Diyos, habang ipinahihiwatig ng “bahagi” ang ani o ikapung ipinamamahagi nang hindi tinutukoy nang higit sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyo ng isang taimtim na ritwal na pahayag, ang pag-uulit ng “utos,” at ang pagkakaiba ng kolektibong “buong utos” at ng kasunod na maramihang “mga utos.”
