  source_fidelity: Kailangan ng ilang maliit ngunit mahalagang pagbabago para maging mas tumpak ang direksiyon ng מִן הַבַּיִת (“mula sa bahay”), maiwasan ang deiktikong dagdag sa pagsasalin ng גֵּר, at maipahayag nang mas malinaw ang saklaw ng pangwakas na dalawang pagtanggi.
  naturalness: Marangal at madaling maunawaan ang draft, ngunit mas natural ang “sa harapan ni Yahweh, ang iyong Diyos,” “mula sa bahay,” at ang magkatuwang na anyong “ni ... ko ...” sa huling sugnay.
  terminology: Ang “banal na bahagi,” “Levita,” “ulila,” at “biyuda” ay angkop. Ang “dayuhang naninirahan dito” ay masyadong deiktiko at ang “permanenteng” nasa talababa ay isang di-kinakailangang paghihigpit sa kahulugan ng גֵּר.
