    issue: “Inalis ko na sa bahay” para sa מִן הַבַּיִת
    rationale: 'Maaaring unawain ang “sa bahay” bilang lokasyon ng pag-aalis. Ang Hebreo ay malinaw na nagsasaad ng pinagmulan: “mula sa bahay.”'
  - severity: low
    issue: “dayuhang naninirahan dito” at “permanenteng naninirahan”
    rationale: Ang “dito” ay nagdaragdag ng deiktikong punto na wala sa teksto, at ang “permanente” ay maaaring magpahiwatig ng mas tiyak na legal o temporal na katayuan kaysa sa ipinahihiwatig ng גֵּר. Sapat ang “dayuhang naninirahan.”
  - severity: low
    issue: “ayon sa buong utos”
    rationale: Bagaman isahan ang מִצְוָה, kolektibo ang gamit nito. Ang “lahat ng utos” ay mas natural sa modernong Tagalog at malinaw na tumutugma sa saklaw ng pahayag.
  - severity: low
    issue: Pangwakas na pagtanggi
    rationale: Mas malinaw na maipapakita ang magkatuwang na “hindi ... ni hindi ...” at ang tinutukoy na mga utos nang hindi nagdaragdag ng kahulugan.
