  text: הַשְׁקִיפָ/ה֩ מִ/מְּע֨וֹן קָדְשְׁ/ךָ֜ מִן הַ/שָּׁמַ֗יִם וּ/בָרֵ֤ךְ אֶֽת עַמְּ/ךָ֙ אֶת יִשְׂרָאֵ֔ל וְ/אֵת֙ הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּה לָ֑/נוּ כַּ/אֲשֶׁ֤ר נִשְׁבַּ֨עְתָּ֙ לַ/אֲבֹתֵ֔י/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: tl
  text: Tumingin ka mula sa iyong banal na tahanan, mula sa langit, at pagpalain mo ang iyong bayang Israel at ang lupang ibinigay mo sa amin, gaya ng isinumpa mo sa aming mga ninuno[a]—isang lupaing umaapaw sa gatas at pulot-pukyutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ama.” Ang Hebreo ay “mga ama,” na tumutukoy sa mga patriyarka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: Dumungaw ka
  rationale: Ipinahihiwatig ng pandiwang pautos ang pagtingin mula sa isang mataas na kinaroroonan. Likas sa Tagalog ang “dumungaw” at malinaw na kaakibat nito ang pananaw mula sa langit.
- source_word: מִמְּעוֹן קָדְשְׁךָ
  choice: mula sa iyong banal na tahanan
  rationale: Ang מָעוֹן ay tirahan o tahanan. Pinananatili ng “banal na tahanan” ang sagradong katangian at gumagamit ng dignificado ngunit karaniwang pananalita.
- source_word: מִן הַשָּׁמַיִם
  choice: mula sa langit
  rationale: Bagaman pormang maramihan sa Hebreo, ang “langit” ang likas na lokatibong katumbas sa modernong Tagalog.
- source_word: וּבָרֵךְ
  choice: at pagpalain mo
  rationale: Tuwirang pautos ito ng ברך; malinaw at karaniwan sa panalangin ang “pagpalain mo.”
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: ang iyong bayang Israel
  rationale: Ang Israel ay appositional na pagkakakilanlan ng bayan. Maikli at likas sa Tagalog ang “iyong bayang Israel.”
- source_word: הָאֲדָמָה
  choice: ang lupain
  rationale: Sa konteksto, tumutukoy ito sa lupaing ipinagkaloob sa Israel. Mas likas ang “lupain” kaysa “lupa” o “sakahan,” at naiiba pa rin sa kasunod na paglalarawan sa lupain bilang masaganang bansa.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: na ibinigay mo sa amin
  rationale: Ipinapahayag nito ang natapos na pagkakaloob. Ang payak na nagdaang anyo ang pinakanatural sa Tagalog at hindi nawawala ang nananatiling kabuluhan ng kaloob.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: gaya ng isinumpa mo sa aming mga ninuno
  rationale: Sa pormulang tipan, tumutukoy ang “mga ama” sa naunang salinlahi, lalo na sa mga patriyarka. Ang “mga ninuno” ay likas, tumpak sa saklaw, at hindi nagpapahiwatig na sa sariling ama lamang ng nagsasalita ginawa ang panunumpa.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: isang lupaing dinadaluyan ng gatas at pulot-pukyutan
  rationale: Pinananatili nito ang matingkad na idyomang Hebreo ng kasaganaan. Ang “pulot-pukyutan” ay malinaw na honey sa modernong Filipino.
theological_decisions:
- issue: Saklaw ng לַאֲבֹתֵינוּ sa pormulang tipan
  choice: sa aming mga ninuno
  alternative: sa aming mga ama
  rationale: Literal na panlalaking maramihan ang Hebreo, ngunit sa konteksto ay pormulang tumutukoy sa mga ninunong tumanggap ng pangako, partikular sa mga patriyarka. Ang “mga ninuno” ang natural na katumbas sa Tagalog nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
- issue: Larawan ng banal na tirahan at langit
  choice: mula sa iyong banal na tahanan, mula sa langit
  alternative: mula sa langit na iyong banal na tahanan
  rationale: Pinananatili ang dalawang magkatabing pariralang pinagmulan sa Hebreo sa halip na tahasang pag-isahin ang mga ito, kaya hindi nilulutas nang higit sa teksto ang ugnayan ng “banal na tahanan” at “langit.”
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at angkop sa panalangin. Ginamit ang “Dumungaw ka” upang ihatid ang pagtingin mula sa itaas, at pinanatili ang tradisyonal na larawang “gatas at pulot-pukyutan” nang hindi ginagawang paliwanag lamang ang idyoma.
