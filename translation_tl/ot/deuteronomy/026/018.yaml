base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: tl
  text: Ipinahayag ngayon ni Yahweh na ikaw ay magiging bayan na kanyang natatanging pag-aari[a], gaya ng ipinangako niya sa iyo[b], at na susundin mo ang lahat ng kanyang mga utos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang bayang itinatangi”; sa Hebreo, “isang bayan, isang natatanging pag-aari.”
    reason: lexical_alternative
  - marker: b
    text: O “gaya ng sinabi niya sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: ni Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos upang tuwirang katawanin ang יהוה sa tekstong Hebreo.
- source_word: הֶאֱמִירְךָ
  choice: ipinahayag ... na ikaw ay
  rationale: Ang bihirang anyong Hiphil ng אמר ay may pormal at tipanang diwa rito. Malinaw ang “ipinahayag” at hindi nito dinaragdagan ang teksto ng mas tiyak na ideya gaya ng “pinili.”
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Likas na makabagong katumbas ito ng “sa araw na ito” at pinananatili ang agarang diwa ng pahayag-tipanan.
- source_word: לִהְיוֹת לוֹ
  choice: na ikaw ay kanyang
  rationale: Ipinapahayag ng pariralang pawatas ang itinakdang kalagayan ng Israel bilang bayan na pag-aari niya.
- source_word: לְעַם סְגֻלָּה
  choice: bayang itinatangi
  rationale: Pinananatili ng “bayan” ang tahasang עַם at ipinahihiwatig ng “itinatangi” ang mataas na halaga at natatanging pagmamay-ari sa סְגֻלָּה.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: gaya ng ipinangako niya sa iyo
  rationale: Bagaman literal na “gaya ng sinabi niya sa iyo,” tumutukoy ang pananalita sa naunang pangako ng Diyos sa konteksto ng tipan. Inilalagay sa talababa ang mas literal na posibilidad.
- source_word: וְלִשְׁמֹר
  choice: at dapat mong sundin
  rationale: Kapag mga utos ang layon, ang שׁמר ay nangangahulugang tuparin o sundin ang mga iyon. Ipinakikita ng “dapat” ang kaugnayan nito sa pahayag na kung ano ang nararapat gawin ng bayan.
- source_word: כָּל מִצְוֺתָיו
  choice: ang lahat ng kanyang mga utos
  rationale: Tuwirang pinananatili nito ang kabuuan at ang bokabularyo ng kautusang nakapaloob sa tipan.
theological_decisions:
- issue: Ang tipanang puwersa ng bihirang pandiwang הֶאֱמִיר
  choice: pormal na pahayag ng Diyos sa loob ng tipan
  alternative: pagpili sa Israel, o ang mas literal ngunit hindi likas na pananalitang tumutukoy sa kapwa pagpapatotoo
  rationale: Ipinahahayag ng talata ang katayuan ng Israel sa tipan. Ang “ipinahayag” ay nagpapanatili sa puwersang ito nang hindi ipinapasok ang mas tiyak na doktrina ng pagpili na hindi tahasang sinasabi ng pandiwa.
- issue: Ang isahang ikalawang panauhan sa pakikipag-usap sa Israel
  choice: “ikaw/iyo/mo” bilang kolektibong isahan
  alternative: “kayo/inyo/ninyo” bilang likas na maramihang pagtukoy sa buong bayan
  rationale: Pinananatili ng isahan ang paraan ng Hebreo na kausapin ang Israel bilang iisang bayang-tipanan, bagaman kolektibo ang tinutukoy.
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang kolektibong isahang pakikipag-usap sa Israel at iniwasan ang arkaiko o labis na teknikal na pananalita.
