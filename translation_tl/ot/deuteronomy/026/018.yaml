  to: Ipinahayag ngayon ni Yahweh na ikaw ay magiging bayan na kanyang natatanging pag-aari[a], gaya ng ipinangako niya sa iyo[b], at na susundin mo ang lahat ng kanyang mga utos.
  rationale: Binago ang pangunahing katumbas ng סְגֻלָּה upang malinaw na maisama ang diwa ng natatanging pag-aari, habang pinananatili ang tahasang “bayan.” Inayos din ang pagkakaugnay ng huling sugnay upang malinaw na kapwa ang katayuan ng bayan at ang pagsunod sa mga utos ay saklaw ng ipinahayag ni Yahweh.
