  - severity: low
    issue: Ang “at dapat mong sundin” ay maaaring basahin bilang malayang utos sa halip na ikalawang nilalaman ng pormal na deklarasyon.
    rationale: Ang pag-uulit ng “na” bago ang ikalawang sugnay ay higit na malinaw na kumakatawan sa magkakaugnay na infinitive clauses ng Hebreo.
