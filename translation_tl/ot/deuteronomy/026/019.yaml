reference: Deuteronomy 26:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּֽ/לְ/תִתְּ/ךָ֣ עֶלְי֗וֹן עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִ/תְהִלָּ֖ה וּ/לְ/שֵׁ֣ם וּ/לְ/תִפְאָ֑רֶת וְ/לִֽ/הְיֹתְ/ךָ֧ עַם קָדֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ כַּ/אֲשֶׁ֥ר דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: tl
  text: at upang itaas niya kayo nang higit sa lahat ng bansang ginawa niya, para sa papuri, katanyagan[a], at kaluwalhatian[b], at upang kayo ay maging isang banal na bayang nauukol sa PANGINOON na inyong Diyos, ayon sa sinabi niya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pangalan”; maaari itong tumukoy sa reputasyon o katanyagan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “karilagan” o “kagandahan”; malawak ang saklaw ng salitang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ayon sa ipinangako niya”; sa literal, “ayon sa sinalita niya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם
  choice: at upang itaas niya kayo nang higit sa lahat ng bansa
  rationale: Ipinahahayag ng נתן kasama ng עֶלְיוֹן at עַל ang paglalagay sa Israel sa mataas na kalagayan kung ihahambing sa mga bansa. Ang “itaas ... nang higit” ay natural sa modernong Tagalog at pinananatili ang paghahambing.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Karaniwang pandiwa ang עשה para sa “gumawa.” Hindi ito pinalakas tungo sa “nilikha,” bagaman maaaring maunawaan sa konteksto na ang Diyos ang lumikha sa mga bansa.
- source_word: לִתְהִלָּה
  choice: para sa papuri
  rationale: Pinananatili ang pangngalang abstrakto at ang serye ng tatlong pariralang may לְ na nagsasaad ng layunin o bunga.
- source_word: וּלְשֵׁם
  choice: katanyagan
  rationale: Bagaman literal na “pangalan,” madalas ipahiwatig ng שֵׁם ang reputasyon o pagkabantog. Ang “katanyagan” ang natural na katumbas sa kontekstong ito; inilalahad sa talababa ang literal na larawan.
- source_word: וּלְתִפְאָרֶת
  choice: at kaluwalhatian
  rationale: Maaaring tumukoy ang תִּפְאָרֶת sa kagandahan, karilagan, o kaluwalhatian. Ang “kaluwalhatian” ay marangal at malinaw sa seryeng ito, habang pinananatili sa talababa ang lawak ng kahulugan.
- source_word: וְלִהְיֹתְךָ עַם קָדוֹשׁ לַיהוָה אֱלֹהֶיךָ
  choice: at upang kayo ay maging isang banal na bayang nauukol sa PANGINOON na inyong Diyos
  rationale: Ipinagpapatuloy ng infinitive ang layunin o bunga. Nililinaw ng “nauukol sa” ang relasyon at pag-aari na ipinahihiwatig ng לַ, nang hindi nagdaragdag ng denominasyonal na paliwanag.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: ayon sa sinabi niya
  rationale: Ang דבר ay “nagsalita/nagsabi,” hindi tahasang “nangako.” Ang salin ay malapit sa Hebreo at natural sa Tagalog, habang ang posibleng diwang pangako ay binabanggit sa talababa.
theological_decisions:
- issue: Kung gagawing tahasang pangako ang pangwakas na sugnay
  choice: ayon sa sinabi niya
  alternative: ayon sa ipinangako niya
  rationale: Ang pandiwang Hebreo ay karaniwang nangangahulugang “nagsalita” o “nagsabi.” Bagaman maaaring may diwa ng pangako sa konteksto ng tipan, hindi iyon tahasang isinasaad ng pandiwa.
- issue: Paglalahad sa pangalan ng Diyos na יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang tradisyonal at madaling makilalang anyong “PANGINOON” sa malalaking titik bilang pantukoy sa banal na pangalan, nang hindi pinagtitibay ang isang partikular na bigkas.
- issue: Kung kanino nauukol ang papuri, katanyagan, at kaluwalhatian
  choice: pinanatili ang nominal at di-tiyak na seryeng “para sa papuri, katanyagan, at kaluwalhatian”
  alternative: upang purihin, patanyagin, at luwalhatiin kayo
  rationale: Hindi tahasang tinutukoy ng Hebreo ang tagaganap o tumatanggap sa bawat pangngalan. Ang nominal na anyo ay umiiwas sa tahimik na paglutas sa tunay na sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayo” para sa kolektibong Israel kahit isahan ang anyong Hebreo. Pinanatili ang magkakatulad na nominal na parirala upang hindi labis na ipaliwanag ang ugnayan ng “papuri, katanyagan, at kaluwalhatian.”
