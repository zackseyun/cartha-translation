  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: tl
  text: At inilabas tayo ni Yahweh mula sa Ehipto sa pamamagitan ng malakas na kamay, nakaunat na bisig, matinding sindak[a], at mga tanda at mga kababalaghan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matinding pagkamangha” o “dakilang pagpapamalas na pumupukaw ng pagkamangha.” Ang salitang Hebreo ay maaaring tumukoy sa takot, sindak, o sa isang pagpapamalas na nagdudulot ng matinding pagkamangha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: inilabas tayo
  rationale: Ang Hiphil ng יצא ay nangangahulugang magpalabas o magdala palabas. Likas sa Filipino ang “inilabas tayo” at malinaw nitong pinananatili ang diwa ng Exodo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Tuwirang ipinahahayag ng “mula sa Ehipto” ang pinanggalingan at natural itong kaakibat ng pandiwang “inilabas.”
- source_word: בְּיָד חֲזָקָה
  choice: sa pamamagitan ng malakas na kamay
  rationale: Pinananatili nito ang Hebreong larawang tumutukoy sa makapangyarihang pagkilos, habang malapit na tinutumbasan ang חֲזָקָה bilang “malakas.”
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: at nakaunat na bisig
  rationale: Ang “nakaunat na bisig” ay malinaw at malapit na katumbas ng pariralang Hebreo at nagpapanatili sa tradisyonal na larawan ng kapangyarihan ng Diyos.
- source_word: וּבְמֹרָא גָּדֹל
  choice: nang may matinding sindak
  rationale: Maaaring tumukoy ang מוֹרָא sa takot, sindak, o pagpapamalas na pumupukaw ng pagkamangha. Ang “matinding sindak” ay angkop sa mabibigat na ginawa laban sa Ehipto, ngunit itinatala sa talababa ang tunay na lawak ng kahulugan.
- source_word: וּבְאֹתוֹת
  choice: at may mga tanda
  rationale: Ang “mga tanda” ang tuwirang katumbas ng אוֹתוֹת; hindi na idinagdag ang “mahimalang” dahil ipinahihiwatig na iyon ng konteksto.
- source_word: וּבְמֹפְתִים
  choice: at mga kababalaghan
  rationale: Ang “mga kababalaghan” ay natural na katambal ng “mga tanda” at nagpapahayag ng mga gawang pumupukaw ng paghanga o pagkamangha.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Lawak ng kahulugan ng מוֹרָא sa pormula ng Exodo
  choice: matinding sindak
  alternative: matinding pagkamangha; dakilang pagpapamalas na pumupukaw ng pagkamangha
  rationale: Binibigyang-diin ng pangunahing salin ang nakapanghihilakbot na epekto ng mga ginawa sa Ehipto, ngunit hindi itinatanggi ang posibilidad na ang salita ay tumukoy sa pagkamangha o sa isang kahanga-hanga at nakatatakot na pagpapamalas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga konkretong larawang “kamay” at “bisig,” gayundin ang tambalang “mga tanda at mga kababalaghan.” Inilagay ang talababa pagkatapos ng “matinding sindak,” ang pariralang aktuwal nitong nililinaw.
