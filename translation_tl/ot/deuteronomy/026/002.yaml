revisions:
- from: Kumuha ka ng bahagi sa mga unang bunga[a] ng lahat ng ani ng lupa na dinadala mo mula sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos. Ilagay mo ang mga iyon sa isang basket, at pumunta ka sa lugar na pipiliin ni Yahweh na iyong Diyos upang doon niya patirahin ang kanyang pangalan.[b]
  to: Kumuha ka ng bahagi ng mga unang bunga[a] ng lahat ng ani mula sa iyong lupain na ibinibigay sa iyo ni Yahweh na iyong Diyos. Ilagay mo ang mga iyon sa isang basket, at pumunta ka sa lugar na pipiliin ni Yahweh na iyong Diyos upang doon niya patirahin ang kanyang pangalan.[b]
  rationale: Inayos ang maling "bahagi sa" tungo sa likas na "bahagi ng" at ginawang mas tuwiran ang pariralang tumutukoy sa lupain na ibinibigay ni Yahweh. Hindi binago ang kahulugan, ang pananaw na panghinaharap ng "pipiliin," o ang sinadyang idyomatikong "patirahin ang kanyang pangalan."
