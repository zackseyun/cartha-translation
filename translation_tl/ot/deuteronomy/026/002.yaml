source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: tl
  text: Kumuha ka ng bahagi ng mga unang bunga[a] ng lahat ng ani mula sa iyong lupain na ibinibigay sa iyo ni Yahweh na iyong Diyos. Ilagay mo ang mga iyon sa isang basket, at pumunta ka sa lugar na pipiliin ni Yahweh na iyong Diyos upang doon niya patirahin ang kanyang pangalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “mula sa unang bahagi ng lahat ng ani ng lupa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “upang doon niya patirahin ang kanyang pangalan,” isang pormula sa Deuteronomio para sa lugar na pinili ni Yahweh bilang sentro ng pagsamba at tanda ng kanyang presensiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kumuha ka
  rationale: Ang anyong perpekto na may pang-ugnay ay bahagi ng sunod-sunod na tagubilin sa batas; likas sa modernong Tagalog ang tuwirang pautos.
- source_word: מֵרֵאשִׁית כָּל פְּרִי הָאֲדָמָה
  choice: ng bahagi sa mga unang bunga ng lahat ng ani ng lupa
  rationale: Ipinahihiwatig ng מִן na bahagi lamang mula sa unang ani ang kukunin. Pinananatili ng “unang bunga” ang konsepto ng firstfruits, samantalang nililinaw ng “ani ng lupa” na hindi lamang prutas ng punongkahoy ang tinutukoy.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: na dinadala mo mula sa lupaing
  rationale: Pinananatili ng “dinadala” ang kahulugan ng Hiphil ng בוא nang hindi ito nililimitahan sa mismong pag-aani.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: ibinibigay sa iyo ni Yahweh na iyong Diyos
  rationale: Ang aspektong nagpapatuloy ng participle נֹתֵן ay naipahahayag ng “ibinibigay,” na nagdiriin na ang lupain ay kaloob ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: Ilagay mo ang mga iyon sa isang basket
  rationale: Ang טֶנֶא ay basket na lalagyan ng ani. Ang “mga iyon” ay tumutukoy nang natural sa nakolektang mga unang bunga.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: at pumunta ka sa lugar
  rationale: Tuwirang isinasalin ang kasunod na utos at pinananatili ang mahalagang salitang “lugar” sa bokabularyo ng Deuteronomio.
- source_word: אֲשֶׁר יִבְחַר
  choice: na pipiliin
  rationale: Ipinananatili ng panghinaharap ang pananaw ng talumpati ni Moises bago pa piliin ang pook ng santuwaryo.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: upang doon niya patirahin ang kanyang pangalan
  rationale: Pinananatili ng “patirahin” ang causative na diwa ng Hiphil at ang natatanging teolohikal na idyoma, sa halip na gawing simpleng pagtatalaga o pagmamay-ari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili nito sa halip na palitan ng titulo.
- issue: 'Pormula tungkol sa piniling santuwaryo: לְשַׁכֵּן שְׁמוֹ שָׁם'
  choice: upang doon niya patirahin ang kanyang pangalan
  alternative: upang ilagay roon ang kanyang pangalan
  rationale: Pinananatili ng salin ang larawan ng pangalan ng Diyos na pinatitira sa piniling lugar at hindi ipinapakahulugang ang Diyos mismo ay nakukulong sa isang lokasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang pautos, karaniwang bokabularyong pang-agrikultura, at ang pangalang “Yahweh.” Pinanatili ang bahagyang di-pangkaraniwang idyoma ng pagpapatira sa pangalan dahil mahalaga ito sa teolohiya at pananalita ng Deuteronomio.
