  text: אֶת יְהוָ֥ה הֶאֱמַ֖רְתָּ הַ/יּ֑וֹם לִ/הְיוֹת֩ לְ/ךָ֨ לֵֽ/אלֹהִ֜ים וְ/לָ/לֶ֣כֶת בִּ/דְרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר חֻקָּ֧י/ו וּ/מִצְוֺתָ֛י/ו וּ/מִשְׁפָּטָ֖י/ו וְ/לִ/שְׁמֹ֥עַ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: tl
  text: Ngayon ay ipinahayag mong si Yahweh ang iyong Diyos, at lalakad ka sa kanyang mga daan, tutuparin ang kanyang mga tuntunin, mga utos, at mga hatol, at makikinig sa kanyang tinig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “makikinig sa kanyang tinig” ay maaari ring mangahulugang “tatalima” o “susunod,” sapagkat ang Hebreong pananalita ay may diwa ng masunuring pakikinig.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הֶאֱמַרְתָּ
  choice: taimtim mong kinilala
  rationale: Ang di-karaniwang Hiphil ng אמר ay tumutukoy rito sa pormal at tipanang pagpapahayag o pagkilala; likas sa modernong Tagalog ang 'taimtim mong kinilala' at hindi ito basta karaniwang pagsasalita lamang.
- source_word: הַיּוֹם
  choice: Ngayon
  rationale: Direkta at natural na katumbas ng temporal na diin ng הַיּוֹם.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: bilang iyong Diyos
  rationale: Malinaw at natural na ipinahahayag ang tipanang ugnayang 'maging Diyos mo' nang hindi nagdaragdag ng paliwanag.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: nangakong lalakad ka sa kanyang mga daan
  rationale: Pinananatili ang biblikal na larawang 'lumakad sa kanyang mga daan'; ipinahihiwatig ng 'nangakong' ang kaugnayan ng mga infinitive sa pormal na pagkilala, sa paraang malinaw sa Tagalog.
- source_word: חֻקָּיו
  choice: kanyang mga tuntunin
  rationale: Ang 'mga tuntunin' ay malinaw at marangal na salin para sa mga itinakdang batas o kautusan.
- source_word: מִצְוֺתָיו
  choice: mga utos
  rationale: Karaniwan at tumpak na salin ng מִצְוֹת sa modernong Tagalog.
- source_word: מִשְׁפָּטָיו
  choice: mga hatol
  rationale: Pinananatili ang natatanging aspektong legal at hudisyal ng מִשְׁפָּטִים at hindi ito isinasanib sa 'mga tuntunin' o 'mga utos.'
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: makikinig sa kanyang tinig
  rationale: Pinananatili ang literal na larawan ng pakikinig sa tinig habang nananatiling malinaw sa konteksto ang diwa ng pagsunod.
theological_decisions:
- issue: Pormula ng tipanang pagpapahayag at ang saklaw ng mga kasunod na infinitive
  choice: Inilahad ang Israel bilang taimtim na kumikilala kay Yahweh bilang Diyos nito at nangangakong tuparin ang mga kasunod na pananagutan.
  alternative: 'Maaaring panatilihin nang mas literal ang sunod-sunod na infinitive: ''upang maging Diyos mo, at upang lumakad... at upang tuparin...'''
  rationale: Ang di-karaniwang pandiwang הֶאֱמַרְתָּ at ang mga infinitive ay may pormal na puwersang tipanan. Nililinaw ng salin ang kanilang ugnayan nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Pakikinig o pagsunod sa tinig
  choice: makikinig sa kanyang tinig
  alternative: susunod sa kanyang tinig
  rationale: Ang שׁמע בְּקוֹל ay may diwa ng masunuring pakikinig, ngunit pinananatili ng pangunahing teksto ang konkretong larawan at tunay na lawak ng Hebreo; ipinaliliwanag ng talababa ang kontekstuwal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang tipanang larawang 'lalakad sa kanyang mga daan' at ang pagkakaiba ng mga tuntunin, utos, at hatol; iniwasan ang arkaikong pananalita at denominasyonal na pagpapakahulugan.
