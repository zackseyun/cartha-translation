  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: tl
  text: At magalak ka sa lahat ng mabuting bagay na ibinigay ni Yahweh na iyong Diyos sa iyo at sa iyong sambahayan—ikaw, ang Levita, at ang dayuhang naninirahan sa piling mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa isang dayuhang naninirahan sa Israel sa ilalim ng pangangalaga ng pamayanan; maaari ring isaling “nakikipamayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: At magalak ka
  rationale: Ang anyong pandiwa sa kontekstong pantagubilin ay may puwersang pautos. Likas at marangal sa modernong Tagalog ang “magalak,” at pinananatili nito ang masaya at pangkapistahang diwa.
- source_word: בְכָל הַטּוֹב
  choice: sa lahat ng mabuting bagay
  rationale: Ipinahihiwatig ng parirala ang kabuuan ng kabutihan o pagpapalang tinanggap. Ang “mabuting bagay” ay mas likas sa Tagalog kaysa sa abstraktong “lahat ng mabuti” sa pangungusap na ito.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: na ibinigay sa iyo
  rationale: Tuwirang inilalahad ang natapos na pagbibigay at pinananatili ang layon na “sa iyo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Pinananatili ang tipanang ugnayang ipinapahayag ng hulaping panghalip; ang “iyong Diyos” ay malinaw at likas sa marangal na Tagalog.
- source_word: וּלְבֵיתֶךָ
  choice: at sa iyong sambahayan
  rationale: Ang בַּיִת dito ay tumutukoy sa yunit ng pamilya at mga kasambahay, hindi lamang sa gusali; tumpak itong ipinahahayag ng “sambahayan.”
- source_word: אַתָּה
  choice: ikaw
  rationale: Hayagang binibigyang-diin ng Hebreo ang panghalip. Pinanatili ito bilang pambungad sa kasunod na talaan ng mga kasali sa kagalakan.
- source_word: הַלֵּוִי
  choice: ang Levita
  rationale: Karaniwang tiyak na katawagan sa Tagalog para sa isang kabilang sa lipi ni Levi.
- source_word: הַגֵּר
  choice: ang dayuhang naninirahang kasama ninyo
  rationale: Ipinahahayag nito ang isang hindi katutubong naninirahan sa pamayanan, hindi lamang isang panandaliang bisita. Mas malinaw ito sa ordinaryong modernong Tagalog kaysa “nakikipamayan,” habang pinananatili ang legal at panlipunang diwa.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: na naninirahang kasama ninyo
  rationale: Likas na ipinahahayag ang presensiya ng dayuhan sa loob ng pamayanan. Ginamit ang “ninyo” upang tumukoy nang malinaw sa sambayanang kinabibilangan ng indibidwal na kinakausap.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tuwirang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng interpretasyong sektaryan.
- issue: Pagkakakilanlan ng הַגֵּר
  choice: dayuhang naninirahang kasama ninyo
  alternative: nakikipamayan; estranghero; pansamantalang dayuhan
  rationale: Ang termino ay tumutukoy sa dayuhang residenteng namumuhay sa loob ng Israel at nasa ilalim ng proteksiyon ng pamayanan. Hindi ito dapat paliitin sa isang bisita lamang o bigyan ng makabagong teknikal na katayuang imigrasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang isahang “ka/iyo/iyong” para sa pangunahing kausap at ginamit ang “ninyo” sa paglalarawan sa dayuhang nasa loob ng mas malawak na pamayanan. Ang gitling na mahaba ay nagpapanatili sa pagbibigay-diin ng hayagang אַתָּה at sa appositional na talaan.
