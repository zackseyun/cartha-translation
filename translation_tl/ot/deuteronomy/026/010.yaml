source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: tl
  text: At ngayon, narito, dinala ko ang mga unang bunga ng lupang sinasaka[a] na ibinigay mo sa akin, Yahweh. Pagkatapos, ilagay mo ito sa harap ni Yahweh na iyong Diyos, at yuyukod ka[b] sa harap ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang unang bahagi ng ani mula sa lupa” o “ang una sa ani ng lupain.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay tahasang tumutukoy sa pagyukod o pagpapatirapa; mas malawak na interpretasyon ang “sumamba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang ugnayan sa naunang pagpapahayag at ang paglipat sa kasalukuyang paghahandog.
- source_word: הִנֵּה
  choice: narito
  rationale: Natural at marangal na panawag-pansin sa makabagong Tagalog, nang hindi gumagamit ng labis na arkaikong pananalita.
- source_word: הֵבֵאתִי
  choice: dinala ko
  rationale: Ipinahahayag ang natapos nang pagdadala ng handog; natural sa Tagalog ang aspektong perpektibo.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: ang unang bunga ng lupa
  rationale: Pinananatili ang konstruksiyong 'una sa bunga' habang malinaw at natural sa Tagalog; hindi ipinapalagay na ito ay tumutukoy sa buong unang ani.
- source_word: הָאֲדָמָה
  choice: lupa
  rationale: Ang konteksto ay bungang agrikultural na nagmumula sa lupang sinasaka, hindi pangunahing ang teritoryo bilang pag-aari.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: na ibinigay mo sa akin
  rationale: Tuwirang pinananatili ang pagkilala na ang ani ay kaloob ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalang tipan ayon sa mismong anyo ng tekstong Hebreo.
- source_word: וְהִנַּחְתּוֹ
  choice: Pagkatapos, ilalagay mo iyon
  rationale: Sa kontekstong ritwal at pampamamaraan, ang anyo ay nagsasaad ng susunod na ipinag-uutos na kilos; malinaw na tinutukoy ng 'iyon' ang inihandog na bunga.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Pinananatili ang kongkretong diwa ng paglalagay at pagyukod sa presensiya ng Diyos.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: at yuyukod ka
  rationale: Inilalarawan ang mismong pisikal na pagkilos ng pagyukod at hindi ito agad pinalalawak sa mas pangkalahatang salitang 'sasamba.'
theological_decisions:
- issue: Paglalarawan sa kilos ng וְהִשְׁתַּחֲוִיתָ
  choice: yuyukod ka
  alternative: sasamba ka / magpapatirapa ka
  rationale: Ang pandiwa ay tumutukoy sa pisikal na pagyukod o pagpapatirapa. Pinananatili ng 'yuyukod' ang kongkretong kilos at ang kaugnayan nito sa pagsamba nang hindi pinapawi ang pagkakaibang leksikal.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong Yahweh sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “narito” bilang pormal ngunit nauunawaang panawag-pansin, at “yuyukod” upang mapanatili ang pisikal na kilos ng Hebreo. Inilagay ang mga talababa sa mismong mga pariralang tinatalakay ng mga ito.
