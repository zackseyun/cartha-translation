- from: At ngayon, narito, dinala ko ang unang bunga ng lupa[a] na ibinigay mo sa akin, Yahweh. Pagkatapos, ilalagay mo iyon sa harap ni Yahweh na iyong Diyos, at yuyukod ka sa harap ni Yahweh na iyong Diyos.[b]
  to: At ngayon, narito, dinala ko ang mga unang bunga ng lupang sinasaka[a] na ibinigay mo sa akin, Yahweh. Pagkatapos, ilagay mo ito sa harap ni Yahweh na iyong Diyos, at yuyukod ka[b] sa harap ni Yahweh na iyong Diyos.
