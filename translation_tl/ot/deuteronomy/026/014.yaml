base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: tl
  text: Hindi ako kumain ng anuman mula rito habang nagluluksa[a]. Hindi rin ako nag-alis[b] ng anuman mula rito habang nasa kalagayang marumi ayon sa ritwal, at hindi ako nagbigay ng anuman mula rito para sa patay[c]. Sinunod ko ang tinig ni Yahweh na aking Diyos; ginawa ko ang lahat ng iniutos mo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa aking pagluluksa,” “habang nagdadalamhati,” o “habang naghihirap.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagsunog ng anuman mula rito,” “inubos ang anuman mula rito,” o “nag-alis ng anuman mula rito.” Maaaring tumukoy ang pandiwang Hebreo sa pagsusunog, pag-uubos, o pag-aalis.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “para sa isang taong patay” o “kaugnay ng patay.” Hindi tinutukoy ng Hebreo ang eksaktong ipinagbabawal na paggamit.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: habang nagluluksa
  rationale: Maaaring tumukoy ang אֹנִי sa dalamhati, pagluluksa, o paghihirap. Sa kontekstong ritwal at katabi ng pahayag tungkol sa karumihan, likas sa modernong Tagalog ang “habang nagluluksa” at naipapahiwatig nito ang kalagayan ng nagluluksa nang hindi labis na pinipino ang kahulugan.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: nag-alis ng anuman mula rito
  rationale: Ang Piel ng בער ay maaaring mangahulugang mag-alis, maglinis, tumupok, o magsunog. Pinananatili ng “nag-alis” ang malawak na diwa at iniiwasang itakda na pagsusunog ang tiyak na gawa.
- source_word: בְּטָמֵא
  choice: habang marumi
  rationale: Ipinahihiwatig ng parirala ang pagiging nasa kalagayang marumi ayon sa ritwal. Maikli at natural ang “habang marumi,” bagaman maaaring linawin sa talababa ang ritwal na diwa.
- source_word: לְמֵת
  choice: para sa patay
  rationale: Maikli at hindi tiyak ang Hebreo tungkol sa eksaktong gamit na ipinagbabawal. Pinananatili ng “para sa patay” ang lawak at kalabuan nito nang hindi ipinapalagay na handog sa libing o pagdikit sa bangkay ang partikular na tinutukoy.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: Sinunod ko ang tinig
  rationale: Karaniwang idyoma ito para sa pakikinig na humahantong sa pagsunod. Nananatili sa salin ang larawan ng “tinig” habang malinaw na ipinapahayag ang masunuring tugon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: ginawa ko ang lahat ng iniutos mo sa akin
  rationale: Natural at malinaw itong Tagalog para sa ganap na pagsunod sa lahat ng iniutos, nang hindi binabago ang saklaw ng Hebreo.
theological_decisions:
- issue: Eksaktong kalikasan ng ipinagbabawal na paggamit לְמֵת
  choice: para sa patay
  alternative: para sa mga ritwal sa libing; para sa isang taong patay; kaugnay ng patay
  rationale: Hindi tinutukoy ng Hebreo ang eksaktong gawain. Ang malawak na pananalita at talababa ay nagpapanatili sa tunay na kalabuan sa halip na magpasok ng isang tiyak na paliwanag tungkol sa ritwal.
- issue: Kahulugan ng בער sa konteksto ng banal na ikapu
  choice: nag-alis
  alternative: nagsunog; tumupok; naglinis o nagtabi
  rationale: Maraming posibleng diwa ang pandiwa. Ang “nag-alis” ang hindi gaanong makitid na pangunahing salin, habang itinatala sa talababa ang posibilidad ng pagsusunog.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “mula rito” upang malinaw na tumukoy sa bahaging banal o ikapu na nasa naunang konteksto, at pinanatili ang “tinig ni Yahweh” upang mapanatili ang anyo ng Hebreong idyoma habang ipinapahayag ang pagsunod.
