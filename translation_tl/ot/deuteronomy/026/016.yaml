  source_fidelity: Tapat ang salin sa temporal na panimula, sa pangalan na Yahweh, sa isahang kausap, sa dalawang legal na termino, at sa panawagang buong puso at buong kaluluwa. Gayunman, ang "Ingatan mo" ay karaniwang nangangahulugang protektahan o alagaan sa makabagong Filipino; sa kontekstong legal-tipanan, mas malinaw na naihahatid ng "Sundin mo" ang bisa ng Hebreong שׁמר na ‘keep/observe.’
  naturalness: Natural at marangal ang pangungusap sa kabuuan. Ang pagpapalit ng "Ingatan mo" sa "Sundin mo" ay nag-aalis ng posibleng maling pakahulugang ‘alagaan/protektahan’ habang pinananatili ang tuwirang utos at ang pag-uulit ng kasunod na ‘isagawa.’
  terminology: Ang "Yahweh," "mga tuntunin," "mga hatol," "buong puso," at "buong kaluluwa" ay angkop at pare-pareho sa pormal ngunit modernong rehistro. Napananatili ng mga talababa ang saklaw ng mga hatol at ng nefesh.
