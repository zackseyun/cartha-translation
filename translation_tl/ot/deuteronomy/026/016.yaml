base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: tl
  text: Sa araw na ito, inuutusan ka ni Yahweh na iyong Diyos na isagawa ang mga tuntuning ito at ang mga hatol[a]. Sundin mo at isagawa ang mga iyon nang buong puso mo at buong kaluluwa mo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga hatol” ay maaari ding isaling “mga alituntunin” o “mga kautusang legal”; ang salitang Hebreo ay maaaring tumukoy sa mga pasyang legal o sa mga itinakdang tuntunin.
    reason: lexical_alternative
  - marker: b
    text: Ang “kaluluwa” ay salin ng Hebreong nefesh, na maaari ring mangahulugang “buhay,” “sarili,” o “buong pagkatao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: Sa araw na ito
  rationale: Pinananatili nito ang mariing pagtukoy sa kasalukuyang araw at ang marangal na himig ng tipan, habang natural pa rin sa makabagong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Ipinahahayag ang ugnayang tipan at pinananatili ang isahang kausap sa Hebreo.
- source_word: מְצַוְּךָ
  choice: inuutusan ka
  rationale: Ipinakikita ng anyong pandiwari ang kasalukuyan at agarang bisa ng utos.
- source_word: לַעֲשׂוֹת
  choice: na isagawa
  rationale: Mas natural sa Filipino kaysa sa literal na 'gawin' kapag mga tuntunin at hatol ang layon, ngunit nananatiling malapit sa kahulugan ng עשה.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Ang 'mga tuntunin' ay malinaw at marangal na katumbas sa kontekstong legal at tipan, at naihihiwalay sa kasunod na מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: mga hatol
  rationale: Pinananatili nito ang legal na diwa ng salita, bagaman maaari rin itong tumukoy sa mga alituntunin o kautusang legal.
- source_word: וְשָׁמַרְתָּ
  choice: Ingatan mo
  rationale: Pinananatili ang pangunahing larawan ng שמר at ang mariing panawagang tuparin ang mga iniutos.
- source_word: וְעָשִׂיתָ אֹתָם
  choice: at isagawa ang mga iyon
  rationale: Pinananatili ang pag-uulit ng עשה at ang tambalang diin na ingatan at isagawa ang mga utos.
- source_word: בְּכָל לְבָבְךָ
  choice: nang buong puso mo
  rationale: Natural na ipinahahayag sa Filipino ang buong-loob na pag-iisip, pagpapasya, at pagsunod.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: at buong kaluluwa mo
  rationale: Pinananatili ang tradisyonal at teolohikal na bigat ng נֶפֶשׁ, habang nililinaw sa talababa ang mas malawak nitong saklaw na buhay, sarili, o buong pagkatao.
theological_decisions:
- issue: Pagsasalin sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang 'Yahweh' ay nagpapanatili rito sa halip na palitan ng titulo.
- issue: Bilang ng ikalawang panauhan
  choice: isahang 'ka/mo'
  alternative: maramihang 'kayo/ninyo' o tahasang pagdaragdag ng 'Israel'
  rationale: Isahan ang gramatika ng Hebreo at tuwirang kinakausap ang Israel bilang isang bayang nasa tipan; hindi kailangang dagdagan ang pangalan nito.
- issue: Bisa ng וְשָׁמַרְתָּ וְעָשִׂיתָ
  choice: 'mariing utos: ''Ingatan mo at isagawa'''
  alternative: 'panghinaharap na pahayag: ''iingatan mo at isasagawa mo'''
  rationale: Sa konteksto ng utos, may malinaw na exhortative o obligasyong bisa ang mga anyo. Ang anyong pautos sa Filipino ay natural na naghahatid nito nang hindi nagdaragdag ng salitang 'kaya' na wala sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang tuwirang isahang pakikipag-usap, ang solemneng himig ng tipan, at ang pagkakaiba ng dalawang terminong legal nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
