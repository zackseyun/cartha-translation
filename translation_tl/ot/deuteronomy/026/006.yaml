  text: וַ/יָּרֵ֧עוּ אֹתָ֛/נוּ הַ/מִּצְרִ֖ים וַ/יְעַנּ֑וּ/נוּ וַ/יִּתְּנ֥וּ עָלֵ֖י/נוּ עֲבֹדָ֥ה קָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/006.yaml
  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: tl
  text: Pinakitunguhan tayo nang masama ng mga Ehipsiyo[a] at pinahirapan nila tayo[b], at ipinataw nila sa atin ang mabigat na paggawa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagmalupitan tayo ng mga Ehipsiyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inapi nila tayo.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “malupit na paggawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: Pinakitunguhan tayo nang masama
  rationale: Ang Hiphil ng רעע ay nagsasaad ng paggawa ng masama o mapaminsalang pakikitungo sa iba. Natural sa makabagong Tagalog ang pariralang ito at hindi nito labis na tinutukoy kung anong uri ng pananakit ang ginawa.
- source_word: הַמִּצְרִים
  choice: ng mga Ehipsiyo
  rationale: Tumutukoy ito sa mga taga-Ehipto bilang pangkat na nang-api sa Israel. Ang “mga Ehipsiyo” ang malinaw at karaniwang katawagan sa modernong Filipino.
- source_word: וַיְעַנּוּנוּ
  choice: pinahirapan nila tayo
  rationale: Ang Piel ng ענה ay maaaring mangahulugang pahirapan, apihin, o hamakin. Pinananatili ng “pinahirapan” ang malawak na diwa ng pagdurusang ipinaranas at naihihiwalay ito sa naunang masamang pakikitungo.
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: ipinataw nila sa atin
  rationale: Ang idyomang נתן על ay tumutukoy sa paglalagay o pagpapataw ng isang pasanin o obligasyon sa isang tao. Ang “ipinataw” ay natural at malinaw sa Tagalog.
- source_word: עֲבֹדָה קָשָׁה
  choice: mabigat na paggawa
  rationale: Ang עֲבֹדָה ay paggawa o paglilingkod, at ang קָשָׁה ay mabigat, mahirap, o malupit. Ipinahahayag ng “mabigat na paggawa” ang sapilitan at mapaniil na pasanin nang hindi nagdaragdag ng salitang wala sa talata.
theological_decisions:
- issue: Pagpapanatiling magkakaiba sa sunod-sunod na paglalarawan ng pang-aapi
  choice: 'Gumamit ng tatlong magkakaugnay ngunit magkakaibang pahayag: “pinakitunguhan tayo nang masama,” “pinahirapan nila tayo,” at “ipinataw nila sa atin ang mabigat na paggawa.”'
  alternative: Pagsamahin ang unang dalawang pandiwa bilang iisang ideya ng pang-aapi, o gumamit ng tahasang terminolohiya ng pagkaalipin sa bawat sugnay.
  rationale: Tatlong magkaugnay ngunit hindi magkaparehong kilos ang ipinapahayag ng Hebreo. Pinananatili ng salin ang pag-unlad ng paglalarawan nang hindi nagpapasok ng dagdag na paliwanag o doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang inklusibong “tayo” dahil bahagi ng pahayag ng Israelita ang nagsasalita at ang mga kausap. Sadyang pinanatiling magkakaiba ang tatlong yugto ng pang-aapi.
