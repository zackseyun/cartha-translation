  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: tl
  text: At dumaing kami kay Yahweh[a], ang Diyos ng aming mga ninuno, at dininig ni Yahweh ang aming tinig[b]. Nakita niya ang aming paghihirap, pagpapagal, at pagkaapi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang personal na pangalan ng Diyos na kinakatawan ng apat na katinig na YHWH sa Hebreo.
    reason: divine_name
  - marker: b
    text: Maaaring isalin, “dininig ang aming daing”; literal, “dininig ang aming tinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: dumaing kami
  rationale: Ipinahihiwatig ng צעק ang apurahang paghingi ng tulong dahil sa matinding kalagayan; natural at malinaw itong naipapahayag ng “dumaing” sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: ang Diyos ng aming mga ninuno
  rationale: Natural sa Tagalog ang “mga ninuno” at malinaw nitong tinutukoy ang Diyos na sinamba ng mga ninunong pinagmulan ng Israel; hindi nito binabago ang tipanang diwa ng parirala.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: dininig ... ang aming tinig
  rationale: Pinananatili ang konkretong “tinig” ng Hebreo, samantalang ipinahihiwatig ng “dininig” na pinakinggan at pinansin ni Yahweh ang kanilang pagsusumamo.
- source_word: וַיַּרְא
  choice: nakita niya
  rationale: Ang payak na “nakita” ay tapat sa pandiwa at hindi labis na nagpapaliwanag kung paano tumugon ang Diyos.
- source_word: עָנְיֵנוּ
  choice: aming paghihirap
  rationale: Saklaw nito ang kaabahan, pagdurusa, at abang kalagayan na ipinahihiwatig ng עֳנִי.
- source_word: עֲמָלֵנוּ
  choice: aming pagpapagal
  rationale: Ipinakikita ng “pagpapagal” ang mabigat at nakapapagod na paggawa o pasanin, habang nananatiling naiiba sa paghihirap at pagkaapi.
- source_word: לַחֲצֵנוּ
  choice: aming pagkaapi
  rationale: Ang לַחַץ ay tumutukoy sa mapaniil at nakadudurog na presyur; malinaw itong naipapahayag ng “pagkaapi” sa konteksto ng Ehipto.
theological_decisions:
- issue: Paglilipat ng tipanang pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa Hebreo, kaya tinutumbasan ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Paglilipat ng אֲבֹתֵינוּ
  choice: aming mga ninuno
  alternative: aming mga ama
  rationale: Ang “mga ninuno” ay natural na pariralang Tagalog para sa mga lalaking ninunong tinutukoy sa salaysay at pinananatili ang tipanang kaugnayan nang hindi ginagawang alanganin ang pangungusap.
- issue: Saklaw ng עֲמָלֵנוּ
  choice: aming pagpapagal
  alternative: aming hirap
  rationale: Maaaring mangahulugan ang salita ng pagpapagal, mabigat na paggawa, o problema. Pinili ang “pagpapagal” upang mapanatili ang posibleng pagtukoy sa sapilitang paggawa at maiba ito sa “paghihirap” at “pagkaapi.”
translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dumaing” upang ihatid ang apurahang paghingi ng tulong, at pinanatili ang tatlong magkakaugnay ngunit magkaibang anyo ng pagdurusa: paghihirap, pagpapagal, at pagkaapi.'
