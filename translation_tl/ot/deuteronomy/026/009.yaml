  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: tl
  text: Dinala niya kami sa lugar na ito at ibinigay sa amin ang lupaing ito, isang lupaing umaapaw sa gatas at pulot[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “isang lupaing sagana sa gatas at pulot.” Inilalarawan ng idyomang Hebreo ang mataba at masaganang lupain.'
    reason: lexical_alternative
  - marker: b
    text: Sa ilang konteksto, maaaring kabilang sa “pulot” ang matamis na arnibal, gaya ng arnibal mula sa datiles, at hindi lamang pulot-pukyutan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: Dinala niya kami
  rationale: Ang Hiphil ng בוא na may hulaping unang panauhang maramihan ay nagsasaad ng pagpaparating sa isang patutunguhan. Likas at malinaw sa Tagalog ang “dinala niya kami.”
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: sa lugar na ito
  rationale: Ang אֶל ay tumutukoy sa patutunguhan, at ang הַמָּקוֹם הַזֶּה ay tuwirang nangangahulugang “ang lugar na ito.”
- source_word: וַיִּתֶּן לָנוּ
  choice: at ibinigay sa amin
  rationale: Ang נתן na may לָנוּ ay payak na nagsasaad ng pagbibigay sa “amin.” Pinananatili ng salin ang tahasang ugnayan ng kilos at tumatanggap.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: ang lupaing ito
  rationale: Sa konteksto, ang אֶרֶץ ay ang lupaing ibinigay sa Israel. Ang “lupain” ay mas angkop kaysa “daigdig” o “bansa” at pinananatili ang demonstratibong “ito.”
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: isang lupaing dinadaluyan ng gatas at pulot
  rationale: Pinananatili ng “dinadaluyan” ang masiglang larawan ng participle זָבַת habang nauunawaan sa Tagalog bilang idyoma ng kasaganaan at pagiging mataba ng lupain.
- source_word: דְבָשׁ
  choice: pulot
  rationale: Ang “pulot” ang karaniwan at angkop na katumbas, bagaman maaaring saklawin ng salitang Hebreo sa ilang konteksto ang matamis na arnibal gaya ng mula sa datiles; inilagay ang posibilidad na ito sa talababa.
theological_decisions:
- issue: Hindi tahasang binanggit na banal na simuno sa talata
  choice: Pinanatili ang panghalip na “niya”
  alternative: “Dinala kami ng PANGINOON…”
  rationale: Nasa ikatlong panauhang isahan ang mga pandiwa, ngunit walang tahasang pangngalang simuno sa mismong talata. Ang “niya” ay nagpapanatili sa pagkakaugnay nito sa naunang konteksto nang hindi idinaragdag ang banal na pangalan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupain” para sa kontekstuwal na kahulugan ng אֶרֶץ at pinanatili ang larawang “dinadaluyan ng gatas at pulot.” Ang gatlang em ay nagbibigay-linaw na ang huling parirala ay paglalarawan sa lupaing ibinigay.
