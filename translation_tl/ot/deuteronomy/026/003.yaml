  text: וּ/בָאתָ֙ אֶל הַ/כֹּהֵ֔ן אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/אָמַרְתָּ֣ אֵלָ֗י/ו הִגַּ֤דְתִּי הַ/יּוֹם֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ כִּי בָ֨אתִי֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵ֖י/נוּ לָ֥/תֶת לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: tl
  text: At pupunta ka sa paring nanunungkulan sa panahong iyon[a] at sasabihin mo sa kanya, “Ipinahahayag ko ngayon[b] kay Yahweh na iyong Diyos na nakarating na ako sa lupaing ipinangako ni Yahweh sa pamamagitan ng panunumpa sa ating mga ama[c] na ibibigay sa atin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang paring magiging naroon sa mga araw na iyon,” samakatuwid, ang paring nanunungkulan noon.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “Ipinahayag ko ngayon.” Malamang na performatibo ang anyong Hebreo: ginagawa ng nagsasalita ang pagpapahayag sa mismong pagsabi nito.'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ating mga ninuno.” Panlalaki ang salitang Hebreo at maaaring partikular na tumukoy sa mga patriyarkang ama. Ang pariralang “sa pamamagitan ng panunumpa” ay nagpapahayag na pinagtibay ni Yahweh ang pangako sa pamamagitan ng sumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: At pupunta ka
  rationale: Ang בוא ay maaaring mangahulugang pumunta, pumarito, o pumasok ayon sa pananaw. Dito, likas sa Tagalog ang “pupunta” para sa paglapit sa pari, habang pinananatili ang lakas ng tagubilin.
- source_word: הַכֹּהֵן אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: sa paring naglilingkod sa panahong iyon
  rationale: Literal itong “sa paring magiging naroon sa mga araw na iyon.” Ipinahahayag ng “naglilingkod” ang kontekstuwal na diwang siya ang paring nanunungkulan noon nang hindi ginagawang teknikal ang pananalita.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: at sasabihin mo sa kanya
  rationale: Tuwirang panimula ito sa sasabihing pahayag at pinananatili ang anyong tagubilin.
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: Ipinahahayag ko ngayon
  rationale: 'Bagaman anyong perfect ang pandiwang Hebreo, malamang na performatibo ito: ginagawa ng nagsasalita ang pagpapahayag sa mismong pagbigkas niya nito.'
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na iyong Diyos
  rationale: 'Pinananatili ang pangalang tipan na Yahweh at ang ikalawang panauhang isahan: ang sumasamba ay nagsasalita sa pari tungkol sa “iyong Diyos,” hindi “ating Diyos.”'
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  choice: na nakarating na ako sa lupain
  rationale: Ang “nakarating na ako” ay natural na nagpapakita ng natapos na pagdating na may kasalukuyang kabuluhan. Ang “lupain” ay angkop sa konteksto ng lupaing ipinangako.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: ipinangako ni Yahweh
  rationale: Ang נִשְׁבַּע ay literal na “sumumpa.” Sa kontekstong ito, natural na ipinahahayag ng “ipinangako” ang pangakong pinagtibay ng sumpa; inilalahad sa pasaring ang mas literal na diwa.
- source_word: לַאֲבֹתֵינוּ
  choice: sa ating mga ninuno
  rationale: Natural at saklaw sa modernong Tagalog ang “mga ninuno.” Gayunman, maaaring partikular na tumukoy ang panlalaking Hebreo sa mga patriyarkang ama, kaya pinananatili ang posibilidad na iyon sa pasaring.
- source_word: לָתֶת לָנוּ
  choice: na ibibigay sa atin
  rationale: Natural na inilalahad sa Tagalog ang layon ng sumpa o pangako at pinananatili ang lupain bilang kaloob sa bayan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng לַאֲבֹתֵינוּ
  choice: sa ating mga ninuno
  alternative: sa ating mga ama
  rationale: Mas natural sa kasalukuyang Tagalog ang “mga ninuno,” ngunit hindi ipinagpapalagay na pangkalahatan lamang ang reperensiya; maaaring partikular na tinutukoy ang mga patriyarkang ama, gaya ng nililinaw ng pasaring.
- issue: Lakas ng sumpang nasa נִשְׁבַּע
  choice: ipinangako
  alternative: isinumpa
  rationale: Mas natural sa Tagalog ang “ipinangako” sa pangakong ibigay ang lupain, ngunit mahalagang huwag mawala ang katotohanang ang pangako ay pinagtibay ng sumpa; kaya inilalagay ang literal na alternatibo sa pasaring.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “paring naglilingkod” sa halip na mas burukratikong “paring nanunungkulan,” at “nakarating na ako” upang natural na ipahayag ang pagdating na may kasalukuyang kabuluhan. Inilagay agad ang bawat pananda matapos ang bahaging nililinaw nito.
