  source_fidelity: 'Tumpak na naipapahayag ng salin ang sunod-sunod na kilos sa ritwal: kukunin ng pari ang basket mula sa kamay ng kausap at ilalagay ito sa harap ng altar. Napananatili ang isahang pangalawang panauhan sa “iyong kamay” at “iyong Diyos,” gayundin ang tahasang pangalang Yahweh para sa יהוה.'
