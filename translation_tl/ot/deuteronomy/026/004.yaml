base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: tl
  text: Pagkatapos, kukunin ng pari ang basket mula sa iyong kamay at ilalagay iyon sa harap ng altar ni Yahweh na iyong Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “YHWH”; nakaugaliang isalin na “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Pagkatapos, kukunin
  rationale: Sa sunod-sunod na tagubilin ng ritwal, ang waw na may qatal ay likas na nagpapahayag ng kasunod na gagawin. Malinaw at natural sa Tagalog ang “Pagkatapos, kukunin.”
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Tiyak na pangngalang isahan ito para sa paring nangangasiwa sa ritwal.
- source_word: הַטֶּנֶא
  choice: ang basket
  rationale: Ang טֶנֶא ay basket na lalagyan ng mga unang bunga sa kontekstong ito.
- source_word: מִיָּדֶךָ
  choice: mula sa iyong kamay
  rationale: Pinananatili nito ang kongkretong larawan ng paglilipat ng basket mula sa kamay ng naghahandog.
- source_word: וְהִנִּיחוֹ
  choice: at ilalagay iyon
  rationale: Ang Hiphil ng נוח ay nangangahulugang ilagay o ipatong; ang hulaping layon ay tumutukoy sa basket. Ang “ilalagay iyon” ay malinaw nang hindi nagdaragdag ng di-tiyak na paraan ng paglalapag.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Karaniwang panlunan at pangkultong kahulugan nito ang pagiging nasa harap ng altar.
- source_word: מִזְבַּח
  choice: altar
  rationale: Ito ang karaniwan at madaling maunawaang katawagan sa dakong pinaghahandugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang isahan at ang tuwirang tipanang pagtukoy.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tahasan sa Hebreo ang Tetragrammaton YHWH. Pinananatili ng “Yahweh” ang personal na pangalan, habang ipinapaliwanag sa talababa ang nakaugaliang salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari,” “basket,” at “altar” bilang mga salitang karaniwan at madaling maunawaan. Ang “ni Yahweh na iyong Diyos” ay likas na Tagalog para sa ugnayang ipinahahayag ng pariralang Hebreo.
