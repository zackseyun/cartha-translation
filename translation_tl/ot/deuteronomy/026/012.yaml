review_pass:
  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang pagdadala ng temporal na sugnay, ng ikapu mula sa ani, ng ikatlong taon, at ng apat na pinangalanang benepisyaryo. Gayunman, ang panghalip na “sa inyo” ay hindi tumutugma sa isahang kausap ng Hebreo, at ang “hanggang sa” ay bahagyang nagdaragdag ng aspektong tagal na wala sa simpleng “at sila'y mabubusog.”
  naturalness: Malinaw at modernong Filipino ang karamihan ng salin. Mas tuwiran at mas malapit sa Hebreo ang “at mabubusog sila” kaysa “hanggang sa mabusog sila.” Ang “sa iyong piling” ay natural na paglalarawan ng residenteng dayuhan nang hindi inililihis ang bilang ng kausap.
  terminology: Ang “ikapu,” “Levita,” “ulila,” at “biyuda” ay angkop at pare-pareho ang rehistro. Ang “dayuhang naninirahan sa iyong piling” ay angkop para sa גֵּר. Pinanatili ang “mga pintuang-bayan” bilang literal na larawan, na may talababa para sa idyomatikong “mga bayan.”
  issues:
  - severity: medium
    issue: Hindi tugma ang bilang ng panghalip sa “dayuhang naninirahan sa inyo.”
    rationale: Isahan ang kausap sa Hebreo at sa natitirang salin (“mo,” “iyong”). Ang “sa inyo” ay maramihan at lumilikha ng hindi kailangang pagbabago sa pananaw.
  - severity: low
    issue: Ang “hanggang sa mabusog sila” ay nagdaragdag ng nuwang pangtagal.
    rationale: 'Ang וְשָׂבֵעוּ ay payak na kasunod na resulta: “at sila''y mabubusog” / “at mabubusog sila.”'
  - severity: low
    issue: 'Hindi tugma ang bilang sa talababa: “inyong mga bayan.”'
    rationale: Dapat ding panatilihin ng talababa ang isahang panghalip na nasa pangunahing teksto at Hebreo.
  revised_text: Kapag natapos mo nang ibukod ang buong ikapu ng iyong ani sa ikatlong taon, ang taon ng ikapu, ibibigay mo iyon sa Levita, sa dayuhang naninirahan sa iyong piling, sa ulila, at sa biyuda. Kakain sila sa loob ng iyong mga pintuang-bayan[a], at mabubusog sila.
  revised_footnotes:
