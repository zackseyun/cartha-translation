  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: tl
  text: Kapag natapos mo nang ibukod ang buong ikapu ng iyong ani sa ikatlong taon, ang taon ng ikapu, ibibigay mo iyon sa Levita, sa dayuhang naninirahan sa iyong piling, sa ulila, at sa biyuda. Kakain sila sa loob ng iyong mga pintuang-bayan[a], at mabubusog sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iyong mga bayan”; literal, “sa loob ng iyong mga pintuang-bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Nagpapakilala rito ng pangyayaring temporal na nauuna sa kasunod na tagubilin.
- source_word: תְכַלֶּה לַעְשֵׂר
  choice: natapos mo nang ibukod
  rationale: Ipinapahayag ng Piel ng כלה ang pagkumpleto, at ang עשר ay ang pagbubukod ng ikasampung bahagi; natural sa Filipino ang pariralang ito habang pinananatili ng kasunod na 'ikapu' ang teknikal na konsepto.
- source_word: כָּל מַעְשַׂר תְּבוּאָתְךָ
  choice: ang buong ikapu ng iyong ani
  rationale: Ang מַעְשַׂר ay tiyak na 'ikapu,' at ang תְּבוּאָה ay ani o bunga ng lupain. Ang 'buong' ay nagpapakita ng כָּל.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁת שְׁנַת הַמַּעֲשֵׂר
  choice: sa ikatlong taon, ang taon ng ikapu
  rationale: Tuwirang pinananatili ang temporal na parirala at ang pantanging tawag sa taon.
- source_word: לַלֵּוִי
  choice: sa Levita
  rationale: Karaniwan at malinaw na katawagan sa kasapi ng lipi ni Levi.
- source_word: לַגֵּר
  choice: sa dayuhang naninirahan sa inyo
  rationale: Ang גֵּר ay hindi basta estranghero kundi di-katutubong residenteng namumuhay sa gitna ng Israel.
- source_word: לַיָּתוֹם
  choice: sa ulila
  rationale: Natural na modernong Filipino para sa taong nawalan ng magulang o ama at kabilang sa mahihinang pangkat na pinangangalagaan ng batas.
- source_word: וְלָאַלְמָנָה
  choice: sa biyuda
  rationale: Karaniwang modernong Filipino para sa אַלְמָנָה.
- source_word: בִשְׁעָרֶיךָ
  choice: sa loob ng iyong mga pintuang-bayan
  rationale: Pinananatili ang kongkretong larawan ng Hebreong idyoma, habang nililinaw ng tambalang 'pintuang-bayan' na tumutukoy ito sa pamayanan.
- source_word: וְשָׂבֵעוּ
  choice: hanggang sa mabusog sila
  rationale: Natural na ipinapahayag sa Filipino ang kinalabasang sapat at ganap na pagkain.
theological_decisions:
- issue: Mga tiyak na benepisyaryo ng ikapu sa batas ng tipan
  choice: Panatilihin ang Levita, dayuhang naninirahan, ulila, at biyuda bilang magkakahiwalay na pangkat.
  alternative: Ibuod sila bilang mga nangangailangan o gumamit ng mga makabagong kategoryang panlipunan.
  rationale: Tiyak na pinapangalanan ng teksto ang mga tumatanggap; ang pagpapanatili sa kanila ay umiiwas sa pagpapalawak o pagpapaliit ng legal at teolohikal na saklaw.
- issue: Pagpapakahulugan sa בִשְׁעָרֶיךָ
  choice: Gamitin sa pangunahing teksto ang 'sa loob ng iyong mga pintuang-bayan' at ilagay sa talababa ang kahulugang 'sa inyong mga bayan.'
  alternative: Gamitin lamang ang interpretibong 'sa inyong mga bayan.'
  rationale: Pinananatili nito ang imahen ng pinagmulan ngunit tinutulungan ang modernong mambabasa na maunawaan ang idyomatikong kahulugan.
- issue: Ang kilos na ipinahihiwatig ng לַעְשֵׂר
  choice: Isalin bilang 'ibukod' kasabay ng tahasang pangngalang 'ikapu.'
  alternative: Gamitin ang pandiwang 'mag-ikapu.'
  rationale: Mas natural sa ordinaryong modernong Filipino ang 'ibukod ang ikapu,' at hindi nito ipinapalagay kung ang diin ay sa pagkuha, pagtatabi, o pagbibigay ng ikasampung bahagi.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'ikapu' bilang pamilyar na terminong biblikal, ngunit iniwasan ang labis na arkaikong ayos. Ang isahan na 'mo/iyong' ay sumusunod sa Hebreong kausap, samantalang ang talababa ay nagpapaliwanag sa idyoma ng mga pintuang-bayan.
