revisions:
- from: Kapag natapos mo nang ibukod ang buong ikapu ng iyong ani sa ikatlong taon, ang taon ng ikapu, ibibigay mo iyon sa Levita, sa dayuhang naninirahan sa inyo, sa ulila, at sa biyuda. Kakain sila sa loob ng iyong mga pintuang-bayan[a] hanggang sa mabusog sila.
  to: Kapag natapos mo nang ibukod ang buong ikapu ng iyong ani sa ikatlong taon, ang taon ng ikapu, ibibigay mo iyon sa Levita, sa dayuhang naninirahan sa iyong piling, sa ulila, at sa biyuda. Kakain sila sa loob ng iyong mga pintuang-bayan[a], at mabubusog sila.
  rationale: Inayos ang isahang kausap sa paglalarawan ng גֵּר at sa talababa. Pinalitan ang “hanggang sa mabusog sila” ng “at mabubusog sila” upang ilarawan ang payak na resulta ng Hebreong pandiwa nang walang idinagdag na aspektong pangtagal. Napanatili ang lahat ng pangunahing leksikal at legal na kategorya ng talata.
