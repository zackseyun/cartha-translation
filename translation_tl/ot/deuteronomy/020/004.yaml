base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: tl
  text: Sapagkat si Yahweh na inyong Diyos ang sumasama sa inyo upang makipaglaban para sa inyo laban sa inyong mga kaaway, upang iligtas kayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palayain kayo” o “bigyan kayo ng tagumpay.” Sa kontekstong ito ng labanan, ang pandiwang Hebreo ay maaaring tumukoy sa pagsagip, pagpapalaya, o pagbibigay ng tagumpay.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang paghikayat; natural at malinaw ang paliwanag na ugnayan sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tumpak na ipinahahayag ang anyong may hulaping pangmaramihan para sa ikalawang panauhan.
- source_word: הַהֹלֵךְ
  choice: ang sumasama
  rationale: Ang participle ay naglalarawan sa patuloy na pagkilos ni Yahweh. Sa pariralang עִמָּכֶם, mas natural sa Filipino ang “sumasama sa inyo” kaysa literal na “lumalakad kasama ninyo.”
- source_word: עִמָּכֶם
  choice: sa inyo
  rationale: Kasama ng “sumasama,” malinaw nitong ipinahahayag ang banal na pakikipisan o pagsama.
- source_word: לְהִלָּחֵם
  choice: upang makipaglaban
  rationale: Tuwirang inilalarawan ang pakikidigma; ang “makipaglaban” ay natural sa modernong Filipino.
- source_word: לָכֶם
  choice: para sa inyo
  rationale: 'Ipinahahayag ang datibo ng kapakinabangan: nakikipaglaban si Yahweh alang-alang sa Israel.'
- source_word: עִם אֹיְבֵיכֶם
  choice: laban sa inyong mga kaaway
  rationale: Bagaman karaniwang nangangahulugang “kasama” ang עִם, malinaw na pagsalungat ang diwa nito sa konteksto ng pakikipaglaban.
- source_word: לְהוֹשִׁיעַ
  choice: upang iligtas
  rationale: Pinananatili ang malawak na kahulugan ng pagliligtas o pagpapalaya habang ang konteksto ay tumutukoy rin sa tagumpay sa labanan.
- source_word: אֶתְכֶם
  choice: kayo
  rationale: Natural na salin ng tuwirang layon na nasa ikalawang panauhang pangmaramihan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan at hindi ito pinapalitan ng titulo.
- issue: Saklaw ng לְהוֹשִׁיעַ sa konteksto ng digmaan
  choice: iligtas kayo
  alternative: palayain kayo; bigyan kayo ng tagumpay
  rationale: Mas malawak ang pandiwang Hebreo kaysa tagumpay lamang sa militar. Pinananatili ng “iligtas” ang diwa ng pagliligtas habang hindi inaalis ang agarang konteksto ng labanan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “inyong” at “kayo” upang mapanatili ang pangmaramihang pakikipag-usap sa Israel. Inilagay ang pananda ng talababa pagkatapos ng buong sugnay na “upang iligtas kayo” upang malinaw na doon tumutukoy ang mga alternatibo.
