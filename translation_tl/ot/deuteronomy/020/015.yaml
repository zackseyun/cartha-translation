  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: tl
  text: Ganito[a] ang gagawin mo sa lahat ng lungsod na napakalayo sa iyo, na hindi mga lungsod ng mga bansang ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Gayon” o “Sa ganitong paraan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “na hindi mula sa mga lungsod ng mga bansang ito”; ipinahihiwatig nito na ang mga lungsod na ito ay hindi mga lungsod na sakop ng mga bansang kababanggit lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Ganito
  rationale: Tumutukoy ito sa paraang inilarawan sa naunang konteksto. Likas at malinaw sa makabagong Tagalog ang “Ganito,” habang pinananatili ang ugnayan sa naunang tagubilin.
- source_word: תַּעֲשֶׂה
  choice: ang gagawin mo
  rationale: Ang Qal imperfect na ikalawang panauhang panlalaki ay may puwersang pautos sa kontekstong legal. Sa pariralang “Ganito ang gagawin mo,” naipahahayag ang tiyak na tagubilin nang hindi pinatitindi sa tahasang “dapat.”
- source_word: לְכָל הֶעָרִים
  choice: sa lahat ng lungsod
  rationale: Ang לְ ay tumutukoy sa mga lungsod na saklaw ng pagkilos. Ang “sa lahat ng lungsod” ang natural na katumbas sa Tagalog.
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: na napakalayo sa iyo
  rationale: Pinagsasama ng “napakalayo” ang kahulugang panglayo at ang pagpapalakas ng מְאֹד, habang tahasang pinananatili ng “sa iyo” ang מִמְּךָ.
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: na hindi kabilang sa mga lungsod ng
  rationale: 'Ipinahahayag ng “hindi kabilang” ang partitive o pangkatang gamit ng מִן: ang tinutukoy na malalayong lungsod ay hindi kasama sa mga lungsod na pag-aari o saklaw ng mga bansang kasunod na binanggit.'
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: mga bansang ito
  rationale: Ang “mga bansa” ay angkop sa heopolitikal na konteksto ng גּוֹיִם at umiiwas sa di-kinakailangang konotasyong panrelihiyon ng ibang katawagan.
- source_word: הֵנָּה
  choice: nakapaloob sa “mga bansang ito”
  rationale: Ang pambabaeng pangmaramihang anyo ay nagbibigay-diin sa mismong mga bansang tinutukoy. Sapat na naihahatid sa natural na Tagalog ang puwersa nito sa “mga bansang ito.”
theological_decisions:
- issue: Pagkakaiba ng malalayong lungsod at ng mga lungsod ng mga bansang tinutukoy sa nakapaligid na konteksto
  choice: 'Panatilihin ang malinaw na legal na pagkakaiba: ang naunang paraan ng pakikitungo ay para sa malalayong lungsod na hindi kabilang sa mga bansang ito.'
  alternative: Palawakin sa talata ang mga tuntunin sa pagkubkob mula sa naunang konteksto, o gawing pangkalahatang pahayag lamang tungkol sa mga banyagang lungsod.
  rationale: Ang talata ay nagsisilbing hangganan ng saklaw ng naunang tagubilin. Hindi dapat palambutin ang puwersang militar-legal nito o idagdag sa pangunahing teksto ang paliwanag mula sa mga katabing talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lungsod” at “bansa” bilang karaniwang katawagang madaling maunawaan. Pinanatili ng “Ganito ang gagawin mo” ang direktang tono ng legal na tagubilin nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
