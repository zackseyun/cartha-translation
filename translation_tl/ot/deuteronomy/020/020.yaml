base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: tl
  text: Tanging ang mga punong alam mong hindi nagbibigay ng pagkain ang maaari mong sirain at putulin; at magtayo ka ng mga estrukturang pangkubkob[a] laban sa lunsod na nakikipagdigma sa iyo, hanggang sa mapabagsak mo ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magtayo ng isang rampang pangkubkob” o “magtayo ng mga muog na pangkubkob.” Malawak ang maaaring saklaw ng salitang Hebreo na מָצוֹר at hindi nito tiyak na tinutukoy ang iisang uri ng istruktura.
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa bumagsak ito.” Literal na gumagamit ang Hebreo ng pandiwa ng pagbaba para sa pagkatalo ng lunsod, na may diwang “hanggang sa mapababa mo ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit ... lamang / ang mga iyon
  rationale: Ipinakikita ng רַק ang eksepsiyon sa naunang pagbabawal. Ang “Ngunit” at ang pagtutok sa “ang mga iyon” ay likas na naghihigpit sa saklaw sa mga punong hindi namumunga ng pagkain.
- source_word: עֵץ ... עֵץ מַאֲכָל
  choice: mga puno ... namumunga ng pagkain
  rationale: Sa konteksto, mga buháy na puno ang tinutukoy. Nililinaw ng “namumunga ng pagkain” ang Hebreong ideya ng punong nagbibigay ng makakain nang hindi nililimitahan sa isang uri ng prutas.
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: alam mong hindi
  rationale: Natural na Filipino ito para sa kaalamang matitiyak tungkol sa uri ng puno, habang pinananatili ang pananagutan ng kausap na alamin kung nakakain ang bunga nito.
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: ang mga iyon ay maaari mong sirain at putulin
  rationale: Distributibo ang isahang panghalip sa Hebreo. Ang “maaari” ay nagpapahayag ng pahintulot sa legal na tagubilin, at ang “putulin” ay natural para sa pagputol o pagpapabagsak ng puno.
- source_word: וּבָנִיתָ מָצוֹר
  choice: Gamitin mo ang mga iyon sa pagtatayo ng mga pangkubkob
  rationale: Ang מָצוֹר ay maaaring tumukoy sa iba’t ibang istrukturang ginagamit sa pagkubkob, hindi lamang sa isang rampa. Ipinahihiwatig ng konteksto na magagamit ang pinutol na kahoy sa pagtatayo; ang hiwalay na pangungusap ay nagbibigay ng malinaw na modernong Filipino.
- source_word: עַל הָעִיר
  choice: laban sa lunsod
  rationale: Ipinahahayag ng “laban sa” ang militar na layon ng mga pangkubkob, sa halip na ipakahulugang lokasyon lamang.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: na nakikipagdigma sa iyo
  rationale: Natural na salin ito ng Hebreong idyomang “gumagawa ng digmaan kasama/laban sa iyo” at pinananatili ang nagpapatuloy na kilos ng participle.
- source_word: עַד רִדְתָּהּ
  choice: hanggang sa mapabagsak mo ito
  rationale: Pinananatili nito ang aktibong ikalawang panauhan at ang metaporang pagbaba o pagbagsak ng lunsod, sa halip na tahimik na gawing pasibo o basta “sumuko.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lunsod” bilang pormal ngunit karaniwang salita, “pangkubkob” bilang madaling maunawaang terminong militar, at “mapabagsak” upang mapanatili ang larawan at aktibong anyo ng Hebreo. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
