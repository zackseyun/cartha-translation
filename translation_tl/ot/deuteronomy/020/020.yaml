revisions:
- from: Ngunit ang mga punong alam mong hindi namumunga ng pagkain, ang mga iyon ay maaari mong sirain at putulin. Gamitin mo ang mga iyon sa pagtatayo ng mga pangkubkob[a] laban sa lunsod na nakikipagdigma sa iyo, hanggang sa mapabagsak mo ito.[b]
  to: Tanging ang mga punong alam mong hindi nagbibigay ng pagkain ang maaari mong sirain at putulin; at magtayo ka ng mga estrukturang pangkubkob[a] laban sa lunsod na nakikipagdigma sa iyo, hanggang sa mapabagsak mo ito.[b]
  rationale: Inalis ang hindi tahasang impormasyong ang mga pinutol na puno ay gagamitin bilang materyales. Pinalitan ang hindi idiomatikong “mga pangkubkob” ng malawak at malinaw na “mga estrukturang pangkubkob.” Pinanatili ang lahat ng footnote anchor at ang kahulugan ng talata.
