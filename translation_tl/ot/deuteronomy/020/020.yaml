  - severity: low
    issue: Hindi natural at kulang sa linaw ang “mga pangkubkob” bilang katawagan para sa מָצוֹר.
    rationale: Mas malinaw ang “mga estrukturang pangkubkob,” habang pinananatili ang malawak na saklaw ng salitang Hebreo.
