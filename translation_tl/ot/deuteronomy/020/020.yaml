  verdict: revise
  source_fidelity: 'May makabuluhang dagdag ang draft sa “Gamitin mo ang mga iyon”: hindi tahasang sinasabi ng Hebreo na ang pinutol na mga puno mismo ang gagamitin sa pagtatayo, bagaman maaaring ipahiwatig ito ng konteksto. Dapat alisin ang dagdag upang manatiling tapat sa saklaw ng teksto. Napananatili ng rebisyon ang paghihigpit ng רַק, ang pahintulot na sirain at putulin ang mga punong hindi para sa pagkain, ang malawak na kahulugan ng מָצוֹר, at ang aktibong diwa ng “hanggang sa mapabagsak mo ito.”'
  naturalness: Mas natural at malinaw sa modernong Filipino ang “mga estrukturang pangkubkob” kaysa sa pangngalang “mga pangkubkob.” Ang paghahati sa dalawang sugnay ay umiiwas rin sa maling pahiwatig na tuwirang iniutos ng Hebreo ang paggamit ng mga puno bilang materyales.
  terminology: Ang “lunsod,” “nakikipagdigma,” at “mapabagsak” ay angkop sa marangal ngunit modernong rehistro. Ang “mga estrukturang pangkubkob” ay sadyang malawak upang hindi tukuyin ang מָצוֹר bilang rampa lamang o bilang isang natatanging uri ng muog.
  issues:
