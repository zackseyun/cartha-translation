source:
  edition: WLC
  text: כִּֽי תָצ֣וּר אֶל עִיר֩ יָמִ֨ים רַבִּ֜ים לְֽ/הִלָּחֵ֧ם עָלֶ֣י/הָ לְ/תָפְשָׂ֗/הּ לֹֽא תַשְׁחִ֤ית אֶת עֵצָ/הּ֙ לִ/נְדֹּ֤חַ עָלָי/ו֙ גַּרְזֶ֔ן כִּ֚י מִמֶּ֣/נּוּ תֹאכֵ֔ל וְ/אֹת֖/וֹ לֹ֣א תִכְרֹ֑ת כִּ֤י הָֽ/אָדָם֙ עֵ֣ץ הַ/שָּׂדֶ֔ה לָ/בֹ֥א מִ/פָּנֶ֖י/ךָ בַּ/מָּצֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: tl
  text: Kapag kinubkob ninyo ang isang lungsod nang maraming araw upang makipagdigma laban dito at sakupin ito, huwag ninyong sirain ang mga puno nito sa paggamit ng palakol laban sa mga ito, sapagkat may makakain kayo mula sa mga ito. Huwag ninyo silang putulin. Sapagkat tao ba ang puno sa bukid upang humarap sa inyo sa panahon ng pagkubkob?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “sapagkat ang tao ay puno sa bukid,” o “sapagkat pagkain ng tao ang puno sa bukid.” Mahirap unawain ang Hebreo sa huling sugnay; itinuring ito sa pangunahing teksto na isang retorikal na tanong na ipinag-iiba ang puno at ang taong kalaban.
    reason: alternative_reading
lexical_decisions:
- source_word: תָצוּר
  choice: kinubkob ninyo
  rationale: Ang “kubkubin” ang karaniwang makabagong salitang Filipino para sa pagsasagawa ng siege laban sa isang lungsod.
- source_word: יָמִים רַבִּים
  choice: nang maraming araw
  rationale: Tuwirang pinananatili ang Hebreong pananalitang tumutukoy sa mahabang tagal.
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: nilabanan ito upang sakupin
  rationale: Ipinapahayag nang natural ang pakikipagdigma laban sa lungsod at ang layuning makuha ito.
- source_word: לֹא תַשְׁחִית אֶת עֵצָהּ
  choice: huwag ninyong sirain ang mga puno nito
  rationale: Pinananatili ang lakas ng Hiphil ng שׁחת at ang kolektibong pagtukoy sa mga puno ng lungsod.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: sa pamamagitan ng pagtaga sa mga iyon ng palakol
  rationale: Likas sa Filipino ang “pagtaga … ng palakol” at malinaw nitong ipinahahayag ang paggamit ng palakol laban sa mga puno.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: sapagkat makakakain kayo mula sa mga iyon
  rationale: Hindi idinaragdag sa pangunahing teksto ang “bunga,” na hindi tahasang naroon, habang naihahatid ang gamit ng mga puno bilang mapagkukunan ng pagkain.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: Huwag ninyo silang putulin
  rationale: Ang “putulin” ang natural na pandiwa sa pagputol o pagbuwal ng puno; ginawang maramihan ang panghalip ayon sa kolektibong “mga puno.”
- source_word: הָאָדָם
  choice: tao
  rationale: Ang “tao” ay natural at walang di-kinakailangang pagtukoy sa kasarian, habang pinananatili ang paghahambing sa isang taong kalaban.
- source_word: עֵץ הַשָּׂדֶה
  choice: ang puno sa parang
  rationale: Ang “puno sa parang” ay natural na Filipino at malapit sa Hebreong konstruktong “tree of the field.”
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: upang humarap sa inyo sa pagkubkob
  rationale: Nananatiling malapit sa mahirap na Hebreong parirala habang naipapakita ang retorikal na kaibahan ng puno at ng taong kalaban.
theological_decisions:
- issue: Pagpapakahulugan sa mahirap na sugnay na כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: 'Isinalin bilang retorikal na tanong: “Sapagkat tao ba ang puno sa parang upang humarap sa inyo sa pagkubkob?”'
  alternative: Maaari ring unawain bilang “sapagkat ang tao ay puno sa parang” o “sapagkat pagkain ng tao ang puno sa parang.”
  rationale: Mahirap at tunay na malabo ang sintaks ng Hebreo. Ang retorikal na tanong ay umaangkop sa konteksto sa pamamagitan ng pagkilala na ang puno ay hindi taong kalabang lumalaban sa hukbo, ngunit inilalahad sa talababa ang mahahalagang alternatibo upang hindi ikubli ang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyo/kayo” upang katawanin ang kolektibong Israel na kinakausap. Inilagay ang talababa sa mahirap na huling sugnay, na siyang aktuwal na tinatalakay nito.
