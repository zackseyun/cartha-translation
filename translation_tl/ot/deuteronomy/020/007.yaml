base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: tl
  text: At sinong lalaki ang nakipagtipan na sa isang babae upang pakasalan siya[a] ngunit hindi pa niya ito napapangasawa?[b] Hayaan siyang umalis at umuwi sa kanyang bahay, baka mamatay siya sa labanan at ibang lalaki ang magpakasal sa babae.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “nakipagtipan sa isang babae.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi pa niya ito kinuha.” Sa kontekstong ito, hindi pa niya ito kinukuha bilang asawa.
    reason: cultural_note
  - marker: c
    text: Sa literal, “kunin siya”; sa kontekstong ito, kunin bilang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: At sinong lalaki
  rationale: Pinananatili ang pang-ugnay na וּ at ang panretorikang tanong na nagpapakilala sa susunod na uri ng lalaking hindi muna isasama sa labanan.
- source_word: אֵרַשׂ אִשָּׁה
  choice: nakipagtipan na upang pakasalan ang isang babae
  rationale: Tumutukoy ang אֵרַשׂ sa pormal na tipan bago lubusang maisagawa ang pag-aasawa. Malinaw sa makabagong Filipino ang salin at naihihiwalay nito ang pakikipagtipan sa kasunod na yugto ng pag-aasawa.
- source_word: וְלֹא לְקָחָהּ
  choice: ngunit hindi pa niya ito napapangasawa
  rationale: Ang literal na 'hindi pa niya siya kinukuha' ay madaling maunawaan sa ibang diwa sa Filipino. Ipinahahayag ng salin ang karaniwang diwang pangkasal ng לקח sa kontekstong ito, habang itinatala sa talababa ang idyomang Hebreo.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Hayaan siyang umalis at umuwi sa kanyang bahay
  rationale: Ipinapakita ng 'Hayaan' ang puwersang pautos o pahintulot sa konteksto ng mga hindi muna isasama sa labanan; pinananatili rin ang dalawang kilos na 'umalis' at 'umuwi.'
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: baka mamatay siya sa labanan
  rationale: Likas na ipinahahayag ng 'baka' ang babala o negatibong posibilidad na ipinakikilala ng פֶּן. Ang 'sa labanan' ay tumutukoy sa kasalukuyang kampanyang militar.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: at ibang lalaki ang magpakasal sa babae
  rationale: Ang ikalawang לקח ay may parehong idyomang pangkasal. Ginawang tahasan ang diwa sa natural na Filipino at pinanatili ang 'ibang lalaki' ng tekstong Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang literal na 'kunin ang babae' sa pangunahing teksto dahil maaari itong maging malabo o mapanlinlang sa kasalukuyang gamit, ngunit pinanatili ang idyomang Hebreo sa mga talababa. Ginamit ang 'bahay' sa halip na 'tahanan' upang mas malapit sa לְבֵיתוֹ, habang nananatiling natural.
