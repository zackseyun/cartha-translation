  text: Kapag papalapit na kayo sa labanan[a], lalapit ang pari at magsasalita sa bayan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papalapit na kayo sa digmaan.” Ang Hebreong מִלְחָמָה ay maaaring tumukoy sa digmaan sa pangkalahatan o sa isang tiyak na labanan; sa kontekstong ito, ang nalalapit na sagupaan ang higit na tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Ang “bayan” dito ay tumutukoy sa nagkatipong hukbo ng Israel, ngunit ginamit sa Hebreo ang mas malawak na salitang “bayan,” hindi ang mas tiyak na katawagang gaya ng “mga kawal.”
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Kapag
  rationale: Ang וְהָיָה kasunod ng sugnay na panahunan ay nagbubukas ng isang pangyayaring magaganap; likas itong maipahayag sa Tagalog bilang “Kapag.”
- source_word: כְּקָרָבְכֶם אֶל הַמִּלְחָמָה
  choice: malapit na kayong makipaglaban
  rationale: Ang קרב ay tumutukoy sa paglapit, at ang מִלְחָמָה ay maaaring mangahulugang digmaan o tiyak na labanan. Ipinahahayag ng salin ang agarang paglapit sa sagupaan sa natural na Tagalog.
- source_word: וְנִגַּשׁ
  choice: lalapit
  rationale: Tuwirang pinananatili ang diwa ng נגשׁ na “lumapit,” nang hindi idinaragdag ang mas interpretatibong ideya ng pagharap sa unahan.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Tiyak at isahang pangngalan ito; sapat at likas sa modernong Tagalog ang “ang pari.”
- source_word: וְדִבֶּר
  choice: at magsasalita
  rationale: Ang piel ng דבר ay karaniwang “magsalita.” Ang panghinaharap na anyo ay umaayon sa daloy ng tagubilin.
- source_word: אֶל הָעָם
  choice: sa bayan
  rationale: Pinananatili ng “bayan” ang malawak na kahulugan ng עָם sa halip na paliitin ito sa “mga kawal,” kahit ang tinutukoy sa konteksto ay ang nagkatipong hukbo ng Israel.
