  naturalness: Natural ang karamihan ng salin. Mas malinaw at likas ang “upang hindi niya pahinain ang loob ng kanyang mga kapatid” kaysa sa isang di-tuwirang pahayag na maaaring magmukhang kusang panghihina lamang ng mga kapatid.
  terminology: Ang “mga opisyal,” “lalaking,” “mahina ang loob,” at “mga kapatid” ay angkop sa kontekstong militar at sa panlalaking wika ng Hebreo. Ang talababa a ay maaaring gawing mas tumpak sa pamamagitan ng pag-iwas sa “maselan,” na hindi likas o angkop na paglalarawan ng puso sa Filipino.
