  to: Pagkatapos, magpapatuloy sa pagsasalita sa mga tao ang mga opisyal. Sasabihin nila, “Sino ang lalaking natatakot at mahina ang loob?[a] Umalis siya at umuwi sa kanyang bahay, upang hindi niya pahinain ang loob ng kanyang mga kapatid, tulad ng mahina niyang loob.”[b]
