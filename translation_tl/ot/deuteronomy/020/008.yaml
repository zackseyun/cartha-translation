base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: tl
  text: Pagkatapos, magpapatuloy sa pagsasalita sa mga tao ang mga opisyal. Sasabihin nila, “Sino ang lalaking natatakot at mahina ang loob?[a] Umalis siya at umuwi sa kanyang bahay, upang hindi niya pahinain ang loob ng kanyang mga kapatid, tulad ng mahina niyang loob.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “natatakot at malambot ang puso.” Literal na inilalarawan ng Hebreo ang isang taong “natatakot at malambot ang puso.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” dito ay tumutukoy sa mga kapwa Israelita o mga kapwa kawal niya.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: magpapatuloy
  rationale: Ang literal na diwang “magdagdag sa pagsasalita” ay isang idyomang nangangahulugang ipagpatuloy o magsalita pa.
- source_word: הַשֹּׁטְרִים
  choice: mga opisyal
  rationale: Tumutukoy ito sa mga itinalagang opisyal na may tungkuling pang-administratibo, hindi sa pulis sa makabagong kahulugan.
- source_word: מִי הָאִישׁ
  choice: Sino ang lalaking
  rationale: Pinananatili ang panlalaking anyo ng Hebreo dahil isang lalaking kabilang sa hukbo ang tinutukoy sa konteksto.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: natatakot at mahina ang loob
  rationale: Ang unang salita ay tumutukoy sa pagkatakot; ang ikalawang parirala ay literal na “malambot/maselan ang puso” at idyomatikong tumutukoy sa kawalan ng tapang.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Umalis siya at umuwi sa kanyang bahay
  rationale: Ipinahahayag ng mga pandiwa ang isang tagubilin o pahintulot na umalis at bumalik sa sariling bahay.
- source_word: וְלֹא יִמַּס אֶת־לְבַב אֶחָיו כִּלְבָבוֹ
  choice: baka panghinaan din ng loob ang kanyang mga kapatid, gaya niya
  rationale: Ang larawang “matunaw ang puso” ay likas na ipinahahayag sa Filipino bilang “panghinaan ng loob.” Pinananatili ng “gaya niya” ang paghahambing sa kalagayan ng sarili niyang puso o loob.
theological_decisions:
- issue: Panlalaking wika sa kontekstong militar
  choice: Pinanatili ang “lalaki” at “mga kapatid” sa pangunahing teksto.
  alternative: “tao” at “mga kasamahan” o “mga kapwa kawal”
  rationale: Panlalaking isahan at pangmaramihang katawagang pampamilya ang ginamit sa Hebreo. Pinananatili nito ang panlipunan at militar na anyo ng teksto nang hindi ito ginagawang neutral sa kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mahina ang loob” at “panghinaan ng loob” bilang likas na mga katumbas ng metapora ng puso sa Hebreo, habang ipinaliliwanag sa talababa ang mas literal na larawan.
