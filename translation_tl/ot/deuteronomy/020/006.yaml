base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: tl
  text: At sino ang lalaking nagtanim ng ubasan ngunit hindi pa nakinabang sa bunga nito? Umuwi siya sa kanyang bahay[a], baka mamatay siya sa labanan at ibang lalaki ang makinabang sa bunga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Umalis siya at bumalik sa kanyang bahay.” Dalawang pandiwa ang ginagamit sa Hebreo, ngunit ang pinagsamang diwa nito ay natural na naipahahayag sa Tagalog bilang “umuwi.”
    reason: translation_form
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: At sino ang lalaking
  rationale: Pinananatili ang pormulang patanong na nagpapakilala ng isa pang lalaking maaaring hindi sumama sa labanan.
- source_word: נָטַע כֶּרֶם
  choice: nagtanim ng ubasan
  rationale: Tuwirang salin ng natapos na pagtatanim; natural sa modernong Tagalog ang aspektong perpektibo.
- source_word: וְלֹא חִלְּלוֹ
  choice: ngunit hindi pa nakinabang sa bunga nito
  rationale: Sa kontekstong ito, ang חלל ay tumutukoy sa pagsisimulang gamitin o tamasahin ang pakinabang ng ubasan, malamang matapos ang mga unang taong ipinagbabawal ang bunga. Nililinaw ng parirala ang praktikal na diwa nang hindi ito ginagawang seremonyal na paghahandog.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Umuwi siya sa kanyang bahay
  rationale: Ipinahahayag nang natural ang instruksiyonal o pahintulot na gamit ng mga pandiwa. Ang 'sa kanyang bahay' ay nagpapanatili sa tahasang לְבֵיתוֹ.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: baka mamatay siya sa labanan
  rationale: Ang 'baka' ay likas na Tagalog para sa babala o posibilidad na ipinahahayag ng פן.
- source_word: וְאִישׁ אַחֵר יְחַלְּלֶנּוּ
  choice: at ibang lalaki ang makinabang sa bunga nito
  rationale: Pinananatili ang tahasang panlalaking איש at inuulit ang parehong kontekstuwal na kahulugan ng חלל.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “ubasan,” “labanan,” at “makinabang sa bunga nito” upang maging malinaw sa karaniwang mambabasa habang pinananatili ang legal at instruksiyonal na tono.
