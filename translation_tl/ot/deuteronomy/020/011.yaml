base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: tl
  text: At kung tumugon ito sa iyo nang may kapayapaan[a] at magbukas para sa iyo, ang lahat ng taong matatagpuan doon ay mapapasailalim sa iyo sa sapilitang paggawa[b] at maglilingkod sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumugon ito sa iyo ayon sa mga tuntunin ng kapayapaan.”
    reason: lexical_alternative
  - marker: b
    text: O “mapapasailalim sa iyo sa tributo.” Ang salitang Hebreo na מַס ay maaaring tumukoy sa pataw, tributo, o sapilitang paggawa; sa kontekstong ito, higit na angkop ang sapilitang paggawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: nang mapayapa
  rationale: Sa konteksto ng alok sa isang kinukubkob na lungsod, tumutukoy ang pangngalan sa mapayapang pagtugon. Likas sa modernong Tagalog ang pariralang ito, habang pinananatili sa talababa ang posibleng diwang ‘may mga kundisyon ng kapayapaan.’
- source_word: תַּעַנְךָ
  choice: tugunin ka nito
  rationale: Tuwirang ipinahahayag ang kahulugang ‘sumagot/tumugon.’ Ang ‘nito’ ay tumutukoy sa lungsod na isinapersona bilang pambabaeng isahan sa Hebreo.
- source_word: וּפָתְחָה לָךְ
  choice: at pagbuksan ka
  rationale: Ipinahihiwatig ng konteksto ang pagpapapasok sa lungsod, ngunit hindi idinagdag ang salitang ‘mga pintuang-bayan,’ na wala mismo sa Hebreo.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: ang lahat ng taong matatagpuan doon
  rationale: Pinananatili ng ‘matatagpuan’ ang anyong participio at ang ekspresyon ng Hebreo, sa halip na gawing simpleng ‘naroon.’
- source_word: לָמַס
  choice: mapapasailalim sa iyo sa sapilitang paggawa
  rationale: Maaaring tumukoy ang מַס sa pataw, tributo, o sapilitang paglilingkod. Sa kontekstong sinusundan ng ‘maglilingkod sa iyo,’ malinaw na nakapaloob ang sapilitang paggawa, ngunit iniiwasang tukuyin ang isang mas espesipikong institusyon kaysa sa teksto.
- source_word: וַעֲבָדוּךָ
  choice: at maglilingkod sa iyo
  rationale: Tuwirang katumbas ito ng pandiwang עבד at pinananatili ang ugnayan ng pagpapasakop nang hindi agad tinatawag na mga alipin ang mga tao.
theological_decisions:
- issue: Wika ng pagpapasakop sa batas tungkol sa pakikidigma
  choice: 'Panatilihin ang lantad na diwa ng ipinataw na paggawa: ‘mapapasailalim sa iyo sa sapilitang paggawa at maglilingkod sa iyo.’'
  alternative: ‘magbabayad sila sa iyo ng tributo at maglilingkod sa iyo’
  rationale: Hindi dapat palambutin ang mapamilit na puwersa ng מַס, ngunit hindi rin dapat paliitin ang saklaw nito sa salaping tributo lamang. Inilalahad ng salin ang bigat at makasaysayang katangian ng utos nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘pagbuksan ka’ bilang likas na katumbas ng literal na ‘magbukas sa iyo,’ nang hindi tahasang idinaragdag ang ‘mga pintuang-bayan.’ Pinanatili ang tindi ng sapilitang pagpapasakop at ang leksikal na kalabuan ng מַס sa pamamagitan ng talababa.
