  source_fidelity: Tumpak na naipapahayag ng draft ang pagkakaloob ng lungsod ni Yahweh, ang saklaw na “lahat,” ang tahasang pagtukoy sa mga lalaki, at ang pagpatay sa pamamagitan ng tabak. Gayunman, mas malinaw at mas likas na ilagay si Yahweh bago ang pandiwa bilang tagaganap ng “ibibigay.”
  naturalness: Ang “ibibigay ito sa iyong kamay ni Yahweh” ay nauunawaan ngunit mabigat at maaaring pansamantalang magpahiwatig na ang “ni Yahweh” ay kaugnay ng “iyong kamay.” Mas natural sa modernong Filipino ang “ibibigay ni Yahweh na iyong Diyos sa iyong kamay.” Ang natitirang pananalita ay malinaw at may angkop na marangal na rehistro.
  terminology: Ang “Yahweh,” “Diyos,” “tabak,” at “talim ng tabak” ay angkop. Ang “lahat ng lalaki rito” ay wastong tumutukoy sa mga lalaking nasa lungsod; ang tala ay nararapat na gumamit ng katumbas na “rito” upang tumugma sa teksto.
