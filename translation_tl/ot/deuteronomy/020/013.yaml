  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: tl
  text: At ibibigay ni Yahweh na iyong Diyos ito sa iyong kamay, at papatayin mo sa talim ng tabak ang lahat ng lalaki rito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng mga lalaki rito”; tahasang mga lalaki ang tinutukoy, hindi isang mas pangkalahatang salita gaya ng “mga tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: At ibibigay ito
  rationale: Pinananatili ang tuwirang pang-ugnay na וּ bilang “At” at ang aspektong panghinaharap/sekuwensiyal ng pandiwa. Ang “ito” ay tumutukoy sa lungsod, ang pambabaeng isahang layon sa Hebreo.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: ni Yahweh na iyong Diyos
  rationale: Isinasalin ang banal na pangalan bilang “Yahweh” at pinananatili ang tipanang pananalitang “iyong Diyos.”
- source_word: בְּיָדֶךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang larawang Hebreo ng paghahatid sa kamay ng isang tao, samakatuwid ay sa kaniyang kapangyarihan o kontrol.
- source_word: וְהִכִּיתָ
  choice: at papatayin mo
  rationale: Sa konteksto ng pakikidigma at kasunod ng pariralang tungkol sa talim ng tabak, ang Hiphil ng נכה ay tumutukoy sa nakamamatay na pagpaslang; malinaw ito nang hindi pinahihina ang utos.
- source_word: כָּל זְכוּרָהּ
  choice: ang lahat ng lalaki rito
  rationale: Pinananatili ang kabuuang saklaw ng כָּל at ang tahasang pagtukoy ng זְכוּר sa mga lalaki, samantalang natural na ipinahahayag sa Filipino ang hulaping tumutukoy sa lungsod sa pamamagitan ng “rito.”
- source_word: לְפִי חָרֶב
  choice: sa talim ng tabak
  rationale: Natural na katumbas sa Filipino ng idyomang Hebreo na literal na “sa bibig ng tabak,” habang pinananatili ang larawan ng matalim na bahagi ng sandata.
theological_decisions:
- issue: Tuwirang paglalahad ng utos sa digmaan na iniuugnay sa pagkilos ng Diyos
  choice: Pinanatili ang tahasang pagkakaloob ng lungsod ni Yahweh at ang nakamamatay na utos laban sa lahat ng lalaki rito.
  alternative: Palambutin bilang simpleng pagtalo, o dagdagan ng paliwanag tungkol sa banal na paghatol o banal na digmaan.
  rationale: Maliwanag sa Hebreo kapuwa ang pagkilos ni Yahweh at ang nakamamatay na utos. Hindi ito dapat pagaanin, ngunit hindi rin dapat dagdagan ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabak” bilang likas at dignified na katawagan sa sandata sa kontekstong biblikal; iniwasan ang eupemismo at ang dagdag na teolohikal na pagpapaliwanag.
