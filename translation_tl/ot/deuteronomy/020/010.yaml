translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Pinili ang “makipagdigma” kaysa mas kolokyal na “lumaban” upang mapanatili ang kontekstong militar; ginawang idiomatiko ang pangwakas na parirala habang inilalahad sa talababa ang mas literal at alternatibong pagbasa.
