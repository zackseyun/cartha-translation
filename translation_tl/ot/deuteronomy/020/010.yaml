  yaml_path: translation/ot/deuteronomy/020/010.yaml
  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: tl
  text: Kapag lumapit ka sa isang lungsod upang makipagdigma laban dito, mag-alok ka rito ng kapayapaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ipahayag mo rito ang kapayapaan” o “anyayahan mo ito sa kapayapaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Ipinakikilala rito ang isang inaasahang sitwasyon sa batas, hindi isang dahilan; natural sa modernong Tagalog ang “kapag.”
- source_word: תִקְרַב
  choice: lumapit kayo
  rationale: Tuwirang ipinapahayag ang paglapit sa lungsod. Ginamit ang maramihang “kayo” dahil sa konteksto ng tagubilin sa Israel at likas na gamit sa Filipino.
- source_word: עִיר
  choice: isang lungsod
  rationale: Tumpak at karaniwang katumbas ng pangngalang isahan na walang tiyak na lungsod na tinutukoy.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: upang makipagdigma laban dito
  rationale: Pinananatili ang layunin ng paglapit at ang tahasang diwang palaban ng parirala.
- source_word: וְקָרָאתָ אֵלֶיהָ לְשָׁלוֹם
  choice: mag-alok muna kayo rito ng kapayapaan
  rationale: Sa kontekstong militar, ang pagtawag tungo sa kapayapaan ay natural na nangangahulugang pag-aalok ng kapayapaan. Idinagdag ang “muna” upang malinaw ang ipinag-uutos na hakbang bago ang labanan, na ipinahihiwatig ng pagkakasunod-sunod sa konteksto.
