base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: tl
  text: upang hindi nila kayo turuang gumawa ayon sa lahat ng kanilang mga kasuklam-suklam na gawain na ginawa nila para sa kanilang mga diyos[a], at sa gayon ay magkasala kayo kay Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanilang mga diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר לֹא
  choice: upang hindi
  rationale: Ipinapahayag ang layuning mapigilan ang kasunod na kilos; natural at malinaw ito sa modernong Tagalog.
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  choice: nila kayo turuang gawin
  rationale: Pinananatili ang tahasang diwa ng pagtuturo sa mga kausap upang gumawa.
- source_word: כְּכֹל תּוֹעֲבֹתָם
  choice: ang lahat ng kanilang kasuklam-suklam na gawain
  rationale: Ang תועבה ay matinding katawagang moral at panrelihiyon. Mas natural sa Tagalog ang pariralang ito kaysa sa pangngalang “mga kasuklam-suklam,” habang pinananatili ang bigat at kabuuang saklaw ng כְּכֹל.
- source_word: אֲשֶׁר עָשׂוּ
  choice: na ginawa nila
  rationale: Tuwirang isinasalin ang sugnay na naglalarawan sa mga kasuklam-suklam na gawain.
- source_word: לֵאלֹהֵיהֶם
  choice: para sa kanilang mga diyos
  rationale: Maaaring ipahiwatig ng ל ang gawaing iniuukol o ginagawa para sa mga diyos; pinananatili sa talababa ang posibleng “sa kanilang mga diyos.”
- source_word: וַחֲטָאתֶם
  choice: at sa gayon ay magkasala kayo
  rationale: Ipinakikita ang bunga ng pagkatuto at pagtulad nang hindi ginagawang tiyak na mangyayari ang kasalanan.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: kay Yahweh na inyong Diyos
  rationale: Sa pandiwang חטא, ang ל ay tumutukoy sa Diyos bilang pinagkakasalahan. Ginagamit ang personal na pangalang Yahweh at natural na apposition sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng huling sugnay sa layunin ng utos
  choice: at sa gayon ay magkasala kayo
  alternative: at magkasala kayo
  rationale: Maaaring magpahiwatig ang waw + qatal ng bunga sa loob ng layuning mapigil ang pagtulad. Ang “sa gayon” ay nililinaw ang ugnayan ngunit hindi nagsasabing hindi maiiwasan ang pagkakasala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayo” para sa pangmaramihang ikalawang panauhan at ang “kasuklam-suklam na gawain” upang ihatid ang matinding moral-panrelihiyong diwa nang natural.
