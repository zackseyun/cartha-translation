base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: tl
  text: Tanging ang mga babae, ang maliliit na bata, ang mga alagang hayop, at ang lahat ng nasa lungsod—ang lahat ng samsam nito—ang maaari mong samsamin para sa iyong sarili. Maaari mong pakinabangan[a] ang samsam ng iyong mga kaaway, na ibinigay sa iyo ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “kainin.” Ang pandiwang Hebreo ay maaari ring tumukoy sa paggamit o pagtatamasa ng nakuhang samsam.'
    reason: Pinananatili ang literal na larawan at ang saklaw ng kahulugan ng אָכַל.
lexical_decisions:
- source_word: רַק
  choice: Tanging
  rationale: Ipinahahayag nito ang pagbubukod sa naunang utos at pinananatili ang mahigpit na diwang ‘only.’
- source_word: הַנָּשִׁים
  choice: ang mga babae
  rationale: Tuwirang salin ng pangngalang maramihan na tumutukoy sa mga babae.
- source_word: הַטַּף
  choice: ang maliliit na bata
  rationale: Karaniwang tumutukoy ang טַף sa maliliit na bata o mga batang umaasa sa matatanda; nililinaw ng saling ito ang murang edad.
- source_word: הַבְּהֵמָה
  choice: ang mga alagang hayop
  rationale: Sa konteksto ng samsam sa digmaan, tumutukoy ito sa mga domestikadong hayop, hindi lamang sa baka o sa lahat ng uri ng hayop.
- source_word: כָּל שְׁלָלָהּ תָּבֹז לָךְ
  choice: ang lahat ng samsam nito—ang maaari mong samsamin para sa iyong sarili
  rationale: Pinananatili ang pag-uulit ng salitang-ugat na may diwang ‘samsam/samsamin’ at ang pakinabang para sa kinakausap.
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: Maaari mong pakinabangan ang samsam mula sa iyong mga kaaway
  rationale: Literal na ‘kainin’ ang אָכַל, ngunit dito ay maaaring tumukoy nang mas malawak sa paggamit o pagtatamasa ng nakuhang samsam. Inilalagay sa talababa ang literal na larawan upang hindi ito mawala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na nakasulat sa tekstong Hebreo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Natural at tuwirang salin ng pariralang tipan na nasa ikalawang panauhang isahan.
theological_decisions:
- issue: Puwersa ng mga pandiwa sa tagubiling legal
  choice: maaari mong
  alternative: samsamin mo / pakikinabangan mo
  rationale: Sa kontekstong ito, ipinahihintulot at itinatalaga ang maaaring gawin sa samsam. Ang ‘maaari mong’ ay malinaw sa modernong Tagalog nang hindi ginagawang payak na hula o mas mariing utos kaysa sa hinihingi ng konteksto.
- issue: Pagpapahayag sa וְאָכַלְתָּ (‘at kakainin mo’) kaugnay ng samsam
  choice: pakikinabangan, na may literal na salin sa talababa
  alternative: kakainin
  rationale: Maaaring gamitin ang pandiwang ‘kumain’ sa mas malawak na diwa ng paggamit o pagtatamasa. Dahil hindi lamang pagkain ang kabilang sa samsam, natural ang ‘pakinabangan,’ habang iniingatan ng talababa ang literal na metapora at ang posibleng mas makitid na pagbasa.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang ‘lungsod,’ ‘samsam,’ at ‘mga alagang hayop’ bilang mga salitang madaling maunawaan sa konteksto ng digmaan. Ang ikalawang panauhang isahan ay pinanatili sa ‘mo/iyo,’ gaya ng Hebreo.
