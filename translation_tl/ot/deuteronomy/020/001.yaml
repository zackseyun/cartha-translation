base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: tl
  text: Kapag humayo ka upang makipagdigma laban sa iyong mga kaaway at makakita ka ng mga kabayo at mga karwaheng pandigma[a], at ng isang bayang mas marami kaysa sa iyo[b], huwag kang matakot sa kanila, sapagkat si Yahweh na iyong Diyos ay kasama mo, siya na naglabas sa iyo mula sa lupain ng Ehipto.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabayo at karwaheng pandigma.” Ang mga isahang pangngalan sa Hebreo ay malamang na ginagamit nang kolektibo para sa mga puwersang militar.
    reason: lexical_alternative
  - marker: b
    text: O “isang bayang mas dakila kaysa sa iyo.” Malamang na ang diin dito ay mas marami sa bilang ang kalaban.
    reason: lexical_alternative
  - marker: c
    text: Literal na “nagpaahon sa iyo mula sa lupain ng Ehipto.” Tinutukoy nito ang Exodo bilang batayan ng pagtitiwala ng Israel.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: Kapag humayo ka upang makipagdigma
  rationale: Ang כִּי kasama ng di-ganap na pandiwa ay naglalahad ng isang inaasahang kalagayan. Ang “kapag” ay likas sa Tagalog, at pinananatili ng “humayo ... upang makipagdigma” ang idyomang militar na יצא למלחמה.
- source_word: עַל אֹיְבֶיךָ
  choice: laban sa iyong mga kaaway
  rationale: Sa konteksto ng pakikipagdigma, ang עַל ay nagpapahayag ng pagkilos laban sa kalaban; pinananatili rin ang maramihang anyo ng “mga kaaway.”
- source_word: וְרָאִיתָ
  choice: at nakita mo
  rationale: Bagaman ganap ang anyong Hebreo, ipinagpapatuloy nito ang hinaharap na tagpo. Ang pangnagdaan sa sugnay na may “kapag” ay natural sa Tagalog para sa kondisyong natupad na sa loob ng inaasahang pangyayari.
- source_word: סוּס וָרֶכֶב
  choice: mga kabayo at mga karwaheng pandigma
  rationale: Ang mga isahang pangngalan sa Hebreo ay malamang na kolektibo. Ginawang maramihan sa Tagalog upang malinaw na tumukoy sa mga puwersang kabalyerya at mga karwaheng gamit sa digmaan.
- source_word: עַם רַב מִמְּךָ
  choice: isang bayang mas marami kaysa sa iyo
  rationale: Ang רַב na may paghahambing na מִן ay pangunahing tumutukoy sa kalamangan sa bilang. Ang “bayan” ay nagpapanatili sa עַם at umiiwas na paliitin ang kahulugan tungo lamang sa “hukbo.”
- source_word: לֹא תִירָא מֵהֶם
  choice: huwag kang matakot sa kanila
  rationale: Ang di-ganap na pandiwa sa kontekstong tagubilin ay isang pagbabawal; ito ang tuwiran at likas na anyo sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: kasama mo si Yahweh na iyong Diyos
  rationale: Tuwirang ipinahahayag ng עִמָּךְ ang presensiya ng Diyos sa piling ng Israel. Likas sa Tagalog ang ayos na “kasama mo si...”
- source_word: הַמַּעַלְךָ
  choice: siya ang nag-ahon sa iyo
  rationale: Ang may-artikulong participle ay kumikilala kay Yahweh bilang siyang gumawa nito. Pinananatili ng “nag-ahon” ang pataas na larawan ng עלה, sa halip na tahimik itong gawing “naglabas.”
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Tuwiran at natural na salin ng heograpikong parirala.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Ang transliterasyong “Yahweh” ay nagpapanatili rito nang hindi pinapalitan ng titulong “PANGINOON.”
- issue: Larawan ng Exodo sa הַמַּעַלְךָ
  choice: nag-ahon sa iyo
  alternative: naglabas sa iyo
  rationale: Ang ugat na עלה ay literal na may diwang “umakyat/mag-ahon.” Pinananatili ng napiling salin ang larawang ito at ang alingawngaw ng Exodo, habang kinikilala sa talababa ang mas idiomatikong alternatibo.
- issue: Saklaw ng עַם רַב מִמְּךָ
  choice: isang bayang mas marami kaysa sa iyo
  alternative: isang bayang mas makapangyarihan kaysa sa iyo
  rationale: Maaaring malawak ang רַב, ngunit sa tagpong militar na may mga kabayo at karwahe, malamang na bilang ang diin. Hindi ito isinaling “mas makapangyarihan” upang hindi lutasin ang paghahambing sa pabor ng lakas lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “humayo” dahil angkop ito sa pormal na tagubiling militar, ngunit pinanatiling payak ang natitirang pangungusap. Inayos ang appositional participle bilang em dash na sugnay upang maging malinaw na si Yahweh rin ang nag-ahon sa Israel. Inilagay ang bawat marker sa mismong bahaging tinutukoy nito.
