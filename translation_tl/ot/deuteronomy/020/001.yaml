- from: Kapag humayo ka upang makipagdigma laban sa iyong mga kaaway at nakita mo ang mga kabayo at mga karwaheng pandigma[a], at ang isang bayang mas marami kaysa sa iyo[b], huwag kang matakot sa kanila, sapagkat kasama mo si Yahweh na iyong Diyos—siya ang nag-ahon sa iyo mula sa lupain ng Ehipto.[c]
  to: Kapag humayo ka upang makipagdigma laban sa iyong mga kaaway at makakita ka ng mga kabayo at mga karwaheng pandigma[a], at ng isang bayang mas marami kaysa sa iyo[b], huwag kang matakot sa kanila, sapagkat si Yahweh na iyong Diyos ay kasama mo, siya na naglabas sa iyo mula sa lupain ng Ehipto.[c]
  rationale: Inayos ang sintaks upang maging likas ang magkakaugnay na bagay ng “makakita,” at pinalitan ang “nag-ahon” ng “naglabas” upang malinaw na tukuyin ang Exodo sa modernong Tagalog. Ang literal na pataas na larawan ng Hebreo ay napanatili sa talababa. Ang mga marker ay nananatiling nakadikit sa mismong mga pariralang kanilang nililinaw.
