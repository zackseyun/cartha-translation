source:
  edition: WLC
  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: tl
  text: at sasabihin niya sa kanila, “Makinig, Israel! Ngayon ay malapit na kayong makipaglaban sa inyong mga kaaway. Huwag kayong panghinaan ng loob.[a] Huwag kayong matakot, huwag kayong mataranta,[b] at huwag kayong masindak sa harap nila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Huwag manghina ang inyong puso.” Ang idyomang Hebreo ay tumutukoy sa pagkawala ng tapang.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Huwag kayong matakot, huwag kayong malito sa takot, at huwag kayong masindak sa harap nila.” Ang magkakasunod na pagbabawal ay nagpapalakas sa utos na huwag madaig ng takot sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: at sasabihin niya
  rationale: Ang waw-prefixed perfect ay nagpapatuloy sa itinakdang pamamaraan sa naunang konteksto. Likas sa modernong Tagalog ang hinaharap na “sasabihin niya,” at pinananatili nito ang tahasang isahang tagapagsalita sa Hebreo.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Makinig, Israel
  rationale: Pinananatili ang pormulang panawagan sa Deuteronomio at ang diwang hindi lamang pagdinig kundi pagbibigay-pansin at pagsunod.
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: Ngayon ay malapit na kayong makipaglaban
  rationale: Ipinahahayag nang natural sa Tagalog ang nalalapit na pagharap sa labanan. Ang “malapit na” ay nagpapanatili sa larawan ng pagiging nalalapit, samantalang ang “makipaglaban” ay malinaw sa kontekstong militar.
- source_word: עַל אֹיְבֵיכֶם
  choice: sa inyong mga kaaway
  rationale: Kasama ng pandiwang “makipaglaban,” likas na ipinahahayag ng “sa” ang pakikipaglaban laban sa mga kaaway nang hindi inuulit ang salitang “laban.”
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: Huwag kayong panghinaan ng loob
  rationale: Ito ang likas at dignified na idyomang Tagalog para sa paghina o pagbagsak ng tapang. Ipinaliliwanag sa talababa ang literal na larawan ng pusong nanghihina.
- source_word: אַל תִּירְאוּ
  choice: Huwag kayong matakot
  rationale: Tuwiran at malinaw na katumbas ng pagbabawal sa pagkatakot.
- source_word: וְאַל תַּחְפְּזוּ
  choice: huwag kayong mataranta
  rationale: Sa konteksto ng labanan, tumutukoy ang pandiwa sa pagkagulo at biglang pagkabalisa, hindi lamang sa pagmamadali.
- source_word: וְאַל תַּעַרְצוּ
  choice: at huwag kayong masindak
  rationale: Ang “masindak” ay nagpapahayag ng matinding takot sa harap ng kalaban at naiiba pa rin sa karaniwang “matakot” at sa pagkataranta.
- source_word: מִפְּנֵיהֶם
  choice: sa harap nila
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreong “mula/sa harap nila” at natural pa rin sa Tagalog bilang pagkatakot sa presensiya ng mga kaaway.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang pormulang “Makinig, Israel,” ang pag-uulit ng “huwag kayong,” at ang tumitinding serye ng mga pagbabawal. Iniwasan ang arkaikong bokabularyo at ang hindi likas na pag-uulit ng “labanan laban sa.”
