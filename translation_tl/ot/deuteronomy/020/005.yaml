base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: tl
  text: Pagkatapos, magsasalita ang mga opisyal sa bayan at sasabihin, “Sinong lalaki ang nagtayo ng bagong bahay ngunit hindi pa niya ito napasinayaan[a]? Hayaan siyang umalis at umuwi sa kanyang bahay, baka mamatay siya sa labanan at ibang lalaki ang magpasinaya nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “naitalaga.” Ang pandiwang Hebreo ay tumutukoy sa pormal na pagsisimula ng paggamit sa bagong bahay, na madalas ay may diwa ng pagtatalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: mga opisyal
  rationale: Sa kontekstong sibil at militar ng Deuteronomio, tumutukoy ito sa mga hinirang na tagapangasiwa o opisyal, hindi lamang sa mga eskriba.
- source_word: הָעָם
  choice: bayan
  rationale: Literal itong tumutukoy sa ‘bayan’ o ‘mga tao.’ Sa konteksto, sila ang nagkakatipong maaaring lumaban, ngunit iniiwasang gawing mas tiyak ang salin kaysa sa Hebreo.
- source_word: מִי הָאִישׁ
  choice: Sinong lalaki
  rationale: Pinananatili ang panlalaking isahan sapagkat ang konteksto ay tungkol sa mga lalaking nararapat lumahok sa labanan.
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: nagtayo ng bagong bahay
  rationale: Tuwirang katumbas ng בַּיִת ang ‘bahay,’ at natural sa makabagong Tagalog ang buong parirala.
- source_word: וְלֹא חֲנָכוֹ
  choice: ngunit hindi pa ito naitalaga
  rationale: Ang חנך ay tumutukoy sa pormal na pagsisimula ng paggamit sa bahay, karaniwang may diwang pag-aalay o pagtatalaga. Ang ‘naitalaga’ ay dignified at nagpapanatili ng posibilidad ng seremonyal na diwa.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Hayaan siyang umalis at umuwi sa kanyang bahay
  rationale: Bagaman anyong imperfect ang mga pandiwa, tagubilin ang puwersa ng mga ito sa legal na konteksto; malinaw itong naipahahayag ng ‘Hayaan siyang…’
- source_word: פֶּן
  choice: baka
  rationale: Natural na ipinahahayag ng ‘baka’ ang babala o kinalabasang nais iwasan na taglay ng פֶּן.
- source_word: יָמוּת בַּמִּלְחָמָה
  choice: mamatay siya sa labanan
  rationale: Pinananatili ang tiyak at kongkretong diwa ng kamatayan sa mismong labanan.
- source_word: וְאִישׁ אַחֵר
  choice: ibang lalaki
  rationale: Pinananatili ang tahasang panlalaki at isahang anyo ng Hebreo.
- source_word: יַחְנְכֶנּוּ
  choice: mag-talalaga nito
  rationale: Layuning ulitin ang parehong salitang-ugat na ginamit sa naunang חנך upang mapanatili ang leksikal na pag-uulit ng Hebreo.
