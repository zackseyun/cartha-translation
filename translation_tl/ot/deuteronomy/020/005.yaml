  to: Pagkatapos, magsasalita ang mga opisyal sa bayan at sasabihin, “Sinong lalaki ang nagtayo ng bagong bahay ngunit hindi pa niya ito napasinayaan[a]? Hayaan siyang umalis at umuwi sa kanyang bahay, baka mamatay siya sa labanan at ibang lalaki ang magpasinaya nito.”
  rationale: Pinalitan ang mga anyo ng “italaga/magtalaga” ng magkaugnay na “napasinayaan/magpasinaya.” Mas malinaw nitong isinasalin ang חנך sa konteksto ng bagong bahay, pinananatili ang pag-uulit ng pandiwa sa Hebreo, at iniiwasan ang karaniwang diwang ‘magtalaga o mag-atas.’ Inayos din ang panghalip sa unang sugnay upang malinaw na ang lalaking nagtayo ng bahay ang hindi pa nagpasinaya nito.
