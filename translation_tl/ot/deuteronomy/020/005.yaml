  source_fidelity: 'Tumpak ang pangunahing diwa at pagkakasunod ng Hebreo: nagsasalita ang mga opisyal sa bayan, ang lalaking nagtayo ng bagong bahay ngunit hindi pa ito napasinayaan ay pauuwiin, upang hindi siya mamatay sa labanan at ibang lalaki ang magpasinaya nito. Gayunman, ang huling “magtalaga nito” ay karaniwang nangangahulugang mag-atas o magtalaga ng isang bagay, hindi magpasinaya o magtalaga ng bahay sa paraang hinihingi ng חנך.'
  naturalness: Malinaw at angkop sa modernong Filipino ang karamihan ng salin. Mas likas at mas malinaw para sa paulit-ulit na חנך ang “pasinaya,” lalo na sa bahay.
