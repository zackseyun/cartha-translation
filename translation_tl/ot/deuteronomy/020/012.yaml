  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: tl
  text: Ngunit kung hindi ito makikipagpayapaan sa iyo at sa halip ay makikipagdigma sa iyo, kukubkubin mo ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Ngunit kung hindi
  rationale: Ipinahihiwatig ng parirala ang salungat na kalagayan kumpara sa mapayapang tugon sa naunang talata; natural itong ipinapahayag sa Tagalog bilang “Ngunit kung hindi.”
- source_word: תַשְׁלִים עִמָּךְ
  choice: makikipagpayapaan sa iyo
  rationale: Ang Hiphil ng שׁלם sa kontekstong ito ay tumutukoy sa pagpasok sa mapayapang ugnayan o pakikipagkasundo. Pinananatili ng “makikipagpayapaan” ang malinaw na diwa ng pakikipagpayapaan at ang ugnayang ipinahahayag ng עִם.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: at sa halip ay makikipagdigma sa iyo
  rationale: Ang idyomang עשה מלחמה ay nangangahulugang gumawa o maglunsad ng digmaan. Natural sa modernong Tagalog ang “makikipagdigma,” samantalang nililinaw ng “sa halip” ang pagsalungat nito sa pakikipagpayapaan.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: kukubkubin mo ito
  rationale: Ang צור na may עַל ay tumutukoy sa pagkubkob sa isang lunsod. Ang “kukubkubin mo ito” ay tuwiran, natural, at nagpapanatili sa lakas ng tagubilin sa legal na konteksto.
