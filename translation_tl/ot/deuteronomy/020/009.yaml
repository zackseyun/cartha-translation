  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: tl
  text: Kapag natapos nang magsalita sa bayan ang mga opisyal, magtatalaga sila[a] ng mga kumander ng hukbo upang mamuno sa bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “titipunin nila ang mga kumander ng hukbo upang mamuno sa bayan.” Ang pandiwa ay maaari ring mangahulugang magtipon o maglagay sa tungkulin, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: At kapag natapos na
  rationale: Ang pormulang וְהָיָה na sinusundan ng כְּ at infinitive construct ay nagpapakilala ng sugnay na temporal. Likas sa modernong Tagalog ang “kapag natapos na” at malinaw nitong ipinapakitang mauuna ang pagsasalita bago ang pagtatalaga.
- source_word: הַשֹּׁטְרִים
  choice: ang mga opisyal
  rationale: Sa Deuteronomio, tumutukoy ito sa mga itinalagang tagapangasiwang may tungkuling sibiko at pangmilitar. Mas angkop ang “mga opisyal” kaysa “mga eskriba” o sa napakalawak na “mga pinuno.”
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: magsalita sa bayan
  rationale: Pinananatili nito ang tuwirang kahulugan ng parirala at hindi ginagawang “mga kawal” ang עָם, bagaman pangmilitar ang konteksto.
- source_word: וּפָקְדוּ
  choice: magtatalaga sila
  rationale: Malawak ang saklaw ng פקד, kabilang ang magtalaga, magtipon para sa tungkulin, at maglagay sa pamamahala. Sa kontekstong ang layon ay mga kumander at ang kasunod ay posisyon ng pamumuno, “magtatalaga” ang pinakamalinaw na pangunahing salin; nasa talababa ang tunay na leksikal na alternatibo.
- source_word: שָׂרֵי צְבָאוֹת
  choice: mga kumander ng mga hukbo
  rationale: Ipinahahayag ng שָׂרֵי ang mga pinunong militar at ng צְבָאוֹת ang mga hukbo o puwersa. Karaniwan at malinaw sa modernong Filipino ang “mga kumander ng mga hukbo.”
- source_word: בְּרֹאשׁ הָעָם
  choice: upang manguna sa bayan
  rationale: Literal itong “sa ulo ng bayan,” isang idyoma para sa posisyon ng pamumuno. Inihahatid ng “upang manguna sa bayan” ang diwa sa natural na Tagalog nang hindi ito napagkakamalang tumutukoy lamang sa pisikal na puwesto sa unahan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “bayan” para sa עָם upang hindi labis na tukuying mga kawal lamang ang kausap, at “kumander” bilang karaniwang katawagang militar. Ang Hebreong idyomang “sa ulo ng bayan” ay isinaling ayon sa diwang pamumuno.
