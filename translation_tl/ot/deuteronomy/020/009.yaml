    issue: Hindi likas ang “At kapag” sa simula ng pangungusap.
    rationale: Ang וְהָיָה כְּ + infinitive ay pormulang temporal. Sapat at mas idiomatiko ang “Kapag”; ang “At” ay hindi kailangang panatilihin sa Filipino.
  - severity: medium
    issue: 'Ang talababa ay naglalarawan ng alternatibo na para bang dalawang kilos ang ginawa: pagtitipon at paglalagay sa pamumuno.'
    rationale: Iisang pandiwang פקד ang nasa Hebreo. Maaari itong magkaroon ng kahulugang magtalaga o magmuster/magtipon ayon sa konteksto, ngunit hindi dapat gawing dalawang magkakasunod na pandiwa sa alternatibong salin.
  revised_text: Kapag natapos nang magsalita sa bayan ang mga opisyal, magtatalaga sila[a] ng mga kumander ng hukbo upang mamuno sa bayan.
