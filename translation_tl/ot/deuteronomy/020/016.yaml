source:
  edition: WLC
  text: רַ֗ק מֵ/עָרֵ֤י הָֽ/עַמִּים֙ הָ/אֵ֔לֶּה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כָּל נְשָׁמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: tl
  text: Ngunit sa mga lungsod ng mga bayang ito na ibinibigay sa iyo ni Yahweh na iyong Diyos bilang pamana, huwag mong hayaang mabuhay ang anumang may hininga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “anumang humihinga.” Sa literal, “bawat hininga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Dito, nagmamarka ang רַק ng pagbubukod at pagsalungat sa naunang tagubilin tungkol sa malalayong lungsod; likas sa Tagalog ang “Ngunit” bilang panandang ito.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: sa mga lungsod ng mga bayang ito
  rationale: Ang מִן ay nagpapakilala sa mga lungsod na ibinubukod sa naunang tuntunin. Pinananatili ng “mga bayan” ang kolektibong kahulugan ng עַמִּים nang hindi kinakailangang magpahiwatig ng makabagong nation-state.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Direkta at natural na katumbas ng pariralang tumutukoy kay Yahweh bilang Diyos ng kinakausap.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: ibinibigay sa iyo ... bilang pamana
  rationale: Ipinahihiwatig ng participle נֹתֵן ang nagpapatuloy na pagkakaloob, at pinananatili ng “pamana” ang mahalagang terminolohiya ng tipan at lupain sa נַחֲלָה.
- source_word: לֹא תְחַיֶּה
  choice: huwag mong hahayaang mabuhay
  rationale: 'Ipinahahayag nito ang causative na puwersa ng Piel ng חיה: huwag hayaang manatiling buhay o huwag panatilihing buhay.'
- source_word: כָּל נְשָׁמָה
  choice: anumang may hininga
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreo, “bawat hininga/bagay na humihinga,” habang natural at malinaw sa makabagong Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng נַחֲלָה sa pagkakaloob ng lupain
  choice: bilang pamana
  alternative: bilang pag-aari
  rationale: Pinananatili ng “pamana” ang bigat ng terminolohiya tungkol sa tipan at sa ipinagkaloob na lupain, nang hindi ito pinapaliit sa karaniwang pag-aari lamang.
- issue: Saklaw ng כָּל נְשָׁמָה
  choice: anumang may hininga
  alternative: sinumang may hininga; anumang nabubuhay
  rationale: Hindi tahasang nilulutas ng anyong Hebreo kung dapat idiin ang mga tao lamang o ang mas malawak na literal na saklaw. Pinananatili ng salin ang tunay na lawak at kongkretong larawan ng “may hininga.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga bayan” sa kolektibong diwa ng mga people group, “pamana” para sa terminolohiyang pangtipan, at “anumang may hininga” upang mapanatili ang konkretong Hebreong larawan at ang lawak nito.
