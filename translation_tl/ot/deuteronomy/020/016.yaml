    issue: Di-pamantayang anyo ng pandiwa matapos ang ‘huwag’
    rationale: Sa modernong Filipino, mas natural at pamantayan ang ‘huwag mong hayaang mabuhay’ kaysa ‘huwag mong hahayaang mabuhay.’ Pareho ang nilalayong kahulugan, ngunit ang una ang mas maayos na anyong pautos na pagbabawal.
