  text: כִּֽי הַחֲרֵ֣ם תַּחֲרִימֵ֗/ם הַ/חִתִּ֤י וְ/הָ/אֱמֹרִי֙ הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: tl
  text: Sa halip, lubusan ninyo silang lipulin[a]—ang mga Heteo, mga Amoreo, mga Cananeo, mga Perezeo, mga Heveo, at mga Jebuseo—gaya ng iniutos sa inyo ni Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tiyak na italaga sila sa ganap na pagkawasak.” Ang pandiwa ay tumutukoy sa paglalagay sa kanila sa ilalim ng pagbabawal, anupat lubusan silang itinalaga sa pagkawasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sa halip
  rationale: Sa konteksto, inilalarawan ng pangatnig ang pagsalungat sa utos na huwag patayin ang mga naninirahan sa malalayong lungsod; natural na ipinahahayag ito ng “Sa halip.”
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: lubusan ninyo silang lipulin
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapalakas sa utos. Malinaw at natural sa makabagong Tagalog ang “lubusan ... lipulin,” habang ipinaliliwanag sa talababa ang natatanging diwa ng חרם bilang pagtatalaga sa ganap na pagkawasak.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: ang mga Heteo, mga Amoreo, mga Cananeo, mga Perezeo, mga Heveo, at mga Jebuseo
  rationale: Ginamit ang mga nakaugaliang anyong Filipino ng mga pangalang etniko at ang “mga” upang ihayag ang kolektibong kahulugan ng mga singular na gentiliko sa Hebreo.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: gaya ng iniutos sa inyo
  rationale: Tuwirang ipinapahayag nito ang paghahambing at ang naunang utos na nananatiling may bisa. Ang “inyo” ay angkop sa kolektibong Israel na kinakausap.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalan ng Diyos na יהוה at ang tipanang pormulang “inyong Diyos.”
theological_decisions:
- issue: Pagpapahayag sa חרם sa utos tungkol sa digmaan
  choice: lubusan ninyo silang lipulin
  alternative: lubusan ninyo silang italaga sa pagkawasak; ilagay ninyo sila sa ilalim ng pagbabawal
  rationale: Pinananatili ng pangunahing teksto ang madiin at ganap na saklaw ng utos sa natural na Tagalog. Hindi nito ikinukubli ang marahas na kahulugan, samantalang pinananatili ng talababa ang legal at panrelihiyong diwa ng חרם na higit sa karaniwang pagpatay.
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginamit ang transliterasyon ng personal na pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lipulin” upang natural at tuwirang maipahayag ang ganap na pagkawasak; iniwasan ang sobrang teknikal na pananalita sa pangunahing teksto, ngunit pinanatili ang natatanging diwa ng חרם sa talababa.
