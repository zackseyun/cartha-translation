  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: tl
  text: At darating ang Levita, sapagkat wala siyang bahagi o mana kasama mo; darating din ang dayuhang naninirahan, ang ulila, at ang biyuda, na pawang nasa loob ng iyong mga pintuang-bayan[a]. Kakain sila at mabubusog, upang pagpalain ka ni Yahweh na iyong Diyos sa bawat gawaing ginagawa ng iyong mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nasa loob ng iyong mga pintuang-bayan” ay isang idyomang Hebreo na tumutukoy sa mga naninirahan sa iyong mga bayan o lokal na pamayanan.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: At darating
  rationale: Ang anyong perpekto na may pang-ugnay sa kontekstong legal ay may puwersang inaasahan o itinatakdang kilos; natural itong ipinahahayag sa Filipino sa hinaharap.
- source_word: הַלֵּוִי
  choice: ang Levita
  rationale: Tumutukoy ito sa uring panlipi na Levita, hindi kinakailangang sa isang saserdote.
- source_word: חֵלֶק וְנַחֲלָה
  choice: bahagi o mana
  rationale: Pinananatili ang magkaugnay ngunit hindi ganap na magkaparehong diwa ng nakalaang bahagi at minanang ari-arian.
- source_word: הַגֵּר
  choice: ang dayuhang naninirahan sa inyo
  rationale: Ipinahahayag nito ang isang hindi Israelitang dayuhan na naninirahan sa pamayanan, hindi lamang isang panandaliang bisita.
- source_word: הַיָּתוֹם
  choice: ang ulila
  rationale: Karaniwan at malinaw na katawagan sa Filipino para sa mahina at walang magulang o ama na uring panlipunang tinutukoy.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: nasa loob ng iyong mga pintuang-bayan
  rationale: Pinananatili ang larawang Hebreo ng mga pintuan bilang pagtukoy sa bayan o lokal na pamayanan, na nililinaw sa talababa.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: Kakain sila at mabubusog
  rationale: 'Inilalahad ang inaasahang bunga ng inilaan na ikapu: makakakain sila nang sapat.'
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: upang pagpalain ka
  rationale: Pinananatili ang layunin o inaasahang resulta, sa halip na gawing isang walang-pasubaling hula.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: sa lahat ng gawa ng iyong mga kamay
  rationale: Natural na idyomang Filipino para sa lahat ng gawain ng tao; hindi na inuulit ang 'na iyong gagawin' dahil kalabisan iyon sa Filipino ngunit buo ang diwa.
theological_decisions:
- issue: Paglalarawan sa ugnayan ng pagpapala at pagsunod
  choice: upang pagpalain ka
  alternative: at pagpapalain ka
  rationale: Ang לְמַעַן na sinusundan ng di-ganap na pandiwa ay nagpapahayag ng layunin o inaasahang resulta, hindi kinakailangang isang awtomatikong pangako.
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang teksto ay gumagamit ng personal na pangalang tipan; pinananatili ito bilang Yahweh sa halip na palitan ng titulong 'PANGINOON.'
- issue: Katayuan ng Levita
  choice: Levita
  alternative: Levitang saserdote
  rationale: Hindi espesipikong tinatawag ng talata na saserdote ang Levita, kaya hindi idinaragdag ang katungkulang iyon.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang isahang 'mo/iyong' upang mapanatili ang kolektibong isahang pakikipag-usap sa Israel. Pinanatili ang idyomang 'mga pintuang-bayan' sa teksto at ipinaliwanag ito sa talababa.
