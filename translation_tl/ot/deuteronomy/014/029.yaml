revisions:
- from: At darating ang Levita, sapagkat wala siyang bahagi o mana kasama mo, gayundin ang dayuhang naninirahan sa inyo, ang ulila, at ang biyudang nasa loob ng iyong mga pintuang-bayan[a]. Kakain sila at mabubusog, upang pagpalain ka ni Yahweh na iyong Diyos sa lahat ng gawa ng iyong mga kamay.
  to: At darating ang Levita, sapagkat wala siyang bahagi o mana kasama mo; darating din ang dayuhang naninirahan, ang ulila, at ang biyuda, na pawang nasa loob ng iyong mga pintuang-bayan[a]. Kakain sila at mabubusog, upang pagpalain ka ni Yahweh na iyong Diyos sa bawat gawaing ginagawa ng iyong mga kamay.
  rationale: Nilinaw ang sintaks upang ang lahat ng tatlong maralitang pangkat, kasama ng Levita, ay maunawaang kabilang sa mga darating at kakain. Idinagdag ang katumbas ng “na iyong ginagawa” sa huling sugnay. Walang binagong kahulugang teolohikal o ipinataw na interpretasyon.
