  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: tl
  text: 'At ito ang mga hindi ninyo dapat kainin mula sa mga iyon: ang agila[a], ang buwitreng may balbas, at ang itim na buwitre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang pagkakakilanlan sa mga ibong tinutukoy ng mga pangalang Hebreo sa talatang ito. Ang “agila” ay maaaring tumukoy sa isang malaking buwitre; ang “buwitreng may balbas” ay tradisyonal na tinatawag na “ossifrage”; at ang “itim na buwitre” ay isinasalin naman ng ilan bilang “osprey” o “agilang-dagat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: At ito naman ang mga
  rationale: Bagaman isahan sa anyo ang Hebreo (“at ito”), nagpapakilala ito ng isang talaan; natural sa makabagong Tagalog ang “ito naman ang mga.”
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: hindi ninyo dapat kainin sa mga iyon
  rationale: Pinananatili ang tuwirang pagbabawal at ang partitive na diwa ng מִן, na tumutukoy sa mga ibong binanggit sa nakapaligid na konteksto.
- source_word: הַנֶּשֶׁר
  choice: ang agila
  rationale: Ito ang tradisyonal at madaling makilalang salin, bagaman maaaring tumukoy ang salitang Hebreo sa isang malaking buwitre; inilalahad ang kawalang-katiyakan sa talababa.
- source_word: הַפֶּרֶס
  choice: ang buwitreng may balbas
  rationale: Makabagong pangalan ito para sa ibong mandaragit at kumakain ng bangkay na malamang na tinutukoy; higit itong nauunawaan kaysa sa mga teknikal o makalumang katawagan.
- source_word: הָעָזְנִיָּה
  choice: ang buwitreng itim
  rationale: Isa itong karaniwang makabagong pagkakakilanlan, ngunit hindi tiyak ang eksaktong uri kaya binanggit sa talababa ang ibang mga mungkahi.
