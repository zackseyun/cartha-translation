  text: the glede[a], and the falcon, and the kite according to its kind,
translation:
  language: tl
  text: ang pulang lawin[a], ang palkon, at ang saranggola ayon sa uri nito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng mga ibong ito. Iba-iba ang tradisyonal at makabagong salin, gaya ng “pulang lawin,” “saranggola,” at “palkon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָאָה
  choice: pulang lawin
  rationale: Hindi tiyak ang eksaktong uri ng ibon; tumutukoy ito sa isang ibong mandaragit na madalas kilalaning red kite. Ang “pulang lawin” ay likas at madaling maunawaang katawagan sa modernong Filipino, habang inilalahad sa talababa ang kawalang-katiyakan.
- source_word: הָאַיָּה
  choice: palkon
  rationale: Karaniwang nauunawaan bilang isang ibong mandaragit at madalas isinasaling “falcon.” Pinananatili nitong bukod ang katawagan sa dalawang kalapit na terminong maaaring tumukoy sa mga uri ng kite.
- source_word: הַדַּיָּה
  choice: saranggola
  rationale: Madalas kilalanin ang salitang ito bilang “kite,” isang uri ng ibong mandaragit. Ginamit ang “saranggola” bilang kinikilalang pangalang Filipino ng ibon, bagaman maaaring mapagkamalan itong laruan kung walang konteksto.
- source_word: לְמִינָהּ
  choice: ayon sa uri nito
  rationale: Pinananatili ang pormulang Hebreo na tumutukoy sa lahat ng kauri o mga uri sa loob ng pangkat.
- source_word: וְאֶת / וְ
  choice: ang / at ang
  rationale: Ang pang-ugnay at pananda ng tuwirang layon ay likas na inilalahad sa Filipino sa pamamagitan ng magkakaugnay na mga item sa talaan; ginamit ang “at” bago ang huling item.
