translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang karaniwang “lawin” at ang hiram ngunit pamilyar na “palkon”; ang “saranggola” ay zoological na katawagan dito. Pinanatili ang anyong talaan at ang pormulang “ayon sa uri nito.”
