  text: You may eat any clean bird[a].
translation:
  language: tl
  text: Maaari ninyong kainin ang anumang malinis na ibon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Ang lahat ng malinis na ibon ay maaari ninyong kainin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: anumang
  rationale: Ipinahihiwatig ng pang-uring pamilang ang walang pagtatanging saklaw sa loob ng pinahihintulutang uri. Sa Filipino, likas na naipapahayag ng “anumang” ang diwang maaaring kainin ang bawat kabilang sa uring ito.
- source_word: עוֹף
  choice: ibon
  rationale: Bagaman maaari itong tumukoy nang mas malawak sa lumilipad na nilalang, mga ibon ang malinaw na tinutukoy sa kagyat na konteksto ng mga tuntunin sa pagkain.
- source_word: טָהוֹר
  choice: malinis
  rationale: Sa konteksto ng mga tuntunin sa pagkain, ito ang kategoryang ritwal na “malinis,” hindi pangkalahatang kalinisan sa katawan o kadalisayang moral.
- source_word: תֹּאכֵלוּ
  choice: maaari ninyong kainin
  rationale: Ang anyong pandiwa sa kontekstong legal ay nagpapahayag ng pahintulot. Nililinaw ng saling ito ang kaibahan ng mga hayop na maaaring kainin sa mga ipinagbabawal kainin.
