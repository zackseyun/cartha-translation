review_pass:
  verdict: revise
  source_fidelity: Ang diwa ng utos, ang pagbibigay ng ikasampung bahagi ng buong taunang produktong agrikultural, ay naipapahayag nang wasto. Gayunman, ang “ani ng iyong itinanim na lumalabas sa bukid” ay may medyo alanganing ugnayan ng mga panuring sa Tagalog. Ang “nagmumula sa bukid” ay mas natural habang pinananatili ang saklaw ng Hebreong parirala.
  naturalness: Moderno at marangal ang rehistro, ngunit hindi karaniwan sa Tagalog na sabihing ang ani ay “lumalabas sa bukid.” Mas idiomatiko ang “nagmumula sa bukid.” Mas malinaw rin ang “ng lahat ng ani” kaysa “mula sa lahat ng ani” para sa bagay na pinagtititibag.
  terminology: Ang “ikasampung bahagi” ay malinaw at tumpak na katumbas ng pandiwang tumutukoy sa ikapu. Hindi kailangang ipilit ang mas teknikal na “ikapu.” Ang “ani” ay angkop para sa תְּבוּאַת, at ang “iyong itinanim” ay sapat na kumakatawan sa זַרְעֶךָ sa kontekstong agrikultural.
  issues:
  - severity: low
    issue: Hindi gaanong likas ang “ani ng iyong itinanim na lumalabas sa bukid.”
    rationale: Maaaring basahin na ang “iyong itinanim,” sa halip na ang ani, ang siyang “lumalabas sa bukid.” Ang “ani ng iyong itinanim na nagmumula sa bukid” ay mas malinaw at natural.
  revised_text: Tiyakin mong magbigay ng ikasampung bahagi ng lahat ng ani ng iyong itinanim na nagmumula sa bukid,[a] taon-taon.
  revised_footnotes:
  - marker: a
    text: O, sa mas malayang salin, “Tiyakin mong magbigay taun-taon ng ikasampung bahagi ng lahat ng ani ng iyong bukid.”
    reason: lexical_alternative
  revision_rationale: Pinalitan ang “lumalabas sa bukid” ng “nagmumula sa bukid” upang maging likas at malinaw sa modernong Tagalog ang panuring sa ani, nang hindi binabago ang literal na larawang ang ani ay nagmumula sa bukid. Pinalitan din ang “mula sa lahat ng ani” ng “ng lahat ng ani” upang mas tuwirang maipahayag na ang ikasampung bahagi ay batay sa kabuuang ani.
