- from: Tiyakin mong magbigay ng ikasampung bahagi mula sa lahat ng ani ng iyong itinanim na lumalabas sa bukid,[a] taon-taon.
  to: Tiyakin mong magbigay ng ikasampung bahagi ng lahat ng ani ng iyong itinanim na nagmumula sa bukid,[a] taon-taon.
  rationale: Pinalitan ang “lumalabas sa bukid” ng “nagmumula sa bukid” upang maging likas at malinaw sa modernong Tagalog ang panuring sa ani, nang hindi binabago ang literal na larawang ang ani ay nagmumula sa bukid. Pinalitan din ang “mula sa lahat ng ani” ng “ng lahat ng ani” upang mas tuwirang maipahayag na ang ikasampung bahagi ay batay sa kabuuang ani.
