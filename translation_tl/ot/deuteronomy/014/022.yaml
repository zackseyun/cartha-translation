translation:
  language: tl
  text: Tiyakin mong magbigay ng ikasampung bahagi ng lahat ng ani ng iyong itinanim na nagmumula sa bukid,[a] taon-taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malayang salin, “Tiyakin mong magbigay taun-taon ng ikasampung bahagi ng lahat ng ani ng iyong bukid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: Tiyakin mong magbigay ng ikasampung bahagi
  rationale: Ang infinitive absolute na sinusundan ng finite verb ay nagbibigay-diin sa utos. Likas sa modernong Tagalog ang “Tiyakin mong” upang maipahayag ang diin, samantalang malinaw na inilalarawan ng “magbigay ng ikasampung bahagi” ang gawaing tinutukoy.
- source_word: תְּבוּאַת
  choice: ani
  rationale: Tumutukoy ito sa bunga o ani ng pagsasaka. Ang “ani” ay malawak, natural, at madaling maunawaan sa Tagalog.
- source_word: זַרְעֶךָ
  choice: ng iyong itinanim
  rationale: Bagaman literal na “iyong binhi,” sa konteksto ay tumutukoy ito sa itinanim at sa ibinungang ani. Pinananatili ng “iyong itinanim” ang larawan ng paghahasik nang hindi nililimitahan sa butil lamang.
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: na lumalabas sa bukid
  rationale: Malapit itong sumusunod sa larawan ng Hebreo na ang ani ay “lumalabas” mula sa bukid. Nagbibigay ang talababa ng mas likas at dinamikong alternatibo.
- source_word: שָׁנָה שָׁנָה
  choice: taon-taon
  rationale: Likas na katumbas ito ng inuulit na pariralang Hebreo at malinaw na nagpapahayag ng regular na taunang pag-uulit.
