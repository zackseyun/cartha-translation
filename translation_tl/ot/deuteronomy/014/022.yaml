translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ikasampung bahagi” sa halip na mas teknikal o di-gaanong pangkaraniwang “ikapu,” at pinanatili sa pangunahing teksto ang kongkretong larawan ng ani na lumalabas sa bukid.
