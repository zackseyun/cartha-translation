  yaml_path: translation/ot/deuteronomy/014/005.yaml
  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: tl
  text: ang usa[a], ang gasela, ang pulang usa, ang kambing-gubat, ang ibex, ang antilope, at ang tupang-bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang pagkakakilanlan ng ilan sa mga hayop sa talatang ito. Ang “pulang usa” ay maaari ring isang roebuck o usang dama; ang “kambing-gubat” ay maaaring ibex; ang “ibex” ay maaari ring addax o kambing-gubat; ang “antilope” ay maaaring ligaw na baka o aurochs; at ang “tupang-bundok” ay maaaring chamois o kambing-bundok.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: usa
  rationale: Karaniwang tumutukoy sa usa; ito ang malinaw at likas na pangkalahatang katawagan sa modernong Filipino.
- source_word: צְבִי
  choice: gasela
  rationale: Malawak na kinikilalang tumutukoy sa gazelle; ang hiram na salitang “gasela” ang pinakatiyak at madaling maunawaang katawagan.
- source_word: יַחְמוּר
  choice: usang pula
  rationale: Hindi tiyak ang eksaktong uri. Ang “usang pula” ay isang posibleng pagkakakilanlan at mas natural sa Filipino kaysa sa teknikal na “roebuck”; inilalahad sa talababa ang ibang posibilidad.
- source_word: אַקּוֹ
  choice: kambing-gubat
  rationale: Malamang na isang ligaw na hayop na kauri ng kambing, na maaaring ibex. Malinaw sa karaniwang mambabasa ang “kambing-gubat.”
- source_word: דִישֹׁן
  choice: ibex
  rationale: Hindi tiyak ang hayop, ngunit ang “ibex” ay isang kinikilalang posibleng pagtukoy. Pinananatili ang teknikal na pangalan upang maiba ito sa naunang kambing-gubat.
- source_word: תְאוֹ
  choice: antilope
  rationale: Posibleng tumukoy sa antilope, bagaman iminungkahi rin ang mailap na baka o aurochs; pinananatili sa talababa ang kawalang-katiyakan.
- source_word: זָמֶר
  choice: tupang-bundok
  rationale: Naghahatid ito ng malamang na uri ng hayop sa madaling maunawaang Filipino, habang inilalahad sa talababa ang ibang mungkahing pagkakakilanlan.
