  to: 'Gayunman, huwag ninyong kainin ang mga hayop na ito mula sa mga hayop na muling ngumunguya ng pagkaing mula sa sikmura o sa mga may biyak na kuko: ang kamelyo, ang liyebre[a], at ang hayraks[b]. Sapagkat muli nilang ngumunguya ang pagkaing mula sa sikmura, ngunit hindi biyak ang kanilang mga kuko. Ang mga ito ay marumi para sa inyo.'
