source:
  edition: WLC
  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: tl
  text: 'Gayunman, huwag ninyong kainin ang mga hayop na ito mula sa mga hayop na muling ngumunguya ng pagkaing mula sa sikmura o sa mga may biyak na kuko: ang kamelyo, ang liyebre[a], at ang hayraks[b]. Sapagkat muli nilang ngumunguya ang pagkaing mula sa sikmura, ngunit hindi biyak ang kanilang mga kuko. Ang mga ito ay marumi para sa inyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kuneho.” Malamang na liyebre ang tinutukoy ng salitang Hebreo, bagaman hindi ganap na tiyak ang eksaktong pagkakakilanlan ng hayop.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring tawaging “rock hyrax” o “rock badger.” Ang hayraks ay isang maliit na mamalyang karaniwang naninirahan sa mabatong lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Gayunman
  rationale: Ipinahihiwatig nito ang pagtatakda ng eksepsiyon sa tuntunin sa naunang talata, habang nananatiling natural at marangal sa makabagong Filipino.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: mula sa mga ngumunguya ng pagkaing ibinalik mula sa sikmura
  rationale: Inilalahad nang malinaw sa karaniwang mambabasa ang kilos ng pagnguya ng cud nang hindi umaasa sa isang teknikal o di-pamilyar na katawagan.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: o sa mga may biyak na kuko
  rationale: Ang “biyak na kuko” ay maikli, natural, at tumpak na paglalarawan ng split hoof; pinananatili rin ito sa paliwanag sa kasunod na pangungusap.
- source_word: הַגָּמָל
  choice: kamelyo
  rationale: Karaniwan at tuwirang katumbas sa Filipino.
- source_word: הָאַרְנֶבֶת
  choice: liyebre
  rationale: Ito ang malamang na hayop na tinutukoy ng salitang Hebreo; inilagay sa talababa ang posibleng alternatibong katawagan.
- source_word: הַשָּׁפָן
  choice: hayraks
  rationale: Tumutukoy ito sa maliit na mamalyang naninirahan sa mabatong lugar, na karaniwang kinikilalang hyrax. Ginamit ang inangkop na pangalan at ipinaliwanag sa talababa dahil hindi ito pamilyar sa lahat.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: Sapagkat ngumunguya sila ng pagkaing ibinalik mula sa sikmura
  rationale: Pinananatili ang sanhi at inuulit ang parehong paglalarawan para sa pagkakapare-pareho.
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: ngunit hindi biyak ang kanilang mga kuko
  rationale: Natural na Filipino na nagpapanatili sa pagsalungat at sa parehong terminong ginamit sa unang sugnay.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: Marumi ang mga ito para sa inyo
  rationale: Pinananatili ng “marumi” ang malawak na katawagang biblikal at ang legal na ugnayang “para sa inyo,” nang hindi nagdaragdag ng interpretasyong “ritwal” o “seremonyal.”
theological_decisions:
- issue: Kalikasan ng pagiging marumi sa batas tungkol sa pagkain
  choice: marumi
  alternative: marumi ayon sa ritwal / marumi ayon sa seremonya
  rationale: Ang Hebreong טָמֵא ay tumutukoy sa kategorya ng kalinisan sa tipan, ngunit hindi tahasang nililimitahan ng talata ang kahulugan sa salitang “ritwal” o “seremonyal.” Kaya pinanatili ang mas malawak na “marumi.”
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Iniwasan ang mga arkaiko at labis na teknikal na salita; ipinaliwanag ang kilos ng pagnguya sa halip na gumamit ng di-pamilyar na terminong panghayop. Inilagay ang mga pananda ng talababa kaagad pagkatapos ng kaukulang pangalan ng hayop.
