base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: tl
  text: Kayo ay mga anak na lalaki ni Yahweh, na inyong Diyos.[a] Huwag ninyong hiwain ang inyong sarili, at huwag kayong gumawa ng kalbong bahagi sa pagitan ng inyong mga mata[b] dahil sa isang namatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak ni Yahweh, na inyong Diyos.” Panlalaking maramihan ang salitang Hebreo, literal na “mga anak na lalaki.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa pagitan ng inyong mga mata”; tumutukoy ito sa bahagi ng noo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: mga anak
  rationale: Bagaman panlalaking maramihan ang Hebreo at literal na “mga anak na lalaki,” tumutukoy rito ang pahayag sa buong bayang kabilang sa tipan. Ang “mga anak” ay natural sa modernong Tagalog habang pinananatili sa talababa ang anyong panlalaki ng pinagmulan.
- source_word: לַיהוָה
  choice: ni Yahweh
  rationale: 'Ang lamed ay nagpapahayag dito ng kaugnayan o pag-aari: sila ay mga anak ni Yahweh. Pinananatili ang personal na pangalang Yahweh.'
- source_word: אֱלֹהֵיכֶם
  choice: na inyong Diyos
  rationale: Natural na Tagalog ito para sa “your God” sa loob ng pormulang pangtipan, at malinaw na inuugnay ang Diyos sa kausap na bayan.
- source_word: תִתְגֹּדְדוּ
  choice: sugatan ang inyong sarili
  rationale: Ang reflexive na pandiwa ay tumutukoy sa sadyang paghiwa o paglaslas sa sarili bilang kaugalian sa pagluluksa. Ang “sugatan” ay malinaw at dignified; hindi nito nililimitahan ang paraan sa isang tiyak na uri ng hiwa.
- source_word: תָשִׂימוּ קָרְחָה
  choice: mag-ahit ng bahagi
  rationale: Ang parirala ay tumutukoy sa paggawa ng kalbong bahagi, malamang sa pamamagitan ng pag-ahit, bilang tanda ng pagluluksa. Mas natural sa Tagalog ang pandiwang pariralang ito kaysa “gumawa ng pagkakalbo.”
- source_word: בֵּין עֵינֵיכֶם
  choice: sa pagitan ng inyong mga mata
  rationale: Pinananatili ang kongkretong idyomang Hebreo; ipinapaliwanag sa talababa na tumutukoy ito sa bahagi ng noo.
- source_word: לָמֵת
  choice: para sa patay
  rationale: Maikli at natural itong nagsasaad na ang mga gawaing ipinagbabawal ay isinasagawa bilang pagluluksa dahil sa isang namatay.
theological_decisions:
- issue: Panlalaking katawagan sa pagkakakilanlan ng bayang tipan
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Panlalaking maramihan ang בָּנִים, ngunit sa konteksto ay kinakausap ang buong Israel. Ang “mga anak” ang natural na kolektibong katawagan sa Tagalog; inilalahad ng talababa ang literal na anyo upang hindi maitago ang detalye ng Hebreo.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tahasang pinananatili ang pangalang pangtipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “kayo/ninyo/inyong” dahil maramihan ang kausap. Pinanatili ang Hebreong larawang “sa pagitan ng inyong mga mata,” kalakip ang paliwanag sa talababa.
