  terminology: Ang “Yahweh,” “Diyos,” “alak,” “inuming nakalalasing,” at “sambahayan” ay angkop. Ang “mga tupa at kambing” ay wastong malawak na salin ng צֹאן, at ang talababa ay maayos na nagpapaliwanag nito. Ang “inuming nakalalasing” ay wastong hindi labis na pagtukoy sa שֵׁכָר.
