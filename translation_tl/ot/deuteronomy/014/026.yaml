revisions:
- from: At gamitin mo ang salapi para sa anumang gustuhin mo—mga baka, mga tupa at kambing[a], alak, inuming nakalalasing[b], o anumang hingin ng iyong pagnanasa. Doon ka kakain sa harap ni Yahweh na iyong Diyos, at magagalak ka kasama ng iyong sambahayan.
  to: At ipambili mo ang salapi sa anumang gustuhin mo—mga baka, mga tupa at kambing[a], alak, inuming nakalalasing[b], o anumang naisin mo. Doon ka kakain sa harap ni Yahweh na iyong Diyos, at magagalak ka, ikaw at ang iyong sambahayan.
  rationale: Pinalitan ang maluwag na “gamitin mo ang salapi para sa” ng “ipambili mo ang salapi sa” upang ipahayag ang komersiyal na diwa ng Hebreo. Pinasimple ang ikalawang parirala ng pagnanasa para sa likas na Filipino, nang hindi idinadagdag o binabawasan ang saklaw ng maaaring naisin. Inayos din ang pangwakas na parirala bilang “ikaw at ang iyong sambahayan,” na tuwirang tumutugma sa pagbibigay-diin ng Hebreo sa kapwa ng kausap at ng kaniyang sambahayan.
