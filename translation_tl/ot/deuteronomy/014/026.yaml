    rationale: Sinisikap nitong panatilihin ang personipikadong “humihingi” ng נֶפֶשׁ, ngunit hindi ito karaniwang ayos sa modernong Filipino. Ang “anumang naisin mo” ay malinaw at pinananatili ang saklaw ng kahulugan.
