  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: tl
  text: At ipambili mo ang salapi sa anumang gustuhin mo—mga baka, mga tupa at kambing[a], alak, inuming nakalalasing[b], o anumang naisin mo. Doon ka kakain sa harap ni Yahweh na iyong Diyos, at magagalak ka, ikaw at ang iyong sambahayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa maliliit na alagang hayop, lalo na sa mga tupa at kambing.
    reason: lexical_alternative
  - marker: b
    text: Ibang nakalalasing na inumin bukod sa alak; hindi tinutukoy ng Hebreo ang eksaktong uri nito.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: gamitin mo ang salapi
  rationale: Sa kontekstong pangkalakalan, ang literal na ‘ibigay ang pilak’ ay nangangahulugang gamitin o ipambili ang salapi. Natural sa Filipino ang ‘gamitin ang salapi’ at hindi nito nililimitahan ang diwa sa isang makabagong paraan ng pagbabayad.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשְׁךָ
  choice: para sa anumang gustuhin mo
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa mismong tao at sa kaniyang pagnanasa sa pagkain at inumin, hindi partikular sa hiwalay na di-materyal na ‘kaluluwa.’ Ang tuwirang Filipino ay natural at malinaw.
- source_word: בַּבָּקָר וּבַצֹּאן
  choice: mga baka, mga tupa at kambing
  rationale: Ang בָּקָר ay mga hayop na bovine; ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, karaniwang mga tupa at kambing. Iniiwasan ng salin ang pagpapakitid nito sa tupa lamang.
- source_word: וּבַיַּיִן וּבַשֵּׁכָר
  choice: alak, inuming nakalalasing
  rationale: Ang יַיִן ay alak, samantalang ang שֵׁכָר ay ibang nakalalasing na inumin. Pinananatili ang tahasang pagkakaiba nang hindi labis na tinutukoy kung anong uri ng inumin iyon.
- source_word: וּבְכֹל אֲשֶׁר תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: o anumang hingin ng iyong pagnanasa
  rationale: Pinananatili nito ang larawan ng pagnanasa na ‘humihingi,’ habang natural pa rin sa marangal na modernong Filipino.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: sa harap ni Yahweh na iyong Diyos
  rationale: Pinananatili ang tipanang pangalan na יהוה bilang Yahweh at ang karaniwang diwa ng לִפְנֵי bilang ‘sa harap’ o nasa presensiya.
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: at magagalak ka kasama ng iyong sambahayan
  rationale: Ang בַּיִת sa ganitong gamit ay sambahayan, hindi lamang pisikal na bahay; saklaw nito ang mga kabilang sa tahanan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tahasang pangalan ang nasa Hebreo; pinananatili itong pangalan sa halip na palitan ng titulo.
- issue: Pagbanggit sa mga inuming may alkohol
  choice: alak, inuming nakalalasing
  alternative: alak, matapang na inumin
  rationale: Hindi pinalalabo ang malinaw na pagtukoy ng teksto sa alak at isa pang uri ng nakalalasing na inumin; hindi rin ipinapalagay ang isang tiyak na produktong gaya ng serbesa.
- issue: Kahulugan ng נֶפֶשׁ sa dalawang parirala
  choice: ang tao/pagnanasa sa konteksto ng pagkain
  alternative: kaluluwa
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ang may gusto at humihingi ng mabibili at makakain. Ang literal na ‘kaluluwa’ sa Filipino ay madaling mapakahulugang hiwalay na espirituwal na sangkap, na hindi kinakailangan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘salapi’ at ‘sambahayan’ para sa dignidad at linaw; iniwasan ang sobrang literal na ‘kaluluwa’ sa kontekstong tumutukoy sa pagnanasa sa pagkain at inumin.
