  text: וְ/כֹ֨ל אֲשֶׁ֧ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: tl
  text: Ngunit ang anumang walang palikpik at kaliskis ay huwag ninyong kainin; marumi iyon para sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Ngunit ang anumang
  rationale: Ang כֹל ay sumasaklaw sa lahat ng kabilang sa uri, kaya natural ang “ang anumang.” Isinalin ang וְ bilang “Ngunit” upang ipakita ang kaibahan nito sa pahintulot sa naunang talata.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: walang
  rationale: Ang אֵין na may hulaping panghalip ay nagsasaad ng kawalan ng pag-aari; ang “walang” ang pinakanatural at tuwirang katumbas sa modernong Tagalog.
- source_word: סְנַפִּיר
  choice: palikpik
  rationale: Ito ang karaniwang salitang Tagalog para sa fin ng isda o nilalang sa tubig. Hindi kailangang tahasang markahan ang bilang sapagkat maaaring gamitin ang “palikpik” bilang pangkalahatang katangian.
- source_word: וְ/קַשְׂקֶשֶׂת
  choice: at kaliskis
  rationale: Ang “kaliskis” ang karaniwang katawagan sa scales ng isda at likas itong gamitin bilang pangkalahatang katangian.
- source_word: לֹא תֹאכֵלוּ
  choice: huwag ninyong kainin
  rationale: Ang ikalawang panauhang maramihan na may לֹא ay isang pagbabawal. Ang “huwag ninyong kainin” ay malinaw, marangal, at natural sa makabagong Tagalog.
- source_word: טָמֵא הוּא לָכֶם
  choice: marumi iyon para sa inyo
  rationale: Pinananatili ng “marumi” ang terminolohiyang pangkalinisan ng kautusan, at ipinahahayag ng “para sa inyo” ang katayuan nito kaugnay ng Israel.
theological_decisions:
- issue: Kahulugan ng טָמֵא sa konteksto ng kautusang pandiyeta
  choice: marumi
  alternative: di-malinis / ritwal na marumi
  rationale: Ang “marumi” ay nagpapanatili sa tradisyonal at kontekstuwal na kategorya ng kalinisan nang hindi nagdaragdag ng salitang “ritwal,” na wala mismo sa Hebreo. Ipinauunawa ng konteksto na ito ay itinakdang katayuan sa ilalim ng kautusan, hindi basta pisikal na dumi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang legal na lakas ng pagbabawal at ang maikling paralelismong malapit sa Hebreo.
