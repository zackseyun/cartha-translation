  yaml_path: translation/ot/deuteronomy/014/018.yaml
  text: the stork[a], and the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: tl
  text: ang tagak[a], ang kanduro ayon sa uri nito[b], ang abubilya[c], at ang paniki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanduro”; hindi tiyak ang eksaktong pagkakakilanlan ng ilan sa mga ibon sa talatang ito.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring tumukoy sa ibis o plover.
    reason: lexical_alternative
  - marker: c
    text: Sa ilang tradisyonal na salin, “lapwing”; mas malamang na abubilya ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  choice: ang tagak
  rationale: Ang “tagak” ay karaniwang makabagong salin para sa stork at ang pinakatinatanggap na pagkakakilanlan, bagaman hindi ganap na tiyak ang espesye.
- source_word: הָאֲנָפָה
  choice: ang kanduro
  rationale: Pinipili ang “kanduro” bilang likas na katawagang Filipino para sa heron; hindi tiyak ang eksaktong ibong tinutukoy at maaari rin itong tumukoy sa ibang ibong lumulusong sa tubig.
- source_word: לְמִינָהּ
  choice: ayon sa uri nito
  rationale: Pinananatili nito ang pormulang Hebreo na sumasaklaw sa kaugnay na uri o pangkat, hindi lamang sa iisang espesye.
- source_word: הַדּוּכִיפַת
  choice: ang abubilya
  rationale: Ang “abubilya” ang katawagang Filipino para sa hoopoe, na higit na sinusuportahan ng makabagong leksikograpiya kaysa sa tradisyonal na “lapwing.”
- source_word: הָעֲטַלֵּף
  choice: ang paniki
  rationale: Malinaw na paniki ang tinutukoy ng salitang Hebreo; pinananatili ito kahit kasama sa sinaunang talaan ng mga lumilipad na nilalang.
