translation_notes:
  register: Modernong Filipino na payak at marangal. Ginamit ang mga katawagang Filipino sa mga hayop, habang ipinahayag sa mga talababa ang tunay na kawalang-katiyakan sa pagkakakilanlan ng ilang ibon. Ang pagkakasunod at koordinasyon ng talaan ay pinanatiling malapit sa Hebreo.
