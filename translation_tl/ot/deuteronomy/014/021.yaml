  text: לֹ֣א תֹאכְל֣וּ כָל נְ֠בֵלָה לַ/גֵּ֨ר אֲשֶׁר בִּ/שְׁעָרֶ֜י/ךָ תִּתְּנֶ֣נָּ/ה וַ/אֲכָלָ֗/הּ א֤וֹ מָכֹר֙ לְ/נָכְרִ֔י כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: tl
  text: Huwag kayong kakain ng anumang bangkay ng hayop.[a] Maaari ninyo itong ibigay sa dayuhang naninirahan sa inyong mga bayan,[b] at maaari niya itong kainin; o maaari ninyo itong ipagbili sa isang dayuhan.[c] Sapagkat kayo ay isang banal na bayang nakatalaga kay Yahweh na inyong Diyos. Huwag ninyong pakukuluan ang batang kambing sa gatas ng ina nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang hayop na namatay nang kusa” o “patay na hayop.” Ang Hebreong נְבֵלָה ay tumutukoy sa bangkay ng hayop na hindi kinatay sa paraang ipinahihintulot.
    reason: lexical_alternative
  - marker: b
    text: Literal, “sa loob ng inyong mga pintuang-bayan,” isang Hebreong idyoma para sa mga taong naninirahan sa inyong mga bayan o pamayanan.
    reason: cultural_note
  - marker: c
    text: Ang “dayuhang naninirahan sa inyong mga bayan” (גֵּר) ay isang dayuhang residenteng may kinikilalang lugar sa pamayanan ng Israel. Naiiba siya sa “dayuhan” (נָכְרִי) sa kasunod na parirala, na walang gayong residenteng katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: hayop na natagpuang patay
  rationale: Tumutukoy ito sa bangkay ng hayop na hindi kinatay sa paraang ipinahihintulot, kabilang ang hayop na namatay nang kusa. Mas malinaw ito kaysa sa payak na “bangkay” bilang katawagan sa ipinagbabawal kainin.
- source_word: גֵּר
  choice: dayuhang naninirahang kasama ninyo
  rationale: Ipinakikita nito ang kinikilalang katayuan ng isang hindi Israelitang naninirahan sa pamayanan, at itinatangi siya sa נָכְרִי.
- source_word: בִּשְׁעָרֶיךָ
  choice: sa inyong mga bayan
  rationale: Ang literal na “sa loob ng inyong mga pintuang-bayan” ay idyomang tumutukoy sa mga bayan o pamayanang sakop nila; natural at malinaw sa modernong Tagalog ang “sa inyong mga bayan.”
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ
  choice: Maaari ninyo itong ibigay ... at maaari niya itong kainin
  rationale: Sa kontekstong legal, ang mga anyo ay maaaring magpahayag ng pinahihintulutang gawin sa halip na obligasyong kailangang isagawa.
- source_word: נָכְרִי
  choice: dayuhan
  rationale: Tumutukoy sa banyagang hindi tagaroon at walang kaparehong residenteng katayuan ng גֵּר; pinananatili ng konteksto at talababa ang pagkakaiba.
- source_word: עַם קָדוֹשׁ
  choice: isang banal na bayan
  rationale: Pinananatili ang wikang tipan at ang diwa ng isang sambayanang ibinukod para sa Diyos.
- source_word: לַיהוָה
  choice: nakatalaga kay Yahweh
  rationale: Ang pang-ukol ay nagpapahiwatig ng pag-aari o pagtatalaga, at ang pangalang יהוה ay tuwirang isinaling “Yahweh.”
- source_word: גְּדִי
  choice: batang kambing
  rationale: Mas malinaw ito sa karaniwang modernong Tagalog kaysa sa posibleng teknikal o di-pamilyar na katawagan.
- source_word: תְבַשֵּׁל
  choice: pakukuluan
  rationale: Tiyak na ipinahihiwatig ng pandiwa ang pagluluto sa pamamagitan ng pagpapakulo, hindi lamang pangkalahatang pagluluto.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: sa gatas ng sarili nitong ina
  rationale: Natural na Tagalog na nagpapanatili sa tiyak at kongkretong larawan ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang tiyak na pangalang tipan; pinananatili itong pangalan sa halip na palitan ng titulo.
- issue: Lakas ng mga pandiwang legal tungkol sa pagbibigay at pagbebenta
  choice: 'pahintulot: “maaari”'
  alternative: 'utos: “ibigay ninyo ... ipagbili ninyo”'
  rationale: Ang pangunahing bisa ng batas ay ang pagbabawal sa Israel na kumain, samantalang pinahihintulutan ang pagbibigay o pagbebenta sa iba. Hindi ginagawang sapilitan ng salin ang alinmang paraan ng pagtatapon.
- issue: Kabanalan ng Israel kaugnay ni Yahweh
  choice: “banal na bayang nakatalaga kay Yahweh”
  alternative: “banal na bayan para kay Yahweh”
  rationale: Ipinahahayag ng לַיהוָה ang pagiging ibinukod at pag-aari ni Yahweh nang hindi nilulutas nang labis ang saklaw ng ugnayang ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang maramihang “kayo/ninyo” ayon sa Hebreo. Pinili ang “bayan” para sa covenant people at “mga bayan” para sa lokal na settlements; nilinaw ang magkaibang uring dayuhan sa teksto at talababa. Ang mga marker [a], [b], at [c] ay lahat nasa pangunahing teksto.
