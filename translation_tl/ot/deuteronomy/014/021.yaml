review_pass:
  verdict: revise
  source_fidelity: Kailangang iwasto ang “hayop na natagpuang patay,” dahil ang “natagpuang” ay dagdag na kahulugang wala sa נְבֵלָה. Ang “bangkay ng hayop” ay mas tapat sa saklaw ng salitang Hebreo at hindi nagpapalagay na nakita o natagpuan ang hayop.
  naturalness: Natural at malinaw ang pangkalahatang Tagalog. Mas payak at mas natural ang “dayuhang naninirahan sa inyong mga bayan” kaysa “dayuhang naninirahang kasama ninyo sa inyong mga bayan.” Inalis din ang di-kailangang diin ng “sarili nitong ina.”
  terminology: Napananatili ang makabuluhang pagkakaiba ng גֵּר, isang residenteng dayuhan, at נָכְרִי, isang dayuhan. Ang “banal na bayang nakatalaga kay Yahweh” ay angkop at tapat sa עַם קָדוֹשׁ לַיהוָה.
  issues:
  - severity: medium
    issue: Ang “natagpuang patay” ay nagdaragdag ng kahulugang wala sa Hebreo.
    rationale: Ang נְבֵלָה ay tumutukoy sa bangkay ng hayop, lalo na ng hayop na hindi kinatay sa pinahihintulutang paraan; hindi nito sinasabing ang hayop ay natagpuan ng kausap.
  - severity: low
    issue: May bahagyang di-natural na pagpapahayag sa “naninirahang kasama ninyo” at “sarili nitong ina.”
    rationale: Hindi kailangan ng “kasama ninyo” upang maisalin ang residenteng katayuan ng גֵּר, at ang “sarili nitong” ay nagdaragdag ng diin na wala sa “ina nito.”
