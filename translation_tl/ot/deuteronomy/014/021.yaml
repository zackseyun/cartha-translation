revisions:
- from: Huwag kayong kakain ng anumang hayop na natagpuang patay.[a] Maaari ninyo itong ibigay sa dayuhang naninirahang kasama ninyo sa inyong mga bayan,[b] at maaari niya itong kainin; o maaari ninyo itong ipagbili sa isang dayuhan.[c] Sapagkat kayo ay isang banal na bayang nakatalaga kay Yahweh na inyong Diyos. Huwag ninyong pakukuluan ang batang kambing sa gatas ng sarili nitong ina.
  to: Huwag kayong kakain ng anumang bangkay ng hayop.[a] Maaari ninyo itong ibigay sa dayuhang naninirahan sa inyong mga bayan,[b] at maaari niya itong kainin; o maaari ninyo itong ipagbili sa isang dayuhan.[c] Sapagkat kayo ay isang banal na bayang nakatalaga kay Yahweh na inyong Diyos. Huwag ninyong pakukuluan ang batang kambing sa gatas ng ina nito.
  rationale: Pinalitan ang saling nagdaragdag ng ideyang “natagpuan” ng “bangkay ng hayop,” na mas malapit sa leksikal na saklaw ng נְבֵלָה. Pinakinis ang mga parirala tungkol sa residenteng dayuhan at sa ina ng batang kambing nang hindi binabago ang kahulugan, antas ng pananalita, o mga talababa at anchor.
  reviewer_model: gpt-5.6-terra
