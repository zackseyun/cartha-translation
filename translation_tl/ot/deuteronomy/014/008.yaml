source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: tl
  text: At ang baboy, dahil may biyak itong kuko ngunit hindi ito ngumunguya ng nginuyang pagkain na ibinalik mula sa sikmura, ay marumi para sa inyo. Huwag kayong kumain ng karne ng mga baboy, at huwag ninyong hawakan ang mga bangkay ng mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזִיר
  choice: ang baboy
  rationale: Ang “baboy” ang malinaw, karaniwan, at makabagong tawag sa hayop; gamit dito ang isahang anyo bilang pangkalahatang pangalan ng uri.
- source_word: מַפְרִיס פַּרְסָה
  choice: biyak ang kuko nito
  rationale: Likas na Filipino ito para sa kuko ng hayop na nahahati sa dalawa, nang hindi pinahahaba ang teknikal na paglalarawan.
- source_word: וְלֹא גֵרָה
  choice: ngunit hindi ito ngumunguya ng pagkaing ibinalik mula sa sikmura
  rationale: Inilalarawan nito sa madaling maunawaang Filipino ang pagnguya ng cud nang hindi gumagamit ng di-pamilyar o malabong teknikal na salita.
- source_word: טָמֵא
  choice: marumi
  rationale: Pinananatili nito ang kategoryang legal at ritwal sa Torah; hindi ito pinalalawak bilang pahayag tungkol sa likas na kasamaan ng hayop.
- source_word: מִבְּשָׂרָם
  choice: karne ng mga baboy
  rationale: Mas natural ang “karne” sa konteksto ng pagkain. Ang tahasang maramihang “mga baboy” ay nagpapahayag sa mga plural na hulapi ng Hebreo at sa pangkalahatang uri na kinakatawan ng isahang “ang baboy.”
- source_word: נִבְלָתָם
  choice: bangkay ng mga ito
  rationale: Ang “bangkay” ay tuwirang tumutukoy sa katawan ng patay na hayop. Pinananatili ng “mga ito” ang maramihang tumutukoy sa uri ng mga baboy.
- source_word: תִגָּעוּ
  choice: hawakan
  rationale: Tuwiran at natural nitong pinananatili ang lakas ng pagbabawal na nasa pandiwang Hebreo.
theological_decisions:
- issue: Uri ng karumihan sa kautusang pangpagkain
  choice: Isinalin ang טָמֵא bilang “marumi” nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: di-dalisay; nadungisan
  rationale: Ang talata ay nagtatakda ng legal at ritwal na kalagayan para sa Israel, hindi nagsasabing masama sa moral ang hayop.
- issue: Saklaw ng pagbabawal sa paghawak
  choice: “huwag ninyong hawakan”
  alternative: huwag ninyong asikasuhin; huwag kayong lumapit
  rationale: Ang נגע ay tuwirang “humawak/dumampi.” Hindi dapat palawakin sa pagbabawal na lumapit o paliitin sa pag-asikaso lamang.
- issue: Paglipat mula sa isahang hayop tungo sa maramihang hulapi
  choice: Pinanatili ang pangkalahatang isahang “ang baboy,” ngunit ginawang hayag ang maramihan sa “mga baboy” at “mga ito.”
  alternative: karne nito; bangkay nito
  rationale: Isahan ang הַחֲזִיר bilang pangalan ng uri, ngunit kapwa maramihan ang mga hulaping pag-aari sa מִבְּשָׂרָם at נִבְלָתָם. Pinananatili ng salin ang pag-igting na ito sa halip na tahimik na gawing isahan ang lahat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkaing ibinalik mula sa sikmura” upang maipaliwanag nang natural ang cud, at iniwasan ang mga salitang masyadong teknikal. Ang pangungusap ay nananatiling anyong legal na may tuwirang pagbabawal.
