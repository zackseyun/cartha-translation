  text: 'These are the animals that you may eat: the ox[a], the sheep, and the goat.'
translation:
  language: tl
  text: 'Ito[a] ang mga hayop na maaari ninyong kainin: baka, tupa, at kambing.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Ito ang hayop na maaari ninyong kainin.” Ginagamit dito ang mga anyong isahan upang ipakilala ang isang pangkalahatang uri bago isa-isahin ang mga halimbawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: Ito ang mga hayop
  rationale: Ang anyong Hebreo ay literal na isahan—“ito ang hayop”—ngunit ginagamit ang pangngalang isahan bilang kolektibong pambungad sa kasunod na talaan. Likas sa modernong Tagalog ang “Ito ang mga hayop.”
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: na maaari ninyong kainin
  rationale: Ipinakikita ng sugnay ang pahintulot, hindi isang utos na obligadong kainin ang mga ito. Ang “maaari ninyong kainin” ay malinaw at natural.
- source_word: שׁוֹר
  choice: baka
  rationale: Tumutukoy ang שׁוֹר sa uring bovine. Mas karaniwan at madaling maunawaan sa Tagalog ang “baka” kaysa sa mas tiyak sa kasarian o gamit na “toro” o “kapong baka.”
- source_word: שֵׂה כְשָׂבִים
  choice: tupa
  rationale: Ang שֵׂה ay hayop mula sa kawan at nililinaw ng כְשָׂבִים bilang uring tupa. Hindi kailangang tukuyin itong batang tupa.
- source_word: וְשֵׂה עִזִּים
  choice: at kambing
  rationale: Kaagapay ng naunang parirala, tinutukoy nito ang hayop na kabilang sa uring kambing; hindi hinihingi ng Hebreo ang mas tiyak na “batang kambing.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ninyong” upang katawanin ang pangmaramihang ikalawang panauhan ng Hebreo. Inilipat ang talababa sa dulo ng talata upang malinaw na tumukoy sa kolektibong-isahang anyo ng pambungad na sugnay.
