  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: tl
  text: At lahat ng maliliit na nilalang na may pakpak at nagkukumpulan ay marumi para sa inyo[a]; hindi dapat kainin ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng gumagapang na may pakpak” o “lahat ng lumilipad na nilalang na nagkukumpulan.” Pinagsasama ng Hebreo ang שֶׁרֶץ (“maliit na nilalang na gumagapang o nagkukumpulan”) at עוֹף (“lumilipad na nilalang”); malamang na pangunahing tumutukoy ito sa mga insektong lumilipad, hindi sa mga ibon sa karaniwang kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: At lahat ng
  rationale: Ikinakabit ng וְ ang utos sa naunang mga tuntunin, at ipinahahayag ng כֹל ang kabuuan ng uring tinutukoy.
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: may-pakpak na gumagapang
  rationale: Pinagsasama ng pariralang Hebreo ang maliit na nilalang na gumagapang o nagkukumpulan at ang uring lumilipad. Likas sa Filipino ang “may-pakpak na gumagapang” bilang katawagan sa mga insektong lumilipad, nang hindi ito mapagkamalang karaniwang mga ibon.
- source_word: טָמֵא
  choice: marumi
  rationale: Ang “marumi” ang karaniwang salitang biblikal para sa ritwal at pandiyetang kalagayang ipinahahayag ng טָמֵא, hindi simpleng pisikal na dumi.
- source_word: הוּא לָ/כֶם
  choice: ay marumi para sa inyo
  rationale: Pinananatili ng “para sa inyo” ang pagtukoy sa Israel bilang saklaw ng tuntuning ito; hindi kailangang ihiwalay sa Filipino ang resumptibong הוּא.
- source_word: לֹא יֵאָכֵלוּ
  choice: hindi dapat kainin ang mga iyon
  rationale: Pinananatili ang pasibong anyo at ang maramihang pandiwang Hebreo sa pamamagitan ng “ang mga iyon,” habang malinaw na ipinahahayag ang legal na pagbabawal.
theological_decisions:
- issue: Kahulugan ng “marumi”
  choice: Pinanatili bilang kategoryang ritwal at pandiyeta
  alternative: Ipaliwanag bilang likas na masama o pisikal na marumi
  rationale: Ang talata ay nagtatakda ng kalagayang pandiyeta para sa Israel at hindi nagsasabing likas na masama ang mga nilalang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “may-pakpak na gumagapang” bilang natural na katawagan sa winged creeping/swarming creatures; ang bahagyang di-karaniwang saklaw ng pariralang Hebreo ay nilinaw sa talababa. Pinanatili ang legal na himig sa “hindi dapat kainin” at ang maramihang reperensiya sa “mga iyon.”
