  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: tl
  text: Sa katapusan ng bawat ikatlong taon[a], ilabas mo ang buong ikapu ng ani mo sa taong iyon at ilagak mo iyon sa loob ng iyong mga pintuang-bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tuwing tatlong taon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sa loob ng iyong mga pintuang-bayan” ay tumutukoy sa mga bayan o pamayanang iyong kinaroroonan o nasasakupan.
    reason: cultural_note
lexical_decisions:
- source_word: מִקְצֵה
  choice: Sa katapusan ng
  rationale: Ipinapahayag ng parirala ang puntong naaabot sa pagtatapos ng takdang panahon, kaya pinanatili ang temporal na diwa ng Hebreo.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: bawat ikatlong taon
  rationale: Ipinahihiwatig ng konteksto ang paulit-ulit na gawaing isinasagawa sa ikatlong taon; natural ito sa Filipino at pinananatili ang posibleng pagbasa ng Hebreo.
- source_word: תּוֹצִיא
  choice: ilabas mo
  rationale: Ang Hiphil ng יצא ay literal na pagpapalabas o pagdadala palabas, kaya ang “ilabas mo” ay tuwiran at konkreto.
- source_word: כָּל מַעְשַׂר
  choice: buong ikapu
  rationale: Binibigyang-diin ng כָּל ang kabuuan ng ikapung bahaging hinihingi, hindi lamang ang isang bahagi nito.
- source_word: תְּבוּאָתְךָ
  choice: ani mo
  rationale: Tumutukoy ang תְּבוּאָה sa ani o pakinabang mula sa lupain; ang “ani” ay malinaw at likas sa karaniwang Filipino.
- source_word: בַּשָּׁנָה הַהִוא
  choice: sa taong iyon
  rationale: Tinutukoy nito ang ani at ikapung nauukol sa mismong taong pinag-uusapan.
- source_word: וְהִנַּחְתָּ
  choice: at ilagak mo iyon
  rationale: Ipinahihiwatig ng pandiwa ang paglalagay o pagdedeposito sa isang lugar; ang “ilagak” ay angkop sa marangal na rehistro at sa konteksto ng pag-iimbak.
- source_word: בִּשְׁעָרֶיךָ
  choice: sa loob ng iyong mga pintuang-bayan
  rationale: Pinananatili nito ang konkretong larawan ng Hebreo. Sa gamit ng sinaunang Israel, saklaw ng “mga pintuang-bayan” ang mga bayan o pamayanang nasasakupan ng tao.
