translation:
  language: tl
  text: ang avestruz[a], ang lawin, ang ibong-dagat, at ang palkon[b], ayon sa uri nito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “anak na babae ng ya‘anah,” isang katawagan sa uri ng ibon. Hindi ganap na tiyak ang pagkakakilanlan nito; isinasalin din ito ng ilan bilang isang uri ng kuwago o ibon sa ilang.
    reason: cultural_note
  - marker: b
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng ilan sa mga ibon sa talatang ito. Ang salitang isinaling “lawin” ay maaari ring tumukoy sa kuwago o ibang ibon; ang “ibong-dagat” ay isinasalin ding “kukuko”; at ang “palkon” ay maaari ring isaling “lawin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: ang avestruz
  rationale: Ang literal na pariralang Hebreo ay “anak na babae ng ya‘anah,” ngunit ginagamit ito rito bilang katawagan sa isang uri ng ibon. Ang “avestruz” ang malinaw at karaniwang makabagong katumbas, habang inilalahad sa talababa ang literal na anyo at ang bahagyang kawalang-katiyakan.
- source_word: הַתַּחְמָס
  choice: ang lawin
  rationale: Hindi tiyak ang eksaktong uri ng ibon. Ang “lawin” ay likas na katawagang Filipino para sa isang ibong mandaragit at angkop sa posibleng saklaw ng salita; pinananatili sa talababa ang ibang mungkahi.
- source_word: הַשָּׁחַף
  choice: ang ibong-dagat
  rationale: Malamang na tumutukoy ang mahirap tukuying salitang ito sa gull o kahawig na ibon. Mas madaling maunawaan ng pangkalahatang mambabasa ang “ibong-dagat” kaysa sa hiram o teknikal na pangalan, at hindi ito nagpapanggap na mas tiyak kaysa sa ebidensiyang leksikal.
- source_word: הַנֵּץ
  choice: ang palkon
  rationale: Tumutukoy ito sa isang ibong mandaragit na maaaring tawaging hawk o falcon. Pinili ang “palkon” upang maiba ito sa תַּחְמָס na isinaling “lawin,” nang hindi ikinukubli ang kawalang-katiyakan.
- source_word: לְמִינֵהוּ
  choice: ayon sa mga uri nito
  rationale: Ito ay pormulang Hebreo ng pag-uuri na sumasaklaw sa ibon at sa kaugnay nitong mga uri. Natural sa modernong Filipino ang “ayon sa mga uri nito” at malapit pa rin sa anyong isahan ng Hebreo.
