translation_notes:
  register: Gumamit ng maikli, dignificado, at kasalukuyang Filipino na angkop sa pagpapatuloy ng isang talaan. Pinanatili ang kuwit sa hulihan dahil bahagi lamang ito ng mas mahabang pangungusap. Ginamit ang pamilyar na “avestruz” at “lawin,” ang mas madaling maunawaang “ibong-dagat,” at ang kinikilalang “palkon.” Inilagay ang mga kawalang-katiyakan sa talababa sa halip na gawing mabigat ang pangunahing teksto.
