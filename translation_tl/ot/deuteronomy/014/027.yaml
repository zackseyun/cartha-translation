base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: tl
  text: Huwag mong pabayaan[b] ang Levitang nasa iyong mga bayan[a], sapagkat wala siyang bahagi at mana sa iyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong pananalitang “nasa loob ng iyong mga pintuang-bayan” ay isang idyoma para sa iyong mga bayan o lokal na pamayanan.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “huwag mo siyang talikuran” o “huwag mo siyang iwan.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang Levita ay walang karaniwang nakalaang lupaing pantribo sa gitna ng Israel.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: ang Levita
  rationale: Tumutukoy ang tiyak na pangngalang isahan sa isang Levita bilang kinatawan ng buong pangkat. Hindi isinaling “paring Levita” sapagkat hindi lahat ng Levita ay tinutukoy rito bilang pari.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: na nasa loob ng iyong mga pintuang-bayan
  rationale: Pinananatili ang larawan ng mga pintuang-bayan at ang legal na himig ng Hebreo, habang ipinapaliwanag sa talababa na idyoma ito para sa mga bayan o pamayanang nasasakupan.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: Huwag mong pababayaan
  rationale: Sa konteksto ng paglalaan para sa Levita, natural na ipinahihiwatig ng “pababayaan” ang pagkakait ng kinakailangang pagkalinga. Maaari ring mangahulugan ang pandiwa na iwan o talikuran.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan ng utos at angkop ito sa marangal ngunit madaling maunawaang rehistro.
- source_word: אֵין לוֹ
  choice: wala siyang
  rationale: Likas na salin sa Tagalog ng Hebreong eksistensiyal na konstruksyon.
- source_word: חֵלֶק וְנַחֲלָה
  choice: bahagi o mana
  rationale: Ang tambalan ay tumutukoy sa bahagi at minanang lupain. Ang “o” ay natural sa negatibong pahayag sa Tagalog at hindi nagpapahiwatig na isa lamang sa dalawa ang wala.
- source_word: עִמָּךְ
  choice: kasama mo
  rationale: Malapit nitong pinananatili ang relational na diwa ng pang-ukol at ang pang-isahang pakikipag-usap sa Israel bilang isang kabuuan.
theological_decisions:
- issue: Ang uri ng bahaging wala sa Levita
  choice: Tumutukoy ang talata sa kawalan ng karaniwang nakalaang lupaing pantribo para sa Levita, kaya kailangan niya ang patuloy na suporta ng pamayanan.
  alternative: Pangkalahatang pagtukoy lamang ito sa pagiging nasa laylayan ng lipunan, nang walang partikular na kaugnayan sa pagmamay-ari ng lupain.
  rationale: Sa konteksto ng Deuteronomio, ang tambalang “bahagi at mana” ay tumutukoy sa kawalan ng nakalaang teritoryo para sa lipi ni Levi. Iniingatan ng pangunahing teksto ang maikling pahayag, at inilalagay sa talababa ang kinakailangang konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pang-isahang “mo” upang panatilihin ang gramatikal na pakikipag-usap ng Hebreo sa Israel bilang isang kolektibong persona. Pinanatili ang larawang “mga pintuang-bayan,” ngunit nilinaw ang idyoma sa talababa.
