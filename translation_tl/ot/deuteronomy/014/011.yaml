lexical_decisions:
- source_word: כָּל
  choice: alinmang
  rationale: Komprehensibo ang panukoy. Sa pangungusap na nagbibigay-pahintulot, likas na ipinapahayag ng “alinmang” na pinahihintulutan ang bawat kabilang sa nasabing uri.
- source_word: צִפּוֹר
  choice: ibon
  rationale: Karaniwang tumutukoy ang pangngalan sa ibon, at ito ang payak at eksaktong katawagan sa konteksto ng mga batas tungkol sa pagkain.
- source_word: טְהֹרָה
  choice: malinis
  rationale: Sa konteksto ng mga tuntunin sa pagkain, ang salita ay tumutukoy sa legal at ritwal na uring “malinis,” hindi lamang sa pangkalahatang pagiging dalisay.
- source_word: תֹּאכֵלוּ
  choice: maaari ninyong kainin
  rationale: Ang ikalawang panauhang maramihan na imperfect ay gumaganap dito bilang legal na pahintulot. Malinaw at natural itong ipinahahayag ng “maaari ninyong kainin.”
