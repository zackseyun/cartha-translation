translation:
  language: tl
  text: Maaari ninyong kainin ang alinmang malinis na ibon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Bawat malinis na ibon ay maaari ninyong kainin” o “Maaari ninyong kainin ang lahat ng malinis na ibon.”
