  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang pagkakakilanlan sa mga ibong tinutukoy ng mga salitang Hebreo sa talatang ito. Ang “pelikano” ay maaari ring isaling “kuwago sa ilang” o “kuwago.”
