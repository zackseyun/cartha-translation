lexical_decisions:
- source_word: הַקָּאָת
  choice: pelikano
  rationale: Hindi tiyak ang pagkakakilanlan sa ibon. Pinili ang nakaugaliang katumbas na “pelikano,” habang inilalahad sa talababa ang ibang posibilidad.
- source_word: הָרָחָמָה
  choice: buwitreng kumakain ng bangkay
  rationale: Malamang na tumutukoy ito sa isang ibong mandaragit o kumakain ng bangkay. Mas malinaw sa karaniwang mambabasa ang mapaglarawang salin kaysa sa isang di-pamilyar na tiyak na pangalan ng uri.
- source_word: הַשָּׁלָךְ
  choice: kormorán
  rationale: Hindi tiyak ang eksaktong uri, ngunit malamang na isa itong ibong-tubig na kumakain ng isda. Ang “kormorán” ay kinikilalang makabagong katumbas, at pinananatili sa talababa ang kawalang-katiyakan.
- source_word: וְ / וְאֶת
  choice: at / [hindi isinalin ang pananda sa tuwirang layon]
  rationale: Isinalin ang pang-ugnay na וְ bilang “at.” Walang likas na tuwirang katumbas sa Tagalog ang אֵת, kaya hindi ito hiwalay na isinalin.
