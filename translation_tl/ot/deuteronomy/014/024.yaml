  naturalness: May bahagyang di-likas na ayos sa “napakalayo para sa iyo ng paglalakbay.” Mas natural sa makabagong Filipino ang “masyadong malayo ang paglalakbay para sa iyo.” Ang “iyon” ay maaari ring gawing “ito” para sa mas tuwirang pagtukoy sa bagay na dinadala.
  terminology: Ang “Yahweh,” “iyong Diyos,” at “ilagay doon ang kanyang pangalan” ay angkop at tapat sa terminolohiyang Deuteronomiko. Inayos ang aspekto ng pandiwa sa alternatibong talababa upang mas malapit sa di-ganap na anyo ng Hebreo at sa English audit trail.
