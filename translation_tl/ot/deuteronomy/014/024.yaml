base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: tl
  text: At kung masyadong malayo ang paglalakbay para sa iyo, kaya hindi mo ito kayang dalhin, sapagkat malayo sa iyo ang lugar na pipiliin ni Yahweh na iyong Diyos upang ilagay doon ang kanyang pangalan, kapag pinagpala ka ni Yahweh na iyong Diyos,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat pinagpapala ka ni Yahweh na iyong Diyos.” Maaari ring magpahayag ng sanhi, bukod sa panahon, ang pangatnig sa Hebreo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili ang nag-uugnay na waw at ang kondisyunal na gamit ng כִּי bilang pagpapatuloy ng naunang tagubilin.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: napakalayo para sa iyo ng paglalakbay
  rationale: Likas na Filipino para sa idyomang nagsasaad na ang distansiya ng paglalakbay ay higit sa makakaya ng tao.
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: hindi mo kayang dalhin iyon
  rationale: Tumutukoy ang שְׂאֵת sa pisikal na pagdadala ng ikapu na binanggit sa konteksto; pinananatili ng “iyon” ang reperensiya ng panghalip sa Hebreo.
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: napakalayo sa iyo ng lugar
  rationale: Pinananatili ang tiyak at heograpikong diwa ng “ang lugar” sa Deuteronomio.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: na pipiliin ni Yahweh na iyong Diyos
  rationale: Ang yiqtol ay binigyang-hinaharap na diwa sa legal na kontekstong tumutukoy sa lugar na itatalaga ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na kinakatawan ng Tetragrammaton.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: upang ilagay doon ang kanyang pangalan
  rationale: Malinaw at malapit sa karaniwang pormulang Deuteronomiko tungkol sa piniling lugar ng pagsamba.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: kapag pinagpala ka ni Yahweh na iyong Diyos
  rationale: Ang “kapag” ay likas na naglalahad ng kalagayang dulot ng pagpapala, habang ang posibleng sanhi na diwa ng כִּי ay pinananatili sa talababa.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ng teksto ang Tetragrammaton bilang personal na pangalan ng Diyos; pinananatili ito bilang “Yahweh” nang hindi pinapalitan ng isang titulo.
- issue: Ugnayan ng huling כִּי sa natitirang pangungusap
  choice: kapag pinagpala ka ni Yahweh na iyong Diyos
  alternative: sapagkat pinagpala ka ni Yahweh na iyong Diyos
  rationale: Maaaring temporal o sanhi ang pangatnig. Ang temporal na pagbasa ay maayos sa daloy ng batas, ngunit hindi nilulutas nang palihim ang tunay na kalabuan kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “napakalayo” upang natural na maipahayag ang dalawang magkaugnay na pahayag tungkol sa hirap ng distansiya, at pinanatili ang mahabang kondisyunal na estruktura at kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
