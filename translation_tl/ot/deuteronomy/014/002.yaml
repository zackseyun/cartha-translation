base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: tl
  text: Sapagkat ikaw ay isang banal na bayan na nakatalaga kay Yahweh na iyong Diyos, at pinili ka ni Yahweh upang maging isang bayang natatangi niyang pag-aari, mula sa lahat ng bayang nasa ibabaw ng lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang bayang mahalagang pag-aari niya.” Ang salitang Hebreo na סְגֻלָּה ay tumutukoy sa isang pag-aaring natatangi at lubhang pinahahalagahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang pagbabawal at pinananatili ang paliwanag na ugnayan sa konteksto.
- source_word: עַם קָדוֹשׁ
  choice: isang banal na bayan
  rationale: Likas at marangal sa modernong Filipino; ipinahahayag ang bayang ibinukod at itinalaga sa Diyos.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para kay Yahweh na iyong Diyos
  rationale: Pinananatili ang ugnayan at pag-aari na ipinahihiwatig ng ל nang hindi nagiging matigas ang Filipino.
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: at pinili ka ni Yahweh
  rationale: Ang ב kasama ng בחר ay idyomang tumutukoy sa taong pinili; tuwirang layon ang natural na anyo sa Filipino.
- source_word: לִהְיוֹת לוֹ
  choice: upang maging kanyang
  rationale: Ipinahahayag ang layunin o bunga ng pagpili at ang pag-aari ng Diyos.
- source_word: לְעַם סְגֻלָּה
  choice: minamahal na bayan
  rationale: Ipinahahayag ang isang bayang natatangi at lubhang pinahahalagahan, habang pinananatili ang tahasang עַם; inilalagay sa talababa ang mas literal na larawang 'mahalagang pag-aari.'
- source_word: מִכֹּל הָעַמִּים
  choice: mula sa lahat ng bayan
  rationale: Ipinahahayag ang pagpili mula sa hanay ng lahat ng mga bayan, hindi ang pag-aangking nakahihigit sila.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: na nasa ibabaw ng lupa
  rationale: Natural na salin ng Hebreong idyoma para sa mga bayang naninirahan sa buong daigdig.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos sa tekstong Hebreo.
theological_decisions:
- issue: Kalikasan ng pagkahirang sa Israel
  choice: Inilalarawan ang pagpili bilang paghirang sa isang bayang banal, pag-aari, at lubhang pinahahalagahan ni Yahweh.
  alternative: Isalin ang מִכֹּל bilang 'higit sa lahat' o ipaliwanag ito ayon sa isang mas huling sistemang teolohikal.
  rationale: Sinasabi ng Hebreo na pinili ni Yahweh ang Israel mula sa lahat ng bayan upang maging natatangi niyang bayan; hindi nito kailangang ipahiwatig ang likas na kahigitan ng lahi.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “bayan” para sa עַם at ang “Yahweh” para sa banal na pangalan. Inilagay ang pananda [a] pagkatapos ng pariralang tinutukoy nito.
