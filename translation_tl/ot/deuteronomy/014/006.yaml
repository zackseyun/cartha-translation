    rationale: Bagaman sinusubukan nitong ipaliwanag ang rumination, hindi ito karaniwang pahayag sa Filipino at maaaring magmukhang literal na pagkain mula sa sikmura ang ngumunguya. Mas malinaw ang “muling ngumunguya ng kinain nito.”
