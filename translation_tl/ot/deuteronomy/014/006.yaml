  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: tl
  text: Maaari ninyong kainin ang alinmang hayop na may biyak na kuko, na nahahati ang kuko sa dalawang bahagi,[a] at muling ngumunguya ng kinain nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na pagkakasalin: “bawat hayop na naghahati ng kuko at bumibiyak ng biyak sa dalawang kuko, na muling ngumunguya ng kinain nito—iyon ang maaari ninyong kainin.”'
    reason: Pinananatili ng alternatibong ito ang masinsin at paulit-ulit na paglalarawan ng Hebreo sa pagkakahati ng kuko at ang idyomang tumutukoy sa muling pagnguya ng kinain.
lexical_decisions:
- source_word: וְכָל
  choice: alinmang
  rationale: Sa pahayag ng pahintulot, likas na ipinapahayag ng “alinmang” ang distributibong diwa ng “bawat/lahat ng” nang hindi nagmumukhang utos na kainin ang bawat hayop.
- source_word: בְּהֵמָה
  choice: hayop
  rationale: Malawak ang tinutukoy na kategorya rito; hindi ito limitado sa mga alagang hayop. Karaniwan at malinaw sa modernong Filipino ang “hayop.”
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: biyak ang kuko
  rationale: Maikli at likas itong paglalarawan sa konkretong katangiang hinihingi ng teksto. Sa kontekstong panghayop, malinaw na ang “kuko” ay tumutukoy sa hoof.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: at nahahati ito sa dalawang bahagi
  rationale: 'Pinananatili nito ang idinagdag na diin ng Hebreo: ang kuko ay may tunay na biyak at nagiging dalawang malinaw na bahagi, hindi lamang may mababaw na guhit.'
- source_word: מַעֲלַת גֵּרָה
  choice: ngumunguya ng pagkaing mula sa sikmura
  rationale: Inilalarawan nito sa madaling maunawaang Filipino ang rumination o muling pagnguya sa pagkaing ibinalik mula sa sikmura, nang hindi umasa sa teknikal o di-karaniwang katawagan.
- source_word: בַּבְּהֵמָה
  choice: nakapaloob sa “alinmang hayop”
  rationale: Ang pariralang Hebreo ay naglalagay sa pamantayan sa loob ng uring “mga hayop.” Sa Filipino, naipahahayag na ito nang likas ng pambungad na “alinmang hayop”; ang pagdaragdag ng “sa mga hayop” sa hulihan ay magiging paulit-ulit at alanganin.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: Maaari ninyong kainin
  rationale: Sa batas tungkol sa pagkain, ang anyo ay nagbibigay ng pahintulot, hindi nag-uutos na kailangang kainin ang naturang hayop. Ipinahihiwatig na ng ayos ng pangungusap ang pambabaeng isahang panghalip na “iyon.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinili ang karaniwang “kuko” sa halip na teknikal na katawagan; nililinaw ng konteksto at ng pariralang “biyak…sa dalawang bahagi” na kuko ng paa ng hayop ang tinutukoy. Ginamit ang maramihang magalang/komunal na “ninyong” upang katawanin ang pangmaramihang kausap sa Hebreo.
