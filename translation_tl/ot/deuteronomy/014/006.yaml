  naturalness: Ang “ngumunguya ng pagkaing mula sa sikmura” ay mabigat at hindi karaniwang Filipino. Ang “muling ngumunguya ng kinain nito” ay mas natural at malinaw sa modernong gamit.
  terminology: Maaaring manatili ang “kuko” sa kontekstong ito, dahil ang kasunod na paglalarawan ay tumutukoy sa biyak na kuko ng paa ng hayop. Nilinaw ang panghalip upang ang paghahati sa dalawang bahagi ay malinaw na katangian ng kuko.
