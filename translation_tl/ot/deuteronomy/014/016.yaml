  text: the little owl[a], the great owl, and the white owl;
translation:
  language: tl
  text: ang maliit na kuwago[a], ang malaking kuwago, at ang puting kuwago;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng mga pangalang Hebreo para sa tatlong ibong ito. Iba-iba ang salin ng mga sinauna at makabagong bersiyon, at madalas na itinuturing ang mga ito na sari-saring uri ng kuwago.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: maliit na kuwago
  rationale: Tumutukoy ito sa isang uri ng ibong malamang ay kuwago, ngunit hindi tiyak ang eksaktong uri. Pinananatili ng saling ito ang pagkakaiba nito sa dalawa pang ibong nakalista nang hindi nag-aangking tiyak ang pagkakakilanlan.
- source_word: יַנְשׁוּף
  choice: malaking kuwago
  rationale: Karaniwang inuunawa itong isang ibong panggabi at tradisyonal na itinuturing na uri ng kuwago sa kontekstong ito. Ibinubukod ito ng salin sa nauna at kasunod na katawagan.
- source_word: תִּנְשָׁמֶת
  choice: puting kuwago
  rationale: Sa talaang ito ng mga ibon, malamang na isang uri ng kuwago ang tinutukoy, bagaman hindi matiyak ang eksaktong uri. Ang tradisyonal na saling ito ay nagpapanatili ng pagkakaiba sa ibang mga ibong binanggit.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Pananda ito ng tuwirang layon sa Hebreo at walang hiwalay na katumbas na kailangang ilagay sa Tagalog.
- source_word: וְ
  choice: at
  rationale: Karaniwang pang-ugnay ito sa magkakasunod na aytem sa talaan; ayon sa likas na ayos ng Tagalog, tahasang ginamit ang “at” bago ang huling aytem.
- source_word: הַ
  choice: ang
  rationale: Ang tiyak na pantukoy sa bawat ibon ay natural na ipinahayag sa Tagalog sa pamamagitan ng “ang,” na tumutukoy sa bawat uri bilang aytem sa talaan.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Ginamit ang karaniwang salitang “kuwago” at malinaw na mga panuring upang mapanatili ang tatlong magkakaibang katawagang Hebreo, habang inilalahad sa talababa ang tunay na kawalang-katiyakan sa eksaktong uri ng mga ibon.
