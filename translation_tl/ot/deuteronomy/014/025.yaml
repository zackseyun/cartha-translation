  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: tl
  text: Ipagpalit mo iyon sa pilak[a], ibalot mo ang pilak at dalhin mo ito[b], at pumunta ka sa lugar na pipiliin ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipagbili mo iyon kapalit ng pilak” o “ipagpalit mo iyon sa salapi.” Literal na “pilak” ang nasa Hebreo, ngunit ginagamit dito ang pilak bilang salapi.
    reason: lexical_alternative
  - marker: b
    text: O “itali mo ang pilak sa iyong kamay” o “ibalot mo ang pilak sa iyong kamay,” ibig sabihin, tiyakin mong ligtas itong dala sa paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: ipagpalit mo iyon sa pilak
  rationale: Sa konteksto, ang ikapu mula sa naunang talata ay ipinagpapalit sa pilak na ginagamit bilang salapi. Pinananatili ng “pilak” ang kongkretong salitang Hebreo, habang malinaw na ipinahihiwatig ng “ipagpalit” ang transaksiyon.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: balutin mo ang pilak at hawakan itong mabuti
  rationale: Ang צָרַר ay maaaring mangahulugang balutin, talian, o ipunin nang mahigpit. Ang salin ay likas sa modernong Tagalog at pinananatili ang larawan ng pagtiyak na ligtas ang pilak habang naglalakbay.
- source_word: בְּיָדְךָ
  choice: hawakan itong mabuti
  rationale: Ang literal na “sa iyong kamay” ay tumutukoy rito sa ligtas na pagdadala o pag-iingat. Ang pariralang ito ay nagpapanatili sa konkretong larawan ng kamay nang hindi nagiging alanganin sa Tagalog.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: at pumunta ka sa lugar
  rationale: Direkta at natural na katumbas ng karaniwang pandiwang הלך at ng patutunguhang אֶל הַמָּקוֹם.
- source_word: אֲשֶׁר יִבְחַר
  choice: na pipiliin
  rationale: Ang di-ganap na anyo ng pandiwa ay likas na tumutukoy sa hinaharap sa kontekstong legal na ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Likas at tuwirang salin ng pananalitang tipan na nakakabit sa pangalang Yahweh.
theological_decisions:
- issue: Paglalahad sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili itong Yahweh sa salin sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang pang-isahang utos na “mo/ka” upang katawanin ang panlalaking pang-isahang anyo ng Hebreo at ang tuwirang pakikipag-usap sa Israelita. Pinanatili ang “pilak” sa pangunahing teksto at ipinaliwanag sa talababa na salapi ang gamit nito sa konteksto.
