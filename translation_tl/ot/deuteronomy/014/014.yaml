lexical_decisions:
- source_word: וְאֵת
  choice: at
  rationale: Ikinakabit ng וְ ang item na ito sa naunang talaan; ang אֵת ay pananda ng tuwirang layon at walang hiwalay na katumbas sa natural na Tagalog.
- source_word: כָּל
  choice: bawat
  rationale: Kapag kasama ng pangngalang isahan sa isang legal na talaan, distributibo ang diwa ng כָּל at sumasaklaw sa buong pangkat.
- source_word: עֹרֵב
  choice: uwak
  rationale: Ang “uwak” ang natural at malawak na katawagang Tagalog para sa mga ibon sa raven/crow family, kaya naipapakita nito ang lawak ng terminong Hebreo nang hindi pinipilit ang isang tiyak na uri.
- source_word: לְמִינוֹ
  choice: uri
  rationale: Ang parirala ay tumutukoy sa pag-uuri ayon sa kauri o pangkat. Sa Tagalog, likas at malinaw ang “bawat uri ng uwak,” bagaman binabago nito ang pormal na ayos ng Hebreo.
