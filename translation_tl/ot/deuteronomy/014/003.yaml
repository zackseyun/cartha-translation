translation:
  language: tl
  text: Huwag kang kumain ng anumang karumal-dumal na bagay[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang kasuklam-suklam na bagay.” Ang salitang Hebreo ay tumutukoy sa isang bagay na itinuturing na kasuklam-suklam o karumal-dumal; dito, ipinakikilala nito ang sumusunod na talaan ng mga ipinagbabawal na pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכַל
  choice: Huwag kang kakain
  rationale: Ang לֹא kasama ng Qal imperfect na 2ms ay tuwirang pagbabawal sa konteksto ng kautusan. Likas sa modernong Tagalog ang hulma na “Huwag kang kakain” para sa isang tahasang utos na negatibo.
- source_word: כָּל
  choice: anumang
  rationale: Kapag nasa ilalim ng pagtanggi at sinusundan ng pangngalang isahan, malinaw na ipinahahayag ng “anumang” ang saklaw na walang eksepsiyon.
- source_word: תּוֹעֵבָה
  choice: karumal-dumal
  rationale: Pinananatili nito ang matinding diwa ng isang bagay na kasuklam-suklam o hindi katanggap-tanggap. Sa konteksto, ipinakikilala nito ang talaan ng mga pagkaing ipinagbabawal, nang hindi nililimitahan ang salita sa simpleng pagkadiri lamang.
theological_decisions:
- issue: Lakas ng pagbabawal sa kautusan ng tipan
  choice: 'Tuwirang pagbabawal: “Huwag kang kakain ng anumang karumal-dumal.”'
  alternative: 'Pangkalahatang pahayag: “Hindi ka kumakain ng anumang karumal-dumal.”'
  rationale: Sa legal na kontekstong ito, ang imperfect na may לֹא ay may lakas ng utos o pagbabawal, hindi lamang paglalarawan ng nakagawiang kilos.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang isahang “kang” dahil 2ms ang anyo sa Hebreo, habang ang utos ay nakatuon sa bawat kasapi ng Israel. Ang “karumal-dumal” ay nagpapanatili sa matinding puwersa ng תּוֹעֵבָה at ang talababa ay nagbibigay ng malinaw na alternatibo.
