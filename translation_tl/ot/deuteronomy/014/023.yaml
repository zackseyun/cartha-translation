    issue: Hindi idiomatiko ang “sa lahat ng araw.”
    rationale: Ang כָּל־הַיָּמִים ay nangangahulugang “all your days,” na sa modernong Tagalog ay natural na “sa buong buhay mo.”
  - severity: low
    issue: Medyo malabo ang “mga panganay ng iyong bakahan at kawan.”
    rationale: Ang בְּכֹרוֹת ay unang isinilang na mga hayop. Ang “mga unang isinilang mula sa iyong mga baka at kawan” ay mas tahasang tumutukoy sa supling nang hindi nililimitahan ang צֹאן sa isang uri lamang ng hayop.
