revisions:
- from: At kakainin mo sa harap ni Yahweh na iyong Diyos, sa lugar na pipiliin niya upang doon manahan ang kanyang pangalan[a], ang ikasampung bahagi ng iyong butil, bagong alak, at langis, pati ang mga panganay ng iyong bakahan at kawan, upang matutuhan mong matakot kay Yahweh na iyong Diyos sa lahat ng araw.
  to: At kakainin mo sa harap ni Yahweh na iyong Diyos, sa lugar na pipiliin niya upang doon manahan ang kanyang pangalan[a], ang ikasampung bahagi ng iyong butil, bagong alak, at langis, pati ang mga unang isinilang mula sa iyong mga baka at kawan, upang matutuhan mong matakot kay Yahweh na iyong Diyos sa buong buhay mo.
  rationale: Ginawa lamang ang mga pagbabagong pang-idioma at paglilinaw. Ang “sa buong buhay mo” ay likas na katumbas ng Hebreong “sa lahat ng iyong mga araw,” at ang binagong parirala para sa mga panganay ay mas malinaw na tumutukoy sa unang supling ng mga alagang hayop. Hindi binago ang kahulugan, saklaw, o sinadyang ambigwidad ng pormula tungkol sa pangalan ni Yahweh.
