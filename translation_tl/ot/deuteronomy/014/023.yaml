id: DEU.14.23
reference: Deuteronomy 14:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: tl
  text: At kakainin mo sa harap ni Yahweh na iyong Diyos, sa lugar na pipiliin niya upang doon manahan ang kanyang pangalan[a], ang ikasampung bahagi ng iyong butil, bagong alak, at langis, pati ang mga unang isinilang mula sa iyong mga baka at kawan, upang matutuhan mong matakot kay Yahweh na iyong Diyos sa buong buhay mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “upang doon niya patirahin ang kanyang pangalan” o “upang doon niya ilagay ang kanyang pangalan.” Pinananatili ng Hebreo ang idyoma ng paglalagay o pananahan ng pangalan ni Yahweh sa piniling santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: At kakainin mo
  rationale: Ang anyong pandiwa sa kontekstong legal ay may puwersang pautos na nakatuon sa hinaharap; natural itong naipahahayag sa Tagalog bilang “kakainin mo.”
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: sa harap ni Yahweh na iyong Diyos
  rationale: Pinananatili ng “sa harap” ang literal at panambahang diwa ng לִפְנֵי, samantalang ang “ni” ay natural sa Tagalog bago ang personal na pangalang Yahweh.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: sa lugar na pipiliin niya
  rationale: Malinaw at natural na ipinahahayag ang hinaharap na pagpili ng Diyos sa lugar.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: upang doon manahan ang kanyang pangalan
  rationale: Pinananatili ang Hebreong larawan ng pangalan ng Diyos na nananahan sa piniling santuwaryo, nang hindi nilulutas ang posibleng causative na puwersa ng Hiphil.
- source_word: מַעְשַׂר
  choice: ikasampung bahagi
  rationale: Tumpak at madaling maunawaang modernong Tagalog para sa itinakdang ikasampung bahagi; iniiwasan ang hindi gaanong pangkaraniwang hiram na “ikapu.”
- source_word: דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: iyong butil, bagong alak, at langis
  rationale: Pinananatili ang tatluhang pormulang agrikultural at ang pagkakaiba ng תִּירוֹשׁ bilang bagong alak.
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: pati ang mga panganay ng iyong bakahan at kawan
  rationale: Ang “mga panganay” ay tumutukoy sa unang supling ng mga hayop; malinaw na pinaghihiwalay ng “bakahan at kawan” ang malalaki at maliliit na alagang hayop.
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: upang matutuhan mong matakot
  rationale: Pinananatili ang layuning pedagogikal ng utos at ang malawak na biblikal na diwa ng ירא bilang pagkatakot na may pagpipitagan.
- source_word: כָּל הַיָּמִים
  choice: sa lahat ng araw
  rationale: Mas malapit sa Hebreong idyoma kaysa “habambuhay,” kaya hindi nililimitahan o pinalalawak ang saklaw nito.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginagamit ang transliterasyon ng personal na pangalan upang mapanatili ang pagkakaiba nito sa titulong “Panginoon,” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Pormula ng santuwaryo na לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: upang doon manahan ang kanyang pangalan
  alternative: upang doon niya patirahin ang kanyang pangalan / upang doon niya ilagay ang kanyang pangalan
  rationale: Pinananatili nito ang larawan at teolohikal na tensiyon ng presensiya ng Diyos sa piniling lugar, habang inilalahad sa talababa ang causative at idiomatikong mga posibilidad.
- issue: Diwa ng לְיִרְאָה אֶת־יְהוָה
  choice: matakot kay Yahweh
  alternative: magpitagan kay Yahweh
  rationale: Ang “matakot” ay nagpapanatili sa pangunahing lakas ng ירא; ang pagpapalit lamang nito ng “magpitagan” ay maaaring magpahina sa tunay na tensiyon ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ikasampung bahagi” sa halip na mas teknikal na “ikapu,” at pinanatili ang “sa harap,” “manahan ang kanyang pangalan,” at “matakot” upang hindi mapawi ang mga larawan at teolohikal na tensiyon ng Hebreo.
