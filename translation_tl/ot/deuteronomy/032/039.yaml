base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: tl
  text: Tingnan ninyo ngayon na ako nga ito,[a] at walang ibang diyos maliban sa akin.[b] Ako ang pumapatay at bumubuhay; ako ang sumugat, at ako ang magpapagaling. Walang makapagliligtas mula sa kamay ko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ako—ako nga—ang siyang iyon.” Pinananatili ng pananalita ang mariing pag-uulit sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “walang diyos na kasama ko.” Sa kontekstong ito, ang parirala ay maaaring mangahulugang walang diyos na kapantay o kasabay ko.
    reason: lexical_alternative
  - marker: c
    text: Ang “mula sa kamay ko” ay idyoma para sa pagtakas mula sa kapangyarihan o pamamahala ng isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: Tingnan ninyo ngayon
  rationale: Pinananatili ang maramihang pautos at ang panawagang kilalanin sa kasalukuyan ang ipinahahayag na katotohanan.
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: ako—ako nga—ang siya
  rationale: Ipinakikita ng pag-uulit at ng “nga” ang diin ng dobleng אֲנִי, habang pinananatili ng “ang siya” ang payak at mayamang pahayag na הוּא nang hindi dinaragdagan ng “tanging.”
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: at walang ibang diyos maliban sa akin
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang kawalan ng karibal na diyos; inilalagay sa talababa ang mas literal na diwa ng עִם na “kasama.”
- source_word: אֲנִי אָמִית וַאֲחַיֶּה
  choice: Ako ang pumapatay at bumubuhay
  rationale: Tuwirang pinananatili ang magkatapat na banal na pagkilos. Ang “pumapatay” ay malinaw na katumbas ng causative na anyo ng מות, at ang “bumubuhay” ay natural ngunit malapit sa “gumagawang buhay.”
- source_word: מָחַצְתִּי וַאֲנִי אֶרְפָּא
  choice: ako ang sumugat, at ako ang magpapagaling
  rationale: Ang “sumugat” ay umaangkop sa kasalungat na “magpapagaling” nang hindi inaalis ang posibilidad na mas malakas ang pandiwang Hebreo. Ang naganap na sugat at kasunod na pagpapagaling ay pinananatili.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: Walang makapagliligtas mula sa kamay ko
  rationale: Pinananatili ang idyomang “mula sa kamay ko” at malinaw na ipinahahayag na walang may kakayahang magligtas mula sa kapangyarihan ng nagsasalita.
theological_decisions:
- issue: Eksklusibong pagka-Diyos kaugnay ng ibang mga diyos
  choice: “walang ibang diyos maliban sa akin”
  alternative: “walang Diyos na kasama ko”
  rationale: Ipinahahayag ng konteksto ang kawalan ng anumang karibal na diyos. Hindi ito pinalalabnaw tungo sa kawalan lamang ng katuwang, ngunit itinatala ang literal na alternatibo sa talababa.
- issue: Teolohikal na bigat ng אֲנִי אֲנִי הוּא
  choice: “ako—ako nga—ang siya”
  alternative: “ako lamang ang Diyos” o “ako ang nag-iisang iyon”
  rationale: Pinananatili ang diin at ang bahagyang di-pangkaraniwang anyo ng Hebreo nang hindi isinasalin bilang isang pinalawak na pormulang doktrinal na wala mismo sa teksto.
- issue: Soberanya sa kamatayan, buhay, pananakit, at pagpapagaling
  choice: Panatilihin ang lahat ng kilos bilang tuwirang pahayag ng nagsasalita
  alternative: Palambutin ang “pumapatay” o gawing pahintulot lamang ang pananakit
  rationale: Tahasan sa Hebreo ang banal na ahensiya. Hindi dapat lutasin o pahupain ng salin ang teolohikal na tensiyon nito.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “ninyo” para sa maramihang pautos, pinanatili ang matinding paralelismo ng tula, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
