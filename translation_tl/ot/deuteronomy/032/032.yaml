base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: tl
  text: 'Sapagkat ang kanilang punong ubas ay mula sa punong ubas ng Sodoma,

    at mula sa mga bukirin ng Gomorra;

    ang kanilang mga ubas ay mga ubas na nakalalason,

    at mapapait para sa kanila ang kanilang mga kumpol.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֶּפֶן / גַּפְנָם
  choice: punong ubas / kanilang punong ubas
  rationale: Tumutukoy sa halamang ubas, hindi lamang sa bunga; natural at malinaw ito sa modernong Filipino.
- source_word: שַׁדְמֹת
  choice: mga bukirin
  rationale: Pinananatili ang larawang agrikultural ng mga nilinang na lupain o bukid.
- source_word: רֹאשׁ
  choice: nakalalason
  rationale: Sa kontekstong ito, tumutukoy sa lason o makamandag na sangkap, hindi sa literal na 'ulo'; ang anyong pang-uri ay natural kasama ng 'mga ubas.'
- source_word: מְרֹרֹת לָמוֹ
  choice: mapapait para sa kanila
  rationale: Pinananatili ang tahasang panghalip na לָמוֹ ('para sa kanila') at ang maramihang diwa ng kapaitan ng mga kumpol.
theological_decisions:
- issue: Kung literal o matalinghaga ang pinagmulan sa Sodoma at Gomorra
  choice: mula sa punong ubas ng Sodoma, at mula sa mga bukirin ng Gomorra
  alternative: tulad ng punong ubas ng Sodoma at mga bukirin ng Gomorra
  rationale: Pinananatili ang matapang na metaporang pinagmulan sa Hebreo at hindi ito pinapahina tungo sa tahasang paghahambing.
- issue: Saklaw ng pariralang 'para sa kanila'
  choice: ikinabit sa 'mapapait' gaya ng ayos ng Hebreo
  alternative: alisin bilang di-kinakailangang panghalip
  rationale: May tahasang לָמוֹ sa tekstong Masoretiko at nararapat itong katawanin nang hindi nilulutas ang tiyak na pragmatikong diin nito.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang paralelismo at matitinding larawang patula ng Hebreo; ginamit ang kinikilalang mga anyong pangalang Sodoma at Gomorra.
