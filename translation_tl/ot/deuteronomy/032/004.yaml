  source_fidelity: 'Ang salin ay tapat sa estruktura at diwa ng Hebreo: ang “Ang Bato,” ganap na gawa, katarungan ng mga daan, katapatan ng Diyos, kawalan ng עָוֶל, at pangwakas na magkapares na katangiang צַדִּיק at יָשָׁר ay naipapahayag. Gayunman, ang “matapat” para sa יָשָׁר ay inuulit ang pangunahing diwa ng אֱמוּנָה sa naunang linya at hindi sapat na naihihiwalay ang kahulugang “matuwid/upright.”'
