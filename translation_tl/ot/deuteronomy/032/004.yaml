    rationale: May makatuwirang alternatibong “Diyos ng katapatan” at, sa mas di-pangkaraniwang pagbasa sa kontekstong ito, “Diyos ng katotohanan.” Dapat manatili ang ambigwidad na ito sa audit trail.
