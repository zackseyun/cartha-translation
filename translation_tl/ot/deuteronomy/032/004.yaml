base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: tl
  text: 'Ang Bato—ganap ang kanyang gawa,


    sapagkat katarungan ang lahat ng kanyang mga daan.[a]


    Siya ay Diyos na tapat[b] at walang kawalang-katarungan;[c]


    makatarungan at matuwid siya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sapagkat ang lahat ng kanyang mga daan ay makatarungang hatol.” Ang Hebreong מִשְׁפָּט ay maaaring tumukoy sa katarungan, hatol, o sa naaayon sa batas at katuwiran.
    reason: lexical_alternative
  - marker: b
    text: Ang “Diyos na tapat” ay maaari ring unawaing “Diyos ng katapatan” o, bagaman hindi gaanong malamang sa kontekstong ito, “Diyos ng katotohanan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “walang mali sa kanya” o “walang kasamaan.” Saklaw ng Hebreong עָוֶל ang moral na kamalian, kawalang-katarungan, at kasamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: Ang Bato
  rationale: Pinananatili ang konkretong talinghaga at ang gamit nito bilang titulong tumutukoy sa Diyos sa Awit ni Moises.
- source_word: תָּמִים
  choice: ganap
  rationale: Ipinahahayag ang kabuuan at walang-kapintasang integridad ng gawa ng Diyos nang hindi nililimitahan sa moral na 'walang sala.'
- source_word: פָּעֳלוֹ
  choice: ang kanyang gawa
  rationale: Pinananatili ang pangngalang isahan na kolektibong tumutukoy sa ginagawa o pagkilos ng Diyos.
- source_word: כִּי
  choice: sapagkat
  rationale: Likas na nagpapakilala sa dahilan o batayan ng naunang pahayag.
- source_word: כָל־דְּרָכָיו
  choice: lahat ng kanyang mga daan
  rationale: Pinananatili ang Hebreong talinghaga para sa paraan ng pagkilos o pakikitungo ng Diyos.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Bilang panaguri, inilalarawan nito ang lahat ng daan ng Diyos bilang naaayon sa makatarungan at wastong hatol; inilalahad sa talababa ang saklaw na 'hatol.'
- source_word: אֵל אֱמוּנָה
  choice: Diyos na tapat
  rationale: Natural na Filipino para sa Diyos na maaasahan at may katapatan; hindi ito hinihigpitan sa kahulugang proposisyunal na 'katotohanan.'
- source_word: וְאֵין עָוֶל
  choice: at walang kawalang-katarungan
  rationale: Pinananatili ang tahasang pagkakaila sa anumang mali o di-makatarungan sa Diyos.
- source_word: צַדִּיק
  choice: matuwid
  rationale: Karaniwang salin para sa moral at hudisyal na katuwiran ng Diyos.
- source_word: וְיָשָׁר
  choice: matapat
  rationale: Sa modernong Filipino, ipinahahayag ang integridad at pagiging tuwid sa asal; iniiwasan ang matigas na pag-uulit ng 'matuwid at tuwid.'
- source_word: הוּא
  choice: siya
  rationale: Inilalagay sa hulihan ng pangwakas na sugnay upang bahagyang mapanatili ang diin ng Hebreo.
theological_decisions:
- issue: Ang talinghagang banal sa הַצּוּר
  choice: Isinalin bilang “Ang Bato”
  alternative: “ang bato” o “ang Batong Kanlungan”
  rationale: Ang salita ay gumaganap bilang matalinghagang titulo ng Diyos. Pinananatili ng “Ang Bato” ang larawan nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Ang אֱמוּנָה bilang katangian ng Diyos
  choice: “Diyos na tapat”
  alternative: “Diyos ng katapatan” o “Diyos ng katotohanan”
  rationale: Sa konteksto, nangingibabaw ang pagiging maaasahan at hindi nagbabagong katapatan ng Diyos. Natural ang pang-uri sa Filipino at pinananatili ang teolohikal na bigat nang hindi ipinapalagay na 'katotohanan' lamang ang diwa.
- issue: Ugnayan ng צַדִּיק at יָשָׁר
  choice: “matuwid at matapat”
  alternative: “makatarungan at matuwid” o “matuwid at tapat”
  rationale: Pinananatiling magkahiwalay ang katuwiran at moral na integridad, samantalang iniiwasan ang hindi likas na “matuwid at tuwid.”
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may bahagyang makatang ayos upang umangkop sa Awit ni Moises. Ginamit ang “kanyang” sa halip na mas pormal na “kaniyang.” Ang “Ang Bato” ay pinanatiling malinaw na talinghagang titulo; ang mga linyang patula ay sumusunod sa paralelismo ng Hebreo.
