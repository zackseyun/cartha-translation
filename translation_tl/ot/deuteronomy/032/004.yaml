  terminology: Ang “Ang Bato,” “ganap,” “Diyos na tapat,” at “kawalang-katarungan” ay angkop. Binago ang huling pares upang maipakita ang magkaugnay ngunit di-magkaparehong צַדִּיק (“makatarungan”) at יָשָׁר (“matuwid”). Ibinalik din ang hiwalay na talababa para sa אֱמוּנָה upang hindi mawala ang dokumentadong ambigwidad na “katapatan/katotohanan.”
