    issue: Hindi sapat na malinaw ang “pinasuso niya siya ng pulot.”
    rationale: Bagaman literal na nauugnay sa pagsuso ang Hebreong pandiwa, ang “pasuso” sa modernong Filipino ay karaniwang tumutukoy sa pagpapadede. Ang “pinasipsip” ay mas natural para sa pulot at pinananatili ang causative na diwa.
  - severity: medium
    issue: 'Mali o hindi ganap ang kayarian ng alternatibong salin sa talababa c: “pinasipsip niya sa kanya.”'
    rationale: Kailangan ang tuwirang layon na “siya,” o isang buong paraphrase. Ang “pinasipsip niya siya” ay wastong anyo at tumutugma sa pangunahing teksto.
