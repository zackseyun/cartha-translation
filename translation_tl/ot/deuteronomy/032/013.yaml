base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: tl
  text: 'Pinasakay niya siya sa matataas na dako ng lupain[a],


    at kinain niya ang ani ng bukid[b];


    pinasipsip niya siya ng pulot mula sa bato,


    at ng langis mula sa batong pingkian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa matataas na lugar ng daigdig.” Malamang na tumutukoy rito ang parirala sa matataas at mabungang lupain, hindi sa mga “mataas na lugar” ng pagsambang pagano.
    reason: lexical_alternative
  - marker: b
    text: O, “ang bunga ng bukid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: Pinasakay niya siya
  rationale: Pinananatili nito ang causative na diwa ng Hiphil ng רכב—‘pinangyaring sumakay’—sa natural na Filipino, pati ang mga panghalip na nasa Hebreo.
- source_word: עַל בָּמֳתֵי אָרֶץ
  choice: sa matataas na dako ng lupain
  rationale: Ang בָּמוֹת ay tumutukoy rito sa matataas na bahagi ng lupain. Iniiwasan ng ‘matataas na dako’ ang awtomatikong pagpapakahulugang mga sambahang pagano.
- source_word: וַיֹּאכַל
  choice: at kinain niya
  rationale: Tuwirang inililipat ang karaniwang kahulugan ng אכל at pinananatili ang kongkretong larawan ng pagkain.
- source_word: תְּנוּבֹת שָׂדָי
  choice: ang ani ng bukid
  rationale: Ang תְּנוּבוֹת ay bunga, ani, o pakinabang ng lupa. Ang ‘ani ng bukid’ ay malinaw at likas sa modernong Filipino.
- source_word: וַיֵּנִקֵהוּ
  choice: pinasuso niya siya
  rationale: Ang Hiphil ng ינק ay literal na ‘pinangyaring sumuso.’ Pinananatili ng ‘pinasuso’ ang matapang na larawang patula ng pagpapakain mula sa di-inaasahang pinagmumulan.
- source_word: דְבַשׁ
  choice: pulot
  rationale: Karaniwan at eksaktong katumbas ng ‘honey,’ na nagpapahiwatig ng saganang biyaya.
- source_word: מִסֶּלַע
  choice: mula sa bato
  rationale: Ang סֶלַע ay bato o malaking tipak/bangin; ang ‘bato’ ay malinaw at mahusay na kaagapay ng kasunod na parirala.
- source_word: וְשֶׁמֶן
  choice: at ng langis
  rationale: Hindi tahasang tinutukoy ng Hebreo na langis ng olibo, kaya hindi iyon idinagdag sa pangunahing teksto.
- source_word: מֵחַלְמִישׁ צוּר
  choice: mula sa batong pingkian
  rationale: Ang חַלְמִישׁ ay batong pingkian o napakatigas na bato. Naipahahayag ng parirala ang kabalintunaan ng langis na nagmumula sa matigas at tila tigang na bato.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na pangatlong panauhang isahan
  choice: Pinanatili ang mga panghalip na ‘niya’ at ‘siya’ nang hindi pinapalitan ng ‘ang PANGINOON’ o ‘Israel.’
  alternative: Hayagang tukuyin ang gumagawa bilang ang PANGINOON at ang tumatanggap bilang Israel o Jacob.
  rationale: Malinaw ang mga tinutukoy mula sa kalapit na konteksto, ngunit mga panghalip lamang ang gamit sa mismong talata. Ang pagpapanatili sa mga ito ay gumagalang sa daloy at tunay na anyo ng Hebreo, kahit may likas na bahagyang kalabuan sa isang nakahiwalay na talata.
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Pinanatili ang paralelismo at matingkad na talinghaga ng Hebreo. Ginamit ang ‘batong pingkian’ bilang tiyak ngunit mauunawaang tawag sa flint; ipinaliliwanag ng konteksto ang diin sa saganang pagkain mula sa tila tigang na bato.
