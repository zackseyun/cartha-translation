  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: tl
  text: 'Paanong hahabulin ng isa ang isang libo,

    at patatakbuhin ng dalawa ang sampung libo,

    kung hindi sila ipinagbili ng kanilang Bato,

    at isinuko sila ni Yahweh[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ibinigay sila sa kapangyarihan ng kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Paanong
  rationale: Naghahayag ito ng retorikal na pagtataka; likas sa modernong Tagalog ang “Paanong” sa ganitong tanong.
- source_word: יִרְדֹּף
  choice: hahabulin
  rationale: Tuwirang ipinapahayag ang militar na diwa ng paghabol sa tumatakas na kalaban.
- source_word: אֶחָד אֶלֶף
  choice: hahabulin ng isa ang isang libo
  rationale: Pinananatili ang matinding di-pagkakapantay ng bilang na nasa Hebreo.
- source_word: וּשְׁנַיִם
  choice: at ... ng dalawa
  rationale: Pinananatili ang payak na paralelismo ng dalawang linya.
- source_word: יָנִיסוּ
  choice: patatakbuhin
  rationale: Ipinapakita ng anyong sanhi ang pagpapatisod o pagpapatakas sa kalaban; natural itong pahayag sa Tagalog.
- source_word: רְבָבָה
  choice: sampung libo
  rationale: Ito ang malinaw at karaniwang katumbas ng bilang sa konteksto.
- source_word: אִם לֹא כִּי
  choice: kung hindi
  rationale: Ipinakikilala nito ang tanging paliwanag sa tila imposibleng pangyayari.
- source_word: צוּרָם
  choice: kanilang Bato
  rationale: Pinananatili ang metapora at gamit nito bilang katawagan sa Diyos sa Awit ni Moises; ang malaking titik ay nagpapahiwatig ng titular na gamit.
- source_word: מְכָרָם
  choice: ipinagbili ... sila
  rationale: Pinananatili ang tahasang metapora ng pagbebenta bilang paghatid sa kapangyarihan ng kaaway.
- source_word: וַיהוָה
  choice: ni Yahweh
  rationale: Ginagamit ang pangalang tipan na kinakatawan ng Tetragrammaton sa tekstong Hebreo.
- source_word: הִסְגִּירָם
  choice: isinuko sila
  rationale: Natural na Tagalog para sa paghahatid o pagbibigay sa kapangyarihan ng iba sa konteksto ng paghatol.
theological_decisions:
- issue: Paglalarawan sa Diyos bilang צוּר
  choice: kanilang Bato
  alternative: kanilang bato
  rationale: Sa konteksto ng Deuteronomio 32, ang “Bato” ay metaporikal na katawagan sa Diyos ng Israel; pinananatili ang metapora nang hindi ito pinapalitan ng interpretatibong titulo.
- issue: Pagsasalin ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang pinangalanan ng Hebreo ang Diyos sa pamamagitan ng Tetragrammaton, kaya pinananatili ang personal na pangalang Yahweh.
- issue: Ahensiya ng pagkatalo ng Israel
  choice: ipinagbili ng kanilang Bato ... isinuko ... ni Yahweh
  alternative: pinabayaan sila ng Diyos na matalo
  rationale: Pinananatili ang matindi at magkatulad na mga larawang Hebreo sa halip na palambutin ang pahayag bilang simpleng pagpapabaya.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at patulang himig. Pinanatili ang paralelismo at mga metapora ng Hebreo, habang ginawang natural ang retorikal na tanong. Inilagay ang talababa pagkatapos ng “isinuko sila ni Yahweh,” sapagkat tumutukoy ito sa הִסְגִּירָם; ang pagkakalagay nito pagkatapos ng “isang libo” sa English consultation layer ay hindi tugma sa nilalaman ng talababa.
