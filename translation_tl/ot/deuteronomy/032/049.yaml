  verdict: revise
  source_fidelity: Tumpak ang pangunahing kahulugan, mga pangalang heograpiko, lokasyong “sa tapat ng Jerico,” patuloy na aspekto ng “ibinibigay ko,” at “bilang pag-aari.” Gayunman, ang “sa Bundok Nebo” ay maaaring basahin bilang hiwalay na destinasyon sa halip na appositive na pagkakakilanlan ng “bundok na ito ng Abarim.”
  naturalness: Malinaw at modernong Tagalog ang draft. Ang paggamit ng “ang Bundok Nebo” at pag-uugnay sa ikalawang pautos sa pamamagitan ng “at” ay mas malinaw at mas malapit sa sintaks at daloy ng Hebreo.
  terminology: Ang Abarim, Nebo, Moab, Jerico, Canaan, at Israel ay pinanatili bilang mga pangalan. Ang “mga anak ni Israel” ay wastong source-near na katawagan, at ang “pag-aari” ay angkop para sa אֲחֻזָּה; ang alternatibong “mana” ay wastong inilalagay sa talababa.
  issues:
