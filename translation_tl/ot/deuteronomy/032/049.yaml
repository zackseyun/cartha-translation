reference: Deuteronomy 32:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: tl
  text: Umakyat ka sa bundok na ito ng Abarim, ang Bundok Nebo, na nasa lupain ng Moab, sa tapat ng Jerico; at tingnan mo ang lupain ng Canaan, na ibinibigay ko sa mga anak ni Israel bilang pag-aari[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakaharap sa Jerico.” Ang Hebreong idyoma ay tumutukoy sa heograpikong kinaroroonang katapat ng Jerico.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “mga Israelita.” Sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “bilang isang pagmamay-aring lupain”; sa ilang konteksto, “bilang mana.” Ang salitang Hebreo ay tumutukoy sa isang pag-aari o hawak na lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Ang Qal imperative na panlalaking isahan ay tuwirang utos na pumaitaas. Likas sa modernong Tagalog ang “Umakyat ka” at malinaw nitong pinananatili ang direksiyon.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: bundok na ito ng Abarim
  rationale: Pinananatili ang isahang “bundok,” ang demonstratibong “ito,” at ang Abarim bilang pangalang heograpiko sa halip na isalin ang posibleng etimolohiya nito.
- source_word: הַר נְבוֹ
  choice: Bundok Nebo
  rationale: Ang “Nebo” ay nasa apposition sa “bundok”; ang anyong “Bundok Nebo” ay malinaw at likas na pantukoy sa isang bundok sa Filipino.
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב
  choice: na nasa lupain ng Moab
  rationale: Tumpak at natural na sugnay na tumutukoy sa kinaroroonan ng Bundok Nebo.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: sa tapat ng Jerico
  rationale: Sa kontekstong heograpiko, ang idyomang עַל־פְּנֵי ay nangangahulugang nasa katapat o nakaharap sa isang lugar; natural sa Tagalog ang “sa tapat ng.”
- source_word: וּרְאֵה
  choice: Tingnan mo
  rationale: Tuwirang pautos ang pandiwa. Mas malinaw sa Tagalog ang “Tingnan mo” kaysa literal na “at makita mo,” at hindi ito gumagamit ng makalumang pananalita.
- source_word: אֶת אֶרֶץ כְּנַעַן
  choice: ang lupain ng Canaan
  rationale: Pinananatili ang “lupain” at ang kinikilalang anyo ng pangalang Canaan.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: na ibinibigay ko
  rationale: Ang participle kasama ng tahasang panghalip na unang panauhan ay nagpapahayag ng kasalukuyan o nalalapit na pagkakaloob; pinananatili ng “ibinibigay ko” ang dinamikong aspektong ito.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili nito ang anyong “mga anak ni Israel” ng Hebreong nakaugaliang katawagan, habang nananatiling malinaw sa karaniwang mambabasang Filipino.
- source_word: לַאֲחֻזָּה
  choice: bilang pag-aari
  rationale: Ang אֲחֻזָּה ay tumutukoy sa pag-aaring hawak, lalo na sa lupain. Ang “bilang pag-aari” ay tumpak at hindi awtomatikong nagdaragdag ng kahulugang mana.
theological_decisions:
- issue: Saklaw at anyo ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang parirala ay isang nakaugaliang katawagan sa bayang tipan at may anyong panlalaking maramihan. Pinananatili ng pangunahing teksto ang pormal na larawan nang hindi ipinapalagay na mga lalaki lamang ang tinutukoy; ibinibigay sa talababa ang mas idyomatikong alternatibo.
- issue: Kahulugan ng אֲחֻזָּה
  choice: pag-aari
  alternative: mana
  rationale: Bagaman maaaring kaugnay ng minanang lupain ang salita sa konteksto, ang pangunahing leksikal na diwa rito ay isang pag-aari o paghawak sa lupain. Iniwasang gawing tahasang “mana” ang pangunahing teksto upang hindi resolbahin nang labis ang saklaw ng termino.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang pautos at maiikling sugnay para sa natural na daloy. Pinanatili ang mga pangalang heograpiko at ang ekspresyong “mga anak ni Israel,” habang inilagay sa mga talababa ang mahahalagang alternatibong leksikal.
