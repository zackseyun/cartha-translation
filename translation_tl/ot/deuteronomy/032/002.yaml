  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: tl
  text: Pumatak nawang tulad ng ulan ang aking turo[a]; tumulo nawang tulad ng hamog ang aking salita, tulad ng ambon sa murang damo[b], at tulad ng masaganang ulan sa mga halaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “bumaba” o “tumulo”: inilalarawan ng pandiwang Hebreo ang pagtuturong bumababa na gaya ng ulan.'
    reason: lexical_alternative
  - marker: b
    text: Ang “ambon” ay salin ng isang bihirang salitang Hebreo na maaaring tumukoy sa mahinang ulan o mga patak ng ulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: pumatak
  rationale: Inilalarawan ng pandiwa ang pagbaba ng turo na gaya ng ulan. Pinananatili ng “pumatak” ang larawan ng patak ng ulan at ang patulang paghahambing.
- source_word: לִקְחִי
  choice: ang aking turo
  rationale: Ang לֶקַח ay tumutukoy sa turo o aral na ibinibigay o tinatanggap; natural at malinaw sa konteksto ang “aking turo.”
- source_word: תִּזַּל
  choice: tumulo
  rationale: Ang נזל ay maaaring mangahulugang dumaloy o tumulo. Ang “tumulo” ay angkop sa banayad na larawan ng hamog at katapat ng “pumatak” sa unang taludtod.
- source_word: אִמְרָתִי
  choice: ang aking salita
  rationale: Ang אִמְרָה ay salita, pahayag, o pananalita. Ang “aking salita” ay likas sa Filipino at pinananatili ang patulang kaagapay ng “aking turo.”
- source_word: שְׂעִירִם
  choice: ambon
  rationale: Bihira at pinagtatalunan ang salitang Hebreo, ngunit sa konteksto ay tumutukoy ito sa mahinang ulan o mga patak ng ulan. Ang “ambon” ay maikli, natural, at angkop sa larawan.
- source_word: דֶשֶׁא
  choice: murang damo
  rationale: Ang דֶשֶׁא ay sariwa o bagong sibol na luntiang pananim. Ipinahihiwatig ng “murang damo” ang bagong tubo at marupok na damong dinidilig.
- source_word: רְבִיבִים
  choice: masaganang ulan
  rationale: Ang רְבִיבִים ay saganang pag-ulan o malalakas na buhos. Pinananatili ng “masaganang ulan” ang kasaganaan nang hindi nagpapahiwatig ng mapaminsalang unos.
- source_word: עֵשֶׂב
  choice: mga halaman
  rationale: Mas malawak ang עֵשֶׂב kaysa damo lamang at maaaring tumukoy sa sari-saring pananim; malinaw at karaniwan ang “mga halaman.”
