source:
  edition: WLC
  text: לִ֤/י נָקָם֙ וְ/שִׁלֵּ֔ם לְ/עֵ֖ת תָּמ֣וּט רַגְלָ֑/ם כִּ֤י קָרוֹב֙ י֣וֹם אֵידָ֔/ם וְ/חָ֖שׁ עֲתִדֹ֥ת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: tl
  text: 'Akin ang paghihiganti[b] at ang kabayaran,

    kapag dumulas ang kanilang paa;[a]

    sapagkat malapit na ang araw ng kanilang kapahamakan,

    at mabilis na dumarating ang nakalaan para sa kanila.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bumigay ang kanilang paa” o “mangatal ang kanilang paa.”
    reason: lexical_alternative
  - marker: b
    text: Ang pahayag na ito ay sinipi sa Roma 12:19 at inalingawngaw sa Hebreo 10:30.
    reason: cross_reference
  - marker: c
    text: Maaari ring “at mabilis na dumarating ang mga bagay na itinakda para sa kanila”; masinsin ang pagkakasabi sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי נָקָם וְשִׁלֵּם
  choice: Akin ang paghihiganti at ang pagganti
  rationale: Ang לִי ay natural na ipinahahayag bilang “akin,” samantalang pinananatili ng magkatambal na “paghihiganti” at “pagganti” ang dalawang terminong tumutukoy sa nararapat na ganti, nang hindi ito pinapalabnaw bilang pangkalahatang katarungan lamang.
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: sa panahong madulas ang kanilang paa
  rationale: Pinananatili ang kolektibong isahang “paa” at ang malinaw na larawan ng pagdulas bilang nalalapit na pagbagsak.
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: sapagkat malapit na ang araw ng kanilang kapahamakan
  rationale: Ipinahahayag ng “sapagkat” ang ugnayang sanhi; ang “kapahamakan” ay natural at marangal na katumbas ng אֵיד bilang mapaminsalang pagbagsak.
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: at nagmamadali ang nakalaan para sa kanila
  rationale: 'Pinananatili ang masinsin at bahagyang di-tiyak na pananalita ng Hebreo: ang nakahanda o nakatakda para sa kanila ay mabilis na dumarating, nang hindi tahasang tinatawag itong “tadhana” o “hatol.”'
theological_decisions:
- issue: Kalikasan ng banal na paghihiganti
  choice: Panatilihin ang “Akin ang paghihiganti” bilang pahayag ng karapatan ng Diyos na gumanti.
  alternative: “Akin ang katarungan” o “Ako ang maghihiganti.”
  rationale: Ang “paghihiganti” ang tuwirang nagpapanatili sa bigat ng נָקָם at sa kaugnayan nito sa Roma 12:19 at Hebreo 10:30, ngunit hindi dinaragdagan ng ideya ng maliit o makasariling paghihiganti.
- issue: Kahulugan ng עֲתִדֹת לָמוֹ
  choice: “ang nakalaan para sa kanila”
  alternative: “ang kanilang kapahamakan” o “ang mga bagay na itinakda para sa kanila”
  rationale: Pinananatili ng isahang kolektibong parirala ang kalabuan ng siksik na Hebreo tungkol sa eksaktong bagay na inihanda o itinakda, habang malinaw pa ring ipinahihiwatig ang nalalapit na paghuhukom.
translation_notes:
  register: Makabagong Filipino na marangal at patula, na may malinaw na paralelismo. Pinanatili ang kolektibong “paa,” ang matinding salitang “paghihiganti,” at ang kalabuan ng huling parirala.
