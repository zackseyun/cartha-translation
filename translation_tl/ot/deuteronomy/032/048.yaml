  text: And Yahweh spoke to Moses on that very day[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh kay Moises noong mismong araw na iyon[a], at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: יהוה (YHWH); tradisyonal na isinasaling “ANG PANGINOON.” Maaari rin itong isalin bilang “Jehovah.”'
