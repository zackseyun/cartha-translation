    rationale: Ang kasalukuyang anyong “sinasabi” ay hindi ang karaniwang paraan ng Filipino upang ipakilala ang kasunod na tuwirang pananalita. Ang “at sinabi:” ay natural at naipapahayag ang tungkulin ng לֵאמֹר.
  - severity: low
    issue: Hindi tumpak at hindi lohikal ang kasalukuyang talababa.
    rationale: Ang YHWH ay transliterasyon, hindi ang mismong anyong Hebreo; bukod dito, nakalista ang “Yahweh” bilang alternatibo kahit ito ang nasa pangunahing salin.
