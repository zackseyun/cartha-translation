  source_fidelity: 'Tumpak ang pangunahing diwa: si Yahweh ay nagsalita kay Moises sa eksaktong araw na iyon. Gayunman, ang “nang mismong araw” ay kulang sa likas na pang-abay na panandang panahon sa modernong Filipino, at ang “na sinasabi” ay hindi natural na pambungad sa nalalapit na tuwirang pananalita.'
  naturalness: Mas natural at malinaw ang “noong mismong araw na iyon” at “at sinabi:” sa modernong Filipino. Pinananatili ng tutuldok ang bukás na ugnayan sa tuwirang pananalita sa kasunod na talata.
  terminology: Ang “Yahweh” at “Moises” ay angkop. Inayos ang talababa upang tumpak na tukuyin ang anyong Hebreo at upang hindi ilista ang “Yahweh” bilang isang alternatibo gayong ito na ang gamit sa teksto.
