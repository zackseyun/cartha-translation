lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive na anyo ng דבר ay nagpapatuloy sa salaysay; natural at marangal sa Filipino ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang natural na pananda sa Filipino para sa taong pinatutungkulan ng pagsasalita.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: nang mismong araw na iyon
  rationale: Idyomatikong ipinapahayag nito ang tiyak at binigyang-diin na panahon, hindi ang literal na kahulugan ng עֶצֶם na “buto” o “substance.”
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili ang pormal na Hebreong pormula na nagpapakilala sa tuwirang pananalita sa susunod na talata.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon nang hindi ito ginagawang titulo; ipinapaliwanag sa talababa ang tradisyonal na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pormal na pormula ng pagsasalita dahil nagpapatuloy ang pangungusap sa kasunod na talata.
