  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: tl
  text: Dinggin ninyo,[a] O mga langit, at magsasalita ako; at dinggin nawa ng lupa ang mga salita ng aking bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Makinig kayong mabuti, O mga langit … at nawa’y makinig ang lupa.” Gumagamit ang Hebreo ng matatayog na patulang anyo ng utos at pakiusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: Makinig kayong mabuti
  rationale: Ang Hiphil imperative ay nananawagan ng masusing pakikinig, hindi lamang pagkarinig. Likas ito sa modernong Filipino at nananatiling marangal ang himig.
- source_word: הַשָּׁמַיִם
  choice: O langit
  rationale: Ang “langit” ay likas na pangngalang kolektibo sa Filipino para sa Hebreong שָׁמַיִם; idinagdag ang “O” upang malinaw ang tuwirang patulang pagtawag.
- source_word: וַאֲדַבֵּרָה
  choice: at magsasalita ako
  rationale: Pinananatili nito ang pagpapasya o layunin ng anyong cohortative at ang pasulong na daloy ng paralelismo.
- source_word: וְתִשְׁמַע
  choice: at dinggin ng lupa
  rationale: Ang imperfect/jussive ay nauunawaan dito bilang pakiusap o panawagang katapat ng naunang pautos. Ipinahahayag ng “dinggin” ang marangal at bolisyunal na himig.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa tambalang kosmiko na langit at lupa, “lupa” ang angkop kaysa “lupain” at hindi nililimitahan ang saklaw sa isang teritoryo.
- source_word: אִמְרֵי
  choice: ang mga salita
  rationale: Karaniwan, malinaw, at sapat na mabigat ang “mga salita” para sa mga binigkas na pahayag.
- source_word: פִי
  choice: ng aking bibig
  rationale: Pinananatili ang kongkreto at patulang pariralang Hebreo sa halip na gawing payak na “na sinasabi ko.”
theological_decisions:
- issue: Saklaw ng pagtawag sa langit at lupa
  choice: Patulang pagtawag sa buong sangnilikha bilang saksi
  alternative: Retorikal lamang na panawagan sa lahat ng tagapakinig
  rationale: Pinananatili ng salin ang maringal na pormula ng pagtawag sa langit at lupa, na maaaring magpahiwatig ng pagsaksi sa kontekstong tipan, nang hindi tahasang idinaragdag ang salitang “saksi” sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at patula. Ginamit ang “O langit” at “dinggin” upang mapanatili ang maringal na pagtawag, habang ang “Makinig kayong mabuti” ay malinaw sa karaniwang mambabasa.
