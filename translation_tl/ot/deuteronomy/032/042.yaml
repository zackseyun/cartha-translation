  source_fidelity: 'Tapat ang draft sa marahas at matalinghagang larawan ng Hebreo: ang mga palaso ay ‘pinapalasing’ sa dugo, at ang espada ay ‘lumalamon’ ng laman. Napapanatili rin sa talababa ang mahalagang kawalang-katiyakan ng פַּרְעוֹת.'
