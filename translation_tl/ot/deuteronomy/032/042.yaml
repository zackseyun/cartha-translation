  terminology: Ang “palaso,” “espada,” “laman,” “mga napatay,” at “mga bihag” ay angkop at marangal na modernong Filipino. Ang “mga pinuno ng kaaway” ay isang katanggap-tanggap na pangunahing pagbasa ng debatidong termino, kung may talababa na nag-iingat ng literal at alternatibong pagbasa.
