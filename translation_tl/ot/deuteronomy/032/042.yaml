base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: tl
  text: 'Palalasingin ko sa dugo ang aking mga palaso,

    at lalamunin ng aking espada ang laman—

    sa dugo ng mga napatay at mga bihag,

    mula sa mga ulo ng mga pinuno ng kaaway.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “mula sa mabubuhok na ulo ng kaaway,” o “mula sa ulo ng mga pinuno ng kaaway.” Mahirap unawain ang pariralang Hebreo, lalo na ang bihirang salitang פַּרְעוֹת.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: Lalasingin ko
  rationale: Pinananatili ang matingkad na metapora ng Hiphil ng שׁכר, “gawing lasing,” sa halip na pahinain ito bilang “babasaing lubos.”
- source_word: חִצַּי
  choice: ang aking mga palaso
  rationale: Karaniwan at malinaw na katumbas sa makabagong Filipino, habang pinananatili ang larawang pandigma.
- source_word: מִדָּם
  choice: sa dugo
  rationale: Ang מן kasunod ng “lalasingin” ay nagpapahayag dito ng bagay na sanhi o pinagmumulan ng pagkalasing; natural itong ipinahahayag sa Filipino bilang “sa dugo.”
- source_word: וְחַרְבִּי
  choice: at ... ng aking espada
  rationale: Tuwirang pinananatili ang pagmamay-ari at ang espada bilang gumaganap ng kasunod na pandiwa.
- source_word: תֹּאכַל בָּשָׂר
  choice: lalamunin ... ang laman
  rationale: Ang “lalamunin” ay natural na naglilipat sa marahas na metapora ng literal na “kakain ng laman” nang hindi inaalis ang personipikasyon ng espada.
- source_word: מִדַּם חָלָל
  choice: sa dugo ng mga napatay
  rationale: Ang חָלָל ay karaniwang tumutukoy sa mga napatay sa labanan; ang “mga napatay” ay malinaw at hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: וְשִׁבְיָה
  choice: at ng mga bihag
  rationale: Sa kontekstong pandigma, ipinahahayag ang kolektibong pangngalan bilang mga taong nabihag, kaagapay ng “mga napatay.”
- source_word: מֵרֹאשׁ
  choice: mula sa mga ulo ng
  rationale: Pinananatili ang konkretong kahulugan ng רֹאשׁ at inuunawa itong kolektibo sa Filipino; hindi ito agad ginagawang abstraktong “pinakapuno.”
- source_word: פַּרְעוֹת
  choice: mga pinuno
  rationale: Bihira at pinagtatalunang salita ito. Ang “mga pinuno” ay nababasang maayos sa konteksto, samantalang inilalahad sa talababa ang mas literal na posibilidad na may kinalaman sa nakalugay o mahabang buhok.
- source_word: אוֹיֵב
  choice: ng kaaway
  rationale: Ang pang-isahang anyo ay may kolektibong diwa; natural itong panatilihin bilang “kaaway” sa Filipino.
theological_decisions:
- issue: Kahulugan ng mahirap na pariralang מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: mula sa mga ulo ng mga pinuno ng kaaway
  alternative: mula sa mabubuhok o mahahabang-buhok na ulo ng kaaway; mula sa ulo ng mga pinuno ng kaaway
  rationale: Leksikal at sintaktikong suliranin ito, hindi isang usaping doktrinal. Pinili sa pangunahing teksto ang malinaw na pagbasa tungkol sa mga pinuno ng kaaway, ngunit hindi itinago ang tunay na kawalang-katiyakan ng bihirang salitang פַּרְעוֹת; kaya nasa talababa ang mas literal na mga posibilidad.
translation_notes:
  register: Makabagong Filipino na marangal at patula, na may malinaw na larawang pandigma. Pinanatili ang matitinding metaporang “lalasingin” at “lalamunin,” at iniwasan ang salitang lubhang teknikal o makaluma. Ang putol-putol na mga linya ay sumusunod sa poetikong paralelismo ng awit.
