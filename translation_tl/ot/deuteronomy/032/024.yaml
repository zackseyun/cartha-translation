translation:
  language: tl
  text: 'Nangayayat dahil sa taggutom,

    nilamon ng salot[a] at mapait na pagkapuksa;

    ipapadala ko laban sa kanila ang mga pangil ng mga hayop[b],

    kasama ang kamandag ng mga nilalang na gumagapang sa alabok.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagniningas na lagnat.” Ang salitang Hebreo na רֶשֶׁף (reshef) ay maaari ring umalingawngaw sa pangalang Reshef, na iniugnay sa salot sa sinaunang Malapit na Silangan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga ngipin ng mga hayop.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring unawaing “mga ahas sa alabok,” ngunit mas malawak ang Hebreo at tumutukoy sa mga nilalang na gumagapang sa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: nangayayat dahil sa taggutom
  rationale: Ipinahahayag ng מְזֵי ang pagiging gaunt, lupaypay, o ubos ang lakas. Likas sa makabagong Tagalog ang “nangayayat,” at malinaw na inilalarawan ng “taggutom” ang malawakang kapahamakang nasa konteksto, hindi lamang pansariling pagkagutom.
- source_word: לְחֻמֵי רֶשֶׁף
  choice: nilamon ng salot
  rationale: Ang bihirang anyo ng לְחֻמֵי ay may diwang “kinain” o “nilipol,” kaya pinananatili ng “nilamon” ang masidhing larawang patula. Ang רֶשֶׁף ay isinaling “salot” bilang karaniwang pangngalan para sa nakamamatay na sakit o hagupit, habang inilalahad sa talababa ang tunay na leksikal at makasaysayang kalabuan.
- source_word: קֶטֶב מְרִירִי
  choice: mapait na pagkapuksa
  rationale: Maaaring tumukoy ang קֶטֶב sa mapaminsalang salot o pagkawasak, at literal na “mapait” ang מְרִירִי. Ang “pagkapuksa” ay umiiwas sa pag-uulit ng “salot” at pinananatili ang tindi at lawak ng kapahamakan.
- source_word: שֶׁן בְּהֵמוֹת
  choice: mga pangil ng mababangis na hayop
  rationale: Literal na “ngipin” ang שֶׁן, ngunit sa konteksto ng mga hayop na ipinadadala upang manalakay, natural na naipahahayag ng “pangil” ang panganib. Ipinahihiwatig ng konteksto ang mapanganib na mga hayop, kaya ang “mababangis” ay nagpapalinaw nang hindi nagpapakilala ng isang tiyak na uri.
- source_word: אֲשַׁלַּח בָּם
  choice: ipakakawala ko laban sa kanila
  rationale: Ang parirala ay tumutukoy sa pagpapadala o pagpapakilos ng isang mapaminsalang puwersa laban sa mga tao. Ang “ipakakawala” ay natural sa mga hayop at malinaw na nagdadala ng diwa ng paghatol.
- source_word: חֲמַת זֹחֲלֵי עָפָר
  choice: kamandag ng mga nilalang na gumagapang sa alabok
  rationale: Bagaman maaari ring mangahulugan ng “poot” o “init” ang חֲמַת, “kamandag” ang angkop sa mga gumagapang na nilalang. Pinananatili ng “mga nilalang na gumagapang sa alabok” ang malawak na saklaw at konkretong larawan ng Hebreo nang hindi ito nililimitahan sa mga ahas lamang.
theological_decisions:
- issue: Posibleng kaugnayan ng רֶשֶׁף sa pangalang Reshef
  choice: Isalin bilang karaniwang pangngalang “salot.”
  alternative: Gamitin ang pangalang “Reshef,” o isalin bilang “nagniningas na lagnat.”
  rationale: Sa agarang konteksto, bahagi ang salita ng patulang talaan ng mga kapahamakang dulot ng tipang paghatol. Hindi hinihingi ng teksto na ituring itong tahasang pagtukoy sa isang diyos. Gayunman, tunay ang leksikal at sinaunang makasaysayang alingawngaw, kaya pinananatili ito sa talababa sa halip na tahimik na lutasin.
- issue: Saklaw ng זֹחֲלֵי עָפָר
  choice: Panatilihin ang malawak na “mga nilalang na gumagapang sa alabok.”
  alternative: Limitahan sa “mga ahas sa alabok.”
  rationale: Maaaring kabilang ang mga ahas, ngunit mas malawak ang ekspresyong Hebreo. Iniiwasan ng salin ang di-makatwirang pagpapakitid sa uri ng nilalang.
translation_notes:
  register: Makabago ngunit marangal na Tagalog, na may patulang ayos at maiikling magkakatumbas na linya. Ginamit ang “nilamon” at “mapait na pagkapuksa” upang mapanatili ang kongkreto at matinding larawan ng Hebreo. Ang lahat ng talababa ay nakakabit sa mismong salitang nililinaw at sunod-sunod ang mga pananda.
