  terminology: Ang “Yahweh,” “bayan,” “Jacob,” at “mana” ay angkop. Ang “nakalaang bahagi” ay maayos na nagsasaad ng allotment/share nang hindi ipinipilit ang literal na “lubid na panukat.”
