  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: tl
  text: 'Sapagkat bahagi ni Yahweh ang kanyang bayan;

    si Jacob ang nakalaang bahagi[a] ng kanyang mana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panukat na lubid ng kanyang mana” o “bahaging itinalaga sa kanyang mana.” Ang Hebreong חֶבֶל ay maaaring tumukoy nang literal sa lubid na panukat at, sa pinalawak na diwa, sa isang bahaging sinukat o itinalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita rito ang paliwanag o batayan ng naunang pahayag sa Awit ni Moises.
- source_word: חֵלֶק
  choice: bahagi
  rationale: Tumutukoy ito sa bahagi o takdang kaparte ng isang tao at angkop sa larawan ng pamamahagi at mana.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang pangalang tipan na kinakatawan ng Tetragrammaton.
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Ipinahahayag ng עַם ang bayang kaugnay ni Yahweh sa tipan, hindi lamang isang bansang pampolitika.
- source_word: יַעֲקֹב
  choice: si Jacob
  rationale: Pinananatili ang tahasang pangalang nasa Hebreo at ang makatang pagtukoy nito sa bayang Israel.
- source_word: חֶבֶל
  choice: bahaging laan
  rationale: Maaaring literal na mangahulugang panukat na lubid at, sa pinalawak na diwa, bahaging sinukat o inilaan. Natural na ipinahahayag ng “bahaging laan” ang diwang iyon sa Filipino.
- source_word: נַחֲלָתוֹ
  choice: sa kanyang mana
  rationale: Pinananatili ng “mana” ang larawan ng minanang pag-aari o pag-aaring itinakda sa isang tumatanggap.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ito sa halip na palitan ng titulo.
- issue: Kung ipaliliwanag si Jacob bilang Israel
  choice: si Jacob
  alternative: Israel
  rationale: Ang “Jacob” ang tahasang nasa teksto at nagpapanatili sa makatang paralelismo nang hindi nagsisingit ng paliwanag sa pangunahing teksto.
- issue: Metapora ng חֶבֶל kaugnay ng mana
  choice: bahaging laan
  alternative: panukat na lubid / kaparte
  rationale: Ipinahahayag ng pangunahing salin ang pinalawak na diwa ng isang bahaging sinukat o itinakda, habang inilalagay sa talababa ang tunay na leksikal na lawak ng metapora.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinananatili ang maikli at balanseng paralelismo ng tulang Hebreo; ang “bahaging laan” ay natural ngunit hindi binubura ang metapora, na ipinaliliwanag sa talababa.
