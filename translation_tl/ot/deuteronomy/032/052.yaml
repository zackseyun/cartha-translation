base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: tl
  text: Sapagkat makikita mo ang lupain mula sa malayo[a], ngunit hindi ka makapapasok doon—sa lupaing ibinibigay ko sa mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa tapat nito” o “mula sa malayo.” Ipinahihiwatig ng Hebreong parirala na matatanaw ni Moises ang lupain ngunit hindi niya ito mapapasok.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na anyo, “mga anak ni Israel.” Isa itong nakaugaliang katawagan para sa buong bayang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o paliwanag kaugnay ng naunang pahayag. Ang “Sapagkat” ay angkop sa marangal na daloy ng talata.
- source_word: מִנֶּגֶד
  choice: mula sa malayo
  rationale: Ipinahihiwatig ng parirala na matatanaw ni Moises ang lupain mula sa kabila o sa isang kalayuan, ngunit hindi niya ito mapapasok. Likas sa modernong Filipino ang “mula sa malayo,” habang inilalahad sa talababa ang ibang posibleng anyo.
- source_word: תִּרְאֶה
  choice: makikita mo
  rationale: Ang imperfect na ikalawang panauhang panlalaki ay prediktibo sa kontekstong ito. Malinaw at natural sa Filipino ang panghinaharap na “makikita mo.”
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa lupaing ipinangako at ibinibigay sa Israel. Mas angkop dito ang “lupain” kaysa sa pangkalahatang “lupa” o pampolitikang “bansa.”
- source_word: וְשָׁמָּה לֹא תָבֹא
  choice: ngunit hindi ka makapapasok doon
  rationale: Maaaring mangahulugan ang בוא ng pumunta, dumating, o pumasok. Dahil ang kasunod na parirala ay tumutukoy sa pagpasok sa lupain, malinaw at natural ang “makapapasok doon.”
- source_word: אֶל הָאָרֶץ
  choice: sa lupain
  rationale: Ipinapakita ng אֶל ang patutunguhan. Sa Filipino, sapat na ang “sa lupain” matapos ang pandiwang “makapapasok,” at iniiwasan nito ang di-likas na pag-uulit.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: na ibinibigay ko
  rationale: Pinananatili ng aspektong progresibo ng “ibinibigay ko” ang participial na נֹתֵן bilang kasalukuyan o nalalapit na gawa ng Diyos.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Ang “mga anak ni Israel” ang natural at nakaugaliang salin sa Filipino ng pambansang katawagang ito. Hindi kailangang idagdag ang “na lalaki,” sapagkat sa gamit na ito ay tumutukoy ang parirala sa buong bayang Israel, hindi lamang sa mga lalaking kasapi nito.
theological_decisions:
- issue: Ang kasarian at saklaw ng katawagang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga anak na lalaki ni Israel; sambayanang Israel; mga Israelita
  rationale: Bagaman panlalaking maramihan ang anyong Hebreo, isa itong nakaugaliang pambansang katawagan para sa buong bayang tipan. Pinananatili ng “mga anak ni Israel” ang anyo at kaugnayan kay Israel nang hindi nagpapahiwatig na mga lalaki lamang ang tatanggap ng lupain.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “lupain” para sa promised land at “makapapasok” upang likas na maipahayag ang ipinagkait na pagpasok. Ang em dash ay naglilinaw na ang “doon” ay tumutukoy sa lupaing ibinibigay sa Israel.
