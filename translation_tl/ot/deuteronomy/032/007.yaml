base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: tl
  text: 'Alalahanin mo ang mga araw ng unang panahon;

    pag-isipan ninyo ang mga taon ng sali’t salinlahi.[a]

    Tanungin mo ang iyong ama, at ipaaalam niya sa iyo;

    ang iyong mga nakatatanda naman, at sasabihin nila sa iyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga taon ng salinlahi at salinlahi,” isang idyoma para sa magkakasunod na mga salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Alalahanin mo
  rationale: Tuwirang pautos na isaisip o gunitain ang nakaraan; natural at malinaw sa modernong Filipino.
- source_word: יְמוֹת עוֹלָם
  choice: ang mga araw noong unang panahon
  rationale: Ipinahahayag ang sinaunang nakaraan nang hindi nililimitahan ang עוֹלָם sa kahulugang walang hanggan.
- source_word: בִּינוּ
  choice: pag-isipan ninyo
  rationale: Ang pandiwa ay maaaring mangahulugang umunawa, kumilatis, o magbigay-isip. Sa paralelismo rito, ang mapagnilay na 'pag-isipan' ang natural; pinanatili rin ang anyong maramihan ng pautos.
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: ang mga taon ng sali’t salinlahi
  rationale: Ang Hebreong idyomang 'salinlahi at salinlahi' ay tumutukoy sa magkakasunod na mga salinlahi; likas sa Filipino ang 'sali’t salinlahi.'
- source_word: שְׁאַל
  choice: Tanungin mo
  rationale: Payak at tuwirang katumbas ng pautos na humingi ng kaalaman.
- source_word: אָבִיךָ
  choice: ang iyong ama
  rationale: Pinananatili ang karaniwang literal na kahulugan ng pangngalang isahan, habang inilalahad sa talababa ang posibleng mas malawak na gamit.
- source_word: וְיַגֵּדְךָ
  choice: at ipaaalam niya sa iyo
  rationale: Ang Hiphil ng נגד ay pagpapahayag o pagpapaalam; inilalayo nito nang bahagya ang parirala sa kasunod na karaniwang pandiwang 'sasabihin,' gaya ng pagkakaiba ng mga pandiwa sa Hebreo.
- source_word: זְקֵנֶיךָ
  choice: ang mga nakatatanda sa inyo
  rationale: Tumutukoy sa matatandang may karanasan at kinikilalang katayuan sa pamayanan, hindi lamang sa matatandang lalaki bilang paglalarawang biyolohikal.
- source_word: וְיֹאמְרוּ לָךְ
  choice: at sasabihin nila sa iyo
  rationale: Pinananatili ang karaniwang kahulugan ng אמר at ang bahagyang baryasyon mula sa naunang נגד.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang paglipat sa Hebreo mula sa isahang pautos na “Alalahanin mo” tungo sa maramihang “pag-isipan ninyo,” at pagkatapos ay pabalik sa isahan sa “Tanungin mo.” Inulit ang “tanungin mo” sa ikalawang linya para maging malinaw at natural ang elipsis sa Filipino.
