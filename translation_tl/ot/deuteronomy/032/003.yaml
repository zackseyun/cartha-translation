  text: כִּ֛י שֵׁ֥ם יְהוָ֖ה אֶקְרָ֑א הָב֥וּ גֹ֖דֶל לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: tl
  text: Sapagkat ipahahayag ko ang pangalan ni Yahweh[a]; iukol ninyo ang kadakilaan sa ating Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “YHWH”; tradisyonal na isinasaling “ang PANGINOON.” Kabilang sa mga alternatibong transliterasyon ang “Yahweh” at “Jehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang ugnayang nagbibigay-batayan o dahilan sa konteksto ng awit.
- source_word: שֵׁם
  choice: pangalan
  rationale: Tuwirang katumbas na nagpapanatili sa diwa ng nahayag na pagkakakilanlan at reputasyon, nang hindi ito ipinapaliwanag nang lampas sa teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang Tetragrammaton bilang personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: אֶקְרָא
  choice: ipahahayag ko
  rationale: Sa konteksto ng pampublikong pag-awit, ipinahihiwatig ng קרא ang hayagang pagpapahayag ng pangalan; ang aspektong panghinaharap ay natural sa Filipino.
- source_word: הָבוּ
  choice: kilalanin ninyo
  rationale: Isinasalin ang pangmaramihang pautos bilang pagkilala o pag-uukol sa Diyos ng kadakilaang nauukol sa kanya, hindi bilang literal na pagbibigay sa kanya ng isang bagay na wala pa siya.
- source_word: גֹדֶל
  choice: kadakilaan
  rationale: Tuwirang katumbas ng pangngalang tumutukoy sa pagiging dakila o mataas.
- source_word: לֵאלֹהֵינוּ
  choice: ng ating Diyos
  rationale: Sa natural na pariralang Filipino na “kilalanin ang kadakilaan ng,” ang ugnayang nakatuon sa Diyos na ipinahihiwatig ng ל ay malinaw na napapanatili, kasama ang unang panauhang pangmaramihang hulapi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Tahasan sa Hebreo ang apat na titik na banal na pangalan. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na tahimik itong palitan ng titulo, habang inilalahad sa talababa ang tradisyonal na salin.
- issue: Kahulugan ng pag-uutos na הָבוּ גֹדֶל
  choice: kilalanin ninyo ang kadakilaan
  alternative: iukol ninyo ang kadakilaan; ibigay ninyo ang kadakilaan
  rationale: Ipinahihiwatig ng parirala ang pagkilala at pagpupuri sa kadakilaan ng Diyos. Iniiwasan ng “kilalanin” ang maling pahiwatig na mga tao ang lumilikha o nagdaragdag sa kadakilaan ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang ugnayang lohikal, at ang “kilalanin ninyo” bilang natural na pangmaramihang pautos sa konteksto ng pagpupuri.
