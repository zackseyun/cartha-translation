  yaml_path: translation/ot/deuteronomy/032/034.yaml
  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: tl
  text: Hindi ba ito ay nakatago sa akin,[a] nakaselyo sa aking mga imbakan?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakaimbak sa akin.”
    reason: lexical_alternative
  - marker: b
    text: O “sa aking mga kabang-yaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Pinananatili ang anyong retorikal na tanong na umaasang sasang-ayunan.
- source_word: הוּא
  choice: ito'y
  rationale: Tumutukoy nang di-personal sa naunang bagay o usapin, habang hindi tiyak na nilulutas ang eksaktong tinutukoy.
- source_word: כָּמֻס
  choice: nakatago
  rationale: Tuwirang ipinahahayag ang isang bagay na ikinubli o itinabi; likas ito sa modernong Tagalog at pinananatili ang diwa ng pag-iingat.
- source_word: עִמָּדִי
  choice: sa piling ko
  rationale: Likas at marangal na pagsasalin ng ideyang 'kasama ko' o nasa sariling pag-iingat ng nagsasalita.
- source_word: חָתֻם
  choice: nakatatak
  rationale: Ipinapahiwatig na ang bagay ay sinelyuhan at tiniyak; iniiwasan ang hiram na salitang 'selyado' sa pangunahing teksto.
- source_word: בְּאוֹצְרֹתָי
  choice: sa aking mga imbakan
  rationale: Pinananatili ang maramihang anyo at ang larawan ng mga lugar na pinag-iimbakan, nang hindi nililimitahan sa salapi o kayamanan.
theological_decisions:
- issue: Ang tinutukoy ng bagay na nakatago at nakatatak
  choice: Di-personal na “ito,” na bumubuod sa naunang usapin nang hindi tinutukoy nang eksakto kung ito ay tala ng pagkakasala, hatol, o ibang bagay na inilaan
  alternative: Personal na “siya,” o demonstratibong “ito” na tahasang ipinaliliwanag bilang nakalaang paghuhukom
  rationale: Bagaman panlalaking isahan ang panghalip sa Hebreo, maaaring di-personal ang gamit nito. Pinananatili ng “ito” ang kalabuan ng antecedent at hindi nagpapasok ng tiyak na interpretasyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at bahagyang makatang himig. Ginamit ang “sa piling ko” sa halip na mas payak na “kasama ko” upang ipahayag ang pag-iingat o kustodiya nang hindi labis na nagpapaliwanag. Ang mga pananda ng talababa [a] at [b] ay kapwa nasa pangunahing teksto.
