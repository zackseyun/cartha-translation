  to: Nang ibigay ng Kataas-taasan sa mga bansa ang kanilang mana, nang paghiwalayin niya ang mga anak ng tao[b], itinakda niya ang mga hangganan ng mga bansa ayon sa bilang ng mga anak ni Israel[a].
  rationale: Inilipat ang anchor a sa “mga anak ni Israel” upang tumpak na ituro ang variant na tinatalakay ng talababa. Pinasimple ang pandiwa sa “paghiwalayin” para sa mas tuwirang pagtutugma sa Hebreo, at ginawang “mga bansa” ang עַמִּים upang maiwasan ang modernong kahulugang lokal ng “mga bayan.” Hindi binago ang Masoretikong pangunahing pagbasa o ang maingat na paglalahad ng variant.
