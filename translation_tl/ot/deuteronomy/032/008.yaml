  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּ/הַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם בְּ/הַפְרִיד֖/וֹ בְּנֵ֣י אָדָ֑ם יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים לְ/מִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: tl
  text: Nang ibigay ng Kataas-taasan sa mga bansa ang kanilang mana, nang paghiwalayin niya ang mga anak ng tao[b], itinakda niya ang mga hangganan ng mga bansa ayon sa bilang ng mga anak ni Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mga anak ng Diyos” (o “mga anghel ng Diyos”) ang mababasa sa Dead Sea Scrolls at sa Septuagint sa halip na “mga anak ni Israel.”
    reason: textual_variant
  - marker: b
    text: Ang “mga anak ng tao” ay ekspresyong Hebreo na tumutukoy sa mga tao o sa sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הַנְחֵל
  choice: Nang ibigay ... ang kanilang mana
  rationale: Ang Hiphil infinitive construct na may בְּ ay bumubuo ng sugnay na panahunan. Ipinahahayag ng salin ang pagbibigay o pagtatalaga ng mana sa mga bansa sa natural na Tagalog.
- source_word: עֶלְיוֹן
  choice: ang Kataas-taasan
  rationale: Banal na titulo ito. Ang “Kataas-taasan” ay dignified at karaniwang katumbas sa Tagalog nang hindi dinaragdagan ang kahulugan.
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa sari-saring bansa o pangkat ng daigdig, hindi sa mas huling teknikal na diwa ng “mga Hentil.”
- source_word: בְּ/הַפְרִיד/וֹ
  choice: nang paghiwa-hiwalayin niya
  rationale: Isa rin itong sugnay na panahunan; ang pandiwang causative ay tumutukoy sa pagkakahiwalay o pagkakahati-hati ng sangkatauhan.
- source_word: בְּנֵי אָדָם
  choice: mga anak ng tao
  rationale: Pinananatili nito ang anyong patula at tahasang larawang Hebreo, habang nililinaw sa talababa na tumutukoy ito sa mga tao o sa sangkatauhan.
- source_word: יַצֵּב
  choice: itinakda niya
  rationale: Ipinahahayag ng Hiphil ng יצב ang matatag at tiyak na pagtatatag o paglalagay; natural sa Tagalog ang “itinakda” para sa mga hangganan.
- source_word: גְּבֻלֹת עַמִּים
  choice: mga hangganan ng mga bayan
  rationale: Ang “mga hangganan” ay angkop sa paghahati ng teritoryo, at ang “mga bayan” ay nagpapakita ng mga pangkat ng tao nang hindi inuulit ang “mga bansa.”
- source_word: לְ/מִסְפַּר
  choice: ayon sa bilang ng
  rationale: Ipinahahayag ng parirala ang pagtutugma o pagsukat batay sa bilang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tuwirang sinusunod nito ang pagbasa ng ibinigay na tekstong Masoretiko, בני ישראל, at pinananatili ang ugnayang pampamilya ng parirala.
theological_decisions:
- issue: Pagkakaiba ng tekstuwal na pagbasa sa huling sugnay
  choice: mga anak ni Israel
  alternative: mga anak ng Diyos / mga anghel ng Diyos
  rationale: Ang ibinigay na WLC ay nagbabasa ng בני ישראל, kaya ito ang nasa pangunahing teksto. Gayunman, mahalaga sa pagpapakahulugan ang sinaunang variant na pinatutunayan ng Dead Sea Scrolls at ng Septuagint, kaya inilalahad ito sa talababa sa halip na tahimik na lutasin.
- issue: Saklaw ng ekspresyong בני אדם
  choice: mga anak ng tao
  alternative: sangkatauhan / mga tao
  rationale: Pinananatili ng pangunahing teksto ang konkretong ekspresyong Hebreo at ang patulang pagkakatugma nito, habang ipinakikita ng talababa ang malawak at kinatawang kahulugan nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang balanseng patula ng dalawang sugnay na nagsisimula sa “Nang,” gayundin ang konkretong mga ekspresyong “mga anak ng tao” at “mga anak ni Israel.”
