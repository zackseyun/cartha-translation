  yaml_path: translation/ot/deuteronomy/032/016.yaml
  text: They made him jealous with strangers[a]; with abominations they provoked him to anger.
translation:
  language: tl
  text: Pinukaw nila ang kanyang paninibugho sa pamamagitan ng mga banyaga[a]; ginalit nila siya sa pamamagitan ng mga kasuklam-suklam na bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga banyagang diyos” o “mga diyos ng ibang bayan.” Literal sa Hebreo: “mga banyaga” o “mga dayuhan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: Pinanibugho nila siya
  rationale: Ipinapakita nito ang causative na diwa ng Hiphil ng קנא at pinananatili ang matinding wikang tipan tungkol sa paninibugho ng Diyos.
- source_word: בְּזָרִים
  choice: dahil sa mga banyaga
  rationale: Ang זָרִים ay literal na ‘mga banyaga’ o ‘mga dayuhan.’ Hindi tahasang nakasulat ang ‘mga diyos,’ kaya pinanatili sa pangunahing teksto ang tunay na kalabuan; ipinapaliwanag sa talababa ang kahulugang ipinahihiwatig ng konteksto.
- source_word: בְּתוֹעֵבֹת
  choice: sa pamamagitan ng mga kasuklam-suklam na bagay
  rationale: Ang תוֹעֵבֹת ay tumutukoy sa mga bagay na lubhang kasuklam-suklam, lalo na sa konteksto ng idolatriya. Natural ito sa makabagong Filipino nang hindi pinahihina ang bigat ng salita.
- source_word: יַכְעִיסֻהוּ
  choice: ginalit nila siya
  rationale: 'Tumpak at natural na ipinahahayag nito ang causative na diwa ng Hiphil ng כעס: sila ang nag-udyok ng kanyang galit.'
theological_decisions:
- issue: Kung tahasang idaragdag ang ‘mga diyos’ bilang tinutukoy ng זָרִים
  choice: Panatilihin ang literal na ‘mga banyaga’ sa pangunahing teksto
  alternative: mga banyagang diyos / mga diyos ng ibang bayan
  rationale: Idolatriya ang malinaw na konteksto, ngunit walang tahasang salitang ‘mga diyos’ sa Hebreo. Pinananatili ng salin ang anyo at kalabuan ng pinagmulan habang inilalahad sa talababa ang malamang na kontekstuwal na kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘Pinanibugho’ upang panatilihin ang wikang tipan, at ang ‘mga kasuklam-suklam na bagay’ upang maging malinaw at natural ang pangmaramihang abstraktong pangngalan.
