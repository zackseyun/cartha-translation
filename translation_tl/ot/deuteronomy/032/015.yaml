  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ן יְשֻׁרוּן֙ וַ/יִּבְעָ֔ט שָׁמַ֖נְתָּ עָבִ֣יתָ כָּשִׂ֑יתָ וַ/יִּטֹּשׁ֙ אֱל֣וֹהַ עָשָׂ֔/הוּ וַ/יְנַבֵּ֖ל צ֥וּר יְשֻׁעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: tl
  text: 'Ngunit tumaba si Jeshurun at sumipa;

    tumaba ka, kumapal, at namintog[a].

    Tinalikuran niya ang Diyos na gumawa sa kanya,

    at hinamak ang Bato ng kanyang kaligtasan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nababalot ng taba” o “namamaga sa katabaan.” Bihira ang salitang Hebreo, kaya hindi tiyak ang eksaktong diwa nito, ngunit malinaw ang larawan ng labis na katabaan dahil sa kasaganaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: Jeshurun
  rationale: Pinanatili bilang pantanging pangalan o bansag sa Israel upang hindi agad paliitin sa isang interpretasyong gaya ng “Matuwid” o palitan lamang ng “Israel.”
- source_word: וַיִּשְׁמַן / שָׁמַנְתָּ
  choice: tumaba / tumaba ka
  rationale: Pinananatili ang kongkretong larawan ng labis na kasaganaan at ang biglang paglipat ng Hebreo mula sa pagsasalaysay tungo sa tuwirang pakikipag-usap.
- source_word: וַיִּבְעָט
  choice: sumipa
  rationale: Literal at malinaw ang larawan ng isang hayop na, matapos mapakain nang sagana, ay sumisipa; hindi ito pinalabnaw bilang “naghimagsik.”
- source_word: עָבִיתָ
  choice: lumapad
  rationale: Ipinagpapatuloy nito sa likas na Tagalog ang pisikal na larawan ng pagtaba at paglaki; mas madaling maunawaan kaysa sa literal ngunit matigas na “kumapal.”
- source_word: כָּשִׂיתָ
  choice: namintog
  rationale: Ang bihirang salitang Hebreo ay tila nagpapatingkad sa labis na katabaan o pagkabusog. Ang “namintog” ay natural at masining sa Tagalog, habang inilalahad sa talababa ang kawalan ng katiyakan at ibang posibleng diwa.
- source_word: וַיִּטֹּשׁ
  choice: tinalikuran
  rationale: Malinaw at marangal na modernong Tagalog para sa pag-iwan o pagtatakwil sa Diyos, at angkop sa diwa ng pagtataksil sa tipan.
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: ang Diyos na gumawa sa kanya
  rationale: Pinananatili ang payak na pandiwang “gumawa” at ang kayariang sugnay ng Hebreo nang hindi ipinapasok ang mas tiyak na terminong “lumalang.”
- source_word: וַיְנַבֵּל
  choice: hinamak
  rationale: Maikli at natural na ipinahahayag ang aktibong paglapastangan o pagtrato nang may paghamak.
- source_word: צוּר
  choice: ang Bato
  rationale: Pinananatili ang mahalagang banal na metapora sa Awit ni Moises; ang malaking titik ay nagpapakitang tumutukoy ito sa Diyos.
- source_word: יְשׁוּעָתוֹ
  choice: kanyang kaligtasan
  rationale: Saklaw ng “kaligtasan” ang pagliligtas na mula sa Diyos at pinananatili nito ang bigat ng metaporang “Bato ng kanyang kaligtasan.”
theological_decisions:
- issue: Paglipat mula sa ikatlong panauhan tungo sa ikalawang panauhan at pabalik
  choice: Pinanatili ang “si Jeshurun … tumaba ka … niya.”
  alternative: Gawing pawang ikatlong panauhan ang mga sugnay.
  rationale: Ang pagbabago ng panauhan sa Hebreo ay nagbibigay-diin sa tuwirang paratang at hindi dapat pakinisin o alisin.
- issue: Ang צוּר bilang metapora at katawagan sa Diyos
  choice: “ang Bato” na may malaking titik
  alternative: “ang bato” na karaniwang pangngalan lamang
  rationale: Sa Deuteronomio 32, paulit-ulit itong katawagan sa Diyos. Ipinakikita ng malaking titik ang gamit nito rito nang hindi inaalis ang metapora.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matitingkad na pisikal na larawan at ang poetikong paghahanay ng mga sugnay. Ginamit ang “sumipa” sa halip na isang abstraktong paliwanag, at pinanatili ang “Jeshurun” bilang pangalan o bansag.
