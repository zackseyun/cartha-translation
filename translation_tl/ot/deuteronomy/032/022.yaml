source:
  edition: WLC
  text: כִּי אֵשׁ֙ קָדְחָ֣ה בְ/אַפִּ֔/י וַ/תִּיקַ֖ד עַד שְׁא֣וֹל תַּחְתִּ֑ית וַ/תֹּ֤אכַל אֶ֨רֶץ֙ וִֽ/יבֻלָ֔/הּ וַ/תְּלַהֵ֖ט מוֹסְדֵ֥י הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: tl
  text: 'Sapagkat may apoy na nagliyab sa aking galit,


    at nag-aalab hanggang sa kailaliman ng Sheol;[a]


    inuubos nito ang lupa at ang bunga nito,


    at tinutupok ang mga pundasyon ng mga bundok.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “hanggang sa pinakamababang Sheol” o “hanggang sa kailaliman ng daigdig ng mga patay.” Sa Hebreo: “hanggang sa Sheol na pinakamalalim.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan o paliwanag sa naunang pahayag ng paghatol at likas ang ugnayang ito sa makabagong Tagalog.
- source_word: אֵשׁ קָדְחָה
  choice: may apoy na nagliyab
  rationale: Ipinananatili ng “nagliyab” ang diwa ng apoy na nagsimula at patuloy na nag-aalab, nang hindi ginagawang tahasang balintiyak ang Hebreo.
- source_word: בְאַפִּי
  choice: sa aking galit
  rationale: Bagaman literal na kaugnay ng “ilong” ang אַף, karaniwang idyoma ito para sa galit; malinaw at marangal ang salin.
- source_word: וַתִּיקַד
  choice: at nag-aalab
  rationale: Ipinagpapatuloy nito ang larawan ng matinding apoy at natural ang pandiwang ito sa Tagalog.
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: hanggang sa kailaliman ng Sheol
  rationale: Pinananatili ang pangalang Sheol upang huwag agad ipakahulugan bilang impiyerno o libingan lamang; ipinahahayag ng “kailaliman” ang תַּחְתִּית.
- source_word: וַתֹּאכַל
  choice: inuubos nito
  rationale: Ang literal na “kinakain” ay metapora ng apoy; natural na naihahatid ng “inuubos” ang ganap na mapanirang bisa nito.
- source_word: אֶרֶץ
  choice: ang lupa
  rationale: Malawak ang saklaw ng larawan kasabay ng Sheol at mga pundasyon ng bundok; ang “lupa” ay maaaring tumukoy sa daigdig o lupain nang hindi sapilitang nilulutas ang lawak.
- source_word: יְבֻלָהּ
  choice: ang bunga nito
  rationale: Tumutukoy ito sa anumang ibinubunga o ani ng lupa; mas malawak at mas likas dito ang “bunga” kaysa “mga pananim.”
- source_word: וַתְּלַהֵט
  choice: at tinutupok
  rationale: Malakas at buhay na salita ito para sa paglamon o pagsunog ng apoy, na angkop sa pinaigting na larawan ng Hebreo.
- source_word: מוֹסְדֵי הָרִים
  choice: ang mga pundasyon ng mga bundok
  rationale: Malapit ito sa konkretong larawan ng pinakamalalim na saligan ng mga bundok.
theological_decisions:
- issue: Pagpapakahulugan sa שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay; impiyerno
  rationale: Ang Sheol ay tumutukoy sa larangan ng mga patay sa kaisipan ng Lumang Tipan. Ang pagpapanatili sa terminong Hebreo ay umiiwas sa napaagang pagtutumbas dito sa impiyerno o sa isang libingan lamang.
- issue: Saklaw ng אֶרֶץ
  choice: lupa
  alternative: daigdig; lupain
  rationale: Pinananatili ng “lupa” ang posibleng malawak o mas tiyak na saklaw ng Hebreo sa halip na sapilitang piliin ang kosmikong “daigdig” o lokal na “lupain.”
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang matinding patulang larawan at ang terminong “Sheol.” Ang mga paghahati ng linya ay sumasalamin sa paralelismo ng tulang Hebreo.
