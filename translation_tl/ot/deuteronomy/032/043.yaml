base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: tl
  text: Magalak[a] kayo, mga bansa, kasama ng kanyang bayan, sapagkat ipaghihiganti niya ang dugo ng kanyang mga lingkod[b]; ipapataw niya ang paghihiganti sa kanyang mga kaaway, at gagawa siya ng pagtubos para sa kanyang lupain at sa kanyang bayan[d][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Umawit kayo sa galak” o “Sumigaw kayo sa tuwa.” Maaaring tumukoy ang pautos sa Hebreo sa masiglang pag-awit o pagsigaw ng pagbubunyi.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang dugo ng kanyang mga lingkod”; maaari ring mangahulugan ang salitang isinaling “mga lingkod” na “mga alipin” sa ibang konteksto.
    reason: lexical_alternative
  - marker: c
    text: May mas mahabang anyo ng talatang ito sa Septuagint na Griego at sa isang balumbon mula sa Dagat na Patay. Kabilang dito ang karagdagang mga panawagan sa kalangitan at mga banal na nilalang na magalak, at sa mga bansa na sumamba sa kanya. Sinusunod ng pangunahing teksto rito ang Masoretikong Hebreo.
    reason: textual_variant
  - marker: d
    text: O “lilinisin niya” o “aalisan niya ng dungis ang kanyang lupain at ang kanyang bayan.” Maaaring bigyang-diin ng pandiwang Hebreo ang pagtubos o ang paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Magalak
  rationale: Ang maramihang pautos mula sa רנן ay tumutukoy sa masiglang pagbubunyi. Likas at marangal sa Tagalog ang “magalak,” habang inilalahad sa talababa ang maaaring diin sa pag-awit o pagsigaw sa tuwa.
- source_word: גוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga bansa bilang pangkalahatang kolektibo; iniiwasan ng saling ito ang kulay-Bagong Tipan na maaaring idulot ng “mga Hentil.”
- source_word: עַמּוֹ
  choice: kasama ng kanyang bayan
  rationale: 'Maikli at sintaktikong siksik ang Hebreo. Ang pagdaragdag ng “kasama ng” ay nagpapahayag ng malamang na ugnayan: inaanyayahan ang mga bansa na makigalak sa kanyang bayan.'
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng panawagang magalak.
- source_word: דַם עֲבָדָיו
  choice: ang dugo ng kanyang mga lingkod
  rationale: Maaaring mangahulugan ang עבד ng lingkod o alipin. Mas angkop dito ang “mga lingkod” dahil ang diin ay nasa kanilang kaugnayan sa Diyos at sa dugong ibinubo.
- source_word: יִקּוֹם
  choice: ipaghihiganti niya
  rationale: Sa kaugnayan nito sa dugo, ipinahihiwatig ng נקם ang paggagawad ng paghihiganti dahil sa dugong ibinubo.
- source_word: וְנָקָם יָשִׁיב
  choice: gagantihan niya ng paghihiganti
  rationale: Pinananatili nito ang tahasang pangngalang “paghihiganti” at ang diwa ng pagbabalik o pagganti sa ישיב, nang hindi pinagsasama ang dalawang yunit ng Hebreo.
- source_word: לְצָרָיו
  choice: ang kanyang mga kaaway
  rationale: Ang צרים ay mga kalabang kumikilos nang may poot. Natural at malinaw sa modernong Tagalog ang “mga kaaway.”
- source_word: וְכִפֶּר
  choice: gagawa siya ng pagtubos para sa
  rationale: Pinananatili ng “pagtubos” ang expiatoryong bigat ng כפר, samantalang kinikilala sa talababa ang maaaring diin nito sa paglilinis o pag-aalis ng dungis.
- source_word: אַדְמָתוֹ
  choice: kanyang lupain
  rationale: Ang “lupain” ang natural na katumbas ng אדמה sa pambansa at tipanang konteksto.
- source_word: עַמּוֹ
  choice: kanyang bayan
  rationale: Pinananatili nang tuwiran ang pangwakas na pagtukoy sa bayang pag-aari niya.
theological_decisions:
- issue: Ugnayan ng “mga bansa” at “kanyang bayan” sa pambungad na taludtod
  choice: Inaanyayahan ang mga bansa na magalak kasama ng bayan ng Diyos.
  alternative: Purihin ng mga bansa ang kanyang bayan; o sundin sa pangunahing teksto ang mas mahabang anyo ng Septuagint at isang balumbon mula sa Dagat na Patay.
  rationale: Siksik ang Masoretikong Hebreo, ngunit ang “kasama ng” ang pinaka-malamang na paglilinaw sa sintaks. Hindi isinasama sa pangunahing teksto ang mga dagdag na sugnay ng ibang tradisyong tekstuwal.
- issue: Kahulugan ng כפר sa pangwakas na sugnay
  choice: Gagawa ang Diyos ng pagtubos para sa kanyang lupain at bayan.
  alternative: Lilinisin o aalisan niya ng dungis ang kanyang lupain at bayan.
  rationale: Pinananatili ng pangunahing salin ang bigat ng pagpapalubag-sala o expiation nang hindi ipinapasok ang isang partikular na sistematikong paliwanag; inilalahad sa talababa ang purgatibong diwa.
- issue: Tagaganap ng mga kilos sa ikalawang bahagi ng talata
  choice: Ang Diyos ang ipinahihiwatig na tagaganap ng paghihiganti, pagganti, at pagtubos.
  alternative: Walang tahasang pangngalang paksa sa Hebreo sa bawat sugnay.
  rationale: Ipinagpapatuloy ng mga pandiwang pangatlong panauhan ang tinutukoy na Diyos sa awit; hindi dinaragdagan ang teksto ng isang banal na pangalan.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit, na angkop sa patulang awit. Pinili ang “mga bansa,” “bayan,” “mga lingkod,” at “lupain” bilang malinaw at karaniwang salitang biblikal. Sadyang pinanatili ang pag-uulit ng diwa ng paghihiganti upang katawanin ang magkaibang yunit ng Hebreo, at inilagay ang lahat ng marker [a]–[d] sa pangunahing teksto.
