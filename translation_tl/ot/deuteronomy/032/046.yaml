  to: At sinabi niya sa kanila, “Isapuso ninyo ang lahat ng salitang pinatototohanan ko sa inyo ngayon[a], na siya ninyong iuutos sa inyong mga anak na lalaki[b] na ingatan at tuparin ang lahat ng salita ng kautusang ito.”
  rationale: Ang rebisyon ay ibinabalik ang dalawang aspektong ipinahahayag ng לִשְׁמֹר לַעֲשׂוֹת sa pamamagitan ng “ingatan at tuparin,” at ginagawang malinaw na ang mga salitang pinatototohanan ni Moises ang siyang iuutos sa mga anak. Iningatan ang kasariang panlalaki sa pangunahing teksto at ang hindi lubos na matiyak na forensikong saklaw ng מֵעִיד בָּכֶם sa talababa.
