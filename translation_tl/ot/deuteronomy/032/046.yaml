base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Isapuso ninyo ang lahat ng salitang pinatototohanan ko sa inyo ngayon[a], na siya ninyong iuutos sa inyong mga anak na lalaki[b] na ingatan at tuparin ang lahat ng salita ng kautusang ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binabalaan ko kayo ngayon” o “nagpapatotoo ako laban sa inyo ngayon.” Sa konteksto ng tipan, maaaring taglayin ng pandiwang Hebreo ang diwa ng pagpapatotoo, taimtim na babala, o pagpapatotoo laban sa kausap.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “mga anak na lalaki”; maaari itong kumatawan nang mas malawak sa susunod na salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Isapuso ninyo
  rationale: Likas na idyomang Tagalog ito para sa taimtim na pagbibigay-pansin at matibay na pagpapasya; napapanatili rin nito ang larawang Hebreo tungkol sa puso.
- source_word: הַדְּבָרִים / דִּבְרֵי
  choice: mga salita / salita
  rationale: Tumutukoy ang דָּבָר sa mga ipinahayag na salita o tagubilin ng tipan, at inuulit ang terminong ito sa hulihan ng talata.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: pinatototohanan ko sa inyo ngayon
  rationale: Pinananatili ng 'pinatototohanan' ang pormal na diwa ng pagpapatotoo, habang ang talab nitong babala o sakdal sa konteksto ng tipan ay inilalahad sa talababa.
- source_word: אֲשֶׁר תְּצַוֻּם
  choice: Iutos ninyo
  rationale: Ipinahahayag ang awtoritatibong pagpapasa ng mga salita sa susunod na salinlahi. Ang ugnayang may layunin sa konteksto ay naihahatid nang natural sa pagkakasunod ng mga pangungusap.
- source_word: בְּנֵיכֶם
  choice: inyong mga anak na lalaki
  rationale: Tahasang panlalaking maramihan ang Hebreo; pinananatili ito sa pangunahing teksto, habang binabanggit sa talababa ang posibleng mas malawak na pagtukoy sa susunod na salinlahi.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: maingat na tuparin
  rationale: Sa Tagalog, likas na pinagsasama ng pariralang ito ang masusing pag-iingat o pagsunod at ang aktuwal na pagsasagawa, nang hindi nagiging mabigat ang literal na dalawang pandiwa.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: kautusang ito
  rationale: Bagaman maaari ring mangahulugang 'tagubilin' ang תּוֹרָה, ang 'kautusan' ang malinaw at nakaugaliang salita sa kontekstong tipan ng Deuteronomio.
theological_decisions:
- issue: Forensikong diwa ng מֵעִיד בָּכֶם
  choice: pinatototohanan ko sa inyo ngayon
  alternative: binabalaan ko kayo ngayon; ginagawa kong saksi laban sa inyo ngayon
  rationale: May saklaw ang pandiwa mula sa pagpapatotoo hanggang sa taimtim na pagbababala o pagharap bilang saksi. Hindi tahasang nilulutas ng pangunahing teksto ang tensiyong ito; iniingatan sa talababa ang ibang mga diwa.
- issue: Kasariang tinutukoy ng בְּנֵיכֶם
  choice: inyong mga anak na lalaki
  alternative: inyong mga anak
  rationale: Panlalaking maramihan ang anyong Hebreo. Pinananatili ng pangunahing teksto ang tiyak na anyo, ngunit kinikilala ng talababa na maaari nitong katawanin ang susunod na salinlahi sa mas malawak na diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'isapuso' bilang likas na katumbas ng idyomang Hebreo at iniwasan ang labis na literal ngunit mabigat na sintaks. Lumilitaw sa pangunahing teksto ang lahat ng panandang talababa.
