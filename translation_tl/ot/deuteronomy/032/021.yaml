base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: tl
  text: Pinukaw nila ang aking paninibugho sa isang hindi diyos; ginalit nila ako sa kanilang mga diyus-diyosan.[a] Kaya pupukawin ko ang kanilang paninibugho sa pamamagitan ng isang bayang hindi bayan;[b] gagalitin ko sila sa pamamagitan ng isang hangal na bansa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “sa kanilang mga walang-kabuluhang bagay” o “sa kanilang mga kahungkagan”; sa kontekstong ito, tumutukoy ito sa mga diyus-diyosan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “sa isang hindi-bayan.” Sadyang itinutulad ng Hebreo ang pariralang ito sa “isang hindi diyos.”
    reason: lexical_alternative
  - marker: c
    text: Ang “hangal” dito ay pangunahing tumutukoy sa moral at espirituwal na kamangmangan, hindi lamang sa kakulangan ng talino.
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי
  choice: Pinanibugho nila ako
  rationale: Pinananatili nito ang causative na diwa ng pandiwa at ang simetriya sa kasunod na “pananibughuin ko rin sila.”
- source_word: בְּלֹא אֵל
  choice: sa hindi diyos
  rationale: Tuwirang pinananatili ang polemikong pahayag na ang kanilang sinasamba ay hindi tunay na diyos, gayundin ang paralelismo sa “mga hindi bayan.”
- source_word: כִּעֲסוּנִי
  choice: ginalit nila ako
  rationale: Natural sa modernong Tagalog at malinaw na ipinahahayag ang causative na diwa ng pagpukaw ng galit.
- source_word: בְּהַבְלֵיהֶם
  choice: sa kanilang mga walang-kabuluhang diyus-diyosan
  rationale: Ipinahahayag kapwa ang kontekstuwal na reperensiya sa mga diyus-diyosan at ang literal na diwa ng הֶבֶל bilang kawalang-kabuluhan o kahungkagan.
- source_word: אַקְנִיאֵם
  choice: pananibughuin ko rin sila
  rationale: Pinananatili ang paghihiganting simetriya sa unang sugnay; nililinaw ng “rin” ang katumbas na tugon nang hindi nagdaragdag ng bagong kahulugan.
- source_word: בְּלֹא עָם
  choice: sa pamamagitan ng mga hindi bayan
  rationale: Pinananatili ang sadyang di-karaniwang paralelismo sa “hindi diyos” at hindi tinutukoy ang isang partikular na makasaysayang bansa.
- source_word: בְּגוֹי נָבָל
  choice: sa pamamagitan ng isang bansang hangal
  rationale: Direkta at malinaw ang “hangal,” habang ang talababa ay nagpapaliwanag na moral at espirituwal ang pangunahing diwa.
- source_word: אַכְעִיסֵם
  choice: gagalitin ko sila
  rationale: Inuulit nito nang natural ang causative na pandiwa sa unang hati at pinananatili ang estruktura ng tumbasang paghatol.
theological_decisions:
- issue: Tinutukoy ng “mga hindi bayan” at “bansang hangal”
  choice: Isinalin nang pangkalahatan at hindi kinilala bilang isang partikular na bansa o pangkat.
  alternative: Tukuyin bilang isang tiyak na bansang Hentil o bilang lahat ng mga Hentil.
  rationale: Hindi tinutukoy ng Hebreo kung aling bansa ang ibig sabihin; pinananatili ng pangkalahatang salin ang tunay na kalabuan at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pananibugho” upang mapanatili ang mahalagang pag-uulit at simetriya ng Hebreo. Iniwasang tukuyin ang “hindi bayan” bilang isang partikular na bansa o bilang mga Hentil upang hindi ipasok sa pangunahing teksto ang isang interpretasyong hindi tahasang sinasabi ng talata.
