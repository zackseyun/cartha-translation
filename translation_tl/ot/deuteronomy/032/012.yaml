base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/012.yaml
  text: Yahweh alone led him[a], and no foreign god was with him.
translation:
  language: tl
  text: Si Yahweh lamang ang pumatnubay sa kanya[a]; walang diyos na dayuhan na kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umakay sa kanya.” Ang pandiwang Hebreo ay maaaring mangahulugang umakay o pumatnubay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בָּדָד
  choice: lamang
  rationale: Sa pariralang “Si Yahweh lamang,” malinaw at likas na ipinahahayag na si Yahweh ang kumilos nang walang katuwang.
- source_word: יַנְחֶנּוּ
  choice: pumatnubay sa kanya
  rationale: Ang Hiphil ng נחה ay nangangahulugang umakay o pumatnubay. Ang “pumatnubay” ay angkop sa paggabay ni Yahweh sa Israel sa konteksto ng awit; pinananatili ng “kanya” ang panlalaking isahang hulapi na tumutukoy sa Israel/Jacob bilang isang katauhang kolektibo.
- source_word: וְאֵין
  choice: walang
  rationale: Likas na isinasalin ng “walang” ang negatibong eksistensiyal na pahayag sa Filipino.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Ipinahahayag nito ang pakikisama o presensiya at pinananatili ang panlalaking isahang panghalip ng Hebreo.
- source_word: אֵל נֵכָר
  choice: ibang diyos
  rationale: Sa konteksto, tumutukoy ito sa isang diyos na iba o dayuhan kay Yahweh. Mas natural sa modernong Filipino ang “ibang diyos,” habang pinananatili ang pagtutol sa idolatriya.
theological_decisions:
- issue: Tinutukoy ng isahang panghalip sa “pumatnubay sa kanya” at “kasama niya”
  choice: Pinanatili ang isahang “kanya/niya,” na tumutukoy sa Israel/Jacob bilang kolektibong katauhan.
  alternative: Gamitin ang maramihang “kanila” upang tahasang tukuyin ang buong bansa.
  rationale: Panlalaking isahan ang mga hulapi sa Hebreo, at inilalarawan sa kalapit na konteksto ang Israel/Jacob bilang isang katauhang kolektibo. Ang pagpapanatili sa isahan ay hindi nagpapawi sa anyo at teolohikal na larawan ng pinagmulan.
- issue: Kahulugan ng אֵל נֵכָר
  choice: “ibang diyos”
  alternative: “diyos na dayuhan”
  rationale: Maaaring tumukoy ang נֵכָר sa pagiging banyaga o iba. Ang “ibang diyos” ay natural at malinaw sa Filipino at hindi nililimitahan ang diwa sa etnikong pagkamamamayan ng sumasamba.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “Si Yahweh lamang” para sa likas na diin, at pinanatili ang isahang panghalip ng Hebreo. Ang tuldok-kuwit ay nagpapakita ng malapit na ugnayan ng dalawang magkatimbang na sugnay.
