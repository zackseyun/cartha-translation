  source_fidelity: 'Tapat ang salin sa Hebreo: ang “Sinabi ko” ay wastong pagsasalin ng אָמַרְתִּי; ang “Ikakalat ko sila” ay isang maingat at malinaw na pagpili para sa bihira at pinagtatalunang אַפְאֵיהֶם; at ang “papawiin ko sa sangkatauhan ang alaala nila” ay naihahatid ang sanhiang diwa ng אַשְׁבִּיתָה at ang kolektibong saklaw ng מֵאֱנוֹשׁ. Napananatili rin ang paralelismo at ang ipinahayag na layunin sa hinaharap nang hindi ipinipilit ang isang counterfactual na pagbasa.'
