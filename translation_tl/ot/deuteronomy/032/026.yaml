base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: tl
  text: Sinabi ko, “Ikakalat ko sila[a]; papawiin ko sa sangkatauhan[b] ang alaala nila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itataboy ko sila,” “papangalatin ko sila,” o “tangayin ko sila.” Bihira at mahirap tiyakin ang pandiwang Hebreo; inuunawa rin ito ng ilan bilang pagtataboy sa kanila sa mga sulok o pag-aalis sa kanila sa paningin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa mga tao” o “sa mga mortal.” Isahang kolektibong katawagan para sa mga tao ang ginamit sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Sinabi ko
  rationale: Tuwirang salin ng Qal perfect, unang panauhang isahan ng אמר, na nagpapakilala sa ipinahayag na layunin ng Diyos sa tula.
- source_word: אַפְאֵיהֶם
  choice: Ikakalat ko sila
  rationale: Bihira at mahirap tiyaking anyo ang pandiwang Hebreo. Ang “ikakalat” ay malinaw sa modernong Tagalog at naipapahayag ang banta ng pagpapangalat nang hindi labis na nililimitahan ang posibleng larawan ng pagtataboy sa mga sulok o pag-aalis sa paningin.
- source_word: אַשְׁבִּיתָה
  choice: papawiin ko
  rationale: Ang Hiphil ng שבת ay nangangahulugang magpangyaring tumigil o mawala. Kapag ang layon ay “alaala,” likas sa Tagalog ang “papawiin,” na naghahatid ng ideya ng pag-aalis sa pag-alaala.
- source_word: מֵאֱנוֹשׁ
  choice: sa sangkatauhan
  rationale: Ang אֱנוֹשׁ ay kolektibong katawagan sa mga tao at maaari ring magpahiwatig ng pagiging mortal. Ang “sangkatauhan” ay natural at nagpapanatili sa kolektibong diwa.
- source_word: זִכְרָם
  choice: ang alaala nila
  rationale: Ang זכר ay tumutukoy sa alaala o pag-alaala. Ang “alaala nila” ay maikli, natural, at tumutukoy sa pagkawala nila sa gunita ng mga tao.
theological_decisions:
- issue: Ang banal na pananalita at bantang paghatol sa anyong patula
  choice: 'Ipinahayag bilang layunin sa hinaharap: “Ikakalat ko… papawiin ko…”'
  alternative: 'Gumamit ng “sana”: “Ikakalat ko sana… papawiin ko sana…”'
  rationale: Walang hiwalay na anyong katumbas ng English na “would” sa Tagalog. Ang karaniwang panghinaharap pagkatapos ng “Sinabi ko” ay natural na nagpapahayag ng itinakdang layunin. Iniwasan ang “sana” dahil maaari nitong unahan ang paglilinaw ng kasunod na talata at gawing tahasang di-natupad ang layunin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at matinding paralelismo ng tulang Hebreo. Ginamit ang karaniwang panghinaharap upang natural na ipahayag ang ipinahayag na layunin nang hindi ipinapasok ang implikasyong counterfactual ng “sana.”
