  yaml_path: translation/ot/deuteronomy/032/019.yaml
  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: tl
  text: At nakita ni Yahweh at itinakwil niya sila dahil sa pagpukaw sa kanyang galit ng kanyang mga anak na lalaki at babae.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinamak niya sila” o “itinakwil niya sila nang may paghamak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang pangalan ng Diyos bilang Yahweh, ayon sa anyong tipan ng pangalang nasa tekstong Hebreo.
- source_word: וַיַּרְא
  choice: nakita
  rationale: Ang qal ng ראה ay karaniwang nangangahulugang “makita”; ang “nakita” ay payak at natural na pambungad sa tugon ni Yahweh.
- source_word: וַיִּנְאָץ
  choice: itinakwil niya sila
  rationale: Ipinahihiwatig ng נאץ ang pagtatakwil o paghamak. Nilinaw sa Tagalog ang di-binanggit na layon bilang “sila,” na tumutukoy sa bayan ayon sa konteksto.
- source_word: מִכַּעַס
  choice: dahil sa galit na dulot ng
  rationale: Ang כעס ay maaaring tumukoy sa pagkayamot o pagpukaw ng galit, at sanhi ang gamit ng מִן dito. Ang parirala ay natural sa Tagalog at pinananatili ang ugnayang sanhi.
- source_word: בָּנָיו וּבְנֹתָיו
  choice: kanyang mga anak na lalaki at babae
  rationale: Tahasang binabanggit ng Hebreo ang mga anak na lalaki at babae; pinanatili ito sa halip na gawing pangkalahatang “mga anak.”
theological_decisions:
- issue: Di-binanggit na layon ng וַיִּנְאָץ
  choice: Idinagdag ang “sila,” na tumutukoy sa Israel o sa kanyang bayan.
  alternative: 'Iwan ang layon na di-binanggit: “nakita ni Yahweh at itinakwil.”'
  rationale: Nangangailangan ng malinaw na layon ang natural na Tagalog sa ganitong gamit, at kinikilala ng konteksto ang bayan bilang tinutukoy nang hindi nagdaragdag ng bagong teolohikong pahayag.
- issue: Lakas ng paglalarawan sa hindi pagkalugod ng Diyos
  choice: “itinakwil” at “galit na dulot”
  alternative: “hinamak” o “kinasuklaman”
  rationale: Pinananatili ng “itinakwil” ang bigat ng hatol at pagkasira ng ugnayan, ngunit hindi nito labis na pinatitingkad ang נאץ. Ang huling parirala ay naghahayag ng tunay na galit habang iniiwasang alisin ang bahagyang kalabuan ng כעס sa pagitan ng galit at pagpukaw nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Yahweh” para sa banal na pangalan at pinanatili ang tahasang “mga anak na lalaki at babae.”
