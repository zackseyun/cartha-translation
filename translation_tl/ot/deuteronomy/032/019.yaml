- from: At nakita ni Yahweh, at itinakwil niya sila dahil sa galit na dulot ng kanyang mga anak na lalaki at babae.[a]
  to: At nakita ni Yahweh at itinakwil niya sila dahil sa pagpukaw sa kanyang galit ng kanyang mga anak na lalaki at babae.[a]
  rationale: Pinalitan ang malabong “galit na dulot ng” ng “pagpukaw sa kanyang galit” upang maipakita ang sanhi ng banal na galit na ipinahihiwatig ng konstruksyong Hebreo. Pinanatili ang di-binanggit na layon na “sila,” ang pangalang Yahweh, at ang tahasang pagtukoy sa mga anak na lalaki at babae. Inayos ang talababa upang manatili sa saklaw ng kahulugan ng נאץ.
