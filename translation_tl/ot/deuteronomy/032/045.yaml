  text: When Moses finished speaking all these words to all Israel,
translation:
  language: tl
  text: Nang matapos sabihin ni Moises ang lahat ng salitang ito sa buong Israel,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: Nang matapos
  rationale: Ang pandiwang mula sa כלה sa wayyiqtol ay nagsasaad na natapos ang kilos. Ang “Nang matapos” ay natural sa Tagalog at angkop sa pangungusap na nagpapatuloy sa kasunod na talata.
- source_word: לְדַבֵּר
  choice: sabihin
  rationale: Kasama ng כלה, bumubuo ito ng idyomang “matapos sabihin.” Mas natural ito sa modernong Tagalog kaysa “matapos magsalita” kapag may tuwirang layon na “ang lahat ng salitang ito.”
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ang lahat ng salitang ito
  rationale: Pinananatili ng “mga salitang ito” ang literal at diskursibong diwa ng דְּבָרִים, na tumutukoy sa naunang pahayag o awit, sa halip na palawakin ito bilang “mga bagay.”
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Ang “buong Israel” ay natural na kolektibong katawagan sa Tagalog at pinananatili ang Israel bilang sambayanan, nang hindi ito ipinapaliwanag bilang “lahat ng Israelita.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong Bibliyang Tagalog.
