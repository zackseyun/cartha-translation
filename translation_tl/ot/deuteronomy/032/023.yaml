translation:
  language: tl
  text: Ibubunton ko sa kanila ang mga kapahamakan[a]; uubusin ko sa kanila ang aking mga palaso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kalamidad”; literal na “mga kasamaan,” sa diwa ng mga kapahamakang dulot ng paghatol, hindi moral na kasamaan.
    reason: lexical_alternative
  - marker: b
    text: O “lubusan kong gagamitin sa kanila ang aking mga palaso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: Magpapatong-patong ako
  rationale: Ang pandiwa rito ay nagpapahiwatig ng pag-iipon o pagtatambak ng mga kapahamakan. Pinananatili ng “magpapatong-patong” ang larawan ng pagdami at pagkakaipon sa natural na Tagalog.
- source_word: עָלֵימוֹ
  choice: sa kanila
  rationale: Ipinapahayag ng parirala na ang mga kapahamakan ay ipapataw sa bayan; malinaw at natural sa Tagalog ang “sa kanila.”
- source_word: רָעוֹת
  choice: mga kapahamakan
  rationale: Sa konteksto ng paghatol, tumutukoy ito sa masasamang pangyayari o kalamidad, hindi sa moral na kasamaan. Ang “mga kapahamakan” ay marangal at malinaw na salin.
- source_word: חִצַּי
  choice: aking mga palaso
  rationale: Tuwirang pinananatili ang maramihang anyo at ang metaporang pandigma.
- source_word: אֲכַלֶּה
  choice: uubusin ko
  rationale: Ang anyo ng pandiwa ay nangangahulugang lubusang gugulin o gamitin. Sa mga palaso, natural na ipinahahayag ng “uubusin ko” ang ganap na paggamit sa mga ito.
- source_word: בָּם
  choice: laban sa kanila
  rationale: Ipinakikita rito ang mga taong pinatutungkulan ng mga palaso. Malinaw na naihahayag ng “laban sa kanila” ang mapanlabang direksiyon.
theological_decisions:
- issue: Pagpapakahulugan sa רָעוֹת sa konteksto ng paghatol ng Diyos
  choice: mga kapahamakan
  alternative: mga kasamaan; mga kalamidad
  rationale: Ang salita ay maaaring tumukoy sa masasamang bagay sa malawak na diwa, ngunit dito ay mga pinsalang dumarating bilang paghatol ang tinutukoy. Iniiwasan ng “mga kapahamakan” ang di-kinakailangang pahiwatig na moral na kasamaan ang ginagawa ng Diyos, habang pinananatili ang bigat ng paghatol.
translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Pinanatili ang larawan ng pagtatambak ng kapahamakan at ng pagkaubos ng mga palaso, ngunit inayos ang mga parirala upang maging malinaw at natural sa karaniwang mambabasa.
