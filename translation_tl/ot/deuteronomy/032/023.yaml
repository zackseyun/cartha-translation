  naturalness: Kailangang ayusin ang unang sugnay upang maging natural na makabagong Filipino. Ang “Ibubunton ko sa kanila ang mga kapahamakan” ay marangal, patula, at malinaw. Ang “Uubusin ko sa kanila ang aking mga palaso” ay nagpapanatili ng metapora at ng diwang gugugulin nang lubos ang mga palaso.
  terminology: Ang “mga kapahamakan” ay angkop para sa רָעוֹת sa konteksto ng paghatol at hindi nagpapahiwatig na moral na kasamaan ang tinutukoy. Ang “mga palaso” ay wastong literal na salin ng חִצַּי. Inilipat ang mga panandang talababa upang malinaw na tumukoy sa salitang may kaugnayang alternatibo.
