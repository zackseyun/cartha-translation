base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: tl
  text: At sinabi niya, “Itatago ko ang aking mukha sa kanila; titingnan ko kung ano ang magiging wakas nila, sapagkat sila ay isang salinlahing baluktot[a], mga anak na walang katapatan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang salinlahi ng mga kabaluktutan”; maaari ring isaling “isang salinlahing suwail.”
    reason: lexical_alternative
  - marker: b
    text: Ang “walang katapatan” ay maaari ring isaling “hindi mapagkakatiwalaan” o “walang pagiging tapat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: Ikukubli ko sa kanila ang aking mukha
  rationale: Pinananatili ang idyomang Hebreo tungkol sa pagkukubli ng mukha, na nagpapahiwatig ng pag-urong ng lingap o presensiya, sa halip na paliitin ito sa simpleng pagtalikod.
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: titingnan ko kung ano ang magiging wakas nila
  rationale: Ang אַחֲרִית ay maaaring tumukoy sa wakas o kahihinatnan. Ang “magiging wakas nila” ay marangal, malinaw, at malapit sa anyo ng Hebreo.
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: isang salinlahing baluktot
  rationale: Natural sa makabagong Filipino at naipapahayag ang moral na pagkalihis ng Hebreong pangngalang maramihan, bagaman hindi ginagaya nang mekanikal ang anyong “mga kabaluktutan.”
- source_word: בָּנִים
  choice: mga anak
  rationale: Tumutukoy ito sa bayan bilang mga anak at hindi kailangang limitahan sa mga lalaki lamang.
- source_word: לֹא אֵמֻן בָּם
  choice: mga anak na walang katapatan
  rationale: Ang אֵמֻן ay tumutukoy sa pagiging tapat, maaasahan, o mapagkakatiwalaan; ang “katapatan” ang pinakanatural na salitang may ugnayang tipan sa konteksto.
theological_decisions:
- issue: Antropomorpikong idyoma ng banal na “mukha”
  choice: Panatilihin ang “Ikukubli ko sa kanila ang aking mukha”
  alternative: Tatalikuran ko sila
  rationale: Pinananatili nito ang bigat ng idyomang tipan tungkol sa pag-urong ng lingap o presensiya ng Diyos nang hindi labis na ipinapaliwanag ang paraan nito.
- issue: Saklaw ng אֵמֻן
  choice: katapatan
  alternative: pagiging mapagkakatiwalaan
  rationale: Sa konteksto, ang paratang ay tungkol sa relasyonal at tipanang kawalan ng katapatan, hindi lamang sa kawalan ng paniniwala.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang idyomang “aking mukha,” ginamit ang “salinlahi” para sa דור, at iniwasan ang sobrang literal ngunit di-natural na “salinlahi ng mga kabaluktutan.” Ang marker [b] ay inilagay pagkatapos ng pangungusap na kinauukulan.
