revisions:
- from: Ganito ba ninyo gagantihan si Yahweh, kayong mangmang at hindi marunong? Hindi ba siya ang inyong Ama, na nag-angkin sa inyo?[a] Siya ang gumawa sa inyo at nagtatag sa inyo.
  to: Ganito ba ninyo gagantihan si Yahweh, kayong hangal at walang karunungan? Hindi ba siya ang inyong Ama, na kumuha sa inyo bilang kanyang pag-aari?[a] Siya ang gumawa sa inyo at nagpatatag sa inyo.
  rationale: The revision retains the source’s rhetorical question and lexical distinction between acquiring, making, and establishing. It replaces potentially misleading or unnatural Tagalog expressions with wording that is clear in modern Filipino Tagalog, without resolving the disputed sense of קנה beyond the draft’s acquisition-oriented reading.
