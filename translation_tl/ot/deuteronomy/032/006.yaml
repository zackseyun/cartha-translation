base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: tl
  text: Ganito ba ninyo gagantihan si Yahweh, kayong hangal at walang karunungan? Hindi ba siya ang inyong Ama, na kumuha sa inyo bilang kanyang pag-aari?[a] Siya ang gumawa sa inyo at nagpatatag sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na lumikha sa inyo” o “na bumili sa inyo.” Ang pandiwang Hebreo ay maaaring mangahulugang magtamo, magmay-ari, bumili, o, sa ilang konteksto, lumikha.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: gagantihan
  rationale: Ipinahahayag ng גמל ang pagganti o pagbabalik ng pakikitungo ayon sa ginawa ng isang tao. Sa mapanuyang tanong, natural na naihahatid ng “gagantihan” ang diwa ng maling tugon ng Israel kay Yahweh.
- source_word: זֹאת
  choice: ganito
  rationale: Tumutukoy ang demonstratibo sa paraan ng pagkilos ng Israel; mas natural sa tanong na Tagalog ang “Ganito ba...” kaysa sa literal na “Ito ba...”
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: kayong mangmang at hindi marunong
  rationale: Ang נָבָל ay moral at espirituwal na kamangmangan, hindi lamang kakulangan sa talino. Pinananatili ng “hindi marunong” ang tahasang negatibong anyo ng לֹא חָכָם at ang tuwirang pakikipag-usap sa bayan.
- source_word: הֲלוֹא
  choice: Hindi ba siya
  rationale: Pinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: אָבִיךָ
  choice: inyong Ama
  rationale: Tahasang inilalarawan ng teksto ang kaugnayan ni Yahweh sa Israel bilang Ama; ang malaking titik ay malinaw na tumutukoy sa Diyos.
- source_word: קָּנֶךָ
  choice: nag-angkin sa inyo
  rationale: Maaaring mangahulugan ang קנה ng nagtamo, nagmay-ari, bumili, o sa ilang konteksto ay lumikha. Ang “nag-angkin sa inyo” ay nagpapanatili sa diwa ng pagtatamo at pag-aari nang hindi inuulit ang kasunod na “gumawa.”
- source_word: עָשְׂךָ
  choice: gumawa sa inyo
  rationale: Tuwirang ipinahahayag ng עשה rito ang paggawa ni Yahweh sa Israel bilang bayan.
- source_word: וַיְכֹנְנֶךָ
  choice: nagtatag sa inyo
  rationale: Ipinahahayag ng כון ang pagtatatag, pagpapatibay, o paglalagay sa matatag na kalagayan. Natural na kaparis ng “gumawa sa inyo” ang “nagtatag sa inyo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng קנה kaugnay ng Diyos at Israel
  choice: na nag-angkin sa inyo
  alternative: na lumikha sa inyo; na bumili sa inyo
  rationale: Malawak ang saklaw ng pandiwa. Pinananatili ng “nag-angkin” ang pagkakaiba nito sa kasunod na mga pandiwang “gumawa” at “nagtatag,” habang inilalagay sa talababa ang tunay na mga alternatibo.
- issue: Pagkatawag sa Diyos bilang Ama ng Israel
  choice: inyong Ama
  alternative: inyong ama
  rationale: Tahasang tinatawag ng Hebreo si Yahweh na ama ng Israel. Ang malaking titik ay kumbensiyon lamang upang linawin ang banal na tinutukoy, hindi pagdaragdag ng doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pangmaramihang “ninyo/inyong/inyo” dahil ang kausap ay ang bayan. Iniwasan ang arkaikong “O bayan” at pinanatili ang mariing tuwirang pagsaway sa “kayong mangmang at hindi marunong.”
