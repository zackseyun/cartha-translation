  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי יָדִ֤ין יְהוָה֙ עַמּ֔/וֹ וְ/עַל עֲבָדָ֖י/ו יִתְנֶחָ֑ם כִּ֤י יִרְאֶה֙ כִּי אָ֣זְלַת יָ֔ד וְ/אֶ֖פֶס עָצ֥וּר וְ/עָזֽוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: tl
  text: Sapagkat ipagtatanggol ni Yahweh ang karapatan ng kanyang bayan, at maaawa siya sa kanyang mga lingkod[a], kapag nakita niyang ubos na ang kanilang lakas[b] at wala nang natitira—alipin man o malaya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “magbabago siya ng pasiya tungkol sa kanyang mga lingkod” o “maglulubag siya tungkol sa kanila.” Ang pandiwang Hebreo ay maaaring magpahayag ng paglulubag o pagkahabag.'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “naglaho ang kamay”—isang idyoma na nangangahulugang naubos ang lakas o kapangyarihan.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “nakakulong at pinabayaan.” Mahirap ang idyomang ito; maaaring ang ibig sabihin ay “alipin man o malaya,” o, sa kabuuan, “wala nang sinumang natitira.”
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: ipagtatanggol ... ang karapatan
  rationale: Maaaring mangahulugang humatol o magbigay ng katarungan ang pandiwa. Sa konteksto, kumikilos si Yahweh para sa kanyang bayan, kaya ipinahahayag ng pariralang ito ang hudisyal na pagkilos na pabor sa kanila nang hindi inaalis ang batayang diwa ng paghatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עַמּוֹ
  choice: kanyang bayan
  rationale: Likas na salin ng kolektibo at tipanang katawagan sa Israel.
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: at maaawa siya sa kanyang mga lingkod
  rationale: Ang pandiwa ay maaaring magpahiwatig ng pagkahabag o pagbabago ng pasiya. Ang 'maaawa' ay natural sa Tagalog at angkop sa pagkakita sa ganap nilang kahinaan; inilalahad sa talababa ang alternatibong diwa.
- source_word: כִּי יִרְאֶה
  choice: kapag nakita niya
  rationale: Pinananatili ang magkaugnay na temporal at sanhiang diwa ng כִּי sa konteksto.
- source_word: אָזְלַת יָד
  choice: ubos na ang kanilang lakas
  rationale: Ang literal na 'naglaho ang kamay' ay isang idyoma para sa pagkaubos ng lakas o kapangyarihan.
- source_word: וְאֶפֶס
  choice: at wala nang natitira
  rationale: Ipinahahayag ang pagkawala o ganap na pagkaubos bago ang kasunod na pares.
- source_word: עָצוּר וְעָזוּב
  choice: alipin man o malaya
  rationale: Mahirap at malamang na idyomatikong pares ito na sumasaklaw sa lahat o nagsasabing wala nang sinuman. Ang salin ay malinaw sa modernong Tagalog, habang itinatala sa talababa ang literal at mas malawak na posibilidad.
theological_decisions:
- issue: Ang diwa ng pagkilos ni Yahweh sa kanyang bayan sa יָדִין
  choice: Pagbibigay-katarungan at pagkilos para sa kanyang bayan
  alternative: Paghatol sa kanyang bayan, na maaaring unawaing paghatol laban sa kanila
  rationale: Ang paralelismo sa pagkahabag at ang dahilan na ubos na ang kanilang lakas ay pumapabor sa mapanumbalik na pagkilos para sa bayan. Gayunman, hindi ikinukubli ng talababa na ang pandiwa ay maaari ring isaling 'hahatulan.'
- issue: Ang diwa ng יִתְנֶחָם tungkol sa mga lingkod
  choice: Maaawa siya sa kanila
  alternative: Magbabago siya ng pasiya tungkol sa kanila / maglulubag siya tungkol sa kanila
  rationale: Saklaw ng pandiwa ang pagkahabag at paglulubag o pagbabago ng pasiya. Pinili ang natural na pahayag ng habag, ngunit pinananatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ipagtatanggol ... ang karapatan” upang ihatid ang hudisyal na diwa ng vindication; “mga lingkod” ang pinili para sa covenantal na ugnayan, samantalang “alipin” ang ginamit sa huling merismo upang malinaw na itangi sa “malaya.”
