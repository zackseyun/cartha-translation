  yaml_path: translation/ot/deuteronomy/032/038.yaml
  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: tl
  text: na kumain ng taba ng kanilang mga handog at uminom ng alak ng kanilang mga handog na inumin—bumangon sila at tulungan kayo; sila nawa ang maging kanlungan ninyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: taba ng kanilang mga handog
  rationale: Pinananatili ang konkretong larawang kultiko ng taba mula sa mga hain; natural sa modernong Tagalog ang “mga handog” sa kontekstong ito.
- source_word: יֵין נְסִיכָם
  choice: alak ng kanilang mga handog na inumin
  rationale: Ipinahahayag ang teknikal na kahulugan ng נֶסֶךְ bilang handog na ibinubuhos, gamit ang pamilyar na terminong “handog na inumin.”
- source_word: יָק֨וּמוּ֙ וְיַעְזְרֻכֶם
  choice: bumangon sila at tulungan kayo
  rationale: Pinananatili ang mapanuyang hamon sa mga diyos na tinutukoy ng maramihang pandiwa at panghalip.
- source_word: סִתְרָה
  choice: kanlungan
  rationale: Tumutukoy sa taguan o proteksiyon; ang “kanlungan” ay natural, marangal, at hindi labis na nagpapaliwanag.
theological_decisions:
- issue: Referente ng mga pandiwang maramihan
  choice: Pinanatili ang “sila” nang hindi tahasang dinaragdag ang “mga diyos.”
  alternative: “Bumangon ang mga diyos na iyon…”
  rationale: Malinaw ang referente mula sa konteksto, ngunit wala sa mismong talata ang tahasang pangngalang “mga diyos”; pinananatili nito ang anyo at retorikal na puwersa ng Hebreo.
- issue: Puwersa ng huling sugnay
  choice: “sila nawa ang maging kanlungan ninyo”
  alternative: “hayaan ninyong sila ang kumupkop sa inyo”
  rationale: Pinananatili ang mapanuyang jussive na hamon at ang larawan ng proteksiyon nang hindi ginagawang mas tiyak kaysa sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang kultikong bokabularyo, ang maramihang panghalip, at ang mapanuyang tono ng awit.
