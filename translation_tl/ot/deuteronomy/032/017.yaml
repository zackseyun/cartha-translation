base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: tl
  text: Naghandog sila ng mga hain sa mga demonyo, hindi sa Diyos[a], sa mga diyos na hindi nila nakilala—mga bagong diyos na kamakailan lamang dumating[b]—na hindi kinatakutan ng inyong mga ninuno[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi sa isang diyos.” Maaaring basahin ang Hebreo bilang pagtangging tunay na diyos ang mga nilalang na ito, bagaman inihahambing sila ng konteksto sa tunay na Diyos ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga bago, mula sa malapit ay dumating sila”—ibig sabihin, mga diyos na bagong dating o kamakailan lamang ipinakilala.
    reason: lexical_alternative
  - marker: c
    text: O, “na hindi kinilabutan sa harap nila ang inyong mga ninuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: Naghandog sila ng mga hain
  rationale: Ipinahahayag ng pandiwang זבח ang paghahandog sa kontekstong panrelihiyon. Likas at malinaw sa Filipino ang pariralang ito, at hindi nito nililimitahan ang diwa sa simpleng pagkatay.
- source_word: לַשֵּׁדִים
  choice: sa mga demonyo
  rationale: Ang שֵׁדִים ay tumutukoy sa mga demonyong nilalang. Mas malinaw ito sa karaniwang mambabasa kaysa sa transliterasyong “shedim.”
- source_word: לֹא אֱלֹהַ
  choice: hindi sa Diyos
  rationale: Sa konteksto, itinatanggi ng pahayag na ang pinaghandugan nila ay ang tunay na Diyos ng Israel. Pinananatili ng salin ang tuwirang paghahambing, habang inilalahad sa talababa ang posibleng di-tiyak na pagbasa.
- source_word: אֱלֹהִים
  choice: mga diyos
  rationale: Pinananatili nito ang tahasang pagtukoy ng Hebreo sa mga pinaghandugan bilang “mga diyos,” kasunod ng pagtawag sa kanila na mga demonyo.
- source_word: לֹא יְדָעוּם
  choice: hindi nila nakilala
  rationale: Ang ידע ay nangangahulugang “makilala” o “malaman.” Ang aspektong naganap ay natural na naipahahayag sa Filipino sa “hindi nila nakilala.”
- source_word: חֲדָשִׁים
  choice: mga bagong dating
  rationale: Ginagamit ang pang-uri bilang pangngalan. Ang “mga bagong dating” ay maikli at likas, at ipinahihiwatig ng naunang “mga diyos” kung sino ang tinutukoy.
- source_word: מִקָּרֹב בָּאוּ
  choice: kamakailan lamang
  rationale: 'Sa pariralang ito, ang קָרֹב ay temporal: ang mga diyos na ito ay bagong dating o bagong ipinakilala, hindi lamang malapit sa lugar.'
- source_word: לֹא שְׂעָרוּם
  choice: hindi kinatakutan
  rationale: Sa kontekstong ito, ang bihirang pandiwa ay may diwang matinding pagkatakot o pangingilabot. Ang “kinatakutan” ang pinakanatural na pangunahing salin; pinananatili sa talababa ang mas matingkad na “kinilabutan.”
- source_word: אֲבֹתֵיכֶם
  choice: inyong mga ninuno
  rationale: Bagaman literal na “inyong mga ama,” karaniwang tumutukoy ang אבות sa mga ninuno o mga naunang salinlahi. Ang “mga ninuno” ay likas at tumpak sa kontekstong pangkasaysayan.
theological_decisions:
- issue: Ugnayan ng “mga demonyo” at “mga diyos”
  choice: 'Panatilihin ang dalawang katawagan: “sa mga demonyo ... sa mga diyos.”'
  alternative: Pagsamahin ang dalawa at alisin ang pag-uulit para maging mas makinis ang pangungusap.
  rationale: Sadyang pinagsusunod ng Hebreo ang שֵׁדִים at אֱלֹהִים habang itinatangging ang mga ito ay ang tunay na Diyos. Pinananatili ng salin ang tensiyong ito nang hindi nagbibigay ng paliwanag na wala sa talata.
- issue: Pagbasa sa לֹא אֱלֹהַ
  choice: “hindi sa Diyos”
  alternative: “hindi sa isang diyos”
  rationale: Pinakamalamang na inihahambing ng konteksto ang mga huwad na pinaghandugan sa tunay na Diyos ng Israel. Gayunman, dahil maaaring basahin ang anyo bilang di-tiyak na “isang diyos,” inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “naghandog ... ng mga hain” upang maging malinaw ang kultikong kilos; “mga ninuno” ang likas na katawagan sa mga naunang salinlahi. Pinanatili ang magkakasunod na parirala at teolohikal na tensiyon ng Hebreo, habang ang mga tunay na alternatibong pagbasa ay inilagay sa mga talababa.
