  text: שִׁחֵ֥ת ל֛/וֹ לֹ֖א בָּנָ֣י/ו מוּמָ֑/ם דּ֥וֹר עִקֵּ֖שׁ וּ/פְתַלְתֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: tl
  text: Nagpakasama sila sa kanya[a]; hindi sila kanyang mga anak dahil sa kanilang kapintasan. Sila ay isang salinlahing liko at baluktot.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap at masinsin ang Hebreo. Maaari ring unawain ang unang sugnay na, “Pinasama nila ang kanilang sarili,” at ang kasunod na parirala ay maaari ring isaling “ang kanilang dungis” o “ang kanilang kasalanan.”
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “isang salinlahing suwail at liko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  choice: Nagpakasama
  rationale: Ipinapahayag ng Piel ang tiwaling pagkilos. Pinananatili ng “nagpakasama” ang puwersang pandiwa nang hindi ipinipilit ang reflexive na diwa.
- source_word: לוֹ
  choice: sa kanya
  rationale: Ang ugnayang ipinahihiwatig ng ל na may hulaping panghalip ay sadyang masinsin at mahirap; ang “sa kanya” ay hindi labis na nagpapasya kung ito ay “laban sa kanya” o iba pang tiyak na relasyon.
- source_word: לֹא בָּנָיו
  choice: hindi sila kanyang mga anak
  rationale: Nililinaw ng idinagdag na “sila” ang sugnay na walang tahasang pandiwa, ngunit hindi idinaragdag ang temporal na ideyang “hindi na.”
- source_word: מוּמָם
  choice: dahil sa kanilang kapintasan
  rationale: Ang מוּם ay karaniwang tumutukoy sa kapintasan o dungis. Ang “dahil sa” ay maingat na idinagdag upang maging malinaw sa Filipino ang ugnayan sa masinsing sintaks.
- source_word: דּוֹר
  choice: salinlahi
  rationale: Ang “salinlahi” ay natural at marangal na katumbas sa kontekstong patula at tipanan.
- source_word: עִקֵּשׁ
  choice: liko
  rationale: Pinananatili ng “liko” ang konkretong larawan ng bagay na hindi tuwid at ang moral na pahiwatig nito.
- source_word: וּפְתַלְתֹּל
  choice: baluktot
  rationale: Ang bihirang pang-uri ay nagpapatingkad sa moral na pagkalihis; ang “baluktot” ay malinaw at kaagapay ngunit hindi kapareho ng “liko.”
theological_decisions:
- issue: Kung ang לֹא בָּנָיו ay nagsasaad ng pagkawala ng pagiging mga anak sa tipan o pagkakaila lamang sa kanilang katangiang maka-anak
  choice: hindi sila kanyang mga anak
  alternative: hindi na sila kanyang mga anak
  rationale: Walang tahasang panandang temporal ang Hebreo. Pinananatili ang matinding pahayag nang hindi nagdaragdag ng pasyang teolohikal tungkol sa pagkawala ng katayuan sa tipan.
- issue: Kung paano uunawain ang masinsing sintaks ng unang hanay
  choice: Nagpakasama sila sa kanya; hindi sila kanyang mga anak dahil sa kanilang kapintasan.
  alternative: Pinasama nila ang kanilang sarili; hindi sila kanyang mga anak; kanila ang dungis.
  rationale: Mahirap at masinsin ang Hebreo. Ang pangunahing salin ay nagbibigay ng magkakaugnay na diwa nang walang emendasyon, samantalang inilalahad sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan, habang pinananatili ang maigsi at matinding anyong patula. Ginamit ang “salinlahi” bilang natural na terminong pampanitikan at “liko at baluktot” upang mapanatili ang magkatambal na larawan sa Hebreo.
