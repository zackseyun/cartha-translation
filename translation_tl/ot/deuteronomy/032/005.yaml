  source_fidelity: 'Tapat ang salin sa pangunahing pagbasa ng masinsing Hebreo: ang tiwaling pagkilos na may kaugnayan sa kanya, ang mariing pagkakaila na sila ay kanyang mga anak nang walang idinagdag na temporal na diwa, ang kanilang kapintasan, at ang magkatambal na paglalarawan sa salinlahi bilang liko at baluktot. Ang tunay na hirap ng unang hanay ay maayos na pinananatili sa talababa.'
  naturalness: Natural at marangal ang makabagong Filipino. Ang “Nagpakasama sila sa kanya” ay maigsi, patula, at nauunawaan bilang masamang pagkilos laban o kaugnay niya nang hindi labis na nililinaw ang tungkulin ng Hebreong preposisyon. Ang “salinlahing liko at baluktot” ay mabisang katumbas ng paralelismong Hebreo.
  terminology: Ang “kapintasan,” “salinlahi,” “liko,” at “baluktot” ay angkop at magkakatugma sa makata at moral na rehistro ng talata. Hindi nagdadagdag ang “hindi sila kanyang mga anak” ng doktrinal o temporal na pagpapasya.
