base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: tl
  text: 'Gaya ng agila[a] na pinupukaw ang pugad nito,

    na pumapagaspas sa ibabaw ng mga inakay nito[b],

    ibinubuka niya ang kanyang mga pakpak,

    kinukuha niya ang inakay,

    at dinadala ito sa kanyang mga bagwis[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buwitre.” Ang salitang Hebreo ay maaaring tumukoy sa isang malaking ibong kumakain ng bangkay o sa isang ibong mandaragit na tulad ng agila.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “umaaligid sa ibabaw ng mga inakay nito” o “lumilimlim sa mga inakay nito.”
    reason: lexical_alternative
  - marker: c
    text: Ang “bagwis” dito ay tumutukoy sa mga balahibo o bahagi ng pakpak na ginagamit sa paglipad; maaari rin itong isalin nang mas pangkalahatan bilang “mga pakpak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: Gaya ng agila
  rationale: Ang נֶשֶׁר ay malaking ibong mandaragit at maaari ring tumukoy sa buwitre. Pinili ang “agila” dahil natural ito sa tradisyonal at makapangyarihang larawan ng talata, habang inilalahad sa talababa ang tunay na alternatibong leksikal.
- source_word: יָעִיר קִנּוֹ
  choice: pinupukaw ang pugad nito
  rationale: Ang Hiphil na יָעִיר ay nangangahulugang gumising o pumukaw. Ang “pinupukaw” ay nagpapanatili sa masiglang larawan nang hindi ipinapaliwanag kung paano ginagambala o inuudyukan ng ibon ang mga inakay.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: pumapagaspas sa ibabaw ng mga inakay nito
  rationale: Maaaring ilarawan ng יְרַחֵף ang pagaspas, pag-aligid, o pananatili sa ibabaw sa pamamagitan ng paglipad. Ang “pumapagaspas sa ibabaw” ay malinaw at buhay na larawan sa modernong Filipino.
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: ibinubuka niya ang kanyang mga pakpak
  rationale: Tuwirang ipinahahayag nito ang pagbuka o pag-unat ng mga pakpak. Ang “niya/kanyang” ay natural sa Filipino at hindi sapilitang nilulutas kung ang tinutukoy sa antas na ito ng tula ay ang ibon o ang PANGINOON na inilalarawan nito.
- source_word: יִקָּחֵהוּ
  choice: kinukuha niya ang inakay
  rationale: Karaniwang kahulugan ng לקח ang kumuha. Inulit ang “inakay” upang maging malinaw ang isahang layon ng Hebreo at maiwasang mapagkamalang pugad ang tinutukoy ng “ito.”
- source_word: יִשָּׂאֵהוּ
  choice: dinadala ito
  rationale: Sa larawang ito, ang נשא ay pisikal na pagdadala o pagbuhat. Ang “dinadala” ay natural at malinaw sa Filipino.
- source_word: עַל אֶבְרָתוֹ
  choice: sa kanyang mga bagwis
  rationale: Ang אֶבְרָה ay tumutukoy sa mga balahibo o bahagi ng pakpak na ginagamit sa paglipad, at naiiba sa mas pangkalahatang כָּנָף. Pinananatili ng “bagwis” ang patulang pagkakaiba sa naunang “mga pakpak,” na may paliwanag sa talababa.
theological_decisions:
- issue: Paglipat mula sa paghahambing sa agila tungo sa ipinahihiwatig na banal na tagapag-alaga
  choice: Gamitin ang “niya/kanyang” nang hindi tahasang pinapangalanan ang PANGINOON
  alternative: Panatilihing tahasang ibon lamang ang paksa o idagdag ang pangalan ng PANGINOON
  rationale: Ang mga pandiwa at hulapi sa Hebreo ay panlalaking isahan, ngunit walang kasariang gramatikal ang panghalip sa Filipino. Ang “niya/kanyang” ay nagpapanatili sa makatang kalabuan at nagpapahintulot sa konteksto na iugnay ang larawan sa PANGINOON nang hindi nagdaragdag ng pangalang wala sa mismong talata.
translation_notes:
  register: Modernong Filipino na may marangal at patulang himig. Ginamit ang karaniwang “pakpak” at ang mas patulang “bagwis” upang mapanatili ang leksikal na pagkakaiba ng כָּנָף at אֶבְרָה. Ang mga linya ay inayos ayon sa paralelismo ng tulang Hebreo.
