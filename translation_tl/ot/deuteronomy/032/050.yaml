  text: וּ/מֻ֗ת בָּ/הָר֙ אֲשֶׁ֤ר אַתָּה֙ עֹלֶ֣ה שָׁ֔מָּ/ה וְ/הֵאָסֵ֖ף אֶל עַמֶּ֑י/ךָ כַּֽ/אֲשֶׁר מֵ֞ת אַהֲרֹ֤ן אָחִ֨י/ךָ֙ בְּ/הֹ֣ר הָ/הָ֔ר וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: tl
  text: at mamatay ka sa bundok na inaakyat mo, at matipon ka sa iyong bayan[a], kung paanong namatay ang kapatid mong si Aaron sa Bundok Hor at natipon sa kanyang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matipon sa iyong mga ninuno.” Sa literal na Hebreo, “matipon sa iyong bayan.”
    reason: Ipinapaliwanag ang idyomang Hebreo at ibinibigay ang karaniwang kahulugang tumutukoy sa mga ninuno nang hindi iyon ipinapalit sa larawan ng pangunahing teksto.
lexical_decisions:
- source_word: וּמֻת
  choice: at mamatay ka
  rationale: Pinananatili ang tuwirang pautos/bolitibong anyo ng pandiwang מות at ang pang-ugnay na וּ.
- source_word: בָּהָר אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: sa bundok na inaakyat mo
  rationale: Ang הַר ay “bundok,” at ang עלה ay pag-akyat. Likas sa Tagalog ang “bundok na inaakyat mo”; hindi na kailangang tumbasan nang hiwalay ang שָׁמָּה sapagkat malinaw na ang patutunguhan sa sugnay.
- source_word: וְהֵאָסֵף אֶל עַמֶּיךָ
  choice: at mapisan ka sa iyong bayan
  rationale: Pinananatili ang biblikal na larawan ng pagtitipon o pagkapisan sa sariling bayan sa halip na agad itong paliitin sa “mailibing” o tahasang gawing “mga ninuno.”
- source_word: כַּאֲשֶׁר
  choice: kung paanong
  rationale: Natural na naghahayag sa Tagalog ng tuwirang paghahambing sa sinapit ni Aaron.
- source_word: אַהֲרֹן אָחִיךָ
  choice: ang kapatid mong si Aaron
  rationale: Natural na ayos sa modernong Tagalog para sa pangalan at ugnayang pampamilya.
- source_word: בְּהֹר הָהָר
  choice: sa Bundok Hor
  rationale: Ginagamit ang nakaugaliang anyo ng pangalang pantangi at pinananatili ang lokatibong diwa ng בְּ.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: at napisan sa kanyang bayan
  rationale: Inuulit ang parehong salitang “napisan” upang mapanatili ang leksikal na pagkakatulad ng sinapit nina Moises at Aaron.
theological_decisions:
- issue: Ang idyoma ng kamatayan na אסף אל־עמיו
  choice: mapisan/napisan sa iyong/kanyang bayan
  alternative: mapisan sa iyong/kanyang mga ninuno
  rationale: Maaaring tumukoy ang idyoma sa kamatayan at pakikiisa sa mga naunang kaanak, ngunit posibleng higit pa rito ang pahiwatig nito. Pinananatili ng pangunahing teksto ang larawan at tensiyong teolohikal sa halip na ipakahulugang simpleng paglilibing o tahasang limitahan sa mga ninuno.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ang “mapisan” ay bahagyang mataas ang register ngunit malinaw at angkop sa biblikal na idyoma; iniwasan ang mas makalumang “malakip.”
