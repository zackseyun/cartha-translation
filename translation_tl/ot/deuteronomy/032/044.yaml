id: DEU.32.44
reference: Deuteronomy 32:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְדַבֵּ֛ר אֶת כָּל דִּבְרֵ֥י הַ/שִּׁירָֽה הַ/זֹּ֖את בְּ/אָזְנֵ֣י הָ/עָ֑ם ה֖וּא וְ/הוֹשֵׁ֥עַ בִּן נֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: tl
  text: Dumating si Moises at binigkas niya sa pandinig ng bayan ang lahat ng salita ng awit na ito—siya at si Hosea[a] na anak ni Nun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Hosea”; sa ibang bahagi, ang taong ito ay karaniwang tinatawag na Josue (tingnan ang Bilang 13:16).'
    reason: Nililinaw ang anyo ng pangalan sa tekstong Hebreo at ang kaugnayan nito sa mas pamilyar na pangalang Josue.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Karaniwang ipinahihiwatig ng בוא sa anyong ito ang pagdating. Ang “dumating” ay likas sa salaysay at hindi nagdaragdag ng direksiyong wala sa teksto.
- source_word: וַיְדַבֵּר
  choice: binigkas niya
  rationale: Ang דבר sa piel ay nangangahulugang magsalita. Sa konteksto ng pampublikong pagbigkas ng isang awit, malinaw at natural ang “binigkas,” nang hindi nagdaragdag ng di-hayag na awtoridad o lakas ng pananalita.
- source_word: אֶת כָּל דִּבְרֵי
  choice: ang lahat ng salita
  rationale: Pinananatili nito ang pagiging ganap ng כָּל at ang kongkretong diwa ng דִּבְרֵי bilang mga salitang binigkas.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ng awit na ito
  rationale: Ang שִׁירָה ay “awit” sa kontekstong ito at tumutukoy sa naunang Awit ni Moises; mas angkop ito kaysa sa mas malawak na “tula.”
- source_word: בְּאָזְנֵי הָעָם
  choice: sa pandinig ng bayan
  rationale: Ito ang natural na salin ng idyomang literal na “sa mga tainga ng bayan” at pinananatili ang diwa ng hayagang pagbigkas.
- source_word: הָעָם
  choice: bayan
  rationale: Ang עָם ay tumutukoy sa Israel bilang nagkakatipong sambayanan. Ang “bayan” ay maikli, marangal, at karaniwan sa ganitong konteksto.
- source_word: הוּא
  choice: siya
  rationale: Pinananatili ang tahasang panghalip at ang aposisyong “siya at si Hosea,” sa halip na pakinisin ito bilang isang karaniwang maramihang simuno.
- source_word: וְהוֹשֵׁעַ
  choice: at si Hosea
  rationale: Ang Masoretikong teksto ay may pangalang הוֹשֵׁעַ, Hosea, hindi ang mas pamilyar na anyong Josue. Sinusunod ng salin ang mismong anyo ng pangalan sa talata.
- source_word: בִּן נוּן
  choice: na anak ni Nun
  rationale: Natural na Filipino ito para sa patronimikong pariralang Hebreo at malinaw na kinikilala ang ama ni Hosea.
theological_decisions:
- issue: Kung isasalin ang pangalan ng kasama ni Moises bilang “Hosea” o ang mas pamilyar na “Josue”
  choice: Hosea
  alternative: Josue
  rationale: Tahasang הוֹשֵׁעַ ang nasa tekstong Hebreo. Hindi ito iniharmonisa sa mas kilalang pangalang Josue; ipinaliliwanag sa talababa ang pagkakakilanlan.
- issue: Kung gagawing tuwirang maramihan ang simuno at pandiwa
  choice: Pinanatili ang isahang pandiwa kay Moises at ang kasunod na aposisyong “siya at si Hosea”
  alternative: “Dumating sina Moises at Hosea … at binigkas nila”
  rationale: Ang Hebreo ay may mga pandiwang isahan na tumutukoy muna kay Moises, saka idinaragdag ang “siya at si Hosea.” Pinananatili ng salin ang bahagyang tensiyon sa balangkas sa halip na lubusang ayusin ito bilang tahasang maramihan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “binigkas sa pandinig ng bayan” upang mapanatili ang pampubliko at pasalitang katangian ng tagpo. Ang gitling-pahaba ay tumutulong na ipakita ang di-pangkaraniwang aposisyong Hebreo nang hindi ito binubura.
