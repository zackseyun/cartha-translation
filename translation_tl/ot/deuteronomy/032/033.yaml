  source_fidelity: 'Tapat ang salin sa Hebreo: ang “alak” ay metaporikong itinumbas sa kamandag ng תַּנִּינִם, at ang ikalawang kalahati ay wastong nagpapahayag ng nakalalasong רֹאשׁ ng פְּתָנִים. Ang “mga ahas” para sa תַּנִּינִם ay angkop sa paralelismo at sa larawang kamandag, samantalang ang “mga ulupong” ay maingat na hindi labis na espesipiko para sa פְּתָנִים.'
