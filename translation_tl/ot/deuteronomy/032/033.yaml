  text: חֲמַ֥ת תַּנִּינִ֖ם יֵינָ֑/ם וְ/רֹ֥אשׁ פְּתָנִ֖ים אַכְזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/033.yaml
  text: Their wine is the venom of serpents[b][a], the cruel poison of cobras.
translation:
  language: tl
  text: Ang kanilang alak ay kamandag ng mga ahas[b], at malupit na lason ng mga ulupong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lason ng mga makamandag na ahas”; ang salitang Hebreo ay pangalan ng isang makamandag na ahas na tradisyonal na isinasaling “asp” o “adder.”
    reason: lexical_alternative
  - marker: b
    text: Sa ibang konteksto, ang salitang isinaling “mga ahas” ay maaari ring tumukoy sa malalaking reptilya o mga halimaw; ngunit dito, pinapaboran ng paralelismo sa makamandag na mga ahas ang kahulugang “mga ahas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: kamandag
  rationale: Sa pagkakaugnay nito sa mga ahas, tumutukoy ang salita sa nakalalasong sangkap, hindi sa poot o init. Ang “kamandag” ang likas at tiyak na salitang Filipino para rito.
- source_word: תַּנִּינִם
  choice: mga ahas
  rationale: Bagaman maaari itong tumukoy sa malalaking reptilya o mga halimaw sa ibang konteksto, pinapaboran dito ng paralelismo sa פְּתָנִים at ng larawang kamandag ang kahulugang tulad ng ahas.
- source_word: יֵינָם
  choice: ang kanilang alak
  rationale: Tuwirang isinasalin ang anyong may panghalip na paari at pinananatili ang matalinghagang pagtutumbas ng alak sa kamandag.
- source_word: וְרֹאשׁ
  choice: at ... lason
  rationale: Sa kontekstong ito, ang רֹאשׁ ay isang mapait o nakalalasong sangkap, hindi literal na “ulo.” Ang “lason” ay malinaw at umiiwas sa di-kailangang pag-uulit ng “kamandag.”
- source_word: פְּתָנִים
  choice: mga ulupong
  rationale: Ang salita ay tumutukoy sa makamandag na ahas na tradisyonal na isinasaling asp o adder. Ang “ulupong” ay natural, marangal, at hindi labis na espesipikong katumbas sa Filipino.
- source_word: אַכְזָר
  choice: malupit
  rationale: Pinananatili ng “malupit” ang personipikado at mabagsik na paglalarawan sa nakamamatay na bisa ng lason.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may dignidad at maikling anyong patula. Ginamit ang “kamandag” at “lason” upang mapanatili ang paralelismo nang hindi paulit-ulit, at “ulupong” upang hindi magpanggap ng higit na katiyakan sa espesye kaysa sa pinahihintulutan ng Hebreo.
