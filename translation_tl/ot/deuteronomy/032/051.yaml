base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: tl
  text: sapagkat nagtaksil kayo sa akin sa gitna ng mga anak ni Israel, sa mga tubig ng Meriba ng Kades[a], sa ilang ng Zin, sapagkat hindi ninyo ako itinuring na banal[b] sa gitna ng mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “Meriba ng Kades” ay maaari ring isaling “pagtatalo ng Kades”; mas literal ang buong parirala: “mga tubig ng pagtatalo ng Kades.”'
    reason: lexical_alternative
  - marker: b
    text: O “hindi ninyo itinanghal ang aking kabanalan.” Mas literal, “hindi ninyo ako ginawang banal”; tumutukoy ito sa kabiguang kilalanin at ipakita ang Diyos bilang banal sa gitna ng bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: nagtaksil kayo sa akin
  rationale: Ipinahahayag ng מעל ang paglabag sa katapatan, na may moral at tipanang bigat. Likas sa Filipino ang “nagtaksil … sa akin” at malinaw nitong tinutukoy ang Diyos bilang pinagkasalahan.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: sa gitna ng mga anak ni Israel
  rationale: Pinananatili ang pag-uulit at anyo ng Hebreong parirala. Nauunawaan ito bilang katawagan sa sambayanang nagmula kay Israel; maaari ring sabihing “sa gitna ng mga Israelita.”
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: sa tubig ng Meriba ng Kades
  rationale: Itinuturing ang parirala bilang pangalan ng pook at pangyayari, habang pinananatili ang “tubig,” na hayagang nasa Hebreo. Ang “Meriba” ay transliterasyon ng pangalang kaugnay ng pagtatalo.
- source_word: מִדְבַּר צִן
  choice: sa ilang ng Zin
  rationale: Ang “ilang” ay maikli, natural, at angkop na salin ng מִדְבָּר sa heograpikong kontekstong ito.
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: hindi ninyo ako itinuring na banal
  rationale: Ipinahahayag nito ang kabiguang kilalanin at itanghal sa harap ng Israel ang kabanalan ng Diyos, nang hindi ipinahihiwatig na ginawa sana nilang banal ang Diyos mula sa dating di-banal na kalagayan.
theological_decisions:
- issue: Kahulugan ng קִדַּשְׁתֶּם אֹתִי
  choice: hindi ninyo ako itinuring na banal
  alternative: hindi ninyo ako pinaging banal; hindi ninyo itinanghal ang aking kabanalan
  rationale: 'Pinananatili ng napiling salin ang pampubliko at relasyonal na diwa ng pandiwa: nabigo sina Moises at Aaron na kumilos sa paraang kumikilala sa kabanalan ng Diyos sa harap ng Israel. Hindi nito ginagawang nakasalalay sa tao ang likas na kabanalan ng Diyos.'
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Ang literal na anyo ay pinanatili upang maipakita ang tekstura at eksaktong pag-uulit ng Hebreo, bagaman ang parirala ay gumaganap bilang pangkalahatang katawagan sa buong bayang Israel.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang Hebreong pag-uulit ng “sa gitna ng mga anak ni Israel” at ang pangalang heograpiko. Ang “nagtaksil” ay mas matindi kaysa simpleng “hindi naging tapat” at angkop sa tipanang paglabag na ipinahahayag ng מעל.
