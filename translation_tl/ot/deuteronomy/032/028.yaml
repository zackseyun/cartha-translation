  text: 'Sapagkat sila ay isang bansang salat sa payo,

    at wala silang pang-unawa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o dahilan kaugnay ng naunang pahayag; likas sa Filipino ang “Sapagkat” sa ganitong daloy.
- source_word: גּוֹי
  choice: bansa
  rationale: Ang pangngalang kolektibo ay tumutukoy sa isang pangkat ng mga tao bilang bansa; malinaw at tuwiran ang “bansa.”
- source_word: אֹבַד עֵצוֹת
  choice: salat sa mabuting payo
  rationale: Ang parirala ay nagsasaad na wala o kapos sila sa maayos at matalinong paggabay o pagpapasiya. Idinagdag ang “mabuting” upang maipahayag ang positibong diwa ng payong nawawala, hindi na literal na walang anumang payo.
- source_word: הֵמָּה
  choice: sila ay
  rationale: Pinananatili ang mariing malayang panghalip at ang panaguring nominal sa natural na anyong Filipino.
- source_word: וְאֵין בָּהֶם
  choice: at wala silang
  rationale: Ang eksistensiyal na pagtanggi at בָּהֶם ay natural na naipapahayag sa Filipino bilang kawalan ng katangiang taglay nila.
- source_word: תְּבוּנָה
  choice: pang-unawa
  rationale: Tumutukoy sa kakayahang umunawa at kumilatis; pinananatili nito ang bokabularyo ng karunungan sa talata.
