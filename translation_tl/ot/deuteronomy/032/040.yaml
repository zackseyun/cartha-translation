translation:
  language: tl
  text: 'Sapagkat itinataas ko ang aking kamay sa langit at sinasabi ko: “Buhay ako magpakailanman.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang batayan ng naunang taimtim na pahayag at natural na nag-uugnay sa daloy ng Awit ni Moises.
- source_word: אֶשָּׂא
  choice: itinataas ko
  rationale: Pinananatili ang kongkretong kilos ng pagtataas ng kamay bilang kilos sa panunumpa.
- source_word: אֶל שָׁמַיִם
  choice: sa langit
  rationale: Natural na modernong Tagalog para sa direksiyong paitaas; hindi kailangang tumbasan ng maramihang anyo ang morpolohikal na plural ng Hebreo.
- source_word: יָדִי
  choice: ang aking kamay
  rationale: Tuwirang pinananatili ang isahang kamay na nasa tekstong Hebreo.
- source_word: וְאָמַרְתִּי
  choice: at sinasabi
  rationale: Inihahayag ang performatibo at kasalukuyang bisa ng panunumpa kasunod ng pagtataas ng kamay, nang hindi dinaragdagan ang simpleng pandiwang ‘sabihin.’
- source_word: חַי אָנֹכִי
  choice: Buhay ako
  rationale: Pormal na pinananatili ang mismong pananalita ng Hebreo; ipinauunawa ng kilos at konteksto ang puwersa nito bilang panunumpa.
- source_word: לְעֹלָם
  choice: magpakailanman
  rationale: Malinaw at marangal na katumbas ng walang hanggang tagal sa modernong Tagalog.
theological_decisions:
- issue: Paglalahad ng banal na panunumpa sa sarili nang hindi pinahihina o pinalalabis ang puwersa nito
  choice: “Buhay ako magpakailanman” sa pangunahing teksto, na may talababa tungkol sa puwersa ng panunumpa
  alternative: “Habang ako’y buhay magpakailanman” o “Saksi ang walang hanggan kong buhay”
  rationale: Ang Hebreo ay literal na ‘buhay ako magpakailanman’ sa konteksto ng pagtataas ng kamay. Pinananatili ng pangunahing teksto ang anyo at tunay na tensiyon sa pagitan ng pahayag at panunumpa, habang nililinaw ng talababa ang idiomatikong puwersa nang hindi nagdaragdag ng doktrinal na salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘Sapagkat’ at ‘magpakailanman’ upang mapanatili ang solemne at patulang himig, habang iniwasan ang lumang sintaks at labis na pagpapakahulugan.
