  source_fidelity: Tumpak na naipapahayag ng draft ang pagsasabi ng Diyos habang itinataas ang kaniyang kamay sa langit at ang pahayag na siya ay buhay magpakailanman. Gayunman, ang tahasang panghalip sa וְאָמַרְתִּי ay mas maayos na katawanin sa “sinasabi ko.”
  naturalness: Marangal at malinaw ang Tagalog. Mas natural at kumpleto ang “at sinasabi ko:” kaysa “at sinasabi,” lalo na bago ang tuwirang sipi.
  terminology: Ang “Sapagkat,” “langit,” at “magpakailanman” ay angkop sa solemne at patulang rehistro. Pinananatili ng “Buhay ako magpakailanman” ang tuwirang pahayag, samantalang ipinaliliwanag ng talababa ang puwersa nito bilang panunumpa nang hindi nagdaragdag ng doktrina.
