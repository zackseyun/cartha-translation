  source_fidelity: 'Ang pangkalahatang pagsasalin ay tapat sa Hebreo: napananatili ang pang-isahang panghalip, ang tigang na tagpuan, ang magkakasunod na pagkilos, at ang larawan ng balintataw. Gayunman, ang “pinag-ukulan ng masusing malasakit” ay kulang sa hayag na simuno at layon sa kasalukuyang pangungusap, at ang “masusing malasakit” ay mas interpretatibo at hindi gaanong likas na kolokasyon. Ang “pinagtuunan niya siya ng pansin” ay mas tuwirang naghahatid ng mapanuring pagtuon/pagsasaalang-alang ng יְבֹונְנֵהוּ, habang ang mga alternatibo ay nasa talababa.'
