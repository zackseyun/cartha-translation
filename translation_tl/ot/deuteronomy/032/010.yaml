source:
  edition: WLC
  text: יִמְצָאֵ֨/הוּ֙ בְּ/אֶ֣רֶץ מִדְבָּ֔ר וּ/בְ/תֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹֽבְבֶ֨/נְהוּ֙ יְב֣וֹנְנֵ֔/הוּ יִצְּרֶ֖/נְהוּ כְּ/אִישׁ֥וֹן עֵינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: tl
  text: Natagpuan niya siya sa isang disyertong lupain, sa tiwangwang at umaalulong na ilang; pinaligiran niya siya, pinagtuunan niya siya ng pansin[a], at binantayan niya siya gaya ng balintataw ng kanyang mata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “inalagaan niya siya” o “binigyan niya siya ng pang-unawa.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin sa mas tradisyonal na paraan: “gaya ng itim ng kanyang mata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: Natagpuan niya siya
  rationale: Pinananatili ang payak na diwa ng מצא na ‘makatagpo/makakita’ at ang pang-isahang tinutukoy, na sa konteksto ng awit ay si Jacob/Israel bilang isang katauhang kumakatawan sa bayan.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: sa lupaing disyerto
  rationale: Likas at malinaw sa makabagong Tagalog, habang kapwa naihahayag ang אֶרֶץ na ‘lupain’ at מִדְבָּר na ‘disyerto/ilang.’
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: sa tiwangwang at umaalulong na ilang
  rationale: Isinasalin ang תֹהוּ bilang pagkatiwangwang, ang יְלֵל bilang pag-ungol o pag-alulong, at ang יְשִׁמֹן bilang ilang; pinananatili ang masinsing larawang patula nang hindi ipinapasok ang kosmolohikal na diwang ‘kaguluhan.’
- source_word: יְסֹבְבֶנְהוּ
  choice: Pinaligiran niya siya
  rationale: Tuwirang pinananatili ang konkretong larawan ng סבב na paglibot o pagpaligid, sa halip na agad itong ipakahulugang ‘pinrotektahan.’
- source_word: יְבֹונְנֵהוּ
  choice: pinag-ukulan ng masusing malasakit
  rationale: Ipinahahayag ang maingat at mapanuring pagbibigay-pansin na maaaring taglayin ng pandiwa mula sa בין/בונן, at nababagay sa magkakasunod na gawa ng pag-aaruga. Inilalahad sa talababa ang tunay na posibilidad na ang diwa ay ‘binigyan niya ng pang-unawa.’
- source_word: יִצְּרֶנְהוּ
  choice: binantayan
  rationale: Ang נצר ay ‘magbantay, mag-ingat, magpanatili.’ Ang ‘binantayan’ ay natural at kaagapay ng kasunod na larawan tungkol sa mata.
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: gaya ng balintataw ng kanyang mata
  rationale: Ang ‘balintataw’ ang tiyak at marangal na salitang Tagalog para sa pupil ng mata at mas malapit sa konkretong larawang Hebreo kaysa sa idyomatikong pagpapakahulugang ‘pinakamamahal.’
theological_decisions:
- issue: Ang tinutukoy ng mga panghalip na pang-isahan
  choice: Pinanatili ang pang-isahang ‘siya’ para sa Jacob/Israel na inilalarawan bilang isang katauhan.
  alternative: Gawing maramihan ang tinutukoy bilang buong bayang Israel, o tahasang ilagay ang pangalang ‘Jacob.’
  rationale: Ang konteksto ay tumutukoy sa bayan sa pamamagitan ng kolektibong pang-isahan. Ang panghalip ay hindi pinapalitan ng maramihan at hindi rin tahasang pinapangalanan upang mapanatili ang anyo at bahagyang kalabuan ng tula.
- issue: Diwa ng יְבֹונְנֵהוּ
  choice: Isinalin bilang maingat at mapagmalasakit na pagbibigay-pansin.
  alternative: ‘Binigyan niya siya ng pang-unawa’ o ‘tinuruan niya siya.’
  rationale: Maaaring tumukoy ang pandiwa sa pag-unawa, pagpapagunawa, o masusing pagsasaalang-alang. Sa hanay ng pagpaligid at pagbabantay, ang mapagmalasakit na pagbibigay-pansin ay natural, ngunit hindi itinatago ang alternatibong diwang intelektuwal.
- issue: Larawan ng balintataw
  choice: Pinanatili ang literal na bahagi ng mata bilang larawan ng maselang pagbabantay.
  alternative: ‘Gaya ng pinakamamahal niya’ o isang katumbas ng Ingles na ‘apple of his eye.’
  rationale: Mas malinaw na nakaugat sa Hebreo ang ‘balintataw’ at hindi nito tahasang pinapalitan ang larawan ng isang interpretasyon tungkol sa pagkagiliw.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang masinsing paralelismo at larawang patula ng Hebreo. Ang ‘tiwangwang,’ ‘umaalulong,’ at ‘balintataw’ ay pormal ngunit nauunawaan sa karaniwang pagbasa; iniwasan ang labis na paliwanag sa mismong talata at inilagay sa talababa ang mahahalagang alternatibo.
