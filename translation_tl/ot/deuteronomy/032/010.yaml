revisions:
- from: Natagpuan niya siya sa lupaing disyerto, sa tiwangwang at umaalulong na ilang. Pinaligiran niya siya, pinag-ukulan ng masusing malasakit[a], at binantayan gaya ng balintataw ng kanyang mata.[b]
  to: Natagpuan niya siya sa isang disyertong lupain, sa tiwangwang at umaalulong na ilang; pinaligiran niya siya, pinagtuunan niya siya ng pansin[a], at binantayan niya siya gaya ng balintataw ng kanyang mata.[b]
  rationale: Inayos ang naturalness at gramatikal na pagkakaugnay ng mga pandiwa nang hindi binabago ang saklaw ng kahulugan. Pinili ang “pinagtuunan niya siya ng pansin” bilang maingat na pangunahing salin na sumasaklaw sa diwa ng pag-unawa o mapanuring pag-aasikaso, at pinanatili sa talababa ang mas relasyonal at mas intelektuwal na pagbasa. Inayos din ang talababa para sa כְּאִישׁוֹן עֵינוֹ upang maging aktuwal na tradisyonal na alternatibo.
