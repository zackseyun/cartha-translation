  terminology: Ang “ilang,” “tiwangwang,” at “balintataw” ay angkop sa marangal ngunit modernong Filipino. Ang talababa para sa balintataw ay dapat magbigay ng tunay na alternatibong leksikal o tradisyonal na anyo, hindi lamang magdagdag ng interpretatibong paliwanag tungkol sa pag-iingat.
