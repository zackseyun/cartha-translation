  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: tl
  text: 'Pinabayaan mo[a] ang Bato na nag-anak sa iyo,[b]

    at kinalimutan mo ang Diyos na nagsilang sa iyo.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kinalimutan mo” o “Hindi mo binigyang-pansin.” Mahirap tiyakin ang eksaktong kahulugan ng pandiwang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “ang Batong naging ama sa iyo.” Ang pandiwang Hebreo ay maaaring tumukoy sa pag-aanak bilang ama.
    reason: lexical_alternative
  - marker: c
    text: O “ang Diyos na nagluwal sa iyo.” Gumagamit ang Hebreo ng larawan ng panganganak.
    reason: lexical_alternative
lexical_decisions:
- source_word: צור
  choice: ang Bato
  rationale: Literal itong nangangahulugang “bato,” ngunit ginagamit dito bilang makabuluhang titulo para sa Diyos ng Israel. Pinananatili ng malaking titik ang larawan at ang gamit nito bilang titulo.
- source_word: ילדך
  choice: na naging Ama mo
  rationale: Ang Qal ng ילד ay maaaring tumukoy sa pag-aanak o pagiging ama. Natural sa modernong Tagalog ang “naging Ama mo” at malinaw nitong naipapahayag ang panig ng talinghagang tumutukoy sa ama, samantalang inilalagay sa talababa ang mas tuwirang “nag-anak sa iyo.”
- source_word: תשי
  choice: Pinabayaan mo
  rationale: Mahirap tiyakin ang eksaktong diwa ng pandiwa. Sa pagkakatulad nito sa “kinalimutan mo,” ipinahihiwatig nito ang may-salang pagpapabaya o hindi pagbibigay-pansin, nang hindi inuulit nang eksakto ang kasunod na pandiwa.
- source_word: ותשכח
  choice: at kinalimutan mo
  rationale: Tuwirang ipinagpapatuloy ng pandiwa ang paratang at pinananatili ang patulang pagkakat parallel ng dalawang linya.
- source_word: אל
  choice: ang Diyos
  rationale: Tumutukoy ito sa Diyos ng Israel at katapat ng titulong “ang Bato” sa unang linya.
- source_word: מחללך
  choice: na nagsilang sa iyo
  rationale: Ang anyo mula sa חול ay maaaring maglarawan ng paghihirap sa panganganak at ng pagluluwal. Malinaw at natural na pinananatili ng “nagsilang sa iyo” ang kapansin-pansing imahen ng panganganak.
theological_decisions:
- issue: Larawang magulang para sa Diyos
  choice: Pinanatili ang larawang tumutukoy kapwa sa ama (“naging Ama mo”) at sa panganganak (“nagsilang sa iyo”).
  alternative: Gumamit ng pangkalahatang pananalita gaya ng “lumalang sa iyo” o “humubog sa iyo.”
  rationale: Sadyang pinagtatabi ng Hebreo ang pag-aanak bilang ama at ang larawan ng pagsilang. Hindi dapat alisin ang tensiyong ito sa pamamagitan ng mas pangkalahatang pananalita tungkol sa paglikha.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Bato” bilang banal na titulo at pinanatili ang maikli at magkatimbang na patulang mga linya.
