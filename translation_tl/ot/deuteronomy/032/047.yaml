  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: tl
  text: Sapagkat hindi ito isang salitang walang kabuluhan para sa inyo[a]; ito ang inyong buhay[b]. Sa pamamagitan ng salitang ito ay pahahabain ninyo ang inyong mga araw sa lupaing papasukan ninyo sa pagtawid sa Jordan upang angkinin iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang bagay na walang saysay para sa inyo” o “isang usaping hindi mahalaga sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga buhay ninyo”; ang anyong maramihan ay maaaring gamitin bilang abstraktong pangngalang isahan na “buhay.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “upang ariin iyon” o “upang manahin iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: salitang walang kabuluhan
  rationale: Pinananatili nito ang kongkretong diwa ng דָבָר bilang salitang ipinahayag at ang רֵק bilang hungkag, walang saysay, o walang halaga, habang natural sa makabagong Filipino.
- source_word: מִכֶּם
  choice: para sa inyo
  rationale: Ang מן ay idyomatiko rito at tumutukoy sa kabuluhan ng salita para sa Israel, hindi sa pinagmulan nito.
- source_word: חַיֵּיכֶם
  choice: inyong buhay
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwang ginagamit ang חַיִּים bilang abstraktong pangngalang isahan na nangangahulugang buhay.
- source_word: וּבַדָּבָר הַזֶּה
  choice: sa pamamagitan ng salitang ito
  rationale: Instrumental ang ב; ipinakikita nitong ang salitang ito ang kaparaanang kaugnay ng mahabang buhay. Pinananatili rin ng 'salita' ang pag-uugnay sa naunang דָבָר.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: mapahahaba ninyo ang inyong buhay
  rationale: Ipinahahayag sa natural na Filipino ang Hiphil na 'pahahabain ang mga araw' nang hindi ginagamit ang masyadong literal at di-likas na parirala.
- source_word: עַל הָאֲדָמָה
  choice: sa lupain
  rationale: Sa konteksto ng Deuteronomio, tumutukoy ito sa ipinangakong lupain, hindi sa lupa o daigdig sa pangkalahatan.
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: tatawirin ninyo ang Jordan
  rationale: Ang participle ay may nalalapit na kahulugan mula sa pananaw ni Moises; natural itong ipinahahayag sa Filipino sa aspektong kontemplatibo.
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: upang angkinin iyon
  rationale: Ang ירשׁ ay maaaring mangahulugang angkinin, ariin, o manahin ang lupain. Ang 'angkinin' ay malinaw at hindi nagdaragdag ng di-tiyak na paliwanag.
theological_decisions:
- issue: Ugnayan ng salita, buhay, at pananatili sa lupain sa tipan
  choice: Inilalahad ng talata na ang salita ng Diyos ay buhay ng Israel at ang paraang kaugnay ng mahabang buhay nila sa lupain.
  alternative: Maaari itong basahin bilang retorikal na papuri lamang sa kahalagahan ng kautusan, na walang ipinahihiwatig na bunga sa tipan.
  rationale: Ang magkatugmang pahayag na 'ito ang inyong buhay' at 'sa pamamagitan ng salitang ito, mapahahaba ninyo ang inyong buhay' ay nagpapahayag ng tunay na kaugnayan sa tipan, ngunit hindi dinaragdagan ng salin ang talata ng mga doktrinang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'lupain' para sa teritoryong ipinangako, at 'mapahahaba ninyo ang inyong buhay' bilang natural na katumbas ng Hebreong idyomang literal na 'pahahabain ninyo ang mga araw.'
