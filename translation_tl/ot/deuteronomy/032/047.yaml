  to: Sapagkat hindi ito isang salitang walang kabuluhan para sa inyo[a]; ito ang inyong buhay[b]. Sa pamamagitan ng salitang ito ay pahahabain ninyo ang inyong mga araw sa lupaing papasukan ninyo sa pagtawid sa Jordan upang angkinin iyon.[c]
