translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang maiikling linya at dash upang mapanatili ang bigat at pagkasinsin ng Hebreong tula; iniwasan ang lipas na 'pasusuhin' at ang mas teknikal o denominasyonal na pananalita.
