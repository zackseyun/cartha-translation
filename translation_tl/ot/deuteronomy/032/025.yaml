  source_fidelity: Tumpak na naihahatid ng draft ang marahas na pagtatambal ng panganib sa labas at lagim sa mga silid, pati ang saklaw ng mga biktima mula kabataan hanggang katandaan. Gayunman, ang “mag-iiwan ng pangungulila” ay hindi gaanong tuwirang naipapakita ang tabak bilang ahenteng ‘nagpapangulila’/‘bumabawi ng mga anak o mahal sa buhay,’ na siyang diin ng Piel ng שׁכל.
  naturalness: Marangal, malinaw, at angkop ang putol-putol na patulang ayos. Mas likas at mas matindi ang “magpapapangulila ang tabak” kaysa “mag-iiwan ng pangungulila ang tabak.”
  terminology: Ang “tabak,” “lagim,” “binata at dalaga,” “sanggol na sumususo,” at “lalaking ubanin” ay angkop. Maingat ding pinananatili ng talababa ang saklaw at posibleng pahiwatig ng bethulah nang hindi ipinipilit ang isang pakahulugan.
