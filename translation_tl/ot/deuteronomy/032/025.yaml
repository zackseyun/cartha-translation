base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/025.yaml
  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: tl
  text: 'Sa labas, magpapapangulila ang tabak;


    at sa loob ng mga silid[a], lagim—


    kapwa binata at dalaga[b],


    sanggol na sumususo pati lalaking ubanin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at mula sa mga silid, lagim.” Ipinagtatapat ng Hebreo ang panganib sa labas at ang lagim sa loob.
    reason: lexical_alternative
  - marker: b
    text: Ang “dalaga” ay salin ng Hebreong bethulah, na tumutukoy sa isang kabataang babaeng hindi pa kasal at madalas ay nagpapahiwatig ng pagiging birhen. Maaari ring isalin na “birhen.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  choice: Sa labas
  rationale: Pinananatili nito ang malinaw na panlahatang pagtukoy sa lugar at ang pagtutol sa mga silid sa loob, nang hindi nililimitahan ang kahulugan sa lansangan lamang.
- source_word: תְּשַׁכֶּל
  choice: mag-iiwan ng pangungulila
  rationale: Ang Piel ng שׁכל ay tumutukoy sa pag-agaw ng anak o mahal sa buhay at sa bunga nitong pangungulila. Natural ito sa Filipino at pinananatili ang tabak bilang personipikadong gumagawa.
- source_word: חֶרֶב
  choice: ang tabak
  rationale: Pinananatili ang kongkretong larawan ng digmaan at paghatol sa Hebreo, na ang tabak ang ahente ng kamatayan.
- source_word: וּמֵחֲדָרִים
  choice: at sa loob ng mga silid
  rationale: Bagaman literal na may ideyang 'mula sa mga silid,' gumaganap ang parirala bilang panloob na katapat ng 'sa labas.' Ang salin ay natural sa Filipino habang ang literal na anyo ay inilalagay sa talababa.
- source_word: אֵימָה
  choice: lagim
  rationale: Maikli, matindi, at angkop sa maringal na estilong patula; ipinahihiwatig nito ang matinding takot sa loob ng tahanan.
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: kapwa binata at dalaga
  rationale: Likas sa modernong Filipino ang pares na 'binata at dalaga' para sa kabataang lalaki at babaeng hindi pa kasal. Hindi nito labis na nilulutas ang posibleng pahiwatig ng seksuwal na kalinisan sa בְּתוּלָה; binabanggit ang alternatibo sa talababa.
- source_word: יוֹנֵק
  choice: sanggol na sumususo
  rationale: Tuwirang pinananatili ang participial na larawan ng batang sumususo sa halip na gawing pangkalahatang 'sanggol' lamang.
- source_word: עִם אִישׁ שֵׂיבָה
  choice: pati lalaking ubanin
  rationale: Ang 'pati' ay likas na nagdurugtong sa magkabilang dulo ng edad, at ang 'lalaking ubanin' ay nagpapanatili sa kongkretong larawan ng lalaking may uban.
