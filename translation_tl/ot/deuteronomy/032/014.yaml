  text: חֶמְאַ֨ת בָּקָ֜ר וַ/חֲלֵ֣ב צֹ֗אן עִם חֵ֨לֶב כָּרִ֜ים וְ/אֵילִ֤ים בְּנֵֽי בָשָׁן֙ וְ/עַתּוּדִ֔ים עִם חֵ֖לֶב כִּלְי֣וֹת חִטָּ֑ה וְ/דַם עֵנָ֖ב תִּשְׁתֶּה חָֽמֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/014.yaml
  text: curds from the herd[a], and milk from the flock, with the fat of lambs, and rams, the offspring of Bashan, and goats, with the choicest wheat; and you drank foaming wine[b], the blood of grapes.
translation:
  language: tl
  text: Namuong gatas mula sa mga baka, at gatas mula sa mga kawan, kasama ang taba ng mga kordero, ng mga lalaking tupa mula sa Basan, at ng mga kambing, kasama ang pinakamainam na trigo[a]; at uminom ka ng bumubulang alak[b], ang dugo ng ubas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “taba ng mga bato ng trigo,” isang idyoma para sa pinakamainam o pinakamasaganang trigo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mapulang alak”; ang salitang Hebreo ay maaaring tumukoy sa alak na matingkad ang kulay o bumubula dahil sa pagbuburo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: krema mula sa mga baka
  rationale: Ang חֶמְאָה ay isang malapot at matabang produktong gatas, posibleng kurta, maasim na gatas, krema, o mantikilya. Pinananatili ng “krema” ang larawan ng masaganang pagkaing gatas nang hindi ito ipinapantay sa modernong mantikilya; ang בָּקָר ay kolektibong tumutukoy sa mga baka.
- source_word: חֲלֵב צֹאן
  choice: gatas mula sa mga kawan
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Ang “mga kawan” ay nagpapanatili sa lawak ng salita at umaayon sa pastoral na larawan.
- source_word: חֵלֶב כָּרִים
  choice: taba ng mga kordero
  rationale: Pinananatili ang kongkretong kahulugan ng חֵלֶב na “taba,” samantalang ang כָּרִים ay mga batang tupa o pinatabang kordero.
- source_word: אֵילִים בְּנֵי בָשָׁן
  choice: mga lalaking tupa na lahi ng Basan
  rationale: Ang אֵילִים ay mga lalaking tupa, at ang literal na “mga anak ng Basan” ay likas na idyoma para sa mga hayop na nagmula o pinalaki sa Basan.
- source_word: עַתּוּדִים
  choice: mga kambing
  rationale: Karaniwang tumutukoy ang salita sa mga lalaking kambing, ngunit sapat at mas natural sa listahang ito ang pangkalahatang “mga kambing.”
- source_word: חֵלֶב כִּלְיוֹת חִטָּה
  choice: pinakamainam na trigo
  rationale: Literal itong “taba ng mga bato ng trigo,” isang makatang idyoma para sa pinakamayaman o pinakamahusay na butil. Isinalin ang diwa upang maging malinaw sa karaniwang mambabasa, habang inilalahad sa talababa ang literal na larawan.
- source_word: תִּשְׁתֶּה
  choice: uminom ka
  rationale: Ang ikalawang panauhang panlalaking isahan na imperfect ay gumaganap sa awit bilang pagsasalaysay ng nakaraang pagpapala; likas dito ang nagdaang panahunan sa Filipino.
- source_word: חָמֶר
  choice: bumubulang alak
  rationale: Ang bihirang katawagan sa alak ay maaaring magpahiwatig ng masaganang pagkakaburo, pagbula, o posibleng mapulang kulay. Pinili ang “bumubulang alak” ngunit pinanatili sa talababa ang alternatibo.
- source_word: דַם עֵנָב
  choice: ang dugo ng ubas
  rationale: Pinananatili ang matingkad na makatang metapora at ang appositional na ugnayan nito sa alak.
theological_decisions:
- issue: Paglalarawan sa kasaganaan nang hindi ito ginagawang abstraktong paliwanag teolohikal
  choice: Pinanatili ang kongkretong mga larawan ng pagkain, hayop, butil, at alak.
  alternative: Isalin ang talaan bilang pangkalahatang “kasaganaan,” “karangyaan,” o “pagpapala ng tipan.”
  rationale: Ang Hebreo ay nagtatala ng mga tiyak na kaloob. Ang tahasang teolohikal na pagpapakahulugan ay hindi dapat ipalit sa mismong poetikong larawan.
- issue: Ugnayan ng “alak” at “dugo ng ubas”
  choice: 'Ginawang panumbas na parirala: “bumubulang alak, ang dugo ng ubas.”'
  alternative: “alak mula sa dugo ng ubas.”
  rationale: Walang pang-ukol na “mula sa” sa Hebreo; ang ikalawang parirala ay makatang pagtukoy sa naunang alak.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at makatang himig. Ginamit ang pangkaraniwang bokabularyo, pinanatili ang konkretong pastoral na larawan, at inilagay sa talababa ang dalawang idyomatikong o hindi tiyak na ekspresyon. Ang “Basan” ang karaniwang anyong Filipino ng pangalang heograpiko.
