  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: tl
  text: 'Sapagkat ang kanilang bato ay hindi gaya ng ating Bato,[a]

    at ang ating mga kaaway ay mga hukom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ang kanilang Bato ay hindi gaya ng ating bato, at ang ating mga kaaway ay mga hukom.” Ang salitang Hebreo na פְּלִילִים ay literal na “mga hukom” o “mga tagahatol,” kaya may diwang legal o paghahatol ang linyang ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikitang ang talata ay nagbibigay ng batayan o paliwanag sa naunang pahayag sa Awit ni Moises.
- source_word: כְצוּרֵנוּ
  choice: gaya ng ating Bato
  rationale: Pinananatili ang metaporang צוּר bilang pantukoy sa Diyos ng Israel; ang malaking titik ay nagpapahiwatig ng gamit nito bilang banal na titulo nang hindi pinapalitan ang larawan.
- source_word: צוּרָם
  choice: ang kanilang bato
  rationale: Pinananatili ang parehong larawang 'bato' upang manatili ang sinadyang paghahambing, ngunit maliit ang titik sapagkat tumutukoy ito sa inaasahan o sinasandigan ng mga kaaway.
- source_word: וְאֹיְבֵינוּ
  choice: at ang ating mga kaaway
  rationale: Tuwirang isinasalin ang pang-ugnay at simuno, nang hindi nagdaragdag ng 'maging' o ng tahasang paghahambing na wala sa anyong Hebreo.
- source_word: פְּלִילִים
  choice: ang siyang humahatol
  rationale: Ang pangngalan ay nangangahulugang mga hukom o tagahatol. Ginawang likas na panaguri sa Tagalog habang pinananatili ang legal o pasyang diwa ng salita.
theological_decisions:
- issue: Kung ang צוּר ay pananatilihing metapora o papalitan ng paliwanag na titulo
  choice: Panatilihin ang “Bato” bilang metapora at titulo para sa Diyos ng Israel
  alternative: tagapagtanggol, kanlungan, o lakas
  rationale: Iisang pangngalan ang sadyang ginagamit sa Diyos ng Israel at sa sinasandigan ng mga bansa. Ang pagpapanatili sa “bato/Bato” ang nagpapanatili sa paghahambing at hindi nagpapasok ng mas makitid na interpretasyon.
- issue: Kung ang פְּלִילִים ay paglalarawan sa mga kaaway bilang mga hukom o pahayag na sila ay kumikilala sa hatol
  choice: Isalin bilang “ang siyang humahatol”
  alternative: “ay mga hukom”
  rationale: Pinananatili nito ang forensic na diwa at ang tunay na kalabuan kung ang tinutukoy ay katayuan bilang mga tagahatol o ang kanilang pagbibigay ng pasya sa paghahambing.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding paghahambing na bato/Bato at ang forensic na diwa ng hulíng sugnay; ginamit ang “Sapagkat” upang umangkop sa pangangatwiran ng awit.
