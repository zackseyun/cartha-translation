translation:
  language: tl
  text: 'Kapag pinatalim ko ang kumikislap na talim ng aking tabak,

    at kapag hinawakan ng aking kamay ang paghatol,

    maghihiganti ako sa aking mga kalaban,

    at gagantihan ko ang mga napopoot sa akin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Kapag
  rationale: Bagaman karaniwang nangangahulugang “kung,” maaari itong magpakilala rito ng tiyak na pangyayaring darating; ang “kapag” ay natural sa Filipino at umaayon sa konteksto nang hindi ginagawang kondisyonal ang pangako.
- source_word: שַׁנּוֹתִי בְּרַק חַרְבִּי
  choice: pinatalim ko ang kumikislap kong tabak
  rationale: Ang שׁנן ay tumutukoy sa pagpapatalim, samantalang ang בְּרַק ay literal na “kidlat/kislap” at dito ay naglalarawan sa makinang o kumikislap na talim. Iniiwasan ng saling ito ang di-likas na “kidlat ng aking tabak” habang pinananatili ang matinding larawan.
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  choice: at hinawakan ng aking kamay ang paghatol
  rationale: Pinananatili ang kongkretong idyoma ng kamay na humahawak sa מִשְׁפָּט. Ang “paghatol” ay saklaw kapwa ang pasiya at ang pagpapatupad ng katarungan.
- source_word: אָשִׁיב נָקָם
  choice: maghihiganti ako
  rationale: Ang Hebreong parirala ay literal na pagbabalik o pagganti ng paghihiganti; ang pandiwang Filipino ay malinaw at natural, at ang banal na tagapagsalita ang tahasang gumagawa nito.
- source_word: לְצָרָי
  choice: sa aking mga kalaban
  rationale: Ang צַר ay kaaway o katunggali; “mga kalaban” ang karaniwan at dignified na katumbas.
- source_word: וְלִמְשַׂנְאַי אֲשַׁלֵּם
  choice: at gagantihan ko ang mga napopoot sa akin
  rationale: Ang שׂנא ay “mapoot,” at ang שלם sa piel ay “gumanti/magbayad nang buo.” Ang “gagantihan” ay nagpapahayag ng katumbas na kaparusahan nang hindi nagdaragdag ng detalye.
theological_decisions:
- issue: Katiyakan o kondisyon sa אִם
  choice: Kapag
  alternative: Kung
  rationale: Sa konteksto ng awit at ng kasunod na tiyak na paghihiganti, ang אִם ay maipapakahulugang temporal. Pinananatili ng “kapag” ang katiyakan ng ipinahahayag na pagkilos, gaya ng audited consultation text.
- issue: Kahulugan ng מִשְׁפָּט
  choice: paghatol
  alternative: katarungan
  rationale: Ang “paghatol” ay mas malapit sa hudisyal na kilos na ‘hinahawakan’ at hindi ipinapasiya kung ang diin ay nasa pamantayan ng katarungan o sa hatol na ipatutupad.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang poetikong paghahanay upang mapanatili ang parallelism ng Hebreong awit. Walang idinagdag na denominasyonal na paliwanag.
