base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: tl
  text: '“Kung hindi lamang ako nangamba sa paghamak ng kaaway,[a]


    baka magkamali ng pagkaunawa ang mga kaaway,


    baka sabihin nila, ‘Nanaig ang aming kamay,[c]


    at hindi si Yahweh ang gumawa ng lahat ng ito.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kung hindi lamang ako natakot sa paghamak ng kaaway.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sa literal: “Mataas ang aming kamay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: Kung hindi lamang
  rationale: Pinananatili ang pasubali at eksepsiyong ipinahihiwatig ng Hebreo, habang natural ang daloy sa makabagong Tagalog.
- source_word: כַּעַס אוֹיֵב
  choice: sa panggagalit ng kaaway
  rationale: Inilalarawan ang mapanuyang pagkilos o reaksiyon ng kaaway na makapupukaw ng galit; hindi nito tahasang nilulutas kung ang diin ay nasa panggagalit o sa galit na dulot nito.
- source_word: אָגוּר
  choice: ako nangamba
  rationale: Tapat sa tahasang pananalita ng Diyos sa unang panauhan at hindi pinapahina bilang simpleng ‘pag-aalala.’
- source_word: פֶּן
  choice: baka
  rationale: Natural na Tagalog para sa paulit-ulit na sugnay na nagsasaad ng kinatatakutang mangyari o nais maiwasan.
- source_word: יְנַכְּרוּ
  choice: magkamali ng pagkaunawa
  rationale: Ipinahahayag ang malamang na diwa sa konteksto—maling pagpapakahulugan sa sanhi ng pagbagsak ng Israel—habang itinatala sa talababa ang hirap ng pandiwa.
- source_word: צָרֵימוֹ
  choice: ang kanilang mga kalaban
  rationale: Pinananatili ang maramihang anyo at ang pagtukoy sa mga kaaway ng Israel.
- source_word: יָדֵינוּ רָמָה
  choice: Nanaig ang aming kamay
  rationale: Pinananatili ang talinghaga ng ‘kamay’ ngunit ipinahahayag sa natural na Tagalog ang pag-aangkin ng tagumpay at kapangyarihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: פָּעַל כָּל זֹאת
  choice: ang gumawa ng lahat ng ito
  rationale: Direktang inilalahad ang pagtanggi ng mga kaaway na si Yahweh ang may gawa ng nangyari.
theological_decisions:
- issue: Ang personal na pangalan na יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at iniiwasang palitan ito ng titulo.
- issue: Antropopatikong pananalitang ‘ako nangamba’
  choice: Panatilihin ang ‘ako nangamba’
  alternative: ‘ako ay nag-alala’ o ‘pinigilan ko ang sarili ko dahil sa’
  rationale: Tahasang gumagamit ang Hebreo ng pandiwang nangangahulugang mangamba o matakot. Hindi ito pinapaliwanag palayo; ipinakikita ng konteksto na ang usapin ay ang maling pag-aangkin ng kaaway, hindi ang kahinaan ni Yahweh.
- issue: Maling pagpapakahulugan ng mga kaaway
  choice: magkamali ng pagkaunawa
  alternative: magkamali ng paghatol
  rationale: Pinananatili ang kontekstuwal na diwa nang hindi lubusang isinasara ang mahirap at maaaring higit sa isa ang kahulugang pandiwang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘baka’ sa halip na isang lipas na katumbas ng ‘lest,’ at pinanatili ang talinghaga ng kamay sa paraang mauunawaan ng karaniwang mambabasa.
