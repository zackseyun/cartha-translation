  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: tl
  text: At sasabihin niya, “Nasaan ang kanilang mga diyos, ang batong kinanlungan nila[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, mas literal: “ang bato na sa kaniya/rito sila ay naghanap ng kanlungan.” Isahan ang “bato” at inilalagay itong kasunod na paglalarawan sa maramihang “kanilang mga diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: At sasabihin niya
  rationale: Pinananatili ng “At” ang pang-ugnay na וְ, samantalang ang aspektong panghinaharap ng “sasabihin” ay umaayon sa daloy ng patulang pahayag sa Deuteronomio 32:36–38.
- source_word: אֵי
  choice: Nasaan
  rationale: Karaniwan at tuwirang katumbas ng tanong na “saan?”; ang anyong Tagalog ay hindi kailangang magbago ayon sa bilang ng kasunod na pangngalan.
- source_word: אֱלֹהֵימוֹ
  choice: ang kanilang mga diyos
  rationale: Ipinapahayag ang maramihang diwa at hulaping tumutukoy sa ikatlong panauhang maramihan, at pinananatili ang pagpuna sa mga diyos na pinaglagakan nila ng tiwala.
- source_word: צוּר
  choice: ang bato
  rationale: Literal na “bato.” Ginamit ang karaniwang titik upang hindi ito mapagkamalang titulo ng PANGINOON na lumilitaw sa ibang bahagi ng awit; dito, nakapantay ito bilang paglalarawan sa “kanilang mga diyos.”
- source_word: חָסָיוּ
  choice: kinanlungan nila
  rationale: Likas sa makabagong Tagalog at pinananatili ang kongkretong larawan ng paghahanap ng kanlungan, sa halip na gawing mas abstraktong “pinagtiwalaan.”
- source_word: בּוֹ
  choice: nakapaloob sa “kinanlungan”
  rationale: Sa Tagalog, likas na naipahahayag ng pokus-lokatibong pandiwang “kinanlungan” ang Hebreong “sa kaniya/rito,” nang hindi pilit na inuulit ang panghalip.
theological_decisions:
- issue: Ang nagsasalita at ang panahon ng pandiwa
  choice: “At sasabihin niya” bilang panghinaharap na pagpapatuloy ng pahayag ng PANGINOON
  alternative: “At sinabi niya” o “At may magsasabi”
  rationale: Sa konteksto ng Deuteronomio 32:36–38, pinakamalamang na nagpapatuloy ang paglalarawan sa sasabihin ng PANGINOON. Gayunman, hindi idinaragdag ang pangalang “PANGINOON” sa mismong talata, kaya hindi higit na nililinaw ang Hebreo kaysa kinakailangan.
- issue: Paglalarawan sa mga diyos bilang “bato”
  choice: “bato” na may maliit na titik
  alternative: “Bato” na may malaking titik
  rationale: Bagaman ginagamit ang “Bato” bilang titulo ng PANGINOON sa ibang bahagi ng kabanata, ang agarang tinutukoy rito ay “kanilang mga diyos.” Pinananatili ng maliit na titik ang mapanuyang paghahambing at iniiwasang ipahiwatig na sila ang tunay na Diyos.
- issue: Pagkakaiba ng maramihang “mga diyos” at isahang “bato”
  choice: Pinanatili ang isahang “ang bato” bilang kasunod na pantukoy sa maramihang “mga diyos”
  alternative: “ang mga batong kinanlungan nila”
  rationale: Sinasalamin nito ang tunay na tensiyon sa anyong Hebreo, kung saan maramihan ang “kanilang mga diyos” ngunit isahan ang “bato” at ang kasunod na hulaping panghalip. Hindi ito pinantay sa maramihan nang walang batayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “kinanlungan” ay pamilyar ngunit may angkop na patulang bigat. Pinanatili ang maikli at mapanuyang tanong ng Hebreo, pati ang di-pangkaraniwang pag-uugnay ng maramihang “mga diyos” sa isahang “bato.”
