  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: tl
  text: Isulat mo ang mga ito sa mga haligi ng pintuan ng iyong bahay at sa iyong mga tarangkahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at sa mga haligi ng iyong mga tarangkahan” o “at sa iyong mga pasukan.” Ang salitang Hebreo ay maaaring tumukoy sa mga tarangkahan, sa lugar ng pasukan, o sa mga haliging bumubuo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Isulat mo ang mga ito
  rationale: Ang anyong pandiwa sa sunod-sunod na mga utos ay likas na isinasalin bilang tuwirang utos sa modernong Tagalog. Pinananatili ng “ang mga ito” ang panghalip na tumutukoy sa mga salitang binanggit sa naunang konteksto.
- source_word: עַל מְזוּזֹת
  choice: sa mga haligi ng pintuan
  rationale: Ang מְזוּזוֹת ay tumutukoy sa mga patayong haligi o poste sa magkabilang gilid ng pintuan; malinaw at likas sa Tagalog ang “mga haligi ng pintuan.”
- source_word: בֵּיתֶךָ
  choice: ng iyong bahay
  rationale: Tuwirang pinananatili ng “bahay” ang kongkretong kahulugan ng בַּיִת at ang ikalawang panauhang isahan ng hulapi.
- source_word: וּבִשְׁעָרֶיךָ
  choice: at sa iyong mga tarangkahan
  rationale: Ang שַׁעַר ay karaniwang tumutukoy sa tarangkahan o pasukan. Pinananatili ng “mga tarangkahan” ang anyong maramihan at hindi nito nililimitahan ang kahulugan sa mga poste lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang tuwirang pautos na “Isulat mo” upang maging natural sa Tagalog habang pinananatili ang ikalawang panauhang isahan ng Hebreo. Ang “tarangkahan” ay mas tiyak kaysa “pinto” para sa שַׁעַר at ang talibaba ay nagpapanatili sa saklaw ng kahulugan nito.
