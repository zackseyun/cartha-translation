id: DEU.6.15
reference: Deuteronomy 6:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: tl
  text: Sapagkat si Yahweh na iyong Diyos, na nasa gitna mo, ay Diyos na mapanibughuin[a]. Baka mag-alab laban sa iyo ang galit ni Yahweh na iyong Diyos at lipulin ka niya mula sa balat ng lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Diyos na masigasig.” Binibigyang-diin ng Hebreo ang eksklusibong karapatan ni Yahweh sa katapatan ng kanyang bayang nakipagtipan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa ibabaw ng mukha ng lupa,” isang idyoma para sa ganap na pag-aalis.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabawal sa naunang talata at likas itong pang-ugnay sa makabagong Tagalog.
- source_word: אֵל קַנָּא
  choice: Diyos na mapanibughuin
  rationale: Pinananatili nito ang matinding larawan ng banal na paninibugho at ang eksklusibong karapatan ni Yahweh sa katapatan ng kanyang bayang nakipagtipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Ang hulaping pangalawang panauhang panlalaking isahan ay tuwirang naipahahayag ng “iyong Diyos”; pinananatili rin ang kolektibong-isahang pagtukoy sa Israel.
- source_word: בְּקִרְבֶּךָ
  choice: na nasa gitna mo
  rationale: Ipinahahayag nito ang presensiya ng Diyos sa piling ng kanyang bayan at hindi ang pansariling diwang “nasa loob mo.”
- source_word: פֶּן
  choice: Baka
  rationale: Likas na Tagalog itong pambungad sa babala tungkol sa maaaring kahihinatnan, nang hindi ginagawang tiyak ang ipinahahayag na panganib.
- source_word: יֶחֱרֶה אַף
  choice: mag-alab ... ang galit
  rationale: Pinananatili ang Hebreong talinghaga ng galit na nagliliyab sa malinaw at marangal na Tagalog.
- source_word: בָּךְ
  choice: laban sa iyo
  rationale: Sa konteksto ng galit, adversatibo ang diwa ng pang-ukol at malinaw itong naihahatid ng “laban sa iyo.”
- source_word: וְהִשְׁמִידְךָ
  choice: at lipulin ka niya
  rationale: Malakas at natural na katumbas ang “lipulin” para sa Hiphil ng שׁמד, na nagsasaad ng ganap na pagwasak o pag-aalis.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: mula sa balat ng lupa
  rationale: Karaniwang idyomang Tagalog ito na nagpapanatili sa larawan at puwersa ng ganap na pag-aalis mula sa lupa.
theological_decisions:
- issue: Paglalarawan sa banal na paninibugho
  choice: Diyos na mapanibughuin
  alternative: Diyos na masigasig
  rationale: Ang קַנָּא ay tumutukoy sa eksklusibong pag-angkin ni Yahweh sa katapatan ng kanyang bayang nakipagtipan, hindi sa makasalanang inggit. Pinananatili ng “mapanibughuin” ang tunay na teolohikal na tensiyon sa halip na pahinain o ipaliwanag iyon sa mismong teksto.
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kolektibong-isahang pagtukoy sa Israel sa pamamagitan ng “iyo/mo/ka,” ang personal na pangalang Yahweh, at ang talinghaga ng nag-aalab na galit. Ginamit ang “balat ng lupa” bilang likas na idyomang Tagalog.
