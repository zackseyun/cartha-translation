id: DEU.6.12
reference: Deuteronomy 6:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: tl
  text: Mag-ingat ka, baka makalimutan mo si Yahweh, na siyang naglabas sa iyo mula sa lupain ng Ehipto, mula sa bahay ng mga alipin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas idyomatiko, “mula sa bahay ng pagkaalipin.” Literal sa Hebreo, “mula sa bahay ng mga alipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Mag-ingat ka
  rationale: Ang utos na Niphal kasama ang pariralang לְךָ ay isang personal at mariing babala. Natural sa makabagong Tagalog ang “Mag-ingat ka” at pinananatili nito ang tuwirang panawagan sa isahang kausap.
- source_word: פֶּן תִּשְׁכַּח
  choice: baka makalimutan mo
  rationale: Ipinakikilala ng פֶּן ang panganib na dapat iwasan. Ang “baka” ay natural na katumbas sa Tagalog at pinananatili ang diwa ng babalang “lest,” samantalang tuwirang isinasalin ng “makalimutan” ang pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nakasulat sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר הוֹצִיאֲךָ
  choice: na siyang naglabas sa iyo
  rationale: Ang Hiphil ng יצא ay karaniwang nangangahulugang “maglabas” sa salaysay ng Exodo. Nililinaw ng “siyang” sa natural na Tagalog na si Yahweh ang gumawa nito.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang אֶרֶץ, “lupain,” at ginagamit ang karaniwang makabagong anyong “Ehipto.”
- source_word: מִבֵּית עֲבָדִים
  choice: mula sa bahay ng mga alipin
  rationale: Kongkretong pangmaramihan ang עֲבָדִים, kaya pinananatili ang “mga alipin” sa halip na gawing abstraktong “pagkaalipin.” Pinananatili rin ng “bahay” ang talinghagang nasa Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi nagpapalit ng pangalan ng isang titulo.
- issue: Kahulugan ng עֲבָדִים sa pormula ng Exodo
  choice: mga alipin
  alternative: pagkaalipin; pagkaalipin/bihag
  rationale: Tumutukoy ang konteksto sa aktuwal na kalagayan ng sapilitang paglilingkod sa Ehipto. Pinananatili ng “mga alipin” ang kongkretong pangmaramihang anyo nang hindi itinatanggi ang idyomatikong pagbasa na “pagkaalipin.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang isahang “ka/mo/iyo” upang mapanatili ang 2ms na anyo ng Hebreo, na kolektibong tumutukoy sa Israel. Inilagay ang talababa sa pariralang aktuwal nitong ipinapaliwanag.
