  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: tl
  text: upang itaboy ang lahat ng iyong mga kaaway mula sa harapan mo[a], gaya ng sinabi ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa harapan mo,” isang idyoma para sa pag-aalis sa mga kaaway mula sa daraanan o presensiya ng isang tao.
    reason: cultural_note
  - marker: b
    text: Ang Hebreong pandiwa ay literal na “nagsalita” o “sinabi,” hindi tahasang “nangako”; tinutukoy nito ang naunang salita ni Yahweh na nananatiling may bisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַהֲדֹף
  choice: upang itaboy
  rationale: Ang ל na may infinitive construct ay nagpapahayag ng layunin o bunga na nagpapatuloy mula sa naunang talata. Ang Hiphil ng נדף ay nangangahulugang paalisin o itulak palayo; natural at angkop sa kontekstong militar ang “itaboy.”
- source_word: אֶת
  choice: '[pananda ng tiyak na layon, hindi isinalin]'
  rationale: Walang tuwirang katumbas sa Tagalog ang Hebreong pananda ng tiyak na layon.
- source_word: כָּל
  choice: lahat ng
  rationale: Tuwirang pinananatili nito ang kabuuang saklaw ng כָּל bago ang pangngalang maramihan.
- source_word: אֹיְבֶיךָ
  choice: iyong kaaway
  rationale: Natural na salin ito ng pangngalang may hulaping ikalawang panauhang panlalaking isahan. Ang “iyong” ay nagpapanatili sa isahang pagtukoy sa Israel.
- source_word: מִפָּנֶיךָ
  choice: mula sa harapan mo
  rationale: Pinananatili nito ang Hebreong larawan na literal na “mula sa iyong mukha/harapan” at ang diwa ng pag-aalis sa mga kaaway mula sa daraanan o presensiya ng Israel.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Natural nitong ipinahahayag ang pagtutugma ng mangyayari sa naunang salita ni Yahweh.
- source_word: דִּבֶּר
  choice: sinabi
  rationale: Ang perpektong anyo ay tumutukoy sa nauna nang pagsasalita. Ang “sinabi” ay likas sa Tagalog at hindi dinaragdagan ang pandiwa ng mas tiyak ngunit interpretibong kahulugang “ipinangako.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ito ng banal na pangalang YHWH at hindi pinapalitan ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Lakas ng דִּבֶּר sa konteksto ng tipan
  choice: sinabi
  alternative: ipinangako
  rationale: Pinananatili ng “sinabi” ang karaniwang leksikal na diwa ng דבר at hinahayaang madama sa konteksto ang patuloy na bisa ng naunang salita. Ang “ipinangako” ay posibleng pagpapakahulugan ngunit mas tiyak kaysa sa mismong pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang isahang “mo” na tumutukoy sa Israel bilang isang sambayanan. Ang parirala ay sadyang nananatiling nakaugnay sa naunang talata sa pamamagitan ng “upang.”
