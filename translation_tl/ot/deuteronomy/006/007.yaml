base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: tl
  text: Ituro mong mabuti ang mga ito sa iyong mga anak na lalaki[a]. Pag-usapan mo ang mga ito kapag nakaupo ka sa iyong bahay, kapag naglalakad ka sa daan, kapag humihiga ka, at kapag bumabangon ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “iyong mga anak na lalaki.” Sa kontekstong ito, maaaring saklawin ng tagubilin ang mga anak at sambahayan sa mas malawak na diwa. Ang pandiwang isinaling “ituro mong mabuti” ay literal na may diwang “patalasin,” na ginagamit dito bilang talinghaga para sa masinsin at paulit-ulit na pagtuturo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: Ituro mo ang mga ito nang buong tiyaga
  rationale: Ang pandiwang שׁנן ay literal na kaugnay ng pagpapatalas, ngunit dito ay talinghaga para sa masinsin at paulit-ulit na pagtuturo. Likas sa modernong Tagalog ang napiling salin at napananatili nito ang mariing diwa.
- source_word: לְבָנֶיךָ
  choice: sa iyong mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang בנים na may hulaping nangangahulugang ‘iyong’; kaya pinanatili sa pangunahing teksto ang ‘mga anak na lalaki’ sa halip na gawing pangkalahatang ‘mga anak.’
- source_word: וְדִבַּרְתָּ בָּם
  choice: Banggitin mo ang mga ito
  rationale: Pagkatapos ng דבר, ang בָּם ay likas na nangangahulugang magsalita tungkol sa mga iyon. Ang ‘banggitin’ ay malinaw at maikli, bagaman maaari ring isaling ‘pag-usapan.’
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: kapag nakaupo ka sa iyong bahay
  rationale: Ipinahahayag ng infinitive construct na may ב ang kalagayang temporal at nakagawian.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: kapag naglalakad ka sa daan
  rationale: Pinananatili nito ang kongkretong kahulugan ng הלך at דרך at natural ito sa Tagalog.
- source_word: וּבְשָׁכְבְּךָ
  choice: kapag nahihiga ka
  rationale: Natural na salin ito ng temporal na parirala at maaari nitong tukuyin ang paghiga o pagtulog sa gabi.
- source_word: וּבְקוּמֶךָ
  choice: kapag bumabangon ka
  rationale: Malinaw nitong ipinahahayag ang pagbangon, lalo na mula sa pagkakahiga o pagtulog, at bumabagay sa katapat na ‘nahihiga.’
theological_decisions:
- issue: Ang panlalaking katawagan sa mga tumatanggap ng tagubilin sa tipan
  choice: sa iyong mga anak na lalaki
  alternative: sa iyong mga anak
  rationale: Ang Hebreo ay tahasang panlalaking maramihan. Pinananatili ng pangunahing teksto ang anyong ito, habang ipinapaliwanag sa talababa ang posibleng mas malawak na saklaw sa sambahayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pang-isahang ‘mo/ka’ ayon sa Hebreo. Pinanatili ang magkakaparis na pang-araw-araw na kalagayan—sa bahay at sa daan, sa paghiga at pagbangon—nang walang dagdag na pagpapakahulugang teolohikal.
