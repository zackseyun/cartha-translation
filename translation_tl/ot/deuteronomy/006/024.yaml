  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: tl
  text: At iniutos sa atin ni Yahweh na tuparin ang lahat ng mga tuntuning ito at matakot kay Yahweh na ating Diyos, para sa ikabubuti natin sa lahat ng araw at upang panatilihin tayong buhay, gaya ng sa araw na ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַוֵּנוּ
  choice: At iniutos sa atin
  rationale: Tuwirang ipinapahayag ang utos na ibinigay sa sambayanan; natural sa modernong Tagalog ang hulmaing “iniutos sa atin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng tetragrammaton sa tekstong Hebreo.
- source_word: לַעֲשׂוֹת אֶת כָּל הַחֻקִּים הָאֵלֶּה
  choice: na tuparin ang lahat ng tuntuning ito
  rationale: Ang עשה kaugnay ng mga batas ay natural na “tuparin,” samantalang ang חֻקִּים ay mga itinakdang tuntunin o kautusan.
- source_word: לְיִרְאָה
  choice: at matakot
  rationale: Pinananatili ang pangunahing diwa ng ירא na may paggalang at pagkilala sa kapangyarihan ng Diyos; hindi ito pinapaliit sa “igalang” lamang.
- source_word: לְטוֹב לָנוּ כָּל הַיָּמִים
  choice: para sa ikabubuti natin sa lahat ng panahon
  rationale: Inililipat ang layuning ipinahahayag ng לְ at ang literal na saklaw na “lahat ng mga araw” sa natural na Tagalog.
- source_word: לְחַיֹּתֵנוּ
  choice: upang panatilihin niya tayong buhay
  rationale: 'Ipinapakita ang causative na diwa ng Piel infinitive ng חיה: ang Diyos ang nagpapanatili sa bayan na buhay.'
- source_word: כְּהַיּוֹם הַזֶּה
  choice: gaya ng kalagayan natin sa araw na ito
  rationale: Inihahayag ang paghahambing sa kasalukuyang kalagayan ng bayang nananatiling buhay, hindi lamang ang petsang “ngayon.”
theological_decisions:
- issue: Saklaw ng pagkatakot kay Yahweh
  choice: matakot kay Yahweh na ating Diyos
  alternative: magpitagan kay Yahweh na ating Diyos
  rationale: Pinananatili ang mas malawak at may tensiyong kahulugan ng ירא, na maaaring sumaklaw sa takot, pagpipitagan, at masunuring paggalang.
- issue: Layunin ng mga utos
  choice: para sa ikabubuti natin ... at upang panatilihin niya tayong buhay
  alternative: upang lagi tayong mapabuti at mabuhay
  rationale: Pinananatiling magkahiwalay ang dalawang pariralang layunin sa Hebreo at malinaw na ang Diyos ang gumagawa ng pagpapanatiling buhay.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinili ang “tuntunin” sa halip na teknikal o lumang “palatuntunan,” at pinanatili ang pangalang Yahweh dahil tahasang יהוה ang nasa Hebreo.
