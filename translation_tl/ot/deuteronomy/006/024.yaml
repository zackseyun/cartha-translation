  to: At iniutos sa atin ni Yahweh na tuparin ang lahat ng mga tuntuning ito at matakot kay Yahweh na ating Diyos, para sa ikabubuti natin sa lahat ng araw at upang panatilihin tayong buhay, gaya ng sa araw na ito.
