  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: tl
  text: Matakot ka kay Yahweh na iyong Diyos[a], siya ang paglingkuran mo[b], at sa pangalan niya ka manumpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpitagan kay Yahweh na iyong Diyos.” Saklaw ng pandiwang Hebreo ang mapitagang takot at pagkamangha, hindi lamang sindak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “siya ang sambahin mo.” Karaniwang nangangahulugang “maglingkod” ang pandiwang Hebreo, at sa kontekstong ito ay kasama rito ang paglilingkod na may pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Ang anyong may hulaping pangalawang panauhang panlalaki na isahan ay likas na nangangahulugang “iyong Diyos.”
- source_word: תִּירָא
  choice: katakutan mo
  rationale: Tuwirang pinananatili nito ang saklaw ng ירא, na kinabibilangan ng banal na takot, pagpipitagan, at paghanga, nang hindi ito pinahihina tungo sa paggalang lamang.
- source_word: וְאֹתוֹ
  choice: siya
  rationale: Pinanatili ang tahasang panghalip na layon para sa diin; hindi idinagdag ang “lamang” sapagkat wala itong tahasang katumbas sa talata.
- source_word: תַעֲבֹד
  choice: paglingkuran mo
  rationale: Ang עבד ay pangunahing nangangahulugang maglingkod at, sa kontekstong ito, saklaw nito ang paglilingkod na may pagsamba at katapatan sa tipan.
- source_word: וּבִשְׁמוֹ
  choice: at sa pangalan niya
  rationale: Sa konteksto ng panunumpa, ipinahihiwatig ng ב na ang pangalan niya ang tinatawag na saksi o batayan ng sumpa.
- source_word: תִּשָּׁבֵעַ
  choice: ka manumpa
  rationale: Ang Niphal ng שׁבע ay nangangahulugang manumpa o sumumpa; natural sa Filipino ang “sa pangalan niya ka manumpa.”
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na layon at walang hiwalay na katumbas sa Filipino; naipakikita ang tungkulin nito sa ayos ng pangungusap.
theological_decisions:
- issue: Kung papalambutin ang “matakot” bilang “gumalang” o “magpitagan” sa paglalarawan ng wastong tugon sa Diyos
  choice: Pinanatili ang “katakutan” sa pangunahing teksto.
  alternative: “Igalang nang may pagpipitagan” o “mangilag sa harap”
  rationale: Kasama sa pandiwang Hebreo ang mapitagang takot at paghanga, hindi lamang sindak. Pinananatili ng “katakutan” ang tensiyon ng kabanalan, pagpipitagan, at pananagutan sa tipan.
- issue: Kung isasalin ang עבד bilang “paglingkuran” o “sambahin”
  choice: Isinalin bilang “paglingkuran.”
  alternative: “sambahin”
  rationale: Mas malawak ang “paglingkuran” at tapat sa pangunahing diwa ng salita; sa kontekstong panrelihiyon, kasama rito ang pagsamba ngunit hindi ito nililimitahan sa gawaing liturhiko.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang pautos na anyong “-in mo” upang natural na katawanin ang Hebreong ikalawang panauhang isahan sa kontekstong nag-uutos. Pinanatili ang pangalan na “Yahweh” at ang tatlong magkahanay na utos.
