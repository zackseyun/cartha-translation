base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: tl
  text: Kaya makinig ka, Israel, at ingatan mong gawin ang mga ito, upang maging mabuti ang kalagayan mo at lalo kayong dumami, gaya ng sinabi sa iyo ni Yahweh, ang Diyos ng iyong mga ama, sa lupaing umaapaw sa gatas at pulot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “gaya ng sinabi—o ipinangako—sa iyo ni Yahweh, ang Diyos ng iyong mga ama, tungkol sa isang lupaing umaapaw sa gatas at pulot.” Siksik ang Hebreo; maaaring iugnay ang “lupain” sa lugar ng pagpapala at pagdami, o sa nilalaman ng sinabi ni Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: makinig ka
  rationale: Saklaw ng שׁמע ang pakikinig na may pahiwatig ng pagsunod. Pinananatili ng “makinig” ang pangunahing diwa, habang ang kasunod na utos na gawin ang mga ito ang naghahayag ng pagsunod.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: tiyakin mong gawin ang mga ito
  rationale: Ipinahahayag ng parirala ang maingat na pagtupad. Ang “mga ito” ay likas na tumutukoy sa naunang mga utos at mas natural sa Filipino kaysa sa isahang panghalip.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: upang mapabuti ka
  rationale: Natural na Filipino ito para sa idyomang tumutukoy sa mabuting kalagayan o kapakanan ng Israel, hindi lamang sa moral na kabutihan.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: at lalo kayong dumami
  rationale: Ang רבה ay tumutukoy rito sa malaking pagdami ng bilang. Ginawang maramihan ang panghalip upang maipakita na ang kausap na Israel ay isang sambayanan.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: gaya ng sinabi
  rationale: Pinananatili ang payak na diwa ng “nagsalita/sinabi” at hindi tahasang ginagawang “ipinangako,” bagaman maaaring pahiwatig iyon ng konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Filipino ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: ang Diyos ng iyong mga ninuno
  rationale: Sa modernong Filipino, ang “mga ninuno” ang natural na kolektibong katawagan sa naunang salinlahi. Bagaman literal na “mga ama” ang Hebreo, karaniwang gumaganap ang termino bilang katawagan sa mga ninuno.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: lupaing dinadaluyan ng gatas at pulot
  rationale: Pinananatili nito ang malinaw na larawang Hebreo at ang nakaugaliang paglalarawan sa masaganang lupain.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ang personal na pangalang Yahweh sa halip na ipalit ang titulong “PANGINOON.”
- issue: Kahulugan ng אֲבֹתֶיךָ
  choice: mga ninuno
  alternative: mga ama
  rationale: Literal na panlalaking maramihan ang salita, ngunit sa ganitong pormulang tipan ay tumutukoy ito sa mga ninunong pinangakuan. Ang “mga ninuno” ay natural at hindi nagpapakipot sa reperensiya sa mga agarang ama lamang.
- issue: Ugnayan ng “lupaing dinadaluyan ng gatas at pulot” sa naunang sugnay
  choice: Pinanatili ang siksik na pagkakaugnay sa pamamagitan ng gitling at footnote
  alternative: “gaya ng ipinangako ... tungkol sa lupaing...”
  rationale: 'Siksik at sintaktikong alanganin ang Hebreo: maaaring iugnay ang lupain sa lugar ng pagpapala at pagdami, o sa nilalaman ng sinalita/pangako ni Yahweh. Hindi tahasang nilutas ng pangunahing teksto ang tensiyong ito.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang isahang “ka/iyong” kapag sinusundan ang gramatikal na anyo ng Israel bilang kolektibong persona, ngunit “kayong” sa aktuwal na pagdami upang maging natural ang sanggunian sa buong bayan. Ang gitling bago ang huling parirala ay sadyang nagpapanatili sa siksik at bahagyang malabong ugnayan ng Hebreo.
