id: DEU.6.11
reference: Deuteronomy 6:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בָ֨תִּ֜ים מְלֵאִ֣ים כָּל טוּב֮ אֲשֶׁ֣ר לֹא מִלֵּאתָ֒ וּ/בֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא חָצַ֔בְתָּ כְּרָמִ֥ים וְ/זֵיתִ֖ים אֲשֶׁ֣ר לֹא נָטָ֑עְתָּ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: tl
  text: at mga bahay na puno ng lahat ng mabubuting bagay na hindi mo inilagay roon, mga imbakan ng tubig na inuka sa bato[a] na hindi mo inuka, mga ubasan at mga punong olibo na hindi mo itinanim—at kakain ka at mabubusog[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “mga balon.” Mas tiyak na tumutukoy ang Hebreo sa mga imbakan ng tubig na inuka sa bato.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na anyo ng mga pandiwang Hebreo, “at kumain ka at nabusog”; ngunit ipinagpapatuloy ng mga ito ang pagkakasunod-sunod ng mga mangyayari pagpasok ng Israel sa lupain.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: בָתִּים
  choice: mga bahay
  rationale: Karaniwang kongkretong katumbas ito at angkop sa talaan ng mga ari-ariang matatanggap ng Israel.
- source_word: מְלֵאִים כָּל טוּב
  choice: puno ng lahat ng mabubuting bagay
  rationale: Ipinahahayag nito ang saganang kanais-nais na mga pag-aari at panustos, hindi lamang kabutihang moral.
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: na hindi mo inilagay roon
  rationale: Mas natural ito sa Tagalog kaysa sa literal na 'hindi mo pinuno' at malinaw na ang tinutukoy ay mga laman ng bahay na hindi inilagay ng kausap.
- source_word: בֹרֹת חֲצוּבִים
  choice: mga imbakan ng tubig na inuka sa bato
  rationale: Sa kontekstong ito, ang בֹרֹת ay mga sisidlan o tipunan ng tubig na hinukay o inuka sa bato; inililinaw ng salin ang gamit at paraan ng paggawa.
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: na hindi mo inuka
  rationale: Pinananatili nito ang pag-uulit ng ugat na חצב at ang larawan ng pag-uka sa bato.
- source_word: כְּרָמִים
  choice: mga ubasan
  rationale: Tumutukoy ito sa mga taniman ng ubas, hindi lamang sa indibiduwal na mga puno ng ubas.
- source_word: זֵיתִים
  choice: mga punong olibo
  rationale: Sa konteksto ng mga itinanim, malinaw na mga puno o tanim na olibo ang tinutukoy.
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: na hindi mo itinanim
  rationale: Tuwirang pinananatili ang paulit-ulit na diin sa mga bagay na hindi pinaghirapan ng kausap.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: at kakain ka at mabubusog
  rationale: Ang mga pandiwa ay nagpapatuloy sa pagkakasunod-sunod ng mga mangyayari pagpasok sa lupain; likas sa Tagalog ang tahasang anyong panghinaharap.
theological_decisions:
- issue: Kalikasan ng ipinangakong kasaganaan
  choice: Ilarawan nang payak ang mga materyal na panustos na tatanggapin ng Israel nang hindi nito ginawa o itinanim
  alternative: Idagdag sa talata ang babala laban sa paglimot o ipahiwatig na labag sa batas ang pagkuha sa mga ito
  rationale: Ang talatang ito ay naglilista lamang ng kasaganaan; nasa kasunod na talata ang tahasang babala. Hindi dapat ilipat nang maaga ang babalang iyon.
- issue: Isahang ikalawang panauhan
  choice: Panatilihin ang isahang 'mo' at 'ka'
  alternative: Gawing maramihan ang kausap
  rationale: Isahan ang mga anyong Hebreo, na kumakatawan sa Israel bilang isang bayang kinakausap sa tipan.
- issue: Panahunan ng mga huling pandiwa
  choice: Gamitin ang panghinaharap na 'kakain ka at mabubusog'
  alternative: Gamitin ang pangnagdaan na 'kumain ka at nabusog' o pangkasalukuyang anyo
  rationale: Bagaman anyong qatal ang Hebreo, ipinagpapatuloy nito sa konteksto ang serye ng mga mangyayari sa pagpasok ng Israel sa lupain.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang daloy ng mahabang pangungusap at ang pangwakas na gitling dahil bahagi ang talata ng nagpapatuloy na pahayag. Ginamit ang 'imbakan ng tubig na inuka sa bato' sa halip na teknikal at di-gaanong pamilyar na 'sisterna'.
