  source_fidelity: 'Tapat ang salin sa Hebreo: napapanatili ang talaan ng mga bahay na punô ng mga mabubuting bagay, mga imbakan ng tubig na inuka sa bato, mga ubasan, at mga punong olibo na hindi pinaghirapan ng kausap. Ang panghinaharap na “kakain ka at mabubusog” ay wastong paglilinaw ng daloy ng pangako sa konteksto.'
