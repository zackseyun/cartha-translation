  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֑ר מָ֣ה הָ/עֵדֹ֗ת וְ/הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: tl
  text: 'Kapag tatanungin ka balang araw[a] ng iyong anak na lalaki, na magsasabi[b]: “Ano ang mga patotoo, mga tuntunin, at mga hatol na iniutos sa inyo ni Yahweh na ating Diyos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “bukas”; dito, idyomatikong tumutukoy sa isang panahon sa hinaharap.
    reason: lexical_alternative
  - marker: b
    text: Literal na “na sinasabi.” Ipinakikilala nito ang mismong nilalaman ng tanong.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Ipinakikilala nito ang isang inaasahang pangyayari sa hinaharap sa konteksto ng pagtuturo; mas angkop ang “Kapag” kaysa sa higit na pasubaling “Kung.”
- source_word: יִשְׁאָלְךָ
  choice: tinanong ka
  rationale: Likas at tuwirang salin ng pandiwang “magtanong,” habang pinananatili ang ikalawang panauhang isahan.
- source_word: בִנְךָ
  choice: iyong anak na lalaki
  rationale: Tahasang panlalaking isahan ang Hebreo; pinananatili ito sa halip na gawing walang tiyak na kasarian na “anak.”
- source_word: מָחָר
  choice: balang araw
  rationale: Literal itong “bukas,” ngunit dito ay idyomatikong tumutukoy sa isang panahon sa hinaharap. Likas sa modernong Tagalog ang “balang araw.”
- source_word: לֵאמֹר
  choice: nang ganito
  rationale: Ipinakikilala ng infinitive ang nilalaman ng tanong. Ang “nang ganito” ay natural sa Tagalog; itinatala sa talababa ang mas literal na anyo.
- source_word: מָה
  choice: Ano ang
  rationale: Pinananatili ang tuwirang tanong ng Hebreo at hindi tahasang idinaragdag ang “kahulugan,” kaya nananatili ang maaaring saklaw ng tanong.
- source_word: הָעֵדֹת
  choice: mga patotoo
  rationale: Pinananatili nito ang natatanging diwa ng mga patotoong kaugnay ng tipan at hindi ito isinasama sa isang pangkalahatang katawagang legal.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Likas at malinaw na katawagang Filipino para sa itinakdang mga alituntunin, at naiiba pa rin sa “mga patotoo” at “mga hatol.”
- source_word: הַמִּשְׁפָּטִים
  choice: mga hatol
  rationale: Pinananatili ang legal na diwa ng mga pasiya o kahatulan at ang pagkakaiba ng tatlong katawagang legal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Pinananatili ang unang panauhang maramihang inklusibo at ang ugnayang ipinahahayag ng “aming/ating Diyos”; “ating” ang natural dito sapagkat kabilang ang kausap sa sambayanan.
- source_word: צִוָּה ... אֶתְכֶם
  choice: iniutos sa inyo
  rationale: Pinananatili ng “sa inyo” ang ikalawang panauhang maramihan ng Hebreo, na mahalaga bagaman isahan ang magulang na direktang tinatanong.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kasarian ng בִנְךָ
  choice: iyong anak na lalaki
  alternative: iyong anak
  rationale: Panlalaking isahan ang salita sa pinagmulang Hebreo, kaya hindi ito ginawang neutral sa kasarian.
- issue: Saklaw ng tanong na מָה
  choice: Ano ang mga patotoo...
  alternative: Ano ang kahulugan ng mga patotoo...
  rationale: Hindi tahasang sinasabi ng Hebreo ang “kahulugan.” Ang mas tuwirang anyo ay nagpapanatili sa posibleng tanong tungkol sa kalikasan, nilalaman, o kabuluhan ng mga utos nang hindi pinipili ang isa lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “balang araw” at “nang ganito” para sa likas na daloy, habang pinanatili ang tatlong magkakaibang katawagang legal, ang panlalaking “anak na lalaki,” ang maramihang “sa inyo,” at ang banal na pangalang “Yahweh.”
