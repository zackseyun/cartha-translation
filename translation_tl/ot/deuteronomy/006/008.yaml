  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: tl
  text: Itali mo ang mga ito bilang tanda sa iyong kamay, at magiging mga palamuting pang-noo[a] ang mga ito sa pagitan ng iyong mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pilakterya,” maliliit na lalagyang isinusuot sa mas huling kaugaliang Judio. Bihira ang salitang Hebreo at mas literal na tumutukoy sa mga palamuti o bandang isinusuot sa noo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: Itali mo ang mga ito
  rationale: Ang pandiwa ay nasa sunod-sunod na pahayag ng tagubilin at may hulaping tumutukoy sa maramihang bagay—ang mga salita o utos sa naunang konteksto. Likas at kongkreto sa Tagalog ang “itali,” at pinananatili ng “ang mga ito” ang tinutukoy ng hulapi.
- source_word: לְאוֹת
  choice: bilang tanda
  rationale: Karaniwang nangangahulugang “tanda” o “palatandaan” ang אוֹת. Ang “bilang tanda” ay natural na nagpapahayag ng gamit o katawagan nang hindi ipinapaliwanag nang labis ang simbolismo.
- source_word: עַל יָדֶךָ
  choice: sa iyong kamay
  rationale: Ang payak na kahulugan ng יָד ay “kamay,” bagaman maaari itong tumukoy sa bisig sa ilang konteksto. Pinananatili rito ang tuwirang salita at ang isahang anyo ng kausap sa Hebreo.
- source_word: וְהָיוּ
  choice: at magiging … ang mga ito
  rationale: Ipinagpapatuloy ng pandiwa ang tagubilin at pinananatili ang maramihang simuno. Ang “magiging” ay natural sa modernong Tagalog at hindi ginagawang tahasang utos ang anyong maaaring unawain bilang itinakdang kalagayan.
- source_word: לְטֹטָפֹת
  choice: mga palamuti
  rationale: Bihira at hindi tiyak ang eksaktong tinutukoy ng טֹטָפֹת, ngunit karaniwang inuunawa itong bagay o bandang isinusuot sa noo. Ang “mga palamuti” ay nagpapanatili ng kongkretong larawan nang hindi ipinapasok sa pangunahing teksto ang mas tiyak at mas huling katawagang “mga pilakterya.”
- source_word: בֵּין עֵינֶיךָ
  choice: sa pagitan ng iyong mga mata
  rationale: Tuwiran itong katumbas ng idyomang Hebreo. Pinananatili nito ang larawan at hindi agad pinapalitan ng mas interpretibong “sa iyong noo.”
theological_decisions:
- issue: Kung ang utos ay dapat ipakahulugang literal na gawaing isinasagawa sa katawan, sagisag ng patuloy na pag-alaala, o kapwa literal at sagisag
  choice: Panatilihin ang kongkretong pananalita nang hindi nilulutas ang tanong
  alternative: Isalin ito bilang tahasang metapora ng pag-alaala o bilang tiyak na pagtukoy sa mga pilakterya ng mas huling kaugaliang Judio
  rationale: Gumagamit ang Hebreo ng kongkretong larawan ng kamay at bahagi sa pagitan ng mga mata. Hindi nililinaw ng salin kung ito ay literal lamang, simboliko lamang, o kapwa, kaya nananatili ang tunay na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang isahang “mo/iyong” upang tularan ang isahang anyo ng kausap sa Hebreo, habang ang “mga ito” ay nagpapanatili sa maramihang bagay na tinutukoy. Inilagay ang talababa sa bihira at hindi tiyak na katawagang “mga palamuti.”
