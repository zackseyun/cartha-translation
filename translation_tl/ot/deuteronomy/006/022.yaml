language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן יְהוָ֡ה אוֹתֹ֣ת וּ֠/מֹפְתִים גְּדֹלִ֨ים וְ/רָעִ֧ים בְּ/מִצְרַ֛יִם בְּ/פַרְעֹ֥ה וּ/בְ/כָל בֵּית֖/וֹ לְ/עֵינֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: tl
  text: Nagbigay si Yahweh ng dakila at mapaminsalang[a] mga tanda at kababalaghan sa Ehipto[b], laban sa Faraon at sa buong sambahayan niya, sa harap mismo ng aming mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kakila-kilabot” o “malubha.” Binibigyang-diin ng salitang Hebreo ang mapanirang epekto ng mga tanda at kababalaghan sa Ehipto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “laban sa Ehipto.” Ang pang-ukol sa Hebreo ay maaaring tumukoy sa lugar, ngunit sa konteksto ay maaari ring ipakilala ang Ehipto bilang pinatutungkulan ng mga paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Nagbigay
  rationale: Pinananatili nito ang karaniwang kahulugan ng נתן na “magbigay,” kahit ang pariralang tumutukoy sa mga tanda at kababalaghan ay bahagyang di-karaniwan sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Filipino ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: mga tanda at kababalaghan
  rationale: Ang tambalang ito ay natural at malinaw sa Filipino at pinananatili ang pagkakaiba ng “mga tanda” at “mga kababalaghan.”
- source_word: גְּדֹלִים וְרָעִים
  choice: dakila at mapaminsala
  rationale: Ang “dakila” ay nagsasaad ng laki o tindi, at ang “mapaminsala” ay nagpapahayag ng masamang epekto ng mga gawa sa Ehipto nang hindi ipinahihiwatig na masama sa moral ang Diyos.
- source_word: בְּמִצְרַיִם
  choice: sa Ehipto
  rationale: Pinananatili ang pinakapayak na lokatibong diwa ng pang-ukol ב, habang inilalahad sa talababa ang posibleng diwang “laban sa Ehipto.”
- source_word: בְּפַרְעֹה וּבְכָל־בֵּיתוֹ
  choice: laban sa Faraon at sa buong sambahayan niya
  rationale: Sa konteksto ng mga salot, sina Faraon at ang sambahayan niya ang mga tinatamaan; ang “sambahayan” ay mas natural at mas malawak kaysa literal na “bahay.”
- source_word: לְעֵינֵינוּ
  choice: sa harap mismo ng aming mga mata
  rationale: Natural na idyomang Filipino ito para sa mga pangyayaring tuwirang nasaksihan, at ipinahahayag ng “mismo” ang diin ng Hebreo.
theological_decisions:
- issue: Paglilipat sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito upang hindi mapalitan ng isang titulo.
- issue: Kahulugan ng וְרָעִים bilang paglalarawan sa mga gawa ng Diyos
  choice: mapaminsala
  alternative: masama o kakila-kilabot
  rationale: Binibigyang-diin ng salita rito ang mabigat at mapanirang epekto ng mga tanda at kababalaghan sa Ehipto, hindi ang moral na kasamaan ng Diyos; gayunman, hindi nito pinapahina ang tindi ng paghatol.
- issue: Saklaw ng pang-ukol ב sa בְּמִצְרַיִם
  choice: sa Ehipto
  alternative: laban sa Ehipto
  rationale: Maaaring lokatibo o tumukoy sa sinapit na target ang pang-ukol. Pinananatili sa pangunahing teksto ang mas tuwirang lokatibong pagbasa at itinatala ang alternatibo upang hindi mawala ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sambahayan” sa halip na literal na “bahay” upang malinaw na mga taong kabilang sa tahanan o sambahayan ng Faraon ang tinutukoy. Ang “sa harap mismo ng aming mga mata” ay natural at malinaw sa ordinaryong mambabasa.
