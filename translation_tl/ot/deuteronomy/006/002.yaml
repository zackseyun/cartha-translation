base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: tl
  text: upang matakot ka kay Yahweh na iyong Diyos[a] sa pamamagitan ng pagtupad sa lahat ng kanyang mga tuntunin at mga utos na iniuutos ko sa iyo—ikaw, ang iyong anak, at ang anak ng iyong anak[b]—sa lahat ng araw ng iyong buhay, at upang pahabain ang iyong mga araw.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpitagan kay Yahweh na iyong Diyos.” Ang pandiwang Hebreo ay maaaring maglaman ng takot, pagpipitagan, at pagkamangha.
    reason: lexical_alternative
  - marker: b
    text: Literal na “ikaw, ang iyong anak, at ang anak ng iyong anak.”
    reason: lexical_alternative
  - marker: c
    text: O “upang humaba ang iyong mga araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּירָא
  choice: upang matakot ka
  rationale: Pinananatili ang layuning ipinahihiwatig ng לְמַעַן at ang buong bigat ng ירא, na maaaring tumukoy sa takot na may pagpipitagan at pagkamangha.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na iyong Diyos
  rationale: Ginagamit ang personal na pangalang Yahweh para sa Tetragrammaton at pinananatili ang tipanang ugnayang nasa hulaping 'iyong.'
- source_word: לִשְׁמֹר
  choice: sa pamamagitan ng pagtupad
  rationale: Ipinakikita rito ng pawatas ang paraan kung paano nahahayag ang pagkatakot kay Yahweh; natural sa Tagalog ang 'pagtupad' para sa masunuring pag-iingat ng mga utos.
- source_word: כָּל חֻקֹּתָיו וּמִצְוֺתָיו
  choice: lahat ng kanyang mga tuntunin at mga utos
  rationale: Pinananatili ang pagkakaiba ng חֻקִּים bilang mga itinakdang tuntunin at מִצְוֹת bilang mga utos.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: na iniuutos ko sa iyo
  rationale: Ang kasalukuyan at nagpapatuloy na anyong 'iniuutos' ay angkop sa participle at sa sitwasyon ng pagsasalita.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: ikaw, ang iyong anak, at ang anak ng iyong anak
  rationale: Pinananatili ang tahasang pagbanggit sa tatlong salinlahi at ang literal na 'anak ng iyong anak,' nang hindi nililimitahan sa kasariang maaaring ipahiwatig ng 'apo' sa konteksto.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: sa lahat ng araw ng iyong buhay
  rationale: Malapit sa Hebreo at malinaw na tumutukoy sa buong panahon ng buhay.
- source_word: וּלְמַעַן יַאֲרִכֻן יָמֶיךָ
  choice: at upang humaba ang iyong mga araw
  rationale: Pinananatili ang ikalawang sugnay ng layunin o bunga at ang larawang Hebreo ng paghabang mga araw, sa halip na agad itong ipaliwanag bilang mahabang buhay.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang tekstong Hebreo ay tuwirang gumagamit ng Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng ירא kapag Diyos ang tinutukoy
  choice: matakot
  alternative: magpitagan
  rationale: Pinananatili ng 'matakot' ang teolohikal na tensiyon ng takot, pagpipitagan, at pagkamangha; ipinapaliwanag sa talababa ang mas malawak na saklaw nito nang hindi pinapalambot ang pangunahing teksto.
- issue: Ugnayan ng pagkatakot at pagsunod
  choice: sa pamamagitan ng pagtupad
  alternative: at tuparin
  rationale: Ipinahihiwatig ng לִשְׁמֹר ang paraan o kapahayagan ng pagkatakot kay Yahweh, ngunit hindi ipinapantay nang lubusan ang dalawang konsepto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'Yahweh' bilang personal na pangalan, 'mga tuntunin' at 'mga utos' upang mapanatili ang dalawang terminong legal-tipanan, at mga gitling upang malinaw na maihiwalay ang tatlong salinlahi. Ang lahat ng marker na [a], [b], at [c] ay nasa pangunahing teksto.
