  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּ֥י יְבִיאֲ/ךָ֣ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֜רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע לַ/אֲבֹתֶ֛י/ךָ לְ/אַבְרָהָ֛ם לְ/יִצְחָ֥ק וּֽ/לְ/יַעֲקֹ֖ב לָ֣/תֶת לָ֑/ךְ עָרִ֛ים גְּדֹלֹ֥ת וְ/טֹבֹ֖ת אֲשֶׁ֥ר לֹא בָנִֽיתָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: tl
  text: At kapag dinala ka ni Yahweh na iyong Diyos sa lupain na ipinangako niya sa iyong mga ninuno[a] sa pamamagitan ng panunumpa—kina Abraham, Isaac, at Jacob—na ibibigay niya sa iyo, na may malalaki at magagandang lunsod na hindi mo itinayo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga ama”; sa kontekstong ito, partikular na tinutukoy sina Abraham, Isaac, at Jacob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Ipinakikilala ng parirala ang isang kalagayang mangyayari sa hinaharap; natural sa modernong Tagalog ang “At kapag” at napapanatili nito ang kaugnayan sa naunang pahayag.
- source_word: יְבִיאֲךָ
  choice: dinala ka ... sa
  rationale: Ang Hiphil ng בוא ay may diwang sanhi, “dalhin/papasukin.” Ang “dinala ka ... sa” ay likas sa Tagalog at angkop sa panghinaharap na sugnay na pinangungunahan ng “kapag.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Malinaw na ipinahahayag ang ikalawang panauhang isahan na hulaping paari.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Ang “lupain” ay natural at marangal na katumbas sa konteksto ng lupaing ipinangako, at hindi lamang tumutukoy sa lupa bilang materyal.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: isinumpa niya
  rationale: Pinananatili nito ang tahasang diwa ng panunumpa o panata, hindi lamang pangkalahatang pangako.
- source_word: לַאֲבֹתֶיךָ
  choice: sa iyong mga ninuno
  rationale: Bagaman literal na “mga ama,” ang “mga ninuno” ang natural na katawagan sa modernong Tagalog; pinananatili ng kasunod na pangalan nina Abraham, Isaac, at Jacob ang tiyak na patriyarkal na sanggunian.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kina Abraham, Isaac, at Jacob
  rationale: Ang “kina” ay likas na panandang Tagalog para sa maramihang pangalang pantangi at mahusay na kumakatawan sa inuulit na לְ sa Hebreo nang hindi nagiging mabigat.
- source_word: לָתֶת לָךְ
  choice: na ibibigay sa iyo
  rationale: Ipinahahayag nito ang layon at nilalaman ng sinumpaang pangako sa natural na ayos ng Tagalog.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: malalaki at magagandang lunsod
  rationale: Pinananatili ng “malalaki” ang sukat o kadakilaan at ng “magaganda” ang kanais-nais na kalidad, nang hindi dinaragdagan ang kahulugang “maunlad.”
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: na hindi mo itinayo
  rationale: Tuwiran at idiomatikong salin ng negatibong sugnay na panaguri sa ikalawang panauhang isahan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Personal na pangalan ang nasa pinagmulang teksto. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo; hindi kinakailangang ipasok ang tradisyonal na anyong “Jehova.”
- issue: Saklaw ng לַאֲבֹתֶיךָ
  choice: iyong mga ninuno
  alternative: iyong mga ama
  rationale: Literal na panlalaking maramihan ang Hebreo, ngunit sa modernong Tagalog ang “mga ama” ay madaling maunawaang mga agarang magulang. Ang “mga ninuno” ang malinaw na likas na katumbas, habang tahasang nililinaw ng teksto na ang tinutukoy ay sina Abraham, Isaac, at Jacob.
- issue: Ugnayan ng mga lunsod sa ipinagkaloob na lupain
  choice: na may malalaki at magagandang lunsod
  alternative: at malalaki at magagandang lunsod
  rationale: 'Ang Hebreo ay nagpapatuloy mula sa lupain tungo sa mga lunsod nang walang tahasang katumbas ng “may.” Ginamit ang “na may” para sa malinaw na sintaks sa Tagalog, nang hindi nilulutas nang higit sa kailangan ang ugnayan: kasama sa kaloob na lupain ang mga lunsod na hindi itinayo ng Israel.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lupain” at “lunsod” para sa dignidad ng biblikal na rehistro, ngunit iniwasan ang lipas o labis na pormal na balangkas. Napanatili ang anyong isahan ng “ka/iyo/mo,” ayon sa Hebreo, at ang pangungusap ay sadyang nagtatapos sa kuwit dahil nagpapatuloy ang sintaktikong yunit sa susunod na talata.
