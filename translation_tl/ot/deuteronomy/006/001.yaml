  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: tl
  text: Ito ang utos—ang mga tuntunin at mga hatol—na iniutos ni Yahweh na inyong Diyos na ituro sa inyo, upang tuparin ninyo ang mga iyon sa lupaing tatawirin ninyo upang angkinin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזֹאת
  choice: Ito ang
  rationale: Likas na panimula sa modernong Tagalog; ipinakikilala nito ang bagong bahagi nang hindi nagdaragdag ng tahasang panahong pananda na wala sa Hebreo.
- source_word: הַמִּצְוָה
  choice: ang utos
  rationale: Pinananatili ang isahan bilang kolektibong pamagat na pinalalawak ng sumusunod na mga kategoryang maramihan.
- source_word: הַחֻקִּים
  choice: ang mga tuntunin
  rationale: Nagpapahayag ng mga itinakdang kautusang legal sa malinaw at dignified na modernong Tagalog.
- source_word: וְהַמִּשְׁפָּטִים
  choice: at mga hatol
  rationale: Pinananatili ang legal na diwa ng מִשְׁפָּטִים at ang pagkakaiba nito sa חֻקִּים.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: na inyong Diyos
  rationale: Ang hulaping pangmaramihang ikalawang panauhan ay natural na naipapahayag sa 'inyong Diyos.'
- source_word: לְלַמֵּד אֶתְכֶם
  choice: na ituro sa inyo
  rationale: Tuwirang ipinapahayag ang layunin ng iniutos ni Yahweh, habang pinananatiling bukas sa konteksto ang hindi tahasang binanggit na tagapagturo.
- source_word: לַעֲשׂוֹת
  choice: upang tuparin ninyo ang mga iyon
  rationale: Ang 'tuparin' ay likas sa Tagalog para sa pagsasagawa ng mga legal na tagubilin; ang 'mga iyon' ay tumutukoy sa mga tuntunin at hatol.
- source_word: בָּאָרֶץ אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: sa lupaing tatawirin ninyo
  rationale: Maikli at natural na inilalarawan ang nalalapit na pagtawid patungo sa lupain.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Sinasaklaw ang aktibong pagkuha at paghawak sa lupain na ipinahihiwatig ng ירשׁ sa kontekstong ito.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan ang nasa tekstong Hebreo; pinananatili ng 'Yahweh' ang pagkakakilanlan nito bilang pangalan sa halip na palitan ng titulo.
- issue: Ugnayan ng isahang 'utos' at maramihang 'mga tuntunin at mga hatol'
  choice: Panatilihin ang isahan bilang kolektibong pamagat, kasunod ang mga kategoryang maramihan
  alternative: 'Gawing maramihan ang lahat: ''mga utos, tuntunin, at hatol'''
  rationale: Sinasalamin nito ang sadyang pagkakaiba ng bilang sa Hebreo at hindi pinapantay ang posibleng buod-at-pagpapalawak na kayarian.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinanatili ang legal at tipanang himig nang hindi gumagamit ng labis na arkaikong bokabularyo.
