  source_fidelity: 'Tapat ang salin sa Hebreo: napapanatili ang pambungad na demonstratibo, ang isahang “utos” na sinusundan ng maramihang legal na kategorya, ang layuning “ituro sa inyo,” ang pagsasagawa ng mga utos sa lupain, at ang layuning angkinin ito. Ang “lupaing tatawirin ninyo” ay katanggap-tanggap na maikling Tagalog na pagpapahayag ng pagpasok sa lupain sa pamamagitan ng pagtawid.'
  naturalness: Malinaw, marangal, at natural sa modernong Filipino Tagalog. Ang sintaksis ng “na iniutos ni Yahweh na inyong Diyos na ituro sa inyo” ay nauunawaan nang wasto bilang utos na ituro ang mga tuntunin at hatol.
  terminology: Ang “Yahweh,” “utos,” “mga tuntunin,” at “mga hatol” ay angkop at magkakatugma sa legal-tipanang rehistro. Ang “tuparin” ay isang natural na paraan upang ilarawan ang paggawa o pagsasagawa ng mga kautusan.
