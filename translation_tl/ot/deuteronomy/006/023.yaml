    text: 'O: “sa ating mga ninuno.” Sa literal: “sa ating mga ama.”'
    reason: lexical_alternative
  revision_rationale: Inalis ang hindi nasa tekstong “rito.” Pinalitan ang potensiyal na malabong “isinumpa niyang ibibigay” ng “ipinangako niya sa pamamagitan ng panunumpa,” na malinaw na naghahatid ng kahulugan ng נִשְׁבַּע nang hindi binabawasan ang tipanang bigat nito. Ibinalik ang “mga ama” sa pangunahing teksto at inilagay ang “mga ninuno” bilang alternatibo sa talababa.
