- from: At inilabas niya tayo mula roon upang dalhin tayo rito at ibigay sa atin ang lupaing isinumpa niyang ibibigay sa ating mga ninuno.[a]
  to: At inilabas niya tayo mula roon upang dalhin tayo at ibigay sa atin ang lupain na ipinangako niya sa pamamagitan ng panunumpa sa ating mga ama.[a]
  rationale: Inalis ang hindi nasa tekstong “rito.” Pinalitan ang potensiyal na malabong “isinumpa niyang ibibigay” ng “ipinangako niya sa pamamagitan ng panunumpa,” na malinaw na naghahatid ng kahulugan ng נִשְׁבַּע nang hindi binabawasan ang tipanang bigat nito. Ibinalik ang “mga ama” sa pangunahing teksto at inilagay ang “mga ninuno” bilang alternatibo sa talababa.
