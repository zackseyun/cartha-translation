base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: tl
  text: At inilabas niya tayo mula roon upang dalhin tayo at ibigay sa atin ang lupain na ipinangako niya sa pamamagitan ng panunumpa sa ating mga ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sa ating mga ninuno.” Sa literal: “sa ating mga ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוֹתָנוּ הוֹצִיא
  choice: At inilabas niya tayo
  rationale: Pinananatili ang pagpapatuloy ng salaysay sa וְ at ang Hiphil na diwa ng יצא bilang pagpapalabas; natural sa Tagalog ang ayos na pandiwa muna.
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Tuwirang locative na tumutukoy sa lugar na pinanggalingan, ang Ehipto sa konteksto.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw at marangal na panandang layunin sa makabagong Tagalog.
- source_word: הָבִיא אֹתָנוּ
  choice: dalhin tayo rito
  rationale: Ang Hiphil ng בוא ay nagpapahiwatig ng pagdadala papasok. Ang 'rito' ay likas na katapat ng naunang 'mula roon' at ang pananaw ng nagsasalita ay nasa lupaing pinasok, bagaman hindi tahasang may salitang 'rito' sa Hebreo.
- source_word: לָתֶת לָנוּ
  choice: ibigay sa atin
  rationale: Tuwirang ipinahahayag ang kasunod na layunin ng pagdadala sa Israel.
- source_word: אֶת־הָאָרֶץ
  choice: ang lupain
  rationale: Ang 'lupain' ay natural at tiyak sa tipang konteksto, at tumutukoy sa lupaing ipinangako.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: na isinumpa niyang ibibigay
  rationale: Dahil karaniwang nangangailangan ang Tagalog na 'isumpa' ng nilalaman ng sumpa, ipinahahayag ang ipinahihiwatig na pagbibigay habang pinananatili ang bigat ng panunumpa, hindi lamang pangako.
- source_word: לַאֲבֹתֵינוּ
  choice: sa ating mga ninuno
  rationale: Sa modernong Tagalog, ang 'mga ninuno' ang natural na kolektibong katawagan sa mga naunang ama ng Israel; inilalagay sa talababa ang literal na anyong panlalaki.
theological_decisions:
- issue: Panlalaking tipanang pagtukoy sa לַאֲבֹתֵינוּ
  choice: sa ating mga ninuno
  alternative: sa ating mga ama
  rationale: Bagaman literal na 'mga ama' ang Hebreo at maaaring tumukoy sa mga patriyarka, ang 'mga ninuno' ang mas natural na katawagan sa Filipino nang hindi itinatanggi ang orihinal na anyong panlalaki; pinananatili iyon sa talababa.
- issue: Wika ng tipanang panunumpa sa נִשְׁבַּע
  choice: isinumpa niyang ibibigay
  alternative: ipinangako niyang ibibigay
  rationale: Pinananatili ng 'isinumpa' ang tahasang panunumpa at tipanang bigat ng Hebreo; ang 'ipinangako' lamang ay maaaring magpahina rito.
- issue: Ugnayan ng paglalabas at pagdadala sa loob
  choice: inilabas niya tayo ... upang dalhin tayo rito
  alternative: inilabas niya tayo ... upang dalhin tayo
  rationale: Ipinakikita ang layuning hindi lamang paglaya mula sa Ehipto kundi pagpasok sa lupaing tipan, habang pinananatili ang retorikal na pagtutumbas ng יצא at בוא.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tayo/atin' dahil kabilang ang kinakausap sa pangkat ng nagsasalita. Iniwasan ang sobrang literal na 'mga ama' sa pangunahing teksto ngunit pinanatili ito sa talababa.
