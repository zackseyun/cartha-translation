  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: tl
  text: At ibigin mo si Yahweh, ang iyong Diyos, nang buong puso mo, nang buong kaluluwa mo[a], at nang buong lakas mo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong nefesh na isinaling “kaluluwa” ay maaari ring mangahulugang “buhay” o “sarili.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong me’od na isinaling “lakas” ay kaugnay ng diwang “lubha” o “kasaganaan” at maaaring tumukoy sa lakas, tindi, kakayahan, o mga tinataglay na yaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: At ibigin mo
  rationale: Ang Qal perfect na may pang-ugnay ay may puwersang pautos sa kontekstong ito. Ang “ibigin mo” ay natural at marangal na utos sa Filipino, samantalang pinananatili ng “At” ang ugnayan sa naunang talata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, iisa ang tinutukoy rito. Likas sa Filipino ang pariralang “si Yahweh na iyong Diyos.”
- source_word: בְּכָל
  choice: nang buong
  rationale: Ipinahahayag ng konstruksyon ang ganap na pag-uukol ng sarili. Ang inulit na “nang buong” ay nagpapanatili sa diin at balangkas ng Hebreo.
- source_word: לְבָבְךָ
  choice: puso mo
  rationale: Saklaw ng Hebreong לֵבָב ang kalooban, pag-iisip, at panloob na pagkatao, hindi lamang damdamin. Pinananatili ng “puso” ang malawak at nakaugaliang talinghaga.
- source_word: נַפְשְׁךָ
  choice: kaluluwa mo
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa kaluluwa, buhay, o buong sarili. Ang “kaluluwa” ay maikli at nakaugaliang salin, habang inilalahad sa talababa ang mas malawak na saklaw nito.
- source_word: מְאֹדֶךָ
  choice: lakas mo
  rationale: Ang מְאֹד, na karaniwang may diwang “lubha” o “kasaganaan,” ay ginagamit dito bilang pangngalan para sa kabuuang kakayahan, lakas, o yaman ng isang tao. Ang “lakas” ang pinakanatural na maikling katumbas sa Filipino, at pinananatili sa talababa ang lawak ng kahulugan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Ang ugnayan ng puso, kaluluwa, at lakas
  choice: Pinanatili bilang tatlong magkakapatong na paglalarawan sa buong pagkatao
  alternative: Ituring ang mga ito bilang tatlong mahigpit na magkakahiwalay na sangkap ng tao
  rationale: Hindi kinakailangang naghahati ang Hebreo ng tao sa magkakahiwalay na bahagi; sama-samang idinidiin ng mga termino ang lubos na pag-ibig at katapatan. Hindi nilulutas ng salin ang likas na pagsasanib ng kanilang mga kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “nang buong” upang maihatid ang ritmo at diin ng Hebreo. Ginamit ang “ibigin” sa halip na mas karaniwang “mahalin” dahil ang una ay angkop sa marangal na rehistrong biblikal ngunit nananatiling malinaw sa ordinaryong mambabasa.
