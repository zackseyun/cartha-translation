  text: לֹ֣א תְנַסּ֔וּ אֶת יְהוָ֖ה אֱלֹהֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר נִסִּיתֶ֖ם בַּ/מַּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/016.yaml
  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: tl
  text: Huwag ninyong subukin si Yahweh na inyong Diyos,[a] gaya ng pagsubok ninyo sa kanya sa Masah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Huwag ninyong ilagay sa pagsubok si Yahweh na inyong Diyos.”'
    reason: lexical_alternative
  - marker: b
    text: Ang Masah ang lugar sa ilang kung saan sinubok ng Israel si Yahweh (Exodo 17:1–7). Ang pangalang “Masah” ay kaugnay ng salitang nangangahulugang “pagsubok.”
    reason: cross_reference
lexical_decisions:
- source_word: לֹא תְנַסּוּ
  choice: Huwag ninyong subukin
  rationale: Ang לֹא kasama ng Piel imperfect na pangalawang panauhang maramihan ay naghahayag ng pagbabawal. Natural sa modernong Tagalog ang “Huwag ninyong,” at pinananatili ng “subukin” ang diwa ng pagsasailalim sa Diyos sa isang pagsubok.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: na inyong Diyos
  rationale: Tumpak na ipinapahayag ang anyong construct na may hulaping pangalawang panauhang maramihan; ang pang-ugnay na “na” ay natural pagkatapos ng pangalang Yahweh.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Ipinakikilala nito ang paghahambing sa naunang pangyayari at natural ang pagkakasabi sa Tagalog.
- source_word: נִסִּיתֶם
  choice: pagsubok ninyo
  rationale: Inuulit ang parehong ugat na נסה upang mapanatili ang sadyang ugnayang leksikal sa תְנַסּוּ. Ang nominalisadong ayos ay natural sa pariralang “gaya ng.”
- source_word: בַּמַּסָּה
  choice: sa Masah
  rationale: Pangalan ito ng lugar at kaya isinasatitik sa halip na isalin; ang kahulugan at salaysay na kaugnay nito ay inilalagay sa talababa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong gaya ng “Panginoon” at hindi nag-aangkat ng kapalit na katawagan.
- issue: Saklaw ng pandiwang נסה
  choice: subukin
  alternative: ilagay sa pagsubok / hamunin
  rationale: Ang “subukin” ay sapat na malawak upang mapanatili ang babala laban sa paglalagay sa Diyos sa isang pagsubok nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na interpretasyong “hamunin.”
- issue: Pagpapaliwanag sa Masah
  choice: Panatilihin ang pangalan ng lugar sa pangunahing teksto
  alternative: sa lugar ng pagsubok / sa Masah, ang lugar ng pagsubok
  rationale: Pangalan ng lugar lamang ang tahasang nasa Hebreo. Ang pagpapalawak sa pangunahing teksto ay magdaragdag ng paliwanag; mas angkop itong ilagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo” ayon sa mga anyong 2mp sa Hebreo. Inulit sa salin ang ideya ng “subok” sa dalawang anyo ng iisang pandiwang Hebreo upang mapanatili ang retorikal na ugnayan.
