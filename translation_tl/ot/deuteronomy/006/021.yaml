base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: tl
  text: 'Pagkatapos[a], sabihin mo sa iyong anak na lalaki: ‘Kami ay mga alipin ng Paraon sa Ehipto, at inilabas kami ni Yahweh mula sa Ehipto sa pamamagitan ng makapangyarihang kamay[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “At sabihin mo.” Maaaring simpleng mangahulugang “at” ang pang-ugnay na Hebreo; ipinakikita ng “pagkatapos” ang pagkakasunod ng tagubilin mula sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa pamamagitan ng malakas na kamay.” Ang idyomang Hebreo ay tumutukoy sa makapangyarihang gawa ni Yahweh sa pagliligtas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Pagkatapos, sasabihin mo
  rationale: Ipinagpapatuloy ng ו ang sunod-sunod na tagubilin mula sa naunang talata. Nililinaw ng “Pagkatapos” ang pagkakasunod, habang pinananatili ng “sasabihin mo” ang direktibong diwa.
- source_word: לְבִנְךָ
  choice: sa iyong anak
  rationale: Ang בֵּן ay panlalaking isahan at tumutukoy rito sa anak na lalaki; sa natural na Tagalog, ang “anak” ay karaniwang salita at hindi kailangang gawing tahasang “anak na lalaki” maliban kung mahalaga ang pagtatangi sa kasarian.
- source_word: עֲבָדִים
  choice: mga alipin
  rationale: Sa konteksto ng Exodo, tumutukoy ito sa mga taong nasa sapilitang pagkaalipin, kaya mas tumpak ang “mga alipin” kaysa sa mas banayad na “mga lingkod.”
- source_word: הָיִינוּ לְפַרְעֹה
  choice: alipin kami ng Paraon
  rationale: Ipinahahayag ng לְ ang kaugnayan ng pagpapasakop o pagmamay-ari. Natural na ipinapakita ito sa Tagalog ng “alipin … ng Paraon.”
- source_word: בְּמִצְרָיִם
  choice: sa Ehipto
  rationale: Tuwirang lokatibong gamit ng בְּ.
- source_word: וַיּוֹצִיאֵנוּ
  choice: at inilabas kami
  rationale: Ang hiphil ng יצא ay “magpalabas” o “ilabas.” Ang “inilabas kami” ay natural at nagpapanatili sa Diyos bilang gumagawa ng pagliligtas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Ipinapakita ng מִן ang pinagmulan; malinaw at natural ang “mula sa Ehipto.”
- source_word: בְּיָד חֲזָקָה
  choice: sa pamamagitan ng makapangyarihang kamay
  rationale: Pinananatili ang metaporang “kamay,” samantalang ipinapahayag ng “makapangyarihan” ang diwa ng חָזָק bilang makapangyarihang pagkilos ng pagliligtas.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalan sa halip na palitan ng titulong “ang PANGINOON.”
- issue: Lakas ng kahulugan ng עֲבָדִים
  choice: mga alipin
  alternative: mga lingkod
  rationale: Binibigyang-diin ng konteksto ang pagkakaalipin ng Israel sa ilalim ng Paraon; pinananatili ng “mga alipin” ang bigat ng kanilang kalagayan at ng pagliligtas sa kanila.
- issue: Idiomang בְּיָד חֲזָקָה
  choice: sa pamamagitan ng makapangyarihang kamay
  alternative: sa pamamagitan ng malakas na kamay
  rationale: Ang “makapangyarihang kamay” ay natural sa Tagalog at malinaw na tumutukoy sa makapangyarihang gawa ng Diyos, habang pinananatili ang larawang Hebreo ng kamay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Paraon” at “Ehipto,” na pamilyar sa tradisyong biblikal sa Tagalog. Pinanatili ang konkretong larawang “kamay” ngunit ginawang natural ang buong idyoma.
