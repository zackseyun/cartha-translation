base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: tl
  text: Mahigpit ninyong sundin[a] ang mga utos ni Yahweh na inyong Diyos, at ang kanyang mga patotoo[b] at mga tuntunin na iniutos niya sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “masikap ninyong sundin” o “maingat ninyong tuparin.” Inuulit sa Hebreo ang salitang-ugat ng pandiwa upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga patotoo” ay maaari ring isaling “mga tuntunin ng tipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: Tiyakin ninyong susundin
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa utos. Likas sa modernong Tagalog ang “tiyakin ninyong susundin” at ipinapahayag nito kapwa ang mariing pag-uutos at ang maingat na pagtupad.
- source_word: מִצְוֺת
  choice: mga utos
  rationale: Karaniwang tumutukoy ang מִצְוָה sa mga obligasyong iniutos; malinaw at natural sa Tagalog ang “mga utos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Pinananatili nito ang tipikal na pormulang pangtipan na “Yahweh na inyong Diyos” at ang maramihang kausap.
- source_word: עֵדֹתָיו
  choice: kanyang mga patotoo
  rationale: Ang literal na “mga patotoo” ay nagpapanatili sa natatanging legal at pangtipang katawagan, bagaman maaari rin itong unawain bilang mga kapasyahan o mga itinakda sa tipan.
- source_word: חֻקָּיו
  choice: mga tuntunin
  rationale: Ang חֹק/חֻקָּה ay tumutukoy sa mga itinakdang alituntunin o batas. Ang “mga tuntunin” ay pormal ngunit madaling maunawaan at naihihiwalay sa “mga utos” at “mga patotoo.”
- source_word: אֲשֶׁר צִוָּךְ
  choice: na iniutos niya sa inyo
  rationale: Pinakamalikas na inuugnay ang sugnay sa lahat ng naunang legal na katawagan. Ang “sa inyo” ay kaayon ng maramihang kausap sa talata at sa mas malawak na konteksto.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng אֲשֶׁר צִוָּךְ
  choice: Iniuugnay sa mga utos, patotoo, at tuntunin bilang isang kabuuan
  alternative: Iugnay lamang sa pinakamalapit na “mga tuntunin”
  rationale: Bagaman maaaring magkaroon ng pormal na kalabuan ang relative clause, mas natural sa balangkas at konteksto na saklaw nito ang buong serye ng mga obligasyong pangtipan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang maramihang “ninyo/inyo” para sa kausap na Israel. Pinanatili ang tatlong magkakaibang katawagang legal—utos, patotoo, at tuntunin—nang hindi pinapantay ang kanilang kahulugan.
