  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: tl
  text: 'Makinig ka, Israel: Si Yahweh, ang ating Diyos—si Yahweh ay iisa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Si Yahweh ang ating Diyos—si Yahweh lamang”; o, “Si Yahweh, ang ating Diyos, ay iisang Yahweh.” Maikli ang pagkakabuo ng Hebreo at maaari itong unawain sa higit sa isang paraan.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Makinig ka
  rationale: Isang pang-isahang pautos na nakatuon sa Israel bilang isang sambayanan. Likas sa modernong Filipino ang “Makinig ka” at naipahihiwatig nito hindi lamang ang pagdinig kundi ang pagbibigay-pansin at pagsunod.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pangalan ng bayang tipan; pinanatili sa karaniwang anyong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Bagaman maramihan ang anyo ng אֱלֹהִים, pang-isahan ang gamit nito rito para sa Diyos ng Israel; ang hulaping unang panauhang maramihan ay “ating.”
- source_word: אֶחָד
  choice: iisa
  rationale: Pinananatili ang pangunahing diwang “one.” Ang “iisa” ay natural sa Filipino bilang panaguri at hindi tahasang nagpapasya kung ang diin ay pagkakaisa, pagiging natatangi, o pagiging tanging Diyos.
theological_decisions:
- issue: Sintaksis at diwa ng huling sugnay ng Shema
  choice: Si Yahweh na ating Diyos, si Yahweh ay iisa
  alternative: Si Yahweh ang ating Diyos, si Yahweh lamang; o, Si Yahweh na ating Diyos ay iisang Yahweh
  rationale: Walang tahasang pandiwa ang maikling Hebreong pahayag, kaya higit sa isang pagkakaugnay ng mga salita ang posible. Pinananatili ng pangunahing salin ang tradisyonal na pagpapahayag ng pagiging isa ng Diyos nang hindi ipinapasok sa teksto ang mas tiyak na pagpapakahulugang “lamang”; inilalahad sa talababa ang ibang kapani-paniwalang pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Makinig ka” sa halip na mas lumang “Dinggin mo,” at pinanatili ang “Yahweh” bilang personal na pangalan. Ang tandang talababa [a] ay inilagay sa mismong teksto.
