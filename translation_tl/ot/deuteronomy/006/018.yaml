- from: Gawin mo ang matuwid at mabuti sa paningin ni Yahweh, upang maging mabuti ang kalagayan mo at makapasok ka at maangkin[a] ang mabuting lupain na isinumpa ni Yahweh sa iyong mga ninuno na ibibigay niya.
