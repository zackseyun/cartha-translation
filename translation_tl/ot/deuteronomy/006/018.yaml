source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: tl
  text: Gawin mo ang matuwid at mabuti sa paningin ni Yahweh, upang maging mabuti ang kalagayan mo at makapasok ka at maangkin[a] ang mabuting lupain na ipinangako ni Yahweh sa iyong mga ama sa pamamagitan ng panunumpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “manahin.” Ang pandiwang Hebreo ay maaaring mangahulugang “manahin,” “angkinin,” o “ariin.” Dito, tumutukoy ito sa pagpasok ng Israel at pag-angkin sa lupaing ipinangako sa pamamagitan ng panunumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gawin mo
  rationale: Ang anyong pandiwa sa kontekstong ito ng tagubilin ay may puwersa ng utos. Ang “Gawin mo” ay likas sa makabagong Tagalog at pinananatili ang tuwirang pagtukoy sa iisang kausap.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: ang matuwid at mabuti
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit hindi lubos na magkaparehong pagpapahalaga: yaong tama o matuwid, at yaong mabuti.'
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Likas na katumbas ito ng Hebreong idyomang tumutukoy sa pagsusuri o paghatol ni Yahweh, habang pinananatili ang metapora ng “paningin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: upang maging mabuti ang kalagayan mo
  rationale: Ipinahahayag nito ang mabuting kahihinatnan o kapakanan nang hindi nililimitahan ang diwa sa materyal na kasaganaan.
- source_word: וּבָאתָ
  choice: makapasok ka
  rationale: Sa konteksto, tumutukoy ito sa pagpasok ng Israel sa lupain; ang anyong “makapasok” ay angkop sa layunin o resultang ipinakikilala ng לְמַעַן.
- source_word: וְיָרַשְׁתָּ
  choice: maangkin
  rationale: Maaaring mangahulugan ang ירשׁ ng magmana, magmay-ari, o umangkin. Dito, ang “maangkin” ay malinaw na tumutukoy sa aktuwal na pagpasok at pagtatamo ng lupain, habang inilalagay sa talababa ang tunay na alternatibong “manahin.”
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ang mabuting lupain
  rationale: Tuwirang pinananatili ang pang-uri ng Hebreo at iniiwasang paliitin ito sa pagiging mataba o kaaya-aya lamang ng lupain.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ
  choice: na isinumpa ni Yahweh sa iyong mga ninuno na ibibigay niya
  rationale: Pinananatili ang puwersa ng panunumpa sa נִשְׁבַּע. Nililinaw sa natural na Tagalog ang ipinahiwatig na nilalaman ng sumpa—ang pagbibigay ng lupain—nang hindi ginagawang isang payak na pangako lamang.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalang tipan sa halip na palitan ng titulo.
- issue: Saklaw ng לַאֲבֹתֶיךָ
  choice: sa iyong mga ninuno
  alternative: sa iyong mga ama
  rationale: Bagaman literal na “mga ama” ang anyong panlalaki, sa kontekstong ito tumutukoy ito sa mga naunang salinlahing pinangakuan ng lupain, lalo na sa mga patriyarka. Ang “mga ninuno” ay natural at hindi nag-aalis sa makasaysayang sanggunian.
- issue: Kahulugan ng וְיָרַשְׁתָּ
  choice: maangkin
  alternative: manahin
  rationale: Hindi nilulutas nang tahimik ang lawak ng pandiwa. Pinili sa pangunahing teksto ang kahulugang pinakaangkop sa pagpasok at pagtatamo ng Israel sa lupain, at pinanatili sa talababa ang lehitimong diwang “manahin.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang isahang “mo/ka” upang tumpak na katawanin ang isahang kausap sa Hebreo. Iniwasan ang sobrang pormal o lipas na pananalita, habang pinanatili ang himig ng tipang utos at pangako.
