  source_fidelity: Tapat ang salin sa Hebreo. Ang “Huwag kayong sumunod sa” ay angkop na pagbabawal para sa לֹא תֵלְכוּן אַחֲרֵי at naipahihiwatig ang idyomatikong diwa ng pagtalima/pagpanig. Ang “ibang mga diyos” ay wastong katumbas ng אֱלֹהִים אֲחֵרִים. Ang kasunod na pariralang “sa mga diyos ng mga bayang nakapaligid sa inyo” ay natural na nagpapakilala sa pangkat ng mga diyos na tinutukoy ng partitibong/appositional na מֵאֱלֹהֵי.
