  terminology: Ang “sumunod sa” ay mas angkop kaysa literal na “lumakad sa likuran ng” at hindi rin labis na nagsasara ng kahulugan gaya ng “sumamba.” Ang “mga diyos” at “ibang mga diyos” ay malinaw at terminolohikong pare-pareho. Wasto ang pangmaramihang “kayo.”
