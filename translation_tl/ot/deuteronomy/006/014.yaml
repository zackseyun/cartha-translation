  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: tl
  text: Huwag kayong sumunod sa ibang mga diyos[a]—sa mga diyos ng mga bayang nakapaligid sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag kayong sumunod sa alinman sa ibang mga diyos ng mga bayang nakapaligid sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: Huwag kayong sumunod sa
  rationale: Ang לֹא na sinusundan ng imperpektong pandiwa ay naghahayag ng pagbabawal. Ang idyomang הלך אחרי ay likas na isinasalin sa Filipino bilang “sumunod sa,” na nagpapahiwatig ng pagtataguyod at katapatan, hindi lamang ng literal na paglakad sa likuran.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang tinutukoy nito ang mga diyos na iba sa Diyos ng Israel. Hindi idinagdag ang di-tiyak na kahulugang “dayuhan.”
- source_word: מֵאֱלֹהֵי
  choice: sa mga diyos ng
  rationale: Ang מִן ay maaaring unawaing partitibo (“kabilang sa/mula sa mga diyos ng”), ngunit sa konteksto ay likas sa Filipino na ipakilala ang kasunod na parirala bilang paglilinaw kung aling ibang mga diyos ang tinutukoy.
- source_word: הָעַמִּים
  choice: mga bayan
  rationale: Ang עַמִּים ay tumutukoy sa magkakaibang pangkat ng mga tao. Ang “mga bayan” ay natural at dignidad na katumbas sa modernong Filipino; maaari rin itong isaling “mga bansa.”
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: nakapaligid sa inyo
  rationale: Pinananatili nito ang lokal at heograpikong diwa ng mga kalapit na bayan sa paligid ng Israel.
theological_decisions:
- issue: Saklaw ng pagbabawal
  choice: Isinalin ang idyoma bilang “sumunod sa,” na tumutukoy sa pagpanig at katapatan sa ibang mga diyos.
  alternative: Literal na “lumakad sa likuran ng,” o mas tahasang “sumamba sa.”
  rationale: Sa Deuteronomio, ang הלך אחרי ay karaniwang tumutukoy sa relihiyosong pagsunod at katapatan. Ang “sumunod sa” ay malinaw sa Filipino ngunit hindi nililimitahan ang kahulugan sa isang partikular na gawaing tulad lamang ng pagsamba.
- issue: Ugnayan ng “ibang mga diyos” at “mga diyos ng mga bayan”
  choice: Ginamit ang gatlang upang ipakitang nililinaw ng ikalawang parirala ang una.
  alternative: Isalin ang מִן nang tahasan bilang “mula sa” o “kabilang sa.”
  rationale: Pinananatili nito ang ugnayang nagpapakilala sa mga diyos na tinutukoy habang iniiwasan ang di-likas o posibleng nakalilitong konstruksiyon sa Filipino.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang pangmaramihang “kayo,” ayon sa anyong 2mp ng Hebreo, at “sumunod sa” bilang natural na katumbas ng Hebreong idyoma.
