base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: tl
  text: At magiging katuwiran ito para sa atin kung maingat nating tutuparin ang buong utos na ito[a] sa harap ni Yahweh na ating Diyos, gaya ng iniutos niya sa atin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng utos na ito.” Pang-isahan ang “utos” sa Hebreo at malamang na tumutukoy ito sa buong tagubilin bilang isang nagkakaisang kabuuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: at magiging katuwiran ito
  rationale: Ang צְדָקָה ay tumutukoy sa pagiging matuwid o sa bagay na tama. Pinananatili ng “katuwiran” ang moral at pangtipang diwa nang hindi ito nililimitahan sa panlipunang katarungan lamang.
- source_word: תִּהְיֶה לָּנוּ
  choice: magiging ... ito para sa atin
  rationale: Pinananatili nito ang predikatibong ayos ng Hebreo at iniiwasang idagdag ang teknikal na ideya ng “ibibilang” na hindi tahasang nasa teksto.
- source_word: כִּי
  choice: kung
  rationale: Sa kontekstong ito, ipinakikilala ng כִּי ang kundisyon kung kailan magiging katuwiran ito para sa Israel.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: iingatan nating tuparin
  rationale: Ipinahahayag ng שׁמר ang maingat na pagbabantay o pagsunod, samantalang ang עשה ay ang aktuwal na paggawa. Likas sa modernong Tagalog ang “ingatang tuparin” at naipapakita nito ang dalawang sangkap.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: ang buong utos na ito
  rationale: Ang pang-isahang מִצְוָה kasama ng כָּל ay malamang na tumutukoy sa tagubilin bilang isang nagkakaisang kabuuan; natural itong naihahayag ng “buong utos na ito.”
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Pinananatili ng parirala ang diwa ng pamumuhay at pagsunod sa presensiya at ilalim ng paningin ng Diyos.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh na ating Diyos
  rationale: Isinasalin ang banal na pangalan bilang “Yahweh” at pinananatili ang pangtipang ugnayang ipinahahayag ng “ating Diyos.”
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: gaya ng iniutos niya sa atin
  rationale: Tumutukoy ito sa utos na naibigay na at nananatiling batayan ng kasalukuyang pagsunod.
theological_decisions:
- issue: Kahulugan ng katuwiran sa konteksto ng pagsunod sa tipan
  choice: Sinasabi ng talata na ang maingat na pagtupad sa utos ay magiging “katuwiran” para sa Israel, nang hindi ipinapaliwanag ang isang mas huling teknikal na mekanismong teolohikal.
  alternative: Isalin bilang “katarungan” o tahasang sabihing “ibibilang na katuwiran.”
  rationale: May tunay na kaugnayan sa teksto ang pagsunod sa tipan at katuwiran, ngunit hindi nito tahasang nilulutas kung paano ito iuugnay sa mga susunod na pormulasyong sistematiko. Kaya pinananatili ang tensiyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “katuwiran” bilang pamilyar na terminong biblikal, at ang “iingatan nating tuparin” upang mapanatili ang maingat na pagsunod na nasa dalawang pandiwang Hebreo.
