  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: tl
  text: At ang mga salitang ito na iniuutos ko sa iyo ngayon ay dapat nasa iyong puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa ibabaw ng iyong puso.” Isa itong idyoma para sa patuloy na pag-iingat ng mga salitang ito sa isip, kalooban, at panloob na buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: ay dapat manatili
  rationale: Ipinahahayag ng anyong pandiwa sa kontekstong ito ang nararapat na patuloy na kalagayan ng mga salita. Likas sa Filipino ang “dapat manatili” at hindi lamang pansamantalang “mapunta” sa puso.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Pinananatili ng “mga salita” ang karaniwang kahulugan ng דְּבָרִים at ang tuwirang pagtukoy sa mga salitang ipinahayag ni Moises, nang hindi ito agad pinapakahulugang “mga utos.”
- source_word: אֲשֶׁר
  choice: na
  rationale: Ang “na” ang likas na pang-ugnay sa modernong Filipino para sa sugnay na naglalarawan sa “mga salitang ito.”
- source_word: אָנֹכִי
  choice: ko
  rationale: Naipapahayag ng panghalip na “ko” ang unang panauhang simuno sa natural na balangkas ng Filipino. Hindi idinagdag ang “ako mismo” sapagkat maaaring lumabis ang diin.
- source_word: מְצַוְּךָ
  choice: iniuutos ko sa iyo
  rationale: Tumpak nitong inilalarawan ang kasalukuyang gawain ng pag-uutos sa mismong sandali ng pagsasalita at malinaw na pinananatili ang tuwirang kausap.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Ang “ngayon” ang pinakanatural na modernong katumbas ng deiktikong “today” sa ganitong pahayag.
- source_word: עַל לְבָבֶךָ
  choice: sa iyong puso
  rationale: Ang “sa iyong puso” ang likas na idyomang Filipino para sa panloob na pag-iingat at pagsasapuso. Ipinaliliwanag sa talababa ang mas literal na larawang Hebreo na “sa ibabaw ng iyong puso.”
theological_decisions:
- issue: Antropolohikal na idyoma ng לְבָב
  choice: puso
  alternative: isip; kalooban; kaibuturan
  rationale: Saklaw ng Hebreong “puso” ang pag-iisip, pagpapasya, at damdamin. Pinananatili ng “puso” ang malawak na larawang biblikal at iniiwasang paliitin ito tungo lamang sa isip o damdamin.
- issue: Lakas ng וְהָיוּ sa konteksto ng utos
  choice: dapat manatili
  alternative: mapapasaiyo; ay mapapasapuso mo
  rationale: Ang “dapat manatili” ay nagpapakita ng normatibo at nagpapatuloy na bisa nang hindi ginagawang hiwalay na tahasang utos ang anyong Hebreo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “iniuutos” sa halip na mas pormal o makalumang “ipinag-uutos,” at pinanatili ang “puso” bilang mahalagang larawang biblikal.
