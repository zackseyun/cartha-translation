  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: tl
  text: 'Lubusan ninyong wasakin ang lahat ng lugar kung saan naglingkod ang mga bansang itinataboy ninyo sa kanilang mga diyos[a]: sa matataas na bundok, sa mga burol, at sa ilalim ng bawat malagong puno.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba ang mga bansang itinataboy ninyo sa kanilang mga diyos.” Ang pandiwang Hebreo ay maaaring mangahulugang “maglingkod” sa diwa ng pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: Tiyak na gibain ninyo
  rationale: Ang infinitive absolute na kasunod ng pandiwang may parehong ugat ay nagpapadiin sa utos. Likas sa modernong Tagalog ang “tiyak na,” at ang “gibain” ay angkop sa mga konkretong pook ng pagsamba.
- source_word: כָּל הַמְּקֹמוֹת
  choice: ang lahat ng lugar
  rationale: Tumutukoy ang מָקוֹם dito sa mga pook na ginagamit sa pagsamba. Pinananatili ng “mga lugar” ang konkretong saklaw nang hindi dinaragdagan ang teksto ng salitang “sambahan.”
- source_word: עָבְדוּ שָׁם ... אֶת אֱלֹהֵיהֶם
  choice: kung saan pinaglingkuran ... ang kanilang mga diyos
  rationale: Ang עבד kapag mga diyos ang layon ay maaaring mangahulugang maglingkod o sumamba. Pinananatili ng “pinaglingkuran” ang pangunahing leksikal na larawan at malinaw ang relihiyosong diwa dahil sa layong “kanilang mga diyos.”
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Karaniwang tumutukoy ito sa mga bansang di-Israelita sa lupain. Iniiwasan ng “mga bansa” ang mas huling relihiyosong kulay ng “mga Hentil.”
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: mga bansang itinataboy ninyo
  rationale: Sa konteksto ng pananakop, ang ירשׁ ay sumasaklaw sa pag-angkin ng lupain sa pamamagitan ng pagpapaalis sa dating naninirahan. Natural at malinaw sa Tagalog ang “itinataboy,” bagaman hindi nito tahasang inuulit ang aspekto ng pag-aangkin.
- source_word: עַל הֶהָרִים הָרָמִים
  choice: sa matataas na bundok
  rationale: Direktang ipinapahayag ang pangngalan at panuring na tumutukoy sa matataas na lugar ng pagsamba.
- source_word: וְעַל הַגְּבָעוֹת
  choice: sa mga burol
  rationale: Ang גְּבָעוֹת ay karaniwang “mga burol”; hindi kailangang gawing “mga taluktok” sapagkat mas interpretatibo iyon.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: sa ilalim ng bawat mayabong na puno
  rationale: Ang רַעֲנָן ay tumutukoy sa sariwa, luntian, at malagong halaman. Mas natural at mas malawak ang “mayabong” kaysa literal na “luntiang puno,” habang pinananatili ang larawan ng malago at kaakit-akit na punong ginagamit bilang pook ng pagsamba.
theological_decisions:
- issue: Ang saklaw ng iniutos na pagwasak
  choice: Ang tahasang layon ng utos ay ang lahat ng lugar na kaugnay ng pagsamba ng mga bansang itinataboy.
  alternative: Maaaring ipakahulugan nang mas malawak bilang lubusang pagpawi sa mga gawaing pagsamba sa ibang mga diyos.
  rationale: “Lahat ng lugar” ang gramatikal na layon ng pandiwa sa Hebreo, kaya pinananatili ng salin ang konkretong pokus at hindi tahasang pinapalitan iyon ng mga gawain o sistema ng pagsamba.
- issue: Kahulugan ng עבד kaugnay ng mga diyos
  choice: “Pinaglingkuran” ang nasa pangunahing teksto, na may relihiyosong kahulugang pagsamba.
  alternative: “Sinamba” ang kanilang mga diyos.
  rationale: Parehong suportado ng gamit ng pandiwa ang paglilingkod at pagsamba. Pinananatili sa teksto ang leksikal na anyo at inilalahad sa talababa ang mas tahasang relihiyosong katumbas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ninyo” para sa maramihang kausap at iniwasan ang arkaikong anyo. Ang gitling-pahaba ay nilalayong malinaw na iugnay ang tatlong lokasyon sa naunang “lahat ng lugar.”
