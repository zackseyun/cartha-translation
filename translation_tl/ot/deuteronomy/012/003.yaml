  verdict: revise
  source_fidelity: Tumpak ang pagkakasunod at puwersa ng mga utos, pati ang pagtukoy sa mga altar, Ashera, mga imaheng inukit, at pagpawi sa pangalan. Gayunman, ang “batong haligi” ay nagdaragdag ng tahasang materyal na hindi isinasaad ng Hebreo, bagaman maaaring bato ang karaniwang anyo ng mga matstsebah.
  naturalness: Malinaw at marangal ang Filipino. Mas natural at mas maingat ang “mga sagradong haligi” kaysa “mga sagradong batong haligi.” Inilipat din ang hulma ng talababa bago ang tuldok, alinsunod sa karaniwang pag-aangkla ng talababa sa talata.
  terminology: Ang “mga poste ni Ashera,” “mga larawang inukit,” at “pawiin ang kanilang pangalan” ay angkop na mga terminong modernong Filipino at pinananatili ang mga mahalagang pagkakaiba ng Hebreo. Ang talababa sa pangalan ay inayos upang ipaliwanag ang idyoma nang hindi lumalampas sa saklaw nito.
  issues:
