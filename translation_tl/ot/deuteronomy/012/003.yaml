  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נִתַּצְתֶּ֣ם אֶת מִזְבּחֹתָ֗/ם וְ/שִׁבַּרְתֶּם֙ אֶת מַצֵּ֣בֹתָ֔/ם וַ/אֲשֵֽׁרֵי/הֶם֙ תִּשְׂרְפ֣וּ/ן בָּ/אֵ֔שׁ וּ/פְסִילֵ֥י אֱלֹֽהֵי/הֶ֖ם תְּגַדֵּע֑וּ/ן וְ/אִבַּדְתֶּ֣ם אֶת שְׁמָ֔/ם מִן הַ/מָּק֖וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: tl
  text: Gibain ninyo ang kanilang mga altar, durugin ang kanilang mga sagradong haligi, sunugin sa apoy ang kanilang mga poste ni Ashera[a], putulin ang mga larawang inukit ng kanilang mga diyos[b], at pawiin ang kanilang pangalan mula sa lugar na iyon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Asherim” o “mga sagradong poste.” Ang salitang Hebreo ay tumutukoy sa mga bagay na ginagamit sa pagsambang kaugnay ni Ashera.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga diyus-diyosan.” Idiniriin ng Hebreo na ang mga imaheng ito ay mga bagay na hinubog sa pamamagitan ng pag-ukit.
    reason: lexical_alternative
  - marker: c
    text: Ang “pawiin ang kanilang pangalan” ay nangangahulugang alisin sa lugar na iyon ang alaala at pagsamba sa kanila.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם
  choice: Gibain ninyo
  rationale: Ang נתץ ay tumutukoy sa paggiba o pagbuwag ng isang itinayong bagay; natural ito para sa mga altar at pinananatili ang marahas na utos.
- source_word: מִזְבּחֹתָם
  choice: ang kanilang mga altar
  rationale: Karaniwan at malinaw na salin ng מזבח sa makabagong Filipino.
- source_word: שִׁבַּרְתֶּם
  choice: durugin
  rationale: Ang masidhing anyo ng שבר ay nagpapahiwatig ng sapilitang pagbasag; ipinahahayag ng “durugin” ang lubusang pagwasak.
- source_word: מַצֵּבֹתָם
  choice: ang kanilang mga sagradong batong haligi
  rationale: Ang מַצֵּבָה ay nakatayong bato o haliging ginagamit sa kulto; nililinaw ng parirala kapwa ang materyal na anyo at gamit nito.
- source_word: אֲשֵׁרֵיהֶם
  choice: ang kanilang mga poste ni Ashera
  rationale: Pinananatili ang tiyak na kaugnayan kay Ashera nang hindi basta ginagawang pangkalahatang sagradong poste o kakahuyan ang terminong Hebreo.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: sunugin sa apoy
  rationale: Tuwirang pinananatili ang tahasang pagbanggit ng Hebreo sa apoy at natural pa rin sa Filipino.
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: ang mga larawang inukit ng kanilang mga diyos
  rationale: Ipinapakita ng פֶסֶל na ang mga bagay ay hinubog o inukit, na mas tiyak kaysa sa pangkalahatang salitang “mga diyus-diyosan.”
- source_word: תְּגַדֵּעוּן
  choice: putulin
  rationale: Ang גדע ay pagputol o pagtatagpas; pinananatili ng salin ang kongkretong kilos kahit hindi karaniwang iniuugnay sa mga imahen.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: pawiin ang kanilang pangalan
  rationale: Pinananatili ang maigsi at matinding idyomang Hebreo tungkol sa pag-aalis ng pangalan at gunita, sa halip na ipaliwanag ito sa mismong talata.
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: mula sa lugar na iyon
  rationale: Tuwiran at natural na salin ng pariralang tumutukoy sa lugar ng pagsamba.
theological_decisions:
- issue: Kahulugan ng אֲשֵׁרֵיהֶם sa konteksto ng pagsambang Canaanita
  choice: mga poste ni Ashera
  alternative: mga Asherim; mga sagradong poste
  rationale: Ipinakikita ang kaugnayan ng mga kultikong bagay kay Ashera ngunit hindi ipinapalagay na ang mga bagay mismo ang diyosa.
- issue: Paglalarawan sa פְסִילֵי אֱלֹהֵיהֶם
  choice: mga larawang inukit ng kanilang mga diyos
  alternative: mga diyus-diyosan; mga inukit na imahen ng kanilang mga diyos
  rationale: Pinananatili ang diin ng Hebreo sa gawang-taong at inukit na katangian ng mga bagay na sinasamba, sa halip na palitan ito ng mas interpretatibong katawagan.
- issue: Saklaw ng idyomang “pawiin ang kanilang pangalan”
  choice: panatilihin ang idyoma sa pangunahing teksto
  alternative: ipaliwanag bilang pag-aalis ng kanilang alaala o presensiyang kultiko
  rationale: Maaaring saklawin ng “pangalan” ang ginugunitang presensiya, pagkilala, at pagtawag sa mga ito sa lugar ng pagsamba. Pinananatili sa teksto ang tensiyon at kaiklian ng Hebreo, at inilalagay ang paliwanag sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang pangmaramihang “ninyo” upang ipakita ang utos sa buong Israel. Pinanatili ang magkakasunod at mararahas na pandiwa ng Hebreo, pati ang idyomang “pawiin ang kanilang pangalan,” habang ipinaliwanag sa mga talababa ang mga terminong kultiko at posibleng alternatibo.
