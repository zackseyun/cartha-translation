  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: tl
  text: Huwag mo itong kainin[a]; ibuhos mo ito sa lupa tulad ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang dugo ng hayop na tinutukoy sa naunang konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא תֹּאכְלֶנּוּ
  choice: Huwag mo itong kainin
  rationale: Ang לֹא kasama ng pandiwang nasa imperfect ay naghahayag ng pagbabawal. Pinananatili ng “ito” ang panlalaking panghalip na hulapi na tumutukoy sa dugo sa konteksto.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Sa konkretong tagubilin tungkol sa pagtatapon ng dugo, tumutukoy ang הָאָרֶץ sa ibabaw ng lupa, hindi sa daigdig o sa isang lupain.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: ibuhos mo ito
  rationale: Ang שׁפך ay tumutukoy sa pagbubuhos; ang anyong pautos sa Filipino ay likas na naghahatid ng bisa ng Hebreong imperfect bilang tagubilin.
- source_word: כַּמָּיִם
  choice: na parang tubig
  rationale: Pinananatili nito ang paghahambing at natural itong pakinggan sa makabagong Filipino.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na hulapi
  choice: Pinanatili ang “ito,” na tumutukoy sa dugo ayon sa nakapaligid na konteksto.
  alternative: Tuwirang ilagay ang “dugo” sa pangunahing teksto.
  rationale: Mga panghalip na hulapi ang ginamit sa Hebreo at hindi inulit ang pangngalan. Pinananatili ng salin ang estruktura at iniiwasang magdagdag sa pangunahing teksto, habang nililinaw ang tinutukoy sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang anyong “Huwag mo” at “ibuhos mo” upang natural na maipahayag ang legal na pagbabawal at tagubilin nang hindi nagiging makaluma.
