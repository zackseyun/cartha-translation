base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: tl
  text: Mag-ingat ka, baka mabitag ka sa pagsunod sa kanila matapos silang malipol sa harap mo, at baka magsiyasat ka tungkol sa kanilang mga diyos at magsabi, “Paano sumamba ang mga bansang ito sa kanilang mga diyos? Ganoon din ang gagawin ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Mag-ingat ka
  rationale: Likas at tuwirang babala sa modernong Tagalog; ang reflexive na לְךָ ay naipahihiwatig na ng pariralang “mag-ingat ka” nang hindi gumagamit ng di-likas na “mag-ingat ka para sa iyong sarili.”
- source_word: פֶּן תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: baka mabitag ka sa pagsunod sa kanila
  rationale: Pinananatili ang larawan ng pagkakabitag sa תִּנָּקֵשׁ at nililinaw ng “sa pagsunod sa kanila” ang puwersa ng אַחֲרֵיהֶם sa konteksto.
- source_word: אַחֲרֵי הִשָּׁמְדָם מִפָּנֶיךָ
  choice: matapos silang lipulin sa harap mo
  rationale: Ang אַחֲרֵי ay temporal dito, at ang “sa harap mo” ay malapit sa idyomang Hebreo na מִפָּנֶיךָ nang hindi labis na nagpapaliwanag kung sino ang tagaganap ng paglipol.
- source_word: תִּדְרֹשׁ לֵאלֹהֵיהֶם
  choice: magsiyasat tungkol sa kanilang mga diyos
  rationale: Ipinapahayag ang masinsing pagtatanong o pagsasaliksik na maaaring saklawin ng דרש; ang “tungkol sa” ay angkop sa kasunod na tanong hinggil sa paraan ng pagsamba.
- source_word: אֵיכָה יַעַבְדוּ ... אֶת אֱלֹהֵיהֶם
  choice: Paano sumamba ... sa kanilang mga diyos?
  rationale: Sa temporal na konteksto ng nalipol nang mga bansa, natural sa Tagalog ang pangnagdaang “sumamba,” samantalang ang “sa” ang karaniwang pananda sa pandiwang “sumamba.”
- source_word: וְאֶעֱשֶׂה כֵּן גַּם אָנִי
  choice: Ganoon din ang gagawin ko
  rationale: Tapat sa intensiyong ipinahahayag ng unang panauhang anyo at natural sa Tagalog, nang hindi nagdaragdag ng tahasang layuning hindi kailangang ipasok.
theological_decisions:
- issue: Kung ang ipinagbabawal ay simpleng pagkuha ng impormasyon o pagsisiyasat na may layuning tularan ang pagsamba
  choice: Pinanatili ang pagbabawal sa pagsisiyasat at ang kasunod na ipinahayag na hangaring tularan iyon bilang magkaugnay na mga sugnay.
  alternative: Isalin nang tahasan bilang “magsiyasat ... upang tularan sila,” na gagawing tiyak na ang layunin lamang ang ipinagbabawal.
  rationale: Ang Hebreo ay nagdurugtong ng babala, pagsisiyasat, tanong, at pahayag na gagawin din iyon; hindi nito kailangang lutasin nang higit pa kung ang bawat uri ng pag-aaral ay saklaw ng pagbabawal.
- issue: Tagaganap ng paglipol sa mga bansa
  choice: 'Hindi tahasang pinangalanan ang tagaganap: “matapos silang lipulin sa harap mo.”'
  alternative: “Matapos silang lipulin ng PANGINOON sa harap mo.”
  rationale: Passive ang הִשָּׁמְדָם at walang tahasang tagaganap sa talata; bagaman malinaw sa mas malawak na konteksto ang banal na pagkilos, hindi ito dapat idagdag sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “ka/mo” alinsunod sa mga anyong pang-isahan sa Hebreo. Hinati sa dalawang pangungusap para sa likas na daloy nang hindi binabago ang lohikal na ugnayan ng mga babala.
