base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/016.yaml
  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: tl
  text: Ngunit huwag ninyong kakainin ang dugo; ibuhos ninyo iyon sa lupa na parang tubig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang paghihigpit o eksepsiyon sa naunang pahintulot. Natural sa Filipino ang “Ngunit” sa ganitong paglipat, habang ang mismong pagbabawal ang malinaw na nagdadala ng restriktibong diwa.
- source_word: הַדָּם
  choice: ang dugo
  rationale: Pinananatili ang tiyak na pantukoy ng Hebreo at tumutukoy sa dugo ng hayop na kinatay.
- source_word: לֹא תֹאכֵלוּ
  choice: huwag ninyong kakainin
  rationale: Direkta at natural na pagbabawal sa maramihang kausap, na angkop sa legal na tagubilin.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Sa kontekstong ito, tumutukoy ang אֶרֶץ sa pisikal na lupang pagbubuhusan, hindi sa daigdig o sa lupain bilang teritoryo.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: ibuhos ninyo iyon
  rationale: Ang pandiwa ay nagsasaad ng pagbuhos, at ang hulaping panghalip ay malinaw na bumabalik sa dugo.
- source_word: כַּמָּיִם
  choice: na parang tubig
  rationale: Natural na Filipino para sa payak na paghahambing sa Hebreo.
theological_decisions:
- issue: Pagtrato sa dugo sa batas tungkol sa pagkain
  choice: Tuwirang ipinagbabawal ang pagkain ng dugo at iniuutos na ibuhos ito sa lupa.
  alternative: Dagdagan ang salin ng simbolikong o teolohikal na paliwanag tungkol sa dugo.
  rationale: Kongkretong legal na tagubilin ang talata. Hindi dapat ipasok sa mismong salin ang mga pagpapakahulugang lampas sa payak na sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo” ayon sa mga pandiwang Hebreo. Walang talababa dahil walang tekstuwal o leksikal na kalabuan na nangangailangan nito.
