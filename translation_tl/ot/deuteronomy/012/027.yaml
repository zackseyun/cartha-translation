revisions:
- from: Ihahandog mo sa altar ni Yahweh na iyong Diyos ang iyong mga handog na sinusunog—ang laman at ang dugo. Ang dugo ng iba mo pang mga handog ay ibubuhos sa altar ni Yahweh na iyong Diyos, ngunit maaari mong kainin ang laman.[a]
  to: Ihahandog mo sa altar ni Yahweh na iyong Diyos ang iyong mga handog na sinusunog—ang laman at ang dugo. Ibubuhos sa altar ni Yahweh na iyong Diyos ang dugo ng iyong mga hain, at kakainin mo ang laman.
  rationale: Inalis ang idinagdag na “iba mo pang” at isinalin ang pangwakas na sugnay nang mas malapit sa anyo at pang-ugnay ng Hebreo. Dahil hindi na ginagamit ang kontekstuwal na permissive na pagbasa sa pangunahing teksto, inalis ang talababa na para lamang sa alternatibong iyon.
