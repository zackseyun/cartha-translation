base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: tl
  text: Ihahandog mo sa altar ni Yahweh na iyong Diyos ang iyong mga handog na sinusunog—ang laman at ang dugo. Ibubuhos sa altar ni Yahweh na iyong Diyos ang dugo ng iyong mga hain, at kakainin mo ang laman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ihahandog mo
  rationale: Bagaman karaniwang nangangahulugang “gawin” ang pandiwa, sa konteksto ng עֹלֹתֶיךָ tumutukoy ito sa pagsasagawa o paghahandog ng handog.
- source_word: עֹלֹתֶיךָ
  choice: iyong mga handog na sinusunog
  rationale: Tumutukoy ang עֹלָה sa handog na lubusang sinusunog. Malinaw ito sa modernong Tagalog nang hindi umaasa sa di-pamilyar na teknikal na katawagan.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: ang laman at ang dugo
  rationale: Pinananatili ng “laman” ang kongkreto at panritwal na diwa ng בָּשָׂר at higit na angkop kaysa sa makitid na katawagang pangpagkain.
- source_word: עַל מִזְבַּח יְהוָה אֱלֹהֶיךָ
  choice: sa altar ni Yahweh na iyong Diyos
  rationale: Ang “sa altar” ay natural na katumbas ng עַל sa kontekstong ito; ginagawang malinaw ng “ni Yahweh” na ang altar ay nauukol sa kaniya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: וְדַם זְבָחֶיךָ
  choice: Ang dugo ng iba mo pang mga handog
  rationale: Ang זֶבַח ay malawak na katawagan para sa mga haing karaniwang may bahaging maaaring kainin. Idinagdag ang “iba mo pang” upang malinaw na maiba ang mga ito sa naunang mga handog na sinusunog, nang hindi nagdaragdag ng denominasyonal na paliwanag.
- source_word: יִשָּׁפֵךְ
  choice: ay ibubuhos
  rationale: Ipinahahayag ng anyong Niphal ang panritwal na kilos na ginagawa sa dugo; natural at tumpak ang “ibubuhos.”
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: ngunit maaari mong kainin ang laman
  rationale: Ipinakikita ng “ngunit” ang kontekstuwal na paghahambing sa dugo, samantalang ang “maaari” ay naghahayag ng pahintulot sa legal na tagubilin. Nilalagyan ng talababa ang mas pormal na posibilidad.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulo.
- issue: Lakas ng pangwakas na sugnay וְהַבָּשָׂר תֹּאכֵל
  choice: ngunit maaari mong kainin ang laman
  alternative: at kakainin mo ang laman
  rationale: Sa batas tungkol sa paghahandog, maaaring unawain ang sugnay bilang pahintulot na kainin ang laman bilang kaibahan sa dugong dapat ibuhos. Gayunman, maaari ring katawanin nang mas pormal ang waw at imperpektong pandiwa bilang “at kakainin mo”; pinananatili ang posibilidad na ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “handog na sinusunog” bilang madaling maunawaang katawagang panritwal, at pinanatili ang pangalang Yahweh.
