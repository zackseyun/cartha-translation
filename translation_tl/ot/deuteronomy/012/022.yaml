base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: tl
  text: Ngunit kung paanong kinakain ang gasela at ang usa[a], gayon din ninyo ito maaaring kainin; ang taong marumi at ang taong malinis ay kapwa maaaring kumain nito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang dalawang salitang Hebreo ay tumutukoy sa mga uri ng mailap na hayop; maaari ring isalin ang una bilang “roe deer” at ang ikalawa bilang “lalaking usa.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, kapwa maaaring kumain nito ang mga taong marumi sa ritwal at ang mga taong malinis sa ritwal.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Nagpapahayag ito rito ng paglilimita o paglilinaw kaugnay ng naunang tagubilin; natural itong naihahatid ng “Ngunit.”
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: kung paanong ... gayon
  rationale: Pinananatili nito ang tahasang paghahambing sa pagkain ng maiilap na hayop at sa pagkain ng hayop na tinutukoy sa konteksto.
- source_word: יֵאָכֵל
  choice: kinakain
  rationale: Ang Niphal ay pasibo at nagsasaad dito ng pangkalahatang kaugalian sa pagkain.
- source_word: הַצְּבִי
  choice: ang gasela
  rationale: Karaniwang tumutukoy ang צְבִי sa isang uri ng gasela; “gasela” ang malinaw at kasalukuyang katumbas sa Filipino.
- source_word: הָאַיָּל
  choice: ang usa
  rationale: Tumutukoy ang אַיָּל sa usa, kung minsan ay partikular sa lalaking usa; hindi ito labis na tinutukoy ng pangkalahatang “usa.”
- source_word: תֹּאכְלֶנּוּ
  choice: maaari ninyong kainin ito
  rationale: Sa legal na konteksto, ang imperfect ay nagpapahintulot sa halip na simpleng magsaad ng mangyayari.
- source_word: הַטָּמֵא ... הַטָּהוֹר
  choice: ang taong marumi at ang taong malinis
  rationale: Ginagawang malinaw na mga tao ang tinutukoy habang pinananatili ang mahalagang pares na “marumi/malinis”; ang talababa ang naglilinaw na ritwal ang kalagayang ito.
- source_word: יַחְדָּו
  choice: kapwa
  rationale: Ipinahihiwatig dito ang magkapantay na pahintulot sa dalawang uri ng tao, hindi kinakailangang sabay silang kumain.
- source_word: יֹאכְלֶנּוּ
  choice: maaaring kumain nito
  rationale: Gaya ng naunang pandiwa, ito ay may legal na diwang nagpapahintulot.
theological_decisions:
- issue: Kahulugan ng marumi at malinis
  choice: ang taong marumi at ang taong malinis
  alternative: ang taong marumi sa ritwal at ang taong malinis sa ritwal
  rationale: Hindi moral na pagkatao kundi kalagayang ritwal ang tinutukoy. Pinananatili sa pangunahing teksto ang maikli at tradisyonal na pares, at nililinaw ang kahulugan sa talababa.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na legal na himig. Ginamit ang “kung paanong ... gayon” upang mapanatili ang paghahambing, at “maaari” upang ihatid ang pahintulot. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
