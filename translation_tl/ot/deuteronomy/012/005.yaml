  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: tl
  text: Sa halip, hanapin ninyo ang lugar na pipiliin ni Yahweh na inyong Diyos mula sa lahat ng inyong mga lipi upang ilagay roon ang kanyang pangalan[a] para sa kanyang pananahan, at pumunta kayo roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “upang ilagay roon ang kanyang pangalan bilang kanyang tahanan.” Masinsin ang pagkakabuo ng Hebreo, kaya maaaring idiin nito ang pananahan ng Diyos, ang lugar bilang kanyang tahanan, o kapuwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Sa halip
  rationale: Ipinakikita ng parirala ang positibong alternatibo sa naunang pagbabawal; natural itong naghahayag ng mariing pagsalungat sa Filipino.
- source_word: הַמָּקוֹם
  choice: ang lugar
  rationale: Pinananatili nito ang kongkreto ngunit hindi pa tinutukoy na pook na pipiliin ng Diyos.
- source_word: יִבְחַר
  choice: pipiliin
  rationale: Ang imperfect ay tumutukoy rito sa pagpili ng Diyos sa hinaharap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: na inyong Diyos
  rationale: Likas na Filipino para sa kaugnayang 'Yahweh your God' at malinaw na pangmaramihan ang kausap.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: mula sa lahat ng inyong mga lipi
  rationale: Ipinahihiwatig nito na ang lugar ay pipiliin mula sa nasasakupan ng mga lipi ng Israel.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: upang ilagay roon ang kanyang pangalan
  rationale: Malapit sa Hebreo at pinananatili ang idyoma ng pangalan bilang tanda ng awtorisadong presensiya at pagsamba nang hindi ito labis na ipinapaliwanag.
- source_word: לְשִׁכְנוֹ
  choice: bilang kanyang tahanan
  rationale: Maikli at natural na salin na pinananatili ang motibo ng paninirahan, habang kinikilala sa talababa ang masinsin at hindi ganap na tiyak na ugnayan nito sa naunang sugnay.
- source_word: תִדְרְשׁוּ
  choice: hanapin ninyo
  rationale: Sa konteksto, tumutukoy ito sa paghahanap sa wastong lugar ng pagsamba; malinaw at natural ang pandiwang Filipino.
- source_word: וּבָאתָ שָׁמָּה
  choice: at pumunta kayo roon
  rationale: Bagaman literal na 'dumating/pumaroon,' ang 'pumunta' ang natural na direksiyon sa Filipino para sa hindi pa tinutukoy na destinasyon; pinananatili ng 'roon' ang שָׁמָּה.
theological_decisions:
- issue: Ang banal na pangalan at ang wika tungkol sa sentral na santuwaryo
  choice: Yahweh ... ilagay roon ang kanyang pangalan ... bilang kanyang tahanan
  alternative: Yahweh ... itatag doon ang kanyang pangalan upang manahan doon
  rationale: Pinananatili ang dalawang motibo—pangalan at tahanan/pananahan—nang hindi ipinapasok ang mas huling sistemang teolohikal tungkol sa templo o pinagpapasyahan nang labis ang masinsing sintaks ng Hebreo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang pangmaramihang anyo sa mga utos upang ipakita ang kolektibong kausap, kahit nagbabago ang anyong gramatikal sa Hebreo. Pinanatili ang pangalang Yahweh at ang tunay na kalabuan ng לְשִׁכְנוֹ sa pamamagitan ng talababa.
