  text: וַ/הֲבֵאתֶ֣ם שָׁ֗מָּ/ה עֹלֹֽתֵי/כֶם֙ וְ/זִבְחֵי/כֶ֔ם וְ/אֵת֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם וְ/אֵ֖ת תְּרוּמַ֣ת יֶדְ/כֶ֑ם וְ/נִדְרֵי/כֶם֙ וְ/נִדְבֹ֣תֵי/כֶ֔ם וּ/בְכֹרֹ֥ת בְּקַרְ/כֶ֖ם וְ/צֹאנְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: tl
  text: Doon ninyo dadalhin ang inyong mga handog na sinusunog, mga hain, mga ikapu, ang ambag na iniaabot ninyo[a], mga handog na panata[b], mga kusang-loob na handog, at ang mga panganay ng inyong kawan ng baka at kawan ng tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang ambag ng inyong kamay.” Ipinahihiwatig nito ang handog o ambag na personal ninyong iniaabot.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga panata”; sa kontekstong ito, malamang na tumutukoy sa mga handog na inihahandog bilang pagtupad sa panata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: dadalhin ninyo
  rationale: Ang Hiphil ng בוא ay nagsasaad ng pagdadala sa itinakdang lugar. Ang anyong “dadalhin ninyo” ay natural sa makabagong Tagalog at taglay ang puwersa ng utos sa kontekstong legal.
- source_word: שָׁמָּה
  choice: doon
  rationale: Tumutukoy ito sa lugar ng pagsamba na binanggit sa naunang talata; maikli at malinaw ang “doon.”
- source_word: עֹלֹתֵיכֶם
  choice: inyong mga handog na sinusunog
  rationale: Ang עוֹלָה ay handog na lubusang sinusunog. Pinananatili ng salin ang teknikal na kahulugan ngunit nauunawaan ng karaniwang mambabasa.
- source_word: זִבְחֵיכֶם
  choice: mga hain
  rationale: Malawak na katawagan ang זֶבַח para sa mga hayop na inihahain, at naiiba rito sa handog na sinusunog.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: mga ikapu
  rationale: Ang מַעֲשֵׂר ay ikasampung bahagi na inihahandog; “ikapu” ang maikli at nakaugaliang terminong Tagalog.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: handog mula sa inyong kamay
  rationale: Ipinahihiwatig ng תְּרוּמָה ang ambag o handog na ibinukod, samantalang pinananatili ng “mula sa inyong kamay” ang kongkretong larawan ng personal na paghahandog.
- source_word: נִדְרֵיכֶם
  choice: mga handog na panata
  rationale: Sa listahang ito ng mga dinadala sa santuwaryo, malamang na tumutukoy ang salita sa mga handog na kaugnay ng pagtupad sa panata, hindi lamang sa binigkas na panata.
- source_word: נִדְבֹתֵיכֶם
  choice: mga kusang-loob na handog
  rationale: Tumutukoy ito sa mga handog na ibinibigay nang kusa at hindi dahil sa panata.
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: mga panganay ng inyong mga baka at ng inyong mga tupa at kambing
  rationale: Ang בָּקָר ay malalaking alagang hayop, lalo na ang baka, at ang צֹאן ay maliliit na alagang hayop gaya ng tupa at kambing. Ang tahasang pagbanggit sa mga ito ay mas malinaw sa modernong Tagalog.
theological_decisions:
- issue: Kung ang נִדְרֵיכֶם ay ang mismong mga panata o ang mga handog na tumutupad sa mga panata
  choice: mga handog na panata
  alternative: mga panata
  rationale: Dahil nakapaloob ito sa talaan ng mga bagay na pisikal na dinadala sa lugar ng pagsamba, ang handog na kaugnay ng panata ang pinakamalamang na diwa; pinananatili sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pamilyar na mga terminong “hain” at “ikapu,” habang ipinaliwanag sa natural na pananalita ang mga teknikal na uri ng handog. Ang lahat ng panandang talababa ay inilagay sa mismong teksto.
