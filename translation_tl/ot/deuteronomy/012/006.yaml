revisions:
- from: Doon ninyo dadalhin ang inyong mga handog na sinusunog, mga hain, mga ikapu, handog mula sa inyong kamay[a], mga handog na panata[b], mga kusang-loob na handog, at mga panganay ng inyong mga baka at ng inyong mga tupa at kambing.
  to: Doon ninyo dadalhin ang inyong mga handog na sinusunog, mga hain, mga ikapu, ang ambag na iniaabot ninyo[a], mga handog na panata[b], mga kusang-loob na handog, at ang mga panganay ng inyong kawan ng baka at kawan ng tupa.
  rationale: Inayos ang katumbas ng תְּרוּמַת יֶדְכֶם para sa mas natural na modernong Tagalog nang hindi inaalis ang larawang “kamay” sa talababa. Ginawang “kawan ng baka at kawan ng tupa” ang pangwakas na parirala upang manatiling malapit sa malawak na pares na בָּקָר at צֹאן at maiwasan ang di-kailangang pagpapalawak.
