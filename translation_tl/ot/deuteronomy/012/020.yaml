  source_fidelity: 'Tumpak ang pangunahing diwa: pagpapalawak ng nasasakupan, pagnanais na kumain ng karne, at pahintulot na kumain ayon sa pagnanais. Gayunman, ang Hebreong וְאָמַרְתָ ay mas akmang ihayag sa kondisyunal na daloy bilang “sabihin mo” kaysa nakaraang-panahong “sinabi mong.”'
  naturalness: Natural sa pangkalahatan ang modernong Filipino. Ang “Kapag ... at sabihin mo” ay mas maayos na panahunan at daloy kaysa “Kapag ... at sinabi mong.” Ginamit din ang tuwirang konstruksyong “sabihin mo, ‘...’” sa halip na “sabihin mong, ‘...’.”
  terminology: Ang “PANGINOON” ay angkop na representasyon ng יהוה. Ang “nasasakupan,” “karne,” at “nananabik” ay malinaw at naaayon sa marangal ngunit modernong rehistro. Ang “hangga’t gusto mo” ay idiomatikong naghahatid ng saklaw ng pahintulot sa huling parirala.
