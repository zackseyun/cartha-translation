base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: tl
  text: Kapag pinalawak ng PANGINOON mong Diyos ang nasasakupan mo, gaya ng ipinangako niya sa iyo, at sabihin mo, “Gusto kong kumain ng karne,” dahil nananabik kang kumain ng karne, maaari kang kumain ng karne hangga’t gusto mo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְחִיב ... אֶת־גְּבוּלְךָ
  choice: pinalawak ... ang nasasakupan mo
  rationale: Ang “nasasakupan” ay likas sa modernong Filipino at ipinahihiwatig ang lawak ng lupaing nasa loob ng hangganan, hindi lamang ang mismong guhit ng hangganan.
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: at sinabi mong, “Gusto kong kumain ng karne”
  rationale: Ang kohortatibong anyo ng “kakain” ay nagpapahayag dito ng hangarin; mas natural at malinaw itong naihahatid ng “Gusto kong kumain.”
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: nananabik kang
  rationale: Sa kontekstong ito, ang nefesh ay tumutukoy sa mismong tao bilang nakararanas ng matinding pagnanais; iniiwasan ng salin ang di-likas na “nananabik ang iyong kaluluwa.”
- source_word: בְּכָל־אַוַּת נַפְשְׁךָ
  choice: hangga’t gusto mo
  rationale: Natural na Filipino itong katumbas ng pahintulot na kumain alinsunod sa buong pagnanais ng tao, nang hindi ginagawang teknikal o pilit ang parirala.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginagamit ang kinikilalang anyong maliit na kapital upang ipakitang ang pinagmulan ay ang banal na pangalan, habang nananatiling pamilyar at marangal sa karaniwang mambabasang Filipino.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Pinanatili ang pag-uulit ng “kumain ng karne” mula sa Hebreo, ngunit isinalin nang idiomatiko ang dalawang pariralang gumagamit ng nefesh.
