  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: tl
  text: Huwag ninyong gawin iyon kay Yahweh, na inyong Diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “iyon” sa Hebreo ay tumutukoy sa mga naunang utos tungkol sa pagwasak sa mga lugar na pinagsasambahan ng mga bansa; hindi dapat tratuhin ng Israel si Yahweh sa gayong paraan.
    reason: cross_reference
  - marker: b
    text: Hebreo YHWH; tradisyonal na isinasalin na “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: Huwag ninyong gawin
  rationale: Ang לֹא kasama ng qal imperfect na ikalawang panauhang maramihan ay tuwirang pagbabawal. Natural at malinaw sa modernong Tagalog ang “Huwag ninyong gawin.”
- source_word: כֵּן
  choice: iyon
  rationale: Pabalik ang turing nito sa paraang inilarawan sa naunang talata. Pinananatili ng “iyon” ang maikli at kontekstuwal na pahayag ng Hebreo nang hindi inilalagay sa pangunahing teksto ang paliwanag.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng ל ang kaugnayan o patutunguhan ng kilos. Ang “kay” ang likas na panandang Tagalog para sa personal na pangalang Yahweh sa ganitong balangkas.
- source_word: אֱלֹהֵיכֶם
  choice: na inyong Diyos
  rationale: Pinananatili ang ikalawang panauhang maramihang hulapi at ang tipanang kaugnayan. Dignified at malinaw ang “inyong Diyos.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Pangalan mismo ng Diyos ang nasa Hebreo. Ginamit ang “Yahweh” upang katawanin ang Tetragrammaton nang tuwiran; binanggit sa talababa ang tradisyonal na salin.
- issue: Saklaw ng pagbabawal ayon sa konteksto
  choice: Pinanatili ang maikling pabalik na pagtukoy na “gawin iyon”
  alternative: Tahasan sa pangunahing teksto na sabihing huwag tratuhin si Yahweh gaya ng pagtrato sa mga sambahan ng mga bansa
  rationale: Terse at nakasalalay sa naunang konteksto ang Hebreo. Hindi nilutas sa pangunahing teksto ang maaaring saklaw ng “iyon”; ipinaliwanag ito sa talababa nang hindi dinaragdagan ang talata.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ang “huwag ninyong” ay malinaw na maramihan; pinanatili ang kaiklian at kontekstuwal na tensiyon ng orihinal.
