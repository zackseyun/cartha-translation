  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: tl
  text: Mag-ingat kang huwag pabayaan ang Levita[a] sa buong panahon ng iyong pamumuhay sa iyong lupain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Levita.” Isahan ang anyo sa Hebreo—“ang Levita”—at malamang na kumakatawan ito sa buong pangkat ng mga Levita.
    reason: lexical_alternative
  - marker: b
    text: O “sa ibabaw ng iyong lupain.” Ito ang mas literal na kahulugan ng pang-ukol sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Mag-ingat ka
  rationale: Ang Niphal na pautos ng שׁמר kasama ang לְךָ ay isang idyomatikong babala na magbantay sa sarili. Ang “Mag-ingat ka” ay natural at malinaw sa makabagong Filipino.
- source_word: פֶּן
  choice: huwag
  rationale: Ipinapasok ng פֶּן ang isang negatibong babala. Likas sa Filipino ang hulma na “Mag-ingat kang huwag…”
- source_word: תַּעֲזֹב
  choice: pabayaan
  rationale: Maaaring mangahulugan ang עזב na iwan, talikuran, o pabayaan. Sa konteksto ng pananagutang panlipunan sa Levita, malinaw na ipinahihiwatig ng “pabayaan” ang hindi pag-iwan sa kaniya nang walang suporta.
- source_word: אֶת הַלֵּוִי
  choice: ang Levita
  rationale: Pinananatili nito ang isahang anyo na may pantukoy sa Hebreo, na malamang na kumakatawan sa buong pangkat ng mga Levita.
- source_word: כָּל יָמֶיךָ
  choice: habang nabubuhay ka
  rationale: Ito ang natural na Filipino para sa idyomang literal na “lahat ng iyong mga araw,” at pinananatili ang kahulugang panghabambuhay.
- source_word: עַל אַדְמָתֶךָ
  choice: sa iyong lupain
  rationale: Ang אַדְמָה ay lupain o lupa. Bagaman literal na gumagamit ang Hebreo ng pang-ukol na עַל (“sa ibabaw ng”), “sa iyong lupain” ang natural na pahayag sa Filipino para sa lokasyon o paninirahan sa lupaing iyon.
theological_decisions:
- issue: Isahang anyong kumakatawan sa mga Levita
  choice: ang Levita
  alternative: ang mga Levita
  rationale: Isahan at may pantukoy ang anyong Hebreo. Pinananatili ng salin ang isahan upang hindi alisin ang representatibong paraan ng pagtukoy sa Levita bilang kabilang sa isang pangkat na dapat alagaan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang babalang “Mag-ingat kang huwag…” at ang likas na idyomang “habang nabubuhay ka,” habang pinanatili sa pangunahing teksto ang isahang “Levita” at ipinaliwanag ang representatibong gamit nito sa talababa.
