revisions:
- from: 'At sa lugar na pipiliin ni Yahweh na inyong Diyos upang doon niya patahanin ang kanyang pangalan[a], doon ninyo dadalhin ang lahat ng iniuutos ko sa inyo: ang inyong mga handog na sinusunog, mga hain, mga ikapu, handog mula sa inyong kamay, at lahat ng pinakamainam sa mga panatang ipapanata ninyo kay Yahweh.'
  to: 'At sa lugar na pipiliin ni Yahweh na inyong Diyos upang doon niya ipanahanan ang kanyang pangalan[a], doon ninyo dadalhin ang lahat ng iniuutos ko sa inyo: ang inyong mga handog na sinusunog, mga hain, mga ikapu, handog mula sa inyong kamay, at lahat ng pinakamainam sa inyong mga panata na ipapanata ninyo kay Yahweh.'
  rationale: Pinalitan ang hindi natural na “patahanin” ng “ipanahanan,” na mas maayos na Filipino at mas tapat sa causative na anyo ng Hebreo. Inayos ang huling parirala para sa daloy at kalinawan, nang hindi nagdaragdag ng ‘handog’ o nililimitahan ang saklaw ng mga panata.
