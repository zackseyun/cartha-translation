id: DEU.12.11
reference: Deuteronomy 12:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: tl
  text: 'At sa lugar na pipiliin ni Yahweh na inyong Diyos upang doon niya ipanahanan ang kanyang pangalan[a], doon ninyo dadalhin ang lahat ng iniuutos ko sa inyo: ang inyong mga handog na sinusunog, mga hain, mga ikapu, handog mula sa inyong kamay, at lahat ng pinakamainam sa inyong mga panata na ipapanata ninyo kay Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang doon manahan ang kanyang pangalan.”
    reason: Inilalahad ang di-causative na alternatibong pagpapahayag ng pariralang Hebreo, samantalang pinananatili ng pangunahing teksto ang causative na diwa ng לְשַׁכֵּן.
lexical_decisions:
- source_word: וְהָיָה הַמָּקוֹם
  choice: At sa lugar
  rationale: Isinasama ang sugnay sa naunang tagubilin at natural na inihahanda sa Tagalog ang patutunguhang lugar na binibigyang-diin sa kasunod na שָׁמָּה.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֵיכֶם
  choice: na pipiliin ni Yahweh na inyong Diyos
  rationale: Pinananatili ang hinaharap na diwa ng יִבְחַר at ang personal na pangalang Yahweh.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: upang doon niya patahanin ang kanyang pangalan
  rationale: Ipinahahayag ng 'patahanin' ang causative na anyo ng pandiwa habang pinananatili ang mahalagang larawan ng paninirahan ng pangalan.
- source_word: שָׁמָּה תָבִיאוּ
  choice: doon ninyo dadalhin
  rationale: Ang 'doon' ay nagpapakita ng direksiyon patungo sa piniling lugar, at ang anyong pandiwa ay naghahatid ng bisa ng utos.
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: ang lahat ng iniuutos ko sa inyo
  rationale: Ang 'iniuutos' ay natural na nagpapakita ng nagpapatuloy na kilos ng participle מְצַוֶּה.
- source_word: עוֹלֹתֵיכֶם
  choice: ang inyong mga handog na sinusunog
  rationale: Malinaw sa karaniwang mambabasa at tumutukoy sa mga handog na ganap na sinusunog.
- source_word: זִבְחֵיכֶם
  choice: mga hain
  rationale: Sapat na malawak upang hindi ito limitahan sa isang partikular na uri ng haing pangkapayapaan.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: mga ikapu
  rationale: Karaniwan at eksaktong katawagan para sa mga handog na ikasampung bahagi.
- source_word: תְרוּמַת יֶדְכֶם
  choice: handog mula sa inyong kamay
  rationale: Pinananatili ang kongkretong idyomang Hebreo tungkol sa kamay nang hindi gumagamit ng teknikal at di-pamilyar na katawagan.
- source_word: וְכֹל מִבְחַר נִדְרֵיכֶם אֲשֶׁר תִּדְּרוּ
  choice: at lahat ng pinakamainam sa mga panatang ipapanata ninyo
  rationale: Hindi nagdaragdag ng salitang 'handog' na wala rito sa Hebreo; pinananatili rin ang pag-uulit ng ugat para sa panata at ang hinaharap na diwa ng תִּדְּרוּ.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Inililipat nang tuwiran ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Ang paninirahan ng pangalan sa לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: upang doon niya patahanin ang kanyang pangalan
  alternative: upang doon manahan ang kanyang pangalan; upang ilagay niya roon ang kanyang pangalan
  rationale: Pinananatili ng pangunahing salin ang causative na anyo at larawan ng paninirahan nang hindi sinasabing ang buong pagka-Diyos ay nakukulong sa isang lugar. Nasa talababa ang mas di-causative na posibleng pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang pamilyar na mga katawagang “hain” at “ikapu,” samantalang ipinaliwanag sa payak na pananalita ang mas teknikal na mga katawagang panghandog. Ang marka ng talababa ay inilagay mismo sa pariralang tinutukoy nito.
