  revision_rationale: Pinalitan ang hindi natural na “patahanin” ng “ipanahanan,” na mas maayos na Filipino at mas tapat sa causative na anyo ng Hebreo. Inayos ang huling parirala para sa daloy at kalinawan, nang hindi nagdaragdag ng ‘handog’ o nililimitahan ang saklaw ng mga panata.
