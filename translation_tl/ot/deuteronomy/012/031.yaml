revisions:
- from: Huwag mong gawin ang gayon kay Yahweh na iyong Diyos, sapagkat ginawa ng mga bansang iyon para sa kanilang mga diyos ang bawat karumal-dumal na bagay kay Yahweh[a] na kinapopootan niya. Sinusunog pa nga nila sa apoy ang kanilang mga anak na lalaki at babae para sa kanilang mga diyos.
  to: Huwag mong sambahin si Yahweh na iyong Diyos sa ganitong paraan, sapagkat ginawa ng mga bansang iyon para sa kanilang mga diyos ang bawat karumal-dumal na bagay na kinapopootan ni Yahweh. Sinusunog pa nga nila sa apoy ang kanilang mga anak na lalaki at babae para sa kanilang mga diyos.
  rationale: Pinalitan ang hindi natural at posibleng malabong pagkakabuo ng pariralang tungkol sa תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא ng malinaw na Filipino na “bawat karumal-dumal na bagay na kinapopootan ni Yahweh.” Inilahad din ang “do so to Yahweh” bilang pagsamba “sa ganitong paraan,” sapagkat iyon ang tiyak na tinutukoy ng agarang konteksto. Pinanatili ang lahat ng pangunahing semantikong elemento, ang pangalang Yahweh, at ang matinding paghatol ng teksto.
