base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: tl
  text: Huwag mong sambahin si Yahweh na iyong Diyos sa ganitong paraan, sapagkat ginawa ng mga bansang iyon para sa kanilang mga diyos ang bawat karumal-dumal na bagay na kinapopootan ni Yahweh. Sinusunog pa nga nila sa apoy ang kanilang mga anak na lalaki at babae para sa kanilang mga diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן
  choice: Huwag mong gawin ang gayon
  rationale: Pinananatili ang tuwirang pagbabawal sa ikalawang panauhang isahan at ang pabalik na pagtukoy sa paraan ng pagsamba na binanggit sa naunang konteksto.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na iyong Diyos
  rationale: Ang “kay” ay likas na nagpapahayag ng kilos na ginagawa kaugnay o para kay Yahweh, habang pinananatili ang pangalang tipan at ang pormulang “iyong Diyos.”
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: ang bawat karumal-dumal na bagay kay Yahweh na kinapopootan niya
  rationale: Ang “karumal-dumal na bagay” ay malinaw at matindi sa makabagong Filipino. Pinananatili ng “kay Yahweh” ang posibleng relasyonal na diwa ng construct, at ng kasunod na sugnay ang tahasang שָׂנֵא.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: ginawa ng mga bansang iyon para sa kanilang mga diyos
  rationale: Ipinahihiwatig ng konteksto na ang paksa ay ang mga bansang binanggit sa naunang talata. Ang “para sa” ay angkop sa mga gawaing pangkulto na iniaalay sa kanilang mga diyos.
- source_word: כִּי גַם
  choice: pa nga
  rationale: Inihahatid nito ang diin at nakagigimbal na halimbawang ipinakikilala ng כִּי גַם sa natural na Filipino.
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: ang kanilang mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit sa kapwa mga anak na lalaki at babae nang hindi nagpapabigat sa pangungusap.
- source_word: יִשְׂרְפוּ בָאֵשׁ לֵאלֹהֵיהֶם
  choice: Sinusunog ... sa apoy ... para sa kanilang mga diyos
  rationale: Ang imperfect ay angkop na isalin bilang nakaugaliang gawain sa kasalukuyang anyo. Ang “sa apoy” ay literal at ang “para sa” ay nagpapakita ng layuning pangkulto.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Lakas ng תּוֹעֵבָה at שָׂנֵא
  choice: karumal-dumal na bagay; kinapopootan
  alternative: kasuklam-suklam na bagay; ayaw
  rationale: Pinananatili ng napiling mga salita ang matinding moral at panrelihiyong paghatol ng teksto at hindi ito pinalalambot.
- issue: Ugnayan sa pariralang תּוֹעֲבַת יְהוָה
  choice: karumal-dumal na bagay kay Yahweh
  alternative: karumal-dumal na bagay ni Yahweh
  rationale: 'Ang construct ay maaaring pormal na basahing genitibo, ngunit sa konteksto ay relasyonal: ang mga bagay ay karumal-dumal sa paningin ni Yahweh. Inilalagay sa talababa ang mas literal ngunit hindi gaanong likas na alternatibo.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang panghalip na isahan upang panatilihin ang tipanang pakikipag-usap sa Israel bilang isang kolektibong kausap. Iniwasan ang sobrang teknikal o makalumang bokabularyo, ngunit pinanatili ang bigat ng pagbabawal at ng paghatol sa paghahain ng mga anak.
