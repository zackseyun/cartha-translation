base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: tl
  text: Ingatan mong pakinggan ang lahat ng salitang ito na iniuutos ko sa iyo,[a] upang maging mabuti ang kalagayan mo at ng iyong mga anak sa hinaharap, magpakailanman,[b] sapagkat gagawin mo ang mabuti at matuwid sa paningin ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ingatan at pakinggan ang lahat ng salitang ito.” Pinagsasama ng Hebreo ang maingat na pag-iingat o pagtupad at masusing pakikinig; ipinahihiwatig ng konteksto ang pagsunod.
    reason: lexical_alternative
  - marker: b
    text: 'Ang Hebreo ay maaaring literal na isaling “mga anak na lalaki,” ngunit dito ay tumutukoy ito nang mas malawak sa mga anak o susunod na salinlahi. Maaari ring unawain ang huling bahagi: “kapag ginawa mo ang mabuti at matuwid.”'
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: Ingatan mong pakinggan
  rationale: Pinananatili ang dalawang pandiwang Hebreo—maingat na pag-iingat/pagtalima at pakikinig—sa isang natural na utos sa modernong Tagalog; ipinahihiwatig ng konteksto ang pagsunod nang hindi ginagawang tahasang “sundin.”
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ang lahat ng salitang ito
  rationale: Ang דְּבָרִים ay literal na “mga salita” at tumutukoy rito sa mga utos na binibigkas ni Moises.
- source_word: מְצַוֶּךָּ
  choice: na iniuutos ko sa iyo
  rationale: Ang kasalukuyang anyo ay natural na nagpapahayag ng utos na ibinibigay sa pagkakataong ito.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: upang mapabuti ka
  rationale: Natural na Tagalog para sa idyomang tumutukoy sa magiging mabuting kalagayan o kapakanan ng kausap.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: at ang iyong mga anak na susunod sa iyo
  rationale: Sa kontekstong tipan, ang בָּנִים ay sumasaklaw sa mga anak o salinlahi, hindi kinakailangang mga anak na lalaki lamang.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag ang patuloy at di-tiyak na haba ng panahon sa hinaharap.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ang malamang na sanhi o batayan ng mabuting kahihinatnan, habang kinikilala sa talababa ang posibleng temporal na pagbasa.
- source_word: תַעֲשֶׂה הַטּוֹב וְהַיָּשָׁר
  choice: gagawin mo ang mabuti at matuwid
  rationale: Pinananatili ang imperfect na maaaring may hinaharap na diwa at ang dalawang moral na katangiang “mabuti” at “matuwid.”
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Natural at malinaw na Tagalog na nagpapanatili sa Hebreong talinghaga ng banal na pagsusuri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapakahulugan sa שׁמע bilang pakikinig o pagsunod
  choice: pakinggan
  alternative: sundin
  rationale: Pinananatili ng “pakinggan” ang pandinig at masusing pagtanggap na nasa pandiwa; malinaw na ipinahihiwatig ng konteksto ang pagsunod ngunit hindi ito tahasang ipinapalit sa salita.
- issue: Saklaw ng בָנֶיךָ
  choice: mga anak
  alternative: mga anak na lalaki; mga inapo
  rationale: Ang pangmaramihang panlalaking anyo ay maaaring tumukoy sa supling o salinlahi sa pangkalahatan sa ganitong pangakong tipan.
- issue: Ugnayan ng כִּי sa huling sugnay
  choice: sapagkat
  alternative: kapag
  rationale: 'Ang sanhi ang pangunahing pagbasa: magiging mabuti ang kalagayan nila sapagkat ginagawa nila ang mabuti at matuwid. Gayunman, posible ring unawain ang כִּי bilang temporal, kaya hindi itinatago ang alternatibo.'
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalan sa tekstong pinagmulan nang hindi pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang isahang “ikaw/iyo” ayon sa Hebreo. Pinanatili ang “Yahweh,” ang konkretong “mga salita,” at ang idyomang “sa paningin,” habang iniwasan ang arkaiko o labis na literal na ayos.
