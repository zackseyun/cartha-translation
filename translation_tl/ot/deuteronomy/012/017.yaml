    rationale: Ang “pintuang-bayan” ay karaniwang tumutukoy sa mismong tarangkahan; ang Hebreong idyoma ay tumutukoy sa mga lokal na bayan o pamayanan. Maaaring gamitin ang “sa inyong mga bayan” at itala ang literal na anyo.
