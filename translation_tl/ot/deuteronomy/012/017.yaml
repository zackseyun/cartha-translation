    issue: Interpretatibong pagsasalin ng נְדָרֶיךָ
    rationale: Isinasalin ng draft ang “inyong mga panata na inyong ipinapanata” bilang “inyong mga handog dahil sa panata.” Maaaring tumukoy ang parirala sa mga handog sa konteksto, ngunit ang pangunahing teksto ay dapat magpanatili ng literal na saklaw at ang pagpapaliwanag ay ilagay sa talababa.
  - severity: medium
    issue: Hindi pantay na koordinasyon ng talaan
    rationale: Ang paggamit ng “ni” kasunod ng “at,” at ang huling “at handog,” ay lumilikha ng hindi malinaw na pagkakaayos ng mga magkakapantay na bagay na ipinagbabawal kainin.
