  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: tl
  text: Hindi ninyo maaaring kainin sa inyong mga bayan[a] ang ikasampung bahagi ng inyong butil, bagong alak, langis, mga panganay ng inyong bakahan at kawan, alinman sa inyong mga panata na inyong ipinapanata[b], mga kusang-loob na handog, at handog mula sa inyong kamay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “sa loob ng inyong mga pintuan,” isang idyoma para sa mga lokal na bayan o pamayanan.
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, maaaring tumukoy ang mga panata sa mga handog na ipinangako sa pamamagitan ng panata, hindi lamang sa mga binigkas na pangako.
    reason: lexical_alternative
  - marker: c
    text: O “handog ng inyong kamay”; ayon sa tradisyon, “handog na itinaas ng inyong kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: Hindi ninyo maaaring kainin
  rationale: Sa kontekstong legal, ang kayang + pawatas ay nagpapahayag ng pagbabawal, hindi lamang ng kawalan ng kakayahan. Likas sa Filipino ang 'hindi maaaring' para sa ganitong puwersa.
- source_word: בִּשְׁעָרֶיךָ
  choice: sa loob ng inyong mga pintuang-bayan
  rationale: Pinananatili ang larawan ng Hebreong 'sa inyong mga pintuan,' habang nililinaw sa tambalang 'pintuang-bayan' na tumutukoy ito sa mga lokal na pamayanan.
- source_word: מַעְשַׂר
  choice: ikasampung bahagi
  rationale: Tumpak at madaling maunawaang katumbas ng bahaging isang-sampu; iniiwasan ang mas teknikal na hiram na 'ikapu' nang hindi nawawala ang kahulugan.
- source_word: דְּגָנְךָ
  choice: inyong butil
  rationale: Tumutukoy ito sa ani ng mga butil, hindi sa lahat ng uri ng ani.
- source_word: תִּירֹשְׁךָ
  choice: bagong alak
  rationale: Pinananatili ang karaniwang pagkakaiba ng תירוש bilang bago o sariwang alak mula sa mas pangkalahatang mga salita para sa alak.
- source_word: יִצְהָרֶךָ
  choice: langis
  rationale: Karaniwang tumutukoy sa langis, lalo na sa langis ng olibo, ngunit hindi kailangang gawing mas tiyak kaysa sa Hebreo.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: mga panganay ng inyong bakahan at kawan
  rationale: Ang 'mga panganay' ay tumutukoy sa unang supling; natural na kolektibong katumbas ang 'bakahan at kawan' para sa בקר at צאן.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: alinman sa inyong mga handog dahil sa panata
  rationale: Sa talaan ng mga bagay na kinakain, ang mga panata ay metonimikong tumutukoy sa mga handog na ipinangako sa panata. Nililinaw ito sa teksto ngunit itinatala sa talababa ang mas literal na anyo.
- source_word: נִדְבֹתֶיךָ
  choice: mga kusang-loob na handog
  rationale: Pinananatili ang natatanging uring kultiko ng mga handog na kusang ibinigay at hindi dahil sa panata o obligasyon.
- source_word: תְּרוּמַת יָדֶךָ
  choice: handog mula sa inyong kamay
  rationale: Natural sa Filipino at nananatiling malapit sa Hebreong idyoma nang hindi gumagamit ng teknikal at posibleng mapanlinlang na 'handog na itinaas.'
theological_decisions:
- issue: Mga terminong kultiko sa kontekstong legal at panghandog
  choice: Tukuyin bilang mga handog ang mga kategoryang ipinangako sa panata at kusang-loob, habang pinananatili ang pagkakaiba ng mga ito.
  alternative: Isalin nang literal bilang 'mga panatang inyong ipinapanata' at 'mga kusang-loob na kaloob.'
  rationale: Ang talata ay naglilista ng mga banal na pagkain at handog na hindi dapat kainin sa mga lokal na pamayanan. Ang tahasang 'handog' ay nagbibigay-linaw sa ritwal na konteksto, samantalang ang talababa ay nagpapanatili sa literal na anyo at tunay na saklaw ng נדר.
- issue: Puwersa ng לֹא תוּכַל
  choice: 'Ipakita bilang legal na pagbabawal: ''Hindi ninyo maaaring kainin.'''
  alternative: 'Isalin bilang pisikal na kawalan ng kakayahan: ''Hindi ninyo kayang kainin.'''
  rationale: Sa kontekstong ito, ang pahayag ay regulasyong tipanan at hindi paglalarawan ng pisikal na kakayahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang 'ninyo/inyong' ayon sa ikalawang panauhang panlalaki na isahan sa Hebreo ngunit kolektibong tumutukoy sa Israel; natural ito sa pambansang tagubilin sa Filipino. Pinanatili ang legal at ritwal na tono nang walang makalumang bokabularyo.
