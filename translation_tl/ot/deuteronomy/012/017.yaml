  to: Hindi ninyo maaaring kainin sa inyong mga bayan[a] ang ikasampung bahagi ng inyong butil, bagong alak, langis, mga panganay ng inyong bakahan at kawan, alinman sa inyong mga panata na inyong ipinapanata[b], mga kusang-loob na handog, at handog mula sa inyong kamay[c].
  rationale: Inayos ang daloy ng talaan, ginawang likas ang pagsasalin ng Hebreong idyoma para sa mga lokal na pamayanan, at ibinalik sa pangunahing teksto ang mas literal na “mga panata na inyong ipinapanata.” Ang posibleng kultikong kahulugan bilang mga handog ay nananatili sa talababa upang hindi maalis ang kalabuan ng Hebreo.
