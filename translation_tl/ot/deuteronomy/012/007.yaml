source:
  edition: WLC
  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: tl
  text: Doon kayo kakain sa harap ni Yahweh na inyong Diyos, at magagalak kayo, kayo at ang inyong mga sambahayan, sa lahat ng inyong pinagsisikapan, sapagkat sa mga ito ay pinagpala kayo ni Yahweh na inyong Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa lahat ng inyong mga gawain” o “sa lahat ng inyong isinasagawa.” Literal sa Hebreo, “sa lahat ng pagpapadala ng inyong kamay.” Ang idyoma ay tumutukoy sa lahat ng pinagsisikapan o isinasagawa ng tao; ang pangwakas na sugnay ay maaari ring unawaing, “na siyang pinagpala sa inyo ni Yahweh na inyong Diyos.”
    reason: Ipinapakita ang literal na idyoma at ang alternatibong pag-uugnay ng pangwakas na sugnay sa mga pinagsisikapan, nang hindi inaangkin ang isang higit na tiyak na pagbasa kaysa sa ipinahihiwatig ng Hebreo.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם שָׁם
  choice: Doon kayo kakain
  rationale: Ipinahahayag ng anyong pandiwa sa kontekstong ito ang gagawin ng Israel sa lugar na pipiliin ni Yahweh. Napananatili rin ng “doon” ang pagtukoy sa lugar mula sa naunang konteksto.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: sa harap ni Yahweh na inyong Diyos
  rationale: Natural na ipinahahayag ng “sa harap” ang pagkain sa presensiya ng Diyos bilang bahagi ng pagsamba, at pinananatili ang personal na pangalang Yahweh.
- source_word: וּשְׂמַחְתֶּם
  choice: magagalak
  rationale: Pinananatili nito ang masayang tugon na inaasahan sa sama-samang pagkain at pagsamba.
- source_word: בְּכֹל מִשְׁלַח יֶדְכֶם
  choice: sa lahat ng inyong ginagawa
  rationale: Ang idyomang Hebreo, na literal na tumutukoy sa “pag-uunat o pagpapakilos ng kamay,” ay tumutukoy sa mga gawain o pinagsisikapan ng isang tao. Ang saling ito ay malinaw at natural sa makabagong Tagalog habang inilalagay sa talababa ang literal na larawan at ibang maaaring diwa.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: kayo at ang inyong mga sambahayan
  rationale: Ang “mga sambahayan” ay tumutukoy sa buong yunit ng pamilya at hindi sa mga gusali lamang.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: sapagkat pinagpala kayo ni Yahweh na inyong Diyos
  rationale: Sa konteksto, ipinapakita ng sugnay ang pagpapala ni Yahweh bilang dahilan o batayan ng kanilang kagalakan. Ginamit ang maramihang “kayo” upang maging natural at malinaw sa Tagalog, bagaman isahan ang hulaping Hebreo rito.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang pinananatili ang personal at tipanang pangalan ng Diyos na nakasulat sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- issue: Paglipat mula sa maramihan tungo sa isahang kausap
  choice: 'Ginawang maramihan sa buong salin: “kayo” at “inyong”'
  alternative: 'Panatilihin ang biglang paglipat sa isahan: “pinagpala ka ni Yahweh na iyong Diyos”'
  rationale: Ang Hebreo ay lumilipat mula sa maramihang mga utos tungo sa isahang hulapi, gaya ng madalas sa Deuteronomio kapag kinakausap ang Israel bilang marami at bilang isang bayan. Dahil hindi nag-iiba ang anyo ng “kayo” sa Tagalog ayon sa gayong kolektibong gamit at magiging biglaan at malabo ang “ka” rito, ginawang maramihan ang panghalip nang hindi binabago ang kolektibong tinutukoy.
- issue: Ugnayan ng אֲשֶׁר sa naunang parirala
  choice: 'Isinaling sanhi: “sapagkat pinagpala kayo”'
  alternative: 'Isaling kaugnay: “na siyang ipinagpala sa inyo” o “kung saan pinagpala kayo”'
  rationale: Maaaring unawain ang אֲשֶׁר bilang nag-uugnay sa kanilang mga gawain o bilang nagpapaliwanag sa dahilan ng kagalakan. Pinili ang sanhi dahil ito ang pinakamalinaw at natural sa Tagalog, habang hindi itinatangging ang kagalakan ay saklaw ang mga gawaing pinagpala ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang daloy, habang pinananatili ang “sa harap ni Yahweh,” ang sama-samang sambahayan, at ang kagalakang bunga ng pagpapala ng Diyos.
