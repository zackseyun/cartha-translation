base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: tl
  text: Ngunit tanging ang mga banal na bagay na pag-aari mo at ang iyong mga handog na ipinanata[a] ang dadalhin mo, at magtutungo ka sa lugar na pipiliin ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga panata.” Maaaring tumukoy ang Hebreo sa mismong mga panata o, sa kontekstong ito ng paghahandog, sa mga handog na dinadala bilang pagtupad sa mga iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Sa konteksto, naghuhudyat ito ng pagbubukod o paghihigpit kumpara sa naunang pahintulot; natural na naipapahiwatig ng “Ngunit” ang pagsalungat, habang malinaw ang paghihigpit sa mismong utos.
- source_word: קָדָשֶׁיךָ אֲשֶׁר יִהְיוּ לְךָ
  choice: ang mga banal na bagay na nasa iyo
  rationale: Pinananatili ng “mga banal na bagay” ang malawak na saklaw ng katawagang kultiko, at ipinahahayag ng “na nasa iyo” ang pag-aari o pananagutang ipinahihiwatig ng לְךָ.
- source_word: וּנְדָרֶיךָ
  choice: at ang iyong mga handog na ipinanata[a]
  rationale: Literal itong maaaring tumukoy sa “mga panata,” ngunit sa konteksto ng paghahandog ay malamang na tumutukoy sa mga handog na dinadala bilang pagtupad sa mga iyon. Nililinaw ng salin ang kongkretong tinutukoy habang itinatala sa talababa ang tunay na alternatibo.
- source_word: תִּשָּׂא
  choice: ay dadalhin mo
  rationale: Ang pandiwa ay may diwang pagbuhat o pagdadala; ang “dadalhin mo” ay natural sa Filipino at pinananatili ang kongkretong kilos ng pagdadala sa itinakdang lugar.
- source_word: וּבָאתָ
  choice: at pupunta ka
  rationale: Bagaman karaniwang “dumating/pumasok” ang pandiwa, ang “pupunta ka” ang likas na deiktikong anyo sa Filipino para sa paglalakbay ng mananamba patungo sa lugar na pipiliin ng Diyos, nang hindi isinasanib sa naunang pandiwa.
- source_word: הַמָּקוֹם
  choice: sa lugar
  rationale: Pinananatili ang mahalagang pormulang Deuteronomiko nang hindi dinaragdagan ng “santuwaryo,” na hindi tahasang nasa teksto.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: na pipiliin ni Yahweh
  rationale: Ang anyong pandiwa ay angkop na pasulong ang pananaw sa lugar na itatalaga, at ang pangalang tipan na יהוה ay tinumbasan bilang “Yahweh.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tahasan sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng וּנְדָרֶיךָ sa kontekstong panghandog
  choice: mga handog na ipinanata
  alternative: mga panata
  rationale: Sa kontekstong ito, maaaring gamitin ang salitang “mga panata” bilang metonimiya para sa mga handog na tumutupad sa mga panata. Pinili sa teksto ang kongkretong kahulugan ngunit pinanatili sa talababa ang leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang ayos na “ay dadalhin mo” upang mapanatili ang diin sa mga banal na bagay at mga handog bilang layon ng utos. Iniwasan ang labis na teknikal na bokabularyong panrelihiyon.
