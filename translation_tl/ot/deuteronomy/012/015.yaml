revisions:
- from: Ngunit kapag nais mo[a], maaari kang magkatay at kumain ng karne sa loob ng alinman sa iyong mga bayan[b], ayon sa pagpapalang ibinigay sa iyo ni Yahweh na iyong Diyos. Maaaring kumain nito kapwa ang marumi at ang malinis, gaya ng pagkain nila ng gasela at usa.
  to: Ngunit tuwing nais mo[a], maaari kang magkatay at kumain ng karne, ayon sa pagpapalang ibinigay sa iyo ni Yahweh na iyong Diyos, sa alinman sa iyong mga bayan[b]. Maaaring kumain nito kapwa ang marumi at ang malinis, gaya ng gasela o usa.
