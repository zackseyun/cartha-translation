id: DEU.12.15
reference: Deuteronomy 12:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: tl
  text: Ngunit tuwing nais mo[a], maaari kang magkatay at kumain ng karne, ayon sa pagpapalang ibinigay sa iyo ni Yahweh na iyong Diyos, sa alinman sa iyong mga bayan[b]. Maaaring kumain nito kapwa ang marumi at ang malinis, gaya ng gasela o usa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal sa Hebreo: “sa lahat ng nasa ng iyong sarili,” isang idyomang nangangahulugang tuwing nais mo.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal sa Hebreo: “sa lahat ng iyong mga pintuang-bayan.” Ang “mga pintuang-bayan” ay tumutukoy dito sa mga bayan o pamayanan.'
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Ipinakikita ang paglilimita o paglilinaw kaugnay ng naunang utos; natural ito sa Tagalog nang hindi nawawala ang adversatibong diwa.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: kapag nais mo
  rationale: Natural na katumbas ng idyomang Hebreo na literal na tumutukoy sa buong pagnanais ng נפש; hindi kailangang isalin ang 'kaluluwa' dahil magiging di-likas at maaaring magpahiwatig ng ibang teolohikal na kahulugan sa Tagalog.
- source_word: תִּזְבַּח
  choice: maaari kang magkatay
  rationale: Sa konteksto, pahintulot ang ipinahahayag, at ang 'magkatay' ay tiyak na tumutukoy sa pagpatay ng hayop para kainin.
- source_word: וְאָכַלְתָּ בָשָׂר
  choice: at kumain ng karne
  rationale: Ang בָשָׂר dito ay laman ng hayop bilang pagkain; 'karne' ang malinaw at karaniwang modernong salita.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: ayon sa pagpapalang ibinigay sa iyo ni Yahweh na iyong Diyos
  rationale: Pinananatili ang pangngalang 'pagpapala' at ang diwang ang maaaring kainin ay ayon sa panustos na kaloob ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: sa loob ng alinman sa iyong mga bayan
  rationale: Ang literal na 'sa lahat ng iyong mga pintuang-bayan' ay idyomang tumutukoy sa mga bayan o pamayanan; 'alinman' ang natural na distributibong pagpapahayag sa Tagalog.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: kapwa ang marumi at ang malinis
  rationale: Pinananatili ang mga kategorya ng ritwal na kalagayan at nililinaw ng 'kapwa' na pareho silang pinahihintulutan.
- source_word: יֹאכְלֶנּוּ
  choice: Maaaring kumain nito
  rationale: Pahintulot ang diwa sa konteksto; ang 'nito' ay tumutukoy sa karne.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: gaya ng pagkain nila ng gasela at usa
  rationale: Ang paghahambing ay sa pagkain ng mga hayop na mailap; idinagdag ang 'pagkain nila' bilang likas na paglilinaw sa Tagalog, habang pinananatili ang dalawang halimbawang hayop.
theological_decisions:
- issue: Paglalarawan sa marumi at malinis
  choice: Pinanatili ang 'marumi' at 'malinis' nang walang dagdag na 'seremonyal' sa pangunahing teksto.
  alternative: marumi o malinis ayon sa ritwal
  rationale: Ritwal na kalagayan ang pangunahing konteksto, ngunit ang pagdaragdag ng paliwanag sa mismong teksto ay maaaring sumobra sa tahasang sinasabi ng Hebreo.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong pangalan at hindi pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'maaari' para sa pahintulot, 'magkatay' para sa pagpatay ng hayop bilang pagkain, at 'mga bayan' sa pangunahing teksto upang natural na maipahayag ang Hebreong idyoma; ang literal na anyo ay nasa talababa.
