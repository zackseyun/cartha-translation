translation:
  language: tl
  text: Huwag kayong kumilos gaya ng ginagawa natin dito ngayon—bawat isa ay gumagawa ng anumang matuwid sa sarili niyang paningin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bawat lalaki”; distributibo ang pananalita at tumutukoy sa bawat taong kumikilos ayon sa sarili niyang paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: Huwag ninyong gawin
  rationale: Ang imperfect na ikalawang panauhang maramihan sa ilalim ng negasyon ay may puwersa ng pagbabawal o tagubilin. Likas at malinaw sa modernong Tagalog ang “Huwag ninyong gawin.”
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ng
  rationale: Sa konstruksiyong Tagalog, ang paghahambing na “huwag gawin gaya ng lahat ng…” ay likas na naipahihiwatig sa buong sugnay; pinananatili ng “ang lahat ng ginagawa natin” ang saklaw ng כֹל nang hindi nagiging pilit.
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: ginagawa natin dito ngayon
  rationale: Ipinapakita ng participle kasama ng mga panandang pook at panahon ang kasalukuyang gawain. Ang “ginagawa natin dito ngayon” ay natural at tapat sa aspektong nagpapatuloy.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Ang singular na אִישׁ ay gamit nang distributibo. Sa Tagalog, ang “bawat isa” ang pinakanatural na paraan upang ihayag ang indibiduwal na saklaw; hindi kailangang ipilit ang kasariang panlalaki dahil hindi ito likas sa mga panghalip na Tagalog.
- source_word: כָּל הַיָּשָׁר
  choice: anumang matuwid
  rationale: Pinananatili nito ang literal na pagtataya na “matuwid,” sa halip na idagdag ang interpretibong “inaakalang matuwid.”
- source_word: בְּעֵינָיו
  choice: sa sarili niyang paningin
  rationale: Pinananatili ang idyomang Hebreo tungkol sa pansariling paghatol o pagtataya, at malinaw na ipinahihiwatig ng “sarili niyang” ang indibiduwal na pamantayan.
theological_decisions:
- issue: Ang distributibong אִישׁ ... בְּעֵינָיו
  choice: bawat isa ... sa sarili niyang paningin
  alternative: bawat lalaki ... sa sarili niyang paningin
  rationale: Mas natural sa Tagalog ang walang-kasariang “bawat isa,” samantalang nananatili ang singular at distributibong puwersa. Ang “bawat lalaki” ay maaaring maling magpahiwatig na mga lalaki lamang ang tinutukoy.
- issue: Kung ang הַיָּשָׁר ay obhetibong “matuwid” o yaong itinuturing na matuwid
  choice: anumang matuwid sa sarili niyang paningin
  alternative: anumang inaakala niyang matuwid
  rationale: 'Pinananatili ng napiling salin ang idyoma at ang tensiyon ng teksto: ang bagay ay “matuwid” ayon sa sariling paningin ng tao. Ang alternatibo ay mas tahasang nagpapaliwanag at maaaring labis na lumutas sa pahiwatig.'
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na himig. Ginamit ang “huwag ninyong” para sa maramihang tagubilin at “matuwid sa sarili niyang paningin” upang mapanatili ang idyomang Hebreo. Ang gitling na em dash ay naghihiwalay sa pangkalahatang pagbabawal at sa paliwanag ng kasalukuyang asal.
