id: DEU.12.10
reference: Deuteronomy 12:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: tl
  text: Kapag tumawid kayo sa Jordan at nanirahan sa lupaing ipinamamana sa inyo ni Yahweh na inyong Diyos, bibigyan niya kayo ng kapahingahan mula sa lahat ng kaaway ninyo sa palibot, at mamumuhay kayo nang ligtas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maninirahan kayo nang tiwasay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַרְתֶּם
  choice: Kapag tumawid kayo
  rationale: Sa konteksto, ang anyong may waw ay bahagi ng panghinaharap na pagkakasunod-sunod at may temporal na diwa; malinaw at likas itong naipahahayag ng “Kapag tumawid kayo.”
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Karaniwang anyo sa Filipino ng pangalang heograpiko; malinaw sa konteksto na ilog ang tinutukoy.
- source_word: וִישַׁבְתֶּם
  choice: nanirahan / mamumuhay
  rationale: Ang ישׁב ay tumutukoy sa paninirahan o permanenteng pagtira. Ginamit ang mga likas na salitang Filipino ayon sa sintaks ng bawat paglitaw.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Pinananatili ng “lupain” ang heograpiko at tipanang diwa ng אֶרֶץ nang hindi nagiging lipas ang pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: מַנְחִיל אֶתְכֶם
  choice: ipinamamana sa inyo
  rationale: 'Ipinahahayag nito ang Hiphil ng נחל: si Yahweh ang nagkakaloob sa bayan ng lupain bilang mana.'
- source_word: וְהֵנִיחַ לָכֶם
  choice: bibigyan niya kayo ng kapahingahan
  rationale: Pinananatili nito ang sanhi at kaloob na diwa ng Hiphil ng נוח, pati ang mahalagang motibo ng kapahingahan sa lupain.
- source_word: מִכָּל אֹיְבֵיכֶם מִסָּבִיב
  choice: mula sa lahat ng kaaway ninyo sa palibot
  rationale: Inihahatid nito kapwa ang kabuuan ng panganib at ang panlahat na direksiyong ipinahihiwatig ng מִסָּבִיב.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: mamumuhay kayo nang ligtas
  rationale: Likas na modernong Filipino ito para sa paninirahang walang panganib na ipinahihiwatig ng בֶּטַח.
theological_decisions:
- issue: Paglalarawan sa lupain bilang mana
  choice: ipinamamana sa inyo
  alternative: ibinibigay sa inyo upang inyong ariin
  rationale: Pinananatili ng pinili ang diwa ng mana at ang pagkilos ng Diyos, nang hindi ipinapakahulugan nang higit sa sinasabi ng pandiwang Hebreo.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa pinagmulang teksto; ang transliterasyong “Yahweh” ay nagpapanatili sa pagkakaiba nito sa mga titulong Hebreo para sa Panginoon.
- issue: Kapahingahan mula sa mga kaaway
  choice: bibigyan niya kayo ng kapahingahan
  alternative: pagpapahingahin niya kayo
  rationale: Ang “bibigyan ... ng kapahingahan” ay nagpapanatili sa teolohikal na motibo ng kapahingahan habang malinaw na ang Diyos ang nagkakaloob nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lupain,” “mana,” at “kapahingahan” upang mapanatili ang mahahalagang ugnayang leksikal at teolohikal ng teksto, habang iniwasan ang sobrang literal o makalumang ayos.
