  source_fidelity: 'Tumpak na naihahatid ng salin ang panghinaharap at temporal na daloy ng Hebreo: pagtawid sa Jordan, paninirahan sa lupain na ibinibigay bilang mana ni Yahweh, kapahingahan mula sa mga kaaway sa paligid, at ligtas na pamumuhay. Napananatili rin ang sanhi/kaloob na diwa ng Hiphil sa “ipinamamana” at “bibigyan ... ng kapahingahan.”'
