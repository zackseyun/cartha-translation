base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/023.yaml
  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: tl
  text: Tiyakin mo lamang na huwag kang kumain ng dugo, sapagkat ang dugo ang buhay[a]; huwag mong kainin ang buhay kasama ng laman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaluluwa” ang salin ng salitang Hebreo na נֶפֶשׁ sa dalawang paglitaw nito; dito, tumutukoy ito sa buhay na nagbibigay-sigla sa nilalang, kaya “buhay” ang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Minamarkahan nito ang mahigpit na pagbubukod sa naunang pahintulot. Sa Filipino, natural na ipinahihiwatig ng “Ngunit” ang pagsalungat at limitasyon.
- source_word: חֲזַק לְבִלְתִּי אֲכֹל
  choice: tiyakin mong hindi mo kakainin
  rationale: Bagaman literal na “magpakatatag upang hindi kumain,” isa itong mariing idyomatikong tagubilin. Ang “tiyakin mong” ay natural at nananatiling mariin.
- source_word: הַדָּם
  choice: ang dugo
  rationale: Tuwirang katumbas at pinanatiling pareho sa dalawang paglitaw nito.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ang dahilan ng pagbabawal at pinananatili ang marangal na legal na himig.
- source_word: הַנָּפֶשׁ
  choice: ang buhay
  rationale: Sa kontekstong ito, tumutukoy ang נֶפֶשׁ sa buhay na nagbibigay-sigla sa nilalang, hindi kinakailangang sa isang hiwalay at di-materyal na kaluluwa.
- source_word: וְלֹא תֹאכַל
  choice: huwag mong kainin
  rationale: Malinaw at natural na Filipino para sa pagbabawal na ipinahahayag ng Hebrew imperfect sa legal na tagubilin.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: ang buhay kasama ng laman
  rationale: Pinananatili ang konkretong larawan at ang ugnayang leksikal sa naunang pahayag. Ang “laman” ay mas malapit sa בָּשָׂר kaysa sa mas makitid na “karne.”
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa konteksto ng batas tungkol sa pagkain
  choice: buhay
  alternative: kaluluwa
  rationale: Ipinapaliwanag ng talata ang pagbabawal sa dugo sa pamamagitan ng pag-uugnay nito sa buhay ng nilalang. Iniiwasan ng “buhay” ang pagpasok ng pilosopikal na paghihiwalay ng katawan at kaluluwa na hindi hinihingi ng Hebrew, habang inilalahad sa talababa ang tunay na alternatibong leksikal.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “tiyakin mong” upang maipahayag nang natural ang mariing utos, at pinanatili ang “laman” at “buhay” upang hindi mawala ang konkretong lohika ng Hebrew.
