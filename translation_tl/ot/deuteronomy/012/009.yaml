base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: tl
  text: Sapagkat hindi pa kayo dumarating sa lugar ng kapahingahan[a] at sa pamana na ibinibigay sa inyo ni Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapahingahan.” Ang salitang Hebreo na מְנוּחָה ay maaaring tumukoy sa kapahingahan bilang kalagayan o sa isang lugar ng kapahingahan; sa kontekstong ito ng lupain, mas malamang ang konkretong kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang utos at pinananatili ang ugnayang sanhi sa daloy ng pangungusap.
- source_word: בָּאתֶם
  choice: nakararating
  rationale: Ang בוא ay maaaring mangahulugang dumating o pumasok; ang “nakararating” ay likas kasama ng “hindi pa” at ng tinutukoy na hantungan.
- source_word: עַד עָתָּה
  choice: hanggang ngayon ... hindi pa
  rationale: Magkasamang ipinahahayag ng negatibo at pariralang temporal na hindi pa nagaganap ang pagdating hanggang sa kasalukuyang sandali.
- source_word: הַמְּנוּחָה
  choice: lugar ng kapahingahan
  rationale: Maaaring tumukoy ang מְנוּחָה sa abstraktong kapahingahan o sa isang konkretong lugar ng kapahingahan; mas pinapaboran ng konteksto ng pagpasok sa lupain ang konkretong diwa.
- source_word: הַנַּחֲלָה
  choice: pamana
  rationale: Tumutukoy ang נַחֲלָה sa minanang o itinakdang pag-aari, lalo na sa lupaing kaloob ng Diyos; pinananatili ng “pamana” ang diwa ng kaloob at takdang bahagi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipanang pangalan ng Diyos sa malinaw at karaniwang anyong Filipino.
- source_word: נֹתֵן
  choice: ibinibigay
  rationale: Pinananatili ang aspektong nagpapatuloy o nalalapit ng participle at ang paglalarawan sa lupain bilang kasalukuyang kaloob ng Diyos.
- source_word: לָךְ
  choice: sa inyo
  rationale: Bagaman isahan ang pronominal na anyo sa Hebreo, kolektibo nitong tinutukoy ang Israel; likas sa Filipino ang maramihang “inyo” kasunod ng “kayo.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng מְנוּחָה sa konteksto ng lupain
  choice: lugar ng kapahingahan
  alternative: kapahingahan
  rationale: Ang paralelismo sa “pamana” at ang konteksto ng pagdating sa lupain ay nagpapahiwatig ng konkretong hantungan, ngunit pinananatili sa talababa ang lehitimong abstraktong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakararating” sa halip na mas pormal na “dumating” upang maging natural sa konstruksiyong “hanggang ngayon ay hindi pa,” at pinanatili ang “pamana” bilang payak ngunit mayaman na katawagang biblikal.
