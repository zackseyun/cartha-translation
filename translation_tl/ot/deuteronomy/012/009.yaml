  rationale: Pinalitan ang "hanggang ngayon ay hindi pa kayo nakararating" ng "hindi pa kayo dumarating" upang maging mas tuwiran ang Filipino habang ipinahahayag ang Hebreong negatibong pahayag na may hanggang-sa-kasalukuyang-panahon na diwa. Pinanatili ang lahat ng pangunahing terminong leksikal at ang talababa.
