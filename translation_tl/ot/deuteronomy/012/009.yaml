  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang Israel ay hindi pa dumarating sa pahingahang/lugar ng kapahingahan at sa pamana na ibinibigay ni Yahweh na kanilang Diyos. Gayunman, ang pandiwang "nakararating" ay karaniwang imperpektibo o habitual at hindi pinakanatural na katumbas ng perpektong "hindi pa kayo dumating."'
  naturalness: Mas natural at tuwiran sa modernong Filipino ang "hindi pa kayo dumarating" o, higit na angkop sa natapos-naunit-hindi-pa-naisasagawang dating, "hindi pa kayo nakararating"—ngunit ang huli ay maaari ring magpahiwatig ng kakayahan/paulit-ulit na pagdating. "Hindi pa kayo dumating" ang pinakamalinaw. Ang "hanggang ngayon" ay maaaring panatilihin ngunit hindi kailangan sapagkat saklaw na ito ng "hindi pa"; ang "hanggang sa ngayon" ay mas ganap kung isasama.
  terminology: Ang "lugar ng kapahingahan," "pamana," at "Yahweh na inyong Diyos" ay angkop. Nananatiling mabuti ang talababa para sa alternatibong abstraktong kahulugan ng מְנוּחָה.
