source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: tl
  text: Kung napakalayo sa iyo ang lugar na pipiliin ni Yahweh na iyong Diyos upang ilagay roon ang kanyang pangalan, maaari kang magkatay mula sa iyong bakahan at kawan na ibinigay sa iyo ni Yahweh, gaya ng iniutos ko sa iyo, at maaari kang kumain sa loob ng iyong mga bayan[a] ayon sa buong gana mo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa loob ng iyong mga pintuang-bayan.”
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa lahat ng pagnanasa ng iyong sarili” o “ayon sa lahat ng iyong ninanais.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: Kung napakalayo sa iyo
  rationale: Ipinahahayag ng כִּי rito ang isang kondisyong nagbibigay-daan sa kasunod na pahintulot. Ang יִרְחַק ay pagiging malayo; ipinakikita ng “napakalayo” ang praktikal na dahilan ng pahintulot nang hindi binabago ang diwa.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: ang lugar na pipiliin ni Yahweh na iyong Diyos
  rationale: Ang anyong yiqtol ng בחר ay likas na maisasalin dito bilang hinaharap na “pipiliin,” ayon sa paulit-ulit na pormula sa Deuteronomio tungkol sa lugar na itatalaga ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: upang ilagay roon ang kanyang pangalan
  rationale: Tuwirang isinasalin ang שׂים bilang “ilagay” at pinananatili ang pormulang Deuteronomiko nang hindi dinaragdagan ng paliwanag tungkol sa pananahan.
- source_word: וְזָבַחְתָּ
  choice: maaari kang magkatay
  rationale: Sa konteksto, pinahihintulutan ang lokal na pagkatay para kainin, hindi ang paghahandog sa isang lokal na dambana. Kaya “magkatay” at ang pahintulot na “maaari” ang angkop.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: mula sa iyong bakahan at kawan
  rationale: Ang בָּקָר at צֹאן ay kolektibong tawag sa malalaki at maliliit na alagang hayop. Ang “bakahan at kawan” ay maikli, natural, at sapat na malawak.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: gaya ng iniutos ko sa iyo
  rationale: Pinananatili ang unang panauhang nagsasalita—si Moises—at ang pagtukoy sa naunang tagubilin.
- source_word: בִּשְׁעָרֶיךָ
  choice: sa loob ng iyong mga bayan
  rationale: Literal na “sa iyong mga pintuang-bayan,” ngunit metonimiya ito para sa mga bayang tinitirhan. Mas malinaw sa kasalukuyang Tagalog ang “sa loob ng iyong mga bayan,” habang inilalagay sa talababa ang literal na larawan.
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: ayon sa anumang nais mong kainin
  rationale: Ang אַוַּת נֶפֶשׁ ay pagnanasa o gana ng tao. Sa konteksto ng pagkain, malinaw at natural ang “anumang nais mong kainin,” habang ang mas literal na alternatibo ay pinananatili sa talababa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Sakripisyo o karaniwang pagkatay
  choice: maaari kang magkatay
  alternative: maghahandog ka; papatayin mo
  rationale: Ang mas malawak na konteksto ng Deuteronomio 12 ay nagpapahintulot ng karaniwang pagkatay at pagkain kapag malayo ang santuwaryo. Ang “magkatay” ay hindi nag-aangking ito ay lokal na hain.
translation_notes:
  register: Makabago at marangal na Filipino, na may tuwirang sintaks at bokabularyong madaling maunawaan. Ginamit ang “mga bayan” para sa Hebreong metonimiyang “mga pintuang-bayan,” at pinanatili sa talababa ang literal na larawan. Iniwasan ang sobrang literal at di-likas na “pagnanasa ng iyong kaluluwa,” ngunit hindi inalis ang alternatibong antropolohikal sa talababa.
