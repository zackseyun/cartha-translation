  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: tl
  text: kundi sa lugar lamang[a] na pipiliin ni Yahweh sa nasasakupan ng isa sa inyong mga lipi[b]. Doon ninyo ihahandog ang inyong mga handog na sinusunog, at doon ninyo gagawin ang lahat ng iniuutos ko sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “maliban sa lugar na pipiliin ni Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa isa sa inyong mga lipi”; ang ibig sabihin ay sa teritoryo o nasasakupan ng isa sa mga lipi ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  choice: kundi ... lamang
  rationale: Kasunod ng pagbabawal sa naunang talata, naghahayag ang idyoma ng pagsalungat at ng tanging pinahihintulutang eksepsiyon. Likas sa modernong Tagalog ang paghahating “kundi ... lamang.”
- source_word: בַּמָּקוֹם
  choice: sa lugar
  rationale: Tumutukoy ito sa tiyak na lugar ng pagsamba na pipiliin ng Diyos.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: na pipiliin ni Yahweh
  rationale: Ipinahihiwatig ng yiqtol ang pagpiling magaganap pa; malinaw itong naipapahayag ng “pipiliin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton.
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: sa nasasakupan ng isa sa inyong mga lipi
  rationale: Literal itong “sa isa sa inyong mga lipi,” ngunit ang lugar ang matatagpuan sa teritoryo o nasasakupan ng isang lipi. Nililinaw ng salin ang lokatibong diwa habang pinananatili ang katawagang “lipi.”
- source_word: שָׁם
  choice: doon
  rationale: Pinananatili sa dalawang paglitaw ang pag-uulit para idiin na ang piniling lugar lamang ang pinahihintulutan.
- source_word: תַּעֲלֶה
  choice: ihahandog
  rationale: Ang Hiphil ng עלה kasama ng עֹלָה ay isang teknikal na pahayag para sa paghahandog ng haing sinusunog. Natural at tumpak sa Tagalog ang “ihahandog.”
- source_word: עֹלֹתֶיךָ
  choice: inyong mga handog na sinusunog
  rationale: Ito ang handog na lubos na sinusunog sa altar; malinaw at madaling maunawaan ang pariralang ito sa modernong Tagalog.
- source_word: תַּעֲשֶׂה
  choice: gagawin
  rationale: Pinananatili ang malawak na diwa ng עשה at natural itong kabit ng “lahat ng iniuutos ko.”
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: ang lahat ng iniuutos ko sa inyo
  rationale: Ang “iniuutos” ay sumasalamin sa patuloy o kasalukuyang bisa ng participle na מְצַוֶּה. Ginamit ang maramihang “inyo” dahil ang gramatikal na isahang Israel ay kolektibong bayan ang kausap.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Ang piniling lugar ng paghahandog
  choice: Ipinahayag bilang tanging pinahihintulutang lugar, nang hindi tinutukoy kung aling santuwaryo iyon
  alternative: Tahasang tukuyin ito bilang Jerusalem o templo
  rationale: Sinasabi lamang ng talata na pipiliin ni Yahweh ang lugar sa nasasakupan ng isang lipi. Hindi idinaragdag ang isang pagkakakilanlang hindi tahasang binanggit rito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nasasakupan” upang iwasan ang maling pagkaunawa na ang lugar ay nasa loob ng mga taong bumubuo sa lipi. Ang isahang panauhan sa Hebreo ay tumutukoy sa Israel bilang isang kolektibong bayan, kaya maramihang “ninyo/inyo” ang ginamit sa natural na Tagalog.
