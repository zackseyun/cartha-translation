source:
  edition: WLC
  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: tl
  text: Sa halip, kakainin mo iyon sa harap ni Yahweh na iyong Diyos, sa lugar na pipiliin ni Yahweh na iyong Diyos—ikaw, ang iyong anak na lalaki, ang iyong anak na babae, ang iyong lalaking alipin, ang iyong babaeng alipin, at ang Levitang nasa loob ng iyong mga pintuang-bayan[a]—at magalak ka sa harap ni Yahweh na iyong Diyos sa lahat ng iyong ginagawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nasa loob ng iyong mga pintuang-bayan,” isang idyomang Hebreo na tumutukoy sa lokal na pamayanan o nasasakupan.
    reason: cultural_note
  - marker: b
    text: Sa literal, “sa lahat ng pagpapadala ng iyong kamay”; ibig sabihin, sa lahat ng iyong ginagawa o pinagsisikapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sa halip
  rationale: Ipinahahayag ng parirala ang mahigpit na pagsalungat sa ipinagbawal sa naunang talata at ipinakikilala ang tanging pinahihintulutang paraan.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: sa harap ni Yahweh na inyong Diyos
  rationale: Pinananatili ng “sa harap” ang literal na diwang “sa presensiya,” at ang pangalang יְהוָה ay isinaling Yahweh.
- source_word: תֹּאכְלֶנּוּ
  choice: kakainin ninyo iyon
  rationale: Ipinakikita ng anyong pandiwa ang tagubilin, at pinananatili ng “iyon” ang panlalaking isahang layon na tumutukoy sa naunang binanggit.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: sa lugar na pipiliin ni Yahweh na inyong Diyos
  rationale: Natural sa Tagalog ang hinaharap na “pipiliin,” at naisasama na sa “sa lugar” ang kahulugan ng bumabalik na panghalip בּוֹ.
- source_word: אַתָּה וּבִנְךָ וּבִתֶּךָ
  choice: kayo, ang inyong anak na lalaki at anak na babae
  rationale: Pinananatili ang tahasang pagbanggit sa dalawang anak at ang isahang pakikipag-usap, na magalang na ipinahahayag sa Tagalog sa pamamagitan ng “kayo/inyong.”
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: ang inyong aliping lalaki at aliping babae
  rationale: Pinananatili ang pagkakaiba ng kasarian sa dalawang katawagang Hebreo at ang kalagayan nila bilang mga alipin sa sambahayan.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: ang Levitang nasa loob ng inyong mga pintuang-bayan
  rationale: Pinananatili sa teksto ang larawang Hebreo ng mga pintuang-bayan, habang nililinaw sa talababa na tumutukoy ito sa lokal na pamayanan.
- source_word: וְשָׂמַחְתָּ
  choice: Magagalak kayo
  rationale: Ipinahahayag nito ang aktibong kagalakan sa konteksto ng sama-samang pagsamba at pagdiriwang.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: sa lahat ng inyong ginagawa
  rationale: Natural nitong ipinahahayag sa makabagong Tagalog ang idyomang literal na tumutukoy sa lahat ng pinaglalaanan o ipinagagawa ng kamay.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng pagkain at kagalakan “sa harap” ng Diyos
  choice: Pinanatili ang “sa harap ni Yahweh”
  alternative: sa presensiya ni Yahweh
  rationale: Ang literal at likas na pariralang ito ay hindi nagpapaliit sa kahulugan sa isang pisikal na lokasyon lamang, kundi pinananatili ang kaugnayan nito sa presensiya at pagsambang itinakda ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magalang na isahang “kayo/inyong” para sa Hebreong 2ms, gaya ng karaniwang estilo sa saling Bibliya. Pinanatili ang “mga pintuang-bayan” sa pangunahing teksto upang hindi mawala ang larawang Hebreo, at ipinaliwanag ito sa talababa.
