  to: Sa halip, kakainin mo iyon sa harap ni Yahweh na iyong Diyos, sa lugar na pipiliin ni Yahweh na iyong Diyos—ikaw, ang iyong anak na lalaki, ang iyong anak na babae, ang iyong lalaking alipin, ang iyong babaeng alipin, at ang Levitang nasa loob ng iyong mga pintuang-bayan[a]—at magalak ka sa harap ni Yahweh na iyong Diyos sa lahat ng iyong ginagawa[b].
