base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: tl
  text: Kapag inalis ni Yahweh na iyong Diyos sa harap mo ang mga bansang pupunta ka roon upang alisinan ng lupain, at alisinan mo sila ng lupain at manirahan ka sa kanilang lupain,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Ipinakikilala nito ang isang pangyayaring magaganap sa hinaharap at nagsisilbing panimula sa babala sa kasunod na talata.
- source_word: יַכְרִית
  choice: inalis
  rationale: Sa kontekstong ito, tumutukoy ang Hiphil ng כרת sa pag-aalis sa mga bansa mula sa harap ng Israel. Hindi pinalalabis ng “inalis” ang diwa tungo sa tahasang ganap na paglipol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan nito ang personal na pangalang יהוה sa halip na palitan iyon ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang ipinapakita ang pang-isahang panlalaking hulaping nangangahulugang “mo” at pinananatili ang karaniwang pormulang tipan.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Ito ang karaniwan at angkop na salin para sa mga pangkat ng taong naninirahan sa lupain.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: na pupuntahan mo roon
  rationale: Pinananatili ang diwa ng pandiwang “pumaroon” at ng pang-abay na “roon” sa natural na ayos sa Filipino.
- source_word: לָרֶשֶׁת אֹתָם
  choice: upang agawan ng lupain
  rationale: Sa konteksto, ang ירש na may mga bansa bilang layon ay tumutukoy sa pagkuha sa kanilang lupain at pagpapaalis sa kanila bilang mga dating naninirahan.
- source_word: מִפָּנֶיךָ
  choice: sa harap mo
  rationale: Pinananatili ang Hebreong idyoma para sa pag-aalis sa daraanan o presensiya ng Israel.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: at maagawan mo sila ng lupain
  rationale: Inuulit ang diwa ng ירש at nililinaw sa natural na Filipino kung ano ang aagawin sa mga bansang iyon.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: at manirahan ka sa kanilang lupain
  rationale: Ang “manirahan” ay natural ngunit marangal na katumbas ng ישב at ipinapakita ang pagkakasunod ng pag-aari at paninirahan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng titulo o gumamit ng ibang tradisyonal na anyo.
- issue: Lawak ng kahulugan ng יַכְרִית
  choice: inalis
  alternative: nilipol / pinuksa
  rationale: Ang konteksto ay malinaw na nagsasaad ng pag-aalis sa mga bansa sa harap ng Israel, ngunit hindi kailangang ipasiya sa salin na ang pandiwa rito ay nangangahulugan ng ganap na pag-ubos sa bawat tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pang-isahang kausap sa “mo/ka,” gayundin ang anyong sugnay na nagtatapos sa kuwit sapagkat nagpapatuloy ang pangungusap at babala sa kasunod na talata.
