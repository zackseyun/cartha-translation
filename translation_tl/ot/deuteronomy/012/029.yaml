revisions:
- from: Kapag inalis ni Yahweh na iyong Diyos sa harap mo ang mga bansang pupuntahan mo roon upang agawan ng lupain, at maagawan mo sila ng lupain at manirahan ka sa kanilang lupain,
  to: Kapag inalis ni Yahweh na iyong Diyos sa harap mo ang mga bansang pupunta ka roon upang alisinan ng lupain, at alisinan mo sila ng lupain at manirahan ka sa kanilang lupain,
  rationale: Inayos ang ayos ng sugnay upang malinaw na ang kausap ay pupunta roon, hindi basta “pupunta sa mga bansa,” at pinalitan ang “agawan ng lupain” ng mas tumpak at mas marangal na “alisinan ng lupain.” Pinanatili ang pag-uulit ng pandiwang katumbas ng ירש, ang pang-isahang kausap, at ang kuwit na naghuhudyat ng pagpapatuloy sa Deuteronomio 12:30.
