  text: וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵי֮ יְהוָ֣ה אֱלֹֽהֵי/כֶם֒ אַתֶּ֗ם וּ/בְנֵי/כֶם֙ וּ/בְנֹ֣תֵי/כֶ֔ם וְ/עַבְדֵי/כֶ֖ם וְ/אַמְהֹתֵי/כֶ֑ם וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בְּ/שַֽׁעֲרֵי/כֶ֔ם כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: tl
  text: At magalak kayo sa harap ni Yahweh na inyong Diyos—kayo, ang inyong mga anak na lalaki at babae, ang inyong mga aliping lalaki at babae, at ang Levitang nasa loob ng inyong mga pintuang-bayan[a]—sapagkat wala siyang bahagi o mana kasama ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Levitang nasa inyong mga bayan”; literal, “nasa loob ng inyong mga pintuan.”
    reason: Ipinakikita ang metonimikong kahulugan ng Hebreong “mga pintuan” bilang mga bayan o pamayanan habang pinananatili sa pangunahing teksto ang orihinal na imahen.
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: At magalak kayo
  rationale: Ang anyong pandiwa sa kontekstong tagubilin ay may puwersang pautos. Natural at marangal sa Filipino ang “magalak,” at pinananatili nito ang diwa ng sama-samang kagalakan sa pagsamba.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: sa harap ni Yahweh na inyong Diyos
  rationale: Ang לִפְנֵי ay “sa harap” o “sa presensya.” Pinananatili ang personal na pangalang Yahweh at ang tuwirang anyo ng parirala.
- source_word: וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: ang inyong mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagtukoy sa kapwa mga anak na lalaki at babae nang hindi inuulit nang mabigat ang salitang “anak.”
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: ang inyong mga aliping lalaki at babae
  rationale: Ang “alipin” ay malinaw na naghahayag ng nakapailalim na kalagayang panlipunan ng mga tinutukoy; pinananatili rin ang pagkakaibang lalaki at babae.
- source_word: וְהַלֵּוִי
  choice: ang Levita
  rationale: Karaniwan at madaling maunawaang katawagan sa Filipino para sa kasapi ng lipi ni Levi.
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: na nasa loob ng inyong mga pintuang-bayan
  rationale: Pinananatili ang literal na imahen ng “mga pintuan,” ngunit nililinaw sa tambalang “pintuang-bayan” na ang idyoma ay tumutukoy sa kanilang bayan o pamayanan.
- source_word: כִּי אֵין לוֹ חֵלֶק וְנַחֲלָה אִתְּכֶם
  choice: sapagkat wala siyang bahagi o mana kasama ninyo
  rationale: Ang “sapagkat” ay naghahayag ng dahilan. Pinananatili ng “bahagi o mana” ang dalawang kaugnay ngunit hindi lubos na magkaparehong salita, at ang “kasama ninyo” ay malapit sa אִתְּכֶם nang hindi tahasang nagdaragdag ng “lupain.”
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang transliterasyong “Yahweh” ay pinananatili ito sa halip na palitan ng titulo.
- issue: Kalagayan ng עֶבֶד at אָמָה sa sambahayan
  choice: mga aliping lalaki at babae
  alternative: mga lingkod na lalaki at babae
  rationale: Mas malinaw na pinananatili ng “alipin” ang nakapailalim at hindi malayang kalagayang panlipunan na maaaring palabuin ng mas malawak na “lingkod,” nang hindi nagdaragdag ng paliwanag na wala sa talata.
- issue: Saklaw ng חֵלֶק וְנַחֲלָה
  choice: bahagi o mana
  alternative: bahaging lupain o mana
  rationale: May kaugnayan ang parirala sa minanang lupain ng Israel, ngunit hindi tahasang narito ang salitang “lupain.” Kaya pinanatili ang mas pormal at hindi labis na nagpapaliwanag na anyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pangmaramihang “kayo” at “inyong” upang tumbasan ang Hebreong maramihan. Ang gitling na mahaba ay naghihiwalay sa listahan ng mga kasamang magagalak at nagpapanatili ng malinaw na daloy ng pangungusap.
