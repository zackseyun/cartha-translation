  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּ/ן לַ/עֲשׂוֹת֒ בָּ/אָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛י/ךָ לְ/ךָ֖ לְ/רִשְׁתָּ֑/הּ כָּל הַ/יָּמִ֔ים אֲשֶׁר אַתֶּ֥ם חַיִּ֖ים עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: tl
  text: Ito ang mga tuntunin at mga batas[a] na dapat ninyong maingat na tuparin sa lupaing ibinigay sa iyo ni Yahweh, ang Diyos ng iyong mga ninuno, upang angkinin mo iyon[b], sa buong panahong nabubuhay kayo sa ibabaw ng lupa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga hatol” ang salin ng salitang Hebreo para sa “mga batas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang manahin mo iyon” o “upang ariin mo iyon.”
    reason: lexical_alternative
  - marker: c
    text: Nagpapalit ang Hebreo sa pagitan ng maramihang kausap (“ninyong,” “kayo”) at isahang kausap (“iyo,” “mo”). Ang “lupa” rito ay maaari ring unawain nang mas makitid bilang “lupain.”
    reason: source_language_clarification
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים וְהַמִּשְׁפָּטִים
  choice: Ito ang mga tuntunin at mga batas
  rationale: Ang “mga tuntunin” ay angkop sa חֻקִּים, samantalang pinananatili ng “mga batas” ang legal na diwa ng מִשְׁפָּטִים sa malinaw at kasalukuyang Tagalog. Binabanggit sa talababa ang mas literal na “mga hatol.”
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: na dapat ninyong maingat na tuparin
  rationale: Ipinahahayag ng pariralang שׁמר + infinitive ang maingat at aktuwal na pagsunod, hindi lamang pag-iingat o pagbabantay.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Tumutukoy ang אֶרֶץ sa lupaing ipinagkaloob sa Israel, kaya mas tiyak ang “lupain” kaysa “lupa” o “daigdig.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: ang Diyos ng iyong mga ninuno
  rationale: Natural sa modernong Tagalog ang “mga ninuno” at saklaw nito ang covenantal na pagtukoy sa naunang mga salinlahi; pinananatili rin ang isahang “iyong” ng Hebreo.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin mo iyon
  rationale: Sa konteksto ng lupain, ang ירשׁ ay tumutukoy sa pagkuha at paghawak ng pag-aari. Pinananatili ng “iyon” ang pambabaeng hulaping panghalip na tumutukoy sa lupain.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: sa buong panahong nabubuhay kayo
  rationale: Natural na Tagalog ito para sa literal na “lahat ng mga araw na nabubuhay kayo,” habang pinananatili ang saklaw sa buong buhay at ang maramihang kausap.
- source_word: עַל הָאֲדָמָה
  choice: sa ibabaw ng lupa
  rationale: 'Pinananatili ang pagkakaiba ng אֲדָמָה rito sa naunang אֶרֶץ: maaaring tumukoy ito sa lupa o kalupaan sa pangkalahatan, bagaman posible rin ang mas makitid na “lupain.”'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Pagpapalit ng bilang ng kausap
  choice: Pinanatili ang maramihang “ninyong/kayo” at isahang “iyo/mo”
  alternative: Gawing pare-parehong maramihan o isahan para sa mas makinis na Tagalog
  rationale: Nagpapalit ang Hebreo mula maramihang kausap sa utos tungo sa isahang kausap sa pagkakaloob at pag-angkin ng lupain, saka bumabalik sa maramihan. Ang pagpapanatili nito ay umiiwas sa tahimik na paglutas sa kolektibo at indibidwal na paraan ng pakikipag-usap sa Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Sadyang pinanatili ang legal na himig, ang personal na pangalang Yahweh, at ang kapansin-pansing pagpapalit ng isahan at maramihang kausap sa Hebreo.
