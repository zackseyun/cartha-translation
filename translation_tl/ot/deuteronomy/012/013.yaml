  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: tl
  text: Mag-ingat ka na huwag mong ihandog ang iyong mga handog na sinusunog sa alinmang lugar na makita mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mag-ingat ka na huwag mong ihandog ang iyong mga handog na sinusunog sa bawat lugar na makita mo.”
    reason: Pinananatili ng alternatibo ang mas literal na distributibong kahulugan ng בְּכָל מָקוֹם (“sa bawat lugar”), samantalang ipinapahayag ng pangunahing salin ang natural na kahulugan nito sa loob ng negatibong babala.
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Mag-ingat ka
  rationale: Ang Niphal na pautos na may panghalip na datibo ay isang pormula ng babala. Likas at tuwiran sa modernong Tagalog ang “Mag-ingat ka.”
- source_word: פֶּן
  choice: na huwag
  rationale: 'Ipinakikilala ng פֶּן ang bagay na dapat iwasan. Sa Tagalog, natural na ipinapahayag ang negatibong babalang ito sa hulma na “Mag-ingat ka na huwag…”. '
- source_word: תַּעֲלֶה
  choice: ihandog
  rationale: Ang Hiphil ng עלה ay literal na “paakyatin” ngunit ginagamit bilang terminong pansakripisyo. Mas natural sa Tagalog ang “ihandog” habang malinaw na naipapakita ng kasunod na pangngalan ang uri ng handog.
- source_word: עֹלֹתֶיךָ
  choice: iyong mga handog na sinusunog
  rationale: Ang עֹלָה ay handog na sinusunog sa altar. Ang pariralang ito ay malinaw sa karaniwang mambabasa at hindi nangangailangan ng mas teknikal na katawagan.
- source_word: בְּכָל מָקוֹם
  choice: sa alinmang lugar
  rationale: Sa saklaw ng negatibong babala, ang כָל ay likas na maisasalin bilang “alinman,” na nagbabawal sa paghahandog sa basta anumang lugar. Posible rin ang mas literal na “sa bawat lugar,” kaya pinanatili iyon sa talababa.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: na makita mo
  rationale: Pinananatili nito ang konkretong pandiwang “makita” at ang diwa ng lugar na mapili batay sa sariling pagkakita.
theological_decisions:
- issue: Wika tungkol sa pagsesentralisa ng paghahandog
  choice: Isinalin ang talata bilang tuwirang pagbabawal sa paghahandog ng mga handog na sinusunog sa basta alinmang lugar na makita ng tao.
  alternative: Gawing tahasang pangkalahatang pagbabawal sa lahat ng pagsamba sa labas ng isang sentral na santuwaryo.
  rationale: Tinutukoy mismo ng talata ang mga handog na sinusunog at ang mga lugar na basta makita. Bagaman nagbibigay ang konteksto ng mas malawak na balangkas, hindi iyon dapat idagdag nang tahasan sa salin ng talatang ito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang isahan na “ka/mo” ayon sa Hebreong ikalawang panauhang panlalaking isahan. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
