  to: Huwag mo itong kainin[a], upang maging mabuti ang kalagayan mo at ng iyong mga anak sa mga panahong darating, sapagkat gagawin mo ang matuwid sa paningin ni Yahweh.
  rationale: Inayos ang katumbas ng יִיטַב לְךָ upang maging natural na modernong Filipino at mapanatili ang malawak na diwa ng kapakanan. Nilinaw ang panghinaharap na saklaw ng “mga anak” nang hindi ipinipilit ang “mga inapo” o nililimitahan ang בָנֶיךָ sa mga anak na lalaki. Pinanatili ang estruktura, banal na pangalan, at footnote anchor ng draft.
