    issue: Hindi likas at semantikong di-tumpak ang “upang mapabuti ka.”
    rationale: Ang יִיטַב לְךָ ay idyomang “upang maging mabuti ang kalagayan mo” o “upang mapabuti ang mangyari sa iyo,” hindi isang pandiwang nangangahulugang gawing mas mabuting tao ang kausap.
  - severity: low
    issue: Maaaring malabo ang “mga anak na susunod sa iyo.”
    rationale: Maaari itong maunawaan bilang mga anak na sumusunod o tumatalima sa iyo. Ang “mga anak sa mga panahong darating” ay mas natural na nagpapahiwatig ng kapakanan ng susunod na salinlahi, bagaman pinananatili ang pampamilyang wika ng Hebreo.
  revised_text: Huwag mo itong kainin[a], upang maging mabuti ang kalagayan mo at ng iyong mga anak sa mga panahong darating, sapagkat gagawin mo ang matuwid sa paningin ni Yahweh.
