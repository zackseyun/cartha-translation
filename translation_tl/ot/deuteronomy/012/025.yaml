  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: tl
  text: Huwag mo itong kainin[a], upang maging mabuti ang kalagayan mo at ng iyong mga anak sa mga panahong darating, sapagkat gagawin mo ang matuwid sa paningin ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ito” ay tumutukoy sa dugo; tingnan ang mga talata 23–24.
    reason: referent_clarification
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: kainin ito
  rationale: Ang אָכַל ay nangangahulugang kumain o lumamon, at ang panlalaking isahang hulapi ay tumutukoy sa dugo sa agarang konteksto (mga tal. 23–24). Natural at tuwiran sa Tagalog ang “kainin ito.”
- source_word: לְמַעַן
  choice: upang
  rationale: Ipinakikilala nito ang layunin o kinalabasan. Ang “upang” ay malinaw, marangal, at likas sa ganitong pangungusap.
- source_word: יִיטַב לְךָ
  choice: mapabuti ka
  rationale: Isa itong karaniwang idyomang tipan sa Deuteronomio na tumutukoy sa pangkalahatang mabuting kalagayan, hindi lamang sa materyal na pag-unlad.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: at ang iyong mga anak na susunod sa iyo
  rationale: Maaaring tumukoy ang בָּנִים sa mga anak na lalaki o, sa mas malawak na gamit, sa mga anak at salinlahi. Pinananatili ng saling ito ang wikang pampamilya at ang diwa ng mga susunod na henerasyon.
- source_word: כִּי
  choice: sapagkat
  rationale: Ibinibigay nito ang batayan ng ipinangakong kabutihan. Ang “sapagkat” ay malinaw at angkop sa marangal na rehistro.
- source_word: תַעֲשֶׂה
  choice: gagawin mo
  rationale: Ang imperfect ay angkop na unawain bilang pasulong na inaasahang pagkilos sa lohika ng talata.
- source_word: הַיָּשָׁר
  choice: ang matuwid
  rationale: Ang יָשָׁר ay tumutukoy sa tuwid, wasto, o matuwid. Ang “ang matuwid” ay natural na substantibong gamit sa Filipino at nagpapanatili sa etikong diin.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang karaniwang Hebreong metapora ng pagsusuri o paghatol ng Diyos sa isang gawa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan ng Diyos.
- issue: Saklaw ng בָנֶיךָ
  choice: mga anak
  alternative: mga anak na lalaki; mga inapo
  rationale: Panlalaking maramihan ang anyo, ngunit maaari itong kumatawan sa mga anak o sa sumunod na salinlahi sa kontekstong tipan. Hindi nililimitahan ng “mga anak” ang pangako sa mga lalaki lamang at pinananatili nito ang pampamilyang larawan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang isahang “mo” dahil isahang panlalaki ang kausap sa Hebreo. Iniwasan ang “umunlad” upang hindi paliitin sa materyal na kasaganaan ang idyomang יִיטַב לְךָ.
