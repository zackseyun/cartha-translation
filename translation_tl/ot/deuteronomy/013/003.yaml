base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: tl
  text: at nagkatotoo ang tanda o kababalaghan—na tungkol dito ay nagsalita siya sa iyo—na sinasabi, ‘Sumunod tayo sa ibang mga diyos na hindi mo nakilala[a], at paglingkuran natin sila,’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na hindi mo kilala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “paglingkuran” dito ay tumutukoy sa paglilingkod na panrelihiyon; maaari ring “sambahin natin sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: nagkatotoo
  rationale: Sa konteksto ng ipinahayag na tanda o kababalaghan, ipinahihiwatig ng pandiwa na talagang nangyari ang inihulang bagay; natural itong ipinapahayag sa Filipino bilang “nagkatotoo.”
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: ang tanda o kababalaghan
  rationale: Ang pares ay maaaring literal na “ang tanda at ang kababalaghan,” ngunit madalas itong gumaganap bilang magkaugnay na katawagang tumutukoy sa isang tanda o kahanga-hangang pangyayari. Pinananatili ng “o” ang posibleng idiomatikong diwa nang hindi inaalis ang literal na alternatibo.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: sinabi niya sa iyo
  rationale: Malinaw at natural sa modernong Filipino; sa konteksto, ang tanda o kababalaghan ang bagay na naunang sinabi niya sa kausap.
- source_word: לֵאמֹר
  choice: at sinabi niya
  rationale: Ipinakikilala nito nang natural ang tuwirang sipi sa Filipino, habang pinananatili ang pag-uulat ng pananalita.
- source_word: נֵלְכָה אַחֲרֵי
  choice: Sumunod tayo sa
  rationale: Ang Hebreong idyoma ay literal na “humayo tayo sa likuran ng,” ngunit ang natural at tumpak na Filipino para sa pagtalima o katapatan ay “sumunod tayo sa.”
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Ito ang tuwiran at karaniwang salin ng pormulang pangtipan sa Deuteronomio.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: na hindi mo nakilala
  rationale: Pinananatili ng “nakilala” ang malawak na diwa ng kaalaman, pagkakilala, o dating pakikipag-ugnayan, nang hindi ipinapasok ang isang tiyak na doktrinal na paliwanag.
- source_word: וְנָעָבְדֵם
  choice: at paglingkuran natin sila
  rationale: Ang עבד ay tumutukoy rito sa relihiyosong paglilingkod at pagsamba. Mas malapit sa anyo at lawak ng Hebreo ang “paglingkuran,” habang maaaring ipaliwanag ang “sambahin” bilang alternatibo.
theological_decisions:
- issue: Paglalarawan sa “ibang mga diyos”
  choice: ibang mga diyos na hindi mo nakilala
  alternative: ibang mga diyos na hindi mo kilala
  rationale: Hindi pinagtitibay o itinatanggi ng sugnay ang ontolohikal na katayuan ng mga diyos; iniulat lamang nito ang pang-uudyok sa idolatriya. Pinananatili ng salin ang gayong teolohikal na tensiyon.
- issue: Kahulugan ng relihiyosong paglilingkod
  choice: paglingkuran natin sila
  alternative: sambahin natin sila
  rationale: Saklaw ng Hebreong pandiwa ang paglilingkod na pangrelihiyon, kabilang ang pagsamba. Ang “paglingkuran” ay mas pormal na katumbas at hindi nagpapakitid sa kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kababalaghan” para sa מוֹפֵת at “sumunod tayo” para sa Hebreong idyomang “humayo sa likuran.” Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
