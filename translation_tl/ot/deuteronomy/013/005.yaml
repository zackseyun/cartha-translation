  source_fidelity: 'Tapat ang pangunahing mga kahulugan: ang pagsunod kay Yahweh, pagkatakot sa kanya, pagtupad sa mga utos, pakikinig sa kanyang tinig, paglilingkod, at pagkapit sa kanya. Gayunman, kailangan ng malinaw na pangmaramihang anyo sa lahat ng magkakaugnay na utos upang maipakita ang Hebreong pangmaramihang mga pandiwa.'
  naturalness: May maliit ngunit mahalagang suliraning panggramatika sa “Sumunod kayo ... at matakot sa kanya,” dahil hindi malinaw na naipapahayag ang pangmaramihang pautos sa ikalawang pandiwa. Ang “matakot kayo,” “pakinggan ninyo,” “paglingkuran ninyo,” at “kumapit kayo” ay mas likas at magkakatugma sa modernong Filipino.
  terminology: Ang “Yahweh,” “inyong Diyos,” “mga utos,” “tinig,” at “paglingkuran” ay angkop. Pinananatili ng “matakot” ang lakas ng ירא nang hindi ipinapalit ang interpretatibong “gumalang” lamang.
