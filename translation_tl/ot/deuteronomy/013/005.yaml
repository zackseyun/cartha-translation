  text: אַחֲרֵ֨י יְהוָ֧ה אֱלֹהֵי/כֶ֛ם תֵּלֵ֖כוּ וְ/אֹת֣/וֹ תִירָ֑אוּ וְ/אֶת מִצְוֺתָ֤י/ו תִּשְׁמֹ֨רוּ֙ וּ/בְ/קֹל֣/וֹ תִשְׁמָ֔עוּ וְ/אֹת֥/וֹ תַעֲבֹ֖דוּ וּ/ב֥/וֹ תִדְבָּקֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: tl
  text: Sumunod kayo kay Yahweh, ang inyong Diyos, at matakot kayo sa kanya; tuparin ninyo ang kanyang mga utos, pakinggan ninyo ang kanyang tinig,[a] paglingkuran ninyo siya, at kumapit kayo sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pakinggan ang kanyang tinig” ay maaari ring mangahulugang “sundin ang kanyang tinig” o “sundin siya.”
    reason: lexical_alternative
  - marker: b
    text: O “kumapit nang mahigpit sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי ... תֵּלֵכוּ
  choice: Sumunod kayo
  rationale: Ang literal na idyomang Hebreo ay “lumakad kasunod,” ngunit sa natural na makabagong Tagalog, malinaw na naipapahayag ng “sumunod” ang larawan ng pagsunod at katapatan nang hindi nagiging alanganin ang pangungusap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa teksto sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tuwirang pinananatili ang pangmaramihang pagtukoy sa Israel at ang tipanang ugnayang ipinahihiwatig ng “inyong Diyos.”
- source_word: תִירָאוּ
  choice: matakot sa kanya
  rationale: Saklaw ng pandiwa ang takot, pagpipitagan, at paggalang sa Diyos; pinananatili ng “matakot” ang bigat ng salitang tipanan nang hindi ito pinapalambot.
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: tuparin ninyo ang kanyang mga utos
  rationale: Sa kontekstong ito, ang שׁמר ay pag-iingat sa pamamagitan ng pagsasagawa o pagtupad. Mas natural sa Tagalog ang “tuparin ang mga utos” kaysa literal na “ingatan ang mga utos.”
- source_word: וּבְקֹלוֹ תִּשְׁמָעוּ
  choice: pakinggan ang kanyang tinig
  rationale: Pinananatili ang tahasang larawan ng pakikinig sa tinig, habang hindi ikinukubli na maaari rin itong mangahulugang pagsunod.
- source_word: תַעֲבֹדוּ
  choice: paglingkuran siya
  rationale: Ang עבד ay maaaring tumukoy sa paglilingkod at, kapag Diyos ang layon, sa pagsamba. Ang “paglingkuran” ang mas malawak at mas tuwirang katumbas.
- source_word: תִדְבָּקוּן
  choice: kumapit sa kanya
  rationale: Ipinapahayag nito ang masidhi at matapat na pagkalakip na nasa דבק, sa natural at malinaw na Tagalog.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalang pantangi ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Kung gagawing tahasang pagsunod ang שׁמע בְּקוֹל
  choice: pakinggan ang kanyang tinig
  alternative: sundin ang kanyang tinig; sundin siya
  rationale: Bagaman karaniwang kasama sa idyoma ang pagsunod, tahasang “makinig sa kanyang tinig” ang anyong Hebreo. Pinananatili sa pangunahing teksto ang larawang iyon at inilalagay sa talababa ang kahulugang pagsunod.
- issue: Saklaw ng paglilingkod sa Diyos sa תַעֲבֹדוּ
  choice: paglingkuran siya
  alternative: sambahin siya
  rationale: Hindi nililimitahan ng “paglingkuran” ang pandiwa sa gawaing pangkulto lamang at napapanatili nito ang malawak na diwa ng katapatan at paglilingkod sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo/ninyo” upang ipakita ang pangmaramihang kausap. Isinalin ang Hebreong “lumakad kasunod” bilang natural na “sumunod,” samantalang pinanatili ang mga larawang “tinig” at “kumapit” dahil malinaw at makabuluhan ang mga ito sa Tagalog.
