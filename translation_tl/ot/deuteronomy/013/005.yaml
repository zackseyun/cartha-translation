revisions:
- from: Sumunod kayo kay Yahweh na inyong Diyos at matakot sa kanya; tuparin ninyo ang kanyang mga utos, pakinggan ang kanyang tinig,[a] paglingkuran siya, at kumapit sa kanya.[b]
  to: Sumunod kayo kay Yahweh, ang inyong Diyos, at matakot kayo sa kanya; tuparin ninyo ang kanyang mga utos, pakinggan ninyo ang kanyang tinig,[a] paglingkuran ninyo siya, at kumapit kayo sa kanya.[b]
  rationale: Inayos ang anyo ng magkakaugnay na mga utos upang maging malinaw, natural, at tuloy-tuloy ang pangmaramihang pananalita sa Filipino, nang hindi binabago ang saklaw o pagkakasunod ng Hebreong mga pandiwa. Pinanatili ang “sumunod” bilang natural na katumbas ng idyomang “lumakad kasunod,” at pinanatili ang di-tahasang “pakinggan ang kanyang tinig,” kasama ang nuwang pagsunod sa talababa.
