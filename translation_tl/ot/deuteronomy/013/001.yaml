id: DEU.13.1
reference: Deuteronomy 13:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣ת כָּל הַ/דָּבָ֗ר אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם אֹת֥/וֹ תִשְׁמְר֖וּ לַ/עֲשׂ֑וֹת לֹא תֹסֵ֣ף עָלָ֔י/ו וְ/לֹ֥א תִגְרַ֖ע מִמֶּֽ/נּוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: tl
  text: Ang lahat ng iniuutos ko sa inyo[a] ay maingat ninyong gawin. Huwag ninyo itong dagdagan, at huwag din ninyong bawasan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, kolektibong isahan ang parirala, na literal na “ang buong salita” o “ang buong pahayag.”
    reason: lexical_alternative
  - marker: b
    text: Sa ilang saling gumagamit ng ibang pagbilang ng mga talata, ito ay Deuteronomio 12:32.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: ang lahat ng iniuutos
  rationale: Likas at malinaw ito sa modernong Tagalog. Saklaw ng “lahat” ang kabuuan ng ipinag-uutos, habang ipinapaliwanag sa talababa ang kolektibong isahan ng Hebreo.
- source_word: מְצַוֶּה
  choice: iniuutos ko sa inyo
  rationale: Ipinahihiwatig ng aspektong participial ang kasalukuyan o nagpapatuloy na kilos ng pag-uutos; malinaw ring pinananatili ang tahasang layon na “sa inyo.”
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: maingat ninyong gawin
  rationale: Natural nitong ipinahahayag ang idyomang Hebreo na tumutukoy sa masusing pag-iingat upang maisagawa ang ipinag-uutos.
- source_word: לֹא תֹסֵף עָלָיו
  choice: Huwag ninyo itong dagdagan
  rationale: Tumpak na ipinahahayag ang pagbabawal na magdagdag sa kabuuan ng ipinag-uutos.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: huwag din ninyong bawasan
  rationale: Ang “bawasan” ay likas na katumbas sa Tagalog ng pagbawas o pag-aalis mula sa isang itinakdang kabuuan.
- source_word: אָנֹכִי
  choice: ko
  rationale: Naipapahayag ng panghalip na paari sa pandiwang “iniuutos ko” ang unang panauhan nang natural; hindi kailangang dagdagan ng “ako mismo” maliban kung labis na idiin ang panghalip.
theological_decisions:
- issue: Pagkakaugnay ng talata at pagkakaiba sa pagbilang
  choice: Isinalin bilang isang ganap na tagubilin at hindi nilagyan ng nilalaman mula sa kasunod na talata.
  alternative: Sa ilang tradisyon, ito ay Deuteronomio 12:32 at mas mahigpit na iniuugnay sa naunang bahagi.
  rationale: Bumubuo ang tekstong Hebreo ng isang ganap na tagubilin na nagsisilbi ring tulay patungo sa mga batas tungkol sa bulaang propeta. Hindi dapat baguhin ng pagkakaiba sa pagbilang ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “maingat ninyong gawin” upang likas na maipahayag ang Hebreong idyoma, at “ang lahat ng iniuutos” upang maiwasan ang alanganing literalismong “ang buong salita” habang pinananatili sa talababa ang anyo ng pinagmulang teksto.
