  text: וְ/כָל יִשְׂרָאֵ֔ל יִשְׁמְע֖וּ וְ/יִֽרָא֑וּ/ן וְ/לֹֽא יוֹסִ֣פוּ לַ/עֲשׂ֗וֹת כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/012.yaml
  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: tl
  text: Maririnig ito ng buong Israel at matatakot sila, at hindi na nila muling gagawin ang masamang bagay na ito sa gitna mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gitna ninyo.” Pang-isahan ang anyong Hebreo sapagkat kinakausap ang Israel bilang isang sambayanan.
    reason: Ipinapaliwanag ang pang-isahang kolektibong anyo at nagbibigay ng natural na alternatibong maramihan sa Filipino.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: ng buong Israel
  rationale: Ang כָּל kasama ng pangalang Israel ay tumutukoy sa buong bayan bilang isang kabuuan; natural sa Filipino ang “buong Israel.”
- source_word: יִשְׁמְעוּ
  choice: Maririnig ito
  rationale: Ang Qal imperfect ay may hinaharap o resultang diwa sa kontekstong legal. Idinagdag ang “ito” bilang likas na layon sa Filipino, na tumutukoy sa pangyayaring kalalarawan lamang.
- source_word: וְיִרָאוּן
  choice: at matatakot sila
  rationale: Ang ירא rito ay takot na nagsisilbing pagpigil sa muling paggawa ng kasamaan. Ang “matatakot” ay malinaw at hindi nagpapasok ng mas tiyak na teolohikal na kahulugan kaysa sa Hebreo.
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: at hindi na nila muling gagawin
  rationale: Ang Hiphil ng יסף na may infinitive ay karaniwang nangangahulugang hindi na uulitin ang isang gawa; natural itong ipinahahayag sa Filipino sa “hindi na ... muling gagawin.”
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: ang masamang bagay na ito
  rationale: Ang דָּבָר ay maaaring “bagay” o “usapin,” ngunit dito ay tumutukoy sa masamang gawa na naunang inilarawan. Pinananatili ng salin ang pagiging tiyak ng הַזֶּה.
- source_word: בְּקִרְבֶּךָ
  choice: sa gitna mo
  rationale: Literal itong “sa gitna mo,” na may panlalaking pang-isahang hulapi. Pinananatili ng “mo” ang kolektibong pakikipag-usap sa Israel bilang isang bayan.
theological_decisions:
- issue: Bilang ng hulapi sa kolektibong pakikipag-usap sa Israel
  choice: sa gitna mo
  alternative: sa gitna ninyo / sa piling ninyo
  rationale: Pang-isahan ang hulaping Hebreo bagaman ang Israel bilang buong bayan ang kinakausap. Pinananatili ng pangunahing teksto ang tensiyong ito sa halip na tahimik na gawing maramihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng pangungusap at pinanatili ang legal na diwa ng babala at pagpigil.
