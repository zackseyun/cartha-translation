base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: tl
  text: 'Kung[b] mabalitaan mo na sa isa sa mga lunsod na ibinibigay sa iyo ni Yahweh na iyong Diyos upang manirahan ka roon[a] ay ganito ang sinasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang tumira ka roon” o “upang manahan ka roon.”
    reason: lexical_alternative
  - marker: b
    text: O “Kapag mabalitaan mo.” Ang salitang Hebreo sa simula ng talata ay maaaring magpakilala ng kondisyong “kung” o temporal na “kapag” sa mga legal na pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Sa kontekstong legal, ipinakikilala nito ang isang kondisyong pangyayari; pinananatili ng “Kung” ang ugnayan sa kasunod na mga talata.
- source_word: תִשְׁמַע
  choice: mabalitaan mo
  rationale: Ang pandiwa rito ay tumutukoy sa pagkatanggap ng isang ulat, kaya mas natural sa modernong Tagalog ang “mabalitaan mo” kaysa literal na “marinig mo.”
- source_word: בְּאַחַת עָרֶיךָ
  choice: sa isa sa mga lunsod
  rationale: Ang עִיר ay maaaring lunsod o bayan; “lunsod” ang dignidad at lawak na angkop sa mga pamayanang Israelita rito.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang tuwirang tipanang pahayag na “iyong Diyos.”
- source_word: נֹתֵן לְךָ
  choice: ibinibigay sa iyo
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy o kasalukuyang pagkakaloob ni Yahweh.
- source_word: לָשֶׁבֶת שָׁם
  choice: upang manirahan ka roon
  rationale: Likas at malinaw sa modernong Tagalog ang “manirahan,” at ipinapakita ng “upang” ang layunin ng pagkakaloob.
- source_word: לֵאמֹר
  choice: ay ganito ang sinasabi
  rationale: Ipinakikilala nito ang nilalaman ng ulat na susunod sa talata 14; ang pariralang ito ay natural na transisyon sa Tagalog.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kondisyonal o temporal na gamit ng כִּי
  choice: Kung
  alternative: Kapag
  rationale: Ang legal na pormula ay pinakamalinaw bilang kondisyong sitwasyon, ngunit tunay na posible rin ang temporal na pagbasa at inilalahad iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “mabalitaan” upang likas na maipahayag ang pagtanggap ng ulat, at ang “ganito ang sinasabi” upang ihanda ang tuwirang nilalaman sa kasunod na talata. Lahat ng panandang talababa ay nasa pangunahing teksto.
