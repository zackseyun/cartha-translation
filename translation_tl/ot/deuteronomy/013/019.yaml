  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹר֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לַ/עֲשׂוֹת֙ הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: tl
  text: kung makikinig ka sa tinig ni Yahweh na iyong Diyos, upang sundin ang lahat ng kanyang utos na iniuutos ko sa iyo ngayon, at gawin ang matuwid sa paningin ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: kung
  rationale: Ipinakikilala rito ng כִּי ang kondisyong kaugnay ng naunang pangako; natural at malinaw itong naihahayag ng “kung.”
- source_word: תִשְׁמַע בְּקוֹל
  choice: makikinig ka sa tinig
  rationale: Pinananatili nito ang larawang pandinig ng Hebreong idyoma habang ipinahihiwatig ng konteksto ang pakikinig na humahantong sa pagsunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Likas na salin ito ng isahang panghalip na paari sa pormulang tipan.
- source_word: לִשְׁמֹר
  choice: upang sundin
  rationale: Sa konteksto ng mga utos, ipinapahayag ng שׁמר ang maingat na pagtupad o pagsunod; malinaw at natural sa modernong Tagalog ang “upang sundin.”
- source_word: כָּל מִצְוֺתָיו
  choice: lahat ng kanyang utos
  rationale: Pinananatili ang kabuuang saklaw ng כָּל at ang legal-tipang diwa ng מִצְוָה sa karaniwang salitang “utos.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Ipinakikita ng aspektong patuloy ng participle ang kasalukuyang gawa ng pagsasalita ni Moises.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: at gawin ang matuwid
  rationale: Ang “matuwid” ay nagpapanatili sa etikal na diwa ng יָשָׁר, at ang “gawin” ay malapit sa infinitibong לַעֲשׂוֹת.
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Ito ang natural na katumbas sa Tagalog ng Hebreong idyoma para sa pagtataya o paghatol.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng pakikinig at pagsunod sa שׁמע בקול
  choice: makikinig ka sa tinig
  alternative: susunod ka
  rationale: Pinananatili ang personal at pandinig na talinghaga ng orihinal nang hindi itinatanggi ang malinaw na pahiwatig ng pagsunod.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang isahang kausap, ang Hebreong larawang “makinig sa tinig,” at ang idyomang “sa paningin,” habang ginawang natural ang mga infinitibong sugnay.
