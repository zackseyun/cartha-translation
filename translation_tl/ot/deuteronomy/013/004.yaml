  source_fidelity: 'Tapat ang salin sa Hebreo: napananatili ang tuwirang pagbabawal, ang pagtukoy sa propeta at sa nananaginip, ang sanhi ng pagbabawal, ang kasalukuyang diwa ng “sinusubok,” at ang tahasang “upang malaman kung.” Napanatili rin ang paulit-ulit na pangalang Yahweh at ang saklaw na “buong puso at buong pagkatao.”'
