id: DEU.13.4
reference: Deuteronomy 13:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: tl
  text: Huwag ninyong pakinggan ang mga salita ng propetang iyon o ng nananaginip na iyon,[a] sapagkat sinusubok kayo ni Yahweh na inyong Diyos upang malaman kung iniibig ninyo si Yahweh na inyong Diyos nang buong puso at buong pagkatao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “ng nananaginip ng panaginip na iyon.”'
    reason: Pinananatili ang Hebreong idyoma bilang alternatibong mas literal na anyo.
  - marker: b
    text: Ang salitang isinaling “pagkatao” ay maaari ring mangahulugang “buhay,” “sarili,” o “kaluluwa.”
    reason: Ipinakikita ang malawak na kahulugan ng נֶפֶשׁ nang hindi ikinukulong ito sa iisang antropolohikal na pakahulugan.
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  choice: Huwag ninyong pakinggan
  rationale: Ang שׁמע na may אֶל ay nangangahulugang makinig o tumalima. Likas sa makabagong Tagalog ang “huwag ninyong pakinggan,” at sa konteksto ay may diwa rin ito ng hindi pagsunod.
- source_word: דִּבְרֵי הַנָּבִיא הַהוּא
  choice: ang mga salita ng propetang iyon
  rationale: Pinananatili ang pangmaramihang “mga salita” at ang demonstratibong הַהוּא bilang “iyon,” na tumutukoy sa naunang binanggit na propeta.
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: ng nananaginip na iyon
  rationale: Ang literal na Hebreong parirala ay “nananaginip ng panaginip.” Sa Tagalog, sapat at mas natural ang “nananaginip,” habang inilalahad sa talababa ang mas literal na anyo.
- source_word: מְנַסֶּה
  choice: sinusubok
  rationale: Ang piel participle ng נסה ay nagpapahayag ng nagpapatuloy na pagsubok; malinaw itong naihahatid ng “sinusubok.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: לָדַעַת
  choice: upang malaman
  rationale: Pinananatili ang tahasang layuning “upang malaman” at ang kaakibat nitong teolohikal na tensiyon, sa halip na ipakahulugang “upang ihayag” o “upang ipakita.”
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: kung iniibig ninyo
  rationale: Ang interrogative particle at participle ay likas na naihahayag sa Tagalog bilang “kung iniibig ninyo,” na maaaring tumukoy sa umiiral o nagpapatuloy na pag-ibig.
- source_word: בְּכָל לְבַבְכֶם
  choice: nang buong puso
  rationale: Ang לֵבָב ay tumutukoy sa puso bilang sentro ng kalooban, isip, at damdamin; “buong puso” ang likas at intertekstuwal na pahayag sa Tagalog.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: at buong pagkatao
  rationale: Ang נֶפֶשׁ ay maaaring mangahulugang buhay, sarili, o buong nilalang. Sa modernong Tagalog, “buong pagkatao” ang malinaw na naghahatid ng kabuuang sarili at umiiwas sa makitid na pagkaunawa sa “kaluluwa.”
theological_decisions:
- issue: Paglalarawan na sinusubok ng Diyos ang Israel “upang malaman”
  choice: Pinanatili ang “upang malaman”
  alternative: upang maihayag / upang ipakita
  rationale: Tuwirang sinasabi ng Hebreo ang לָדַעַת, “upang malaman.” Hindi nilulutas ng salin ang posibleng tanong tungkol sa kaalaman ng Diyos sa pamamagitan ng pagpapalit sa “ihayag” o “ipakita.”
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong “Yahweh” bilang malinaw na transliterasyon.
- issue: Saklaw ng נֶפֶשׁ sa pormulang pangtipan
  choice: buong pagkatao
  alternative: buong kaluluwa / buong buhay
  rationale: Ipinahahayag ng “pagkatao” ang buong sarili, samantalang kinikilala sa talababa ang ibang lehitimong katumbas upang mapanatili ang lawak ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyo” ayon sa ikalawang panauhang maramihan ng Hebreo. Pinili ang “nananaginip” kaysa sa mabigat na literal na “nananaginip ng panaginip,” at inilagay ang literal na anyo sa talababa.
