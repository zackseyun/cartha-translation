  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: tl
  text: Batuhin mo siya ng mga bato, at mamamatay siya, sapagkat tinangka niyang ilayo ka[a] mula kay Yahweh na iyong Diyos, na naglabas sa iyo mula sa lupain ng Ehipto—mula sa bahay ng pagkaalipin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “iligaw ka palayo mula kay Yahweh” o “udyukan kang lumayo kay Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ng pagkaalipin” ay isang pormulang pangtipan na nagpapaalaala sa paglaya ng Israel mula sa pagkaalipin sa Ehipto.
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים
  choice: Batuhin mo siya ng mga bato
  rationale: Pinananatili ang tahasang paraan ng hatol at ang ikalawang panauhang isahan ng Hebreo. Ang pag-uulit na “batuhin … ng mga bato” ay sadyang malapit sa anyo at diin ng pinagmulang teksto.
- source_word: וָמֵת
  choice: at mamamatay siya
  rationale: Hayagang pinananatili ang kasunod na kinalabasan ng pagbato, gaya ng pagkakasunod sa Hebreo, sa halip na isama lamang ito sa pariralang “hanggang mamatay.”
- source_word: כִּי בִקֵּשׁ
  choice: sapagkat tinangka niyang
  rationale: Ang כִּי ay nagbibigay ng dahilan sa hatol, at ang בִקֵּשׁ sa kontekstong ito ay tumutukoy sa sinadyang pagtatangka, hindi lamang sa paghahanap.
- source_word: לְהַדִּיחֲךָ
  choice: ilayo ka
  rationale: Ipinahahayag nito ang causative na puwersa ng pandiwa—ang pagsisikap na ihiwalay ang kausap sa katapatan kay Yahweh—nang hindi nilulutas ang buong lawak nito bilang alinman sa pagligaw, pang-uudyok, o pagtataboy.
- source_word: מֵעַל יְהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na iyong Diyos
  rationale: Likas sa Tagalog ang “ilayo ka kay,” at pinananatili ang personal na pangalang Yahweh at ang ikalawang panauhang isahang “iyong Diyos.”
- source_word: הַמּוֹצִיאֲךָ
  choice: na naglabas sa iyo
  rationale: Ang participle ay gumaganap bilang paglalarawan kay Yahweh batay sa kaniyang makasaysayang pagliligtas; natural itong ipinahahayag sa naganap na aspekto sa Tagalog.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Tuwirang heograpikong pananalita na malinaw at karaniwan sa makabagong Tagalog.
- source_word: מִבֵּית עֲבָדִים
  choice: mula sa bahay ng pagkaalipin
  rationale: Pinananatili ang metaporang “bahay” at ipinahahayag ang kalagayan ng pagkaalipin, sa halip na palabasing isang literal na gusaling tinitirhan lamang ng mga alipin.
theological_decisions:
- issue: Paglalarawan sa pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Wika ng pagtalikod sa tipan sa לְהַדִּיחֲךָ מֵעַל יְהוָה
  choice: ilayo ka kay Yahweh
  alternative: iligaw ka palayo kay Yahweh / udyukan kang talikuran si Yahweh
  rationale: Pinananatili ng “ilayo” ang causative at relational na puwersa ng parirala nang hindi nagdaragdag ng mas tiyak na paraan ng panghihikayat kaysa sa sinasabi ng teksto.
- issue: Bilang ng ikalawang panauhan
  choice: 'isahan: mo, ka, iyong, iyo'
  alternative: 'maramihan: ninyo, kayo, inyong, inyo'
  rationale: Ang mga anyong Hebreo sa talata ay ikalawang panauhang panlalaking isahan. Dahil kailangang tahasang pumili ng Tagalog sa bilang, pinanatili ang gramatikal na isahan.
translation_notes:
  register: Makabago ngunit marangal na legal-tipang pananalita. Pinanatili ang ikalawang panauhang isahan ng Hebreo, ang tahasang pagkakasunod ng pagbato at kamatayan, at ang pangalang Yahweh. Ginamit ang gitling upang ipakitang ang “bahay ng pagkaalipin” ay karagdagang paglalarawan sa Ehipto.
