  text: מֵ/אֱלֹהֵ֣י הָֽ/עַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם הַ/קְּרֹבִ֣ים אֵלֶ֔י/ךָ א֖וֹ הָ/רְחֹקִ֣ים מִמֶּ֑/ךָּ מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: tl
  text: mula sa mga diyos ng mga bayang nakapaligid sa inyo—malapit man sa iyo o malayo sa iyo, mula sa isang dulo ng daigdig hanggang sa kabilang dulo nito[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa isang dulo ng lupain hanggang sa kabilang dulo nito.” Ang salitang Hebreo na אֶרֶץ ay maaaring mangahulugang “daigdig” o “lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: mula sa mga diyos ng mga bayan
  rationale: Ang מִן ay nagpapahiwatig dito ng pinagmulan o kaugnayan, at ang עַמִּים ay tumutukoy sa mga pangkat ng tao. Likas at malinaw sa modernong Tagalog ang “mga bayan” sa kontekstong ito.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: na nakapaligid sa inyo
  rationale: Pinananatili nito ang tahasang diwang heograpiko ng סְבִיבוֹת at ang maramihang kausap sa hulaping כֶם.
- source_word: הַקְּרֹבִים אֵלֶיךָ אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: malapit man sa iyo o malayo sa iyo
  rationale: Natural na pares sa Tagalog ang “malapit man … o malayo,” habang pinananatili ang isahang kausap ng mga hulaping ךָ.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: mula sa isang dulo ng daigdig hanggang sa kabilang dulo nito
  rationale: Ipinahahayag nito ang kabuuang lawak ng idyomang Hebreo. Ang “daigdig” ay marangal at malinaw, at ang “kabilang dulo nito” ay natural sa Tagalog nang hindi nawawala ang paralelismo.
theological_decisions:
- issue: Saklaw ng הָאָרֶץ sa pangwakas na idyoma
  choice: daigdig
  alternative: lupain
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “daigdig” o “lupain.” Sa pormulang “mula sa isang dulo … hanggang sa kabilang dulo,” mas angkop ang “daigdig” sa malawak na retorikal na saklaw, ngunit pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pagbabago mula sa maramihang “inyo” tungo sa isahang “iyo” na nasa tekstong Hebreo, at ang gitling sa hulihan ay nagpapakitang nagpapatuloy ang pangungusap mula sa naunang talata.
