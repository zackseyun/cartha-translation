revisions:
- from: Kung lihim kang akitin ng iyong kapatid[a] na anak ng iyong ina, ng iyong anak na lalaki o anak na babae, ng asawang kayakap mo, o ng kaibigan mong tulad ng sarili mong buhay[b], at sabihin, “Tayo na at maglingkod tayo sa ibang mga diyos”—mga diyos na hindi nakilala ni ikaw ni ang iyong mga ninuno—
  to: Kung lihim kang akitin ng iyong kapatid[a], na anak ng iyong ina, o ng iyong anak na lalaki o anak na babae, ng asawang kayakap mo, o ng kaibigan mong tulad ng sarili mong buhay[b], at sabihin sa iyo, “Tayo na at maglingkod tayo sa ibang mga diyos”—mga diyos na hindi mo nakilala, ni hindi nakilala ng iyong mga ninuno—
  rationale: Inayos ang bantas upang malinaw na apposition ang ‘na anak ng iyong ina.’ Idinagdag ang ‘sa iyo’ upang maging malinaw ang kaugnayan ng ‘sabihin’ sa nang-aakit. Pinalitan ang hindi idiomatikong pangwakas na ‘ni ikaw ni ang iyong mga ninuno’ ng paralelong konstruksyong Filipino na pinananatili ang kahulugang walang pagkakilala kapwa ang kausap at ang kanyang mga ninuno. Hindi binago ang kahulugan, mga pangunahing termino, o mga angkla ng talababa.
