reference: Deuteronomy 13:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: tl
  text: Kung lihim kang akitin ng iyong kapatid[a], na anak ng iyong ina, o ng iyong anak na lalaki o anak na babae, ng asawang kayakap mo, o ng kaibigan mong tulad ng sarili mong buhay[b], at sabihin sa iyo, “Tayo na at maglingkod tayo sa ibang mga diyos”—mga diyos na hindi mo nakilala, ni hindi nakilala ng iyong mga ninuno—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “anak ng iyong ina” ay tahasang binabanggit sa Hebreo upang idiin ang napakalapit na ugnayang pampamilya.
    reason: cultural_clarification
  - marker: b
    text: 'Maaari ring isalin: “kaibigan mong tulad ng iyong sarili” o “tulad ng sarili mong kaluluwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: akitin ka
  rationale: Ang Hiphil ng סות ay nangangahulugang mang-akit, manulsol, o manghikayat tungo sa isang gawain. Ang “akitin” ay natural sa Tagalog at ang lihim na paraan ay hiwalay na ipinahahayag ng בַּסֵּתֶר.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: iyong kapatid na anak ng iyong ina
  rationale: Pinananatili ang tahasang apposition ng Hebreo at ang diin nito sa napakalapit na ugnayang pampamilya.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: asawang kayakap mo
  rationale: Ang חֵיק ay dibdib, kandungan, o yakap at dito ay larawan ng matalik na pagsasama. Ang “asawang kayakap mo” ay makabago at natural nang hindi pinapantay lamang sa “minamahal na asawa.”
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: kaibigan mong tulad ng sarili mong buhay
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa sarili, buhay, o pagkatao. Ang “sarili mong buhay” ay nagpapanatili sa matinding lapit ng ugnayan at sa saklaw ng larawan.
- source_word: בַּסֵּתֶר
  choice: lihim
  rationale: Ang parirala ay literal na “sa lihim.” Inilagay ang “lihim” bago ang pandiwang parirala para sa likas na daloy sa Tagalog.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Tayo na at maglingkod tayo
  rationale: Ang dalawang cohortative ay paanyaya o panghihikayat. Pinananatili ng salin kapwa ang pagpunta at paglilingkod, habang likas sa Tagalog ang “Tayo na.”
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Ang אֲחֵרִים ay “iba,” hindi kinakailangang “dayuhan.”
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: mga diyos na hindi nakilala ni ikaw ni ang iyong mga ninuno
  rationale: Pinananatili ang יָדַע bilang “makilala,” na maaaring magpahiwatig ng pagkilala o kaugnayang panrelihiyon nang hindi ito tahasang nilulutas. Ang “ni...ni...” ay nagpapanatili sa tahasang pagbanggit sa kausap at sa mga ninuno.
theological_decisions:
- issue: Paglilipat ng mga idyoma tungkol sa pinakamalalapit na ugnayan
  choice: Panatilihin ang kongkretong larawan sa “anak ng iyong ina,” “asawang kayakap mo,” at “tulad ng sarili mong buhay.”
  alternative: Gawing “sarili mong kapatid,” “minamahal mong asawa,” at “pinakamatalik mong kaibigan.”
  rationale: Ang sunod-sunod na larawan ay nagpapatingkad sa tindi ng babala sa pamamagitan ng pinakamalalapit na relasyon. Ang mas pangkalahatang mga katawagan ay magpapahina sa retorikal na puwersa ng Hebreo.
- issue: Kahulugan ng עבד kaugnay ng ibang mga diyos
  choice: maglingkod
  alternative: sumamba
  rationale: Kasama sa עבד ang pagsamba ngunit mas malawak itong tumutukoy sa paglilingkod sa isang diyos. Pinananatili ng “maglingkod” ang saklaw na iyon.
- issue: Kahulugan ng ידע sa pagkilala sa mga diyos
  choice: nakilala
  alternative: sinamba o kinilala
  rationale: Ang “nakilala” ay nagpapanatili sa posibleng kahulugang karanasan, pagkilala, o kaugnayang panrelihiyon, sa halip na pumili ng isang paliwanag lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mahabang kondisyunal na pangungusap at pangwakas na gitling dahil nagpapatuloy ang diwa sa kasunod na talata. Iniwasan ang makalumang “sinapupunan/dibdib” bilang idyoma para sa asawa at ang labis na interpretibong “pinakamatalik.”
