base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: tl
  text: Huwag kang pumayag sa kanya o makinig sa kanya; huwag mo siyang kaawaan,[a] huwag mo siyang palampasin, at huwag mo siyang pagtakpan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “huwag maawa sa kanya ang iyong mata,” isang idyomang Hebreo para sa hindi pagtingin nang may habag.
    reason: cultural_note
  - marker: b
    text: O “huwag mo siyang ikubli”—maaaring tumukoy sa pagtatago sa kanya o sa pagtatakip sa kanyang ginawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לוֹ
  choice: pumayag sa kanya
  rationale: Ang אָבָה sa Qal ay tumutukoy sa pagiging handa, pagsang-ayon, o pagpapaubaya. Sa konteksto ng pang-uudyok na tumalikod sa Diyos, natural na ipinahahayag ng “pumayag sa kanya” ang pagtangging sumang-ayon sa mungkahi niya.
- source_word: תִשְׁמַע אֵלָיו
  choice: makinig sa kanya
  rationale: Ang שׁמע na may אֶל ay maaaring mangahulugang makinig o dinggin. Pinananatili ng “makinig sa kanya” ang diwa ng pagtanggap sa pang-uudyok nang hindi ito nililimitahan sa literal na pagkarinig o pinalalakas tungo sa ganap na pagsunod.
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: huwag mo siyang kaawaan
  rationale: Literal na binabanggit ng Hebreo ang mata, ngunit idiomatiko itong tumutukoy sa maawa o tumingin nang may habag. Mas natural sa modernong Tagalog ang “huwag mo siyang kaawaan”; inilalagay sa talababa ang literal na larawan.
- source_word: תַחְמֹל
  choice: huwag mo siyang patawarin
  rationale: Ang חמל ay nangangahulugang mahabag o hindi ipahamak, at sa kontekstong hudisyal ay ‘spare.’ Ginagamit ang “patawarin” sa diwang huwag iligtas sa itinakdang kaparusahan, bagaman maaari rin itong maunawaan bilang “huwag siyang iligtas sa parusa.”
- source_word: תְכַסֶּה עָלָיו
  choice: huwag mo siyang pagtakpan
  rationale: Ang Piel ng כסה ay ‘takpan’ o ‘ikubli.’ Ang “pagtakpan” ay natural na Tagalog para sa pagtatago sa ginawa o kasalanan ng isang tao at pinananatili ang legal na puwersa ng talata.
theological_decisions:
- issue: Matinding wikang hudisyal ng tipan laban sa nang-uudyok sa pagtalikod
  choice: Panatilihin ang tuwiran at sunud-sunod na mga pagbabawal nang hindi pinahihina ang mga ito.
  alternative: Gawing pangkalahatang pagtutol lamang o palambutin bilang ‘huwag mo siyang protektahan.’
  rationale: Bahagi ito ng legal na konteksto na nag-uutos na huwag sang-ayunan, dinggin, kaawaan, iligtas sa parusa, o pagtakpan ang nang-uudyok. Hindi dapat bawasan ng salin ang tindi o lutasin sa doktrinal na paraan ang tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang isahang kausap na “ka/mo” ayon sa mga pandiwang panlalaking isahan sa Hebreo. Pinanatili ang paulit-ulit na “huwag” upang maihatid ang tumitinding serye ng mga pagbabawal.
