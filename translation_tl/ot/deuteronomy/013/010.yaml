  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: tl
  text: Sapagkat dapat mo talaga siyang patayin; ang iyong kamay ang unang kikilos laban sa kanya upang patayin siya,[a] at pagkatapos ay ang kamay ng buong bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tiyak na papatayin mo siya.” Inuulit dito ng Hebreo ang diwa ng pandiwa sa isang natatanging anyo upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan o paliwanag sa naunang utos at pinananatili ang lohikal na ugnayan.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: tiyak na papatayin mo siya
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa katiyakan at bigat ng obligasyon; natural itong naipahahayag sa Tagalog sa pamamagitan ng “tiyak na.”
- source_word: יָדְךָ תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: ang iyong kamay ang unang kikilos laban sa kanya
  rationale: Pinananatili ang tahasang larawang “kamay” at ang priyoridad ng taong tinutukoy, habang ginagawang malinaw at natural ang Hebreong idyoma sa Tagalog.
- source_word: לַהֲמִיתוֹ
  choice: upang patayin siya
  rationale: Ang Hiphil ng מות ay nangangahulugang maging sanhi ng kamatayan; sa kontekstong legal, malinaw at hindi pinahihinahon ng “patayin” ang ipinag-uutos.
- source_word: וְיַד כָּל הָעָם בָּאַחֲרֹנָה
  choice: at pagkatapos ay ang kamay ng buong bayan
  rationale: Pinananatili ang paralelismo ng “iyong kamay” at “kamay ng buong bayan,” pati ang pagkakasunod ng kanilang pagkilos.
theological_decisions:
- issue: Paglalahad ng wikang tumutukoy sa hudisyal na pagpatay nang hindi ito pinahihinahon o pinalulubha
  choice: papatayin mo siya / upang patayin siya
  alternative: ipapatay mo siya / upang ipapatay siya
  rationale: Ang paksa mismo ang unang kikilos sa paglalapat ng hatol, kaya maaaring magpahiwatig nang mali ang “ipapatay” na iba lamang ang gagawa nito. Tapat at tuwiran ang “patayin” sa legal na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong idyomang “kamay” at ang legal na bigat ng talata; idinagdag ang “kikilos” upang maging natural ang pangungusap nang hindi inaalis ang larawan ng orihinal.
