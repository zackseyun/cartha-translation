reference: Deuteronomy 13:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: tl
  text: Walang anumang bagay mula sa itinalaga para lipulin ang dapat manatili sa iyong kamay[a], upang tumalikod si Yahweh mula sa nag-aalab niyang galit[b], bigyan ka ng awa, kahabagan ka, at paramihin ka, gaya ng ipinanumpa niya sa iyong mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “walang anumang bagay mula sa nasa ilalim ng pagbabawal.” Ang Hebreong חֵרֶם ay tumutukoy sa isang bagay na itinalaga sa Diyos nang hindi na mababawi, at madalas ay para lipulin.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa pag-aalab ng kanyang ilong/galit,” isang idyoma para sa matinding galit.
    reason: cultural_note
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: manatili sa kamay mo
  rationale: Ang דבק ay literal na “dumikit” o “kumapit,” ngunit kasama ng “kamay” ay tumutukoy dito sa paghawak o pagpapanatili bilang pag-aari. Pinananatili ng salin ang larawan ng kamay habang natural na ipinahahayag ang pagbabawal.
- source_word: מְאוּמָה מִן הַחֵרֶם
  choice: anumang bagay na itinalagang lipulin
  rationale: Sa ilalim ng pagtanggi, ang מְאוּמָה ay “anumang bagay.” Ang חֵרֶם ay isang bagay na hindi na mababawi dahil itinalaga sa Diyos, at sa kontekstong ito ay ukol sa paglipol; malinaw itong ipinapahayag nang hindi gumagamit ng malabong teknikal na katawagan.
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: talikuran ni Yahweh ang nag-aalab niyang galit
  rationale: Ang שׁוב מן ay nangangahulugang tumalikod o humiwalay mula sa isang kalagayan. Ang חֲרוֹן אַף ay isang idyoma para sa matinding o nag-aalab na galit; “nag-aalab niyang galit” ay malinaw at nananatiling masigla ang larawan.
- source_word: וְנָתַן לְךָ רַחֲמִים
  choice: pagkalooban ka ng awa
  rationale: Literal itong “bigyan ka ng mga habag/awa.” Ang “pagkalooban ka ng awa” ay likas sa modernong Tagalog at pinananatili ang anyong pangngalan bago ang kasunod na pandiwa.
- source_word: וְרִחַמְךָ
  choice: kahabagan ka
  rationale: Pinananatili ang pag-uulit at pagpapatingkad ng Hebreo sa pamamagitan ng hiwalay na pandiwang “kahabagan,” sa halip na pag-isahin ito sa naunang “awa.”
- source_word: וְהִרְבֶּךָ
  choice: paramihin ka
  rationale: Ang Hiphil ng רבה ay “gawing marami.” Ang “paramihin ka” ay maikli at pinananatili ang kaugnayan sa pangakong paramihin ang sambayanan.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: gaya ng isinumpa niya sa iyong mga ninuno
  rationale: Ang אבות ay tumutukoy sa mga naunang ama ng bayang Israel, lalo na sa mga tagapagdala ng pangako. Ang “mga ninuno” ang likas at malinaw na katawagan sa modernong Tagalog.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang tipanang pangalan; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Kahulugan ng חֵרֶם
  choice: itinalagang lipulin
  alternative: nasa ilalim ng pagbabawal
  rationale: Sa konteksto ng kabanata, ang mga bagay ay itinalaga nang hindi mababawi at kailangang lipulin. Ginagawang malinaw ng salin ang kontekstuwal na diwa nang hindi nagdaragdag ng sektaryong paliwanag.
- issue: Matalinghagang paglalarawan sa galit ng Diyos
  choice: nag-aalab niyang galit
  alternative: tindi ng kanyang galit
  rationale: Ang Hebreo ay literal na tumutukoy sa “pag-aalab ng kanyang ilong/galit.” Pinananatili ang init at tindi ng idyoma ngunit hindi inililipat sa Tagalog ang di-likas na larawan ng ilong.
- issue: Pagkakaugnay ng awa at habag
  choice: pagkalooban ka ng awa, kahabagan ka
  alternative: maawa at mahabag sa iyo
  rationale: Pinananatili ng pinili ang dalawang magkalapit ngunit magkahiwalay na pahayag sa Hebreo, kabilang ang pagkakaiba ng pangngalan at pandiwa, sa halip na patagin ang pagpapatingkad.
- issue: Paglalapat ng אֲבֹתֶיךָ
  choice: iyong mga ninuno
  alternative: iyong mga ama
  rationale: Ang “mga ninuno” ay natural na tumutukoy sa mga patriyarka at sa naunang tipanang salinlahi; ang literal na “mga ama mo” ay maaaring mapagkamalang mga kagyat na magulang lamang sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mo/ka” dahil isahan ang kausap sa gramatika ng Hebreo, bagaman kumakatawan ito sa Israel bilang isang bayan. Iniwasan ang teknikal at di-pamilyar na “ban,” habang pinanatili sa talababa ang alternatibong katawagan at ang saklaw ng חֵרֶם.
