base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: tl
  text: Talagang patayin mo sa talim ng espada ang mga naninirahan sa lungsod na iyon. Italaga mo sa paglipol[a] ang lungsod, ang lahat ng naroon, at ang mga alagang hayop nito—sa talim ng espada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lipulin mo nang lubusan.” Ang pandiwang Hebreo ay tumutukoy sa hindi na mababawi na pagtatalaga ng isang bagay sa paglipol.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa bibig ng espada,” isang idyomang nangangahulugang “sa talim ng espada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: Dapat mo talagang patayin
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa utos. Ipinapahayag ng “dapat mo talagang” ang diin, at ang “patayin” ay nililinaw ng kasunod na paggamit ng espada bilang nakamamatay na paraan.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: ang mga naninirahan sa lungsod na iyon
  rationale: Tumpak at likas sa modernong Filipino ang “mga naninirahan” para sa participial na anyong tumutukoy sa residenteng populasyon.
- source_word: לְפִי חָרֶב
  choice: sa talim ng espada
  rationale: Ang literal na larawan ay “sa bibig ng espada,” isang idyoma para sa pagpatay gamit ang talim nito. Pinananatili ng salin ang konkretong larawan sa natural na Filipino.
- source_word: הַחֲרֵם
  choice: Italaga mo sa paglipol
  rationale: Ang Hiphil ng חרם ay tumutukoy sa di-mababawing pagtatalaga ng isang bagay sa pagkawasak. Pinananatili ng parirala ang sagradong-teknikal na diwa nang hindi gumagamit ng malabong katawagang “ban.”
- source_word: אֹתָהּ
  choice: ang lungsod
  rationale: Ang panghalip na pambabae ay tumutukoy pabalik sa lungsod; inulit ang pangngalan sa Filipino upang maging malinaw ang tinutukoy.
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: ang lahat ng naroon
  rationale: Maikli at natural itong paglalahad sa Filipino ng lahat ng nasa loob ng lungsod.
- source_word: בְּהֶמְתָּהּ
  choice: ang mga alagang hayop nito
  rationale: Ang בְּהֵמָה ay kolektibong tumutukoy sa mga domestikadong hayop at hindi lamang sa mga baka.
- source_word: לְפִי חָרֶב
  choice: sa talim ng espada
  rationale: Pinanatili ang pag-uulit ng Hebreo upang manatiling malinaw na saklaw ng utos ang lungsod, mga laman nito, at mga alagang hayop.
theological_decisions:
- issue: Ang kahulugan ng חרם sa konteksto ng digmaan at hatol
  choice: Italaga mo sa paglipol
  alternative: Lipulin mo nang lubusan; ilagay mo sa ilalim ng pagbabawal
  rationale: Pinananatili nito ang tensiyon na ang kilos ay hindi lamang karaniwang pagkawasak kundi isang di-mababawing pagtatalaga sa paglipol, habang nananatiling nauunawaan ng karaniwang mambabasa.
- issue: Ang matinding wika ng hatol sa talata
  choice: Panatilihin nang buo ang utos na pumatay at lumipol
  alternative: Palambutin bilang “talunin” o gawing pangkalahatang “wasakin”
  rationale: Malinaw at mabigat ang utos sa Hebreo; ang pagpapalambot dito ay magdaragdag ng interpretasyong wala sa pinagmulan.
translation_notes:
  register: Modernong Filipino na marangal ngunit tuwiran. Ginamit ang “lungsod” at “espada” bilang karaniwang biblikal ngunit malinaw na mga salita. Inilipat ang mga talababa sa mga pariralang tunay nilang ipinaliliwanag, yamang hindi tugma ang pagkakalagay ng mga marker sa ibinigay na English consultation layer.
