base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: tl
  text: Kung may lumitaw sa gitna ninyo na propeta o nananaginip ng mga panaginip, at magbigay siya sa inyo ng isang tanda o isang kababalaghan,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tanda o isang kahanga-hangang pangyayari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Sa kontekstong legal at pasubali, nagpapakilala ito ng isang posibleng kaso; nagpapatuloy ang kondisyon sa kasunod na talata.
- source_word: יָקוּם
  choice: may lumitaw
  rationale: Ipinahihiwatig dito ng קום ang paglitaw o pagbangon ng gayong tao sa loob ng sambayanan. Natural sa modernong Filipino ang “may lumitaw.”
- source_word: בְּקִרְבְּךָ
  choice: sa gitna ninyo
  rationale: Pinananatili nito ang larawan ng isang taong lumilitaw sa loob mismo ng sambayanan at malinaw ito sa karaniwang Filipino.
- source_word: נָבִיא
  choice: propeta
  rationale: Ito ang karaniwan at malinaw na katumbas sa Filipino.
- source_word: אוֹ
  choice: o
  rationale: Payak na pangatnig na naghihiwalay sa dalawang uri ng taong tinutukoy.
- source_word: חֹלֵם חֲלוֹם
  choice: isang nananaginip ng mga panaginip
  rationale: Pinananatili ang magkaugnay na pandiwa at pangngalan ng Hebreo at ang pagkakaiba ng taong ito sa propeta, nang hindi gumagamit ng di-natural na “mapanaginip ng mga panaginip.”
- source_word: וְנָתַן אֵלֶיךָ
  choice: at magbigay siya sa inyo
  rationale: Bagaman qatal ang anyo, may hinaharap o kasunod na diwa ito sa pasubaling pagkakasunod. Nililinaw ng “siya” ang paksa sa natural na Filipino.
- source_word: אוֹת
  choice: isang tanda
  rationale: Karaniwang tumutukoy sa tandang may katibayan o pagpapatunay; “tanda” ang malinaw at pamantayang salin.
- source_word: מוֹפֵת
  choice: isang kababalaghan
  rationale: Ipinahihiwatig nito ang isang kapansin-pansing kababalaghan o pangitain. Hindi inilalagay ng salin na ito kung tunay, mapanlinlang, o inaangkin lamang ang pangyayari.
theological_decisions:
- issue: Ang kalikasan ng tanda o kababalaghang ibinibigay ng propeta o nananaginip
  choice: “isang tanda o isang kababalaghan” nang hindi tinutukoy kung tunay na himala, panlilinlang, o pag-aangkin lamang
  alternative: “isang tanda o isang pangitain” o “isang mahimalang tanda o kababalaghan”
  rationale: Hindi pa ipinapaliwanag ng talata ang pinagmulan o katangian ng pangyayari. Pinananatili ng salin ang teolohikal na tensiyon at hindi nagdaragdag ng hatol na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa gitna ninyo” upang panatilihin ang pangkomunidad na tagpuan, at ang bahagyang pormal na “kababalaghan” upang maipakita ang natatanging pares na אוֹת ... מוֹפֵת.
