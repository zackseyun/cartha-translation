revisions:
- from: Ngunit ang propetang iyon, o ang taong iyon na nananaginip, ay papatayin, sapagkat nagsalita siya ng paghihimagsik[a] laban kay Yahweh na inyong Diyos, na naglabas sa inyo mula sa lupain ng Ehipto at tumubos sa inyo mula sa bahay ng pagkaalipin[b]. Ginawa niya ito upang ilayo kayo sa daang iniutos sa inyong lakaran ni Yahweh na inyong Diyos. Sa gayon, alisin ninyo ang kasamaan mula sa gitna ninyo.
  to: Ngunit ang propetang iyon, o ang nananaginip ng mga panaginip na iyon, ay papatayin, sapagkat nagsalita siya ng paghihimagsik[a] laban kay Yahweh na inyong Diyos, na naglabas sa inyo mula sa lupain ng Ehipto at tumubos sa inyo mula sa bahay ng pagkaalipin[b], upang ilayo kayo mula sa daang iniutos ni Yahweh na inyong Diyos na lakaran ninyo. Sa gayon, alisin ninyo ang kasamaan mula sa gitna ninyo.
  rationale: Inayos ang katawagan para sa nangangarap upang higit na maipakita ang Hebreong idyoma, at binago ang sugnay tungkol sa daan upang maging wasto, natural, at tuwirang katumbas ng “ang daang iniutos ni Yahweh ... na lakaran.” Pinanatili ang mga pangunahing salitang teolohikal at legal, pati ang mga umiiral na talababa at ang maramihang panauhan para sa Israel bilang bayan.
