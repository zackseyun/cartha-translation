source:
  edition: WLC
  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: tl
  text: Ngunit ang propetang iyon, o ang nananaginip ng mga panaginip na iyon, ay papatayin, sapagkat nagsalita siya ng paghihimagsik[a] laban kay Yahweh na inyong Diyos, na naglabas sa inyo mula sa lupain ng Ehipto at tumubos sa inyo mula sa bahay ng pagkaalipin[b], upang ilayo kayo mula sa daang iniutos ni Yahweh na inyong Diyos na lakaran ninyo. Sa gayon, alisin ninyo ang kasamaan mula sa gitna ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagtalikod.” Ang salitang Hebreo ay tumutukoy sa pagtalikod sa katapatan sa tipan at paghihimagsik laban kay Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bahay ng mga alipin”; ayon sa tradisyon, “bahay ng pagkaalipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא
  choice: Ngunit ang propetang iyon
  rationale: Ang וְ ay nag-uugnay sa naunang kaso at may kontrastibo o resumptibong bisa rito; natural itong ipahayag na “Ngunit” sa makabagong Tagalog. Ang נָבִיא ay tuwirang “propeta.”
- source_word: אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: o ang taong iyon na nananaginip
  rationale: Ang literal na idyomang Hebreo ay “nananaginip ng panaginip na iyon.” Ang saling ito ay natural sa Tagalog at pinananatili ang pantukoy na “iyon” nang hindi gumagamit ng alanganing “tagapanaginip ng mga panaginip.”
- source_word: יוּמָת
  choice: ay papatayin
  rationale: Ang Hophal ng מות ay pasibo at causative, kaya tumutukoy sa pagpapataw ng kamatayan, hindi lamang sa kusang pagkamatay.
- source_word: כִּי דִבֶּר סָרָה
  choice: sapagkat nagsalita siya ng paghihimagsik
  rationale: Ang סָרָה ay tumutukoy sa pagtalikod o paghihimagsik laban sa katapatan sa tipan. Pinananatili ng “nagsalita ng paghihimagsik” ang matinding legal at tipanang diwa ng Hebreo.
- source_word: עַל יְהוָה אֱלֹהֵיכֶם
  choice: laban kay Yahweh na inyong Diyos
  rationale: Sa mapanlabang kontekstong ito, ang עַל ay wastong “laban kay.” Ginamit ang pangalang Yahweh para sa Tetragrammaton.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: na naglabas sa inyo mula sa lupain ng Ehipto
  rationale: Pinananatili nito ang karaniwang wika ng Exodo at ang tahasang pagbanggit sa lupain ng Ehipto.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: at tumubos sa inyo mula sa bahay ng pagkaalipin
  rationale: Ang פדה ay “tumubos.” Pinananatili ng “bahay ng pagkaalipin” ang kongkretong talinghaga ng בֵּית habang natural sa Tagalog; ipinaliliwanag sa talababa ang mas literal na anyo.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: upang ilayo kayo sa daan
  rationale: Ang Hiphil ng נדח ay nagpapahiwatig ng sapilitang o mapanlinlang na paglayo. Ang “ilayo” ay malinaw at natural, samantalang pinananatili ng “daan” ang tipanang talinghaga.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: daang iniutos sa inyong lakaran ni Yahweh na inyong Diyos
  rationale: Pinananatili ng “lakaran” ang Hebreong talinghaga ng pamumuhay o asal, sa halip na gawing simpleng “sundin.”
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Sa gayon, alisin ninyo ang kasamaan mula sa gitna ninyo
  rationale: Sa pormulang legal ng Deuteronomio, ang בער ay nangangahulugang lubusang alisin ang kasamaan. Ang “alisin” ay mas natural kaysa literal na “sunugin” at hindi nagpapasok ng paraang hindi sinasabi ng teksto.
theological_decisions:
- issue: Paglalarawan sa סָרָה
  choice: paghihimagsik
  alternative: pagtalikod
  rationale: Saklaw ng salita ang paghihimagsik at apostasiya sa tipan. Ginamit ang “paghihimagsik” sa teksto dahil malinaw ito sa ordinaryong mambabasa, habang inilalahad sa talababa ang alternatibong diwa nang hindi nilulutas nang labis ang saklaw ng salita.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang orihinal ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan.
- issue: Bilang ng ikalawang panauhan
  choice: maramihang “inyo/kayo/ninyo” sa kabuuan
  alternative: pagpapanatili ng paglipat mula maramihan tungo sa isahan
  rationale: Nagpapalit ang Hebreo mula maramihan tungo sa distributibong isahan habang kinakausap ang Israel bilang isang bayan. Ang tuloy-tuloy na maramihan ay natural sa Tagalog at pinananatili ang parehong kolektibong tinutukoy nang hindi nagmumungkahi ng ibang kausap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang arkaikong pananalita, ngunit pinanatili ang mga mahalagang talinghagang “daan,” “lakaran,” at “bahay.”
