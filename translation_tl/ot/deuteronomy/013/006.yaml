    issue: Hindi sapat na tiyak ang “ang taong iyon na nananaginip.”
    rationale: Ang חֹלֵם הַחֲלוֹם ay isang katawagan para sa taong nananaginip/nagpapahayag ng panaginip; ang kasalukuyang parirala ay maaaring magmukhang karaniwang taong natutulog lamang at hindi gaanong naipapakita ang idyomang Hebreo.
  - severity: medium
    issue: Hindi likas at hindi malinaw ang “daang iniutos sa inyong lakaran.”
    rationale: Hindi maayos ang konstruksiyong “iniutos sa inyong lakaran,” at hindi nito malinaw na naipapahayag na iniutos ni Yahweh na lakaran nila ang daan.
  - severity: low
