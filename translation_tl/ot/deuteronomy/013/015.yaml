  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: tl
  text: Siyasatin mo, saliksikin, at usisaing mabuti. At kung mapatunayang totoo at tiyak ang bagay, na ang kasuklam-suklam na ito ay ginawa sa gitna mo—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרַשְׁתָ
  choice: siyasatin mo
  rationale: Sa kontekstong legal, tumutukoy ang דרש sa pagsasagawa ng pagsisiyasat; malinaw at likas sa modernong Filipino ang “siyasatin.”
- source_word: וְחָקַרְתָּ
  choice: saliksikin
  rationale: Ipinahihiwatig ng חקר ang masinsing pagsusuri. Pinananatili ng “saliksikin” ang pag-igting at naiiba ito sa naunang pandiwa.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: usisaing mabuti
  rationale: Ang שאל ay magtanong o mag-usisa, at pinalalakas ito ng הֵיטֵב. Likas na ipinapahayag ng parirala ang masusing pagtatanong.
- source_word: וְהִנֵּה
  choice: at kung mapatunayang
  rationale: Dito, ipinakikilala ng הנה ang kinalabasan ng pagsisiyasat. Sa kondisyunal na daloy ng batas, natural itong naipapahayag sa Filipino bilang “kung mapatunayang,” nang hindi ginagawang simpleng pandamdam ang marker.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: totoo at tiyak ang bagay na ito
  rationale: Pinananatili nito ang dalawang ideya ng pagiging totoo at matatag na nakumpirma, habang tahasang isinasalin ang הַדָּבָר bilang “ang bagay na ito.”
- source_word: נֶעֶשְׂתָה
  choice: ginawa
  rationale: Tumpak na ipinapahayag ng anyong pasibo ng עשה na naganap o naisagawa ang kasuklam-suklam na gawa.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: ang kasuklam-suklam na ito
  rationale: Ang “kasuklam-suklam” ay malakas ngunit nauunawaang salin ng תועבה at angkop sa dignidad ng tekstong tipan at batas.
- source_word: בְּקִרְבֶּךָ
  choice: sa gitna mo
  rationale: Pinananatili ng literal at likas na pariralang ito ang isahang ikalawang panauhan at ang diwa ng pangyayaring naganap sa loob ng pamayanan.
theological_decisions:
- issue: Pormula ng legal na pagpapatunay
  choice: Ipinakita ang sunod-sunod na masusing pagsisiyasat na humahantong sa pagpapatunay na “totoo at tiyak ang bagay na ito.”
  alternative: “Kung totoo ang ulat at napatunayan ang bagay na ito.”
  rationale: Ang piniling anyo ay nagpapanatili sa pag-uulit ng mga pandiwa at sa dalawang paglalarawan, אֱמֶת at נָכוֹן, nang hindi ipinapasok ang “ulat,” na hindi tahasang nakasulat sa talata.
translation_notes:
  register: Modernong Filipino na pormal at marangal, angkop sa tekstong legal. Pinanatili ang tatlong magkakaugnay ngunit magkakaibang pandiwa upang maipakita ang bigat ng masusing pagtiyak. Ang talata ay nagtatapos sa kuwit o em dash dahil nagpapatuloy ang kondisyunal na pangungusap sa susunod na talata.
