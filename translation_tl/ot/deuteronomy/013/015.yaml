  terminology: Ang “kasuklam-suklam” ay angkop na matinding salin para sa תּוֹעֵבָה sa legal-tipang rehistro. Ang “sa gitna mo” ay nagpapanatili ng saklaw na nasa loob ng pamayanan at ng isahang ikalawang panauhan.
