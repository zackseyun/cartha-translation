  source_fidelity: 'Ang tatlong pandiwa ng masusing legal na pagsisiyasat ay naipapahayag nang wasto. Gayunman, ang “kaya” ay nagdaragdag ng konklusibong ugnayan na wala sa Hebreo, at ang em dash na nag-uugnay sa “bagay na ito” sa “ginawa” ay nagpapalabo sa estruktura: ang “bagay” ang napatunayang totoo at tiyak, samantalang ang kasuklam-suklam na gawa ang siyang naganap sa gitna ng bayan.'
