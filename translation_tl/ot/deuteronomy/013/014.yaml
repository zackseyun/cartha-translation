  to: May mga lalaking walang kabuluhan[a] na lumabas mula sa inyo at iniligaw ang mga naninirahan sa kanilang lungsod, na nagsasabi, ‘Halina, pumunta tayo at maglingkod tayo sa ibang mga diyos na hindi ninyo nakilala.’
