  verdict: revise
  source_fidelity: 'Ang draft ay wastong kumukuha sa mga pangunahing elemento ng Hebreo: mga lalaking mula sa loob ng pamayanan, pagligaw sa mga residente ng sarili nilang lungsod, at pag-anyaya na maglingkod sa ibang mga diyos na hindi nakilala ng kausap. Gayunman, ang pagbubukas na “may lumitaw mula sa inyo na mga” ay hindi maayos na Tagalog at ang paghihiwalay sa “Sinabi nila” ay hindi gaanong mahigpit na nakakabit sa participial na לֵאמֹר.'
  naturalness: Kailangan ng pag-aayos sa ayos ng pangungusap at bantas. “May mga ... na lumabas mula sa inyo” ay likas at malinaw. Ang “Halina, pumunta tayo at maglingkod tayo” ay natural na sama-samang paanyaya at naipapahayag ang dalawang cohortative nang walang arkaikong “Halikayo.”
  terminology: Maaaring panatilihin ang “mga lalaking walang kabuluhan” bilang maingat na idyomatikong katumbas ng בְּנֵי בְלִיַּעַל, na sinusuportahan ng talababa. Ang “maglingkod” para sa עבד, “ibang mga diyos,” at “nakilala” para sa ידע ay angkop at hindi nagpapasok ng partikular na doktrinang pagbasa.
  issues:
