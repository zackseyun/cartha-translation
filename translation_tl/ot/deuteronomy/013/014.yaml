  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: tl
  text: May mga lalaking walang kabuluhan[a] na lumabas mula sa inyo at iniligaw ang mga naninirahan sa kanilang lungsod, na nagsasabi, ‘Halina, pumunta tayo at maglingkod tayo sa ibang mga diyos na hindi ninyo nakilala.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ng kawalang-kabuluhan”; ayon sa tradisyon, “mga anak ni Belial.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: may lumitaw
  rationale: Ang qal perfect ay bahagi ng iniulat na pangyayari sa kondisyunal na konteksto ng talata; likas sa Tagalog ang “may lumitaw” para sa paglitaw ng mga pasimuno mula sa loob ng pamayanan.
- source_word: אֲנָשִׁים
  choice: mga lalaki
  rationale: Tahasang panlalaking maramihan ang pangngalan, kaya pinanatili ang kasarian sa salin.
- source_word: בְּנֵי בְלִיַּעַל
  choice: mga lalaking walang kabuluhan
  rationale: Idyoma ito para sa mga taong tiwali o lapastangan sa batas; hindi ginawang pangalang pantangi ang Belial upang hindi magpasok ng mas huling teolohikal na pakahulugan.
- source_word: מִקִּרְבְּךָ
  choice: mula sa inyo
  rationale: Ipinahihiwatig na nagmula sila sa loob mismo ng pamayanang kinakausap; natural at malinaw ito sa modernong Tagalog.
- source_word: וַיַּדִּיחוּ
  choice: iniligaw
  rationale: Ang hiphil ng נדח ay nagsasaad ng pag-uudyok o pag-akay palayo, dito ay tungo sa pagtalikod sa Diyos.
- source_word: יֹשְׁבֵי עִירָם
  choice: mga naninirahan sa kanilang lungsod
  rationale: Tuwirang inilalarawan ng participial phrase ang mga naninirahan o residente ng lungsod.
- source_word: לֵאמֹר
  choice: Sinabi nila
  rationale: Natural na Tagalog na panimula sa tuwirang pananalita, na malinaw na ang mga pasimuno ang nagsasalita.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Halikayo, maglingkod tayo
  rationale: Ang dalawang cohortative ay paanyaya o panghihikayat; ipinahahayag ng “Halikayo” ang puwersa ng pag-anyaya, at pinananatili ng “maglingkod” ang malawak na tipanang diwa ng עבד.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang katumbas ng karaniwang parirala sa Deuteronomio, nang hindi ito pinakikitid sa “mga diyos ng ibang bansa.”
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: na hindi ninyo nakilala
  rationale: Pinananatili ng “nakilala” ang posibleng relasyonal at tipanang diwa ng ידע, sa halip na limitahan ito sa simpleng kaalaman tungkol sa kanila.
theological_decisions:
- issue: Pagpapakahulugan sa בְּנֵי בְלִיַּעַל
  choice: mga lalaking walang kabuluhan
  alternative: mga anak ni Belial; masasamang lalaki
  rationale: Sa kontekstong Hebreo, idyoma ito para sa mga taong tiwali o walang pakundangan, hindi kinakailangang pangalan ng isang demonyo. Iniiwasan nitong ipasok ang mas huling personipikasyon kay Belial.
- issue: Diwa ng “pagkilala” sa ibang mga diyos
  choice: na hindi ninyo nakilala
  alternative: na hindi ninyo alam; na hindi ninyo kilala
  rationale: Ang anyong ito ay nagpapanatili sa tensiyon sa pagitan ng karaniwang pagkilala at relasyonal na pagkakilala nang hindi tahasang nilulutas ang saklaw ng ידע.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado ngunit madaling maunawaan. Ginamit ang “lungsod” at “maglingkod” bilang karaniwan at malinaw na mga terminong biblikal; iniwasan ang sobrang arkaiko o denominasyonal na pananalita.
