base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: tl
  text: Tipunin mo sa gitna ng liwasan nito ang lahat ng samsam nito. Sunugin mo sa apoy ang lungsod at ang lahat ng samsam nito bilang handog na ganap na susunugin para kay Yahweh na iyong Diyos.[a] Mananatili itong bunton ng mga guho magpakailanman;[b] hindi na ito muling itatayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sunugin mo sa apoy ang lungsod at ang lahat ng samsam nito nang lubusan para kay Yahweh na iyong Diyos.” Ang Hebreong כָּלִיל ay maaaring mangahulugang “nang lubusan” o magpahiwatig ng isang handog na ganap na sinusunog para sa Diyos.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “isang bunton magpakailanman,” samakatuwid ay isang permanenteng bunton ng mga guho.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: lahat ng samsam nito
  rationale: Ang שָׁלָל ay tumutukoy sa mga ari-ariang kinuha bilang samsam. Ang “samsam” ay natural at angkop sa konteksto ng digmaan at batas.
- source_word: תִּקְבֹּץ
  choice: tipunin mo
  rationale: Ang Qal imperfect na 2ms ay gumaganap bilang tuwirang utos sa kontekstong legal; malinaw itong naihahatid ng “tipunin mo.”
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: sa gitna ng liwasan nito
  rationale: Ang רְחוֹב ay karaniwang maluwang na pampublikong lugar o liwasan, hindi lamang isang karaniwang kalye.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: sunugin mo sa apoy
  rationale: Pinananatili nito ang tahasang idyomang Hebreo tungkol sa ganap na pagwasak sa pamamagitan ng apoy.
- source_word: כָּלִיל
  choice: bilang handog na lubusang tutupukin
  rationale: Ipinahihiwatig ng כָּלִיל ang kabuuang pagkatupok at maaari ring magkaroon ng pansakripisyong diwa. Pinananatili ng salin ang dalawang sangkap nang hindi ito tinatawag na teknikal na handog na sinusunog na karaniwang hayop.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang לְ ay nagpapahiwatig ng paglalaan o paghahandog, at tahasang tinutumbasan ng “Yahweh” ang banal na pangalang יהוה.
- source_word: תֵּל עוֹלָם
  choice: bunton ng mga guho magpakailanman
  rationale: Pinananatili ng “bunton” ang pisikal na larawan ng תֵּל, habang nililinaw ng “mga guho” ang konteksto at ng “magpakailanman” ang pangmatagalang bisa ng עוֹלָם.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: hindi na ito muling itatayo
  rationale: Natural na ipinahahayag nito sa Filipino ang Nifal na anyo at ang ideya ng עוֹד na hindi na muling pagtatayo.
theological_decisions:
- issue: Pansakripisyong diwa ng כָּלִיל sa pagsunog sa lungsod
  choice: “bilang handog na lubusang tutupukin para kay Yahweh”
  alternative: “sunugin nang lubusan para kay Yahweh”
  rationale: Maaaring basahin ang כָּלִיל bilang pang-abay na “nang lubusan” o bilang salitang may diwa ng handog na ganap na tinutupok. Inilalagay ng pangunahing salin ang pansakripisyong diwa sa teksto ngunit itinatala sa talababa ang wastong alternatibong pagbasa.
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: ANG PANGINOON
  rationale: Ginagamit ang personal na pangalang “Yahweh” upang malinaw na katawanin ang יהוה at maiba ito sa karaniwang titulong “Panginoon,” nang walang idinadagdag na sektaryong pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Ang “liwasan,” “samsam,” at “bunton ng mga guho” ay madaling maunawaan ngunit pinananatili ang kongkretong larawan ng tekstong Hebreo. Isahan ang kausap, gaya ng mga anyong 2ms sa pinagmulan.
