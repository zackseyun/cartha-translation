  naturalness: 'May isang makabuluhang suliraning panggramatika sa “handog na lubusang tutupukin”: ang “tutupukin” ay karaniwang anyong aktibo/transitibo at maaaring mangahulugang ang handog ang tutupok ng iba. Ang “handog na ganap na susunugin” ay malinaw, natural, at tumutugma sa layuning pansakripisyo.'
