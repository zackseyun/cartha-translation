  text: You shall have no other gods before me[a].
translation:
  language: tl
  text: Huwag kang magkaroon ng ibang mga diyos sa harap ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maliban sa akin.” Sa Hebreo, literal na “sa harap ng aking mukha,” na maaaring magpahayag kapuwa ng presensiya at ng pagiging eksklusibo.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Huwag kang magkaroon
  rationale: Ang literal na anyong “hindi magkakaroon para sa iyo” ay nagpapahayag ng pag-iral o pag-aari kaugnay ng kausap. Ang “Huwag kang magkaroon” ang natural na makabagong Tagalog na nagpapanatili sa lakas ng pagbabawal at sa isahang pagtukoy sa kausap.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Ang pangngalang maramihan na may panuring na “iba” ay tumutukoy sa mga diyos na kaagaw sa pagsamba. Ang “ibang mga diyos” ay tuwiran at hindi nagdaragdag ng di-tiyak na diwang “dayuhan.”
- source_word: עַל־פָּנָי
  choice: sa harap ko
  rationale: Literal itong tumutukoy sa harap o presensiya ng nagsasalita. Pinananatili ng “sa harap ko” ang larawang Hebreo at ang maaaring diwa ng presensiya, habang inilalagay sa talababa ang posibleng diwa ng pagiging bukod-tangi.
theological_decisions:
- issue: Kahulugan ng pangwakas na pariralang עַל־פָּנָי
  choice: sa harap ko
  alternative: maliban sa akin; sa aking presensiya
  rationale: Maaaring ipahayag ng pariralang Hebreo ang presensiya at, sa konteksto ng pagbabawal, ang pagiging bukod-tangi. Hindi nilulutas ng pangunahing teksto ang tunay na tensiyong ito; pinananatili nito ang mas pormal na larawan, at inilalahad sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “kang” ayon sa isahang panlalaking anyo ng Hebreo, na tumutukoy sa Israel bilang kausap sa tipan. Ang “sa harap ko” ay sadyang pinanatili upang hindi mawala ang talinghaga at ambigwidad ng orihinal.
