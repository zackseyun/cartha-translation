base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: tl
  text: At sinabi ninyo, “Narito, ipinakita sa amin ni Yahweh, ang aming Diyos, ang kanyang kaluwalhatian at kadakilaan, at narinig namin ang kanyang tinig mula sa gitna ng apoy. Sa araw na ito, nakita namin na maaaring magsalita ang Diyos sa tao at manatiling buhay ang tao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos sa isang kinikilalang anyong Tagalog sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כְּבֹדוֹ וְאֶת־גָּדְלוֹ
  choice: ang kanyang kaluwalhatian at kadakilaan
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na katangian sa Hebreo.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mula sa gitna ng apoy
  rationale: Malapit sa konkretong larawan at lokatibong diwa ng pariralang Hebreo.
- source_word: יְדַבֵּר אֱלֹהִים אֶת־הָאָדָם
  choice: makapagsalita ang Diyos sa tao
  rationale: Ipinahahayag ang namanghang pagkilala na maaaring magsalita ang Diyos sa isang tao, nang hindi ginagawang pangkalahatang doktrinal na pahayag ang imperfect na anyo.
- source_word: וָחָי
  choice: at manatili pa rin itong buhay
  rationale: Ang paksa ay ang taong kinausap ng Diyos; ginagawang malinaw sa natural na Tagalog ang ipinahihiwatig na paksa at ang diwang nakaligtas pa rin ito.
theological_decisions:
- issue: Kung ang יְדַבֵּר ay simpleng “nagsasalita” o modal na “makapagsalita”
  choice: makapagsalita ang Diyos sa tao
  alternative: nagsasalita ang Diyos sa tao
  rationale: Sa konteksto, ipinapahayag ng Israel ang pambihirang posibilidad na makapagsalita ang Diyos sa tao nang hindi ito namamatay. Pinananatili nito ang modal na puwersang nakikita sa sugnay na כִּי at sa kasunod na וָחָי.
- issue: Tinutukoy ng וָחָי
  choice: ang taong kinausap ng Diyos ay nananatiling buhay
  alternative: ang Diyos ay buhay
  rationale: Ang natural na sintaks at konteksto ay tumutukoy sa הָאָדָם, hindi sa Diyos; ang himala ay makarinig ang tao sa Diyos at mabuhay pa rin.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Tingnan ninyo” para sa הֵן bilang panawag-pansin, at “Yahweh” para sa banal na pangalan. Iniwasan ang sobrang literal na ayos na magiging malamya sa Tagalog habang pinananatili ang pagkakasunod ng mga ideya at ang teolohikal na tensiyon ng pakikipag-usap ng Diyos sa tao na nananatiling buhay.
