  to: At sinabi ninyo, “Narito, ipinakita sa amin ni Yahweh, ang aming Diyos, ang kanyang kaluwalhatian at kadakilaan, at narinig namin ang kanyang tinig mula sa gitna ng apoy. Sa araw na ito, nakita namin na maaaring magsalita ang Diyos sa tao at manatiling buhay ang tao.”
