  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: tl
  text: Huwag kang gagawa para sa iyong sarili ng larawang inukit[a], ni ng anumang wangis[b] ng anumang nasa langit sa itaas, nasa lupa sa ibaba, o nasa tubig sa ilalim ng lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “diyus-diyosan.” Ang salitang Hebreo ay madalas tumukoy sa larawang ginagamit sa idolatriya, ngunit pinanatili rito ang mas kongkretong “larawang inukit.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “anumang anyo” o “anumang larawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: larawang inukit
  rationale: Pinananatili nito ang kongkretong diwa ng isang imaheng hinubog sa pamamagitan ng pag-ukit, nang hindi agad ipinapalagay sa salin ang interpretasyong “diyus-diyosan.”
- source_word: תְּמוּנָה
  choice: wangis
  rationale: Ang “wangis” ay likas at marangal na katumbas ng anyo o pagkakahawig, at pinalalawak nito ang pagbabawal mula sa larawang inukit tungo sa anumang representasyon.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: Huwag kang gagawa para sa iyong sarili
  rationale: Ang “Huwag kang gagawa” ay natural na modernong Tagalog para sa tahasang pagbabawal, samantalang pinananatili ng “para sa iyong sarili” ang לְךָ at ang diwa ng personal na pag-aangkin o paggamit.
- source_word: כָּל תְּמוּנָה
  choice: anumang wangis
  rationale: Sa konteksto ng pagbabawal, natural na ipinahahayag ng “anumang” ang saklaw ng כָּל nang hindi nagiging mekanikal ang salin.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: ng anumang nasa langit sa itaas
  rationale: Malinaw nitong pinananatili ang unang saklaw at ang patayong paghahambing na “sa itaas.” Ang “langit” ay idiomatikong kolektibo sa Tagalog kahit plural ang anyong Hebreo.
- source_word: בָּאָרֶץ מִתָּחַת
  choice: nasa lupa sa ibaba
  rationale: Ang “nasa lupa” ang natural na Tagalog para sa mga nilalang o bagay sa panlupang saklaw; pinananatili ng “sa ibaba” ang kaibahan sa langit sa itaas.
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: nasa tubig sa ilalim ng lupa
  rationale: Tuwiran at malinaw nitong isinasalin ang sinaunang paglalarawan sa tubig na nasa ilalim ng lupa, nang hindi ito muling binibigyang-kahulugan.
theological_decisions:
- issue: Saklaw ng pagbabawal sa paggawa ng larawan
  choice: Isinalin ang talata bilang pagbabawal sa paggawa ng larawang inukit o anumang wangis, nang hindi idinaragdag ang layuning pagsamba.
  alternative: Isaling mas interpretatibo bilang pagbabawal lamang sa paggawa ng mga diyus-diyosan para sambahin.
  rationale: Sa talata 9 pa tahasang binabanggit ang pagyukod at paglilingkod sa mga ito. Ang hindi pagdaragdag nito rito ay nagpapanatili sa pag-usad at tensiyon ng teksto.
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw, dignified, at angkop sa tekstong legal-tipanan. Ginamit ang “Huwag kang gagawa” sa halip na mas matigas o di-likas na anyong hinaharap. Hindi ginamit ang mas arkaikong “larawang nililok,” at pinanatili ang kosmolohikal na ayos: langit sa itaas, lupa sa ibaba, at tubig sa ilalim ng lupa.'
