  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: tl
  text: At nang marinig ninyo ang tinig mula sa gitna ng kadiliman[a], habang nagliliyab sa apoy ang bundok, lumapit kayo sa akin—kayong lahat na mga pinuno ng inyong mga lipi at mga nakatatanda ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tunog.” Maaaring tumukoy ang Hebreong qol sa tinig o tunog; dito, mas angkop ang “tinig” dahil nagsasalita ang Diyos mula sa kadiliman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: At nang marinig ninyo
  rationale: Ang וַיְהִי kasama ng temporal na כְּ ay nagpapakilala ng kasunod na pangyayari. Likas sa modernong Tagalog ang “At nang marinig ninyo” at hindi kailangang isalin nang tahasan ang idiomatikong “nangyari.”
- source_word: הַקּוֹל
  choice: ang tinig
  rationale: Maaaring mangahulugan ang קוֹל ng “tinig” o “tunog.” Sa konteksto ng pagsasalita ng Diyos sa Horeb, mas angkop ang personal na “tinig,” habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: mula sa gitna ng kadiliman
  rationale: Pinananatili ng “sa gitna” ang larawan ng תּוֹךְ, at malinaw at marangal pa rin ito sa Tagalog.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: habang nagliliyab sa apoy ang bundok
  rationale: Circumstantial ang waw at naglalarawan ng kasabay na tagpo. Ipinahihiwatig ng participle na בֹּעֵר ang patuloy na pagliyab.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: lumapit sa akin
  rationale: Direktang ipinapahayag ng parirala ang pagkilos patungo kay Moises; natural at tumpak sa Tagalog ang “lumapit sa akin.”
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: ang lahat ng pinuno ng inyong mga lipi
  rationale: Sa konteksto, ang רָאשֵׁי ay mga namumunong kinatawan. Mas malinaw sa karaniwang mambabasa ang “mga pinuno” kaysa literal na “mga ulo.”
- source_word: וְזִקְנֵיכֶם
  choice: at ang inyong matatandang pinuno
  rationale: Ang זְקֵנִים dito ay kinikilalang mga pinuno ng pamayanan, hindi lamang matatandang lalaki. Nililinaw ito ng “matatandang pinuno.”
