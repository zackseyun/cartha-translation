translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ninyo/inyong” para sa maramihang kausap at “mga lipi” para sa mga tribo ng Israel. Ang ayos ng huling sugnay ay ginawang natural sa Tagalog nang hindi binabago ang saklaw ng “lahat.”
