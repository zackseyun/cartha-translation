    issue: Hindi malinaw ang sintaktikong ugnayan ng “sa mga napopoot sa akin.”
    rationale: Sa kasalukuyang ayos, ang parirala ay nakahiwalay matapos ng “maging ang ikatlo at ikaapat,” kaya hindi ito natural na Filipino at maaaring maliitin ang saklaw nito. Ang “hanggang sa ikatlo at ikaapat na salinlahi ng mga napopoot sa akin” ay malinaw na naghahatid ng idyomang Hebreo nang walang pagdaragdag ng doktrinal na pagpapasya.
  - severity: low
    issue: Hindi sapat na malinaw sa pangunahing teksto ang “ikatlo at ikaapat.”
    rationale: Bagaman ipinaliliwanag ng talababa ang ipinahihiwatig na “salinlahi,” mas natural na isama ito sa Filipino upang hindi magmukhang mga taong ordinal lamang ang tinutukoy.
