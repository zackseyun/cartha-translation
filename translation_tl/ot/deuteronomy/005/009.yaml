revisions:
- from: Huwag kang yuyukod sa mga iyon o maglilingkod sa mga iyon[a], sapagkat ako, si Yahweh na iyong Diyos, ay Diyos na mapanibughuin. Pinananagot ko[b] ang mga anak dahil sa kasamaan ng kanilang mga ama, maging ang ikatlo at ikaapat[c], sa mga napopoot sa akin.
  to: Huwag kang yuyukod sa mga iyon o maglilingkod sa mga iyon[a], sapagkat ako, si Yahweh na iyong Diyos, ay Diyos na mapanibughuin, na pinananagot[b] ang mga anak dahil sa kasamaan ng mga ama, hanggang sa ikatlo at ikaapat na salinlahi[c] ng mga napopoot sa akin.
  rationale: Inayos ang ayos ng hulíng mga parirala at idinagdag ang “salinlahi” sa teksto para sa likas at malinaw na Filipino. Pinananatili nito ang orihinal na larawan ng pagdalaw/pananagot sa kasamaan ng mga ama sa mga anak hanggang sa ikatlo at ikaapat na salinlahi, pati ang panghuling paglilimita o pagkakaugnay sa “mga napopoot sa akin,” nang hindi nagtatakda ng isang doktrinal na paliwanag hinggil sa saklaw ng pananagutan.
