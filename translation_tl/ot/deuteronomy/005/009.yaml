language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: tl
  text: Huwag kang yuyukod sa mga iyon o maglilingkod sa mga iyon[a], sapagkat ako, si Yahweh na iyong Diyos, ay Diyos na mapanibughuin, na pinananagot[b] ang mga anak dahil sa kasamaan ng mga ama, hanggang sa ikatlo at ikaapat na salinlahi[c] ng mga napopoot sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpapatirapa sa mga iyon.” Ang pandiwang Hebreo ay tumutukoy sa pagyukod o pagpapatirapa bilang pagpapakita ng pagpipitagan.
    reason: lexical_alternative
  - marker: b
    text: O “pinarurusahan” o “sinisingil.” Literal na “dinadalaw”; ang salitang Hebreo ay terminong panghukuman na maaaring tumukoy kapuwa sa pagtutuos at sa pagpaparusa.
    reason: lexical_alternative
  - marker: c
    text: Literal na “sa ikatlo at sa ikaapat.” Ang “salinlahi” ay ipinasok upang maipahayag ang idyoma sa Filipino.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: yuyukod
  rationale: Pinananatili nito ang kongkretong kilos ng pagyukod bilang pagpapakumbaba o pagpipitagan, sa halip na pagsamahin agad ang kahulugan nito sa pangkalahatang salitang “sasamba.”
- source_word: תָעָבְדֵם
  choice: maglilingkod sa mga iyon
  rationale: Pinananatili ang pagkakaiba ng paglilingkod sa naunang kilos ng pagyukod, habang malinaw pa rin ang debosyon sa mga diyus-diyosan sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang katumbas ng katawagang may pang-isahang panlaping tumutukoy sa kausap.
- source_word: אֵל קַנָּא
  choice: Diyos na mapanibughuin
  rationale: Ipinahahayag nito ang eksklusibong pag-angkin ng Diyos sa katapatan at pagsamba sa konteksto ng tipan, hindi ang hamak o makasariling inggit.
- source_word: פֹּקֵד
  choice: pinananagot
  rationale: Natural itong judicial na pananalita sa Filipino at naihahatid ang pagtutuos sa kasamaan, bagaman mas malawak ang saklaw ng salitang Hebreo; nililinaw iyon sa talababa.
- source_word: עֲוֺן
  choice: kasamaan
  rationale: Napananatili nito ang moral na bigat ng salita nang hindi lubusang nagpapasiya kung ang diin ay nasa masamang gawa, pagkakasala, o bunga ng pananagutan.
- source_word: אָבוֹת
  choice: mga ama
  rationale: Pinananatili ang tahasang panlalaking pangmaramihang anyo ng Hebreo sa halip na gawing “mga magulang” o “mga ninuno.”
- source_word: עַל בָּנִים
  choice: ang mga anak
  rationale: Sa kontekstong salinlahi, ang Hebreong “mga anak na lalaki” ay maaaring kumatawan sa mga supling sa pangkalahatan; natural at saklaw ang “mga anak” sa Filipino.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: maging ang ikatlo at ikaapat
  rationale: Pinananatili ang literal na anyong ordinal ng Hebreo; ipinapaliwanag sa talababa na ang “salinlahi” ay ipinahihiwatig.
- source_word: לְשֹׂנְאָי
  choice: sa mga napopoot sa akin
  rationale: Inilalagay ang parirala sa hulihan gaya ng Hebreo upang mapanatili ang saklaw at tensiyon nito, at upang hindi ipahiwatig na ganap na hiwalay sa sariling tindig ng mga sumunod na salinlahi ang pagtutuos.
theological_decisions:
- issue: Paglalarawan sa banal na paninibugho
  choice: Diyos na mapanibughuin
  alternative: Diyos na masigasig; Diyos na nagseselos
  rationale: Ang “mapanibughuin” ay nagpapanatili sa diwa ng eksklusibong katapatan sa tipan. Hindi nito pinapalambot ang pahayag tungo lamang sa kasigasigan, at mas marangal sa kontekstong ito kaysa sa karaniwang romantikong gamit ng “nagseselos.”
- issue: Kung awtomatikong pinarurusahan ang mga inapo anuman ang sarili nilang tindig
  choice: Pinanatili sa hulihan ang “sa mga napopoot sa akin” upang maaari nitong limitahan ang saklaw ng pagtutuos sa mga nagpapatuloy sa pagkapoot sa Diyos.
  alternative: Unawain na ang mga inapo ay pinananagot dahil lamang sa kasamaan ng kanilang mga ama, anuman ang sarili nilang tugon sa Diyos.
  rationale: Ang panghuling pariralang Hebreo ay likas na kaugnay ng mga saklaw ng paghatol. Ang ayos na ito ay nagpapanatili sa sintaktikong kalabuan at teolohikal na tensiyon sa halip na magtakda ng isang ganap na doktrina ng minanang parusa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pang-isahang “kang/iyong” upang sundan ang kausap sa Hebreo. Pinanatili ang “Yahweh,” “mga ama,” at ang magkahiwalay na kilos ng pagyukod at paglilingkod. Ang bahagyang pormal na “mapanibughuin” ay pinili dahil mas angkop ito sa tipan at banal na pagsamba kaysa sa kolokyal na “nagseselos.”
