  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: tl
  text: Si Yahweh, ang ating Diyos, ay nakipagtipan sa atin sa Horeb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na: “pumutol ng tipan sa atin sa Horeb.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyong “Yahweh” upang mapanatili ang personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Tuwirang ipinapahayag ng anyong Hebreo na may hulaping pangmaramihang unang panauhan ang “ating Diyos”; natural din ito sa makabagong Tagalog.
- source_word: כָּרַת ... בְּרִית
  choice: nakipagtipan
  rationale: Ang literal na idyomang Hebreo ay “pumutol ng tipan,” ngunit ang “nakipagtipan” ang malinaw at likas na katumbas sa Tagalog. Inilagay sa talababa ang literal na larawan ng idyoma.
- source_word: עִמָּנוּ
  choice: sa atin
  rationale: Pinananatili nito ang kapwa panig na kaugnayang ipinahihiwatig ng pariralang “nakipagtipan sa atin.”
- source_word: בְּחֹרֵב
  choice: sa Horeb
  rationale: Ang pang-ukol na “sa” ang natural na panandang panlunan sa Tagalog, at pinanatiling transliterado ang pangalang Horeb.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at pangtipang pangalan nang hindi ito pinapalitan ng titulo o ng ibang tradisyonal na anyo.
- issue: Kahulugan ng בְּרִית
  choice: tipan
  alternative: kasunduan
  rationale: Mas napapanatili ng “tipan” ang bigat ng pormal at pangrelasyong ugnayan sa pagitan ng Diyos at Israel; maaaring maging napakalawak o pangkaraniwan ang “kasunduan.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakipagtipan” bilang likas na salin ng Hebreong idyoma, habang pinanatili sa talababa ang literal na pananalita.
