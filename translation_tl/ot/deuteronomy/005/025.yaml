base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: tl
  text: At ngayon, bakit kami mamamatay? Sapagkat tutupukin kami ng malaking apoy na ito. Kung patuloy pa kaming makaririnig ng tinig ni Yahweh na aming Diyos, mamamatay kami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang pang-abay na temporal na עַתָּה bilang panandang nag-uugnay sa pasiya ng bayan sa naunang pagpapakita ng Diyos.
- source_word: לָמָּה נָמוּת
  choice: bakit kami mamamatay?
  rationale: Likas na tanong sa Filipino na nagpapahayag ng kinatatakutang kahihinatnan; ang aspektong kontemplatibo ay angkop sa di-perpektong anyong Hebreo.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang retorikal na tanong sa marangal at malinaw na Filipino.
- source_word: תֹאכְלֵנוּ
  choice: tutupukin kami
  rationale: Ang literal na larawan ay ‘kakainin kami,’ ngunit kapag apoy ang simuno, ang ‘tutupukin’ ang natural na Filipino at nagpapanatili sa diwa ng lubos na paglamon o pag-ubos.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: ang malaking apoy na ito
  rationale: Tuwirang pinananatili ang pangngalan, pang-uri, at demonstratibo sa natural na ayos ng Filipino.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: Kung patuloy pa naming maririnig
  rationale: Ang יסף kasama ng pawatas ay nangangahulugang magpatuloy o muling gawin; ipinahahayag ng ‘patuloy pa’ ang pagpapatuloy, habang pinananatili ng ‘maririnig’ ang pandiwang pandama na שׁמע.
- source_word: קוֹל
  choice: ang tinig
  rationale: Sa konteksto ng pagsasalita ng Diyos, mas tiyak at natural ang ‘tinig’ kaysa ‘tunog.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: aming Diyos
  rationale: Pinananatili ang unang panauhang maramihang pag-aari at ang wikang tipan ng Hebreo.
- source_word: עוֹד
  choice: pa
  rationale: Sa kondisyunal na pangungusap, natural na ipinahahayag ng ‘pa’ ang karagdagang pagpapatuloy sa hinaharap.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang ‘Yahweh’ ay malinaw na transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Katiyakan ng kamatayan sa huling sugnay
  choice: mamamatay kami
  alternative: baka mamatay kami
  rationale: Tuwirang sinasabi ng Hebreo na ‘at mamamatay kami’; hindi dinaragdagan ng salin ang modal na ‘baka,’ kahit malinaw na takot ang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘tutupukin’ bilang likas na kolokasyon para sa mapanirang apoy, at ‘tinig’ para sa banal na pagsasalita. Walang talababa dahil walang alternatibong pagbasa o tekstuwal na suliraning kailangang ipaliwanag sa talatang ito.
