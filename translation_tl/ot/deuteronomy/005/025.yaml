  to: At ngayon, bakit kami mamamatay? Sapagkat tutupukin kami ng malaking apoy na ito. Kung patuloy pa kaming makaririnig ng tinig ni Yahweh na aming Diyos, mamamatay kami.
  rationale: Isang maliit na pagsasaayos lamang sa huling kondisyunal na sugnay ang ginawa upang maging mas likas ang modernong Filipino. Ang “makaririnig ng tinig” ay nananatiling malapit sa לִשְׁמֹעַ אֶת־קוֹל, at ang “patuloy pa” ay pinananatili ang puwersa ng יֹסְפִים ... עוֹד.
