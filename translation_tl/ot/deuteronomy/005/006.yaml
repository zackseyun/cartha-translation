id: DEU.5.6
reference: Deuteronomy 5:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: tl
  text: Ako si Yahweh, ang iyong Diyos, na naglabas sa iyo mula sa lupain ng Ehipto, mula sa bahay ng mga alipin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa bahay ng pagkaalipin”; ayon sa literal na Hebreo, “mula sa bahay ng mga alipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Ako
  rationale: Ang tahasang panghalip na unang panauhan ay inilagay sa unahan upang mapanatili ang mariin at taimtim na pagpapakilala sa sarili; hindi kailangan ng hiwalay na katumbas ng copula sa natural na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalang tipan sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: ang iyong Diyos
  rationale: Tumutukoy ang אֱלֹהִים kay Yahweh sa konteksto ng tipan, kaya ginamit ang malaking titik sa “Diyos”; ang hulaping ikalawang panauhang panlalaking isahan ay likas na ipinahayag ng “iyong.”
- source_word: אֲשֶׁר
  choice: na
  rationale: Ang “na” ang natural na pang-ugnay na Tagalog para sa sugnay na nagpapakilala sa ginawa ni Yahweh.
- source_word: הוֹצֵאתִיךָ
  choice: naglabas sa iyo
  rationale: Ang Hiphil ng יצא ay nangangahulugang magpalabas o magdala palabas. Ang “naglabas sa iyo” ay tuwiran at natural sa salaysay ng Exodo.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Ang מִן ay nagsasaad ng pinagmulan; malinaw at likas itong naihahayag ng “mula sa.”
- source_word: מִבֵּית עֲבָדִים
  choice: mula sa bahay ng mga alipin
  rationale: Pinananatili nito ang kongkretong maramihang pangngalang עֲבָדִים, “mga alipin,” at ang larawang “bahay,” sa halip na agad gawing abstraktong “pagkaalipin.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan ng Diyos sa tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng עֲבָדִים sa pormulang tumutukoy sa Exodo
  choice: mga alipin
  alternative: pagkaalipin o pagkabihag
  rationale: Maramihang kongkretong pangngalan ang עֲבָדִים. Ang “mga alipin” ay nagpapanatili sa anyo at panlipunang realidad ng teksto, habang inilalahad sa talababa ang mas idyomatikong abstraktong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Ako si Yahweh, ang iyong Diyos” bilang natural na pagpapakilala, at inulit ang “mula sa” upang mapanatili ang magkatulad na dalawang pariralang Hebreo. Inilagay ang talababa sa mismong pariralang tinutukoy nito.
