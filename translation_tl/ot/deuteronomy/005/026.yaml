  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: tl
  text: Sapagkat sino sa mga taong mortal[a] ang nakarinig sa tinig ng Diyos na buhay na nagsasalita mula sa gitna ng apoy, tulad natin, at nanatiling buhay?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng laman,” isang idyoma para sa mga taong mortal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng takot at kahilingan ng bayan sa konteksto.
- source_word: מִי כָל בָּשָׂר
  choice: sino sa lahat ng taong mortal
  rationale: Pinananatili ang pangkalahatang tanong at inilalahad sa likas na Tagalog ang idyomang Hebreo na tumutukoy sa sangkatauhang marupok at mortal.
- source_word: שָׁמַע קוֹל
  choice: nakarinig sa tinig
  rationale: Ang קוֹל ay 'tinig' dito sapagkat ang Diyos ay inilalarawang nagsasalita.
- source_word: אֱלֹהִים חַיִּים
  choice: Diyos na buhay
  rationale: Bagaman maramihan ang anyo ng mga salitang Hebreo, ang parirala ay isang kinikilalang pantukoy sa iisang Diyos ng Israel.
- source_word: מְדַבֵּר מִתּוֹךְ הָאֵשׁ
  choice: na nagsasalita mula sa gitna ng apoy
  rationale: Malinaw na ipinahahayag na ang tinig ay nanggagaling sa loob ng apoy at pinananatili ang participial na paglalarawan.
- source_word: כָּמֹנוּ
  choice: gaya natin
  rationale: Tumutukoy sa mismong karanasan ng Israel; likas at hindi labis na nililinaw sa Tagalog.
- source_word: וַיֶּחִי
  choice: at nanatiling buhay
  rationale: Ipinahahayag ang literal na diwang 'nabuhay/nanatiling buhay' at ang pagtatakang hindi sila namatay matapos marinig ang Diyos.
theological_decisions:
- issue: Idyomang antropolohikal na כָל בָּשָׂר
  choice: lahat ng taong mortal
  alternative: lahat ng laman
  rationale: Ang literal na 'lahat ng laman' ay maaaring malabo o tumukoy sa pisikal na laman sa modernong Tagalog. Ang 'taong mortal' ay naghahatid ng reperensiya sa sangkatauhan at ng diin sa pagiging marupok sa harap ng Diyos.
- issue: Bilang at kahulugan ng אֱלֹהִים חַיִּים
  choice: Diyos na buhay
  alternative: mga diyos na buhay
  rationale: Sa konteksto at gamit ng Hebreo, ang parirala ay tumutukoy sa iisang Diyos ng Israel; ang maramihang salin ay magbibigay ng maling kahulugan.
- issue: Kahulugan ng וַיֶּחִי
  choice: nanatiling buhay
  alternative: nakaligtas
  rationale: Hindi tahasang ginagamit ng Hebreo ang pandiwang 'makaligtas.' Pinananatili ng salin ang diwa ng buhay nang hindi dinaragdagan ang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang ugnayang pangangatwiran, at “mula sa gitna ng apoy” upang mapanatili ang matingkad na larawan ng Hebreo.
