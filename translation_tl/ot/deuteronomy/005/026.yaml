revisions:
- from: Sapagkat sino sa lahat ng taong mortal[a] ang nakarinig sa tinig ng Diyos na buhay na nagsasalita mula sa gitna ng apoy, gaya natin, at nanatiling buhay?
  to: Sapagkat sino sa mga taong mortal[a] ang nakarinig sa tinig ng Diyos na buhay na nagsasalita mula sa gitna ng apoy, tulad natin, at nanatiling buhay?
  rationale: Pinalitan ang “sa lahat ng taong mortal” ng “sa mga taong mortal” upang maging mas likas ang Tagalog at mas tumpak ang pangkalahatang retorikal na saklaw ng Hebreong idyoma. Walang binago sa kahulugan, terminolohiya, o talababa.
  reviewer_model: gpt-5.6-terra
