translation:
  language: tl
  text: Huwag kang magbigay ng huwad na patotoo laban sa iyong kapwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag kang magpatotoo nang hindi totoo laban sa iyong kapwa.”
