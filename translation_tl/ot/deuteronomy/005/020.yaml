lexical_decisions:
- source_word: לֹא
  choice: Huwag
  rationale: Karaniwang anyo ito ng tuwirang pagbabawal sa modernong Filipino at malinaw na naghahatid ng puwersa ng utos.
- source_word: תַעֲנֶה
  choice: magbigay ng ... patotoo
  rationale: Bagaman ang pandiwa ay maaaring mangahulugang ‘sumagot,’ sa legal na pariralang kasama ang עֵד ay tumutukoy ito sa pagbibigay ng patotoo.
- source_word: בְרֵעֲךָ
  choice: laban sa iyong kapwa
  rationale: Ang רֵעַ ay kapwa, kasama, o kapitbahay; sa konteksto ng pagtestigo, likas na ipinahahayag ng ‘laban sa’ ang diwang legal ng pang-ukol.
- source_word: עֵד
  choice: patotoo
  rationale: Sa konstruksiyong ito, ang salita ay bahagi ng legal na pahayag tungkol sa pagsaksi. Ang ‘patotoo’ ay natural sa Filipino at pinananatili ang diwang panghukuman.
- source_word: שָׁוְא
  choice: huwad
  rationale: Maaaring tumukoy ang salita sa kabulaanan, panlilinlang, o kawalang-laman. Sa konteksto ng patotoo, ang ‘huwad’ ay maikli at malinaw na nagsasaad ng patotoong hindi totoo.
