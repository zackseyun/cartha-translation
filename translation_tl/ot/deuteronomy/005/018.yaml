  text: At huwag kang mangalunya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring mas maikli: “Huwag kang mangalunya.” May pang-ugnay na “at” sa Hebreo na nagdurugtong sa utos na ito sa mga nakapaligid na utos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: At huwag
  rationale: Pinananatili ng “At” ang pang-ugnay na וְ na nagdurugtong sa utos na ito sa magkakasunod na utos. Ang “huwag” ang likas at mariing anyo ng pagbabawal sa modernong Filipino.
- source_word: תִּנְאָף
  choice: kang mangangalunya
  rationale: Ang pandiwa ay Qal imperfect, ikalawang panauhang panlalaking isahan, at dito ay may puwersa ng pagbabawal. Ang “mangangalunya” ay tuwiran, tiyak, at karaniwang katumbas ng seksuwal na paglabag na tinutukoy ng נאף.
theological_decisions:
- issue: Pagpapahayag sa ikalawang panauhang panlalaking isahan na pagbabawal sa batas ng tipan
  choice: At huwag kang mangangalunya.
  alternative: Huwag kang mangangalunya.
  rationale: Ang “kang” ay nagpapanatili sa tuwirang isahang pakikipag-usap, bagaman hindi likas na ipinahahayag sa Filipino ang kasariang panlalaki ng kausap. Pinananatili ang “At” dahil nasa Hebreo ang pang-ugnay at bahagi ito ng sunod-sunod na estilo ng mga utos; hindi nito binabago ang saklaw o diwa ng pagbabawal.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at madaling maunawaan. Ginamit ang karaniwang pormula ng pagbabawal na “huwag kang,” habang pinanatili ang Hebreong pang-ugnay na “At.”
