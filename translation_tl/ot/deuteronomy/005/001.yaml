  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: tl
  text: Tinawag ni Moises ang buong Israel at sinabi sa kanila, “Makinig ka, Israel, sa mga tuntunin at mga kahatulan na sinasabi ko sa inyong pandinig ngayon. Pag-aralan ninyo ang mga ito at ingatan ninyo ang mga ito upang isagawa ninyo ang mga ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Tinawag
  rationale: Likas na katumbas ng pandiwang קרא sa salaysay at hindi labis na nagtatakda na isa itong pormal na pagpupulong.
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili ang kolektibong pagtukoy sa sambayanan bilang isang kabuuan.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Makinig ka, Israel
  rationale: Ang isahang pautos ay tumutukoy sa Israel bilang isang sambayanan. Ang “makinig” ay natural sa makabagong Filipino at nagpapahiwatig ng masusing pakikinig, hindi lamang pagkarinig.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Ipinapahayag ang mga itinakdang batas o probisyon sa malinaw ngunit marangal na wikang Filipino.
- source_word: הַמִּשְׁפָּטִים
  choice: mga kahatulan
  rationale: Pinananatili ang pagkakaiba nito sa חֻקִּים at ang legal o hudisyal na himig ng salita.
- source_word: דֹּבֵר
  choice: sinasabi ko
  rationale: Sinasalamin ang nagpapatuloy na kilos ng participle sa kasalukuyang pahayag ni Moises.
- source_word: בְּאָזְנֵיכֶם
  choice: sa inyong pandinig
  rationale: Natural na inililipat ang Hebreong idyomang literal na “sa inyong mga tainga” habang pinananatili ang diwa ng tuwirang naririnig na pahayag.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: Pag-aralan ninyo ang mga ito
  rationale: Sa konteksto, ang למד ay panawagang matutuhan at mapanghawakan ang mga batas; mas natural dito ang “pag-aralan” kaysa sa “matutuhan” bilang tuwirang utos.
- source_word: וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: ingatan upang tuparin
  rationale: Ang שׁמר ay pinananatiling “ingatan,” samantalang ang עשׂה ay ipinapahayag na aktuwal na pagtupad. Nililinaw ng “upang” ang layunin nang hindi inaalis ang ugnayan ng dalawang kilos.
theological_decisions:
- issue: Pagpapanatiling magkaiba ang חֻקִּים at מִשְׁפָּטִים
  choice: mga tuntunin at mga kahatulan
  alternative: mga batas at mga alituntunin
  rationale: Ang dalawang magkaugnay ngunit magkaibang katawagang legal ay hindi pinagsama sa isang pangkalahatang salita. Pinananatili ng “kahatulan” ang hudisyal na kulay ng מִשְׁפָּטִים.
- issue: Lakas ng utos na שְׁמַע
  choice: Makinig ka, Israel
  alternative: Dinggin mo, Israel
  rationale: Ang “makinig” ay malinaw at kasalukuyang Filipino, at maaaring maglaman ng masusing pagtanggap na humahantong sa pagsunod. Hindi tahasang idinagdag ang “sumunod” dahil ang kasunod na mga utos na mag-aral, mag-ingat, at tumupad ang nagpapahayag nito.
- issue: Ugnayan ng pag-iingat at paggawa sa וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: ingatan upang tuparin
  alternative: sundin at isagawa
  rationale: Pinananatili ang larawan ng maingat na pag-iingat sa שׁמר at ang layunin o bunga ng aktuwal na paggawa sa infinitibong לַעֲשֹׂתָם, nang hindi inuulit nang mabigat ang “mga ito.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “ka” sa tuwirang utos sa Israel bilang kolektibong sambayanan, kasabay ng maramihang “ninyo” sa mga pandiwang tumutukoy sa mga kasapi nito, gaya ng pagbabago ng bilang sa Hebreo. Iniwasan ang salitang sobrang teknikal, ngunit pinanatili ang legal at tipanang himig.
