    rationale: Ang למד ay panawagang matutuhan o maisapuso ang mga kautusan; ang “pag-aralan” ay katanggap-tanggap, ngunit maaaring tumuon sa proseso ng pag-aaral. Hindi ito sapat na dahilan upang baguhin kung malinaw ang natitirang pangungusap.
