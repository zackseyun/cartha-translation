  source_fidelity: Malapit ang salin sa Hebreo at napananatili ang kolektibong pagtawag sa Israel, ang kasalukuyang kilos ng pagsasalita, at ang magkahiwalay na legal na katawagan. Gayunman, nawawala sa huling sugnay ang malinaw na layon ng “ingatan” at “tuparin,” samantalang ang Hebreo ay kapwa tumutukoy sa mga tuntunin at kahatulan.
  naturalness: Natural ang karamihan ng pananalita at ang isahang utos sa kolektibong “Israel” ay katanggap-tanggap. Mas malinaw at higit na kumpleto sa modernong Filipino ang pagbanggit muli sa “mga ito” sa huling sugnay.
  terminology: Ang “mga tuntunin at mga kahatulan” ay nagpapanatili ng pagkakaiba ng חֻקִּים at מִשְׁפָּטִים. Bagaman mas mataas ang rehistro ng “mga kahatulan,” katanggap-tanggap ito sa legal at pangkasulatang konteksto.
