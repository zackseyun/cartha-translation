source:
  edition: WLC
  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: tl
  text: Ngunit ang ikapitong araw ay Sabbath para kay Yahweh na iyong Diyos. Huwag kang gagawa ng anumang gawain—ikaw, ang iyong anak na lalaki o anak na babae, ang iyong aliping lalaki o aliping babae, ang iyong baka o asno, alinman sa iyong mga alagang hayop, o ang dayuhang naninirahan[a] sa loob ng iyong mga pintuang-bayan[b]—upang makapagpahinga ang iyong aliping lalaki at aliping babae gaya mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “residenteng dayuhan.” Ang Hebreong גֵּר ay tumutukoy sa isang hindi katutubong taong naninirahan sa loob ng komunidad.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa loob ng iyong mga pintuang-bayan,” isang idyoma para sa loob ng iyong bayan o komunidad.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבָּת
  choice: Sabbath
  rationale: Pinananatili ang kinikilalang pangalan ng tiyak na banal na araw ng tipan, hindi lamang ang pangkalahatang diwa ng pamamahinga.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Likas sa Tagalog at ipinahahayag ang pag-aalay o pagkatalaga ng araw kay Yahweh.
- source_word: מְלָאכָה
  choice: gawain
  rationale: Malawak at natural na katawagan para sa gawaing ipinagbabawal sa batas ng Sabbath nang hindi labis na nililimitahan ang saklaw.
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: iyong aliping lalaki / iyong aliping babae
  rationale: Ipinakikita ang nakagapos na katayuang panlipunan at ang tahasang pagkakaiba ng kasarian sa Hebreo.
- source_word: שׁוֹר
  choice: baka
  rationale: Mas natural sa modernong Tagalog kaysa 'barakong baka' o 'baka para sa araro'; sapat ang konteksto upang tumukoy sa domestikadong bovine.
- source_word: חֲמוֹר
  choice: asno
  rationale: Karaniwan at dignified na terminong biblikal sa Tagalog para sa donkey.
- source_word: בְּהֵמָה
  choice: mga alagang hayop
  rationale: Sa konteksto, tumutukoy ito sa mga domestikadong hayop ng sambahayan; mas malinaw ito sa ordinaryong mambabasa kaysa sa pangkalahatang 'hayop'.
- source_word: גֵּר
  choice: dayuhang naninirahan
  rationale: Ipinahahayag na ito ay isang hindi katutubong taong naninirahan sa komunidad, hindi lamang isang nagdaraang manlalakbay.
- source_word: בִּשְׁעָרֶיךָ
  choice: sa loob ng iyong mga pintuang-bayan
  rationale: Pinananatili ang larawan at legal-lokal na idyoma ng Hebreo, na nililinaw sa talababa.
- source_word: לְמַעַן יָנוּחַ
  choice: upang makapagpahinga
  rationale: Malinaw na ipinapahayag ang layunin ng utos at ang aktuwal na pahingang ipinagkakaloob.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Direktang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Katayuan ng עבד at אמה
  choice: aliping lalaki / aliping babae
  alternative: lingkod na lalaki / lingkod na babae
  rationale: Mahalaga sa batas na ang pahinga ay umaabot sa mga nakagapos na miyembro ng sambahayan; ang 'alipin' ang higit na tapat sa panlipunang katayuang ipinahihiwatig ng mga salita.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang isahang ikalawang panauhan upang sundan ang Hebreong utos. Pinanatili ang 'Sabbath' bilang pangalan ng institusyong tipan at ang 'mga pintuang-bayan' bilang larawang Hebreo, na may paliwanag sa talababa.
