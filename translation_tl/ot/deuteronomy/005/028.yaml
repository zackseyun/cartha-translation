  source_fidelity: 'Tumpak ang pangunahing daloy ng talata: narinig ni Yahweh ang pagsasalita ng bayan, at sinabi niya kay Moises na narinig niya ang sinabi ng bayan. Gayunman, ang “Mabuti ang lahat ng sinabi nila” ay inililipat ang pokus ng Hebreong הֵיטִיבוּ mula sa positibong pagtataya sa kanilang pagsasalita/pagkilos tungo sa simpleng katangiang “mabuti” ng mga salita. Ang “Mahusay silang nagsalita sa lahat ng kanilang sinabi” ay mas malapit sa agarang konteksto ng pandiwa ng pagsasalita at sa English audit trail, samantalang pinananatili ng talababa ang mas malawak na posibleng diwa na “mabuti ang ginawa nila.”'
  naturalness: Natural, malinaw, at marangal ang Tagalog. Ang “bayang ito,” “nang magsalita kayo sa akin,” at ang paggamit ng “Yahweh” ay angkop sa modernong Filipino Tagalog. Ang rebisyon sa pangwakas na pahayag ay mas idiomatiko rin bilang pagtaya sa pagsasalita ng bayan.
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה. Ang “bayang ito” ay angkop para sa הָעָם הַזֶּה. Ang talababa a ay maayos na nagpapaliwanag ng Hebreong idyomang “tinig/tunog ng mga salita.”
