  to: At narinig ni Yahweh ang sinabi ninyo nang magsalita kayo sa akin,[a] at sinabi ni Yahweh sa akin, “Narinig ko ang sinabi sa iyo ng bayang ito. Mahusay silang nagsalita sa lahat ng kanilang sinabi.”[b]
  rationale: Binago ang huling pangungusap upang ipakita ang positibong pagtataya ng הֵיטִיבוּ sa paraan ng pagsasalita ng bayan, na siyang pinakamalapit na diwa sa konteksto. Ang alternatibong mas malawak na “mabuti ang ginawa nila” ay nananatili sa talababa upang hindi piliting lutasin ang saklaw ng pandiwa.
