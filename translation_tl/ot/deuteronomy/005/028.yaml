base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: tl
  text: At narinig ni Yahweh ang sinabi ninyo nang magsalita kayo sa akin,[a] at sinabi ni Yahweh sa akin, “Narinig ko ang sinabi sa iyo ng bayang ito. Mahusay silang nagsalita sa lahat ng kanilang sinabi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang tinig [o tunog] ng inyong mga salita”; isang idyomang Hebreo na nagbibigay-diin sa narinig na pananalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Mabuti ang ginawa nila sa lahat ng sinabi nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na nasa tekstong Hebreo at iniiwasang palitan ito ng isang titulo.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: narinig / Narinig ko
  rationale: Karaniwang pandiwa ng pagdinig ang שׁמע rito; malinaw at natural ang anyong Tagalog sa salaysay at tuwirang pananalita.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: ang sinabi ninyo / ang sinabi
  rationale: Literal na ‘tinig/tunog ng mga salita,’ ngunit ang ‘ang sinabi’ ang natural na modernong Tagalog habang inilalagay sa talababa ang auditoryong idyoma.
- source_word: בְּדַבֶּרְכֶם אֵלָי
  choice: nang magsalita kayo sa akin
  rationale: Ipinahahayag ng בְּ + infinitive construct ang kasabay na pangyayari; natural itong isalin sa ‘nang.’
- source_word: הָעָם הַזֶּה
  choice: bayang ito
  rationale: Ang עָם ay tumutukoy sa sambayanan; ang ‘bayang ito’ ay maikli, dignified, at angkop sa konteksto.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: ang sinabi sa iyo
  rationale: Pinananatili ang tumutukoy na sugnay at ang ugnayan ng pananalita sa paraang hindi pilit sa Tagalog.
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: Mabuti ang lahat ng sinabi nila
  rationale: Ipinapahayag ang pagsang-ayon sa kabuuan ng sinabi nila nang hindi labis na nilulutas kung ang הֵיטִיבוּ ay ‘nagsalita nang mabuti’ o ‘gumawa nang mabuti.’
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah / ang PANGINOON
  rationale: Nasa Hebreo ang Tetragrammaton bilang sariling pangalan; pinananatili itong transliterasyon nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
- issue: Saklaw ng pagsang-ayon ng Diyos sa sinabi ng bayan
  choice: Mabuti ang lahat ng sinabi nila
  alternative: Nagsalita sila nang mabuti sa lahat ng sinabi nila
  rationale: Pinananatili ang komprehensibong כָּל at ang positibong hatol ng הֵיטִיבוּ, ngunit hindi dinaragdagan ang teksto ng paliwanag kung bakit tama ang sinabi nila.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘ninyo/kayo’ para sa maramihang kausap at ang ‘bayang ito’ para sa kolektibong עָם. Inilipat sa talababa ang literal na auditoryong idyoma upang manatiling natural ang pangunahing teksto.
