- from: Kung taglay sana nila palagi ang ganitong puso[a]—ang matakot sa akin at tuparin ang lahat ng utos ko habang sila'y nabubuhay—upang mapabuti sila at ang kanilang mga anak magpakailanman!
  to: Kung sana'y magkaroon sila ng ganitong puso[a]—na matakot sa akin at tuparin ang lahat ng utos ko habang sila'y nabubuhay—upang maging mabuti ang kalagayan nila at ng kanilang mga anak magpakailanman!
  rationale: Inayos ang optatibong pambungad upang maging mas likas sa Filipino, iniuugnay ang panghabambuhay na saklaw sa pagkatakot at pagtupad sa mga utos, at pinalitan ang posibleng maling diwa ng “mapabuti sila” ng pananalitang malinaw na tumutukoy sa kanilang kapakanan. Napanatili ang lahat ng pangunahing elemento at ang footnote anchor.
