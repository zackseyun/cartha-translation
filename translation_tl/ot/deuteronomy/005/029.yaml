base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: tl
  text: Kung sana'y magkaroon sila ng ganitong puso[a]—na matakot sa akin at tuparin ang lahat ng utos ko habang sila'y nabubuhay—upang maging mabuti ang kalagayan nila at ng kanilang mga anak magpakailanman!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “O, kung magkaroon sana sila ng ganitong puso.” Ang pambungad sa Hebreo ay idyoma ng paghahangad; literal, “Sino ang magbibigay...?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Kung ... sana
  rationale: Idyoma ito ng matinding paghahangad, hindi literal na tanong na “Sino ang magbibigay?” Likas sa modernong Tagalog ang “kung ... sana” at pinananatili nito ang puwersang optatibo.
- source_word: וְהָיָה לְבָבָם זֶה לָהֶם
  choice: taglay nila palagi ang ganitong puso
  rationale: Ipinahahayag nito ang hangaring manatili sa kanila ang uri ng pusong tinutukoy. Ang “taglay” ay natural na paraan ng pagpapahayag ng pag-aari, at ang “ganitong puso” ay nagpapanatili sa kwalitatibong bisa ng demonstratibo.
- source_word: לְבָבָם
  choice: puso
  rationale: Ang Hebreong “puso” ay sumasaklaw sa kalooban, pag-iisip, at panloob na disposisyon. Pinananatili ng “puso” ang larawang biblikal nang hindi ito nililimitahan sa isip lamang.
- source_word: לְיִרְאָה אֹתִי
  choice: matakot sa akin
  rationale: Pinananatili nito ang pangunahing terminong tipan na tumutukoy sa takot na may paggalang, pagpipitagan, at pagsunod sa Diyos.
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: at tuparin ang lahat ng utos ko
  rationale: Sa konteksto ng mga utos, ang שׁמר ay mas natural na isinasalin sa Tagalog na “tuparin,” na nagpapahiwatig ng masunuring pagsasagawa, hindi lamang pag-iingat.
- source_word: כָּל הַיָּמִים
  choice: habang sila'y nabubuhay
  rationale: Literal na “lahat ng mga araw,” ngunit sa konteksto ay tumutukoy sa buong panahon ng kanilang buhay. Malinaw at natural ito sa kasalukuyang Tagalog.
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: upang mapabuti sila
  rationale: Ipinapahayag ng לְמַעַן ang layunin o bunga. Ang “mapabuti sila” ay nagpapanatili sa malawak na diwa ng kapakanan sa ilalim ng pagpapala nang hindi ito nililimitahan sa materyal na kasaganaan.
- source_word: וְלִבְנֵיהֶם
  choice: at ang kanilang mga anak
  rationale: Bagaman panlalaki ang anyong Hebreo, pangkalahatan itong tumutukoy sa mga supling sa kontekstong tipan.
- source_word: לְעֹלָם
  choice: magpakailanman
  rationale: Karaniwan at marangal na katumbas sa Tagalog na nagpapanatili sa pangmatagalang saklaw ng pahayag.
theological_decisions:
- issue: Antropolohikal na diwa ng לְבָבָם
  choice: puso
  alternative: isip; panloob na pagkatao
  rationale: Pinananatili ng “puso” ang biblikal na kategorya ng panloob na disposisyong moral at espirituwal, sa halip na paliitin ito sa gawaing pangkaisipan lamang.
- issue: Saklaw ng וְלִבְנֵיהֶם
  choice: kanilang mga anak
  alternative: kanilang mga anak na lalaki; kanilang mga inapo
  rationale: Sa kontekstong tipan, ang anyong panlalaki ay kumakatawan sa mga supling sa pangkalahatan. Ang “mga anak” ang pinakanatural at tumpak nang hindi nagpapakipot sa saklaw.
- issue: Kaugnayan ng takot at pagsunod
  choice: matakot sa akin at tuparin
  alternative: igalang ako at sundin
  rationale: Hindi pinapawi ang tensiyong teolohikal sa salitang “takot.” Pinananatili ito bilang wikang tipan, habang ipinakikita ng kasunod na pagtupad sa mga utos ang masunuring dimensiyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “kung ... sana” para sa likas na pahayag ng pananabik, “puso” upang mapanatili ang larawang biblikal, at “tuparin” bilang natural na pandiwa para sa masunuring pagsasagawa ng mga utos.
