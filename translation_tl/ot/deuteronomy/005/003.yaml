base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: tl
  text: Hindi sa ating mga ama[a] ginawa[b] ni Yahweh ang tipang ito, kundi sa atin[c]—sa atin mismo, tayong lahat na naririto ngayon at buháy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ating mga ninuno.” Literal sa Hebreo, “ating mga ama.”
    reason: lexical_alternative
  - marker: b
    text: Literal sa Hebreo, “pinutol ang tipang ito.”
    reason: lexical_alternative
  - marker: c
    text: 'Maaaring unawain ang pagsalungat bilang retorikal: hindi sa ating mga ama lamang, kundi lalo na sa atin mismo, tayong lahat na naririto ngayon at buháy.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית הַזֹּאת
  choice: ginawa ... ang tipang ito
  rationale: Ang כָּרַת בְּרִית ay idyomang Hebreo na literal na ‘pumutol ng tipan.’ Ang ‘ginawa ang tipang ito’ ang likas na katumbas sa modernong Tagalog at pinananatili ang demonstratibong הַזֹּאת (‘ito’).
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: אֲבֹתֵינוּ
  choice: ating mga ama
  rationale: Tuwirang pinananatili ang Hebreong ‘ating mga ama’; inilalagay sa talababa ang mas malawak na posibleng kahulugang ‘mga ninuno.’
- source_word: כִּי
  choice: kundi
  rationale: Pagkatapos ng pagtanggi, malinaw at likas na ipinahahayag ng ‘kundi’ ang mariing pagsalungat ng כִּי sa kontekstong ito.
- source_word: אִתָּנוּ אֲנַחְנוּ אֵלֶּה
  choice: sa atin—sa ating lahat
  rationale: Ang pag-uulit at gitling ay naghahatid ng mariing apposisyon ng Hebreo nang hindi nagiging pilit sa Tagalog.
- source_word: פֹה הַיּוֹם כֻּלָּנוּ חַיִּים
  choice: sa ating lahat na naririto at buháy ngayon
  rationale: Pinananatili ang kabuuan (‘lahat’), lugar (‘naririto’), kasalukuyang panahon (‘ngayon’), at kalagayang ‘buháy.’
theological_decisions:
- issue: Kung lubusang itinatanggi ng talata ang pakikipagtipan sa mga ninuno o mariing itinatampok lamang ang bisa nito sa kasalukuyang salinlahi
  choice: 'Pinanatili ang tahasang pagsalungat: ‘Hindi sa ating mga ama ... kundi sa atin.’'
  alternative: Maaaring unawain itong ‘hindi lamang sa ating mga ama, kundi lalo na sa atin.’
  rationale: Walang salitang ‘lamang’ sa Hebreo. Kaya hindi ito idinagdag sa pangunahing teksto; inilalahad sa talababa ang posibleng retorikal na pagkaunawa upang manatili ang tunay na tensiyong interpretatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘tipan’ bilang karaniwang terminong biblikal at pinanatili ang pangalang ‘Yahweh.’ Ang em dash ay naghahayag ng diin at apposisyon ng Hebreo.
