base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: tl
  text: Ito ang mga salitang sinabi ni Yahweh sa inyong buong kapulungan sa bundok, mula sa gitna ng apoy, ulap, at makapal na kadiliman, sa malakas na tinig; at wala na siyang idinagdag.[a] Isinulat niya ang mga iyon sa dalawang tapyas na bato at ibinigay sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “at hindi na siya nagpatuloy [sa pagsasalita].” Maaaring unawain ang pariralang Hebreo bilang “wala na siyang idinagdag” o “hindi na siya nagpatuloy.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: Ang mga salitang ito
  rationale: Pinananatili ng “mga salita” ang tuwirang diwa ng דְּבָרִים at ang ugnayan nito sa pampublikong pagsasalita, nang hindi agad binibigyang-kahulugang “mga utos.”
- source_word: כָּל קְהַלְכֶם
  choice: inyong buong kapulungan
  rationale: Ang קָהָל ay tumutukoy sa buong pamayanang nagkatipon; natural at marangal sa Filipino ang “buong kapulungan.”
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: mula sa gitna ng apoy, ulap, at makapal na kadiliman
  rationale: Ipinapakita ng “mula sa gitna” ang lakas ng מִתּוֹךְ, at tumpak na inilalarawan ng “makapal na kadiliman” ang עֲרָפֶל.
- source_word: קוֹל גָּדוֹל
  choice: sa malakas na tinig
  rationale: Natural itong salin ng literal na “malaking tinig/tunog” sa konteksto ng pagsasalita ni Yahweh.
- source_word: וְלֹא יָסָף
  choice: at wala na siyang idinagdag
  rationale: Ang parirala ay maaaring mangahulugang wala nang idinagdag sa mga salitang binigkas; pinananatili sa talababa ang posibleng diwang hindi na siya nagpatuloy sa pagsasalita.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: dalawang tapyas na bato
  rationale: Malinaw sa karaniwang Filipino at iniiwasan ang makabagong teknolohikal na dating ng salitang “tablet.”
- source_word: וַיִּתְּנֵם אֵלָי
  choice: at ibinigay sa akin
  rationale: Pinananatili ang maayos na pagpapatuloy ng salaysay at malinaw na si Yahweh pa rin ang gumagawa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at iniiwasang palitan ito ng titulo o ng tradisyong denominasyonal.
- issue: Kahulugan ng וְלֹא יָסָף
  choice: wala na siyang idinagdag
  alternative: hindi na siya nagpatuloy [sa pagsasalita]; hindi ito tumigil
  rationale: Pinakamalapit sa konteksto ang diwang wala nang idinagdag sa kapahayagang ito, ngunit hindi ganap na isinasara ng Hebreo ang ibang pagkaunawa; kaya inilalahad sa talababa ang pangunahing alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan,” “makapal na kadiliman,” at “tapyas na bato” upang maging natural sa ordinaryong mambabasa habang pinananatili ang solemnidad at larawan ng tekstong Hebreo.
