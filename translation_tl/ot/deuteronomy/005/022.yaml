    issue: Medyo di-natural na pasibong panimula
    rationale: Ang “Ang mga salitang ito ay sinabi ni Yahweh” ay nauunawaan, ngunit ang “Ito ang mga salitang sinabi ni Yahweh” ay mas likas sa modernong Filipino at pinananatili ang binigyang-diin na panimulang parirala ng Hebreo.
