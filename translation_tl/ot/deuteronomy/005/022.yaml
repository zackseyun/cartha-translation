revisions:
- from: Ang mga salitang ito ay sinabi ni Yahweh sa inyong buong kapulungan sa bundok, mula sa gitna ng apoy, ulap, at makapal na kadiliman, sa malakas na tinig; at wala na siyang idinagdag.[a] Isinulat niya ang mga iyon sa dalawang tapyas na bato at ibinigay sa akin.
  to: Ito ang mga salitang sinabi ni Yahweh sa inyong buong kapulungan sa bundok, mula sa gitna ng apoy, ulap, at makapal na kadiliman, sa malakas na tinig; at wala na siyang idinagdag.[a] Isinulat niya ang mga iyon sa dalawang tapyas na bato at ibinigay sa akin.
  rationale: Inayos lamang ang panimulang ayos ng pangungusap upang maging higit na natural sa modernong Filipino. Hindi binago ang diwa ng teksto, ang pangunahing pagbasa ng pinagtatalunang pariralang Hebreo, o ang sinadyang di-pagtukoy nang lampas sa teksto sa huling mga panghalip.
