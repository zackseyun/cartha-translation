  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: tl
  text: At alalahanin mo na ikaw ay alipin sa lupain ng Ehipto, at inilabas ka roon ni Yahweh na iyong Diyos sa pamamagitan ng malakas na kamay[a] at nakaunat na bisig. Kaya iniutos sa iyo ni Yahweh na iyong Diyos na ipangilin ang araw ng Sabbath.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makapangyarihang kamay.” Idinidiin ng idyomang Hebreo ang makapangyarihang pagliligtas ni Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Literal na “gawin ang araw ng Sabbath”; ang idyomang Hebreo ay nangangahulugang tuparin o sundin ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: At alalahanin mo
  rationale: Pinananatili ang ugnayan sa naunang utos at ang puwersang pautos ng anyong Hebreo, habang natural sa modernong Tagalog.
- source_word: עֶבֶד
  choice: alipin
  rationale: Tuwirang ipinapahayag ang sapilitang kalagayan ng Israel sa Ehipto, na siyang mahalagang batayan ng utos tungkol sa Sabbath.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang kongkretong anyo ng pariralang Hebreo nang hindi nagiging di-natural sa Tagalog.
- source_word: וַיֹּצִאֲךָ
  choice: inilabas ka roon
  rationale: Likas na salin ng Hiphil ng יצא at malinaw na tumutukoy sa pagliligtas mula sa Ehipto.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Pinananatili ang banal na pangalan at ang personal na ugnayang tipan na ipinahihiwatig ng ikalawang panauhang hulapi.
- source_word: בְּיָד חֲזָקָה
  choice: sa pamamagitan ng malakas na kamay
  rationale: Malapit sa literal na kahulugan ng חֲזָקָה at pinananatili ang larawang Hebreo ng makapangyarihang pagliligtas ng Diyos.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: at nakaunat na bisig
  rationale: Pinananatili ang karaniwang larawang Hebreo para sa hayag na paggamit ng kapangyarihan ng Diyos.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Malinaw at natural na ipinapakita ang lohikal na ugnayan ng paglaya mula sa pagkaalipin at ng utos tungkol sa Sabbath.
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַׁבָּת
  choice: ipangilin ang araw ng Sabbath
  rationale: Ang literal na 'gawin ang araw ng Sabbath' ay hindi likas sa Tagalog; ipinahahayag ng 'ipangilin' ang idyomatikong diwang tuparin o sundin ang Sabbath bilang itinakdang banal na araw.
theological_decisions:
- issue: Paglalarawan sa kalagayan ng Israel sa Ehipto
  choice: alipin
  alternative: lingkod
  rationale: Ang konteksto ay sapilitang pagkaalipin at pagliligtas, kaya mas tumpak ang 'alipin' kaysa sa mas malawak at maaaring kusang 'lingkod'.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng לַעֲשׂוֹת kaugnay ng Sabbath
  choice: ipangilin
  alternative: literal na 'gawin'
  rationale: Pinananatili ang praktikal na puwersa ng utos nang hindi ipinapalagay ang isang makitid na denominasyonal na paliwanag; ang literal na 'gawin ang araw' ay malabo at di-idiomatiko sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang isahang 'mo/ka/iyo' upang katawanin ang ikalawang panauhang panlalaki na isahan sa Hebreo. Pinanatili ang mga kongkretong larawang 'kamay' at 'bisig,' at ginamit ang karaniwang salitang 'Sabbath' upang hindi labis na ipaliwanag ang termino sa mismong teksto.
