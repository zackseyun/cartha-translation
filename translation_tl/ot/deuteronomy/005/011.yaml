base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: tl
  text: Huwag mong gamitin ang pangalan ni Yahweh, na iyong Diyos, sa walang kabuluhan[a], sapagkat hindi pawawalang-sala[b] ni Yahweh ang sinumang gumagamit ng pangalan ni Yahweh sa walang kabuluhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa kabulaanan,” “sa maling paraan,” o “nang walang saysay.” Maaaring saklawin ng Hebreo ang huwad o hungkag na paggamit ng pangalan ni Yahweh, hindi lamang ang isang tiyak na uri ng maling paggamit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi ituturing na walang sala” o “hindi hahayaang hindi maparusahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: gamitin
  rationale: Ang pandiwa ay literal na maaaring mangahulugang “buhatin,” “dalhin,” o “taglayin.” Sa pariralang ito, ang “gamitin” ay natural sa modernong Tagalog at sapat na malawak upang hindi ikulong ang utos sa pagbanggit lamang o sa panunumpa lamang.
- source_word: שֵׁם
  choice: pangalan
  rationale: Tuwirang salin na nagpapanatili sa salitang Hebreo; maaari itong magpahiwatig ng reputasyon, awtoridad, o ipinakikilalang pagkakakilanlan nang hindi iyon ipinapasok bilang paliwanag sa pangunahing teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang tuwirang ikalawang panauhang isahan at ang ugnayang tipan sa kausap.
- source_word: לַשָּׁוְא
  choice: sa walang kabuluhan
  rationale: Natural na idyomang Tagalog na nagpapanatili sa lawak ng שָׁוְא, na maaaring tumukoy sa kawalang-kabuluhan, kabulaanan, o maling paggamit.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pagbabawal sa isang marangal ngunit kasalukuyang rehistro.
- source_word: יְנַקֶּה (נקה)
  choice: hindi pawawalang-sala
  rationale: 'Ipinahahayag ang hudisyal na diwa ng anyong piel: hindi ituturing na malaya sa sala o hindi aabsuweltuhin.'
- source_word: אֲשֶׁר
  choice: ang sinumang
  rationale: Natural na pangkalahatang pagtukoy sa bawat lumalabag, nang walang makalumang pananalita.
- source_word: שְׁמוֹ
  choice: kanyang pangalan
  rationale: Malinaw na ibinabalik ang panghalip sa sariling pangalan ni Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang ipinahayag sa Israel sa halip na palitan ito ng titulo.
- issue: Saklaw ng ipinagbabawal na paggamit sa pangalan
  choice: gamitin ang pangalan ... sa walang kabuluhan
  alternative: banggitin ang pangalan nang walang kabuluhan; taglayin ang pangalan para sa kabulaanan; gamitin sa kasinungalingan
  rationale: Maaaring saklawin ng Hebreo ang huwad na panunumpa, hungkag na pagtawag sa pangalan, at mas malawak na maling paggamit o pagdadala ng banal na pangalan. Hindi nililimitahan ng pangunahing salin ang utos sa isa lamang sa mga ito.
- issue: Diwa ng kaparusahan sa יְנַקֶּה
  choice: hindi pawawalang-sala
  alternative: hindi ituturing na walang sala; hindi hahayaang hindi maparusahan
  rationale: Pinananatili ang wikang hudisyal at ang ugnayan ng sala at kaparusahan nang hindi tinutukoy ang eksaktong anyo ng parusa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang isahang “mong/iyong” upang panatilihin ang gramatikal na bilang ng Hebreo. Iniwasan ang “banggitin” sa pangunahing teksto dahil maaari nitong paliitin ang utos sa pagsasalita lamang.
