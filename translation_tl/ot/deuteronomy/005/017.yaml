  text: You shall not murder[a].
translation:
  language: tl
  text: Huwag kang papaslang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na salin, “Huwag kang papatay.” Ang pandiwang Hebreo rito ay mas tiyak na tumutukoy sa pagpaslang o labag-sa-matuwid na pagkitil ng buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Huwag
  rationale: Ang לֹא kasama ng di-ganap na anyong pandiwa ay nagpapahayag dito ng tuwirang pagbabawal. Ang “Huwag” ang pinakanatural at malinaw na anyo ng ganitong utos sa modernong Tagalog.
- source_word: תִּרְצָח
  choice: papaslang
  rationale: Ang רָצַח ay tumutukoy lalo na sa pagkitil ng buhay ng tao na labag sa batas o matuwid na pamantayan, hindi sa lahat ng uri ng pagpatay. Ang “papaslang” ay maikli, marangal, at mas tiyak kaysa sa malawak na “papatay.”
theological_decisions:
- issue: Saklaw ng pagbabawal sa ikaanim na utos
  choice: Ang utos ay nagbabawal sa pagpaslang o labag-sa-matuwid na pagkitil ng buhay.
  alternative: Huwag kang papatay.
  rationale: Ginamit sa Hebreo ang רָצַח, hindi ang mas malawak na pandiwa para sa pagpatay. Kaya pinananatili ng “papaslang” ang moral at legal na katiyakan ng utos nang hindi ito ginagawang tahasang pagbabawal sa bawat uri ng pagkitil ng buhay.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, madaling maunawaan, at may marangal na himig. Ginamit ang “kang” upang maging natural ang tuwirang pagbabawal; iniwasan ang legalistikong pariralang “huwag kang gumawa ng pagpatay.”
