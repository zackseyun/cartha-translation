  terminology: Ang “Yahweh,” “salita ni Yahweh,” “ipahayag,” at “umakyat sa bundok” ay angkop at pare-pareho. Ang footnote ay maaaring gumamit ng mas karaniwang modernong baybay na “presensya.”
