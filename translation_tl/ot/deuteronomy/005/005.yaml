  text: אָ֠נֹכִי עֹמֵ֨ד בֵּין יְהוָ֤ה וּ/בֵֽינֵי/כֶם֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/הַגִּ֥יד לָ/כֶ֖ם אֶת דְּבַ֣ר יְהוָ֑ה כִּ֤י יְרֵאתֶם֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ וְ/לֹֽא עֲלִיתֶ֥ם בָּ/הָ֖ר לֵ/אמֹֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: tl
  text: 'Noon ay nakatayo ako sa pagitan ni Yahweh at ninyo upang ipahayag sa inyo ang salita ni Yahweh, sapagkat natakot kayo dahil sa apoy[a] at hindi kayo umakyat sa bundok, na ganito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa harap/presensya ng apoy,” isang idyomang nangangahulugang “dahil sa apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֠נֹכִי עֹמֵד
  choice: Ako ay nakatayo noon
  rationale: Ang tahasang panghalip at Qal participle ay nagbibigay-diin kay Moises at naglalarawan sa patuloy niyang kalagayan bilang tagapamagitan sa nakaraang pangyayari.
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: sa pagitan ni Yahweh at ninyo
  rationale: Tuwirang pinananatili ang ugnayang namamagitan sa dalawang panig at ang pangalang tipan na Yahweh.
- source_word: בָּעֵת הַהִוא
  choice: noon
  rationale: Likas at malinaw na salin sa modernong Tagalog para sa pagtukoy sa panahong iyon; isinama sa pandiwang parirala upang maiwasan ang mabigat na pag-uulit.
- source_word: לְהַגִּיד לָכֶם אֶת דְּבַר יְהוָה
  choice: upang ipahayag sa inyo ang salita ni Yahweh
  rationale: Ang “ipahayag” ay angkop sa Hiphil na anyo at sa marangal na konteksto ng paghahatid ng banal na salita.
- source_word: כִּי יְרֵאתֶם מִפְּנֵי הָאֵשׁ
  choice: sapagkat natakot kayo dahil sa apoy
  rationale: 'Pinananatili ang sanhi: ang apoy ang dahilan ng takot ng bayan. Isinasalin nang idiomatiko ang מִפְּנֵי.'
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: at hindi kayo umakyat sa bundok
  rationale: Natural na Tagalog na nagpapanatili sa direksiyonal na diwa ng עלה.
- source_word: לֵאמֹר
  choice: na sinasabi,
  rationale: Pinananatili ang pormulang Hebreo na nag-uugnay sa susunod na banal na pahayag, kahit may sintaktikong tensiyon tungkol sa di-tahasang nagsasalita.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal at tipanang pangalan nang hindi pinapalitan ng titulo.
- issue: Di-tahasang simuno ng לֵאמֹר
  choice: na sinasabi,
  alternative: 'at sinabi niya; gaya ng sumusunod:'
  rationale: Hindi tahasang binabanggit ng Hebreo ang simuno. Ang literal na pang-ugnay ay nagpapanatili sa ambiguwidad at nagbubukas sa pahayag sa kasunod na talata nang hindi nagdaragdag ng “si Yahweh” o “si Moises.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ninyo/kayo” para sa maramihang kausap at pinanatili ang kuwit sa hulihan sapagkat ang “na sinasabi” ay nagpapakilala sa pahayag sa kasunod na talata.
