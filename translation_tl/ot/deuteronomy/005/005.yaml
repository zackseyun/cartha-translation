  source_fidelity: 'Tumpak ang pangunahing diwa: si Moises ay nasa pagitan ni Yahweh at ng bayan upang ihayag ang salita ni Yahweh, sapagkat natakot sila sa apoy at hindi umakyat sa bundok. Gayunman, ang pangwakas na “na sinasabi,” ay hindi angkop na pang-ugnay sa Tagalog at ang anyong pangkasalukuyan nito ay maaaring magmungkahi ng isang tahasang simuno na wala sa Hebreo. Ang “na ganito:” ay natural na nagpapakilala sa kasunod na pananalita nang hindi nilulutas ang di-tahasang simuno ng לֵאמֹר.'
