base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: tl
  text: Igalang mo ang iyong ama at ang iyong ina, gaya ng iniutos sa iyo ni Yahweh na iyong Diyos, upang humaba ang iyong mga araw at upang maging mabuti ang kalagayan mo sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבֵּד
  choice: Igalang mo
  rationale: Ang Piel imperative ng כבד sa ugnayang pampamilya ay nag-uutos na kilalanin at pakitunguhan bilang marangal o mahalaga. Ang “Igalang mo” ay tumpak, likas, at malinaw sa modernong Tagalog.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: ang iyong ama at ang iyong ina
  rationale: Inuulit sa Hebreo ang pananda ng tuwirang layon bago ang bawat magulang. Pinananatili ng saling ito ang pantay na diin sa ama at ina.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: gaya ng iniutos sa iyo
  rationale: Ipinahihiwatig ng כַּאֲשֶׁר ang pagtutulad o pagsang-ayon sa nauna nang utos ng Diyos. Likas sa Tagalog ang “gaya ng iniutos sa iyo” at hindi nito dinaragdagan ang aspektong nasa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang pinananatili nito ang ikalawang panauhang isahan at ang ugnayang tipan na ipinahahayag ng parirala.
- source_word: לְמַעַן
  choice: upang
  rationale: Ang לְמַעַן ay nagpapahayag ng layunin o bunga. Ang “upang” ay maikli, marangal, at likas sa kontekstong ito.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: humaba ang iyong mga araw
  rationale: Pinananatili nito ang larawan at balangkas ng Hebreo, kung saan “ang iyong mga araw” ang paksa, sa halip na agad itong ipakahulugang “mabuhay ka nang matagal.”
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: at upang mapabuti ang kalagayan mo
  rationale: Ang idyomang ייטב לך ay tumutukoy sa pagiging mabuti ng kalagayan o sa kapakanan ng isang tao. Ang saling ito ay natural sa modernong Tagalog at hindi labis na nagpapakahulugan bilang materyal na kasaganaan lamang.
- source_word: עַל הָאֲדָמָה
  choice: sa lupaing
  rationale: Sa konteksto ng Deuteronomio, ang אֲדָמָה ay ang teritoryong ipinagkakaloob ng Diyos, hindi lamang lupa o soil. Ang “sa lupain” ang pinakanatural na Tagalog para sa paninirahan at pamumuhay roon.
- source_word: נֹתֵן לָךְ
  choice: ibinibigay sa iyo
  rationale: Pinananatili ng aspektong nagaganap ng “ibinibigay” ang participial na anyo ng נֹתֵן at ang katiyakan ng nagpapatuloy o nalalapit na kaloob ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng pangakong kaugnay ng paggalang sa mga magulang
  choice: Panatilihin ang pangako ng mahabang buhay at mabuting kalagayan sa lupaing ibinibigay ng Diyos nang hindi ito nililimitahan bilang ganap na garantiya sa bawat indibidwal o bilang pangakong pambansa lamang.
  alternative: Isang ganap na garantiya ng mahabang buhay sa bawat indibidwal; o isang pangakong para lamang sa bansa at walang indibidwal na bisa.
  rationale: Tunay na pangako sa konteksto ng tipan ang ipinahahayag ng Hebreo, ngunit hindi nilulutas ng talata mismo ang ugnayan ng indibidwal at sambayanan. Kaya pinananatili ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “iyong” upang mapanatili ang solemnidad at malinaw na ikalawang panauhang isahan; iniwasan ang sobrang literal o lipas na pananalita.
