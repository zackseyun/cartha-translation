base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/013.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: tl
  text: Anim na araw kang magtatrabaho at gagawin mo ang lahat ng gawain mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Anim na araw ay maaari kang magtrabaho at gawin ang lahat ng gawain mo.” Sa legal na kontekstong ito, ang Hebreong anyo ng pandiwa ay maaaring unawain bilang tagubilin o pahintulot.
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Anim na araw
  rationale: Likas na ipinahahayag sa Tagalog ang pariralang tagal bilang “anim na araw,” nang hindi na nagdaragdag ng tahasang pang-ukol.
- source_word: תַּעֲבֹד
  choice: kang magtatrabaho
  rationale: Ang עבד dito ay tumutukoy sa karaniwang paggawa. Pinananatili ng anyong ito ang lakas ng tagubilin sa kontekstong legal at inihihiwalay ito sa kasunod na עשה.
- source_word: וְעָשִׂיתָ
  choice: at gagawin mo
  rationale: Malawak ang saklaw ng עשה at natural itong nangangahulugang isagawa o gawin ang mga gawain; pinananatili rin nito ang pagkakaugnay ng dalawang pandiwa.
- source_word: כָּל
  choice: lahat ng
  rationale: Tuwirang ipinahahayag nito ang kabuuan ng gawaing tinutukoy.
- source_word: מְלַאכְתֶּךָ
  choice: gawain mo
  rationale: Ang מְלָאכָה ay tumutukoy sa trabaho, hanapbuhay, o gawaing isinasagawa. Ang “gawain mo” ay natural sa Tagalog at umiiwas sa paulit-ulit na “trabaho.”
theological_decisions:
- issue: Lakas ng mga pandiwa sa batas tungkol sa Sabbath
  choice: 'Gamitin ang anyong may lakas ng tagubilin: “magtatrabaho ... at gagawin mo.”'
  alternative: “maaari kang magtrabaho at gawin ang lahat ng gawain mo”
  rationale: Sa konteksto ng tipanang kautusan, maaaring unawain ang Hebreong imperfect bilang tagubilin, ngunit posible rin ang pahintulot. Inilalagay sa pangunahing teksto ang instructional force at itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “magtatrabaho” para sa ordinaryong paggawa at “gawain” para sa saklaw ng mga tungkulin, upang mapanatili ang pagkakaiba ng dalawang salitang Hebreo nang hindi nagiging hindi natural.
