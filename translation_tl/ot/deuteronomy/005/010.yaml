  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: tl
  text: ngunit nagpapakita ng tapat na pag-ibig sa libu-libo—sa mga umiibig sa akin at tumutupad sa mga utos niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mga utos ko” ang mababasa sa ilang manuskrito at salin, na umaayon sa unang panauhang pananalita sa nakapaligid na konteksto; “mga utos niya” naman ang mababasa sa tekstong Hebreo na ibinigay rito.
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: ngunit nagpapakita
  rationale: Ipinagpapatuloy ng pandiwaring participle ang paghahambing sa naunang talata. Likas sa Filipino ang “ngunit nagpapakita” upang maipahayag ang salungat na diwa sa konteksto at ang patuloy na pagkilos.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Saklaw ng חֶסֶד ang matatag at tapat na pag-ibig, lalo na sa loob ng isang tipan; higit itong naipapahayag ng “tapat na pag-ibig” kaysa ng “awa” lamang.
- source_word: לַאֲלָפִים
  choice: sa libu-libo
  rationale: Ang ibinigay na Hebreo ay nagsasabing “sa libu-libo” at walang tahasang pangngalang “salinlahi,” kaya hindi iyon idinagdag.
- source_word: לְאֹהֲבַי
  choice: sa mga umiibig sa akin
  rationale: Natural na isinasalin sa Filipino bilang sugnay na tumutukoy sa mga taong patuloy na umiibig sa nagsasalita.
- source_word: וּלְשֹׁמְרֵי
  choice: at tumutupad
  rationale: Sa kaugnayan ng mga utos, ang שמר ay nangangahulugang ingatan, sundin, o tuparin; “tumutupad” ang malinaw at likas na parirala sa Filipino.
- source_word: מצות/ו
  choice: sa mga utos niya
  rationale: Ang hulaping ikatlong panauhang panlalaki sa ibinigay na tekstong Hebreo ay nangangahulugang “niya/kaniya.” Isinalin ang anyong nasa source sa halip na tahimik na iayon sa unang panauhan ng nakapaligid na pananalita.
theological_decisions:
- issue: Panghalip sa pariralang tumutukoy sa mga utos
  choice: mga utos niya
  alternative: mga utos ko
  rationale: Ang ibinigay na anyong Hebreo na מצות/ו ay may hulaping ikatlong panauhang panlalaki (“niya”). Bagaman mas inaasahan sa agarang konteksto ang “mga utos ko,” pinanatili sa pangunahing teksto ang anyong ibinigay at inilagay sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tapat na pag-ibig” upang mapanatili ang relasyonal at tipanang bigat ng חֶסֶד. Hindi idinagdag ang “mga salinlahi,” sapagkat wala itong tahasang katumbas sa ibinigay na Hebreo.
