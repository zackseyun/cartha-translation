  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: tl
  text: Lumapit ka at pakinggan mo ang lahat ng sasabihin ng PANGINOON na ating Diyos, at sabihin mo sa amin ang lahat ng sasabihin sa iyo ng PANGINOON na ating Diyos; pakikinggan namin at isasagawa namin ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב אַתָּה
  choice: Lumapit ka
  rationale: Tuwirang utos kay Moises na siya ang lumapit sa presensiya ng Diyos; natural at malinaw ito sa modernong Tagalog.
- source_word: וּשֲׁמָע
  choice: at pakinggan mo
  rationale: Pinananatili ang aktibong diwa ng pakikinig sa lahat ng sasabihin ng Diyos.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang salin ng banal na pangalan sa malalaking titik, kaayon ng ibinigay na konsultasyong teksto.
- source_word: תְּדַבֵּר אֵלֵינוּ
  choice: sabihin mo sa amin
  rationale: Natural na Tagalog para sa paghahatid ni Moises ng mensahe sa bayan.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: pakikinggan namin iyon at gagawin
  rationale: Pinananatili ang dalawang magkaugnay na tugon—pakikinig at paggawa—nang hindi ginagawang pagpapakahulugang 'susunod kami' lamang.
theological_decisions:
- issue: Ang papel ni Moises bilang tagapamagitan
  choice: Pinanatili ang tahasang paglapit, pakikinig, at paghahatid ni Moises sa bayan.
  alternative: Isalin nang mas paliwanag bilang 'maging tagapamagitan ka namin.'
  rationale: Hindi tahasang ginagamit ng Hebreo ang terminong 'tagapamagitan'; mas mainam na panatilihin ang mga kilos na inilalarawan ng teksto.
- issue: Ugnayan ng pakikinig at pagsunod
  choice: “pakikinggan namin iyon at gagawin”
  alternative: “susundin namin iyon”
  rationale: Ang mas maikling alternatibo ay natural ngunit pinagsasama ang dalawang pandiwa; pinananatili ng napiling salin ang retorikal at teolohikal na diin ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “PANGINOON” para sa יהוה. Walang footnote dahil walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilahad para sa talatang ito.
