  naturalness: Marangal at madaling maunawaan ang rehistro. Mas natural at mas maayos ang magkatambal na “pakikinggan namin at isasagawa namin ito” kaysa “pakikinggan namin iyon at gagawin.”
  terminology: Ang “PANGINOON” para sa יהוה at “ating Diyos” para sa “aming Diyos” ay angkop at kaayon ng ibinigay na English audit trail. Walang kailangang footnote.
