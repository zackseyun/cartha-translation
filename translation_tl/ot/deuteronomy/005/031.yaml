id: DEU.5.31
reference: Deuteronomy 5:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: tl
  text: Ngunit ikaw, tumayo ka rito sa piling ko, at sasabihin ko sa iyo ang buong utos[a], ang mga tuntunin, at ang mga hatol na ituturo mo sa kanila, upang sundin nila ang mga iyon sa lupaing ibinibigay ko sa kanila upang angkinin nila[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, isahan ang salitang “utos” dito, at sinusundan ito ng maramihang “mga tuntunin” at “mga hatol.” Maaari ring isalin: “ang kabuuan ng utos.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “upang manahin nila” o “upang ariin nila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: tumayo ka rito sa piling ko
  rationale: Pinananatili ng “tumayo” ang kongkretong larawan ng עָמַד, samantalang likas at marangal sa Tagalog ang “sa piling ko” para sa עִמָּדִי at ipinahihiwatig ng konteksto ang pananatili ni Moises sa presensiya ng Diyos.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: at sasabihin ko sa iyo
  rationale: Ang cohortative kasunod ng pautos ay may hinaharap at kusang-loob na diwa; natural sa Tagalog ang “sasabihin ko sa iyo” para sa pagbibigay ng nilalaman ng tagubilin.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: ang buong utos
  rationale: Pinananatili ang isahang bilang ng מִצְוָה at ang kabuuang saklaw ng כָּל. Hindi ito ginawang maramihang “mga utos,” upang huwag alisin ang kolektibong anyo ng Hebreo.
- source_word: הַחֻקִּים
  choice: ang mga tuntunin
  rationale: Ang “mga tuntunin” ay malinaw sa modernong Tagalog at nagpapanatili ng legal at tipanang diwa ng חֻקִּים nang hindi ito ipinapantay sa kasunod na מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: ang mga hatol
  rationale: Pinananatili ng “mga hatol” ang kaugnayan ng מִשְׁפָּטִים sa paghatol, katarungan, at mga pasiyang legal.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: na ituturo mo sa kanila
  rationale: Ang anyong panghinaharap ay nagpapahayag ng atas kay Moises; tuwiran at natural itong naihahayag ng “ituturo mo sa kanila.”
- source_word: וְעָשׂוּ
  choice: upang sundin nila ang mga iyon
  rationale: Ipinakikita ng “upang” ang layunin o bunga ng pagtuturo. Sa konteksto ng mga utos at tuntunin, mas natural sa Tagalog ang “sundin” kaysa literal na “gawin,” habang nananatili ang diin sa aktuwal na pagsunod.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: na ibinibigay ko sa kanila
  rationale: Ang pangkasalukuyang aspektong “ibinibigay” ay tumutugma sa participle נֹתֵן at nagpapanatili sa buhay na paglalarawan ng pagkakaloob ng Diyos.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin nila
  rationale: Saklaw ng יָרַשׁ dito ang pagkuha at pagtataglay sa lupain. Maikli at natural ang “angkinin,” habang inilalahad sa talababa ang mga lehitimong alternatibo.
theological_decisions:
- issue: Ang tatluhang katawagang legal na מִצְוָה / חֻקִּים / מִשְׁפָּטִים
  choice: Panatilihin ang magkakaibang katawagang “utos,” “mga tuntunin,” at “mga hatol.”
  alternative: Pagsamahin bilang “mga batas at alituntunin.”
  rationale: Ang magkakahiwalay na katawagan ay nagpapanatili sa legal na kayarian at lawak ng tagubiling tipan nang hindi ipinapantay ang mga kategorya.
- issue: Ang isahang bilang ng מִצְוָה
  choice: “ang buong utos” sa isahan
  alternative: “ang lahat ng mga utos” o “ang buong kautusan”
  rationale: Isahan ang pangngalan sa Hebreo at maaaring kolektibo ang gamit nito. Pinananatili ng salin ang anyong ito at hindi tahimik na ginagawa itong maramihan.
- issue: Ang ugnayan ng pagtuturo at pagsunod sa וְעָשׂוּ
  choice: 'Ihayag bilang layunin o bunga: “upang sundin nila.”'
  alternative: “at susundin nila”
  rationale: Pinahihintulutan ng pagkakasunod ng mga sugnay ang layunin o bunga. Ang “upang” ay malinaw sa Tagalog ngunit hindi nagpapasok ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “sa piling ko” upang maging likas ang pahayag nang hindi inaalis ang kongkretong “tumayo.” Ang mga teknikal na katawagang legal ay pinanatiling magkakaiba ngunit madaling maunawaan. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinatalakay ng mga ito.
