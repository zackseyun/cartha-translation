  yaml_path: translation/ot/deuteronomy/005/030.yaml
  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: tl
  text: Humayo ka at sabihin mo sa kanila, ‘Bumalik kayo sa inyong mga tolda.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Tuwirang pautos ng הלך na nag-aatas kay Moises na umalis upang ihatid ang mensahe; ang “humayo” ay likas at marangal sa ganitong konteksto.
- source_word: אֱמֹר
  choice: sabihin mo
  rationale: Pautos ng אמר na nagpapakilala sa mensaheng ipahahayag; ang “sabihin mo” ay malinaw at natural sa modernong Filipino.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Ipinapakita ng pang-ukol at hulaping pangmaramihan ang mga taong tatanggap ng mensahe.
- source_word: שׁוּבוּ
  choice: Bumalik kayo
  rationale: Pautos na maramihan ng שוב; dito ay pinababalik ang bayan sa dati nilang kinaroroonan matapos ang pagpapakita ng Diyos.
- source_word: לָכֶם
  choice: sa inyong
  rationale: Kasama ng שוב, idiomatikong tumutukoy ito sa pagbabalik ng mga tao sa sarili nilang lugar; natural itong ipinahahayag sa Filipino sa pariralang “sa inyong mga tolda.”
- source_word: לְאָהֳלֵיכֶם
  choice: mga tolda
  rationale: Pinananatili ang kongkretong kahulugang “mga tolda” at ang makasaysayang tagpuan sa ilang, sa halip na gawing mas pangkalahatang “mga tahanan.”
