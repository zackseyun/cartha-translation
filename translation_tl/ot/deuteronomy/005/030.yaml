translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “humayo” bilang natural na utos sa pormal na salaysay, at “mga tolda” upang mapanatili ang kongkretong larawan ng Hebreo. Hindi isinama ang footnote ng English consultation layer dahil ang alternatibong “Go back to your tents” ay tumutukoy sa posibleng English phrasing, samantalang malinaw sa Hebreo na ang לֵךְ ay utos kay Moises at ang שׁוּבוּ ay utos sa bayan.
