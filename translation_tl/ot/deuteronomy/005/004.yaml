  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: tl
  text: Harap-harapan[a] kayong kinausap ni Yahweh sa bundok, mula sa gitna ng apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mukha sa mukha,” isang idyoma para sa tuwiran at personal na pakikipag-usap. Ihambing sa Deuteronomio 4:12, kung saan narinig ng Israel ang tinig ngunit walang nakitang anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: Harap-harapan
  rationale: Pinananatili nito ang matingkad na idyomang Hebreo at ang diwa ng tuwirang personal na pakikipag-usap, nang hindi ipinapakahulugang literal na nakita ng Israel ang anyo ng Diyos.
- source_word: דִּבֶּר ... עִמָּכֶם
  choice: kayong kinausap
  rationale: Likas sa modernong Tagalog ang pandiwang “kinausap” para sa Hebreong “nagsalita kasama/kasama ninyo,” at naipapahayag nito ang tuwirang pakikipag-usap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בָּהָר
  choice: sa bundok
  rationale: Natural na lokatibong salin sa Tagalog para sa tagpuan sa bundok.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mula sa gitna ng apoy
  rationale: Tumpak na pinananatili ang diwa ng pinagmulan mula sa loob o kalagitnaan ng apoy, hindi lamang “mula sa apoy.”
theological_decisions:
- issue: Ang antropomorpikong “harap-harapan” kaugnay ng pagpapakita sa Sinai
  choice: Panatilihin ang idyomang “harap-harapan” bilang paglalarawan ng tuwirang pakikipag-usap sa tipan.
  alternative: Isaling “nang tuwiran” o “nang personal” upang maiwasan ang pag-aakalang literal na nagkita ng mukha.
  rationale: Sinasabi ng mas malawak na konteksto na narinig ng Israel ang tinig ngunit walang nakitang anyo (Deuteronomio 4:12, 15). Pinananatili ng salin ang tunay na idyoma at tensiyong teolohikal nang hindi iginigiit ang literal na pagkakita.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “harap-harapan” upang maging malinaw at buhay ang idyoma; ang ayos na “kayong kinausap ni Yahweh” ay idiomatiko at nagpapanatili sa diin sa buong Israel bilang kausap.
