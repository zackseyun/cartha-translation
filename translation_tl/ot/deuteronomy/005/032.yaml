  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: tl
  text: Kaya tiyakin ninyong gawin ang mismong iniutos sa inyo ni Yahweh na inyong Diyos. Huwag kayong lumihis sa kanan o sa kaliwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pananalitang “huwag kayong lumihis sa kanan o sa kaliwa” ay isang idyomang Hebreo na nangangahulugang huwag lumayo sa anumang paraan sa iniutos ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: tiyakin ninyong gawin
  rationale: Sa konstruksiyong ito, ang שׁמר ay tumutukoy sa maingat na pagbibigay-pansin na humahantong sa pagsunod, samantalang ang infinitibong עשה ay nagsasaad ng pagsasagawa. Ang “tiyakin ninyong gawin” ay natural sa makabagong Filipino at nagpapanatili sa diin ng masusing pagsunod.
- source_word: כַּאֲשֶׁר
  choice: ang mismong
  rationale: Ipinahahayag nito ang ganap na pagsunod ayon sa iniutos. Sa kontekstong ito, natural na naihahatid ng “ang mismong iniutos” ang diwa ng ‘kung ano mismo ang iniutos’ nang hindi nagdaragdag ng bagong kahulugan.
- source_word: צִוָּה
  choice: iniutos
  rationale: Tinutukoy ng pandiwa ang natapos nang pagbibigay ng utos na patuloy na may bisa. Sapat itong ipinahahayag ng aspektong kontemplatibo sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Pinananatili nito ang pangmaramihang ikalawang panauhang hulapi at ang kaugnayang tipan na ipinahahayag ng pariralang ‘inyong Diyos.’
- source_word: לֹא תָסֻרוּ
  choice: Huwag kayong lumihis
  rationale: Ginagamit dito ang סור bilang larawan ng pag-alis sa itinakdang landas. Pinananatili ng “lumihis” ang larawang iyon at malinaw ang diwa ng paglabag sa utos.
- source_word: יָמִין וּשְׂמֹאל
  choice: sa kanan o sa kaliwa
  rationale: Pinananatili ang dalawang direksiyon sa idyomang Hebreo, na nangangahulugang hindi dapat lumayo sa utos sa alinmang paraan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng pagsunod sa utos
  choice: “ang mismong iniutos” at “huwag ... lumihis”
  alternative: Malayang pagpapakahulugang “lubusang sundin” lamang
  rationale: Pinananatili ng salin ang parehong positibong utos na gawin ang iniutos at ang negatibong larawang huwag lumihis, nang hindi pinapaliit o pinalalawak ang hinihinging pagsunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyong/kayong” ayon sa Hebreo. Ang “tiyakin ninyong gawin” ay pinili upang natural na maipahayag ang maingat at aktuwal na pagsunod; pinanatili naman ang larawang “sa kanan o sa kaliwa” at ipinaliwanag ito sa talababa.
