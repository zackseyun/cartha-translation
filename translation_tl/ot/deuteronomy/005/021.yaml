  text: וְ/לֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑/ךָ וְ/לֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗/ךָ שָׂדֵ֜/הוּ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: tl
  text: Huwag mong pagnasaan ang asawa ng iyong kapwa, at huwag mong naisin ang bahay ng iyong kapwa[a]—ang kaniyang bukid, aliping lalaki, aliping babae, baka, asno, o anumang pag-aari ng iyong kapwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay” ay maaari ring mangahulugang “sambahayan” o, sa mas malawak na diwa, kabuuang ari-arian.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: pagnasaan
  rationale: Ipinahihiwatig ng חמד ang maling pagnanasa sa pag-aari ng iba. Likas at may malinaw na bigat na etikal sa makabagong Tagalog ang “pagnasaan.”
- source_word: אֵשֶׁת רֵעֶךָ
  choice: asawa ng iyong kapwa
  rationale: Tuwirang inilalarawan ng pariralang konstrakto ang asawa ng kapwa; natural at malinaw ito sa Tagalog nang hindi nagdaragdag ng kahulugan.
- source_word: תִתְאַוֶּה
  choice: hangarin
  rationale: 'Pinananatili nitong magkaiba ang dalawang magkaugnay na pandiwa sa Hebreo: “pagnasaan” para sa חמד at “hangarin” para sa אוה.'
- source_word: בֵּית רֵעֶךָ
  choice: bahay ng iyong kapwa
  rationale: Maaaring tumukoy ang בַּיִת sa bahay o sambahayan, ngunit sa talaan ng mga pag-aari rito, ang “bahay” ang pinakaangkop na pangunahing salin.
- source_word: שָׂדֵהוּ
  choice: kaniyang bukid
  rationale: Tiyak na katumbas ng שָׂדֶה ang “bukid” sa kontekstong agrikultural at legal.
- source_word: עַבְדּוֹ
  choice: aliping lalaki
  rationale: Hayag nitong inilalahad ang nakagapos na katayuan ng עֶבֶד at pinananatili ang kaibahan ng kasarian sa kasunod na termino.
- source_word: אֲמָתוֹ
  choice: aliping babae
  rationale: Malinaw na ipinahahayag nito ang katayuan at kasarian ng אָמָה, kaakibat ng “aliping lalaki.”
- source_word: שׁוֹרוֹ
  choice: kaniyang baka
  rationale: Ang שׁוֹר ay bovine na hayop, kadalasang ginagamit sa paggawa. Mas madaling maunawaan sa karaniwang modernong Tagalog ang “baka” kaysa sa mas teknikal na “kapong baka.”
- source_word: חֲמֹרוֹ
  choice: kaniyang asno
  rationale: Karaniwan at tumpak na katawagan ang “asno” para sa חֲמוֹר.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: o anumang pag-aari ng iyong kapwa
  rationale: Natural nitong ipinahahayag sa Tagalog ang komprehensibong pangwakas na parirala at ang diwang pagmamay-ari.
- source_word: רֵעֶךָ
  choice: iyong kapwa
  rationale: Ang “kapwa” ay natural at malawak na terminong Tagalog para sa רֵעַ sa konteksto ng etika sa pakikitungo sa iba.
theological_decisions:
- issue: Pagkilala sa dalawang magkaibang pandiwa ng pagbabawal
  choice: Isalin ang חמד bilang “pagnasaan” at ang אוה bilang “hangarin.”
  alternative: Gamitin ang “pagnasaan” o “hangarin” para sa parehong pandiwa.
  rationale: Magkaugnay ngunit magkaiba ang dalawang pandiwa sa Hebreo. Pinananatili ng salin ang pagkakaibang iyon nang hindi ipinapalagay na may ganap na naiibang uri o antas ng kasalanan ang bawat isa.
- issue: Paglalarawan sa katayuan ng עֶבֶד at אָמָה
  choice: Gamitin ang “aliping lalaki” at “aliping babae.”
  alternative: Gamitin ang “lingkod na lalaki” at “lingkod na babae.”
  rationale: Nasa talaan ang mga taong ito kasama ng mga pag-aari ng sambahayan, kaya mahalagang huwag ikubli ang nakagapos na katayuang ipinahihiwatig ng mga salitang Hebreo.
- issue: Saklaw ng בַּיִת
  choice: Gamitin sa pangunahing teksto ang “bahay,” na may talababa tungkol sa posibleng mas malawak na diwa.
  alternative: Isalin bilang “sambahayan” o “ari-arian.”
  rationale: Pinapaboran ng kasunod na listahan ng bukid, mga alipin, at mga hayop ang diwa ng pag-aari, ngunit maaari pa ring taglayin ng בַּיִת ang mas malawak na kahulugang sambahayan o kabuuang ari-arian.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapwa” sa halip na “kapitbahay” upang hindi malimitahan ang utos sa taong nakatira sa malapit. Pinanatili ang dalawang magkaibang pandiwa ng Hebreo sa pamamagitan ng “pagnasaan” at “hangarin.”
