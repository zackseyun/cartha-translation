  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: tl
  text: “Ingatan mo ang araw ng Sabbath[a], upang panatilihin itong banal, gaya ng iniutos sa iyo ni Yahweh na iyong Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Panatilihin mo ang araw ng Sabbath” o “Bantayan mo ang araw ng Sabbath.” Idinidiin ng pandiwang Hebreo ang maingat na pagtupad.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Ingatan mong sundin
  rationale: Ang imperatibong diwa ay hindi lamang pag-alala kundi maingat at tapat na pagsunod. Likas sa modernong Tagalog ang pariralang ito at pinananatili nito ang pagkakaiba sa ‘Alalahanin’ ng Exodo 20:8.
- source_word: יוֹם הַשַׁבָּת
  choice: ang araw ng Sabbath
  rationale: Malinaw at natural na tumutukoy sa tiyak na araw; pinananatili ang kinikilalang terminong ‘Sabbath’ sa halip na gawing pangkalahatang ‘araw ng pahinga.’
- source_word: לְקַדְּשׁוֹ
  choice: upang ituring itong banal
  rationale: Ipinapahayag ng infinitive ang layuning ibukod at pakitunguhan ang araw bilang banal, nang hindi ipinahihiwatig na ang tao ang lumilikha ng likas na kabanalan nito.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Maikli at natural na nagpapakita ng pag-ayon sa naunang utos.
- source_word: צִוְּךָ
  choice: iniutos sa iyo
  rationale: Pinananatili ang awtoritatibong diwa ng צוה at ang ikalawang panauhang isahan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Natural na salin ng tipanang katawagan na may hulaping ikalawang panauhang isahan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili itong ‘Yahweh’ sa halip na palitan ng titulo.
- issue: Diwa ng pagpapabanal sa araw ng Sabbath
  choice: ituring itong banal
  alternative: gawin itong banal
  rationale: Pinananatili ang diwang ibukod at pakitunguhan ang araw bilang banal, habang iniiwasang ipasiya na tao ang sanhi ng kabanalan nito.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw sa karaniwang mambabasa. Ginamit ang ‘Ingatan mong sundin’ upang maipahayag ang maingat na pagsunod nang hindi tunog-luma; pinanatili ang ‘Sabbath’ at ‘Yahweh’ bilang mahahalagang katawagang tekstuwal.
