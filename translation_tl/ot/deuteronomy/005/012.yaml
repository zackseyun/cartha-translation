  terminology: Ang “Sabbath,” “Yahweh,” at “iyong Diyos” ay angkop at pare-pareho sa mga terminong tekstuwal. Pinananatili ang pagkakaiba ng pandiwang ito mula sa “Alalahanin” sa Exodo 20:8 nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
