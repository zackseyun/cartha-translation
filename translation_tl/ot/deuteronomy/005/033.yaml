base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: tl
  text: Lumakad kayo sa buong landas na iniutos sa inyo ni Yahweh na inyong Diyos, upang mabuhay kayo, maging mabuti ang kalagayan ninyo, at humaba ang inyong mga araw sa lupaing aangkinin ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mamanahin ninyo.” Maaaring mangahulugan ang pandiwang Hebreo ng pag-angkin o pagmamana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: sa buong landas
  rationale: Pinananatili ang isahang metapora ng isang landas ng pamumuhay at pagsunod, sa halip na gawing maramihang “mga paraan.”
- source_word: תֵּלֵכוּ
  choice: Lumakad kayo
  rationale: Pinananatili ng “lumakad” ang Hebreong metapora para sa asal at tapat na pamumuhay, hindi lamang ang pisikal na pagpunta.
- source_word: צִוָּה
  choice: iniutos sa inyo
  rationale: Likas sa Tagalog at malinaw na ang landas na dapat lakaran ay itinakda bilang utos para sa Israel.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh na inyong Diyos
  rationale: Pinananatili ang pangalang tipan na Yahweh at ang kaugnay na pahayag na siya ang kanilang Diyos.
- source_word: לְמַעַן תִּחְיוּן
  choice: upang mabuhay kayo
  rationale: Tuwirang ipinapahayag ang layunin o bunga ng pagsunod.
- source_word: וְטוֹב לָכֶם
  choice: maging mabuti ang kalagayan ninyo
  rationale: Likas na ipinahahayag sa Tagalog ang malawak na diwa ng kabutihan at kaginhawahan nang hindi ito nililimitahan sa materyal na kasaganaan.
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: at humaba ang inyong mga araw
  rationale: Pinananatili ang Hebreong idyoma ng pagpapahaba ng mga araw, na tumutukoy sa mahabang buhay.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Karaniwang salin ito ng wikang tumutukoy sa lupaing tipan sa Deuteronomio.
- source_word: תִּירָשׁוּן
  choice: aangkinin ninyo
  rationale: Saklaw ng “aangkinin” ang pagtanggap at pagmamay-ari sa lupain; inilalahad sa talababa ang posibleng diwa ng pagmamana.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang pinananatili ang natatanging pangalan ng Diyos na nasa tekstong Hebreo.
- issue: Diwa ng pag-aangkin sa lupain
  choice: lupaing aangkinin ninyo
  alternative: lupaing mamanahin ninyo
  rationale: Pinananatili ng “aangkinin” ang kongkretong diwa ng pagkuha at pagmamay-ari sa lupain, habang kinikilala sa talababa na maaari ring magpahiwatig ng pagmamana ang pandiwang Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang metapora ng paglakad sa isang landas at ang idyomang “humaba ang inyong mga araw” upang manatiling malapit sa tekstong Hebreo.
