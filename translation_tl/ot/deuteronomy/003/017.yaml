base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/017.yaml
  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: tl
  text: pati ang Araba, na ang Jordan ang hangganan nito, mula sa Kineret hanggang sa Dagat ng Araba, ang Dagat na Maalat[a], sa ibaba ng mga dalisdis ng Pisga sa gawing silangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang Patay na Dagat.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: ang Araba
  rationale: Ginamit bilang kinikilalang pangalang heograpiko para sa lambak ng Jordan, hindi bilang karaniwang pangngalang “kapatagan.”
- source_word: הַיַּרְדֵּן
  choice: ang Jordan
  rationale: Pinanatili ang karaniwang pangalan; malinaw sa konteksto na tumutukoy ito sa Ilog Jordan.
- source_word: גְבֻל
  choice: ang hangganan nito
  rationale: 'Nilinaw sa natural na Tagalog ang eliptikong ugnayan sa Hebreo: ang Jordan ang nagsisilbing hangganan ng nasabing lupain.'
- source_word: מִכִּנֶּרֶת
  choice: mula sa Kineret
  rationale: Isinalin bilang pangalan ng lugar nang hindi ipinapalagay kung ang mismong lawa o ang kalapit na pook ang tiyak na tinutukoy.
- source_word: יָם הָעֲרָבָה
  choice: Dagat ng Araba
  rationale: Pinanatili ang literal na katawagang heograpiko bago ang kasunod na paglilinaw na “Dagat na Maalat.”
- source_word: יָם הַמֶּלַח
  choice: Dagat na Maalat
  rationale: Tuwirang sinasalamin ang katawagang Hebreo; inilagay sa talababa ang mas kilalang makabagong pangalan.
- source_word: תַּחַת
  choice: sa ibaba ng
  rationale: Angkop sa topograpikong paglalarawan at hindi ito sapilitang ginagawang tiyak na direksiyong kardinal.
- source_word: אַשְׁדֹּת
  choice: mga dalisdis
  rationale: Sa kontekstong heograpiko, tumutukoy ito sa mga bahaging pababa ng bundok o gulod.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Itinuring na pangalang pantangi at iniangkop ang transliterasyon sa natural na baybay sa Filipino.
- source_word: מִזְרָחָה
  choice: sa gawing silangan
  rationale: Pinanatili ang panandang direksiyon nang hindi labis na tinutukoy kung eksaktong aling bahagi ng parirala ang binabago nito.
