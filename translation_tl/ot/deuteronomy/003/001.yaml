base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: tl
  text: Pagkatapos, lumiko kami at umahon sa daan patungong Bashan.[a] Lumabas si Og, hari ng Bashan, upang salubungin kami, kasama ang lahat ng kanyang bayan, para sa labanan sa Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa daan ng Bashan”; maaari ring “sa daang patungo sa Bashan” o “sa daang dumaraan sa Bashan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Pagkatapos, lumiko kami
  rationale: Ang פנה sa sunod-sunod na salaysay ay nangangahulugang “lumiko” o “bumaling.” Ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod nang natural sa Tagalog.
- source_word: וַנַּעַל
  choice: umahon
  rationale: Ang עלה ay “umakyat” o “umahon.” Ang “umahon” ay natural para sa paglalakbay patungo sa mas mataas na lupain at pinananatili ang direksiyonal na diwa.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: sa daan patungong Bashan
  rationale: Literal itong “daan ng Bashan,” isang idyomang maaaring tumukoy sa rutang patungo o dumaraan sa Bashan. Ang “patungong Bashan” ay malinaw at natural; itinatala sa talababa ang mas literal na posibilidad.
- source_word: וַיֵּצֵא
  choice: Lumabas naman
  rationale: Ang יצא ay “lumabas.” Hindi idinagdag ang mas tiyak na “nagmartsa” sapagkat hindi iyon tahasang nasa Hebreo.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: si Og na hari ng Bashan
  rationale: Natural na Tagalog na paglalahad ng pangalan at titulong nasa construct chain.
- source_word: לִקְרָאתֵנוּ
  choice: upang makipaglaban sa amin
  rationale: Karaniwang “upang salubungin kami” ang לקראתנו, ngunit nililinaw ng kasunod na לַמִּלְחָמָה na militar ang layunin. Pinagsama ang dalawang parirala sa natural na Tagalog nang hindi pinalalawak ang kahulugan.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: kasama ang lahat ng kanyang nasasakupan
  rationale: Ang עם ay literal na “bayan/mga tao.” Sa kontekstong pandigma, ang “nasasakupan” ay nagpapanatili ng malawak na saklaw at umiiwas sa mas makitid na “hukbo,” bagaman malamang na mga mandirigma ang tinutukoy.
- source_word: לַמִּלְחָמָה
  choice: upang makipaglaban
  rationale: Ang מלחמה ay maaaring “digmaan” o “labanan.” Dito ay tumutukoy ito sa isang tiyak na engkuwentro, kaya natural ang pandiwang “makipaglaban.”
- source_word: אֶדְרֶעִי
  choice: sa Edrei
  rationale: Bagaman walang tahasang pang-ukol sa Hebreo, gumaganap ang pangalan bilang pang-abay na pook; natural sa Tagalog ang “sa Edrei.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “umahon” upang mapanatili ang heograpikong direksiyon, at “nasasakupan” upang hindi tahasang paliitin ang עַם sa “hukbo.”
