  source_fidelity: Ang maramihang panghalip sa מֵאִתָּם ay wastong napanatili sa “kanila,” at ang bilang, Argob, Og, at Bashan ay tumpak. Gayunman, mas angkop ang “nasakop” para sa pagkuha ng mga lungsod sa konteksto ng digmaan kaysa “nabihag,” na sa karaniwang modernong Filipino ay higit na tumutukoy sa mga taong binihag.
  naturalness: Natural ang kabuuang daloy, ngunit ang “nabihag ... ang mga lungsod” ay hindi gaanong idiomatiko kaysa “nasakop ... ang mga lungsod.” Mas tuwiran din ang “mga lungsod niya” kaysa “kanyang mga lungsod” sa naratibong ito.
  terminology: Pinananatili ang “lungsod,” “rehiyon,” “kaharian,” at mga pangalang Argob, Og, at Bashan. Ang “na sakop ng kaharian” ay katanggap-tanggap na pagpapahayag ng ugnayan ng Argob sa kaharian ni Og, nang hindi ipinapalagay na ang “kanila” ay tumutukoy kay Og lamang.
