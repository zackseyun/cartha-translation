  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: tl
  text: At nasakop namin nang panahong iyon ang lahat ng mga lungsod niya. Walang lungsod na hindi namin nakuha mula sa kanila[a]—animnapung lungsod, ang buong rehiyon ng Argob, na sakop ng kaharian ni Og sa Bashan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay “mula sa kanila,” malamang na tumutukoy sa mga mamamayan o hukbo ni Og, hindi kay Og lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: nabihag namin
  rationale: Ang לכד ay tumutukoy sa pagbihag o pagsakop sa konteksto ng digmaan; malinaw na naipahahayag ng “nabihag” ang diwang militar.
- source_word: כָּל עָרָיו
  choice: lahat ng kanyang mga lungsod
  rationale: Ang עִיר ay maaaring lungsod o bayan; pinanatili ang “mga lungsod” para sa pare-parehong pagtukoy, at ang hulaping isahan ay tumutukoy kay Og.
- source_word: בָּעֵת הַהִוא
  choice: nang panahong iyon
  rationale: Likas at malinaw na modernong Tagalog para sa karaniwang pariralang temporal.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: Walang lungsod na hindi namin nakuha mula sa kanila
  rationale: Pinananatili ang mariing negatibong kayarian at ang tahasang panghalip na maramihan ng Hebreo.
- source_word: מֵאִתָּם
  choice: mula sa kanila
  rationale: Maramihan ang hulaping panghalip sa Hebreo, kaya hindi ito pinakinis bilang “mula sa kanya”; malamang na tumutukoy sa mga tauhan o mamamayan ni Og.
- source_word: שִׁשִּׁים עִיר
  choice: animnapung lungsod
  rationale: Tuwirang salin ng bilang at pangngalan, at kaayon ng naunang mga pagtukoy sa lungsod.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: ang buong rehiyon ng Argob
  rationale: Ang חֶבֶל dito ay distrito o rehiyon; ang “rehiyon” ay natural at madaling maunawaan.
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: na sakop ng kaharian ni Og sa Bashan
  rationale: Ipinakikitang ang rehiyon ng Argob ay bahagi ng kaharian ni Og na nasa Bashan, nang hindi ginagawang mabigat ang sunod-sunod na pariralang pangngalan.
