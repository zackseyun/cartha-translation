  text: וְ/לָ/רֻאוּבֵנִ֨י וְ/לַ/גָּדִ֜י נָתַ֤תִּי מִן הַ/גִּלְעָד֙ וְ/עַד נַ֣חַל אַרְנֹ֔ן תּ֥וֹךְ הַ/נַּ֖חַל וּ/גְבֻ֑ל וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: tl
  text: At ibinigay ko sa mga lipi ni Ruben at ni Gad ang lupain mula sa Gilead hanggang sa Lambak ng Arnon[a], na ang gitna ng lambak ang hangganan, at hanggang sa Lambak ng Jabok[b], na hangganan ng mga anak ni Ammon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na נחל ay maaaring tumukoy sa batis, wadi o tuyong ilog, o sa lambak na kaugnay nito. Dito, “Lambak” ang ginamit dahil sinasabi ng kasunod na parirala na ang gitna nito ang hangganan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Batis ng Jabok” o “Wadi ng Jabok.” Iisang salitang Hebreo, נחל, ang ginamit dito at sa Lambak ng Arnon.
    reason: lexical_alternative
  - marker: c
    text: O “hangganan ng mga Ammonita.” Literal sa Hebreo, “mga anak ni Ammon,” isang ekspresyon ng pagkakamag-anak para sa bayan ng Ammon.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: sa mga lipi ni Ruben at ni Gad
  rationale: Ang mga anyong gentiliko ay tumutukoy sa mga pangkat-tribo, hindi lamang sa mga ninunong sina Ruben at Gad. Natural sa modernong Tagalog ang “mga lipi ni” sa konteksto ng paghahati ng lupain.
- source_word: נָתַתִּי
  choice: ibinigay ko
  rationale: Tuwirang pinananatili ang karaniwang kahulugan ng נתן nang hindi nagdaragdag ng mas tiyak na diwang gaya ng “itinalaga.”
- source_word: מִן הַגִּלְעָד
  choice: mula sa Gilead
  rationale: Ipinapakita ng parirala ang panimulang dulo ng saklaw ng lupa; hindi na kailangan ng pantukoy bago ang pangalang-pook.
- source_word: עַד נַחַל אַרְנֹן
  choice: hanggang sa Lambak ng Arnon
  rationale: Maaaring tumukoy ang נחל sa batis, wadi, o lambak na kaugnay nito. Ang “lambak” ay angkop dahil ang kasunod na parirala ay tumutukoy sa gitna nito bilang hangganan.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: na ang gitna ng lambak ang hangganan
  rationale: Ipinahahayag nang malinaw at natural sa Tagalog na ang gitnang linya ng lambak ang nagsilbing hangganan, habang pinananatili ang ugnayang appositional ng Hebreo.
- source_word: עַד יַבֹּק הַנַּחַל
  choice: hanggang sa Lambak ng Jabok
  rationale: Pinananatiling pare-pareho ang salin ng נחל sa parehong paglalarawang heograpiko.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: hangganan ng mga anak ni Ammon
  rationale: Pinananatili ang Hebreong ekspresyon ng pagkakamag-anak; nililinaw sa talababa na tumutukoy ito sa mga Ammonita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga lipi ni Ruben at ni Gad” upang maging malinaw na mga pangkat-tribo ang tumanggap ng lupain. Pinanatili ang heograpikong ambiguwidad ng נחל sa pamamagitan ng pangunahing saling “Lambak” at mga alternatibo sa talababa.
