translation:
  language: tl
  text: Ngunit ang lahat ng alagang hayop at ang samsam mula sa mga lungsod ay sinamsam natin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At ang lahat ng alagang hayop at ang samsam ng mga lungsod ay sinamsam natin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Ngunit ang lahat
  rationale: 'Sa konteksto, iniuugnay ng waw ang talata sa paglipol na binanggit bago nito at nagpapakita ng banayad na pagsalungat: ang mga tao ay nilipol, ngunit ang mga alagang hayop at samsam ay kinuha. Pinananatili ng “lahat” ang lawak ng כָּל.'
- source_word: הַ/בְּהֵמָה
  choice: ang lahat ng alagang hayop
  rationale: Tumutukoy ang בְּהֵמָה rito sa mga hayop na inaalagaan o pag-aari ng mga naninirahan sa mga lungsod; mas tiyak at likas sa modernong Filipino ang “alagang hayop” kaysa sa pangkalahatang “mga hayop.”
- source_word: וּ/שְׁלַל
  choice: at ang nasamsam
  rationale: Ang שָׁלָל ay mga ari-ariang kinukuha sa digmaan. Ang “nasamsam” ay natural at malinaw na Filipino para sa naturang samsam, nang hindi gumagamit ng mas mabigat o di-karaniwang katawagan.
- source_word: הֶ/עָרִים
  choice: mula sa mga lungsod
  rationale: Bagaman literal na konstrukto ang “samsam ng mga lungsod,” malinaw na ipinahihiwatig dito ang mga ari-ariang kinuha mula sa mga lungsod. Ang “mula sa” ay natural sa Filipino at hindi binabago ang diwa.
- source_word: בַּזּוֹנוּ
  choice: kinuha natin
  rationale: Ang pandiwang בזז ay nangangahulugang samsamin o kunin bilang samsam. Dahil naipahayag na ng “nasamsam” ang aspektong pandigma, iniiwasan ng “kinuha natin” ang alanganing pag-uulit habang nananatiling malinaw ang kilos.
- source_word: לָֽ/נוּ
  choice: para sa ating sarili
  rationale: Ipinakikita ng לָנוּ na ang Israel ang nakinabang at nagmay-ari ng samsam. Tahasang naihahayag ng “para sa ating sarili” ang reflexive-benefactive na diwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “lungsod” para sa עָרִים at ang karaniwang salitang “nasamsam/sinamsam” para sa bokabularyong pandigma. Ang marker na [a] ay inilagay sa pangunahing teksto.
