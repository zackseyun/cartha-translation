  terminology: Ang "alagang hayop," "samsam," at "mga lungsod" ay angkop at nasa dignified na modernong rehistro. Ang "Ngunit" ay isang katanggap-tanggap na kontekstuwal na pagsasalin ng waw, na tumatangi sa mga bagay na kinuha mula sa mga taong nilipol sa naunang talata.
