  text: And to Machir I gave Gilead[a].
translation:
  language: tl
  text: At ibinigay ko kay Makir ang Gilead.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang Gilead,” na may tiyak na pantukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: At ... kay Makir
  rationale: Pinananatili ng “At” ang ugnayan sa naunang salaysay ng paghahati ng lupain. Ang לְ ay likas na isinasalin bilang “kay,” at ang pangalang מָכִיר ay tinumbasan bilang “Makir,” ayon sa karaniwang baybay sa Filipino.
- source_word: נָתַתִּי
  choice: ibinigay ko
  rationale: Ang Qal perfect na unang panauhang isahan ng נתן ay tuwirang nangangahulugang “ibinigay ko.” Ang aspektong ganap ay angkop na ipinapahayag sa Filipino sa pamamagitan ng anyong perpektibo.
- source_word: אֶת
  choice: '[pananda ng tiyak na tuwirang layon; hindi hiwalay na isinalin]'
  rationale: Walang hiwalay na katumbas sa Filipino ang Hebreong pananda ng tiyak na tuwirang layon; ipinahihiwatig ito ng karaniwang kayarian ng pangungusap.
- source_word: הַגִּלְעָד
  choice: ang Gilead
  rationale: Pinananatili ang tiyak na pantukoy na הַ sa pamamagitan ng “ang.” Bagaman pangalan ng lugar ang Gilead, natural sa Filipino ang paggamit ng “ang” bilang pananda sa tuwirang layon at kasabay nitong naipapakita ang artikulo sa Hebreo.
