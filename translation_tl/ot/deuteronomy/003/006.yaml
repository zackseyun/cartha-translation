  source_fidelity: Kailangang alisin ang “bilang handog sa Diyos.” Bagaman kaugnay ng Diyos ang konsepto ng חרם sa mas malawak na konteksto, hindi ito tahasang sinasabi sa talata, at ang “handog” ay nagpapahiwatig ng sakripisyong alay na hindi hinihingi ng pandiwa. Ang “itinalaga ... sa ganap na paglipol” ay mas tapat sa teknikal at mapanirang kahulugan ng חרם. Napananatili rin nito ang pagbibigay-diin ng infinitive absolute sa “lubusan.”
  naturalness: Ang binagong pangungusap ay natural at marangal na modernong Filipino Tagalog. Ang “mga lalaki, mga babae, at maliliit na bata” ay malinaw na listahan ng mga taong saklaw ng paglipol.
  terminology: Ginamit ang “itinalaga sa ganap na paglipol” para sa חרם, nang hindi nagdaragdag ng pahayag na ito ay isang handog. Sa talababa, ang “ḥerem” ay ibinibigay bilang teknikal na alternatibong termino at agad na ipinaliliwanag. Pinanatili ang Sihon at Hesbon, gayundin ang malubhang saklaw ng teksto.
