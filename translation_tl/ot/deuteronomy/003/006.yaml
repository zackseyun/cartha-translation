  text: וַ/נַּחֲרֵ֣ם אוֹתָ֔/ם כַּ/אֲשֶׁ֣ר עָשִׂ֔ינוּ לְ/סִיחֹ֖ן מֶ֣לֶךְ חֶשְׁבּ֑וֹן הַחֲרֵם֙ כָּל עִ֣יר מְתִ֔ם הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: tl
  text: At itinalaga namin sila sa ganap na paglipol[a], gaya ng ginawa namin kay Sihon na hari ng Hesbon, na nilipol namin nang lubusan ang bawat lungsod—mga lalaki, mga babae, at maliliit na bata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “isinailalim namin sila sa ḥerem.” Ang pandiwang Hebreo na חרם ay isang teknikal na katawagan para sa pagtatalaga ng isang tao o bagay sa ganap na paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: lubos namin silang nilipol bilang handog sa Diyos
  rationale: Ang Hiphil ng חרם ay teknikal na katawagan sa pagtatalaga ng mga tao o bagay sa ganap na pagkapuksa. Pinananatili ng parirala kapuwa ang ideya ng pagtatalaga at ang aktuwal na paglipol, sa malinaw na modernong Tagalog.
- source_word: כַּאֲשֶׁר עָשִׂינוּ
  choice: gaya ng ginawa namin
  rationale: Likas na paghahambing sa Tagalog na tumutukoy sa naunang ginawa kay Sihon.
- source_word: לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: kay Sihon na hari ng Hesbon
  rationale: Ang ל pagkatapos ng עשה ay tumutukoy sa taong ginawan ng gayong pagkilos; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kay.”
- source_word: הַחֲרֵם
  choice: lubos naming nilipol
  rationale: Ang infinitive absolute ay nagpapatingkad at nagpapaliwanag sa naunang חרם; malinaw na ipinahahayag ng “lubos” ang ganap na saklaw nito.
- source_word: כָּל עִיר
  choice: ang bawat lungsod
  rationale: Tuwirang katumbas na angkop sa salaysay ng pagsakop.
- source_word: מְתִם
  choice: ang mga lalaki
  rationale: Sa kasunod na talaang kaiba sa mga babae at maliliit na bata, tumutukoy ito sa mga lalaking tao; hindi ito ginawang pang-uri na “tinitirhan.”
- source_word: הַנָּשִׁים
  choice: mga babae
  rationale: Tuwirang leksikal na salin.
- source_word: וְהַטָּף
  choice: at maliliit na bata
  rationale: Ang טף ay tumutukoy lalo na sa maliliit na bata o mga paslit; mas tiyak ito kaysa sa pangkalahatang “mga bata.”
theological_decisions:
- issue: Paglalarawan sa חרם sa konteksto ng digmaan at paghatol
  choice: “nilipol bilang handog sa Diyos” sa pangunahing sugnay, na sinusundan ng “lubos naming nilipol”
  alternative: “ganap naming nilipol” o “isinailalim namin sa pagbabawal”
  rationale: Hindi dapat palambutin ang ganap na paglipol, ngunit dapat ding mapanatili ang teknikal na diwa ng חרם bilang pagtatalaga sa Diyos na humahantong sa pagkapuksa. Ang talababa ay nagbibigay ng mas literal na alternatibo nang hindi nagpapasok ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “nilipol” upang hindi palambutin ang karahasan ng teksto, at ipinaliwanag sa talababa ang teknikal na diwa ng חרם. Pinanatili ang magkakahiwalay na banggit sa mga lalaki, babae, at maliliit na bata.
