  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: tl
  text: “O Panginoong Yahweh,[a] sinimulan na ninyong ipakita sa inyong lingkod ang inyong kadakilaan at ang inyong makapangyarihang kamay. Sapagkat sinong diyos sa langit o sa lupa ang makagagawa ng mga gawang tulad ng inyong mga gawa at ng mga makapangyarihang pagkilos na tulad ng sa inyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Adonay YHWH, na pinagsasama ang titulong “Panginoon” at ang banal na pangalang Yahweh.'
    reason: Nililinaw ang dalawang magkaibang katawagan sa orihinal at ang dahilan ng saling “Panginoong Yahweh.”
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: O Panginoong Yahweh
  rationale: Pinananatili ang magkasunod na titulong ʾAdonay at ang pangalang YHWH. Likas sa Tagalog ang pang-angkop sa “Panginoong Yahweh,” at malinaw nitong naihihiwalay ang titulo sa personal na pangalan.
- source_word: הַחִלּוֹתָ לְהַרְאוֹת
  choice: sinimulan na ninyong ipakita
  rationale: Ang Hiphil na anyo ay nangangahulugang “magsimula,” at ang “na” ay nagpapahiwatig ng nasimulan nang pagkilos na may patuloy na kabuluhan.
- source_word: עַבְדְּךָ
  choice: inyong lingkod
  rationale: Sa konteksto ng panalangin at tipanang pagpapasakop sa Diyos, “lingkod” ang natural at marangal na salin nang hindi labis na itinatampok ang kahulugang alipin.
- source_word: גָּדְלְךָ
  choice: inyong kadakilaan
  rationale: Direktang ipinapahayag ng “kadakilaan” ang lawak at kamahalan na saklaw ng pangngalan.
- source_word: יָדְךָ הַחֲזָקָה
  choice: inyong makapangyarihang kamay
  rationale: Pinananatili ang biblikal na larawang “kamay” bilang kapangyarihang kumikilos; mas natural sa kasalukuyang Tagalog ang “makapangyarihan” kaysa literal na “malakas” sa pariralang ito.
- source_word: מִי אֵל
  choice: sinong diyos
  rationale: Ipinahahayag ang retorikal na paghahanap sa anumang diyos na maihahambing kay Yahweh, nang hindi ipinapasok sa mismong tanong ang sagot.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: sa langit o sa lupa
  rationale: Sa retorikal na tanong, natural ang “o” sa Tagalog upang ipahayag ang buong saklaw ng anumang posibleng karibal.
- source_word: יַעֲשֶׂה
  choice: makagagawa
  rationale: Bagaman imperfect ang anyo, ang retorikal na konteksto ay tumutukoy sa kakayahan; malinaw itong naipapahayag ng “makagagawa.”
- source_word: כְמַעֲשֶׂיךָ
  choice: mga gawang tulad ng inyong mga gawa
  rationale: Pinananatili ang pag-uulit at tahasang paghahambing ng Hebreo, pati ang unang bahagi ng paralelismo.
- source_word: וְכִגְבוּרֹתֶיךָ
  choice: mga makapangyarihang pagkilos na tulad ng sa inyo
  rationale: Ipinahahayag ang mga pagpapamalas ng kapangyarihan at iniiwasan ang salitang “gawa” upang maipakita ang bahagyang kaibhan sa naunang מַעֲשֶׂיךָ.
theological_decisions:
- issue: Paglilipat sa banal na pangalan sa אֲדֹנָי יְהוִה
  choice: O Panginoong Yahweh
  alternative: O Panginoong DİYOS / O Panginoong PANGINOON
  rationale: Ang “Yahweh” ay tahasang kumakatawan sa YHWH at pinananatili ang pagkakaiba nito sa titulong ʾAdonay. Hindi nito ginagawang magkapareho ang dalawang katawagan o ikinukubli ang personal na pangalan.
- issue: Puwersa ng retorikal na tanong tungkol sa ibang diyos
  choice: sinong diyos ... ang makagagawa
  alternative: walang diyos ... na makagagawa
  rationale: Pinananatili ang anyong tanong at ang teolohikal na diin ng Hebreo sa halip na tahasang gawing pahayag ang ipinahihiwatig na sagot.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Ginamit ang magalang na “ninyo/inyong” sa pakikipag-usap sa Diyos; pinanatili ang mga larawang biblikal, ang retorikal na tanong, at ang paralelismo nang hindi nagiging mahirap unawain.
