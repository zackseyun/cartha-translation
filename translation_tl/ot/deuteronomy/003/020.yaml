  terminology: Ang “Yahweh,” “mga kapatid,” “kapahingahan,” at “mana” sa talababa ay angkop. Ang “pag-aari” ay katanggap-tanggap para sa ירֻשָּׁה, samantalang pinananatili ng talababa ang alternatibong “mana.”
