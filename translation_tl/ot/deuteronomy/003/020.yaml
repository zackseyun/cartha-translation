language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: tl
  text: hanggang sa bigyan ni Yahweh ng kapahingahan ang inyong mga kapatid, gaya ng ibinigay niya sa inyo,[a] at maangkin din nila ang lupaing ibinibigay sa kanila ni Yahweh na inyong Diyos sa ibayo ng Jordan.[b] Pagkatapos, maaaring bumalik ang bawat isa sa inyo sa kanyang pag-aari[c] na ibinigay ko sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang inyong mga kapwa Israelita.” Ang Hebreo ay literal na “inyong mga kapatid,” isang panlalaking katawagang pampamilya para sa mga kapwa kabilang sa Israel.
    reason: lexical_alternative
  - marker: b
    text: O “sa kabila ng Jordan.” Relatibo ang parirala sa kinaroroonan ng nagsasalita sa silangan ng ilog.
    reason: lexical_alternative
  - marker: c
    text: O “sa kanyang mana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: bigyan ... ng kapahingahan
  rationale: Ang Hiphil ng נוח ay nangangahulugang magbigay ng pahinga o katiwasayan. Pinananatili ng “kapahingahan” ang temang Deuteronomiko ng paninirahan nang ligtas sa lupain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatinig ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: לַאֲחֵיכֶם
  choice: ang inyong mga kapatid
  rationale: Pinananatili ang panlalaking katawagang pampamilya ng Hebreo, na sa konteksto ay tumutukoy sa mga kapwa Israelita.
- source_word: כָכֶם
  choice: gaya ninyo
  rationale: 'Pinananatili ang maikli at eliptikong paghahambing ng Hebreo: bibigyan din sila ng kapahingahang tinanggap na ng mga kinakausap.'
- source_word: וְיָרְשׁוּ
  choice: makuha ... bilang pag-aari
  rationale: Ipinahahayag nito ang aktuwal na pag-angkin at paghawak sa lupain, habang hindi nililimitahan ang ירשׁ sa pasibong pagtanggap ng mana.
- source_word: גַם הֵם
  choice: rin nila
  rationale: Ipinakikita ang diin na ang ibang mga lipi ay magkakaroon din ng lupain gaya ng mga lipi sa silangan.
- source_word: נֹתֵן
  choice: ibinibigay
  rationale: Ang aspektong participial ay nagpapakita sa kaloob bilang tiyak at kasalukuyang isinasagawa mula sa pananaw ng salaysay.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: sa ibayo ng Jordan
  rationale: Natural na panandang heograpiko ito na nananatiling relatibo sa kinaroroonan ng nagsasalita sa silangan ng ilog.
- source_word: וְשַׁבְתֶּם
  choice: Pagkatapos, makababalik
  rationale: Ipinahahayag ang kasunod na pagbabalik matapos matupad ang tungkulin; ang anyong “makababalik” ay angkop sa pahintulot na ipinahihiwatig ng konteksto.
- source_word: אִישׁ
  choice: ang bawat isa sa inyo
  rationale: Natural na isinasalin ang distributibong gamit ng “lalaki” nang hindi nawawala ang pagtukoy sa bawat kasapi ng pangkat na kinakausap.
- source_word: לִירֻשָּׁתוֹ
  choice: sa kanyang pag-aari
  rationale: Tumutukoy sa minana o itinalagang lupaing pag-aari; malinaw ang “pag-aari” sa karaniwang mambabasa habang pinananatili ang ideya ng takdang bahagi.
- source_word: נָתַתִּי לָכֶם
  choice: na ibinigay ko sa inyo
  rationale: Ipinahahayag ng pangnagdaan ang nauna at natapos nang pagkakaloob ng lupain sa silangan ng Jordan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Panlalaking wika sa לַאֲחֵיכֶם at אִישׁ
  choice: “mga kapatid” para sa אֲחֵיכֶם; “bawat isa sa inyo” para sa distributibong אִישׁ
  alternative: mga kapwa Israelita; bawat lalaki
  rationale: Pinananatili ng “mga kapatid” ang anyong pampamilya at panlalaki ng pinagmulan, samantalang natural na inilalahad ng “bawat isa sa inyo” ang distributibong diwa ng אִישׁ sa tiyak na pangkat na kinakausap.
- issue: Diwa ng kapahingahan sa יָנִיחַ
  choice: bigyan ... ng kapahingahan
  alternative: bigyan ng katiwasayan; pagpahingahin
  rationale: Hindi tahasang nilulutas kung ang diin ay pahinga, katiwasayan, o matatag na paninirahan; pinananatili ng “kapahingahan” ang malawak na teolohikal na diwa ng termino.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ibayo” bilang malinaw at dignidad na panandang heograpiko; ang pangungusap ay inayos nang natural sa Tagalog habang pinananatili ang pagkakasunod-sunod at mga ambiguwidad ng Hebreo.
