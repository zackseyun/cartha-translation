  yaml_path: translation/ot/deuteronomy/003/029.yaml
  text: So we stayed in the valley opposite Beth-peor[a].
translation:
  language: tl
  text: At nanatili kami sa lambak sa tapat ng Bet-peor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At tumira kami sa lambak na nakaharap sa Bet-peor.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: Kaya nanatili kami
  rationale: Ang waw-consecutive na anyong 1cp ng ישׁב ay nagsasalaysay ng nagdaang pagkilos. Likas sa modernong Tagalog ang “nanatili kami” para sa paninirahan o pansamantalang pagtigil sa isang lugar, at ipinahihiwatig ng “Kaya” ang pagpapatuloy at bunga sa konteksto.
- source_word: בַּגָּיְא
  choice: sa lambak
  rationale: Ang גַּיְא ay maaaring tumukoy sa lambak, bangin, o makitid na libis. Ang “lambak” ang pinakamalawak at pinakanatural na katumbas nang hindi labis na tinutukoy ang anyo ng lupain.
- source_word: מוּל
  choice: sa tapat ng
  rationale: Ang מוּל ay nagpapahiwatig ng posisyong kaharap o katapat ng isang lugar. Natural at malinaw sa Tagalog ang “sa tapat ng.”
- source_word: בֵּית פְּעוֹר
  choice: Bet-peor
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon, hindi ng pagsasalin sa literal na “bahay ni Peor.” Ang “Bet-peor” ay umaayon sa bigkas at baybay na madaling basahin sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang maikli at payak na anyo ng talata at ang alternatibong kahulugan ng ישׁב at מוּל sa talababa.
