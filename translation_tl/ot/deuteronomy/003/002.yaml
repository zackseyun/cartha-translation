base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: tl
  text: At sinabi sa akin ni Yahweh, “Huwag kang matakot sa kanya, sapagkat ibinigay ko na sa iyong kamay ang kanyang sarili, ang lahat ng kanyang bayan, at ang kanyang lupain. Gawin mo sa kanya ang gaya ng ginawa mo kay Sihon, ang hari ng mga Amoreo na naninirahan sa Hesbon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Huwag kang matakot sa kanya
  rationale: Likas at tuwirang Filipino para sa negatibong utos, habang pinananatiling tahasan ang layon na “sa kanya.”
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: ibinigay ko na sa iyong kamay siya
  rationale: Pinananatili ang larawan ng Hebreong idyoma na nagsasaad ng pagkakaloob sa kapangyarihan ng isang tao; ipinahihiwatig ng “na” na tiyak na ang kinalabasan mula sa pananaw ng Diyos.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: ang buo niyang bayan, at ang kanyang lupain
  rationale: Hindi nililimitahan ang עַם sa hukbo lamang; ang “bayan” ay tumutukoy sa mga taong nasasakupan niya, at ang “lupain” ang tuwirang katumbas ng אֶרֶץ sa konteksto.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Gagawin mo sa kanya ang gaya ng ginawa mo
  rationale: Pinananatili ang malawak na kahulugan ng עשה at hinahayaang ang kasunod na paghahambing ang magtakda sa tinutukoy na pagkilos.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: kay Sihon, na hari ng mga Amoreo
  rationale: Malinaw na ipinapahayag sa natural na Filipino ang ugnayang appositional at ang pagkakakilanlan ni Sihon bilang hari ng bayang Amoreo.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: at naninirahan sa Hesbon
  rationale: Ang “naninirahan” ay natural na salin ng participle יוֹשֵׁב at pinananatili ang aspektong naglalarawan ng kanyang tirahan nang hindi labis na itinatakda ang panahon.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang ginamit ng tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON” o ng ibang anyo ng transliterasyon.
- issue: Ang perpektong pandiwang נָתַתִּי bago pa ang labanan
  choice: ibinigay ko na
  alternative: ibibigay ko; inihahatid ko
  rationale: Inilalahad ng Hebreo ang pagkakaloob bilang naganap o tiyak na, kahit ang pagsakop ay isasagawa pa lamang; pinananatili ng “ibinigay ko na” ang tensiyong ito.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang Hebreong larawan ng “sa iyong kamay” dahil malinaw pa rin itong nagpapahiwatig ng pagpapasailalim sa kapangyarihan, at iniwasan ang pagpapaliwanag nang higit sa sinasabi ng talata.
