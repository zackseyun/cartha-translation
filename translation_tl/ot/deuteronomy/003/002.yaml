revisions:
- from: At sinabi sa akin ni Yahweh, “Huwag kang matakot sa kanya, sapagkat ibinigay ko na sa iyong kamay siya, ang buo niyang bayan, at ang kanyang lupain. Gagawin mo sa kanya ang gaya ng ginawa mo kay Sihon, na hari ng mga Amoreo at naninirahan sa Hesbon.”
  to: At sinabi sa akin ni Yahweh, “Huwag kang matakot sa kanya, sapagkat ibinigay ko na sa iyong kamay ang kanyang sarili, ang lahat ng kanyang bayan, at ang kanyang lupain. Gawin mo sa kanya ang gaya ng ginawa mo kay Sihon, ang hari ng mga Amoreo na naninirahan sa Hesbon.”
  rationale: Inayos ang ayos ng layon upang maging natural ang Filipino habang pinananatili ang larawan ng “sa iyong kamay.” Ginawang “lahat ng kanyang bayan” ang salin ng כָּל־עַמּוֹ, at nilinaw na ang paninirahan sa Hesbon ay paglalarawan kay Sihon. Walang idinagdag na interpretasyong doktrinal o historikal.
