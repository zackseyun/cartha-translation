base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/010.yaml
  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: tl
  text: ang lahat ng lunsod sa mataas na kapatagan[a], ang buong Gilead, at ang buong Bashan hanggang Salca at Edrei—ang mga lunsod ng kaharian ni Og sa Bashan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “talampas” o “kapatagan.” Ang salitang Hebreo ay tumutukoy rito sa patag at mataas na rehiyon sa silangan ng Jordan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: ang lahat ng lunsod sa mataas na kapatagan
  rationale: Ipinahahayag ng כֹּל ang kabuuan ng mga lunsod. Ang מִישׁוֹר dito ay ang patag ngunit mataas na rehiyon sa silangan ng Jordan, kaya mas tiyak ang “mataas na kapatagan” kaysa sa payak na “kapatagan.”
- source_word: וְכָל הַגִּלְעָד
  choice: ang buong Gilead
  rationale: Ang כֹּל na tumutukoy sa isang rehiyon ay natural na isinasaling “buong”; pinanatili bilang pangalang pantangi ang Gilead.
- source_word: וְכָל הַבָּשָׁן
  choice: at ang buong Bashan
  rationale: Tinutukoy ang buong saklaw ng rehiyon; pinanatili bilang pangalang pantangi ang Bashan.
- source_word: עַד סַלְכָה וְאֶדְרֶעִי
  choice: hanggang Salca at Edrei
  rationale: Ang עַד ay nagtatakda ng hangganang heograpikal. Ginamit ang mga anyong madaling basahin sa Filipino para sa mga pangalan ng lugar.
- source_word: עָרֵי מַמְלֶכֶת עוֹג
  choice: ang mga lunsod ng kaharian ni Og
  rationale: Malinaw na ipinakikita ng pariralang genitibo ang kaugnayan ng mga lunsod sa kaharian ni Og; ang gitling ay naghuhudyat ng paliwanag na appositional.
- source_word: בַּבָּשָׁן
  choice: sa Bashan
  rationale: 'Ang בְּ ay lokatibo rito: nasa Bashan ang kaharian ni Og.'
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may natural na pag-uulit ng “buong” para sa mga rehiyon. Ginamit ang “lunsod” para sa heopolitikal na konteksto at “mataas na kapatagan” upang mapanatili ang topograpikong diwa ng מִישׁוֹר. Walang talababa sa Salca sapagkat ang pagkakaiba-iba ng baybay sa Ingles ay hindi kailangang ilipat sa saling Filipino.
