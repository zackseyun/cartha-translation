base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: tl
  text: Nang panahong iyon, kinuha natin mula sa kamay ng dalawang hari ng mga Amoreo, na nasa ibayo ng Jordan, ang lupain mula sa Wadi ng Arnon[a] hanggang sa Bundok Hermon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Lambak ng Arnon” o “Ilog Arnon.” Ang salitang Hebreo na נחל ay maaaring tumukoy sa isang wadi, batis, o lambak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: kinuha natin
  rationale: Ang Qal wayyiqtol na unang panauhang maramihan ng לקח ay nagsasalaysay ng pagkuha sa lupain. Ang “kinuha natin” ay natural at hindi nagdaragdag ng higit na kulay-militar na taglay ng “sinakop” o “inagaw.”
- source_word: בָּעֵת הַהִוא
  choice: Nang panahong iyon
  rationale: Karaniwang pahayag na temporal; natural ito sa makabagong Tagalog at malinaw ang pagtukoy sa naunang salaysay.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ang אֶרֶץ sa isang tiyak na teritoryo, hindi sa buong daigdig. Mas angkop dito ang “lupain” kaysa “lupa” o “bansa.”
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang malinaw na idyomang Hebreo para sa pagkuha mula sa pag-aari o kapangyarihan ng isang tao. Nauunawaan din sa Tagalog ang “mula sa kamay ng” bilang pagkalas sa kontrol.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: dalawang hari ng mga Amoreo
  rationale: Malapit sa konstruksiyong Hebreo at natural sa Tagalog; tinutukoy nito ang dalawang haring kabilang sa mga Amoreo.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: ang lupaing nasa ibayo ng Jordan
  rationale: Sa gramatika, maaaring iugnay ang relative clause sa “lupain” o ilarawan ang mga hari ayon sa kanilang lokasyon. Ang ayos na ito ay natural sa Tagalog at pinananatili ang heograpikong pananaw ng בְּעֵבֶר הַיַּרְדֵּן.
- source_word: מִנַּחַל אַרְנֹן
  choice: mula sa Lambak ng Arnon
  rationale: Ang נחל ay maaaring tumukoy sa wadi, batisang pana-panahon, o lambak. Ang “Lambak ng Arnon” ay madaling maunawaan sa Tagalog at hindi tahasang nagpapalagay na palaging umaagos ang ilog; inilalahad sa talababa ang saklaw ng kahulugan.
- source_word: עַד הַר חֶרְמוֹן
  choice: hanggang sa Bundok Hermon
  rationale: Ipinahahayag ng עַד ang hangganan o lawak ng teritoryo; malinaw at natural ang “hanggang sa.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang idyomang “mula sa kamay” dahil malinaw ito sa Tagalog, at ginamit ang “Amoreo” bilang karaniwang anyong Filipino ng pangalan ng bayan. Inilagay ang panandang [a] kaagad pagkatapos ng “Arnon,” na siyang salitang tinatalababa.
