revisions:
- from: Nang panahong iyon, kinuha natin mula sa kamay ng dalawang hari ng mga Amoreo ang lupaing nasa ibayo ng Jordan, mula sa Lambak ng Arnon[a] hanggang sa Bundok Hermon.
  to: Nang panahong iyon, kinuha natin mula sa kamay ng dalawang hari ng mga Amoreo, na nasa ibayo ng Jordan, ang lupain mula sa Wadi ng Arnon[a] hanggang sa Bundok Hermon.
  rationale: Inilipat ang sugnay na “na nasa ibayo ng Jordan” upang malinaw nitong mailarawan ang dalawang hari, ayon sa kasarian at bilang ng Hebreo. Pinalitan ang pangunahing “Lambak” ng “Wadi” upang hindi limitahan ang kahulugan ng נחל, at inayos ang mga alternatibo sa talababa para sa natural at tumpak na Filipino.
