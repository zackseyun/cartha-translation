revisions:
- from: Ibinigay rin ni Yahweh na ating Diyos sa ating kamay si Og, na hari ng Bashan, at ang buo niyang bayan. Pinuksa namin sila hanggang sa wala ni isang nakaligtas sa kanila.[a]
  to: Ibinigay rin ni Yahweh na ating Diyos sa ating kamay si Og, na hari ng Bashan, at ang buong bayan niya. Nilupig namin siya hanggang sa wala siyang natirang ni isang nakaligtas.[a]
  rationale: Iningatan ng rebisyon ang isahang pagtukoy ng Hebreo kay Og sa “nilupig namin siya” at “para sa kaniya,” habang kinikilala ng unang pangungusap na kasama sa ibinigay sa Israel ang buong bayan niya. Pinalitan din ang bahagyang di-likas na ayos na “buo niyang bayan” at ang mas matinding “pinuksa” ng mas malapit at natural na mga anyo.
