  source_fidelity: Tumpak ang pangunahing diwa, kabilang ang Yahweh, ang idyomang “sa ating kamay,” at ang lubos na pagkatalo. Gayunman, ang “sila” at “sa kanila” ay lumilihis sa isahang panghalip sa Hebreo (Og; לוֹ, “sa kaniya”).
  naturalness: Marangal at natural sa kabuuan, ngunit mas likas ang “buong bayan niya” kaysa “buo niyang bayan.” Ang binagong pangwakas na sugnay ay malinaw at idiomatiko sa modernong Tagalog.
  terminology: Ang “Yahweh,” “hari ng Bashan,” at “bayan” ay angkop. Ang “pinuksa” ay maaaring magpahiwatig ng mas tiyak na paglipol kaysa sa pangunahing pandiwang נכה (“tinamaan/nilupig”); “nilupig” ay mas malapit sa pandiwang Hebreo sa konteksto ng digmaan.
