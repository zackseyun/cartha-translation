    rationale: Bagaman sinusuportahan ng konteksto ang ganap na pagkatalo, ang “nilupig” ay mas maingat na katumbas ng pandiwang “sinaktan/tinalo” at hindi nagdaragdag ng tiyak na leksikal na diin.
