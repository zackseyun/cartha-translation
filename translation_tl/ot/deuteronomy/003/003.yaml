  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֱלֹהֵ֜י/נוּ בְּ/יָדֵ֗/נוּ גַּ֛ם אֶת ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן וְ/אֶת כָּל עַמּ֑/וֹ וַ/נַּכֵּ֕/הוּ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: tl
  text: Ibinigay rin ni Yahweh na ating Diyos sa ating kamay si Og, na hari ng Bashan, at ang buong bayan niya. Nilupig namin siya hanggang sa wala siyang natirang ni isang nakaligtas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “hanggang sa wala nang natirang nakaligtas para sa kaniya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyong “Yahweh” upang mapanatili ang personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Karaniwang kahulugan ng נתן ang “ibigay.” Kasama ng pariralang “sa ating kamay,” ipinahihiwatig nito na ipinasailalim sila ng Diyos sa kapangyarihan ng Israel.
- source_word: בְּיָדֵנוּ
  choice: sa ating kamay
  rationale: Pinananatili ang isahang “kamay” at ang Hebreong idyoma ng pagpapasailalim sa kapangyarihan ng isang tao o pangkat.
- source_word: גַּם
  choice: rin
  rationale: Ipinakikita ng גַּם na ang pagkatalo ni Og ay idinaragdag sa naunang pagkatalo ni Sihon.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: si Og, na hari ng Bashan
  rationale: Likas sa modernong Tagalog ang paglalagay ng “si” sa pangalang pantangi at malinaw na inilalahad ang kaniyang titulo at nasasakupan.
- source_word: כָּל עַמּוֹ
  choice: ang buo niyang bayan
  rationale: Mas malawak ang עַם kaysa “hukbo”; saklaw nito ang buong bayang nasasakupan ni Og, bagaman nasa konteksto ito ng digmaan.
- source_word: וַנַּכֵּהוּ
  choice: pinuksa namin sila
  rationale: Sa konteksto ng labanan, ang נכה ay tumutukoy sa marahas at lubusang paggapi. Ginawang maramihan ang layon sa Tagalog upang malinaw na tumukoy kay Og kasama ng buong bayan niya, na siyang kolektibong saklaw ng kasunod na pahayag.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: hanggang sa wala ni isang nakaligtas sa kanila
  rationale: Natural at mariing ipinahahayag nito sa Tagalog ang ganap na kawalan ng nakaligtas, habang ang mas literal na anyo ng Hebreo ay inilagay sa talababa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalan sa pamamagitan ng karaniwang rekonstruksiyong “Yahweh,” nang hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Lawak ng paglalarawan sa paglipol
  choice: wala ni isang nakaligtas sa kanila
  alternative: walang natirang nakaligtas para sa kaniya
  rationale: Pinananatili ang matinding paglalarawan ng Hebreo sa ganap na pagkatalo nang hindi dinaragdagan ng paliwanag o doktrinal na pagpapaluwag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong idyomang “sa ating kamay,” samantalang ginawang natural sa Tagalog ang pangwakas na sugnay. Ang marker na [a] ay inilagay sa mismong pahayag na tinutukoy ng talababa.
