  text: וְ/אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את יָרַ֖שְׁנוּ בָּ/עֵ֣ת הַ/הִ֑וא מֵ/עֲרֹעֵ֞ר אֲשֶׁר עַל נַ֣חַל אַרְנֹ֗ן וַ/חֲצִ֤י הַֽר הַ/גִּלְעָד֙ וְ/עָרָ֔י/ו נָתַ֕תִּי לָ/רֻֽאוּבֵנִ֖י וְ/לַ/גָּדִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: tl
  text: At inangkin namin nang panahong iyon ang lupaing ito, mula sa Aroer, na nasa tabi ng Lambak ng Arnon,[a] at ang kalahati ng bulubunduking lupain ng Gilead, kasama ang mga lungsod nito.[b] Ibinigay ko iyon sa mga Rubenita at mga Gadita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa tabi ng Wadi ng Arnon.” Ang salitang Hebreo na נחל ay maaaring tumukoy sa isang wadi, bangin, o lambak.
    reason: lexical_alternative
  - marker: b
    text: O “ang kalahati ng Bundok Gilead.” Sa mga paglalarawan ng teritoryo, ang salitang Hebreo na הַר ay madalas tumukoy sa isang bulubunduking rehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: sinakop namin
  rationale: Sa konteksto ng pagkuha at paghahati ng teritoryo, ipinahihiwatig ng ירשׁ ang aktibong pag-angkin at paghawak sa lupain; natural itong ipinapahayag sa Tagalog bilang “sinakop namin.”
- source_word: הָאָרֶץ הַזֹּאת
  choice: ang lupaing ito
  rationale: Ang “lupain” ay malinaw at likas na tawag sa teritoryong tinutukoy.
- source_word: בָּעֵת הַהִוא
  choice: nang panahong iyon
  rationale: Karaniwan at natural na katumbas ng temporal na pariralang Hebreo.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: mula sa Aroer, na nasa tabi ng Lambak ng Arnon
  rationale: Pinananatili ang pangalang Aroer at ang sugnay na naglalarawan sa kinalalagyan nito. Ang עַל ay angkop na isinaling “nasa tabi ng” sa heograpikong kontekstong ito.
- source_word: נַחַל
  choice: Lambak
  rationale: Maaaring tumukoy ang נחל sa wadi, bangin, o lambak na dinadaluyan ng tubig; “Lambak” ang higit na madaling maunawaan sa pangunahing teksto.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: at ang kalahati ng bulubunduking lupain ng Gilead
  rationale: Sa paglalarawan ng teritoryo, ang הַר ay maaaring tumukoy sa isang bulubunduking rehiyon at hindi lamang sa iisang bundok.
- source_word: וְעָרָיו
  choice: kasama ang mga lungsod nito
  rationale: Ang hulaping panghalip ay tumutukoy sa rehiyon ng Gilead; natural sa Tagalog ang “kasama ang mga lungsod nito.”
- source_word: נָתַתִּי
  choice: Ibinigay ko iyon
  rationale: Pinananatili ang paglipat mula sa unang panauhang maramihan tungo sa unang panauhang isahan at ang tuwirang diwa ng נתן.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: sa mga Rubenita at mga Gadita
  rationale: Bagaman anyong isahan ang mga katawagang gentiliko sa Hebreo, kolektibo ang gamit ng mga ito para sa dalawang pangkat ng tribo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bulubunduking lupain” upang ipahayag ang panrehiyong diwa ng הַר, at pinanatili sa mga talababa ang tunay na mga alternatibong heograpiko.
