  to: At inangkin namin nang panahong iyon ang lupaing ito, mula sa Aroer, na nasa tabi ng Lambak ng Arnon,[a] at ang kalahati ng bulubunduking lupain ng Gilead, kasama ang mga lungsod nito.[b] Ibinigay ko iyon sa mga Rubenita at mga Gadita.
