revisions:
- from: At nang panahong iyon ay iniutos ko sa inyo, “Ibinigay sa inyo ni Yahweh na inyong Diyos ang lupaing ito upang angkinin. Lahat kayong mandirigmang may kakayahan[c] ay tatawid na armado[b] sa unahan ng inyong mga kapatid, ang mga anak ni Israel.[a]”
  to: 'Noong panahong iyon ay inutusan ko kayo: “Ibinigay sa inyo ni Yahweh na inyong Diyos ang lupaing ito upang angkinin. Lahat kayong mandirigmang may kakayahan[c] ay tatawid na armado[b] sa unahan ng inyong mga kapatid[a], ang mga anak ni Israel.”'
  rationale: Pinalitan ang di-likas at di-gaanong tuwirang “iniutos ko sa inyo” ng “inutusan ko kayo,” na mas malapit sa estruktura at puwersa ng Hebreo. Inayos din ang pambungad para sa likas na modernong Tagalog. Hindi binago ang kahulugan, mga terminong teolohikal, mga pangalan, o mga angkla ng talababa.
