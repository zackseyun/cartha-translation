base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: tl
  text: 'Noong panahong iyon ay inutusan ko kayo: “Ibinigay sa inyo ni Yahweh na inyong Diyos ang lupaing ito upang angkinin. Lahat kayong mandirigmang may kakayahan[c] ay tatawid na armado[b] sa unahan ng inyong mga kapatid[a], ang mga anak ni Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “inyong mga kapwa Israelita.” Sa Hebreo: “inyong mga kapatid, ang mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: O “handa at nasasangkapan para sa labanan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “mga mandirigmang may kakayahan” ay tumutukoy sa mga lalaking kayang lumaban, hindi lamang sa mga taong matapang.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם בָּעֵת הַהִוא
  choice: At nang panahong iyon ay iniutos ko sa inyo
  rationale: Tuwirang ipinahahayag ang utos at pinananatili ang balangkas na pangyayari sa nakaraan, sa likas na ayos ng modernong Tagalog.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalang יְהוָה bilang “Yahweh,” at ang hulaping pangmaramihan sa “inyong Diyos.”
- source_word: נָתַן לָכֶם אֶת הָאָרֶץ הַזֹּאת
  choice: Ibinigay sa inyo ... ang lupaing ito
  rationale: Ang ganap na pandiwa ay inilalarawan bilang natapos na pagkakaloob na may bisa sa kasalukuyang tagpo.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Ipinahahayag ang pagkuha at paghawak sa lupain bilang pag-aari; mas angkop ito sa konteksto kaysa sa “manahin,” na maaaring magpahiwatig ng pasibong pagtanggap.
- source_word: חֲלוּצִים
  choice: armado
  rationale: Tumutukoy sa pagiging nakahanda at nasasangkapan para sa pagkilos militar; maikli at malinaw ang “armado,” habang itinatala sa talababa ang mas malawak na diwa.
- source_word: תַּעַבְרוּ לִפְנֵי
  choice: ay tatawid ... sa unahan ng
  rationale: Sa konteksto ng utos at pagkilos militar, ang anyong panghinaharap sa Tagalog ay may puwersa ng kinakailangang gagawin, at ang “sa unahan” ay nagpapakitang mauuna sila.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: inyong mga kapatid, ang mga anak ni Israel
  rationale: Pinananatili ang literal na ugnayang pampamilya at ang kasunod na pagpapaliwanag sa Hebreo, sa halip na palitan agad ng “mga kapwa Israelita.”
- source_word: כָּל בְּנֵי חָיִל
  choice: Lahat kayong mandirigmang may kakayahan
  rationale: Sa kontekstong militar, ang parirala ay tumutukoy sa mga lalaking may kakayahang lumaban, hindi lamang sa mga taong may panloob na tapang.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa teksto; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng mga katawagang panlalaki sa kontekstong militar
  choice: mga kapatid, ang mga anak ni Israel ... mga mandirigmang may kakayahan
  alternative: mga kapwa Israelita ... mga mandirigma
  rationale: Pinananatili ang hulma at tensiyon ng mga panlalaking katawagan sa Hebreo. Dahil hindi nagtatangi ng kasarian ang Tagalog na “kapatid,” nililinaw sa talababa na ang tinutukoy ay ang mga kapwa Israelita, samantalang ang “mandirigmang may kakayahan” ay inuunawa ayon sa partikular na kontekstong militar.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang likas na ayos ng pangungusap sa Tagalog, habang pinananatili ang pormal na himig ng utos, ang pangalang Yahweh, at ang mga larawang militar ng tekstong Hebreo.
