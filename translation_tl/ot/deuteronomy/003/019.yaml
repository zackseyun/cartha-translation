  text: רַ֠ק נְשֵׁי/כֶ֣ם וְ/טַפְּ/כֶם֮ וּ/מִקְנֵ/כֶם֒ יָדַ֕עְתִּי כִּֽי מִקְנֶ֥ה רַ֖ב לָ/כֶ֑ם יֵֽשְׁבוּ֙ בְּ/עָ֣רֵי/כֶ֔ם אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: tl
  text: Tanging ang inyong mga asawa, maliliit na anak[a], at mga alagang hayop—alam kong marami kayong alagang hayop—ang mananatili sa mga bayang ibinigay ko sa inyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anak” o “mga umaasa sa inyo.” Ang salitang Hebreo ay tumutukoy sa maliliit na bata o mga umaasa sa sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga lungsod.” Ang salitang Hebreo ay maaaring tumukoy sa mga pamayanang magkakaiba ang laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Tanging
  rationale: Likas na ipinahahayag ang paghihigpit o pagbubukod kaugnay ng naunang utos.
- source_word: נְשֵׁיכֶם
  choice: inyong mga asawa
  rationale: Sa konteksto ng mga miyembro ng sambahayang maiiwan, ang tinutukoy ay mga asawang babae, hindi kababaihan sa pangkalahatan.
- source_word: טַפְּכֶם
  choice: maliliit na anak
  rationale: Tumutukoy ang טַף sa maliliit na bata o mga umaasa sa sambahayan; malinaw at natural sa modernong Tagalog ang pariralang ito.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: mga alagang hayop / marami kayong alagang hayop
  rationale: Malawak ang saklaw ng מִקְנֶה at hindi lamang baka; pinananatili rin ang pag-uulit ng Hebreo.
- source_word: יָדַעְתִּי כִּי
  choice: alam kong
  rationale: Direktang pinananatili ang pahayag sa unang panauhan at natural na naihahayag ang paliwanag sa pamamagitan ng pagsingit na may mga gatlang.
- source_word: יֵשְׁבוּ
  choice: mananatili
  rationale: Sa konteksto, ang kilos ay ang pananatili sa silangan habang tumatawid ang mga mandirigma, hindi lamang ang paninirahan.
- source_word: בְּעָרֵיכֶם
  choice: sa mga bayan
  rationale: Maaaring tumukoy ang עִיר sa lungsod o bayan; hindi ipinagpapalagay ng “bayan” na malaki ang mga pamayanan.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: ibinigay ko sa inyo
  rationale: Malinaw na ipinahahayag ang natapos nang pagkakaloob nang hindi nagpapabigat sa pangungusap.
