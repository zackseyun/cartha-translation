base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: tl
  text: Ngunit nagalit sa akin si Yahweh dahil sa inyo[a] at hindi niya ako pinakinggan. Sinabi sa akin ni Yahweh, “Sapat na para sa iyo![b] Huwag mo na akong kausapin pa tungkol sa bagay na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alang-alang sa inyo” o “dahil sa inyong kapakanan.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong “Sapat na para sa iyo” ay isang maikli at mariing idyoma ng pagpapatigil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: nagalit
  rationale: Ang hitpael ng עבר sa idyomang ito ay nagpapahayag ng galit ni Yahweh kay Moises. Natural at hindi labis ang “nagalit” sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: בִּי
  choice: sa akin
  rationale: Kasama ng “nagalit,” ang “sa akin” ang natural na Tagalog para sa taong pinatutungkulan ng galit.
- source_word: לְמַעַנְכֶם
  choice: dahil sa inyo
  rationale: Sa konteksto, itinuturo ng parirala ang mga Israelita bilang dahilan o sanhi; ito ang pinakadirekta at natural na salin.
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: at hindi niya ako pinakinggan
  rationale: Ang שׁמע na may אֶל ay nangangahulugang makinig o dinggin ang isang pakiusap. Malinaw sa Tagalog ang “hindi niya ako pinakinggan.”
- source_word: רַב לָךְ
  choice: Tama na!
  rationale: Isang maikli at mariing idyoma ng pagpapatigil. Napananatili ng “Tama na!” ang tindi nang hindi gumagawa ng di-natural na literal na parirala.
- source_word: אַל תּוֹסֶף דַּבֵּר ... עוֹד
  choice: Huwag mo nang banggitin muli
  rationale: Ang יסף kasama ng infinitive at עוֹד ay nagbabawal sa pagpapatuloy o pag-uulit. Ang “huwag mo nang ... muli” ay natural at malinaw sa Tagalog.
- source_word: בַּדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Tumutukoy ang דָּבָר sa usaping ipinakiusap ni Moises; ang “bagay na ito” ay payak, dignified, at malapit sa Hebreo.
theological_decisions:
- issue: Paglalapat ng dahilan sa לְמַעַנְכֶם
  choice: dahil sa inyo
  alternative: alang-alang sa inyo / dahil sa nangyari sa inyo
  rationale: Maaaring literal na magkaroon ng saklaw na “para sa inyong kapakanan” o “dahil sa inyo,” ngunit sa konteksto ng pahayag ni Moises, pinakamalamang ang pananagutang sanhi. Pinananatili sa talababa ang posibleng ibang himig.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah / PANGINOON
  rationale: Direktang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili rito ang pangalang Yahweh at hindi ito pinapalitan ng titulo.
- issue: Tindi ng רַב לָךְ
  choice: Tama na!
  alternative: Sapat na iyan para sa iyo! / Tama na mula sa iyo!
  rationale: Terse at mariing pagpapatigil ang Hebreo. Ang natural na Tagalog na “Tama na!” ay nagpapanatili sa talas nito; ipinaliliwanag ng talababa ang literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinakinggan” para sa pagtanggi sa pakiusap, at ang maikling “Tama na!” upang mapanatili ang mariing tono ng Hebreo.
