  source_fidelity: 'Tumpak ang pangunahing diwa: nagalit si Yahweh kay Moises dahil sa mga Israelita, hindi niya dininig si Moises, at mariin niyang ipinagbawal ang muling pagsasalita tungkol sa usapin. Gayunman, ang “banggitin” ay mas makitid kaysa sa Hebreong “magsalita sa akin,” at ang alternatibong “dahil sa nangyari sa inyo” sa talababa ay walang sapat na batayang leksikal sa לְמַעַנְכֶם.'
