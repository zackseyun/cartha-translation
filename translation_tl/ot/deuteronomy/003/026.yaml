revisions:
- from: Ngunit nagalit sa akin si Yahweh dahil sa inyo[a] at hindi niya ako pinakinggan. Sinabi sa akin ni Yahweh, “Tama na![b] Huwag mo nang banggitin muli sa akin ang bagay na ito.”
  to: Ngunit nagalit sa akin si Yahweh dahil sa inyo[a] at hindi niya ako pinakinggan. Sinabi sa akin ni Yahweh, “Sapat na para sa iyo![b] Huwag mo na akong kausapin pa tungkol sa bagay na ito.”
  rationale: Pinalitan ang “banggitin muli sa akin” ng “kausapin pa tungkol sa” upang maipakita ang pandiwang “magsalita” kasama ng direktang layon na “sa akin,” habang pinananatili ang diwang “huwag na ... pa.” Inayos ang talababa a upang alisin ang hindi sinusuportahang pagpapalawak na “nangyari sa inyo.”
