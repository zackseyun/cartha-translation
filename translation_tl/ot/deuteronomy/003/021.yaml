  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa, ang isahang pagtukoy kay Josue sa huling sugnay, ang maramihang “ninyo” sa “Diyos ninyo,” at ang paghahambing ng gagawin ni Yahweh sa ginawa niya sa dalawang hari. Gayunman, ang “rin” ay nagdaragdag ng diwang hindi tahasang nasa וְ, at ang kasalukuyang huling parirala at talababa ay hindi sapat na malinaw na inilalarawan ang pagtawid patungo “roon.”
  naturalness: Marangal at natural sa pangkalahatan ang Tagalog. Mas idiomatiko at mas tumpak ang “iniutos ko kay Josue” kaysa “inutusan ko rin si Josue,” at ang “mga kahariang patutunguhan mo sa pagtawid roon” ay mas malinaw kaysa “mga kahariang pupuntahan mo sa pagtawid.”
  terminology: Ang “Yahweh,” “Diyos ninyo,” at “Josue” ay angkop. Pinananatili ng “mga mata mo mismo ang nakakita” ang pagbibigay-diin ng Hebreo nang mas likas ang ayos sa Tagalog.
  issues:
