base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: tl
  text: 'Noong panahong iyon, iniutos ko kay Josue: “Nakita mismo ng mga mata mo ang lahat ng ginawa ni Yahweh na Diyos ninyo sa dalawang haring ito. Gayon din ang gagawin ni Yahweh sa lahat ng kahariang patutunguhan mo sa pagtawid roon.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa lahat ng kahariang ikaw ay tumatawid roon.” Maaaring tukuyin ng “pagtawid roon” ang pagtawid patungo sa lupain ng mga kahariang ito.'
    reason: Ipinakikita ang mas malapit na anyo ng Hebreong אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה nang hindi ipinagpapalagay na ang mga kaharian mismo ang tinatawid.
lexical_decisions:
- source_word: וְאֶת יְהוֹשׁוּעַ צִוֵּיתִי
  choice: inutusan ko rin si Josue
  rationale: Ang צוה ay awtoritatibong pag-uutos. Ginamit ang “rin” upang dalhin sa natural na Tagalog ang pang-ugnay na וְ at ang pagpapatuloy ng salaysay.
- source_word: בָּעֵת הַהִוא
  choice: Noong panahong iyon
  rationale: Karaniwan at dignified na panandang temporal sa modernong Tagalog.
- source_word: לֵאמֹר
  choice: —
  rationale: Ipinahihiwatig ng tutuldok at tuwirang sipi ang pormulang nagpapakilala sa sinabi; hindi na kailangang idagdag ang mas mabigat na “na sinasabi.”
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: Nakita mismo ng iyong mga mata
  rationale: Pinananatili ang mariing larawan ng personal at tuwirang pagsaksi, pati ang isahang pagtukoy kay Josue.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: ang lahat ng ginawa
  rationale: Direkta at natural na katumbas ng kabuuang layon ng pandiwa.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh na Diyos ninyo
  rationale: Pinananatili ang pangalang tipan na Yahweh at ang maramihang hulaping tumutukoy sa Diyos ni Josue at ng Israel.
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: sa dalawang haring ito
  rationale: Natural na Tagalog para sa dalawang haring tumanggap ng pagkilos ni Yahweh.
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: Gayon din ang gagawin ni Yahweh
  rationale: 'Malinaw na pinananatili ang paghahambing: ang ginawa sa dalawang hari ang magiging huwaran ng susunod na gagawin.'
- source_word: לְכָל הַמַּמְלָכוֹת
  choice: sa lahat ng kaharian
  rationale: Hindi tahasang idinagdag ang “laban sa,” sapagkat ang salungatang diwa ay nagmumula sa konteksto at hindi kailangang ipasok sa salin.
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: pupuntahan mo sa pagtawid
  rationale: Natural na Tagalog na pinananatili ang kilos ng pagtawid at ang patutunguhang diwa ng שָׁמָּה, habang malinaw na isahan ang kausap.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Pagkakaiba ng bilang sa mga panghalip
  choice: “iyong mga mata” para kay Josue ngunit “Diyos ninyo” para kay Josue at Israel
  alternative: “Diyos mo” sa buong pangungusap
  rationale: Isahan ang hulapi sa עֵינֶיךָ at maramihan ang hulapi sa אֱלֹהֵיכֶם. Pinananatili ng salin ang sadyang pagbabago ng bilang sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Josue,” ang karaniwang anyong Filipino ng pangalan. Pinili ang tuwirang sipi at tutuldok sa halip na literal na ulitin ang pormulang “na sinasabi,” upang maging natural nang hindi nawawala ang istruktura ng pahayag.
