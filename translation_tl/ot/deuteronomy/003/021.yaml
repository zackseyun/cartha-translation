    rationale: Ang pang-ugnay na וְ ay maaaring simpleng “at,” at walang leksikal na batayan sa mismong talata upang igiit ang “rin.”
  - severity: medium
    issue: Hindi sapat na naipahahayag ng huling sugnay ang direksiyong “roon,” at ang talababa ay maaaring magmungkahi na ang mga kaharian mismo ang tinatawid.
    rationale: Ang אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה ay may diwa ng pagtawid patungo sa isang patutunguhan. Ang “tinatawid mo patungo roon” sa talababa ay masyadong literal sa paraang nakalilito sa saklaw ng panghalip na pamatlig.
