  text: לֹ֖א תְִּירָא֑וּ/ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: tl
  text: Huwag kayong matakot sa kanila[a], sapagkat si Yahweh na inyong Diyos ang siyang lumalaban para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag ninyo silang katakutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: Huwag kayong matakot sa kanila
  rationale: Ang לֹא kasama ng imperfect ay nagsasaad ng pagbabawal, at ang hulaping 3mp ay tumutukoy sa “kanila.” Likas at malinaw sa modernong Tagalog ang maramihang “kayong.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pagbabawal; pinananatili ng “sapagkat” ang paliwanag na ugnayan sa marangal ngunit madaling maunawaang paraan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal ng אֱלֹהִים, isahan ang tinutukoy rito—ang Diyos ng Israel—at ang hulapi ay ikalawang panauhang maramihan.
- source_word: הוּא
  choice: ang siyang
  rationale: Binibigyang-diin ng hiwalay na panghalip ang pagkakakilanlan ng kumikilos; natural na naihahatid sa Tagalog ang diin sa pamamagitan ng “ang siyang.”
- source_word: הַנִּלְחָם
  choice: lumalaban
  rationale: Ang participle ng לחם ay naglalarawan sa Diyos bilang patuloy o karaniwang nakikipaglaban; malinaw at natural itong ipinapahayag ng aspektong imperpektibo na “lumalaban.”
- source_word: לָכֶם
  choice: para sa inyo
  rationale: Ipinahihiwatig ng ל ang kapakinabangan o pagkilos alang-alang sa Israel; “para sa inyo” ang tuwiran at natural na katumbas.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Diin ng הוּא sa Diyos bilang mandirigma para sa Israel
  choice: ang siyang lumalaban
  alternative: siya ang lumalaban; lumalaban siya
  rationale: Pinananatili ng “ang siyang” ang tahasang diin ng panghalip nang hindi pinalalabis ang kahulugan o ginagawang eksklusibong pormula ang pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kayong” at “inyong” upang malinaw na maipakita ang maramihang kausap, at pinanatili ang pangalang Yahweh.
