id: DEU.3.11
reference: Deuteronomy 3:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: tl
  text: Sapagkat si Og lamang, na hari ng Basan, ang natira sa nalabi sa mga Refaim.[a] Narito, ang higaan niya ay isang higaang bakal. Hindi ba iyon ay nasa Raba ng mga Ammonita? Siyam na siko ang haba nito at apat na siko ang lapad,[b] ayon sa siko ng isang tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga higante.” Ang Hebreong “Refaim” ay malamang na pangalan ng isang sinaunang pangkat na iniuugnay sa pambihirang laki.
    reason: alternative_reading
  - marker: b
    text: Literal na, “ayon sa siko ng isang tao.” Maaari rin itong mangahulugang “ayon sa karaniwang siko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: lamang
  rationale: Ipinahahayag ang pagiging bukod-tangi ni Og bilang siyang natira.
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: ang natira sa nalabi sa
  rationale: Pinananatili ang diwa ng pandiwang 'natira' at ng pangngalang tumutukoy sa nalabi, nang hindi ginagawang tiyak kung ang tinutukoy ay huling indibidwal sa buong pangkat.
- source_word: הָרְפָאִים
  choice: mga Refaim
  rationale: Pinananatili bilang pangalan ng sinaunang pangkat sa halip na agad ipakahulugang 'mga higante.'
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Likas na makabagong panawag-pansin na nagpapanatili sa demonstratibong lakas ng Hebreo.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: ang higaan niya ay isang higaan
  rationale: Pinananatili ang pag-uulit ng pangngalan; ang 'higaan' ang pinakanatural na kahulugan sa konteksto ng mga sukat.
- source_word: בַּרְזֶל
  choice: bakal
  rationale: Tuwirang katumbas ng materyal na binanggit.
- source_word: הֲלֹה הִוא
  choice: Hindi ba ... iyon?
  rationale: Pinananatili ang retorikal na tanong na umaapela sa isang kilalang bagay at lokasyon.
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: nasa Raba iyon, sa lupain ng mga Ammonita
  rationale: Malinaw at natural sa Filipino; ipinakikitang ang Raba ay kaugnay ng mga Ammonita.
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: siyam na siko ... apat na siko
  rationale: Pinananatili ang sinaunang yunit upang maiwasan ang huwad na katiyakan sa modernong conversion.
- source_word: בְּאַמַּת אִישׁ
  choice: ayon sa siko ng isang tao
  rationale: Malapit sa literal na Hebreo at pinananatili ang posibleng di-tiyak na kahulugan; inilalagay sa talababa ang idiomatikong alternatibo.
theological_decisions:
- issue: Kung ang הָרְפָאִים ay isasaling 'mga higante' o pananatilihing pangalan ng pangkat
  choice: mga Refaim
  alternative: mga higante
  rationale: Ang Hebreo ay maaaring pangalan ng isang sinaunang pangkat na iniuugnay sa pambihirang laki. Ang transliterasyon ay hindi nag-aangkat ng interpretasyon sa pangunahing teksto.
- issue: Kung ang עֶרֶשׂ ay higaan o isang kabaong/bier
  choice: higaan
  alternative: kabaong o himlayan ng patay
  rationale: Ang karaniwang kahulugan at ang pagbanggit sa mga sukat bilang patunay ng laki ni Og ay mas natural na tumutukoy sa higaan, bagaman may iminungkahing kahulugang panlibing.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Refaim,' 'Raba,' at 'Ammonita' bilang madaling basahing anyo ng mga pangalang pantangi; pinanatili ang 'siko' bilang sinaunang sukat. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
