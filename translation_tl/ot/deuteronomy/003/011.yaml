revisions:
- from: Sapagkat si Og lamang, na hari ng Basan, ang natira sa nalabi sa mga Refaim.[a] Tingnan ninyo, ang higaan niya ay isang higaang bakal. Hindi ba nasa Raba iyon, sa lupain ng mga Ammonita? Siyam na siko ang haba nito at apat na siko ang lapad,[b] ayon sa siko ng isang tao.
  to: Sapagkat si Og lamang, na hari ng Basan, ang natira sa nalabi sa mga Refaim.[a] Narito, ang higaan niya ay isang higaang bakal. Hindi ba iyon ay nasa Raba ng mga Ammonita? Siyam na siko ang haba nito at apat na siko ang lapad,[b] ayon sa siko ng isang tao.
  rationale: Inalis ang di-kinakailangang dagdag na “lupain” upang maging mas malapit ang lokasyong parirala sa Hebreo. Pinalitan ang pantawag-pansin ng neutral na “Narito.” Walang binago sa kahulugan ng talata, sa pananatilì ng Refaim bilang pangalan, o sa sinadyang di-katiyakan ng “ayon sa siko ng isang tao.”
