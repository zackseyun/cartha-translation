  text: יָאִ֣יר בֶּן מְנַשֶּׁ֗ה לָקַח֙ אֶת כָּל חֶ֣בֶל אַרְגֹּ֔ב עַד גְּב֥וּל הַ/גְּשׁוּרִ֖י וְ/הַ/מַּֽעֲכָתִ֑י וַ/יִּקְרָא֩ אֹתָ֨/ם עַל שְׁמ֤/וֹ אֶת הַ/בָּשָׁן֙ חַוֺּ֣ת יָאִ֔יר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: tl
  text: Kinuha ni Jair na anak ni Manases ang buong rehiyon ng Argob, hanggang sa hangganan ng mga Gesureo at mga Maacateo. Tinawag niya ang mga iyon ayon sa sarili niyang pangalan—ibig sabihin, ang Basan—na Havot-Jair[a][b], at iyon pa rin ang tawag hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at tinawag niya ang mga iyon ayon sa sarili niyang pangalan, ang Basan, Havot-Jair.” Siksik ang sintaks ng Hebreo at maaari itong unawain sa bahagyang ibang paraan.'
    reason: alternative_reading
  - marker: b
    text: Ang Havot-Jair ay malamang na nangangahulugang “mga nayon ni Jair” o “mga pamayanang tolda ni Jair.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבֶל
  choice: rehiyon
  rationale: Sa heograpikong kontekstong ito, tumutukoy ang salita sa isang tiyak na sakop o bahagi ng lupain. Natural sa modernong Filipino ang “rehiyon” at malinaw nitong naihahatid ang diwang panteritoryo.
- source_word: אַרְגֹּב
  choice: Argob
  rationale: Pangalan ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: hanggang sa hangganan ng mga Gesureo at mga Maacateo
  rationale: Karaniwang nangangahulugang hangganan o boundary ang גְּבוּל. Ang mga anyong gentiliko ay natural na isinalin bilang mga katawagan sa mga pangkat ng tao.
- source_word: וַיִּקְרָא אֹתָם
  choice: Tinawag niya ang mga iyon
  rationale: Maramihan ang hulaping layon sa Hebreo. Pinanatili ang maramihang “mga iyon” sa halip na gawing isahan, kahit siksik at hindi ganap na malinaw ang kasunod na sintaks.
- source_word: עַל שְׁמוֹ
  choice: ayon sa sarili niyang pangalan
  rationale: Ipinahihiwatig ng idyoma ang pagpapangalan ng isang bagay ayon sa sariling pangalan ng nagbigay-ngalan.
- source_word: אֶת הַבָּשָׁן
  choice: samakatuwid, ang Basan
  rationale: Mahirap at siksik ang sintaks. Ginamit ang panandang appositional upang ipakitang tinutukoy ng parirala ang Basan, nang hindi lubusang pinapawi ang kalabuan.
- source_word: חַוֹּת יָאִיר
  choice: Havot-Jair
  rationale: Gumaganap itong pangalan ng lugar, kaya transliterasyon ang ginamit sa pangunahing teksto. Ipinaliwanag sa talababa ang posibleng kahulugan ng unang bahagi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: at iyon pa rin ang tawag hanggang sa araw na ito
  rationale: Natural na Filipino ito para sa pormulang nagsasaad na nanatili ang pangalan hanggang sa panahon ng tagapagsalaysay.
theological_decisions:
- issue: Hindi malinaw na ugnayan ng maramihang layon, ng Basan, at ng pangalang Havot-Jair
  choice: Pinanatili ang maramihang “mga iyon” at gumamit ng appositional na “samakatuwid, ang Basan.”
  alternative: '“At pinangalanan niya ang mga iyon ayon sa sarili niyang pangalan: ang Basan, Havot-Jair.”'
  rationale: Walang natatanging usaping doktrinal, ngunit mahalagang huwag lutasin nang tahimik ang siksik at maaaring unawain sa higit sa isang paraan na sintaks ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang kinagawiang anyong Filipino ng mga pangalang Manases, Gesureo, Maacateo, at Basan; pinanatili namang transliterado ang Argob at Havot-Jair. Iniwasan ang labis na pagpapakinis sa malabong sintaks ng Hebreo.
