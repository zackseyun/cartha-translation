  source_fidelity: Tumpak na naihahatid ng salin ang pagkuha ni Jair sa buong rehiyon ng Argob, ang saklaw hanggang hangganan ng mga Gesureo at Maacateo, at ang maramihang layon ng וַיִּקְרָא אֹתָם. Gayunman, ang “samakatuwid” ay pangatnig na naghuhudyat ng kongklusyon (“therefore”), hindi appositional na paglilinaw para sa siksik na pariralang אֶת־הַבָּשָׁן. Dapat itong palitan ng “ibig sabihin” upang hindi mabago ang ugnayang sintaktiko.
  naturalness: Natural ang kabuuang rehistro at ang mga pangalang ginamit. Mas natural at mas tapat sa nilalayon ng audit trail ang “ibig sabihin, ang Basan” kaysa “samakatuwid, ang Basan.”
  terminology: Ang “rehiyon,” “hangganan,” “Gesureo,” “Maacateo,” at “Havot-Jair” ay katanggap-tanggap sa modernong Filipino Tagalog. Ang talababa sa Havot-Jair ay naaangkop at maingat na nagmamarka ng di-tiyak na leksikal na kahulugan.
