base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: tl
  text: At ibinigay ko sa kalahati ng lipi ni Manases ang nalalabing bahagi ng Gilead at ang buong Bashan, ang kaharian ni Og—ang buong lupain ng Argob, samakatuwid ay ang buong Bashan. Ang lupaing iyon ay tinatawag na lupain ng mga Rephaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyon, “lupain ng mga higante.” Ang “Rephaim” ay Hebreong katawagan para sa isang sinaunang pangkat na kaugnay ng rehiyong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: ang nalalabing bahagi ng Gilead
  rationale: Ipinahahayag ang natitirang bahagi ng Gilead matapos ang naunang pagbabahagi, sa natural at malinaw na Filipino.
- source_word: כָל הַבָּשָׁן
  choice: ang buong Bashan
  rationale: Pinananatili ang saklaw ng כָל at ang pangalang-pook na Bashan.
- source_word: מַמְלֶכֶת עוֹג
  choice: ang kaharian ni Og
  rationale: Direkta at likas na salin ng pariralang construct na tumutukoy sa teritoryong pinamunuan ni Og.
- source_word: נָתַתִּי
  choice: ibinigay ko
  rationale: Pinananatili ang karaniwang kahulugan ng pandiwa at ang unang panauhang tinig sa konteksto ng pagbabahagi ng lupain.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: sa kalahating lipi ni Manases
  rationale: Malinaw na tumutukoy sa kalahati ng lipi ni Manases na tumanggap ng lupain sa silangan ng Jordan.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: ang buong nasasakupan ng Argob
  rationale: Ang חֶבֶל ay tumutukoy rito sa isang teritoryo o distrito, hindi sa literal na lubid; natural sa Filipino ang 'nasasakupan.'
- source_word: לְכָל הַבָּשָׁן
  choice: ang buong Bashan
  rationale: Inilalahad bilang katabing paglilinaw o pag-uugnay sa nasasakupan ng Argob nang hindi labis na tinutukoy ang eksaktong lohikal na relasyon ng parirala.
- source_word: הַהוּא יִקָּרֵא
  choice: Ang lupaing iyon ay tinatawag na
  rationale: Pinananatili ang demonstratibo at ang pasibong di-ganap na anyo bilang nakagawiang pangalan sa kasalukuyang paglalahad.
- source_word: אֶרֶץ רְפָאִים
  choice: lupain ng mga Rephaim
  rationale: Isinasalin ang רְפָאִים bilang pangalan ng sinaunang pangkat sa halip na agad ipakahulugang 'mga higante.'
theological_decisions:
- issue: Kung isasalin ang רְפָאִים bilang pangalan ng isang pangkat o bilang interpretibong katawagang 'mga higante'
  choice: lupain ng mga Rephaim
  alternative: lupain ng mga higante
  rationale: Gumaganap dito ang salitang Hebreo bilang pangalan ng isang sinaunang pangkat. Ang transliterasyon sa pangunahing teksto ay umiiwas sa labis na pagpapakahulugan, habang inilalagay sa talababa ang tradisyonal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang mga anyong 'Manases,' 'Bashan,' 'Og,' at 'Argob.' Inilagay ang talababa pagkatapos ng 'mga Rephaim,' ang mismong salitang ipinaliliwanag nito.
