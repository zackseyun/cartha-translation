  text: צִידֹנִ֛ים יִקְרְא֥וּ לְ/חֶרְמ֖וֹן שִׂרְיֹ֑ן וְ/הָ֣/אֱמֹרִ֔י יִקְרְאוּ ל֖/וֹ שְׂנִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/009.yaml
  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
translation:
  language: tl
  text: Tinatawag ng mga taga-Sidon ang Hermon na Sirion, at tinatawag naman ito ng mga Amoreo na Senir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִידֹנִים
  choice: mga taga-Sidon
  rationale: Pangmaramihang katawagan sa mga taong mula sa Sidon; natural at malinaw ito sa modernong Filipino.
- source_word: יִקְרְאוּ
  choice: tinatawag
  rationale: Ang Qal imperfect ng קרא na may ל ay nagpapahayag ng pagbibigay ng pangalan; ang aspektong pangkasalukuyan o nakaugaliang gawain ay angkop dito.
- source_word: לְחֶרְמוֹן
  choice: ang Hermon
  rationale: Pangalan ng lugar; hindi idinagdag ang “Bundok” sapagkat wala ito sa Hebreong teksto ng talata.
- source_word: שִׂרְיֹן
  choice: Sirion
  rationale: Pangngalang pantangi na gamit ng mga taga-Sidon para sa Hermon; isinalin sa pamamagitan ng transliterasyon.
- source_word: וְהָאֱמֹרִי
  choice: at ... ng mga Amoreo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang katawagan at sinasamahan ng pandiwang pangmaramihan; kaya likas ang pangmaramihan sa Filipino.
- source_word: יִקְרְאוּ לוֹ
  choice: tinatawag naman ito
  rationale: Tumutukoy ang panghalip sa Hermon; ipinapakita ng “naman” ang kaagapay na paghahambing sa tawag ng mga taga-Sidon.
- source_word: שְׂנִיר
  choice: Senir
  rationale: Pangngalang pantangi na gamit ng mga Amoreo para sa Hermon; pinanatili sa transliterasyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mga taga-Sidon” para sa madaling maunawaang gentilic at “mga Amoreo” bilang nakaugaliang biblikal na pangalan. Walang talababa dahil sapat na malinaw sa pangunahing teksto ang kolektibong diwa at hindi kailangang idagdag ang salitang “Bundok.”
