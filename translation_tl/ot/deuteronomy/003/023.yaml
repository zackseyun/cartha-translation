  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: tl
  text: 'At noong panahong iyon, taimtim akong nagsumamo kay Yahweh[a], at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH.” Tradisyonal na isinasalin bilang “PANGINOON.”'
