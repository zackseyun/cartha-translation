lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: At ... taimtim akong nakiusap
  rationale: Ang hitpael ng חנן ay nagpapahayag ng marubdob na pagsusumamo para sa lingap o awa. Natural sa modernong Filipino ang “taimtim akong nakiusap,” at pinananatili ng “At” ang daloy ng salaysay.
- source_word: אֶל
  choice: kay
  rationale: Sa Filipino, ang direksiyon ng pakiusap patungo sa isang persona ay likas na ipinahahayag sa “nakiusap kay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בָּעֵת הַהִוא
  choice: noong panahong iyon
  rationale: Ito ang natural at tumpak na katumbas sa Filipino ng pariralang tumutukoy sa panahong nabanggit sa konteksto.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa tuwirang pananalitang susunod sa kasunod na talata.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “taimtim” upang maipakita ang tindi ng anyong pandiwa, at pinanatili ang pormulang “na sinasabi” dahil nagpapatuloy ang pangungusap sa susunod na talata.
