translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lunsod” para sa mga pinatibay na sentrong bayan at “bayan” para sa mga pamayanan sa lantad na lupain. Pinanatili ang isahang “pader” at ang dalawahang diwa ng “dobleng pintuan” ayon sa anyo ng Hebreo.
