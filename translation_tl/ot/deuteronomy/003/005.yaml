translation:
  language: tl
  text: Ang lahat ng ito ay mga lunsod na pinatibay, na may mataas na pader, dobleng pintuan, at mga trangka, bukod pa sa napakaraming bayan sa lantad na lupain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga nayon sa bukas na lupain” o “mga bayang walang pader.” Inihahambing ng Hebreo ang mga pamayanang ito sa mga pinatibay na lunsod na kababanggit lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻרוֹת
  choice: pinatibay
  rationale: Tumutukoy ang salita sa mga lunsod na pinalakas upang mahirap salakayin; natural at malinaw sa makabagong Filipino ang “pinatibay.”
- source_word: חוֹמָה גְבֹהָה
  choice: may mataas na pader
  rationale: Pinananatili nito ang isahang anyo ng Hebreo at malinaw na inilalarawan ang tanggulan ng mga lunsod.
- source_word: דְּלָתַיִם
  choice: dobleng pintuan
  rationale: Ang anyong dalawahan sa Hebreo ay tumutukoy sa magkaparis na pinto o dalawang dahon ng pintuan; pinananatili ng “dobleng pintuan” ang detalyeng ito.
- source_word: וּבְרִיחַ
  choice: at mga halang
  rationale: Ang mga halang ang nagsasara at nagpapatibay sa mga pintuan; ginamit ang maramihan bilang likas na kolektibong pagbasa sa talaan ng mga depensa.
- source_word: לְבַד
  choice: bukod pa sa
  rationale: Ipinahihiwatig ng parirala ang karagdagang mga pamayanan bukod sa mga pinatibay na lunsod.
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: mga bayan sa lantad na lupain
  rationale: Inihahayag nito ang mga pamayanang nasa bukas na lupain, kabaligtaran ng mga lunsod na may tanggulan, nang hindi lubusang nilulutas kung ang pangunahing diin ay rural na lokasyon o kawalan ng pader.
- source_word: הַרְבֵּה מְאֹד
  choice: napakaraming
  rationale: Likas at mariing ipinapahayag nito sa Filipino ang napakalaking bilang.
- source_word: כָּל אֵלֶּה עָרִים
  choice: Ang lahat ng ito ay mga lunsod
  rationale: Pinananatili ang diin sa “lahat ng ito” at idinaragdag ang kopulang kailangan sa natural na pangungusap sa Filipino.
