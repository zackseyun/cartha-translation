base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: tl
  text: Pahintulutan mo sana akong tumawid at makita ang mabuting lupaing nasa kabila ng Jordan—ang mabuting kabundukang ito[a] at ang Lebanon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mabuting bundok na ito.” Maaaring tumukoy ang Hebreo sa isang tiyak na bundok o sa bulubunduking rehiyon sa kanluran ng Jordan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: Pakisuyo, hayaan mo akong tumawid
  rationale: Ang cohortative na may נָא ay nagpapahayag ng magalang at marubdob na pakiusap, hindi payak na panghinaharap. Likas sa modernong Tagalog ang “Pakisuyo, hayaan mo akong…”
- source_word: וְאֶרְאֶה
  choice: at makita
  rationale: Ang kasunod na cohortative ay kaugnay ng layunin ng pagtawid; malinaw at natural itong naipapahayag sa “at makita.”
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ang mabuting lupain
  rationale: Pinananatili ng “mabuting lupain” ang teritoryal at tipanang diin ng אֶרֶץ sa Deuteronomio.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: na nasa kabila ng Jordan
  rationale: Ipinapakita nito ang lugar sa kabilang panig ng Jordan mula sa kinaroroonan ni Moises sa silangan ng ilog.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: ang mabuting kaburulang ito
  rationale: Maaaring tumukoy ang הָר sa isang bundok o sa bulubunduking rehiyon. Ang “kaburulan” ay natural na kolektibong heograpikong katawagan sa konteksto, habang inilalaan sa talababa ang tunay na alternatibong singular.
- source_word: וְהַלְּבָנוֹן
  choice: at ang Lebanon
  rationale: Pinananatili ang pangalang-pook at ang pang-angkop na nagpapakilalang tiyak na rehiyon.
theological_decisions:
- issue: 'Heograpikong kahulugan ng הָהָר: isang bundok o bulubunduking rehiyon'
  choice: ang mabuting kaburulang ito
  alternative: ang mabuting bundok na ito
  rationale: Maaaring gamiting kolektibo ang Hebreong singular para sa bulubunduking lupain. Mas malamang ang panrehiyong kahulugan sa paglalarawan ng lupain at sa pagkakaugnay nito sa Lebanon, ngunit hindi inaalis ang posibleng pagtukoy sa isang bundok.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pakisuyo” upang mapanatili ang tono ng pagsusumamo, at ang gitling na em dash upang malinaw na ipakilala ang kasunod na paglalarawan sa mabuting lupain.
