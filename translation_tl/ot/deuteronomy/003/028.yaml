  text: וְ/צַ֥ו אֶת יְהוֹשֻׁ֖עַ וְ/חַזְּקֵ֣/הוּ וְ/אַמְּצֵ֑/הוּ כִּי ה֣וּא יַעֲבֹ֗ר לִ/פְנֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/הוּא֙ יַנְחִ֣יל אוֹתָ֔/ם אֶת הָ/אָ֖רֶץ אֲשֶׁ֥ר תִּרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: tl
  text: Ngunit atasan mo si Josue[a], palakasin mo siya, at patatagin mo ang kanyang loob[b], sapagkat siya ang tatawid sa unahan ng bayang ito, at siya ang magbibigay sa kanila ng lupaing makikita mo bilang mana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “utusan mo si Josue” o “bilinan mo si Josue.” Ang pandiwang Hebreo ay maaaring tumukoy sa pormal na pagbibigay ng tungkulin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gawin mo siyang matapang.” Ang magkaparis na pandiwa ay nagpapahayag ng pagpapalakas at pagpapatapang sa kanya.
    reason: lexical_alternative
  - marker: c
    text: 'Sa Hebreo, causative ang pandiwa: si Josue ang ahenteng magpapangyari upang matanggap ng bayan ang lupain bilang mana. Maaari ring isalin, “at ipamamana niya sa kanila ang lupain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: atasan mo si Josue
  rationale: Ang piel imperative ng צוה ay tumutukoy rito sa pormal na pagbibigay ng tungkulin at pananagutan kay Josue. Natural sa makabagong Filipino ang “atasan” at hindi nito nililimitahan ang diwa sa isang karaniwang utos lamang.
- source_word: וְחַזְּקֵהוּ
  choice: palakasin mo siya
  rationale: 'Pinananatili nito ang causative na diwa ng piel ng חזק: gawin siyang matatag o malakas para sa kanyang tungkulin.'
- source_word: וְאַמְּצֵהוּ
  choice: patatagin mo ang kanyang loob
  rationale: Sa pagkakapares nito sa חזק, ipinahihiwatig ng אמץ ang pagpapatapang at pagpapalakas ng loob. Ang salin ay natural at pinananatili ang pagkakaiba ng dalawang magkaugnay na pandiwa.
- source_word: כִּי הוּא יַעֲבֹר לִפְנֵי הָעָם הַזֶּה
  choice: sapagkat siya ang tatawid sa unahan ng bayang ito
  rationale: Ang עבר ay angkop na “tatawid” sa konteksto ng pagtawid sa Jordan, at ang לִפְנֵי ay pinananatiling “sa unahan,” na maaaring magpahiwatig kapuwa ng posisyon at pamumuno.
- source_word: וְהוּא יַנְחִיל אוֹתָם אֶת־הָאָרֶץ
  choice: at sa pamamagitan niya ay mamanahin nila ang lupain
  rationale: 'Ang hiphil ng נחל ay causative: si Josue ang magiging tagapamagitan o ahente upang matanggap ng bayan ang lupain bilang mana. Iniiwasan ng pariralang ito ang di-natural na literalismong “ipamamana niya sila” habang pinananatili ang causative agency.'
- source_word: אֲשֶׁר תִּרְאֶה
  choice: makikita mo
  rationale: 'Ang imperfect ay natural na hinaharap sa konteksto: pahihintulutan si Moises na makita ang lupa ngunit hindi pasukin ito.'
theological_decisions:
- issue: Ang papel ni Josue sa pagmamana ng Israel sa lupain
  choice: “sa pamamagitan niya ay mamanahin nila”
  alternative: “ibibigay niya sa kanila bilang mana”
  rationale: Pinananatili ng napiling salin ang causative na papel ni Josue nang hindi ipinahihiwatig na siya ang sukdulang pinagmulan o may-ari ng kaloob; siya ang ahenteng mamumuno sa bayan upang angkinin ang mana.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josue,” ang nakaugaliang anyo ng pangalan sa mga saling Tagalog. Ang “bayang ito” at “lupain” ay natural sa biblikal na konteksto nang hindi labis na arkaiko. Inilagay ang mga panandang talababa sa mismong bahaging tinutukoy ng bawat tala.
