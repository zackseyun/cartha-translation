base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: tl
  text: Umakyat ka sa tuktok ng Pisga at itaas mo ang iyong mga mata sa kanluran,[a] sa hilaga, sa timog, at sa silangan. Masdan mo nang sarili mong mga mata, sapagkat hindi ka tatawid sa Jordang ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “patungo sa dagat,” isang karaniwang paraan ng pagtukoy sa kanluran.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring: “hindi ka tatawid sa Ilog Jordang ito.” Sa Hebreo, “ang Jordang ito” lamang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Tuwirang pautos ng עלה na nagpapahayag ng pag-akyat; natural at malinaw sa makabagong Filipino.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: sa tuktok ng Pisga
  rationale: Ang רֹאשׁ ay literal na 'ulo' ngunit sa heograpikong konteksto ay 'tuktok.' Pinanatili ang pangalang Pisga bilang tiyak na pook.
- source_word: וְשָׂא עֵינֶיךָ
  choice: at tumingin ka
  rationale: Ang literal na 'itaas ang iyong mga mata' ay idyomatikong nangangahulugang ituon o ilibot ang tingin. Mas natural sa Filipino ang 'tumingin,' samantalang ang pagbanggit muli sa mga mata ay pinanatili sa kasunod na sugnay.
- source_word: יָמָּה וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  choice: sa kanluran, sa hilaga, sa timog, at sa silangan
  rationale: Malinaw at natural na pagkakasunod ng apat na direksiyon. Ang יָמָּה ay literal na 'patungo sa dagat' ngunit karaniwang tumutukoy sa kanluran.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: Tingnan mo iyon ng sarili mong mga mata
  rationale: Pinananatili ang mariing pag-uulit ng 'mga mata' at ipinahihiwatig ng 'sarili mong' na makikita mismo ni Moises, bagaman hindi niya tatawirin ang Jordan.
- source_word: כִּי לֹא תַעֲבֹר
  choice: sapagkat hindi ka tatawid
  rationale: Ang כִּי ay nagbibigay ng dahilan sa utos; ang 'sapagkat' ay angkop sa marangal ngunit kasalukuyang rehistro. Ang עבר kaugnay ng Jordan ay natural na 'tumawid.'
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: sa Jordang ito
  rationale: Pinanatili ang demonstratibong הַזֶּה ('ito'). Ang anyong 'Jordang ito' ay likas sa Filipino at hindi kinakailangang idagdag ang 'Ilog,' na wala sa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangkaraniwang 'tumingin' sa halip na ang mas literal ngunit hindi gaanong natural na 'itaas ang iyong mga mata'; pinanatili naman ang diin ng Hebreo sa 'sarili mong mga mata.'
