    issue: May idinagdag na “iyon” sa “Tingnan mo iyon ng sarili mong mga mata.”
    rationale: Walang tinutukoy na hayag na bagay ang וּרְאֵה בְעֵינֶיךָ (“at tingnan/masdan mo sa pamamagitan ng iyong mga mata”). Maaaring ipahiwatig ng “iyon” ang isang partikular na tanawin o lupain na hindi tahasang sinabi sa talata.
  - severity: low
    issue: Hindi tumpak ang paglalarawan sa anyong Hebreo sa talababa b.
    rationale: Ang אֶת הַיַּרְדֵּן הַזֶּה ay tuwirang layon, “ang Jordang ito”; ang “sa Jordang ito” ay kinakailangan lamang ng likas na konstruksiyong Filipino pagkatapos ng “tumawid,” hindi literal na anyo ng Hebreo.
