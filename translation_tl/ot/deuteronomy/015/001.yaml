  source_fidelity: Ang pangunahing temporal at legal na diwa ay wastong naihahatid. Gayunman, ang pandiwang Hebreo ay isahang anyo (“ikaw”), kaya mas malapit ang isahang pananalita sa Filipino. Ang שְׁמִטָּה ay dapat manatiling malawak na “pagpapalaya/pagpapatawad” sa pangunahing teksto; ang ugnay nito sa utang ay angkop na nasa tala.
  naturalness: Nauunawaan ang “magpapatupad kayo ng pagpapalaya,” ngunit mas natural at mas tuwirang legal ang “ipatupad mo ang pagpapalaya.” Mas maayos din ang ayos na may “ay” pagkatapos ng panimulang pariralang panahon.
  terminology: Ang “pagpapalaya” ay maaaring manatili bilang malawak na katumbas ng שְׁמִטָּה, bagaman ang tala ay kailangang gumamit ng mas likas na pagpapaliwanag na “pagpapalaya sa utang” kaysa “pagpapalaya mula sa pagkakautang.” Ang mga alternatibong “pagpapawalang-bisa” at “pagpapatawad” ay angkop, kung malinaw na tumutukoy ang tala sa utang.
