translation:
  language: tl
  text: Sa katapusan ng bawat pitong taon ay ipatupad mo ang pagpapalaya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagpapawalang-bisa” o “pagpapatawad.” Ang Hebreong שְׁמִטָּה ay tumutukoy sa pagpapalaya sa utang na itinatadhana ng batas para sa ikapitong taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: Sa katapusan ng
  rationale: Pinananatili nito ang temporal na diwa ng idyomang מִקֵּץ nang hindi tiyak na nilulutas kung eksaktong matapos ang ikapitong taon o sa pagtatapos ng siklo ito isinasagawa.
- source_word: שֶׁבַע שָׁנִים
  choice: bawat pitong taon
  rationale: Bagaman literal na “pitong taon,” ipinahihiwatig ng kontekstong legal ang paulit-ulit na siklo; natural itong ipinapahayag sa Filipino bilang “bawat pitong taon.”
- source_word: תַּעֲשֶׂה
  choice: magpapatupad kayo
  rationale: Ang עשה ay malawak na “gawin,” ngunit dito ay tumutukoy sa pagsasagawa ng isang legal na kaayusan. Ang “magpapatupad” ay natural at pinananatili ang lakas ng utos.
- source_word: שְׁמִטָּה
  choice: pagpapalaya
  rationale: Ang salita ay tumutukoy sa pagpapakawala o pagpapatawad na itinatakda sa ikapitong-taong batas sa utang. Ang “pagpapalaya” ay malawak at hinahayaang linawin ng kasunod na mga talata na mga pagkakautang ang saklaw.
