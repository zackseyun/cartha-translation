translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo” bilang likas na pagtukoy sa bayang Israel na kinakausap, at iniwasang isiksik sa pangunahing teksto ang “utang” upang ang kasunod na konteksto ang magbigay ng espesipikong paliwanag.
