  - severity: low
    issue: Medyo di-likas ang kolokasyong “magpapatupad kayo ng pagpapalaya.”
    rationale: Mas idiomatiko sa modernong Filipino ang “ipatupad mo ang pagpapalaya” para sa isang legal na kautusan.
