base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: tl
  text: Maaari ninyo itong kainin sa inyong mga bayan[a]. Parehong maaaring kumain nito ang mga taong marumi ayon sa ritwal at mga taong malinis ayon sa ritwal[b], tulad ng pagkain sa gasela at usa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa loob ng iyong mga pintuang-bayan,” isang idyoma para sa loob ng mga bayan o lokal na pamayanan.
    reason: cultural_note
  - marker: b
    text: Ibig sabihin, kapuwa maaaring kumain nito ang mga taong marumi ayon sa ritwal at ang mga taong malinis ayon sa ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: sa loob ng inyong mga bayan
  rationale: Literal itong ‘sa loob ng iyong mga pintuang-bayan,’ ngunit idyoma ito para sa mga bayan o lokal na pamayanan. Isinalin ang kahulugan sa natural na modernong Tagalog, at inilagay sa talababa ang Hebreong larawan.
- source_word: תֹּאכֲלֶנּוּ
  choice: ninyo iyon maaaring kainin
  rationale: Ikalawang panauhang panlalaking isahan ang anyong Hebreo, na may panghalip na tumutukoy sa hayop o karne sa naunang konteksto. Ginamit ang inklusibong maramihang ‘ninyo’ para sa likas na pagtukoy sa sambayanan sa Tagalog; ipinahahayag ng ‘maaaring’ ang pahintulot sa konteksto.
- source_word: הַטָּמֵא
  choice: ang maruming ayon sa ritwal
  rationale: Katayuang panritwal, hindi kasamaan sa moral, ang tinutukoy. Nilinaw ito sa teksto upang maiwasan ang karaniwang maling pagkaunawa sa salitang ‘marumi.’
- source_word: וְהַטָּהוֹר
  choice: ang malinis
  rationale: Kabalikat ito ng ‘maruming ayon sa ritwal’ at tumutukoy rin sa katayuang panritwal. Sapat na ang ‘malinis’ dahil malinaw ang pares at may paliwanag sa talababa.
- source_word: יַחְדָּו
  choice: kapuwa
  rationale: Ipinahahayag nito na parehong maaaring makibahagi ang dalawang pangkat, nang hindi ipinahihiwatig na kailangan silang kumain nang sabay.
- source_word: כַּצְּבִי
  choice: gaya ng gasela
  rationale: Karaniwang tumutukoy ang צְבִי sa gasela. Pinananatili ng ‘gaya ng’ ang paghahambing sa hayop na ligaw na maaaring kainin nang walang mga paghihigpit na kaugnay ng handog.
- source_word: וְכָאַיָּל
  choice: at usa
  rationale: Ang אַיָּל ay usa, kung minsan ay partikular na lalaking usa. Ang pangkalahatang ‘usa’ ang pinakamalinaw at pinakanatural na katambal ng ‘gasela.’
theological_decisions:
- issue: Ang ‘marumi’ at ‘malinis’ ay maaaring mapagkamalang mga moral na katangian.
  choice: Tinukoy sa pangunahing teksto ang ‘maruming ayon sa ritwal,’ at ipinaliwanag sa talababa na kapuwa panritwal ang dalawang katayuan.
  alternative: Gamitin lamang ang ‘marumi at malinis’ nang walang paliwanag.
  rationale: Pinananatili nito ang legal at panritwal na kaibhan ng Hebreo nang hindi ginagawang hatol sa moral ang talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga bayan’ sa halip na literal na ‘mga pintuang-bayan’ para sa natural na pagkaunawa, habang pinanatili sa talababa ang larawang Hebreo. Ang ‘gasela’ ay mas tiyak kaysa ‘antilope,’ at ang ‘usa’ ay karaniwang salitang Filipino.
