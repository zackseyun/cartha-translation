  to: 'Mag-ingat ka, baka magkaroon sa puso mo ng masamang kaisipan: “Malapit na ang ikapitong taon, ang taon ng pagpapatawad ng utang[a],” at pagdamutan mo[b] ang mahirap mong kapatid[c] at wala kang ibigay sa kanya. Maaari siyang dumaing laban sa iyo kay Yahweh, at magkakasala ka.'
  rationale: Inayos ang pagsasalin ng שְׁמִטָּה upang malinaw na matukoy ang pagpapatawad ng utang na tinutukoy sa konteksto, habang iniingatan ang mga alternatibo sa talababa. Pinalitan ang “Kapag dumaing siya” ng “Maaari siyang dumaing” upang maipahayag ang inaasahang posibleng bunga ng pagtanggi nang hindi magdagdag ng isang tahasang kondisyunal na konstruksyon. Napanatili ang natural na dinamikong pagsasalin ng idyomang “masamang mata,” kasama ang literal na paliwanag sa talababa.
