language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: tl
  text: 'Mag-ingat ka, baka magkaroon sa puso mo ng masamang kaisipan: “Malapit na ang ikapitong taon, ang taon ng pagpapatawad ng utang[a],” at pagdamutan mo[b] ang mahirap mong kapatid[c] at wala kang ibigay sa kanya. Maaari siyang dumaing laban sa iyo kay Yahweh, at magkakasala ka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taon ng pagpapalaya” o, sa literal na gamit, “taon ng pagpapawalang-bisa.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sumama ang mata mo sa.” Isa itong Hebreong idyoma para sa pagiging maramot o mabigat sa loob na tumulong sa nangangailangan.
    reason: cultural_note
  - marker: c
    text: Ang “kapatid” dito ay tumutukoy sa kapwa kabilang sa pamayanang nakipagtipan, hindi lamang sa kapatid sa laman.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Mag-ingat ka
  rationale: Likas na modernong Tagalog na nagpapanatili sa lakas ng babala at sa ikalawang panauhang isahan.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: magkaroon sa puso mo ng masamang kaisipan
  rationale: Sa konteksto, ang דָבָר na nasa puso at sinusundan ng לֵאמֹר ay isang panloob na kaisipan o balak; ang בְלִיַּעַל ay naglalarawan dito bilang masama, hindi bilang pangalang pantangi.
- source_word: שְׁנַת הַשֶּׁבַע
  choice: ang ikapitong taon
  rationale: Malinaw na tumutukoy sa ikapitong taon ng siklong itinatakda ng kautusan.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: ang taon ng pagpapawalang-bisa
  rationale: Ipinahihiwatig ng שְׁמִטָּה sa kabanatang ito ang pagpapawalang-bisa o pagpapatawad ng obligasyong pinansyal; ang talababa ay nagtatala ng ibang posibleng salin.
- source_word: וְרָעָה עֵינְךָ
  choice: pagdamutan mo
  rationale: Isinasalin nang natural ang Hebreong idyoma ng 'masamang mata' bilang pag-aatubiling tumulong o pagiging maramot, habang itinatala sa talababa ang literal na larawan.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: ang mahirap mong kapatid
  rationale: Pinananatili ng 'kapatid' ang wikang pampamilya ng tipan; nililinaw ng talababa na hindi lamang kapatid sa laman ang tinutukoy.
- source_word: וְלֹא תִתֵּן לוֹ
  choice: at wala kang ibigay sa kanya
  rationale: Likas na Tagalog para sa pagtangging magbigay, nang hindi labis na tinutukoy kung limos o pautang ang hinihingi.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: Kapag dumaing siya laban sa iyo kay Yahweh
  rationale: Ang 'dumaing laban sa iyo' ay nagpapahayag ng apelang naghahanap ng katarungan; ang 'kapag' ay natural na naghahatid ng ibinababang bunga nang hindi ginagawang tiyak na mangyayari ang pagdaing.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: magkakasala ka
  rationale: Natural at tuwirang Tagalog para sa idyomang nagsasabing ang kasalanan ay mapapasaiyo o maibibilang sa iyo.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pangalan ng Diyos ang tuwirang nasa tekstong Hebreo; pinananatili itong Yahweh sa halip na palitan ng isang titulo.
- issue: Kung pananatilihin sa pangunahing teksto ang idyomang 'masamang mata'
  choice: Isalin nang dinamiko bilang 'pagdamutan mo' at ilagay ang literal na idyoma sa talababa
  alternative: sumama ang mata mo sa
  rationale: Hindi likas at maaaring mapagkamalang tumutukoy sa pangkukulam o inggit ang literal na anyo sa modernong Tagalog. Ang 'pagdamutan' ay tumpak na naghahatid ng pagiging maramot sa nangangailangan, habang pinananatili ng talababa ang larawang Hebreo.
- issue: Saklaw ng אָחִיךָ
  choice: kapatid
  alternative: kapwa Israelita
  rationale: Pinananatili ang pampamilyang wika ng orihinal at hindi tahasang nilulutas sa pangunahing teksto ang saklaw nito; nililinaw sa talababa ang gamit nito sa pamayanang nakipagtipan.
- issue: Kahulugan ng שְׁמִטָּה
  choice: pagpapawalang-bisa
  alternative: pagpapalaya
  rationale: Sa konteksto ng Deuteronomio 15, kaugnay ito ng pag-aalis o pagpapatawad ng obligasyong pinansyal. Iniiwasan ng salin ang sobrang paglilimita sa isang teknikal na anyo, at itinatala ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang pang-isahang 'ka/mo' ayon sa tekstong Hebreo. Isinalin nang natural ang idyomang 'masamang mata' ngunit pinanatili ang literal na larawan sa talababa. Ang mga marker na [a], [b], at [c] ay nasa pangunahing teksto at tumutugma sa mga talababa.
