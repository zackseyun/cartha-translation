language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כָּֽל הַ/בְּכ֡וֹר אֲשֶׁר֩ יִוָּלֵ֨ד בִּ/בְקָרְ/ךָ֤ וּ/בְ/צֹֽאנְ/ךָ֙ הַ/זָּכָ֔ר תַּקְדִּ֖ישׁ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֤א תַעֲבֹד֙ בִּ/בְכֹ֣ר שׁוֹרֶ֔/ךָ וְ/לֹ֥א תָגֹ֖ז בְּכ֥וֹר צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: tl
  text: Ang bawat panganay na lalaking isisilang sa iyong bakahan at kawan ay italaga mo kay Yahweh na iyong Diyos.[a] Huwag mong gamitin sa trabaho ang panganay ng iyong baka,[b] at huwag mong gupitan ng balahibo ang panganay ng iyong kawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, YHWH; tradisyonal ding isinasalin na “ang PANGINOON.”
    reason: alternative_reading
  - marker: b
    text: O “huwag mong patrabahuhin ang panganay ng iyong baka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבְּכוֹר
  choice: ang bawat panganay
  rationale: May distributibong diwa ang כָּל kasama ng pang-isahang pariralang הַבְּכוֹר; natural itong ipahayag sa modernong Tagalog bilang “ang bawat panganay.”
- source_word: אֲשֶׁר יִוָּלֵד
  choice: na isisilang
  rationale: Ang Niphal ng ילד ay tumutukoy sa pagiging ipinanganak ng hayop; pinananatili ng “isisilang” ang aspektong hinaharap sa konteksto ng utos.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: sa iyong bakahan at kawan
  rationale: Pinananatili ng “bakahan” ang malaking hayop at ng “kawan” ang mas maliliit na alagang hayop, nang hindi nililimitahan ang צאן sa tupa lamang.
- source_word: הַזָּכָר
  choice: na lalaki
  rationale: Malinaw nitong nililimitahan sa lalaking panganay ang utos, sa natural na ayos ng Tagalog.
- source_word: תַּקְדִּישׁ
  choice: italaga
  rationale: Sa kontekstong panrelihiyon, ang “italaga” ay natural at dignified na katumbas ng Hiphil ng קדש, ibig sabihin ay ibukod bilang banal para sa Diyos.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na iyong Diyos
  rationale: Tuwirang pinananatili ang personal na pangalang יהוה at ang kaugnayang tipan na ipinahahayag ng parirala.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: Huwag mong gamitin sa trabaho ang panganay ng iyong baka
  rationale: Ipinahahayag ng עבד na may kasamang ב ang pagbabawal na gamitin ang hayop sa paggawa; mas malinaw ito sa Tagalog kaysa sa literal ngunit malabong “huwag kang magtrabaho sa.”
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: at huwag mong gupitan ng balahibo ang panganay ng iyong kawan
  rationale: Tumpak na inilalarawan ng “gupitan ng balahibo” ang גזז, habang pinananatili ng “kawan” ang mas malawak na saklaw ng צאן.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang יהוה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang nasa pinagmulan; inilalagay sa talababa ang tradisyonal na pamalit upang kilalanin ang karaniwang paraan ng pagbasa nang hindi pinapalitan ang pangalan sa pangunahing teksto.
- issue: Diwa ng pagtatalaga sa panganay
  choice: italaga
  alternative: ibukod bilang banal
  rationale: Pinananatili ng “italaga” ang kultiko at panrelihiyong diwa ng קדש nang hindi dinaragdagan ang talata ng paliwanag tungkol sa tiyak na ritwal o paraan ng paghahandog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “bakahan at kawan” upang mapanatili ang pagkakaiba ng בקר at צאן, at ang “gupitan ng balahibo” upang maging likas sa Tagalog ang larawang agrikultural.
