base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: tl
  text: Kung ang kapatid mong Hebreo, lalaki man o babae, ay maipagbili sa iyo at maglingkod sa iyo nang anim na taon, sa ikapitong taon ay palalayain mo siya[a] mula sa paglilingkod sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang hulapi sa pandiwang isinaling “palalayain mo siya” ay panlalaking isahan. Matapos banggitin ang lalaking Hebreo o babaeng Hebreo, ginagamit ang anyong ito para sa taong palalayain; saklaw ng batas ang lalaki at babae. Walang gramatikal na kasarian ang Tagalog na “siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּכֵר
  choice: ay ipagbili sa iyo
  rationale: Sinasalamin ang Nifal na pasibong anyo ng מכר nang hindi ipinapalagay kung kusang ipinagbili ng tao ang sarili niya o ipinagbili siya ng iba.
- source_word: אָחִיךָ
  choice: ang kapatid mong
  rationale: Pinananatili ang pampamilya at pangtipang katawagang “kapatid,” sa halip na gawing “kababayan” o “kamag-anak.”
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: Hebreo, lalaki man o babae
  rationale: Ipinahahayag ang magkaparis na panlalaki at pambabaeng anyo ng “Hebreo”; hindi idinaragdag ang salitang “alipin,” na wala sa pariralang ito.
- source_word: וַעֲבָדְךָ
  choice: at maglingkod sa iyo
  rationale: Natural na katumbas ng עבד sa konteksto ng paggawa o paglilingkod sa pinagbilhan.
- source_word: שֵׁשׁ שָׁנִים
  choice: nang anim na taon
  rationale: Tuwirang salin ng takdang haba ng paglilingkod.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: sa ikapitong taon
  rationale: Malinaw at natural na ipinakikita ang kasunod na panahon ng sapilitang pagpapalaya.
- source_word: תְּשַׁלְּחֶנּוּ חָפְשִׁי
  choice: ay palalayain mo siya
  rationale: Ang שלח kasama ng חָפְשִׁי ay tumutukoy sa pagpapauwi o pagpapaalis bilang isang malaya; “palalayain” ang likas na legal na katumbas sa Filipino.
- source_word: מֵעִמָּךְ
  choice: mula sa paglilingkod sa iyo
  rationale: Ang literal na “mula sa piling mo” ay tumutukoy rito sa pagkalagot ng paglilingkod; nililinaw ito sa natural na Filipino nang hindi binabago ang legal na diwa.
theological_decisions:
- issue: Panlalaking panghalip matapos banggitin ang lalaking Hebreo o babaeng Hebreo
  choice: Gamitin ang likas na walang-kasariang panghalip na Filipino na “siya,” na may talababa tungkol sa anyong panlalaki sa Hebreo.
  alternative: Ulitin ang “lalaki man o babae” o gumamit ng mas literal ngunit hindi natural na pagpapahayag ng panlalaking panghalip.
  rationale: Parehong lalaki at babae ang tahasang saklaw ng batas. Walang gramatikal na kasarian ang “siya” sa Filipino, kaya hindi nito maipakikita sa pangunahing teksto ang panlalaking hulapi ng Hebreo; pinananatili ng talababa ang impormasyong iyon at ang tunay na saklaw ng utos.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang “kapatid” bilang mahalagang wikang pampamilya; ginamit ang “Hebreo, lalaki man o babae” upang maging malinaw ang dalawang kasariang tahasang binanggit. Ang “mula sa paglilingkod sa iyo” ay mas natural at mas malinaw kaysa sa literal na “mula sa iyo.”
