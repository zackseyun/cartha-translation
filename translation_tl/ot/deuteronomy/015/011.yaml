base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: tl
  text: 'Sapagkat hindi kailanman mawawala ang dukha sa lupain. Kaya iniuutos ko sa iyo: “Buksan mong lubos ang iyong kamay sa iyong kapatid[a]—sa naghihirap at nangangailangan[b] sa iyong lupain.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kapuwa mo Israelita.” Ang Hebreo ay literal na “sa iyong kapatid,” isang katawagang nagpapahayag ng ugnayang pampamilya at pangtipan.
    reason: lexical_alternative
  - marker: b
    text: Ang dalawang salitang Hebreo ay maaaring tumukoy sa taong mahirap, aba, pinahihirapan, o nangangailangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang utos at natural ang ugnayang ito sa modernong Tagalog.
- source_word: לֹא יֶחְדַּל אֶבְיוֹן
  choice: hindi mawawala ang dukha
  rationale: Ang negatibong imperfect ay nagsasaad ng nagpapatuloy na realidad; kolektibo o pangkalahatan ang singular na אֶבְיוֹן.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: sa lupain
  rationale: Tumutukoy ang הָאָרֶץ sa lupaing tipan sa konteksto ng Deuteronomio. Hindi na tahasang isinalin ang idiomatikong 'mula sa gitna' upang maging natural sa Tagalog nang hindi nawawala ang diwa.
- source_word: עַל כֵּן אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: 'Kaya iniuutos ko sa iyo:'
  rationale: Pinananatili ng 'Kaya' ang lohikal na bunga at ng kasalukuyang anyong 'iniuutos' ang tuwirang diin; natural na kinakatawan ng tutuldok ang לֵאמֹר.
- source_word: פָּתֹחַ תִּפְתַּח אֶת יָדְךָ
  choice: Buksan mong lubos ang iyong kamay
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapalakas sa utos. Pinananatili ang metapora ng bukás na kamay para sa pagkabukas-palad.
- source_word: לְאָחִיךָ
  choice: sa iyong kapatid
  rationale: Pinananatili ang wikang pampamilya at pangtipan ng Hebrew; maaaring kumatawan ito sa kapuwa Israelita.
- source_word: לַעֲנִיֶּךָ וּלְאֶבְיֹנְךָ
  choice: sa naghihirap at nangangailangan
  rationale: Ang עָנִי ay maaaring tumukoy sa mahirap, aba, o pinahihirapan, samantalang ang אֶבְיוֹן ay mahirap o nangangailangan. Ang magkaibang salin ay nagpapanatili sa pagkakaiba ng magkaparis na termino.
- source_word: בְּאַרְצֶךָ
  choice: sa iyong lupain
  rationale: Pinananatili ang partikular na konteksto ng lupaing ipinagkaloob sa Israel.
theological_decisions:
- issue: Saklaw ng katawagang pangkamag-anakan
  choice: sa iyong kapatid
  alternative: sa kapuwa mo Israelita
  rationale: Ang literal na 'kapatid' ay nagpapanatili sa wikang pangtipan at pampamilya, habang nililinaw sa talababa ang kinatawang gamit nito.
- issue: Saklaw ng הָאָרֶץ at אַרְצֶךָ
  choice: lupain / iyong lupain
  alternative: daigdig / iyong bansa
  rationale: Sa agarang konteksto ng Deuteronomio, ang tinutukoy ay ang lupaing tipan, hindi ang buong daigdig bilang abstraktong pangkalahatang pahayag.
- issue: Pagkakaiba ng עָנִי at אֶבְיוֹן
  choice: naghihirap at nangangailangan
  alternative: dukha at mahirap
  rationale: Pinananatili ang semantikong pagsasanib ngunit hindi ginagawang ganap na magkasingkahulugan ang dalawang katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metapora ng pagbubukas ng kamay at ang wikang pangtipan na 'kapatid'; ginamit ang natural na tutuldok sa halip na literal na 'na sinasabi.'
