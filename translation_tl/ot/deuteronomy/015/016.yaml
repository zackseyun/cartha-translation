  footnotes:
  - marker: a
    text: Maaari ring isalin, “Hindi ako lalabas mula sa iyo,” “Hindi kita iiwan,” o “Ayaw kong lumaya mula sa iyo.” Literal na sinasabi ng Hebreo, “Hindi ako lalabas mula sa piling mo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan” ay salin ng “bahay” sa diwang tumutukoy sa mga tao at kabuuang buhay sa tahanan, hindi lamang sa gusali.
