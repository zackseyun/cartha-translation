lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kung
  rationale: Likas na panimulang kondisyon sa makabagong Filipino at pinananatili ang daloy ng batas.
- source_word: יֹאמַר אֵלֶיךָ
  choice: sasabihin niya sa iyo
  rationale: Ang imperfect sa kasong legal ay tumutukoy sa maaaring mangyari; natural dito ang hinaharap na anyo sa Filipino.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: Ayaw kong umalis sa piling mo
  rationale: Ipinahahayag nang natural ang pagtangging lumisan habang pinananatili ang relasyonal na diwa ng עִם, hindi lamang ang pisikal na paglayo.
- source_word: כִּי אֲהֵבְךָ
  choice: dahil mahal ka niya
  rationale: Malinaw na ipinakikita ang sanhi ng pasiya ng lingkod.
- source_word: וְאֶת בֵּיתֶךָ
  choice: at ang iyong sambahayan
  rationale: Ang בַּיִת ay tumutukoy rito sa mga taong kabilang sa tahanan at sa kabuuang yunit domestiko, hindi lamang sa gusali.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: at dahil mabuti ang kalagayan niya sa piling mo
  rationale: Natural sa Filipino at malapit sa diwang mabuti para sa kanya ang manatiling kasama ng amo.
