  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: tl
  text: Kung may isang dukha sa gitna mo—isa sa mga kapatid mo[b]—sa isa sa mga bayan mo[a], sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos, huwag mong patigasin ang iyong puso at huwag mong ikuyom ang iyong kamay laban sa dukha mong kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “sa isa sa iyong mga pintuang-bayan.” Ang pintuang-bayan ay maaaring tumukoy sa buong bayan o pamayanan.'
    reason: lexical_alternative
  - marker: b
    text: Ang “kapatid” dito ay wikang pampamilya para sa kapwa kasapi ng bayang tipan.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Kung may
  rationale: Ang parirala ay nagbubukas ng isang kondisyong legal; natural sa modernong Tagalog ang “Kung may” habang pinananatili ang kasuistikong anyo.
- source_word: אֶבְיוֹן
  choice: dukha
  rationale: Tumutukoy ito sa taong salat o nangangailangan. Ang “dukha” ay maikli, dignificado, at angkop sa pormal ngunit madaling maunawaang rehistro.
- source_word: מֵאַחַד אַחֶיךָ
  choice: isa sa mga kapatid mo
  rationale: Pinananatili ang talinghagang pampamilya ng Hebreo para sa isang kapwa kasapi ng bayang tipan, sa halip na agad itong ipakahulugang “kapwa Israelita.”
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: sa alinman sa mga bayan mo
  rationale: Literal na “sa isa sa iyong mga pintuang-bayan,” ngunit ang mga pintuang-bayan ay metonimiya para sa mga bayan o pamayanan. Mas malinaw at natural sa Tagalog ang kahulugang “mga bayan,” habang inilalagay sa talababa ang literal na larawan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: נֹתֵן לָךְ
  choice: ibinibigay sa iyo
  rationale: Pinananatili ng pangkasalukuyang anyo ang diwa ng lupa bilang patuloy na kaloob ng Diyos sa Israel.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: huwag mong patigasin ang iyong puso
  rationale: Pinananatili ang malinaw na idyomang Hebreo tungkol sa pagiging manhid o ayaw maawa.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: at huwag mong isara ang iyong kamay
  rationale: Pinananatili ang kongkretong larawan ng kamay na isinasara upang hindi magbigay, sa halip na palitan ito ng mas paliwanag na pananalita.
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: sa dukha mong kapatid
  rationale: Natural itong naghahayag sa Tagalog ng pagtangging magkaloob sa nangangailangang kapatid habang pinananatili ang ugnayang pampamilya.
theological_decisions:
- issue: Saklaw ng katawagang אַחֶיךָ / אָחִיךָ (“kapatid”)
  choice: kapatid / mga kapatid, na tumutukoy sa mga kapwa kasapi ng bayang tipan
  alternative: kamag-anak; kapwa Israelita; kababayan
  rationale: Mahalaga sa talata ang wikang pampamilya sapagkat inilalarawan nitong pananagutang magkakapatid ang paglingap sa loob ng komunidad ng tipan. Hindi pinalalawak o nililimitahan nang higit sa sinasabi ng konteksto.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang “Yahweh” ay tuwirang transliterasyon ng personal na pangalang nasa tekstong Hebreo at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Larawan ng puso at kamay
  choice: panatilihin ang parehong metapora
  alternative: huwag maging manhid at huwag magkait ng tulong
  rationale: Ang Hebreo ay sadyang nag-uugnay ng panloob na saloobin (“puso”) at panlabas na pagkilos (“kamay”). Pinananatili ng salin ang teolohikal at moral na tensiyong iyon nang hindi ito ginagawang paliwanag lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mo/iyo” sapagkat isahan ang kausap sa Hebreo, bagaman kinakatawan nito ang bawat Israelita. Pinanatili ang mga larawang “patigasin ang puso” at “isara ang kamay,” ngunit ginawang tahasan ang metonimikong kahulugan ng “mga pintuang-bayan” sa pangunahing teksto.
