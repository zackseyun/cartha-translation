base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: tl
  text: Maglaan ka nang sagana para sa kanya mula sa iyong kawan, mula sa iyong giikan, at mula sa iyong pisaan ng ubas. Mula sa mga pagpapalang ibinigay sa iyo ni Yahweh na iyong Diyos ay magbigay ka sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: Bigyan mo siya nang sagana
  rationale: Ang Hiphil ng ענק sa kontekstong ito ay tumutukoy sa masaganang paglalaan para sa pinalalayang alipin, at pinatitingkad ng infinitive absolute na kasama ng pandiwang may takdang anyo ang utos. Likas at malinaw sa modernong Tagalog ang “bigyan ... nang sagana.”
- source_word: מִצֹּאנְךָ
  choice: mula sa iyong kawan
  rationale: Ang צאן ay kolektibong tawag sa maliliit na hayop na inaalagaan, lalo na sa mga tupa at kambing. Pinananatili ng “kawan” ang kolektibong diwa at larawang agrikultural.
- source_word: וּמִגָּרְנְךָ
  choice: mula sa iyong giikan
  rationale: Ang גֹּרֶן ay literal na giikan at metonimikong tumutukoy sa ani ng butil. Pinananatili ng salin ang kongkretong larawan ng Hebreo.
- source_word: וּמִיִּקְבֶךָ
  choice: mula sa iyong pisaan ng ubas
  rationale: Ang יֶקֶב ay pisaan o sisidlan ng katas ng ubas. Ang “pisaan ng ubas” ay malinaw sa karaniwang mambabasa at kaayon ng larawang agrikultural ng talata.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: mula sa ipinagpala sa iyo ni Yahweh na iyong Diyos
  rationale: Pinananatili nito ang Diyos bilang pinagmulan ng tinatamasang pagpapala at ang kaugnayan ng ibibigay sa naunang pagpapala, nang hindi tahasang nilulutas kung ang parirala ay pangunahing tumutukoy sa pinagmulan o sukat ng kaloob.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: תִּתֶּן לוֹ
  choice: ay magbigay ka sa kanya
  rationale: Pinananatili ng pangwakas na sugnay ang muling pagbanggit sa obligasyong magbigay at ang di-tuwirang layon na לּוֹ.
theological_decisions:
- issue: Paglalarawan sa kasaganaan ng kaloob sa הַעֲנֵיק תַּעֲנִיק
  choice: Bigyan mo siya nang sagana
  alternative: Tiyak na bigyan mo siya
  rationale: Sa kontekstong ito, ang pandiwang ענק ay higit sa pangkalahatang “magbigay” at tumutukoy sa sapat o masaganang paglalaan sa paglaya; pinatitingkad pa ito ng infinitive absolute. Hindi tinutukoy ng salin ang eksaktong dami, kaya nananatili ang pananagutang naaayon sa pagpapalang natanggap.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “mo/iyong” ayon sa anyong Hebreo. Pinanatili ang magkakatugmang larawang agrikultural ng kawan, giikan, at pisaan ng ubas, pati ang pag-uulit ng utos na magbigay.
