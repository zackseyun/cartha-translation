  to: Maglaan ka nang sagana para sa kanya mula sa iyong kawan, mula sa iyong giikan, at mula sa iyong pisaan ng ubas. Mula sa mga pagpapalang ibinigay sa iyo ni Yahweh na iyong Diyos ay magbigay ka sa kanya.
