base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: tl
  text: Tiyak na magbigay ka sa kanya, at huwag sumama ang loob mo sa pagbibigay mo sa kanya, sapagkat dahil sa bagay na ito ay pagpapalain ka ni Yahweh na iyong Diyos sa lahat ng iyong gawain at sa bawat gawaing isinasagawa ng iyong kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa bawat pagpapadala ng iyong kamay”; ibig sabihin, sa lahat ng iyong pinagkakaabalahan o isinasagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: Talagang magbigay ka
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagpapaiigting sa utos. Likas sa modernong Tagalog ang “talagang” bilang diin, nang hindi idinaragdag ang mas tiyak na ideya ng “sagana” o “bukal-palad.”
- source_word: לּוֹ
  choice: sa kanya
  rationale: Panghalip itong panlalaking isahan na tumutukoy sa nangangailangang kapwa Israelita sa naunang konteksto; natural sa Tagalog ang “sa kanya” at hindi nito kailangang markahan ang kasarian.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: at huwag sumama ang loob mo
  rationale: Pinananatili ng karaniwang idyomang Tagalog ang larawan ng puso/kalooban at naihahayag ang pagdaramdam, pag-aatubili, o sama ng loob sa pagbibigay nang hindi nilulutas sa iisang tiyak na damdamin ang saklaw ng Hebreo.
- source_word: בְּתִתְּךָ לוֹ
  choice: kapag nagbibigay ka sa kanya
  rationale: Ang ב na may infinitive construct ay temporal o sirkumstansiyal; natural itong isalin na “kapag nagbibigay ka sa kanya.”
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: sapagkat dahil dito
  rationale: Malinaw na ipinapahayag ang sanhi at itinuturo ang nabanggit na gawa ng pagbibigay. Ang “dito” ay likas na katumbas ng demonstratibong pariralang Hebreo sa Tagalog.
- source_word: יְבָרֶכְךָ
  choice: pagpapalain ka
  rationale: Karaniwang katumbas ito ng ברך at hindi pinalalawak ang uri o paraan ng pagpapala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Pinananatili nito ang tipanang pagtukoy na “iyong Diyos” kasunod ng banal na pangalan.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: sa lahat ng iyong gawain
  rationale: Malawak ang saklaw ng מַעֲשֶׂה para sa ginagawa o nililikha ng isang tao; likas at sapat na malawak ang “gawain.”
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: at sa lahat ng pinagsisikapan ng iyong kamay
  rationale: Pinananatili nito ang larawan ng kamay habang malinaw na tumutukoy sa lahat ng pinag-uukulan ng pagsisikap o isinasagawa ng tao.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulong “PANGINOON.”
- issue: Kasarian ng tumatanggap sa panghalip na לּוֹ
  choice: sa kanya
  alternative: sa taong iyon
  rationale: Panlalaking isahan ang hulaping Hebreo, ngunit likas na hindi minamarkahan ng panghalip na Tagalog na “kanya” ang kasarian. Hindi kailangan ang artipisyal na pagdaragdag ng “lalaki” upang tumbasan ang gramatikal na anyo.
- issue: Ugnayan ng pagbibigay at ng pagpapala
  choice: sapagkat dahil dito ay pagpapalain ka
  alternative: upang pagpapalain ka
  rationale: Sanhi o batayan ang ipinahahayag ng כִּי בִּגְלַל, hindi tahasang layunin. Kaya hindi ginawang kondisyonal na pormula o mekanikal na kapalit ang pagpapala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “huwag sumama ang loob mo” upang natural na maipahayag ang panloob na pag-aatubili o pagdaramdam, at pinanatili ang larawang “kamay” sa huling parirala. Ang tanging talababa ay minarkahan sa pangunahing teksto.
