revisions:
- from: Talagang magbigay ka sa kanya, at huwag sumama ang loob mo kapag nagbibigay ka sa kanya, sapagkat dahil dito ay pagpapalain ka ni Yahweh na iyong Diyos sa lahat ng iyong gawain at sa lahat ng pinagsisikapan ng iyong kamay.[a]
  to: Tiyak na magbigay ka sa kanya, at huwag sumama ang loob mo sa pagbibigay mo sa kanya, sapagkat dahil sa bagay na ito ay pagpapalain ka ni Yahweh na iyong Diyos sa lahat ng iyong gawain at sa bawat gawaing isinasagawa ng iyong kamay.[a]
