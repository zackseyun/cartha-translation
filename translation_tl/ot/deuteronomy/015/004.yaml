  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: tl
  text: Gayunman[a], hindi dapat magkaroon ng dukha sa gitna ninyo, sapagkat tiyak na pagpapalain kayo ni Yahweh sa lupaing ibinibigay sa inyo ni Yahweh na inyong Diyos bilang mana, upang angkinin ito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Subalit” o “Tanging.” Ang Hebreong אֶפֶס ay naglalagay ng paglilimita sa naunang tagubilin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: Gayunman
  rationale: Naghuhudyat ito ng paglilimita o pagbubukod kaugnay ng naunang utos tungkol sa pagpapatawad ng utang. Likas sa makabagong Tagalog ang “Gayunman” at hindi nito pinatitindi nang labis ang pagsalungat.
- source_word: אֶבְיוֹן
  choice: dukha
  rationale: Tumutukoy sa taong salat at nangangailangan dahil sa kalagayang pangkabuhayan. Dignified at malinaw ang “dukha” sa kontekstong ito.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Ang ikalawang כִּי ay nagbibigay ng dahilan: ang tiyak na pagpapala ni Yahweh. Malinaw na ipinahahayag ng “sapagkat” ang ugnayang sanhi.'
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: tiyak na pagpapalain kayo
  rationale: Ang infinitive absolute na sinusundan ng finite verb ay nagbibigay-diin sa kilos. Pinananatili ng “tiyak na pagpapalain kayo” ang diin nang walang idinadagdag na diwa ng kasaganaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatinig ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: נֹתֵן
  choice: ibinibigay
  rationale: Inilalarawan ng participle ang pagkakaloob bilang kasalukuyang isinasagawa o tiyak na nalalapit sa konteksto ng pangakong lupain.
- source_word: נַחֲלָה
  choice: mana
  rationale: Karaniwang salitang tipan para sa lupaing itinakda bilang minanang bahagi. Pinananatili ng “mana” ang legal at teolohikal na pahiwatig nito.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Ang ירשׁ ay tumutukoy sa pagkuha at paghawak ng lupain bilang pag-aari. Natural ang “upang angkinin” kasunod ng “bilang mana” at iniiwasan ang mabigat na pag-uulit.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulong “Panginoon.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo/ninyo/inyo” upang ipakita na ang Hebreong ikalawang panauhan ay tumutukoy sa bayang Israel bilang isang sama-samang kausap. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
