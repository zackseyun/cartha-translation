    rationale: Mas natural na Filipino ang “Maliban na lamang kung,” ngunit dahil ang anyong ito ay maaaring magmungkahi ng kondisyon, mas maingat na ilahad ang literal na alternatibong “Tanging” kasabay ng “Subalit.”
