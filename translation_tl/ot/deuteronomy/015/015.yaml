  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: tl
  text: At alalahanin mong naging alipin ka sa lupain ng Ehipto[a], at tinubos ka ni Yahweh na iyong Diyos[b]; kaya ito[c] ang iniuutos ko sa iyo ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod.” Maaaring tumukoy ang salitang Hebreo sa alipin o lingkod, ngunit mas angkop dito ang “alipin” dahil sa sapilitang pagkaalipin sa Ehipto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinalaya ka sa pamamagitan ng pagtubos.” Ang pandiwang Hebreo ay may diwa ng pagtubos o pagpapalaya mula sa pagkaalipin.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “ang bagay na ito” o “ang usaping ito”; tumutukoy ito sa tagubiling ibinibigay rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: At alalahanin mo
  rationale: Sa kontekstong legal at tipan, ang anyo ay may puwersa ng utos. Ang “alalahanin mo” ay natural at malinaw na pautos sa modernong Tagalog.
- source_word: עֶבֶד
  choice: alipin
  rationale: Bagaman maaari rin itong tumukoy sa isang lingkod, ang pagkaalipin ng Israel sa Ehipto ang nangingibabaw na diwa rito.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang kongkretong pariralang Hebreo na “lupain ng Ehipto” sa natural na Tagalog.
- source_word: וַיִּפְדְּךָ
  choice: tinubos ka
  rationale: Ang פדה ay tumutukoy sa pagtubos o pagpapalaya mula sa pagkaalipin; pinananatili ng “tinubos” ang saklaw at teolohikal na bigat ng salita.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Direktang pinananatili ang pangalang tipan na Yahweh at ang kaugnayang ipinapahayag ng “iyong Diyos.”
- source_word: עַל כֵּן
  choice: kaya
  rationale: Malinaw at natural nitong ipinahahayag ang bunga ng naunang dahilan sa modernong Tagalog.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: ang iniuutos ko sa iyo
  rationale: Ang aspektong nagpapatuloy o kasalukuyan ng participle ay maayos na naipahahayag ng “iniuutos ko.”
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: ito
  rationale: Ang deiktikong “ito” ay natural sa Tagalog at tumutukoy sa tagubiling kasalukuyang ibinibigay, nang hindi sapilitang nililimitahan ang malawak na kahulugan ng דָּבָר.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Sa ganitong pahayag, ang “ngayon” ang natural na katumbas ng Hebreong “sa araw na ito/today” at pinananatili ang pagiging kagyat ng utos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasan ang Tetragrammaton sa tekstong Hebreo; pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Katayuang panlipunan na ipinahahayag ng עֶבֶד
  choice: alipin
  alternative: lingkod
  rationale: Sa alaala ng mapaniil na pagkabihag sa Ehipto, “alipin” ang higit na angkop, ngunit itinatala sa talababa ang mas malawak na saklaw ng salitang Hebreo.
- issue: Diwa ng pagtubos sa פדה
  choice: tinubos
  alternative: pinalaya / tinubos sa pamamagitan ng pantubos
  rationale: Hindi tinutukoy ng talata rito ang eksaktong paraan o halagang ibinayad; ang “tinubos” ay nagpapanatili sa larawan ng pagliligtas mula sa pagkaalipin nang hindi nagdaragdag ng detalye.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mo/iyo” dahil isahan ang kausap sa Hebreo. Pinili ang ayos na “kaya ito ang iniuutos ko” upang maging natural sa Tagalog habang pinananatili ang pagtukoy ng Hebreo sa kasalukuyang tagubilin.
