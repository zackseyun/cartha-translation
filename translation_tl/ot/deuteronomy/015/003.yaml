translation:
  language: tl
  text: Maaari mong singilin ang isang dayuhan,[a] ngunit bitawan mo ang anumang habol mo sa iyong kapatid.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Maaari kang humingi ng bayad sa isang dayuhan.” Ang pandiwang Hebreo ay tumutukoy sa mahigpit na paniningil o paghingi ng kabayaran sa konteksto ng utang.
    reason: lexical_alternative
  - marker: b
    text: Ang “kapatid” dito ay tumutukoy sa kapwa kabilang sa pamayanang tipan ng Israel.
    reason: cultural_note
  - marker: c
    text: Sa literal, “magpapakawala ang iyong kamay.” Ang idyoma ay nangangahulugang bitiwan o patawarin ang habol sa taon ng pagpapalaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: isang dayuhan
  rationale: Ang נָכְרִי ay tumutukoy rito sa taong nasa labas ng pamayanang tipan. Likas sa modernong Tagalog ang “isang dayuhan” at napapanatili nito ang legal at panlipunang pagkakaiba.
- source_word: תִּגֹּשׂ
  choice: maaari mong singilin
  rationale: Sa konteksto ng pagkakautang, ang נגשׂ ay nangangahulugang gipitin o hingan ng bayad ang may utang. Malinaw at natural ang “singilin,” habang ipinahihiwatig ng anyong modal ang pahintulot na kaiba sa utos na magpalaya.
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: anumang pag-aangkin mo
  rationale: Malawak at medyo bukas ang Hebreong parirala, ngunit sa konteksto ng pagpapatawad sa utang ay tumutukoy ito sa anumang karapatan o habol ng nagpautang. Iniiwasan ng salin ang di-likas na literal na “anumang iyo na nasa.”
- source_word: אָחִיךָ
  choice: iyong kapatid
  rationale: Pinananatili ang literal at tipanang katawagang “kapatid” sa halip na ipalit sa pangunahing teksto ang mas interpretibong “kapwa Israelita.”
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: dapat mong bitawan ang ... pag-aangkin mo
  rationale: Literal na inilalarawan ng idyoma ang pagpapakawala ng kamay, ngunit sa batas ng pagpapalaya sa utang ang kahulugan ay bitiwan o pawalang-bisa ang habol. Ang “bitawan” ay nagpapanatili ng konkretong larawan at ang “pag-aangkin” ay nililinaw ang legal na tinutukoy.
theological_decisions:
- issue: Saklaw ng “iyong kapatid” sa batas ng Deuteronomio
  choice: Panatilihin ang “iyong kapatid” sa pangunahing teksto.
  alternative: iyong kapwa Israelita
  rationale: Itinatapat ng talata ang dayuhan sa “kapatid” na kabilang sa pamayanang tipan ng Israel. Pinananatili ng literal na katawagan ang metaporang pampamilya nang hindi inilalagay ang paliwanag sa mismong teksto.
- issue: Lakas ng anyong תִּגֹּשׂ
  choice: 'Isalin bilang pahintulot: “Maaari mong singilin.”'
  alternative: “Singilin mo” o “dapat mong singilin”
  rationale: Sa pagkakatapat nito sa obligasyong magpalaya sa habol laban sa kapatid, ang unang sugnay ay higit na likas unawain bilang pinahihintulutang paniningil, hindi bilang utos na sapilitang maningil.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “singilin” bilang karaniwang legal-pinansiyal na salita, at pinanatili ang “kapatid” upang maingatan ang tipanang metapora. Ang di-likas na literal na ayos ng ikalawang sugnay ay inayos para sa natural na Tagalog, habang ang larawan ng pagbitiw ay bahagyang pinanatili.
