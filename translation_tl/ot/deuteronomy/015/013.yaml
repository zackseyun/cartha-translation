  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: tl
  text: At kapag pinalaya mo siya mula sa iyo[a], huwag mo siyang palayain nang walang dala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At kung palalayain mo siya mula sa iyo.” Maaaring unawain ang pang-ugnay sa Hebreo bilang kondisyonal (“kung”) o temporal (“kapag”).
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: At kapag
  rationale: Maaaring temporal o kondisyonal ang kombinasyong ito. Sa konteksto ng batas na tumitingin sa inaasahang pagpapalaya, natural ang “At kapag,” habang ang “kung” ay inilalagay sa talababa bilang tunay na alternatibo.
- source_word: תְשַׁלְּחֶנּוּ
  choice: pinalaya mo siya / paalisin
  rationale: Ang Piel ng שלח ay literal na tumutukoy sa pagpapaalis o pagpapayaon. Sa unang gamit, malinaw sa konteksto ng paglaya mula sa pagkaalipin ang “pinalaya”; sa ikalawa, natural sa Filipino ang “paalisin” at pinananatili ang diwang pagpapayaon.
- source_word: חָפְשִׁי
  choice: pinalaya
  rationale: Ang חָפְשִׁי ay nangangahulugang malaya, lalo na bilang kabaligtaran ng pagiging alipin. Isinama ito sa pandiwang “pinalaya” upang maging natural at malinaw sa Filipino.
- source_word: מֵעִמָּךְ
  choice: mula sa iyo
  rationale: Direktang katumbas ito ng literal na “mula sa piling mo.” Hindi idinagdag ang “paglilingkod” o “sambahayan,” sapagkat bagaman ipinahihiwatig ng konteksto, wala ang mga iyon sa mismong parirala.
- source_word: לֹא
  choice: huwag
  rationale: Ang “huwag” ang natural at mariing anyo ng pagbabawal sa modernong Filipino at angkop sa legal na konteksto.
- source_word: רֵיקָם
  choice: nang walang dala
  rationale: Ang adberbyong ito ay nangangahulugang walang laman o walang anumang dala. Ang “nang walang dala” ay likas na Filipino at malinaw na tumutukoy sa hindi pagpapayaon sa kanya nang walang ibinigay na panustos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinalaya” upang maipahayag nang natural ang manumission context, ngunit pinanatili ang literal na “mula sa iyo” at ang tunay na kalabuan ng וְכִי sa talababa.
