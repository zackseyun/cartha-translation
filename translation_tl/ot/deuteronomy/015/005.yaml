  text: רַ֚ק אִם שָׁמ֣וֹעַ תִּשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֶ֑י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/005.yaml
  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: tl
  text: tanging kung pakikinggan ninyong mabuti ang tinig ng PANGINOON na inyong Diyos at maingat ninyong susundin ang buong utos na ito na iniuutos ko sa inyo ngayon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: kung ... lamang
  rationale: Ipinahahayag ang mahigpit na kondisyon sa konteksto; pinananatili rin ang himig na “if only” nang hindi ginagawang hiwalay na pangungusap.
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: makikinig ... nang mabuti
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa pakikinig; natural itong naipahahayag sa Tagalog bilang masusing pakikinig.
- source_word: בְּקוֹל יְהוָה אֱלֹהֶיךָ
  choice: sa tinig ng PANGINOON na inyong Diyos
  rationale: Pinananatili ang konkretong idyomang “makinig sa tinig,” na sa konteksto ay may diwang pagsunod. Ginamit ang PANGINOON bilang tradisyonal na anyo para sa banal na pangalang YHWH.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: iingatang gawin
  rationale: 'Pinananatili ang dalawang sangkap: maingat na pagbabantay/pagtalima at aktuwal na paggawa.'
- source_word: אֶת כָּל הַמִּצְוָה הַזֹּאת
  choice: ang buong utos na ito
  rationale: Ang kolektibong isahan na מִצְוָה ay isinalin sa isahan, habang ang כָּל ay ipinahayag bilang “buong.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa inyo ngayon
  rationale: Tuwirang pinananatili ang kasalukuyang pag-uutos at ang temporal na “ngayon.”
theological_decisions:
- issue: Ugnayan ng pakikinig at pagsunod
  choice: Pinanatili ang “makinig sa tinig” at saka ang “iingatang gawin.”
  alternative: Isalin ang pakikinig bilang “susunod.”
  rationale: Bagaman ipinahihiwatig ng Hebreong pakikinig ang pagsunod, tahasang binabanggit din ng talata ang paggawa; ang pagpapanatili sa dalawang parirala ay umiiwas sa pag-aalis ng retorikal na diin.
- issue: Paglalahad sa banal na pangalang יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ang maliit-na-kapital na PANGINOON ay malinaw at dignified na tradisyonal na representasyon ng Tetragrammaton sa saling Filipino, nang hindi nagtatakda ng pinagtatalunang bigkas.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang maramihang “kayo/inyo” sapagkat ang mga hulaping Hebreo sa talata ay panlalaking isahan ngunit tumutukoy kay Israel bilang kolektibong kausap; natural sa Filipino ang maramihang pagtukoy sa bayan. Ang talata ay nakaugnay bilang kondisyong sugnay sa naunang pahayag, kaya nagsisimula ito sa maliit na titik.
