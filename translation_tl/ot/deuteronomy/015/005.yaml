  terminology: Ang "tinig ng PANGINOON na inyong Diyos," "buong utos na ito," at "iniuutos ko sa inyo ngayon" ay angkop at tapat sa pinagmulan. Ang "susundin" ay hindi nagdadagdag ng doktrinal na kahulugan; natural nitong inilalahad ang "ingatan upang gawin" sa konteksto ng utos.
