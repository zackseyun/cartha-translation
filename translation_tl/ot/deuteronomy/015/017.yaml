base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your servant permanently. And you shall do the same for your female servant.
translation:
  language: tl
  text: Pagkatapos, kunin mo ang pambutas at itusok mo ito sa tainga niya at sa pinto. At siya ay magiging alipin mo habang-buhay.[a] Gawin mo rin ito sa iyong aliping babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “magpakailanman” o “permanente.” Sa legal na kontekstong ito, ang Hebreong salita ay maaari ring tumukoy sa panghabambuhay na kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: pambutas
  rationale: Ang מַרְצֵעַ ay matulis na kasangkapang ginagamit sa pagbubutas. Mas madaling maunawaan ng karaniwang mambabasa ang “pambutas” kaysa sa teknikal o di-pamilyar na katawagan.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: itusok iyon sa tainga niya hanggang sa pinto
  rationale: Sa konteksto, ang pambutas ay itinutusok sa tainga na nakadikit sa pinto. Inihahayag ng salin ang pagkilos nang malinaw habang pinananatili ang ugnayan ng tainga at pinto sa Hebreo.
- source_word: עֶבֶד
  choice: alipin
  rationale: Ang “alipin” ang tuwirang modernong Tagalog para sa pormal na kalagayang nakatali sa paglilingkod na tinutukoy ng batas.
- source_word: עוֹלָם
  choice: habang-buhay
  rationale: Sa legal na kontekstong ito, tumutukoy ang עוֹלָם sa panghabambuhay o permanenteng kalagayan, hindi kinakailangang sa walang-hanggang panahon.
- source_word: אֲמָתְךָ
  choice: iyong aliping babae
  rationale: Tumutukoy ang אָמָה sa babaeng alipin. Pinananatili ng “aliping babae” ang kasarian at ang legal na kalagayan ng salita.
- source_word: וְאַף
  choice: rin
  rationale: Malinaw at natural na ipinahahayag ng “rin” ang dagdag na saklaw ng utos sa aliping babae.
- source_word: תַּעֲשֶׂה כֵּן
  choice: Gawin mo rin iyon
  rationale: Natural na Tagalog ito para sa utos na gawin sa gayunding paraan ang naunang ritwal.
theological_decisions:
- issue: Pagtukoy sa kalagayan ng עֶבֶד at אָמָה sa batas ng paglilingkod
  choice: alipin / aliping babae
  alternative: lingkod / babaeng lingkod
  rationale: Ang talata ay tungkol sa pormal at patuloy na pagkakatali sa paglilingkod na pinagtitibay ng isang legal na ritwal. Mas tumpak na pinananatili ng “alipin” ang panlipunan at legal na bigat ng mga terminong Hebreo.
- issue: Tagal na ipinahihiwatig ng עוֹלָם
  choice: habang-buhay, na may talababa
  alternative: magpakailanman / permanente
  rationale: Iniiwasan ng “habang-buhay” ang pahiwatig ng metapisikal na kawalang-hanggan ngunit pinananatili ang panghabambuhay na bisa sa kontekstong legal. Itinatala sa talababa ang tunay na saklaw ng alternatibong pagsasalin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang tuwirang pangalawang panauhang “mo” bilang katumbas ng isahang anyo sa Hebreo. Iniwasan ang sobrang teknikal na bokabularyo at pinanatili ang legal na bigat ng “alipin.”
