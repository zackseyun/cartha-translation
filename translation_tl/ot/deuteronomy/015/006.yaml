base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: tl
  text: Sapagkat pinagpala ka ni Yahweh, ang iyong Diyos, gaya ng ipinangako niya sa iyo[a]. Magpapautang ka sa maraming bansa, ngunit hindi ka manghihiram; mamamahala ka sa maraming bansa, ngunit hindi sila mamamahala sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gaya ng sinabi niya sa iyo.” Literal na “nagsalita” ang Hebreo, ngunit sa konteksto ng tipan ay may diwa itong pangako.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בֵּרַכְךָ
  choice: pinagpala ka
  rationale: Ang pandiwa ay nasa anyong perfect at inilalahad ang pagpapala ng Diyos bilang tiyak at batayan ng mga susunod na kalagayan. Likas sa Tagalog ang “pinagpala ka” rito.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: gaya ng ipinangako niya sa iyo
  rationale: Literal na “gaya ng sinabi niya sa iyo,” ngunit sa konteksto ng tipan, ang pagsasalita ay may diwang pangako. Isinama ang literal na alternatibo sa talababa.
- source_word: וְהַעֲבַטְתָּ
  choice: magpapahiram ka
  rationale: Ang Hiphil ng עבט ay nangangahulugang magpautang o magpahiram. Ang “magpapahiram” ay malinaw at natural sa modernong Tagalog.
- source_word: גּוֹיִם רַבִּים
  choice: maraming bansa
  rationale: Tumutukoy ang parirala sa mga bansa sa pangkabuhayan at pampolitikang ugnayan, kaya mas angkop ang “maraming bansa” kaysa “maraming bayan” o “mga Hentil.”
- source_word: לֹא תַעֲבֹט
  choice: hindi ka manghihiram
  rationale: Ang Qal ng עבט ay katapat ng naunang Hiphil at nangangahulugang mangutang o manghiram. Pinananatili ng “manghihiram” ang malinaw na pagsalungat sa “magpapahiram.”
- source_word: וּמָשַׁלְתָּ
  choice: mamamahala ka sa
  rationale: Ang משל ay tumutukoy sa pamumuno o paggamit ng kapangyarihan. Dignified at madaling maunawaan ang “mamamahala” sa pambansang kontekstong ito.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: hindi sila mamamahala sa iyo
  rationale: Ang pangmaramihang pandiwa ay bumabalik sa “maraming bansa.” Ginawang tahasan ang “sila” upang maging malinaw sa Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan ng Diyos at hindi ito pinapalitan ng titulo.
- issue: Diwa ng דִּבֶּר sa konteksto ng tipan
  choice: ipinangako
  alternative: sinabi; kinausap
  rationale: Bagaman literal na “nagsalita/sinabi,” tumutukoy ito rito sa naunang ipinahayag na pangako ng Diyos. Pinananatili sa talababa ang literal na posibilidad upang hindi maitago ang leksikal na saklaw.
translation_notes:
  register: 'Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang isahang “ka/iyo” ayon sa Hebreo, na kumakatawan sa Israel bilang sambayanan. Pinanatili ang balanseng paralelismo: pagpapahiram laban sa panghihiram, at pamamahala laban sa pagpapasakop.'
