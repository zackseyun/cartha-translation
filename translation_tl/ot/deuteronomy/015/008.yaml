  naturalness: Mas natural at malinaw sa modernong Filipino ang “ibukas mo nang maluwag ang iyong kamay” at “anumang kailangan niya.” Pinananatili ng una ang imaheng Hebreo habang naipahihiwatig ang mariing, bukas-palad na pagkilos.
