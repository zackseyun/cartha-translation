translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang idyomang “ibukas ... ang iyong kamay,” at ginamit ang “pautangin” sa halip na gawing pangkalahatang “bigyan” upang sundan ang tiyak na diwa ng Hebreong עבט.
