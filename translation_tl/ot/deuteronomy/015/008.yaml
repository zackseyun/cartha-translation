translation:
  language: tl
  text: Sa halip, ibukas mo nang maluwag ang iyong kamay sa kanya, at pautangin mo siya nang sapat para sa anumang kailangan niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “buksan, tiyak na bubuksan mo ... pautangin, tiyak na papautangin mo”—inuulit ang anyo ng pandiwa upang magbigay-diin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sa halip
  rationale: Sa konteksto, ipinakikita ng sugnay ang dapat gawin bilang pagsalungat sa pagpapatigas ng puso at pagkakait sa naunang talata.
- source_word: פָתֹחַ תִּפְתַּח
  choice: talagang ibukas mo
  rationale: Ang infinitive absolute na sinusundan ng imperfect ay nagbibigay-diin sa utos. Likas sa Filipino ang “talagang” upang ihayag ang diin, habang pinananatili ng “ibukas ... ang iyong kamay” ang konkretong idyomang Hebreo tungkol sa pagiging bukas-palad.
- source_word: יָדְךָ
  choice: ang iyong kamay
  rationale: Pinananatili nito ang literal at malinaw na larawan ng bukas-palad na pagbibigay.
- source_word: לוֹ
  choice: sa kanya
  rationale: Tuwirang ipinakikilala ang dukhang kapatid bilang tatanggap ng bukas na kamay at ng pautang.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: at pautangin mo siya
  rationale: Ang pandiwang עבט sa causative ay tumutukoy sa pagpapautang. Ang obligasyon at diin ng magkaparis na konstruksiyong Hebreo ay naipahahayag ng kabuuang pautos na pangungusap at ipinaliliwanag sa talababa.
- source_word: דֵּי
  choice: nang sapat
  rationale: Tumutukoy ito sa kasapatan—ang halagang makatutugon sa pangangailangan.
- source_word: מַחְסֹרוֹ אֲשֶׁר יֶחְסַר לוֹ
  choice: para sa anumang kakulangan niya
  rationale: Pinananatili ang ideya ng kakulangan at ang malawak na saklaw ng relative clause nang hindi nagiging mabigat o paulit-ulit sa modernong Filipino.
