  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: tl
  text: Ngunit huwag mong kainin ang dugo nito; ibuhos mo iyon sa lupa na parang tubig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Ipinahihiwatig ang paghihigpit o eksepsiyon sa naunang pahintulot. Natural sa Filipino ang “Ngunit” sa ugnayang ito, bagaman taglay rin ng Hebreo ang diwang “lamang.”
- source_word: אֶת דָּמוֹ
  choice: ang dugo nito
  rationale: Tuwirang tumutukoy sa dugo ng hayop. Hindi ginamit ang mas mapagpakahulugang “dugong-buhay” sapagkat dugo lamang ang tahasang binanggit.
- source_word: לֹא תֹאכֵל
  choice: huwag mong kainin
  rationale: Karaniwang malinaw at marangal na anyo ng legal na pagbabawal sa modernong Filipino.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Sa konkretong kontekstong ito, tumutukoy sa lupang pagbubuhusan, hindi sa buong daigdig o sa isang teritoryo.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: ibuhos mo iyon
  rationale: Tumpak na inilalarawan ang pagtatapon ng dugo at natural na kaugnay ng kasunod na paghahambing sa tubig.
- source_word: כַּמָּיִם
  choice: na parang tubig
  rationale: Natural na Filipino para sa tuwirang paghahambing ng Hebreo.
theological_decisions:
- issue: Pagtrato sa dugo sa kautusang pandiyeta
  choice: Tuwirang ipinahayag ang pagbabawal na kainin ang dugo at ang utos na ibuhos ito sa lupa.
  alternative: Gamitin ang “dugong-buhay” upang itampok ang kaugnayan ng dugo at buhay.
  rationale: Hindi tahasang ibinibigay ng talatang ito ang teolohikal na paliwanag tungkol sa dugo at buhay; kaya hindi iyon idinagdag sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang isahang ikalawang panauhan upang tumbasan ang mga pandiwang Hebreo. Walang talababa dahil hindi kailangan ng Filipino ang leksikal na alternatibong nasa English POB; ang “ang dugo nito” ay tuwiran at hindi malabo.
