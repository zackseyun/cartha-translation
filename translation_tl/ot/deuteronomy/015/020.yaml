base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: tl
  text: Ikaw at ang iyong sambahayan ay kakain nito taun-taon sa harap ni Yahweh na iyong Diyos, sa lugar na pipiliin ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa presensiya ni Yahweh na iyong Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Likas na katumbas ito ng idyomang Hebreo na maaaring mangahulugang “sa harap” o “sa presensiya”; pinananatili nito ang diwa ng pagkain sa presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay na “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Ang anyong may hulaping ikalawang panauhang panlalaki na isahan ay literal na “iyong Diyos.” Ginamit ang magalang at natural na “inyong” bilang pagtukoy sa kinakausap at sa sambahayan nito.
- source_word: תֹאכֲלֶנּוּ
  choice: Kakainin ninyo ito
  rationale: Ang Qal imperfect na may layong panghalip ay naghahayag ng itinakdang kilos sa kontekstong legal. Ang hinahawakang “ito” ay tumutukoy sa panganay na hayop na binanggit sa naunang talata.
- source_word: שָׁנָה בְּשָׁנָה
  choice: taon-taon
  rationale: Natural at malinaw na Filipino para sa distributibong idyoma na nagsasaad ng taunang pag-uulit.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: sa lugar na pipiliin ni Yahweh
  rationale: Pinananatili ang karaniwang pormulang Deuteronomiko at ang hinaharap na diwa ng imperfect na יִבְחַר.
- source_word: אַתָּה וּבֵיתֶךָ
  choice: kayo at ang inyong sambahayan
  rationale: Ang “sambahayan” ay tumutukoy sa buong yunit ng tahanan at mas tumpak kaysa sa gusaling “bahay” lamang. Ang “kayo” ay marangal at likas sa modernong Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Diwa ng לִפְנֵי sa kontekstong pagsamba
  choice: sa harap ni Yahweh
  alternative: sa presensiya ni Yahweh
  rationale: Kapuwa posible ang mga pagbasa. Ang “sa harap” ay mas malapit sa anyo ng Hebreo at natural pa rin, habang inilalagay sa talababa ang tahasang alternatibong “sa presensiya.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang legal na himig ng utos, ang taunang pag-uulit, at ang pormulang tumutukoy sa lugar na pipiliin ni Yahweh.
