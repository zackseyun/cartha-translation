base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: tl
  text: 'At ito ang tuntunin tungkol sa pagpapatawad ng utang: dapat bitawan ng bawat nagpapautang ang pautang na ibinigay niya sa kanyang kapwa[a]. Hindi niya dapat singilin ang kanyang kapwa o ang kanyang kapatid[b], sapagkat ipinahayag ang pagpapatawad ng utang para kay Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “pagpapatawad ng utang” (Hebreo: shemittah) ay maaari ring isaling “pagbibitaw” o “pagpapawalang-bisa.” Tumutukoy ito sa pormal na pagbitiw sa paghahabol ng utang sa taon ng pamamahinga.'
    reason: lexical_alternative
  - marker: b
    text: Ang “kapatid” dito ay tumutukoy sa kapwa kabilang sa sambayanan ng tipan; maaari rin itong isaling “kapwa Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: tuntunin tungkol sa pagpapatawad ng utang
  rationale: Sa legal na konteksto, ang דְּבַר ay tumutukoy sa tuntuning ipinaliliwanag. Ang שְׁמִטָּה ay ang itinakdang pagbibitaw o pagpapawalang-bisa sa paghahabol ng utang sa taon ng pamamahinga.
- source_word: שָׁמוֹט
  choice: dapat bitawan
  rationale: Ang infinitive absolute ay nagbibigay-diin sa obligasyong bitawan ang paghahabol; natural itong ipinahahayag sa modernong Tagalog sa pamamagitan ng “dapat.”
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: bawat nagpapautang
  rationale: Ang idyoma ay tumutukoy sa taong may legal na paghahabol dahil sa pautang. Ang “nagpapautang” ay malinaw at likas sa Tagalog.
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: ang utang ng kanyang kapwa
  rationale: Ipinahahayag nito ang pautang na ibinigay sa kapwa. Ginawang nominal ang parirala upang maging natural at malinaw sa Tagalog nang hindi dinaragdagan ang saklaw nito.
- source_word: לֹא יִגֹּשׂ
  choice: Huwag niyang singilin
  rationale: Ang pandiwa ay nangangahulugang igiit o hilingin ang pagbabayad. Ang “singilin” ang pinakanatural na legal-ekonomikong katumbas sa Tagalog.
- source_word: רֵעֵהוּ
  choice: kanyang kapwa
  rationale: Ang “kapwa” ay natural na katumbas ng רֵעַ at angkop sa ugnayang panlipunan at pangtipan sa konteksto.
- source_word: אָחִיו
  choice: kanyang kapatid
  rationale: Pinananatili nito ang literal na larawang “kapatid,” habang ipinapaliwanag sa talababa ang mas malawak na kahulugang pangkomunidad.
- source_word: כִּי קָרָא שְׁמִטָּה לַיהוָה
  choice: sapagkat ipinahayag ang pagpapatawad ng utang para kay Yahweh
  rationale: Ang impersonal na perfect na קָרָא ay likas na isinasalin bilang balintiyak na “ipinahayag.” Ang לַיהוָה ay inihayag bilang “para kay Yahweh,” na nagpapanatili sa kaugnayan ng pagpapatawad sa kanya.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng אָחִיו sa batas ng tipan
  choice: kanyang kapatid
  alternative: kapwa Israelita; kababayan
  rationale: Pinananatili sa pangunahing teksto ang kongkretong salitang “kapatid” at hindi tahimik na nilulutas ang panlipunan at pangtipang lawak nito; nililinaw iyon sa talababa.
- issue: Likas na epekto ng שְׁמִטָּה
  choice: pagpapatawad ng utang
  alternative: pagpapaliban ng paniningil; pagkakansela ng utang
  rationale: Ang talata ay malinaw na nagbabawal sa paniningil sa kapwa, ngunit pinagtatalunan kung ang termino mismo ay dapat idiing permanenteng pagkakansela o pormal na pagbibitaw sa paghahabol. Ang salin at talababa ay hindi nagpapanggap na higit na tiyak kaysa sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong legal-ekonomiko (“utang,” “nagpapautang,” “singilin”) habang pinananatili ang larawan ng “kapatid” at ang pangalang Yahweh. Ang “tuntunin” ay mas natural kaysa sa literal na “salita/bagay” sa pambatas na konteksto.
