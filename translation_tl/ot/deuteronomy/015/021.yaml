base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: tl
  text: Ngunit kung may kapintasan ito—pilay o bulag, o anumang malubhang kapintasan—huwag mo itong ihandog bilang sakripisyo kay Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Ngunit kung
  rationale: Ipinahahayag nito ang kondisyong kasalungat ng naunang utos; natural sa Filipino ang “Ngunit kung.”
- source_word: יִהְיֶה בוֹ מוּם
  choice: may kapintasan ito
  rationale: Ang literal na “mayroon dito” ay likas na ipinahahayag sa Filipino bilang pagkakaroon ng kapintasan.
- source_word: מוּם
  choice: kapintasan
  rationale: Tumutukoy sa pisikal na depektong hindi katanggap-tanggap para sa hayop na ihahandog; malinaw at marangal ang “kapintasan.”
- source_word: פִּסֵּחַ
  choice: pilay
  rationale: Karaniwang tuwirang tawag sa hayop na may kapansanan sa paglakad.
- source_word: עִוֵּר
  choice: bulag
  rationale: Tuwirang katumbas ng pisikal na paglalarawan.
- source_word: כֹּל מוּם רָע
  choice: anumang malubhang kapintasan
  rationale: Sa kontekstong ito, inilalarawan ng רָע ang bigat o pagiging di-katanggap-tanggap ng pisikal na kapintasan, hindi kasamaan sa moral na diwa.
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: huwag mo itong ihandog bilang sakripisyo
  rationale: Ang pandiwa ay tumutukoy sa ritwal na pagkatay bilang handog, kaya nililinaw ng parirala ang sakripisyal na diwa at iniiwasang mangahulugan lamang na pumatay.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang tipan at ang tuwirang pakikipag-usap sa Israel.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Diwa ng מוּם רָע
  choice: malubhang kapintasan
  alternative: masamang kapintasan
  rationale: Ang רָע ay maaaring literal na “masama,” ngunit dito ay pisikal at ritwal ang usapin. Ipinahahayag ng “malubha” ang di-katanggap-tanggap na uri ng kapintasan nang hindi ito ginagawang moral na kasamaan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at tuwiran. Ginamit ang isahan at personal na “mo/iyong” upang mapanatili ang anyong pangalawang panauhang panlalaki na isahan ng Hebreo. Ang “ihandog bilang sakripisyo” ay mas natural at mas tiyak kaysa sa simpleng “katayin.”
