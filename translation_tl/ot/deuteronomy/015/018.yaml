base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: tl
  text: Huwag mong mamasamain kapag pinaalis mo siya mula sa iyo bilang malaya, sapagkat sa loob ng anim na taon ay naglingkod siya sa iyo nang katumbas ng doble ng sahod ng isang upahang manggagawa.[a] At pagpapalain ka ni Yahweh na iyong Diyos sa lahat ng iyong gagawin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sapagkat ang anim na taon niyang paglilingkod sa iyo ay nagkakahalaga ng dalawang ulit ng sahod ng isang upahang manggagawa.” Inihahambing ng Hebreong pahayag ang halaga ng kanyang anim na taong paglilingkod sa bayad sa upahang paggawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: Huwag mong mamasamain
  rationale: Ang idyomang Hebreo ay literal na tumutukoy sa pagiging “mahirap sa iyong paningin,” ngunit ang diwa nito ay huwag ituring na mabigat, masama, o nakapanghihinayang ang pagpapalaya. Likas at malinaw sa modernong Tagalog ang “huwag mong mamasamain.”
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי
  choice: kapag hinayaan mo na siyang umalis ... bilang isang taong malaya
  rationale: Ipinahahayag ng parirala ang pagpapayaon o pagpapaalis sa tao sa kalagayang malaya, hindi lamang ang karaniwang pagpapaalis. Pinananatili ng salin ang legal na diwa ng paglaya sa paraang natural sa Tagalog.
- source_word: מֵעִמָּךְ
  choice: mula sa iyo
  rationale: Direktang pinananatili ang relasyonal na parirala nang hindi tahasang dinaragdagan ng “mula sa iyong sambahayan” o “mula sa iyong paglilingkod.”
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: katumbas ng doble ng sahod ng isang upahang manggagawa
  rationale: Ang מִשְׁנֶה ay “doble” o “dalawang ulit,” at ang שְׂכַר שָׂכִיר ay sahod ng upahang manggagawa. Ipinakikita ng “katumbas” na halaga ng paglilingkod ang inihahambing, hindi na literal na tumanggap ng dobleng sahod ang alipin o lingkod.
- source_word: עֲבָדְךָ
  choice: naglingkod siya sa iyo
  rationale: Berbal ang anyo at nakatuon sa paglilingkod na ibinigay sa loob ng anim na taon. Malinaw na sa konteksto ng batas ang nakagapos na kalagayan ng taong tinutukoy.
- source_word: שֵׁשׁ שָׁנִים
  choice: sa loob ng anim na taon
  rationale: Natural na Tagalog para sa tagal ng panahong ipinahahayag ng Hebreong temporal na parirala.
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: At pagpapalain ka ni Yahweh na iyong Diyos
  rationale: Ang sugnay ay isang pangako ng pagpapala. Ginamit ang pangalang “Yahweh” upang katawanin nang tuwiran ang tetragrammaton na יְהוָה.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: sa lahat ng iyong gagawin
  rationale: Malawak at tuwirang katumbas na sumasaklaw sa lahat ng gawain o pagsisikap ng kausap.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalang tipan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa karaniwang titulong “Panginoon” nang hindi nagdaragdag ng sektaryong paliwanag.
- issue: Kung tahasang tatawaging alipin ang taong tinutukoy
  choice: naglingkod siya sa iyo
  alternative: ang iyong alipin ay naglingkod sa iyo; ang iyong lingkod ay naglingkod sa iyo
  rationale: Berbal ang עֲבָדְךָ sa sugnay na ito, kaya pinananatili ang diin sa serbisyong ibinigay. Hindi rin nilulutas sa talatang ito lamang ang lahat ng usapin tungkol sa eksaktong katayuang panlipunan, na makikita sa mas malawak na konteksto ng batas.
- issue: Kahulugan ng paghahambing sa dobleng sahod
  choice: Ang anim na taong paglilingkod ay katumbas ng doble ng sahod ng upahang manggagawa
  alternative: Ang kanyang paglilingkod ay nagkakahalaga ng dalawang ulit ng sahod ng upahang manggagawa
  rationale: Malabo sa pinaikling Hebreong pahayag ang eksaktong batayan ng paghahambing. Iniiwasan ng salin ang maling pahiwatig na binayaran ang taong pinalalaya ng dobleng sahod, habang inilalagay sa talababa ang lehitimong alternatibong paraan ng pagpapahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mamasamain” para sa natural na pagpapahayag ng Hebreong idyoma, at “upahang manggagawa” para sa malinaw na pagkakaiba sa taong pinalalaya. Iniwasan ang lipas o labis na teknikal na bokabularyo.
