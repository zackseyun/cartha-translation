base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: tl
  text: Magpakatatag kayo at magpakatapang. Huwag kayong matakot o masindak dahil sa kanila, sapagkat si Yahweh na inyong Diyos ang siyang sumasama sa inyo. Hindi niya kayo bibitawan[a] ni pababayaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi niya kayo hahayaang bumagsak” o “Hindi niya kayo bibiguin.” Sa Hebreo, ang pandiwa ay maaaring tumukoy sa hindi pagluwag o pagbitaw sa hawak; ipinahihiwatig nito na hindi niya kayo pababayaan sa kanyang pag-alalay.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Magpakatatag kayo at magpakatapang
  rationale: 'Pinananatili ang magkatambal na maramihang pautos: lakas o katatagan, at tapang o matibay na loob. Natural at malinaw ang anyong “magpaka-” sa makabagong Filipino.'
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ
  choice: Huwag kayong matakot o mangilabot
  rationale: Ipinakikita ng ikalawang pandiwa ang mas matinding takot kaysa sa una. Ang “mangilabot” ay likas na Filipino at naghahatid ng sindak nang hindi inuulit lamang ang “matakot.”
- source_word: מִפְּנֵיהֶם
  choice: sa kanila
  rationale: Sa kontekstong ito, ang literal na “mula sa harap nila” ay tumutukoy sa pagkatakot dahil sa kanilang presensiya; maikli at natural ang “sa kanila.”
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: si Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalang יהוה bilang “Yahweh” at ang tipanang ugnayan sa “inyong Diyos.” Bagaman pang-isahan ang hulaping Hebreo, ang kausap sa mga pautos ay sama-samang Israel, kaya natural sa Filipino ang maramihang “inyong.”
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: ang siyang sumasama sa inyo
  rationale: 'Ang “ang siyang” ay nagpapanatili sa diin ng panghalip at participle: siya mismo ang kasama nilang humahayo. Mas natural sa Filipino ang “sumasama” kaysa sa literal na “lumalakad.”'
- source_word: לֹא יַרְפְּךָ
  choice: Hindi niya kayo bibitawan
  rationale: Ang Hiphil ng רפה ay maaaring mangahulugang luwagan ang hawak, pakawalan, o hayaang manghina. Ang “bibitawan” ay nagpapanatili sa konkretong larawan ng hindi pagkakawala ng pag-alalay.
- source_word: וְלֹא יַעַזְבֶךָ
  choice: ni pababayaan
  rationale: Ang עזב ay pag-iwan o pagpapabaya. Ang “pababayaan” ay marangal at karaniwang Filipino, at nananatiling naiiba sa naunang “bibitawan.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya isinasatitik ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Pagpapanatili sa dalawang magkaibang pangako sa לֹא יַרְפְּךָ וְלֹא יַעַזְבֶךָ
  choice: Hindi niya kayo bibitawan ni pababayaan
  alternative: Hindi niya kayo bibiguin ni iiwan
  rationale: 'Pinananatili ng salin ang dalawang kaugnay ngunit hindi lubos na magkaparehong larawan: hindi niya luluwagan ang pag-alalay at hindi niya iiwan. Hindi rin nito pinalalawak ang pangako nang higit sa ipinahihiwatig ng Hebreo.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang panghalip upang tumugma sa kolektibong kausap ng mga pautos, bagaman pang-isahan ang ilang hulaping Hebreo. Iniwasan ang labis na arkaikong pananalita at pinanatili ang diin at pag-uulit ng orihinal.
