    issue: “Mangilabot sa kanila”
    rationale: Bagaman maaari itong magpahiwatig ng matinding takot, maaari rin itong tumukoy sa pagkilabot o pagkasuklam. Ang “masindak dahil sa kanila” ay mas tiyak sa ipinagbabawal na takot at sa lakas ng ערץ.
  - severity: low
    issue: “sa kanila” para sa מִפְּנֵיהֶם
    rationale: Nauunawaan ito bilang pagkatakot sa kanila, ngunit ang “dahil sa kanila” ay mas malinaw na naghahayag ng sanhi o ng kanilang presensiya.
  - severity: low
    issue: 'Paliwanag ng talababa: “hindi pagkakait ng pag-alalay”'
    rationale: Hindi ito likas na pagpapaliwanag sa Filipino at mas malayo sa kongkretong larawan ng pagluwag o pagbitaw. Mas malinaw ang pagtukoy sa hindi pagluwag ng hawak o hindi pag-abandona sa pag-alalay.
