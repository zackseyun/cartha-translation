  text: בְּ/ב֣וֹא כָל יִשְׂרָאֵ֗ל לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר תִּקְרָ֞א אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֛את נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל בְּ/אָזְנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: tl
  text: Kapag dumating ang buong Israel upang humarap kay Yahweh na iyong Diyos sa lugar na pipiliin niya,[a] babasahin mo ang kautusang ito sa harap ng buong Israel upang marinig nila ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “upang makita ang mukha ni Yahweh na iyong Diyos,” isang idyomang nangangahulugang humarap sa kanyang presensiya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא כָל יִשְׂרָאֵל
  choice: Kapag dumating ang buong Israel
  rationale: Ang ב na kasunod ng infinitive construct ay bumubuo ng sugnay na panahunan. Likas sa modernong Tagalog ang “kapag dumating,” at pinananatili ng “buong Israel” ang kolektibong saklaw ng parirala.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: upang humarap kay
  rationale: Sa konteksto ng pagsamba at paglalakbay sa banal na lugar, ang literal na “makita ang mukha” ay idyomang nangangahulugang pumaroon o humarap sa presensiya ng Diyos. Iniiwasan ng saling ito ang maling pahiwatig na literal na makikita ang mukha ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang isinasalin ang hulaping pangalawang panauhang panlalaking isahan, na tumutukoy sa Israel bilang isang kolektibong kausap.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: sa lugar na pipiliin niya
  rationale: Pinananatili nito ang mahalagang tema sa Deuteronomio ng lugar ng pagsamba na Diyos mismo ang pipili. Ang di-ganap na pandiwa ay angkop na isinaling panghinaharap.
- source_word: תִּקְרָא
  choice: babasahin mo
  rationale: Dahil “ang kautusang ito” ang layon at pampublikong pagbigkas ang konteksto, tumutukoy ang קרא sa pagbasa nang malakas. Ang “babasahin mo” ay malinaw at natural.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ang kautusang ito
  rationale: Sa kontekstong ito, tumutukoy ang תּוֹרָה sa tipang tagubilin o batas na ibinigay sa Israel. Ang “kautusan” ay dignified, pamilyar, at mas angkop dito kaysa transliterasyong “Torah.”
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: sa harap ng buong Israel
  rationale: Ipinahahayag nito ang pampublikong pagbasa sa presensiya ng buong kapulungan.
- source_word: בְּאָזְנֵיהֶם
  choice: nang marinig nila
  rationale: Natural na katumbas sa Tagalog ng Hebreong idyomang literal na “sa kanilang mga tainga,” habang pinananatili ang diwang ang kautusan ay bibigkasin nang marinig ng lahat.
theological_decisions:
- issue: Paglalarawan sa paglapit ng Israel sa presensiya ng Diyos
  choice: upang humarap kay Yahweh
  alternative: upang makita ang mukha ni Yahweh
  rationale: Ang literal na anyo ay maaaring magpahiwatig ng aktuwal na pagkakita sa mukha ng Diyos, samantalang sa kontekstong ito isa itong pananalitang pangkulto para sa pagharap sa kanyang presensiya. Nananatili sa talababa ang literal na larawan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “buong Israel” para sa kolektibong bayan, “kautusan” para sa תּוֹרָה sa kontekstong ito, at isang maikling talababa upang mapanatili ang literal na larawang Hebreo nang hindi ginagawang malabo ang pangunahing teksto.
