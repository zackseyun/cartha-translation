  text: Then Moses spoke the words of this song in the hearing of all the assembly of Israel[a], until they were finished.
translation:
  language: tl
  text: Pagkatapos ay binigkas ni Moises sa pandinig ng buong kapulungan ng Israel ang mga salita ng awit na ito hanggang sa matapos ang mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hanggang sa matapos niya ang mga ito”—samakatuwid, hanggang sa makumpleto ni Moises ang pagbigkas ng mga salita ng awit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, binigkas ni Moises
  rationale: Isinusulong ng waw-consecutive ang salaysay, kaya natural ang “Pagkatapos.” Ang “binigkas” ay angkop sa pampublikong pagsasalita ng mga salita ng isang awit at mas tiyak dito kaysa sa pangkalahatang “nagsalita.”
- source_word: בְּאָזְנֵי
  choice: sa pandinig ng
  rationale: Ang literal na “sa mga tainga ng” ay idyomang tumutukoy sa pagsasalitang naririnig ng isang tagapakinig. Pinananatili ng “sa pandinig ng” ang larawan at kahulugan sa natural na Filipino.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: buong kapulungan ng Israel
  rationale: Ang קהל ay ang nagkakatipong sambayanan o kapulungan. Ang “kapulungan” ay malinaw at marangal, at hindi nagdaragdag ng makitid na kahulugang panrelihiyon; ang “buong” ang natural na katumbas ng כָּל sa pariralang ito.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: ang mga salita ng awit na ito
  rationale: Tahasan sa Hebreo ang “mga salita ng awit na ito,” kaya hindi ito pinaikli sa “ang awit na ito.”
- source_word: עַד תֻּמָּם
  choice: hanggang sa matapos ang mga iyon
  rationale: Ang hulaping panlalaking maramihan ay pinakanatural na tumutukoy sa “mga salita.” Inilalahad ng “matapos ang mga iyon” ang pagkakumpleto habang pinananatiling bukas sa talababa ang posibleng aktibong pagbasa na si Moises ang tumapos sa pagbigkas.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kapulungan” para sa sama-samang pagtitipon ng Israel at “binigkas” para sa pampublikong pagsasabi ng komposisyon. Nasa pangunahing teksto ang kinakailangang panandang [a].
