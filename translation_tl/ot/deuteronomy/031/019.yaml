  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: tl
  text: Ngayon, isulat ninyo para sa inyo ang awit na ito at ituro mo ito sa mga anak ni Israel[a] at ilagay mo ito sa kanilang bibig[b], upang ang awit na ito ay maging saksi para sa akin laban sa mga anak ni Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, maramihan ang “isulat ninyo,” ngunit isahan ang kasunod na “ituro mo” at “ilagay mo.” Pinananatili rito ang paglipat na iyon.
    reason: grammatical_ambiguity
  - marker: b
    text: Ang “ilagay sa kanilang bibig” ay larawang Hebreo na nagpapahiwatig na matutuhan nila at mabigkas o maawit ito.
    reason: idiom_clarification
  - marker: c
    text: 'Maaari ring isalin: “sa gitna ng mga anak ni Israel.” Sa kontekstong ito, malamang na ang awit ay magsisilbing saksi laban sa kanila.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Likas sa makabagong Tagalog bilang panandang nag-uugnay at nagpapahayag ng agarang susunod na utos; hindi kailangang gawing mekanikal na “At ngayon.”
- source_word: כִּתְבוּ לָכֶם
  choice: isulat ninyo para sa inyo
  rationale: Pinananatili ang maramihang pautos at ang diwang para sa kapakinabangan o paggamit ng mga kinakausap.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ang awit na ito
  rationale: Ang שִׁירָה ay tuwirang tumutukoy sa isang awit, bagaman patula ang anyo nito.
- source_word: וְלַמְּדָהּ
  choice: Pagkatapos, ituro mo ito
  rationale: Ang hulaping pambabae ay tumutukoy sa pambabaeng pangngalang שִׁירָה; “ito” ang natural na panghalip sa Tagalog. Ang “mo” ay nagpapanatili sa biglang paglipat ng Hebreo mula maramihan tungo sa isahang pautos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tuwirang pinananatili ang pormang Hebreo. Ang “anak” sa Tagalog ay hindi likas na limitado sa lalaki kaya naihahatid nito ang buong sambayanan nang hindi inaalis ang larawang pampamilya.
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: ilagay mo ito sa kanilang bibig
  rationale: Pinananatili ang kongkretong larawang Hebreo para sa pagkatuto at pagbigkas ng awit, sa halip na tahasang ipakahulugang “ipasaulo.”
- source_word: לְמַעַן
  choice: upang
  rationale: Natural at marangal na panandang nagpapahayag ng layunin.
- source_word: תִּהְיֶה לִּי לְעֵד
  choice: maging saksi para sa akin
  rationale: Pinananatili kapuwa ang layuning ipinahihiwatig ng לְמַעַן at ang datibong “para sa akin,” nang hindi ginagawang pag-aari lamang ang saksi.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: laban sa mga anak ni Israel
  rationale: 'Sa kontekstong tipan at paghatol, malamang na adversatibo ang gamit ng ב: ang awit ay sasaksi laban sa Israel. Inilalagay sa talababa ang mas literal na posibilidad na “sa gitna ng.”'
theological_decisions:
- issue: Paglipat mula maramihan tungo sa isahang pautos
  choice: “isulat ninyo” ngunit “ituro mo” at “ilagay mo”
  alternative: Gawing magkakaparehong maramihan ang lahat ng utos
  rationale: Ang tekstong Hebreo mismo ay nagpapalit ng bilang. Hindi tahasang tinutukoy ng salin kung sino ang saklaw ng bawat utos upang hindi lutasin ang isang tunay na tensiyong panggramatika.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang salitang Tagalog na “anak” ay maaaring tumukoy sa babae o lalaki, kaya napapanatili ang literal at pampamilyang wika ng tipan nang hindi ipinahihiwatig na mga lalaki lamang ang tinutukoy.
- issue: Puwersa ng ב sa huling parirala
  choice: laban sa mga anak ni Israel
  alternative: sa gitna ng mga anak ni Israel
  rationale: Pinapaboran ng konteksto ng babala at tipan ang hukumaning diwa na sasaksi ang awit laban sa Israel, ngunit tunay na posible sa anyong Hebreo ang lokatibong pagbasa kaya hindi ito ikinukubli.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang kongkretong larawang “sa kanilang bibig,” ang pampamilyang katawagang “mga anak ni Israel,” at ang kapansin-pansing pagbabago ng bilang sa mga pautos. Ginamit ang “Pagkatapos” upang maging malinaw at natural ang daloy nang hindi dinaragdagan ang teolohikal na nilalaman.
