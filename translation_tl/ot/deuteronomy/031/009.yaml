base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: tl
  text: Kaya isinulat ni Moises ang kautusang ito[a] at ibinigay iyon sa mga paring mula sa angkan ni Levi[b], na nagdadala ng kaban ng tipan ni Yahweh[c], at sa lahat ng mga nakatatanda ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagubiling ito” o “Torah na ito.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Levi”; maaari ring isaling “mga Levita.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, YHWH, ang banal na pangalang tradisyonal na isinasaling “PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: isinulat
  rationale: Tuwirang ipinahahayag ng כתב ang aktuwal na pagsulat; natural at malinaw sa makabagong Filipino ang “isinulat.”
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ang kautusang ito
  rationale: Maaaring mangahulugan ang תּוֹרָה ng kautusan o tagubilin. Sa konteksto ng Deuteronomio, tumutukoy ito sa nakasulat na kalipunan ng mga tuntunin ng tipan; pinananatili ng “kautusan” ang legal at tipanang bigat nito.
- source_word: וַיִּתְּנָהּ
  choice: ibinigay iyon
  rationale: Ang hulaping pambabae ay tumutukoy pabalik sa תּוֹרָה. Ang “ibinigay iyon” ay payak na katumbas at malinaw ang tinutukoy.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: mga paring anak ni Levi
  rationale: Pinananatili nito ang “mga pari” at ang kasunod na pagkakakilanlan sa kanila bilang mga anak o inapo ni Levi, habang nananatiling natural sa Filipino.
- source_word: הַנֹּשְׂאִים
  choice: na nagdadala
  rationale: Inilalarawan ng participle ang mga paring may tungkuling magdala ng kaban. Mas karaniwan at malinaw ang “nagdadala” kaysa sa mas matalinghagang “pasan.”
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: kaban ng tipan ni Yahweh
  rationale: 'Tapat nitong inililipat ang ugnayan ng magkakasunod na pangngalan: ang kaban na kaugnay ng tipan ni Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: lahat ng matatandang pinuno ng Israel
  rationale: Sa kontekstong ito, ang זְקֵנִים ay hindi lamang matatanda sa edad kundi kinikilalang mga pinuno; ipinahahayag iyon nang malinaw ng salin.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng tradisyonal na titulong “PANGINOON.”
- issue: Saklaw ng תּוֹרָה sa talata
  choice: kautusan
  alternative: tagubilin; Torah
  rationale: Ang agarang konteksto ay ang isinulat at ipinagkatiwalang kalipunan ng mga tuntunin ng tipan. Ang “kautusan” ay nagpapanatili sa legal na bigat nang hindi ipinapalagay na tumutukoy na rito ang salita sa buong Pentateuch sa kalaunang teknikal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang maipakita na opisyal na mga elder ng Israel ang tinutukoy, at pinanatili ang payak na daloy ng salaysay.
