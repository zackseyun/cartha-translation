base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/010.yaml
  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: tl
  text: 'Iniutos ni Moises sa kanila: “Sa katapusan ng bawat pitong taon[a], sa takdang panahon ng taon ng pagpapalaya[b], sa Pista ng mga Kubol[c],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa katapusan ng pitong taon.” Ipinahihiwatig ng konteksto ang paulit-ulit na siklo tuwing ikapitong taon.
    reason: lexical_alternative
  - marker: b
    text: Ang “taon ng pagpapalaya” ay tumutukoy sa pagpapawalang-bisa ng mga utang sa ikapitong taon; tradisyonal na tinatawag itong “taon ng pamamahinga.”
    reason: lexical_alternative
  - marker: c
    text: Tradisyonal ding tinatawag na “Pista ng mga Tabernakulo” o “Kapistahan ng mga Tolda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: iniutos
  rationale: Pinananatili nito ang malinaw na puwersa ng pandiwang צוה bilang pagbibigay ng utos.
- source_word: אוֹתָם
  choice: sa kanila
  rationale: Ito ang likas na Tagalog para sa panlalaking pangmaramihang layon; makikilala ang tinutukoy mula sa konteksto.
- source_word: לֵאמֹר
  choice: tuwirang sipi pagkatapos ng kuwit
  rationale: Sa halip na ang di-likas na “na sinasabi,” ipinahihiwatig ng panipi ang tungkulin nito bilang pambungad sa tuwirang pananalita.
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: sa katapusan ng bawat pitong taon
  rationale: Ang מִקֵּץ ay “sa katapusan ng,” at ang “bawat” ay likas na nagpapahayag ng paulit-ulit na siklo na hinihingi ng kontekstong pangkalendaryo.
- source_word: בְּמוֹעֵד
  choice: sa takdang panahon
  rationale: Ang מוֹעֵד ay isang itinakda o tiyak na panahon, kalimitang may kaugnayan sa kapistahan.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: taon ng pagpapalaya
  rationale: Tuwirang isinasalin nito ang diwa ng שְׁמִטָּה bilang pagpapalaya o pagpapatawad, nang hindi agad pinapalitan ng tradisyonal na katawagang “taon ng pamamahinga.”
- source_word: בְּחַג הַסֻּכּוֹת
  choice: sa Pista ng mga Kubol
  rationale: Ang חַג ay pista o kapistahan at ang סֻכּוֹת ay mga kubol; malinaw at madaling maunawaan ang literal na larawan sa Tagalog.
