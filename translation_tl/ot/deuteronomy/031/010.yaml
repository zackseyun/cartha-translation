translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Pista” at “mga Kubol” upang manatiling natural habang malinaw na naipapakita ang larawan sa Hebreo. Pinanatili ang nakabiting pangungusap at kuwit dahil nagpapatuloy ang utos sa susunod na talata.
