base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: tl
  text: 'Sapagkat alam ko ang paghihimagsik mo at ang matigas mong batok[a]. Tingnan ninyo: habang buhay pa ako at kasama ninyo ngayon, patuloy kayong naghihimagsik laban kay Yahweh[b]. Gaano pa kaya kapag namatay na ako!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang matigas mong batok,” isang larawan ng katigasan ng ulo o sadyang pagtangging sumunod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring literal na isaling “kasama ni Yahweh”; sa kontekstong ito, ang diwa ay pagsalungat, kaya “laban kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: ang paghihimagsik mo
  rationale: Pinananatili ang pangngalang tumutukoy sa mapanghamong paglaban, pati ang isahang panlaping tumutukoy sa Israel bilang isang sambayanan.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: ang matigas mong batok
  rationale: Pinananatili ang konkretong metaporang Hebreo para sa katigasan ng ulo, sa halip na palitan agad ng interpretatibong abstraksiyon.
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Isang tuwirang panawag-pansin sa makabagong Tagalog na nagdadala ng diin ng partikula.
- source_word: בְּעוֹדֶנִּי חַי עִמָּכֶם הַיּוֹם
  choice: habang nabubuhay pa akong kasama ninyo ngayon
  rationale: Likas na Tagalog na nagpapanatili sa temporal na diin at sa ideya ng kasalukuyang pakikisama ni Moises sa bayan.
- source_word: מַמְרִים הֱיִתֶם
  choice: patuloy kayong naghihimagsik
  rationale: Ipinahahayag ang nagpapatuloy o nakagawiang kalagayang ipinahihiwatig ng participle na kasama ng היה.
- source_word: עִם יְהוָה
  choice: laban kay Yahweh
  rationale: Bagaman karaniwang nangangahulugang 'kasama' ang עִם, malinaw na pagsalungat ang diwa nito kapag kaugnay ng paghihimagsik.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְאַף כִּי אַחֲרֵי מוֹתִי
  choice: Gaano pa kaya pagkatapos kong mamatay!
  rationale: Likas na retorikal na pahayag sa Tagalog na pinananatili ang pagpapalakas ng hinuha at ang elipsis ng orihinal.
theological_decisions:
- issue: Paglalarawan sa pagrerebelde ng Israel kay Yahweh
  choice: laban kay Yahweh
  alternative: kasama ni Yahweh
  rationale: Hindi nilulutas nang doktrinal ang pahayag; ang konteksto at pandiwang 'naghihimagsik' ang nagpapakitang pagsalungat, hindi pakikisama, ang gamit ng pang-ukol dito.
- issue: Paglalarawan sa katigasan ng Israel
  choice: matigas mong batok
  alternative: katigasan ng ulo mo
  rationale: Pinananatili ang metapora ng pinagmulang teksto upang hindi mawala ang matinding larawan ng kusang pagtangging yumuko o sumunod.
- issue: Pangalan ng Diyos
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang pangalang pantangi na יְהוָה na tahasang nasa tekstong Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang paglipat mula sa isahang “mo,” na tumutukoy sa Israel bilang isang sambayanan, tungo sa maramihang “ninyo/kayo,” na tumutukoy sa mga taong bumubuo rito. Pinanatili rin ang retorikal na bitin ngunit mariing pangwakas ng Hebreo sa likas na anyong Tagalog.
