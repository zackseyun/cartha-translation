  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: tl
  text: At inutusan niya si Josue na anak ni Nun at sinabi, “Magpakatatag ka at lakasan mo ang iyong loob, sapagkat ikaw ang magdadala sa mga anak na lalaki ni Israel[a] sa lupaing ipinangako ko sa kanila sa pamamagitan ng panunumpa, at ako ay makakasama mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita” o “sambayanang Israel.” Sa Hebreo, “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: inutusan
  rationale: Tuwirang ipinahahayag nito ang Piel na kahulugang ‘nag-utos’ at ang taimtim na konteksto ng pagtatalaga.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josue na anak ni Nun
  rationale: Ginagamit ang likas at nakaugaliang anyong Filipino ng pangalan at malinaw na isinasalin ang patronimiko.
- source_word: חֲזַק וֶאֱמָץ
  choice: Magpakatatag ka at lakasan mo ang iyong loob
  rationale: 'Pinananatili ang dalawang magkaugnay na utos: katatagan at lakas ng loob, sa natural na makabagong Tagalog.'
- source_word: כִּי
  choice: sapagkat
  rationale: 'Ipinakikita ang ugnayang sanhi: ang kasunod na tungkulin ang batayan ng pagpapalakas-loob.'
- source_word: תָּבִיא
  choice: magdadala
  rationale: Pinananatili ang causative na diwa ng Hiphil ng בוא; hindi ito nililimitahan sa mas interpretatibong ‘mamumuno.’
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang tahasang pampamilya at panlalaking anyo ng Hebreo; inilalagay sa talababa ang mas karaniwang kolektibong mga katumbas.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Natural sa Tagalog at pinananatili ang temang tipan ng lupaing ipinangako.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: ipinangako ko sa kanila sa pamamagitan ng panunumpa
  rationale: Ang literal na ‘isinumpa ko sa kanila’ ay maaaring magpahiwatig ng sumpa sa Tagalog; malinaw nitong inilalahad ang pangakong pinagtibay ng panunumpa nang hindi idinaragdag ang ‘ibibigay.’
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: at ako ay makakasama mo
  rationale: Pinananatili ang mahalagang pormula ng presensiya at bahagyang diin ng malayang panghalip אָנֹכִי.
theological_decisions:
- issue: Pagpapakahulugan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili sa pangunahing teksto ang pampamilya at gramatikal na anyo ng Hebreo, habang kinikilala sa talababa ang natural na kolektibong kahulugan.
- issue: Di-tahasang simuno ng וַיְצַו / וַיֹּאמֶר
  choice: niya ... sinabi
  alternative: Inutusan ng PANGINOON ... at sinabi
  rationale: Ang mismong talata ay may di-tahasang ikatlong panauhang panlalaking simuno. Hindi idinaragdag ang pangalan ng PANGINOON sa pangunahing teksto, yamang nakikilala ang nagsasalita mula sa konteksto.
- issue: Pormula ng panunumpa אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: ipinangako ko sa kanila sa pamamagitan ng panunumpa
  alternative: isinumpa ko sa kanila; ipinangako kong ibibigay sa kanila
  rationale: Iniiwasan ang maling pakahulugan ng Filipino na ‘isinumpa’ bilang pagkondena, ngunit hindi rin idinaragdag sa teksto ang tahasang ‘ibibigay,’ na wala sa sugnay na Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Josue,’ ang nakaugaliang anyong Filipino ng Joshua. Ang ‘magpakatatag’ at ‘lakasan mo ang iyong loob’ ay natural ngunit nananatiling taimtim; iniwasan ang sobrang arkaikong pananalita.
