base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: tl
  text: Gagawin ng PANGINOON sa kanila ang gaya ng ginawa niya kina Sihon at Og, na mga hari ng mga Amoreo, at sa kanilang lupain, nang lipulin niya sila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginamit ang nakaugaliang salin sa Filipino para sa banal na pangalan, na minarkahan sa malalaking titik.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: ang ginawa niya
  rationale: Natural na Filipino para sa paghahambing na “gaya ng ginawa niya,” habang malinaw na inuugnay ang magiging pagkilos ng PANGINOON sa nauna niyang ginawa.
- source_word: הִשְׁמִיד
  choice: lipulin
  rationale: Ipinahahayag ang matinding kahulugan ng pandiwa—ganap na wasakin o puksain—sa isang dignified at karaniwang terminong biblikal sa Filipino.
- source_word: מַלְכֵי הָאֱמֹרִי
  choice: mga hari ng mga Amoreo
  rationale: Pinananatili ang pangkat-etnikong katawagan at ang maramihang “mga hari,” na tumutukoy kina Sihon at Og.
theological_decisions:
- issue: Kaugnayan ng אֲשֶׁר הִשְׁמִיד אֹתָם sa naunang sugnay
  choice: “nang lipulin niya sila”
  alternative: “na nilipol niya”
  rationale: Maaaring gumana ang אֲשֶׁר bilang pang-ugnay na relasyonal o temporal. Ang “nang” ay umaayon sa konteksto at sa konsultasyong English POB nang hindi binabago ang PANGINOON bilang gumaganap.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinili ang tuwirang ayos ng pangungusap at iniwasan ang labis na arkaikong pananalita.
