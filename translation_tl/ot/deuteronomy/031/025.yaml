  text: Moses commanded the Levites who carried the ark of the covenant of Yahweh[a], saying,
translation:
  language: tl
  text: 'Inutusan ni Moises ang mga Levita na nagdadala ng kaban ng tipan ni Yahweh[a] sa mga salitang ito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “ang mga Levita, na mga tagapagdala ng kaban ng tipan ni Yahweh.” Maaaring gamitin ang Hebreong participle bilang isang mas pormal, tila-pamagat na paglalarawan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Iniutos ... sa
  rationale: Ang pandiwang צוה ay tumutukoy sa pagbibigay ng utos; natural sa Filipino ang hulma na “iniutos ni Moises sa...” kapag sinusundan ng tuwirang pananalita.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Ito ang karaniwan at malinaw na tawag sa Filipino para sa pangkat na mula kay Levi.
- source_word: נֹשְׂאֵי
  choice: na nagdadala
  rationale: Pinananatili nito ang naglalarawang gamit ng Hebreong participle at hindi tiyak na nilulutas kung ito ay kasalukuyang gawain o nakatalagang tungkulin.
- source_word: אֲרוֹן
  choice: kaban
  rationale: Ang “kaban” ang nakaugaliang salin sa Filipino para sa sagradong ark sa konteksto ng tipan at tabernakulo.
- source_word: בְּרִית
  choice: ng tipan
  rationale: Tuwirang inilalarawan nito ang construct phrase na “kaban ng tipan” at pinananatili ang kahalagahang pangtipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pormal at malinaw na panandang nagpapakilala sa tuwirang pananalitang susunod sa kasunod na talata.
theological_decisions:
- issue: Paglalarawan sa mga Levita bilang נֹשְׂאֵי
  choice: mga Levita na nagdadala
  alternative: mga Levita, ang mga tagapagdala
  rationale: Ang “na nagdadala” ay natural sa modernong Filipino at pinananatili ang attributive na participle; inilalagay sa talababa ang mas pormal at tila-titulong pagbasa.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit sa Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Pinanatili ang tradisyonal na terminong “kaban ng tipan,” ang pangalang “Yahweh,” at ang pormulang “na sinasabi” dahil ipinagpapatuloy ang pangungusap sa susunod na talata.
