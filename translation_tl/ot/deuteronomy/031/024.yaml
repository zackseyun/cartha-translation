  text: And when Moses had finished writing the words of this law in a book[a], until they were complete,
translation:
  language: tl
  text: Nang matapos ni Moises isulat ang lahat ng mga salita ng kautusang ito sa isang aklat[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang balumbon.” Ang salitang Hebreo na סֵפֶר ay maaaring tumukoy sa isang nasusulat na dokumento o balumbon, at hindi kinakailangang sa makabagong aklat na may pabalat at pinagsamang mga pahina.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Ang anyong pasalaysay ay nagsisilbing transisyon patungo sa sugnay na temporal. Sa Filipino, likas na naipapahayag ito ng “Nang” nang hindi na kailangang idagdag ang literal na “at nangyari.”
- source_word: כְּכַלּוֹת
  choice: matapos
  rationale: Ang כְּ na kasama ng infinitive construct ng כלה ay bumubuo ng sugnay na temporal at nagpapahiwatig ng pagtatapos ng kilos.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: לִכְתֹּב
  choice: na isulat
  rationale: Ang infinitive construct na may לִ ay tumutukoy sa kilos na tinapos ni Moises; natural sa Filipino ang “matapos ... na isulat.”
- source_word: דִּבְרֵי
  choice: ang mga salita ng
  rationale: Sa kontekstong nakasulat at legal, pinananatili ng “mga salita” ang tuwirang diwa ng דָּבָר at ang diin sa nilalaman ng kasulatan.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: kautusang ito
  rationale: Sa kontekstong tipan at batas ng Deuteronomio, malinaw at likas ang “kautusan,” habang pinananatili ng “ito” ang demonstratibong puwersa.
- source_word: עַל סֵפֶר
  choice: sa isang aklat
  rationale: Maaaring tumukoy ang סֵפֶר sa isang nasusulat na dokumento o balumbon. Ang “sa isang aklat” ay madaling maunawaan, at nililinaw sa talababa ang posibleng sinaunang anyo nito.
- source_word: עַד תֻּמָּם
  choice: hanggang sa makumpleto ang mga iyon
  rationale: Ipinapahayag nito ang lawak ng pagsulat hanggang sa lubos na pagkakatapos; ang “mga iyon” ay hayagang tumutukoy pabalik sa “mga salita.”
