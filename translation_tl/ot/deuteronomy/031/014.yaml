- from: Sinabi ni Yahweh kay Moises, “Masdan mo, nalalapit na ang araw ng iyong kamatayan. Tawagin mo si Josue, at humarap kayong dalawa sa tolda ng tipanan upang atasan ko siya.[a]” Kaya pumunta roon sina Moises at Josue at humarap sila sa tolda ng tipanan.
  to: Sinabi ni Yahweh kay Moises, “Masdan mo, malapit na ang panahon ng iyong kamatayan. Tawagin mo si Josue, at humarap kayong dalawa sa tolda ng tipanan upang atasan ko siya.[a]” Kaya pumunta roon sina Moises at Josue at humarap sila sa tolda ng tipanan.
