  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Masdan mo, malapit na ang panahon ng iyong kamatayan. Tawagin mo si Josue, at humarap kayong dalawa sa tolda ng tipanan upang atasan ko siya.[a]” Kaya pumunta roon sina Moises at Josue at humarap sila sa tolda ng tipanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “utusan ko siya” o “bigyan ko siya ng pormal na tagubilin.” Ang pandiwang Hebreo ay maaaring mangahulugang mag-utos, magbigay ng atas, o magbigay ng pormal na tagubilin; sa kontekstong ito, tumutukoy ito sa atas kay Josue.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הֵן
  choice: Masdan mo
  rationale: Pinananatili nito ang pantawag-pansing lakas ng kataga sa marangal ngunit nauunawaang modernong Tagalog.
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: nalalapit na ang araw ng iyong kamatayan
  rationale: Natural na inililipat sa Tagalog ang Hebreong idyoma tungkol sa paglapit ng mga araw upang mamatay, nang hindi binabago ang kahulugan.
- source_word: קְרָא אֶת־יְהוֹשֻׁעַ
  choice: Tawagin mo si Josue
  rationale: Direkta at natural na katumbas ng pautos na pandiwa; ginamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: וְהִתְיַצְּבוּ
  choice: humarap kayong dalawa
  rationale: Ipinahihiwatig ng hitpael ang pormal na pagharap o paglagay ng sarili sa harapan; nililinaw ng anyong dalawahan sa konteksto na kapwa sina Moises at Josue ang inuutusan.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa tolda ng tipanan
  rationale: Ang מוֹעֵד ay tumutukoy sa itinakdang pakikipagtagpo; ang tradisyonal at malinaw na pariralang Tagalog ay angkop sa santuwaryong ito.
- source_word: וַאֲצַוֶּנּוּ
  choice: upang atasan ko siya
  rationale: Ang 'atasan' ay nagpapanatili sa saklaw na utusan o bigyan ng pormal na tagubilin, nang hindi labis na nilulutas kung ito ay simpleng utos o pormal na pagtatalaga.
- source_word: וַיֵּלֶךְ מֹשֶׁה וִיהוֹשֻׁעַ
  choice: Kaya pumunta roon sina Moises at Josue
  rationale: Ipinakikita ng 'Kaya' ang pagsunod sa naunang utos; ang 'roon' ay natural na tumutukoy sa binanggit na tolda.
- source_word: וַיִּתְיַצְּבוּ
  choice: humarap sila
  rationale: Pinananatili ang ugnayan sa naunang pautos at ang pormal na diwa ng pagharap sa presensiya ni Yahweh.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng צוה sa atas kay Josue
  choice: atasan ko siya
  alternative: utusan ko siya o italaga ko siya
  rationale: Maaaring tumukoy ang pandiwa sa pag-uutos, pagbibigay ng atas, o pormal na pagkakatiwala ng tungkulin. Ang 'atasan' ay akma sa konteksto at hindi nagsasara sa tunay na leksikal na lawak.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang banal na pangalang Yahweh at ang pormal na himig ng tagpo. Ang 'tolda ng tipanan' ay ginamit bilang likas at pamilyar na tawag sa אֹהֶל מוֹעֵד.
