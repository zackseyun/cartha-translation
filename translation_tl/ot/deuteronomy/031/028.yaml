base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: tl
  text: Tipunin ninyo sa aking harapan ang lahat ng matatanda ng inyong mga lipi at ang inyong mga opisyal, upang salitain ko sa harap nila ang mga salitang ito at tawagin kong mga saksi laban sa kanila ang langit[a] at ang lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga langit at lupa.” Ang pananalitang Hebreo ay isang nakaugaliang pormula sa Deuteronomio para sa mga saksi sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהִילוּ
  choice: Tipunin ninyo
  rationale: Ang Hiphil na pautos na maramihan ng קהל ay humihiling sa maraming kausap na tipunin ang mga pinuno; malinaw at likas sa modernong Tagalog ang “Tipunin ninyo.”
- source_word: אֵלַי
  choice: sa akin
  rationale: Tuwirang ipinapahayag nito ang direksiyon patungo kay Moises, ayon sa karaniwang kahulugan ng pang-ukol at hulaping unang panauhan.
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: ang lahat ng nakatatanda sa inyong mga lipi
  rationale: Tumutukoy ito sa kinikilalang matatandang lider ng bawat lipi. Pinananatili ng “mga nakatatanda” ang katawagan nang hindi nagdaragdag ng mas tiyak na titulong wala sa Hebreo.
- source_word: שֹׁטְרֵיכֶם
  choice: ang inyong mga opisyal
  rationale: Sa kontekstong administratibo ng Deuteronomio, malawak ang saklaw ng שֹׁטְרִים; ang “mga opisyal” ay mas angkop kaysa sa makitid na “mga eskriba.”
- source_word: וַאֲדַבְּרָה
  choice: upang sabihin ko
  rationale: Ipinahahayag ng cohortative ang layunin ni Moises matapos tipunin ang mga lider; natural na naihahatid ito ng “upang.”
- source_word: בְּאָזְנֵיהֶם
  choice: sa kanilang pandinig
  rationale: Pinananatili nito ang diwang maririnig nila mismo ang sasabihin, habang iniiwasan ang di-likas na literal na “sa kanilang mga tainga.”
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Ang דְּבָרִים ay tumutukoy rito sa mga salitang bibigkasin ni Moises, kaya mas tiyak ang “mga salita” kaysa “mga bagay.”
- source_word: וְאָעִידָה בָּם
  choice: at tawagin kong mga saksi laban sa kanila
  rationale: Ipinahahayag nito ang legal at tipanang diwa ng Hiphil ng עוּד kasama ng בָּם, nang hindi pinapahina tungo sa simpleng pagbababala.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ang langit at ang lupa
  rationale: Ito ang likas at maringal na anyo sa Tagalog ng nakaugaliang pormula ng mga saksi sa tipan; maaaring unawain ang Hebreong שָּׁמַיִם bilang “mga langit,” kaya itinala ang alternatibo sa talababa.
theological_decisions:
- issue: Pormula ng mga saksi sa tipan
  choice: tawagin kong mga saksi laban sa kanila ang langit at ang lupa
  alternative: magpatotoo laban sa kanila sa pamamagitan ng mga langit at ng lupa
  rationale: Itinatanghal ng konteksto ang langit at lupa bilang mga saksi sa pananagutan ng Israel. Pinananatili ng salin ang legal at tipanang larawan at ang diwang “laban sa kanila,” sa halip na gawing pangkalahatang babala lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit maringal. Ginamit ang “mga nakatatanda” at “mga opisyal” bilang madaling maunawaang katawagang pampamayanan at administratibo; pinanatili ang pormal na larawang legal ng pagtawag sa langit at lupa bilang mga saksi.
