revisions:
- from: Tipunin mo ang buong bayan—ang mga lalaki, mga babae, maliliit na bata, at ang dayuhang naninirahang kasama ninyo sa loob ng inyong mga bayan[a]—upang makarinig sila, matuto, at matakot kay Yahweh na inyong Diyos[b], at upang maingat nilang sundin ang lahat ng salita ng kautusang ito[c].
  to: Tipunin mo ang bayan—ang mga lalaki, mga babae, maliliit na bata, at ang dayuhang naninirahan sa iyong mga bayan[a]—upang makarinig sila, matuto, at matakot kay Yahweh na inyong Diyos[b], at upang maingat nilang sundin ang lahat ng salita ng kautusang ito[c].
  rationale: Inalis ang mga hindi kinakailangang dagdag na “buong” at “kasama ninyo.” Ipinanumbalik ang isahang pagtukoy sa kausap sa utos at sa “iyong mga bayan,” habang pinanatili ang maramihang “inyong Diyos,” alinsunod sa mga hulapi sa Hebreo. Walang binagong kahulugan sa pangunahing terminolohiya o sa mga layuning sugnay.
