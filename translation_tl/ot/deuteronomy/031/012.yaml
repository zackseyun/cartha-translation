  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: tl
  text: Tipunin mo ang bayan—ang mga lalaki, mga babae, maliliit na bata, at ang dayuhang naninirahan sa iyong mga bayan[a]—upang makarinig sila, matuto, at matakot kay Yahweh na inyong Diyos[b], at upang maingat nilang sundin ang lahat ng salita ng kautusang ito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang dayuhang naninirahan sa loob ng iyong mga pintuang-bayan.” Ang “mga pintuang-bayan” ay idyoma para sa mga bayan o pamayanang sakop mo.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Ang “matakot” ay may diwa rin ng pagpipitagan at masunuring paggalang.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tagubiling ito.” Ang Hebreong torah ay maaaring mangahulugang “tagubilin” o “kautusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל אֶת־הָעָם
  choice: Tipunin mo ang buong bayan
  rationale: Ang Hiphil imperative na הַקְהֵל ay utos na pagtitipunin ang sambayanan. Idinagdag ang “buong” bilang likas na pahiwatig ng kasunod na tahasang pagbanggit sa lahat ng pangkat, hindi upang palawakin ang saklaw.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: ang mga lalaki, mga babae, maliliit na bata
  rationale: Pinananatili ang tahasang pag-iisa-isa ng mga pangkat. Ang טַף ay karaniwang tumutukoy sa maliliit na bata o mga batang umaasa sa matatanda.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: ang dayuhang naninirahang kasama ninyo sa loob ng inyong mga bayan
  rationale: Ang גֵּר ay hindi basta panandaliang bisita kundi isang di-katutubong naninirahan sa Israel. Ang “sa loob ng inyong mga bayan” ay natural na paglilipat ng idyomang “sa loob ng inyong mga pintuang-bayan.”
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: upang makarinig sila, matuto
  rationale: Pinananatili ang magkakasunod na layunin ng pakikinig at pagkatuto, habang iniiwasan ang mabigat na pag-uulit ng “upang” sa modernong Tagalog.
- source_word: וְיָרְאוּ אֶת־יְהוָה אֱלֹהֵיכֶם
  choice: at matakot kay Yahweh na inyong Diyos
  rationale: Ang ירא ay may diwang takot na may paggalang at masunuring pagpipitagan. Pinananatili ng “matakot” ang tuwirang lakas at teolohikal na tensiyon ng Hebreo.
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: at upang maingat nilang sundin
  rationale: Ang pariralang שמר + infinitive ay tumutukoy sa maingat na pagtalima na isinasagawa. Natural sa Tagalog ang “maingat nilang sundin.”
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ang lahat ng salita ng kautusang ito
  rationale: Pinananatili ang דִּבְרֵי bilang “mga salita/lahat ng salita.” Ang תּוֹרָה ay maaaring “tagubilin,” ngunit ang “kautusan” ay angkop sa kontekstong tipan at dokumentong binabasa sa bayan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya ginamit ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng ירא sa kaugnayan sa Diyos
  choice: matakot kay Yahweh
  alternative: igalang si Yahweh; magkaroon ng pagpipitagan kay Yahweh
  rationale: Bagaman kasama rito ang pagpipitagan at masunuring paggalang, ang “matakot” ang pinakatuwirang katumbas at hindi nag-aalis sa tunay na tensiyon ng salita.
- issue: Kahulugan ng תּוֹרָה
  choice: kautusan
  alternative: tagubilin; aral
  rationale: Malawak ang saklaw ng תּוֹרָה, ngunit sa konteksto ng tipan sa Deuteronomio, ang “kautusan” ay natural habang itinatala sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng “ninyo/inyong” para sa maramihang kausap. Pinili ang malinaw na syntax at karaniwang bokabularyo habang pinananatili ang pag-iisa-isa ng mga pangkat, ang banal na pangalang Yahweh, at ang mahahalagang ambiguwidad ng ירא at תּוֹרָה.
