  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: tl
  text: At ibibigay sila ng PANGINOON sa inyo, at gagawin ninyo sa kanila ayon sa buong utos na iniutos ko sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם יְהוָה לִפְנֵיכֶם
  choice: At ibibigay sila ng PANGINOON sa inyong kamay
  rationale: Ang literal na “ilalagay sila sa harap ninyo” ay isang idyomang nagsasaad na ipauubaya sila sa kapangyarihan ng Israel. Ang “sa inyong kamay” ay likas na katumbas sa Filipino at malinaw na naghahayag ng pagsuko sa kanilang kapangyarihan.
- source_word: כְּכָל הַמִּצְוָה
  choice: ayon sa buong utos
  rationale: Pinananatili ang isahang kolektibong “utos” at ang saklaw ng כָּל bilang “buo,” sa halip na gawing maramihang “lahat ng mga utos.”
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: na iniutos ko sa inyo
  rationale: Tuwirang inililipat ang pormula ng pag-uutos at pinananatiling si Moises ang nagsasalita.
theological_decisions:
- issue: Pangalan ng Diyos, יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang tradisyonal at malawak na nauunawaang anyong malalaking titik para katawanin ang tetragrammaton, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Saklaw ng ipinag-uutos laban sa mga bansa
  choice: gagawin ninyo sa kanila ang ayon sa buong utos
  alternative: gagawin ninyo sa kanila ang lahat ng iniutos ko
  rationale: Pinananatili ang pagtukoy ng Hebreo sa isang kolektibong “buong utos” at hindi niluluwagan o nililimitahan ang saklaw nito nang higit sa sinasabi ng talata.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang tuwirang pananalita ni Moises at ang solemne ngunit likas na himig ng utos.
