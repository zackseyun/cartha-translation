  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Narito, malapit ka nang mahimlay kasama ng iyong mga ninuno. Pagkatapos, babangon ang bayang ito at magpapatutot[a] sa pagsunod sa mga banyagang diyos ng lupain na kanilang papasukan, sa gitna nito.[b] Tatalikuran nila ako at sisirain ang tipan ko na ginawa ko sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “magpapatutot sa pagsunod sa mga banyagang diyos.” Ginagamit ang seksuwal na kawalan ng katapatan bilang metapora ng pagtataksil sa tipan sa pamamagitan ng idolatriya.
    reason: lexical_alternative
  - marker: b
    text: Isahan ang mga anyo sa Hebreo sa “siya ay pumapasok” at “sa gitna nito,” na gumagamit ng kolektibong isahan para sa Israel/bayang ito. Pangmaramihan ang ginamit sa Tagalog upang maging malinaw ang tinutukoy.
    reason: lexical_alternative
