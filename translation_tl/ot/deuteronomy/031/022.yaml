translation:
  language: tl
  text: Isinulat ni Moises ang awit na ito noong araw na iyon at itinuro niya ito sa mga anak na lalaki ni Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita,” “mga anak ni Israel,” o “sambayanan ng Israel.” Literal sa Hebreo: “mga anak na lalaki ni Israel,” isang karaniwang katawagang tipanan para sa bayang Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: isinulat
  rationale: Ang Qal wayyiqtol ng כתב ay tuwirang nagsasaad ng sunod na kilos sa salaysay. Likas at malinaw sa Filipino ang “isinulat.”
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ang awit na ito
  rationale: Karaniwang tumutukoy ang שִׁירָה sa isang awit, lalo na sa matayog at tipanang konteksto. Pinananatili ng “awit” ang katawagang pampanitikan sa nakapaligid na talata.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Likas na panandang temporal ito sa makabagong Filipino at pinananatili ang tiyak na pagtukoy sa araw nang hindi ipinapalagay na dapat itong idiing “mismong araw na iyon.”
- source_word: וַיְלַמְּדָהּ
  choice: itinuro niya iyon
  rationale: Ang Piel ng למד na may hulaping 3fs ay tumutukoy pabalik sa awit. Ang “itinuro niya iyon” ay malinaw at natural, at pinananatiling hayag ang bagay na itinuro.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawang pampamilya ng Hebreong parirala habang nananatiling natural sa Filipino. Sa konteksto, isa itong karaniwang pangkalahatang katawagan sa bayang Israel.
theological_decisions:
- issue: Ang panlahatang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Ang Hebreo ay literal na “mga anak na lalaki ni Israel,” ngunit karaniwan itong katawagang tipanan para sa buong bayang Israel. Ang “mga anak ni Israel” ay nagpapanatili sa larawang pampamilya at hindi nagmumungkahing mga lalaki lamang ang tinuruan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga anak ni Israel” upang mapanatili ang Hebreong larawang pampamilya, samantalang nililinaw ng talababa ang literal na anyo at ang panlahatang saklaw nito.
