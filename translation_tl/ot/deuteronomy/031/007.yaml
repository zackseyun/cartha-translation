source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מֹשֶׁ֜ה לִֽ/יהוֹשֻׁ֗עַ וַ/יֹּ֨אמֶר אֵלָ֜י/ו לְ/עֵינֵ֣י כָל יִשְׂרָאֵ֘ל חֲזַ֣ק וֶ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבוֹא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם וְ/אַתָּ֖ה תַּנְחִילֶ֥/נָּה אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: tl
  text: Pagkatapos, tinawag ni Moises si Josue at sinabi sa kanya sa harap ng buong Israel, “Magpakatatag ka at lakasan mo ang iyong loob, sapagkat papasok kang kasama ng bayang ito[a] sa lupain na isinumpa ni Yahweh sa kanilang mga ama na ibibigay niya sa kanila; at ibibigay mo ito sa kanila bilang mana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “papapasukin mo ang bayang ito sa lupain” o “pangungunahan mo ang bayang ito papasok sa lupain.” Maaaring unawain ang Hebreo bilang pagpasok ni Josue kasama ng bayan o bilang pangunguna niya sa kanilang pagpasok.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Likas na katumbas ng קרא sa kontekstong pasalaysay; malinaw at hindi labis na pormal.
- source_word: לִיהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang modernong pangalang Filipino para kay Joshua.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: sa harap ng buong Israel
  rationale: Natural na Filipino para sa literal na ‘sa mga mata ng buong Israel,’ at pinananatili ang pampublikong tagpo.
- source_word: חֲזַק וֶאֱמָץ
  choice: Magpakatatag ka at lakasan mo ang iyong loob
  rationale: Idyomatikong Filipino na naghahatid ng lakas, tibay, at tapang na hinihingi sa isang pinuno.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na nagpapakilala sa dahilan ng utos at akma sa marangal na rehistro.
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: papasok kang kasama ng bayang ito
  rationale: Pinananatili ang posibleng diwang si Josue ay papasok na kasama ng bayan, sa halip na tahimik na gawing sanhi niyang papasukin sila.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Natural na katawagan sa ipinangakong teritoryo at pinananatili ang temang tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay-Filipino ang personal na pangalang nasa tekstong Hebreo, sa halip na palitan ng isang titulo.
- source_word: לַאֲבֹתָם
  choice: sa kanilang mga ninuno
  rationale: Sa modernong Filipino, ang ‘mga ninuno’ ang natural na kolektibong katumbas sa kontekstong tumutukoy sa mga patriyarka at naunang salinlahi; hindi nito binabago ang historikal na reperensiya.
- source_word: נִשְׁבַּע ... לָתֵת לָהֶם
  choice: ipinangako ... sa pamamagitan ng panunumpa na ibibigay sa kanila
  rationale: Ginagawang malinaw sa Filipino ang lakas ng Hebreong pandiwang ‘sumumpa’ at ang nilalaman ng panunumpa.
- source_word: תַּנְחִילֶנָּה אֹתָם
  choice: ipamamana mo iyon sa kanila
  rationale: Maikli at natural na Filipino para sa Hiphil ng נחל, habang pinananatili ang konsepto ng lupain bilang mana.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa Hebreo; ang ‘Yahweh’ ang pinakamalapit na karaniwang transliterasyon at hindi ito pinapalitan ng titulo.
- issue: Kung ang תָּבוֹא אֶת הָעָם ay nangangahulugang sasama si Josue sa pagpasok o siya ang magpapapasok sa bayan
  choice: papasok kang kasama ng bayang ito
  alternative: papapasukin mo ang bayang ito; pangungunahan mo ang bayang ito papasok
  rationale: Pinananatili ng pangunahing teksto ang sintaktikong posibilidad na kasama ng bayan si Josue sa pagpasok; ipinapaliwanag sa talababa ang posibleng causative o leadership reading.
- issue: Paglalahad sa אֲבֹתָם
  choice: kanilang mga ninuno
  alternative: kanilang mga ama
  rationale: Bagaman literal na ‘mga ama,’ kolektibong tumutukoy ito sa mga naunang ama ng Israel. Ang ‘mga ninuno’ ay natural at tumpak sa kasalukuyang Filipino nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘Josue,’ ‘Yahweh,’ at ‘lupain’ bilang natural at pamilyar na anyo. Iniwasan ang napakaliteral na ‘sa paningin ng buong Israel’ at ang mabigat na ‘papagmanahin’ pabor sa malinaw na kasalukuyang pananalita.
