    issue: Ang “kanilang mga ninuno” ay mas malawak kaysa sa Hebreong לַאֲבֹתָם.
    rationale: Ang teksto ay literal na tumutukoy sa “kanilang mga ama.” Bagaman natural ang “mga ninuno,” inaalis nito ang tiyak na panlalaking katawagang ginamit ng pinagmulan.
  - severity: low
    issue: Medyo alanganin ang pagkakabuo ng sugnay tungkol sa panunumpa at pagbibigay ng lupain.
    rationale: Ang “isinumpa ni Yahweh sa kanilang mga ama na ibibigay niya sa kanila” ay mas malinaw na naghahayag na si Yahweh ang sumumpa at siya rin ang magbibigay.
  - severity: low
    issue: Ang “ipamamana mo iyon sa kanila” ay maaaring tumukoy sa karaniwang pagpapamana mula sa isang namatay.
    rationale: Ang “ibibigay mo ito sa kanila bilang mana” ay mas tahasang nagpapahayag ng causative na pagpapamana/paglalaan sa Hebreo.
