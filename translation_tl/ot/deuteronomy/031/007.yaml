  source_fidelity: Ang pangunahing diwa ay tapat sa Hebreo, kabilang ang pampublikong pagsasalita, ang panawagang magpakatatag, at ang maingat na pangunahing pagbasa na papasok si Josue kasama ng bayan. Gayunman, ang אֲבֹתָם ay tahasang “kanilang mga ama,” hindi ang mas malawak na “mga ninuno.” Ang huling pandiwa ay causative na pagbibigay/pagpapamana ng lupain bilang mana; mas malinaw itong maihahayag nang tahasan.
  naturalness: Marangal at natural sa modernong Filipino ang karamihan ng draft. Ang “ipinangako ... sa pamamagitan ng panunumpa na ibibigay” ay medyo mabigat at maaaring linawin sa pamamagitan ng pandiwang “isinumpa” at isang tahasang panghalip para kay Yahweh.
  terminology: Ang “Moises,” “Josue,” “Israel,” “Yahweh,” “lupain,” at “mana” ay angkop at magkakatugma. Pinalitan ang “mga ninuno” ng “mga ama” upang mapanatili ang tiyak na terminong pangkamag-anak sa Hebreo.
  issues:
