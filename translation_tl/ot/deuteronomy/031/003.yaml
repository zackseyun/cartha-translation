revisions:
- from: Si Yahweh na inyong Diyos mismo ang tatawid sa unahan ninyo.[a] Siya mismo ang lilipol sa harap ninyo sa mga bansang ito, at aagawin ninyo sa kanila ang kanilang lupain.[b] Si Josue mismo ang tatawid sa unahan ninyo, gaya ng sinabi ni Yahweh.
  to: Si Yahweh na inyong Diyos mismo ang tatawid sa unahan ninyo.[a] Siya mismo ang lilipulin ang mga bansang ito mula sa harap ninyo, at sasakupin ninyo sila.[b] Si Josue mismo ang tatawid sa unahan ninyo, gaya ng sinabi ni Yahweh.
  rationale: Inayos ang sintaks upang malinaw na si Yahweh ang lilipol sa mga bansang ito mula sa harap ng Israel. Pinalitan ang tahasang pagbanggit sa “kanilang lupain” sa pangunahing teksto ng “sasakupin ninyo sila,” na nagpapanatili sa mga bansa bilang layon ng Hebreo; ang kaugnayan sa pagkuha ng lupain ay inilagay sa talababa. Pinanatili ang aspektong nalalapit/tiyak ng participle, ang retorikal na diin ng “mismo,” at ang mga nakaugaliang pangalang Yahweh at Josue.
