  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: tl
  text: Si Yahweh na inyong Diyos mismo ang tatawid sa unahan ninyo.[a] Siya mismo ang lilipulin ang mga bansang ito mula sa harap ninyo, at sasakupin ninyo sila.[b] Si Josue mismo ang tatawid sa unahan ninyo, gaya ng sinabi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mangunguna sa inyo” o “tumatawid sa unahan ninyo.” Ang participle sa Hebreo ay maaaring magpahayag ng kasalukuyang nagpapatuloy, nalalapit, o tiyak na kilos sa hinaharap. Gayundin ang pariralang ginamit tungkol kay Josue sa hulihan ng talata.
    reason: lexical_alternative
  - marker: b
    text: O “aariin ninyo sila.” Sa ganitong konteksto, ang pandiwang Hebreo ay karaniwang tumutukoy sa pagkuha ng pag-aari sa pamamagitan ng pagpapaalis sa mga dating naninirahan; maaari rin itong magpahiwatig ng pagkuha ng kanilang lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang tipanang pagtukoy na “inyong Diyos.” Bagaman pang-isahan ang hulaping Hebreo, pangmaramihang “ninyo” ang likas sa Filipino para sa kolektibong Israel.
- source_word: הוּא
  choice: mismo
  rationale: Ang hiwalay na panghalip ay may diin; ang “mismo” ay natural na nagpapanatili nito kapwa para kay Yahweh at kay Josue.
- source_word: עֹבֵר לְפָנֶיךָ
  choice: ang tatawid sa unahan ninyo
  rationale: Sa konteksto ng pagtawid sa Jordan, pinananatili ng “tatawid” ang kongkretong larawan, samantalang ipinahahayag ng panghinaharap ang nalalapit at tiyak na kilos ng participle.
- source_word: יַשְׁמִיד
  choice: lilipol
  rationale: Malakas at likas na katumbas ito ng Hiphil na nagsasaad ng pagwasak, nang hindi nagdaragdag ng mas tiyak na paliwanag kaysa sa Hebreo.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: mga bansang ito
  rationale: Ang “mga bansa” ay nagpapanatili sa pagtingin sa mga taga-Canaan bilang mga pangkat na etniko at pampolitika.
- source_word: מִלְּפָנֶיךָ
  choice: sa harap ninyo
  rationale: Pinananatili ang larawang pangkalawakan ng mga bansang nasa daraanan ng Israel, sa natural na ayos ng pangungusap sa Filipino.
- source_word: וִירִשְׁתָּם
  choice: aagawin ninyo sa kanila ang kanilang lupain
  rationale: Sa konteksto ng pananakop, ang ירשׁ ay pagkuha ng pag-aari sa pamamagitan ng pagpapaalis sa dating may hawak. Ginawang tahas ang “lupain” upang maging natural at malinaw sa Filipino, ngunit itinala sa talababa ang mas literal na anyo.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang modernong pangalang Filipino para sa biblikal na Joshua.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: gaya ng sinabi ni Yahweh
  rationale: Ang “sinabi” ay tuwirang katumbas ng דִּבֶּר at hindi nagdaragdag ng interpretasyong “ipinangako.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Diin sa pagkilos ni Yahweh at ni Josue
  choice: Panatilihin ang “mismo” para sa dalawang simuno
  alternative: Gumamit lamang ng payak na “siya”
  rationale: Inuulit ng Hebreo ang may-diin na הוּא. Pinananatili nito ang magkasabay na diin sa personal na pagkilos ni Yahweh at sa atas kay Josue nang hindi pinaglalaban ang banal at pantaong pagkilos.
- issue: Kolektibong pang-isahang kausap
  choice: inyong/ninyo
  alternative: iyong/mo
  rationale: Pang-isahan ang anyong Hebreo dahil kinakausap ang Israel bilang isang kabuuan, ngunit sa Filipino ay mas malinaw at natural ang pangmaramihan para sa buong kapulungan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Yahweh” bilang personal na pangalan, “Josue” bilang nakaugaliang anyong Filipino, at pangmaramihang panghalip upang malinaw na ang buong Israel ang kinakausap.
