  source_fidelity: 'Kailangang ituwid ang sugnay tungkol sa pagpuksa: ang Hebreo ay may tuwirang layon na “mga bansang ito” at ang מִלְּפָנֶיךָ ay “mula sa harap ninyo.” Ang “aagawin ninyo sa kanila ang kanilang lupain” ay nagpapalit sa tuwirang layon ng pandiwang Hebreo (mga bansa) tungo sa lupain. Ang “sasakupin ninyo sila” ay isang natural na Filipino na nagpapanatili ng tuwirang layon at ng kontekstuwal na diwa ng ירשׁ.'
  naturalness: Hindi natural at hindi malinaw ang “lilipol sa harap ninyo sa mga bansang ito.” Mas malinaw at marangal ang “lilipulin niya ang mga bansang ito mula sa harap ninyo.” Ang natitirang ayos, kasama ang “mismo” at “tatawid sa unahan ninyo,” ay angkop sa modernong Filipino Tagalog.
  terminology: Wasto ang “Yahweh,” “Diyos,” at “Josue.” Pinanatili ang “mismo” upang katawanin ang emphatic na הוּא. Ang “lilipulin” ay angkop para sa יַשְׁמִיד nang hindi pinahihina o pinalalabis ang matinding pananalita ng teksto.
  issues:
  - severity: high
    issue: Mali at hindi natural ang ayos ng “Siya mismo ang lilipol sa harap ninyo sa mga bansang ito.”
    rationale: Ang “mga bansang ito” ang tuwirang layon ng יַשְׁמִיד, habang ang מִלְּפָנֶיךָ ay nagsasaad ng pag-aalis “mula sa harap ninyo.”
  - severity: medium
    issue: Ang “aagawin ninyo sa kanila ang kanilang lupain” ay masyadong tumitiyak at binabago ang layon ng וִירִשְׁתָּם.
    rationale: Ang hulaping -ם ay tumutukoy sa “mga bansang ito,” hindi tahasang sa “kanilang lupain.” Maaaring ipaliwanag sa talababa ang idyomatikong kaugnayan sa pagkuha ng lupain, ngunit hindi ito dapat ipalit bilang pangunahing layon sa salin.
