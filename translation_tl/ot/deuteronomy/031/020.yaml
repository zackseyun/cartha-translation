source:
  edition: WLC
  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: tl
  text: Sapagkat kapag dinala ko siya sa lupaing ipinangako ko nang may panunumpa sa kanyang mga ninuno[a]—isang lupaing dinadaluyan ng gatas at pulot-pukyutan—at kumain siya, mabusog, at tumaba, babaling siya sa ibang mga diyos at paglilingkuran nila ang mga iyon; hahamakin nila ako[b], at sisirain niya ang aking tipan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang Israel ay tinutukoy muna bilang isahan (“siya”), pagkatapos ay bilang maramihan (“nila”), at muling bilang isahan sa huling pandiwa (“niya”). Itinuturing ang Israel kapuwa bilang iisang bayan at bilang mga taong bumubuo rito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “aalipustahin” o “lalaitin”; ipinahihiwatig ng pandiwang Hebreo ang pagtrato nang may paghamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat kapag
  rationale: 'Pinananatili ang kapuwa paliwanag na diwa at panahong diwa ng Hebreo: nagbibigay ito ng dahilan kaugnay ng naunang babala at nagpapakilala rin ng pangyayaring magaganap.'
- source_word: אֲבִיאֶנּוּ
  choice: dinala ko siya
  rationale: Ang hulaping 3ms ay tumutukoy sa Israel bilang iisang bayan. Sa sugnay na may “kapag,” likas sa Tagalog ang anyong aspektong kontemplatibo o perpektibo sa ganitong konstruksyon; dito, “kapag dinala ko siya” ay malinaw na tumutukoy sa hinaharap.
- source_word: הָאֲדָמָה
  choice: lupain
  rationale: Ang konteksto ay ang heograpiko at tipanang lupang ipinangako, hindi lamang lupa o soil.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: ipinangako ko nang may panunumpa sa kanyang mga ninuno
  rationale: Ginagawang hayag ang diwa ng שׁבע, “manumpa,” habang natural sa modernong Tagalog ang “mga ninuno” para sa covenant ancestors. Pinananatili ng “kanyang” ang kolektibong isahan.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: isang lupaing dinadaluyan ng gatas at pulot-pukyutan
  rationale: Pinananatili ang kongkretong talinghaga ng kasaganaan. Ang “pulot-pukyutan” ay malinaw sa karaniwang mambabasa, bagaman maaaring mas malawak ang saklaw ng Hebreong דבש.
- source_word: וְאָכַל וְשָׂבַע וְדָשֵׁן
  choice: kumain siya, mabusog, at tumaba
  rationale: Pinananatili ang sunod-sunod na kilos at ang konkretong larawan ng kasaganaan na humahantong sa kasiyahan sa sarili; hindi pinapalitan ang “tumaba” ng mas interpretibong “yumaman.”
- source_word: וּפָנָה אֶל אֱלֹהִים אֲחֵרִים
  choice: babaling siya sa ibang mga diyos
  rationale: Tapat sa larawan ng pagtalikod o muling pagtuon sa ibang mga diyos nang hindi nagdaragdag ng terminong “idolatriya” o “apostasya.”
- source_word: וַעֲבָדוּם
  choice: paglilingkuran ang mga iyon
  rationale: Ang עבד ay “maglingkod” at sa kontekstong panrelihiyon ay may diwang pagsamba at katapatan. Pinananatili ng “paglilingkuran” ang mas malawak na tipanang diwa.
- source_word: וְנִאֲצוּנִי
  choice: Hahamak sila sa akin
  rationale: Ipinahahayag ang pagtrato nang may paghamak o paglapastangan. Ang “sila” ay sadyang nagpapanatili sa paglipat ng Hebreo mula sa kolektibong isahan tungo sa maramihan.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: sisirain ang aking tipan
  rationale: Karaniwang salin ng הפר ברית ang pagsira o paglabag sa tipan. Ang pandiwa ay bumabalik sa anyong isahan sa Hebreo, ngunit hindi hayag ang panghalip sa Tagalog upang mapanatili ang likas na daloy at hindi sapilitang lutasin ang pagpapalit ng bilang.
theological_decisions:
- issue: Pagpapalit ng kolektibong isahan at maramihan para sa Israel
  choice: Panatilihin ang “siya” sa mga unang sugnay at ang hayag na “sila” sa “Hahamak sila sa akin,” saka huwag maglagay ng tahasang paksa sa huling pandiwa.
  alternative: Gawing pawang maramihan ang mga panghalip, o pakinisin ang lahat bilang isahan.
  rationale: Itinuturing ng Hebreo ang Israel kapuwa bilang iisang bayan at bilang maraming taong bumubuo rito. Ang anyo ng WLC ay isahan sa אֲבִיאֶנּוּ at sa karamihan ng sunod na pandiwa, maramihan sa וַעֲבָדוּם at וְנִאֲצוּנִי, at isahan muli sa וְהֵפֵר. Hindi dapat lubusang pakinisin ang tunay na pagbabago ng bilang.
- issue: Wika ng pagtataksil sa tipan
  choice: “babaling ... sa ibang mga diyos at paglilingkuran”
  alternative: “tatalikod sa pananampalataya” o “gagawa ng idolatriya”
  rationale: Inilalarawan mismo ng teksto ang mga kilos; hindi na dinaragdagan ng sistematikong katawagang teolohikal na wala sa talata.
- issue: Diwa ng נִאֵץ
  choice: “hahamak”
  alternative: “lalapastangan” o “itatakwil”
  rationale: Ang “hahamak” ay malinaw at likas na nagpapahiwatig ng pagtrato nang may pag-alipusta, habang hindi nito nililimitahan ang pandiwa sa simpleng pagtanggi lamang.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lupain,” “mga ninuno,” at “tipan” bilang pamilyar na wikang biblikal. Pinanatili ang kongkretong “tumaba” at ang pagbabago ng bilang sa Hebreo sa abot ng likas na daloy ng Tagalog.
