source:
  edition: WLC
  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: tl
  text: At kapag dinatnan siya ng maraming kapahamakan at kagipitan[a], sasagot ang awit na ito sa harap niya bilang saksi[b], sapagkat hindi ito malilimutan sa bibig ng kanyang mga inapo; sapagkat alam ko ang hilig ng kanyang kalooban[c]—ang ginagawa niya ngayon—bago ko siya dalhin sa lupaing ipinangako kong ibibigay sa ilalim ng panunumpa.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nasumpungan siya” o “inabutan siya.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sa harap niya” ay maaari ring unawain nang mas mariin bilang “laban sa kanya,” yamang nagsisilbing saksi ang awit.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “kanyang pagkahilig” o “kanyang balak/pag-iisip,” na tumutukoy sa panloob niyang disposisyon.
    reason: lexical_alternative
  - marker: d
    text: Sa Hebreo ay “na isinumpa ko” lamang; ang “ipinangako kong ibibigay” ay ipinahihiwatig ng konteksto at ng pananalita tungkol sa tipan.
    reason: textual_clarity
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Natural na panimula sa modernong Tagalog para sa Hebreong pormulang nagtatakda ng mangyayari sa hinaharap.
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: dinatnan siya
  rationale: Ipinahahayag ang pagdating o pag-abot sa Israel ng masasamang pangyayari, habang nananatiling natural sa Tagalog.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: maraming kapahamakan at kagipitan
  rationale: Sa konteksto, ang רָעוֹת ay mga mapaminsalang pangyayari, hindi abstraktong kasamaan; malinaw itong naihahayag ng “kapahamakan.”
- source_word: וְעָנְתָה
  choice: sasagot
  rationale: Pinananatili ang pangunahing larawan ng pandiwang ענה, “sumagot,” samantalang nililinaw ng kasunod na parirala ang tungkulin ng awit bilang saksi.
- source_word: לְפָנָיו לְעֵד
  choice: sa harap niya bilang saksi
  rationale: Malapit sa literal na kahulugan at hindi agad nagpapasya kung ang pagsaksi ay tahasang laban sa kanya.
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: hindi ito malilimutan sa bibig ng kanyang mga inapo
  rationale: Pinananatili ang larawan ng bibig at pasalitang pagpapatuloy ng awit sa mga susunod na salinlahi.
- source_word: יִצְרוֹ
  choice: hilig ng kanyang kalooban
  rationale: Ipinahahayag ang panloob na pagkahilig o disposisyon nang hindi nag-aangkat ng mas huling teknikal na doktrina.
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: ang ginagawa niya ngayon
  rationale: Pinananatili ang maikli at bahagyang tensiyonadong pagkakaugnay nito sa naunang “hilig,” sa halip na tahasang ipaliwanag ang relasyon ng dalawa.
- source_word: אֲשֶׁר נִשְׁבָּעְתִּי
  choice: isinumpa kong ibibigay
  rationale: Ang “ibibigay” ay hindi tahasang nasa nakaligtas na Hebreong parirala ngunit likas na ipinahihiwatig ng tipanang pangako tungkol sa lupain; minarkahan ito sa talababa.
theological_decisions:
- issue: Kaalaman ng Diyos sa panloob na disposisyon ng Israel bago ito pumasok sa lupain
  choice: hilig ng kanyang kalooban
  alternative: kanyang imahinasyon; kanyang balak; kanyang likas na pagkahilig
  rationale: Pinananatili nito ang bigat ng יֵצֶר bilang panloob na pagkahilig o disposisyon, ngunit hindi nito nilulutas ang talata sa pamamagitan ng isang partikular na sistematikong doktrina tungkol sa kalikasan ng tao.
- issue: Ang awit bilang saksi
  choice: sa harap niya bilang saksi
  alternative: laban sa kanya bilang saksi
  rationale: Ang לְפָנָיו ay literal na “sa harap niya.” Bagaman maaaring maging saksi laban sa Israel ang awit ayon sa konteksto, inilalagay ang mas mariing pagbasa sa talababa upang mapanatili ang tunay na saklaw ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapahamakan at kagipitan” sa halip na “mga kasamaan” upang maiwasang mapagkamalang moral na kasamaan ang mga sakuna. Pinanatili ang poetikong “sasagot” at ang larawang “sa bibig” dahil mahalaga ang mga ito sa Hebreong teksto.
