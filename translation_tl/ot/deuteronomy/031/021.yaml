  terminology: Ang “kapahamakan at kagipitan,” “mga inapo,” at “hilig ng kanyang kalooban” ay angkop sa modernong Filipino Tagalog at hindi nagdadagdag ng doktrinal na pakahulugan. Pinananatili ang “sasagot” upang igalang ang larawang pandiwa ng Hebreo, habang ang “bilang saksi” ang nagpapaliwanag ng tungkulin ng awit.
