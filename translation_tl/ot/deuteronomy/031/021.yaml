  source_fidelity: 'Tumpak ang pangunahing pagsasalin: ang mga kapahamakan at kagipitan ang dumadating sa Israel; ang awit ay “sasagot” sa harap nito bilang saksi; at ang יֵצֶר ay wastong isinasalin bilang panloob na hilig/disposisyon. Gayunman, ang “isinumpa kong ibibigay” ay kinakailangang linawin sa Tagalog, sapagkat ang pandiwang “isinumpa” na walang malinaw na kaugnay na “pangako” ay madaling mangahulugang isinumpa o isinumpaang masama ang lupain. Ang Hebreo ay nagtatapos sa “na isinumpa ko,” samantalang ang “ibibigay” ay ipinahihiwatig lamang ng kontekstong pangtipan.'
