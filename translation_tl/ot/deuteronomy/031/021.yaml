revisions:
- from: At kapag dinatnan siya ng maraming kapahamakan at kagipitan[a], sasagot ang awit na ito sa harap niya bilang saksi[b], sapagkat hindi ito malilimutan sa bibig ng kanyang mga inapo. Dahil alam ko ang hilig ng kanyang kalooban[c]—ang ginagawa niya ngayon—bago ko siya dalhin sa lupaing isinumpa kong ibibigay.[d]
  to: At kapag dinatnan siya ng maraming kapahamakan at kagipitan[a], sasagot ang awit na ito sa harap niya bilang saksi[b], sapagkat hindi ito malilimutan sa bibig ng kanyang mga inapo; sapagkat alam ko ang hilig ng kanyang kalooban[c]—ang ginagawa niya ngayon—bago ko siya dalhin sa lupaing ipinangako kong ibibigay sa ilalim ng panunumpa.[d]
  rationale: Inayos ang huling parirala upang malinaw na ang panunumpa ay panunumpang pangako, hindi pagsumpa sa lupain. Pinanatili ang ipinahihiwatig na “ibibigay,” na malinaw na minarkahan sa talababa, alinsunod sa kontekstong pangtipan at sa audit trail. Inayos din ang bantas at pang-ugnay upang manatiling malapit sa lohikal na daloy ng Hebreo.
