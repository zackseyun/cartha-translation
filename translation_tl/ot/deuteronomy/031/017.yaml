  to: Sa araw na iyon, mag-aalab ang galit ko laban sa kanila. Pababayaan ko sila at ikukubli ko ang aking mukha sa kanila. Sila ay lalamunin[a], at maraming kapahamakan at kagipitan ang sasapit sa kanila. Sa araw na iyon ay sasabihin niya, “Hindi ba dahil wala sa gitna ko ang Diyos ko[b] kaya sumapit sa akin ang mga kapahamakang ito?”
