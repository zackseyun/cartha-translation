  - severity: low
    issue: Medyo pilit ang “wala ang Diyos ko sa gitna ko.”
    rationale: Ang “wala sa gitna ko ang Diyos ko” ay mas likas na ayos sa Filipino at patuloy na isinasalin ang “my God is not in my midst,” nang hindi binabago ang personipikadong isahan ng Israel.
