language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/חָרָ֣ה אַפִּ֣/י ב֣/וֹ בַ/יּוֹם הַ֠/הוּא וַ/עֲזַבְתִּ֞י/ם וְ/הִסְתַּרְתִּ֨י פָנַ֤/י מֵ/הֶם֙ וְ/הָיָ֣ה לֶֽ/אֱכֹ֔ל וּ/מְצָאֻ֛/הוּ רָע֥וֹת רַבּ֖וֹת וְ/צָר֑וֹת וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הֲ/לֹ֗א עַ֣ל כִּֽי אֵ֤ין אֱלֹהַ/י֙ בְּ/קִרְבִּ֔/י מְצָא֖וּ/נִי הָ/רָע֥וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: tl
  text: Sa araw na iyon, mag-aalab ang galit ko laban sa kanila. Pababayaan ko sila at ikukubli ko ang aking mukha sa kanila. Sila ay lalamunin[a], at maraming kapahamakan at kagipitan ang sasapit sa kanila. Sa araw na iyon ay sasabihin niya, “Hindi ba dahil wala sa gitna ko ang Diyos ko[b] kaya sumapit sa akin ang mga kapahamakang ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at siya/ito ay magiging para sa pagkain.” Siksik ang Hebreo at maaaring tumukoy sa pagiging lantad ng Israel sa paglamon o pagwasak.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang Diyos ko ay wala sa gitna ko.” Nagsasalita rito ang Israel, na inilalarawan bilang isang persona.
    reason: collective_singular
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: mag-aalab ang galit ko
  rationale: Pinananatili nito ang Hebreong larawan ng nag-aapoy na galit habang natural at malinaw sa makabagong Tagalog.
- source_word: בּוֹ
  choice: laban sa kanila
  rationale: Isahan ang anyong Hebreo ngunit kolektibong tumutukoy sa Israel; mas natural sa salaysay na gamitin ang maramihan sa Tagalog.
- source_word: וַעֲזַבְתִּים
  choice: pababayaan ko sila
  rationale: Ipinahihiwatig nito ang pag-iwan sa kanila nang walang proteksiyon, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: ikukubli ko sa kanila ang aking mukha
  rationale: Pinananatili ang mahalagang larawan ng pagkukubli ng mukha sa halip na ipakahulugan lamang bilang pagkawala ng presensiya o pagsang-ayon.
- source_word: וְהָיָה לֶאֱכֹל
  choice: sila ay lalamunin
  rationale: Ang Hebreo ay siksik at literal na nagsasabing ang kolektibong Israel ay magiging ‘para sa pagkain.’ Ang ‘lalamunin’ ay natural at nagpapanatili sa diwa ng pagiging lantad sa pagwasak nang hindi tinutukoy kung sino ang lalamon.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: maraming kapahamakan at kagipitan
  rationale: Sa konteksto ng hatol, ang רָעוֹת ay mga kapahamakan at ang צָרוֹת ay mga kagipitan o matitinding suliranin; pinananatili ng salin ang pagkakaiba ng dalawang salita.
- source_word: וּמְצָאֻהוּ / מְצָאוּנִי
  choice: sasapit sa kanila / sumapit sa akin
  rationale: Ang ‘sasapit’ ay likas na Tagalog para sa mga kapahamakang dumarating sa isang tao at pinananatili ang pag-uugnay ng dalawang paglitaw ng pandiwa.
- source_word: הֲלֹא עַל כִּי
  choice: Hindi ba dahil ... kaya
  rationale: Natural nitong naipahahayag sa Tagalog ang retorikal na tanong at ang ugnayang sanhi na nasa Hebreo.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: wala ang Diyos ko sa gitna ko
  rationale: Pinananatili ang unang panauhang isahan at ang larawan ng ‘sa gitna ko,’ na nagpapakilala sa Israel bilang iisang nagsasalita.
theological_decisions:
- issue: Kolektibong isahan at maramihan para sa Israel
  choice: Maramihan sa mga salaysay na tumutukoy sa bayan, ngunit isahan sa sariling pananalita ng Israel
  alternative: Gumamit ng isahan sa buong talata o maramihan sa buong talata
  rationale: Ganito nananatiling natural ang Tagalog habang pinangangalagaan ang kapansin-pansing personipikasyon ng Israel bilang isang nagsasalita sa sipi.
- issue: Kahulugan ng pagkukubli ng mukha ng Diyos
  choice: Panatilihin ang idyomang ‘ikukubli ... ang aking mukha’
  alternative: Isaling ‘lalayo ako sa kanila’ o ‘aalisin ko ang aking presensiya’
  rationale: Ang idyoma ay may bigat na kaugnay ng tipan at hatol. Hindi ito dapat paliitin sa isang tiyak na paliwanag na lampas sa sinabi ng teksto.
- issue: Dahilan ng kapahamakan sa retorikal na tanong
  choice: Panatilihin bilang tanong ng personipikadong Israel
  alternative: Gawing tuwirang pahayag na tiyak na nagpapaliwanag sa kapahamakan
  rationale: Pinananatili nito ang anyo at tensiyon ng Hebreo sa halip na gawing tahasang doktrinal na konklusyon ang pagkilala ng nagsasalita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga larawang ‘mag-aalab ang galit’ at ‘ikukubli ang mukha,’ gayundin ang sinadyang paglipat mula sa kolektibong maramihan tungo sa personipikadong isahan.
