  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם בֶּן מֵאָה֩ וְ/עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַ/יּ֔וֹם לֹא אוּכַ֥ל ע֖וֹד לָ/צֵ֣את וְ/לָ/ב֑וֹא וַֽ/יהוָה֙ אָמַ֣ר אֵלַ֔/י לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Isang daan at dalawampung taong gulang na ako ngayon. Hindi ko na kayang lumabas at pumasok[a], at sinabi sa akin ni Yahweh, ‘Hindi ka tatawid sa Jordang ito.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lumabas at pumasok,” isang idyomang maaaring tumukoy sa karaniwang pagkilos o sa pangunguna sa bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: At sinabi niya sa kanila
  rationale: Pinananatili ng “At” ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi nagdaragdag ng mas tiyak na ugnayang pandiskurso.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Isang daan at dalawampung taong gulang na ako ngayon
  rationale: Natural na salin sa Tagalog ng Hebreong idyoma sa pagsasabi ng edad; pinananatili ng “ngayon” ang temporal na diin ng הַיּוֹם.
- source_word: לֹא אוּכַל עוֹד
  choice: Hindi ko na kayang
  rationale: Tuwirang ipinahahayag ang kawalan na ng kakayahan, kasama ang diwa ng עוֹד na “hindi na.”
- source_word: לָצֵאת וְלָבוֹא
  choice: lumabas at pumasok
  rationale: 'Pinananatili ang konkretong Hebreong idyoma at ang tunay na kalabuan nito: maaari itong tumukoy sa karaniwang pagkilos o sa pangunguna sa bayan.'
- source_word: וַיהוָה
  choice: ni Yahweh
  rationale: Isinasatunog ang banal na pangalang יהוה bilang “Yahweh,” alinsunod sa ibinigay na teolohikal na pasiya at sa direktang paggamit ng Tetragrammaton sa teksto.
- source_word: אָמַר אֵלַי
  choice: sinabi sa akin
  rationale: Natural na Tagalog para sa naunang pahayag ng Diyos na nananatiling mahalaga sa kasalukuyang tagpo; hindi kailangang tahasang markahan ang aspektong katumbas ng English present perfect.
- source_word: לֹא תַעֲבֹר
  choice: Hindi ka tatawid
  rationale: Nananatiling bukas sa Tagalog ang puwersa bilang makapangyarihang deklarasyon o pagbabawal, sa halip na piliting pumili ng isang mas makitid na pagbasa.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: sa Jordang ito
  rationale: Pinananatili ang demonstratibong הַזֶּה; ang anyong “Jordang ito” ay natural sa modernong Tagalog at hindi nagdaragdag ng salitang “Ilog,” na wala sa Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng idyomang לָצֵאת וְלָבוֹא
  choice: Panatilihin sa pangunahing teksto bilang “lumabas at pumasok”
  alternative: “kumilos” o “manguna sa bayan”
  rationale: Maaaring tumukoy ang idyoma sa pangkaraniwang gawain o sa aktibong pampubliko/pamumunong tungkulin. Hindi nilulutas ng konteksto nang lubos ang dalawang posibilidad, kaya pinananatili ang tensiyon at ipinaliliwanag sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang natural na ayos ng pangungusap at iniwasan ang sobrang pormal o makalumang pananalita. Pinanatili sa pangunahing teksto ang Hebreong idyoma at nilagyan ito ng maikling talababa upang hindi ikubli ang tunay na kalabuan.
