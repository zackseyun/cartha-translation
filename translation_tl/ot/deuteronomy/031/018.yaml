base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: tl
  text: At ako nga ay tiyak na ikukubli ko ang aking mukha[a] sa araw na iyon dahil sa lahat ng kasamaang ginawa niya, sapagkat bumaling siya sa ibang mga diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking presensiya.” Literal sa Hebreo ang “aking mukha,” isang idyomang maaaring magpahiwatig ng pag-urong ng presensiya o pagkakait ng pagsang-ayon ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: At ako mismo
  rationale: Ang אָנֹכִי ay mariing panghalip na unang panauhan. Pinananatili ng “ako mismo” ang diin, at ang וְ ay isinaling pang-ugnay na “At.”
- source_word: הַסְתֵּר אַסְתִּיר
  choice: talagang ikukubli
  rationale: Ang infinitive absolute na kasunod ng pandiwang may iisang ugat ay nagpapatingkad sa katiyakan o tindi ng kilos. Likas sa modernong Tagalog ang “talagang ikukubli.”
- source_word: פָּנַי
  choice: aking mukha
  rationale: Literal itong “aking mukha.” Pinanatili ang kongkretong idyoma sa pangunahing teksto sa halip na agad itong ipakahulugang presensiya o pagpapala.
- source_word: בַּיּוֹם הַהוּא
  choice: sa araw na iyon
  rationale: Karaniwan at malinaw na salin ng panandang pamanahon at ng demonstratibong “iyon.”
- source_word: עַל כָּל הָרָעָה
  choice: dahil sa lahat ng kasamaan
  rationale: Ang עַל ay nagpapahayag dito ng dahilan, at ang הָרָעָה ay tumutukoy sa moral na kasamaan, hindi lamang sa kapahamakan.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Pangatlong panauhang panlalaking isahan ang pandiwa. Pinanatili ang isahan upang katawanin ang Israel bilang isang sambayanan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan. Ang “sapagkat” ay malinaw at marangal sa kontekstong ito.
- source_word: פָנָה אֶל
  choice: bumaling sa
  rationale: Ipinahihiwatig ng parirala ang pagharap o paglipat ng katapatan at debosyon; tuwiran itong naipapahayag ng “bumaling sa.”
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang tinutukoy ng parirala ang mga diyos na iba sa PANGINOON; pinananatili ng salin ang payak na anyo nito.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa paglayo ng Diyos
  choice: Panatilihin ang “ikukubli ang aking mukha” sa pangunahing teksto
  alternative: “ilalayo ko ang aking presensiya” o “tatalikuran ko sila”
  rationale: Ginagamit ng Hebreo ang kongkretong idyomang “ikubli ang aking mukha.” Ang literal na larawan ay nagpapanatili sa saklaw ng kahulugan at hindi agad nagpapasya kung presensiya, pagsang-ayon, o pagkalinga ang pangunahing diin.
- issue: Isahang pagtukoy sa Israel
  choice: “ginawa niya … bumaling siya”
  alternative: “ginawa nila … bumaling sila”
  rationale: Isahan ang mga pandiwa sa Hebreo at inilalarawan ang Israel bilang isang kolektibong persona. Pinananatili ng isahang panghalip ang anyo at tensiyon ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na likas ngunit marangal. Pinanatili ang konkretong Hebreong idyoma at ang isahang personipikasyon sa Israel; ginamit ang “talagang” upang natural na maipahayag ang mariing anyo ng pandiwa.
