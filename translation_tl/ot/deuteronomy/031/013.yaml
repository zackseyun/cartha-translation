  source_fidelity: 'Tumpak na naipapahayag ang pagkakasunod at saklaw ng Hebreo: ang kanilang mga anak na hindi pa nakaaalam ay makikinig at matututo na matakot kay Yahweh, habang nabubuhay ang kausap na Israel sa lupaing tatawirin nila ang Jordan upang angkinin. Ang hindi pagtukoy ng layon ng “nakaaalam” ay wastong nagpapanatili ng kalabuan ng Hebreo.'
  naturalness: Likas at marangal ang modernong Filipino. Ang “sa buong panahong nabubuhay kayo” ay maayos na katumbas ng pangmatagalang saklaw ng parirala, at ang “lupaing pupuntahan ninyo sa pagtawid sa Jordan” ay malinaw at hindi pilit.
  terminology: Wasto at pare-pareho ang “Yahweh,” “inyong Diyos,” “mga anak,” at “matakot.” Hindi pinapalitan ng “matakot” ang mayamang saklaw ng ירא sa isang mas makitid na interpretasyon. Ang mga talababa ay tama ang mga angkla at tumutugma sa mga lexical na alternatibo.
