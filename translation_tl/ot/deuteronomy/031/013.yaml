  text: וּ/בְנֵי/הֶ֞ם אֲשֶׁ֣ר לֹֽא יָדְע֗וּ יִשְׁמְעוּ֙ וְ/לָ֣מְד֔וּ לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם כָּל הַ/יָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: tl
  text: At ang kanilang mga anak[a], na hindi pa nakaaalam, ay makikinig at matututong matakot kay Yahweh[b] na inyong Diyos sa buong panahong nabubuhay kayo sa lupaing pupuntahan ninyo sa pagtawid sa Jordan upang angkinin iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anak na lalaki.” Ang salitang Hebreo ay maaaring tumukoy sa mga anak na lalaki o, sa mas malawak na diwa, sa mga anak o inapo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH; ayon sa tradisyon ay isinasaling “ang PANGINOON.”'
    reason: alternative_reading
  - marker: c
    text: Maaari ring “upang ariin iyon” o “upang manahin iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: At ang kanilang mga anak
  rationale: Maaaring tumukoy ang בנים sa mga anak na lalaki o, gaya rito, sa mga anak at susunod na salinlahi sa pangkalahatan. Hindi nililimitahan ng konteksto ang pagtuturo sa mga lalaki lamang.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: na hindi pa nakaaalam
  rationale: Pinananatili ang kawalan ng dating kaalaman o karanasan nang hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: ay makikinig at matututong
  rationale: 'Ipinahahayag ng mga pandiwa ang inaasahang bunga ng pampublikong pagbasa: makikinig sila at matututo. Natural sa Filipino ang hinaharap na anyo.'
- source_word: לְיִרְאָה
  choice: matakot
  rationale: Pinananatili ang bigat at posibleng lawak ng ירא—takot na may paggalang at pagsunod—sa halip na paliitin ito sa ‘gumalang’ lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang inililipat sa Filipino ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: sa buong panahong nabubuhay kayo
  rationale: Natural na Filipino para sa Hebreong ‘lahat ng mga araw na kayo ay nabubuhay,’ habang pinananatili ang buong tagal ng pananagutan.
- source_word: עַל הָאֲדָמָה
  choice: sa lupain
  rationale: Sa konteksto, ang אֲדָמָה ay ang lupaing titirhan at aangkinin ng Israel, hindi lamang lupa o putik.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה
  choice: lupaing pupuntahan ninyo sa pagtawid sa Jordan
  rationale: Ipinakikita ang patutunguhang diwa ng שָׁמָּה at iniiwasan ang di-natural na pahayag na para bang ang lupain mismo ang tinatawid.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin iyon
  rationale: Saklaw ng ירשׁ ang pagkuha at pananatiling nagmamay-ari sa lupain; malinaw na tinutukoy ng ‘iyon’ ang lupain.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan ang nasa tekstong Hebreo, kaya pinananatili bilang pangalan at hindi tahimik na pinapalitan ng titulong ‘PANGINOON.’
- issue: Saklaw ng בנים sa pagtuturo ng tipan
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Ang konteksto ay tungkol sa susunod na salinlahing makikinig at matututo; walang batayan dito upang ipalagay na mga lalaki lamang ang saklaw.
- issue: Diwa ng pagkatakot sa Diyos
  choice: matakot kay Yahweh
  alternative: magpitagan kay Yahweh
  rationale: Ang ‘matakot’ ay nagpapanatili sa teolohikal na tensiyon ng ירא, na maaaring magsangkot ng takot, pagpipitagan, at masunuring paggalang, samantalang mas makitid ang ‘magpitagan.’
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘inyong’ upang mapanatili ang maramihang tuwirang pakikipag-usap sa Israel. Pinili ang ‘sa buong panahong’ kaysa sa literal ngunit mabigat na ‘sa lahat ng araw na’ para sa likas na daloy, at hindi nilagyan ng tahasang layon ang ‘hindi pa nakaaalam’ upang mapanatili ang kalabuan ng Hebreo.
