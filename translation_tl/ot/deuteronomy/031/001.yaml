translation:
  language: tl
  text: Pagkatapos, nagtungo si Moises at nagsalita siya ng mga salitang ito sa buong Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At nagtungo si Moises at nagsalita siya ng mga salitang ito sa buong Israel.” Maaaring isalin nang mas pormal na “At” ang panimulang pang-ugnay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: umalis
  rationale: Karaniwang nangangahulugang “pumunta” o “lumakad” ang הלך, ngunit walang binanggit na patutunguhan dito. Sa modernong Tagalog, natural na ipinahahayag ng “umalis” ang aktuwal na pagkilos ni Moises nang hindi ito ginagawang idyomatikong “nagpatuloy.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang מֹשֶׁה sa Bibliyang Tagalog.
- source_word: וַיְדַבֵּר
  choice: sinabi niya
  rationale: Ang piel na דבר ay nangangahulugang “magsalita.” Dahil tuwirang sinusundan ito ng layong “ang mga salitang ito,” mas natural sa Tagalog ang “sinabi niya” kaysa “nagsalita siya ng,” habang pinananatili ang diwa ng pagpapahayag.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Pinananatili nito ang tiyak at kongkretong kahulugan ng parirala at itinuturo ang pahayag na kaugnay ng sumusunod na talumpati.
- source_word: אֶל
  choice: sa
  rationale: Tinutukoy ng אֶל ang mga taong kinausap; “sa” ang natural na panandang Tagalog sa konstruksyong “sinabi ... sa.”
- source_word: כָּל יִשְׂרָאֵל
  choice: buong Israel
  rationale: Natural na kolektibong salin ito ng כָּל יִשְׂרָאֵל at pinananatili ang Israel bilang sambayanan, sa halip na gawing tahasang indibidwal na “lahat ng Israelita.”
- source_word: וַ
  choice: Pagkatapos
  rationale: Ang panimulang waw ay nagpapasulong sa salaysay. Ipinahahayag ng “Pagkatapos” ang sunod-sunod na kilos sa natural na modernong Tagalog; nasa talababa ang mas pormal na “At.”
