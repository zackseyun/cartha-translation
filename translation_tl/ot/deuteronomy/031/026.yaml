base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: tl
  text: “Kunin ninyo ang aklat na ito ng Kautusan[a] at ilagay ninyo ito sa tabi ng kaban ng tipan ni Yahweh na inyong Diyos. Mananatili ito roon bilang saksi laban sa inyo.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang balumbong ito ng Kautusan.” Ang salitang Hebreo ay maaaring tumukoy sa isang balumbon o nakasulat na dokumento.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, magsisilbi itong patotoo laban sa inyo kapag nilabag ninyo ang tipan.
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: Kunin ninyo
  rationale: Ang Qal infinitive absolute ay ginagamit dito bilang tuwirang utos. Bagaman anyong isahan ang salitang Hebreo, ang kasunod na pandiwa ay maramihan, kaya natural sa Tagalog ang “ninyo.”
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: ang aklat na ito ng Kautusan
  rationale: Ang סֵפֶר ay nakasulat na dokumento at maaaring tumukoy sa balumbon; ang תּוֹרָה rito ay ang nakasulat na kautusan o tagubilin ng tipan. Pinananatili ng “Kautusan” ang tiyak na gamit nito sa konteksto.
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: at ilagay
  rationale: Tumpak at natural na katumbas ng konkretong pagkilos na ipinahihiwatig ng שׂוּם; nauunawaan mula sa unang sugnay na maramihan ang inuutusan.
- source_word: מִצַּד
  choice: sa tabi ng
  rationale: Ipinapahayag nito na ang aklat ay ilalagay sa tagiliran o tabi ng kaban, hindi sa loob nito.
- source_word: אֲרוֹן בְּרִית
  choice: kaban ng tipan
  rationale: Natural at kinikilalang salin ng construct chain na tumutukoy sa sagradong kaban na kaugnay ng tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang inililipat sa Tagalog ang personal na pangalang ipinahahayag ng tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Pinananatili ang pangmaramihang ikalawang panauhan at ang pormulang pangtipan.
- source_word: וְהָיָה שָׁם
  choice: Mananatili iyon doon
  rationale: Ang literal na “at iyon ay magiging naroon” ay tumutukoy sa patuloy na kalagayan matapos itong ilagay; malinaw at natural itong naipahahayag ng “mananatili.”
- source_word: לְעֵד בְּךָ
  choice: bilang saksi laban sa inyo
  rationale: Ang עֵד ay “saksi,” at sa konteksto ng tipan ay may mapanumbat o hudisyal na bisa ang בְּךָ. Isahan sa Hebreo ang hulapi dahil kolektibong kinakausap ang Israel, ngunit natural sa Tagalog ang “inyo” ayon sa maramihang utos sa talata.
theological_decisions:
- issue: Tungkulin ng aklat bilang saksi
  choice: Saksi laban sa Israel sa kontekstong pangtipan at panghukuman
  alternative: Isang neutral na alaala o patotoo lamang sa tabi ng kaban
  rationale: Ang pariralang לְעֵד בְּךָ at ang mas malawak na konteksto ng Deuteronomio ay nagpapahiwatig ng patotoong maaaring magbintang sa Israel kapag nilabag nito ang tipan. Hindi dinaragdagan ng talababa ang teksto ng kondisyon bilang bahagi ng mismong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “aklat” sa pangunahing teksto dahil natural ito sa kasalukuyang wika, habang inilagay sa talababa ang mas kongkretong “balumbon.” Pinanatili ang “Yahweh” bilang personal na pangalan at ang hudisyal na diin ng “saksi laban sa inyo.”
