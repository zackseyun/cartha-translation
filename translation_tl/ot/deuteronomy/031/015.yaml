  text: וַ/יֵּרָ֧א יְהוָ֛ה בָּ/אֹ֖הֶל בְּ/עַמּ֣וּד עָנָ֑ן וַ/יַּעֲמֹ֛ד עַמּ֥וּד הֶ/עָנָ֖ן עַל פֶּ֥תַח הָ/אֹֽהֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: tl
  text: Nagpakita si Yahweh sa tolda[a], sa isang haliging ulap, at tumayo ang haliging ulap sa may pasukan[b] ng tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto, malamang na ito ang tolda ng pagpupulong; “ang tolda” lamang ang literal na sinasabi rito sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa ibabaw ng pasukan”; ang pang-ukol sa Hebreo ay maaaring mangahulugang “sa ibabaw,” bagaman ang “sa may pasukan” ay angkop sa paglalarawan ng kinalalagyan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: Nagpakita
  rationale: Ang Niphal ng ראה ay tumutukoy rito sa nakikitang pagpapakita. Likas sa modernong Tagalog ang “nagpakita” at hindi nito ipinapaliwanag nang labis kung paano naganap ang pagpapakita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בָּאֹהֶל
  choice: sa tolda
  rationale: Ang אֹהֶל ay karaniwang “tolda.” Bagaman ang tinutukoy sa konteksto ay malamang na tolda ng pagpupulong, hindi iyon tahasang inuulit sa pariralang ito.
- source_word: בְּעַמּוּד עָנָן
  choice: sa isang haliging ulap
  rationale: Pinananatili ng “sa” ang maluwag na saklaw ng pang-ukol na ב, habang malinaw na inilalarawan ang haliging ulap bilang kaugnay ng pagpapakita ni Yahweh nang hindi ito tahasang ginagawang anyo niya o simpleng kasangkapan lamang.
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Tuwirang katumbas ito ng עמד at pinananatili ang kongkretong larawan ng haliging nakatayo.
- source_word: עַמּוּד הֶעָנָן
  choice: ang haliging ulap
  rationale: Ang tiyak na parirala ay tumutukoy pabalik sa haliging ulap na kababanggit lamang.
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: sa may pasukan ng tolda
  rationale: Sa ganitong paglalarawan ng kinalalagyan, natural sa Tagalog ang “sa may pasukan.” Ang mas literal na diwang “sa ibabaw ng pasukan” ay pinananatili sa talababa bilang tunay na alternatibo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang pangalan ng Diyos ng Israel ayon sa tekstong Hebreo, sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Paglalarawan sa pagpapakita ng Diyos
  choice: Nagpakita si Yahweh sa tolda, sa isang haliging ulap
  alternative: Nagpakita si Yahweh sa tolda sa pamamagitan ng isang haliging ulap
  rationale: Hindi tiyak na nilulutas ng salin kung ang haliging ulap ay lokasyon, paraan, o daluyan ng pagpapakita. Sa gayon, nananatili ang kongkretong larawan at ang hiwagang nasa tekstong Hebreo.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “tolda” at “pasukan” bilang karaniwang salitang madaling maunawaan; iniwasan ang mas teknikal na “tabernakulo” at ang interpretibong “bilang isang haliging ulap.”
