  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: tl
  text: Sapagkat alam kong pagkamatay ko, tiyak na magpapakasama kayo[a] at lilihis sa daang iniutos ko sa inyo. Sasapit sa inyo ang kapahamakan[b] sa mga araw na darating[c], sapagkat gagawin ninyo ang masama sa paningin ni Yahweh at gagalitin ninyo siya sa pamamagitan ng mga gawa ng inyong mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tiyak na magiging tiwali kayo” o “tiyak na sisirain ninyo ang inyong sarili.” Dinidiinan ng Hebreo ang pandiwang tumutukoy sa pagkasira o katiwalian, at maaari itong unawaing reflexive o intransitive rito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sakuna” o “kasamaan.” Ang Hebreong רָעָה ay maaaring tumukoy sa kapahamakan o masamang pangyayari, gayundin sa kasamaan sa mas malawak na diwa.
    reason: lexical_alternative
  - marker: c
    text: Sa mas literal na salin, “sa mga huling araw.” Ang parirala ay tumutukoy sa hinaharap at, depende sa konteksto, maaaring magkaroon ng bigat na eskatolohikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: Sapagkat alam ko
  rationale: Ipinahihiwatig ng כִּי ang paliwanag ni Moises, at ang payak na kasalukuyang anyong “alam ko” ay likas na nagpapahayag ng katiyakan.
- source_word: אַחֲרֵי מוֹתִי
  choice: pagkamatay ko
  rationale: Malapit sa nominal na anyo ng Hebreo at natural sa makabagong Tagalog.
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: tiyak na gagawi kayo nang tiwali
  rationale: Ipinananatili ng “tiyak” ang diin ng infinitive absolute at pandiwa, habang hindi ipinipilit kung reflexive o intransitive ang tiwaling pagkilos.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: at lilihis sa daan
  rationale: Ang “lilihis” ay natural na katumbas ng tipanang idyoma para sa pagtalikod sa iniutos na landas ng pamumuhay.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: na iniutos ko sa inyo
  rationale: Pinananatili si Moises bilang nagsasalita at nagbibigay ng utos.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: Sasapit sa inyo ang kapahamakan
  rationale: Ang קרא kasama ng רָעָה ay tumutukoy sa masamang pangyayaring darating sa isang tao; malinaw at likas sa Tagalog ang “sasapit” at “kapahamakan.”
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: sa mga araw na darating
  rationale: Pinananatili ang hinaharap na diwa nang hindi ipinipilit ang isang tiyak na sistemang eskatolohikal.
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: sapagkat gagawin ninyo ang masama
  rationale: Direkta at natural na salin ng moral na pagtatasa sa Hebreo.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Karaniwang idyomang Tagalog na nagpapahayag ng pagtatasa ayon kay Yahweh.
- source_word: לְהַכְעִיסוֹ
  choice: gagalitin ninyo siya
  rationale: 'Malinaw na ipinahahayag ang causative na diwa ng Hiphil: ang kanilang mga gawa ang pumupukaw sa galit niya.'
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: sa pamamagitan ng mga gawa ng inyong mga kamay
  rationale: Pinananatili ang konkretong larawang Hebreo, na maaaring tumukoy sa mga bagay na ginawa o sa mas malawak na gawain ng Israel.
theological_decisions:
- issue: Pagpapahayag sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ang personal na pangalan sa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng בְּאַחֲרִית הַיָּמִים
  choice: sa mga araw na darating
  alternative: sa mga huling araw
  rationale: Ang parirala ay nakatuon sa hinaharap at maaaring magkaroon ng eskatolohikal na bigat, ngunit hindi iyon kailangang ipako sa talatang ito; inilalahad sa talababa ang mas literal at tradisyonal na alternatibo.
- issue: Kahulugan ng רָעָה sa sasapit na bunga
  choice: kapahamakan
  alternative: kasamaan; sakuna
  rationale: Sa konstruksyong ito, ang salita ay tumutukoy sa masamang pangyayaring sasapit sa Israel, hindi lamang sa moral na kasamaan; pinananatili sa talababa ang saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “gagawi nang tiwali” upang mapanatili ang moral na diwa at ang kawalan ng tahasang layon sa Hebreo. Ang “mga gawa ng inyong mga kamay” ay sadyang pinanatili bilang biblikal ngunit madaling maunawaang larawan.
