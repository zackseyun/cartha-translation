revisions:
- from: Sapagkat alam kong pagkamatay ko, tiyak na gagawi kayo nang tiwali[a] at lilihis sa daang iniutos ko sa inyo. Sasapit sa inyo ang kapahamakan[b] sa mga araw na darating[c], sapagkat gagawin ninyo ang masama sa paningin ni Yahweh at gagalitin ninyo siya sa pamamagitan ng mga gawa ng inyong mga kamay.
  to: Sapagkat alam kong pagkamatay ko, tiyak na magpapakasama kayo[a] at lilihis sa daang iniutos ko sa inyo. Sasapit sa inyo ang kapahamakan[b] sa mga araw na darating[c], sapagkat gagawin ninyo ang masama sa paningin ni Yahweh at gagalitin ninyo siya sa pamamagitan ng mga gawa ng inyong mga kamay.
  rationale: Pinalitan lamang ang di-gaanong likas na “gagawi kayo nang tiwali” ng “magpapakasama kayo.” Hindi binabago ng rebisyong ito ang paksa, katiyakan, o moral na diwa ng pandiwang Hebreo; ang mga posibleng reflexive at intransitive na pag-unawa ay malinaw na pinananatili sa talababa.
