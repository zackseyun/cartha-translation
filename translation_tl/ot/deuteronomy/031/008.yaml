id: DEU.31.8
reference: Deuteronomy 31:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה ה֣וּא הַ/הֹלֵ֣ךְ לְ/פָנֶ֗י/ךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַֽעַזְבֶ֑/ךָּ לֹ֥א תִירָ֖א וְ/לֹ֥א תֵחָֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: tl
  text: At si Yahweh mismo ang mauuna sa iyo. Siya mismo ang sasaiyo; hindi ka niya pababayaan[a] ni iiwan. Huwag kang matakot ni panghinaan ng loob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi ka niya bibitiwan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: At si Yahweh
  rationale: Pinananatili ang pangalang tipan na tahasang nasa tekstong Hebreo; ang וַ ay likas na isinaling “At” bilang pagpapatuloy ng pahayag.
- source_word: הוּא הַהֹלֵךְ לְפָנֶיךָ
  choice: mismo ang mauuna sa iyo
  rationale: Ipinahahayag ng hiwalay na panghalip ang diin (“mismo”), samantalang natural na tinutumbasan ng “mauuna sa iyo” ang Hebreong idyoma ng paglakad sa unahan bilang paggabay at pag-iingat.
- source_word: הוּא יִהְיֶה עִמָּךְ
  choice: Siya mismo ang sasaiyo
  rationale: Pinananatili ang ikalawang mariing הוּא at ang payak ngunit makabuluhang pangako ng presensiya.
- source_word: לֹא יַרְפְּךָ
  choice: hindi ka niya pababayaan
  rationale: Ang רפה sa Hiphil ay maaaring mangahulugang bibitiwan, hahayaang manghina, o kukulangin sa pagtulong; ang “pababayaan” ay natural sa Filipino at inilalahad sa talababa ang mas literal na alternatibo.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: ni iiwan
  rationale: Tuwirang ipinakikita ang עזב bilang pag-iwan o pagtalikod, habang iniiwasang ulitin lamang ang naunang pandiwa.
- source_word: לֹא תִירָא
  choice: Huwag kang matakot
  rationale: Ang di-ganap na anyo na may לֹא ay gumaganap dito bilang pagbabawal o panghihikayat.
- source_word: וְלֹא תֵחָת
  choice: ni panghinaan ng loob
  rationale: Natural na Filipino para sa pagiging nasisiraan ng tapang o nadudurog sa harap ng panganib, at hindi inuulit lamang ang diwa ng pagkatakot.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalang pantangi ang tetragrammaton sa Hebreo. Ang “Yahweh” ay nagpapanatili sa pagkakakilanlan nito bilang ipinahayag na pangalan nang hindi pinapalitan ng isang titulo.
- issue: Diin ng dalawang paglitaw ng הוּא
  choice: mismo / Siya mismo
  alternative: siya / Siya
  rationale: Mahalaga sa pangako ang mariing pagtuon na si Yahweh mismo ang mangunguna at sasama; kaya pinanatili ang diin sa parehong sugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “iyo/ka” sapagkat si Josue ang tuwirang kinakausap. Pinanatili ang paralelismo at mariing pag-uulit ng “mismo,” ngunit ginawang likas sa Tagalog ang Hebreong idyoma.
