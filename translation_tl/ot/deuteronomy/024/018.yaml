  naturalness: Makabago at marangal ang rehistro. Mas natural at walang kalabuan ang “tinubos ka ni Yahweh na iyong Diyos mula roon.”
  terminology: Wasto ang “Yahweh,” “Diyos,” “alipin,” at “tinubos.” Pinananatili ng “alipin” ang bigat ng עֶבֶד, at ng “tinubos” ang kahulugan at teolohikal na alingawngaw ng פדה.
