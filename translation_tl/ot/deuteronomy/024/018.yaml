  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/שָּׁ֑ם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: tl
  text: At alalahanin mong naging alipin ka sa Ehipto, at tinubos ka ni Yahweh na iyong Diyos mula roon; kaya iniuutos ko sa iyo na gawin ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: At alalahanin mo
  rationale: Ang anyong may pang-ugnay ay gumaganap bilang tagubilin sa konteksto. Pinananatili ng “At” ang payak na ugnayan, at likas sa Tagalog ang “alalahanin mo” bilang pautos.
- source_word: כִּי
  choice: -ng
  rationale: Ipinakikilala nito ang nilalaman ng dapat alalahanin. Sa Tagalog, likas itong ipinahahayag sa pang-angkop sa “alalahanin mong naging,” sa halip na gumamit ng tahasang “na.”
- source_word: עֶבֶד
  choice: alipin
  rationale: Malinaw na ipinahahayag ng “alipin” ang kalagayang nakagapos at hindi pinapalambot ang kalagayan ng Israel sa Ehipto gaya ng maaaring gawin ng “lingkod.”
- source_word: בְּמִצְרַיִם
  choice: sa Ehipto
  rationale: Tuwirang katumbas ng Hebreo at natural sa makabagong Tagalog; hindi kailangang idagdag ang “lupain ng.”
- source_word: וַיִּפְדְּךָ
  choice: tinubos ka
  rationale: Pinananatili ng “tinubos” ang diwa ng pagpapalaya sa pagkakaalipin sa pamamagitan ng pagtubos, pati ang teolohikal na bigat ng pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwiran at marangal na salin ng anyong may panlaping pangalawang panauhang panlalaki na isahan.
- source_word: מִשָּׁם
  choice: roon
  rationale: Likas na pang-abay sa Tagalog na tumutukoy pabalik sa Ehipto; sa ayos na “tinubos ka roon,” malinaw ang pinanggalingan ng pagpapalaya.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Malinaw at natural na naghahayag ng bunga o etikal na paghinuha mula sa pagtubos tungo sa pagsunod.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: iniuutos ko sa iyo
  rationale: Ang kasalukuyang aspektong “iniuutos” at tahasang “ko” ay sumasalamin sa nagpapatuloy at may-diin na utos ng nagsasalita.
- source_word: לַעֲשׂוֹת
  choice: na gawin
  rationale: Tuwiran at natural na katumbas ng layuning pawatas sa konteksto.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: ito
  rationale: Tumutukoy ito sa naunang legal na tagubilin. Ang “gawin ito” ang pinakanatural sa kasalukuyang Tagalog; ang “gawin ang bagay na ito” ay masyadong literal at mabigat.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Paglalarawan sa kalagayan ng Israel sa Ehipto sa עֶבֶד
  choice: alipin
  alternative: lingkod
  rationale: Sa konteksto ng pagkaalipin sa Ehipto, sentral ang sapilitang pagkagapos. Mas tumpak ang “alipin” kaysa sa mas malambot at malawak na “lingkod.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang natural na ayos na “tinubos ka roon ni Yahweh” at ang idiomatikong “gawin ito,” habang pinananatili ang payak na lohika at teolohikal na bigat ng Hebreo.
