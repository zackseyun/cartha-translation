  source_fidelity: Tumpak na naipapahayag ng draft ang pagbabawal sa unang asawa na muling kunin ang babae, ang hindi tinukoy na pagkadungis, ang tindi ng תּוֹעֵבָה, at ang pananagutang may kinalaman sa lupain. Gayunman, ang panghalip na “nito” sa “upang maging asawa nito” ay hindi gaanong malinaw at hindi likas sa ganitong legal na pangungusap.
  naturalness: Marangal at karaniwang nauunawaan ang Tagalog, ngunit mas malinaw at natural ang aktibong ayos na “hindi na maaaring bumalik upang kunin siyang muli ... bilang asawa.” Iniiwasan nito ang potensyal na malabong reperensiya ng “nito.”
  terminology: Ang “Yahweh,” “madungisan,” “karumal-dumal na bagay,” at “mana” ay angkop. Ang “karumal-dumal na bagay” ay mas tuwirang naipapahayag ang pangngalang תּוֹעֵבָה kaysa sa pang-uring “kasuklam-suklam” lamang.
