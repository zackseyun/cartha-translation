base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: tl
  text: Hindi na maaaring bumalik ang una niyang asawa, na nagpaalis sa kanya, upang kunin siyang muli bilang kanyang asawa matapos siyang madungisan[a], sapagkat ito ay isang karumal-dumal na bagay sa harap ni Yahweh. Huwag mong dalhan ng kasalanan ang lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos bilang mana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matapos siyang maging marumi” o “matapos siyang gawing marumi.” Sinasabi ng Hebreo na “matapos siyang madungisan,” ngunit hindi nito tinutukoy ang eksaktong uri ng pagkadungis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: una niyang asawa
  rationale: Sa kontekstong pangmag-asawa, ang בַּעַל ay “asawa,” at tuwirang ipinapahayag ng הָרִאשׁוֹן ang “una,” bilang kaibahan sa sumunod na asawa.
- source_word: שִׁלְּחָהּ
  choice: nagpaalis sa kanya
  rationale: Pinananatili nito ang literal na diwa ng “nagpaalis/nagpalayo” habang malinaw sa nakapaligid na batas na diborsiyo ang konteksto.
- source_word: לָשׁוּב לְקַחְתָּהּ
  choice: muling kunin
  rationale: Likas sa Tagalog at ipinahihiwatig ang muling pag-aasawa nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
- source_word: לִהְיוֹת לוֹ לְאִשָּׁה
  choice: upang maging asawa nito
  rationale: Natural at malinaw na salin ng karaniwang idyomang Hebreo para sa relasyong mag-asawa.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: matapos siyang madungisan
  rationale: Ang pasibong anyo ng טמא ay nagsasaad ng pagkadungis o pagiging marumi ngunit hindi tinutukoy ang eksaktong uri; pinananatili ng “madungisan” ang lawak at tensiyon nito.
- source_word: תוֹעֵבָה
  choice: kasuklam-suklam
  rationale: Malakas na salitang moral at pangtipan na natural at marangal sa modernong Tagalog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang pinananatili ang diwa ng presensiya o paghatol sa harap ng Diyos at isinasalin ang pangalan ng tipan bilang Yahweh.
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: Huwag mong dalhan ng kasalanan ang lupain
  rationale: Ipinapahayag ang causative na puwersa ng Hiphil at ang lupa bilang layon, nang hindi kinakailangang ituring na literal na nagkakasala ang lupain.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: ibinibigay sa iyo ... bilang mana
  rationale: Natural na modernong Tagalog na nagpapanatili sa konsepto ng lupa bilang kaloob at pamanang pangtipan.
theological_decisions:
- issue: Kahulugan ng “matapos siyang madungisan” sa pagbabawal sa muling pag-aasawa
  choice: Panatilihin ang malawak na “madungisan” nang hindi tinutukoy ang natatanging uri ng pagkadungis.
  alternative: “matapos siyang maging marumi,” “matapos siyang dungisan sa seksuwal na paraan,” o “matapos siyang mawalan ng karapatang bumalik dahil sa ikalawang pag-aasawa”
  rationale: Ginagamit ng Hebreo ang pasibo ng טמא ngunit hindi tahasang nililinaw kung ritwal, seksuwal, legal, o relasyonal ang pagkadungis. Hindi dapat lutasin ng salin ang sadyang nananatiling tanong sa teksto.
- issue: Pagkasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan ng tipan ang mismong nasa tekstong Hebreo; pinananatili ito bilang “Yahweh.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang isahan na “mo/iyo” alinsunod sa anyong pang-isahan ng Hebreo. Pinanatili ang legal na tono, ang pangalan na Yahweh, at ang hindi tiyak na kahulugan ng pagkadungis.
