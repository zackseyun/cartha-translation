base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: tl
  text: Kapag namitas ka ng ubas sa iyong ubasan, huwag mo nang balikan iyon para pitasin ang mga natira[a]. Ang mga natira ay para sa dayuhang naninirahan[b], sa ulila[c], at sa balo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “huwag mong tipunin pagkatapos ang mga natira.” Ang pandiwang Hebreo ay tumutukoy sa muling pagdaan upang kunin ang naiwan matapos ang unang pamimitas.
    reason: lexical_alternative
  - marker: b
    text: Ang “dayuhang naninirahan” ay isang taong hindi katutubo ngunit nakatira sa gitna ng Israel; maaari ring isalin, “dayuhang residente.”
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin, “walang ama.” Sa maraming konteksto, ang salitang Hebreo ay partikular na tumutukoy sa isang batang nawalan ng ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Nagsisimula ito ng isang inaasahang kalagayan sa batas; mas natural dito ang “kapag” kaysa “kung.”
- source_word: תִבְצֹר
  choice: namitas ka ng ubas
  rationale: Ang pandiwang בּצר ay partikular na tumutukoy sa pag-aani o pamimitas ng ubas. Likas sa modernong Tagalog ang “namitas ng ubas.”
- source_word: כַּרְמְךָ
  choice: sa iyong ubasan
  rationale: Ang “ubasan” ang tuwiran at karaniwang katumbas ng כֶּרֶם.
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: huwag mo nang balikan iyon para pitasin ang mga natira
  rationale: Sa kontekstong ito, ang עולל ay tumutukoy sa ikalawang pagdaan upang kunin ang natirang ubas. Nililinaw ng salin ang kilos nang hindi gumagamit ng teknikal o di-pamilyar na salita.
- source_word: לַגֵּר
  choice: para sa dayuhang naninirahan sa lupain
  rationale: Ang גֵּר ay hindi basta dayuhang dumaraan kundi isang di-katutubong naninirahan sa gitna ng Israel. Ipinapahayag ng parirala ang panlipunan at legal na katayuang iyon.
- source_word: לַיָּתוֹם
  choice: sa ulila
  rationale: Karaniwang katumbas sa Tagalog ng יָתוֹם ang “ulila”; maaaring higit na tiyak na tumukoy ang Hebreo sa isang nawalan ng ama, kaya pinanatili iyon sa talababa.
- source_word: וְלָאַלְמָנָה
  choice: at sa balo
  rationale: Ang “balo” ang natural at marangal na katumbas ng אַלְמָנָה sa Tagalog.
- source_word: יִהְיֶה
  choice: Ang mga natira ay para
  rationale: Ipinahihiwatig ng payak na pandiwa na ang nalalabing bunga ay nakalaan sa mga binanggit na mahihina sa lipunan. Ginawang tahasan ang tinutukoy upang maging malinaw sa Tagalog.
