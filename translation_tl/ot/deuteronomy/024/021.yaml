translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Ang “namitas ng ubas” at “balikan ... para pitasin ang mga natira” ay madaling maunawaan ng karaniwang mambabasa, samantalang ang mga talababa ay nagpapanatili sa saklaw at posibleng literal na kahulugan ng mga terminong Hebreo.
