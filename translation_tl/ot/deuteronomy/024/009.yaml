base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: tl
  text: Alalahanin mo ang ginawa ni Yahweh na iyong Diyos kay Miriam sa daan nang lumabas kayo mula sa Ehipto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, sa paglalakbay ng Israel matapos silang lumabas sa Ehipto; tingnan ang Mga Bilang 12:1–15.
    reason: cross_reference
lexical_decisions:
- source_word: זָכוֹר
  choice: Alalahanin ninyo
  rationale: Ang Qal imperative ay anyong isahan, ngunit tumutukoy sa bawat kasapi ng Israel; sa natural na modernong Tagalog, ang magalang o pangmaramihang “ninyo” ay umaayon sa kasunod na tahasang pangmaramihang בְּצֵאתְכֶם.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: ang ginawa
  rationale: Likas at tuwirang ipinapahayag nito ang nilalaman ng dapat alalahanin nang hindi dinaragdagan ang diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Isinasalin ang katawagang tipan na “iyong Diyos”; ginamit ang “inyong” upang maging natural sa Tagalog at umayon sa pangmaramihang kausap sa hulihan ng talata.
- source_word: לְמִרְיָם
  choice: sa Miriam
  rationale: Ang ל ay tumutukoy sa taong naapektuhan ng ginawa; pinananatili ng “sa Miriam” ang pagiging pangkalahatan nito nang hindi tahasang ipinakahulugang “laban kay Miriam.”
- source_word: בַּדֶּרֶךְ
  choice: noong naglalakbay kayo
  rationale: Ang literal na “sa daan” ay tumutukoy rito sa paglalakbay ng Israel; ang saling ito ay malinaw at natural sa modernong Tagalog.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: palabas ng Ehipto
  rationale: Kasama ng “noong naglalakbay kayo,” ipinahahayag nito ang temporal at prosesibong diwa ng paglabas nila mula sa Ehipto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kung ano ang ginawa kay Miriam
  choice: ang ginawa sa Miriam
  alternative: ang ginawa laban kay Miriam
  rationale: Hindi tinutukoy mismo ng talata ang detalye o eksaktong kulay ng kilos. Ang neutral na “ginawa sa Miriam” ay nagpapanatili sa lawak ng Hebreong לְמִרְיָם; nililinaw ng talababa ang konteksto sa Mga Bilang 12:1–15.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang Yahweh at iniwasang ilagay sa pangunahing teksto ang detalyeng hindi tahasang sinasabi ng talata.
