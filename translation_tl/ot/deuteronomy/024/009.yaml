  terminology: Ang “Yahweh,” “Diyos,” “Miriam,” at “Ehipto” ay angkop at pare-pareho. Ang “kay Miriam” ay mas likas na Tagalog para sa taong pinag-ukulan ng ginawa kaysa “sa Miriam.”
