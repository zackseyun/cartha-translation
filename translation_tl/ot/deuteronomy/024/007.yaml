  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: tl
  text: Kung masumpungang may isang lalaking dumudukot ng isa sa kanyang mga kapatid na Israelita[a], at itinuring niya itong alipin at ipinagbili, ang dumukot na iyon ay dapat patayin. Sa gayon, aalisin mo ang kasamaan sa iyong kalagitnaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” dito ay tumutukoy sa kapwa kabilang sa Israel, hindi lamang sa kapatid sa laman. Literal na “nagnanakaw ng isang tao” ang pananalita para sa pagdukot.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: יִמָּצֵא
  choice: may mahuli
  rationale: Ang Niphal ng מצא ay pasibong “masumpungan/mahuli.” Sa makabagong legal na Filipino, natural ang “may mahuling” at pinananatili nito ang kondisyong legal.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tahasang panlalaki at isahan ang Hebreo; pinananatili ito sa halip na gawing walang kasarian.
- source_word: גֹּנֵב נֶפֶשׁ
  choice: dumudukot
  rationale: Literal itong “nagnanakaw ng isang tao.” Sa kontekstong legal, ang “dumudukot” ang malinaw at likas na katumbas ng pag-agaw o pagkidnap sa tao.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: isa sa mga kapatid niyang kabilang sa mga Israelita
  rationale: Pinananatili ng “kapatid” ang wikang pampamilya ng tipan, habang nililinaw ng kasunod na parirala na kapwa Israelita ang tinutukoy, hindi lamang kapatid sa laman.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: inalipin niya ito
  rationale: Sa kontekstong ito, ang Hitpael ng עמר ay tumutukoy sa pagtrato sa dinukot na tao bilang alipin o pag-aari. Tuwiran at hindi pinalalambot ng “inalipin” ang pagsasamantala.
- source_word: וּמְכָרוֹ
  choice: at ipinagbili
  rationale: Tuwirang isinasalin ang מכר at pinananatiling hayag ang pagbebenta bilang bahagi ng krimen.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: dapat patayin ang dumukot na iyon
  rationale: Ang literal na “mamamatay ang magnanakaw na iyon” ay pormulang legal na nagpapataw ng parusang kamatayan. Nililinaw ng “dumukot” na pagnanakaw ng tao ang tinutukoy.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Sa gayon, aalisin ninyo ang kasamaan sa gitna ninyo
  rationale: Pinananatili ang paulit-ulit na pormulang panghukuman sa Deuteronomio sa natural at marangal na Filipino.
theological_decisions:
- issue: Wikang pampamilya para sa kapwa miyembro ng Israel
  choice: mga kapatid niyang kabilang sa mga Israelita
  alternative: kapwa Israelita; mga kamag-anak
  rationale: Pinananatili ang tunay na talinghagang pampamilya ng אָח, ngunit nililinaw na ang saklaw ay ang sambayanan ng Israel at hindi lamang mga kapatid sa laman.
- issue: Kahulugan ng וְהִתְעַמֶּר בּוֹ
  choice: inalipin niya ito
  alternative: pinagsamantalahan niya ito; itinuring niya itong alipin
  rationale: Hinihingi ng konteksto ng pagdukot at pagbebenta ang malinaw na pahiwatig ng pagkaalipin. Hindi dapat palambutin bilang pangkalahatang masamang pagtrato lamang.
- issue: Pormula ng parusang kamatayan
  choice: dapat patayin ang dumukot na iyon
  alternative: mamamatay ang dumukot na iyon
  rationale: Ipinahahayag ng Hebreong וּמֵת sa batas ang ipinag-uutos na parusa, hindi lamang isang hulang mamamatay siya. Ang salin ay nagpapanatili sa legal na bisa nang hindi nagdaragdag ng paraang hindi binanggit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may himig legal. Ginamit ang “dumudukot” sa halip na ang hiram na “kinikidnap,” at pinanatili ang wikang “kapatid” upang maipakita ang ugnayang pampamilya sa loob ng Israel.
