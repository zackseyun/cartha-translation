revisions:
- from: Kung may mahuling isang lalaki na dumudukot ng isa sa mga kapatid niyang kabilang sa mga Israelita[a], at inalipin niya ito at ipinagbili, dapat patayin ang dumukot na iyon. Sa gayon, aalisin ninyo ang kasamaan sa gitna ninyo.
  to: Kung masumpungang may isang lalaking dumudukot ng isa sa kanyang mga kapatid na Israelita[a], at itinuring niya itong alipin at ipinagbili, ang dumukot na iyon ay dapat patayin. Sa gayon, aalisin mo ang kasamaan sa iyong kalagitnaan.
  rationale: Inayos ang sintaks ng kondisyong legal upang malinaw na ang lalaki ay masusumpungang dumudukot. Pinasimple ang pagtukoy sa kapwa Israelita habang pinananatili ang “mga kapatid.” Ginawang “itinuring niya itong alipin” ang disputed na pandiwang וְהִתְעַמֶּר upang ipahayag ang pagtrato sa biktima bilang alipin nang hindi lumampas sa saklaw ng anyong pandiwa. Ibinalik ang isahang kausap sa pangwakas na pormula.
