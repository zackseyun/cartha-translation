  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: tl
  text: Sa labas ka tatayo, at ilalabas sa iyo ng lalaking pinauutang mo[a] ang sangla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang lalaking may utang sa iyo.” Maaaring bigyang-diin ng ekspresyong Hebreo ang pagpapautang ng nagpapautang o ang kalagayan ng nangungutang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: sa labas
  rationale: Tumutukoy ito sa lugar sa labas ng bahay; natural at malinaw ang “sa labas” sa makabagong Tagalog.
- source_word: תַּעֲמֹד
  choice: ka tatayo
  rationale: Pinananatili nito ang kongkretong kahulugan ng עמד na “tumayo,” habang ang ayos na “Sa labas ka tatayo” ay angkop bilang legal na tagubilin.
- source_word: וְהָאִישׁ
  choice: at ang lalaking
  rationale: Ang אִישׁ ay tahasang “lalaki” sa kasong inilalarawan, kaya hindi ito ginawang neutral na “tao.”
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: pinauutang mo
  rationale: Sa konteksto ng pagsasangla para sa pautang, ipinapahayag nito nang natural ang ugnayan ng nagpapautang at nangungutang. Inilalahad sa talababa ang tunay na alternatibong pagbasa na nakatuon sa kalagayan ng may utang.
- source_word: יוֹצִיא
  choice: maglalabas
  rationale: Ang Hiphil ng יצא ay “magpalabas” o “maglabas”; ang “maglalabas” ay natural at pinananatili ang paggalaw mula sa loob patungo sa labas.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Tuwirang ipinahahayag nito ang direksiyon patungo sa nagpapautang.
- source_word: הָעֲבוֹט
  choice: sangla
  rationale: Ang “sangla” ang karaniwan at malinaw na salitang Tagalog para sa bagay na ibinibigay bilang katiyakan sa utang.
- source_word: הַחוּצָה
  choice: maglalabas
  rationale: Ang direksiyonal na diwa na “palabas” ay likas nang kasama sa pandiwang “maglalabas,” kaya hindi kailangang ulitin ang “sa labas.”
theological_decisions:
- issue: Kung ang אֲשֶׁר אַתָּה נֹשֶׁה בוֹ ay nakatuon sa pagpapautang ng pinagkakautangan o sa pagkakautang ng may utang
  choice: ang lalaking pinauutang mo
  alternative: ang lalaking may utang sa iyo
  rationale: Parehong pinahihintulutan ng ekspresyong Hebreo ang pagtuon sa kilos ng nagpapautang o sa kalagayan ng nangungutang. Ginamit sa teksto ang natural na pagbasa ayon sa konteksto ng pautang, at pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa tekstong legal. Pinanatili ang kongkretong utos na tumayo sa labas at ang panlalaking pagtukoy ng Hebreo.
