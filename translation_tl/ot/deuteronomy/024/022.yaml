translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alipin” upang tumpak na ilarawan ang kalagayan sa Ehipto, at pinanatili ang legal na ugnayan ng pag-alaala at pagsunod sa pamamagitan ng “kaya.”
