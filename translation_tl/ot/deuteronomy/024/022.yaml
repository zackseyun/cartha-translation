  yaml_path: translation/ot/deuteronomy/024/022.yaml
  text: And remember that you were a servant in the land of Egypt[a]; therefore I am commanding you to do this thing.
translation:
  language: tl
  text: At alalahanin mong naging alipin ka sa lupain ng Ehipto; kaya iniuutos ko sa iyo na gawin ang bagay na ito[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang usaping ito” o “ang utos na ito.” Ang Hebreong “ang bagay na ito” ay tumutukoy sa naunang tagubilin na mag-iwan ng ani para sa mga nangangailangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: At alalahanin mo
  rationale: Ang anyong perpekto na may pang-ugnay ay may puwersang pautos o mapagtagubilin sa kontekstong legal; pinananatili ng “At” ang kaugnayan sa naunang utos.
- source_word: כִּי
  choice: -ng
  rationale: Ipinakikilala nito ang nilalaman ng dapat alalahanin; likas sa Tagalog ang pang-angkop sa “alalahanin mong naging…”.
- source_word: עֶבֶד
  choice: alipin
  rationale: Tumutukoy ito sa kalagayang nakagapos sa pagkaalipin, lalo na sa konteksto ng Ehipto, hindi sa karaniwang paglilingkod.
- source_word: הָיִיתָ
  choice: naging ... ka
  rationale: Likas na Tagalog para sa dating kalagayan ng Israel; malinaw nitong ipinahahayag na sila ay nasa kalagayan ng pagkaalipin.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang kongkretong pariralang Hebreo sa halip na paikliin bilang “sa Ehipto.”
- source_word: עַל כֵּן
  choice: kaya
  rationale: Malinaw at natural na ipinahahayag ang lohikal na bunga ng pag-alaala sa dating pagkaalipin.
- source_word: אָנֹכִי
  choice: ako
  rationale: Ang independiyenteng panghalip ay may diin; sa Tagalog, naihahayag ito sa “iniuutos ko,” nang hindi kailangang dagdagan ng “ako mismo.”
- source_word: מְצַוְּךָ
  choice: iniuutos ko sa iyo
  rationale: Ang aspektong nagaganap ng pandiwang Tagalog ay angkop sa kasalukuyan at nagpapatuloy na puwersa ng Hebreong participle.
- source_word: לַעֲשׂוֹת
  choice: na gawin
  rationale: Tuwirang katumbas ng malawak at payak na kahulugan ng עשה, nang hindi nililimitahan sa mas teknikal na diwa.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Malapit sa malawak na saklaw ng דָּבָר at hindi agad nagpapakahulugang “utos” lamang; tumutukoy ito sa naunang tagubilin.
