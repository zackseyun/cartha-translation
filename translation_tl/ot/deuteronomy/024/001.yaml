  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: tl
  text: Kung ang isang lalaki ay kumuha ng isang babae bilang asawa at pinakasalan niya siya, at nangyari ngang hindi siya nakasumpong ng lingap sa paningin niya dahil may nakita siyang isang kahiya-hiyang bagay[a] sa kanya, at sumulat siya para sa kanya ng kasulatan ng diborsiyo, ibinigay niya iyon sa kamay niya, at pinaalis niya siya mula sa kanyang bahay,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang bagay na mahalay” o “isang nakahihiyang bagay.” Hindi tiyak ang saklaw ng pariralang Hebreo, at iba-iba ang naging pakahulugan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Ipinakikilala nito ang kondisyon ng isang kasong legal; hindi pa ito utos o pahintulot na makipaghiwalay.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: ang isang lalaki ay kumuha ng isang babae bilang asawa
  rationale: Pinananatili ang Hebreong idyoma ng ‘pagkuha’ habang nililinaw na pag-aasawa ang tinutukoy.
- source_word: וּבְעָלָהּ
  choice: at naging asawa niya ito
  rationale: Ipinahahayag ang pagpasok sa ugnayang mag-asawa nang hindi ginagamit ang posibleng mapanlinlang na diwa ng pagmamay-ari.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: hindi na ito kalugud-lugod sa paningin niya
  rationale: Pinananatili ang larawang ‘sa paningin niya’ at isinasalin ang idyoma sa likas na makabagong Tagalog.
- source_word: עֶרְוַת דָּבָר
  choice: isang bagay na kahiya-hiya
  rationale: Sinasalamin ang di-tiyak at pinagtatalunang saklaw ng parirala nang hindi ito nililimitahan sa isang espesipikong kasalanang seksuwal.
- source_word: סֵפֶר כְּרִיתֻת
  choice: kasulatan ng paghihiwalay
  rationale: Malinaw na tumutukoy sa pormal na dokumentong legal na nagpapawalang-bisa sa pag-aasawa.
- source_word: וְנָתַן בְּיָדָהּ
  choice: iniabot iyon sa kamay nito
  rationale: Pinananatili ang kongkreto at pamamaraang legal na kilos ng paglalagay ng dokumento sa kamay ng babae.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: pinaalis ito sa kanyang bahay
  rationale: Inihahatid ang parehong legal na pagpapaalis at ang tahasang paglabas mula sa bahay ng lalaki.
theological_decisions:
- issue: Kung ang talata ay utos na sumasang-ayon sa diborsiyo o simula ng kondisyon ng isang kasong legal
  choice: Isinalin bilang kondisyong legal na nagpapatuloy sa mga susunod na talata, hindi bilang utos na makipaghiwalay
  alternative: Maaaring isalin nang tila pinahihintulutan o iniuutos ang diborsiyo kapag may natuklasang kahiya-hiya.
  rationale: Ang כִּי at ang sintaks ng Deuteronomio 24:1–4 ay bumubuo ng mahabang protasis; sa bandang huli pa dumarating ang pangunahing pagbabawal. Kaya nagtatapos ang talatang ito sa kuwit at hindi ginagawang utos ang mga kilos ng lalaki.
translation_notes:
  register: Makabago, dignipikado, at malinaw na Tagalog na may bahagyang pormal na himig na angkop sa batas. Ginamit ang ‘ito/rito/nito’ para sa babae bilang karaniwang panghalip sa Tagalog, hindi upang ipahiwatig na siya ay isang bagay. Pinanatili ang pangungusap na bukas sa dulo sapagkat nagpapatuloy ang kondisyong legal sa mga susunod na talata.
