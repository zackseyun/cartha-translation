revisions:
- from: Kung ang isang lalaki ay kumuha ng isang babae bilang asawa at naging asawa niya ito, ngunit hindi na ito kalugud-lugod sa paningin niya dahil may natuklasan siyang isang bagay na kahiya-hiya[a] sa babae, at sumulat siya para rito ng kasulatan ng paghihiwalay, iniabot iyon sa kamay nito, at pinaalis ito sa kanyang bahay,
  to: Kung ang isang lalaki ay kumuha ng isang babae bilang asawa at pinakasalan niya siya, at nangyari ngang hindi siya nakasumpong ng lingap sa paningin niya dahil may nakita siyang isang kahiya-hiyang bagay[a] sa kanya, at sumulat siya para sa kanya ng kasulatan ng diborsiyo, ibinigay niya iyon sa kamay niya, at pinaalis niya siya mula sa kanyang bahay,
  rationale: Inayos ang mga panghalip at mga pandiwa upang maging likas at magalang ang modernong Tagalog, habang pinanatili ang sunod-sunod na kondisyon at ang pangungusap na hindi pa tapos. Pinalitan ang katawagan sa dokumento ng mas tiyak na legal na “kasulatan ng diborsiyo.” Hindi nilinaw nang labis ang “kahiya-hiyang bagay,” sapagkat sinasadyang malabo at pinagtatalunan ang Hebreong parirala.
