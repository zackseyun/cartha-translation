  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י תִקְצֹר֩ קְצִֽירְ/ךָ֨ בְ/שָׂדֶ֜/ךָ וְ/שָֽׁכַחְתָּ֧ עֹ֣מֶר בַּ/שָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְ/קַחְתּ֔/וֹ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מַעֲשֵׂ֥ה יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: tl
  text: Kapag inaani mo ang ani sa iyong bukid at nakalimutan mong may isang bigkis sa bukid, huwag mo itong balikan upang kunin. Para ito sa dayuhang naninirahan,[a] sa ulila,[b] at sa biyuda, upang pagpalain ka ni Yahweh na iyong Diyos sa lahat ng gawain ng iyong mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakikipamayan.” Ang salitang Hebreo ay tumutukoy sa isang di-katutubong naninirahan sa gitna ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “walang ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִקְצֹר קְצִירְךָ
  choice: Kapag inaani mo ang ani
  rationale: Ang כִּי ay nagbubukas ng isang karaniwang sitwasyong legal; natural sa Tagalog ang “kapag.” Pinananatili ng “inaani” at “ani” ang pag-uulit ng ugat sa Hebreo nang hindi nagiging labis na teknikal.
- source_word: עֹמֶר
  choice: isang bigkis
  rationale: Sa kontekstong ito, tumutukoy ito sa nakabigkis na pinutol na butil, hindi sa yunit ng sukat na omer. Ang “bigkis” ay malinaw at likas sa modernong Tagalog.
- source_word: וְשָׁכַחְתָּ
  choice: may naiwan kang
  rationale: 'Bagaman literal na “nakalimutan mo,” sa Tagalog ang “may naiwan kang” ay natural na nagpapahayag ng bungang kalagayan: isang bigkis ang hindi sinasadyang naiwan sa bukid.'
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: huwag mo nang balikan iyon para kunin
  rationale: Pinananatili nito kapwa ang pagbabalik at ang pagkuha, at malinaw na ipinahahayag ang pagbabawal.
- source_word: לַגֵּר
  choice: sa dayuhang naninirahan sa inyong lupain
  rationale: Ipinahahayag nito ang גֵּר bilang di-katutubong naninirahan sa gitna ng Israel, hindi lamang isang panandaliang bisita o sinumang estranghero.
- source_word: לַיָּתוֹם
  choice: sa ulila
  rationale: Ang “ulila” ang karaniwan at dignified na katawagan sa modernong Tagalog; maaaring tumukoy ang Hebreo sa batang walang ama o magulang.
- source_word: יִהְיֶה
  choice: Ilaan iyon sa
  rationale: Sa konteksto ng batas tungkol sa naiwan sa bukid, ang diwa ay ang pagtatakda nito bilang panustos sa mahihina, hindi kinakailangang pormal na paglilipat ng pagmamay-ari.
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: upang pagpalain ka
  rationale: Direktang pinananatili ang layunin o inaasahang resulta na ipinakikilala ng לְמַעַן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalang banal na tahasang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶיךָ
  choice: sa lahat ng gawain ng iyong mga kamay
  rationale: Pinananatili ang konkretong idyomang Hebreo, na nauunawaan sa Tagalog bilang lahat ng ginagawa o pinagsisikapan ng tao.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Nasa talata ang Tetragrammaton bilang personal na pangalan. Ang “Yahweh” ay tuwirang transliterasyon at hindi ipinapalit ang isang titulo sa pangalan.
- issue: Saklaw ng kategoryang panlipunan na גֵּר
  choice: dayuhang naninirahan sa inyong lupain
  alternative: dayuhan; estranghero; nakikipamayan
  rationale: Pinananatili nito ang panlipunan at legal na diwa ng isang di-katutubong residenteng namumuhay sa Israel, nang hindi siya ilarawan bilang turista o ganap na hiwalay sa pamayanan.
- issue: Kahulugan ng יָתוֹם
  choice: ulila
  alternative: walang ama
  rationale: Ang “ulila” ay natural sa Tagalog, habang kinikilala sa talababa na maaaring higit na tiyak ang Hebreo sa kawalan ng ama; hindi pinipilit ng pangunahing teksto ang mas makitid na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa Bibliya. Ginamit ang “bukid,” “bigkis,” at “biyuda” bilang karaniwang salitang madaling maunawaan. Napanatili ang direktang tono ng batas at ang konkretong idyomang “gawain ng iyong mga kamay.”
