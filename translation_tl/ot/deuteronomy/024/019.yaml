revisions:
- from: Kapag inaani mo ang ani sa iyong bukid at may naiwan kang isang bigkis sa bukid, huwag mo nang balikan iyon para kunin. Ilaan iyon sa dayuhang naninirahan sa inyong lupain,[a] sa ulila,[b] at sa biyuda, upang pagpalain ka ni Yahweh na iyong Diyos sa lahat ng gawain ng iyong mga kamay.
  to: Kapag inaani mo ang ani sa iyong bukid at nakalimutan mong may isang bigkis sa bukid, huwag mo itong balikan upang kunin. Para ito sa dayuhang naninirahan,[a] sa ulila,[b] at sa biyuda, upang pagpalain ka ni Yahweh na iyong Diyos sa lahat ng gawain ng iyong mga kamay.
  rationale: Inalis ang hindi tahasang pariralang “sa inyong lupain” upang huwag dagdagan ang saklaw ng mismong talata. Pinalitan ang “may naiwan kang” ng “nakalimutan mong may” upang maipahayag ang pandiwang Hebreo para sa pagkalimot. Napanatili ang lahat ng pangunahing kahulugan, ang modernong Tagalog na rehistro, ang pangalang Yahweh, at ang mga talababa sa wastong mga anchor.
