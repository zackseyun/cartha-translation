  source_fidelity: Tumpak ang diwa ng talata. Ang “Kapag” ay angkop sa kasuistikong כִּי, ang “nagpautang ka ng anuman” ay natural na kumakatawan sa pagpapautang ng anumang bagay o halaga, at ang pagbabawal na pumasok sa bahay ng nangutang upang kunin ang sangla ay buo at hindi pinalalakas nang lampas sa Hebreo.
  naturalness: Likas, malinaw, at marangal ang modernong Filipino. Ang “kapwa mo” ay mas malawak kaysa literal na “kapitbahay” at angkop para sa רֵעַ sa kontekstong ito. Natural din ang legal na himig ng “huwag kang pumasok ... upang kunin.”
  terminology: Ang “sangla” ay wastong terminong Filipino para sa bagay na ibinigay bilang panagot. Ang alternatibong talababa na “ang isinangla niya” ay kapaki-pakinabang na paglilinaw nang hindi binabago ang kahulugan.
