  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: tl
  text: Kapag nagpautang ka ng anuman sa kapwa mo[a], huwag kang pumasok sa bahay niya upang kunin ang kanyang sangla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung nagpautang ka ng anuman sa kapwa mo, huwag kang pumasok sa bahay niya upang kunin ang isinangla niya.”
    reason: Pinananatili ang posibleng kondisyunal na diwa ng כִּי at ang alternatibong paglalarawan sa עֲבֹטוֹ bilang bagay na isinangla.
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Naglalahad ito ng isang karaniwang sitwasyon sa batas. Likas sa modernong Filipino ang “kapag,” habang nananatiling posible ang kondisyunal na “kung.”
- source_word: תַשֶּׁה
  choice: nagpautang ka
  rationale: Ang Hiphil ng נשה ay tumutukoy dito sa pagbibigay ng pautang o kredito. Ang “nagpautang” ay maikli at natural sa Filipino.
- source_word: בְרֵעֲךָ
  choice: sa kapwa mo
  rationale: Ang רֵעַ ay tumutukoy sa isang kapwa miyembro ng pamayanan. Mas malawak at mas angkop dito ang “kapwa” kaysa sa “kapitbahay.”
- source_word: מַשַּׁאת מְאוּמָה
  choice: ng anuman
  rationale: Sa ugnayan nito sa pandiwang “nagpautang,” ipinahihiwatig ng parirala ang anumang bagay o anumang uri ng pautang nang hindi inuulit nang alanganin ang salitang “pautang.”
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: huwag kang pumasok sa bahay niya
  rationale: Ang לֹא kasama ng imperfect sa kontekstong legal ay isang tahasang pagbabawal. Natural at marangal ang “huwag kang pumasok” sa Filipino.
- source_word: לַעֲבֹט עֲבֹטוֹ
  choice: upang kunin ang kanyang sangla
  rationale: Tumutukoy ang עבט sa pagkuha ng bagay na isinangla bilang panagot sa pautang. Ang “kunin” ay hindi kasing-lakas ng “agawin,” at ang “sangla” ay karaniwang terminong Filipino.
