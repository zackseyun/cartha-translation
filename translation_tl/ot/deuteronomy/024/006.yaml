  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: tl
  text: Huwag kunin bilang sangla ang magkapares na batong gilingan, ni kahit ang pang-ibabaw na bato, sapagkat buhay[a] ang kinukuha niya bilang sangla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “kabuhayan ng isang tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: kunin bilang sangla / kinukuhang sangla
  rationale: Sa kontekstong legal, tumutukoy ang חבל sa pagkuha ng isang bagay bilang panagot sa utang. Pinananatili ng magkaugnay na parirala ang pag-uulit sa Hebreo.
- source_word: רֵחַיִם
  choice: magkaparis na batong gilingan
  rationale: Ang anyong dual ay tumutukoy sa dalawang batong bumubuo sa gilingan; malinaw at likas sa Filipino ang paglalarawang ito.
- source_word: וָרָכֶב
  choice: ni kahit ang pang-ibabaw na bato
  rationale: Ang רָכֶב ay ang batong umiikot sa ibabaw. Ipinahihiwatig ng 'ni kahit' na hindi dapat kunin ang buong pares, ni maging ang mahalagang pang-ibabaw na bahagi lamang.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabawal sa isang maikli at marangal na paraang angkop sa tekstong legal.
- source_word: נֶפֶשׁ
  choice: buhay
  rationale: Dito, ang נֶפֶשׁ ay tumutukoy sa kongkretong buhay na nakasalalay sa kagamitan sa paghahanda ng pagkain, hindi partikular sa di-materyal na kaluluwa. Pinananatili ng 'buhay' ang matinding pahayag ng Hebreo.
- source_word: הוּא
  choice: ang kinukuhang
  rationale: Inihahatid ng ayos ng pangungusap na ang tunay na kinukuha bilang sangla ng nagpautang ay buhay mismo, nang hindi kailangang magdagdag ng tahasang paksa na wala sa salin.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa kontekstong legal at panlipunan
  choice: buhay, sa kongkretong diwa
  alternative: kabuhayan; kaluluwa; tao
  rationale: Ang pagkuha sa gilingan ay nag-aalis ng paraan ng paghahanda ng pang-araw-araw na pagkain at sa gayon ay nagsasapanganib sa buhay. Ang salin ay nagpapanatili sa lakas at bahagyang lawak ng Hebreo, habang inilalagay sa talababa ang mas paliwanag na 'kabuhayan.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'batong gilingan' upang madaling maunawaan ang sinaunang kagamitang tinutukoy, at pinanatili ang maikli at mariing pangangatwiran ng batas.
