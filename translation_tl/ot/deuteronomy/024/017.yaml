base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: tl
  text: Huwag mong baluktutin ang katarungang nararapat sa dayuhang naninirahan[a] o sa ulila, at huwag mong kunin bilang sangla ang damit ng isang biyuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dayuhang residente.” Ang salitang Hebreo ay tumutukoy sa isang hindi katutubong naninirahan sa gitna ng Israel at saklaw ng mga proteksiyong panlipunan at legal nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: baluktutin
  rationale: Ang Hiphil ng נטה sa kontekstong panghukuman ay nangangahulugang ilihis o sirain ang wastong pagpapatupad ng katarungan. Likas sa Filipino ang “baluktutin ang katarungan” at pinananatili nito ang larawan ng tekstong Hebreo.
- source_word: מִשְׁפַּט
  choice: katarungang nararapat sa
  rationale: Maaaring tumukoy ang מִשְׁפַּט sa katarungan, pasiya sa hukuman, o karapatang legal. Ipinahihiwatig ng parirala na hindi dapat ipagkait sa mahihinang tao ang makatarungang pagtrato na nauukol sa kanila.
- source_word: גֵּר
  choice: dayuhang naninirahan
  rationale: Ang גֵּר ay isang hindi katutubong naninirahan sa gitna ng Israel at saklaw ng mga proteksiyong panlipunan at legal nito, hindi lamang isang panandaliang bisita.
- source_word: יָתוֹם
  choice: ulila
  rationale: Tumutukoy ang salita sa batang nawalan ng proteksiyon ng ama. Ang “ulila” ang malinaw at karaniwang katumbas sa modernong Filipino nang hindi nagdaragdag ng hindi tahasang detalye.
- source_word: תַחֲבֹל
  choice: kunin bilang sangla
  rationale: Sa kontekstong legal at pang-utang, ang חבל ay ang pagkuha ng isang bagay bilang garantiya sa utang. Malinaw at natural sa Filipino ang “kunin bilang sangla.”
- source_word: בֶּגֶד
  choice: damit
  rationale: Pangkalahatang salita ang בֶּגֶד para sa kasuutan. Hindi ito isinalin bilang “balabal” upang hindi tukuyin nang higit sa sinasabi ng Hebreo ang uri ng damit.
- source_word: אַלְמָנָה
  choice: biyuda
  rationale: Karaniwan at malinaw na modernong Filipino ang “biyuda” para sa babaeng namatayan ng asawa.
theological_decisions:
- issue: Paglalarawan sa pinoprotektahang pangkat na גֵּר
  choice: dayuhang naninirahan
  alternative: dayuhan; estranghero; pansamantalang naninirahan
  rationale: Pinananatili ng “dayuhang naninirahan” ang legal at panlipunang diwa ng isang hindi katutubong nakatira sa komunidad. Hindi nito pinalalawak ang salita upang isama ang lahat ng dayuhan o nililimitahan ito sa isang bisita lamang.
- issue: Ugnayan ng גֵּר at יָתוֹם
  choice: dayuhang naninirahan o sa ulila
  alternative: ulilang dayuhang naninirahan
  rationale: Bagaman walang tahasang pang-ugnay sa tekstong Masoretiko sa pagitan ng dalawang pangngalan, karaniwang nauunawaan ang mga ito bilang dalawang magkahiwalay na mahihinang pangkat. Pinananatili ng “o” ang pagbabawal na iisang inilalapat sa alinman sa kanila, nang hindi pinagsasama ang mga ito bilang isang uri lamang ng tao.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Ang “baluktutin ang katarungan” ay isang likas na idyomang Filipino na malapit sa juridikal na larawan ng Hebreo; ang “kunin bilang sangla” naman ay tuwirang nauunawaan sa konteksto ng utang.
