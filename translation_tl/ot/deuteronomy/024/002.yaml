translation_notes:
  register: Makabago at marangal na Tagalog. Pinanatili ang magkakasunod na kilos ng tekstong Hebreo; ginamit ang “humayo” upang hindi tuluyang mawala ang hiwalay na וְהָלְכָה, samantalang ipinaliwanag sa talababa ang idyomang pangmag-asawa.
