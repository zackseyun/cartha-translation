  text: at umalis siya sa bahay ng lalaking iyon, at humayo at naging asawa ng ibang lalaki,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “at siya ay naging para sa ibang lalaki.” Sa kontekstong ito, ang idyomang Hebreo ay nangangahulugang nag-asawa siya ng ibang lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: at umalis siya sa bahay nito
  rationale: Tuwirang inilalarawan ng יצא kasunod ng מִן ang paglabas o pag-alis mula sa bahay. Natural sa modernong Tagalog ang “umalis sa bahay,” at ang “nito” ay malinaw na tumutukoy sa unang asawa sa mas malawak na pangungusap.
- source_word: וְהָלְכָה
  choice: at humayo
  rationale: Ipinagpapatuloy ng הלך ang legal na pagkakasunod-sunod pagkatapos ng pag-alis. Pinananatili ng “humayo” ang hiwalay na kilos sa Hebreo nang hindi tinutukoy kung saan siya pumunta.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: at naging asawa ng ibang lalaki
  rationale: Literal itong “at naging sa ibang lalaki,” ngunit sa konteksto ng diborsiyo at muling pag-aasawa, ang konstruksyong היה לְ ay tumutukoy sa pagpasok sa ugnayan ng pag-aasawa. Ginagawang malinaw ng “naging asawa” ang likas na kahulugan sa Tagalog nang hindi nagdaragdag ng bagong konsepto.
