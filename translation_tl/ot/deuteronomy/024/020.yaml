  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: tl
  text: Kapag hinahampas mo ang iyong punong olibo upang malaglag ang bunga, huwag mo itong balikan para kunin ang natira[a]. Ang matitira ay para sa dayuhang naninirahan[b], sa ulila sa ama[c], at sa biyuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “huwag mong muling pagpagin ang mga sanga.” Ang diwa ay huwag nang bumalik upang kunin ang mga olibong naiwan matapos ang unang pagpapatumba ng bunga.
    reason: lexical_alternative
  - marker: b
    text: Ang “dayuhang naninirahan” ay tumutukoy sa isang hindi katutubong taong naninirahan sa gitna ng Israel.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin, “ulila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Sa konteksto ng batas, ipinakikilala nito ang isang karaniwang sitwasyon at hindi lamang isang di-tiyak na kondisyon.
- source_word: תַחְבֹּט
  choice: hinahampas ... upang malaglag ang bunga
  rationale: Ang pandiwa ay tumutukoy sa paghampas sa punong olibo o mga sanga nito upang malaglag ang mga bunga; nilinaw ang layunin upang maging madaling maunawaan sa modernong Tagalog.
- source_word: זֵיתְךָ
  choice: iyong punong olibo
  rationale: Maaaring mangahulugan ang זַיִת ng olibo o punong olibo, ngunit ang ginagawang paghampas ay malinaw na tumutukoy sa puno.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: huwag mo itong balikan para kunin ang natira
  rationale: Sa batas tungkol sa pag-aani, ipinagbabawal ng idyoma ang muling pagdaan upang kunin ang mga olibong naiwan matapos ang unang pagpapatumba ng bunga.
- source_word: לַגֵּר
  choice: para sa dayuhang naninirahan
  rationale: Ang גֵּר ay isang hindi katutubong taong naninirahan sa gitna ng Israel; ipinahahayag ng salin kapuwa ang pagiging dayuhan at pagiging residenteng kabilang sa pamayanan.
- source_word: לַיָּתוֹם
  choice: sa ulila sa ama
  rationale: Partikular na inilalarawan ng יָתוֹם sa kontekstong panlipunan at legal ang batang nawalan ng ama, bagaman maaari rin itong isalin nang mas pangkalahatan bilang ‘ulila.’
- source_word: וְלָאַלְמָנָה
  choice: at sa biyuda
  rationale: Natural at tiyak na modernong Tagalog para sa babaeng namatayan ng asawa.
- source_word: יִהְיֶה
  choice: Ang matitira ay para
  rationale: Ipinahahayag ng payak na pandiwang ‘maging’ ang legal na paglalaan ng natirang bunga sa mga mahihinang pangkat.
