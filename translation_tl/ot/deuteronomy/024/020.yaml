translation_notes:
  register: Gumamit ng natural ngunit marangal na modernong Tagalog. Ang ‘hinahampas ... upang malaglag ang bunga’ ay nagbibigay ng kinakailangang kontekstong pang-agrikultura, samantalang ang ‘huwag mo itong balikan’ ay malinaw na naghahatid ng pagbabawal sa ikalawang pag-aani. Pinanatili ang tatlong uring panlipunang tahasang binanggit sa Hebreo.
