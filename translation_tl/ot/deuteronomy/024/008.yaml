  text: הִשָּׁ֧מֶר בְּ/נֶֽגַע הַ/צָּרַ֛עַת לִ/שְׁמֹ֥ר מְאֹ֖ד וְ/לַ/עֲשׂ֑וֹת כְּ/כֹל֩ אֲשֶׁר יוֹר֨וּ אֶתְ/כֶ֜ם הַ/כֹּהֲנִ֧ים הַ/לְוִיִּ֛ם כַּ/אֲשֶׁ֥ר צִוִּיתִ֖/ם תִּשְׁמְר֥וּ לַ/עֲשֽׂוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: tl
  text: Mag-ingat kayo tungkol sa paglitaw ng sakit sa balat[a], at maging lubos kayong maingat na sundin at gawin ang lahat ng ituturo sa inyo ng mga paring Levita. Kung paanong iniutos ko sa kanila, gayon din ninyo itong maingat na gawin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasaling “ketong.” Mas malawak ang saklaw ng salitang Hebreo at tumutukoy sa iba’t ibang kondisyon sa balat sa Torah, hindi lamang sa sakit na Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Mag-ingat kayo
  rationale: Ang Niphal imperative ng שׁמר ay babala at mahigpit na tagubilin. Natural sa modernong Tagalog ang “Mag-ingat kayo” at pinananatili nito ang lakas ng pautos.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: tungkol sa paglitaw ng sakit sa balat
  rationale: Ang נֶגַע ay maaaring tumukoy sa pinsala, marka, o paglitaw ng isang kondisyon, at ang צָרַעַת sa Torah ay mas malawak kaysa sa modernong Hansen’s disease. Iniiwasan ng “sakit sa balat” ang maling medikal na pagkakakilanlan.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: Tiyakin ninyong mabuti na susundin at gagawin ninyo
  rationale: Pinananatili ang diin ng מְאֹד at ang dalawang magkakaugnay ngunit magkahiwalay na kilos ng maingat na pagsunod/pagtalima at aktuwal na paggawa.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: ang lahat ng ituturo sa inyo
  rationale: Ang Hiphil ng ירה ay nangangahulugang magturo, magtagubilin, o magbigay ng direksiyon. Ang “ituturo” ay natural at angkop sa legal at panseremonyang paggabay ng mga pari.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: mga paring Levita
  rationale: Ang parirala ay karaniwang katawagan sa Deuteronomio para sa mga paring kabilang sa Levi; hindi ito ipinakikilalang dalawang magkahiwalay na pangkat.
- source_word: כַּאֲשֶׁר צִוִּיתִם תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: Kung ano ang iniutos ko sa kanila, iyon ang maingat ninyong gawin
  rationale: Malinaw na pinananatili ang utos ni Moises sa mga pari at ang kasunod na pananagutan ng Israel na isagawa iyon, habang natural ang pagkakabuo sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa צָרַעַת
  choice: sakit sa balat
  alternative: ketong
  rationale: Saklaw ng terminong Hebreo ang iba’t ibang kondisyong panritwal at hindi lamang ang modernong Hansen’s disease. Ang mas malawak na salin ay umiiwas sa anakronistikong katiyakán.
- issue: Pagkakakilanlan ng הַכֹּהֲנִים הַלְוִיִּם
  choice: mga paring Levita
  alternative: mga pari, ang mga Levita
  rationale: Pinakamalamang na isang Deuteronomikong katawagan ito para sa mga paring mula sa tribo ni Levi, hindi dalawang magkahiwalay na grupo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang “kayo/ninyo” upang katawanin ang kolektibong kausap sa Hebreo. Iniwasan ang sobrang literal na pag-uulit kung magiging mabigat sa Tagalog, ngunit pinanatili ang diin sa maingat na pagsunod at paggawa.
