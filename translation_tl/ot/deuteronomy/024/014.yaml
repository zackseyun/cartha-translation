base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: tl
  text: Huwag mong apihin[a] ang isang upahang manggagawang dukha at nangangailangan, isa man siya sa mga kapatid mo o isang dayuhang naninirahan sa lupain mo, sa isa sa iyong mga bayan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagsamantalahan” o “dayain.” Kasama sa pandiwang Hebreo ang pang-aaping pangkabuhayan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa iyong mga tarangkahan,” isang idyomang Hebreo na tumutukoy sa loob ng mga bayan o sa nasasakupan ng pamayanan.
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: apihin
  rationale: Saklaw ng pandiwang Hebreo ang pang-aapi at pagsasamantalang pangkabuhayan, kabilang ang pagkakait sa manggagawa ng nararapat sa kaniya. Pinananatili ng “apihin” ang malawak at matinding puwersang moral ng pagbabawal; nililinaw sa talababa ang aspektong pangkabuhayan.
- source_word: שָׂכִיר
  choice: upahang manggagawa
  rationale: Tumutukoy ito sa taong nagtatrabaho kapalit ng sahod. Likas at malinaw ito sa makabagong Filipino at hindi nagpapahiwatig na alipin ang tinutukoy.
- source_word: עָנִי וְאֶבְיוֹן
  choice: dukha at nangangailangan
  rationale: Pinananatili ang dalawang magkaugnay na salitang nagdiriin sa kahinaan ng kalagayang pangkabuhayan, nang hindi ipinagpapalagay ang eksaktong antas ng karalitaan.
- source_word: מֵאַחֶיךָ
  choice: isa sa mga kapatid mo
  rationale: Pinananatili ang literal na wikang pampamilya ng teksto at ang pagkakaugnay nito sa tipanang pamayanan; sa konteksto, tumutukoy ito sa isang kapuwa Israelita.
- source_word: מִגֵּרְךָ
  choice: isang dayuhang naninirahan
  rationale: Ang גֵּר ay isang hindi katutubong naninirahan sa loob ng pamayanang Israelita. Iniiwasan ng saling ito ang makabagong teknikal na katawagang pang-imigrasyon habang malinaw na hindi lamang panandaliang bisita ang tinutukoy.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: naninirahan sa lupain mo
  rationale: Likas na inuugnay ang sugnay sa isahang dayuhang residente at pinananatili ang isahang bilang ng Hebreo.
- source_word: בִּשְׁעָרֶיךָ
  choice: sa alinman sa iyong mga bayan
  rationale: Ang literal na “sa iyong mga tarangkahan” ay isang idyomang Hebreo para sa mga bayang nasasakupan ng isang pamayanan. Isinasalin sa malinaw na kahulugan sa pangunahing teksto at pinananatili ang literal na larawan sa talababa.
theological_decisions:
- issue: Ang katawagang pampamilya na אַחֶיךָ sa batas ng tipan
  choice: isa sa mga kapatid mo
  alternative: isa sa mga kapuwa Israelita mo
  rationale: Pinananatili ang tunay na wikang pampamilya at panlalaking anyo ng Hebreo, habang kinikilalang ang saklaw nito sa konteksto ay ang kapuwa kasapi ng Israel.
- issue: Ang katayuang panlipunan ng גֵּר
  choice: isang dayuhang naninirahan
  alternative: isang dayuhang nakikipamayan
  rationale: Inilalarawan ng termino ang protektadong residenteng tagalabas sa Israel. Hindi ito pinapantay sa anumang partikular na makabagong legal na katayuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang ikalawang panauhan upang tumbasan ang Hebreo. Iniwasan ang teknikal na katawagang legal para sa dayuhang residente at ang lipas na pananalita para sa manggagawang may sahod.
