  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: tl
  text: Dapat na dapat mong isauli sa kanya ang sangla[a] sa paglubog ng araw, upang mahiga siyang nakabalot sa kanyang balabal at pagpalain ka. Magiging katuwiran ito para sa iyo[b] sa harap ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang bagay na kinuha bilang sangla.”
    reason: lexical_alternative
  - marker: b
    text: O “ibibilang itong katuwiran sa iyo” o “magiging matuwid na gawa mo ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: Tiyakin mong isauli
  rationale: Ang infinitive absolute na kasama ng finite verb ay nagbibigay-diin sa utos. Likas sa modernong Tagalog ang “Tiyakin mong isauli” at pinananatili nito ang mariing puwersa.
- source_word: הַעֲבוֹט
  choice: ang sangla
  rationale: Tumutukoy ito sa bagay na kinuha bilang garantiya sa utang. Ang “sangla” ang maikli at karaniwang terminong Tagalog sa kontekstong legal at pangkabuhayan.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: sa paglubog ng araw
  rationale: Idyoma ito para sa pagsapit ng takipsilim o sunset; malinaw at natural ang “sa paglubog ng araw.”
- source_word: וְשָׁכַב בְּשַׂלְמָתוֹ
  choice: upang mahigaan niya ang kanyang balabal
  rationale: Ipinahahayag ng sugnay ang nilalayong bunga ng pagsasauli. Ang בְּ ay maaaring magpahiwatig ng paghiga na gamit o balot ang kasuotan; ang “mahigaan ... ang kanyang balabal” ay natural at ipinakikitang nagsisilbi itong sapin o pantakip sa pagtulog.
- source_word: וּבֵרֲכֶךָּ
  choice: at pagpalain ka
  rationale: Ang mahirap na tumanggap muli ng sangla ang siyang pagpapalain ang pinagkakautangan; pinananatili ng salin ang tuwirang kahulugan at ugnayan sa layuning sugnay.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: At ito ay magiging katuwiran para sa iyo
  rationale: Pinananatili ng “katuwiran” ang lawak at posibleng teolohikal-tipanang diwa ng צְדָקָה nang hindi ito agad nililimitahan sa “mabuting gawa” o sa ipinapalagay na pagbibilang.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: sa harap ni Yahweh na iyong Diyos
  rationale: Ang לִפְנֵי ay “sa harap/sa presensya ng,” at ang pangalang tipan na יהוה ay tuwirang isinaling “Yahweh.”
theological_decisions:
- issue: Pagbibigay-salin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo. Ang “Yahweh” ay mas tuwirang kumakatawan sa Tetragrammaton at hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng צְדָקָה sa pahayag na וּלְךָ תִּהְיֶה צְדָקָה
  choice: magiging katuwiran para sa iyo
  alternative: ibibilang itong katuwiran sa iyo; magiging matuwid na gawa mo ito
  rationale: Hindi tahasang ginagamit ng Hebreo ang pandiwang “ibilang.” Ang mas pormal na anyo ay nagpapanatili sa ambiguwidad kung ito ba ay katayuang kinikilala, pagkilalang mula sa Diyos, o isang matuwid na gawa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “sangla” bilang karaniwang terminong legal-pangkabuhayan, “balabal” para sa panlabas na kasuotang nagsisilbing pantakip sa gabi, at “katuwiran” upang mapanatili ang teolohikal at semantikong lawak ng Hebreo. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
