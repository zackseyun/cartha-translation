  rationale: Pinananatili ang tahasang panlalaking אִישׁ at ang diin ng panghalip na הוּא, habang likas pa rin sa modernong Filipino.
- source_word: לֹא תִשְׁכַּב
  choice: huwag kang matutulog
  rationale: Ang שׁכב ay literal na humiga o matulog; sa kontekstong ito, tumutukoy ito sa pagpapalipas ng gabi habang hawak ang isinangla.
- source_word: בַּעֲבֹטוֹ
  choice: nang nasa iyo ang kanyang isinangla
  rationale: 'Ipinahahayag nito ang kontekstuwal na diwa ng ב: hindi dapat magpalipas ng gabi na hawak pa ang bagay na ibinigay niya bilang seguridad sa utang. Mas malinaw ito kaysa sa literal ngunit maaaring malabong ''kasama ang kanyang sangla.'''
