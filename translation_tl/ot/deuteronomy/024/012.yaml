lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili nito ang pang-ugnay na ו at ang kundisyong ipinahihiwatig ng אִם bilang pagpapatuloy ng naunang talata.
- source_word: אִישׁ עָנִי הוּא
