revisions:
- from: Hindi dapat patayin ang mga ama dahil sa kanilang mga anak na lalaki[a], at hindi dapat patayin ang mga anak na lalaki dahil sa kanilang mga ama. Ang bawat isa ay dapat patayin dahil sa sarili niyang kasalanan.
  to: Hindi papatayin ang ama dahil sa kanyang anak na lalaki, ni ang anak na lalaki dahil sa kanyang ama; ang bawat isa ay papatayin dahil sa sarili niyang kasalanan.[a]
  rationale: Inalis ang modal na “dapat” upang mas tuwirang maipahayag ang legal na pormulasyon ng Hebreo. Ginawang isahan ang unang dalawang sugnay upang maiwasan ang kalabuan ng panghalip at mapanatili ang anyo at paralelismo ng pinagmulan. Iningatan ang saklaw na hudisyal ng “papatayin” at ang diin sa sariling kasalanan.
