  verdict: revise
  source_fidelity: 'Tumpak na naihahatid ng draft ang tatlong bahagi ng Hebreo: hindi dapat ipataw ang kamatayan sa mga ama dahil sa mga anak, ni sa mga anak dahil sa mga ama, at ang parusa ay batay sa sariling kasalanan. Gayunman, ang “hindi dapat patayin” ay bahagyang nagdaragdag ng deontikong modal na “dapat”; mas tuwiran at mas malapit sa anyong legal na yiqtol ang “hindi papatayin.” Ang pagpapalit ng “kanilang” ng isahang panghalip ay nag-aalis din ng munting kalabuan sa sanggunian ng panghalip.'
  naturalness: Natural at marangal ang “Hindi papatayin ang mga ama dahil sa kanilang mga anak na lalaki,” ngunit mas matalas at balanseng legal na Filipino ang “Hindi papatayin ang ama dahil sa kanyang anak na lalaki, ni ang anak na lalaki dahil sa kanyang ama.” Ang pangwakas na “Ang bawat isa ay papatayin dahil sa sarili niyang kasalanan” ay malinaw at likas.
  terminology: Ang “mga ama,” “mga anak na lalaki,” at “kasalanan” ay angkop at tapat sa אָבוֹת, בָּנִים, at חֶטְא. Ang “papatayin” ay wastong pagsasalin ng Hophil ng מות sa kontekstong panghukuman, nang hindi pinipilit ang mas espesipikong paraan ng pagpatay.
