base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: tl
  text: Hindi papatayin ang ama dahil sa kanyang anak na lalaki, ni ang anak na lalaki dahil sa kanyang ama; ang bawat isa ay papatayin dahil sa sarili niyang kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anak”; literal na “mga anak na lalaki” ang Hebreo sa dalawang pagbanggit.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: dapat patayin
  rationale: 'Ang Hophil ng מות ay pasibo at sanhi: ipapatay o papatayin, hindi basta mamamatay. Sa kontekstong legal, malinaw na tumutukoy ito sa paglalapat ng parusang kamatayan nang hindi dinaragdagan ng mas teknikal na salitang “bitayin” o “patawan ng kamatayan.”'
- source_word: אָבוֹת
  choice: mga ama
  rationale: Tiyak na “mga ama” ang kahulugan ng pangngalan, hindi ang mas malawak na “mga magulang,” at pinananatili nito ang paralelismo sa “mga anak na lalaki.”
- source_word: בָּנִים
  choice: mga anak na lalaki
  rationale: Literal na panlalaking katawagang pampamilya ang Hebreo. Natural sa modernong Filipino ang “mga anak na lalaki,” samantalang maaaring ipahiwatig ng payak na “mga anak” ang mas malawak na saklaw; inilalahad iyon bilang alternatibo sa talababa.
- source_word: עַל
  choice: dahil sa
  rationale: Sa legal na kontekstong ito, ipinakikita ng עַל ang batayan ng kaparusahan o pananagutan. Malinaw at likas sa Filipino ang “dahil sa.”
- source_word: אִישׁ
  choice: ang bawat isa
  rationale: Ginagamit ang אִישׁ nang distributibo upang idiin ang indibidwal na pananagutan. Ang “ang bawat isa” ay natural at malinaw sa modernong Filipino habang hindi ipinapalagay na lalaki lamang ang saklaw ng prinsipyong legal.
- source_word: בְּחֶטְאוֹ
  choice: dahil sa sarili niyang kasalanan
  rationale: Sa kontekstong panghukuman, ang בְּ ay nagpapahayag ng batayan o dahilan. Pinananatili ng “sarili niyang” ang hulaping paari at ang tahasang pagsalungat sa pagpaparusa sa isang kamag-anak dahil sa kasalanan ng iba.
theological_decisions:
- issue: Indibidwal na pananagutan sa parusang kamatayan
  choice: Ang ipinagbabawal ay ang pagpatay sa ama o anak na lalaki bilang parusa sa kasalanan ng isa pa; ang bawat isa ay papatayin lamang dahil sa sarili niyang kasalanan.
  alternative: Isang pangkalahatang pahayag tungkol sa lahat ng bunga ng kasalanan sa magkakasunod na salinlahi.
  rationale: Ang paulit-ulit na Hophil ng מות ay tumutukoy sa pagpapapatay, kaya ang tuwirang saklaw ay hudisyal na parusang kamatayan. Ipinahahayag nito ang indibidwal na pananagutan, ngunit hindi dapat palawakin ng salin ang talata upang saklawin ang lahat ng posibleng bunga ng kasalanan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal. Pinanatili ang balanseng paralelismo ng dalawang unang sugnay at ang madiing pangwakas na prinsipyo ng personal na pananagutan.
