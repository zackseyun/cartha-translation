base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: tl
  text: at kinapootan siya ng sumunod na lalaki[a], sumulat ito para sa kanya ng kasulatan ng diborsiyo[b], ibinigay ito sa kanyang kamay, at pinaalis siya mula sa kanyang bahay; o kung mamatay ang sumunod na lalaking kumuha sa kanya bilang asawa[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagsimulang mapoot sa kanya.” Maaaring ilahad ang anyong Hebreo bilang payak na pangyayari sa legal na pagkakasunod-sunod, ngunit ipinahihiwatig nito na nagkaroon ng matinding pag-ayaw sa kanya ang sumunod na lalaki at saka siya hiniwalayan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “isang kasulatan o dokumento ng pagputol.” Isa itong pormal na kasulatang nagpapawalang-bisa sa pag-aasawa.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “kumuha sa kanya para sa sarili bilang asawa,” ibig sabihin, pinakasalan siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: mapoot sa kanya
  rationale: Pinananatili ng “mapoot” ang matinding diwa ng שׂנא nang hindi ito pinahihinang maging simpleng pagkainis. Ang anyong “mapoot” ay likas sa daloy ng isang ipinapalagay na kasong legal.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: ang huling lalaki
  rationale: Tuwirang sinasalamin nito ang אַחֲרוֹן, “huli/sumunod,” at pinananatili ang pagtukoy sa lalaki sa halip na ipalit agad ang salitang “asawa.”
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: sumulat ito para sa kanya ng kasulatan ng diborsiyo
  rationale: Ang “kasulatan ng diborsiyo” ay malinaw at makabagong katumbas ng pormal na dokumentong nagpapawalang-bisa sa pag-aasawa, habang pinananatili ng “sumulat” ang kilos sa Hebreo.
- source_word: וְנָתַן בְּיָדָהּ
  choice: ilagay iyon sa kanyang kamay
  rationale: Pinananatili nito ang kongkreto at pamamaraang legal na kilos ng paglalagay ng dokumento sa kamay ng babae.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: paalisin siya sa bahay nito
  rationale: Malinaw na ipinapahayag nito kapuwa ang pagpapaalis sa babae at ang tahasang pinanggalingang “mula sa kanyang bahay.”
- source_word: אוֹ כִי יָמוּת
  choice: o kung mamatay
  rationale: Ang “kung” ay angkop sa alternatibong kondisyon sa loob ng kasong legal.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: na kumuha sa kanya bilang asawa
  rationale: Pinananatili nito ang idyomang Hebreo ng pagkuha sa babae bilang asawa, habang malinaw pa rin sa makabagong Tagalog na ang tinutukoy ay pag-aasawa.
