translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa tekstong legal. Pinanatili ang magkakasunod na kilos at ang gitling sa dulo sapagkat nagpapatuloy ang pangungusap sa susunod na talata. Ginamit ang “ito/nito” para malinaw na ang huling lalaki ang tinutukoy nang hindi inuulit nang labis ang pangngalan.
