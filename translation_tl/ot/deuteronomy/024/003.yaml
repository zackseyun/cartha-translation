    rationale: Sa modernong Tagalog, maaari itong unawain bilang ang pinakahuling lalaki sa isang pangkat. Ang “sumunod na lalaki” ay mas malinaw na tumutukoy sa lalaki sa kasunod na pag-aasawa nang hindi ipinapasok ang pangngalang ‘asawa’ sa pangunahing teksto.
