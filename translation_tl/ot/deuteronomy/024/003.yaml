  source_fidelity: 'Naipapahayag ng draft ang mga pangunahing kilos at ang alternatibong kondisyon, ngunit hindi magkakatugma ang mga anyo ng pandiwa: ang “mapoot” ay sinusundan ng “sumulat,” “ilagay,” at “paalisin,” na lumilikha ng hindi malinaw na panahunan at ugnayan ng mga kilos. Ang “huling lalaki” ay maaari ring magpahiwatig ng ‘last man’ sa halip na ang lalaking sumunod sa unang asawa.'
  naturalness: Kailangan ng mas maayos at magkakatugmang kasunod-sunod na pandiwa sa Tagalog. Mas likas ang “sumunod na lalaki,” “ibinigay ito sa kanyang kamay,” at “pinaalis siya mula sa kanyang bahay.”
  terminology: Ang “kasulatan ng diborsiyo” ay malinaw at angkop. Pinananatili ang “kumuha sa kanya bilang asawa” bilang malapit na salin ng idyomang Hebreo, na may paliwanag sa talababa.
