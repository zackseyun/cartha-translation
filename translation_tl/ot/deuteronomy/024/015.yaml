source:
  edition: WLC
  text: בְּ/יוֹמ/וֹ֩ תִתֵּ֨ן שְׂכָר֜/וֹ וְֽ/לֹא תָב֧וֹא עָלָ֣י/ו הַ/שֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְ/אֵלָ֕י/ו ה֥וּא נֹשֵׂ֖א אֶת נַפְשׁ֑/וֹ וְ/לֹֽא יִקְרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: tl
  text: Ibigay mo sa kanya ang kanyang sahod sa araw ding iyon, bago lumubog ang araw, sapagkat siya ay dukha at dito nakasalalay ang kanyang buhay.[a] Kung hindi, baka dumaing siya kay Yahweh laban sa iyo, at magkasala ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “itinataas o dinadala niya rito ang kanyang buhay.” Ibig sabihin, kailangang-kailangan niya ang sahod upang mabuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: sa araw ding iyon
  rationale: Ang literal na diwang “sa kanyang araw” ay tumutukoy sa araw na pinagtrabahuhan o takdang araw ng bayaran; ang saling ito ay natural sa Tagalog at malinaw na nagpapanatili sa agarang pagbabayad.
- source_word: שְׂכָרוֹ
  choice: ang kanyang sahod
  rationale: Tumutukoy ito sa kabayarang pinaghirapan ng manggagawa; “sahod” ang karaniwan at malinaw na salitang Filipino.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: bago lumubog ang araw
  rationale: Ipinahahayag ng Hebreong idyoma na hindi dapat umabot sa paglubog ng araw nang hindi pa naibibigay ang sahod. Isinasalin ito nang natural habang pinananatili ang takdang hangganan ng oras.
- source_word: כִּי עָנִי הוּא
  choice: sapagkat siya ay dukha
  rationale: Sa konteksto ng paggawa, ang עָנִי ay nagsasaad ng taong salat at mahina ang kalagayang pangkabuhayan.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: dito nakasalalay ang kanyang buhay
  rationale: Ang literal na larawan ay ang pagbaling o pagdadala niya ng kanyang נֶפֶשׁ tungo sa sahod. Ipinahahayag ng idyoma ang matinding pag-asa at pangangailangan niya rito para mabuhay.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: Kung hindi, baka dumaing siya kay Yahweh laban sa iyo
  rationale: Ang “dumaing” ay angkop sa panawagan ng isang inaapi sa Diyos. Pinananatili ng “baka” ang babalang bunga na dapat iwasan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang Hebreo na יהוה sa halip na palitan ito ng isang titulo.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: at magkasala ka
  rationale: Natural nitong ipinahahayag sa Tagalog na ang hindi pagbabayad ay magiging kasalanan ng may pananagutan, nang hindi nagdaragdag ng teknikal na doktrina tungkol sa pagkakasala.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng וְהָיָה בְךָ חֵטְא
  choice: at magkasala ka
  alternative: at mapasa iyo ang kasalanan
  rationale: Ang piniling anyo ay likas at malinaw sa modernong Tagalog. Pinananatili nito ang moral na pananagutan ng pinagbabawalan nang hindi tinutukoy kung ang parirala ay isang teknikal na pahayag tungkol sa guilt.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Gumamit ng tuwirang utos at natural na ayos ng pangungusap; pinanatili ang personal na pangalang Yahweh at ipinaliwanag sa talababa ang Hebreong idyoma tungkol sa buhay na nakasalalay sa sahod.
