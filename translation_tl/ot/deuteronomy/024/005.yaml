  naturalness: Karaniwang malinaw at marangal ang rehistro. Ang “Malaya siya para sa kanyang sambahayan” ay medyo literal at hindi gaanong natural; ang inayos na bersyon ay mas idiomatiko habang pinananatili ang saklaw ng Hebreo.
  terminology: Ang “hukbo,” “tungkulin,” at “sambahayan” ay angkop. Pinalitan ang di-natural na “pinakasalang asawa” ng “asawang pinakasalan niya.”
  issues:
