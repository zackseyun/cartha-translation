translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may bahagyang legal na himig. Ginamit ang “sambahayan” upang saklawin ang pamilya at tahanan, at “pinakasalang asawa” upang maging natural sa Tagalog ang idyomang Hebreo.
