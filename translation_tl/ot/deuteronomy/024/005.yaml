  - severity: low
    issue: Medyo literal at alanganin ang “Malaya siya para sa kanyang sambahayan.”
    rationale: Nauunawaan ito, ngunit hindi ito ang karaniwang modernong Tagalog na paraan upang ipahayag ang legal na exemption na nakatuon sa sambahayan. Ang “malaya siya sa mga tungkulin upang mapagtuunan ang kanyang sambahayan” ay mas natural; ang layuning sambahayan ay ipinahahayag ng לְבֵיתוֹ.
