  to: Kapag bagong kasal ang isang lalaki, hindi siya sasama sa hukbo[a], at hindi siya aatasan ng anumang tungkulin[b]. Sa loob ng isang taon, malaya siya sa mga tungkulin upang mapagtuunan ang kanyang sambahayan[c], at pasasayahin niya ang asawang pinakasalan niya[d].
