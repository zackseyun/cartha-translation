base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: tl
  text: Kapag bagong kasal ang isang lalaki, hindi siya sasama sa hukbo[a], at hindi siya aatasan ng anumang tungkulin[b]. Sa loob ng isang taon, malaya siya sa mga tungkulin upang mapagtuunan ang kanyang sambahayan[c], at pasasayahin niya ang asawang pinakasalan niya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi siya lalabas upang makipagdigma.” Ang literal na Hebreo ay “hindi siya lalabas kasama ng hukbo,” na maaaring sumaklaw sa mas malawak na paglilingkod-militar, hindi lamang sa tuwirang pakikipaglaban.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi ipapataw sa kanya ang anumang obligasyon.” Mas malawak ang Hebreo kaysa sa tungkuling militar lamang.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “Malaya siya para sa kanyang sambahayan sa loob ng isang taon” o “Malaya siyang manatili sa kanyang tahanan sa loob ng isang taon.” Maaaring idiin ng pariralang Hebreo ang kanyang pagiging malaya para sa buhay-pamilya o ang pananatili niya sa kanyang sambahayan.
    reason: lexical_alternative
  - marker: d
    text: 'Mas literal: “at gagawin niyang magalak ang asawang kinuha niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: Kapag bagong kasal ang isang lalaki
  rationale: Ang כִּי ay nagbubukas ng sitwasyon sa batas, kaya natural ang “Kapag.” Ang לָקַח אִשָּׁה ay idyoma para sa pag-aasawa; ipinahahayag ng “bagong kasal” ang kamakailang pag-aasawa nang hindi ipinahihiwatig na may “lumang asawa.”
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: hindi siya sasama sa hukbo
  rationale: Pinananatili nito ang larawan ng literal na paglabas kasama ng hukbo at hindi nililimitahan ang kahulugan sa tuwirang pakikipaglaban lamang.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: at hindi siya aatasan ng anumang tungkulin
  rationale: Ipinahahayag nito sa natural na wikang legal ang malawak na diwa na walang anumang obligasyon o atas na ipapataw sa kanya.
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ שָׁנָה אֶחָת
  choice: Malaya siya para sa kanyang sambahayan sa loob ng isang taon
  rationale: Ang נָקִי ay nangangahulugang malaya o ligtas sa mga obligasyon, at ang לְבֵיתוֹ ay tumutukoy sa tahanan o sambahayan, hindi lamang sa gusali.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ
  choice: at pasasayahin niya ang kanyang ... asawa
  rationale: 'Ang anyong piel ng שׂמח ay may tahasang sanhiing diwa: gagawin niyang masaya o magagalak ang asawa.'
- source_word: אֲשֶׁר לָקָח
  choice: kanyang pinakasalang asawa
  rationale: Natural nitong isinasalin ang idyomang “asawang kinuha niya” bilang pag-aasawa, habang malinaw na tumutukoy sa babaeng kamakailan niyang pinakasalan.
