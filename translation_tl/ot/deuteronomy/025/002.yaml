translation:
  language: tl
  text: At kung ang taong nagkasala ay karapat-dapat na hampasin, ipahihiga siya ng hukom at ipahahampas sa harap niya, ayon sa bigat ng kanyang kasalanan, sa binilang na dami ng mga hampas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa bilang,” samakatuwid, sa isang binilang na dami ng mga hampas na naaayon sa bigat ng kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: karapat-dapat hagupitin
  rationale: Ang literal na idyomang “anak ng paghagupit” ay tumutukoy sa isang taong nararapat o mananagot sa parusang paghagupit. Likas at malinaw sa modernong Filipino ang “karapat-dapat hagupitin.”
- source_word: הָרָשָׁע
  choice: ang taong nagkasala
  rationale: Sa kontekstong panghukuman, ang substantibong pang-uri ay tumutukoy sa partidong napatunayang mali o nagkasala. Pinananatili ng “taong nagkasala” ang legal at moral na diwa nang hindi nagpapahiwatig ng higit sa pasiya sa kasong ito.
- source_word: וְהִפִּילוֹ
  choice: ipahihiga siya
  rationale: Ang Hiphil ng נפל ay nagpapahayag dito ng pagpapahiga sa taong parurusahan. Ang “ipahihiga siya” ay tuwiran at angkop sa pamamaraang inilalarawan.
- source_word: הַשֹּׁפֵט
  choice: ang hukom
  rationale: Karaniwang makabagong katumbas ng opisyal na humahatol.
- source_word: וְהִכָּהוּ
  choice: ipahahagupit
  rationale: Ang pandiwa ay nangangahulugang hampasin o hagupitin. Sa tagpong panghukuman, ipinahihiwatig ng “ipahahagupit” na pinangangasiwaan o ipinag-uutos ng hukom ang parusa, nang hindi kinakailangang siya mismo ang humagupit.
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Malapit ito sa literal na kahulugan at malinaw na ang parusa ay isinasagawa sa harap at sa pangangasiwa ng hukom.
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: umayon sa bigat ng kanyang kasalanan
  rationale: Ipinahihiwatig ng parirala ang pagiging proporsiyonal ng parusa sa kasalanan. Ginagawang tahas ng “bigat” ang relasyong ito sa likas na Filipino habang pinananatili ang legal-moral na diwa.
- source_word: בְּמִסְפָּר
  choice: ang bilang ng mga hampas
  rationale: Ang maikling Hebreo ay tumutukoy sa binilang o itinakdang dami ng mga hampas. Inilalahad ito nang malinaw sa Filipino, habang inilalagay sa talababa ang mas pormal na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “hagupitin” para sa legal na parusang pisikal at “mga hampas” para sa mga indibiduwal na bilang nito. Hinati sa dalawang pangungusap upang maging malinaw ang ugnayan ng bigat ng kasalanan at bilang ng mga hampas, nang hindi inaalis ang maigsi at bahagyang sintaktikong ambiguwidad ng Hebreo.
