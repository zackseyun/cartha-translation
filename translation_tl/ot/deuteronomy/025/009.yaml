- from: 'Pagkatapos, lalapit sa lalaki ang balo ng kapatid niya sa harap ng matatandang pinuno. Huhubarin ng babae ang sandalyas mula sa paa niya, duduraan siya sa mukha[a], at sasagot nang ganito: “Ito ang gagawin sa lalaking ayaw magpatuloy sa sambahayan ng kanyang kapatid.”[b]'
  to: 'Pagkatapos, lalapit sa lalaki ang balo ng kanyang kapatid sa harap ng matatanda. Aalisin ng babae ang sandalyas mula sa paa ng lalaki, duduraan niya ito sa mukha[a], at sasagot at magsasabi: “Ito ang gagawin sa lalaking hindi magtatatag ng sambahayan ng kanyang kapatid.”[b]'
  rationale: Inalis ang idinagdag na “pinuno,” nilinaw ang pinagmumulan ng sandalyas, at pinalitan ang malabong “magpatuloy sa sambahayan” ng “magtatag ng sambahayan” upang maipahayag ang idyomatikong diwa ng Hebreo nang hindi ito ginagawang literal na pagtatayo ng gusali. Pinanatili ang pangunahing pagbasa na pagdura sa mukha at ang alternatibo sa talababa.
