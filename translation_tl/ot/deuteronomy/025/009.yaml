base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: tl
  text: 'Pagkatapos, lalapit sa lalaki ang balo ng kanyang kapatid sa harap ng matatanda. Aalisin ng babae ang sandalyas mula sa paa ng lalaki, duduraan niya ito sa mukha[a], at sasagot at magsasabi: “Ito ang gagawin sa lalaking hindi magtatatag ng sambahayan ng kanyang kapatid.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dudura sa harap niya.” Maaaring ipakahulugan ang Hebreo na dumura ang babae sa harap ng lalaki sa halip na tuwiran sa mukha nito.
    reason: lexical_alternative
  - marker: b
    text: Ang “magtatag ng sambahayan ng kanyang kapatid” ay tumutukoy sa pagtatatag o pagpapatuloy ng angkan at sambahayan ng namatay sa pamamagitan ng pag-aasawa sa balo nito.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: ang balo ng kapatid niya
  rationale: 'Tiyak sa konteksto ng pag-aasawa sa balo ng kapatid: hindi lamang pangkalahatang hipag kundi ang balo ng namatay na kapatid.'
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: sa harap ng matatandang pinuno
  rationale: Ipinahahayag ang hayag at nasasaksihang katangian ng gawa; nililinaw ng “pinuno” ang opisyal na papel ng matatanda sa pamayanan.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: Huhubarin ng babae ang sandalyas mula sa paa niya
  rationale: Ang חָלַץ ay tumutukoy rito sa pag-aalis ng sapin sa paa; pinananatili ang isahang “sandalyas.”
- source_word: וְיָרְקָה בְּפָנָיו
  choice: duduraan siya sa mukha
  rationale: Ito ang tuwirang pagbasa sa Hebreo at pinananatili ang kahihiyang kaakibat ng ritwal, habang inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: sasagot nang ganito
  rationale: Likas na Filipino para sa pormulang Hebreo na literal na “sasagot at magsasabi,” nang hindi ipinapalagay na may naunang tuwirang tanong.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Ito ang gagawin
  rationale: Natural at marangal na pahayag na nagpapanatili sa pormal at pasibong diwa ng Hebreo.
- source_word: לָאִישׁ
  choice: sa lalaking
  rationale: Pinananatili ang tiyak na panlalaking reperensiya ng batas.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: ayaw magpatuloy sa sambahayan ng kanyang kapatid
  rationale: 'Ipinahahayag ang idyomatikong diwa ng “itayo ang bahay”: ipagpatuloy o panatilihin ang angkan at sambahayan ng namatay na kapatid. Ang “ayaw” ay nagpapakita ng kusang pagtanggi sa konteksto.'
theological_decisions:
- issue: Kung palalambutin ang kahulugan ng בְּפָנָיו
  choice: duduraan siya sa mukha
  alternative: dudura sa harap niya
  rationale: Sinusunod ng pangunahing teksto ang pinakatuwirang kahulugan, ngunit pinananatili sa talababa ang tunay na alternatibong pag-unawa.
- issue: Kung pananatilihin nang literal ang metaporang “itayo ang bahay”
  choice: magpatuloy sa sambahayan ng kanyang kapatid
  alternative: itayo ang sambahayan ng kanyang kapatid
  rationale: Sa kontekstong ito, ang “bahay” ay tumutukoy sa angkan at sambahayan, hindi sa gusali. Ang salin ay naglilinaw ng layunin nang walang pagdaragdag ng denominasyonal na aral.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “matatandang pinuno” upang malinaw ang opisyal na papel ng mga elder, at “sandalyas” para sa sinaunang sapin sa paa. Nasa pangunahing teksto ang lahat ng marker ng talababa.
