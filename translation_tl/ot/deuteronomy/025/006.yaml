  source_fidelity: Tumpak na naisasalin ang panganay, ang pagsilang ng balo, ang pagpapatuloy kaugnay ng pangalan ng namatay, at ang hindi pagkapawi ng pangalan mula sa Israel. Gayunman, ang “kapatid nitong namatay” ay hindi likas at maaaring magmukhang ang panganay mismo ang may kapatid na namatay; mas malinaw ang karaniwang anyong “kanyang kapatid na namatay,” habang pinananatili ang legal na pormula ng Hebreo.
  naturalness: Marangal at madaling basahin ang pangungusap. Ang maliit na pagbabago sa ayos ng pariralang pantukoy ay magpapalinaw sa daloy nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
  terminology: Ang “panganay,” “hahalili sa pangalan,” “mabura,” at “Israel” ay angkop. Ang “hahalili sa pangalan” ay isang maingat at natural na paglalahad ng יָקוּם עַל־שֵׁם; ang literal na larawan ay wastong naiiwan sa talababa.
