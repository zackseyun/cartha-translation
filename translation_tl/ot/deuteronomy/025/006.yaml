base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: tl
  text: At ang panganay na isisilang niya ay hahalili sa pangalan ng kanyang kapatid na namatay[a], upang hindi mabura ang pangalan nito mula sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “tatayo sa pangalan ng kanyang kapatid na namatay”—samakatuwid, ipagpapatuloy niya ang angkan at katayuan ng namatay sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: ang panganay
  rationale: Pinananatili ng “panganay” ang legal at pampamilyang diwa ng unang lalaking anak sa konteksto ng pag-aasawa sa balo ng kapatid.
- source_word: תֵּלֵד
  choice: na isisilang niya
  rationale: Malinaw na ang balo ang tinutukoy ng pambabaeng pandiwa, at likas ito sa makabagong Tagalog.
- source_word: יָקוּם עַל שֵׁם
  choice: ay hahalili sa pangalan
  rationale: Ipinahahayag nito ang legal at pampamilyang pagpapatuloy sa pangalan at angkan ng namatay, nang hindi nililimitahan ang diwa sa literal na pagbibigay ng kaparehong personal na pangalan.
- source_word: אָחִיו הַמֵּת
  choice: ng kapatid nitong namatay
  rationale: Tumpak at natural na salin; ginagamit ang “nito” upang maiwasan ang malabong pagtukoy na maaaring idulot ng “kanyang” sa Tagalog.
- source_word: יִמָּחֶה
  choice: hindi mabura
  rationale: Ang “mabura” ay likas na katumbas ng Niphal ng מחה kapag pangalan o alaala ang pinapawi.
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: Tuwirang ipinahahayag ang pag-aalis mula sa bayan o pamayanan ng Israel.
theological_decisions:
- issue: Kahulugan ng pormulang יָקוּם עַל שֵׁם sa batas ng pag-aasawa sa balo ng kapatid
  choice: Ang anak ay hahalili sa pangalan ng namatay at magpapatuloy sa linya at katayuan nito sa Israel.
  alternative: Ibibigay lamang sa anak ang mismong personal na pangalan ng namatay.
  rationale: 'Sa legal na kontekstong ito, mas malawak ang idyoma kaysa literal na pagpapangalan: saklaw nito ang pagpapatuloy ng pangalan, angkan, at katayuan ng namatay. Gayunman, pinananatili ng pangunahing teksto ang larawan ng “pangalan” at ipinaliliwanag ito sa talababa.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “hahalili sa pangalan” bilang likas ngunit malapit na paglalahad ng idyomang Hebreo; inilagay sa talababa ang mas literal na anyo.
