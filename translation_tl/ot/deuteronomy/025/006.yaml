  to: At ang panganay na isisilang niya ay hahalili sa pangalan ng kanyang kapatid na namatay[a], upang hindi mabura ang pangalan nito mula sa Israel.
  rationale: Pinalitan lamang ang di-likas na “kapatid nitong namatay” ng mas malinaw na “kanyang kapatid na namatay,” kapwa sa teksto at talababa. Pinananatili nito ang sinadyang legal-pampamilyang pormula ng Hebreo at ang maingat na paliwanag ng audit trail, nang hindi idinadagdag sa pangunahing teksto ang isang mas tiyak na interpretasyon.
