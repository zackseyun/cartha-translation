base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: tl
  text: Ngunit kung ayaw ng lalaki na pakasalan ang biyuda ng kanyang kapatid, pupunta ang biyuda sa pintuang-bayan, sa mga nakatatanda, at sasabihin, “Tumanggi ang bayaw ko na panatilihin ang pangalan ng kanyang kapatid sa Israel[a]; ayaw niyang gampanan ang tungkulin niya bilang bayaw ko[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “magbangon ng pangalan para sa kanyang kapatid sa Israel.” Tumutukoy ang idyoma sa pagpapatuloy ng pangalan, angkan, at katayuan ng namatay na kapatid.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, iisang teknikal na pandiwa ang ginamit para sa pagtupad ng tungkulin ng bayaw—ang pagpapakasal sa biyuda ng namatay na kapatid upang maipagpatuloy ang angkan nito.
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: ayaw
  rationale: Ipinahahayag ng pandiwa ang kawalan ng pagnanais o pagsang-ayon. Natural at tuwiran ang “ayaw” sa isang pormal na usaping legal.
- source_word: לָקַחַת
  choice: pakasalan
  rationale: Literal itong “kunin,” ngunit sa kontekstong ito ay tumutukoy sa pagkuha sa biyuda bilang asawa. Iniiwasan ng “pakasalan” ang kalabuan sa makabagong Tagalog.
- source_word: יְבִמְתּוֹ
  choice: biyuda ng kanyang kapatid
  rationale: Ang salita ay partikular na tumutukoy sa biyuda ng kapatid sa konteksto ng pag-aasawang levirato, hindi lamang sa isang hipag.
- source_word: וְעָלְתָה ... הַשַּׁעְרָה
  choice: pupunta ... sa pintuang-bayan
  rationale: Bagaman literal na “aakyat sa pintuan,” mas natural sa Tagalog ang “pupunta.” Ang “pintuang-bayan” ay nagpapahiwatig ng kinikilalang lugar ng pampublikong paglilitis.
- source_word: הַזְּקֵנִים
  choice: mga matatanda
  rationale: Tumutukoy ito sa kinikilalang mga pinuno at hukom ng pamayanan. Pinananatili ang karaniwang katawagang biblikal nang hindi nagdaragdag ng salitang wala sa teksto.
- source_word: מֵאֵין
  choice: tumanggi
  rationale: Ipinahahayag nito ang tahasang pagtanggi o di-pagsang-ayon sa obligasyong legal.
- source_word: לְהָקִים ... שֵׁם
  choice: panatilihin ang pangalan
  rationale: Ang idyoma ay tumutukoy sa pagpapatuloy ng pangalan, angkan, at katayuan ng namatay. Natural ito sa Tagalog habang ang mas literal na anyo ay inilalagay sa talababa.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Tuwiran at natural na salin ng pariralang lokatibo at panlipunang ito.
- source_word: לֹא אָבָה
  choice: ayaw niya
  rationale: Pinananatili nito ang diin sa kawalan ng kusang pagsang-ayon at ang hiwalay na ikalawang pahayag ng babae.
- source_word: יַבְּמִי
  choice: gampanan para sa akin ang tungkulin ng bayaw
  rationale: Teknikal na pandiwa ito para sa pagtupad ng obligasyong pakasalan ang biyuda ng kapatid. Nililinaw ng salin ang legal na tungkulin nang hindi gumagamit ng di-pamilyar na terminong akademiko.
theological_decisions:
- issue: Paglalarawan sa tungkulin ng bayaw sa pag-aasawang levirato
  choice: 'Gumamit ng malinaw na wikang pampamilya at legal: “biyuda ng kanyang kapatid” at “tungkulin ng bayaw.”'
  alternative: Gamitin sa pangunahing teksto ang teknikal na terminong “pag-aasawang levirato” o ang mas literal ngunit malabong “hipag.”
  rationale: Legal at pangkulturang institusyon ang tinutukoy ng talata. Nililinaw ng salin ang relasyon at obligasyon nang hindi nagdaragdag ng doktrinal o denominasyonal na paliwanag.
- issue: Idyomang “magbangon ng pangalan”
  choice: Isalin sa pangunahing teksto bilang “panatilihin ang pangalan,” na may literal na anyo at paliwanag sa talababa.
  alternative: Panatilihin sa pangunahing teksto ang “magbangon ng pangalan.”
  rationale: Ang “panatilihin ang pangalan” ay mas malinaw sa karaniwang mambabasang Tagalog at tapat sa layunin ng idyoma, habang pinananatili sa talababa ang kongkretong larawan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang “pintuang-bayan” upang ipakita ang pampublikong lugar ng paghatol, at iniwasan ang di-pamilyar na terminong “levirato” sa pangunahing teksto. Ang pananalita ng babae ay tuwiran at angkop sa isang pormal na reklamong legal.
