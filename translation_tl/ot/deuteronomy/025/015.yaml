  text: אֶ֣בֶן שְׁלֵמָ֤ה וָ/צֶ֨דֶק֙ יִֽהְיֶה לָּ֔/ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָ/צֶ֖דֶק יִֽהְיֶה לָּ֑/ךְ לְמַ֨עַן֙ יַאֲרִ֣יכוּ יָמֶ֔י/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: tl
  text: Dapat kang magkaroon ng ganap at makatarungang panimbang[a]; dapat kang magkaroon ng ganap at makatarungang epa[b], upang humaba ang mga araw mo sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bato”; ibig sabihin, batong ginagamit bilang panimbang sa kalakalan.
    reason: lexical_alternative
  - marker: b
    text: Ang epa ay isang sinaunang yunit ng panukat para sa tuyong bagay.
    reason: historical_measure
lexical_decisions:
- source_word: אֶבֶן
  choice: panimbang
  rationale: Ang literal na kahulugan ay “bato,” ngunit sa konteksto ng kalakalan, tumutukoy ito sa batong ginagamit bilang pamantayang panimbang. Ang “panimbang” ang likas at malinaw na pagpapahayag sa modernong Tagalog, habang pinananatili sa talababa ang konkretong larawan.
- source_word: שְׁלֵמָה
  choice: ganap
  rationale: Ipinapahayag ng salita ang pagiging buo, kumpleto, o walang kakulangan. Ang “ganap” ay angkop sa pamantayang timbang at sukat at naiiwasang ipakahulugan lamang bilang pisikal na hindi basag.
- source_word: וָצֶדֶק
  choice: at makatarungan
  rationale: Sa konteksto ng kalakalan, tumutukoy ito sa pamantayang naaayon sa katuwiran at hindi nandaraya. Pinananatili ng “makatarungan” ang moral na bigat ng salita, hindi lamang ang teknikal na kawastuhan.
- source_word: יִהְיֶה לָּךְ
  choice: magkaroon ka
  rationale: Literal itong “magiging para sa iyo,” ngunit sa kontekstong pambatas ay nag-uutos na taglayin at gamitin ang wastong pamantayan. Likas sa Tagalog ang “magkaroon ka” at malinaw ang puwersa ng utos.
- source_word: אֵיפָה
  choice: epa
  rationale: Ang epa ay isang tiyak na sinaunang yunit ng panukat para sa tuyong bagay. Isinalin ito sa anyong hiram sa halip na palitan ng di-tiyak na “takal,” at ipinaliwanag sa talababa.
- source_word: לְמַעַן
  choice: upang
  rationale: Ipinakikita nito ang layunin o ibubungang kaugnayan. Ang “upang” ay maikli, likas, at angkop sa marangal na rehistro.
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: humaba ang mga araw mo
  rationale: Pinananatili nito ang Hebreong larawan ng paghabang ng mga araw sa halip na ganap itong gawing “mabuhay ka nang matagal.” Nauunawaan pa rin ito sa Tagalog at angkop sa estilo ng Deuteronomio.
- source_word: עַל הָאֲדָמָה
  choice: sa lupain
  rationale: Sa Deuteronomio, ang parirala ay tumutukoy sa lupaing ipinagkakaloob sa Israel. Ang “sa lupain” ay mas likas sa Tagalog kaysa sa literal na “sa ibabaw ng lupa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang pangalang tipan na יהוה at hindi ito pinapalitan ng isang titulo.
- source_word: נֹתֵן לָךְ
  choice: ibinibigay sa iyo
  rationale: Ang participle ay naglalarawan sa pagkakaloob bilang kasalukuyang isinasagawa o tiyak na nalalapit. Pinananatili ng “ibinibigay” ang aspektong ito.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Ugnayan ng pagsunod at mahabang buhay sa lupain
  choice: “upang humaba ang mga araw mo”
  alternative: “at sa gayon ay mabubuhay ka nang matagal”
  rationale: Pinananatili ng salin ang layunin o resultang ipinahahayag ng לְמַעַן at ang wikang tipan ng talata, nang hindi nililinaw nang higit sa teksto kung mekanikal na pangako, pangkalahatang bunga, o dalawang aspekto ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang isahang “ka/iyo/mo” upang tumbasan ang ikalawang panauhang isahan sa Hebreo. Ang pag-uulit ng “ganap at makatarungan” ay pinanatili upang maipakita ang magkatulad na hinihingi para sa panimbang at panukat.
