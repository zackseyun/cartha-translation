  terminology: Ang “panimbang,” “epa,” “Yahweh,” at “lupain” ay angkop. Ang “ganap at makatarungan” ay pinananatili upang katawanin ang pagiging buo/walang kakulangan at pagiging makatarungan ng mga pamantayan sa kalakalan. Wasto at kapaki-pakinabang ang mga talababa.
