source:
  edition: WLC
  text: כִּֽי יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְ/נִגְּשׁ֥וּ אֶל הַ/מִּשְׁפָּ֖ט וּ/שְׁפָט֑וּ/ם וְ/הִצְדִּ֨יקוּ֙ אֶת הַ/צַּדִּ֔יק וְ/הִרְשִׁ֖יעוּ אֶת הָ/רָשָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: tl
  text: 'Kung magkaroon ng alitan sa pagitan ng mga lalaki[a], at lumapit sila sa hukuman[b], hahatulan sila ng mga hukom: pawawalang-sala nila ang nasa tama at hahatulan nilang may sala ang nasa mali.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kapag magkaroon ng alitan sa pagitan ng mga lalaki.”'
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “sa paghatol”; ibig sabihin, sa paglilitis o sa hukuman.
    reason: lexical_alternative
  - marker: c
    text: 'Ang “pawawalang-sala” at “hahatulan nilang may sala” ay mga terminong panghukuman. Sa literal: “ipahahayag nilang matuwid ang matuwid at ipahahayag nilang masama ang masama.” Dito, tumutukoy ang mga ito sa panig na nasa tama at sa panig na napatunayang may sala sa usapin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Kung magkaroon
  rationale: Nagsisimula ito ng isang kondisyon sa batas. Likas sa modernong Filipino ang “Kung magkaroon,” habang maaari rin ang temporal na “Kapag.”
- source_word: רִיב
  choice: alitan
  rationale: Sa kontekstong legal, tumutukoy ito sa isang pagtatalo o usaping dinadala upang hatulan. Malinaw at karaniwan ang “alitan” nang hindi labis na teknikal.
- source_word: בֵּין אֲנָשִׁים
  choice: sa pagitan ng mga lalaki
  rationale: Ang pangngalan ay panlalaking maramihan at dito ay tumutukoy sa mga lalaking naglilitis; pinananatili ng salin ang tahasang kasarian ng Hebreo.
- source_word: וְנִגְּשׁוּ אֶל הַמִּשְׁפָּט
  choice: at lumapit sila sa hukuman
  rationale: Ang literal na “lumapit sa paghatol” ay tumutukoy sa pagharap sa prosesong panghukuman; natural sa Filipino ang “lumapit sa hukuman.”
- source_word: וּשְׁפָטוּם
  choice: hahatulan sila ng mga hukom
  rationale: Aktibong maramihan ang pandiwa at may layong panghalip na “sila.” Ipinahihiwatig ng konteksto na mga hukom ang gumagawa ng paghatol, kaya tahasang binanggit sila para sa kalinawan.
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק
  choice: pawawalang-sala nila ang nasa katuwiran
  rationale: Sa hukuman, ang hiphil ng צדק ay deklarasyong pabor sa isang panig, hindi pagbabagong moral. Ang “nasa katuwiran” ay nagpapahiwatig ng panig na tama sa kasong ito.
- source_word: וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  choice: hahatulang nagkasala ang nasa kamalian
  rationale: Sa kontekstong legal, ang hiphil ng רשע ay pagdedeklarang may sala. Pinananatili ng “nasa kamalian” ang pagtutulad sa “nasa katuwiran,” habang nililinaw ng pandiwa ang hatol na legal.
theological_decisions:
- issue: Forensiko o moral na diwa ng צדק/רשע
  choice: 'Mga deklarasyong legal: “pawawalang-sala ... ang nasa katuwiran” at “hahatulang nagkasala ... ang nasa kamalian”'
  alternative: Paglalarawan lamang sa likas na moral na katangian bilang “matuwid” at “masama”
  rationale: Ang agarang konteksto ay paglilitis at paghatol. Kaya ang magkatambal na mga pandiwa ay tumutukoy sa pasya ng hukuman tungkol sa dalawang panig, hindi sa pagkakaloob o pagbabago ng kanilang katayuang moral.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang karaniwang bokabularyong legal na “hukuman,” “pawawalang-sala,” at “hahatulang nagkasala,” ngunit pinanatili sa talababa ang literal na pagtutulad ng mga salitang Hebreo.
