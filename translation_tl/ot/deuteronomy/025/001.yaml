  to: 'Kung magkaroon ng alitan sa pagitan ng mga lalaki[a], at lumapit sila sa hukuman[b], hahatulan sila ng mga hukom: pawawalang-sala nila ang nasa tama at hahatulan nilang may sala ang nasa mali.[c]'
  rationale: Pinalitan ang hindi likas na “nasa katuwiran/nasa kamalian” ng mas karaniwan at malinaw na “nasa tama/nasa mali,” habang tahasang pinanatili sa pandiwa ang legal na deklarasyon ng pagpapawalang-sala at pagkakasala. Pinanatili ang mga talababa at ang literal na paglilinaw upang maipakita ang lexical na pagpapares ng Hebreo nang hindi inililihis ang kahulugan sa moral o doktrinal na kategorya.
