  source_fidelity: 'Kailangang itama ang unang sugnay: ang וְנִקְרָא שְׁמוֹ ay “tatawagin ang kanyang pangalan,” hindi “tatawagin ang kanyang sambahayan.” Ang sambahayan/angkan ay nasa kasunod na bansag na בֵּית. Ang “sa Israel” at ang pag-unawa sa בֵּית bilang sambahayan o angkan ay angkop.'
