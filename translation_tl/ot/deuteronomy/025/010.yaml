translation_notes:
  register: Makabago at dignified na Filipino, na may legal at pampublikong himig. Ginamit ang ‘sambahayan’ sa halip na literal na ‘bahay’ upang malinaw na tumukoy sa pamilya o angkan; ang tersong anyo ng bansag ay sadyang pinanatili.
