  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
translation:
  language: tl
  text: At tatawagin ang kanyang pangalan sa Israel[a] na ‘Sambahayan ng Taong Inalisan ng Sandalyas.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At tatawagin ang kanyang pangalan sa Israel na ‘Sambahayan ng inalisan ng sandalyas.’” Isinisiksik ng Hebreo sa isang maikling katawagan ang kahihiyang kaugnay ng ritwal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרָא שְׁמוֹ
  choice: at tatawagin ang kanyang sambahayan
  rationale: Sa konteksto, ang literal na ‘tatawagin ang kanyang pangalan’ ay pormula ng pampublikong pagpapangalan. Inilapit sa likas na Filipino ang tinutukoy na sambahayan, na tahasang lumilitaw sa kasunod na titulong בֵּית.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Ipinahahayag ng ב ang saklaw ng lipunan kung saan gagamitin ang katawagang ito; natural at tumpak ang ‘sa Israel.’
- source_word: בֵּית
  choice: Sambahayan ng
  rationale: Ang בֵּית dito ay tumutukoy sa pamilya o angkan, hindi lamang sa gusali. Ang ‘sambahayan’ ay malinaw at marangal na katumbas sa modernong Filipino.
- source_word: חֲלוּץ הַנָּעַל
  choice: Hinubaran ng Sandalyas
  rationale: Tersong pariralang Hebreo ito na literal na nag-uugnay sa ‘inalisan’ at ‘ang sandalyas.’ Pinananatili ng salin ang maikling titulong-kahihiyan at ang ritwal na diwa nang hindi nagdaragdag ng ‘kanyang,’ na wala sa parirala.
