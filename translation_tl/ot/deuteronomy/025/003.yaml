  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: apatnapu ang pinakamataas na bilang at ipinagbabawal ang paglampas dito. Gayunman, ang pangwakas na “hamakin ang iyong kapatid” ay aktibong pandiwa at maaaring magpahiwatig na ang tagapagpalo ang tuwirang paksa ng paghamak. Ang וְנִקְלָה ay Niphal at inilalarawan ang kapatid bilang napapahiya o nagiging hamak sa paningin ng kausap. Kailangang ipakita ang resultang ito nang hindi binabago ang pokus.'
  naturalness: Moderno at malinaw sa pangkalahatan. Mas natural at mas malinaw ang “sa kaniya” kaysa “rito” para sa taong pinarurusahan, at ang pasibong/resultatibong “mapahiya” ay nag-aalis ng hindi sinasadyang kalabuan ng paksa sa huling sugnay.
  terminology: Ang “paluin,” “apatnapung ulit,” at “iyong kapatid” ay angkop. Pinananatili ng “kapatid” ang literal na katawagang pangkamag-anak at ang kontekstong pangkomunidad nang hindi ipinapalit ang isang mas makitid na interpretasyon.
  issues:
  - severity: medium
    issue: Aktibo ang “hamakin ang iyong kapatid” samantalang pasibo/resultatibo ang וְנִקְלָה.
