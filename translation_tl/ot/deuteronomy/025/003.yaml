base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: tl
  text: Maaari siyang paluin nang apatnapung ulit[a], ngunit hindi na hihigit pa, baka magpatuloy pa siya sa pagpalo sa kaniya nang higit sa mga ito, hanggang sa maging labis ang mga palo at mapahiya ang iyong kapatid sa harap mo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “apatnapung palo” o “apatnapung hampas.” Tiyak sa Hebreo ang bilang na apatnapu, ngunit hindi tinutukoy rito ang instrumento o ang eksaktong anyo ng bawat palo.
    reason: lexical_alternative
  - marker: b
    text: Ang “iyong kapatid” dito ay tumutukoy sa kapuwa miyembro ng sambayanang tipan. Nililimitahan ng kautusan ang parusa upang hindi siya tratuhing hamak o walang dangal.
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: Maaari siyang paluin nang apatnapung ulit
  rationale: Itinatakda ng bilang na apatnapu ang sukdulang dami ng mga palo. Hindi tinutukoy sa Hebreo ang instrumento, kaya hindi ginamit ang salitang mas tiyak gaya ng “hagupit.” Ang “maaari” ay angkop sa legal na pahintulot na nililimitahan ng kasunod na pagbabawal.
- source_word: לֹא יֹסִיף
  choice: ngunit hindi na hihigit pa
  rationale: Ang יסף ay literal na pagdaragdag; sa kontekstong legal, malinaw at natural na ipinagbabawal ng pariralang ito ang paglampas sa apatnapu.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ
  choice: baka ipagpatuloy pa niya ang pagpalo rito
  rationale: Pinananatili ng “baka” ang babalang puwersa ng פן, at ipinahahayag ng “ipagpatuloy pa” ang konstruksyong יסף na may pawatas, na tumutukoy sa pagdaragdag o pagpapatuloy ng kilos.
- source_word: עַל אֵלֶּה מַכָּה רַבָּה
  choice: nang labis sa bilang na iyon
  rationale: Ang parirala ay nagbababala laban sa labis na pagpalo na lampas sa itinakdang bilang. Ginagawang malinaw ng salin ang kolektibong diwa ng singular na מַכָּה רַבָּה nang hindi nagpapalagay ng tiyak na instrumento.
- source_word: וְנִקְלָה
  choice: hamakin
  rationale: Ang Niphal ng קלה ay nagpapahiwatig ng pagiging mababa, kahiya-hiya, o kasuklam-suklam sa paningin ng iba. Sa Filipino, natural na naihahayag ng “hamakin” ang pagtrato sa tao bilang walang dangal.
- source_word: אָחִיךָ
  choice: ang iyong kapatid
  rationale: Pinananatili ang literal at etikal na puwersa ng salitang pangkamag-anak; sa konteksto, tumutukoy ito sa kapuwa miyembro ng sambayanang tipan.
- source_word: לְעֵינֶיךָ
  choice: sa harap mo
  rationale: Natural na Filipino ito para sa idyomang literal na “sa iyong mga mata,” at pinananatili ang diwa ng hayagang paghamak sa paningin ng kausap.
theological_decisions:
- issue: Ang katawagang pangkamag-anak sa kontekstong legal ng tipan
  choice: ang iyong kapatid
  alternative: ang kapuwa mo Israelita
  rationale: Ang pagpapanatili sa “kapatid” ay nagpapakita na kahit pinarurusahan ang nagkasala, nananatili siyang kabilang sa sambayanan at hindi dapat tratuhing kasuklam-suklam o walang dangal.
translation_notes:
  register: Modernong Filipino na dignipikado at madaling maunawaan. Ginamit ang “paluin” bilang pangkalahatang katawagan sa paglalapat ng mga hampas, ang “apatnapung ulit” upang huwag magdagdag ng instrumentong hindi tahasang binanggit, at ang “kapatid” upang mapanatili ang tipanang ugnayan at moral na puwersa ng Hebreo.
