  source_fidelity: Ang pangunahing kahulugan ay naipapasa, kabilang ang espesipikong “anak na lalaki” at ang obligasyon ng kapatid ng namatay. Gayunman, ang “hindi dapat mapangasawa” ay hindi gaanong tuwiran para sa pagbabawal sa babae na mag-asawa ng lalaking nasa labas, at ang tahasang “makipagtalik” ay nag-aalis sa mahinahong idyomatikong pahayag ng Hebreo.
  naturalness: Mas natural at marangal sa modernong Filipino ang “hindi dapat mag-asawa ... sa” at “sumiping sa kanya.” Nililinaw rin ng “kapatid na lalaki ng namatay” ang reperensiya nang hindi umaasa sa posibleng malabong panghalip na “kanyang asawa.”
  terminology: Napananatili ang “magkakapatid na lalaki,” “anak na lalaki,” at “lalaking taga-labas.” Ang “sumiping” ay isang likas at dignipikadong katumbas ng Hebreong idyoma; ipinaliliwanag ng talababa ang seksuwal na kahulugan. Ang huling sugnay ay isinasalin bilang tungkuling nakaatang sa kapatid ng namatay, nang hindi kinakailangang gumamit ng teknikal na termino sa pangunahing teksto.
