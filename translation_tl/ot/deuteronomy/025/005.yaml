revisions:
- from: Kung magkakasamang naninirahan ang magkakapatid na lalaki at namatay ang isa sa kanila nang walang anak na lalaki, ang asawa ng namatay ay hindi dapat mapangasawa ng isang lalaking taga-labas.[a] Ang kapatid na lalaki ng kanyang asawa ay makipagtalik sa kanya,[b] kunin siya bilang asawa, at gampanan sa kanya ang tungkulin ng kapatid ng kanyang asawa.[c]
  to: Kapag magkasamang naninirahan ang magkakapatid na lalaki, at namatay ang isa sa kanila na walang anak na lalaki, hindi dapat mag-asawa ang asawa ng namatay sa isang lalaking taga-labas.[a] Dapat sumiping sa kanya ang kapatid na lalaki ng namatay,[b] kunin siya bilang asawa, at tuparin ang tungkulin ng kapatid ng namatay para sa kanya.[c]
  rationale: Inayos ang pagbabawal sa unang pangungusap upang maging tuwiran at likas sa Tagalog. Pinalitan ang tahasang pandiwang seksuwal ng “sumiping,” na mas tumutugma sa eupemistikong anyo at legal na rehistro ng Hebreo, habang malinaw ang kahulugan sa talababa. Ginawang malinaw ang tinutukoy na kapatid na lalaki at pinakinis ang huling pahayag ng natatanging tungkulin.
  reviewer_model: gpt-5.6-terra
