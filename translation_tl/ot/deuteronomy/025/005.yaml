base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: tl
  text: Kapag magkasamang naninirahan ang magkakapatid na lalaki, at namatay ang isa sa kanila na walang anak na lalaki, hindi dapat mag-asawa ang asawa ng namatay sa isang lalaking taga-labas.[a] Dapat sumiping sa kanya ang kapatid na lalaki ng namatay,[b] kunin siya bilang asawa, at tuparin ang tungkulin ng kapatid ng namatay para sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi dapat mapunta sa labas sa isang lalaking taga-labas.” Ang tinutukoy ay lalaking nasa labas ng obligasyong pampamilya, hindi kinakailangang dayuhan sa lahi.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pumasok sa kanya,” isang idyomang Hebreo para sa pakikipagtalik sa loob ng pag-aasawa.
    reason: lexical_alternative
  - marker: c
    text: 'Ito ang tungkuling kalaunang tinatawag na pag-aasawang levirato: pananagutan ng kapatid na lalaki ng namatay sa balo nito.'
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: magkakasamang naninirahan ang magkakapatid na lalaki
  rationale: Tiyak na mga kapatid na lalaki ang אַחִים sa batas na ito, at ipinahihiwatig ng יַחְדָּו ang magkasama o malapit na paninirahan nang hindi nililimitahan sa iisang bahay.
- source_word: וּבֵן אֵין לוֹ
  choice: nang walang anak na lalaki
  rationale: Pinananatili ang tiyak na salitang Hebreo na בֵּן, 'anak na lalaki,' sa halip na palawakin ito bilang 'anak.'
- source_word: אֵשֶׁת הַמֵּת
  choice: ang asawa ng namatay
  rationale: Malapit ito sa anyong Hebreo at likas pa rin sa modernong Tagalog; hindi ipinapalit ang mas interpretibong 'balo.'
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: mapangasawa ng isang lalaking taga-labas
  rationale: Ang זָר ay lalaking nasa labas ng kaugnayang pampamilya na saklaw ng tungkulin, hindi kinakailangang isang dayuhan sa lahi. Ang 'taga-labas' ay nagpapanatili sa legal at panlipunang pagsalungat.
- source_word: יְבָמָהּ
  choice: kapatid na lalaki ng kanyang asawa
  rationale: Tiyak na tumutukoy ito sa kapatid na lalaki ng namatay na asawa. Iniiwasan ng buong parirala ang kalabuan ng 'bayaw' sa Tagalog.
- source_word: יָבֹא עָלֶיהָ
  choice: makipagtalik sa kanya
  rationale: Idyomang Hebreo ito para sa pakikipagtalik. Ang tuwirang modernong salin ay malinaw at hindi nakalilitong gaya ng literal na 'pumasok sa kanya.'
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: kunin siya bilang asawa
  rationale: Pinananatili nito ang pormulang 'kunin bilang asawa' habang natural na nababasa sa Tagalog.
- source_word: וְיִבְּמָהּ
  choice: gampanan sa kanya ang tungkulin ng kapatid ng kanyang asawa
  rationale: Isinasalin ang natatanging pandiwa para sa obligasyong levirato sa payak na wikang hindi nangangailangan ng teknikal na termino.
theological_decisions:
- issue: Saklaw ng kundisyong וּבֵן אֵין לוֹ
  choice: Panatilihin sa pangunahing teksto ang 'walang anak na lalaki.'
  alternative: Isalin bilang 'walang anak.'
  rationale: Tiyak na 'anak na lalaki' ang nasa tekstong Hebreo. Hindi pinalalawak ng salin ang saklaw ng batas at hindi rin nito nilulutas ang posibleng mas malawak na legal na aplikasyon.
- issue: Kahulugan ng 'lalaking taga-labas'
  choice: Ipakita ang taong nasa labas ng obligasyong pampamilya nang hindi nagsisingit ng salitang 'pamilya' sa pangunahing teksto.
  alternative: Isalin bilang 'lalaking hindi kamag-anak' o 'sa labas ng pamilya.'
  rationale: Pinananatili ng 'taga-labas' ang bahagyang pagiging bukas ng זָר at הַחוּצָה, samantalang nililinaw ng talababa ang konteksto.
- issue: Paglalahad ng institusyong levirato
  choice: Gumamit ng malinaw na relasyonal at tungkuling pananalita sa pangunahing teksto.
  alternative: Gamitin ang teknikal na 'pag-aasawang levirato.'
  rationale: Mas nauunawaan ng karaniwang mambabasa ang relasyonal na pananalita, at hindi ito nag-aangkat ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at malinaw. Ginamit ang 'magkakapatid na lalaki' at ang buong pariralang 'kapatid na lalaki ng kanyang asawa' upang alisin ang kalabuan. Tuwiran ngunit hindi magaspang ang 'makipagtalik,' sapagkat kung literal na isasalin ang idyomang Hebreo ay magiging malabo sa kasalukuyang Tagalog.
