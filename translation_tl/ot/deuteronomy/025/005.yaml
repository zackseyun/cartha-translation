    rationale: Ang pasibong anyo ay medyo mabigat at hindi malinaw na ang asawa ng namatay ang hindi dapat mag-asawa ng lalaking nasa labas. Mas tuwiran ang “hindi dapat mag-asawa ... sa isang lalaking taga-labas.”
