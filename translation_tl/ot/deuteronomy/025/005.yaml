    rationale: Bagaman tama ang kahulugan, ang מקור ay gumagamit ng karaniwang eupemismo. Ang “sumiping sa kanya” ay natural, dignipikado, at pinananatili ang antas ng pagpapahayag ng pinagmulan; maaaring linawin ng talababa ang kahulugan.
