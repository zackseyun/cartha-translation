base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: tl
  text: Kapag binigyan ka ni Yahweh na iyong Diyos ng kapahingahan mula sa lahat ng iyong kaaway sa paligid, sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos bilang mana upang ariin mo ito, papawiin mo ang alaala[a] ni Amalek mula sa silong ng langit. Huwag mong kalimutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gunita” o “memorya.”
    reason: Leksikal na alternatibo para sa זֵכֶר; pinananatili nito ang pangngalang diwa ng “alaala” nang hindi pinalalawak ang kahulugan.
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: Kapag pinagpahinga ka
  rationale: Ipinahahayag ng parirala ang isang kalagayang magaganap sa hinaharap. Pinananatili ng “pinagpahinga ka” ang causative na diwa ng הֵנִיחַ sa natural na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang isinasalin sa titik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: mula sa lahat ng kaaway mo sa palibot
  rationale: Pinananatili nito kapwa ang kabuuang saklaw ng “lahat” at ang lokatibong diwa ng “sa palibot.”
- source_word: נֹתֵן לְךָ נַחֲלָה לְרִשְׁתָּהּ
  choice: ibinibigay sa iyo ... bilang mana na aangkinin mo
  rationale: Ang “ibinibigay” ay nagpapakita ng nagpapatuloy o nalalapit na pagbibigay; ang “mana” ay nagpapanatili sa mahalagang diwa ng נַחֲלָה, at ang “aangkinin” ay malinaw na naghahayag ng pagkuha at paghawak sa lupain.
- source_word: תִּמְחֶה
  choice: papawiin mo
  rationale: Ang מחה ay nangangahulugang burahin o lubusang pawiin. Ang “papawiin” ay natural, marangal, at nagpapanatili sa matinding puwersa ng utos.
- source_word: זֵכֶר עֲמָלֵק
  choice: ang alaala ni Amalek
  rationale: Karaniwang tumutukoy ang זֵכֶר sa alaala o pag-alaala. Hindi pinalalawak ng salin ang salita tungo sa “lahi” o “nalabi,” na hindi tahasang sinabi rito.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: mula sa silong ng langit
  rationale: Pinananatili ng pariralang ito ang larawang Hebreo at ang malawak na saklaw nito sa halip na gawing payak na “mula sa lupa.”
- source_word: לֹא תִּשְׁכָּח
  choice: Huwag mong kalilimutan
  rationale: Tuwirang ipinahahayag nito ang mariing pagbabawal sa natural na modernong Tagalog.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan sa halip na palitan ng titulong “Panginoon.”
- issue: Saklaw ng utos na may זֵכֶר
  choice: alaala ni Amalek
  alternative: pangalan o nalabi ni Amalek
  rationale: Pinananatili ang leksikal na diwa ng “alaala/pag-alaala” at hindi tahimik na nilulutas ang posibleng mas malawak na implikasyon ng pagkapawi kay Amalek.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal at mariing himig. Ginamit ang isahang “mo/ka” ayon sa Hebreo. Inilagay ang panandang [a] sa mismong pariralang tinutukoy nito.
