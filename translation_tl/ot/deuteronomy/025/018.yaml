  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: tl
  text: kung paano ka niya sinalubong sa daan at sinalakay ang lahat ng nahuhuli sa likuran mo, nang ikaw ay pagod at lupaypay; at hindi siya natakot sa Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: sinalubong ka niya
  rationale: Sa konteksto, tumutukoy ito sa pagharap o pagsalubong ng Amalek sa Israel sa daan; natural sa Filipino at hindi labis na nililinaw ang paraan ng pag-atake.
- source_word: וַיְזַנֵּב
  choice: sinalakay mula sa likuran
  rationale: Ang pandiwa ay kaugnay ng 'buntot' at inilalarawan ang paglusob sa hulihan ng pangkat; pinananatili ng salin ang puwesto at marahas na kilos nang hindi tiyak na sinasabing pinatay ang lahat.
- source_word: כָּל הַנֶּחֱשָׁלִים אַחֲרֶיךָ
  choice: ang lahat ng nahuhuli sa iyo
  rationale: Tumutukoy sa mga nanghihina o naiwan sa hulihan ng naglalakbay na bayan. Ang 'nahuhuli' ay malinaw at likas sa modernong Filipino.
- source_word: עָיֵף וְיָגֵעַ
  choice: pagod at lupaypay
  rationale: 'Inihahayag ang dalawang magkaugnay ngunit tumitinding kalagayan: pagkapagod at matinding panghihina.'
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: at hindi siya natakot sa Diyos
  rationale: Tuwirang pinananatili ang teolohikal at moral na hatol ng Hebreo.
theological_decisions:
- issue: Paksa ng pariralang 'hindi natakot sa Diyos'
  choice: Ginamit ang isahang 'siya' na tumutukoy sa Amalek bilang kolektibong kaaway.
  alternative: Maaaring unawain ang 'ikaw' bilang Israel at isalin na 'at hindi ka natakot sa Diyos.'
  rationale: Ang pinakamalapit at tradisyonal na sintaktikong pagbasa ay ipinagpapatuloy ng mga pandiwang isahan ang paksa na Amalek mula sa naunang sugnay; hindi kailangan ng talababa sa maikling talatang ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang 'lupaypay' upang idiin ang matinding panghihina, at ang 'mula sa likuran' upang maipakita ang larawan ng Hebreong pandiwa nang hindi maging teknikal.
