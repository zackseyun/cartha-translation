  naturalness: Natural ang “pagod at lupaypay” at ang pangungusap sa kabuuan. Mas malinaw at mas likas ang “ang lahat ng nahuhuli sa likuran mo” kaysa “ang lahat ng nahuhuli sa iyo,” na maaaring hindi agad maunawaan bilang mga nasa hulihan ng pangkat.
  terminology: Ang “Diyos” ay wastong katumbas ng אֱלֹהִים. Ang isahang “siya” ay katanggap-tanggap dahil ang Amalek ay tinutukoy bilang isang kolektibong kaaway sa isahang anyo.
