    issue: Hindi gaanong malinaw ang “nahuhuli sa iyo.”
    rationale: Mas natural sa modernong Filipino ang “nahuhuli sa likuran mo,” na malinaw na tumutukoy sa mga naiwan sa hulihan ng naglalakbay na bayan.
