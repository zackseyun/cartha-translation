  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: tl
  text: 'Alalahanin ninyo ang ginawa sa inyo ng Amalek sa daan, nang lumabas kayo mula sa Ehipto:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכוֹר
  choice: Alalahanin ninyo
  rationale: Ang Qal imperative ay isahan sa anyo ngunit tumutukoy sa Israel bilang sambayanan. Ang “Alalahanin ninyo” ay likas at marangal sa modernong Tagalog at nagpapanatili ng tuwirang utos.
- source_word: אֵת אֲשֶׁר
  choice: ang ginawa
  rationale: Ipinakikilala ng object marker at relative particle ang nilalaman ng dapat alalahanin. Likas sa Tagalog ang pagbuo nito bilang “ang ginawa.”
- source_word: עָשָׂה לְךָ
  choice: ginawa sa inyo
  rationale: Ang עשה na may לְ ay nagsasaad dito ng kilos na itinutuon laban sa Israel. Malinaw at idiomatiko ang “ginawa sa inyo” nang hindi nagdaragdag ng salitang wala sa teksto.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Pinananatili ang transliterasyon ng pangalang pantangi.
- source_word: בַּדֶּרֶךְ
  choice: nang nasa daan kayo
  rationale: Ang parirala ay tumutukoy sa kalagayan ng Israel habang naglalakbay. Ang “nasa daan” ay natural sa Tagalog at hindi nililimitahan ang kahulugan sa isang literal na kalsada lamang.
- source_word: בְּצֵאתְכֶם
  choice: pagkalabas ninyo
  rationale: Ang infinitive construct na may בְּ ay nagbibigay ng panahong kaugnayan. Ang “pagkalabas ninyo” ay maikli, natural, at malinaw na tumutukoy sa pag-alis.
- source_word: מִמִּצְרָיִם
  choice: sa Ehipto
  rationale: Kasunod ng “pagkalabas,” natural sa Tagalog ang “sa Ehipto”; naipahihiwatig na ng salitang “pagkalabas” ang pinagmulan kaya hindi kailangan ang mas mabigat na “mula sa Ehipto.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pampublikong pagbasa. Ginamit ang maramihang “ninyo/kayo” dahil sambayanan ng Israel ang kinakausap, bagaman kolektibong isahan ang anyong Hebreo. Pinanatili ang tutuldok sa dulo sapagkat nagpapatuloy ang utos at paliwanag sa kasunod na talata.
