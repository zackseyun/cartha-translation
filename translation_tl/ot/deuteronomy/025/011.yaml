  terminology: Ang “maselang bahagi” ay angkop na eupemismo para sa מְבֻשָׁיו, ngunit kailangang tukuyin sa mismong salin na ito ay sa lalaking humahampas/kalaban. Ang talababa tungkol sa literal na “kapatid niya” at sa eupemismo ay kapaki-pakinabang at nananatiling angkop.
