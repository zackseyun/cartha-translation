  text: כִּֽי יִנָּצ֨וּ אֲנָשִׁ֤ים יַחְדָּו֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/קָֽרְבָה֙ אֵ֣שֶׁת הָֽ/אֶחָ֔ד לְ/הַצִּ֥יל אֶת אִישָׁ֖/הּ מִ/יַּ֣ד מַכֵּ֑ה/וּ וְ/שָׁלְחָ֣ה יָדָ֔/הּ וְ/הֶחֱזִ֖יקָה בִּ/מְבֻשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: tl
  text: Kapag[a] nag-aaway ang dalawang lalaki—isang lalaki at ang kapwa niya[b]—at lumapit ang asawa ng isa sa kanila upang iligtas ang kanyang asawa mula sa kamay ng humahampas sa kanya[c], at iniunat niya ang kanyang kamay at hinawakan ang maselang bahagi ng katawan ng lalaking humahampas[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung.”
    reason: Pinahihintulutan ng כִּי ang kondisyunal na “kung” o ang pangyayaring “kapag” sa paglalahad ng kasong legal.
  - marker: b
    text: Sa Hebreo, “kapatid niya.” Dito, ang “kapatid” ay maaari ring mangahulugang kapwa lalaki o kababayan, hindi lamang kapatid sa laman.
    reason: Pinananatili sa talababa ang literal na pananalita at ang mas malawak nitong gamit sa lipunan ng Israel.
  - marker: c
    text: O “mula sa kamay ng umaatake sa kanya.”
    reason: Mas idiomatiko ang alternatibo, samantalang mas kongkreto at mas malapit sa anyo ng Hebreo ang pangunahing salin.
  - marker: d
    text: Sa Hebreo, “kanyang maseselang bahagi.” Tumutukoy ito sa ari ng lalaking humahampas.
    reason: Eupemistikong pahayag ang Hebreo para sa ari ng lalaki; nililinaw ng talababa ang reperente ng panghalip.
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagsisimula ito ng isang sitwasyon sa batas. Likas sa makabagong Filipino ang “kung,” bagaman maaari rin itong unawain bilang “kapag.”
- source_word: יִנָּצוּ אֲנָשִׁים יַחְדָּו
  choice: mag-away ang mga lalaki
  rationale: Ang pandiwa ay tumutukoy sa aktuwal na paglalaban o pisikal na pag-aaway; sapat nang ipinahihiwatig ng “mag-away” na laban ito sa isa't isa.
- source_word: אִישׁ וְאָחִיו
  choice: ang isang lalaki at ang kapwa niya
  rationale: Ang אָחִיו ay literal na “kapatid niya,” ngunit sa ganitong kontekstong panlipunan at legal maaari itong tumukoy sa kapwa lalaki o kababayan, hindi lamang sa kapatid sa laman.
- source_word: וְקָרְבָה אֵשֶׁת הָאֶחָד
  choice: lumapit ang asawa ng isa sa kanila
  rationale: Nililinaw ng “isa sa kanila” na asawa siya ng isa sa dalawang nag-aaway nang hindi dinaragdagan ang diwa ng Hebreo.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: upang iligtas ang kanyang asawa
  rationale: Ang לְהַצִּיל ay pagligtas mula sa agarang panganib, at ang אִישָׁהּ ay nangangahulugang “kanyang asawa” sa kontekstong ito.
- source_word: מִיַּד מַכֵּהוּ
  choice: mula sa kamay ng humahampas sa kanya
  rationale: Pinananatili nito ang kongkretong larawang “mula sa kamay” at ang nagpapatuloy na kilos ng pananakit.
- source_word: וְשָׁלְחָה יָדָהּ
  choice: iniunat niya ang kanyang kamay
  rationale: Natural na katumbas ito ng idyomang Hebreo para sa pag-abot o pag-uunat ng kamay.
- source_word: וְהֶחֱזִיקָה בִּמְבֻשָׁיו
  choice: hinawakan ang maselang bahagi ng lalaki
  rationale: Ipinahahayag ng “hinawakan” ang mahigpit na pagdakma sa konteksto, samantalang pinananatili ng “maselang bahagi” ang eupemistikong paraan ng Hebreo sa pagtukoy sa ari ng lalaki.
