translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa paglalahad ng isang kasong legal. Pinanatili ang mahabang kondisyunal na pangungusap dahil nagpapatuloy ang hatol sa susunod na talata. Ginamit ang gitling na em dash upang madaling maunawaan ang appositional na pariralang nagpapakilala sa dalawang nag-aaway.
