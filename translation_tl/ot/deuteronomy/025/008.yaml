  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: tl
  text: Ipapatawag siya ng mga nakatatandang pinuno ng kanyang lungsod at kakausapin siya. Kung maninindigan siya at sasabihin niya, “Ayaw kong kunin siya bilang asawa,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָרְאוּ לוֹ
  choice: ipatatatawag siya
  rationale: Ang Qal perfect na may waw sa kontekstong legal ay nagsasaad ng kasunod na itinakdang hakbang. Likas sa Filipino ang “ipatatatawag siya” para sa pormal na pagpapaharap.
- source_word: זִקְנֵי עִירוֹ
  choice: matatandang pinuno ng kanyang lungsod
  rationale: Ang זְקֵנִים dito ay hindi lamang matatanda sa edad kundi ang kinikilalang mga pinunong sibiko. Nililinaw ito ng “matatandang pinuno.”
- source_word: וְדִבְּרוּ אֵלָיו
  choice: at kakausapin
  rationale: Tumutukoy ang דבר אֶל sa tuwirang pakikipag-usap sa lalaki; natural at angkop sa pormal na tagpo ang “kakausapin.”
- source_word: וְעָמַד
  choice: Kung maninindigan siya
  rationale: Literal itong “at tumayo siya,” ngunit sa legal na konteksto ay nagpapahiwatig ng pananatili o pagpupumilit sa pasiya matapos siyang kausapin. Pinananatili ng “maninindigan” ang larawan at diwa ng paninindigan.
- source_word: וְאָמַר
  choice: at sasabihin
  rationale: Payak na pandiwa ng pagsasalita sa sunod-sunod na legal na proseso.
- source_word: לֹא חָפַצְתִּי
  choice: Ayaw ko
  rationale: Saklaw ng חפץ ang pagnanais o pagkukusang gawin ang isang bagay. Ang “ayaw ko” ay natural, malinaw, at hindi nagpapalabis sa antas ng pagtanggi.
- source_word: לְקַחְתָּהּ
  choice: kunin siya bilang asawa
  rationale: Bagaman literal na “kunin siya,” karaniwang idyoma ang לקח ng pagkuha sa isang babae bilang asawa. Tahasang paglilinaw ang kailangan sa Filipino upang maiwasang maging malabo o tila pisikal lamang ang “kunin siya.”
