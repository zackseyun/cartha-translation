translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang ipakita ang tungkuling sibiko ng mga elder, at “kunin siya bilang asawa” upang natural na maipahayag ang Hebreong idyoma sa konteksto ng pag-aasawang levirato.
