  naturalness: Kailangan ng bahagyang ayos sa sintaks. Mas malinaw at natural ang “Ipapatawag siya ... at kakausapin siya” kaysa sa “At ipatatawag siya ... at kakausapin,” sapagkat malinaw ang tagaganap at layon ng ikalawang pandiwa. Ang “mga nakatatandang pinuno” ay mas likas kaysa “matatandang pinuno,” na maaaring unawain lamang bilang mga pinunong may edad.
  terminology: Ang “mga nakatatandang pinuno” ay angkop para sa זִקְנֵי bilang mga kinikilalang pinunong sibiko. Ang “kunin siya bilang asawa” ay wastong nagpapahayag ng idyomang Hebreo na “kunin siya” sa kahulugang pakasalan.
