translation_notes:
  register: Maikli at tuwiran ang anyo, gaya ng isang utos sa batas. Ginamit ang makabagong “Huwag mong…” at ang karaniwang salitang “baka,” habang pinanatili sa talababa ang mas tiyak na larawang maaaring ipinahihiwatig ng paggiik.
