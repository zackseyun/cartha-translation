lexical_decisions:
- source_word: לֹא
  choice: Huwag
  rationale: Karaniwang paraan sa makabagong Tagalog ng pagpapahayag ng tuwirang pagbabawal.
- source_word: תַחְסֹם
  choice: mong busalan
  rationale: Ang pandiwang חסם ay nangangahulugang takpan o pigilan ang bibig ng hayop. Ang “busalan” ang tuwiran at likas na katumbas sa kontekstong ito.
- source_word: שׁוֹר
  choice: baka
  rationale: Tumutukoy ang שׁוֹר sa hayop na mula sa uri ng baka, dito ay isang bakang ginagamit sa gawaing bukid. Ang “baka” ang pinakanatural at madaling maunawaang tawag sa Tagalog; hindi tahasang tinutukoy ng talata ang kasarian o kondisyon nito.
- source_word: בְּדִישׁוֹ
  choice: habang naggigiik ito
  rationale: Ang pariralang may בְּ at hulaping ikatlong panauhang panlalaki ay literal na “sa paggiik nito.” Ipinahahayag ng “habang naggigiik ito” ang temporal na diwa sa natural na Tagalog nang hindi nililimitahan ang paraan ng paggiik.
