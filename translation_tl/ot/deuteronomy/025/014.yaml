  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: tl
  text: Huwag kang magkaroon sa iyong bahay ng isang efa at isa pang efa[a]—isang malaki at isang maliit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang efa ay isang sinaunang panukat ng mga Hebreo para sa mga tuyong produkto.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Huwag kang mag-iingat
  rationale: Ang negated imperfect ng היה na may dative ay isang pagbabawal sa pagkakaroon o pagtataglay. Sa konteksto ng mga panukat na nakalagay sa bahay, natural na ipinahahayag ito ng “Huwag kang mag-iingat.”
- source_word: בְּבֵיתְךָ
  choice: sa iyong bahay
  rationale: Tumutukoy ang בַּיִת sa bahay bilang pisikal na lugar kung saan iniingatan ang mga panukat, hindi lamang sa sambahayan bilang pangkat ng mga tao.
- source_word: אֵיפָה וְאֵיפָה
  choice: dalawang takalang efa
  rationale: Ang אֵיפָה ay isang sinaunang takal para sa tuyong produkto. Pinananatili ang pangalang “efa,” habang nililinaw ng “dalawang takalang” ang idyomatikong pag-uulit na tumutukoy sa dalawang magkaibang panukat.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: isang malaki at isang maliit
  rationale: Tahasang pinananatili nito ang pagkakaiba ng dalawang takal at ang maikli, legal na anyo ng Hebreo.
