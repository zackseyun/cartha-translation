  yaml_path: translation/ot/deuteronomy/025/013.yaml
  text: You shall not have in your bag differing weights[a], a large and a small.
translation:
  language: tl
  text: Huwag kang magkaroon sa iyong supot ng magkaibang panimbang[a]—isang malaki at isang maliit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bato at bato,” na tumutukoy sa mga batong ginagamit bilang panimbang sa pangangalakal.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Huwag kang magkaroon
  rationale: Likas na Filipino para sa Hebreong pag-iral na may לְךָ, at malinaw na pinananatili ang lakas ng legal na pagbabawal.
- source_word: בְּכִיסְךָ
  choice: sa iyong supot
  rationale: Ang כִּיס ay supot o lalagyan, lalo na ng salapi o mga panimbang; ang “supot” ay maikli, natural, at angkop sa sinaunang konteksto ng kalakalan.
- source_word: אֶבֶן וָאָבֶן
  choice: magkaibang panimbang
  rationale: Literal itong “bato at bato,” isang idyomang tumutukoy sa mga batong ginagamit bilang panimbang sa pangangalakal. Inihahayag ng salin ang gamit nang hindi nawawala ang ideya ng dalawang di-magkatugmang panimbang.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: isang malaki at isang maliit
  rationale: Pinananatili ang tuwirang paghahambing ng dalawang panimbang at ang distributibong diwa ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Ginamit ang “panimbang” sa halip na “timbang” upang malinaw na tumukoy sa mga bagay na pamantayan sa pagtitimbang; pinanatili sa talababa ang literal na larawan ng mga bato.
