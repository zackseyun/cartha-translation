  text: you shall cut off her hand[b][a]; your eye shall not pity.
translation:
  language: tl
  text: Putulin mo ang kamay niya[a]; huwag kang maawa sa kaniya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palad niya.” Ang salitang Hebreo ay maaaring tumukoy sa palad o sa kamay.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “huwag maawa ang iyong mata.” Maaari ring ipakahulugang “huwag mo siyang paligtasin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: Putulin mo
  rationale: Ang pandiwang קצץ ay tuwirang nangangahulugang pumutol o magtanggal sa pamamagitan ng pagputol. Likas at malinaw sa makabagong Tagalog ang “putulin,” at hindi nito pinalalambot ang tindi ng utos.
- source_word: אֶת
  choice: '[pananda ng tiyak na layon, hindi isinalin]'
  rationale: Walang tuwirang katumbas sa Tagalog ang panandang Hebreo para sa tiyak na layon.
- source_word: כַּפָּהּ
  choice: ang kamay niya
  rationale: Ang כַּף ay maaaring tumukoy sa palad o, sa mas malawak na gamit, sa kamay. Sa utos na may pandiwang “putulin,” mas natural sa Tagalog ang “kamay,” habang inilalagay sa talababa ang mas tiyak na posibilidad na “palad.”
- source_word: לֹא
  choice: huwag
  rationale: Sa konteksto ng tuwirang pagbabawal, natural na Tagalog ang “huwag.”
- source_word: תָחוֹס
  choice: maawa
  rationale: Ang חוס ay maaaring mangahulugang maawa, magmalasakit, o magpaligtas. Ang “maawa” ang malinaw at natural na katumbas dito, bagaman maaari ring unawain ang parirala bilang “huwag magpaligtas.”
- source_word: עֵינֶךָ
  choice: kang … sa kaniya
  rationale: Literal na binabanggit ng Hebreo ang “iyong mata,” ngunit ang idyomang “huwag maawa ang iyong mata” ay hindi natural sa karaniwang Tagalog. Isinalin ang kahulugan sa “huwag kang maawa sa kaniya,” habang pinananatili sa talababa ang literal na larawan.
theological_decisions:
- issue: Tuwirang anyo ng parusang legal
  choice: Panatilihin ang konkretong utos na “Putulin mo ang kamay niya.”
  alternative: Gawing mas malumanay o ipakahulugang ibang uri ng kaparusahan.
  rationale: Malinaw at matindi ang legal na pormula sa tekstong Hebreo. Hindi dapat palambutin o palitan ng saling walang tuwirang batayan sa talata.
- issue: Idyoma ng mata at awa
  choice: Isalin sa natural na Tagalog bilang “huwag kang maawa sa kaniya,” na may literal na anyo sa talababa.
  alternative: “Huwag maawa ang iyong mata.”
  rationale: Pinananatili ng pangunahing teksto ang diwa ng pagbabawal nang malinaw sa modernong Tagalog, samantalang inihahayag ng talababa ang matingkad na pormang Hebreo at ang posibleng diwang “huwag magpaligtas.”
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang isahang “mo/ka” dahil isahan ang mga pandiwa at hulaping panghalip sa Hebreo. Pinanatili ang tindi ng utos, ngunit ginawang natural sa Tagalog ang idyoma tungkol sa mata.
