  text: כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֣שֵׂה אֵ֑לֶּה כֹּ֖ל עֹ֥שֵׂה עָֽוֶל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/016.yaml
  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: tl
  text: Sapagkat kasuklam-suklam kay Yahweh na iyong Diyos ang bawat gumagawa ng mga bagay na ito—ang bawat gumagawa ng kawalang-katarungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang bawat gumagawa ng mali” o “ang bawat mandaraya.” Ang Hebreong עָוֶל ay maaaring tumukoy sa mali, kawalang-katarungan, o kasamaan; dito, lalo itong tumutukoy sa pandaraya sa pakikitungo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pagbabawal at pinananatili ang paliwanag na ugnayan sa konteksto.
- source_word: תוֹעֲבַת
  choice: kasuklam-suklam
  rationale: Likas at mariing Filipino ito para sa isang bagay o taong lubhang karima-rimarim sa harap ng Diyos, nang hindi pinahihina ang moral at tipanang bigat ng salita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Pinananatili ang pang-isahang pagtukoy sa kausap at ang pormulang tipanan na 'Yahweh na iyong Diyos.'
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: ang bawat gumagawa ng mga bagay na ito
  rationale: Malinaw na ipinahahayag ang pangkalahatan at pamamahaging diwa ng כָּל kasama ng participle.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: ang bawat gumagawa ng kawalang-katarungan
  rationale: Inuulit ang 'bawat gumagawa' upang mapanatili ang paralelismo ng Hebreo; ang 'kawalang-katarungan' ay angkop sa pandaraya sa timbangan at panukat sa agarang konteksto.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ng 'Yahweh' ang pagkakaiba nito sa mga titulong banal.
- issue: Saklaw ng עָוֶל
  choice: kawalang-katarungan
  alternative: kasamaan / pandaraya
  rationale: Hindi nililimitahan ang salita sa pandaraya lamang, bagaman iyon ang pangunahing pagpapakita nito sa konteksto ng di-tapat na timbang at panukat.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang em dash upang ipakitang ang ikalawang parirala ay nagpapaliwanag at naglalarawan sa nauna, habang pinananatili ang pag-uulit ng Hebreo.
