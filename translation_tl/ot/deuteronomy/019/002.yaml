translation:
  language: tl
  text: Maglaan ka ng tatlong lungsod sa loob ng iyong lupain na ibinibigay sa iyo ni Yahweh na iyong Diyos upang ariin mo ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang manahin mo ito.” Sa konteksto ng pagkakaloob ng lupain, ang pandiwang Hebreo ay maaaring mangahulugang “ariin” o “manahin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: tatlong lungsod
  rationale: Ang עִיר ay maaaring lungsod o bayan; ang “lungsod” ang karaniwang tawag sa mga itatalagang lungsod sa legal na kontekstong ito.
- source_word: תַּבְדִּיל
  choice: magtalaga ka
  rationale: Ang Hiphil ng בדל ay ‘ihiwalay’ o ‘italaga.’ Mas natural sa modernong Tagalog ang “magtalaga” para sa legal na paglalaan ng mga lungsod, habang nananatili ang diwa ng pagbubukod.
- source_word: לָךְ
  choice: para sa iyo
  rationale: Pinananatili nito ang datibong diwa ng kapakinabangan nang hindi gumagamit ng di-likas na reflexive na parirala.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: sa loob ng iyong lupain
  rationale: Natural na ipinahahayag nito ang spatial na diwa ng בְּתוֹךְ, ‘sa gitna/loob ng.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tumpak na ipinapahayag ang construct form na may ikalawang panauhang panlalaking isahan na hulapi.
- source_word: נֹתֵן לְךָ
  choice: ibinibigay sa iyo
  rationale: Pinananatili ng aspektong pangkasalukuyan ang tuloy o napipintong pagkakaloob ng lupain.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin mo
  rationale: Ang ירשׁ ay maaaring mangahulugang ariin/angkinin o manahin. Ang “angkinin” ay natural sa konteksto ng pagkuha ng lupain bilang kaloob at hindi isinasara ang ideya ng karapatang ipinagkaloob.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng kahulugan ng ירשׁ sa pagkakaloob ng lupain
  choice: angkinin
  alternative: manahin
  rationale: Ang “angkinin” ay malinaw sa agarang konteksto ng pag-aari sa lupa, samantalang inilalagay sa talababa ang tunay na alternatibong “manahin” upang mapanatili ang leksikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang tuwirang utos na “Magtalaga ka,” ang natural na “sa loob ng iyong lupain,” at ang personal na pangalang “Yahweh.”
