lexical_decisions:
- source_word: וְדָרְשׁוּ ... הֵיטֵב
  choice: At masusing magsisiyasat
  rationale: Ipinapahayag ang masinsin at maingat na pagsisiyasat na hinihingi sa mga hukom, sa natural na modernong Tagalog.
- source_word: עֵד שֶׁקֶר
