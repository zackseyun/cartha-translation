  rationale: Tuwirang legal na katawagan para sa saksing hindi nagsasabi ng totoo.
- source_word: שֶׁקֶר עָנָה
  choice: nagbigay ... ng huwad na patotoo
  rationale: Pinananatili ang pag-uulit ng ideya ng kasinungalingan sa Hebreo habang malinaw na ipinapahayag ang gawaing legal ng pagpapatotoo.
- source_word: בְאָחִיו
  choice: laban sa kanyang kapatid
  rationale: Pinananatili ang literal at tipanang pananalita ng אָחִיו; malinaw sa konteksto na tumutukoy ito sa kapwa miyembro ng bayan.
theological_decisions:
- issue: Gamit ng וְהִנֵּה sa resulta ng pagsisiyasat
  choice: Kung mapatunayang
  alternative: at narito, ang saksi ay huwad na saksi
  rationale: Sa kontekstong legal, ipinakikilala ng parirala ang natuklasan matapos ang pagsisiyasat. Ang kondisyunal na salin ay natural sa Tagalog at hindi nagpapasya nang higit sa ebidensiya ng sugnay.
translation_notes:
