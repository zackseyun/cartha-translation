    issue: Hindi malinaw ang sintaktikong ugnayan ng dalawang pariralang “sa lupaing.”
    rationale: Ang “sa lupaing mamanahin mo, sa lupaing ibinibigay...” ay maaaring mabasa bilang maluwag na pag-uulit. Sa Hebreo, ang mana na tatanggapin ay inilalarawan bilang nasa lupain na ibinibigay ni Yahweh. Ang “sa mana mong lupain na mamanahin mo sa lupain na...” ay mas malinaw na nagpapakita nito.
  revised_text: Huwag mong ilipat ang muhon ng hangganan ng iyong kapwa, na itinakda ng mga nauna, sa mana mong lupain na mamanahin mo sa lupain na ibinibigay sa iyo ni Yahweh na iyong Diyos upang angkinin.
  revised_footnotes:
