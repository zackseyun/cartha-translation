base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: tl
  text: Huwag mong ilipat ang muhon ng hangganan ng iyong kapwa, na itinakda ng mga nauna, sa mana mong lupain na mamanahin mo sa lupain na ibinibigay sa iyo ni Yahweh na iyong Diyos upang angkinin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַסִּיג
  choice: ililipat
  rationale: Ang Hiphil ng נסג sa kontekstong ito ay tumutukoy sa paglilipat ng hangganan o ng muhon nito upang manghimasok sa lupa ng iba. Likas sa modernong Filipino ang “ililipat” at hindi nito labis na tinutukoy ang direksiyon.
- source_word: גְּבוּל
  choice: muhon ng hangganan
  rationale: Bagaman pangunahing nangangahulugang hangganan ang גְּבוּל, ang bagay na inililipat sa batas na ito ay ang palatandaang nagtatakda ng hangganan. Malinaw at karaniwan sa usaping lupa ang “muhon ng hangganan.”
- source_word: רֵעֲךָ
  choice: iyong kapwa
  rationale: Sa legal at pangkomunidad na konteksto, tumutukoy ang רֵעַ sa kapwa kasapi ng pamayanan. Pinananatili ng “kapwa” ang lawak nito nang hindi nililimitahan sa taong nakatira sa katabing bahay.
- source_word: גָּבְלוּ
  choice: inilagay
  rationale: Ipinahihiwatig ng pandiwa ang pagtatatag o pagmamarka ng hangganan. Ang “inilagay” ay natural na kaakibat ng konkretong “muhon,” habang nananatili ang diwa ng naunang pagtatakda.
- source_word: רִאשֹׁנִים
  choice: mga nauna
  rationale: Literal at sapat na bukas ang “mga nauna” para sa mga taong naunang nagtakda ng mga hangganan; hindi nito sapilitang ginagawang mga ninuno o tiyak na mga salinlahi ang tinutukoy.
- source_word: בְּנַחֲלָתְךָ
  choice: sa lupaing mamanahin mo
  rationale: Isinasalin nito ang נַחֲלָה bilang minanang bahaging lupa sa konteksto ng paghahati ng lupain, sa paraang mas natural kaysa sa abstraktong “sa iyong mana.”
- source_word: תִּנְחַל
  choice: mamanahin mo
  rationale: Pinananatili ng anyong panghinaharap ang pananaw sa lupaing tatanggapin pa ng Israel bilang mana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang tipan na יהוה sa halip na palitan ito ng isang titulo.
- source_word: נֹתֵן לְךָ
  choice: ibinibigay sa iyo
  rationale: Ang kasalukuyang anyong “ibinibigay” ay angkop sa participle at inilalarawan ang patuloy o tiyak na pagkilos ni Yahweh.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Ipinapahayag ng infinitive ang layuning mapasakamay at mapanghawakan ang lupain. Maikli at natural sa Filipino ang “upang angkinin.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Ugnayan ng mana at pag-angkin sa lupain
  choice: lupaing mamanahin mo … upang angkinin
  alternative: ari-arian mo … upang ariin
  rationale: Pinananatili ang teolohikal at legal na bokabularyo ng lupain bilang mana at bilang kaloob ni Yahweh, nang hindi ito pinapaliit sa karaniwang pribadong ari-arian.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “muhon,” isang tiyak at buhay na terminong panglupa, na nilinaw ng “ng hangganan.” Iniwasan ang mas arkaikong ayos at pinanatili ang legal at tipanang diwa ng talata.
