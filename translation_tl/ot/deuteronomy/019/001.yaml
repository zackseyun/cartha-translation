  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: tl
  text: Kapag inalis[a] ni Yahweh na iyong Diyos ang mga bansang ang kanilang lupain ay ibinibigay sa iyo ni Yahweh na iyong Diyos, at pinaalis mo sila at nanirahan ka sa kanilang mga lunsod at mga bahay,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilipol” o “pinawi”; sa literal, “pinutol.”
    reason: Ipinapakita ang mga posibleng salin ng יַכְרִית habang pinananatili ng pangunahing salin ang mas malawak na saklaw ng idyomang Hebreo.
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Sa kontekstong legal, ipinakikilala nito ang isang inaasahang pangyayari sa hinaharap na magiging batayan ng kasunod na utos. Mas natural at tiyak ang “Kapag” kaysa “Kung.”
- source_word: יַכְרִית
  choice: nilipol
  rationale: Ang Hiphil ng כרת ay tumutukoy sa pag-aalis o pagpuksa sa mga bansa. Ang “nilipol” ay natural sa Filipino at ipinapakita ang bigat ng kilos; inilalagay sa talababa ang mas literal na idyomang “pinutol.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang isinasalin ang pangngalang may hulaping ikalawang panauhang panlalaking isahan; ang “iyong Diyos” ay marangal at natural.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Karaniwang katumbas ito ng גּוֹיִם at angkop sa mga bayang aalisin sa lupain; iniiwasan ang “mga Hentil,” na maaaring magpasok ng mas huling konotasyon.
- source_word: נֹתֵן לְךָ
  choice: ibinibigay sa iyo
  rationale: Ang participle ay nagpapahayag ng nagpapatuloy o tiyak na pagkakaloob. Ang kasalukuyang anyo ay nagpapanatili sa diin na ang lupain ay kaloob ng Diyos.
- source_word: וִירִשְׁתָּם
  choice: pinaalis mo sila
  rationale: Dahil mga tao ang layon ng pandiwa, ang diwa rito ay alisin o agawan sila ng pag-aari, hindi “manahin sila.” Ang “pinaalis” ay malinaw at natural sa Filipino.
- source_word: וְיָשַׁבְתָּ
  choice: nanirahan ka
  rationale: Saklaw nito ang paninirahan o pagtira pagkatapos angkinin ang lupain, habang pinananatili ang pormal na himig.
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: sa kanilang mga lungsod at mga bahay
  rationale: Pinananatili ang pagmamay-aring ipinahihiwatig ng mga hulapi sa Hebreo at ang dalawang lokasyon ng paninirahan.
theological_decisions:
- issue: Pagbibigay ng pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay transliterasyon na hindi pinapalitan ang pangalan ng titulong “PANGINOON.”
- issue: Saklaw ng pagkilos sa mga bansa
  choice: nilipol
  alternative: inalis o pinutol
  rationale: Hindi nilulutas nang higit sa teksto ang tiyak na paraan ng pag-aalis. Ang pangunahing salin ay nagpapahayag ng matinding paglipol sa konteksto, habang ang talababa ay nagpapanatili sa literal na idyoma at mga leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Kapag” para sa inaasahang pangyayari, “Yahweh” para sa banal na pangalan, at isang mahabang pangungusap na nagtatapos sa kuwit upang ipakitang nagpapatuloy ang probisyon sa kasunod na talata.
