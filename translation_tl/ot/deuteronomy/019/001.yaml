revisions:
- from: Kapag nilipol[a] ni Yahweh na iyong Diyos ang mga bansang ang lupain ay ibinibigay sa iyo ni Yahweh na iyong Diyos, at pinaalis mo sila at nanirahan ka sa kanilang mga lungsod at mga bahay,
  to: Kapag inalis[a] ni Yahweh na iyong Diyos ang mga bansang ang kanilang lupain ay ibinibigay sa iyo ni Yahweh na iyong Diyos, at pinaalis mo sila at nanirahan ka sa kanilang mga lunsod at mga bahay,
  rationale: Pinalitan ang “nilipol” ng “inalis” upang hindi higit na tukuyin ang paraan ng pagkilos kaysa sa Hebreo. Idinagdag ang “kanilang” upang malinaw na maipahayag ang hulaping pagmamay-ari sa “lupain.” Napanatili ang bukas na pangungusap at pangwakas na kuwit, sapagkat nagpapatuloy ang kundisyong legal sa kasunod na talata.
