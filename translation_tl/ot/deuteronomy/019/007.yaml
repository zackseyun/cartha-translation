translation:
  language: tl
  text: 'Kaya iniuutos ko sa iyo: “Ibukod mo ang tatlong lungsod para sa iyong sarili.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Ipinahahayag nito ang kongklusyon mula sa naunang tagubilin; maikli at likas sa makabagong Tagalog.
- source_word: אָנֹכִי
  choice: ko
  rationale: Napananatili ng unang panauhan sa “iniuutos ko” ang tahasang nagsasalita nang hindi labis na pinatitindi ang hiwalay na panghalip.
- source_word: מְצַוְּךָ
  choice: iniuutos ko sa iyo
  rationale: Ipinapakita ng anyong pangkasalukuyang pandiwari ang kasalukuyang pagbibigay ng tuwirang utos.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ginagamit ang tutuldok bilang likas na makabagong paraan ng pagpapakilala sa mismong nilalaman ng utos.
- source_word: שָׁלֹשׁ עָרִים
  choice: ang tatlong lungsod
  rationale: Tuwirang katumbas ng bilang at pangngalan; ang panandang “ang” ay kailangan sa likas na balangkas ng pangungusap sa Tagalog.
- source_word: תַּבְדִּיל
  choice: Ibukod mo
  rationale: Ang Hiphil ng בדל ay nangangahulugang ihiwalay o ibukod. Pinananatili ng “ibukod” ang ideya ng paghihiwalay habang nababagay sa opisyal na paglalaan sa mga lungsod.
- source_word: לָךְ
  choice: para sa iyo
  rationale: Tapat nitong ipinahahayag na ang pagkilos ay para sa gamit o kapakinabangan ng kausap, habang pinananatili ang pang-isahang pagtukoy.
theological_decisions:
- issue: Pang-isahang panlalaking kausap sa kautusan ng tipan
  choice: Panatilihin ang pang-isahang “iyo/mo.”
  alternative: Gawing maramihan, gaya ng “inyo/ninyo,” upang tahasang ipakita na bayan ng Israel ang kausap.
  rationale: Madalas kausapin sa Hebreo ang Israel bilang isang pang-isahang katauhan. Pinananatili ng pang-isahang anyo ang retorika ng pinagmulan nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tuwirang pautos na “Ibukod mo” at ang pang-isahang “iyo/mo” upang mapanatili ang anyo ng Hebreo.
