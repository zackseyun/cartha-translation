  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: tl
  text: Maghanda ka ng daan, at hatiin mo sa tatlong bahagi ang lawak ng iyong lupain na ibinibigay sa iyo ni Yahweh na iyong Diyos bilang mana, upang makatakas doon ang sinumang nakapatay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat pumatay.” Mas malawak dito ang salitang Hebreo kaysa “mamamatay-tao,” sapagkat sa kontekstong ito ay saklaw din ang nakapatay nang hindi sinasadya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין
  choice: Ihanda mo
  rationale: Ang Hiphil ng כון ay nangangahulugang gawing handa; natural at tuwiran ang “ihanda” para sa utos tungkol sa daan.
- source_word: הַדֶּרֶךְ
  choice: ang daan
  rationale: Sa kontekstong heograpiko at legal, tumutukoy ito sa aktuwal na rutang patungo sa mga lunsod-kanlungan.
- source_word: וְשִׁלַּשְׁתָּ
  choice: hatiin mo sa tatlong bahagi
  rationale: Malinaw nitong ipinapahayag ang Piel na diwang paghahati o pagsasaayos sa tatlo.
- source_word: גְּבוּל אַרְצְךָ
  choice: ang nasasakupan ng lupaing ... sa iyo
  rationale: Dito, ang גְּבוּל ay mas malawak kaysa guhit-hangganan lamang at tumutukoy sa kabuuang teritoryo o lawak ng lupain.
- source_word: יַנְחִילְךָ
  choice: ibinibigay sa iyo ... bilang mana
  rationale: Pinananatili nito kapuwa ang diwa ng pagkakaloob at ng minanang lupain sa Hiphil ng נחל.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Isinasatitik ang pangalang tipan na יהוה at natural na inilalahad ang pariralang kaugnayan sa Diyos.
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: upang makatakas doon
  rationale: Natural na ipinahahayag sa Filipino ang layunin ng siksik na Hebreong konstruksyong literal na “at iyon ay magiging para sa pagtakas doon.”
- source_word: כָּל רֹצֵחַ
  choice: ang sinumang nakapatay
  rationale: Sa konteksto ng mga lunsod-kanlungan, hindi palaging nangangahulugan ang רֹצֵחַ ng taong sadyang pumatay; hindi agad hinahatulan ng salin ang antas ng pagkakasala.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pinananatili ang personal at tipanang pangalan sa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Kung ang רֹצֵחַ ay dapat magpahiwatig ng sadyang pagpaslang
  choice: sinumang nakapatay
  alternative: mamamatay-tao
  rationale: Saklaw ng kasunod na batas ang di-sinasadyang pagpatay; kaya iniiwasan ang salitang karaniwang nagpapahiwatig ng intensiyonal na pagpaslang, habang pinananatili ang posibilidad na susuriin pa ang pananagutan.
translation_notes:
  register: Modernong Filipino na tuwiran ngunit marangal. Ginamit ang isahang “mo/iyo” upang panatilihin ang ikalawang panauhang isahan ng Hebreo, na tumutukoy sa Israel bilang isang sambayanan. Iniwasan ang teknikal at di-karaniwang “manslayer” na walang eksaktong natural na katumbas sa Filipino.
