- from: Ihanda mo ang daan para sa iyo, at hatiin mo sa tatlong bahagi ang nasasakupan ng lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos bilang mana, upang makatakas doon ang sinumang nakapatay.[a]
  to: Maghanda ka ng daan, at hatiin mo sa tatlong bahagi ang lawak ng iyong lupain na ibinibigay sa iyo ni Yahweh na iyong Diyos bilang mana, upang makatakas doon ang sinumang nakapatay.[a]
  rationale: Inayos ang dalawang hindi likas na parirala sa Filipino at nilinaw ang talababa. Hindi binago ng rebisyon ang saklaw ng Hebreong termino para sa taong nakapatay o ang layuning makatakbo siya roon.
