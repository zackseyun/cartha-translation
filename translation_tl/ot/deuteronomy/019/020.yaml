  text: וְ/הַ/נִּשְׁאָרִ֖ים יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹֽא יֹסִ֨פוּ לַ/עֲשׂ֜וֹת ע֗וֹד כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: tl
  text: At maririnig ito ng mga natitira[a] at matatakot sila; hindi na sila muling gagawa ng ganitong masamang bagay[b] sa gitna mo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang iba” o “ang mga naiwan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tulad ng masamang bagay na ito,” ibig sabihin, isang masamang gawa ng ganitong uri.
    reason: lexical_alternative
  - marker: c
    text: Isahan sa Hebreo ang “mo”; kinakausap ang Israel bilang isang kabuuang pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: mga natitira
  rationale: Ang nifal participle ng שׁאר ay tumutukoy sa ibang taong nananatili matapos ang kaparusahang panghukuman; natural at tuwiran sa Filipino ang “mga natitira.”
- source_word: יִשְׁמְעוּ
  choice: maririnig ito
  rationale: Pangunahing kahulugan ng שמע ang “marinig.” Idinagdag ang “ito” bilang likas na layon sa Filipino, na tumutukoy sa pangyayaring kapaparusahan, nang hindi pinalalawak ang diwa.
- source_word: וְיִרָאוּ
  choice: at matatakot sila
  rationale: Ipinapahayag ng ירא ang takot na dulot ng kaparusahan bilang pagpigil; malinaw at natural ang “matatakot sila” sa modernong Filipino.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: hindi na sila muling gagawa
  rationale: Ang יסף kasama ng infinitive at עוֹד ay nangangahulugang hindi na uulitin ang kilos. Pinananatili ng salin ang diin ng pag-uulit nang hindi literal na gumagamit ng di-likas na “magdaragdag na gumawa.”
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: ganitong masamang bagay
  rationale: Pinananatili ng “ganitong” ang pahambing na puwersa ng כְּ, habang ang “bagay” ay nagpapanatili sa lawak ng דָּבָר at hindi ito labis na nililimitahan sa “gawa.”
- source_word: בְּקִרְבֶּךָ
  choice: sa gitna mo
  rationale: Pinananatili nito ang ikalawang panauhang panlalaking isahan ng hulapi, na tumutukoy sa Israel bilang isang kabuuang pamayanan, at ang pormal na himig ng pormulang pangtipan at panghukuman.
theological_decisions:
- issue: Isahang bilang at kausap sa בְּקִרְבֶּךָ
  choice: sa gitna mo
  alternative: sa gitna ninyo / sa inyo
  rationale: Isahan ang hulaping Hebreo at kinakausap ang Israel bilang isang kabuuang katawan. Pinananatili ng “mo” ang anyong ito nang hindi nagpapasok ng karagdagang pagpapakahulugang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa tekstong legal-pangtipan. Ginamit ang semicolon upang malinaw na iugnay ang pagkarinig at pagkatakot sa bunga nitong hindi na pag-uulit ng kasamaan.
