base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: tl
  text: Huwag mo siyang kaawaan[a]. Alisin mo sa Israel ang pananagutan sa pagdanak ng dugong walang sala[b], at magiging mabuti ang kalagayan mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Huwag maawa sa kaniya ang iyong mata.” Sa Hebreo, ang mata ay inilalarawan bilang luklukan ng awa; maaari ring isalin, “Huwag mo siyang pagbigyan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “alisin mo sa Israel ang dugong walang sala.” Ibig sabihin, alisin sa pamayanan ng Israel ang pananagutang idinulot ng pagdanak ng dugong walang sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תָחוֹס עֵינְךָ עָלָיו
  choice: Huwag mo siyang kaawaan
  rationale: Ang literal na idyomang Hebreo ay tumutukoy sa mata bilang pinagmumulan ng awa, ngunit hindi likas sa modernong Tagalog ang ‘huwag maawa ang iyong mata.’ Ang tuwirang ‘huwag mo siyang kaawaan’ ay malinaw at marangal, habang inilalagay sa talababa ang larawan ng orihinal.
- source_word: וּבִעַרְתָּ
  choice: alisin mo
  rationale: Sa mga batas ng Deuteronomio, ang pandiwa ay tumutukoy sa pag-aalis o paglilinis sa pamayanan, hindi sa literal na pagsunog. Ang ‘alisin’ ay natural sa Tagalog at akma sa kasunod na diwa ng pananagutan sa dugo.
- source_word: דַם הַנָּקִי
  choice: ang pananagutan sa pagdanak ng dugong walang sala
  rationale: Literal itong ‘dugong walang sala,’ ngunit sa konteksto ang inaalis sa Israel ay ang sama-samang bloodguilt na bunga ng pagpatay sa taong walang sala. Pinananatili ng parirala ang larawan ng dugo habang nililinaw ang legal na diwa.
- source_word: מִיִּשְׂרָאֵל
  choice: sa Israel
  rationale: Ipinahihiwatig ng מן ang pag-aalis mula sa bayang Israel; sa natural na Tagalog, ang pandiwang ‘alisin’ ay karaniwang sinusundan ng ‘sa Israel.’
- source_word: וְטוֹב לָךְ
  choice: at mapapabuti ka
  rationale: Ito ay karaniwang pormula sa Deuteronomio para sa mabuting kalalabasan ng pagsunod. Ang ‘mapapabuti ka’ ay maikli, natural, at pinananatili ang resultang ipinahahayag.
- source_word: וְ
  choice: Sa halip
  rationale: Bagaman karaniwang ‘at’ ang pang-ugnay, dito ay inilalagay nito sa pagtutol ang maling awa at ang kinakailangang makatarungang pagkilos. Mas natural sa Tagalog ang ‘Sa halip’ para sa ugnayang ito.
theological_decisions:
- issue: Ang uri ng utos tungkol sa sinadyang mamamatay-tao
  choice: Ang utos ay para sa makatarungang pagkilos ng pamayanan ayon sa legal na prosesong inilatag sa Deuteronomio 19:11–12, hindi para sa personal na paghihiganti.
  alternative: Maaaring maling basahin ang talata bilang pahintulot sa pribadong pagganti.
  rationale: Ipinagkakatiwala ng konteksto sa mga matatanda ng lungsod ang paghawak sa taong sadyang pumatay. Hindi idinagdag sa pangunahing teksto ang paliwanag na ito, ngunit ang salin ay nagpapanatili sa legal at pangkomunidad na diwa.
- issue: Kahulugan ng pag-aalis sa ‘dugong walang sala’
  choice: Tumutukoy ito sa pag-aalis ng pananagutan ng Israel dahil sa pagdanak ng dugong walang sala.
  alternative: Maaaring unawain nang mas literal bilang pag-aalis ng mismong dugong walang sala mula sa Israel.
  rationale: Ang idiomang Hebreo ay sadyang matindi at maaaring manatiling bahagyang metaporikal, ngunit ang layon ng utos sa konteksto ay alisin ang bloodguilt sa pamayanan sa pamamagitan ng wastong paghatol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Iniwasan ang di-likas na literalismo sa idyoma tungkol sa mata, ngunit pinanatili ito sa talababa. Ginamit ang ‘pananagutan’ upang maipahayag ang legal at pangkomunidad na bloodguilt nang hindi nagdaragdag ng sektaryang paliwanag.
