  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: tl
  text: Kung tumindig ang isang saksing may masamang layunin laban sa isang lalaki upang magpatotoo laban sa kanya tungkol sa paglihis[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paghihimagsik” o “pagtalikod.” Ang salitang Hebreo ay literal na tumutukoy sa pagtalikod o paglihis at maaari ring mangahulugan ng malubhang pagsuway; hindi tiyak sa talatang ito ang eksaktong uri ng kasalanang ipinaparatang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagpapakilala ito ng kondisyong legal o kasuistiko, kaya likas ang “Kung” sa Filipino.
- source_word: יָקוּם
  choice: may tumindig
  rationale: Sa kontekstong panghukuman, tumutukoy ito sa pagharap o pagtayo bilang saksi; pinananatili ng “tumindig” ang konkretong larawan ng Hebreo.
- source_word: עֵד חָמָס
  choice: isang mapaminsalang saksi
  rationale: Literal itong “saksi ng karahasan/kasamaan.” Ipinahihiwatig nito ang isang saksing kumikilos nang may masamang layunin, nang hindi agad nililimitahan ang diwa sa simpleng pagsisinungaling.
- source_word: בְּאִישׁ
  choice: laban sa isang lalaki
  rationale: Ang pang-ukol ay tumutukoy sa pinupuntirya ng patotoo, at ang אִישׁ ay tahasang panlalaking isahan sa pormulang legal.
- source_word: לַעֲנוֹת
  choice: upang paratangan
  rationale: Bagaman maaari itong mangahulugang sumagot o magpatotoo, sa kontekstong ito ay salungat at mapanumbat ang patotoo; natural sa Filipino ang “paratangan.”
- source_word: בּוֹ
  choice: siya
  rationale: Ang reperente ay ang lalaking pinatutungkulan ng mapanirang patotoo; sapat at natural ang panghalip pagkatapos ng “paratangan.”
- source_word: סָרָה
  choice: paglihis
  rationale: Pangunahing diwa nito ang pagtalikod o paglihis, na maaaring umabot sa paghihimagsik o apostasya. Pinananatili ng “paglihis” ang lawak at hindi ipinipilit ang isang tiyak na uri ng kasalanan.
theological_decisions:
- issue: Panlalaking katawagan sa pormulang legal
  choice: laban sa isang lalaki
  alternative: laban sa isang tao
  rationale: Pinananatili ang tahasang panlalaking isahan ng אִישׁ habang kinikilalang maaari itong gumana bilang kinatawang kaso sa batas.
- issue: Saklaw ng סָרָה
  choice: paglihis
  alternative: paghihimagsik; pagtalikod; maling gawain
  rationale: Hindi malinaw sa talata lamang kung karaniwang paglabag, paghihimagsik, o relihiyosong pagtalikod ang eksaktong paratang. Ang “paglihis” ay nagpapanatili sa semantikong tensiyon.
translation_notes:
  register: Makabagong Filipino na may marangal na himig na pambatas. Ginamit ang “tumindig” upang mapanatili ang larawan ng pagharap bilang saksi, at “mapaminsalang saksi” upang ipahayag ang עֵד חָמָס nang hindi agad pinapantay sa “sinungaling na saksi.”
