  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: tl
  text: 'Kung tutuparin mo ang buong utos na ito sa pamamagitan ng pagsasagawa nito[a]—na iniuutos ko sa iyo ngayon: ibigin si Yahweh na iyong Diyos at lumakad sa kanyang mga daan sa lahat ng iyong mga araw—magdaragdag ka pa ng tatlong lungsod bukod sa tatlong ito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang “buong utos na ito”; pinananatili rito ang isahang anyo ng pinagmulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagsisimula ito ng kondisyon para sa pagdaragdag ng mga lungsod-kanlungan; pinananatili ng “kung” ang kondisyunal na diwa.
- source_word: תִשְׁמֹר
  choice: tutuparin mo
  rationale: Sa konteksto ng tipan, ang שׁמר ay tumutukoy sa pag-iingat o pagsunod sa utos. Natural at malinaw sa modernong Tagalog ang “tutuparin mo,” nang hindi idinaragdag ang di-tahasang “maingat.”
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: ang buong utos na ito
  rationale: Pinananatili ang isahang bilang ng מִצְוָה at naihahayag ng “buong” ang saklaw ng כָּל.
- source_word: לַעֲשֹׂתָהּ
  choice: sa pamamagitan ng pagsasagawa nito
  rationale: Ipinakikita ang aktuwal na pagsunod sa utos at pinananatili ang tahasang panghalip na tumutukoy rito.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Ang “iniuutos” ay nagpapahayag ng kasalukuyan at nagpapatuloy na kilos ng pagsasalita ni Moises.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: ibigin si Yahweh na iyong Diyos
  rationale: Direktang inilalahad ang nilalaman ng utos at pinananatili ang personal na pangalang יהוה bilang “Yahweh.”
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: at lumakad sa kanyang mga daan
  rationale: Pinananatili ang mahalagang metaporang pangtipan ng paglakad sa mga daan ng Diyos.
- source_word: כָּל הַיָּמִים
  choice: sa lahat ng iyong mga araw
  rationale: Pinananatili ang konkretong Hebreong idyoma para sa habambuhay na katapatan, bagaman mas literal kaysa “habang-buhay.”
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: magdaragdag ka pa para sa iyo ng tatlong lungsod
  rationale: Inilalarawan ang pagdaragdag ng tatlo pang lungsod at isinasalin ang לְךָ nang hindi ipinahihiwatig na pribadong pag-aari ang mga ito.
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: bukod sa tatlong ito
  rationale: Ang עַל ay may diwang pandagdag dito; malinaw at natural ang “bukod sa.”
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ang tuwirang transliterasyon at hindi ito pinapalitan ng isang titulo.
- issue: Ugnayan ng pag-ibig sa Diyos at paglakad sa kanyang mga daan sa “buong utos”
  choice: Panatilihin ang mga ito bilang pagpapaliwanag sa nilalaman ng utos
  alternative: Ihiwalay ang mga ito bilang mga karagdagang kondisyon
  rationale: Ang pagkakabuo ng Hebreo ay maaaring magpahiwatig ng layunin o nilalaman. Pinananatili ng tutuldok ang malapit na ugnayan nang hindi labis na nilulutas ang sintaktikong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang mga metaporang biblikal na “lumakad sa kanyang mga daan” at “lahat ng iyong mga araw,” gayundin ang isahang “utos.”
