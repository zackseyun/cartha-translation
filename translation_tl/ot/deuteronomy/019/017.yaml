base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: tl
  text: Pagkatapos, ang dalawang lalaking may alitan[a] ay tatayo sa harap ni Yahweh, sa harap ng mga pari at mga hukom na nanunungkulan sa panahong iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “may usaping legal” o “na may pinagtatalunan.”
    reason: Pinananatili ang lawak ng kahulugan ng רִיב, na maaaring tumukoy sa alitan, pagtatalo, o kasong dinidinig.
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: Pagkatapos ... ay tatayo
  rationale: Ang waw kasunod ng pandiwang nasa anyong perfect ay nagpapatuloy sa pagkakasunod-sunod ng legal na pamamaraan. Likas sa Tagalog ang “Pagkatapos,” at pinananatili ng “tatayo” ang konkretong kilos sa tekstong Hebreo.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: ang dalawang lalaking
  rationale: Tuwirang tumutukoy ang Hebreo sa dalawang lalaki; hindi ito pinalitan ng mas interpretibong “dalawang panig” o “mga partido.”
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: may alitan
  rationale: Ang רִיב ay maaaring mangahulugang alitan, usapin, o kasong legal. Ang “may alitan” ay maikli, natural, at sapat na bukas sa parehong personal at legal na diwa.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה bilang “Yahweh,” at ang לִפְנֵי bilang “sa harap,” na angkop sa pagharap sa Diyos sa kontekstong panghukuman.
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: sa harap ng mga pari at mga hukom
  rationale: Pinananatili ang ikalawang “sa harap” at malinaw na kinikilala ang dalawang pangkat ng mga awtoridad.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: na nanunungkulan sa panahong iyon
  rationale: Bagaman literal na “na naroroon/magiging naroon sa mga araw na iyon,” ipinahihiwatig ng konteksto na sila ang kasalukuyang mga may tungkulin. Natural at malinaw sa modernong Tagalog ang “nanunungkulan sa panahong iyon.”
theological_decisions:
- issue: Paglalarawan sa pagharap “sa harap ni Yahweh” at sa harap ng mga opisyal
  choice: Pinanatili bilang magkaugnay ngunit magkahiwalay na parirala
  alternative: Ipaliwanag na ang pagharap sa mga pari at hukom ay mismong pagharap kay Yahweh
  rationale: Hindi tahasang nililinaw ng talata ang eksaktong ugnayan ng presensiya ni Yahweh at ng hukumang pinamumunuan ng mga pari at hukom. Pinananatili ng salin ang teolohikal at institusyonal na tensiyon nang walang idinagdag na paliwanag.
- issue: Pagbaybay sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” ayon sa direktang anyo ng tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Pinanatili ang himig ng legal na tagubilin nang hindi gumagamit ng sobrang teknikal o makalumang pananalita.
