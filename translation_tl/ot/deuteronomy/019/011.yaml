revisions:
- from: Ngunit kung may lalaking napopoot sa kapwa niya, tinambangan niya ito, sinalakay, at hinampas, na ikinamatay nito[a], at tumakas siya patungo sa isa sa mga lunsod na ito,
  to: Ngunit kung may lalaking napopoot sa kanyang kapwa, nag-abang sa kanya, sumalakay sa kanya, at hinampas siya nang ikinamatay niya, at tumakas siya patungo sa isa sa mga lunsod na ito,
  rationale: Inayos ang mga panghalip at ang pagkakaugnay ng magkakasunod na kilos upang maging malinaw at natural ang legal na paglalarawan sa Filipino. Napananatili ang ambush, hostile assault, lethal blow, death, at flight na nasa Hebreong teksto. Iningatan ng talababa ang leksikal na alternatibo at ang idyomatikong katangian ng נֶפֶשׁ.
