base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: tl
  text: Ngunit kung may lalaking napopoot sa kanyang kapwa, nag-abang sa kanya, sumalakay sa kanya, at hinampas siya nang ikinamatay niya, at tumakas siya patungo sa isa sa mga lunsod na ito,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Ngunit kung
  rationale: Ipinahihiwatig nito ang kondisyong kasalungat ng naunang kaso ng di-sinasadyang pagpatay.
- source_word: יִהְיֶה אִישׁ
  choice: may lalaking
  rationale: Likas na salin ng eksistensiyal na parirala at pinananatili ang panlalaking anyo ng kinatawang kasong legal.
- source_word: שֹׂנֵא לְרֵעֵהוּ
  choice: napopoot sa kapwa niya
  rationale: Ang שֹׂנֵא ay tuwirang nangangahulugang napopoot, at ang רֵעַ sa kontekstong legal ay kapwa, hindi kinakailangang matalik na kaibigan.
- source_word: וְאָרַב לוֹ
  choice: tinambangan niya ito
  rationale: Malinaw na ipinahahayag ang sinadya at pinagplanuhang paghihintay upang sumalakay.
- source_word: וְקָם עָלָיו
  choice: sinalakay
  rationale: Natural na Filipino para sa idyomang bumangon laban sa isang tao sa konteksto ng marahas na pagkilos.
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  choice: hinampas, na ikinamatay nito
  rationale: Pinananatili ang pagkilos na paghampas at ang hayagang resulta nitong kamatayan, nang hindi pinapalitan ang buong pagkakasunod-sunod ng salitang 'pinaslang.'
- source_word: וְנָס
  choice: tumakas siya
  rationale: Tuwirang salin ng pandiwang tumakas; malinaw sa konteksto na ang gumawa ang tinutukoy.
- source_word: אֶל אַחַת הֶעָרִים הָאֵל
  choice: patungo sa isa sa mga lunsod na ito
  rationale: Tumutukoy sa isa sa mga itinakdang lunsod na kanlungan sa agarang konteksto.
theological_decisions:
- issue: Paglalarawan sa sinasadyang pagpatay bilang kabaligtaran ng di-sinasadyang pagpatay
  choice: 'Pinanatili ang sunod-sunod na pagkilos: pagkapoot, pagtambang, pagsalakay, nakamamatay na paghampas, at pagtakas.'
  alternative: Buod na saling gaya ng “pinaslang niya ito.”
  rationale: Malinaw ang paunang pagpaplano at nakamamatay na layon, ngunit inilalahad iyon ng Hebreo sa pamamagitan ng sunod-sunod na kilos; hindi ito dapat palitan ng isang mas interpretatibong katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa tekstong legal. Ginamit ang “kapwa” sa halip na “kaibigan” upang hindi magpahiwatig ng matalik na ugnayan, at “lunsod” bilang pormal ngunit karaniwang katawagan sa mga lungsod na kanlungan.
