  to: Ngunit kung ang isang tao ay sumama sa kapuwa niya sa gubat upang pumutol ng kahoy, at habang iniindayog niya ang palakol upang putulin ang puno ay kumalas ang bakal na ulo ng palakol mula sa kahoy na hawakan[a] at tumama sa kapuwa niya, at namatay ang kapuwa niya, maaari siyang tumakas patungo sa isa sa mga lunsod na ito at mabuhay.
