  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: tl
  text: Ngunit kung ang isang tao ay sumama sa kapuwa niya sa gubat upang pumutol ng kahoy, at habang iniindayog niya ang palakol upang putulin ang puno ay kumalas ang bakal na ulo ng palakol mula sa kahoy na hawakan[a] at tumama sa kapuwa niya, at namatay ang kapuwa niya, maaari siyang tumakas patungo sa isa sa mga lunsod na ito at mabuhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kumalas ang bakal mula sa kahoy.” Ang “bakal” ay ang bakal na ulo ng palakol, at ang “kahoy” ay ang kahoy na hawakan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲש׶ר
  choice: Ngunit kung ang isang tao
  rationale: Ipinakikilala nito ang isang halimbawang kondisyonal sa pagpapatuloy ng batas; natural sa makabagong Filipino ang “ngunit kung.”
- source_word: רֵעֵהוּ
  choice: kapuwa niya
  rationale: Sa kontekstong legal, tumutukoy ito sa isang kasamahan o kapuwa tao, hindi kinakailangang matalik na kaibigan.
- source_word: בַיַּעַר
  choice: sa gubat
  rationale: Karaniwang makabagong salin para sa lupaing masukal at maraming puno.
- source_word: לַחְטֹב עֵצִים
  choice: upang pumutol ng kahoy
  rationale: Pinananatili ang pangkalahatang gawain ng pagputol ng kahoy nang hindi labis na tinutukoy kung pagputol ng puno o pagsisibak.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: habang iniindayog niya ang palakol
  rationale: Natural na inilalarawan sa Filipino ang galaw ng kamay at kasangkapan sa aktuwal na pagputol.
- source_word: לִכְרֹת הָעֵץ
  choice: upang putulin ang puno
  rationale: Ipinahahayag ang pagputol sa puno sa malinaw at karaniwang pananalita.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן־הָעֵץ
  choice: kumalas ang bakal sa kahoy na hawakan
  rationale: Pinananatili sa pangunahing teksto ang konkretong metonimiya ng Hebreo—“bakal” at “kahoy”—habang nililinaw na hawakan ang tinutukoy na kahoy.
- source_word: וּמָצָא אֶת־רֵעֵהוּ
  choice: tumama sa kapuwa niya
  rationale: Sa konteksto ng lumilipad na bakal, ang literal na “nasumpungan/naabot” ay idiomatikong nangangahulugang tumama.
- source_word: וָמֵת
  choice: kaya namatay ito
  rationale: Nililinaw na ang kapuwa ang namatay bilang bunga ng pagtama, nang hindi binabago ang sanhi at resulta.
- source_word: הוּא יָנוּס
  choice: maaari siyang tumakas
  rationale: Ipinahahayag ang pinahihintulutan at ipinagsasanggalang na pagtakas patungo sa kanlungan, sa halip na utos lamang.
- source_word: וָחָי
  choice: at mabuhay
  rationale: Pinananatili ang maikli at tuwirang pangwakas na layunin/resulta ng pagtakas.
theological_decisions:
- issue: Lakas ng modal sa הוּא יָנוּס
  choice: maaari siyang tumakas
  alternative: tatakas siya / dapat siyang tumakas
  rationale: Sa legal na konteksto, ang probisyon ay nagbibigay ng karapatang tumakas upang maligtas; hindi kailangang gawing tahasang utos ang anyong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapuwa” para sa legal at panlipunang diwa ng רֵעַ, at “lunsod” upang mapanatili ang bahagyang pormal na rehistro ng batas. Ang marker na [a] ay inilagay kaagad matapos ang pariralang ipinaliliwanag nito.
