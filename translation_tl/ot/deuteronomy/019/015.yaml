source:
  edition: WLC
  text: לֹֽא יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּ/אִ֗ישׁ לְ/כָל עָוֺן֙ וּ/לְ/כָל חַטָּ֔את בְּ/כָל חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל פִּ֣י שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל פִּ֥י שְׁלֹשָֽׁה עֵדִ֖ים יָק֥וּם דָּבָֽר־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: tl
  text: Hindi magiging sapat ang iisang saksi laban sa isang tao[a] tungkol sa anumang kasamaan o anumang kasalanan, sa alinmang pagkakasalang nagawa niya. Sa patotoo[b] ng dalawang saksi o sa patotoo ng tatlong saksi mapagtitibay ang isang usapin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “laban sa isang lalaki”; panlalaking isahan ang anyo ngunit ginagamit dito bilang kinatawan sa isang pangkalahatang batas.
    reason: lexical_alternative
  - marker: b
    text: Literal, “ayon sa bibig” ng dalawang saksi o ng tatlong saksi.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mapagtitibay ang isang kaso.” Iisang pandiwang Hebreo ang ginamit dito at sa unang bahagi ng talata; literal itong may diwang “tumayo” o “manatiling nakatayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: hindi magiging sapat ... mapagtitibay
  rationale: Sa kontekstong legal, ang קום ay tumutukoy sa pagiging balido o matibay ng patotoo at sa pagkakatatag ng usapin. Gumamit ng likas na legal na Filipino sa bawat sugnay; ipinaliliwanag sa talababa ang pag-uulit ng iisang pandiwang Hebreo.
- source_word: עֵד אֶחָד
  choice: iisang saksi
  rationale: Likas sa Filipino at malinaw na idiniriin na hindi sapat ang patotoo ng isang saksi lamang.
- source_word: בְּאִישׁ
  choice: laban sa isang tao
  rationale: Ang בְּ sa legal na konteksto ay nagpapahiwatig ng patotoong iniharap laban sa isang akusado. Bagaman panlalaking isahan ang אִישׁ, ang “isang tao” ay natural na modernong Filipino at hindi nililimitahan ang saklaw ng pangkalahatang batas.
- source_word: לְכָל עָוֺן
  choice: tungkol sa anumang kasamaan
  rationale: Pinananatili ang moral at legal na bigat ng עָוֺן habang inihihiwalay ito sa kasunod na mga salitang kaugnay ng kasalanan.
- source_word: וּלְכָל חַטָּאת
  choice: o anumang kasalanan
  rationale: Malawak at tuwirang katumbas na nagpapanatili sa hiwalay na kategoryang binanggit ng Hebreo.
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: sa alinmang pagkakasalang nagawa niya
  rationale: Inihahatid ang masaklaw na legal na diwa at ang ugnayang etimolohikal ng חֵטְא at חטא sa pamamagitan ng “pagkakasalang nagawa,” nang hindi gumagamit ng alanganing pag-uulit sa Filipino.
- source_word: עַל פִּי
  choice: sa patotoo
  rationale: Ang literal na “ayon sa bibig” ay idyomang tumutukoy sa patotoong nagsisilbing batayan; “sa patotoo” ang malinaw at natural na legal na katumbas.
- source_word: שְׁנֵי עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: dalawang saksi ... tatlong saksi
  rationale: Tuwirang pinananatili ang bilang at paralelismo ng legal na kahingian.
- source_word: דָּבָר
  choice: isang usapin
  rationale: Sa hudisyal na konteksto, ang דָּבָר ay maaaring tumukoy sa usapin o kaso. Ang “usapin” ay sapat na malawak upang hindi paliitin ang kahulugan sa isang pormal na sakdal lamang.
theological_decisions:
- issue: Panlalaking kinatawang pananalita sa אִישׁ
  choice: isang tao
  alternative: isang lalaki
  rationale: Panlalaking isahan ang anyong Hebreo, ngunit sa legal na gamit ay kinakatawan nito ang sinumang taong saklaw ng batas. Ang “isang tao” ay natural sa Filipino at pinananatili ang isahang reperensiya nang hindi nagpapahiwatig na lalaki lamang ang saklaw.
- issue: Legal na diwa at pag-uulit ng קום
  choice: hindi magiging sapat ... mapagtitibay
  alternative: hindi mananatili ... mananatili
  rationale: Ang literal na larawang “tumayo/manatili” ay maaaring maging malabo sa modernong Filipino. Ipinahahayag ng salin ang legal na bisa, habang ang talababa ay nagpapanatili ng impormasyon na iisang pandiwa ang inuulit sa Hebreo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan, na may malinaw na legal na tono. Iniwasan ang sobrang teknikal o makalumang pananalita. Pinanatili ang tatlong magkakaugnay na terminong moral-legal sa abot ng natural na Filipino at inilagay ang mahahalagang literal na alternatibo sa mga talababa.
