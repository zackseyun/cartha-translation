  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹ֥א תָח֖וֹס עֵינֶ֑/ךָ נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ עַ֤יִן בְּ/עַ֨יִן֙ שֵׁ֣ן בְּ/שֵׁ֔ן יָ֥ד בְּ/יָ֖ד רֶ֥גֶל בְּ/רָֽגֶל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: tl
  text: 'Huwag kang maawa[a]: buhay para sa buhay[b], mata para sa mata, ngipin para sa ngipin, kamay para sa kamay, paa para sa paa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Huwag maawa ang iyong mata.” Maaari ring unawain na “huwag kang magparaya” o “huwag kang magpakita ng habag.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong נֶפֶשׁ ay nangangahulugang “buhay” dito, hindi partikular na “kaluluwa” sa kalaunang teolohikal na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: maawa
  rationale: Ang חוס ay tumutukoy sa pagkahabag o hindi pagpaparusa/pagpuksa. Sa kontekstong legal, malinaw at likas sa makabagong Tagalog ang “Huwag kang maawa,” habang naitatala sa talababa ang iba pang posibleng diwa.
- source_word: עֵינֶךָ
  choice: kang
  rationale: Literal na “ang iyong mata” ang Hebreong paksa, isang idyoma para sa pagkahabag. Isinalin itong likas na “kang” sa pangunahing teksto upang maipahayag ang kahulugan sa Tagalog; pinanatili sa talababa ang konkretong larawan ng mata.
- source_word: נֶפֶשׁ
  choice: buhay
  rationale: Sa pormulang נֶפֶשׁ בְּנֶפֶשׁ, ang tinutukoy ay buhay bilang katumbas ng buhay, hindi “kaluluwa” sa kalaunang metapisikal na diwa.
- source_word: בְּ
  choice: para sa
  rationale: Sa bawat pares, ipinahahayag ng בְּ ang katumbasan o ganti. Ang “para sa” ay maikli, natural, at angkop sa pormulang legal sa Tagalog.
- source_word: עַיִן
  choice: mata
  rationale: Tuwirang katawagan sa bahagi ng katawan at bahagi ng konkretong pormula ng katumbas na pagganti.
- source_word: שֵׁן
  choice: ngipin
  rationale: Tumpak at karaniwang katumbas ng literal na katawagan sa bahagi ng katawan.
- source_word: יָד
  choice: kamay
  rationale: Tumpak na katumbas ng Hebreong katawagan sa pormulang legal.
- source_word: רֶגֶל
  choice: paa
  rationale: Ang “paa” ang karaniwan at angkop na katumbas sa hanay ng mga pinsala sa katawan.
theological_decisions:
- issue: Kung pananatilihin ang konkretong pormula ng legal na pagganti o gagawin itong pangkalahatang simulain ng proporsiyonal na katarungan
  choice: 'Pinanatili ang konkretong pormula: “buhay para sa buhay, mata para sa mata, ngipin para sa ngipin, kamay para sa kamay, paa para sa paa.”'
  alternative: “Ang parusa ay dapat tumugma sa kasalanan.”
  rationale: Nasa Hebreo ang isang tiyak at paulit-ulit na pormulang legal. Ang pagpapalit dito ng abstraktong paliwanag ay magtatago sa matinding retorika at sa ugnayan nito sa ibang mga talata ng Torah.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang likas na idyomang “Huwag kang maawa” sa halip na ang salitang-sa-salitang “Huwag maawa ang iyong mata,” ngunit inilagay sa talababa ang konkretong larawang Hebreo. Pinanatili ang maikli at mariing ritmo ng pormulang legal.
