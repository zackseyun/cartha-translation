base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: tl
  text: At kung palalawakin ni Yahweh na iyong Diyos ang iyong teritoryo, gaya ng isinumpa niya sa iyong mga ninuno,[a] at ibibigay niya sa iyo ang buong lupain na ipinangako niyang ibigay sa iyong mga ninuno,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “sa iyong mga ama.” Ganito rin sa ikalawang paglitaw ng “sa iyong mga ninuno” sa talatang ito. Tinutukoy ng Hebreo ang mga patriyarkang ninuno ng Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ng “At” ang kaugnayan ng kondisyong ito sa naunang tagubiling legal.
- source_word: יַרְחִיב
  choice: palalawakin
  rationale: Ang Hiphil ng רחב ay nangangahulugang palawakin; likas itong gamitin para sa paglawak ng sakop na lupain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tumpak na inilalarawan ang construct na may hulaping pangalawang panauhang panlalaking isahan.
- source_word: גְּבֻלְךָ
  choice: ang iyong nasasakupan
  rationale: Sa konteksto, ang גְּבוּל ay tumutukoy sa sakop na lupain, hindi lamang sa mismong guhit ng hangganan.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: gaya ng isinumpa niya
  rationale: Pinananatili ang tahasang panunumpa ng Diyos at ang paghahambing sa naunang pangako.
- source_word: לַאֲבֹתֶיךָ
  choice: sa iyong mga ninuno
  rationale: Bagaman literal na “sa iyong mga ama,” natural na ipinahahayag ng “mga ninuno” sa modernong Filipino ang pagtukoy sa mga patriyarkang pinagmulan ng Israel; nililinaw sa talababa ang literal na anyo.
- source_word: וְנָתַן לְךָ
  choice: at ibibigay niya sa iyo
  rationale: Ang waw plus perfect ay bahagi ng kondisyong nakatuon sa hinaharap; malinaw at likas sa Filipino ang aspektong kontemplatibo.
- source_word: כָּל הָאָרֶץ
  choice: ang buong lupain
  rationale: Tumutukoy ang אָרֶץ sa ipinangakong lupain, hindi sa buong daigdig.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: ipinangako niyang ibigay
  rationale: Bagaman literal na “sinabi niyang ibibigay,” ipinahahayag ng “ipinangako” ang puwersa ng pananalita sa konteksto ng tipan nang hindi dinaragdagan ang diwa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “Panginoon.”
- issue: Pagpapahayag sa אבות
  choice: mga ninuno
  alternative: mga ama
  rationale: Sa konteksto, tumutukoy ito sa mga patriyarkang ninuno ng Israel. Mas natural at malinaw sa kasalukuyang Filipino ang “mga ninuno,” habang iniingatan sa talababa ang literal na panlalaking katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nasasakupan” upang ipahiwatig ang teritoryo, at pinanatili ang talata bilang di-kumpletong kondisyong nagpapatuloy sa kasunod na talata.
