base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: tl
  text: Kung gayon, gawin ninyo sa kanya ang mismong binalak niyang gawin sa kanyang kapatid.[a] Sa gayon, alisin mo ang kasamaan mula sa iyong kalagitnaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang kapwa.” Sa Hebreo, “sa kanyang kapatid,” isang katawagang maaari ring tumukoy sa kapwa kasapi ng sambayanan sa legal na kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: gawin ninyo
  rationale: Ang anyong pandiwa ay tumutukoy sa pamayanan o sa mga hukom at may puwersa ng legal na utos; natural itong ipinahahayag sa Filipino bilang “gawin ninyo.”
- source_word: לוֹ
  choice: sa kanya
  rationale: Ang panghalip ay tumutukoy sa bulaang saksi sa konteksto.
- source_word: כַּאֲשֶׁר
  choice: ang mismong
  rationale: Ipinakikita nito ang eksaktong pagtutumbas ng parusa sa binalak na pinsala; ang “mismong” ay natural na naghahatid ng diwang “kung ano mismo ang.”
- source_word: זָמַם
  choice: binalak niya
  rationale: Ang זמם ay nangangahulugang magbalak o magpanukala, kadalasan nang may masamang layunin. Hindi na kailangang idagdag ang “masama” dahil malinaw iyon sa konteksto ng bulaang patotoo.
- source_word: לַעֲשׂוֹת
  choice: gawin
  rationale: Payak na infinitibong katuwang ng “binalak,” kaya ang tuwirang salin na “gawin” ang angkop.
- source_word: לְאָחִיו
  choice: sa kanyang kapatid
  rationale: Ang אָח ay literal na “kapatid” at sa legal na kontekstong ito ay maaari ring tumukoy sa kapwa kasapi ng sambayanan. Pinananatili ng “kapatid” ang larawan ng tekstong Hebreo habang nililinaw sa talababa ang mas malawak na gamit.
- source_word: וּבִעַרְתָּ
  choice: Sa gayon, aalisin ninyo
  rationale: Sa pormulang legal ng Deuteronomio, ang בער ay nangangahulugang alisin o pawiin, hindi literal na sunugin. Ang “aalisin” ay malinaw at likas sa modernong Filipino.
- source_word: הָרָע
  choice: ang kasamaan
  rationale: Pinananatili ng “kasamaan” ang moral at pormulang bigat ng Hebreong הָרָע nang hindi ito nililimitahan sa isang teknikal na paglabag.
- source_word: מִקִּרְבֶּךָ
  choice: mula sa gitna ninyo
  rationale: Ito ang likas na katumbas ng Hebreong larawan ng pag-aalis ng kasamaan mula sa loob ng sambayanan.
theological_decisions:
- issue: Ang panlipunan at tipanang saklaw ng אָחִיו sa kontekstong legal
  choice: kanyang kapatid
  alternative: kanyang kapwa / kapwa Israelita
  rationale: Literal na “kapatid” ang salitang Hebreo, ngunit ginagamit din ito para sa isang kapwa kasapi ng tipanang sambayanan. Pinananatili sa pangunahing teksto ang konkretong salita at inilalagay sa talababa ang mas malawak na kahulugan upang hindi paliitin o tahimik na palawakin ang saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo” upang katawanin ang pamayanan o mga hukom na inuutusan. Ang “Kung gayon” at “Sa gayon” ay nagpapanatili sa lohikal na daloy ng hatol at sa pormulang pangwakas nang hindi nagiging labis na teknikal.
