  text: וְ/זֶה֙ דְּבַ֣ר הָ/רֹצֵ֔חַ אֲשֶׁר יָנ֥וּס שָׁ֖מָּ/ה וָ/חָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמֹ֥ל שִׁלְשֹֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: tl
  text: 'Ito ang tuntunin para sa nakapatay na maaaring tumakas doon at manatiling buhay: ang taong nakasakit sa kaniyang kapuwa nang hindi sinasadya at hindi niya ito kinapopootan noon[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula kahapon at noong makalawa”; isang idyoma ito na nangangahulugang “dati” o “noon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: tuntunin
  rationale: Sa kontekstong legal, tumutukoy ito sa tuntuning sumasaklaw sa kaso ng nakapatay; mas malinaw ito sa karaniwang mambabasa kaysa sa literal na “salita” o malawak na “bagay.”
- source_word: הָרֹצֵחַ
  choice: nakapatay
  rationale: Sa konteksto ng mga lungsod-kanlungan, tumutukoy ito sa taong naging sanhi ng kamatayan ngunit hindi pa ipinapalagay na mamamatay-taong may masamang layunin. Iniiwasan ng “nakapatay” ang maagang paghatol na likas sa “mamamatay-tao.”
- source_word: יָנוּס שָׁמָּה
  choice: maaaring tumakas doon
  rationale: Ang imperfect ay naglalarawan sa taong karapat-dapat tumakas sa lungsod-kanlungan; ipinahahayag ng “maaaring” ang pahintulot o pagkakakilanlan ng uring ito nang hindi ito ginagawang tahasang utos.
- source_word: וָחָי
  choice: upang manatiling buhay
  rationale: Ipinahahayag ng anyo ang layunin o bunga ng pagtakas. Natural sa Filipino ang “upang manatiling buhay” at malinaw nitong ipinakikita na ang pag-iingat sa buhay ang bunga ng pagkanlong.
- source_word: יַכֶּה
  choice: nakapatay
  rationale: Literal na nangangahulugang “humampas” o “sumakit,” ngunit malinaw sa legal na konteksto at sa tawag na הָרֹצֵחַ na ikinamatay ng kapuwa ang nangyari. Ang “nakapatay” ay natural at hindi nagmumungkahi na isang sinadyang pananakit ang naganap.
- source_word: רֵעֵהוּ
  choice: kapuwa niya
  rationale: Ang “kapuwa” ay natural na katumbas sa modernong Filipino para sa isang kapwa tao sa kontekstong legal, nang hindi ipinapalagay na magkapitbahay o malapit na magkaibigan sila.
- source_word: בִּבְלִי דַעַת
  choice: nang hindi sinasadya
  rationale: Bagaman literal na “nang walang kaalaman,” sa batas na ito ay tumutukoy ang parirala sa kawalan ng layunin o intensiyong pumatay. Malinaw at natural ang “nang hindi sinasadya.”
- source_word: לֹא שֹׂנֵא לוֹ
  choice: hindi niya ito ... kinapopootan
  rationale: Pinananatili nito ang dating disposisyon ng taong nakapatay bilang mahalagang salik sa pananagutang legal.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: dating
  rationale: Idyoma ito para sa naunang panahon. Ang “dating” ay maikli at natural, habang inilalahad sa talababa ang literal na larawan ng Hebreo.
theological_decisions:
- issue: Kung ang הָרֹצֵחַ ay dapat isaling “mamamatay-tao”
  choice: nakapatay
  alternative: mamamatay-tao
  rationale: Hindi pa itinuturing ng talata na may salang pagpatay ang taong ito; ang mismong probisyon ay para sa pagkamatay na hindi sinasadya at walang dating pagkapoot. Kaya hindi dapat magpasok ang salin ng hatol na wala pa sa teksto.
translation_notes:
  register: Modernong Filipino na dignidad ang tono. Ginamit ang “tuntunin,” “nakapatay,” at “kapuwa” bilang malinaw na mga salitang legal ngunit madaling maunawaan. Ang marker na [a] ay inilagay pagkatapos ng buong pahayag tungkol sa dating pagkapoot, sapagkat ang talababa ay nagpapaliwanag sa idyomang מִתְּמֹל שִׁלְשֹׁם (“dating”), hindi sa pariralang “nang hindi sinasadya.”
