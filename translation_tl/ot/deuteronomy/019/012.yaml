translation:
  language: tl
  text: Saka magsusugo ang matatandang pinuno ng kanyang lungsod upang kunin siya roon at ipasa siya sa tagapaghiganti ng dugo[a], at mamamatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagapaghiganti ng dugong dumanak.” Ang pariralang Hebreo na גֹּאֵל הַדָּם ay isang teknikal na katawagang legal para sa taong may tungkuling maghiganti sa pagdanak ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: magsusugo
  rationale: Ang anyong pandiwa sa kontekstong legal ay may puwersang nag-uutos o nagtatakda ng dapat gawin; natural na naipahahayag ito sa Filipino sa anyong panghinaharap.
- source_word: זִקְנֵי עִירוֹ
  choice: ang matatandang pinuno ng kanyang lungsod
  rationale: Ang זִקְנֵי ay tumutukoy sa kinikilalang matatandang lider ng pamayanan, hindi lamang sa mga taong may edad; nililinaw ito ng “matatandang pinuno.”
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: upang kunin siya roon
  rationale: Pinananatili ng “kunin” ang malawak na diwa ng לקח nang hindi nagdaragdag ng antas ng puwersang hindi tahasang sinasabi sa Hebreo.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: ibigay sa kamay ng
  rationale: Pinananatili nito ang konkretong idyomang Hebreo at malinaw na ipinahihiwatig ang pagsasailalim sa kapangyarihan ng tumatanggap.
- source_word: גֹּאֵל הַדָּם
  choice: tagapaghiganti ng dugo
  rationale: Ito ang tuwirang salin ng teknikal na katawagang legal para sa taong may pananagutang ipaghiganti ang dugong ibinubo, habang hindi idinaragdag sa pangunahing teksto ang ugnayang kamag-anak na ipinahihiwatig ng mas malawak na gamit ng גאל.
- source_word: וָמֵת
  choice: at mamamatay siya
  rationale: Pinananatili ang maikli at tuwirang legal na kinalabasan ng Hebreo nang hindi nagpapasok ng dagdag na paliwanag tungkol sa paraan o tagaganap ng kamatayan.
