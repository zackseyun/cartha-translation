base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/010.yaml
  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: tl
  text: upang hindi dumanak ang dugo ng taong walang sala sa gitna ng iyong lupain, na ibinibigay sa iyo ni Yahweh na iyong Diyos bilang mana, at magkakaroon ka ng pananagutan sa dugong dumanak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na salin: “at ang dugo ay mapapasaiyo.” Ang idyomang Hebreo ay tumutukoy sa pananagutan sa pagdanak ng dugo ng taong walang sala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: mabuhos
  rationale: Ang Niphal ng שׁפך ay nagsasaad na ang dugo ay mabuhos o madanak. Ang “mabuhos” ay likas sa Filipino at ang konteksto ng batas sa pagpatay ang nagpapalinaw sa kahulugan.
- source_word: דָּם נָקִי
  choice: dugo ng taong walang sala
  rationale: Nililinaw nito na ang tinutukoy ay dugo ng isang taong hindi nararapat patayin, habang pinananatili ang legal at moral na diwa ng pariralang Hebreo.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: sa gitna ng iyong lupain
  rationale: Pinananatili ng “sa gitna” ang tahasang spatial na diwa ng קֶרֶב at ang marangal na himig ng batas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: ibinibigay sa iyo ... bilang mana
  rationale: Ang kasalukuyang aspektong “ibinibigay” ay angkop sa participle na נֹתֵן, at ang “bilang mana” ay nagpapanatili sa diwa ng lupaing minanang pag-aari sa tipan.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: at upang hindi ka magkaroon ng pananagutan sa pagdanak ng dugo
  rationale: Sa kontekstong legal, ang maramihang דָּמִים ay isang idyoma para sa pananagutan dahil sa dugong dumanak. Isinama ang sugnay sa layuning ipinahihiwatig ng naunang “upang hindi,” gaya ng hinihingi ng natural na Filipino.
theological_decisions:
- issue: Paglalapat ng pananagutan sa dugong walang sala
  choice: pananagutan sa pagdanak ng dugo
  alternative: mapapasaiyo ang dugo
  rationale: Ang unang anyo ay malinaw na naghahatid ng legal at moral na idyomang Hebreo nang hindi ipinapalagay na literal na dugo ang mapupunta sa kausap; inilalagay sa talababa ang mas literal na anyo upang mapanatili ang larawan at tunay na alternatibo.
- issue: Paglalapat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong pinagmulan, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago at dignified na Filipino na angkop sa pampublikong pagbasa. Ginamit ang “lupain” at “mana” upang mapanatili ang legal at tipanang himig, ngunit nilinaw ang dalawang idyomang Hebreo para madaling maunawaan ng karaniwang mambabasa.
