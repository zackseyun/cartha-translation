  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “ito/nito” para luminaw ang pagpapalit ng tinutukoy sa tagapaghiganti at sa nakapatay, at iniwasan ang “mamamatay-tao” dahil nagdadala iyon ng di-angkop na pahiwatig ng sinasadyang pagpatay.
