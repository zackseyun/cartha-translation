base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: tl
  text: kung hindi, baka habulin ng tagapaghiganti ng dugo ang nakapatay dahil nag-aalab ang kanyang galit[a], at maabutan niya ito dahil mahaba ang daan, saka niya ito patayin, gayong walang hatol na kamatayan para sa kanya, sapagkat hindi naman nito kinapootan ang napatay dati[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “dahil uminit ang kanyang puso.” Ipinahahayag ng Hebreong idyoma ang nag-aalab na galit.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula kahapon o noong makalawa,” isang Hebreong idyoma na nangangahulugang “dati” o “noong una.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: kung hindi, baka
  rationale: Likas sa modernong Tagalog ang pariralang ito para ipahayag ang panganib na nilalayong maiwasan.
- source_word: גֹּאֵל הַדָּם
  choice: tagapaghiganti ng dugo
  rationale: Pinananatili nito ang legal at pampamilyang tungkulin ng kamag-anak na naghihiganti dahil sa napatay.
- source_word: הָרֹצֵחַ
  choice: ang nakapatay
  rationale: Hindi ginamit ang “mamamatay-tao,” na karaniwang nagpapahiwatig ng sinasadyang pagpatay; ayon sa konteksto, walang dating pagkapoot at walang hatol na kamatayan laban sa taong ito.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: dahil nag-aalab ang kanyang galit
  rationale: Ipinahahayag nang malinaw at masigla ang Hebreong idyoma ng pusong umiinit dahil sa matinding galit.
- source_word: וְהִשִּׂיגוֹ
  choice: at maabutan niya ito
  rationale: Tuwirang inilalarawan ang paghabol at pag-abot sa tumatakas.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: dahil mahaba ang daan
  rationale: Pinananatili ang konkretong larawan ng mahabang paglalakbay patungo sa lunsod-kanlungan.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: saka niya ito patayin
  rationale: Natural na Tagalog para sa Hebreong pahayag tungkol sa paghampas na ikamamatay ng isang tao.
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: gayong walang hatol na kamatayan laban dito
  rationale: Pinananatili ang legal na diwa ng מִשְׁפַּט at hindi ginagawang isang pangkalahatang pahayag lamang tungkol sa moral na pagiging karapat-dapat.
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: sapagkat hindi naman nito kinapootan ang napatay
  rationale: 'Inilalahad ang batayang legal: walang naunang pagkapoot sa taong napatay.'
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: noong una
  rationale: Natural na katumbas ng Hebreong idyoma para sa naunang panahon.
