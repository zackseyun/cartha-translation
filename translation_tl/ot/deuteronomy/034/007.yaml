  source_fidelity: 'Tumpak ang salin sa Hebreo: naipahayag ang edad ni Moises sa kanyang kamatayan, ang hindi paglabo ng kanyang paningin, at ang pananatili ng kanyang pisikal na sigla. Ang pagsasalin ng isahang עֵינוֹ bilang “paningin” ay likas sa modernong Filipino at maayos na nililinaw ng talababa ang literal na “mata.”'
