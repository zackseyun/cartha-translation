  text: וּ/מֹשֶׁ֗ה בֶּן מֵאָ֧ה וְ/עֶשְׂרִ֛ים שָׁנָ֖ה בְּ/מֹת֑/וֹ לֹֽא כָהֲתָ֥ה עֵינ֖/וֹ וְ/לֹא נָ֥ס לֵחֹֽ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: tl
  text: Isang daan at dalawampung taong gulang si Moises nang mamatay siya. Hindi lumabo ang kanyang paningin[a], at hindi naglaho ang kanyang sigla[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Hindi lumabo ang kanyang mata”; ibig sabihin, hindi humina ang kanyang paningin.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi humina ang lakas ng kanyang katawan.” Ang salitang Hebreo ay tumutukoy sa nananatiling kasariwaan, lakas, o sigla ng katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: si Moises
  rationale: Ipinagpapatuloy ng וּ ang salaysay; hindi kailangang tumbasan ng hiwalay na pang-ugnay sa Filipino sapagkat likas na naipahihiwatig ng konteksto ang pagpapatuloy.
- source_word: בֶּן־מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: Isang daan at dalawampung taong gulang
  rationale: Ang literal na idyomang Hebreo na ‘anak ng isang daan at dalawampung taon’ ay tumutukoy sa edad; ito ang malinaw at likas na katumbas sa modernong Filipino.
- source_word: בְּמֹתוֹ
  choice: nang mamatay siya
  rationale: Temporal ang gamit ng pang-ukol at pangngalang ‘kamatayan’; natural na ipinahahayag ito sa Filipino sa pamamagitan ng ‘nang mamatay siya.’
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: Hindi lumabo ang kanyang paningin
  rationale: Ang כָּהָה ay nangangahulugang lumabo o humina, lalo na tungkol sa paningin. Ginamit ang ‘paningin’ para sa likas na Filipino, habang itinatala sa talababa ang literal na isahang ‘mata.’
- source_word: וְלֹא נָס לֵחֹה
  choice: at hindi naglaho ang kanyang sigla
  rationale: Ang לֵחַ ay maaaring tumukoy sa kasariwaan, lakas, o sigla ng katawan, at ang נוּס ay literal na ‘tumakas’ o ‘maglaho.’ Pinananatili ng ‘hindi naglaho ang kanyang sigla’ ang talinghaga at malinaw pa rin sa karaniwang mambabasa.
