base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: tl
  text: sa lahat ng mga tanda at kababalaghan na isinugo ni Yahweh si Moises upang gawin sa lupain ng Ehipto—kay Paraon, sa lahat ng kanyang lingkod, at sa buong lupain niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang huling parirala ay maaari ring isalin na “laban sa buong lupain niya” o “sa buong lupain niya.” Maaaring magpahiwatig ng iba’t ibang ugnayan ang pang-ukol na Hebreo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: sa lahat ng tanda at kababalaghan
  rationale: Ang “sa lahat” ay nagpapanatili sa pagkakaugnay ng talata sa naunang pahayag tungkol sa pagiging walang kapantay ni Moises. Ang “tanda at kababalaghan” ay likas at pamilyar na pares sa Tagalog nang hindi labis na binibigyang-kahulugan ang mga salita bilang iisang uri lamang ng himala.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: na isinugo sa kanya ni Yahweh na gawin
  rationale: Tuwirang ipinapahayag nito na si Yahweh ang nagsugo kay Moises upang gawin ang mga tanda at kababalaghan. Pinananatili ng “gawin” ang malawak na kahulugan ng עשה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng Tetragrammaton.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili nito ang tahasang salitang “lupain” sa Hebreo at ang marangal na himig ng salaysay.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו
  choice: kay Paraon, sa lahat ng lingkod nito
  rationale: Ang “kay/sa” ay malapit sa anyo ng Hebreong pang-ukol at hindi tahasang nagpapasya kung ang diwa ay patungo, ukol, o laban. Ginamit ang “lingkod” bilang tuwirang katumbas, bagaman maaaring tumukoy sa mga opisyal ng hari.
- source_word: וּלְכָל אַרְצוֹ
  choice: at sa buong lupain nito
  rationale: Likas sa Tagalog ang “sa buong lupain” at pinananatili nito ang saklaw sa buong teritoryong nasasakupan ni Paraon; nililinaw sa talababa ang maaaring diwang “laban sa” o “sa buong.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Relasyonal na diwa ng ל sa Paraon, mga lingkod, at lupain
  choice: kay/sa
  alternative: laban kay/laban sa; sa harap ni; sa buong
  rationale: Maraming posibleng relasyonal na diwa ang pang-ukol. Ang payak na “kay/sa” ay nagpapanatili ng tunay na kalabuan, samantalang inilalahad sa talababa ang mga pangunahing alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Nananatiling pariralang karugtong ng naunang talata ang simula, gaya ng Hebreo. Ginamit ang “nito” para malinaw na si Paraon ang tinutukoy at hindi si Moises o si Yahweh.
