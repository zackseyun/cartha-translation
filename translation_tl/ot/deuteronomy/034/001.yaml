id: DEU.34.1
reference: Deuteronomy 34:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: tl
  text: 'Pagkatapos, umakyat si Moises mula sa kapatagan ng Moab patungo sa Bundok Nebo, sa tuktok ng Pisga na nakaharap sa Jerico. At ipinakita sa kanya ni Yahweh ang buong lupain: ang Gilead hanggang sa Dan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Tuwirang ipinapahayag ang paitaas na pagkilos at natural sa makabagong Tagalog.
- source_word: מֵעַרְבֹת מוֹאָב
  choice: mula sa kapatagan ng Moab
  rationale: Ang עַרְבוֹת ay tumutukoy sa malawak at patag na rehiyon; malinaw at karaniwang heograpikong salin ang “kapatagan ng Moab.”
- source_word: הַר נְבוֹ
  choice: Bundok Nebo
  rationale: Likas na anyo sa Tagalog para sa הַר na sinusundan ng pangalang pantangi.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: sa tuktok ng Pisga
  rationale: Ang רֹאשׁ ay literal na “ulo” ngunit nangangahulugang “tuktok” sa kontekstong heograpiko.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: na nakaharap sa Jerico
  rationale: Pinananatili nito ang larawang heograpiko ng עַל־פְּנֵי, na maaaring mangahulugang nakaharap o nasa tapat.
- source_word: וַיַּרְאֵהוּ יְהוָה
  choice: ipinakita sa kanya ni Yahweh
  rationale: Ang Hiphil ng ראה ay causative, “pinakita” o “pinangyaring makita”; natural sa Tagalog ang “ipinakita sa kanya.”
- source_word: כָּל הָאָרֶץ
  choice: ang buong lupain
  rationale: Sa konteksto, tumutukoy ang הָאָרֶץ sa lupaing tinatanaw, hindi sa buong daigdig.
- source_word: אֶת הַגִּלְעָד עַד דָּן
  choice: ang Gilead hanggang sa Dan
  rationale: Pinananatili ang rehiyong Gilead at ang hangganang ipinahihiwatig ng עַד.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalang pantangi ang Tetragrammaton sa tekstong Hebreo; pinananatili ng “Yahweh” ang personal na pangalang ginamit sa pinagmulan nang hindi ito pinapalitan ng titulo.
- issue: Causative na anyo ng וַיַּרְאֵהוּ
  choice: ipinakita sa kanya
  alternative: pinangyari siyang makita; hinayaang makita niya
  rationale: Ang “ipinakita” ang natural na Tagalog para sa causative na diwa at hindi nagdaragdag ng paliwanag tungkol sa paraan ng pagpapakita.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang mga anyong heograpiko at pinanatili ang colon upang ipakilala ang unang espesipikong bahagi ng “buong lupain.”
