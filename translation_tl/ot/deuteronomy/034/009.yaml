  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וִֽ/יהוֹשֻׁ֣עַ בִּן נ֗וּן מָלֵא֙ ר֣וּחַ חָכְמָ֔ה כִּֽי סָמַ֥ךְ מֹשֶׁ֛ה אֶת יָדָ֖י/ו עָלָ֑י/ו וַ/יִּשְׁמְע֨וּ אֵלָ֤י/ו בְּנֵֽי יִשְׂרָאֵל֙ וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: tl
  text: At si Josue na anak ni Nun ay puspos ng espiritu ng karunungan[a], sapagkat ipinatong ni Moises ang kanyang mga kamay sa kanya. Kaya nakinig sa kanya ang mga anak ni Israel[b] at ginawa nila ang iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinuspos ng Espiritu ng karunungan.” Maaaring unawain ang Hebreo sa pangkalahatan bilang espiritu ng karunungan o, nang mas tiyak, bilang kapangyarihang ipinagkaloob ng Diyos.
    reason: alternative_reading
  - marker: b
    text: O “mga Israelita.” Literal na “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: puspos ng espiritu ng karunungan
  rationale: Likas at marangal sa Tagalog ang “puspos ng” para sa katayuang inilalarawan ng מָלֵא. Pinananatili ng “espiritu ng karunungan” ang Hebreong parirala nang hindi tiyak na ipinapakahulugang ito ay tuwirang katawagan sa Banal na Espiritu.
- source_word: רוּחַ
  choice: espiritu
  rationale: Sa kontekstong ito, tumutukoy ito sa espiritung nagbibigay o nagkakaloob ng karunungan. Ang maliit na titik ay nagpapanatili sa posibilidad ng pagkilos ng Diyos nang hindi nilulutas ang tunay na kalabuan ng Hebreo.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: ipinatong ... sa kanya ang kanyang mga kamay
  rationale: Malinaw nitong ipinahahayag ang pormal na pagkilos ng pagpapatong ng mga kamay at pinananatili ang maramihang יָדָיו, “kanyang mga kamay.”
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: nakinig sa kanya
  rationale: Ang שׁמע na may אֶל ay nangangahulugang makinig at maaaring magpahiwatig ng pagsunod. Pinananatili ng salin ang pangunahing diwa, habang tahasang ipinakikita ng kasunod na sugnay ang pagsunod.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pampamilyang wikang tipan ng Hebreo. Sa natural na Tagalog, ang “mga anak” ay maaaring tumukoy sa mga inapo bilang isang bayan nang hindi kinakailangang ipilit ang eksklusibong kasariang panlalaki.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ginawa nila ang iniutos ni Yahweh kay Moises
  rationale: Natural na modernong Tagalog ito at malinaw na nagsasaad na tumalima ang Israel sa utos na ibinigay ni Yahweh kay Moises.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Kung ang רוּחַ sa “espiritu ng karunungan” ay tahasang tumutukoy sa Banal na Espiritu
  choice: “espiritu ng karunungan,” na maliit ang titik
  alternative: “Espiritu ng karunungan,” bilang tahasang pagtukoy sa Banal na Espiritu
  rationale: Ipinakikita ng konteksto ang pagkakaloob ng kakayahan kay Josue, ngunit hindi ipinipilit ng Hebreong parirala ang tiyak na pagkakakilanlan. Pinananatili ng maliit na titik ang teolohikal na tensiyon.
- issue: Kung paano isasalin ang pampamilyang tawag na בְּנֵי יִשְׂרָאֵל
  choice: “mga anak ni Israel”
  alternative: “mga Israelita”
  rationale: Pinananatili ng napiling salin ang larawan ng Israel bilang pinagmulang ama at ng bayan bilang kanyang mga inapo; ipinapaliwanag sa talababa ang mas tuwirang kolektibong katumbas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Josue,” ang karaniwang anyong Tagalog ng pangalan; pinanatili ang “Yahweh” bilang banal na pangalan. Ang ayos ng pangungusap ay malapit sa Hebreo ngunit inayos upang maging likas sa Tagalog.
