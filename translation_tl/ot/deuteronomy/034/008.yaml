base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/008.yaml
  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: tl
  text: At iniyakan ng mga anak ni Israel si Moises sa kapatagan ng Moab sa loob ng tatlumpung araw. Pagkatapos, natapos ang mga araw ng pagtangis[a] sa pagluluksa para kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “natapos ang mga araw ng pagtangis ng pagluluksa para kay Moises.”'
    reason: Ipinakikita ng alternatibo ang mas mahigpit na pagkakaugnay ng Hebreong יְמֵי בְכִי אֵבֶל מֹשֶׁה nang hindi ipinahihiwatig na si Moises mismo ang nagluluksa.
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: iniyakan
  rationale: Ang בכה ay tumutukoy sa pag-iyak o pagtangis. Likas sa Filipino ang pandiwang “iniyakan” kapag ang tinutukoy ay ang taong namatay na ipinagdadalamhati.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang kongkretong Hebreong pariralang “mga anak ni Israel” sa paraang malinaw at dignidad sa modernong Tagalog.
- source_word: אֶת מֹשֶׁה
  choice: si Moises
  rationale: Ang object marker na אֶת ay hindi tuwirang isinasalin; sa pandiwang Filipino na “iniyakan,” natural na markahan ang personal na layon sa pamamagitan ng “si.”
- source_word: בְּעַרְבֹת מוֹאָב
  choice: sa kapatagan ng Moab
  rationale: Ang עַרְבוֹת ay kapatagan o stepang lupain; “kapatagan ng Moab” ang malinaw at nakagawiang heograpikong salin.
- source_word: שְׁלֹשִׁים יוֹם
  choice: nang tatlumpung araw
  rationale: Tuwirang ipinapahayag ang tagal ng kanilang pag-iyak sa natural na anyong Filipino.
- source_word: וַיִּתְּמוּ
  choice: natapos
  rationale: Ipinahihiwatig ng תם na ang itinakdang panahon ay sumapit sa katapusan o naging ganap; “natapos” ang pinakanatural na katumbas sa konteksto.
- source_word: יְמֵי בְכִי
  choice: mga araw ng pagtangis
  rationale: Ang construct chain ay tumutukoy sa panahong inilaan sa pag-iyak; “pagtangis” ay dignidad at malinaw na pangngalang kaugnay ng pagdadalamhati.
- source_word: אֵבֶל מֹשֶׁה
  choice: pagluluksa para kay Moises
  rationale: Bagaman literal na “pagluluksa ni Moises,” sa konteksto ang construct relation ay tumutukoy sa pagluluksa dahil sa kaniyang kamatayan. Iniiwasan ng natural na Filipino ang maling pahiwatig na si Moises mismo ang nagluluksa.
