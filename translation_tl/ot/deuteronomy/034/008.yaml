  terminology: Ang “Moises,” “mga anak ni Israel,” “kapatagan ng Moab,” “pagtangis,” at “pagluluksa” ay angkop sa register at tapat sa mahahalagang termino. Ang “para kay Moises” ay kinakailangan upang maiwasan ang maling kahulugang si Moises mismo ang nagluluksa.
