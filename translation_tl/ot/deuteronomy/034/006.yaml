  text: וַ/יִּקְבֹּ֨ר אֹת֤/וֹ בַ/גַּיְ֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב מ֖וּל בֵּ֣ית פְּע֑וֹר וְ/לֹֽא יָדַ֥ע אִישׁ֙ אֶת קְבֻ֣רָת֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: tl
  text: At inilibing niya siya sa lambak sa lupain ng Moab[a], sa tapat ng Bet-peor, at walang nakaaalam[b] sa libingan niya hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi pinangalanan sa talatang ito ang simuno ng “inilibing”; ipinahihiwatig ng naunang konteksto na ang PANGINOON ang simuno.
    reason: alternative_reading
  - marker: b
    text: 'Literal na Hebreo: “walang taong nakaaalam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: At inilibing niya siya
  rationale: Aktibong Qal na ikatlong panauhang panlalaking isahan ang pandiwa. Hindi tahasang pinangalanan sa talata ang gumagawa, kaya pinanatili ang panghalip na “niya” sa halip na idagdag ang “PANGINOON” o gawing balintiyak.
- source_word: בַגַּיְ
  choice: sa lambak
  rationale: Ang גַּיְ ay tumutukoy sa lambak o bangin; ang “lambak” ang mas natural at madaling maunawaan sa modernong Tagalog.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: sa lupain ng Moab
  rationale: Pinananatili nito ang kongkretong Hebreong pariralang “lupain ng Moab” nang hindi pinaikli sa “sa Moab.”
- source_word: מוּל
  choice: sa tapat ng
  rationale: Likas na ipinahahayag nito ang posisyong kaharap o katapat ng isang lugar.
- source_word: בֵּית פְּעוֹר
  choice: Bet-peor
  rationale: Isinalin-titik ang pangalan ng lugar ayon sa karaniwang anyong Filipino, sa halip na isalin ang mga bahagi ng pangalan.
- source_word: וְלֹא יָדַע אִישׁ
  choice: at walang nakaaalam
  rationale: Bagaman literal na ginagamit ng Hebreo ang אִישׁ (“tao/lalaki”) sa pangkalahatang diwa, ang “walang nakaaalam” ang natural at tumpak na modernong Tagalog para sa inklusibong kahulugan nito.
- source_word: קְבֻרָתוֹ
  choice: sa libingan niya
  rationale: Sa konteksto, tumutukoy ang pangngalan sa lugar ng pagkakalibing, kaya malinaw na naihahayag ito ng “libingan.”
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Direkta at natural nitong pinananatili ang patuloy na temporal na diwa mula sa pananaw ng tagapagsalaysay.
theological_decisions:
- issue: Pagkakakilanlan ng simuno ng “inilibing niya”
  choice: Pinanatili sa pangunahing teksto ang di-tahasang “niya,” na hindi pinangalanan ang simuno.
  alternative: Tahasang sabihing “Inilibing siya ng PANGINOON,” batay sa naunang talata, o isalin nang balintiyak na “inilibing siya.”
  rationale: Mahigpit na ipinahihiwatig ng talata 5 na ang PANGINOON ang simuno, ngunit hindi Siya tahasang pinangalanan sa talata 6. Pinananatili ng salin ang gramatikal na puwang na ito at ipinaliliwanag sa talababa ang konteksto.
- issue: Pangkalahatang panlalaking אִישׁ
  choice: Isinalin bilang “walang nakaaalam.”
  alternative: “Walang tao ang nakaaalam” o ang mas literal ngunit hindi likas na “walang lalaki ang nakaaalam.”
  rationale: May pangkalahatan at inklusibong gamit dito ang אִישׁ. Ang “walang nakaaalam” ay natural sa kasalukuyang Tagalog at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang aktibong anyo at ang hindi tahasang pagkakakilanlan ng simuno; ginamit ang natural na inklusibong pariralang “walang nakaaalam.”
