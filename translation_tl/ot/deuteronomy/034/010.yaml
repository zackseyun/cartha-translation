base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: tl
  text: At wala nang lumitaw na propeta sa Israel na tulad ni Moises[a], na kilala ni Yahweh nang mukhaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “pa”; maaaring ipahiwatig ng salitang Hebreo na mula noon ay wala pang lumitaw sa Israel na propetang tulad ni Moises.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: At wala
  rationale: Ipinagpapatuloy ng pangatnig at pagtanggi ang pangwakas na salaysay; natural sa Tagalog ang “At wala” nang hindi nagdaragdag ng di-hayag na pagsalungat.
- source_word: קָם
  choice: lumitaw
  rationale: Sa kontekstong ito, tumutukoy ang קום sa paglitaw o pagbangon ng isang propeta. Ang “lumitaw” ay malinaw at likas sa modernong Tagalog.
- source_word: נָבִיא
  choice: propeta
  rationale: Ito ang karaniwan at malinaw na katumbas ng נָבִיא.
- source_word: עוֹד
  choice: nang
  rationale: Sa pariralang “wala nang lumitaw,” ipinahihiwatig ng “nang” na walang sumunod na propetang maihahambing kay Moises mula noon hanggang sa pananaw ng tagapagsalaysay.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Tuwirang ipinapahayag nito ang saklaw kung saan walang lumitaw na gayong propeta.
- source_word: כְּמֹשֶׁה
  choice: na tulad ni Moises
  rationale: Pinananatili nito ang payak na paghahambing na ipinahahayag ng כ.
- source_word: אֲשֶׁר יְדָעוֹ יְהוָה
  choice: na kilala ni Yahweh
  rationale: Si Moises ang layon ng pandiwang ידע at si Yahweh ang simuno. Ang “kilala” ay natural sa Tagalog at hindi nililimitahan ang relational na diwa sa intelektuwal na kaalaman lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: פָּנִים אֶל פָּנִים
  choice: nang mukhaan
  rationale: Pinananatili nito ang kongkretong larawang Hebreo at ang diwa ng tuwirang pakikipag-ugnayan, nang hindi ito ginagawang abstraktong paliwanag.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa ugnayan ni Yahweh kay Moises
  choice: Panatilihin ang idyomang “nang mukhaan”
  alternative: “nang personal” o “nang tuwiran”
  rationale: Ang Hebreo ay gumagamit ng kongkreto at relational na larawan. Pinananatili ng salin ang natatanging pagiging tuwiran ng ugnayan at pahayag nang hindi nagpapasya kung paano eksaktong uunawain ang wika tungkol sa mukha ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “wala nang lumitaw” bilang likas na pagsasalin ng retrospektibong pahayag, at “nang mukhaan” upang mapanatili ang larawan at teolohikal na tensiyon ng orihinal.
