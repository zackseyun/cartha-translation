  text: and the Negev[a], and the plain, the valley of Jericho, the city of palm trees[b], as far as Zoar.
translation:
  language: tl
  text: at ang Negev[a], at ang kapatagan, ang malawak na lambak ng Jerico[b], ang lunsod ng mga palma, hanggang sa Zoar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang timog.” Maaaring tumukoy ang salitang Hebreo sa rehiyong Negev o sa timog bilang direksiyon o bahaging heograpiko.
    reason: lexical_alternative
  - marker: b
    text: O “ang kapatagan ng Jerico.” Ang salitang Hebreo ay tumutukoy sa isang malawak na lambak o kapatagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: ang Negev
  rationale: Sa talaan ng mga lupaing ipinakita kay Moises, tumutukoy ito sa kilalang rehiyon sa timog; pinanatili ang pangalang heograpiko sa halip na gawing pangkalahatang “timog.”
- source_word: הַכִּכָּר
  choice: ang Kapatagan
  rationale: Sa gamit na heograpiko, tumutukoy ito sa malawak na kapatagan o distrito sa Libis ng Jordan. Ginamit ang malaking titik bilang katawagang panrehiyon.
- source_word: בִּקְעַת יְרֵחוֹ
  choice: ang malawak na lambak ng Jerico
  rationale: Ang בִּקְעָה ay malapad at bukás na lambak o kapatagan. Ang “malawak na lambak” ay likas sa Filipino at naiiba sa naunang “Kapatagan” nang hindi nawawala ang anyong heograpiko.
- source_word: עִיר הַתְּמָרִים
  choice: ang lunsod ng mga puno ng palma
  rationale: Pinananatili ang literal na larawan at ang katawagan sa Jerico.
- source_word: עַד צֹעַר
  choice: hanggang sa Zoar
  rationale: Malinaw na ipinahihiwatig ng עַד ang hangganan o lawak na umaabot sa Zoar.
- source_word: וְאֶת ... וְאֶת
  choice: at ... at
  rationale: Pinananatili ang pinagsama-samang ayos ng talaan habang inaalis sa salin ang di-naisasaling pantukoy sa tuwirang layon.
