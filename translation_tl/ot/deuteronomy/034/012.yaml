  text: וּ/לְ/כֹל֙ הַ/יָּ֣ד הַ/חֲזָקָ֔ה וּ/לְ/כֹ֖ל הַ/מּוֹרָ֣א הַ/גָּד֑וֹל אֲשֶׁר֙ עָשָׂ֣ה מֹשֶׁ֔ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: tl
  text: at sa lahat ng makapangyarihang gawa[a] at sa lahat ng dakilang gawaing kasindak-sindak[b] na ginawa ni Moises sa harap ng buong Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “malakas na kamay” o “makapangyarihang kamay.” Ang “kamay” ay maaaring tumukoy sa kapangyarihang kumikilos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “dakilang sindak” o “mga dakilang gawaing pumupukaw ng takot at pagkamangha.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa harap ng mga mata ng buong Israel,” ibig sabihin, hayagan at nasaksihan ng buong bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל
  choice: at sa lahat ng
  rationale: Ipinagpapatuloy nito ang pangungusap mula sa naunang talata at pinananatili ang malawak na saklaw ng כֹל.
- source_word: הַיָּד הַחֲזָקָה
  choice: makapangyarihang gawa
  rationale: Literal itong “malakas na kamay,” ngunit ang “kamay” ay idyomang Hebreo para sa kapangyarihang kumikilos. Ang “makapangyarihang gawa” ay likas sa Tagalog at akma sa mga ginawa ni Moises, habang inilalagay sa talababa ang kongkretong larawan ng orihinal.
- source_word: הַמּוֹרָא הַגָּדוֹל
  choice: dakilang gawaing kasindak-sindak
  rationale: Maaaring tumukoy ang מוֹרָא sa sindak, takot, o bagay na pumupukaw ng matinding pagkamangha. Pinananatili ng “kasindak-sindak” ang masidhing puwersa nang hindi nililimitahan ang kahulugan sa damdamin lamang.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa
  rationale: Tuwirang katumbas ito ng malawak na pandiwang עָשָׂה at natural na tumutukoy sa dalawang naunang parirala.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalan sa Tagalog.
- source_word: לְעֵינֵי
  choice: sa harap ng
  rationale: Ang literal na “sa mga mata ng” ay isang idyoma para sa hayag na pagkilos sa paningin ng iba. Natural sa Tagalog ang “sa harap ng,” habang nililinaw sa talababa ang diwa ng pampublikong pagkakasaksi.
- source_word: כָּל יִשְׂרָאֵל
  choice: buong Israel
  rationale: Pinananatili nito ang kolektibo at pambansang saklaw ng parirala.
theological_decisions:
- issue: Likas ng mga gawa ni Moises sa pangwakas na papuri
  choice: Ilarawan ang mga ito bilang makapangyarihan at kasindak-sindak na mga gawa na hayagang ginawa ni Moises.
  alternative: Panatilihin nang lubos na literal ang “malakas na kamay” at “dakilang sindak.”
  rationale: Ibinubuod ng talata ang pambihirang mga ginawa ni Moises na nasaksihan ng Israel. Hindi idinaragdag ng salin kung si Moises ang bukal ng kapangyarihan o kung paano nauugnay ang mga gawa sa pagkilos ng Diyos; pinananatili nito ang tuwirang pahayag at tensiyon ng tekstong Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang mga idyomatikong pariralang “makapangyarihang gawa” at “sa harap ng” para sa likas na daloy, ngunit pinanatili sa mga talababa ang kongkretong larawan at leksikal na lawak ng Hebreo.
