  yaml_path: translation/ot/deuteronomy/034/002.yaml
  text: and all Naphtali[a], and the land of Ephraim and Manasseh, and all the land of Judah as far as the western sea,
translation:
  language: tl
  text: at ang buong lupain ng Neftali, ang lupain ng Efraim at Manases, at ang buong lupain ng Juda hanggang sa dagat sa kanluran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na nangangahulugang, “ang huling dagat” o “ang dagat sa likuran.” Isa itong Hebreong paraan ng pagtukoy sa dagat na nasa kanluran—ang Dagat Mediteraneo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: ang buong lupain ng Neftali
  rationale: Ang כָּל kasama ng pangalan ng lipi ay tumutukoy rito sa kabuuan ng nasasakupan nito. Idinagdag ang “lupain” upang maging malinaw at natural sa Filipino ang heograpikong talaan.
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: ang lupain ng Efraim at Manases
  rationale: Ang אֶרֶץ ay “lupain” o “nasasakupan,” at ang dalawang pangalan ng lipi ay pinagsama bilang isang heograpikong parirala.
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: ang buong lupain ng Juda
  rationale: Pinananatili ang tahasang אֶרֶץ bilang “lupain” at ang כָּל bilang “buong” upang maipahayag ang kabuuang heograpikong saklaw.
- source_word: עַד
  choice: hanggang sa
  rationale: Sa paglalarawan ng tanaw o hangganan, ipinahihiwatig ng עַד ang abot ng lugar; natural itong ipinapahayag sa Filipino bilang “hanggang sa.”
- source_word: הַיָּם הָאַחֲרוֹן
  choice: ang dagat sa kanluran
  rationale: Literal itong “huling dagat” o “dagat sa likuran,” ngunit isa itong Hebreong paraang panturo sa dagat na nasa kanluran. Malinaw ang “dagat sa kanluran” nang hindi inilalagay sa pangunahing teksto ang mas tiyak na pangalang “Dagat Mediteraneo.”
