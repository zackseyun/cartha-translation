  source_fidelity: 'Tumpak na naisasalin ang lahat ng pangunahing sangkap ng Hebreo: ang sunod-sunod na salaysay ng וַיָּמָת, ang deiktikong שָׁם sa “roon,” ang marangal na titulong עֶבֶד יְהוָה bilang “ang lingkod ni Yahweh,” ang tahasang “lupain ng Moab,” at ang idyomang עַל־פִּי יְהוָה bilang “ayon sa salita ni Yahweh.”'
  naturalness: Malinaw, marangal, at natural sa modernong Filipino Tagalog ang pangungusap. Ang “Kaya namatay roon si Moises” ay katanggap-tanggap na pag-uugnay sa naunang salaysay, at ang ayos ng mga parirala ay angkop sa pampublikong pagbasa.
  terminology: Ang “Moises,” “lingkod,” “Yahweh,” at “lupain ng Moab” ay pare-pareho, wasto, at angkop sa rehistro. Ang “ayon sa salita ni Yahweh” ay maingat na idyomatikong pagsasalin na hindi naglilimita sa kahulugan sa “utos” lamang. Maayos na pinananatili ng talababa ang literal at alternatibong salin.
