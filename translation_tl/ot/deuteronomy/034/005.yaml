id: DEU.34.5
reference: Deuteronomy 34:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֨מָת שָׁ֜ם מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה בְּ/אֶ֥רֶץ מוֹאָ֖ב עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: tl
  text: Kaya namatay roon si Moises, ang lingkod ni Yahweh, sa lupain ng Moab, ayon sa salita ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “sa bibig ni Yahweh”; maaari ring isaling “sa utos ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kaya namatay
  rationale: Ang wayyiqtol ng מות ay nagsasalaysay ng kasunod na pangyayari. Likas sa Tagalog ang “Kaya namatay” upang iugnay ito sa naunang salaysay habang pinananatili ang pangunahing diwang “namatay.”
- source_word: שָׁם
  choice: roon
  rationale: Pang-abay ito ng lugar na tumutukoy sa pook na kababanggit lamang; “roon” ang natural na deiktikong katumbas.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalan sa modernong Tagalog.
- source_word: עֶבֶד יְהוָה
  choice: ang lingkod ni Yahweh
  rationale: Bagaman maaaring mangahulugang alipin ang עֶבֶד, dito ay marangal na titulong nagpapahayag ng paglilingkod at natatanging kaugnayan ni Moises kay Yahweh. Ang “lingkod” ang angkop at likas na salin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: sa lupain ng Moab
  rationale: Tahasan sa Hebreo ang “lupain,” kaya pinananatili ito upang maipakita ang heograpikong diin.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Literal itong “sa ibabaw ng bibig ni Yahweh,” isang idyomang nagsasaad ng pagkamatay alinsunod sa salita o utos ni Yahweh. Pinananatili ng “ayon sa salita” ang kaugnayan sa bibig/salita nang natural sa Tagalog, habang inilalahad sa talababa ang literal at alternatibong salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon na hindi pinapalitan ang pangalan ng titulong “PANGINOON.”
- issue: Diwa ng עֶבֶד sa titulo ni Moises
  choice: lingkod
  alternative: alipin
  rationale: Sa kontekstong ito, marangal na titulo ang parirala at hindi pangunahing binibigyang-diin ang kalagayang pagkaalipin. Maiiba ang diin kung “alipin” ang gagamitin.
- issue: Diwa ng עַל פִּי יְהוָה
  choice: ayon sa salita ni Yahweh
  alternative: sa utos ni Yahweh; literal, sa bibig ni Yahweh
  rationale: Idyomatiko ang parirala at maaaring tukuyin ang salita o utos ni Yahweh. Hindi pinipili ng pangunahing salin ang mas makitid na “utos” bilang tanging posibleng diwa; pinananatili sa talababa ang tunay na saklaw ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “roon” sa halip na “doon” bilang bahagyang mas pormal na anyo, at “lupain” upang mapanatili ang tahasang heograpikong pahayag ng Hebreo. Nasa pangunahing teksto ang marker na [a].
