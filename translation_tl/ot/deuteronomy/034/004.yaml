source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו זֹ֤את הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶ֑נָּ/ה הֶרְאִיתִ֣י/ךָ בְ/עֵינֶ֔י/ךָ וְ/שָׁ֖מָּ/ה לֹ֥א תַעֲבֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: tl
  text: At sinabi ni Yahweh sa kanya, “Ito ang lupain na ipinangako ko nang may panunumpa kina Abraham, Isaac, at Jacob. Sinabi ko, ‘Ibibigay ko ito sa iyong supling[a].’ Ipinatanaw ko sa iyo ito gamit ang sarili mong mga mata, ngunit hindi ka tatawid papunta roon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binhi.” Isahan ang anyo ng salitang Hebreo ngunit ginagamit itong pangngalang kolektibo para sa mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal at tipanang pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: זֹאת הָאָרֶץ
  choice: Ito ang lupain
  rationale: Ang “lupain” ay natural sa modernong Tagalog at tumutukoy sa lupaing saklaw ng pangako, hindi lamang sa lupa sa pangkalahatan.
- source_word: נִשְׁבַּעְתִּי
  choice: ipinangako ko nang may panunumpa
  rationale: Iniiwasan ang “isinumpa ko,” na sa kasalukuyang Tagalog ay karaniwang nangangahulugang isinailalim sa sumpa; malinaw namang pinananatili ng parirala ang diwa ng taimtim na panunumpa.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kina Abraham, Isaac, at Jacob
  rationale: Ang pang-ukol na “kina” ay likas na Tagalog para sa maramihang pangalang pantangi at saklaw nito ang tatlong pinagbigyan ng pangako.
- source_word: לֵאמֹר
  choice: Sinabi ko
  rationale: Likas na ipinakikilala nito sa Tagalog ang mismong nilalaman ng panunumpa nang hindi ginagawang mabigat ang pangungusap.
- source_word: לְזַרְעֲךָ
  choice: sa iyong lahi
  rationale: Ang “lahi” ay nababasa bilang kolektibo at angkop sa pangako tungkol sa mga magmumula sa mga patriyarka, habang hindi ipinipilit sa pangunahing teksto ang tahasang maramihang “mga inapo.”
- source_word: אֶתְּנֶנָּה
  choice: Ibibigay ko ito
  rationale: Malinaw at natural na naghahayag ng ipinangakong pagkilos sa hinaharap.
- source_word: הֶרְאִיתִיךָ
  choice: Hinayaan kitang makita ito
  rationale: 'Pinananatili ang causative na anyo ng pandiwa: pinangyari o ipinahintulot ni Yahweh na makita ni Moises ang lupain.'
- source_word: בְּעֵינֶיךָ
  choice: ng sarili mong mga mata
  rationale: Natural na idyomang Tagalog na nagdiriin sa tuwiran at personal na pagkakita.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: ngunit hindi ka tatawid papunta roon
  rationale: Pinananatili ng “tatawid” ang larawang heograpiko ng pagtawid tungo sa lupain; ipinahahayag ng “ngunit” ang malinaw na kaibahan sa pagitan ng pagkakita at hindi pagpasok.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tuwirang ginagamit ng tekstong Hebreo; pinananatili ito sa halip na palitan ng isang titulo.
- issue: Kolektibong kahulugan ng זֶרַע sa pangako sa mga patriyarka
  choice: lahi
  alternative: mga inapo; binhi
  rationale: Pinananatili ng “lahi” ang kolektibong saklaw nang hindi tahasang nilulutas bilang gramatikal na maramihan ang anyong isahan sa Hebreo. Itinatala sa talababa ang mas literal na “binhi.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinangako… nang may panunumpa” upang mapanatili ang lakas ng Hebreo nang maiwasan ang mapanlinlang na kahulugan ng “isinumpa.”
