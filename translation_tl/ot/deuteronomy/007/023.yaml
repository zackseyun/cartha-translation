  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: tl
  text: Ngunit ibibigay sila ni Yahweh na iyong Diyos sa iyong kapangyarihan[a], at magdudulot siya sa kanila ng matinding kaguluhan[b] hanggang sa malipol sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa harap mo.” Sa kontekstong ito, nangangahulugan ang parirala na ilalagay ni Yahweh ang mga kaaway sa iyong kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “matinding sindak” o “matinding pagkakagulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם ... לְפָנֶיךָ
  choice: ibibigay sila ... sa iyong kapangyarihan
  rationale: Sa kontekstong pandigma, ang pagbibigay ng mga kaaway ‘sa harap mo’ ay nangangahulugang ipailalim sila sa kapangyarihan ng Israel. Likas sa modernong Tagalog ang saling ito, habang nasa talababa ang literal na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang ipinapahayag ng anyong Hebreo ang ‘iyong Diyos’ sa ikalawang panauhang panlalaking isahan.
- source_word: וְהָמָם מְהוּמָה גְדֹלָה
  choice: ilalagay niya sila sa matinding kaguluhan
  rationale: Ipinahihiwatig ng pandiwa at kaugnay na pangngalan ang paglikha ng pagkalito, sindak, at pagkakawatak-watak, lalo na sa labanan. Pinananatili ng ‘matinding kaguluhan’ ang lawak ng kahulugan nang hindi pumipili lamang sa emosyonal na diwa ng ‘sindak.’
- source_word: עַד הִשָּׁמְדָם
  choice: hanggang sa malipol sila
  rationale: Malinaw at likas na ipinapahayag nito ang hangganan ng pagkilos at ang pasibo o resultang diwa ng pagkawasak nila.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton na יְהוָה. Pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang ‘sa iyong kapangyarihan’ upang likas na maipahayag ang idyomang militar, at pinanatili sa talababa ang literal na anyo. Ang ‘matinding kaguluhan’ ay sadyang malawak upang mapanatili ang saklaw na pagkalito, sindak, at kaguluhan ng salitang Hebreo.
