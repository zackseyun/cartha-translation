revisions:
- from: Ngunit ibibigay sila ni Yahweh na iyong Diyos sa iyong kapangyarihan[a], at ilalagay niya sila sa matinding kaguluhan[b] hanggang sa malipol sila.
  to: Ngunit ibibigay sila ni Yahweh na iyong Diyos sa iyong kapangyarihan[a], at magdudulot siya sa kanila ng matinding kaguluhan[b] hanggang sa malipol sila.
  rationale: Pinalitan ang hindi gaanong likas na “ilalagay niya sila sa matinding kaguluhan” ng “magdudulot siya sa kanila ng matinding kaguluhan.” Pinananatili nito ang causative na kilos ni Yahweh at ang malawak na diwa ng מְהוּמָה, habang mas natural sa modernong Filipino. Inayos din ang panghalip sa talababa a mula “kapangyarihan ng Israel” tungo sa “iyong kapangyarihan,” upang manatiling malapit sa ikalawang panauhang isahan ng teksto.
