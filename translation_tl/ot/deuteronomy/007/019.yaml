source:
  edition: WLC
  text: הַ/מַּסֹּ֨ת הַ/גְּדֹלֹ֜ת אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וְ/הָ/אֹתֹ֤ת וְ/הַ/מֹּֽפְתִים֙ וְ/הַ/יָּ֤ד הַ/חֲזָקָה֙ וְ/הַ/זְּרֹ֣עַ הַ/נְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ כֵּֽן יַעֲשֶׂ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/כָל הָ֣/עַמִּ֔ים אֲשֶׁר אַתָּ֥ה יָרֵ֖א מִ/פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: tl
  text: ang matitinding pagsubok na nakita ng sarili mong mga mata[a], ang mga tanda at mga kababalaghan, ang makapangyarihang kamay at ang nakaunat na bisig na ginamit ni Yahweh na iyong Diyos upang ilabas ka. Ganoon din ang gagawin ni Yahweh na iyong Diyos sa lahat ng mga bayan[b] na kinatatakutan mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malalaking pagsubok.” Ang salitang Hebreo ay maaaring tumukoy sa matitinding pagsubok o mga pagtitesting.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga bansa.” Mas tuwirang katumbas ng Hebreo ang “mga bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: ang matitinding pagsubok
  rationale: Ang מַסּוֹת ay tumutukoy sa mga pagsubok o matitinding karanasan, hindi sa pang-aakit na magkasala. Ipinahahayag ng “matitindi” ang lakas ng הַגְּדֹלֹת sa natural na Tagalog.
- source_word: רָאוּ עֵינֶיךָ
  choice: nakita ng sarili mong mga mata
  rationale: Pinananatili ang tahasang pagbanggit sa “mga mata” at ang diin sa personal na nasaksihan, habang gumagamit ng likas na idyomang Tagalog.
- source_word: הָאֹתֹת וְהַמֹּפְתִים
  choice: ang mga tanda at mga kababalaghan
  rationale: Ang “mga tanda” ay tuwirang katumbas ng אֹתוֹת, at ang “mga kababalaghan” ay nagpapanatili sa diwa ng mga pambihirang gawang pumupukaw ng pagkamangha sa מֹפְתִים.
- source_word: הַיָּד הַחֲזָקָה
  choice: ang makapangyarihang kamay
  rationale: Pinananatili nito ang metapora ng makapangyarihang pagkilos ng Diyos sa malinaw at dignified na modernong Tagalog.
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: ang nakaunat na bisig
  rationale: Tapat ito sa nakaugaliang Hebreong larawan ng aktibong kapangyarihan sa pagliligtas at paghatol.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: na ginamit ... upang ilabas ka
  rationale: Likas na iniuugnay ng parirala ang kamay at bisig sa paraan ng pagliligtas, at pinananatili ang Hiphil na diwa ng pagpapalabas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כֵּן יַעֲשֶׂה
  choice: Ganoon din ang gagawin
  rationale: 'Malinaw na ipinapakita ang paghahambing: kung ano ang ginawa ni Yahweh noon ay gagawin din niya sa mga bayang kinatatakutan ng Israel.'
- source_word: לְכָל הָעַמִּים
  choice: sa lahat ng mga bayan
  rationale: Ang “mga bayan” ay natural na salin ng plural na עַמִּים at hindi ito awtomatikong pinapakahulugang mga estadong pampolitika.
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: na kinatatakutan mo
  rationale: Natural na Tagalog ito para sa Hebreong idyoma ng pagkatakot sa harap o presensiya nila, nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang tekstong Hebreo ay gumagamit ng Tetragrammaton bilang personal na pangalan. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng mga gawa sa Exodo at ng gagawin sa mga bayan
  choice: Ganoon din ang gagawin
  alternative: Gayundin niyang lilipulin
  rationale: Hindi tahasang inuulit ng talata ang isang tiyak na pandiwang gaya ng “lilipulin”; pinananatili ng salin ang mas bukas na יַעֲשֶׂה at ang paghahambing sa naunang mga gawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa publikong pagbasa. Pinanatili ang mga Hebreong larawang “kamay” at “bisig,” ngunit inayos ang pangungusap upang maging natural sa Tagalog. Ang simula ay nasa maliit na titik sapagkat ipinagpapatuloy ng talata ang kayariang pangungusap mula sa naunang konteksto.
