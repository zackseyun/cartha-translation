revisions:
- from: At kapag ibinigay sila sa harap mo ni Yahweh na iyong Diyos at pinabagsak mo sila, lubos mo silang italaga sa pagkapuksa[a]. Huwag kang makipagtipan sa kanila o magpakita sa kanila ng anumang pabor[b].
  to: Kapag ibinigay sila ni Yahweh na iyong Diyos sa harap mo at pababagsakin mo sila, lubos mo silang italaga sa pagkapuksa[a]. Huwag kang makipagtipan sa kanila o magpakita sa kanila ng anumang pabor[b].
  rationale: Inayos ang ayos ng unang sugnay upang malinaw na si Yahweh ang tagaganap ng pagbibigay at upang maging natural sa modernong Filipino. Pinalitan ang nakaraang "pinabagsak mo" ng "pababagsakin mo" upang tumugma sa kondisyonal at sunod-sunod na utos ng Hebreo. Hindi binago ang pagpapahayag ng ḥerem, ang pagbabawal sa tipan, o ang kahulugan ng pagbabawal sa pagpapakita ng pabor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:53:48Z'
