base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: tl
  text: Kapag ibinigay sila ni Yahweh na iyong Diyos sa harap mo at pababagsakin mo sila, lubos mo silang italaga sa pagkapuksa[a]. Huwag kang makipagtipan sa kanila o magpakita sa kanila ng anumang pabor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lubos mo silang lipulin,” o “ilagay mo sila nang lubusan sa ilalim ng pagbabawal.” Gumagamit ang Hebreo ng pinatinding anyo ng pandiwang חרם, na tumutukoy sa ganap na pagtatalaga sa pagkapuksa.
    reason: lexical_alternative
  - marker: b
    text: O, “huwag mo silang kaawaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: ibinigay sila
  rationale: Sa kontekstong militar, ang נתן ay nangangahulugang ibigay o ipasa ang isang bayan sa kapangyarihan ng iba. Pinananatili ng “ibinigay sila” ang tahasang pagkilos ng Diyos nang hindi idinaragdag ang larawang “sa iyong kamay,” na wala sa parirala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Tuwirang pinananatili ang Hebreong idyoma, na sa konteksto ay tumutukoy sa paglalagay sa mga bansang iyon sa harap ng Israel upang lupigin.
- source_word: וְהִכִּיתָם
  choice: pinabagsak mo sila
  rationale: Ang נכה sa digmaan ay tumutukoy sa pananakit o paggapi. Ipinahahayag ng “pinabagsak” ang marahas na diwang militar at mas tiyak ito kaysa sa simpleng “tinalo.”
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: lubos mo silang italaga sa pagkapuksa
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagpapatingkad sa utos. Ang חרם ay hindi lamang karaniwang pagpatay kundi ganap na pagtatalaga sa pagkapuksa; pinananatili ng salin ang kabuuan at sagradong-ligal na diwa nito.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: Huwag kang makipagtipan sa kanila
  rationale: Ang כרת ברית ay nakaugaliang Hebreong parirala para sa paggawa ng tipan. Ang “makipagtipan” ay natural at pinananatili ang pormal na ugnayang ipinagbabawal.
- source_word: וְלֹא תְחָנֵּם
  choice: huwag magpakita sa kanila ng anumang pabor
  rationale: Ang חנן ay pangunahing tumutukoy sa pagpapakita ng pabor o kagandahang-loob. Ang “pabor” ay malapit sa lawak ng salita, samantalang ang “awa” ay isang makatwirang pagbasa ayon sa konteksto at inilagay sa talababa.
theological_decisions:
- issue: Pagpapahayag sa חרם sa konteksto ng banal na digmaan
  choice: lubos mo silang italaga sa pagkapuksa
  alternative: lubos mo silang lipulin; ilagay mo sila nang lubusan sa ilalim ng pagbabawal
  rationale: Pinananatili nito ang kultiko at teolohikal na lakas ng חרם sa halip na gawing karaniwang paglipol lamang, habang nananatiling mauunawaan sa modernong Filipino.
- issue: Pagpapahayag sa תְחָנֵּם
  choice: huwag magpakita sa kanila ng anumang pabor
  alternative: huwag mo silang kaawaan
  rationale: Ang pangunahing diwa ng ugat ay pabor o kagandahang-loob. Gayunman, posible sa kontekstong ito ang “awa,” kaya pinanatili iyon bilang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “makipagtipan” upang mapanatili ang bokabularyong biblikal nang hindi nagiging lipas, at inilagay ang mga pananda ng talababa kaagad sa mga pariralang tinutukoy ng mga ito.
