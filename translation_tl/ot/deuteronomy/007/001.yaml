reference: Deuteronomy 7:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: tl
  text: Kapag dinala ka ni Yahweh, ang iyong Diyos, sa lupain na papasukan mo upang ariin, at pinalayas[a] niya mula sa harap mo ang maraming bansa—ang mga Heteo, Gergeseo, Amoreo, Cananeo, Perezeo, Hivita, at Jebuseo—pitong bansang mas marami at mas makapangyarihan kaysa sa iyo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inalisan niya ng lupain ang maraming bansa sa harap mo.”
    reason: 'Ipinakikita ang alternatibong diwa ng וְנָשַׁל: pagpapaalis sa pamamagitan ng pag-aalis sa dating pag-aari o kinalalagyan.'
  - marker: b
    text: O, “mas malalaki at mas malalakas kaysa sa iyo.”
    reason: Ang רַבִּים ay maaari ring isalin na “mas malalaki” sa diwang “mas dakila” o “mas malawak,” bagaman “mas marami” ang mas tuwirang kahulugan sa kontekstong ito.
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Ipinakikilala nito ang pangyayaring magiging batayan ng mga utos na kasunod; ang temporal na “kapag” ang pinakanatural sa daloy.
- source_word: יְבִיאֲךָ
  choice: dinala ka ... sa
  rationale: 'Pinananatili ang causative na diwa ng Hiphil ng בוא: dadalhin o papapasukin sa isang patutunguhan. Sa sugnay na may “kapag,” natural sa Filipino ang aspektong “dinala.”'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipanang pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang isahan at ang pagkakakilanlang tipanan.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Ang “lupain” ay natural at angkop para sa teritoryong ipinangako sa konteksto ng Deuteronomio.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: papasukan mo
  rationale: Malinaw at likas na Filipino para sa nalalapit na pagpasok ng Israel; hindi na kailangang isalin nang hiwalay ang lokatibong שָׁמָּה dahil taglay na ito ng “papasukan.”
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Ipinahahayag ang aktibong pagkuha at paghawak sa lupain na saklaw ng ירשׁ, nang hindi nililimitahan ito sa diwang legal ng mana.
- source_word: וְנָשַׁל
  choice: pinalayas
  rationale: Ipinahahayag ang pagpapaalis ng mga bansa sa lupain. Inilakip sa talababa ang mas teknikal na diwa ng pag-aalis sa kanilang pag-aari o kinalalagyan.
- source_word: גּוֹיִם רַבִּים
  choice: maraming bansa
  rationale: Tumutukoy sa magkakahiwalay na pangkat-etniko at pampolitikang naninirahan sa Canaan.
- source_word: מִפָּנֶיךָ
  choice: mula sa harap mo
  rationale: Pinananatili ang Hebreong idyoma ng pag-aalis mula sa presensiya o daraanan ng Israel.
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: ang mga Heteo, Gergeseo, Amoreo, Cananeo, Perezeo, Hivita, at Jebuseo
  rationale: Ginamit ang mga pangalang karaniwang nakikilala sa tradisyong Bibliyang Filipino, at ipinahayag bilang mga kolektibong bayan.
- source_word: שִׁבְעָה גוֹיִם
  choice: pitong bansa
  rationale: Buod ito ng pitong pangkat na kapapangalang lahat; pinanatili ang “bansa” para sa pagkakapare-pareho.
- source_word: רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: mas malaki at mas makapangyarihan kaysa sa iyo
  rationale: Pinananatili ang paghahambing at ang posibleng diwa ng lawak o kadakilaan at kapangyarihan; inilagay sa talababa ang alternatibong pagbasa na nakatuon sa dami at lakas.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinanatili itong pangalan sa salin at hindi tahimik na pinalitan ng titulo.
- issue: Isahang pagtukoy sa Israel sa ikalawang panauhan
  choice: ka / mo / iyo
  alternative: kayo / ninyo / inyo
  rationale: Isahan ang mga hulapi at panghalip sa Hebreo, na kumakatawan sa Israel bilang isang sambayanan. Pinanatili ng salin ang mahalagang kolektibong-isahang anyong ito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang kolektibong isahang “ka/mo/iyo” ng Hebreo. Ang kuwit sa hulihan ay sinadyang panatilihin dahil nagpapatuloy ang pangungusap sa kasunod na talata.
