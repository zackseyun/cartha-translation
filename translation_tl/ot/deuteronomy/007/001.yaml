- from: Kapag dinala ka ni Yahweh na iyong Diyos sa lupaing papasukan mo upang angkinin, at pinalayas niya mula sa harap mo[a] ang maraming bansa—ang mga Heteo, Gergeseo, Amoreo, Cananeo, Perezeo, Hivita, at Jebuseo—pitong bansang mas malaki at mas makapangyarihan kaysa sa iyo[b],
  to: Kapag dinala ka ni Yahweh, ang iyong Diyos, sa lupain na papasukan mo upang ariin, at pinalayas[a] niya mula sa harap mo ang maraming bansa—ang mga Heteo, Gergeseo, Amoreo, Cananeo, Perezeo, Hivita, at Jebuseo—pitong bansang mas marami at mas makapangyarihan kaysa sa iyo[b],
