reference: Deuteronomy 7:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּי֩ מֵֽ/אַהֲבַ֨ת יְהוָ֜ה אֶתְ/כֶ֗ם וּ/מִ/שָּׁמְר֤/וּ אֶת הַ/שְּׁבֻעָה֙ אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹ֣תֵי/כֶ֔ם הוֹצִ֧יא יְהוָ֛ה אֶתְ/כֶ֖ם בְּ/יָ֣ד חֲזָקָ֑ה וַֽ/יִּפְדְּ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים מִ/יַּ֖ד פַּרְעֹ֥ה מֶֽלֶךְ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: tl
  text: Kundi dahil iniibig kayo ni Yahweh at dahil tinutupad niya ang panunumpang ginawa niya sa inyong mga ninuno[a], inilabas kayo ni Yahweh sa pamamagitan ng makapangyarihang kamay[b] at tinubos kayo mula sa sambahayan ng mga alipin[c]—mula sa kamay ng Paraon na hari ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga ama,” na tumutukoy dito sa mga patriyarkang pinagmulan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa pamamagitan ng malakas na kamay,” isang karaniwang idyoma para sa makapangyarihang pagliligtas ni Yahweh.
    reason: idiom_explanation
  - marker: c
    text: Sa literal, “mula sa bahay ng mga alipin.” Maaari ring isalin na “mula sa bahay ng pagkaalipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kundi dahil
  rationale: 'Ipinakikita ng כִּי ang dahilan at, kaugnay ng pagtanggi sa naunang talata, ang pagsalungat: hindi dahil sa dami ng Israel, kundi dahil sa pag-ibig ni Yahweh.'
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: dahil iniibig kayo ni Yahweh
  rationale: Likas sa modernong Tagalog ang pandiwang anyo at malinaw nitong naihahayag ang sanhi na ipinakikita ng מִן.
- source_word: וּמִשָּׁמְרוֹ
  choice: at dahil tinutupad niya
  rationale: Ipinahihiwatig ng anyo ang aktibo at patuloy na tapat na pagtupad ni Yahweh sa kanyang panunumpa.
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּע
  choice: ang panunumpang ginawa niya
  rationale: Pinananatili ng “panunumpa” ang taimtim at tipanang diwa ng Hebreo, habang iniiwasan ang di-likas na pag-uulit na “sumpang isinumpa.”
- source_word: לַאֲבֹתֵיכֶם
  choice: sa inyong mga ninuno
  rationale: Ito ang malinaw at natural na katawagan sa modernong Tagalog para sa mga patriyarkang pinagmulan ng Israel; inilalahad sa talababa ang literal na pananalitang “mga ama.”
- source_word: בְּיָד חֲזָקָה
  choice: sa pamamagitan ng makapangyarihang kamay
  rationale: Pinananatili ang larawang “kamay” at malinaw na ipinahahayag ang idyomatikong kahulugan ng makapangyarihang pagliligtas.
- source_word: וַיִּפְדְּךָ
  choice: at tinubos
  rationale: Ang “tinubos” ay nagpapanatili sa diwa ng pagpapalaya o pagtubos mula sa pagkakagapos, hindi lamang pangkalahatang pagsagip.
- source_word: מִבֵּית עֲבָדִים
  choice: mula sa sambahayan ng mga alipin
  rationale: Pinananatili ang kongkretong larawan ng “bahay/sambahayan” at ang tahasang pagtukoy sa mga alipin, habang nauunawaan bilang saklaw o kalagayan ng pagkaalipin.
- source_word: מִיַּד פַּרְעֹה
  choice: mula sa kamay ng Paraon
  rationale: Pinananatili ang paulit-ulit na larawang Hebreo ng “kamay,” dito ay tumutukoy sa kapangyarihan o paghahari ng Paraon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangngalang pantangi ang Tetragrammaton sa teksto; pinananatili ng “Yahweh” ang ipinahayag na tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Pagkilala sa אֲבֹתֵיכֶם
  choice: mga ninuno, na may talababa na literal na “mga ama”
  alternative: mga ama
  rationale: Natural at malinaw sa kasalukuyang Tagalog ang “mga ninuno,” samantalang pinananatili ng talababa ang panlalaking anyo ng Hebreo at ang kaugnayan nito sa mga patriyarka.
- issue: Wika ng pagkaalipin sa עֲבָדִים
  choice: mga alipin
  alternative: pagkaalipin
  rationale: Tahasan at maramihan ang pangngalang Hebreo; mahalaga sa konteksto ng Ehipto ang aktuwal na pagkakagapos ng mga Israelita.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkapares na larawan ng “kamay”: ang makapangyarihang kamay ni Yahweh laban sa kamay o kapangyarihan ng Paraon. Ginamit ang “sambahayan” upang mapanatili ang larawan ng בַּיִת nang hindi ito basta maunawaan bilang isang gusali.'
