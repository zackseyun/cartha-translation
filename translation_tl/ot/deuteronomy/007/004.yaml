base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: tl
  text: Sapagkat ilalayo niya ang iyong anak na lalaki sa pagsunod sa akin, at maglilingkod sila sa ibang mga diyos; kaya mag-aalab ang galit ni Yahweh laban sa inyo, at mabilis niya kayong lilipulin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nagbabago ang Hebreo mula sa isahang “iyong anak na lalaki” tungo sa maramihang “maglilingkod sila.” Maaaring lumawak ang babala mula sa isang anak tungo sa pamilya o sambayanang maaapektuhan.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng dahilan para sa pagbabawal sa naunang talata.
- source_word: יָסִיר
  choice: ilalayo
  rationale: Ang Hiphil ng סור ay sanhiin ang pagtalikod; natural na ipinahahayag ito ng “ilalayo ... sa pagsunod.”
- source_word: בִּנְךָ
  choice: iyong anak na lalaki
  rationale: Panlalaking isahan ang Hebreo at tumutukoy sa anak na lalaki sa agarang konteksto ng pag-aasawa.
- source_word: מֵאַחֲרַי
  choice: sa pagsunod sa akin
  rationale: Ang literal na “mula sa likuran ko” ay idyomang nangangahulugang tumigil sa pagsunod; pinananatili ang unang panauhang pananalita ng Diyos.
- source_word: וְעָבְדוּ
  choice: at maglilingkod sila
  rationale: Maramihan ang pandiwang Hebreo. Pinananatili ito upang hindi burahin ang paglipat mula sa isahang “anak” tungo sa mas malawak na bunga sa pamilya o sambayanan.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwiran at karaniwang salin na nagpapanatili sa kaibahan sa tanging katapatan kay Yahweh.
- source_word: וְחָרָה אַף יְהוָה
  choice: kaya mag-aalab ang galit ni Yahweh
  rationale: Pinananatili ng “mag-aalab” ang matingkad na metapora ng Hebreo, at ipinakikita ng “kaya” ang bunga ng pagsamba sa ibang mga diyos.
- source_word: בָּכֶם
  choice: laban sa inyo
  rationale: Sa idyoma ng pag-aalab ng galit, ipinahahayag ng pang-ukol ang mga taong pinatutungkulan ng galit; maramihan ang hulaping Hebreo.
- source_word: וְהִשְׁמִידְךָ
  choice: lilipulin niya kayo
  rationale: Malakas at marangal na salin ng Hiphil ng שׁמד; isahan ang pandiwa ngunit maramihan ang pinatutungkulan sa kolektibong “kayo.”
- source_word: מַהֵר
  choice: mabilis
  rationale: Pinananatili ang diwa ng mabilis at agarang paghatol.
theological_decisions:
- issue: Paglipat mula sa isahang “anak na lalaki” tungo sa maramihang pandiwa
  choice: Pinanatili ang “iyong anak na lalaki” at “maglilingkod sila.”
  alternative: Ipantay sa isahan bilang “maglilingkod siya,” o gawing maramihan ang “mga anak.”
  rationale: Isahan ang בִּנְךָ ngunit maramihan ang וְעָבְדוּ. Ang pagpapanatili sa dalawang bilang ay nag-iingat sa tunay na tensiyon ng teksto at maaaring magpahiwatig ng lumalawak na epekto sa pamilya o sambayanan nang hindi ito tiyak na ipinapakahulugan.
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON
  rationale: Ginamit ang transliterasyong “Yahweh” upang tuwirang katawanin ang personal na pangalang nasa tekstong Hebreo, nang hindi ito pinapalitan ng isang titulo.
- issue: Layon ng tipan at paghatol
  choice: Ang pagtalikod at paglilingkod sa ibang mga diyos ay nagbubunga ng galit at mabilis na paglipol.
  alternative: Limitahan ang babala sa isang indibiduwal lamang.
  rationale: Ang maramihang “sila” at “inyo/kayo” ay nagpapakitang may mas malawak na saklaw ang babala, ngunit hindi tinutukoy ng salin nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “anak na lalaki” para sa tiyak na panlalaking isahan, “mag-aalab” upang mapanatili ang metapora ng galit, at “lilipulin” para sa mabigat ngunit hindi kolokyal na pahayag ng paghatol. Inilagay ang talababa matapos ang buong talata dahil ipinaliliwanag nito ang paglipat ng bilang sa loob ng pangungusap.
