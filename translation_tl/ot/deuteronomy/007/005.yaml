  text: כִּֽי אִם כֹּ֤ה תַעֲשׂוּ֙ לָ/הֶ֔ם מִזְבְּחֹתֵי/הֶ֣ם תִּתֹּ֔צוּ וּ/מַצֵּבֹתָ֖/ם תְּשַׁבֵּ֑רוּ וַ/אֲשֵֽׁירֵ/הֶם֙ תְּגַדֵּע֔וּ/ן וּ/פְסִילֵי/הֶ֖ם תִּשְׂרְפ֥וּ/ן בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: tl
  text: 'Sa halip, ganito ang gagawin ninyo sa kanila: Gibain ninyo ang kanilang mga altar, durugin ang kanilang mga sagradong haligi[a], putulin ang kanilang mga poste ni Ashera[b], at sunugin sa apoy ang kanilang mga inukit na larawan[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sagradong batong itinayo.” Ang tinutukoy ay mga nakatayong bato o haliging ginagamit sa pagsamba.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: Asherim; malamang na mga bagay na kahoy na ginagamit sa kulto at kaugnay ng diyosang si Ashera.'
    reason: cultural_note
  - marker: c
    text: O “mga diyus-diyosan”; mas tiyak sa Hebreo ang “mga inukit na larawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sa halip
  rationale: Ipinahahayag ng idyoma ang mariing pagsalungat sa naunang pagbabawal; natural na naihahatid ng “Sa halip” ang puwersang iyon sa modernong Tagalog.
- source_word: כֹּה תַעֲשׂוּ לָהֶם
  choice: ganito ang gagawin ninyo sa kanila
  rationale: Pinananatili nito ang pasulong na pagtukoy ng כֹּה at ang direktibang puwersa ng pandiwa sa kontekstong legal.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: Gibain ninyo ang kanilang mga altar
  rationale: Ang נתץ ay tumutukoy sa paggiba ng isang estruktura; ang “gibain” ay malinaw at angkop sa mga altar.
- source_word: מַצֵּבֹתָם
  choice: kanilang mga sagradong haliging bato
  rationale: Ang מַצֵּבָה ay nakatayong bato o haliging ginagamit sa kulto. Nililinaw ng salin ang materyal at gamit nang hindi ito ginagawang pangkalahatang diyus-diyosan.
- source_word: תְּשַׁבֵּרוּ
  choice: durugin
  rationale: Ipinahihiwatig ng anyong Piel ang marahas at ganap na pagbasag; inihahatid ito ng “durugin.”
- source_word: אֲשֵׁירֵיהֶם
  choice: kanilang mga poste ni Ashera
  rationale: Pinananatili ang tiyak na kaugnayan ng mga kultong bagay na ito kay Ashera habang gumagamit ng katawagang mauunawaan ng karaniwang mambabasa.
- source_word: תְּגַדֵּעוּן
  choice: putulin
  rationale: Ang גדע ay pagputol sa isang bagay na kahoy, gaya ng puno o poste; natural dito ang “putulin.”
- source_word: פְסִילֵיהֶם
  choice: kanilang mga inukit na larawan
  rationale: Ang פֶּסֶל ay larawang ginawa sa pamamagitan ng pag-ukit. Mas tiyak ito kaysa sa pangkalahatang “mga diyus-diyosan.”
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: sunugin sa apoy
  rationale: Pinananatili ang tahasang pagbanggit sa apoy sa Hebreo at ang mariing utos.
theological_decisions:
- issue: Kung ituturing ang אֲשֵׁרִים bilang tiyak na kultong bagay o pangkalahatang diyus-diyosan
  choice: mga poste ni Ashera
  alternative: mga Asherim; mga imahen ni Ashera
  rationale: Magkakahiwalay na uri ng mga bagay na panrelihiyon ang inililista ng talata. Pinananatili ng saling ito ang makasaysayang kaugnayan kay Ashera at hindi pinapantay sa pangkalahatang katawagang “diyus-diyosan.”
- issue: Puwersa ng utos na wasakin ang mga lugar at bagay ng pagsamba
  choice: 'Mga tuwiran at mariing utos: gibain, durugin, putulin, at sunugin'
  alternative: Mas malambot na paglalahad gaya ng “alisin”
  rationale: Konkreto at mariin ang mga pandiwang Hebreo. Pinananatili ng salin ang tindi ng utos nang hindi nagdaragdag ng paliwanag o teolohikal na katuwiran na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” upang ipakita ang maramihang kausap. Pinanatili ang magkakasunod at mararahas na pandiwa ng pinagmulang teksto, habang ipinaliwanag sa mga talababa ang mga terminong kultiko na maaaring hindi pamilyar sa ordinaryong mambabasa.
