  text: וְ/לֹא תָבִ֤יא תֽוֹעֵבָה֙ אֶל בֵּיתֶ֔/ךָ וְ/הָיִ֥יתָ חֵ֖רֶם כָּמֹ֑/הוּ שַׁקֵּ֧ץ תְּשַׁקְּצֶ֛/נּוּ וְ/תַעֵ֥ב תְּֽתַעֲבֶ֖/נּוּ כִּי חֵ֥רֶם הֽוּא־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: tl
  text: Huwag kang magpasok sa iyong bahay ng isang kasuklam-suklam na bagay[a], kung hindi ay magiging nakatalaga ka rin sa paglipol gaya nito. Lubusan mo itong kasuklaman at lubusan mong kamuhian, sapagkat nakatalaga ito sa paglipol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang karumal-dumal na bagay.” Sa kontekstong ito, tumutukoy ito lalo na sa isang bagay na kaugnay ng idolatriya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָבִיא
  choice: magpasok
  rationale: Ang Hiphil ng בוא ay nagpapahiwatig ng pagpapapasok o pagdadala sa loob; natural na ipinahahayag ng “magpasok” ang kilos kaugnay ng bahay.
- source_word: תּוֹעֵבָה
  choice: anumang kasuklam-suklam
  rationale: Pinananatili nito ang matinding moral at panrelihiyong pagkasuklam ng termino habang malinaw na tumutukoy sa isang bagay, lalo na sa konteksto ng mga bagay na kaugnay ng idolatriya.
- source_word: בֵּיתֶךָ
  choice: iyong bahay
  rationale: Konkretong katumbas ito ng Hebreong “bahay” at pinananatili ang larawan ng pagdadala ng ipinagbabawal na bagay sa tahanan.
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: kung hindi ay magiging nakatalaga ka rin sa paglipol tulad nito
  rationale: Ang waw ay binigyang-bisa bilang bunga ng pagsuway. Ang חֵרֶם ay hindi lamang “sumpa” kundi katayuang inilaan sa pagwasak sa ilalim ng hatol ng Diyos.
- source_word: חֵרֶם
  choice: nakatalaga sa paglipol
  rationale: Ipinahahayag nito ang ideya ng isang bagay o taong ibinukod upang lipulin sa ilalim ng banal na paghatol, nang hindi umaasa sa malabong pariralang “nasa ilalim ng pagbabawal.”
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: Lubos mo itong kasusuklaman
  rationale: Ang infinitive absolute kasama ng pandiwa ay nagbibigay-diin; ipinahahayag ito ng “lubos” habang pinananatili ang hinaharap na anyong nag-uutos sa Tagalog.
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: at lubos na kamumuhian
  rationale: Pinananatili ang ikalawang, magkatambal na pandiwa at ang diin ng Hebreong konstruksyon nang hindi pinagsasama ang dalawang utos.
- source_word: כִּי חֵרֶם הוּא
  choice: sapagkat nakatalaga ito sa paglipol
  rationale: Pinananatili ang sanhi at inuulit ang parehong salin ng חֵרֶם upang maging malinaw ang leksikal at teolohikal na ugnayan.
theological_decisions:
- issue: Kahulugan ng חֵרֶם sa konteksto ng tipan at paghatol
  choice: nakatalaga sa paglipol
  alternative: isinumpa; nasa ilalim ng pagbabawal
  rationale: Ang termino ay tumutukoy sa isang bagay na ibinukod para sa pagwasak sa ilalim ng hatol ng Diyos. Iniiwasan ng saling ito ang pagpapaliit sa kahulugan tungo sa sumpa lamang at pinananatili ang babalang maaaring makibahagi ang tao sa katayuan ng bagay.
- issue: Ugnayan ng ipinagbabawal na bagay at ng taong nagpasok nito
  choice: kung hindi ay magiging nakatalaga ka rin sa paglipol tulad nito
  alternative: at magiging nakatalaga ka sa paglipol tulad nito
  rationale: Pinananatili ang tunay na bunga ng pagsuway na ipinahihiwatig ng waw, habang natural na nililinaw sa Tagalog ang babala nang hindi ito ginagawang isang tiyak na mangyayari anuman ang tugon.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang isahan na “ka” ayon sa Hebreo. Pinanatili ang magkatambal na “kasusuklaman” at “kamumuhian,” pati ang pag-uulit ng “nakatalaga sa paglipol,” upang maipakita ang diin at pagkakaugnay ng mga termino sa pinagmulang teksto.
