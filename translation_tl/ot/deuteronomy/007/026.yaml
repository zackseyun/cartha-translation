  naturalness: May bahagyang di-natural na anyo ang ‘Lubos mo itong kasusuklaman at lubos na kamumuhian.’ Mas natural at tuwiran sa modernong Filipino ang magkakaugnay na pautos na ‘Lubusan mo itong kasuklaman at lubusan mong kamuhian.’
  terminology: Ang ‘nakatalaga sa paglipol’ ay angkop at pare-parehong salin ng חֵרֶם sa dalawang paglitaw nito. Pinananatili nitong malinaw ang katayuang nasa ilalim ng banal na paghatol, nang hindi nililimitahan ang diwa sa ‘sumpa’ lamang. Ang ‘kasuklam-suklam na bagay’ ay angkop para sa תּוֹעֵבָה.
