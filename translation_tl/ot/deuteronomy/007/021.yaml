  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: tl
  text: Huwag kayong masindak sa kanila,[a] sapagkat si Yahweh na inyong Diyos ay nasa gitna ninyo,[b] isang dakila at kasindak-sindak na Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Huwag kayong mangilabot dahil sa kanila.”
    reason: lexical_alternative
  - marker: b
    text: O “nasa piling ninyo.”
    reason: lexical_alternative
  - marker: c
    text: O “kahanga-hanga”; inilalarawan ng Hebreo ang Diyos bilang pumupukaw ng may-pagpipitagang takot.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ מִפְּנֵיהֶם
  choice: masindak sa kanila
  rationale: Ang pandiwang ערץ ay nagpapahayag ng matinding takot o panghihilakbot. Natural sa modernong Tagalog ang “masindak sa kanila” at pinananatili nito ang lakas ng Hebreo nang hindi nagiging mabigat ang pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalang banal sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Pinananatili ang ugnayang tipan na ipinahahayag ng hulaping pangalawang panauhang panlalaki na isahan. Ginamit ang “inyong” sapagkat kolektibo ang kausap na Israel at ito ang natural na anyo sa Tagalog.
- source_word: בְּקִרְבְּךָ
  choice: nasa gitna ninyo
  rationale: Ipinahahayag nito ang presensiya ng Diyos sa gitna ng sambayanan. Iniiwasan ng saling ito ang posibleng pansarili o panloob na pakahulugan ng “nasa loob ninyo.”
- source_word: אֵל גָּדוֹל
  choice: isang dakilang Diyos
  rationale: Ang אֵל ay katawagan sa Diyos at ang גָּדוֹל ay “dakila” o “malaki.” Ang “dakilang Diyos” ay natural, marangal, at tapat sa appositional na parirala.
- source_word: וְנוֹרָא
  choice: kasindak-sindak
  rationale: Ang anyong ito mula sa ירא ay tumutukoy sa isang pumupukaw ng takot at pagpipitagan. Pinananatili ng “kasindak-sindak” ang bigat nito, bagaman maaari rin itong unawain bilang “kahanga-hanga at kakila-kilabot.”
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Diwa ng וְנוֹרָא bilang katangian ng Diyos
  choice: kasindak-sindak
  alternative: kahanga-hanga at kakila-kilabot
  rationale: Hindi nilalabnaw ang kaugnayan nito sa takot, ngunit kinikilala sa talababa na ang takot na pinupukaw ay may kasamang paghanga at pagpipitagan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang kolektibong “kayo/ninyo” upang natural na katawanin ang Hebreong isahan na tumutukoy sa Israel bilang isang sambayanan. Ang lahat ng marker ng talababa ay inilagay sa pangunahing teksto.
