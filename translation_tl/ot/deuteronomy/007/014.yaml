  text: בָּר֥וּךְ תִּֽהְיֶ֖ה מִ/כָּל הָ/עַמִּ֑ים לֹא יִהְיֶ֥ה בְ/ךָ֛ עָקָ֥ר וַֽ/עֲקָרָ֖ה וּ/בִ/בְהֶמְתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: tl
  text: Magiging higit kang pinagpala kaysa sa lahat ng mga bayan[a]. Walang lalaking baog o babaeng baog sa inyo[b], ni sa iyong mga alagang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “higit sa lahat ng mga bayan.” Nagsasaad dito ng paghahambing ang pang-ukol sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: 'Tahasan sa Hebreo ang parehong panlalaki at pambabaeng anyo: “lalaking baog o babaeng baog.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: Pagpapalain ka
  rationale: Ipinahahayag ng Hebreo ang kalagayan at pangakong magiging pinagpala ang Israel. Natural sa modernong Tagalog ang pandiwang anyong panghinaharap.
- source_word: מִכָּל הָעַמִּים
  choice: nang higit sa lahat ng mga bayan
  rationale: Ginagamit dito ang מִן sa paghahambing. Malinaw na ipinapahayag ng “nang higit sa” ang paghahambing nang hindi ito ginagawang pahayag ng ranggo lamang.
- source_word: לֹא יִהְיֶה בְךָ
  choice: Walang ... sa inyo
  rationale: Ang eksistensiyal na parirala ay nagsasaad na walang gayong tao sa loob ng sambayanan. Bagaman isahan ang Hebreong kausap, natural sa Tagalog ang “sa inyo” para sa kolektibong Israel.
- source_word: עָקָר וַעֲקָרָה
  choice: lalaki o babaeng baog
  rationale: Pinananatili ang tahasang panlalaki at pambabaeng anyo ng Hebreo. Ang “baog” ay karaniwan at nauunawaang salita sa Tagalog para sa kawalan ng kakayahang magkaanak.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: ni sa iyong mga alagang hayop
  rationale: Ang בְּהֵמָה ay kolektibong tumutukoy sa domestikadong hayop. Ang “mga alagang hayop” ay mas malawak at natural kaysa “mga baka” lamang.
theological_decisions:
- issue: Tahasan at magkaparis na katawagang panlalaki at pambabae tungkol sa pagkabaog
  choice: “lalaki o babaeng baog”
  alternative: “sinumang baog”
  rationale: Pinananatili nito ang parehong gramatikal na kasarian sa Hebreo sa halip na gawing pangkalahatan ang pahayag.
- issue: Isahang kausap na kumakatawan sa buong Israel
  choice: “ka” sa pangunahing pangako ngunit “sa inyo” sa pagtukoy sa sambayanan
  alternative: 'Panatilihing isahan sa lahat ng bahagi: “sa iyo”'
  rationale: Ang Israel ay kinakausap bilang isang kabuuan, ngunit ang kawalan ng baog ay umiiral “sa gitna” ng mga kabilang sa bayan. Ang likas na Tagalog ay maaaring magpalit sa pangmaramihang “inyo” upang malinaw ang kolektibong diwa nang hindi binabago ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga bayan” para sa mga pangkat ng tao o bansa at “mga alagang hayop” para sa kolektibong domestikadong hayop. Ang “ni” ay natural na nagpapalawak ng negatibong pahayag sa mga hayop.
