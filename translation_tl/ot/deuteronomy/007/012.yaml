id: DEU.7.12
reference: Deuteronomy 7:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: tl
  text: Kapag nakinig kayo sa mga hatol na ito[a] at iningatan at isinagawa ninyo ang mga ito, iingatan din ni Yahweh na inyong Diyos para sa inyo ang tipan at ang tapat na pag-ibig[b] na ipinangako niyang may panunumpa sa inyong mga ama.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tuntunin,” “mga ordinansa,” o “mga legal na pasiya.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong ḥesed ay tumutukoy sa matatag at tapat na pag-ibig, lalo na sa loob ng isang ugnayang tipan; maaari ring isaling “katapatan sa tipan” o “walang-maliw na pag-ibig.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa inyong mga ninuno”; literal na “sa inyong mga ama,” na tumutukoy rito sa mga patriyarka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: At dahil
  rationale: Ipinahahayag ng parirala ang bunga na nakabatay sa kasunod na pagtugon. Pinananatili ng “At dahil” ang ugnayang sanhi at bunga nang hindi gumagamit ng di-likas na pormal na ayos sa modernong Tagalog.
- source_word: תִּשְׁמְעוּן
  choice: makikinig kayo
  rationale: Ang שׁמע ay maaaring mangahulugang makarinig na may kasamang pagsunod. Ang “makikinig” ay nagpapanatili sa larawang pandinig, samantalang nililinaw ng kasunod na “iingatan at isasagawa” ang masunuring pagtugon.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: mga hatol na ito
  rationale: Ang מִשְׁפָּטִים ay tumutukoy sa mga hatol, tuntunin, o legal na pasiya. Ang “mga hatol” ay malapit sa pormal na diwa at hindi ito basta ipinapantay sa iba pang katawagang pambatas sa Deuteronomio.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: iingatan at isasagawa ninyo ang mga iyon
  rationale: Pinananatili ang dalawang pandiwa ng Hebreo—“ingatan” at “isagawa”—upang hindi mawala ang diin sa maingat na pagtupad at aktuwal na paggawa.
- source_word: וְשָׁמַר
  choice: iingatan naman
  rationale: Inuulit ang “ingatan” upang mapanatili ang ugnayang salita sa pagitan ng pag-iingat ng Israel sa mga hatol at pag-iingat ni Yahweh sa tipan. Ipinakikita ng “naman” ang katugmang tugon sa pangungusap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Pinananatili ang kaugnayang tipan na ipinahahayag ng panghalip na paari; ang isahan sa Hebreo ay kolektibong tumutukoy sa Israel, kaya natural sa Tagalog ang “inyong.”
- source_word: לְךָ
  choice: para sa inyo
  rationale: Ipinakikita ng parirala ang Israel bilang makikinabang sa tapat na pag-iingat ni Yahweh sa tipan.
- source_word: הַבְּרִית
  choice: ang tipan
  rationale: Ang “tipan” ang karaniwan at teolohikal na malinaw na salin ng sentral na terminong בְּרִית.
- source_word: הַחֶסֶד
  choice: ang tapat na pag-ibig
  rationale: Sinasaklaw ng “tapat na pag-ibig” ang matatag na katapatan at mapagmahal na kabutihang taglay ng חֶסֶד sa konteksto ng tipan, nang hindi ito nililimitahan sa damdamin lamang o sa legal na katapatan lamang.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: na isinumpa niya
  rationale: Tahasang pinananatili ang diwa ng panunumpa o pangakong pinagtibay ng sumpa.
- source_word: לַאֲבֹתֶיךָ
  choice: sa inyong mga ama
  rationale: Pinananatili ang tiyak na panlalaking katawagan ng Hebreo para sa mga ama o ninunong patriyarka, sa halip na agad itong gawing pangkalahatang “mga ninuno.”
theological_decisions:
- issue: Pagpapakahulugan sa חֶסֶד sa konteksto ng tipan
  choice: tapat na pag-ibig
  alternative: katapatan sa tipan; walang-maliw na pag-ibig; habag
  rationale: Pinananatili ng “tapat na pag-ibig” ang tensiyon sa pagitan ng matatag na pangako sa tipan at ng mapagbigay na pagmamahal, nang hindi pinipili lamang ang legal o emosyonal na aspekto.
- issue: Panlalaking pagtukoy sa לַאֲבֹתֶיךָ
  choice: sa inyong mga ama
  alternative: sa inyong mga ninuno
  rationale: Tiyak na “mga ama” ang nasa tekstong Hebreo at sa konteksto ay tumutukoy sa mga patriyarkang pinangakuan ng Diyos. Pinananatili ito sa pangunahing teksto, habang inilalahad sa talababa ang mas malawak at natural na alternatibo.
- issue: Ugnayang kondisyonal at bunga sa עֵקֶב
  choice: At dahil ... iingatan naman
  alternative: At mangyayari, kapag ...; Bilang bunga ng ...
  rationale: Inilalahad ang pagsunod ng Israel bilang batayan ng kasunod na ipinahayag na pagkilos ni Yahweh, ngunit hindi dinaragdagan ang teksto ng isang sistematikong paliwanag tungkol sa biyaya, merito, o kalikasan ng tipan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “iingatan” upang maipakita ang mahalagang pagkakatugma ng pandiwang שׁמר sa dalawang sugnay. Ginamit ang maramihang “kayo/inyo” sapagkat ang pananalitang Hebreo sa isahan ay kolektibong nakatuon sa Israel. Ang “mga hatol” at “mga ama” ay bahagyang pormal ngunit sadyang pinili upang mapanatili ang legal at patriyarkal na espesipikasyon ng pinagmulan; nilinaw ang mas natural na mga alternatibo sa mga talababa.
