  language: tl
  text: Kung sabihin mo sa iyong puso, “Mas marami ang mga bansang ito kaysa sa akin; paano ko sila mapapaalis[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “maaalisan sila ng lupain.” Ang pandiwang Hebreo ay may diwang pagpapaalis sa kanila sa kanilang pagmamay-ari o paninirahan sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagsisimula ito ng isang kondisyunal na sitwasyon na sasagutin ng katiyakan sa kasunod na talata.
- source_word: תֹאמַר בִּלְבָבְךָ
  choice: sasabihin mo sa iyong puso
  rationale: Pinananatili ang larawang Hebreo ng panloob na pagsasalita o pag-iisip, at malinaw pa rin ito sa makabagong Tagalog.
- source_word: רַבִּים ... מִמֶּנִּי
  choice: Mas marami kaysa sa akin
  rationale: Ipinahahayag ang paghahambing sa dami nang hindi ginagawang maramihan ang nag-iisang taong kinakausap sa Hebreo.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ang mga bansang ito
  rationale: Ang גּוֹיִם sa konteksto ng Deuteronomio ay tumutukoy sa magkakaibang mga bansang nasa lupain.
- source_word: אֵיכָה אוּכַל
  choice: paano ko
  rationale: Sa kasunod na pandiwa, natural nitong ipinahahayag ang tanong tungkol sa kakayahan o posibilidad.
- source_word: לְהוֹרִישָׁם
  choice: maaagaw sa kanila ang lupain
  rationale: 'Inilalarawan nito ang sanhiang diwa ng pandiwa: mawawalan sila ng pag-aari o kapangyarihan sa lupain. Mas malinaw sa Tagalog ang pagbabagong-anyo ng pangungusap kaysa sa isang pilit na tuwirang katumbas ng “dispossess.”'
