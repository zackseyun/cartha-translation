    rationale: Ang talababa ay nagbibigay ng “mapapaalis sila” bilang alternatibo, samantalang ang pangunahing teksto ay may idinagdag na “lupain.” Sa binagong teksto, magiging tunay na lexical alternative ang “maaalisan sila ng lupain.”
