  source_fidelity: Ang “Kung,” ang isahang kausap, ang paghahambing sa dami, at ang tanong tungkol sa kakayahan ay tapat sa Hebreo. Gayunman, ang “maaagaw sa kanila ang lupain” ay nagdaragdag ng tahasang bagay na wala sa talata at inililihis ang pokus mula sa mga tao (“sila”) tungo sa lupain. Ang Hiphil ng ירש ay tumutukoy sa pagpapawalang-singaw ng kanilang pagmamay-ari o paninirahan; maaaring isalin sa pangunahing teksto bilang “mapapaalis sila,” na nililinaw ng talababa.
  naturalness: Natural at malinaw ang binagong ayos na “Mas marami ang mga bansang ito kaysa sa akin.” Ang “sa iyong puso” ay isang nauunawaang, marangal na idyomang Tagalog na pinananatili ang larawang Hebreo.
  terminology: “Mga bansa” ay angkop para sa גּוֹיִם. Ang “mapapaalis” ay natural na modernong Tagalog para sa agarang diwa sa kontekstong ito; ang talababa ay kinakailangan upang itala ang mas tiyak na diwa ng pagkawala ng pagmamay-ari sa lupain.
