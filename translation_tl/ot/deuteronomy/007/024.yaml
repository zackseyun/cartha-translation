base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: tl
  text: Ibibigay niya sa kamay mo ang kanilang mga hari, at papawiin mo ang pangalan nila mula sa silong ng langit. Walang sinumang[a] makatatayo sa harap mo hanggang sa lipulin mo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Walang lalaking makatatayo.” Ginamit dito ang salitang Hebreo na אִישׁ (’ish, “lalaki”) bilang kinatawang isahan na tumutukoy sa sinuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Ibibigay niya
  rationale: Ang Qal perfect na may pang-ugnay ay nagpapatuloy sa serye ng mga pangako at may hinaharap na diwa. Ang ikatlong panauhang panlalaking paksa ay tumutukoy sa PANGINOON sa konteksto.
- source_word: מַלְכֵיהֶם
  choice: ang kanilang mga hari
  rationale: Tuwirang ipinapahayag ng construct plural na may hulaping 3mp ang kahulugang ‘kanilang mga hari.’
- source_word: בְּיָדֶךָ
  choice: sa kamay mo
  rationale: Pinananatili nito ang larawang Hebreo ng pagsasailalim sa kapangyarihan ng isang tao at likas pa rin itong maunawaan sa Filipino.
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: at papawiin mo ang pangalan nila
  rationale: Ang Hiphil ng אבד ay causative, at ‘pangalan’ ang layon. Ipinahihiwatig ng ‘papawiin’ ang pag-aalis ng kanilang alaala o pagkakakilanlan, habang pinananatili ang kolektibong isahan ng שְׁמָם.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: sa silong ng langit
  rationale: Pinananatili ang karaniwang larawang Hebreo para sa ganap na pag-aalis mula sa daigdig ng buhay ng tao.
- source_word: לֹא יִתְיַצֵּב אִישׁ
  choice: Walang sinumang makatatayo
  rationale: Ang Hitpael ng יצב ay tumutukoy sa pagtindig o pananatiling nakatindig laban sa isang kalaban. Likas na naihahatid ng ‘sinuman’ ang representatibo at pangkalahatang gamit ng isahang אִישׁ sa modernong Filipino.
- source_word: בְּפָנֶיךָ
  choice: sa harap mo
  rationale: Pinananatili ang Hebreong idyoma, na sa kontekstong pandigma ay may diwang pagharap o paglaban.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: hanggang sa lipulin mo sila
  rationale: Itinatakda ng infinitive construct kasunod ng עַד ang hantungan ng pagkilos. Ang ‘lipulin’ ay nagpapanatili sa matinding diwa ng שׁמד sa konteksto ng digmaan sa Deuteronomio.
theological_decisions:
- issue: Ang representatibong isahan na אִישׁ
  choice: Walang sinumang makatatayo
  alternative: Walang lalaking makatatayo
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, pangkalahatan ang gamit nito rito. Ang ‘sinuman’ ay tumpak at likas sa Filipino at hindi nagpapahiwatig na mga lalaki lamang ang saklaw. Itinatala sa talababa ang mas literal na anyo upang hindi maitago ang pormang Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang mga larawang ‘sa kamay mo,’ ‘pangalan,’ at ‘sa silong ng langit,’ ngunit ginamit ang likas na pangkalahatang ‘sinuman’ para sa representatibong אִישׁ.
