revisions:
- from: Mamahalin ka niya, pagpapalain, at pararamihin. Pagpapalain niya ang bunga ng iyong sinapupunan at ang bunga ng iyong lupain—ang iyong butil, bagong alak, at langis, ang mga anak ng iyong mga bakahan at ang mga inakay ng iyong kawan—sa lupaing isinumpa niyang ibibigay sa iyo ayon sa pangako niya sa iyong mga ama.[a]
  to: Mamahalin ka niya, pagpapalain ka niya, at pararamihin ka niya. Pagpapalain niya ang bunga ng iyong sinapupunan at ang bunga ng iyong lupain—ang iyong butil, bagong alak, at langis, ang mga supling ng iyong mga baka at ang mga inakay ng iyong kawan—sa lupaing isinumpa niya sa iyong mga ama na ibibigay niya sa iyo.[a]
  rationale: Inayos ang pangwakas na sugnay upang maipahayag nang walang dagdag na kahulugan na ang panunumpa ay ginawa sa mga ama at ang lupain ay ibibigay sa kausap. Pinalitan din ang “mga bakahan” ng “mga baka” upang tumukoy sa mga hayop, hindi sa lugar o gawaing pag-aalaga ng baka. Ang iba pang mahahalagang salita at ang talababa ay pinanatili.
