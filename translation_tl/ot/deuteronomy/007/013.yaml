base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: tl
  text: Mamahalin ka niya, pagpapalain ka niya, at pararamihin ka niya. Pagpapalain niya ang bunga ng iyong sinapupunan at ang bunga ng iyong lupain—ang iyong butil, bagong alak, at langis, ang mga supling ng iyong mga baka at ang mga inakay ng iyong kawan—sa lupaing isinumpa niya sa iyong mga ama na ibibigay niya sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga ninuno.” Literal na “mga ama” ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: Mamahalin ka niya
  rationale: Ipinapahayag ng anyong Hebreo, ayon sa daloy ng mga pagpapala sa tipan, ang mangyayari sa hinaharap. Pinananatili ng “mamahalin” ang tuwirang diwa ng pag-ibig.
- source_word: וּבֵרַכְךָ וְהִרְבֶּךָ
  choice: pagpapalain, at pararamihin
  rationale: Tuwirang inilalarawan ang pagpapala at pagdami ng bayang kinakausap, habang pinananatili ang pang-isahang anyo ng ikalawang panauhan sa pamamagitan ng “ka.”
- source_word: פְּרִי בִטְנְךָ
  choice: bunga ng iyong sinapupunan
  rationale: Pinananatili ang konkretong metapora ng Hebreo para sa mga anak at pagkamayabong.
- source_word: פְּרִי אַדְמָתֶךָ
  choice: bunga ng iyong lupain
  rationale: Pinananatili ang pag-uulit ng פְּרִי (“bunga”) at likas sa konteksto ang “lupain” bilang lupang sinasaka.
- source_word: דְּגָנְךָ וְתִירֹשְׁךָ וְיִצְהָרֶךָ
  choice: ang iyong butil, bagong alak, at langis
  rationale: Ang “butil” ay tumutukoy sa ani ng mga halamang butil; ang “bagong alak” ay nagpapanatili sa natatanging diwa ng תירוש; at ang “langis” ay karaniwang tumutukoy sa langis ng olibo nang hindi kailangang idagdag iyon sa teksto.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: ang mga anak ng iyong mga bakahan
  rationale: Ipinahihiwatig ng idyoma ang mga supling ng mga bakang alaga; ipinakikita ng “mga bakahan” ang pangmaramihang anyo ng Hebreo.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: ang mga inakay ng iyong kawan
  rationale: Sa tambalang ito, ang pambihirang salita ay tumutukoy sa mga supling ng maliliit na hayop sa kawan. Iniiwasang ipasok ang pangalang Ashtoreth.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: isinumpa niyang ibibigay sa iyo ayon sa pangako niya sa iyong mga ama
  rationale: Pinananatili ang pormula ng panunumpa at ang tahasang panlalaking pangmaramihang “mga ama,” na sa konteksto ay tumutukoy sa mga ninuno ng Israel.
theological_decisions:
- issue: Paglalarawan sa לַאֲבֹתֶיךָ
  choice: sa iyong mga ama
  alternative: sa iyong mga ninuno
  rationale: Tahasan sa Hebreo ang panlalaking pangmaramihang “mga ama.” Pinanatili ito sa pangunahing teksto, habang inilalahad sa talababa ang mas likas at mas malawak na katumbas na “mga ninuno.”
- issue: Bilang ng ikalawang panauhan
  choice: ka / iyong / iyo
  alternative: kayo / inyong / inyo
  rationale: Pang-isahan ang mga panghalip at hulapi sa Hebreo, bagaman kolektibong Israel ang kausap. Pinananatili ng salin ang pormal na pang-isahan nang hindi inaalis ang kolektibong konteksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pang-isahang “ka/iyong/iyo” upang tularan ang kolektibong pang-isahan ng Hebreo. Pinanatili ang magkatulad na “bunga” sa sinapupunan at lupain, at ginamit ang “sinapupunan” dahil malinaw, dignified, at angkop sa biblikal na rehistro.
