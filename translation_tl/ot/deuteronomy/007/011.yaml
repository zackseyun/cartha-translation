base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: tl
  text: Kaya[a], sundin mo ang utos, ang mga tuntunin, at ang mga hatol[b] na iniuutos ko sa iyo ngayon, upang isagawa mo ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “At” o “Kaya naman”; ang pang-ugnay sa Hebreo ay maaaring simpleng magdugtong ng pangungusap o magpahiwatig ng kongklusyon mula sa naunang mga talata.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga hatol” ay maaari ring isaling “mga pasiyang legal,” “mga ordinansa,” o “mga alituntunin”; tumutukoy ang salitang Hebreo sa mga itinakdang hatol o tuntuning legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Kaya, sundin mo
  rationale: Sa kontekstong legal at tipan, ang שׁמר ay nangangahulugang sundin o tuparin. Ipinahihiwatig ng “Kaya” ang maaaring lohikal na ugnayan sa naunang mga talata, habang pinananatili sa talababa ang ibang posibleng pagbasa sa pang-ugnay.
- source_word: הַמִּצְוָה
  choice: ang utos
  rationale: Pinanatili ang isahan ng pangngalang Hebreo. Natural sa makabagong Filipino ang “utos” at naiiba ito sa sumusunod na mga kategoryang legal.
- source_word: הַחֻקִּים
  choice: ang mga tuntunin
  rationale: Ang “mga tuntunin” ay malinaw at dignified na katumbas ng mga itinakdang batas o alituntunin, at nananatiling naiiba sa “mga hatol.”
- source_word: הַמִּשְׁפָּטִים
  choice: ang mga hatol
  rationale: Maaaring tumukoy ang מִשְׁפָּטִים sa mga hatol, pasiyang legal, o ordinansa. Pinananatili ng “mga hatol” ang pormal na legal na diwa at ang pagkakaiba nito sa חֻקִּים.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Ipinahahayag ng “iniuutos” ang kasalukuyan at agarang bisa ng participle. Pinanatili ang “ngayon,” na mahalaga sa tagpong pangtipan sa Deuteronomio.
- source_word: לַעֲשׂוֹתָם
  choice: at isagawa mo ang mga iyon
  rationale: Tuwirang ipinapahayag ang konkretong pagsunod na nasa עשה at malinaw na ibinabalik ng “ang mga iyon” ang maramihang hulapi sa mga nabanggit na kahilingan.
theological_decisions:
- issue: Pagpapanatiling magkakaiba ng tatlong katawagang kaugnay ng kautusan ng tipan
  choice: ang utos, ang mga tuntunin, at ang mga hatol
  alternative: ang kautusan, mga batas, at mga ordinansa
  rationale: Pinagsasama ng Hebreo ang tatlong magkakaugnay ngunit hindi ganap na magkasingkahulugang terminong legal. Ang magkakaibang salin ay nagpapanatili sa retorikal at pangtipang diin nang hindi pinagsasama ang mga ito sa isang pangkalahatang katawagan.
- issue: Bilang ng kinakausap
  choice: sa iyo / mo
  alternative: sa inyo / ninyo
  rationale: Nasa ikalawang panauhang panlalaking isahan ang Hebreo, bagaman kolektibong kinakausap si Israel. Pinananatili ng isahang anyo sa Filipino ang gramatikal na hugis at kolektibong personipikasyon ng pinagmulang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang pormal na himig ng tipan at batas, gayundin ang pag-uulit at pagkakaiba ng mga terminong legal, ngunit iniwasan ang lipas o labis na teknikal na pananalita.
