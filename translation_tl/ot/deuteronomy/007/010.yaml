  naturalness: Ang “ginagantihan niya nang harapan” at “gagantihan niya ito nang harapan” ay alanganin sa modernong Tagalog. Mas idiomatiko ang “ginagantihan niya ... sa mismong harapan nila” at “gagantihan niya siya sa mismong harapan niya.”
  terminology: Ang “mga napopoot,” “lipulin,” at “gagantihan” ay angkop sa marangal ngunit modernong rehistro at mahusay na pinananatili ang pag-uulit ng שׁלם. Ang panghalip na “siya” sa huling sugnay ay malinaw na tumutukoy sa isahang “sinumang napopoot sa kanya.”
