base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: tl
  text: at ginagantihan niya sa mismong harapan nila[a] ang mga napopoot sa kanya, upang lipulin sila. Hindi niya ipinagpapaliban ang pagganti sa sinumang napopoot sa kanya; gagantihan niya siya sa mismong harapan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kanyang mukha.” Maaari ring unawain ang idyoma bilang “sa mismong harapan niya/nila” o “sa kanyang/kanilang presensya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: at ginagantihan niya
  rationale: Ang Piel ng שׁלם ay tumutukoy sa pagganti o pagbabayad ayon sa ginawa. Natural sa modernong Tagalog ang “ginagantihan” at malinaw nitong pinananatili ang tuwirang pagkilos ng Diyos.
- source_word: לְשֹׂנְאָיו
  choice: ang mga napopoot sa kanya
  rationale: Ang participle mula sa שׂנא ay tumutukoy sa mga taong may pagkamuhi sa kanya. Mas tiyak ito kaysa sa mas malawak na “mga kaaway niya.”
- source_word: אֶל־פָּנָיו
  choice: nang harapan
  rationale: Ang literal na larawan ay “sa mukha niya/kanila,” ngunit ang idyomatikong “nang harapan” ay natural sa Tagalog at nagpapahayag ng tuwiran at personal na pagganti nang hindi sapilitang nilulutas ang pabago-bagong bilang ng panghalip sa Hebreo.
- source_word: לְהַאֲבִידוֹ
  choice: upang lipulin sila
  rationale: 'Ang Hiphil infinitive ng אבד ay nagpapahayag ng layunin o bunga: ang pagpuksa o lubos na pagwasak. Ang “upang lipulin sila” ay malapit sa anyong layunin at natural kasunod ng maramihang tinutukoy sa unang sugnay.'
- source_word: לֹא יְאַחֵר
  choice: Hindi niya ipinagpapaliban
  rationale: Ang Piel ng אחר ay nangangahulugang magluwat, magpaliban, o mag-antala. Malinaw at kasalukuyan ang “hindi niya ipinagpapaliban” para sa pangkalahatang pahayag tungkol sa pagkilos ng Diyos.
- source_word: לְשֹׂנְאוֹ
  choice: sa taong napopoot sa kanya
  rationale: Isahan ang anyo rito, kasalungat ng maramihan sa unang sugnay. Pinananatili ng “taong napopoot sa kanya” ang indibiduwal na diin nang hindi gumagamit ng di-likas na “napopoot niya.”
- source_word: יְשַׁלֶּם לוֹ
  choice: gagantihan niya ito
  rationale: Inuulit ng pandiwa ang ugat ng pambungad na וּמְשַׁלֵּם. Ang pag-uulit ng “gagantihan” ay nagpapanatili sa leksikal na ugnayan at sa isahang tuon ng huling sugnay.
theological_decisions:
- issue: Tuwirang paghatol ng Diyos
  choice: Inilalarawan ang Diyos bilang mismong gumaganti at lumilipol sa mga napopoot sa kanya.
  alternative: Ilarawan ito bilang di-personal o likas lamang na bunga ng kanilang mga ginawa.
  rationale: Tuwiran sa Hebreo ang pagkilos ng Diyos bilang simuno. Pinananatili ng salin ang bigat at tensiyong teolohikal ng personal na paghatol sa halip na palambutin iyon bilang impersonal na kahihinatnan.
- issue: Paglipat mula maramihan tungo sa isahan
  choice: Pinanatili ang “mga napopoot” sa unang sugnay at “taong napopoot” sa ikalawa.
  alternative: Gawing maramihan ang lahat ng pagtukoy para sa ganap na pagkakapare-pareho.
  rationale: Ang Hebreo mismo ay lumilipat mula sa maramihang לְשֹׂנְאָיו tungo sa isahang לְשֹׂנְאוֹ at לוֹ. Mahalaga ang pagbabagong ito dahil inilalapat nito ang pangkalahatang pahayag sa bawat indibiduwal.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “napopoot” at “lipulin” upang mapanatili ang taimtim na tono ng tipang pahayag, habang ang “nang harapan” at “ipinagpapaliban” ay natural sa kasalukuyang gamit.
