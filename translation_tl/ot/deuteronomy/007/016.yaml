id: DEU.7.16
reference: Deuteronomy 7:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אָכַלְתָּ֣ אֶת כָּל הָֽ/עַמִּ֗ים אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ לֹא תָחֹ֥ס עֵֽינְ/ךָ֖ עֲלֵי/הֶ֑ם וְ/לֹ֤א תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי מוֹקֵ֥שׁ ה֖וּא לָֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: tl
  text: At lilipulin ninyo ang lahat ng mga bayang ibinibigay sa inyo ni Yahweh na inyong Diyos.[a] Huwag ninyo silang kahabagan,[b] at huwag ninyong paglingkuran ang kanilang mga diyos, sapagkat ito ay magiging isang bitag sa inyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “kakainin” o “uubusin.” Ginagamit dito ang pandiwang Hebreo bilang idyoma para sa ganap na pagdaig o paglipol.
    reason: lexical_alternative
  - marker: b
    text: Literal, “Huwag silang kaawaan ng inyong mata.”
    reason: lexical_alternative
  - marker: c
    text: Ang “ito” ay malamang na tumutukoy sa paglilingkod sa kanilang mga diyos, ngunit maaari ring tumukoy nang mas malawak sa mga diyos o sa kalagayang nauugnay sa idolatriya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: lilipulin
  rationale: Literal na nangangahulugang “kakainin,” ngunit sa konteksto ng digmaan ay idyoma ito para sa ganap na pagdaig o pagwasak. Ang “lilipulin” ay natural sa Filipino at malinaw ang kontekstuwal na diwa; pinananatili sa talababa ang literal na larawan.
- source_word: כָּל הָעַמִּים
  choice: lahat ng mga bayan
  rationale: Ang עַמִּים ay tumutukoy sa magkakaibang pangkat ng mga tao. Mas natural dito ang “mga bayan” kaysa “mga bansa,” nang hindi ipinapalagay ang makabagong konsepto ng nation-state.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: ibinibigay sa inyo ni Yahweh na inyong Diyos
  rationale: Ang participle נֹתֵן ay nagpapahiwatig ng nagpapatuloy o nalalapit na pagkilos. Ginamit ang maramihang “inyo” dahil kolektibo ang kausap na Israel sa Filipino, at pinanatili ang personal na pangalang Yahweh.
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: Huwag ninyo silang kahabagan
  rationale: Ang literal na idyomang “huwag maawa ang inyong mata sa kanila” ay natural na ipinahahayag sa Filipino bilang “huwag silang kahabagan.” Ang literal na larawan ay itinala sa talababa.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: at huwag ninyong paglingkuran ang kanilang mga diyos
  rationale: Ang עבד kapag mga diyos ang layon ay paglilingkod na may diwa ng pagsamba at katapatan. Pinananatili ng “paglingkuran” ang mas malawak na saklaw kaysa sa “sambahin” lamang.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: sapagkat ito ay magiging isang bitag sa inyo
  rationale: Ang מוֹקֵשׁ ay bitag o silo. Ang “ito” ay nagpapanatili sa bahagyang kalabuan ng panghalip na הוּא, sa halip na tahasang itali lamang ito sa paglilingkod sa mga diyos.
theological_decisions:
- issue: Tinutukoy ng הוּא sa “sapagkat ito ay isang bitag sa inyo”
  choice: Pinanatili ang panghalip bilang “ito,” na maaaring pinakamalapit na tumukoy sa paglilingkod sa kanilang mga diyos.
  alternative: Maaaring tumukoy nang mas malawak sa kanilang mga diyos, sa mga bayan, o sa buong sitwasyong may kaugnayan sa idolatriya.
  rationale: Bagaman pinakamalapit sa sintaks ang pagbabawal na paglingkuran ang kanilang mga diyos, hindi ganap na tiyak ang saklaw ng Hebreong panghalip. Pinananatili ng salin at talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang panghalip upang natural na katawanin ang kolektibong kausap, bagaman isahan ang gramatikal na anyo sa Hebreo. Ang “Yahweh” ay pinanatili bilang personal na pangalan. Ang mabigat na utos ng talata ay hindi pinalambot, ngunit ang mga idyoma at kalabuan ng Hebreo ay ipinaliwanag sa mga talababa.
