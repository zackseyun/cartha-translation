  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: tl
  text: Huwag kayong makipag-asawa sa kanila. Huwag ninyong ibigay ang inyong anak na babae sa kanilang anak na lalaki, at huwag ninyong kunin ang kanilang anak na babae para sa inyong anak na lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: makipag-asawa
  rationale: Ang Hitpael ay nagpapahayag ng pakikipag-ugnayan sa pamamagitan ng pag-aasawa. Likas sa modernong Tagalog ang “makipag-asawa” at naipapahiwatig nito ang ugnayang kapuwa panig nang hindi dinaragdagan ang diwa.
- source_word: בָּם
  choice: sa kanila
  rationale: Ang pang-ukol na may hulaping ikatlong panauhang maramihan ay tumutukoy sa mga bayang binanggit sa naunang konteksto; “sa kanila” ang likas na katambal ng “makipag-asawa.”
- source_word: בִּתְּךָ
  choice: ang inyong anak na babae
  rationale: Tuwirang pinananatili ang pambabaeng katawagan at isinasalin ang pang-isahang pormulang legal. Ginamit ang magalang at kolektibong “inyong” upang maging natural ang utos sa buong Israel.
- source_word: תִתֵּן
  choice: ibigay
  rationale: Tuwirang katumbas ng pandiwa; malinaw na sa konteksto na ang pagbibigay ay para sa pag-aasawa kaya hindi na kailangang idagdag ang “bilang asawa.”
- source_word: לִבְנוֹ
  choice: sa kanilang anak na lalaki
  rationale: Ang lamed ay minamarkahan ang tatanggap. Ang Hebreong pang-isahang “kaniyang” ay kinakatawan dito ng natural na kolektibong “kanilang” na tumutukoy sa mga bayang maramihan, habang nananatiling pang-isahan ang “anak na lalaki.”
- source_word: וּבִתּוֹ
  choice: ang kanilang anak na babae
  rationale: Pinananatili ang tahasang pambabaeng katawagan. Ang “kanilang” ay natural na tumutukoy sa naunang maramihang “kanila.”
- source_word: תִקַּח
  choice: kunin
  rationale: Pinananatili ang payak na pandiwang Hebreo. Ipinakikita na ng konteksto ng pag-aasawa ang espesipikong gamit nito.
- source_word: לִבְנֶךָ
  choice: para sa inyong anak na lalaki
  rationale: Ang “para sa” ay likas sa Tagalog para sa pagkuha ng mapapangasawa para sa anak at sapat na kumakatawan sa ugnayang minamarkahan ng lamed.
theological_decisions:
- issue: Saklaw ng pagbabawal
  choice: Ang pagbabawal ay nakatuon sa pakikipag-asawa sa “kanila,” samakatuwid, sa mga bayang tinukoy sa naunang konteksto.
  alternative: Isang pangkalahatang pagbabawal sa lahat ng pag-aasawa sa mga banyaga.
  rationale: Pinananatili ng salin ang agarang reperente ng panghalip at hindi inilalagay sa talata ang mas malawak na paliwanag o dahilan na wala rito mismo.
- issue: Mga katawagang may tiyak na kasarian
  choice: Pinanatili ang “anak na babae” at “anak na lalaki.”
  alternative: Gamitin ang pangkalahatang “mga anak.”
  rationale: Tiyak sa kasarian at pang-isahan ang mga katawagang Hebreo sa kinatawang pormulang legal; ang pag-neutralisa sa mga ito ay mag-aalis ng detalye ng teksto.
- issue: Pang-isahang anyo sa Hebreo at kolektibong kausap
  choice: Ginamit ang magalang na maramihang “kayo/ninyo” at kolektibong “kanilang,” habang pinananatiling pang-isahan ang bawat anak.
  alternative: Mahigpit na gamitin ang “ikaw/mo” at “kaniyang” sa buong talata.
  rationale: Pang-isahan ang gramatikal na kausap sa Hebreo ngunit kinakatawan nito ang buong Israel. Ang maramihang anyo ay mas natural sa modernong Filipino at hindi binabago ang legal na saklaw ng utos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang mas teknikal na “makipagkamag-anak sa pamamagitan ng pag-aasawa” dahil mabigat iyon para sa karaniwang mambabasa. Walang talababa sapagkat sapat na naihahatid ng “makipag-asawa” ang salita sa konteksto.
