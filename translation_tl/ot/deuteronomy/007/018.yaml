translation:
  language: tl
  text: Huwag kang matakot sa kanila; alalahanin mong mabuti[a] ang ginawa ni Yahweh na iyong Diyos sa Paraon at sa buong Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang ugat ng pandiwang “alalahanin” upang magbigay-diin: “alalahanin, tiyak na aalalahanin mo.” Maaari rin itong isaling “tiyak na alalahanin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: Huwag kang matakot sa kanila
  rationale: Ang לֹא na may di-ganap na pandiwa ay nagsisilbing pagbabawal sa kontekstong ito. Likas at tuwiran sa modernong Tagalog ang “Huwag kang matakot sa kanila,” at pinananatili nito ang isahang tuwirang pakikipag-usap sa Israel.
- source_word: זָכֹר תִּזְכֹּר
  choice: alalahanin mong mabuti
  rationale: Ang infinitive absolute na sinusundan ng kaugnay na di-ganap na pandiwa ay nagbibigay-diin sa utos. Ipinahahayag ng “alalahanin mong mabuti” ang diin sa natural na Tagalog nang hindi nagdaragdag ng ideya ng pagsisikap na wala sa Hebreo.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: ang ginawa
  rationale: Natural na katumbas ito ng Hebreong pariralang tumutukoy sa natapos na makasaysayang ginawa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nakasulat sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili nito ang ikalawang panauhang isahan at ang kaugnayan ng Diyos sa Israel na kinakausap bilang isang kabuuan.
- source_word: לְפַרְעֹה
  choice: sa Paraon
  rationale: Sa konstruksiyong “ginawa ... sa,” malinaw na ang Paraon ang tumanggap o pinatunguhan ng pagkilos; natural ito sa Tagalog at hindi labis na tinutukoy kung ang lahat ng ginawa ay dapat ilarawang “laban” sa kaniya.
- source_word: וּלְכָל מִצְרָיִם
  choice: at sa buong Ehipto
  rationale: Pinananatili ang kolektibong pagtukoy ng Hebreo sa Ehipto, hindi tahasang ginagawang “lahat ng mga Ehipsiyo.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay naglilipat sa personal na pangalang nasa pinagmulang teksto sa halip na palitan ito ng titulo.
- issue: Diin ng utos na umalala
  choice: alalahanin mong mabuti
  alternative: tiyak na aalalahanin mo; huwag na huwag mong kalilimutan
  rationale: Ipinapakita ng napiling anyo ang diin ng זָכֹר תִּזְכֹּר habang nananatiling utos. Iniiwasan nitong gawing simpleng hula ang parirala o ipalit ang negatibong ideya ng “huwag kalimutan.”
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang isahang “ka/mo/iyong” upang panatilihin ang gramatikal na bilang ng Hebreo. Ang tuldok-kuwit ay nag-uugnay sa pagbabawal at sa kasunod na mariing utos nang hindi pinapawi ang pagkakaiba ng dalawang sugnay.
