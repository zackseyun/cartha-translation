id: DEU.7.20
reference: Deuteronomy 7:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: tl
  text: Bukod dito[b], ipapadala ni Yahweh na iyong Diyos ang putakti[a] sa gitna nila hanggang sa malipol ang mga natitira at ang mga nagtatago mula sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Posible ring tumukoy sa “sindak” o “pagkasindak”—nauunawaan ito ng ilan bilang matalinghagang paglalarawan sa takot na ipinadala ng Diyos, sa halip na literal na insekto.
    reason: lexical_alternative
  - marker: b
    text: O “At bukod dito.”
    reason: previous_rendering
lexical_decisions:
- source_word: וְגַם
  choice: Bukod dito
  rationale: Natural na Filipino para sa pandagdag at bahagyang mariing ugnayan sa naunang pangako; hindi nito pinananatili ang kalabisan ng literal na “At bukod dito.”
- source_word: הַצִּרְעָה
  choice: ang putakti
  rationale: Pinananatili ang tuwirang leksikal na kahulugan ng pangngalang isahan na may pantukoy; maaari rin itong unawain bilang kolektibong katawagan sa mga putakti. Inilalagay sa talababa ang posibleng matalinghagang kahulugan.
- source_word: יְשַׁלַּח
  choice: ipapadala
  rationale: Malinaw na ipinahahayag ang aktibong pagpapadala ni Yahweh sa ahenteng ito laban sa mga kaaway.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang tipanang pangalan ng Diyos ayon sa anyong nasa tekstong Hebreo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Likas na ikinakabit sa Filipino sa pangalang Yahweh at pinananatili ang ikalawang panauhang isahan.
- source_word: בָּם
  choice: sa gitna nila
  rationale: Pinananatili ang diwang papasok o kikilos ang putakti sa kinaroroonan ng mga kaaway.
- source_word: עַד אֲבֹד
  choice: hanggang sa malipol
  rationale: Ipinapakita ang hantungan ng pagkilos at ang ganap na pagkapuksa nang hindi tinutukoy ang eksaktong paraan.
- source_word: הַנִּשְׁאָרִים
  choice: ang mga natitira
  rationale: Tuwirang tumutukoy sa mga naiwan o nakaligtas sa mga naunang paghatol, nang hindi ipinapasok ang teknikal na teolohikal na konsepto ng “nalabi.”
- source_word: וְהַנִּסְתָּרִים
  choice: at ang mga nagtatago
  rationale: Natural na Filipino para sa mga kaaway na nagkukubli, habang kinikilala ang kontekstuwal na pansariling diwa ng anyong Hebreo.
- source_word: מִפָּנֶיךָ
  choice: mula sa iyo
  rationale: Natural na paglilipat ng Hebreong idyomang “mula sa iyong harapan/presensiya,” na tumutukoy sa pagtatago sa harap ng pagsulong ng Israel.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Kung literal o matalinghaga ang הַצִּרְעָה
  choice: literal na “ang putakti” sa pangunahing teksto
  alternative: “ang sindak/pagkasindak” bilang matalinghagang pagbasa
  rationale: Ang karaniwang leksikal na kahulugan ay isang insektong nanunugat. Gayunman, hindi ipinagwawalang-bahala ang pagbasa rito bilang sindak na ipinadala ng Diyos, kaya pinananatili iyon sa talababa.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “putakti” bilang karaniwang tawag sa hornet/wasp at iniwasan ang sobrang literal na “mula sa iyong harapan,” na hindi likas sa kasalukuyang Filipino. Nakalagay ang mga pananda [a] at [b] sa pangunahing teksto.
