  text: פְּסִילֵ֥י אֱלֹהֵי/הֶ֖ם תִּשְׂרְפ֣וּ/ן בָּ/אֵ֑שׁ לֹֽא תַחְמֹד֩ כֶּ֨סֶף וְ/זָהָ֤ב עֲלֵי/הֶם֙ וְ/לָקַחְתָּ֣ לָ֔/ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔/וֹ כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: tl
  text: Ang mga inukit na larawan ng kanilang mga diyos ay sunugin ninyo sa apoy. Huwag mong pagnasaan ang pilak at gintong nasa mga iyon, ni kunin ang mga iyon para sa iyong sarili, baka masilo ka nito,[a] sapagkat kasuklam-suklam ito kay Yahweh na iyong Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baka mabitag ka nito.” Ang pandiwang Hebreo ay naglalarawan ng pagkahuli sa isang silo.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak kung ang “ito” ay tumutukoy sa inukit na larawan, sa pilak at ginto, sa pagkuha sa mga iyon, o sa buong bagay na kaugnay ng pagsamba sa diyus-diyosan.
    reason: referential_ambiguity
lexical_decisions:
- source_word: פְּסִילֵי אֱלֹהֵיהֶם
  choice: mga inukit na larawan ng kanilang mga diyos
  rationale: Pinananatili ng “inukit na larawan” ang kongkretong diwa ng פֶּסֶל bilang larawang hinubog sa pamamagitan ng pag-ukit, nang hindi agad pinapalitan ng mas interpretatibong “mga diyus-diyosan.”
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: sunugin ninyo sa apoy
  rationale: Likas at malinaw na Filipino ito para sa utos na sunugin, habang pinananatili ang tahasang pagbanggit sa apoy bilang paraan.
- source_word: לֹא תַחְמֹד
  choice: huwag mong pagnasaan
  rationale: Ang “pagnasaan” ay nagpapahayag ng mapag-angking pagnanasa sa isang kaakit-akit na bagay at angkop sa konteksto ng pagbabawal.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: ang pilak at gintong nasa mga iyon
  rationale: Pinananatili ang Hebreong pangatnig na “at” at ang malawak na ugnayang ipinahahayag ng עַל, nang hindi ipinapalagay kung nakapatong, nakabalot, o nakakabit ang mahahalagang metal.
- source_word: וְלָקַחְתָּ לָךְ
  choice: ni kunin ang mga iyon para sa iyong sarili
  rationale: Ang “ni” ay likas na nagdurugtong sa ikalawang ipinagbabawal na kilos sa Filipino; malinaw na ipinahahayag ng “para sa iyong sarili” ang pansariling pakinabang na taglay ng לָךְ.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: baka masilo ka nito
  rationale: Pinananatili ng “masilo” ang larawan ng pagkahuli sa isang silo na nasa pandiwang Hebreo, at hindi labis na tinutukoy ang sanggunian ng panghalip.
- source_word: תוֹעֲבַת
  choice: karumal-dumal
  rationale: Ang “karumal-dumal” ay isang matindi ngunit nauunawaang makabagong katumbas ng bagay na kasuklam-suklam o lubhang hindi katanggap-tanggap sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang banal ayon sa anyong nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Sanggunian ng pangwakas na panghalip na הוּא
  choice: Isinalin bilang “ito” nang hindi tahasang tinutukoy kung alin ang tinutukoy.
  alternative: Tukuyin ito bilang inukit na larawan, mahahalagang metal, o gawa ng pagkuha sa mga iyon.
  rationale: Maaaring tumukoy ang panghalip sa ipinagbabawal na bagay o samsam na kaugnay ng larawan, sa larawan mismo, o mas malawak sa buong gawaing nakaugnay sa idolatriya. Pinananatili ng “ito” ang lawak ng posibleng sanggunian.
- issue: Pagpapalit mula maramihan tungo sa isahang kausap
  choice: “ninyo” sa unang utos, pagkatapos ay “mong/iyong/ka” sa mga sumunod.
  alternative: Gawing maramihan o isahan ang lahat ng panghalip para sa mas pantay na daloy.
  rationale: Maramihan ang anyo ng unang utos sa Hebreo, ngunit isahan ang mga sumunod na pandiwa at hulapi, sapagkat kinakausap ang Israel kapuwa bilang bayan at bilang isang kolektibong katauhan. Pinananatili ng salin ang pagbabagong ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang kolektibong pagbabago ng kausap mula maramihan tungo sa isahan at iniwasang linawin nang lampas sa Hebreo ang sanggunian ng mga panghalip.
