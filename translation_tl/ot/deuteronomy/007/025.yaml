  naturalness: Malinaw at marangal ang daloy sa modernong Filipino. Ang “kasuklam-suklam” ay mas likas at mas tiyak na katumbas ng תּוֹעֵבָה sa kontekstong ito kaysa “karumal-dumal,” na maaari ring magpahiwatig ng bagay na nakapangingilabot o marahas.
