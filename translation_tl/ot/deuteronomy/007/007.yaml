  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: tl
  text: Hindi dahil sa mas marami kayo kaysa sa lahat ng mga bayan kaya iniukol ni Yahweh ang kanyang pagmamahal sa inyo at pinili kayo[a], sapagkat kayo ang pinakamaliit sa lahat ng mga bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “iniukol sa inyo ang kanyang pag-ibig.” Ang pandiwang Hebreo ay nagpapahayag ng matinding pagkagiliw o pagmamahal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: dahil mas marami kayo kaysa sa lahat ng ibang bayan
  rationale: Ipinahahayag ng מִן ang paghahambing sa dami. Likas sa modernong Tagalog ang pariralang ito at malinaw nitong pinananatili ang diwang ang bilang ng Israel ay hindi dahilan ng pagpili sa kanila.
- source_word: חָשַׁק
  choice: itinuon ... sa inyo ang kanyang pagmamahal
  rationale: Ang pandiwa ay nagpapahiwatig ng matinding pagkagiliw o kusang pag-uukol ng sarili sa isang tao. Pinananatili ng salin ang aktibo at relasyonal na diwa nang hindi nagdaragdag ng sistematikong teolohiya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיִּבְחַר בָּכֶם
  choice: at pinili kayo
  rationale: Tuwirang katumbas ito ng karaniwang kahulugan ng בחר at pinananatili ang wika ng pagpili sa tipan nang walang dagdag na doktrinal na pagpapaliwanag.
- source_word: כִּי
  choice: Sa katunayan
  rationale: Sa kontekstong ito, ipinakikita ng כִּי ang paliwanag na nagpapatibay sa naunang pagtanggi. Ang “Sa katunayan” ay natural sa Tagalog at malinaw na ipinakikilala ang salungat na katotohanan tungkol sa kakaunting bilang nila.
- source_word: הַמְעַט מִכָּל הָעַמִּים
  choice: ang pinakakaunti sa lahat ng mga bayan
  rationale: Numerikal ang paghahambing sa konteksto, kaya mas tiyak ang “pinakakaunti” kaysa “pinakamaliit.”
theological_decisions:
- issue: Paglalarawan sa pagkagiliw ni Yahweh sa Israel
  choice: itinuon ni Yahweh sa inyo ang kanyang pagmamahal
  alternative: minahal kayo ni Yahweh; kumapit sa inyo ang loob ni Yahweh
  rationale: Inihahayag ang matinding kusang pagkagiliw ng חָשַׁק habang iniiwasang limitahan ito sa isang teknikal o denominasyonal na konsepto ng pag-ibig.
- issue: Pagpili ni Yahweh sa Israel
  choice: pinili kayo
  alternative: hinirang kayo
  rationale: Ang “pinili” ang pinakadirekta at pangkaraniwang katumbas. Hindi nito ipinapasok ang mga susunod na sistematikong kategorya tungkol sa pagpili na hindi tahasang sinasabi ng talata.
- issue: Pangalan ng Diyos
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Direktang pinananatili ang personal na pangalang יהוה na nasa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bayan” para sa עַמִּים upang ipakita ang mga pangkat ng tao, at pinanatili ang paghahambing sa bilang. Ang paghahati sa dalawang pangungusap ay nagpapalinaw sa paliwanag ng כִּי nang hindi binabago ang lohika ng Hebreo.
