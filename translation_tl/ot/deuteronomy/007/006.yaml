  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/ךָ֞ בָּחַ֣ר יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: tl
  text: Sapagkat ikaw ay isang bayang banal para kay Yahweh na iyong Diyos. Pinili ka ni Yahweh na iyong Diyos upang maging isang bayang natatanging pag-aari niya[a] mula sa lahat ng mga bayan sa ibabaw ng lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang bayang itinatangi niya.” Sa Hebreo, literal itong “isang bayan ng natatanging pag-aari,” na pinagsasama ang diwa ng isang bayan at ng isang pag-aaring lubhang pinahahalagahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan para sa naunang utos at likas na nagpapahayag ng paliwanag sa Tagalog.
- source_word: עַם קָדוֹשׁ
  choice: isang bayang banal
  rationale: Pinananatili ang tahasang pangngalang עַם at ang diwa ng pagiging banal o ibinukod, sa dignified at natural na Tagalog.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para kay Yahweh na iyong Diyos
  rationale: Ipinahahayag ng ל ang ugnayan at pag-aari; ang “para kay” ay malinaw nang hindi lubusang ipinapalit ang pormal na estruktura sa “pag-aari.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: בְּךָ בָּחַר
  choice: Pinili ka
  rationale: Tumpak at natural na katumbas ng pandiwang בחר; ang aspektong Tagalog ay nagpapakita ng naganap na pagpiling nananatiling mahalaga sa kasalukuyang pahayag.
- source_word: לִהְיוֹת לוֹ לְעַם סְגֻלָּה
  choice: upang maging sarili niyang bayang itinatangi
  rationale: Pinagsasama ang layunin, pag-aari, tahasang “bayan,” at ang diwa ng סְגֻלָּה bilang natatanging pinahahalagahang pag-aari.
- source_word: מִכֹּל הָעַמִּים
  choice: mula sa lahat ng mga bayan
  rationale: Ipinapakita ang pagpili mula sa hanay ng mga bayan at hindi nagdaragdag ng ideya ng likas na kahigitan.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: sa ibabaw ng lupa
  rationale: Natural na Tagalog para sa Hebreong idyoma habang pinananatili ang larawan ng ibabaw ng daigdig.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Nasa Hebreo ang mismong tipanang pangalan; pinananatili itong pangalan sa halip na palitan ng isang titulo.
- issue: Diwa ng pagpili sa מִכֹּל הָעַמִּים
  choice: mula sa lahat ng mga bayan
  alternative: higit sa lahat ng mga bayan
  rationale: Ang מן ay nagsasaad dito ng pagpili mula sa isang pangkat; hindi kailangan ng teksto ang paghahambing na nagpapahiwatig ng likas na kahigitan.
- issue: Ugnayan ng עַם at סְגֻלָּה
  choice: bayang itinatangi
  alternative: natatanging pag-aari
  rationale: Pinananatili ang tahasang “bayan” at ang pagpapahalaga/pag-aaring ipinahihiwatig ng סְגֻלָּה, habang inilalagay sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa covenant people at “itinatangi” para sa espesyal na pagpapahalaga, nang hindi nagdaragdag ng denominasyonal na pakahulugan.
