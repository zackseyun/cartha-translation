  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: tl
  text: Kaya alamin mo[a] na si Yahweh na iyong Diyos ay siyang Diyos, ang tapat na Diyos, na tumutupad sa tipan at nagpapakita ng tapat na pag-ibig[b] sa mga umiibig sa kanya at tumutupad sa kanyang mga utos, hanggang sa isang libong salinlahi[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At alamin mo” o “Kaya dapat mong malaman”; maaaring simpleng pagpapatuloy o paghinuha mula sa naunang konteksto ang pang-ugnay sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: חֶסֶד (ḥesed); maaari ring “matatag na pag-ibig,” “katapatan sa tipan,” o “awa.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa loob ng isang libong salinlahi.” Ang pananalita ay nagpapahayag ng napakahabang pananatili ng katapatan ng Diyos sa tipan.
    reason: lexical_alternative
  - marker: d
    text: 'Maaari ring unawain: “sa mga umiibig sa kanya at tumutupad sa kanyang mga utos, sa loob ng isang libong salinlahi.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Kaya alamin mo
  rationale: Ang Qal perfect na 2ms ay may puwersang nag-uutos o humihimok sa konteksto. Ipinahahayag ng “kaya” ang maaaring inferensiyal na gamit ng pang-ugnay, habang inilalahad sa talababa ang iba pang posibleng ugnayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo at ang kabuluhang tipan nito.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Likas na salin ng anyong construct na may hulaping pangalawang panauhang panlalaki na isahan.
- source_word: הוּא הָאֱלֹהִים
  choice: ay siyang Diyos
  rationale: Ipinahahayag ng “siyang” ang diin ng panghalip na הוּא at ang eksklusibong pahayag, nang hindi nagiging asiwa sa modernong Tagalog.
- source_word: הָאֵל הַנֶּאֱמָן
  choice: ang tapat na Diyos
  rationale: Ang אֵל ay appositional at ang נֶאֱמָן ay nangangahulugang matatag, mapagkakatiwalaan, at tapat; “tapat na Diyos” ang malinaw at marangal na katumbas.
- source_word: שֹׁמֵר הַבְּרִית
  choice: tumutupad sa tipan
  rationale: Ang participle ay naglalarawan ng patuloy at katangiang pagkilos. Sa Tagalog, “tumutupad sa tipan” ang mas likas kaysa literal na “nag-iingat ng tipan” at pinananatili ang diwa ng pagiging tapat dito.
- source_word: וְהַחֶסֶד
  choice: at nagpapakita ng tapat na pag-ibig
  rationale: Sa konteksto ng tipan, ang חֶסֶד ay pag-ibig na matatag at may katapatan. Ang pandiwang “nagpapakita” ay likas na inuugnay ang paralelong layon sa naunang participle nang hindi binabago ang kahulugan.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: sa mga umiibig sa kanya at tumutupad sa kanyang mga utos
  rationale: Pinananatili ang magkatulad na participial na paglalarawan sa mga tumatanggap ng katapatan sa tipan; ang “tumutupad” ay natural na salin ng pag-iingat o pagsunod sa mga utos.
- source_word: לְאֶלֶף דּוֹר
  choice: hanggang sa isang libong salinlahi
  rationale: Ipinahahayag ang napakahabang saklaw ng katapatan sa tipan at maayos na inihihiwalay ito sa mga benepisyaryo ng naunang mga parirala.
theological_decisions:
- issue: Ang katapatan ng Diyos sa tipan kaugnay ng pag-ibig at pagsunod ng tao
  choice: Inilalarawan ang Diyos na tumutupad sa tipan at nagpapakita ng tapat na pag-ibig sa mga umiibig sa kanya at tumutupad sa kanyang mga utos.
  alternative: Maaaring idiin ang חֶסֶד bilang awa o katapatan sa tipan, at maaaring iugnay ang “isang libong salinlahi” sa buong pariralang tumutukoy sa mga umiibig at sumusunod.
  rationale: Pinananatili ng salin ang mismong pagkakaugnay sa talata ng katapatan ng Diyos, ng tipan at חֶסֶד, at ng pag-ibig at pagsunod ng bayan, nang hindi nilulutas ang tensiyong teolohikal sa pamamagitan ng isang sistemang doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tipan,” “salinlahi,” at “mga utos” para sa malinaw na rehistrong biblikal; iniwasan ang lumang “kagandahang-loob” bilang pangunahing salin ng חֶסֶד dahil hindi nito sapat na ipinahahayag ang matatag at tipanang pag-ibig.
