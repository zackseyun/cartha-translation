  source_fidelity: 'Tumpak sa pangkalahatan ang pangunahing salin: ang pag-aalis ng mga bansa ay unti-unti, hindi sila kayang lipulin agad, at ang dahilan ay ang pagdami ng mababangis na hayop. Ang “maging panganib sa iyo” ay isang maingat at natural na pagpapahayag ng mapaminsalang ugnayang nasa עָלֶיךָ. Gayunman, mali ang kasalukuyang talababa [a]: ang “aalisan ng pag-aari” ay nagpapahiwatig na pag-aari ng Israel ang mga bansang pinapaalis at hindi wastong katumbas ng pandiwang נשל sa kontekstong ito.'
  naturalness: Malinaw at marangal ang Tagalog. Mas matipid at likas ang “baka” kaysa sa magkasunod na “kung hindi ay baka,” na kapwa nagsasaad ng babalang bunga.
  terminology: Ang “Yahweh,” “mga bansang ito,” “lipulin,” at “mababangis na hayop” ay angkop sa modernong Filipino Tagalog at sa konteksto. Pinananatili ng “mula sa harap mo” ang spatial na idyoma ng Hebreo.
