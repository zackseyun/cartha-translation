base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: tl
  text: Unti-unting palalayasin ni Yahweh na iyong Diyos ang mga bansang ito mula sa harap mo.[a] Hindi mo sila kayang lipulin agad, baka dumami ang mababangis na hayop[b] at maging panganib sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “unti-unti niyang aalisin ang mga bansang ito mula sa harap mo.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga hayop ng parang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל
  choice: palalayasin
  rationale: Ipinapahayag ng pandiwa ang pagpapaalis sa mga bansa mula sa lupaing nasa harap ng Israel. Natural at malinaw sa makabagong Tagalog ang “palalayasin,” habang nananatili sa talab na militar at panteritoryo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa anyong “Yahweh” ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: הַגּוֹיִם הָאֵל
  choice: ang mga bansang ito
  rationale: Pinananatili ng “mga bansa” ang panlipunan at panteritoryong diwa ng גּוֹיִם, at tinutumbasan ng “ito” ang demonstratibo.
- source_word: מִפָּנֶיךָ
  choice: mula sa harap mo
  rationale: Pinananatili nito ang larawang pangkalawakan ng Hebreong idyoma, na tumutukoy sa pag-aalis sa mga bansang nakaharap sa Israel.
- source_word: מְעַט מְעָט
  choice: unti-unti
  rationale: Natural na katumbas ito ng inuulit na Hebreong parirala na nagsasaad ng unti-unting pagkilos.
- source_word: לֹא תוּכַל כַּלֹּתָם מַהֵר
  choice: Hindi mo sila kayang lipulin agad
  rationale: Ipinahahayag ng “hindi mo ... kayang” ang kawalan ng kakayahan, at ng “lipulin” ang ganap na pagwawakas sa mga bansang tinutukoy, nang hindi gumagamit ng masyadong kolokyal na pananalita.
- source_word: פֶּן
  choice: kung hindi ay baka
  rationale: Natural nitong ipinapahayag sa Tagalog ang babala hinggil sa maaaring masamang bunga.
- source_word: תִּרְבֶּה עָלֶיךָ
  choice: dumami ... at maging panganib sa iyo
  rationale: Ang pandiwa ay nangangahulugang dumami, samantalang ang עָלֶיךָ sa konteksto ay nagpapahiwatig ng mapanganib o masamang epekto sa Israel. Ginawang malinaw ang ugnayang ito sa natural na Tagalog nang hindi nagdaragdag ng tiyak na paraan ng pananakit.
- source_word: חַיַּת הַשָּׂדֶה
  choice: mababangis na hayop
  rationale: Ito ang malinaw na makabagong Tagalog para sa mga hayop ng parang o ilang, bilang kaibahan sa mga alagang hayop.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng כַּלֹּתָם
  choice: lipulin sila
  alternative: ubusin sila
  rationale: Pinananatili ng “lipulin” ang diwa ng pagdadala sa ganap na wakas sa konteksto ng pag-aalis sa mga bansa, ngunit hindi nililinaw nang higit sa sinasabi ng talata ang lahat ng paraan o saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kayang” bilang natural na modal at “lipulin” bilang tuwiran ngunit hindi kolokyal. Inilagay ang panandang [b] kasunod ng pariralang tinutukoy mismo ng talababa.
