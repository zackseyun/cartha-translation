  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: tl
  text: Aalisin sa iyo ni Yahweh ang lahat ng sakit, at hindi niya ipapataw sa iyo ang alinman sa masasamang karamdaman ng Ehipto[a] na alam mo[b]. Sa halip, ipapataw niya ang mga iyon sa lahat ng napopoot sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapaminsalang mga karamdaman ng Ehipto” o “malulubhang karamdaman ng Ehipto.” Ang salitang Hebreo ay maaaring tumukoy sa masama, mapaminsala, o malubha.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na naranasan mo.” Ang Hebreong “alam” ay maaaring tumukoy rito sa pagkakilalang bunga ng karanasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: Aalisin
  rationale: Ang Hiphil ng סור ay nagsasaad ng pagpapalayo o pag-aalis. Likas sa Filipino ang “aalisin” at malinaw nitong pinananatili ang sanhiang diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: מִמְּךָ
  choice: sa iyo
  rationale: Ipinahihiwatig ng מן na ang sakit ay aalisin mula sa taong kinakausap; natural itong ipinapahayag sa Filipino sa pariralang “aalisin sa iyo.”
- source_word: כָּל חֹלִי
  choice: lahat ng sakit
  rationale: Ang חֹלִי ay sakit o karamdaman. Ang “lahat ng sakit” ay tuwiran, natural, at kolektibong pagpapahayag.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: masasamang karamdaman ng Ehipto
  rationale: Ang מַדְוֶה ay karamdaman, samantalang ang רַע ay maaaring mangahulugang masama, mapaminsala, o malubha. Pinananatili ng “masasamang karamdaman” ang lawak ng pangunahing salitang Hebreo, at inilalahad sa talababa ang iba pang posibleng pakahulugan.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: na alam mo
  rationale: Ang ידע ay maaaring tumukoy kapuwa sa pagkakaalam at sa pagkakilala sa pamamagitan ng karanasan. Ang “alam mo” ay hindi tahasang nagpapasya sa pagitan ng dalawang diwang ito.
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: hindi niya ipapataw sa iyo ang alinman
  rationale: Ang שׂים na may ב ay tumutukoy sa paglalagay o pagpapataw sa isang tao. Ang “ipapataw” ay natural sa konteksto ng karamdaman at pinananatili ang negatibong pahayag.
- source_word: וּנְתָנָם
  choice: Sa halip, ipapataw niya ang mga iyon
  rationale: Bagaman karaniwang “ibigay” ang נתן, sa kontekstong ito ay tumutukoy ito sa paglalagay ng mga karamdaman sa iba. Nililinaw ng “sa halip” ang tunay na pagsalungat ng dalawang sugnay nang hindi nagdaragdag ng bagong doktrina.
- source_word: בְּכָל שֹׂנְאֶיךָ
  choice: sa lahat ng napopoot sa iyo
  rationale: Ang participle na שֹׂנְאֶיךָ ay literal na tumutukoy sa mga napopoot sa kinakausap, na mas tiyak kaysa sa mas malawak na “mga kaaway.”
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng pangako tungkol sa mga karamdaman
  choice: Isinalin bilang kongkretong pangako sa loob ng konteksto ng tipan
  alternative: Isang pangkalahatan at walang-kondisyong pangako na hindi magkakasakit ang bawat indibidwal kailanman
  rationale: Tahasang nagsasalita ang talata tungkol sa sakit at mga karamdaman ng Ehipto, ngunit hindi nito mismo pinalalawak ang pangako bilang pangkalahatang doktrina ng palagiang kalusugan.
- issue: Diwa ng ידע sa pariralang אֲשֶׁר יָדַעְתָּ
  choice: na alam mo
  alternative: na naranasan mo
  rationale: Maaaring simpleng kaalaman o kaalamang bunga ng karanasan ang tinutukoy. Pinananatili sa pangunahing teksto ang mas malawak na pahayag at inilalagay sa talababa ang tahasang eksperiyensiyal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang isahang kausap sa “iyo/mo,” ang personal na pangalang Yahweh, at ang konkretong wika ng pagpapataw ng karamdaman. Iniwasan ang sobrang teknikal, makaluma, o denominasyonal na pananalita.
