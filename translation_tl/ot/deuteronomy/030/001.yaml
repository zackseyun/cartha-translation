  source_fidelity: 'Tapat ang karamihan ng salin sa Hebreo: naipapahayag ang darating na pagpapala at sumpa, ang paglalagay ng mga ito sa harap ng kausap, at ang pagsasapuso/paggunita sa mga ito. Gayunman, ang “pinagtapunan sa iyo” ay hindi wastong Tagalog at hindi malinaw na naihahayag ang הִדִּיחֲךָ, “itinaboy/itinulak palayo ka.”'
  naturalness: Marangal at pangkalahatang natural ang rehistro, at ang nakabiting pangungusap ay angkop dahil nagpapatuloy ang sintaks sa susunod na talata. Kailangan lamang ayusin ang pariralang tumutukoy sa pagpapatapon upang maging malinaw at idiomatiko.
  terminology: Ang “Yahweh na iyong Diyos,” “pagpapala,” at “sumpa” ay wasto at pare-pareho sa tekstong pinagmulan. Ang “isapuso” ay katanggap-tanggap na modernong Tagalog; pinananatili ng talababa ang larawang Hebreo at ang aspektong pag-alaala/pagsasaalang-alang.
