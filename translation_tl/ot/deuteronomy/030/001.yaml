language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: tl
  text: At mangyayari, kapag dumating sa iyo ang lahat ng bagay na ito—ang pagpapala at ang sumpang inilagay ko sa harap mo—at isapuso mo ang mga ito[a] sa gitna ng lahat ng bansang kung saan ka itinaboy ni Yahweh na iyong Diyos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibalik mo sa iyong puso”; maaari ring unawain na “alalahanin at pag-isipan mo ang mga ito.”
    reason: Pinananatili ang literal na larawang Hebreo at ang saklaw nito mula sa pag-alaala hanggang sa taimtim na pagsasaalang-alang.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At mangyayari, kapag
  rationale: Pinananatili ang pormulang nagpapakilala sa isang kalagayang magaganap sa hinaharap, ngunit natural pa rin sa marangal na Tagalog.
- source_word: יָבֹאוּ עָלֶיךָ
  choice: dumating sa iyo
  rationale: Malapit sa larawang Hebreo na ang mga pangyayari ay ‘dumarating’ sa isang tao, at malinaw sa Tagalog.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ang lahat ng bagay na ito
  rationale: Sa konteksto, tumutukoy ang דְּבָרִים sa mga nabanggit na kahihinatnan ng tipan, hindi lamang sa mga binigkas na salita.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: ang pagpapala at ang sumpa
  rationale: Direkta at karaniwang salin ng magkatapat na kahihinatnan ng tipan.
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: na inilagay ko sa harap mo
  rationale: 'Inihahayag ang idyomatikong diwa ng נתן na may לְפָנֶיךָ: paglalagay o paghaharap ng isang bagay sa isang tao.'
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: at isapuso mo ang mga ito
  rationale: Natural na Tagalog para sa literal na ‘ibalik mo sa iyong puso,’ na saklaw ang pag-alaala, pagbubulay, at taimtim na pagtanggap nang hindi nililimitahan sa damdamin lamang.
- source_word: בְּכָל הַגּוֹיִם
  choice: habang nasa gitna ka ng lahat ng bansa
  rationale: Ipinahihiwatig ng בְּ ang pananatili ng Israel sa gitna ng mga banyagang bayan sa pagkakatapon.
- source_word: הִדִּיחֲךָ
  choice: pinagtapunan sa iyo
  rationale: Ipinapakita ang sapilitang pagpapaalis at pagpapakalat sa pagkakatapon; ang ‘pinagtapunan’ ay matindi ngunit natural sa Tagalog.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang tipan na nakasulat sa Hebreo at ang ugnayang ‘iyong Diyos.’
- source_word: שָׁמָּה
  choice: —
  rationale: Ang patutunguhang diwa ng שָׁמָּה ay likas nang nakapaloob sa ‘pinagtapunan sa iyo’; hindi na kailangan ang hiwalay na ‘doon,’ na magiging mabigat sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng ‘Yahweh’ ang pagkakaiba nito sa titulong ‘Panginoon’ nang hindi nagdaragdag ng sektaryong paliwanag.
- issue: Saklaw ng ‘puso’ sa וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: isapuso mo ang mga ito
  alternative: alalahanin mo ang mga ito; ibalik mo sa iyong puso
  rationale: Ang Hebreong ‘puso’ ay maaaring tumukoy sa pag-iisip at panloob na pagsasaalang-alang, hindi lamang sa emosyon. Ang ‘isapuso’ ay natural ngunit nililinaw sa talababa ang literal na larawan upang mapanatili ang lawak at bahagyang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang isahan na ‘ikaw’ ayon sa Hebreo. Nananatiling bukas ang pangungusap sa kuwit sapagkat nagpapatuloy ang kondisyong sintaktiko sa Deuteronomio 30:2.
