reference: Deuteronomy 30:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שַׁבְתָּ֞ עַד יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/שָׁמַעְתָּ֣ בְ/קֹל֔/וֹ כְּ/כֹ֛ל אֲשֶׁר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם אַתָּ֣ה וּ/בָנֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: tl
  text: at magbalik ka kay Yahweh na iyong Diyos at sundin mo ang kanyang tinig[a], ayon sa lahat ng iniuutos ko sa iyo ngayon—ikaw at ang iyong mga anak[b]—nang buong puso mo at nang buo mong pagkatao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pakinggan mo ang kanyang tinig.” Sa idyomang Hebreo, ang pakikinig ay karaniwang may diwang pagsunod.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak na lalaki”; maaari itong tumukoy rito sa mga anak o supling sa pangkalahatan.
    reason: lexical_alternative
  - marker: c
    text: O “nang buong kaluluwa mo” o “nang buong buhay mo.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa buhay, sarili, o buong pagkatao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ עַד יְהוָה אֱלֹהֶיךָ
  choice: at magbalik ka kay Yahweh na iyong Diyos
  rationale: Pinananatili ng “magbalik” ang kongkretong diwa ng שׁוּב at ang pahiwatig ng muling paglapit sa Diyos, nang hindi ito agad nililimitahan sa teolohikal na terminong “magsisi.” Isinasalin ang pangalan ng tipan na יְהוָה bilang “Yahweh.”
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: at sundin mo ang kanyang tinig
  rationale: Ang idyomang שׁמע בקול ay karaniwang nangangahulugang makinig nang may pagsunod. Pinananatili ng “sundin ... ang tinig” kapwa ang lakas ng idyoma at ang larawang nasa Hebreo.
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ayon sa lahat ng iniuutos ko sa iyo ngayon
  rationale: Ipinahahayag ng “ayon sa lahat” ang buong saklaw ng utos, samantalang natural na itinatapat ng “iniuutos ... ngayon” ang Hebreong participle at temporal na parirala.
- source_word: אַתָּה וּבָנֶיךָ
  choice: ikaw at ang iyong mga anak
  rationale: Bagaman literal na “mga anak na lalaki,” maaaring tumukoy ang בנים sa mga supling sa pangkalahatan sa kontekstong ito ng tipan; mas tumpak sa saklaw ang “mga anak.”
- source_word: בְּכָל לְבָבְךָ
  choice: nang buong puso mo
  rationale: Likas at marangal itong katumbas ng pormulang Hebreo; saklaw ng “puso” rito ang kalooban at panloob na pagkatao.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: at nang buo mong pagkatao
  rationale: Malawak ang saklaw ng נֶפֶשׁ—sarili, buhay, o buong persona. Iniiwasan ng “buong pagkatao” ang posibleng makitid na modernong pagkaunawa sa “kaluluwa” habang pinananatili ang kabuuang pag-aalay ng sarili.
theological_decisions:
- issue: Paglalarawan sa pagbabalik sa Diyos
  choice: magbalik ka kay Yahweh
  alternative: magsisi ka at manumbalik kay Yahweh
  rationale: May pahiwatig ng pagsisisi ang konteksto, ngunit ang pandiwang שׁוּב ay pangunahing “bumalik/magbalik.” Pinananatili ng salin ang kongkretong salita at hindi nagdaragdag ng hiwalay na terminong wala sa teksto.
- issue: Paglilipat sa pangalan ng tipan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng בָנֶיךָ
  choice: iyong mga anak
  alternative: iyong mga anak na lalaki
  rationale: Maaaring gamitin ang panlalaking maramihan para sa mga supling sa pangkalahatan. Hindi nararapat gawing eksklusibong lalaki ang tinutukoy kung hindi iyon hinihingi ng konteksto.
- issue: Kahulugan ng נֶפֶשׁ
  choice: buo mong pagkatao
  alternative: buong kaluluwa mo
  rationale: Ang נֶפֶשׁ ay maaaring mangahulugang kaluluwa, buhay, sarili, o buong pagkatao. Ang napiling salin ay natural sa modernong Filipino at pinananatili ang antropolohikal na lawak nang hindi ipinipilit ang isang makitid na teknikal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “magbalik,” “sundin ang kanyang tinig,” at “buong pagkatao” upang mapanatili ang mga larawang Hebreo at ang lawak ng kahulugan nang hindi maging lipas o labis na teknikal. Ang mga gitling na em dash ay malinaw na nagtatakda sa pariralang “ikaw at ang iyong mga anak” bilang paksa ng pagbabalik at pagsunod.
