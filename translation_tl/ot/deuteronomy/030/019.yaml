base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: tl
  text: 'Tinatawag ko ngayon ang langit at lupa bilang mga saksi laban sa iyo: inilagay ko sa harap mo ang buhay at kamatayan, ang pagpapala at sumpa. Piliin mo ang buhay, upang mabuhay ka at ang iyong mga inapo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ikaw at ang iyong mga supling”; literal, “ikaw at ang iyong binhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: Tinatawag ko ... bilang mga saksi laban sa iyo
  rationale: 'Pinananatili nito ang legal at pangtipang diwa ng Hiphil ng עוּד kasama ng בָכֶם: hindi lamang pagbibigay-babala kundi pormal na pagtawag ng mga saksi laban sa kinakausap.'
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Likas na modernong Tagalog na nagpapanatili sa temporal na diin ng Hebreo.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ang langit at lupa
  rationale: Karaniwang idyomatikong pares sa Tagalog at angkop sa pormula ng mga saksing pangtipan.
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: ang buhay at kamatayan
  rationale: Tuwirang inilalarawan ang magkasalungat na mga kahihinatnan ng tipan.
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: inilagay ko sa harap mo
  rationale: Tumpak at natural na paglalarawan ng mga pagpiling inihaharap sa isang tao.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: ang pagpapala at sumpa
  rationale: Pinananatili ang isahang anyo at malinaw na paghahambing sa Hebreo.
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: Kaya piliin mo ang buhay
  rationale: Ang waw ay nauunawaan dito bilang nag-uugnay sa naunang paghaharap ng mga pagpipilian at sa kasunod na panawagan; ang “Kaya” ay natural sa Tagalog ngunit hindi nagdaragdag ng hiwalay na doktrinal na konklusyon.
- source_word: לְמַעַן תִּחְיֶה
  choice: upang mabuhay
  rationale: Pinananatili ang layunin o nilalayong resulta ng לְמַעַן.
- source_word: אַתָּה וְזַרְעֶךָ
  choice: ka at ang iyong mga salinlahi
  rationale: Ang זֶרַע ay kolektibong tumutukoy sa mga anak o inapo; malinaw sa modernong Tagalog ang “mga salinlahi” para sa patuloy na lahi ng kinakausap.
theological_decisions:
- issue: Legal at pangtipang papel ng langit at lupa
  choice: Inilarawan ang langit at lupa bilang mga saksing tinatawag laban sa Israel.
  alternative: “Pinatototohanan ko sa iyo ngayon sa harap ng langit at lupa” o “Binabalaan kita ngayon.”
  rationale: Ang Hebreo ay may pormal at hudisyal na himig ng pagharap ng mga saksi sa konteksto ng tipan; hindi ito dapat gawing pangkalahatang babala lamang.
- issue: Isahang ikalawang panauhan na kumakatawan sa Israel
  choice: Ginamit ang isahang “iyo/mo/ka,” kasunod ng gramatika ng Hebreo, at pinalawak sa “iyong mga salinlahi.”
  alternative: Maramihang “ninyo/kayo” o tahasang “Israel.”
  rationale: Ang 2ms ay kumakausap sa Israel bilang iisang katuwang sa tipan. Kayang panatilihin ng Tagalog ang anyong ito nang hindi nilulutas ang representatibong tensiyon sa pamamagitan ng paraphrase.
- issue: Ugnayan ng waw sa utos na pumili
  choice: “Kaya piliin mo”
  alternative: “At piliin mo” o “Piliin mo”
  rationale: Maaaring simple o lohikal/resultatibo ang waw. Pinili ang “Kaya” bilang natural na pagpapahayag ng ugnayan sa konteksto, habang kinikilalang posible ang mas pormal na “At.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na himig ng panawagang pangtipan, iniwasan ang makalumang “maging saksi” bilang pangunahing balangkas, at hindi nagdagdag ng denominasyonal na paliwanag.
