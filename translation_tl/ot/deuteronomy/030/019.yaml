  naturalness: Marangal at natural ang Tagalog ng talata. Mas tuwiran at idiomatiko ang “mga inapo” kaysa “mga salinlahi” para sa זַרְעֶךָ sa pangungusap na ito; ang “mga salinlahi” ay mas madaling maunawaang magkakasunod na henerasyon kaysa mga supling/descendant mismo.
  terminology: Ang “mga saksi laban sa iyo,” “pagpapala,” at “sumpa” ay angkop at pinananatili ang legal/pangtipang rehistro. Ang “mga inapo” ay malawak na katumbas ng kolektibong “binhi/offspring.”
