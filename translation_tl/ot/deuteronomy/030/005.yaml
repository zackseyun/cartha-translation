revisions:
- from: At dadalhin ka ni Yahweh na iyong Diyos sa lupaing inangkin ng iyong mga ninuno[a], at aangkinin mo iyon; gagawan ka niya ng mabuti[b] at pararamihin nang higit kaysa sa iyong mga ninuno.
  to: At dadalhin ka ni Yahweh, ang iyong Diyos, sa lupaing inangkin ng iyong mga ama[a], at aangkinin mo iyon; magiging mabuti siya sa iyo[b] at pararamihin ka niya nang higit kaysa sa iyong mga ama.
  rationale: Inayos ang nawawalang layon at simuno sa huling sugnay, ginawang mas malinaw ang apposition kay Yahweh, at ibinalik ang tahasang “mga ama” ayon sa Hebreo. Ang pagsasalin sa וְהֵיטִבְךָ ay ginawang natural ngunit hindi ikinulong sa materyal na kasaganaan; ang mas literal at mga alternatibo ay nasa talababa.
