  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: tl
  text: At dadalhin ka ni Yahweh, ang iyong Diyos, sa lupaing inangkin ng iyong mga ama[a], at aangkinin mo iyon; magiging mabuti siya sa iyo[b] at pararamihin ka niya nang higit kaysa sa iyong mga ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “minana” o “inari.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagmamana o pagkuha at paghawak ng pag-aari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagpapalain ka niya” o “pasasaganain ka niya.” Sa literal, “gagawa siya ng mabuti sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: at dadalhin ka
  rationale: Ang Hiphil ng בוא na may hulaping 2ms ay nangangahulugang ‘dadalhin ka’ o ‘papapasukin ka.’ Hindi idinagdag ang ‘pabalik’ dahil ipinahihiwatig lamang iyon ng konteksto at wala sa mismong pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Tuwirang katumbas ng anyong construct na may hulaping ikalawang panauhang panlalaki; natural itong ikinakabit sa pangalang Yahweh sa Filipino.
- source_word: הָאָרֶץ
  choice: sa lupain
  rationale: Sa konteksto ng Deuteronomio, tumutukoy ito sa lupang ipinangako. Mas malinaw ang ‘lupain’ kaysa pangkalahatang ‘lupa.’
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: na inangkin ng iyong mga ninuno
  rationale: Ang ירשׁ ay maaaring mangahulugang magmana, mag-angkin, o ariin. Dito, aktuwal na pag-aari o pag-angkin ng lupain ng mga naunang salinlahi ang tinutukoy.
- source_word: וִירִשְׁתָּהּ
  choice: at aangkinin mo iyon
  rationale: Pinananatili ang pag-uulit ng ugat na ירשׁ at ang aktibong diwa ng pagkuha at paghawak sa lupain.
- source_word: וְהֵיטִבְךָ
  choice: gagawan ka niya ng mabuti
  rationale: Literal at natural na inililipat ang Hiphil ng יטב bilang paggawa ng mabuti sa isang tao, nang hindi nililimitahan ang biyaya sa materyal na kasaganaan lamang.
- source_word: וְהִרְבְּךָ
  choice: at pararamihin
  rationale: Ipinahahayag ng Hiphil ng רבה ang pagpaparami o paggawa sa bayan na higit na marami, na may alingawngaw ng pangako sa mga patriyarka.
- source_word: מֵאֲבֹתֶיךָ
  choice: nang higit kaysa sa iyong mga ninuno
  rationale: Ang pahambing na מן ay nagsasaad na lalampas ang bilang o pagdami sa naunang mga salinlahi.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong pangalan at hindi pinapalitan ng titulo.
- issue: Saklaw ng וְהֵיטִבְךָ
  choice: gagawan ka niya ng mabuti
  alternative: pagpapalain ka niya; pasasaganain ka niya
  rationale: Pinananatili ng piniling anyo ang malawak na kahulugan ng paggawa ng mabuti at hindi tahimik na ipinapakahulugang materyal na kasaganaan lamang.
- issue: Paglilipat sa אֲבֹתֶיךָ
  choice: iyong mga ninuno
  alternative: iyong mga ama
  rationale: Bagaman panlalaking maramihan ang anyo, sa konteksto tumutukoy ito sa mga naunang salinlahi o mga ninunong Israelita. Ang ‘mga ninuno’ ang natural at malinaw na modernong Filipino nang hindi binabago ang referent.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘lupain’ para sa heograpikong pangako, ‘aangkinin’ upang mapanatili ang ugnayang leksikal ng dalawang anyo ng ירשׁ, at ‘mga ninuno’ bilang pinakanatural na pagtukoy sa mga naunang salinlahi ng Israel.
