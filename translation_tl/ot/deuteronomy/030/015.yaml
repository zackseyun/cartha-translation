  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili nito ang panawag-pansin na רְאֵה, ang perpektong “inilagay ko,” ang “sa harap mo,” at ang apat na magkakatapat na termino: buhay, mabuti, kamatayan, at masama. Ang “ngayon” ay katanggap-tanggap na makabagong katumbas ng הַיּוֹם sa talatang ito.'
