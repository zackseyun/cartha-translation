base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/015.yaml
  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: tl
  text: Tingnan mo, inilagay ko sa harap mo ngayon ang buhay at ang mabuti, at ang kamatayan at ang masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “masama” ay maaari ring mangahulugang “kapahamakan” o “pinsala” sa ilang konteksto; dito ay tuwiran itong itinatapat sa “mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Isang pautos na panawag-pansin. Pinananatili nito ang tuwirang paghimok ng Hebreo at ang pang-isahang kausap.
- source_word: נָתַתִּי
  choice: inilagay ko
  rationale: Bagaman maaaring mangahulugang “ibinigay,” sa pariralang “sa harap mo” ay likas itong nagpapahayag ng paglalatag ng mga mapagpipilian.
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Tuwirang katumbas ng idyomang nagsasaad na ang mga pagpipilian ay inihaharap sa kausap.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na makabagong salin ng temporal na pananalita; ipinahihiwatig ng konteksto ang mismong araw na iyon.
- source_word: הַחַיִּים
  choice: ang buhay
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwan itong abstraktong pangngalang nangangahulugang “buhay.”
- source_word: הַטּוֹב
  choice: ang mabuti
  rationale: Pinananatili ang malawak at substantibong kahulugan ng Hebreo at ang tuwirang pagkakatapat nito sa “ang masama,” sa halip na paliitin sa kasaganaan o kaginhawahan.
- source_word: הַמָּוֶת
  choice: ang kamatayan
  rationale: Tuwirang salin ng pangngalang itinatapat sa buhay.
- source_word: הָרָע
  choice: ang masama
  rationale: Pinananatili ang malawak na saklaw ng salitang Hebreo, na maaaring tumukoy sa moral na kasamaan at, ayon sa konteksto, sa kapahamakan o masamang bunga.
theological_decisions:
- issue: Kahulugan ng הָרָע sa tipanang pagtatapat
  choice: ang masama
  alternative: ang kapahamakan
  rationale: Ang “masama” ay nagpapanatili sa moral at malawak na lakas ng pagtatapat na buhay/mabuti laban sa kamatayan/masama, habang hindi tuluyang ikinakaila ang posibleng diwa ng pinsala o kapahamakan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pang-isahang “mo” ayon sa anyong Hebreo. Pinanatili ang balanseng pagkakatapat ng “buhay / mabuti” at “kamatayan / masama.”
