  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: tl
  text: Pasasaganain ka ni Yahweh na iyong Diyos sa lahat ng gawain ng iyong mga kamay[a], sa bunga ng iyong sinapupunan, sa bunga ng iyong mga alagang hayop, at sa bunga ng iyong lupa, para sa ikabubuti mo. Sapagkat muling magagalak si Yahweh sa iyo para sa ikabubuti mo, gaya ng pagkagalak niya sa iyong mga ninuno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “bibigyan ka ng kasaganaan” o “pagpapaunlarin ka.” Ang pandiwang Hebreo ay may diwang pangyayaring magkaroon ng kasaganaan o labis.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga ama”; tumutukoy sa mga ninuno o naunang mga salinlahi ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: Pasasaganain ka
  rationale: 'Ipinahahayag nito ang causative na diwa ng Hiphil: pangyayarihin ni Yahweh na magkaroon ang kausap ng sagana o labis, ayon sa kongkretong talaan ng mga pagpapalang kasunod.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: sa lahat ng gawain ng iyong mga kamay
  rationale: Likas na idyomang Filipino ito para sa lahat ng paggawa o pinagkakaabalahan ng isang tao; ginawang maramihan ang “mga kamay” para sa natural na Filipino kahit isahan ang Hebreo.
- source_word: בִּפְרִי בִטְנְךָ
  choice: sa bunga ng iyong sinapupunan
  rationale: Pinananatili ang metapora ng Hebreo para sa mga anak o supling at ang kaugnayan nito sa pormula ng pagpapala.
- source_word: בְהֶמְתְּךָ
  choice: iyong mga alagang hayop
  rationale: Saklaw nito ang domestikadong mga hayop sa kontekstong agrikultural at hindi lamang baka.
- source_word: אַדְמָתְךָ
  choice: iyong lupa
  rationale: Tumutukoy ito sa lupang sinasaka na nagbubunga, hindi pangunahin sa teritoryo o bansa.
- source_word: לְטוֹבָה / לְטוֹב
  choice: para sa ikabubuti mo
  rationale: Malinaw nitong ipinahahayag ang kapaki-pakinabang na bunga ng kasaganaan at ng muling pagkagalak ni Yahweh, habang hindi ito ginagawang mas tiyak na “pagpapala” o “kasaganaan.”
- source_word: יָשׁוּב ... לָשׂוּשׂ
  choice: muling magagalak
  rationale: Ang literal na “babalik upang magalak” ay idyomatikong nagsasaad ng panibagong pagkilos; natural itong ipinahahayag ng “muli.”
- source_word: אֲבֹתֶיךָ
  choice: iyong mga ninuno
  rationale: Sa konteksto, ang “mga ama” ay tumutukoy sa naunang mga salinlahi o mga ninuno ng Israel. Ang “mga ninuno” ay mas malinaw sa kasalukuyang Filipino, habang itinatala sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyon sa halip na palitan ng titulo.
- issue: Saklaw ng אֲבֹתֶיךָ
  choice: iyong mga ninuno
  alternative: iyong mga ama
  rationale: Ang anyong Hebreo ay panlalaki at literal na “mga ama,” ngunit sa kontekstong ito maaari itong tumukoy sa mga patriyarka o mas malawak na naunang salinlahi. Pinili ang malinaw at natural na “mga ninuno” nang hindi itinatago ang literal na anyo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga kongkretong metapora ng “bunga” at “sinapupunan,” ngunit ginamit ang natural na idyomang “gawain ng iyong mga kamay.” Ang panghalip na isahan ay pinanatili alinsunod sa tekstong Hebreo, bagaman kolektibong Israel ang kausap sa konteksto.
