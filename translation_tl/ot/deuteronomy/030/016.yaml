base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: tl
  text: 'na iniuutos ko sa iyo ngayon: ibigin mo si Yahweh na iyong Diyos, lumakad ka sa kanyang mga daan, at sundin ang kanyang mga utos, mga tuntunin, at mga hatol[a]. Sa gayon, mabubuhay ka at darami[b], at pagpapalain ka ni Yahweh na iyong Diyos sa lupaing papasukan mo[c] upang angkinin iyon[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pasiya” o “mga ordinansa” para sa מִשְׁפָּטָיו.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “at mabubuhay ka at darami, at pagpapalain ka ni Yahweh na iyong Diyos.” Maaaring unawain ang pagkakasunod-sunod ng mga pandiwang Hebreo bilang bunga o bilang pangako.'
    reason: alternative_reading
  - marker: c
    text: 'Sa mas literal na Hebreo: “sa lupaing pumapasok ka roon.” Ang “roon” ay likas na hindi na inuulit sa Tagalog.'
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “upang manahin iyon,” lalo na sa konteksto ng ipinangakong lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצַוְּךָ הַיּוֹם
  choice: iniuutos ko sa iyo ngayon
  rationale: Ipinahahayag ang kasalukuyan at agarang pag-uutos ng participle, habang pinananatili ang diin ng הַיּוֹם, “ngayon.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa titik ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: lumakad ka sa kanyang mga daan
  rationale: Pinananatili ang Hebreong talinghaga ng paglakad bilang paraan ng pamumuhay at pagkilos.
- source_word: לִשְׁמֹר
  choice: sundin
  rationale: Sa kontekstong tipan at kautusan, natural na ipinahahayag ng “sundin” ang aktuwal na pagtalima, bagaman maaari ring isaling “ingatan.”
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: kanyang mga utos, mga tuntunin, at mga hatol
  rationale: 'Pinananatili ang tatlong magkaibang katawagang legal: mga iniutos, mga itinakdang tuntunin, at mga pasiya o hatol.'
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: Sa gayon, mabubuhay ka at darami
  rationale: Ipinahahayag ang malamang na bunga ng pagsunod, ngunit itinatala sa talababa ang maaari ring basahing tuwirang pangako.
- source_word: בָּאָרֶץ אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: sa lupaing papasukan mo
  rationale: Natural sa Tagalog at naipahahayag ang pagpasok sa lupain; ang tahasang directional adverb na “roon” ay itinatala sa talababa.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin iyon
  rationale: Tumutukoy sa pagkuha at pananatiling pag-aari ng lupain; posible rin ang “manahin,” lalo na sa konteksto ng ipinangakong lupain.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Ugnayan ng pagsunod, buhay, pagdami, at pagpapala
  choice: 'Inilahad bilang bunga: “Sa gayon, mabubuhay ka…”'
  alternative: 'Tuwirang pangako: “at mabubuhay ka… at pagpapalain ka…”'
  rationale: Maaaring ipahiwatig ng pagkakasunod-sunod ng mga pandiwang Hebreo ang bunga o ang pangako. Pinili ang malinaw at natural na pangunahing salin, ngunit pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pangalang “Yahweh,” ang talinghagang “lumakad sa kanyang mga daan,” at ang tatlong magkakaibang katawagang legal. Inayos sa dalawang pangungusap para luminaw ang utos at ang kasunod na bunga, nang hindi inaalis ang ugnayan ng mga sugnay.
