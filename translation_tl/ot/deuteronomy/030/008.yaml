  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תָשׁ֔וּב וְ/שָׁמַעְתָּ֖ בְּ/ק֣וֹל יְהוָ֑ה וְ/עָשִׂ֨יתָ֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: tl
  text: At ikaw ay babalik[a] at makikinig sa tinig ni Yahweh[b], at gagawin mo ang lahat ng kanyang mga utos na iniuutos ko sa iyo ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “manunumbalik”; sa kontekstong ito, maaari rin itong magpahiwatig ng pagbabalik-loob sa tipan.
    reason: lexical_alternative
  - marker: b
    text: Ang idyomang Hebreo na “makinig sa tinig” ay madalas na nagpapahiwatig ng pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: At ikaw ay
  rationale: Pinananatili ang tahasang panghalip na nagbibigay-diin sa kausap, nang hindi nagdaragdag ng di-tiyak na pagsalungat o pagkakasunod-sunod.
- source_word: תָשׁוּב
  choice: babalik
  rationale: Ang שׁוּב ay karaniwang nangangahulugang “bumalik” o “manumbalik.” Pinananatili ng “babalik” ang maaaring pisikal at tipanang diwa nang hindi ito nililimitahan sa tahasang pagsisisi.
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: at makikinig sa tinig ni Yahweh
  rationale: Malapit ito sa idyomang Hebreo na “makinig sa tinig.” Bagaman madalas nitong ipinahihiwatig ang pagsunod, hindi nito pinagsasanib ang parirala sa kasunod na hiwalay na pahayag tungkol sa paggawa ng mga utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְעָשִׂיתָ
  choice: at gagawin mo
  rationale: Tuwirang itinatanghal ang karaniwang kahulugan ng עָשָׂה na “gawin,” habang malinaw sa layon na ang tinutukoy ay pagsasagawa ng mga utos.
- source_word: כָּל מִצְוֺתָיו
  choice: ang lahat ng kanyang mga utos
  rationale: Pinananatili ang kabuuang saklaw ng כָּל at ang tipanan at legal na himig ng מִצְוֹת; ang panghalip ay tumutukoy kay Yahweh.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Ang “iniuutos” ay nagpapakita ng kasalukuyan at agarang lakas ng participle, at pinananatili ang “ngayon” bilang mahalagang panandang tipanan sa Deuteronomio.
theological_decisions:
- issue: Kung isasalin ang שׁוּב bilang tahasang pagsisisi o pagbabalik-loob
  choice: babalik
  alternative: magsisisi / manunumbalik
  rationale: Maaaring taglay ng salita ang diwa ng pisikal na pagbabalik, pagbabalik sa tipan, at pagsisisi. Hindi nilulutas ng pangunahing teksto ang tunay na lawak na ito.
- issue: Kung isasalin ang שׁמע בְּקוֹל bilang “sumunod” o panatilihin ang larawang “makinig sa tinig”
  choice: makikinig sa tinig ni Yahweh
  alternative: susunod kay Yahweh
  rationale: Madalas na ipinahihiwatig ng idyoma ang pagsunod, ngunit tahasang binabanggit ng kasunod na sugnay ang paggawa ng lahat ng utos. Pinananatili rito ang dalawang magkaugnay ngunit hindi ganap na magkaparehong pahayag.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang bahagyang pormal na “ikaw ay” upang maipakita ang diin ng tahasang panghalip sa Hebreo, habang nananatiling malinaw sa karaniwang mambabasa.
