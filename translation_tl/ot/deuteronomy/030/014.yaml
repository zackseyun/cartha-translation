base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/014.yaml
  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: tl
  text: Sapagkat napakalapit sa iyo ng salita[a]—nasa iyong bibig at nasa iyong puso—upang gawin mo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bagay” o “utos.” Ang salitang Hebreo na דָּבָר ay maaaring tumukoy sa salita, bagay, o utos, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag na sumusuporta sa naunang pahayag at likas na nag-uugnay sa konteksto.
- source_word: קָרוֹב אֵלֶיךָ ... מְאֹד
  choice: napakalapit sa iyo
  rationale: Pinananatili ang diwa ng matinding pagkalapit sa natural na modernong Tagalog.
- source_word: הַדָּבָר
  choice: ang salita
  rationale: Pinananatili ang malawak na saklaw ng דָּבָר at ang pormal na anyo nito, nang hindi ito tahasang nililimitahan sa ‘utos.’
- source_word: בְּפִיךָ
  choice: nasa iyong bibig
  rationale: Pinananatili ang kongkretong larawan ng bibig at ang pagkakapantay nito sa puso.
- source_word: וּבִלְבָבְךָ
  choice: at nasa iyong puso
  rationale: Ang ‘puso’ ay natural at pamilyar na katumbas na maaaring tumukoy sa kalooban, pag-iisip, at panloob na pagkatao.
- source_word: לַעֲשֹׂתוֹ
  choice: upang gawin mo ito
  rationale: Malinaw na ipinahahayag ang layunin o bunga ng pagkalapit ng salita habang nananatiling maikli at natural.
theological_decisions:
- issue: Tinutukoy ng ‘salita’
  choice: salita
  alternative: bagay; utos
  rationale: Bagaman utos ng Diyos ang paksa sa agarang konteksto, mas malawak ang maaaring kahulugan ng דָּבָר. Pinananatili ng salin at talababa ang tunay na leksikal na lawak nang hindi nagpapasya nang higit sa sinasabi ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘iyong’ at ‘puso’ upang mapanatili ang dignidad at biblikal na larawan; ang mga gitling ay nagpapalinaw sa magkatugmang pariralang ‘nasa iyong bibig’ at ‘nasa iyong puso.’
