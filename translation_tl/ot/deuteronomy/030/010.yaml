language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר מִצְוֺתָי/ו֙ וְ/חֻקֹּתָ֔י/ו הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּ֑ה כִּ֤י תָשׁוּב֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: tl
  text: kung makikinig ka sa tinig ni Yahweh na iyong Diyos[a] at tutuparin mo ang kanyang mga utos at mga tuntuning nakasulat sa aklat na ito ng Kautusan, kung manunumbalik ka kay Yahweh na iyong Diyos nang buong puso at buong kaluluwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “makikinig ka sa tinig ni Yahweh”; ang ibig sabihin ng pananalita ay pakikinggan at susundin ang sinasabi niya.
    reason: lexical_alternative
  - marker: b
    text: Ang “manunumbalik” ay maaari ring isaling “babalik” o, ayon sa diwa ng konteksto, “magsisisi at magbabalik-loob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: kung
  rationale: Sa dalawang paglitaw nito, ipinakikilala ng כִּי ang mga kondisyong kaugnay ng naunang pangako; pinananatili ng “kung” ang kondisyunal na daloy.
- source_word: תִשְׁמַע בְּקוֹל
  choice: makikinig ka sa tinig
  rationale: Pinananatili nito ang Hebreong larawang “makinig sa tinig,” samantalang ipinahihiwatig ng konteksto ang pakikinig na may pagsunod; nililinaw ito sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לִשְׁמֹר
  choice: at tutuparin mo
  rationale: Ipinapahayag ng pawatas ang nilalaman o paraan ng pakikinig kay Yahweh. Ang “tutuparin” ay natural sa makabagong Tagalog at malinaw na nagsasaad ng masunuring pagkilos.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: kanyang mga utos at mga tuntunin
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkaibang katawagang legal: מִצְוֹת bilang “mga utos” at חֻקּוֹת bilang “mga tuntunin.”'
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: sa aklat na ito ng Kautusan
  rationale: Natural itong katumbas ng pormulang tumutukoy sa nakasulat na dokumento ng tipan; ang malaking titik sa “Kautusan” ay nagpapakitang partikular na Kautusan ang tinutukoy.
- source_word: תָשׁוּב אֶל
  choice: manunumbalik ka kay
  rationale: Ang “manunumbalik” ay nagpapanatili sa pangunahing larawang pagbalik ng שׁוּב at sa pahiwatig nitong pagbabalik-loob sa tipan nang hindi ito tahasang nililimitahan sa salitang “magsisisi.”
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: nang buong puso at buong kaluluwa
  rationale: Pinananatili ang dalawang Hebreong antropolohikal na termino at ang diin ng pag-uulit ng “buong,” sa natural at pamilyar na wikang Tagalog.
theological_decisions:
- issue: Kahulugan ng שׁוּב sa konteksto ng pagbabalik-loob sa tipan
  choice: manunumbalik
  alternative: babalik / magsisisi
  rationale: Ang “manunumbalik” ay nagpapanatili sa metapora ng pagbalik at sa teolohikal na pahiwatig ng pagsisisi, nang hindi tahasang pinapaliit ang kahulugan sa isang interpretibong terminong teolohikal.
- issue: Pakikinig sa tinig bilang pagsunod
  choice: makikinig ka sa tinig, na sinusundan ng “tutuparin mo”
  alternative: susundin mo ang tinig / tatalima ka
  rationale: Pinananatili ang konkretong idyomang Hebreo habang ipinakikita sa kasunod na parirala na ang tinutukoy ay masunuring pakikinig, hindi basta pagkarinig.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal na himig. Pinanatili ang pangalang Yahweh, ang larawang “makinig sa tinig,” ang legal na pagkakaiba ng “mga utos” at “mga tuntunin,” at ang bukas na teolohikal na saklaw ng “manunumbalik.”
