base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: tl
  text: kung magkagayon, ibabalik ni Yahweh na iyong Diyos ang iyong mabuting kalagayan[a] at kahahabagan ka niya. Muli ka niyang titipunin[b] mula sa lahat ng mga bayan[c] kung saan ka ikinalat ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ibabalik ang iyong pagkabihag.” Isa itong idyomang Hebreo na tumutukoy sa pagpapanumbalik ng isang tao o bayan mula sa kapighatian o pagkatapon.'
    reason: lexical_alternative
  - marker: b
    text: O “babalik siya at titipunin ka.”
    reason: alternative_reading
  - marker: c
    text: O “mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipang pangalan ng Diyos sa Hebreo, sa anyong malapit sa karaniwang transliterasyon nito.
- source_word: וְשָׁב ... אֶת שְׁבוּתְךָ
  choice: ibabalik ... ang iyong mabuting kalagayan
  rationale: Isinasalin ang kinikilalang idyomang Hebreo bilang pagbabalik sa maayos o mabuting kalagayan, hindi lamang bilang literal na pagbabalik ng mga bihag.
- source_word: וְרִחֲמֶךָ
  choice: at kahahabagan ka niya
  rationale: Likas at marangal na Filipino para sa mahabaging awa na ipinahihiwatig ng רחם.
- source_word: וְשָׁב וְקִבֶּצְךָ
  choice: Muli ka niyang titipunin
  rationale: Itinuturing ang ikalawang שָׁב bilang may diwang 'muli,' habang inilalahad sa talababa ang posibleng mas pormal na pagbasa na hiwalay itong pandiwa.
- source_word: מִכָּל הָעַמִּים
  choice: mula sa lahat ng mga bayan
  rationale: Ang עַמִּים ay tumutukoy sa maraming pangkat ng tao o mga bayan; iniiwasan ng 'mga bayan' na limitahan ito sa modernong estadong-bansa.
- source_word: הֱפִיצְךָ
  choice: ikinalat ... ka
  rationale: Tuwirang ipinapahayag ang sapilitang pagkakawatak-watak o dispersal sa konteksto ng pagkatapon.
- source_word: שָׁמָּה
  choice: kung saan
  rationale: Natural na Filipino sa loob ng sugnay na panlunan, bagaman literal na 'doon' ang salitang Hebreo.
theological_decisions:
- issue: Idyomatikong diwa ng שׁוּב אֶת־שְׁבוּת
  choice: ibabalik ... ang iyong mabuting kalagayan
  alternative: ibabalik ang iyong pagkabihag; ibabalik ang iyong mga bihag
  rationale: Ang parirala ay idyoma ng pagpapanumbalik mula sa kapighatian o pagkatapon. Ang literal na 'ibabalik ang iyong pagkabihag' ay malabo sa Filipino, samantalang ang 'iyong mga bihag' ay nagpapalit sa tinutukoy na layon. Hiwalay namang binabanggit sa kasunod na sugnay ang aktuwal na muling pagtitipon.
- issue: Diwa ng ikalawang וְשָׁב
  choice: Muli ka niyang titipunin
  alternative: babalik siya at titipunin ka
  rationale: Maaaring unawain ang anyo bilang 'muli' na kaugnay ng pagtitipon o bilang hiwalay na pandiwang 'babalik.' Pinili sa pangunahing teksto ang mas natural na pagbasa ngunit pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'Yahweh' para sa banal na pangalan, 'mabuting kalagayan' para sa idyomang Hebreo, at 'mga bayan' para sa plural na עַמִּים. Inayos ang mga marker upang agad sumunod sa mismong pariralang tinatalabaan.
