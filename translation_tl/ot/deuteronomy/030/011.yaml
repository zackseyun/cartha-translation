  text: כִּ֚י הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לֹֽא נִפְלֵ֥את הִוא֙ מִמְּ/ךָ֔ וְ/לֹ֥א רְחֹקָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: tl
  text: Sapagkat ang utos na ito na iniuutos ko sa iyo ngayon ay hindi napakahirap para sa iyo[a], at hindi rin ito malayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi lampas sa iyo” o “hindi nakatago sa iyo.” Ang pandiwang Hebreo ay maaaring tumukoy sa isang bagay na pambihira, hindi maabot, o hindi kayang maunawaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag na kaugnay ng naunang panghihikayat at natural na nagpapatuloy sa daloy ng pahayag.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: ang utos na ito
  rationale: Ang “utos” ay malinaw at likas sa makabagong Tagalog habang pinananatili ang legal at tipanang diwa ng מִצְוָה.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Pinananatili ng aspektong nagpapatuloy sa “iniuutos” ang agarang konteksto ng pagsasalita ni Moises sa araw na iyon.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: ay hindi napakahirap para sa iyo[a]
  rationale: Ipinahahayag nito ang praktikal na pagiging abot-kamay ng utos sa konteksto ng mga talatang 12–14, habang inilalagay sa talababa ang iba pang tunay na posibilidad ng pandiwang פלא.
- source_word: וְלֹא רְחֹקָה הִוא
  choice: at hindi rin ito malayo
  rationale: Pinananatili ang metapora ng layo at ang malinaw na kaibahan nito sa pagiging malapit na inilalarawan sa mga kasunod na talata.
theological_decisions:
- issue: Kahulugan ng נִפְלֵאת kaugnay ng kakayahan ng tao at pagsunod sa tipan
  choice: hindi napakahirap para sa iyo
  alternative: hindi lampas sa iyo; hindi nakatago sa iyo
  rationale: Binibigyang-diin ng salin na hindi mahirap maabot o maunawaan ang utos sa agarang konteksto, nang hindi nagpapasya sa mas malawak na usaping doktrinal tungkol sa likas na kakayahang moral ng tao nang walang tulong ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “utos” sa halip na mas teknikal na “kautusan” upang maging natural sa karaniwang mambabasa, ngunit pinanatili ang tipanang bigat ng pahayag.
