base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: tl
  text: Ngunit kung tumalikod ang puso mo at hindi ka makinig[a], at mailigaw ka[b] at yumukod ka sa ibang mga diyos at maglingkod sa kanila,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumunod.” Sa konteksto ng tipan, ang salitang Hebreo para sa “makinig” ay madalas na may diwa ng pakikinig na humahantong sa pagsunod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mailayo ka” o “matangay ka.” Maaaring tumukoy ang pandiwang Hebreo sa pagkaligaw o pagkataboy palayo sa wastong katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikilala nito ang salungat na kondisyon kasunod ng naunang panawagan; natural na ipinahihiwatig ng “Ngunit” ang puwersang iyon.
- source_word: יִפְנֶה לְבָבְךָ
  choice: tumalikod ang puso mo
  rationale: Pinananatili ang larawan ng pusong bumabaling palayo at malinaw na ipinahahayag ang pagtalikod ng katapatan.
- source_word: וְלֹא תִשְׁמָע
  choice: hindi ka makinig
  rationale: Pinananatili ang metapora ng pakikinig, habang maaari pa ring maunawaan sa konteksto ng tipan ang diwa ng pagsunod.
- source_word: וְנִדַּחְתָּ
  choice: mailigaw ka
  rationale: Ipinakikita ng anyong pasibo ang pagkalayo sa wastong katapatan nang hindi tinutukoy kung sino o ano ang nagligaw.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: yumukod ka
  rationale: Pinananatili ang kongkretong kilos ng pagyukod na, sa konteksto, ay pagsamba.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: sa ibang mga diyos
  rationale: Direkta at karaniwang salin ng pormulang tumutukoy sa mga karibal na diyos.
- source_word: וַעֲבַדְתָּם
  choice: maglingkod sa kanila
  rationale: Pinananatili ang pangunahing diwa ng paglilingkod, na sa konteksto ay kultiko o panrelihiyong paglilingkod.
theological_decisions:
- issue: Ang sunod-sunod na paglalarawan sa pagtalikod
  choice: Pinanatili bilang pagkakasunod ng pagtalikod ng puso, hindi pakikinig, pagkakaligaw, pagyukod, at paglilingkod sa ibang mga diyos.
  alternative: Isalin ang “makinig” bilang “sumunod,” o gawing mas aktibo ang “mailigaw ka,” gaya ng “magpaligaw ka.”
  rationale: Inilalahad ng Hebreo ang lumalalang paglabag sa katapatan sa tipan. Pinananatili ng salin ang pagkakasunod at ang pasibong anyo nang hindi nagdaragdag ng sanhi o doktrinal na paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “puso” at ang konkretong “yumukod” upang mapanatili ang mga larawan ng Hebreo; iniwasan ang labis na teknikal o denominasyonal na pananalita.
