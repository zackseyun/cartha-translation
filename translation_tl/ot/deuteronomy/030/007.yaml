  text: וְ/נָתַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֵ֥ת כָּל הָ/אָל֖וֹת הָ/אֵ֑לֶּה עַל אֹיְבֶ֥י/ךָ וְ/עַל שֹׂנְאֶ֖י/ךָ אֲשֶׁ֥ר רְדָפֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: tl
  text: At ipapataw ni Yahweh na iyong Diyos ang lahat ng sumpang[a] ito sa iyong mga kaaway at sa mga napopoot sa iyo, na tumugis sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga panunumpa”; sa Deuteronomio, karaniwang tumutukoy ang salitang ito sa mga sumpa o kaparusahang itinakda ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: at ipapataw
  rationale: Bagaman malawak ang kahulugan ng נתן (‘ibigay, ilagay, itakda’), ang ‘ipapataw’ ang likas na salin kapag mga sumpa ang inilalagay sa isang tao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang ipinapahayag ng hulaping ikalawang panauhang panlalaking isahan ang pagmamay-ari o kaugnayang ‘iyong Diyos.’
- source_word: כָּל הָאָלוֹת הָאֵלֶּה
  choice: lahat ng sumpang ito
  rationale: Sa konteksto ng tipan sa Deuteronomio, tumutukoy ang אָלוֹת sa mga sumpa o kaparusahang itinakda ng tipan; pinananatili sa talababa ang mas malawak na kahulugang ‘mga panunumpa.’
- source_word: עַל
  choice: sa
  rationale: Likas sa Tagalog ang ‘ipapataw ... sa’ upang tukuyin ang mga taong tatanggap ng mga sumpa.
- source_word: אֹיְבֶיךָ
  choice: iyong mga kaaway
  rationale: Karaniwang katumbas ito ng pangmaramihang אֹיְבֶיךָ.
- source_word: וְעַל שֹׂנְאֶיךָ
  choice: at sa mga napopoot sa iyo
  rationale: Inilalarawan ng participle ang mga taong namumuhi o napopoot; natural at marangal sa modernong Tagalog ang pariralang ito.
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: na tumugis sa iyo
  rationale: Saklaw ng רדף ang paghabol, pagtugis, at pag-usig. Hindi labis na nililinaw ng ‘tumugis’ kung literal na paghabol o mas malawak na pag-uusig ang tinutukoy.
theological_decisions:
- issue: Pagkasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang pangalan ng Diyos; pinananatili ng ‘Yahweh’ ang karaniwang akademikong transliterasyon nito nang hindi pinapalitan ng titulo.
- issue: Kahulugan ng אָלוֹת sa konteksto ng tipan
  choice: mga sumpa
  alternative: mga panunumpa
  rationale: Ang agarang konteksto ay ang mga kaparusahang kaugnay ng tipan na naunang ipinahayag sa Deuteronomio. Gayunman, inilalahad sa talababa ang tunay na mas malawak na saklaw ng salita.
- issue: Saklaw ng sugnay na אֲשֶׁר רְדָפוּךָ
  choice: na tumugis sa iyo
  alternative: na umusig sa iyo
  rationale: Hindi nilulutas nang labis kung literal na paghabol o mapang-usig na pagtrato ang nasa isip; pinananatili rin ang posibleng pag-uugnay ng sugnay sa kapuwa ‘mga kaaway’ at ‘mga napopoot.’
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘ipapataw’ para sa likas na kolokasyon sa ‘sumpa,’ at ‘napopoot’ at ‘tumugis’ upang mapanatili ang pormal na himig nang hindi nagiging makaluma.
