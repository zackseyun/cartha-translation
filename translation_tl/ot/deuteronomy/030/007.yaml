  source_fidelity: 'Tapat ang salin sa Hebreo: ang וְנָתַן ay naisasalin nang idiomatiko bilang “ipapataw”; ang כָּל הָאָלֹת הָאֵלֶּה ay “lahat ng sumpang ito”; at napapanatili ang dalawang pangkat, ang mga kaaway at ang mga napopoot, kasama ang sugnay na tumutukoy sa kanilang pagtugis. Hindi nito nililimitahan ang רָדַף sa literal na habulan o sa teknikal na pag-uusig lamang.'
  naturalness: Natural at marangal ang modernong Tagalog. Ang “Ipapataw ... ang lahat ng sumpang ito sa ...” ay wastong kolokasyon, at malinaw ang daloy ng pangungusap. Katanggap-tanggap ang “Yahweh na iyong Diyos” bilang pangkaraniwang biblikal na apposition sa Tagalog.
  terminology: Wasto at pare-pareho ang “Yahweh,” “Diyos,” “sumpa,” “kaaway,” at “mga napopoot.” Ang talababa ay angkop na nagsasaad ng leksikal na alternatibong “mga panunumpa” habang nililinaw na ang pangunahing kahulugan sa konteksto ng Deuteronomio ay mga sumpang pangtipan.
