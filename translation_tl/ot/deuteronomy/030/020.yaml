  to: sa pagmamahal kay Yahweh na iyong Diyos, sa pakikinig sa kanyang tinig[a], at sa pagkapit nang mahigpit sa kanya[b]; sapagkat siya ang iyong buhay at ang kahabaan ng iyong mga araw, upang manirahan ka sa lupain na ipinangako ni Yahweh nang may panunumpa sa iyong mga ama[c]—kina Abraham, Isaac, at Jacob—na ibibigay niya sa kanila.
