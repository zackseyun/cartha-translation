source:
  edition: WLC
  text: לְ/אַֽהֲבָה֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֥עַ בְּ/קֹל֖/וֹ וּ/לְ/דָבְקָה ב֑/וֹ כִּ֣י ה֤וּא חַיֶּ֨י/ךָ֙ וְ/אֹ֣רֶךְ יָמֶ֔י/ךָ לָ/שֶׁ֣בֶת עַל הָ/אֲדָמָ֗ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֶ֛י/ךָ לְ/אַבְרָהָ֛ם לְ/יִצְחָ֥ק וּֽ/לְ/יַעֲקֹ֖ב לָ/תֵ֥ת לָ/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: tl
  text: sa pagmamahal kay Yahweh na iyong Diyos, sa pakikinig sa kanyang tinig[a], at sa pagkapit nang mahigpit sa kanya[b]; sapagkat siya ang iyong buhay at ang kahabaan ng iyong mga araw, upang manirahan ka sa lupain na ipinangako ni Yahweh nang may panunumpa sa iyong mga ama[c]—kina Abraham, Isaac, at Jacob—na ibibigay niya sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagsunod sa kanyang tinig.” Ang Hebreong idyomang “makinig sa tinig” ay madalas na may diwa ng pakikinig nang may pagsunod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at sa pananatiling nakakapit sa kanya.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa iyong mga ninuno.” Literal na “mga ama” ang Hebreo, at agad nitong pinangalanan sina Abraham, Isaac, at Jacob.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: sa pag-ibig kay Yahweh na iyong Diyos
  rationale: Ang infinitibong may לְ ay nagpapatuloy sa paglalarawan kung paano pipiliin ang buhay. Likas sa Tagalog ang “sa pag-ibig kay,” at pinananatili ang personal at tipanang pangalan na Yahweh.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: sa pakikinig sa kanyang tinig
  rationale: Pinananatili ang konkretong idyomang Hebreo, habang ang diwa ng pagsunod ay inilalahad bilang leksikal na alternatibo sa talababa.
- source_word: וּלְדָבְקָה בוֹ
  choice: at sa mahigpit na pananatili sa kanya
  rationale: Ipinahahayag nito ang matibay na pagkakapit, malapit na kaugnayan, at patuloy na katapatan na saklaw ng דבק, nang hindi gumagamit ng lipas o di-likas na pananalita.
- source_word: כִּי הוּא חַיֶּיךָ
  choice: sapagkat siya ang iyong buhay
  rationale: Ang personal na panghalip ay pinakanatural na tumutukoy kay Yahweh. Pinananatili ng tuwirang salin ang lakas at teolohikal na pahayag ng sugnay.
- source_word: וְאֹרֶךְ יָמֶיךָ
  choice: at ang haba ng iyong mga araw
  rationale: Pinananatili ang larawang Hebreo at hindi nililimitahan ang kahulugan sa simpleng “mahabang buhay” lamang.
- source_word: לָשֶׁבֶת עַל הָאֲדָמָה
  choice: upang manirahan ka sa lupain
  rationale: Ang “upang” ay malinaw na naghahayag ng layunin o resulta; ang “lupain” ay angkop sa teritoryal na pangako ng tipan.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: na ipinangako ni Yahweh nang may panunumpa
  rationale: Iniiwasan nito ang posibleng maling pagkaunawa sa “isinumpa” bilang pagkukulam o pagsumpa, habang malinaw na pinananatili ang pormal na panunumpa ng נִשְׁבַּע.
- source_word: לַאֲבֹתֶיךָ
  choice: sa iyong mga ama
  rationale: Pinananatili ang panlalaking katawagan ng Hebreo, na agad namang nililinaw ng pagbanggit kina Abraham, Isaac, at Jacob.
- source_word: לָתֵת לָהֶם
  choice: na ibibigay sa kanila
  rationale: Pinananatili ang tahasang panghalip na “sa kanila” at ang ugnayan nito sa pangakong binitiwan sa mga patriyarka.
theological_decisions:
- issue: Tinutukoy ng “siya” sa “siya ang iyong buhay”
  choice: Si Yahweh mismo ang tinutukoy.
  alternative: Ang kabuuang landas ng pag-ibig, pakikinig, at pananatiling tapat ang tinutukoy.
  rationale: Ang pinakamalapit at pinakatampok na tinutukoy ng panghalip ay si Yahweh na Diyos. Bagaman kaugnay sa buhay ang naunang mga kilos ng katapatan sa tipan, mas pinapaboran ng balarila ang personal na pagtukoy kay Yahweh.
- issue: Saklaw ng דבק
  choice: mahigpit na pananatili sa kanya
  alternative: pagkapit sa kanya
  rationale: Pinagsasama ng pangunahing salin ang matibay na pagkakaugnay at nagpapatuloy na katapatan; pinananatili sa talababa ang mas kongkretong larawan ng pagkapit.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pangalang Yahweh, ang larawang “haba ng iyong mga araw,” at ang tipanang himig. Ginamit ang “ipinangako … nang may panunumpa” upang maging malinaw sa karaniwang mambabasa ang kahulugan ng pandiwang Hebreo.
