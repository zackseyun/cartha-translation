base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: tl
  text: Hindi ito nasa langit para masabi mong, “Sino ang aakyat sa langit para sa atin, kukuha nito para sa atin, at iparirinig ito sa atin upang magawa natin ito?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: nasa langit
  rationale: Tumutukoy ito sa makalangit na dako na waring hindi maaabot, bilang kaibahan sa salitang malapit at maaaring sundin sa kasunod na konteksto. Likas sa modernong Tagalog ang “nasa langit.”
- source_word: הִוא
  choice: ito
  rationale: Ang pambabaeng panghalip sa Hebreo ay tumutukoy sa utos o salita sa konteksto; natural itong tukuyin sa Tagalog bilang “ito.”
- source_word: לֵאמֹר
  choice: para masabi mong
  rationale: Ipinakikilala nito ang maaaring sabihin bilang pagtutol. Ang “para masabi mong” ay natural sa Tagalog at pinananatili ang ugnayan nito sa pahayag na hindi nasa langit ang utos.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Sino ang aakyat ... para sa atin
  rationale: Pinananatili ng “aakyat” ang pataas na kilos ng עלה, at ng “para sa atin” ang kapakinabangang ipinahihiwatig ng לָנוּ.
- source_word: הַשָּׁמַיְמָה
  choice: sa langit
  rationale: Ang hulaping pandireksiyon sa Hebreo ay nagsasaad ng pagkilos patungo sa langit; sapat at natural sa Tagalog ang “aakyat sa langit.”
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: kukuha nito para sa atin
  rationale: Ang לקח ay literal na “kumuha.” Sa konteksto, kukunin ang utos o salita mula sa langit para sa kapakanan ng bayan.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: iparirinig ito sa atin
  rationale: Pinananatili ng “iparirinig” ang sanhiang anyo ng pandiwang Hebreo—gagawin niyang marinig nila ito—nang hindi ito binibigyang-kahulugang “ipahahayag” lamang.
- source_word: וְנַעֲשֶׂנָּה
  choice: upang magawa natin ito
  rationale: Ipinahahayag ng “upang” ang layunin o bungang diwa ng hulihang sugnay, samantalang pinananatili ng “magawa” ang payak na kahulugang gawin o tuparin ang utos.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na “para sa atin” dahil mahalaga ito sa ayos at diin ng Hebreo, habang ginawang natural ang sanhiang “iparirinig ito sa atin.”
