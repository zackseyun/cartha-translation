  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: tl
  text: Tutuliin ni Yahweh na iyong Diyos ang puso mo[b] at ang puso ng iyong mga supling[a], upang ibigin mo si Yahweh na iyong Diyos nang buong puso mo at nang buong kaluluwa mo[c], upang mabuhay ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tutuliin ang puso” ay isang metapora para sa panloob na pagbabago at tapat na pagtalima sa tipan.
    reason: cultural_note
  - marker: c
    text: O “nang buong buhay mo” o “nang buo mong pagkatao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: Tutuliin
  rationale: Pinananatili ang literal na larawang pangtipan ng pagtutuli, kahit puso ang layon at kaya metaporikal ang gamit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang katumbas ng anyong may hulaping ikalawang panauhang isahan at akma sa kontekstong pangtipan.
- source_word: לְבָבְךָ
  choice: puso mo
  rationale: Ang 'puso' ay likas na katumbas sa Filipino para sa panloob na pagkatao, kabilang ang kalooban at pagmamahal.
- source_word: לְבַב זַרְעֶךָ
  choice: puso ng iyong mga supling
  rationale: Ang זֶרַע ay maaaring tumukoy sa supling o mga inapo; ipinahahayag ng 'mga supling' ang kolektibong diwa sa natural na Filipino.
- source_word: לְאַהֲבָה
  choice: upang ibigin mo
  rationale: Ipinakikita ng 'upang' ang layunin o bunga ng infinitive, at ang 'ibigin' ay marangal ngunit malinaw na salitang Filipino.
- source_word: בְּכָל לְבָבְךָ
  choice: nang buong puso mo
  rationale: Natural at tumpak na pahayag ng ganap na katapatan at pag-ibig.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: at nang buong kaluluwa mo
  rationale: Pinananatili ang pamilyar na pormulang 'puso at kaluluwa' nang hindi itinatanggi na ang נֶפֶשׁ ay maaari ring mangahulugang buhay o buong pagkatao.
- source_word: לְמַעַן חַיֶּיךָ
  choice: upang mabuhay ka
  rationale: Natural na Filipino para sa pariralang nagsasaad ng nilalayong bunga o kinalabasan.
theological_decisions:
- issue: Metaporikal na wikang pangtipan tungkol sa pagtutuli ng puso
  choice: Pinanatili sa pangunahing teksto ang 'Tutuliin ... ang puso mo.'
  alternative: Babaguhin o lilinisin ang puso mo.
  rationale: Mahalaga ang larawan ng tanda ng tipan sa paglalarawan ng panloob na pagbabagong ginagawa ng Diyos; hindi ito dapat palitan ng paliwanag na nagpapakitid sa kahulugan.
- issue: Kahulugan ng נֶפֶשׁ sa utos na umibig
  choice: Isinalin bilang 'kaluluwa' sa pangunahing teksto.
  alternative: Buhay o buong pagkatao.
  rationale: Ang salita ay maaaring tumukoy sa buong buhay na sarili. Pinananatili ng 'kaluluwa' ang pamilyar na pormula habang inilalahad sa talababa ang mas malawak na saklaw nito.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang pangalang Yahweh at ang matapang na metapora ng pagtutuli ng puso; ginamit ang 'ibigin' upang mapanatili ang dignidad ng pananalitang pangtipan.
