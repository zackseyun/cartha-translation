  source_fidelity: 'May dalawang mahalagang paglihis ang draft: ang “mula sa inyo” ay hindi malinaw na naghahayag na ang mga naitaboy ay kabilang sa kausap, at ang “titipunin kayo roon” ay maaaring mangahulugang titipunin sila sa lugar na iyon. Ang מִשָּׁם ay dapat ikabit sa pinagmumulan ng pagtitipon: “mula roon.” Ang “Kung” ay mas tuwirang katumbas ng אִם kaysa “Kahit ... pa,” bagaman posible ang huli bilang kontekstuwal na pagpapalakas.'
  naturalness: Natural at marangal ang binagong Filipino. Ang “mga naitaboy na kabilang sa iyo” ay umiiwas sa maling pagbasa na ikaw ang nagtaboy sa kanila, samantalang pinananatili ang kolektibong saklaw ng kausap. Ang isahang “iyo/ikaw” ay tumutugma sa Hebreong pakikipag-usap sa Israel bilang isang bayan.
  terminology: Tama ang “Yahweh” para sa יהוה at “Diyos mo” para sa אֱלֹהֶיךָ. Pinananatili ang “dulo ng langit,” ang inuulit na “mula roon,” at ang literal na “kukunin.”
