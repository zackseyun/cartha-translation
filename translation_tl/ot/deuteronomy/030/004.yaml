base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: tl
  text: Kung ang mga naitaboy na kabilang sa iyo ay nasa dulo ng langit[a], mula roon ay titipunin ka ni Yahweh na Diyos mo, at mula roon ay kukunin ka niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dulo ng langit” ay isang Hebreong idyoma para sa pinakamalayong posibleng lugar.
    reason: cultural_note
  - marker: b
    text: O “dadalhin ka niya.” Mas literal na “kukunin ka niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִהְיֶה
  choice: Kahit nasa ... pa
  rationale: Ang אִם ay literal na kondisyonal, ngunit sa konteksto ng sukdulang layo, natural na ipinahahayag sa Tagalog bilang concessive na “kahit ... pa,” nang hindi binabago ang diwa.
- source_word: נִדַּחֲךָ
  choice: ang mga itinaboy mula sa inyo
  rationale: Ang anyo ay tumutukoy sa mga taong naitaboy o nakalat; inililinaw ng “mula sa inyo” ang kolektibong panlaping ikalawang panauhang isahan na tumutukoy sa Israel.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: sa dulo ng langit
  rationale: Pinananatili ang Hebreong larawang pangkalawakan at ang idyoma para sa pinakamalayong lugar.
- source_word: מִשָּׁם
  choice: roon / mula roon
  rationale: Pinananatili ang dalawang ulit na pagtukoy sa pinanggagalingang lugar, ngunit inaangkop ang unang anyo sa natural na Tagalog kasunod ng “titipunin.”
- source_word: יְקַבֶּצְךָ
  choice: titipunin kayo
  rationale: Tuwirang ipinapahayag ang Piel ng קבץ, “tipunin.” Ang “kayo” ay nagpapakita ng kolektibong kahulugan ng Hebreong isahan.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang tipanang katawagang “inyong Diyos.”
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: at kukunin niya kayo mula roon
  rationale: Pinananatili ang pangunahing kahulugan ng לקח, “kunin,” sa halip na ipasok ang mas tiyak na “dadalhin,” na mas malinaw lamang sa kasunod na talata.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kolektibong isahang pagtukoy sa Israel
  choice: “mula sa inyo” at “kayo/inyong”
  alternative: Mahigpit na isahang “ikaw/iyo”
  rationale: Isahan ang gramatikal na pakikipag-usap sa Israel, ngunit maramihan ang mga taong itinaboy. Ang natural na Tagalog na maramihan ay naghahayag ng kolektibong sanggunian nang hindi nagdaragdag ng ibang pangkat.
- issue: Ugnayan ng kondisyon at katiyakan
  choice: “Kahit ... pa”
  alternative: “Kung ...”
  rationale: Ang אִם ay maaaring isaling “kung,” ngunit dito inilalarawan ang sukdulang posibleng kalagayan. Ang “kahit ... pa” ay natural na Tagalog at pinananatili ang pangakong kikilos ang Diyos maging sa gayong kalagayan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang Hebreong larawang “dulo ng langit,” ang pag-uulit ng “mula roon,” at ang personal na pangalang Yahweh. Inilagay ang lahat ng panandang talababa sa pangunahing teksto.
