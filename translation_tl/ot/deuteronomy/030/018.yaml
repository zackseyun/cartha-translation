    issue: Hindi malinaw ang pagkakaugnay ng “lupaing tatawirin mo ang Jordan.”
    rationale: Ang Hebreo ay nagsasabing tatawirin ng Israel ang Jordan upang pumasok sa lupain; hindi nito inilalarawan ang lupain bilang bagay na tatawirin. Kailangan ang “na” upang malinaw na ang buong sugnay ang naglalarawan sa lupain.
  - severity: medium
    issue: Masyadong malawak ang “mapapahamak” para sa אָבֹד תֹּאבֵדוּן.
    rationale: Maaaring tumukoy ang “mapapahamak” sa kapinsalaan o kasawian nang walang katiyakang pagkapuksa. Ang “tiyak kayong malilipol” ay mas malapit sa mariing Hebreong pagpapahayag ng pagkapuksa.
  - severity: low
    issue: Hindi likas ang literal na pariralang “sa pagkapahamak ay mapapahamak kayo” sa talababa.
    rationale: Mas malinaw na maipaliwanag ang infinitive absolute bilang “pagkalipol ay malilipol kayo,” kasabay ng paliwanag na ito ay mariing konstruksyon.
