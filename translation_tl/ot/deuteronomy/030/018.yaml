  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: tl
  text: Ipinahahayag ko sa inyo ngayon na tiyak kayong malilipol[a]. Hindi kayo mabubuhay nang matagal[b] sa lupain na tatawirin mo[c] ang Jordan upang pumasok doon at angkinin ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa pagkalipol ay malilipol kayo,” isang mariing konstruksyong nagsasaad na tiyak ang pagkapuksa.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “hindi ninyo pahahabain ang inyong mga araw.”
    reason: lexical_alternative
  - marker: c
    text: Sa bahaging ito, lumilipat ang Hebreo mula sa maramihang “kayo” tungo sa isahang “mo,” anupat kinakausap ang Israel bilang iisang bayan.
    reason: cultural_note
lexical_decisions:
- source_word: הִגַּדְתִּי
  choice: Ipinahahayag ko
  rationale: Ang Hiphil ng נגד ay tumutukoy sa taimtim na pagpapabatid o pagpapahayag. Pinananatili ng “ipinahahayag ko” ang pormal at mariing tono ng babala.
- source_word: לָכֶם הַיּוֹם
  choice: sa inyo ngayon
  rationale: Tuwirang inililipat ang maramihang kausap at ang agarang panahong ipinahihiwatig ng “ngayon.”
- source_word: אָבֹד תֹּאבֵדוּן
  choice: tiyak kayong mapapahamak
  rationale: Ang infinitive absolute na kasunod ng kaugnay na pandiwa ay nagbibigay-diin sa katiyakan ng kapahamakan. Likas sa modernong Tagalog ang “tiyak” bilang katumbas ng mariing Hebreong konstruksyon.
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: Hindi kayo mabubuhay nang matagal
  rationale: Ang literal na “hindi ninyo pahahabain ang mga araw” ay isang Hebreong idyoma para sa hindi mahabang buhay. Ang salin ay malinaw at natural, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: עַל הָאֲדָמָה
  choice: sa lupain
  rationale: Sa konteksto ng Deuteronomio, tumutukoy ito sa lupaing pangako sa kabila ng Jordan, hindi lamang sa lupa o soil.
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת־הַיַּרְדֵּן
  choice: tatawirin mo ang Jordan
  rationale: Pinananatili ang isahang anyo ng אַתָּה upang maipakita ang biglang paglipat ng Hebreo mula sa maramihang kausap tungo sa Israel bilang iisang bayan.
- source_word: לָבֹא שָׁמָּה לְרִשְׁתָּהּ
  choice: upang pumasok doon at angkinin iyon
  rationale: Ang “doon” ay tahasang kumakatawan sa שָׁמָּה, at ang “iyon” sa pambabaeng isahang hulapi ng לְרִשְׁתָּהּ na tumutukoy sa lupain. Ang ירש ay ang pag-angkin o pagkuha ng lupain bilang pag-aari.
theological_decisions:
- issue: Paglipat mula sa maramihan tungo sa isahang pagtukoy sa Israel
  choice: Gamitin ang “sa inyo/kayo” sa unang bahagi at “mo” sa sugnay tungkol sa pagtawid
  alternative: Gawing maramihan ang lahat ng panghalip para sa mas makinis na Tagalog
  rationale: Nagsisimula ang Hebreo sa maramihang לָכֶם at mga pandiwang maramihan, ngunit gumagamit ng isahang אַתָּה sa sugnay tungkol sa pagtawid. Pinananatili ng salin ang retorikal na pagtingin sa Israel kapuwa bilang maraming tagapakinig at bilang iisang bayang tipan.
- issue: Kahulugan ng הָאֲדָמָה sa babalang tipan
  choice: lupain
  alternative: lupa
  rationale: Ang tinutukoy ay ang tiyak na teritoryong papasukan at aangkinin sa kabila ng Jordan. Hindi nito tinutukoy lamang ang pisikal na lupa.
- issue: Lakas ng babalang אָבֹד תֹּאבֵדוּן
  choice: tiyak kayong mapapahamak
  alternative: malilipol kayo nang lubusan
  rationale: Pinananatili ng “tiyak” ang diin at katiyakan ng konstruksyon nang hindi dinaragdagan ang teksto ng ideya ng lubusang pagkalipol, na maaaring maging mas tiyak kaysa sa saklaw ng pandiwa rito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Ginamit ang “ipinahahayag,” “lupain,” at “angkinin” upang mapanatili ang solemneng wikang pangtipan nang hindi nagiging lipas o labis na teknikal. Sadyang pinanatili ang paglipat ng bilang ng panghalip, at ipinaliwanag ito sa talababa upang hindi mapagkamalang pagkakamali.
