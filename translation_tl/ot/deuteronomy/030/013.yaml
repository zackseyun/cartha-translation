  source_fidelity: Tumpak ang pangunahing diwa ng draft, kabilang ang lokasyong “ibayo ng dagat,” ang pagtawid tungo sa kabila, pagkuha para sa bayan, pagpaparinig, at pagsasagawa. Gayunman, ang “tungo sa kabilang ibayo ng dagat” ay hindi likas at paulit-ulit ang kahulugang “kabila/ibayo.” Ang “iparirinig ito sa atin” ay mas malinaw at likas na Tagalog na katumbas ng causative na וְיַשְׁמִעֵנוּ אֹתָהּ.
