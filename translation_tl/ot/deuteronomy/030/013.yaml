  terminology: Pinanatili ang “ibayo ng dagat” para sa unang spatial na parirala at “kabilang panig ng dagat” para sa layon ng pagtawid. Hindi nagdaragdag ang “kukunin ito para sa atin” ng interpretasyong “dalhin,” samantalang ang talababa ay maayos na nagtatala ng kontekstuwal na alternatibo.
