  - severity: medium
    issue: Medyo pilit ang “magpaparinig nito sa atin.”
    rationale: Bagaman nauunawaan, mas likas ang “iparirinig ito sa atin,” na malinaw ring causative at pinananatili ang ugnayang “iparinig [ang bagay] sa amin.”}],
