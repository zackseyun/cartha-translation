  text: וְ/לֹֽא מֵ/עֵ֥בֶר לַ/יָּ֖ם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲבָר לָ֜/נוּ אֶל עֵ֤בֶר הַ/יָּם֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: tl
  text: At hindi ito nasa ibayo ng dagat[a], upang sabihin mo, “Sino ang tatawid para sa atin tungo sa kabilang panig ng dagat, kukunin ito para sa atin[b], at iparirinig ito sa atin[c], upang gawin natin ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lampas sa dagat” o “sa kabilang panig ng dagat.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magdadala nito sa atin.” Literal na “kukunin,” ngunit sa konteksto ay tumutukoy sa pagkuha nito upang mapalapit at mapasaatin.
    reason: lexical_alternative
  - marker: c
    text: 'Literal na “iparirinig ito sa atin.” Isa itong causative na pahayag: pangyayaring marinig ito ng iba; maaari itong mangahulugang ipahayag o ipaliwanag ito sa kanila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: nasa kabila ng dagat
  rationale: Ipinahahayag ng idyoma ang kinaroroonan sa kabilang panig ng dagat. Likas ito sa modernong Tagalog at pinananatili ang larawang pangkalawakan.
- source_word: הִוא
  choice: ito
  rationale: Ang pambabaeng panghalip sa Hebreo ay tumutukoy pabalik sa utos o salita sa konteksto. Hindi minamarkahan ng Tagalog ang kasarian ng panghalip.
- source_word: לֵאמֹר
  choice: upang sabihin mo
  rationale: Ipinakikilala nito ang nilalaman ng isang ipinapalagay na pagtutol. Ang pang-isahang 'mo' ay tumutugma sa anyong Hebreo.
- source_word: יַעֲבָר לָנוּ
  choice: tatawid para sa atin
  rationale: Pinananatili ng 'tatawid' ang kilos at ang retorikal na hinaharap ng imperpektibo; malinaw na ang gawain ay gagawin alang-alang sa bayan.
- source_word: אֶל עֵבֶר הַיָּם
  choice: tungo sa kabilang ibayo ng dagat
  rationale: Hayagang pinananatili ang direksiyon at destinasyong nasa Hebreo, pati ang pag-uulit ng larawang 'kabila/ibayo.'
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: kukuha nito para sa atin
  rationale: Ang literal na diwa ng לקח ay 'kunin.' Sa konteksto, ipinahihiwatig nitong makuha ang utos at mailapit sa bayan, nang hindi tahasang idinaragdag ang 'dalhin.'
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: magpaparinig nito sa atin
  rationale: 'Pinananatili ng ''magpaparinig'' ang anyong causative ng Hiphil: pangyayaring marinig ito ng bayan, nang hindi nililimitahan ang paraan sa pagpapahayag o pagpapaliwanag.'
- source_word: וְנַעֲשֶׂנָּה
  choice: upang maisagawa natin ito
  rationale: Ipinakikita ang layunin o bunga ng pagkarinig—ang pagsunod sa pamamagitan ng pagsasagawa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pang-isahang kausap sa 'mo' at ang maramihang tinig ng bayan sa 'atin/natin.' Ginamit ang 'kabilang ibayo' upang lubos na katawanin ang אֶל עֵבֶר bagaman bahagyang mataas ang rehistro; ipinaliliwanag ng talababa ang mas karaniwang mga katumbas.
