language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַתֶּ֨ם נִצָּבִ֤ים הַ/יּוֹם֙ כֻּלְּ/כֶ֔ם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵי/כֶ֑ם רָאשֵׁי/כֶ֣ם שִׁבְטֵי/כֶ֗ם זִקְנֵי/כֶם֙ וְ/שֹׁ֣טְרֵי/כֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: tl
  text: Nakatayo kayong lahat ngayon sa harap ni Yahweh na inyong Diyos—ang inyong mga pinuno[a], mga lipi, matatandang pinuno, at mga opisyal—bawat lalaking Israelita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang parirala bilang “mga pinuno ng inyong mga lipi.” Sa literal, “inyong mga ulo” ang unang salita.
    reason: alternative_reading
  - marker: b
    text: O “lahat ng kalalakihang Israelita.” Distributibo ang literal na Hebreong “bawat lalaki ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצָּבִים
  choice: nakatayo
  rationale: Ipinapahayag ng pandiwaring Niphal ang kasalukuyang kalagayan ng kapulungang nakatayo sa harap ng Diyos; natural at malinaw sa Tagalog ang “nakatayo.”
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Likas na katumbas ito ng temporal na diin ng הַיּוֹם sa makabagong Tagalog.
- source_word: כֻּלְּכֶם
  choice: kayong lahat
  rationale: Pinananatili nito ang tahasang kolektibong diin sa buong kausap na kapulungan.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Maikli at natural itong paglalarawan sa pagtayo sa presensiya ng isang persona, dito ay ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang nasa tekstong Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tuwirang pinananatili ang hulaping pangmaramihang “inyong” at ang pormulang tipan na tumutukoy sa Diyos ng Israel.
- source_word: רָאשֵׁיכֶם
  choice: inyong mga pinuno
  rationale: Ang literal na “inyong mga ulo” ay madaling mapagkamalang bahagi ng katawan sa Tagalog; “mga pinuno” ang natural na kahulugang idyomatiko habang itinatala sa talababa ang alternatibong pagkakaugnay nito sa “mga lipi.”
- source_word: שִׁבְטֵיכֶם
  choice: mga lipi
  rationale: Pinananatili ang payak na leksikal na kahulugan at ang posibilidad na isa itong hiwalay na pangkat sa talaan.
- source_word: זִקְנֵיכֶם
  choice: matatandang pinuno
  rationale: Sa kontekstong panlipunan at pampamahalaan, hindi lamang edad kundi kinikilalang katungkulan sa pamayanan ang tinutukoy; iniiwasan din nito ang posibleng pakahulugang lahat lamang ng matatanda.
- source_word: שֹׁטְרֵיכֶם
  choice: mga opisyal
  rationale: Malawak ngunit angkop na katawagan ito sa mga tagapangasiwang binabanggit sa Deuteronomio nang hindi labis na nililimitahan ang kanilang tungkulin.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: bawat lalaki ng Israel
  rationale: Pinananatili nito ang panlalaking pangngalang אִישׁ at ang distributibong puwersa ng כֹּל, sa halip na gawing neutral na “lahat ng Israel.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kasariang ipinahihiwatig ng כֹּל אִישׁ יִשְׂרָאֵל
  choice: bawat lalaki ng Israel
  alternative: lahat ng Israel; bawat Israelita
  rationale: Tiyak na panlalaki ang אִישׁ dito. Pinananatili ng salin ang anyong iyon kahit ipinakikita ng kasunod na talata na kabilang din sa mas malawak na kapulungan ang ibang sambahayan.
- issue: Ugnayan ng רָאשֵׁיכֶם at שִׁבְטֵיכֶם
  choice: 'magkahiwalay na mga bahagi ng talaan: “inyong mga pinuno, mga lipi”'
  alternative: “mga pinuno ng inyong mga lipi”
  rationale: Maaaring basahin ang pagkakasunod bilang magkahiwalay na mga kategorya, alinsunod sa Masoretikong paghahati, ngunit tunay ding posible ang idyomatikong pag-uugnay ng dalawang salita; pinananatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “matatandang pinuno” upang maipakita ang pampamayanang katungkulan, at “mga opisyal” bilang hindi labis na espesipikong katawagan. Ang mga gitling na em dash ay nagtatakda sa paliwanag na talaan ng mga pangkat.
