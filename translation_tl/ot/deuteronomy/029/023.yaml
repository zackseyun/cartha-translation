  text: וְ/אָֽמְרוּ֙ כָּל הַ/גּוֹיִ֔ם עַל מֶ֨ה עָשָׂ֧ה יְהוָ֛ה כָּ֖כָה לָ/אָ֣רֶץ הַ/זֹּ֑את מֶ֥ה חֳרִ֛י הָ/אַ֥ף הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: tl
  text: At sasabihin ng lahat ng bansa[a], “Bakit ginawa ni Yahweh ang ganito sa lupaing ito? Bakit napakatindi ng nag-aapoy na galit na ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas pormal: “At sasabihin ng lahat ng bansa, ‘Sa anong dahilan ginawa ni Yahweh ang ganito sa lupaing ito? Bakit itong matinding pag-aapoy ng galit?’”'
    reason: Ipinapakita ang mas pormal na pagtatanong tungkol sa dahilan at pinananatili ang metapora ng init o pag-aapoy sa Hebreo.
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: At sasabihin
  rationale: Ang Qal perfect na may prefixed conjunction ay tumutukoy rito sa magiging tugon ng mga bansa kapag nakita nila ang pagkawasak ng lupain; pinanatili rin ng “At” ang ugnayan sa naunang diskurso.
- source_word: כָּל הַגּוֹיִם
  choice: lahat ng bansa
  rationale: Karaniwang tumutukoy ang גּוֹיִם sa mga bansang banyaga na makakakita sa sinapit ng Israel; likas at malinaw sa modernong Tagalog ang “lahat ng bansa.”
- source_word: עַל מֶה
  choice: Bakit
  rationale: Ang idyomang עַל מֶה ay nagtatanong tungkol sa sanhi o dahilan; “Bakit” ang pinakanatural na katumbas sa Tagalog.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: ginawa ni Yahweh ang ganito
  rationale: Pinananatili ng “ang ganito” ang demonstratibong diwa ng כָּכָה, na tumutukoy sa matinding sinapit ng lupain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לָאָרֶץ הַזֹּאת
  choice: sa lupaing ito
  rationale: Tumutukoy ang אָרֶץ sa lupaing saklaw ng tipan at hinatulan; ang “sa lupaing ito” ang likas na Tagalog na katumbas kasunod ng pandiwang “ginawa.”
- source_word: מֶה חֳרִי הָאַף
  choice: Bakit ganito katindi ang nag-aapoy na galit
  rationale: Ipinahahayag ng ikalawang מֶה ang tanong tungkol sa dahilan, samantalang pinananatili ng “nag-aapoy” ang matingkad na metapora ng חֳרִי at ng “galit” ang idyomatikong kahulugan ng אַף.
- source_word: הַגָּדוֹל הַזֶּה
  choice: ganito katindi ... na ito
  rationale: Likas na inililipat sa Tagalog ang tindi at demonstratibong diin ng parirala sa hulmahang “ganito katindi ... na ito.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa talata. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang hinaharap na pananaw ng konteksto, ang personal na pangalang Yahweh, at ang metapora ng nag-aapoy na galit nang hindi ginagawang sobrang literal at di-likas ang pangunahing teksto.
