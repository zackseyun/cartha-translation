  yaml_path: translation/ot/deuteronomy/029/016.yaml
  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: tl
  text: at nakita ninyo ang kanilang kasuklam-suklam na mga bagay[a] at ang kanilang mga diyus-diyosan[b]—kahoy at bato, pilak at ginto—na kasama nila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang mga karumal-dumal na bagay.” Ang salitang Hebreo ay matinding katawagan ng pagkasuklam, na madalas gamitin para sa mga bagay na kaugnay ng pagsamba sa diyus-diyosan.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo para rito ay isang mapanghamak na katawagan sa mga diyus-diyosan at maaaring may magaspang na pahiwatig na gaya ng “mga ‘idolong-dumi.’”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “na nasa kanila.” Tinutukoy nito ang mga bansang dinaanan ng Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: at nakita ninyo
  rationale: Ang Qal wayyiqtol na ikalawang panauhang maramihan ay nagpapatuloy sa paggunita ni Moises; natural sa modernong Tagalog ang payak na nakaraan.
- source_word: שִׁקּוּצֵיהֶם
  choice: kanilang kasuklam-suklam na mga bagay
  rationale: Pinananatili nito ang matinding pagkasuklam ng salitang Hebreo at ang pagkakaiba nito sa kasunod na tahasang katawagang para sa mga diyus-diyosan.
- source_word: גִּלֻּלֵיהֶם
  choice: kanilang mga diyus-diyosan
  rationale: Malinaw nitong tinutukoy ang mga idolo sa natural na Tagalog; inilalahad sa talababa ang mapanghamak at posibleng magaspang na himig ng salitang Hebreo.
- source_word: עֵץ וָאֶבֶן כֶּסֶף וְזָהָב
  choice: mga yari sa kahoy at bato, pilak at ginto
  rationale: Ipinakikita na ang apat na sangkap ay naglalarawan sa mga bagay na sinasamba, habang pinananatili ang ayos at maikling pagkakahanay ng Hebreo.
- source_word: אֲשֶׁר עִמָּהֶם
  choice: na nasa gitna nila
  rationale: Natural itong tumutukoy sa presensiya ng mga bagay na ito sa mga bansang binanggit sa konteksto, nang hindi ipinahihiwatig na taglay ng Israel ang mga iyon.
theological_decisions:
- issue: Dalawang mapanghamak na katawagan para sa mga bagay na sinasamba
  choice: Panatilihing magkahiwalay ang “kasuklam-suklam na mga bagay” at “mga diyus-diyosan.”
  alternative: “kasuklam-suklam na mga diyus-diyosan” o “mga karumal-dumal na bagay at mga idolong-dumi”
  rationale: Dalawang magkaibang terminong Hebreo ang ginamit. Pinananatili ng salin ang pagkakaibang iyon nang hindi nagdaragdag ng paliwanag na teolohikal sa pangunahing teksto.
- issue: Saklaw ng pariralang אֲשֶׁר עִמָּהֶם
  choice: 'Iugnay sa mga bansang nasa naunang konteksto: “na nasa gitna nila.”'
  alternative: “na kasama nila” o “na pag-aari nila”
  rationale: Ang mga bansang dinaanan ng Israel ang pinakamalapit na tinutukoy sa konteksto; hindi nito ipinahihiwatig na ang Israel ang may-ari ng mga diyus-diyosan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “diyus-diyosan” bilang karaniwang terminong biblikal na madaling maunawaan; ang mga gitling-pahaba ay naghihiwalay sa talaan ng mga sangkap nang hindi binabago ang ugnayang panggramatika.
