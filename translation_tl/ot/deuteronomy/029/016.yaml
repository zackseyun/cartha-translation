    issue: Ang “na nasa gitna nila” ay mas makitid kaysa עִמָּהֶם.
    rationale: Ang Hebreo ay karaniwang ‘na kasama nila’ o ‘na nasa kanila’; hindi nito tahasang sinasabing nasa gitna o nasa kalagitnaan ng mga bansa ang mga bagay.
  - severity: low
    issue: Ang “mga yari sa” ay nagdaragdag ng pandiwang wala sa Hebreo at bahagyang nililimitahan ang appositional material list.
    rationale: Ang Hebreo ay naglilista lamang ng ‘kahoy at bato, pilak at ginto.’ Ang payak na listahan sa Tagalog ay parehong natural at mas malapit sa anyo ng pinagmulan.
  - severity: low
    issue: Ang “mga idolong-dumi” sa talababa ay medyo di-karaniwan bilang Filipino.
    rationale: Maaaring panatilihin ang matinding posibleng nuwans sa pamamagitan ng panipi at paliwanag, nang hindi ipinapakitang ito ang tiyak na kahulugan.
