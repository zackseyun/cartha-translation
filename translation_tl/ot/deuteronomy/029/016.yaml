  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang bayan ay nakakita ng dalawang mapanghamak na tawag para sa mga bagay na sinasamba, kasunod ang tala ng kahoy, bato, pilak, at ginto. Gayunman, ang “na nasa gitna nila” ay mas tiyak na ‘in their midst,’ samantalang ang עִמָּהֶם ay mas tuwirang ‘na kasama nila’/‘na nasa kanila.’ Ang payak na pagkakahanay ng mga materyal ay mas malapit din sa Hebreong apposition kaysa “mga yari sa.”'
  naturalness: Malinaw at marangal ang salin. Mas natural at mas maigsi sa modernong Filipino ang “—kahoy at bato, pilak at ginto—” sa ganitong nakahanay na paglalarawan. Ang “na kasama nila” ay natural at hindi nagdaragdag ng espesipikong lokasyong ipinahihiwatig ng “nasa gitna.”
  terminology: Ang “kasuklam-suklam na mga bagay” at “mga diyus-diyosan” ay angkop at pinananatiling magkaiba ang dalawang Hebreong mapanghamak na termino. Ang talababa para sa גִּלּוּלִים ay dapat magpahiwatig na ang ‘dung-idols’ ay posibleng magaspang na nuwans, hindi isang tiyak na literal na salin.
  issues:
