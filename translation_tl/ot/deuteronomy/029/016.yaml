  to: at nakita ninyo ang kanilang kasuklam-suklam na mga bagay[a] at ang kanilang mga diyus-diyosan[b]—kahoy at bato, pilak at ginto—na kasama nila.[c]
  rationale: Pinalitan ang lokatibong “nasa gitna nila” ng “na kasama nila” upang mas tapat na maipahayag ang עִמָּהֶם at ang kontekstuwal na pagtukoy nito sa mga bansang binanggit sa naunang talata. Inalis ang idinagdag na “mga yari sa” upang mapanatili ang maikli at appositional na talaan ng mga materyal sa Hebreo. Nilinaw rin ang pananalita sa talababa hinggil sa posibleng magaspang na nuwans ng גִּלּוּלִים.
