  text: הַ֨/נִּסְתָּרֹ֔ת לַ/יהוָ֖ה אֱלֹהֵ֑י/נוּ וְ/הַ/נִּגְלֹ֞ת לָ֤ׄ/נׄוּׄ וּׄ/לְׄ/בָׄנֵׄ֨יׄ/נׄוּׄ֙ עַד עוֹלָ֔ם לַ/עֲשׂ֕וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: tl
  text: Ang mga bagay na nakatago ay nauukol kay Yahweh na ating Diyos, ngunit ang mga bagay na inihayag ay nauukol sa atin at sa ating mga anak[a] magpakailanman, upang tuparin natin ang lahat ng salita ng kautusang ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa tekstong Hebreo, may di-pangkaraniwang mga tuldok ng mga eskriba sa ibabaw ng mga titik sa “sa atin at sa ating mga anak.” Hindi tiyak ang kahulugan ng mga tandang ito, kaya hindi binago ng salin ang mismong mga salita.
    reason: textual_note
  - marker: b
    text: Ang “kautusan” ay maaari ring isaling “tagubilin” o “katuruan.” Sa Deuteronomio, tumutukoy ito sa katuruan ng tipan na inilalahad ni Moises sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: ang mga bagay na nakatago
  rationale: Ang substantivized passive participle mula sa סתר ay tumutukoy sa mga bagay na lingid o ikinubli. Likas sa makabagong Tagalog ang “mga bagay na nakatago” at hindi nito ipinahihiwatig na mga esoterikong hiwaga ang tinutukoy.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: nauukol kay Yahweh na ating Diyos
  rationale: Ang לְ ay nagpapahayag dito ng pag-aari o pagkaukol. Pinanatili ang personal na pangalang יהוה bilang “Yahweh,” at ang אֱלֹהֵינוּ bilang “ating Diyos.”
- source_word: וְהַנִּגְלֹת
  choice: ngunit ang mga bagay na inihayag
  rationale: Ang passive participle mula sa גלה ay kaagapay ng “mga bagay na nakatago.” Isinalin ang וְ bilang “ngunit” upang malinaw na maipakita ang pagsalungat ng dalawang sugnay.
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: nauukol sa atin at sa ating mga anak
  rationale: Inulit sa Tagalog ang ipinahihiwatig na “nauukol” upang mapanatili ang parallelismo at maging malinaw ang pangungusap. Ang בנים ay kolektibong tumutukoy rito sa mga anak o salinlahi, hindi lamang sa mga lalaking anak.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Karaniwang katumbas sa Tagalog ng idyomang Hebreo para sa walang-takdang pagpapatuloy.
- source_word: לַעֲשׂוֹת
  choice: upang tuparin natin
  rationale: Ang infinitive na may לְ ay nagpapahayag ng layunin. Sa konteksto ng mga tuntunin ng tipan, mas natural ang “tuparin” kaysa literal na “gawin,” habang pinananatili ang diin sa pagsunod.
- source_word: אֵת כָּל דִּבְרֵי
  choice: ang lahat ng salita ng
  rationale: Pinanatili ang literal na “mga salita” upang idiin ang tiyak na mga pahayag at tuntunin ng tipan, sa halip na palawakin ito bilang pangkalahatang “mga bagay.”
- source_word: הַתּוֹרָה הַזֹּאת
  choice: kautusang ito
  rationale: Maaaring mangahulugan ang תּוֹרָה ng “tagubilin” o “katuruan,” ngunit sa kontekstong tipan at legal ng Deuteronomio, malinaw at likas ang “kautusan.”
theological_decisions:
- issue: Saklaw ng “mga bagay na nakatago” at “mga bagay na inihayag”
  choice: 'Iniwan ang mga parirala na pangkalahatan, gaya ng Hebreo: may mga bagay na nauukol sa Diyos at may mga bagay na inihayag sa Israel para sa pagsunod.'
  alternative: Ituring itong alinman sa isang ganap na prinsipyo tungkol sa lahat ng hiwaga ng Diyos o bilang pagtukoy lamang sa partikular na mga pagpapala at sumpa sa kalapit na konteksto.
  rationale: Hindi tahasang tinutukoy ng talata ang buong saklaw ng alinmang pangkat. Pinananatili ng salin ang teolohikal na tensiyon at hinahayaang gabayan ng konteksto ang pagpapakahulugan nang hindi ito isinasara.
- issue: Layunin ng kapahayagan
  choice: Isinalin ang לַעֲשׂוֹת bilang “upang tuparin natin,” na nag-uugnay sa kapahayagan at pagsunod.
  alternative: “Para gawin natin” o isang saling hindi nagpapahayag ng layunin.
  rationale: Ipinahihiwatig ng infinitive na may לְ ang layunin o bunga, ngunit hindi dinaragdagan ng salin ang sinabi tungkol sa paraan o teolohikal na batayan ng pagsunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nauukol” upang maipahayag ang pag-aari nang hindi tunog-kolokyal; “tuparin” naman ang pinili para sa aktuwal na pagsunod sa mga salita ng tipan. Pinanatili ang pangalang “Yahweh” alinsunod sa ibinigay na English POB consultation text.
