  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: tl
  text: Mangyayari na, kapag narinig niya ang mga salita ng panunumpang ito[a], pagpapalain niya ang sarili sa kanyang kalooban at sasabihin, ‘Magkakaroon ako ng kapayapaan, kahit mamuhay ako ayon sa katigasan ng aking puso’—upang lipulin ang sagana sa tubig kasama ng nauuhaw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumpang ito.” Ang salitang Hebreo ay maaaring tumukoy sa isang panunumpang may kalakip na sumpa.
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring unawain: “upang lipulin ang lupang nadidiligan kasama ng tuyong lupa,” samakatuwid, lipulin ang lahat nang walang pagtatangi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: sumpang may panunumpa
  rationale: Ang אָלָה ay panunumpang may kalakip na sumpa o kaparusahan. Pinananatili ng parirala ang dalawang sangkap ng kahulugan sa konteksto ng tipan nang hindi pinipili lamang ang isa.
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: pagpapalain niya ang sarili niya sa kanyang puso
  rationale: Pinananatili nito ang reflexive na anyo at ang kabalintunaan ng taong palihim na nagpapahayag ng pagpapala sa sarili.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: Magiging maayos ako
  rationale: Saklaw ng שָׁלוֹם ang kapayapaan, kalagayang mabuti, at katiwasayan. Natural sa modernong Filipino ang piniling anyo at ipinapahayag nito ang mapangahas na katiyakan ng nagsasalita.
- source_word: שְׁרִרוּת לִבִּי
  choice: katigasan ng aking puso
  rationale: Ipinahahayag ng שְׁרִרוּת ang matigas at mapilit na kalooban. Ang 'katigasan ng puso' ay malinaw, marangal, at angkop sa babala ng tipan.
- source_word: לְמַעַן
  choice: upang
  rationale: Pinananatili ang layunin o nilalayong resulta na ipinahihiwatig ng לְמַעַן.
- source_word: סְפוֹת
  choice: lipulin
  rationale: Sa konteksto ng paghuhukom, malamang na tumutukoy ang pandiwa sa pagwalis o lubusang pagwasak; mas natural sa Filipino ang 'lipulin'.
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: kapwa ang sagana sa tubig at ang nauuhaw
  rationale: Pinananatili ang magkatambal na larawang Hebreo at ang pagiging substantibo ng dalawang pang-uri, nang hindi tiyak na itinatakda kung lupa, tao, o ibang bagay ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng covenant-sanction term na הָאָלָה
  choice: sumpang may panunumpa
  alternative: panunumpa; sumpa
  rationale: Maaaring tumukoy ang salita sa panunumpang may dalang sumpa. Ang piniling salin ay hayagang nag-iingat sa dalawang puwersa ng salita sa halip na patahimikin ang isa.
- issue: Pagpapakahulugan sa mahirap na idyomang הָרָוָה אֶת־הַצְּמֵאָה
  choice: panatilihin ang metapora bilang 'kapwa ang sagana sa tubig at ang nauuhaw'
  alternative: ang lupang nadidiligan kasama ng tuyong lupa; lipulin ang lahat nang walang pagtatangi
  rationale: Hindi ganap na tiyak ang tinutukoy ng kawikaan. Pinananatili ng pangunahing teksto ang tensiyon at larawan ng Hebreo, habang inilalahad sa talababa ang karaniwang pagpapakahulugang tumutukoy sa lupa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'sarili niya' para sa natural na kasalukuyang Tagalog, habang pinanatili ang biblikal na larawang 'puso.' Ang huling metapora ay sadyang hindi lubusang ipinaliwanag sa pangunahing teksto.
