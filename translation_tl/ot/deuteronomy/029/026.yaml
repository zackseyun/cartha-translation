  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בָּ/אָ֣רֶץ הַ/הִ֑וא לְ/הָבִ֤יא עָלֶ֨י/הָ֙ אֶת כָּל הַ/קְּלָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֥פֶר הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/026.yaml
  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: tl
  text: Kaya nag-alab ang galit ni Yahweh laban sa lupaing iyon, at ipinasapit niya roon ang bawat sumpang nakasulat sa aklat na ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: nag-alab ang galit
  rationale: Pinananatili nito ang matingkad na larawang Hebreo ng galit na nag-aalab, habang natural at malinaw sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang YHWH bilang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: בָּאָרֶץ הַהִוא
  choice: laban sa lupaing iyon
  rationale: Sa idyomang חרה אף, maaaring tukuyin ng ב ang pinatutungkulan ng galit; ipinahahayag ng 'laban sa' na ang lupain ang tumanggap ng hatol.
- source_word: לְהָבִיא עָלֶיהָ
  choice: at ipinasapit niya roon
  rationale: Ang infinitibo ay maaaring magpahayag ng bunga o layunin. Ang 'ipinasapit' ay natural na Tagalog para sa pagpaparanas o pagdadala ng sumpa, at ang 'roon' ay tumutukoy sa lupaing iyon.
- source_word: כָּל הַקְּלָלָה
  choice: ang bawat sumpa
  rationale: Bagaman pang-isahan ang Hebreo, may diwang kolektibo at ganap; malinaw na ipinahahayag ng 'bawat sumpa' ang kabuuan.
- source_word: הַכְּתוּבָה
  choice: nakasulat
  rationale: Tuwirang ipinapahayag ang pasibong pandiwaring Hebreo at pinananatili ang tekstuwal at legal na diwa.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: sa aklat na ito
  rationale: Ang 'aklat' ang pinakakaraniwan at madaling maunawaang katumbas ng סֵפֶר sa kontekstong ito, nang hindi ipinipilit ang materyal na anyong 'balumbon.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng galit ni Yahweh at pagdating ng mga sumpa
  choice: at ipinasapit niya roon
  alternative: upang ipasapit niya roon
  rationale: Maaaring magpahayag ang לְהָבִיא ng layunin o bunga. Ang 'at ipinasapit' ay natural na kumakatawan sa resultang kasunod ng nag-alab na galit nang hindi itinatanggi ang posibleng layuning diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang masidhing larawang 'nag-alab ang galit' at ang pangalang Yahweh; iniwasan ang labis na arkaiko o teknikal na pananalita.
