  to: At sasabihin nila, “Dahil tinalikuran nila ang tipan ni Yahweh, ang Diyos ng kanilang mga ama,[a] na ginawa niya kasama nila nang ilabas niya sila mula sa lupain ng Ehipto.”
  rationale: Inayos ang pangunahing salin upang mapanatili ang “mga ama” ng tekstong Hebreo, habang iniiwan sa talababa ang mas malawak at natural na alternatibong “mga ninuno.” Pinalitan ang “sa kanila” ng “kasama nila” upang tumpak na maipahayag ang “with them,” at ginawang “At” ang panimulang pangatnig upang hindi magdagdag ng temporal na diin.
