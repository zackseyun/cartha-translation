  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: tl
  text: At sasabihin nila, “Dahil tinalikuran nila ang tipan ni Yahweh, ang Diyos ng kanilang mga ama,[a] na ginawa niya kasama nila nang ilabas niya sila mula sa lupain ng Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang Diyos ng kanilang mga ama”; maaari ring isalin na “ang Diyos ng kanilang mga ninuno.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Pagkatapos ay sasabihin nila
  rationale: Ipinagpapatuloy nito ang tugon sa naunang konteksto at pinananatili ang hinaharap na diwa; natural sa modernong Tagalog ang “Pagkatapos ay.”
- source_word: עַל אֲשֶׁר
  choice: Dahil
  rationale: Nagsasaad ang parirala ng dahilan kung bakit sinapit ng lupain ang kapahamakan.
- source_word: עָזְבוּ
  choice: tinalikuran
  rationale: Ipinahihiwatig ng pandiwa ang kusang pagtalikod at kataksilan sa tipan, hindi lamang simpleng pag-alis.
- source_word: בְּרִית
  choice: tipan
  rationale: Ito ang malinaw at nakaugaliang salin para sa nagbubuklod na ugnayang itinatag ng Diyos sa Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Natural at malinaw ito sa modernong Tagalog; maaaring tukuyin ng אָבוֹת ang mga ama o ang mas malawak na salinlahing pinagmulan.
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: na ginawa niya sa kanila
  rationale: Ang literal na idyomang Hebreo ay “pinutol ang tipan,” ngunit “ginawa ... sa kanila” ang natural na paraan ng pagpapahayag nito sa Tagalog.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: nang ilabas niya sila
  rationale: Ginagawang malinaw ang temporal na gamit ng infinitive construct at pinananatili ang Diyos bilang tagapagligtas na naglabas sa kanila.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang buong pariralang Hebreo at ang kaugnayan nito sa paglabas mula sa Ehipto.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng אֱלֹהֵי אֲבֹתָם
  choice: ang Diyos ng kanilang mga ninuno
  alternative: ang Diyos ng kanilang mga ama
  rationale: Sa konteksto, tumutukoy ito sa Diyos ng naunang mga salinlahi ng Israel. Ang “mga ninuno” ay natural sa Tagalog, habang ang mas literal na “mga ama” ay inilalahad sa talababa upang mapanatili ang leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “tinalikuran” upang ipahayag ang sinadyang pag-abandona sa tipan, at iniwasan ang sobrang literal na “pinutol ang tipan.”
