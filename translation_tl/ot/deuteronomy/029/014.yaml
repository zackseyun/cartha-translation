base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: tl
  text: kundi sa sinumang narito kasama natin ngayon, na nakatayo sa harap ni Yahweh na ating Diyos, at sa sinumang wala rito kasama natin ngayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sinumang wala rito kasama natin ngayon” ay maaaring tumukoy sa mga Israelitang wala sa pagtitipon, sa mga susunod na salinlahi, o sa kapwa mga ito.
    reason: Pinananatili ang hindi tiyak na saklaw ng pariralang Hebreo nang hindi pumipili ng isang interpretasyon.
lexical_decisions:
- source_word: כִּי
  choice: kundi
  rationale: Sa konteksto, ipinagpapatuloy nito ang pagsalungat sa naunang pahayag na hindi lamang sa mga kausap ginagawa ang tipan. Ang “kundi” ang likas na pang-ugnay sa Filipino.
- source_word: אֶת אֲשֶׁר
  choice: sa sinumang
  rationale: Ipinakikilala nito ang mga taong saklaw ng tipan at sumpa. Hinihiram ang “sa” mula sa pormula ng naunang talata, habang pinananatili ng “sinumang” ang distributibong anyo ng Hebreo.
- source_word: יֶשְׁנוֹ פֹּה עִמָּנוּ
  choice: narito kasama natin
  rationale: Ipinahahayag ng parirala ang aktuwal na pagkanaroon sa kapulungan at pinananatili ang ugnayang ipinahihiwatig ng עִם.
- source_word: עֹמֵד
  choice: nakatayo
  rationale: Pinananatili ang kongkretong larawan ng mga taong nakatayo sa harap ng Diyos sa pagtitipon para sa tipan.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Karaniwan at malinaw na katumbas sa modernong Filipino; pinanatili sa dalawang sugnay gaya ng pag-uulit sa Hebreo.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Likas at tuwirang katumbas na angkop kapwa sa pisikal at tipanang konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang natatanging pangalan ng Diyos sa tekstong Hebreo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Tuwirang isinasalin ang panghalip na unang panauhang maramihan; natural ang “ating” sa pariralang tumutukoy sa Diyos na kapwa kinikilala ng nagsasalita at mga kausap.
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ פֹּה עִמָּנוּ
  choice: at sa sinumang wala rito kasama natin
  rationale: Kaagapay ito ng unang sugnay at pinananatili ang payak na pagtanggi sa pagkanaroon. Hindi ito nilinaw bilang “hindi pa ipinanganganak” o “liban sa pagtitipon,” sapagkat hindi iyon tahasang sinasabi ng Hebreo.
theological_decisions:
- issue: Saklaw ng mga kalahok sa tipan na “wala rito kasama natin ngayon”
  choice: Panatilihing malawak at hindi tukoy ang tinutukoy ng parirala.
  alternative: Tukuyin sila bilang mga Israelitang wala sa pagtitipon, mga susunod na salinlahi, o kapwa mga pangkat.
  rationale: Hindi nililinaw ng Hebreo kung ang tinutukoy ay mga kasabay na wala sa kapulungan, mga salinlahing darating, o pareho. Pinananatili ng salin ang tunay na pagiging bukas ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong nakadepende sa naunang talata sa pamamagitan ng pambungad na “kundi,” at iniwasang gawing hiwalay na buong pangungusap ang talata.
