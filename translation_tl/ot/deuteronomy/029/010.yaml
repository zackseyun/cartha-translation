base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/010.yaml
  text: your little ones[a], your wives, and the sojourner who is in the midst of your camp, from the one who chops your wood to the one who draws your water[b],
translation:
  language: tl
  text: ang inyong maliliit na anak[a], ang inyong mga asawa, at ang dayuhang naninirahan na nasa gitna ng inyong kampo[b], mula sa tagaputol ng inyong kahoy hanggang sa tagaigib ng inyong tubig,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bata.” Ang Hebreong טַף ay tumutukoy lalo na sa maliliit na bata o sa mga umaasa sa sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong גֵּר ay tumutukoy sa isang dayuhang naninirahan sa loob ng pamayanan, hindi lamang sa isang bisita o nagdaraan.
    reason: lexical_clarification
lexical_decisions:
- source_word: טַפְּכֶם
  choice: ang inyong maliliit na anak
  rationale: Ang טַף ay tumutukoy lalo na sa maliliit na bata o mga umaasa sa sambahayan. Pinananatili ng “maliliit na anak” ang kongkretong diwa nang hindi ito pinalalawak sa lahat ng supling.
- source_word: נְשֵׁיכֶם
  choice: ang inyong mga asawa
  rationale: Sa konteksto ng pagtitipon ng tipan, ang relational na kahulugang “mga asawa” ang likas na pagbasa. Hindi na kailangang tukuyin ang kasarian sa Tagalog dahil malinaw ito sa konteksto ng Hebreo.
- source_word: וְגֵרְךָ
  choice: at ang dayuhang naninirahan
  rationale: Ang גֵּר ay hindi basta bisita o nagdaraan kundi dayuhang naninirahan sa pamayanan. Ang pariralang ito ay malinaw at likas sa modernong Tagalog.
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: sa loob ng inyong kampo
  rationale: Ipinahahayag nito ang kinaroroonan ng dayuhang naninirahan sa gitna ng komunidad. Ang “sa loob” ay natural na kumakatawan sa spatial na diwa ng בְּקֶרֶב.
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: mula sa pumuputol ng inyong kahoy
  rationale: Pinananatili ng pandiwaring “pumuputol” ang participial na anyo at sinisimulan ng “mula” ang saklaw na ipinapahayag ng מִן ... עַד.
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: hanggang sa umiigib ng inyong tubig
  rationale: Ang שֹׁאֵב ay tumutukoy sa pag-igib o pagsalok ng tubig. Ang “umiigib” ay maikli, natural, at angkop na katambal ng pagputol ng kahoy.
theological_decisions:
- issue: Saklaw panlipunan ng pagtitipon para sa tipan
  choice: Tahasang kabilang ang maliliit na anak, mga asawa, dayuhang naninirahan, at mga gumagawa ng mababang-uri o pang-araw-araw na gawain.
  alternative: Limitahan ang talaan sa mga Israelita lamang, o unawain ang mga manggagawa bilang metaporikal na mga uri.
  rationale: Ang payak na diwa ng Hebreo ay isang malawak na pag-iisa-isa ng mga naroroon sa pagtitipon. Pinananatili ng salin ang lawak na ito nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan at ang saklaw na “mula ... hanggang ...,” habang iniwasan ang salitang masyadong teknikal o lipas gaya ng “nakikipamayan.”
