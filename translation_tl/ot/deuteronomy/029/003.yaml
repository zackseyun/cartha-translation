reference: Deuteronomy 29:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: tl
  text: Ngunit[a] hindi kayo binigyan ni Yahweh ng pusong makaunawa, ng mga matang makakita, at ng mga taingang makarinig hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: At hindi.'
    reason: Pinahihintulutan ng וְ ang payak na pagpapatuloy na “At,” bagaman ang “Ngunit” ay mas malinaw na naghahayag ng pagsalungat sa konteksto.
lexical_decisions:
- source_word: וְלֹא
  choice: Ngunit hindi
  rationale: Ang וְ ay nag-uugnay sa naunang pahayag ngunit, kasama ng negasyon, nagpapakita rito ng malinaw na pagsalungat sa mga bagay na nakita na ng Israel. Likas sa makabagong Tagalog ang “Ngunit hindi,” habang pinananatili sa talababa ang posibleng payak na “At hindi.”
- source_word: נָתַן יְהוָה לָכֶם
  choice: hindi kayo binigyan ni Yahweh
  rationale: Tuwirang pinananatili ang Diyos bilang gumagawa at ang Israel bilang tumatanggap. Ang ayos na ito ay natural sa Tagalog at hindi pinahihina ang tahasang pag-uugnay ng kawalan sa hindi pagbibigay ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: לֵב לָדַעַת
  choice: pusong makaunawa
  rationale: Pinananatili ng “puso” ang malawak na Hebreong larawan ng panloob na pagkatao, kabilang ang pag-iisip at disposisyon. Sa kontekstong ito, ang ידע ay tumutukoy sa tunay na pagkabatid o pag-unawa, kaya mas likas at malinaw ang “makaunawa” kaysa sa literal ngunit maaaring malabong “makaaalam.”
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: ng mga matang makakita
  rationale: Pinananatili ang konkretong larawan at ang paralelismong mata—makakita.
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: at ng mga taingang makarinig
  rationale: Pinananatili ang konkretong larawan at ang paralelismong tainga—makarinig; ang “at” ay tuwirang kumakatawan sa koordinasyong Hebreo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwan at malinaw na katumbas ito ng temporal na parirala, at pinananatili nito ang saklaw hanggang sa kasalukuyang araw ng pagsasalita.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa kawalan ng pagkaunawa ng Israel
  choice: Tahasang sinasabi na hindi binigyan ni Yahweh ang Israel ng pusong makaunawa, mga matang makakita, at mga taingang makarinig hanggang sa araw na iyon.
  alternative: Unawain ang pahayag bilang pagpapahintulot lamang ng Diyos sa kakulangan ng Israel, o gawing pawang pagkukulang ng tao ang diwa.
  rationale: Malinaw na si Yahweh ang simuno ng נָתַן sa Hebreo. Hindi dapat palambutin ng salin ang pahayag, ngunit hindi rin nito dapat ipaliwanag lampas sa talata ang ugnayan ng pagkilos ng Diyos at pananagutan ng tao.
- issue: Ang ipinahihiwatig ng “hanggang sa araw na ito”
  choice: Pinananatili ang temporal na hangganan nang hindi tahasang sinasabing ibinigay na sa mismong araw na iyon ang kakayahang umunawa.
  alternative: Isalin sa paraang tiyak na nagsasabing nagbago na ang kalagayan sa araw na iyon.
  rationale: Maaaring magtakda ang עַד ng hangganan nang hindi awtomatikong nilulutas kung ano ang naganap sa puntong iyon; kaya pinananatili ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na larawang “puso,” “mga mata,” at “mga tainga,” ngunit ginamit ang natural na pandiwang “makaunawa” upang malinaw na maipahayag ang kontekstuwal na diwa ng ידע. Ang pangalang “Yahweh” ay hindi pinalitan ng titulo.
