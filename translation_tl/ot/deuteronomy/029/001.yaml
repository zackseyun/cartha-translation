base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: tl
  text: Tinawag ni Moises ang buong Israel at sinabi sa kanila, “Nakita ninyo ang lahat ng ginawa ni Yahweh sa harap mismo ng inyong mga mata sa lupain ng Ehipto—kay Faraon, sa lahat ng kanyang mga lingkod, at sa kanyang buong lupain.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “laban kay Faraon, laban sa lahat ng kanyang mga lingkod, at laban sa kanyang buong lupain.” Sa kontekstong ito, maaaring ipakita ng pang-ukol sa Hebreo na ang mga ginawa ni Yahweh sa Ehipto ay mga gawa ng paghatol laban sa kanila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Tinawag
  rationale: Sa kontekstong ito, ang קרא ay tumutukoy sa pagtawag o pagtitipon sa mga taong pakikinggan si Moises. Likas at tuwiran sa makabagong Tagalog ang “tinawag.”
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Kolektibong tawag ito sa bayang nakipagtipan. Mas natural sa Tagalog ang “buong Israel” kaysa sa literal na “lahat ng Israel.”
- source_word: רְאִיתֶם
  choice: Nakita ninyo
  rationale: Tumutukoy ito sa mga pangyayaring personal nilang nasaksihan at may patuloy na kabuluhan. Pinananatili ng “nakita ninyo” ang payak na pandiwa ng Hebreo nang hindi dinaragdagan ang kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: לְעֵינֵיכֶם
  choice: sa harap mismo ng inyong mga mata
  rationale: Pinananatili nito ang matingkad na idyomang Hebreo at idiniriin na hayagan at tuwirang nasaksihan ng mga kausap ang mga pangyayari.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Hayagang nasa Hebreo ang “lupain”; natural pa rin itong pakinggan sa Tagalog at nililinaw ang saklaw ng tagpuan.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: kay Faraon, sa lahat ng kanyang mga lingkod, at sa kanyang buong lupain
  rationale: Pinananatili ng “kay/sa” ang malawak na gamit ng inuulit na pang-ukol na ל at hindi agad ipinapasiya kung neutral na tumutukoy ito sa mga naapektuhan o mas tiyak na nangangahulugang “laban sa.” Inilalahad sa talababa ang kontekstuwal na alternatibo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang mismong ginamit sa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon na hindi nagpapalit sa pangalan ng isang titulo.
- issue: Kung ang mga ginawa ni Yahweh ay ilalarawang neutral na ginawa “kay” Faraon o tahasang ginawa “laban sa” kanya
  choice: kay Faraon, sa lahat ng kanyang mga lingkod, at sa kanyang buong lupain
  alternative: laban kay Faraon, laban sa lahat ng kanyang mga lingkod, at laban sa kanyang buong lupain
  rationale: Maaaring markahan ng ל ang mga taong at lupaing pinakitunguhan o naapektuhan ng ginawa ni Yahweh. Bagaman malinaw sa mas malawak na salaysay na mga hatol ang mga gawang ito, pinananatili ng pangunahing teksto ang saklaw ng pang-ukol at inilalagay sa talababa ang mas interpretatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang pangalang “Yahweh,” ang larawan ng “sa harap mismo ng inyong mga mata,” at ang ambiguwidad ng inuulit na pang-ukol sa huling bahagi. Ginamit ang gitling na pahaba upang natural na ipakilala ang mga tumanggap o pinuntirya ng ginawa ni Yahweh.
