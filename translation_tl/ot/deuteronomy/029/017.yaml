  text: פֶּן יֵ֣שׁ בָּ֠/כֶם אִ֣ישׁ אוֹ אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨/וֹ פֹנֶ֤ה הַ/יּוֹם֙ מֵ/עִם֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ לָ/לֶ֣כֶת לַ/עֲבֹ֔ד אֶת אֱלֹהֵ֖י הַ/גּוֹיִ֣ם הָ/הֵ֑ם פֶּן יֵ֣שׁ בָּ/כֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְ/לַעֲנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: tl
  text: Baka may lalaki o babae sa inyo, o may angkan o lipi, na ang puso ay tumatalikod ngayon kay Yahweh na ating Diyos upang humayo at maglingkod sa mga diyos ng mga bansang iyon. Baka may ugat sa gitna ninyo na namumunga ng lason at mapait na damo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “apdo at ajenjo.” Ang רֹאשׁ ay maaaring tumukoy sa apdo o, sa mas malawak na diwa, sa lason; ang לַעֲנָה ay ang napakapait na halamang karaniwang tinatawag na ajenjo o wormwood.
    reason: Ipinakikita ang mas tradisyonal at mas tiyak na mga katumbas habang pinananatiling malinaw ang pangunahing teksto.
lexical_decisions:
- source_word: פֶּן יֵשׁ בָּכֶם
  choice: Baka may ... sa inyo
  rationale: Likas na babala sa modernong Tagalog na nagpapanatili sa diwa ng posibleng panganib na ipinahihiwatig ng פֶּן.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: lalaki o babae
  rationale: Pinananatili ang tahasang pares na lalaki at babae sa Hebreo.
- source_word: מִשְׁפָּחָה
  choice: angkan
  rationale: Tumutukoy sa mas malawak na pangkat ng magkakamag-anak, hindi lamang sa isang sambahayan.
- source_word: שֵׁבֶט
  choice: lipi
  rationale: Ang tinutukoy ay isang tribong yunit sa Israel; natural at marangal sa Tagalog ang “lipi” sa kontekstong ito.
- source_word: לְבָבוֹ פֹנֶה
  choice: na ang puso ay tumatalikod
  rationale: Pinananatili ang larawan ng puso at ang nagpapatuloy o nagsisimulang paglayo na ipinahihiwatig ng participle.
- source_word: מֵעִם יְהוָה אֱלֹהֵינוּ
  choice: kay Yahweh na ating Diyos
  rationale: Kasama na sa “tumatalikod” ang diwa ng paglayo; ang “kay” ay natural na pananda sa Tagalog para sa personal na pinagmumulan ng pagtalikod.
- source_word: לָלֶכֶת לַעֲבֹד
  choice: upang humayo at maglingkod
  rationale: Pinananatili kapwa ang kilos ng pag-alis at ang layuning maglingkod nang hindi ginagawang sobrang literal ang parirala.
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: mga diyos ng mga bansang iyon
  rationale: Tuwirang ipinapahayag ang mga diyos na sinasamba ng mga bansang tinutukoy.
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: ugat ... na namumunga ng lason at mapait na damo
  rationale: Pinananatili ang metapora ng ugat at pamumunga. Isinasalin ang רֹאשׁ ayon sa malawak na diwa nitong lason at ang לַעֲנָה bilang mapait na damo upang maging malinaw sa karaniwang mambabasa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan ng Diyos sa tipan.
- issue: Saklaw ng babala laban sa pagtalikod
  choice: lalaki o babae ... angkan o lipi
  alternative: sinuman o anumang pangkat
  rationale: Hindi pinaiikli sa pangkalahatang pananalita ang tahasang saklaw ng tekstong Hebreo mula sa indibidwal hanggang sa buong pangkat.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang paulit-ulit na “Baka may” upang mapanatili ang dalawang babalang פֶּן, at iniwasan ang sobrang makaluma o teknikal na bokabularyo sa pangunahing teksto.
