  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֗ם אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/008.yaml
  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: tl
  text: Kaya tuparin ninyo ang mga salita ng tipang ito at gawin ang mga iyon, upang kumilos kayo nang may karunungan sa lahat ng inyong ginagawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang magtagumpay kayo sa lahat ng inyong ginagawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: tuparin ninyo
  rationale: Sa konteksto ng tipan, ang שׁמר ay nangangahulugang masusing pagsunod sa mga obligasyon. Ang “tuparin” ay likas sa modernong Filipino at malinaw na higit sa pisikal na pagbabantay.
- source_word: דִּבְרֵי הַ/בְּרִית הַ/זֹּאת
  choice: ang mga salita ng tipang ito
  rationale: Pinananatili ng “mga salita” ang kongkretong anyo at pangmaramihang bilang ng דִּבְרֵי, samantalang ang “tipan” ang karaniwang katumbas ng בְּרִית.
- source_word: וַ/עֲשִׂיתֶם אֹתָם
  choice: at gawin ang mga iyon
  rationale: Tumutukoy ang pangmaramihang אֹתָם sa “mga salita.” Bahagyang pormal ang parirala ngunit malinaw at pinananatili ang pag-uulit ng utos na nasa Hebreo.
- source_word: לְמַעַן
  choice: upang
  rationale: Likas at marangal na panandang Filipino para sa layunin o kinalabasan.
- source_word: תַּשְׂכִּילוּ
  choice: kumilos kayo nang may karunungan
  rationale: Ang Hiphil ng שׂכל ay maaaring tumukoy sa matalinong pagkilos at, kaugnay nito, sa pagtatagumpay. Inuuna ng salin ang tahasang diwa ng matalinong pagkilos nang hindi lubusang inaalis ang posibilidad ng mabuting kinalabasan.
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: sa lahat ng inyong ginagawa
  rationale: Natural na Filipino na nagpapahayag sa saklaw ng bawat gawain, at pinananatili ang malawak na puwersa ng כָּל אֲשֶׁר.
- source_word: וְ
  choice: Kaya
  rationale: Sa konteksto, ang pang-ugnay ay may lohikal o inferensiyal na ugnayan sa naunang pahayag; malinaw itong naipahihiwatig ng “Kaya.”
theological_decisions:
- issue: Ang ugnayan ng karunungan at tagumpay sa תַּשְׂכִּילוּ
  choice: kumilos kayo nang may karunungan
  alternative: magtagumpay kayo / umunlad kayo
  rationale: Saklaw ng pandiwa ang matalinong pagkilos at maaari ring ipahiwatig ang matagumpay na bunga nito. Pinananatili ng pangunahing salin ang karunungang nakaugat sa pagkilos; inilalagay sa talababa ang tagumpay bilang tunay na alternatibong leksikal, upang hindi gawing tahasang pangako ng materyal na pag-unlad ang talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “tipan” bilang pamilyar na terminong biblikal. Inilagay ang talababa matapos ang buong sugnay dahil ang alternatibo ay tumutukoy sa kahulugan ng תַּשְׂכִּילוּ sa kaugnayan nito sa lahat ng ginagawa.
