translation:
  language: tl
  text: ang matitinding pagsubok[a] na nakita mismo ng inyong mga mata, yaong mga dakilang tanda at kababalaghan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga dakilang pagsubok.” Hindi ito nangangahulugang mga pang-uudyok na magkasala, kundi mga pagsubok o pagpapatunay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסּוֹת הַגְּדֹלֹת
  choice: ang matitinding pagsubok
  rationale: Ang מַסּוֹת ay tumutukoy sa mga pangyayaring sumusubok o nagpapatunay, hindi sa pang-uudyok na magkasala. Likas sa makabagong Tagalog ang “matitinding pagsubok” at ipinahahayag nito ang bigat ng גְּדֹלֹת.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: na nakita mismo ng inyong mga mata
  rationale: Pinananatili ang tahasang Hebreong idyomang “nakita ng inyong mga mata” at idinaragdag ang “mismo” upang natural na maipahayag ang diin sa personal na pagsaksi.
- source_word: הָאֹתֹת
  choice: ang mga tanda
  rationale: Karaniwang kahulugan ng אוֹת sa ganitong konteksto ang “tanda,” na tumutukoy sa makabuluhang pagkilos ng Diyos.
- source_word: וְהַמֹּפְתִים הַגְּדֹלִים הָהֵם
  choice: at ang malalaking kababalaghang iyon
  rationale: Ang “kababalaghan” ay natural na katumbas ng מוֹפֵת bilang pambihirang gawang pumupukaw ng pagkamangha; pinananatili ng “malalaki” at “iyon” ang pang-uri at mariing demonstratibo ng Hebreo.
theological_decisions:
- issue: Kahulugan ng מַסּוֹת
  choice: pagsubok
  alternative: mga panunukso
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa pagsubok o pagpapatunay sa pamamagitan ng mga pangyayari, hindi sa pag-akit na gumawa ng kasalanan.
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang “inyong” dahil ang kausap ay ang Israel bilang isang sambayanan, habang pinanatili ang konkretong idyoma tungkol sa kanilang mga mata.
