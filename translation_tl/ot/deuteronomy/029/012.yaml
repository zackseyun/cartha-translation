  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לְמַ֣עַן הָקִֽים אֹתְ/ךָ֩ הַ/יּ֨וֹם ל֜/וֹ לְ/עָ֗ם וְ/ה֤וּא יִֽהְיֶה לְּ/ךָ֙ לֵֽ/אלֹהִ֔ים כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/כַ/אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: tl
  text: upang itatag ka niya ngayon bilang isang bayan para sa kanyang sarili[a], at siya mismo ay maging Diyos mo, gaya ng sinabi niya sa iyo at gaya ng isinumpa niya sa iyong mga ninuno—kina Abraham, Isaac, at Jacob.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bilang kanyang bayan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “iyong mga ama”; ang tinutukoy ay ang mga patriyarkang sina Abraham, Isaac, at Jacob.
    reason: cultural_note
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o nilalayong bunga.
- source_word: הָקִים אֹתְךָ הַיּוֹם
  choice: itatag ka niya ngayon
  rationale: Pinananatili ang Hiphil na diwang 'gawing matatag/itatag' at ang kasalukuyang sandali ng tipan; ang isahang 'ka' ay sumasalamin sa kolektibong pagtukoy sa Israel.
- source_word: לוֹ לְעָם
  choice: bilang isang bayan para sa kanyang sarili
  rationale: Malapit sa ayos at diwa ng Hebreo, at malinaw na ipinahahayag ang pag-aari at ugnayang nakabatay sa tipan.
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: at siya mismo ang maging Diyos mo
  rationale: Ipinakikita ng 'siya mismo' ang diin ng וְהוּא, samantalang natural sa Filipino ang 'maging Diyos mo' para sa pormula ng tipan.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: gaya ng sinabi niya sa iyo
  rationale: Pinananatili ang karaniwang kahulugan ng דבר at hindi ito pinapalitan ng 'ipinangako,' yamang hiwalay na binabanggit ang panunumpa.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: at gaya ng isinumpa niya
  rationale: Tuwirang inilalahad ang panunumpa; nauunawaan mula sa kasunod na parirala na ito ay panunumpa sa mga ninuno.
- source_word: לַאֲבֹתֶיךָ
  choice: sa iyong mga ninuno
  rationale: Natural at dignified sa modernong Filipino; nililinaw ng kasunod na mga pangalan na ang tinutukoy ay ang mga patriyarka.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kina Abraham, Isaac, at Jacob
  rationale: Ang 'kina' ang likas na panandang Filipino para sa maramihang pangalang pantangi at sapat na kumakatawan sa inuulit na Hebreong pang-ukol.
theological_decisions:
- issue: Pormula ng tipan
  choice: isang bayan para sa kanyang sarili ... maging Diyos mo
  alternative: kanyang bayan ... maging Diyos sa iyo
  rationale: Pinananatili ang magkabilang panig ng ugnayang tipan at ang pormal na nuance ng לְעָם לוֹ nang hindi ito ginagawang denominasyonal na pahayag.
- issue: Kahulugan ng דִּבֶּר kumpara sa נִשְׁבַּע
  choice: sinabi ... isinumpa
  alternative: ipinangako ... nanumpa
  rationale: Hindi pinag-iisa ang dalawang magkaibang pandiwa; nananatili ang tensiyon sa pagitan ng sinabi sa Israel at ng isinumpa sa mga ninuno.
- issue: Paglalarawan sa לַאֲבֹתֶיךָ
  choice: mga ninuno, na tinutukoy bilang Abraham, Isaac, at Jacob
  alternative: mga ama
  rationale: Mas natural sa Filipino ang 'mga ninuno,' habang ang tahasang pagbanggit sa tatlong lalaki ay nagpapanatili sa patriyarkal na reperensiya.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang isahang 'ka/mo/iyo' upang mapanatili ang kolektibong isahang pakikipag-usap sa Israel sa Hebreo. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
