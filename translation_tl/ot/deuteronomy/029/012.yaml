  source_fidelity: Tumpak na naihahatid ng salin ang layuning ipinakikilala ng לְמַעַן, ang pagtatatag sa Israel ngayon bilang bayan para sa Diyos, ang pormula ng tipan, at ang pagkakaiba ng 'sinabi' at 'isinumpa.' Ang 'mga ninuno' ay katanggap-tanggap sa pangunahing teksto dahil malinaw na tinutukoy ng kasunod na mga pangalan ang mga patriyarka, at itinatala ng talababa ang literal na 'mga ama.'
  naturalness: May maliit ngunit mahalagang suliranin sa ayos na “siya mismo ang maging Diyos mo.” Mas likas at malinaw sa modernong Filipino ang “siya mismo ay maging Diyos mo,” habang pinananatili ang layuning diwa ng pangungusap.
  terminology: Ang “itatag,” “bayan,” “Diyos,” at mga pangalang Abraham, Isaac, at Jacob ay angkop sa marangal ngunit makabagong rehistro. Ang “isinumpa” ay katanggap-tanggap na pandiwa para sa panunumpa sa kontekstong ito; hindi ito dapat palitan ng “ipinangako,” upang mapanatili ang kaibhan sa naunang “sinabi.”
