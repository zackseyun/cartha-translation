base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: tl
  text: Nang dumating kayo sa lugar na ito,[a] lumabas sina Sihon na hari ng Hesbon at Og na hari ng Basan upang salubungin tayo sa labanan, at tinalo natin sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At dumating kayo sa lugar na ito.” Maaaring ipahayag ang anyong pasalaysay sa Hebreo bilang payak na pagkakasunod o bilang sugnay na panahunan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hinampas natin sila.” Ang pandiwang Hebreo ay madalas gamitin sa konteksto ng paggapi sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: Nang dumating kayo
  rationale: Ang Qal wayyiqtol na ikalawang panauhang maramihan ng בוא ay nagsasalaysay ng nakaraang pangyayari. Ang “Nang” ay natural na nag-uugnay nito sa kasunod na kilos, habang kinikilala sa talababa ang posibilidad ng payak na koordinasyon.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: sa lugar na ito
  rationale: Ang מָקוֹם ay “lugar,” at natural sa Filipino ang “dumating sa lugar na ito.”
- source_word: וַיֵּצֵא ... לִקְרָאתֵנוּ לַמִּלְחָמָה
  choice: sinalubong tayo sa pakikipagdigma
  rationale: Pinagsasama ng likas na pariralang Filipino ang literal na paglabas upang sumalubong at ang malinaw na layuning makipagdigma, nang hindi dinaragdagan ang antas ng interpretasyon.
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Sihon na hari ng Hesbon
  rationale: Isinalin nang tuwiran ang pangalan at titulong maharlika; ginamit ang karaniwang anyong Filipino ng Hesbon.
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: at Og na hari ng Basan
  rationale: Kahanay ng naunang parirala; ginamit ang karaniwang anyong Filipino ng Basan.
- source_word: וַנַּכֵּם
  choice: at tinalo natin sila
  rationale: Ang Hiphil ng נכה sa kontekstong pandigma ay maaaring mangahulugang hampasin o gapiin. Ang “tinalo” ay malinaw at natural, habang inilalagay sa talababa ang mas kongkretong “hinampas.”
