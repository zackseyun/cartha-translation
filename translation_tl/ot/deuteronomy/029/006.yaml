  naturalness: Mas natural at malinaw sa makabagong Filipino ang “lumabas ... upang salubungin tayo sa labanan” kaysa “sinalubong tayo sa pakikipagdigma nina ...”.
  terminology: Ang “hari” at mga anyong Hesbon at Basan ay angkop. Pinananatili ang “tinalo natin sila” bilang natural na kontekstuwal na salin ng pandiwang pandigma, habang itinatala sa talababa ang literal na diwa ng paghampas/pananakit.
