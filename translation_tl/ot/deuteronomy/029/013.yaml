  text: וְ/לֹ֥א אִתְּ/כֶ֖ם לְ/בַדְּ/כֶ֑ם אָנֹכִ֗י כֹּרֵת֙ אֶת הַ/בְּרִ֣ית הַ/זֹּ֔את וְ/אֶת הָ/אָלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/013.yaml
  text: And it is not with you alone that I am making this covenant and this oath[b][a],
translation:
  language: tl
  text: At hindi lamang sa inyo ko ginagawa ang tipang ito[a] at ang sumpang ito[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pinuputol ang tipang ito,” isang idyoma na nangangahulugang paggawa o pagtatatag ng tipan.
    reason: lexical_alternative
  - marker: b
    text: O “ang sinumpaang panatang ito.” Ang salitang Hebreo ay maaaring tumukoy sa panata mismo o sa sumpang kaparusahan na nakaugnay dito.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא
  choice: At hindi
  rationale: Pinananatili ang pang-ugnay at pagtanggi na nag-uugnay sa talata sa naunang konteksto.
- source_word: אִתְּכֶם לְבַדְּכֶם
  choice: lamang sa inyo
  rationale: 'Likas sa modernong Tagalog at malinaw na ipinahahayag ang pagiging eksklusibo: hindi limitado sa kasalukuyang mga kausap ang pakikipagtipan.'
- source_word: אָנֹכִי
  choice: ko
  rationale: Ang unang panauhang gumaganap ay natural na ipinahahayag sa hulaping panghalip sa Tagalog; sapat itong malinaw sa ayos na “ko ginagawa.”
- source_word: כֹּרֵת
  choice: ginagawa
  rationale: Ang literal na Hebreong idyoma ay “pumuputol ng tipan,” ngunit “ginagawa ang tipan” ang natural at malinaw na katumbas sa Tagalog. Ang anyong nagaganap ay tumutugma sa participle sa konteksto.
- source_word: הַבְּרִית הַזֹּאת
  choice: ang tipang ito
  rationale: Ang “tipan” ay karaniwan, marangal, at angkop sa legal at teolohikal na bigat ng בְּרִית.
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: at ang sumpang ito
  rationale: Maaaring tumukoy ang אָלָה sa sinumpaang panata o sa sumpang kaparusahang kalakip nito. Sa Tagalog, pinananatili ng “sumpa” ang mabigat na sankisyong nakapaloob sa salita, habang inilalahad sa talababa ang alternatibong “panata.”
theological_decisions:
- issue: Pagpapakahulugan sa אָלָה sa konteksto ng tipan
  choice: sumpa
  alternative: sinumpaang panata
  rationale: Magkasamang inilalahad ng talata ang tipan at ang אָלָה na nagpapatibay rito. Ang “sumpa” ay nagpapanatili sa aspektong kaparusahan o sariling pagsumpa na kaakibat ng panata; gayunman, hindi inaalis ang posibleng kahulugang “panata,” kaya nakatala iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tipan” bilang pamilyar na terminong biblikal at legal. Ang “lamang sa inyo” ay mas natural kaysa sa literal na ayos na “kasama ninyo lamang.”
