base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: tl
  text: Hindi kayo kumain ng tinapay, at hindi kayo uminom ng alak o matapang na inumin[a], upang malaman ninyo na ako si Yahweh, ang inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “inuming nakalalasing.” Malawak ang saklaw ng salitang Hebreo: tumutukoy ito sa mga inuming fermentado at nakalalasing, hindi sa iisang tiyak na uri lamang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: tinapay
  rationale: Ito ang pangunahing kahulugan ng salitang Hebreo at pinananatili nito ang kongkretong pagkakasunod sa alak at matapang na inumin; hindi kailangang palawakin bilang “pagkain.”
- source_word: אֲכַלְתֶּם
  choice: hindi kayo kumain
  rationale: Ang Hebreong perfect ay nagbubuod sa naging karanasan ng Israel; natural sa makabagong Tagalog ang payak na anyong nagdaan.
- source_word: יַיִן
  choice: alak
  rationale: Karaniwan at malinaw na katumbas sa Tagalog ng alak na mula sa ubas sa kontekstong biblikal.
- source_word: שֵׁכָר
  choice: matapang na inumin
  rationale: Malawak na tumutukoy sa fermentado at nakalalasing na inumin bukod sa alak; iniiwasan ang sobrang makitid na “serbesa.”
- source_word: שְׁתִיתֶם
  choice: hindi kayo uminom
  rationale: Ang payak na anyong nagdaan ay natural sa retrospektibong pahayag at tumutugma sa naunang pandiwa.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw at marangal na ipinahahayag ang layunin o nilalayong bunga nang hindi pinipili nang labis sa dalawang posibilidad.
- source_word: תֵּדְעוּ
  choice: malaman ninyo
  rationale: Kasunod ng “upang,” likas nitong ipinahahayag ang nilalayong pagkilala o pagkaalam.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalang banal, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tuwirang pinananatili ang ikalawang panauhang maramihang pag-aari at ang ugnayang tipan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Lakas ng לְמַעַן sa sugnay
  choice: upang malaman ninyo
  alternative: kaya nalaman ninyo
  rationale: Ang anyo ay karaniwang nagpapahayag ng layunin o nilalayong bunga. Pinananatili ng “upang” ang puwang sa pagitan ng layunin at bunga nang hindi ginagawang tiyak na simpleng resulta lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kayo/ninyo/inyong” upang mapanatili ang maramihang kausap, at pinanatiling maikli ang paralelismong “hindi kayo kumain … hindi kayo uminom.”
