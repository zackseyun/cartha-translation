translation:
  language: tl
  text: Sapagkat alam ninyo kung paano tayo nanirahan sa lupain ng Ehipto at kung paano tayo dumaan sa gitna ng mga bansang dinaanan ninyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag at natural itong causal connective sa makabagong Tagalog.
- source_word: יְדַעְתֶּם
  choice: alam ninyo
  rationale: Ang perfect ay tumutukoy sa kasalukuyang kaalamang nakabatay sa nakaraang karanasan; natural sa Tagalog ang pangkasalukuyang anyo.
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: kung paano tayo namuhay
  rationale: Ipinahahayag nang natural ang kalagayan o paraan ng paninirahan na nalalaman ng mga tagapakinig, sa halip na piliting literal ang object marker at relative clause.
- source_word: יָשַׁבְנוּ
  choice: namuhay
  rationale: Saklaw nito ang diwang nanirahan o nabuhay sa isang lugar at angkop sa tinutukoy na karanasan sa Ehipto.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang pariralang Hebreo na 'lupain ng Ehipto' sa dignidad ng salaysay.
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: at kung paano tayo dumaan
  rationale: Pinananatili ang diwa ng pagdaan at iniuugnay ito sa karanasang nalalaman ng mga kausap, nang hindi ipinapalagay na paghihirap ang tinutukoy.
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Malapit ito sa literal na 'sa gitna ng' at natural kasabay ng pandiwang tumutukoy sa paglalakbay.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga bansa o mga bayan; iniiwasan ng 'mga bansa' ang pag-angkat ng mas huling teknikal na gamit ng 'mga Hentil.'
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: na dinaanan ninyo
  rationale: Malinaw at natural na minamarkahan ang mga bansang dinaanan mismo ng mga tagapakinig, habang pinananatili ang pag-uulit ng ugat na עבר sa diwa.
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang inklusibong ''tayo'' para sa unang panauhang maramihan at ang magalang na maramihang ''ninyo'' para sa kausap. Hindi kailangan ang talababa: ang dalawang magkatulad na אֵת אֲשֶׁר ay maipahahayag nang natural bilang ''kung paano,'' at walang mahalagang tekstuwal o teolohikal na alternatibong kailangang itala rito.'
