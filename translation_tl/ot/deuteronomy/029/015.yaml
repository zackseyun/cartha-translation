    issue: Ang "namuhay" para sa יָשַׁבְנוּ ay bahagyang mas malawak kaysa sa kahulugang manirahan/manahan.
    rationale: Ang ugat na ישב ay pangunahing tumutukoy sa paninirahan o pagtira. Ang "nanirahan" ay mas eksakto at likas pa rin sa modernong Filipino.
  revised_text: Sapagkat alam ninyo kung paano tayo nanirahan sa lupain ng Ehipto at kung paano tayo dumaan sa gitna ng mga bansang dinaanan ninyo.
