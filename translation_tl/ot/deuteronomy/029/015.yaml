  to: Sapagkat alam ninyo kung paano tayo nanirahan sa lupain ng Ehipto at kung paano tayo dumaan sa gitna ng mga bansang dinaanan ninyo.
  rationale: Pinalitan lamang ang "namuhay" ng "nanirahan" upang mas malinaw na maihatid ang pandiwang Hebreo para sa paninirahan. Pinanatili ang estruktura ng dalawang "kung paano" upang katawanin ang magkakatulad na konstruksiyong Hebreo at ang marahang ambigwidad nito.
