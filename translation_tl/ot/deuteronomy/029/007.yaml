translation:
  language: tl
  text: At kinuha natin ang kanilang lupain at ibinigay iyon bilang mana sa mga Rubenita, sa mga Gadita, at sa kalahati ng lipi ni Manases.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: At kinuha natin
  rationale: Ang Qal wayyiqtol na unang panauhang maramihan ng לקח ay tuwirang nangangahulugang “kinuha natin.” Hindi kailangang palakasin ito bilang “sinakop” bagaman militar ang konteksto.
- source_word: אַרְצָם
  choice: ang kanilang lupain
  rationale: Tumutukoy ang אֶרֶץ na may hulaping ikatlong panauhang panlalaking maramihan sa teritoryo ng mga haring natalo; natural at malinaw sa Filipino ang “lupain.”
- source_word: וַנִּתְּנָהּ
  choice: at ibinigay iyon
  rationale: Ang נתן ay karaniwang “magbigay,” at ang hulapi ay tumutukoy pabalik sa lupain. Pinananatili ng “ibinigay iyon” ang payak na diwa nang hindi dinaragdagan ng administratibong kahulugang gaya ng “itinalaga.”
- source_word: לְנַחֲלָה
  choice: bilang mana
  rationale: Ang נַחֲלָה ay minanang pag-aari o bahaging inilaan, lalo na sa pamamahagi ng lupain. Likas sa Filipino ang “bilang mana” at pinananatili nito ang mahalagang diwa ng lupang minana.
- source_word: לָראוּבֵנִי
  choice: sa mga Rubenita
  rationale: Ang anyong gentilic na isahan ay kolektibong tumutukoy sa pangkat ng lipi; ang maramihang “mga Rubenita” ang natural na katumbas sa Filipino.
- source_word: וְלַגָּדִי
  choice: sa mga Gadita
  rationale: Gaya ng Rubenita, ang gentilic na isahan ay may kolektibong diwa, kaya natural ang “mga Gadita.”
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: at sa kalahati ng lipi ng mga Manasita
  rationale: Tuwirang ipinapahayag ng חֲצִי שֵׁבֶט ang “kalahati ng lipi,” at ang gentilic na הַמְנַשִּׁי ay kolektibong isinalin bilang “mga Manasita.”
