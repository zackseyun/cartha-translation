revisions:
- from: At kinuha natin ang kanilang lupain at ibinigay iyon bilang mana sa mga Rubenita, sa mga Gadita, at sa kalahati ng lipi ng mga Manasita.[a]
  to: At kinuha natin ang kanilang lupain at ibinigay iyon bilang mana sa mga Rubenita, sa mga Gadita, at sa kalahati ng lipi ni Manases.
  rationale: Pinalitan ang hindi karaniwang "kalahati ng lipi ng mga Manasita" ng idiomatikong "kalahati ng lipi ni Manases." Pinananatili nito ang saklaw at kolektibong kahulugan ng Hebreong חֲצִי שֵׁבֶט הַמְנַשִּׁי, habang ginagamit ang karaniwang Filipino na anyo ng pangalan. Inalis ang talababa sapagkat ang rebisyong pangalan ay hindi na nangangailangan ng leksikal na alternatibo upang maging malinaw.
