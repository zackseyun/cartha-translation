translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “natin” sapagkat kinakausap ni Moises ang Israel at inilalahok niya ang mga tagapakinig sa kolektibong “tayo.” Pinanatili ang mga pangalang gentilic bilang Rubenita, Gadita, at Manasita, ngunit ginawang maramihan upang maging likas sa Filipino.
