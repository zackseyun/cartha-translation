  source_fidelity: Kailangang iwasto ang saklaw ng relative clause. Ang “ang tipang ginagawa” sa draft ay tahasang ginagawang ang “tipan” lamang ang tinutukoy ng אֲשֶׁר, samantalang ang Hebreo ay maaaring tumukoy sa pormulang tipan at panunumpa bilang magkakaugnay na kabuuan. Ang binagong “na ginagawa” ay pinananatili ang ambiguwidad na ito. Napananatili ang layuning “upang,” ang pangalan na Yahweh, at ang diwang covenantal ng pagpasok sa tipan.
  naturalness: Ang “upang pumasok ka sa tipan” at “panunumpa” ay malinaw at likas sa modernong Filipino sa marangal na rehistro. Ang “kasama mo” ay mas tuwirang katumbas ng עִמְּךָ kaysa “sa iyo” at maayos sa kontekstong ito.
  terminology: Ang “tipan,” “Yahweh,” at “panunumpa” ay angkop. Iningatan ng talababa ang mahalagang saklaw ng אָלָה na maaaring magsama ng sumpa o mga kaparusahang pangtipan. Inayos ang talababa sa כרת upang hindi magmukhang ang literal na Hebreo ay simpleng “pinuputol sa iyo,” kundi maipaliwanag ang idyomang “pagputol ng tipan.”
