base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: tl
  text: upang pumasok ka sa tipan ni Yahweh na iyong Diyos at sa kanyang panunumpa[a], na ginagawa ni Yahweh na iyong Diyos kasama mo ngayon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panunumpang may kalakip na sumpa.” Ang salitang Hebreo ay maaaring tumukoy sa panunumpang naglalaman ng mga kaparusahan o sumpa ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pumuputol [ng tipan] kasama mo ngayon.” Ang “pagputol ng tipan” ay isang Hebreong idyoma para sa paggawa ng tipan.
    reason: cultural_note
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: upang pumasok ka
  rationale: Ang לְ na may infinitive ay nagsasaad ng layunin o resulta. Sa konteksto ng tipan, ang עבר ay hindi literal na pagdaan kundi pagpasok sa mga pananagutan ng tipan.
- source_word: בִּבְרִית
  choice: sa tipan
  rationale: Ang בְּרִית ay karaniwang tumutukoy sa tipan; likas sa Filipino ang pariralang “pumasok sa tipan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang ipinapahayag ng hulaping pangalawang panauhang panlalaki at isahan ang pag-aari o kaugnayang “iyong Diyos.”
- source_word: וּבְאָלָתוֹ
  choice: at sa kanyang panunumpa
  rationale: Maaaring mangahulugan ang אָלָה ng panunumpa na may kalakip na mga parusa o sumpa. Ang “panunumpa” ang malinaw na pangunahing salin, habang inilalahad sa talababa ang mahalagang diwa ng sumpa.
- source_word: אֲשֶׁר
  choice: ang tipang
  rationale: Ipinakikita sa natural na Filipino na ang kasunod na pandiwang כרת ay karaniwang ginagamit para sa paggawa ng tipan. Hindi nito itinatanggi na saklaw ng buong pormula ang kalakip na panunumpa.
- source_word: כֹּרֵת
  choice: ginagawa
  rationale: Ang literal na “pumuputol” ay isang Hebreong idyoma para sa paggawa o pagtatatag ng tipan. Ang “ginagawa” ang malinaw at likas na katumbas sa modernong Filipino.
- source_word: עִמְּךָ
  choice: sa iyo
  rationale: Sa Filipino, likas sabihin na “gumagawa ng tipan sa iyo,” bagaman maaari ring sabihing “kasama mo.”
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na modernong katumbas ito ng “sa araw na ito” sa agarang seremonyal na konteksto.
theological_decisions:
- issue: Paglalahad sa pormula ng tipan ng pangalang YHWH
  choice: Yahweh na iyong Diyos
  alternative: PANGINOON na iyong Diyos
  rationale: Tuwirang ginagamit sa Hebreo ang personal na pangalan na יהוה; pinananatili ng “Yahweh” ang pangalang pangtipan sa halip na palitan ito ng titulo.
- issue: Kung tahasang gagamit ng salitang “sumpa” para sa אָלָה sa pangunahing teksto
  choice: panunumpa
  alternative: sumpa; panunumpang may kalakip na sumpa
  rationale: Saklaw ng salita ang sinumpaang pangako at ang mga kaparusahang kaakibat nito. Pinananatili ng “panunumpa” ang mas malawak na kahulugan, at inilalagay sa talababa ang tunay na diwa ng sumpa upang hindi lutasin nang sapilitan ang ambiguwidad.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “tipan” at “panunumpa” bilang pamilyar na bokabularyong biblikal, at iniwasan ang literal ngunit malabong “pumuputol ng tipan.” Ang em dash ay tumutulong na linawin ang kaugnayan ng relative clause sa tipan nang hindi inaalis ang kaugnayan ng panunumpa sa buong pormula.
