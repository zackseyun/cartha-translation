reference: Deuteronomy 29:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: tl
  text: At ibubukod siya ni Yahweh mula sa lahat ng lipi ng Israel upang dumanas ng kapahamakan, ayon sa lahat ng sumpa ng tipan[a] na nakasulat sa aklat na ito ng Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sumpang pinagtibay sa panunumpa sa tipan.” Ang salitang Hebreo ay maaaring tumukoy lalo na sa mga sumpa ng tipan na ipinapataw sa bisa ng isang panunumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: At ibubukod siya
  rationale: Ang Hiphil ng בדל na may hulaping 3ms ay nagpapahayag ng paghiwalay o pagbukod sa isang tao. Ang “ibubukod siya” ay natural sa Filipino at pinananatili ang diwang itinatangi siya mula sa buong Israel para sa hatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: לְרָעָה
  choice: upang dumanas ng kapahamakan
  rationale: Sa konteksto, ang רָעָה ay tumutukoy sa mapaminsalang bunga ng hatol, hindi sa kasamaan sa moral na diwa. Nililinaw ng parirala ang layon ng pagbukod nang hindi ipinahihiwatig na ibinubukod siya para gumawa ng kasamaan.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: mula sa lahat ng lipi ng Israel
  rationale: Ipinapakita ng מִן ang paghihiwalay sa tao mula sa mas malaking sambayanan ng tipan. Ang “mula sa lahat ng lipi” ay malinaw at malapit sa ayos ng Hebreo.
- source_word: כְּכֹל
  choice: ayon sa lahat
  rationale: Ipinahahayag ng כְּ ang pagtutugma ng hatol sa mga nakasulat na parusa ng tipan; ang “ayon sa lahat” ay pormal ngunit natural.
- source_word: אָלות הַבְּרִית
  choice: mga sumpa ng tipan
  rationale: Ang אָלָה sa konteksto ng tipan ay tumutukoy sa mga sumpang kaugnay ng sinumpaang pananagutan. “Mga sumpa ng tipan” ang pinakamalinaw na salin sa pangunahing teksto, habang inilalahad sa talababa ang natatanging diwa ng sumpang pinagtibay sa panunumpa.
- source_word: הַכְּתוּבָה
  choice: na nakasulat
  rationale: Ang pambabaeng participle ay umaayon sa אָלָה bilang kolektibong ideya; sa Filipino, malinaw na iniuugnay ng “na nakasulat” ang mga sumpa sa aklat.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: sa aklat na ito ng Kautusan
  rationale: Ang סֵפֶר ay maaaring aklat o balumbon, ngunit “aklat” ang karaniwan at madaling maunawaan. Ginamit ang “Kautusan” bilang pangalan ng nasabing kalipunan ng tagubilin ng tipan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa teksto ang mismong pangalang tipan na YHWH. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nagdaragdag ng paliwanag sa teksto.
- issue: Kalikasan ng hatol sa לְרָעָה
  choice: upang dumanas ng kapahamakan
  alternative: para sa kasamaan; para sa pinsala; para sa sakuna
  rationale: Ang tinutukoy ay kapahamakang dulot ng mga parusa ng tipan, hindi moral na kasamaan. Pinananatili ng salin ang maparusang lakas ng pahayag.
- issue: Diwa ng אָלוֹת sa tipan
  choice: mga sumpa ng tipan, na may talababa tungkol sa panunumpa
  alternative: mga sumpang pinagtibay sa panunumpa
  rationale: Ang payak na “mga sumpa” ay madaling maunawaan, ngunit mahalagang huwag mawala ang maaaring teknikal na diwa ng mga sumpang ipinapataw sa ilalim ng sinumpaang tipan; kaya pinanatili iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ibubukod” para sa konkretong paghihiwalay sa sambayanan, “kapahamakan” para sa maparusang רָעָה, at “Kautusan” bilang kinikilalang tawag sa kalipunan. Inilagay ang pananda ng talababa [a] kaagad pagkatapos ng “tipan,” ang bahaging nililinaw nito.
