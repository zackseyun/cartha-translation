  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: tl
  text: At humayo sila at naglingkod sa ibang mga diyos at yumukod sa mga iyon—mga diyos na hindi nila nakilala at hindi niya inilaan para sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at hindi inilaan para sa kanila.” Pang-isahan at hindi tahasang binanggit ang simuno sa Hebreo; malamang na ang tinutukoy ay ang Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: humayo sila
  rationale: Pinananatili ang literal na kilos at ang sunod-sunod na mga pandiwa sa Hebreo nang hindi ipinapalagay na ang kahulugan ay 'sumunod' lamang.
- source_word: וַיַּעַבְדוּ
  choice: naglingkod
  rationale: Ibinubukod ang paglilingkod sa kasunod na tahasang kilos ng pagyukod o pagsamba.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Ito ang payak at likas na katumbas ng parirala at hindi dinaragdagan ng di-tahasang ideya ng pagiging banyaga.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: yumukod sa mga iyon
  rationale: Pinananatili ang pisikal na larawan ng pagpapatirapa o pagyukod, sa halip na ipantay agad sa mas malawak na salitang 'sumamba.'
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: mga diyos na hindi nila nakilala
  rationale: Ang 'nakilala' ay maaaring magpahiwatig ng personal o ugnayang pagkakilala, hindi lamang kaalamang intelektuwal.
- source_word: וְלֹא חָלַק לָהֶם
  choice: at hindi niya itinalaga para sa kanila
  rationale: Ang חָלַק ay nangangahulugang magbahagi, maglaan, o magtalaga. Ang 'itinalaga para sa kanila' ay natural sa Filipino at pinananatili ang diwang may naglaan o nagtakda.
theological_decisions:
- issue: Di-tahasang simuno ng pang-isahang pandiwang חָלַק
  choice: Ginamit ang 'hindi niya itinalaga,' na ang malamang na tinutukoy ng 'niya' ay ang Diyos.
  alternative: 'Maaaring unawain nang halos balintiyak: ''na hindi itinalaga para sa kanila.'''
  rationale: Walang tahasang simuno ang 3ms na pandiwa sa Hebreo. Malamang na ang Diyos ang di-tahasang gumagawa, ngunit pinananatili sa talababa ang tunay na posibilidad ng balintiyak na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'humayo' upang mapanatili ang Hebreong pagkakasunod ng mga kilos, at 'mga iyon' upang malinaw na tumukoy sa ibang mga diyos nang hindi nagpapahiwatig ng paggalang.
