  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: tl
  text: Hindi loloobin ni Yahweh na patawarin siya, sapagkat sa gayon ay mag-aalab laban sa taong iyon ang galit at paninibugho ni Yahweh. Lalapat sa kanya ang bawat sumpang[a] nakasulat sa aklat na ito, at papawiin ni Yahweh ang pangalan niya mula sa silong ng langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bawat sumpang kalakip ng panunumpa.” Ang salitang Hebreo ay maaaring tumukoy sa sumpang binibigkas sa konteksto ng panunumpa sa tipan, hindi lamang sa isang pangkalahatang pagsumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבֶה
  choice: hindi loloobin
  rationale: Ipinapahayag ng אבה ang pagkukusang-loob o pagpayag, hindi ang kakayahan lamang. Likas at marangal sa Filipino ang “hindi loloobin” at pinananatili nito ang puwersang bolasyonal.
- source_word: סְלֹחַ לוֹ
  choice: na patawarin siya
  rationale: Karaniwang tumutukoy ang סלח sa pagpapatawad o pagpapawalang-sala sa konteksto ng tipan; “patawarin” ang malinaw at natural na katumbas.
- source_word: כִּי אָז
  choice: sapagkat sa gayon
  rationale: Pinagsasama nito ang paliwanag at ang bunga o kalagayang ipinahihiwatig ng parirala.
- source_word: יֶעְשַׁן אַף יְהוָה
  choice: mag-aalab ... ang galit ... ni Yahweh
  rationale: Literal na “uusok” ang galit sa Hebreo. Mas natural sa modernong Filipino ang “mag-aalab ang galit,” habang nananatili ang matinding larawan ng nag-aapoy na poot.
- source_word: קִנְאָתוֹ
  choice: paninibugho ni Yahweh
  rationale: Ang קנאה ay tumutukoy rito sa mapanibughong sigasig sa konteksto ng tipan; “paninibugho” ang tuwirang katumbas na hindi nagdaragdag ng paliwanag.
- source_word: בָּאִישׁ הַהוּא
  choice: laban sa taong iyon
  rationale: Ipinapahayag ng ב sa konteksto ng galit ang pagkapoot na nakatuon laban sa tinutukoy na lalaki. Ang “taong iyon” ay natural sa Filipino at hindi binabago ang isahang partikular na pagtukoy.
- source_word: וְרָבְצָה בוֹ
  choice: lalapat sa kanya
  rationale: Ang רבץ ay literal na humihimlay o nananatili sa ibabaw. Sa sumpa, ipinahihiwatig ng “lalapat” ang pagdating at pananatili nito sa tao.
- source_word: כָּל הָאָלָה
  choice: bawat sumpa
  rationale: Ang אָלָה ay sumpang kaugnay ng panunumpa sa tipan. Malinaw sa pangunahing teksto ang “bawat sumpa,” at inilalahad sa talababa ang mas tiyak na pahiwatig nito.
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: nakasulat sa aklat na ito
  rationale: Maaaring aklat o balumbon ang סֵפֶר; ang “aklat” ang natural na salita sa modernong Filipino at malinaw sa kontekstong ito.
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: papawiin ... ang pangalan niya
  rationale: Ang מחה kasama ng “pangalan” ay larawan ng pagbura sa alaala o salinlahi. Pinananatili ng “papawiin ang pangalan” ang idyomang biblikal.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: sa silong ng langit
  rationale: Ito ay nakaugaliang pariralang Hebreo para sa daigdig. Ang “sa silong ng langit” ay maikli, marangal, at pinananatili ang larawan ng pinagmulan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Larawan ng galit ng Diyos
  choice: “mag-aalab ... ang galit at paninibugho ni Yahweh”
  alternative: “uusok ... ang galit at paninibugho ni Yahweh”
  rationale: Ang “mag-aalab” ay likas sa Filipino at pinananatili ang masidhing larawang apoy ng idyomang Hebreo, nang hindi nagpapasok ng haka-hakang paliwanag tungkol sa damdamin ng Diyos.
- issue: Isahang pagtukoy sa lumalabag sa tipan
  choice: “taong iyon” at “siya”
  alternative: “lalaking iyon”
  rationale: Partikular at isahan ang Hebreo. Sa Filipino, ang “taong iyon” ay hindi kinakailangang nag-aalis sa gramatikal na panlalaking anyo sapagkat walang kasariang gramatikal ang pangngalan, at mas natural ito sa daloy.
- issue: Terminolohiya ng sumpa sa tipan
  choice: “bawat sumpa” sa teksto, na may talababa tungkol sa sumpang kalakip ng panunumpa
  alternative: “bawat sumpang-panunumpa” sa pangunahing teksto
  rationale: Madaling maunawaan ang “sumpa,” samantalang pinananatili ng talababa ang pormal na konteksto ng tipan at ang leksikal na lawak ng אָלָה.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “loloobin,” “mag-aalab,” at “lalapat” upang mapanatili ang bolasyonal na diwa at matitingkad na larawan ng Hebreo nang maging artipisyal o labis na literal.
