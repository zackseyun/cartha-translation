revisions:
- from: Asupre at asin—sunog[a] ang buong lupain nito. Hindi ito nahahasikan, wala itong pinasisibol, at walang anumang halaman na tumutubo rito. Tulad ito ng pagkagiba ng Sodoma at Gomorra, Adma at Zeboiim, na giniba ni Yahweh sa kanyang galit at matinding poot.
  to: Asupre[a] at asin, isang kaparangang tinupok ng apoy, ang buong lupain nito. Hindi ito nahahasikan, hindi ito nagpapasibol, at walang anumang halaman na tumutubo rito. Tulad ito ng pagkawasak ng Sodoma at Gomorra, Adma at Zeboiim, na winasak ni Yahweh sa kanyang galit at poot.
