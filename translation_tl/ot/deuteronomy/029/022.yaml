base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: tl
  text: Asupre[a] at asin, isang kaparangang tinupok ng apoy, ang buong lupain nito. Hindi ito nahahasikan, hindi ito nagpapasibol, at walang anumang halaman na tumutubo rito. Tulad ito ng pagkawasak ng Sodoma at Gomorra, Adma at Zeboiim, na winasak ni Yahweh sa kanyang galit at poot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Asupre at asin, pagkasunog ang buong lupain nito.” Napakaikli ng pariralang Hebreo; inilalarawan nito ang lupain bilang lubos na nasalanta ng asupre, asin, at pagkasunog.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: Asupre at asin
  rationale: Tuwirang modernong katumbas ng dalawang sangkap na naglalarawan sa wasak at tigang na kalagayan ng lupain.
- source_word: שְׂרֵפָה כָל אַרְצָהּ
  choice: sunog ang buong lupain nito
  rationale: Pinananatili ang maigsi at walang tahasang pandiwang paglalarawan sa Hebreo, habang natural na ipinahahayag sa Tagalog ang kalagayang dulot ng pagkasunog.
- source_word: לֹא תִזָּרַע
  choice: Hindi ito nahahasikan
  rationale: Inilalarawan ang lupain bilang hindi nahahasikan, nang hindi ipinapasok ang mas tiyak ngunit hindi tahasang ideya na hindi ito maaaring hasikan.
- source_word: וְלֹא תַצְמִחַ
  choice: wala itong pinasisibol
  rationale: 'Sinasalamin ang causative na anyo: ang lupain ay walang inililitaw o pinatutubong halaman.'
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: at walang anumang halaman na tumutubo rito
  rationale: Ang עֵשֶׂב ay maaaring tumukoy sa damo o pananim; mas malawak at angkop sa konteksto ang “halaman.”
- source_word: כְּמַהְפֵּכַת ... אֲשֶׁר הָפַךְ
  choice: Tulad ito ng pagkagiba ... na giniba
  rationale: Pinananatili ang pag-uugnay ng magkaugnay na pangngalan at pandiwa sa Hebreo sa pamamagitan ng “pagkagiba/giniba.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng banal na pangalang YHWH, hindi bilang isang titulo.
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: sa kanyang galit at matinding poot
  rationale: Pinananatili ang dalawang magkaugnay ngunit tumitinding katawagan para sa banal na galit.
theological_decisions:
- issue: Paglalahad sa paghatol ni Yahweh
  choice: na giniba ni Yahweh sa kanyang galit at matinding poot
  alternative: na winasak ni Yahweh dahil sa kanyang galit at matinding poot
  rationale: Ang “giniba” ay nagpapanatili sa leksikal na ugnayan ng מַהְפֵּכָה at הָפַךְ at hindi dinaragdagan o pinahihina ang pahayag tungkol sa banal na paghatol.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang teksto ay gumagamit ng personal na pangalang YHWH; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago at marangal na Filipino; payak ang pangungusap ngunit pinananatili ang matinding larawan ng tigang at sinunog na lupain. Ginamit ang karaniwang anyong Filipino ng mga pangalang Sodoma, Gomorra, at Adma, samantalang pinanatili ang Zeboiim at Yahweh bilang mga transliterasyon.
