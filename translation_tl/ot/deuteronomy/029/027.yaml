base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: tl
  text: Kaya binunot[a] sila ni Yahweh mula sa kanilang lupain nang may galit, poot, at matinding pagkagalit, at itinapon niya sila sa ibang lupain, gaya ng makikita sa araw na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hinugot” o “sapilitang binunot.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “gaya sa araw na ito,” isang idyomang tumutukoy sa kalagayang hayag o nakikita sa kasalukuyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: binunot sila
  rationale: Pinananatili nito ang marahas na larawang tila pagbunot sa halamang nakaugat, na angkop sa pagpapaalis sa bayan mula sa lupain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: מֵעַל אַדְמָתָם
  choice: mula sa kanilang lupain
  rationale: Sa konteksto ng tipan at pagpapatapon, ang אַדָמָה ay natural na tumutukoy sa lupaing tinitirhan at pag-aari ng bayan.
- source_word: בְּאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  choice: dahil sa galit, matinding poot, at napakalaking pagkagalit
  rationale: Pinananatili ang tatlong magkakapatong na katawagan sa galit at ang tumitinding diin ng גָּדוֹל. Ang 'dahil sa' ay likas sa Filipino at nagpapahayag ng kaugnayang sanhi o kalagayan ng pagkilos.
- source_word: וַיַּשְׁלִכֵם
  choice: at itinapon niya sila
  rationale: Malakas at tuwiran ang 'itinapon,' kaya napapanatili ang puwersa ng pandiwang Hebreo nang hindi pinapahina bilang simpleng pagpapadala.
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: sa ibang lupain
  rationale: Natural na Filipino ito para sa sapilitang paglilipat tungo sa isang banyagang lupain.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng kalagayan nila sa araw na ito
  rationale: Ipinahahayag nito ang Hebreong idyoma bilang isang kasalukuyan at nakikitang kalagayan, habang pinananatili sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Magkakapatong na mga katawagan sa poot ng Diyos
  choice: galit, matinding poot, at napakalaking pagkagalit
  alternative: galit, poot, at malaking pagkapoot
  rationale: Hindi pinagsasama sa iisang pangkalahatang salita ang tatlong salitang Hebreo; pinananatili ang retorikal na pagtitindi nang hindi nagdaragdag ng paliwanag na teolohikal.
- issue: Saklaw ng pariralang כַּיּוֹם הַזֶּה
  choice: gaya ng kalagayan nila sa araw na ito
  alternative: gaya sa araw na ito
  rationale: Ipinakikita ng mas natural na salin na ang bunga ng hatol ay makikita pa sa kasalukuyan, ngunit hindi nito nilulutas nang higit sa teksto ang eksaktong historikal na pananaw ng tagapagsalita.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang malinaw at malakas na mga pandiwa upang mapanatili ang larawan ng marahas na pagbunot at pagtatapon. Iniwasan ang labis na arkaikong pananalita, habang pinanatili ang tatluhang pagtitindi ng galit sa Hebreo.
