revisions:
- from: Kaya binunot sila ni Yahweh mula sa kanilang lupain[a] dahil sa galit, matinding poot, at napakalaking pagkagalit, at itinapon niya sila sa ibang lupain, gaya ng kalagayan nila sa araw na ito.[b]
