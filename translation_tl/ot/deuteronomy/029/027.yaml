  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa ng sapilitang pag-alis mula sa lupain at pagtatapon sa ibang lupain. Gayunman, ang “dahil sa” ay mas tuwirang nagsasaad ng sanhi kaysa sa Hebreong paulit-ulit na pang-ukol na naglalarawan ng pagkilos sa galit; mas malapit ang “nang may.” Ang “gaya ng kalagayan nila” ay nagdaragdag ng “nila,” samantalang ang idyoma ay tumutukoy sa kalagayang hayag sa kasalukuyan nang hindi tahasang nililimitahan ang paksa sa kanila.
  naturalness: Natural at marangal ang rebisyon. Ang “nang may galit, poot, at matinding pagkagalit” ay malinaw na modernong Filipino at pinananatili ang retorikal na tatluhang pagtitindi.
  terminology: Pinanatili ang “Yahweh,” “lupain,” at ang marahas na larawan ng “binunot” at “itinapon.” Inayos ang mga pantulong na salita upang hindi magdagdag ng hindi nakasaad na pagmamay-ari sa pangwakas na idyoma.
