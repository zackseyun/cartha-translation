id: DEU.29.21
reference: Deuteronomy 29:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: tl
  text: 'At magsasabi ang darating na salinlahi[a]—ang inyong mga anak na susunod sa inyo—at ang dayuhang manggagaling mula sa isang malayong lupain, kapag nakita nila ang mga salot sa lupaing iyon at ang mga sakit[b] nito na idinulot ni Yahweh dito[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang susunod na salinlahi.” Tumutukoy ang Hebreo sa isang salinlahing darating pagkaraan ng kasalukuyan, hindi kinakailangang sa pinakahuling salinlahi.
    reason: lexical_alternative
  - marker: b
    text: O “mga karamdaman.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “na ginawa ni Yahweh na magkasakit dito,” o “na pinahirapan niya dito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: sasabihin
  rationale: Bagaman isahan ang anyong Hebreo at nauuna sa simuno, sinusundan ito ng tambalang simuno; natural sa Tagalog ang isahang anyo ng pandiwa, na hindi minamarkahan ayon sa bilang.
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: ang darating na salinlahi
  rationale: Tumutukoy ito sa salinlahing susunod sa kasalukuyang kausap, hindi kinakailangang sa pinakahuling salinlahi.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: ang inyong mga anak na susunod sa inyo
  rationale: Ang בנים ay maaaring tumukoy sa mga anak o inapo; pinananatili ng 'mga anak' ang ugnayang pampamilya, habang natural na ipinahahayag ng 'susunod sa inyo' ang pagbangon nila pagkaraan ng kasalukuyang salinlahi.
- source_word: וְהַנָּכְרִי
  choice: at ng dayuhan
  rationale: Malinaw na tumutukoy ang נכרי sa taong mula sa labas ng Israel; mas tiyak ang 'dayuhan' kaysa 'estranghero' sa makabagong Tagalog.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: mula sa isang malayong lupain
  rationale: Natural at tuwirang pinananatili nito ang heograpikong kalayuan.
- source_word: וְרָאוּ
  choice: kapag nakita nila
  rationale: Ang waw na may perfect ay nauunawaan dito bilang pangyayaring nauuna sa kanilang pagsasalita; malinaw at natural ang temporal na sugnay sa Tagalog.
- source_word: מַכּוֹת
  choice: mga salot
  rationale: Sa konteksto ng mga sumpa ng tipan at pagkawasak ng lupain, ipinahahayag nito ang maparusahang mga hagupit o kapahamakan.
- source_word: תַּחֲלֻאֶיהָ
  choice: mga sakit nito
  rationale: Pinananatili nito ang metapora ng lupain na dinapuan ng mga karamdaman; maaari ring isaling 'mga karamdaman nito.'
- source_word: חִלָּה
  choice: ipinaranas
  rationale: Sinasaklaw ng salitang ito ang causative na diwang 'ginawang may sakit' o 'pinahirapan' nang hindi pilit na ginagawang literal na may sakit ang lupain sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: בָּהּ
  choice: dito
  rationale: Tumutukoy pabalik sa lupaing iyon; natural sa Tagalog ang 'ipinaranas dito' habang pinananatili ang lokatibong anyo ng Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Hayagang ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng בְּנֵיכֶם
  choice: inyong mga anak
  alternative: inyong mga anak na lalaki; inyong mga inapo
  rationale: Maaaring kolektibong tumukoy ang panlalaking maramihan sa mga supling; hindi kailangang limitahan sa mga lalaki, ngunit pinananatili ang kongkretong ugnayang pampamilya.
- issue: Larawan ng lupain bilang maysakit
  choice: mga sakit nito na ipinaranas dito ni Yahweh
  alternative: mga sakit nito na idinulot dito ni Yahweh; ginawa itong maysakit ni Yahweh
  rationale: Pinananatili ang metapora at ang pagkilos ni Yahweh bilang sanhi, ngunit iniiwasan ang lubhang alanganing literalismo sa Tagalog.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'salinlahi,' 'dayuhan,' at 'salot' bilang mga salitang pamilyar sa kontekstong biblikal ngunit nauunawaan pa rin ng karaniwang mambabasa. Inayos ang sugnay upang maging natural sa Tagalog habang pinananatili ang tambalang simuno at ang metapora ng maysakit na lupain.
