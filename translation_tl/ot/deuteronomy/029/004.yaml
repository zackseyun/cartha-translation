base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: tl
  text: At pinatnubayan ko kayo sa loob ng apatnapung taon sa ilang. Hindi naluma ang mga damit ninyo habang suot ninyo ang mga iyon,[a] at hindi naluma ang sandalyas mo sa paa mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, mula sa maramihang “kayo/ninyo” ay nagiging isahan ang huling sugnay: “ang sandalyas mo ay hindi naluma sa paa mo.” Maaaring tinutukoy ang Israel bilang isang buong bayan, o ginagamit ang isahan upang tumukoy sa bawat isa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: pinatnubayan ko
  rationale: Ang Hiphil ng הלך ay may diwang sanhi, ‘pinayaong/lumakad,’ ngunit sa konteksto ng paggabay ni YHWH sa Israel, likas at tumpak ang ‘pinatnubayan ko.’
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay tumutukoy sa ilang o tigang na lupa. Ang ‘sa ilang’ ay maikli, likas sa Filipino, at angkop sa biblikal na konteksto.
- source_word: בָּלוּ / בָלְתָה
  choice: naluma
  rationale: Sa pananamit at sapin sa paa, ipinahihiwatig ng בלה ang pagkasira o pagkaluma dahil sa paggamit. Ang ‘naluma’ ay malinaw at karaniwang Filipino.
- source_word: שַׂלְמֹתֵיכֶם
  choice: mga damit ninyo
  rationale: Malawak ang saklaw ng salita para sa mga kasuutan; mas natural sa modernong Filipino ang ‘mga damit’ kaysa ‘mga kasuotan’ o mas makitid na katawagan.
- source_word: מֵעֲלֵיכֶם
  choice: habang suot ninyo ang mga iyon
  rationale: 'Literal na ‘mula sa ibabaw ninyo.’ Ipinapahayag ng salin ang likas na diwa sa Filipino: hindi naluma ang mga damit habang nasa katawan at ginagamit nila.'
- source_word: נַעַלְךָ
  choice: sandalyas mo
  rationale: Ang נַעַל ay sinaunang sapin sa paa, kaya mas tiyak ang ‘sandalyas’ kaysa pangkalahatang ‘sapatos.’ Pinanatili ang isahan ng tekstong Hebreo.
- source_word: מֵעַל רַגְלֶךָ
  choice: sa paa mo
  rationale: Bagaman literal na ‘mula sa ibabaw ng paa mo,’ likas sa Filipino na sabihing hindi naluma ang sandalyas ‘sa paa mo.’
- source_word: אַרְבָּעִים שָׁנָה
  choice: sa loob ng apatnapung taon
  rationale: Tuwirang tagal ng panahon; nilagyan ng ‘sa loob ng’ upang maging natural ang daloy sa Filipino.
theological_decisions:
- issue: Paglipat mula sa maramihang ‘kayo/ninyo’ tungo sa isahang ‘mo’ sa huling sugnay
  choice: Pinanatili ang isahang ‘sandalyas mo … paa mo’
  alternative: 'Gawing maramihan: ‘mga sandalyas ninyo … mga paa ninyo’'
  rationale: Tahasan ang paglipat ng Hebreo mula maramihan tungo sa isahan. Maaaring tinutukoy nito ang Israel bilang isang kabuuang bayan o ginagamit ang isahan sa distributibong paraan; hindi dapat burahin ng salin ang tunay na pagbabagong ito.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘pinatnubayan’ upang maipahayag ang aktibong paggabay, at ‘sa ilang’ bilang likas at matatag na katumbas ng wilderness. Pinanatili sa teksto ang kapansin-pansing paglipat sa isahan at ipinaliwanag ito sa talababa.
