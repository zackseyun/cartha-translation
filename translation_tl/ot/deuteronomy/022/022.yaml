  text: כִּֽי יִמָּצֵ֨א אִ֜ישׁ שֹׁכֵ֣ב עִם אִשָּׁ֣ה בְעֻֽלַת בַּ֗עַל וּ/מֵ֨תוּ֙ גַּם שְׁנֵי/הֶ֔ם הָ/אִ֛ישׁ הַ/שֹּׁכֵ֥ב עִם הָ/אִשָּׁ֖ה וְ/הָ/אִשָּׁ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: tl
  text: Kung may matagpuang lalaking nakikipagtalik sa isang babaeng may asawa,[a] dapat mamatay silang dalawa[b]—ang lalaking nakipagtalik sa babae at ang babae. Sa gayon, aalisin mo ang kasamaan mula sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang babaeng may asawang lalaki,” isang pariralang nagbibigay-diin sa umiiral na buklod ng pag-aasawa.
    reason: lexical_alternative
  - marker: b
    text: Ang “dapat mamatay” dito ay nagsasaad ng parusang kamatayan na itinakda ng batas; maaari ring isalin na “dapat silang dalawa ay patayin.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: may matagpuan
  rationale: Ipinapahayag ng anyong Niphal ang pagkakatuklas sa lalaki; natural ito sa pananalitang legal sa Filipino at hindi kinakailangang mangahulugang nahuli mismo sa akto.
- source_word: שֹׁכֵב עִם
  choice: nakikipagtalik sa
  rationale: Ang idyomang Hebreo ay tumutukoy sa pakikipagtalik. Mas malinaw at natural ito sa modernong Filipino kaysa sa literal na “nakahiga kasama,” na maaaring hindi maunawaan bilang seksuwal.
- source_word: בְעֻלַת בַּעַל
  choice: babaeng may asawa
  rationale: Malinaw nitong ipinapahayag ang katayuan niya sa pag-aasawa nang hindi ipinapasok sa pangunahing teksto ang posibleng mapanlinlang na diwa ng pagmamay-ari.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: dapat mamatay silang dalawa
  rationale: Ipinapakita ng “dapat” ang itinakdang parusa sa kontekstong legal, samantalang pinananatili ng “mamatay” ang mismong anyo ng Hebreo sa halip na tahasang idagdag ang “papatayin.”
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה
  choice: ang lalaking nakipagtalik sa babae
  rationale: Pinananatili ang muling pagtukoy ng Hebreo sa lalaki at ang legal na paglilinaw kung sino ang nasasaklaw ng parusa.
- source_word: וְהָאִשָּׁה
  choice: at ang babae
  rationale: Pinananatili ang pag-uulit para sa legal na linaw at upang maipahayag ang kapwa pananagutan ayon sa pagkakabalangkas ng batas.
- source_word: וּבִעַרְתָּ
  choice: Sa gayon, aalisin mo
  rationale: Sa paulit-ulit na pormulang legal sa Deuteronomio, ang pandiwa ay nangangahulugang alisin o lipulin ang kasamaan sa sambayanan. Ang “aalisin” ay malinaw, marangal, at natural sa Filipino.
- source_word: הָרָע
  choice: ang kasamaan
  rationale: Tumpak na naihahatid ng abstraktong pangngalang “kasamaan” ang moral at pangtipang bigat ng salitang Hebreo.
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: Tuwirang ipinapahayag ang pag-aalis ng kasamaan mula sa bayang Israel, alinsunod sa pang-ukol ng Hebreo.
theological_decisions:
- issue: Paglalahad sa katayuan ng babae sa pariralang בְעֻלַת בַּעַל
  choice: babaeng may asawa
  alternative: babaeng may asawang lalaki; babaeng nakatali sa isang asawa
  rationale: Ang “may asawa” ang likas na katumbas sa Filipino at pinananatili ang mahalagang diwa ng umiiral na buklod ng pag-aasawa. Iniiwasan nito ang pagbibigay-kahulugan sa parirala bilang tahasang pagmamay-ari.
- issue: Kung tahasang sasabihing ang parusa ay pagbitay
  choice: dapat mamatay silang dalawa
  alternative: dapat silang dalawa ay patayin
  rationale: Ang kontekstong legal ay nagpapahiwatig ng parusang kamatayan, ngunit ang tekstong Hebreo mismo ay nagsasabing “mamatay.” Pinananatili sa pangunahing teksto ang anyong iyon at ipinapaliwanag sa talababa ang puwersang legal nito.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na wikang Filipino na angkop sa tekstong legal. Isinalin nang tuwiran ang seksuwal na idyoma upang maiwasan ang kalabuan ng literal na “nakahiga kasama,” habang pinanatili ang pag-uulit at bigat ng hatol sa Hebreo.
