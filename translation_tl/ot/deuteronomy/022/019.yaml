base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: tl
  text: Pagmumultahin nila siya ng isandaang siklong pilak at ibibigay iyon sa ama ng dalaga, sapagkat siniraan niya ang isang birhen ng Israel. At magiging asawa niya ito; hindi niya ito maaaring paalisin[a] habambuhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “diborsiyuhin.” Literal sa Hebreo ang “paalisin,” isang karaniwang pananalita para sa legal na pagwawakas ng pag-aasawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: pagmumultahin nila
  rationale: Sa kontekstong legal, tumutukoy ang pandiwa sa pagpapataw ng multang salapi, hindi lamang sa pangkalahatang pagpaparusa.
- source_word: מֵאָה כֶסֶף
  choice: isandaang siklong pilak
  rationale: Literal na “isandaang pilak” ang Hebreo, ngunit sa kontekstong pangkabuhayan ay ipinahihiwatig ang yunit na siklo; nilinaw ito nang hindi binabago ang halaga.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: sa ama ng dalaga
  rationale: Ang נַעֲרָה ay isang babaeng bata pa at nasa edad na maaaring mag-asawa; natural at marangal sa Filipino ang “dalaga.”
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: sapagkat binigyan niya ng masamang pangalan
  rationale: Pinananatili nito ang larawan ng idyomang Hebreo tungkol sa paglalagay ng masamang pangalan o reputasyon, sa halip na lubusang palitan ng mas interpretatibong “siniraan.”
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: ang isang birhen sa Israel
  rationale: Ang בְּתוּלָה ay tumutukoy rito sa isang birhen sa loob ng bayang Israel; malinaw sa Filipino ang “isang birhen sa Israel.”
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: ang dalaga ay mananatiling asawa niya
  rationale: Ipinahahayag ng sugnay ang nagpapatuloy na legal na kalagayan ng pag-aasawa. Ang “mananatili” ay natural sa konteksto ng kasunod na habambuhay na pagbabawal, bagaman literal na “magiging asawa niya.”
- source_word: לֹא יוּכַל
  choice: hindi niya maaaring
  rationale: Sa batas, ipinahahayag nito ang pagbabawal o kawalan ng legal na karapatan, hindi pisikal na kawalan ng kakayahan.
- source_word: לְשַׁלְּחָהּ
  choice: paalisin
  rationale: Pinananatili ng “paalisin” ang literal na larawan ng Hebreong “papuntahin o paalisin,” habang ang tiyak na legal na diwang “diborsiyuhin” ay inilalagay sa talababa.
- source_word: כָּל יָמָיו
  choice: habang siya ay nabubuhay
  rationale: Natural na Filipino ito para sa Hebreong idyomang “lahat ng kanyang mga araw,” na nangangahulugang buong buhay niya.
theological_decisions:
- issue: Idyomang legal para sa pagwawakas ng pag-aasawa
  choice: paalisin
  alternative: diborsiyuhin
  rationale: Maaaring tumukoy ang Hebreong idyoma sa diborsiyo, ngunit pinananatili sa pangunahing teksto ang mas literal na larawan. Itinatala sa talababa ang tahasang legal na kahulugan upang hindi maitago ang alternatibong pagbasa.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang “siklo” bilang nakaugaliang yunit ng timbang at salapi sa Bibliya. Inilagay ang panandang [a] kaagad pagkatapos ng salitang tinutukoy nito.
