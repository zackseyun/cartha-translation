revisions:
- from: Pagmumultahin nila siya ng isandaang siklong pilak at ibibigay iyon sa ama ng dalaga, sapagkat binigyan niya ng masamang pangalan ang isang birhen sa Israel. At ang dalaga ay mananatiling asawa niya; hindi niya ito maaaring paalisin[a] habang siya ay nabubuhay.
  to: Pagmumultahin nila siya ng isandaang siklong pilak at ibibigay iyon sa ama ng dalaga, sapagkat siniraan niya ang isang birhen ng Israel. At magiging asawa niya ito; hindi niya ito maaaring paalisin[a] habambuhay.
  rationale: Pinalitan ang hindi idiomatikong “binigyan niya ng masamang pangalan” ng natural na Filipino na “siniraan niya,” na tumpak sa legal na konteksto ng maling paratang. Pinalitan ang “mananatiling asawa niya” ng “magiging asawa niya ito” upang sundin ang legal na pahayag ng Hebreo nang walang idinagdag na aspekto. Pinanatili ang literal na “paalisin” at ang talababa nitong legal na alternatibo.
