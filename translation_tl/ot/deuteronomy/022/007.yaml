base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: tl
  text: Dapat mo talagang pakawalan ang inahin[a], ngunit maaari mong kunin ang mga inakay para sa sarili mo[b], upang maging mabuti ang kalagayan mo at humaba ang iyong buhay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Tiyak na pakawalan mo ang inahin.” Inuulit ng Hebreo ang ugat ng pandiwa upang idiin ang utos.'
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga anak”; sa konteksto ng pugad ng ibon, tumutukoy ito sa mga inakay.
    reason: lexical_alternative
  - marker: c
    text: Literal na “at mapahaba mo ang mga araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: Dapat mo talagang pakawalan
  rationale: Ang pawatas na ganap na kasunod ng pandiwang mula sa parehong ugat ay nagbibigay-diin sa utos. Likas na ipinahahayag sa makabagong Tagalog ng “dapat mo talagang pakawalan.”
- source_word: הָאֵם
  choice: ang inahin
  rationale: Sa konteksto ng pugad ng ibon, malinaw at likas ang “inahin”; hindi na kailangang idagdag ang “ibon.”
- source_word: הַבָּנִים
  choice: ang mga inakay
  rationale: Literal itong “mga anak,” ngunit sa konteksto ng pugad ay tumutukoy sa mga supling ng ibon. Ang “mga inakay” ang likas na salin sa Tagalog.
- source_word: תִּקַּח לָךְ
  choice: maaari mong kunin para sa iyo
  rationale: Pagkatapos ng mariing utos na pakawalan ang inahin, ang di-ganap na anyo ay nauunawaan dito bilang pahintulot. Pinananatili ng “para sa iyo” ang לָךְ.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: upang mapabuti ang kalagayan mo
  rationale: Malinaw nitong ipinahahayag ang pormulang layunin o bunga nang hindi pilit ang Hebreong idyoma sa Tagalog.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: at humaba ang iyong buhay
  rationale: Literal na tumutukoy sa pagpapahaba ng mga araw. Ang “humaba ang iyong buhay” ang likas na katumbas sa Tagalog at umaayon sa saklaw ng “upang.”
theological_decisions:
- issue: Likas ng ipinangakong bunga
  choice: Inilalahad ang mabuting kalagayan at mahabang buhay bilang pagpapalang kaugnay ng pagsunod.
  alternative: Isalin bilang isang mahigpit at walang-pasubaling garantiya ng mahabang buhay sa bawat indibidwal.
  rationale: Ang pormulang לְמַעַן ay nagsasaad ng layunin o bunga, ngunit hindi dapat dagdagan ng salin ang teksto upang gawing mekanikal at walang-pasubali ang pangako.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “inahin” at “mga inakay” bilang likas na bokabularyo sa konteksto ng ibon, at pinanatili ang diin ng utos at ang layunin/bungang pahayag ng Hebreo.
