translation:
  language: tl
  text: Gumawa ka para sa sarili mo ng mga palawit sa apat na sulok ng iyong pantakip na isinusuot mong pantakip sa sarili[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pinilipit na tali” o “mga borlas” sa halip na “mga palawit.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “iyong pantakip”; maaari ring “iyong kasuotan” o “iyong balabal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: mga palawit
  rationale: Tumutukoy ito sa mga nakabitin na tali o palamuti na itinakdang ilagay sa kasuotan. Ang “mga palawit” ay natural at madaling maunawaan sa makabagong Filipino, habang iniiwasang tukuyin nang labis ang eksaktong anyo nito.
- source_word: תַּעֲשֶׂה לָּךְ
  choice: Gumawa ka para sa sarili mo
  rationale: Ipinahahayag ng anyong pandiwa ang isang tuwirang utos, at pinananatili ng “para sa sarili mo” ang diwa ng personal na kapakinabangan o kaugnayan na nasa לָּךְ.
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: sa apat na sulok
  rationale: Bagaman maaaring mangahulugan ang כָּנָף ng “pakpak” o “dulo,” ang “mga sulok” ang malinaw at angkop na kahulugan kapag tela o kasuotan ang tinutukoy.
- source_word: כְּסוּתְךָ
  choice: ng pantakip
  rationale: Pinananatili ng “pantakip” ang malawak na kahulugan ng salitang Hebreo nang hindi ito nililimitahan sa isang tiyak na uri ng damit gaya ng balabal.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: na ginagamit mong pantakip sa sarili
  rationale: Likas ito sa Filipino at pinananatili ang ugnayang leksikal sa pagitan ng כְּסוּת (“pantakip”) at כּסה (“takpan”), nang hindi ipinapalagay ang isang partikular na paraan ng pagsusuot.
theological_decisions: []
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang pang-isahang “ka/mo” sapagkat pangalawang panauhang panlalaki na isahan ang anyong Hebreo; hindi ipinahiwatig sa salin ang kasarian dahil hindi ito karaniwang minamarkahan sa Filipino. Sadyang pinanatili ang pag-uulit ng “pantakip” upang maipakita ang ugnayan ng pangngalan at pandiwa sa Hebreo.
