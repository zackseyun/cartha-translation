base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: tl
  text: At gayon din ang gagawin mo sa asno niya, at gayon din ang gagawin mo sa balabal niya. Gayon din ang gagawin mo sa anumang bagay ng iyong kapatid na nawala sa kaniya at natagpuan mo; hindi mo iyon maaaring ipagwalang-bahala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “hindi mo maaaring itago ang iyong sarili,” o “hindi ka maaaring magkunwaring hindi mo iyon napansin.”
    reason: Pinananatili ang literal na larawan at ang posibleng idyomatikong kahulugan ng לְהִתְעַלֵּם.
lexical_decisions:
- source_word: וְכֵן
  choice: Gayon din
  rationale: Ipinagpapatuloy nito ang utos mula sa naunang talata at pinananatili ang paulit-ulit na estilo ng batas.
- source_word: תַּעֲשֶׂה
  choice: ang gagawin mo
  rationale: Ang anyong pandiwa ay may puwersa ng utos sa kontekstong legal. Likas sa Filipino ang pariralang ito kapag kasunod ng “Gayon din,” at hindi nito pinahihina ang obligasyon.
- source_word: לַחֲמֹרוֹ
  choice: sa asno niya
  rationale: Tumutukoy ito sa nawawalang hayop ng kapatid na binanggit sa konteksto. Ang “asno” ay tuwiran at karaniwang salin ng חֲמוֹר.
- source_word: לְשִׂמְלָתוֹ
  choice: sa balabal niya
  rationale: Ang שִׂמְלָה ay karaniwang tumutukoy sa panlabas na kasuotan; mas tiyak at kongkreto rito ang “balabal” kaysa sa pangkalahatang “damit.”
- source_word: לְכָל אֲבֵדַת
  choice: sa anumang bagay ... na nawala
  rationale: Pinalalawak ng parirala ang batas mula sa mga partikular na halimbawa tungo sa anumang nawawalang bagay, nang hindi ipinapasok ang mas teknikal na salitang “ari-arian.”
- source_word: אָחִיךָ
  choice: iyong kapatid
  rationale: Pinananatili ang tahasang katawagang pangkamag-anak sa Hebreo at ang pagkakaugnay nito sa pamayanang saklaw ng tipan.
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: na nawala sa kaniya
  rationale: Pinananatili nito ang di-aktibong paglalarawan sa bagay na napahiwalay sa may-ari, sa halip na tukuying siya mismo ang nakawala nito.
- source_word: וּמְצָאתָהּ
  choice: at natagpuan mo
  rationale: 'Tuwirang ipinahahayag ang kasunod na pangyayari: natagpuan ng kinakausap ang nawawalang bagay.'
- source_word: לֹא תוּכַל
  choice: hindi mo ... maaaring
  rationale: Sa kontekstong legal, nagsasaad ito ng ipinagbabawal na pagkilos, hindi lamang ng kawalan ng kakayahan.
- source_word: לְהִתְעַלֵּם
  choice: ipagwalang-bahala
  rationale: Natural nitong ipinahahayag sa Filipino ang praktikal na diwa ng Hebreong hitpael—ang pag-iwas sa pananagutan o pagkukunwaring hindi napansin—habang inilalahad sa talababa ang mas literal na larawan.
theological_decisions:
- issue: Kahulugan ng אָחִיךָ sa konteksto ng batas ng tipan
  choice: iyong kapatid
  alternative: iyong kapwa Israelita; iyong kamag-anak
  rationale: Bagaman maaaring tumukoy ang katawagan sa kapwa miyembro ng sambayanan ng tipan, tahasang “kapatid” ang ginamit ng Hebreo. Pinananatili ito upang hindi palawakin o paliitin nang tahimik ang panlipunan at teolohikal na balangkas ng teksto.
- issue: Puwersa ng לֹא תוּכַל לְהִתְעַלֵּם
  choice: hindi mo iyon maaaring ipagwalang-bahala
  alternative: hindi mo maaaring itago ang iyong sarili; hindi ka dapat magkunwaring hindi mo iyon napansin
  rationale: Ang idyoma ay may literal na larawan ng pagtatago o pag-iwas, ngunit sa batas ay gumaganap bilang pagbabawal sa pagtanggi sa pananagutan. Pinananatili ng pangunahing salin ang puwersa ng utos, at pinananatili ng talababa ang kongkretong larawan at saklaw ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatlong ulit na “Gayon din ang gagawin mo” bilang mahalagang katangian ng legal na estilo ng Hebreo. Ginamit ang “niya/kaniya” ayon sa natural na gamit sa Filipino at iniwasan ang labis na teknikal o denominasyonal na pananalita.
