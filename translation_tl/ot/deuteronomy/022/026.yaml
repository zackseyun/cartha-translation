base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: tl
  text: Ngunit huwag kang gumawa ng anuman laban sa dalaga. Wala siyang kasalanang may parusang kamatayan.[a] Sapagkat kung paanong sinasalakay ng isang lalaki ang kapwa niya at pinapaslang ito, gayon din ang kasong ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Walang pagkakasalang may parusang kamatayan ang dalaga.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “kung paanong bumangon ang isang lalaki laban sa kapwa niya at pinaslang ito, gayon ang bagay na ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: Ngunit … ang dalaga
  rationale: Ang וְ ay nagpapakita rito ng pagsalungat sa parusa sa lalaki sa naunang talata, kaya isinaling “Ngunit.” Sa kontekstong legal, ang נַעַר ay tumutukoy sa dalagang binanggit sa naunang kaso.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: huwag mong gagawan ng anuman
  rationale: Pinananatili nito ang tuwirang legal na utos sa ikalawang panauhang isahan at ang ganap na pagbabawal sa anumang hakbang laban sa dalaga.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: Walang kasalanan ang dalaga na nararapat sa kamatayan
  rationale: Ipinahahayag ng idyomang Hebreo ang kawalan ng pagkakasalang maaaring patawan ng kamatayan. Likas sa modernong Filipino ang salin habang nananatili ang legal na diin.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: tulad ng isang lalaking sumalakay sa kapwa niya
  rationale: Ang “sumalakay” ay natural na katumbas sa kontekstong ito ng literal na “tumindig laban,” at malinaw nitong ipinapakita ang marahas na pag-atake nang hindi dinaragdagan ang kaso.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: at pinaslang ito
  rationale: Ang רצח ay tumutukoy sa labag sa batas na pagkitil ng buhay, kaya mas tiyak ang “pinaslang” kaysa sa pangkalahatang “pinatay.” Ang “ito” ay tumutukoy sa kapwa bilang biktima.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: ang kasong ito ay tulad ng
  rationale: Inayos ang paghahambing sa natural na ayos ng Filipino. Ang דָּבָר ay “kaso” sa kontekstong hudisyal.
theological_decisions:
- issue: Saklaw ng kawalang-sala ng dalaga
  choice: Wala siyang pagkakasalang nararapat sa parusang kamatayan sa kasong ito.
  alternative: Ganap na kawalang-sala sa lahat ng moral na kahulugan.
  rationale: Legal ang puwersa ng pariralang Hebreo sa loob ng batas na ito. Hindi pinalalawak ng salin ang pahayag tungo sa isang pangkalahatang paghatol sa buong moral na kalagayan niya.
- issue: Paghahambing sa pagpaslang
  choice: Ang sapilitang pangyayari ay inihahambing sa isang biktimang sinalakay at pinaslang.
  alternative: Ang pangyayari ay ituring na literal na kapareho ng pagpaslang sa lahat ng aspekto.
  rationale: Ang כַּאֲשֶׁר … כֵּן ay naghahayag ng legal na analohiya tungkol sa kawalan ng pananagutan ng biktima, hindi ng pagkakapareho ng bawat detalye.
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Ang “dalaga,” “kasong ito,” “sumalakay,” at “pinaslang” ay madaling maunawaan at angkop sa legal at marahas na konteksto. Iniwasan ang sobrang literal na “bumangon laban” sa pangunahing teksto dahil hindi iyon natural sa kasalukuyang Filipino, ngunit itinabi sa talababa.
