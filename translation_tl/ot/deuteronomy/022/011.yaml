  text: You shall not wear cloth made of wool and linen together[a].
translation:
  language: tl
  text: Huwag kang magsuot ng telang gawa sa lana at lino na magkasama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “sha''atnez, lana at lino na magkasama.” Ang bihirang salitang sha''atnez ay tumutukoy sa telang gawa sa pinagsamang lana at lino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: Huwag kang magsuot
  rationale: Ang negasyon na לֹא kasama ng ikalawang panauhang pandiwa sa kontekstong legal ay likas na ipinahahayag sa modernong Tagalog bilang tuwirang pagbabawal.
- source_word: שַׁעַטְנֵז
  choice: telang yari sa magkasamang lana at lino
  rationale: Bihira ang terminong Hebreo at nililinaw ng kasunod na pariralang “lana at lino na magkasama”; ipinahahayag sa salin ang tiyak na pinaghalong materyal sa halip na hiramin ang di-pamilyar na salita.
- source_word: צֶמֶר
  choice: lana
  rationale: Ito ang karaniwang tawag sa hibla o telang mula sa balahibo sa konteksto ng pananamit.
- source_word: וּפִשְׁתִּים
  choice: at lino
  rationale: Bagaman maaari itong tumukoy sa halamang flax, “lino” ang angkop na tawag sa naprosesong materyal na ginagamit sa damit.
- source_word: יַחְדָּו
  choice: magkasama
  rationale: Ipinahihiwatig ng pang-abay na pinagsama ang dalawang materyal sa iisang tela o kasuotan.
theological_decisions: []
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang pang-isahang “kang” ayon sa anyong 2ms ng pandiwang Hebreo; hindi nito nililimitahan ang bisa ng utos sa kalalakihan lamang. Pinanatili ang konkretong “lana at lino” sa halip na gawing pangkalahatang “magkahalong tela.”
