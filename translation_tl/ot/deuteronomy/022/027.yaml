  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: tl
  text: Sapagkat natagpuan siya ng lalaki sa bukid[a]; sumigaw ang dalagang nakatakdang ikasal, ngunit walang sumaklolo sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa parang” o “sa labas na lupain.” Tumutukoy ang pariralang Hebreo sa isang bukás na pook sa kanayunan, na maaaring malayo sa mga taong makatutulong.
    reason: lexical_alternative
  - marker: b
    text: O “ngunit walang magligtas sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Naghahatid ito ng paliwanag sa naunang hatol at natural na pinananatili ang ugnayang sanhi o batayan.
- source_word: בַשָּׂדֶה
  choice: sa bukid
  rationale: Tuwirang salin ito ng pariralang Hebreo at ipinahihiwatig ang isang lantad at liblib na lugar sa labas ng pamayanan.
- source_word: מְצָאָהּ
  choice: natagpuan siya ng lalaki
  rationale: Ang מצא ay karaniwang nangangahulugang 'matagpuan.' Idinagdag ang 'ng lalaki' upang maging malinaw sa Tagalog ang simuno mula sa konteksto, nang hindi dinaragdagan ang diwa.
- source_word: צָעֲקָה
  choice: sumigaw
  rationale: Ipinahahayag ng pandiwa ang malakas na pagdaing o paghingi ng tulong; natural at hindi labis na mapagpaliwanag ang 'sumigaw.'
- source_word: הנער
  choice: dalaga
  rationale: Babae ang tinutukoy ayon sa konteksto at pagkakatugma ng pangungusap. Ang 'dalaga' ay natural na tumutukoy sa isang kabataang babae at angkop sa konteksto ng pag-aasawa.
- source_word: הַמְאֹרָשָׂה
  choice: nakatalagang pakasalan
  rationale: Ipinapakita nito na pormal na naipangako na siya sa pag-aasawa, na mas mabigat sa sinaunang batas kaysa sa karaniwang modernong pagkaunawa sa 'engaged.'
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: ngunit walang sumaklolo sa kanya
  rationale: Malinaw na ipinahahayag ng 'sumaklolo' ang agarang pagliligtas mula sa panganib at iniiwasan ang posibleng mas malawak na teolohikal na pakahulugan ng 'magligtas.'
theological_decisions:
- issue: Legal at panlipunang katayuan ng הַמְאֹרָשָׂה
  choice: nakatalagang pakasalan
  alternative: katipan; ipinangakong mapapangasawa
  rationale: Pinananatili nito ang pormal at may-bisang katayuan ng babae sa sinaunang batas nang hindi ito basta itinutumbas sa mas impormal na modernong pakikipagkasundo sa pag-aasawa.
- issue: Kasarian at edad ng הַנַּעַר ayon sa konteksto
  choice: dalaga
  alternative: kabataang babae
  rationale: Malinaw sa konteksto na babae ang tinutukoy. Natural sa modernong Tagalog ang 'dalaga' para sa isang kabataang babaeng nasa konteksto ng pag-aasawa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'nakatalagang pakasalan' upang maipakita ang pormal na sinaunang katayuan nang hindi gumagamit ng arkaikong 'ipinagkasundong mapangasawa.' Inilagay ang bawat panandang talababa sa pangunahing teksto.
