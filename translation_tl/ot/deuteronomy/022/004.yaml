translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pang-isahang “ito” dahil ang pariralang “asno o baka” ay naghaharap ng tig-isang alternatibong hayop; hindi nito binabago ang pangkalahatang saklaw ng utos.
