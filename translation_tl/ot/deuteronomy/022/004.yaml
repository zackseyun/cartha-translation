  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: tl
  text: Kapag nakita mong nakabagsak sa daan ang asno o baka ng kapatid mo, huwag mo itong ipagwalang-bahala; tiyak na tutulungan mo siyang ibangon ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kasama niya.” Ipinahihiwatig nito na tutulungan ang may-ari na ibangon ang hayop, sa halip na pabayaan siyang mag-isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: ng kapatid mo
  rationale: Pinananatili ng “kapatid” ang literal at pampamayanang bisa ng Hebreo; sa konteksto ng tipan, karaniwan itong tumutukoy sa kapwa kabilang sa Israel.
- source_word: חֲמוֹר
  choice: asno
  rationale: Ang “asno” ang malinaw at karaniwang katawagang Filipino para sa hayop na tinutukoy.
- source_word: שׁוֹרוֹ
  choice: baka
  rationale: Mas madaling maunawaan ng pangkalahatang mambabasang Filipino ang “baka” kaysa “barakong baka” o isang katawagang maaaring magpahiwatig lamang ng kinapon na hayop; sapat ito sa konteksto ng alagang hayop na pantrabaho.
- source_word: נֹפְלִים
  choice: nakabagsak
  rationale: Ipinahihiwatig nito na ang hayop ay bumagsak at kailangang ibangon, nang hindi ipinapalagay ang tiyak na dahilan gaya ng bigat ng pasan o pagkapagod.
- source_word: בַּדֶּרֶךְ
  choice: sa daan
  rationale: Ito ang tuwiran at likas na modernong salin ng lokasyon.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: ipagwalang-bahala
  rationale: Ang hitpael ng עלם ay idyomatikong tumutukoy sa sadyang hindi pagpansin o pag-iwas sa pananagutang tumulong.
- source_word: הָקֵם תָּקִים
  choice: Dapat mo itong ibangon
  rationale: Ang infinitive absolute na sinusundan ng pandiwa ay nagpapalakas sa utos. Ipinahahayag ng “dapat” ang diin at obligasyon nang natural sa Filipino.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: 'Tuwirang pinananatili nito ang kooperatibong diwa ng Hebreo: ang tumutulong ay kasamang kikilos ng may-ari, hindi papalit lamang sa kanya.'
