revisions:
- from: Huwag mong ipagwalang-bahala ang asno o baka ng kapatid mo kapag nakita mong nakabagsak ito sa daan. Dapat mo itong ibangon kasama niya.[a]
  to: Kapag nakita mong nakabagsak sa daan ang asno o baka ng kapatid mo, huwag mo itong ipagwalang-bahala; tiyak na tutulungan mo siyang ibangon ito.[a]
  rationale: Inayos ang ayos ng pangungusap at pinalitan ang “kasama niya” ng “tutulungan mo siyang” upang malinaw na ang panghalip ay tumutukoy sa kapatid o may-ari, habang pinananatili ang mariing utos at ang kooperatibong diwa ng Hebreo. Inilagay sa talababa ang mas literal na “kasama niya.”
