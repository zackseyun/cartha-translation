base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: tl
  text: Huwag mong hasikan ng dalawang uri ng binhi ang iyong ubasan, upang hindi maitalaga ang buong ani—ang binhing inihasik mo at ang bunga ng ubasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maging banal.” Sa kontekstong ito, ang ani ay ibinubukod at hindi na magagamit sa karaniwang paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: hasikan
  rationale: Tumutukoy ang זרע sa paghahasik ng binhi; ang “hasikan” ay likas na Filipino at angkop sa utos tungkol sa ubasan.
- source_word: כַּרְמְךָ
  choice: iyong ubasan
  rationale: Ang כרם ay karaniwang tawag sa ubasan, at pinananatili ng “iyong” ang ikalawang panauhang anyo ng Hebreo.
- source_word: כִּלְאָיִם
  choice: dalawang uri ng binhi
  rationale: Sa kontekstong ito, tumutukoy ang כִּלְאָיִם sa ipinagbabawal na paghahalo ng magkaibang uri. Ang parirala ay malinaw sa ordinaryong mambabasa nang hindi nililimitahan sa isang tiyak na halaman.
- source_word: פֶּן
  choice: Kung gagawin mo iyon
  rationale: Ipinahahayag ng פֶּן ang masamang bunga na dapat iwasan. Ang hiwalay na pangungusap ay natural sa modernong Filipino at nagpapanatili sa babalang puwersa.
- source_word: תִּקְדַּשׁ
  choice: magiging nakatalaga
  rationale: Ang literal na diwa ay “magiging banal/nakatalaga,” ibig sabihin ay ibubukod mula sa karaniwang paggamit. Pinananatili ng “nakatalaga” ang relihiyoso-legal na diwa nang hindi ipinahihiwatig na kapuri-puri ang pinaghalong ani.
- source_word: הַמְלֵאָה
  choice: ang buong ani
  rationale: Tumutukoy ang anyo sa kabuuang bunga o ani; malinaw at likas sa Filipino ang “buong ani.”
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: ang binhing inihasik mo
  rationale: Pinananatili nito ang tahasang pagtukoy sa inihasik na binhi sa maikli at natural na Filipino.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: at ang bunga ng ubasan
  rationale: Ang תבואה ay ani o bunga. Ang “bunga ng ubasan” ay malinaw na tumutukoy sa ani ng mga punong ubas.
theological_decisions:
- issue: Kahulugan ng תִּקְדַּשׁ sa legal na babala
  choice: magiging nakatalaga
  alternative: mawawalan ng karapatang gamitin; magiging banal
  rationale: Hindi tahasang sinasabi ng Hebreo kung kanino mapupunta ang ani; sinasabi nitong ito ay “magiging banal/nakatalaga.” Kaya pinanatili sa teksto ang pagkakabukod nito at ipinaliwanag sa talababa ang praktikal na bunga, sa halip na gawing tiyak ang “kumpiskahin” o “mawawala” bilang tanging pakahulugan.
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Ginamit ang pang-isahang “mo” ayon sa Hebreo. Iniwasan ang teknikal o makalumang pananalita, ngunit pinanatili ang legal at teolohikal na tensiyon ng “magiging nakatalaga.”
