  - severity: low
    issue: Maaaring maging mas malinaw ang “pintuang-bayan.”
    rationale: Ang “pintuan ng lungsod” ay mas tuwirang tumutukoy sa gate ng lungsod na nasa pinagmulan at sa English audit trail.
