translation:
  language: tl
  text: Kukunin ng ama ng dalaga at ng kanyang ina ang katibayan ng pagkabirhen ng dalaga, at ihaharap nila ito sa mga nakatatanda ng lungsod sa pintuan ng lungsod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “ang mga pagkabirhen ng dalaga,” isang idyoma para sa patunay o mga tandang iniharap bilang katibayan ng pagkabirhen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kukunin
  rationale: Ang Qal perfect na may prefixed conjunction ay may injunctive/future force sa sunod-sunod na legal na tagubilin; natural sa Filipino ang aspektong kontemplatibo para sa itinakdang gagawin.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: ang ama at ina ng dalaga
  rationale: Ang נַעֲרָה ay kabataang babaeng nasa edad na makapag-asawa. Ang “dalaga” ay maikli, natural, at angkop sa konteksto, nang hindi nagpapahiwatig ng batang paslit.
- source_word: וְהוֹצִיאוּ
  choice: ihaharap
  rationale: Ang Hiphil ng יצא ay literal na pagpapalabas o pagdadala palabas, ngunit sa legal na konteksto ay tumutukoy sa pormal na paglalantad o paghaharap ng ebidensiya sa mga awtoridad.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: ang katibayan ng kanyang pagkabirhen
  rationale: Literal itong “mga pagkabirhen ng dalaga,” isang idyoma para sa mga tanda o patunay na inihaharap bilang ebidensiya. Ang “katibayan ng kanyang pagkabirhen” ay malinaw at dignified sa modernong Filipino.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: sa matatandang pinuno ng lungsod
  rationale: Ang זְקֵנִים ay hindi lamang matatanda sa edad kundi mga kinikilalang pinuno at tagahatol ng pamayanan; pinananatili ng parirala ang tradisyonal na larawan at nililinaw ang tungkulin.
- source_word: הַשַּׁעְרָה
  choice: sa pintuang-bayan
  rationale: May directional ending ang salita, ngunit ang tarangkahan ng lungsod ang kinikilalang lugar ng paghatol. Ang “sa pintuang-bayan” ay natural na tumutukoy sa lokasyong pampubliko at hudisyal.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na estilong legal. Ginamit ang “dalaga” para sa babaeng nasa edad na makapag-asawa, “matatandang pinuno” upang maipakita ang opisyal na papel ng mga elder, at “pintuang-bayan” para sa lugar ng pampublikong paghatol.
