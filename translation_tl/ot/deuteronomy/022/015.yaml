- from: Kukunin ng ama at ina ng dalaga ang katibayan ng kanyang pagkabirhen at ihaharap iyon sa matatandang pinuno ng lungsod sa pintuang-bayan.[a]
  to: Kukunin ng ama ng dalaga at ng kanyang ina ang katibayan ng pagkabirhen ng dalaga, at ihaharap nila ito sa mga nakatatanda ng lungsod sa pintuan ng lungsod.[a]
  rationale: Inalis ang idinagdag na “pinuno” upang manatiling malapit sa katawagang Hebreo para sa mga elder, at ginawang “pintuan ng lungsod” ang lokasyon upang maging malinaw ang sanggunian. Pinanatili ang legal na aspekto at ang maingat na pagpapahayag sa maselang idiom.
