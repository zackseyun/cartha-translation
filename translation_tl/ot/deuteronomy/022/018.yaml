translation:
  language: tl
  text: Pagkatapos, kukunin ng mga matatanda ng lunsod na iyon ang lalaki at didisiplinahin siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “paparusahan siya,” o posibleng “hahagupitin siya.” Malawak ang kahulugan ng pandiwang Hebreo para sa pagdidisiplina o pagtutuwid; hindi nito tahasang tinutukoy rito ang eksaktong anyo ng parusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: kukunin
  rationale: Ang Qal ng לקח ay karaniwang nangangahulugang ‘kunin.’ Sa legal na konteksto, pinananatili ng ‘kukunin’ ang pagiging malawak ng pandiwa nang hindi ipinapalagay na sapilitang pagdakip ang tiyak na diwa.
- source_word: זִקְנֵי
  choice: mga pinuno
  rationale: Sa kontekstong sibiko at legal, tumutukoy ang זקנים sa kinikilalang mga tagapanguna o namamahala sa pamayanan, hindi lamang sa matatandang lalaki. Mas malinaw ito sa karaniwang modernong Tagalog kaysa sa literal na ‘matatanda.’
- source_word: הָעִיר הַהִוא
  choice: ng bayang iyon
  rationale: Ang עיר ay lokal na pamayanan o nasasakupan. Natural sa Tagalog ang ‘bayan’ para sa ganitong sinaunang pamayanan, at pinananatili ng ‘iyon’ ang demonstratibong pagtukoy.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Maaaring mangahulugan ang איש ng ‘lalaki’ o, ayon sa konteksto, ‘asawang lalaki.’ Pinananatili ng ‘ang lalaki’ ang mismong lawak ng salitang Hebreo habang malinaw na tumutukoy sa lalaking binanggit sa naunang kaso.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: at didisiplinahin siya
  rationale: 'Malawak ang saklaw ng יסר: disiplinahin, ituwid, o parusahan. Hindi nito sa sarili nito tinutukoy ang eksaktong uri ng parusa, kaya hindi ito nilimitahan sa paghagupit.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘mga pinuno’ upang malinaw na ipahayag ang opisyal na tungkulin ng mga elder sa legal na usapin; ang ‘didisiplinahin’ ay sadyang nagpapanatili sa lawak at posibleng kalabuan ng pandiwang Hebreo.
