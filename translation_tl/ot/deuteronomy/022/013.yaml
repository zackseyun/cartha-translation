  text: If a man takes a wife and goes in to her[a], and then hates her,
translation:
  language: tl
  text: Kung ang isang lalaki ay kumuha ng asawa at sumiping sa kanya,[a] at pagkatapos ay mapoot sa kanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tahasan, “makipagtalik sa kanya.” Ang idyomang Hebreo na literal na “pumasok sa kanya” ay tumutukoy sa pagtatalik ng mag-asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagsisimula ito ng isang kondisyunal na kaso sa batas; likas at malinaw sa Filipino ang “Kung.”
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: ang isang lalaki ay kumuha ng asawa
  rationale: Pinananatili nito ang anyong “kumuha ng asawa” ng Hebreo habang malinaw na tumutukoy sa pag-aasawa.
- source_word: וּבָא אֵלֶיהָ
  choice: at sumiping sa kanya
  rationale: Ang idyomang Hebreo ay tumutukoy sa pakikipagtalik sa loob ng pag-aasawa. Ang “sumiping” ay natural, mahinahon, at sapat na malinaw sa modernong Filipino.
- source_word: וּשְׂנֵאָהּ
  choice: at pagkatapos ay mapoot sa kanya
  rationale: Tuwirang inililipat ng “mapoot” ang diwa ng pandiwa; ang “pagkatapos” ay nagpapakita ng pagkakasunod-sunod ng mga pangyayari.
