  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם לֹ֨א קָר֥וֹב אָחִ֛י/ךָ אֵלֶ֖י/ךָ וְ/לֹ֣א יְדַעְתּ֑/וֹ וַ/אֲסַפְתּ/וֹ֙ אֶל תּ֣וֹךְ בֵּיתֶ֔/ךָ וְ/הָיָ֣ה עִמְּ/ךָ֗ עַ֣ד דְּרֹ֤שׁ אָחִ֨י/ךָ֙ אֹת֔/וֹ וַ/הֲשֵׁבֹת֖/וֹ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: tl
  text: Ngunit kung ang kapatid mo[a] ay hindi malapit sa iyo at hindi mo siya kilala[b], dalhin mo iyon sa loob ng iyong bahay. Mananatili iyon sa iyo hanggang sa hanapin iyon ng kapatid mo; pagkatapos ay ibalik mo iyon sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapatid” dito ay malamang na tumutukoy nang mas malawak sa kapwa kabilang sa Israel, hindi lamang sa kapatid sa dugo.
    reason: cultural_note
  - marker: b
    text: O “at hindi mo alam kung kanino iyon”; sa literal, “at hindi mo siya kilala.”
    reason: lexical_alternative
  - marker: c
    text: O “isauli mo iyon sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: ang kapatid mo
  rationale: Pinananatili ang literal na wikang pampamilya ng Hebreo. Sa konteksto ng batas sa Deuteronomio, maaari itong tumukoy nang mas malawak sa kapwa Israelita, hindi lamang sa kapatid sa dugo.
- source_word: קָרוֹב אֵלֶיךָ
  choice: hindi malapit sa iyo
  rationale: Pinananatili ang diwa ng pisikal na kalapitan at ang bahagyang pagiging bukás ng parirala kung pansamantalang wala o hindi nakatira sa malapit ang may-ari.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: at hindi mo siya kilala
  rationale: 'Tuwirang tinutumbasan ang panlalaking isahang panghalip na tumutukoy sa kapatid o may-ari. Ipinapaliwanag sa talababa ang malinaw na kahulugan nito sa konteksto: hindi alam kung kanino ang napulot.'
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: dalhin mo iyon sa loob ng iyong bahay
  rationale: Likas na utos sa modernong Tagalog na nagpapahayag ng pagkupkop o pagdadala sa napulot na hayop o bagay papasok sa bahay.
- source_word: וְהָיָה עִמְּךָ
  choice: Mananatili iyon sa iyo
  rationale: Ipinahahayag ang nagpapatuloy na pag-iingat na hinihingi ng konteksto, hindi lamang ang literal na 'mapapasaiyo iyon.'
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: hanggang sa hanapin iyon ng kapatid mo
  rationale: Ang דרש ay maaaring mangahulugang hanapin, usisain, o hingin bilang pag-aari; ang 'hanapin' ay maikli at hindi labis na nagpapakipot sa kahulugan.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: pagkatapos ay ibalik mo iyon sa kanya
  rationale: Ang Hiphil ng שוב ay nagsasaad ng pagpapabalik o pagsasauli. Ang 'ibalik' ay malinaw at karaniwan sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang mga tuwirang anyong pautos upang likas na maipahayag ang tungkuling legal sa Hebreo. Pinanatili ang “kapatid” at ang literal na “hindi mo siya kilala,” habang inilagay sa mga talababa ang saklaw at kontekstuwal na kahulugan ng mga ito.
