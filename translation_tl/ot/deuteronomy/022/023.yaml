- from: Kung may isang dalagang birhen na nakatipang pakasal sa isang lalaki[a], at makatagpo sa kanya sa lungsod ang ibang lalaki at sumiping sa kanya,
  to: Kung may dalagang birhen na nakatakdang ikasal sa isang lalaki[a], at matagpuan siya sa lungsod ng ibang lalaki at sumiping ang lalaking iyon sa kanya,
  rationale: Inayos ang sintaks para sa mas natural na modernong Filipino at pinalitan ang hindi gaanong idiomatikong «nakatipang pakasal» ng «nakatakdang ikasal». Pinanatili ang lahat ng mahahalagang elemento ng Hebreo at ang neutral na pagbanggit sa pagsiping, habang ang talababa ang nagpapalinaw sa pormal at legal na bigat ng pagkakatali sa pagpapakasal.
