    rationale: Ang «nakatakdang ikasal» ay mas malinaw at likas sa Filipino. Dahil maaaring hindi nito ganap na maipahiwatig nang mag-isa ang legal na katangian ng Hebreong betrothal, pinananatili at pinaiigting ang paliwanag sa talababa.
