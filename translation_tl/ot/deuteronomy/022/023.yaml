base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: tl
  text: Kung may dalagang birhen na nakatakdang ikasal sa isang lalaki[a], at matagpuan siya sa lungsod ng ibang lalaki at sumiping ang lalaking iyon sa kanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakipagtipan nang pakasal sa isang lalaki.” Ang Hebreo ay tumutukoy sa isang pormal at legal na may-bisang kasunduan sa pagpapakasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Kung may
  rationale: Nagpapakilala ito ng isang kondisyong hipotetikal sa batas; natural at malinaw sa makabagong Filipino ang “Kung may.”
- source_word: נער
  choice: dalaga
  rationale: Tumutukoy sa isang babaeng bata pa ngunit nasa edad nang mag-asawa. Ang “dalaga” ay likas at marangal sa Filipino nang hindi nagpapahiwatig na musmos siya.
- source_word: בְתוּלָה
  choice: birhen
  rationale: Tahasang binabanggit ng Hebreo ang pagiging birhen, kaya pinanatili ito bilang hiwalay na paglalarawan.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: nakatipang pakasal sa isang lalaki
  rationale: Ipinahahayag nito ang isang pormal at may-bisang tipan sa pagpapakasal, hindi lamang ang karaniwang di-pormal na kasintahan o engagement ngayon.
- source_word: וּמְצָאָהּ אִישׁ
  choice: makatagpo sa kanya … ang ibang lalaki
  rationale: Ang Hebreo ay literal na “makatagpo sa kanya ang isang lalaki.” Idinagdag ang “ibang” upang malinaw na hindi ito ang lalaking katipan niya, gaya ng hinihingi ng konteksto.
- source_word: בָּעִיר
  choice: sa lungsod
  rationale: Pinananatili ang lokasyong mahalaga sa kasong legal na ipinagpapatuloy sa susunod na talata.
- source_word: וְשָׁכַב עִמָּהּ
  choice: sumiping sa kanya
  rationale: Pinananatili ng “sumiping” ang eupemistikong paraan ng Hebreo sa pagtukoy sa pakikipagtalik, sa halip na gawing mas tahasan o magdagdag ng pamimilit na hindi sinasabi ng pariralang ito mismo.
theological_decisions:
- issue: Kung dapat tahasang ilarawan bilang sapilitan ang pakikipagtalik sa talatang ito
  choice: Neutral na isinalin bilang “sumiping sa kanya,” nang hindi idinaragdag ang “ginahasa” o “pinilit.”
  alternative: “gahasain siya” o “pilitin siyang sipingan”
  rationale: Hindi tahasang ipinahahayag ng mga salita sa talatang ito lamang na sapilitan ang ginawa. Pinananatili ng salin ang pagkakasabi at tensiyon ng teksto nang hindi inuunahan ang mga pagkakaibang legal sa mga kasunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa isang tekstong legal. Ginamit ang “dalagang birhen” upang mapanatili ang dalawang paglalarawan sa Hebreo, at “sumiping” upang mapanatili ang eupemistikong rehistro ng pinagmulan.
