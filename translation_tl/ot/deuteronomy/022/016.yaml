  source_fidelity: 'Tapat ang salin sa estruktura at diwa ng Hebreo: ang ama ang nagsasalita sa mga nakatatanda, ibinigay niya ang kaniyang anak na babae sa lalaking ito bilang asawa, at ang lalaki ay napopoot sa kaniya. Ang panghinaharap na “sasabihin” ay angkop sa kasong legal-prosedural.'
  naturalness: Likas at malinaw ang modernong Filipino. Ang “mga nakatatanda” ay maayos sa kontekstong pampamayanan/panghukuman, at ang pag-uulit ng “ang anak ko” ay nakaiiwas sa kalabuan ng panghalip.
