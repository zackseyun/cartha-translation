base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/016.yaml
  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: tl
  text: At sasabihin ng ama ng dalaga sa mga nakatatanda, “Ibinigay ko ang anak kong babae sa lalaking ito upang maging asawa niya, at kinapopootan niya ang anak ko.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at napoot siya sa anak ko.” Ang pandiwang Hebreo ay payak na nangangahulugang “mapoot”; maaari itong ipahayag bilang kasalukuyang saloobin o bilang saloobing nabuo kalaunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: At sasabihin
  rationale: Ang anyong pandiwa ay bahagi ng paglalahad ng pamamaraang legal; ang panghinaharap na “sasabihin” ay natural sa Filipino at nagpapakita ng itinakdang gagawin sa kasong inilalarawan.
- source_word: אֲבִי הַנַּעַר
  choice: ang ama ng dalaga
  rationale: Tinutukoy nito ang ama ng isang babaeng nasa edad nang mag-asawa. Ang “dalaga” ay maikli, natural, at angkop sa konteksto, nang hindi gumagamit ng makalumang pananalita.
- source_word: הַזְּקֵנִים
  choice: mga nakatatanda
  rationale: Sa kontekstong legal, tumutukoy ito sa kinikilalang mga nakatatandang may tungkuling pansibiko at panghukuman, hindi lamang sa matatandang lalaki.
- source_word: אֶת בִּתִּי
  choice: ang anak kong babae
  rationale: Tuwirang ipinapahayag ng בִּתִּי ang “aking anak na babae”; hindi isinasalin nang hiwalay ang pananda sa tuwirang layon na אֶת.
- source_word: נָתַתִּי
  choice: Ibinigay ko
  rationale: Ang נָתַן sa ganitong konteksto ay tumutukoy sa pagbibigay ng anak na babae upang mapangasawa. Pinananatili ng salin ang payak at tuwirang pahayag.
- source_word: לָאִישׁ הַזֶּה
  choice: sa lalaking ito
  rationale: Pinananatili nito ang literal na “lalaki” at ang pantukoy na “ito”; nililinaw na ng kasunod na parirala ang kaugnayang mag-asawa.
- source_word: לְאִשָּׁה
  choice: upang maging asawa niya
  rationale: Ito ay karaniwang pahayag sa Hebreo tungkol sa pag-aasawa. Ang salin ay likas sa modernong Filipino at malinaw na naghahayag ng layuning mapangasawa.
- source_word: וַיִּשְׂנָאֶהָ
  choice: at kinapopootan niya ang anak ko
  rationale: Ang שׂנא ay payak na nangangahulugang “mapoot.” Ginamit ang aspektong pangkasalukuyan upang ilarawan ang umiiral na saloobin ng lalaki; inulit ang “anak ko” upang maiwasan ang kalituhan sa panghalip.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal na himig para sa tekstong legal. Ginamit ang “mga nakatatanda” bilang katawagan sa kinikilalang mga pinunong gumaganap ng tungkuling panghukuman. Inilagay ang tandang [a] pagkatapos ng sugnay na tinutukoy ng talababa.
