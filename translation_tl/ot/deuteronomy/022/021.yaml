  naturalness: Marangal at likas sa modernong Filipino Tagalog ang rehistro. Mas malinaw ang “mga lalaki ng kaniyang lungsod” kaysa “mga lalaki sa kaniyang lungsod,” na maaaring unawaing mga lalaking pisikal na nasa loob lamang ng lungsod.
