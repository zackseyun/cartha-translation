  to: Pagkatapos, ilalabas nila ang dalaga[a] sa pasukan ng bahay ng kaniyang ama. Babatuhin siya ng mga lalaki ng kaniyang lungsod ng mga bato, at mamamatay siya, sapagkat gumawa siya ng isang karumal-dumal na gawa[b] sa Israel nang magpatutot siya[c] sa bahay ng kaniyang ama. Sa gayon, aalisin ninyo ang kasamaan sa gitna ninyo.
