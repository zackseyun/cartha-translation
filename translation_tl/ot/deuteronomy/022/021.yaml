  text: וְ/הוֹצִ֨יאוּ אֶת ה/נער אֶל פֶּ֣תַח בֵּית אָבִ֗י/הָ וּ/סְקָלוּ/הָ֩ אַנְשֵׁ֨י עִירָ֤/הּ בָּ/אֲבָנִים֙ וָ/מֵ֔תָה כִּֽי עָשְׂתָ֤ה נְבָלָה֙ בְּ/יִשְׂרָאֵ֔ל לִ/זְנ֖וֹת בֵּ֣ית אָבִ֑י/הָ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: tl
  text: Pagkatapos, ilalabas nila ang dalaga[a] sa pasukan ng bahay ng kaniyang ama. Babatuhin siya ng mga lalaki ng kaniyang lungsod ng mga bato, at mamamatay siya, sapagkat gumawa siya ng isang karumal-dumal na gawa[b] sa Israel nang magpatutot siya[c] sa bahay ng kaniyang ama. Sa gayon, aalisin ninyo ang kasamaan sa gitna ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “batang babae.” Ang Hebreong נַעַר ay maaaring tumukoy sa isang batang babae; ang konteksto ang nagtatakda ng tiyak na diwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “isang kahiya-hiyang bagay” o “isang napakasamang gawa.” Ang Hebreong נְבָלָה ay tumutukoy sa isang gawang lubhang nakagigimbal at kasuklam-suklam sa moral.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “gumawa ng imoralidad na seksuwal.” Ang pandiwang Hebreo na זנה ay literal na naglalarawan ng pagpapatutot, ngunit madalas ding ginagamit nang mas malawak para sa ipinagbabawal na pakikipagtalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: ang dalaga
  rationale: Bagaman anyong panlalaki ang baybay sa tekstong Masoretiko, malinaw sa konteksto at sa mga panghalip na babae ang tinutukoy. Ang “dalaga” ay natural na modernong Tagalog para sa isang batang babaeng nasa kontekstong ito ng pag-aasawa.
- source_word: פֶּתַח
  choice: pasukan
  rationale: Tumutukoy ito sa bukana o entrada. Ang “pasukan” ay malinaw at hindi nagpapalagay na mismong pinto ang tinutukoy.
- source_word: בֵּית אָבִיהָ
  choice: bahay ng kaniyang ama
  rationale: Pinananatili nito ang kongkretong “bahay” ng Hebreo, habang maaari pa ring ipahiwatig ng konteksto ang sambahayan ng ama.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  choice: Babatuhin siya
  rationale: Sa Tagalog, likas nang nakapaloob sa pandiwang “babatuhin” ang paggamit ng mga bato; ang pagdaragdag ng “ng mga bato” ay magiging labis na paulit-ulit nang walang dagdag na linaw.
- source_word: אַנְשֵׁי עִירָהּ
  choice: mga lalaki sa kaniyang lungsod
  rationale: Pinananatili ang tahasang panlalaking pangngalan ng Hebreo at ang ugnayan nila sa lungsod ng babae.
- source_word: נְבָלָה
  choice: isang karumal-dumal na gawa
  rationale: Ipinahahayag nito ang matinding moral at panlipunang pagkasuklam ng salita, hindi lamang ang karaniwang kahangalan.
- source_word: לִזְנוֹת
  choice: nang magpatutot siya
  rationale: Pinananatili nito ang matinding larawang kaugnay ng pagpapatutot sa pandiwang זנה, habang inilalagay sa talababa ang mas malawak na posibleng diwa ng bawal na pakikipagtalik.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Sa gayon, aalisin ninyo ang kasamaan sa gitna ninyo
  rationale: Natural at marangal itong salin ng paulit-ulit na pormulang legal sa Deuteronomio. Ang “ninyo” ay angkop sa kolektibong bayang kinakausap sa pamamagitan ng isahang anyo sa Hebreo.
theological_decisions:
- issue: Matinding katawagang legal at seksuwal
  choice: Panatilihin ang “karumal-dumal na gawa” at “magpatutot” sa pangunahing teksto.
  alternative: Gumamit lamang ng mas malawak na “imoralidad na seksuwal” o ng mas banayad na “gumawa ng hindi nararapat.”
  rationale: Hindi dapat pagaanin ang bigat ng paratang sa Hebreo, ngunit hindi rin dapat dagdagan ng mga kategoryang doktrinal na wala sa teksto. Nililinaw ng talababa ang mas malawak na saklaw ng pandiwa.
- issue: Kasariang ipinahahayag ng mga tagapagpatupad ng hatol
  choice: “mga lalaki sa kaniyang lungsod”
  alternative: “mga tao sa kaniyang lungsod” o “mga mamamayan”
  rationale: Tahasan ang panlalaking anyo na אַנְשֵׁי sa pormulang legal, kaya pinanatili ito sa halip na gawing neutral.
- issue: Isahan sa Hebreo at kolektibong kausap sa Tagalog
  choice: “aalisin ninyo ... sa gitna ninyo”
  alternative: “aalisin mo ... sa gitna mo”
  rationale: Ang morpolohiya ng Hebreo ay isahan, ngunit kolektibong Israel ang kausap. Sa modernong Tagalog, ang literal na isahang “mo” ay madaling mapagkamalang isang pribadong indibidwal lamang; ipinahahayag ng “ninyo” ang kolektibong tinutukoy nang hindi binabago ang tungkulin ng utos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran, na angkop sa tekstong legal. Ginamit ang “kaniyang” para sa pormal at malinaw na reperensiya, ngunit iniwasan ang sobrang makalumang ayos. Pinanatili ang bigat at tensiyong moral ng Hebreo nang hindi dinaragdagan o pinahihina.
