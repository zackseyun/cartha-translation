  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: tl
  text: Huwag kang mag-araro gamit ang baka at asno na magkasama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Huwag mong gamitin nang magkasama sa pag-aararo ang baka at asno.”'
    reason: Ipinapakita ang isang likas na alternatibong ayos na tahasang inililinaw na ang dalawang hayop ay sabay na ginagamit sa pag-aararo.
lexical_decisions:
- source_word: לֹא תַחֲרֹשׁ
  choice: Huwag kang mag-araro
  rationale: Ang negasyon na לֹא kasama ng Qal imperfect na ikalawang panauhang panlalaki ay naghahayag ng tuwirang pagbabawal. Natural at malinaw sa modernong Filipino ang anyong “Huwag kang…,” habang pinananatili ang lakas ng utos sa kontekstong legal.
- source_word: בְּשׁוֹר
  choice: ang baka
  rationale: Sa konteksto ng pag-aararo, ang שׁוֹר ay tumutukoy sa bovinong hayop na ginagamit sa paggawa. Mas karaniwan at madaling maunawaan ang “baka” kaysa “barakong baka” o “ökse,” at hindi hinihingi ng talata ang mas tiyak na kasarian o kondisyon ng hayop.
- source_word: וּבַחֲמֹר
  choice: at asno
  rationale: Ang חֲמוֹר ay karaniwang katawagan sa donkey. Ang “asno” ay malinaw, dignipikado, at kilala sa Filipino.
- source_word: יַחְדָּו
  choice: nang magkasama
  rationale: Ipinahihiwatig ng pang-abay na ang dalawang magkaibang hayop ay pinagsasabay o ipinaparis sa iisang gawain ng pag-aararo. Tuwiran itong naihahatid ng “nang magkasama.”
theological_decisions:
- issue: Lakas ng pagbabawal sa batas ng tipan
  choice: Tuwirang utos na “Huwag kang mag-araro…”
  alternative: “Hindi ka dapat mag-araro…”
  rationale: Ang לֹא na may imperfect sa legal na materyal ay isang pagbabawal. Ang “Huwag kang…” ang pinakanatural na tuwirang pagbabawal sa modernong Filipino at hindi nagpapasok ng anumang denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Ginamit ang natural na anyo ng pagbabawal sa halip na mas pormal ngunit hindi gaanong likas na “Hindi ka dapat.”
