  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: tl
  text: 'Ilabas ninyo silang dalawa sa pintuan ng lunsod na iyon[a], at batuhin ninyo sila ng mga bato, at mamamatay sila: ang dalaga[b], sapagkat hindi siya sumigaw sa lunsod; at ang lalaki, sapagkat hinalay niya ang asawa ng kanyang kapwa[c]. Sa gayon ay alisin ninyo ang kasamaan sa gitna ninyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pintuan ng lunsod ang karaniwang pampublikong lugar para sa mga paglilitis at paghatol sa mga sinaunang lunsod ng Israel.
    reason: cultural_note
  - marker: b
    text: Maaari ring “batang babae.” Sa pagkakasulat ng salitang Hebreo rito, wala ang panghuling titik na karaniwang nagpapalinaw sa anyong pambabae, ngunit ipinakikita ng kasunod na pandiwang “hindi siya sumigaw” na babae ang tinutukoy.
    reason: textual_and_lexical_note
  - marker: c
    text: Maaari ring “hinamak,” “pinahiya,” o “nilapastangan.” Ang pandiwang Hebreo ay maaaring tumukoy sa seksuwal na paglabag na may kasamang paghamak o pagpapahiya; pinili ang “hinalay” upang malinaw na maihatid ang kontekstong seksuwal nang hindi ikinakahon ang salita sa isang tanging makabagong terminong legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתֶם
  choice: Ilabas ninyo
  rationale: Ang Hiphil ng יצא ay sanhi o pagpapalabas; natural at tuwiran sa makabagong Tagalog ang “ilabas ninyo.”
- source_word: שְׁנֵיהֶם
  choice: silang dalawa
  rationale: Malinaw nitong tinutukoy ang dalawang taong sangkot at likas ang ayos sa Tagalog.
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: pintuang-bayan ng lunsod na iyon
  rationale: Pinananatili ang tiyak na pook sa tekstong Hebreo; ipinapaliwanag sa talababa ang pampublikong-gampaning panghukuman nito.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים
  choice: batuhin ninyo sila ng mga bato
  rationale: Pinananatili ang tahasang “ng mga bato” ng Hebreo kahit maipahihiwatig na ito ng pandiwang “batuhin.”
- source_word: וָמֵתוּ
  choice: at mamamatay sila
  rationale: Tuwirang pinananatili ang pagkakasunod ng Hebreo bilang kasunod na bunga, nang hindi ito ginagawang tahasang layunin sa pamamagitan ng “upang.”
- source_word: הנער
  choice: ang dalaga
  rationale: Ang kasunod na pambabaeng pandiwa ay nagpapakitang babae ang tinutukoy. Ang “dalaga” ay natural at angkop sa konteksto, habang iniiwasan ang posibleng maling pahiwatig ng murang edad sa “batang babae.”
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: sapagkat hindi siya sumigaw sa loob ng lunsod
  rationale: Malinaw na ipinahahayag ang dahilang ibinibigay mismo ng batas at pinananatili ang lokasyong “sa lunsod.”
- source_word: עִנָּה
  choice: nilapastangan
  rationale: Sa kontekstong seksuwal at legal, ipinahahayag nito ang matinding paglapastangan o paglabag nang hindi isinasara ang mas malawak na saklaw ng pandiwang Hebreo sa isang tanging makabagong terminong legal.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: asawa ng kanyang kapwa
  rationale: Natural na salin ng construct chain at pinananatili ang panlipunan at tipanang diwa ng רֵעַ bilang “kapwa.”
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Sa gayon ay alisin ninyo ang kasamaan sa gitna ninyo
  rationale: Malinaw at dignified na salin ng paulit-ulit na pormulang legal sa Deuteronomio, nang hindi pilit na inililipat ang posibleng literal na larawang “sunugin.”
theological_decisions:
- issue: Dahilan ng hatol sa dalaga
  choice: sapagkat hindi siya sumigaw sa loob ng lunsod
  alternative: dahil hindi siya humingi ng saklolo sa lunsod
  rationale: Pinananatili ang eksaktong batayang sinasabi ng talata nang hindi nagdaragdag ng mas malawak na palagay o makabagong konklusyong etikal na wala sa mismong pangungusap.
- issue: Saklaw ng עִנָּה sa batas na seksuwal
  choice: nilapastangan
  alternative: hinalay; pinahiya; ginahasa
  rationale: Ang “nilapastangan” ay nagpapanatili ng bigat ng seksuwal na paglabag at kahihiyan, ngunit hindi labis na nililinaw ang tunay na leksikal na saklaw sa pamamagitan ng mas makitid na terminong “ginahasa.”
- issue: Pormulang pag-aalis ng kasamaan
  choice: alisin ninyo ang kasamaan sa gitna ninyo
  alternative: lipulin ninyo ang kasamaan mula sa gitna ninyo
  rationale: Ang “alisin” ay nagpapanatili sa kolektibo at panghukuman na pormula nang hindi ipinapalagay na ang abstraktong “kasamaan” mismo ay isang taong lilipulin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” bilang maramihang kausap ayon sa mga anyong pandiwa sa unang bahagi, at pinanatili ang maikli at solemne na himig ng batas. Ang bahagyang pag-uulit sa “batuhin … ng mga bato” ay sinadyang panatilihin dahil tahasan itong nasa Hebreo.
