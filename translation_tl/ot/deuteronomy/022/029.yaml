  to: Ang lalaking sumiping sa kanya ay magbibigay sa ama ng dalaga ng limampung siklo ng pilak. Magiging asawa niya ang dalaga dahil nilapastangan niya ang dalaga.[a] Hindi niya maaaring paalisin ang dalaga[b] sa buong buhay ng lalaki.
  rationale: Inalis ang hindi malinaw na panghalip sa huling sugnay sa pamamagitan ng tahasang pagtukoy sa buong buhay ng lalaki. Inayos din ang ayos ng pariralang pangtimbang na “limampung siklo ng pilak.” Pinanatili ang maingat na “nilapastangan” para sa עִנָּהּ, nang hindi labis na tinutukoy ang paraan ng paglabag, at pinanatili ang “paalisin” kasama ng paliwanag na pangmag-asawa sa talababa.
