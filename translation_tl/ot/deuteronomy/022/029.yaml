base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: tl
  text: Ang lalaking sumiping sa kanya ay magbibigay sa ama ng dalaga ng limampung siklo ng pilak. Magiging asawa niya ang dalaga dahil nilapastangan niya ang dalaga.[a] Hindi niya maaaring paalisin ang dalaga[b] sa buong buhay ng lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dahil ibinaba niya ang dangal nito.” Sa kontekstong ito, ang pandiwang Hebreo ay tumutukoy sa seksuwal na paglapastangan.
    reason: lexical_alternative
  - marker: b
    text: Ang “paalisin” dito ay tumutukoy sa pagtataboy o pakikipaghiwalay sa kanya bilang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Pagkatapos ... ay magbibigay
  rationale: Sa kontekstong legal, ipinagpapatuloy ng anyo ng pandiwa ang itinakdang kaparusahan. Likas sa Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod, samantalang ang “magbibigay” ay may puwersang nag-uutos sa ganitong pahayag ng batas.
- source_word: הָאִישׁ הַשֹּׁכֵב עִמָּהּ
  choice: ang lalaking sumiping sa kanya
  rationale: Ang pariralang participyal ay kumikilala sa lalaki ayon sa seksuwal na ginawa niya. Ang “sumiping” ay malinaw ngunit marangal at hindi labis na kolokyal.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: sa ama ng dalaga
  rationale: Ang נַעֲרָה ay tumutukoy sa isang batang babaeng nasa edad na maaaring mag-asawa. Ang “dalaga” ang pinakanatural na katumbas sa modernong Tagalog.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: limampung siklong pilak
  rationale: Literal na “limampung pilak” ang Hebreo, ngunit sa legal at pangkabuhayang kontekstong ito ay timbang na siklo ang ipinahihiwatig. Nililinaw ito ng “siklong pilak.”
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: Magiging asawa niya ang dalaga
  rationale: Ipinahahayag ng sugnay ang magiging kalagayan ng dalaga bilang asawa. Iniiwasan ng salin ang pananalitang maaaring magpahiwatig ng pagmamay-ari.
- source_word: תַּחַת אֲשֶׁר
  choice: dahil
  rationale: Sa pormulang legal na ito, ipinakikilala ng parirala ang dahilan ng itinakdang kahihinatnan.
- source_word: עִנָּהּ
  choice: nilapastangan niya ito
  rationale: Sa piel at sa seksuwal na kontekstong ito, ipinahihiwatig ng pandiwa ang mapanghamak at mapanirang pagtrato. Ang “nilapastangan” ay naghahatid ng bigat ng ginawa nang hindi tinutukoy nang higit sa mismong leksikal na anyo.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: Hindi niya ito maaaring paalisin
  rationale: Pinananatili ng “paalisin” ang konkretong larawan ng Hebreo; sa kontekstong pangmag-asawa, tumutukoy ito sa pagtataboy o paghihiwalay sa asawa, na nililinaw sa talababa.
- source_word: כָּל יָמָיו
  choice: habang siya ay nabubuhay
  rationale: Natural na Tagalog ito para sa Hebreong idyomang “lahat ng kanyang mga araw,” na nangangahulugang buong buhay ng lalaki.
theological_decisions:
- issue: Kung gaano katiyak na tutukuyin ang seksuwal na paglabag sa עִנָּהּ
  choice: nilapastangan niya ito
  alternative: hinalay niya ito; ibinaba niya ang dangal nito; ginahasa niya ito
  rationale: Malubha ang pandiwa at malinaw na seksuwal ang konteksto, ngunit hindi ginagamit sa sugnay na ito ang mas tahasang bokabularyo ng pamimilit. Pinananatili ng “nilapastangan” ang bigat at ang ilang leksikal na lawak ng salita; ang “ginahasa” ay maaaring maging mas tiyak kaysa sa pandiwang ito lamang, samantalang ang “ibinaba ang dangal” ay madaling magmukhang napakahina o nakatuon lamang sa panlipunang dangal.
- issue: Kahulugan ng pagpapaalis sa asawang babae
  choice: paalisin, na ipinaliliwanag bilang pagtataboy o pakikipaghiwalay
  alternative: hiwalayan; diborsiyuhin
  rationale: Ang literal na larawan ng Hebreo ay “papag-awayin/paalisin” o “palayain,” ngunit sa batas pangmag-asawa ang praktikal na diwa ay paghihiwalay o diborsiyo. Pinananatili sa teksto ang larawan at inilalagay sa talababa ang legal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “dalaga” at “sumiping” bilang likas ngunit hindi kolokyal na mga salita. Pinanatili ang legal na tono at ang tunay na lawak ng pandiwang ענה, habang nilinaw sa talababa ang seksuwal na konteksto at ang kahulugang pangmag-asawa ng “paalisin.”
