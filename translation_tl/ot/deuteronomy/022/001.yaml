  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: tl
  text: Kapag nakita mong napalayo ang baka o tupa ng kapatid mo, huwag mong balewalain ang mga ito; dapat mo talaga itong ibalik sa kapatid mo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: kapatid mo
  rationale: Pinananatili ang pampamilyang tawag ng Hebreo, na sa kontekstong ito ay tumutukoy sa kapuwa kasapi ng pamayanan.
- source_word: נִדָּחִים
  choice: naliligaw
  rationale: Ang anyong pasibo ay maaaring tumukoy sa mga hayop na napalayo o naligaw; ang 'naliligaw' ay likas sa Filipino at hindi labis na nagtatakda kung may nagtulak sa kanila.
- source_word: וְהִתְעַלַּמְתָּ
  choice: pabayaang ... at hindi pansinin
  rationale: Ipinahahayag ang sinasadyang pag-iwas o pagkukunwaring hindi nakita, hindi lamang simpleng hindi pagpansin.
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: Tiyakin mong maibalik ang mga iyon
  rationale: Ang infinitive absolute kasama ng pandiwa ay nagbibigay-diin sa tiyak na tungkuling isauli; ang 'maibalik' ay hindi nag-aakalang kailangang personal na ihatid sa bawat pagkakataon.
theological_decisions:
- issue: Saklaw ng 'kapatid'
  choice: Panatilihin ang 'kapatid mo' sa pangunahing teksto
  alternative: kapwa Israelita mo / kababayan mo
  rationale: Pinananatili nito ang konkretong wika ng tipan nang hindi agad nilulutas sa salin ang eksaktong hangganan ng tinutukoy na pamayanan.
- issue: Lakas ng utos sa pagpapanumbalik
  choice: Tiyakin mong maibalik
  alternative: Dapat mo talagang ibalik
  rationale: Kapuwa naipakikita ang diin ng Hebreong pag-uulit, ngunit iniiwasang ipahiwatig na ang nakakita lamang ang dapat pisikal na maghatid sa lahat ng kalagayan.
translation_notes:
  register: Makabagong, tuwiran, at marangal na Filipino. Ginamit ang isahang 'mo' alinsunod sa Hebreo at ang karaniwang mga katawagang 'baka' at 'tupa.'
