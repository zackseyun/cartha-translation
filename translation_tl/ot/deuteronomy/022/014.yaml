  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: tl
  text: at pararatangan niya siya ng mga mapanirang paratang at sisiraan ang kanyang pangalan, na sasabihin, “Pinakasalan ko ang babaeng ito, at nang sumiping ako sa kanya,[a] wala akong nakitang katibayan ng kanyang pagkadalaga.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nang lumapit ako sa kanya”; isang Hebreong eupemismo para sa pakikipagtalik.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “wala akong natagpuang pagkadalaga para sa kanya.” Sa konteksto, tumutukoy ito sa katibayan o mga palatandaan ng pagkadalaga na binabanggit sa mga kasunod na talata.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: pararatangan niya ang babae ng kahiya-hiyang mga bagay
  rationale: Ang parirala ay idyomatiko at tumutukoy sa mapanirang mga paratang. Hindi isinama sa pangunahing teksto ang “kasinungalingan” dahil bagaman iyon ang ipinahihiwatig ng konteksto, hindi ito tahasang nakasaad sa mismong parirala.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: sisiraan ang pangalan nito
  rationale: Pinananatili nito ang konkretong larawan ng Hebreong idyoma tungkol sa pagwasak sa reputasyon, habang natural sa makabagong Tagalog.
- source_word: אֶת הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: Pinakasalan ko ang babaeng ito
  rationale: Sa kontekstong pangmag-asawa, ang לקח ay nangangahulugang kumuha bilang asawa. Mas malinaw at natural ang “pinakasalan” kaysa sa literal na “kinuha,” habang pinananatili ng “babaeng ito” ang bahagyang mapaglayong pananalita ng nagsasalita.
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: nang sipingan ko siya
  rationale: Ang Hebreo ay isang mahinahong eupemismo para sa pakikipagtalik. Ang “sip-ingan” ay dignified at hindi labis na tahasan sa Tagalog.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: wala akong nakitang katibayan ng kanyang pagkadalaga
  rationale: Sa legal na konteksto at sa mga kasunod na talata, ang maramihang בְּתוּלִים ay tumutukoy sa katibayan o mga palatandaan ng pagiging birhen, hindi lamang sa abstraktong kalagayan.
