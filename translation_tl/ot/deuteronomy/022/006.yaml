translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “inahin” at “mga inakay” bilang natural na bokabularyo sa konteksto ng mga ibon. Ang mga talababa ay nagpapanatili sa diwa ng di-sinasadyang pagkakatagpo at sa literal na anyo ng huling idyoma.
