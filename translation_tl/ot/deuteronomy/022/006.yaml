revisions:
- from: Kung makakita ka sa daan ng pugad ng ibon[a], nasa alinmang puno man o nasa lupa, at may mga inakay o mga itlog, habang ang inahin ay nakaupo sa ibabaw ng mga inakay o mga itlog, huwag mong kunin ang inahin kasama ng mga inakay.[b]
  to: Kung may matagpuan kang pugad ng ibon sa iyong dinaraanan, nasa alinmang puno o nasa lupa, na may mga inakay o mga itlog, at ang inahin ay nakaupo sa ibabaw ng mga inakay o mga itlog, huwag mong kunin ang inahin kasama ng mga inakay.[a]
  rationale: Pinalitan ang unang sugnay upang maipahayag nang mas tumpak ang kaswal o di-sinasadyang pagkakatagpo na ipinahihiwatig ng Hebreo at upang maging gramatikal at likas ang Tagalog. Inilipat ang talababa para tumugma sa tekstong tinutukoy nito. Pinanatili ang ikalawang talababa bilang paliwanag sa literal at idyomatikong anyo ng pangwakas na parirala.
