    issue: Ang “Kung makakita ka sa daan ng pugad ng ibon” ay hindi likas na pagkakabuo at pinahihina ang diwang ‘happens to be encountered.’
    rationale: Ang יִקָּרֵא ay Niphal na nagpapahiwatig ng pagkakataong pagkakatagpo, hindi simpleng pagkakita. Ang “Kung may matagpuan kang ... sa iyong dinaraanan” ay kapwa mas natural at mas malapit sa pinagmulan.
  revised_text: Kung may matagpuan kang pugad ng ibon sa iyong dinaraanan, nasa alinmang puno o nasa lupa, na may mga inakay o mga itlog, at ang inahin ay nakaupo sa ibabaw ng mga inakay o mga itlog, huwag mong kunin ang inahin kasama ng mga inakay.[a]
