base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: tl
  text: Kung may matagpuan kang pugad ng ibon sa iyong dinaraanan, nasa alinmang puno o nasa lupa, na may mga inakay o mga itlog, at ang inahin ay nakaupo sa ibabaw ng mga inakay o mga itlog, huwag mong kunin ang inahin kasama ng mga inakay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung may matagpuan kang pugad ng ibon sa iyong dinaraanan.” Ipinahihiwatig ng pandiwang Hebreo na nagkataon lamang ang pagkakatagpo, hindi sadyang hinanap ang pugad.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא
  choice: Kung makakita ka
  rationale: Ipinakikilala nito ang isang kondisyong legal at isang di-sinasadyang pagkakatagpo. Natural sa modernong Tagalog ang “Kung makakita ka,” bagaman ang di-sinasadyang diwa ay higit na nililinaw sa talababa.
- source_word: קַן צִפּוֹר
  choice: pugad ng ibon
  rationale: Natural at tuwirang katumbas ng pariralang konstrukto sa Hebreo.
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: sa daan
  rationale: Sa konteksto, ang pugad ay natatagpuan sa dinaraanan ng tao. Hindi kailangang literal na ulitin ang “sa harap mo” upang maging malinaw at natural sa Tagalog.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: nasa alinmang puno man o nasa lupa
  rationale: Pinananatili ang dalawang posibleng kinaroroonan ng pugad; ang הָאָרֶץ ay konkretong “lupa” rito.
- source_word: אֶפְרֹחִים
  choice: mga inakay
  rationale: Karaniwang salitang Tagalog para sa mga batang ibon at hindi labis na nagtatakda ng espesipikong yugto ng paglaki.
- source_word: בֵיצִים
  choice: mga itlog
  rationale: Tuwiran at malinaw na salin.
- source_word: וְהָאֵם
  choice: ang inahin
  rationale: Sa konteksto ng ibon, malinaw at natural ang “inahin” para sa babaeng magulang.
- source_word: רֹבֶצֶת
  choice: nakaupo
  rationale: Natural na paglalarawan sa posisyon ng inahin sa ibabaw ng inakay o mga itlog, nang hindi ipinapalagay na tiyak na ito ay nangingitlog o naglilimlim.
- source_word: לֹא תִקַּח
  choice: huwag mong kunin
  rationale: Karaniwang anyo ng malinaw na pagbabawal sa modernong Tagalog.
- source_word: הָאֵם עַל הַבָּנִים
  choice: ang inahin kasama ng mga inakay
  rationale: Ang עַל sa idyomang ito ay nagpapahayag ng pagsamang pagkuha, hindi lamang ng pisikal na posisyong “sa ibabaw.” Sa konteksto, ang בָּנִים ay tumutukoy sa supling ng ibon.
