base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: tl
  text: Huwag magsuot ang babae ng gamit ng lalaki[a], ni magsuot ang lalaki ng kasuotan ng babae, sapagkat ang bawat gumagawa ng mga bagay na ito ay kasuklam-suklam kay Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kasuotan ng lalaki.” Mas malawak ang salitang Hebreo sa unang sugnay kaysa sa tiyak na salita para sa “kasuotan” sa ikalawang sugnay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: gamit ng lalaki
  rationale: Mas malawak ang כְלִי kaysa sa salitang tumutukoy mismo sa kasuotan sa ikalawang sugnay; maaaring tumukoy ito sa isang gamit, kagamitan, o bagay. Pinananatili ng “gamit” ang lawak at ang pagkakaiba ng dalawang salitang Hebreo nang hindi nililimitahan ang kahulugan sa damit lamang.
- source_word: עַל אִשָּׁה
  choice: isuot ng babae
  rationale: Sa kontekstong ito, ang literal na “mapasa ibabaw ng babae” ay natural na tumutukoy sa pagkakaroon ng isang bagay sa katawan. Ang “isuot” ay malinaw at likas sa modernong Tagalog.
- source_word: יִלְבַּשׁ
  choice: magsuot
  rationale: Ang pandiwa ay nangangahulugang magbihis o magsuot. Ang “magsuot” ay direkta at natural sa Tagalog.
- source_word: שִׂמְלַת אִשָּׁה
  choice: kasuotan ng babae
  rationale: Ang שִׂמְלָה ay partikular na tumutukoy sa damit o panlabas na kasuotan. Ang “kasuotan” ay marangal at sapat na malawak nang hindi tinutukoy ang isang partikular na uri ng damit.
- source_word: גֶּבֶר
  choice: lalaki
  rationale: Malinaw na ikinokontra rito ang lalaki sa babae; pinananatili ang tahasang pagkakaibang pangkasarian ng Hebreo.
- source_word: אִשָּׁה
  choice: babae
  rationale: Ito ang natural na katumbas sa Tagalog at malinaw na kaagapay ng “lalaki” sa talata.
- source_word: תוֹעֲבַת יְהוָה
  choice: kasuklam-suklam kay Yahweh
  rationale: Ang תוֹעֵבָה ay matinding salitang nagsasaad ng isang bagay na karima-rimarim o lubhang kasuklam-suklam sa Diyos. Pinananatili ng salin ang bigat nito at ang personal na pangalan na יהוה bilang “Yahweh.”
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: ang bawat gumagawa ng mga bagay na ito
  rationale: 'Ipinahahayag ng participial construction kasama ng כָּל ang isang pangkalahatan at distributibong pagtukoy: bawat taong gumagawa ng mga nabanggit.'
theological_decisions:
- issue: Saklaw ng unang pagbabawal (כְלִי גֶבֶר)
  choice: Isinalin nang malawak bilang “gamit ng lalaki,” hindi lamang “kasuotan ng lalaki.”
  alternative: “kasuotan ng lalaki” o mas tiyak na “sandata/kagamitan ng lalaki”
  rationale: Mas malawak ang unang pangngalang Hebreo kaysa sa tiyak na salita para sa kasuotan sa ikalawang sugnay. Pinananatili ng salin ang tunay na posibilidad na ang tinutukoy ay hindi lamang damit, nang hindi rin iginigiit na sandata o kagamitang militar ang kahulugan.
- issue: Tahasan at magkatapat na pagtukoy sa kasarian
  choice: Ginamit ang “babae” at “lalaki.”
  alternative: Mga salitang neutral sa kasarian gaya ng “tao” o “sinuman”
  rationale: Tahasan sa Hebreo ang pagkokontra ng babae at lalaki; ang neutralisasyon ay mag-aalis ng mahalagang bahagi ng pahayag.
- issue: Lakas ng תוֹעֵבָה
  choice: “kasuklam-suklam kay Yahweh”
  alternative: “hindi kalugod-lugod kay Yahweh” o “karima-rimarim kay Yahweh”
  rationale: Ang “kasuklam-suklam” ay natural sa Tagalog at nagpapanatili sa matinding bigat ng terminong Hebreo nang hindi nagdaragdag ng paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa publikong pagbasa. Ginamit ang “hindi dapat” upang likas na maipahayag ang dalawang pagbabawal, at pinanatili ang pagkakaiba ng “gamit” at “kasuotan.”
