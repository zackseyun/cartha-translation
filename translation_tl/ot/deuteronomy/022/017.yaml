base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: tl
  text: At narito[a], nagharap siya ng mga paratang laban sa aking anak, na sinasabi, ‘Hindi ko natagpuang birhen ang iyong anak.’ Ngunit ito ang mga katibayan ng pagkabirhen ng aking anak.[b] At ilalatag nila ang damit[c] sa harap ng mga nakatatanda ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “narito” ay isang panawag-pansing pananda na humihiling sa mga nakikinig na bigyang-pansin ang paratang.
    reason: discourse_note
  - marker: b
    text: Sa Hebreo, literal na “mga pagkabirhen ng aking anak”; sa legal na kontekstong ito, tumutukoy ito sa mga katibayan o palatandaang iniharap tungkol sa kanyang pagkabirhen.
    reason: lexical_alternative
  - marker: c
    text: Ang “damit” ay tumutukoy sa telang inilatag bilang katibayan sa kasong ito.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang pantawag-pansing lakas ng Hebreong panandang diskurso sa natural at marangal na Tagalog.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: pinaratangan niya ang aking anak ng mga mapanirang kasinungalingan
  rationale: Ipinahahayag ang pormal at mapanirang paratang na ipinahihiwatig ng idyoma; idinagdag ang “aking anak” mula sa malinaw na konteksto upang maging natural sa Tagalog.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: Hindi ko napatunayang birhen ang iyong anak
  rationale: Ang literal na “hindi ako nakatagpo ng mga pagkabirhen para sa iyong anak” ay idyomatikong paratang na hindi siya birhen. Ang “napatunayang” ay angkop sa legal na konteksto nang hindi tahasang itinatakda kung anong uri ng ebidensiya ang hinanap.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: Ngunit narito ang katibayan na birhen ang aking anak
  rationale: Ang pangmaramihang בְּתוּלִים ay ginagamit dito para sa katibayang kaugnay ng pagkabirhen. Ipinakikita ng “Ngunit” ang pagsalungat sa naunang paratang, at natural sa Tagalog ang kolektibong “katibayan.”
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: At ilalatag nila ang kasuutan
  rationale: Ang pandiwa ay nangangahulugang iladlad o ilatag, at ang שִׂמְלָה ay pangkalahatang katawagan sa kasuutan o telang isinusuot; hindi ito labis na tinutukoy bilang isang tiyak na uri ng tela.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: sa harap ng matatandang pinuno ng lungsod
  rationale: Nililinaw na ang “matatanda” ay mga kinikilalang pinuno at hukom ng pamayanan, hindi lamang mga taong may edad.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang madaling maunawaan ang tungkuling pampamahalaan at panghukuman ng mga זְקֵנִים. Pinanatili ang legal na himig at ang pangkalahatang katawagang “kasuutan” nang hindi nagdaragdag ng hindi tiyak na detalye tungkol sa tela.
