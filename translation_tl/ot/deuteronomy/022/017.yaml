revisions:
- from: At narito[a], pinaratangan niya ang aking anak ng mga mapanirang kasinungalingan. Sinabi niya, ‘Hindi ko napatunayang birhen ang iyong anak.’ Ngunit narito ang katibayan na birhen ang aking anak.[b] At ilalatag nila ang kasuutan[c] sa harap ng matatandang pinuno ng lungsod.
  to: At narito[a], nagharap siya ng mga paratang laban sa aking anak, na sinasabi, ‘Hindi ko natagpuang birhen ang iyong anak.’ Ngunit ito ang mga katibayan ng pagkabirhen ng aking anak.[b] At ilalatag nila ang damit[c] sa harap ng mga nakatatanda ng lungsod.
  rationale: Inalis ang pagsasabing kasinungalingan ang mga paratang upang huwag magdagdag ng pasya na wala sa talata. Pinalitan ang “napatunayang” ng “natagpuang” upang maipakita ang pandiwang Hebreo, at ibinalik ang tahasang panandang “na sinasabi” para sa לֵאמֹר. Pinili ang “mga nakatatanda ng lungsod” bilang tumpak at likas na katawagan para sa mga elder sa kontekstong panghukuman.
