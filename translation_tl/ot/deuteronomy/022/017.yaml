    rationale: Ang pandiwang מצא ay “makatagpo/makakita,” hindi “mapatunayan.” Bagaman legal ang konteksto, hindi dapat palitan ang pahayag ng asawang lalaki ng isang pormal na pamantayan ng patunay.
  - severity: low
