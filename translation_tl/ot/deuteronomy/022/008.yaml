  to: Kapag magtatayo ka ng bagong bahay, maglagay ka ng harang[a] sa palibot ng iyong bubong upang hindi ka managot sa pagkamatay kung may taong mahulog mula sa bubong.
  rationale: Inayos ang anyo ng pangkalahatang kautusan, ginawang malinaw na tao ang posibleng mahulog, at pinalitan ang di-likas na parirala tungkol sa pananagutan ng isang natural na pananalitang legal. Nilinaw rin ang referent ng “mula rito” bilang bubong, alinsunod sa pinakamalapit na antecedent at sa praktikal na sitwasyon ng kautusan. Pinanatili ang “harang” at ang talababa upang maipaliwanag ang tiyak na anyo ng מַעֲקֶה.
