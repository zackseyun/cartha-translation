    rationale: Ang participial na הַנֹּפֵל ay isang taong posibleng mahulog, hindi isang bagay. Ang “may taong mahulog” ay nagpapanatili ng tinutukoy na tao.
  - severity: medium
    issue: Di-likas ang “magdala ng pananagutan sa pagkamatay sa iyong bahay.”
    rationale: Hindi malinaw sa Filipino kung ang pananagutan ay nasa bahay, nangyayari sa bahay, o ipinapasan ng nagsasalita. Ang mas tuwirang legal na pananalita ay “managot sa pagkamatay.”
  - severity: low
    issue: Sobrang malabo ang “mula roon.”
    rationale: Bagaman may panghalip din sa Hebreo, ang pinakamalapit at likas na antecedent ay ang bubong; ligtas na linawin ito sa Filipino.
