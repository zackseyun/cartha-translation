base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: tl
  text: Kapag magtatayo ka ng bagong bahay, maglagay ka ng harang[a] sa palibot ng iyong bubong upang hindi ka managot sa pagkamatay kung may taong mahulog mula sa bubong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, isang mababang pader o rehas na pananggalang sa palibot ng patag na bubong.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Nagsisimula ito ng isang sitwasyon sa batas, hindi ng paliwanag na sanhi; likas sa Filipino ang “kapag” para sa ganitong pangkalahatang kaso.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: nagtayo ka ng bagong bahay
  rationale: Tuwirang ipinapahayag ang kongkretong sitwasyon ng pagtatayo ng isang bagong bahay.
- source_word: וְעָשִׂיתָ
  choice: lagyan mo
  rationale: Ipinahahayag ng anyong pandiwa ang utos sa kontekstong legal; natural sa Filipino ang pautos na “lagyan mo.”
- source_word: מַעֲקֶה
  choice: harang
  rationale: Tumutukoy ito sa pananggalang sa gilid ng patag na bubong. Karaniwan at madaling maunawaan ang “harang,” habang nililinaw sa talababa ang tiyak na gamit nito.
- source_word: לְגַגֶּךָ
  choice: ang bubong mo
  rationale: Ang bubong ang lugar na lalagyan ng pananggalang; natural na ipinapahayag ito bilang layon ng “lagyan.”
- source_word: וְלֹא תָשִׂים דָּמִים
  choice: upang hindi ka magdala ng pananagutan sa pagkamatay
  rationale: Ang idyomang Hebreo na literal na “maglagay ng mga dugo” ay tumutukoy sa legal at moral na pananagutan sa kamatayan; iniiwasan ng salin ang hindi likas na literalismo.
- source_word: בְּבֵיתֶךָ
  choice: sa iyong bahay
  rationale: Pinananatili ang imahen na ang pananagutan ay napapataw kaugnay ng bahay na saklaw ng responsibilidad ng may-ari.
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: kung may mahulog
  rationale: Ang ekspresyong Hebreo ay tumutukoy sa sinumang maaaring mahulog; malinaw at natural ang di-tiyak na “may” sa Filipino.
- source_word: מִמֶּנּוּ
  choice: mula roon
  rationale: Tumutukoy ito sa bubong o sa bahagi ng bahay na nabanggit; pinananatili ng “mula roon” ang kaunting kalabuan ng panghalip sa Hebreo.
theological_decisions:
- issue: Kahulugan ng דָּמִים sa kontekstong legal
  choice: pananagutan sa pagkamatay
  alternative: pagkakasala dahil sa dugo; pananagutan sa pagbububo ng dugo
  rationale: Ang talata ay tungkol sa pananagutan sa isang maiiwasang pagkamatay, hindi lamang sa pisikal na pagdanak ng dugo. Malinaw sa modernong Filipino ang piniling parirala nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “harang” sa halip na teknikal na “parapeto,” at ipinaliwanag sa talababa ang anyo at layunin nito. Pinanatili ang legal na bigat ng talata sa pariralang “pananagutan sa pagkamatay.”
