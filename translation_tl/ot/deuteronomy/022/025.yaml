    reason: lexical_alternative
  revision_rationale: 'Inayos ang katayuang “betrothed” upang mas malinaw na tumukoy sa nakatakda nang ikasal, at pinalitan ang hindi natural na “sipingan” ng karaniwang idyomang “sumiping sa kanya.” Napanatili ang pag-iingat ng pinagmulan: “dakmain” ang nasa pangunahing teksto, habang ang sapilitang katangian ng pangyayari ay ipinaliliwanag sa talababa.'
