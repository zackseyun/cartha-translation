base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: tl
  text: Ngunit kung matagpuan ng lalaki sa bukid ang dalagang nakatakda nang ikasal, at dakmain siya ng lalaki at sumiping sa kanya, ang lalaking sumiping sa kanya lamang ang papatayin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyong kasalungat ng naunang kasong legal.
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Tuwirang tumutukoy sa bukas na lugar sa labas; natural ito sa modernong Tagalog at pinananatili ang mahalagang tagpuan ng kaso.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: ang dalagang nakatakdang pakasalan
  rationale: Ipinahahayag ang isang kabataang babae na may umiiral nang pangakong pakasal, nang hindi ito ipinapantay sa mas maluwag na modernong konsepto ng engagement.
- source_word: וְהֶחֱזִיק בָּהּ
  choice: at dakmain niya ito
  rationale: Ang 'dakmain' ay naghahatid ng marahas at sapilitang paghawak na ipinahihiwatig ng Hiphil ng חזק, ngunit hindi nito pinapalitan ang mismong kilos ng isang mas interpretibong terminong seksuwal.
- source_word: וְשָׁכַב עִמָּהּ
  choice: at sipingan
  rationale: Ang 'sip ingan' ay marangal at malinaw na katumbas ng karaniwang Hebreong idyoma para sa pakikipagtalik.
- source_word: וּמֵת ... לְבַדּוֹ
  choice: ang lalaki ... lamang ang papatayin
  rationale: 'Malinaw na ipinahahayag ang hatol na kamatayan at ang pagiging eksklusibo nito: ang lalaki, hindi ang babae, ang tatanggap ng parusa.'
theological_decisions:
- issue: Kung tahasang tatawaging panggagahasa ang kilos sa pangunahing teksto
  choice: Panatilihin ang leksikal na kilos na 'dakmain' at ipaliwanag sa talababa na sapilitan ang pangyayari.
  alternative: Gahasain o pilitin siyang makipagtalik
  rationale: Malinaw sa kontekstong legal na walang pagsang-ayon ang babae, ngunit ang mismong pandiwang חזק ay nangangahulugang humawak nang mahigpit, dumakma, o manaig, hindi isang natatanging pandiwa para sa panggagahasa. Sa ganitong paraan, kapuwa napapanatili ang anyo ng pinagmulan at ang kahulugang sapilitan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang bokabularyong angkop sa batas nang hindi nagiging lipas o labis na teknikal. Ang 'sip ingan' sa rationale ay tumutukoy sa salitang 'sipingan' sa teksto.
