base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: tl
  text: Kung may lalaking makatagpo ng isang dalagang birhen na hindi pa naipagtipan[a], at sunggaban niya ito[b] at sipingan niya ito, at matuklasan silang dalawa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na hindi pa nakatakdang ikasal.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay maaaring mangahulugang “sunggaban,” “dakmain,” o “hawakan nang mahigpit.” Nauunawaan ito ng ilan bilang pahiwatig ng panggagahasa; para naman sa iba, kailangang matukoy ang legal na diwa mula sa mas malawak na konteksto at hindi sa pandiwang ito lamang.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagbubukas ito ng isang kondisyunal na kaso sa batas; natural at malinaw sa makabagong Filipino ang “Kung.”
- source_word: יִמְצָא
  choice: makatagpo
  rationale: Tuwirang ipinapahayag ang diwa ng “makasumpong/makatagpo” nang hindi ipinahihiwatig na sinadya niyang hanapin ang babae.
- source_word: אִישׁ
  choice: may lalaking
  rationale: Pinananatili ang tiyak na kasariang panlalaki at ang di-tiyak na isang taong tinutukoy sa kasong legal.
- source_word: נער בְתוּלָה
  choice: isang dalagang birhen
  rationale: Pinananatili ang dalawang sangkap ng Hebreo—kabataan at pagiging birhen—sa maikli, marangal, at karaniwang pananalita.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: na hindi pa nakatakdang ikasal
  rationale: Madaling maunawaan sa modernong Filipino at tumutukoy sa babaeng hindi pa pormal na naipagkasundo sa mapapangasawa; nililinaw sa talababa ang mas tiyak na legal na diwa.
- source_word: וּתְפָשָׂהּ
  choice: at sunggaban niya ito
  rationale: Ang “sunggaban” ay nagpapanatili sa pisikal at malakas na diwa ng pagdakma o paghawak, nang hindi ginagawang isang mas makitid na terminong legal ang mismong pandiwa.
- source_word: וְשָׁכַב עִמָּהּ
  choice: at sipingan
  rationale: Ang “sipingan” ay isang malinaw at marangal na idyomang Filipino para sa pakikipagtalik at malapit sa anyo ng Hebreong “humiga kasama niya.”
- source_word: וְנִמְצָאוּ
  choice: at mahuli sila
  rationale: Natural nitong ipinapahayag na kapwa sila natuklasan o nabisto, at pinananatili ang maramihan at di-tiyak kung paano sila nahuli.
theological_decisions:
- issue: Kung tahasang isasalin bilang “gahasain” ang pinagsamang kilos
  choice: Panatilihin ang magkahiwalay na pananalitang “sunggaban niya ito at sipingan.”
  alternative: “gahasain niya” o ang mas mahinang “hawakan/dalhin niya at sipingan”
  rationale: May pagtatalo tungkol sa legal na kaugnayan ng talatang ito sa mga kalapit na batas at sa eksaktong puwersa ng תפשׂ. Ipinakikita ng “sunggaban” ang pisikal na lakas na nasa pandiwa, ngunit hindi nito tahimik na pinapalitan ang dalawang sugnay ng isang mas tiyak na legal na katawagan. Sa gayon, napapanatili ang tunay na tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dalagang birhen” upang mapanatili ang kabataan at pagiging birhen, “sunggaban” upang huwag palambutin ang pisikal na kilos, at “sipingan” bilang dignified na idyomang biblikal. Inilagay ang mga pananda ng talababa sa mismong mga pariralang kanilang nililinaw.
