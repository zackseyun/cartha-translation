base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: tl
  text: Huwag kang kumain ng tinapay na may lebadura kasama nito. Sa loob ng pitong araw, kakain ka kasama nito ng tinapay na walang lebadura[a], ang tinapay ng paghihirap, sapagkat nagmadali kang lumabas mula sa lupain ng Ehipto, upang maalala mo ang araw ng paglabas mo mula sa lupain ng Ehipto sa lahat ng araw ng iyong buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain ang “tinapay ng paghihirap” bilang “tinapay ng karalitaan” o “tinapay ng pagdurusa.” Maaaring idiin ng pariralang Hebreo ang paghihirap, kakapusan, o pagdurusang kaugnay ng paglabas mula sa Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: kasama nito
  rationale: Sa konteksto ng handog na Paskuwa, ang parirala ay tumutukoy sa pagkaing isinasabay sa handog. Likas sa Tagalog ang “kasama nito” at hindi nito ipinahihiwatig ang literal na paglalagay sa ibabaw.
- source_word: חָמֵץ
  choice: tinapay na may pampaalsa
  rationale: Sa konteksto ng pagkain, tinapay na pinaalsa ang ipinagbabawal, hindi lamang ang sangkap na pampalsa. Malinaw ito sa karaniwang mambabasa.
- source_word: מַצּוֹת
  choice: tinapay na walang pampaalsa
  rationale: Direkta at madaling maunawaang salin ito ng pagkaing walang lebadura o pampaalsa, nang hindi gumagamit ng transliterasyong banyaga.
- source_word: לֶחֶם עֹנִי
  choice: tinapay ng paghihirap
  rationale: Pinananatili ng “paghihirap” ang malawak na diwa ng עֹנִי—pagdurusa, kasalatan, o kaapihan—nang hindi ito nililimitahan sa kahirapang pangkabuhayan.
- source_word: בְחִפָּזוֹן
  choice: nagmamadali
  rationale: Ipinahahayag nito ang apurahang pag-alis mula sa Ehipto nang hindi nagdaragdag ng ideya ng takot o pagtakas na hindi tahasang sinasabi rito.
- source_word: לְמַעַן תִּזְכֹּר
  choice: upang maalala mo
  rationale: Pinananatili nito ang layuning ipinahahayag ng לְמַעַן at natural ang ayos sa modernong Tagalog.
- source_word: יֹום צֵאתְךָ
  choice: ang araw ng pag-alis mo
  rationale: Malinaw nitong pinananatili ang nominal na anyo ng Hebreo at ang paggunita sa mismong paglabas mula sa Ehipto.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: sa lahat ng araw ng iyong buhay
  rationale: Pinananatili ang distributibong diin ng Hebreo sa patuloy na pag-alaala habang nabubuhay.
theological_decisions:
- issue: Kahulugan ng לֶחֶם עֹנִי bilang alaala ng Exodo
  choice: tinapay ng paghihirap
  alternative: tinapay ng karalitaan; tinapay ng pagdurusa
  rationale: Hindi nilulutas nang makitid ang saklaw ng parirala. Naipahihiwatig nito kapwa ang pagdurusa at kakapusan na kaugnay ng pagkaalipin at apurahang pag-alis.
- issue: Hindi tahasang layon ng panghalip sa עָלָיו sa mismong talata
  choice: kasama nito
  alternative: kasama ng handog na Paskuwa
  rationale: Pinananatili ang panghalip ng Hebreo at ang ugnayan nito sa naunang konteksto, sa halip na ipalit sa teksto ang ipinahihiwatig na handog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pang-isahang “ka/mo” ayon sa Hebreong ikalawang panauhang panlalaki na isahan. Ang “Gawin mo ito” ay nilinaw bilang likas na Tagalog na ugnayang layunin, na tumutukoy sa naunang ritwal na pagkain at hindi nagdaragdag ng bagong utos.
