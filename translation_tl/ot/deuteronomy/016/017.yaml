  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: tl
  text: Bawat lalaki ay magbigay ayon sa kaya niyang ibigay[a], ayon sa pagpapalang ibinigay sa kaniya ni Yahweh na kaniyang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ayon sa kaloob ng kaniyang kamay,” isang idyomang tumutukoy sa kung ano ang kaya o mayroon siyang maibigay.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Bawat lalaki
  rationale: 'Ang pangngalang isahan ay distributibo rito: bawat lalaking kabilang sa mga inuutusang humarap at magbigay.'
- source_word: כְּמַתְּנַת יָדוֹ
  choice: ayon sa kaya ng kaniyang kamay
  rationale: Pinananatili ang larawan ng Hebreong “kamay” habang ipinahihiwatig ng “kaya” na ang handog ay ayon sa maaaring maibigay ng bawat isa.
- source_word: כְּבִרְכַּת
  choice: ayon sa pagpapala
  rationale: Ang כְּ ay nagpapahayag ng sukat o proporsiyon, at ang בִּרְכַּת ay tumutukoy sa pagpapalang ipinagkaloob ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Likas na Tagalog para sa pang-isahang covenantal na pariralang “your God.”
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: na ibinigay sa iyo
  rationale: Ang sugnay ay tumutukoy sa pagpapalang ibinigay ni Yahweh; sapat sa Tagalog ang aspektong kontemplatibo upang ipahayag ang natapos na pagkakaloob.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang personal na banal na pangalan, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang panlalaking katawagan ng אִישׁ at ang larawan ng “kamay,” ngunit nilinaw ang idyomatikong diwa sa pangunahing teksto at talababa.
