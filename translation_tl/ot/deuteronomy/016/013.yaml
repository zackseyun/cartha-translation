  source_fidelity: 'Ang pangunahing diwa ay tapat: iniutos ang pagdiriwang ng Pista ng mga Kubol nang pitong araw kaugnay ng pagtitipon mula sa giikan at pisaan. Gayunman, ang “kapag natipon mo na” ay naglalahad ng natapos nang pagtitipon, samantalang ang בְּאָסְפְּךָ ay mas ligtas na isalin bilang panahong nagtitipon ang kausap. Ang pagdaragdag ng “ani” ay isang katanggap-tanggap na pagpapalinaw ng ipinahihiwatig na bagay ng pagtitipon.'
  naturalness: Natural, malinaw, at angkop sa modernong Filipino ang “Ipagdiwang mo,” “Pista ng mga Kubol,” “giikan,” at “pisaan ng ubas.” Mas natural at mas malapit sa aspektong Hebreo ang “kapag tinitipon mo ang ani” kaysa “kapag natipon mo na ang ani.”
