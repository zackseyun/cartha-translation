translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kubol” upang panatilihin ang literal na larawan ng pansamantalang silungan, at ang tradisyonal na alternatibong “mga Tolda” ay inilagay sa talababa. Isahan ang mga panghalip dahil isahan ang mga anyong Hebreo sa talata.
