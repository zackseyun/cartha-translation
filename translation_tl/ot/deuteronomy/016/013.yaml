  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: tl
  text: Ipagdiwang mo ang Pista ng mga Kubol sa loob ng pitong araw[a], kapag tinitipon mo ang ani mula sa iyong giikan at pisaan ng ubas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatawag din itong “Pista ng mga Tolda.” Ang salitang Hebreo ay literal na tumutukoy sa mga kubol o pansamantalang silungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: Pista ng mga Kubol
  rationale: Ang חַג ay isang pistang panrelihiyon, at ang סֻכּוֹת ay mga kubol o pansamantalang silungan. Likas at malinaw sa modernong Filipino ang “Pista ng mga Kubol,” habang pinananatili ang konkretong larawan ng Hebreo.
- source_word: תַּעֲשֶׂה לְךָ
  choice: Ipagdiwang mo
  rationale: Bagaman literal na “gawin mo para sa iyo,” ang עשה kasama ng חַג ay idyomang tumutukoy sa pagdiriwang o pagtupad sa isang pista. Pinananatili ng pautos na anyo ang personal na obligasyon.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural na Filipino para sa tagal na tinutukoy ng Hebreo.
- source_word: בְּאָסְפְּךָ
  choice: kapag natipon mo na ang ani
  rationale: Ang ב na sinusundan ng infinitive construct ng אסף ay temporal. Ipinahihiwatig ng konteksto ang pagtitipon ng ani; ang “kapag ... na” ay natural na nagpapakita ng panahong kaugnay ng natapos na pag-aani, nang hindi ito ginagawang tahasang “pagkatapos.”
- source_word: מִגָּרְנְךָ
  choice: mula sa iyong giikan
  rationale: Ang גֹּרֶן ay giikan o threshing floor. Pinananatili ang konkretong lugar na kaugnay ng pagproseso ng butil.
- source_word: וּמִיִּקְבֶךָ
  choice: at pisaan ng ubas
  rationale: Ang יֶקֶב ay pisaan o sisidlang kaugnay ng paggawa ng alak mula sa ubas. Ang “pisaan ng ubas” ay malinaw sa ordinaryong mambabasa at hindi nangangailangan ng teknikal na bokabularyo.
