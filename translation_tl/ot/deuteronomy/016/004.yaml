  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: tl
  text: Sa loob ng pitong araw, walang pampaalsa na dapat makita sa buong nasasakupan mo. At walang anumang laman[a] na ihahandog mo sa gabi ng unang araw[b] ang dapat matira magdamag hanggang kinaumagahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “karne.” Ang salitang Hebreo ay literal na “laman,” isang karaniwang katawagan sa konteksto ng paghahandog.
    reason: lexical_alternative
  - marker: b
    text: Ang “unang araw” ay maaaring partikular na tumukoy sa handog sa Paskuwa sa pasimula ng kapistahan, bagaman hindi tahasang sinasabi rito ng Hebreo na “kordero ng Paskuwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: dapat makita
  rationale: Ang Niphal ng ראה ay pasibo. Pinananatili ng “dapat makita” ang bisa ng pagbabawal sa natural na Filipino.
- source_word: שְׂאֹר
  choice: pampaalsa
  rationale: Tumutukoy ito sa sangkap na nagpapaalsa sa masa. Mas angkop ang “pampaalsa” kaysa sa mas makitid na “lebadura” sa konteksto ng kautusan tungkol sa Paskuwa.
- source_word: בְּכָל גְּבֻלְךָ
  choice: sa buong nasasakupan mo
  rationale: Maaaring mangahulugan ang גְּבוּל ng hangganan o teritoryo; malinaw na ipinahahayag ng “buong nasasakupan” ang saklaw ng pagbabawal.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural na Filipino para sa tagal na tinutukoy ng pariralang Hebreo.
- source_word: יָלִין
  choice: matira magdamag
  rationale: Mula sa לין, ipinahahayag nito ang pagbabawal na iwan ang laman sa buong magdamag hanggang umaga.
- source_word: מִן הַבָּשָׂר
  choice: walang anumang laman
  rationale: Ang בָּשָׂר ay literal na “laman” at karaniwang katawagan din sa karne ng handog. Napananatili ng “laman” ang panrelihiyong konteksto at ang partitive na diwa ng מִן.
- source_word: אֲשֶׁר תִּזְבַּח
  choice: na ihahandog mo
  rationale: Sa kontekstong ritwal, ang זבח ay pagpatay o paghahain bilang handog. Malinaw na naipahahayag ng “ihahandog” ang layuning pansakripisyo nang hindi nagdaragdag ng uri ng hayop.
- source_word: בָּעֶרֶב
  choice: sa gabi
  rationale: Direkta at natural na katumbas ng panandang panahong Hebreo.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: ng unang araw
  rationale: “Unang araw” lamang ang tahasang sinasabi ng Hebreo; hindi idinagdag sa pangunahing teksto ang “ng kapistahan.”
- source_word: לַבֹּקֶר
  choice: hanggang kinaumagahan
  rationale: Sa pagbabawal na ito, ang parirala ay nagsasaad ng huling hangganan ng panahon.
theological_decisions:
- issue: Ang tinutukoy ng “laman” na inihahandog sa “unang araw”
  choice: Panatilihin sa pangunahing teksto ang pangkalahatang katawagang “laman” ng handog at huwag tukuyin bilang “kordero ng Paskuwa.”
  alternative: Unawain ito bilang partikular na handog sa Paskuwa, o mas malawak na bilang mga handog na kaugnay ng pasimula ng kapistahan.
  rationale: “Laman na ihahandog mo sa gabi ng unang araw” lamang ang sinasabi ng Hebreo. Dahil hindi nito tahasang pinangalanan ang hayop o nililimitahan ang saklaw, pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “pampaalsa,” “nasasakupan,” at “ihahandog” upang maging malinaw ang ritwal at teritoryal na konteksto nang hindi nagiging teknikal o denominasyonal.
