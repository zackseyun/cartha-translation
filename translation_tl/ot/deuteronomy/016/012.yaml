  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: tl
  text: Alalahanin mo na alipin ka noon sa Ehipto[a], at sundin at tuparin mo ang mga tuntuning ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod.” Ang salitang Hebreo ay maaaring tumukoy sa isang lingkod o alipin, ngunit dito ay binibigyang-diin ang pagkaalipin ng Israel sa Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Alalahanin mo
  rationale: Ang pandiwang may pang-ugnay ay may puwersa ng utos sa kontekstong ito. Likas at tuwiran sa makabagong Filipino ang “Alalahanin mo.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng dapat alalahanin, kaya “na” ang likas na katumbas sa Filipino.
- source_word: עֶבֶד
  choice: alipin
  rationale: Maaaring tumukoy ang salitang Hebreo sa lingkod o alipin, ngunit sa konteksto ng sapilitang pagkaalipin ng Israel sa Ehipto, mas angkop ang “alipin.”
- source_word: הָיִיתָ
  choice: ka noon
  rationale: Ipinahahayag nito ang dating kalagayan ng kausap. Idinagdag ang “noon” upang maging malinaw at natural sa Filipino ang nakaraang panahon.
- source_word: בְּמִצְרָיִם
  choice: sa Ehipto
  rationale: Tuwiran at karaniwang salin ng pariralang tumutukoy sa lugar.
- source_word: וְשָׁמַרְתָּ
  choice: ingatan
  rationale: Sa kontekstong tipan at kautusan, ang pandiwa ay nangangahulugang maingat na sundin o tuparin. Pinananatili ng “ingatan” ang natatanging diwa nito bago ang kasunod na pandiwang “tuparin.”
- source_word: וְעָשִׂיתָ
  choice: tuparin
  rationale: Binibigyang-diin nito ang aktuwal na pagsasagawa. Mas natural sa Filipino ang “tuparin” kaysa literal na “gawin” kapag mga tuntunin ang layon.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Tumutukoy ito sa mga itinakdang alituntunin o batas. Ang “mga tuntunin” ay malinaw, dignificado, at madaling maunawaan.
- source_word: הָאֵלֶּה
  choice: ito
  rationale: Tuwirang demonstratibo na tumutukoy sa mga tuntuning kasalukuyang ipinag-uutos.
theological_decisions:
- issue: Pagpapakahulugan sa עֶבֶד kaugnay ng kalagayan ng Israel sa Ehipto
  choice: alipin
  alternative: lingkod
  rationale: Bagaman saklaw ng עֶבֶד ang “lingkod” at “alipin,” ang alaala rito ay tungkol sa sapilitan at mapaniil na pagkaalipin ng Israel sa Ehipto. Kaya mas tumpak sa konteksto ang “alipin,” habang binabanggit sa talababa ang posibleng mas malawak na kahulugan.
translation_notes:
  register: Makabagong Filipino na natural at marangal ang ginamit. Napanatili ang magkatambal na diwa ng maingat na pagsunod at aktuwal na pagtupad sa “ingatan at tuparin,” nang hindi pinapantay ang dalawang pandiwang Hebreo.
