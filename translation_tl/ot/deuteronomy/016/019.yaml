  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: tl
  text: Huwag mong baluktutin ang katarungan. Huwag kang magpakita ng pagkiling[a], at huwag kang tumanggap ng suhol, sapagkat binubulag ng suhol ang mga mata ng marurunong at binabaluktot nito ang mga salita ng mga matuwid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kilalanin ang mga mukha,” isang idyoma na nangangahulugang magpakita ng pagkiling o pagtatangi.
    reason: lexical_alternative
  - marker: b
    text: O “binabaluktot ang usapin ng mga nasa tama.” Ang Hebreo ay maaaring tumukoy sa kanilang mga salita o, sa kontekstong legal, sa kanilang usapin sa hukuman.
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: baluktutin ang katarungan
  rationale: Ang Hiphil ng נטה kasama ng מִשְׁפָּט ay tumutukoy sa paglihis o pagbaluktot sa wastong paghatol. Ang pariralang ito ay natural sa Filipino at pinananatili ang legal at moral na bigat ng Hebreo.
- source_word: תַכִּיר פָּנִים
  choice: magtangi ng tao
  rationale: Literal itong 'kilalanin ang mga mukha,' ngunit isang idyomang Hebreo para sa pagkiling o pagtatangi sa paghatol. Malinaw at natural sa modernong Filipino ang 'magtangi ng tao.'
- source_word: שֹׁחַד
  choice: suhol
  rationale: Sa kontekstong legal, tumutukoy ito sa bayad o handog na ginagamit upang impluwensiyahan nang tiwali ang paghatol. Tumpak at karaniwan ang 'suhol.'
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: binubulag ang mga mata ng marurunong
  rationale: Pinananatili nito ang malinaw at matinding metapora ng Hebreo, pati ang sanhi at bunga ng suhol.
- source_word: חֲכָמִים
  choice: mga marurunong
  rationale: Ang panlalaking maramihan sa Hebreo ay pangkalahatan ang saklaw rito at hindi kinakailangang tumukoy lamang sa mga lalaki.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: binabaluktot ang mga salita ng mga matuwid
  rationale: Ang סלף ay 'baluktutin' o 'pilipitin,' at ang דִּבְרֵי ay pangunahing 'mga salita' ngunit maaari ring tumukoy sa usapin o panig sa isang kasong legal. Pinananatili sa pangunahing teksto ang mas tuwirang kahulugan at inilalahad sa talababa ang legal na posibilidad.
- source_word: צַדִּיקִם
  choice: mga matuwid
  rationale: Maaari itong tumukoy sa mga taong matuwid o sa mga nasa tama ayon sa batas. Ang 'mga matuwid' ay malawak at malapit sa Hebreo nang hindi ito nililimitahan sa 'mga inosente.'
theological_decisions:
- issue: Saklaw ng דִּבְרֵי צַדִּיקִם
  choice: mga salita ng mga matuwid
  alternative: usapin ng mga nasa tama
  rationale: May tunay na kalabuan kung ang parirala ay tumutukoy sa mismong mga salita/pahayag ng mga matuwid o sa kanilang usapin sa hukuman. Pinanatili ang mas literal na pagbasa sa teksto at ang legal na pagbasa sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang ikalawang panauhang isahan ng mga utos sa pamamagitan ng “mong/kang,” ang matinding larawang “binubulag ang mga mata,” at ang legal na himig ng talata. Inilagay ang mga panandang [a] at [b] sa mismong pariralang tinutukoy ng bawat talababa.
