base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: tl
  text: Pagkatapos, ipagdiwang mo para kay Yahweh na iyong Diyos ang Pista ng mga Linggo sa pamamagitan ng kusang-loob na handog mula sa iyong kamay, na ibibigay mo ayon sa pagpapalang ibinigay sa iyo ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Pagkatapos, ipagdiwang mo
  rationale: Sa konteksto ng isang pista, ang עשה ay nangangahulugang ipagdiwang o ganapin, hindi literal na “gumawa.” Ipinahihiwatig ng “Pagkatapos” ang pagkakasunod sa naunang tagubilin.
- source_word: חַג שָׁבֻעוֹת
  choice: ang Pista ng mga Linggo
  rationale: Pinananatili nito ang pangalan ng kapistahan at ang pangmaramihang שָׁבֻעוֹת, na tumutukoy sa mga linggong binibilang bago ang pista.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para kay Yahweh na iyong Diyos
  rationale: Ipinapakita ng ל ang pagtatalaga ng pagdiriwang kay Yahweh; ang banal na pangalang יהוה ay isinaling “Yahweh.”
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: kalakip ang kusang-loob na handog mula sa iyong kamay
  rationale: Ang נִדְבָה ay isang handog na kusang ibinibigay, at pinananatili ng “mula sa iyong kamay” ang kongkretong idyomang Hebreo tungkol sa personal na pagbibigay. Dahil hindi tiyak kung ang מִסַּת ay tumutukoy sa ambag o sa sukat nito, inilagay sa talababa ang alternatibong pagbasa.
- source_word: אֲשֶׁר תִּתֵּן
  choice: na ibibigay mo
  rationale: Tuwirang kamag-anak na sugnay ito na tumutukoy sa handog, at ang anyong panghinaharap ay angkop sa legal na tagubilin.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: ayon sa pagpapala sa iyo
  rationale: Ipinahahayag nito na ang ibibigay ay magiging katumbas o naaayon sa pagpapalang ipinagkaloob ng Diyos, nang hindi nagtatakda ng tiyak na halaga.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan sa tekstong Hebreo ang pangalang tipan na יהוה. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Batayan at kalikasan ng handog
  choice: Kusang-loob ang handog, ngunit ang halaga nito ay naaayon sa pagpapala ng Diyos
  alternative: Isang takdang sapilitang halaga o buwis
  rationale: Ang נִדְבָה ay malinaw na nagpapahiwatig ng kusang pagbibigay, samantalang ang כַּאֲשֶׁר יְבָרֶכְךָ ay nag-uugnay sa handog sa natanggap na pagpapala. Hindi dapat gawing tiyak na buwis ang hindi tiyak na מִסַּת.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang kinikilalang pangalang “Pista ng mga Linggo,” ang banal na pangalang “Yahweh,” at ang Hebreong larawan ng handog na nagmumula sa kamay ng nagbibigay, habang ipinaliwanag sa talababa ang tunay na leksikal na kalabuan ng מִסַּת.
