  to: Pagkatapos, ipagdiwang mo para kay Yahweh na iyong Diyos ang Pista ng mga Linggo sa pamamagitan ng kusang-loob na handog mula sa iyong kamay, na ibibigay mo ayon sa pagpapalang ibinigay sa iyo ni Yahweh na iyong Diyos.
  rationale: Inayos ang pangungusap upang ang kusang-loob na handog ay tahasang mailarawang ibinibigay ayon sa natanggap na pagpapala, na siyang praktikal na pagpapahayag ng proporsiyonal na diwa ng מִסַּת. Inalis ang talababa dahil ang ipinapalagay nitong malawak na leksikal na kawalan ng katiyakan ay hindi kinakailangan at ang kahulugan ay malinaw na sa rebisyong teksto.
