base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: tl
  text: Huwag kang magtanim para sa iyong sarili ng isang Ashera, maging anuman ang uri ng puno, sa tabi ng altar na gagawin mo para sa iyong sarili para kay Yahweh, na iyong Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang haligi ng Ashera.” Ang salitang Hebreo na אֲשֵׁרָה ay maaaring tumukoy sa isang kultikong bagay na kaugnay ng diyosang si Ashera, at hindi lamang sa diyosa mismo.
    reason: alternative_reading
lexical_decisions:
- source_word: תִטַּע
  choice: magtanim
  rationale: Karaniwang kahulugan ng נטע ang “magtanim.” Pinananatili nito ang larawan ng isang buhay na puno o bagay na kahoy, sa halip na agad itong bigyang-kahulugang “magtayo.”
- source_word: אֲשֵׁרָה
  choice: Ashera
  rationale: Pinanatili bilang transliterasyon upang hindi pagpasiyahan kung ang tinutukoy ay ang diyosa mismo, isang sagradong puno, o isang kultikong bagay na kaugnay ng pagsamba sa kaniya.
- source_word: כָּל עֵץ
  choice: anumang uri ng puno
  rationale: Isinasalin ang literal na “anumang puno” sa natural na Filipino at ipinakikitang walang uri ng punong maaaring gawing Ashera sa lugar na iyon.
- source_word: אֵצֶל
  choice: sa tabi ng
  rationale: Tuwirang ipinahahayag ang pisikal na pagkalapit na tinutukoy ng אֵצֶל.
- source_word: מִזְבַּח
  choice: altar
  rationale: Karaniwan at malinaw na salin sa modernong Filipino para sa מזבח.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang isahan at ang ugnayang tipan sa pananalitang “iyong Diyos.”
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: na gagawin mo para sa iyong sarili
  rationale: Pinananatili ang malawak na diwa ng עשה na “gumawa” at ang לָּךְ na “para sa iyong sarili,” nang hindi ito pinakikitid sa “itatayo.”
theological_decisions:
- issue: Kung ang אֲשֵׁרָה ay pangalan ng diyosa o isang kultikong bagay
  choice: Panatilihin ang “Ashera” sa pangunahing teksto at ipaliwanag sa talababa ang saklaw ng kahulugan.
  alternative: “haligi ng Ashera” o “rebultong kahoy ni Ashera”
  rationale: Maaaring tumukoy ang salitang Hebreo sa diyosa o sa sagradong puno o kultikong bagay na kaugnay niya. Hindi nilulutas ng transliterasyon ang tunay na kalabuan ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang isahang “ikaw” na anyo ng utos upang tapat na mapanatili ang legal at tipanang pananalita ng Hebreo. Ang mga gitling na em dash ay nagpapanatili sa appositional na “Ashera—anumang uri ng puno—” nang hindi sapilitang nilulutas ang sintaktiko at semantikong ugnayan.
