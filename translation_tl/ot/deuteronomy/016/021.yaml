revisions:
- from: Huwag kang magtanim para sa iyong sarili ng isang Ashera—anumang uri ng puno—sa tabi ng altar ni Yahweh na iyong Diyos, na gagawin mo para sa iyong sarili.[a]
  to: Huwag kang magtanim para sa iyong sarili ng isang Ashera, maging anuman ang uri ng puno, sa tabi ng altar na gagawin mo para sa iyong sarili para kay Yahweh, na iyong Diyos.[a]
  rationale: Pinalitan ang em-dash na apposition ng idiomatikong Filipino na nagpapahayag ng “anumang uri ng puno,” at inayos ang hulíng sugnay upang walang alinlangan na ang altar ang bagay na gagawin. Pinanatili ang transliterasyong “Ashera” at ang kaukulang talababa upang mapreserba ang semantikong kalabuan ng Hebreo.
