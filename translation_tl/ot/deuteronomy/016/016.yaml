source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: tl
  text: 'Tatlong ulit sa isang taon, ang lahat ng iyong kalalakihan ay haharap[a] kay Yahweh na iyong Diyos sa lugar na pipiliin niya: sa Pista ng Tinapay na Walang Pampaalsa, sa Pista ng mga Linggo, at sa Pista ng mga Kubol[b]. Walang sinuman ang haharap kay Yahweh nang walang dala.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “makikita sa harap ni Yahweh.” Literal na pasibo/reflexive ang anyo ng pandiwang Hebreo, ngunit sa kontekstong ito isa itong idyoma para sa pagharap o pagpapakita ng sarili sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: Ang “Pista ng mga Kubol” ay tradisyonal ding tinatawag na “Pista ng mga Tabernakulo.”
    reason: alternative_reading
  - marker: c
    text: Ang “nang walang dala” ay nangangahulugang hindi dapat humarap nang walang kinakailangang kaloob o handog.
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: haharap
  rationale: Ang Niphal ng ראה ay isang idyoma rito para sa pagharap o pagpapakita ng sarili sa presensya ng Diyos. Likas sa modernong Tagalog ang “haharap,” habang itinatala sa talababa ang literal na anyo.
- source_word: כָל זְכוּרְךָ
  choice: ang lahat ng inyong kalalakihan
  rationale: Tiyak na mga lalaki ang tinutukoy ng Hebreo bilang mga obligadong dumalo; pinananatili ng salin ang saklaw na panlalaki ng batas.
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na inyong Diyos
  rationale: Ang pariralang “sa mukha/presensya ni” ay idyomatikong tumutukoy sa pagharap sa Diyos. Ang “haharap kay Yahweh” ay malinaw at likas sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: sa lugar na pipiliin niya
  rationale: Pinananatili nito ang diwang hinaharap ng imperfect at ang diin ng Deuteronomio sa lugar na Diyos mismo ang pipili.
- source_word: חַג הַמַּצּוֹת
  choice: Pista ng Tinapay na Walang Pampaalsa
  rationale: Tuwirang ipinapahayag ang pangalan ng pista sa paraang madaling maunawaan ng karaniwang mambabasa.
- source_word: חַג הַשָּׁבֻעוֹת
  choice: Pista ng mga Linggo
  rationale: Pinananatili ang literal na pangalang Hebreo at hindi ipinapasok ang mas huling pangalang “Pentecostes.”
- source_word: חַג הַסֻּכּוֹת
  choice: Pista ng mga Kubol
  rationale: Ang “mga kubol” ay malinaw na katumbas ng סֻכּוֹת, mga pansamantalang silungan; itinatala sa talababa ang tradisyonal na katawagan.
- source_word: רֵיקָם
  choice: nang walang dala
  rationale: Pinananatili ang maikli at idyomatikong pahayag na tumutukoy sa hindi pagdating nang walang kinakailangang kaloob o handog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Panlalaking saklaw ng כָל זְכוּרְךָ
  choice: ang lahat ng inyong kalalakihan
  alternative: kayong lahat o lahat ng tao sa inyo
  rationale: Tiyak na mga lalaki ang saklaw ng legal na obligasyon sa pinagmulang teksto, kaya hindi ito ginawang walang-tiyak-na-kasarian.
- issue: Kahulugan ng pagharap nang רֵיקָם
  choice: nang walang dala
  alternative: nang walang dalang handog
  rationale: Pinananatili sa pangunahing teksto ang idyomatikong anyo at ipinapaliwanag sa talababa ang kultikong diwa nito, nang hindi ginagawang mas tahas kaysa sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang “pista” para sa חַג, “kalalakihan” upang mapanatili ang tiyak na legal na saklaw, at maiikling pangungusap upang maging malinaw sa karaniwang mambabasa. Ang lahat ng talababa ay may katumbas na marker sa pangunahing teksto.
