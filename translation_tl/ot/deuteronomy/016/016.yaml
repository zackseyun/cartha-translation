  source_fidelity: 'Tumpak sa kabuuan ang diwa: tatlong taunang pista, obligasyon ng mga lalaki, ang lugar na pipiliin ng Diyos, at pagbabawal sa pagharap nang walang handog. Gayunman, ang panghalip sa Hebreo ay isahan ("iyong"), samantalang ginawa itong maramihan ("inyong").'
