  terminology: Ang "Yahweh," "Pista ng Tinapay na Walang Pampaalsa," "Pista ng mga Linggo," at "Pista ng mga Kubol" ay angkop at pare-pareho. Ang "Pista ng mga Tabernakulo" bilang tradisyonal na alternatibo ay katanggap-tanggap.
