base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: tl
  text: Hindi mo maaaring ihain bilang handog ang Paskuwa[a] sa alinman sa mga pintuang-bayan[b] na ibinibigay sa iyo ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang handog ng Paskuwa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga pintuan,” isang karaniwang pagtukoy sa mga bayan o pamayanan.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Hindi mo maaaring
  rationale: Sa legal na kontekstong ito, ang יכל na may pawatas ay naghahayag ng pagbabawal, hindi lamang kawalan ng kakayahan.
- source_word: לִזְבֹּחַ
  choice: ihain bilang handog
  rationale: Ang זבח sa kontekstong pangkulto ay tumutukoy sa pagkatay at paghahandog; natural na ipinahahayag ito sa Filipino bilang paghahain ng handog.
- source_word: הַפָּסַח
  choice: ang Paskuwa
  rationale: Maaaring tumukoy ang פסח sa kapistahan, hayop, o handog ng Paskuwa. Pinananatili ng 'Paskuwa' ang pagiging maikli at ang tunay na lawak ng salita, habang nililinaw ng pandiwa ang sakripisyal na konteksto.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: sa alinman sa mga pintuang-bayan
  rationale: Ang literal na 'mga pintuan' ay karaniwang metonimiya sa Deuteronomio para sa mga bayan o pamayanan. Pinananatili ng 'pintuang-bayan' ang larawang Hebreo habang ang talababa ang nagpapaliwanag sa gamit nito.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: na ibinibigay sa iyo ni Yahweh na iyong Diyos
  rationale: Ang participle נֹתֵן ay may nagpapatuloy o katangiang diwa; ipinahahayag ito ng 'ibinibigay.' Isinasalin nang tuwiran ang pangalang יהוה bilang Yahweh.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan ng Diyos ang Tetragrammaton sa teksto; pinananatili ng 'Yahweh' ang tahasang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng הַפָּסַח
  choice: ang Paskuwa
  alternative: ang handog ng Paskuwa
  rationale: Sadyang maaaring tumukoy ang salita sa kapistahan o sa handog/hayop nito. Hindi nilulutas nang higit sa kinakailangan ang ambiguwidad; inilalahad sa talababa ang mas tiyak na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang ikalawang panauhan ('mo,' 'iyo') upang mapanatili ang bilang sa Hebreo; pinanatili rin ang larawang 'pintuang-bayan' ngunit nilinaw ang metonimiya sa talababa.
