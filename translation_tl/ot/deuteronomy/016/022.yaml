  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: tl
  text: Huwag kang magtayo para sa iyong sarili ng haliging bato[a], na kinamumuhian ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “batong nakatindig” o “haliging panritwal.” Ang salitang Hebreo ay tumutukoy sa isang itinayong bato na may kaugnayan sa pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִים
  choice: magtayo
  rationale: Ang Hiphil ng קום ay nangangahulugang magpatayo o maglagay nang nakatindig; natural at tuwiran ang “magtayo” sa Filipino.
- source_word: לְךָ
  choice: para sa iyong sarili
  rationale: Ipinapahayag nito ang datibong may pansariling kaugnayan o pakinabang at pinananatili ang reflexive na diin.
- source_word: מַצֵּבָה
  choice: haliging bato
  rationale: Tumutukoy ito sa isang batong itinayong nakatindig, kadalasang may kaugnayan sa pagsamba. Iniiwasan ng pangunahing teksto ang pagdaragdag ng “sagrado,” habang nililinaw ng talababa ang posibleng kontekstong panrelihiyon.
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na pang-ugnay sa Filipino para sa sugnay na naglalarawan sa haliging bato.
- source_word: שָׂנֵא
  choice: kinapopootan
  rationale: Pinananatili nito ang matinding kahulugan ng pagkapoot o matinding pagkasuklam, nang hindi pinahihina ang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang isahan at ang tipanang ugnayang ipinahahayag ng parirala.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na ipalit ang isang titulo.
- issue: Panrelihiyong pahiwatig ng מַצֵּבָה
  choice: haliging bato, na may paliwanag sa talababa
  alternative: sagradong haligi; haliging panritwal
  rationale: Ang salita mismo ay isang itinayong batong monumento at madalas may gamit sa pagsamba. Pinananatili sa teksto ang leksikal na lawak at inilalagay sa talababa ang kontekstong panrelihiyon upang hindi gawing tahasang bahagi ng salita ang isang pahiwatig mula sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “ikaw” na hinihingi ng Hebreo at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
