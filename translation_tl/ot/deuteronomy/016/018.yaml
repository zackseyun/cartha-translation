  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: tl
  text: Magtalaga ka ng mga hukom at mga opisyal para sa iyo sa lahat ng pintuang-bayan[a] na ibinibigay sa iyo ni Yahweh na iyong Diyos, ayon sa iyong mga lipi; at hahatulan nila ang bayan nang makatarungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng iyong mga bayan.” Literal na “sa lahat ng iyong mga pintuan”; ang mga lugar sa pintuan ng bayan ay nagsilbing mga sentrong sibiko at panghukuman.
    reason: cultural_note
  - marker: b
    text: Literal na “makatarungang hatol”; maaari ring isalin na “sa pamamagitan ng makatarungang paghatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: mga hukom
  rationale: Tumutukoy sa mga taong nagpapasiya sa mga usaping legal; ang “mga hukom” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: שֹׁטְרִים
  choice: mga opisyal
  rationale: Tumutukoy sa mga tagapangasiwang kaugnay ng pamahalaan at pagpapatupad ng batas, nang hindi labis na nililimitahan ang tiyak nilang tungkulin.
- source_word: תִּתֶּן
  choice: magtalaga ka
  rationale: Bagaman literal na “maglagay/magbigay,” ang pandiwa rito ay idiomatikong tumutukoy sa paghirang sa isang tungkulin.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: sa lahat ng pintuang-bayan
  rationale: Pinananatili ang konkretong larawan ng mga pintuan ng bayan, na nagsilbing mga sentrong sibiko at panghukuman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang tinutumbasan ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: לִשְׁבָטֶיךָ
  choice: ayon sa iyong mga lipi
  rationale: Ipinahihiwatig ng parirala ang pag-oorganisa o pamamahagi ng mga itatalaga batay sa mga lipi.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: at hahatulan nila ang bayan
  rationale: Pinananatili ang panghukumang diwa ng pandiwa sa konteksto ng mga hukom at opisyal.
- source_word: מִשְׁפַּט צֶדֶק
  choice: nang makatarungan
  rationale: Natural na Filipino na nagpapahayag na ang kanilang paghatol ay dapat maging matuwid at makatarungan; inilalagay sa talababa ang mas pormal na anyo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ang personal na pangalan sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang larawang “pintuang-bayan” ngunit ipinaliwanag ang kahulugang pangkultura sa talababa. Ang isahan na “ka/iyo” ay sumusunod sa anyong Hebreo na tumutukoy sa Israel bilang kabuuan.
