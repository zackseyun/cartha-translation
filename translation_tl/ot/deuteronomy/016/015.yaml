  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים תָּחֹג֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה כִּ֣י יְבָרֶכְ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹ֤ל תְּבוּאָֽתְ/ךָ֙ וּ/בְ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔י/ךָ וְ/הָיִ֖יתָ אַ֥ךְ שָׂמֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: tl
  text: Sa loob ng pitong araw, ipagdiwang mo ang kapistahan para kay Yahweh na iyong Diyos sa lugar na pipiliin ni Yahweh. Sapagkat pagpapalain ka ni Yahweh na iyong Diyos sa lahat ng iyong ani at sa lahat ng gawa ng iyong mga kamay, at lubos kang magagalak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “at kagalakan lamang ang madarama mo” o “at tiyak kang magagalak.” Binibigyang-diin ng pananalitang Hebreo ang ganap at walang-halong kagalakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּחֹג
  choice: ipagdiwang mo ang kapistahan
  rationale: Tumutukoy ang pandiwang חָגַג sa pagdiriwang ng isang kapistahang panrelihiyon, hindi lamang sa pangkalahatang pagsasaya.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinapakita ng ל ang pag-aalay o pagtatalaga ng kapistahan kay Yahweh; natural sa modernong Tagalog ang “para kay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton sa tekstong Hebreo.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: sa lugar na pipiliin ni Yahweh
  rationale: Malapit ito sa Hebreo at malinaw na tumutukoy sa lugar ng pagsambang itatalaga ng Diyos.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng ipinag-uutos na pagdiriwang; ang “sapagkat” ay marangal ngunit karaniwang nauunawaan.
- source_word: יְבָרֶכְךָ
  choice: pagpapalain ka
  rationale: Pinananatili nito ang karaniwang wikang Hebreo tungkol sa pagpapala ng Diyos at hindi ito nililimitahan sa materyal na pagpapaunlad.
- source_word: תְּבוּאָתְךָ
  choice: iyong ani
  rationale: Sa kontekstong agrikultural, natural na tumutukoy ang תְּבוּאָה sa ani o bunga ng lupa; malinaw at karaniwan sa Tagalog ang “ani.”
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: gawa ng iyong mga kamay
  rationale: Pinananatili ang nauunawaang Hebreong idyoma para sa paggawa ng tao at mga bunga nito.
- source_word: וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: at lubos kang magagalak
  rationale: Ipinahahayag nito nang natural sa Tagalog ang idinidiing ganap na kagalakan, habang inilalagay sa talababa ang tunay na saklaw ng ibang posibleng pagbasa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Diin ng וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: at lubos kang magagalak
  alternative: at kagalakan lamang ang madarama mo; at tiyak kang magagalak
  rationale: Maaaring maging panrestrictibo o panidhi ang אַךְ. Sa konteksto, malamang na idinidiin nito ang ganap at walang-halong kagalakan, ngunit hindi dapat ikubli ang iba pang lehitimong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang isahang “mo/iyong/ka” upang mapanatili ang bilang ng mga panghalip sa Hebreo. Inilagay ang tandang talababa sa mismong sugnay na tinutukoy nito.
