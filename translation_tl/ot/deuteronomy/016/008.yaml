base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: tl
  text: Sa loob ng anim na araw, kakain ka ng tinapay na walang pampaalsa. At sa ikapitong araw ay magkakaroon ng taimtim na pagtitipon[a] para kay Yahweh na iyong Diyos; hindi ka gagawa ng trabaho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “banal na pagtitipon” o “pangwakas na pagtitipon.” Ang salitang Hebreo ay tumutukoy sa isang pormal na pagtitipong pangkapistahan at maaaring may diwa ng pagtitipong nagtatapos sa kapistahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Sa loob ng anim na araw
  rationale: Ipinapahayag ng pariralang konstrukto ang haba ng panahon; natural sa modernong Tagalog ang “sa loob ng anim na araw.”
- source_word: תֹּאכַל
  choice: kakain ka
  rationale: Ang anyong di-ganap ay may puwersang tagubilin sa kontekstong legal. Naipahahayag ito sa Tagalog ng panghinaharap na “kakain ka” nang hindi nagiging pahintulot lamang.
- source_word: מַצּוֹת
  choice: tinapay na walang pampaalsa
  rationale: Ito ang karaniwang kahulugan sa konteksto ng Paskuwa at malinaw ito sa ordinaryong mambabasa.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: At sa ikapitong araw
  rationale: Payak na pang-ugnay ang waw; hindi kailangang dagdagan ng diwang pasalungat na “ngunit.”
- source_word: עֲצֶרֶת
  choice: banal na pagtitipon
  rationale: Tumutukoy ito sa isang pormal na kapulungang pangkapistahan na inilaan sa Diyos. Pinananatili ng talababa ang posibleng diwa ng taimtim o pangwakas na pagtitipon.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para kay Yahweh na iyong Diyos
  rationale: Maaaring ipahiwatig ng ל ang paglalaan o kaugnayan; natural na ipinahahayag ito ng “para kay.” Pinananatili ang pangalang tipan na Yahweh at ang isahang panghalip ng Hebreo.
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: huwag kang gagawa ng anumang trabaho
  rationale: Malinaw at natural itong pagbabawal sa paggawa, at pinananatili ang isahang kausap.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ang malawak na tinatanggap na pagsasatinig at pinananatili nitong pangalan ang ipinahayag na pangalang tipan.
- issue: Saklaw ng pagbabawal sa מְלָאכָה
  choice: anumang trabaho
  alternative: anumang gawain
  rationale: Ang “trabaho” ay malinaw na tumutukoy sa ipinagbabawal na paggawa nang hindi ipinapalagay ang isang mas makitid na teknikal o denominasyonal na depinisyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal at panrelihiyon. Ginamit ang isahang “ka/iyong” ayon sa Hebreo. Inilagay ang panandang [a] sa “banal na pagtitipon,” na siyang salitang tinatalakay ng talababa.
