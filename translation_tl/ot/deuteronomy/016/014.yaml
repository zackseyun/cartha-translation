  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: tl
  text: Magalak ka sa iyong kapistahan[a]—ikaw, ang iyong anak na lalaki at iyong anak na babae, ang iyong aliping lalaki at aliping babae, ang Levita, ang dayuhang naninirahan sa iyong piling[b], ang ulila sa ama[c], at ang biyuda—na pawang nasa iyong mga bayan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa iyong pista.” Ang Hebreong חַג ay tumutukoy sa isang kapistahan o pagdiriwang na panrelihiyon.
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa isang di-Israelitang naninirahan sa piling ng Israel; maaari ring “dayuhang nakikipamayan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ulila.” Itinatampok ng Hebreo ang mahinang kalagayan ng isang nawalan ng ama at ng proteksiyong kaugnay nito.
    reason: lexical_alternative
  - marker: d
    text: Literal, “na nasa loob ng iyong mga pintuang-bayan.” Isa itong idyoma para sa mga naninirahan sa mga bayan o pamayanang sakop mo. Ang pangwakas na sugnay ay maaaring tumukoy sa buong naunang talaan.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Magalak ka
  rationale: Ang Qal perfect na may pang-ugnay ay gumaganap bilang utos sa kontekstong pambatas. Pinananatili ng “Magalak ka” ang tuwirang utos at ang diwa ng kagalakan.
- source_word: בְּחַגֶּךָ
  choice: sa iyong kapistahan
  rationale: Ang חַג ay isang kapistahang panrelihiyon, lalo na isang kapistahang dinadaluhan. Ang “kapistahan” ay natural at malinaw sa modernong Tagalog.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: ang iyong aliping lalaki at aliping babae
  rationale: Ipinakikita ng “alipin” ang nakagapos na kalagayang panlipunan sa halip na palambutin ito bilang pangkalahatang paglilingkod; tinutukoy ng lalaki at babae ang magkasunod na anyong panlalaki at pambabae.
- source_word: וְהַלֵּוִי
  choice: ang Levita
  rationale: Karaniwang tawag sa isang kabilang sa lipi ni Levi at malinaw sa kontekstong biblikal.
- source_word: וְהַגֵּר
  choice: ang dayuhang naninirahan sa inyo
  rationale: Ang גֵּר ay hindi basta bisita o banyaga kundi isang di-katutubong naninirahan sa pamayanan. Iniiwasan ng salin ang makabagong teknikal na kategorya sa imigrasyon.
- source_word: וְהַיָּתוֹם
  choice: ang ulila sa ama
  rationale: Itinatampok ng יָתוֹם sa batas ng Torah ang kawalan ng ama at ng proteksiyong panlipunang kaugnay nito. Mas tiyak ito kaysa sa “ulila” lamang.
- source_word: וְהָאַלְמָנָה
  choice: ang biyuda
  rationale: Natural at karaniwang modernong Tagalog para sa babaeng namatayan ng asawa.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: na naninirahan sa iyong mga bayan
  rationale: Ang literal na “nasa loob ng iyong mga pintuang-bayan” ay idyoma para sa mga taong nasa mga pamayanang sakop ng kausap. Isinasalin ang kahulugan sa natural na Tagalog habang itinatala sa talababa ang larawan ng Hebreo.
theological_decisions:
- issue: Kalagayang panlipunan ng עֶבֶד at אָמָה
  choice: aliping lalaki / aliping babae
  alternative: lalaking lingkod / babaeng lingkod
  rationale: Sa talaang ito ng mga kasambahay at mahihinang kasapi ng lipunan, mahalaga ang nakagapos na kalagayan. Hindi ito pinapalambot tungo sa pangkalahatang “lingkod,” ngunit hindi rin dinaragdagan ang teksto ng paliwanag tungkol sa tiyak na anyo ng pagkaalipin.
- issue: Pagkakakilanlan ng גֵּר
  choice: dayuhang naninirahan sa inyo
  alternative: nakikipamayan; residenteng dayuhan
  rationale: Pinananatili nito ang pagiging di-katutubo at ang permanenteng pakikipamuhay sa Israel nang hindi ipinapasok ang mga makabagong legal na kategorya.
- issue: Saklaw ng יָתוֹם
  choice: ulila sa ama
  alternative: ulila
  rationale: Ipinapakita ang partikular na kahinaang panlipunang binibigyang-diin ng salitang Hebreo, habang kinikilala sa talababa ang mas malawak na karaniwang salin.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang isahang “ka/iyong” upang mapanatili ang isahang legal na pakikipag-usap ng Hebreo. Ang gitling na mahaba ay nagpapauna sa talaan ng lahat ng kabilang sa pagdiriwang.
