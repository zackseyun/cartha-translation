  source_fidelity: Ang salin ay wastong naghahatid ng pautos na “magalak,” ng kapistahan, at ng buong talaan ng mga taong isasama. Gayunman, ang panghuling pariralang “na naninirahan sa iyong mga bayan” ay sa Hebreo ay maaaring kumapit sa buong naunang pangkat, hindi lamang sa biyuda. Dapat ding iwasan ang “sa inyo,” na lumilihis mula sa isahang kausap na ginagamit sa buong talata.
  naturalness: Natural at marangal ang karamihan ng Tagalog. Mas malinaw at natural ang pag-uulit ng “iyong” sa “iyong anak na lalaki at iyong anak na babae.” Ang “dayuhang naninirahan sa iyong piling” ay mas maayos kaysa “sa inyo” at pinananatili ang isahang pagtukoy.
