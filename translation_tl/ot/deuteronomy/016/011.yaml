review_pass:
  verdict: revise
  source_fidelity: Ang pangunahing di-pagkakatugma ay ang pagbabago ng isahang kausap sa Hebreo ("ikaw," kasama ng mga panghalip na -ךָ) tungo sa maramihang "kayo/inyo." Ang hayagang אַתָּה ay dapat mapanatiling isahan. Tapat ang "aliping lalaki/aliping babae," "dayuhang naninirahan," at ang causative na "patirahin ... ang kanyang pangalan."
  naturalness: Marangal at malinaw ang daloy, ngunit mas likas at mas tumpak sa tuwirang utos ang "magalak ka" at ang magkakatugmang "iyong/mo." Ang "nasa gitna mo" ay mas malapit sa אֲשֶׁר בְּקִרְבֶּךָ kaysa "kasama ninyo."
  terminology: Wastong pinanatili ang "Yahweh," "Levita," at "aliping lalaki/aliping babae." Ang "mga pintuang-bayan" ay katanggap-tanggap na literal na larawan, na may angkop na paliwanag sa talababa.
  issues:
  - severity: medium
    issue: Isahan ang kausap sa Hebreo, ngunit maramihan ang salin.
    rationale: Ang וְשָׂמַחְתָּ at ang hayagang אַתָּה ay isahan, gayundin ang lahat ng suffix na "iyong." Hindi dapat gawing plural ang anyo para lamang sa magalang na rehistro, sapagkat binabago nito ang gramatikal na pagtukoy ng pinagmulan.
  - severity: low
    issue: Hindi ganap na katapat ng "kasama ninyo" ang pangwakas na pariralang Hebreo.
    rationale: Ang אֲשֶׁר בְּקִרְבֶּךָ ay "na nasa gitna mo/inyong pamayanan." Ang "nasa gitna mo" ay mas direkta at pinananatili ang ugnayan sa isahang kausap.
