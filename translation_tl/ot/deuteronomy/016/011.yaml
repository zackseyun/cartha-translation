revisions:
- from: At magalak kayo sa harap ni Yahweh na inyong Diyos—kayo, ang inyong anak na lalaki at anak na babae, ang inyong aliping lalaki at aliping babae, ang Levita na nasa loob ng inyong mga pintuang-bayan,[a] at ang dayuhang naninirahan, ang ulila,[b] at ang balo na kasama ninyo—sa lugar na pipiliin ni Yahweh na inyong Diyos upang doon niya patirahin ang kanyang pangalan.[c]
  to: At magalak ka sa harap ni Yahweh na iyong Diyos—ikaw, ang iyong anak na lalaki at anak na babae, ang iyong aliping lalaki at aliping babae, ang Levitang nasa loob ng iyong mga pintuang-bayan,[a] at ang dayuhang naninirahan, ang ulila,[b] at ang balo na nasa gitna mo—sa lugar na pipiliin ni Yahweh na iyong Diyos upang patirahin doon ang kanyang pangalan.[c]
  rationale: Pinalitan ang lahat ng maramihang anyo ng isahan upang tumbasan ang hayagang "ikaw" at ang mga isahang panghalip sa Hebreo. Isinaayos din ang huling pangkat bilang "na nasa gitna mo" upang masalamin ang tekstong Hebreo. Pinanatili ang mga pangunahing terminong at ang causative na pormula tungkol sa pangalan ni Yahweh.
