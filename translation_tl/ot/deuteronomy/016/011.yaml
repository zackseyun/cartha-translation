  text: וְ/שָׂמַחְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֣ וּ/בִתֶּ/ךָ֮ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ/ךָ֒ וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֣ר בְּ/קִרְבֶּ֑/ךָ בַּ/מָּק֗וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: tl
  text: At magalak ka sa harap ni Yahweh na iyong Diyos—ikaw, ang iyong anak na lalaki at anak na babae, ang iyong aliping lalaki at aliping babae, ang Levitang nasa loob ng iyong mga pintuang-bayan,[a] at ang dayuhang naninirahan, ang ulila,[b] at ang balo na nasa gitna mo—sa lugar na pipiliin ni Yahweh na iyong Diyos upang patirahin doon ang kanyang pangalan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga pintuang-bayan” ay maaaring tumukoy sa mga bayan o pamayanang tinitirhan mo.
    reason: idiom_explanation
  - marker: b
    text: Maaari ring “ang walang ama.”
    reason: lexical_alternative
  - marker: c
    text: Literal, “upang patirahin ang kanyang pangalan doon.”
    reason: literal_rendering
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: At magalak kayo
  rationale: Ang שׂמח ay tumutukoy sa pagkagalak o pagsasaya. Ang “magalak” ay likas at marangal sa kontekstong pangkapistahan at pagsamba. Bagaman isahan ang anyong Hebreo, ginagamit ang magalang at karaniwang Tagalog na “kayo” sa tuwirang utos.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Tapat itong kumakatawan sa idyomang “sa harap” o “sa presensya ng,” at natural sa Tagalog kapag sinusundan ng personal na pangalang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: ang inyong aliping lalaki at aliping babae
  rationale: Ipinakikita ng “alipin” ang nakagapos na katayuang panlipunan sa kontekstong legal, habang pinananatili ng “lalaki” at “babae” ang malinaw na pagtatambal ng dalawang terminong Hebreo.
- source_word: בִּשְׁעָרֶיךָ
  choice: nasa loob ng inyong mga pintuang-bayan
  rationale: Pinananatili ang larawang Hebreo ng mga pintuang-bayan, na sa Deuteronomio ay tumutukoy rin sa pamayanang sakop ng isang bayan.
- source_word: וְהַגֵּר
  choice: ang dayuhang naninirahan
  rationale: Ipinahahayag nito ang isang di-katutubong naninirahan sa gitna ng Israel at nasa ilalim ng kaayusang panlipunan nito; mas tiyak ito kaysa sa payak na “dayuhan” o “estranghero.”
- source_word: וְהַיָּתוֹם
  choice: ang ulila
  rationale: Ang “ulila” ang natural na modernong salin sa Tagalog; maaaring tumukoy ang terminong Hebreo lalo na sa batang walang ama.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: upang doon niya patirahin ang kanyang pangalan
  rationale: Ang “patirahin” ay nagpapanatili sa causative na diwa ng pandiwa at sa natatanging pormulang teolohikal ng Deuteronomio nang hindi ipinapaliwanag nang lampas sa teksto.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo; ang “Yahweh” ay transliterasyong nagpapanatili rito sa halip na palitan ng titulo.
- issue: Katayuan ng עבד at אמה
  choice: aliping lalaki / aliping babae
  alternative: lingkod na lalaki / lingkod na babae
  rationale: Sa kontekstong sambahayan at batas, mahalaga ang nakagapos na katayuang panlipunan. Hindi ito pinalalambot bilang pangkalahatang paglilingkod, ngunit pinananatili ang kasariang tinutukoy ng magkatambal na salita.
- issue: Pormula tungkol sa pangalan ng Diyos sa santuwaryo
  choice: upang doon niya patirahin ang kanyang pangalan
  alternative: upang manahan doon ang kanyang pangalan
  rationale: Pinananatili ng salin ang causative na anyo ng Hebreo at ang tensiyon sa pagitan ng presensya ng Diyos at ng paninirahan ng kanyang pangalan sa piniling lugar.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayo/inyong” bilang karaniwang magalang na pagtukoy sa kausap, bagaman isahan ang mga anyong Hebreo. Pinanatili ang legal at panliturhiyang himig, ang pangalang Yahweh, at ang idyoma ng mga pintuang-bayan; iniwasan ang sobrang teknikal o makalumang pananalita.
