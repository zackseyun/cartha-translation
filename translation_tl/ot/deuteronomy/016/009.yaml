translation:
  language: tl
  text: Magbilang ka para sa iyong sarili ng pitong linggo. Mula nang simulang gamitin ang karit sa nakatayong butil, magsimula kang magbilang ng pitong linggo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת
  choice: pitong linggo
  rationale: Ang שָׁבֻעֹת ay karaniwang salitang Hebreo para sa “mga linggo.” Sa kontekstong pangkalendaryo, natural at malinaw sa Tagalog ang “pitong linggo.”
- source_word: תִּסְפָּר לָךְ
  choice: Bibilang ka para sa iyong sarili
  rationale: Ang anyong pandiwa ay nagbibigay ng tagubilin, at pinananatili ng “para sa iyong sarili” ang tahasang לָךְ, bagaman maaari itong alisin sa mas malayang Tagalog.
- source_word: מֵהָחֵל
  choice: Mula sa pagsisimula
  rationale: Ipinahahayag nito ang panahong pinagmumulan o panimulang punto na tinutukoy ng מִן kasama ng infinitive na “magsimula.”
- source_word: חֶרְמֵשׁ בַּקָּמָה
  choice: paggapas sa nakatayong trigo
  rationale: Ang parirala ay tumutukoy sa pagsisimula ng ani sa pamamagitan ng paglalapat ng karit sa nakatayong pananim. Mas likas sa Tagalog ang pandiwang “paggapas” kaysa sa literal na “paglalagay ng karit,” habang pinananatili ang tagpo ng pag-aani.
- source_word: תָּחֵל לִסְפֹּר
  choice: magsisimula kang bumilang
  rationale: Tumpak at likas na inilalarawan nito ang pagsisimula ng gawaing pagbibilang.
- source_word: שִׁבְעָה שָׁבֻעוֹת
  choice: pitong linggo
  rationale: Pinananatili ang pare-parehong salin ng inuulit na parirala at ang malinaw na kontekstong pangkalendaryo.
