translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “nakatayong trigo” para sa קָמָה sa kontekstong ito, at ang ayos ng pangungusap ay pinanatiling malapit sa Hebreo nang hindi nagiging alanganin sa Tagalog.
