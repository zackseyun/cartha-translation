  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: צֶ֥דֶק צֶ֖דֶק תִּרְדֹּ֑ף לְמַ֤עַן תִּֽחְיֶה֙ וְ/יָרַשְׁתָּ֣ אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: tl
  text: Katarungan[a], katarungan ang dapat mong itaguyod, upang mabuhay ka at maangkin[b] ang lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Katuwiran, katuwiran ang dapat mong itaguyod.” Maaaring tumukoy ang Hebreong צֶדֶק sa katarungan at sa katuwiran; sa kontekstong panghukuman dito, higit na angkop ang “katarungan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “manahin.” Maaaring mangahulugan ang pandiwang Hebreo na manahin o angkinin ang lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: Katarungan, katarungan
  rationale: Ang pag-uulit ay nagbibigay-diin at pinanatili sa salin. Sa konteksto ng mga hukom, pagtatangi, at suhol, ang “katarungan” ang pinakanatural na pampubliko at panghukuman na diwa, bagaman maaari ring mangahulugang “katuwiran” ang צֶדֶק.
- source_word: תִּרְדֹּף
  choice: ang dapat mong itaguyod
  rationale: Ang רדף ay literal na “habulin” o “pagsikapang abutin.” Sa makabagong Tagalog, ipinahahayag ng “itaguyod” ang matindi at patuloy na paghahangad at pagpapatupad ng katarungan nang hindi nagiging mekanikal ang larawan ng paghahabol.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw at likas na nag-uugnay sa utos at sa layunin o bunga nito.
- source_word: תִּחְיֶה
  choice: mabuhay ka
  rationale: Tuwirang pinananatili ang diwa ng patuloy na buhay sa ilalim ng pagpapala ng tipan nang hindi idinaragdag ang mas tiyak na ideya ng pag-unlad.
- source_word: וְיָרַשְׁתָּ
  choice: at maangkin
  rationale: Saklaw ng ירשׁ ang pagmamana at pag-aari o pagkuha sa pag-aari. Ang “maangkin” ay natural sa pangungusap at angkop sa pagtanggap at pagtataglay ng lupa; inilagay sa talababa ang posibleng “manahin.”
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Pinananatili ang mahalagang katawagan sa Deuteronomio para sa lupaing ipinangako, sa halip na gawing “bansa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos, hindi pinapalitan ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang isahan at ang ugnayang tipan ng kausap sa Diyos.
- source_word: נֹתֵן לָךְ
  choice: ibinibigay sa iyo
  rationale: Ang kasalukuyang aspektong ipinahihiwatig ng participle ay natural na naipapahayag ng “ibinibigay,” na naglalarawan sa lupa bilang kaloob ni Yahweh.
theological_decisions:
- issue: Saklaw ng צֶדֶק sa kontekstong panghukuman
  choice: katarungan
  alternative: katuwiran
  rationale: Pangunahing tinutukoy ng kalapit na konteksto ang matuwid na paghatol, kawalang-pagtatangi, at pag-iwas sa suhol. Kaya “katarungan” ang pinakamalinaw dito, habang kinikilala sa talababa ang mas malawak na diwang moral na “katuwiran.”
- issue: Paglalahad sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito upang hindi mapalitan ng titulong “Panginoon.”
- issue: Diwa ng covenant-land verb na ירשׁ
  choice: maangkin
  alternative: manahin
  rationale: 'Hindi nilulutas nang palihim ang saklaw ng pandiwa: ginagamit sa teksto ang natural na “maangkin,” ngunit pinananatili sa talababa ang lehitimong diwa ng pagmamana.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mariing pag-uulit ng “katarungan” at ang isahang pakikipag-usap sa Israel. Iniwasan ang sobrang literal na “habulin,” na maaaring tumunog na pisikal sa Filipino, habang pinanatili sa “itaguyod” ang aktibo at patuloy na puwersa ng utos.
