base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: tl
  text: kundi sa lugar lamang na pipiliin ni Yahweh na iyong Diyos upang doon manahan ang kanyang pangalan.[a] Doon mo ihahandog[b] ang Paskuwa sa takipsilim, sa paglubog ng araw, sa takdang panahon ng paglabas mo mula sa Ehipto.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang doon niya patirahin ang kanyang pangalan” o “upang doon niya ilagay ang kanyang pangalan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kakatayin ang Paskuwa.” Ang pandiwa ay tumutukoy sa pagkatay bilang paghahandog.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa takdang panahon ng paglabas mo mula sa Ehipto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: kundi sa ... lamang
  rationale: 'Ipinahahayag ang mahigpit na pagtatangi sa naunang pagbabawal: hindi sa alinmang lugar, kundi sa iisang lugar lamang na pipiliin ng Diyos.'
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: sa lugar lamang na pipiliin
  rationale: Likas na Filipino at pinananatili ang hinaharap na pagpili sa lugar ng pagsamba.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: ni Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang ikalawang panauhang isahan ng Hebreo.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: upang doon manahan ang kanyang pangalan
  rationale: Pinananatili ang idyoma ng paninirahan ng pangalan nang hindi ito binibigyang-kahulugang pisikal na pagkakulong ng Diyos sa lugar.
- source_word: תִּזְבַּח אֶת הַפֶּסַח
  choice: ihahandog ang Paskuwa
  rationale: Ipinakikita ng 'ihahandog' ang sakripisyal na konteksto; ang 'Paskuwa' ay maaaring tumukoy rito sa handog ng Paskuwa.
- source_word: בָּעָרֶב כְּבוֹא הַשֶּׁמֶשׁ
  choice: sa gabi, sa paglubog ng araw
  rationale: Pinananatili ang dalawang magkaugnay na pahayag-panahon ng Hebreo sa malinaw at likas na Filipino.
- source_word: מוֹעֵד צֵאתְךָ מִמִּצְרָיִם
  choice: sa takdang panahon ng paglabas mo mula sa Ehipto
  rationale: Pinananatili ang ideya ng itinakdang panahon at ang literal na kaugnayan nito sa paglabas mula sa Ehipto.
theological_decisions:
- issue: Ang pormula tungkol sa pangalan ng Diyos na nananahan sa piniling lugar
  choice: upang doon manahan ang kanyang pangalan
  alternative: upang doon niya patirahin ang kanyang pangalan / upang doon niya ilagay ang kanyang pangalan
  rationale: Pinananatili nito ang teolohikal na idyoma at ang tensiyon sa pagitan ng presensiya ng Diyos sa santuwaryo at ng hindi paglilimita sa kanya sa isang pisikal na lugar.
- issue: Kahulugan ng Paskuwa bilang tuwirang layon ng pandiwang sakripisyal
  choice: ihahandog ang Paskuwa
  alternative: kakatayin ang Paskuwa / ihahandog ang handog na Paskuwa
  rationale: Hindi nililimitahan ang Paskuwa sa 'kordero' lamang, na hindi tahasang sinasabi rito, habang malinaw pa rin ang ritwal na paghahandog.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Paskuwa” bilang pamilyar na katawagan, “Yahweh” para sa banal na pangalan, at ikalawang panauhang isahan upang sundan ang Hebreo. Inayos ang mga pananda ng talababa upang tumapat sa mismong pariralang nililinaw.
