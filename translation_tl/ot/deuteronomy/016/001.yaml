  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: tl
  text: Ipangilin mo ang buwan ng Abib[a] at idaos mo ang Paskuwa para kay Yahweh na iyong Diyos, sapagkat sa buwan ng Abib ay inilabas ka ni Yahweh na iyong Diyos mula sa Ehipto sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Abib ay pangalan ng buwang kaugnay ng mga butil na nagsisimula nang mahinog; maaari ring isalin na “buwan ng tagsibol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Ipangilin mo
  rationale: Ang pautos ay humihingi ng maingat na pagtupad sa takdang panahong panrelihiyon. Likas sa Filipino ang “ipangilin” sa ganitong konteksto at pinananatili nito ang lakas ng utos.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: ang buwan ng Abib
  rationale: Sa kontekstong ito, ang Abib ay katawagan sa isang buwan sa kalendaryong panrelihiyon ng Israel. Pinanatili ang pangalan upang hindi ito mapalitan ng mas pangkalahatang “tagsibol.”
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: at idaos mo ang Paskuwa
  rationale: Literal itong “gawin ang Paskuwa,” ngunit ang “idaos” ang likas na Filipino para sa pagsasagawa ng itinakdang pagdiriwang at mga ritwal nito nang hindi dinaragdagan ang kahulugan.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinapakita ng ל ang pag-uukol ng pagdaraos kay Yahweh. Malinaw at natural sa Filipino ang “para kay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: הוֹצִיאֲךָ
  choice: inilabas ka
  rationale: Tuwirang ipinahahayag nito ang causative na diwa ng pandiwa at ang karaniwang pormula tungkol sa paglabas mula sa Ehipto.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Likas itong katambal ng “inilabas ka” at malinaw na tinutukoy ang pinanggalingan.
- source_word: לָיְלָה
  choice: sa gabi
  rationale: Ipinahahayag nito ang panahon o kalagayan ng paglabas, at karaniwan at malinaw ito sa modernong Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong tumutukoy sa Diyos.
- issue: Kung ituturing ang אָבִיב bilang pangalan ng buwan o bilang panahon ng taon
  choice: Abib bilang katawagang pangkalendaryo
  alternative: tagsibol
  rationale: Sa batas tungkol sa Paskuwa, itinatakda ng parirala ang partikular na buwan ng pagdaraos. Ang “tagsibol” lamang ay maaaring magpahina sa katiyakang pangkalendaryo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong pambatas at panrelihiyon. Ginamit ang “ipangilin” at “idaos” bilang pamilyar ngunit hindi kolokyal na mga pandiwa; pinanatili ang “Paskuwa” at “Yahweh” bilang mga natatanging katawagan.
