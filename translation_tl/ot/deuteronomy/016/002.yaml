revisions:
- from: At ihahandog mo kay Yahweh na iyong Diyos ang Paskuwa[a], mula sa kawan at sa bakahan, sa lugar na pipiliin ni Yahweh upang doon niya patahanin ang kanyang pangalan.
  to: At maghahandog ka kay Yahweh na iyong Diyos ng Paskuwa[a], mula sa mga hayop sa kawan at mga baka, sa lugar na pipiliin ni Yahweh upang doon niya patirahin ang kanyang pangalan.
  rationale: Pinalitan ang mga katawagang hindi sapat na likas o posibleng magdulot ng maling pagbasa sa Filipino. Hindi binago ang saklaw na sadyang malawak at pinagtatalunan ng “Paskuwa” kaugnay ng mga hayop mula sa kawan at baka; nananatili itong ipinaliwanag sa talababa. Ang “patirahin ang kanyang pangalan” ay nagpapanatili sa causative na anyo at sa teolohikong idyoma ng Hebreo.
