base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: tl
  text: At maghahandog ka kay Yahweh na iyong Diyos ng Paskuwa[a], mula sa mga hayop sa kawan at mga baka, sa lugar na pipiliin ni Yahweh upang doon niya patirahin ang kanyang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Paskuwa” rito ay iniugnay sa “mula sa mga hayop sa kawan at mga baka.” Nauunawaan ito ng ilan na saklaw hindi lamang ang mismong hayop na handog para sa Paskuwa kundi pati ang mga handog sa kapistahang kaugnay ng Paskuwa at Tinapay na Walang Pampaalsa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: At ihahandog mo
  rationale: Ipinahahayag ng זבח ang ritwal na pagkatay bilang handog, hindi karaniwang pagpatay lamang. Likas sa Filipino ang “ihahandog” at napapanatili nito ang puwersang tagubilin ng anyo sa konteksto.
- source_word: פֶּסַח
  choice: ang Paskuwa
  rationale: Maaaring tukuyin ng פֶּסַח ang pagdiriwang, ritwal, o mismong handog. Dahil layon ito ng pandiwang “ihahandog,” sapat at sadyang matipid ang “ang Paskuwa,” habang pinananatili ang saklaw na hindi ganap na tiyak.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na iyong Diyos
  rationale: Ipinakikita ng ל ang pinag-uukulan ng handog. Ginamit ang “Yahweh” upang tahasang katawanin ang pangalang יהוה.
- source_word: צֹאן וּבָקָר
  choice: mula sa kawan at sa bakahan
  rationale: Mga kolektibong katawagan ang צֹאן at בָקָר para sa maliliit at malalaking alagang hayop. Pinananatili ng “kawan at bakahan” ang malawak na pagtukoy at ng “mula sa” ang ipinahihiwatig na pinagmulan ng mga hayop.
- source_word: בַּמָּקוֹם
  choice: sa lugar
  rationale: Natural na Filipino ito para sa itinakdang pook ng pagsamba.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: na pipiliin ni Yahweh
  rationale: Malinaw na inilalarawan ng hinaharap na “pipiliin” ang pagpili ng Diyos kaugnay ng panahon ng pagsasalita ni Moises.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: upang doon niya patahanin ang kanyang pangalan
  rationale: Causative ang anyo ng שכן. Pinananatili ng “patahanin ang kanyang pangalan” ang Hebreong idyoma tungkol sa banal na presensya at pag-angkin, sa halip na gawing simpleng “ilagay.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalang tipan, sa halip na palitan ng titulo.
- issue: Saklaw ng “Paskuwa” kaugnay ng “kawan at bakahan”
  choice: Panatilihin ang malawak at siksik na pananalita ng Hebreo, na may talababa
  alternative: Ipaliwanag sa pangunahing teksto bilang “handog na Paskuwa at iba pang handog sa kapistahan”
  rationale: Mas malawak ang “kawan at bakahan” kaysa sa karaniwang hayop na Paskuwa lamang. Hindi dapat tahimik na lutasin ng salin ang tensiyon; inilalagay sa talababa ang posibleng mas malawak na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paskuwa” bilang kinikilalang terminong biblikal; pinanatili ang idyomang “patahanin ang kanyang pangalan” dahil mahalaga ang anyo at teolohikong pahiwatig nito.
