  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: tl
  text: Lutuin[a] mo ito at kainin sa lugar na pipiliin ng PANGINOON mong Diyos. Sa umaga, umalis ka at pumunta sa iyong mga tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pakuluan.”
    reason: Maaaring mangahulugan ang בּשׁל ng pangkalahatang pagluluto o, mas tiyak, pagpapakulo.
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: Lutuin
  rationale: Ang pandiwang בּשׁל ay tumutukoy sa pagluluto at, sa ilang konteksto, sa pagpapakulo. Pinananatili ng “lutuin” ang mas malawak na kahulugan habang inilalagay sa talababa ang mas tiyak na posibilidad.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: sa lugar na pipiliin ng PANGINOON mong Diyos
  rationale: Ang hulaping בּוֹ ay likas na naisasama sa Tagalog na sugnay na “sa lugar na pipiliin”; ang tahasang “para rito” ay magiging di-natural at maaaring magdagdag ng kahulugang hindi malinaw sa Hebreo.
- source_word: וּפָנִיתָ ... וְהָלַכְתָּ לְאֹהָלֶיךָ
  choice: bumalik ka at pumunta sa iyong mga tolda
  rationale: Ipinapakita ng “bumalik” ang diwa ng pagtalikod o pag-alis mula sa lugar, samantalang pinananatili ng “pumunta” ang hiwalay na pandiwang Hebreo. Ang “mga tolda” ay nagpapanatili sa pangmaramihang anyo ng אֹהָלֶיךָ.
theological_decisions:
- issue: Pagbanggit sa banal na pangalan יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang nakaugaliang saling Tagalog na PANGINOON sa malaking titik upang ipahiwatig ang tetragrammaton, nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ikalawang panauhang isahan at ang dalawang kilos sa huling sugnay, habang iniwasan ang di-natural na literalismo.
