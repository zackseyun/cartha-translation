revisions:
- from: Nang panahong iyon, sinabi sa akin ni Yahweh, “Tumabas ka para sa iyong sarili ng dalawang tapyas na bato na tulad ng mga nauna. Pagkatapos, umakyat ka sa bundok, patungo sa akin, at gumawa ka para sa iyong sarili ng isang kaban na kahoy.”
  to: Noong panahong iyon, sinabi sa akin ni Yahweh, “Magtabas ka para sa iyong sarili ng dalawang tapyas na bato, na tulad ng mga nauna, at umakyat ka sa akin sa bundok. Gumawa ka rin para sa iyong sarili ng isang kaban na yari sa kahoy.”
  rationale: Inayos ang mga pariralang hindi gaanong likas sa modernong Filipino habang pinananatili ang utos na magtabas ng dalawang tapyas na bato, ang paghahambing sa naunang mga tapyas, ang pag-akyat tungo kay Yahweh sa bundok, at ang utos na gumawa ng kaban mula sa kahoy. Walang kinakailangang talababa, sapagkat walang footnote anchor sa salin at walang kailangang ipaliwanag na kalabuan upang maging tapat ang talata.
