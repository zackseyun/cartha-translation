base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: tl
  text: Noong panahong iyon, sinabi sa akin ni Yahweh, “Magtabas ka para sa iyong sarili ng dalawang tapyas na bato, na tulad ng mga nauna, at umakyat ka sa akin sa bundok. Gumawa ka rin para sa iyong sarili ng isang kaban na yari sa kahoy.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Nang panahong iyon
  rationale: Likas na salin ng panandang temporal na tumutukoy sa panahong nabanggit sa naunang salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: פְּסָל לְךָ
  choice: Tumabas ka para sa iyong sarili
  rationale: Ang pandiwa ay tumutukoy sa pagputol at paghubog ng bato; pinananatili rin ng parirala ang benepaktibo o refleksibong diwa ng לְךָ.
- source_word: שְׁנֵי לֻוחֹת אֲבָנִים
  choice: dalawang tapyas na bato
  rationale: Ang “tapyas na bato” ay malinaw at likas na katawagan sa mga patag na batong sinusulatan, nang hindi gumagamit ng salitang maaaring unang magpahiwatig ng makabagong elektronikong aparato.
- source_word: כָּרִאשֹׁנִים
  choice: na tulad ng mga nauna
  rationale: Malinaw na tumutukoy ito sa unang pares ng mga tapyas, habang pinananatili ang paghahambing ng Hebreo.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: umakyat ka sa bundok, patungo sa akin
  rationale: Ipinahahayag nito kapuwa ang paakyat na kilos tungo sa bundok at ang paglapit kay Yahweh, gaya ng ipinahihiwatig ng אֵלַי at ng hulaping direksiyonal.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: gumawa ka para sa iyong sarili ng isang kaban na kahoy
  rationale: Ang “kaban” ay angkop sa sagradong sisidlan ng mga tapyas; ang “na kahoy” ay tuwirang nagpapahayag sa materyal nito.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang personal na pangalan; pinananatili itong pangalan sa salin sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tapyas na bato” at “kaban na kahoy” bilang mga karaniwang salitang madaling maunawaan. Hindi isinama ang mga footnote ng English consultation layer sapagkat hindi tugma ang kanilang mga marker sa nilalaman at wala namang mahalagang tekstuwal o leksikal na kalabuan sa talatang Tagalog na nangangailangan ng talababa.
