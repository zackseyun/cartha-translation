source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: tl
  text: At ngayon, Israel, ano ang hinihingi ni Yahweh na iyong Diyos sa iyo maliban sa matakot[a] kay Yahweh na iyong Diyos, lumakad sa lahat ng kanyang daan, magmahal sa kanya, at paglingkuran si Yahweh na iyong Diyos nang buong puso mo at buong kaluluwa mo[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “matakot” dito ay hindi lamang pangamba; kabilang dito ang pagpipitagan, pagkamangha, at masunuring debosyon kay Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “buong buhay mo” o “buong pagkatao mo.” Ang salitang Hebreo na nephesh ay maaaring tumukoy sa kaluluwa, buhay, o sarili ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang paglipat ni Moises tungo sa panghihikayat.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: ano ba ang hinihingi sa iyo
  rationale: Likas sa modernong Tagalog at naipahihiwatig ang obligasyong taglay ng pandiwang שׁאל sa kayariang ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כִּי אִם
  choice: kundi
  rationale: Angkop sa retorikal na tanong at pinananatili ang naglilimita at nagpapakilalang puwersa ng parirala.
- source_word: לְיִרְאָה
  choice: matakot
  rationale: Pinananatili ang bigat at saklaw ng ירא; sa kontekstong tipan, kasama rito ang pagpipitagan, pagkamangha, at masunuring debosyon.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: lumakad sa lahat ng kanyang daan
  rationale: Pinananatili ang malinaw na metaporang Hebreo ng paglakad bilang paraan ng pamumuhay.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: ibigin siya
  rationale: Tuwiran at marangal na salin na nagpapanatili sa dimensiyong mapagmahal at pangtipan.
- source_word: וְלַעֲבֹד
  choice: paglingkuran
  rationale: Saklaw nito ang pagsamba, pagsunod, at debosyon nang hindi nililimitahan ang kahulugan sa gawaing panrelihiyon lamang.
- source_word: בְּכָל לְבָבְךָ
  choice: nang buong puso mo
  rationale: Karaniwan at likas na katumbas; ang puso ay tumutukoy sa panloob na pagkatao, kabilang ang isip at kalooban.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: at buong kaluluwa mo
  rationale: Pinananatili ang tradisyonal na katumbas at ang kabuuang diwa ng tambalang 'puso at kaluluwa,' habang itinatala ang posibleng kahulugang buhay o buong pagkatao.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa pinagmulang Hebreo; pinananatili ito sa halip na palitan ng titulo.
- issue: Puwersa ng ירא sa panghihikayat na pangtipan
  choice: matakot
  alternative: magpitagan
  rationale: Hindi pinapawi ang tensiyon sa pagitan ng takot, pagpipitagan, pagkamangha, at masunuring debosyon; ipinapaliwanag ang saklaw sa talababa.
- issue: Saklaw ng נֶפֶשׁ
  choice: kaluluwa
  alternative: buhay; buong pagkatao
  rationale: Tunay na malawak ang salitang Hebreo. Ang 'kaluluwa' ay angkop sa tambalan dito, ngunit hindi itinatangging maaari itong tumukoy sa buhay o sarili.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang isahang “iyo/mo” dahil isahang panlalaki ang gramatikal na pakikipag-usap sa Israel bilang isang bayan. Pinanatili ang mga metaporang “lumakad” at “daan,” at ang personal na pangalang Yahweh.
