  source_fidelity: 'Tumpak na naisasalin ng draft ang retorikal na tanong, ang puwersang obligasyonal ng שׁאל, ang limitasyong כִּי אִם, at ang magkakasunod na infinitive: matakot, lumakad, magmahal, at maglingkod. Pinananatili rin nito ang pangalang Yahweh at ang saklaw na “buong puso” at “buong kaluluwa.”'
