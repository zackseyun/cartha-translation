  terminology: Ang “Yahweh,” “matakot,” “lumakad,” “paglingkuran,” “puso,” at “kaluluwa” ay angkop at tapat sa Hebreo. Ang talababa tungkol sa ירא ay dapat nakaangkla sa “matakot,” hindi sa panghalip na “kanya,” upang tumugma ang marker sa salitang ipinaliliwanag.
