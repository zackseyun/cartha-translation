  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: tl
  text: Sa panahong iyon, ibinukod ni Yahweh ang lipi ni Levi upang dalhin ang kaban ng tipan ni Yahweh, tumayo sa harap ni Yahweh upang maglingkod sa kanya, at magbasbas sa kanyang pangalan, hanggang sa araw na ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבְדִּיל
  choice: ibinukod
  rationale: Ipinahahayag nito ang paghihiwalay para sa isang natatanging tungkulin, hindi lamang karaniwang paglalayo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: ang lipi ni Levi
  rationale: Likas at tuwirang salin ito ng pariralang tumutukoy sa tribong nagmula kay Levi.
- source_word: לָשֵׂאת
  choice: upang magdala
  rationale: Ang 'magdala' ang malinaw at natural na paglalarawan sa tungkulin nila kaugnay ng kaban.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: Pinananatili nito ang buong ugnayan ng mga pangngalan at tahasang binabanggit ang tipan at ang banal na pangalan.
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: tumayo sa harap ni Yahweh
  rationale: Malapit ito sa Hebreong idyoma at hindi labis na ipinapaliwanag ang likas ng sagradong paglilingkod.
- source_word: לְשָׁרְתוֹ
  choice: upang maglingkod sa kanya
  rationale: Ang 'maglingkod' ay natural sa modernong Filipino at sapat na saklaw ang sagradong paglilingkod sa kontekstong ito.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: at magbasbas sa kanyang pangalan
  rationale: Ipinahahayag nito ang pagpapahayag ng basbas sa kapahintulutan at pangalan ni Yahweh nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: gaya ng ginagawa nila hanggang sa araw na ito
  rationale: Ginawang tahasan ang ipinahihiwatig na pagpapatuloy ng mga tungkulin upang maging natural sa Filipino; ang panghalip ay tumutukoy sa lipi bilang pangkat.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ang Hebreo ay tuwirang gumagamit ng Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng Levitikong tungkulin sa לַעֲמֹד ... לְשָׁרְתוֹ
  choice: tumayo sa harap ni Yahweh upang maglingkod sa kanya
  alternative: humarap kay Yahweh upang mangasiwa sa banal na gawain
  rationale: Pinananatili ng napiling salin ang idyoma at sagradong konteksto nang hindi nag-aangkat ng mas tiyak na sistemang panrelihiyon.
- issue: Saklaw ng וּלְבָרֵךְ בִּשְׁמוֹ
  choice: magbasbas sa kanyang pangalan
  alternative: bigkasin ang basbas sa kanyang pangalan
  rationale: Hindi tinutukoy ng parirala ang eksaktong bagay o tumatanggap ng basbas; pinananatili ng salin ang kawalan ng tahasang layon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'lipi' para sa tribo, 'kaban' para sa ark, at 'magbasbas' para sa gawaing pagpapala. Walang kinakailangang talababa.
