  source_fidelity: 'Tumpak ang pangunahing mga katumbas: ang paghirang/pagbubukod sa lipi ni Levi, pagdadala ng kaban ng tipan ni Yahweh, pagtayo sa harap niya, paglilingkod sa kanya, at pagbabasbas sa kanyang pangalan. Gayunman, ang “gaya ng ginagawa nila” ay nagdaragdag ng tahasang aspektong paulit-ulit at ng panghalip na “nila” na wala sa Hebreo. Ang עַד הַיּוֹם הַזֶּה ay dapat panatilihing payak bilang “hanggang sa araw na ito.”'
