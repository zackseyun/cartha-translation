  terminology: Ang “Yahweh,” “lipi ni Levi,” “kaban ng tipan ni Yahweh,” at “maglingkod” ay angkop at pare-pareho sa pinagmulang teksto. Ang “magbasbas sa kanyang pangalan” ay pinananatili ang sinadyang hindi pagtukoy ng Hebreo sa tatanggap o nilalaman ng basbas.
