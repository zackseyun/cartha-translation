  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: tl
  text: Kaya tuliin ninyo[a] ang balat sa ari ng inyong puso[b], at huwag na ninyong patigasin ang inyong batok[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At tuliin ninyo.” Maaaring payak na pang-ugnay ang salitang Hebreo, bagaman sinusuportahan din ng konteksto ang diwang “Kaya” o “Samakatuwid.”
    reason: lexical_alternative
  - marker: b
    text: Literal na pinananatili ng Hebreo ang metaporang “balat sa ari ng inyong puso,” isang larawan ng pag-aalis ng panloob na paglaban sa Diyos.
    reason: cultural_note
  - marker: c
    text: O, “huwag na ninyong gawing matigas ang inyong leeg,” o “huwag na kayong magmatigas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: Kaya tuliin ninyo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaking maramihan, kasama ang pang-ugnay, ay gumaganap bilang tuwirang utos sa kontekstong ito. Ipinahihiwatig ng “Kaya” ang lohikal na bunga ng naunang pahayag, habang pinananatili ang posibilidad na payak na pang-ugnay lamang ang waw sa talababa.
- source_word: עָרְלַת לְבַבְכֶם
  choice: ang balat ng masama ng inyong puso
  rationale: Pinananatili ang kongkretong metapora ng Hebreo—literal na balat ng masama ng puso—sa halip na palitan ito ng interpretatibong pariralang gaya ng “alisin ang katigasan ng puso.”
- source_word: לְבַבְכֶם
  choice: inyong puso
  rationale: Saklaw ng לֵבָב ang kalooban, pag-iisip, at panloob na pagkatao, ngunit ang “puso” ang natural at tradisyonal na katumbas sa Filipino at mahalaga sa mismong metapora.
- source_word: וְעָרְפְּכֶם
  choice: inyong batok
  rationale: Ang עֹרֶף ay tumutukoy sa batok o likod ng leeg. Mas tiyak ang “batok” kaysa “leeg” at pinananatili nito ang pisikal na larawan ng paglaban o pagmamatigas.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: huwag na ninyong patigasin
  rationale: Ang Hiphil ng קשׁה ay nangangahulugang gawing matigas. Ang “huwag na” ay natural na salin ng pagbabawal kasama ang עוֹד, na nagpapahiwatig ng hindi na pagpapatuloy.
theological_decisions:
- issue: Matalinghagang wikang tipan tungkol sa pagtutuli ng puso
  choice: 'Tahasan at kongkretong pinanatili ang larawan: “tuliin ninyo ang balat ng masama ng inyong puso.”'
  alternative: Linisin ninyo ang inyong puso; alisin ninyo ang katigasan ng inyong puso.
  rationale: Ginagamit ng talata ang tanda ng pagtutuli bilang larawan ng panloob na pagtugon at pagsunod. Ang pagpapanatili sa metapora ay umiiwas sa pagpapataw ng mas makitid na doktrinal na paliwanag at iniingatan ang ugnayan at tensiyon sa pagitan ng panlabas na tanda at panloob na katapatan.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang di-pangkaraniwan ngunit mahalagang metapora ng “balat ng masama ng puso.” Ginamit ang “batok” upang maging tapat sa pisikal na larawan ng Hebreo; nililinaw ng talababa ang mas karaniwang interpretatibong pagpapahayag.
