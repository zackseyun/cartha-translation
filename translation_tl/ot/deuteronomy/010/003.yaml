base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: tl
  text: Kaya gumawa ako ng isang kaban na yari sa kahoy na akasya, at hinugis ko ang dalawang tapyas na bato na tulad ng mga nauna[a]. Pagkatapos, umakyat ako sa bundok na dala ko sa kamay ang dalawang tapyas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tinabas ko ang dalawang tapyas na bato na tulad ng mga nauna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: kaban
  rationale: Ang אֲרוֹן ay isang lalagyan o kaban; ang “kaban” ay likas at marangal na salin sa konteksto ng sagradong lalagyan ng mga tapyas.
- source_word: עֲצֵי שִׁטִּים
  choice: kahoy na akasya
  rationale: Tinutukoy ng parirala ang kahoy mula sa akasya; malinaw at natural ito sa modernong Filipino.
- source_word: וָאֶפְסֹל
  choice: tumabas ako
  rationale: Ang פסל ay tumutukoy sa paghubog ng bato sa pamamagitan ng pagtabas o pag-ukit. Ang “tumabas” ay tiyak sa gawaing inilalarawan at hindi lipas ang tunog.
- source_word: לֻחֹת אֲבָנִים
  choice: mga tapyas na bato
  rationale: Ang לֻחֹת ay mga patag na piraso o tapyas. Iniiwasan ng saling ito ang posibleng makabagong kahulugan ng “tablet” habang pinananatili ang pisikal na larawan.
- source_word: כָּרִאשֹׁנִים
  choice: tulad ng mga nauna
  rationale: Pinananatili nito ang paghahambing sa unang pares ng mga tapyas nang hindi nagdaragdag ng detalye.
- source_word: וָאַעַל הָהָרָה
  choice: umakyat ako sa bundok
  rationale: Ipinahihiwatig ng עלה at ng panandang patungo ang aktuwal na pag-akyat sa bundok.
- source_word: בְּיָדִי
  choice: tangan
  rationale: Bagaman literal na “nasa aking kamay,” natural na ipinahahayag ng “tangan” sa Filipino ang pagdadala sa kamay at hindi nito binabago ang diwa.
- source_word: וָאַעַשׂ
  choice: gumawa ako
  rationale: Direkta at malawak ang kahulugan ng עשה; ang “gumawa” ang pinakanatural na katumbas sa konteksto.
theological_decisions:
- issue: Tawag sa sagradong lalagyan ng mga tapyas ng tipan
  choice: kaban
  alternative: baul o kahon
  rationale: Ang “kaban” ay nagpapanatili sa kinikilalang sagrado at pangtipang konteksto ng אֲרוֹן nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “kaban,” “kahoy na akasya,” at “mga tapyas na bato” bilang likas ngunit source-grounded na mga katumbas; pinanatili ang sunod-sunod na kilos sa unang panauhan.
