base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: tl
  text: Tunay ngang kay Yahweh na iyong Diyos ang kalangitan, maging ang pinakamataas na kalangitan,[a] ang lupa, at ang lahat ng naroon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang kalangitan at ang kalangitan ng kalangitan.”
    reason: Pinananatili ang literal na Hebreong pagpapasidhi sa tabi ng natural na saling “pinakamataas na kalangitan.”
lexical_decisions:
- source_word: הֵן
  choice: Tunay ngang
  rationale: Ang pantukoy sa diskurso ay humihingi ng pansin at nagbibigay-diin. Ang “Tunay ngang” ay marangal at natural sa makabagong Filipino nang hindi gumagamit ng masyadong literal ngunit di-likas na “Narito.”
- source_word: לַיהוָה
  choice: kay Yahweh ... ang
  rationale: Ipinahahayag ng ל ang pag-aari. Ang hulma na “kay Yahweh ... ang” ay likas na paraan sa Filipino upang sabihing sa kaniya nauukol o pag-aari ang mga binanggit.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Pinananatili nito ang ikalawang panauhang isahan at ang tipanang pagtukoy sa Diyos ng kausap.
- source_word: הַשָּׁמַיִם
  choice: ang kalangitan
  rationale: Saklaw ng “kalangitan” ang malawak na kosmikong diwa at mas angkop dito kaysa sa mas makitid na “langit” bilang himpapawid lamang.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: maging ang pinakamataas na kalangitan
  rationale: Ipinahahayag nito nang malinaw ang pagpapasidhi ng Hebreong pariralang “kalangitan ng kalangitan,” habang inilalagay sa talababa ang literal na anyo.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa pagtutumbas nito sa kalangitan at sa lahat ng naroon, ang tinutukoy ay ang buong daigdig; natural sa Filipino ang “lupa” sa pares na “langit at lupa.”
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: at ang lahat ng naroon
  rationale: Maikli at natural itong katumbas ng lahat ng nasa loob o saklaw ng lupa, nang hindi nililimitahan kung “nasa ibabaw” o “nasa loob.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Tunay ngang” para sa mariing הֵן at ang likas na konstruksiyong pag-aari na “kay Yahweh ... ang.”
