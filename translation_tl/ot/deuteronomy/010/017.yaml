  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: tl
  text: Sapagkat si Yahweh, ang inyong Diyos, ay Diyos ng mga diyos at Panginoon ng mga panginoon—ang dakila, makapangyarihan, at kasindak-sindak[a] na Diyos. Hindi siya nagtatangi at hindi tumatanggap ng suhol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dapat katakutan.” Ang Hebreo ay tumutukoy sa isang pumupukaw ng takot na may banal na paggalang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan o batayan ng naunang panawagan at pinananatili ang panandang sanhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Ang hulaping pangalawang panauhang maramihan ay tumutukoy sa Israel, at ang pangngalan ay may isahang diwa sa kontekstong ito.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: Diyos ng mga diyos
  rationale: Pinananatili ang Hebreong construct chain at ang pahayag ng kataas-taasang kapangyarihan nang hindi ipinapaliwanag ang ontolohiya ng ibang mga 'diyos'.
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: at Panginoon ng mga panginoon
  rationale: Natural at marangal na katumbas ng kapantay na titulong Hebreo.
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר
  choice: ang dakila, makapangyarihan ... na Diyos
  rationale: Inililipat ang appositional na serye sa natural na ayos sa Filipino habang pinananatili ang tatlong paglalarawan.
- source_word: וְהַנּוֹרָא
  choice: at kakila-kilabot
  rationale: Ipinahahayag ang isang Diyos na pumupukaw ng matinding takot at pagpipitagan; nililinaw ng talababa ang saklaw ng salita upang hindi ito maunawaang masama o kasuklam-suklam.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: Hindi siya nagtatangi
  rationale: Natural na salin ng idyomang literal na 'hindi nag-aangat ng mukha,' na nangangahulugang hindi kumikiling o nagpapabor.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: at hindi tumatanggap ng suhol
  rationale: Tuwiran at malinaw na salin na nagpapanatili sa legal at moral na diin.
theological_decisions:
- issue: Ang titulong 'Diyos ng mga diyos at Panginoon ng mga panginoon' at ang posibilidad na ipakahulugan itong pagkilala sa politeismo
  choice: Panatilihin ang pormulang 'Diyos ng mga diyos at Panginoon ng mga panginoon' bilang pahayag ng kataas-taasang kapangyarihan.
  alternative: Paraprasahin bilang 'Diyos na higit sa lahat ng tinatawag na diyos at panginoon.'
  rationale: Ang tuwirang pormula ang nasa Hebreo. Hindi dapat isingit sa pangunahing teksto ang isang paliwanag tungkol sa kalikasan o pag-iral ng ibang tinatawag na mga diyos.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pinananatili ang personal na pangalan sa anyong transliterado at hindi ito pinapalitan ng titulo.
- issue: Saklaw ng kahulugan ng הַנּוֹרָא
  choice: kakila-kilabot, na may talababa tungkol sa takot na may pagpipitagan
  alternative: kasindak-sindak o kagila-gilalas
  rationale: Pinananatili ang tensiyon sa pagitan ng sindak at pagpipitagan sa halip na gawing purong paghanga lamang ang salita.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “inyong” dahil maramihan ang kausap. Hinati sa dalawang pangungusap upang maging natural ang mahabang Hebreong pangungusap, at ginamit ang gitling-pahaba upang malinaw na iugnay ang kasunod na mga katangian kay Yahweh.
