base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: tl
  text: Sinabi ni Yahweh sa akin, “Tumindig ka at humayo ka sa unahan ng bayan sa paglalakbay[a], upang makapasok sila at angkinin ang lupain na ipinanumpa kong ibibigay sa kanilang mga ama[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “humayo sa unahan ng bayan upang maglakbay.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kanilang mga ama,” na tumutukoy sa kanilang mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: קוּם לֵךְ
  choice: Tumindig ka at humayo
  rationale: Ipinapahayag ng magkasunod na pautos ang agarang pagkilos; marangal at likas sa salaysay ang “tumindig” at “humayo.”
- source_word: לְמַסַּע לִפְנֵי הָעָם
  choice: humayo sa unahan ng bayan para sa paglalakbay
  rationale: Pinananatili ang larawang espasyal ng paglakad sa unahan at ang kahulugan ng מַסַּע bilang paglalakbay, nang hindi tahasang nilulutas ito bilang “pangunahan.”
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: upang makapasok sila at angkinin
  rationale: 'Ang magkasunod na pandiwa ay nagpapahayag ng layunin o bunga: pagpasok sa lupain at aktuwal na pag-aari rito.'
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto ng Deuteronomio, tumutukoy ito sa ipinangakong lupain; mas tiyak dito ang “lupain” kaysa pangkalahatang “lupa.”
- source_word: נִשְׁבַּעְתִּי
  choice: isinumpa ko
  rationale: Pinananatili ang taimtim na pananalita ng panunumpa ng Diyos.
- source_word: לַאֲבֹתָם
  choice: sa kanilang mga ninuno
  rationale: Likas sa modernong Filipino at malinaw na tumutukoy sa mga patriyarka; itinatala sa talababa ang literal na anyong “mga ama.”
- source_word: לָתֵת לָהֶם
  choice: ibibigay sa kanila
  rationale: Likas na Filipino para sa layuning ipinahayag ng pawatas sa Hebreo habang pinananatili ang Diyos bilang tagapagbigay.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ang “Yahweh” ay tuwirang transliterasyon ng personal na pangalan at hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng לִפְנֵי הָעָם
  choice: sa unahan ng bayan
  alternative: pangunahan ang bayan
  rationale: Pinananatili ng napiling anyo ang posisyong espasyal at ang posibleng pahiwatig ng pamumuno nang hindi ginagawang tahasan ang huli.
- issue: Paglilipat ng לַאֲבֹתָם
  choice: sa kanilang mga ninuno
  alternative: sa kanilang mga ama
  rationale: Tumutukoy ang salita sa mga naunang ama ng Israel. Ang “mga ninuno” ay malinaw at likas sa Filipino, samantalang pinananatili sa talababa ang literal at makasaysayang pananalita.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong עָם, “lupain” para sa ipinangakong teritoryo, at bahagyang mataas na rehistrong “humayo” at “isinumpa” upang umangkop sa tipang salaysay.
