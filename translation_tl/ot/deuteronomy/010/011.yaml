  - severity: low
    issue: Medyo di-likas ang “para sa paglalakbay.”
    rationale: Ang “sa paglalakbay” ay mas payak at likas na katumbas ng לְמַסַּע, habang iniiwan ang relasyon nito sa ‘sa unahan ng bayan’ na hindi sobrang ipinaliliwanag.
