revisions:
- from: Sinabi sa akin ni Yahweh, “Tumindig ka at humayo sa unahan ng bayan para sa paglalakbay[a], upang makapasok sila at angkinin ang lupaing isinumpa kong ibibigay sa kanilang mga ninuno[b].”
  to: Sinabi ni Yahweh sa akin, “Tumindig ka at humayo ka sa unahan ng bayan sa paglalakbay[a], upang makapasok sila at angkinin ang lupain na ipinanumpa kong ibibigay sa kanilang mga ama[b].”
  rationale: Pinalitan ang salitang maaaring mangahulugang ‘cursed’ ng “ipinanumpa,” upang malinaw na maipahayag ang panunumpa ni Yahweh. Inayos din ang pariralang ukol sa paglalakbay para sa mas likas na modernong Filipino. Pinanatili ang literal na “mga ama” sa pangunahing teksto at ang paliwanag na “mga ninuno” sa talababa.
