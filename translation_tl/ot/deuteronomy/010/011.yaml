  source_fidelity: 'Tumpak sa pangkalahatan ang daloy ng utos: tumindig, humayo sa unahan ng bayan para sa paglalakbay, at upang makapasok sila at angkinin ang lupain. Gayunman, ang “isinumpa kong ibibigay” ay sa modernong Filipino ay madaling maunawaang ‘isinumpa/cursed,’ hindi ‘sinumpaan.’ Kailangan ang mas malinaw na anyong nagpapahayag ng banal na panunumpa.'
  naturalness: Marangal at madaling maunawaan ang karamihan ng salin. Mas likas ang “sa paglalakbay” kaysa “para sa paglalakbay,” at nililinaw ng “ipinanumpa” ang kahulugang oath nang hindi nagiging maligoy.
  terminology: Ang “Yahweh,” “bayan,” “lupain,” at “angkinin” ay angkop. Ang “kanilang mga ama” ay pinananatili sa teksto upang igalang ang literal na panlalaking pantukoy sa Hebreo at ang historikal na pagtukoy sa mga patriyarka; ipinaliliwanag ng talababa ang idiomatikong saklaw nito.
