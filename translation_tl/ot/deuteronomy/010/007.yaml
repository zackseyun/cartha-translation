base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: tl
  text: Mula roon ay umalis sila patungo sa Gudgoda, at mula sa Gudgoda ay nagpatuloy sila patungo sa Jotbata, isang lupaing may mga batis ng tubig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lupaing may mga daluyan ng tubig” o “isang lupaing may mga wadi na may tubig.” Ang pariralang Hebreo na נַחֲלֵי מָיִם ay tumutukoy sa mga batis o mga daluyan ng umaagos na tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Mula roon
  rationale: Likas na Filipino para sa pag-alis mula sa naunang pook at malinaw na pinananatili ang pagkakasunod-sunod ng mga lugar.
- source_word: נָסְעוּ
  choice: naglakbay sila patungong
  rationale: Sa talaan ng paglalakbay, ang נסע ay tumutukoy sa pag-alis o pagpapatuloy ng paglalakbay. Ang pariralang ito ay malinaw at natural sa modernong Filipino.
- source_word: הַגֻּדְגֹּדָה
  choice: Gudgoda
  rationale: Pangalan ng lugar na isinatinig ayon sa anyong Hebreo at iniangkop sa karaniwang baybay sa Filipino.
- source_word: וּמִן
  choice: at mula sa
  rationale: Pinananatili ang payak na pagdurugtong at pinagmulan ng susunod na yugto ng paglalakbay nang hindi nagdaragdag ng interpretasyon.
- source_word: יָטְבָתָה
  choice: Jotbata
  rationale: Pangalan ng lugar na isinatinig sa paraang madaling basahin ng mga nagsasalita ng Filipino.
- source_word: אֶרֶץ
  choice: isang lupain
  rationale: Appositional na paglalarawan ito sa Jotbata; ang “lupain” ay natural at hindi nagpapahiwatig ng isang politikal na bansa.
- source_word: נַחֲלֵי מָיִם
  choice: may mga batis ng tubig
  rationale: Ang נַחַל ay maaaring tumukoy sa batis, daluyan ng tubig, o wadi. Ang “mga batis ng tubig” ay malinaw sa karaniwang mambabasa habang ang iba pang posibleng kahulugan ay inilalahad sa talababa.
