base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: tl
  text: Ako naman ay nanatili sa bundok, tulad noong una, nang apatnapung araw at apatnapung gabi, at pinakinggan din ako ni Yahweh[a] noong pagkakataong iyon; hindi ninais ni Yahweh na lipulin kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Dininig ako ni Yahweh.” Ang pandiwang Hebreo ay maaaring tumukoy kapuwa sa pagdinig at sa pakikinig na may kanais-nais na pagtugon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Ako naman
  rationale: Ipinahahayag ang banayad na pagbibigay-diin at pagbabalik sa salaysay na likas sa pangatnig at malayang panghalip.
- source_word: עָמַדְתִּי
  choice: nanatili
  rationale: Bagaman pangunahing nangangahulugang ‘tumayo,’ tumutukoy ito rito sa matagal na pananatili ni Moises sa bundok, hindi lamang sa tindig ng katawan.
- source_word: בָהָר
  choice: sa bundok
  rationale: Likas na pariralang Filipino para sa kinaroroonan ni Moises sa bundok.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: gaya noong unang pagkakataon
  rationale: Ang ‘mga unang araw’ ay tumutukoy sa naunang apatnapung-araw na pananatili; ipinahahayag ng salin ang paghahambing sa naunang pagkakataon.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: nang apatnapung araw at apatnapung gabi
  rationale: Tumpak at likas na paglalahad ng haba ng pananatili.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: pinakinggan ako ni Yahweh
  rationale: Napananatili ang diwa ng pakikinig na may kanais-nais na pagtugon, nang hindi tahasang dinaragdagan ang sinabi ng teksto.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: nang pagkakataong iyon din
  rationale: Ipinahahayag ang pag-uulit ng kanais-nais na pagtugon sa pagkakataong iyon.
- source_word: לֹא אָבָה
  choice: hindi ninais
  rationale: Pinananatili ang diwa ng pagkukusa o pagnanais, sa halip na gawing payak na pagtanggi lamang.
- source_word: הַשְׁחִיתֶךָ
  choice: na lipulin kayo
  rationale: Malinaw na ipinahahayag ang banta ng lubos na pagwasak sa Israel; ang panghalip ay maramihan sa konteksto.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng Hebreong teksto ang personal na pangalang YHWH. Ang ‘Yahweh’ ay tuwirang transliterasyon at hindi pamalit na titulo.
- issue: Diwa ng וַיִּשְׁמַע יְהוָה אֵלַי
  choice: pinakinggan ako ni Yahweh
  alternative: dininig ako ni Yahweh
  rationale: Ang pandiwa ay maaaring mangahulugan ng pagdinig at ng pakikinig na may pagsang-ayon o pagtugon. Pinananatili ng pangunahing salin ang personal at tumutugong diwa, habang inilalahad sa talababa ang tunay na alternatibo.
- issue: Pagpapahayag sa hindi paglipol ng Israel
  choice: hindi ninais ni Yahweh na lipulin kayo
  alternative: ayaw ni Yahweh na lipulin kayo; hindi pumayag si Yahweh na lipulin kayo
  rationale: Pinananatili ang tahasang volitional na puwersa ng לֹא אָבָה nang hindi nagpapasok ng paliwanag tungkol sa mekanismo ng pamamagitan ni Moises.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nanatili” bilang likas na kontekstuwal na katumbas ng עמד sa isang apatnapung-araw na pananatili. Inilagay ang talababa sa dulo ng pangungusap na kinabibilangan ng may-katuturang parirala.
