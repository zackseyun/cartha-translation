    issue: Ang 'gaya noong unang pagkakataon' ay hindi eksaktong katumbas ng paghahambing sa 'mga unang araw.'
    rationale: Ang כַּיָּמִים הָרִאשֹׁנִים ay literal na tumutukoy sa mga naunang araw, bagaman malinaw na ang tinutukoy ay ang naunang yugto ng apatnapung araw. Ang 'tulad noong una' ay parehong natural at mas malapit sa saklaw ng Hebreo.
  - severity: low
    issue: Ang footnote anchor ay nasa dulo ng pangungusap sa halip na kasunod ng 'pinakinggan ako ni Yahweh.'
    rationale: Ang talababa ay tumatalakay sa וַיִּשְׁמַע יְהוָה אֵלַי; ang paglalagay nito kaagad pagkatapos ng katumbas na parirala ay mas malinaw na pag-angkla.
