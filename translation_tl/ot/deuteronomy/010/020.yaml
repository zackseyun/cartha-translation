base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: tl
  text: Matakot ka kay Yahweh na iyong Diyos[a]; siya ang paglingkuran mo, sa kanya ka kumapit[b], at sa kanyang pangalan ka manumpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Igalang mo nang may pagpipitagan si Yahweh na iyong Diyos”; ang pandiwang Hebreo ay karaniwang tumutukoy sa takot na may pagpipitagan sa mga kontekstong tipan.
    reason: lexical_alternative
  - marker: b
    text: O “manatili kang mahigpit na nakaugnay sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang ipinapahayag ng anyong may hulaping ikalawang panauhang panlalaki at isahan ang tipanang kaugnayang “iyong Diyos.”
- source_word: תִּירָא
  choice: Matakot ka
  rationale: Pinananatili ng “matakot” ang tuwirang bigat ng ירא; sa kontekstong tipan, saklaw nito ang takot na may pagpipitagan.
- source_word: אֹתוֹ תַעֲבֹד
  choice: siya ang paglingkuran mo
  rationale: Ipinakikita ng ayos na ito ang diin sa nakaunang panghalip na “siya,” habang pinananatili ang pangunahing kahulugan ng עבד na “maglingkod,” kasama ang likas nitong pahiwatig ng pagsamba sa kontekstong ito.
- source_word: וּבוֹ תִדְבָּק
  choice: sa kanya ka kumapit
  rationale: Ang דבק na may ב ay nagsasaad ng mahigpit na pagkapit o pananatiling nakaugnay sa isang tao; malinaw at buhay ang “kumapit” bilang larawan ng katapatan sa tipan.
- source_word: וּבִשְׁמוֹ
  choice: sa kanyang pangalan
  rationale: Sa pariralang kasama ng שבע, ang ב ay nagpapakilala sa pangalan na pinagbabatayan o tinatawagan sa panunumpa; natural sa Filipino ang “sa kanyang pangalan.”
- source_word: תִּשָּׁבֵעַ
  choice: manumpa ka
  rationale: Tuwirang katumbas ng Niphal ng שבע ang “manumpa,” na nagpapanatili sa legal at tipanang diwa ng pananalita.
theological_decisions:
- issue: Anyo ng mga obligasyon sa tipan
  choice: 'Gumamit ng sunod-sunod na pautos: “Matakot ka… paglingkuran mo… kumapit… manumpa.”'
  alternative: 'Gumamit ng mga pahayag na may “dapat”: “Dapat kang matakot… maglingkod… kumapit… manumpa.”'
  rationale: Ang mga imperfect sa kontekstong legal at mapanghikayat ay gumaganap bilang mga utos. Mas natural sa modernong Filipino ang tahasang pautos at napapanatili nito ang bigat ng tipan.
- issue: Saklaw ng ירא sa kaugnayang tipan
  choice: “Matakot” sa pangunahing teksto, na may talababa tungkol sa pagpipitagan
  alternative: “Igalang nang may pagpipitagan” o “pagpitaganan”
  rationale: Hindi dapat pahupain ang tunay na diwa ng takot sa pandiwa, ngunit nililinaw ng talababa na sa kontekstong ito ay kasama ang malalim na pagpipitagan.
- issue: Diwa ng pagkapit sa Diyos
  choice: “sa kanya ka kumapit”
  alternative: “manatili kang tapat sa kanya”
  rationale: Pinananatili ng “kumapit” ang kongkretong talinghaga ng דבק at hinahayaang manatili ang mas malawak na pahiwatig nito ng malapit at matapat na ugnayan sa tipan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Yahweh” bilang personal na pangalan; pinanatili ang diin ng Hebreo sa “siya” at ang magkakasunod na lakas ng mga utos. Itinama ang pagkakaugnay ng mga pananda ng talababa upang ang [a] ay tumukoy sa “matakot” at ang [b] sa “kumapit.”
