base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: tl
  text: Naglakbay ang mga anak ni Israel mula sa Beerot Bene-Jaakan patungong Mosera.[a] Doon namatay si Aaron, at doon siya inilibing; at ang anak niyang si Eleazar ay naglingkod bilang pari kapalit niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Beerot Bene-Jaakan ay maaari ring unawain nang literal na “ang mga balon ng mga anak ni Jaakan,” ngunit isinalin dito sa baybay bilang pangalan ng lugar.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “naglingkod bilang pari pagkatapos niya.” Sa Hebreo, literal na “sa lugar niya,” na nagpapahiwatig ng paghalili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang literal na katawagang Hebreo at ang diwang ang bansang Israel ay nagmula kay Israel, habang natural pa rin sa makabagong Tagalog. Hindi ginawang tahasang “At” ang ו dahil nagsisilbi rito bilang maluwag na pang-ugnay sa salaysay.
- source_word: נָסְעוּ
  choice: naglakbay
  rationale: Sa salaysay ng paglalakbay sa ilang, ipinahihiwatig ng pandiwa ang pag-alis at pagpapatuloy sa susunod na lugar; malinaw at likas sa Tagalog ang “naglakbay.”
- source_word: מִ/בְּאֵרֹת בְּנֵי יַעֲקָן
  choice: mula sa Beerot Bene-Jaakan
  rationale: Itinuring ang buong parirala bilang pangalan ng lugar at tinumbasan ang prefiks na מִן ng “mula sa.”
- source_word: מוֹסֵרָה
  choice: patungong Mosera
  rationale: Kahit walang nakasulat na hiwalay na pang-ukol, ipinahihiwatig ng pormula ng paglalakbay ang destinasyon; natural itong ipinahayag sa Tagalog sa pamamagitan ng “patungong.”
- source_word: שָׁם
  choice: Doon … doon
  rationale: Inulit ang panandang panlunan upang mapanatili ang diin at pag-uulit sa Hebreo.
- source_word: מֵת אַהֲרֹן
  choice: namatay si Aaron
  rationale: Ginamit ang likas na ayos ng pangungusap sa Tagalog habang ang nauunang “Doon” ang nagpapanatili sa diin sa lugar.
- source_word: וַ/יִּקָּבֵר
  choice: siya inilibing
  rationale: Pinananatili ang balintiyak na diwa ng Niphal at hindi nagdagdag ng di-binanggit na tagapaglibing.
- source_word: וַ/יְכַהֵן
  choice: naglingkod bilang pari
  rationale: Ipinahahayag nito ang aktuwal na pagtupad sa tungkulin ng pari, hindi lamang ang paghirang o pagiging pari.
- source_word: אֶלְעָזָר בְּנוֹ תַּחְתָּיו
  choice: ang anak niyang si Eleazar … kapalit niya
  rationale: Ang “kapalit niya” ay likas na Tagalog para sa תַּחְתָּיו at malinaw na nagpapahiwatig ng paghalili sa tungkulin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mga pangalan ng lugar sa transliterasyon, ang pag-uulit ng “doon,” at ang genealogical-national na pariralang “mga anak ni Israel,” nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
