  text: וְ/אֶכְתֹּב֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְ/שַׂמְתָּ֖/ם בָּ/אָרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: tl
  text: At isusulat ko sa mga tapyas ang mga salitang noon ay nasa unang mga tapyas[a] na binasag mo. At ilagay mo ang mga iyon sa kaban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga utos”; sa Hebreo, “mga salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: At isusulat ko
  rationale: Ang Qal imperfect na unang panauhang isahan, na may pang-ugnay, ay nagpapahayag dito ng gagawin ng Diyos; natural at malinaw sa Tagalog ang payak na hinaharap.
- source_word: הַלֻּחֹת
  choice: mga tapyas
  rationale: Ang לוח ay isang patag na pirasong sinusulatan. Ang “mga tapyas” ay natural sa modernong Tagalog at hindi nagdaragdag ng “bato,” na hindi inuulit sa talatang ito bagaman nasa konteksto.
- source_word: הַדְּבָרִים
  choice: mga salita
  rationale: Pinananatili nito ang malawak at literal na diwa ng דבר bilang mga salitang nakasulat sa tipan, sa halip na agad itong bigyang-kahulugang “mga utos.”
- source_word: אֲשֶׁר הָיוּ
  choice: na nasa
  rationale: Bagaman literal na “na naroon,” mas likas sa Tagalog ang “na nasa” upang tukuyin ang mga salitang nakasulat sa mga tapyas.
- source_word: הָרִאשֹׁנִים
  choice: unang
  rationale: Malinaw nitong ipinakikita na ang tinutukoy ay ang naunang pares, na kaiba sa mga kapalit na tapyas.
- source_word: שִׁבַּרְתָּ
  choice: binasag mo
  rationale: Tumpak na inilalarawan ng “binasag” ang Piel perfect ng שבר nang hindi dinaragdagan ang paraan o tindi ng pagkabasag.
- source_word: וְשַׂמְתָּם
  choice: Pagkatapos, ilagay mo ang mga iyon
  rationale: Ang anyong perfect na may waw sa pagkakasunod ng mga tagubilin ay may puwersang pautos o prospektibo. Nililinaw ng “mga iyon” ang maramihang layon habang pinananatili ang natural na Tagalog.
- source_word: בָּאָרוֹן
  choice: sa kaban
  rationale: Sa kontekstong ito, ang ארון ay ang sagradong sisidlan o kaban. Ang “kaban” ang malinaw at nakaugaliang salin sa Tagalog; ang “sa” ay natural na nagpapahayag ng paglalagay sa loob nito.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa וְשַׂמְתָּם
  choice: Ang “mga iyon” ay tumutukoy sa mga tapyas.
  alternative: Maaari sa gramatika na tumukoy ang panghalip sa mga salita o mga utos na nakasulat sa mga tapyas.
  rationale: Parehong panlalaking maramihan sa Hebreo ang “mga tapyas” at “mga salita,” ngunit ang pisikal na paglalagay sa kaban at ang konteksto ng Deuteronomio 10:1–5 ay pinakamalinaw na tumutukoy sa mga tapyas.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang “mga tapyas” kaysa “mga tablet” upang maiwasan ang makabagong elektronikong kahulugan; hindi idinagdag ang “bato” dahil wala ito sa mismong talata. Hinati sa dalawang pangungusap para sa natural na daloy nang hindi binabago ang lohikal na pagkakasunod.
