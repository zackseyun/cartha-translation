base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: tl
  text: Siya ang iyong papuri[a], at siya ang iyong Diyos, na gumawa para sa iyo ng mga dakila at kagila-gilalas[b] na bagay na ito na nakita ng iyong mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “Siya ang iyong pinupuri” o “Siya ang iyong ipinagmamalaki.” Literal sa Hebreo: “Siya ang iyong papuri.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pumupukaw ng takot” o “nakatatakot.” Ang salitang Hebreo ay tumutukoy sa mga gawang pumupukaw kapuwa ng takot at taimtim na pagkamangha.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: iyong papuri
  rationale: 'Pinananatili nito ang maikli at matinding pananalita ng Hebreo: ang Diyos ang pinatutungkulan at batayan ng papuri ng Israel. Hindi ito nilinaw nang labis bilang “ang pinupuri mo,” upang mapanatili ang tunay na lawak ng kahulugan.'
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Likas at pamantayang salin ito ng tuwirang wikang tipan. Ang pang-isahang “iyong” ay nagpapanatili sa kolektibong pakikipag-usap sa Israel bilang isang kausap.
- source_word: עָשָׂה אִתְּךָ
  choice: gumawa para sa iyo
  rationale: Sa konteksto, ipinahihiwatig ng idyoma ang mga gawang isinagawa ng Diyos alang-alang sa Israel. Mas natural ito sa Tagalog kaysa sa literal na “gumawa kasama mo.”
- source_word: הַגְּדֹלֹת
  choice: mga dakilang bagay
  rationale: Ang pang-uri ay ginagamit bilang pangngalan sa Hebreo. Ang “dakila” ay nagpapanatili sa malawak na diwa nito at hindi ito nililimitahan sa kapangyarihan lamang.
- source_word: הַנּוֹרָאוֹת
  choice: mga kagila-gilalas na bagay
  rationale: Ipinahihiwatig ng salita ang mga gawang pumupukaw ng takot, paghanga, at pagpipitagan. Ang “kagila-gilalas” ay marangal at natural, bagaman inilalahad sa talababa ang mas matinding bahaging may takot.
- source_word: הָאֵלֶּה
  choice: mga ... bagay na ito
  rationale: Pinananatili ng “ito” ang pagiging tiyak at malapit ng mga gawang tinutukoy.
- source_word: רָאוּ עֵינֶיךָ
  choice: nakita ng iyong mga mata
  rationale: Pinananatili ang matingkad na idyomang Hebreo at ang diin sa personal na pagsaksi.
- source_word: הוּא ... וְהוּא
  choice: Siya ... at siya ...
  rationale: Ang pag-uulit ng panghalip ay nagpapanatili sa diin ng Hebreo nang hindi nagdaragdag ng salitang “lamang,” na hindi tahasang nasa talata.
theological_decisions:
- issue: Kahulugan ng predikatibong pariralang הוּא תְהִלָּתְךָ
  choice: Siya ang iyong papuri
  alternative: Siya ang iyong pinupuri; Siya ang iyong ipinagmamalaki
  rationale: Pinananatili ng pangunahing salin ang siksik na teolohikal at patulang pahayag na ang Diyos ay kapuwa pinatutungkulan at batayan ng papuri ng Israel. Ang mga alternatibo ay mas nagpapaliwanag ngunit nagpapakitid sa saklaw.
- issue: Diwa ng הַנּוֹרָאוֹת
  choice: kagila-gilalas na mga bagay
  alternative: mga bagay na pumupukaw ng takot; nakatatakot na mga bagay
  rationale: Ipinahahayag ng salin ang taimtim na pagkamangha at pagpipitagan, habang kinikilala sa talababa na kasama sa salitang Hebreo ang tunay na diwa ng takot at hindi lamang paghanga.
translation_notes:
  register: Makabago at marangal na Filipino, na may bahagyang patulang anyo upang mapanatili ang siksik na pahayag ng Hebreo. Ginamit ang “iyong” sa halip na “mo” upang panatilihin ang pormal na himig at ang tuwirang pananalita sa Israel.
