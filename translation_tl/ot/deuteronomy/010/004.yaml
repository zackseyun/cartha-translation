base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: tl
  text: At isinulat niya sa mga tapyas na bato, gaya ng unang pagkakasulat, ang Sampung Salita[a] na sinabi ni Yahweh sa inyo sa bundok mula sa gitna ng apoy noong araw ng kapulungan; at ibinigay ni Yahweh sa akin ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayon sa tradisyon, “ang Sampung Utos.” Sa Hebreo, “ang sampung salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: At isinulat niya
  rationale: Karaniwang salaysay sa nagdaang panahon ang anyong Hebreo. Pinananatili ng “isinulat” ang ugnayan nito sa “pagkakasulat” sa kasunod na parirala.
- source_word: הַלֻּחֹת
  choice: mga tapyas
  rationale: Sa kontekstong ito, tumutukoy ang לֻחוֹת sa mga lapad at patag na pirasong sinusulatan. Natural sa Filipino ang “mga tapyas”; hindi idinagdag ang “bato” dahil hindi ito tahasang nasa talata.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: gaya ng unang pagkakasulat
  rationale: Pinananatili ng “gaya” ang paghahambing na ipinahihiwatig ng כ, at ng “pagkakasulat” ang kaugnayan sa pandiwang “isinulat.”
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: ang Sampung Salita
  rationale: Literal na “ang sampung salita” ang Hebreo. Ginawang pantanging katawagan ang kapitalisasyon; inilagay sa talababa ang tradisyonal na “Sampung Utos.”
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: na sinabi sa inyo ni Yahweh
  rationale: Malinaw sa Filipino ang naunang pagsasalita nang hindi kailangang gumamit ng artipisyal na katumbas ng English past perfect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
- source_word: בָּהָר
  choice: sa bundok
  rationale: Natural at tumpak na tumutukoy sa lugar ng paghahayag.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mula sa gitna ng apoy
  rationale: Pinananatili ang matingkad na larawan ng tinig na nagmumula sa loob o gitna ng apoy.
- source_word: בְּיוֹם הַקָּהָל
  choice: nang araw na nagtipon ang kapulungan
  rationale: Ipinahahayag nang natural sa Filipino ang araw ng pagtitipon, habang pinananatili ang kolektibong kahulugan ng קהל.
- source_word: וַיִּתְּנֵם יְהוָה אֵלָי
  choice: Pagkatapos, ibinigay sa akin ni Yahweh ang mga iyon
  rationale: Ang “ibinigay” ang tuwirang katumbas ng נתן. Nililinaw ng “mga iyon” ang maramihang hulapi nang hindi ipinipilit kung mga tapyas o mga salitang nakasulat ang gramatikal na tinutukoy.
theological_decisions:
- issue: Paglilipat sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Paglilipat sa עֲשֶׂרֶת הַדְּבָרִים
  choice: ang Sampung Salita
  alternative: ang Sampung Utos
  rationale: “Sampung salita” ang literal na pahayag ng Hebreo. Pinanatili sa talababa ang tradisyonal at interpretibong katawagang “Sampung Utos.”
- issue: Tinutukoy ng maramihang hulapi sa וַיִּתְּנֵם
  choice: ang mga iyon
  alternative: ang mga tapyas; ang Sampung Salita
  rationale: Maaaring unawain ang ibinigay bilang mga tapyas o bilang mga salitang kinakatawan ng mga tapyas. Hindi nilulutas nang tahasan ng salin ang bahagyang kalabuan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga tapyas” sa halip na mas teknikal na “mga tableta,” at ginawang sugnay ang “araw ng kapulungan” upang maging likas ang daloy. Ang marker na [a] ay inilagay pagkatapos ng “mga tapyas” alinsunod sa ibinigay na consultation layer, bagaman ang laman ng talababa ay nagpapaliwanag sa “Sampung Salita.”
