- from: At isinulat niya sa mga tapyas[a], gaya ng unang pagkakasulat, ang Sampung Salita na sinabi sa inyo ni Yahweh sa bundok, mula sa gitna ng apoy, nang araw na nagtipon ang kapulungan. Pagkatapos, ibinigay sa akin ni Yahweh ang mga iyon.
  to: At isinulat niya sa mga tapyas na bato, gaya ng unang pagkakasulat, ang Sampung Salita[a] na sinabi ni Yahweh sa inyo sa bundok mula sa gitna ng apoy noong araw ng kapulungan; at ibinigay ni Yahweh sa akin ang mga ito.
