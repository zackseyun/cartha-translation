base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: tl
  text: Pagkatapos, bumaling ako at bumaba mula sa bundok. Inilagay ko ang mga tapyas sa kaban na ginawa ko, at naroon ang mga iyon[a], gaya ng iniutos sa akin ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at naroon ang mga iyon.” Maaari ring ipahiwatig ng pananalita na nanatili roon ang mga tapyas hanggang sa panahon ng pagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: tumalikod ako
  rationale: Ang פנה ay nangangahulugang bumaling o tumalikod. Ang “tumalikod ako” ay natural sa Filipino at angkop sa pagkakasunod-sunod ng salaysay.
- source_word: וָאֵרֵד מִן הָהָר
  choice: bumaba mula sa bundok
  rationale: Tuwirang inilalarawan ng ירד ang pagbaba, at pinananatili ng “mula sa bundok” ang tiyak na anyo ng pariralang Hebreo.
- source_word: וָאָשִׂם
  choice: Inilagay ko
  rationale: Karaniwang kahulugan ng שׂים ang maglagay o maglapag; “inilagay” ang pinakanatural dito.
- source_word: הַלֻּחֹת
  choice: ang mga tapyas
  rationale: Tumutukoy ang לֻחוֹת sa mga lapad at patag na sulatan. Hindi idinagdag sa mismong talata ang “na bato,” yamang wala iyon sa sugnay na Hebreo at malinaw na sa naunang konteksto ang tinutukoy.
- source_word: בָּאָרוֹן
  choice: sa kaban
  rationale: Ang אָרוֹן ay isang kaban o sisidlan. “Kaban” ang nakagawiang salitang Filipino sa kontekstong tipan at likas ding nagsasaad dito ng paglalagay sa loob nito.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: na ginawa ko
  rationale: Pinananatili nito ang payak na perpektong anyo ng Hebreo nang hindi sapilitang nililinaw bilang tahasang pangnagdaan-sa-nakaraan.
- source_word: וַיִּהְיוּ שָׁם
  choice: at naroon ang mga iyon
  rationale: Malapit ito sa literal na estadibong pahayag ng Hebreo. Hindi nito sapilitang nilulutas kung simpleng naroon ang mga tapyas o binibigyang-diin na nanatili sila roon hanggang sa panahon ng pagsasalita.
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: gaya ng iniutos sa akin
  rationale: Ipinapahayag ng כַּאֲשֶׁר ang pagtutugma sa iniutos, at tuwirang kinakatawan ng “iniutos sa akin” ang pandiwa at hulaping unang panauhan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan nang hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Kung ang וַיִּהְיוּ שָׁם ay simpleng kalagayan o patuloy na pananatili
  choice: at naroon ang mga iyon
  alternative: at nanatili roon ang mga iyon
  rationale: Pinananatili ng pangunahing teksto ang tunay na posibilidad ng dalawang pagbasa. Ang ideya ng patuloy na pananatili ay makatwiran ngunit bahagyang mas interpretatibo, kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” para sa kontekstong tipan at “mga tapyas” upang hindi magdagdag sa talata ng salitang “bato,” bagaman iyon ang malinaw na tinutukoy sa konteksto.
