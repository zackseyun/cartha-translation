  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: tl
  text: Kaya mahalin ninyo ang dayuhang naninirahan[a], sapagkat naging mga dayuhang naninirahan din kayo sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dayuhan,” “nakikipanirahan,” o “residenteng dayuhan.” Ang salitang Hebreo na ger ay tumutukoy sa isang hindi katutubong naninirahan sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: Kaya ibigin ninyo
  rationale: Ang anyong mula sa אהב ay may puwersang pautos sa konteksto. Ipinahihiwatig ng pang-ugnay ang bunga ng naunang pahayag tungkol sa pag-ibig ng Diyos sa dayuhang naninirahan (tal. 18), kaya natural ang “Kaya.”
- source_word: הַ/גֵּר
  choice: ang dayuhang naninirahan sa piling ninyo
  rationale: Ang גֵּר ay hindi lamang nagdaraang estranghero kundi isang hindi katutubong naninirahan sa pamayanan at kadalasang mahina ang katayuang panlipunan. Nililinaw ng parirala ang parehong pagiging dayuhan at paninirahan niya sa gitna ng Israel.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan sa utos. Ang “sapagkat” ay malinaw, marangal, at natural sa kasalukuyang Filipino.
- source_word: גֵרִים
  choice: mga dayuhan
  rationale: Maramihan ito ng גֵּר. Sa pagtukoy sa karanasan ng Israel sa Ehipto, sapat at natural ang “mga dayuhan”; pinananatili pa rin ang ugnayang leksikal sa naunang parirala.
- source_word: הֱיִיתֶם
  choice: naging ... kayo
  rationale: Ang היה rito ay tumutukoy sa kalagayan ng Israel bilang mga dayuhan sa Ehipto. Ang “naging” ay likas sa Filipino sa ganitong pagsasalaysay ng dating kalagayan.
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang אֶרֶץ (“lupain”) at ang makasaysayang paraan ng pagpapahayag ng Hebreo nang hindi nagiging di-natural sa Filipino.
theological_decisions:
- issue: Ang panlipunang katawagang גֵּר sa kautusan ng tipan
  choice: dayuhang naninirahan sa piling ninyo
  alternative: dayuhan; nakikipamayan; estranghero
  rationale: Binibigyang-diin ng talata ang tungkulin ng Israel batay sa sarili nilang karanasan bilang mga tagalabas sa ibang lupain. Iniiwasan ng salin ang ideya ng isang dumaraan lamang at hindi rin ito nag-aangkat ng makabagong teknikal na kategoryang legal.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “ibigin” bilang malinaw na pautos at ang mas mahabang “dayuhang naninirahan sa piling ninyo” upang maipahayag ang saklaw ng גֵּר nang hindi umaasa sa teknikal o lumang katawagan.
