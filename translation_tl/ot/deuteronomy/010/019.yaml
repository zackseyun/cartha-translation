  source_fidelity: Kailangang alisin ang “sa piling ninyo,” sapagkat wala itong tuwirang katumbas sa Hebreo. Ang גֵּר ay naninirahang hindi katutubo, ngunit hindi tinutukoy ng talata ang “piling ninyo” sa mismong pananalita nito. Dapat ding maging magkakatugma ang salin ng גֵּר at גֵרִים.
  naturalness: Natural at malinaw ang ayos na “Kaya mahalin ninyo ... sapagkat naging ... kayo sa lupain ng Ehipto.” Ang “mahalin” ay mas karaniwan sa makabagong Filipino kaysa “ibigin,” habang nananatiling marangal ang rehistro.
  terminology: “Dayuhang naninirahan” ay angkop para sa ger at dapat gamitin sa isahan at maramihan. Ang tala ay dapat magbigay ng tunay na mga alternatibo at huwag ilista muli ang piniling anyo bilang alternatibo.
  issues:
  - severity: medium
    issue: Idinagdag ang “sa piling ninyo.”
    rationale: Ang Hebreo ay “mahalin ninyo ang ger”; hindi nito tahasang sinasabing “sa piling ninyo.” Ang paninirahan sa Israel ay saklaw ng kahulugan ng ger at maaaring ipaliwanag sa tala, ngunit ang dagdag na pariralang ito ay hindi dapat ilagay sa pangunahing salin.
  - severity: low
    issue: Hindi ganap na magkatugma ang pagsasalin sa isahan at maramihang anyo ng ger.
    rationale: Ang “dayuhang naninirahan” sa unang bahagi ngunit “mga dayuhan” sa ikalawa ay nagpapahina sa leksikal na ugnayang malinaw na nasa Hebreo.
  - severity: low
    issue: Hindi angkop ang “nakikipamayan” bilang alternatibong katumbas sa tala.
    rationale: Hindi ito tuwirang pangngalang katumbas ng ger sa ganitong gamit; mas malinaw ang “dayuhan,” “nakikipanirahan,” o “residenteng dayuhan,” na may kaukulang paliwanag.
