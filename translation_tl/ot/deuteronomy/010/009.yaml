id: DEU.10.9
reference: Deuteronomy 10:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: tl
  text: Kaya si Levi ay walang bahagi o mana kasama ng kanyang mga kapatid[a]; si Yahweh ang kanyang mana[b], gaya ng sinabi sa kanya ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kasama ng kanyang mga kapatid.” Ang pang-isahang “Levi” ay kumakatawan sa lipi ni Levi, na inihahambing sa iba pang mga lipi ng Israel.
    reason: cultural_note
  - marker: b
    text: Maaari ring “si Yahweh ang kanyang bahagi.” Inuulit ng Hebreo ang salitang tumutukoy sa mana upang idiin na ang bahagi ni Levi ay hindi lupain kundi si Yahweh mismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Ipinahahayag nito ang konklusyon mula sa naunang konteksto at natural itong pakinggan sa makabagong Tagalog.
- source_word: לְלֵוִי
  choice: si Levi
  rationale: Pinananatili ang pang-isahang pangalang ginamit sa Hebreo, na kumakatawan dito sa buong lipi ni Levi.
- source_word: חֵלֶק
  choice: bahagi
  rationale: Ang “bahagi” ay malinaw na tumutukoy sa nakalaang parte sa paghahati ng lupain at hindi nito ipinapantay nang lubusan ang salita sa kasunod na “mana.”
- source_word: נַחֲלָה
  choice: mana
  rationale: Ang “mana” ay natural sa Tagalog at nagpapanatili sa diwang pampamilya, pangtipan, at panlupain ng terminong Hebreo.
- source_word: עִם אֶחָיו
  choice: kasama ng kanyang mga kapatid
  rationale: Pinananatili ang tahasang panlalaking katawagang pangkamag-anak ng Hebreo; ipinapaliwanag sa talababa na mga kapwa lipi ng Israel ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang banal sa halip na palitan ito ng titulong “Panginoon.”
- source_word: הוּא נַחֲלָתוֹ
  choice: si Yahweh ang kanyang mana
  rationale: Inuulit ang “mana,” gaya ng Hebreo, upang idiin ang kaibahan sa pagitan ng mana sa lupain at ni Yahweh mismo bilang mana ni Levi.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: gaya ng sinabi
  rationale: Ang pandiwa ay “nagsalita/nagsabi,” hindi tahasang “nangako”; natural ang “sinabi” sa Tagalog at hindi nagdaragdag ng kahulugan.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang pang-isahang ikalawang panauhan sa pormulang tipan ng pakikipag-usap ni Moises sa Israel.
- source_word: לוֹ
  choice: sa kanya
  rationale: Tuwirang isinasalin ang pang-isahang panghalip, na tumutukoy kay Levi bilang kinatawan ng lipi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan sa halip na gawing titulo.
- issue: Ang panlalaking katawagang אֶחָיו
  choice: kanyang mga kapatid
  alternative: kanyang mga kalipi sa Israel
  rationale: Pinananatili ang anyo at talinghaga ng Hebreo, habang nililinaw sa talababa ang kolektibong kahulugan sa konteksto.
- issue: Si Levi bilang pang-isahang kinatawan ng lipi
  choice: si Levi ay walang bahagi o mana
  alternative: ang lipi ni Levi ay walang bahagi o mana
  rationale: Pang-isahang pangalang “Levi” ang ginamit ng Hebreo. Ang kolektibong pagtukoy nito sa lipi ay ipinaliliwanag sa talababa sa halip na isingit sa pangunahing teksto.
- issue: Si Yahweh bilang mana ni Levi
  choice: si Yahweh ang kanyang mana
  alternative: si Yahweh ang kanyang bahagi
  rationale: 'Ang pag-uulit sa “mana” ay nagpapanatili sa sadyang ugnayang leksikal at sa teolohikal na tensiyon: walang manang lupain si Levi sapagkat si Yahweh mismo ang kanyang mana.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pangalang “Yahweh,” ang pang-isahang “Levi,” at ang pag-uulit ng “mana.” Ginamit ang “kanyang” at “iyong” bilang karaniwang makabagong baybay at pananalita.
