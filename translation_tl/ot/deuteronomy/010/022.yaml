base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: tl
  text: Ang iyong mga ninuno[a] ay bumaba patungong Ehipto na pitumpung katao, at ngayo’y ginawa ka ni Yahweh, ang iyong Diyos, na kasindami ng mga bituin sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “iyong mga ama.” Dito, tumutukoy ito sa mga ninuno ng Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: pitumpung katao
  rationale: Ang נֶפֶשׁ ay ginagamit dito bilang pantawag sa binibilang na mga tao, hindi bilang teknikal na pagtukoy sa di-materyal na “kaluluwa.” Likas at malinaw sa modernong Tagalog ang “pitumpung katao.”
- source_word: יָרְדוּ
  choice: bumaba sila
  rationale: Pinananatili ng “bumaba” ang karaniwang Hebreong paglalarawan sa paglalakbay patungong Ehipto at ang payak na aspektong pasalaysay ng pandiwa.
- source_word: אֲבֹתֶיךָ
  choice: iyong mga ninuno
  rationale: Bagaman literal na “iyong mga ama,” ang tinutukoy ay ang mga naunang salinlahi ng Israel. Mas natural at hindi nakalilitong Tagalog ang “mga ninuno,” habang inilalahad sa talababa ang literal na anyo.
- source_word: מִצְרָיְמָה
  choice: sa Ehipto
  rationale: Ipinahihiwatig ng hulaping paturol sa Hebreo ang pagkilos patungong Ehipto; natural itong ipinahahayag sa Tagalog sa “sa Ehipto.”
- source_word: וְעַתָּה
  choice: at ngayo’y
  rationale: Pinananatili nito ang payak na pag-uugnay ng Hebreo at ang paghahambing sa maliit na bilang noon at sa napakaraming bilang ngayon nang hindi ginagawang tahasang pagsalungat ang pangatnig.
- source_word: שָׂמְךָ
  choice: ginawa ka
  rationale: Ang literal na “inilagay/itinalaga ka” ay may diwang nagdulot ng isang kalagayan sa kontekstong ito; malinaw na naihahatid iyon ng “ginawa ka.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang pangalan ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang katumbas ito ng anyong may hulaping ikalawang panauhang isahan, na tumutukoy sa Israel bilang isang sambayanan.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: kasindami ng mga bituin sa langit
  rationale: Ipinahahayag ng לָרֹב na ang punto ng paghahambing ay ang napakaraming bilang. Likas sa Tagalog ang “kasindami,” at pinananatili nito ang larawan ng mga bituin sa langit.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova o PANGINOON
  rationale: Pangngalang pantangi ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na halinhan ito ng titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Paglalahad sa אֲבֹתֶיךָ
  choice: iyong mga ninuno
  alternative: iyong mga ama
  rationale: Literal na panlalaking pangmaramihan ang Hebreo, ngunit sa konteksto ay tumutukoy ito sa mga ninunong pinagmulan ng Israel. Ginagamit sa pangunahing teksto ang malinaw na kahulugang pangkaugnayan, habang pinananatili sa talababa ang literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang kolektibong isahang “ka” dahil ang Israel ay kinakausap sa Hebreo bilang isang sambayanan. Ginamit ang “at ngayo’y” upang mapanatili ang ugnayan at banayad na paghahambing ng dalawang sugnay.
