base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: tl
  text: Iginagawad niya ang katarungan sa ulila[a] at sa biyuda, at iniibig niya ang dayuhang naninirahan[b], na binibigyan niya ng pagkain at kasuotan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang ama.” Ang Hebreong יָתוֹם ay tumutukoy sa isang taong pinagkaitan ng ama; ang “ulila” ay isang malapit na salin sa Filipino.
    reason: lexical_alternative
  - marker: b
    text: O “dayuhang residente” o “dayuhan.” Ang Hebreong גֵּר ay tumutukoy sa isang hindi katutubong naninirahan sa gitna ng Israel, hindi lamang sa isang dumaraang estranghero.
    reason: lexical_alternative
  - marker: c
    text: Literal na “tinapay at kasuotan.” Ginamit ang “pagkain” upang ipahayag ang diwa ng pangunahing panustos.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: ipinagkakaloob ang katarungan
  rationale: Ang parirala ay tumutukoy sa aktibong pagtiyak o pagsasakatuparan ng katarungang nararapat sa mahihina, hindi lamang sa paghatol sa isang kaso.
- source_word: יָתוֹם
  choice: ulila
  rationale: Ito ang natural na katawagang Filipino para sa batang nawalan ng magulang; nililinaw sa talababa na sa Hebreo ay partikular na batang walang ama.
- source_word: אַלְמָנָה
  choice: biyuda
  rationale: Karaniwan, malinaw, at tumpak na katawagan sa modernong Filipino para sa babaeng namatayan ng asawa.
- source_word: אֹהֵב
  choice: iniibig
  rationale: Tuwirang pinananatili ang aktibong pagmamahal ng Diyos at ang marangal na tono ng talata.
- source_word: גֵּר
  choice: dayuhang naninirahan sa kanilang piling
  rationale: Ipinahihiwatig nito ang isang hindi katutubo na naninirahan sa gitna ng Israel, hindi isang dumaraan lamang na estranghero.
- source_word: לָתֶת לוֹ
  choice: na binibigyan niya
  rationale: Ipinakikita nitong nahahayag sa kongkretong pagkakaloob ang pag-ibig na binanggit sa naunang sugnay.
- source_word: לֶחֶם
  choice: pagkain
  rationale: Bagaman literal na 'tinapay,' ginagamit ito rito para sa pangunahing ikabubuhay, kaya natural at tumpak sa Filipino ang 'pagkain.'
- source_word: שִׂמְלָה
  choice: kasuotan
  rationale: Saklaw nito ang pangkalahatang kahulugan ng damit bilang pangunahing pangangailangan.
theological_decisions:
- issue: Pagmamalasakit ng Diyos sa mga mahihinang kasapi ng lipunan
  choice: Ilarawan kapuwa ang aktibong pagkakaloob ng Diyos ng katarungan at ang pag-ibig niyang nahahayag sa materyal na pagtustos.
  alternative: Ituon lamang ang salin sa legal na pagtatanggol o, sa kabilang banda, sa damdamin ng habag.
  rationale: Magkasamang inilalahad ng Hebreo ang katarungang isinasagawa, pag-ibig, at kongkretong paglalaan; pinananatili ng salin ang mga aspektong ito nang hindi nagdaragdag ng mas malawak na doktrina.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “biyuda” bilang mas karaniwan kaysa “balo” sa ilang konteksto, at ang mas mahabang “dayuhang naninirahan sa kanilang piling” upang maipaliwanag sa mismong teksto ang panlipunan at legal na diwa ng גֵּר.
