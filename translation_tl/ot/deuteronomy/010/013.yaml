  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: tl
  text: na tuparin ang mga utos ni Yahweh at ang kanyang mga tuntunin na iniuutos ko sa iyo ngayon para sa iyong ikabubuti?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sundin” o “ingatan” ang mga utos ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: na tuparin
  rationale: Ang infinitibong may ל ay nagpapatuloy sa hinihingi sa naunang talata. Likas sa makabagong Filipino ang “tuparin” para sa aktuwal na pagsunod sa mga utos, habang pinananatili ang diwang tipan ng שׁמר.
- source_word: מִצְוֺת
  choice: mga utos
  rationale: Tumutukoy ang pangmaramihang anyong construct sa mga obligasyong iniutos ni Yahweh. Malinaw at karaniwan sa Filipino ang “mga utos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: חֻקֹּתָיו
  choice: ang kanyang mga tuntunin
  rationale: Ang חֻקִּים ay mga itinakdang alituntunin o batas. Ang “mga tuntunin” ay natural at marangal na Filipino at naihihiwalay nang sapat sa “mga utos.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Pinananatili ng kasalukuyang aspektong “iniuutos” ang agarang diin ng participle at ng “ngayon.” Ang sugnay ay natural na mauunawaang tumutukoy sa kapwa mga utos at mga tuntunin.
- source_word: לְטוֹב לָךְ
  choice: para sa iyong ikabubuti
  rationale: Ipinahahayag nito ang kapaki-pakinabang na layunin o bunga. Ang “para sa iyong ikabubuti” ay malinaw, maikli, at likas sa Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng לְטוֹב לָךְ sa ipinag-uutos
  choice: para sa iyong ikabubuti
  alternative: upang mapabuti ka
  rationale: Pinananatili ang posibilidad na ang parirala ay magpahayag ng layunin o kapaki-pakinabang na bunga, nang hindi ito labis na nililinaw.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Pinanatili ang tanong dahil ang talata ay pagpapatuloy ng tanong na nagsimula sa naunang talata. Ginamit ang “tuparin” bilang natural na pangunahing katumbas ng covenantal na שׁמר, at inilagay sa talababa ang mga tunay na alternatibo.
