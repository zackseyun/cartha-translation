revisions:
- from: Gayunman, sa inyong mga ninuno itinuon ni Yahweh ang kanyang pagmamahal upang ibigin sila[a], at pinili niya ang kanilang mga supling na sumunod sa kanila—kayo—mula sa lahat ng mga bayan, gaya ng makikita sa araw na ito.
  to: Gayunman, sa inyong mga ninuno itinuon ni Yahweh ang kanyang pagmamahal upang mahalin sila[a], at pinili niya ang mga inapo nila—kayo—mula sa lahat ng mga bayan, gaya ng kalagayan ngayon.
  rationale: Pinalitan ang pariralang maaaring magpahiwatig ng pagtatalima ng mga supling ng “mga inapo nila,” na malinaw na naghahatid ng kolektibong diwa ng זַרְעָם אַחֲרֵיהֶם. Pinasimple rin ang pangwakas upang maipahayag ang kasalukuyang katayuang tinutukoy ng כַּיּוֹם הַזֶּה nang walang idinagdag na ideya. Ang alternatibong salin sa talababa ay nananatiling angkop.
