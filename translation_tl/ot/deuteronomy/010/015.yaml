  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: tl
  text: Gayunman, sa inyong mga ninuno itinuon ni Yahweh ang kanyang pagmamahal upang mahalin sila[a], at pinili niya ang mga inapo nila—kayo—mula sa lahat ng mga bayan, gaya ng kalagayan ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tanging sa inyong mga ninuno nalugod si Yahweh upang mahalin sila.”
    reason: Pinananatili ang posibleng restriktibong kahulugan ng רַק at ang alternatibong paglalarawan sa חָשַׁק bilang pagkalugod.
lexical_decisions:
- source_word: רַק
  choice: Gayunman
  rationale: Ipinahihiwatig nito ang mariing pagsalungat sa naunang pahayag na kay Yahweh ang langit at lupa, habang pinananatili ang nakakagulat na pagiging natatangi ng pagpili niya. Inilalagay sa talababa ang posibleng mahigpit na kahulugang “Tanging.”
- source_word: בַּאֲבֹתֶיךָ חָשַׁק יְהוָה
  choice: sa inyong mga ninuno itinuon ni Yahweh ang kanyang pagmamahal
  rationale: Ang חָשַׁק na may בְּ ay nagpapahayag ng matinding kusang pagkagiliw o pagkakaugnay sa isang tao. Ang “itinuon ... ang kanyang pagmamahal” ay natural at marangal sa modernong Filipino, at hindi nagmumungkahi ng panandaliang pagkahumaling.
- source_word: לְאַהֲבָה אֹתָם
  choice: upang ibigin sila
  rationale: Pinananatili ang layon o resultang ipinahihiwatig ng infinitibo at ang tahasang bokabularyo ng pag-ibig.
- source_word: וַיִּבְחַר
  choice: at pinili niya
  rationale: Direkta at karaniwang salin ng בחר, na hindi nagpapalabo o nagpapalawak sa pahayag tungkol sa pagpili ng Diyos.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: ang kanilang mga supling na sumunod sa kanila
  rationale: Ang זֶרַע ay kolektibong tumutukoy sa mga inapo. Ang “mga supling” ay malinaw sa kasalukuyang Filipino, at ipinapakita ng “na sumunod sa kanila” ang temporal na diwa ng אַחֲרֵיהֶם.
- source_word: בָּכֶם
  choice: —kayo—
  rationale: Ang panghalip ay nasa aposisyon at tahasang kinikilalang ang kasalukuyang kausap ang mga supling na pinili.
- source_word: מִכָּל הָעַמִּים
  choice: mula sa lahat ng mga bayan
  rationale: Pinananatili ng “mga bayan” ang kahulugan ng עַמִּים bilang mga pangkat ng tao, sa halip na limitahan ito sa mga estadong politikal.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng makikita sa araw na ito
  rationale: Ipinapahayag ng idyoma ang kasalukuyang kalagayan bilang nakikitang patunay ng sinabi, sa natural ngunit pormal na Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Wika ng banal na pagpili
  choice: Panatilihin nang tahasan ang pagmamahal at pagpili ni Yahweh sa mga ninuno at sa kanilang mga supling.
  alternative: Palambutin ito bilang simpleng pagkiling o palawakin bilang isang ganap na sistemang teolohikal tungkol sa pagpili.
  rationale: Tahasan sa Hebreo ang kusang pagmamahal at pagpili ni Yahweh. Pinananatili ng salin ang tensiyong ito nang hindi ito pinahihina o ikinukulong sa isang kalaunang doktrinal na balangkas.
- issue: Saklaw ng רַק
  choice: Gawing “Gayunman” sa pangunahing teksto at ilagay ang mahigpit na “Tanging” bilang alternatibo sa talababa.
  alternative: Isalin lamang bilang “Tanging,” na higit na nagtatampok sa restriksiyon kaysa sa pagsalungat sa naunang talata.
  rationale: Maaaring magkaroon ang רַק ng restriktibo o adversatibong diin sa kontekstong ito. Pinananatili ng pangunahing teksto at talababa ang tunay na leksikal na posibilidad nang hindi sapilitang nilulutas ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga ninuno,” “mga supling,” at “mga bayan” bilang pangkaraniwang bokabularyo; iniwasan ang arkaiko o labis na teknikal na pananalita. Ang gitling na em dash ay malinaw na nagmamarka sa aposisyong “kayo.”
