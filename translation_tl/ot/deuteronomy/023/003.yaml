source:
  edition: WLC
  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: tl
  text: Ang sinumang ipinanganak na hindi lehitimo[a] ay hindi maaaring pumasok sa kapulungan ni Yahweh. Kahit hanggang sa ikasampung salinlahi, walang sinuman sa kanyang mga inapo ang maaaring pumasok sa kapulungan ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong מַמְזֵר (mamzer) ay tumutukoy sa isang taong may kapanganakang itinuturing na hindi lehitimo o kaya’y hindi tanggap sa loob ng sambayanan. Tradisyonal din itong isinasaling “anak sa labas,” ngunit hindi ganap na tiyak ang eksaktong saklaw ng salita.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  choice: sinumang ipinanganak na hindi lehitimo
  rationale: Ipinahahayag nito ang katayuang kaugnay ng kapanganakan nang hindi ginagamit bilang pangunahing salin ang mapanlait at mas makitid na katawagang “anak sa labas.” Nililinaw sa talababa na hindi ganap na tiyak ang saklaw ng terminong Hebreo.
- source_word: יָבֹא
  choice: maaaring pumasok
  rationale: Literal itong “pumasok” o “dumating,” ngunit sa kontekstong legal, likas na ipinahahayag ng “hindi maaaring pumasok” ang pagbabawal sa pagtanggap o pakikibahagi.
- source_word: קְהַל יְהוָה
  choice: kapulungan ni Yahweh
  rationale: Ang “kapulungan” ay malinaw at marangal na katumbas ng קהל bilang nagkakatipong sambayanan; pinananatili ang pangalang Yahweh para sa יהוה.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: kahit hanggang sa ikasampung salinlahi
  rationale: Pinananatili nito ang diin at saklaw ng pormulang Hebreo tungkol sa pagpapatuloy ng pagbabawal hanggang sa ikasampung henerasyon.
- source_word: לֹא יָבֹא לוֹ
  choice: walang sinuman sa kanyang mga inapo ang maaaring pumasok
  rationale: Sa konteksto ng kasunod na pagbanggit sa salinlahi, ang panghalip na לוֹ ay tumutukoy sa mga kabilang sa kanyang linya. Ginagawang malinaw ng salin ang pahiwatig nang hindi binabago ang diwa.
theological_decisions:
- issue: Pagbibigay-salin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng “kapulungan ni Yahweh”
  choice: Hindi tinukoy sa salin kung eksaktong anong mga karapatan o gawain ang saklaw ng pagpasok
  alternative: Ipaliwanag ito bilang pagsamba, pagkamamamayan, pag-aasawa, o panunungkulan
  rationale: Hindi nililinaw ng mismong talata ang tiyak na institusyonal na saklaw, kaya pinananatili ang tunay na kalabuan at iniiwasan ang pagpasok ng isang partikular na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salinlahi” sa halip na “henerasyon” upang umangkop sa dignidad ng tekstong legal, habang nananatiling madaling maunawaan. Iniwasan ang salitang maaaring gamitin bilang tahasang insulto.
