translation_notes:
  register: Gumamit ng kasalukuyan, marangal, at madaling maunawaang Filipino. Ang “dapithapon” ay pamilyar at angkop sa temporal na tagubilin; ang “kampo” ay karaniwang modernong katawagan. Inilagay ang mga talababa sa mismong mga pariralang nililinaw ng mga ito.
