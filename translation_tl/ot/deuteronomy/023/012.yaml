  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: tl
  text: Sa dapithapon, maliligo siya sa tubig; at paglubog ng araw[a], maaari na siyang pumasok sa loob ng kampo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “pagpasok ng araw”; isang idyomang Hebreo para sa paglubog ng araw.
    reason: lexical_alternative
  - marker: b
    text: O “sa gitna ng kampo”; mas tiyak na ipinahihiwatig ng Hebreo ang pagpasok sa loob ng kampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לִפְנוֹת עֶרֶב
  choice: Sa dapithapon
  rationale: Ipinagpapatuloy ng וְהָיָה ang legal na tagubilin, samantalang ang לִפְנוֹת עֶרֶב ay tumutukoy sa paglapit o pagpatak ng gabi. Ang “Sa dapithapon” ay maikli, natural, at malinaw sa makabagong Filipino.
- source_word: יִרְחַץ בַּמָּיִם
  choice: maligo siya sa tubig
  rationale: Sa kontekstong ritwal, ang רחץ ay paghuhugas ng katawan. Mas natural sa Filipino ang “maligo siya sa tubig” kaysa sa literal ngunit mabigat na “hugasan niya ang kanyang sarili ng tubig.”
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: paglubog ng araw
  rationale: Literal na inilalarawan ng idyomang Hebreo ang “pagpasok” ng araw, ngunit ang karaniwang kahulugan nito ay paglubog ng araw. Isinasalin ang kahulugan habang itinatala sa talababa ang literal na larawan.
- source_word: יָבֹא
  choice: maaari na siyang pumasok
  rationale: Sa legal na konteksto, ipinahihiwatig ng pandiwa ang pinahihintulutang muling pagpasok matapos maligo at lumubog ang araw, hindi lamang isang pangyayaring magaganap.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: sa loob ng kampo
  rationale: Pinananatili ng “sa loob ng kampo” ang diin ng תּוֹךְ sa pagpasok sa interior ng kampo, ngunit mas natural ito kaysa sa “sa gitna ng kampo,” na maaaring magpahiwatig ng eksaktong sentro.
