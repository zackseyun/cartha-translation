revisions:
- from: Magdala ka rin ng tulos[a] kasama ng iyong kagamitan[b]. Kapag uupo ka sa labas[c], humukay ka sa pamamagitan nito; pagkatapos, bumaling ka at takpan ang iyong dumi.
  to: Magkaroon ka ng tulos[a] na kasama ng iyong kagamitan[b]. Kapag uupo ka sa labas[c], humukay ka sa pamamagitan nito; pagkatapos, bumalik ka at takpan ang iyong dumi.
  rationale: Inayos ang pambungad upang tumpak na maipahayag ang utos na magkaroon ng tulos nang walang idinagdag na diwang “magdala” o “rin.” Pinalitan ang “bumaling” ng “bumalik” upang maging mas likas at malinaw ang sunod-sunod na kilos. Pinanatili ang mga leksikal na ambigwidad sa talababa at ang mahinahong rehistro ng teksto.
