  - severity: low
    issue: Hindi gaanong tiyak ang “bumaling ka” sa kontekstong ito.
    rationale: Ang וְשַׁבְתָּ ay “bumalik/bumaling.” Sa sunod-sunod na kilos ng paghuhukay at pagtatakip, ang “bumalik ka” ay mas malinaw at pinananatili ang ambigwidad nang hindi nagpapasok ng dagdag na detalye.
