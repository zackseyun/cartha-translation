  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: tl
  text: Magkaroon ka ng tulos[a] na kasama ng iyong kagamitan[b]. Kapag uupo ka sa labas[c], humukay ka sa pamamagitan nito; pagkatapos, bumalik ka at takpan ang iyong dumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pantaya”; nauunawaan ito ng ilan ayon sa gamit nito bilang kasangkapang panghukay o maliit na pala.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa ibabaw ng iyong tainga.” Idiomatiko rito ang pananalitang Hebreo at malamang na tumutukoy sa kagamitang dala ng isang tao.
    reason: lexical_alternative
  - marker: c
    text: Sinasabi ng Hebreo na “kapag uupo ka sa labas,” isang mahinahong eupemismo para sa pagdumi.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: tulos
  rationale: Karaniwang tumutukoy ang pangngalan sa tulos o pantulos. Pinananatili ng “tulos” ang konkretong larawan ng Hebreo, habang ipinakikita ng kasunod na utos na ginagamit din ito sa paghuhukay.
- source_word: עַל אֲזֵנֶךָ
  choice: kasama ng iyong kagamitan
  rationale: Bagaman literal na “sa ibabaw ng iyong tainga,” idiomatiko ang parirala at sa konteksto ng kampo ay malamang na tumutukoy sa kagamitang dala ng isang tao. Natural sa Tagalog ang “kasama ng iyong kagamitan” at hindi nito ipinipilit ang di-tiyak na detalye.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: kapag uupo ka sa labas
  rationale: Pinananatili nito ang literal na kilos na “pag-upo sa labas” at ang mahinahong eupemismo ng Hebreo para sa pagdumi.
- source_word: וְחָפַרְתָּה בָהּ
  choice: humukay ka sa pamamagitan nito
  rationale: Tumutukoy ang pambabaeng panghalip pabalik sa יָתֵד. Hindi idinagdag ang “butas,” sapagkat ipinahihiwatig lamang iyon at hindi tahasang nasa Hebreo.
- source_word: וְשַׁבְתָּ
  choice: pagkatapos, bumaling ka
  rationale: Ang pandiwang שׁוב ay maaaring mangahulugang bumalik o bumaling. Sa sunod-sunod na kilos dito, natural ang “bumaling” at pinananatili nito ang ideya ng pagharap muli upang takpan ang dumi.
- source_word: צֵאָתֶךָ
  choice: iyong dumi
  rationale: Malinaw at likas sa modernong Tagalog ang “dumi” para sa dumi ng tao, at ang konteksto ay sapat upang alisin ang kalabuan nang hindi nagiging labis na klinikal o magaspang.
