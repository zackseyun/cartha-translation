  register: Modernong Filipino Tagalog na malinaw at marangal ang himig. Pinanatili ang eupemismo ng Hebreo at ang konkretong larawan ng “tulos,” habang ipinaliwanag sa mga talababa ang literal na idyoma at mga posibleng kahulugan.
