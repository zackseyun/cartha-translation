  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: tl
  text: Walang anak na babae ng Israel ang dapat maging prostitutang pangkulto, at walang anak na lalaki ng Israel ang dapat maging prostitutong pangkulto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “prostitutang/prostitutong pangtemplo.” Mas literal, “babaeng/lalaking itinalaga”; ngunit ang mga terminong Hebreo ay tradisyonal na iniuugnay sa ipinagbabawal na gawaing seksuwal na kaugnay ng paganong pagsamba, kaya makaliligaw dito ang literal na salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: babaeng bayaran sa kultong pagsamba
  rationale: Ipinahahayag nito ang parehong kasarian at kaugnayan sa ipinagbabawal na pagsambang pangkulto. Iniwasan ang literal na “babaeng itinalaga,” na maaaring magbigay ng positibo o neutral na kahulugan na wala sa konteksto.
- source_word: קָדֵשׁ
  choice: lalaking bayaran sa kultong pagsamba
  rationale: Pinananatili ang tahasang panlalaking anyo at ang pagkakapantay ng dalawang sugnay, habang nililinaw ang kaugnayan sa gawaing seksuwal na pangkulto.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: Walang ... at walang ...
  rationale: Natural at mariing pormang legal sa modernong Tagalog para sa pagbabawal na ipinahahayag ng Hebreong konstruksyon.
- source_word: מִבְּנוֹת יִשְׂרָאֵל
  choice: mula sa mga anak na babae ng Israel
  rationale: Pinananatili ang literal na puwersa ng מִן at ang pambansa-pampamilyang pananalita ng Hebreo.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak na lalaki ng Israel
  rationale: Tumutugma sa unang sugnay at pinananatili ang sinadyang pagkakatapat ng mga anak na babae at mga anak na lalaki.
theological_decisions:
- issue: Kahulugan ng קְדֵשָׁה at קָדֵשׁ sa pagbabawal
  choice: Mga babae at lalaking sangkot sa bayarang gawaing seksuwal na kaugnay ng kultong pagsamba
  alternative: Mga taong itinalaga sa neutral na diwa, o mga taong imoral lamang sa pangkalahatan
  rationale: Sa kontekstong ito, teknikal at mapanuring mga katawagan ang mga salita. Hindi lamang pangkalahatang imoralidad ang tinutukoy, at makapagliligaw ang literal na “itinalaga.” Gayunman, ipinakikita ng talababa na may leksikal at historikal na usapin sa eksaktong katawagan.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang magkatapat na “babaeng bayaran” at “lalaking bayaran” sa halip na iisang hiram na katawagang “prostitute,” at pinanatili ang pormal na simetriya ng dalawang sugnay.
