  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: tl
  text: Huwag mong dalhin sa bahay ni Yahweh na iyong Diyos ang kita ng isang patutot o ang halaga ng isang aso[a] kaugnay ng anumang panata, sapagkat kapwa ang mga iyon ay kasuklam-suklam kay Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Posible ring ang ibig sabihin ay “ang kita ng isang lalaking patutot,” kung ang “aso” rito ay isang mapanlait na tawag sa isang lalaking patutot na kaugnay ng kulto.
    reason: Pinananatili nito ang isang mahalagang alternatibong pagbasa nang hindi inaalis sa pangunahing teksto ang literal at hindi tiyak na pananalita ng Hebreo.
lexical_decisions:
- source_word: תָבִיא
  choice: dalhin
  rationale: Ang Hiphil ng בוא ay tumutukoy sa pagdadala ng isang bagay papasok sa isang lugar. Likas at tuwiran sa Filipino ang “dalhin.”
- source_word: אֶתְנַן זוֹנָה
  choice: ang bayad sa isang patutot
  rationale: Ang אֶתְנַן ay bayad o upa, at ang זוֹנָה ay patutot. Tuwiran at malinaw ang salin nang hindi pinapalambot ang kahulugan.
- source_word: מְחִיר כֶּלֶב
  choice: ang halaga ng isang aso
  rationale: Karaniwang nangangahulugang halaga o presyo ang מְחִיר, at literal na “aso” ang כֶּלֶב. Pinananatili sa pangunahing teksto ang tahasang anyo ng Hebreo dahil pinagtatalunan ang posibleng idyomatikong kahulugan nito.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: sa bahay ni Yahweh na iyong Diyos
  rationale: Literal na “bahay” ang בֵּית; hindi ginamit ang “templo” upang maiwasan ang higit na tiyak at posibleng anakronistikong pagpapakahulugan. Isinalin ang banal na pangalan bilang “Yahweh.”
- source_word: לְכָל נֶדֶר
  choice: kaugnay ng anumang panata
  rationale: Ipinahihiwatig ng parirala ang layunin o pagkakataon ng pagdadala ng bayad. Pinananatili ng “kaugnay ng anumang panata” ang lawak nito nang hindi nagdaragdag ng di-tahasang “handog” o “pagtupad.”
- source_word: תוֹעֲבַת
  choice: kasuklam-suklam
  rationale: Malakas na salitang moral at panrelihiyon ang תוֹעֵבָה. Ang “kasuklam-suklam” ay natural, marangal, at nagpapanatili sa bigat ng termino.
- source_word: גַּם שְׁנֵיהֶם
  choice: kapwa ... ang mga iyon
  rationale: Malinaw na ipinakikitang saklaw ng paghatol ang dalawang bagay na kababanggit lamang.
theological_decisions:
- issue: Kahulugan ng כֶּלֶב sa pariralang מְחִיר כֶּלֶב
  choice: Literal na “aso” sa pangunahing teksto.
  alternative: “lalaking patutot,” o mapanlait na tawag sa isang lalaking patutot na kaugnay ng kulto
  rationale: Literal na “aso” ang leksima. Dahil hindi tiyak kung idyomatiko itong tumutukoy sa lalaking patutot, pinanatili ang tunay na kalabuan sa pamamagitan ng talababa sa halip na ipasok ang pinagtatalunang paliwanag sa pangunahing teksto.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginamit ang personal na pangalang “Yahweh” upang katawanin nang tuwiran ang Tetragrammaton sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patutot” bilang tuwiran ngunit hindi bulgar na katawagan. Iniwasan ang “templo,” “handog,” at “pagtupad” dahil higit na tiyak ang mga iyon kaysa sa tahasang sinasabi ng Hebreo.
