revisions:
- from: Huwag mong dalhin sa bahay ni Yahweh na iyong Diyos ang bayad sa isang patutot o ang halaga ng isang aso[a] kaugnay ng anumang panata, sapagkat kapwa kasuklam-suklam kay Yahweh na iyong Diyos ang mga iyon.
  to: Huwag mong dalhin sa bahay ni Yahweh na iyong Diyos ang kita ng isang patutot o ang halaga ng isang aso[a] kaugnay ng anumang panata, sapagkat kapwa ang mga iyon ay kasuklam-suklam kay Yahweh na iyong Diyos.
  rationale: Pinalitan ang “bayad sa” ng “kita ng” upang malinaw na tukuyin ang kabayarang nagmula sa prostitusyon, alinsunod sa construct na אֶתְנַן זוֹנָה. Inayos din ang huling sugnay para sa mas natural na modernong Filipino at inihanay ang talababa sa parehong paglilinaw. Hindi binabago ng mga ito ang literal na “aso” o ang nakatalang alternatibong pagbasa.
