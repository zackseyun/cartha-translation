  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: tl
  text: Magkaroon ka ng isang lugar sa labas ng kampo[a], at doon ka lalabas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kamay” (yad); dito ay malamang na idyomang tumutukoy sa isang itinakdang lugar. Isinasalin naman ito ng ilan bilang isang kasangkapan o tulos dahil sa kasunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: isang lugar
  rationale: Karaniwang nangangahulugang “kamay” ang יָד, ngunit sa kontekstong ito ay malamang na idyoma para sa isang itinakdang lugar. Natural at malinaw sa modernong Tagalog ang “isang lugar.”
- source_word: תִּהְיֶה לְךָ
  choice: Magkaroon ka
  rationale: Ang konstruksiyong היה + לְ ay nagpapahayag ng pag-aari o paglalaan. Inihahatid ng “Magkaroon ka” ang direktibang diwa nang natural sa Tagalog.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Tuwirang ipinahihiwatig ng parirala ang lokasyong lampas sa hangganan ng kampo.
- source_word: וְיָצָאתָ
  choice: at ... ka lalabas
  rationale: Ang qal ng יצא ay karaniwang “lumabas.” Ang anyong “lalabas” ay nagpapanatili sa utos na ipinahahayag sa pamamagitan ng imperpektong pandiwa sa kontekstong legal.
- source_word: שָׁמָּה
  choice: doon
  rationale: Itinuturo ng pang-abay ang lugar na kababanggit lamang.
- source_word: חוּץ
  choice: lalabas
  rationale: Ang panghuling חוּץ ay literal na “sa labas” at nagbibigay-diin sa paglabas. Sa Tagalog, likas na naipapaloob ang diwang ito sa “lalabas”; ang literal na “lalabas ka roon sa labas” ay masyadong paulit-ulit at hindi natural.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pangkaraniwan. Pinanatili ang direktibang tono ng legal na tagubilin, habang iniwasan ang hindi natural na pag-uulit sa hulihan.
