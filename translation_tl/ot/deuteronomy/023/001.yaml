  yaml_path: translation/ot/deuteronomy/023/001.yaml
  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: tl
  text: Hindi dapat kunin ng isang lalaki ang asawa ng kanyang ama[a], ni ilantad ang laylayan ng kanyang ama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pakasalan ang asawa ng kanyang ama.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “ilantad ang laylayan ng kanyang ama.” Isa itong seksuwal na eupemismo; maaari itong maunawaan bilang “ilantad ang kahubaran ng kanyang ama” o “lapastanganin ang higaan ng kanyang ama.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: kunin
  rationale: Ang לָקַח kasama ng “asawa” ay maaaring mangahulugang kunin bilang asawa o pakasalan. Pinananatili ng “kunin” ang anyo at kaunting lawak ng Hebreo, habang inilalagay sa talababa ang mas tiyak na “pakasalan.”
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tuwirang tinutukoy ng pangngalang panlalaki ang isang lalaki; natural itong inilagay sa balangkas na “Huwag ... ng isang lalaki.”
- source_word: אֵשֶׁת אָבִיו
  choice: ang asawa ng kanyang ama
  rationale: Pinananatili nito ang legal at pampamilyang ugnayan nang hindi ito pinakikitid sa “madrasta,” na maaaring higit na mapagpasiya kaysa sa Hebreo.
- source_word: יְגַלֶּה
  choice: ilantad
  rationale: Ang pandiwa ay nangangahulugang maglantad o mag-alis ng takip at ginagamit dito sa isang seksuwal na eupemismo. Ang “ilantad” ay nagpapanatili sa talinghaga nang hindi tahasang nagdaragdag ng “kahubaran.”
- source_word: כְּנַף
  choice: laylayan
  rationale: Ang כָּנָף ay maaaring tumukoy sa pakpak, gilid, o laylayan ng kasuutan. Ang “laylayan” ang pinakatiyak na larawang kaugnay ng damit sa kontekstong ito, habang ipinaliliwanag sa talababa ang eupemistikong diwa.
theological_decisions:
- issue: Kung gagawing tahasan sa pangunahing teksto ang seksuwal na kahulugan ng eupemismo
  choice: Panatilihin ang talinghagang “ilantad ang laylayan ng kanyang ama”
  alternative: “ilantad ang kahubaran ng kanyang ama” o “lapastanganin ang pagsasama ng kanyang ama”
  rationale: Hindi ginamit ng Hebreo rito ang karaniwang pormulang “ilantad ang kahubaran,” kundi ang mas pambihirang larawan ng כְּנַף. Ang pagpapanatili sa larawan ay umiiwas sa tahimik na paglutas sa sadyang di-tuwirang pananalita; nililinaw ang posibleng kahulugan sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang tuwirang pagbabawal na “Huwag” sa halip na mas mabigat na legalismong “Hindi dapat.” Pinanatili sa pangunahing teksto ang pambihirang talinghaga ng Hebreo at ipinaliwanag ito sa talababa.
