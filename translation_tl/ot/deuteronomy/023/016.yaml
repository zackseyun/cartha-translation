  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: tl
  text: Huwag mong isuko sa kanyang amo ang aliping[a] tumakas mula sa kanyang amo at naparito sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod.” Ang salitang Hebreo ay maaaring tumukoy sa isang lingkod o alipin, ngunit “alipin” ang ginamit dito sapagkat sentro sa batas ang pagkakasakop ng taong ito sa isang amo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: isuko
  rationale: Ang Hiphil ng סגר ay tumutukoy rito sa pagbibigay ng isang tao sa kapangyarihan ng iba. Likas sa makabagong Filipino ang “isuko” at pinananatili nito ang puwersang legal ng utos.
- source_word: עֶבֶד
  choice: alipin
  rationale: Bagaman maaari ring mangahulugang lingkod ang salita, sentro sa batas na ito ang pagkakasakop ng tao sa isang amo at ang pagtakas niya mula rito; kaya mas tiyak ang “alipin.”
- source_word: אֶל אֲדֹנָיו
  choice: sa kanyang amo
  rationale: Sa kontekstong panlipunan at legal, ang אָדוֹן ay ang taong may kapangyarihan sa alipin, hindi isang banal na titulo. Karaniwan at malinaw sa Filipino ang “amo.”
- source_word: אֲשֶׁר יִנָּצֵל
  choice: tumakas
  rationale: Maaaring tumukoy ang Niphal ng נצל sa pagkaligtas o pagtakas. Sa konteksto ng isang aliping lumalayo sa kanyang amo, “tumakas” ang pinakanatural na pagpapahayag nang hindi nagdaragdag ng dahilan o hatol sa pagtakas.
- source_word: אֵלֶיךָ
  choice: naparito sa iyo
  rationale: Ipinahihiwatig ng אֶל ang pagkilos patungo sa kausap. Ipinapahayag ng “naparito sa iyo” ang direksiyong iyon sa natural na Filipino.
- source_word: מֵעִם אֲדֹנָיו
  choice: mula sa kanyang amo
  rationale: Ang מֵעִם ay nagsasaad ng paglayo mula sa piling o kapangyarihan ng amo. Malinaw at idiomatiko ang “mula sa kanyang amo.”
theological_decisions:
- issue: Katayuang panlipunan ng עֶבֶד
  choice: alipin
  alternative: lingkod
  rationale: Ang taong tinutukoy ay nasa ilalim ng kapangyarihan ng isang amo, tumakas mula rito, at nanganganib na maibigay pabalik sa kanya. Mas hayag na pinananatili ng “alipin” ang pagkakagapos na mahalaga sa batas, samantalang inilalahad sa talababa ang tunay na saklaw ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang anyong “Huwag mong” para sa ikalawang panauhang isahan ng utos, at iniwasan ang mga salitang makaluma o labis na teknikal.
