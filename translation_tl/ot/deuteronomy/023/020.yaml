base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: tl
  text: Huwag kang maningil sa iyong kapatid[a] ng interes sa salapi[b], interes sa pagkain, o interes sa anumang bagay na ipinapautang nang may interes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iyong kapwa Israelita” o “sa iyong kamag-anak”; literal na “sa iyong kapatid.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “pilak,” na ginagamit dito sa diwang “salapi.”
    reason: lexical_alternative
  - marker: c
    text: O “na pinapatawan ng interes.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: maningil ng interes
  rationale: Ang Hiphil ng נשׁך ay tumutukoy sa pagpapataw o paniningil ng interes. Likas at malinaw sa modernong Filipino ang “maningil ng interes,” at ipinakikitang ang utos ay para sa nagpapautang.
- source_word: לְאָחִיךָ
  choice: sa iyong kapatid
  rationale: Literal na “iyong kapatid” ang Hebreo. Pinananatili nito ang pampamilya at pangtipang paglalarawan, habang ipinapaliwanag sa talababa ang saklaw nito bilang kapwa Israelita.
- source_word: נֶשֶׁךְ
  choice: interes
  rationale: Tumutukoy ito sa interes na sinisingil sa pautang, hindi lamang sa labis o mapagsamantalang interes. Mas tumpak sa kasalukuyang gamit ang “interes” kaysa sa isang salitang maaaring magpahiwatig lamang ng labis na patubo.
- source_word: כֶּסֶף
  choice: salapi
  rationale: Bagaman literal na “pilak,” karaniwan itong nangangahulugang salapi sa kontekstong pangkabuhayan at legal. Dignified at madaling maunawaan ang “salapi.”
- source_word: אֹכֶל
  choice: pagkain
  rationale: Ang salita ay malawak na tumutukoy sa pagkain; ito ang pinakadirekta at natural na katumbas.
- source_word: כָּל דָּבָר
  choice: anumang bagay
  rationale: Ipinahahayag ng parirala ang malawak na saklaw ng pagbabawal, lampas sa salapi at pagkain.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: na maaaring patubuan
  rationale: Ang sugnay ay tumutukoy sa anumang bagay na maaaring singilan ng interes. Ang “patubuan” ay likas na terminong Filipino sa pagpapautang na may interes at nagpapanatili sa pangkalahatang anyo ng Hebreo.
theological_decisions:
- issue: Saklaw ng “kapatid”
  choice: Panatilihin sa teksto ang literal na “kapatid” at ilahad sa talababa ang posibleng diwang “kapwa Israelita” o “kamag-anak.”
  alternative: Isalin nang tuwiran bilang “kapwa Israelita.”
  rationale: Pinananatili ng literal na anyo ang pampamilya at pangtipang lakas ng salita nang hindi tahimik na nililimitahan ang kahulugan nito sa isang interpretibong pagpapaliwanag.
- issue: Uri ng ipinagbabawal na interes
  choice: Gamitin ang pangkalahatang “interes.”
  alternative: Gumamit ng katumbas na nangangahulugang labis o mapagsamantalang patubo lamang.
  rationale: Hindi nililimitahan ng נֶשֶׁךְ sa talatang ito ang pagbabawal sa labis na halaga lamang; kaya hindi dapat paliitin ng salin ang saklaw nito.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang “Huwag kang” bilang natural na anyo ng tuwirang pagbabawal, “salapi” para sa dignified ngunit karaniwang bokabularyo, at “patubuan” bilang madaling maunawaang terminong pangkabuhayan.
