  yaml_path: translation/ot/deuteronomy/023/007.yaml
  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: tl
  text: Huwag mong hangarin ang kanilang kapayapaan o ikabubuti sa buong buhay mo, magpakailanman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang kanilang kagalingan o kapakanan.” Mas malawak ang saklaw ng mga salitang Hebreo kaysa sa pampolitikang kapayapaan o ekonomikong kasaganaan lamang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: hangarin
  rationale: Ang דרש ay nangangahulugang “hanapin” o “pagsikapang makamit.” Sa ganitong konteksto, likas sa Tagalog ang “hangarin” para sa kapayapaan at ikabubuti ng iba.
- source_word: שְׁלֹמָם
  choice: kanilang kapayapaan
  rationale: Pinananatili ng “kapayapaan” ang pangunahing diwa ng שָׁלוֹם, bagaman maaari rin itong tumukoy sa mas malawak na kalagayan ng kagalingan.
- source_word: טֹבָתָם
  choice: ikabubuti
  rationale: Saklaw ng טוֹבָה ang kabutihan, kapakinabangan, at mabuting kalagayan. Ang “ikabubuti” ay natural at malawak, at hindi ito nagpapakitid sa ekonomikong kasaganaan lamang.
- source_word: כָּל יָמֶיךָ
  choice: sa buong buhay mo
  rationale: Ito ang natural na makabagong Tagalog para sa idyomang literal na “lahat ng iyong mga araw,” habang pinananatili ang pang-isahang tuwirang pakikipag-usap.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Malinaw nitong pinananatili ang hiwalay at mariing pahayag ng patuloy na tagal.
theological_decisions:
- issue: Ang tila pag-uulit ng כָּל יָמֶיךָ at לְעוֹלָם
  choice: 'Pinanatili ang dalawang pahayag: “sa buong buhay mo, magpakailanman”'
  alternative: Pagsamahin bilang “habang nabubuhay ka” lamang
  rationale: Magkasunod na ginamit ng Hebreo ang dalawang parirala upang idiin ang tagal ng pagbabawal; hindi dapat alisin ang tensiyon o diin sa pamamagitan ng pagpapakinis.
- issue: Ang ugnayan ng “kapayapaan” at “ikabubuti” sa ilalim ng pagbabawal
  choice: Ginamit ang “o” sa natural na negatibong konstruksyon sa Tagalog
  alternative: Literal na “at”
  rationale: Ang Hebreong וְ ay nagdurugtong sa dalawang bagay na kapuwa sakop ng pagbabawal. Sa Tagalog, mas malinaw na ipinahihiwatig ng “o” na walang alinman sa dalawa ang dapat hangarin, nang hindi binabago ang saklaw ng utos.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang pang-isahang “mo” ayon sa Hebreo. Natural ang “sa buong buhay mo,” samantalang sadyang pinanatili ang “magpakailanman” upang maipakita ang mariing pag-uulit ng pinagmulang teksto.
