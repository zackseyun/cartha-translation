base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: tl
  text: Ingatan mo at tuparin ang lumabas sa iyong mga labi[a], ayon sa ipinanata mo kay Yahweh na iyong Diyos bilang kusang-loob na handog[b], na binigkas mo sa pamamagitan ng iyong bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang sinabi ng iyong mga labi” o “ang namutawi sa iyong mga labi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “boluntaryong handog.” Ang salitang Hebreo ay tumutukoy sa handog na kusang ibinigay at hindi sapilitan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: ang lumabas sa iyong mga labi
  rationale: Pinananatili nito ang kongkretong larawang Hebreo ng mga salitang ‘lumalabas’ sa mga labi, habang malinaw na tumutukoy sa binigkas na panata.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: dapat mong ingatan at tuparin
  rationale: Ang ‘ingatan’ ay kumakatawan sa שׁמר, at ang ‘tuparin’ ay likas na salin ng עשה sa konteksto ng pagsasagawa ng isang panata. Nananatili rin ang dalawang magkaugnay na pandiwa ng Hebreo.
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: ayon sa ipinangako mo
  rationale: Ipinahihiwatig nito na kailangang eksaktong isagawa ang nilalaman ng panatang binitiwan.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na iyong Diyos
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang ‘Yahweh’ at pinananatili ang pariralang ‘iyong Diyos.’
- source_word: נְדָבָה
  choice: bilang kusang-loob na handog
  rationale: Ang נְדָבָה ay handog na kusang ibinigay, hindi bunga ng pamimilit. Ang parirala ay natural sa Filipino at nagpapanatili sa kontekstong panghandog.
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: ang sinabi mo ng sarili mong bibig
  rationale: Pinananatili ang mariing pag-uulit sa Hebreo na ang panata ay personal na binigkas sa pamamagitan ng bibig.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton. Ang ‘Yahweh’ ay nagpapanatili rito bilang personal at tipanang pangalan sa halip na palitan ng isang titulo.
- issue: Ugnayan ng panata at ng נְדָבָה
  choice: ang ipinangako ay inilalarawang kusang-loob na handog
  alternative: 'unawain ang נְדָבָה bilang pang-abay: ‘kusang-loob mong ipinangako’'
  rationale: Ang anyong pangngalan at kontekstong panghandog ay sumusuporta sa ‘kusang-loob na handog,’ ngunit kinikilala sa talababa ang posibleng mas malawak na diwang boluntaryo.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang kongkretong mga idyomang ‘lumabas sa iyong mga labi’ at ‘sarili mong bibig’ upang huwag mawala ang pagdidiin ng Hebreo, habang ginawang likas sa konteksto ng panata ang pandiwang ‘tuparin.’
