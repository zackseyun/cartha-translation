  to: Huwag mong ituring na kasuklam-suklam ang isang Edomita[a], sapagkat kapatid mo siya[b]. Huwag mong ituring na kasuklam-suklam ang isang Ehipsiyo, sapagkat nanirahan ka bilang dayuhan[c] sa lupain niya.
  rationale: Pinalitan ang pandiwang “kasuklaman” ng “ituring na kasuklam-suklam” upang mas malinaw na maipahayag ang puwersa ng Hebreong Piel nang hindi hinihinaan ang pagbabawal. Iningatan ang paralelismo, ang isahang kinatawang mga gentilicio, ang literal na “kapatid,” at ang isahang “lupain niya.” Inayos din ang talababa c upang tuwirang magbigay ng alternatibong salin para sa “dayuhan.”
