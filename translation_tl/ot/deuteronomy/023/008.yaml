base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: tl
  text: Huwag mong ituring na kasuklam-suklam ang isang Edomita[a], sapagkat kapatid mo siya[b]. Huwag mong ituring na kasuklam-suklam ang isang Ehipsiyo, sapagkat nanirahan ka bilang dayuhan[c] sa lupain niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kamuhian” o “ituring na karima-rimarim.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kapatid mo” ay tumutukoy sa pagkakamag-anak ng Israel at Edom sa pamamagitan ni Esau.
    reason: cross_reference
  - marker: c
    text: O “dayuhang residente.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: kasuklaman
  rationale: Ang Piel ng תעב ay nagpapahayag ng matinding pagkasuklam o pagtingin sa isang tao bilang kasuklam-suklam. Likas at marangal sa modernong Filipino ang “kasuklaman,” at pinananatili ang pag-uulit sa dalawang magkatulad na utos.
- source_word: אֲדֹמִי
  choice: isang Edomita
  rationale: Karaniwang katawagan sa isang taong mula sa Edom; pinananatili ang isahang anyong kumakatawan sa pangkat.
- source_word: אָחִיךָ
  choice: kapatid mo
  rationale: Tuwirang pinananatili ang katawagang pampamilya, na tumutukoy sa pagkakamag-anak ng Israel at Edom sa pamamagitan ni Esau.
- source_word: מִצְרִי
  choice: isang Ehipsiyo
  rationale: Karaniwang katawagan sa Filipino sa isang taong mula sa Ehipto, na nasa isahang anyo gaya ng Hebreo.
- source_word: גֵר
  choice: nanirahan ... bilang dayuhan
  rationale: Ang גֵר ay isang taong naninirahan sa labas ng sarili niyang lupain o angkan sa piling ng ibang bayan. Ipinahahayag ng pariralang ito ang kalagayan, hindi lamang ang maikling pagbisita.
- source_word: בְאַרְצוֹ
  choice: sa lupain niya
  rationale: Sinusunod ang isahang hulapi ng Hebreo, kung saan ang “Ehipsiyo” ay kumakatawan sa Ehipto at sa mga mamamayan nito.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng bawat pagbabawal at angkop sa marangal na legal na pananalita.
theological_decisions:
- issue: Isahang katawagan na kumakatawan sa mga pambansang pangkat
  choice: 'Panatilihin ang isahan: “isang Edomita,” “isang Ehipsiyo,” “siya,” at “lupain niya.”'
  alternative: 'Gawing maramihan: “mga Edomita,” “mga Ehipsiyo,” at “lupain nila.”'
  rationale: Isahang katawagan ang gamit ng Hebreo bilang kinatawan ng bawat pangkat. Pinananatili nito ang anyo ng pinagmulan at ang personal na diin ng utos nang hindi binabago ang diwa.
- issue: Wika ng pagkakamag-anak kaugnay ng Edom
  choice: “kapatid mo”
  alternative: “kamag-anak mo”
  rationale: Ibinabatay ng teksto ang pagbabawal sa ugnayang pampamilya ng Israel at Edom. Pinananatili ng literal na pananalita ang historikal at teolohikal na ugnayang ito nang hindi ito pinapalabnaw.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “kasuklaman” upang mapanatili ang lakas ng pandiwang Hebreo, at “nanirahan ka bilang dayuhan” upang malinaw na maipahayag ang panlipunan at legal na diwa ng גֵר. Pinanatili ang paralelismo at mga isahang katawagang kinatawan ng mga bayan.
