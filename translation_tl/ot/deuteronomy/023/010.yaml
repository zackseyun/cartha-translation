  source_fidelity: Kailangang panatilihin ang pang-isahang anyo ng ikalawang panauhan sa Hebreo ("iyong... mag-ingat ka"), kahit kolektibong tinutukoy nito ang Israel. Ang "bawat masamang bagay" ay mas tuwirang tumutugma sa מִכֹּל דָּבָר רָע kaysa sa "anumang masama," na maaaring magtunog na pang-uri lamang.
  naturalness: Natural at marangal sa modernong Filipino ang "Kapag humayo ka bilang hukbo... mag-ingat ka." Ang pang-isahang "ka" ay maaaring tumukoy sa Israel bilang isang kolektibo at iniiwasan ang hindi itinutugmang paglilipat sa maramihan.
  terminology: Ang "hukbo," "mga kaaway," at "masamang bagay" ay angkop. Pinananatili ng talababa ang posibleng ritwal na kahulugan nang hindi pinapaliit ang malawak na saklaw ng Hebreo.
