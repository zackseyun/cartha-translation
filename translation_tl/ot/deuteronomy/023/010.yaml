  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: tl
  text: Kapag humayo ka bilang hukbo laban sa iyong mga kaaway, mag-ingat ka sa bawat masamang bagay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat maruming bagay” o “anumang hindi nararapat.” Malawak ang pariralang Hebreo at, sa kontekstong ito, maaaring kabilang dito ang ritwal na karumihan, ngunit hindi limitado rito ang saklaw nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Nagsisimula ito ng isang sitwasyong pinagbabatayan ng kasunod na utos; mas angkop ang “Kapag” kaysa sa kondisy ballot na “Kung.”
- source_word: תֵצֵא מַחֲנֶה
  choice: humayo kayo bilang hukbo
  rationale: Ang יָצָא ay “lumabas” o “humayo,” at ang מַחֲנֶה sa kontekstong militar ay tumutukoy sa puwersang humahayo. Likas sa modernong Filipino ang “humayo bilang hukbo” at hindi nito nililimitahan ang kahulugan sa lugar ng kampo.
- source_word: עַל אֹיְבֶיךָ
  choice: laban sa inyong mga kaaway
  rationale: Sa kontekstong militar, adversatibo ang עַל at malinaw na katumbas nito ang “laban sa.” Isinalin sa maramihang panghalip ang kolektibong pakikipag-usap sa Israel upang maging likas sa Filipino.
- source_word: וְנִשְׁמַרְתָּ
  choice: mag-ingat kayo
  rationale: 'Ang Nifal ng שׁמר ay may diwang refleksibo: maging mapagbantay o ingatan ang sarili. Likas at tuwiran itong naipahahayag ng “mag-ingat kayo.”'
- source_word: מִכֹּל דָּבָר רָע
  choice: sa anumang masama
  rationale: Malawak ang דָּבָר רָע at maaaring tumukoy sa masamang bagay, gawain, o bagay na hindi nararapat. Pinananatili ng “anumang masama” ang lawak ng parirala nang hindi ito nililimitahan sa ritwal na karumihan.
theological_decisions:
- issue: Saklaw ng דָּבָר רָע sa mga tuntunin tungkol sa kabanalan ng kampo
  choice: anumang masama
  alternative: anumang maruming bagay; anumang hindi nararapat
  rationale: Bagaman tumatalakay ang kasunod na konteksto sa ritwal na karumihan, mas malawak ang mismong pariralang Hebreo. Hindi ito dapat paliitin sa ritwal na kahulugan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo” para sa kolektibong Israel, bagaman pang-isahan ang anyong Hebreo; iniiwasan nito ang di-likas na pagsasabing ang isang tao ay humahayo “bilang hukbo.”
