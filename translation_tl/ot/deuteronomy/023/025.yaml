translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kapwa” sa halip na “kapitbahay” upang mapanatili ang mas malawak na diwa ng רֵעַ, at “lalagyan” upang huwag tukuyin nang higit sa sinasabi ng Hebreo ang uri ng sisidlan.
