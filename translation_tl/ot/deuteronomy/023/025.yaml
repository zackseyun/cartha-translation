base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: tl
  text: Kapag pumasok ka sa ubasan ng iyong kapwa[a], maaari kang kumain ng ubas ayon sa iyong gana hanggang sa mabusog ka[b], ngunit huwag kang maglagay ng anuman sa iyong lalagyan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung pumasok ka sa ubasan ng iyong kapwa.” Maaaring magpakilala ang salitang Hebreo ng sugnay na tumutukoy sa panahon o sa kondisyon; pinili rito ang “kapag” bilang mas likas sa ganitong batas.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa iyong buhay [o sarili], sa iyong pagkabusog.” Isa itong idyoma na nangangahulugang kumain ayon sa gana hanggang mabusog.
    reason: lexical_alternative
  - marker: c
    text: O “sisidlan.” Pangkalahatan ang salitang Hebreo at hindi nito tinutukoy ang uri ng lalagyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Nagsisimula ito rito ng sugnay na naglalahad ng isang kalagayan sa batas. Likas sa modernong Filipino ang “kapag,” bagaman maaari ring unawain bilang “kung.”
- source_word: תָבֹא בְּכֶרֶם
  choice: pumasok ka sa ubasan
  rationale: Ang בוא kasama ng בְּ ay tumutukoy sa pagpasok sa isang lugar; ang כֶּרֶם ay tiyak na ubasan.
- source_word: רֵעֶךָ
  choice: iyong kapwa
  rationale: Ang רֵעַ ay maaaring mangahulugang kapwa, kasama, o kapitbahay. Pinananatili ng “kapwa” ang mas malawak na saklaw nang hindi ipinapalagay na magkatabing bahay ang tinutukoy.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: maaari kang kumain ng ubas
  rationale: Sa kontekstong pambatas, ipinahihiwatig ng anyo ang pinahihintulutang kilos, hindi isang utos na kailangang kumain.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: ayon sa iyong gana hanggang sa mabusog ka
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa pagnanasa o gana, at ang שֹׂבַע ay pagkabusog. Malinaw na ipinapahayag ng salin ang pahintulot sa pansariling pagkain hanggang mabusog.
- source_word: כֶּלְיְךָ
  choice: iyong lalagyan
  rationale: Pangkalahatan ang כְּלִי at hindi nito tinutukoy kung sisidlan, basket, o supot; gayon din ang “lalagyan.”
- source_word: לֹא תִתֵּן
  choice: huwag kang maglagay ng anuman
  rationale: Bagaman pangunahing kahulugan ng נתן ang “magbigay,” natural dito ang “maglagay” dahil sinusundan ito ng patungong lalagyan. Idinagdag ang “anuman” bilang likas na pagtukoy sa mga ubas sa naunang sugnay.
