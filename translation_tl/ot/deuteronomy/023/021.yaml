base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: tl
  text: Maaari kang magpataw ng tubo[a] sa isang dayuhan, ngunit huwag kang magpataw ng tubo sa iyong kapatid[b], upang pagpalain ka ni Yahweh na iyong Diyos sa lahat ng gawa ng iyong kamay sa lupaing papasukin mo upang angkinin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “magpautang nang may tubo” o “maningil ng tubo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “iyong kapatid” dito ay tumutukoy sa kapwa kabilang sa Israel; pinananatili sa salin ang katawagang pampamilya ng Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: sa isang dayuhan
  rationale: Ang נָכְרִי ay isang taong banyaga o nasa labas ng Israel, bilang kaibahan ng “iyong kapatid.” Natural at malinaw sa makabagong Filipino ang “dayuhan.”
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: magpataw ng tubo / hindi magpataw ng tubo
  rationale: Sa batas tungkol sa pautang, ang Hiphil ng נשׁך ay tumutukoy sa pagpapataw o paniningil ng interes. Iniiwasan ng “tubo” ang makalumang salita at hindi nito ipinapalagay na labis o mapagsamantala ang singil.
- source_word: אָחִיךָ
  choice: iyong kapatid
  rationale: Pinananatili ang literal na katawagang pampamilya ng Hebreo. Sa konteksto ng tipang batas, tumutukoy ito sa kapwa kabilang sa Israel.
- source_word: לְמַעַן
  choice: upang
  rationale: Ipinahahayag nito ang layunin o inaasahang resulta ng pagsunod sa utos.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: pagpalain ka ni Yahweh na iyong Diyos
  rationale: Pinananatili ang pangalang tipan na יְהוָה bilang “Yahweh,” at ang anyong pandiwa ay angkop isalin bilang layunin o resultang “pagpalain ka.”
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: sa lahat ng gawa ng iyong kamay
  rationale: Pinananatili ang larawang Hebreo tungkol sa lahat ng ginagawa o pinagsisikapan ng isang tao, habang nananatiling madaling maunawaan sa Filipino.
- source_word: עַל הָאָרֶץ
  choice: sa lupain
  rationale: Sa kontekstong ito, lokatibo ang diwa ng עַל; natural sa Filipino ang “sa lupain.”
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: na papasukin mo upang angkinin
  rationale: Ipinahahayag ng parirala ang nalalapit na pagpasok sa lupain na may layuning ariin o angkinin iyon.
theological_decisions:
- issue: Paglalarawan sa pinahihintulutan at ipinagbabawal na tubo
  choice: Pinahihintulutan ang pagpataw ng tubo sa dayuhan ngunit ipinagbabawal ito sa “kapatid.”
  alternative: Ipakahulugan ang lahat ng tubo bilang likas na mapagsamantala o ipagbawal ito sa lahat ng tao.
  rationale: Tahasang pinananatili ng tekstong Hebreo ang legal na kaibahan sa pagitan ng נָכְרִי at אָחִיךָ; hindi dapat palawakin o paliitin ng salin ang saklaw nito.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpataw ng tubo” bilang natural na legal-ekonomikong pananalita; pinanatili ang “iyong kapatid” at “gawa ng iyong kamay” upang mapangalagaan ang mahahalagang larawan at ugnayang nasa Hebreo.
