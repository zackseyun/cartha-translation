  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: tl
  text: Hindi maaaring pumasok sa kapulungan ni Yahweh ang lalaking nadurog ang mga bayag o naputulan ng ari.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “Walang lalaking nadurog ang mga bayag o pinutulan ng ari ang papasok sa kapulungan ni Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “kapulungan ni Yahweh” ay maaaring tumukoy sa pormal na pakikibahagi sa pamayanang nakipagtipan ng Israel; pinagtatalunan ang eksaktong saklaw ng pagbabawal.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹא
  choice: maaaring pumasok
  rationale: Ang בוא ay nangangahulugang “pumarito/pumasok.” Sa kontekstong pambatas, ang “hindi maaaring pumasok” ay natural na nagpapahayag ng pagbabawal.
- source_word: פְצוּעַ דַּכָּא
  choice: durog ang mga bayag
  rationale: Tumutukoy ang parirala sa lalaking napinsala sa pamamagitan ng pagdurog sa mga bayag; tuwiran at anatomikong malinaw ang salin.
- source_word: וּכְרוּת שָׁפְכָה
  choice: o putol ang ari
  rationale: Tumutukoy ito sa pinutol na sangkap na panlalaki. Ang “ari” ay malinaw at likas sa marangal na modernong Filipino; pinananatili ng “o” ang paghihiwalay ng dalawang kalagayan.
- source_word: בִּקְהַל
  choice: sa kapulungan
  rationale: Ang קהל ay isang nagkakatipong pamayanan o kapulungan. Ang “kapulungan” ay angkop sa kontekstong legal at tipanan nang hindi agad nililimitahan ang saklaw nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: לֹא
  choice: Hindi maaaring
  rationale: Natural na anyong Filipino ito para sa mariing pagbabawal sa kontekstong pambatas.
- source_word: implicit male referent of the participial phrases
  choice: ang lalaking
  rationale: Tiyak na lalaki ang tinutukoy dahil mga sangkap na panlalaki ang inilalarawan.
theological_decisions:
- issue: Saklaw ng pagbabawal na pumasok sa “kapulungan ni Yahweh”
  choice: Pinanatili ang payak na pariralang “kapulungan ni Yahweh” nang hindi tinutukoy ang lahat ng legal o teolohikal na implikasyon nito.
  alternative: Maaaring unawain bilang pormal na pakikibahagi sa sumasambang kapulungan ng Israel, pagiging karapat-dapat sa ganap na katayuang sibiko o pag-aasawa sa Israel, o mas malawak na pagbabawal na pangkulto.
  rationale: Hindi mismo nililinaw ng talata ang eksaktong saklaw ng קהל יהוה. Kaya hindi dapat ipasok sa pangunahing teksto ang isang pinagtatalunang interpretasyon.
translation_notes:
  register: Modernong Filipino na tuwiran, malinaw, at marangal. Gumamit ng anatomikong malinaw ngunit hindi bulgar na pananalita. Pinanatili ang legal na diin at ang hindi tiyak na saklaw ng “kapulungan ni Yahweh.”
