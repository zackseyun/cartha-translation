base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: tl
  text: Ngunit kung mananata ka kay Yahweh na iyong Diyos, huwag mong ipagpaliban ang pagtupad nito, sapagkat tiyak na hihingin ni Yahweh na iyong Diyos ang katuparan nito mula sa iyo, at magiging kasalanan ito sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at magiging maysala ka.” Sa literal, “at magiging kasalanan ito sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ngunit kung
  rationale: 'Ipinapahayag nito ang kondisyong may bahagyang pagsalungat sa naunang pahayag: hindi kasalanan ang hindi panata, ngunit kung mananata ang isang tao, may pananagutan siyang tuparin iyon.'
- source_word: תִדֹּר נֶדֶר
  choice: mananata ka
  rationale: Ang magkaugnay na pandiwa at pangngalan sa Hebreo ay likas na ipinahahayag sa Tagalog sa payak na pandiwang “mananata,” nang hindi inuulit nang alanganin ang “panata.”
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na iyong Diyos
  rationale: Tinutukoy ng parirala ang pinatutungkulan ng panata at pinananatili ang pangalang tipan na Yahweh.
- source_word: לֹא תְאַחֵר לְשַׁלְּמוֹ
  choice: huwag mong ipagpaliban ang pagtupad nito
  rationale: Ang שלם sa konteksto ng panata ay maaaring mangahulugang magbayad o tumupad. Masaklaw at natural ang “pagtupad” para sa iba't ibang uri ng panata.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: tiyak na sisingilin ito
  rationale: Pinananatili ng “tiyak” ang diin ng infinitive absolute at finite verb, samantalang ipinahahayag ng “sisingilin” ang sapilitang paghingi ng katuparan sa kontekstong legal at tipan.
- source_word: מֵעִמָּךְ
  choice: sa iyo
  rationale: Natural na kasama ng “sisingilin” ang “sa iyo” upang ipakitang pananagutin ang taong gumawa ng panata.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: at magiging kasalanan iyon sa iyo
  rationale: Malapit ito sa siksik at medyo idyomatikong Hebreong “magiging kasalanan sa iyo,” habang nauunawaan pa rin sa modernong Tagalog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa teksto ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng וְהָיָה בְךָ חֵטְא
  choice: magiging kasalanan iyon sa iyo
  alternative: magkakasala ka; magiging maysala ka
  rationale: Pinananatili ng napiling anyo ang kakaibang Hebreong paglalarawan at hindi lubusang pinapantay ang “kasalanan” sa mas interpretatibong “pagkakasala” o “pagiging maysala.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mananata,” “ipagpaliban,” at “pagtupad” bilang karaniwan ngunit angkop na bokabularyo sa tekstong legal at panrelihiyon. Inilagay ang marker [a] pagkatapos ng sugnay na nililinaw nito.
