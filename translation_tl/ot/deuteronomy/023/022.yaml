  to: Ngunit kung mananata ka kay Yahweh na iyong Diyos, huwag mong ipagpaliban ang pagtupad nito, sapagkat tiyak na hihingin ni Yahweh na iyong Diyos ang katuparan nito mula sa iyo, at magiging kasalanan ito sa iyo.[a]
