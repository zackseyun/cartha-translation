    rationale: Ang “singilin sa iyo” sa Tagalog ay karaniwang nangangahulugang pagbayarin o pagpatawan ng singil sa isang tao. Ang Hebreo ay nagsasabing mariing hihingin ni Yahweh ang obligasyon/katuparan mula sa nanata. Ang rebisyon ay nililinaw ang direksiyon ng paghingi at ang bagay na hinihingi.
