- from: Sapagkat si Yahweh na iyong Diyos ay lumalakad sa gitna ng iyong kampo upang iligtas ka at ibigay sa iyong kapangyarihan ang iyong mga kaaway.[a] Kaya dapat maging banal ang iyong kampo, upang wala siyang makitang anumang kahiya-hiyang bagay sa gitna mo[b] at tumalikod siya sa iyo.[c]
  to: Sapagkat si Yahweh na iyong Diyos ay lumalakad sa gitna ng iyong kampo upang iligtas ka at ibigay sa iyong kapangyarihan ang iyong mga kaaway.[a] Kaya dapat maging banal ang iyong kampo, upang hindi siya makakita sa gitna mo ng anumang kahiya-hiyang bagay[b] at tumalikod sa iyo.[c]
  rationale: Inayos ang sintaks ng huling sugnay upang malinaw na ang hindi pagkakita at ang hindi pagtalikod ni Yahweh ang layuning kaugnay ng kabanalan ng kampo. Inayos din ang literal na pandiwa sa talababa c nang hindi pinipilit sa pangunahing teksto ang di-karaniwang larawan ng Hebreo.
