base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: tl
  text: Sapagkat si Yahweh na iyong Diyos ay lumalakad sa gitna ng iyong kampo upang iligtas ka at ibigay sa iyong kapangyarihan ang iyong mga kaaway.[a] Kaya dapat maging banal ang iyong kampo, upang hindi siya makakita sa gitna mo ng anumang kahiya-hiyang bagay[b] at tumalikod sa iyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “ibigay ang iyong mga kaaway sa harap mo.” Ang idyomang Hebreo ay nangangahulugang ibigay sila sa iyong kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: O “anumang mahalay na bagay.” Malawak ang pariralang Hebreo at maaaring tumukoy sa anumang kahiya-hiya o marumi na makapagpaparumi sa kampo.
    reason: lexical_alternative
  - marker: c
    text: Mas literal, “bumalik mula sa likuran mo,” isang larawang maaaring magpahiwatig na hindi na sasamahan ni Yahweh ang kampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo at ang kaugnayan nito sa tipan.
- source_word: מִתְהַלֵּךְ
  choice: lumalakad
  rationale: Pinananatili ang kongkretong larawang antropomorpiko ng aktibong presensiya ni Yahweh sa kampo.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: sa gitna ng iyong kampo
  rationale: Malapit sa Hebreo at natural na nagpapahayag ng presensiya ng Diyos sa loob ng kampo.
- source_word: לְהַצִּילְךָ
  choice: upang iligtas ka
  rationale: Angkop sa kontekstong militar at malinaw sa makabagong Tagalog.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: at ibigay sa iyong kapangyarihan ang iyong mga kaaway
  rationale: Isinasalin ang diwang idyomatiko ng pagbibigay ng mga kaaway sa kapangyarihan ng Israel; inilalahad sa talababa ang mas literal na anyo.
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: Kaya dapat maging banal ang iyong kampo
  rationale: Ipinakikita ang bunga at obligasyong dulot ng presensiya ni Yahweh, hindi lamang isang hula tungkol sa kalagayan ng kampo.
- source_word: עֶרְוַת דָּבָר
  choice: anumang kahiya-hiyang bagay
  rationale: Pinananatili ang malawak na saklaw ng parirala, na maaaring tumukoy sa anumang mahalay, marumi, o hindi nararapat sa banal na kampo.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: at tumalikod siya sa iyo
  rationale: Natural sa Tagalog at hindi ipinipilit ang isang pagpapakahulugan sa di-karaniwang larawang literal na ‘tumalikod mula sa likuran mo.’
theological_decisions:
- issue: Antropomorpikong paglalarawan sa presensiya ni Yahweh
  choice: Panatilihin ang ‘lumalakad sa gitna ng iyong kampo.’
  alternative: ‘Nasa gitna ng iyong kampo’ o ‘kasama ninyo sa kampo.’
  rationale: Sadyang kongkreto ang Hebreo at inuugnay nito ang kabanalan ng kampo sa malapit at aktibong presensiya ng Diyos, nang hindi nagpapasiya tungkol sa pisikal na anyo ng Diyos.
- issue: Lakas ng pahayag tungkol sa kabanalan ng kampo
  choice: 'Isalin bilang obligasyon: ‘dapat maging banal ang iyong kampo.’'
  alternative: ‘Magiging banal ang iyong kampo.’
  rationale: 'Sa konteksto, preskriptibo ang sugnay: hinihingi ng presensiya at pagkilos ni Yahweh ang kabanalan ng kampo.'
- issue: Larawan ng pagtalikod ni Yahweh
  choice: Gamitin sa pangunahing teksto ang ‘tumalikod siya sa iyo’ at panatilihin sa talababa ang mas literal na larawan.
  alternative: ‘Tumigil siya sa pagsama sa iyo’ o ‘tumalikod siya mula sa likuran mo.’
  rationale: Iniiwasan nitong gawing mas tiyak kaysa sa Hebreo ang kilos, habang ipinababatid ng talababa na maaaring inilalarawan ang hindi na pagsama ni Yahweh sa kampo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang ‘iyong/ka/mo’ upang sundan ang kolektibong isahang pagtukoy ng Hebreo sa Israel. Pinanatili ang pangalang ‘Yahweh’ at ang kongkretong larawang ‘lumalakad,’ habang ginawang natural ang idyomang militar sa pangunahing teksto.
