language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: tl
  text: sapagkat hindi nila kayo sinalubong na may tinapay at tubig sa daan nang lumabas kayo mula sa Ehipto, at sapagkat inupahan niya si Balaam na anak ni Beor mula sa Petor sa Aram-Naharaim[a] laban sa iyo upang sumpain ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Aram-Naharaim ay karaniwang kinikilalang Mesopotamia; literal itong “Aram ng Dalawang Ilog.”
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: sapagkat
  rationale: Natural na ipinahahayag ang sanhi o batayan ng naunang pagbabawal.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: hindi nila kayo sinalubong
  rationale: Ipinahihiwatig ng pandiwa rito ang paglabas upang salubungin ang isang dumarating; hindi idinagdag ang mas interpretibong diwa ng mainit na pagtanggap.
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: na may tinapay at tubig
  rationale: Pinananatili ang kongkretong mga salitang “tinapay” at “tubig” habang natural ang pagkakaugnay sa pandiwang “sinalubong.”
- source_word: בַּדֶּרֶךְ
  choice: sa daan
  rationale: Maikli, natural, at tuwirang katumbas ng pariralang tumutukoy sa kanilang paglalakbay.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: nang lumabas kayo mula sa Ehipto
  rationale: Ipinahahayag ang panahong tinutukoy ng anyong pawatas at pinananatili ang pagtukoy sa paglabas mula sa Ehipto.
- source_word: וַאֲשֶׁר
  choice: at sapagkat
  rationale: Malinaw na ipinakikilalang ikalawang dahilan na kapantay ng una.
- source_word: שָׂכַר עָלֶיךָ
  choice: inupahan niya ... laban sa iyo
  rationale: Pinananatili ang isahang simuno at ang mapanlabang direksiyon ng pariralang עָלֶיךָ.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaam na anak ni Beor
  rationale: Ginagamit ang nakaugaliang anyo ng mga pangalang pantangi at natural na Filipino para sa patronimiko.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: mula sa Petor sa Aram-Naharaim
  rationale: Pinananatili bilang pangalang panrehiyon ang Aram-Naharaim sa halip na agad itong palitan ng interpretibong “Mesopotamia”; ipinaliliwanag ito sa talababa.
- source_word: לְקַלְלֶךָּ
  choice: upang sumpain ka
  rationale: Tuwirang ipinahahayag ang layunin ng pag-upa.
theological_decisions:
- issue: Paglipat mula sa maramihang kausap tungo sa isahan
  choice: “kayo” sa unang bahagi, pagkatapos ay “iyo/ka” sa ikalawa
  alternative: Gawing pare-parehong maramihan ang lahat ng panghalip
  rationale: Sinasalamin nito ang tunay na paglipat ng Hebreo mula אֶתְכֶם at בְּצֵאתְכֶם tungo sa עָלֶיךָ at לְקַלְלֶךָּ, sa halip na pakinisin at alisin ang pagbabago.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang anyong sugnay na nagsisimula sa “sapagkat” dahil ipinagpapatuloy ng talata ang dahilan mula sa naunang pahayag. Hindi pinantay ang maramihan at isahang mga panghalip, upang mapanatili ang pagkakaiba sa tekstong Hebreo.
