base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: tl
  text: Maninirahan siyang kasama ninyo[a], sa gitna ninyo, sa alinman sa inyong mga bayan[b] na pipiliin niya, kung saan makabubuti sa kaniya. Huwag ninyo siyang aapihin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Mananatili siyang kasama ninyo.”
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “sa isa sa inyong mga pintuan.” Sa Hebreo, ang “mga pintuan” ay maaaring tumukoy sa mga bayan o pamayanan.'
    reason: cultural_note
lexical_decisions:
- source_word: יֵשֵׁב
  choice: maninirahan
  rationale: Ang יֵשֵׁב ay tumutukoy sa pananatili o pagtira. Ang “maninirahan” ay natural sa makabagong Filipino at angkop sa legal na pahintulot para sa patuloy na paninirahan.
- source_word: עִמְּךָ
  choice: kasama ninyo
  rationale: Literal itong “kasama mo.” Ginamit ang maramihang “ninyo” sapagkat ang kausap ay ang sambayanan bilang isang kabuuan, at ito ang mas natural na anyo sa Filipino sa kontekstong ito.
- source_word: בְּקִרְבְּךָ
  choice: sa gitna ninyo
  rationale: Ipinahihiwatig ng parirala ang pagiging nasa loob ng komunidad. Pinananatili ng “sa gitna ninyo” ang kongkretong larawan at malinaw ang kahulugang panlipunan.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: sa lugar na pipiliin niya
  rationale: Tuwirang pinananatili nito na ang tumakas na alipin o lingkod ang siyang pipili ng lugar, hindi ang Israel o ang PANGINOON.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: sa isa sa inyong mga bayan
  rationale: Ang literal na “sa isa sa iyong mga pintuang-bayan” ay isang Hebreong metonimiya para sa bayan o pamayanang sakop ng tarangkahan. Ang “mga bayan” ang malinaw at likas na katumbas sa Filipino; inilagay sa talababa ang literal na larawan.
- source_word: בַּטּוֹב לוֹ
  choice: kung saan makabubuti para sa kaniya
  rationale: Ang parirala ay literal na tumutukoy sa kung ano ang mabuti para sa kaniya. Iniiwasan ng saling ito na paliitin ang diwa tungo lamang sa pansariling kagustuhan o kasiyahan.
- source_word: לֹא תּוֹנֶנּוּ
  choice: Huwag ninyo siyang aapihin
  rationale: Sa legal na konteksto, ang Hiphil ng ינה ay tumutukoy sa pang-aapi, pagsasamantala, o masamang pagtrato. Naipapahayag ng “aapihin” ang lakas ng panlipunan at moral na pagbabawal.
theological_decisions:
- issue: Tinutukoy ng mga panlalaking panghalip na isahan
  choice: Pinanatili ang pagtukoy sa isang lalaking indibidwal sa pamamagitan ng “siya” at “kaniya,” na likas na hindi nagtatakda ng kasarian sa Filipino ngunit hindi rin ginagawang maramihan ang tinutukoy.
  alternative: Gawing tahasang “ang taong iyon” o ulitin ang “alipin,” o gumamit ng maramihang anyo upang maging inklusibo.
  rationale: Panlalaking isahan ang mga anyo sa Hebreo at tumutukoy ang mga ito sa tumakas na alipin o lingkod sa naunang talata. Dahil hindi minamarkahan ng “siya/kaniya” ang kasarian sa Filipino, napapanatili ang bilang at tiyak na pagtukoy nang hindi nagdaragdag ng kasariang hindi kailangang ulitin sa target na wika.
- issue: Bilang ng ikalawang panauhan sa pagtukoy sa Israel
  choice: Ginamit ang “ninyo” upang kausapin ang buong sambayanan nang natural sa Filipino.
  alternative: Gamitin ang “mo/iyo” upang tumbasan nang pormal ang panlalaking isahang kolektibong pagtukoy sa Hebreo.
  rationale: Isahan sa gramatika ng Hebreo ang kausap, ngunit kolektibong Israel ang tinutukoy. Ang maramihang anyo sa Filipino ay malinaw na naghahatid ng kolektibong saklaw at iniiwasan ang tunog na para lamang sa isang pribadong indibidwal ang utos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “maninirahan” sa halip na mas makalumang “mananahan,” at “mga bayan” sa pangunahing teksto upang natural na maipahayag ang Hebreong idyoma. Pinanatili ang pag-uulit na “kasama ninyo, sa gitna ninyo” dahil bahagi ito ng diin at balangkas ng pinagmulan.
