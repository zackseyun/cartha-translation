base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: tl
  text: Walang Ammonita o Moabita ang maaaring pumasok sa kapulungan ni Yahweh[a]. Kahit sa ikasampung salinlahi[b], walang isa man sa kanila ang maaaring pumasok sa kapulungan ni Yahweh magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kongregasyon ni Yahweh” o “pagtitipon ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Kapuwa sinasabi ng Hebreo ang “kahit sa ikasampung salinlahi” at “magpakailanman”; pinanatili rito ang dalawang pahayag sa halip na ipakahulugan ang isa bilang kapalit ng isa.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: maaaring pumasok
  rationale: Sa kontekstong legal, ang imperfect na may לֹא ay nagpapahayag ng pagbabawal o hindi pagpapahintulot; natural itong ipinahahayag sa Filipino bilang “maaaring pumasok” na may pagtangging “walang ... ang.”
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: Ammonita o Moabita
  rationale: Ginamit ang karaniwang modernong katawagan sa Filipino para sa mga taong mula sa Ammon at Moab; ang Hebreong waw sa tambalang negatibong pahayag ay natural na isinaling “o.”
- source_word: קְהַל יְהוָה
  choice: kapulungan ni Yahweh
  rationale: Ang “kapulungan” ay malinaw at marangal na katumbas ng קָהָל bilang opisyal na nagkakatipong pamayanang tipan, habang pinananatili ang banal na pangalang Yahweh.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: kahit hanggang sa ikasampung salinlahi
  rationale: Pinananatili nito ang nagpapatingkad na גַּם at ang pormulang pangsalinlahi sa natural na Filipino.
- source_word: לָהֶם
  choice: sinuman sa kanila
  rationale: Sa inuulit na pagbabawal, malinaw at natural nitong tinutukoy ang kabilang sa dalawang nabanggit na bayan nang hindi labis na nililinaw kung indibidwal o mga inapo ang saklaw.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Ito ang malinaw at marangal na salin ng pariralang nagsasaad ng namamalaging tagal, at pinananatili itong hiwalay sa “ikasampung salinlahi.”
theological_decisions:
- issue: Ugnayan ng “ikasampung salinlahi” at “magpakailanman”
  choice: Kapuwa pinanatili sa pangunahing teksto nang hindi pinag-iisa o ipinapaliwanag ang isa sa pamamagitan ng isa.
  alternative: Ituring ang “ikasampung salinlahi” bilang simpleng idyoma para sa “hindi kailanman,” o pahinain ang “magpakailanman.”
  rationale: Kapuwa nasa Hebreong teksto ang dalawang pahayag tungkol sa tagal. Dapat panatilihin ng salin ang kanilang puwersa at posibleng tensiyon sa halip na tahimik itong lutasin.
- issue: Saklaw ng לָהֶם
  choice: “sinuman sa kanila”
  alternative: “ang kanilang mga inapo”
  rationale: Ipinahihiwatig ng pagbanggit sa mga salinlahi ang mga susunod na kabilang sa mga bayang ito, ngunit hindi tahasang gumagamit ang Hebreo ng salitang “inapo”; kaya iniwasan ang labis na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapulungan” upang maiwasan ang sobrang eklesyastikong himig ng “kongregasyon,” at pinanatili ang pangalang “Yahweh.”
