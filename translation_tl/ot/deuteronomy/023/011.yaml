  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: tl
  text: Kung may isang lalaki sa inyo na hindi malinis sa ritwal dahil sa paglabas ng semilya sa gabi[a], dapat siyang pumunta sa labas ng kampo; hindi siya dapat pumasok sa loob ng kampo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang pangyayari sa gabi,” isang idyoma para sa paglabas ng semilya sa gabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagsisimula ito ng isang kondisyong legal; natural at malinaw sa Filipino ang “kung.”
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: may isang lalaki sa inyo
  rationale: Pinananatili nito ang eksistensiyal na diwa ng הָיָה, ang saklaw ng pamayanan sa בְךָ, at ang tiyak na lalaking tinutukoy ng batas.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: na hindi malinis
  rationale: Ipinahihiwatig nito ang kalagayang ritwal nang hindi nagdaragdag ng pahiwatig na may kasalanang moral ang lalaki.
- source_word: מִקְּרֵה לָיְלָה
  choice: dahil sa paglabas ng semilya sa gabi
  rationale: Natural at malinaw itong katumbas ng Hebreong idyoma para sa paglabas ng semilya sa gabi; nililinaw ng talababa ang literal na anyo ng idyoma.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: dapat siyang lumabas sa kampo
  rationale: Inihahayag ng “dapat” ang puwersa ng legal na tagubilin, at natural sa Filipino ang “lumabas sa kampo.”
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: hindi siya dapat pumasok sa loob ng kampo
  rationale: Pinananatili ng “sa loob” ang diin ng תּוֹךְ sa panloob na bahagi ng kampo, hindi lamang sa hangganan nito.
theological_decisions:
- issue: Uri ng pagiging hindi malinis
  choice: Ilarawan ito bilang kalagayang ritwal, hindi bilang kasalanang moral.
  alternative: Ipahiwatig na ang paglabas ng semilya ay isang moral na kasalanan o karumihan.
  rationale: Ang konteksto ay mga tuntunin tungkol sa kabanalan ng kampo at pagiging malinis sa ritwal. Walang sinasabi ang talata na may moral na pagkakasala ang lalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “semilya” bilang karaniwang nauunawaang terminong pangkatawan; iniwasan ang sobrang klinikal o moralistikong pananalita.
