  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: tl
  text: Ang mga anak na isisilang sa kanila, sa ikatlong salinlahi, ay maaaring makapasok sa kapulungan ni Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak na lalaki”; sa kontekstong ito ng batas at angkan, tumutukoy ang salita nang mas malawak sa mga supling o inapo.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ang ikatlong salinlahi ay papasok.” Mas pormal ito sa Hebreo, ngunit ang diwa ng tuntunin ay pinahihintulutan ang pagpasok simula sa ikatlong salinlahi.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: mga anak
  rationale: Literal na “mga anak na lalaki,” ngunit sa legal at pangangkanang konteksto ay tumutukoy ito nang mas malawak sa mga supling o inapo; natural at hindi labis ang “mga anak” sa modernong Tagalog.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: na isisilang sa kanila
  rationale: Tumpak na ipinapahayag ang pasibong anyo ng ילד at ang לָהֶם, habang nananatiling natural sa Tagalog.
- source_word: דּוֹר שְׁלִישִׁי
  choice: sa ikatlong salinlahi
  rationale: Ipinahahayag nito ang puntong panghenerasyon kung kailan pinahihintulutan ang pagpasok; ang “salinlahi” ay angkop sa legal-pangangkanang konteksto.
- source_word: יָבֹא
  choice: ay maaaring makapasok
  rationale: Literal itong “papasok/darating,” ngunit sa kontekstong legal ay pahintulot ang diwa; nililinaw ng “maaaring makapasok” ang pagpasok sa kapulungan nang hindi ito ginagawang simpleng hula.
- source_word: בִּקְהַל יְהוָה
  choice: sa kapulungan ni Yahweh
  rationale: Ang קהל ay isang nagkakatipong pamayanan o kapulungan. Natural sa Tagalog ang “makapasok sa kapulungan,” at pinananatili ang personal na pangalan na Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ginagamit mismo ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa teksto.
- issue: Saklaw ng בָּנִים sa kontekstong legal at pangangkanan
  choice: mga anak
  alternative: mga anak na lalaki o mga inapo
  rationale: Bagaman panlalaking maramihan ang anyo, maaari itong tumukoy sa mga supling ng isang angkan sa ganitong konteksto. Hindi nililimitahan ng “mga anak” ang diwa sa mga lalaki lamang.
- issue: Modal na diwa ng יָבֹא
  choice: maaaring makapasok
  alternative: papasok
  rationale: Ang mas pormal na anyo ay maaaring unawaing “papasok,” ngunit ang tuntuning legal sa konteksto ay tumutukoy sa pahintulot na makabilang simula sa ikatlong salinlahi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” para sa pormal na nagkakatipong pamayanan at “salinlahi” para sa pangangkanang henerasyon; iniwasan ang mga arkaikong salita at denominasyonal na pagpapakahulugan.
