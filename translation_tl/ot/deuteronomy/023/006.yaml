  naturalness: Natural at dignificado ang rebisyon sa modernong Filipino Tagalog. Ang “ginawang pagpapala para sa inyo ang sumpa” ay malinaw at maayos na Tagalog.
  terminology: Wasto ang “Yahweh,” “Diyos,” “Balaam,” “sumpa,” at “pagpapala.” Ang maramihang “inyong/kayo” ay katanggap-tanggap para sa Israel bilang kolektibong kausap, kahit isahan ang hulaping Hebreo.
