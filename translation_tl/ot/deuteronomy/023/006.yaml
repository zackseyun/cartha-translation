  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: tl
  text: Ngunit hindi pumayag si Yahweh na inyong Diyos na pakinggan si Balaam, at ginawang pagpapala para sa inyo ni Yahweh na inyong Diyos ang sumpa, sapagkat minahal kayo ni Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: ayaw
  rationale: Ipinahahayag ng pandiwa ang hindi pagpayag o hindi pagkagusto, hindi kawalan ng kakayahan. Natural sa modernong Tagalog ang “ayaw pakinggan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Ang hulaping ikalawang panauhang panlalaking isahan sa Hebreo ay tumutukoy sa Israel bilang isang sama-samang kausap; ang “inyong” ay natural sa Tagalog para sa buong bayan.
- source_word: לִשְׁמֹעַ אֶל
  choice: pakinggan
  rationale: Saklaw ng parirala ang pakikinig na may pagsang-ayon o pagtugon. Pinananatili ng “pakinggan” ang lawak ng kahulugan nang hindi labis na ipinapaliwanag.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Karaniwang anyo ng pangalang pantangi sa Tagalog at sa mga salin ng Bibliya.
- source_word: וַיַּהֲפֹךְ
  choice: ginawa ... na
  rationale: Ipinahahayag nito ang pagbabago ng sumpa tungo sa pagpapala sa natural at malinaw na Tagalog.
- source_word: הַקְּלָלָה
  choice: ang sumpa
  rationale: Tuwirang katumbas ng pangngalang tumutukoy sa sumpang binalak o binigkas laban sa Israel.
- source_word: לִבְרָכָה
  choice: na pagpapala
  rationale: 'Kasunod ng “ginawa,” malinaw nitong ipinahahayag ang bunga ng pagbabago: ang sumpa ay naging pagpapala.'
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang sanhi ng pagkilos ni Yahweh, sa dignificado ngunit madaling maunawaang rehistro.
- source_word: אֲהֵבְךָ
  choice: minahal kayo
  rationale: Tuwirang inililipat ang payak at makapangyarihang pahayag ng pag-ibig ng Diyos sa Israel.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Bilang ng kausap sa אֱלֹהֶיךָ at אֲהֵבְךָ
  choice: inyong / kayo
  alternative: iyong / ka
  rationale: Bagaman gramatikal na isahan ang mga hulapi sa Hebreo, sama-samang kinakausap ni Moises ang Israel. Mas natural sa Tagalog ang maramihang anyo, habang nananatili ang kolektibong pagtukoy.
- issue: Kahulugan ng hindi pakikinig kay Balaam
  choice: ayaw pakinggan
  alternative: hindi dininig; hindi sinunod
  rationale: Hindi tinutukoy nang mas makitid kung ang diin ay pagtangging dinggin, sang-ayunan, o tugunan ang balak ni Balaam. Pinananatili ng “pakinggan” ang tunay na lawak ng idyomang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at dignificado. Ginamit ang “sa halip” upang malinaw na maipakita ang salungat na kilos sa ikalawang sugnay, at ang kolektibong “inyong/kayo” para sa Israel bilang kausap.
