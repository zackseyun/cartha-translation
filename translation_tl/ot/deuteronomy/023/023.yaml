  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: tl
  text: Ngunit kung hindi ka gagawa ng panata, hindi ka magkakasala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “wala kang pananagutan.” Sa literal, “walang kasalanan sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Ngunit kung
  rationale: Ipinahihiwatig ng tambalang pang-ugnay ang kondisyong kasalungat ng naunang utos tungkol sa pagtupad ng panata.
- source_word: תֶחְדַּל לִנְדֹּר
  choice: hindi ka gagawa ng panata
  rationale: Ang חדל kasama ng pawatas na נדר ay tumutukoy sa pagpiling huwag manata. Likas at malinaw sa makabagong Filipino ang pariralang ito.
- source_word: לֹא יִהְיֶה בְךָ חֵטְא
  choice: hindi ka magkakasala
  rationale: Natural nitong ipinapahayag sa Filipino ang Hebreong idyoma na literal na nagsasabing hindi magkakaroon ng kasalanan sa isang tao. Nananatili sa talababa ang posibleng diwang legal na ‘pananagutan.’
theological_decisions:
- issue: Ang moral na katayuan ng hindi paggawa ng panata
  choice: Hindi kasalanan ang pagpiling huwag gumawa ng panata.
  alternative: Walang pananagutan o pagkakasalang legal ang taong hindi gumagawa ng panata.
  rationale: Maaaring mangahulugan ang חֵטְא ng kasalanan o pananagutan. Sa konteksto, ang hindi paggawa ng panata ay hindi sanhi ng pagkakasala; ang pagkakasala ay kaugnay ng panatang ginawa ngunit hindi tinupad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang pariralang “gumawa ng panata” at iniwasan ang mas matigas na literal na anyo, habang pinanatili sa talababa ang Hebreong idyoma at ang posibleng legal na diwa ng חֵטְא.
