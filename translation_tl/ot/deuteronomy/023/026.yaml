  naturalness: Mas likas ang “gamit ang iyong kamay” kaysa “sa pamamagitan ng iyong kamay.” Ang “mga tanim na butil na nakatayo pa” ay malinaw na modernong Filipino at iniiwasan ang di-makatwirang pagtukoy sa isang tiyak na uri ng butil.
  terminology: Pinananatili ang “kapwa,” “uhay,” at “karit.” Pinalitan ang “trigo” ng “mga tanim na butil” upang mapanatili ang lawak ng Hebreong termino.
