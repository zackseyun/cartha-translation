revisions:
- from: Kapag pumasok ka sa nakatayong trigo ng iyong kapwa, maaari kang pumitas ng mga uhay[a] sa pamamagitan ng iyong kamay, ngunit huwag mong gamitan ng karit ang nakatayong trigo ng iyong kapwa.[b]
  to: Kapag pumasok ka sa mga tanim na butil ng iyong kapwa na nakatayo pa, maaari kang pumitas ng mga uhay[a] gamit ang iyong kamay, ngunit huwag mong gamitan ng karit ang mga tanim na butil ng iyong kapwa na nakatayo pa.[b]
  rationale: Inalis ang pagtukoy sa “trigo,” na wala sa Hebreo, at pinalitan ito ng pangkalahatang “mga tanim na butil.” Pinahusay din ang idyoma ng paraan ng pagpitas at nilinaw ang talababa tungkol sa pandiwang ginagamit para sa karit, habang pinananatili ang legal na kaibahan ng pinahihintulutang pagpitas gamit ang kamay at ipinagbabawal na pag-aani gamit ang karit.
