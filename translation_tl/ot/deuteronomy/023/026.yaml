  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: tl
  text: Kapag pumasok ka sa mga tanim na butil ng iyong kapwa na nakatayo pa, maaari kang pumitas ng mga uhay[a] gamit ang iyong kamay, ngunit huwag mong gamitan ng karit ang mga tanim na butil ng iyong kapwa na nakatayo pa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga uhay” ay mga bahaging kinaroroonan ng mga butil na maaaring pitasin gamit ang kamay.
    reason: lexical_clarification
  - marker: b
    text: 'Mas literal: “huwag mong iugoy” o “ilapat ang karit sa mga tanim na butil ng iyong kapwa na nakatayo pa.” Ipinagbabawal nito ang paggamit ng karit sa mga pananim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Kapag pumasok ka
  rationale: Ang כִּי ay nagpapakilala rito ng sitwasyong saklaw ng batas; likas sa modernong Tagalog ang “kapag.” Ang בוא ay maaaring mangahulugang pumasok sa isang lugar.
- source_word: בְּקָמַת
  choice: sa nakatayong trigo
  rationale: Ang קָמָה ay tumutukoy sa butil na nakatayo pa at hindi pa naaani. Ginamit ang “trigo” bilang natural na katawagan sa pananim na butil sa kontekstong ito, habang pinananatili ng “nakatayo” ang tiyak na larawan ng Hebreo.
- source_word: רֵעֶךָ
  choice: ng iyong kapwa
  rationale: Sa kontekstong pambatas, ang רֵעַ ay tumutukoy sa ibang kasapi ng pamayanan. Ang “kapwa” ay mas angkop kaysa “kapitbahay,” na maaaring magpahiwatig lamang ng taong nakatira sa malapit.
- source_word: וְקָטַפְתָּ
  choice: maaari kang pumitas
  rationale: Bagaman payak ang anyong pandiwa, nagpapahayag ito rito ng pinahihintulutang kilos, hindi ng utos na kailangang gawin.
- source_word: מְלִילֹת
  choice: mga uhay
  rationale: Ang מְלִילֹת ay mga bahaging namumunga ng butil na maaaring pitasin sa pamamagitan ng kamay. Ang “uhay” ang natural at tumpak na salitang Filipino.
- source_word: בְּיָדֶךָ
  choice: sa pamamagitan ng iyong kamay
  rationale: Binibigyang-diin ng parirala na mano-mano lamang ang pinahihintulutang pagkuha, bilang kaibahan sa paggamit ng karit.
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: ngunit huwag mong gamitan ng karit
  rationale: Ang pangatnig ay nagpapakita ng pagsalungat sa pinahihintulutang pagpitas. Ang Hiphil ng נוּף ay literal na magtaas, mag-ugoy, o maglapat; sa karit, natural na ipinahahayag sa Tagalog bilang paggamit nito sa pag-aani.
- source_word: עַל קָמַת רֵעֶךָ
  choice: ang nakatayong trigo ng iyong kapwa
  rationale: Pinananatili ang pag-uulit ng teksto at ang pokus sa hindi pa naaning pananim ng kapwa.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may tuwirang anyong pambatas. Ginamit ang “kapwa” sa halip na “kapitbahay” upang maiwasang paliitin ang saklaw ng רֵעַ. Ang “nakatayong trigo” ay bahagyang teknikal ngunit malinaw na nagpapanatili sa kaibahan ng pagpitas ng ilang uhay at ganap na pag-aani.
