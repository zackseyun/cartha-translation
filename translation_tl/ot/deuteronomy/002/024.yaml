  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: tl
  text: Tumindig kayo, humayo, at tumawid sa Lambak ng Arnon[a]. Tingnan mo[d], ibinigay ko na sa iyong kamay si Sihon, ang Amoreo na hari ng Heshbon, at ang kanyang lupain. Simulan mong angkinin iyon[b], at makipagdigma ka sa kanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Wadi ng Arnon,” “batis ng Arnon,” o “libis ng Arnon.” Ang Hebreong נחל ay maaaring tumukoy sa wadi, daluyan ng tubig, o lambak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “simulan mong ariin iyon.” Ang pandiwa ay maaari ring mangahulugang “alisan ng pag-aari” o “itaboy upang angkinin,” ngunit ang pinakamalapit na tinutukoy dito ay ang lupain ni Sihon.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “makipagtunggali ka sa kanya sa digmaan” o “hamunin mo siya sa digmaan.”
    reason: lexical_alternative
  - marker: d
    text: Mula rito, nagbabago ang Hebreo mula sa maramihang pautos tungo sa isahan, sapagkat kinakausap ang Israel bilang isang kabuuan.
    reason: grammatical_clarification
lexical_decisions:
- source_word: ק֣וּמוּ סְּע֗וּ
  choice: Tumindig kayo, humayo
  rationale: 'Pinananatili ang magkasunod na maramihang pautos: bumangon upang kumilos, saka maglakbay. Ang “humayo” ay likas at marangal sa modernong Filipino.'
- source_word: וְעִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן
  choice: at tumawid sa Lambak ng Arnon
  rationale: Ang עבר ay tumutukoy sa pagtawid, samantalang ang נחל ay maaaring lambak, wadi, o batis. “Lambak” ang pinakamalinaw sa karaniwang mambabasa nang hindi ipinapalagay na maliit lamang na batis ito.
- source_word: רְאֵ֣ה
  choice: Tingnan mo
  rationale: Isahang pautos ito sa Hebreo, na tumutukoy sa Israel bilang isang kabuuan. Pinananatili ang paglipat mula maramihan tungo sa isahan.
- source_word: נָתַ֣תִּי בְיָדְךָ
  choice: ibinigay ko na sa iyong kamay
  rationale: Pinananatili ang aspektong ganap ng pandiwa at ang larawang Hebreo ng pagbibigay sa kamay, na nagpapahayag ng pagkakaloob ng kapangyarihan o pamamahala.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָאֱמֹרִ֛י
  choice: si Sihon, ang Amoreo na hari ng Heshbon
  rationale: Malinaw at natural na ipinapahayag ang pagkakakilanlan ni Sihon bilang Amoreo at hari ng Heshbon nang hindi inaalis ang alinmang paglalarawan.
- source_word: וְאֶת אַרְצוֹ
  choice: at ang kanyang lupain
  rationale: Ang “lupain” ay tuwirang katumbas ng אֶרֶץ dito bilang nasasakupan ng hari.
- source_word: הָחֵל רָשׁ
  choice: Simulan mong angkinin iyon
  rationale: Ipinahahayag ng ירש ang pagkuha at paghawak ng lupain bilang pag-aari; ang “angkinin” ay natural sa Filipino at pinananatiling lupain ang pinakamalapit na layon.
- source_word: וְהִתְגָּר בּוֹ מִלְחָמָה
  choice: at makipagdigma ka sa kanya
  rationale: Malinaw nitong ipinahahayag ang pagpasok sa pakikipaglaban, habang ang talababa ay nagpapanatili sa posibleng diwa ng paghamon o pakikipagtunggali.
theological_decisions:
- issue: Ang pagkakaloob ng Diyos at ang pagkilos ng Israel sa pananakop
  choice: Pinanatili kapwa ang ganap na pahayag na “ibinigay ko na” at ang mga utos na angkinin ang lupain at makipagdigma.
  alternative: Isalin ang pagkakaloob bilang panghinaharap na pangako, o gawing pangunahing diwa ng ירש ang pagtataboy sa dating naninirahan.
  rationale: Magkatabing inilalahad ng Hebreo ang natapos o tiyak na pagkakaloob ng Diyos at ang iniutos na pagkilos ng Israel. Hindi dapat palabuin o lutasin ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Tumindig” at “humayo” upang mapanatili ang lakas ng sunod-sunod na pautos nang hindi lubhang makaluma. Sadyang pinanatili ang pagbabago mula “kayo” tungo sa “mo/iyong” dahil naroon ito sa Hebreo at makabuluhan sa kolektibong pagtukoy sa Israel.
