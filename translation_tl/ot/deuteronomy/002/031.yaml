id: DEU.2.31
reference: Deuteronomy 2:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י רְאֵ֗ה הַֽחִלֹּ֨תִי֙ תֵּ֣ת לְ/פָנֶ֔י/ךָ אֶת סִיחֹ֖ן וְ/אֶת אַרְצ֑/וֹ הָחֵ֣ל רָ֔שׁ לָ/רֶ֖שֶׁת אֶת אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: tl
  text: At sinabi sa akin ni Yahweh, “Tingnan mo, sinimulan ko nang ibigay sa iyo[a] si Sihon at ang kanyang lupain. Simulan mo nang angkinin ang kanyang lupain.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “sa harapan mo.” Ipinahihiwatig ng parirala na inilalagay ni Yahweh si Sihon at ang lupain nito sa kapangyarihan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, magkasunod na ginamit ang dalawang anyo ng iisang pandiwa: maaaring isalin, “Simulan mong angkinin upang maangkin ang kanyang lupain.” Binibigyang-diin nito ang pagsisimula ng pagkuha sa lupain.'
    reason: source_repetition
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Pautos na panawag-pansin ito; likas at tuwiran ang “Tingnan mo” sa makabagong Tagalog.
- source_word: הַחִלֹּתִי תֵּת
  choice: sinimulan ko nang ibigay
  rationale: Ipinapahayag ng perpektong anyo at kasunod na pawatas na nagsimula na ang pagkilos ni Yahweh at nagpapatuloy ang bunga nito.
- source_word: לְפָנֶיךָ
  choice: sa iyo
  rationale: Literal itong “sa harapan mo,” ngunit sa konteksto ay tumutukoy sa paglalagay kay Sihon at sa lupain niya sa kapangyarihan ng Israel; “ibigay sa iyo” ang likas na pagpapahayag sa Tagalog.
- source_word: הָחֵל
  choice: Simulan mo nang
  rationale: 'Pinananatili nito ang sinadyang pagtutugma: nagsimula nang magbigay si Yahweh, kaya dapat nang magsimulang kumilos ang Israel.'
- source_word: רָשׁ לָרֶשֶׁת
  choice: angkinin
  rationale: Ang ugat na ירש ay tumutukoy rito sa pagkuha at paghawak sa lupain bilang pag-aari. Isang likas na pandiwa ang ginamit sa pangunahing teksto, habang ipinaliliwanag sa talababa ang pag-uulit sa Hebreo.
- source_word: אַרְצוֹ
  choice: ang kanyang lupain
  rationale: Tumutukoy ito sa teritoryong pinamumunuan ni Sihon; “lupain” ang malinaw at karaniwang katumbas.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong pangalan sa pamamagitan ng transliterasyong “Yahweh,” hindi pinalitan ng titulo.
- issue: Ugnayan ng pagkilos ng Diyos at ng Israel
  choice: Pinanatili ang pagtutugma ng “sinimulan ko” at “Simulan mo”
  alternative: Ipahayag lamang na ibinigay na ang lupain o na Israel lamang ang sasakop dito
  rationale: Magkasamang ipinapakita ng Hebreo ang sinimulang pagbibigay ni Yahweh at ang iniutos na pagtugon ng Israel, nang hindi pinapawi ang tensiyon sa pagitan ng dalawang pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “angkinin” upang ipahayag ang pagkuha sa lupain bilang pag-aari nang hindi gawing mabigat ang natural na daloy; ang literal na pag-uulit ng Hebreo ay inilagay sa talababa.
