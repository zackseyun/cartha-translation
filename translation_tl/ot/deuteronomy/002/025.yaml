base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: tl
  text: Sa araw na ito, sisimulan kong ilagay sa lahat ng bayan sa silong ng buong langit ang pangamba at takot sa iyo—na makaririnig ng balita tungkol sa iyo[a]—at manginginig at mamimilipit sila[b] dahil sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang iyong katanyagan” o “ang balita hinggil sa iyo.” Ang salitang Hebreo ay maaaring tumukoy sa isang ulat o balitang lumilikha ng reputasyon.
    reason: lexical_alternative
  - marker: b
    text: O “darating sila sa matinding hirap” o “mamimilipit na gaya ng babaeng nanganganak.” Ang pandiwang Hebreo ay naglalarawan ng matinding pisikal na paghihirap o pamimilipit.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחֵל תֵּת
  choice: sisimulan kong ilagay
  rationale: Ang Hiphil ng חלל na sinusundan ng pawatas ng נתן ay idyomang nangangahulugang ‘magsimulang magbigay o maglagay.’ Likas sa Filipino ang ‘ilagay’ kaugnay ng pangamba at takot na ipapataw sa mga bayan.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: ang pangamba at takot sa iyo
  rationale: Pinananatili ang dalawang magkatulad ngunit hindi ganap na magkaparehong salita. Nililinaw ng ‘sa iyo’ na ang mga bayan ang matatakot sa Israel, hindi na ang tinutukoy ay sariling takot ng Israel.
- source_word: עַל פְּנֵי הָעַמִּים
  choice: sa lahat ng bayan
  rationale: Ang literal na larawan ay ‘sa ibabaw ng mukha ng mga bayan,’ ngunit idyomatiko itong tumutukoy sa pagpapasapit ng takot sa mga bayan. Ang ‘sa lahat ng bayan’ ay natural sa Filipino; ang ‘lahat’ ay kaugnay ng saklaw na ipinahahayag ng kasunod na parirala.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: sa silong ng buong langit
  rationale: Pinananatili ang biblikal na idyoma para sa malawak na daigdig sa ilalim ng langit, sa paraang marangal at nauunawaan sa Filipino.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: Kapag narinig nila ang balita tungkol sa iyo
  rationale: Maaaring mangahulugan ang שֵׁמַע ng balita, ulat, o reputasyong nalilikha ng naririnig. Sapat ang lawak ng ‘balita tungkol sa iyo’ upang hindi isara ang kahulugan sa ‘katanyagan’ lamang.
- source_word: וְרָגְזוּ
  choice: manginginig sila
  rationale: Ipinahihiwatig ng pandiwa ang panginginig o matinding pagkabalisa dahil sa takot. Tuwiran at natural ang ‘manginginig’ sa konteksto.
- source_word: וְחָלוּ
  choice: mamimilipit
  rationale: Ang pandiwa ay maaaring tumukoy sa pamimilipit sa matinding hirap, kabilang ang larawang gaya ng sakit ng panganganak. Pinananatili ng ‘mamimilipit’ ang pisikal at masidhing larawan nang hindi labis na tinutukoy ang panganganak sa pangunahing teksto.
- source_word: מִפָּנֶיךָ
  choice: dahil sa iyo
  rationale: Bagaman literal na ‘mula sa harap o presensiya mo,’ sanhi ng kanilang sindak ang diwa nito sa konteksto. Malinaw itong naihahayag ng ‘dahil sa iyo.’
