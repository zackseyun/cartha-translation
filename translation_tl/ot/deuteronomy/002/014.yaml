language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: tl
  text: Ang panahong ginugol namin sa paglalakbay mula sa Kadesh-barnea hanggang sa makatawid kami sa Wadi Zered ay tatlumpu't walong taon[a], hanggang sa maubos mula sa gitna ng kampo ang buong salinlahi ng mga lalaking mandirigma, gaya ng ipinanumpa ni Yahweh sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Batis ng Zered” o “tuyong daluyan ng Zered.” Ang salitang Hebreo ay maaaring tumukoy sa isang batis, tuyong daluyan ng tubig, o wadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: Ang panahong ginugol namin
  rationale: Literal na tumutukoy sa “mga araw,” ngunit sa konteksto ay saklaw o tagal ng paglalakbay; natural sa Tagalog ang “panahong ginugol namin.”
- source_word: הָלַכְנוּ
  choice: sa paglalakbay
  rationale: Sa konteksto ng ruta at mahabang panahon, malinaw at likas ang “paglalakbay” kaysa literal na “paglakad.”
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: mula sa Kadesh-barnea
  rationale: Pinananatili ang pangalan ng pook sa karaniwang transliterasyon.
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: hanggang sa makatawid kami
  rationale: Ang עבר kaugnay ng isang daluyan ng tubig ay natural na isinasaling “tumawid.”
- source_word: נַחַל זֶרֶד
  choice: Wadi Zered
  rationale: Ang נחל ay maaaring tuyong ilog o lambak na dinadaluyan lamang sa ilang panahon; mas tiyak sa heograpiya ang “wadi,” habang inilalahad sa talababa ang posibleng alternatibo.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: tatlumpu't walong taon
  rationale: Karaniwan at malinaw na anyo ng bilang sa modernong Tagalog.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: Sa panahong iyon, naubos ... ang buong salinlahi
  rationale: Ipinahahayag ang kaganapan o pagkaubos ng salinlahi sa loob ng nabanggit na panahon nang hindi ginagawang mekanikal ang pangungusap.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: mga lalaking mandirigma
  rationale: Pinananatili ang tahasang panlalaking reperensiya at ang papel nila bilang mga taong pandigma.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: mula sa kampo
  rationale: Likas na Tagalog para sa pagkawala nila mula sa gitna ng pamayanan sa kampo.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: gaya ng isinumpa ni Yahweh sa kanila
  rationale: Pinananatili ang wika ng panunumpa at ang pangalang tipan na Yahweh.
theological_decisions:
- issue: Paglalarawan sa pagkaubos ng salinlahi
  choice: naubos mula sa kampo ang buong salinlahi
  alternative: namatay ang buong salinlahi
  rationale: Ang תֹּם ay nagpapahiwatig ng pagdating sa wakas o pagkaubos; hindi idinaragdag ang mas tahasang “namatay,” bagaman iyon ang ipinahihiwatig ng konteksto.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at hindi ito pinapalitan ng isang titulo.
- issue: Panlalaking reperensiya sa אַנְשֵׁי הַמִּלְחָמָה
  choice: mga lalaking mandirigma
  alternative: mga mandirigma
  rationale: Tahasang panlalaki ang pariralang Hebreo at tumutukoy sa mga lalaking nasa gulang para sa pakikidigma.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Hinati sa dalawang pangungusap upang maging natural ang mahabang sintaks ng Hebreo, habang pinananatili ang ugnayan ng tatlumpu't walong taon at ng pagkaubos ng salinlahing pandigma.
