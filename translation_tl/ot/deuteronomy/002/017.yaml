  text: 'Pagkatapos, nagsalita sa akin si Yahweh at sinabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, kaya natural ang “Pagkatapos.” Bagaman mas literal na “nagsalita” ang דּבר, ang “sinabi” ay likas na panimula sa tuwirang pahayag sa Filipino, lalo na kasama ng לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na יהוה sa anyong “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֵלַי
  choice: sa akin
  rationale: 'Ang אֶל na may hulaping unang panauhang isahan ay nagpapahayag ng patutunguhan ng pagsasalita: “sa akin.”'
- source_word: לֵאמֹר
  choice: nakapaloob sa “sinabi”
  rationale: Ang לֵאמֹר ay pormulang nagpapakilala sa susunod na tuwirang pahayag. Sa natural na Filipino, sapat na itong katawanin ng “sinabi”; ang “na sinasabi” ay magiging mabigat at paulit-ulit.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan at iniiwasang palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang natural na pormulang “sinabi sa akin ni Yahweh” sa halip na ang mas mabigat na “nagsalita sa akin si Yahweh, na sinasabi.”
