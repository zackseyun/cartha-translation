  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: tl
  text: Ngunit hindi ninyo nilapitan ang lupain ng mga Ammonita[a]—ni ang anumang bahagi sa tabi ng batis ng Jabok[b], ni ang mga lungsod sa kabundukan, ni ang anumang sakop ng iniutos ni Yahweh na ating Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “ang lupain ng mga anak ni Ammon.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “ang buong kamay ng Wadi Jabok.” Isa itong idyomang Hebreo para sa pampang, tagiliran, o rehiyong nasa kahabaan ng Jabok.'
    reason: cultural_note
  - marker: c
    text: 'Literal: “at ang lahat ng iniutos ni Yahweh na ating Diyos.” Hindi tahasang binabanggit sa Hebreo ang layon ng iniutos; ipinahihiwatig ng konteksto na tumutukoy ito sa mga sakop o lugar na hindi nila nilapitan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Ipinakikita nito ang eksepsiyon o hangganan sa naunang salaysay. Mas natural sa Filipino ang “Ngunit” kaysa sa literal na “Tanging” sa simula ng pangungusap.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: ang lupain ng mga Ammonita
  rationale: Ang “mga Ammonita” ay natural at malinaw na katumbas sa modernong Filipino ng literal na “mga anak ni Ammon,” habang pinananatili sa talababa ang anyong Hebreo.
- source_word: לֹא קָרָבְתָּ
  choice: hindi ninyo nilapitan
  rationale: Ang pandiwang קרב ay tumutukoy sa paglapit. Hindi ito isinaling “sinalakay” upang hindi magdagdag ng tiyak na kahulugang militar na hindi tahasang sinasabi ng Hebreo. Ginamit ang maramihang “ninyo” para sa Israel bilang bayan, bagaman pang-isahan ang anyong Hebreo.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: ang buong kahabaan ng pampang ng Ilog Jabok
  rationale: Ang idyomang “kamay ng batis/lambak” ay tumutukoy sa tagiliran, pampang, o rehiyong nasa tabi nito. Ipinahahayag ng “buong kahabaan” ang saklaw ng כָּל sa natural na Filipino.
- source_word: וְעָרֵי הָהָר
  choice: ang mga lungsod sa kabundukan
  rationale: Sa kontekstong heograpikal, הָהָר ay tumutukoy sa bulubundukin o mataas na lupain, hindi kinakailangang sa iisang bundok. Ang “mga lungsod” ay tuwirang katumbas ng עָרֵי.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: at ang lahat ng iniutos
  rationale: Pinananatili ang malawak at eliptikong pagkakabuo ng Hebreo sa halip na tahasang idagdag kung mga lugar, hangganan, o bagay ang iniutos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Natural na katumbas ng inklusibong panghalip na “aming/ating Diyos”; ang “ating” ay angkop dahil kabilang ang nagsasalita at mga kausap sa bayang tinutukoy.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Hindi tahasang layon ng וְכֹל אֲשֶׁר צִוָּה
  choice: ang lahat ng iniutos ni Yahweh na ating Diyos
  alternative: ang lahat ng lugar na ipinagbawal sa atin ni Yahweh na ating Diyos
  rationale: Eliptiko ang Hebreo at hindi nito tahasang sinasabing “mga lugar” o “ipinagbawal.” Pinananatili ng salin ang pagkaigting at lawak ng orihinal sa halip na lutasin ito sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” para sa kolektibong Israel at ang “ating Diyos” para sa inklusibong אֱלֹהֵינוּ. Ang dash ay nagpapakitang ang kasunod na mga parirala ay nagpapaliwanag sa saklaw ng lupaing hindi nilapitan.
