  - severity: low
    issue: Ang “Ilog” ay mas tiyak kaysa sa נַחַל.
    rationale: Ang נַחַל ay maaaring tumukoy sa batis, wadi, o lambak na dinadaluyan ng tubig. Ang “batis” ay mas hindi mapagpasya habang nananatiling natural sa Filipino.
