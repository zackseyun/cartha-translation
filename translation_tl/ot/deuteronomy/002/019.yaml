  source_fidelity: Tumpak na naipapahayag ng salin ang paglapit sa tapat ng mga anak ni Ammon, ang dalawang magkahiwalay na pagbabawal sa mapanlabang pagkilos, ang ganap na pagtangging magbigay ng anumang bahagi ng lupain, at ang naunang pagkakaloob nito sa mga anak ni Lot. Hindi nito idinadagdag ang “sa digmaan,” na wala sa Hebreo.
  naturalness: Makabago, malinaw, at angkop ang marangal na rehistro. Ang “Kapag lumapit ka sa tapat ng” ay bahagyang literal ngunit natural at kapaki-pakinabang upang mapanatili ang panlokasyong diwa ng מוּל. Ang “gipitin” at “hamunin” ay maayos na pares para sa malawak na saklaw ng dalawang pandiwang Hebreo.
  terminology: Konsistent ang “mga anak ni Ammon” at “mga anak ni Lot,” na pinananatili ang kinship phrasing ng Hebreo. Ang “bilang pag-aari” ay angkop para sa יְרֻשָּׁה, habang wastong ibinibigay ng talababa ang “bilang mana” bilang alternatibo. Tama ang mga anchor ng talababa at tumutugma ang bawat isa sa kaugnay na termino.
