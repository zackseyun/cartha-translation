  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: tl
  text: Kapag lumapit ka sa tapat ng mga anak ni Ammon[a], huwag mo silang gipitin[b] o hamunin, sapagkat hindi ko ibibigay sa iyo ang anumang bahagi ng lupain ng mga anak ni Ammon bilang pag-aari[c], dahil ibinigay ko iyon bilang pag-aari sa mga anak ni Lot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Ammonita” sa buong talata.
    reason: lexical_alternative
  - marker: b
    text: O “salakayin.” Maaaring malawak na tumukoy ang Hebreo sa anumang mapanlabang pagkilos, hindi lamang sa pormal na pagkubkob.
    reason: lexical_alternative
  - marker: c
    text: O “bilang mana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: Kapag lumapit ka sa tapat ng
  rationale: Pinananatili ng “lumapit” ang diwa ng paglapit, at ng “sa tapat ng” ang panlokasyong kahulugan ng מוּל nang hindi ipinapalagay na nakapasok na sa teritoryo.
- source_word: בְּנֵי עַמּוֹן
  choice: mga anak ni Ammon
  rationale: Tuwirang pinananatili ang pananalitang pangkamag-anakan sa Hebreo at ang pag-uulit nito sa talata; inilalagay sa talababa ang mas idyomatikong katawagang pambansa.
- source_word: אַל תְּצֻרֵם
  choice: huwag mo silang gipitin
  rationale: Ang “gipitin” ay malawak na sumasaklaw sa mapanlabang panggigipit at hindi nililimitahan ang utos sa pormal na pagkubkob sa isang lungsod.
- source_word: וְאַל תִּתְגָּר בָּם
  choice: o hamunin
  rationale: Ipinahahayag ng “hamunin” ang pagpukaw o pagsisimula ng alitan nang hindi idinaragdag sa pangunahing teksto ang tahasang pariralang “sa digmaan,” na wala sa Hebreo.
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: ang anumang bahagi ng lupain ng mga anak ni Ammon
  rationale: 'Inililitaw ng “anumang bahagi” ang partitive na puwersa ng מִן sa ilalim ng pagtanggi: walang bahagi ng lupain ang ibibigay.'
- source_word: יְרֻשָּׁה
  choice: bilang pag-aari
  rationale: Ang “pag-aari” ay malinaw sa konteksto ng lupaing ipinagkaloob at hindi labis na nagpapasya sa pagitan ng pagmamay-ari at minanang ari-arian; binabanggit sa talababa ang “mana.”
- source_word: לִבְנֵי לוֹט
  choice: sa mga anak ni Lot
  rationale: Pinananatili ang literal na balangkas ng pagkakamag-anak at iniiwasang palawakin nang tahasan sa “mga inapo,” bagaman iyon ang kontekstuwal na tinutukoy.
- source_word: נְתַתִּיהָ
  choice: ibinigay ko iyon
  rationale: Ang aspektong ganap ng pandiwa ay inilalarawan bilang natapos at may umiiral na bisa; malinaw na tumutukoy ang “iyon” sa lupain.
theological_decisions:
- issue: Pananalitang pangkamag-anakan sa pambansang katawagang בְּנֵי
  choice: mga anak ni Ammon / mga anak ni Lot
  alternative: mga Ammonita / mga inapo ni Lot
  rationale: Pinananatili nito ang diin ng Hebreo sa ugnayang angkan at sa lupang ipinagkaloob sa angkan ni Lot, nang hindi nagpapasok ng dagdag na doktrinal na paliwanag.
- issue: Saklaw ng banal na pagkakaloob sa lupain
  choice: hindi ko ibibigay ... ang anumang bahagi ... bilang pag-aari
  alternative: hindi ko ibibigay ... ang lupain bilang mana
  rationale: Malinaw na ipinahahayag ang ganap na pagbabawal sa pag-angkin ng kahit anong bahagi, habang pinananatiling bukas sa talababa ang leksikal na posibilidad na “mana.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang panghalip na “ka/mo/iyo” upang tumbasan ang isahang anyo sa Hebreo. Pinanatili ang “mga anak ni Ammon” at “mga anak ni Lot” para sa transparency sa pinagmulang teksto, habang ibinigay sa talababa ang mas karaniwang pambansang katawagan.
