  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: tl
  text: “Ngayon, tumindig kayo at tumawid sa Wadi ng Zered[a].” Kaya tumawid kami sa Wadi ng Zered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Batis ng Zered” o “Lambak ng Zered.” Ang salitang Hebreo na נחל ay maaaring tumukoy sa isang wadi, bangin, o daanan ng tubig, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Isang panandang temporal na nagpapakilala sa susunod na iniutos na pagkilos at nagpapanatili sa agarang dating ng Hebreo.
- source_word: קֻמוּ
  choice: tumindig kayo
  rationale: Pautos na maramihan ng קום. Ang “tumindig kayo” ay marangal at malinaw; ipinahihiwatig nito ang paghahandang kumilos, hindi lamang ang literal na pagtayo.
- source_word: וְעִבְרוּ
  choice: at tumawid
  rationale: Sa konteksto ng paglalakbay, ang עבר ay pagtawid mula sa isang panig patungo sa kabila. Pinananatili rin ang ugnayan nito sa kaparehong pandiwa sa hulihan ng talata.
- source_word: לָכֶם
  choice: hindi hiwalay na isinalin
  rationale: Ang etikong datibo ay nagbibigay-diin sa utos ngunit magiging pilit ang literal na “para sa inyong sarili”; likas na nakapaloob ang diin nito sa pautos na Filipino.
- source_word: נַחַל
  choice: Wadi
  rationale: Maaaring tumukoy ang נחל sa bangin o daanan ng tubig na pana-panahon lamang may agos. Ang “wadi” ang pinakatumpak sa heograpiyang ilang at iniiwasang ipalagay na palaging may tubig ang lugar.
- source_word: זָרֶד
  choice: Zered
  rationale: Pangalan ng lugar na isinalin sa karaniwang transliterasyon.
- source_word: וַנַּעֲבֹר
  choice: Kaya tumawid kami
  rationale: Ang wayyiqtol na unang panauhang maramihan ay nagsasalaysay ng pagtupad sa utos. Likas na ipinahahayag ng “kaya” ang kasunod na pagsasakatuparan nang hindi binabago ang diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “wadi” bilang tumpak na terminong heograpiko at nilinaw ito sa talababa. Ginamit ang panipi upang makilala ang iniulat na utos mula sa salaysay ng pagtupad.
