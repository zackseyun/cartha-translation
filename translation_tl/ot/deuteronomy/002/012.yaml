revisions:
- from: Noong una, ang mga Horeo ay naninirahan sa Seir. Ngunit inagawan sila ng lupain ng mga inapo ni Esau[a], nilipol sila at inalis sa kanilang harapan, at nanirahan ang mga ito sa kanilang lugar. Ganoon din ang ginawa ng Israel sa lupaing pag-aari nito[b], na ibinigay sa kanila ni Yahweh.
  to: Noong una, naninirahan ang mga Horeo sa Seir, ngunit inagawan sila ng mga inapo ni Esau ng kanilang lupain[a], pinuksa nila ang mga ito mula sa kanilang harapan, at nanirahan sila sa lugar ng mga iyon. Ganoon ang ginawa ng Israel sa lupaing pag-aari nito[b], na ibinigay ni Yahweh sa kanila.
