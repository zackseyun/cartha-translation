reference: Deuteronomy 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: tl
  text: Noong una, naninirahan ang mga Horeo sa Seir, ngunit inagawan sila ng mga inapo ni Esau ng kanilang lupain[a], pinuksa nila ang mga ito mula sa kanilang harapan, at nanirahan sila sa lugar ng mga iyon. Ganoon ang ginawa ng Israel sa lupaing pag-aari nito[b], na ibinigay ni Yahweh sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin ang pandiwang Hebreo bilang “pinalayas sila.” Maaari itong mangahulugang pag-angkin sa lupain sa pamamagitan ng pagpapaalis sa dating mga naninirahan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa lupaing minana nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: ang mga Horeo
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan ng pangkat-etniko, sa halip na ang higit na malabong transliterasyong “Horim.”
- source_word: לְפָנִים
  choice: noong una
  rationale: Temporal ang kahulugan dito; natural at malinaw sa modernong Filipino ang “noong una.”
- source_word: יִירָשׁוּם
  choice: inagawan sila ng lupain
  rationale: Sa konteksto ng pananakop, saklaw ng ירשׁ ang pag-angkin sa pag-aari sa pamamagitan ng pagpapaalis sa dating nakatira. Nililinaw ng salin ang lupain bilang ipinahihiwatig na pag-aari nang hindi ginagawang simpleng “minana.”
- source_word: וַיַּשְׁמִידוּם
  choice: nilipol sila
  rationale: Pinananatili ang matinding diwa ng שׁמד. Ang “nilipol” ay mas matibay kaysa “tinalo” ngunit hindi tahasang nagdaragdag ng paliwanag tungkol sa lawak ng pagwasak.
- source_word: מִפְּנֵיהֶם
  choice: inalis sa kanilang harapan
  rationale: Malapit ito sa Hebreong idyoma at ipinahihiwatig ang pag-aalis sa kanilang presensiya; pinanatili ang larawan sa halip na lubusang pakinisin bilang “pinalayas.”
- source_word: תַּחְתָּם
  choice: sa kanilang lugar
  rationale: Ipinahahayag nito ang pagpapalit sa mga dating naninirahan sa paraang natural sa Filipino.
- source_word: בְנֵי עֵשָׂו
  choice: mga inapo ni Esau
  rationale: Bagaman literal na “mga anak ni Esau,” tumutukoy rito ang parirala sa mga kaapu-apuhan o pangkat na nagmula sa kaniya.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: sa lupaing pag-aari nito
  rationale: Ang יְרֻשָּׁה ay lupaing natanggap at tinaglay bilang mana o pag-aari. Pinananatili ng “pag-aari” ang diwa ng pagmamay-ari at ang kolektibong isahan na tumutukoy sa Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinalitan ng isang titulo.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Pinanatili ang paglipat ng Hebreo mula sa kolektibong isahang Israel (“nito”) tungo sa maramihang reperensiya sa bayan (“sa kanila”).
theological_decisions:
- issue: Punto ng paghahambing sa “Ganoon din ang ginawa ng Israel”
  choice: Pinanatili bilang tuwirang paghahambing sa nakaraang ginawa ng Israel sa lupaing pag-aari nito.
  alternative: Ipaliwanag bilang huling idinagdag na pahayag o baguhin ang panahon upang hindi magmukhang naganap na ang pag-angkin ng Israel.
  rationale: Inilalahad ng tekstong Hebreo ang paghahambing nang walang paliwanag sa mga usaping kronolohikal o pinagmulan ng teksto. Hindi dapat lutasin ng salin ang tensiyong hindi nilulutas ng teksto.
- issue: Paglilipat mula sa kolektibong isahan tungo sa maramihan para sa Israel
  choice: “nito … sa kanila”
  alternative: Pak-inisin bilang pawang isahan o pawang maramihan.
  rationale: Ang Hebreo ay may “kaniyang pag-aari” ngunit kasunod ang “ibinigay sa kanila.” Pinanatili ang pagbabago ng bilang sapagkat maaaring tukuyin ang Israel bilang isang bayan at bilang mga taong bumubuo rito.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: Panginoon o Jehovah
  rationale: Pinananatili ang personal na pangalan sa tekstong pinagmulan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga inapo” sa halip na literal na “mga anak” dahil pangkat ng mga kaapu-apuhan ang tinutukoy. Sadyang pinanatili ang kolektibong “Israel … nito” at ang kasunod na maramihang “sa kanila,” gayundin ang matinding wika ng paglipol.
