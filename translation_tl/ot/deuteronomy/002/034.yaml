  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא וַֽ/נַּחֲרֵם֙ אֶת כָּל עִ֣יר מְתִ֔ם וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: tl
  text: Nang panahong iyon, nasakop namin ang lahat ng lunsod niya, at itinalaga namin sa paglipol[a] ang bawat lunsod, kasama ang mga lalaki, mga babae, at maliliit na bata. Wala kaming iniwang nakaligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nilipol namin nang lubusan.” Ang pandiwang Hebreo ay may diwa ng pagtatalaga sa ḥerem, ibig sabihin, pagtatalaga para sa ganap na paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: nasakop namin
  rationale: Ang לכד ay karaniwang pandiwang militar para sa pagkuha o pagsakop sa isang lunsod. Likas sa modernong Tagalog ang “nasakop” at malinaw nitong pinananatili ang konteksto ng digmaan.
- source_word: כָּל עָרָיו
  choice: ang lahat ng lunsod niya
  rationale: Maaaring tumukoy ang עִיר sa lunsod o bayan; ang “mga lunsod” ay angkop sa konteksto ng sunod-sunod na pananakop, at pinananatili ng “lahat” ang lawak ng כָּל.
- source_word: בָּעֵת הַהִוא
  choice: Nang panahong iyon
  rationale: Direkta, natural, at marangal na salin ng pariralang temporal.
- source_word: וַנַּחֲרֵם
  choice: itinalaga namin sa paglipol
  rationale: Ang Hiphil ng חרם ay tumutukoy sa pagtatalaga ng isang bagay o mga tao sa ḥerem, na sa kontekstong ito ay humahantong sa ganap na paglipol. Pinananatili ng “itinalaga” ang teknikal at sagradong dimensiyon, samantalang malinaw na ipinahahayag ng “sa paglipol” ang kinalabasan.
- source_word: כָּל עִיר מְתִם
  choice: ang bawat lunsod—ang mga lalaki
  rationale: Siksik at idyomatiko ang Hebreong parirala. Ang מְתִם ay tumutukoy sa mga taong lalaki, at ang gitling ay natural na nag-uugnay sa lunsod sa talaan ng mga taong naroon nang hindi ginagawang malabong “mga tao” ang salita.
- source_word: הַנָּשִׁים
  choice: mga babae
  rationale: Tuwiran at malinaw na salin ng pangngalang pambabae na maramihan.
- source_word: הַטָּף
  choice: maliliit na bata
  rationale: Ang טַף ay karaniwang tumutukoy sa maliliit na bata o batang umaasa sa matatanda; higit na tiyak ang “maliliit na bata” kaysa sa pangkalahatang “mga bata.”
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: Wala kaming iniwang nakaligtas
  rationale: Ang שָׂרִיד ay isang nakaligtas o natirang buhay. Natural at malinaw sa kontekstong militar ang buong pariralang ito.
theological_decisions:
- issue: Paglalahad ng חרם sa salaysay ng pananakop
  choice: itinalaga namin sa paglipol
  alternative: nilipol namin nang lubusan; isinailalim namin sa pagbabawal
  rationale: Pinananatili ng napiling salin ang natatanging ideya ng ḥerem—pagtatalaga na humahantong sa pagwasak—nang hindi pinapalambot ang karahasan o dinaragdagan ng paliwanag na teolohikal na wala sa talata.
- issue: Pagiging tiyak sa kasarian ng מְתִם
  choice: ang mga lalaki, mga babae, at maliliit na bata
  alternative: ang mga tao, pati ang mga babae at bata
  rationale: Ibinubukod ng Hebreo ang mga lalaki sa mga babae at maliliit na bata. Pinananatili ng salin ang pagkakaibang ito sa halip na gawing pangkalahatan ang מְתִם bilang “mga tao.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “lunsod” para sa kontekstong militar at ang “itinalaga sa paglipol” upang mapanatili ang teknikal na puwersa ng חרם nang hindi gumagamit ng arkayko o denominasyonal na pananalita.
