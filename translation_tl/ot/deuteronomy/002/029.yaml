    issue: “ginawa sa akin” para sa עָשׂוּ לִי
    rationale: Bagaman malapit sa literal na anyo, maaaring magpahiwatig sa modernong Filipino ng kilos na ginawa sa isang tao, samantalang ang לִי ay “para sa akin.” Ang “ginawa para sa akin” ay mas malinaw at mas tapat sa Hebreo, habang nananatiling di-tiyak ang partikular na kilos.
  - severity: low
    issue: “makatawid ako sa Jordan papunta sa lupain”
    rationale: Nauunawaan ito, ngunit mas tuwiran at mas maayos ang “matawid ko ang Jordan patungo sa lupain,” na malinaw na ang Jordan ang tinatawid at ang lupain ang patutunguhan.
