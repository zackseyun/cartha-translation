base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: tl
  text: gaya ng ginawa para sa akin ng mga anak ni Esau na naninirahan sa Seir at ng mga Moabita na naninirahan sa Ar,[a] hanggang sa matawid ko ang Jordan patungo sa lupaing ibinibigay sa atin ni Yahweh na ating Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung paano nila ako pinakitunguhan.” Literal sa Hebreo, “ginawa para sa akin”; sa konteksto, tumutukoy ito sa pagpaparaan at pagbibigay ng mga panustos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Likas na Filipino para sa paghahambing at pinananatili ang diwang “just as/as.”
- source_word: עָשׂוּ לִי
  choice: ginawa sa akin
  rationale: Malapit sa literal na Hebreong “did for/to me” at hindi labis na tinutukoy kung anong ginawa; nililinaw ng talababa ang konteksto.
- source_word: בְּנֵי עֵשָׂו
  choice: mga anak ni Esau
  rationale: Pinananatili ang pamilyang katawagan ng Hebreo, bagaman kolektibo itong tumutukoy sa mga inapo o bayan ni Esau.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: na naninirahan sa Seir
  rationale: Ang participle ng ישב ay tumutukoy sa nakapirming paninirahan; natural at marangal ang “naninirahan.”
- source_word: וְהַמּוֹאָבִים
  choice: at ng mga Moabita
  rationale: Direktang katumbas ng pangmaramihang katawagan sa mga taga-Moab; ang “ng” ay hinihingi ng balangkas na “ginawa ... ng.”
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: na naninirahan sa Ar
  rationale: Pinananatili ang kaparehong participial na balangkas at ang pangalang pook na Ar.
- source_word: עַד אֲשֶׁר אֶעֱבֹר
  choice: hanggang sa makatawid ako
  rationale: Natural na Filipino para sa pagtawid sa isang hangganan o ilog at pinananatili ang unang panauhan.
- source_word: אֶת הַיַּרְדֵּן
  choice: sa Jordan
  rationale: Karaniwang pangalan ng ilog sa Filipino; sapat na sa konteksto ang “Jordan” nang hindi idinaragdag ang salitang “Ilog.”
- source_word: אֶל הָאָרֶץ
  choice: papunta sa lupain
  rationale: Ipinahahayag ang kilos tungo at papasok sa lupain pagkatapos tumawid sa Jordan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Tuwirang katumbas ng pangmaramihang unang-panauhang pag-aari at natural sa Filipino.
- source_word: נֹתֵן לָנוּ
  choice: ibinibigay sa atin
  rationale: Pinananatili ang kasalukuyan o nagpapatuloy na aspekto ng participle at ang Diyos bilang tagapagbigay.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng עָשׂוּ לִי
  choice: ginawa sa akin
  alternative: pinakitunguhan ako / ipinagkaloob sa akin ang pagdaan at mga panustos
  rationale: Hindi tahasang inuulit ng talata ang tiyak na ginawa. Pinananatili ng pangunahing teksto ang pagiging pangkalahatan ng Hebreo, habang inilalahad ng talababa ang ipinahihiwatig ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pamilyang katawagang “mga anak ni Esau,” ang mga pangalang Seir at Ar, at ang personal na pangalang Yahweh. Ang marker na [a] ay inilagay kaagad pagkatapos ng sugnay na saklaw ng talababa.
