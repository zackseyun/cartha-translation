base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: tl
  text: Mula sa Aroer, na nasa gilid ng Lambak ng Arnon, at sa lungsod na nasa lambak, hanggang sa Gilead, walang bayang napakataas para sa atin.[a] Ipinagkaloob ni Yahweh na ating Diyos sa atin ang lahat ng ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “walang bayang napakatibay para sa atin” o “walang bayang hindi natin marating.” Literal na sinasabi ng Hebreo na walang bayang “napakataas para sa atin,” anupat ginagamit ang taas bilang larawan ng matibay na depensa o pagiging mahirap marating.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: Mula sa Aroer
  rationale: Ang prefiks na מִן ay tumutukoy sa panimulang hangganan ng inilalarawang saklaw.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: gilid ng Lambak ng Arnon
  rationale: Ang שָׂפָה ay literal na labi o gilid; ang נַחַל ay maaaring tumukoy sa batis, bangin, o lambak-ilog. Ang 'gilid ng Lambak ng Arnon' ay malinaw at hindi labis na teknikal.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: at sa lungsod na nasa lambak
  rationale: Pinananatili ang payak na pang-ugnay na waw at ang heograpikong detalye nang hindi ipinapalagay ang eksaktong pagkakakilanlan ng lungsod.
- source_word: וְעַד הַגִּלְעָד
  choice: hanggang sa Gilead
  rationale: Ang עַד ay nagtatakda ng dulong hangganan ng saklaw.
- source_word: קִרְיָה
  choice: bayan
  rationale: Maaaring mangahulugan ang salita ng bayan o lungsod; ang 'bayan' ay natural at hindi nagpapalabis sa laki ng pamayanan.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: napakataas para sa atin
  rationale: Pinananatili nito ang Hebreong metapora ng taas, na sa konteksto ay nagpapahiwatig ng matibay na tanggulan o lugar na mahirap marating at sakupin.
- source_word: אֶת־הַכֹּל
  choice: ang lahat ng iyon
  rationale: Ang kolektibong parirala ay tumutukoy sa kabuuan ng mga lugar at teritoryong kababanggit lamang.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh na ating Diyos
  rationale: Isinasalin ang pangalan ng tipan na יְהוָה bilang 'Yahweh' at pinananatili ang kaugnayang ipinahahayag ng 'ating Diyos.'
- source_word: לְפָנֵינוּ
  choice: sa harapan natin
  rationale: Pinananatili ang Hebreong idyoma ng pagbibigay o paghaharap sa bayan, na sa konteksto ay nagpapahiwatig ng pagpapasailalim sa kanilang kapangyarihan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang nasa teksto ang Tetragrammaton; ang 'Yahweh' ay malinaw na transliterasyon ng pangalang tipan nang hindi pinapalitan ito ng isang titulo.
- issue: Metapora ng שָׂגְבָה מִמֶּנּוּ
  choice: napakataas para sa atin, na may talababa
  alternative: napakatibay para sa atin; hindi natin marating
  rationale: Pinananatili sa pangunahing teksto ang tunay na imahen ng taas at inilalahad sa talababa ang posibleng diwang militar, sa halip na pumili lamang ng isang pagpapakahulugan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'lambak' sa halip na teknikal na 'wadi,' at pinanatili ang Hebreong metapora sa pangunahing teksto. Ang hulma na 'mula ... at sa lungsod ... hanggang' ay sadyang sumusunod sa bahagyang masikip na sintaks ng pinagmulan nang hindi nagdaragdag ng ikalawang 'mula.'
