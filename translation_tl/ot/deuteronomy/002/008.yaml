  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: tl
  text: Kaya nagpatuloy tayo mula sa ating mga kapatid[b], ang mga anak ni Esau na naninirahan sa Seir, at iniwan natin ang daan ng Araba[a] na mula sa Elat at Ezion-geber. Pagkatapos ay lumiko tayo at nagpatuloy sa daan patungo sa ilang ng Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa daan ng Araba.” Ang “Araba” ay tumutukoy sa rehiyon ng lambak-bitak sa timog ng Dagat na Patay.
    reason: lexical_alternative
  - marker: b
    text: 'O “mga kamag-anak natin, ang mga inapo ni Esau.” Literal sa Hebreo: “ating mga kapatid, ang mga anak ni Esau.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: nagpatuloy tayo mula sa
  rationale: Ipinahihiwatig ng pandiwang עבר kasama ng מֵאֵת ang pagpapatuloy ng paglalakbay mula sa tabi o kinaroroonan ng isang pangkat. Ang saling ito ay likas sa Tagalog at hindi nagpapahiwatig na tumawid sila sa tubig.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: ating mga kapatid, ang mga anak ni Esau
  rationale: Pinananatili ang tahasang wikang pampagkamag-anak ng Hebreo at ang literal na katawagang “mga anak ni Esau,” na mahalaga sa paglalarawan sa ugnayan ng Israel at Edom.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: na naninirahan sa Seir
  rationale: Ang participle ng ישב ay tumutukoy sa pirmihang paninirahan; malinaw at kasalukuyang Tagalog ang “naninirahan.”
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: palayo sa daan ng Araba
  rationale: Pinananatili ang דֶּרֶךְ bilang “daan” at ang Araba bilang pangalang heograpiko. Ipinakikita ng “palayo” ang galaw na ipinahihiwatig ng prefiks na מִן.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: mula sa Elat at Ezion-geber
  rationale: Ginagamit ang madaling kilalaning anyo sa Tagalog ng mga pangalang pook habang pinananatili ang ugnayang “mula sa” ng tekstong Hebreo.
- source_word: וַנֵּפֶן
  choice: lumiko tayo
  rationale: Tuwirang ipinahihiwatig ng פנה ang pagbabago ng direksiyon.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: nagpatuloy sa daan sa ilang ng Moab
  rationale: Muling ginagamit ang “nagpatuloy” upang makita ang pag-uulit ng עבר, habang natural na isinasalin ang construct chain bilang “daan sa ilang ng Moab.”
theological_decisions:
- issue: Wikang pampagkamag-anak para sa Edom
  choice: ating mga kapatid, ang mga anak ni Esau
  alternative: mga kamag-anak natin, ang mga inapo ni Esau
  rationale: Hindi pinapahina ang “mga kapatid” tungo sa pangkalahatang “mga kamag-anak.” Pinananatili nito ang tensiyon at diin ng Deuteronomio na ang mga Edomita ay tunay na kaugnay ng Israel sa pamamagitan ni Esau.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang inklusibong “tayo/ating” sapagkat kinakausap ni Moises ang mga Israelitang kabilang sa isinasalaysay na paglalakbay. Inayos ang mga panandang talababa upang ang tala tungkol sa Araba ay nakaugnay sa “Araba” at ang tala tungkol sa pagkakamag-anak ay nakaugnay sa “mga kapatid.”
