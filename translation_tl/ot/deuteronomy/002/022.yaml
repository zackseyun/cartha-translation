  revised_text: 'gaya ng ginawa niya para sa mga anak ni Esau na naninirahan sa Seir: nilipol niya ang mga Horeo at inalis sila mula sa harapan nila, at inagawan nila ng lupain ang mga ito at nanirahan sila roon bilang kapalit nila hanggang sa araw na ito.'
