  terminology: Ang “mga anak ni Esau,” “Seir,” at “mga Horeo” ay angkop. Ang “inagawan nila ng lupain” ay malinaw na pagsasalin sa diwa ng pagdispossess at iniiwasan nitong ituring na bagay o ari-arian ang mga Horeo mismo.
