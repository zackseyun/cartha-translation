  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר עָשָׂה֙ לִ/בְנֵ֣י עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר אֲשֶׁ֨ר הִשְׁמִ֤יד אֶת הַ/חֹרִי֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּֽירָשֻׁ/ם֙ וַ/יֵּשְׁב֣וּ תַחְתָּ֔/ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: tl
  text: 'gaya ng ginawa niya para sa mga anak ni Esau na naninirahan sa Seir: nilipol niya ang mga Horeo at inalis sila mula sa harapan nila, at inagawan nila ng lupain ang mga ito at nanirahan sila roon bilang kapalit nila hanggang sa araw na ito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: gaya ng ginawa niya
  rationale: Pinananatili ang paghahambing sa naunang pahayag at ang malawak, di-tiyak na diwa ng עָשָׂה.
- source_word: לִבְנֵי עֵשָׂו
  choice: para sa mga anak ni Esau
  rationale: Iningatan ang pampamilya at pang-etnikong pananalita ng Hebreo nang hindi ito ginagawang artipisyal sa Tagalog.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: na naninirahan sa Seir
  rationale: Likas at kasalukuyang Tagalog para sa participial phrase na nagsasaad ng patuloy na paninirahan.
- source_word: הִשְׁמִיד
  choice: nilipol
  rationale: Ipinahahayag ang malakas na causative na diwa ng ganap na pagpuksa nang may marangal na rehistro.
- source_word: הַחֹרִי
  choice: ang mga Horeo
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat-etniko.
- source_word: מִפְּנֵיהֶם
  choice: sa harap nila
  rationale: Pinananatili ang konkretong idyomang Hebreo; sa konteksto, tumutukoy ito sa pag-aalis sa mga Horeo mula sa kanilang harapan o teritoryo.
- source_word: וַיִּירָשֻׁם
  choice: inagawan nila ng lupain ang mga ito
  rationale: Sa konteksto ng pananakop, ang ירשׁ ay pagkuha ng pag-aari sa pamamagitan ng pagpapaalis sa dating naninirahan; nililinaw ng 'lupain' ang bagay na inaangkin nang hindi ipinahihiwatig na ang mga tao mismo ang minana.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: nanirahan sila roon bilang kapalit nila
  rationale: Sinasalamin ang pag-okupa sa dating lugar ng mga Horeo at ang diwa ng תַחְתָּם, 'sa lugar/bilang kapalit nila.'
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Natural at pormal na katumbas ng nakaugaliang Hebreong pahayag tungkol sa pagpapatuloy hanggang sa panahon ng tagapagsalaysay.
theological_decisions:
- issue: Paksa ng mga pandiwang עָשָׂה at הִשְׁמִיד
  choice: Ang di-tahasang 'siya' ay tumutukoy sa PANGINOON ayon sa agarang konteksto, ngunit hindi inuulit ang pangalan sa mismong talata.
  alternative: Tahasan itong isalin bilang 'ang PANGINOON ang gumawa' at 'nilipol ng PANGINOON.'
  rationale: Pangatlong panauhang panlalaki ang anyo ng Hebreo at dinadala nito ang paksa mula sa konteksto. Ang panghalip na 'niya' ay malinaw sa daloy ngunit pinananatili ang ellipsis ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang sobrang makalumang 'tumatahan' at ang malabong literal na pagsasaling maaaring magpahiwatig na ang mga Horeo mismo ang inangkin bilang pag-aari.
