  verdict: revise
  source_fidelity: 'Ang pangunahing diwa at mga paksa ay wasto: ang di-tahasang Diyos ang gumawa para sa mga anak ni Esau, nilipol niya ang mga Horeo, at ang mga anak ni Esau ang umagaw ng lupain at nanirahan sa dating lugar. Gayunman, ang “nilipol niya sa harap nila” ay sa karaniwang Tagalog ay maaaring mangahulugang nilipol niya ang mga Horeo habang nakatanaw ang mga anak ni Esau. Ang מִפְּנֵיהֶם ay idyomang nagsasaad ng pag-aalis mula sa presensiya/teritoryo nila, hindi pangunahing tagpo ng pagkilos sa harap ng kanilang mga mata.'
