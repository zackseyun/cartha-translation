  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בֵּֽרַכְ/ךָ֗ בְּ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔/ךָ יָדַ֣ע לֶכְתְּ/ךָ֔ אֶת הַ/מִּדְבָּ֥ר הַ/גָּדֹ֖ל הַ/זֶּ֑ה זֶ֣ה אַרְבָּעִ֣ים שָׁנָ֗ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ לֹ֥א חָסַ֖רְתָּ דָּבָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: tl
  text: Sapagkat pinagpala ka ni Yahweh na iyong Diyos sa lahat ng gawain ng iyong mga kamay. Alam niya ang paglalakbay mo sa malaking ilang na ito.[a] Sa loob ng apatnapung taong ito, kasama mo si Yahweh na iyong Diyos; hindi ka nagkulang ng anuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Binantayan niya ang paglalakbay mo sa malaking ilang na ito.” Literal na “alam” ang pandiwang Hebreo, ngunit sa kontekstong ito maaari itong magpahiwatig ng masusing pagbabantay at pagkalinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בֵּרַכְךָ
  choice: pinagpala ka
  rationale: Pinananatili ng “pinagpala” ang malawak at panrelihiyong diwa ng pandiwa, hindi lamang materyal na pagpapaunlad.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: sa lahat ng gawain ng iyong mga kamay
  rationale: Natural na idyomang Filipino ito para sa lahat ng paggawa o pinagkakaabalahan ng isang tao, habang pinananatili ang kongkretong larawan ng kamay.
- source_word: יָדַע
  choice: Alam niya
  rationale: Pinananatili ang pangunahing kahulugang “alam/kilala” at hindi isinasama sa pangunahing teksto ang mas interpretatibong diwang “binantayan” o “iningatan.”
- source_word: לֶכְתְּךָ
  choice: ang paglalakbay mo
  rationale: Tumutukoy ito sa paglakad o paglalakbay ng Israel; mas natural sa modernong Filipino ang “paglalakbay” kaysa literal na “paglakad” sa kontekstong ito.
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: sa malawak na ilang na ito
  rationale: Ang “ilang” ay dignificado at pamilyar na salin ng wilderness; “malawak” ang natural na paglalarawan dito sa Filipino.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: Sa loob ng apatnapung taong ito
  rationale: Malinaw at likas na ipinahahayag ang buong panahong tinutukoy ng Hebreong pariralang temporal.
- source_word: עִמָּךְ
  choice: kasama mo
  rationale: Direkta at natural na ipinahahayag ang nagpapatuloy na presensiya ng Diyos.
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: hindi ka nagkulang ng anuman
  rationale: Natural na idyomang Filipino ito na tapat sa diwa ng ganap na kasapatan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng יָדַע sa konteksto
  choice: Alam niya
  alternative: Binantayan niya; iningatan niya
  rationale: Ang pangunahing diwang leksikal na “alam” ay pinanatili upang hindi tahimik na lutasin ang posibilidad na nagpapahiwatig din ito ng mapagkalingang pagbabantay.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “iyong Diyos” sa pariralang pangngalan ngunit ang mas natural na “kasama mo” at “paglalakbay mo” sa ibang bahagi. Pinanatili sa pangunahing teksto ang leksikal na tensiyon ng יָדַע at ipinaliwanag ang kontekstuwal na alternatibo sa talababa.
