    issue: Hindi natural at posibleng malabo ang "Ipagbili mo ako ng pagkain."
    rationale: Sa Filipino, ang ayos na ito ay maaaring unang maunawaang ang nagsasalita ang ipinagbibili. Ang "Magbenta ka sa akin ng pagkain" ay malinaw na nagmamarka sa nagsasalita bilang bumibili at nananatiling tapat sa kahulugang "sell me food."
  - severity: low
    issue: Hindi eksakto ang pahayag na literal sa talababa b.
    rationale: Ang בְּרַגְלַי ay literal na "sa aking mga paa"; ang "sa pamamagitan ng" ay isang pagpapaliwanag, hindi literal na salin.
