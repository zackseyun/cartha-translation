translation_notes:
  register: Makabago, magalang, at marangal na Filipino. Ginamit ang mga anyong pakiusap na “ipagbili mo,” “bigyan mo,” at “pahintulutan mo” upang ipakita ang petitionaryong diwa ng Hebreo. Ang “nang naglalakad” ay mas natural kaysa sa literal na “sa aking mga paa,” na pinanatili sa talababa.
