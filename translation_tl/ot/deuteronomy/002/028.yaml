  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: tl
  text: Magbenta ka sa akin ng pagkain kapalit ng pilak[a] upang makakain ako, at bigyan mo ako ng tubig kapalit ng pilak upang makainom ako; pahintulutan mo lamang akong dumaan nang naglalakad[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapalit ng salapi.” Literal sa Hebreo, “sa/kapalit ng pilak.”
    reason: lexical_alternative
  - marker: b
    text: Literal sa Hebreo, “sa aking mga paa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: pagkain
  rationale: Pangkalahatang katawagan ito sa pagkain at hindi tumutukoy lamang sa tinapay, butil, o baon.
- source_word: בַּכֶּסֶף
  choice: kapalit ng pilak
  rationale: Pinananatili nito ang kongkretong salitang Hebreo para sa pilak habang malinaw na ipinahahayag na bayad ang tinutukoy.
- source_word: תַּשְׁבִּרֵנִי
  choice: ipagbili mo ako
  rationale: Ang Hiphil ng שׁבר sa kontekstong ito ay nangangahulugang magbenta ng pagkain sa isang tao; likas at tuwiran ang pakiusap sa Filipino.
- source_word: וְאָכַלְתִּי
  choice: upang makakain ako
  rationale: Ipinahahayag ng anyo ang nilalayong bunga o layunin ng pakiusap, hindi lamang isang pangyayaring susunod.
- source_word: וּמַיִם
  choice: tubig
  rationale: Tuwirang katumbas ng salitang Hebreo.
- source_word: תִּתֶּן לִי
  choice: bigyan mo ako
  rationale: Likas at tuwirang salin ng נתן na may layong panghalip.
- source_word: וְשָׁתִיתִי
  choice: upang makainom ako
  rationale: Tulad ng וְאָכַלְתִּי, ipinahahayag nito ang nilalayong bunga o layunin ng pakiusap.
- source_word: רַק
  choice: lamang
  rationale: 'Nililimitahan nito ang hinihingi: ang tanging pahintulot na mahalaga ay ang makadaan.'
- source_word: אֶעְבְּרָה
  choice: pahintulutan mo akong dumaan
  rationale: Ang cohortative ay may pakiusap na humihingi ng pahintulot; malinaw itong naihahayag ng pariralang Filipino.
- source_word: בְרַגְלָי
  choice: nang naglalakad
  rationale: Likas na Filipino para sa pagdaan sa pamamagitan ng sariling mga paa, habang ang literal na anyo ay inilalahad sa talababa.
