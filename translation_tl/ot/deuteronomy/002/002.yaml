lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Ang waw-consecutive at pandiwang אמר ay nagpapatuloy sa salaysay. Likas sa Tagalog ang “At sinabi” at hindi nito dinaragdagan ang antas ng pagkakasunod na ipinahihiwatig ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
- source_word: אֵלַי
  choice: sa akin
  rationale: Tuwirang katumbas ng אֶל na may panlaping unang panauhang isahan.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ipinakikilala nito ang tuwirang pahayag sa susunod na talata. Sa natural na Tagalog, sapat ang tutuldok matapos ang “sinabi” upang katawanin ang tungkuling ito; ang tahasang “na sinasabi” ay kalabisan dito.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na simple at marangal. Ginamit ang karaniwang ayos na “sinabi sa akin ni Yahweh” at ang tutuldok upang natural na ipakilala ang kasunod na tuwirang pahayag.
