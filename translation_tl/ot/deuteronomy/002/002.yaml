  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, may dagdag na salitang nangangahulugang “na nagsasabi” pagkatapos ng “sinabi.” Ipinakikilala nito ang pahayag sa susunod na talata; sa natural na Tagalog, ipinahihiwatig ito ng tutuldok.
