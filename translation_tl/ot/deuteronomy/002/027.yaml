base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: tl
  text: “Hayaan mo akong dumaan sa iyong lupain. Sa mismong daan lamang ako dadaan[a]; hindi ako liliko sa kanan o sa kaliwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa daan, sa daan.” Ang madiing pag-uulit ay nangangahulugang mahigpit silang mananatili sa daan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Hayaan mo akong dumaan
  rationale: Ang Qal cohortative na unang panauhang isahan ay nagpapahayag rito ng magalang na kahilingan sa kontekstong diplomatiko, hindi lamang ng payak na panghinaharap.
- source_word: בְאַרְצֶךָ
  choice: sa iyong lupain
  rationale: Kasunod ng pandiwang עבר, ang בְּ ay nagpapahiwatig ng pagdaan sa loob o sakop ng teritoryo; natural sa Tagalog ang “dumaan sa iyong lupain.”
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: Sa mismong daan lamang
  rationale: Ang pag-uulit ay madiin at nangangahulugang mahigpit na mananatili sa itinakdang daan. Inililipat ng “mismong…lamang” ang diin nang natural sa modernong Tagalog.
- source_word: אֵלֵךְ
  choice: ako dadaan
  rationale: Bagaman karaniwang nangangahulugang “pupunta” ang הלך, sa konteksto ng paglalakbay sa isang daan, natural na ipinapahayag ng “dadaan” ang pagpapatuloy sa rutang iyon. Inuulit din nito ang ideya ng unang pandiwa nang hindi nagiging alanganin.
- source_word: לֹא אָסוּר
  choice: hindi ako liliko
  rationale: Ang סור ay paglihis o pagliko mula sa daan. Ang “liliko” ay malinaw, likas, at angkop sa kasunod na mga direksiyon.
- source_word: יָמִין וּשְׂמֹאול
  choice: sa kanan o sa kaliwa
  rationale: Pinananatili nito ang buong nakapirming larawang Hebreo ng hindi paglihis sa alinmang panig.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na magalang at marangal. Ginamit ang isahang “mo/iyong” dahil isang hari ang kinakausap, at pinanatili ang tuwirang pakiusap at ang diin ng inuulit na pariralang Hebreo.
