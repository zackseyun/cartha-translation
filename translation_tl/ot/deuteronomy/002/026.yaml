  text: וָ/אֶשְׁלַ֤ח מַלְאָכִים֙ מִ/מִּדְבַּ֣ר קְדֵמ֔וֹת אֶל סִיח֖וֹן מֶ֣לֶךְ חֶשְׁבּ֑וֹן דִּבְרֵ֥י שָׁל֖וֹם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: tl
  text: 'Kaya nagsugo ako mula sa ilang ng Kedemot ng mga mensahero kay Sihon na hari ng Hesbon, na may dalang mga salita ng kapayapaan[a], na ganito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alok na pangkapayapaan.” Sa Hebreo, literal itong “mga salita ng kapayapaan,” isang idyoma para sa mapayapang diplomatikong paglapit o panukala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Kaya ... ay nagsugo ako
  rationale: Ang waw-consecutive na may unang panauhang isahan ay nagpapatuloy sa salaysay at nagpapahiwatig ng kasunod na kilos; natural itong naipapahayag ng “Kaya ... ay nagsugo ako.”
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa kontekstong diplomatiko, tumutukoy ito sa mga taong isinugo bilang kinatawan, hindi sa mga anghel.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: mula sa ilang ng Kedemot
  rationale: Ang מִדְבָּר ay lupaing ilang o disyerto; ang “ilang ng Kedemot” ay natural sa Filipino at pinananatili ang ugnayang konstruktong Hebreo.
- source_word: אֶל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: kay Sihon na hari ng Hesbon
  rationale: Ang אֶל ay tumutukoy sa tatanggap ng sugo; malinaw at natural ang “kay,” at tuwirang isinasalin ang titulong maharlika.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: dala ang mga salita ng kapayapaan
  rationale: Pinananatili nito ang literal na larawang “mga salita ng kapayapaan,” habang nililinaw sa natural na Filipino na ito ang mensaheng dala ng mga sugo.
- source_word: לֵאמֹר
  choice: Sinabi ko,
  rationale: Karaniwang panandang Hebreo ito na nagpapakilala sa kasunod na pahayag. Dahil si Moises ang nagsugo at ang susunod ay nilalaman ng mensahe niya, natural sa Filipino ang “Sinabi ko,” bagaman mas literal ang “na nagsasabi.”
theological_decisions: []
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “ilang” para sa biblikal na lupaing tigang at ang karaniwang anyong Tagalog ng mga pangalang Kedemot, Sihon, at Hesbon. Iningatan ang idyomang Hebreo sa pangunahing teksto at ipinaliwanag ang diplomatikong kahulugan sa talababa.
