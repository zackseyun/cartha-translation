    issue: Hindi malinaw ang saklaw ng “Tanging.”
    rationale: Ang Hebreong רַק ay nagtatangi sa kapwa “ang mga alagang hayop” at “ang samsam mula sa mga lungsod.” Sa draft, maaaring basahin na ang “Tanging” ay para lamang sa unang parirala, at ang “pati” ay dagdag na hiwalay na sugnay.
  - severity: low
    issue: Di-gaanong likas ang “mga samsam” sa pag-uulit nito.
    rationale: Maaaring gamitin ang “samsam” bilang kolektibong pangngalan para sa war booty. Iniiwasan nito ang hindi kinakailangang pag-uulit at mas maayos ang daloy.
  revised_text: Tanging ang mga alagang hayop at ang samsam mula sa mga lungsod na nabihag namin ang sinamsam namin para sa aming sarili.[a]
