  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: tl
  text: Tanging ang mga alagang hayop at ang samsam mula sa mga lungsod na nabihag namin ang sinamsam namin para sa aming sarili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ang samsam sa mga lungsod na kinuha namin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Tanging
  rationale: Ipinapakita nito ang pagtatangi sa mga bagay na pinanatili, kasunod ng ganap na paglipol sa mga tao sa naunang talata.
- source_word: הַבְּהֵמָה
  choice: ang mga alagang hayop
  rationale: Tumutukoy ito sa mga domestikadong hayop na kinuha bilang samsam, hindi sa lahat ng uri ng hayop.
- source_word: בָּזַזְנוּ לָנוּ
  choice: sinamsam namin para sa aming sarili
  rationale: Pinananatili ng “sinamsam” ang diwang pandigma ng pandiwang בזז, at malinaw na ipinahahayag ng “para sa aming sarili” ang benepaktibong לָנוּ.
- source_word: וּשְׁלַל
  choice: pati ang mga samsam
  rationale: Ang שָׁלָל ay mga ari-ariang nakuha sa digmaan; natural sa Filipino ang “mga samsam,” at maayos na iniuugnay ng “pati” ang ikalawang bagay na pinanatili.
- source_word: הֶעָרִים
  choice: mula sa mga lungsod
  rationale: Ang עִיר ay lungsod o bayan; ang “mga lungsod” ay angkop sa salaysay ng pananakop. Idinagdag ang “mula sa” upang natural na maipahayag sa Filipino na ang samsam ay galing sa mga lungsod.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: na nabihag namin
  rationale: Sa kontekstong militar, ang לכד ay nangangahulugang bihagin o sakupin. Ang “nabihag” ay tumpak at likas na ginagamit kaugnay ng mga lungsod.
