  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: tl
  text: Bukod dito, ang kamay ni Yahweh ay laban sa kanila upang guluhin sila[a] mula sa gitna ng kampo hanggang sa maubos sila[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lituhin sila,” “pasindakin sila,” o “pangalatin sila”; maaaring tumukoy ang pandiwang Hebreo sa pagdudulot ng sindak o kalituhan bilang hatol ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hanggang sa tuluyan silang mawala” o “hanggang sa malipol sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Bukod dito
  rationale: Ipinahahayag ang pandagdag at bahagyang mapagdiing ugnayan sa naunang pahayag sa natural na modernong Tagalog.
- source_word: יַד יְהוָה
  choice: ang kamay ni Yahweh
  rationale: Pinananatili ang kongkretong Hebreong idyoma para sa kapangyarihan at pagkilos ng Diyos, pati ang pangalang tipan na Yahweh.
- source_word: בָם
  choice: laban sa kanila
  rationale: Sa pariralang tungkol sa kamay ni Yahweh, ipinahihiwatig ng pang-ukol ang mapanghatol at salungat na pagkilos na nakatuon sa kanila.
- source_word: לְהֻמָּם
  choice: upang guluhin sila
  rationale: Ang pandiwang המם ay tumutukoy sa pagdudulot ng sindak, kalituhan, o pagkawatak-watak; hindi ito agad ipinapakahulugang pagpatay, na siyang kinalabasan sa hulihan ng talata.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: mula sa gitna ng kampo
  rationale: Pinananatili ang kongkretong larawan ng pag-aalis sa kanila mula sa loob ng kampo.
- source_word: עַד תֻּמָּם
  choice: hanggang sa maubos sila
  rationale: Likas sa Tagalog at nagpapahayag ng lubos na pagkaubos o pagkalipol ng pangkat nang hindi pinipili nang labis ang mekanismo ng kanilang kamatayan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kalikasan ng pagkilos ng Diyos sa לְהֻמָּם
  choice: guluhin sila
  alternative: lipulin sila
  rationale: Pinananatili ang leksikal na diin sa pagdudulot ng kalituhan o pagkataranta bilang hatol ng Diyos, habang ang ganap na pagkaubos ay inilalahad sa kasunod na parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyomang “kamay ni Yahweh” at ang konkretong “gitna ng kampo,” habang gumamit ng karaniwang salitang “guluhin” at “maubos” upang madaling maunawaan.
