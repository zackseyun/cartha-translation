base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: tl
  text: Bibili kayo sa kanila ng pagkain gamit ang pilak, at kakain kayo; at bibili rin kayo sa kanila ng tubig gamit ang pilak, at iinom kayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹכֶל
  choice: pagkain
  rationale: Pangkalahatang salita ito para sa anumang makakain o panustos, at hindi lamang para sa butil.
- source_word: תִּשְׁבְּרוּ
  choice: bibili kayo
  rationale: Sa kontekstong ito, ang שׁבר ay tumutukoy sa pagbili ng pagkain. Likas sa makabagong Tagalog ang hinaharap na anyo bilang mariing tagubilin.
- source_word: מֵאִתָּם
  choice: sa kanila
  rationale: Ipinahihiwatig nito na sa mga taga-Edom kukunin sa pamamagitan ng pagbili ang mga panustos, sa halip na agawin ang mga iyon.
- source_word: בַּכֶּסֶף
  choice: na babayaran ninyo ng pilak
  rationale: Pinananatili ng “pilak” ang kongkretong katawagan sa Hebreo, samantalang nililinaw ng “babayaran” ang gamit nito bilang kabayaran.
- source_word: וַאֲכַלְתֶּם
  choice: upang makakain kayo
  rationale: Sa seryeng ito ng mga tagubilin, likas na ipinahahayag nito ang nilalayong bunga ng pagbili, bagaman maaari rin itong isalin nang mas pormal bilang “at kakain kayo.”
- source_word: וְגַם
  choice: at ... rin
  rationale: Pinananatili nito ang pandagdag na diin sa ikalawang magkatulad na tagubilin tungkol sa tubig.
- source_word: מַיִם
  choice: tubig
  rationale: Tuwirang katumbas ito ng salitang Hebreo.
- source_word: תִּכְרוּ
  choice: bibili kayo
  rationale: Bagaman maaaring mangahulugang “humukay” ang כרה sa ibang konteksto, malinaw na pagbili ang kahulugan dito dahil sa paralelismo sa pagkain at sa pagbanggit ng pilak bilang bayad.
- source_word: וּשְׁתִיתֶם
  choice: upang makainom kayo
  rationale: Tulad ng kaugnay na parirala tungkol sa pagkain, ipinahahayag nito nang natural ang nilalayong bunga ng pagbili.
theological_decisions:
- issue: Etikal at legal na puwersa ng utos tungkol sa mga panustos ng Edom
  choice: Inuutusan ang Israel na bayaran ang pagkain at tubig sa halip na kunin ang mga iyon nang walang kabayaran.
  alternative: 'Maaaring isalin nang mas mahigpit sa anyong koordinado: “at kakain kayo ... at iinom kayo.”'
  rationale: Malinaw sa Hebreo at sa konteksto na dapat kunin ang mga panustos sa lehitimong pagbili. Ang “upang” ay likas na nagpapahayag ng nilalayong bunga nang hindi nagdaragdag ng bagong teolohikal na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bibili kayo” bilang natural na anyo ng mariing tagubilin at “pilak” upang mapanatili ang kongkretong larawan ng Hebreo; idinagdag ang “na babayaran ninyo” upang hindi maging alanganin sa Tagalog ang gamit ng pilak bilang kabayaran.
