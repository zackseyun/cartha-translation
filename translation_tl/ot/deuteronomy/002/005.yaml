revisions:
- from: Huwag ninyo silang hamunin sa labanan, sapagkat hindi ko ibibigay sa inyo ang anumang bahagi ng kanilang lupain, kahit kasinlaki lamang ng matatapakan ng talampakan[a], dahil ibinigay ko kay Esau ang kabundukan ng Seir[b] bilang pag-aari[c].
  to: Huwag ninyo silang kalabanin, sapagkat hindi ko ibibigay sa inyo ang anumang bahagi ng kanilang lupain, kahit ni isang lugar na matatapakan ng talampakan[a], dahil ibinigay ko kay Esau ang kabundukan ng Seir[b] bilang pag-aari[c].
  rationale: Inalis ang sobrang pagtitiyak na “sa labanan” upang hindi higitan ang saklaw ng pandiwang Hebreo, at inayos ang idyoma tungkol sa talampakan upang maging malinaw at likas sa Filipino habang pinananatili ang diin na walang kahit pinakamunting bahagi ng lupain ang ibibigay. Iningatan ang lahat ng angkla ng talababa at ang mga leksikal na alternatibo.
