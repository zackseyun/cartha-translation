  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: tl
  text: Huwag ninyo silang kalabanin, sapagkat hindi ko ibibigay sa inyo ang anumang bahagi ng kanilang lupain, kahit ni isang lugar na matatapakan ng talampakan[a], dahil ibinigay ko kay Esau ang kabundukan ng Seir[b] bilang pag-aari[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “hanggang sa tuntungan ng talampakan ng paa”; ibig sabihin, kahit napakaliit na bahagi ng lupa.'
    reason: lexical_alternative
  - marker: b
    text: Ang “kabundukan ng Seir” ay maaari ring isaling “Bundok Seir” o “maburol na lupain ng Seir.”
    reason: cultural_note
  - marker: c
    text: Ang “pag-aari” ay maaari ring isaling “mana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: Huwag ninyo silang hamunin sa labanan
  rationale: Ang hitpael ng גרה na may ב ay tumutukoy sa pagpukaw o pagsisimula ng alitang may pagkapoot. Nililinaw ng “sa labanan” ang konteksto nang hindi ipinapalagay na nagsimula na ang digmaan.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: hindi ko ibibigay sa inyo ang anumang bahagi ng kanilang lupain
  rationale: 'Ipinahahayag ng מן ang partitive na diwa: wala ni anumang bahagi ng lupain nila ang ibibigay sa Israel.'
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: kahit kasinlaki lamang ng matatapakan ng talampakan
  rationale: Pinananatili nito ang kongkretong larawan ng talampakan habang likas na ipinahahayag sa Filipino ang napakaliit na sukat ng lupa.
- source_word: יְרֻשָּׁה
  choice: bilang pag-aari
  rationale: Maaaring mangahulugan ang salita ng pag-aari o mana. Sa konteksto, binibigyang-diin ang lupaing ipinagkaloob ng Diyos; pinananatili sa talababa ang “mana” bilang tunay na alternatibo.
- source_word: לְעֵשָׂו
  choice: kay Esau
  rationale: Ang לְ ay nagmamarka kay Esau bilang tumanggap ng ipinagkaloob na lupain.
- source_word: הַר שֵׂעִיר
  choice: ang kabundukan ng Seir
  rationale: Sa kontekstong heograpiko, ang הַר ay maaaring tumukoy sa bulubundukin o mataas na rehiyon, hindi lamang sa isang bundok. Likas at tumpak dito ang “kabundukan.”
theological_decisions:
- issue: Ang pagkakaloob ng Diyos ng lupain ng Edom
  choice: Iniuugnay ang pagbabawal na makipaglaban sa Edom sa naunang pagkakaloob ng Diyos sa kabundukan ng Seir kay Esau.
  alternative: Unawain ito bilang isang pagbabawal na pampolitika lamang, nang hindi binibigyang-diin ang banal na pagkakaloob.
  rationale: 'Ang dalawang sugnay na כִּי ay tahasang nagbibigay ng dahilan: walang lupaing ibibigay sa Israel mula roon sapagkat ipinagkaloob na ng Diyos ang Seir kay Esau.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hamunin sa labanan” upang mapanatili ang diwa ng pagsisimula ng mapanlabang alitan; iniwasan ang mas malabong “galitin.” Ang mga larawan at posibleng kahulugan sa Hebreo ay pinanatili sa teksto at mga talababa.
