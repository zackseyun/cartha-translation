  terminology: Ang “kabundukan ng Seir,” “Esau,” at “pag-aari” ay angkop sa modernong Filipino Tagalog. Ang talababa sa “pag-aari” ay wastong nagtatala ng “mana” bilang leksikal na alternatibo.
