  text: And when all the men of war had finished dying from among the people,[a]
translation:
  language: tl
  text: At nang mamatay na ang lahat ng lalaking mandirigma[a] mula sa gitna ng bayan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaking nakikipagdigma.” Sa Hebreo, literal na “mga lalaki ng digmaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: At nang
  rationale: Pinagsama sa isang likas na panandang pasalaysay at temporal ang waw-consecutive ng היה at כַאֲשֶׁר. Ang “At nang” ay angkop sa sugnay na nagpapatuloy sa susunod na talata.
- source_word: תַּמּוּ ... לָמוּת
  choice: mamatay na
  rationale: Ipinahihiwatig ng “na” na ganap nang natapos ang pagkamatay ng pangkat, nang hindi gumagamit ng di-likas na literal na “natapos nang mamatay.”
- source_word: כָּל
  choice: lahat
  rationale: Tuwirang pinananatili ang saklaw ng Hebreong panukat.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: mga lalaking mandirigma
  rationale: Pinananatili ang tahasang panlalaking pagtukoy at ang tungkuling militar, habang gumagamit ng malinaw at kasalukuyang Filipino.
- source_word: מִקֶּרֶב הָעָם
  choice: mula sa gitna ng bayan
  rationale: Pinananatili ng “mula sa gitna” ang larawan ng pagkawala mula sa loob ng isang pangkat. Ang “bayan” ay tumutukoy rito sa sambayanan ng Israel.
