  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: tl
  text: Sinabi sa akin ni Yahweh, “Huwag mong ligaligin ang Moab[a] at huwag mo silang hamunin sa digmaan, sapagkat hindi ko ibibigay sa iyo ang alinmang bahagi ng lupain nito bilang pag-aari[b], dahil ibinigay ko ang Ar sa mga anak ni Lot bilang pag-aari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag mong gipitin ang Moab.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bilang mana” sa dalawang paglitaw ng “bilang pag-aari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֶל תָּצַר
  choice: Huwag mong ligaligin
  rationale: Ipinahihiwatig ng צרר dito ang mapanlaban na panggigipit o panggugulo na hindi pa tahasang pakikipagdigma. Ang “ligaligin” ay natural, marangal, at hindi nagpapakitid sa kahulugan.
- source_word: מוֹאָב
  choice: Moab
  rationale: Karaniwang transliterasyon ng pangalan ng bayan at lupain.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: at huwag mo silang hamunin sa digmaan
  rationale: Ipinapahayag nito ang pagpukaw o pagsisimula ng pakikipaglaban laban sa kanila; pinananatili ng “hamunin sa digmaan” ang mapanulsol at militar na diwa.
- source_word: מֵאַרְצוֹ
  choice: ang alinmang bahagi ng lupain nito
  rationale: 'Ang מִן ay may bahaging diwa sa konteksto: walang anumang bahagi ng lupain ang ibibigay. Ang panghalip ay tumutukoy sa Moab bilang isang bayan o pambansang entidad.'
- source_word: יְרֻשָּׁה
  choice: bilang pag-aari
  rationale: Tumutukoy ito sa lupaing tinanggap bilang minanang o inilaan na pag-aari. Malinaw sa modernong Filipino ang “pag-aari,” habang ang alternatibong “mana” ay itinatala sa talababa.
- source_word: לִבְנֵי לוֹט
  choice: sa mga anak ni Lot
  rationale: Pinananatili nito ang literal at heneyalohikal na paglalarawan ng Hebreo, bagaman maaaring unawain bilang mga inapo ni Lot.
- source_word: עָר
  choice: Ar
  rationale: Tuwirang transliterasyon ng pangalang pantangi na tumutukoy sa lugar na kaugnay ng Moab.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Saklaw ng יְרֻשָּׁה
  choice: bilang pag-aari
  alternative: bilang mana
  rationale: Pinananatili ng “pag-aari” ang ideya ng teritoryong ipinagkaloob at pagmamay-ari nang hindi lubusang inaalis ang pahiwatig ng minanang bahagi; ang posibleng “mana” ay inilagay sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “ligaligin” para sa mapanlaban na panggigipit at “hamunin sa digmaan” para sa hiwalay ngunit kaugnay na pagbabawal sa pagsisimula ng labanan. Pinanatili ang mga pangalang Yahweh, Moab, Lot, at Ar bilang mga transliterasyon.
