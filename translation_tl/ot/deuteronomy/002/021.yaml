  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: tl
  text: isang bayan—malaki at marami ang bilang, at matatangkad gaya ng mga Anakim.[a] Pinuksa sila ni Yahweh mula sa harap ng mga inapo ni Esau. Inalisan sila ng mga inapo ni Esau ng lupain, at ang mga inapo ni Esau ay nanirahan sa kanilang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Anakita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם גָּדוֹל וְרַב
  choice: isang bayang malaki at marami ang bilang
  rationale: Pinananatili ng “isang bayan” ang isahang pangngalang kolektibo. Ang “malaki” at “marami ang bilang” ay natural na naghihiwalay sa ideya ng laki o kadakilaan at dami ng populasyon.
- source_word: רָם
  choice: matatangkad
  rationale: Sa paghahambing sa mga Anakim, pisikal na tangkad ang malinaw na tinutukoy, hindi matayog na katayuan.
- source_word: כָּעֲנָקִים
  choice: gaya ng mga Anakim
  rationale: Ang כ־ ay naghahayag ng paghahambing, at ang pangalang-bayan ay tinumbasan sa transliterasyong “mga Anakim.”
- source_word: וַיַּשְׁמִידֵם
  choice: pinuksa sila
  rationale: Ipinahahayag ng Hiphil ng שׁמד ang matinding pagwasak o pag-aalis. Malakas ang “pinuksa” ngunit hindi nito kailangang lutasin nang hiwalay ang tanong tungkol sa ganap na pagkalipol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: מִפְּנֵיהֶם
  choice: sa harap ng mga inapo ni Esau
  rationale: Ang Hebreong idyoma ay literal na “mula sa harap nila.” Ginawang malinaw sa natural na Tagalog ang reperente ng panghalip mula sa konteksto ng naunang talata.
- source_word: וַיִּירָשֻׁם
  choice: inalisan sila ng mga ito ng lupain
  rationale: Sa kontekstong ito, ang ירשׁ ay pag-agaw ng pag-aari sa dating mga naninirahan. Ipinahahayag ng salin ang pagkawala ng kanilang lupain nang hindi labis na pinahahaba ang pandiwa.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: nanirahan ang mga ito sa kanilang lugar
  rationale: Malinaw nitong pinananatili ang diwa ng pagpapalit sa dating mga naninirahan.
theological_decisions:
- issue: Pagtumbas sa pangalang banal na יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Lawak ng pagwasak na ipinahahayag ng שׁמד
  choice: pinuksa
  alternative: lubusang nilipol; winasak
  rationale: Pinananatili ang matinding puwersa ng pandiwa nang hindi nagdaragdag ng tahasang salitang “lubusan,” na maaaring magsara sa saklaw na hindi espesipikong nilutas ng anyong Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino; ginawang tahasan ang “mga inapo ni Esau” upang maiwasan ang magulong sunod-sunod na panghalip sa Tagalog, habang pinananatili ang mga kilos at ugnayan ng Hebreo.
