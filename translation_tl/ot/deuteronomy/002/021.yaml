  naturalness: May bahagyang hindi likas na pagtutugma sa “isang bayang ... matatangkad.” Mas malinaw at mas natural ang pagpapakitang ang “matatangkad” ay katangian ng mga kasapi ng bayan. Nilinaw rin ang mga reperente ng panghalip upang hindi malito ang mambabasa.
  terminology: Ang “Yahweh,” “Anakim,” at “pinuksa” ay angkop. Ang “inalisan ... ng lupain” ay maaaring manatili bilang maingat na pagsasalin ng pag-agaw ng pagmamay-ari/dispossession nang hindi nagdaragdag ng paraan ng pagpapaalis.
