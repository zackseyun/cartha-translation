base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: tl
  text: Pagkatapos, bumaling kami at naglakbay patungo sa ilang sa daang papunta sa Dagat na Pula[a], gaya ng sinabi sa akin ni Yahweh. Umikot kami sa palibot ng Bundok Seir nang maraming araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Dagat ng mga Tambo.” Ganito maaaring isalin nang mas literal ang Hebreong pangalang Yam Suph.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: bumaling kami
  rationale: Ipinahahayag ng pandiwang פנה ang pagbabago ng direksiyon. Pinananatili ng “bumaling” ang payak na kahulugan nang hindi ipinapalagay na tahasang bumalik sila sa pinanggalingan.
- source_word: וַנִּסַּע
  choice: naglakbay
  rationale: Sa konteksto ng paglalakbay, ang נסע ay tumutukoy sa pag-alis ng kampo at pagpapatuloy ng paglalakbay. Ang “naglakbay” ay natural at malinaw sa modernong Filipino.
- source_word: הַמִּדְבָּרָה
  choice: patungo sa ilang
  rationale: Ang hulaping lokatibong/direksiyonal na ה ay nagpapahiwatig ng pagkilos patungo sa ilang; malinaw itong naipapakita ng “patungo sa.”
- source_word: דֶּרֶךְ יַם סוּף
  choice: sa daang papunta sa Dagat na Pula
  rationale: Ang דֶּרֶךְ ay daan o ruta, at dito ay nagsasaad ng direksiyon ng paglalakbay. Pinanatili sa pangunahing teksto ang nakaugaliang pangalang “Dagat na Pula,” habang inilagay sa talababa ang mas literal na alternatibo.
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: naming nilibot ang Bundok Seir
  rationale: Ang סבב ay nangangahulugang umikot o dumaan sa palibot. Ang “nilibot” ay maikli, natural, at angkop sa heograpikong paglalakbay.
- source_word: יָמִים רַבִּים
  choice: Maraming araw
  rationale: Tuwirang pinananatili nito ang Hebreong pananalita tungkol sa haba ng panahon, sa halip na gawing mas malayang “matagal na panahon.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa Hebreong teksto. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ilang” bilang karaniwang katawagang biblikal para sa lupaing tiwangwang, at iniwasan ang labis na pagpapakahulugan sa pagbabago ng direksiyon.
