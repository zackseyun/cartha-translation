  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: tl
  text: Ngunit hindi pumayag si Sihon, ang hari ng Hesbon, na tayo’y paraanin sa kanyang lupain, sapagkat pinatigas ni Yahweh na iyong Diyos ang kanyang espiritu at pinatibay ang kanyang puso[a], upang ibigay siya sa iyong kamay, gaya ng nangyayari ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ginawang matigas ang kanyang puso.” Ang pandiwang Hebreo ay maaaring mangahulugang “palakasin” o “patibayin,” ngunit sa kontekstong ito maaari itong tumukoy sa paggawa sa kanya na matigas ang kalooban.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: ayaw
  rationale: Tuwirang ipinahahayag ang kawalan ng pagsang-ayon o kagustuhan ni Sihon sa natural na makabagong Tagalog.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: paraanin tayo sa kanyang lupain
  rationale: Ang Hiphil ay nagpapahiwatig ng pagpapahintulot na makaraan, at ang panghalip sa konteksto ay tumutukoy sa nasasakupan ni Sihon.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: pinatigas ... ang kanyang espiritu
  rationale: Pinananatili ang tahasang causative na diwa ng pandiwa at ang Hebreong antropolohikal na terminong 'espiritu.'
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: pinatibay ang kanyang puso
  rationale: Ang אמץ ay pangunahing may diwang palakasin o patibayin; pinananatili ng salin ang leksikal na ambiguwidad, habang nililinaw sa talababa ang kontekstuwal na posibilidad ng pagmamatigas.
- source_word: לְמַעַן
  choice: upang
  rationale: Maikli at natural na panandang Tagalog para sa layuning ipinahahayag ng Hebreo.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: ibigay siya sa iyong kamay
  rationale: Pinananatili ang Hebreong idyoma ng pagbibigay sa kamay, na tumutukoy sa pagpapasailalim sa kapangyarihan ng isa.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng nangyari sa araw na ito
  rationale: Ipinahahayag ang kasalukuyang hayag na kinalabasan habang pinananatili ang Deuteronomikong pormula.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapatigas ng Diyos at kawalan ng pagpayag ni Sihon
  choice: Panatilihin kapwa ang ayaw ni Sihon at ang tahasang pagkilos ni Yahweh na patigasin ang kanyang espiritu at patibayin ang kanyang puso.
  alternative: Ipakahulugan na si Sihon lamang ang nagpatigas sa sarili, o na pinahintulutan lamang ito ng Diyos.
  rationale: Tahasan sa Hebreo ang pananagutan o pagkukusa ni Sihon at ang causative na pagkilos ni Yahweh; hindi dapat lutasin ng salin ang tensiyong teolohikal.
- issue: Diwa ng וְאִמֵּץ אֶת־לְבָבוֹ
  choice: pinatibay ang kanyang puso
  alternative: ginawang matigas ang kanyang puso
  rationale: Ang pangunahing leksikal na diwa ay pagpapalakas o pagpapatibay, ngunit maaaring magpahiwatig ng pagmamatigas sa konteksto; inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang 'espiritu,' 'puso,' at 'sa iyong kamay' upang mapangalagaan ang mahahalagang larawan at idyoma ng Hebreo; ipinaliwanag ang tunay na leksikal na ambiguwidad sa talababa.
