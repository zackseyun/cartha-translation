revisions:
- from: Ngunit ayaw ni Sihon na hari ng Hesbon na paraanin tayo sa kanyang lupain, sapagkat pinatigas ni Yahweh na iyong Diyos ang kanyang espiritu at pinatibay ang kanyang puso[a], upang ibigay siya sa iyong kamay, gaya ng nangyari sa araw na ito.
  to: Ngunit hindi pumayag si Sihon, ang hari ng Hesbon, na tayo’y paraanin sa kanyang lupain, sapagkat pinatigas ni Yahweh na iyong Diyos ang kanyang espiritu at pinatibay ang kanyang puso[a], upang ibigay siya sa iyong kamay, gaya ng nangyayari ngayon.
  rationale: Inayos ang sintaks upang maging mas likas at malinaw sa modernong Filipino, at pinalitan ang pangwakas na parirala upang maipahayag ang kasalukuyang-kalagayan na diwa ng כַּיּוֹם הַזֶּה. Hindi binago ang kahulugan ng banal na pangalan, ang tuwirang pagkilos ni Yahweh, o ang leksikal na pag-iingat hinggil sa “pinatibay ang kanyang puso.”
