  text: רְפָאִ֛ים יֵחָשְׁב֥וּ אַף הֵ֖ם כָּ/עֲנָקִ֑ים וְ/הַ/מֹּ֣אָבִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם אֵמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: tl
  text: Itinuring din silang mga Refaim[a], tulad ng mga Anakim; ngunit Emim ang tawag sa kanila ng mga Moabita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga higante” para sa “mga Refaim,” bagaman sa Hebreo ay mas malamang na pangalan ito ng isang sinaunang pangkat ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: mga Refaim
  rationale: Isinalin bilang pangalan ng isang sinaunang pangkat ng mga tao, sa halip na bigyang-kahulugang “mga higante.” Nililinaw ng “mga” sa Tagalog na pangkat ang tinutukoy.
- source_word: יֵחָשְׁבוּ
  choice: itinuring
  rationale: 'Pinananatili ang diwang pasibo ng Niphal: sila ay kinilala o ibinilang sa isang partikular na pangkat. Natural at marangal ang “itinuring” sa modernong Tagalog.'
- source_word: אַף הֵם
  choice: din silang
  rationale: 'Ipinahahayag ang pagdaragdag at pagbibigay-diin: kabilang din ang mga taong ito sa nabanggit na pag-uuri.'
- source_word: כָּעֲנָקִים
  choice: tulad ng mga Anakim
  rationale: Pinananatili ang paghahambing na ipinahihiwatig ng כ, at ang Anakim ay inilalahad bilang pangalan ng isang pangkat ng mga tao.
- source_word: וְהַמֹּאָבִים
  choice: ngunit ... ng mga Moabita
  rationale: Ginamit ang “ngunit” upang ipakita ang paglipat mula sa pangkalahatang pag-uuri tungo sa natatanging tawag ng mga Moabita; hindi nito binabago ang diwa ng waw sa konteksto.
- source_word: יִקְרְאוּ לָהֶם
  choice: tinatawag silang
  rationale: Natural na Tagalog para sa idyomang Hebreo na nangangahulugang tumawag o magbigay ng pangalan.
- source_word: אֵמִים
  choice: Emim
  rationale: Isinalin sa baybay na malapit sa pangalang Hebreo bilang tawag ng mga Moabita sa pangkat na ito.
