    reason: lexical_alternative
  revision_rationale: Inayos ang aspekto ng pandiwang tumutukoy sa dating paninirahan upang maipakita ang perpektong Hebreo at ang “formerly.” Pinalitan ang “Zamzumita” ng “Zamzumim” upang mapanatili ang pangalan ng pangkat nang walang dagdag na morpolohikal na pag-aangkop. Pinanatili ang lahat ng kahulugan, ang pag-uugnay na “at,” ang mga ethnonym, at ang dalawang talababa.
