id: DEU.2.20
reference: Deuteronomy 2:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֶֽרֶץ רְפָאִ֥ים תֵּחָשֵׁ֖ב אַף הִ֑וא רְפָאִ֤ים יָֽשְׁבוּ בָ/הּ֙ לְ/פָנִ֔ים וְ/הָֽ/עַמֹּנִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם זַמְזֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: tl
  text: Itinuturing ding lupain ng mga Refaim ang lupaing iyon[a]. Noong unang panahon ay nanirahan dito ang mga Refaim[b], at ang tawag sa kanila ng mga Ammonita ay Zamzumim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang lupain ng mga Refaim.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “Refaim” ay maaaring tumukoy sa isang sinaunang pangkat na ayon sa tradisyon ay kilala sa pambihirang laki; isinasalin ito ng ilan bilang “mga higante.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: lupain ng mga Refaim
  rationale: Pinananatili ang אֶרֶץ bilang “lupain” at ang רְפָאִים bilang pangalan ng isang sinaunang pangkat, sa halip na ipakahulugang “mga higante.”
- source_word: תֵּחָשֵׁב
  choice: itinuturing
  rationale: 'Ipinahahayag nito ang pasibong diwa ng Niphal ng חשׁב: kinikilala o ibinibilang bilang gayon.'
- source_word: אַף הִוא
  choice: Ang lupaing iyon ay ... ding
  rationale: Likas na itinuturo nito sa Filipino ang naunang binanggit na lupain at ipinakikitang kabilang din iyon sa parehong pag-uuri.
- source_word: רְפָאִים
  choice: mga Refaim
  rationale: Ginawang transliteradong pangalang-etniko upang mapanatili ang tiyak ngunit may tensiyong kahulugan ng terminong Hebreo.
- source_word: יָשְׁבוּ בָהּ
  choice: naninirahan doon
  rationale: Natural na modernong Filipino para sa pamumuhay o paninirahan sa isang lupain.
- source_word: לְפָנִים
  choice: Noong unang panahon
  rationale: Malinaw at karaniwang pananalita para sa isang naunang kapanahunan.
- source_word: וְהָעַמֹּנִים
  choice: at ... ng mga Ammonita
  rationale: Pinanatili ang payak na ugnayang “at” ng ו; hindi kailangang dagdagan ng tahasang pagsalungat.
- source_word: יִקְרְאוּ לָהֶם
  choice: tinatawag sila
  rationale: Ang aspektong di-ganap ay angkop sa nakaugaliang katawagan; natural itong ipahayag sa Filipino bilang “tinatawag.”
- source_word: זַמְזֻמִּים
  choice: mga Zamzumita
  rationale: Isina-Filipino ang pangalang-etniko sa karaniwang hulaping -ita, katulad ng “Ammonita,” nang hindi isinasalin ang pangalan.
theological_decisions:
- issue: Pagkakakilanlan at katangian ng mga Refaim
  choice: Pinanatili ang “mga Refaim” bilang pangalang-etniko.
  alternative: mga higante
  rationale: Maaaring kaugnay sa tradisyon ang pambihirang laki ng mga Refaim, ngunit hindi tahasang sinasabi ng talatang ito na “mga higante” sila. Iniiwasan ng transliterasyon ang paglutas sa tunay na leksikal at tradisyunal na kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lupain” para sa teritoryo, “naninirahan” para sa natural na salin ng ישׁב, at mga anyong “Ammonita” at “Zamzumita” bilang karaniwang pagsasa-Filipino ng mga pangalang-etniko. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
