- from: Ang lupaing iyon ay itinuturing ding lupain ng mga Refaim[a]. Noong unang panahon, naninirahan doon ang mga Refaim[b], at tinatawag sila ng mga Ammonita na mga Zamzumita.
  to: Itinuturing ding lupain ng mga Refaim ang lupaing iyon[a]. Noong unang panahon ay nanirahan dito ang mga Refaim[b], at ang tawag sa kanila ng mga Ammonita ay Zamzumim.
  rationale: Inayos ang aspekto ng pandiwang tumutukoy sa dating paninirahan upang maipakita ang perpektong Hebreo at ang “formerly.” Pinalitan ang “Zamzumita” ng “Zamzumim” upang mapanatili ang pangalan ng pangkat nang walang dagdag na morpolohikal na pag-aangkop. Pinanatili ang lahat ng kahulugan, ang pag-uugnay na “at,” ang mga ethnonym, at ang dalawang talababa.
