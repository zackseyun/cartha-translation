  source_fidelity: 'Tumpak ang pangunahing diwa: ang mga Avvim ay nanirahan sa mga pamayanan hanggang Gaza; nilipol sila ng mga Caphtorim mula sa Caphtor. Gayunman, ang "nanirahan ang mga ito bilang kapalit nila" ay hindi gaanong tuwirang naihahayag ang lokatibong idiomang וַיֵּשְׁבוּ תַחְתָּם, na nangangahulugang nanirahan ang Caphtorim sa dating lugar ng mga Avvim.'
  naturalness: Makabago at malinaw ang karamihan ng salin. Mas natural at mas tiyak sa Filipino ang "nanirahan sa kanilang lugar" kaysa "nanirahan ... bilang kapalit nila."
  terminology: Ang transliterasyong Avvim, Caphtorim, at Caphtor ay angkop. Ang "mga pamayanan" ay isang maingat na malawak na salin ng חֲצֵרִים. Ang "nilipol" ay sapat na malakas para sa הִשְׁמִידֻם.
