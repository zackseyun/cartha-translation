base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: tl
  text: Tungkol naman sa mga Avvim[a] na naninirahan sa mga pamayanan hanggang sa Gaza, nilipol sila ng mga Caphtorim na nagmula sa Caphtor at nanirahan sa kanilang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Avvita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַוִּים
  choice: mga Avvim
  rationale: Pangalan ng isang pangkat ng mga tao; tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin ang pangalan.
- source_word: הַיֹּשְׁבִים
  choice: na naninirahan
  rationale: Ang ישב ay tumutukoy sa paninirahan; natural at kasalukuyang Filipino ang “naninirahan.”
- source_word: בַּחֲצֵרִים
  choice: sa mga pamayanan
  rationale: Maaaring tumukoy ang חֲצֵרִים sa mga nayon, munting pamayanan, o mga tirahang maaaring may bakod ngunit walang pader; pinananatili ng “mga pamayanan” ang lawak ng kahulugan nang hindi labis na tinutukoy ang anyo nito.
- source_word: עַד עַזָּה
  choice: hanggang sa Gaza
  rationale: Likas na salin ng heograpikong hangganang ipinahihiwatig ng עַד.
- source_word: כַּפְתֹּרִים
  choice: mga Caphtorim
  rationale: Pangalan ng pangkat ng mga tao, kaya transliterado.
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: na nagmula sa Caphtor
  rationale: Malinaw at natural na ipinahahayag ang pinanggalingan; bagaman literal na may diwa ng paglabas ang participle ng יצא, sapat na pinananatili rito ang mahalagang heograpikong ugnayan.
- source_word: הִשְׁמִידֻם
  choice: nilipol sila
  rationale: Ang Hiphil ng שׁמד ay malakas na pandiwa para sa pagwasak o pagpuksa; mas angkop ang “nilipol” kaysa sa mas mahinang “winasak” kapag mga tao ang layon.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: at nanirahan ang mga ito bilang kapalit nila
  rationale: Ipinahahayag ng תַחְתָּם ang paghalili o pag-okupa sa dating lugar ng mga naunang nanirahan; nililinaw rin ng “ang mga ito” na ang Caphtorim ang simuno.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “mga pamayanan” upang mapanatili ang saklaw ng חֲצֵרִים, at ang mga pangalan ng pangkat ay transliterado.
