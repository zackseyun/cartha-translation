  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: tl
  text: 'At utusan mo ang bayan: “Malapit na kayong dumaan[a] sa nasasakupan[b] ng inyong mga kapatid, ang mga anak ni Esau, na naninirahan sa Seir. Matatakot sila sa inyo, kaya mag-ingat kayong mabuti.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dumaraan kayo” o “dadaan kayo.” Maaaring ipahayag ng participle sa Hebreo ang isang kilos na malapit nang mangyari.
    reason: lexical_alternative
  - marker: b
    text: O, “hangganan.” Maaaring tumukoy ang salitang Hebreo sa mismong guhit ng hangganan o sa lupaing saklaw nito.
    reason: lexical_alternative
  - marker: c
    text: O, “kaya bantayan ninyong mabuti ang inyong sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: utusan
  rationale: Malakas at may awtoridad na pautos ang pandiwa; pinananatili ng “utusan” ang tindi nito sa natural na Tagalog.
- source_word: הָעָם
  choice: ang bayan
  rationale: Tumutukoy ito sa Israel bilang isang kolektibong sambayanan; ang “bayan” ay likas at marangal sa kontekstong ito.
- source_word: אַתֶּם עֹבְרִים
  choice: malapit na kayong dumaan
  rationale: Ang participle kasama ng hayag na panghalip ay tumutukoy rito sa nalalapit na pagkilos, hindi lamang sa kasalukuyang pagdaan.
- source_word: בִּגְבוּל
  choice: sa nasasakupan
  rationale: Maaaring mangahulugan ang גְּבוּל ng hangganan o ng lupaing saklaw nito. Sa konteksto ng paglalakbay, ang nasasakupang lupain ang pangunahing diwa.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: inyong mga kapatid, ang mga anak ni Esau
  rationale: Tuwirang pinananatili ang wikang pampagkamag-anak at ang hayag na pormulang pangangkan.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: na naninirahan sa Seir
  rationale: Ipinahihiwatig ng participle ang palagiang paninirahan; malinaw at kasalukuyang Tagalog ang “naninirahan.”
- source_word: וְיִירְאוּ מִכֶּם
  choice: Matatakot sila sa inyo
  rationale: Likas na ipinapahayag sa Tagalog ang takot na may kaugnayan sa Israel, habang pinananatili ang prediktibong diwa.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: kaya mag-ingat kayong mabuti
  rationale: 'Reflexive ang puwersa ng Niphal ng שׁמר: bantayan ang sarili o mag-ingat. Ang “mabuti” ay natural na nagbibigay-diin sa מְאֹד.'
theological_decisions:
- issue: Wikang pampagkamag-anak para sa Edom
  choice: inyong mga kapatid, ang mga anak ni Esau
  alternative: inyong mga kamag-anak, ang mga inapo ni Esau
  rationale: Ibinabatay ng talata ang pakikitungo ng Israel sa Edom sa kanilang ugnayang pangangkan. Pinananatili ng “mga kapatid” at “mga anak” ang hayag na genealogical na pananalita nang hindi ito pinapalabo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa Israel bilang kolektibong sambayanan, “nasasakupan” para sa heograpikong saklaw, at pinanatili ang tuwirang wikang pampagkamag-anak na “mga kapatid” at “mga anak.”
