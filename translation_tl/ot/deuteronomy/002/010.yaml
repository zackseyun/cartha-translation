id: DEU.2.10
reference: Deuteronomy 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הָ/אֵמִ֥ים לְ/פָנִ֖ים יָ֣שְׁבוּ בָ֑/הּ עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: tl
  text: Ang mga Emim ay dating nanirahan doon—isang bayang malaki, marami, at matatangkad tulad ng mga Anakim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵמִים
  choice: mga Emim
  rationale: Isinalin bilang transliteradong pangalan ng pangkat-etniko. Ang panandang “mga” ay likas sa Tagalog para sa isang pangkat na tinutukoy sa maramihang diwa.
- source_word: לְפָנִים
  choice: dating
  rationale: Temporal ang idyoma rito, kaya ang “dating” ay maikli, malinaw, at natural; hindi ito spatial na “sa harap.”
- source_word: יָשְׁבוּ בָהּ
  choice: nanirahan doon
  rationale: Ang ישׁב na may ב ay tumutukoy sa paninirahan. Ang “doon” ay natural na tumutukoy sa naunang lupain o pook na pambabae ang reperensiya sa Hebreo.
- source_word: עַם
  choice: isang bayan
  rationale: Tumutukoy ito sa isang pangkat ng mga tao o etnikong sambayanan, hindi lamang sa dami ng mga indibidwal. Sa kontekstong ito, malinaw ang “isang bayan” bilang kolektibong katawagan.
- source_word: גָּדוֹל
  choice: malaki
  rationale: Pinananatili ang payak na diwa ng laki at pagiging kahanga-hanga o makapangyarihan ng pangkat.
- source_word: וְרַב
  choice: marami
  rationale: Tumutukoy sa malaking bilang ng mga kabilang sa bayan; natural itong kasama sa sunod-sunod na paglalarawan.
- source_word: וָרָם
  choice: matatangkad
  rationale: Sa paghahambing sa mga Anakim, pisikal na tangkad ang tinutukoy. Ginamit ang maramihang anyo upang umayon sa mga taong bumubuo sa bayan.
- source_word: כָּעֲנָקִים
  choice: tulad ng mga Anakim
  rationale: Ipinahahayag ng כ ang paghahambing. Pinanatili ang transliteradong pangalan ng pangkat-etniko at ang natural na Tagalog na “tulad ng.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nanirahan” sa halip na mas lumang “tumahan,” at pinanatiling transliterado ang mga pangalang Emim at Anakim. Walang talababa dahil ang temporal na diwa ng לְפָנִים ay sapat na naipahahayag ng “dating”; ang alternatibong “noong unang panahon” ay hindi nagdaragdag ng mahalagang pagkakaiba sa kahulugan.
