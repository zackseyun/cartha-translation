  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: tl
  text: Tatawid ka ngayong araw sa hangganan ng Moab, sa Ar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa hangganan ng Moab, ang Ar.” Inuulit sa Hebreo ang panandang layon bago ang “Ar,” kaya maaaring aposisyonal nitong tinutukoy ang hangganang lupain o lunsod ng Moab.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: Dadaan
  rationale: Ang Qal participle na may tahasang panghalip na אַתָּה ay nagpapahayag ng napipintong pagtawid sa konteksto. Mas natural sa Filipino ang aspektong kontemplatibo na “dadaan” kaysa literal na progresibong anyo.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Karaniwang temporal na gamit na nangangahulugang “ngayong araw” o “sa araw na ito.” Sapat at natural dito ang “ngayon.”
- source_word: גְּבוּל
  choice: hangganan
  rationale: Tumutukoy sa hangganan ng nasasakupan ng Moab; malinaw at karaniwang salin ang “hangganan.”
- source_word: מוֹאָב
  choice: Moab
  rationale: Pinanatili ang kinikilalang anyo ng pangalan ng lugar at bayan.
- source_word: עָר
  choice: Ar
  rationale: Pangalan ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon.
- source_word: אֶת ... אֶת
  choice: sa hangganan ng Moab, sa Ar
  rationale: Ang pag-uulit ng panandang layon bago ang “Ar” ay maaaring magpahiwatig ng aposisyon. Pinananatili ng “sa Ar” ang ugnayang heograpiko nang hindi lubusang nilulutas ang bahagyang malabong sintaks; ipinaliliwanag sa talababa ang aposisyonal na posibilidad.
- source_word: אַתָּה
  choice: ka
  rationale: Ikalawang panauhang panlalaking isahan, na tumutukoy sa Israel bilang isang kabuuan. Likas na napapanatili ng “ka” ang isahang anyo.
theological_decisions:
- issue: Isahang pagtukoy sa Israel
  choice: Panatilihin ang isahang “ka” nang walang paliwanag sa pangunahing teksto
  alternative: “Kayo” o “Ikaw, Israel”
  rationale: Kinakausap ng Hebreo ang Israel bilang isang kolektibong kabuuan gamit ang isahang panghalip. Pinananatili ng “ka” ang retorika ng pinagmulan nang hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dadaan” bilang natural na pagpapahayag ng napipintong kilos sa konteksto, at pinanatili ang isahang pakikipag-usap sa Israel.
