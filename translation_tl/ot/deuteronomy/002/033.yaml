base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: tl
  text: At ibinigay siya sa atin[a] ni Yahweh na ating Diyos, at pinabagsak natin siya, pati ang mga anak niya[b] at ang buong bayan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa harap natin”; sa kontekstong ito, nangangahulugan itong ibinigay siya ni Yahweh sa kapangyarihan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: “Mga anak niya” ayon sa tradisyonal na pagbasa; “anak niya” ang mababasa sa tekstong katinig ng Hebreo, na maaari ring unawain nang kolektibo sa kontekstong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: ibinigay siya sa atin
  rationale: Sa konteksto ng digmaan, ang נתן kasama ng לְפָנֵינוּ ay nangangahulugang ibinigay ang kaaway sa kapangyarihan ng Israel. Likas sa Filipino ang “ibinigay siya sa atin,” habang ipinapaliwanag sa talababa ang literal na idyoma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Tuwirang ipinahahayag ng hulaping unang panauhang maramihan ang “ating Diyos.”
- source_word: וַנַּךְ אֹתוֹ
  choice: pinabagsak natin siya
  rationale: Ipinahihiwatig ng נכה sa salaysay ng digmaan ang mapagpasyang pagdaig o pagpabagsak, hindi lamang ang simpleng paghampas.
- source_word: בנו
  choice: mga anak niya
  rationale: Bagaman maaaring basahing isahan ang tekstong katinig, tradisyonal at kontekstuwal na inuunawa rito ang kolektibo o maramihang diwa; pinananatili sa talababa ang tunay na tekstuwal na tensiyon.
- source_word: כָּל עַמּוֹ
  choice: ang buo niyang bayan
  rationale: Ang עַם ay karaniwang tumutukoy sa bayan o mga taong sakop ng isang pinuno; “buo niyang bayan” ang tuwiran at natural na salin sa kontekstong ito.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Isahan o maramihan sa בנו
  choice: mga anak niya
  alternative: anak niya
  rationale: Ang tekstong katinig ay maaaring basahing “anak niya,” ngunit sinusuportahan ng tradisyonal na pagbasa at ng konteksto ang maramihang “mga anak niya.” Hindi itinatago ang alternatibo at inilalahad ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinabagsak” upang mapanatili ang lakas ng salaysay-pandigma nang hindi tahasang dinaragdagan ang teksto ng “pinatay.” Inilagay ang marker [b] kaagad sa pariralang “mga anak niya” sapagkat iyon ang tinutukoy ng talababa.
