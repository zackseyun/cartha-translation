  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
translation:
  language: tl
  text: Sapat na ang pag-ikot ninyo sa kabundukang ito[a]; lumiko kayo pahilaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bundok na ito.” Ang salitang Hebreo na הַר ay maaaring tumukoy sa isang bundok o sa isang bulubunduking rehiyon; mas pinapaboran dito ng konteksto ng paglalakbay ang “kabundukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם סֹב
  choice: Matagal na kayong umiikot
  rationale: Ipinahahayag ng idyomang רַב לָכֶם na sapat na o labis na ang tagal ng pagkilos. Ang “Matagal na kayong umiikot” ay natural sa Filipino at malinaw na nagpapahiwatig na panahon nang tumigil sa pag-ikot.
- source_word: הָהָר הַזֶּה
  choice: sa kabundukang ito
  rationale: Maaaring tumukoy ang הַר sa isang bundok o sa bulubunduking rehiyon. Sa konteksto ng paglalakbay, mas angkop ang “kabundukan,” habang pinananatili sa talababa ang literal na alternatibo.
- source_word: פְּנוּ
  choice: lumiko kayo
  rationale: Ang pautos na anyo ng פנה ay tumutukoy rito sa pagbabago ng direksiyon sa paglalakbay. Direktang ipinahahayag ito ng “lumiko kayo.”
- source_word: צָפֹנָה
  choice: pahilaga
  rationale: Ang hulaping direksiyonal ay nagsasaad ng pagkilos patungo sa hilaga; maikli at likas itong naipapahayag ng “pahilaga.”
- source_word: לָכֶם
  choice: kayo
  rationale: Ang datibong panghalip kasunod ng pautos ay hindi kailangang isalin nang hiwalay sa Filipino; likas nang naipapaloob ang pagtukoy sa mga kausap sa “kayo,” nang hindi nagdaragdag ng di-natural na “para sa inyong sarili.”
