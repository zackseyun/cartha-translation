  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: tl
  text: Pagkatapos, lumabas si Sihon upang salubungin kami[a], siya at ang buong bayan niya, upang makipaglaban sa Jahaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang harapin kami.” Sa kontekstong ito, ang pagsalubong ay para makipaglaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Kaya lumabas
  rationale: Ang pandiwa ay nagsasalaysay ng kasunod na pangyayari. Ang “lumabas” ay tuwirang katumbas ng יצא, at ang “kaya” ay natural na nag-uugnay nito sa naunang salaysay.
- source_word: סִיחֹן
  choice: Sihon
  rationale: Isinalin sa karaniwang anyo ng pangalang pantangi sa Filipino.
- source_word: לִקְרָאתֵנוּ
  choice: upang salubungin kami
  rationale: Pinananatili nito ang literal na diwang “upang salubungin/tagpuin kami,” habang nililinaw ng kasunod na “para makipaglaban” na mapanlaban ang pagtatagpo.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: siya at ang buo niyang bayan
  rationale: Pinananatili ang hiwalay na panghalip na nagbibigay-diin kay Sihon at ang malawak na kahulugan ng עַם bilang “bayan,” sa halip na paliitin ito sa “hukbo.”
- source_word: לַמִּלְחָמָה
  choice: para makipaglaban
  rationale: Natural na ipinahahayag sa Filipino ang layunin ng paglabas nila at ang malinaw na kontekstong militar.
- source_word: יָהְצָה
  choice: sa Jahaz
  rationale: Ang hulaping patungo-sa-lugar ay natural na naipapahayag ng “sa”; pinanatili ang nakaugaliang anyo ng pangalan ng lugar na “Jahaz.”
theological_decisions: []
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Pinanatili ang kaayusang “siya at ang buo niyang bayan” upang maipakita ang diin ng Hebreong panghalip, at hindi ginawang “hukbo” ang “bayan” upang maiwasan ang hindi kinakailangang pagpapakitid ng kahulugan.
