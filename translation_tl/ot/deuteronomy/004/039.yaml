base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: tl
  text: Kaya kilalanin mo ngayon at isapuso mo[a] na si Yahweh—siya ang Diyos sa langit sa itaas at sa lupa sa ibaba; wala nang iba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ibalik mo sa iyong puso” o “ilagak mo sa iyong puso”—isang idyoma para sa taimtim na pagkilala at pagtanggap sa katotohanan.
    reason: lexical_alternative
  - marker: b
    text: O, “wala nang iba pa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: kilalanin mo ngayon
  rationale: Ang Qal perfect na may pangatnig ay may puwersang paanyaya o utos sa konteksto. Ang “kilalanin” ay hindi lamang pag-alam ng impormasyon kundi pagkilala sa katotohanang ipinakita ni Moises; pinananatili ng “ngayon” ang agarang diin ng הַיּוֹם.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: isapuso mo
  rationale: Ang literal na larawan ay “ibalik/dalhin sa iyong puso,” isang idyoma para sa taimtim na pagkilala at pagtanggap sa katotohanan. Likas at malinaw sa modernong Tagalog ang “isapuso,” habang pinananatili ang larawang-puso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: הוּא הָאֱלֹהִים
  choice: siya ang Diyos
  rationale: Pinananatili ang mariing panghalip na הוּא at ang pagkakakilanlang ipinahahayag ng parirala.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: sa langit sa itaas at sa lupa sa ibaba
  rationale: Pinananatili ang magkatambal na saklaw ng buong kosmos. Ang isahang kolektibong “langit” ay mas natural sa Tagalog kaysa “mga langit” sa pariralang ito.
- source_word: אֵין עוֹד
  choice: wala nang iba
  rationale: Maikli at likas na Tagalog na nagpapahayag ng lubos na pagiging bukod-tangi ni Yahweh bilang Diyos.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng paliwanag na wala sa talata.
- issue: Eksklusibong pahayag na אֵין עוֹד
  choice: wala nang iba
  alternative: wala nang iba pa; wala nang iba bukod sa kanya
  rationale: Pinananatili ang ganap na pahayag na si Yahweh lamang ang Diyos, ngunit hindi ito pinalalawak sa mga pormulasyong teolohikal na hindi tahasang nasa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kilalanin” upang ihatid ang higit sa payak na kaalamang pangkaisipan, at “isapuso” bilang natural na katumbas ng idyomang Hebreo. Ang gitling na mahaba ay tumutulong na mapanatili ang diin ng “Yahweh—siya ang Diyos.”
