lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: mula sa Aroer
  rationale: Ang unlaping מִן ay tumutukoy sa panimulang hangganan; pinanatili bilang transliterasyon ang pangalang Aroer.
- source_word: אֲשֶׁר עַל שְׂפַת
