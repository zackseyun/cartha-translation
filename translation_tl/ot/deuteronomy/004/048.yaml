    text: Maaari ring “wadi ng Arnon” o “libis ng Arnon.” Ang Hebreong נַחַל ay madalas tumukoy sa isang libis, bangin, o daluyan ng tubig, at hindi kinakailangang sa isang ilog na palaging umaagos.
