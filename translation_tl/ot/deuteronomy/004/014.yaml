base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: tl
  text: Noong panahong iyon, inutusan ako ni Yahweh na ituro sa inyo ang mga tuntunin at mga kautusan[a], upang isagawa ninyo ang mga ito sa lupaing tatawirin ninyo upang angkinin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga batas at mga pasiya” para sa “mga tuntunin at mga kautusan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang manahin” para sa “upang angkinin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתִי
  choice: At … inutusan ako
  rationale: Ang paunang layon na ‘ako’ ay bahagyang binibigyang-diin sa Hebreo. Pinananatili ito sa natural na ayos ng modernong Tagalog nang hindi gumagamit ng alanganing ‘at ako naman.’
- source_word: צִוָּה
  choice: inutusan
  rationale: Ipinahahayag ng pandiwa ang makapangyarihang pag-uutos, hindi isang karaniwang pakiusap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְלַמֵּד
  choice: na ituro
  rationale: Likas na ipinapahayag nito sa Tagalog ang atas kay Moises na ipabatid at ituro sa Israel ang nilalaman ng mga batas.
- source_word: חֻקִּים
  choice: mga tuntunin
  rationale: Ipinahahayag nito ang mga itinakdang alituntunin o batas habang nananatiling malinaw sa ordinaryong mambabasa.
- source_word: מִשְׁפָּטִים
  choice: mga hatol
  rationale: Pinananatili nito ang legal na diwa at ang pagkakaiba nito sa חֻקִּים, bagaman maaari rin itong tumukoy sa mga batas o kapasiyahang legal.
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: upang isagawa ninyo ang mga iyon
  rationale: Tuwirang pinananatili ang layunin ng konstruksiyon at ang kongkretong diwa ng ‘gawin/isagawa,’ sa halip na ipakahulugan lamang bilang pakikinig o pag-alala.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang ‘lupain’ ay angkop sa heograpiko at tipanang konteksto ng Deuteronomio.
- source_word: עֹבְרִים שָׁמָּה
  choice: tatawirin ninyo
  rationale: Inilalarawan nito ang nalalapit na pagtawid ng Israel papunta sa lupain; hindi na hiwalay na isinalin ang direksiyonal na ‘doon’ dahil likas na nauunawaan sa Tagalog.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Saklaw ng pandiwa ang pagkuha at pananatiling may-ari ng lupain. Ang ‘angkinin’ ay maikli at natural, habang ang posibleng diwang ‘manahin’ ay itinatala sa talababa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang akademikong transliterasyon, sa halip na palitan ito ng titulong ‘PANGINOON.’
- issue: Diwa ng לְרִשְׁתָּהּ
  choice: angkinin
  alternative: manahin
  rationale: Maaaring mangahulugan ang salitang Hebreo ng pag-angkin o pagtanggap bilang mana. Ang ‘angkinin’ ay nababagay sa agarang konteksto ng pagpasok sa lupain, ngunit hindi itinatanggi ang diwa ng mana, kaya inilagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘isagawa’ upang mapanatili ang kongkretong utos na gawin ang mga tuntunin, at ‘lupain’ upang manatili ang tipanan at heograpikong himig ng talata.
