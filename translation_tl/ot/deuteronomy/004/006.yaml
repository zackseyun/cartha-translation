  source_fidelity: 'Ang salin ay tapat sa Hebreo: naipapakita ang magkasunod na utos na שׁמר at עשה, ang kolektibong “ito” bilang karunungan at pang-unawa, ang hayag na pagtingin ng mga bayan, at ang mariing רַק bilang “Tunay nga.” Ang pangunahing kailangang ayusin ay ang nawawalang layon ng ikalawang pandiwa sa “at isagawa.”'
  naturalness: Makabago at marangal ang rehistro. Gayunman, hindi ganap na likas o kumpleto ang “sundin ninyo ang mga ito at isagawa,” dahil ang “isagawa” ay karaniwang nangangailangan ng malinaw na layon sa ganitong ayos. Ang pag-uulit ng “ang mga ito” ay nagbibigay ng kinakailangang ganap na pahayag at tumutugma rin sa dalawang pandiwa ng pinagmulan.
  terminology: Ang “karunungan at pang-unawa,” “mga tuntunin,” at “Tunay nga” ay angkop. Ang “mga bayan” para sa עַמִּים at “bansa” para sa גּוֹי ay isang katanggap-tanggap na paraan upang mapanatili ang pagkakaibang leksikal, nang hindi binabago ang diwa.
