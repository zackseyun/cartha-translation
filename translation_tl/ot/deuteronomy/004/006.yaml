  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ וַ/עֲשִׂיתֶם֒ כִּ֣י הִ֤וא חָכְמַתְ/כֶם֙ וּ/בִ֣ינַתְ/כֶ֔ם לְ/עֵינֵ֖י הָ/עַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּ/ן אֵ֚ת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה וְ/אָמְר֗וּ רַ֚ק עַם חָכָ֣ם וְ/נָב֔וֹן הַ/גּ֥וֹי הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: tl
  text: Kaya sundin ninyo ang mga ito at isagawa ang mga ito, sapagkat ito ang inyong karunungan at pang-unawa sa paningin ng mga bayan. Kapag narinig nila ang lahat ng tuntuning ito[a], sasabihin nila, “Tunay nga[b], ang dakilang bansang ito ay isang bayang marunong at may pang-unawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga tuntunin” ay salin ng חֻקִּים, isang terminong legal na maaari ring isaling “mga batas” o “mga itinakdang kautusan.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring literal na isalin ang רַק bilang “lamang.” Gayunman, sa kontekstong ito ay malamang na mariing bulalas ito: “Tunay nga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: sundin ninyo
  rationale: Sa konteksto ng tipan at kautusan, ang שׁמר ay tumutukoy sa maingat na pagsunod. Mas likas sa makabagong Tagalog ang “sundin” kaysa “ingatan,” na maaaring mapagkamalang simpleng pag-iingat o pagprotekta.
- source_word: וַעֲשִׂיתֶם
  choice: at isagawa
  rationale: Ipinapakita ng עשה ang aktuwal na paggawa o pagtupad. Pinananatili ng “isagawa” ang pagkakaiba nito sa naunang “sundin.”
- source_word: כִּי הִוא
  choice: sapagkat ito ang
  rationale: Ang pambabaeng panghalip ay tumutukoy nang kolektibo sa naunang itinuro. Hindi tahasang nililinaw ng “ito” kung ang diin ay nasa mga tuntunin o sa pagsunod sa mga iyon, kaya napapanatili ang lawak ng sanggunian.
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: inyong karunungan at pang-unawa
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong konsepto: praktikal na karunungan at kakayahang umunawa o kumilatis.'
- source_word: לְעֵינֵי הָעַמִּים
  choice: sa paningin ng mga bayan
  rationale: Malapit ito sa literal na idyomang “sa mga mata ng mga bayan” habang likas sa Tagalog at malinaw na tumutukoy sa pampublikong pagkakakilala sa Israel.
- source_word: הָעַמִּים
  choice: mga bayan
  rationale: Ginamit ang “mga bayan” upang maiba sa הַגּוֹי, na isinaling “bansa” sa hulihan ng talata.
- source_word: אֲשֶׁר יִשְׁמְעוּן
  choice: Kapag narinig nila
  rationale: Ang temporal na anyo ay natural sa Tagalog at malinaw na ipinahahayag ang magiging tugon ng mga bayan matapos nilang marinig ang mga tuntunin.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: lahat ng tuntuning ito
  rationale: Ang “mga tuntunin” ay malinaw at dignidad na salin ng legal na terminong חֻקִּים, nang hindi gumagamit ng labis na teknikal o makalumang pananalita.
- source_word: רַק
  choice: Tunay nga
  rationale: Bagaman karaniwang nangangahulugang “lamang” ang רַק, dito ay malamang na nagsisilbi itong mariing pahayag ng paghanga. Likas na naihahatid iyon ng “Tunay nga.”
- source_word: עַם חָכָם וְנָבוֹן
  choice: isang bayang marunong at may pang-unawa
  rationale: Iniuugnay ng “marunong” at “may pang-unawa” ang papuri ng ibang mga bayan sa naunang “karunungan at pang-unawa,” nang hindi pinag-iisa ang dalawang termino.
theological_decisions:
- issue: Ugnayan ng pagsunod at karunungan
  choice: Inilalahad ng talata na ang pagsunod at pagsasagawa sa mga tuntunin ng Diyos ang hayag na pagpapakita ng karunungan at pang-unawa ng Israel sa harap ng ibang mga bayan.
  alternative: Ang mga tuntunin lamang, hiwalay sa pagsunod sa mga iyon, ang siyang karunungan at pang-unawa ng Israel.
  rationale: Magkaugnay sa sintaks ang utos na “sundin…at isagawa” at ang paliwanag na “ito ang inyong karunungan.” Pinananatili ng salin ang ugnayang ito ngunit hindi nagdaragdag ng pahayag tungkol sa merito, kaligtasan, o likas na kahigitan ng bansa.
- issue: Saklaw ng panghalip na הִוא (“ito”)
  choice: Pinanatili ang panghalip na “ito” nang hindi tahasang tinutukoy kung ito ay ang mga tuntunin bilang kabuuan o ang pagsunod sa mga iyon.
  alternative: 'Gawing tahasan: “ang pagsunod ninyo sa mga ito ang inyong karunungan.”'
  rationale: Maaaring kolektibo o deiktiko ang sanggunian sa Hebreo. Ang tahasang pagpapakahulugan sa salin ay magpapaliit sa tunay na ambiguwidad ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga bayan” at “bansa” upang mapanatili ang pagkakaiba ng עַמִּים at גּוֹי. Iniwasan ang mas makalumang “mga palatuntunan” at ang posibleng malabong “ingatan” para sa pagsunod sa kautusan.
