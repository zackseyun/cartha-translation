  naturalness: Maiintindihan ang draft, ngunit ang “nangungunyapit” ay mas bihira at mas matalinghaga kaysa sa karaniwang modernong Filipino. Ang “kumakapit nang mahigpit” ay natural, malinaw, at naipapahayag ang larawang nasa דבק. Mas natural din ang ayos na “kayong lahat ay buháy sa araw na ito.”
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה at “inyong Diyos” para sa אֱלֹהֵיכֶם. Ang “tipan” sa talababa ay angkop bilang maikling paglilinaw sa kontekstong leksikal, hindi bilang dagdag sa mismong salin.
