- from: Ngunit kayong nangungunyapit kay Yahweh na inyong Diyos ay buháy na lahat ngayon.[a]
  to: Ngunit kayong kumakapit nang mahigpit kay Yahweh na inyong Diyos—kayong lahat ay buháy sa araw na ito.[a]
  rationale: Inayos ang pagkakasunod at pagpili ng salita upang maging natural na modernong Filipino at mas tapat na maipakita ang saklaw ng “kayong lahat” at ang panahong “sa araw na ito,” nang hindi nagdaragdag ng aspektong wala sa Hebreo. Pinalitan ang mas bihirang “nangungunyapit” sa pangunahing teksto ng mas karaniwang “kumakapit nang mahigpit,” habang iningatan ito bilang leksikal na alternatibo sa talababa.
