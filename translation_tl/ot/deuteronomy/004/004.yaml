  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: tl
  text: Ngunit kayong kumakapit nang mahigpit kay Yahweh na inyong Diyos—kayong lahat ay buháy sa araw na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “kumakapit nang mahigpit” na “nangungunyapit” o “mahigpit na nakakapit”; ipinahihiwatig ng pananalita ang malapit na katapatan kay Yahweh sa loob ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Ngunit kayo
  rationale: Ipinahihiwatig ng pangatnig at tahasang panghalip ang pagsalungat sa mga namatay dahil sa Baal-peor sa naunang talata.
- source_word: הַ/דְּבֵקִים
  choice: nangungunyapit
  rationale: Ang participle mula sa דבק ay nagsasaad ng patuloy at malapit na pagkapit o katapatan; likas sa Filipino ang “nangungunyapit” at pinananatili nito ang larawan ng mahigpit na pagkapit.
- source_word: בַּ/יהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol ay nag-uugnay sa pagkapit sa Diyos ng tipan, at ang banal na pangalan יהוה ay tinumbasan bilang “Yahweh.”
- source_word: אֱלֹהֵי/כֶם
  choice: na inyong Diyos
  rationale: Pinananatili ang mahalagang pagtukoy kay Yahweh bilang Diyos ng mga Israelitang kinakausap.
- source_word: חַיִּים
  choice: buháy
  rationale: Likas na panaguring pang-uri sa Filipino para sa kanilang kasalukuyang kalagayan.
- source_word: כֻּלְּ/כֶם
  choice: na lahat
  rationale: Ipinakikita ang kabuuan ng mga nakaligtas nang hindi nagdaragdag ng di-kailangang salita.
- source_word: הַ/יּוֹם
  choice: ngayon
  rationale: Karaniwan at malinaw na katumbas ng deiktikong “sa araw na ito/ngayon” sa konteksto.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan ng Diyos ng tipan nang hindi ito ginagawang titulo.
- issue: Ugnayan ng pagkapit at pagiging buháy
  choice: Pinanatiling payak ang magkatabing pahayag nang walang idinagdag na tahasang sanhi
  alternative: “dahil nangunyapit kayo ... kaya buháy kayo”
  rationale: Ipinakikita ng konteksto ang ugnayan, ngunit walang tahasang salitang panhiwatig ng sanhi sa talata; hindi dapat higit na ipaliwanag ng salin ang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nangungunyapit” upang mapanatili ang kasalukuyang participial na diwa at ang matingkad na larawan ng דבק; nilagyan ng tuldik ang “buháy” upang maiwasang mabasa bilang “bahay.”
