base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/045.yaml
  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
translation:
  language: tl
  text: Ito ang mga patotoo, mga tuntunin, at mga hatol na sinabi ni Moises sa mga Israelita[a] nang lumabas sila sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak na lalaki ni Israel”; maaari ring isaling “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Natural na panimula sa Filipino para sa maramihang talaan; maaaring gamitin ang isahang deiktikong “ito” upang tukuyin ang kabuuang sumusunod na pangkat.
- source_word: הָעֵדֹת
  choice: mga patotoo
  rationale: Pinananatili ang diwa ng mga patotoong may kaugnayan sa tipan nang hindi ito nililinaw nang higit sa Hebreo.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Karaniwan at malinaw na salitang Filipino para sa mga itinakdang kautusang legal.
- source_word: הַמִּשְׁפָּטִים
  choice: mga hatol
  rationale: Pinananatili ang hudisyal at legal na diwa at itinatangi ito sa חֻקִּים.
- source_word: אֲשֶׁר דִּבֶּר
  choice: na sinabi ni Moises
  rationale: Likas na katumbas sa Filipino ng simpleng pandiwang “nagsalita/sinabi”; hindi nagdaragdag ng pormal na ideya ng pagpapahayag.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita[a]
  rationale: Natural at inklusibong katawagan sa modernong Filipino para sa etnikong pangkat; inilalagay sa talababa ang literal na anyong “mga anak na lalaki ni Israel.”
- source_word: בְּצֵאתָם
  choice: nang lumabas sila
  rationale: Ipinapahayag ang temporal na puwersa ng pang-ukol at infinitive construct sa natural na Filipino.
- source_word: מִמִּצְרָיִם
  choice: sa Ehipto
  rationale: Kasunod ng “lumabas,” ang “sa Ehipto” ang natural na pagpapahayag ng pinanggalingan sa Filipino.
