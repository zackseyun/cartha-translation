  to: Mayroon na bang bayang nakarinig sa tinig ng Diyos na nagsasalita mula sa gitna ng apoy, gaya ng narinig mo at nanatili kang buhay[a]?
  rationale: Inayos ang panghalip sa isahang “mo” upang katawanin ang tahasang isahang Hebreong panghalip, na tumutukoy sa Israel bilang isang bayan. Pinasimple rin ang simula para sa mas natural na Tagalog. Ang “nanatili kang buhay” ay natural na pagpapahayag ng resultang diwa ng וַיֶּחִי at hindi nagdaragdag ng teolohikal na interpretasyon; ang literal na alternatibo ay ipinaliwanag sa tala.
