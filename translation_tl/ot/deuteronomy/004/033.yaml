  yaml_path: translation/ot/deuteronomy/004/033.yaml
  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: tl
  text: Mayroon na bang bayang nakarinig sa tinig ng Diyos na nagsasalita mula sa gitna ng apoy, gaya ng narinig mo at nanatili kang buhay[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at nakaligtas.” Ang pandiwang Hebreo ay literal na “nabuhay,” ngunit itinatampok ng konteksto na nanatiling buhay ang bayan matapos marinig ang Diyos na nagsasalita mula sa apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: Mayroon na bang ... na nakarinig
  rationale: Ang pantanong na הֲ kasama ng ganap na pandiwa ay bumubuo ng retorikal na tanong tungkol sa karanasan; natural itong ipinahahayag sa modernong Tagalog sa pamamagitan ng “Mayroon na bang ... na nakarinig.”
- source_word: עָם
  choice: bayan
  rationale: Tumutukoy ang עָם sa isang pangkat ng mga taong may sama-samang pagkakakilanlan. Ang “bayan” ay natural dito at nagpapanatili sa paghahambing sa Israel bilang isang bayan.
- source_word: קוֹל
  choice: tinig
  rationale: Dahil kaugnay ito ng pandiwang “nagsasalita,” ang “tinig” ay mas angkop at personal kaysa “tunog.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyo ng salita, isahan ang participle na מְדַבֵּר at malinaw sa konteksto na ang Diyos ng Israel ang tinutukoy.
- source_word: מְדַבֵּר
  choice: nagsasalita
  rationale: Ipinapakita ng participle ang nagpapatuloy na kilos ng tinig ng Diyos; tuwiran at natural ang “nagsasalita.”
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: mula sa gitna ng apoy
  rationale: Pinananatili nito ang tiyak at matingkad na larawang panglokasyon ng Hebreo, hindi lamang ang payak na “mula sa apoy.”
- source_word: כַּ/אֲשֶׁר
  choice: gaya ng
  rationale: Natural na ipinakikilala ng “gaya ng” ang paghahambing sa natatanging karanasan ng Israel.
- source_word: שָׁמַעְתָּ אַתָּה
  choice: narinig ninyo
  rationale: May diin ang hiwalay na panghalip na אַתָּה. Ginamit ang magalang at kolektibong “ninyo” upang tukuyin ang bayang Israel na kinakausap ni Moises, bagaman isahan ang anyong Hebreo.
- source_word: וַ/יֶּחִי
  choice: at nabuhay
  rationale: Ang literal na diwa ng חיה ay “mabuhay.” Pinananatili ng “at nabuhay” ang payak na koordinasyon at ang tensiyong nakaligtas sila matapos marinig ang Diyos, nang hindi dinaragdagan ng “gayunma’y.”
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהִים sa konteksto ng tuwirang pagpapahayag ng Diyos
  choice: Diyos
  alternative: isang diyos; mga diyos
  rationale: Ang isahang participle at ang konteksto ng tipan sa Horeb ay tumutukoy sa Diyos ng Israel; hindi kailangan ang dagdag na paliwanag na doktrinal.
- issue: Kung gagawing tahasan ang pahiwatig na maaaring mamatay ang makarinig sa Diyos
  choice: at nabuhay
  alternative: at nakaligtas; at nanatiling buhay
  rationale: Payak lamang na pinag-uugnay ng Hebreo ang mga sugnay. Pinananatili ng “at nabuhay” ang tunay na salita at hinahayaang manggaling sa konteksto ang pambihirang diwa ng pagkaligtas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong עָם, “tinig” para sa personal at nauunawaang pagsasalita, at “ninyo” bilang natural na pagtukoy sa Israel na kinakausap bilang isang sama-samang bayan.
