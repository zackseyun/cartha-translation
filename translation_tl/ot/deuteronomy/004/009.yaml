id: DEU.4.9
reference: Deuteronomy 4:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: tl
  text: Mag-ingat ka lamang at bantayan mong mabuti ang iyong sarili, upang hindi mo malimutan ang mga bagay na nakita ng iyong mga mata at upang hindi mawala ang mga iyon sa iyong puso[a] habang ikaw ay nabubuhay. Ipaalam mo ang mga iyon sa iyong mga anak at mga apo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “iyong puso.” Dito, ang puso ay tumutukoy sa panloob na pagkatao, kabilang ang alaala, pag-unawa, at kalooban.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “sa iyong mga anak na lalaki at sa mga anak na lalaki ng iyong mga anak.” Gumagamit ang Hebreo ng mga panlalaking katawagan na, ayon sa konteksto, ay maaaring tumukoy sa mga anak o inapo sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: lamang
  rationale: Ipinananatili nito ang mariing pagbibigay-diin o paghihigpit ng רַק nang hindi nagdaragdag ng di-tiyak na pangatnig.
- source_word: הִשָּׁמֶר לְךָ
  choice: mag-ingat ka
  rationale: Likas na idyomang Filipino para sa utos na maging mapagbantay sa sarili.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: at bantayan mong mabuti ang iyong sarili
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa buong sarili o pagkatao, hindi kinakailangang sa hiwalay na di-materyal na kaluluwa; pinananatili rin ng 'bantayan' ang pag-uulit ng ugat na שׁמר.
- source_word: פֶּן ... וּפֶן
  choice: upang hindi ... at upang hindi
  rationale: Malinaw at natural na ipinahahayag ang dalawang magkatugmang babala ng Hebreo.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: ang mga bagay na nakita ng iyong mga mata
  rationale: Dahil nakikita ang tinutukoy, ang דְּבָרִים ay pinakamainam ditong unawain bilang 'mga bagay'; pinananatili ang diin sa sariling nasaksihan.
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: at upang hindi mawala ang mga iyon sa iyong puso
  rationale: Pinananatili ang talinghaga ng puso bilang sentro ng alaala, pag-unawa, at kalooban, habang natural ang pandiwang 'mawala' sa Filipino.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: habang ikaw ay nabubuhay
  rationale: Natural na katumbas sa modernong Filipino ng idyomang 'lahat ng araw ng iyong buhay,' nang hindi binabago ang saklaw nito.
- source_word: וְהוֹדַעְתָּם
  choice: Ipaalam mo ang mga iyon
  rationale: Tuwirang ipinahahayag ang causative na kahulugan ng Hiphil ng ידע, 'ipakilala/ipaalam,' sa halip na paliitin ito sa pormal na pagtuturo.
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: sa iyong mga anak at mga apo
  rationale: Natural na Filipino para sa dalawang salinlahi ng mga supling; ang panlalaking anyong Hebreo ay maaaring kumatawan sa mga anak o inapo sa pangkalahatan.
theological_decisions:
- issue: Kahulugang antropolohikal ng נֶפֶשׁ
  choice: iyong sarili
  alternative: iyong kaluluwa / iyong buhay
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa taong kailangang maging mapagbantay sa sarili. Iniiwasan ng salin ang pagpasok ng isang tiyak na doktrina tungkol sa paghihiwalay ng katawan at kaluluwa.
- issue: Saklaw ng panlalaking בָנֶיךָ
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Ang utos ay tungkol sa pagpapanatili ng alaala sa magkakasunod na salinlahi, at walang pahiwatig na nililimitahan ito sa mga lalaking anak lamang.
- issue: Larawan ng לֵבָב bilang puso
  choice: puso
  alternative: isip / alaala
  rationale: Pinananatili ang malawak na larawang Hebreo ng panloob na pagkatao sa halip na paliitin ito sa isang kakayahang mental lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng babala, ang kongkretong larawan ng mga mata at puso, at ang diin sa paghahatid ng nasaksihan sa susunod na mga salinlahi.
