revisions:
- from: 'Nakita mismo ng inyong mga mata ang ginawa ni Yahweh kaugnay ng Baal-peor: nilipol ni Yahweh na inyong Diyos mula sa gitna ninyo ang bawat lalaking sumunod kay Baal-peor.[a]'
  to: Nasaksihan mismo ng inyong mga mata ang ginawa ni Yahweh sa Baal-peor, sapagkat nilipol ni Yahweh na inyong Diyos ang bawat lalaking sumunod kay Baal-peor[a] mula sa gitna ninyo.
  rationale: Pinalitan ang mas maluwag na “kaugnay ng” ng “sa” upang masunod ang situwasyonal na parirala sa Hebreo. Inayos ang pangungusap upang malinaw na ang bawat lalaking sumunod kay Baal-peor ang nilipol at inalis mula sa gitna ng bayan. Inilipat ang pananda ng talababa sa idyomang ipinapaliwanag at nilinaw ang reperensiya nito.
