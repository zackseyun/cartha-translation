  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֵ֛ת אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה בְּ/בַ֣עַל פְּע֑וֹר כִּ֣י כָל הָ/אִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל פְּע֔וֹר הִשְׁמִיד֛/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/קִּרְבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: tl
  text: Nasaksihan mismo ng inyong mga mata ang ginawa ni Yahweh sa Baal-peor, sapagkat nilipol ni Yahweh na inyong Diyos ang bawat lalaking sumunod kay Baal-peor[a] mula sa gitna ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang bawat lalaking lumakad kasunod ni Baal-peor.” Ang idyomang Hebreo ay nagpapahiwatig ng pagsunod kay Baal-peor sa katapatan o pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: Nakita mismo ng inyong mga mata
  rationale: Pinananatili ang pagdiriin sa personal at tuwirang pagkakita, sa natural na ayos ng makabagong Tagalog.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Tumutukoy sa ginawa ni Yahweh bilang paghatol sa pangyayari sa Baal-peor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang YHWH sa transliterasyong Yahweh, sa halip na palitan ito ng isang titulo.
- source_word: בְּבַעַל פְּעוֹר
  choice: kaugnay ng Baal-peor
  rationale: Ang בְּ ay maaaring tumukoy sa pangyayari o usaping nauugnay sa Baal-peor; mas malinaw ito sa Tagalog kaysa sa lokatibong 'sa Baal-peor,' na maaaring mapagkamalang lugar lamang.
- source_word: כִּי
  choice: ':'
  rationale: Ang paliwanag na ipinakikilala ng כִּי ay natural na naihahayag sa Tagalog sa pamamagitan ng tutuldok, nang hindi pinapabigat ang pangungusap.
- source_word: כָּל הָאִישׁ
  choice: ang bawat lalaking
  rationale: Pinananatili ang panlalaking isahang anyo na ginagamit nang distributibo sa Hebreo.
- source_word: הָלַךְ אַחֲרֵי
  choice: sumunod kay
  rationale: Ipinahahayag nito ang pagsunod o pagtataguyod sa isang diyos; natural sa Tagalog ang 'sumunod kay' at malinaw ang diwa ng katapatan o pagsamba.
- source_word: הִשְׁמִידוֹ
  choice: nilipol ... ang bawat lalaking
  rationale: Malakas na ipinahahayag ng 'nilipol' ang pagwasak o pagpuksa. Ginawang tuwirang layon sa Tagalog ang naunang distributibong parirala upang maiwasan ang alanganing pag-uulit ng panghalip.
- source_word: אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Tumutugma sa maramihang kausap sa unang sugnay, bagaman isahan ang anyo sa Hebreo sa bahaging ito dahil sa paglipat ng bilang na karaniwan sa Deuteronomio.
- source_word: מִקִּרְבֶּךָ
  choice: mula sa gitna ninyo
  rationale: Pinananatili ang larawan ng pag-aalis mula sa loob ng pamayanan.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ang transliterasyong Yahweh nang hindi ito pinapalitan ng titulo.
- issue: Pagkakakilanlan ng Baal-peor sa pariralang הָלַךְ אַחֲרֵי בַעַל פְּעוֹר
  choice: sumunod kay Baal-peor
  alternative: pumunta sa Baal-peor; sumunod sa usapin ng Baal-peor
  rationale: Sa kontekstong ito, ang idyoma ay nagpapahiwatig ng pagsunod sa isang diyos sa katapatan o pagsamba. Hindi nililinaw nang higit sa sinasabi ng teksto ang tiyak na anyo ng idolatriya.
- issue: Panlalaking distributibong כָּל הָאִישׁ
  choice: bawat lalaking
  alternative: bawat isa; lahat ng tao
  rationale: Pinananatili ang gramatikal na panlalaking anyo ng pinagmulang teksto habang ipinapakita ang distributibong saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo/inyong” para sa kolektibong kausap at inayos ang pangungusap upang maging natural sa Tagalog habang pinananatili ang diin, lakas ng paghatol, at mga paglipat ng bilang sa Hebreo.
