base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: tl
  text: Mag-ingat kayo, baka malimutan ninyo ang tipan ni Yahweh na inyong Diyos na ginawa niya kasama ninyo, at gumawa kayo para sa inyong sarili ng larawang inukit na kawangis ng anumang iniutos sa iyo ni Yahweh na iyong Diyos na huwag gawin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “na iniutos sa iyo ni Yahweh na iyong Diyos.” Ipinahihiwatig ng konteksto ang “huwag gawin”; ihambing ang Deuteronomio 4:16.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Mag-ingat kayo
  rationale: Ang Niphal na pautos na may לָכֶם ay isang babalang nangangahulugang magbantay o mag-ingat para sa sarili. Likas at malinaw sa makabagong Tagalog ang “Mag-ingat kayo.”
- source_word: פֶּן
  choice: baka
  rationale: Ipinakikilala ng פֶּן ang posibleng masamang kahihinatnang dapat iwasan. Ang “baka” ay natural sa Tagalog at napapanatili ang himig ng babala.
- source_word: בְּרִית
  choice: tipan
  rationale: Ang “tipan” ang kinikilalang salin para sa solemneng ugnayang itinatag ng Diyos sa Israel at mas angkop kaysa sa karaniwang “kasunduan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: na ginawa niya sa inyo
  rationale: Ang כרת ברית ay idyomang Hebreo para sa paggawa o pagtatatag ng tipan. Hindi ginamit ang literal na “pinutol,” na magiging malabo sa Tagalog.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: at gumawa kayo para sa inyong sarili
  rationale: Pinananatili nito ang benepaktibo o pansariling diwa ng לָכֶם at binibigyang-diin na ang ipinagbabawal na larawan ay ginagawa nila para sa kanilang sarili.
- source_word: פֶּסֶל
  choice: isang inukit na larawan
  rationale: Tumutukoy ang פֶּסֶל sa larawang hinubog, lalo na sa pamamagitan ng pag-ukit. Mas tiyak ito kaysa sa mas malawak na “diyus-diyosan.”
- source_word: תְּמוּנַת כֹּל
  choice: na kawangis ng anumang
  rationale: Ipinahihiwatig ng תְּמוּנָה ang anyo, wangis, o representasyon. Natural na naiuugnay ng “kawangis ng anumang” ang representasyon sa inukit na larawan.
- source_word: אֱלֹהֵיכֶם / אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Ang unang anyo ay maramihan at ang huli ay isahan sa Hebreo. Ginawang maramihan ang panghalip sa pangunahing salin para sa malinaw at tuloy-tuloy na pakikipag-usap sa buong bayan; itinala sa talababa ang pagbabago ng bilang sa teksto.
theological_decisions:
- issue: Hindi tahasang nakasulat ang pagtanggi sa huling sugnay
  choice: Isinalin bilang “iniutos ... na huwag gawin” at nilagyan ng talababa.
  alternative: Isalin nang pormal bilang “na iniutos sa inyo ni Yahweh na inyong Diyos,” nang hindi idinaragdag ang “huwag gawin.”
  rationale: Walang tahasang לֹא sa huling sugnay ng tekstong Masoretiko, ngunit malinaw na ipinagbabawal ng agarang konteksto ang paggawa ng larawan, lalo na sa Deuteronomio 4:16. Ang paglalantad sa ipinahihiwatig na pagtanggi ay umiiwas sa maling impresyong iniutos ng Diyos ang paggawa ng larawan, habang tapat na itinatala sa talababa ang anyo ng Hebreo.
- issue: Pagbabago mula maramihan tungo sa isahan sa panghalip
  choice: Panatilihing maramihan sa pangunahing salin at ipaliwanag sa talababa ang isahang anyo sa huling sugnay.
  alternative: Isalin ang huling sugnay na “iniutos sa iyo ni Yahweh na iyong Diyos,” na tuwirang nagpapakita ng pagbabago ng bilang.
  rationale: Karaniwan sa Deuteronomio ang paghalili ng pakikipag-usap sa Israel bilang buong bayan at bilang kolektibong iisang kausap. Ang tuloy-tuloy na maramihan ay mas malinaw sa modernong Tagalog nang hindi ipinapalagay na nagbago ang tinutukoy na kausap; pinananatili ng talababa ang datos ng pinagmulang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tipan” at “Yahweh” bilang mga terminong biblikal ngunit madaling maunawaan. Iniwasan ang mga lipas na anyo gaya ng “larawang inanyuan” at ang masyadong malawak na “diyus-diyosan.”
