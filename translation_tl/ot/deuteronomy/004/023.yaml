revisions:
- from: Mag-ingat kayo, baka malimutan ninyo ang tipan ni Yahweh na inyong Diyos, na ginawa niya sa inyo, at gumawa kayo para sa inyong sarili ng isang inukit na larawan na kawangis ng anumang iniutos sa inyo ni Yahweh na inyong Diyos na huwag gawin.[a][b]
  to: Mag-ingat kayo, baka malimutan ninyo ang tipan ni Yahweh na inyong Diyos na ginawa niya kasama ninyo, at gumawa kayo para sa inyong sarili ng larawang inukit na kawangis ng anumang iniutos sa iyo ni Yahweh na iyong Diyos na huwag gawin.[a]
  rationale: Nilinaw ang ‘made with you’ bilang “ginawa niya kasama ninyo,” at ibinalik sa pangunahing salin ang isahang “sa iyo/iyong Diyos” sa huling sugnay. Iningatan ang kontekstuwal na ipinahihiwatig na pagbabawal at ang talababa nito, dahil walang tahasang negasyon sa Masoretikong tekstong nasa sugnay na iyon.
