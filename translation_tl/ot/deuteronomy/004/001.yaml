  terminology: Pinananatili ang “Yahweh” at ang natural na pormulang “ang Diyos ng inyong mga ninuno.” Pinalitan ang “mga kahatulan” ng “mga pasiya” upang mapanatili ang legal/panghukom na kulay ng משפטים nang hindi nagbibigay ng di-natural na kahulugang hatol o kaparusahan. Ang “mga tuntunin” ay nananatiling hiwalay na salin ng חקים.
