id: DEU.4.1
reference: Deuteronomy 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: tl
  text: Ngayon, Israel, makinig ka sa mga tuntunin at mga pasiya[a] na itinuturo ko sa inyo upang isagawa ninyo, upang kayo ay mabuhay, makapasok, at angkinin[b] ang lupain na ibinibigay sa inyo ni Yahweh[c], ang Diyos ng inyong mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mga batas at mga ordinansa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ariin” o “manahin.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sa Hebreo: “YHWH”; ayon sa tradisyon, isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinakikita ang malinaw na paglipat mula sa naunang salaysay tungo sa kasalukuyang panawagan ni Moises.
- source_word: שְׁמַע אֶל
  choice: makinig ka sa
  rationale: Pinananatili ang tuwirang utos sa Israel bilang iisang sambayanan at ang diwa ng maingat na pakikinig; hindi ito agad nilulutas bilang ‘sumunod,’ sapagkat ang pagsasagawa ay tahasang binabanggit kasunod nito.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Likas at malinaw na katawagang Filipino para sa mga itinakdang kautusang legal, habang pinananatiling naiiba sa מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: mga kahatulan
  rationale: Pinananatili ang legal at panghukom na kulay ng salita at ang pagkakaiba nito sa חֻקִּים.
- source_word: מְלַמֵּד
  choice: itinuturo ko
  rationale: Ipinahahayag ang nagpapatuloy na pagtuturo ni Moises sa kasalukuyang tagpo.
- source_word: לַעֲשׂוֹת
  choice: upang inyong gawin
  rationale: Pinananatili ang kongkretong diin ng Hebreo sa aktuwal na pagsasagawa, hindi lamang sa pakikinig o pagkaalam.
- source_word: לְמַעַן תִּחְיוּ
  choice: nang sa gayon ay mabuhay kayo
  rationale: Malinaw na ipinahahayag ang layunin o bunga nang hindi dinaragdagan ang saklaw ng kahulugang ‘mabuhay.’
- source_word: וּבָאתֶם
  choice: makapasok
  rationale: Natural na Filipino para sa pagpasok sa lupang nasa pangako at umaayon sa magkakasunod na layunin o bunga sa pangungusap.
- source_word: וִירִשְׁתֶּם
  choice: angkinin
  rationale: Ipinahahayag ang pagkuha at paghawak sa lupa bilang pag-aari; itinatala sa talababa ang maaari ring saling ‘manahin.’
- source_word: הָאָרֶץ
  choice: lupa
  rationale: Karaniwang katawagang tipan sa konteksto ng Pentateuco at ng pangakong lupain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: ang Diyos ng inyong mga ninuno
  rationale: Natural at malinaw sa makabagong Filipino, at ipinahahayag ang pormulang tumutukoy sa Diyos ng mga naunang salinlahi ng Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong pangalan at hindi tahimik na pinapalitan ng titulong ‘PANGINOON.’
- issue: Ugnayan ng pakikinig at pagsunod
  choice: makinig ka ... upang inyong gawin
  alternative: sundin ninyo
  rationale: Pinananatili ang pagkakaiba sa pagitan ng utos na makinig at ng kasunod na layuning isagawa ang itinuro; hindi ipinapasok sa unang pandiwa ang buong diwa ng pagsunod.
- issue: Kahulugan ng buhay sa לְמַעַן תִּחְיוּ
  choice: mabuhay kayo
  alternative: patuloy kayong mabuhay
  rationale: Hindi tinutukoy ng talata kung panimulang buhay, pagpapatuloy ng buhay, o mas malawak na tipanang kasaganaan ang eksaktong diin, kaya pinananatili ang payak at sadyang maluwag na ‘mabuhay.’
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong isahan sa “Israel, makinig ka” dahil iisang sambayanan ang tuwirang kinakausap, saka ang maramihan sa “sa inyo/kayo” gaya ng paglipat sa tekstong Hebreo. Ginamit ang “mga ninuno” sa pormulang pangtipan upang maging natural at malinaw sa ordinaryong mambabasa.
