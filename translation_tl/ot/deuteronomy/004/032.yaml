source:
  edition: WLC
  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: tl
  text: 'Magtanong ka ngayon tungkol sa mga sinaunang araw na nauna sa iyo, mula sa araw nang likhain ng Diyos ang tao[a] sa lupa, at mula sa isang dulo ng langit hanggang sa kabilang dulo ng langit: May nangyari na bang gaya ng dakilang bagay na ito, o may narinig na bang katulad nito?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sangkatauhan.” Ang Hebreong אָדָם ay maaaring tumukoy sa tao bilang kinatawan ng buong sangkatauhan sa konteksto ng paglikha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: itanong mo ngayon
  rationale: Pinananatili ang pautos at ang mariing pakiusap ng נָא sa natural na modernong Tagalog.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: ang tungkol sa mga sinaunang araw
  rationale: Tumutukoy sa malayong nakaraan at nagpapanatili ng marangal na himig.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: na nauna sa iyo
  rationale: Malinaw na ipinapahayag ang temporal na kahulugang nauna sa tagapakinig.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: mula nang araw na likhain
  rationale: Ipinapakita ang panimulang hangganan ng panahong sinisiyasat, habang natural sa Tagalog.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin dito para sa nag-iisang Maylalang.
- source_word: אָדָם
  choice: tao
  rationale: Ang singular na אָדָם sa konteksto ng paglikha ay maaaring kumatawan sa sangkatauhan; ang 'tao' ay nagpapanatili ng singular at ng likas na lawak ng salitang Hebreo nang hindi ipinapalagay na pangalang Adan.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Direkta at natural na lokatibong salin; sa konteksto, tumutukoy sa lupa o daigdig na tinitirhan ng tao.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: at mula sa isang dulo ng langit hanggang sa kabilang dulo ng langit
  rationale: Pinananatili ang merismong nagpapahayag ng buong lawak at ang pag-uulit ng Hebreo.
- source_word: הֲנִהְיָה
  choice: May nangyari na ba
  rationale: Natural na retorikal na tanong para sa kung ang gayong pangyayari ay naganap kailanman.
- source_word: כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: gaya ng dakilang bagay na ito
  rationale: Ang 'bagay' ay sadyang malawak, gaya ng דָּבָר, at maaaring tumukoy sa pangyayari o usapin.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: o may narinig na bang tulad nito?
  rationale: Ipinananatili ang pasibong diwa ng 'narinig' at ang retorikal na puwersa nang hindi nililimitahan sa isang partikular na uri ng ulat.
theological_decisions:
- issue: Kahulugan ng אָדָם sa konteksto ng paglikha
  choice: tao
  alternative: sangkatauhan; Adan
  rationale: Ang anyong singular ay maaaring representatibong tumukoy sa buong sangkatauhan. Ang 'tao' ay nagpapanatili ng posibilidad na iyon nang hindi tiyak na ginagawang pangalang pantangi; nililinaw sa talababa ang kolektibong kahulugan.
- issue: Saklaw ng הַשָּׁמַיִם
  choice: langit
  alternative: mga langit; kalangitan
  rationale: Bagaman pormal na plural ang Hebreo, ang 'langit' ang natural na kolektibong katawagan sa Tagalog. Hindi nito tinutukoy o nilulutas ang anumang kosmolohikal na bilang ng mga langit.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang mahabang saklaw ng retorikal na tanong at ang pag-uulit na 'dulo ng langit' upang maipakita ang diin ng Hebreo.
