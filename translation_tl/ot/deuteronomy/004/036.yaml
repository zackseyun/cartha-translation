language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִן הַ/שָּׁמַ֛יִם הִשְׁמִֽיעֲ/ךָ֥ אֶת קֹל֖/וֹ לְ/יַסְּרֶ֑/ךָּ וְ/עַל הָ/אָ֗רֶץ הֶרְאֲ/ךָ֙ אֶת אִשּׁ֣/וֹ הַ/גְּדוֹלָ֔ה וּ/דְבָרָ֥י/ו שָׁמַ֖עְתָּ מִ/תּ֥וֹךְ הָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: tl
  text: Mula sa langit ay ipinarinig niya sa iyo ang kanyang tinig upang disiplinahin ka[a]. At sa lupa ay ipinakita niya sa iyo ang kanyang malaking apoy, at narinig mo ang kanyang mga salita mula sa gitna ng apoy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang turuan ka” o “upang ituwid ka.” Maaaring saklawin ng pandiwang Hebreo ang disiplinang kapwa nagtuturo at nagtutuwid.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa loob ng apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: Mula sa langit
  rationale: Likas na katumbas ito ng idyomang Hebreo at pinananatili ang kaibahan ng “langit” at “lupa.”
- source_word: הִשְׁמִיעֲךָ
  choice: ipinarinig niya sa iyo
  rationale: 'Ipinahahayag ng anyong Hiphil ang sanhi: ginawa niyang marinig ng Israel ang kanyang tinig. Ang “ipinarinig” ang natural na causative sa Tagalog.'
- source_word: קֹלוֹ
  choice: ang kanyang tinig
  rationale: Sa konteksto ng pagsasalita ng Diyos, ang קוֹל ay tumutukoy sa tinig, hindi lamang sa isang di-tiyak na tunog.
- source_word: לְיַסְּרֶךָּ
  choice: upang disiplinahin ka
  rationale: Maaaring saklawin ng יסר ang pagtuturo, pagtutuwid, at pagdidisiplina. Pinananatili ng “disiplinahin” ang mapaghubog at mapagtuwid na diwa nang hindi ito nililimitahan sa pagpaparusa lamang.
- source_word: וְעַל הָאָרֶץ
  choice: At sa lupa
  rationale: Pinananatili nito ang tahasang panlupang kaibahan sa naunang “mula sa langit.”
- source_word: הֶרְאֲךָ
  choice: ipinakita niya sa iyo
  rationale: Natural na Tagalog ito para sa causative na anyo ng ראה, “ginawa niyang makita mo.”
- source_word: אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: ang kanyang malaking apoy
  rationale: Tuwirang pinananatili ang konkretong “apoy” at ang paglalarawan dito bilang malaki, nang walang idinagdag na paliwanag.
- source_word: וּדְבָרָיו
  choice: ang kanyang mga salita
  rationale: Pinananatili ang tahasang maramihang anyo ng Hebreo at ang konkretong paglalarawan sa sinalitang kapahayagan.
- source_word: שָׁמַעְתָּ
  choice: narinig mo
  rationale: Ang pandiwa rito ay tumutukoy sa aktuwal na pagkarinig; hindi kailangang dagdagan ng diwa ng pagsunod o pakikinig nang may pagsang-ayon.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mula sa gitna ng apoy
  rationale: Pinananatili nito ang larawan ng tinig na nagmumula sa loob o gitna ng apoy.
theological_decisions:
- issue: Layuning pedagogikal ng Diyos sa לְיַסְּרֶךָּ
  choice: upang disiplinahin ka
  alternative: upang turuan ka; upang ituwid ka
  rationale: Hindi nilulutas nang labis ang saklaw ng pandiwa, na maaaring tumukoy kapwa sa mapaghubog na pagtuturo at sa mapagtuwid na disiplina.
- issue: Konkretong wika ng pagpapahayag ng Diyos
  choice: ang kanyang tinig … ang kanyang malaking apoy … ang kanyang mga salita
  alternative: Mas abstraktong paglalarawan sa paghahayag ng Diyos
  rationale: Pinananatili ang konkretong wika ng tekstong Hebreo nang hindi pinapahina o ipinapaliwanag palayo ang paraan ng pagpapakilala ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “langit,” “lupa,” “tinig,” at “apoy,” habang pinanatili ang causative na diwa sa “ipinarinig” at ang semantikong lawak ng יסר sa teksto at talababa.
