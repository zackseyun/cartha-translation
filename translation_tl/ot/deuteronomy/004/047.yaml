base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: tl
  text: At sinakop nila ang lupain niya at ang lupain ni Og, hari ng Basan—ang dalawang haring Amoreo na nasa kabila ng Jordan[a], sa dakong sinisikatan ng araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kabilang panig ng Jordan.” Isang karaniwang idyomang heograpikal ito sa Hebreo; nakadepende sa pananaw ng nagsasalaysay ang eksaktong kahulugan ng “kabila.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa dakong pagsikat ng araw,” ibig sabihin, sa silangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: sinakop nila
  rationale: Sa konteksto ng pagsakop sa lupain, ang ירשׁ ay tumutukoy sa pagkuha at pag-angkin ng teritoryo, na kadalasang may kasamang pagpapaalis sa dating may hawak nito. Likas at malinaw sa modernong Tagalog ang “sinakop nila.”
- source_word: אַרְצוֹ
  choice: ang lupain niya
  rationale: Tumutukoy ang hulaping panlalaking isahan kay Sihon sa naunang konteksto. Tuwiran at natural ang “lupain niya.”
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: ang lupain ni Og na hari ng Basan
  rationale: Pinananatili nito ang tuwirang ugnayan ng lupain kay Og at ang kaniyang titulong hari ng Basan.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: ang lupain ng dalawang haring Amoreo
  rationale: Sa Hebreo, ang pariralang “dalawang haring Amoreo” ay appositional sa dalawang naunang lupain at hari. Inulit ang “lupain ng” sa Tagalog upang maging malinaw ang sintaks nang hindi binabago ang pagtukoy kina Sihon at Og.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Karaniwang heograpikong idyoma ito. Pinananatili ng “sa kabila ng Jordan” ang relatibong pananaw ng Hebreo sa halip na tahasang tukuyin ang silangan sa mismong pariralang ito.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: sa dakong sinisikatan ng araw
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreong “pagsikat ng araw” habang malinaw na tumutukoy sa dakong silangan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Basan,” “Amoreo,” at “Jordan” bilang karaniwang anyong biblikal sa Tagalog. Ang gitling na em dash ay tumutulong upang malinaw na iugnay ang dalawang lupain sa dalawang haring Amoreo.
