  terminology: Ang “Yahweh na aking Diyos” ay tapat sa יְהוָה אֱלֹהָי. “Mga tuntunin at mga pasiya” ay nagpapanatili ng dalawang legal na kategorya nang hindi ipinahihiwatig na ang מִשְׁפָּטִים ay mga kaparusahan. Ang “angkinin” ay katanggap-tanggap para sa ירשׁ, na maaari ring magpahiwatig ng pagmamana o pagkuha ng pag-aari.
