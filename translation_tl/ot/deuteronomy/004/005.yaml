  text: רְאֵ֣ה לִמַּ֣דְתִּי אֶתְ/כֶ֗ם חֻקִּים֙ וּ/מִשְׁפָּטִ֔ים כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָ֣ה אֱלֹהָ֑/י לַ/עֲשׂ֣וֹת כֵּ֔ן בְּ/קֶ֣רֶב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: tl
  text: Tingnan ninyo, itinuro ko sa inyo ang mga tuntunin at mga pasiya[a], gaya ng iniutos sa akin ni Yahweh na aking Diyos, upang isagawa ninyo ang mga ito sa loob ng lupaing papasukin ninyo upang angkinin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kautusan at mga pasiya.”
    reason: lexical_alternative
  - marker: b
    text: Ang “angkinin” ay maaari ring isalin na “ariin” o “manahin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tingnan ninyo
  rationale: Isang pautos na ginagamit upang ituon ang pansin. Bagaman isahan ang anyong Hebreo at kolektibong Israel ang kinakausap, ang maramihang “ninyo” ang likas at malinaw sa modernong Tagalog.
- source_word: לִמַּדְתִּי
  choice: itinuro ko
  rationale: Ipinapahayag ng perfect 1cs ang pagtuturong naisagawa na ni Moises at may bisa sa kasalukuyang tagubilin.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: mga tuntunin at mga kahatulan
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong terminong legal: ang mga itinakdang tuntunin at ang mga pasiyang may kinalaman sa katarungan.'
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: gaya ng iniutos sa akin
  rationale: Malinaw na ipinahahayag ang pagtutugma ng itinuro ni Moises sa iniutos sa kaniya ng Diyos.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh na aking Diyos
  rationale: Pinananatili ang personal na pangalang tipan na יְהוָה at ang unang-panauhang ugnayan sa “aking Diyos.”
- source_word: לַעֲשׂוֹת כֵּן
  choice: upang isagawa ninyo ang mga ito
  rationale: Ipinahahayag ang layunin ng pagtuturo at likas na tinutukoy sa Tagalog ang naunang “mga tuntunin at mga kahatulan,” sa halip na gumamit ng malamya at malabong “gawin nang gayon.”
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: sa lupain
  rationale: Ang idyomang Hebreo ay literal na “sa gitna/loob ng lupain,” ngunit sa kontekstong ito ang natural na diwa sa Tagalog ay “sa lupain.”
- source_word: בָּאִים שָׁמָּה
  choice: papasukin ninyo
  rationale: Ipinahahayag ang nalalapit na pagpasok sa tinutukoy na lupain; hindi na inuulit ang שָׁמָּה bilang “doon” sapagkat likas nang taglay ito ng pariralang Tagalog.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Saklaw ng ירשׁ ang pag-aari o pagkuha ng lupain bilang pagmamana; ang “angkinin” ay maikli, natural, at hindi labis na nagpapasiya sa pagitan ng mga aspektong ito.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalang pantangi ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang tahasang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Tinukoy na gumagawa sa לַעֲשׂוֹת כֵּן
  choice: ang Israel ang magsasagawa ng mga tuntunin at kahatulan
  alternative: si Moises ang inutusang “gawin ang gayon”
  rationale: Bagaman maaaring mapansin ang pagkakalapit ng infinitive sa “iniutos sa akin,” ipinakikita ng daloy ng pangungusap at ng kasunod na lokasyon sa lupaing papasukin ng Israel na layunin ng pagtuturo ang pagsasagawa ng bayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Tingnan ninyo” bilang likas na panawag-pansin, iniwasan ang arkaikong pananalita, at pinanatili ang legal na pagkakaiba ng חֻקִּים at מִשְׁפָּטִים.
