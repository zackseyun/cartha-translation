  source_fidelity: 'Ang draft ay wastong naghahatid ng pangunahing diwa: itinuro ni Moises ang mga legal na tagubilin ayon sa utos ni Yahweh upang isagawa ng Israel sa lupaing kanilang papasukan at aangkinin. Gayunman, ang “kahatulan” ay karaniwang tumutukoy sa hatol, kaparusahan, o condemnation sa modernong Tagalog at hindi ito ang pinakamalinaw na katumbas ng מִשְׁפָּטִים sa legal na pares na ito. Hindi rin naipapakita ng “sa lupain” ang bahagyang diin ng בְּקֶרֶב, ‘sa loob/gitna ng.’'
