revisions:
- from: O mayroon na bang sinumang diyos na nagtangkang pumunta at kumuha para sa sarili niya ng isang bansa mula sa gitna ng ibang bansa, sa pamamagitan ng mga pagsubok, mga tanda, mga kababalaghan, digmaan, makapangyarihang kamay, nakaunat na bisig, at mga dakilang kakila-kilabot na bagay[a]—tulad ng lahat ng ginawa ni Yahweh na inyong Diyos para sa inyo sa Ehipto, sa harap mismo ng inyong mga mata?
  to: O, mayroon na bang sinumang diyos na nagtangkang pumunta at kumuha para sa sarili ng isang bansa mula sa gitna ng ibang bansa, sa pamamagitan ng mga pagsubok, mga tanda, mga kababalaghan, digmaan, ng isang makapangyarihang kamay, ng isang nakaunat na bisig, at ng mga dakilang gawang nakapangingilabot[a]—tulad ng lahat ng ginawa ni Yahweh na inyong Diyos para sa inyo sa Ehipto, sa harap mismo ng iyong mga mata?
  rationale: Inayos ang pangunahing parirala para sa מוֹרָאִים גְּדֹלִים upang maging likas sa Tagalog at upang ipakita ang katangian nitong mga gawang pumupukaw ng takot at pagkamangha, nang hindi isinasara ang alternatibong pagbasa na “mga sindak.” Ibinalik din ang isahang panghalip sa pangwakas na idyoma ayon sa Hebreo. Hindi binago ang kahulugan, retorikal na anyo, banal na pangalan, o pagkakaayos ng mga pangunahing elemento.
