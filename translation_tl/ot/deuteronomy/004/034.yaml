source:
  edition: WLC
  text: א֣וֹ הֲ/נִסָּ֣ה אֱלֹהִ֗ים לָ֠/בוֹא לָ/קַ֨חַת ל֣/וֹ גוֹי֮ מִ/קֶּ֣רֶב גּוֹי֒ בְּ/מַסֹּת֩ בְּ/אֹתֹ֨ת וּ/בְ/מוֹפְתִ֜ים וּ/בְ/מִלְחָמָ֗ה וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠/כֹל אֲשֶׁר עָשָׂ֨ה לָ/כֶ֜ם יְהוָ֧ה אֱלֹהֵי/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: tl
  text: O, mayroon na bang sinumang diyos na nagtangkang pumunta at kumuha para sa sarili ng isang bansa mula sa gitna ng ibang bansa, sa pamamagitan ng mga pagsubok, mga tanda, mga kababalaghan, digmaan, ng isang makapangyarihang kamay, ng isang nakaunat na bisig, at ng mga dakilang gawang nakapangingilabot[a]—tulad ng lahat ng ginawa ni Yahweh na inyong Diyos para sa inyo sa Ehipto, sa harap mismo ng iyong mga mata?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matitinding sindak” o “dakilang mga gawang pumupukaw ng takot at pagkamangha.” Ang Hebreong pananalita ay tumutukoy sa mga gawa o pangyayaring nagdudulot ng takot at pagkamangha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: mayroon na bang ... na nagtangkang
  rationale: Ipinahahayag ng pandiwa rito ang pagtatangka o pagsubok na gawin ang isang bagay. Ang “nagtangkang” ay natural sa makabagong Tagalog at hindi naglilihis sa karaniwang diwang “subukin ang isang tao.”
- source_word: אֱלֹהִים
  choice: sinumang diyos
  rationale: Sa retorikal na paghahambing, tumutukoy ito sa alinmang diyos, hindi tuwirang sa Diyos ng Israel; kaya maliit na titik at “sinuman” ang ginamit.
- source_word: לָבוֹא לָקַחַת
  choice: pumunta at kumuha
  rationale: Pinananatili nito ang sunod-sunod na kilos ng pagpunta at pagkuha nang hindi nagdaragdag ng hindi tiyak na sentrong deiktiko.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: isang bansa mula sa gitna ng ibang bansa
  rationale: Pinananatili ang kapansin-pansing pag-uulit at ang larawan ng pagkuha sa isang bayan mula sa loob ng isa pang bansa.
- source_word: בְּמַסֹּת
  choice: sa pamamagitan ng mga pagsubok
  rationale: Saklaw ng “mga pagsubok” ang mga pangyayaring sumusubok at humahatol kaugnay ng paglabas mula sa Ehipto, nang hindi ipinapakahulugang tukso.
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: mga tanda, mga kababalaghan
  rationale: Ang pares na ito ay malinaw at likas sa Tagalog para sa mga tandang may kahulugan at mga pambihirang gawang pumupukaw ng pagkamangha.
- source_word: וּבְמִלְחָמָה
  choice: digmaan
  rationale: Pinananatili ang tahasang larawang pandigma ng pagliligtas mula sa Ehipto.
- source_word: וּבְיָד חֲזָקָה
  choice: makapangyarihang kamay
  rationale: Likas itong Tagalog na katumbas ng nakapirming larawan ng kapangyarihan ng Diyos sa salaysay ng Exodo.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: nakaunat na bisig
  rationale: Malapit ito sa pisikal na metapora ng Hebreo at malinaw na nagpapahiwatig ng kapangyarihang kumikilos.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: mga dakilang kakila-kilabot na bagay
  rationale: Pinananatili nito ang posibilidad na tumukoy ang parirala sa mismong mga bagay o gawang nagdudulot ng sindak at pagkamangha; inilalahad sa talababa ang ibang natural na pagbasa.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: tulad ng lahat ng ginawa
  rationale: Malinaw nitong inuugnay ang retorikal na tanong sa kabuuan ng ginawa ni Yahweh sa Ehipto.
- source_word: לְעֵינֶיךָ
  choice: sa harap mismo ng inyong mga mata
  rationale: Isinasalin ang idyoma bilang tuwirang pagsaksi. Ang pangmaramihang “inyong” ay natural dahil ang Israel bilang sambayanan ang kinakausap sa konteksto.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים sa retorikal na paghahambing
  choice: sinumang diyos
  alternative: Diyos
  rationale: Inihahambing ng talata ang natatanging ginawa ni Yahweh sa magagawa ng alinmang diyos. Pinananatili ng “sinumang diyos” ang polemikal na lakas nang hindi ipinapalagay na ang tunay na Diyos ang simuno ng unang sugnay.
- issue: Paglilipat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Likas na kahulugan ng וּבְמוֹרָאִים גְּדֹלִים
  choice: mga dakilang kakila-kilabot na bagay
  alternative: matitinding sindak; dakilang mga gawang pumupukaw ng takot at pagkamangha
  rationale: Hindi nilulutas nang labis kung ang diin ay nasa mga kakila-kilabot na gawa o sa sindak na idinulot ng mga iyon; nililinaw ng talababa ang saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mahabang retorikal na tanong at ang magkakasunod na instrumentong parirala ng Hebreo, ngunit ginawang likas ang daloy sa Tagalog. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinatalakay nito.
