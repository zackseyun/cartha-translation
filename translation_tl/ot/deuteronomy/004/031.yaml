  text: כִּ֣י אֵ֤ל רַחוּם֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַשְׁחִיתֶ֑/ךָ וְ/לֹ֤א יִשְׁכַּח֙ אֶת בְּרִ֣ית אֲבֹתֶ֔י/ךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: tl
  text: Sapagkat si Yahweh na iyong Diyos ay Diyos na mahabagin[a]. Hindi ka niya pababayaan[b] o lilipulin o kalilimutan ang tipang isinumpa niya sa iyong mga ama[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Diyos na maawain.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi ka niya iiwan” o “hindi ka niya bibitiwan.”
    reason: lexical_alternative
  - marker: c
    text: O “iyong mga ninuno.” Literal na “mga ama mo”; tumutukoy ito sa mga patriarka, ang mga amang ninuno ng Israel.
    reason: lexical_and_historical_clarification
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang tagubilin o babala at pinananatili ang paliwanag na ugnayan sa konteksto.
- source_word: אֵל רַחוּם
  choice: Diyos na mahabagin
  rationale: Ang רַחוּם ay tumutukoy sa habag o awa. Likas at marangal sa modernong Filipino ang “mahabagin” at malinaw nitong ipinahahayag ang mapagkalingang awa ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang pang-isahang tuwirang pakikipag-usap at ang ugnayang tipan sa Israel.
- source_word: לֹא יַרְפְּךָ
  choice: hindi ka niya pababayaan
  rationale: Sa Hiphil, ang רפה rito ay nangangahulugang hindi bibitiwan, iiwan, o pababayaan. Ang “pababayaan” ay malinaw at natural sa Filipino.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: o lilipulin
  rationale: Ang Hiphil ng שׁחת ay nagpapahayag ng pagwasak o paglipol; ang “lilipulin” ay tuwiran at angkop sa babalang pangtipan.
- source_word: וְלֹא יִשְׁכַּח אֶת־בְּרִית
  choice: at hindi niya kalilimutan ang tipan
  rationale: Pinananatili ang mahalagang larawan ng Diyos na hindi nakakalimot sa kanyang tipan, sa halip na palambutin ito bilang pagpapabaya lamang.
- source_word: אֲבֹתֶיךָ
  choice: iyong mga ninuno
  rationale: Natural sa modernong Filipino ang “mga ninuno.” Nililinaw sa talababa na literal na “mga ama” ang Hebreo at tumutukoy sa mga amang pinagmulan ng Israel na tumanggap ng tipan.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: na ipinangako niya sa kanila nang may panunumpa
  rationale: Ipinahahayag nito nang natural sa Filipino ang solemneng panunumpa ng נשבע at ang kaugnayan nito sa tipan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Sanggunian ng אֲבֹתֶיךָ sa kasaysayan ng tipan
  choice: mga ninuno, na may talababa tungkol sa literal na “mga ama”
  alternative: mga ama
  rationale: Mas natural at hindi malabo sa karaniwang Filipino ang “mga ninuno,” habang pinananatili ng talababa ang panlalaking anyo at ang tiyak na pagtukoy sa mga amang pinagmulan ng Israel.
- issue: Katiyakan ng mga pandiwang may לֹא
  choice: hindi ka niya pababayaan o lilipulin, at hindi niya kalilimutan
  alternative: huwag ka niyang pabayaan o lipulin; huwag niyang kalimutan
  rationale: Ang anyo at konteksto ay nagbibigay ng matibay na pangakong deklaratibo tungkol sa katapatan ng Diyos, hindi isang pakiusap o utos.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang pang-isahang “iyo/ka” ayon sa Hebreo. Iniwasan ang labis na makalumang pananalita, ngunit pinanatili ang solemneng bokabularyo ng tipan at panunumpa.
