lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Ipinakikita ng pang-abay ang kasunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos” sa makabagong Filipino.
- source_word: יַבְדִּיל
  choice: ibinukod
  rationale: Ang Hiphil ng בדל ay tumutukoy sa pagpapahiwalay o pagtatalaga para sa isang layunin. Napananatili ng “ibinukod” ang dalawang diwang ito nang hindi labis na ipinapaliwanag ang gamit ng mga lungsod.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
- source_word: שָׁלֹשׁ עָרִים
  choice: tatlong lungsod
  rationale: Tuwirang salin ng bilang at pangngalan; ang “lungsod” ay dignified at madaling maunawaan.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Karaniwang heograpikong idyoma ito para sa pook sa kabilang panig ng Jordan. Pinananatili ng salin ang pananaw na nakapaloob sa Hebreo habang kinikilala sa talababa na maaaring mag-iba ang eksaktong punto de bista.
- source_word: מִזְרְחָה שָׁמֶשׁ
  choice: sa dakong sinisikatan ng araw
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreo—ang dako ng pagsikat ng araw—at natural pa rin sa Filipino; tumutukoy ito sa silangan.
