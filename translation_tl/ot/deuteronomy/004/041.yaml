  text: Then Moses set apart three cities beyond the Jordan[a], toward the sunrise[b],
translation:
  language: tl
  text: Pagkatapos, ibinukod ni Moises ang tatlong lungsod sa kabila ng Jordan[a], sa dakong sinisikatan ng araw[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kabilang panig ng Jordan.” Isang heograpikong idyoma ang Hebreong pananalita, at nakasalalay sa pananaw ng nagsasalaysay ang eksaktong pagkakasabi nito.
    reason: lexical_alternative
