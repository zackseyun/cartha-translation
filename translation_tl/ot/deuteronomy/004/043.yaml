  terminology: Ang “lipi ni Ruben/Gad/Manases” ay natural na katumbas ng distributibong pang-isahang gentiliko sa Hebreo. Ang mga pangalang Bezer, Ramot, Gilead, Golan, at Bashan ay pinanatili nang pare-pareho sa draft.
