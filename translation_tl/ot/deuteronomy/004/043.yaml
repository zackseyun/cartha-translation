base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: tl
  text: ang Bezer sa ilang, sa lupain ng mataas na kapatagan[a], para sa lipi ni Ruben; ang Ramot sa Gilead, para sa lipi ni Gad; at ang Golan sa Bashan, para sa lipi ni Manases.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa lupain ng kapatagan.” Ang terminong Hebreo ay tumutukoy sa patag o mataas na lupain; ginamit ang “mataas na kapatagan” upang ipahiwatig ang talampas na lupain sa silangan ng Jordan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Pangalan ng lugar; tinumbasan sa karaniwang anyong transliterado sa Filipino.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay tumutukoy sa ilang o bukás at di-nilinang na lupa; natural at dignified ang “sa ilang” sa Filipino.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: sa lupaing talampas
  rationale: Ang מִישֹׁר ay patag o halos patag na lupain, at sa kontekstong Transjordan ay isang mataas na kapatagan o talampas; iniiwasan ng “talampas” ang posibleng maling pahiwatig na mababang kapatagan.
- source_word: לָרֻאוּבֵנִי
  choice: para sa lipi ni Ruben
  rationale: Bagaman pang-isahang katawagang panlipi ang Hebreo, distributibo ang gamit nito; mas malinaw at natural sa Filipino ang “lipi ni Ruben.”
- source_word: רָאמֹת
  choice: Ramot
  rationale: Pangalan ng lugar; isina-Filipinong transliterasyon na tumutugma sa tunog ng Hebreo.
- source_word: בַּגִּלְעָד
  choice: sa Gilead
  rationale: Pangalan ng rehiyon; pinanatili bilang transliterasyon.
- source_word: לַגָּדִי
  choice: para sa lipi ni Gad
  rationale: Ipinahahayag nang natural ang distributibong katawagang panlipi sa Hebreo.
- source_word: גּוֹלָן
  choice: Golan
  rationale: Pangalan ng lugar; transliterado.
- source_word: בַּבָּשָׁן
  choice: sa Bashan
  rationale: Pangalan ng rehiyon; transliterado.
- source_word: לַמְנַשִּׁי
  choice: para sa lipi ni Manases
  rationale: Ipinahahayag ang katawagang panlipi sa malinaw na modernong Filipino, kasabay ng pagpapanatili sa tatluhang paralelismo.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: '[hindi hiwalay na isinalin; ipinakita sa sunod-sunod na talaan]'
  rationale: Walang tuwirang katumbas sa Filipino ang pananda ng tuwirang layon; ipinakikita ang tungkulin nito sa ayos at bantas ng tatlong pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lipi ni” sa halip na isang di-natural na pang-isahang demonym. Pinanatili ang anyong fragmentaryo ng talata dahil ipinagpapatuloy nito ang pangungusap mula sa naunang talata.
