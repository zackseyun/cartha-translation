base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: tl
  text: upang palayasin sa harap mo ang mga bansang higit na malalaki at makapangyarihan kaysa sa iyo[a], upang dalhin ka roon at ibigay sa iyo ang kanilang lupain bilang mana, gaya ng kalagayan ngayon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alisan ng lupain” o “pangyarihing magmana sa pamamagitan ng pagpapaalis.” Saklaw ng pandiwang Hebreo ang pagpapaalis sa mga dating naninirahan upang matanggap ng iba ang lupain.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “gaya ng araw na ito,” isang idyomang nangangahulugang “gaya ng malinaw ngayon” o “gaya ng kalagayan sa kasalukuyan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: upang palayasin
  rationale: Sa Hiphil, tumutukoy ito sa pagpapaalis o pag-aalis sa mga dating naninirahan. Dahil mga bansa ang layon, malinaw at natural ang “palayasin,” habang pinananatili ang diwang may inaalis upang maibigay ang lupain sa iba.
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Karaniwang kahulugan nito ang mga bansa o mga bayan; ang “mga bansa” ay angkop sa heopolitikal na konteksto ng Deuteronomio.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: higit na malaki at makapangyarihan kaysa sa iyo
  rationale: Ipinahahayag ng parirala ang paghahambing sa laki at lakas ng mga bansa kaugnay ng Israel. Ang “makapangyarihan” ay natural sa kontekstong militar at pampolitika.
- source_word: מִפָּנֶיךָ
  choice: sa harap mo
  rationale: Pinananatili nito ang Hebreong idyomang tumutukoy sa pag-aalis sa mga bansa mula sa harapan o kinaroroonan ng Israel.
- source_word: לַהֲבִיאֲךָ
  choice: upang ipasok ka
  rationale: Ang causative na anyo ng בוא ay tumutukoy sa pagdadala sa Israel papasok sa lupain; natural sa Filipino ang “ipasok ka,” at nililinaw ng kasunod na sugnay ang hantungan.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: ibigay sa iyo ang kanilang lupain
  rationale: Tuwirang inilalarawan nito ang lupain bilang kaloob sa Israel at pinananatili ang malinaw na ugnayan ng pandiwa, tumatanggap, at layon.
- source_word: נַחֲלָה
  choice: bilang mana
  rationale: Ang “mana” ay maikli, natural, at nagpapanatili sa mahalagang diwa ng lupaing ipinagkaloob bilang minanang pag-aari.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng nangyayari sa araw na ito
  rationale: Ipinahihiwatig ng Deuteronomikong idyoma ang kasalukuyang kalagayang nakikita o napatutunayan. Ang salin ay mas natural kaysa sa literal na “gaya ng araw na ito” habang may talababa para sa anyong Hebreo.
theological_decisions:
- issue: Terminong pangtipan para sa lupa sa נַחֲלָה
  choice: bilang mana
  alternative: bilang pag-aari
  rationale: Pinananatili ng “mana” ang diwa ng lupa bilang kaloob ng Diyos at minanang bahagi ng Israel, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang sunod-sunod na layunin ng mga infinitive at ang imaheng “sa harap mo.” Ginamit ang isahang “mo/iyo/ka” sapagkat isahan ang mga hulaping Hebreo, na kolektibong tumutukoy sa Israel.
