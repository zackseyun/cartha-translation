  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: tl
  text: Huwag kayong magdagdag sa salitang iniuutos ko sa inyo, ni magbawas man dito, upang sundin ninyo ang mga utos ni Yahweh[a] na inyong Diyos na iniuutos ko sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; kinaugaliang isalin na “PANGINOON.”'
    reason: Ipinababatid ang anyong Hebreo ng banal na pangalan at ang tradisyonal na pamalit na salin, nang hindi inuulit ang “Yahweh” na nasa pangunahing teksto na.
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: magdagdag sa
  rationale: Tuwirang ipinapahayag ang pagdaragdag sa isang umiiral nang kapahayagan at natural itong katambal ng “magbawas ... dito.”
- source_word: הַדָּבָר
  choice: ang salita
  rationale: Maaaring mangahulugang “salita,” “bagay,” o “usapin” ang דָּבָר. Dito, tumutukoy ito sa kabuuan ng ipinahahayag na utos ni Moises; pinananatili ng “ang salita” ang isahang anyo at ang diwa ng binigkas na mensahe.
- source_word: מְצַוֶּה
  choice: iniuutos ko
  rationale: Ipinahihiwatig ng participle ang kasalukuyan at nagpapatuloy na pagsasalita sa tagpong ito. Natural sa Filipino ang “iniuutos ko” at pinananatili rin nito ang pag-uulit sa Hebreo.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: magbawas man dito
  rationale: Ang גָּרַע ay nangangahulugang bawasan o alisin ang bahagi ng isang bagay. Ang “magbawas ... dito” ay malinaw at likas na kasalungat ng “magdagdag sa.”
- source_word: לִשְׁמֹר
  choice: upang sundin ninyo
  rationale: Ang infinitive na may לְ ay nagpapahayag dito ng layunin. Sa konteksto ng mga utos, natural na katumbas ng “ingatan/tuparin” ang “sundin,” habang malinaw na ipinapakita ng “upang” ang ugnayang panlayon.
- source_word: מִצְוֺת
  choice: mga utos
  rationale: Ang maramihang “mga utos” ay malinaw, dignipikado, at karaniwang gamit sa makabagong Filipino para sa mga tuntuning tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Sa pormulang tipan kasama ng YHWH, isahan ang tinutukoy ng אֱלֹהִים. Ang “inyong Diyos” ay tumpak at natural sa Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton YHWH. Pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo, samantalang kinikilala sa talababa ang tradisyonal na pamalit na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang isahang “salita,” ang magkatapat na pagbabawal na magdagdag at magbawas, at ang pag-uulit ng “iniuutos ko sa inyo” mula sa Hebreo.
