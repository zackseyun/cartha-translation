  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: tl
  text: At ito ang kautusang iniharap ni Moises sa mga anak ni Israel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita” o “sambayanan ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: At ito ang
  rationale: Pinananatili ng “At” ang pagkakaugnay sa naunang bahagi, habang likas sa Tagalog ang panimulang “ito ang” bilang pagpapakilala sa susunod na seksiyon.
- source_word: הַתּוֹרָה
  choice: kautusan
  rationale: Maaaring tumukoy ang תּוֹרָה sa pagtuturo o tagubilin, ngunit dito ay nagsisilbi itong pamagat para sa kautusang pangtipan na iniharap ni Moises. Ang “kautusan” ay malinaw, pamilyar, at angkop sa konteksto.
- source_word: שָׂם ... לִפְנֵי
  choice: inilagay ... sa harap ng
  rationale: Tuwirang pinananatili nito ang larawan ng paglalagay o paghaharap ng kautusan sa harap ng bayan, at natural pa rin sa marangal na modernong Tagalog.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang anyo at tradisyonal na larawan ng Hebreong pambansang katawagan, habang nauunawaan pa rin bilang tumutukoy sa sambayanan ng Israel.
theological_decisions:
- issue: Ang may kasariang pambansang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Ang parirala ay isang nakaugaliang katawagang pangtipan at pambansa. Pinananatili ng salin ang literal na ugnayang pampamilya ng Hebreo nang hindi nililimitahan ang tinutukoy sa mga lalaking indibidwal lamang; nililinaw ng talababa ang kolektibong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kautusan” sa halip na transliterasyong “Torah,” at pinanatili ang “mga anak ni Israel” kasama ang mas idiomatikong mga alternatibo sa talababa.
