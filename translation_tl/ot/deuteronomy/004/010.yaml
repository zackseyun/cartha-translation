  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: tl
  text: Noong araw na tumayo kayo sa harap ni Yahweh na inyong Diyos sa Horeb, nang sabihin sa akin ni Yahweh, “Tipunin mo para sa akin ang bayan, at iparirinig ko sa kanila ang aking mga salita, upang matuto silang matakot sa akin sa lahat ng araw na nabubuhay sila sa ibabaw ng lupa[a], at ituro nila sa kanilang mga anak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lupain.” Ang Hebreong אֲדָמָה ay maaaring tumukoy sa lupa o daigdig sa pangkalahatan, o sa isang tiyak na lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: nang araw na
  rationale: Pinananatili ang temporal na pagtukoy sa isang partikular na pangyayaring ginugunita at natural ito sa daloy ng mas malawak na pangungusap.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: tumayo kayo sa harap ni
  rationale: Pinananatili ang kongkretong larawan ng Israel na nakatayo sa presensiya ng Diyos; ang isahang Hebreong 'ikaw' ay kolektibong tumutukoy sa Israel, kaya likas sa Filipino ang magalang at pangmaramihang 'kayo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Pinananatili ang relasyong tipan na ipinahahayag ng hulaping paari at umaayon sa kolektibong 'kayo.'
- source_word: בְּחֹרֵב
  choice: sa Horeb
  rationale: Ito ang natural na panandang panlunan sa Filipino para sa pangalan ng lugar.
- source_word: הַקְהֶל לִי אֶת הָעָם
  choice: Tipunin mo ang mga tao sa harap ko
  rationale: Ang Hiphil ay utos na pagsama-samahin ang bayan. Ang 'sa harap ko' ay natural na naghahayag ng pagtitipon tungo sa presensiya ng Diyos.
- source_word: וְאַשְׁמִעֵם
  choice: at iparirinig ko sa kanila
  rationale: Ang anyong Hiphil ng שמע ay causative, kaya pinananatili ng 'iparirinig' ang diwang 'pangyayaring marinig nila.'
- source_word: דְּבָרָי
  choice: ang aking mga salita
  rationale: Pinananatili ang tahasang maramihang anyo at ang pagtukoy sa mga sinalitang pahayag ng Diyos.
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: upang matuto silang matakot sa akin
  rationale: Malinaw na ipinahahayag ang layunin at pinananatili ang bigat at tensiyong teolohikal ng ירא, na higit sa simpleng paggalang.
- source_word: כָּל־הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: habang nabubuhay sila
  rationale: Natural na Filipino para sa buong panahong saklaw ng kanilang buhay, nang hindi binabago ang diwa ng panghabambuhay na tagal.
- source_word: עַל־הָאֲדָמָה
  choice: sa ibabaw ng lupa
  rationale: Pinananatili ang malawak na kahulugan ng אֲדָמָה bilang lupa o daigdig, habang kinikilala sa talababa ang posibleng mas tiyak na 'lupain.'
- source_word: וְאֶת־בְּנֵיהֶם יְלַמֵּדוּן
  choice: at maituro nila ito sa kanilang mga anak
  rationale: Ang 'mga anak' ay angkop sa kontekstuwal na kahulugan ng בנים bilang mga supling. Ang 'ito' ay natural na tumutukoy sa narinig at natutuhang mga salita at sa pagkatakot kay Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ang personal na pangalang Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng ירא sa konteksto ng tipan
  choice: matakot sa akin
  alternative: gumalang sa akin; magpitagan sa akin
  rationale: Pinananatili ng 'matakot' ang saklaw ng takot, pagpipitagan, at masunuring pagkilala sa Diyos nang hindi pinapahina o nilulutas ang tensiyon ng salita.
- issue: Saklaw ng בנים
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Bagaman morpolohikal na panlalaki ang anyo, tumutukoy ito rito sa mga supling sa pangkalahatan; hindi hinihingi ng konteksto ang eksklusibong panlalaking pagbasa.
- issue: Tinukoy na bagay sa 'maituro nila ito'
  choice: ito
  alternative: matakot sa akin; ang aking mga salita
  rationale: Hindi tahasang inuulit sa Hebreo ang layon ng huling pandiwa. Ang 'ito' ay nagpapanatili ng sapat na lawak upang tumukoy sa mga salita ng Diyos at sa natutuhang pagkatakot sa kanya, sa halip na limitahan sa isa lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang kolektibong 'kayo/inyong' para sa isahang Hebreong pantukoy sa Israel, ngunit pinanatili ang isahang 'mo' sa utos kay Moises. Iniwasan ang sobrang teknikal at denominasyonal na pananalita.
