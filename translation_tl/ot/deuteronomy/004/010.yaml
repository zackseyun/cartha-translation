revisions:
- from: nang araw na tumayo kayo sa harap ni Yahweh na inyong Diyos sa Horeb, nang sabihin sa akin ni Yahweh, “Tipunin mo ang mga tao sa harap ko, at iparirinig ko sa kanila ang aking mga salita, upang matuto silang matakot sa akin habang nabubuhay sila sa ibabaw ng lupa[a] at maituro nila ito sa kanilang mga anak.”
  to: Noong araw na tumayo kayo sa harap ni Yahweh na inyong Diyos sa Horeb, nang sabihin sa akin ni Yahweh, “Tipunin mo para sa akin ang bayan, at iparirinig ko sa kanila ang aking mga salita, upang matuto silang matakot sa akin sa lahat ng araw na nabubuhay sila sa ibabaw ng lupa[a], at ituro nila sa kanilang mga anak.”
  rationale: Inayos ang pambungad para sa natural na Filipino, ibinalik ang kahulugan ng לִי bilang “para sa akin,” at tahasang isinalin ang “sa lahat ng araw.” Ang huling layon ng “ituro” ay hindi idinagdag upang mapanatili ang sintaktikong lawak ng Hebreo; sa Filipino, nauunawaan ito mula sa naunang mga salita ni Yahweh at sa pagkatakot sa kanya.
