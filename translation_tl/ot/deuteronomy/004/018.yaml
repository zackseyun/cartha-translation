  yaml_path: translation/ot/deuteronomy/004/018.yaml
  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: tl
  text: ang anyo[a] ng anumang gumagapang sa lupa, ang anyo ng anumang isdang nasa tubig sa ilalim ng lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “wangis” o “larawan” para sa “anyo” (Hebreo: תַּבְנִית).'
    reason: lexical_alternative
  - marker: b
    text: Ang “sa ilalim ng lupa” ay umaalingawngaw sa nakagawiang pananalita ng Bibliya tungkol sa mga tubig na nasa ibaba ng lupain; ihambing ang pagbabawal sa paggawa ng larawan sa Exodo 20:4.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: anyo
  rationale: Sa konteksto ng pagbabawal sa paggawa ng mga representasyon, tumutukoy ito sa nakikitang hugis o wangis. Pinananatili ng “anyo” ang lawak ng salitang Hebreo nang hindi ito nililimitahan sa isang inukit na larawan.
- source_word: כָּל
  choice: anumang
  rationale: Ipinahahayag ng “anumang” ang distributibong diwa ng Hebreo at likas itong gamitin sa isang pagbabawal na sumasaklaw sa bawat uri o halimbawa.
- source_word: רֹמֵשׂ
  choice: gumagapang
  rationale: Tumutukoy ang pandiwaring Hebreo sa mga nilalang na kumikilos o gumagapang sa ibabaw ng lupa. Ang “gumagapang” ay malinaw at karaniwan sa makabagong Filipino.
- source_word: בָּאֲדָמָה
  choice: sa lupa
  rationale: Dito, ang אֲדָמָה ay ang lupa o ibabaw ng lupang kinaroroonan ng mga gumagapang na nilalang.
- source_word: דָּגָה
  choice: isda
  rationale: Kolektibo ang gamit ng pangngalang Hebreo; maaari ring gamitin nang pangkalahatan ang “isda” sa Filipino pagkatapos ng “anumang.”
- source_word: אֲשֶׁר בַּמַּיִם
  choice: na nasa tubig
  rationale: Pinananatili ang tahasang sugnay na panlarawan. Mas natural sa Filipino ang kolektibong “tubig” kaysa sa literal na pangmaramihang anyo.
- source_word: מִתַּחַת לָאָרֶץ
  choice: sa ilalim ng lupa
  rationale: Pinananatili nito ang sinaunang pormulang pangkosmolohiya at ang pagkakatulad sa pananalita ng Exodo 20:4, nang hindi ito binibigyan ng makabagong paliwanag sa loob ng teksto.
theological_decisions:
- issue: Pananalita tungkol sa mga representasyon sa konteksto ng idolatriya
  choice: ang anyo ng anumang…
  alternative: ang wangis ng anumang… / larawan ng anumang…
  rationale: Sapat na ipinahihiwatig ng konteksto ang pagbabawal sa paggawa ng mga representasyon. Hindi idinaragdag ang “diyus-diyosan,” sapagkat wala iyon sa talata, at hindi nililimitahan ng “anyo” ang tinutukoy sa isang partikular na uri ng larawan o rebulto.
- issue: Ang mga tubig “sa ilalim ng lupa”
  choice: sa ilalim ng lupa
  alternative: sa ibaba ng lupain
  rationale: Pinananatili ang tunay na sinaunang paglalarawan at ang ugnay nito sa pormula ng pagbabawal sa paggawa ng larawan, sa halip na tahimik na iayon ito sa makabagong kosmolohiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anumang gumagapang” at “anumang isda” bilang likas na kolektibong pananalita, habang pinanatili ang pag-uulit ng “ang anyo” at ang sinaunang pariralang “sa ilalim ng lupa.”
