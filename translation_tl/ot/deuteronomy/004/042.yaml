base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/042.yaml
  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: tl
  text: upang ang sinumang nakapatay sa kaniyang kapwa nang hindi sinasadya[a], nang hindi niya nalalaman, at hindi niya ito kinapopootan noon[b] ay makatakas doon sa isa sa mga lunsod na ito at manatiling buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nang walang kaalaman.” Sa kontekstong legal, tumutukoy ito sa pagpatay na hindi niya namamalayan o hindi sinasadya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula kahapon o noong isang araw,” isang idyomang nangangahulugang “dati” o “noon pa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: upang makatakas doon
  rationale: Ang infinitibong may ל ay nagpapahayag ng layunin kaugnay ng pagtatalaga sa mga lunsod sa naunang talata.
- source_word: רוֹצֵחַ אֲשֶׁר יִרְצַח
  choice: ang sinumang nakapatay
  rationale: Sa konteksto ng mga lunsod-kanlungan, hindi awtomatikong nangangahulugang mamamatay-taong may masamang hangarin ang termino. Ang “nakapatay” ay malinaw at hindi paunang humahatol sa pagkakasala.
- source_word: רֵעֵהוּ
  choice: sa kapwa
  rationale: Natural na salin ng רֵעַ sa legal at panlipunang kontekstong ito ang “kapwa.”
- source_word: בִּבְלִי דַעַת
  choice: nang di sinasadya, nang hindi nalalaman
  rationale: Pinananatili ng dalawang parirala kapwa ang legal na diwa ng di-sinasadyang pagpatay at ang literal na sangkap na “walang kaalaman,” nang hindi ipinapalagay na tumutukoy ito sa naunang kaalaman.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: at hindi naman niya ito kinapopootan
  rationale: Ang “kinapopootan” ay naglalarawan ng nagpapatuloy na disposisyon na ipinahihiwatig ng participle שֹׂנֵא.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: noon
  rationale: Ang idyoma ay tumutukoy sa dating panahon o dati nang kalagayan; natural itong naipahahayag sa Filipino bilang “noon,” habang inilalagay sa talababa ang literal na anyo.
- source_word: אֶל אַחַת מִן הֶעָרִים הָאֵל
  choice: sa isa sa mga lunsod na ito
  rationale: Pinananatili ng “ito” ang malapit na pantukoy ng Hebreo at ang tuwirang pagtukoy sa mga lunsod na binanggit.
- source_word: וָחָי
  choice: at manatiling buhay
  rationale: 'Malinaw na ipinahahayag nito ang bunga ng matagumpay na pagtakas: maliligtas at mapananatili ang buhay ng nakapatay.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakapatay” sa halip na “mamamatay-tao” upang huwag ipahiwatig agad ang sadyang pagpaslang. Hinati sa dalawang pangungusap upang maging natural at madaling maunawaan nang hindi binabago ang ugnayang layunin at resulta.
