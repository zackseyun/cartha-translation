  text: כִּ֣י אָנֹכִ֥י מֵת֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את אֵינֶ֥/נִּי עֹבֵ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֙ עֹֽבְרִ֔ים וִֽ/ירִשְׁתֶּ֕ם אֶת הָ/אָ֥רֶץ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: tl
  text: Sapagkat mamamatay na ako sa lupaing ito[a]; hindi ako tatawid sa Jordan. Ngunit kayo ay tatawid at aangkinin ninyo ang mabuting lupaing ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mamamatay ako sa lupaing ito.” Maaaring magpahiwatig ang participle sa Hebreo ng isang nalalapit na pangyayari.
    reason: lexical_alternative
  - marker: b
    text: O “mamamanahin ninyo ang mabuting lupaing ito.” Ang pandiwa sa Hebreo ay maaaring tumukoy sa pag-angkin sa lupain bilang mana.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng naunang babala at pangaral.
- source_word: אָנֹכִי מֵת
  choice: mamamatay ako
  rationale: Ang participle ay tumutukoy sa nalalapit na pagkamatay ni Moises. Mas natural sa modernong Tagalog ang hinaharap na anyo, habang inilalagay sa talababa ang mas lantad na diwa ng pagiging nalalapit.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: sa lupaing ito
  rationale: Pinananatili ng “lupain” ang mahalagang bokabularyo ng Deuteronomio tungkol sa lupa at pag-aangkin dito.
- source_word: אֵינֶנִּי עֹבֵר
  choice: hindi ako tatawid
  rationale: Ipinahahayag ng negatibo at participle ang tiyak na hindi mangyayaring pagtawid ni Moises; natural itong sabihin sa Tagalog sa anyong hinaharap.
- source_word: אֶת הַיַּרְדֵּן
  choice: sa Jordan
  rationale: Karaniwang sapat sa Tagalog ang pangalang “Jordan”; malinaw sa konteksto na ilog ang tinutukoy.
- source_word: וְאַתֶּם עֹבְרִים
  choice: Ngunit kayo ay tatawid
  rationale: 'Bagaman karaniwang “at” ang pangatnig, malinaw na pagsalungat ang ugnayan: hindi tatawid si Moises, ngunit tatawid ang Israel.'
- source_word: וִירִשְׁתֶּם
  choice: aangkinin ninyo
  rationale: Saklaw ng pandiwa ang pagkuha at pagtataglay sa lupa bilang ipinagkaloob na mana; ang “aangkinin” ay maikli at natural nang hindi lubos na inaalis ang pahiwatig ng mana.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: ang mabuting lupaing ito
  rationale: Tuwirang pinananatili ang pagpapahalagang “mabuti” at ang pantukoy na “ito,” isang mahalagang parirala sa Deuteronomio.
theological_decisions:
- issue: Diwa ng ירשׁ bilang pag-aangkin o pagmamana
  choice: aangkinin ninyo
  alternative: mamanahin ninyo
  rationale: Hindi ipinipilit ng salin ang isang teolohikal na pagbasa lamang. Inilalahad sa talababa na maaaring isalin bilang pagmamana sapagkat kapwa saklaw ng pandiwa ang pagkuha ng pag-aari at ang pagtanggap nito bilang mana.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “lupain” upang mapanatili ang bokabularyong pangako at pag-aari sa Deuteronomio; iniwasan ang labis na pormal o lipas na mga anyo.
