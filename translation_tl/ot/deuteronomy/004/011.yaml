id: DEU.4.11
reference: Deuteronomy 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תִּקְרְב֥וּ/ן וַ/תַּֽעַמְד֖וּ/ן תַּ֣חַת הָ/הָ֑ר וְ/הָ/הָ֞ר בֹּעֵ֤ר בָּ/אֵשׁ֙ עַד לֵ֣ב הַ/שָּׁמַ֔יִם חֹ֖שֶׁךְ עָנָ֥ן וַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: tl
  text: At lumapit kayo at tumayo sa paanan ng bundok, habang nagliliyab sa apoy ang bundok hanggang sa puso ng kalangitan[a]—dilim, ulap, at makapal na karimlan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hanggang sa gitna ng langit.” Literal na sinasabi sa Hebreo na “hanggang sa puso ng kalangitan,” isang idyoma para sa gitna o kaitaasan ng langit.
    reason: lexical_alternative
  - marker: b
    text: O, “matinding kadiliman” o “malalim na dilim” para sa “makapal na karimlan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: lumapit kayo
  rationale: Ang Qal wayyiqtol na ikalawang panauhang maramihan ng קרב ay tumutukoy sa paglapit. Likas at tuwiran sa modernong Tagalog ang “lumapit kayo.”
- source_word: וַתַּעַמְדוּן
  choice: tumayo
  rationale: Payak na kahulugan ng עמד ang pagtayo; malinaw nitong ipinagpapatuloy ang sunod-sunod na kilos sa salaysay.
- source_word: תַּחַת הָהָר
  choice: sa paanan ng bundok
  rationale: Bagaman literal na “sa ilalim ng bundok” ang תַּחַת הָהָר, sa kontekstong heograpiko ay tumutukoy ito sa bahaging nasa ibaba o paanan ng bundok.
- source_word: וְהָהָר
  choice: habang ... ang bundok
  rationale: Ginawang pang-abay na pangyayari ang pang-ugnay upang likas na maipakita sa Tagalog na ang pagliliyab ng bundok ang kalagayang kasabay ng pagtayo ng bayan.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: nagliliyab sa apoy
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na kalagayan. Pinananatili ng “nagliliyab sa apoy” ang matingkad na larawan at ang tahasang pagbanggit sa apoy.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: hanggang sa puso ng kalangitan
  rationale: Literal na “puso” ang לֵב at idyomatikong tumutukoy sa gitna o kaitaasan. Pinananatili ng salin ang Hebreong larawan, samantalang nililinaw sa talababa ang kahulugan nito.
- source_word: הַשָּׁמַיִם
  choice: kalangitan
  rationale: Karaniwang tumutukoy ang anyong maramihan sa langit o himpapawid. Ang “kalangitan” ay marangal at likas sa Tagalog at hindi nililimitahan ang larawan sa karaniwang lagay ng panahon.
- source_word: חֹשֶׁךְ
  choice: dilim
  rationale: Tuwirang katumbas na bumubuo sa tatluhang paglalarawan ng pagpapakita ng Diyos.
- source_word: עָנָן
  choice: ulap
  rationale: Tuwirang katumbas; likas sa Tagalog ang pang-isahang anyo bilang kolektibong paglalarawan.
- source_word: וַעֲרָפֶל
  choice: makapal na karimlan
  rationale: Tumutukoy ang עֲרָפֶל sa masinsin at nakatatakip na kadiliman. Ibinubukod ito ng “makapal na karimlan” sa naunang חֹשֶׁךְ na isinaling “dilim.”
theological_decisions:
- issue: Paglalarawan sa pagpapakita ng Diyos sa Sinai
  choice: Panatilihin ang kongkreto at kakila-kilabot na mga larawang apoy, dilim, ulap, at makapal na karimlan.
  alternative: Gawing pangkalahatang paglalarawan lamang ng masamang lagay ng panahon ang mga huling salita.
  rationale: Inilalarawan ng talata ang isang banal na pagpapakita, hindi lamang pangkaraniwang penomenong pangkalikasan. Pinananatili ng salin ang bigat at magkakapatong na larawan nang hindi nagdaragdag ng paliwanag na doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang matingkad na Hebreong larawang “puso ng kalangitan,” na sinamahan ng talababa upang maunawaan ng karaniwang mambabasa. Ginamit ang em dash upang mapanatili ang bigat ng pangwakas na tatluhang paglalarawan.
