  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: tl
  text: baka kayo ay kumilos nang masama at gumawa para sa inyong sarili ng larawang inukit[a], sa anyo ng anumang larawan, na kawangis ng lalaki o babae—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “baka pasamain ninyo ang inyong sarili at gumawa para sa inyong sarili ng larawang inukit, isang anyo ng anumang larawan, na kawangis ng lalaki o babae.”'
    reason: Ipinapakita ang posibleng mas reflexive na pagbasa sa תַּשְׁחִתוּן at ang mas pormal na paghahanay ng magkakapatong na terminong tumutukoy sa larawan at anyo.
lexical_decisions:
- source_word: פֶּן
  choice: upang hindi
  rationale: Nagpapahayag ito ng babala laban sa isang di-kanais-nais na bunga; natural sa Tagalog ang “upang hindi” sa kaugnayang ito.
- source_word: תַּשְׁחִתוּן
  choice: gumawa ng kasamaan
  rationale: Ang Hiphil ng שׁחת dito ay tumutukoy sa masama at mapanirang pagkilos sa pagsuway; malinaw at likas sa karaniwang Tagalog ang pariralang ito.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: gumawa para sa inyong sarili
  rationale: Pinananatili ang benefactive/reflexive na diwa ng לָכֶם, na mahalaga sa pagbabawal sa sariling gawang imahen.
- source_word: פֶּסֶל
  choice: larawang inukit
  rationale: Tiyak na tumutukoy sa imaheng hinubog o inukit; mas eksakto ito kaysa sa pangkalahatang “diyus-diyosan.”
- source_word: תְּמוּנַת כָּל סָמֶל
  choice: na may anumang anyo
  rationale: Inilalahad ang magkakaugnay na mga terminong tumutukoy sa anyo o representasyon nang hindi agad nililimitahan ang סמל sa isang tahasang diyus-diyosan.
- source_word: תַּבְנִית
  choice: na kawangis ng
  rationale: Nagpapahiwatig ng modelo, padron, o pagkakahawig; natural itong nagpapakilala sa kasunod na “lalaki o babae.”
- source_word: זָכָר אֹו נְקֵבָה
  choice: lalaki o babae
  rationale: Ito ang likas na modernong Tagalog para sa magkapares na terminong tumutukoy sa kasariang lalaki at babae sa kontekstong ito.
theological_decisions:
- issue: Paglalarawan sa ipinagbabawal na imahen
  choice: Panatilihin ang kongkretong “larawang inukit” at ang mas malawak na “anumang anyo.”
  alternative: Isalin ang parehong termino bilang “diyus-diyosan” o “imahen.”
  rationale: Pinananatili nito ang pagsasalansan ng magkakaugnay ngunit hindi ganap na magkaparehong mga terminong Hebreo, nang hindi labis na pinakikitid ang סמל o pinapantay ang lahat ng salita.
- issue: Diwa ng תַּשְׁחִתוּן
  choice: gumawa ng kasamaan
  alternative: sirain ninyo ang inyong sarili
  rationale: Pinananatili ang aktibong moral na diwa ng pandiwa sa konteksto ng pagsuway, samantalang ang alternatibo ay maaaring magbigay ng mas tahasang reflexive na kahulugang hindi kinakailangang resolbahin ng anyong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayo/inyong” para sa maramihang kausap at iniwasan ang arkaikong “larawang inanyuan” o “imaheng nililok.”
