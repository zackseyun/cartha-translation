base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: tl
  text: Kapag nasa kagipitan ka at sumapit sa iyo ang lahat ng bagay na ito, sa mga huling araw[a] ay babalik ka kay Yahweh na iyong Diyos at makikinig sa kanyang tinig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga araw na darating.” Ang pariralang Hebreo na “sa mga huling araw” ay maaaring tumukoy nang malawak sa isang panahon sa hinaharap at hindi kailangang limitahan sa isang tiyak na pananaw tungkol sa wakas ng panahon.
    reason: alternative_reading
  - marker: b
    text: Ang “makikinig sa kanyang tinig” ay maaari ring isaling “susunod sa kanyang tinig,” sapagkat ang pananalitang Hebreo ay madalas na may diwa ng pakikinig na may pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: Kapag nasa kagipitan ka
  rationale: Ipinahahayag ng pariralang Hebreo ang kalagayan ng taong nasa matinding hirap. Likas sa Tagalog ang temporal na “Kapag” para sa pambungad na sugnay na walang tahasang pandiwa.
- source_word: וּמְצָאוּךָ כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: at sumapit sa iyo ang lahat ng bagay na ito
  rationale: Bagaman ang מָצָא ay literal na “makatagpo,” kapag mga pangyayari o kapahamakan ang simuno, malinaw at natural ang “sumapit sa iyo.” Ang דְּבָרִים ay tumutukoy rito sa mga pangyayaring naunang ibinabala, kaya “mga bagay” ang pinili.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: sa mga huling araw
  rationale: Pinananatili nito ang kinikilalang idyomang Hebreo at ang teolohikal na bigat nito, habang nililinaw sa talababa na maaari rin itong tumukoy nang malawak sa panahong darating.
- source_word: וְשַׁבְתָּ עַד
  choice: ay babalik ka kay
  rationale: Ang שׁוּב na may עַד ay nagsasaad ng pagbabalik o muling pagharap sa isang tao. Hindi ginamit ang “magsisisi” upang hindi magdagdag ng kahulugang hindi tahasang nasa pandiwa.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang יהוה bilang “Yahweh” at ang pang-isahang tipanang pagtukoy ng “iyong Diyos.”
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: at makikinig sa kanyang tinig
  rationale: Pinananatili ng “makikinig sa kanyang tinig” ang larawang pandinig ng Hebreo, samantalang ang madalas na kaakibat na diwa ng pagsunod ay inilalahad sa talababa.
theological_decisions:
- issue: Posibleng labis na eskatolohikal na pagbasa sa בְּאַחֲרִית הַיָּמִים
  choice: sa mga huling araw
  alternative: sa mga araw na darating
  rationale: Maaaring tumukoy ang parirala sa hinaharap sa pangkalahatan at hindi kinakailangang sa isang tiyak na sistemang pangwakas na panahon. Pinananatili ng salin ang idyoma at ang tunay na lawak ng kahulugan nito.
- issue: Tipanang pagbabalik sa וְשַׁבְתָּ עַד יְהוָה
  choice: babalik ka kay Yahweh
  alternative: magsisisi ka at manunumbalik kay Yahweh
  rationale: Ipinahihiwatig ng konteksto ang tipanang pagbabalik, ngunit hindi idinagdag ang tahasang terminong “magsisisi,” na higit na interpretatibo kaysa sa payak na pandiwang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pang-isahang “ka/iyong” ayon sa Hebreo. Ang “kagipitan,” “sumapit,” at “makikinig sa kanyang tinig” ay natural ngunit nagpapanatili ng anyo at mga larawang nasa pinagmulang teksto.
