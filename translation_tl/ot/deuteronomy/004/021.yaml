  text: וַֽ/יהוָ֥ה הִתְאַנֶּף בִּ֖/י עַל דִּבְרֵי/כֶ֑ם וַ/יִּשָּׁבַ֗ע לְ/בִלְתִּ֤י עָבְרִ/י֙ אֶת הַ/יַּרְדֵּ֔ן וּ/לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: tl
  text: At nagalit sa akin si Yahweh dahil sa mga sinabi ninyo[a], at sumumpa siyang hindi ako tatawid sa Jordan ni makakapasok sa mabuting lupaing ibinibigay sa inyo ni Yahweh na inyong Diyos bilang mana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “dahil sa inyo.” Sa literal, “dahil sa mga salita ninyo.”
    reason: Ipinakikita ang posibleng idyomatikong pagbasa habang pinananatili sa pangunahing teksto ang tahasang leksikal na anyo ng Hebreo.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos ayon sa Hebreo at sa pamantayan ng proyekto.
- source_word: הִתְאַנֶּף בִּי
  choice: nagalit sa akin
  rationale: Likas at malinaw na Filipino para sa pandiwang nagsasaad ng matinding galit, nang hindi pinalalabis ang lakas nito.
- source_word: עַל דִּבְרֵיכֶם
  choice: dahil sa mga sinabi ninyo
  rationale: Pinananatili ang tahasang diwa ng דִּבְרֵי, ‘mga salita,’ habang gumagamit ng natural na pariralang Filipino.
- source_word: וַיִּשָּׁבַע
  choice: sumumpa siya
  rationale: Tuwirang salin ng panunumpa o pagbibigay ng taimtim na sumpa.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: hindi ako tatawid sa Jordan
  rationale: Malinaw na ipinahahayag ang nilalaman ng sumpa at ang pagkakait kay Moises ng pagtawid.
- source_word: וּלְבִלְתִּי בֹא
  choice: ni makakapasok
  rationale: Ang ‘ni’ ay natural na nag-uugnay sa ikalawang ipinagkait na kilos sa naunang negatibong pahayag.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: mabuting lupain
  rationale: Tuwirang pinananatili ang pagpapahalagang nasa טוֹבָה nang hindi nililimitahan ito sa pagiging mataba o kaaya-aya lamang.
- source_word: נֹתֵן לְךָ
  choice: ibinibigay sa inyo
  rationale: Ang aspektong nagaganap ng pandiwaring Hebreo ay natural na naihahayag ng ‘ibinibigay.’ Ang isahang ‘iyo’ sa Hebreo ay kolektibong tumutukoy sa Israel, kaya natural ang ‘inyo’ sa Filipino.
- source_word: נַחֲלָה
  choice: bilang mana
  rationale: Pinananatili ang diwa ng lupa bilang minanang bahagi o kaloob sa tipan.
theological_decisions:
- issue: Ang pagkakait kay Moises na makapasok sa lupain ay iniuugnay sa pananalita ng Israel.
  choice: dahil sa mga sinabi ninyo
  alternative: dahil sa inyo
  rationale: Tahasan sa Hebreo ang ‘mga salita ninyo.’ Pinananatili ito upang hindi palawakin o lutasin ang pananagutan nang higit sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘lupain’ para sa covenantal na teritoryo at ang ‘mana’ para sa נַחֲלָה. Ang panghalip na maramihang ‘ninyo/inyo’ ay natural na tumutukoy sa buong Israel.
