base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: tl
  text: At dahil minahal niya ang iyong mga ninuno at pinili ang kanilang mga supling pagkaraan nila[a], inilabas ka niya mula sa Ehipto sa pamamagitan ng kanyang presensya[b] at ng kanyang dakilang kapangyarihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanyang supling pagkaraan niya.” Isahan ang mga hulapi sa Hebreo, malamang na itinuturing na isang kolektibong pangkat ang “iyong mga ninuno.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa pamamagitan ng kanyang mukha” o “sa harap niya”; ipinahihiwatig dito ng parirala ang mismong presensya ng Diyos sa paglalabas sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: At dahil
  rationale: Ipinapahayag ng idyoma ang dahilan ng naunang pahayag; natural at malinaw sa modernong Tagalog ang “At dahil.”
- source_word: אָהַב
  choice: minahal
  rationale: Tuwirang katumbas ito ng pandiwang Hebreo at hindi nagdaragdag ng di-hayag na diin.
- source_word: אֲבֹתֶיךָ
  choice: iyong mga ninuno
  rationale: Bagaman literal na “iyong mga ama,” mas natural sa Tagalog ang “mga ninuno” para sa mga patriarka at hindi ito mapagkakamalang tumutukoy sa mga agarang ama lamang.
- source_word: וַיִּבְחַר
  choice: pinili
  rationale: Karaniwan at malinaw na salin ito ng בחר, nang hindi ginagawang teknikal na terminong teolohikal.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: ang kanilang lahi na sumunod sa kanila
  rationale: Pinananatili ng “lahi” ang kolektibong diwa ng זרע. Ginamit ang pangmaramihang panghalip ayon sa kolektibong tinutukoy na “mga ninuno,” habang itinatala sa talababa ang literal na anyong isahan.
- source_word: וַיּוֹצִאֲךָ
  choice: inilabas ka niya
  rationale: Tuwirang ipinapahayag nito ang causative na diwa ng pandiwa at ang karaniwang pananalita tungkol sa paglabas mula sa Ehipto.
- source_word: בְּפָנָיו
  choice: sa pamamagitan ng kanyang presensya
  rationale: Literal itong may diwang “sa pamamagitan ng kanyang mukha” o “sa harap niya,” ngunit sa konteksto ay tumutukoy sa mismong presensya ng Diyos sa pagliligtas.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: ng kanyang dakilang kapangyarihan
  rationale: Natural na Tagalog ito para sa instrumentong gamit sa pagliligtas at tuwirang pinananatili ang “dakila” at “kapangyarihan.”
- source_word: מִמִּצְרָיִם
  choice: mula sa Ehipto
  rationale: Likas na Tagalog ang “mula sa Ehipto” kasunod ng “inilabas.”
theological_decisions:
- issue: Mga isahang hulapi sa “kanyang lahi na sumunod sa kanya”
  choice: ang kanilang lahi na sumunod sa kanila
  alternative: ang kanyang lahi na sumunod sa kanya
  rationale: Isahan ang anyong Hebreo, ngunit ang tinutukoy nito ay malamang na ang kolektibong “iyong mga ninuno.” Nililinaw ng pangmaramihang Tagalog ang konteksto nang hindi itinatago ang literal na anyo, na nakasaad sa talababa.
- issue: Kahulugan ng בְּפָנָיו
  choice: sa pamamagitan ng kanyang presensya
  alternative: sa harap niya; sa pamamagitan ng kanyang mukha
  rationale: Pinananatili ng “presensya” ang diwang ang Diyos mismo ang kumilos sa paglabas, samantalang magiging malabo o di-likas sa Tagalog ang literal na “mukha.” Itinatala sa talababa ang literal na mga posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” upang malinaw ang ancestral na sanggunian, at “lahi” upang mapanatili ang kolektibong diwa ng זרע.
