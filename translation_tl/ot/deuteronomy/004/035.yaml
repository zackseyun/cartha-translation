  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: tl
  text: Ipinakita sa iyo ang mga bagay na ito upang malaman mong si Yahweh—siya ang Diyos; wala nang iba maliban sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: Ipinakita sa iyo
  rationale: 'Ang Hophal na anyo ng ראה ay causative-passive: ang Israel ay pinakitahan o binigyang makakita, hindi basta nakakita sa sarili nito. Natural sa Tagalog ang konstruksiyong “ipinakita sa iyo.”'
- source_word: לָדַעַת
  choice: upang malaman mo
  rationale: Ang infinitive construct na may ל ay nagpapahayag dito ng layunin o nilalayong resulta.
- source_word: כִּי
  choice: -ng
  rationale: Ipinakikilala nito ang nilalaman ng dapat malaman; sa Tagalog, likas itong ipinapahayag ng pang-angkop sa “malaman mong.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הוּא
  choice: siya
  rationale: Pinananatili ang nagsasariling panghalip upang maihatid ang diin ng Hebreong “Yahweh—siya ang Diyos,” nang hindi idinaragdag ang kahulugang “siya lamang” sa sugnay na ito.
- source_word: הָאֱלֹהִים
  choice: ang Diyos
  rationale: Ang may-artikulong anyo ay kumikilala kay Yahweh bilang Diyos; natural at malinaw sa Tagalog ang panaguring “ang Diyos.”
- source_word: אֵין עוֹד
  choice: wala nang iba
  rationale: Malinaw nitong pinananatili ang pagtanggi na may iba pang Diyos.
- source_word: מִלְבַדּוֹ
  choice: maliban sa kanya
  rationale: Tumpak at likas itong nagpapahayag ng pagbubukod na nasa pariralang Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Lakas ng pahayag na walang ibang Diyos
  choice: wala nang iba maliban sa kanya
  alternative: wala nang iba bukod sa kanya
  rationale: Pinananatili nito ang eksklusibong pahayag ng Hebreo nang walang idinaragdag na pilosopikal o denominasyonal na pagpapaliwanag.
- issue: Diin ng הוּא
  choice: Yahweh—siya ang Diyos
  alternative: Si Yahweh ang Diyos
  rationale: Ang hayag na “siya” ay nagpapanatili sa emfatikong panghalip ng Hebreo; hindi ito pinalalawak bilang “siya lamang,” sapagkat ang kasunod na sugnay ang tahasang naghahayag ng pagiging bukod-tangi.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang gitling na em dash upang natural na maipakita ang diin ng nagsasariling panghalip sa Hebreo. Hindi kailangan ang talababa sapagkat naipapakita mismo ng teksto ang passive na diwa at ang emfatikong panghalip.
