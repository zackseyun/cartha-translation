revisions:
- from: At mag-ingat ka, baka tumingala ka sa langit at makita mo ang araw, ang buwan, at ang mga bituin—ang buong hukbo ng langit—at mailigaw ka upang yumukod sa mga iyon at paglingkuran ang mga iyon, na ibinahagi[a] ni Yahweh na iyong Diyos sa lahat ng mga bayan sa ilalim ng buong kalangitan.[b]
  to: At mag-ingat ka, baka tumingala ka sa langit at makita mo ang araw, ang buwan, at ang mga bituin—ang buong hukbo ng langit—at mahikayat kang yumukod sa mga iyon at paglingkuran ang mga iyon, na inilaan[a] ni Yahweh na iyong Diyos para sa lahat ng mga bayan sa ilalim ng buong kalangitan.[b]
  rationale: Bahagyang inayos ang dalawang parirala upang maging mas natural ang modernong Tagalog at mas malinaw na maipakita ang pagkakasunod ng babala sa Hebreo. Hindi pinalawak ang pahayag tungkol sa paglalaan ng mga katawang-makalangit upang hindi ipahiwatig ang pagsang-ayon sa kanilang pagsamba o ang isang interpretasyong hindi tahasang sinasabi ng teksto.
