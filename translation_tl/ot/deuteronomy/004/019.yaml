  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: tl
  text: At mag-ingat ka, baka tumingala ka sa langit at makita mo ang araw, ang buwan, at ang mga bituin—ang buong hukbo ng langit—at mahikayat kang yumukod sa mga iyon at paglingkuran ang mga iyon, na inilaan[a] ni Yahweh na iyong Diyos para sa lahat ng mga bayan sa ilalim ng buong kalangitan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinalaga,” “ibinahagi,” o “hinati-hati.” Sinasabi ng Hebreo na inilaan ni Yahweh ang mga ito para sa lahat ng mga bayan; hindi mismo sinasabi ng pananalita na sinang-ayunan niya ang pagsamba sa mga ito.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa ilalim ng lahat ng kalangitan,” isang idyomang nangangahulugang “sa ilalim ng buong kalangitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: At mag-ingat ka, baka
  rationale: Ipinahahayag nito ang babala laban sa isang posibleng kahihinatnan sa natural na modernong Tagalog.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: tumingala ka sa langit
  rationale: Natural na katumbas sa Tagalog ng idyomang literal na 'itaas ang iyong mga mata patungo sa langit.'
- source_word: הַשֶּׁמֶשׁ ... הַיָּרֵחַ ... הַכּוֹכָבִים
  choice: ang araw, ang buwan, at ang mga bituin
  rationale: Tuwirang salin ng tatlong uring binanggit na bagay sa kalangitan.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: ang buong hukbo ng langit
  rationale: Pinananatili ng 'hukbo' ang larawan ng צבא bilang organisadong kalipunan; sa konteksto, tumutukoy ito sa kabuuan ng mga bagay sa kalangitan, hindi kinakailangang sa mga anghel.
- source_word: וְנִדַּחְתָּ
  choice: mailigaw ka
  rationale: Ipinakikita ng anyong pasibo ang pagkalihis o pagkahila tungo sa pagsamba sa diyus-diyosan nang hindi ipinahihiwatig ang ganap na pamimilit.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: yumukod sa mga iyon
  rationale: Pinananatili ang kongkretong kilos ng pagpapatirapa o pagyukod, na kasama ng kasunod na paglilingkod ay malinaw na tumutukoy sa pagsamba.
- source_word: וַעֲבַדְתָּם
  choice: paglingkuran ang mga iyon
  rationale: Pinananatili ang saligang kahulugan na 'maglingkod'; sa kontekstong panrelihiyon, ang paglilingkod na ito ay pagsamba.
- source_word: אֲשֶׁר חָלַק
  choice: na ibinahagi
  rationale: Ang חלק ay maaaring mangahulugang hatiin, ibahagi, o italaga. Ang 'ibinahagi' ay nagpapanatili sa distributibong pahayag nang hindi ipinapasok na sinang-ayunan ng Diyos ang pagsamba sa mga ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Natural at tumpak na anyo para sa tuwirang pakikipag-usap sa isahan.
- source_word: לְכֹל הָעַמִּים
  choice: sa lahat ng mga bayan
  rationale: Ang 'mga bayan' ay tumutukoy sa sari-saring pangkat ng mga tao at hindi nag-aangkat ng makabagong konsepto ng bansang-estado.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: sa ilalim ng buong kalangitan
  rationale: Natural na Tagalog para sa idyomang Hebreo habang pinananatili ang lawak ng pahayag.
theological_decisions:
- issue: Kahulugan ng pahayag na ibinahagi ni Yahweh ang mga bagay sa langit sa lahat ng mga bayan
  choice: Pinanatili ang pahayag ng pagbabahagi o paglalaan nang hindi sinasabing pinahintulutan ng Diyos ang pagsamba sa mga bagay sa langit.
  alternative: Maaaring unawain na inilaan ang mga ito para sa pangkalahatang gamit ng mga bayan, o na ibinigay ang mga bayan sa gayong pagsamba bilang paghatol.
  rationale: Sinusuportahan ng חלק ang pagbabahagi o paglalaan, ngunit hindi tahasang nililinaw ng sugnay ang eksaktong paraan nito. Dahil pagbabawal sa idolatriya ang konteksto, hindi dapat palawakin ng salin ang teksto upang magpahiwatig ng pagsang-ayon sa pagsamba o ng isang ganap na nabuo nang motibo ng paghatol.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang isahang 'ka/iyong' ayon sa Hebreo. Ang 'mga iyon' ay mas natural kaysa 'sila' para sa araw, buwan, at mga bituin. Pinanatili ang 'hukbo ng langit' upang maingatan ang larawan ng orihinal.
