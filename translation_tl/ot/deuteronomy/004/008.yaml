  to: At anong dakilang bansa ang may mga tuntunin at mga kahatulang kasingmakatarungan ng buong Kautusang ito na inihaharap ko sa inyo ngayon?[a]
  rationale: Pinalinaw ang sintaks ng paghahambing upang maipakita na ang pagiging makatarungan ng mga tuntunin at kahatulan ang itinutulad sa buong Kautusan. Pinalitan din ang “inilalahad” ng “inihaharap,” na likas na naghahatid ng diwa ng paglalagay sa harap ng mga tagapakinig. Walang binagong kahulugan o doctrinal na pagbasa.
