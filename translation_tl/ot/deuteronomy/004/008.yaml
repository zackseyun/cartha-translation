    issue: Hindi ganap na malinaw ang saklaw ng paghahambing sa “makatarungan gaya ng buong Kautusang ito.”
    rationale: Ang כְּכֹל ay naghahambing sa mga tuntunin at kahatulan bilang matuwid/makatarungan sa buong Kautusang inihaharap. Nililinaw ito ng “kasingmakatarungan ng” nang hindi nagdadagdag ng kahulugan.
