id: DEU.4.8
reference: Deuteronomy 4:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר ל֛/וֹ חֻקִּ֥ים וּ/מִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּ/כֹל֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: tl
  text: At anong dakilang bansa ang may mga tuntunin at mga kahatulang kasingmakatarungan ng buong Kautusang ito na inihaharap ko sa inyo ngayon?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “tagubilin” sa halip na “Kautusan” (Hebreo: torah), bagaman partikular na legal ang konteksto rito: “mga tuntunin at mga kahatulan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: At anong ... ang
  rationale: Ipinahahayag ang retorikal na tanong sa likas na ayos ng modernong Tagalog; dahil kasunod ang גּוֹי, ang diwa ay “anong bansa,” hindi pagtatanong sa isang tao.
- source_word: גּוֹי גָּדוֹל
  choice: dakilang bansa
  rationale: Ang גּוֹי ay tumutukoy sa isang bayan o bansang sama-samang itinuturing; pinananatili ng “dakilang bansa” ang paghahambing sa ibang mga bansa.
- source_word: חֻקִּים
  choice: mga tuntunin
  rationale: Ang salita ay tumutukoy sa mga itinakdang alituntunin o batas; malinaw at marangal sa kasalukuyang Tagalog ang “mga tuntunin.”
- source_word: וּמִשְׁפָּטִים
  choice: mga kahatulan
  rationale: Pinananatili ng “mga kahatulan” ang legal at hudisyal na kulay ng מִשְׁפָּטִים at naihihiwalay ito sa חֻקִּים.
- source_word: צַדִּיקִם
  choice: makatarungan
  rationale: Ipinahahayag nito na ang mga tuntunin at kahatulan ay naaayon sa tama at katarungan; natural itong Tagalog sa legal at moral na konteksto.
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: gaya ng buong Kautusang ito
  rationale: Comparative ang כְּ, at ang כֹּל ay tumutukoy sa kabuuan. Ang “Kautusan” ang pinakamalinaw sa agarang legal na konteksto, habang ang mas malawak na diwang “tagubilin” ay inilalagay sa talababa.
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: inilalahad ko sa inyo
  rationale: Ang literal na “ibinibigay sa harap ninyo” ay isang idyoma ng paghaharap o paglalahad; “inilalahad” ang likas at malinaw na katumbas sa Tagalog.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na modernong Tagalog ito para sa temporal na diin ng “sa araw na ito.”
theological_decisions:
- issue: Pagbibigay-kahulugan sa תּוֹרָה
  choice: Kautusan
  alternative: tagubilin
  rationale: Bagaman maaaring mangahulugan ang תּוֹרָה ng mas malawak na “tagubilin,” partikular na legal ang agarang konteksto dahil binabanggit ang mga tuntunin at kahatulan. Pinananatili sa talababa ang tunay na alternatibong leksikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Kautusan” bilang kinikilalang terminong biblikal ngunit iniwasan ang lipas o labis na teknikal na pananalita. Nasa pangunahing teksto ang marker na [a].
