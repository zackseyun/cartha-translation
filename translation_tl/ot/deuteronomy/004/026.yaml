source:
  edition: WLC
  text: הַעִידֹתִי֩ בָ/כֶ֨ם הַ/יּ֜וֹם אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ כִּֽי אָבֹ֣ד תֹּאבֵדוּ/ן֮ מַהֵר֒ מֵ/עַ֣ל הָ/אָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ לֹֽא תַאֲרִיכֻ֤/ן יָמִים֙ עָלֶ֔י/הָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּ/ן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: tl
  text: 'Tinatawag ko ngayon ang langit at lupa upang maging mga saksi laban sa inyo[a]: tiyak na mabilis kayong mapapawi mula sa lupain na papasukan ninyo sa pagtawid sa Jordan upang ariin. Hindi kayo magtatagal doon[b], sapagkat tiyak na lilipulin kayo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ginagawa kong mga saksi laban sa inyo ngayon ang langit at lupa.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Hindi ninyo pahahabain ang inyong mga araw roon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: Tinatawag ko ... bilang mga saksi laban sa inyo
  rationale: Pinananatili nito ang legal na diwa ng Hiphil ng עוּד at ang adversatibong puwersa ng בָכֶם, sa natural na makabagong Tagalog.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural itong katumbas ng temporal na diin ng Hebrew na ‘sa araw na ito’ nang hindi nagiging makaluma.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ang langit at lupa
  rationale: Ito ang likas na pormula sa Tagalog para sa pares na tumutukoy sa buong sangnilikha; hindi kailangang tularan ang morpolohikal na maramihan ng Hebrew na שָׁמַיִם.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: tiyak na mapapawi kayo
  rationale: Ipinahahayag ng ‘tiyak’ ang diin ng infinitive absolute kasunod ng finite verb. Ang ‘mapapawi’ ay angkop sa pagkawala nila mula sa lupain at hindi ipinapantay agad sa ikalawang pandiwang tumutukoy sa pagkalipol.
- source_word: מַהֵר
  choice: kaagad
  rationale: Malinaw at natural nitong ipinapahayag ang bilis o nalalapit na katuparan ng bantang pagkapawi.
- source_word: מֵעַל הָאָרֶץ
  choice: mula sa lupain
  rationale: Natural sa Tagalog ang ‘mula sa lupain’ para sa pag-aalis o pagkawala mula roon.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: lupaing tatawirin ninyo ang Jordan upang ariin
  rationale: Ipinakikita ng sugnay na ang lupain ang patutunguhan ng pagtawid sa Jordan. Ang ‘ariin’ ay nagpapanatili sa diwa ng ירשׁ sa konteksto ng lupaing tipan.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: Hindi kayo magtatagal doon
  rationale: Natural na idyoma ito sa Tagalog para sa literal na ‘hindi ninyo pahahabain ang inyong mga araw roon,’ habang pinananatili ang kahulugan.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: tiyak na lilipulin kayo
  rationale: Ang ‘tiyak’ ay kumakatawan sa emphatic construction, at ang pasibong ‘lilipulin’ ay nagpapanatili sa Niphal nang hindi tinutukoy ang tagaganap na hindi tahasang binanggit sa talata.
theological_decisions:
- issue: Pormula ng mga saksi sa tipan na kinabibilangan ng langit at lupa
  choice: Isinalin bilang legal na pagtawag sa langit at lupa na maging mga saksi laban sa Israel
  alternative: Mas maluwag na ‘Binabalaan ko kayo ngayon sa harap ng langit at lupa’
  rationale: Ang Hebrew ay gumagamit ng wikang kahawig ng paglilitis sa tipan. Pinananatili ng salin ang juridikal na puwersa nang hindi nagdaragdag ng teolohiyang wala sa teksto.
- issue: Saklaw ng banta ng pagkapawi at pagkalipol
  choice: 'Pinanatili ang dalawang magkaugnay ngunit magkaibang pahayag: ‘mapapawi ... mula sa lupain’ at ‘lilipulin’'
  alternative: Pagsamahin ang dalawa bilang tahasang ganap na pagkalipol ng buong bayan
  rationale: Hindi nilulutas ng salin kung hanggang saan ang saklaw ng paghatol; iniiwasan nitong gawing mas absolutong ontolohikal ang banta kaysa sa ipinahihiwatig ng konteksto ng pagkawala mula sa lupain.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang ‘langit at lupa’ at ang natural na ‘magtagal doon,’ habang pinanatili sa pangunahing teksto ang legal na pormula, ang dobleng pagdidiin ng Hebrew, at ang pagkakaiba ng dalawang pandiwa ng paghatol.
