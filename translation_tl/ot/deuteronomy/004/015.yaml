base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: tl
  text: Kaya mag-ingat kayong mabuti[a], sapagkat wala kayong nakitang anumang anyo[b] noong araw na nagsalita si Yahweh sa inyo sa Horeb mula sa gitna ng apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ingatan ninyong lubos ang inyong sarili,” isang idyoma na nangangahulugang maging lubhang maingat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “anumang wangis” o “anumang larawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: Kaya mag-ingat kayong mabuti
  rationale: Ang parirala ay isang idyomang Hebreo na tumutukoy sa masusing pag-iingat sa sarili. Natural sa modernong Tagalog ang “mag-ingat kayong mabuti,” habang napapanatili ang tindi ng babala; ang וְ ay iniugnay sa naunang konteksto sa pamamagitan ng “Kaya.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng babala at malinaw na naghahayag ng ugnayang sanhi sa Tagalog.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: wala kayong nakitang anumang anyo
  rationale: Ang תְּמוּנָה ay maaaring mangahulugang anyo, wangis, o larawang nakikita. Ang “anyo” ay malawak at hindi agad nagpapakahulugang isang gawang rebulto o larawan.
- source_word: בְּיוֹם
  choice: nang araw na
  rationale: Pinananatili nito ang tahasang temporal na pahayag ng Hebreo at natural pa rin sa marangal na Tagalog.
- source_word: דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: magsalita sa inyo si Yahweh
  rationale: Tuwirang isinasalin ang pagkilos at ang direksiyong ipinahihiwatig ng אֶל; pinananatili rin ang personal na pangalang Yahweh.
- source_word: בְּחֹרֵב
  choice: sa Horeb
  rationale: Karaniwan at natural na panandang-lunan sa Tagalog para sa lugar ng pangyayari.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mula sa gitna ng apoy
  rationale: Pinananatili ang tiyak at matingkad na larawan ng pagsasalita mula sa kaloob-looban ng apoy.
theological_decisions:
- issue: Antropolohikal na diwa ng נֶפֶשׁ sa לְנַפְשֹׁתֵיכֶם
  choice: 'idyomatikong pagtukoy sa sarili: “mag-ingat kayo”'
  alternative: “ingatan ninyo ang inyong mga kaluluwa”
  rationale: Sa pariralang ito, ang נֶפֶשׁ ay bahagi ng idyoma ng masusing pag-iingat sa sarili, hindi tahasang pagtuturo tungkol sa pagkakahiwalay ng kaluluwa at katawan.
- issue: Kahulugan ng תְּמוּנָה sa pagpapakita sa Horeb
  choice: “anyo”
  alternative: “wangis” o “larawan”
  rationale: Binibigyang-diin ng talata na walang nakitang nakikitang anyo ng Yahweh. Hindi nito nililimitahan ang salita sa isang gawang imahen, bagaman iyon ang mahalagang implikasyon sa kasunod na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Yahweh” para sa יהוה. Iniwasan ang literal ngunit madaling mapagkamalang antropolohikal na “mga kaluluwa,” at pinanatili sa talababa ang saklaw ng kahulugan ng תְּמוּנָה.
