  text: כִּ֚י מִי ג֣וֹי גָּד֔וֹל אֲשֶׁר ל֥/וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑י/ו כַּ/יהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָּל קָרְאֵ֖/נוּ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: tl
  text: Sapagkat anong dakilang bansa ang may mga diyos na kasinglapit sa kanila gaya ni Yahweh na ating Diyos sa atin sa tuwing tumatawag tayo sa kanya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga diyos.” Retorikal na inihahambing ng talata ang mga diyos ng ibang mga bansa kay Yahweh, ang Diyos ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag kaugnay ng naunang pangangaral, kaya pinananatili ang puwersang pangangatwiran ng Hebreo.
- source_word: מִי גוֹי גָּדוֹל
  choice: anong dakilang bansa
  rationale: Likas na anyo ito ng retorikal na tanong sa Tagalog at tuwirang kumakatawan sa pariralang Hebreo.
- source_word: אֲשֶׁר לוֹ
  choice: ang may
  rationale: Ang literal na diwang 'na para rito ay mayroon' ay natural na ipinahahayag sa Tagalog bilang pag-aari o kaugnayan.
- source_word: אֱלֹהִים קְרֹבִים
  choice: mga diyos na napakalapit
  rationale: Sinusuportahan ng pangmaramihang pang-uring קְרֹבִים ang pangmaramihang 'mga diyos'; ipinahahayag ng 'napakalapit' ang mariing paghahambing.
- source_word: אֵלָיו
  choice: dito
  rationale: Ang panghalip ay tumutukoy sa bansa; ang 'dito' ay natural na Tagalog para sa pagiging malapit sa bansang tinutukoy.
- source_word: כַּיהוָה אֱלֹהֵינוּ
  choice: gaya ni Yahweh na ating Diyos
  rationale: Pinananatili ang paghahambing, ang personal na pangalang Yahweh, at ang isahang kahulugan ng 'ating Diyos.'
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: sa tuwing tumatawag tayo sa kanya
  rationale: Ang בְּכָל kasama ng infinitive construct ay nagsasaad ng paulit-ulit na kalagayan, 'sa tuwing'; pinananatili ng 'tumatawag ... sa kanya' ang maaaring diwa ng pagtawag, pananalangin, o paghingi ng tulong.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya transliterasyon ang ginamit sa halip na palitan ito ng titulo.
- issue: Kahulugan ng אֱלֹהִים sa unang sugnay
  choice: mga diyos
  alternative: Diyos; mga banal na nilalang
  rationale: Ang pangmaramihang קְרֹבִים at ang paghahambing kay Yahweh na Diyos ng Israel ay tumutukoy sa mga diyos ng ibang mga bansa, nang hindi pinagtitibay na tunay silang mga diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “bansa,” “mga diyos,” at “sa tuwing tumatawag tayo” bilang natural ngunit malapit-sa-pinagmulan na mga pahayag; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
