  to: Sapagkat anong dakilang bansa ang may mga diyos na kasinglapit sa kanila gaya ni Yahweh na ating Diyos sa atin sa tuwing tumatawag tayo sa kanya?[a]
  rationale: Pinalitan ang «na napakalapit dito» ng «na kasinglapit sa kanila» at idinagdag ang «sa atin» upang malinaw na maipakita ang paghahambing na nasa Hebreo. Ang «kanila» ay likas na tumutukoy sa mga tao ng bansang binabanggit sa retorikal na tanong. Hindi binago ang kahulugan, rehistro, pangalan ng Diyos, o footnote anchor.
