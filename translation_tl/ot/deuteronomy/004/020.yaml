revisions:
- from: Ngunit kinuha kayo ni Yahweh at inilabas niya kayo mula sa hurnong tunawan ng bakal[a], mula sa Ehipto, upang maging bayan na kanyang mana, gaya nga sa araw na ito.
  to: Ngunit kinuha kayo ni Yahweh at inilabas niya kayo mula sa hurnong tunawan ng bakal[a], mula sa Ehipto, upang maging kanyang bayang mana, tulad ng nangyayari ngayon.
  rationale: Pinalitan ang ayos ng pariralang “bayan na kanyang mana” ng “kanyang bayang mana” upang mas malinaw na ang bayan ang mana/pag-aari ni Yahweh, habang nananatiling malapit sa Hebreong “para sa kanya, isang bayang mana.” Ginawang “tulad ng nangyayari ngayon” ang pangwakas na idiom upang maging likas na modernong Filipino at mapanatili ang tinutukoy na kasalukuyang kalagayan.
