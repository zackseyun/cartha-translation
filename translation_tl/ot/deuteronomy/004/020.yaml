base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: tl
  text: Ngunit kinuha kayo ni Yahweh at inilabas niya kayo mula sa hurnong tunawan ng bakal[a], mula sa Ehipto, upang maging kanyang bayang mana, tulad ng nangyayari ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “hurnong tunawan ng bakal” ay larawan ng matinding paghihirap sa Ehipto. Ang “kanyang bayang mana” ay maaari ring isaling “sarili niyang bayan” o “bayang kanyang pag-aari.” Sa literal, “upang maging para sa kanya na isang bayang mana.”
    reason: Nililinaw ang metapora at inilalahad ang mga leksikal na posibilidad ng tipanang parirala nang hindi inaalis ang literal na larawang “mana.”
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos ayon sa Hebreo.
- source_word: לָקַח
  choice: kinuha
  rationale: Tuwirang ipinapahayag ang kilos ng pagkuha sa Israel nang hindi ito tahasang binibigyang-kahulugang ‘pinili’ o ‘inangkin.’
- source_word: וַיּוֹצִא
  choice: inilabas niya
  rationale: Likas na salin ng anyong causative ng יצא sa konteksto ng paglabas mula sa Ehipto.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: mula sa hurnong tunawan ng bakal
  rationale: Pinananatili ang matinding larawang-metapora ng Hebreo, habang nililinaw na ang כּוּר ay hurno o tunawan.
- source_word: מִמִּצְרָיִם
  choice: mula sa Ehipto
  rationale: Pinananatili ang ikalawang pariralang may ‘mula,’ na tumutukoy sa Ehipto bilang hurnong tunawan sa naunang larawan.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: upang maging bayan na kanyang mana
  rationale: Inihahayag ang pag-aari at tipanang ugnayan habang pinananatili ang natatanging salitang ‘mana’ sa halip na palitan ito ng mas interpretatibong ‘minamahal’ o ‘natatanging pag-aari.’
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya nga sa araw na ito
  rationale: Pinananatili ang Hebreong pormula na tumutukoy sa kasalukuyan at nakikitang kalagayan ng bayan.
theological_decisions:
- issue: Tipanang pag-aari sa pariralang לְעַם נַחֲלָה
  choice: bayan na kanyang mana
  alternative: sarili niyang bayan; bayang kanyang pag-aari
  rationale: Pinananatili ng salin ang teolohikal na bigat ng נַחֲלָה (‘mana’) at hindi nito pinapantay ang parirala sa mas pangkalahatang ideya lamang ng pag-aari.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘hurnong tunawan’ para sa malinaw at likas na paglalarawan, at pinanatili ang ‘mana’ upang hindi mawala ang tipanang tensiyon at partikularidad ng Hebreo.
