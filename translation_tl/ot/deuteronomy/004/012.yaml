base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: tl
  text: Pagkatapos, nagsalita sa inyo si Yahweh mula sa gitna ng apoy.[a] Narinig ninyo ang tunog ng mga salita,[b] ngunit wala kayong nakitang anyo[c]—tinig lamang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa loob ng apoy.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang tunog ng mga salita”; maaari ring “ang tunog ng pagsasalita.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “wangis,” “hugis,” o “kaanyuan.” Binibigyang-diin ng Hebreo na walang nakitang anumang anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos sa isang anyong karaniwang ginagamit sa makabagong salin at pag-aaral sa Bibliya.
- source_word: וַיְדַבֵּר
  choice: nagsalita
  rationale: Likas na katumbas ng pandiwang דבר at angkop sa pasalaysay na anyo ng Hebreo.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mula sa gitna ng apoy
  rationale: Pinananatili ang larawan ng tinig na nagmumula sa loob o kalagitnaan ng apoy, hindi lamang malapit dito.
- source_word: קוֹל דְּבָרִים
  choice: ang tunog ng mga salita
  rationale: Malapit sa literal na pagkakabuo na ‘tunog/tinig ng mga salita’ at ipinakikitang malinaw na pananalita, hindi basta ingay, ang narinig.
- source_word: שֹׁמְעִים
  choice: narinig ninyo
  rationale: Bagaman participle ang anyong Hebreo, nagsasaad ito rito ng nakaraang karanasan at natural na ipinahahayag sa Filipino sa aspektong perpektibo.
- source_word: תְמוּנָה
  choice: anyo
  rationale: Sinasaklaw ng ‘anyo’ ang nakikitang hugis o representasyon nang hindi nagdaragdag ng paliwanag na lampas sa teksto.
- source_word: אֵינְכֶם רֹאִים
  choice: wala kayong nakitang
  rationale: Natural na Filipino para sa tahasang kawalan ng anumang nakitang anyo at malinaw na kaagapay ng ‘narinig ninyo.’
- source_word: זוּלָתִי קוֹל
  choice: tinig lamang
  rationale: 'Ipinahahayag ang pagbubukod: walang nakitang anyo; tinig lamang ang naranasan. Ang ‘tinig’ ay mas natural dito kaysa ‘tunog’ dahil tumutukoy ito sa banal na pagsasalita.'
theological_decisions:
- issue: Antropomorpiko o representasyonal na wika tungkol sa pagpapakita ng Diyos
  choice: Pinanatili ang pagkakaiba sa pagitan ng narinig na kapahayagan at ng kawalan ng nakitang anyo.
  alternative: Narinig ninyo ang kanyang tinig ngunit wala kayong nakitang nakikitang representasyon.
  rationale: Ipinahahayag ng talata ang tunay na banal na pagsasalita nang walang nakitang anyo. Hindi ito pinalalawak tungo sa isang doktrinal na paliwanag tungkol sa mga larawan o sa kalikasan ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘ninyo’ upang ipakita ang maramihang kausap. Pinanatili ang bahagyang pormal na ‘tunog ng mga salita’ dahil mahalaga ang literal na pagkakabuo at ang paghahambing ng pandinig at paningin.
