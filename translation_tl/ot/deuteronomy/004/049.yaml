  yaml_path: translation/ot/deuteronomy/004/049.yaml
  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: tl
  text: at ang buong Araba sa kabila ng Jordan, sa silangan, hanggang sa Dagat ng Araba[a], sa ibaba ng mga dalisdis ng Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ito ang anyong-tubig na karaniwang kinikilalang Patay na Dagat.
    reason: cross_reference
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Pinanatili bilang pangalang heograpiko sa halip na gawing pangkalahatang “kapatagan,” sapagkat tumutukoy ito rito sa rehiyon ng lambak ng Jordan.
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: sa kabila ng Jordan
  rationale: Likas na pariralang Filipino na nagpapanatili sa relasyonal na pananaw ng Hebreo.
- source_word: מִזְרָחָה
  choice: sa silangan
  rationale: Malinaw at natural na pagtukoy sa dakong silangan.
- source_word: יָם הָעֲרָבָה
  choice: Dagat ng Araba
  rationale: Malapit sa anyo ng Hebreo at hindi agad pinapalitan ng mas huling karaniwang pangalang “Patay na Dagat”; inilagay ang pagkakakilanlan sa talababa.
- source_word: תַּחַת
  choice: sa ibaba ng
  rationale: Angkop sa topograpikong ugnayan ng dagat at mga dalisdis.
- source_word: אַשְׁדֹּת
  choice: mga dalisdis
  rationale: Ipinahahayag ang mga pababang bahagi o gilid ng bundok sa kontekstong heograpiko.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Isinalin sa karaniwang anyong ponolohiko sa Filipino ang pangalang pantangi.
- source_word: וְכָל
  choice: at ang buong
  rationale: Pinananatili ang pang-ugnay at ang saklaw na sumasaklaw sa kabuuan.
