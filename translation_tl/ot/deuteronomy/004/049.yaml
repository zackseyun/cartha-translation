  source_fidelity: 'Tumpak na naipapahayag ng salin ang saklaw na heograpiko: ang buong Araba sa kabilang panig ng Jordan, sa silangan, hanggang sa Dagat ng Araba, sa ibaba ng mga dalisdis ng Pisga. Napananatili ang pangalan ng rehiyon at ang literal na pagtukoy sa dagat, nang hindi ito pinapalitan sa mismong talata ng “Patay na Dagat.”'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “sa kabila ng Jordan, sa silangan” ay maayos na naghahatid ng relasyonal at direksiyonal na paglalarawan ng Hebreo. Ang antas ng wika ay angkop sa salaysay na pangkasulatan.
  terminology: Ang “Araba,” “Jordan,” “Dagat ng Araba,” at “Pisga” ay magkakatugma at angkop na mga pangalang heograpiko. Wasto ang “mga dalisdis” para sa אַשְׁדֹּת sa topograpikong konteksto. Ang talababa ay nagbibigay ng kapaki-pakinabang na pagkakakilanlan nang hindi pinapalitan ang tekstuwal na pangalan.
