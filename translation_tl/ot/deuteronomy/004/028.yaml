base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: tl
  text: At doon ay sasamba kayo sa mga diyos—mga gawa ng kamay ng tao, yari sa kahoy at bato—na hindi nakakakita, hindi nakaririnig, hindi kumakain, at hindi nakaaamoy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: sasamba kayo
  rationale: Ang עבד ay maaaring mangahulugang maglingkod, ngunit kapag mga diyos ang layon, likas sa modernong Tagalog ang “sumamba.” Ang aspektong magaganap ay angkop sa babala ni Moises.
- source_word: שָׁם
  choice: doon
  rationale: Tumutukoy ito sa mga lupaing patutunguhan nila sa pagkatapon ayon sa konteksto.
- source_word: אֱלֹהִים
  choice: mga diyos
  rationale: Pinananatili ang tuwirang leksikal na diwa; hindi ito agad ginawang “mga diyus-diyosan,” sapagkat ang kasunod na parirala mismo ang naglalarawan sa mga ito bilang likha ng tao.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: mga gawa ng kamay ng tao
  rationale: Malinaw at likas na salin ng pariralang tumutukoy sa mga bagay na ginawa ng tao. Generic ang אָדָם rito.
- source_word: עֵץ וָאֶבֶן
  choice: yari sa kahoy at bato
  rationale: Ang mga salita ay tumutukoy sa materyales ng mga diyos na ginawa ng tao; nilinaw ng “yari sa” ang ugnayan sa natural na Tagalog.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: na hindi nakakakita, nakakarinig, kumakain, o nakaaamoy
  rationale: Pinananatili ang tahasang negasyon ng Hebreo at ang apat na pandiwang pandama at pagkilos, nang hindi dinaragdagan ng modal na “hindi makakaya.”
- source_word: יְרִיחֻן
  choice: nakaaamoy
  rationale: Tuwirang tumutukoy sa pandamang pang-amoy at malinaw sa modernong Tagalog.
theological_decisions:
- issue: Kung isasalin ang אֱלֹהִים bilang “mga diyos” o “mga diyus-diyosan”
  choice: mga diyos
  alternative: mga diyus-diyosan
  rationale: Pinananatili ng “mga diyos” ang leksikal na anyo at ang retorikal na tensiyon; ang kasunod na paglalarawan bilang gawa ng kamay ng tao, kahoy, at bato ang hayagang naglalantad sa kanilang kabulaanan.
- issue: Kung ipahahayag bilang kawalan ng kakayahan o payak na negasyon ang mga pandiwa
  choice: hindi nakakakita, nakakarinig, kumakain, o nakaaamoy
  alternative: hindi makakita, makarinig, kumain, o makaamoy
  rationale: Ang Hebreo ay paulit-ulit na gumagamit ng לֹא at hindi ng tahasang modal na kawalan ng kakayahan. Ang payak na negasyon ay mas pormal at hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sasamba” sa halip na “maglilingkod” dahil mga diyos ang tuwirang layon. Ang mga gitling na em dash ay naghihiwalay sa paliwanag tungkol sa kalikasan ng mga diyos nang hindi binabago ang sintaktikong kaugnayan.
